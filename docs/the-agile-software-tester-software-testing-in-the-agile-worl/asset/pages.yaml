  md: '# Introduction


    Software development has changed dramatically over the past sixty or so years.
    In the early days of software development system memory was at a premium, coding
    was achieved in machine code and most programs were small and simple when compared
    to their modern counterparts. As a result, testing was considered a minor task
    for lesser mortals and a hindrance by most programmers.


    ![](img/9ad62c521b3df94dc74d517230e21e72_8_0.png)


    Gradually as software development tools evolved, we entered the era of the DOS
    program. These programmers used development tools such as C, Ada and Pascal to
    write their beloved programs. They still considered testing a hindrance and an
    insult to their skills. Therefore, they tried to avoid it at any cost. It was,
    of course, a job for lesser mortals. Most software companies spent as little investment
    as possible on testing and most bugs tended to be reported by end-users as systems
    crashed and burned around the globe.


    ![](img/9ad62c521b3df94dc74d517230e21e72_8_1.png)


    With the advent of Windows, a new level of complexity and confusion was added
    to the software mix. Suddenly not only did software development companies have
    to worry about their bugs but there were also the added concerns of just how stable
    the Windows operating systems were their clients were now using.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Windows and other GUI''s have evolved tremendously over the past decades, some
    versions have been much better than others, a prime example of a quickly dropped
    but never to be forgotten version will always be the infamous Windows ME. All
    these concerns have awoke most software houses to the real importance of high
    quality, technically adept, well-paid software testers (also known as QA''s).


    You see competent, well trained software QA''s will also have a basic understanding
    of at least one programming language. They will also be confident of Structured
    Query Language (SQL) and the bases of computer architecture. They will be very
    methodical in their approach to work and the need for patience, concentration
    and tolerance is also very high. Let''s face it, today good, high-quality, skilled
    programmers are everywhere, however, good talented software QA''s are still relatively
    few and far between.


    So important is software testing today that I will even go as far to say that
    talented software QA''s are a much more valuable asset than talented software
    developers. When I first made this statement, a few programmers refused to talk
    to me for a long time, still do not.


    Over the past twenty-five years, there has been a slow but sure change in software
    development strategies as users have come to accept web-based applications and
    now regard them as a normal part of their computing experience. No matter if it
    is leisure-based software such as Facebook or business related most modern applications
    are now either web based or have a web alternative to their more traditional windows-based
    versions.


    The richness and complexity of web software are also increasing, however, the
    more complex a program is the more likely it has somewhere in the tangle of code
    and the more important the testing role becomes. Some software developers get
    past the testing question by keeping their applications in a permanent Beta mode.
    This passes the testing mantle on to the actual end-user, who would seem, is happy
    to test the product as they use it, usually because the software is cheap or free.


    For serious, business applications this is certainly not a viable option. Applications
    that offer business-related solutions such as job management and online ordering
    also need to offer a high level of reliability and integrity'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'to maintain customer support and confidence and avoid litigation when the system
    falls apart at the seams. This is where the software QA bravely steps in and saves
    the day. Today customers quite correctly expect more for their money and are more
    likely to demand compensation when things go wrong. Therefore, software houses
    now need to be more aware of the testing role.


    As I have already said today the world is awash with good software programmers.
    Let it face dear readers they are everywhere. Simply look under any mouse mat
    and a dozen skilled programmers will appear demanding extra strong coffee and
    a connection to World of Warcraft. The same cannot yet be said for good software
    QA''s, not yet that is.


    A programmer''s aim in life is to construct what they will always consider being
    a flawless work of art. To them, their code is a perfect masterpiece and the best
    to be found anywhere on the planet, and why not, that is where their skills are.
    Meanwhile, a QA will do his or her best to detect and highlight any errors in
    the code and the logical way it works, and why not, it is after all that they
    are paid to do. Despite what some people think good QA''s do not do this to simply
    annoy and anger the programmers. Rather it is a serious attempt to capture as
    many bugs as possible before the product falls into the hands of the poor unsuspecting
    customer.


    Therefore, the QA role is as important as any other member of the development
    team. So, let us look at the foundations of software testing and get an idea of
    where it all started back in the early days of software development.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Foundations of Testing


    Today software is everywhere and in everything. It is now an integral part of
    human life. Software control’s many aspects of day-to-day life from Traffic lights
    to the humble washing machine and down to the little smartwatch strapped to your
    wrist. No matter who you are or what you do and where you are today you will never
    be de far from the humble little microchip. Like it or they do not control modern
    life and they control us.


    All these systems must be conceived, designed, coded (hopefully) tested to a very
    high standard; that is after all the software lifecycle in its most basic form.
    The software is designed and coded by human beings who will will by their very
    nature make mistakes and get things wrong, no one is perfect, not even programmers
    (however only say that in front of them if you are feeling very brave or they
    are asleep).


    Over the years there have been some spectacular software failures, some of which
    you may have heard of already, others may be new to you. On the following pages
    are just a few classic well-known examples of what an extremely long and tragic
    list is now.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# The Ashley Madison Hack (2015) - Ashley Madison, the online dating site,
    which helped married people cheat on their partners, was hacked. Much to the delight
    of some people and horror of some others, the hackers published the real names,
    email addresses and personal details of the dating site’s users. The cost of this
    action was 2 lives, countless marriages, a £400 million class action suit, various
    extortion attempts, the company’s reputation and the loss of their CEO.


    # Royal Bank of Scotland (2009) - The Royal Bank of Scotland experienced a fault
    on cyber-Monday that left its account holders unable to withdraw cash or make
    payments. In a public statement, the CEO of RBS admitted that the fault was unacceptable
    and it was caused by the failure of RBS to invest in IT for decades. The problem
    left many Christmas shoppers unable to buy or pay for their purchases, which further
    hurt online retailers. As a result, all RBS customers were unable to access their
    money for a day.


    # The Toyota Recall (2009) - There have been three separate recalls by Toyota
    since 2009, and amazingly all the recalls have been related to the same thing,
    that the accelerator sticking. First, in August 2009 a Lexus ES350 suddenly accelerated
    out of control at speeds to exceed 100 mph. One of the passengers called 911 before
    they crashed and reported that the car had "no brakes." Sadly, all four passengers
    were killed when the car crashed. Next, in November 2009, Toyota dealers were
    instructed to remove and shorten the gas pedals and update the onboard computers
    with a new program that would override the electronic gas pedal'
