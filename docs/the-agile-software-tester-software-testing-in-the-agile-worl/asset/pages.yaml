    of complexity in software and associated hardware also increases. As the level
    of risk increases so does the chance of failure and litigation if things go drastically
    wrong. To summarise this


    +   - The ever-increasing complexity of systems being built or modified.

    - The need to integrate new systems and technologies with legacy systems.

    - Reduced timescales for delivery resulting in a reduction of testing.

    - Internet-based solutions must now cater to a global market.


    These pressures have given rise to the need to streamline the delivery cycle to
    provide greater flexibility and the ability to embrace change. These methods are
    now collectively called Agile Methods. The level of agile usage has increased
    greatly over the past decade. This is driven primarily by:


    +   - The desire for faster (and therefore cheaper) time to market.

    - A view that traditional methods are too process heavy, expensive and wasteful.'
