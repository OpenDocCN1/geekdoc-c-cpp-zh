    to come up with an effective alternative to Waterfall. RAD, or Rapid Application
    Development, relied on building prototypes to allow requirements to emerge and
    elicit frequent feedback.


    Despite the improved methods RAD still managed to get a bad name; however, this
    was down to bad planning and implementation on some major, high profile projects
