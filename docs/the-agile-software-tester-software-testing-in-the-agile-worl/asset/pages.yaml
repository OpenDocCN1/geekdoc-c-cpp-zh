  md: '# White Box Testing


    White box testing can also be known as clear box testing, transparent box testing
    and glass box testing. White box testing is a software testing approach, which
    intends to test software with knowledge of the internal code and intended working
    of the software.


    Typically, the white box testing approach is used in Unit testing which is usually
    performed by software developers. White box testing intends to execute code and
    test statements, branches, path, decisions and data flow within the program being
    tested. White box testing and Black box testing complement each other as each
    of the testing approaches has the potential to uncover a specific category of
    errors. Common types of white box testing are discussed next.'
  merge: -1
