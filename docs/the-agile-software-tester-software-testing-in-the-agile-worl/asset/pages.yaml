  md: '# API Testing


    API Testing is a type of testing that is like unit testing. Each of the Software
    APIs is tested as per the API specification. API testing is mostly done by the
    test team unless APIs to be tested is very complex and needs extensive coding.
    API testing requires understanding both the API functionality and possessing good
    coding skills.


    So, you may ask, what is an API? Well API is short for application programming
    interface, which is a bit of a mouthful so let us stick with API. So, an API is
    a set of programming instructions and defined standards for accessing a Web-based
    software application orb a Web tool. Typically, a software company will release
    its API to the public so that software developers can design new products that
    are powered by or use of its service.


    A very good example of this is when Amazon.com released its API so that Web site
    developers could easily access Amazon''s product information databases. Using
    the Amazon API, a third-party Web site can easily post direct links to Amazon
    products with updated prices and specific options such as "buy now".


    # Branch Testing


    Branch Testing is a white box testing method for designing test cases to test
    code for every branching condition. The branch testing method is typically applied
    to a unit testing phase.


    Component Testing is a type of software test that is performed by developers.
    Component testing is carried out after completing unit testing. Component testing
    involves testing a group of units as code together as a whole rather than testing
    individual functions, methods.'
