  md: '# The Testers Mindset


    Most people can test software at a very basic level. After all, anyone should
    be able to click buttons, look at web pages, input text, check spelling and press
    [Save]. However, being able to test software proficiently over many years at an
    expert level requires a very special type of mind-set. Let’s honest here not everyone
    has this ability, and there is no shame in this, not everyone can race cars, run
    a marathon or fly an aeroplane either. A software QA does and have a very different
    mindset to that of a software programmer and while both do not always well their
    interaction and cooperation within a development team is crucial in the agile
    world. Some programmers can test their own code and indeed all programmers should
    test at a unit level before sending updates out into the test cycle. However,
    separation of this responsibility to a professional, well trained QA is typically
    done to focus effort and provide additional benefits, such as an independent perspective
    by trained and professional testing resources. Independent testing can and be
    carried out at every level of testing.


    A certain degree of independence (also known as avoiding the author bias or programmer
    arrogance) often makes the QA more effective at finding defects and failures in
    candidate release code. Independence is not, however, a replacement for familiarity
    and the best QA’s are often those who are familiar with the product under test
    rather than QA’s who have simply contracted for a single project.


    Several levels of independence can be defined as shown here from low to high:


    +   * Tests designed by the programmers who wrote the actual software under test
    (low level of independence).


    +   * Tests designed by other programmers within the same programming team.


    +   * Tests designed by a person(s) from a different organisational group (e.g.,
    the test team) or test specialists.


    +   * Tests designed by a person(s) from a different organisation'
