    subject area. To help you get start here follows some more examples of SQL

    (Structured Query Language).


    First some of the most common SQL commands below.


    +   - SELECT extracts data from a database

    - UPDATE updates data in a database

    - DELETE deletes data from a database


    First we have the Select command, you have already seen this in action

    above and in its most simple form we have


    Select * from table_name;

    This will select all rows and columns from the selected table in the order

    they were stored.


    You can also just select a subset of the columns


    Select name, email from table_name;


    Next we have Select Distinct, this command will only return distinct values,

    for example if table has 3 Fred Bloggs then the command below will

    only return 1 record.'
