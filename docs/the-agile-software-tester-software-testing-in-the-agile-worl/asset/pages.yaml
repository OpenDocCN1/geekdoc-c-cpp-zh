  md: '# Agile Modelling


    ![](img/9ad62c521b3df94dc74d517230e21e72_120_0.png)


    Agile Modelling (AM) is a collection of practices, principles and values that
    are used for modelling software that can be applied to a software development
    project in a lightweight and effective manner. AM was purposely designed to be
    a source of strategies that can be tailored to other base processes. With an Agile
    Model Driven Development (AMDD) approach, you typically do just enough high-level
    modelling at the beginning of a new project to understand the potential architecture
    and scope of the system under design. During construction iterations, you do modelling
    as part of your iteration planning activities and then take a JIT model storming
    approach where you model for several minutes as a precursor to several hours of
    coding. AMDD recommends that teams take a test-driven approach to development
    although doesn''t insist on it.


    Agile Modelling practices include the following:


    +   - Active stakeholder participation: Stakeholders provide information, make
    decisions, and are actively involved in the development process.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '+   - Architecture envisioning: This practice involves high-level architectural
    modelling to identify a viable technical strategy for your solution.


    +   - Document continuously: Write documentation for your deliverables throughout
    the life cycle in parallel to the creation of the rest of the solution. Some teams
    choose to write the documentation one iteration behind to focus on capturing stable
    information.


    +   - Document late: Write deliverable documentation as late as possible to avoid
    speculative ideas likely to change in favour of stable information.


    +   - Executable specifications: Specify detailed requirements in the form of
    executable customer tests and your detailed design as executable developer tests.


    +   - Iteration modelling: Iteration modelling identifies what needs to be built
    and how.


    +   - Just barely enough artefacts: A model needs to be enough for the situation
    at hand and more.


    +   - Look-ahead modelling: Invest time modelling requirements you intend to implement
    in upcoming iterations. Requirements near the top of your work item list are complex
    so explore them before they''re popped off the top to reduce overall project risk.


    +   - Model storm: Do JIT modelling to explore the in-depth requirements that
    sit behind a requirement or to think through a design issue.


    +   - Multiple models: An effective developer has a range of models in his toolkit,
    enabling him to apply the right model for the situation at hand.


    +   - Prioritised requirements: Implement requirements in priority order, as defined
    by your stakeholders.


    +   - Requirements envisioning: Invest your time at the start of an agile project
    to identify the scope of the project and create the initially prioritised stack
    of requirements.


    +   - Single-source information: Capture info in one place only.


    +   - TDD: Quickly code a new test and update your functional code to make it
    pass the new test.'
  merge: -1
