  md: '# Locate by XPath


    XPath is the language used for locating nodes in XML documents. As HTML can also
    be an implementation of XML (XHTML), you lucky Selenium users can utilise this
    powerful language to locate elements in the web applications under test. XPath
    extends way beyond simpler methods of locating by id and name attributes, it opens
    new possibilities such as locating the fifth checkbox on the web page test.


    One of the main reasons for using XPath is when you don''t have a suitable id
    or name attribute for the element you wish to locate (for example they are not
    unique). You can use the XPath feature to locate the element in absolute terms
    or relative to an element that has an id or name attribute. This is not as preferred
    as ID or Name and can make your test cases less robust but there are times when
    no other option is available.


    Below is an example of how to use this method


    ```

    <html>

    <body>

    <form id="loginForm">

    <input name="userid" type="text" />

    <input name="password" type="password" />

    <input name="cButton" type="submit" value="Login" />

    <input name="cButton" type="button" value="Clear" />

    </form>

    </body>

    </html>

    ```


    In this example the form elements can be located like this:

    #


    +   * login_form = driver.FindElement(By.XPath("/html/body/form[1]"))

    * login_form = driver.FindElement(By.XPath("//form[1]"))

    * login_form = driver.FindElement(By.XPath("//form[@id=''loginForm'']"))


    Java


    +   * login_form = driver.find_element_by_xpath("/html/body/form[1]")

    * login_form = driver.find_element_by_xpath("//form[1]"))'
