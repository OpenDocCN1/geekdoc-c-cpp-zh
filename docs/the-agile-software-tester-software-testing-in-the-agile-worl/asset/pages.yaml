  md: '# Locate by Name


    The name attribute is another fast way to locate an element. However, you must
    also be aware that the name may not be unique. With this method the first matching
    element will be returned, if no element has a matching name attribute, a NoSuchElementException
    will be raised.


    Below is an example of how to use this method


