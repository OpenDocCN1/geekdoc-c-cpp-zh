  md: '# # Automated API testing with C#


    Not only are you able to test API functionality in Postman and Jmeter but you
    can also test them within C# and Java. In C# this can be achieved with the client
    library as RestSharp and that is what we will look at.


    For those who do not know RestSharp is an easy to use, comprehensive, opensource
    HTTP client library that works with Dotnet/C#. It can be used to build robust
    applications by making it easy to interface with public APIs and quickly access
    data without the complexity of dealing with raw HTTP requests.


    So let us see in action. To do this you need to create a new Unit Test Project
    in Visual Studio.


