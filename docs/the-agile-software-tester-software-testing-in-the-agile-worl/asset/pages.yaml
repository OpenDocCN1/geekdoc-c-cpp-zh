    # Agree to pursue incremental, evolutionary change:


    The company (or team) should agree totally and completely that continuous, incremental
    and evolutionary change is the way to make system improvements and make them stick.


    Sweeping changes may seem more effective within an organisation organisation but
    also have a higher failure rate due to resistance and in people within the organisation.
    The Kanban method encourages continuous small incremental and evolutionary changes
