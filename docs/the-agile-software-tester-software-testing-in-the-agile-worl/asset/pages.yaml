  md: 'Boundary value analysis can be applied at all test levels. A good feature of
    this test is that it is relatively easy to apply, and its defect-finding capability
    is high. Detailed specifications help determine the interesting boundaries.


    Bottom-up Integration testing is an integration testing approach where the testing
    cycle will start with smaller pieces or subsystems of the whole software and gradually
    build its way up until testing is covering the entire software system. The purpose
    of integration testing is to verify functional, performance, and reliability requirements
    placed on major design items. These units are exercised through their interfaces
    using black-box testing, success and error cases being simulated via appropriate
    parameter and data inputs. Simulated usage of shared data areas and inter-process
    communication is tested, and individual subsystems are exercised through their
    input interface. Test cases are constructed to test whether all the components
    within assemblages interact correctly, for example across procedure calls or process
    activations, and this is done after testing individual modules, i.e. unit testing.
    The overall idea is a building block approach, in which verified assemblages are
    added to a verified base which is then used to support the integration testing
    of further assemblies.


    Browser compatibility Testing is one of the subtypes of testing of compatibility
    testing performed by the test team. Browser compatibility testing is performed
