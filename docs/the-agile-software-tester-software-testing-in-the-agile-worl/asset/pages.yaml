  md: '# API Testing with Postman


    A particularly important skill for any agile tester is the ability to test API’s.
    Now I am sure of you know what I mean by API but for those who do not here is
    a brief explanation.


    API stands for Application Programming Interface. At some point or another, most
    large companies have built APIs for their customers, or for internal use. A good
    example is eBay, they have an entire range of API’s which allow registered developers
    to create applications which can list products, retrieve sales and much more.


    So a typical API could be considered an interface between you (the client) and
    a service. You will ask the service for some information by sending it then required
    parameters. Supplying the parameters are valid then the request information is
    returned to you (if it exists).


    The essence of an API is that they make it possible for any two separate applications
    to transfer and share data between them. A good example is a front-end system
    asking for and receiving information from a back-end database system. They also
    make easier for an application’s users to execute actions without having to use
    the application’s GUI. From the developers’ view it is an effortless way to execute
    certain functionalities of their app and rigorously test them it as well.


    However, Using APIs daily can become cumbersome and time consuming, as you may
    well dozens or even hundreds of APIs that require testing. That can make it difficult
    to keep up with each request’s address(es), header(s), authorization credential(s)
    etc., and by that it is harder to test the API for functionality, security, and
    exception handling. So, to help with these functions’ tools have been created
    to make life a lot easier, one of the more popular of these tools is known as
    Postman.


    Postman is a powerful tool used to test web services and APIs. It allows you to
    create a request with the required HTTP method and parameters, send the request,
    and inspect the results. It provides a sleek user interface with to make HTML
    requests, without the need of writing a bunch of code just to test an API’s functionality.
    There are some genuinely nice, advanced'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'options which we will explore as we move through this chapter.

    So first you need to install Postman (providing you have not already done so).
    At the time of publication, the download URL was https://www.postman.com/downloads/.
    The good news is that it is free so you yourself read and let us start to learn
    Postman.


    First load up Postman, you will see a screen like the one shown on the following
    page.


    ![](img/9ad62c521b3df94dc74d517230e21e72_287_0.png)


    So let us start with a simple GET request, type in https://api.github.com/users/1
    in the input box show below then click the Send button.


    You will then see a similar response to this one in what is called the JSON format.'
