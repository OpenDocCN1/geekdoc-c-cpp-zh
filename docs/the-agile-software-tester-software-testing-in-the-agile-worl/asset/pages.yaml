    Each step starts with Given, When, Then, And Or But. Cucumber will execute every
    step in a scenario at a time, in the sequence you''ve written in. When Cucumber
    tries to execute a step, it looks for a matching step definition to execute. Previously
    shown the step definition will then to code in one of the project class files.

    Keywords are not considered when looking for a step definition. This means you
    cannot have a Given, When, Then, And or But with the same text as another step.

    Cucumber considers the following steps duplicates:


    Given there is loads of money in my account


    Then there is loads of money in my account


    At first this might seem like a limitation, but it forces you to come up with
    a less ambiguous, clearer domain language, for example:

    Given my account has a healthy balance of £900,000


    Then my account should have a healthy balance of £900,000


    These examples are less ambiguous and easier to understand.


    Given steps are used to describe the initial context of the system under test
    - the scene of the scenario. It is typically something happened in the past. When
    Cucumber executes a Given step, it will configure the system to be in a well-defined
    state, such as creating and configuring objects or adding data to a test database.


    The purpose of Given steps is to put the system in a known state before the user
    (or external system) starts interacting with the system (in the When)'
