  md: '# Continuous Integration and Deployment


    Automation is a good aid when trying to achieve Continuous Integration and Deployment
    and as part of the overall scheme, this practice can vastly improve the quality
    of code and the speed of development. Continuous integration (CI) is the practice
    of regularly integrating and testing your solution to incorporate changes made
    to its definition. These changes can include updating the source code, changing
    database schema or simply updating a text based configuration file.


    For the best results when one or more changes are checked into your configuration
    management system, the solution should then be rebuilt and recompiled, retested
    and finally code or schema analysis performed on it. If it is impractical to do
    this every time a change is saved you should strive to do at least once if not
    several times a day, that is the essence of continuous integration.


    Moving this process one step forward continuous deployment (CD) enhances CI by
    automatically deploying successful builds. For, when the build is successful on
    a programmer''s workstation, then the team may automatically deploy their changes
    to the project integration environment, which would invoke the CI system. A successful
    integration in that environment could trigger an automatic deployment into another
    environment and so on.


    On a developer''s workstation, the integration job could run by example at specific
    times, perhaps once an hour, or better every time they check in something that
    is part of the build. The whole process of continuously integrating a developer''s
    code with the rest of a team''s code and then running automated test regressions
    in an integration environment is the essence if CI. Continuous Integration


    ![](img/9ad62c521b3df94dc74d517230e21e72_333_0.png)


    This is a critical part of agile to ensure integration is done right. CI always'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'ensures high-quality working software, and CD ensures that the software is
    running in the right place. When used with Selenium or another good automation
    tool good testing results can also soon be achieved.


    # Continuous Deployment


    The longer a branch of code remains checked out on a computer, the greater the
    risk of multiple integration conflicts and failures when the branch is finally
    reintegrated into the main trunk. When programmers submit code to the repository,
    they should first update their code to reflect the changes in the repository since
    they took their local copy. The more changes the repository contains, the more
    work programmers must do before submitting their changes.


    There is a risk that eventually the repository may become so different from the
    programmer''s local copy that the team can enter what is sometimes referred to
    as "merge hell", or "integration hell". This is where the time it takes to integrate
    the time it took to make their original changes and conflicts are everywhere.
    This is where continuous integration becomes a critical practice. It involves
    integrating early and often, to avoid the pitfalls of "integration hell


    Regular integration requires a reliable repository where the main trunk of code
    and any development branches are stored. Offsite backups of this code are also
    essential, should the unthinkable ever happen and the source server should go
    down or go missing at least code would still exist and a few hours work may be
    lost rather than a few years.


    There are many options for repository management on the market today. I prefer
    the built-in repository options that are available on Team Foundation Server.
    This multi functioned and well-designed application allows for safe storage of
    both Visual Studio Code and Eclipse Code. Shown below is the repository for an
    Android application which is designed in Eclipse and all changes are stored within
    Team Foundation Server. Below is an example screenshot of this package. This example
    shows the source code for'
