  md: '# # Gherkin and Cucumber


    Gherkin uses a set of special keywords to give structure and meaning to executable
    specifications. Most lines in a Gherkin document start with one of the keywords.
    Comments are only permitted at the start of a new line, anywhere in the feature
    file. They begin with zero or more spaces, followed by a hash sign (#) and some
    text. Also, spaces or tabs may be used for indentation.


    The recommended indentation level is two spaces. Here is an example:


    ```

    Feature: Test for the existence of Google

    # This example will try and load Google

    Scenario: Try to load google

    Given the web browser has successfully loaded

    When I type google into the address bar

    Then the google search page will load after I enter

    ```


    Each of the Given, When, Then Steps are matched to a code block which is called
    a step definition, which we will cover later in this book.


    The purpose of the Feature keyword is to provide a high-level description of a
    test feature file, and to group related scenarios. The first primary keyword in
    a Gherkin document must always be Feature, followed by a : and a short text that
    describes the feature. You can add free-form text underneath Feature to add more
    description and improve readability. For example:


    ```

    Feature: Guess the word

    The word game is a turn-based game for two players.

    The Maker makes a word for the Breaker to guess. The game

    is over over when the Breaker guesses the Maker’s word.

    ```


    Below is a list of keywords available:


    +   * Feature

    * Rule

    * Steps

    * Given

    * When

    * Then

    * And, But, *

    * Background'
