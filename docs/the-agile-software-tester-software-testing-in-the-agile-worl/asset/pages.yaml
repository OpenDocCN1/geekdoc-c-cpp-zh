    The Kanban method is a lean methodology that has been discussed elsewhere in this
    book. However, as a refresher the two Kanban principles critical to success are:


    +   1. Visualising the workflow: Teams use a Kanban board (whiteboard, corkboard
    or electronic board) that displays kanbans (indications of where in the process
    a piece of work or task currently is). The board is organised into columns, each
    one representing a stage in the process, a work buffer, or queue; and optional
    rows, indicating the allocation of capacity to classes of service. The board is
    updated by team members as work proceeds, and blocking issues are identified during
    daily meetings.


    +   2. Limit work in progress (WIP): Limiting WIP reduces average lead time, improving
    the quality of the work produced and increasing the overall productivity of your
    team. Reducing lead time also increases your ability to deliver frequent functionality,
    which helps build trust with your stakeholders. To limit WIP, understand where
    your blocking issues are, address them quickly, and reduce queue and buffer sizes
    wherever you can.'
