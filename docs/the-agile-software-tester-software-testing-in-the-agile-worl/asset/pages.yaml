  md: '# Types of Testing


    So, before we move on to the world of agile software development and agile software
    testing let us discuss the major types of testing currently in use today. This
    is not a complete, exhaustive list and I am sure some of you will all know of
    a few other types and want to say ‘what about ...’ but please remember this book
    has already been written and published. Also, I cannot hear you but please feel
    free to email any suggestions for the next edition. However, most of the common
    styles are here, you will not use all of them, but you will come across most during
    your careers in IT.


    These days software QA’s should have a good array of testing methods and tools
    at their disposal. These can be generally classified within the Dynamic and Static
    areas. Static testing is based on the methods used for Code Reviews, Walkthroughs
    and Inspections. Dynamic testing methods involve a developer or QA using the computer
    program or parts of it. Types can also be split between Black Box and White Box
    as detailed below.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# # Black box testing


    ![](img/9ad62c521b3df94dc74d517230e21e72_29_0.png)


    Black box testing is a method of software testing where the QA team are not required
    to know or understand the code and internal structure of the software that is
    currently under test. For example, in a black box test on software design, the
    QA team only knows the required inputs and what the expected outcomes should be
    and not how the program code arrives at those outputs. The QA team will never
    examine the actual programming code and they do not need any further in-depth
    knowledge of the program other than its specifications.


    The advantages of this type of testing include:


    +   * The test is unbiased because the designer and the QA are independent of
    each other.

    * The QA does not need knowledge of any specific programming languages.

    * The test is done from the point of view of the user, not the designer.

    * Test cases can be designed as soon as the specifications are complete.


    Discussed next are the most common types of Black Box Testing.'
  merge: -1
