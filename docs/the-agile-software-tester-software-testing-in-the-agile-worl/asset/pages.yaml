  md: 'Once installed fire up JMeter and we can get started. Below is a nice, shiny,
    fresh project, all I have done so far is rename the test plan. The test plan is
    your JMeter script, it will determine the flow of the load test.


    > Apache JMeter (5.1.1-r18551337)


    ![](img/9ad62c521b3df94dc74d517230e21e72_250_0.png)


    Next, we require a Thread Group. Thread groups determine the user flow and simulate
    how users behave on the app. Each thread represents a user.


    ![](img/9ad62c521b3df94dc74d517230e21e72_250_1.png)


    Now you will need to configure the Thread Group by setting the following:


    +   - Name: Provide a custom name or, if you prefer, simply leave it named the
    default “Thread Group”. In this example I am using “Kevbox Thread Group”.


    +   - Number of Threads: Each thread will execute the test plan in its entirety
    and completely independently of other test threads. Multiple threads are used
    to simulate concurrent connections to'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'your server application. For this example, 5.

    Set the ramp-up period - The ramp-up period tellsMeter how long to take to "ramp-up"
    to the full number of threads chosen. If 10 threads are used, and the ramp-up
    period is 100 seconds, thenMeter will take 100 seconds to get all 10 threads up
    and running. Each thread will start 10 (100/10) seconds after the previous thread
    was began. If there are 30 threads and a ramp-up period of 120 seconds, each successive
    thread will be delayed by 4 seconds. For this example, we will use 10.


    Loop Count: How many times the test should repeat. Let''s say 1 time (no, just
    run once).


    Now so we see something like this.


    | Thread Group

    Name: Keybox Thread Group

    Comments:

    Action to be after a Sampler error

    Continue Start Next Thread Loop Stop Thread Stop Test Stop Now

    Thread Properties

    Number of Threads (users): 10

    Ramp-Up Period (seconds): 5

    Loop Count: Forever 1


    JMeter has two types of Controllers: Samplers and Logical Controllers. These drive
    the processing of a test. Samplers tell Meter to send requests to a server. For
    example, add an HTTP Request Sampler if you want Meter to send an HTTP request.


    You can also customize a request by adding one or more Configuration Elements
    to a Sampler. Logical Controllers let you customize the logic that Meter uses
    to decide when to send requests. For example, you can add an Interleave Logic
    Controller to alternate between two HTTP Request Samplers.


    Samplers tell Meter to send requests to a server and wait for a response. They
    are processed in the order they appear in the tree. Controllers can be used to
    modify the number of repetitions in a sampler.


    +   - Meter samplers include:

    - FTP Request

    - HTTP Request'
