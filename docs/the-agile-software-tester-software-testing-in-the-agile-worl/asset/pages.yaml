  md: '# The Scrum Master


    The daily scrum is overseen by a scrum master, although they do not have to attend
    each meeting in person. They are responsible for ensuring Scrum is fully understood
    and enacted daily. Scrum Masters do this by ensuring the Scrum Team adheres to
    Scrum theory, practices, and rules.


    The scrum master is also accountable for removing impediments to the ability of
    the team to deliver the product goals and deliverables. The scrum master is not
    a traditional team leader or project manager but acts as a buffer between the
    team and any distracting influences.


    During the daily scrum, the scrum master ensures that the Scrum process is used
    as intended, for example, a short, daily meeting held every day. He or She is
    the enforcer of the rules of Scrum, often chairs key meetings, and challenges
    the team to improve. The role has also been referred to as a servant-leader to
    reinforce these dual perspectives.


    Servant leadership is both a leadership philosophy and set of leadership practices.
    Traditional leadership generally involves the accumulation and exercise of power
    by one at a the “top of the pyramid.” By comparison, the servant-leader shares
