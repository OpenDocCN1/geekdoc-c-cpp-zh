  md: '# Burndown Charts


    ![](img/9ad62c521b3df94dc74d517230e21e72_140_0.png)


    Burndown charts are graphical artefacts that provide very useful information for
    the scrum team. There are two types of Burndown charts. The most commonly used
    type is the Iteration or sprint chart. There is also another type as the Release
    Chart which is not as common.


    These charts are a graphical representation of the work left to do versus the
    remaining. The outstanding work (also known as the backlog) is usually on the
    vertical axis while the time along on the horizontal. The iteration Burndown chart
    is often used in agile as a metric for measuring progress over time and as a result,
    they are a good tool for working out team velocity.


    The main concept behind team velocity is to help agile teams estimate how much
    work they can reasonably complete within a given period. The Burndown charts help
    achieve this by giving a benchmark of how quickly similar work was previously
    completed. The following terminology is commonly used in velocity tracking.


    +   - Unit of work: The unit is chosen by the team to measure velocity. This can
    either be a real unit like hours or days or an abstract unit like story points
    or ideal days, the choice will vary from team to team. Each task in the software
    development process should then be valued in terms of the'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'chosen unit.


    +   - Interval: The interval is the duration of each individual iteration in the
    software development process for which the velocity is measured. The length of
    an interval is determined by the team. Most often, the interval is a week, but
    it could also be as long as one month, although no longer.


    Below is a breakdown of the elements of a Burndown chart


    | X-Axis | The iteration/project timeline |

    | Y-Axis | The work that needs to be completed for the iteration/project. The
    time or story point estimates for the work remaining will be represented by this
    axis. |

    | Project Start Point | This is the farthest point to the left of the chart and
    occurs at day 0 of the iteration/project. |

    | Project End Point | This is the point that is farthest to the right of the chart
    and occurs on the predicted day of the iteration/project. |

    | Ideal Work Remaining Line | This is a straight line that connects the start
    point to the endpoint. At the start point, the ideal line shows the sum of estimates
    for all the tasks (work) that needs to be completed. At the endpoint, the ideal
    line intercepts the x-axis showing that there is no work left to be completed.
    This line is a mathematical calculation based on estimates, and the estimates
    are more likely to be in error the work. The goal of a burndown chart is to display
    the progress toward completion and give an estimate of the likelihood of timely
    completion. |

    | Actual Work Remaining Line | This shows the actual work remaining. At the start
    point, the actual work remaining is the same as the ideal work remaining but as
    time progresses; the actual work fluctuates above and below the ideal line depending
    on how effective the team is. In general, a new point is added to this line each
    day of the project. Each day, the sum of the time or story estimates for work
    that was recently completed is subtracted from the last point in the line to determine
    the next point |


    To calculate the team velocity, the team first must determine how many'
