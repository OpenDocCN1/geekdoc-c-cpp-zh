  md: '# Static Testing


    ![](img/9ad62c521b3df94dc74d517230e21e72_53_0.png)


    This is a form of testing that is commonly used in reviews and walkthroughs which
    are employed to evaluate the correctness of the deliverable. Unlike dynamic testing,
    which requires the execution of software; static testing techniques rely on the
    manual examination (reviews) and automated analysis (static analysis) of the code
    or other project documentation without the execution of the code. The code is
    reviewed for syntax, naming convention, the size of the functions and methods
    etc. Static testing usually has checklists against which deliverables are evaluated.


    Manual reviews are a good way of testing software products (including code) and
    can be performed well ahead of dynamic test execution. Defects that are detected
    during reviews early in the life cycle (e.g., defects found in requirements) are
    often much cheaper to remove than those detected by running tests on the executing
    code.


    In most cases, a review could be done entirely as a manual activity, but there
    is also tool support available if required or desired. The main manual activity
    is to examine a work product and make constructive comments about it. Any type
    of software work product can be reviewed, including requirements specifications,
    design specifications, raw code, test plans, test specifications, test cases,
    test scripts, user guides or web pages.


    The benefits of reviews include early (and cheaper) defect detection and correction,
    improved development productivity improvement, reduced development timescales,
    reduced testing cost and time, fewer defects in code test and improved communication
    between all affected parties. Reviews can also find critical omissions in requirements
    which are less likely to be found in dynamic testing.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'All reviews, static analysis and dynamic testing should have the same objective,
    which is to find defects. These methods are complementary, and the different techniques
    can find different types of defects effectively and efficiently. In comparison
    to dynamic testing, static techniques find the causes of failures and defects
    rather than the actual failures themselves.


    The style of the different types of reviews varies from informal, characterised
    by no written instructions for reviewers, to systematic, characterised by team
    participation, documented results of the review, and fully documented procedures
    for conducting the review. The formality of a review process is related to factors
    such as the maturity of the development process, customer requirements, any legal
    or regulatory requirements or the need for an audit trail.


    A single software product may be the subject of more than one review during its
    life cycle. If more than one type of review is used, the order may vary. For example,
    an informal review may be carried out before a technical review, or inspection
    may be carried out on a requirements specification before a walkthrough with stakeholders.
    The main characteristics, options and purposes of common review types are:


    # Informal Review


    +   * No formal process used.

    * These could take the form of pair programming or a technical lead reviewing
    designs and code.

    * The results may (or not) be documented.

    * These can vary in usefulness depending on the reviewers.

    * Main purpose: an inexpensive way to get some benefit.


    # Walkthrough


    +   * The meeting is always led by the author.

    * These may take the form of scenarios, dry runs and peer group participation.

    * They are open-ended sessions.

    * They can include an optional scribe (but this should not be the author).'
  merge: -1
  pgno: 54
- img_proc: true
  md: '+   * They may vary in practice from quite informal to very formal.

    * Main purposes: learning, gaining understanding, finding defects.


    # Technical Review


    +   * A formally documented, defined defect detection process that includes peers
    and technical experts with optional management participation.

    * They may also be performed as a peer review without management participation.

    * Ideally, the review will be by a trained moderator (who should not be the author).

    * There should be pre-meeting preparation by reviewers.

    * There is scope for optional use of checklists.

    * These will lead to the preparation of a review report which includes the list
    of findings, the verdict whether the software product meets its requirements and,
    where appropriate, recommendations related to findings.

    * They may vary in practice from quite informal to very formal.

    * Main purposes: discussing, making decisions, evaluating alternatives, finding
    defects, solving technical problems and checking conformance to specifications,
    plans, regulations, and standards.


    # Inspection


    +   * These are led by a trained moderator (should not be the author).

    * They are usually conducted as a peer examination.

    * They must have defined roles.

    * They will usually include metrics gathering.

    * This is a formal process that is based on rules and checklists.

    * There will be specified entry and exit criteria for acceptance of the software
    product.

    * They should always include pre-meeting preparation.

    * In the end, there should be an inspection report including a list of findings.'
