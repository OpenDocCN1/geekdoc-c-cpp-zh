  md: '# # Unified Process (UP)


    The Unified Process (UP) is probably the least used methodology at this moment
    in time. However, it is a valid framework that can provide a valuable solution
    should it your company needs. UP uses an iterative and incremental approach within
    a set life cycle and focuses on the collaborative nature of software development.
    It can be extended to address a broad variety of project types, including OpenCV,
    Agile Unified Process (AUP), and Rational Unified Process (RUP).


    UP divides the project into iterations focused on delivering incremental value
    to stakeholders in a predictable manner. The iteration plan defines what should
    be delivered within the iteration, and the result is ready for review or shipping.
    UP teams like self-organise around how to accomplish iteration objectives and
    commit to delivering the results. They do by defining and “pulling” fine-grained
    tasks from a work items list. UP applies an iteration lifecycle that structures
    how micro-increments are applied to deliver stable, cohesive builds of the system
    that incrementally progress toward the iteration objectives.'
