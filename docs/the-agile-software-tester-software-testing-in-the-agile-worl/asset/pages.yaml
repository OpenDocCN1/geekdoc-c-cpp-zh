    # The Plague in World of Warcraft (2005)


    - The hugely successful World of Warcraft (WoW), an online computer game created
    by Blizzard Entertainment, suffered an embarrassing glitch following an update
    to their game on September 13, 2005 – causing mass (fictional) death. Following
    an update to the game content, a new enemy character, Hakkar, was introduced.
    This character could inflict a disease called Corrupted Blood upon the playing
    characters that would drain their health over a period. This disease could be
    passed from player to player, just as in the real world, and had the potential
    to kill any character contracting it. This effect was meant to be strictly localised
    to the area of the game where Hakkar inhabited. However, one thing was overlooked:
    players were able to teleport to other areas of the game while still infected
    and pass the disease onto others – which is exactly what happened. I cannot find
