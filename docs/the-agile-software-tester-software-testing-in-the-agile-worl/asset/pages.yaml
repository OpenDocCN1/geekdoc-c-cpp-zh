  md: '# Locate by ID


    By far Ids is the preferred method to locate elements on a web page. This is because
    The W3C standard recommends developers provide an id attribute for elements that
    are unique to each element. Having a unique id attribute provides a very explicit
    and reliable way to locate elements on the page. If for any reason the Ids are
    not unique, or they are auto-generated method should not be used.


    With this method, the first element with the id attribute value matching the location
    will be returned. If no element has a matching id attribute, a NoSuchElementException
    will be raised.


    Below is an example of how to use this method


    ```

    <form name="userId">

    User ID: <input id="userid" type="text" name="login" />

    Password: <input id="password" type="password" name="password" />

    <input type="submit" name="signin" value="SignIn" />

    </form>

    ```


    As you can see both input boxes have a unique value, these can be used to locate
    the element. The example code for this is shown below.


    C#


    ```

    driver.FindElement(By.Id("id")).Click();

    ```


    Java


    ```

    driver.findElement(By.id("userid"));

    ```'
