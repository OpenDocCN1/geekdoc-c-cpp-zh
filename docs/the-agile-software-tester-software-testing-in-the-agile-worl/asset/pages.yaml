  md: '# Serverless Testing


    # So, what is Serverless?


    This is a very good question and there are many different definitions around.
    This, however, is mine, Serverless computing is a method of providing backend
    services on an as-used basis, which means you only pay for actual usage and the
    general idea is your organisation will save costs. A Serverless provider will
    allow users to write and deploy code without the hassle of worrying about the
    underlying infrastructure. This means an organisation that gets backend services
    from a Serverless vendor is charged based on their computation usage and do not
    have to reserve and pay for a fixed amount of bandwidth or number of servers,
    as the service is auto-scaling. You should, however, note that although called
    Serverless, physical servers are still used but developers do not need to be aware
    of them, what they are or where they are.


    In the dark, early days of the web, anyone who wanted to build a web application
    to own the physical hardware required to run a server, which is a cumbersome,
    time consuming and expensive undertaking.


    Then the cloud, where fixed numbers of servers or amounts of server space could
    be rented remotely on a monthly or annual basis. Developers and organisations
    who rent these fixed units of server space generally overpurchase to ensure that
    a spike in traffic or activity wouldn’t exceed their monthly limits and break
    their applications. This means that much of the server space that was purchased
    was not used and went to waste. In these enlightened times, cloud vendors have
    introduced auto-scaling models to address the issue. While a step forward the
    service is still not perfect for even with auto-scaling an unwanted spike in activity,
    such as a DDoS Attack, could end up being very expensive.


    Serverless computing allows developers to purchase backend services on a flexible
    ‘pay-as-you-go’ basis, meaning that developers and organisations only must pay
    for the services they use. You could liken this to switching from a mobile phone
    plan with a monthly fixed, to that only charges'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'for each byte of data that gets used. Overall you should save money.


    Something to remember is that the term ''Serverless'' is somewhat misleading in
    real life. There are still servers providing these backend services, but all the
    server space and infrastructure concerns are handled by the vendor. Serverless
    means that the developers can do their work without having to worry about servers
    at all. It does, however, offer new challenges to the QA team.


    # # How to test Serverless applications


    # ## Testing Stages


    Unit Tests


    As completed by the programmers while designing the code. Unit tests tend to be
    short and closer to the code. Unit tests should cover every non-trivial path (happy
    path and edge cases). These tend to be the cheapest type of tests.


    # Integration Tests


    Integration tests are those that primarily de-risk connections between various
    components, normally something you build and something someone else has built,
    they also fill in the gaps created by unit tests cannot cover. For example, a
    test that checks if my code saves things correctly to an S3 file system would
    be an integration test.


    The primary characteristic of identifying an integration test is the type of risk
    it covers, and this category does not imply anything about the area of coverage.
    This can be automated against a single unit of code, around several components,
    through a subsystem or around the entire system. These tests are made when your
    expectations of the response format is incorrect, or if there''s a bug in your
    DynamoDB query expression, integration testing will help you solve all these issues.
    While performing integration testing, you''ll invoke the function locally by passing
    in a stubbed event as well as context objects. In case the function needs to integrate
