- img_proc: true
  md: '# TDD vs. BDD


    So, let us summarise the advantages of BDD over TDD.


    +   - BDD is in a more readable format by every stakeholder since it is in plain
    English, unlike TDD test cases written in programming languages such as C# and
    Java.

    - BDD explains the behaviour of an application for the end-user while TDD focuses
    on how functionality is implemented. Changes on functionality can be accommodated
    with less impact in BDD as opposed to TDD.

    - BDD enables all the stakeholders to be all on the same page with requirements
    which makes acceptance criteria easier to write and easier to agree on.


    Despite this, the choice between TDD and BDD can still be a complicated one. The
    choice can depend if there is an appropriate testing framework for your given
    target language. Also, there is a need to consider the current skill set of the
    entire team. One advantage with BDD is that Behaviour-specific tests can be executed
    when a project first starts, while a product is still in development and when
    a product is completed. At a minimum, BDD requires that the behavioural tests
    are created before development starts, this will help ensure the team fully understands
    the acceptance criteria. Before development begins, all the behavioural tests
    should fail, but as the development of the product progresses, the tests will
    begin to pass as the new functionality appears. Once all the behavioural tests
    are considered passing, the product can be considered a deliverable artefact.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# # Automated Testing with Selenium


    ![](img/9ad62c521b3df94dc74d517230e21e72_146_0.png)


    Test automation at all levels of testing occurs in many gile teams, and this can
    mean that QA’s spend time creating, executing, monitoring and maintaining automated
    test cases and the end results. Because of the heavy use of creating automation,
    a higher percentage of manual testing on agile projects tends to be done using
    experience-based and defect-based techniques such as software attacks, exploratory
    testing and error guessing.


    While programmers should focus on creating unit tests, QA’s should focus on creating
    automated integration, system and system integration tests which can be reused
    with little or no modification in a later development cycle. This leads to a tendency
    for agile teams to favour QA’s with a strong technical and test automation background.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Such highly skilled QA''s are in great demand and can expect better employment
    terms than lesser-skilled, manual testers.


    One goal of the automated tests is to confirm that the build is indeed functioning
    reliably and is installable. Should any of the automated test scripts fail the
    agile team investigate why. If the reason is that logic has changed then the script
    will be updated. If, however, the failure has exposed some form of bug then the
    team should attempt to fix the underlying defect in time for the next code check-in.
    This should be undertaken whenever and as often as is possible.


    While this requires an investment in real-time cost your team should have a viable
    test reporting system which to provide good visibility into test results. The
    payback in results makes this effort very worthwhile. This approach helps reduce
    expensive and inefficient cycles of "build-rebuild" that can occur in many traditional
    projects since changes break the build or cause the software to install are detected
    quickly.


    One of the more popular automation tools on the market today is Selenium. You
    may have well heard of selenium and possibly used it. If not, then you are probably
    thinking; what on earth is this Selenium thing?


    Well, selenium is a portable software testing framework for web applications.
    Selenium also provides a test domain-specific language called Selanese to write
    tests in several popular programming languages.


    These languages include C#, Java, Perl, PHP, Python and Ruby. These tests can
    then be modified, saved and run against most modern web browsers. Another advantage
    of selenium is that it is cross-platform and it will deploy on the Windows, Linux,
    and Macintosh platforms. It is open-source software, released under the Apache
    2.0 license, and can be downloaded and used without charge, another good bonus.


    I currently work with Selenium and C# and this is by far my preferred combination
    therefore the examples and information to follow is based around that flavour.
    So, read on you intrepid QA''s.'
  merge: -1
