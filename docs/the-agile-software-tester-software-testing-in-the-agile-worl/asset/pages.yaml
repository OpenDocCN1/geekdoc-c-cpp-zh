  md: '# # The five agile Meetings


    # ## 1: The Release Planning Meeting


    A vital and important part of agile is regular meetings. There are five meetings
    of importance with agile, so let us now discuss the first of these.


    ![](img/9ad62c521b3df94dc74d517230e21e72_89_0.png)


    This is the release planning meeting. This meeting takes place at the start of
    every release cycle. The purpose of the release planning meeting is also to get
    an idea of what stories the team will try to finish by the release end date.


    The product owner will select the stories in a logical order of importance. There
    may be dependencies which will affect this order as well but in general, the highest
    priority will be started first.


    It is also important that the team understands the possibility that not all the
    stories will get completed by the release end date. One of the premises of agile
    is to deliver working software, so it is important to have the highest-value stories
    completed first (barring dependencies) so that the software you deliver meets
    the customer''s needs. The final acceptance criteria should be agreed at this
    meeting and the result of this meeting is the product backlog.


    The product backlog is a dynamic list of stories. These stories may be edited,
    deleted or added at any time during the release cycle. As previously discussed,
    the list is prioritised and items with the highest priority should always be completed
    first. The backlog is progressively refined, adjusted and'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'improved during the life cycle.


    When the product owner sets the scope of the next iteration, he or she needs to
    know that the scope is the right size for the team, in other words, there isn''t
    too much work to get done in the iteration. Like any other developers, agile team
    members estimate their own work. Unlike other developers, agile team members usually
    estimate in points. Points represent a size-based, complexity-based approach to
    estimation. Points are assigned in whole numbers (1, 2, 3, 4 and so on with no
    fractions or decimals). A common method of sizing is to use the Fibonacci number
    system (1, 2, 3, 5, 8, 13 etc). These numbers represent relative sizes and complexity
    of work items. Small and simple tasks are one-point tasks, slightly larger/more
    complex tasks are two-point tasks, and so on with 10 usually being the highest
    in a decimal ranking system and a higher number for the Fibonacci system.


    Points can be thought of as shirt sizes. There can be small, medium, large, extra-large,
    and potentially other sizes (extra small, extra extra-large and these days even
    xxxx large). These sizes are relative to the team using them; no formal regulation
    dictates how the much larger medium is compared to small.'
  merge: -1
