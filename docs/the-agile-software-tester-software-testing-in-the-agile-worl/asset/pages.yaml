  md: '# Load Testing with Jmeter


    So, what is JMeter you may ask? This is a good question, let me explain a little.
    JMeter, also known by some Apache JMeter is a free, open source java-based application
    with a well-designed and helpful graphical user interface. It is designed to analyse
    and measure the performance and load functional behaviour of web applications
    of all sizes and variety of other services.


    JMeter is mainly used for testing Web applications and FTP applications. However,
    it is also applicable in functional testing, database connections, web services
    to name but a few. Users can perform various testing activities as stress, performance,
    load, functional and regression testing.


    So why is load and stress testing so important you may think? Code often runs
    under light loads in the development environment but can break under heavy production
    load. Therefore stress and load testing:


    +   * Exposed bugs

    * Verify code meets performance criteria

    * Exposed possible application bottlenecks

    * Help capacity planning and future dev plans


    There are several stages of load testing.


    +   * First, verify the application server environment and check that there are
    no errors in the application.

    * Make sure enough machine resources are allocated for testing and that the configuration
    settings are correct.

    * Warm up the system and application server since “cold” machines might perform
    poorly because data is not in memory or cache, data structures might need to be
    created, and so forth.

    * When you run the test load, collect as much performance data as possible.

    * Finally, verify that the results of the load testing are reliable and repeatable.


    Now let''s get going with JMeter. If you have not yet installed JMeter then at
    the time of writing it can be download from here -

    https://jmeter.apache.org/download_jmeter.cgi.'
