    Once again make these changes, Save, Reset and Re-run. This time the tests will
    run exactly the same as previous runs. However if there was a problem during a
    test you can now view any or all of these sets and inspect the values which may
    well help you determine why the tests failed.


    | JMeter properties | True |

    | JMeter variables | True |

    | System properties | True |


    The next cool feature of JMeter we are going to investigate is the ability to
    test API function calls. For the purposes of the demonstration we will be using
    a local instance of JIRA. JIRA is a well-known and popular bug tracking and test
    management offering. JIRA is a completely REST API based tool and there is an
    API URI for each published functionality.

    First, unless you previously done so, you will need to download JIRA. At the time
    of writing the download URL was - https://www.atlassian.com/software/jira/download.

    Select the version for your computer and download.


    Long Term Support release

    Jira Software 8.13.6

    Recommended for large organizations looking

    for long-term support.

    Why choose Long Term Support releases?


    ![](img/9ad62c521b3df94dc74d517230e21e72_267_1.png)'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'When download is complete you can then install the application.


    ![](img/9ad62c521b3df94dc74d517230e21e72_268_0.png)


    ![](img/9ad62c521b3df94dc74d517230e21e72_268_1.png)


    Note that the http port is 8080.


    ![](img/9ad62c521b3df94dc74d517230e21e72_268_2.png)


    When complete the JIRA service will start.


    ![](img/9ad62c521b3df94dc74d517230e21e72_268_3.png)


    Also you can launch the application in your web browser http://localhost:8080/.
    Now the actual setting up of JIRA is beyond the scope of this discussion but once
    JIRA is up and running you should setup a task management project and you should
    create a user, then you will be ready'
