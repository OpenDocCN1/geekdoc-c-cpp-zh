- img_proc: true
  md: 'corpses littering the streets. Fortunately, player death is not permanent in
    WoW and the event was soon over when the administrators of the game reset the
    servers and applied further software updates. Particularly interesting is the
    way reactions in the game could closely reflect their reactions to a similar real-life
    incident. While the deaths in the World of Warcraft were fictional this has not
