  md: 'The test team also needs to be aware that debugging and testing are different
    entities. Dynamic testing can show failures that are caused by defects if implemented
    correctly.


    In contrast debugging is the development activity that a programmer will employ
    to locate, analyse and remove the cause of the failure. Subsequent testing by
    a QA ensures that the fix does indeed resolve the failure. The responsibility
    for these activities is usually QA’s and programmer’s debug. You should always
    remember that both are developers in the agile world.


    Test control is the ongoing activity of comparing actual time progress against
    the original test plan and reporting the status, including deviations from the
    plan at regular meetings. Test control involves taking actions necessary to meet
    the targets and objectives of the project. To control testing, the testing activities
    should be monitored and discussed throughout the project. Test planning considers
    feedback from monitoring and control activities.


    At the end of every cycle or sprint test closure activities should be employed
    to collect data from the completed test activities to consolidate experience,
    facts, mistakes and numbers. Test closure activities occur at project milestones
    such as when a software system is released, a test project is completed (or cancelled),
    a milestone has been achieved, or a maintenance release has been completed or
    in the agile world at the end of every sprint. Typical closure activities include
    the following tasks:


    +   - Checking which planned deliverables has been completed and delivered.


    +   - Closing incident reports or raising change records for any that remain open.


    +   - Documenting the acceptance of the system.


    +   - Finalising and archiving test software, the test environment and the test
    infrastructure for reuse in later sprints.


    +   - Analysing lessons learned to determine changes needed for'
