  md: 'A component test verifies a component’s behaviour. Component tests help with
    the component design by testing interactions between objects.


    # Conditions of satisfaction


    Conditions of satisfaction also called satisfaction conditions or conditions of
    business satisfaction, are key assumptions and decisions made by the customer
    team to define the desired behaviour of the code delivered for a given story.
    Conditions of satisfaction are criteria by which the outcome of a story can be
    measured. They evolve during conversations with the customer about high-level
    acceptance criteria for each story. Discussing conditions of satisfaction helps
    identify risky assumptions and increases the team’s confidence in writing and
    correctly estimating all the tasks to complete the story.


    # Context-driven testing


    Context-driven testing follows seven principles, the first being that the value
    of any practise depends on its context. Every new project and every application
    may require different ways of approaching a project.


    # Continuous Deployment


    Continuous Deployment (CD) is the process that takes fully validated Features
    in a staging environment and deploys them into the production environment, where
    they are readied for a final release.


    # Continuous Integration


    Continuous Integration is the software development practice where members of a
    development team integrate their work frequently, usually at least daily. Each
    integration is verified by an automated build (including unit tests) to detect
    integration errors as quickly as possible.


    # Cost of Delay


    The cost of delaying an investment decision, tend to grow over time.


    # Cucumber


    Cucumber is a software tool that supports behaviour-driven development (BDD).
    It runs automated acceptance tests written in a behaviour-driven development (BDD)
    style.'
