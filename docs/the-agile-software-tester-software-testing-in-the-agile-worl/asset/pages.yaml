    By adding a mock server to your collection and adding examples to your requests,
    you can simulate the behaviour of a real-world API on your own machine. When you
    send a request to a mock server, Postman will match the request configuration
    to the examples you have saved for the request and respond with the data you added
    to the example.


    So, mocking means you are creating a fake version of an external or internal service
    that can stand in for the real one, helping your tests run more quickly and more
    reliably. When your implementation interacts with an object''s properties, rather
    than its function or behaviour, a mock can be used.


    There will be times when the API under test does not work as expected, so let
