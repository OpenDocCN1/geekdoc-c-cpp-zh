    # Unit testing (also known as component testing) is a type of


    white box testing that is performed by software developers whenever they update
    their code. Using white box testing techniques, testers (usually the developers
    creating the code implementation) verify that the code does what it is intended
    to do at a very low structural level. Unit testing usually involves developing
    stubs and drivers. Unit tests are often ideal candidates for automation. Automated
    tests can run as Unit regression tests on new builds or new versions of the software.


    There are many useful unit testing frameworks like JUnit, Nunit, available that
    can make unit testing more effective. When available, the tester will examine
    the low-level design of the code; otherwise, the tester will examine the structure
    of the code by looking at the code itself. Unit testing is generally done within
    a class or a component. Programmers will nearly always press the correct buttons
