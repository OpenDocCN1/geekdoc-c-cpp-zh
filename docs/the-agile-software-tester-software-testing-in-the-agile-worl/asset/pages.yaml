    ![](img/9ad62c521b3df94dc74d517230e21e72_32_1.png)


    # Boundary Value Testing (BVT) is a testing technique that is based on the proven
    concept that "error aggregates at boundaries". In this testing technique, testing
    is done extensively to check for defects at known boundary conditions. A classic
    example of this is if a field accepts values from 1 to 99 then testing is done
    for values 0, 1, 2, 98, 99 and 100 because these are the boundaries. In this example
    1, 2, 98, 99 are valid while 0 and 100 would be invalid. Tests can be designed
    to cover both valid and invalid boundary values. When designing test cases, a
    test for each boundary value is chosen.'
