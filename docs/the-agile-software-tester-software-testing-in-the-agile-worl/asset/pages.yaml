  md: '# # Lean Programming: Producing JIT


    # leanthinking


    ![](img/9ad62c521b3df94dc74d517230e21e72_117_0.png)


    Lean is not as popular as Scrum or XP and has not been discussed so far in this
    book. It is, however, a valid and productive framework for agile that should always
    be considered when a company is contemplating a move to agile. Lean has its origins
    in manufacturing. Way back in the depths of time, well okay the 1940s in Japan,
    a small little company called Toyota wanted to produce cars for the Japanese market
    but couldn''t afford the massive investment that tooling for mass production requires.
    Therefore they studied the way supermarkets worked, noting how consumers only
    buy what they need, secure with the understanding there will always be a supply
    of the goods they purchase. They also noted and how the stores restock shelves
    only as they empty. From this observation, Toyota created a JIT (just in time)
    process that it could translate to the factory floor.


    The result was a significant reduction in the inventory of parts and finished
    goods and a lower investment in the machines, people, and space required. The
    JIT process gives workers the ability to make decisions about what is most important
    to do next.


    The workers take responsibility for the results. Toyota''s success with JIT processes
    has helped change mass manufacturing approaches globally and as'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'a result, they are now one of the largest car producers in the world.


    The seven tried and tested principles of lean manufacturing can be applied to
    software development. These can be used to optimise the whole IT value stream.
    Lean software development principles are as follows. Eliminate waste, build in
    quality, create knowledge, defer commitment, deliver quickly, respect people,
    and optimise the whole.'
  merge: -1
