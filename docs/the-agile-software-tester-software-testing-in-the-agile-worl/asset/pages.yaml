    The most visible part of testing is the actual test execution. This is what most
    people will associate with testing. But to be truly effective and efficient, test
    plans should also include time spent on planning the tests, designing the test
    cases to be used, preparing the system for the test execution and finally evaluating
    the results. Therefore, for each development life cycle, a full test is required.
    A test plan is a guide to how the test strategy and project test plan apply to
    the software under test. It is important to document any exceptions to the test
    strategy, e.g. only one test design technique needed for this functional area
    because it is less critical than the overall project. Both dynamic testing and
    static testing can be used as a means of achieving similar objectives and will
    provide information that can be used to improve both the system tested and the
    development and testing processes, the actual methods available will be discussed
    further in this book.


    An important consideration of testing is that different viewpoints of testing
    will take different objectives into account. By example, in development testing
    (e.g., component, integration and system testing) the main objective may be to
    cause as many failures as possible so that defects in the software code are identified
    and can be fixed before the final release.


    By contrast in user acceptance testing (UAT), the main objective may be to confirm
    that the system works as expected, has a good, well designed user interface and
    will allow interested parties to gain confidence that the system has met all the
    requirements and is in a state of done. In some cases, the main objective of testing
    may be to assess the quality of the software (with no intention of fixing defects),
    to give information to stakeholders of the risk of releasing the system at a given
    time.


    Maintenance testing often includes testing that is designed to ensure no new defects
    have been introduced during the latest development cycle, merging of changes and
    bug fixes. During operational testing, the main objective may be to assess system
    characteristics such as reliability or availability.'
