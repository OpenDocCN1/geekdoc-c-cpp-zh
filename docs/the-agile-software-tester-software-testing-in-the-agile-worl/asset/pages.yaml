  md: 'Now getting back to API''s. The first step when trying to understand how a
    set of APIs function is to read the supplied documentation.


    Unfortunately, API documentation can be poor or limited so working on a new projected
    always ask for a complete documentation. This should be in the form of an API
    agreement which will inform you what an API does. An API contract is a shared
    understanding of what the capabilities of the interface are, allowing for applications
    to be programmed on top of and tested in Postman. The information supplied should
    include a description of each API, a full list of the parameters you can pass,
    what parameters you should expect in return and what (if any) authorisation information
    you will need to supply.


    In the APIs for testing are inhouse and being have been developed by your companies
    own developers these people can also be a reliable source of information on how
    you can test the API. Also being able to access the actual code is another way
    of understanding how to test them.


    Now us look at authentication. Some APIs are public and the allow anyone to interact
    with it. Others will require authentication so to interact with these you will
    need to authenticate yourself in some way. How this works will vary from one API
    to another and therefore it is important to read the API documentation in advance.


    With public APIs a common way of gaining access is through a personal token. Then
    you can access their APIs. Let us see a real example of this, if you have a https://github.com/settings/profile


