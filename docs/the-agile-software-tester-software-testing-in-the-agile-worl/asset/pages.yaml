  md: '# # The Selenium Command Set


    # Finding elements


    No matter if you are using Java, Ruby or C#, one of the critical requirements
    of automated testing will always be the ability to identify and locate elements
    from the web page under test and then being able to perform tests on these elements
    that will confirm the data returned is both valid and correct. This means that
    the tool in use must be able to recognise the web elements quickly, correctly
    and effectively.


    Selenium WebDriver (Watir for Ruby) is a tool that provides one of the most advanced
    techniques for locating elements on web pages in various popular web browsers.
    Selenium''s feature-rich API provides reliable multiple locator strategies such
    as ID, Name, CSS selectors, XPath etc. With Selenium, you are also able to implement
    custom locator strategies for locating elements. Essentially these locators are
    the mainly of your tests. Using the right locator for the situation ensures the
    tests are faster, more reliable and have a lower maintenance overhead in future
    releases. In any web development project regardless of what development language
    is used, it is always good practice to assign meaningful attributes such as Name,
    IDs or Class to all the elements that exist on the web page. This makes the application
    more readable, testable and conforms to existing accessibility standards. There
    are rare occasions, however, when following these practices is simply not possible.
    For such scenarios, you will have to use advanced locator strategies such as CSS
    selector and the XPath function.


    While both CSS selector and XPath are popular among most Selenium users, the CSS
    selector option is recommended over XPath due to its simplicity, speed, and performance
    advantages.


    Locating elements in Selenium WebDriver is done by using the findElement() and
    findElements() methods provided by WebDriver and WebElement class.


    The findElement() method returns a WebElement object based on a specified search
    criterion or throws an exception if it does not find any element'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'matching the search criteria.


    The findElements() method returns a list of WebElements matching the search criteria.
    If no elements are found, it returns an empty list.


    Find methods take a locator or query object as an instance of By class as an argument.
    Selenium WebDriver provides By class to support various locator strategies.


    The following table lists various locator strategies currently supported by Selenium
    WebDriver:


    +   Strategy Syntax

    By ID C#: driver.FindElement(By.Id(<elementID>))

    Java: driver.findElement(By.id(<element ID>))

    Ruby: browser.div(id: "header")

    By name C#: driver.FindElement(By.Name(<element name>))

    Java: driver.findElement(By.Name(<element name>))

    Ruby: browser.text_field(name: ''header_name'')

    By class name C#: driver.FindElement(By.ClassName(<element class>))

    Java: driver.findElement(By.ClassName(<element class>))

    Ruby: browser.text_field(class: ''header_name'')

    By tag name C#: driver.FindElement(By.TagName(<htmlmtagname>))

    Java: driver.findElement(By.TagName(<htmlmtagname>))

    Ruby: browser.element(tag_name: ''div'')

    By link text C#: driver.FindElement(By.LinkText(<linktext>))

    Java: driver.findElement(By.LinkText(<linktext>))

    Ruby: browser.button(text: "Button 2")

    By partial link C#: driver.FindElement(By.PartialLinkText(<linktext>))

    Java: driver.findElement(By.PartialLinkText(<linktext>))

    Ruby: browser.button(text: .*/Button**/)

    By CSS C#: driver.FindElement(By.CssSelector(<css selector>))

    Java: driver.findElement(By.CssSelector(<css selector>))

    By XPath expression C#: driver.FindElement(By.XPath(<xpath query>))'
