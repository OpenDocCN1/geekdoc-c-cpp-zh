  md: '# # Test Driven Vs Behaviour Driven


    # ## Test-Driven Development (TDD)


    When I first encountered TDD, the idea appeared to be simple, however, it soon
    became obvious this was no one-trick pony. TDD is a very widespread software development
    technique that involves writing automated test cases before writing the actual
    functional code. This technique is now popular in agile methodologies as it helps
    drive development towards delivering a complete, shippable artefact at the end
    of a sprint. The process itself can be divided into the following steps:


    +   1. First, a programmer, with the assistance of requirement documents, will
    write a new automated test case(s) for the ticket.

    2. The development team will then execute these automated test scripts against
    the currently developed software. These tests should fail at this point because
    the new functionality and features are implemented.

    3. If the tests pass then they are incorrect, and they will need re-engineering.

    4. The programmers will then write the actual code to produce a tested deliverable
    at the end of the sprint which will pass the tests.

    5. If the programmer has written the code well then, the next run will see that
    their tests pass.

    6. The developer can then refactor their code with comments, enhancements as they
    wish because if the tests fail again, they will know it is them that has broken
    it.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Behaviour Driven Development (BDD)


    BDD is a software development technique that defines the user behaviour before
    writing test automation scripts or the functional pieces of code. Used in an agile
    sprint, this method ensures that a shippable product is generated at the end of
    a sprint. At its core, BDD expands on TDD by narrowing the notion of behaviour.
    BDD states that tests should be defined in terms of the behaviour of a unit. The
    basic outline is shown below.


    The behaviour of the user is defined by a product owner/business analyst/QA in
    simple English as a User Story, for example.


    +   As a [role].

    I want [feature].

    So that [benefit].

    Acceptance Criteria: Goes here


    These are then converted to automated scripts to run against functional code,
    for example.


    +   Given [context]

    And [more context]

    When [event]

    Then [outcome]

    And [more outcomes]


    The programmer then starts writing the functional code.

    And the QA writes the test script which is then executed against the new code.


    BDD is easy to read and the behaviour is defined in English. This gives a common
    ground for all stakeholders involved in the project. As a result, the requirements
    are understood by all and this reduces the risk of developing code that wouldn’t
    stand up to the accepted behaviour of the user.'
  merge: -1
