  md: '# Preface


    In the world today many forward-thinking, fast-moving organisations have adopted
    the agile software development framework fully with a carefully planned strategy
    and 100% company commitment. This leap of faith means they are hopefully reaping
    the benefits gained from this strategy, however, there are still plenty of software
    companies out there who have, for one reason or another, not engaged in the framework.
    These companies still ignore the agile framework methodology or they have simply
    placed a task board in the centre of the office and stated ‘there, now we are
    agile’


    While it is true that the agile methodology is not for everyone and not every
    software development project is suited to the framework it, however, the way forward
    for the majority of companies who are involved in modern software development.


    As agile has grown in popularity and usage over the decades the amount of literature
    about the subject has also grown tremendously. Sadly, however, most of the books
    currently available on the market focus on the project management or the code
    development areas of the software development life cycle, there is still very
    little for the aspiring agile software quality assurance (QA) tester to read.
    In the agile world. Testing and the software QA are as important as any other
    function or that is why I have written this book. Hopefully experienced and new
    QA''s alike will find useful pointers within these humble pages which will help
    them enhance their career and enjoyment of testing software.


    Test professionals involvement in agile projects remains challenging because of
    the very different nature of the agile methodology compared to older methodologies
    such as waterfall and the V Modal. This is also not helped by a level of misunderstanding
    about the true nature of agile that persists in many companies and deep-rooted
    prejudices aimed at QA''s by a very small percentage of programmers and project
    managers (they are nothing than failed programmers being a common misconception).


    Although many professionals are succeeding in agile projects, many others continue
    to struggle to succeed and achieve their true potential that their skills and
    dedication deserve. QA''s who have spent many years testing'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'outside of agile can also often struggle to make the jump across from the waterfall
