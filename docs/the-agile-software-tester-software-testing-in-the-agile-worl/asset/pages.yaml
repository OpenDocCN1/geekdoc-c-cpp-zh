  md: '# # Conclusion


    So here we are then, over two hundred pages into this nice little book, and you
    are still here, so hopefully, you have enjoyed this publication and found the
    contents interesting, useful and valid to your needs.


    If you become a full-time agile tester in the future or you already there, I hope
    you will enjoy your career. Testing can at times become monotonous and as deadlines
    loom it can also become very stressful. As I have already pointed out not everyone
    is suited for software testing. Others can do it but only for a short time. People
    with the right mindset and temperament as a career are a scarce but valuable commodity.
    If you are one of these people then good for you, grow your skills and enhance
    your career, you will always be in demand.


    Being a software tester in an agile team can be a more rewarding experience than
    working in a traditional organisational setup. Being part of a closely-knit team
    who are together in regular meetings helps build knowledge and confidence in the
    product. This, in turn, helps make the testing process more rewarding and less
    stressful experience. As your knowledge and skillset will grow your confidence
    in becoming a more pro-active team member. This may well annoy some old school
    programmers who may still think you should should be seen and not heard but this
    is, to put it bluntly, their problem.


    So, if you stay in software testing for a long period of time or you eventually
    move on to other things such as project management, I hope you enjoy the agile
    experience and I hope you have enjoyed reading this book. So, to conclude in the
    next chapter we will look at some of the more common agile myths.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# The Agile Myths


    Agile has been around for a few years now and is now considered a tried, trusted
    and established development approach. However, for companies that have not yet
    adopted agile it still represents a new way of life and as a result of the way
    agile works can still cause unrest among those who have never used it. The prospect
    of working in iterations instead of with a linear approach can be unsettling to
    managers and programmers who are deciding whether to make the leap to agile. They
    fear that focused efforts will be compromised and that control over projects and
    development teams will be sacrificed. In reality, of course, nothing is further
    from the truth, so let''s get rid of some of the myths that surround agile.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Agile Is a Fad


    agile is not a new fad. The Agile Manifesto was published in 2001; the Scrum Pattern
    language was presented in 1995 during the Object Oriented Programming, Systems,
    and Languages (OOPSLA) conference and there are some who trace agile’s roots back
    still.


    So, the agile approach to project management is far from a fad. Agile has been
    in for many decades even though it was only recently formalised with the Agile
    Manifesto and its associated principles.

    Agile exists because it works. Compared with traditional project management approaches,
    agile is better at producing successful projects.


    # Agile Means No Documentation


    While some people believe that being agile means one doesn’t need any documentation,
    that’s hardly the truth; you can have as much documentation as you like in agile.
    Documentation is just another deliverable; if it brings value then schedule it
    and produce it like anything else. Agile teams keep their documentation as lightweight
    as possible, but they do document their solutions as they go. They follow strategies,
    such as documenting continuously and writing executable specifications.


    # Agile Is a Silver Bullet


    Proponents of Agile will sometimes claim that to Agile will "fix all your problems."
    That isn''t the case. Agile isn’t needed for every team in every situation. It
    isn’t a cure-all. Agile is a superb solution for projects that are in development
    or undergoing radical changes.


    It’s important to stress that the Agile Manifesto is a set of values and principles
    that define a core aptitude for software development.


    These values point to collaboration, rapid feedback loops and. If your project
    has a stable customer base and isn’t undergoing a lot of change in the code, you
    may not need to use agile for that project. But for projects that are creating
    a new product or major updates then agile is the best way to go.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# It’s enough for our Development Team to Be Agile


    This is so far from the truth that travelling to Pluto would be closer. For agile
    to work properly within your company, all the teams must buy in fully. So, if
    your development team is agile, but your testing team is still a group of admin
    staff pulled when needed, you will not get your best results, in fact, things
    could get worse. Your agile delivery process is only going to be as effective
    as your slowest group. To agile succeed at its greatest potential, make each piece
    of the chain as efficient as possible.


    # Agile Won’t Work at My Company


    When I hear this statement I always think why? What is your problem? I never think
    why the company cannot adopt agile I think why this person says it will not work.


    For many companies, the biggest challenge they face when considering changing
    to agile is the cultural change involved when implementing the changes. For some
    people, this is a major challenge and they would rather it not happen. Agile has
    explicit methods of frequent feedback and loops, which means that programmers,
    QA’s and managers may feel more exposed to scrutiny. But that doesn’t mean agile
    won’t work at your company, it may mean some people should no longer be working
    at your company though. So, remember folks, agile is a team approach. Roles are
    cross-functional and shared. Programmers become testers and more frequent delivery
    creates more exposure and personal accountability.


    # There''s Only One Way to Do Agile


    This is so wrong. The Agile Manifesto consists of four values and 12 principles;
    it doesn’t document implementation details. There are many interpretations of
    Agile, including Scrum, XP, Kanban and Feature-Driven Development, to name a few.
    Each style has benefits, as well as እንደሚ, and you must evaluate your own specific
    situation to determine which interpretation is the best match. If you’re adhering
    to the Agile Manifesto''s values and principles, you should be considered Agile.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Agile Isn’t Disciplined


    Sometimes agile can seem chaotic because it’s a very collaborative process. Agile
    is a departure from the rigid assembly-line process. The iterative approach requires
    rapid response times and flexibility from the team. Agile demands greater discipline
    than what’s typical of traditional teams. Agile requires teams to reduce the feedback
    cycle on many activities, incrementally deliver a consumable solution, work closely
    with stakeholders throughout the life cycle, and adopt individual practices which
    require discipline.


    # Agile Is Only Effective for Collocated Teams


    In an ideal world, the whole team would be located within proximity of one another.
    However, currently, most development teams are distributed around the globe. While
    this can be a challenge with the right tools and planning it can still work. Just
    remember, to succeed, you need to adopt practices and tooling that build team
    cohesion. Careful planning is the key here.


    # Agile Means “We Don’t Plan”


    With agile’s reliance on collaboration instead of big documents, it may well seem
    like no real planning occurs. But the planning is incremental, well understood
    and evolutionary.


    # Agile Is Unsuitable for Regulated Environments


    Regulated environments are those that are subject to some regulatory mandates,
    such as defence organisations, medical suppliers, financial companies and government
    departments to name but a few. These organisations are audited from time to time
    for compliance with regulations. With agile, these organisations can feel confident
    when they endure these audits. They benefit from faster delivery of data and higher
    quality of their output.'
  merge: -1
  pgno: 356
