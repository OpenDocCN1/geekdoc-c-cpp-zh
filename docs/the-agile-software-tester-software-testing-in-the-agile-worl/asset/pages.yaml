  md: 'If all that worked then great, let''s move on now and try a test using the
    POST method. As you probably know GET actions return existing data if a match
    is found while POST methods are designed to create new records, JIRA has API functions
    to accomplish this so let us try one of them.


    First we insert a new HTTP header manager element in our JMeter project.


    ![](img/9ad62c521b3df94dc74d517230e21e72_273_0.png)


    This is required so that we can ensure the posted data is in json format.


    ![](img/9ad62c521b3df94dc74d517230e21e72_273_1.png)


    Now set up the HTTP request similar as below.


    ![](img/9ad62c521b3df94dc74d517230e21e72_273_2.png)


    Client implementation


    Implementation: Java


    Embedded Resources from HTML Files


    +   - Retrieve All Embedded Resources

    - Parallel downloads. Number: 6


    In the body data section add the task data, this will vary depending on your JIRA
    account. The key you would have created while creating your JIRA project.'
