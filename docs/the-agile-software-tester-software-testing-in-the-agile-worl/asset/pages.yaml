  pgno: 12
- img_proc: true
  md: 'when the brake pedal was pressed. Eventually, Toyota ended up recalling more
    than 9 million cars worldwide in 2010, but it wasn''t because of a mechanical
    issue. The cars suffered from a software bug that caused a lag in the anti-lock
    brake system. Overall these recalls, legal costs and other consequences are thought
    to have cost Toyota over $3 billion, a very costly bug indeed.


    # Ariane 5 Flight 501 (1996)


    – In 1996 Europe’s newest unmanned satellite-launching rocket, the Ariane 5, reused
    previously working software from its predecessor, the Ariane 4 rocket. Unfortunately,
    the Ariane 5’s faster; more powerful engines exploited a bug that was not realised
    or detected in previous models. The rocket took exception to this oversight and
    self-destructed 36.7 seconds into the maiden launch.


    # Mariner 1 (1962)


    – On July 22, 1962, the first spacecraft of NASA''s Mariner program blasted off
    on a mission to fly by Venus. Initially, all looked good as the spacecraft happily
    headed towards outer space, but after a few minutes, the spaceship began to yaw
    off course. The guidance system failed to correct the trajectory, and guidance
    commands failed to correct it manually. As the rocket veered off toward the busy
    North Atlantic shipping lanes, the range safety officer did the only thing he
    could, destroy the spacecraft. Eventually, the cause was nailed down to a mis-transcription
    of a single punctuation mark by an engineer.


    # The Mars Climate Orbiter Crash (1998)


    – This crash was eventually root caused back to a sub-contractor who had designed
    the'
