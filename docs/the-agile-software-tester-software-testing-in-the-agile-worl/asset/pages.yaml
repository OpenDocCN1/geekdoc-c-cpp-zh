  md: 'is a team game. The development team is made up of programmers, quality assurance
    testers (QA’s), product owners and stakeholders. QA’s are as important as any
    other member of the team but not more important than anyone else. Agile is a great
    tool for bringing these ideas forward and that is why this book was written.


    Regular meetings are an important part of building the team spirit it is also
    essential to ensure a well-designed, well programmed and well tested software
    package. Stakeholder involvement is also essential at every stage of the development
    cycle and I have always involved the end-user throughout the complete life cycle.
    Thankfully the agile model enforces this idea home fully. It is important to remember
    that people and projects are usually driven by known objects and deliverables.
    People tend to align their plans with the objectives set by management and other
    stakeholders, for example, to find defects or to confirm that software meets its
    objectives. Therefore, it is important to clearly state the objectives of testing
    at an early stage.


    Identifying failures during testing may be often and perceived as criticism against
    the product and against the programmer who wrote it. As a result, testing is often
    seen as a destructive activity in some eyes, even though it is very constructive
    in the management of product risks. Looking for failures in a system requires
    curiosity, professional pessimism, a critical eye, attention to detail, effective
    communication with development peers, and experience on which to base error guessing.
    These are a very special set of skills that make experienced software QA’s a very
    valuable commodity.


    As I have already indicated if errors, defects or failures are communicated constructively,
    bad feelings between the QA’s and the analysts, designers and programmers can
    be avoided. This applies to defects found during reviews as well as in testing.
    The hardest group to keep happy in these circumstances are the programmers as
    previously mentioned they tend to be a very sensitive and temper breed.


    The QA’s and test leader will need very good interpersonal skills to communicate
    information about defects, progress and risks in a constructive and non-destructive
    way. For the programmer of the software, useful information can help them improve
    their skills. Defects found and fixed during testing will save time and money
    later and reduce risks.'
