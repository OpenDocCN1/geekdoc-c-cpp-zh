    So, what you see here in the feature file and this functionality is introduced
    by the SpecFlow package. This enables the User Stories to be converted into Gherkin
    syntax test scenarios.


    A feature file may contain multiple scenarios to describe the feature''s acceptance
    tests. Scenarios have a name and can consist of multiple scenario steps. Currently,
    three types of steps define either the preconditions, actions or verification
    steps that make up the acceptance test (these three are often referred to as arrange,
    act and assert).


    The different types of steps always begin with either the Given, When or Then
    keywords respectively (in English feature files). Also, any subsequent steps of
    the same type can be linked using the [And] and [But] keywords. You will see the
    Gherkin language fits in very well with the Agile frameworks and this is a useful
    tool for translating User stories into easy to read and easy to understand acceptable
    tests.


    You will also notice the Scenario Outline syntax; this is an extremely useful
    feature which cuts down on code duplication and allows similar tests to share
    function by having variables passed to each loop as detailed in the Examples list.'
