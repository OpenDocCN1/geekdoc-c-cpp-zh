    team) skill''s and intuition as well as their experience with previously tested
    similar applications and technologies. When this style of testing is used to augment
    systematic techniques, these techniques can be useful in identifying special tests
    not easily by formal techniques, especially when applied to more formal approaches.
    However, this technique may yield widely varying degrees of effectiveness, this
    will depend on the QA''s experience and capability. Essentially the more experienced
    and better trained the tester is the more valid this type of testing will become.


    A commonly used experience-based technique is error guessing. In general, QA''s
    anticipate defects based on their previous experience and knowledge of the programmer''s
    style of coding. A well-structured approach to the error guessing technique is
    to enumerate a list of possible defects and to design a set of tests that these
    defects head on. On this systematic approach is called fault attack. These defect
    and failure lists can be built on experience, available defect and failure data,
    and from common knowledge about why software fails. Another technique used by
    experienced QA''s is exploratory testing.


    This type of testing is concurrent test design, test execution, test logging and
    learning, based on an agreed test charter containing test objectives, and carried
    out within sprints. This is an approach that is most useful where there are few
