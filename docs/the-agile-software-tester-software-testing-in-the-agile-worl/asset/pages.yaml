  md: '# Browser Commands


    In this section, we will discuss some of the browser commands which are available
    to you for use in your automated scripts. This is by no means a complete list,
    but I am sure you will find these commands very useful in the future. Please note
    that all these examples are in C#


    # Navigate to a Web Page


    The Navigate command is used to load a new web page in the current browser window,
    below is an example of how this works.


    +   - driver.Navigate().GoToUrl("https://www.kevsbox.com")


    # Get the title of the page


    The Title method fetches the Title of the current page. This method accepts nothing
    as a parameter and returns a String value, for example.


    +   - string Title = driver.Title;


    # Get the current URL


    The URL method returns a string representing the Current URL which is opened in
    the browser, for example.


    +   - string CurUrl = driver.Url;


    # Get the current page HTML source


    The PageSource method returns the Source Code of the page, for example.


    +   - string pSource = driver.PageSource;


    # Close


    This method closes only the current window the WebDriver is currently controlling,
    for example.


    +   - driver.Close();


    # Quit'
