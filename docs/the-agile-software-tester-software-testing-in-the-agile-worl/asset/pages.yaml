  md: '# Moving to agile and what to avoid


    Not everything in agile is easy and straightforward. There are dangers involved
    in adopting agile blindly and pitfalls that need to be avoided at all costs. Below
    is a selection of the most common pitfalls that you and your organisation should
    be aware of, this is of course not a complete list and any move to agile should
    be carefully planned, discussed and time-framed. Nothing should be committed until
    everyone within your organisation is on board and understands what is involved
    (At least everyone who matters in the agile process, you can probably exclude
    the cleaning staff).


    Do not become agile zombies. Companies can easily fall into the trap that they
    attend an agile workshop and mandate to a certain easy to understand and out-of-the-box
    (OTOB) process, that they are now an ultra-efficient, modern agile organisation,
    this is far from true agile. These companies train their teams to blindly follow
    and enforce the anointed process while not considering what practices may need
    to change to meet their organisation''s unique needs and requirements. Remember
    agile isn''t a prescribed process or set of practices. It is a philosophy and
    framework that can be supported by adaption and a willingness to learn and no
    two agile approaches are the same. One single OOT methodology that fulfils all
    needs doesn''t exist.


    For any organisation, an effective and workable agile adoption requires complete
    executive sponsorship and full support at the highest level. This involvement
    means more than simply showing up with a big smile at the kick-off meeting to
    say a few words of encouragement and then disappearing back to the top floor and
    the golf course.


    Without the executive''s continued and proactive support of the overall initiative,
    the agile adaption is often doomed because agile initiatives require an upfront
    investment of resources and funding and continued backing during the initial stages.
    These are areas that executives typically control and if they are not fully behind
    the change or do not completely understand what is required when the required
    funding is likely to fall short of what is essential.


    Different agile companies find that they can fulfil the true spirit of the Agile'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Manifesto through different approaches. Ironically, most of these approaches
    focus on one phase or discipline within the delivery lifecycle, oddly enough this
    goes against the underlying spirit that is lean, which has always advised us to
    consider the whole. You will find that most approaches focus on the construction
    phase.


    Construction is typically a straightforward area to focus on when your company
    is taking on its agile transformation, but if companies only change the way they
    construct software, they should not be calling themselves agile, because they
    are not. The development teams could be evolving nicely along the agile path,
    happily delivering new software every two or four weeks, but if the processes
    in other areas of the company only allow for deployment every four months or customer
    stakeholders aren''t prepared to meet regularly, then the company is not realizing
    all the benefits agile can provide and as a result is not agile.


    That well known but often ignored adage, “If you fail to plan, plan to fail,”
    is true in the agile world. Therefore, the early forms of agile, typically RAD,
    had started to get a bad name.


    Corners were often cut, and the agile principles were not always adopted, as a
    result, some early agile projects failed just as badly as earlier projects using
    using methodologies such as waterfall. However, for some companies, the lesson
    was quickly learned, RAD became Agile and a reboot of the framework started.


    Good planning is core to the success of any agile adoption no matter how large
