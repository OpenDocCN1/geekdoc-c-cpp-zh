  md: '# 2: The Iteration/Sprint Meeting


    ![](img/9ad62c521b3df94dc74d517230e21e72_92_0.png)


    The next meeting is the iteration/sprint planning meeting. In Scrum, every iteration
    or sprint (typically 2-4 weeks) begins with the sprint planning meeting. At this
    meeting, the Product Owner and the development team will negotiate which stories
    the team will tackle during the current sprint.


    These meetings are typically time-boxed to eight hours, which helps to focus the
    group and ensure no time is wasted on idle chatter such as the weekend’s football
    results or what each team member would like to purchase.


    The final choice of what stories are to be included will always rest with the
    Product Owner. Typically, the team has the power to push back and value concerns
    about impediments and dependencies.


    When the story list is decided and agreed this becomes the required work for the
    current sprint. Team members choose what they will each do. Nothing is assigned
    or pushed onto anyone. The result of this meeting is the sprint backlog.


    So, as you see the sprint backlog is a negotiated set of items/stories from the
    product backlog that a team commits to code and test during the timebox of the
    current sprint. Items in the sprint backlog are broken into detailed tasks for
    the team members to complete. The team works collaboratively to'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'complete the items in the sprint backlog, meeting each day (during a daily
    scrum) to share struggles and progress and update the sprint backlog and burn
    down chart accordingly.


    A sprint will typically last for 4 weeks, this can vary slightly but 4 weeks is
    by far the most common time frame. This is also known as time-boxed development.
    In time-boxed development, the end calendar date for the Sprint is determined
    at the outset. The Sprint is then complete once that day is met and all work that’s
    going to be launched needs to be done.


    This work will have passed through QA and testing and is deemed and ready for
    launch. Time-boxing the Sprint requires a much sharper focus on prioritising work
    since you can’t push the end date if work isn’t done.


    Features that aren’t complete can get pushed to the next Sprint. However other
    constraints or concerns may result in them being placed back in the backlog. This
    forces decision-making much earlier on what will and what won’t make it into the
    Sprint. Hard decisions on prioritising work should be done done right at the outset.
    Decisions on what features get pushed to the next Sprint must happen very early,
    this helps ensure that no testing cannot be completed before the end of the Sprint.'
