  md: 'Daily scrum – 15 minutes


    Sprint Review – 4 hours for monthly sprint


    Sprint Retrospective– 3 hours for monthly sprint


    # The Definition of Scrum


    Scrum is a process framework within which teams and organisations can address
    difficult and complex adaptive problems, while productively and creatively delivering
    products that are of the highest possible value.


    Scrum is:


    +   - Lightweight

    - Simple to understand

    - Difficult to master


    So, scrum has been around since the early 1990s. It is not a process or a technique
    for building products. Indeed, it is a framework within which your company can
    employ various processes and techniques. Scrum makes the relative efficacy of
    your product management and development practices so that you can improve.


    # The Scrum Theory


    Scrum is founded on empirical process control theory, otherwise known as empiricism.
    Empiricism asserts that knowledge comes from experience and making decisions based
    on what is known. Scrum employs an iterative, incremental approach to optimise
    predictability and control risk. Three pillars uphold every implementation of
    empirical process control: transparency, inspection, and adaptation. So, let’s
    have a closer look at these three pillars.


    # Transparency


    Significant aspects of the process must be visible to those responsible for the
    outcome. Therefore, transparency requires those aspects to be defined by a common
    standard, so all observers share a common understanding of what is being seen.


    # Inspection'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Scrum users should frequently inspect Scrum artefacts and the progress toward
    a Sprint Goal to detect undesirable variances. These inspections should not be
    so frequent however that inspection gets in the way of the work. The inspections
    are most beneficial when diligently performed by skilled inspectors at the point
    of work.


    # Adaptation


    If the person doing the inspection determines that one or more aspects of a process
    deviate outside acceptable limits and that the resulting product will be adjusted,
    the process or the material being processed must be altered and adjusted. An adjustment
    should be made as soon as is possible to minimise further deviation.


    Scrum prescribes four formal events for inspection and adaptation; these have
    already been mentioned but as a reminder they are:


    +   - Sprint Planning

    - Daily Scrum

    - Sprint Review

    - Sprint Retrospective'
