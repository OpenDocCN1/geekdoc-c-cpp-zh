    **Label:** In the section below you will be able to see all the recorded http
    request, during run or after test run.


    **Samples:** Samples denote to the number of http request run for given thread,
    or the average time taken to receive the web pages.


    For Example we have one http request and we run it with 5 users, the number of
    samples will be 5x1. So if the ran two times for the single user, then the number
    of samples for 5 users will be 5x2=10.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '**Average:** Average is the average response time for that particular http
    request. This response time is in millisecond. This an Arithmetic mean for all
    responses (sum of all times / count)


    **Min:** Min denotes to the minimum response time taken by the http request.


    **Max:** Max denotes to the maximum response time taken by the http request.


    **Std. Deviation:** This shows many exceptional cases were found which deviating
    from the average value of the receiving time. The lesser this value more consistent
    the time pattern is assumed.


    **Error %:** This denotes the error percentage in samples during run. This error
    can be of 404(file not found) or may be exception or any kind of error during
    test run will be shown in Error %. In the above image the error % is zero, because
    all the requests ran successfully.


    **Throughput:** The throughput is the number of requests per unit of time (seconds,
    minutes, hours) that are set to your server during the test. Larger is better.


    **KB/Sec:** The throughput measured in Kilobytes per second


    **Avg. Bytes:** Average response size of the sample response in bytes.


    And there is also the Response Time Graph


