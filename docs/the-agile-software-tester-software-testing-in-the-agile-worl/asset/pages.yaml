  md: 'One possible approach to component testing is to prepare and automate test
    cases before the actual coding process. This is called a test-first approach or
    test-driven development (TDD, See Chapter 14). This approach is highly iterative
    and is based on cycles of developing test cases, before building and integrating
    the component tests correcting any issues and iterating until they pass.


    This may seem a strange way of doing things at first, but with practice it''s
    much more efficient than writing a bucket load of code, running it, and going
    back later to figure out everywhere it''s broken (a process that is known as debugging).
    This process puts the programmer in a testing mindset while writing code, which
