    stories or b) tasks. Likewise, epics may be decomposed into user stories, and
    tasks may be decomposed into more finer-grained tasks. Decomposition is usually
    performed during backlog grooming and iteration planning and is an important precursor
    to story sizing (estimation). Decomposition may also occur throughout the development
    process. In the typical product backlog, user stories will become finer-grained
    as they near implementation and are larger and less detailed the further down
    the queue they reside.


