  md: '# Structured Query Language


    Structured Query Language (from now on referred to as SQL) is the standard language
    for relational database management systems. SQL statements are used to perform
    tasks such as add or update data on a database or retrieve data from a database.
    Some common relational database systems that use SQL are Oracle, MySQL, Microsoft
    SQL Server, Access and PostgreSQL. Although most database systems use SQL, most
    of them have their own additional proprietary extensions that are usually valid
    on their system. However, the standard SQL commands as Insert, Select, Update,
    Delete, Create and Drop can be used on all of these systems. A competent QA should
    have basic knowledge of SQL to perform their daily testing tasks. This will enable
    you to add and alter test data, refresh databases and understand the end results
    of tasks that manipulate data. This chapter will provide you with an introduction
    to the basics of each of these commands as will allow you to put them to practice
    using the SQL Interpreter.


    For these examples, I will be using a MSSQL database however the commands will
    work on any of the other systems with little or no alteration.

    First, we need to create a new Database. This is achieved by the “CREATE DATABASE”
    command. For these examples we will assume you have Microsoft SQL Management Studio
    or something similar installed and have access to a MSSQL server. So, to create
    the database follow these steps with Management Studio:


    ![](img/9ad62c521b3df94dc74d517230e21e72_321_0.png)


    Run this command - CREATE DATABASE spiceteworld;

    This will create an empty database called spiceteworld. You can of course'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'use a different name if desired.

    Next, you will need to create some tables within this new database. So, let us
    first start with a table to hold records on motorbikes. So now execute this command


    ```

    CREATE TABLE MotorBikes (

    Id int NOT NULL IDENTITY(1,1),

    Reg VARCHAR(20) NOT NULL,

    Vin VARCHAR(40) NOT NULL,

    MainColour VARCHAR(45) NULL,

    EngineCC VARCHAR(10) NULL,

    PRIMARY KEY (Id)

    ```


    This will create a new table which is ready for data. The ‘Id’ field is the main
    index field and is automatically populated with a unique number every time a new
    record is created. Indexes are an especially important element of tables, especially
    if you are dealing with thousands or millions of records. They should be used
    for columns that are unique elements, used to link tables or used commonly for
    searching. However not every column should be indexed, there is a drawback, the
    more indexes the larger the database and eventually, the speed gained by using
    indexes will be lost. If you view the design of this new table, you will observe
    something like this.


    | Column Name | Data Type | Allow Nulls |

    | --- | --- | --- |

    | Id | int | |

    | Reg | varchar(20) | |

    | Vin | varchar(40) | |

    | MinColour | varchar(45) | x |

    | EngineCC | varchar(10) | x |


    Whenever possible use columns on the type [Int] for indexes and try to avoid using
    Narchar. Indexing by text will generate large and slow indexes. Note the ‘spiceteworld’
    entry, this is the name of the Schema I am using for these examples, yours will
    be different.


    You should also note that it is possible to create 1 table from all or part of
    an existing table, for example:'
  merge: -1
