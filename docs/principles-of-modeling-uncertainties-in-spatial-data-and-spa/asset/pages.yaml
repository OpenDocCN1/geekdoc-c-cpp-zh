    # 3.4 THE DEMP-SHAFER THEORY OF EVIDENCE


    Shannon (1948) first studied uncertainty problems using probability theory. In
    the 1980s, Klir and Folger applied the Dempster-Shafer theory of evidence (abbreviated
    as D-S evidence theory) to investigate uncertainty problems (Klir and Folger,
    1988). Compared with the probability theory that deals with one kind of uncertainty
    (randomness), the evidence theory provides a way to assess two distinct types
    of uncertainty (discord and nonspecacity). The D-S evidence theory for dealing
    with an uncertainty problem is briefly introduced below. Further details are found
    in the work of Yager et al. (1994).


    # 3.4.1 TERMINOLOGIES AND SYMBOLS


    Suppose X is a finite set and $P(X)$ is a power set of X (the correction of all
    the subsets of X). A function $m$ is defined as


    ```

    $m: P(X) \rightarrow [0,1].$

    ```


    which satisfies two conditions:


    ```

    $m(\varnothing) = 0$

    ```


    and


    ```

    $$\sum_{A \in X} m(A) = 1$.

    ```


    The above is a function of basic probability assignments. The value $m(A)$ is
    a basic probability assignment for predicate A. It represents a level of support
    for A containing one element in X.


    For any $A \in P(X)$, A is said to be a focal element if $m(A) \neq 0$. Let $F$
    be a collection of all focal elements. A pair $(F,m)$ is called the body of evidence.'
