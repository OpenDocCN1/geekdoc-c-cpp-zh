    # 13.7 SUMMARY AND COMMENT


    Coordinate transformations from image space to object space can be realized by
    two approaches: (a) point-based models and (b) line-based models. These two approaches
    can be either rigorous physical models or nonrigorous empirical models. In the
    absence of the satellite orbit or other related information, the empirical models
    provide a main stream solution, where polynomials or rational functions are used
    for examples.


    If not enough control points are available, the line-based transformation model
    (LBTM) provides an alternative solution. The model is based on the unit vector
    and forms the relationship between image space and object space. Both point-based
    and line-based transformation models can be applied for image rectification, spatial
    resection, and intersection, being key techniques for modeling a three-dimensional
    surface based based on satellite images.'
