  md: '# Metadata on Spatial Data Quality 359


    share the same attribute value. Completeness can be measured either in terms of
    a Boolean value, an integer, or an estimated percentage value.

    The Boolean result can be gained by comparing the number of data items against
    the number of items in the universe of discourse, which, as indicated above, is
    the number of excess items in the data set exceeds the acceptable level of commission,
    this test will fail and give the value "false"; otherwise, the Boolean result
    for evaluation test will be "true"; if the number of absent items in the data
    set is larger than the acceptable level of omission, this omission test will fail
    and report "false"; otherwise, the omission test will pass and give the result
    as true.


    The second method is again based on a comparison of the number of items in the
    data set and the number of items in the universe of discourse. The excess data
    number and the absent data number in the data set are reported as commission and
    omission, respectively.


    The excess item number in the data set can be further divided by the total number
    of items in the universal abstract and multiplied by 100. In a similar manner,
    omission can be measured by dividing the number of missing items in the data set
    into the number of items in the universal abstract and multiplying the result
    by 100. This approach gives accuracies of commission and omission in percentage
    format.


    # 16.2.3 LOGICAL CONSISTENCY


    Logical consistency is the degree of adherence to the logical data structure rules
    and spatial data attribute rules. ISO 19115 classifies logical consistency into
    conceptual consistency, domain consistency, format consistency, and topological
    consistency. Conceptual consistency deals with rules of the conceptual schema.
    Domain consistency is the degree of adherence of values to the value domain. Format
    consistency deals with the degree to which data are stored in accordance with
    the physical data structure. Topological consistency deals with the correctness
    of the explicitly encoded topological characteristics of a data set.


    Each portion of the logical consistency subclass can be described in terms of
    Boolean variables, number, and percentage.


    # 16.2.3.1 Measures for Conceptual Consistency


    Conceptual consistency aims to report any violation of the conceptual schema of
    features. It can be measured as follows.


    The number of features and relationships between features, that violate the conceptual
    data schema, is counted. If this is not greater than the acceptable violation
    level in the data set, a Boolean variable will be assigned as true. If the number
    is greater than the acceptable level of violation in the data set, the Boolean
    variable will be assigned as false. This Boolean variable is one of conceptual
    consistency.


    Conceptual consistency can also be assessed by counting the feature numbers and
    the relationships between features that violate the conceptual schema, or by dividing
    the result into the number of features and relationships between data'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    set features and multiplying the result by 100. In these ways, number and percentage
    accuracy descriptions are provided.


    # 16.2.3.2 Measures for Domain Consistency


    Domain consistency deals with item attributes (features in vector format or pixels
    in raster format) within a data quality scope that does not lie within a certain
    domain.


    The Boolean variable for describing domain consistency is determined based on
    the comparison of item attributes within the data as specified by the scope acceptable
    attribute domains. The number of items with attributes outside the attribute domain
    is counted. If this is larger than the acceptable level of items with attribute
    violations, the Boolean variable will have the value "false"; otherwise, the Boolean
    variable will have the value "true".


    The number of items within the scope, the attributes that are outside the attribute
    domain, can also be reported in metadata for data specified by the data quality
    scope. This number may be divided by the number of items with attribute violations
    into the total number of items in the data set, as specified by the data quality
    scope; the result is multiplied by 100. This result expresses the accuracy measure
    in percentage terms.


    # 16.2.3.3 Measures for Format Consistency


    Format consistency is the degree of adherence to the format of a specified field.
    Similar to the above inconsistencies, a Boolean variable can be given to a number
    or percentage to depict the format consistency.


    The Boolean variable is defined by comparing the record structure for all items
    with the specified field definitions and structures. Those items having format
    violations are counted. If the number of items is not larger than the acceptable
    level of the items violating the specified format, the Boolean variable will be
    assigned as true; otherwise, the Boolean variable will be assigned as false.


    The number of items within the data set scope that violate the specified format
    is counted and recorded in metadata. The percentage is defined by dividing the
    number of items violating the specified format into the total number of items
    within the data set scope and multiplying the result by 100.


    # 16.2.3.4 Measures for Topological Consistency


    Topological consistency comprises topological constraints for a cell complex or
    a feature type.


    A measure is defined by counting the number of items within the data scope that
    have topological inconsistencies. The percentage is defined by dividing the number
    of items within the scope with topological inconsistencies into the number of
    items within the data set scope, and multiplying the result by 100.'
