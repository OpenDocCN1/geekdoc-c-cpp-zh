  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 1.3 UNCERTAINTY IN SPATIAL DATA


    To return to the main purpose of this book: the modeling of uncertainty in spatial
    data and analysis in the GISci domain, it is necessary to reiterate that the real
    world, modeled by spatial data, is a complex, diversified, and nonlinear system.
    This system contains a diversity of uncertainty, which results from four major
    factors: (a) uncertainty in the real world, (b) the limitation of human knowledge
    in cognition of the real world, (c) the limitation of measurement technologies
    for obtaining spatial data, and (d) the potential of generating and propagating
    uncertainty in the spatial data processing and analysis, based on captured spatial
    data.


    This book specifically addresses the latter two factors: uncertainty due to limitations
    in measurement technologies and uncertainties generated and propagated in spatial
    analysis. The limitations in the measurement technologies lead to error-prone
    measurement. Accuracy of a measured result can, therefore, only be within certain
    level. However, a deeper understanding of natural phenomenon can be deduced from
    further analyses of captured data, spatial analyses in GISci. In GISci, three
    fundamental issues are of importance: (a) space and time in geography, (b) uncertainty
    and spatial data quality, and (c) spatial analysis. The second fundamental issue
    is addressed in this book.


    It is estimated that phenomena up to over 70% in the real world are position-related,
    and also can be described by spatial data. Spatial data can depict the location,
    shape, and size of spatial data, and relationships between spatial entities. The
    location of the spatial entity is usually described in two- or three-dimensional
    space. The spatial data can be further grouped into two categories: geometric
    and relational. The former type labels a spatial object geometrically as a point,
    a line, or a polygon. The latter describes relationships between spatial entities
    in terms of adjacency, containment, contiguity, and connectivity. In descriptions
    of the natural world, such as a certain phenomenon, process, property, characteristics,
    or status, spatial data can be in the form of text, numbers, figures, formulae,
    tables, or images.


    During the past two decades, uncertainty modeling and the quality of spatial data
    have been studied by many researchers and organizations; for example, quality
    elements of spatial data are addressed by SDTS (1994), Goodchild and Gopal (1989),
    Guptill and Morrison (1995), Shi et al. (2002), and ISO 19113 (2005). The dimensions
    of spatial data and data quality elements, are based on the published achievements
    of these researchers, together with further developments by the author of this
    book, are given in the following sections.


    # 1.3.1  DIMENSIONS OF SPATIAL DATA


    An entity in the real world is completely described by spatial data in various
    dimensions. Before uncertainties in spatial data are described, the dimensions
    of spatial data must first be defined. "Spatial data" is used in this instance
    as a synonym for geographic data or geometric data for describing position-related
    phenomenon. A'
