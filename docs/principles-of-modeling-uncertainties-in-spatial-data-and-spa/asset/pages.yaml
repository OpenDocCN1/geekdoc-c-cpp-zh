    \ set $A$,\n\n+   Set $A^\\circ$ is said to be the interior of $A$, if it is an\
    \ open subset of $A$; i.e., $A^\\circ = \bigcup\\{B \\in \\delta : B \\subseteq\
    \ A\\}$.\n2. The closure $\\overline{A}$ of $A$ is the intersection of all closed\
    \ subsets of $A$: $\\overline{A} = \\cap\\{B \\in \\delta : B \\supseteq A\\}$.\n\
    \n# Boundary\n\nThe boundary of a fuzzy set $A$ is defined as $\\partial A = \\\
    overline{A} \text (A^\\circ)$.\n\nDefinition 3.5.5.5: Let $(I^X, \\delta)$ be\
    \ a fuzzy topological space. The following properties are true:\n\n+   1. $\\\
    emptyset^\\circ = 0, 1^\\circ = 0, \\overline{0} = 0$, and $\\overline{1} = 1$.\
    \ This means that both the empty set and the entire set are also open and closed.\n\
    2. $A^\\circ \\subseteq A$ and $A \\subseteq \\overline{A}$.\n3. $A^{\\circ\\\
    circ} = A^\\circ$ and $\\overline{\\overline{A}} = \\overline{A}$.\n4. $A \\subseteq\
    \ B$ implies $A^\\circ \\subseteq B^\\circ$ and $\\overline{A} \\subseteq \\overline{B}$.\n\
    5. $(A \\cap B)^\\circ = A^\\circ \\cap B^\\circ$ and $A \\cup B = \\overline{A}\
    \ \\cup \\overline{B}$.\n\n# 3.5.5.2.2 Fuzzy Injection\n\nLet $(I^X, \\delta)$\
    \ and $(I^Y, \\mu)$ be two fuzzy topological spaces. A function $f : (I^X, \\\
    delta) \\to (I^Y, \\mu)$ is said to be a fuzzy injection if $A \\neq B, f(A) \\\
    neq f(B)$.\n\n# 3.5.5.2.3 Fuzzy Surjection\n\nLet $(I^X, \\delta)$ and $(I^Y,\
    \ \\mu)$ be two fuzzy topological spaces. A function $f : (I^X, \\delta) \\to\
    \ (I^Y, \\mu)$ is said to be a surjection if for every $B \\in \\mu$, there exists\
    \ $A \\in \\delta$, such that $B = f^{-1}(A)$.\n\n# 3.5.5.2.4 Fuzzy Bijection\n\
    \nLet $(I^X, \\delta)$ and $(I^Y, \\mu)$ be two fuzzy topological spaces. A function\
    \ $f : (I^X, \\delta) \\to (I^Y, \\mu)$ is said to be a bijection if it is both\
    \ an injection and a surjection.\n\nProposition 3.5.5.4: $I^X$ and $I^Y$ be two\
    \ fuzzy topological spaces and $f : X \\to Y$ be a universal projection. Function\
    \ $f : (I^X, \\delta) \\to (I^Y, \\mu)$ is a bijection only if $f : X \\to Y$\
    \ is a bijection.\n\n# 3.5.5.2.5 Fuzzy Continuous Projection\n\nLet $(I^X, \\\
    delta)$ and $(I^Y, \\mu)$ be two fuzzy topological spaces. A function $f : (I^X,\
    \ \\delta) \\to (I^Y, \\mu)$ is said to be a fuzzy continuous projection if for\
    \ every $A \\in I^X$ and for every fuzzy open set $B$ containing $f(A)$, there\
    \ exists a fuzzy open set $C$ containing $A$, such that $f(C) \\subseteq B$."
