  md: '# 2 Sources of Uncertainty in Spatial Data and Spatial Analysis


    This chapter provides a description and analysis of the various sources of uncertainty
    in spatial data and spatial analyses. A basic concept of uncertainty has been
    introduced in Chapter 1. A clear determination of the uncertainty source is necessary
    in order for the nature of uncertainty to be more precisely understood and subsequently
    analyzed. This understanding forms the theoretical foundation for the modeling
    of uncertainties in spatial data described in Section II, spatial analyses in
    Section IV, and quality control in Section V of this book.


    # 2.1 INTRODUCTION


    Uniquity is due to the complexity and uncertainty of nature, limited human knowledge
    and cognition of the natural world, limited measurement technology, and approximated
    methods used in spatial data processing and analysis. The ultimate spatial data
    and analysis results are normally obtained through a series of processes, including
    spatial data capture, storage, update, transition, querying, and analysis. Spatial
    data uncertainties are introduced, propagated, accumulated, or even amplified
    during these processes. Uncertainties in captured spatial data are related to
    many factors, such as the quality of the data capture instruments, the environment
    state during the data capture, the particular focus of observers, the map projection
    methods, and the coordinate systems used.


    One of the fundamental reasons for the generation of uncertainty in spatial data
    is a result of the nature of the differences between the complex and continuous
    nature of the real world and the simplified and discrete representation of that
    world in a computer environment, namely, the Geographic Information System (GIS).


    The sources of spatial data uncertainty are classified as follows: (a) the inherent
    uncertainty in nature, (b) uncertainty due to limitations of human cognition of
    the natural world, (c) object measurement error, and (d) uncertainties arising
    from spatial analysis and spatial data processing. A spatial data set may be affected
    more than one of these four categories. The uncertainty sources and their impacts
    on spatial data and spatial analysis are illustrated in Figure 2.1 and described
    in detail below.'
