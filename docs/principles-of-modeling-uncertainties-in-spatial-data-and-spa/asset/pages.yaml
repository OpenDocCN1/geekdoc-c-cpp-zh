    \ to the hypergeometric distribution. For $n/N \\le 0.10$, the binomial approximation\
    \ is\n\n```\n$h(x;n,D,N)=b(x;n,p)=C_n^x p^x (1-p)^{n-x}, \\quad (3.38)$\n```\n\
    \nwhere $p=D/N$.\nFor $n/N \\le 0.10$ and $D/N \\le 0.10$, the Poisson approximation\
    \ to the hypergeometric distribution equals\n\n```\n$h(x;n,D,N)=P(x,\\lambda)=\\\
    frac{\\lambda^x}{x!}e^{-\\lambda}, \\quad (3.39)$\n```\n\nwhere $\\lambda=nD/N$.\n\
    \n# 3.3.2.2 Commonly Used Continuous Distribution\n\nSeveral commonly used continuous\
    \ distributions are listed in Table 3.1.\n\n# 3.3.3 ESTIMATION OF A POPULATION\
    \ PARAMETER\n\n# 3.3.3.1 Population and Sample\n\nThe entire outcome of interest\
    \ collection is known as the *population*. A sample is a subset of the population.\
    \ Portions made up selections of population outcomes $x_1, x_2, \\dots, x_n$ is\
    \ called the *sample*. The number of outcomes in the sample makes up the sample\
    \ size. Let $n$ be the sample size.\n\n# 3.3.3.2 Statistic of the Population and\
    \ the Sample\n\nLet $X$ be a random variable from a population distribution and\
    \ $x_1, x_2, \\dots, x_n$ denote a random sample of size $n$ taken from the population.\
    \ Several statistics of the sample are listed in Table 3.2. These statistics include\
    \ mean, variance, standard deviation, beta coefficient, and coefficient of skewness."
