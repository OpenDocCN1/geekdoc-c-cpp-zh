  md: 'Modeling Positional Uncertainty in Spatial Data


    # 4.7.5 NOTE ON THE G-BAND ERROR MODEL


    In this section, the G-band model has been introduced. The model can handle positional
    error for a line segment where the two endpoints have correlated positional error.
    The model gives the analytical relationships between the band shape and size with
    the error at the two endpoints and also relationships between them.


    For a directionally independent stochastic process, the G-band degenerates to
    the error-band models. If the line is simultaneously homogeneous and directionally
    independent, the G-band model degenerates to a parallel band along the line segment,
    such as the e-band model.


    Having introduced the error modeling methods for a straight line in Sections 4.5
    to 4.7, in the following section, the focus now turns to the error modeling method
    for a curved line.


    # 4.8 MODELING POSITIONAL UNCERTAINTY OF A CURVE


    Spatial objects in GISci may be represented by another line type, the curve. For
    example, coastlines, borders, and contour lines can be represented as curves.
    A curved line can be approximated by one of the following three methods: (a) a
    series of straight-line segments, (b) a regular curve model, or (c) an irregular
    curve model.


    In method (a), a curve is represented as a series of straight-line segments. This
    method has been widely adopted in GISci. The regular curve model of the method
    (b) is to approximate a curve entity based on an analytical function. A circular
    or elliptical curve, for example, can be used to represent curved lines. In method
    (c), an irregular curve is approximated by various kinds of interpolation functions,
    such as polynomial or spline functions.


    Goodchild and Hunter (1997) proposed an error model to assess positional error
    in digitized linear features. The model was further applied to estimate the error
    in a coastline, which was approximated by a series of straight-line segments.
    Huang and Liu (1997) estimated the digitization errors in contours based on a
    line series model, where the contours were approximated by the irregular curve
    model.


    In fact, modeling error of the method (a) is similar to the error modeling for
    a polyline, which has been described earlier in this chapter. In this section,
    the concentration is on error modeling for curve lines that are approximated using
    either methods (b) or (c). Two error indicators are used to describe curve errors:
    the root mean square error in the normal direction of a curve and the maximum
    error at a point of the curve (Shi et al., 2000).


    # 4.8.1 POSITIONAL ERROR AT ANY POINT ON A CURVE


    In this section, we will derive the variance of an intermediate point on the curve
    based on the covariance of the two endpoints and that of the measured distance
    between one of the two endpoints and the intermediate point on the curve.'
