    = (1-t_1)^2\sigma_{y_1y_1}^2 + 2[(1-t_1)t_1]\sigma_{y_1y_2}^2 + t_1^2\sigma_{y_2y_2}^2$
    \quad (4.69)$

    ```


    The matrix (4.67) is, thus, an extension of the conventional covariance matrix
    of a point.


    # 4.7.3 THE G-BAND MODEL


    Refer to Figure 4.7, and let the surface for the probability density function
    of line segment $Q_1Q_2$ be cut by the plane that is parallel to the $x-O-y$ plane
    and projected onto. A class of concentric bands is obtained. The concentric band,
    which is cut by the plane passing through the ellipses of the endpoints of the
    line segment, is defined as the generic error band, the $G$-band (Shi and Liu,
    2000).'
