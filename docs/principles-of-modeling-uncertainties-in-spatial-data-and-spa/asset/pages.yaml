  md: '# # Modeling Integrated Positional and Attribute Uncertainty


    Modeling integrated positional and attribute uncertainty by the proposed “S-band”
    model is presented in this chapter, and corresponding solutions are given. The
    methods of modeling positional uncertainty have been introduced in Chapter 4,
    and methods of modeling attribute uncertainty have been described in Chapter 5.
    The proposed model is to integrate the two types of uncertainties presented in
    these two chapters. When multiple data sources are integrated for a spatial analysis,
    uncertainties in the corresponding data sources are combined. The objective of
    modeling integrated positional and attribute uncertainty is to estimate the level
    of such uncertainty.


    # ## 6.1 INTRODUCTION


    Although differences exist between attribute and positional uncertainties, both
    types of uncertainty, in many cases, are closely related. A spatial entity in
    a GIS is represented by its elements in spatial, attribute, temporal, scale, and
    spatial relationship domains. In fact, uncertainties of these elements of a spatial
    object in the domains will affect the spatial object as the whole; therefore,
    integrated uncertainty, which is composed of multiple sources of uncertainties,
    needs to be investigated. Integrated positional and attribute uncertainty is one
    example of integrated uncertainty.


    In an object-based GIS model, an object (such as a building) is represented by
    its basic geometric elements: points, lines, or polygons and their associated
    attributes (such as address and ownership of a building). Therefore, any uncertainties
    in the basic geometric elements and associated attributes have simultaneous effects
    on the identification of the spatial object. This is the same for objects in a
    field-based model, affected simultaneously by positional and attribute uncertainties.


    Typically, boundaries of an object are affected by both positional and attribute
    uncertainties in an integrated way. Therefore, the object boundary should not
    be represented as a crisp line but as a transitional region of a certain width.
    A positional error, existing in such a region may also result in attribute uncertainty.
    This uncertainty of the attribute value, the category of the land cover is identified
    from a remotely sensed image, may be caused by positional error of the image or
    attribute error in the classification. The central part of the area object is'
  merge: -1
  pgno: 191
