    # 7.4 AN APPLICATION EXAMPLE


    # 7.4.1 BACKGROUND


    Quasi coincidence was used to study the spatial distribution of severe acute respiratory
    syndrome (SARS) within a community. In this example, the effect of an infected
    region on its neighbor regions was investigated using fuzzy topology.


    SARS is a serious disease that threatens the life and health of people. This disease
    killed nearly 300 people in Hong Kong within a few months in 2003. One problem
    needing to be solved was the identification of the spatial distribution patterns
    of the disease, within a community.


    The following data sets were used for the study: a basic map of the study area,
    and within the study area, the daily infection rate within each building, the
    daily rate, the daily rate of newly infected people from each building, the daily
    ICU patient occupancy rate from the study area. (For each building in the study
    area, the number of people infected each day included the number of newly infected
    and the uncovered cases.) Some required data were not available and were simulated
    for this case.


    # 7.4.2 FUZZY TOPOLOGY FOR SARS ANALYSIS


    The effect of an infected person on a community can be modeled by the uncertain
    topological relationship between a fuzzy line and fuzzy region. $A(x[t])$ be the
    membership function of the trace of an infected person. The value of $A(x[t])
    = 0$ means the infected person is not affected by any other diseases, whereas
    the value $A(x[t]) = 1$ means there is a dense concentration of SARS viruses in
    that both.


    Let $B(x[t])$ be a community representing the condition of certain people or the
    situation of point x at time t. $B(x[t])$ can, for example, the population density
    function. When $B(x(t)) = 0$, it means the location is in a good condition, that
    is, it is safe. In contrast, when $B(x(t)) = 1$, the location is in a poor condition.


    The effect of an infected person on the community, can therefore be analyzed using
    the concept of quasi coincidence; a community in a particular location $x(t)$,
    with $A(x(t)) + B(x(t)) > 1$ indicates a high chance of that community being infected,
    and vice versa.


    # 7.4.2 Effect of an Infected Region on Neighboring Regions


    Figure 7.7 represents the residential Gardens seriously affected by SARS in 2003.
    The two residential areas are (a) Amoy Gardens, with one of the first serious
    outbreaks of SARS; and (b) Lower Ngau Tau Kok Estate, a neighboring region with
    a high potential of being immediately infected.'
