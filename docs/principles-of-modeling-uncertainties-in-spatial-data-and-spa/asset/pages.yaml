    A stratified sampling scheme, rather than random sampling, is adopted due to the
    consideration that the quality of attribute data among the different layers may
    be different. In the attribute quality assessment, the rate of defect for each
    of the layers is first estimated. The overall rate of defect is obtained via the
    weighted average of all the layers.


    Let the rate of defect of $k$th layer ($k=1,2, ..., h$) be $\hat{u}_k$, the weighted
    average of the overall rate of defect is:


    ```

    $$U_w = \sum_{k=1}^{h} W_{layer(k)}\hat{U}_k = W_{layer}(1)U_1 + W_{layer}(2)U_2
    + \dots + W_{layer}(h)U_h,$$

    ```


    where $W_{layer(k)}$ ($k=1,2,...,h$) is the weight for each layer, and


    ```

    $$\sum_{k=1}^{h} W_{layer(k)} = 1.$$

    ```


    Similarly, we have


    ```

    $$\hat{u}_w = \sum_{k=1}^{h} W_{layer(k)}\hat{u}_k,$$

    ```


    where $\hat{u}_k$ represents the estimation of the rate of defect for each sampling
    data $k$ ($k=1,2,...,h$) layer, and $\hat{u}_w$ is the estimation of the rate
    of defect set population.


    Computing each layer variance of the weighted average variance forms, an estimation
    of variance the incidence of defects for the population is given as


    ```

    $$V(\hat{u}_w) = \sum_{k=1}^{h} W_{layer(k)}^2 V(\hat{u}_k).$$$$

    ```'
