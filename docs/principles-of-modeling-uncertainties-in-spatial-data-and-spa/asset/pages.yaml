  md: '# 18 Epilogue


    The principles of modeling uncertainties in spatial data and analyses have been
    introduced, developed, and described in the previous chapters, and it is now appropriate
    to turn our attention to the future developmental trend of the principles in the
    interest of pushing forward the boundaries of knowledge in this field. Hence,
    an attempt is made to address this issue in the final chapter. The following four
    aspects are considered:


    +   - Research issues for the future

    - Additional mathematical theories for uncertainty modeling of spatial data

    - Implementation issues

    - Interaction with other disciplines


    18.1 RESEARCH ISSUES FOR THE FUTURE

    The framework for modeling uncertainties in spatial data and spatial analyses
    covers the following: understanding the complex and uncertain nature of the natural
    world; the quantification of the uncertainties in the cognition of the natural
    world; the modeling of errors when measuring recognized objects; the determination
    of uncertainties in spatial object representation; the modeling of uncertainty
    propagation and amplification in spatial analyses; quality control for spatial
    data; and GIS applications based on uncertain and incomplete geographic information.


    The following research areas have been identified for further study, based on
    the above and the related theories so far developed.


    18.1.1 UNDERSTANDING MORE ABOUT THE COMPLEXITY OF THE NATURAL WORLD


    The complexities of the natural world are still a mystery to mankind. Indeed,
    our understanding is probably limited to a certain range—say, less than 20% of
    the world. The exact and precise nature of reality in terms of whether it is determined
    or uncertain, is unknown. If the natural world is uncertain, the nature of those
    uncertainties needs to be identified, a related question being, for instance,
    the nature of uncertainty, once defined, can be true for all aspects of reality.
    A further question concerns whether an accepted definition is true for the recognition
    and measurement of everything in the real world. Indeed, it is possible for everything
    in the real world to be recognized and measured? Such questions have not as, yet,
    fully addressed in studies on modeling uncertainties in spatial data and analysis,'
