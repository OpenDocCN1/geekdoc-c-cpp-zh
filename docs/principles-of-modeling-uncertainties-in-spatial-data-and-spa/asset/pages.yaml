    # 1.3.2 SPATIAL DATA QUALITY


    # 1.3.2.1 Quality Components


    Six components—namely, accuracy, precision, reliability, resolution, logical consistency,
    and completeness—are identified as the specific quality components of spatial
    data. These components are briefly described as follows.


    # 1.3.2.1.1 Accuracy


    Accuracy is normally referred to as the degree to which a measurement is free
    from bias. It is the extent to which an estimated value approaches the true value
    or the reference value. ISO 3534-1 (1993) indicates that accuracy is defined as
    the closeness of'
  merge: -1
