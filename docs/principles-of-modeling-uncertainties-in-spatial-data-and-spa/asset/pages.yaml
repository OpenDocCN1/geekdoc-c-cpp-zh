  md: '354 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # # 16.1.3 The CEN/TC287 STANDARD


    This metadata standard was endorsed by the European Committee for Standardization
    and has been widely adopted in Europe (CEN, 1998). It covers the following topics:


    +   * Identification;

    * Spatial data organization;

    * Spatial reference;

    * Data quality;

    * Content;

    * Distribution;

    * Metadata reference.


    As compared with the FGDC''s standard, the CEN content standards are more flexible
    in terms of the number of metadata elements.


    # # 16.1.4 The ISO METADATA STANDARD


    Technical Committee ISO/TC211, Geographic Information/Geomatics, endorsed the
    ISO 19115 metadata standard for geographic information in May 2003. The metadata
    standard was developed based on metadata standards of different organizations,
    including the FGDC, ANZLIC, CEN/TC287, and other metadata standards. Therefore,
    this international standard is more comprehensive than the existing metadata standards.


    The structure of ISO 19115 is similar to that of the FGDC standard. In the ISO
    standard, metadata for geospatial data are presented in 11 Unified Modeling Language
    (UML) packages (similar to the section defined in the FGDC''s standard). These
    UML packages are (ISO 19115, 2003);


    +   * Identification information—information to uniquely identify the data, including
    citation of the resource, an abstract, the purpose, credit, the status, and points
    of contact

    * Constraint information—information—description of the restrictions placed in
    data

    * Data quality information—description of a general assessment of the quality
    of the data set, and information concerning the sources and production processes
    used in producing the data set

    * Maintenance information—information about the scope and frequency of updating
    data

    * Spatial representation information—information about the mechanisms used to
    represent spatial information in the data set

    * Reference system information—the description of the spatial and temporal reference
    system(s) used in the data set

    * Content information—information identifying the feature catalogue or information
    describing the content of a coverage data set'
