  md: '# 356 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    The ISO standard is an international standard. Many metadata standard organizations
    for geospatial data are reviewing their individual standards with the objective
    of creating an ISO-19115-compliant profile. For instance, the FGDC remote sensing
    metadata extensions for the CSDGM. These extensions are used to describe geospatial
    data obtained from remote sensing. The current FGDC standard accompanying the
    remote sensing metadata extensions can be converted to comply with the ISO standard.


    # 16.2 QUALITY INDICATORS IN METADATA


    A data set can be viewed as a data series, to which the data set belongs, or as
    a smaller data grouping that shares common characteristics such as belonging to
    the same feature type or attribute value within the data set. The smaller data
    groupings may be as small as a single feature or a single attribute value. The
    quality of all data groupings belonging to a data set is often the same; the data
    set quality can reflect the quality of each data grouping. If one of these smaller
    data groups has a different quality, it is then necessary to report the quality
    of the data set for each of the smaller groupings.


    The ISO standard provides more conditional elements to document information about
    data quality. The data specified by a data quality scope may be a data series,
    the data set itself, or a smaller data grouping that has the same feature type
    or attribute value. ISO 19115 explicitly provides for the recording of quality
    information as metadata for data sets, the data set, and the smaller data groupings
    with the exception of the single feature or attribute value. Single feature quality
    information (or attribute value), which differs from its parent type, may be treated
    as an attribute of the corresponding feature (the attribute value) and recorded
    in the GIS database. The ISO standard, different from the existing standards that
    mainly document data quality as metadata for an individual data set, allows the
    description of the metadata quality information for the data specified.


    # 16.2.1 DATA QUALITY CLASSES AND SUBCLASSES


    In the ISO standard, data quality for the data specified by the data quality contents
    consists of two classes: lineage and quality information reports. The quality
    information report is constituted of five subclasses covering completeness, accuracy,
    logical consistency, temporal accuracy, and positional accuracy. Figure 16.1 shows
    the classes and subclasses of data quality.


    # 16.2.1.1 Lineage


    The lineage is mandatory if the quality information class report is not provided.
    It provides nonquantitative quality information about the lineage of the specific
    data set. The information includes a general explanation of the data creator''s
    knowledge about the lineage of the specific data, a description of events in the
    life of the specific data set, or information about the source data used in creating
    the specific data set.'
