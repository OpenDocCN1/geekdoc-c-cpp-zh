    three-dimensional TIN model, can also be used to build three-dimensional human
    brain space, three-dimensional positioning technology of GPS can also, as indicated
    above, be for determining knife location within human body.


    There is also a need for accuracy and uncertainty analysis in other spaces, such
    as the human brain space. Therefore, the knowledge developed for modeling uncertainty
    in spatial data and spatial analysis in geographic space can potentially be used
    for uncertainty modeling in human brain space. The theories developed for uncertainty
    modeling in geographic space should, in further research, be transformed to fit
    other "spaces" such as the human body, brain, and the cosmos, thus preventing
    the origins of similar knowledge from being reinvented for other disciplines.


    # 18.5 CONCLUDING REMARKS


    Research effort over the past two decades has produced a better understanding
    of uncertainties in spatial data and analyses. However, there is still a wide
    range of research issues for further development. As indicated above, these issues
    fall into two categories:


    +   1. Modeling uncertainties in spatial data and analyses. This area requires
    the input of new theories from other disciplines, such as modern mathematical
    theories. Selection of such theories obviously requires intensive-based research.

    2. The transformation of the knowledge already developed on uncertainty modeling
    for geographic space to other "spaces," such as the human body, brain, and the
    cosmos, etc.


    The objective of research on the uncertainty phenomena in GISci is firstly to
    provide spatial data and spatial analysis results with uncertainty indicators
    so that the results can be at least categorized secondly, to clearly identify,
    control, and solve spatial data quality problems. However, as is clearly stated
    at the beginning of this chapter, our knowledge of the natural world is still
    very limited, hence it is reasonable to assume that without perfect knowledge
    of the natural world, a state of uncertainty is to be expected, and the difficulty
    in addressing the problem of data quality is an obvious consequence.


    At the present time, although progress has been made to answer questions raised
    in the field of spatial data and analysis, the results have limitations. However,
    clearly further progress can be made by building on the already established research,
    the aim being possibly establish at least initial universal certainty boundaries
    or parameters to enable further progress.


    The research objective of the author of this book concerning the modeling of uncertainties
    in spatial data and analyses is to describe, control, and even eliminate such
    uncertainties.


