    # 13.4 LINE-BASED TRANSFORMATION MODEL


    The line-based transformation model (LBTM) has been developed (Shaker and Shi,
    2003) based on the relationship between the *unit vector* components of a line
    in the image space and the unit vector components of the conjugate line in the
    object space. The conjugate relationship between *points* in image space and object
    space in the early models (such as affine transformation model) are replaced by
    a conjugate relationship between unit vectors in the image and object spaces.


    # 13.4.1 RELATIONSHIP DEFINED BY UNIT VECTOR


    In the image space, two points $p_1(x_1, y_1)$ and $p_2(x_2, y_2)$ form a unit
    vector $\vec{v}$ (see Figure 13.1). The unit vector is defined as


    ```

    $$\vec{v} = \begin{bmatrix} v_x \ v_y \ 0 \end{bmatrix} \quad (13.19)$

