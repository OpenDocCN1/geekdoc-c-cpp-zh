  md: '# Sources of Uncertainty in Spatial Data and Spatial Analysis


    Objects in the real world can be modeled by the following three fundamental models
    in GIS: (a) object-based, (b) field-based, and (c) mathematical function-based.
    In the object-based model, points, lines, and polygons are used as the basic elements
    for describing either simple or complex spatial objects. In a field-based model,
    the basic elements are shells, such as a triangular or square shell. A remotely
    sensed image, with its basic element of a pixel—a square—is an example of a field-based
    model representation of the real world. In a mathematical-based model, spatial
    objects are described by a series of mathematical functions. For example, the
    real-world terrain can be described on the level of complexity of the terrain
    or by linear functions, nonlinear functions, or hybrid interpolation functions
    (Shi and Tian, 2006).


    # 2.4.2 Spatial DATA MEASUREMENT Methods


    To represent the real world in GIS by spatial data, that data must be first captured
    by instruments. Historically, the invention of the telescope motivated the development
    of astronomy; the microscope led to advances in biology and medicine; the aeronautical
    engine contributed to the first industrial revolution; the electrometer to the
    second industrial revolution mainly in Germany during the 19th to early 20th century.
    Today, advances in computing technology are leading to an information revolution.
    Scientific inventions orchestrated a leap in human cognition of the real world,
    which, in turn, produce new uncertainty problems.


    The evolution of spatial data capture technologies can be seen in ground surveys,
    aerial photogrammetry, and high-resolution satellite mapping. The accuracy of
    the captured spatial data is increasing. However, this increase is restricted
    by the limitations of measurement techniques.


    Spatial data, the lifeblood of GIS, is generated from data conversion; interpolation
    methods; map digitization (using vector digitization and raster scanning); photogrammetry
    (including analogy, analytical, and digital photogrammetry); field surveying method
    (using total station, distance measuring equipment, and global positioning system);
    laser scanning (including terrestrial and airborne laser scanning); remote sensing
    technologies (including multispectral images, high spatial resolution images,
    and radar images), and others.


    GIS spatial capture methods are typically divided into the following two categories
    (Shi, 1994): (a) direct method and (b) indirect method. In the case where the
    direct method is applied, such as a total station instrument, the point coordinate
    error is the originality error propagation result, such as the distance and angle
    errors generated when measurement is conducted. Usually, no error is introduced.
    However, if a point in GIS is captured by an indirect method such as map digitization,
    point coordinate errors will include both measurement and angle errors and further
    processing errors. The classification of the spatial capture method is illustrated
    in Figure 2.2.


    The GIS data sets captured by the above methods are grouped into the following
