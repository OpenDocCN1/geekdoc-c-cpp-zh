  md: '# 14 Improved Interpolation Methods for Digital Elevation Model


    This chapter addresses the methods for improving the quality of digital elevation
    models (DEM). Of particular interest is the presentation of two improved interpolation
    methods for DEM generation. Unlike the existing interpolation methods, the improved
    methods include terrain change in the model design. In view of the fact that a
    terrain may be composed of both high and low frequency elevation changes, a hybrid
    interpolation model, which contains both linear and nonlinear functions, is proposed.
    In recognition of the possible elevation change frequencies in different orientations,
    a bidirectional interpolation model is also presented.


    # 14.1 INTRODUCTION


    A DEM is commonly used to represent the earth terrain. Traditionally, it is generated
    by applying an interpolation method to sample data captured from the terrain surface.
    The quality of a generated DEM is then determined by (a) the accuracy of the original
    sample data, and (b) the applied interpolation method. The number of samples and
    the spatial distribution of the samples are also factors that affect the accuracy
    of the generated DEM.


    In DEM interpolation, the elevation at an unknown point can be estimated by an
    interpolation function applied to a number of samples. A polynomial function is
    commonly used for this purpose. Of the available polynomial interpolation functions,
    the bilinear and the bicubic interpolation algorithms are frequently used. Improvement
    in the interpolation methods may lead to improvements in the accuracy of the generated
    DEM, and consequently improvement in the quality of any terrain analysis based
    on the DEM.


    The new interpolation methods, the hybrid and the bidirectional interpolation
    methods, introduced in this chapter and described below are considered to be improvements
    on the existing single function or single direction interpolation methods for
    DEM generation.


    # 14.2 HYBRID INTERPOLATION METHOD


    A natural terrain is usually composed of terrain elements considered as either
    possessing (a) lower frequency of change in elevation or (b) higher change frequency.
    Linear interpolation methods are considered appropriate for modeling a terrain
    with'
