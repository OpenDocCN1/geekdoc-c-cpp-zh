    # 7.1.4 THE “EGG-YOLK” MODEL


    In dealing with nonexact spatial objects and the vagueness/fuzziness spatial objects,
    Cohn and Gotts (1996) suggest using two concentric regions, indicating the degree
    of “membership” in a vague/fuzzy region, in which “egg” represents the precise
    part and “yolk” represents the vague/fuzzy part. Based on region calculus theory
    (Randell et al., 1992), eight basic relations can be defined. They are disconnected,
    externally connected, partially overlapping, tangential proper part, non-tangential
    proper part, equal proper inverse, and tangential proper inverse.


    The egg-yolk model is an extension of region calculus theory into the vague/fuzzy
    region. There are 46 relations that can be identified to represent commonly defined
    on the possible “complete crispings” or precise versions of a vague region.


    Compared with 44 relations in the algebraic model (Clementini and Di Felice 1996),
    two different sets, due to the empty and nonempty non-intersection model (Clementini
    and Di Felice, 1996), cannot distinguish between 30th and 31st, or between 37th
    and 38th (Cohn and Gotts, 1996).


    # 7.1.5 A NINE-INTERSECTION MODEL BETWEEN SIMPLE FUZZ REGIONS


    To investigate the topological relationship between fuzzy regions, Tang and Kainz
    (2001) decompose a fuzzy set A into several topological parts:


    +   i. The core, A⊕, which is the fuzzy interior with value equal to one,

    ii. The c-boundary, ∂A, the fuzzy subset of ∂A where ∂A(x) = A(x),

    iii. B-closure, Aᴸ, the fuzzy subset of A where A(x) > ∂A(x),

    iv. The outer, A⁻, the fuzzy component of A with value equal to one.


    A nine-intersection matrix is thus formalized and a 4 by 4 intersection matrix,
    based on the different topological parts of two fuzzy sets. For the nine-intersection
    matrix,


    ```

    A⊕ ∧ B⊕  A⊕ ∧ Bᴸ  A⊕ ∧ B⁻

    Aᴸ ∧ B⊕  Aᴸ ∧ Bᴸ  Aᴸ ∧ B⁻

    A⁻ ∧ B⊕  A⁻ ∧ Bᴸ  A⁻ ∧ B⁻

