    # 3.2.1.4.5 Normal Approximation to Bernoulli


    Suppose the probability of an event A is p in one Bernoulli trial, and that trial
    is an experiment, the outcome of which is random and can have either of two possible
    outcomes, “success” and “failure.” Suppose also the number of occurrences of event
    A to be $k$, when a series of $n$ independent Bernoulli trials are performed.
    For $k=1, 2, \dots, n$, the probability that “event $A$ occurs $k$ times” is


    ```

    $P_{n,k} = \binom{n}{k} p^k (1-p)^{n-k} \quad (3.9)$

    ```


    When both $k$ and $n$ are large, the probability can be approximated by the normal
    distribution. It follows


    ```

    $P_{n,k} = \frac{1}{\sigma\sqrt{2\pi}} e^{\frac{x^2}{2}} \quad (3.10)$

    ```


    where


    ```

    $x = \frac{k-np}{\sigma}$

    ```


    and


    ```

    $\sigma = \sqrt{np(1-p)}.$

    ```


    # 3.2.1.4.6 Poisson Approximation


    Poisson distribution can provide an approximation to binomial distribution when
    $n$ is large and $p$ is small. Then,


    ```

    $P_{n,k} = \frac{\lambda^k}{k!} e^{-\lambda} \quad (3.11)$

    ```


    where $\lambda = np$.'
