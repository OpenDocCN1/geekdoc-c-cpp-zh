    # 13.2.4 THE PROJECTIVE TRANSFORMATION MODEL


    The eight-parameter projective transformation model is defined by a ratio between
    two first-order polynomials, as follows:


    ```

    x = (a_1X + a_2Y + a_3) / (a_4X + a_5Y + a_6), (13.11)

    ```


    ```

    y = (a_7X + a_8Y + a_9) / (a_4X + a_5Y + a_6). (13.12)

    ```


    The eight-parameter projective model can be used to model the relationship between
    two-dimensional surfaces. In this application of image rectification, the two
    surfaces can be (a) the original image plane and (b) the projected image surface
    on the ground. The two-dimensional affine transformation model and the projective
    transformation model can be solved by a similar method used to solve the confirmation
    transformation model.


    # 13.3 THREE-DIMENSIONAL IMAGE TO OBJECT SPACE TRANSFORMATION MODELS


    Fully rigorous mathematical models for building the relationship between three
    dimensional image space and object space have been developed on the basis of sensor
    calibration, satellite orbit, and satellite attitude information. In the absence
    of the necessary camera model and precise ephemeris data, however, sensor independent
    nonrigorous models provide alternative solutions. A three-dimensional transformation
    model aims to build a relationship between the two-dimensional-dimensional image
    space and the three-dimensional object space on the ground. The nonrigorous generic
    three-dimensional polynomial model, the three-dimensional affine transformation
    model, and the rational functions model, are introduced as follows.


    # 13.3.1 GENERIC THREE-DIMENSIONAL POLYNOMIAL MODEL


    A three-dimensional polynomial transformation model defines the transformation
    relationship between a point of a coordinate pair (x, y) in a two-dimensional
    space and corresponding point of coordinates (X, Y, Z) in a three-dimensional
    space. Following is the generic form of a three-dimensional polynomial transformation
    model:


    ```

    x = Σ_{i=0}^m Σ_{j=0}^n Σ_{k=0}^p a_{ijk} X^i Y^j Z^k, (13.13)

    ```


    ```

    y = Σ_{i=0}^m Σ_{j=0}^n Σ_{k=0}^p b_{ijk} X^i Y^j Z^k, (13.14)

    ```'
