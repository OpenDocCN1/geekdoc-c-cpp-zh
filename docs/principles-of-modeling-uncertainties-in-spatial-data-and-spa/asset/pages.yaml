    # 15.5.3 ANALYSIS OF THE COLOR APPROACH


    The use of color is a popular description method for the perceptible difference
    in an image. Color in uncertainty visualization of classified images is used to
    represent multiple membership values for each class at each grid cell. Two common
    solutions to the visualization of the multiple probability values are the pixel
    mixture and the color mixture techniques. With the two techniques, each class
    is associated with an RGB space or HSI space point; each cell is also colored
    in the corresponding color space.


    Two points should be noted on the color approach. Firstly, for an image for soil
    classification, different soil types might show similar. In such situations, it
    might be difficult to distinguish one soil type from the other. Secondly, a color-blind
    person might misinterpret a color map. Therefore, to represent the uncertainty'
