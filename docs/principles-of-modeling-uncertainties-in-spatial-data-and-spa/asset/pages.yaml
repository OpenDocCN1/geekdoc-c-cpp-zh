    # 13.5.3 EXPERIMENTS ON THE THREE-DIMENSIONAL TRANSFORMATION MODEL


    The three-dimensional affine transformation model was taken as an example for
    testing the performance of the three-dimensional transformation model to determine
    ground coordinates where spatial resection and spatial intersection were performed,
    using a least-squares adjustment.


    There were 18 GCPs identified on the stereo model, as shown in Figure 13.3. Multiple
    sets of 4, 6, 8, 10, and 12 well-distributed GCPs were tested for the resection
    computation. Other GCPs were used as checkpoints. The RMS errors of the threimensional
    checkpoints are presented in Figure 13.4.


    The total RMS errors in the X, Y, and Z directions decrease considerably with
    an increase in the number of GCPs. The error in the Z direction is about twice
    as high as errors in the X, Y directions.


    If 4 well-distributed GCPs were used as checkpoints, RMS errors would be obtained
    equal to 1.38 m, 1.98 m, and 3.20 m in the X, Y, and Z directions, respectively.
    RMS error results improved significantly to 0.58 m and 0.63 m in the X, Y directions
    and 0.98 m in the Z direction when 12 GCPs were used. An almost inverse relationship
    appears,, exists between the RMS errors and the number of ground control points.'
