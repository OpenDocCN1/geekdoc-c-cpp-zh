    # 15.6 OTHER SYMBOL-BASED APPROACHES


    Symbols are the graphic marks used to visualize uncertainty on a map. The above
    four sections have introduced four applications of the cartographic symbol for
    uncertainty visualization. The first two applications focus on positional uncertainty
    visualization in vector and raster data, whereas the latter two relate to attribute
    uncertainty visualization in raster data. Attribute uncertainty visualization
    in raster data is briefly described in this section. This uncertainty is presented
    in a quantitative map. However, what needs to be presented is the quantity at
    different locations.


    Among the graphical variables given in Bertin (1983), size is the dimensional
    quality in the quantitative map. Figure 15.12 shows a polygon map, each polygon
    in the map has different values of attribute uncertainty. The attribute uncertainty
    quantity is represented by circles (symbols) inside individual polygons. By varying
    the size of the circle symbol, the polygon that contains a larger value of the
    attribute uncertainty, or that contains the smaller, can easily be distinguished.


    When the location is intrinsic to the symbol itself, in symbol-based uncertainty
    visualization approaches, that symbol can be defined, based on shape, size, color,
    orientation, texture, and location. During the selection of symbols for representing
    uncertainty, it is necessary to consider the map scale. The symbol must have the
    flexibility to be alterable, according to scale.


