    A); \lambda \not\ge B(x)\}$. The definitions of $\downarrow A$ and $M(\downarrow
    A)$ refer to those of Liu and Luo (1997).


    **Definition 7.3.14:** Let $A$ and $B$ be two fuzzy sets in $I^s$. Define $A\setminus
