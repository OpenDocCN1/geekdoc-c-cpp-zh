- img_proc: true
  md: '# Quality Control for Object-Based Spatial Data


    The parcel errors correlate within the same block. The correlations between parcels
    can be interpreted as constraints, which can be used as the conditions in the
    parcel area processing. If these correlations are not considered, the boundaries
    of different parcels may either overlap or lead to gaps between the parcels. In
    such a case, the area adjustment target cannot be achieved. Owing to the destruction
    of the topological relations between land parcels, it is impossible for the parcel
    data to meet the quality requirements.


    The corresponding data quality control methods for cadastral data, with regard
    to various possible parcel and block relationships, are as follows:


    +   (1) Area adjustment for a single parcel

    This adjustment option suitable for the situations of independent parcels or if
    there is only one single parcel within a block, as the examples shown in Figures
    12.1 and 12.2. The conditional equations can be built based on Equations 12.6,
    12.11, and 12.12. The area adjustment process for a land parcel can thus be carried
    out accordingly.


    +   (2) Area adjustment for parcels with “holes” or an “island"

    an “island” refers to the situation whereby a parcel is located inside another
    parcel. Two area conditions should be considered: one for the area of the “island”
    parcel and one for the parcel area containing the “island.” The conditions for
    each of the parcels should be used for forming conditional equations. The two
    parcels should be adjusted simultaneously. A “hole” refers to the situation whereby
    part of a parcel belongs to another parcel. Similar adjustments to those made
    to the “island” should be made to the parcel with a “hole”.


    +   (3) Area adjustment for multiple parcels

    In common situations, many parcels occur within one block, as shown in Figure
    12.3. If the data volume of a block is within certain limits, multiple parcels
    within the block should be integrally and simultaneously adjusted, for example,
    when the total number of parcels is less than 50, and the total number of digitized
    vertices within a block is less than 1000. The key issue


