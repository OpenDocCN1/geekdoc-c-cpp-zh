  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 16.2.5.3 Temporal Validity


    Temporal validity is data validity with respect to time. It can be determined
    by checking each data item with the data set, as specified in the data set scope,
    to assure that it was captured on the date as specified in the lineage. The number
    of items failing the date are either counted and reported in metadata, or the
    result is divided by the total number of items in the data set and multiplied
    by 100 and presented in metadata in percentage form. In addition, if an acceptable
    level of the number of items with temporal invalidity is given, a Boolean result
    will be obtained and reported in metadata.


    # 16.2.6 THEMATIC ACCURACY


    Thematic accuracy, also referred to as attribute accuracy, deals with the correctness
    of feature classifications and their relationships, the correctness of nonquantitative
    attributes, and the accuracy of quantitative attributes.


    # 16.2.6.1 Classification Correctness


    Classification incorrectness occurs when the wrong class is assigned to points
    or features, when assigned classes are based on different data capture techniques
    (or from different observers) are inconsistent.


    Many techniques have been developed to assess classification accuracy, as discussed
    in Chapter 5. These techniques involve image sampling locations and comparisons
    of the class assigned to each location in a reference image. The results are tabulated
    in the form of an error (or misclassification) matrix. For example, Table 16.1
    shows an example of the error matrix for two classes. The columns define the classes
    in the true data, while the rows define the classes in the data set. The error
    matrix can be directly documented in metadata in global level form.


    According to the error matrix, two overall accuracy measures—the PCC and the kappa
    coefficient—are defined as


    ```

    PCC = \sum_{i=1}^{n} C_{ii}, \quad (16.6)

    ```


