    # 3.7 INFORMATION THEORY AND ENTROPY


    Information refers to the interchanging content of different objects, which is
    the state and rule of dynamic objects. Information can be expressed in the form
    of texts, graphs, images, or sounds. To give an information definition and provide
    an effective measure of the information amount, Shannon (1948) defined entropy
    as an uncertainty associated with a random variable. Section 3.7 introduces information
    theory and entropy. More details of information theory can be found in Jiang (2001)
    and Yeung (2002).


    # 3.7.1 MATHEMATICAL AS INFORMATION SOURCE MODEL


    The information source, as its name suggests is a carrier of information. It provides,
    information modeled as a random variable or a set of probabilities assigned to
    a set of outcomes. The simplest information source is a single symbol.


    Suppose an information source yields $r$ outcomes: $a_1, a_2, ..., a_r$, with
    probabilities $p(a_1), p(a_2), ..., p(a_r)$, respectively. Let a random variable
    $X$ denote this information source. Its information space is given


    ```

    $[X \cdot P]: \begin{cases} X: & & a_1 & a_2 & ... & a_r \ P(X): & p(a_1) & p(a_2)
    & ... & p(a_r), \end{cases} \quad (3.133)$

    ```'
