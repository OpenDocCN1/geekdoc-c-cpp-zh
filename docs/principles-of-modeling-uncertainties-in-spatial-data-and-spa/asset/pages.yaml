    # 4.8.3 THE $\epsilon_m$ ERROR MODEL


    As discussed in the above section, based on the error ellipse of the intermediate
    point on the curve, we have derived the standard deviation of the point in the
    normal direction of the curve. By analyzing the error ellipses of the infinite
    points on the curve, we find however, that the error indicator $e_\sigma$ represented
    by the standard deviation in the normal direction of the curve may not be the
    maximum between the error ellipse of $Q_i$ and therefore, in this section, we
    investigate the maximum distance from the point on the error ellipse of an arbitrary
    point perpendicular to the curve. The aggregation of the maximum distances of
    all the intermediate points on the curve defines the maximum error region of the
    curve. In Figure 4.12, for example, the distance $e_\sigma$ (between point $Q_i$
    and its error ellipse in its normal direction) is smaller than $e_m$ (between
    the point $G_\sigma$ and the point $Q_i$) on the curve in the normal direction
    at $Q_i$. Therefore, the maximum error ($e_m$) is further proposed to assess the
    positional error on a curve.


    As illustrated in Figure 4.12, let $Q_i = (x_i, y_i)$ denote the point on a curve
    that has the maximum distance to a point on the error ellipse (with the error
    ellipse''s center at $Q_i$). The distance is in the normal direction of the curve
    towards a point on the error ellipse. Let $G_\sigma = (x_\sigma, y_\sigma)$ denote
    the intersection point between the error ellipse and the normal direction line
    passing through the point $__i$. The distance between $Q_i$ and $G_\sigma$ is
    defined as an error indicator for point $Q_i$, the maximum error model, which
    can be derived below.


