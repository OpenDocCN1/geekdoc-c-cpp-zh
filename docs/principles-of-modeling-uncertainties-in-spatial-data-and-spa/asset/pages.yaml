    When a classified raster image is overlapped with a vector administrative map,
    the corresponding attribute and positional uncertainties that exist in both data
    layers are combined. A theory for modeling such an integrated uncertainty problem
    is required. The “S-band” model and corresponding solutions presented in this
    chapter are designed to solve this problem.


    # 6.2 PROBLEM DEFINITION


    The problem of integrating positional and attribute uncertainties is defined as
    follows. Suppose that a maximum likelihood classifier is used to classify a remotely
    sensed image. For a given pixel, $Z_r$, the probability that the particular class
    $C_{IF}$ the pixel belongs to equals


    > $P[Z_r \in C_I/Z_r(x)]$


    where $Z_r(x) = (b_1, b_2, ..., b_n)^T$ is a vector in N-dimensional spectral
    domain, and $C_i$ is one of overall classes.


    For a polygon object in a GIS, the probability that the boundary $Z_p$ belongs
    to $O_i$ equals


    > $P[Z_p \in O_I/Z_p(x)]$


    That is, for a given point $Z_p(x)$ the probability of belonging to the polygon
    object $O_i$ can be computed. This probability is actually a positional uncertainty
    indicator. $Z_p(x) \in R^2$ is a point in a two-dimensional Euclidean space, while
    $O_i$ is an area object, instance, as in the example above, a county.


    The problem now be defined as: What is the probability of $Z_{PAT}$ simultaneously
    belonging to both $C$ and $O$, after the combination of two layers? That is:


    > $P[Z_{PAT} \in C_I/Z_r(x)] \wedge [Z_p \in O_I/Z_p(x)] = ?$


    where $Z_{PAT} \in R^{n+2}$ is shorthand for $Z_{Pat} = (b_1, b_2, ..., b_n, y)^T$.
    This is the theoretical research problem to solve for modeling uncertainty, generated
    by combining attribute and positional uncertainties.


    For convenience, the following symbols are used to describe this problem.


    > $H_T^r: Z_r \in C_i\nH_P^p: Z_p \in O_i\nH_{P,r}^T: [Z_r \in C_I/Z_r(x)] \wedge
    [Z_p \in O_I/Z_p(x)]$. $


    In order to model the integration of positional and attribute uncertainties, the
    S-band model is proposed and is described, below, in Section 6.3. Two corresponding
    implementation solutions are provided in Sections 6.4 and 6.5.'
