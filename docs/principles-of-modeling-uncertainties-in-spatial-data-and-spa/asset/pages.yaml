    # 15.7.3 AN ANALYSIS OF THREE-DIMENSIONAL APPROACH


    A three-dimensional approach is appropriate for the uncertainty representation
    of vector and raster data in three-dimensional space. However, this approach is
    more complex than the two-dimensional approach, due to display devices being normally
    two-dimensional.


    To transform three-dimensional uncertainty representation into two-dimensional
    viewing, several points should be taken into consideration. Firstly, a projection
    transforming 3D objects onto a 2D projection plane has to be determined. Secondly,
    the viewer''s eye position and the location of the viewing plane must be specified.
    Varying any or both of these parameters yields various representations of the
    perspective image. Thirdly, the contents of the 3D uncertainty map are transformed
    into a display viewpoint. Further information about such transformations can be
    found in Foley et al. (1994).


    # 15.8 GRAPHIC ANIMATION


    Uncertainty can also be represented by animation. It is possible to show a series
    of individual realizations in quick succession to depict a change caused by uncertainty.
    These individual realizations are mainly given in Monte Carlo simulation according
    to the source map uncertainty data.


    # 15.8.1 THE ANIMATION APPROACH FOR VECTOR MAP


    Location and attribute in a vector map are two main information aspects. To visualize
    location and attribute uncertainties by animation, two randomizations are required.
    Firstly, the spatial feature locations in such a map are simulated based on positional
    uncertainty distributions of the spatial features. The second step is spatial
    randomization. Attribute uncertainty for each spatial feature is simulated based
    on attribute''s statistical accuracy measure. After performing these two steps,
    one realization is achieved. Animation for uncertainty visualization in the source
    map can be realized by running a series of these realizations.


    # 15.8.2 RASTER IMAGE ANIMATION APPROACH


    In raster format, where each cell of an image represents its attribute value,
    the attribute uncertainty is visualized by means of animation on the source map.
    Animation can be performed by continuously selecting cells and reevaluating the
    cell value to give a constant change. This is known as random animation (Fisher,
    1994b, 1996).


    Serial animation as an alternative (Benklipsov et al., 2000) produces α-cuts of
    fuzzy membership images. By varying α , users can obtain an image showing those
    pixels with membership above or below this alpha value, or an image showing those
    pixels with a small range of fuzzy membership.


    In the process of stringing a series of realizations, the combination of random
    animation and serial animation are likely to give a disjointed result as there
    will be'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    many gaps between the realizations. Sequential animation overcomes this problem
    (Ehlschlager et al., 1997). It involves not only the stringing process but also
    the process of generating intermediate images between the realizations. The intermediate
    images within the transition between any two realizations are generated using
    an interpolation method. Playing the realizations and the intermediate images
    progressively gives a sequential animation. This animation ensures that the transition
    looks smooth and natural (MacEachern and DiBiase, 1991).


    # 15.8 An ANALYSIS OF THE ANIMATION APPROACH


    Animation shows realizations cartographically, based on different uncertainty
    levels. The total time occupied by the animated map display can reflect the map’s
    accuracy. If the animated map does not change for a long period of time, the original
    map is then likely to be considered highly accurate. Hence, the speed of display
    change connects to an interpretation of “time length periods” and the subset relationship
    to map accuracy. Therefore, a pertinent legend would be help and perhaps even
    guide the relationship between display speed and map accuracy. If maps are displayed
    with too-long intervals between each display, users could fail to notice display
    changes and wrongly conclude that the original map is of higher accuracy. Additionally,
    if the map display is too rapid, users will be unable to focus on and study the
    impact of elements of uncertainty. Further investigation of the implementation
    is both a necessary and interesting challenge.


    # 15.9 SUMMARY AND COMMENT


    Methods for visualizing uncertainty in spatial information have been summarized
    in this chapter. These methods aim to make possible to visualize the uncertainties
    in spatial data and analyses. Hence, users can have a better understanding of
    the nature of these features and a subsequent interpretation of the uncertainties.
    Evaluation results have shown that a combination of several visualization techniques
    is a better approach than the application of a single visualization method for
    uncertainty.


    Two solutions can be applied to implement the presented visualization methods
    in this chapter. In the first solution, uncertainty is treated as an additional
    piece of information—that is, additional to the original spatial data. In the
    second solution, a new window is drawn in the GIS system to show the incorporation
    of the uncertainty information in the original data. However, in the latter solution,
    the data and associated uncertainty information cannot be visualized separately.


