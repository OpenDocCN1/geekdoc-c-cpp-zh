    When $\sigma_{x_i}^2 = \sigma_{y_i}^2 = \sigma_0^2$ and $\sigma_{xy} = 0$, the
    variance simplifies


    ```

    $$\sigma_{S1}^2 = \frac{1}{4} \sum_{i=1}^n \left[ \Delta y_{i-1,i+2}^2 + \Delta
    x_{i-1,i+1}^2 \right] \sigma_0^2 = \frac{1}{4} \sum_{i=1}^n l_{i-1,i+1}^2 \sigma_0^2
    ,$ (4.121)

    ```


    Where $l_{i-1}, l_{i+1}$ are the distances between $P_{i-1}$ and $P_{i+1}$. For
    an $n$-sided regular polygon, $l_{i-1}, l_{i+1}$ is identical for all $i=1, 2,
    \dots, n$. The standard deviation of its area equals


    ```

    $$\sigma_{S1} = \sqrt{n} \sin \left( \frac{\pi}{2} - \frac{\pi}{n} \right) \cdot
    l \sigma_0 .$ (4.122)

    ```


    # 4.9.2 ERROR MODELING BASED ON ITS COMPOSITION LINE SEGMENTS


    The area of a polygon is also a function of the lengths of its compositional line
    segments, according to Equation 4.118. This implies that the positional error
    for the area of the polygon is subject to a positional error in these segments.
    The impact of the positional error in the line segment or error in the area of
    the polygon is elaborated.


    Let $\Delta$ denote the area of error band for edge $P_i P_{i+1}$ of polygon $A$
    for $i=1, 2, \dots, n$. A relationship between the positional error $\Delta S$
    for the area of the polygon and the area $\Delta_i$ of the error band is given


    ```

    $$\Delta S = \Delta_1 + \Delta_2 + \dots + \Delta_n .$ (4.123)

    ```


    If $\Delta_1, \Delta_2, \dots, \Delta_n$ are independent, the standard deviation
    of the area of the polygon will be


    ```

    $$\sigma_{S2} = \sqrt{\sigma_1^2 + \sigma_2^2 + \dots + \sigma_n^2} .$ (4.124)

    ```


    Where $\sigma$ is the standard deviation of the area of the error band for edge
    $P_i P_{i+1}$. The standard deviation $\sigma_i$ is half of the area of the error
    band derived in Section 4.8.2, if $\sigma_i = \Delta/2$. For an $n$-sided polygon,
    the standard deviation of the area of the polygon is


    ```

    $$\sigma_{S2} = \sqrt{\sum_{i=1}^n \sigma_i^2} = \frac{\sqrt{n}\Delta_S}{2n} =
    \frac{\Delta_S}{2\sqrt{n}} .$ (4.125)

    ```


    Both Equations 4.124 and 4.125 demonstrate the following: the positional error
    for the area of the polygon increases if the positional error in the boundary
    line segments increases, but decreases if the number of compositional vertices
    increases.'
