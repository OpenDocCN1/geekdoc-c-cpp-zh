    # 7.2 MODELING TOPOLOGICAL RELATIONSHIPS BETWEEN OBJECTS


    This section presents a formal representation and calculation of the topological
    relations between uncertain spatial objects. Uncertain geographic objects fall
    into three types: (1) a geometrically uncertain core area surrounded by an uncertain
    boundary; (2) a geometrically uncertain core area surrounded by a certain boundary;
    and (3) a geometrically certain core area surrounded by an uncertain boundary.
    Here, we present solutions for (3) in this section. However, geographical objects
    in the cases (1) and (2) may exist in the natural or real world.


    # 7.2.1 REPRESENTATION OF SPATIAL OBJECTS


    Spatial object types can be identified in $N$-dimensional space. For example,
    four types of spatial objects, such as point, line, surface, and body, can be
    identified in a three-dimensional space.


    # 7.2.1.1 N-Cell and N-Cell Complex


    An $N$-cell is a bordered subset of an $N$-manifold and thus homeomorphic to an
    $N$-manifold. Depending on the dimension of the space, the cells of dimension
    0, 1, 2, and 3 are defined as follows:


    ```

    0-cell = point

    1-cell = line segment

    2-cell = area

    3-cell = sphere

    ```


    The geometric representation of these cells is shown in Figure 7.1.

    An $N$-cell complex represents the composition of all $N$-dimensional and lower-dimensional
    cells and satisfies the following conditions:


    +   - Different elements of the complex have disjoint interiors.

    - For each cell in the complex, the boundary is a union of elements of the complex.

    - If two cells intersect, they also do so in a cell of the complex.


