    It is quite possible and even likely that not all information or knowledge for
    a certain set, is given when required. Hence, partitioning the set based on the
    available information or knowledge F results in an approximate classification.
    Inaccuracy of the classification approximation can be characterized by the concept
    of set approximation. Let $P=\{x_1, x_2, ..., x_n\}$ denote a family of sets.
    The $R$-lower approximation and the $R$-upper approximation are defined as


    ```

    $R^-(F)=\{R^-(X_1),R^-(X_2),...,R^-(X_n)\} (3.129)

    ```


    and


    ```

    $R^+(F)=\{R^+(X_1),R^+(X_2),...,R^+(X_n)\} (3.130)

    ```


    The classification approximation is a simple generalization of the set approximation.
    Its accuracy can be assessed by the accuracy of the approximation and the quality
    of the approximation. The accuracy of the approximation is defined as


    ```

    $D_R(F)=\frac{\sum|(R^-(X_i))|}{\sum|(R^+(X_i))|} (3.131)

    ```


    Classification accuracy is used to describe the case when $P$ is classified based
    on the available information and the class (among all possible categories) that
    has the correct determined percentage. The classification quality is defined as


    ```

    $r_R(F)=\frac{\sum|(R^-(X_i))|}{\|U|} (3.132)

    ```


    It represents the percentage of elements $P$, which can be classified as $F$ based
    on the available information or knowledge $R$.

    Let $F=\{x_1, x_2, ..., x_n\}$ for $n \ge 1$ denote a class in $U$ and $R$ denote
