  md: '# 5 Modeling Attribute Uncertainty


    This chapter addresses attribute uncertainty modeling in GISci. Firstly, various
    concepts of attribute uncertainty and their sources are examined. Secondly, the
    methods for handling attribute uncertainties are introduced, including simple
    sample methods, error matrix, internal and external testing, the probability vector
    and parameters, the incidence of defect method, and sensitivity analysis.


    #  5.1 INTRODUCTION


    #  5.1.1 ATTRIBUTE AND ATTRIBUTE DATA


    Attributes can be defined as the characteristics or nature of objects. In GISci,
    an attribute is regarded as a property inherent in a spatial entity. For example,
    the ownership of a land parcel is an attribute of the land parcel. Characteristics,
    variables, and values of spatial entity in GISci are described by attribute data.


    The natural or real world can be represented in either of two ways: continuous
    or discrete representation. According to their continuous or discrete nature,
    attribute data can be classified as categorical attribute data or continuous attribute
    data. For instance, land cover type is a categorical attribute and “forest" is
    a categorical value, whereas population is an example of continuous attribute
    and “6.9 million people in Hong Kong" is an example of a population attribute
    value.


    In GISci, attribute data may be classified either as categorical (discrete) and
    a continuous representation, or a qualitative or quantitative attribute representation.
    The classification, "categorical" and "continuous" for attribute data is used
    in this book. A categorical variable can only be represented by a finite number
    of values from a defined data set, such as a set composed of members of land cover
    classes. A continuous variable, on the other hand, can take any number, usually
    within a defined domain. Categorical attribute data may or not have a ranking.
    For example, Class 1 having the highest environment quality ranking and class
    4 the lowest. In this situation, the ranking represents the categorical value.
    In another example, the numbers 1 to 4 may stand for four categories of land cover:
    water, vegetation, soil, and forest. In this case, the numbers do not imply ranking.
    An example of a continuous attribute variable may be the (average) altitude of
    a land parcel. The domain range for the variable, can be defined, as (−10,000,
    10,000) in meters. The altitude value can be any number within this range.'
