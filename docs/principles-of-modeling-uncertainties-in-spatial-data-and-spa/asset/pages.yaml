    # 3.5 FUZZY THEORY


    # 3.5.1 INTRODUCTION


    The representations of objects in the natural world may be imprecise and vague.
    Most concepts in the human brain are vague, and any judgment or reasoning these
    concepts is also vague. Zadeh (1965) introduced fuzzy set, which formed the basis
    of fuzzy mathematics.


    Information about spatial objects is multidimensional, multisource, multiscale,
    and multitemporal. Because of the properties of diversity, complexity, and imprecision,
    a representation of these spatial objects can be vague. Fuzzy set theory can be
    applied to represent spatial objects with vague properties. Fuzzy set theory has
    also been adopted in the field of spatial information science for dealing with
    vague information.


