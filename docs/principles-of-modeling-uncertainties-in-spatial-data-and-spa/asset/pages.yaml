    \ Random Variables\n\n| Distribution | Probability Density Function f(x) | Expectation\
    \ E(X) | Variance Var(X) |\n|---|---|---|--|\n| Logarithmic normal $Ln(\\mu, \\\
    sigma^2)$ | $f_{Ln}(x) = \begin{cases} \\frac{1}{x\\sigma\\sqrt{2\\pi}} e^{-\\\
    frac{(\\ln x-\\mu)^2}{2\\sigma^2}} & x > 0 \\ 0 & x \\le 0 \\end{cases}$ where\
    \ $-\\infty < \\mu < \\infty, \\sigma > 0$ | $e^{\\mu+\\frac{\\sigma^2}{2}}$ |\
    \ $e^{2(\\mu+\\sigma^2)}-e^{2\\mu}$ |\n| Chi-square distribution $\\chi^2(n)$\
    \ | $p_{\\chi^2}(x)$ | $n$ | $2n$ |\n| T-distribution $F(m,n)$ | $p_T(x)$ | $0\
    \ (n>1)$ | $\\frac{n}{n-2} (n>2)$ |\n| F-distribution $F(m,n)$ | $p_F(x)$ | $\\\
    frac{n}{n-2} (n>2)$ | $\\frac{2n^2(m+n-2)}{m(n-2)^2(n-4)} (n>4)$ |\n| Weibull\
    \ distribution $W(m,a)$ | $p_W(x)$ where $m>0, \\alpha>0$ | $\\alpha^*\\Gamma(1+\\\
    frac{1}{m})$ | $a^{\\frac{2}{m}}[\\Gamma(1+\\frac{2}{m})-\\Gamma(1+\\frac{1}{m})^2]$\
    \ |\n| Cauchy distribution $C(\\mu,a)$ | $\\frac{\\alpha}{\\pi\\alpha^2+(x-\\\
    mu)^2}$ where $\\alpha>0$ | Nonexistence | Nonexistence\n\n# 3.3.3.3 Population\
    \ Parameter Estimation\n\nLet $X$ be a random variable from a population distribution\
    \ and $x_1, x_2, ..., x_n$ denote a random sample of size $n$ taken from the population.\
    \ The parameters of that population can be estimated from the statistics of the\
    \ sample by using the method of moments and the method of maximum likelihood.\n\
    \n# 3.3.3.3.1 Point Estimation with the Method of Moments\n\nThe method of moments\
    \ assigns the value of the $rth$ sample moment to the $rth$ population moment.\
    \ Let a random variable $X$ have a distribution function with $k$ unknown parameters\
    \ $(\theta_1, \theta_2, ..., \theta_k)$. For a sample $X$, the distribution function\
    \ is expressed in the form of $F(x; \theta_1, \theta_2, ..., \theta_k)$. Suppose\
