  md: '# Visualization of Uncertainties in Spatial Data


    ![](img/978c1925ca93296ea7a944399abc8952_356_0.png)


    **FIGURE 15.2** (a) At left, error ellipse parallel to the axes and (b) at right,
    error circle.


    If errors in x and y directions are uncorrelated, the two semi-axes of the error
    ellipse will be parallel to the x and y axes (Figure 15.2a). If the two semi-axes
    of the same length, the error ellipse becomes an error circle (Figure 15.2b).


    # 15.2.1 BASIC EQUATION


    The mathematical basis of error ellipse is as follows: Suppose point $P = (x,
    y)$ has a covariance matrix in the form


    ```

    $$\Sigma = \begin{pmatrix} \sigma_x^2 & \sigma_{xy} \ \sigma_{xy} & \sigma_y^2
    \end{pmatrix} $\ (15.1)$

    ```


    where $\sigma_x^2$ and $\sigma_y^2$ are the variances of $x$ and $y$, respectively,
    and $\sigma_{xy}$ is the covariance of $x$ and $y$. The semi-major and semi-minor
    axes of the error ellipse are equal to square roots of two solutions of


    ```

    $$\lambda^2 - (\sigma_x^2 + \sigma_y^2)\lambda + (\sigma_x^2\sigma_y^2 - \sigma_{xy}^2)
    = 0.$\ (15.2)$

    ```


    Note that the orientation of this error ellipse is determined by computing an
    interior angle between the x axis and the semi-major axis:


    ```

    $$\tan(2\theta) = \frac{2\sigma_{xy}}{\sigma_x^2 - \sigma_y^2}.$\ (15.3)$

    ```


    The probability of falling on or inside this error ellipse is 0.3935. This error
    ellipse is also called a *standard error ellipse*. The standard error ellipse
    can be enlarged to gain different probability values by multiplying a scale multiplier
    Mikhail, 1976).'
