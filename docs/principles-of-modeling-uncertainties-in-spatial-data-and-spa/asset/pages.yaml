    K=\{p\in K : \forall r > 0 : C(p,r) \cap K^c \neq \emptyset \cup C(p,r) \cap \Gamma-K
    \neq \emptyset$\n$\K^c=\{p\in \Gamma-K\\}$


    where $\Gamma$ represents the $n$-dimensional space $3^n$.$\nBy invoking methods
    to characterize certainty, imprecision, and randomness of spatial objects, a unified
    framework for representing spatial objects has developed (Shi and Guo, 1999) and
