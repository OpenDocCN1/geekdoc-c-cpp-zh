- img_proc: true
  md: '# Modeling Positional Uncertainties in Overlay Analysis


    upon a more relaxed assumption that both correlation of the uncertainty in the
    x- and y-direction at each vertex of the source polygons and correlation between
    the uncertainty in the x-direction (or y-direction) at all of the vertices of
    the source polygons might exist.


    # 9.3 UNCERTAINTY MODELING FOR THE GENERATED POLYGON


    In this section, positional uncertainty in a generated polygon from an overlay
    analysis is described by a set of uncertainty indicators. These indicators can
    be classified into three categories: (a) the covariance matrix of any intersection
    point of source polygons; (b) uncertainty of the measurements of the generated
    polygon, such as the area and perimeter; and (c) a radial interval for describing
    the uncertainty in all vertices of the generated polygon.


    Two approaches are introduced below, one, in Section 9.3.1, is based on the error
    propagation law, and the other, in Section 9.3.2, is based on simulation (Shi
    et al., 2004).


    # 9.3.1 ANALYTICAL APPROACH


    Uncertainty indicators for positional uncertainty in the generated polygon described
    below are derived by using the error propagation law. These uncertainty indicators
    are expressed as a function of vertices of the source polygons.


    # 9.3.1.1 Covariance Matrix of an Intersection Point


    To derive the intersection point of two line segments from two polygons, the following
    are considered: a line segment $Q_1Q_2$ is of endpoints $Q_1 = [x_1, y_1]^T$ and
    $Q_2 = [x_2, y_2]^T$, and a line segment $Q_sQ_t$ is of endpoints $Q_s = [x_s,
    y_s]^T$ and $Q_t = [x_t, y_t]^T$. Equations of these two line segments are given
    by


    ```

    begin{cases} Q_1 : y - y_1 = \frac{y_2 - y_1}{x_2 - x_1}(x - x_1) \ Q_s : y -
    y_s = \frac{y_t - y_s}{x_t - x_s}(x - x_s) \end{cases} \quad (9.1)$

    ```


    Since these line segments intersect at point $P$, denoted by $[x_p, y_p]^T$ (see
    Figure 9.1), Since the intersection point must be a point passing through $Q_1Q_2$,
    its coordinate is determined by solving Equation 9.1,


    ```

    begin{cases} x_p = x_i + \frac{\Delta x_{ij}\Delta y_{st}\Delta x_{si}}{\Delta
    x_{st}\Delta y_{ij} - \Delta y_{st}\Delta x_{ij}} \ y_p = y_i + \frac{\Delta y_{ij}\Delta
    x_{st}\Delta y_{si}}{\Delta x_{st}\Delta y_{ij} - \Delta y_{st}\Delta x_{ij}}
    \end{cases} \quad (9.2)$

    ```'
