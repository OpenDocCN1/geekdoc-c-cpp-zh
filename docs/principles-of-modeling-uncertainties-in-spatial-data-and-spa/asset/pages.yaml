  md: '# #11 Modeling Positional Uncertainty in Line Simplification


    An analytical method for quantifying positional uncertainties in line simplification
    spatial analysis is presented in this chapter. The total error in a line simplification
    is quantified as the sum of the measurement error in the initial line and the
    line simplification model error.


    # ## 11.1 INTRODUCTION


    Line simplification is a process of eliminating unnecessary or less important
    shape points from an initial line. The corresponding simplified line should be
    as similar as possible to the original line, in terms of its geometric shape.


    Line simplification is widely used in cartographic generalization. It is achieved
    by means of the following four steps: (a) the selection of geographic features
    and their attributes to be represented on a map, (b) the simplification of the
    retained objects, (c) the classification and grouping of similar retained objects
    into a limited number of classes, and (d) the representation of the retained objects
    by simplification. In map generalization, line simplification is also used for
    vector data compression. A simplified version of the original line is representative
    of that line. However, the data of the simplified line is smaller than that of
    the initial line. Normally, line generalization is required when a larger scale
    map is generalized to a smaller scale map. For example, a line generalization
    process can generate a coarse coastline from the original detailed coastline.


    Basic geometric elements of GIS include points, lines, polygons, and volumetric
    objects. The focus in this chapter is line simplification error modeling. This
    restriction arises from the fact that most geographic objects in GIS and in medium-scale
    topographic maps (Müller, 1991) are represented as lines. Simplification of other
    complex objects (such as polygons) is based on simplification of composition boundaries;
    object simplification, including points, lines, polygons, and volumetric objects—in
    line simplification—is a fundamental issue for overall object simplification.


    The quality of line simplification is affected by two major factors: (a) error
    in the original line and (b) uncertainty generated from the line simplification
    operation. Existing error modeling methods mainly concentrate on errors from line
    simplification, without considering positional error in the original lines.'
