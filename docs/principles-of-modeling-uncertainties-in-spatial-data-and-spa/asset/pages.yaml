  md: '# 16.2.4 POSITIONAL ACCURACY


    Positional accuracy deals with accuracy of the position of a feature or the position
    of a cell (or a group of cells). Chapter 4 provides a number of models for describing
    positional GISci spatial data quality. Positional accuracy can be divided into
    absolute or external accuracy, relative or internal accuracy, or position accuracy
    of gridded data. The first two forms of accuracy relate to a vector feature in
    an object-based spatial data model. The position accuracy of gridded data is for
    a raster cell in a field-based spatial data model.


    # 16.2.4.1 Absolute or External Accuracy


    Absolute external accuracy reflects the closeness of coordinate values of objects
    to values accepted as being true. This closeness is valued, based on a comparison
    between absolute location of a feature and its location in the universe of discourse
    (or the coordinate accepted as true). In a vector format, a feature may be a point,
    a line, or a polygon.


    # 16.2.4.1.1 Point Measurement


    A horizontal, vertical, and radial positional point accuracy can be derived from
    a statistical test analysis, and the results can be described by error indicators
    such as root-mean-square error (RMSE) and standard deviation (SD). Based on results
    of the statistical test analysis, an error ellipse, for example, can be created
    to visualize the positional accuracy for a point in a graph.


    The RMSE statistic has been widely implemented in surveying for accuracy encompassing
    both random and systematic errors. The RMSE statistic for positional uncertainty
    in a point is defined as:


    ```

    RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} ((x_i - x)^2 + (y_i - y)^2)} (16.1)

    ```


    where n is the total number of point in the data set; (xi, yi) is the absolute
    coordinate value of the ith point in the data set; and (x, y) is the absolute
    coordinate value of the point in the universe of discourse. Furthermore, RMSE
    and RMSE for x- and y-direction positional accuracies for the point are given,
    respectively,


    ```

    RMSE_x = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (x_i - x)^2} (16.2)

    ```


    ```

    RMSE_y = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (y_i - y)^2}

    ```


    The SD statistics for x- and y-direction, and radial positional accuracies for
    the point are expressed as'
