  md: '# # 7 Modeling Uncertain Topological Relationships


    Uncertainty modeling in spatial data has been introduced in Part II, and now,
    in Part III (Chapters 7 and 8) uncertainty modeling in a spatial model, is further
    explored and described. Modeling uncertain topological relations is addressed
    in this chapter. The concepts of topological relationships between objects in
    GISci are introduced, and this is followed by a description of modeling these
    relationships. Finally, based on the concept of quasi coincidence and quasi difference
    in fuzzy topology, an uncertain topological relationship model is proposed.


    # ## 7.1 AN OVERVIEW OF TOPOLOGICAL RELATIONSHIP MODELS


    Most GISci are traditionally designed on the basis that the represented spatial
    objects, as rivers, roads, trees, and buildings, are error free. As has been indicated
    in Chapter 2, this assumption may not always be true, owing to vagueness or fuzziness
    in the definition or identification of spatial objects or randomness in the measuring
    process. For example, it is impossible to describe a fuzzy boundary between urban
    and rural areas using crisp lines, as has been the practice in traditional GIS
    representations. It has become obvious that there is a need to enhance the currently
    used GIS functions by introducing a method to describe single objects. Such descriptions
    would include any uncertainty present and, also, enable the description of fuzzy
    topological relationships between such spatial objects. On this basis, it could
    be concluded that descriptions of objects with crisp boundaries using the classical
    set theory (Apostol, 1974, Subaryono, 1990). However, it is likely that fuzzy
    set theory could be used to describe uncertain objects in GISci. In addition,
    fuzzy topology provides a theoretical basis for modeling fuzzy topological relationships
    between spatial objects.


    Topological relationships are defined as invariant under geometric distortion,
    and form a subset of spatial relationships. The representation of topological
    relationships between spatial objects is one of the major issues for spatial data
    modeling in GISci. The application of topological relationships makes it possible
    to accelerate spatial queries related to spatial relationships and also facilitate
    topologic consistency checking in GIS.'
