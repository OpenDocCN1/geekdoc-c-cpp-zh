    If $p(a_i) > p(a_j)$, $I(a_i) = f[p(a_i)] < I(a_j) = f[p(a_j)]$.

    2. If an outcome $a_i$ of information source has a prior probability $p(a_i) =
    0$, $I(a_i) = f[p(a_i)] \to \infty$.

    3. If an outcome $a_i$ of information source has a prior probability $p(a_i) =
    1$, $I(a_i) = f[p(a_i)] = 0$.

    4. Let $X$ and $Y$ be two statistical-independent information sources. Suppose
    an outcome of $X$ is $a_i$ with a prior probability $p(a_i)$, an outcome of $Y$
    is $b_j$ with a prior probability $p(b_j)$. The joint probability of outcomes
