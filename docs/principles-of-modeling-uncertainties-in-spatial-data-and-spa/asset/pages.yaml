    # 7.3.3 QUASI DIFFERENCE


    Quasi difference is a form of partitioning fuzzy sets by means of the difference
    in their membership functions. The difference can be used to compare the fuzzy
    value of two fuzzy sets and also to analyze which has a higher value than the
