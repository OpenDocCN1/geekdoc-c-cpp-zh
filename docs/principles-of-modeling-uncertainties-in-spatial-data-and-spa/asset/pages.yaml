  pgno: 417
- img_proc: true
  md: '# Epilogue


    assurance. This state of affairs should be addressed with quality marks provided
    for all purchased GIS data products.


    However, quality assurance provided by quality marks is not as simple as the provision
    of “QC PASSED,” as an example. Specific quality classifications, as a classification
    of “excellent,” “very good,” and “good” level of quality related to object or
    feature level, map sheet level, coverage level, or overall data set are required.
    To enable quality to be determined by the users prior to purchase, such classifications
    require development and implementation of quality measurement methods for GIS
    data products. Obviously, the classification of GIS data products should take
    the users’ application requirements into consideration. The data quality mark
    should be attached to the most basic level of GIS products.


    # 18.3.4 DATA QUALITY STANDARDS


    Data quality standards are the guidelines by which GIS data providers can assess
    and report the quality of their spatial data products. Data quality standards
    have been developed by both international organizations, such as ISO/TC211, and
    national organizations. However, two major limitations are evident.


    Firstly, the published standards are not specific enough to guide GIS data providers
    regarding the implementation of these standards. For example, the demand of a
    data quality standard may be to measure positional accuracy of line objects in
    GIS. However, specific error measurement indicators and corresponding methods
    on how to measure the accuracy of line objects are not provided.


    Secondly, classification data quality elements in the current standards are based
    mainly on the understanding of spatial data quality. In the infancy of such understanding,
    classification was somewhat limited and primitive. For example, a forest land
    parcel contains both positional and attribute errors. However, no indicator to
    measure such (positional and attribute) errors exist. Therefore, in order for
    the user to receive comprehensive spatial data information, a need was evident
    to better categorize the present data quality elements in GIS data quality in
    terms of positional accuracy, attribute accuracy, completeness, consistency, and
    lineage. There indeed be a need to propose new foundation for the quality elements
    for spatial data.


    # 18.4 INTERACTION WITH OTHER DISCIPLINES


    Spatial concepts are not only used in geography. Indeed, spatial thinking is used
    in a wide range of disciplines, such as engineering, environmental sciences, ecology,
    medicine, economics, and psychology, beside geography. Therefore, methods developed
    for modeling geographic space can potentially be applied to other spaces, such
    as the human body and brain, social space, and even the cosmos.


    For example, representing the human body, GPS techniques have been reported to
    help surgeons position operating tools, enabling greater precision and accuracy.
    Three-dimensional images of the human brain can be visualized in virtual reality,
    enabling detailed views of the human brain space, from any chosen view point.
    Here, the method for building three-dimensional space models in GIS, such as the'
