    # 2.5.2 UNCERTAINTY IN SPATIAL DATA PROCESSING


    # 2.5.2.1 Uncertainty Introduced from Computation and Equipment


    Phenomena in the natural world, such as the terrain on the Earth’s surface, are
    naturally continuously. However, in a computer environment, these phenomena are
    presented in a discontinuous binary form. This approximation to the natural world
    is the fundamental source of uncertainty causing the difference between what is
    presented in GIS and the reality apparent in nature. Other factors related to
    computation and equipment may also cause uncertainties; include physical and logical
    modeling in GIS, data encoding, data processing, and computation and output methods.


    In GIS, the aim of modeling is to present aspects of the natural world through
    selection, simplification, and symbolization. Therefore, it can be expected that
    the modeling process itself carries uncertainty. For instance, if the size and
    shape of a bus station are not the requirements of the end users of a GIS, the
    bus station will be represented as a zero-dimensional point rather than a two-dimensional
    area object, despite the fact that it is


    Error can result in data processing as a consequence of the mishandling of equipment.
    For example, if a number is larger than the largest number storeable in a 32-bit
    computer, and this number is to be stored and processed in the computer used,
    an error will occur. One solution is to store that number by double-precision
    variable. Uncertainty is also associated with the “rounding off” process. For
    example, 0.385 rounded off to two decimal places is 0.39. The difference between
    0.385 and 0.39 is a rounding error. Rounding errors cause uncertainty in the manipulation
    of a mass of measured spatial data.


    Surveying equipment can only provide measurements of limited precision. Even if
    the precision quantity is sufficient, the output result may be suitably accurate
    if the output devices (such as the computer monitor or the printer) can only reach
    a certain accuracy or resolution level. Here, the selection of equipment that
    can accurately store, manipulate, and output a mass of exact values is necessary
    to ensure the presentation of reliable and exact measured results.


