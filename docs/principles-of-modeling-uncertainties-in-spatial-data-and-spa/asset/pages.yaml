  md: 'xxiv


    Therefore, Section V introduces another theoretical breakthrough in handling uncertainties
    in spatial data. This is from uncertainty description to spatial data quality
    control. In this regard, the quality control for spatial data is introduced. An
    explanation of quality control for object-based spatial data is given in Chapter
    12. The aim is to control the overall geometric quality of vector spatial data
    by the least squares adjustment method with an example for vector cadastral data.
    Quality control for point-based spatial data—and line-based transformation models—the
    aim being to geometrically rectify high resolution satellite imageries—is presented
    in Chapter 13. Quality control for digital elevation models, designed to improve
    DEM accuracy with the newly proposed hybrid interpolation model and bidirectional
    model, is described in Chapter 14.


    The methods for presenting data quality information are described in Section VI
    (Chapters 15 to 17). Visualization techniques for uncertainty information are
    provided in Chapter 15. Examples given are the error ellipse, arrow-based approach,
    grayscale map-based, color map, symbol-based approach, and the three-dimensional
    visualization approach. An object-oriented metadata system for managing metadata
    on uncertainty information solution is introduced in Chapter 16. A Web service-based
    data quality information solution for disseminating uncertainty information on
    the Internet is introduced in Chapter 17.


    Finally, in Section VII, (Chapter 18), a summary and comments on principles of
    modeling uncertainties in spatial data and spatial analyses are given. Suggestions
    for further development in the field of modeling uncertainties in spatial data
    and analyses are outlined.


