    # 3.2.1 PROBABILITY OF A RANDOM EVENT


    A random event, or simply, an event may or may not occur in cases where uncertainty
    exists. An event is a collection of outcomes of an experiment. Events consisting
    of a single outcome are known as simple or elementary events or samples. The collection
    of all possible outcomes for an experiment is defined as *sample space*. Sure
    and impossible events are denoted by $\Omega$ and $\varnothing$, respectively.


    # 3.2.1.1 Operations of Events


    Let A and B be two events. Relationships between these two events can be defined
    as follows:


    +   1. Inclusion: If event B occurs, event A must occur. This is indicated by
    $A \supset B$.

    2. Equivalence: If $A \supset B$ and also $B \supset A$, the two events are equivalent.
    This is indicated by $A = B$.

    3. Product: If A and B occur simultaneously, this is called product of A and B,
    denoted by $A \cap B$ (or $AB$).

    4. Sum: If event A or event B occurs, this is called a sum of A and B, denoted
    by $A \cup B$ (or $A+B$).

    5. Difference: If event A occurs and B does not occur, this is called a difference
    between A and B, denoted by $A|B$ (or $A - B$).

    6. Exclusion: Events A and B are said to be mutually exclusive if they do not
    occur simultaneously. This is indicated by $AB = \varnothing$.

    7. Complement: If events A and B are mutually exclusive and the outcome of an
    experiment is either A or B ($A + B = \Omega$), then B is the complement of A
    and is denoted by $B = A^c$.

    8. Exhaustion: If at least one of the events $A_1, A_2, \dots, A_n$ must occur
    when the experiment is performed ($A_1 \cup A_2 \cup \dots \cup A_n = \Omega$),
    then the set of events $\{A_1, A_2, \dots, A_n\}$, is called exhaustion.


    # 3.2.1.2 Definition of Probability


    By repeating experiment $n$ times, the probability of an event occurring can be
    estimated. The ratio $m/n$ is called the relative frequency of event A in $n$
    times of the experiment where $m$ represents the number of occurrence of A in
    the experiment. When $n$ is sufficiently large, by central limit theory the ratio
    $m/n$ approaches a constant $p$. That is,


    ```

    $$\lim_{n\to\infty} \frac{m}{n} = p.$

    ```


    The constant $p$ is the probability of the event A, denoted by $Pr(A) = p$.

    The value of $p$ provides an objective description for whether event A occurs,
    where $0 \le Pr(A) \le 1$. The probability of the sample space is $Pr(\Omega)
    = 1$, and the probability of any impossible event is $Pr(\varnothing) = 0$. Note
    that the ratio $m/n$ is subject to the result of'
