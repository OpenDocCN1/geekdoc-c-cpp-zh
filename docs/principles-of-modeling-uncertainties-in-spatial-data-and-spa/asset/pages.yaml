  md: '# Modeling Positional Uncertainty in Spatial Data


    Consequently, error models for one-, two-, three- and $n$-dimensional spatial
    features are required.


    # 4.3.1 ONE-DIMENSIONAL SPATIAL FEATURES


    A point in one-dimensional space is defined as a one-dimensional stochastic vector:
    $Q_{i1} = [x]$. This vector may follow a univariate normal distribution $(N_i)$
    as given in Equation 4.2.


    ```

    $Q_{i1} \sim N_i[\mu_i, \sigma_i^2], \eqno (4.2)$

    ```


    where $\mu_i$ and $\sigma_i^2$ are the parameters to denote the statistical properties
    of the point (i.e., its mean and variance). Coordinates in a GIS are thus derived
    from a probability distribution, where it is assumed that the expectations are
    the population values.


    Joining two points forms a line segment, $Q_{i11}Q_{i12}$, in one-dimension. This
    line segment is derived from two-dimensional stochastic vectors $Q_{i11} = [x_1]$
    and $Q_{i12} = [x_2]$. Let $\Sigma_{Q_{i11}Q_{i12}}$ denote the covariance matrix
    of the two vertices, which is


    ```

    $\Sigma_{Q_{i11}Q_{i12}} = \begin{bmatrix}\sigma_{x_1}^2 & \sigma_{x_1x_2} \ \sigma_{x_2x_1}
    & \sigma_{x_2}^2\end{bmatrix}, \eqno (4.3)$

    ```


    Any point on the line segment $Q_{i11}Q_{i12}$ is then represented by


    ```

    $Q_{ir} = (1-r)Q_{i11} + rQ_{i12} = (1-r)\mu_{i11} + r\mu_{i12}, r \in [0, 1],
    \eqno (4.4)$

    ```


    where $\mu_{i11}$ and $\mu_{i12}$ are the expectation of $x_1$ and $x_2$. Joining
    several one-dimensional line segments forms a polyline. This polyline is derived
    from one-dimensional stochastic vectors of its composite points: $Q_{i1} = [x_1],
    Q_{i2} = [x_2], \dots, Q_{im} = [x_m]$, where $i \in [1, m]$ and $m$ is the number
    of composition points. These stochastic vectors are used to represent the polyline
    with the line segments $Q_{i1}Q_{i2}, Q_{i2}Q_{i3}, \dots, Q_{i(m-1)}Q_{im}$.
    Let $\Sigma_{Q_{ij}Q_{ij+1}}$ denote the covariance matrix of two successive vertices,
    that is


    ```

    $\Sigma_{Q_{ij}Q_{ij+1}} = \begin{bmatrix}\sigma_{x_i}^2 & \sigma_{x_ix_{i+1}}
    \\sigma_{x_{i+1}x_i} & \sigma_{x_{i+1}}^2\end{bmatrix} (i=1, 2, \dots, m-1). \eqno
    (4.5)$

    ```


    Any point on the line segment $Q_{ij}Q_{ij+1}$ is then represented by


    ```

    $Q_{ir} = (1-r)Q_{ij} + rQ_{ij+1} = (1-r)\mu_{ij} + r\mu_{ij+1} (i=1, 2, \dots,
    m-1), r \in [0, 1], \eqno (4.6)$

    ```


    where $\mu_{ij}$ and $\mu_{ij+1}$ are the expectation of $x_i$ and $x_{i+1}$,
    respectively.'
