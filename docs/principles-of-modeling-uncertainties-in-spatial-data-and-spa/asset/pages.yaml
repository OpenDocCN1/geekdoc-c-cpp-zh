  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    on this consideration, two interpolation methods aiming to improve the quality
    of the generated DEM model are proposed and introduced in Chapter 14.


    # 8.4 ACCURACY ESTIMATION FOR A TIN MODEL


    The error sources of DEM models have been introduced in the above section. A further
    issue is to quantitatively estimate the effect of these error sources on the generated
    DEM.


    Of the two types of DEM models, the regular gridded DEM and the irregular TIN,
    less research has focused on the accuracy estimation of the latter, owing to the
    fact that it is more mathematically complex. A method for estimating positional
    accuracy of TIN (Zhu, et al., 2005) is introduced in this section and an accuracy
    estimation of regular gridded DEM (Shi et al., 2005) is also given in Section
    8.5.


    For a TIN model, three given points (usually three vertices of a triangle in a
    three-dimensional space) are used to form a plane. Let $A$, $B$, and $C$ indicate
    the three points denoted by $A(x_1, y_1, z_1)$, $B(x_2, y_2, z_2)$, and $C(x_3,
    y_3, z_3)$. The triangle surface is then expressed as


    ```

    $z = ax + by + c,$$

    ```


    where coefficients $a, b$, and $c$ are


    $a = \begin{bmatrix} z_1 & y_1 & 1 \ z_2 & y_2 & 1 \ z_3 & y_3 & 1 \ x_1 & y_1
    & 1 \ x_2 & y_2 & 1 \ x_3 & y_3 & 1 \end{bmatrix}, b = \begin{bmatrix} x_1 & z_1
    & 1 \ x_2 & z_2 & 1 \ x_3 & z_3 & 1 \ x_1 & y_1 & 1 \ x_2 & y_2 & 1 \ x_3 & y_3
    & 1 \end{bmatrix}, c = \begin{bmatrix} x_1 & y_1 & z_1 \ x_2 & y_2 & z_2 \ x_3
    & y_3 & z_3 \ x_1 & y_1 & 1 \ x_2 & y_2 & 1 \ x_3 & y_3 & 1 \end{bmatrix}$


    A TIN model is expressed by a set of equations. The $z$-value of a point on the
    TIN surface can be obtained by an interpolation based on the set of equations
    and $x$- and $y$-coordinates of the point.


    Equations 8.12 and 8.13 state that the linear interpolation of a point on a TIN
    surface is solely determined by the initial points $A$, $B$, and $C$. Errors in
    these initial points are propagated to the TIN surface through the interpolation
    process, and these propagated errors exist in the surface of the DEM.


    To quantify the error in the model, an error propagation formula for the TIN generated
    from linear interpolation based on probability theory has currently been derived
    and is described in the following sections.'
