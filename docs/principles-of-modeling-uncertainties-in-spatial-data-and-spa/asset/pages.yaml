    # 5.2. PROBABILITY VECTOR AND THE FOUR PARAMETERS


    # 5.2.4.1 Maximum Likelihood Classification


    The concept of probability vector and four parameters derived from the probability
    vector are introduced in this section. Both the probability vector and the four
    parameters can be used to describe attribute uncertainty of a classified image
    from a maximum likelihood classification. The probability vector can also be used
    to describe the spatial distribution of that uncertainty.


    In a maximum likelihood classification, conditional probability $P(C_i|Z_t)$ provides
    a probability that a designated pixel $Z_t$ belongs to $C_i$ class. The classification
    is processed, according to the following rules:


    ```

    $Z_t \in C_i \quad P(C_i|Z_t) > P(C_j|Z_t) \text{ for all } j \neq i . \quad (5.7)$

    ```


    That is, if $P(C_i|Z_t)$ is the maximum, the pixel will be categorized as one
    member in class $C_i$. This is a special case of a Bayesian classification.

    In the Formula 5.7, $P(C_i|Z_t)$ is usually an unknown, but under the condition
    with trained data set and the prior knowledge of land cover (i.e., the percentage
    of each land cover), the known value can be estimated. Bayes'' rule for be expressed
    as the conditional probabilities $P(C_i|Z_t)$ and $P(Z_t|C_i)$ as follows:


    ```

    $P(C_i|Z_t) = P(Z_t|C_i) \cdot P(C_i) / P(Z_t), \quad (5.8)$

    ```


    where $P(Z_t|C_i)$ is the probability of $Z_t$ value appeared in class $C_i$,
    and $P(C_i)$ indicates the probability of class $C_i$ appeared in the whole image.
    It is possible to calculate the'
