  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 5.1.2 ATTRIBUTE UNCERTAINTY


    Attribute uncertainty is defined by the closeness of an attribute value to its
    true value in the real world, where objects are usually complex. example, materials
    of a spatial object may not be evenly distributed within the boundary of the object.
    Furthermore, boundaries of spatial objects are often not crisp.


    The nature and quantity of attribute uncertainty is determined by a series of
    factors. These may include, for example, (a) the attribute characteristics of
    the spatial objects themselves, (b) the process of recognizing the attributes,
    (c) the methods and technologies used for measuring or acquiring the attribute
    values, and (d) mathematical characteristics of spatial analysis and modeling
    approaches applied to the attribute data.


    The nature of attribute uncertainty can be inaccuracy, randomization, or fuzziness.
    After a spatial data capturing process, attribute uncertainty of a spatial entity
    can be, for example, a random variable in space or time domain. Attribute uncertainties
    can also be related to the scale of spatial resolution, sampling size and scheme,
    as well as other factors.


    Attribute uncertainty may heavily affect the quality of spatial decision making.
    In many GIS applications, the attribute accuracy requirements are even higher
    than those for positional accuracy. For example, in urban planning applications,
    the accuracy requirement of the class type (attribute accuracy) is even higher
    than that of boundary positional accuracy.


    The two kinds of attribute data—categorical and continuous, defined above—require
    corresponding, and thus different, uncertainty modeling methods and accuracy indicators.
    Continuous attribute data error can be modeled in a similar way to that of positional
    error. For example, propagation law may be applied. This law is commonly used
    for modeling positional error propagation, and can also be used to estimate attribute
    uncertainty propagation for continuous attribute data.


    # 5.1.3 SOURCES OF ATTRIBUTE UNCERTAINTY


    Attribute uncertainty arises from the following sources:


    +   a. The attribute nature of objects in the natural world. The material within
    a spatial object may not be homogenous, but rather heterogeneous. Therefore, the
    spectral characteristics of such objects are not quite ruler complex. Another
    example is the fuzzy boundary of a spatial object, such as the boundary of a soil
    unit. This is a transition zone, rather than a crisp boundary.

    b. Potential errors or uncertainty introduced by the methods and technologies
    applied for measuring or acquiring attribute values. Satellite imaging technology
    is often applied to capture capture remotely sensed images from the Earth''s surface.
    The attribute values of spatial objects (such as the land cover types) obtained,
    based on the spectral information of the satellite images, possess uncertainty,
    due to the limited spectrum information in the images.

    c. Spatial attribute object cognition uncertainties arising from limitations.
    Methods whereby attributes of spatial objects can be understood either'
