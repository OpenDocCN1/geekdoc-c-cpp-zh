    # 15.4.1 MAXIMUM LELIHOOD CLASSIFICATION


    In a maximum likelihood classification, a pixel is classified as a class in which
    the pixel has the maximum probability, based on the spectral information. With
    the maximum likelihood classification, each pixel in Figure 15.6a is allocated
    to a class in which it has the highest probability, as shown in Figure 15.6b.


    Section 5.1.4 of this book defines relative accuracy ($U_k$), which is used to
    describe the probable classification between two classes ($C_i$ and $C_j$) for
    a pixel ($Z_p$). The value of the parameter $U_k$ is within the range $[0, 1]$.
    The larger the parameter value, the easier the discrimination between the $C_i$
    and $C_j$ for the pixels $Z_p$. That is to say, there is less that that pixel
    $Z_p$ is misclassified between classes $C_i$ and $C_j$. For example, if $P(C_i/Z_p)$
    is 85% and $P(C_j/Z_p)$ is 5%, then $U_k$ is 0.80. Therefore, it is most likely
    that pixel $Z_p$ is classified as class $C_{ii}$, rather than $C_{ij}$. For example,
    $P(C_{ii}/Z_p)$ is 44% and $P(C_{ij}/Z_p)$ is 40%, then $U_k$ is 0.04. In this
    case, it is not sure whether $Z_p$ should be classified as class $C_{ii}$ or $C_{i2}$.
    Misclassification may easily happen on occasions.


