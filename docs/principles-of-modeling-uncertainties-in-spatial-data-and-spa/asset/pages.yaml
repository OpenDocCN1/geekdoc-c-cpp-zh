    # 10.3.2 NORMALIZED DISCREPANT AREA


    A normalized discrepant area, to measure buffer positional uncertainty in a generic
    case, where “true” and the measured buffers either overlap or do not overlap,
    presents another uncertainty indicator. This uncertainty indicator is derived
    based on the concept of a discrepant area, originally used to describe discrepancies
    between spatial features.


    A simple method for estimating positional uncertainty in a buffer around a point
    is based on minimum and maximum distances between the “true” buffer and the measured
    buffer. The minimum and maximum distances are


    ```

    $$\begin{cases} Min_d = \min_{p \in O_i, q \in A_i} d(p,q) \ Max_d = \max_{p \in
    O_i, q \in A_i} d(p,q) \end{cases} \quad (10.23)$

    ```


    where $A_i$ is a collection of locations in $O_i$ in the buffer around the “true”
    point $\hat{Q}_i$, $A_i$ is a collection of locations in the buffer around the
    measured point $\check{Q}_i$, and $d(p,q)$ is the Euclidean distance between $p$
    and $q$. The value of $Min_d$ is the shortest distance between the “true” and
    measured buffers, and the value of $Max_d$ is the farthest distance between the
    buffers (see Figure 10.7).


    This simple approach does not consider positional uncertainty in all points inside
    the buffer. Mathematically, a line and a region contain an infinite number of
    points. Likewise, both the boundary and the interior part of a buffer also contain
    an infinite number of points. The minimum and maximum distances between the points
    are relatively simple measures of the uncertainty in the buffer.


    To provide a full description of buffer uncertainty, the distance discrepancy
    is proposed, as the area difference between the “true” buffer and the measured
    buffer.'
