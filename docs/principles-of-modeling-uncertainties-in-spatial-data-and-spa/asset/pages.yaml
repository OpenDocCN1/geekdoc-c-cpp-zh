    \ hybrid model gives interpolation results that better represent the terrain than\
    \ either the bicubic or bilinear interpolation models.\n\nThe relationship between\
    \ the hybrid parameter p and the complexity of a terrain has also been studied\
    \ experimentally. Gao (1998) proposed three measures for representing the complexity\
    \ of a terrain: the terrain waviness parameter, the standard deviation of elevations,\
    \ and the contour density.\n\nTo model the relationship between p and the terrain\
    \ complexity, a Gauss function was used to generate terrain with various complexities\
    \ (Liu, 2002). The Gauss surface is expressed as:\n\n```\n$z = A\\left[1-\\\\\
    left(\\left(\\\\frac{x}{m}\\right)^2+\\left(\\\\frac{y}{m}\\right)^2\\right)^{\\\
    frac{3}{2}}\right]-B\\left[0.2\\left(\\left(\\\\frac{x}{m}\\right)^2+\\left(\\\
    \\frac{y}{m}\\right)^2\\right)^{\\frac{5}{2}}-\\left(\\left(\\\\frac{x}{m}\\right)^2+\\\
    left(\\\\frac{y}{m}\\right)^2\\right)^{\\frac{7}{2}}\right]\\right]\\n-Ce\\left(\\\
    left(\\\\frac{x}{m}\\right)^2+\\left(\\\\frac{y}{m}\\right)^2\\right)^{\\frac{3}{2}}\\\
    right)$ (14.15)\n```\n\nIf the optimal hybrid parameter is regarded as a function\
    \ of the terrain complexity, this function, according to the experimental results,\
    \ tends to be a monotonic function. Therefore, the hybrid parameter can be determined\
    \ based on the terrain complexity level.\n\nIn a practical application, experimental\
    \ regions that cover the complex levels of the terrain are first chosen, and the\
    \ optimized hybrid parameter value at each complexity level can be determined.\
    \ These optimized values of the hybrid parameter are applied at various complexity\
    \ levels to the terrain area in a hybrid interpolation process. The optimal hybrid\
    \ parameter is computed for each of the complex levels of the terrain. The average\
    \ of all optimal hybrid parameter values serves as the optimal hybrid parameter\
