    # 15.7.1 The 3D Approach For Vector Data


    For vector data, two main types of uncertainty measures exist: (a) geometric measure,
    and (b) scalar quantity. For example, the error ellipse is a geometric measure,
    which gives a confidence region for two-dimensional points so that this region
    contains the true location of the point with a predefined probability. In a three-dimensional
    case, the error ellipse evolves into an error ellipsoid model. This ellipsoid
    model aims to describe positional uncertainty for a three-dimensional point by
    means of an ellipsoid (Figure 15.14).


