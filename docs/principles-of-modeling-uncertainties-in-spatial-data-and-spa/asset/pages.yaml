    # 5.2 METHODS FOR MODELING ATTRIBUTE UNCERTAINTIES


    Methods for describing attribute uncertainties in spatial data are introduced
    in this section. They include sampling methods, error matrix, probability vector,
    and corresponding error parameters, rate of method, and sensitivity analysis.
    The theoretical bases supporting these and other attribute uncertainty modeling
    methods include statistics, probability theory, and fuzzy set.


    # 5.2.1 SAMPLING METHODS


    Sampling is an important method for assessing uncertainty in attribute data, especially
    categorical attribute data. Three statistical methods, dealing with categorical
    attribute uncertainty are selected from current literature. All are based on an
    experimental approach: (1) the percentage correctly measured per class or for
    the whole set (Rosenfeld, 1986); (2) the percentage correctly measured per class
    or for the whole set at a given confidence level (Aronoff, 1985; Hord and Brooner,
    1976); and (3) the percentage of correctly measured per class or for the whole
    set (Greenland et al., 1985; Rosenfeld and Fitzpatrick-Lins, 1986). The attribute
    data can be such as an area-class map or a remotely sensed image.


    These methods are suitable, in various ways, for categorical attribute data assessment.
    The emphasis in this section is on remote sensing classification assessment. Categorical
    attribute data accuracy can be assessed by evaluating a sample of the classification
    result. The classes defined by classification are defined as reference data. By
    comparing the measured data with the reference data, an error matrix can be formed.
    This matrix describes the quality of the classification as a whole, and that of
    individual classes. Based on this matrix, further analysis of classification accuracy
    can be carried out. The error matrix concept is introduced in Section 5.2.3


    The sampled data act as an input to an error matrix or other advanced statistical
    analyses in the sampling-based attribute uncertainty assessment methods. In this
    process, the selection of minimum significant samples is of importance. Two basic
    factors affect the quality of the sample: size and scheme.'
