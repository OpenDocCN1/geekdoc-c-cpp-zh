  md: '# Improved Interpolation Methods for Digital Elevation Model


    Jensen and Anastassiou (1990) proposed an interpolation method that preserved
    the edges of an image. This method detects the edges and conducts interpolations
    along the orientation of each edge. Algazi et al. (1991) developed a directional
    interpolation technique to enhance the perception of the interpolated image. This
    work, however, focused on interpolating edge regions in one direction only, and
    simple averaging (Bayreki and Merseneau, 1995). Kwon et al. (2003) studied directional
    interpolation for images; five distinct directions were predefined, and different
    interpolation methods were used in each of these directions. In general, the above
    methods understand: that pixel values change more frequently in the direction
    across the edge but change more steadily along the edge direction.


    For digital terrain modeling, research on directional interpolation algorithms
    is limited. In Sections 14.3.1 to 14.3.3 below, a bidirectional interpolation
    method for DEM models is proposed and presented. In the new interpolation design,
    terrain changes in two different directions are made, and correspondingly different
    interpolation strategies are applied for the different directions.


    # 14.3.1 Mathematical Formula for Bidirectional Interpolation coefficients


    Bidirectional interpolation conducts terrain interpolation along two perpendicular
    directions (the x and y directions) by applying two interpolation methods. According
    to the terrain complexity levels in the x and the y directions, different interpolation
    (linear and nonlinear) models are applied. The problem of a two-dimensional interpolation
    is then decomposed into a problem of three-dimensional interpolations. The commonly
    used cubic interpolation is taken as the nonlinear method, as follows:


    Linear interpolation and a cubic interpolation in one-dimension are given


    ```

    z = a1 + a2x

    ```


    and


    ```

    z = a1 + a2x + a3x^2 + a4x^3

    ```


    where ai (i = 1, 2, 3, 4) are estimated, based on two known points with their
    derivatives. The value of each derivative is estimated using finite difference
    approximations such as the forward difference, the backward difference, and the
    central difference.


    Given locations of points A, B, C, and D, as in Figure 14.3, the elevation of
    O can be derived from the following bidirectional interpolation:


    Step 1: Estimate the slopes of A''D'' and B''C'' (denoted by GaD'' and GB''C'')
    with a threshold ε. If GaD'' ≥ε, the one-dimensional cubic method is then employed
    to achieve interpolated result EE¹. Otherwise, if GaD'' <ε, one-dimensional linear
    interpolation is applied to achieve the interpolated result EE¹.'
