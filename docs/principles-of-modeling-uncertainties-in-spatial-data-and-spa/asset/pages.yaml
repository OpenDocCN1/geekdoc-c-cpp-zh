    (6) The error limit for area parcel adjustment


    The difference between the registered and digitized parcel areas is sometimes
    later. This may be because the digitization error is itself too large or because
    the value of the registered area is in doubt. For this reason, an error limit
    is set up for area parcel adjustments to ensure that the adjusted coordinates
    are within an acceptable level. If the difference is below the error limit, adjustments
    to the parcel area are made. If not, further effort should be made to check the
    reason for the difference. In the following, the error limit is derived, based
    on the assumption that the mean square error of the digitized coordinate is 7cm.
    (This example is based on previous case studies.) According to Equation 12.2,
    the variance of area


    ```

    $$\sigma_A^2 = AD_{\zeta}^2 A^T$$

    ```


    where $A = [a_1\ b_1\ a_2\ b_2\ ...\ a_n\ b_n]$; $\zeta = [x_1\ y_1\ x_2\ y_2\
    ...\ x_n\ y_n]^T$; $\sigma_A$ is the variance in area, $D_{\zeta}^2$ is a diagonal
    matrix representing the variances of the digitized coordinates, and $D_{\zeta}^2
    = diag(0.49, 0.49, ..., 0.49)_{2n\times2n}$.


    From the above equation, it can be that the variance is related to the number
    of vertices and sides of the parcels. Therefore, $2\sigma_A$ or $3\sigma_A$ is
    usually chosen as the area error limit.


