    # 3.3 STATISTICS


    # 3.3.1 INTRODUCTION OF STATISTICS


    The natural world is full of uncertainties, with randomness being a type of uncertainty
    that can be dealt with by statistics. Statistical inference draws sensible and
    accurate conclusions from uncertainties by analyzing data collected from the natural
    world. Probability theory is the backbone of sophisticated statistical inference,
    enabling data analysis by a model-based approach. When the distribution of a random
