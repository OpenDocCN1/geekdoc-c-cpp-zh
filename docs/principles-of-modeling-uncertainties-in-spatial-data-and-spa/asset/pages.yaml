    # 13.5 EXPERIMENTAL STUDIES ON POINT-BASED MODELS


    An experimental study is described below. The objectives of this study are to
    test the performance of the two-dimensional transformation models for rectifying
    high-resolution satellite images with without projecting GCPs onto a compensation
    plane. In addition, the performance of the three-dimensional transformation model
    for determining three-dimensional ground coordinates from stereoscopic images,
    regarding the terrain variation and the number of GCPs, is tested.


    # 13.5.1 DATA SET


    Two IKONOS images, covering the central part of Hong Kong, were used in this study.
    Image 1 (Figure 13.2a) covered an area of 11.60 km × 10.28 km over a portion of
    Hong Kong Island and the Kowloon district, and Image 2 (Figure 13.2b) covered
    an area of approximately 2.5 km × 10 km between Image 1 and Image 2. These two
    images have an overlapping area (approximately 2.5 km × 10 km) between Image 1
    and Image 2. These two images equaling 0.87. The maximum ground height difference
    in the test area was approximately 450 meter.


    There were 38 ground control points (GCPs) identified for Image 1, and 18 for
    Image 2. The GCPs were measured by differential GPS techniques with twice Trimble
    4000 SSI systems. The accuracy of these measured points is of the order of 5 cm
    in X and Y directions and 10 cm in the Z direction, respectively. Several control
    points were landmarks and others were intersections between sidewalks and roads.


