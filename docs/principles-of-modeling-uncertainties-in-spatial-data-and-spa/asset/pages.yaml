  md: '# xii


    # Preface


    spatial analyses, quality control for spatial data, and finally a presentation
    of uncertainty information. Theories and methods for handling these uncertainties
    are given and, as such, form principles for modeling uncertainties in spatial
    data and spatial analyses.


    In line with the logic of uncertainty generation and handling outlined above,
    this book is organized in seven sections: (I) overview, (II) modeling uncertainties
    in spatial data, (III) modeling uncertainties in spatial model, (IV) modeling
    uncertainties in spatial analyses, (V) quality control of spatial data, (VI) presentation
    of data quality information, and (VII) epilogue. each section are several chapters.
    The outline of the seven parts, listed above, is as follows.


    Section I (Chapters 1-3) provides an overview of the principles of modeling uncertainty
    of spatial data and spatial analysis, with the principles of uncertainty in general
    however with the concepts of uncertainty in spatial data and analyses introduced
    in Chapter 1. Various uncertainty sources are summarized in Chapter 2. They include
    uncertainty inherited in the real and natural worlds, uncertainty due to human
    cognition, uncertainty introduced in data capture processes, and uncertainty arising
    from spatial data processing and spatial analysis. Mathematical foundations of
    uncertainty modeling in spatial data and analyses are summarized in Chapter 3.
    They include probability theory, statistics, evidence theory, fuzzy set and fuzzy
    topology, and rough theory, as well as information theory and entropy.


    The developed methods for handling uncertainties in spatial data are introduced
    in Section II (Chapters 4 to 6). Uncertainties in spatial data can be classified
    into the following five types: (a) positional uncertainty, (b) attribute uncertainty,
    (c) temporal uncertainty, (d) incompleteness, and (e) logistic inconsistency.
    Since temporal information can be regarded as a form of attribute information,
    the methods for handling attribute uncertainty are potentially applicable to handling
    temporal uncertainty. Positional uncertainty modeling is the focus of Chapter
    4 while attribute modeling is introduced in Chapter 5. Uncertainty modeling for
    integrated positional and attribute uncertainty, an issue which is critical in
    multisource data integration, is introduced in Chapter 6.


    Error models for positional uncertainty have been comprehensively studied and
    presented systematically, as uncertainties for points, line segments, polylines,
    polygons, and area objects in Chapter 4. Line features are modeled through (a)
    the confidence region, (b) error distribution, and (c) error of points on the
    lines with correlated and independent cases. Of these error models, the confidence
    region model of line segment forms the corner stone of positional error modeling
    of object-based GIS.


    As previously indicated, geographic phenomena can fall into two classes: the determine-based
    and the uncertainty-based. Previous solutions have mainly provided determine-based
    representation of space and time in Euclidean space, where determined points,
    lines, areas, and volumes are described. Uncertainty modeling of spatial data
    presented in Chapter 4 forms a basis for uncertainty-based representation of the
    geographic entities covering points, line segments, polylines, curve lines, and
    polygons.


    The properties of attribute uncertainty and the methods to model the attribute
    uncertainties in GIS and remote sensing are introduced in Chapter 5. These methods'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Preface


    include the rate of defect model, the use of which is straightforward for practical
    applications; the probability vector models, which can indicate uncertainty spatial
    distribution; and the commonly used error method matrix.


    The method for integrating positional and attribute uncertainties is introduced
    in Chapter 6. It should be noted that modeling the integrated error is a critical
    issue in multisource data integration. The theoretical model “S-band” and the
    two solutions of the model are given: (a) probability theory-based solution and
    certainty factor-based solution.


    Modeling uncertainties in spatial models is introduced in Section III (Chapters
    7 and 8). Modeling uncertain topological relationships between objects in GIS
    is covered in Chapter 7. The concepts for topological relationships between objects
    are introduced. In addition, fuzzy topology is added to model uncertain topological
    relationships between spatial objects in GIS. Geographic objects can, in fact,
    be represented by either spatial data or spatial models. Two typical examples
    of a spatial model are the digital elevation model (DEM) and curve functions in
    GIS. Natural terrains in the natural world can be represented by digital elevation
    models. In this case, the model can be regular, such as a regular tessellation
    like a square, or irregular, such as a triangulated regular network (TIN). A curve
    in the natural world—for instance, a curved portion of a road—can be represented
    by either a regular curve, such as circular curve, or an irregular curve, approximated
    by the third-order spline curve.


    Since error curves for handling model error are introduced in Chapter 4 (Section
    II), Chapter 8 concentrates mainly on handling model error in DEM. DEM model accuracy
    estimation: (a) a formula to estimate the average model accuracy of a TIN, and
    (b) accuracy estimation of the bicubic interpolation model.


    Modeling uncertainties in spatial analysis is the focus of Section IV (Chapters
    9 to 11). Here, spatial analysis refers to GIS spatial analyses, such as overlay
    analysis, buffer analysis, and line simplification analysis. Each analysis is
    a transformation, based on one or more original spatial data set. Uncertainty
    inherited from the original data set is further propagated or amplified through
    such a spatial analysis. In many cases, new uncertainties are also generated.
    In addition to modeling uncertainty in static spatial data, a logical further
    step is to model uncertainty in spatial analyses.


    Covered in Chapter 9 is modeling uncertainties in overlay spatial analyses, whereas
    analytical and simulation approaches for determining uncertainty propagated through
    an overlay analysis. Modeling uncertainty in buffer spatial analysis is covered
    in Chapter 10. A solution for quantifying uncertainty propagation through a buffer
    analysis, where four indicators are proposed for quantifying the uncertainties.
    In Chapter 11, the newly proposed uncertainty modeling method for line simplification
    analysis is given.


    Focus in the first chapters is on descriptions of uncertainties, including descriptions
    of uncertainty in spatial data, descriptions of uncertainty in spatial analysis,
    and descriptions of uncertainty in spatial models. To ensure an understanding
    of handling uncertainty, description is a necessary step; a further step is to
    control or even reduce the uncertainties in the spatial data, analyses, or models,
    if possible.'
