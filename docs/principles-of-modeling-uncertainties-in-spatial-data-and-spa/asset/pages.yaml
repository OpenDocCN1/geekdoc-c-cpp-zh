    To guarantee that the first derivative across grid cell boundaries is smooth,
    the lower-order interpolation method is applied, such as the bicubic interpolation.
    The 36-term bicubic interpolation is expressed as


    ```

    $z=a_{00}+a_{10}x+a_{01}y+a_{11}xy+a_{20}x^2+a_{21}x^2y+a_{02}y^2+a_{12}xy^2+a_{22}x^2y^2+a_{30}x^3+a_{31}x^3y+a_{32}x^2y^3+a_{03}y^3+a_{13}xy^3+a_{23}x^2y^3+a_{33}x^3y^3+a_{40}x^4+a_{41}x^4y+a_{42}x^3y^2+a_{43}x^3y^3+a_{04}x^4+a_{14}xy^4+a_{24}x^2y^4+a_{34}x^3y^4+a_{44}x^4y^4+a_{50}x^5+a_{52}x^4y^2+a_{53}x^3y^2+a_{54}x^2y^3+a_{05}y^5+a_{25}x^2y^3+a_{35}x^3y^4+a_{55}x^3y^5$.
    (8.11)

    ```


    This method is relatively complicated. In addition to the four DEM vertices, the
    first, second, third, and fourth derivatives are used for estimating the coefficients
    of the polynomial in Equation 8.11.


    To give an interpolation approach that can generate a highly accurate DEM for
    any type of terrain surfaces presents some difficulties. Theoretically, a lower-order
    polynomial is more applicable to a less complex terrain, whereas a complex terrain
    can be well approximated by a higher-order polynomial. A higher-order polynomial,
    however, may require computation load, and lead to the instability of the coefficients,
    resulting in an unrealistic surface. First-, second-, and third-order polynomials
    are used, mostly, in practical applications.


    # 8.2.2 REGULAR GRID DIGITAL ELEVATION MODEL


    A regular digital elevation model is a digital representation of a continuous
    surface by a regular array of z values, referenced to a common datum (Figure 8.3).


    ![](img/978c1925ca93296ea7a944399abc8952_231_0.png)


    The grid size determines the DEM resolution. In practical applications, this is
    determined based on the level of the surface details to be extracted. For example,
    in a hydrological application, detailed topographic features can be extracted
    from a DEM with a 10m resolution. It is difficult however to extract these features
    from a 30m resolution. In general, the higher DEM resolution, the more detailed
    the extracted features. However, a high resolution DEM means a higher data volume
    level and computation load.


    > FIGURE 8.3 An example of the regular grid elevation model.


    One weakness of the grid representation is its discontinuous representation of
    the terrain. Feature lines (such as ridge, gully, and others) can not be well
    represented. Similarly, the grid cannot give a satisfactory representation of
    man-made objects (such as roads or buildings), either. It can provide an effective
    representation of smooth natural terrains.'
