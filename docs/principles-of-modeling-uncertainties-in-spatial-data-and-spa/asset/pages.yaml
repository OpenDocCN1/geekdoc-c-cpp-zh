    # 13.6.2 RESULTS AND ANALYSIS


    The two-dimensional affine and finally conformal LBTM for a test of the model
    for image registration were applied. The following operational procedure was applied
    for image registration: (a) Digitize the GCLs in the master and the reference
    images, (b) calculate the unit vector components of the GCLs, (c) determine the
    coefficients of the LBTM using the GCLs, (d) correct the calculated translation
    coefficients by the aide of point, and finally (e) substitute the coefficients
    calculated from the LBTM forms to register the whole image. Tests have been conducted
    using the real data sets, and the results are summarized in Figure 13.6 in terms
    of RMS errors of the independent checkpoints in the X and Y directions.


    It is noticed from the results that the LBTM performed well in all experiments.
    The results obtained using the two-dimensional conformal LBTM are more consistent
    than those resulting from the two-dimensional affine LBTM. The checking points
    RMS errors for the image rectified by two-dimensional conformal LBTM are consistently
    around 1 m.


    A higher GCL accuracy gives the better results. Generally, the accuracy of the
    results does not change significantly when the GCL count exceeds a certain number.
    Numbers range from 12 to 16 GCLs. The results of the nadir registration or near-to-nadir
    images are slightly better than those of off-nadir images.


    The experiments show that both forms of the LBTM are applicable for image-registration
    of high-resolution satellite imagery. In particular, a higher accuracy (better
    than two pixels) can be achieved using a moderate number of GCLs for building
    the LBTM.'
