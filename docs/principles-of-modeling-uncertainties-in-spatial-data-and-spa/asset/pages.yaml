  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    Two approaches can be used for modeling uncertainties in the line simplification:
    (a) linear attribute measurements and (b) displacement measurement. These studies
    are reported in the literature on line simplification error modeling. These studies
    are based on the linear attribute measurement approach (Butterfield, 1985, 1991;
    McMaster, 1986; Jasinski, 1990; Veregin, 2000). Additional, research has been
    conducted on object simplification modeling, based on displacement measurement.
    These studies include, for example, methods based on polygon distortion (White,
    1985; McMaster, 1987; Butterfield, 1991), methods based on uniform form distance
    (Veregin, 2000; Cheng and Shi, 2004), methods based on displacement vector (McMaster,
    1986), and critical distance methods (Little, 1989).


    This chapter offers comprehensive uncertainty in line simplification. Covered
    are both types of error: error in the initial line and error generated through
    a line simplification process.


    #  11.2 UNCERTAINTIES IN LINE SIMPLIFICATION


    The uncertainty of a line simplification method can be quantified by measuring
    the difference between the initial line and the simplified version of the line.
    The uncertainty in a simplified line is measured by considering two error sources:
    (a) uncertainty of an original line and (b) uncertainty introduced when generating
    the simplified line from the original line by applying a line simplification method.


    Uncertainties in line simplification are defined as three categories of error
    as follows: (a) the measurement error in the original line, (b) the model error
    generated by a line simplification algorithm, and (c) the total error, the sum
    of (a) and (b).


    Measurement error is defined as the deviation between the “true” and the measured
    line. This error indicator can be used to measure the difference between the two
    versions of the line, yielding the uncertainty of the error in the original line.


    As described in Section 2.4, a line in GIS can be captured by either map digitization
    from a map field, survey by GIS, or station, photogrammetric, or other survey
    methods. In such line capture processes, error is unavoidable. The nature of these
    measurement errors can be random, systematic, or gross. In the real case, error
    is largely random. Furthermore, line measurement errors will propagate to a simplified
    line by means of a line simplification process.


    Model error is defined as the deviation of a simplified line from the original
    line, by applying a line simplification operation on the original line. The line
    simplification error can be measured by comparing the difference between the original
    line and the simplified line after a line simplification is applied.


    The nature of the line simplification error is complex and depends on the characteristics
    of the specific line simplification method, applied. Model error varies according
    to different simplification algorithms; some may have relatively smaller model
    error, others may be significant.


    Total error is defined as the overall error, which covers both measurement error
    and line simplification model error. The total error can be measured by comparing
    the “true” original line with the measured simplified line.'
