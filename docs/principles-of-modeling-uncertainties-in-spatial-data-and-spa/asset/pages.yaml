    # 3.6.5 ROUGH EQUALITY AND ROUGH INCLUSION


    # 3.6.5.1 Rough Equality of a Set


    A distinction between a rough set and a classical set is drawn from the definition
    of equality. Equality in the classical sets refers to two sets, the elements of
    which are completely the same, while in a rough set, two sets are said to be equal
    if elements in these two sets are approximately the same. The definition in a
    rough set is sometimes more realistic. This can be explained by the fact that
    it is always difficult to guarantee that the available information or knowledge
    about the two sets is complete. Thus, the set equality is derived based on the
    information or knowledge available, regardless the relevant elements.


    Suppose $K=(U,R)$ is an approximation space, $X$ and $Y$ belong to a universe
    $U$, and $R \in(K)$. Three approximate rough equalities are defined as


    +   1. When $R\_(X) = R\_(Y)$, sets $X$ and $Y$ have lower $R$-equality, abbreviated
    as $(X)\_R(Y)$.

    2. When $R''(X) = R''(Y)$, sets $X$ and $Y$ have upper $R$-equality, abbreviated
    as $(X)^R(Y)$.

    3. When $R\_(X) = R\_(Y)$ and $R''(X) = R''(Y)$, sets $X$ and $Y$ have $R$-equality,
    abbreviated as $(X)\approxR(Y)$.


    For any equivalence relation, the following properties are true:


    +   1. When $(X \cap Y)$, $R\_(X)$ and $(X \cap Y)$, $R\_(Y)$, $(X)\_R(Y)$.

    2. When $(X \cup Y)$, $R\_(X)$ and $(X \cup Y)$, $R\_(Y)$, $(X)\_R(Z)$.

    3. When $R\_(X'')$ and $R''(Y'')$, $(X \cup Y'')$, $R''(X'' \cup Y'')$.

    4. When $R''(X'')$ and $R''(Y'')$, $(X \cap Y)$, $R\_(X'' \cap Y'')$.

    5. When $R\_(Y)$, $(X \setminus Y)$, $R\_(\emptyset)$.

    6. When $R\_(X'')$, $(X \setminus Y'')$, $R\_(\emptyset)$.

    7. When $X \subseteq Y$ and $(Y \setminus X)$, $R\_(\emptyset)$, $(X)\_R(\emptyset)$.

    8. When $X \subseteq Y$ and $(Y \setminus X)$ iff $R\_(Y)$.

    9. $(\sim X)$, $R\_(Y)$ iff $R\_(Y)$.

    10. When $R\_(X)$ or $R\_(Y)$, $(X \cap Y)$, $R\_(\emptyset)$.

    11. When $R\_(U)$ or $R\_(Y)$, $(X \cup Y)$, $R\_(U)$.


    For any equivalence relation $R$, we have $R\_(X) = R\_(Y)$ if $R\_(X)$ is the
    intersection of all $Y \subseteq U$. If $R(X)$ is the union of all $Y \subseteq
    U$, we have $R(X) = R(Y).


    Rough equality is based on the upper approximation and the lower approximation
