    # 3.2.3 STATISTICAL PROPERTIES OF THE RANDOM VARIABLE


    # 3.2.3.1 Expectation and Variance


    Let X a random variable having a p.d.f.$f(x)$. The expectation of this random
    variable is denoted by $E(X)$. The expectation of the random variable $(X-E(X))^2$
    is the variance of $X$, which is written as $Var(X)$. The variance means the dispersion
    or "spread" of the distribution; small variance means that the distribution is
    centered near the population mean $(\mu)$, whereas a large variance indicates
    a wide spread. The square root of $Var(X)$ is called the standard deviation of
    $X$ denoted by the symbol $\sigma$; that is


    ```

    $\sigma=\sqrt{Var(X)}$

    ```


    The expectation and the variance are, in the discrete case,


    ```

    $$\begin{cases} E(X)=\sum_{x}xf(x) \ Var(X)=\sum_{x}(x-E(X))^2f(x) \end{cases}
    \quad (3.17)$

    ```


    or, in the continuous case,


    ```

    $$\begin{cases} E(X)=\int xf(x)dx \ Var(X)=\int (x-E(X))^2f(x)dx \end{cases} \quad
    (3.18)$

    ```


