    # 7.1.1 THE FOUR-INTERSECTION MODEL


    Based on point-set topology, a spatial object A can be divided into two parts:
    its interior and its boundary, denoted by $A^i$ and $\partial A$, respectively.
    The topological relationship between objects can be described by the four intersections
    of interiors and boundaries, denoted by


    ```

    $$\partial A \cap \partial B \quad \partial A \cap B^i$\n$A^i \cap \partial B
    \quad A^i \cap B^i$\$$

    ```


    By considering the invariance, property, empty and nonempty, of each intersection,
    16 possible relations exist between objects in two-dimensional space (Egenhofer
    and Franzosa, 1991).


    # 7.1.2 THE NINE-INTERSECTION MODEL


    If only the topological spatial relations between polygonal areas in the plane
    are considered, there are nine relations between two spatial regions. Based on
    point-set topology and the embedding of set A into $R^2$, the set A in $R^2$ can
    be divided into three parts: the interior ($A^i$), the boundary ($\partial A$),
    and the exterior ($A^e$). This extends the four-intersection model to a new intersection
    model by considering the intersection of interior ($A^i$), boundary ($\partial
    A$) and exterior ($A^e$) with interior ($B^i$), boundary ($\partial B$) and exterior
    ($B^e$). The intersection of these six sets, a total of nine intersection combinations,


    | $A^i \cap B^i$ | $\partial A \cap B^i$ | $A^e \cap B^i$ |

    | $A^i \cap \partial B$ | $\partial A \cap \partial B$ | $A^e \cap \partial B$
    |

    | $A^i \cap B^e$ | $\partial A \cap B^e$ | $A^e \cap B^e$ |


    This can be used to represent the topological relationships between spatial objects.

    By considering the invariance, property and nonempty of each component, there
    are 512 possible relations between spatial objects. From these 512 cases, there
    are only eight relations: "disjoint," "contains," "inside," "equal," "meet," "covers,"
    "covered by," and "overlap" that can be realized, if the objects are spatial regions
    in $R^2$ (Egenhofer 1993).


    # 7.1.3 ALGEBRAIC MODEL


    When dealing with indeterminate boundaries, Clementini and Di Felice (1996) defined
    a region with a broad boundary using two simple regions, denoted by $\Delta$.
    More precisely, the broad boundary is a simple connect subset of $R^2$ with a
    hole. Based on the empty and nonempty invariance, Clementini and Di Felice''s
    algebraic model provides a total of 44 relations between two spatial regions with
    a broad boundary.'
