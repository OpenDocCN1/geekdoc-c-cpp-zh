  md: '# Modeling Attribute Uncertainty


    # 5.1.4 RELATIONSHIP BETWEEN ATTRIBUTE AND POSITIONAL UNCERTAINTIES


    Although differences exist between attribute and positional uncertainties, both
    types of uncertainty are closely related. A spatial entity in GISci is integrated,
    represented by its components: spatial element, attribute element, temporal element,
    scale, and spatial relations. Therefore, uncertainties in these elements are integrated
    and applied to a spatial object. For example, it might be difficult to separate
    positional and attribute uncertainties for a particular geographic object with
    a fuzzy boundary.


    In an object-based model, an object (such as a building) is represented by its
    basic elements, such as points, lines, or polygons and associated attributes (e.g.,
    address and ownership of the building). Therefore, uncertainties of the basic
    elements and those associated attributes may be applied to the spatial objects
    simultaneously. This is also applicable to the object description in a field-based
    model.


    Boundary uncertainty of an area is typical example of integration, simultaneously
    affected by positional and attribute uncertainties of an object implying that
    its boundary is no longer a geometric line, but a transitional region of a certain
    width.


    For example, positional uncertainty existing in a transitional region may cause
    attribute uncertainty. Uncertainty in that transitional region may be caused by
    the positional error of the image. The central part of an area object is the most
    certain, and this degree of certainty gradually reduces from that area towards
    the object boundary. Hence, it is essential to define the object area by an area
    that includes the transitional region with a particular width, instead of a crisp
    line. The “S-band” model (Shi, 1994) is proposed for modeling the integrated effects
    of positional and attribute uncertainties in transitional regions. The model is
    designed around the same mathematical bases using probability theory in modeling
    both positional and attribute uncertainties. This model is described in detail
    in Chapter 6.


    # 5.1.5 UNCERTAINTY IN CLASSIFICATION


    Modeling uncertainty or accuracy of classification from satellite images is one
    of the most typical examples of modeling attribute uncertainty of categorical
    data. Classification accuracy assessment for the classification satellite images
    is a complex procedure and has received considerable attention in the field of
