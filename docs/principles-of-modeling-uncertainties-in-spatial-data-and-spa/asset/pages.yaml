  md: '# 16 Metadata on Spatial Data Quality


    Metadata are data that give further information about specific data sets. Over
    time, various metadata standards have been developed and the widely accepted standards
    are reviewed and analyzed in this chapter. Particular focus is on metadata associated
    with spatial data quality information. Spatial data quality metadata fall into
    the following classes: completeness, logical consistency, positional accuracy,
    thematic accuracy, and temporal accuracy. Also introduced in this chapter is a
    newly proposed object-oriented organization method, which has been designed to
    provide uncertainty metadata at an object level. The development of an improved
    error metadata management system for solving problem data quality metadata management
    in the real world is described.


    # 16.1 INTRODUCTION


    Spatial metadata, as its name implies, provides further information relating to
    the original spatial data. The purpose of metadata is to enable the documentation
    of described spatial data. Metadata, in general, content, quality, source organizations,
    data format, data currency, spatial references, and other related characteristics
    on the spatial data.


    Metadata has an important role in GISci, in that information can be provided to
    help assist users in effectively archiving and searching related data. Metadata
    can also be used to provide information for spatial data sharing. Based on metadata
    information, users can decide whether a data set is suitable for a specific application.
    The Federal Geographic Data Committee (FGDC) has summarized three major uses of
    metadata (FGDC, 2000): They are


    +   * To maintain an organization''s investment in data. This can avoid any misuse
    of data in normal circumstances, during personnel change or owing the passing
    of time.

    * To provide information about data catalogues and clearhouses. This can aid an
    organization find the relevant data partners to share a data collection and maintenance,
    and to purchase data.

    * To provide information for data transfer. This can enable an organization to
    receive and interpret the data, and to incorporate data already held.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    A number of organizations have developed standards for storing and maintaining
    metadata. These organizations are mainly divided into two groups: national government
    organizations and independent standard bodies. The former group is responsible
    for approving standards for their constituents, such as the FGDC in the United
    States. The independent standard bodies are usually representatives from government
    agencies, professional organizations, and private companies. Their duty is to
    build and promote standards. The European Committee for Standardization (CEN)
    and the International Organization for Standardization (ISO) are examples of such
    organizations.


    # 16.1.1 The Federal Geographic Committee Metadata Standard


    The FGDC developed and approved the Content Standard for Digital Geospatial Metadata
    CSDGM version 1 in 1992 and 1994. This is the first metadata in the geospatial
    community. According to the Executive Order 12906, Coordinating Geographic Data
    Acquisition and Access: The National Spatial Data Infrastructure, all federal
    agencies in the United States have used this standard to document metadata since
    1995. The second version of the CSDGM was endorsed in 1998 (FGDC, 2000). From
    some amendments to the wording of the first version, the second version includes
    free-text descriptions and guidelines for the development of profiles and user-defined
    metadata elements and elements.


    The FGDC standard concentrates on metadata content; however, it does not cover
    practical implementation to promote standards. Metadata standards are defined
    by seven main sections and three supporting sections. The main sections aim at
    describing the major aspects about geospatial data. These are:


    +   * Identification—basic information about the data set, including descriptions
    of the data set, data status, the state of and maintenance information on the
    data set, the geographic attribute domain of the data set, access constraints,
    etc.

    * Data quality—general quality assessment information regarding the data set

    * Spatial data organization—information about the mechanism used to represent
    spatial information in the data set

    * Spatial reference—description of the reference frame for coordinates in the
    data set

    * Entity and attribute—information content of the data set, including the entity
    types and its attributes, and the domains from which attribute values are assigned

    * Distribution—information about the distributor of and options for obtaining
    the data set

    * Metadata reference—information on the status of the metadata information, and
    the responsible party


    The FGDC supporting sections define the citation, data time period, and contact
    information within the main sections.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# Metadata on Spatial Data Quality 353


    Each section contains three parts: (1) section definition, which also covers the
    name and (2) production rules, which provides descriptions of the section in terms
    of lower-level component elements. The list of component elements includes the
    name and definition of each component element in the section. (3) A list of compound
    elements.


    Sects, compound elements, and data elements in this standard, are either "mandatory,"
    "mandatory if applicable," or "optional." "Mandatory elements must be provided
    in a data set, whereas "mandatory if applicable" elements must be provided if
    the data set contains information defined by the element. The provision of "optional"
    metadata elements are left to the discretion of the data provider.


    # 16.1.2 The ANZLIC STANDARD


    The Australia/New Zealand Land Information Council (ANZLIC) has built a metadata-standard,
    mainly for describing characteristics of data sets maintained in the public and
    private sectors in Australia and New Zealand. The ANZLIC''s standard was developed
    in 1996, based originally on the FGDC''s standard and kept consistent with the
    Australian/New Zealand Standard on Data Transfer AS/NZS 4270. The second version
    of the ANZLIC was issued in 2001 (ANZLIC, 2001). This version provides a minimum
    set of elements in metadata and is simpler to the FGDC standard. Data managers
    may require gaining supplementary information about the data for specific purposes.


    The ANZLIC standard version 2 contains 41 core elements. These core elements are
    grouped into 10 categories:


    +   * Data set—information about the content of the data

    * Custodian—information on the agency responsible for data collection and maintenance

    * Description—information concerning the geographic area it covers

    * Data currency—the time frame of the data described, including the earliest and
    latest dates at which the phenomena in the data set actually occurred

    * Data set status—information about the status of the process of creation of the
    data set, and maintenance and update frequency

    * Access—information about data format and constraints on the use of the data
    set

    * Data quality—information on data quality including lineage, positional accuracy,
    attribute accuracy, logical consistency and completeness

    * Contact information—description of address details for the contact person who
    is responsible for delivery of the data set to other users

    * Metadata date—information about the currency of the directory entry

    * Additional metadata—additional information that supports documentation of the
    data set


    The following properties are given for each core element: category, name, definition,
    obligation (mandatory, optional, conditional), maximum occurrence, allowable content,
    format rules, field type, and field length.'
