    # 8.5.2 ACCURACY ESTIMATION FOR THE DEM GENERATED FROM BICUBIC INTERPOLATION


    An analysis of the elevation error propagation from the source data through the
    bicubic interpolation is now presented. Firstly, a mathematical expression of
    the elevation error in a regular grid DEM, generated by the bicubic interpolation
    is derived. This expression is simplified from a mathematical theory. It is then
    applied to measure surface error and elevation on the DEM surface. As the regular
    grid is composed of squares, the accuracy estimation of the whole DEM surface
    is equivalent to an accuracy estimation of a single square on the surface. Therefore
    the computation and proofs are performed on a single square, as illustrated by
    Figure 8.7.


    # 8.5.2.1 The Average Elevation Error


    The regular grid shown in Figure 8.7 consists of four nodes A, B, C, and D. The
    surface of these four nodes is part of the DEM surface. Suppose the elevations
    of the nodes are $h_a, h_b, h_c$, and $h_d$, and their elevation errors are independent
    and identical, and written by $\sigma_{node}^2$.\nFor any point $P$ on the surface
    the elevation of this point is expressed as


    ```

    $h_p = T_1h_a+T_2h_d+T_3h_b+T_4h_c ,$ (8.54)

    ```


    where $T_1, T_2, T_3$, and $T_4$ are derived from Equation 8.53. This represents
    the value of the point $P$ generated by the bicubic interpolation, base the four
    nodes A, B, C, and D.\nWhen the node errors are independent, the variance of the
    elevation of point $P$ is given by


    ```

    $\sigma_p^2 = T_1^2\sigma_{node}^2+T_2^2\sigma_{node}^2+T_3^2\sigma_{node}^2+T_4^2\sigma_{node}^2
    ,$ (8.55)

    ```


    This equation can also be applied to estimate the average elevation error in the
    surface $ABCD$. The average elevation error is computed by integrating Equation
    8.55 over the projection of $ABCD$ on the plane $xOy$. That is,'
