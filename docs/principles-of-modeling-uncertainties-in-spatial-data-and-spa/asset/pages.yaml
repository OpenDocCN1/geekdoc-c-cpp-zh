    # 18.1.2 INVESTIGATION OF UNCERTAINTIES IN THE COGNITION OF GEOGRAPHIC OBJECTS


    As indicated above, cognitive uncertainties of geographic objects have not, as
    yet, well addressed in modeling uncertainty in spatial data and analysis. Geographic
    uncertainty cognition can be achieved either by human reasoning or by computer
    vision or the classification of remotely sensed satellite images. Examples of
    the latter are object cognition by computer vision uncertainty may result from
    (a) limited knowledge of the natural world or insufficient domain knowledge necessary
    for the cognition, and (b) limited information about the object to be recognized
    in spatial, temporal, and attribute domains.


    However, the major cause of uncertainty or even mistakes in cognition is limited
    human knowledge of the natural world. A particular toy is available for children
    to enable understanding of shapes. The child is asked to select a specific shape
    and match it to the space of the same shape. When Daniel (at ½ years old) first
    played with such a toy, he could not tell the difference between any of the shapes.
    After two months of play, he was able to match the shapes correctly and therefore
    able to recognize such a triangle and hexagon. His ability regarding shape cognition
    had improved, shape recognition reduced and therefore shape knowledge gained.
    This simple example illustrates the uncertainty of human cognition of the complexities
    of the real world.


    Cognition of the natural world is normally based on limited spatial, temporal,
    and attribute information and at any time, this limitation being responsible for
    cognition uncertainty. For example, when using multispectral satellite images
    for land cover classification (a form of automatic cognition of land cover classes
    by computer) from a Landsat image with a spatial resolution of 15m to 15m, a specific
    pixel (an area of 15m by 15m), encompassing a mixture of 30% of area, 60% area
    of water would finally be classified as a pixel of a tree. Cognition uncertainty
    is from the classification. A better classification would give the percentiles
    of the classification components, rather than that of the majority class. In addition,
    the spatial distribution of the component classes within the pixel should also
    be indicated. Another example of classification uncertainty is that arising from
    different spectrum reflections appearing from any one type of land cover at different
    times of the day or in different locations. This phenomenon leads to land cover
    changes, from such dry vegetation to flooded vegetation and back within, say,
    five days, given that the interval of the obtained satellite images, for this
    change detection, cannot be well detected by the limited temporal resolution of
    the obtained satellite images.


    Another source spatial cognition uncertainty is the cognition difference of an
    object, evident by different groups of people. This form of uncertainty can be
    potentially resolved if formal and consistent definitions have been given to spatial'
