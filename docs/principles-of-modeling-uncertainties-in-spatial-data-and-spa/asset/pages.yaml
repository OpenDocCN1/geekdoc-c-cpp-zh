  md: '# 44 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 3.3.3.3.2 Point Estimation with the Method of Maximum Likelihood


    Suppose that a population distribution is continuous and its p.d.f. is expressed
    as $p(x, \theta_1, \theta_2, ..., \theta_k)$ where $\theta_1, \theta_2, ..., \theta_k$
    are unknown parameters. Parameter estimation can be estimated as follows.


    Let $x_1, x_2, ..., x_n$ be a random sample from a distribution having p.d.f.
    $p(x, \theta_1, \theta_2, ..., \theta_k)$. When the function


    ```

    $L = \prod_{i=1}^n p(x, \theta_1, \theta_2, ..., \theta_k) \quad (3.43)$

    ```


    has a maximum at $\theta_1 = \hat{\theta}_1, \theta_2 = \hat{\theta}_2, ..., \theta_k
    = \hat{\theta}_k$, the value $\hat{\theta}_i$ is an estimator of $\theta$ for
    $i=1, 2, ..., k$. The function $L$ and its logarithm function (ln L) are maximized
    at the same value of $\theta_1, \theta_2, ..., \theta_k$. Thus, the unknown parameters
    are estimated by setting the first derivative of $L$ with respect to the parameters
    to zero and solving the resulting equations for $\theta_1, \theta_2, ..., \theta_k$.nThe
    logarithm of $L$ is


    ```

    $ln L(\theta_1, \theta_2, ..., \theta_k; x_1, x_2, ..., x_n) = ln \prod_{i=1}^n
    L(x_i, \theta_1, \theta_2, ..., \theta_k) \quad (3.44)$

    ```


    ```

    $$\frac{\partial \ln L}{\partial \theta_1} = 0$\n$\frac{\partial \ln L}{\partial
    \theta_2} = 0$\n$\dots$\n$\frac{\partial \ln L}{\partial \theta_k} = 0$ \quad
    (3.45)$

    ```


    Then, we set


    By solving this system of equations, the maximum likelihood estimators $\hat{\theta}_1,
    \hat{\theta}_2, ..., \hat{\theta}_k$ of $\theta_1, \theta_2, ..., \theta_k$ can
    be obtained.


    If the population distribution is discrete, the p.d.f. of the random variable
    will be expressed as $Pr(X=x)$. The parameter to this p.d.f. can also be estimated
    based on the maximum likelihood.'
