    # 11.4 SUMMARY


    This chapter has addressed line simplification error modeling, within the framework
    of modeling uncertainties in spatial object simplification. Uncertainty modeling
    for object simplification can be studied through two approaches: (a) analytical
    solutions and (b) simulation solutions. This chapter has presented an analytical
    solution. However, it should be realized that the simulation solution is, in fact,
    another effective approach to solve the error modeling in line simplifications,
    especially for complex geometries.


