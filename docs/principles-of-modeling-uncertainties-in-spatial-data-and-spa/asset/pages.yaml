  md: '# Modeling Attribute Uncertainty


    through automatic classification or human interpretation. For example, the automatic
    remote sensing classification of the satellite is a commonly used automatic attribute
    cognition method. In this method, the uncertainty in the final attribute cogniz
    may be related to the quality of the satellite image (eg, regarding its spatial
    resolution spectral resolution, and temporal resolution), the methods applied
    for classification (eg., maximum likelihood classification or minimum distance
    classification), and local knowledge about to be recognized.


    d. Depending on the mathematical characteristics of spatial analysis or modeling,
    various uncertainties may accumulate and propagate in the attribute data. For
    example, the remote sensing images may be further integrated with vector map data
    by an overlay spatial analysis. Uncertainty in the classified remote sensing image
    propagates. The quantity and nature of the propagated uncertainty depends upon
    the nature of the spatial analysis, such as Boolean or algebraic spatial analysis.
    Attribute uncertainty propagation models for logical operation and arithmetic
    operation can be established for fuzzy set theory and probability theory, respectively.


    In summary, attribute uncertainties are generated, propagated, and accumulated
    through uncertainty inherent in the natural world, cognition, modeling, measurement,
    and spatial analysis. These uncertainties may finally affect decision applications.
    Attribute uncertainty sources and accumulation are illustrated in Figure 5.1.


    Two commonly used models for spatial object modeling exist in GISci: object-based
    and field-based models. These models provide two different ways of contrasting
    the features of the real world. Both models induce uncertainties (attribute, positional,
    and other uncertainties) in representing spatial entities from the real world
    in a GISci. Mathematical function is the third category for spatial modeling in
    GISci (as described in Section 2.4 of Chapter 2).


    In an object-model, a group of elementary geometries as points, lines, and polygons
    are deployed to represent spatial entities in terms of position, attribute, and
    topological relationships. Pure mathematical points, lines, and polygons, however,
    do not exist in the real or natural world.


    In reality, the GIS representation of the spatial elements, points, lines, and
    polygons are an approximation of pure mathematical points, lines, and polygons.
    The difference between the pure mathematical representation of the elements (points,
    lines, and polygons) and the approximated representation of these elements in
    GIS is a fundamental source of uncertainty of the object-based model. This source
    may grant attribute, positional, and relational uncertainties of the spatial entities
    in GISci.


    Object-based models are suitable for presenting positional uncertainties of discrete
    objects. The limitation of the current GIS, designed according to the objectbased
    model, is that positional error indicators are treated as an additional attribute
    in the data model, rather than uncertainty-based elements (points, lines, and
    polygons with uncertainty) in the object-based model. The eventual solution to
    this issue is the development of an uncertainty-based object model.'
