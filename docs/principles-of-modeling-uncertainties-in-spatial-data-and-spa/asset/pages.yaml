  md: '# 10 Modeling Positional Uncertainty in Buffer Analysis


    An uncertainty model for buffer spatial analysis is presented and discussed in
    this chapter. Three uncertainty indices for describing positional uncertainty—an
    error of commission, an error of omission, and a normalized discrepant area—are
    presented. The first two indices are applicable if the "true" and measured locations
    of a buffer overlap; the latter is not subject to this restriction. A rigorous
    mathematical expression for each of the indices is derived, based upon multivariate
    integration. In contrast to existing research on uncertainty modeling for buffer
    spatial analysis, the proposed model relaxes the assumption of positional distribution
    for a spatial feature surrounded by its buffer. Hence, this model has the added
    advantage of being suitable for dealing with more generic application situations.


    # 10.1 INTRODUCTION


    The discussion on uncertainty propagation problems in spatial analyses, conducted
    in previous chapters continues in this chapter, but with the focus specifically
    on uncertainty modeling in relation to buffer analysis, and in particular, vector
    buffer analysis.


    Buffer analysis is a form of spatial analysis in GISci, in which a buffer of a
    predefined width is delineated around a specific spatial feature (such as a point,
    line, or a polygon). Any spatial features located inside this buffer are identified
    as being, in terms of specific degrees, close to that particular spatial feature.
    The extent of closeness is quantified using a predefined width. For example, if
    a forest fire breaks out, regions probably devastated by the fire can be predicted
    in a buffer analysis. Firemen can take action to stop the fire spreading, and
    neighboring residents can be evacuated at an early stage. A similar buffer analysis
    can be implemented in areas such as environment protection, urban planning, and
    resource allocation.


    A buffer analysis is conducted on either object-based or field-based spatial data.
    In field-based spatial data, a buffer contains a set of pixels within a specific
    distance threshold (the buffer width) from a set of pixels that represents a spatial
    feature. In object-based spatial data, a buffer around a spatial feature is a
    geometric object with a boundary, offset around the spatial feature by the buffer
    width. It is a circle for a point and a corridor for a line. Given a location
    of a spatial feature'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    and a buffer width value, the corresponding buffer can be drawn to identify or
    select nearby spatial features.


    A buffer around a source spatial feature can be static or dynamic, depending on
    a characteristic of the source spatial feature, relative to its neighbor. If the
    buffer characteristics remain constant, that buffer is static. However, if the
    characteristics vary from the source spatial feature, the buffer is dynamic. The
    boundary of a dynamic buffer is a line that connects all points of the characteristics
    of equal value. An example is provided by a factor located among nearby buildings.
    To detect pollution caused by a factor in such a case, as the air pollutant concentration
    in a nearby being higher than in a more remote one, this characteristic is inversely
    proportional to distance. A buffer around a pollutant source, determined from
    the concentration of the air pollutant, is dynamic.


    In fact, a buffer analysis contains positional uncertainty. Positional uncertainty
    for a vector buffer is caused by (a) positional uncertainty of the source spatial
    feature and (b) buffer uncertainty.


    Positional uncertainty of a spatial feature might arise from the moment of the
    first data capture step to the later spatial decision-making operations in GISci.
    Data can be captured through, for example, ground surveys, remote-sensing data
    collection, and map digitization, each of which may introduce positional uncertainty
    in spatial features. (Details concerning data capture errors are given in Section
    24.3.3.) Uncertainty for the source spatial feature therefore propagates that
    of the buffer. In addition, buffer uncertainty might arise from inputting the
    buffer width. However, uncertainty does not exist (given that there is no typing
    error) when the buffer width is a keyboard input, but uncertainty might exist
    if the buffer width is input by other methods, such as digitization.


    Various studies have been carried out on modeling propagation in a raster buffer
    analysis in GISci (Veregin, 1994, 1996; de Genst and Canters, 2000). Less attention
    has been paid to uncertainty propagation in a vector buffer analysis, probably
    because few standard positional uncertainty models for vector spatial features
    exist in this area. Zhang et al. (1998) derived an uncertainty propagation model
    for a vector buffer based on the epsilon band and E-band models, two error bands
    for assessing positional uncertainty in spatial features. This model is restricted
    to the assumption of error band models, which in positional uncertainty in all
    spatial features, is identically and independently distributed. Uncertainty in
    the buffer width is ignored. Details of this model are reviewed below in Section
    10.2.


    A geometrical indicator to assess positional uncertainty in a vector buffer in
    a more generic case is presented in Section 10.3. This uncertainty model considers
    the two uncertainty sources of the buffer analysis and relaxes the assumption
    of the uncertainty of the source spatial feature.


    # 10.2 EXISTING BUFFER ANALYSIS ERROR MODEL


    Zhang et al. (1998) derived an uncertainty propagation buffer model in a vector
    environment, based on the epsilon band (ε-band) and the E-band models. Each error
    band, an absolute uncertainty and a relative uncertainty for the buffer around
    a spatial feature, based on positional uncertainty at all the spatial feature
    vertices, were'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Modeling Positional Uncertainty in Buffer Analysis 241


    derived. The absolute uncertainty is defined as the buffer area around an error
    band of a spatial feature minus the buffer area around that feature. The relative
    uncertainty in the buffer is defined as the absolute uncertainty value defined
    by the buffer area around the spatial feature.


    This buffer spatial analysis model provides a solution to assess corresponding
    positional uncertainty. In the e-band and E-band models, however, the positional
    uncertainty for all source feature vertices is assumed to be equal, without autocorrelation
    and cross-correlation. It is possible to further develop the existing error band
    models in order to derive a generic model for analysis uncertainty propagation
    by considering the correlation between the spatial feature vertices.


    The confidence region model for a line (see Section 4.5) has been proposed to
    describe the line''s positional uncertainty under the assumption of independent
    uncertainty for all its vertices. This confidence region around the given line
    location is a region, inside which the true location of the feature is most probably
    located. A further developed stochastic error band model (see Section 4.7) by
    considering the case in which the positional uncertainty for the vertices is correlated.


    The confidence region model and stochastic error band model realize the assumption
    made in the e-band model; namely, positional uncertainty for each line vertex
    might be of different value.


    The error band approach for vector buffer analysis only deals with buffer uncertainty
    if it is the result of the source spatial feature propagated uncertainty. This
    is a special case, because buffer uncertainty might exist and also affect the
    buffer accuracy. An uncertainty model for buffer analysis is introduced in Section
    10.3. In this model, the source spatial feature uncertainty and the buffer width
    uncertainty are taken into account (Shi et al., 2003).


    # 10.3 PROBABILITY-BASED UNCERTAINTY MODEL FOR BUFFER ANALYSIS


    Positional uncertainty in a buffer is measured using three uncertainty measures:
    an error of commission, error of omission, and a normalized discrepant area between
    “true” and measured locations of the buffer. The measured location of a spatial
    feature may be far from its true location. This leads to a deviation between the
    measured and true locations. In addition, buffer width uncertainty might arise
    in the buffer analysis. Based on the assumptions of an uncertainty source spatial
    feature distribution and for the buffer width, the mean values of the error of
    commission, the error of omission, and the normalized discrepant area are expressed
    as multiple integrals. These mathematical expressions can be solved by a numerical
    integration technique or a simulation technique.


