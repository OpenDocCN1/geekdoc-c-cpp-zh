    of all intermediate points on the line segment are error circles. In this case,
    the G-band is a parallel band along the line segment.


    Homogeneity of a line segment means that the error for any point on the line segment
    is translation independent. Geometrically, this indicates, on one hand, the size
    of the error ellipse and the direction of its major axis are the same for any
    two points on the line segment (Figure 4.10b). However, directional independence
    means that the error ellipse for any point is rotationally independent.


    Geometrically, this means that all error ellipses become error circles (Figure
    4.10c). Both homogeneity and directional independence mean that any error ellipse
    centered at a point on the line segment is simultaneously translation and rotationally
    independent. Therefore, all error ellipses on the line segment become error circles
    with the same radius (Figure 4.10d).


