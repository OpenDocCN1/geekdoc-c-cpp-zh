- img_proc: true
  md: '# #9 Modeling Positional Uncertainties in Overlay Analysis


    Uncertainty modeling for static spatial data and models has been introduced in
    Section II and Section III, respectively. We now address methods for modeling
    uncertainties in dynamic spatial analyses in Section IV, Chapter 9 to Chapter
    11. These methods cover uncertainty modeling for buffer, overlay, and line simplification
    spatial analyses. This particular chapter, Chapter 9, focuses on positional uncertainty
    modeling for overlay analysis. Two approaches are presented: the analytical method
    and the simulation method.


    # ## 9.1 INTRODUCTION


    A spatial analysis in GISci provides an automatic or semiautomatic process for
    solving a problem by executing a spatial data computational process. Spatial data,
    however, are always subject to different uncertainties, and the uncertainties
    are likely to propagate through the spatial analysis. A consequence of this situation
    is that spatial analysis contain inaccuracies, and may even be incorrect in terms
    of the users'' expectations. This being the case, the user''s objective must be
    clearly identified in terms of the degree of concern.


    The focus of this chapter is on positional uncertainty in a vector overlay analysis.
    Vector overlay analysis is a fundamental spatial analysis in GISci. It combines
    two or more spatial data collections, for example, a simultaneous observation
    of spatial data for analyzing the geographical phenomenon on the Earth''s surface.
    The vector overlay analysis is classified, based on the categories of the spatial
    feature concerned, point overlay, line overlay, or polygon overlay. Uncertainty
    modeling for polygon overlay is described in this chapter.


    A point overlay refers to a combination of two or more map layers of point features.
    The result is a point layer that contains the attributes and full extent of both
    map layers. The computational processes for the point overlay include (a) determination
    of whether a point on one map layer is identical to a point in another map layer;
    (b) merging duplicate points on the source map layers and adding the merged point
    to the resultant map layer; and (c) adding unique points from the source map layers
    to the resultant map layer.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    A line overlay is a combination of two or more line layers to obtain the resultant
    line layer. Its computational processes are similar to those of the point overlay.
    Two additional processes include (a) determination of whether a line in one map
    intersects with a line in another, and (b) adding the intersectional line to the
    resultant layer if this line does exist.


    A combination of two or more polygon layers to form a new polygon layer is called
    a polygon overlay. This operation invokes the vital parts of both the computation
    processes for the point overlay and the line overlay; in addition, it is necessary
    to (a) decide whether two polygons in different maps intersect, and (b) determine
    any intersectional or uncrossed parts of the polygons.


    Positional uncertainty in a vector overlay analysis addresses the accuracy of
    new spatial features generated in the analysis is correct, and how, in newly generated
    features, to quantify errors found in overlay analysis.


    Overlaying polygon layers may generate new polygons. These generated polygons
    are the intersection of two polygons or the difference between polygons, from
    different layers. For a quantitative description, existing uncertainty models
    for a polygon''s feature (such as area and perimeter) are derived under different
    assumptions. Uncertainty indicators are defined for the perimeter and area of
    the generated polygon, and for intersection points based on the error propagation
    law and simulation technique given in Section 9.4.1, and Section 9.4.2, respectively.


    # 9.2 REVIEW OF THE UNCERTAINT MODELS


    Positional uncertainty of a generated polygon may be studied using its characteristics,
    including major measurements such as perimeter and area. The uncertainty of these
    measurements is quantified based on assumptions regarding source polygon vertices.


    Prisley et al. (1989) made three assumptions to derive the mean and variance of
    a generated polygon by (a) uncertainty in the vertices of the source polygons
    has equal value in both the x- and y-directions, (b) uncertainty in the x- and
    y-directions at a given vertex of each source polygon is independent, and (c)
    uncertainty in the x-direction (or y-direction) at two neighbor vertices are interrelated.


    Caspary and Sheduring (1992) proposed different uncertainty measures for the generated
    polygon, based on the assumption that the uncertainty in each source polygon is
    random and independent with a known variance. Kraus and Kager (1994) developed
    uncertainty models to describe the area accuracy of a generated polygon by considering
    that the vertices of each source polygon in the x- and y-directions are correlated,
    but that the uncertainty in the x-direction (or the y-direction) at two neighbor
    vertices is uncorrelated.


    The above existing uncertainty models for polygon measures are derived under different
    assumptions. Uncertainty indicators for the perimeter and area of a generated
    polygon are therefore derived for the intersection point of source polygons. Below
    in a later section of this chapter, the uncertainty modeling is based'
  merge: -1
