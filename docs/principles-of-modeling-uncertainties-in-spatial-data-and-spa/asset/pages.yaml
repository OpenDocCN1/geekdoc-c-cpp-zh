    of line segment $Q_{21}Q_{22}$ can be defined by the joint distribution function
    of the stochastic vectors of points $Q_{21}$, $Q_{22}$, and $Q_l$ for all r.


    Let $Z_1 = \{X_1, Y_1\}^T=[X_{Q21}, Y_{Q21}]^T$ and $Z_2 = \{X_2, Y_2\}^T=[X_{Q22},
