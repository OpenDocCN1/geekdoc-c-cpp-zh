    \ = \nabla\\lambda = 0 ,$\nnH_1 : E(\nabla\\lambda) = \nabla\\lambda \\neq 0$.\n\
    ```\n\nUsing the $t$ test, the following statistic be constituted:\n\n```\n$t\
    \ = \\frac{\nabla\\lambda}{\\hat{\\sigma}_0\\sqrt{Q_\\lambda}} \\sim t(r),\n```\n\
    \nwhere $r$ is the number of the redundancies, $Q_\\lambda$ is the covariance\
    \ of $\nabla\\hat{\\lambda}$, and\n\n```\n$\\sigma_0^2 = \\frac{1}{r} , \\quad\
    \ \\Omega = V^T Q^{-1}V + V^T Q^{-1}V_s$.\n```\n\nAccording a given confidence\
    \ level $\\alpha$, $t_{\\alpha/2}$ is obtained. If $|t| > t_{\\alpha/2}$, $H_1$\
    \ is accepted and $H_0$ is rejected. That is to say, $V\\lambda$ is significant.\
    \ When $r$ is large, $F$ test can be applied to replace $t$ test.\n\nThe linear\
    \ hypothesis test is used to constitute the statistic\n\n```\n$F = \\frac{R/c}{\\\
    Omega/r} \\sim F(c,r),\n```"
