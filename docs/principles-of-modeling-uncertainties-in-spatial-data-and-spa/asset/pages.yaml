    \ relation. An ordered pair, $K = (U, R)$, is called an approximation space. The\
    \ equivalence relation partitions the universe into disjoint subsets, each of\
    \ which is denoted by $U/R$. An equivalence class induced by $R$ and the empty\
    \ set $\\varnothing$ is called an $R$-elementary set in the approximation space.\
    \ Any finite union of $R$-elementary sets in $K = (U, R)$ is said to be $R$-definable.\n\
    \nFor a set $X \\subseteq U$ and an equivalence relation $R, X$ can be characterized\
