    # 3.5.2.2 Operations of Fuzzy Sets


    Let $A$ and $B$ be two fuzzy sets on a universe $U$ with membership functions
    $\mu_A(u)$ and $\mu_B(u)$, respectively, for all $u \in U$. Fundamental operations
    on fuzzy sets are defined as follows:


    +   1. Inclusion: $A \supseteq B$ if (iff) $\mu_A(u) \geq \mu_B(u)$.\n2. Equivalence:
    $A = B$ iff $A \supseteq B$ and $B \supseteq A$.

    3. Union: $C = A \cup B$ if $\mu_C(u) = \max{\mu_A(u), \mu_B(u)}\$.

    4. Intersection: $D = A \cap B$ if $\mu_D(u) = \min{\mu_A(u), \mu_B(u)}\$.

    5. Complement: $E = A^C$ if $\mu_E(u) = 1 - \mu_A(u)$.


    In accordance with the definition of a fuzzy set in Equation 3.92, the union,
    the intersection, and the complement operators are expressed as


    ```

    $Union: A \cup B = \int_{u \in U} (\max{\mu_A(u), \mu_B(u)}\}/u)$.

    ```


    ```

    $Intersection: A \cap B = \int_{u \in U} (\min{\mu_A(u), \mu_B(u)}\}/u)$.

    ```


    ```

    $Complement: A^C = \int_{u \in U} ((1-\mu_A(u))/u)$.

    ```


    If there are $n$ fuzzy sets $(A_1, A_2, \dots, A_n)$ with membership functions
