    # 8.2.1 COMMON INTERPOLATION METHODS


    Polynomial interpolation has been widely applied in generating a DEM. This interpolation
    method derives a $z=f(x,y)$ from $n$ known points $P(x,y,z)$ for $i=1,2,...,n$,
    in a three-dimensional space. Such function delineates a surface containing all
    known points $P(x,y,z)$ and provides a value of elevation $z$ at any location
    $P(x,y)$ on the surface. For example, a bivariate or piecewise interpolation model
    (Kidner, 2003) is expressed


    ```

    $z = \sum_{k=0}^{m}\sum_{l=0}^{n}\alpha_{kl}x^ky^l. \quad (8.1)$

    ```


    It is an $(m+1)(n+1)$ term polynomial in which $\alpha_{kl}$ are the coefficients
    of the polynomial. The $z$ value at point $P$ is interpolated, after the coefficients
    are resolved, by putting the $x$ and $y$ values into Equation 8.1.

    The coefficients of the polynomial can be estimated based on the three-dimensional
    coordinates of the known points. For $i=1,2,...,n$, each known point $P(x_i,y_i,z_i)$
    substituted into Equation 5.1 and yields an equation containing $(m+1)(n+1)$ unknown
    coefficients $\alpha_{kl}$


    ```

    $z_i = \sum_{k=0}^{m}\sum_{l=0}^{n}\alpha_{kl}x_i^ky_i^l. \quad (8.2)$

    ```


    A system of equations can be formed with a number of points with known $x$ and
    $y$ coordinates and $z$ value. When the number of equations is larger than the
    number of unknown coefficients, the least square adjustment can be applied to
    solve the coefficients.


    Common polynomial interpolation methods include the level plane, the linear plane,
    bilinear interpolation, quadratic interpolation, bicubic interpolation, piecewise
    cubic polynomial interpolation, and biquatic interpolation. The level plane has
    this


    ```

    $z = a_{00}. \quad (8.3)$

    ```


    This interpolation is based on the understanding that any continuous function
    can be approximated by a step function. This is the simplest interpolation method,
    and estimates point elevation either by the point elevation that is the closest
    DEM vertex to point, or by using the average elevation of the four surrounding
    DEM vertices of that point. The level plane generates a discontinuous representation
    of a terrain (a DEM surface) by level surfaces of different elevations. The level
    plane in a two-dimensional space, for example, is see Figure 8.1). This stepwise
    line is an approximate representation of the original line (smooth curve in the
    figure). The intersection points of the stepwise line and the original'
