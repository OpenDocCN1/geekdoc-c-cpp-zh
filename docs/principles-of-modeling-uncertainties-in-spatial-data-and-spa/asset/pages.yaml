    (WMS), Web Feature Service (WFS), and Web Coverage Service (WCS). These three
    standards are introduced briefly below.


    **Web Map Service:** The aim is to generate maps based on the visualization of
    geographical data. Three operations are defined in WMS. The first operation, *GetCapabilities*,
    returns the metadata described in XML at the service level. The second operation,
    *GetMap*, returns a map image with respect to the requested parameters. Spatial
    parameters and parameter values are explicitly defined. The returning map images
    can be in the format of GIF, JPEG, PNG, or SVG. The third operation, *GetFeatureInfo*,
    returns specific map information. This latter operation is optional.


    **Web Feature Service:** The aim is to return GML codes at the feature level,
    and it also offers functional operations, such as adding, modifying, or removing
    features. Therefore, it is concerned with a relatively deeper level of service
    as compared to WMS. The standardized WFS define the following five operations.
    The first operation is the *GetCapabilities* operation, which returns the XML
    documents that describe the capability of WFS. The second operation, *DescribeFeatureType*,
    returns the WFS-described feature schema. The third operation, *GetFeature*, returns
    the acquired feature GML documents. Clients can specify which attributes of the
    obtained features are needed and can also use spatial or non-spatial queries with
    the specific conditions. The fourth operation, *operation transaction*, provides
    route request services. One routine work is for creation, modification, and geographic
    feature removal. The fifth operation, *LockFeature*, can handle locking requests
    for single feature or for the multi-features events. It can thus guarantee that
    the system can support sequential events.


    **Web Coverage Service (WCS):** the aim is to provide a spatial-oriented retrieval
    of geospatial data as “coverages,” and provides access to potentially detailed
    and rich sets of geospatial information. WCS is composed of three operations,
    GetCapabilities, GetCoverage, and *DescribeCoverageType*. GetCapabilities returns
    the XML descriptions of service and the data. *GetCoverage* is executed after
    *GetCapabilities*, confirming which queries can be executed and which data can
