    # 3.5.3 Relationships Between The Fuzzy Set and The Classical Set


    Fuzzy sets cannot be represented graphically on a plane, and thus are different
    from classical sets. Instead, they are visualized by plotting their membership
    functions. In practical applications, a spatial decision is made based sometimes
    on classical sets and sometimes on fuzzy sets. What is a relationship between
    these two types of set?


    As mentioned above, a classical set is a special case of a fuzzy set. For a classical
    set $A$ in a universe $U$ and $u \in U$, element $u$ is said to be an element
    in $A$ if the characteristic function is an identical


    ```

    $C_A(u) = 1. \quad (3.97)$

    ```


    This definition is not applicable to fuzzy sets: the boundary of a fuzzy set is
    vague. The degree of membership in fuzzy sets is defined as follows: Given a variable
    $\lambda \in [0,1]$, when $A is a fuzzy set with membership function $\mu_A(u)$
    whose value is larger than $\lambda$ at $u$ (i.e., $\mu_A(u) \geq \lambda$), element
    $u$ is said to be an element in $A$. This means that the constant $\lambda$ is
    used to determine the degree of membership in fuzzy set.


    # 3.5.1 Definition of Level Set


    For any fuzzy set $A$ in a universe $U$ and for all $\lambda \in [0,1]$, a subset
    of $A$ defined by


    ```

    $A_{[\lambda]} = \{u \in U |\ \mu_A(u) \geq \lambda\} \quad (3.98)$

    ```


    is called the $\lambda$-level set where $\lambda$ is the confidence level. This
    subset (the $\lambda$-level set of a fuzzy set) is the crisp that contains all
    elements of a whose membership functions have values greater than equal to the
    specified value of $\lambda$. A subset of $A$ is said to be an open $\lambda$-level
    set if it is given as


    ```

    $A_{(\lambda)} = \{u \in U |\ \mu_A(u) > \lambda\} \quad (3.99)$

    ```


    $A_{[\lambda]}$ and $A_{(\lambda)}$ are two classical sets in $U$.'
