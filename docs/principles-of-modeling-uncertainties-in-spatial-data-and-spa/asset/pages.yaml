    # 18.1.3 MODELING Integrated Measurement ERRORS


    In position error modeling of spatial objects in GIS, current main research involves
    random error modeling. In fact, three types of measurement errors exist: random
    error, systematic error, and gross error. Several solutions for determining gross
    measurement errors, as those in photogrammetry, have been developed. What further
    exploration are the methods for modeling integrated random, systematic, and gross
    errors.


    Another type of uncertainty to be further studied is uncertainty in the temporal
    domain. Research in this area, so far, is limited. Temporal measurement, in many
    cases, is associated with spatial measurement. Therefore, a solution could be
    to integrated temporal and positional uncertainty using geographic data. To a
    certain extent, methods developed for measuring positional error for spatial data
    can be applied (such as the nature of random error) of temporal error is similar
    to that of positional error.


    # 18.1.4 UNCERTAINTY MODELING FOR COMPLEX SPATIAL ANALYSES


    The methods developed for modeling positional uncertainties in spatial analysis,
    as much for overlay, buffer, and line simplification in GIS, are domain independent.
    Modeling attribute, topological consistency, and ascertaining the completeness
    aspects of uncertainty is an extension of this research to be tackled in the future.
    Another important issue is domain-dependent spatial analysis, as uncertainty-modeling
    for land use detection, spatial analysis based on multisource data with uncertainties.
    A model integrating attribute and positional uncertainties needs to be developed
    and used for this area.


    # 18.1.5 DATA QUALITY CONTROL FOR GIS WITH COMPLEX UNCERTAINTIES


    Research on spatial data quality control has recently begun. So far, the aspect
    of errors has been addressed, and it is likely that further studies will focus
    on spatial'
  merge: -1
  pgno: 414
