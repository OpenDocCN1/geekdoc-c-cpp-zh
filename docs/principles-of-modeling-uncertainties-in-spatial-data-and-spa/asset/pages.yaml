    # 12.2.3.3 Variance Components Estimation for the Conditional Adjustment with
    Scale Parameter


    Since the two types of observed values (registered areas and digitized vertex
    coordinates) are involved, and some scale parameters are unknown, the variance
    estimation method for conditional adjustment with parameter is adopted to estimate
    the weights of these two types of observations.


    If the covariance of the two given types of observations, $Q$ and $Q_*$, are not
    given properly during the first adjustment process, this may be denoted as


    ```

    $D(L) = \sigma_{01}^2 Q\nnD(L_*) = \sigma_{02}^2 Q_*\n  (12.39)

    ```


    By using $V^T Q^{-1}V$ and $V_*^T Q_*^{-1}V_*$ resulting from the first adjustment
    posterior and successive adjustments thereafter, the unit variance factors, $\hat{\sigma}_{01}^2$
    and $\hat{\sigma}_{02}^2$, of the two types of observations, according to the
    following formula, can be reestimated:


    ```

    $$\begin{pmatrix} tr(Q_{rr}N_1Q_{rr}N_1) & tr(Q_{rr}N_1Q_{r*}N_2) \ tr(Q_{r*}N_2Q_{rr}N_1)
    & tr(Q_{r*}N_2Q_{r*}N_2) \end{pmatrix} \hat{\sigma}_{01}^2 = \begin{pmatrix} V^T
    Q^{-1}V \ V_*^T Q_*^{-1}V_* \end{pmatrix}$, (12.40)$

    ```


    where $N = N_1 + N_2, N_1 = Q^{-1}A^T, N_2 = A_*Q_*^{-1}A_*$.


    Weights are reestimated using the obtained more accurate $\hat{\sigma}_{01}^2$
    and $\hat{\sigma}_{02}^2$. Adjustments are recalculated using the newly obtained
    weights. This process repeats iteratively until $\hat{\sigma}_{01}^2 = \hat{\sigma}_{02}^2$
    or the ratio of the unit weight variance equals 1 through tests such as the $F$
    test.


    # 12.3 QUALITY CONTROL METHODS FOR CADAST DATA


    In a cadastral map, a parcel belongs to a particular street block. A street is
    usually composed of many parcels without adjacent parcels. A block is a relatively
    independent unit of a region. In principle, the block area is equal to the sum
    of the areas of its composing parcels. Blocks are usually separated by streets
    or other geographic features. Thus, it is pertinent to regard a single block as
    a basic land parcel adjustment process unit.'
