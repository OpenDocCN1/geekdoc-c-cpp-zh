    The normalized (or mean) difference measures the general uncertainty of the simplified
    line. It is a method used to locate a central distribution point in the measurement
    error for the central tendency. The normalized value can anticipate additional
    statistical analysis, however as variance of the measurements. The advantage of
    this index is that all available information is used. When a distribution has
    a few extreme cases, however the mean difference may become misleading.


    The median difference measures average error, even for a highly skewed distribution.
    The advantage of this index is that it is based on the middle value for points
    arranged in ascending order and is not affected by extreme cases in measurements.


    In fact, both the normalized and the median uncertainty index the central tendency
    of the discrepancy. However, their values may be different when the distribution
    of the discrepancy is skewed. For example, if the general value is required, the
    mean is used; if minimization of the average value of a positively skewed distribution
    of the discrepancy is required, the median is used.


    The maximum difference measures the maximum error of all measurements. It is a
    measure of the extreme error measurement case and does not affect other differences
    in the error distribution.


    A line simplification model error is measured by the maximum distortion of a simplified
    line from its initial line. A distortion is defined as the shortest distances
