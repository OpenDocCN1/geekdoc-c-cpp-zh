    # 2.5.2.2 Uncertainty Due to Heterogeneous Data Fusion


    When heterogeneous data are fused and a new data set formed, uncertainty in the
    fused data has to be addressed. To construct a comprehensive database, the GIS
    user may find it necessary to integrate various data sets from multiple sources
    and with different accuracy and formats. An ordinary spatial database can perform
    a regional analysis but may not be as successful as in a global analysis. If an
    application requires a global analysis, the fusion of various regional data has
    to be conducted, and inconsistency between the data sets may appear. Therefore,
    the heterogeneous fusion adds further example to the previously mentioned sources
    of uncertainties. Interoperability is an important issue for spatial fusion, as
    data conversion from one GIS format to another. can be well integrated. However,
    data format conversion may also introduce errors into the converted GIS data.
    The fundamental reason for this uncertainty is that the basic data model for one
    GIS may be different from that of another GIS.


    # 2.6 SUMMARY


    The sources of uncertainty in spatial data and spatial analyses have been summarized
    in this chapter. These sources are divided into inherent uncertainty in the natural
    world, uncertainty generated during human cognition, uncertainty introduced in
    data capture, and uncertainty arising from spatial analysis and data processing.
    Errors arising from spatial data capture are very critical and have been analyzed
    in detail, where the data capture methods cover map digitization, photogrammetry,
    laser scanning, total station, GPS, and remote sensing.


