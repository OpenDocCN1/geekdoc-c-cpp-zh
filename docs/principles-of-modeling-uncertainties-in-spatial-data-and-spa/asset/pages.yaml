  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    certain, and the uncertainty within the object gradually increases from the center
    toward the boundary.


    Integrated modeling of positional and attribute uncertainty is a key issue in
    multiple-sources-based spatial analyses, given that some data may contain positional
    uncertainty, and when these are combined for a spatial analysis, the uncertainties
    in the corresponding data sets are combined and even expanded. Hence, it is essential
    to develop adequate and pertinent estimation methods for these combined uncertainties.


    The need for a combination of positional and attribute uncertainty estimation
    methods is illustrated by the following example. In a land resources inventory,
    the land area within a given administrative boundary, such as a country, needs
    to be found. Using remote sensing techniques, a satellite image is classified
    and a land cover thematic map is obtained. The administrative boundaries from
    a paper map, such as a boundary map of the county, are digitized and stored in
    a GIS. These two layers (the land cover thematic map and the administrative boundaries
    map) are then overlaid and the total area for each land cover types within county
    is then calculated. This procedure for a land resource inventory by integrating
    remote sensing and GIS is illustrated in Figure 6.1.


    Normally, both the classified image and the digitized map are assumed error-free.
    In reality, both image and map layers possess uncertainties. For instance, the
    satellite image is classified using the maximum likelihood classification method.
    If a pixel is categorized as “forest” with only 70% certain, there is a 70% probability
    that the pixel is forest and a 30% probability that the pixel is not forest. Thus,
    the classification result contains attribute uncertainty. However, the digitized
    administrative boundary in GIS has positional error. If a point is located close
    to a boundary line, it may not be sure that this point is really within the boundary.
    This uncertainty arises from the random error in the digitized points composing
    the polygon boundary, for example, resulting from errors during


