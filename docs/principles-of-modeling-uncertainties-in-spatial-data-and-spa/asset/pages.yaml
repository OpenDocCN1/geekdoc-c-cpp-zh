    the related transformation models.


    # 13.6.1 DATA SETS


    Four data sets include three IKONOS images for Hong Kong (China), Melbourne (Australia),
    and Zagaz (Egypt), and one Quickbird for the province of Fayoum in Egypt. A set
    of checkpoints for verifying the LBTM has been obtained for each data set, using
    GPS coordinates were provided for the WGS84 Data and UTM projection. The accuracy
    of the point observed by GPS is less than 5 cm in both the X and Y directions.
    The accuracy of the points on the image is half the size of a pixel. Details of
    the characteristics of the Hong Kong data set are presented in [Table 13.2].


    Each of the four data sets consists of a master image and reference image. The
    master image is the original image from the waters, whereas the reference image
    is the image from a polynomial transformation model, after removing the relief
    displacement, if any, by projecting the ground coordinates to a compensation plane.
    In all cases, the accuracy level of the rectified images was approximately equal
    to one pixel.


    Several lines representing linear features have been digitized on the master and
    the reference images and are used as ground control lines (GCLs) for the recovery
    of the coefficients of the LBTM. Figure 13.5 shows the distribution of the line
    segments of the GCLs and the checkpoints for the Hong Kong date sets.'
