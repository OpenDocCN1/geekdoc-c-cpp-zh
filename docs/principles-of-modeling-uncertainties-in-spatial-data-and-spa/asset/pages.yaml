    Some points on the initial line are sampled randomly; the sample points and the
    shape points of the initial line form a point set—the **symbolic points**. An
    error ellipse of a symbolic point on the initial line is determined by the variance-covariance
    of the points. In line data capture, the shape points are selected differently
    from one time measurement to another, except for the starting and ending shape
    points.


    Let $\Sigma$ denote the variance-covariance matrix of a point on the line,


    ```

    $$\Sigma = \begin{pmatrix} \sigma_x^2 & \sigma_{xy} \ \sigma_{xy} & \sigma_y^2
    \end{pmatrix} \quad (11.2)$

    ```


    The semi-major and semi-minor axes of the error ellipse of the corresponding point
    are square roots of two solutions to the following equation


    ```

    $$\lambda^2 - (\sigma_x^2 + \sigma_y^2)\lambda + (\sigma_x^2\sigma_y^2 - \sigma_{xy}^2)
    = 0. \quad (11.3)$

    ```


    The orientation of this standard error ellipse is given by the angle $\theta$
    between the x-axis and the semi-major axis


    ```

    $$\theta = \frac{1}{2}\alpha \tan[2\sigma_{xy}/(\sigma_x^2 - \sigma_y^2)]. \quad
    (11.4)$

    ```


    Let there be $n$ symbolic points on the line. When $n$ tends to infinity, the
    integration of the error ellipses of the symbolic points forms the G-bands—as
    illustrated by the dashed lines in Figure 11.2.


    # 11.3.2 MODELING LINE SIMPLIFICATION ERROR


    Three indices are used to measure the error in a line simplification process:
    the normalized difference, the median difference, and the maximum difference between
    an initial line and its simplified version.'
