  md: '# Metadata on Spatial Data Quality


    Line positional uncertainty can affect the line characteristics. The characteristics
    may include length or orientation. The length is the sum of distances between
    line nodes, while orientation can be interpreted as an aspect of confronting to
    the east. A characteristic difference between an absolute position of a data set
    line and that in the universe of discourse is used to indicate the line positional
    accuracy. If there is more than one observation for the data set line, the RMSE
    of the characteristics difference will be computed to indicate line positional
    accuracy:


    ```

    RMSE(l) = \sqrt{\frac{1}{n}\sum_{i=1}^{n}(l_i - \bar{l})^2}

    RMSE(o) = \sqrt{\frac{1}{n}\sum_{i=1}^{n}(o_i - \bar{o})^2} \quad (16.4)

    ```


    $l$ and $l_i$ represent the line length in the universe of discourse and that
    in the data set, $o$ and $o_i$ represent the orientation of the line in the universe
    of discourse and that in the data set, respectively, and $n$ is the total number
    of observations in the data set.


    Assessing line positional accuracy, based on a characteristic of that line, is
    an indirect method that aims to study impact of the positional accuracy of the
    characteristic. A direct approach to positional accuracy assessment can be derived
    from a distance between an absolute position of a line in the data set and that
    in the universe of discourse. A distance between two lines can be determined by
    a discrepant area (Shi et al., 2003). The discrepant area is the area of a region
    bound by the two lines (see Figure 16.2). In there are multiple sample line absolute
    locations in the data set, the RMSE of the discrepant area can be computed.


    The confidence region model for a line described in Section 4.5 can also be used
    to report positional accuracy of the line in metadata. A confidence region around
    an absolute line location in the data set is a feasible region, inside which the
    absolute line location in the universe of discourse is located with a specific
    probability. This is a graphical representation of line positional accuracy. Furthermore,
    dividing this by the total line length in the universe of discourse is one possible
    line positional accuracy measure. If values of the specific probability for confidence
    regions around two data set lines are identical, the line with the larger value
    of this positional accuracy measure will contain a larger value of positional


