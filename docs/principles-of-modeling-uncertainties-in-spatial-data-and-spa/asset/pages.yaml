    eg H_t, Z_t(x)) = 1 - P(H_t/Z_t(x))$.


    $P(H_p)$ and $P(H_t)$ are determined from the priori knowledge about the map or
    image.


    Step 2: To calculate $\lambda(H_t, Z_t(x))$ and $\lambda(H_p, Z_p(x))$, based
    on Formulas 6.14 and 6.15.


    Step 3: To calculate the threshold value (T) of $\lambda(H_{p,t}, Z_p(x)Z_t(x))$
    according to the formula (6.13).


    Step 4: To calculate the T-corresponding certainty factor by the Formula 6.6.
    The value of the certainty factor forms the upper bound of the integrated positional
    and attribute uncertainty. In other words, the combined uncertainty value, that
    is, the certainty factor is less or equal to the T-corresponding certainty factor
    CF(T).


    A threshold value for certainty factor values can be obtained. The value is the
    largest certainty value for the hypothesis $H_{p,t}$ under the condition of $Z_p(x)Z_t(x)$.
    This is, in fact, the indicator of combined positional and attribute uncertainty,
    based on the certainty factor model with probabilistic interpretation.


    The above procedure can be practically implemented in an integrated GIS and remote
    sensing environment for inference in an inference network. According to the nature
    of the combination problems, either parallel or sequential combination can be
    chosen. A certainty factor for each pixel can finally be obtained. Each factor
    is an indicator of integrated positional and attribute uncertainty and gives an
    upper bound (by the threshold value) for each pixel; the uncertainty of the pixel
    is less than this value.


