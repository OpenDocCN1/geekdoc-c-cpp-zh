    # 3.2.2 RANDOM VARIABLE AND DISTRIBUTION FUNCTION


    # 3.2.2.1 Random Variable and Its Probability Distribution Function


    An outcome of a random experiment with a sample space can be represented by a
    variable. Although this variable may be of a different value in each experiment,
    that follows the laws of probability theory. Such a variable is called a *random
    variable*. It quantifies the random experiment.


    Suppose that have a random experiment with sample space Ω. A random variable X
    is a real-valued function defined on the sample space of the experiment. The probability
    Pr(X=x) of the random variable X equal to a constant x is called the probability
    density function of X abbreviated p.d.f. Moreover, the probability Pr(X≤x) of
    the random variable X not greater than the constant x is the cumulative distribution
    function (sometimes called the *distribution function*) of X and is abbreviated
    c.d.f. It is denoted by F(x); for $-\infty < x < \infty$,


    ```

    F(x) = Pr(X \leq x).

    ```


    # 3.2.2.2 Properties of the Distribution


    The mathematical definition of a distribution function is a function with the
    following properties:


    +   1. $F(x) = \sum_{y\leq x} f(y)$ in a discrete space or $F(x) = \int^{x} f(y)dy$
    in a continuous space.

    2. For $x_1 < x_2$, we have $F(x_1) \leq F(x_2)$. That is, the distribution function
    $F(x)$ is a monotonic function.

    3. For any real number $x$ and $h > 0$, $\lim_{h\to0} F(x+h) = F(x)$. This means
    that $F(x)$ is a right-continuous function.

    4. For $a, b \in (-\infty, +\infty)$, $Pr(a \leq X \leq b) = F(b) - F(a)$.

    5. For $h > 0$, $Pr(X=a) = F(a) - \lim_{h\to0} F(a-h)$.


    # 3.2.2.3 The Distribution Function of a of the Random Variable


    Firstly, describe continuous random variables are defined. The possible values
    for a discrete random variable can be listed as a sequence. In particular, any
    random variable with a finite number of possible values is discrete. However,
    the possible values for a continuous random variable form an interval (or intervals)
    with a positive length.


    Let Y denote a random variable in the form of the random variable X with space
    Ω, $Y = u(X)$. In the discrete case, the distribution function of X is


    ```

    F(x) = Pr(X \leq x) = \sum_{y\leq x} f(y).

    ```


    In the continuous case, the distribution function is


    ```

    F(x) = Pr(X \leq x) = \int^{x} f(y)dy.

    ```'
