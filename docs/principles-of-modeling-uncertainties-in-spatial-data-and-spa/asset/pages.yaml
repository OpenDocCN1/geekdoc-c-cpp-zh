  md: '# Sources of Uncertainty in Spatial Data and Spatial Analysis


    # 2.4.3.5 Laser Scanner


    Laser scanning is a new technology for capturing three-dimensional spatial data.
    The principle of capturing ground surface data with a laser scanner involves the
    estimation of the distance from a laser source to a target point by capturing
    the echo time of the laser beams emitted. The beams are then converted into the
    three-dimensional coordinates x, y, z of the target point. During this laser transmission
    process, the reflective intensity (I) of the target is also detected and recognized.
    Therefore, the result of laser scanner usage is for a four-dimensional coordinate
    (x, y, z, I) for each target point. Laser scanning technology generally falls
    into two categories: terrestrial scanning and airborne scanning.


    The accuracy of airborne laser scanning data is affected by several factors: accuracy
    and reliability of GPS and IMU, the power and accuracy of the laser emitter, and
    methods applied for processing the laser-anned data obtained. In many cases, the
    point set obtained from a laser scanner cannot be used directly. It needs further
    processing to enable the extraction of the required information such as buildings
    or terrains. The performance of the object extraction algorithms affects the quality
    of the obtained information.


    The point clouded by a terrestrial laser scanner can reach a geometric accuracy
    ranging from millimeters to decimeters. The airborne laser scanner, in general,
    provides the point accuracy of a decimeter, depending on flight height and quality
    of the scanner technology used.


