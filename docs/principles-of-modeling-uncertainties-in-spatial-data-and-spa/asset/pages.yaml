    # 3.8 SUMMARY


    Because of the complex nature of uncertainties in spatial data such as those connected
    withprecision, ambiguity, and vagueness, a number of mathematical theories have
    been identified and adopted for modeling uncertainties in spatial data and spatial
    analyses. These theories are described briefly in this chapter, including probability
    theory, statistics, information theory and entropy, rough set, evidence theory,
    fuzzy set, and fuzzy topology. For instance, probability theory and statistics
    have been applied for handling imprecise uncertainty, such as modeling position
    uncertainty in spatial data (as described in Chapter 4). Fuzzy sets provide a
    natural framework for handling vagueness uncertainty. Fuzzy topology has been
    developed for modeling uncertain relationships between spatial objects (as described
    in Chapter 7).


