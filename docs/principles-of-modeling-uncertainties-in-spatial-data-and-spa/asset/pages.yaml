    # 3.2.3.2 Properties of the Expectation and the Variance


    The expectation and the variance have the following properties:


    +   1. $Var(X) = E(X)^2 - [E(X)]^2$.

    2. For any constant $a$, $E(a) = a$ and $Var(a) = 0$.

    3. For any constant $c$, $E(cX) = cE(X)$ and $Var(cX) = c^2Var(X)$.

    4. $E(XY) = E(X)E(Y) + E[(X-E(X))(Y-E(Y))]$.

    5. Let $x_1, x_2, ..., x_n$ be n random variables, the expectation and the variance
    of their sum


    ```

    $E(x_1 + x_2 + \cdots + x_n) = E(x_1) + E(x_2) + \cdots + E(x_n)$

    ```


    and


    ```

    $Var(x_1 + x_2 + \cdots + x_n) = \sum_{i,j=1}^n E[(x_i - E(x_i))(x_j - E(x_j))]$

    ```


    +   6. Let $x_1, x_2, ..., x_n$ be independent random variables, the expectation
    of their product is $E(x_1x_2 \cdots x_n) = E(x_1)E(x_2) \cdots E(x_n)$.

    7. Let $x_1, x_2, ..., x_n$ be independent random variables. Suppose that the
    mean and the variance of each of these random variables are $E(x_k) = \mu$ and
    $Var(x_k) = \sigma^2$ for all $k = 1, 2, ..., n$. The expectation and the variance
    of the random variable


    ```

    $y = \frac{1}{n} \sum_{k=1}^n x_k$

    ```


    are $E(y) = \mu$ and


    ```

    $Var(y) = \frac{\sigma^2}{n}$

    ```


    # 3.2.3.3 Chebyshev''s Inequality


    An bound for a certain probability can be estimated based on Chebyshev’s theory
    of inequality. A random variable $X$ have the mean $E(X)$ and finite variance
    $Var(X)$, then, for any positive real number $\varepsilon$,


    ```

    $Pr(|X - E(X)| \ge \varepsilon) \le \frac{Var(X)}{\varepsilon^2}$ (3.19)

    ```


    The right side of the equation is an upper bound for the probability $Pr(|X -
    E(X)| \ge \varepsilon)$, which is not necessarily close to the true value of the
    probability.'
