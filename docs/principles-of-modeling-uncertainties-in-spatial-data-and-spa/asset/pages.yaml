  md: '# #8 Modeling Uncertainty in Digital Elevation Models


    Specific focus of this chapter is on uncertainty in a digital elevation model,
    Surface modeling approaches are introduced in Section 8.2, followed by a brief
    description of a digital elevation model (DEM) error sources. Error estimation
    for two types of DEM models is given: (a) for a triangular irregular surface model
    (Section 8.4) and (b) for a regular grid DEM, generated from a nonlinear interpolation
    (Section 8.5).


    # ## 8.1 INTRODUCTION


    A digital elevation model (DEM) is a digital representation of a continuous surface
    by an array of z values, referred to a common datum. Digital elevation models
    are commonly used to represent the terrain relief of the Earth surface. DEM has
    been widely used in many areas, such as mapping, engineering, geology, construction,
    road design, and agriculture.


    A DEM is an approximation of the surface of the natural world. A difference exists
    between the surface elevations in the natural world and the surface represented
    by the model. This difference is referred to as a DEM error. Such errors can be
    represented usually in terms of the root mean or average surface errors. Such
    errors affect DEM applications, such as in determining topographic features (for
    example, slope gradient or slope aspect). Therefore, modeling uncertainties in
    a DEM model is not only a theoretical issue, but also an issue related to successful
    DEM applications.


    # ## 8.2 SURFACE MODELING


    A DEM can be generated by interpolating various sampling data sets of the real-world
    surface. These data sets may include, for example, rectangular grids, square grids,
    triangles, and randomly distributed points. Many interpolation algorithms have
    been documented in the literature, such as linear interpolation or nonlinear interpolation,
    and fitting methods. These interpolation algorithms are briefly introduced, as
    follows, with the aim of forming a basis for analyzing DEM uncertainty.'
