  md: "Mathematical Foundations\n\n45\n\n# 3.3.3.3.3 Evaluation for the Point Estimator\
    \ of Parameter\n\nMany criteria exist for evaluating the estimator of a parameter.\
    \ They include unbiasedness, efficiency, and consistency.\n\nIf an estimator $\\\
    hat{\theta}$ satisfies\n\n$E(\\hat{\theta}) = \\theta, \\quad (3.46)$\n\nit is\
    \ then, called an unbiased estimator of $\theta$.\nSuppose that both $\\hat{\t\
    heta}$ and $\\hat{\theta}'$ are unbiased estimators of $\theta$ and the variance\
    \ of $\\hat{\theta}$ is not greater than that of $\\hat{\theta}'$. $\\hat{\theta}$\
    \ is more efficient than an estimator than $\\hat{\theta}'$. When $Var(\\hat{\t\
    heta})$ is the minimal among unbiased estimators, $\\hat{\theta}$ is called the\
    \ most efficient unbiased estimator of $\theta$.\n\nFor any positive real number\
    \ $\\varepsilon$, an estimator $\\hat{\theta}_n$ in a sample of size $n$ is consistent\
    \ if\n\n$\\lim_{n\\to\\infty} Pr(|\\hat{\theta}_n - \\theta| > \\varepsilon) =\
    \ 0. \\quad (3.47)$\n\nThe Chebyshev inequality implies that for any $r \\ge 0$,\
    \ an estimator $\\hat{\theta}_n$ has the follow-ing property:\n\n$\\lim_{n\\to\\\
    infty} E|\\hat{\theta}_n - \\theta|^{r} = 0 \\quad (3.48)$\n\nis a consistent\
    \ estimator of $\\theta$.\n\n# 3.3.3.3.4 Interval Estimation of a Population Parameter\n\
    \nThe estimator of a parameter is a range of values within which the parameter\
    \ is thought to lie. A confidence interval is a range of values that is about\
    \ $100(1 - \\alpha)\\%$ of the times. It includes the true value of the unknown\
    \ parameter, where $0 \\le \\alpha \\le 1$. Suppose a confidence interval for\
    \ parameter $\theta$ is a region $(\\theta_1, \\theta_2)$ that\n\n$Pr(\\\\theta_1\
    \ < \\theta < \\theta_2) = 1 - \\alpha. \\quad (3.49)$\n\n$\\theta_1$ and $\\\
    theta_2$ are called confidence limits. Regions $\\theta \\le \\theta_1$ and $\\\
    theta \\ge \\theta_2$ are regions of rejection. Both the confidence limit and\
    \ the rejection region are determined by the probability $1 - \\alpha$. This probability\
    \ is known as the level of confidence, and the probability $\\alpha$ represents\
    \ a significance level.\n\nSuppose that an outcome $X$ of a random experiment\
    \ is a random variable with a normal distribution $N(\\mu, \\sigma^2)$. Given\
    \ the value of the significance level, confidence intervals for the mean and the\
    \ variance can be determined based outcomes of a random sample $X_1, X_2, ...,\
    \ X_n$. If there are two samples with different means and variances, a confidence\
    \ interval for the mean difference can also be determined."
