    # 16.2.4.1.3 Measurement of a Polygon


    Similar to the positional accuracy measurement of a line, positional accuracy
    of a polygon can be based on characteristics of the polygon, and a distance between
    an absolute location of the polygon in the database and that in the universe of
    discourse. Characteristics of the polygon may include area, perimeter, and center
    of gravity. The RMSE for each characteristic can be computed to describe the positional
    accuracy. In addition to this indirect approach, a distance between absolute locations
    of the polygon in the database and in the universe of discourse can be computed,
    by the discrepant area (Shi et al., 2003). This discrepant area between two polygons
    is derived from a region bound by the polygons (Figure 16.3).


    The polygon accuracy measure can be extended to describe positional accuracy for
    a data series to which the data set belongs, the data set itself, or a smaller
    grouping within the data set. An accuracy interval, on a global level, contains
    the minimum and maximum of a polygon accuracy accuracy measure as the lower and
    upper bounds of the accuracy interval, respectively.


    # 16.2.4.2 Relative or Internal Accuracy


    Relative or internal accuracy corresponds to the closeness of the relative positions
    of data set features to their relative positions, accepted or being true. This
    closeness is valued based on comparisons between relative positions of features
    in the data set and those in the universe of discourse (or accepted as true).


    The positional accuracy measure for a feature in the above subsection can also
    be applied to provide a measure of relative or interval accuracy by replacing
    the absolute coordinate with the relative coordinate. For example, the RMSE of
    the error distance for a point in the relative or interval accuracy is defined
    by'
