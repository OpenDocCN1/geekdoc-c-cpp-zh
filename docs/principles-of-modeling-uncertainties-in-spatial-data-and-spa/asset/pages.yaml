  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    The techniques used for positional error propagation, for modeling error propagation
    of continuous attribute data are achieved, based on this transformation.


    # 5.2.7  Sensitivity Analysis


    A sensitivity analysis can be applied for studying propagation of attribute uncertainty
    in a spatial analysis. An error propagation analysis for spatial data in GISci
    assumes that the errors of input data are known and the process of error propagation
    and errors in the output are then analyzed after the spatial analysis. If errors
    of input data are unknown, a sensitivity analysis can be applied to study the
    relationships between input and output errors in a function transformation.


    In a sensitivity analysis, simulated interfere variables are added to the input
    data and the effects on them by simulations are then analyzed. The interfere variables
    can be used to represent each human error or errors in input data sets. A sensitivity
    analysis may demand large computer resources—both computation time and storage
    for large data volume. One limitation of sensitivity analysis is that it cannot
    give the mathematical expression of attribute uncertainty analytically.


    Lockwick et al. (1988) reviewed methods and applications of sensitivity analysis
    Five indicators, including attribute uncertainty, positional uncertainty, and
    area errors, were defined for the analysis. Two algorithms were proposed for determining
    the confidence level of the outputs by the use of those indicators. Bonin (1998)
    studied the propagation of attribute uncertainties in vector-based GIS based on
    sensitivity analysis. The uncertainties of roads were taken as an example to demonstrate
    the usage of the method. The probability model for the estimation of the attribute
    noise in vector-based GIS, was also proposed (Bonin, 2000). The sensitivity analysis
    was also applied to raster-based GIS. It was found that both continuous and discrete
    variables are not presented with isotropy, and that semantics may affect different
    level outputs (Fisher, 1991; McMaster, 1996).


    # 5.3  SUMMARY COMMENT


    The focus of this chapter has been on methods for modeling attribute uncertainty,
    and these methods covered sampling techniques, the error matrix, probability vector
    and four parameters, internal and external testing, the incidence of defect method,
    and the sensitivity analysis. Among the methods, sampling techniques provide a
    basis for both the error matrix and the incidence of defect method. The error
    matrix can indicate attribute uncertainty for each class, in addition to overall
    classification. The incidence of defect model can provide information about different
    levels of defects for a data set with attribute uncertainty. However, a probability
    vector can be used to describe spatial distribution of attribute uncertainty of
    a maximum likelihood classified image. The proposed four parameters, based on
    the probability vector, describe classification uncertainties in four different
    aspects: absolute error, relative error, level of mixture, and incompleteness.'
