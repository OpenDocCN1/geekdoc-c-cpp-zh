- img_proc: true
  md: '# Modeling Uncertainty in Digital Elevation Models


    DEM generation processes, error sources include field surveying, map digitization,
    and interpolation error.


    Sampling density and sample size is one factor that directly affects DEM accuracy.
    In general, the model generated from more sample points is of higher quality and
    can represent the natural world more realistically.


    Scheming samples are other factors affecting DEM accuracy. The sampling point
    distribution can follow (a) a regular pattern, and (b) an irregular pattern. With
    a regular pattern, the sampling points are evenly distributed (such as, squares,
    rectangle, regular triangles, and regular hexagons). With a regular distribution
    pattern, the feature points or lines may not be represented by the sample points,
    hence generating an error source of a DEM.


    Another factor that affects the effectiveness of a regular rigged DEM is the inflexibility
    in resolution. In principle, the resolution of a DEM should be changeable, depending
    on the terrain to be described. The DEM resolution should be lower for an area
    with lower terrain change frequency, and for an area with higher terrain change
    frequency. As mentioned in Section 8.2.3, a TIN model can cope with this dynamic
    change of resolution within a DEM model, whereas, the regular grid model is not
    sufficiently flexible in this rigid. Dynamic generation of multi-resolution TIN
    models (Yang et al., 2005) is an interesting issue, especially for three-dimensional
    digital city modeling.


    A DEM model is a simplification and abstraction of a surface, such as a surface
    in the real world. A set of discrete sample points is used in a DEM to represent
    a continuous surface that has an infinite number of points. This is a fundamental
    cause of uncertainty in such models. Therefore, no matter how high the sampling
    density chosen, this model is still a simplification of the surface in the real
    world, but without being detailed.


    Positional errors in the sample points also cause uncertainty in a DEM. The positional
    characteristics of the model are determined by the position of its sample points,
    this positional error can propagate within the model. The quantitative relationship
    between the sample points and the errors in the generated DEM are given in Sections
    8.4 and 8.5 below.


    A continuous surface is uniquely generated from discrete sample points by applying
    an interpolation method. The quality and characteristics of the interpolation
    method is, therefore, another factor that affects the accuracy of a DEM. Research
    has been done on analyzing interpolation algorithms (Akima, 1996; Caselles et
    al., 1998; Almansa et al., 2002). The related research issues are: (a) local interpolation
    methods, (b) directional interpolation methods, and (c) assessment of the performance
    of the interpolation methods.


    As indicated, each interpolation algorithm introduces error, generally different
    in type, in the generation of a DEM. However, these errors can be estimated and
    even reduced to a certain level, although it is not possible to avoid them. Research
    has been carried out to study interpolation algorithms in order to interpolate
    accuracy. During interpolation, sufficient consideration regarding the characteristics
    of raw data sets and the nature of the terrain concerned in interpolation design
    can potentially improve the quality of the interpolated DEM. Based'
