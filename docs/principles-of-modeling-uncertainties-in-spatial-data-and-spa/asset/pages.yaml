    objects prior to any cognition necessity. It is the unrecorded definitions of
    objects by different people groups that is likely to cause such cognition uncertainty.
    For example, a building will be defined and classified differently according to
    the context of the users'' experience. Such users could be land survey groups,
    urban planning groups, development groups, and tax evaluation groups. Cognition
    uncertainty in this case is generated by the different background knowledge of
