    Let $\Delta f = |f - f^p|$. Error in $f^p$ is then expressed as


    ```

    $$\Delta f|^2 = \langle f-f^p, f-f^p\rangle\n=\langle f,f\rangle + \langle f^p,f^p\rangle
    - 2\langle f,f^p\rangle, \quad (14.6)$

    ```


    where $\langle\cdot,\cdot\rangle$ is the inner product of vectors in mathematics.
    Equation 14.5 is equivalent to the square root of Equation 14.6, except the constant
    term. It implies


    ```

    $$\frac{\partial|\Delta f|^2}{\partial\rho} = \frac{\partial\langle f^p,f^p\rangle}{\partial\rho}-2\frac{\partial\langle
    f,f^p\rangle}{\partial\rho}, \quad (14.7)$

    ```


    By considering $f^p = \rho f_1 + (1-\rho)f_2$, we have


    ```

    $$\langle f^p,f^p\rangle = \langle\rho Af_0 + (1-\rho)B_0, \rho Af_0 + (1-\rho)B_0\rangle\n=\rho^2|Af_0|^2+(1-\rho)^2|B_0|^2+2\rho(1-\rho)\langle
    Af_0, B_0\rangle, \quad (14.8)$

    ```


    and


    ```

    $$\langle f,f^p\rangle = \langle f, \rho Af_0 + (1-\rho)B_0\rangle\n=\rho\langle
    f,Af_0\rangle+(1-\rho)\langle f,B_0\rangle. \quad (14.9)$

    ```


    Differentiating these two equations gives


    ```

    $$\frac{\partial\langle f^p,f^p\rangle}{\partial\rho} = 2\rho|Af_0|^2-2(1-\rho)|B_0|^2+2\langle
    Af_0,B_0\rangle-4\rho\langle Af_0,B_0\rangle, \quad (14.10)$

    ```


    and


    ```

    $$\frac{\partial\langle f,f^p\rangle}{\partial\rho} = \langle f,Af_0\rangle-\langle
    f,B_0\rangle=\langle f,Af_0-B_0\rangle. \quad (14.11)$

    ```


    Equation 14.7 is then rewritten as


    ```

    $$\frac{\partial|\Delta f|^2}{\partial\rho} = 2\rho|Af_0|^2-2(1-\rho)|B_0|^2+2\langle
    Af_0,B_0\rangle, \quad (14.12)$\n-2\rho\langle Af_0,B_0\rangle-2\langle f,Af_0-B_0\rangle.
    $

    ```'
