    # 4.9 MODELING POLYGON UNCERTAINTY


    Object polygon errors in GISci are caused by positional errors in their boundaries.
    Such errors are mainly caused by composing vertices of the polygons. In this section,
    two approaches for modeling positional error of a polygon are given: the first
    is based on error of the component vertices of the polygon; the second is based
    on errors of composing the line segments through their error bands (Liu et al.,
    2005).


    # 4.9.1 Error Modeling Based On Its Component Vertices


    A polygon is composed of its component vertices. Polygon errors are determined
    by vertices errors, and can be quantified by error propagation law. A polygon
    is described by its parameters, such as its area, perimeter or gravity point.
    The area of a polygon is now taken as an example to demonstrate polygon error
    modeling based on its compositional vertices.


    Suppose polygon A contains n vertices $P_i = (x_i, y_i)$ and $n$ edges $P_1P_2,
    P_2P_3, \dots, P_{n-1}P_n$, and $P_nP_1$. The covariance matrices of the individual
    vertices are expressed as


    ```

    $$\Sigma_{P_iP_i} = \begin{bmatrix} \sigma_{x_i}^2 & \sigma_{x_iy_i} \ \sigma_{y_ix_i}
    & \sigma_{y_i}^2 \end{bmatrix}$ (4.117)

    ```


    The area $S$ of the polygon is computed from


    ```

    $S = \frac{1}{2} \sum_{i=1}^n [x_i(y_{i+1} - y_{i-1})] = \frac{1}{2} \sum_{i=1}^n
    [x_i\Delta y_{i-1,i+1}]$ (4.118)

    ```


    The differential of the area is given as


    ```

    $dS = \frac{1}{2} \sum_{i=1}^n [Delta y_{i-1,i+1}dx_i + \Delta x_{i-1,i+1}dy_i]$
    (4.119)

    ```


    This differential is used to compute the variance of the area of the polygon:


    ```

    $$\sigma_{S1}^2 = \frac{1}{4} \sum_{i=1}^n [\Delta y_{i-1,i+1}^2\sigma_{x_i}^2
    + \Delta x_{i-1,i+1}^2\sigma_{y_i}^2 + 2\Delta x_{i-1,i+1}\Delta y_{i-1,i+1}\sigma_{x_iy_i}]$
    (4.120)

    ```'
