  md: '# Sources of Uncertainty in Spatial Data and Spatial Analysis


    A description of the spatial data capture methods in common use and their associated
    spatial data accuracy, plus the main error sources of these methods are summarized
    and analyzed as follows. Included are map digitization, photogrammetry, laser
    scanning, total station, GPS, and remote sensing.


    # 2.4.3.1 Map Digitization


    Map digitization is a common method for capturing digital data, from maps, for
    GIS. Two map digitization methods are used: (a) manual digitization for paper
    maps and (b) on-screen digitization for raster maps. Two modes can be for a digitization
    process: the point mode and the stream mode.


    As indicated, the accuracy of map digitization is related to many factors. Such
    factors vary from the quality of the raw map used (later includes inherent source
    errors and errors due to paper deformation by conditions such as a humid climate)
    to the density and complexity of spatial features on the map; the skill and operation
    method of the digitization operator; instrument quality (such as that of the digitization
    instrument or scanner); the data processing software functions regarding the handling
    of errors; and also the accuracy of control points used for coordinate transformation.


    # 2.4.3.2 Aerial Photogrammetry


    Aerial photogrammetry is a mapping technology based on stereo aerial consecutive
    photographs. The technology has evolved by means of the following three stages:
    analog photogrammetry, analytical photogrammetry, and digital photogrammetry,
    the latter being the mainstream photogrammetry technology of today. Aerial photogrammetry
    is appropriate for mapping large areas. The input for photogrammetry mapping includes:
    (a) stereo aerial photographs with a certain level of overlap and (b) ground control
    points of the area to be mapped. The outcomes of digital aerial photogrammetry
    are: (a) digital topographic maps, (b) digital orthophotos, and (c) digital elevation
    models. The fundamental theoretical basis of aerial photogrammetry is the collinear
    equation. The major workflow of this technology covers the following: aerial triangulation,
    relative orientation, absolute orientation, stereo mapmapping, and the production
    of DEM and digital orthophotos.


    The accuracy of the photogrammetry product is affected by the following factors:
    accuracy and scale of the aerial photographs, accuracy of ground control points,
    reliability of the algorithms used for the topographic mapping, including image
    matching, registration, aerial triangulation, and internal and external orientation.
    Although digital photogrammetry involves many automatic processes, human operators
    are still involved in practical photogrammetry production. Therefore, the human
    operator is also one of the factors affecting the accuracy of the photogrammetric
    products. Photogrammetry has, at present, reached the metric accuracy of decimeter
    level, a state in which horizontal accuracy is normally higher than that of vertical
    accuracy.


    # 2.4.3.3 The Total Station


    The total station is currently the most used instrument for ground surveying.
    The station has the ability to measure both angle and distance. Three-dimensional'
