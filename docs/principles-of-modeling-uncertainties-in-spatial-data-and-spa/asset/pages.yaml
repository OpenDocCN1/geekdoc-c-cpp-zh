  md: "# 4.4 MODELING POSITIONAL UNCERTAINTY FOR A POINT\n\nA point feature is one\
    \ of the fundamental elements of geographic objects. The point feature is also\
    \ a composite of a line or a polygon in GISci. Positional error modeling of the\
    \ point feature is thus a basis for positional error modeling of other spatial\
    \ features in GISci.\n\nPositional error at a point can be described by a possibility\
    \ region. The region may be in the form of an error ellipse or an error rectangle.\
    \ An error ellipse is commonly used to describe the error at the point. Let $Q_{xy}$\
    \ denote a point with the $x$-directional variance of $\\sigma_x^2$, the $y$-directional\
    \ variance of $\\sigma_y^2$, and the covariance of $\\sigma_{xy}$. The correlation\
    \ of this relation in the $x$- and $y$-directions is denoted by $\\rho_{xy}$.\n\
    \nIf the error at point $Q_{21}$ follows a normal distribution, its probability\
    \ density function is given\n\n```\n$$f(x,y)=\\exp\\left\\{\\left[(x-\\mu_x)^2/\\\
    sigma_x^2+(y-\\mu_y)^2/\\sigma_y^2-2\\rho_{xy}(x-\\mu_x)(y-\\mu_y)/(\\sigma_x\\\
    sigma_y)\\right\\right\\}/(2\\pi\\sigma_x\\sigma_y\\sqrt{1-\\\rho_{xy}^2})\\right)$$\n\
    $$\\$\\$(4.17)\n```\n\nThe major and minor semiax ($E$ and $F$) as well as the\
    \ orientation $\\theta$ of the corresponding error ellipse are\n\n```\n$$E=\\\
    frac{\\sqrt{\\sigma_x^2+\\sigma_y^2+\\left(\\sigma_x^2-\\sigma_y^2\\right)^2+4\\\
    sigma_{xy}^2}}{2}$$\n$$\\$\\F=\\frac{\\sqrt{\\sigma_x^2+\\sigma_y^2-\\\\left(\\\
    sigma_x^2-\\sigma_y^2\\right)^2-4\\sigma_{xy}^2}}{2}$$\n$$\\$\\theta=\\frac{1}{2}\\\
    arctan\\left(\\\\frac{2\\sigma_{xy}}{\\sigma_x^2-\\\\sigma_y^2}\\right)$$\\$\n\
    $\\$(4.18)\n```\n\nThe probability $P$ that the point is inside the error ellipse\
    \ can be indicated by the volume of the two-dimensional error curved surface over\
    \ the error ellipse (as the case shown in Figure 4.1):\n\n```\n$$P(x,y\\subset\\\
    Omega)=\\int\\int f(x,y)dxdy=4\\int_0^r\\int_0^{\\pi} f(r,\\theta)drd\\theta=0.393.$$\n\
    $\\$(4.19)\n```"
