  md: '# 13 Quality Control for Field-Based Spatial Data


    Quality control for field-based spatial data is addressed in this chapter as follows.
    Satellite images are taken as examples of field-based spatial data, with quality
    control realized through geometric rectification of those images. The quality
    of field-based spatial data (satellite images) is controlled by firstly adopting
    point-based geometric rectification methods according to the point-based transformation
    models. Secondly, the line-based transformation model is proposed. Thirdly, both
    point-based and line-based methods are applied to both satellite image rectification
    and spatial modeling.


    # 13.1 INTRODUCTION


    Satellites can provide remotely sensed images of the Earth''s surface. With the
    development of space technologies, higher spatial, spectral, and temporal resolution
    satellite images have become available. Errors, however, still exist in satellite
    images to the effect of terrain variance, the status of satellite sensors during
    imaging, and other factors. A need exists in practical applications for the correction
    of the obtained satellite images to provide images that are more geometrically
    correct.


    Two categories of image rectification methods have been distinguished: (a) physical
    models and (b) nonrigorous empirical models. A physical model reflects the physical
    reality of satellite imaging geometry, and may also include the relationship defined
    in map projection. An empirical model builds a relation between satellite image
    space and object space by using a transformation or polynomial model.


    A physical model can reflect the real conditions of the sensor, the platform,
    and its image acquisition geometry. These are used for the geometric rectification
    of the satellite images. The collinear equation model is a physical model for
    frame camera-based images, describing the relationship between two-dimensional
    image space and three-dimensional object space.


    In the absence of the sensor model, and precise ephemeris data and satellite orbit
    information, an empirical model can be applied as an alternative. It does not
    require satellite platform and sensor information.


    In point-based rectifications, both physical and empirical models have been developed
    for line scanner images, such as for the SPOT, MOMS-02, and IRS-IC/D satellites.
    El-Manadili and Novak (1996) used direct linear transformation (DLT) for the geometric
    rectification of SPOT imagery. Okamoto et al. (1998) proposed affine transformation
    models for SPOT image rectification. Gugan (1986) suggested'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    an orbital parameter model based on the collinear equations and expanded by two
    orbital parameters to model the satellite movements along the path and the Earth''s
    rotation. Tao and Hu (2001) applied rational function models for high resolution
    satellite rectification and modeling. Fraser et al. (2002) proved the metric integrity
    of the IKONOS imaging system is comparable to that of medium resolution push-broom
    satellite sensors based on experimental studies.


    Satellite images, from both frame and linear array scanners, can also be rectified
    on the basis of linear features. Related research has been reported, such as Mulawa
    and Mikhail (1988); Kanok (1995); Tommaselli and Tozzi (1996); Dare and Dowman
    (2001); Habib et al. (2003). Two-dimensional and three-dimensional transformation
    models, which can be applied to satellite rectification, are introduced below.


    # 13.2 TWO-DIMENSIONAL TRANSFORMATION MODELS


    Two-dimensional transformation models are mainly used to build a geometric relationship
    between two-dimensional image space and two-dimensional object space. Examples
    of two-dimensional models are a generic two-dimensional polynomial transformation
    model, a conformal transformation model, and a projective transformation model.


    # 13.2.1 THE GENERIC TWO-DIMENSIONAL POLYNOMIAL TRANSFORMATION MODEL


    The generic form of two-dimensional polynomial model is given as:


    ```

    $x=a_0+a_1X+a_2Y+a_3X^2+a_4Y^2+a_5XY+\dots+a_nX^n$,\quad(13.1)$

    ```


    ```

    $y=b_0+b_1X+b_2Y+b_3X^2+b_4Y^2+b_5XY+\dots+b_nX^n$,\quad(13.2)$

    ```


    where $(a_i, b_i)$ $(i=1, 2, \dots)$ are model coefficients, $n$ is the order
    of the polynomial, $(x, y)$ is the pair of coordinates in the original image space,
    and $(X, Y)$ is the pair of coordinates in object space (or in the rectified image
    space). For an image-to-image rectification process, $(x, y)$ is the coordinate
    pair in the original image space before rectification and $(X, Y)$ are those in
    the rectified image space.


    The above polynomial model can be summarized as:


    ```

    $x=\left[\sum_{i=0}^n\sum_{j=0}^i a_k X^{i-j} \times Y^j\right],\quad(13.3)$

    ```


    ```

    $y=\left[\sum_{i=0}^n\sum_{j=0}^i b_k X^{i-j} \times Y^j\right],\quad(13.4)$

    ```'
