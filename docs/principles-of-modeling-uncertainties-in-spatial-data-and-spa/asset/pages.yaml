  md: "# Mathematical Foundations\n\n# TABLE 3.2\n\n# Statistic of a Population and\
    \ Its Sample\n\n| Characteristic | Random Sample | Population |\n|---|---|---|\n\
    | Mean | $\bar{X} = \\frac{1}{n}\\sum_{k=1}^{n}X_k$ | $\\mu = E(X)$ |\n| Variance\
    \ | $S^2 = \\frac{1}{n-1}\\sum_{k=1}^{n}(X_k - \\bar{X})^2$ | $\\sigma^2 = Var(X)$\
    \ |\n| Standard deviation | $S = \\sqrt{\\frac{1}{n-1}\\sum_{k=1}^{n}(X_k - \\\
    bar{X})^2}$ | $\\sigma = \\sqrt{Var(X)}$ |\n| Beta coefficient | $C_{\\beta} =\
    \ \\frac{S}{\bar{X}}$ | $C_{\\beta} = \\frac{\\sqrt{Var(X)}}{E(X)} = \\alpha$\
    \ |\n| Coefficient of skewness | $C_{\\gamma} = \\frac{n}{(n-1)(n-2)S^3}\\sum_{k=1}^{n}(X_k\
    \ - \\bar{X})^3$ | $C_{\\gamma} = \\frac{\\mu^3}{(\\sqrt{Var(X)})^3}$ |\n\n$v_r\
    \ = v_r(\\theta_1, \\theta_2, \\dots, \\theta_k) = \\int_{-\\infty}^{\\infty}\
    \ x^r dF(x,\\theta_1, \\theta_2, \\dots, \\theta_k),$ (3.40)\n\nwhere $r = 1,\
    \ 2, \\dots, k$. Let $X_1, X_2, \\dots, X_n$ be a random sample of size $n$ from\
    \ the population. The sum\n\n$\\hat{v}_r = \\frac{1}{n}\\sum_{i=1}^{n}X_i^r$ (3.41)\n\
    \nis the $r$th moment of the sample.\nThe method of moments equates $\\hat{v}_r$\
    \ to $v_r$, from $r=1$ to the value of $r$ such that there are enough equations\
    \ to provide unique solutions for $\\theta_1, \\theta_2, \\dots, \\theta_k$, say,\
    \ $h_i(\\\\hat{v}_1, \\hat{v}_2, \\dots, \\hat{v}_k)$ where $i = 1, 2, \\dots,\
    \ k$, respectively. that is, for $i = 1, 2, \\dots, k$, the estimator of $\\theta_i$\n\
    \n$\\hat{\theta}_i = h_i(\\\\hat{v}_1, \\hat{v}_2, \\dots, \\hat{v}_k).$ (3.42)"
