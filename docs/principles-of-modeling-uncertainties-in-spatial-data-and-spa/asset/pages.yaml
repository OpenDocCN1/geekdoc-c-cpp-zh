  md: "# Mathematical Foundations\n\n$b(d;n,p) \\approx \\Phi\\left(\\frac{d-np}{\\\
    sqrt{np(1-p)}}\right) - \\Phi\\left(\\frac{d-1-np}{\\sqrt{np(1-np)}}\right) \\\
    quad (3.33)$\n\nwhere\n\n$\\Phi(x) = \\int_{-\\infty}^{x} \\frac{1}{\\sqrt{2\\\
    pi}} \\exp\\left(-\\frac{x^2}{2}\\right)dx$\n\nis the distribution function of\
    \ the standard normal distribution.\n\n# 3.3.2.1.2 Poisson Distribution\n\nWhen\
    \ distinct events occur in such a way that the number of events occurring in a\
    \ given period of time depends on the length of that time period, this number\
    \ of events has a Poisson distribution with mean $\\lambda t$, where $t$ is the\
    \ length of the time period and $\\lambda$ is a positive constant.\n\nA random\
    \ variable $X$ that has the following form of $f(x)$ is said to have a Poisson\
    \ distribution with mean $\\lambda$:\n\n$f(x) = Pr(X=x) = \\frac{\\lambda^x}{x!}\
    \ e^{-\\lambda}, \\quad (3.34)$\n\nwhere $x=0, 1, 2, ...$ That is denoted by $X\
    \ \\sim P(\\lambda)$. The expectation and the variance of this variable are then\n\
    \n$E(X)=\\mu_X \\nVar(X)=\\sigma_X=\\lambda. \\quad (3.35)$\n\n# 3.3.2.1.3 Hypergeometric\
    \ Distribution\n\nSuppose that a population consists of two types of objects:\
    \ good or defective objects. Let $N$ be the total number of objects and $D$ be\
    \ the number of defective objects in the population. A number $n$ of the objects\
    \ is chosen randomly from the population without replacement. The number of defective\
    \ objects in this sampling is a random variable, say, $X$. The probability that\
    \ there are $d$ defective objects in the $n$ samples is\n\n$Pr(X=d) = \\frac{C_D^d\
    \ C_{N-D}^{n-d}}{C_N^n} \\quad (3.36)$\n\nWe say that $X$ is $h(n, D, N)$, we\
    \ mean that $X$ has the hypergeometric distribution p.d.f."
