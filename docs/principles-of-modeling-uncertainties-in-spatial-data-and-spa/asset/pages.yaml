  md: '# 17 The Web Service-Based Spatial Data Quality Information System


    This chapter addresses dissemination of quality information on spatial data and
    spatial analyses based on one of the latest Web technologies, the Web service
    technology. A new system designed by the author, the Web Service-Based Spatial
    Data Quality Information System (DQIS), has been developed for delivering two
    types of quality information: (a) numerical quality information on point, line,
    and area objects and buffer and overlay spatial analyses, and (b) visual representation
    of quality information. With this system, quality information on spatial data
    and analyses will be widely accessible to the users of spatial data through the
    Web. The system is now described in this chapter.


    # 17.1 INTRODUCTION


    Spatial data quality information is not only essential for spatial data-based
    GIS applications, but is also a basic element enabling the interoperation and
    integration of multiple geographic data. Web service technology is a new technology
    enabling the distribution information through the Web, and can be used to distribute
    spatial data quality information. Web technology organizations such as World Wide
    Web Consortium (W3C) and international standard organizations, such as International
    Organization for Standardization, Technical Committee 211 Geographic Information/Geomatics
    (ISO/TC211) and Open Geospatial Consortium (OGC) are working on geographic information
    interoperability. Both types of organizations have proposed solutions to facilitate
    GIS and Web Web service technology integration. W3C focuses on Web service technological
    and implementation aspects, whereas OGC focuses on Web service concepts, with
    an emphasis on Web service geographic information status and functions. That is
    to, OGC concentrates on the Web service framework and concepts, whereas W3C concentrates
    on Web service implementation.


    The Web service offers components equipped with basic functions to enable internet
    distribution, computing, and integration. It has already become an integrated
    platform for heterogeneous systems, as it has the features of open communication
    standard and emphasis on interoperability. Web service technology can be applied
    to directly connect and link various application programs, services, and devices,
    and thus, by using a consistent mode, can realize the data (including data quality
    information) exchange among different platforms.'
  merge: -1
  pgno: 398
