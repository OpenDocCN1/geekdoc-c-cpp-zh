  md: 'xx


    Foreword


    uncertainty is so pervasive, and so multidimensional, that no single approach
    can possibly address it.


    The contents of this book provide an excellent introduction to this multidimensional
    problem. Early research tended to focus on error and accuracy, on the grounds
    that the creation of geographic information was similar to the application of
    the theory of errors. Although this is conceptually simple, in reality geographic
    information tends to have some awkward properties that complicate the approximate
    approach. Maps are not collections of independent measurements, but instead represent
    the culmination of a long and complex process that induces very strong correlations
    in errors. All positions will be subject to error, but nearby positions will have
    more errors than distant positions—in other words, relative errors of position
    over short distances to be much less than absolute errors. Models of uncertainty
    need to incorporate strong spatial autocorrelations and to require comparatively
    advanced mathematics.


    By the mid-1990s, however, it was clear that some of the problem of uncertainty
    were derived in part the inherent vagueness of definitions, and that these could
    be handled much more effectively using the theoretical constructs of fuzzy sets.
    For example, we may not know exactly what is meant by wetland, but nevertheless
    it may make sense to be able to say that this area is more like wetland than that
    area. The approach was immediately attractive to many users of geographic information,
    who found it more intuitive and accessible than the statistical approach.


    Both statistical and fuzzy frameworks are covered in this book, which provides
    a comprehensive overview of the current state of the field. At the same time,
    it strongly reflects John Shi''s own approaches, and the very significant contributions
    he has made. It should be indispensable reading and desirable reading for anyone
    using geographic information in this research area, or actively engaged to solve
    real problems. We have made much progress in the past two decades, and today few
    users of geographic information systems are willing to assume that their outputs
    are correct and *just because they came from a computer*. Additionally, we are
    still some distance from the goal of placing a plus or minus on every output,
    and of incorporating uncertainty into every decision made with geographic information.
    But this book may help us get closer to that goal.'
