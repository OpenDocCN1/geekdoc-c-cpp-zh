  md: '# Preface


    This book presents four major theoretical breakthroughs in uncertainty modeling,
    which have resulted from the writer''s investigation of uncertainty modeling in
    spatial data and spatial analysis. They are (a) advances in spatial object representation,
    from determinness to uncertainty-based representation of geographic objects in
    geographic information science (GISci); (b) from uncertainty modeling for static
    spatial data to dynamic spatial analyses; (c) from uncertainty modeling for spatial
    data to spatial models; and (d) from error description of spatial data to spatial
    data quality control.


    GISci, compared to classical sciences such as mathematics or physics, is a newly
    emerged science. Its theoretical foundations have been formulated and are in a
    vital position of readiness for further development. This book intends to contribute
    to the progress of one fundamental area of GISci—data quality and uncertainty
    modeling for spatial data and spatial analyses.


    GISci covers the following fundamental areas: (a) space and time, (b) data quality
    and uncertainty, and (c) spatial analysis. Of these three, data quality and uncertainty,
    area (b) is considered both independently and also in relation to areas (a) and
    (c).


    There are two types of geographic entities and phenomena in the real world: the
    precise and the uncertain. Cognition and representation of space and time, area
    (a), is considered not only in relation to precise spatial objects, but also in
    relation to uncertain spatial objects. Uncertainty in spatial representation is
    unavoidable, as it is not possible to represent the infinite natural world in
    a finite way. All measurements contain a certain degree of error, no matter how
    high the accuracy of modern measurement technologies. Thus, it is to be expected
    that the infancy of GISci, the currently used approaches must have the potential
    for further development to encompass uncertain-based approaches in cognition and
    representation of space and time.


    Uncertainty modeling and quality control are two key issues in (b). Uncertainty
    modeling depicts the error in spatial data, and uncovers the nature of uncertainty
    distribution. Quality control aims to control the overall quality of spatial data,
    with the possibility of reducing the spatial error to a desired level.


    Spatial analysis in GISci area is (c), likewise, not uncertainty free. Uncertainty
    in source data and limitations of spatial analysis models may propagate, or any
    original uncertainties may become amplified. The quality of a decision, based
    on a spatial analysis, is affected by the quality of the original data, the quality
    of the spatial analysis model, and the degree of uncertainty that is propagated
    or generated in the spatial analysis.


    A framework for handling uncertainties in spatial data and spatial analyses is
    outlined in this book. Covered are uncertainties in the real and natural worlds,
    uncertainties in the cognition of natural objects, modeling errors in spatial
    object measurement, modeling uncertainty in spatial models, uncertainty propagation
    in'
