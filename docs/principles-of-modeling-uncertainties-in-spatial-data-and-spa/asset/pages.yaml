    B’ and C’. Finally, using a linear interpolation on E’ and F’, the elevation at
    point O is yielded. This is called the bilinear interpolation. Biquadratic interpolation
    has the eight-term and the nine-term expressions in Equations 8.6 and 8.7, respectively:


    ```

    z=a_{00}+a_{10}x+a_{01}y+a_{20}x^{2}+a_{11}xy+a_{02}y^{2}+a_{21}x^{2}y+a_{12}xy^{2}
    (8.6)

    ```


    and


    ```

    z=a_{00}+a_{10}x+a_{01}y+a_{20}x^{2}+a_{11}xy+a_{02}y^{2}+a_{21}x^{2}y+a_{12}xy^{2}+a_{22}y^{2}
    (8.7)

    ```


    In both expressions, the polynomial coefficients are derived from their closest
    DEM vertices and the four midpoints of the individual grid edges enclosed by the
    four vertices. Bilinear and bicubic interpolations are the most widely used algorithms
    in DEM generic. Bicubic interpolation has two forms: the 12-term and the 16-term
    bicubic interpolations. Their expressions are


    ```

    z=a_{00}+a_{10}x+a_{01}y+a_{20}x^{2}+a_{11}xy+a_{02}y^{2}+a_{30}x^{3}\na_{21}x^{2}y+a_{12}xy^{2}+a_{03}y^{3}+a_{31}x^{3}y+a_{13}xy^{3}
    (8.8)

    ```


    and


    ```

    z=a_{00}+a_{10}x+a_{01}y+a_{20}x^{2}+a_{11}xy+a_{02}y^{2}+a_{30}x^{3}\na_{21}x^{2}y+a_{12}xy^{2}+a_{03}y^{3}+a_{31}x^{3}y+a_{22}x^{2}y^{2}\na_{13}xy^{3}+a_{23}x^{2}y^{3}+a_{33}x^{3}y^{3}
    (8.9)

    ```


    The coefficients of the 12-term polynomial are derived from the elevations at
    the four grid cell vertices, together with the first two derivatives (z’ and z’).
    These derivatives express the surface slope in the x and y directions. For the
    coefficients of the sixteen-term polynomial, one additional derivative (z’’),
    representing the slope in both x and y directions, is required. To have a smooth
    DEM surface, the biquadratic interpolation is the minimum-order interpolation.
    The three derivatives, for instance, can be estimated based on central difference
    approximations.


    Piecewise bicubic interpolation estimates the coefficient of the polynomial based
    on DEM vertices and does not require a derivative estimation. It has the form:


    ```

    {z_{x}=a+bx+cx^{2}+dx^{3}\nz_{y}=a+by+cy^{2}+dy^{3}} (8.10)

    ```


    This interpolation algorithm yields a continuous DEM surface, but the generated
    DEM edge may not be smooth.'
