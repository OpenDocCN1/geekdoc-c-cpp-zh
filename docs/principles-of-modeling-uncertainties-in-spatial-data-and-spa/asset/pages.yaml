    ```\n\nwhere the coefficients $a_{ij}$ ($i, j = 0, 1, 2, 3$), are calculated by\
    \ solving the linear equation with the values of the nodes on the DEM. An alternative\
    \ method to obtain the bicubic interpolation is to perform the bicubic interpolation\
    \ along the $x$- and $y$-axes, respectively.\n\n# 8.5.1.1  Two-Dimensional Cubic\
    \ Interpolation\n\nThe two-dimensional cubic interpolation is similar to the bilinear\
    \ interpolation. The former method, however uses a cubic polynomial for the interpolation,\
    \ whereas the bilinear interpolation is based on a linear polynomial. Let $A$\
    \ and $B$ be two points with coordinates $A(x_0, h_0)$ and $B(x_1, h_1)$, and\
    \ let their first derivatives be denoted by $h'_0$ and $h'_1$. The two-dimensional\
    \ cubic interpolation is as follows:\n\n```\n$H_3(x) = \\left(1-2\\frac{x-x_0}{x_1-x_0}\r\
    ight)\\left(\\frac{x-x_1}{x_0-x_1}\right)^2 h_0+\\left(1-2\\frac{x-x_1}{x_1-x_0}\r\
    ight)\\left(\\frac{x-x_0}{x_0-x_1}\right)^2 h_1 \\quad (8.43)$\n$+(x-x_0)\\left(\\\
    frac{x-x_1}{x_0-x_1}\right)^2 h'_0+(x-x_1)\\left(\\frac{x-x_0}{x_1-x_0}\right)^2\
    \ h'_1$.\n```\n\nThe Equation 8.43 satisfies two conditions:\n\n```\n$H_3(x_i)=h_i$,\n\
    $H'_3(x_i)=h'_i, \\quad i=0, 1. \\quad (8.44)$\n```\n\nFigure 8.6 shows the cubic\
    \ interpolation on the two points.\nIn general, the values of $h'_0$ and $h'_1$\
    \ are unknown. They have to be estimated based on known data. One common method\
    \ for this estimation is as follows\n\n```\n$h'_0=\\frac{h_1-h_0}{x_1-x_0} \\\
    quad (8.45)$\n```\n\nand\n\n```\n$h'_1=\\frac{h_1-h_0}{x_1-x_0} \\quad (8.46)$\n\
    ```"
