    # 17.4 SUMMARY AND COMMENT


    The Web service, one of the latest developed Web technologies, has been adopted
    for disseminating the quality information on spatial data and spatial analyses.
    Based on the technology, the Web Services-Based Spatial Data Quality Information
    System, designed by the author, has been developed for delivering two types of
    quality information: spatial analyses (buffer and overlay), and (a) numerical
    information on the quality of spatial data (point, line, and area objects) and
    (b) visual representation of quality information. DQIS can be further extended
    in the following three areas: (a) covering attributes, logic consistency, completeness
    aspects of data quality; (b) handling complex geoanalysis based on geostatistics;
    and (c) being extended as a generic metadata information service system.'
