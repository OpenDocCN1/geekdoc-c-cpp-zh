    is given by


    ```

    $\mu_z = [\mu_{x_z}, \mu_{y_z}]^T = [(1-t)\mu_{x_1} + t\mu_{x_2}, (1-t)\mu_{y_1}
    + t\mu_{y_2}]^T.\quad(4.71)$

    ```


    A spectral analysis of the matrix then equals


    ```

    $\Sigma_{z_{zr}z_{zr}} = S\Lambda S^T = [S_{r_1} \quad S_{r_2}] \begin{bmatrix}
    \lambda_{r_1} & 0 \ 0 & \lambda_{r_2} \end{bmatrix} \begin{bmatrix} S_{r_1}^T
    \ S_{r_2}^T \end{bmatrix}\quad(4.72)$

    ```


    where $\Lambda$ is the spectral matrix constructed by the eigenvalues $\lambda_{r_1}$
    and $\lambda_{r_2}$ of the matrix $\Sigma_{z_{zr}z_{zr}}$; $S$ is a standardized
    orthogonal matrix being composite of the eigenvectors $S_{r_1}$ and $S_{r_2}$,
    corresponding to the eigenvalues $\lambda_{r_1}$, and $\lambda_{r_2}$, respectively.
    The semiaxes and the direction to the major axis of the error ellipse for an arbitrary
    implicit point on the line segment are expressed as


    ```

    $\begin{aligned} A_r^2 &= \sigma_{x_r}^2\lambda_{r_1} = [\sigma_{x_r}^2 + \sigma_{y_r}^2
    + \omega]/2 \ B_r^2 &= \sigma_{y_r}^2\lambda_{r_2} = [\sigma_{x_r}^2 + \sigma_{y_r}^2
    - \omega]/2. \ \tan(2\phi_r) &= 2\sigma_{x_r}\sigma_{y_r}/[\sigma_{x_r}^2 - \sigma_{y_r}^2]
    \end{aligned}\quad(4.73)$

    ```


    where


    ```

    $\omega = \sqrt{(\sigma_{x_r}^2 - \sigma_{y_r}^2)^2 + 4\sigma_{x_r}^2\sigma_{y_r}^2}$

    ```


    By varying $t \in(0,1)$, infinitely many error ellipses of individual implicit
