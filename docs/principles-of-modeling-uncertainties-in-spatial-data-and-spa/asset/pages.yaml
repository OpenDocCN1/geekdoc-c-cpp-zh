  md: '# Introduction


    describe imprecision—one type of uncertainty. Fuzzy set theory is used to assess
    two different uncertainty categories. It has been demonstrated that fuzzy measures
    can be used to describe vagueness, whereas ambiguity can be quantified by discordance
    measures, confusion measures, and nonspecificity measures. A measurement of information
    was introduced by Hartley in 1928 (known as Hartley''s measure) to describe ambiguity
    in a crisp set. Shannon''s entropy measures uncertainty in information theory,
    based on the probability theory. Fuzzy topology theory is used to model uncertain
    topologic relationships between spatial objects (Liu and Shi, 2006).


    # 1.1.2 THE CONCEPT OF ERRORS


    In many cases, error is used as a synonym for uncertainty. However, it should
    be realized that the concept of error is, in fact, narrower than uncertainty.
    Unlike error, uncertainty is a neutral term. Uncertainty may be caused by mistakes,
    and it may also be caused by incomplete information. In this book, our focus is
    on uncertainty/error modeling for spatial data. Error in measurements of spatial
    data can be quantified by statistical deviation, the instability of the observer,
    limitations of measurement instruments, and unfavorable observation conditions—the
    major sources of error in the spatial data capture process. Errors of measurement
    normally be classified as: (1) random error, (2) systematic error, and (3) gross
    error.


    # 1.1.2.1 Random Error


    When a set of measurements is obtained under the same conditions, and the measures
    contain irregular errors in terms of magnitude and sign, these irregular errors
    are known as random measurement errors. Random errors are due to occasional factors
    affecting the measurement instrument, such as a change in the measurement environment.
    It is difficult to estimate the level of effect on the measured value of each
    occasional factor because of the irregular error pattern. Although the random
    errors affect the measured value by change, the error pattern has certain statistical
    characteristics if the measurement number is large.


    # 1.1.2.2 Systematic Error


    After performing a series of measurements under the same conditions, it may be
    noticed that the magnitude and type of error in the measurements follow a regular
    pattern. This type of error is called systematic error. Systematic error may be
    due to the performance error of measurement equipment. Systematic error can be
    potentially eliminated by improving measurement equipment performance or by removal
    of the error (if observed) in the later data processing process.


    The impact of systematic error on measurement results is normally larger than
    that of random error. Thus, as far as possible, there is a need for the complete
    elimination of systematic error. Common methods of reducing systematic error include:
    (a) calibrating the measurement instrument, (b) adding a correction number to
    the measurements in the data processing process, and (c) using a more appropriate
    measurement method to avoid or reduce the chance of generating systematic error.'
