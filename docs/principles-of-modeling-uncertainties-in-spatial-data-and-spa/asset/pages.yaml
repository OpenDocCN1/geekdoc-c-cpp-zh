    # 3.2.3.4 Median and Mode


    When a m satisfies both Pr(X \leq m) \geq 1/2 and Pr(X \geq m) \geq 1/2, this
    value is called the median of a random variable X. It has the following properties:


    ```

    Pr(X \leq m) \geq Pr(X > m)

    Pr(X \geq m) \geq Pr(X < m)

    ```


    A value of x that maximizes the probability Pr(X = x) is called the mode of the
    distribution of the random variable X.


    # 3.2.3.5 Covariance and Correlation Coefficient


    Suppose the expectation and the variance of random variables X_1 and X_2 exist,
    then there exists the covariance, denoted by \sigma_{X_1,X_2} or Cov(X_1,X_2),
    of these two variables is given as


    ```

    \sigma_{X_1,X_2} = E[(X_1 - E(X_1))(X_2 - E(X_2))].

    ```


    The correlation coefficient of X_1 and X_2 is defined by the covariance of X_1
    and X_2 dividing by the standard deviations of X_1 and X_2


    ```

    \rho_{X_1,X_2} = \frac{E[(X_1 - E(X_1))(X_2 - E(X_2))]}{\sqrt{Var(X_1)}\sqrt{Var(X_2)}}

    ```


    where \rho \in [-1,1].


    # 3.2.4 Laws of Large Numbers and Central Limit Theory


    # 3.2.4.1 Laws of Large Numbers


    In probability theory, various theorems are known as the laws of large numbers.
    These theorems are usually classified into two major categories: weak laws and
    strong laws. Both laws concern bounds on sample size, accuracy of approximation,
    and degree of confidence. The weak laws deal with limits of probabilities involving
    the sample mean, while the strong laws deal with probabilities limits of the sample
    mean.


    Bernoulli''s law states that a large number of events for a random experiment
    will have population statistics. Suppose that the relative frequency of an event
    equals m/n in n experimental trials. This relative frequency approaches to the
    probability p of the event A in the sense that for any positive real number \epsilon


    ```

    \lim_{n\to\infty} Pr|\frac{m}{n} - p| < \epsilon| = 1.

    ```'
