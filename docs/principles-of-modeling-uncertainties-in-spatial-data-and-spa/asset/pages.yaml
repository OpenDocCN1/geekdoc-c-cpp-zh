    The above confidence region models enable the description of the positional uncertainty
    in spatial features in two- and three-dimensional GIS, and even in a four-dimensional
    spatio-temporal GIS. The models are defined under assumptions that the positional
    error at composite points of a spatial feature is independent and normally distributed.


    Introduced in the following section is an model for lines where errors of composite
    points can be correlated, instead of assuming that the error of the composite
    points of a line feature is independent.


