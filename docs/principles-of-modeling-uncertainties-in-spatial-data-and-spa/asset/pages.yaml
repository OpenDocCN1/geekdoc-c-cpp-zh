    # 8.5.2.3 Error Measure for the Bicubic Interpolation


    In early studies, it was proved that the average error in the linear interpolation
    was


    $$\sigma_{H}^2 = \frac{4}{9}\sigma_{node}^2.\quad (8.70)$


    This equation is identical to Equation 8.69. Therefore, Table 8.2 can be updated
    as Table 8.2a, as follows,


    Combining (a) the average elevation error (4/9a) result in a regular grid DEM,
    generated from the bicubic interpolation in this subsection, and (b) the surface
    error (0.8a) revealed in early studies, it can be concluded that the bicubic interpolation
    not only has a higher surface accuracy but also a higher DEM accuracy. This includes
    both surface accuracy and elevation accuracy. In general, a DEM model generated
    from the bicubic interpolation is more accurate than that from the bilinear interpolation.
    This was also proved by Kidner (2003), who found that the former was 20% more
    accurate than the latter.


    # 8.5.2.4 A Note


    The average elevation accuracy can be estimated by Formula 8.69, for a regular
    grid DEM generated from the bicubic interpolation.


    +   - Since the average elevation accuracy in each regular grid is identical,
    the average elevation accuracy calculated by Equation 8.69 is in fact equal to
    the entire DEM model, rather than for a single point.

    - The average elevation accuracy is invariant with locations of the nodes in the
    DEM.

    - The accuracy of a single interpolated point can be estimated by the Equation
    8.55, depending on the location of the point.


