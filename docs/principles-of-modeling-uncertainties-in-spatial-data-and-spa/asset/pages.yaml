    shows the result of incomplete information or knowledge.


    # 3.6.3.2 Topological Characteristic


    Based on the R-lower and the R-upper approximations, four basic classes of rough
    sets are given as:


    +   1. Set X is roughly R-definable if $R_*(X) = \emptyset$ and $R^*(X) = U$.

    2. Set X is internally R-indefable if $R_*(X) \neq \emptyset$ and $R^*(X) \neq
    U$.

    3. Set X is externally R-indefable if $R_*(X) = \emptyset$ and $R^*(X) = U$.

    4. Set X is totally R-indefable if $R_*(X) = \emptyset$ and $R^*(X) = U$.


    The meaning of this classification is obvious. If X is roughly R-definable, it
    can be decided on which elements of U belong to X or -X. An internal R-definable
    set X means a decision can be made regarding which elements of U belong to -X
    which elements belong to X cannot be decided. When X is externally R-indefable,
    the elements of U that belong to X can be totally decided, but the elements which
    belong to -X cannot be decided. If X is totally R-indefable, the elements of U
    that belong to X cannot be decided


    The above classification yields the following propositions:


    +   1. The three statements: “X is roughly R-definable,””“X is totally R-indefable,”
    and “-X is R-definable” are equivalent to the statement “X is R-definable.”

    2. “-X is internally (or externally) R-indefable” is equivalent to “X is externally
    (or internally) R-indefable.”


    The accuracy of approximation and the classification of rough set are two ways
    which rough sets can be depicted, each having different meanings with their relationship.
    The numerical characteristic of a rough set represents its boundary size, but
    does not account for the boundary structure. Topological characteristics of the
    rough set do not provide information about the boundary size of the rough set
    but provide information about the boundary structure. As indicated above, the
    ways of depicting a rough set are interrelated. When a set is internally or totally
    indistinguishable, its accuracy measure is 0. When a set is externally or totally
    indistinguishable, the accuracy measure of the complement the set is 0. From these
    two cases, it is clear that the accuracy measure of a rough set cannot entirely
    determine its topological structure. Knowledge of the topological set of a rough
    set also does'
