    for an integrated adjustment to ensure that the common vertices and boundaries
    of correlated parcels are moved simultaneously. Therefore, the topologies between
    parcel polygons remain unchanged.


    In the integrated adjustment algorithm for parcels, two object types are defined:
    PolygonStruct and CombinedPolygonStruct. The PolygonStruct includes parcel number,
    registered parcel area, digitized parcel area, error limit of the area adjustment,
    "parcels with holes" "yes" or "no", the total number of points contained in a
    parcel, and the coordinate observations of each vertex. The CombinedPolygonStruct
    typed contains all the vertices that constitute the adjustment.


    According to the digitized-enrolled parcels and constraints, conditional equations
    are constituted. Coefficients, $a_i, b_i, a_{ij}, b_{ij}, s_{ik},$ and $s_{ij}$
    are computed over the observations of the vertex coordinates in the parcels to
    which they belong. They are computed via the iterative computing process of the
    least square conditional. The corrective value of the digitized coordinate observations
    of parcel vertices and corresponding adjustment values are then adjusted. The
    consistency between digitized parcel areas and registered areas is warranted.


    +   4. Area adjustment of multiple parcels with fixed points and parcels

    It may happen that several parcels or parcel vertices have a higher positional
    accuracy than the rest of the parcels or vertices. For instance, the parcels with
    number 9 and 10 in Figure 12.3, and all the vertices along the boundary of the
    parcels have a higher positional accuracy than those of the other parcels and
    vertices. These fixed points and parcels should not be adjusted or moved during
    the area adjustment for the overall parcels in the region. The area adjustment
    method for the cases with fixed points or parcels should be carried out, based
    on the above method (3), with the following conditional equations:


    ```

    $$\begin{cases} v_{s_i} = 0 \ v_{s_j} = 0 \end{cases} (i = 1, 2, ..., n_0), \quad
    (12.41)$

    ```


    where $n_0$ is the total number of the fixed parcels and fixed points.


    +   5. Sequential area adjustment of multiple parcels with a large data volume

    When the data volume of the parcels and blocks is large, a sequential adjustment
    method for multiple parcels is proposed. This method is a further development
    based on the solutions (3) and (4).


    In a sequential adjustment of multiple parcels, the area is first divided into
    a series of adjustment regions (for example, blocks), and each region includes
    many parcels. The sequential adjustment of multiple parcels is initially applied
    to the region level—to adjust the vertices of the regions based on method (3).
    In addition, the second-level adjustment is applied to a single region by applying
    method (4), where the adjusted coordinates of the vertices are regarded as fixed
    points.'
