  md: '# # 15 Visualization of Uncertainties in Spatial Data


    Valuable information has been gained from the rigorous procedures involved in
    the creation and analysis of uncertainty models, regarding the uncertainty present
    in spatial data, spatial models, and spatial analyses. Such uncertainty information,
    for its value to be realized, has to be transferred to the final users of spatial
    data to enable a better understanding of the nature of the data quality and hence
    its appropriate utilization. Section VI (Chapters 15 to 17) of this book provides
    the methods to present spatial data quality and uncertainty information.


    This chapter presents a summary of uncertainty visualization methods, based mainly
    on the techniques in cartography, to enable the visualization of the nature of
    uncertainty in spatial data. The uncertainty level is indicated by the cartographic
    variables. Effective visualization methods enable users not only to distinguish
    the level of uncertainty in spatial data, but also to understand-spatial distribution
    of that uncertainty.


    # ## 15.1 INTRODUCTION


    As indicated in previous chapters, various uncertainties exist in spatial data
    and spatial analysis. Some of these uncertainties can be well modeled and some
    cannot; for example, uncertainty in the form of ambiguity in natural phenomena,
    and uncertainties governed by human perception and psychology so cannot be well
    modeled. Interactive visualization is a form of uncertainty modeling and is particularly
    useful in cases where uncertainties in spatial data are too complex for common
    modeling methods. By using this visualization modeling method, the uncertain nature
    of spatial data and spatial analyses, as such distribution and uncertainty quantity,
    can be more clearly presented.


    Visualization approaches have been developed for different purposes, audiences,
    and levels of interactivity. These approaches, which can be classified into static
    mode and dynamic mode (Goodchild et al., 1994), have application potential for
    visualizing uncertainties in spatial data and analyses. The static mode refers
    to the conventional cartographic display that presents static snapshots of uncertainty
    information in data surfaces and objects. Uncertainty is then represented by utilizing
    the graphical'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 328 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    variables, which include size, value, texture, color, orientation and shape, and
    location in space (Bertin, 1983).


    In the representation of uncertainty information, any figure can vary in one of
    the graphical variables. That figure can be expressed in the form of a geometric
    object, such as a column of membership values, and others. In the following sections,
    several static methods for displaying uncertainty information are presented. They
    include the error ellipse method, the arrow representation method, the gray-scale
    map method, the color map method, a three-dimensional representation method, and
    the symbol-based method.


    As indicated above static cartography is applicable for the representation of
    uncertainties in spatial data. In this context, the manipulation of time is also
    conceived to be a cartographic variable. Temporal data have been treated in the
    past as an attribute to be mapped in the form of duration or location in relation
    to a specific time period (MacEarthy, 1994). By integrating regional static maps
    over time period, a dynamic and animated visualization, known as dynamic cartography,
    can be formed. Uncertainty in dynamic spatial analysis is thus represented. The
    methods where uncertainty information is displayed in an animated form are presented
    and described in the sections below.


    Both static and dynamic cartographic representations are visual methods. However,
    these visual methods can possibly complicate or degrade maps embedded with uncertainty
    information. Fisher (1994a) proposed the additional use of sound to represent
    cartographic uncertainties in an attempt to alleviate such potential problems.


    # 15.2 ERROR ELLIPSE APPROACH


    In surveying, geodesy, and engineering surveys, an ellipse is used to depict positional
    error of a point, two-dimensionally. This ellipse, known as the error ellipse,
    is established around the error point to indicate precision regions of different
    probabilities. The orientation of the error ellipse (relative to the Cartesian
    coordinate system) depends on the correlation between errors in x and y directions
    in that ellipse (Figure 15.1).


    ![](img/978c1925ca93296ea7a944399abc8952_355_0.png)


    FIGURE 15.1 An example of error ellipse method.'
