  md: '# Sources of Uncertainty in Spatial Data and Spatial Analysis


    # 2.2 UNCERTAINTIES INHERENT IN THE NATURAL WORLD


    The natural world is complex, huge, and nonlinear. Objects in the natural world
    can be described as spatial entities in GIS in the dimensions of space, time,
    scale, attributes, and relationships (a detailed description is given in Chapter
    1). Spatial entities described in these dimensions possess uncertainty. In the
    space dimension, for example, spatial entities may not have determined, distinct,
    or easily identified boundaries. The boundaries are unlikely to be crisp, but
    are of a transition zone with a gradual change in class types, as forest and grassland.


    In the attribute dimension, the characteristics of a satellite image are determined
    by the corresponding substance component in the real world. Spectrum characteristics,
    appearing in a remotely sensed image, are used to classify the image covering
    different substances. In theory, one type of substance should possess a unique
    spectrum line. Therefore, a specific spectrum in a satellite image should respond
    to a class on the ground. In reality, however, the same substance may exhibit
    a different spectrum. Hence, the same substance in a satellite image may correspond
    to a different classification in the natural or real world. This leads to misclassification
    because the existence of substance uncertainty; the spectrum performance of the
    same substance is not unique.


    In the scale dimension, feature measurement results in the real world are uncertain
    and in accordance with the scale in which they have been measured. The measurement
    of identical objects in the real world, using the same measurement technology
    but at a different scale level produces different measurement results. In the
    example given in Chapter 1, the length of the coastline of China was measured
    to 14,000 km in the scale of 1:100,000, but measured to 18,000 km in the scale
    of 1:500.


    Uncertainty, as well as in spatial data dimensions in GISci, also exists in other
    disciplines. For example, the interface between the media of different gasses
    and water is dynamic and protean, and the boundary between them is uncertain.
    Vegetation distributions of different botanical classes in different climates
    change gradually within a vague boundary. In the natural world, the spatial entities
    associated with the ecological environment may not have a crisp boundary, because
    of uncertainty in the spatial distribution of the ecological environment.


    Uncertainty also exists in regional studies, for example, the boundary between
    an urban region and the neighboring region or its adjoining area boundary as found
    in the Pearl River delta of China. There is a gradual transition from one zone
    to another without a distinct boundary evident. This causes vagueness and uncertainty.


    The ubiquity of uncertainty in biology is seen in species evolution and degeneration,
    gene variance, and population tides. According to Charles Darwin''s theory of
    evolution, biological evolution is caused by "descent," "variation," and "natural
    selection." Descent gives rise to the existence of species and forms a basis of
    biological evolution, and at the same time guarantees certain and specific common
    characteristics. However, any two examples of that species may have tiny variations.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '18 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    These variations are due to random genetic mutation and form the basis of discrimination,
    subsequently providing a condition for biological evolution. Without random genetic
    mutations, no species could evolve. Natural selection determines the evolution
    of a particular species, by enabling "descent" and "variation." This, over long
    periods of time, can result in the evolution of a more complex higher-level species
    or, conversely, extinction. However, such biological evolution is full of uncertainty
    and affected by random factors, and therefore does not completely develop according
    to a predefined pattern.


    # 2.3 UNCERTAINTY RESULTING FROM HUMAN COGNITION LIMITATIONS


    Geospatial cognition is an essential first step in spatial data capture in GIS.
    As indicated above, the real world is complex, and the level of human cognition
    of this world is still at a preliminary stage, both recognizing knowledge and
    the methodologies employed to gain further understanding. Hence, probably only
    small portion of the real world is far recognized and understood.


    Currently, only relevant spatial features are selected, measured, and represented
    owing to the current limited information-handling ability of GIS, as well as the
    complexity of spatial entities in the real world. The selected spatial features
    are measured by available measurement technologies. The measurement results, which
    are in fact an abstraction and approximation of the spatial features in the real
    world, can be represented in a spatial database in GIS. These approximations are
    in accordance with the restrictions of human cognition ability. They are not a
    full and complete description. Therefore, representations in a spatial database
    are less detailed and approximations of the whole object set in the real world.
    In such cases, the uncertainty of the spatial entities, represented in the spatial
    database in GIS, can be due either to classification uncertainty or spatial sampling
    limitations in the cognition of the spatial objects. For instance, the surety
    that a shrub class object, acquired from a classification of remotely sensed images,
    is indeed a shrub area, is in fact, 100% sure. This is because of insufficient
    evidence from the satellite image or because of limitations of the applied image
    classification method. Such uncertainties are a result of cognition inadequacies.


    # 2.4 UNCERTAINTY RESULTING FROM MEASUREMENT


    # 2.4.1 SPATIAL DATA


    As described in Section 1.3.1 of Chapter, spatial data are used to describe spatial
    objects in dimensions of time, scale, attribute, and relationships. The object
    in a space dimension can be uniquely determined by the coordinates of the object
    in a specified coordinate system. The attribute of an object can be specified
    by the class of the object or an attribute value; the object in a time dimension
    can be depicted by its valid period, that is defined by the starting time and
    ending time of the object. The relationships between spatial objects can be described
    based on topology or fuzzy topology theory.'
