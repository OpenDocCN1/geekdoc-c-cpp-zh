    # 9.3.2 SIMULATION APPROACH


    To avoid the limitation of the analytical model, the uncertainty indicators are
    now estimated with a simulation technique. In the simulation approach, positional
    uncertainty of the source polygons is simulated, based on the assumption of uncertainty
