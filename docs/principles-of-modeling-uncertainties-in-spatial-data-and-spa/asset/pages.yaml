    # 3.7.2 Amount of Self-Information


    From the definition of the information amount, the received information amount
    equates to the uncertainty removed upon the revelation of the outcome in magnitude.
    Suppose the outcome of the information source emitted is $a_i$, for example, due
    to noise in data transmission, the information received may be different from
    $a_i$. Let $b_j$ be the information received by $a_i$. The information amount
    of $a_i$, extracted from $b_j$ (or the amount of uncertainty removed upon revealing
    the outcome) is expressed as


    ```

    $I(a_i;b_j) = [\text{uncertainty in } a_i, \text{ before } b_j, \text{ is received}]
    \\n - [\text{uncertainty in } a_i, \text{ after } b_j, \text{ is received}]. \\quad
    (3.134)

    ```


    Without noise in the process of data transmission, an outcome $a_i$ of the information
    source will be propagated through the process without uncertainty. The amount
    of self-information is then given by


    ```

    $I(a_i) = 1(a_i;a_i) \\n = [\text{uncertainty in } a_i, \text{ before } a_i, \text{
    is received}]. \\quad (3.135)

    ```


    This expression shows that the issue of assessing information contained in $a_i$
    is converted to assessing the uncertainty in $a_i$. In Section 3.5, it is mentioned,
    that uncertainty and possibility are interrelated when possibility can be described
    by probability. It is thus reasonable to consider self-information $I(a_i)$ contained
    in an outcome $a_i$ as a prior probability function $p(a_i)$ of $a_i$; for $i
    = 1, 2, ..., r$,


    ```

    $I(a_i) = f[p(a_i)]. \\quad (3.136)

    ```'
