    # 7.2.2 TOPOLOGICAL RELATIONSHIPS BETWEEN SPATIAL OBJECTS


    Topological relations become more complex under uncertain situations, because
    spatial objects K consist of the three components which are the RK, crust BK,
    and exterior EK. Meanwhile, the relationship between EK and the other components
    can be determined by the relationship between RK and BK due to the existing relationship
    $RK\cup BK=EK=\Gamma$, if so, $EK=\Gamma - RK\cup BK$. The topological relationship
    between any two objects $K_1$ and $K_2$ can be concisely represented as one of
    the 13 basic relations:


    +   1. The disjoint relation


    $<K_1, disjoint, K_2> \Leftrightarrow (K_1\cap K_2=\emptyset)$.


    +   2. The meet relation


    $$(RK_1\cap RK_2=\emptyset) \wedge (BK_1\cap BK_2\neq\emptyset) \wedge (RK_1\cap
    BK_2=\emptyset) \wedge (BK_1\cap RK_2=\emptyset).$$


    +   3. The nearly meet relation


    $<K_1, nearly meet, K_2> \Leftrightarrown$(RK_1\cap RK_2=\emptyset) \wedge(BK_1\cap
    BK_2\neq\emptyset) \cup(BK_1\cap RK_2)\neq\emptyset$.'
