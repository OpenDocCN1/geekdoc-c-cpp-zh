  md: '# Modeling Integrated Positional and Attribute Uncertainty


    land cover type for a parcel using multiple data sources, it can be concluded
    from remote sensing data that the parcel is forest, while from other data sources,
    it can be concluded that the parcel is not forest. In such a case, an uncertainty
    expression that covers the range of both the positive and negative beliefs—for
    example, [-1, 1)—is needed. But, the probability value is [0, 1] and cannot be
    applied to solve this type of problem. The certainty factor model, which can overcome
    this constraint, is thus introduced.


    # 6.5 CERTAINTY FACTOR-BASED SOLUTION


    For solving the integration of positional and attribute uncertainties, the certainty
    factor model with probabilistic interpretation, developed by Heckerman (1986)
    and based on the original definition of the certainty factor, is adopted. The
    certainty factor model was used in MYCIN, an expert system used in medical diagnosis
    (Shortliffe and Buchanan, 1975) for uncertainty-based reasoning. In the following,
    the certainty factor model and its probabilistic interpretation are described.
    The adoption of the model for dealing with the problem at the beginning of this
    section is then described.


    # 6.5.1 THE MYCIN CERTAINTY FACTOR


    The MYCIN certainty factor model is a reasoning method for managing uncertainty.
    The basic goal is to provide a method for handling uncertainty that avoids the
    requirement of large amounts of data and the intractability of computation in
    general probabilistic reasoning.


    MYCIN''s knowledge is stored as rules in the form: IF {evidence} THEN {hypothesis}.
    In medical science, relationships between evidence and hypothesis are often uncertain.
    The "certainty factors" are used to accommodate these nondeterministic relationships.
    A certainty factor, which represents the change of belief in a hypothesis based
    on given evidence, is attached to each rule. The certainty factor range is between
    -1 and 1. Positive numbers correspond to an increase in belief in a hypothesis,
    whereas negative numbers correspond to a decrease in belief. It is important to
    note that certainty factors do not correspond to measures of absolute belief.

    The following notation represents a rule:


    ```

    E \rightarrow CF(H,E) \rightarrow H

    ```


    where H is a hypothesis, E is evidence relating to the hypothesis, and CF(H, E)
    is the certainty factor attached to the rule.


    There are at least two views on probability: the objective and the subjective.
    In the objective interpretation, a probability is regarded as a multitested average
    value, and in the other, the so-called subjective interpretation, a probability
    is considered as a measure of reliability. The certainty factor is defined according
    to the subjective interpretation of probability (Shortliffe and Buchanan, 1975).


    The certainty factor CF (H, F) expresses the reliability change in hypothesis
    H based on the evidence E. The definition of CF (H, E) is'
