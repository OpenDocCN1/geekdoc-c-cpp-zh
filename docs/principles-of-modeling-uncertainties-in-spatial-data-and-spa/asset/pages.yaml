    # 5.2.5 THE INCIDENCE OF DEFECTS METHOD


    The incidence of defects method is proposed for evaluating spatial data quality
    regarding attribute uncertainty in GISci (Shi et al., 2002). The defect rate is
    defined as the ratio between the number of spatial objects with defects and the
    total number of spatial objects in the unit. The unit can be a map or a layer
    of spatial objects, as the total number of buildings in the building layer of
    the whole area. Although the incidence of defects method is proposed for modeling
    attribute uncertainty, it can also be used to model other types of uncertainties,
    such as incompleteness and logical consistency.


    The stratified sampling technique is adopted for sampling, and the defect rate
    is computed for assessing the attribute quality. This is due to the considerations
    that most of the existing spatial data are conceptually and physically modeled
    in layers. Attribute uncertainty of one layer may be different from that of the
    others. For example, attribute accuracy for a “building” layer may be different
    from that of a “vegetation” layer. The stratified sampling strategy is thus recommended.


    Depending on the uncertainty level, defects are classified into three classes:
    minor defect (minor_def), moderate defect (moderate_def), and serious defect (serious_def).
    Defects are counted by number. For example, there may be one serious defect and
    20 minor defects for a map sheet in terms of attribute uncertainty. In the following,
    the mathematical description of the incidence of defects method is


    The population of a spatial data to be inspected is N. If one unit (such as a
    layer of spatial data) is treated as an inspected unit, the overall population
    is the sum of the populations of each data unit. Sampling size, the overall sampled
    volume for the examination, is n. If a single unit is considered as an inspected
    unit during the examination, the sampling size is the sum of sampling sizes of
    all the data units.


    Let the population of attribute data set $X$ be $N$, sampling (without the replacement)
    is applied to the data unit. There are $m$ times sampling. The sample size for
    each sampling time is $n$. The numbers of defects obtained from the sampled inspection
    are $y_i$ ($i = 1, 2, \dots, m$), with the following equation


    ```

    $Y_i = W_{SD\_b} \cdot minor\_def + W_{SD\_b} \cdot moderate\_def + W_{SD\_c}
    \cdot serious\_def, \quad (5.15)$

    ```'
