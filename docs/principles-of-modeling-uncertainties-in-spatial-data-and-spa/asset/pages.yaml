  md: '# 12 Quality Control for Object-Based Spatial Data


    The aim of spatial data quality control is to limit or even reduce overall spatial
    data uncertainty. Methods for describing uncertainties in spatial data have been
    given in the previous chapters. Examples provided include the methods for modeling
    positional uncertainty (Chapter 4) and the methods for modeling uncertainty (Chapter
    5). Both these chapters are introduced in Section II of this book. A further theoretical
    development beyond the uncertainty description is the creation of methods for
    controlling the quality of spatial data. These methods are introduced in Section
    V, and are found in Chapters 12 to 14.


    A new systematic strategy for controlling the present quality of object-based
    spatial data is proposed and presented in this chapter. Cadastral data, which
    requires high-quality standards, are highly representative object-based data in
    GIS and are appropriate for use as an example when exploring and developing methods
    for spatial data quality control for object-based spatial data. A land parcel
    is used as a base upon which data inconsistencies are solved, using least square
    adjustments.


    The strategy involves three steps. Firstly: to constitute the adjustment equations,
    the registered parcel area is taken as the true value and the digitized vertex
    coordinates are taken as observations with random error. Secondly, both the registered
    area and the digitized vertex coordinates are held as observations with random
    error. The weights of these two observation types are estimated by the variance
    components method. Thirdly, the scale factor is added to the adjustment model
    for handling systematic error due to scale error in the land parcel area.


    # 12.1 INTRODUCTION


    In cadastral information systems, land parcels are represented by polygons. The
    values of parcel areas are usually taken from the following two sources: (a) the
    registered area value of a land parcel measured on the ground or from descriptive
    documents—the registered land parcel area that has legal authority—and (b) the
    calculated area value from the digitized vertex''s coordinates of the land parcel'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    boundary. Due to errors in the latter, the calculated parcel area in (b) normally
    has a lower accuracy, and is not a match with the value of the registered areas
    of the same land parcel. Hence, such land parcels have inconsistencies that need
    to be solved.


    Chrisman and Yandell (1988, 1989) derived a statistical model on area variances
    based on the component nodes of the polygon and their correlations. Najeh and
    Burkhard (1995) applied the adjustment method for digitizing cadastral data, with
    an emphasis on determining the weight of the observations. Merritt and Masters
    (1999) explored the determination of point coordinates from observed direction,
    distance and radius based on parametric adjustments in digital cadastral databases.


    Liu et al. (1999) proposed the use of the least square adjustment method for processing
    parcel, considering registered parcel areas as true values. Shi and Tong (2005)
    discussed that the registered parcel possesses error. Tong et al. (2005) further
    studied the scale effect on land parcels, a systematic error.


    # 12.2 ADJUSTMENT METHODS FOR AREA OBJECT ERROR PROCESSING


    # 12.2.1 CONDITIONAL EQUATIONS OF THE PARCEL AREA


    During cadastral map digitization, a land parcel is captured by digitizing its
    component boundary vertices. Due to the data capture method nature, errors exist
    in the vertex''s coordinates, and this error will propagate, for example, to the
    land parcel area. The nature of the error can be, for example, systematic, random
    error, or even gross error. To process land parcel area calculation errors, based
    on the vertex coordinates, the least square adjustment method is applied. In such
    cases, the coordinates of the vertices are regarded as observations with random
    or systematic error. A conditional adjustment method with the equations accommodates:
    the true value of a land parcel area, right angles, or arcs of land parcels in
    relation to the vertex coordinates, is proposed.


    Let $(x_i, y_i)$ $(i=1, 2, \dots, n)$ denote the digitized coordinates of the
    vertices of a land parcel boundary, and the corresponding adjustment value and
    correct values are, $(\hat{x}_i, \hat{y}_i)$ and $(v_{x,i}, v_{y,i})$, giving


    ```

    $$\hat{x}_i = x_i + v_{x,i},$\n$\hat{y}_i = y_i + v_{y,i} \quad (i=1, 2, \dots,
    n).$$

    ```


    Figure 12.1 shows a land polygon with vertices denoted $P_i$ $(i=1, 2, \dots,
    n)$. Assuming that the registered parcel area of the parcel is known as $S_o$,
    the following relationship between the registered area and the digitized coordinates
    of the vertices is:


    ```

    $$\hat{S} = \frac{1}{2} \sum_{i=1}^{n} \hat{x}_i(\hat{y}_{i+1} - \hat{y}_{i-1})
    = S_o ,$$

    ```'
