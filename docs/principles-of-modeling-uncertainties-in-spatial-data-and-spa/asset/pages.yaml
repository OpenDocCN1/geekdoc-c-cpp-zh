    Sampling size is important in the assessment of the accuracy of classified remotely
    sensed image data. Collecting ground samples is expensive; therefore, the number
    of sample points has to be kept to a minimum. However, as indicated by the work
    of such as Gendersen and Lock (1977); Rosenfield (1982); Congalton (1988); Fukunaga
    and Hayes (1979), it is important for the sampling size to be large enough to
    enable the conducted analysis to be statistically valid.


    The other important factor, as stated above, is the sampling scheme selection.
    Selection of the proper sampling scheme is critical in the generation of an assessment
    result that is representative of the whole classified image. A poor sampling scheme
    may result in significant biases, which could result in over- or underestimated
    accuracy. Five commonly used sampling schemes are simple random sampling (Cochran,
    1977), clustered sampling (Kish, 1965), stratified random sampling (Barrett and
    Nutt, 1979), systematic sampling (Barrett and Nutt, 1979), and stratified unsampled
    sampling (Berry and Baker, 1968).


    Congalton (1988) conducted simulations on diverse areas and found that in all
    cases, simple random and stratified sampling provided satisfactory results. Depending
    on the spatial auto-correlation of the area in question, other sampling schemes
    may also be appropriate. Once the sample size is selected and the sample scheme
    chosen, sampling can be practically implemented.


    # 5.2.2 Internal and External Testing


    Three approaches can be applied to determine the attribute quality statistically:
    deduction, internal testing, and external testing (Kennedy-Smith, 1986). The usual
    method for deducing attribute quality is to use survey values that have their
    quality defined by either internal or external testing.


    Internal testing is carried out by comparing several repeated measurements, with
    the average being considered the "truth." The result of internal testing is a
    precision measure in quality control.


    External testing is carried out by comparing the survey result with the truth
    or what can be treated as the truth. The result of external testing is a measure
    of accuracy. External testing represents the solution which is most satisfying
    to the "customer" (Kennedy-Smith, 1986), but it fails to separate source and procedure
    errors during data manipulation.


    When determining attribute quality using external testing, it is necessary to
    select a certain number of check points. Random sampling is advocated for the
    location of checkpoints (Hay, 1979; van Genders and Lock, 1977). Stratified random
    sampling is recommended to ensure that each class has a certain number of sampling
    points. The procedure, according to Hurd and Broer (1997), for determining attribute
    quality using external testing is shown by the following example. The aim is to
    determine the range of true map accuracy.


    +   1. Define a confidence level (e.g., 99.7%), and look up the $Z_{\alpha}$ associated
    with such a confidence level in the normal distribution table; we have $Z_{\alpha}
    = 3.0$.

    2. Determine the number ($N$) of sample (e.g., $N=200$).'
