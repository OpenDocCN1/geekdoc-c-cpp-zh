  md: '84 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    digital file of the U.S. Geological Surveys land-use and cover data. For practical
    purposes, the bandwith was determined by a statistical function of those positional
    errors on the line. The errors accumulated from the first stage to the final stage
    of spatial data capture (Chapman et al., 1997). However, this model is sensitive
    to any outlier of a line, because in this model, the true location of a line is
    supposed to be located inside the error band.


    An alternative to determine the bandwidth was suggested by Goodchild and Hunter
    (1997). The bandwith was estimated by calculating the proportion of a measured
    location of the line being within the ε-band, such that the proportion must be
    equal to, or larger than, the predefined tolerance (say, 0.95). This modified
    ε-band is a more appropriate error-band model than the previous version in terms
    of the outlier sensitivity.


    In addition to the above limitations, the existing error-band models should be
    further developed by taking the following cases into consideration: the endpoints
    of a line may not have the same error distribution. Shi (1994) proposed a confidence
    region model. In this model, the positional error at the endpoints of a line may
    follow normal distributions (Shi, 1997, 1998). This confidence region is a band
    around a measured location of the line, where the true location of a line is located,
    with a probability larger than a predefined confidence level. The confidence region
    model is described in detail in Section 4.5.


    The error bands, mentioned above, provide a feasible region that encloses the
    true location of a spatial feature. The width of each band is subject to positional
    uncertainties in the vertices of the spatial feature and a probability of the
    location of the spatial feature outside the error band.


    To obtain an error band invariant, Fan and Guo (2001), Li (2003) proposed an error
    band (H-band) for a line, using Shannon information. The bandwidth of the H-band
    is determined by the entropy coefficient, being a ratio of error entropy, to the
    standard deviation of a point on the line, or by the average error entropy.


    # 4.3 DEFINITION OF SPATIAL FEATURES IN GEOGRAPHIC INFORMATION SCIENCE


    Spatial features in GISci have different dimensions. A one-dimensional spatial
    feature is a profile of a two-dimensional spatial feature; this may be a road
    section for example. Spatial features in a two-dimensional space are commonly
    used in the GISci community: most geographic objects in GIS are stored and presented
    in a two-dimensional space. To describe geographic objects in the real world,
    a three-dimensional space is required. These three-dimensional spatial features
    contain horizontal (x- and y-coordinates) and elevation information (z values)
    about geographic objects. In addition to the spatial dimensions (including the
    x, y-, and/or z-coordinates), time is of interest. In other words, both space
    and time factors of a spatial object may be acquired, maintained, analyzed, and
    presented. This leads to spotemporal GISci which then deals with four-dimensional
    spatial features. As a generalization, spatial features can be represented in
    an n-dimensional space.'
