    # 10.4 SUMMARY AND COMMENT


    Within the framework of spatial analysis uncertainty modeling, a method for modeling
    positional uncertainty propagation in a vector buffer analysis has been presented
    in this chapter. Buffer analysis positional uncertainty is defined as the difference
    between the “true” buffer location and the measured buffer location. The buffer
    can be for spatial features of points, line segments, polylines, and polygons.
    The buffer analysis sources include positional uncertainty in vertices of the
    source spatial features and buffer width uncertainty.


    Three uncertainty indicators and corresponding mathematical models, expressed
    as multiple integrals, have been derived for describing buffer uncertainty. They
    include the error of commission, the error of omission, and the normalized discrepant
    area. These indicators are used to describe various buffer uncertainty situations.
    The error of commission and the error of omission are suitable for describing
    a situation where the “true” location and the measured location of the buffer
    overlap. The definition of these two uncertainty indicators is consistent with
    the uncertainty measures used for assessing classified images in remote sensing.
    The normalized discrepant area is used to consider that the “true” buffer location
    and the measured buffer location are mutually exclusive. The normalized discrepant
    area satisfies the conditions of algebraic distance definition. Both conceptual
    definitions for the three uncertainty indicators and the corresponding rigorous
    mathematical models have been given.


