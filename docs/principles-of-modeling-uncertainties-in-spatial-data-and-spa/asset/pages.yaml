  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 1.1.2.3 Gross Errors


    Gross errors are mistakes made during measurement or data processing processes,
    such as those caused by the observer misidentifying the target to be measured,
    or the introduction of human error in the computation process. As gross errors
    are generally larger than random errors and may significantly affect the reliability
    of measured results, precautions should be taken to reduce their generation. For
    traverse surveying, if the backward direction is identified incorrectly due to
    an observer''s mistake, the closing error of traverse will greatly exceed the
    acceptable limit; this is gross error. Therefore, if such errors are avoided,
    a well-designed measurement scheme is necessary. One solution is to introduce
    redundant measurements in the measuring process.


    # 1.2 UNIVERSALITY OF UNCERTAINTY


    Uncertainty exists widely in the natural world, whereas certainty is conditional
    and relative. For example, in the micro world, an electron follows a random path
    around the atom. The examples in the macro world are shared uncertainties between
    urban and rural areas and the pattern of climate distribution. In fact, uncertainty
    is universal and, as indicated above, exists widely in many fields, such as mathematics,
    physics, and economics. Brief examples of uncertainty in several fields are given.


    One hundred years ago Albert Einstein, was the 1921 Nobel Prize in Physics, criticized
    the nature of randomness in quantum physics by stating that "God does not play
    dice."


    However, due to lack of full knowledge of the universe, in recognition of uncertainty
    in quantum theory, Werner Heisenberg, the founder of quantum mechanics and who
    was the Nobel Prize in Physics in 1932, stated that the position and speed of
    a particle could not be measured exactly. Later, Stephen Hawking de to the introduction
    of his famous uncertainty principle in quantum theory pointed out, "Not only does
    God play dice with the Universe—he sometimes cats them where they cannot be seen."
    In March 1927, Heisenberg published a paper in the Zeitschrift für Physik entitled
    "On the Perception of Quantum Theoretical Kinematics and Mechanics," which was
    translated into English by Wheeler and Zurek in 1983. That paper presented his
    formulation of the uncertainty principle in quantum mechanics. This እንደሚ principle
    was controversial at the time, because it did not follow the orthodox laws of
    physics. Nowadays the uncertainty principle is highly regarded by physicists.


    In mathematics, Gödel''s incompleteness theorem (1931) states,


    In any consistent formalization of mathematics that is sufficiently strong to
    axiomatize the natural numbers, one can construct a true statement that is neither
    proved nor disproved within that system itself.


    His second theorem states, No consistent system can be used to prove its own consistency.'
