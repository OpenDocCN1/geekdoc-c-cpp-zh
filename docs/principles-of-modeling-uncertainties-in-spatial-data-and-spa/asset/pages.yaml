  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 6.7 SUMMARY AND COMMENT


    This chapter addresses the issue of the integration of positional and attribute
    uncertainties, which is essential in multiple source data integration, as integration
    of field-based classified images from remote sensing and object-based vector data
    from GIS. The S-band model has been developed to describe the integrated positional
    and attribute uncertainty, with a focus on modeling uncertainty for transitional
    region of area objects.


    The S-band model is a generic approach for handling integrated positional and
    attribute uncertainty. The model elements are as follows: positional uncertainty,
    attribute uncertainty, and the mutual correlation between them. Two solutions
    have been provided for the S-band model: the probability theory-based solution
    and the certainty factor model-based solution. With the assumption that two data
    layers are independent, a product-rule-based model can be applied for the S-band
    model. With the certainty factor model-based solution, the value range of uncertainty
    expressions is extended from [0, 1] to [-1, 1]. This is particularly important
    for reasoning, which includes uncertainty indicators covering both positive and
    negative ranges.


    The application of the S-band model has been demonstrated by an example for land
    resource inventory, in which a classified remote sensing image with attribute
    uncertainty is integrated with vector boundary maps with positional uncertainty.
    The results of the example include both statistic results and graphic visualization
    of the integrated positional and attribute uncertainty.


    # REFERENCES


    +   Duda, R., Hart, P., and Nilsson, N., 1976. Subjective Bayesian method for
    rule-based inference system. In Proceedings of Natural Computer Conference Vol.
    45, AFIPS: 1075–1082.

    Heckman, D., 1986. Probabilistic interpretation of MYCIN''s certainty factors.
    In Uncertainty in Artificial Intelligence, ed. Kanal, L. N., Lemmer, J. F., 167–196.
    Elsevier, North Holland. New York.

    Shi, W.Z., 1994. Modeling Positional and Thematic Uncertainties in Integration
    of Remote Sensing and Geographic Information Systems. Enschede, The Netherlands:
    ITC Publication.

    Shortliffe, E. H. and Buchanan, B. G., 1975. A model of inexact reasoning in medicine.
    Math. Biosci., 23: 351–379.'
