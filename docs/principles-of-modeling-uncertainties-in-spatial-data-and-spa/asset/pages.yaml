  md: '# Modeling Positional Uncertainty in Spatial Data


    Measurement of the variables $X_A, Y_A, X_B, Y_B$ may contain positional error.
    However, a question arises: How can the positional error in the measurement be
    propagated into the result, through the linear function in Equation 4.1? To answer
    this question, the positional error at each intermediate point on the line segment
    is derived using the statistics error propagation law.


    Based on the error propagation law, the error at the middle point of the line
    segment is smaller than that at the two endpoints, given that positional errors
    of the endpoints are identical and independently distributed.


    # 4.2.2 POSITIONAL ERROR DISTRIBUTION OF SPATIAL FEATURES


    Positional error distribution of a spatial feature depends on data capture methods.
    The most common data-entry method is map digitization. Map digitization error
    distribution has been investigated by researchers Bolstad (1990). It was found
    that the digitizing error was normally distributed. Meng et al. (1998) and Tong
    et al. (2000) found that in some circumstances, the digitizing error was approximate
    to the NL distribution and the least P-norm distribution, respectively. However,
    the normal distribution is still widely used to describe the point error, since
    it is relatively easier for follow-up processing, such as auto-correlation and
    cross-correlation modeling at the vertices of spatial features


    Under the assumption of normally distributed point errors, the positional error
    distribution of a line or a polygon has been studied using mainly two approaches:
    simulation and analytical. Dutton (1992) modeled the error distribution of a line
    segment using a simulation approach. This method considered that the true location
    of a line segment is an inner region (or error ellipse in general) centered at
    the middle of the line. If there is only one observation, the mean location will
    be equivalent to the observation. The simulation of the endpoints, based on such
    assumption, will obtain a series of line segments. This could outline the line
    segment error distribution.


    Another method to derive the error distribution is based on an analytical approach
    (Shi, 1994, 1998). The early work on positional error of a line from one-to $n$-dimensional
    space was carried out under the assumption that the positional error at each endpoint
    of the line was independently distributed. Later, Shi and Liu (2000) introduced
    a model to study the positional error distribution of a line, based on a stochastic
    process, where the error of the line segment composite points were correlated.


    # 4.2.3 ERROR-BAND MODEL FOR LINE FEATURES


    An error-band model is a band around the true location of a spatial feature. The
    first error-band model was proposed by Perkal (1966). Perkal’s $\epsilon$-band
    can be created by rolling a circle around the true location of a line segment
    or a polygon’s boundary. The positional error for the line or the polygon’s boundary
    is expressed as the area of the $\epsilon$-band.


    Chrisman (1982) developed this theoretical $\epsilon$-band model for practical
    applications. He applied $\epsilon$-band measurements to model positional error
    in a GIRAS'
