    # 3.7.4 ALGEBRAIC AND ANALYTICAL PROPERTIES OF ENTROPY


    Let $p_i = p(a_i)$. The entropy is rewritten as


    ```

    $H(X) = - \sum_{i=1}^r p_i \log[p_i].

    ```


    This expression shows that $H(X)$ is a function of $p_i$. That is,


    ```

    $H(p_1, p_2, \dots, p_r) = - \sum_{i=1}^r p_i \log[p_i].

    ```


    If the probabilities of all outcomes $a_i, (i = 1, 2, \dots, r)$ of the information
    source X is expressed in the form of vector,


    ```

    $P = (p_1, p_2, \dots, p_r).

    ```


    The entropy in Equation 3.143 is denoted by $H(P) = H(p_1, p_2, \dots, p_r).

    The entropy has the following algebraic properties:


    +   1. Symmetry: $H(p_1, p_2, \dots, p_r) = H(p_2, p_1, \dots, p_r) = H(p_1, p_2,
    \dots, p_1)$. Swapping locations of all $p_i$ does not change the value of the
    entropy. That is, the entropy is invariant with the order with which the outcomes
    occur.

    2. Nonnegativity: $H(p_1, p_2, \dots, p_r) \geq 0$. This property states that
    in any experi-ment, we either gain some information or not gain any information.'
