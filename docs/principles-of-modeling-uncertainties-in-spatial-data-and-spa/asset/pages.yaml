    # 11.3 LINEAR ATTRIBUTE MEASUREMENT-BASED ERROR MODEL


    Having defined the three types of errors in line simplification (measurement error,
    model error, and total error), the models to quantify these errors are now introduced.


    Uncertainties in line simplification spatial analysis can be quantified either
    by (a) an analytical approach or (b) a simulation approach. The focus of this
    chapter is on the analytical approach. The simulation approach has been introduced
    by Cheung and Shi (2002). Within the framework of analytical modeling of line
    simplification uncertainty, simplification errors can be modeled either by (1)
    linear attribute measurements or (2) distortion measurements. A distortion measurement,
    measuring the shape similarity before and after applying a line simplification,
    is given by Cheung and Shi (2006). Presented in this chapter is a linear attribute-based
    analytical method for modeling errors in line simplification (Cheung and Shi,
    2004; Shi and Cheung, 2006).


    # 11.3.1 MODELING MEASUREMENT ERROR OF THE INITIAL LINE


    The measurement of the initial line is defined as the difference between a line
    in GIS as its truth in the reality. The factors causing this error may be due
    to the technological limitations of the data capture methods, such as GPS or total
    station, map digitization, or laser scanning technologies, as discussed in 2.4.3.


    Mathematically, an infinite number of points constitute a line and their error
    can be correlated. In a GIS, the initial line is represented by a set of that
    line''s shape points. Usually an assumption of point random normality (especially
    those lines from map digitization) is used (Dutton, 1992).


    A line error can be described by two methods: (a) treating the overall line as
    a whole and (b) treating the line in terms of its component parts. The second
    approach is used below.


    The probability density functions of the individual shape points are, in fact,
    different from the probability density function of the initial line. They are
    used to form the multivariate probability density function of all the shape points
    of the initial line. This multivariate probability density function is then used
    to measure error in sample points of that initial line.


    An ellipse for each shape point of the initial line describes the error in the
    shape point. The error ellipse is one measure of the region of each shape point
    that follows from a normal distribution. The error ellipse of a shape point (x,
    y)


