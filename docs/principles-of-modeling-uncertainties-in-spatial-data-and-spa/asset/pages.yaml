    # 16.3.1 DATABASE DESIGN


    Life cycles comprise three stages: birth (initialization, growth), processing,
    including displacement, thinning, and other generalization processes; and death
    (obolescence). EMMS was designed to update data automatically whenever any geometric
    change to the data occurred so that dynamic metadata can be obtained on a feature
    level.


    EMMS organizes and quality information (including temporal information, aggregation
    error information, generalization effects and information of data source, data
    capture methods, and data capture parameters) into five tables, two of which are
    supporting tables (Figure 16.4). In addition, user-defined tables can also be
    linked to the feature through the "MSLINK" number. A brief explanation of each
    metadata data field is given in Table 16.2.


    EMMS has been developed to automatically manage feature-based metadata for any
    data manipulation, producers should take the responsibility for validating the
    quality information of each feature within the data set. Figure 16.5 shows an
    example of system interface for checking quality information.


    EMMS can be used to automatically manage metadata for data set on a local level.
    Can input, store, and update the lineage, quality and temporal information for
    each data within the data set, subject to data manipulation. Data manipulation
    includes data initialization, generalization processing, and obsolescence. The
    lineage, quality, and temporal information relating to the data are captured automatically
    with minimal operator input. The data can be retrieved by SQL command. The users
    are enabled to determine the fitness of use specific data for their own application,
    with query functionality.


    The EMMS can work with CSDGM-compliant metadata, as the quality and temporal information
