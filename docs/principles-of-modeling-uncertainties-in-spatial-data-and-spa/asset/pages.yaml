- img_proc: true
  md: '10 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    the agreement found between test results and acceptable reference values, where
    the test result can be given by either measurements or by observations.


    # 1.3.1.2 Precision


    In GISci, there are two fundamental approaches for modeling spatial objects: (a)
    object-based and (b) field-based models. Precision is normally used for the first
    category of models, and resolution for the second category.


    Precision describes the ability of a measurement to be consistently repeated.
    In statistics, precision is a measure of the degree of scatter (usually measured
    by standard deviation) of observations about a mean. Generally, it is difficult
    to obtain a true value for an object, such as the true value of coordinates of,
    for example, a lamppost, based on a measurement method. Thus, instead of using
    measurement accuracy, measurement precision is normally used as quality measure
    for measurement. Theoretically, precision is a different concept from accuracy.
    However, in many applications, precision measure is a synonym for the *term accuracy*.


    # 1.3.2.1.3 Reliability


    In statistics, reliability refers to the consistency of a set of measurements.
    In GISci, therefore, reliability refers to the consistency of a set of measurements
    of spatial objects. Reliability is different from the logical consistency.


    # 1.3.2.1.4 Resolution


    Resolution refers to the finesse of detail that can be distinguished in an image.
    In the field of remote sensing, example, resolution describes the fineness of
    a remotely sensed image. Indicators for describing resolution can be pixels per
    square inch, dots per square inch, or lines per millimeter.


    # 1.3.2.1.5 Logical Consistency


    Logical consistency refers to the degree of adherence to logical data structure
    rules, attributes and relationships. In such a case, data structure can be conceptual,
    logical or physical (ISO 19113 2005).


    # 1.3.2.1.6 Completeness


    The degree of completeness indicates the degree to which the entity objects of
    a data set cover all the entity instances of the abstract universe. Completeness
    is used to define the relationship between the objects represented in a data set
    and the abstract universe of all objects (Morrison, 1988). The definition of completeness
    has been further extended by Brassel et al. (1995) to give a more comprehensive
    definition: *completeness* describes whether the entity objects, within a data
    set, represent all entity instances of the abstract universe.


    # 1.3.2.2 Elements of Spatial Data Quality


    Based on the dimensions of spatial data (space, time, scale, attribute and relation-ships,
    and the components of spatial data: accuracy, precision, reliability, resolution,
    logical consistency, and completeness), a matrix may be formed with the elements
    of spatial data quality. According to this matrix (see Table 1.1), a total of'
