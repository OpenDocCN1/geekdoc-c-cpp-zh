  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    # 6.3  THE S-BAND MODEL


    The S-band model (Shi, 1994) has been designed to model integration of positional
    and attribute uncertainties, with emphasis on the uncertainties in the object
    transition regions. Compared with commonly used approaches where positional and
    attribute uncertainties are separated, the philosophy behind the S-band model
    is that the uncertainty within the transition boundary region of an object is
    related to (a) positional uncertainty, (b) attribute uncertainty, and (c) correlation
    between (a) and (b). The S-band model is given by the following formula:


    ```

    $U_{PAT}(x) = F(U_p(x),U_t(x),\rho(U_p(x),U_t(x))), \quad (6.1)$

    ```


    where $x \in R^2$ is a lattice or point coordinate vector in a two-dimensional
    Euclidean space; $x$ varies over an index $D \in R2$; $U_p(x)$ is the positional
    uncertainty at $x$; $U_t(x)$ is the attribute uncertainty at $x$; and $\rho(U_p(x),U_t(x))$
    is the correlation between $U_p(x)$ and $U_t(x)$ at $x$. Finally, $U_{PAT}(x)$
    is the integrated positional and attribute uncertainty at $x$.


    The name of the S-band model is based on the shape of the objects with integrated
    positional and attribute uncertainty—in other words, an irregular s-shaped band.
    The model indicates that the uncertainty at a location $x$ is related to its positional
    and attribute uncertainties, and the correlation between them. $U_p(x)$ can be
    either a quantitative or qualitative value, and $\rho(U_p),x_t(x( can be can of
    them. It. difficult to define a concrete form of $F$ for all the possible cases
    of integrating positional and attribute uncertainties for this model. A specific
    form of $F$ can be given only when a specific application problem is well defined.


    # 6.4  PROBABILITY-THEORY SOLUTION MODEL


    When $H_p$ and $H_t$ are coindependent events, the product rule of the probability
    theory to solve the defined problem, can be shown as follows:


    ```

    $P[H_{p\cap t}] = P[Z_t \in C_l/Z_p(x)] \cap P[Z_p \in O_l/Z_p(x)]] \n = P[H_t/Z_p(x)]
    P[H_p/Z_p(x)].$

    ```


    It is important to assume that the attribute and positional uncertainties are
    mutually independent. If this criterion is not satisfied, the general form of
    production rule, requiring the use of conditional probabilities, is to be applied.
    Because the product rule is a general probability reasoning method, a large sample
    size is required. This situation increases the cost. Hence, more practical solutions
    that require a smaller sample size need to be developed.


    The following cases illustrate reasoning applications. Evidence to support the
    hypothesis is positive and some negative. For example, determining the'
  merge: -1
  pgno: 194
