    # 4.7.2 ERROR INFORMATION OF A LINE SEGMENT


    The statistical characteristics of a line segment can be described by Equations
    4.64 and 4.65. However, they cannot be used to assess the positional error of
    the line segment directly. A symmetrical matrix is therefore defined as follows:


    ```

    $$\sum \sigma_{z_1z_2}^2 = \begin{bmatrix} \sigma_{x_1x_2}^2 & \sigma_{x_1y_2}^2
    \ \sigma_{y_1x_2}^2 & \sigma_{y_1y_2}^2 \end{bmatrix} . \quad (4.67)$

    ```


    This matrix provides the error information of a line segment. As a conventional
    function of $t_1$ and $t_2$, the matrix (4.67) is used to describe the linear
    correlation of the (vertex and intermediate) points on the line segment. Based
    on Equations 4.9 and 4.67, the elements of the matrix (4.67) are given as


    ```

    $$\sigma_{x_1x_2}^2 = (1-t_1)^2(1-t_2)^2\sigma_{x_1x_1}^2 + t_1(1-t_1)t_2(1-t_2)\sigma_{x_1x_2}^2
    + t_1^2t_2^2\sigma_{x_2x_2}^2 \\n\sigma_{x1y_2}^2 = (1-t_1)^2(1-t_2)\sigma_{x_1y_1}^2
    + t_1(1-t_1)\sigma_{x_1y_2}^2 + t_2(1-t_2)\sigma_{x_2y_1}^2 + t_1t_2\sigma_{x_2y_2}^2
    \\n\sigma_{y_1x_2}^2 = (1-t_1)^2(1-t_2)\sigma_{y_1x_1}^2 + t_1(1-t_1)\sigma_{y_1x_2}^2
    + t_2(1-t_2)\sigma_{y_2x_1}^2 + t_1t_2\sigma_{y_2x_2}^2 \\n\sigma_{y_1y_2}^2 =
    (1-t_1)^2(1-t_2)^2\sigma_{y_1y_1}^2 + t_1(1-t_1)t_2(1-t_2)\sigma_{y_1y_2}^2 +
    t_1^2t_2^2\sigma_{y_2y_2}^2$ \quad (4.68)$

    ```


    In the extreme case $t_1 = t_2$, Equation 4.68 becomes


    ```

    $$\sigma_{x_1x_2}^2 = (1-t_1)^2\sigma_{x_1x_1}^2 + 2[(1-t_1)t_1]\sigma_{x_1x_2}^2
    + t_1^2\sigma_{x_2x_2}^2 \\n\sigma_{x_1y_2}^2 = (1-t_1)^2\sigma_{x_1y_1}^2 + t_1(1-t_1)(\sigma_{x_1y_2}^2
    + \sigma_{x_2y_1}^2) + t_1^2\sigma_{x_2y_2}^2 \\n\sigma_{y_1x_2}^2 = (1-t_1)^2\sigma_{y_1x_1}^2
