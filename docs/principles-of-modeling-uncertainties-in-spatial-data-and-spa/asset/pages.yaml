    # 13.5.2 Experiments USING THE TWO-DIMENSIONAL TRANSFORMATION MODELS


    This experimental study aims to test the performance of the two-dimensional formation-models
    in rectifying high-resolution satellite images, taking the two-dimensional polynomials
    and projective models as the examples.


    Two solutions were tested: (a) use of the compensation plane (case 1) and not
    using the compensation plane (case 2). The details of the experimental study are
    given in Shaker and Shi (2003).


    The transformation to a compensation plane (or plane of control) is actually a
    transformation in east coordinates (AX) and northing coordinates (AY) based on
    the following formulae:


    ```

    AX = ΔZ sin α/tanε, (13.33)

    ```


    ```

    ΔY = -ΔZ cos α/tanε, (13.34)

    ```


    where (α) is the azimuth angle, (ε) is the elevation angle of the satellite, and
    ΔZ is the height difference, respect to the compensation plane. An elevation of
    200 m (the average control point elevation) was adopted for the compensation plane,
    considering the highest elevation difference of 450 m in the area.


    According to Space Imaging technical specifications for an IKONOS product, its
    planimetric accuracy is 50 m (circular error) and 23.6 m associated root-mean-square
    error (RMSE) (Space Imaging, 2001), without taking the terrain displacement effects
    into account.


    To establish a baseline on the inherent accuracy of the IKONOS image for the Hong
    Kong test, the geo-referenced coordinates of the control points were digitized
    and compared with the observed coordinates in GPS WGS84 Universal Transverse Mercer
    (UTM) coordinate system. The absolute planimetric errors for all points were 11
    and 111 m in the Y direction and from 3 m to 32 m in the X direction, depending
    on the elevation points.


    The experiments on two-dimensional transformation models were applied on Image
    1. The number of GCPs used to compute the transformation parameters from 6 to
    18 with the remaining points used as checkpoints. Table 1.1 presents the resulting
    RMS discrepancies from the three transformation models for the two cases: with
    without projecting the compensation plane.


    In Case 1, the total RMS errors ranged from 5.83 m to 8.34 m in the X direction
    and from 14.37 to 38.27 m in the Y direction. From these results, it is noticed
    that the accuracy of the rectification by these two-dimensional transformation
    models cannot reach an acceptable level for mapping.


    In Case 2, the second-order polynomial produced the result with RMS errors of
    0.46 m to 0.29 m and 0.49 m to 0.46 m in X and Y directions. The fourth-order
    polynomial yielded even better than the second order, but with at least 16 GCPs
    compared with 6 GCPs for the second-order polynomial model. In general, the rectified
    accuracy from the two-dimensional transformation model can reach an acceptable
    level of accuracy: the RMS error discrepancy is less than one pixel in both the
    X and Y directions.'
