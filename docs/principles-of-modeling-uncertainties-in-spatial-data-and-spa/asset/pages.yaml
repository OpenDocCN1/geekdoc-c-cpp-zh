    # 2.4.3 UNCERTAINTIES IN SPATIAL DATA CAPTURE


    GIS data capture methods, including map digitization, photogrammetry, laser scanning,
    total station, GPS, and remote sensing, have been summarized in the above sections.
    In the following sections, error sources and the accuracy levels reached by these
    data capture methods are further discussed and analyzed. The characteristics of
    each method in respect to the potential obtainable accuracy and spatial data type
    captured are individual and unique. Hence, it is not surprising that these characteristics
    must undergo careful consideration in the selection of a suitable data capture
    method for a specific application. The cost factor also has to be considered.

    A spatial data capture method normally follows the following components: survey
    equipment, a data capture scheme, a post-data processing method, and manually
    operated equipment. However, spatial data capture technology and the related accuracy
    is restricted by the current status level of metrology technology; the performance
    of the data capture schemes and data processing methods can vary from one to another.
    Likewise, the reliability of human operators may also be different from one person
    to another. Hence, the quality of the captured spatial data may not necessarily
    be assured.'
