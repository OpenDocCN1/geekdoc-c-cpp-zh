  md: '# 392 Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    data with complex uncertainties, such as quality control of spatial data with
    multi-category uncertainties (both spatial and attribute) and uncertainties iniscale
    spatial data. Quality control of complex GIS analysis also needs to be addressed.
    Examples include such change detection or logic inconsistency checks. Currently,
    least square adjustment has been adopted as the main stream for spatial data quality
    control analysis. Hence, alternative solutions need to be studied, considering
    the limitations of this adjustment method.


    # 18.1.6 THREE FUNDAMENTAL ISSUES


    The following three issues are fundamental to further research in the area of
    error modeling for spatial data and spatial analysis.


    +   Uncertainty in spatial data may possibly be the result of a combination of
    several error sources. For example, the uncertainty of a polygon boundary may
    be the result of both positional and attribute errors. Therefore, the commonly
    used classification of data quality components may have limitations. In this event,
    a reformulation of the existing foundations of data quality component classification,
    such as positional, attribute, logical consistency, completeness, and lineage,
    may be necessary.

    Most GIS data is collected from only single time measurement and as such could
    have limitations that lead to difficulties during the application of statistics
    for modeling error in spatial data.

    Spatial distribution and spatial error dependency in spatial data is still an
    open issue and rise for further investigation.


    # 18.2 MORE MATHEMATICAL THEORIES FOR ERROR MODELING


    In current research, probability theories and statistics are used as the mathematical
    bases for uncertainty modeling spatial data and analyses, mainly regarding random
    error. Errors of another nature, such as systematic error and gross error also
    need to be modeled. It has been indicated that spatial dependency of the errors
    in spatial data is still an open issue, and that spatial data quality control,
    particularly, needs further investigation. In this respect, there is a need for
    new mathematical theories that would, at the same time, also enrich the theoretical
    foundations for modeling spatial data and analyses uncertainty. The following
    are brief examples of several mathematical theories that have potential in this
    area.


    # 18.2.1 GEOSTATISTICS


    Statistics and probability theories have been used in modeling such as positional
    error of points, lines, and polygons. Within the framework of object-based models,
    for example, line errors can be modeled based on component point errors. In this
    field, error correlation between line segments of a polyline need to be further
    studied. The spatial correlation between the component units, which affects the
    nature of the error distribution in the resultant field-based data, has not, to
    date, been'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Epilogue


    well addressed within the framework of field-based data models. Example of such
    spatial correlation is correlations of error pixels of the classified satellite
    image from an image classification. These issues related to spatial correlation
    and spatial distributions of the errors can potentially be resolved, based on
    statistics for spatial data.


    # 18.2.2 LEAST SQUA ADJUSTMENT


    Least squares adjustment is an optimization method, based on statistics used in
    surveying data processing. The aim of the least squares method is to estimate
    the optimized value of the unknown parameters, and to estimate the accuracy of
    the observations, including the parameters. The characteristics of the least squares
    method are: (a) the estimators are unbiased, (b) results have a minimum variance,
    and (c) the estimation is independent of the error distribution of the original
    measurements. For example, they are not required to follow a normal distribution.


    This method can potentially be applied for spatial data quality control, and in
    particular, to solve data quality problems, where multisources of spatial data
    are in multiple scales and different accuracy, for example, as when logic inconsistency
    checking between multiple spatial data is involved.


    Error propagation in statistics is often used to analyze error propagation in
    spatial data and analyses. If the error in the independent variables, and a function
    defines the relationship between dependent variables and the independent variables
    are known, the error propagation law can be applied to estimate error in a dependent
    variable. However, the error propagation law has a restriction that the above
    function must be linearized before the error propagation law is applied. In addition,
    independent variable errors are normally assumed to be random in nature. However,
    the nature of many relationships in spatial analyses and spatial dynamics is not
    as simple as linear, and sometimes is too complex to model. Furthermore, the dependent
    variables may not be simply random, but a combination of random, systematic and
    gross errors. In such situations, the error propagation law for the estimation
    of uncertainty in the dependent variables cannot be applied to solve the problems.
    Other mathematical solutions have to be found. One possible solution is the approximation
    theory, which enables error analysis problems in any nonlinear functions to be
    addressed. Additionally, the nature of error may not limited to random. In a case
    where functional relationship cannot be easily built between the independent and
    dependent variables, other solutions such as a simulation approach or sensitivity
    analysis can be considered as alternatives.


    # 18.3 IMPLEMENTATION ISSUES


    # 18.3.1 ERROR AWARENESS


    GIS users should be aware that errors and uncertainties are present in the spatial
    data used. With a new user this is not necessarily the case. However, this awareness
    can be achieved through education. Education is even more important when'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    data are widely accessible and used day to day. Examples include such as high
    resolution satellite images, three-dimensional city models accessed from Google
    Earth, and the acquisition of the shortest path or hot location searched from
    an individual navigation system. A user should be aware that these data may not
    be error free. In fact, the geometric position of the satellite image can possess
    positional error; for instance, the hotel name may be missing from the database,
    or the short path identified by the navigation system may not be the shortest
    in reality due to spatial data errors or data updating problems


    Knowledge of the above inconsistencies gives users an awareness of the necessity
    to be assured that data are not reliable and of high accuracy also totally meet
    user requirements. GIS providers'' awareness of these demands is a driving force
    to make further improvements in the data quality available. However, it is necessary
    for GIS software vendors to provide data quality control and analysis functions
    as one of the core components of their GIS software. The component would be used
    for (1) quality checking when spatial data are input into GIS and (2) uncertainty
    propagation estimation when spatial analyses are conducted, based on spatial analysis
    in GIS, as discussed below.


    # 18.3.2 SOFTWARE FOR DATA QUALITY CONTROL


    The developed theoretical methods and models on uncertainty modeling in spatial
    data and analyses can be materialized through GIS software. Hence, the development
    of GIS functions that can implement the developed models and methods for measuring
    errors, accuracy, and uncertainty in spatial data and analysis is necessary.


    With such GIS quality modules, users can capture, manage, and visualize not only
    geographic data also, at the same time, acquire data quality information for both
    object-based and field-based data in GIS. Preliminary progress has been made by
    the GIS research community in relevant software developments; however, comprehensive
    modules from main stream GIS software products are still not available to users.


    Furthermore, uncertainty modeling for spatial analyses, especially for complex
    spatial analyses, has not yet been developed. When software for uncertainty modeling
    in spatial analysis is available, GIS users will not only be able to achieve the
    results of a spatial analysis but also enable obtain information about uncertainty
    propagation and even amplification in spatial analyses.


    # 18.3.3 QUALITY MARKS ON GIS DATA PRODUCTS


    Quality marks are often found on both sophisticated and everyday products. Such
    a practice is normal and a marketing tool to assure the customer of the product''s
    high standard. For example, on the back side of the telephone in my hotel, Best
    Western South Coast Inn, find the quality mark: "QC PASSED." GIS products do not
    have quality assurance attached. Currently, this practice does not exist, and
    hence it is unreasonable for the customer to be unsettled by what he is interested.
    He may even feel that the provider is not mindful of customer need for evidence
    of GIS products'' quality control and'
