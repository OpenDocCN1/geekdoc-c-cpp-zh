    **FIGURE 8.4** An example of the TIN digital elevation model.


    # 8.2.3 A TRIANGULATED IRREGULAR NETWORK MODEL


    A triangulated irregular network (TIN) is a digital terrain model, constructed
    from irregularly spaced three-dimensional discrete points. These irregular discrete
    points form a set of adjacent and continorous triangles. A triangulated irregular
    network is then generated, based on a triangulation algorithm, such as Delaunay
    triangulation, where the vertices of the triangles are the original discrete points
    (Figure 8.4).


    The feature points (such as peaks, ridges, canyons, or passes) can be represented
    as the vertices and edges of the triangles, respectively. Therefore, a TIN can
    have a better representation of terrain than the regular grid DEM.


    Another advantage of a TIN is that its resolution can easily be varied depending
    on the terrain complexity level in different locations. One part of the network
    can have a higher resolution for the area with higher terrain change frequency,
    while another part can have a lower resolution for the area with a lower terrain
    change frequency. Unlike similar univariate functions, a TIN network also lacks
    the ability to represent vertical object features (such as side facets of buildings).


    Once a TIN is generated, its topological relationship can be built. Topological
    relationships can be, for example, the relationship of a given triangle with the
    vertices of the triangle and of of its neighbor triangles. Such topological relationships
    can be used for spatial queries, spatial analysis, etc. A disadvantage of storing
    topological relationships for a TIN model is on its heavy storage cost and computation
    load.


    # 8.3 ERROR SOURCES OF A DEM MODEL


    The imprecision of a generated DEM model can be caused by (a) the original sample
    point error, and by (b) the interpolation methods used to generate the model from
    the original sample points.


    Before digital photogrammetry was well developed and widely applied, elevation
    points (either from contours or spot heights) from maps were used as the original
    sample points for generating a DEM, either through interpolation towards a regular
    grid or by triangulation. Spot heights can also be captured via a field surveying
    method, for example, using a station total. Contours are then interpolated based
    on the field measured spot heights or together with other feature points. In such'
