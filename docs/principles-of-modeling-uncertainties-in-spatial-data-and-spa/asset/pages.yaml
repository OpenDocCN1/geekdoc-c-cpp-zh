    # 16.2.6.2 Nonquantitative Attribute Accuracy


    A nonquantitative attribute is an attribute that is not represented in the form
    of ordinal data. It may include geographic names, addresses, land uses, and others.
    Accuracy of the nonquantitative attribute can be assessed by examining all (or
    sample) items within the data set have attribute values differing from those in
    the universe of discourse. The number of items with incorrect attribute values,
    or the percentage of these items in the data set, can be metadata documented.


    # 16.2.6.3 Quantitative Attribute Accuracy


    A quantitative attribute refers to an attribute represented in the form of ordinal
    data. The attribute accuracy can be described statistically, such as by using
    RMSE measure. RMSE can be computed from differences between an attribute value
    in the data set and in the universe of discourse. Furthermore, the number of items
    with the difference exceeding the specification limit can be counted and the metadata
    documented. This count could also be presented in percentage form.


