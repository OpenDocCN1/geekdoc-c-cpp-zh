  md: '# 3 Mathematical Foundations


    Mathematical theories form the basis of spatial uncertainty modeling. According
    to the nature and category of the uncertainties in spatial data and spatial analyses,
    corresponding mathematical theories have been adopted or applied. To enable a
    better understanding of the development of uncertainty modeling given in later
    chapters, a brief summary of the related mathematical foundations are provided
    in this chapter.


    # 3.1 INTRODUCTION


    Uncertainties are classified into three categories: imprecision, ambiguity, and
    vagueness. *Imprecision* means the level of variation associated with measurement.
    *Ambiguity* refers to the ambiguous boundary of the region or object of interest,
    while *vagueness* indicates category determination, that is, the difficulty in
    determining which category the objects belong. An example of vagueness is found
    in the lack of sharpness in the definition of a boundary.

    As indicated, various uncertainties are modeled using different mathematical theories.
    Probability theory was the first theory employed for handling uncertainty. The
    fuzzy set and fuzzy measure theories are used to assess two different categories
    of uncertainty. Fuzzy set theories provide a natural framework for handling vagueness
    uncertainty. Fuzzy measure is used to describe vagueness, while ambiguity is treated
    with discord, confusion, and nonspecacity measures. A measure of information,
    known as Hartley''s measure, was introduced by Hartley in 1928, to describe ambiguity
    in a crisp set. Shannon introduced a general uncertainty measure, known as Shannon''s
    entropy, based on probability theory. (Mathematical theories to assess uncertainties
    in spatial data are summarized in Figure 1.1, Chapter 1.)

    The mathematical theories used to model uncertainties in spatial data and spatial
    analyses are described in this chapter as follows: probability theory, statistics,
    information theory and entropy, rough set, evidence theory, fuzzy set, and fuzzy
    topology.


    # 3.2 PROBABILITY THEORY


    Probability theory was introduced to study random phenomena. Each phenomenon is
    mathematically modeled, with fundamental rules of events. The probability of an
    event is studied in each model. This theory can be applied to study'
