    # 15.2.2 CONFIDENCE REGION MODEL FOR LINE FEATURES


    The confidence region model elaborated in Section 4.5 presents a solution using
    the confidence region to describe the positional uncertainty of a line. Figure
    4.4 presents the confidence region model for two-dimensional point, line and polygon
    features.


    # 15.2.3 AN ANALYSIS OF THE ERROR ELLIPSE


    The error ellipse approach is a visual method to graphically represent positional
    uncertainty of a point feature in object-based data format in GIS. The magnitude
    of this uncertainty is characterized by the size of the error descriptor in the
    form of a geometrical object. The larger the error ellipse, the larger the positional
    uncertainty of the measurement point.


    The error descriptor defined in the error ellipse approach is derived on the assumption
    that the positional uncertainty follows a normal distribution. This assumption
    is feasible based on the central limit theorem.


    The error ellipse approach can be applied for simultaneously displaying the positional
    uncertainty of many spatial features. This provides an overall picture of spatial
    feature uncertainty on a map. It also enables users to have a preliminary comparison
    of the spatial features in terms of their accuracy. This disadvantage is that
    the map may be confusing when the spatial features and their error descriptors
    are shown simultaneously, as some spatial features may overlap with the error
    descriptors of other spatial features. This can be overcome by displaying error
    descriptors of one or several spatial features, individually, at any time.


    # 15.3 ARROW-BASED APPROACH


    An uncertainty vector in two-dimensional space can be visualized by means of an
    arrow representation. The arrow is governed by two graphical variables: orientation
    and size. The orientation measures discrepancy from an assumed value in terms
    of direction, whereas size measures discrepancy according to the magnitude of
    error.


    The following gives an example of uncertainty in image rectification, and the
    arrow-based approach is applied to visualize of the uncertainty in the rectification.'
