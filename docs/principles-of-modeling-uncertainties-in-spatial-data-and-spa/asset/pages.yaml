    # 4.5 CONFIDENCE REGION MODELS


    A polyline is composed of a number of line segments. With the assumption of uncorrelated
    positional errors for the endpoints (or vertices) of a line, two types of error
    models are proposed for the polyline: (a) confidence region models and (b) positional
    error distribution models. A confidence region for a two-dimensional line was
    first introduced Shi (1994) and was further developed to assess the positional
    error for a line from an $n$-dimensional geometrical space (Shi, 1998). In these
    models, the confidence region is derived based on the independent positional error
    of the composite points and a predefined confidence level. Its shape is different
    from an $\varepsilon$-model, which assumes identical positional errors for any
    point of a line segment. The confidence region model considers that positional
    errors for all points on the line can be dissimilar.


    # 4.5.1 CONFIDENCE INTERVAL MODEL FOR SPATIAL FEATURES IN ONE-DIMENSIONAL SPACE


    A confidence interval for one-dimensional features includes the confidence interval
    of a point, the confidence interval of a line segment, and the confidence interval
    of a line. These confidence intervals are as follows.'
