    # 4.10 SUMMARY AND COMMENT


    This chapter has introduced methods for modeling positional uncertainties of spatial
    features within the framework of object-based data model in GIS. These methods
    cover point, polyline (with line segment as its basis element), curved, and polygon
    objects. Based on probability theory and statistics, positional uncertainties
    of spatial features have been modeled in terms of (a) confidence region, (b) error
    distribution, and (c) quantity of the errors, and have been presented in this
    chapter. Positional uncertainty in spatial data has been well addressed by researchers,
    as compared with other types of uncertainties such as temporal uncertainty. This
    is because the nature of positional uncertainty has been long discovered and therefore
    mathematical solutions exists. In the next chapter, modeling another type of uncertainty—attribute
    uncertainty—is discussed.


