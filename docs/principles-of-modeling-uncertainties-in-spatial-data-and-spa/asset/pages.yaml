  md: '# #4 Modeling Positional Uncertainty in Spatial Data


    Section II of this book, including Chapters 4 to 7, addresses uncertainty modeling
    for spatial data. Spatial features in GIS are classified as points, line segments,
    polylines, curves, and area objects. The methods for modeling the positional uncertainties
    of these features are introduced in this chapter. These methods are a further
    development of currently used methods for point error modeling, the latter being
    the focus of error modeling in the field of surveying data processing. The new
    methods are motivated by the need to model spatial objects in GIS. Hence, in addition
    to points, modeling of polylines, curves, and area objects are included. The theory
    of positional uncertainty modeling, described in this chapter, is based on statistics
    and probability theory.


    # ## 4.1 INTRODUCTION


    A geographic object on the Earth''s surface is described as a spatial feature
    and identified in GIS by its position, its attributes associated with the position,
    and relationships between this object and other surrounding objects. The position
    of a geographic object can be represented by an object-based model, by a field-based
    model, or by an analytical function with parameters. Positional uncertainty modeling
    for spatial features in an object-based model is addressed in this chapter. The
    object-based model in which the coordinates of points are used to describe the
    locations of a spatial feature is currently, the most commonly used model in GIS.


    Positional uncertainty (or error) can be determined by the differences between
    the measured position of the spatial feature and its “true” value. Because of
    the comparatively low level of cognition of the real world and limitation of the
    measurement technologies, positional uncertainty exists in spatial features in
    GIS. Such uncertainties affect the reliability of the results in GIS, applications.
    The quality of the spatial data used similarly affects the quality of decision
    making.


    In geometric terms, geographic objects in the real world can be classified into
    point objects (such as a lamppost or a tree), linear objects (such as road network
    or coastlines), and area objects (such as a land parcel or a water body). In a
    two-dimensional GIS, these objects are represented as point features, a curved
    feature, and a polyline feature (with line segments as the basic element), and
    an area feature.'
