    # 8.4.4 A NOTE ON THE DERIVED MATHEMATICAL FORMULA


    This section gives the mathematical formula used for estimating the TIN model,
    based on the error of the vertices, by using the linear interpolation. Below are
    several notes to the formula:


    +   - This formula, by giving the average accuracy of a triangle the TIN, enables
    a description of the error in the entire TIN surface, rather than the error of
    a particular point on that surface.

    - The average accuracy of any triangle of the TIN given by the formula is identical
    and independent of location and shape of an incorporated particular triangle.
    Therefore, the accuracy of the overall TIN model is also estimated by the formula.

    - The error at an arbitrary point inside a triangle of the TIN model can be estimated
    by the Elevation 8.17.


    # 8.5 ACCURACY ESTIMATION OF A REGULAR GRID DEM


    In the above section, the accuracy estimation of a TIN model, generated from a
    linear interpolation has been introduced. This section addresses accuracy estimation
    for a regular grid DEM (Shi et al., 2005), specifically, interpolated using the
    bicubic interpolation method.


    As introduced in Section 8.2.1, a number of interpolation methods can be used
    to generate a regular grid DEM where the bicubic interpolation is one of the commonly
    used nonlinear model. Thus, such a regular grid model, generated through the representative
    bicubic interpolation, is taken as an example for accuracy assessment. In such
    a case, the accuracy of an interpolated DEM model demonstrated that a bicubic
    interpolation has a higher accuracy (0.8a) than that of a linear interpolation
    (a). However, the elevation error of a linear interpolation is 4/9. Hence, of
    interest is the need to estimate elevation error of a higher-order interpolation.
    A method to estimate elevation error of a DEM is introduced in this section. This,
    together with the surface error description in previous studies, can enable the
    realization of the estimation of overall accuracy of higher-order interpolation
    model.


    # TABLE 8.2

    Surface Error and Elevation Error for the Linear and the Higher-Ordered (Bicubic)
    Interpolations


    | Interpolation | Linear | Higher-Order Interpolation (Bicubic) |

    |---|---|--|

    | Surface error | a | 0.8a |

    | Elevation error | 4/9 | ? |'
