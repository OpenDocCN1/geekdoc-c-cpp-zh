    # 12.5 SUMMARY


    Inconsistency arising from multidata sources is a critical issue affecting the
    applications of GIS. A data quality control approach for solving the data inconsistency
    in object-based spatial data, based on the least square adjustment theory, has
    been proposed in the above chapter. Inconsistencies in cadastral data in object-based
    spatial data are taken as an example. Inconsistencies of land parcel area data
    were found to be due to two different parcel area sources of: (a) the registered
    area and (b) the area value calculated from the digitized vertex''s coordinates.


    A systematic approach to address land parcel area adjustments covering three error
    processing methods has been introduced. The first method lets the registered area
    of the parcel be the true value and the digitized vertex''s coordinates be observations
    with random error for the establishment of the adjustment differential equations.
    The second method lets the registered area and the digitized vertex''s coordinates
    be observations with a random error. The weights of these two observation types
    are estimated using a variance components method. The third method adds the scale
    parameter of the parcel to the adjustment process for handling systematic error
    due to scale effect. The weights of the observations are estimated based on variance
    components from conditional adjustments with parameters.


    A quality control strategy for cadastral data has been provided for systematically
    handling the following five cases: area adjustment for a single parcel, area'
