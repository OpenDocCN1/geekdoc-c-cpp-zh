    repeated experiments, and this result does not change the value of p. Therefore,
    the probability (m/n) is an approximation of the true value of the probability
    of event A. The larger the value of n, the higher the precision of the approximation.


    # 3.2.1.3 Basic Axioms of Probability


    Let A and B be two events. The following axioms hold:


    +   1. 0 ≤ Pr(A) ≤ 1 and 0 ≤ Pr(B) ≤ 1.

    2. Pr(Ω) = 1 and Pr(∅) = 0.

    3. Pr(A ∪ B) = Pr(A) + Pr(B) - Pr(A ∩ B).

    4. If A ⇒ B, Pr(A) ≥ Pr(B) and Pr(A ∩ B) = Pr(A|B).

    5. For any event A, Pr(Aᶜ) = 1 - Pr(A).

    6. If events A₁, A₂, ..., Aₙ are mutually exclusive and exhaustive events, the
    probability of their union is equal to 1, Pr(A₁ ∪ A₂ ∪ ... ∪ Aₙ) = Pr(A₁) + ...
    + Pr(Aₙ).


    # 3.2.1.4 General Formula of Probability


    # 3.2.1.4.1 Conditional Probability


    A random event is an event with occurrence determined by some probability distribution.
    Let A and B be two random events where Pr(B) ≠ 0. A conditional probability is
    the probability of event A given that event B has occurred. It is denoted by Pr(A|B).
    Its mathematical expression is given as


    > Pr(A|B) = Pr(AB) / Pr(B).


    It follows that


    > Pr(AB) = Pr(A) Pr(B|A) = Pr(B) Pr(A|B). (3.2)


