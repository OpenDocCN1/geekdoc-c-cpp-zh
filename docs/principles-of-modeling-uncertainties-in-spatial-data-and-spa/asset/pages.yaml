    The visualization of the G-band is derived in the following.


    Suppose that $Q_{21}$ and $Q_{22}$ follow a two-dimensional normal distribution.
    Any point $Z_r = [x_r, y_r]^T$ on line segment $Q_{21}Q_{22}$ follows the two-dimensional
    normal distribution


    ```

    $Z_r = [x_r

    ```


