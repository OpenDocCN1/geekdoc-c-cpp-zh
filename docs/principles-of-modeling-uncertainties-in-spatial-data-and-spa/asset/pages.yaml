    # 7.5 SUMMARY


    Modeling topological spatial object relationships in GISci has been described
    in this chapter. Firstly, the existing models for depicting topological relations
    in GISci have been reviewed and analyzed, including the four-intersection model,
    the nine-intersection model, and the egg-yolk model. Secondly, a formal representation
    of the topological relationships between spatial objects has been given. Based
    on N-cell complex, N-dimensional space is subdivided into three components: the
    interior, the boundary, and the exterior. According to their topological relations
    and the corresponding mathematical expressions, the topological relationship can
    be quantified. A formal framework for representing topological relationships between
    spatial objects has also been presented. This framework can be applied to solve
    the topological and geometric problems using the formal logic and algebraic methods.
    Thirdly, uncertain topological relationships between spatial objects have been
    modeled based on fuzzy topology theory. Quasi coincidence and quasi difference
    have been applied to (a) distinguish the topological relations between fuzzy objects,
    and (b) indicate the effects of one fuzzy object on another. It has been found
    that (a) the number of topological relationships between two sets is infinite
    and can be approximated by a sequence of matrices, and (b) the topological relationship
    between two objects in GIS are shape-dependent.


