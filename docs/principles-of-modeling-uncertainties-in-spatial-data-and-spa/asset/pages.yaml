    where $n$ is the total number of sample relative distance values of the lines
    in the data set; $(\hat{d}_i)$ is the $i$th sample relative distance value of
    the point in the data set; and $(\hat{d})$ is the relative distance value of the
    line in the universe of discourse.


    # 16.2.4.3 Gridded Data Position Accuracy


    Gridded data position accuracy is the closeness of gridded data position values
    to values accepted as being true. This accuracy can be determined by comparing
    the absolute position of a gridded point in a data set with that in the universe
    of discourse (or accepted as true) on a local level. The RMSE of the difference
    between these two absolute positions is then computed as a measure of this position
    accuracy of the gridded point. On a global level, the RMSE of differences between
    absolute positions of all (or sample) gridded points in the data set with those
    in the universe of discourse, is estimated.


    In addition, the area (or the center of mass) of a cell group in the data set
    and that in the universe of discourse can be calculated. The RMSE of the area
    difference (or difference in terms of center mass) is then computed to describe
    positional accuracy of this cell group. This approach is applicable for a data
    set series to which the data belongs, or a smaller grouping of data within the
    data set.


    # 16.2.5 TEMPORAL ACCURACY


    Temporal accuracy is the accuracy of temporal information in a GIS database. It
    comprises three subelements, including accuracy of a time measurement, temporal
    consistency, and validity measurement.


    # 16.2.5.1 Accuracy of a Time Measurement


    Accuracy of a time measurement deals with the correctness of reported time measurement.
    Within the data set, as specified by a specific scope, may contain temporal information,
    such as data occurrence time. To assess temporal accuracy, for example, the difference
    between each data occurrence time in the data set and that in the universe of
    discourse is measured. The RMSE of this time measurement is computed from the
    occurrence time differences.


    # 16.2.5.2 Temporal Consistency


    Temporal consistency corresponds to the correctness of ordered events or sequences.
    It can be detected by checking each historical event to ensure that the event
    is correctly ordered against the rest of events. The temporal consistency in terms
    of the number of items, or the percentage of those items wrongly ordered, can
    then be reported in the metadata. If an acceptable level of the number of items
    wrongly inconsistency is given, by comparing the number of items wrongly ordered
    with the acceptable level, a Boolean metadata result is reported.'
