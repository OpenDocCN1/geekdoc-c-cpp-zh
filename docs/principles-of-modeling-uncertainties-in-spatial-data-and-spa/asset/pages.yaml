  md: "# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses\n\
    \n# 3.3.4 TESTS OF STATISTICAL HYPOTHESES\n\n# 3.3.4.1 General Procedure for the\
    \ Hypothesis Test\n\nA statistical hypothesis is an assertion concerning the distribution\
    \ of one or more random variables, or about one or more parameters to the distribution\
    \ of random variable(s). A test of the statistical hypothesis is a decision rule\
    \ for determining whether the hypothesis under consideration is accepted or rejected.\
    \ This decision rule is determined using a power function of the test, which is\
    \ a function that yields the probability of rejecting the hypothesis. The region\
    \ leading to the rejection of the hypothesis is called the *critical region* of\
    \ the test. The size of the critical region is called the *significance level*\
    \ of the test. This is the maximum value of the power function when the hypothesis\
    \ is true.\n\nA test of the statistical hypothesis is performed with the following\
    \ steps:\n\n+   1. Construct a null hypothesis $H_0$ and its alternative hypothesis\
    \ $H_1$.\n2. Select a sample data.\n3. Choose the level of significance $\\alpha$.\n\
    4. Determine the critical values $K_{\\alpha/2}$.\n5. Statistical inference: in\
    \ a two-tailed test, if $|u| < K_{\\alpha/2}$, we accept $H_0$. Otherwise, we\
    \ reject $H_0$. In a one-tailed test, if $u < K_\\alpha$, (or $u > -K_\\alpha$),\
    \ we accept $H_0$ for a right (left) tailed $H_1$.\n\n# 3.3.4.2 Statistical Hypothesis\
    \ about Distribution Function\n\nLet $F_0(X) = F_0(X; \theta_1, \theta_2, \\dots,\
    \ \theta_k)$ be a given distribution function with parameters $\theta_1, \theta_2,\
    \ \\dots, \theta_k$. A random sample of the random variable $X$ is $X_1, X_2,\
    \ \\dots, X_n$. The distribution function of $X$ is supposed to be $F(X)$. Following\
    \ two tests of statistical hypotheses can be performed.\n\n# 3.3.4.2.1 All Known\
    \ Parameters\n\nSuppose a real axis $(-\\infty, \\infty)$ is divided into $m$\
    \ mutually exclusive regions: $(c_i, c_{i+1}]$ where $c_1 \to -\\infty, c_{m+1}\
    \ \to \\infty$ and $i = 1, 2, \\dots, m$. A theoretical probability of $(c_i,\
    \ c_{i+1}]$ is\n\n```\n$r_i = F_0(c_{i+1}) - F_0(c_i) = P(c_i < X \\le c_{i+1}).$\n\
    ```\n\nThe number of the sample $X_1, X_2, \\dots, X_n$ falling inside $(c_i,\
    \ c_{i+1}]$ is denoted by $v_i$. This value is called the *experimental frequency*.\
    \ The following statistic has an approximately chi-square distribution with $m-1$\
    \ degrees of freedom,\n\n```\n$\\chi^2 = \\sum_{i=1}^{m} \\frac{(v_i - nr_i)^2}{nr_i}$.\n\
    ```\n\nHence, the chi-square test is used to test the null hypothesis $H_0 : F(X)\
    \ = F_0(X)$."
  merge: -1
  pgno: 83
- img_proc: true
  md: "# Mathematical Foundations\n\n# 3.3.4.2.2 Unknown Parameters\n\nConsider $F_0(X)$\
    \ has $l$ unknown parameters $\theta_{j_1}, \\theta_{j_2}, \\dots, \\theta_{j_l}$\
    \ where $l \\le k$. The values of the unknown parameters can be estimated based\
    \ on the maximum likelihood. The estimators of $\theta_{j_1}, \\theta_{j_2}, \\\
    dots, \\theta_{j_l}$ are assigned to the corresponding parameters to $F_0(X)$.\
    \ Similar to the case of known parameters, the theoretical frequency and the experimental\
    \ frequency can be computed.\n\n```\n$$\\chi^2 = \\sum_{i=1}^m \\frac{(V_i - nr_i)^2}{nr_i}\
    \ \\quad (3.52)$\n```\n\na chi-square distribution with $m-1$ degree of freedom\
    \ when $n$ is large. Applying the chi-square test, we can examine whether a null\
    \ hypothesis $H_0 : F(x) = F_0(X)$ will be rejected.\n\n# 3.3.5 Statistics For\
    \ Spacial Data\n\nSpatial data can be classified into three categories (Cressie,\
    \ 1993): geospatial data, lattice data, and point patterns. Geostatistical data\
    \ describe a statistical process in a continuous space. Lattice data relate to\
    \ a spatial process (as a spatio-temporal model) of space. The term point pattern\
    \ is used to describe the world through a process of spatial points (including\
    \ the process of representing a point or a random point set). Cressie (1993) introduced\
    \ the following model that is applicable to geospatial data, lattice data, point\
    \ patterns, and objects.\n\nLet $S$ be a data in an $n$-dimensional Euclidean\
    \ space and $Z(s)$ be a random data at a location $s$ in the space. Suppose that\
