  md: '# Foreword


    Michael F. Goodchild


    On February 3, 1998 a military aircraft of the U.S. Marine Corps struck and severed
    the cables supporting a gondola in Cavalese, Italy, leading to the deaths of 20
    people. The plane had wing and tail damage but was able to return to its base.
    It subsequently became clear that the cable-car was not shown on the maps used
    by the pilot, and in the subsequent trial the pilot claimed that the aircraft''s
    height-measuring system had malfunctioned. Errors, omissions, and uncertainties
    in geographic information do not often result in international incidents of such
    kind, but it is an inescapable fact that any knowledge we have will be in the
    positions of features, their existence, or their description. It is impossible
    to know the exact location of anything on the Earth''s surface, since our methods
    of measurement are always subject to error; uncertainties creep into our maps,
    databases, and written records through a wide range of additional mechanisms.
    Many of the classification schemes used to map aspects of the Earth''s surface,
    from soils to land are inherently uncertain, with the result that two people making
    the same area will produce identical maps. Despite centuries of progress in mapping
    technology, the creation of geographic information remains as much an art as a
    science.


    From this perspective it is important for users of geographic information to have
    some awareness of the uncertainties that are likely to influence their decisions—to
    know what the database does not tell them about the real world, and about the
    reliability of what it does tell them. As geographic technologies have developed
    over the past few decades it has become clear that one ignores issues of one''s
    peril. For example, regulations in many countries now make it difficult to construct
    in areas classified as wetland. Decisions are made daily about the uses to which
    private land can be put. But such decisions are clearly open to legal challenge
    if they can be shown to have been based on maps that are inherently uncertain.


    Research on the description and modeling of uncertainty in geographic information
    began in the late 1980s, and has accelerated over the past two decades. Today,
    a large literature describes successful efforts to address the issue, and tools
    are increasingly available to allow the effects of uncertainty to be propagated,
    so that uncertainties can be associated with the results of analysis as well as
    with inputs.


    John Shi has been one of the leaders in this area. He has made very significant
    contributions, particularly in the modeling of uncertainties in geographic features
    of complex geometry, and has also made a very valuable contribution as the organizer
    of a series of conferences on spatial data quality, the International Symposium
    on Spatial Data Quality, that have occurred every 2 years since 1999. The conferences
    provide a forum for a very broad-based discussion of recent research on uncertainty
    that is not limited to any single paradigm or theoretical framework—work, because
    experience over the past two decades has shown that this problem of'
