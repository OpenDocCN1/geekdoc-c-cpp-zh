    surveying, which is a potential source of gross error introduction. The latest
    total stations may have the ability to automatically search the targets. It greatly
    reduces the labor intensity of an observer and provides a solution to enable safe
    surveying in a dangerous area. Such total stations are usually in the form of
    intelligent robots.


    A total station measures target angles and distances by integrated optical and
    electronic technologies. The accuracy of a total station''s observations is thus
    affected by optical and electronic element factors. Factors that affect the station-measurement
    accuracy include instrument function, operator''s skill, measurement schemes,
    and instrumental and weather conditions. Among these factors, weather conditions
    have the greatest impact on the overall accuracy of the station''s observations;
    for instance, variations in humidity and temperature alter the index of refraction.
    Frequency, air pressure, and temperature influence the accuracy of distance measurement.
    Weather conditions, as as rain or snow, affect the efficiency of the electronic
    distance measurement.


    At present, a high-performance total station has an angle measuring accuracy of
    0.5” and at least ± 1 ppm.


    # 2.4.3.4 Satellite Positioning Technology


    The Global Positioning System (GPS), is a highly accurate positioning technology
    based on pseudo range measurements between the ground receiver and the tracked
    satellites. Factors affecting GPS accuracy may include the atmosphere (where the
    ionosphere and troposphere cause GPS signal delay); the multipath effect (a result
    of signals from a satellite reflecting the antenna over more than one path to
    different surface reflections); the number of GPS satellites available at the
    current location; the geometric distribution of the satellites; GPS and receiver
    clock errors; environmental disturbance such as a high voltage power transformer
    or vegetation with an elevation angle greater than 15 degrees from the horizontal;
    and human factors, such as the selectivity (SA) policy at the beginning of the
    operation, which can introduce intentional, slowly changing random errors of up
    to 100 meters into the publicly available navigation signals. The SA policy has
    disabled.


    GPS positioning accuracy is closely related to the positioning mode and measurement
    type used. GPS positioning accuracy is around 10 to 20 meters, with a standalone
    GPS positioning mode using pseudo range measurement. A differential GPS (DGPS)
    mode utilizes a reference station to reduce errors in GPS measurements and the
    positioning accuracy can reach meter level. The GPS Real-Time Kinematic (RTK)
    is a special GPS positioning technique using a carrier phase. The RTK can be used
    in real time with positioning accuracy of centimeter level. However, the carrier
    phase measurement can reach meter level, thus GPS positioning accuracy, while
    the carrier phase can reach centimeter level or higher.'
