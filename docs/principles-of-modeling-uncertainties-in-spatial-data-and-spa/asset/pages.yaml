    ```

    Slope(P^*) = \left(|\O_3P_3| - |O_2P_2|\right)/h

    ```


    where $|O_3P_3|$ and $|O_2P_2|$ are the elevations of points $P_3$ and $P_2$,
    respectively, and $h$ is an incremental value equal to the difference between
    $P_2$ and $P_3$ in the x direction. Elevation at a point is closely correlated
    to its neighboring points. The degree of the correlation decreases when the neighboring
    points move from that point. This classical slope estimation method uses two nearby
    points and ignores the change at farther points. To improve the method, it is
    suggested that the slope is estimated at $P^*$ as follows:


    ```

    Slope(P^*) = \frac{1}{2}\left(|\O_3P_3| - |O_2P_2|\right)/h + \frac{1}{4}\left(|\O_2P_2|
    - |O_1P_1|\right)/h + \frac{1}{4}\left(|\O_4P_4| - |O_3P_3|\right)/h. (14.21)

    ```


    This method considers impacts of the two closest points ($P_2$ and $P_3$) and
    the farthest points ($P_1$ and $P_4$) on slope estimation. The point level contributing
    to the estimation is governed by the weights. In the following experiment, the
    slope with Equation 14.21 is calculated.


