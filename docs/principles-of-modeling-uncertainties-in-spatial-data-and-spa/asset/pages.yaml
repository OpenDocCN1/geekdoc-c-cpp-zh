  md: '# Principles of Modeling Uncertainties in Spatial Data and Spatial Analyses


    Positional uncertainty models for points, line segments, polylines, curve lines,
    and areas, therefore, are the basic models for spatial feature positional uncertainty
    modeling in GISci. These uncertainty models are introduced and described below.


    The positional uncertainty model for a point has been extensively studied in the
    fields of geodesy and surveying data processing. Point positional uncertainty
    is usually assumed to be distributed in the proximity of an error ellipse centered
    at the ‘true’ location of that point. Positional uncertainty models for line segment
    studies are mainly researched by using the error propagation, statistical theories,
    and analytical approaches. These commonly used methods have been further extended
    to include the development of models for assessing positional uncertainty for
    a curve line. Positional uncertainty for a polygon can be modeled based on either
    the positional error of the component vertices or the component line segments.
    Polygon uncertainty is indicated by parameters such as area, perimeter, or gravity.


    The details of modeling positional uncertainty of spatial features in GISci are
    organized as follows.


    A brief review of the existing models for spatial features (spatial features are
    defined in Section 4.3) is given in Section 4.2. Positional uncertainty models
    for points are introduced in Section 4.4. Uncertainty models for polylines with
    the basic element of line segments are introduced in Section 4.5. A solution for
    the correlated uncertainty of the line segment is provided by a G-band model in
    Section 4.7. In addition to describing polygons, curved lines also describe. The
    positional model of curves is presented in Section 4.8. Positional uncertainty
    models for polygons are introduced in Section 4.9. The above models are mainly
    derived on statistics and probability theory.


    # 4.2 A REVIEW OF EXISTING ERROR MODELS


    Several error models for spatial features have been proposed in the literature
    for describing the positional error of spatial features due to random error sources
    in spatial data. These error models can be classified into three categories: (a)
    positional error models for points on a line segment, (b) positional error distribution
    models for spatial features, and (c) error-band models for line features.


    # 4.2.1 POSITIONAL ERROR FOR A POINT ON A LINE SEGMENT


    A line segment is composed of an infinite number of implicit points between any
    two locations, those locations known as explicit points. All intermediate points
    can be derived from a linear function of the two known explicit points. For example,
    let the two explicit points be A = (x_A, y_A) and B = (x_B, y_B). Any implicit
    point between endpoints A and B of a line segment is given as


    ```

    (x,y) = (1-r) · (x_A, y_A) + r · (x_B, y_B) = f(x_A, y_A, x_B, y_B, r). (4.1)

    ```


    where r ∈ [0, 1]. By varying the value of r, intermediate points on the line segment
    are obtained.'
