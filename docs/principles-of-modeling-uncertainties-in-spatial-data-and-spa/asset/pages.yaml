    # 12.2.2 ESTIMATION OF VARIANCE COMPONENTS


    As stated in Section 12.0 above, the parcel area values are from two different
    sources: (a) the registered parcel area value, which may be from a ground survey,
    and (b) possess the computed area value based on digitized coordinates of the
    component vertices of the land parcel. The area value from source (b) contains
    errors due to map digitization measurement errors. The area value from source
    (a) may possess errors, since it is also measured by ground survey or other methods;
    however, this error may be smaller than the error from source (b). If parcel areas
    from both sources (a) and (b) possess errors, they are treated as two of observations
    with different error levels in the least square adjustment, rather than as constants,
    with error and as an observation with error, as was the case in Section 12.2.1.
    One critical issue is the estimation of the weight of the two types of observations.
    The application of the variance components method (or the Helmert method) is proposed
    for this purpose.


