    # 15.3.1 An Example of Image Rectification


    The following steps are conducted to obtain a rectified image. First, several
    control points within the image area for registration are selected, and an image
    transformation is chosen for image rectification. Second, parameters of this transformation
    are estimated by substituting the control points into the transformation. Third,
    the transformation of the estimated parameters is applied, yielding a rectified
    image.


    Image rectification accuracy is subject to the applied transformation model and
    the accuracy, number and spatial distribution of the control point. The commonly
    used transformations are introduced in Sections 13.1 and 13.2, such as the conformal
    transformation, the affine transformation, and the polynomial transformation.
    Here, the conformal transformation is taken as an example for illustrating the
    arrow-based uncertainty visualization method.


    # 15.3.1.1 Conformal Transformation


    Suppose n control points are selected and their coordinates on the ground are
    denoted by $(x_i, y_i)$ for $i = 1, 2, \dots, n$. Let $(\xi_i, \eta_i)$ denote
    the ith control point on a map before rectification. Based on the conformal transformation,
    the following equation is obtained:


    ```

    $$\begin{cases} x_i = T_x + \mu \cos(\alpha)\\xi_i - \mu \sin(\alpha)\\eta_i \
    y_i = T_y + \mu \sin(\alpha)\\xi_i + \mu \cos(\alpha)\\eta_i \end{cases} $$(15.5)$

    ```


    Where $T_x$ and $T_y$ are translation parameters, $\mu$ is a scaling parameter,
    and $\alpha$ is a rotation-ion parameter. By letting


    ```

    $$\begin{cases} a = \mu \cos(\alpha) \ b = \mu \sin(\alpha) \end{cases} $$(15.6)$

    ```


    Equation 15.5 simplifies to


    ```

    $$\begin{bmatrix} x_i \ y_i \end{bmatrix} = \begin{bmatrix} 1 & 0 & \xi_i & -\eta_i
    \ 0 & 1 & \eta_i & \xi_i \end{bmatrix} \begin{bmatrix} T_x \ T_y \ a \ b \end{bmatrix}
    $$(15.7)$

    ```


    Substituting all control points into Equation 15.7 provides a system of equations
    in matrix form


    ```

    $A\lambda = L + v , $$(15.8)$

    ```'
