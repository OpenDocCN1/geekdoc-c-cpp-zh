    & \text{if } slope_x(P^*) > \varepsilon \end{cases} \quad (14.18)

    ```


    In the $y$ direction,


    ```

    $z = \begin{cases} a_1+a_2y, & \text{if } slope_y(P^*) \le \varepsilon \ a_1+a_2y+a_3y^2+a_4y^3,
    & \text{if } slope_y(P^*) > \varepsilon \end{cases} \quad (14.19)

    ```


    where $slope_x(P^*)$ and $slope_y(P^*)$ are the slopes at point $P^*$ along $x$
    and $y$ directions, respectively.


