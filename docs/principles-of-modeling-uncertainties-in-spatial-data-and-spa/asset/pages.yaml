  md: '# # Introduction


    Section I of this book presents an overview of the contents of this book, covering
    the basic concepts of uncertainty in Chapter 1, the sources of uncertainties in
    Chapter 2, and mathematical foundations in Chapter 3. This introductory first
    chapter is designed to provide the basic concepts of uncertainty that underpin
    this book’s aim to further contribute to the already established concepts and
    methods related to the modeling of uncertainty in spatial data and analyses. The
    concepts described include uncertainties, dimensions of spatial data, data quality
    components, and elements of spatial data. These concept descriptions form the
    foundation upon which the later chapters of the book are built and may use useful
    reference points.


    # 1.1 UNCERTAINTY


    Mandelbrot (1967) raised the question, “How long is the coast line of Britain?”
    and in the same vein I would like to raise the question “How long is the coastline
    of China?” It was reported as 9,000 km in the 1920s and then as 11,000 km in the
    1950s. Even later, in the 1960s, it was measured as 14,000 km, based on an aerial
    photogrammetric survey, with a map scale of 1:100,000, and 18,000 km, based on
    an aerial photogrammetric survey with a map scale of 1:50,000. Can it be possible
    that the length of the coastline of China has doubled in size over the last 50
    years? The element of uncertainty is obviously present in the measured value of
    the coastline length. This uncertainty may be caused by such factors as uncertainty
    inherited from insufficient knowledge of the coastal regions of the natural world,
    uncertainty in our cognition or interpretation of the coastline, error in the
    measurement technology and measurement operational procedure, or even uncertainty
    in the digital representation of the coastline in different scales in the computer
    environment.


    # 1.1.1 THE CONCEPT OF UNCERTAINTY


    “Uncertainty” can refer to vagueness, ambiguity, or anything that is undetermined.
    As indicated above, by the breadth of the express “the natural world,” uncertainty
    is evident in many academic fields such as physics, statistics, economics, metrology,
    psychology, and philosophy. However, the connotation of the term uncertainty can
    differ from one to another. Uncertainty, as used in geographic information science
    (GISci), refers to the connotation mainly used in the fields of metrology and
    statistics. In GIS, the uncertainty of a measurement can be described by a range
    of values that possibly include the true value of the measured object. The measurement
    can be, for instance, the width of a building, the length of a road, or the area
    of a'
