- pgno: 405
  md: "```\nHost: www.ecubicle.net\nContent-Type: application/x-www-form-urlencoded\n\
    Content-Length: length\n\nV4IPAddress=string\n```\n\nTake note of the following:\n\
    \n+   - The URL for the Web service is http://www.ecubicle.net/iptocountry.asmx/FindCountryAsXml.\
    \ This URL is formed by joining the Host name (on the second line) with the URL\
    \ on the first line.\n+   - The Content-Type for the request is application/x-www-form-urlencoded.\n\
    +   - The Content-Length for the request is the length of V4IPAddress=string.\
    \ The data to be sent is formatted as key/value pairs — key1=value1&key2=value2&key3=value3.\
    \ Unlike HTTP GET, the data are not sent through the query string; it is sent\
    \ after the HTTP headers.\n+   - The HTTP Method is POST.\n+   - The result will\
    \ be returned in the following format:\n+   ```\n+   HTTP/1.1 200 OK\n+   Content-Type:\
    \ text/xml; charset=utf-8\n+   Content-Length: length\n+   \n+   <?xml version=\"\
    1.0\"?>\n+   xml result\n+   ```\n\n# CONSUMING WEB SERVICES USING SOAP, HTTP\
    \ GET, AND HTTP POST\n\nNow that you have seen the three ways of consuming Web\
    \ services, which method should you use? Using HTTP GET (the simplest), you saw\
    \ that all the information you need to pass to the Web service can be sent through\
    \ the query string. However, the query string has a limit on its length, and is\
    \ hence not suitable if you need to pass lots of data to the Web service. An alternative\
    \ to this would be to use the HTTP POST method, which allows more data to be sent.\
    \ However, HTTP POST has its limitations as well. As with HTTP GET, the data to\
    \ be sent must be formatted as key/value pairs. But each key/value pair is limited\
    \ in size to 1024 characters. The most versatile method is to use the SOAP method,\
    \ which allows complex data types to be sent to the Web service through the SOAP\
    \ request.\n\n# CONSUMING A WEB SERVICE IN YOUR IPAD APPLICATION\n\nNow you're\
    \ ready to tackle the exciting task of consuming a Web service in your iPad application!\
    \ First, you learn how to communicate with the Web service using the SOAP method."
