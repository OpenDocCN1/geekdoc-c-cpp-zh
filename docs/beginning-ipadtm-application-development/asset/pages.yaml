- pgno: 197
  md: "# How It Works\n\nThis example demonstrates the various ways in which you can\
    \ detect the presence of a keyboard and how the view involved can be relocated\
    \ so that it is not covered by the keyboard.\n\nFirst, you declare three private\
    \ variables:\n\n```\n//---size of keyboard---\nCGRect keyboardBounds;\n\n//---size\
    \ of application screen---\nCGRect applicationFrame;\n\n//---original size of\
    \ ScrollView---\nCGSize scrollViewOriginalSize;\n```\n\nThe keyboardBounds is\
    \ used to store the size of the keyboard (in particular, to obtain the height\
    \ of the keyboard). Although you can always hard-code the height of the keyboard\
    \ to be 264, I don't recommend doing so because the size of the keyboard may change\
    \ at a later time. A better practice is to dynamically obtain the size of the\
    \ keyboard during runtime.\n\nThe applicationFrame is used to store the size of\
    \ the screen. As with the size of the keyboard, it is always better to obtain\
    \ this figure dynamically during runtime.\n\nThe scrollViewOriginalSize is used\
    \ to save the original size of the ScrollView view. Doing so allows you to restore\
    \ the ScrollView to its original size after the user is done with the editing\
    \ (at which time all the views need to be moved back to their original positions).\n\
    \nWhen the View is loaded, you first save the size of the ScrollView view as well\
    \ as obtain the size of the screen:\n\n```\n-(void) viewDidLoad {\n    scrollViewOriginalSize\
    \ = scrollView.contentSize;\n    applicationFrame = [[UIScreen mainScreen] applicationFrame];\n\
    \    [super viewDidLoad];\n}\n```\n\nIn the viewWillAppear: event (this method\
    \ is invoked before the View appears on-screen), you register for the two notifications\
    \ — UIKeyboardWillShowNotification and UIKeyboardWillHideNotification. When the\
    \ keyboard appears (UIKeyboardWillShowNotification), the keyboardWillShow: method\
    \ is invoked. When the keyboard disappears, the keyboardWillHide: method is invoked:\n\
    \n```\n-(void) viewWillAppear:(BOOL)animated {\n    //---registers the notifications\
    \ for keyboard---\n    [[NSNotificationCenter defaultCenter]\n        addObserver:self\n\
    \        selector:@selector(keyboardWillShow:)\n        name:UIKeyboardWillShowNotification\n\
    \        object:self.view.window];\n\n    [[NSNotificationCenter defaultCenter]\n\
    \        addObserver:self\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "```\nselector:@selector(keyboardWillHide:)\nname:UIKeyboardWillHideNotification\n\
    object:nil;\n]\n```\n\nBefore the View disappears, you remove the notifications\
    \ you had previously set:\n\n```\n-(void) viewWillDisappear:(BOOL)animated {\n\
    \    [[NSNotificationCenter defaultCenter]\n        removeObserver:self\n    \
    \    name:UIKeyboardWillShowNotification\n        object:nil];\n\n    [[NSNotificationCenter\
    \ defaultCenter]\n        removeObserver:self\n        name:UIKeyboardWillHideNotification\n\
    \        object:nil];\n}\n```\n\nWhen you tap a TextField view, the textFieldDidBeginEditing:\
    \ method will first be invoked. With this method, you can know which TextField\
    \ view is being edited:\n\n```\n//---when a TextField view begins editing---\n\
    -(void) textFieldDidBeginEditing:(UITextField *)textFieldView {\n    currTextField\
    \ = textFieldView;\n}\n```\n\nNext, the keyboardWillShow: method is invoked. With\
    \ this method, you try to obtain the size of the keyboard by passing a reference\
    \ to the keyboardBounds variable. You are now ready to move the ScrollView view\
    \ so that the TextField view can be centered in the remaining visible space not\
    \ covered by the keyboard. You perform the scrolling by calling the moveScrollView:\
    \ method, which you define next:\n\n```\n//---when the keyboard appears---\n-(void)\
    \ keyboardWillShow:(NSNotification *) notification {\n    //---gets the size of\
    \ the keyboard---\n    NSDictionary *userInfo = [notification userInfo];\n   \
    \ NSValue *keyboardValue =\n        [userInfo objectForKey:UIKeyboardBoundsUserInfoKey];\n\
    \    [keyboardValue getValue:&keyboardBounds];\n\n    [self moveScrollView:currTextField];\n\
    }\n```\n\nIn the moveScrollView: method, you calculate the number of pixels to\
    \ scroll and then get the ScrollView view to scroll the views contained within\
    \ it until the TextField view currently being edited is at the center of the visible\
    \ area of the screen:\n\n```\n-(void) moveScrollView:(UIView *) theView {\n  \
    \  //---get the y-coordinate of the view---\n    CGFloat viewCenterY = theView.center.y;\n\
    ```"
