  md: "# How It Works\n\nThis application works by sensing the user's touch on the\
    \ screen of the iPad. When the user touches the screen, the View or View Controller\
    \ fires a series of events that you can handle. There are four such events:\n\n\
    +   - touchesBegan:withEvent:\n+   - touchesEnded:withEvent:\n+   - touchesMoved:withEvent:\n\
    +   - touchesCancelled:withEvent:\n\nTake a closer look at the first event. The\
    \ touchesBegan:withEvent: event is fired when at least one touch is sensed on\
    \ the screen. In this event, you can know how many fingers are on the screen by\
    \ calling the allTouches method of the UIEvent object (event):\n\n```\n//---get\
    \ all touches on the screen---\nNSSet *allTouches = [event allTouches];\n```\n\
    \nThe allTouches method returns an NSSet object containing a set of UITouch objects.\
    \ To know how many fingers are on the screen, simply count the number of UITouch\
    \ objects in the NSSet object using the count method. In this case, you are (at\
    \ this moment) interested only in a single touch, therefore you implement only\
    \ the case for one touch:\n\n```\n//---compare the number of touches on the screen---\n\
    switch ([allTouches count])\n{\n    //---single touch---\n    case 1: {\n    \
    \    //---get info of the touch---\n        UITouch *touch = [[allTouches allObjects]\
    \ objectAtIndex:0];\n\n        //---compare the taps---\n        switch ([touch\
    \ tapCount])\n        {\n            //---single tap---\n            case 1: {\n\
    \                imageView.contentMode = UIViewContentModeScaleAspectFit;\n  \
    \          } break;\n\n            //---double tap---\n            case 2: {\n\
    \                imageView.contentMode = UIViewContentModeCenter;\n          \
    \  } break;\n        }\n    } break;\n}\n```\n\nYou extract details of the first\
    \ touch by using the allObjects method of the NSSet object to return an NSArray\
    \ object. You then use the objectAtIndex: method to obtain the first array item.\n\
    \nThe UITouch object (touch) contains the tapCount property, which tells you whether\
    \ the user has single-tapped the screen or performed a double tap (or more). If\
    \ the user single-tapped the screen, you resize the"
