    \ — Execute all the statements in a function /method and continue to the next\
    \ statement.\n+   - Step Out (Shift-Command-T) — Finish executing all the statements\
    \ in a function or method and continue to the next statement after the function\
    \ call.\n+   - If you want to resume the execution of your application, press\
    \ Option-Command-P.\n+   - You can also examine the values of variables and objects\
    \ by clicking the Show Debugger button (shown enclosed by the box in Figure B-16).\
