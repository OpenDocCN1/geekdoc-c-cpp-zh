- pgno: 575
  md: '+   - didPresentAlertView:

    +   - alertView:willDismissWithButtonIndex:

    +   - alertView:didDismissWithButtonIndex:

    +   - alertViewCancel:


    If you want to implement any of the methods in the UIAlertViewDelegate protocol,
    you need to ensure that your class, in this case the View Controller, conforms
    to this protocol. A class conforms to a protocol using angle brackets (<>), like
    this:


    ```

    @interface UsingViewsViewController : UIViewController

    <UIAlertViewDelegate> { //---this class conforms to the UIAlertViewDelegate

    // protocol---

    }

    //...

    ```


    > NOTE To conform to more than one delegate, separate the protocols with commas,
    such as <UIAlertViewDelegate, UITableViewDataSource>.


    After the class conforms to a protocol, you can implement the method in your class:


    ```

    - (void)alertView:(UIAlertView *)alertView

    clickedButtonAtIndex:(NSInteger)buttonIndex {


    NSLog([NSString stringWithFormat:@"%d", buttonIndex]);

    }

    ```


    # Delegate


    In Objective-C, a delegate is just an object that has been assigned by another
    object as the object responsible for handling events. Consider the case of the
    UIAlertView example that you have seen previously:


    ```

    UIAlertView *alert = [[UIAlertView alloc]

    initWithTitle:@"Hello"

    message:@"This is an alert view"

    delegate:self

    cancelButtonTitle:@"OK"

    otherButtonTitles:nil];

    ```


    The initializer of the UIAlertView class includes a parameter called the delegate.
    Setting this parameter to self means that the current object is responsible for
    handling all the events fired by this instance of the UIAlertView class. If you
    don’t need to handle events fired by this instance, you can simply set it to nil:


    ```

    UIAlertView *alert = [[UIAlertView alloc]

    initWithTitle:@"Hello"

    ```'
