- pgno: 482
  md: '![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_482_0.png)


    FIGURE 18-4


    The MKCoordinateRegion structure contains a member called center (of type CLLocationCoordinate2D)
    and another member called span, of type MKCoordinateSpan. The MKCoordinateSpan
    structure in turn contains two members — latitudeDelta and longitudeDelta (both
    of type CLLocationDegrees, which is a double):


    ```

    NSLog([NSString stringWithFormat:@"%8f", region.span.latitudeDelta]);

    NSLog([NSString stringWithFormat:@"%8f", region.span.longitudeDelta]);

    ```


    Both members define the amount of distance to display for the map:


    +   - latitudeDelta — One degree of latitude is approximately 111 kilometers (69
    miles).

    +   - longitudeDelta — One degree longitude spans a distance of approximately
    111 kilometers (69 miles) at the equator but shrinks to 0 kilometers at the poles.


    Examine the value of these two structures as you zoom in and out of the map —
    they are a good indicator for the zoom level of the map.


    # GETTING LOCATION DATA


    Nowadays, mobile devices are commonly equipped with GPS receivers. Because of
    the many satellites orbiting the earth, courtesy of the U.S. government, you can
    use a GPS receiver to find your location easily. However, GPS requires a clear
    sky to work and hence does not work indoors.'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'Another effective way to locate your position is through cell tower triangulation.
    When a mobile phone is switched on, it is constantly in contact with base stations
    surrounding it. By knowing the identity of cell towers, it is possible to correlate
    this information into a physical location through the use of various databases
    containing the cell towers'' identities and their exact geographical locations.
    Cell tower triangulation has its advantages over GPS because it works indoors,
    without the need to obtain information from satellites. However, it is not as
    precise as GPS because its accuracy depends on the area you are in. Cell tower
    triangulation works best in densely populated areas where the cell towers are
    closely located.


    A third method of locating your position is to rely on Wi-Fi triangulation. Rather
    than connect to cell towers, the device connects to a Wi-Fi network and checks
    the service provider against databases to determine the location serviced by the
    provider. Of the three methods described here, Wi-Fi triangulation is the least
    accurate.


    On the iPad, Apple provides the Core Location framework to help you determine
    your physical location. The beauty of this framework is that it makes use of all
    three approaches, and whichever method it uses is totally transparent to the developer.
    You simply specify the accuracy you need, and Core Location determines the best
    way to obtain the results for you.


    Sound amazing? It is. The following Try It Out shows you how this is done in code.


    # TRY IT OUT Obtaining Location Coordinates


    codefile LBS.zip available for download at Wrox.com


    +   1. Using Xcode, create a View-based Application project and name it LBS.

    +   2. Add the CoreLocation.framework framework to the Frameworks folder (see
    Figure 18-5).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_483_0.png)


    FIGURE 18-5'
