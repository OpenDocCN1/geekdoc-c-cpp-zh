- pgno: 226
  md: "# How It Works\n\nYou actually start the application in step 7 by creating\
    \ an NSMutableArray object called `listOfMovies` containing a list of movie names.\
    \ The items stored in this array will be displayed by the Table view.\n\n```\n\
    -(void)viewDidLoad {\n    //---initialize the array---\n    listOfMovies = [[NSMutableArray\
    \ alloc] init];\n    \n    //---add items---\n    [listOfMovies addObject:@\"\
    Training Day\"];\n    [listOfMovies addObject:@\"Remember the Titans\"];\n   \
    \ [listOfMovies addObject:@\"John Q.\"];\n    [listOfMovies addObject:@\"The Bone\
    \ Collector\"];\n    [listOfMovies addObject:@\"Ricochet\"];\n    [listOfMovies\
    \ addObject:@\"The Siege\"];\n    [listOfMovies addObject:@\"Malcolm X\"];\n \
    \   [listOfMovies addObject:@\"Antwone Fisher\"];\n    [listOfMovies addObject:@\"\
    Courage Under Fire\"];\n    [listOfMovies addObject:@\"He Got Game\"];\n    [listOfMovies\
    \ addObject:@\"The Pelican Brief\"];\n    [listOfMovies addObject:@\"Glory\"];\n\
    \    [listOfMovies addObject:@\"The Preacher's Wife\"];\n    \n    [super viewDidLoad];\n\
    }\n```\n\nTo populate the Table view with items, you need to handle several events\
    \ contained in the `UITableViewDataSource` protocol. Hence, you need to ensure\
    \ that your view controller conforms to this protocol:\n\n```\n@interface TableViewExampleViewController\
    \ : UIViewController <UITableViewDataSource> {\n}\n```\n\n> NOTE Strictly speaking,\
    \ if you have connected the dataSource outlet to the File's Owner item, you don't\
    \ need to add the preceding statement. However, doing both doesn't hurt anything.\
    \ There is one advantage to adding the <UITableViewDataSource> protocol, though\
    \ — the compiler will warn you if you forget to implement any mandatory methods\
    \ in your code, helping to prevent errors.\n\nThe UITableViewDataSource protocol\
    \ contains several events that you can implement to supply data to the Table view.\
    \ Two events handled in this example are:\n\n+   - `tableView:numberOfRowsInSection:`\n\
    +   - `tableView:cellForRowAtIndexPath:`"
  merge: -1
  img_proc: true
- pgno: 227
  md: "The tableView:numberOfRowsInSection: event indicates how many rows you want\
    \ the Table view to display. In this case, you set it to the number of items in\
    \ the listOfMovies array:\n\n```\n//---insert individual row into the table view---\n\
    - (NSInteger)tableView:(UITableView *)tableView\nnumberOfRowsInSection:(NSInteger)section\
    \ {\n\n    return [listOfMovies count];\n}\n```\n\nThe tableView:cellForRowAtIndexPath:\
    \ event inserts a cell in a particular location of the Table view. This event\
    \ is fired once for each row of the Table view.\n\nHere, you retrieve the individual\
    \ item from the array and insert it into the Table view:\n\n```\n- (UITableViewCell\
    \ *)tableView:(UITableView *)tableView\ncellForRowAtIndexPath:(NSIndexPath *)indexPath\
    \ {\n\n    static NSString *CellIdentifier = @\"Cell\";\n\n    //---try to get\
    \ a reusable cell---\n    UITableViewCell *cell = [tableView\n        dequeueReusableCellWithIdentifier:CellIdentifier];\n\
    \n    //---create new cell if no reusable cell is available---\n    if (cell ==\
    \ nil) {\n        cell = [[[UITableViewCell alloc]\n            initWithStyle:UITableViewCellStyleDefault\n\
    \        reuseIdentifier:CellIdentifier] autorelease];\n    }\n\n    //---set\
    \ the text to display for the cell---\n    NSString *cellValue = [listOfMovies\
    \ objectAtIndex:indexPath.row];\n    cell.textLabel.text = cellValue;\n\n    return\
    \ cell;\n}\n```\n\nSpecifically, you use the dequeueReusableCellWithIdentifier:\
    \ method of the UITableView class to obtain an instance of the UITableViewCell\
    \ class. The dequeueReusableCellWithIdentifier: method returns a reusable Table\
    \ view cell object. This is important because if you have a large table (say,\
    \ with 10,000 rows) and you create a single UITableViewCell object for each row,\
    \ you would generate a great performance and memory hit. Also, because a Table\
    \ view displays only a fixed number of rows at any one time, reusing the cells\
    \ that have been scrolled out of view would make more sense. This is exactly what\
    \ the dequeueReusableCellWithIdentifier: method does. So, for example, if 10 rows\
    \ are visible in the Table view, only 10 UITableViewCell objects are ever created\
    \ — they always get reused when the user scrolls through the Table view."
  merge: -1
  img_proc: true
