- pgno: 557
  md: "```\n#import \"AnotherClass.h\"\n\n@interface SomeClass : NSObject {\n    AnotherClass\
    \ *anotherClass;\n}\n@end\n\n//---AnotherClass.h---\n#import <Foundation/Foundation.h>\n\
    #import \"SomeClass.h\" //---cannot simply import here---\n\n@interface AnotherClass\
    \ : NSObject {\n    SomeClass *someClass;  //---using an instance of SomeClass---\n\
    }\n@end\n```\n\nDoing so results in circular inclusion. To prevent that, Objective-C\
    \ uses the @class compiler directive as a forward declaration to inform the compiler\
    \ that the class you specified is a valid class. You usually use the @class compiler\
    \ directive in the header file, and in the implementation file you can use the\
    \ @import compiler directive to tell the compiler more about the content of the\
    \ class that you are using.\n\nUsing the @class compiler directive, the program\
    \ now looks like this:\n\n```\n//---SomeClass.h---\n#import <Foundation/Foundation.h>\n\
    \n@class AnotherClass;  //---forward declaration---\n\n@interface SomeClass :\
    \ NSObject {\n    AnotherClass *anotherClass;\n}\n@end\n\n//---AnotherClass.h---\n\
    #import <Foundation/Foundation.h>\n\n@class SomeClass;     //---forward declaration---\n\
    \n@interface AnotherClass : NSObject {\n    SomeClass *someClass;\n}\n@end\n```\n\
    \n> NOTE Another notable reason to use forward declaration where possible is that\
    \ it will reduce your compile times because the compiler does not need to traverse\
    \ as many included header files and their includes, etc."
  merge: -1
  img_proc: true
- pgno: 558
  md: "# Class Instantiation\n\nTo create an instance of a class, you typically use\
    \ the alloc keyword (more on this in the Memory Management section) to allocate\
    \ memory for the object and then return it to a variable of the class type:\n\n\
    ```\nSomeClass *someClass = [SomeClass alloc];\n```\n\nIn Objective-C, you need\
    \ to prefix an object name with the * character when you declare an object. If\
    \ you are declaring a variable of primitive type (such as float, int, CGRect,\
    \ NSInteger, and so on), the * character is not required. Here are some examples:\n\
    \n```\nCGRect frame;    //---CGRect is a structure---\nint number;      //---int\
    \ is a primitive type---\nNSString *str    //---NSString is a class\n```\n\nBesides\
    \ specifying the returning class type, you can also use the id type, like this:\n\
    \n```\nid someClass = [SomeClass alloc];\nid str;\n```\n\nThe id type means that\
    \ the variable can refer to any type of object and hence the * is implicitly implied.\n\
    \n# Fields\n\nFields are the data members of objects. For example, the following\
    \ code shows that SomeClass has three fields — anotherClass, rate, and name:\n\
    \n```\n#import <Foundation/Foundation.h>\n\n@class AnotherClass;\n\n@interface\
    \ SomeClass : NSObject {\n    AnotherClass *anotherClass;\n    float rate;\n \
    \   NSString *name;\n}\n\n@end\n```\n\n# Access Privileges\n\nBy default, the\
    \ access privilege of all fields is @protected. However, the access privilege\
    \ can also be @public or @private. The following list shows the various access\
    \ privileges:\n\n+   - @private — visible only to the class that declares it\n\
    +   - @public — visible to all classes\n+   - @protected — visible to the class\
    \ that declares it as well as to inheriting classes"
  merge: -1
  img_proc: true
- pgno: 559
  md: "Using the example shown in the previous section, if you now try to access the\
    \ fields in SomeClass from another class, such as AnotherClass, you will not be\
    \ able to see them:\n\n```\nSomeClass *someClass = [SomeClass alloc];\nsomeClass->rate\
    \ = 5;    //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng Lee\"\
    ;    //---name is declared protected---\n```\n\n> NOTE Observe that to access\
    \ the fields in a class directly, you use the -> operator.\n\nTo make the rate\
    \ and name visible outside the class, modify the SomeClass.h file by adding the\
    \ @public compiler directive:\n\n```\n#import <Foundation/Foundation.h>\n\n@class\
    \ AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \n    @public\n    float rate;\n\n    @public\n    NSString *name;\n}\n\n@end\n\
    ```\n\nThe following two statements would now be valid:\n\n```\nsomeClass->rate\
    \ = 5;    //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng Lee\"\
    ;    //---name is declared protected---\n```\n\nAlthough you can access the fields\
    \ directly, doing so goes against the design principles of object-oriented programming's\
    \ rule of encapsulation. A better way is to encapsulate the two fields you want\
    \ to expose in properties. Refer to the “Properties” section later in this appendix.\n\
    \n# Methods\n\nMethods are functions that are defined in a class. Objective-C\
    \ supports two types of methods — instance methods and class methods.\n\nInstance\
    \ methods can be called only using an instance of the class. Instance methods\
    \ are prefixed with the minus sign (-) character.\n\nClass methods can be invoked\
    \ directly using the class name and do not need an instance of the class in order\
    \ to work. Class methods are prefixed with the plus sign (+) character."
  merge: -1
  img_proc: true
