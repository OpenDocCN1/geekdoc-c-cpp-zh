- pgno: 543
  md: 'By default, the .xib window is displayed in icon mode. But you can also switch
    to list mode, where you can view some of the items in more detail. For example,
    Figure C-2 shows that when viewed in list mode, the View item displays a hierarchy
    of views contained within it.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_543_0.png)


    FIGURE C-2


    # DESIGNING THE VIEW


    To design the user interface of your application, you typically double-click the
    View (or Table view or other) item on the .xib window to visually display the
    window. To populate your View window with views, you drag and drop objects listed
    in the Library window (see the Library section for more information on the Library
    window). Figure C-3 shows a Label view being dropped onto the View window.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_543_1.png)


    FIGURE C-3


    As you position the view on the window, gridlines appear to guide you.


    The View window also allows you to rotate the orientation of your view so that
    you can see how your view looks when it is rotated to the landscape orientation
    (see the box in Figure C-4; clicking on the arrow in the upper-right corner rotates
    the window).'
