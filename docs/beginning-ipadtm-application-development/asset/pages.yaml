    # INTERFACE BUILDER KEYBOARD SHORTCUTS


    As you add more views to the View window, you realize that you are spending a
    lot of time figuring out their actual sizes and locations with respect to other
    views. So here are some tips to make your life easier:


    +   - To make a copy of a view on the View window, simply Option-click and drag
    a view.

    +   - If a view is currently selected, pressing the Option key and then moving
    the mouse over the view displays that view’s size information (see left of Figure
    C-5). If you move the mouse over another view, it displays the distance between
    that view and the selected view (see right of Figure C-5).'
