  md: "# Sending Data\n\nOnce two devices are connected via Bluetooth, you can start\
    \ to send data to each other. The data are transmitted using the NSData object\
    \ (which is actually a bytes buffer), so you are free to define your own data\
    \ format to send any types of data (such as images, text files, binary files,\
    \ and so on).\n\nThe following Try It Out shows how to send a simple text message\
