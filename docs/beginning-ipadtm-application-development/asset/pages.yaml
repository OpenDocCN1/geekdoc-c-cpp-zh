- pgno: 64
  md: 'Next, from the Library window drag and drop a Text Field view to the View window,
    followed by a Round Rect Button view. Modify the attribute of the Round Rect Button
    view by entering Click Me! in the Title field (see Figure 2-9).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_64_0.png)


    FIGURE 2-9


    > NOTE Rather than specify the Text or Title property of a view to make the text
    display in the view (for example, the Label and the Round Rect Button views),
    you can simply double-click the view itself and type the text directly. After
    you''ve done this, you can rearrange the views and resize them to suit your needs.
    Interface Builder provides you with alignment guidelines to help you arrange your
    controls in a visually pleasing layout.


    Save the HelloWorldViewController.xib file by pressing Command-S. Then, return
    to Xcode and run the application again by pressing Command-R. The iPhone Simulator
    now displays the modified UI (see Figure 2-10).


    > NOTE Always remember to save all your changes in Interface Builder before you
    run the application in Xcode.


    Tap the Text Field view and watch the keyboard automatically appear (see Figure
    2-11). Press the Home button on the iPhone Simulator, and you will see that your
    application has been installed on the simulator. To go back to the application,
    simply tap the HelloWorld icon (see Figure 2-12).'
