  md: '# ABOUT THE AUTHOR


    **WEI-MENG LEE** is a technologist and founder of Developer Learning Solutions
    (www.learn2develop.net), a technology company specializing in hands-on training
    for the latest Microsoft and Mac OS X technologies. He is also an established
    author with Wrox and O''Reilly.


    Wei-Meng first started the iPhone programming course in Singapore and it has since
    received much positive feedback. His hands-on approach to iPad/iPhone programming
    makes understanding the subject much easier than reading books, tutorials, and
    documentation from Apple.


    Contact Wei-Meng at weimenglee@learn2develop.net.


    # ABOUT THE TECHNICAL EDITOR


    **TRENT SHUMAY** is the founder and Chief Architect at Finger Food Studios Inc.
    in the Vancouver, BC area. After graduating from the UBC Computer Science program,
    Trent spent thirteen years in the gaming and interactive entertainment space,
    where handheld gaming devices ignited his passion for mobile development. Today,
    Finger Food Studios focuses on developing media-rich, interactive mobile and Web
    applications. You can reach Trent directly at trent@fingerfoodstudios.com.'
