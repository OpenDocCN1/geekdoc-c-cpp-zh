- pgno: 487
  md: "# How It Works\n\nFirst, to use the CLLocationManager class, you need to implement\
    \ the CLLocationManagerDelegate protocol in your View Controller:\n\n```\n@interface\
    \ LBSViewController : UIViewController\n<CLLocationManagerDelegate> {\n```\n\n\
    When the View is loaded, you create an instance of the CLLocationManager class:\n\
    \n```\n- (void) viewDidLoad {\n    self.lm = [[CLLocationManager alloc] init];\n\
    \    lm.delegate = self;\n    lm.desiredAccuracy = kCLLocationAccuracyBest;\n\
    \    lm.distanceFilter = kCLDistanceFilterNone;\n    \n    [lm startUpdatingLocation];\n\
    \    \n    [super viewDidLoad];\n}\n```\n\nYou then proceed to specify the desired\
    \ accuracy using the desiredAccuracy property. You can use the following constants\
    \ to specify the accuracy that you want:\n\n+   - kCLLocationAccuracyBest\n+ \
    \  - kCLLocationAccuracyNearestTenMeters\n+   - kCLLocationAccuracyHundredMeters\n\
    +   - kCLLocationAccuracyKilometer\n+   - kCLLocationAccuracyThreeKilometers\n\
    \nWhile you can specify the best accuracy that you want, the actual accuracy is\
    \ not guaranteed. Also, specifying a location with greater accuracy takes a significant\
    \ amount of time and your device's battery power.\n\nThe distanceFilter property\
    \ allows you to specify the distance a device must move laterally before an update\
    \ is generated. The unit for this property is in meters, relative to its last\
    \ position. To be notified of all movements, use the kCLDistanceFilterNone constant.\
    \ Finally, you start the Location Manager using the startUpdatingLocation method.\
    \ The user can enable/disable location services in the Settings application. If\
    \ the service is not enabled and you go ahead with the location update, the application\
    \ will ask the user if he or she would like to enable the location services. To\
    \ obtain location information, you need to handle two events:\n\n+   - locationManager:didUpdateToLocation:fromLocation:\n\
    +   - locationManager:didFailWithError:"
  merge: -1
  img_proc: true
- pgno: 488
  md: "When a new location value is available, the locationManager:didUpdateToLocation:fromLocation:\
    \ event is fired. If the location manager cannot determine the location, it fires\
    \ the locationManager:didFailWithError: event.\n\nWhen a location value is obtained,\
    \ you display its latitude and longitude along with its accuracy using the CLLocation\
    \ object:\n\n```\n- (void) locationManager:(CLLocationManager *) manager\n   \
    \ didUpdateToLocation:(CLLocation *) newLocation\n    fromLocation:(CLLocation\
    \ *) oldLocation {\n\n    //---display latitude---\n    NSString *lat = [[NSString\
