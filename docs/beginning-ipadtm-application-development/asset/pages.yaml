- pgno: 260
  md: "When the view is first loaded, you first associate the Search Bar with the\
    \ Table view and then copy the entire list of movie titles from the NSDictionary\
    \ object into the NSMutableArray:\n\n```\n```objc\n//---Search---\nself.tableView.tableHeaderView\
    \ = searchBar;\nsearchBar.autocorrectionType = UITextAutocorrectionTypeYes;\n\n\
    //---copy all the movie titles in the dictionary into the listOfMovies array---\n\
    listOfMovies = [[NSMutableArray alloc] init];\nfor (NSString *year in array) \
    \   //---get all the years---\n{\n    //---get all the movies for a particular\
    \ year---\n    NSArray *movies = [movieTitles objectForKey:year];\n    for (NSString\
    \ *title in movies)\n    {\n        [listOfMovies addObject:title];\n    }\n}\n\
    \n//---used for storing the search result---\nsearchResult = [[NSMutableArray\
    \ alloc] init];\n\nisSearchOn = NO;\ncanSelectRow = YES;\n```\n```\n\nWhen the\
    \ user taps the Search Bar, the searchBarTextDidBeginEditing: event (one of the\
    \ methods defined in the UISearchBarDelegate protocol) fires. In this method,\
    \ you add a Done button to the top-right corner of the screen. When the Done button\
    \ is clicked, the doneSearching: method is called (which you define next).\n\n\
    ```\n```objc\n//---fired when the user taps on the searchbar---\n- (void)searchBarTextDidBeginEditing:(UISearchBar\
    \ *)searchBar {\n    isSearchOn = YES;\n    canSelectRow = NO;\n    self.tableView.scrollEnabled\
    \ = NO;\n\n    //---add the Done button at the top---\n    self.navigationItem.rightBarButtonItem\
    \ =\n    [[[UIBarButtonItem alloc]\n        initWithBarButtonSystemItem:UIBarButtonSystemItemDone\n\
    \        target:self action:@selector(doneSearching:)]\n        autorelease];\n\
    }\n```\n```\n\nThe doneSearching: method makes the Search Bar resign its First\
    \ Responder status (thereby hiding the keyboard). At the same time, you reload\
    \ the Table view by calling the reloadData method of the Table view. This causes\
    \ the various events associated with the Table view to be fired again.\n\n```\n\
    ```objc\n//---done with the searching---\n- (void) doneSearching:(id)sender {\n\
    \    isSearchOn = NO;\n    canSelectRow = YES;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 261
  md: "```\nself.tableView.scrollEnabled = YES;\nself.navigationItem.rightBarButtonItem\
    \ = nil;\n\n//---hides the keyboard---\n[searchBar resignFirstResponder];\n\n\
    //---refresh the TableView---\n[self.tableView reloadData];\n}\n```\n\nAs the\
    \ user types into the Search Bar, the searchBar:textDidChange: event is fired\
    \ for each character entered. In this case, if the Search Bar has at least one\
    \ character, you call the searchMoviesTableView method (which you define next):\n\
    \n```\n//---fired when the user types something into the searchbar---\n- (void)searchBar:(UISearchBar\
    \ *)searchBar textDidChange:(NSString *)searchText {\n\n    //---if there is something\
    \ to search for---\n    if ([searchText length] > 0) {\n        isSearchOn = YES;\n\
    \        canSelectRow = YES;\n        self.tableView.scrollEnabled = YES;\n  \
    \      [self searchMoviesTableView];\n    }\n    else {\n        //---nothing\
    \ to search---\n        isSearchOn = NO;\n        canSelectRow = NO;\n       \
    \ self.tableView.scrollEnabled = NO;\n    }\n    [self.tableView reloadData];\n\
    }\n```\n\nThe searchMoviesTableView method performs the searching on the listOfMovies\
    \ array. You use the rangeOfString:options: method of the NSString class to perform\
    \ a case-insensitive search of each movie title using the specified string. The\
    \ returning result is an NSRange object, which contains the location and length\
    \ of the search string in the string being searched. If the length is more than\
    \ zero, this means that a match has been found, and hence you add it to the searchResult\
    \ array:\n\n```\n//---performs the searching using the array of movies---\n- (void)\
    \ searchMoviesTableView {\n    //---clears the search result---\n    [searchResult\
    \ removeAllObjects];\n\n    for (NSString *str in listOfMovies)\n    {\n     \
    \   NSRange titleResultsRange = [str rangeOfString:searchBar.text options:NSCaseInsensitiveSearch];\n\
    \n        if (titleResultsRange.length > 0)\n            [searchResult addObject:str];\n\
    \    }\n}\n```"
