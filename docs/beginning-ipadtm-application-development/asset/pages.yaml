- pgno: 58
  md: '# 2


    # Write Your First Hello World!

    Application


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Create a new iPad project

    +   - Build your first iPad application using Xcode

    +   - Design the user interface (UI) of your iPad application using Interface
    Builder

    +   - Write some simple code to allow the application to rotate its content based
    on the orientation of the device

    +   - Add an icon to your iPad application


    Now that you have set up all the tools and SDK, you are ready to start developing
    for the iPad! For programming books, it is customary to start the chapter by showing
    you how to develop a “Hello World!” application. This approach allows you to use
    the various tools quickly without getting bogged down with the details. It also
    provides you with instant gratification: You see for yourself that things really
    work, which can be a morale booster that inspires you to learn more.


    # GETTING STARTED WITH XCODE


    Power up Xcode and you should see the Welcome screen, as shown in Figure 2-1.


    > **NOTE** The easiest way to start Xcode is to type Xcode in Spotlight and then
    press the Enter key to launch it.'
  merge: -1
  img_proc: true
- pgno: 59
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Although there are quite a few types of iPad applications you can create, for
    this chapter, select the View-based Application template and click the Choose
    button.


    > NOTE Subsequent chapters show you how to develop some of the other types of
    iPad applications, such as Tab Bar Application and Split View-based Application.


    Name the project HelloWorld and click Save. Xcode proceeds to create the project
    for the template you have selected. Figure 2-3 shows the various files and folders
    in your project.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_60_0.png)


    FIGURE 2-3


    The left panel of Xcode shows the groups in the project. You can expand on each
    group or folder to reveal the files contained in it. The right panel of Xcode
    shows the files contained within the group or folder you have selected on the
    left panel. To edit a particular file, select it from the list, and the editor
    at the bottom of the right panel opens the file for editing. If you want a separate
    window for editing, simply double-click the file to edit it in a new window.


    # Using Interface Builder


    As yet, this project has had no UI. To prove this, simply press Command-R (or
    select Run ⇧ Run), and your application is deployed to the included iPhone Simulator.
    Figure 2-4 shows the blank screen displayed on the iPhone Simulator. It''s good
    to see this now, because as you go through the chapter you will see changes occur
    based on your actions.'
  merge: -1
  img_proc: true
- pgno: 61
  md: <!-- no content -->
