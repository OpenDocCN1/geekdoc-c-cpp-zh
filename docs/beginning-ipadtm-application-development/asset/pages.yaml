  md: "# How It Works\n\nTo detect for the pinch gesture, you find the distance between\
    \ the two fingers and constantly compare that distance so that you know whether\
    \ the two fingers are moving toward or away from each other.\n\nTo find the distance\
    \ between two fingers, you define the distanceBetweenTwoPoints:toPoint: method:\n\
    \n```\n-(CGFloat) distanceBetweenTwoPoints:(CGPoint)fromPoint\n    toPoint:(CGPoint)toPoint\
    \ {\n    float lengthX = fromPoint.x - toPoint.x;\n    float lengthY = fromPoint.y\
    \ - toPoint.y;\n    return sqrt((lengthX * lengthX) + (lengthY * lengthY));\n\
    }\n```\n\nThis method takes in two CGPoint structures and then calculates the\
    \ distance between them. No rocket science here — just the Pythagorean theorem\
    \ in action.\n\nWhen the two fingers first touch the screen, you record their\
    \ distance in the touchesBegan:withEvent: method (see the code in bold):\n\n```\n\
    -(void) touchesBegan: (NSSet *) touches withEvent: (UIEvent *) event {\n    //...\n\
    \    //---double-touch---\n    case 2: {\n        //---get info of first touch---\n\
    \        UITouch *touch1 = [[allTouches allObjects] objectAtIndex:0];\n      \
    \  //---get info of second touch---\n        UITouch *touch2 = [[allTouches allObjects]\
    \ objectAtIndex:1];\n\n        //---get the points touched---\n        CGPoint\
    \ touch1PT = [touch1 locationInView:[self view]];\n        CGPoint touch2PT =\
    \ [touch2 locationInView:[self view]];\n\n        NSLog(@\"Touch1: %0.0f, %0.0f\"\
    , touch1PT.x, touch1PT.y);\n        NSLog(@\"Touch2: %0.0f, %0.0f\", touch2PT.x,\
    \ touch2PT.y);\n\n        //---record the distance made by the two touches---\n\
    \        originalDistance = [self distanceBetweenTwoPoints:touch1PT\n        \
    \    toPoint:touch2PT];\n    } break;\n}\n```\n\nAs the two fingers move on the\
    \ screen, you constantly compare their current distance with the original distance\
    \ (see Figure 12-16)."
