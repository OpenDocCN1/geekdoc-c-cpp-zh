  md: "When directional information is available, the locationManager:didUpdateHeading:\
    \ method will continually fire:\n\n```\n- (void)locationManager:(CLLocationManager\
    \ *)manager didUpdateHeading:(CLHeading *)newHeading {\n    heading.text = [NSString\
