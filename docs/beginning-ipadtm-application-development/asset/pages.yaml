- pgno: 577
  md: "The preceding code shows that you are dynamically creating a UIButton object.\
    \ In order to handle the event (for example, the Touch Up Inside event) raised\
    \ by the button, you need to call the addTarget:action:forControlEvents: method\
    \ of the UIButton class:\n\n```\n[button addTarget:self action:@selector(buttonClicked:)\
    \ forControlEvents:UIControlEventTouchUpInside];\n```\n\nThe action: parameter\
    \ takes in an argument of type SEL (selector). In the preceding code, you pass\
    \ in the name of the method that you have defined — buttonClicked: — which is\
    \ defined within the class:\n\n```\n-(IBAction) buttonClicked: (id) sender {\n\
    \    //...\n}\n```\n\nAlternatively, you can create an object of type SEL and\
    \ then instantiate it by using the NSSelectorFromString function (which takes\
    \ in a string containing the method name):\n\n```\nNSString *nameOfMethod = @\"\
    buttonClicked:\";\nSEL methodName = NSSelectorFromString(nameOfMethod);\n```\n\
    \nThe call to the addTarget:action:forControlEvents: method now looks like this:\n\
    \n```\n[button addTarget:self action:methodName forControlEvents:UIControlEventTouchUpInside];\n\
    ```\n\n> **NOTE** When naming a selector, be sure to specify the full name of\
    \ the method. For example, if a method name has one or more parameters, you need\
    \ to add a \":\" in the sector, such as:\n> \n> ```objc\n> NSString *nameOfMethod\
    \ = @\"someMethod:withPara1:andPara2:\";\n> ```\n\n> **NOTE** Because Objective-C\
    \ is an extension of C, it is common to see C functions interspersed throughout\
    \ your Objective-C application. C functions use the parentheses () to pass in\
    \ arguments for parameters.\n\n# CATEGORIES\n\nA category in Objective-C allows\
    \ you to add methods to an existing class without the need to subclass it. You\
    \ can also use a category to override the implementation of an existing class.\n\
    \n> **NOTE** In some languages (such as C#), a category is known as an extension\
    \ method."
  merge: -1
  img_proc: true
- pgno: 578
  md: "As an example, imagine that you want to test whether a string contains a valid\
    \ email address. You can add an isEmail method to the NSString class so that you\
    \ can call the isEmail method on any NSString instance, like this:\n\n```\nNSString\
    \ *email = @\"weimenglee@gmail.com\";\nif ([email isEmail]) {\n    //...\n}\n\
    ```\n\nTo do so, you can simply create a new class file and code it as follows:\n\
    \n```\n//---utils.h---\n#import <Foundation/Foundation.h>\n\n//---NSString is\
    \ the class you are extending---\n@interface NSString (stringUtils)\n\n//---the\
    \ method you are adding to the NSString class---\n- (BOOL) isEmail;\n\n@end\n\
    ```\n\nBasically, it looks the same as declaring a new class except that it does\
    \ not inherit from any other class. The stringUtils is a name that identifies\
    \ the category you are adding, and you can use any name you want.\n\nNext, you\
    \ need to implement the method(s) you are adding:\n\n```\n//---utils.m---\n#import\
    \ \"Utils.h\"\n\n@implementation NSString (Utilities)\n\n- (BOOL) isEmail {\n\
    \    NSString *emailRegEx = @\"(?[a-z0-9!#$%&'*+/=?^_`{|}~]+(?:\\.[a-z0-9!#$%&'*+/=?^_`{|}~]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\\
    .)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)\";\n    NSPredicate *regExPredicate = [NSPredicate\
    \ predicateWithFormat:@\"SELF MATCHES %@\", emailRegEx];\n    return [regExPredicate\
    \ evaluateWithObject:self];\n}\n\n@end\n```"
  merge: -1
  img_proc: true
- pgno: 579
  md: "> NOTE The code for validating an email address using regular expression is\
    \ adapted from http://cocoawithlove.com/2009/06/verifying-that-string-is-email-address.html.\n\
    \nYou can then test for the validity of an email address using the newly added\
    \ method:\n\n```\nNSString *email = @\"weimenglee@gmail.com\";\nif ([email isEmail])\n\
    \    NSLog(@\"Valid email\");\nelse\n    NSLog(@\"Invalid email\");\n```"
