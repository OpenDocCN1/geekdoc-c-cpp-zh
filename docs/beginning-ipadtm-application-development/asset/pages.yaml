  md: '# How It Works


    This Try It Out generates the development certificate that you need to code sign
    your application so that it can be deployed to a real iPad for testing. The certificate
    installed in the Keychain Access application contains the private and public key
    pair. It is a good idea to back up the certificate at this juncture so that in
    the event you need to shift your development work to another computer, you can
    simply restore the certificate from the backup. Downloading the certificate from
    the iPhone Development portal and installing the certificate to another computer
    will not work because the certificate downloaded from Apple only contains the
    public key, and not the private key.


