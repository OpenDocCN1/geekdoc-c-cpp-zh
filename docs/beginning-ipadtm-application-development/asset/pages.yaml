  md: "```\n[button setTitle:@\"Click Me, Please!\"\n    forState:UIControlStateNormal];\n\
    button.backgroundColor = [UIColor clearColor];\nbutton.tag = 2000;\n```\n\nYou\
    \ then wire an event handler for its Touch Up Inside event so that when the button\
    \ is tapped, the buttonClicked: method is called:\n\n```\n[button AddTarget:Self\n\
    \    action:@selector(buttonClicked:)\n    forControlEvents:UIControlEventTouchUpInside];\n\
    ```\n\nFinally, you add the label and button views to the view you created earlier:\n\
    \n```\n[view addSubview:label];\n[view addSubview:button];\n```\n\nFinally, you\
    \ assign the view object to the view property of the current View Controller:\n\
    \n```\nself.view = view;\n```\n\n**WARNING** One important point to note here\
    \ is that within the loadView method, you should not get the value of the view\
    \ property (setting it is all right), like this:\n\n```\n[self.view addSubview:\
    \ label]; //---this is not OK---\nself.view = view; //---this is OK---\n```\n\n\
    *Trying to get the value of the view property in this method will result in a\
    \ circular reference and cause memory overflow.*\n\n# UNDERSTANDING VIEW HIERARCHY\n\
    \nAs views are created and added, they are added to a tree data structure. Views\
    \ are displayed in the order that they are added. To verify this, modify the location\
    \ of the UIButton object you created earlier by changing its location to CGRectMake(10,\
    \ 30, 300, 50), as in the following:\n\n```\n//---create a Button view---\nframe\
    \ = CGRectMake(10, 30, 300, 50);\nUIButton *button = [UIButton buttonWithType:UIButtonTypeRoundedRect];\n\
    button.frame = frame;\n[button setTitle:@\"Click Me, Please!\"\n    forState:UIControlStateNormal];\n\
    button.backgroundColor = [UIColor clearColor];\nbutton.tag = 2000;\n[button addTarget:self\n\
    \    action:@selector(buttonClicked:)\n    forControlEvents:UIControlEventTouchUpInside];\n\
    ```"
