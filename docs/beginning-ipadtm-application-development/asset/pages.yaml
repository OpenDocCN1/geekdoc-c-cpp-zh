    Interface Builder.

    +   3. Drag the Table View item from the Library and drop it onto the View window
    (see Figure 7-2).

    +   4. By default, the Table view fills up the entire View window. Resize the
    Table view to about a third of the width of the View window and set its Background
    color to a light yellow via the Attributes Inspector window (see Figure 7-3).'
