  md: "# How It Works\n\nLet's spend some time examining what you just did. First,\
    \ you create the SOAP request packet:\n\n```\nNSString *soapMsg =\n[NSString stringWithFormat:\n\
    @\"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?>\"\n@\"<soap:Envelope xmlns:xsi=\\\
    \"\"\n@\"http://www.w3.org/2001/XMLSchema-instance\\\" \"\n@\"xmlns:xsd=\\\"http://www.w3.org/2001/XMLSchema\\\
    \" \"\n@\"xmlns:soap=\\\"http://schemas.xmlsoap.org/soap/envelope/\\\">\"\n@\"\
    <soap:Body>\"\n@\"<FindCountryAsXml xmlns=\\\"http://www.ecubicle.net/webservices/\\\
    \">\"\n@\"<V4IPAddress>%@</V4IPAddress>\"\n@\"</FindCountryAsXml>\"\n@\"</soap:Body>\"\
    \n@\"</soap:Envelope>\", ipAddress.text\n];\n```\n\nNext, you create a URL load\
    \ request object using an instance of the NSMutableURLRequest and NSURL objects:\n\
    \n```\nNSURL *url = [NSURL URLWithString:@\"http://www.ecubicle.net/iptocountry.asmx\"\
    ];\nNSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];\n```\n\
    \nYou then populate the request object with the various headers, such as Content-Type,\
    \ SOAPAction, and Content-Length. You also set the HTTP method and HTTP body:\n\
    \n```\nNSString *msgLength = [NSString stringWithFormat:@\"%d\", [soapMsg length]];\n\
    [req addValue:@\"text/xml; charset=utf-8\" forHTTPHeaderField:@\"Content-Type\"\
    ];\n[req addValue:@\"http://www.ecubicle.net/webservices/FindCountryAsXml\" forHTTPHeaderField:@\"\
    SOAPAction\"];\n[req addValue:msgLength forHTTPHeaderField:@\"Content-Length\"\
    ];\n\n[req setHTTPMethod:@\"POST\"];\n[req setHTTPBody: [soapMsg dataUsingEncoding:NSUTF8StringEncoding]];\n\
    ```\n\nBefore you make the actual request to the Web service, you get the Activity\
    \ Indicator view to start animating, providing a visual feedback to the user that\
    \ the application is waiting for a response from the Web service:\n\n```\n[activityIndicator\
    \ startAnimating];\n```\n\nTo establish the connection with the Web service, you\
    \ use the NSURLConnection class together with the request object just created:\n\
    \n```\nconn = [[NSURLConnection alloc] initWithRequest:req delegate:self];\nif\
    \ (conn) {\n    webData = [[NSMutableData data] retain];\n}\n```\n\nThe NSURLConnection\
    \ object will now proceed to send the request to the Web service and asynchronously\
    \ call the various methods (which you will define next) when responses are received\
    \ from the Web service. The data method of the NSMutableData class returns an\
    \ empty data object. The NSMutableData object represents a wrapper for byte buffers,\
    \ which you will use to receive incoming data from the Web service."
