- pgno: 400
  md: '# 14


    # Web Services


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Understand the various ways to consume Web services in your iPad applications

    +   - How to communicate with a Web service using SOAP, HTTP GET, and HTTP POST

    +   - How to parse the result of a Web service call using the NSXMLParser class


    Communicating with the outside world is one of the ways to make your iPad applications
    interesting and useful. This is especially true today when so many Web services
    provide so much useful functionality. However, consuming Web services in iPad
    is not for the faint-of-heart. Unlike other development tools (such as Microsoft
    Visual Studio), Xcode does not have built-in tools that make consuming Web services
    easy. Everything must be done by hand and you need to know how to form the relevant
    XML messages to send to the Web services and then parse the returning XML result.


    This chapter explains how to communicate with XML Web services from within your
    iPad application. Using the examples in this chapter, you will have the solid
    foundation of consuming other Web services that you will need in your own projects.


    > NOTE For an introduction to XML Web services, check out this link: http://www.w3schools.com/webservices/ws_intro.asp.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# BASICS OF CONSUMING XML WEB SERVICES


    Before you create an Xcode project to consume a Web service, it is good to examine
    a real Web service to see the different ways you can consume it. My favorite example
    is to use an ASMX XML Web service created using .NET. For discussion purposes,
    let''s look at a Web service called IPToCountry, which allows you to supply an
    IP address and returns to you the country to which the IP address belongs.


    The IPToCountry Web service is located at http://www.ecubicle.net/iptocountry.asmx.
    If you use Safari to load this URL, you will see that it exposes two Web methods,
    as shown in Figure 14-1.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_401_0.png)


    FIGURE 14-1


    For this example, use the FindCountryAsXml method as an example, which returns
    the returning result (the country) as an XML string. Clicking the FindCountryAsXml
    link reveals the page shown in Figure 14-2.


    The important parts are the sections following the Test section shown on the page.
    They detail the various ways in which you can consume the Web service — SOAP,
    HTTP GET, and HTTP POST. In the .NET world, accessing the Web service is a pretty
    straightforward affair — Visual Studio provides a built-in tool to create a Web
    proxy service object for the Web service simply by downloading the WSDL document.
    For iPad development, you need to get your hands dirty, so you must understand
    the underlying mechanics of how to consume a Web service.


    # Using SOAP 1.1


    The first method to consume the Web service is using SOAP (Simple Object Access
    Protocol). When using SOAP, you need to use the POST method to send the following
    request to the Web service:


    ```

    POST /iptocountry.asmx HTTP/1.1

    Host: www.ecubicle.net

    Content-Type: text/xml; charset=utf-8

    Content-Length: length

    SOAPAction: "http://www.ecubicle.net/webservices/FindCountryAsXml"

    ```


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    ```'
