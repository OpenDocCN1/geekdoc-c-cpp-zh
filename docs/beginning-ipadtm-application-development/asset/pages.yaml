- pgno: 187
  md: '11. That''s it. Press Command-R in Xcode to deploy the application onto the
    iPhone Simulator. Then, try the following:


    +   - Click the TextField view to bring up the keyboard.

    +   - When you are done, click the Return key on the keyboard to dismiss it. Alternatively,
    click any of the empty spaces outside the TextField view to dismiss the keyboard.


    # How It Works


    In this example, you added a Round Rect Button view to cover up all the empty
    spaces in the View window of your application. Essentially, the button acts as
    a net to trap all touches outside of the TextField view on the View window. So
    when the user clicks (or taps, on a real device) the screen outside the keyboard
    and the TextField view, the Round Rect Button fires the Touch Up Inside event,
    which is handled by the bgTouched: action. In the bgTouched: action, you explicitly
    asked textField to resign its First-Responder status, which causes the keyboard
    to disappear.


    The technique used in this example applies even if you have multiple TextField
    views on your view. Suppose you have three TextField views, with outlets named
    textField, textField2, and textField3. In that case, the bgTouched: action looks
    like this:


    ```

    ```objc

    -(IBAction) bgTouched:(id) sender{

    [textField resignFirstResponder];

    [textField2 resignFirstResponder];

    [textField3 resignFirstResponder];

    }

    ```

    ```


    So when the bgTouched: action is invoked, all three TextField views are asked
    to relinquish their First-Responder status. Calling the resignFirstResponder method
    on a view that is currently not the First Responder is harmless; hence, the preceding
    statements are safe and will not cause an exception during runtime.


    # UNDERSTANDING THE RESPONDER CHAIN


    The prior Try It Out is a good example of the responder chain in action. In the
    iPad, events passed through a series of event handlers known as the responder
    chain. As you touch the screen of your iPad, the iPad generates events that get
    passed up the responder chain. Each object in the responder chain checks to see
    if it can handle the event. In the preceding example, when the user taps on the
    Label view, the Label view checks to see if it can handle the event. Because the
    Label event does not handle the Touch event, it is passed up the responder chain.
    The large background button that you have added is now next in line to examine
    the event. Because it handles the Touch Up Inside event, the event is consumed
    by the button.


    In summary, objects higher up in the responder chain examine the event first and
    handle the event if it is applicable. Any object can then stop the propagation
    of the event up the responder chain, or pass the event up the responder chain
    if it only partially handles the event.'
