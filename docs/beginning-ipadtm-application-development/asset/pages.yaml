- pgno: 182
  md: '+   3. Save the KeyboardInputsViewController.xib file.

    +   4. In the KeyboardInputsViewController.m file, provide the implementation
    for the doneEditing: action:

    +   5. Save the project and press Command-R to run the application on the iPhone
    Simulator.

    +   6. When the application appears on the iPhone Simulator, tap the TextField
    view. The keyboard should appear. Using the keyboard, type some text into the
    view and click the Return key when you are done. The keyboard now goes away.


    ```

    #import "KeyboardInputsViewController.h"


    @implementation KeyboardInputsViewController


    -(IBAction) doneEditing:(id) sender{

    [sender resignFirstResponder];

    }

    ```


    # How It Works


    What you have just done is connect the Did End on Exit event of the TextField
    view with the doneEditing: action you have created. When you are editing the content
    of a TextField view using the keyboard, clicking the Return key on the keyboard
    fires the Did End on Edit event of the TextField view. In this case, it invokes
    the doneEditing: action, which contains the following statement:


    ```

    [sender resignFirstResponder];

    ```


    The sender in this case refers to the TextField view, and resignFirstResponder
    asks the TextField view to resign its First-Responder status. Essentially, it
    means that you do not want to interact with the TextField view anymore and that
    the keyboard is no longer needed. Hence, the keyboard should hide itself.


    > NOTE The First Responder in a view always refers to the current view that the
    user is interacting with. In this example, when you click the TextField view,
    it becomes the First Responder and activates the keyboard automatically.


    An alternative way of hiding the keyboard is when the user taps an area outside
    of the TextField view. This method is more natural and does not require the user
    to manually tap on the Return key on the keyboard to hide the keyboard. The following
    Try It Out shows how this method can be implemented.


    # TRY IT OUT Dismissing the Keyboard (Technique 2)


    +   1. Using the KeyboardInputs project, double-click the KeyboardInputsViewController.xib
    file to edit it using Interface Builder.'
