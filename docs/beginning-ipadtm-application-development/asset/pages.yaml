  md: '![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_535_0.png)


    FIGURE B-7


    Xcode automatically recognizes the code you are typing and inserts the relevant
    parameters'' placeholders. For example, if you invoke the methods of an object,
    Xcode inserts the placeholders of the various parameters. Figure B-8 shows an
    example of the placeholders inserted for the UIAlertView object after you type
    “i”. To accept the placeholders for the various parameters, press the Tab key
    (you can also press the Enter key, or Ctrl-/)


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_535_1.png)


    FIGURE B-8


    Press Ctrl-/ to move to each parameter placeholder and then enter a value. Alternatively,
    click each placeholder and type over it.


    # Running the Application


    To execute an application, you first select the active SDK to use. You also choose
    whether you want to test it on a real device or use the included iPhone Simulator
    (the iPhone Simulator 3.2 emulates the iPad). You do so by selecting from the
    Overview list (see Figure B-9).


    To run the application, press Command-R, and Xcode builds and deploys the application
    onto the selected device or simulator.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_535_2.png)


    FIGURE B-9'
