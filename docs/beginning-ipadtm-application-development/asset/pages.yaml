- pgno: 354
  md: "# How It Works\n\nYou create an instance of the UIPanGestureRecognizer class\
    \ and connect it to a handler method:\n\n```\nUIPanGestureRecognizer *panGesture\
    \ =\n    [[UIPanGestureRecognizer alloc]\n        initWithTarget:self\n      \
    \      action:@selector(handlePanGesture:)];\n\n[imageView addGestureRecognizer:panGesture];\n\
    [panGesture release];\n```\n\nWhen a panning gesture is recognized, the handlePanGesture:\
    \ method is invoked. Panning is a continuous gesture, so this method is called\
    \ repeatedly.\n\nTo obtain the amount of panning, you examine the translation\
    \ property of the UIPanGestureRecognizer object:\n\n```\nCGPoint translation =\
    \ [(UIPanGestureRecognizer *) sender translationInView:imageView];\n```\n\nTo\
    \ ensure that the ImageView can be moved from its last drawn position, you save\
    \ the current panning amount when the gesture ends:\n\n```\nif (sender.state ==\
    \ UIGestureRecognizerStateEnded) {\n    netTranslation.x += translation.x;\n \
    \   netTranslation.y += translation.y;\n}\n```\n\nFinally, you move the ImageView\
    \ using the CGAffineTransformMakeTranslation() method:\n\n```\nsender.view.transform\
    \ = CGAffineTransformMakeTranslation(\n                        netTranslation.x\
    \ + translation.x,\n                        netTranslation.y + translation.y);\n\
    ```\n\n# Swiping\n\nAnother common gesture that you will encounter is the swipe.\
    \ Using the swipe gesture, a user touches the screen with his finger, moves it\
    \ in a particular direction, and then lifts it off the screen. The swipe gesture\
    \ is commonly used for switching between views (such as viewing a series of photos\
    \ in the Photos application).\n\nThe following Try It Out illustrates how to use\
    \ the UISwipeGestureRecognizer to recognize the swipe gesture and then display\
    \ different images in the ImageView.\n\n# TRY IT OUT Recognizing Swiping\n\n+\
    \   1. Using the same project created in the previous Try It Out, drag and drop\
    \ the two images named Buildings.jpeg and Bridge.jpeg onto the Resources folder\
    \ of the Xcode project. When the Add dialog appears, check the Copy Item into\
    \ Destination Group's Folder (If Needed) option so that each image is copied into\
    \ the project (see Figure 12-8)."
