  md: "When the view has loaded, you create an instance of the MKMapView class and\
    \ set the map type (hybrid — map and satellite) to display:\n\n```\n```objc\n\
    //---display the map in a region---\nmapView = [[MKMapView alloc]\n    initWithFrame:CGRectMake(10,\
    \ 60, 1004, 678)];\n\nmapView.delegate = self;\nmapView.mapType = MKMapTypeHybrid;\n\
    \n[self.view addSubview:mapView];\n```\n```\n\nIn this case, you specify the size\
    \ of the map to display. You set the delegate property to self so that the view\
    \ controller can implement all the method declared in the MKMapViewDelegate protocol.\n\
    \nTo fill up the entire View window with the map, you would use the following\
    \ statement:\n\n```\n```objc\n//---fill up entire screen---\nmapView = [[MKMapView\
    \ alloc] initWithFrame:self.view.bounds];\n```\n```\n\nWhen the location information\
