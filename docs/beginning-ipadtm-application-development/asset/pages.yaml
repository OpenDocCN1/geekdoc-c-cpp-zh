    # How It Works


    First, examine the animation that is applied to the MySecondViewController. You
    perform the animation by first calling the beginAnimations: method of the UIView
    class to start the animation block:


    ```

    [UIView beginAnimations:@"flipping view" context:nil];

    ```


    The setAnimationDuration: method specifies the duration of the animation in seconds.
    Here, you set it to one second:


    ```

    [UIView setAnimationDuration:1];

    ```


    The setAnimationCurve: method sets the curve of the animating property changes
    within an animation:


    ```

    [UIView setAnimationCurve:UIViewAnimationCurveEaseInOut];

    ```


    You can use the following constants for the curve of the animation:


    +   - UIViewAnimationCurveEaseInOut — Causes the animation to begin slowly, accelerate
    through the middle of its duration, and then slow again before completing

    +   - UIViewAnimationCurveEaseIn — Causes the animation to begin slowly and then
    speed up as it progresses'
