  md: "Notice that the UITableViewCell object already has the imageView property.\
    \ All you need to do is to create an instance of the UIImage class and then load\
    \ the image from the Resources folder of your project.\n\n# Displaying the Item\
    \ Selected\n\nSo far, you have seen how to populate the Table view with items\
    \ by ensuring that your View Controller conforms to the UITableViewDataSource\
    \ protocol. This protocol takes care of populating the Table view, but if you\
    \ want to select the items in a Table view, you need to conform to another protocol,\
    \ UITableViewDelegate.\n\nThe UITableViewDelegate protocol contains events that\
    \ allow you to manage selections, edit and delete rows, and display a header and\
    \ footer.\n\nTo use the UITableViewDelegate protocol, modify the TableViewExampleViewController.h\
    \ file by adding the bold statement as follows:\n\n```\n#import <UIKit/UIKit.h>\n\
    \n@interface TableViewExampleViewController : UIViewController\n<UITableViewDataSource,\
    \ UITableViewDelegate>{\n}\n\n@end\n```\n\nAgain, if you have connected the delegate\
    \ outlet to the File's Owner item previously, you don't really need to add the\
    \ preceding statement (UITableViewDelegate). However, doing both doesn't hurt.\n\
    \nThe following Try It Out shows how you can allow users to make selections in\
    \ a Table view.\n\n# TRY IT OUT  Making a Selection in a Table View\n\n+   1.\
    \ Using the same project created earlier, add the following statements that appear\
    \ in bold to the TableViewExampleViewController.m file:\n\n```\n#import \"TableViewExampleViewController.h\"\
    \n\n@implementation TableViewExampleViewController\n\nNSMutableArray *listOfMovies;\n\
    \n- (void)tableView:(UITableView *)tableView\ndidSelectRowAtIndexPath:(NSIndexPath\
    \ *)indexPath {\n    NSString *movieSelected = [listOfMovies objectAtIndex:[indexPath\
    \ row]];\n    NSString *msg = [[NSString alloc] initWithFormat:@\"You have selected\
    \ %@\", movieSelected];\n    \n    UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"\
    Movie selected\"\n                                                     message:msg\n\
    \                                                    delegate:self\n```"
  merge: -1
