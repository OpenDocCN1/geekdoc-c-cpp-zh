- pgno: 395
  md: "In the doneEditing: method (which is fired when the user dismisses the keyboard\
    \ by tapping the return key), you make the View the first responder:\n\n```\n\
    - (IBAction) doneEditing: (id) sender {\n  //---when keyboard is hidden, make\
    \ the view\n  // the first responder\n  // or else the Shake API will not work---\n\
    \  [self.view becomeFirstResponder];\n}\n```\n\nIf you don't do this, the three\
    \ motion-sensing events are not fired. The key point to remember is that something\
    \ must be the first responder.\n\nThe motionBegan: event is fired when the OS\
    \ suspects that the device is being shaken. If eventually the OS determines that\
    \ the action is not a shake, the motionCancelled: event is fired. When the OS\
    \ finally determines that the action is a shake action, the motionEnded: event\
    \ is fired.\n\n# Performing an Action When the Device Is Shaken\n\nNow modify\
    \ your project so that when the iPad is shaken, the DatePicker view is reset to\
    \ today's date.\n\n# TRY IT OUT  Resetting the DatePicker when Shaken\n\n1. In\
    \ the ShakeViewController.m file, add the following statements that appear in\
    \ bold:\n\n```\n- (void)ResetDatePicker {\n  [datePicker setDate:[NSDate date]];\n\
    }\n\n- (void)motionEnded:(UIEventSubtype)motion withEvent:(UIEvent *)event {\n\
    \  if (event.subtype == UIEventSubtypeMotionShake) {\n    NSLog(@\"motionEnded:\"\
    );\n    [self ResetDatePicker];\n  }\n}\n```\n\n2. Press Command-R to test the\
    \ application on the iPhone Simulator. Set the DatePicker view to some date. Choose\
    \ Hardware ⇧ Shake Gesture to simulate shaking the device. Notice that the DatePicker\
    \ view now resets to today's date.\n\n# How It Works\n\nIn this example, you first\
    \ added a ResetDatePicker method to reset the DatePicker view to today's date:\n\
    \n```\n- (void)ResetDatePicker {\n  [datePicker setDate:[NSDate date]];\n}\n```"
