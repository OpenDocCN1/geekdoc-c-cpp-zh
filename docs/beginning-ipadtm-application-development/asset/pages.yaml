- pgno: 411
  md: "When data starts streaming in from the Web service, the connection:didReceiveResponse:\
    \ method will be called, which you need to implement here:\n\n```\n```objc\n-(void)\
    \ connection:(NSURLConnection *) connection\ndidReceiveResponse:(NSURLResponse\
    \ *) response {\n    [webData setLength: 0];\n}\n```\n```\n\nHere, you will initialize\
    \ the length of webData to zero.\n\nAs the data progressively comes in from the\
    \ Web service, the connection:didReceiveData: method will be called. Here, you\
    \ will append the data received to the webData object:\n\n```\n```objc\n-(void)\
    \ connection:(NSURLConnection *) connection\n    didReceiveData:(NSData *) data\
    \ {\n    [webData appendData:data];\n}\n```\n```\n\nIf there is an error during\
    \ the transmission, the connection:didFailWithError: method will be called:\n\n\
    ```\n```objc\n-(void) connection:(NSURLConnection *) connection\ndidFailWithError:(NSError\
    \ *) error {\n    [webData release];\n    [connection release];\n}\n```\n```\n\
    \nIt is important that you handle the communication failure gracefully so that\
    \ the user can try again later.\n\nWhen the connection has finished and successfully\
    \ downloaded the response, the connectionDidFinishLoading: method is called:\n\
    \n```\n```objc\n-(void) connectionDidFinishLoading:(NSURLConnection *) connection\
    \ {\n    NSLog(@\"DONE. Received Bytes: %d\", [webData length]);\n    NSString\
    \ *theXML = [[NSString alloc]\n        initWithBytes: [webData mutableBytes]\n\
    \        length:[webData length]\n        encoding:NSUTF8StringEncoding];\n  \
    \  //---shows the XML---\n    NSLog(theXML);\n    [theXML release];\n\n    [activityIndicator\
    \ stopAnimating];\n\n    [connection release];\n    [webData release];\n}\n```\n\
    ```\n\nHere, you simply print the XML response received from the Web service to\
    \ the Debugger Console window and then stop the Activity Indicator view from animating."
  merge: -1
  img_proc: true
- pgno: 412
  md: "# Using HTTP POST to Talk to a Web Service\n\nYou can also use the HTTP POST\
    \ method to communicate with the Web service. To talk to a Web service using HTTP\
    \ POST, you just need to modify the buttonClicked: method, like this:\n\n```\n\
    - (IBAction)buttonClicked:(id)sender {\n\nNSString *postString =\n    [NSString\
    \ stringWithFormat:@\"V4IPAddress=%@\", ipAddress.text];\n\nNSLog(postString);\n\
    \nNSURL *url = [NSURL URLWithString:\n    @\"http://www.ecubicle.net/ipcountry.asmx/FindCountryAsXml\"\
    ];\nNSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:url];\nNSString\
    \ *msgLength = [NSString stringWithFormat:@\"%d\", [postString length]];\n\n[req\
    \ addValue:@\"application/x-www-form-urlencoded\"\n    forHTTPHeaderField:@\"\
    Content-Type\"];\n[req addValue:msgLength forHTTPHeaderField:@\"Content-Length\"\
    ];\n\n[req setHTTPMethod:@\"POST\"];\n[req setHTTPBody: [postString dataUsingEncoding:NSUTF8StringEncoding]];\n\
    \n[activityIndicator startAnimating];\nconn = [[NSURLConnection alloc]initWithRequest:req\
    \ delegate:self];\nif (conn) {\n    webData = [[NSMutableData data] retain];\n\
    }\n}\n```\n\nBasically, you do away with forming the SOAP message and simply post\
    \ a single string to the Web service, such as:\n\n```\nV4IPAddress=34.5.6.7\n\
    ```\n\n> NOTE Note that in order for HTTP POST to work, the Web service must support\
    \ the HTTP POST method. Always refer to the documentation of the Web service (or\
    \ the test page shown in Figure 14-2) to confirm if the Web service supports HTTP\
    \ POST.\n\nThe result returned from the Web service will look like this:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<IPCountryService>\n    <Country>United\
    \ States</Country>\n</IPCountryService>\n```"
  merge: -1
  img_proc: true
- pgno: 413
  md: "# Using HTTP GET to Talk to a Web Service\n\nUsing HTTP GET to talk to a Web\
    \ service is even simpler than using HTTP POST because all the request information\
    \ is passed via the query string. The following shows the modified buttonClicked:\
    \ method to access the Web service using HTTP GET:\n\n```\n- (IBAction)buttonClicked:\
    \ (id)sender {\n    NSString *queryString =\n        [NSString stringWithFormat:\n\
    \         @\"http://www.ecubicle.net/iptocountry.asmx/FindCountryAsXml?V4IPAddress=%@\"\
    ,\n         ipAddress.text];\n    \n    NSURL *url = [NSURL URLWithString:queryString];\n\
    \    NSURLConnection *req = [NSURLConnection requestWithURL:url];\n    \n    [req\
    \ addValue:@\"text/xml; charset=utf-8\" forHTTPHeaderField:@\"Content-Type\"];\n\
    \    [req addValue:0 forHTTPHeaderField:@\"Content-Length\"];\n    \n    [req\
    \ setHTTPMethod:@\"GET\"];\n    \n    [activityIndicator startAnimating];\n  \
    \  \n    conn = [[NSURLConnection alloc] initWithRequest:req delegate:self];\n\
    \    if (conn) {\n        webData = [[NSMutableData data] retain];\n    }\n}\n\
    ```\n\nLook at the Debugger Console when you run the modified application, and\
    \ you should see the response like this:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<IPCountryService>\n    <Country>United States</Country>\n</IPCountryService>\n\
    ```\n\n> NOTE Note that in order for HTTP GET to work, the Web service must support\
    \ the HTTP GET method. Always refer to the documentation of the Web service (or\
    \ the test page shown in Figure 14-2) to confirm if the Web service supports HTTP\
    \ GET.\n\n# PARSING THE XML RESPONSE\n\nIn the iPhone SDK, you can use the NSXMLParser\
    \ object to parse an XML response returned by the Web service. The NSXMLParser\
    \ class is an implementation of the Simple API for XML (SAX) mechanism, which\
    \ parses an XML document serially."
