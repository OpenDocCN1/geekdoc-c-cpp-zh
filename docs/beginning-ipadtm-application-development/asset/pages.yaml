  md: "# How It Works\n\nThere is quite a bit of coding involved here. So, let's take\
    \ a more detailed look.\n\nFirst, you defined the browseServices method, which\
    \ uses the NSNetServiceBrowser class to search for the service named \"_MyService._tcp.\"\
    \ in the default domain:\n\n```\nservices = [NSMutableArray new];\nself.browser\
    \ = [[NSNetServiceBrowser new] autorelease];\nself.browser.delegate = self;\n\
    [self.browser searchForServicesOfType:@\"_MyService._tcp.\" inDomain:@\"\"];\n\
    ```\n\nAs services are discovered, the netServiceBrowser:didFindService:moreComing:\
    \ method will be called. In this method, you add all the discovered services into\
    \ the services mutable array:\n\n```\n-(void)netServiceBrowser:(NSNetServiceBrowser\
    \ *)aBrowser\n    didFindService:(NSNetService *)aService\n    moreComing:(BOOL)more\
    \ {\n    [services addObject:aService];\n    debug.text = [debug.text stringByAppendingString:\n\
    \        @\"Found service. Resolving address...\\n\"];\n    [self resolveIPAddress:aService];\n\
    }\n```\n\nYou also try to resolve the IP address of the discovered service by\
    \ calling the resolveIPAddress: method, which you will define.\n\nThe resolveIPAddress:\
    \ method uses the resolveWithTimeout: method of the NSNetService instance (representing\
    \ the service that was discovered) to obtain its IP addresses:\n\n```\n-(void)\
    \ resolveIPAddress:(NSNetService *)service {\n    NSNetService *remoteService\
    \ = service;\n    remoteService.delegate = self;\n    [remoteService resolveWithTimeout:0];\n\
    }\n```\n\nIf it managed to resolve the IP addresses of the service, the netServiceDidResolveAddress:\
    \ method will be called. If it did not manage to resolve the IP address, the netService:didNotResolve:\
    \ method will be called.\n\nIn the netServiceDidResolveAddress: method, you extract\
    \ all the available IP addresses of the service and display them on the TextView.\
    \ You then try to reload the Table view using the reloadData method of the UITableView\
    \ class.\n\n```\n-(void)netServiceDidResolveAddress:(NSNetService *)service {\n\
    \    NSString        *name = nil;\n    NSData          *address = nil;\n    struct\
    \ sockaddr_in *socketAddress = nil;\n    NSString        *ipString = nil;\n  \
    \  int             port;\n    for(int i=0;i < [[service addresses] count]; i++\
    \ ) {\n        name = [service name];\n```"
  merge: -1
