    \ object:\n\n```\n```objc\n//---update the map---\nMKCoordinateSpan span;\nspan.latitudeDelta=.001;\n\
    span.longitudeDelta=.001;\n\nMKCoordinateRegion region;\nregion.center = newLocation.coordinate;\n\
    region.span = span;\n\n[mapView setRegion:region animated:TRUE];\n```\n```\n\n\
