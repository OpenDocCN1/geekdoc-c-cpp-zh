- pgno: 573
  md: "In this example, for each iteration of the loop, an NSAutoreleasePool object\
    \ is created, and all the autorelease objects created within the loop — str1,\
    \ str2, and str3 — go into it. At the end of each iteration, the NSAutoreleasePool\
    \ object is released so that all the objects contained within it are automatically\
    \ released. This ensures that you have at most three autorelease objects in memory\
    \ at any one time.\n\n# dealloc\n\nYou have learned that by using the alloc or\
    \ the new keyword, you own the object that you have created. You have also seen\
    \ how to release the objects you own using the release or autorelease keyword.\
    \ So when is a good time for you to release them?\n\nAs a rule of thumb, you should\
    \ release the objects as soon as you are done with them. So if you created an\
    \ object in a method, you should release it before you exit the method. For properties,\
    \ recall that you can use the @property compiler directive together with the retain\
    \ keyword:\n\n```\n@property (retain, nonatomic) NSString *name;\n```\n\nBecause\
    \ the values of the property will be retained, it is important that you free it\
    \ before you exit the application. A good place to do so is in the dealloc method\
    \ of a class (such as a View Controller):\n\n```\n-(void) dealloc {\n    [self.name\
    \ release];    //---release the name property---\n    [super dealloc];\n}\n```\n\
    \nThe dealloc method of a class is fired whenever the reference count of its object\
    \ reaches 0. Consider the following example:\n\n```\nSomeClass *sc1 = [[SomeClass\
    \ alloc] initWithName:@\"Wei-Meng Lee\" andRate:35];\n//...do something here...\n\
    [sc1 release];  //---reference count goes to 0; dealloc will be called---\n```\n\
    \nThe preceding example shows that when the reference count of sc1 goes to 0 (when\
    \ the release statement is called), the dealloc method defined within the class\
    \ will be called. If you do not define this method in the class, its implementation\
    \ in the base class will be called.\n\n# Memory Management Tips\n\nMemory management\
    \ is a tricky issue in iPad programming. Although there are tools that you can\
    \ use to test for memory leaks, this section presents some simple things you can\
    \ do to detect memory problems that might affect your application.\n\nFirst, ensure\
    \ that you implement the didReceiveMemoryWarning method in your View Controller:\n\
    \n```\n- (void)didReceiveMemoryWarning {\n    //---insert code here to free unused\
    \ objects---\n    [super didReceiveMemoryWarning];\n}\n```"
  merge: -1
  img_proc: true
- pgno: 574
  md: "The didReceiveMemoryWarning method will be called whenever your iPad runs out\
    \ of memory.\nYou should insert code in this method so that you can free resources/objects\
    \ that you do not need.\n\nIn addition, you should also handle the applicationDidReceiveMemoryWarning:\
    \ method in your application delegate:\n\n```\n- (void)applicationDidReceiveMemoryWarning:(UIApplication\
    \ *)application {\n    //---insert code here to free unused objects---\n    [[ImageCache\
    \ sharedImageCache] removeAllImagesInMemory];\n}\n```\n\nIn this method, you should\
    \ stop all memory-intensive activities, such as audio and video playback.\nYou\
    \ should also remove all images cached in memory.\n\n# PROTOCOLS\n\nIn Objective-C,\
    \ a protocol declares a programmatic interface that any class can choose to implement.\n\
    A protocol declares a set of methods, and an adopting class may choose to implement\
    \ one or more of its declared methods. The class that defines the protocol is\
    \ expected to call the methods in the protocols that are implemented by the adopting\
    \ class.\n\nThe easiest way to understand protocols is to examine the UIAlertView\
    \ class. As you have experienced in the various chapters in this book, you can\
    \ simply use the UIAlertView class by creating an instance of it and then calling\
    \ its show method:\n\n```\nUIAlertView *alert = [[UIAlertView alloc]\n    initWithTitle:@\"\
    Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n    cancelButtonTitle:@\"\
    OK\"\n    otherButtonTitles:nil];\n\n[alert show];\n```\n\nThe preceding code\
    \ displays an alert view with one button — OK. Tapping the OK button automatically\
    \ dismisses the alert view. If you want to display additional buttons, you can\
    \ set the otherButtonTitles: parameter like this:\n\n```\nUIAlertView *alert =\
    \ [[UIAlertView alloc]\n    initWithTitle:@\"Hello\"\n    message:@\"This is an\
    \ alert view\"\n    delegate:self\n    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:@\"\
    Option 1\", @\"Option 2\", nil];\n```\n\nThe alert view now displays three buttons\
    \ — OK, Option 1, and Option 2. But how do you know which button was tapped by\
    \ the user? You can determine this by handling the relevant method(s) that will\
    \ be fired by the alert view when the buttons are clicked. This set of methods\
    \ is defined by the UIAlertViewDelegate protocol. This protocol defines the following\
    \ methods:\n\n+   - alertView:clickedButtonAtIndex:\n+   - willPresentAlertView:"
