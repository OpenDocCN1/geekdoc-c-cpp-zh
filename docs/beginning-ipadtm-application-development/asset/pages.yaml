    \n# SUMMARY\n\nYou have seen how easy it is to connect two iPads (or iPhones and\
    \ iPod touches) using Bluetooth. Using the concepts shown in this chapter, you\
    \ can build networked games and other interesting applications easily. You also\
    \ saw how the Game Kit framework provides the GKVoiceChatService class that makes\
    \ voice communication between two devices seamless. There is no need for you to\
    \ know how the voices are transported between two devices — all you need to know\
    \ is to call the relevant methods to initialize the chat. One important point\
    \ you need to know, though — voice chat works not just over Bluetooth; it works\
    \ over any communication channel. In fact, if you have two devices connected using\
    \ TCP/IP, you can stream the voices over the wire.\n\n# EXERCISES\n\n+   1. What\
    \ is the class that you can use to locate peer Bluetooth devices?\n+   2. Name\
