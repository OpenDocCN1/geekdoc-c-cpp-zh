    }\n```\n\n# Bind Variables\n\nOne of the common tasks involved in formulating\
    \ SQL strings is the need to insert values into the query string and ensuring\
    \ that the string is well formulated and contains no invalid characters. In the\
    \ preceding section, you saw that to insert a row into the database, you had to\
    \ formulate your SQL statement like this:\n\n```\nNSString *sql = [NSString stringWithFormat:\n\
    \ @\"INSERT OR REPLACE INTO '%@' ('%@', '%@') VALUES ('%@', '%@')\",\n tableName,\
    \ field1, field2, field1Value, field2Value];\n\nchar *err;\nif (sqlite3_exec(db,\
    \ [sql UTF8String], NULL, NULL, &err) != SQLITE_OK) {\n sqlite3_close(db);\n NSAssert(0,\
    \ @\"Error updating table.\");\n}\n```\n\nSQLite supports a feature known as bind\
    \ variables to help you formulate your SQL string. For example, the preceding\
    \ SQL string can be formulated as follows using bind variables:\n\n```\nNSString\
    \ *sqlStr = [NSString stringWithFormat:\n @\"INSERT OR REPLACE INTO '%@' ('%@',\
    \ '%@') VALUES (?,?)\",\n tableName, field1, field2];\n\nconst char *sql = [sqlStr\
    \ UTF8String];\n```\n\nHere, the ? is a placeholder for you to replace with the\
    \ actual value of the query. In the preceding statement, assuming that tableName\
    \ is Contacts, field1 is email, and field2 is name, the sql is now:\n\n```\nINSERT\
    \ OR REPLACE INTO Contacts ('email', 'name') VALUES (?,?)\n```\n\n> NOTE The ?\
    \ can be inserted only into the VALUES and WHERE section of the SQL statement;\
    \ you cannot insert it into a table name, for example. The following statement\
    \ would be invalid:\n> INSERT OR REPLACE INTO ? ('email', 'name') VALUES (?,?)\n\
    \nTo substitute the values for the ?, create a sqlite3_stmt object and use the\
    \ sqlite3_prepare_v2() function to compile the SQL string into a binary form and\
    \ then insert the placeholder values using the sqlite3_bind_text() function, like\
    \ this:\n\n```\nsqlite3_stmt *statement;\n\nif (sqlite3_prepare_v2(db, sql, -1,\
    \ &statement, nil) == SQLITE_OK) {\n```"
