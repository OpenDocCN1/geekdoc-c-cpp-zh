  md: '# 16


    # Bonjour Programming


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - How to publish a service on the network using the `NSNetService` Class

    +   - How to discover for services on the network using the `NSNetServiceBrowser`
    class

    +   - How to resolve the IP addresses of services on the network so that you can
    communicate with them


    Bonjour is Apple''s implementation of the Zeroconf protocol, which enables the
    automatic discovery of computers, devices and services on an IP network. In this
    chapter, you will learn how to implement Bonjour on the iPad by using the `NSNetService`
    class to publish a service. You will also use the `NSNetServiceBrowser` class
    to discover services that have been published.


    # CREATING THE APPLICATION


    The first thing you will do is to create the user interface for the application.
    You''ll use a Table view to display the users that you have discovered on the
    network. As users are discovered, they will be added to the Table view.


    # TRY IT OUT Creating the UI of the Application


    +   1. Using Xcode, create a View-based Application project and name it Bonjour.

    +   2. Double-click the `BonjourViewController.xib` file to edit it in Interface
    Builder. Populate the View window with the following views (see Figure 16-1):

    +      - Label (set its text as "Discovered Users")

    +      - Table View

    +      - Text View'
