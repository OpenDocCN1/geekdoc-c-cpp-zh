- pgno: 73
  md: "Earlier in this chapter, you saw a window labeled HelloWorldViewController.xib.\
    \ Within this window are three components: File's Owner, First Responder, and\
    \ View Control-click the Round Rect Button view in the View window and drag it\
    \ to the File's Owner item in the HelloWorldViewController.xib window (see Figure\
    \ 2-20). A small pop-up containing the btnClicked: action appears. Select the\
    \ btnClicked: action. Basically, what you are doing here is linking the Round\
    \ Rect Button view with the action (btnClicked:) so that when the user clicks\
    \ the button, the action is invoked.\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_73_0.png)\n\
    \nFIGURE 2-20\n\nIn the HelloWorldViewController.m file, add the code that provides\
    \ the implementation for the btnClicked: action:\n\n```\n```objc\n#import \"HelloWorldViewController.h\"\
    \n\n@implementation HelloWorldViewController\n\n- (IBAction) btnClicked:(id) sender\
    \ {\n    //---display an alert view---\n    UIAlertView *alert = [[UIAlertView\
    \ alloc] initWithTitle:@\"Hello World!\"\n                                   \
    \                  message:@\"iPad, here I come!\"\n                         \
    \                           delegate:self\n                                  \
    \         cancelButtonTitle:@\"OK\"\n                                        \
    \   otherButtonTitles:nil];\n    [alert show];\n    [alert release];\n}\n```\n\
    ```\n\nThe preceding code displays an alert containing the sentence “iPad, here\
    \ I come!”\n\nThat’s it! Go back to Xcode and run the application again. This\
    \ time, when you click the Button view, an alert view displays (see Figure 2-21).\n\
    \n# CUSTOMIZING YOUR APPLICATION ICON\n\nAs you saw earlier, the application installed\
    \ on your iPhone Simulator uses a default white image as an icon. It is possible,\
    \ however, to customize this icon. When designing icons for your iPad applications,\
    \ bear the following in mind:\n\n+   - Design your icon to be 72 × 72 pixels.\
    \ Larger size is all right because iPad automatically sizes it for you. For distribution\
    \ through the App Store, you need to prepare a 512 × 512 pixel image."
  merge: -1
  img_proc: true
