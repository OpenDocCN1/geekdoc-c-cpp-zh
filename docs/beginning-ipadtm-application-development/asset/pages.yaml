  md: "![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_364_0.png)\n\n+   5. Select the ImageView\
    \ and view its Attributes Inspector window (see Figure 12-11). Set its Image property\
    \ to `apple.jpeg`.\n\n+   6. In the `MultiTouchViewController.h` file, add the\
    \ following statements that appear in bold:\n\n```\n    #import <UIKit/UIKit.h>\n\
    \n    @interface MultiTouchViewController : UIViewController {\n        IBOutlet\
    \ UIImageView *imageView;\n    }\n\n    @property (nonatomic, retain) UIImageView\
    \ *imageView;\n\n    @end\n```\n\n+   7. Back in Interface Builder, Control-click\
    \ and drag the File’s Owner item to the ImageView. Select `ImageView`.\n\n+  \
    \ 8. In the `MultiTouchViewController.m` file, add the following statements that\
    \ appear in bold:\n\n```\n    #import \"MultiTouchViewController.h\"\n\n    @implementation\
