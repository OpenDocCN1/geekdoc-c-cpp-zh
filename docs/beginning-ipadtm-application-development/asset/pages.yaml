  md: "NOTE The accelerometer used on the iPad gives a maximum reading of about +/-\
    \ 2.3 g with a resolution of about 0.018 g.\n\nIn the following Try it Out, you\
    \ programmatically access the data returned by the accelerometer. Obtaining the\
    \ accelerometer data allows you to build very interesting applications, such as\
    \ a spirit level, as well as games that depend on motion detection.\n\n# TRY IT\
    \ OUT Accessing the Accelerometer Data\n\ncodefile Accelerometer.zip available\
    \ for download at Wrox.com\n\n+   1. Using Xcode, create a new View-based Application\
    \ project and name it Accelerometer.\n+   2. Double-click the AccelerometerViewController.xib\
    \ file to edit it in Interface Builder.\n+   3. Populate the View window with\
    \ the six Label views, as shown in Figure 13-2. Label the three labels on the\
    \ left as X-axis, Y-axis, and Z-axis.\n+   4. In the AccelerometerViewController.h\
    \ file, add the following statements that appear in bold:\n+   5. In Interface\
    \ Builder, Control-click and drag the File’s Owner item to each of the three Label\
    \ views (on the right) and select labelX, labelY, and labelZ, respectively.\n\n\
    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_386_0.png)\n\nFIGURE 13-2\n\n```\n#import\
    \ <UIKit/UIKit.h>\n\n@interface AccelerometerViewController : UIViewController\
    \ <UIAccelerometerDelegate> {\n    IBOutlet UILabel *labelX;\n    IBOutlet UILabel\
    \ *labelY;\n    IBOutlet UILabel *labelZ;\n}\n\n@property (nonatomic, retain)\
    \ UILabel *labelX;\n@property (nonatomic, retain) UILabel *labelY;\n@property\
