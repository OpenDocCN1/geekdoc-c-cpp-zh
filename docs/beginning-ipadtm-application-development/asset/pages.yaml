    >\n      <V4IPAddress>string</V4IPAddress>\n    </FindCountryAsXml>\n  </soap:Body>\n\
    </soap:Envelope>\n```\n\nThe Content-Length of the SOAP request is the total number\
    \ of characters of the SOAP request.\n\nThe Web service will return the following\
    \ response:\n\n```\nHTTP/1.1 200 OK\nContent-Type: text/xml; charset=utf-8\nContent-Length:\
    \ length\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \ xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n \
    \   <FindCountryAsXmlResponse xmlns=\"http://www.ecubicle.net/webservices/\">\n\
    \      <FindCountryAsXmlResult>xml</FindCountryAsXmlResult>\n    </FindCountryAsXmlResponse>\n\
    \  </soap:Body>\n</soap:Envelope>\n```\n\nIn particular, the result (country)\
    \ will be enclosed within the block of XML results. You would need to extract\
    \ it from the XML result.\n\n# Using SOAP 1.2\n\nUsing SOAP 1.2 is very similar\
    \ to using SOAP 1.1. The following shows the SOAP request for SOAP 1.2:\n\n```\n\
    POST /iptocountry.asmx HTTP/1.1\nHost: www.ecubicle.net\nContent-Type: application/soap+xml;\
    \ charset=utf-8\nContent-Length: length\n\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<soap12:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"\
    http://www.w3.org/2001/XMLSchema\" xmlns:soap12=\"http://www.w3.org/2003/05/soap-envelope\"\
    >\n  <soap12:Body>\n    <FindCountryAsXml xmlns=\"http://www.ecubicle.net/webservices/\"\
    >\n      <V4IPAddress>string</V4IPAddress>\n    </FindCountryAsXml>\n  </soap12:Body>\n\
    </soap12:Envelope>\n```"
