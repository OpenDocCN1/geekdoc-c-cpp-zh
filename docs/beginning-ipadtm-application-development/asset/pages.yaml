- pgno: 474
  md: "# How It Works\n\nBasically, the role of the provider is to send notifications\
    \ to the APNs server for relaying to the devices. Hence, you are sending a message\
    \ of the following format:\n\n```\n{\n  \"aps\": {\n    \"alert\" : \"You got\
    \ a new message!\" ,\n    \"badge\" : 5,\n    \"sound\" : \"beep.wav\"},\n  \"\
    acme1\" : \"bar\",\n  \"acme2\" : 42\n}\n```\n\nEssentially, the beep.wav file\
    \ name indicates to the client to play the beep.wav file when the notification\
    \ is received.\n\n# SUMMARY\n\nIn this chapter, you have seen the various steps\
    \ required to build an iPad application that utilizes the Apple Push Notification\
    \ service. Take some time to go through the steps to obtain your development certificates\
    \ and provisioning profile, for they commonly trip up a developer. But once you\
    \ get it working, the effort is well worth it!\n\n# EXERCISES\n\n+   1. Name the\
    \ two certificates that you need to generate for using Apple Push Notification\
    \ service.\n+   2. Why is it recommended that you back up the development certificate\
    \ in the Keychain Access application?\n+   3. Name the method for registering\
    \ for push notifications.\n+   4. What is the use of the device token?\n+   5.\
    \ Name the event where you can obtain the notification pushed to your device.\n\
    \nAnswers to the Exercises can be found in Appendix A."
