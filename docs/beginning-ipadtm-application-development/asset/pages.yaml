    # BUNDLING SQLITE DATABASES WITH YOUR APPLICATION


    While programmatically creating a SQLite database and using it during runtime
    is very flexible, most of the time you just need to create the database file during
    the designing stage of your development and bundle the database with your application
    so that it could be used during runtime. So instead of creating the database file
    using code, you need to create it in Mac OS X.


    Fortunately, you can easily create a SQLite database file in Mac OS X by using
    the `sqlite3` application in Terminal. Figure 10-4 shows the command that you
    need to create a database named `mydata.sql`, containing a table named `Contacts`
    with two fields `email` and `name`. It also inserts a row into the table and then
    retrieves it out to verify that it is inserted properly.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_316_0.png)


    FIGURE 10-4'
