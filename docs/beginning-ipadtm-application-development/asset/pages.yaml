  md: "# CREATING AND OPENING A DATABASE\n\nAfter the necessary library is added to\
    \ the project, you can open a database for usage. You will use the various C functions\
    \ included with SQLite3 to create or open a database, as demonstrated in the following\
    \ Try It Out.\n\n# TRY IT OUT Opening a Database\n\n+   1. Using the Databases\
    \ project created previously, define the openDB method in the DatabasesViewController.m\
    \ file:\n\n```\n#import \"DatabasesViewController.h\"\n\n@implementation DatabasesViewController\n\
    \n-(NSString *) filePath {\n    //...\n}\n\n-(void) openDB {\n    //---create\
    \ database---\n    if (sqlite3_open([[self filePath] UTF8String], &db) != SQLITE_OK\
