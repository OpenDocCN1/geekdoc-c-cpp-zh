- pgno: 44
  md: 'The iPhone Simulator can simulate different versions of the iPhone OS (see
    Figure 1-8). This capability is useful if you need to support older versions of
    the platform as well as testing and debugging errors reported in the application
    on specific versions of the OS.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_44_0.png)


    # FIGURE 1-7


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_44_1.png)


    # FIGURE 1-8'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Features of the iPhone Simulator


    The iPhone Simulator simulates various features of a real iPhone, iPod touch,
    or iPad device. Features you can test on the iPhone Simulator include:


    +   - Screen rotation — left, top, and right

    +   - Support for gestures:

    +     - Tap

    +     - Touch and Hold

    +     - Double Tap

    +     - Swipe

    +     - Flick

    +     - Drag

    +     - Pinch

    +   - Low-memory warning simulations


    However, the iPhone Simulator, being a software simulator for the real device,
    does have its limitations. Features not available on the iPhone Simulator include:


    +   - Making phone calls

    +   - Accessing the Accelerometer

    +   - Sending and receiving SMS messages

    +   - Installing applications from the App Store

    +   - Camera

    +   - Microphone

    +   - Several features of OpenGL ES


    > NOTE In the previous version of the SDK (3.1.3), the iPhone Simulator supports
    location data by always returning a fixed coordinate, such as Latitude 37.3317
    North and Longitude 122.0307 West. In the latest release of the SDK, the iPhone
    Simulator uses the location data of the Mac it is currently running on and returns
    the current location.


    It is worth noting that the speed of the iPhone Simulator is more tightly coupled
    to the performance of your Mac instead of the actual device. Therefore, it is
    important that you test your application on a real device rather than rely exclusively
    on the iPhone Simulator for testing.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Although you have limitations with the iPhone Simulator, it is definitely a
    useful tool to get your applications tested. That said, testing your application
    on a real iPad is imperative before you deploy it on the AppStore.


    # Uninstalling Applications from the iPhone Simulator


    The user domain of the iPhone OS file system for the iPhone Simulator is stored
    in the ~/Library/Application Support/iPhone Simulator/ folder.


    > NOTE The ~/Library/Application Support/iPhone Simulator/ folder is also known
    as the <iPhoneUserDomain>.


    All third-party applications are stored in the <iPhoneUserDomain>/<version_no>/Applications/
    folder. When an application is deployed onto the iPhone Simulator, an icon is
    created on the Home screen (shown on the left in Figure 1-9) and a file and a
    folder are created within the Applications folder (shown on the right in Figure
    1-9).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_46_0.png)


    FIGURE 1-9


    To uninstall (delete) an application, execute the following steps:


    +   1. Click and hold the icon of the application on the Home screen until all
    the icons start wriggling. Observe that all the icons now have an X button displayed
    on their top left corners.

    +   2. Click the X button (see Figure 1-10) next to the icon of the application
    you want to uninstall.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_46_1.png)


    FIGURE 1-10'
  merge: -1
  img_proc: true
- pgno: 47
  md: '3. An alert window appears asking if you are sure you want to delete the icon.
    Click Delete to confirm the deletion.


    > **WARNING** When the application is uninstalled, the corresponding files and
    folders in the Applications folder are deleted automatically.


    The easiest way to reset the iPhone Simulator to its original state is to select
    iPhone Simulator ▸ Reset Content and Settings.


    # Interface Builder


    Interface Builder is a visual tool that allows you to design your user interfaces
    for your iPad applications. Using Interface Builder, you drag and drop views on
    windows and then connect the various views with outlets and actions so that they
    can programmatically interact with your code.


    > **NOTE** Outlets and actions are discussed in more detail in Chapter 3 and Appendix
    C discusses Interface Builder in more detail.


    Figure 1-11 shows the various windows in Interface Builder.


    # Instruments


    The Instruments (see Figure 1-12) application allows you to dynamically trace
    and profile the performance of your Mac OS X, iPhone, and iPad applications.


    +   Using Instruments, you can:

    +   - Stress test your applications.

    +   - Monitor your applications for memory leaks.

    +   - Gain a deep understanding of the executing behavior of your applications.

    +   - Track difficult-to-reproduce problems in your applications.


    > **NOTE** Covering the Instruments application is beyond the scope of this book.
    For more information, refer to Apple''s documentation.'
  merge: -1
  img_proc: true
