- pgno: 548
  md: 'Although you can write code to connect actions and outlets, Interface Builder
    simplifies the process by allowing you to use the drag-and-drop technique.


    # Creating Outlets and Actions


    To create an action in Interface Builder, open the Library window and click the
    Classes tab. Select the View Controller that you are working on and then click
    the Actions tab at the lower part of the window (see Figure C-13; in this example
    the selected View Controller is HelloWorldViewController).


    Click the plus sign (+) button and name your action. Remember to include the colon
    (:) character at the end of the action name if you want to pass additional arguments
    in to the action (useful when you have multiple views connecting to an action).
    The colon character allows the action to have an input parameter of type id (which
    you can change to other types), like this:


    ```

    - (IBAction) myAction1:(id) sender;

    ```


    Be sure to note that in Figure C-13 the action is listed under the HelloWorldViewController.xib
    header. This is because the action is defined within Interface Builder.


    Likewise, click the Outlets tab to add an outlet to your View Controller. Click
    the plus sign (+) button in the Outlets section to create an outlet (see Figure
    C-14). It is always good to denote the specific type for the outlet that you are
    defining.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_548_0.png)


    FIGURE C-13


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_548_1.png)


    FIGURE C-14'
