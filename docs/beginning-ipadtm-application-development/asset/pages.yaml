- pgno: 501
  md: "# How It Works\n\nHow the map rotates is actually very simple. On first thought,\
    \ the easiest way would be to apply the transformation to the mapView. However,\
    \ doing not only rotates the map, it also rotates the entire rectangle (see Figure\
    \ 18-16).\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_501_0.png)\n\n# FIGURE 18-16\n\
    \nThe trick is to embed the mapView within another View view and rotate it within\
    \ the View. Hence, you added another View (viewForMap) in the View window and\
    \ set it to Clip Subviews. Essentially, all the views added to this View will\
    \ not display beyond its boundary.\n\nInstead of displaying the map in the original\
    \ size, you now need to set it to a minimum of 988.98 x 988.98 pixels (see Figure\
    \ 18-17). This is the length of the diagonal of the viewable rectangle of the\
    \ map. For simplicity, round it up to 1000 x 1000 pixels:\n\n```\n//---display\
    \ the map---\nmapView = [[MKMapView alloc]\n    initWithFrame:CGRectMake(-140,\
    \ -161, 1000,1000)];\n```\n\nThe mapView is now added to viewForMap, instead of\
    \ self.view:\n\n```\n//[self.view addSubview:mapView];\n[self.viewForMap addSubview:mapView];\n\
    ```\n\nRecall that the initial position of the mapView was (10, 60):\n\n```\n\
    initWithFrame:CGRectMake(10, 60,720,678)];\n```\n\nBut it must now be changed\
    \ to (-140, -161):\n\n```\ninitWithFrame:CGRectMake(-140, -161, 1000,1000)];\n\
    ```"
  merge: -1
  img_proc: true
