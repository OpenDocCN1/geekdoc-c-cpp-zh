- pgno: 233
  md: "For this event, to know which row has been selected, you simply call the row\
    \ property of the NSIndexPath object (indexPath) and then use the row number to\
    \ reference against the listOfMovies array:\n\n```\nNSString *movieSelected =\
    \ [listOfMovies objectAtIndex:[indexPath row]];\n```\n\nAfter the selected movie\
    \ is retrieved, you simply display it using the UIAlertView class:\n\n```\nNSString\
    \ *msg = [[NSString alloc] initWithFormat:@\"You have selected %@\", movieSelected];\n\
    UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"Movie selected\" message:msg\
    \ delegate:self cancelButtonTitle:@\"OK\" otherButtonTitles:nil];\n[alert show];\n\
    ```\n\n> NOTE The row property of the NSIndexPath class is one of the additions\
    \ made by the UIKit framework to enable the identification of rows and sections\
    \ in a Table view. So be aware that the original class definition of the NSIndexPath\
    \ class does not contain the row property.\n\n# Indenting\n\nAnother event in\
    \ the UITableViewDelegate protocol is tableView:indentationLevelForRowAtIndexPath:.\
    \ When you handle this event, it is fired for every row that is visible on the\
    \ screen. To set an indentation for a particular row, simply return an integer\
    \ indicating the level of indentation:\n\n```\n- (NSInteger)tableView:(UITableView\
    \ *)tableView indentationLevelForRowAtIndexPath:(NSIndexPath *)indexPath {\n \
    \   return [indexPath row] % 2;\n}\n```\n\nIn the preceding example, the indentation\
    \ alternates between 0 and 1, depending on the current row number. Figure 7-11\
    \ shows how the Table view looks if you insert the preceding code in the TableViewExampleViewController.m\
    \ file.\n\nIn real life, the Table view is often used with a Split View-based\
    \ Application because it is very common for users to select an item from a Table\
    \ view and then view the details of the item selected on the right side of the\
    \ screen. For this reason, the Split View-based Application template in the iPhone\
    \ SDK by default uses the UITableViewController class instead of the UIViewController\
    \ class. In addition, you can group items in a Table view into sections so that\
    \ you can add a header for each section."
  merge: -1
