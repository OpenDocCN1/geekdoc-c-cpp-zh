  md: "To display the movies for each section, you implement the tableView:cellForRowAtIndexPath:\
    \ method and extract the relevant movie titles from the NSDictionary object:\n\
    \n```\n- (UITableViewCell *)tableView:(UITableView *)tableView\ncellForRowAtIndexPath:(NSIndexPath\
    \ *)indexPath {\n\n    static NSString *CellIdentifier = @\"CellIdentifier\";\n\
    \n    // Dequeue or create a cell of the appropriate type.\n    UITableViewCell\
    \ *cell = [tableView\n    dequeueReusableCellWithIdentifier:CellIdentifier];\n\
    \n    if (cell == nil) {\n        cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault\n\
    \        reuseIdentifier:CellIdentifier] autorelease];\n        cell.accessoryType\
    \ = UITableViewCellAccessoryNone;\n    }\n\n    // Configure the cell.\n    //---get\
    \ the year---\n    NSString *year = [years objectAtIndex:[indexPath section]];\n\
    \n    //---get the list of movies for that year---\n    NSArray *movieSection\
    \ = [movieTitles objectForKey:year];\n\n    //---get the particular movie based\
    \ on that row---\n    cell.textLabel.text = [movieSection objectAtIndex:[indexPath\
    \ row]];\n    return cell;\n}\n```\n\nFinally, you implement the tableView:titleForHeaderInSection:\
    \ method to retrieve the year as the header for each section:\n\n```\n- (NSString\
    \ *)tableView:(UITableView *)tableView\ntitleForHeaderInSection:(NSInteger)section\
    \ {\n\n    //---get the year as the section header---\n    NSString *year = [years\
    \ objectAtIndex:section];\n    return year;\n}\n```\n\n# Adding Indexing\n\nThe\
    \ list of movies is pretty short, so scrolling through it is not too much of a\
    \ hassle. However, imagine that the list contains 10,000 titles spanning 100 years.\
    \ In that case, scrolling from the top of the list to the bottom of the list can\
    \ take a long time. A very useful feature of the Table view is its capability\
    \ to display an index on the right side of the view. To add an index list to your\
    \ Table view, you just need"
