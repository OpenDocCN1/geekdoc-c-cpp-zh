- pgno: 87
  md: 'The btnClicked: action simply displays an alert view with a message containing
    the user’s name. Note that it has a parameter sender of type id. The sender parameter
    allows you to programmatically find out who actually invokes this action. This
    is useful when you have multiple views connecting to one single action. For such
    cases, you often need to know which is the view that invokes this method and the
    sender parameter will contain a reference to the calling view.


    # USING VIEWS


    So far, you have seen quite a number of views in action — Round Rect Button, TextField,
    and Label. All these views are quite straightforward, but they give you a good
    opportunity to understand how to apply the concepts behind outlets and actions.


    To use more views, you can locate them from the Library window in Interface Builder
    (see Figure 3-6).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_87_0.png)


    **FIGURE 3-6**


    The Library is divided into sections:


    +   - **Controllers** — Contains views that control other views, such as the View
    Controller, Tab Bar Controller, Navigation Controller, and so on

    +   - **Data Views** — Contains views that display data, such as the Image View,
    Table View, Data Picker, Picker View, and so on'
  merge: -1
  img_proc: true
- pgno: 88
  md: "+   - Inputs and Values — Contains views that accept input from users as well\
    \ as display values, such as the Label, Round Rect Button, Text Field, and so\
    \ on\n+   - Windows, Views and Bars — Contains views that display other, miscellaneous\
    \ views, such as View, Search Bar, Toolbar, and so on\n\nIn the following sections,\
    \ you learn how to use some of the views available in the Library. Although it\
    \ is beyond the scope of this book to show the use of every view, you have the\
    \ opportunity to see a number of views in action throughout the book. In this\
    \ chapter, you learn some of the fundamental concepts of dealing with views so\
    \ that you can use other views without problems.\n\n# Using the Alert View\n\n\
    One of the views not listed in the Library is the UIAlertView. The UIAlertView\
    \ displays an alert view to the user and is usually created during runtime. Hence,\
    \ you have to create it using code.\n\n> NOTE You actually saw the UIAlertView\
    \ in Chapter 2. In this section, you see how it actually works.\n\nThe UIAlertView\
    \ is useful for cases in which you have to display a message to the user. In addition,\
    \ it can serve as a quick debugging tool when you want to observe the value of\
    \ a variable during runtime.\n\nThe following Try It Out explores the UIAlertView\
    \ in more detail. Download the code as indicated.\n\n# TRY IT OUT Using the Alert\
    \ View\n\n*codefile UsingViews.zip available for download at Wrox.com*\n\n+  \
    \ 1. Using Xcode, create a new View-based Application project and name it UsingViews.\n\
    +   2. In the UsingViewsViewController.m file, add the following bold code to\
    \ the viewDidLoad method:\n+   ```objc\n+   - (void)viewDidLoad {\n+   \n+   \
    \    UIAlertView *alert = [[UIAlertView alloc]\n+           initWithTitle:@\"\
    Hello\"\n+           message:@\"This is an alert view\"\n+           delegate:self\n\
    +           cancelButtonTitle:@\"OK\"\n+           otherButtonTitles:nil];\n+\
    \   \n+       [alert show];\n+       [alert release];\n+       [super viewDidLoad];\n\
    +   }\n+   ```"
