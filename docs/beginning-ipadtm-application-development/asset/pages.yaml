    # How It Works\n\nTo publish a service on the network, you use the NSNetService\
    \ class to advertise your presence on the network.\n\n```\n```objc\nNSNetService\
    \ *netService;\n```\n```\n\nHere, you advertise your presence on the network by\
    \ publishing a network service when your application has finished launching (application:DidFinishLaunchingWithOptions:).\
    \ You publish a network service by passing several parameters to the NSNetService\
    \ class:\n\n```\n```objc\nnetService = [[NSNetService alloc]\n    initWithDomain:@\"\
    \"\n    type:@\"_MyService._tcp.\"\n    name:@\"\"\n    port:9876];\n```\n```\n\
    \nThe first argument specifies the domain for the service. You use @\"\" to denote\
    \ the default domain. The second argument indicates the service type and transport\
    \ layer. In this example, you named the service as MyService and it uses TCP as\
    \ the protocol. Note that you need to prefix the service name and protocol with\
    \ an underscore (_) and end the protocol with a period (.). The third argument\
    \ specifies the name of the service — you have used an empty string in this case.\
    \ Finally, specify the port number on which the service is published via the fourth\
    \ argument.\n\nTo publish the service, you use the publish method of the NSNetService\
    \ class:\n\n```\n```objc\n[netService publish];\n```\n```\n\nYou also implemented\
    \ the netService:didNotPublish: method so that in the event the service is not\
    \ published successfully, you will write a message to the debugger console (or\
    \ perhaps display an alert to the user)."
