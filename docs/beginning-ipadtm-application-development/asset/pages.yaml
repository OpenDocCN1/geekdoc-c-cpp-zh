- pgno: 38
  md: '# 1


    # Getting Started with iPad

    Programming


    # WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - How to obtain the iPhone SDK

    +   - The components included in the iPhone SDK

    +   - The features of the development tools — Xcode, Interface Builder, iPhone
    Simulator

    +   - The capabilities of the iPhone Simulator

    +   - The architecture of the iPhone OS

    +   - The frameworks of the iPhone SDK

    +   - The limitations and characteristics of the iPad


    Welcome to the world of iPad programming! That you are now holding this book shows
    that you are fascinated with the idea of developing iPad applications and want
    to join the ranks of those tens of thousands of developers whose applications
    are already deployed in the AppStore.


    As the old Chinese adage says, “To accomplish your mission, first sharpen your
    tools.” Successful programming requires you first of all to know your tools so
    well. Indeed, this couldn’t be more true for iPad programming — you need to know
    quite a few tools before you can even get started. Hence, the goal of this chapter
    is to show you the various relevant tools and information you need to jump on
    the iPad development bandwagon.


    Without further ado, it’s time to get down to work.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# OBTAINING THE IPHONE SDK


    To develop for the iPad, you first need to sign up as a Registered iPhone Developer
    at http://developer.apple.com/iphone/program/start/register/. The registration
    is free and provides you with access to the iPhone SDK (software development kit)
    and other resources that are useful for getting started.


    > NOTE The iPad uses the same operating system (OS) as the iPhone and iPod touch.
    So, although you are developing for the iPad, you will still use the iPhone SDK.
    Hence, throughout this book you will see the term "iPhone" used very often.


    After signing up, you can download the iPhone SDK (version 3.2; see Figure 1-1).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_39_0.png)


    FIGURE 1-1


    Before you install the iPhone SDK, make sure you satisfy the following system
    requirements:


    +   - Only Intel Macs are supported, so if you have another processor type (such
    as the older G4 or G5 Macs), you''re out of luck.

    +   - You have updated your system with the latest Mac OS X release.'
  merge: -1
  img_proc: true
- pgno: 40
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 41
  md: '# COMPONENTS OF THE IPHONE SDK


    The iPhone SDK includes a suite of development tools to help you develop applications
    for your iPhone, iPod touch, and iPad. It includes:


    +   - Xcode — Integrated development environment (IDE) that enables you to manage,
    edit, and debug your projects.

    +   - Dashcode — Integrated development environment (IDE) that allows you to develop
    web-based iPhone and iPad applications and Dashboard Widgets. Dashcode is beyond
    the scope of this book.

    +   - iPhone Simulator — Provides a software simulator to simulate an iPhone or
    an iPad on your Mac.

    +   - Interface Builder — Visual editor for designing your user interfaces for
    your iPhone and iPad applications.

    +   - Instruments — Analysis tool to help you optimize your application and monitor
    for memory leaks in real-time.


    The following sections discuss each tool (except Dashcode) in more detail.


    # Xcode


    To launch Xcode, double-click the Xcode icon (located in the `/Developer/Applications`
    folder; refer to Figure 1-3). Alternatively, go the quicker route and use Spotlight:
    simply type **Xcode** into the search box and Xcode should be in the Top Hit position.


    Figure 1-4 shows the Xcode Welcome screen.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_41_0.png)


    FIGURE 1-4'
  merge: -1
  img_proc: true
