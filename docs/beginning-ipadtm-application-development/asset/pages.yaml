- pgno: 550
  md: 'Alternatively, if you do not want to manually type in the declaration of the
    outlets and actions in your View Controller class, you can create the outlets
    and actions in Interface Builder (as just described), select the File''s Owner
    item, and then choose File ▸ Write Class Files. Doing so causes Interface Builder
    to generate the code for the outlets and actions that you have added in the Library
    window. When you use this option, Interface Builder first asks whether you want
    to replace or merge with the View Controller files (if they are already present).
    Replacing the files causes the existing files to be replaced and all the changes
    you have made to the file will be gone. Hence, this is not the recommended option.
    Merging the files enables you to select the segments of code that you want to
    merge into your existing files. This is the safer option.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_550_0.png)


    FIGURE C-15


    Take note that for code generated by Interface Builder, the outlets will not be
    exposed as properties. You must manually add the code to expose the properties
    using the @property keyword and the @synthesize keyword to generate the getters
    and setters for the properties.


    > NOTE In general, it is always easier to define the outlets and actions manually
    rather than have Interface Builder do it for you.


    # Connecting Outlets and Actions


    You have two options for connecting the outlets and actions to the views; they
    are discussed in the following sections.'
  merge: -1
