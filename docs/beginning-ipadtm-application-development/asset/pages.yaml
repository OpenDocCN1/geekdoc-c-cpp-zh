  md: "# How It Works\n\nTo load the values of the preferences settings, you use a\
    \ class known as the NSUserDefaults:\n\n```\n```objc\nNSUserDefaults *defaults\
    \ = [NSUserDefaults standardUserDefaults];\n```\n```\n\nThe preceding statement\
    \ returns the one-and-only-one instance of the NSUserDefaults class. Think of\
    \ NSUserDefaults as a common database that you can use to store your application\
    \ preference settings.\n\nTo retrieve the values of the preference settings, you\
    \ use the objectForKey: method and specify the name of the preference setting\
    \ you want to retrieve:\n\n```\n```objc\nloginName.text = [defaults objectForKey:@\"\
    login_name\"];\npassword.text = [defaults objectForKey:@\"password\"];\n\n//---find\
    \ the index of the array for the color saved---\nfavoriteColorSelected = [[NSString\
    \ alloc] initWithString:\n    [defaults objectForKey:@\"color\"]];\n```\n```\n\
    \n# Resetting the Preference Settings Values\n\nSometimes you may want to reset\
    \ the values of the preference settings of your application. This is especially\
    \ true if you have made an error in the Root.plist file and want to reset all\
    \ the settings. The easiest way to do this is to remove the application from the\
    \ device or Simulator. To do so, simply tap and hold the application's icon, and\
    \ when the icons start to wriggle, tap the X button to remove the application.\
    \ The preference settings associated with the application will also be removed.\n\
    \nAnother way to clear the values of the preference settings would be to navigate\
    \ to the folder containing your application (on the iPhone Simulator). The applications\
    \ on the iPhone Simulator are stored in the following folder: ~/Library/Application\
    \ Support/iPhone Simulator/<version_no>/Applications/ (note that the tilde symbol\
    \ (~) represents your home directory and not your root hard disk). Inside this\
    \ folder, you need to find the folder containing your application. Within the\
    \ application folder is a Library/Preferences folder. Delete the file ending with\
    \ application_name.plist (see Figure 8-18) and your preferences settings will\
    \ now be reset.\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_284_0.png)\n\nFIGURE\
    \ 8-18"
  merge: -1
  img_proc: true
- pgno: 285
  md: "# Saving the Settings Values\n\nNow that you have seen how to load the values\
    \ of preferences settings, use the following Try It Out to see how to save the\
    \ values back to the preferences settings. This allows users to directly modify\
    \ their preferences settings from within your application, instead of using the\
    \ Settings application to do so.\n\n# TRY IT OUT  Saving Settings Values\n\n1.\
    \ Using the same project created in the previous section, insert the following\
    \ method in the ApplicationSettingsViewController.m file:\n\n```\n```objc\n-(IBAction)\
    \ saveSettings: (id) sender {\n    NSUserDefaults *defaults = [NSUserDefaults\
    \ standardUserDefaults];\n    [defaults setObject:loginName.text forKey:@\"login_name\"\
    ];\n    [defaults setObject:password.text forKey:@\"password\"];\n    [defaults\
    \ setObject:favoriteColorSelected forKey:@\"color\"];\n    \n    UIAlertView *alert\
    \ = [[UIAlertView alloc]\n        initWithTitle:@\"Settings Values Saved\"\n \
    \       message:@\"Settings Saved\"\n        delegate:nil\n        cancelButtonTitle:\
    \ @\"Done\"\n        otherButtonTitles:nil];\n    \n    [alert show];\n    [alert\
    \ release];\n}\n```\n```\n\n2. Press Command-R to test the application on the\
    \ iPhone Simulator. Make some changes to the login name, password, and favorite\
    \ color. When you click the Save Settings Value button, all the changes are made\
    \ to the device (see Figure 8-19). When you restart the application, clicking\
    \ the Load Settings Values button displays the updated settings values.\n\n# How\
    \ It Works\n\nYou use the same approach to save the values back to the preferences\
    \ settings as you do to retrieve those settings; that is, you use the NSUserDefaults\
    \ class:\n\n```\n```objc\nNSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];\n\
    [defaults setObject:loginName.text forKey:@\"login_name\"];\n[defaults setObject:password.text\
    \ forKey:@\"password\"];\n[defaults setObject:favoriteColorSelected forKey:@\"\
    color\"];\n```\n```\n\nRather than use the objectForKey: method, you now use the\
    \ setObject:forKey: method to save the values."
