- pgno: 292
  md: "7. Double-click the data.txt file to see its content as follows:\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD\
    \ PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist\
    \ version=\"1.0\">\n<array>\n<string>a string of text</string>\n</array>\n</plist>\n\
    ```\n\n8. Turn on the Debugger Console window (Shift-Command-R) and you see the\
    \ application print the string \"a string of text\".\n\n# How It Works\n\nYou\
    \ first define the documentsPath method, which returns the path to the Documents\
    \ directory:\n\n```\n//---finds the path to the application's Documents directory---\n\
    -(NSString *) documentsPath {\n    NSArray *paths =\n    NSSearchPathForDirectoriesInDomains(\n\
    \        NSDocumentDirectory, NSUserDomainMask, YES);\n    NSString *documentsDir\
    \ = [paths objectAtIndex:0];\n    return documentsDir;\n}\n```\n\nBasically, you\
    \ use the NS SearchPathForDirectoriesInDomains() function to create a list of\
    \ directory search paths, indicating that you want to look for the Documents directory\
    \ (using the NSDocumentDirectory constant). The NSUserDomainMask constant indicates\
    \ that you want to search from the application's home directory, and the YES argument\
    \ indicates that you want to obtain the full path of all the directories found.\n\
    \nTo obtain the path to the Documents folder, simply extract the first item of\
    \ the paths array (because there is one and only one Documents folder in an iPad\
    \ application's folder). In fact, this block of code is derived from the Mac OS\
    \ X API, where multiple folders might be returned. But in the case of the iPad,\
    \ there can only be one Documents folder per application.\n\nYou next define the\
    \ writeToFile:withFileName: method, which creates an NSMutableArray and adds the\
    \ text to be written to file to it.\n\n```\n//--write content into a specified\
    \ file path--\n-(void) writeToFile:(NSString *) text withFileName:(NSString *)\
    \ filePath {\n    NSMutableArray *array = [[NSMutableArray alloc] init];\n   \
    \ [array addObject:text];\n    [array writeToFile:filePath atomically:YES];\n\
    \    [array release];\n}\n```\n\nTo persist the content (a process known as serialization)\
    \ of the NSMutableArray to a file, you use its writeToFile:atomically: method.\
    \ The atomically: parameter indicates that the file should first be written to\
    \ a temporary file before it is renamed to the filename specified. This approach\
    \ guarantees that the file will never be corrupted, even if the system crashes\
    \ during the writing process."
