    # CREATING THE PUSH NOTIFICATION PROVIDER


    A push notification provider is an application written by the application''s developer
    to send push notifications to the iPad application through the APNs.


    Here are the basic steps to send push notifications to your applications via the
    APNs server:


    +   - Communicate with the APNs server using the SSL Certificate you created earlier.

    +   - Construct the payload for the message you want to send.

    +   - Send the push notification containing the payload to the APNs.


    The APNs is a stream TCP socket that your provider can communicate with using
    a SSL secured communication channel. You send the push notification (containing
    the payload) as a binary stream. Once connected to the APNs, maintain the connection
    and send as many push notifications as you want within the duration of the connection.


    > **NOTE** Refrain from opening and closing the connections to the APNs for each
    push notification that you want to send. Rapid opening and closing of connections
    to the APNs will be deemed a Denial-of-Service (DOS) attack and may prevent your
    provider from sending push notifications to your applications.


    The format of a push notification message looks like Figure 17-25 (figure from
    Apple''s documentation):


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_471_1.png)


    FIGURE 17-25'
  merge: -1
  img_proc: true
- pgno: 472
  md: "> **NOTE** For more details, please refer to Apple Push Notification Service\
    \ Programming Guide. The full path to this guide is http://developer.apple.com/iphone/library/documentation/NetworkingInternet/Conceptual/RemoteNotificationsPG/Introduction/Introduction.html.\n\
    \nThe payload is a JSON-formatted string (maximum 256 bytes) carrying the information\
    \ you want to send to your application. An example of a payload looks like this:\n\
    \n```\n{\n  \"aps\": {\n    \"alert\" : \"You got a new message!\",\n    \"badge\"\
    \ : 5,\n    \"sound\" : \"beep.wav\"},\n  \"acme1\" : \"bar\",\n  \"acme2\" :\
    \ 42\n}\n```\n\nTo save yourself the trouble in developing a push notification\
    \ provider from scratch, you can use the PushMeBaby application (for Mac OS X)\
    \ written by Stefan Hafenegger (get it at http://stefan.hafenegger.name/download/PushMeBabySource.zip).\n\
    \nThe following Try It Out shows how to modify the PushMeBaby application to send\
    \ a notification to your application.\n\n# TRY IT OUT Modifying the Provider Application\n\
    \n+   1. Download the source of the PushMeBaby application and then open it in\
    \ Xcode.\n+   2. Right-click the Resources folder in Xcode and select Add Existing\
    \ Files. Select the aps_developer_identity.cer file that you downloaded earlier\
    \ (see Figure 17-26).\n+   3. In the ApplicationDelegate.m file, modify the code\
