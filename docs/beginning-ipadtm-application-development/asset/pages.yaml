  md: "> NOTE After an NSTimer object is started, you cannot change its firing interval.\
    \ Therefore, the only way to change the interval is to invalidate the current\
    \ one and create a new NSTimer object.\n\n# Animating the Visual Change\n\nYou\
    \ may have noticed that as you move the slider toward the right, the animation\
    \ slows and becomes abrupt.\n\nTo make the animation smoother, you can animate\
    \ the visual changes by using animation block. The start of the animation block\
    \ is defined by the beginAnimations:context: class method of the UIView class:\n\
    \n```\n```objc\n[UIView beginAnimations:@\"my_own_animation\" context:nil];\n\n\
    //---animate for the duration of the slider value (time interval)---\n[UIView\
    \ setAnimationDuration:slider.value];\n\n//---set the animation curve type---\n\
    [UIView setAnimationCurve:UIViewAnimationCurveLinear];\n\nimageView.center = CGPointMake(imageView.center.x\
    \ + delta.x,\n    imageView.center.y + delta.y);\n\n[UIView commitAnimations];\n\
    ```\n```\n\nTo end an animation block, you call the commitAnimations class method\
    \ of the UIView class. The preceding code animates the ImageView when it moves\
    \ from one position to another (see Figure 11-7). This results in a much smoother\
    \ animation than before.\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_330_0.png)\n\
    \n# TRANSFORMING VIEWS\n\nYou can use the NSTimer class to simulate some simple\
    \ animation by constantly changing the position of the ImageView, but you can\
    \ use the transformation techniques supported by the iPhone SDK to achieve the\
    \ same effect.\n\nTransforms are defined in Core Graphics, and the iPhone SDK\
    \ supports standard affine 2D transforms. You can use the iPhone SDK to perform\
    \ the following affine 2D transforms:\n\n+   - Translation — Moves the origin\
    \ of the view by the amount specified using the x and y axes\n+   - Rotation —\
    \ Moves the view by the angle specified\n+   - Scaling — Changes the scale of\
    \ the view by the x and y factors specified"
