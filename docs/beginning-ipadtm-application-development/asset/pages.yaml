    \ key on the keyboard. Simulate shaking the simulator again and observe the output\
    \ on the Debugger Console.\n\n# How It Works\n\nBe aware that the three events\
    \ used for monitoring shakes are fired only when there is a first responder in\
    \ your View. Hence, the first thing you do when your View appears is to set it\
    \ to become the first responder (in the ShakeViewController.m file):\n\n```\n\
    ```objc\n- (void) viewDidAppear:(BOOL)animated {\n    [self.view becomeFirstResponder];\n\
    \    [super viewDidAppear:animated];\n}\n```\n```\n\nHowever, by default, the\
    \ View cannot be a first responder, so you need to create a UIView subclass (ShakeView.m)\
    \ so that you can override the default canBecomeFirstResponder method to return\
    \ a YES:\n\n```\n```objc\n- (BOOL)canBecomeFirstResponder {\n    return YES;\n\
    }\n```\n```\n\nDoing so allows your View to become a first responder. By default,\
    \ Interface Builder wires your View with the UIView base class (with which you\
    \ need not do anything most of the time). You now need to tell Interface Builder\
    \ to use the newly created ShakeView subclass.\n\nNext, you handle the three events\
    \ in the ShakeViewController.m file:\n\n```\n```objc\n- (void)motionBegan:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake)\
    \ {\n        NSLog(@\"motionBegan:\");\n    }\n}\n\n- (void)motionCancelled:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake)\
    \ {\n        NSLog(@\"motionCancelled:\");\n    }\n}\n\n- (void)motionEnded:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake)\
    \ {\n        NSLog(@\"motionEnded:\");\n    }\n}\n```\n```\n\nFor each event,\
    \ you first check that the motion is indeed a shake; then, print a debugging statement\
    \ in the Debugger Console."
