    # How It Works


    To parse the XML result, you create an instance of the NSXMLParser class and then
    initialize it with the response returned by the Web service. The NSXMLParser is
    an implementation of the Simple APIs for XML (SAX) parser. It parses an XML document
    sequentially, in an event-driven manner. As the parser encounters the various
    elements, attributes, and so forth in an XML document, it raises events where
    you can insert your own event handlers to do your processing.


    As the NSXMLParser object encounters the various items in the XML document, it
    will fire off several methods, which you need to define:


    +   - parser:didStartElement:namespaceURI:qualifiedName:attributes: — Fired when
    the start tag of an element is found:


    ```

    //---when the start of an element is found---

    -(void) parser:(NSXMLParser *) parser

    ```'
