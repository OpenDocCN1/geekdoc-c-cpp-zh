- pgno: 90
  md: "# How It Works\n\nTo use UIAlertView, you first instantiate it and initialize\
    \ it with the various arguments:\n\n```\nUIAlertView *alert = [[UIAlertView alloc]\n\
    \    initWithTitle:@\"Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:nil];\n```\n\nThe first\
    \ parameter is the title of the alert view, which you set to \"Hello\". The second\
    \ is the message, which you set to \"This is an alert view\". The third is the\
    \ delegate, which you need to set to an object that will handle the events fired\
    \ by the UIAlertView object. In this case, you set it to self, which means that\
    \ the event handler will be implemented in the current class, that is, the View\
    \ Controller. The cancelButtonTitle parameter displays a button to dismiss your\
    \ alert view. Last, the otherButtonTitles parameter allows you to display additional\
    \ buttons if needed. If no additional buttons are needed, simply set this to nil.\n\
    \nTo show the alert view modally, use the show method:\n\n```\n[alert show];\n\
    ```\n\n> COMMON MISTAKES It is important to note that showing the alert view modally\
    \ using the show method does not cause the program to stall execution at this\
    \ statement. The subsequent statements after this line continue to execute even\
    \ though the user may not have dismissed the alert.\n\nFor simple use of the alert\
    \ view, you don't really need to handle the events fired by it. Tapping the OK\
    \ button (as set in the cancelButtonTitle parameter) simply dismisses the alert\
    \ view.\n\nIf you want more than one button, you need to set the otherButtonTitles\
    \ parameter, like this:\n\n```\nUIAlertView *alert = [[UIAlertView alloc]\n  \
    \  initWithTitle:@\"Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:@\"Option 1\", @\"Option\
    \ 2\", nil];\n```\n\nNote that you need to end the otherButtonTitles parameter\
    \ with a nil or a runtime error will occur.\n\nNow that you have three buttons,\
    \ you need to be able to know which button the user pressed — in particular, whether\
    \ Option 1 or Option 2 was pressed. To do so, you need to handle the event raised\
    \ by the UIAlertView class. You do so by ensuring that your View Controller implements\
    \ the UIAlertViewDelegate protocol:\n\n```\n@interface UsingViewsViewController\
    \ : UIViewController\n<UIAlertViewDelegate> {\n    //...\n```"
  merge: -1
  img_proc: true
- pgno: 91
  md: "The UIAlertViewDelegate protocol contains several methods associated with the\
    \ alert view. To know which button the user tapped, you need to implement the\
    \ alertView:clickedButtonAtIndex: method:\n\n```\n```objc\n- (void)alertView:(UIAlertView\
    \ *)alertView clickedButtonAtIndex:\n(NSUInteger)buttonIndex {\n    NSLog([NSString\
    \ stringWithFormat:@\"%d\", buttonIndex]);\n}\n```\n```\n\nThe index of the button\
    \ clicked will be passed in via the clickedButtonAtIndex: parameter.\n\n> NOTE\
    \ Refer to Appendix D for a discussion of the concept of protocols in Objective-C.\n\
    \n# Using the Action Sheet\n\nAlthough the Alert view can display multiple buttons,\
    \ its primary use is still as a tool to alert users when something happens. If\
    \ you need to display a message with multiple choices for the user to select,\
    \ you should use an action sheet rather than the Alert view. An action sheet displays\
    \ a collection of buttons among which the user can select one.\n\nTo use an action\
    \ sheet, use the code snippet below:\n\n```\n```objc\nUIActionSheet *action =\
    \ [[UIActionSheet alloc]\n    initWithTitle:@\"Title of Action Sheet\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    destructiveButtonTitle:@\"Delete Message\"\
    \n    otherButtonTitles:@\"Option 1\", @\"Option 2\", nil];\n[action showInView:self.view];\n\
    [action release];\n```\n```\n\nTo handle the event fired by the action sheet when\
    \ one of the buttons is tapped, implement the UIActionSheetDelegate protocol in\
    \ your View Controller, like this:\n\n```\n```objc\n#import <UIKit/UIKit.h>\n\n\
    @interface UsingViewsViewController : UIViewController\n<UIActionSheetDelegate>\
    \ {\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 92
  md: "When a button is tapped, the `actionSheet:clickedButtonAtIndex:` event will\
    \ be fired:\n\n```\n```objc\n- (void)actionSheet:(UIActionSheet *)actionSheet\n\
    clickedButtonAtIndex:(NSInteger)buttonIndex{\n\n    NSLog([NSString stringWithFormat:@\"\
    %d\", buttonIndex]);\n}\n```\n```\n\nFigure 3-9 shows the action sheet when it\
    \ is displayed.\n\nNotice that the OK button (as specified in the `cancelButtonTitle:`\
    \ part of the method) is not shown. The value (buttonIndex) of each button is\
    \ as follows:\n\n+   - Delete Message — 0\n+   - Option 1 — 1\n+   - Option 2\
    \ — 2\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_92_0.png)\n\nWhen the user taps\
    \ on an area outside of the action sheet, the action sheet is dismissed and the\
    \ value of `buttonIndex` becomes 3. Interestingly, if you specified nil for the\
    \ `cancelButtonTitle:` part, the value of `buttonIndex` would be −1 when the action\
    \ sheet is dismissed.\n\n# Page Control and Image View\n\nNear the bottom of iPad’s\
    \ Home screen is a series of dots (see Figure 3-10). A lighted dot represents\
    \ the currently selected page. As you swipe the page to the next page, the next\
    \ dot lights, and the first one dims. In the figure, the dots indicate that the\
    \ third page is the active page. In the iPhone SDK, the series of dots is represented\
    \ by the `UIPageControl` class.\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_92_1.png)\n\
    \nIn the following exercise, you learn to use the page control view within your\
    \ own application to switch between images displayed in the ImageView."
  merge: -1
  img_proc: true
