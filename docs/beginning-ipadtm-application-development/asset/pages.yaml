- pgno: 565
  md: "As shown, you can combine several properties using a single @synthesize keyword.\
    \ However, you can also separate them into individual statements:\n\n```\n@synthesize\
    \ rate;\n@synthesize name;\n```\n\nYou can now use your properties as usual:\n\
    \n```\n//---setting using setRate---\n[sc setRate:5.0f];\n[sc setName:@\"Wei-Meng\
    \ Lee\"];\n\n//---setting using dot notation---\nsc.rate = 5;\nsc.name = @\"Wei-Meng\
    \ Lee\";\n\n//---getting---\nNSLog([sc name]); //---using the name method\nNSLog(sc.name);\
    \ //---dot notation\n```\n\nTo make a property read only, use the readonly keyword.\
    \ The following statement makes the name property read only:\n\n```\n@property\
    \ (readonly) NSString *name;\n```\n\n# Initializers\n\nWhen you create an instance\
    \ of a class, you often initialize it at the same time. For example, in the earlier\
    \ example (in the Class Instantiation section), you had this statement:\n\n```\n\
    SomeClass *sc = [[SomeClass alloc] init];\n```\n\nThe alloc keyword allocates\
    \ memory for the object, and when an object is returned, the init method is called\
    \ on the object to initialize the object. Recall that in SomeClass, you do not\
    \ define a method named init. So where does the init method come from? It is actually\
    \ defined in the NSObject class, which is the base class of most classes in Objective-C.\
    \ The init method is known as an initializer.\n\nIf you want to create additional\
    \ initializers, you can define methods that begin with the init word. (The use\
    \ of the init word is more of a norm than a hard-and-fast rule.)\n\n```\n#import\
    \ <Foundation/Foundation.h>\n\n@class AnotherClass;\n\n@interface SomeClass :\
    \ NSObject {\n    AnotherClass *anotherClass;\n    float rate;\n    NSString *name;\n\
    }\n\n-(void) doSomething;\n-(void) doSomething:(NSString *) str;\n```"
  merge: -1
  img_proc: true
