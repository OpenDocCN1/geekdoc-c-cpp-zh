- pgno: 26
  md: '# # INTRODUCTION


    **ON JANUARY 27, 2010, APPLE ANNOUNCED** a magical and revolutionary product:
    the iPad. The iPad is a tablet computer that is based on the iPhone OS. What this
    means is that overnight, there were instantly more than 150,000 applications that
    can run on the iPad. Programming on the iPad is very similar to programming for
    the iPhone, with the addition of a few new features specifically designed for
    the iPad, including the following:


    +   1. The introduction of the new Split View-based Application template and the
    new Popoverview, both of which are covered in Chapter 4.

    +   2. The new Gesture Recognizers, covered in Chapter 12.


    When I first started learning about iPhone and iPad development, I went through
    the same journey that most developers go through: Write a Hello World application,
    mess with Interface Builder, try to understand what the code is doing, and repeat
    that process. I was also overwhelmed by the concept of a View Controller and wondered
    why it was needed if I simply wanted to display a view. My background in developing
    for Windows Mobile and Android did not help much, and I had to start working with
    this concept from scratch.


    This book was written to help jumpstart beginning iPad developers. It covers the
    various topics in such a manner that you will progressively learn without being
    overwhelmed by the details. I adopt the philosophy that the best way to learn
    is by doing, hence the numerous Try It Out sections in all the chapters, which
    first show you how to build something and then explain how things work.


    Although iPad programming is a huge topic, my aim for this book is to get you
    started with the fundamentals, help you understand the underlying architecture
    of the SDK, and appreciate why things are done certain ways. It is beyond the
    scope of this book to cover everything under the sun related to iPad programming,
    but I am confident that after reading this book (and doing the exercises), you
    will be well equipped to tackle your next iPad programming challenge.


    # ## WHO THIS BOOK IS FOR


    This book is for the beginning iPad developer who wants to start developing iPad
    applications using the Apple iPhone SDK. To truly benefit from this book, you
    should have some background in programming and at least be familiar with object-oriented
    programming concepts. If you are totally new to the Objective-C language, you
    might want to jump straight to Appendix D, which provides an overview of the language.
    Alternatively, you can use Appendix D as a quick reference while you tackle the
    various chapters, checking out the syntax as you tackle the exercises. Depending
    on your learning pattern, one of those approaches may work best for you.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '**NOTE** All the examples discussed in this book were written and tested using
    the iPhone SDK 3.2 beta 3. Even though Apple continues to call it the iPhone SDK,
    it can be used to develop iPhone, iPod touch, and iPad applications. At the time
    of writing (March 2010), Apple continues to use the term “iPhone Simulator” to
    refer to the simulator that allows you to simulate both an iPhone and iPad. While
    every effort has been made to ensure that the screen shots are as up to date as
    possible, the actual screen that you see may differ when the iPhone SDK is out
    of beta.


    # WHAT THIS BOOK COVERS


    This book covers the fundamentals of iPad programming using the iPhone SDK. It
    is divided into 18 chapters and four appendices.


    Chapter 1: Getting Started with iPad Programming covers the various tools found
    in the iPhone SDK and explains their uses in iPad development.


    Chapter 2: Write Your First Hello World! Application gets you started with Xcode
    and Interface Builder to build a Hello World application. The focus is on getting
    your hands dirty. More details on the various parts and components are covered
    in subsequent chapters.


    Chapter 3: Views, Outlets, and Actions covers the fundamental concepts of iPad
    programming: outlets and actions. You learn how outlets and actions allow your
    code to interact with the visual elements in Interface Builder and why they are
    an integral part of every iPad application. You will also learn about the various
    UI widgets known as views that make up the user interface of your iPad application.


    Chapter 4: View Controllers discusses the various view controllers available in
    the iPhone SDK. You will learn how to develop different types of iPad applications
    — View-based, Window-based, Split View-based, as well as Tab Bar applications.


    Chapter 5: Keyboard Inputs shows you how to deal with the virtual keyboard in
    your iPad. You see how to hide the keyboard on demand and how to ensure that your
    views are not blocked by the keyboard when it is displayed.


    Chapter 6: Screen Rotations demonstrates how you can reorient your application’s
    UI when the device is rotated. You learn about the various events that are fired
    when the device is rotated. You also learn how to force your application to display
    in a certain orientation.


    Chapter 7: Using the Table View explores one of the most powerful views in the
    iPhone SDK — the Table view. The Table view is commonly used to display rows of
    data. In this chapter, you also learn how to implement search capabilities in
    your Table view.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Chapter 8: Application Preferences discusses the use of application settings
    to persist application preferences. Using application settings, you can access
    preferences related to your application through the Settings application available
    on the iPad.


    Chapter 9: File Handling shows how you can persist your application data by saving
    the data to files in your application''s sandbox directory. You also learn how
    to access the various folders available in your application sandbox.


    Chapter 10: Database Storage Using SQLite3 covers the use of the embedded SQLite3
    database library to store your data.


    Chapter 11: Simple Animations provides an overview of the various techniques you
    can use to implement simple animations on the iPad. You also learn about the various
    affine transformations supported by the iPhone SDK.


    Chapter 12: Recognizing Gestures provides an overview of the various gesture recognizers
    available in the iPhone SDK to help your device interpret user''s input gestures.


    Chapter 13: Accessing the Accelerometer shows how you can access the accelerometer
    that comes with every iPad. You will also learn how to detect shakes to your device.


    Chapter 14: Web Services teaches you how to consume Web services from within your
    iPad application. You will learn the various ways to communicate with Web services
    — SOAP, HTTP GET, and HTTP POST. You will also learn how to parse the returning
    XML result returned by the Web service.


    Chapter 15: Bluetooth Programming explores the use of the Game Kit framework for
    Bluetooth programming. You will learn how to get two iPads to communicate using
    a Bluetooth connection. You will also learn how to implement voice chatting over
    a Bluetooth connection.


    Chapter 16: Bonjour Programming shows how you can publish services on the network
    using the Bonjour protocol.


    Chapter 17: Apple Push Notification Services explains how you can implement applications
    that use push notifications. The APNs allows your applications to constantly receive
    status updates from a service provider even though the application may not be
    running.


    Chapter 18: Displaying Maps shows how to build location-based services application
    using the Map Kit framework. You will also learn how to obtain geographical locations
    data and use them to display a map.


    Appendix A: Answers to Exercises contains the solutions to the end-of-chapter
    exercises found in every chapter except Chapter 1.


    Appendix B: Getting Around in Xcode provides a quick run-through of the many features
    in Xcode.


    Appendix C: Getting Around in Interface Builder provides an overview of the many
    features of Interface Builder.


    Appendix D: Crash Course in Objective-C provides a crash course in Objective-C.
    Readers who are new to this language should read this chapter before getting started.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# HOW THIS BOOK IS STRUCTURED


    This book breaks down the task of learning iPad programming into several smaller
    chunks, allowing you to digest each topic before delving into a more advanced
    topic. In addition, there are a few chapters that cover topics already discussed
    in the previous chapter. That''s because there is usually more than one way of
    doing things in Xcode and Interface Builder, and hence this approach allows you
    to learn the different techniques in developing iPad applications.


    If you are a total beginner to iPad programming, start with Chapters 1 and 2.
    Once you have gotten things moving, head on to the appendixes to read more about
    the tools and language you are using. Once you are ready, you can now continue
    with Chapter 3 and gradually move into more advanced topics.


    A feature of this book is that all the code samples in each chapter are independent
    of those discussed in previous chapters. That way, you have the flexibility to
    dive into the topics that interest you and start working on the Try It Out projects.


    # WHAT YOU NEED TO USE THIS BOOK


    Most of the examples in this book run on the iPhone Simulator (which comes as
    part of the iPhone SDK). For exercises that access the hardware (such as the accelerometer),
    you need a real iPad. In general, to get the most out of this book, having a real
    iPad device is not necessary (although it is definitely required for testing if
    you plan to deploy your application on the AppStore).


    # CONVENTIONS


    To help you get the most from the text and keep track of what''s happening, we''ve
    used a number of conventions throughout the book.


    # TRY IT OUT These Are Exercises or Examples for You to Follow


    The Try It Out exercises appear once or more per chapter as exercises to work
    through as you follow the text in the book.


    +   1. They usually consist of a set of numbered steps.

    +   2. Follow the steps through with your copy of project files.


    # How It Works


    After each Try It Out, the code you''ve typed is explained in detail.


    As for other conventions in the text:


    +   - New terms and important words are highlighted in italics when first introduced.

    +   - Keyboard combinations are treated like this: Control-R.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - Filenames, URLs, and code within the text are treated like so: `persistence.properties.`

    +   - Code is presented in two different ways:

    +     - We use a monofont type with no highlighting for most code examples.

    +     - We use bolding to emphasize code that is of particular importance in the
    present context.


    **WARNING** Boxes like this one hold important, not-to-be forgotten information
    that is directly relevant to the surrounding text.


    **NOTE** Notes, tips, hints, tricks, and asides to the current discussion look
    like this.


    **COMMON MISTAKES** This feature, Common Mistakes, helps you avoid the obstacles
    that many new practitioners find themselves negotiating.


    # SOURCE CODE


    As you work through the examples in this book, you may choose either to type in
    all the code manually or to use the source code files that accompany the book.
    All the source code used in this book is available for download at www.wrox.com.
    When at the site, simply locate the book''s title (use the Search box or one of
    the title lists) and click the Download Code link on the book''s detail page to
    obtain all the source code for the book. Code that is included on the Web site
    is highlighted by the following icon and/or CodeNote, as shown following the icon:


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_30_0.png)


    Listings include the filename in the title. If it is just a code snippet, you’ll
    find the filename in a CodeNote such as this:


    ```

    code snippet filename

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'After you download the code, just decompress it with your favorite compression
    tool. Alternatively, go to the main Wrox code download page at www.wrox.com/dynamic/books/download.aspx
    to see the code available for this book and all other Wrox books.


    # ERRATA


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, such as a spelling mistake or faulty piece of code, we would
