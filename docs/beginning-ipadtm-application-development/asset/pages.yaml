- pgno: 451
  md: '# SUMMARY


    This chapter explained how to publish a service on the network using the `NSNetService`
    class and how to discover services on the local network using the `NSNetServiceBrowser`
    class. Once peers are discovered on the network, you can connect to them and initiate
    a peer-to-peer communication. A chat application is a good example of a Bonjour
    application.


    # EXERCISES


    +   1. What is the class that you can use to publish a service on the network?

    +   2. What is the class that you can use to discover services on the network?

    +   3. Name the method that is called when a service is discovered.

    +   4. Name the method that is called when a service is removed.


    Answers to the Exercises can be found in Appendix A.'
