- pgno: 551
  md: '# Method 1


    For connecting outlets, Control-click and drag the File''s Owner item to the view
    to which you want to connect (see Figure C-16).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_551_0.png)


    FIGURE C-16


    When you release the mouse button, a list appears from which you can select the
    correct outlet. When defining your outlets (in the Library window, or in code),
    remember that you can specify the type of view your outlet is referring to. When
    you release the mouse button, Interface Builder lists only the outlets that match
    the type of view you have selected. For example, if you defined myOutlet1 as UIButton
    and you Control-click and drag the File''s Owner item to a Text Field view on
    the View window, myOutlet1 does not appear in the list of outlets.


    For connecting actions, Control-click and drag the view to the File''s Owner item
    in the .xib window (see Figure C-17).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_551_1.png)


    FIGURE C-17


    When you release the mouse button, a list appears from which you can select the
    correct action.


    When you have connected the outlets and actions, a good practice is to view all
    the connections in the File''s Owner item by right-clicking it. Figure C-18 shows
    that the File''s Owner item is connected to the Text Field view through the myOutlet1
    outlet, and the Button''s Touch Up Inside event is connected to the myAction1:
    action.'
