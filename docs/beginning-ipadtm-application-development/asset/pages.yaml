  md: "![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_105_0.png)\n\nFIGURE 3-20\n\n# How\
    \ It Works\n\nYou can use the loadView method defined in your View Controller\
    \ to programmatically create your views. You implement this method only if you\
    \ are generating your UI during runtime. This method is automatically called when\
    \ the view property of your View Controller is called but its current value is\
    \ nil.\n\nThe first view you create is the UIView object, which allows you to\
    \ use it as a container for more views:\n\n```\n//---create a UIView object---\n\
    UIView *view =\n    [[UIView alloc] initWithFrame:[UIScreen mainScreen].applicationFrame];\n\
    \n//---set the background color to lightgray---\nview.backgroundColor = [UIColor\
    \ lightGrayColor];\n```\n\nNext, you create a Label view and set it to display\
    \ a string:\n\n```\n//---create a Label view---\nCGRect frame = CGRectMake(10,\
    \ 15, 300, 20);\nUILabel *label = [[UILabel alloc] initWithFrame:frame];\nlabel.textAlignment\
    \ = UITextAlignmentCenter;\nlabel.backgroundColor = [UIColor clearColor];\nlabel.font\
    \ = [UIFont fontWithName:@\"Verdana\" size:20];\nlabel.text = @\"This is a label\"\
    ;\nlabel.tag = 1000;\n```\n\nNotice that you have also set the tag property, which\
    \ is very useful for allowing you to search for particular views during runtime.\n\
    \nYou also create a Button view by calling the buttonWithType: method with the\
    \ UIButtonTypeRoundedRect constant. This method returns a UIRoundedRectButton\
    \ object (which is a subclass of UIButton).\n\n```\n//---create a Button view---\n\
    frame = CGRectMake(10, 70, 300, 50);\nUIButton *button = [UIButton buttonWithType:UIButtonTypeRoundedRect];\n\
    button.frame = frame;\n```"
