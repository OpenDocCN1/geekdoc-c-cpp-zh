  md: "# UNDERSTANDING THE APPLICATION FOLDERS\n\nYour applications are stored in\
    \ the iPad file system, so you'll find it useful to understand the folder structure\
    \ of the iPad.\n\nOn the desktop, the content of the iPhone Simulator is stored\
    \ in the `~/Library/Application Support/iPhone Simulator/<|version_no|>` folder.\n\
    \n> **NOTE** The \"~\" (tilde) represents the current user's directory. Specifically,\
    \ the preceding directory is equivalent to:\n> \n> `/Users/<username>/Library/Application\
    \ Support/iPhone Simulator/<|version_no|>`\n\nWithin this folder are five subfolders:\n\
    \n+   - Applications\n+   - Library\n+   - Media\n+   - Root\n+   - tmp\n\nThe\
    \ Applications folder contains all your installed applications (see Figure 9-1).\
    \ Within it are several folders with long filenames. These filenames are generated\
    \ by Xcode to uniquely identify each of your applications. Each application's\
    \ folder holds your application's executable file (the `.app` file, which includes\
    \ all embedded resources), together with a few other folders, such as Documents,\
    \ Library, and tmp. On the iPad, all applications run within their own sandboxed\
    \ environments — that is, an application can access only the files stored within\
    \ its own folder; it cannot access the folders of other applications.\n\n![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_289_0.png)\n\
    \nFIGURE 9-1"
