  md: "You then wire the Page Control so that when the user taps it, an event is fired\
    \ and triggers a method. In this case, the pageTurning: method is called:\n\n\
    ```\n//---add the event handler for the page control---\n[pageControl addTarget:self\n\
    \    action:@selector(pageTurning:)\n    forControlEvents:UIControlEventValueChanged];\n\
    ```\n\nIn the pageTurning: method, you determine which image you should load based\
    \ on the value of the Page Control:\n\n```\n//---when the page control's value\
    \ is changed---\n- (void) pageTurning: (UIPageControl *) pageController {\n  \
    \  //---get the page number you can turning to---\n    NSInteger nextPage = [pageController\
    \ currentPage];\n    switch (nextPage) {\n        case 0:\n            [tempImageView\
    \ setImage:\n                [UIImage imageNamed:@\"iMac_old.jpeg\"]];\n     \
    \       break;\n        case 1:\n            [tempImageView setImage:\n      \
    \          [UIImage imageNamed:@\"iMac.jpeg\"]];\n            break;\n       \
    \ case 2:\n            [tempImageView setImage:\n                [UIImage imageNamed:@\"\
    Mac8100.jpeg\"]];\n            break;\n        case 3:\n            [tempImageView\
    \ setImage:\n                [UIImage imageNamed:@\"MacPlus.jpeg\"]];\n      \
    \      break;\n        case 4:\n            [tempImageView setImage:\n       \
    \         [UIImage imageNamed:@\"MacSE.jpeg\"]];\n            break;\n       \
    \ default:\n            break;\n    }\n    //...\n}\n```\n\nYou then switch the\
    \ two ImageViews and animate them by using the various methods in the UIView class:\n\
    \n```\n//---switch the two ImageView views---\nif (tempImageView.tag==0) { //---imageView1---\n\
    \    tempImageView = imageView1;\n    bgImageView = imageView1;\n}\nelse {   //---imageView2---\n\
    \    tempImageView = imageView1;\n    bgImageView = imageView2;\n}\n\n//---animate\
    \ the two views flipping---\n```"
