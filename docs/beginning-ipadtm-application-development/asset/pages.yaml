  md: 'In the next Try It Out, you modify the Root.plist file so that you can use
    it to store some user''s credentials. This is very useful in cases where you are
    writing an application that requires users to log in to a server. When the user
    uses your application for the first time, he will supply his login credentials,
    such as username and password. Your application can then store the credentials
    in the application preferences so that the next time the user uses your application,
    the application can automatically retrieve the credentials without asking the
    user to supply them.


    > NOTE For more information on the use of each key, refer to Apple''s "Settings
    Application Schema Reference" documentation. The easiest way to locate it is to
    do a Web search for the title. The URL is: http://developer.apple.com/iPhone/library/documentation/PreferenceSettings/Conceptual/SettingsApplicationSchemaReference/Introduction/Introduction.html.


    # TRY IT OUT Modifying the Application Preferences


    +   1. In Xcode, select the Root.plist file and remove all four items under the
    PreferenceSpecifiers key. You do so by selecting individual items under the PreferenceSpecifiers
    key and then pressing the Delete key.

    +   2. To add a new item under the PreferenceSpecifiers key, select the PreferenceSpecifiers
    key and click the Add Child button (see Figure 8-5).

    +   3. A new item is added for you. To add additional items, click the Add Sibling
    button (see Figure 8-6). Click the Add Sibling button three more times.

    +   4. The Root.plist file should now look like Figure 8-7.


