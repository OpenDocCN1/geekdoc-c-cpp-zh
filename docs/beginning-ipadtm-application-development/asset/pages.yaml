    # How It Works


    That is quite a lot of work, isn’t it? But not to worry: It is actually quite
    easy to follow. First, you add an outlet to connect to the search bar:


    ```

    IBOutlet UISearchBar *searchBar;

    ```


    You define two Boolean variables so that you can track whether the search process
    is ongoing and whether the user can select the rows in the Table view:


    ```

    BOOL isSearchOn;

    BOOL canSelectRow;

    ```


    You then define two NSMutableArray objects so that you can use one to store the
    list of movies and use another to temporarily store the result of the search:


    ```

    NSMutableArray *listOfMovies;

    NSMutableArray *searchResult;

    ```'
