- pgno: 293
  md: "To read the content from a file, you define the `readFromFile:` method:\n\n\
    ```\n```objective-c\n//---read content from a specified file path---\n-(NSString\
    \ *) readFromFile:(NSString *) filePath {\n    //---check if file exists---\n\
    \    if ([[NSFileManager defaultManager] fileExistsAtPath:filePath]) {\n     \
    \   NSArray *array = [[NSArray alloc] initWithContentsOfFile:filePath];\n    \
    \    NSString *data = [NSString stringWithFormat:@\"%@\",\n                  \
    \        [array objectAtIndex:0]];\n        [array release];\n        return data;\n\
    \    }\n    else\n        return nil;\n}\n```\n```\n\nYou first use an instance\
    \ of the `NSFileManager` class to check to see whether the specified file exists.\
    \ If it does, you read the content of the file into an `NSArray` object. In this\
    \ case, because you know that the file contains a single line of text, you extract\
    \ the first element in the array.\n\nWith all the methods in place, you are ready\
    \ to make use of them. When the view is loaded, you create the pathname for a\
    \ file that you want to save. You then write a string of text into the file and\
    \ immediately read it back and print it in the Debugger Console window:\n\n```\n\
    ```objective-c\n- (void)viewDidLoad {\n\n    //---formulate filename---\n    NSString\
    \ *fileName =\n        [[self documentsPath] stringByAppendingPathComponent:@\"\
    data.txt\"];\n\n    //---write something to the file---\n    [self writeToFile:@\"\
    a string of text\" withFileName:fileName];\n\n    //---read it back---\n    NSString\
    \ *fileContent = [self readFromFile:fileName];\n\n    //---display the content\
    \ read in the Debugger Console window---\n    NSLog(fileContent);\n\n    [super\
    \ viewDidLoad];\n}\n```\n```\n\n# Storing Files in the Temporary Folder\n\nIn\
    \ addition to storing files in the Documents directory, you can store temporary\
    \ files in the tmp folder. Files stored in the tmp folder are not backed up by\
    \ iTunes, so you need to find a permanent place for the files you want to be sure\
    \ to keep. To get the path to the tmp folder, you can call the `NSTemporaryDirectory()`\
    \ function, like this:\n\n```\n```objective-c\n-(NSString *) tempPath{\n    return\
    \ NSTemporaryDirectory();\n}\n```\n```"
  merge: -1
