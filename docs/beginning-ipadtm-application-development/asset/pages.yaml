  md: "```\n[super dealloc];\n}\n@end\n```\n\nWhen the application has finished launching,\
    \ it sends its delegate the applicationDidFinishLaunchingWithOptions: message.\
    \ In the preceding case, it uses a View Controller to obtain its view and then\
    \ adds it to the current window so that it can be displayed.\n\nThe viewBasedAppDelegate.h\
    \ file contains the declaration of the members of the viewBasedAppAppDelegate\
    \ class:\n\n```\n#import <UIKit/UIKit.h>\n\n@class viewBasedAppViewController;\n\
    \n@interface viewBasedAppAppDelegate : NSObject <UIApplicationDelegate> {\n  \
    \  UIWindow *window;\n    viewBasedAppViewController *viewController;\n}\n\n@property\
    \ (nonatomic, retain) IBOutlet UIWindow *window;\n@property (nonatomic, retain)\
    \ IBOutlet viewBasedAppViewController *viewController;\n\n@end\n```\n\nOf particular\
    \ interest is this line:\n\n```\n@interface viewBasedAppAppDelegate : NSObject\
    \ <UIApplicationDelegate> {\n```\n\nThe <UIApplicationDelegate> statement specifies\
    \ that the delegate class implement the UIApplicationDelegate protocol. Put simply,\
    \ it means that the delegate class will handle events (or messages) defined in\
    \ the UIApplicationDelegate protocol. Examples of events in the UIApplicationDelegate\
    \ protocol include the following:\n\n+   - `Application:DidFinishLaunchingWithOptions:`\
    \ (You saw this implemented in the viewBasedAppAppDelegate.m file.)\n+   - `applicationWillTerminate:`\n\
    +   - `applicationDidDidReceiveMemoryWarning:`\n\nThe Application Delegate class\
    \ is also a good place to put your global objects and functions, as they are accessible\
    \ from all the other classes in your project.\n\nNOTE Protocols are discussed\
    \ in more detail in Appendix D."
