    # Using the Table View


    In Chapter 4, you saw that a Split View-based Application project uses a Table
    view to display list of items on the left side of the screen. The `RootViewController`
    class programmatically fills up the Table view with rows of items; it did not
    make use of the Table view in Interface Builder. While it is perfectly alright
    to create a Table view from code, sometimes it is easier to customize the Table
    view from within Interface Builder. In particular, if you want to add a SearchBar
    to the Table view, it is much easier to do that in Interface Builder.


