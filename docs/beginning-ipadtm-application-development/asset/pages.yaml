  md: '![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_532_0.png)


    FIGURE B-2


    The Xcode window is divided into five sections:


    +   - Toolbar: Displays the buttons for commonly performed actions.

    +   - Groups and Files List: Displays the files in a project. Files are grouped
    into folders and categories for better management.

    +   - Status Bar: Displays the status information about the current action.

    +   - Detail View: Displays the files contained in the folders and groups selected
    in the Groups and Files List section.

    +   - Editor: Displays the appropriate editor showing the file currently selected.


    To edit a code file, click the filename of a file to open the appropriate editor.
    For example, if you click an .h or .m file, the code editor in which you can edit
    your source code is displayed (see Figure B-3). Click a .plist file, and the XML
    Property List editor launches (see Figure B-4).


    # Customizing the Toolbar


    The Xcode window contains the toolbar section, in which you can place your favorite
    items for quick access. By default, the following items are placed in the toolbar:


    +   - Overview: Enables you to select target settings such as the active SDK (iPhone
    OS version and device versus Simulator) as well as active configurations (Debug
    or Release).

    +   - Action: Specifies the action you can perform with a selected item.

    +   - Breakpoints: Toggles the Build and Run item (see next item) to Build and
    Debug so that you can attach a debugger to the application.'
  merge: -1
  img_proc: true
- pgno: 533
  md: '+   - Build and Run: Lets you build and deploy the application.

    +   - Tasks: Stops any operation in progress.

    +   - Info: Displays the detailed information of a selected item.

    +   - Search: Filters the items currently displayed in the Detail View section.


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_533_0.png)


    # FIGURE B-3


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_533_1.png)


    # FIGURE B-4'
