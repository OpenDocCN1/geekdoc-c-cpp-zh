  md: "![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_345_0.png)\n\n# FIGURE 12-4\n\nTo\
    \ attach the gesture recognizer to a view, in this case imageView, pass the tapGesture\
    \ object to the addGestureRecognizer: method:\n\n```\n[imageView addGestureRecognizer:tapGesture];\n\
    ```\n\nFinally, release the tapGesture recognizer object:\n\n```\n[tapGesture\
    \ release];\n```\n\nWhen a double tap is detected by the application, the handleTapGesture:\
    \ method will be invoked:\n\n```\n//---handle tap gesture---\n-(IBAction) handleTapGesture:\
    \ (UIGestureRecognizer *) sender {\n    if (sender.view.contentMode == UIViewContentModeScaleAspectFit)\n\
    \        sender.view.contentMode = UIViewContentModeCenter;\n    else\n      \
    \  sender.view.contentMode = UIViewContentModeScaleAspectFit;\n}\n```\n\nIn handleTapGesture:,\
    \ you can reference the view that has recognized the gesture, in this case imageView,\
    \ by the sender.view object (alternatively, you can directly refer to the ImageView\
    \ via self.imageView). This method is useful as you may have multiple views attached\
    \ to the same gesture handler and sender.view will automatically refer to the\
    \ view that recognized the gesture.\n\nIn this gesture handler, you toggle the\
    \ image between the UIViewContentModeScaleAspectFit and UIViewContentModeCenter\
    \ modes."
