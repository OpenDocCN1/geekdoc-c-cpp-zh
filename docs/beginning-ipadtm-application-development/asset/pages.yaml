  md: '# WHAT YOU LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Xcode | Create your iPad application project and write code that manipulates
    your application. |

    | Interface Builder | Build your iPad UI using the various views located in the
    Library. |

    | Repositioning views | Use the Autosizing feature in Interface Builder to ensure
    that the views resize when there is an orientation change. |

    | Adding application icon | Add an image to the project and then specify the image
    name in Icon file property of the info.plist file. |

    | Creating icons for your iPad applications | Icon size is 72 x 72 pixels (Home
    screen) and 48 x 48 pixels (Settings). For AppStore hosting, size is 512 x 512
    pixels. |


