- pgno: 205
  md: "![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_205_0.png)\n\nFIGURE 6-3\n\n# How\
    \ It Works\n\nBy default, the iPad application project you created using Xcode\
    \ supports all orientations — portrait as well as landscape modes. This is evident\
    \ in the ScreenRotationsViewController.m file, where you have the shouldAutorotateToInterfaceOrientation:\
    \ method:\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n(UIInterfaceOrientation)interfaceOrientation\
    \ {\n    return YES;\n}\n```\n\n> NOTE On the iPad, screen rotation is automatically\
    \ handled by the OS. When the OS detects a change in screen orientation, it fires\
    \ the shouldAutorotateToInterfaceOrientation: event; it is up to the developer\
    \ to decide how the application should display in the target orientation."
  merge: -1
  img_proc: true
- pgno: 206
  md: "The shouldAutorotateToInterfaceOrientation: method is called when the View\
    \ is loaded and when orientation of the device changes. This method passes in\
    \ a single parameter — the orientation that the device has been changed to. The\
    \ returning value of this event determines whether the current orientation is\
    \ supported. By default, your iPad application supports all screen orientations,\
    \ hence it simply returns a YES.\n\nThis means that your application will rotate\
    \ to all orientations (the status bar will always appear at the top) when the\
    \ device is rotated.\n\nTo support specific orientations, simply perform an equality\
    \ check to specify the orientation supported. For example, the following code\
    \ snippet shows that only the landscape left orientation is supported.\n\n```\n\
    ```objc\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n(UIInterfaceOrientation)interfaceOrientation\
    \ {\n    //return YES;\n    return (interfaceOrientation ==\n        UIInterfaceOrientationLandscapeLeft);\n\
    }\n```\n```\n\nThis means that your application will display upright only in landscape\
    \ mode with the Home button on its left (hence the constant name UIInterfaceOrientationLandscapeLeft).\n\
    \nIf the user rotates the device to portrait mode or landscape mode with the Home\
    \ button on the right (UIInterfaceOrientationLandscapeRight), the application\
    \ will not change its orientation.\n\nWhile you can specify the orientation supported\
    \ by your application, Apple has specifically indicated that your application\
    \ should support all screen orientations.\n\n> **NOTE** Here is one easy way to\
    \ differentiate between UIInterfaceOrientationLandscapeLeft and UIInterfaceOrientationLandscapeRight.\
    \ Just remember that UIInterfaceOrientationLandscapeLeft refers to the Home button\
    \ positioned on the left and UIInterfaceOrientationLandscapeRight refers to the\
    \ Home button positioned on the right.\n\n# Different Types of Screen Orientations\n\
    \nYou have a total of four constants to use for specifying screen orientations:\n\
    \n+   - `UIInterfaceOrientationPortrait` — Displays the screen in portrait mode\n\
    +   - `UIInterfaceOrientationPortraitUpsideDown` — Displays the screen in portrait\
    \ mode but with the Home button at the top of the screen\n+   - `UIInterfaceOrientationLandscapeLeft`\
    \ — Displays the screen in landscape mode with the Home button on the left\n+\
    \   - `UIInterfaceOrientationLandscapeRight` — Displays the screen in landscape\
    \ mode with the Home button on the right"
  merge: -1
  img_proc: true
