  md: "![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_348_0.png)\n\nFIGURE 12-5\n\nWhen\
    \ a pinch gesture is recognized, the handlePinchGesture: method is invoked to\
    \ handle it. Recall that the pinch gesture is a continuous gesture, and hence\
    \ the handlePinchGesture: method will be called repeatedly as long as the fingers\
    \ are on the screen.\n\nTo know whether this is a “zoom in” or “zoom out” gesture,\
    \ you examine the scale property of the UIPinchGestureRecognizer object:\n\n```\n\
    ```objc\nCGFloat factor = [(UIPinchGestureRecognizer *)sender scale];\n```\n```\n\
    \nIf the fingers are moving apart, the value of scale is 1 or greater. If the\
    \ fingers are moving closer, the value is smaller than 1. Every time you perform\
    \ a pinch gesture, your application needs to remember the scale factor so that\
    \ the next time you perform the gesture, you can resize the image based on its\
    \ last drawn size. This is done when the pinch gesture ends (when the fingers\
    \ are lifted off the screen). You examine the sender.state to see if the gesture\
    \ has ended and then proceed to save the last scale factor:\n\n```\n```objc\n\
    if (sender.state == UIGestureRecognizerStateEnded) {\n    if (factor > 1) {\n\
    \        lastScaleFactor += (factor-1);\n    } else {\n        lastScaleFactor\
    \ *= factor;\n    }\n}\n```\n```"
