  img_proc: true
- pgno: 199
  md: "```\n//---calculate how much visible space is left---\nCGFloat freeSpaceHeight\
    \ =\n    applicationFrame.size.height - keyboardBounds.size.height;\n\n//---calculate\
    \ how much the scrollview must scroll---\nCGFloat scrollAmount = viewCenterY -\
    \ freeSpaceHeight / 2.0;\n\nif (scrollAmount < 0) scrollAmount = 0;\n\n//---set\
    \ the new scrollView contentSize---\nscrollView.contentSize = CGSizeMake(applicationFrame.size.width,\n\
    \                                    applicationFrame.size.height +\n        \
    \                            keyboardBounds.size.height);\n\n//---scroll the ScrollView---\n\
    [scrollView setContentOffset:CGPointMake(0, scrollAmount)\n                  \
    \  animated:YES];\n}\n```\n\nWhen the TextField view resigns its First Responder\
    \ status, the textFieldDidEndEditing: method will be invoked. At this point, you\
    \ restore the ScrollView view to its original content size:\n\n```\n//---when\
    \ a TextField view is done editing---\n-(void) textFieldDidEndEditing:(UITextField\
    \ *) textFieldView {\n    [UIView beginAnimations:@\"back to original size\" context:nil];\n\
    \    scrollView.contentSize = scrollViewOriginalSize;\n    [UIView commitAnimations];\n\
    }\n```\n\nA noteworthy point here is that you use the beginAnimations method of\
    \ the UIView class to animate the ScrollView view in the process of restoring\
    \ to its original size. If you do not use this method, the ScrollView will very\
    \ abruptly restore to its original size, causing a flicker.\n\nJust before the\
    \ keyboard disappears, the keyboardWillHide: method is invoked. In this case,\
    \ you don't have much to do:\n\n```\n//---when the keyboard disappears---\n-(void)\
    \ keyboardWillHide:(NSNotification *) notification {\n}\n```\n\nFinally, in the\
    \ dealloc method, you release all the outlets you have created:\n\n```\n-(void)\
    \ dealloc {\n    [textField release];\n    [scrollView release];\n    [super dealloc];\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "# HANDLING THE RETURN KEY OF THE KEYBOARD\n\nEarlier, you saw how you can connect\
    \ an IBAction with the Did End On Exit event of a TextField view to hide the keyboard\
    \ when the user taps the Return key. Alternatively, you can also implement the\
    \ textFieldShouldReturn: method (defined in the UITextFieldDelegate protocol).\
    \ This method is invoked whenever the user taps the Return key on the keyboard:\n\
    \n```\n- (BOOL) textFieldShouldReturn:(UITextField *) textFieldView {\n    if\
    \ (textFieldView == textField) {\n        [textField resignFirstResponder];\n\
    \    }\n    return NO;\n}\n```\n\n# SUMMARY\n\nIn this chapter, you learned the\
    \ various techniques to deal with the keyboard in your iPad application. In particular,\
    \ this chapter showed you how to make the keyboard go away when you are done with\
    \ the data entry, how to detect the presence or absence of the keyboard, and how\
    \ to ensure that views are not blocked by the keyboard.\n\n# EXERCISES\n\n+  \
    \ 1. How do you hide the keyboard for a UITextField object?\n+   2. How do you\
    \ detect whether the keyboard is visible or not?\n+   3. How do you get the size\
    \ of the keyboard?\n\nAnswers to the Exercises can be found in Appendix A."
  merge: -1
  img_proc: true
