  md: '# How It Works


    To load the Web view with a URL, you first instantiate an NSURL object with a
    URL via the URLWithString method:


    ```

    ```objc

    NSURL *url = [NSURL URLWithString:@"http://www.apple.com"];

    ```

    ```


    You then create an NSURLRequest object by passing the NSURL object to its requestWithURL:
    method:


    ```

    ```objc

    NSURLRequest *req = [NSURLRequest requestWithURL:url];

    ```

    ```


    Finally, you load the Web view with the NSURLRequest object via the loadRequest:
    method:


    ```

    ```objc

    [webView loadRequest:req];

    ```

    ```


