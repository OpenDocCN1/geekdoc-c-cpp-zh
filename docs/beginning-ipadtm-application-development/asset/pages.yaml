  md: '4. Open the Debugger Console window (press Command-Shift-R) and observe the
    output as you Option-click the screen of the iPhone Simulator multiple times (see
    Figure 12-14).


    ![](img/ab1bbb3d5afcbabb6f4a47f0203b9043_371_0.png)


    FIGURE 12-14


    # How It Works


    As you do when detecting for single-touch, you check for multi-touches in the
    touchesBegan:withEvent: event. Rather than receive information about the first
    touch, you now obtain information for both the first and second touch:


    ```

    //---get info of first touch---

    UITouch *touch1 = [[allTouches allObjects] objectAtIndex:0];


    //---get info of second touch---

    UITouch *touch2 = [[allTouches allObjects] objectAtIndex:1];

    ```


    To get the coordinates (represented as a CGPoint structure) of each touch, you
    use the locationInView: method of the UITouch class and pass it the view whose
    coordinate system you want the touch located:


    ```

    //---get the points touched---

    CGPoint touch1PT = [touch1 locationInView:[self view]];

    CGPoint touch2PT = [touch2 locationInView:[self view]];

    ```


    The coordinates returned by the locationInView: method are relative to the view
    specified. In the preceding snippet, the coordinates displayed are relative to
    the main View window.


    The x and y coordinates of a CGPoint structure are represented using the CGFloat
    type, so you need to use the %f format specifier when printing them in the Debugger
    Console window:


    ```

    NSLog(@"Touch1: %.0f, %.0f", touch1PT.x, touch1PT.y);

    NSLog(@"Touch2: %.0f, %.0f", touch2PT.x, touch2PT.y);

    ```


    To detect more than two touches, you simply extend the preceding code by getting
    information about the third touch, fourth touch, and so on.'
