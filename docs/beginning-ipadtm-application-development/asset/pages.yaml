  md: "# ▶ WHAT YOU LEARNED IN THIS CHAPTER\n\n| TOPIC | KEY CONCEPTS |\n|---|---|\n\
    | **Action** | An action is a method that can handle events raised by views (for\
    \ example, when a button is clicked, etc.) in the View window. |\n| **Outlet**\
    \ | An outlet allows your code to programmatically reference a view on the View\
    \ window. |\n| **Adding outlet using code** | Use the `IBOutlet` keyword:<br>`IBOutlet\
    \ UITextField *nameTextField;` |\n| **Adding action using code** | Use the `IBAction`\
    \ keyword:<br>`- (IBAction)btnClicked:(id)sender;` |\n| **Connecting actions**\
    \ | To link actions, you always drag from the view in the View window onto the\
    \ File’s Owner item. |\n| **Connection outlets** | To link outlets, you always\
    \ drag from the File’s Owner item onto the required view in the View window. |\n\
    | **Using the UIAlertView** | ```objc\nUIAlertView *alert = [[UIAlertView alloc]\n\
    \    initWithTitle:@\"Hello\"\n    message:@\"This is an alert view\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:nil];\n``` |\n| **Handling\
    \ events fired by UIAlertView** | Ensure that your View Controller conforms to\
    \ the `UIAlertViewDelegate` protocol. |\n| **Using the UIActionSheet** | ```objc\n\
    UIActionSheet *action =\n    [[UIActionSheet alloc]\n    initWithTitle:@\"Title\
    \ of Action Sheet\"\n    delegate:self\n    cancelButtonTitle:@\"OK\"\n    destructiveButtonTitle:\n\
    \    @\"Delete Message\"\n    otherButtonTitles:@\"Option 1\",\n    @\"Option\
    \ 2\", nil];\n``` |\n| **Handling events fired by UIActionSheet** | Ensure that\
    \ your View Controller conforms to the `UIActionSheetDelegate` protocol. |\n|\
    \ **Wiring up the events for the UIPageControl** | ```objc\n[pageControl addTarget:self\n\
    \    action:@selector(pageTurning:)\n    forControlEvents:UIControlEventValueChanged];\n\
    ``` |"
