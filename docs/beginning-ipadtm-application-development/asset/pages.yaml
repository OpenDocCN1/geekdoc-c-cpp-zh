- pgno: 213
  md: "# How It Works\n\nThis project illustrates how you can reposition the views\
    \ on your application when the device changes orientation. You first create an\
    \ outlet and connect it to the Round Rect Button view on the View window.\n\n\
    When the device is being rotated, you handle the willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ event because doing so allows you to know the destination orientations that\
    \ the device is changing to. When this event is fired, you can obtain the destination\
    \ orientation using the interfaceOrientation property of the current View (self),\
    \ like this:\n\n```\nUIInterfaceOrientation destOrientation = self.interfaceOrientation;\n\
    ```\n\nUsing this information, you position the view according to the destination\
    \ orientation by altering its frame property via the positionViews method, which\
    \ you have defined:\n\n```\n-(void) positionViews {\n\n    UIInterfaceOrientation\
    \ destOrientation = self.interfaceOrientation;\n\n    if (destOrientation == UIInterfaceOrientationPortrait\
    \ ||\n        destOrientation == UIInterfaceOrientationPortraitUpsideDown) {\n\
    \        //---if rotating to portrait mode---\n        btn.frame = CGRectMake(20,\
    \ 20, 371, 37);\n    } else {\n        //---if rotating to landscape mode---\n\
    \        btn.frame = CGRectMake(633, 691, 371, 37);\n    }\n}\n```\n\nYou should\
    \ also call the positionViews method in the viewDidLoad method so that the Round\
    \ Rect Button can be displayed correctly when the View window is loaded:\n\n```\n\
    -(void)viewDidLoad {\n    [self positionViews];\n    [super viewDidLoad];\n}\n\
    ```\n\n# PROPERTIES FOR DEALING WITH POSITIONING OF VIEWS\n\nIn the previous example,\
    \ you used the frame property to change the position of a view during runtime.\
    \ The frame property defines the rectangle occupied by the view, with respect\
    \ to its superview (the view that contains it). Using the frame property allows\
    \ you to set the positioning and size of a view. Besides using the frame property,\
    \ you can also use the center property, which sets the center of the view, also\
    \ with respect to its superview. You usually use the center property when you\
    \ are performing some animation and just want to change the position of a view."
  merge: -1
  img_proc: true
- pgno: 214
  md: "# PROGRAMMATICALLY ROTATING THE SCREEN\n\nYou've seen how your application\
    \ can handle the changes in device orientation when the user rotates the device.\
    \ There are times (such as when you are developing a game), however, when you\
    \ want to force the application to display in certain rotations independently\
    \ of the device's orientation.\n\nThere are two scenarios to consider:\n\n+  \
    \ - Rotating the screen orientation during runtime when your application is running\n\
    +   - Displaying the screen in a particular orientation when the View is loaded\n\
    \n# Rotating During Runtime\n\nDuring runtime, you can programmatically rotate\
    \ the screen by using the setOrientation: method on an instance of the UIDevice\
    \ class. Suppose you want the user to change the screen orientation when the user\
    \ presses the Round Rect Button view. Using the project created earlier, You can\
    \ code it as follows:\n\n```\n```objc\n-(IBAction) btnClicked: (id) sender{\n\
    \    [[UIDevice currentDevice] setOrientation:UIInterfaceOrientationLandscapeLeft];\n\
    }\n```\n```\n\nThe setOrientation: method takes in a single-parameter specifying\
    \ the orientation you want to change to.\n\n> NOTE After you have programmatically\
    \ switched the orientation of your application, your application's rotation can\
    \ still be changed when the device is physically rotated. The orientation that\
    \ it can be changed to is dependent of what you set in the shouldAutorotateToInterfaceOrientation:\
    \ method.\n\n# Displaying the View in a Specific Orientation When Loading\n\n\
    When a View window is loaded, by default it is always displayed in the orientation\
    \ that your device is in. If your application requires that you display the View\
    \ window in a particular orientation when it is loaded, you can do so by setting\
    \ the orientation of the status bar, like this:\n\n```\n```objc\n- (void)viewDidLoad\
    \ {\n    [UIApplication sharedApplication].statusBarOrientation =\n    UIInterfaceOrientationLandscapeRight;\n\
    \    [super viewDidLoad];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 215
  md: "It's interesting to note that the setOrientation: method described in the previous\
    \ section cannot be used to change the orientation of the View during loading\
    \ time:\n\n```\n- (void)viewDidLoad {\n    //---does not work during View loading\
    \ time---\n    [[UIDevice currentDevice] setOrientation:UIInterfaceOrientationLandscapeLeft];\n\
    \    [super viewDidLoad];\n}\n```\n\nLikewise, setting the orientation of the\
    \ status bar does not work during runtime (after the View has loaded):\n\n```\n\
    //---does not work during run time---\n[[UIApplication sharedApplication].statusBarOrientation\
