  md: '# Solutions to Chapter 11 | Testing


    11.1 Find the mistake(s) in the following code:


    ```

    unsigned int i;

    for (i = 100; i <= 0; --i)

    printf("%d\n", i);

    ```


    # SOLUTION


    The printf will never get executed, as "i" is initialized to 100, so condition
    check "i <= 0" will fail.


    Suppose the code is changed to "i >= 0". Then, it will become an infinite loop,
    because "i" is an unsigned int which can''t be negative.


    The correct code to print all numbers from 100 to 1, is "i > 0":


    ```

    unsigned int i;

    for (i = 100; i > 0; --i)

    printf("%d\n", i);

    ```


    One additional correction is to use %u in place of %d, as we are printing unsigned
    int.


    ```

    unsigned int i;

    for (i = 100; i > 0; --i)

    printf("%u\n", i);

    ```'
