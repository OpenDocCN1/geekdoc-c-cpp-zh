  md: '# At the Interview | The Offer and Beyond


    # Congrats! You got the offer!


    If you''re lucky enough to get an offer (and I''m sure you will be!), congratulations!
    You may now be stressing over which offer to accept and all that fun stuff, so
    just remember that, most likely, all of your options are great and you''ll be
    happy at any of them.


    As far as which offer to take, well, we could tell you that money isn''t important
    and blah blah blah... but we''ll skip over that and let you make your own decision
    regarding the importance of money. We have some other advice for you.


    # Negotiating


    It''s Always Negotiable! Ok, maybe not always, but usually an offer is negotiable
    even if a recruiter tells you otherwise. It helps if you have a competing offer.
    But, don''t lie - Microsoft knows what Google offers, so it won''t be realistic
    if you make up numbers. Also, technology is a small world, and people talk. Be
    honest.


    # What''s the money like, really?


    Think about the full offer package. Many companies will have impressive salaries,
    but small annual bonuses. Other companies will have huge annual bonuses, but lower
    salaries. It''s very confusing and it''s often not clear which one is offering
    more. Make sure you look at the full package (salary, signing bonus, health care
    benefits, raises, annual bonus, relocation, stock, promotions, etc).


    # What about your career options?


    Even if money is all that matters, think about the long term career. If you''re
    fortunate enough to have several offers to pick from, consider how each one will
    impact your career in the long run. The company with the lowest salary but where
    you''ll learn the most may just be the best, move even financially.


    I can''t give you any magical formula to decide the best offer, but here''s what
    I''d recommend thinking about (in particular order):


    +   - Career Path: Make a plan for your career. What do you want to do 5, 10 and
    15 years from now? What skills do you need to develop? Which company or position
    will help you get there?


    +   - Promotion Opportunity: Do you ultimately desire to move into management,
    or would you rather become an increasingly senior developer?


    +   - Money and Benefits: Of course, the money still matters (but if you''re early
    in your career, it probably doesn''t matter much). As mentioned above, make sure
    you look at the full package.'
