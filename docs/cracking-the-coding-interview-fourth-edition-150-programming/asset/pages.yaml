  md: "# Solutions to Chapter 8 | Recursion\n\n8.4 Write a method to compute permutations\
    \ of a string.\n\n# SOLUTION\n\nLet's assume a given string S represented by the\
    \ letters A1, A2, A3, ..., An\n\nTo permute S, we can select the first character,\
    \ A1, permute the remainder of the string to get a new list. Then, with that new\
    \ list, we can \"push\" A1 into each possible position.\n\nFor example, if our\
    \ string is \"abc\", we would do the following:\n\n+   1. Let first=\"a\" and\
    \ remainder=\"bc\"\n\n+   2. Let list :=permute(bc) {\"bc\",\"cd\"}\n\n+   3.\
    \ Push \"a\" into each location of \"bc\" -> \"abc\",\"bac\",\"bca\" and \"cb\"\
    \ -> \"acb\",\"cab\",\"cba\"\n\n+   4. Return our new list\n\nNow, the code to\
    \ do this:\n\n```\n1 public static ArrayList<String> getPerms(String s) {\n2 \
    \  ArrayList<String> permutations = new ArrayList<String>();\n3 if (s == null)\
    \ { // error case\n4   return null;\n5 } else if (s.length() == 0) { // base case\n\
    6   permutations.add(\");\n7   return permutations;\n8 }\n9 }\n10  char first\
    \ = s.charAt(0); // get the first character\n11 String remainder = s.substring(1);\
    \ // remove the first character\n12 ArrayList<String> words = getPerms(remainder);\n\
    13 for (String word : words) {\n14   for (int j = 0; j < word.length(); j++) {\n\
    15     permutations.add(insertCharAt(word, first, j));\n16   }\n17 }\n18 return\
    \ permutations;\n19 }\n20 \n21 public static String insertCharAt(String word,\
    \ char c, int i) {\n22   String start = word.substring(0, i);\n23   String end\
    \ = word.substring(i);\n24   return start + c + end;\n25 }\n```\n\nThis solution\
    \ takes O(n!) time, since there are n! permutations.\n\nCracking the Coding Interview\
    \ | Concepts and Algorithms"
