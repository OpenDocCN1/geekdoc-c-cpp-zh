    ```

    merge(c, ab) --> cab, acb, abc

    merge(c, ba) --> cba, bca, bac

    ```


    Algorithm: Use a recursive algorithm. Generate all permutations of a string by
    "chopping off" the last character and generating all permutations of s[1...n-1].
    Then, insert s[n] into every location of the string.


    NOTE: Base Case and Build Algorithms often lead to natural recursive algorithms.


    # APPROACH V: DATA STRUCTURE BRAINSTORM


    Description: This is hacky, but it often works. Simply run through a list of data
    structures and try to apply each one.


    Example: Numbers are randomly generated and stored into an (expanding) array.
    How would you keep track of the median?


    Data Structure Brainstorm:


    +   Linked list? Probably not - linked lists tend not to do well with accessing
    and sorting numbers.


    +   Array? Maybe, but you already have an array. Could you somehow keep the elements
    sorted? That''s probably expensive. Let''s hold off on this and return to it if
    it''s needed.


    +   Binary tree? This is possible, since binary trees do fairly well with ordering.
    In fact, if the binary search tree is perfectly balanced, the top might be the
    median. But careful - if there''s an even number of elements, the median is actually
    the average of the middle two elements. The middle two elements can''t both be
    at the top. This is probably a workable algorithm, but let''s come back to it.


    +   Heap? A Heap is really good at basic ordering and keeping track of max and
    mins. This is actually interesting - if you had two heaps, you could keep track
    of biggest half and smallest half of the elements. The biggest half is kept in
    a min heap, such that the smallest element in the biggest half is at the root.
    The smallest half is kept in a max heap, such that the biggest element of the
    smallest half is at the root. With these data structures, you have the potential
    median elements at the roots. If the heaps are no longer the same size, you can
    quickly "rebalance" the heaps by popping an element off one heap and pushing it
    onto the other.


    Note that the more problems you do, the more developed your instinct on which
    data structure to apply will be.'
