  md: "# Solutions to Chapter 20 | Hard\n\n20.3 Write a method to randomly generate\
    \ a set of m integers from an array of size n. Each element must have equal probability\
    \ of being chosen.\n\npg 91\n\n# SOLUTION\n\nOur first instinct on this problem\
    \ might be to randomly pick elements from the array and put them into our new\
    \ subset array. But then, what if we pick the same element twice? Ideally, we'd\
    \ want to somehow \"shrink\" the array to no longer contain that element. Shrinking\
    \ is expensive because of all the shifting required.\n\nInstead of shrinking /\
    \ shifting, we can swap the element with an element at the beginning of the array\
    \ and then \"remember\" that the array now includes elements j and greater. That\
    \ is, when we pick subset[0] to be array[k], we replace array[k] with the first\
    \ element in the array. When we pick subset[1], consider array[0] to be \"dead.\"\
    \ and we pick a random y between 1 and array.size(). We then set subset[1] to\
    \ array(y), and set array[y] equal to array[1]. Elements 0 and 1 are now \"dead.\"\
    \ Subset[2] is now chosen from array[2] through array(array.size()); and so on.\n\
    \n```\n/* Random number between lower and higher, inclusive */\npublic static\
    \ int rand(int lower, int higher) {\n    return lower + (int)(Math.random() *\
    \ (higher - lower + 1));\n}\n/* pick M elements from original array. Clone original\
    \ array so that\n * we don't destroy the input. * */\npublic static int[] pickRandomly(int[]\
    \ original, int m) {\n    int[] subset = new int[m];\n    int[] array = original.clone();\n\
    \    for (int j = 0; j < m; j++) {\n        int index = rand(j, array.length -\
    \ 1);\n        subset[j] = array[index];\n        array[index] = array[j]; //\
    \ array[j] is now \"dead\"\n    }\n    return subset;\n```\n\nCareerCup.com 282"
