    # APPROACH III: SIMPLIFY & GENERALIZE


    Description: Change a constraint (data type, size, etc) to simplify the problem.
    Then try to solve it. Once you have an algorithm for the "simplified" problem,
    generalize the problem again.


    Example: A random note can be formed by cutting words out of a magazine to form
    a new sentence. How would you figure out if a ransom note (string) can be formed
    from a given magazine (string)?


    Simplification: Instead of solving the problem with words, solve it with characters.
    That is, imagine we are cutting characters out of a magazine to form a ransom
    note.


    Algorithm:\We can solve the simplified ransom note problem with characters by
    simply creating an array and counting the characters. Each spot in the array corresponds
    to one letter. First, we count the number of times each character in the ransom
    note appears, and then we go through the magazine to see if we have all of those
    characters.


    When we generalize the algorithm, we do a very similar thing. This time, rather
    than creating an array with character counts, we create a hash table. Each word
    maps to the number of times the word appears.


    # APPROACH IV: BASE CASE AND BUILD


    Description: Solve the algorithm for a base case (e.g., just one element). Then,
    try to solve it for elements one and two, assuming that you have the answer for
    element one. Then, try to solve it for elements one, two and three, assuming that
    you have the answer elements one and two.


