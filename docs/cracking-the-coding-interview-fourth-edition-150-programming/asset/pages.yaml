  md: '# Behind the Scenes


    For many candidates, interviewing is a bit of a black box. You walk in, you get
    pounded with questions from a variety of interviewers, and then somehow or other
    you return with an of- fer... or not.


    Have you ever wondered:


    +   - How do decisions get made?

    - Do your interviewers talk to each other?

    - What does the company really care about?


    Well, wonder no more!


    CareerCup sought out interviewing experts from five top companies - Microsoft,
    Google, Amazon, Yahoo and Apple - to show you what really happens “behind the
    scenes.” These experts will walk us through a typical interview day and describe
    what’s taking place outside of the interviewing room, and what transpires after
    you leave.


    Our interviewing experts also told us what’s different about their interview process.
    From bar raisers (Amazon) to Hiring Committees (Google), each company has its
    own quirks. Knowing idiosyncrasies will help you to react better to a super-tough
    interviewer, or to avoid being intimidated when two interviewers show up at the
    door (Apple!).


    In addition, our specialists offered insight as to what their company stresses
    in their inter- views. While almost all software firms care about coding and algorithms,
    some companies focus more than others on specific aspects of the interview. Whether
    this is because of the company’s technology or its history, now you’ll know what
    and how to prepare.


    So, join us as we take you behind the scenes at Microsoft, Google, Amazon, Yahoo
    and Ap- ple...'
