  md: "# Solutions to Chapter 13 | C++\n\n13.4 What is the difference between deep\
    \ copy and shallow copy? Explain how you would use each.\n\npg 76\n\n# SOLUTION\n\
    \n```\nstruct Test {\n  char *ptr;\n};\nvoid shallow_copy(Test &src, Test &dest)\
    \ {\n  dest.ptr = src.ptr;\n}\nvoid deep_copy(Test &src, Test &dest) {\n  dest.ptr\
    \ = malloc(strlen(src.ptr) + 1);\n  memcpy(dest.ptr, src.ptr);\n}\n\n```\n\nNote\
    \ that shallow_copy may cause a lot of programming run-time errors, especially\
    \ with the creation and deletion of objects. Shallow copy should be used very\
    \ carefully and only when a programmer really understands what he wants to do.\
    \ In most cases shallow copy is used when there is a need to pass information\
    \ about a complex structure without actual duplication of data (e.g., call by\
    \ reference). One must also be careful with destruction of shallow copy.\n\nIn\
    \ real life, shallow copy is rarely used. There is an important programming concept\
    \ called \"smart pointer\" that, in some sense, is an enhancement of the shallow\
    \ copy concept.\n\nDeep copy should be used in most cases, especially when the\
    \ size of the copied structure is small."
