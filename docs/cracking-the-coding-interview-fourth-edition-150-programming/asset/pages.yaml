  md: "# Solutions to Chapter 1 | Arrays and Strings\n\n1.3 Design an algorithm and\
    \ write code to remove the duplicate characters in a string without using any\
    \ additional buffer. NOTE: One or two additional variables are fine.\nAn extra\
    \ copy of the array is not.\n\nFOLLOW UP\nWrite the test cases for this method.\n\
    \npg 48\n\n# SOLUTION\n\nFirst, ask yourself, what does the interviewer mean by\
    \ an additional buffer? Can we use an additional array of constant size?\nAlgorithm—No\
    \ (Large) Additional Memory:\n1. For each character, check if it is a duplicate\
    \ of already found characters.\n2. Skip duplicate characters and update the non\
    \ duplicate characters.\n\nTime complexity is O(N²).\n\n```\npublic static void\
    \ removeDuplicates(char[] str) {\n    if (str == null) return;\n    int len =\
    \ str.length;\n    if (len < 2) return;\n\n    int tail = 1;\n    for (int i =\
    \ 1; i < len; ++i) {\n        int j;\n        for (int j = 0; j < tail; ++j) {\n\
    \            if (str[i] == str[j]) break;\n        }\n        if (j == tail) {\n\
    \            str[tail] = str[i];\n            ++tail;\n        }\n    }\n    str[tail]\
    \ = 0;\n}\n```\n\nTest Cases:\n\n+   1. String does not contain any duplicates,\
    \ e.g.: abcd\n2. String contains all duplicates, e.g.: aaaa\n3. Null string\n\
    4. String with all continuous duplicates, e.g.: aaabbb"
