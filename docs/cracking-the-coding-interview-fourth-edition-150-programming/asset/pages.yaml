    2.1. LEFT OUTER JOIN, or simply LEFT JOIN: The result will contain all records
    from the left table. If no matching records were found in the right table, then
    its fields will contain the NULL values. In our example, we would get 4 records.
    In addition to INNER JOIN results, BUDWEISER will be listed, because it was in
    the left table.


    2.2. RIGHT OUTER JOIN, or simply RIGHT JOIN: This type of join is the opposite
    of LEFT JOIN; it will contain all records from the right table, and missing fields
    from the left table will contain NULL. If we have two tables A and B, then we
    can say that statement A LEFT JOIN B is equivalent to statement B RIGHT JOIN A.


    In our example, we will get 5 records. In addition to INNER JOIN results, FRECA
    and WATER records will be listed.


    # 2.3. OUTER JOIN


    This type of join combines the results of LEFT and RIGHT joins. All records from
    both tables will be part of the result set, whether the matching record exists
    in the other table or not. If no matching record was found then the corresponding
    result fields will have a NULL value.


    In our example, we will get 6 records.'
