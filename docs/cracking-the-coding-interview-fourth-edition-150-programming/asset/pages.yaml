  md: "# Solutions to Chapter 3 | Stacks and Queues\n\n3.5 Implement a MyQueue class\
    \ which implements a queue using two stacks.\n\n# SOLUTION\n\nSince the major\
    \ difference between a queue and a stack is the order (first-in-first-out vs.\
    \ last-in-first-out), we know that we need to modify peek() and pop() to go in\
    \ reverse order. We can use our second stack to reverse the order of the elements\
    \ (by popping s1 and pushing the elements onto s2). In such an implementation,\
    \ on each peek() and pop() operation, we would pop everything from s1 onto s2,\
    \ perform the peek / pop operation, and then push everything back.\n\nThis will\
    \ work, but if two pop / peek operations are performed back-to-back, we're needlessly\
    \ moving elements. We can implement a \"lazy\" approach where we let the elements\
    \ sit in s2.\n\ns1 will thus be ordered with the newest elements on the top, while\
    \ s2 will have the oldest elements on the top. We push the new elements onto s1,\
    \ and peek and pop from s2. When s2 is empty, we transfer all the elements from\
    \ s1 onto s2, in reverse order.\n\n```\npublic class MyQueue<T> {\n    Stack<T>\
    \ s1, s2;\n    public MyQueue() {\n        s1 = new Stack<T>();\n        s2 =\
    \ new Stack<T>();\n    }\n    public int size() {\n        return s1.size() +\
    \ s2.size();\n    }\n    public void add(T value) {\n        s1.push(value);\n\
    \    }\n    public T peek() {\n        if (is2.empty()) return s2.peek();\n  \
    \      while (!s1.empty()) s2.push(s1.pop());\n        return s2.peek();\n   \
    \ }\n    public T remove() {\n        if (is2.empty()) return s2.pop();\n    \
    \    while (!s1.empty()) s2.push(s1.pop());\n        return s2.pop();\n    }\n\
    }\n```"
