- pgno: 111
  md: "# Solutions to Chapter 2 | Linked Lists\n\n2.1 Write code to remove duplicates\
    \ from an unsorted linked list.\n\nFOLLOW UP\nHow would you solve this problem\
    \ if a temporary buffer is not allowed?\n\n# SOLUTION\n\nIf we use a buffer, we\
    \ can keep track of elements in a hashtable and remove any dups:\n\n```\npublic\
    \ static void deleteDups(ListNode n) {\n    Hashtable table = new Hashtable();\n\
    \    ListNode previous = null;\n    while (n != null) {\n        if (table.containsKey(n.data))\
    \ previous.next = n.next;\n        else {\n            table.put(n.data, true);\n\
    \            previous = n;\n        }\n        n = n.next;\n    }\n}\n```\n\n\
    Without a buffer, we can iterate with two pointers: \"current\" does a normal\
    \ iteration, while \"runner\" iterates through all prior nodes to check for dups.\
    \ Runner will only see one dup per node, because if there were multiple duplicates\
    \ they would have been removed already.\n\n```\npublic static void deleteDups2(ListNode\
    \ head) {\n    if (head == null) return;\n    ListNode previous = head;\n    ListNode\
    \ current = head.next;\n    while (current != null) {\n        ListNode runner\
    \ = head;\n        while (runner != current) { // Check for earlier dups\n   \
    \         if (runner.data == current.data) {\n                ListNode tmp = current.next;\
    \ // remove current\n                current.next = tmp;\n                previous\
    \ = tmp;\n                current = tmp; // update current to next node\n    \
    \            break; // all other dups have already been removed\n            }\n\
    \            runner = runner.next;\n        }\n        if (runner == current)\
    \ { // current not updated - update now\n            previous = current;\n   \
    \         current = current.next;\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 112
  md: "# Solutions to Chapter 2 | Linked Lists\n\n2.2 Implement an algorithm to find\
    \ the nth to last element of a singly linked list.\n\n# SOLUTION\n\nNote: This\
    \ problem screams recursion, but we will do it in a different way because it's\
    \ trickier. In a question like this, expect follow up questions about the advantages\
    \ of recursion vs iteration.\n\nAssumption: The minimum number of nodes in list\
    \ is n.\n\nAlgorithm:\n\n+   1. Create two pointers, p1 and p2, that point to\
    \ the beginning of the node.\n\n+   2. Increment p2 by n-1 positions, make it\
    \ point to the nth node from the beginning (to make the distance of n between\
    \ p1 and p2).\n\n+   3. Check for p2->next == null if return value of p1, otherwise\
    \ increment p1 and p2. If next of p2 is null it means p1 points to the nth node\
    \ from the last as the distance between two is n.\n\n+   4. Repeat Step 3.\n\n\
    ```\nLinkedListNode nthToLast(LinkedListNode head, int n) {\n  if (head == null\
    \ || n < 1) {\n    return null;\n  }\n  LinkedListNode p1 = head;\n  LinkedListNode\
    \ p2 = head;\n  for (int j = 0; j < n - 1; ++j) { // skip n-1 steps ahead\n  \
    \  if (p2 == null) {\n      return null; // not found since list size < n\n  \
    \  }\n    p2 = p2.next;\n  }\n  if (p2 == null) {\n    return null;\n  }\n  while\
    \ (p2.next != null) {\n    p1 = p1.next;\n    p2 = p2.next;\n  }\n  return p1;\n\
    }\n```"
  merge: -1
  img_proc: true
