    \ of 2)\n\nEXAMPLE\nalign_malloc(1000,128) will return a memory address that is\
    \ a multiple of 128 and that points to memory of size 1000 bytes.\naligned_free()\
    \ will free memory allocated by align_malloc.\n\npg 82\n\n# SOLUTION\n\n+   1.\
    \ We will use malloc routine provided by C to implement the functionality.\nAllocate\
    \ memory of size (bytes required + alignment - 1 + sizeof(void*)) using malloc.\
    \ alignment: malloc can give us any address and we need to find a multiple of\
    \ alignment-1\n(Therefore, at maximum multiple of alignment, we will be alignment-1\
    \ bytes away from any location).\nsizeof(size_t): We are returning a modified\
    \ memory pointer to user, which is different from the one that would be returned\
    \ by malloc. We also need to extra space to store the address given by malloc,\
    \ so that we can free memory in aligned_free by calling free routine provided\
    \ by C.\n2. If it returns NULL, aligned_malloc will fail and return NULL.\n3.\
    \ Else, find the aligned memory address which is a multiple of alignment (call\
    \ this p2).\n4. Store the address returned by malloc (e.g., p1 is just size_t\
    \ bytes ahead of p2), which will be required by aligned_free.\n5. Return p2.\n\
    \n```\nvoid* aligned_malloc(size_t required_bytes, size_t alignment) {\n    void*\
    \ p1; // original block\n    void** p2; // aligned block\n    int offset = alignment\
    \ - 1 + sizeof(void*);\n    if ((p1 = (void*)malloc(required_bytes + offset))\
    \ == NULL) {\n        return NULL;\n    }\n    p2 = (void**)((size_t)(p1) + offset)\
    \ & ~(alignment - 1));\n    p2[-1] = p1;\n    return p2;\n}\n```\n\n```\nvoid\
    \ aligned_free(void* p) {\n    free((void**)p)[-1]);\n}\n```"
