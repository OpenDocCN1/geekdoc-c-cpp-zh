  md: "# Chapter 18 | Threads and Locks\n\n# How to Approach:\n\nIn a Microsoft, Google\
    \ or Amazon interview, it's not terribly common to be asked to implement an algorithm\
    \ with threads (unless you're working in a team for which this is a particularly\
    \ important skill). It is, however, relatively common for interviewers at any\
    \ company to assess your general understanding of threads, particularly your understanding\
    \ of deadlocks\n\n# Deadlock Conditions\n\n+   In order for a deadlock to occur,\
    \ you must have the following four conditions met:\n1. Mutual Exclusion: Only\
    \ one process can use a resource at a given time.\n2. Hold and Wait: Processes\
    \ already holding a resource can request new ones.\n3. No Preemption: One process\
    \ cannot forcibly remove another process' resource.\n4. Circular Wait: Two or\
    \ more processes form a circular chain where each process is waiting on another\
    \ resource in the chain.\n\n# Deadlock Prevention\n\nDeadlock prevention essentially\
    \ entails removing one of the above conditions, but many of these conditions are\
    \ difficult to satisfy. For instance, removing #1 is difficult because many resources\
    \ can only be used by one process at a time (printers, etc). Most deadlock prevention\
    \ algorithms focus on avoiding condition #4: circular wait.\n\n you aren't familiar\
    \ with these concepts, please read http://en.wikipedia.org/wiki/Deadlock.\n\n\
    # A Simple Java Thread\n\n```\nclass Foo implements Runnable {\n    public void\
    \ run() {\n        while (true) beep();\n    }\n}\nFoo foo = new Foo();\nThread\
    \ myThread = new Thread(foo);\nmyThread.start();\n```"
