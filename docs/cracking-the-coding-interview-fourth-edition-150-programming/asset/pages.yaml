    \ Val* for all points in the matrix? Yes, by using similar-logic:\n\nVal(x, y)\
    \ = Val(x - 1, y) + Val(y - 1, x) - Val(x - 1, y - 1)\n\nWe precompute all such\
    \ values, and then efficiently find the maximum submatrix.\n\n```\npublic static\
    \ int getMaxValue(int[][] matrix) { // original {\n    int maxArea = Integer.MIN_VALUE;\
    \ // ! Max could be < 0\n    int rowCount = original.length;\n    int colCount\
    \ = original[0].length;\n    int[][] matrix = precomputeMatrix(original);\n  \
    \  for (int row = 0; row < rowCount; row++) {\n        for (int row2 = row; row2\
