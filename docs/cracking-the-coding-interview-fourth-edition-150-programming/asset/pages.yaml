    \nEXAMPLE\n\nInput: (3 -> 1 -> 5), (5 -> 9 -> 2)\n\nOutput: 8 -> 0 -> 8\n\n# SOLUTION\n\
    \nWe can implement this recursively by adding node by node, just as we would by\
    \ digit.\n\n+   1. result.data = (node1 + node2 + any carry) % 10\n2. if node1\
    \ + node2 > 10, carry a 1 to the next addition.\n3. add the tails of the two nodes,\
    \ passing along the carry.\n\n```\nLinkedList addLists(ListNode l11, ListNode\
    \ l12,\n    int carry) {\n    ListNode result = new ListNode(carry, null, null);\n\
    \    int value = carry;\n    if (l11 != null) {\n        value += l11.data;\n\
    \    }\n    if (l12 != null) {\n        value += l12.data;\n    }\n    result.data\
    \ = value % 10;\n    if (l11 == null || l12 == null || value >= 10) {\n      \
    \  ListNode more = addLists(l11 == null ? null : l11.next,\n            l12 ==\
    \ null ? null : l12.next,\n            value >= 10 ? 1 : 0);\n        result.setNext(more);\n\
    \    }\n    return result;\n}\n```"
