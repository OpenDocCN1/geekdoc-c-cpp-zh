  md: '# At the Interview | Top Ten Mistakes Candidates Make


    # #1 | Practicing on a Computer


    If you were training for a serious bike race in the mountains, would you practice
    only by biking on the streets? I hope not. The air is different. The terrain is
    different. I bet you''d practice in the mountains, right?


    Using a compiler to practice interview questions is like preparing for a mountain
    race by street biking - and you''ve been street biking your whole life. Put away
    the compiler and get the old pen and paper. Use a compiler only to verify your
    solutions.


    # #2 | Not Rehearsing Behavioral Questions


    Many candidates spend all their time prepping for technical questions and overlook
    behavioral questions. Guess what? Your interviewer is judging those too! And,
    not only that-performance on behavioral questions biases your interviewer''s perception
    of your technical performance. Behavioral prep is relatively easy and well-worth
    your time. Look over your projects and positions and think of the key stories.
    Rehearse the stories.


    # #3 | Not Doing a Mock Interview


    Imagine you''re preparing for a big speech. Your whole school, company, or whatever
    will be. Your future depends on this. And all you do to prepare is read the speech
    to yourself. Silently. In your head. Crazy, right?


    Not doing mock interview to prepare for your real one is just like this. If you''re
    an engineer, you must know other engineers. Grab a buddy and ask him/her to do
    a mock interview with you. You can even return the favor!


    # #4 | Trying to Memorize Solutions


    Quality beats quantity. Try to struggle through and solve questions yourself;
    don''t flip directly to the solutions when you get stuck. Memorizing how to solve
    specific problems isn''t going to help you much in an interview either. Real preparation
    is about learning how to approach new problems.


    # #5 | Talking Too Much


    I can''t tell how many times I have asked candidates a simple question like "what
    was the hardest bug on Project Pod?", only to have them ramble on and about things
    I don''t understand. Five minutes later, when they finally come up for air, I
    learned nothing -except that''re poor communicators. When asked a question, break
    your answer into three parts (Situation / Action / Response, Issue 1 / Issue 2/Issue
    3, etc) and speak for just a couple sentences about each. If I want more details,
    I''ll ask!'
