  md: "# Solutions to Chapter 19 | Moderate\n\n19.2 Design an algorithm to figure\
    \ out if someone has won in a game of tic-tac-toe.\n\npg 89\n\n# SOLUTION\n\n\
    The first thing to ask your interviewer is whether the hasWon function will be\
    \ called just once, or multiple times. If it will be called multiple times, you\
    \ can get a very fast algorithm by amortizing the cost (especially if you can\
    \ design your own data storage system for the tic-tac-toe board).\n\nApproach\
    \ #1: If hasWon is called many times\n\nThere are only 3^9, or about twenty thousand\
