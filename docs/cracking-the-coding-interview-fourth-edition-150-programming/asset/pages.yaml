  md: "# Solutions to Chapter 20 | Hard\n\n20.1 Write a function that adds two numbers.\
    \ You should not use + or any arithmetic operators.\n\npg 91\n\n# SOLUTIONS\n\n\
    To investigate this problem, let's start off by gaining a deeper understanding\
    \ of how we add numbers. We'll work in Base 10 so that it's easier to see. To\
    \ add 759+674, I would usually add digit[0] from each number, carry the one, add\
    \ digit[1] from each number, carry the one, etc. You could take the same approach\
    \ in binary: add each digit, and carry the one as necessary.\n\nCan we make this\
    \ a little easier? Imagine I decided to split apart the \"addition\" and \"carry\"\
    \ steps. That is, I do the following:\n\n+   1. Add 759+674, but \"forget\" to\
    \ carry. I then get 323.\n\n+   2. Add 759+674, but only the carrying, rather\
    \ than the addition of each digit. I then get 1110.\n\nNow, how would we do this\
    \ in binary?\n\n+   1. If I add two binary numbers but forget to carry, bit[i]\
    \ will be 0 if bit[i] in a and b are both 0 or 1. This is an XOR.\n\n+   2. If\
    \ we add two numbers but only carry, I will have a 1 in bit[i] if bit[i-1] in\
    \ a and b are both 1's. This is an AND, shifted.\n\n+   3. Now recurse until there's\
    \ nothing to carry.\n\n```\nint add_no_arithith(int a, int b) {\n  if (b == 0)\
    \ return a;\n  int sum = a ^ b; // without carrying\n  int carry = (a & b) <<\
    \ 1; // carry, but don't add\n  return add_no_arithith(sum, carry); // recurse\n\
    }\n```\n\n# OBSERVATIONS AND SUGGESTIONS:\n\nThe Approach: There are a couple\
    \ of suggestions for figuring out this problem:\n\n+   1. Our first instinct in\
    \ problems like these should be that we're going to have to work with bits. Why?\
    \ Because when you take away the + sign, what other choice do we have? Plus, that's\
    \ how computers do it."
