  md: "# Solution to Chapter 12 System Design and Memory Limits\n\n12.4 You have an\
    \ array with all the numbers from 1 to N, where N is at most 32,000. The array\
    \ may have duplicate entries and you do not know what N is. With only 4KB of memory\
    \ available, how would you print all duplicate elements in the array?\n\n# SOLUTION\n\
    \nWe have 4KB of memory which means we can address up to 8 * 4 * (2^10) bits.\
    \ Note that 32* (2^10) is greater than 32000. We can create a bit vector with\
    \ 32000 bits, where each bit represents one integer.\n\nNOTE: This isn't an especially\
    \ difficult problem, it's important to implement this cleanly. We will define\
    \ our own bitset class to hold a large bit vector.\n\n```\npublic static void\
    \ checkDuplicates(int[] array) {\n    BitSet bs = new BitSet(32000);\\n    for\
    \ (int i = 0; i < array.length; i++) {\n        int num = array[i] - 1; // bitset\
    \ starts at 0, numbers start at 1\n        if (bs.get(num)) {\n            System.out.println(num);\n\
    \        } else {\n            bs.set(num);\n        }\n    }\n}\n```\n\n```\n\
    class BitSet {\n    int[] bitset;\n    public BitSet(int size) {\n        bitset\
    \ = new int[size >> 5]; // divide by 32\n    }\n\n    boolean get(int pos) {\n\
    \        int wordNumber = (pos >> 5); // divide by 32\n        int bitNumber =\
    \ (pos & 0x1F); // mod 32\n        return (bitset[wordNumber] & (1 << bitNumber))\
    \ != 0;\n    }\n\n    void set(int pos) {\n        int wordNumber = (pos >> 5);\
    \ // divide by 32\n        int bitNumber = (pos & 0x1F); // mod 32\n        bitset[wordNumber]\
    \ |= 1 << bitNumber;\n    }\n}\n```"
