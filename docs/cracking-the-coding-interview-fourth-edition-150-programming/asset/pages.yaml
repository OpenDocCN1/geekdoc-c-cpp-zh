    Gayle Laakmann’s interviewing expertise comes from vast experience on both sides
    of the desk. She has completed Software Engineering interviews with - and received
    offers from Microsoft, Google, Amazon, Apple, IBM, Goldman Sachs, Capital IQ,
    and a number of other firms.


    Of these top companies, she has worked for Microsoft, Apple and Google, where
    she gained deep insight into each company’s hiring practices.


    Most recently, Gayle spent three years at Google as a Software Engineer and was
    one of the company’s lead interviewers. She interviewed 120 candidates in the
    U.S. and abroad, and learned much of the recruiting for her alma mater, the University
    of Pennsylvania.


    Additionally, she served on Google’s Hiring Committee, where she reviewed each
    candidate’s feedback and made hire / no-hire decisions. She assessed over 700
    candidates in that role, and evaluated hundreds resumes.


    In 2005, Gayle founded CareerCup.com to bring her wealth of experience to candidates
    around the world. Launched first as a free forum for interview questions, CareerCup
    now offers a book, a video and mock interviews.


    Gayle holds a bachelor’s and master’s degree in Computer Science from the University
    of Pennsylvania.'
