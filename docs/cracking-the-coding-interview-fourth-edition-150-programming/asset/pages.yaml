  md: '# # Solutions to Chapter 6 | Brain Teasers


    6.3 You have a five quart jug and a three quart jug, and an unlimited supply of
    water (but no measuring cups). How would you come up with exactly four quarts
    of water?

    NOTE: The jugs are oddly shaped, such that filling exactly ''half'' of the jug
    would be impossible.


    pg 60


    # SOLUTION


    We can pour water back and forth between the two jugs as follows:


    | 5 Quart Contents | 3 Quart Contents | Note |

    |---|---|---|

    | 5 | 0 | Filled 5 quart jug |

    | 2 | 3 | Filled 3Q with 5Q''s contents |

    | 0 | 2 | Dumped 3Q |

    | 5 | 2 | Filled 5Q |

    | 4 | 3 | Fill remainder of 3Q with 5Q |

    | | | Done! We have four quarts. |


    # OBSERVATIONS AND SUGGESTIONS:


    +   Many brain teasers have a math / CS root to them—this is one of them! Note
    that as long as the two jug sizes are relatively prime (i.e., have no common prime
    factors), you can find a pour sequence for any value between 1 and the sum of
    the jug sizes.'
