  md: '# At the Interview | Handling Technical Questions


    # General Advice for Technical Questions


    Interviews are supposed to be difficult. If you don''t get every — or any — answer
    immediately, that''s ok! In fact, in my experience, maybe only 10 people out of
    the 120+ that I''ve interviewed have gotten the right question instantly.


    So when you get a hard question, don''t panic. Just start talking aloud about
    how you would solve it.


    And, one more thing: you''re not done until the interviewer says that you''re
    done! What I mean here is that when you come up with an algorithm, start thinking
    about the problems accompanying it. When you write code, start trying to find
    bugs. If you do anything like the other 110 candidates that I''ve interviewed,
    you probably made some mistakes.


    # Five Steps to a Technical Question


    A technical interview question can be solved utilizing a five step approach:


    +   1. Ask your interviewer questions to resolve ambiguity.


    +   2. Design an Algorithm


    +   3. Write pseudo-code first, but make sure to tell your interviewer that you''re
    writing pseudo-code! Otherwise, he/she might think that you''re never planning
    to write "real" code, and many interviewers will hold that against you.


    +   4. Write your code, not too slow and not too fast.


    +   5. Test your code and carefully fix any mistakes.


    # Step 1: Ask Questions


    Technical problems are more ambiguous than they might appear, so make sure to
    ask questions to resolve anything that might be unclear or ambiguous. You may
    eventually wind up with a very different — or much easier — problem than you had
    initially thought. In fact, many interviewers (especially at Microsoft) will specifically
    test to see if you ask good questions.


    Good questions might be things like: What are the data types? How much data is
