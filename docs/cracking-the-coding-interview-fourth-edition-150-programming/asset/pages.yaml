  md: "# Solutions to Chapter 8 | Recursion\n\nin the set (the \"yes\" state) or (2)\
    \ the element is not in the set (the \"no\" state). This means that each subset\
    \ is a sequence of yeses/nos—e.g.,\"yes, yes, no, no, yes, no\"\n\nThis gives\
    \ us 2^n possible subsets. How can we iterate through all possible sequences of\
    \ \"yes\"/\"no\" states for all elements? If each \"yes\" can be treated as a\
    \ 1 and each \"no\" can be treated as a 0, then each subset can be represented\
    \ as a binary string.\n\nGenerating all subsets then just comes down to generating\
    \ all binary numbers (that is, all integers). Easy!\n\n```\nArrayList<ArrayList<Integer>>\
    \ getSubsets(ArrayList<Integer> set) {\n    new ArrayList<ArrayList<Integer>>\
    \ allSubsets =\n    int max = 1 << set.size();\n    for (int i = 0; i < max; i++)\
    \ {\n        ArrayList<Integer> subset = new ArrayList<Integer>();\n        int\
    \ k = i;\n        int index = 0;\n        while ((k > 0) {\n            if ((k\
    \ & 1) > 0)nn                subset.add(set.get(index));\n            k >>= 1;\n\
    \            index++;\n        }\n        allSubsets.add(subset);\n    }\n   \
    \ return allSubsets;\n}\n```"
