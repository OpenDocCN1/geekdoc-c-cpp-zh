  md: '# Solutions to Chapter 16 | Low Level


    16.1 Explain the following terms: virtual memory, page fault, thrashing.


    pg 82


    # SOLUTION


    Virtual memory is a computer system technique which gives an application program
    the impression that it has contiguous working memory (an address space), while
    in fact it may be physically fragmented and may even overflow on disk storage.
    Systems that use this technique make programming of large applications easier
    and use real physical memory (e.g. RAM) more efficiently than those without virtual
    memory.


    http://en.wikipedia.org/wiki/Virtual_memory


    Page Fault: A page is a fixed-length block of memory that is used as a unit of
    transfer between physical memory and external storage like a disk, and a page
    fault is an interrupt (or exception) to the software raised by the hardware, when
    a program accesses a page that is mapped in address space, but not loaded in physical
    memory.


    http://en.wikipedia.org/wiki/Page_fault


    Thrash is the term used to describe a degenerate situation on a computer where
    increasing resources are used to do a decreasing amount of work. In this situation
    the system is said to be thrashing. Usually it refers to two or more processes
    accessing a shared resource repeatedly such that serious system performance degradation
    occurs because the system is spending a disproportionate amount of time just accessing
    the shared resource. Resource access time may generally be considered as the wasted,
    since it does not contribute to the advancement of any process. In modern computers,
    thrashing may occur in the paging system (if there is not ''sufficient'' physical
    memory or the disk access time is overly long), or in the communications system
    (especially in conflicts over internal bus access), etc.


    http://en.wikipedia.org/wiki/Thrash_(computer_science)'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Solutions to Chapter 16 | Low Level


    16.2 What is a Branch Target buffer? Explain how it can be used in reducing bubble
    cycles in cases of branch misprediction.


    # SOLUTION


    Branch misprediction occurs when the CPU mispredicts the next instruction to be
    executed.


    The CPU uses pipelining which allows several instructions to be processed simultaneously.
    But during a conditional jump, the next instruction to be executed depends on
    the result of the condition. Branch Prediction tries to guess the next instruction.
    However, if the guess is wrong, we are penalized because the instruction which
    was executed must be discarded.


    Branch Target Buffer (BTB) reduces the penalty by predicting the path of the branch,
    computing the target of the branch and caching the information used by the branch.
    There will be no stalls if the branch entry on BTB and the prediction is correct,
    otherwise the penalty will be at least two cycles.'
  merge: -1
  img_proc: true
