  md: "# Solutions to Chapter 8 | Recursion\n\n8.1 Write a method to generate the\
    \ nth Fibonacci number.\n\n# SOLUTION\n\nThere are three potential approaches:\
    \ (1) recursive approach (2) iterative approach (3) using matrix math. We have\
    \ described the recursive and iterative approach below, as you would not be expected\
    \ to derive the matrix-based approach in an interview. For the interested math-geeks,\
    \ you may read about the (most efficient) matrix-based algorithm at http://en.wikipedia.org/wiki/Fibonacci_number#Matrix_forn..\n\
    \nRecursive Solution:\n\n```\nint fibo(int n) {\nif (n == 0) {\n    return 0;\
    \ // f(0) = 0\n} else if (n == 1) {\n    return 1; // f(1) = 1\n} else if (n >\
    \ 1) {\n    return fibo(n-1) + fibo(n-2); // f(n) = f(n-1) + f(n-2)\n} else {\n\
    \    return -1; // Error condition\n}\n```\n\nIterative Solution:\n\n```\nint\
    \ fibo(int n) {\nif (n < 0) return -1; // Error condition.\nif (n == 0) return\
    \ 0;\nint a = 1, b = 1;\nfor (int i = 3; i <= n; i++) {\n    int c = a + b;\n\
    \    a = b;\n    b = c;\n}\nreturn b;\n```"
