- pgno: 12
  md: '# Introduction


    # My Approach


    The focus of Cracking the Coding Interview is algorithm, coding and design questions.
    Why? Because while you can and will be asked behavioral questions, the answers
    will be as varied as your resume. Likewise, while many firms will ask so-called
    "trivia" questions (e.g., "What is a virtual function?"); the skills developed
    through practicing these questions are limited to very specific bits of knowledge.
    The book will briefly touch on some of these questions, to show you what they
    are like, but I have chosen to allocate space where there''s more to learn.


    # My Passion


    Teaching is my passion. I love helping people understand new concepts, and giving
    them tools so that they can excel in their passions.


    My first experience "officially" teaching was in college at the University of
    Pennsylvania, when I became a teaching assistant for an undergraduate Computer
    Science course during my second year. I went on to TA for several other courses,
    and eventually launched my own own course at the university focused on "hands-on"
    skills.


    As an engineer at Google, training and mentoring "Nooglers" (yes, that''s really
    what they call new Google employees!) were some of the things I enjoyed most.
    I went on to use my "20% time" to teach two Computer Science courses at the University
    of Washington.


    Cracking the Coding Interview and CareerCup.com reflect my passion for teaching.
    Even now, you can often find me "hanging out" at CareerCup.com, helping users
    stop by for assistance.


    Join us.


    Gayle Laakmann'
