  md: "# Solutions to Chapter 1 | Arrays and Strings\n\n1.4 Write a method to decide\
    \ if two strings are anagrams or not.\n\n# SOLUTION\n\nThere are two easy ways\
    \ to solve this problem:\n\nSolution #1:Sort the strings\n\n```\nboolean anagram(String\
    \ s, String t) {\n    return sort(s) == sort(t);\n}}\n```\n\nSolution #2:Check\
    \ if the two strings have identical counts for each unique char.\n\n```\npublic\
    \ static boolean anagram(String s, String t) {\n    if (s.length() != t.length())\
    \ return false;\n    int[] letters = new int[256];\n    int num_unique_chars =\
    \ 0;\n    int num_completed_t = 0;\n    char[] s_array = s.toCharArray(); // count\
    \ number of each char in s.\n    for (char c : s_array) {\n        if (letters[c]\
    \ == 0) ++num_unique_chars;\n        ++letters[c];\n    }\n    for (int i = 0;\
    \ i < t.length(); i++) {\n        int c = (int) t.charAt(i);\n        if (letters[c]\
    \ == 0) { // Found more of char c in t than s.\n            return false;\n  \
    \      }\n        --letters[c];\n        if (letters[c] == 0) {\n            ++num_completed_t;\n\
    \            if (num_completed_t == num_unique_chars) {\n                // it's\
    \ a match if t has been processed completely\n                return i == t.length()\
    \ - 1;\n            }\n        }\n    }\n    return false;\n}\n```"
