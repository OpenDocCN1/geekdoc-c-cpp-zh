  md: "# Solutions to Chapter 19 | Moderate\n\n19.3 Write an algorithm which computes\
    \ the number of trailing zeros in n factorial.\n\n# SOLUTION\n\nTrailing zeros\
    \ are contributed by pairs of 5 and 2, because 5*2 = 10. To count the number of\
    \ pairs, we just have to count the number of multiples of 5. Note that while 5\
    \ contributes to one multiple of 10, 25 contributes two (because 25 = 5*5).\n\n\
    ```\npublic static int numZeros(int num) {\n    int count = 0;\n    if (num <\
    \ 0) {\n        System.out.println(\"Factorial is not defined for < 0\");\n  \
    \      return 0;\n    }\n    for (Int i = 5; num > i; i *= 5) {\n        count\
    \ += num / i;\n    }\n    return count;\n}\n```\n\nLet's walk through an example\
    \ to see how this works: Suppose num = 26. In the first loop, we count how many\
    \ multiples of five there are by doing 26 / 5 = 5 (these multiples are 5, 10,\
    \ 15, and 20). In the next loop, we count how many multiples of 25 there are:\
    \ 26 / 25 = 1 (this multiple is 25). Thus, we see that we get one zero from 5,\
    \ 10, 15 and 20, and two zeros from 25 (note how it was counted twice in the loops).\
    \ Therefore, 26! has six zeros.\n\n# OBSERVATIONS AND SUGGESTIONS:\n\n> This is\
    \ a bit of a brain teaser, but it can be approached logically (as shown above).\
    \ By thinking through what exactly will contribute a zero, and what doesn't matter,\
    \ you can come up with a solution. Again, be very clear in your rules up front\
    \ so that you can implement this correctly."
