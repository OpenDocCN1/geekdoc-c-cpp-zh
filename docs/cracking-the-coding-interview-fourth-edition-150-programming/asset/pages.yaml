  md: '# Before the Interview | Technical Preparation


    # What You Need To Know


    Most interviewers won''t ask about specific algorithms for binary tree balancing
    or other complex algorithms. Frankly, they probably don''t remember these algorithms
    either.


    You''re usually only expected to know the basics. Here''s a list of the absolute-must-have
    knowledge:


    | Data Structures | Algorithms | Concepts |

    |---|---|---|n| Linked Lists | Breadth First Search | Bit Manipulation |

    | Binary Trees | Depth First Search | Singleton Design Pattern |

    | T | Binary Search | Factory Design Pattern |

    | Stacks | Merge Sort | Memory (Stack vs Heap) |

    | Queues | Quick Sort | Recursion |

    | Vectors / ArrayLists | Tree Insert / Find / etc | Big-O Time |

    | Hash Tables | | |


    This is not, course, an all-inclusive list. Questions may be asked on areas outside
    of these topics. This is merely a "must know" list.


    For each of the topics, make sure you understand how to implement / use them,
    and (where applicable) implement them directly, or you might be asked to implement
    a modification of them.


    Practice implementing the data structures and algorithms. You might be asked to
    implement a modification of them. Either way, the more comfortable you are with
    implementations the better.


    # Do you need to know details of C++, Java, etc?


    While I personally never liked asking these sorts of questions (e.g., "what is
    a vtable?"), many interviewers regretfully ask them. For big companies like Microsoft,
    Google, Amazon, etc, I wouldn''t stress too much about these questions. Look up
    the most common questions and make sure you have answers to them, but I would
    focus more on data structures and algorithms preparation.


    At smaller companies, or non-software companies, these questions can be more important.
    Look up your company on CareerCup.com to decide for yourself. If your company
    isn''t listed, find a similar company as a reference.'
