    \n= makeChange(100 using 0 quarters) + makeChange(100 using 1 quarter) + makeChange(100\
    \ using 2 quarter) + makeChange(100 using 3 quarter) + makeChange(100 using 4\
    \ quarters)\n\nCan we reduce this further?\n\n= makeChange(100 using 0 quarters)\
    \ + makeChange(75 using 0 quarter) + makeChange(50 using 0 quarters) + makeChange(25\
    \ using 0 quarters) + 1\n\nNow what? We've used up our quarters, so we can now\
    \ start applying our next biggest denomination: dimes\n\nThis leads to a recursive\
    \ algorithm that looks like this:\n\n```\npublic static int makeChange(int n,\
    \ int denom) {\n    int next_denom = 0;\n    switch (denom) {\n        case 25:\n\
    \            next_denom = 10;\n            break;\n        case 10:\n        \
    \    next_denom = 5;\n            break;\n        case 5:\n            next_denom\
