  md: "# Solutions to Chapter 9 | Sorting and Searching\n\n9.1 You are given two sorted\
    \ arrays, A and B, and A has a large enough buffer at the end to hold B. Write\
    \ a method to merge B into A in sorted order.\n\npg 66\n\n# SOLUTION\n\nThis code\
    \ is a part of the standard merge-sort code. We merge A and B from the back, comparing\
    \ each element.\n\n```\npublic static void merge(int[] a, int[] b, int n, int\
    \ m) {\n    int k = m + n - 1; // Index of last location of array b\n    int i\
    \ = n - 1; // Index of last element in array b\n    int j = m - 1; // Index of\
    \ last element in array a\n\n    // Start comparing from the last element and\
    \ merge a and b\n    while (i >= 0 && j >= 0) {\n        if (a[i] > b[j]) {\n\
    \            a[k--] = a[i--];\n        } else {\n            a[k--] = b[j--];\n\
    \        }\n    }\n    while (j >= 0) {\n        a[k--] = b[j--];\n    }\n}\n\
    ```\n\nNote: You don't need to copy the contents of the a after running out of\
    \ b's. They are already in place."
