  md: '# At the Interview | Frequently Asked Questions


    this means jeans (nice jeans with no holes) or slacks with a nice shirt or sweater
    is fine. In a bank or another more formal institution, however, avoid jeans and
    wear slacks instead.


    # What language should I use?


    Many people will tell you "whatever language you''re most comfortable with," but
    ideally you want to use a language that your interviewer is comfortable with.
    I''d usually recommend coding in either C. C++ or Java, as the vast majority of
    interviewers will be comfortable in one of these languages. My personal preference
    for interfaces is Java (unless it''s requiring C / C++), because it''s quick to
    write and almost everyone can read and understand Java, even if they code mostly
    in C++. (Almost all the solutions in this book are written in Java for this reason.)


    # I didn’t hear back immediately after my interview. Am I rejected?


    Absolutely not. Responses can be held up for a variety of reasons that have nothing
    to do with a good or bad performance. For example, an interviewer could have gone
    on vacation right after your interview. A company will always tell you if you’re
    rejected (or at least if you never heard of a company which didn’t).


    # Can I re-apply to a company after getting rejected?


    Almost always, but you typically have to wait a bit (6 months – 1 year). Your
    first bad interview won''t affect you much when you re-interview. Lots of people
    get rejected from Google or Microsoft and later get offers.


    # What about experienced candidates?


    This depends a lot on the company. On average though, experienced candidates will
    slightly get more questions about their background, and they might face higher
    standards when discussing system architecture (if this is relevant to their experience).
    For the most part though, experienced candidates face the same process.


    Yes, for better or worse, they should expect to go through the same coding and
    algorithm questions. With respect to their performance, they could face either
    higher standards (because they have more experience) or lower standards (because
    it''s likely been many years since they worked with certain data structures).'
