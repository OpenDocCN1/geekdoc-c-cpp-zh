  md: "# Chapter 12 | System Design and Memory Limits\n\n# How to Approach:\n\nDon't\
    \ be scared by these types of questions. Unless you claim to know how to design\
    \ large systems, your interviewer probably won't expect you to know this stuff\
    \ automatically. They just want to see how you tackle these problems.\n\n# General\
    \ Approach\n\nThe general approach is as follows: Imagine we're designing a hypothetical\
    \ system for millions of items (users, files, megabytes, etc):\n\n+   1. How would\
    \ you solve it for a small number of items? Develop an algorithm for this case,\
    \ which is often pretty straight-forward.\n2. What happens when you try to implement\
    \ that algorithm with millions of items? It's likely that you have run out of\
    \ space on the computer. So, divide up the files across many computers.\n   >\
    \ How do you divide data across many machines? That is, do the first 100 items\
    \ appear on the same computer? Or all items with the same hash value mod 100?\n\
    \   > About how many computers will you need? To estimate this, ask how big each\
    \ item is and take a guess at how much a typical computer has.\n3. Now, fix the\
    \ problems that occur when you are using many computers. Make sure to answer the\
    \ following questions:\n   > How does one machine know which machine it should\
    \ access to look up data? How do you handle that?\n   > Can data get out of sync\
    \ across computers? How do you handle that?\n   > How can you minimize expensive\
    \ reads across many computers?\n\n# Example: Design a Web Crawler\n\n+   1. Forget\
    \ about the fact that you're dealing with billions of pages. How would you design\
    \ this system if it were just a small number of pages? You should have an understanding\
    \ of how you would solve the simple, small case in order to understand how you\
    \ would solve the bigger case.\n2. Now, think about the issues that occur with\
    \ billions of pages. Most likely you can't fit the data on one machine. How will\
    \ you divide it up? How will you figure out which computer has a particular piece\
    \ of data?\n3. You now have different pieces of data on different machines. What\
    \ problems might that create? You can try to solve them?\n\nAnd remember, don't\
