  md: "# Solutions to Chapter 13 | C++\n\n13.3 How do virtual functions work in C++?\n\
    \n# SOLUTION\n\nA virtual function depends on a \"vtable\" or \"Virtual Table\"\
    . If any function of a class is declared as virtual, a v-table is constructed\
    \ which stores addresses of the virtual functions of this class. The compiler\
    \ also adds a hidden vptr variable in all classes which points to the vtable of\
    \ that class. If a virtual function is not overridden in the derived class, the\
    \ vtable of the derived class stores the address of the function in its parent\
    \ class. The v-table is used to resolve the address of the function, for the virtual\
    \ function is called. Dynamic binding in C++ is therefore performed through the\
    \ vtable mechanism.\n\nThus, when we assign the derived class object to the base\
    \ class pointer, the vptr points to the vtable of the derived class. This assignment\
    \ ensures that the most derived virtual function gets called.\n\n```\nclass Shape\
    \ {\npublic:\n    int edge_length;\n    virtual int circumference() {\n      \
    \  cout << \"Circumference of Base Class\\n\"\n        return 0;\n    }\n}\nclass\
    \ Triangle: public Shape {\npublic:\n    int circumference() {\n        cout <<\
    \ \"Circumference of Triangle Class\\n\"\n        return 3 * edge_length;\n  \
    \  }\n}\nvoid main() {\n    Shape *x = new Shape();\n    x->circumference(); //\
    \ prints \"Circumference of Base Class\"\n    Shape *y = new Triangle();\n   \
    \ y->circumference(); // prints \"Circumference of Triangle Class\"\n}\n```\n\n\
    In the above example, circumference is a virtual function in shape class, so it\
    \ becomes virtual in each of the derived classes (triangle, rectangle). C++ non-virtual\
    \ function calls are resolved at compile time with static binding, while virtual\
    \ function calls are resolved at run time with dynamic binding.\n\n![](img/50974dc108b2978cf2cacf9397df9934_223_0.png)"
