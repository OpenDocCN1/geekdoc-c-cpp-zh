  md: "# Solutions to Chapter 1 | Arrays and Strings\n\n1.5 Write a method to replace\
    \ all spaces in a string with '%20'.\n\n# SOLUTION\n\nThe algorithm is as follows:\n\
    \n+   1. Count the number of spaces during the first scan of the string.\n2. Parse\
    \ the string again from the end and for each character:\n   - If a space is encountered,\
    \ store \"%20\"\n   - Else, store the character as it is in the newly shifted\
    \ location.\n\n```\npublic static void ReplaceFun(char[] str, int length) {\n\
    \    int spaceCount = 0, newLength, i = 0;\n    for (i = 0; i < length; i++) {\n\
    \        if (str[i] == ' ') {\n            spaceCount++;\n        }\n    }\n \
    \   newLength = length + spaceCount * 2;\n    str[newLength - 1] = '\\0';\n  \
    \  for (i = length - 1; i >= 0; i--) {\n        if (str[i] == ' ') {\n       \
    \     str[newLength - 1] = '0';\n            str[newLength - 2] = '2';\n     \
    \       str[newLength - 3] = '%';\n            newLength = newLength - 3;\n  \
    \      } else {\n            str[newLength - 1] = str[i];\n            newLength\
    \ = newLength - 1;\n        }\n    }\n}\n```\n\n![](img/50974dc108b2978cf2cacf9397df9934_106_0.png)"
