  md: '# At the Interview | Five Algorithm Approaches


    # Five Algorithm Approaches


    There''s no sure approach to solving a tricky algorithm problem, but the approaches-low
    can be useful. Keep in mind that the more problems you practice, the easier it
    will be to identify which approach to use.


    Also, remember that the five approaches can be “mixed and matched.” That is, once
    you’ve applied “Simplify & Generalize”, you may want to implement Pattern Matching
    next.


    # APPROACH I: EXAMPLING


    Description: Write out specific examples of the problem, and see if you can figure
    out a gen-eral rule.


    Example: Given a time, calculate the angle between the hour and minute hands.


    Approach: Start with an example like 3:27. We can draw a picture of a clock by
    selecting where the 3 hour hand is and where the 27 minute hand is.


    By playing around with these examples, we can develop a rule:


    +   - Minute angle (from 12 o''clock): 360 minutes / 60

    - Hour angle (from 12 o''clock): 360 * (hour % 12) / 12 + 360 * (minutes / 60)
    * (1 / 12)

    - Angle between hour and minute: hour angle - minute angle % 60


    By simple arithmetic, this reduces to 30 * hours - 5.5 * minutes.


    # APPROACH II: PATTERN MATCHING


    Description: Consider what problems the algorithm is similar to, and figure out
    if you can modify the solution to develop an algorithm for this problem.


    Example: A sorted array has been rotated so that the elements might appear in
    the order 3 4 5 6 7 1 2. How would you find the minimum element?


    Similar Problems:


    +   - Find the minimum element in an array.

    - Find a particular element in an array (eg, binary search).


    Algorithm:


    Finding the minimum element in an array isn''t a particularly interesting algorithm
    (you could iterate through all the elements), nor does it use the information
    provided (that the array is sorted). It''s unlikely to be useful here.


    However, binary search is very applicable. You know that the array is sorted,
    but rotated. So, it must proceed in an increasing order, then reset and increase
    again. The minimum element is the “reset” point.


    ![](img/50974dc108b2978cf2cacf9397df9934_40_0.png)'
