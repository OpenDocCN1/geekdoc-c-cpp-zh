  md: "# Solutions to Chapter 5 | Bit Manipulation\n\n5.1 You are given two 32-bit\
    \ numbers, N and M, and two bit positions, i and j. Write a method to set all\
    \ bits between i and j in N equal to M (e.g., M becomes a substring of N located\
    \ at i and starting at j).\n\nEXAMPLE:\nInput: N = 1000000000, M = 10101, i =\
    \ 2, j = 6\nOutput: N = 10010101000\n\n# SOLUTION\n\nThis code operates by clearing\
    \ all bits in N between position i and j, and then ORing to put M in there.\n\n\
    ```\npublic static int updateBits(int n, int m, int i, int j) {\n    int max =\
    \ ~0; /* All 1's */\n\n    // 1's through position j, then 0's\n    int left =\
    \ max - ((1 << j) - 1);\n\n    // 1's after position i\n    int right = ((1 <<\
    \ i) - 1);\n\n    // 1's, with 0's between i and j\n    int mask = left | right;\n\
    \n    // Clear through j, then put m in there\n    return (n & mask) | (m << i);\n\
    }\n```"
