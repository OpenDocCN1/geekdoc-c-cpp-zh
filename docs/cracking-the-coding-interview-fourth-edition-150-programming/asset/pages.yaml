- pgno: 20
  md: '# Interview War Stories


    the next few months or years, and they want to know that they can rely on you
    – and maybe even come to consider you a friend and colleague. They want to know
    that they can depend on you. And as tempting as it might be to them to just settle
    and hire the next person who comes along, they know better.


    In many companies, particularly large U.S. companies, it''s harder to fire somebody
    than it is to hire somebody. (Welcome to the US: Land of Lawsuits!) If they hire
    a dud, they''re stuck with them. That person might be unproductive or, even worse,
    a drain on the team''s productivity. So they keep interviewing, until they find
    the right person. They know that it''s better to reject a good candidate than
    hire a bad one.


    Some of those interviews are real doozies. Once you''ve interviewed long enough,
    you build up a repertoire of horror stories. War stories, of candidates who looked
    promising on paper until the interviews went terribly, terribly wrong. These war
    stories are not only humorous – they''re also instructive.


    Names have been changed to protect the innocent – or downright ridiculous.'
