  md: '# Solutions to Chapter 20 | Hard


    **20.12** Given an NxN matrix of positive and negative integers, write code to
    find the submatrix with the largest possible sum.

    pg 92


    # SOLUTION


    **Brute Force: Complexity O(N^6)**


    Like many “maximizing” problems, this problem has a straight forward brute force
    solution. The brute force solution simply iterates through all possible sub-matrices,
    computes the sum, and finds the biggest.


    To iterate through all possible sub-matrices (with no duplicates), we simply need
    to iterate through all ordered pairings of rows, and then all ordered pairings
    of columns.


    This solution is O(N^6), since we iterate through O(N^4) sub-matrices, and it
    takes O(N^2) to compute the area of each.


    **Optimized Solution: O(N^4)**


    Notice that the earlier solution is slower by a factor of O(N^2) simply because
    computing the sum of a matrix is so slow. Can we reduce the time to compute the
    area? Yes! In fact, we can reduce the time of computeSum to O(1).


    Consider the following:


    | A | C |

    | B | D |


    If we had the sum of the smaller rectangle (the one including A, B, C, D), and
    we could compute the sum of D as follows: area(D) = area(A through D) - area(A)
    - area(B) - area(C).


    What if, instead, we had the following:


    | x1 | x2 |

    | y1 | A | C |

    | y2 | B | D |


    with the following values (notice that each Val* starts at the origin):'
