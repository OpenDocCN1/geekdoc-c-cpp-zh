- pgno: 255
  md: '# Solutions to Chapter 17 | Networking


    17.1 Explain what happens, step by step, after you type a URL into a browser.
    Use as much detail as possible.


    # SOLUTION


    There''s no right, or even complete, answer for this question. This question allows
    you to go into arbitrary amounts of detail depending on what you''re comfortable
    with. Here''s a start though:


    +   1. Browser contacts the DNS server to find the IP address of URL.

    2. DNS returns back the IP address of the site.

    3. Browser opens TCP connection to the web server at port 80.

    4. Browser fetches the html code of the page requested.

    5. Browser renders the HTML in the display window.

    6. Browser terminates the connection when window is closed.


    One of the most interesting steps is Step 1 and 2 - "Domain Name Resolution."
    The web addresses we type are nothing but an alias to an IP address in human readable
    form. Mapping of domain names and their associated Internet Protocol (IP) addresses
    is managed by the Domain Name System (DNS), which is a distributed but hierarchical
    entity.


    Each domain name server is divided into zones. A single server may only be responsible
    for knowing the host names and IP addresses for a small subset of a zone, but
    DNS servers can work together to map all domain names to their IP addresses. That
    means if one domain name server is unable to find the IP addresses of a requested
    domain then it requests the information from other domain name servers.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Solutions to Chapter 17 | Networking


    17.2 Explain any common routing protocol in detail. For example: BGP, OSPF, RIP.


    # SOLUTION


    Depending on the reader''s level of understanding, knowledge, interest or career
    aspirations, he or she may wish to explore beyond what is included here. Wikipedia
    and other websites are great places to look for a deeper understanding. We will
    provide only a short summary.


    BGP: Border Gateway Protocol


    BGP is the core routing protocol of the Internet. "When a BGP router first comes
    up on the Internet, either for the first time or after being turned off, it establishes
    connections with the other BGP routers with which it directly communicates. The
    first thing it does is download the routing table of each neighboring router.
    After that it exchanges shorter update messages with other routers.


    BGP routers send and receive update messages to indicate a change in the preferred
    path to reach a computer with a given IP address. If the router decides to update
    its own routing tables then it will be better to propagate this information to
    all of the other BGP routers to which it is connected, and it will turn decide
    whether to update their tables and propagate the information further.


    Borrowed from http://www.livinginternet.com/i/iw_route_egp_bgp.htm.


    RIP: Routing Information Protocol


    > "RIP provides the standard IGP protocol for local area networks, and provides
    great network stability, guaranteeing that if one network connection goes down
    the network can quickly adapt to send packets through another connection."


    > "What makes RIP work a routing database that stores information on the fastest
    route from computer to computer, an update process that enables each router to
    tell other routers which is the fastest from its point of view, and an update
    algorithm that enables each router to update its database with the fastest route
    communicated from neighboring routers."


    Borrowed from http://www.livinginternet.com/i/iw_route_igp_rip.htm.


    OSPF: Open Shortest Path First


    > "Shortest Path First (OSPF) is a particularly efficient IGP routing protocol
    that is faster than RIP, but also more complex."


    The main difference between OSPF and RIP is that RIP only keeps track of the closest
    router for each destination address, while OSPF keeps track of a complete topological
    database of all connections in the local network. The OSPF algorithm works as
    described below.'
