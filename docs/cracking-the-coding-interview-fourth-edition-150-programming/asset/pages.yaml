- pgno: 47
  md: '# # At the Interview | Frequently Asked Questions


    # ## Do I have to get every question right?


    No. A good interviewer will stretch your mind. They''ll want to see you struggle
    with a difficult problem. If a candidate is good, they''ll ask harder and tougher
    questions until he/she is stumped! Thus, if you have trouble on a question, all
    it means is that the interviewer is doing their job!


    # ## Should I tell my interviewer if I know a question?


    Yes! You should definitely tell your interviewer if you''ve previously heard the
    question. This seems silly to some people - if you already know the question (and
    answer), you could ace the question, right? Not quite.


    Here''s why we strongly recommend that you tell your interviewer that you''ve
    heard the problem before:


    +   1. Big honesty points. This shows a lot of integrity - that''s huge! Remember
    that the interviewer is evaluating you as a potential teammate. I don''t know
    about you, but I personally prefer to work with honest people!

    2. The question might have changed ever-so-slightly. You don''t want to risk repeating
    the wrong answer.

    3. If you easily belt out the right answer, it''s obvious to the interviewer.
    They know how difficult a problem is supposed to be. It''s very hard to "pretend"
    to struggle through a question, because you can''t approach it the same way other
    candidates do.


    # ## How are interview questions selected?


    This depends on the company, but any number of ways:


    +   1. Pre-Assigned List of Questions: This is unusual at bigger companies.

    2. Assigned Topics: Each interviewer is assigned a specific area to probe, but
    decides on his/her own questions.

    3. Interviewer''s Choice: Each interviewer assigns whatever he / she wants. Typically,
    under this system, the interviewers have a way of tracking which questions were
    already asked to a candidate to ensure a good diversity of questions.


    Approach #3 is the most common. This usually means that interviewers will each
    have a "stock" set of five or so questions that they ask candidates.


    # ## How should I dress?


    Generally, candidates should dress one small step above the average employee in
    their position, or as nicely as the nicest dressed employees in their position.
    In most software firms,'
