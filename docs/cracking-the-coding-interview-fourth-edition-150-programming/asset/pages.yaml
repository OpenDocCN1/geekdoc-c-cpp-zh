- pgno: 227
  md: "# Solutions to Chapter 13 | C++\n\n13.7 Why does a destructor in base class\
    \ need to be declared virtual? pg 76\n\n# SOLUTION\n\nCalling a method with an\
    \ object pointer always invokes:\n\n+   >> the most derived class function, if\
    \ a method is virtual.\n\n+   >> the function implementation corresponding to\
    \ the object pointer type (used to call the method), if a method is non-virtual.\n\
    \nA virtual destructor works in the same way. A destructor gets called when an\
    \ object goes out of scope or when we delete on an object pointer.\n\nWhen any\
    \ derived class object goes out of scope, the destructor of that derived class\
    \ gets called first. Then it calls its parent class destructor so memory allocated\
    \ to the object is properly released.\n\nBut, if we delete an object on a base\
    \ pointer which points to a derived class object, the base class destructor gets\
    \ first (for non-virtual function). For example:\n\n```\nclass Base {\n  public:\n\
    \  Base() { cout << \"Base Constructor \" << endl; }\n  ~Base() { cout << \"Base\
    \ Destructor \" << endl; } /* see below */\n};\nclass Derived: public Base {\n\
    \  public:\n  Derived() { cout << \"Derived Constructor \" << endl; }\n  ~Derived()\
    \ { cout << \"Derived Destructor \" << endl; }\n};\nvoid main() {\n  Base *p =\
    \ new Derived();\n  delete p;\n}\n```\n\nOutput:\nBase Constructor\nDerived Constructor\n\
    Base Destructor\n\nIf we declare the base class destructor as virtual, this makes\
    \ all the derived class destructors virtual as well. Note this thing about being\
    \ ordered into the v-table.\n\nIf we replace the above destructor with:\n\n```\n\
    virtual ~Base() {\n  cout << \"Base Destructor\" << endl;\n}\n```"
