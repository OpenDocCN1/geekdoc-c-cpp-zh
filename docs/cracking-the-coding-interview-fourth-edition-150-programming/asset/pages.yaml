  md: "# Solutions to Chapter 13 | C++\n\n13.6 What is name hiding in C++ pg 76\n\n\
    # SOLUTION\n\nLet us explain through an example. In C++, when you have a class\
    \ with an overloaded method, and you then extend and override that method, you\
    \ must override all of the overloaded methods.\n\nFor example:\n\n```\nclass FirstClass\
    \ {\npublic:\n    virtual void MethodA (int);\n    virtual void MethodA (int,\
    \ int);\n};\nvoid FirstClass::MethodA (int i) {\n    std::cout << \"ONE!!\\n\"\
    ;\n}\n```\n\nThis is a simple class with two methods (or one overloaded method).\
    \ If you want to override the one-parameter version, you can do the following:\n\
    \n```\nclass SecondClass : public FirstClass {\npublic:\n    void MethodA (int);\n\
    };\nvoid SecondClass::MethodA (int i) {\n    std::cout << \"THREE!!\\n\";\n}\n\
    void main () {\n    SecondClass a;\n    a.MethodA (1);\n    a.MethodA (1, 1);\n\
    }\n```\n\nHowever, the second call will not work, since the two-parameter MethodA\
    \ is not visible. That is name hiding."
