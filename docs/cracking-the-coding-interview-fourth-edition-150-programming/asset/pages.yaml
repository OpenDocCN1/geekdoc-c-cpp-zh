  md: "# Solutions to Chapter 20 Hard\n\n20.2 Write a method to shuffle a deck of\
    \ cards. It must be a perfect shuffle - in other words, each 52! permutations\
    \ of the deck has to be equally likely. Assume that you are given a random number\
    \ generator which is perfect.\n\n# SOLUTION\n\nThis is a very known interview\
    \ question, and a well known algorithm. If you aren’t one of the lucky few to\
    \ have already know this algorithm, read on.\n\nLet’s start with a brute force\
    \ approach: we could randomly selecting items and put them into a new array. We\
    \ must make sure that we don’t pick the same item twice somehow marking the node\
    \ as dead.\n\nArray: [1] [2] [3] [4] [5]\nRandomly select 4: [4] [?] [?] [?] [?]\n\
    Mark element as dead: [1] [2] [3] [X] [5]\n\nThe tricky part is, how do we mark\
    \ [4] as dead such that we prevent element from being picked again? One way to\
    \ do it is to swap the now-dead [4] with the first element in the array:\n\nArray:\
    \ [1] [2] [3] [4] [5]\nRandomly select 4: [4] [?] [?] [?] [?]\nSwap dead element:\
    \ [X] [2] [3] [1] [5]\n\nBy doing this way, it is much easier to “know” that the\
    \ first k elements are dead than the third, fourth, ninth, etc elements are dead.\
    \ We can also optimize this by merging the shuffled array and the original array.\n\
    \nRandomly select 4: [4] [2] [3] [1] [5]\nRandomly select 3: [4] [3] [2] [1] [5]\n\
    \nThis is an easy algorithm to implement iteratively:\n\n```\npublic static void\
    \ shuffleArray(int[] cards) {\n    int temp, index;\n    for (int i = 0; i < cards.length;\
    \ i++){\n        index = (int)Math.random() * (cards.length - i)) + i;\n     \
    \   temp = cards[i];\n        cards[i] = cards[index];\n        cards[index] =\
