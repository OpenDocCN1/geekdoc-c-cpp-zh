  md: "# Solutions to Chapter 8 | Recursion\n\n8.5 Implement algorithm to print all\
    \ valid (e.g., properly opened and closed) combinations of n-pairs of parentheses.\n\
    \nEXAMPLE:\ninput: 3 (e.g., 3 pairs of parentheses)\noutput: 000, 0(0), (0)(0),\
    \ ((() )\n\n# SOLUTION\n\nWe can solve this problem recursively by recursing through\
    \ the string. On each iteration, we have the index for a particular character\
    \ in the string. We need to select either a left or right paren. When can we use,\
    \ and when can we use a right paren?\n\n+   - Left: As long as we haven't used\
    \ up all the left parentheses, we can always insert a left paren.\n\n+   - Right:\
    \ When we insert a right paren as long as it won't lead to a syntax error. When\
    \ will we get a syntax error? We will get a syntax error if there are more right\
    \ parentheses than left.\n\nSo, we simply keep track of the number of left and\
    \ right parentheses allowed. If there are left parens remaining, we'll insert\
    \ a left paren and recurse. If there are more right parens remaining than left\
    \ (if there are more left parens used), we'll insert a right paren and recurse.\n\
    \n```\npublic static void printPa(int l, int r, char[] str, int count) {\n   \
    \ if (l < 0 || r < 1) return; // invalid state\n    if (l == 0 && r == 0) {\n\
    \        System.out.println(str); // found one, so print it\n    } else {\n  \
    \      if (l > 0) { // try a left paren, if there are some available\n       \
    \     str[count] = '(';\n            printPar(l - 1, r, str, count + 1);\n   \
    \     }\n        if (r > 1) { // try a right paren, if there's a matching left\n\
    \            str[count] = ')';\n            printPar(l, r - 1, str, count + 1);\n\
    \        }\n    }\n}\npublic static void printPar(int count) {\n    char[] str\
    \ = new char[count*2];\n    printPar(count, count, str, 0);\n}\n```\n\n![](img/50974dc108b2978cf2cacf9397df9934_180_0.png)"
