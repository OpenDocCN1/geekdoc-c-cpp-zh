  md: "# Solutions to Chapter 19 | Moderate\n\n**19.10** Write a method to generate\
    \ a random number between 1 and 7, given a method that generates a random number\
    \ between 1 and 5 (i.e., implement rand7() using rand5()).\n\npg 90\n\n# SOLUTION\n\
    \nFirst, observe that we cannot do this in a guaranteed finite amount of time.\
    \ Why? Let's see by a parallel example: How would you use rand2() to create rand3()?\n\
    \nObserve that each call of rand2() and the corresponding decision you make can\
    \ be represented by a decision tree. On each node, you have two branches. You\
    \ take the left one when rand2() equals 0 (which happens with 1/2 probability),\
    \ the right equals 1 (which happens with 1/2 probability). You continue branching\
    \ left and right as you continue to 1/2. When you reach a leaf, you return a result\
    \ of 1, 2 or 3 (your rand3() using results).\n\n![](img/50974dc108b2978cf2cacf9397df9934_283_0.png)\n\
    \n+   - What's the probability of taking each branch? 1/2.\n\n+   - What's the\
    \ probability of reaching a particular leaf node? 1/2^j (for some j).\n\n+   -\
    \ What about the probability of returning 3 (for example)? We could compute this\
    \ by summing the probabilities of reaching each leaf node with value 3. Each of\
    \ these paths has probability 1/2^j, so we know that the total probability of\
    \ returning 3 must be a series of terms of reciprocal powers of 2 (e.g., 1/2^x\
    \ + 1/2^y + 1/2^z + ...\n\nWe also know, however, that the probability of returning\
    \ 3 must be 1/3 (because rand3() should be perfectly random). You can find some\
    \ of reciprocal powers of 2 that sum to 1/3? No, because 3 and 2 are relatively\
    \ prime.\n\nWe can similarly conclude that to solve this problem, we will need\
    \ to accept a small (infinitesimally small) chance that this process will repeat\
    \ forever. That's.\n\nIn order to generate a random number between 1 and 7, we\
    \ just need to uniformly generate a larger range than we are looking for and then\
    \ repeatedly sample until we get a number that is good for us. We will generate\
    \ a base 5 number with two places with two calls to the RNG.\n\n```\npublic static\
    \ int rand7() {\n    while (true) {\n        int num = 5 * (rand5() - 1) + (rand5()\
    \ - 1);\n        if (num < 21) return (num % 7 + 1);\n    }\n}\n```\n\n![](img/50974dc108b2978cf2cacf9397df9934_283_1.png)"
