  md: "# Solutions to Chapter 7 | Object Oriented Design\n\n7.10 Describe the data\
    \ structures and algorithms that you would use to implement a garbage collector\
    \ in C++.\n\n# SOLUTION\n\nIn C++, garbage collection with reference counting\
    \ is almost always implemented with smart pointers, which perform reference counting.\
    \ The main reason for using smart pointers over raw ordinary pointers is the conceptual\
    \ simplicity of implementation and usage. With smart pointers everything related\
    \ to garbage collection is performed behind the scenes - typically in constructors\
    \ / destructors / assignment operator / explicit object management functions.\n\
    \nThere are two types of functions, both of which are very simple:\n\n```\nRefCount::type1()\
    \ {\n    /* implementation depends on reference counting organisation.\n    *\
    \ There can also be no ref. counter at all (see approach #4) */\n    incrementRefCount();\
    \ }\n\nRefCounter::type2() {\n    /* Implementation depends on reference counting\
    \ organisation.\n    * There can also be no ref. counter at all (see approach\
    \ #4). */\n    decrementRefCount();\n    if (referenceCounterIsZero()) {\n   \
    \     destructObject();\n    }\n}\n```\n\nThere are several approaches for reference\
    \ counting implementation in C++:\n\n+   1. Simple reference counting.\n   struct\
    \ Object { };\n   struct RefCount {\n       int count;\n   };\n   struct RefCountPtr\
    \ {\n       Object * pointee;\n       RefCount * refCount;\n   };\n\nAdvantages:\
    \ performance.\n\nDisadvantages: memory overhead because of two pointers.\n\n\
    +   2. Alternative reference counting."
