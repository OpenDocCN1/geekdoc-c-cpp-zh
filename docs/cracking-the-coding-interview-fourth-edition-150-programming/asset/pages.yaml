  md: "# Solutions to Chapter 18 | Threads and Locks\n\n18.6 You are given a class\
    \ with synchronized method A, and a normal method C. If you have two threads in\
    \ one instance of a program, can they call A at the same time? Can they call A\
    \ and C at the same time?\n\n# SOLUTION\n\nJava provides two ways to achieve synchronization:\
    \ synchronized method and synchronized statement.\n\nSynchronized method: Methods\
    \ of a class which need to be synchronized are declared with \"synchronized\"\
    keyword. If one thread is executing a synchronized method, all other threads which\
    \ want to execute any of the synchronized methods on the same object gets blocked.\n\
    \nSyntax: method1 and method2 need to be synchronized\n\n```\npublic class SynchronizedMethod\
    \ {\n    // Variables declaration\n    public synchronized returnntype Method1()\
    \ {\n        // Statements\n    }\n    public synchronized returnntype method2()\
    \ {\n        // Statements\n    }\n    // Other methods\n}\n```\n\nSynchronized\
    \ statement: It provides the synchronization for a group of statements rather\
    \ than a method as a whole. It needs to provide the object on which these synchronized\
    \ statements will be applied, unlike in a synchronized method.\n\nSyntax: synchronized\
    \ statements on \"this\" object\n\n```\nsynchronized(this) {\n    /* statement\
    \ 1\n    ...\n    * statement N */\n}\n```\n\ni) If you have two threads in one\
    \ instance of a program, can they call A at the same time?\nNot possible; read\
    \ the above paragraph.\n\nii) Can they call A and C at the same time?\n\nYes.\
    \ Only methods of the same object which are declared with the keyword synchronized\
    \ can't be interleaved."
