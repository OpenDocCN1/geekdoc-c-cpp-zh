  md: '# Solutions to Chapter 5 | Bit Manipulation


    ```

    1 int findMissing(ArrayList<BitInteger> array) {

    2   return findMissing(array, BitInteger.INTEGER_SIZE - 1);

    3 }

    45 int findMissing(ArrayList<BitInteger> input, int column) {

    6   If (column < 0) { // Base case and error condition

    7     return 0;

    8   }

    9   ArrayList<BitInteger> oddIndices = new ArrayList<BitInteger>();

    10  ArrayList<BitInteger> evenIndices = new ArrayList<BitInteger>();

    11  for (BitInteger t : input) {

    12    if (t.fetch(column) == 0) {

    13       evenIndices.add(t);

    14    } else {

    15       oddIndices.add(t);

    16    }

    17  }

    18  if (oddIndices.size() >= evenIndices.size()) {

    19    return (findMissing(evenIndices, column - 1)) << 1;

    20  } else {

    21    return (findMissing(oddIndices, column - 1)) << 1;

    22  }

    23 }

    ```


    What is the run-time of the algorithm? On the first pass, we look at O(N) bits.
    On the second pass, we''ve eliminated N/2 numbers, so we then look at O(N/2) bits.
    On the third pass, we have eliminated another half of the numbers, so we then
    look at O(N/4) bits. If we keep go-ing, we get an equation that looks like:


    O(N) + O(N/2) + O(N/4) + O(N/8) + ... = O(2N) = O(N)


    Our run-time is O(N).'
