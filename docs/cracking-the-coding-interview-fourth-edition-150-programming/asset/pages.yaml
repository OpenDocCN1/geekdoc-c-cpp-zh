    \ cols * bytes.\n\nConstructing the array in a single malloc has the added benefit\
    \ of allowing disposal of the array with a single free call rather than using\
    \ a special function to free the subsidiary blocks.\n\n```\n#include <malloc.h>\n\
    int** My2DAlloc(int rows, int cols) {\n    int header = rows * sizeof(int*);\n\
    \    int data = rows * cols * sizeof(int);\n    int** rowptr buf = (int**)malloc(header\
    \ + data);\n    int* buf = (int*)(rowptr + rows);\n    int k;\n    for (k = 0;\
    \ k < rows; ++k) {\n        rowptr[k] = buf + k*cols;\n    }\n    return rowptr;\n\
    }\n```"
