  md: '# Interview War Stories | Failure to Communicate


    # What We Have Here is Failure to Communicate


    Trisha was a mid-level Java developer with a solid history of middleware and JSP
    work on her resume. Since she was local, we invited her for an interview without
    a phone screen. When we started asking her questions, it quickly became obvious
    that Trisha was a woman of few words. Her answers were short and often composed
    of "yes/no" responses, even to questions that were meant to start a dialogue.
    Once she did start opening up, I still wasn''t sure she was *actually talking*.
    I saw her lips moving, and heard mumbling sounds out, but wasn''t anything that
    sounded like English.


    I''m not sure if Trisha was nervous or just shy, either way, I had to ask her
    numerous times to repeat herself. Now I was the one getting nervous! I didn''t
    want to be the guy "ruined" the interview, so I pulled back on my questions. The
    other folks in the room and I exchanged uneasy glances. We felt like were a *Seinfeld*
    episode. It was almost impossible to understand Trisha, and when she spoke up,
    her halting, uncertain, confused speech patterns made us feel more like code breakers
    than interviewers. I am not exaggerating to say that I did not understand a single
