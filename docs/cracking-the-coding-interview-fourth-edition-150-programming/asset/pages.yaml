    people, and you''re going to be talking to customers, sales reps, and Betty from
    Marketing. You will write something eventually, whether it''s documentation, or
    a project plan, or requirements writing. The word processor might correct your
    spelling, but it won''t correct your lousy writing. The ability to communicate
    thoughts and ideas, in a clear, concise manner, is an absolutely invaluable skill
    that employers seek.


