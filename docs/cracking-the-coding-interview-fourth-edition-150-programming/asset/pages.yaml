  md: "# Solutions to Chapter 12 | System Design and Memory Limits\n\nFollow Up: What\
    \ if we have only 10 MB memory?\n\nIt's possible to find a missing integer with\
    \ just two passes of the data. We can divide the integers into blocks of some\
    \ size (we'll discuss how to decide on a size later). Let's assume that we divide\
    \ up the integers into blocks of 1000. So, block 0 represents the numbers 0 through\
    \ 999, block 1 represents 1000 - 1999, etc. Since the range of ints is finite,\
    \ we know that the number of blocks needed is finite.\n\nIn the first pass, we\
    \ count how many ints are in each block. That is, if we see 552, we know that\
    \ is in block 0, we increment counter[0]. If we see 1425, we know that is in block\
    \ 1, we increment counter[1].\n\nAt the end of the first pass, we'll be able to\
    \ quickly spot which block is missing. If our block size is 1000, any block which\
    \ has fewer than 1000 numbers must be missing a number. Pick any one of those.\n\
    \nIn the second pass, we'll actually look for which number is missing. We can\
    \ do this by creating a simple bit vector of size 1000. We iterate through the\
    \ file, and for each number that should be in our block, we set the appropriate\
    \ bit in the bit vector. By the end, we'll know which number (or numbers) is missing.\n\
    \nNow we just have to decide what the block size is. At 2^20 values per block,\
    \ we will need an array with 2^12 block counters and a bit vector in 2^17 bytes.\
    \ Both of these can comfortably fit in 10*2^20 bytes.\n\nWhat's the smallest footprint?\
    \ When the array of block counters occupies the same memory as the bit vector,\
    \ let N = 2^32:\n\ncounters (bytes): blocks * 4\nbit vector (bytes): (N / blocks)\
    \ / 8\n\n```\nblocks * 4 = (N / blocks) / 8\nblocks^2 = N / 32\nblocks = sqrt(N/2)/4\n\
    ```\n\nIt's possible to find a missing integer with just under 65KB (or, more,\
    \ sqrt(2)*2^15 bytes).\n\n```\nint bitSize = 10488576; // 2^20 bits (2^17 bytes)\n\
    int blockNum = 4096; // 2^12\nbyte[] bitfield = new byte[bitSize/8];\nint[] blocks\
    \ = new int[blockNum];\n\nvoid findNumber() throws FileNotFoundException {\n \
    \   int starting = -1;\n    Scanner in = new Scanner(new FileReader(\"input_file_q11_4.txt\"\
    ));\n```\n\nCracking the Coding Interview | Concepts and Algorithms"
