  md: '# Solutions to Chapter 10 | Mathematical


    10.4 Write a method to implement *, -, / operations. You should use only the +
    operator.


    pg 68


    # SOLUTION


    With an understanding of what each operation (minus, times, divide) does, this
    problem can be approached logically.


    +   * Subtraction should be relatively straightforward, as we all know that a
    - b is the same thing as a + (-1)*b.


    +   * Multiplication: we have to go back to what we learned in grade school: 21
    * 3 = 21 + 21 + 21. It is slow, but it works.


    +   * Division is the trickiest, because we usually think of 21 / 3 as something
    like "if you divide 21 foot board into 3 pieces, how big is each piece?” If we
    think about the other way around, it''s a little easier: "21 foot board in x pieces
    and got 3 feet each, how many pieces were there?” From here, we can see if we
    continuously subtract 3 feet from 21 feet, we''ll know how many pieces there are.
    That is, we continuously subtract from a count and how many times we can do.


    ```

    / Flip a positive sign to negative, or a negative sign to pos /

    public static int FnNegate(int a) {

    int neg = 0;

    int d = a < 0 ? 1 : -1;

    while (a != 0) {

    neg += d;

    a += d;

    }

    return neg;

    }

    ```


    ```

    * Subtract two numbers by negating b and adding them //

    public static int FnMinus(int a, int b) {

    return a + FnNegate(b);

    }

    ```


    ```

    * Check if a and b are different signs //

    public static boolean DifferentSigns(int a, int b) {

    return ((a < 0) && (b > 0)) || (a > 0) && (b < 0)) ? true : false;

    }

    ```


    ```

    * Return absolute value /*/

    public static int abs(int a) {

    if (a < 0) return FnNegate(a);

    else return a;

    }

    ```'
