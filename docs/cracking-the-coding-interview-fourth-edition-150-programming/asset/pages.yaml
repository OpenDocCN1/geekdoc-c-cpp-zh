  md: '# Before the Interview | Behavioral Preparation


    # Why Are Behavioral Questions Asked?


    Behavioral questions are asked for a variety of reasons. They can be asked either
    to know your personality, to understand your resume more deeply, or just to ease
    you into an interview. Either way, these questions are important and can be prepared
    for.


    # How To Prepare


    Behavioral questions are usually of the form “tell me about a time when you ...,”
    and may require an example from a specific project or position. I recommend filling
    in the following “preparation grid” as shown below:


    | Project 1 | Project 2 | Project 3 | Project 4 |

    |---|---|---|--|

    | What You Learned | | | | |

    | Most Interesting | | | | |

    | Hardest Bug | | | | |

    | Enjoyed Most | | | | |

    | Conflicts with Teammates | | | | |


    Along the top, as columns, you should list all the major aspects of your resume
    – e.g., your projects, jobs, or activities. Along the side, as rows, you should
    list the common questions – e.g., what you enjoyed most, what you enjoyed least,
    what you considered most challenging, what you learned, what the hardest bug,
    etc. In each cell, put the corresponding story.


    We recommend reducing each story to a couple of keywords that you can write in
    each cell. This will make the grid easier to study and remember.


    In your interview, when you''re asked about a project, you''ll be able to come
    up with an appropriate story effortlessly. Study this grid before your interview.


    NOTE: If you''re doing a phone interview, you may want to have this grid out in
    front of you.

    Some additional:


    +   1. When asked about your weaknesses, give a real weakness! Answers like “My
    greatest weakness is that I work too hard” tell your interviewer that you''re
    arrogant andor won''t admit to your faults. No one wants to work with someone
    like that. A better answer conveys a real, legitimate weakness but emphasizes
    how you work to overcome it. For example: “Sometimes, I don’t have a very good
    attention to detail. While that’s good because it lets me execute quickly, it
    also means that I sometimes make careless mistakes. Because of that, I make sure
    to always have someone double check my work.”'
