  md: '# Solutions to Chapter 17 | Networking


    +   - Startup. When a router is turned on it sends Hello packets to all of its
    neighbors, receives their Hello packets in return, and establishes routing connections
    by synchronizing databases with adjacent routers that agree to synchronize.


    +   - Update. At regular intervals each router sends an update message called
    "link state" describing its routing database to all the other routers, so that
    all routers have the same description of the topology of the local network.


    +   - Shortest path tree. Each router then calculates a mathematical data structure
    called a "shortest path tree" that describes the shortest path to each destination
    address and therefore indicates the closest router to send to for each communication;
    in other words -- "open shortest path first".


    See http://www.livinginternet.com/i/iw_route_igp_ospf.htm.'
