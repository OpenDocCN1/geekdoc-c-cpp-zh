  md: '# Interview War Stories | Pop Divas


    # Pop Divas Need Not Apply


    Leonard was a very promising C++ coder, three years out of college, with a solid
    work history and an impressive skill set. He proved on the phone screen that he
    was above-average technically, and he was invited for an interview. We needed
    a savvy C++ person to work on a piece of middleware that interfaced with our database,
    and Leonard seemed like a sure fit.


    However, once we started talking to him, things went south in a hurry. He spent
    most of the interview criticizing every tool and platform that we questioned him.
    We used SQL Server as our database? Puhehe. Our team used Tool A to do all our
    coding in. Unacceptable. We used Tool B, and only Tool B, and after we hired,
    we''d have all to switch to Java, because he really wanted to work with Java,
    despite the fact that 75 percent of the codebase would have to be rewritten. He
    dealth them later. And oh, by the way, he wouldn''t be making any meetings before
    ten o''clock.


    Needless to say, we encouraged Leonard to seek opportunities elsewhere. It wasn''t
    that his ideas were bad - in fact, he was "technically" right about many things,
    and (strong) opinions were all backed with solid fact and sound reason (except
    for the ten o''clock thing - we think he may have just been making a "power play.")
    But it was obvious that, if hired, Leonard wasn''t going to play well with others
    - he would be toxic kryptonite for team chemistry. Leonard also made the mistake
    of assuming that Code Purity and Algorithm Beauty were always more important than
    a business deadline. He actually managed to offend two of the team members during
    the forty-five minutes of his interview.


    In the real world, there are always compromises to be made, and knowing how to
    work with the business analysts is just as important as knowing how to refactor
    a blob of code. If Leonard would not have gotten along with other IT people, he
    definitely wouldn''t have gotten along with the business folks. Maybe you can
    get away with hiring a Leonard if he was one of the ten coders in the world (he
    wasn''t). But he was the classic failure example for the "Would you have a beer
    with this guy?" test.'
