- pgno: 107
  md: "# Solutions to Chapter 1 | Arrays and Strings\n\n1.6 Given an image represented\
    \ by an NxN matrix, where each pixel in the image is 4 bytes, write a method to\
    \ rotate the image by 90 degrees. Can you do this in place?\n\n# SOLUTION\n\n\
    The rotation can be performed in layers, where you perform a cyclic swap on the\
    \ edges on each layer. We rotate the first layer (outermost edges). We rotate\
    \ the edges by doing a four-way swap first on the corners, then on the element\
    \ clockwise from the edges, then on the element three steps away.\n\nOnce the\
    \ exterior elements are rotated, we then rotate the interior region's edges.\n\
    \n```\npublic static void rotate(int[][] matrix, int n) {\n    for (int layer\
    \ = 0; layer < n / 2; ++layer) {\n        int first = layer;\n        int last\
    \ = n - 1 - layer;\n        for (int i = first; i < last; ++i) {\n           \
    \ int offset = i - first;\n            int top = matrix[first][i]; // save top\n\
    \            // left -> top\n            matrix[first][i] = matrix[last-offset][first];\n\
    \            // right -> bottom\n            matrix[last-offset][first] = matrix[last][last\
    \ - offset];\n            // top -> right\n            matrix[last][last - offset]\
    \ = matrix[i][last]; // right <- saved top\n        }\n    }\\    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: "# Solutions to Chapter 1 | Arrays and Strings\n\n1.7 Write an algorithm such\
    \ that if an element in an MxN matrix is 0, its entire row and column is set to\
    \ 0.\n\n# SOLUTION\n\nAt first glance, this problem seems easy: just iterate through\
    \ the matrix and every time we see a 0, set that row and column to 0. There’s\
    \ one problem with that solution though: we will “recognize” those 0s later on\
    \ in our iteration and set their row and column to zero. Pretty soon, our entire\
    \ matrix will be set to 0!\n\nOne way around this is to keep a second matrix which\
    \ flags the 0 locations. We would then do a second pass through the matrix to\
    \ set the zeros. This would take O(MN) space.\n\nDo we really need O(MN) space?\
    \ No. Since we're going to set the entire row and column to zero, we really need\
    \ to track which cell in a row is zero? No. We only need to know that row 2, for\
    \ example, has a zero.\n\nThe code below implement this algorithm. We keep track\
    \ in two arrays all the rows with zeros and all the columns with zeros. We need\
    \ to make a second pass of the matrix and set a cell to zero if its row or column\
    \ is zero.\n\n```\npublic static void setZeros(int[][] matrix) {\n  int[] row\
    \ = new int[matrix.length];\n  int[] column = new int[matrix[0].length];\n  //\
    \ Store the row and column index with value 0\n  for (int i = 0; i < matrix.length;\
    \ i++) {\n    for (int j = 0; j < matrix[0].length; j++) {\n      if (matrix[i][j]\
    \ == 0) {\n        row[i] = 1;\n        column[j] = 1;\n      }\n    }\n  }\n\
    \  // Set arr[i][j] to 0 if either row i or column j has a 0\n  for (int i = 0;\
    \ i < matrix.length; i++) {\n    for (int j = 0; j < matrix[0].length; j++) {\n\
    \      if ((row[i] == 1 || column[j] == 1)) {\n        matrix[i][j] = 0;\n   \
    \   }\n    }\n  }\n}\n```"
  merge: -1
  img_proc: true
