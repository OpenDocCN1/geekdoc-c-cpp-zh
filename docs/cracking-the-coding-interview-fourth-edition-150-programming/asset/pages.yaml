  md: '# Solutions to Chapter 12 | System Design and Memory Limits


    12.5 If you were designing a web crawler, how would you avoid getting into infinite
    loops? pg 72


    # SOLUTION


    First, how does the crawler get into a loop? The answer is very simple: when we
    re-parse an already parsed page. This would mean that we revisit all the links
    in that page, and this would continue in a circular fashion.


    Be careful about what the interviewer considers the "same page". Is it URL or
    content? One could easily get redirected to a previously crawled page.


    So how do we stop visiting an already visited page? The web is a graph-based structure,
    and we commonly use DFS (depth first search) and BFS (breadth first search) for
    traversing graphs. We can mark already visited pages the same way that we would
    in a BFS/DFS.


    We can easily prove that this algorithm will terminate in any case. We know that
    each step of the algorithm will parse only new pages, not already visited pages.
    So, if we assume we have N number of unvisited pages, then at every step we are
    reducing N (N-1) by 1. It proves that our algorithm will continue until they are
    only N steps.


    # SUGGESTIONS AND OBSERVATIONS


    +   - This question has a lot of ambiguity. Ask clarifying questions!


    +   - Be prepared to answer questions about coverage.


    +   - What kind of pages will you hit with a DFS versus a BFS?


    +   - What will you do when your crawler runs into a honey pot that generates
    an infinite subgraph for you to wander about?'
