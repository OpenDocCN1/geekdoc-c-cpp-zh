  md: "# Solutions to Chapter 9 | Sorting and Searching\n\n9.3 Given a sorted array\
    \ of n integers that has been rotated an unknown number of times, give an O(log\
    \ n) algorithm that finds an element in the array. You may assume that the array\
    \ was originally sorted in increasing order.\n\nEXAMPLE:\n\nInput: find 5 in array\
    \ (15 16 19 20 25 1 3 4 5 7 10 14)\n\nOutput: 8 (the index of 5 in the array)\n\
    \npg 66\n\n# SOLUTION\n\nWe can do this with a modification of binary search.\n\
    \n```\npublic static int search(int a[], int l, int u, int x) {\n    while (l\
    \ <= u) {\n        int m = (l + u) / 2;\n        if (x == a[m]) {\n          \
    \  return m;\n        } else if (a[l] <= a[m]) {\n            if (x > a[m]) {\n\
    \                l = m+1;\n            } else if (x >= a[l]) {\n             \
    \   u = m-1;\n            } else {\n                l = m+1;\n            }\n\
    \        } else if (x < a[m]) u = m-1;\n        else if (x <= a[u]) l = m+1;\n\
    \        else u = m - 1;\n    }\n    return -1;\n}\npublic static int search(int\
    \ a[], int x) {\n    return search(a, 0, a.length - 1, x);\n}\n```\n\nWhat duplicates?\
    \ You may observe that the above function doesn't give you an efficient result\
    \ for duplicate elements. However, if your array has duplicate entries then we\
    \ can't do better than O(n) which is as good as linear search.\n\nFor example,\
    \ if the array is [2,2,2,2,2,2,2,3,2,2,2,2,2,2], there is no way to find element\
