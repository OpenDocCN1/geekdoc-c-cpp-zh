    \ (move right -> right -> down -> down -> right)\n...\nY Y X Y (move right ->\
    \ down -> right -> down -> right)\n```\n\nEach path can be fully represented by\
    \ the moves at we move right. That is, if I were to ask you which path you took,\
    \ you could simply say \"I moved right on step 3 and 4.\"\n\nSince you must always\
    \ move right X-times, and Y-1 total steps, you have to pick X-1 times to move\
    \ out of X-1+Y-1 choices. There are C(X-1, X-1+Y-1) paths (e.g., X-1+Y-1) choose\
    \ X-1:\n\n```\n(X-1 + Y-1)! / ((X-1)! * (Y-1)!)\n```\n\nPart 2: Code\nWe can implement\
    \ a simple recursive algorithm with backtracking:\n\n```\nArrayList<Point> current_path\
    \ = new ArrayList<Point>();\npublic static boolean getPaths(int x, int y) {\n\
    \    Point p = new Point(x, y);\n    current_path.add(p);\n    if (x == 0 && y\
    \ == 0) return true; // current_path\n    boolean success = false;\n    if (x\
    \ >= 1 && is_free(x - 1, y)) { // Try right\n        success = getPaths(x - 1,\
