  md: '# Solutions to Chapter 14 | Java


    14.4 Explain the difference between templates in C++ and generics in Java. pg
    78


    # SOLUTION


    | C++ Templates | Java Generics |

    | Classes and functions can be templated. | Classes and methods can be generic.
    |

    | Parameters can be any type or integral value. | Parameters can only be reference
    types (not primitive types). |

    | Separate copies of the class or function are likely to be generated for each
    type parameter when compiled. | One version of the class or function is compiled,
    works for all type parameters. |

    | Objects of a class with different type parameters are different types at run
    time. | Type parameters are erased when compiled; objects of a class with different
    parameters are the same type at run time. |

    | Implementation source code of the template class or function must be included
    in order to use it (declaration insufficient). | Signature of the class or function
    from a compiled class file is sufficient to use it. |

    | Templates can be specialized - a separate implementation could be provided for
    a particular template parameter. | Generics cannot be specialized. |

    | Does not support wildcards. Instead, return types are often available as nested
    typedefs. | Supports wildcard as type parameter if it is only used once. |

    | Does not directly support bounding of type parameters, but metaprogramming provides
    this. | Supports bounding of type parameters with "extends" and "super" for upper
    and lower bounds, respectively; allows enforcement of relationships between type
    parameters. |

    | Allows instantiation of class of type parameter. | Does not allow instantiation
    of class of type parameter. |

    | Type parameter of templated class can be used for static methods and variables.
    | Type parameter of templated class cannot be used for static methods and variables.
    |

    | Static variables are not shared between classes of different type parameters.
    | Static variables are shared between instances of classes of different type parameters.
    |


    From http://en.wikipedia.org/wiki/Comparison_of_Java_and_C%28%29BTemplates_vs.
    Generics'
