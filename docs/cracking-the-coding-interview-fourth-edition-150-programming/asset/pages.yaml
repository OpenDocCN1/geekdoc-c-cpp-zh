    \ board[index][var];\n  else if (check == Check.Column) return board[var][index];\n\
    \  else if (check == Check.Diagonal) return board[var][var];\n  else if (check\
    \ == Check.ReverseDiagonal) return board[board.length - 1][var];\n  return Piece.Empty;\n\
    }\n```\n\n```\nPiece getWinner(Piece[][] board, int fixed_index, int i, Check\
