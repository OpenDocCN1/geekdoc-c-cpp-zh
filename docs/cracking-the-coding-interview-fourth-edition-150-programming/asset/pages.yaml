  md: '# At the Interview | Handling Behavioral Questions


    # Why Behavioral Questions


    As stated earlier, interviews usually start and end with "chit chat" or "soft
    skills." This is a time to answer questions about your resume or general questions,
    and also an opportunity for you to ask questions. This part of the interview is
    targeted at getting to know you, as well as relaxing.


    # Be Specific, Not Arrogant


    Arrogance is a red flag, but you still want to make yourself sound impressive.
    So how do you make yourself sound good without being arrogant? By being specific!


    Specificity means giving just the facts and letting the interviewer derive an
    interpretation. Consider an example:


    +   - Candidate #1: "I basically did all the hard work for the team."

    - Candidate #2: "I implemented the file system, which was considered one of the
    most challenging components because..."


    Candidate #2 not only sounds more impressive, but she also appears less arrogant.


    # Limit Details


    When a candidate babbers about a problem, it''s hard for an interviewer who isn''t
    versed in the subject or project to understand it. CareerCup recommends that you
    stay light on details and just state the key points. That is, consider something
    like this: "By examining the most common user behavior and applying the Rabin-Karp
    algorithm, I designed a new algorithm to reduce search from O(n) to O(log n) in
    90% of cases. I can go into more details if you''d like." This demonstrates the
    key points while letting your interviewer ask for more details if he wants.


    # Ask Good Questions


    Remember those questions you came up with while preparing? Now is a great time
    to use them!


    # Structure Answers Using S.A.R.


    Structure your responses using S.A.R.: Situation, Action, Result. That is, you
    should start off outlining the situation, explaining the actions you took, and
    lastly, describing the result.

    Example: "Tell me about a challenging interaction with a teammate."


    +   - Situation: On my operating systems project, I was assigned to work with
    three other people. While two were great, the third team member didn''t contribute
    much. He'
