  md: '# Interview War Stories | You Can (Maybe) Count On Me


    # You Can Count on Me, Just Not Until Early Afternoon


    Ahhh, 1999. The crest of the dot-com bubble, and the tightest labor market in
    history. Our company was racing to expand its development team, and we would have
    hired a German Shepherd if it knew HTML. Instead, we wound up hiring Ian. We should
    have hired the dog.


    Ian was a cheerful, friendly guy who had a gift of natural charisma. He got along
    fantastically with all of the interviewers, and seemed very intelligent. Skill-wise,
    he was adequate. He hadn''t written a single line of code outside of his college
    courses, and didn''t even have his own email address. When we had the chance to
    ask questions at the end of the interview, he asked about flexible work hours,
    and how soon he could take vacation time. Instead of showing an interest in the
    career opportunities, or in company''s growth prospects, he asked whether he could
    take the all-you-could-drink break soda home with him. The questions grew more
    bizarre from time.


    Ian very interested in our Legal Assistance Benefit. He wanted to know if it covered
    the cost of filing lawsuits, if it covered him if he sued himself, if it applied
    to any lawsuits he was currently involved in, and if he could "theoretically"
    use it to serve the company himself. He also asked us if he could use it to help
    him "fix" unpaid speeding tickets.


    In any other year, that should have been for Ian right there. But, in 1999, we
    were hiring anybody who was even remotely competent. Ian collected paychecks for
    eighteen months, and he was as positive as a traffic cone. He sauntered into the
    office around twenty-thirty with some sort of lame excuse (by my count, he had
    to wait for the cable guy six times in a six-month period). He usually killed
    the morning by answering e-mail and playing ping-pong, before breaking for a two-hour
    lunch. After lunch, it was more ping-pong, and ping-pong, and maybe another hour
    of writing bad code, before bolting the office sometime around three. He was the
    dictionary definition of unreliable.


    Remember, your future team members need to know that they can rely on you. They
    need to know that you won''t need constant supervision and hand-holding. They
    need to know that you''re able to figure things out on your own. One of the most
    important messages that you, as a candidate, can convey in your interview is hiring
    me will make your lives easier. In fact, this is a large part of the reason for
