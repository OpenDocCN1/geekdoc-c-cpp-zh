  md: "# Solutions to Chapter 19 | Moderate\n\n19.11 Design an algorithm to find all\
    \ pairs of integers within an array which sum to a specified value.\n\n# SOLUTION\n\
    \nOne easy and (time) efficient solution involves a hash map from integers to\
    \ integers. This algorithm works by iterating through the array. On each element\
    \ x, look up sum-x in the hash table, and if it exists, print (x, sum-x). Add\
    \ x to the hash table, and go to the next element.\n\n# Alternate Solution\n\n\
    Definition of Complement: If we are trying to find a pair of numbers that sums\
    \ to, the complement of x will be z - x (that is, the number that can be added\
    \ to x to make z). For example, if we are trying to find a pair of numbers that\
    \ sums to 12, the complement of 5 would be 17.\n\nThe Algorithm: Imagine we have\
    \ the following sorted array: {-2,-1, 0, 3, 5, 6, 7, 9, 13, 14}. Let first point\
    \ to the head of the array and last point to the end. To find the complement of\
    \ first, we move first forward. When the sum of first + last < sum, then there\
    \ is no complement for first. We can then move backwards until we find it. Stop\
    \ when first is greater than last.\n\nWhy must find all complements for first?\
    \ Because the array is sorted and we are moving progressively smaller numbers.\
    \ When the sum of first and last is less than the sum, we know that even smaller\
    \ numbers (as last) won't help us find a complement.\n\nWhy must find all complements\
    \ for last? Because all pairs must be made up of a first and a last. We've found\
    \ all complements for first, therefore we've found all complements of last.\n\n\
    ```\npublic static void printPairSums(int[] array, int sum) {\n    Arrays.sort(array);\n\
    \    int first = 0;\n    int last = array.length - 1;\n    while (first < last)\
    \ {\n        int s = array[first] + array[last];\n        if (s == sum) {\n  \
    \          System.out.println(array[first] + \" \" \" + array[last]);\n      \
    \      first++;\n            last--;\n        } else {\n            if (s < sum)\
    \ first++;\n            else last--;\n        }\n    }\n}\n```"
