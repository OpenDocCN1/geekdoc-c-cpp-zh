  md: "# Approach 2:\n\nIn this approach, any stack can grow as long as there is any\
    \ free space in the array.\n\nWe sequentially allocate space to the stacks and\
    \ we link new blocks to the previous block. This means any new element in a stack\
    \ keeps a pointer to the previous top element of that particular stack.\n\nIn\
    \ this implementation, we face a problem of unused space. For example, if a stack\
    \ deletes some of its elements, the deleted elements may not necessarily appear\
    \ at the end of the array. In that case, we would not be able to use these newly\
    \ freed spaces.\n\nTo overcome this deficiency, we can maintain a free list and\
    \ the whole array space would be given initially to the free list. For every insertion,\
    \ we would delete an entry from the free list. In case of deletion, we would simply\
    \ add the index of the free cell to the free list.\n\nIn this implementation we\
    \ would be able to have flexibility in terms of variable space utilization but\
    \ we would need to increase the space complexity.\n\n```\nint stackSize = 300;\n\
    int indexused = 0;\nint[] stackPointer = {-1, -1, -1};\nStackNode[] buffer = new\
    \ StackNode[stackSize * 3];\nvoid push(int stackNum, int value) {\n    int lastIndex\
    \ = stackPointer[stackNum];\n    stackPointer[stackNum] = indexUsed;\n    indexUsed++;\n\
    \    buffer[stackPointer[stackNum]]=new StackNode(lastIndex,value);\n}\npint pop(int\
    \ stackNum) {\n    int value = buffer[stackPointer[stackNum]].value;\n    int\
    \ lastIndex = stackPointer[stackNum];\n    stackPointer[stackNum] = buffer[stackPointer[stackNum]].previous;\n\
    \    buffer[lastIndex] = null;\n    indexUsed--;\n    return value;\n}\npint peek(int\
