    \ by the matrix-vector product $Ap$, which is of order $O(n)$ if the matrix is\
    \ sparse. Given the maximum number of $n$ iterations, the total complexity is\
    \ $O(n^2)$ in the worst case, but it is usually better in practice.\n\nAs the\
    \ convergence rate depends on the spectral properties of the matrix $A$, a proper\
    \ pre-conditioning scheme should be used to increase the efficiency and robustness\
    \ of the CG method (Golub and Loan 1994). While very sophisticated preconditioners\
    \ exist (SSOR, complete Cholesky, etc.), our experiments with Laplacian systems\
    \ have shown that a simple diagonal Jacobi preconditioner is often satisfactory.\n\
    \nAlthough the conjugate gradient methods decreases the computational complexity\
    \ from $O(n^3)$ to $O(n^2)$, it is still slow to compute exact (or sufficiently\
    \ accurate) solutions of large and possibly ill-conditioned systems. This motivates\
    \ the use of multigrid iterative solvers.\n\n# A.3.3 Multigrid Iterative Solvers\n\
    \nOne drawback of most iterative solvers is that they attenuate the high frequencies\
    \ of the error $e^{(k)}$ very fast, but their convergence stalls in the case where\
