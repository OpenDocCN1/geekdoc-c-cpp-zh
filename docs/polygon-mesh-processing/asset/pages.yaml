    In this chapter we introduce techniques for interactively deforming a given triangle
    mesh. This topic is challenging, since complex mathematical formulations (1) have
    to be hidden behind an intuitive user interface and (2) have to be implemented
    in a sufficiently efficient and robust manner to allow for interactive applications.
    This chapter gives an overview of different shape deformation techniques, classifies
    them into different categories, and shows their interrelations.


    The deformation of a given surface S into the desired surface S'' is mathematically
    described by a displacement function d that associates to each point p ∈ S a displacement
    vector d(p). By this it maps the given surface S to its deformed version S'':


    ```

    S'' := {p + d(p) | p ∈ S}.

    ```


    For a discrete triangle mesh the displacement function d is piecewise linear,
    such that it is fully defined by the displacement vectors di = d(pi) of the original
    mesh vertices pi ∈ S.


    The user controls the deformation by prescribing displacements di, for a set of
    so-called handle points pi ∈ H ⊂ S, and by constraining parts F ⊂ S to stay fixed
    during the deformation (see Figure 9.1):


    ```

    d(pi) = di, ∀ pi ∈ H,

    d(pi) = 0, ∀ pi ∈ F.

    ```'
