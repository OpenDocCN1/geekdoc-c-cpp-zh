  md: '# REMESHING


    Remeshing is a key technique for mesh quality improvement in many industrial applications
    such as numerical simulation and geometric modeling (e.g., shape editing, animation,
    morphing). As such, it has received considerable attention in recent years, and
    a wealth of remeshing algorithms have been developed. In this chapter we focus
    on surface remeshing and do not consider volumetric remeshing. The first goal
    of surface remeshing is to reduce the complexity of an input surface mesh, subject
    to certain quality criteria. This process is commonly referred to as mesh simplification,
    a topic covered in Chapter 7. The second goal of remeshing is to improve the quality
    of the mesh, such that it can be used as input for various downstream applications.
    Different applications employ different quality criteria and requirements. For
    more complete coverage of the topic, we refer the reader to a survey [Alliez et
    al. 07], which proposes this definition for remeshing: “Given a 3D mesh, compute
    another mesh, whose elements satisfy some quality requirements, while approximating
    the input acceptably.” Here the term approximation can be understood with respect
    to locations as well as normals or higher-order differential properties.


    In contrast to general mesh repair (see Chapter 8), the input of remeshing algorithms
    is usually assumed to already be a manifold triangle or part of it. The term quality
    refers to non-topological properties, such as sampling density, regularity, size,
    orientation, alignment, and shape of the mesh elements. This chapter deals with
    these latter aspects of remeshing and presents various methods that achieve this
    goal. We begin'
