  md: "![](img/50d65c1816c68c45610a75b087632bd3_163_0.png)\n\nThe main question is\
    \ how to determine the displacements $\\mathbf{d}_i$ for all the remaining unconstrained\
    \ vertices $\\mathbf{p}_i \\in \\mathcal{R} = S \\setminus (\\mathcal{H} \\cup\
    \ \\mathcal{F})$, such that the resulting shape deformation meets the user's expectations.\n\
    \nWe discuss two classes of shape deformations in this:\n\n+   * Surface-based\
    \ deformations in Sections 9.1–9.4. Here, the displacement function $d: S \rightarrow\
    \ \\mathbb{R}^3$ lives on the original surface $S$ and is found by computations\
    \ on the triangle mesh. These methods offer a high degree of control, since each\
    \ vertex can be constrained individually. However the robustness and efficiency\
    \ of the involved computations are strongly affected by the mesh complexity and\
    \ the triangle quality of the original surface $S$.\n\n+   * Space deformations\
    \ employ a displacement function $d: \\mathbb{R}^3 \rightarrow \\mathbb{R}^3$\
    \ that warps the whole embedding space $\\mathbb{R}^3$ and by this implicitly\
    \ also deforms the surface $S$. The deformation does not require computations\
    \ on the triangle mesh $S$, and therefore such methods are less affected by the\
    \ complexity or triangle quality of $S$. Space deformations are discussed in Sections\
    \ 9.5 and 9.6.\n\nAll methods that we describe are linear deformation techniques,\
    \ i.e., they require the solution of a system of linear equations, typically in\
    \ order to minimize quadratic deformation energy. These methods have the advantage\
    \ that linear systems can be solved very efficiently (as described in the appendix).\
    \ However, these methods can lead to counterintuitive results for large-scale\
    \ deformations, as demonstrated in Section 9.7. Nonlinear deformation techniques\
    \ overcome these limitations by minimizing more accurate nonlinear energies, which,\
    \ however, requires more involved numerical schemes. We will only mention some\
    \ nonlinear methods in Section 9.8."
