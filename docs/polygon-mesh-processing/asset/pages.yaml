    $\forall i \in \{1, \dots, n_{\text{int}}\}: \begin{cases} \sum_{j=1}^{n_{\text{int}}}
    a_{i,j}u_j = \tilde{u}_i - \sum_{j=n_{\text{int}}+1}^{n} a_{i,j}u_j, \ \sum_{j=1}^{n_{\text{int}}}
    a_{i,j}v_j = \tilde{v}_i - \sum_{j=n_{\text{int}}+1}^{n} a_{i,j}v_j. \end{cases}
