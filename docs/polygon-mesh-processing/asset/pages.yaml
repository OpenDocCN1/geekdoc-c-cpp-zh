  md: "# A.3 Iterative Solvers\n\nIterative solvers are designed to exploit the sparsity\
    \ of the matrix A and allow for simple implementations [Golub and Loan 89, Press\
    \ et al. 92]. A detailed overview of iterative methods with valuable implementation\
    \ hints can be found in [Barrett et al. 94].\n\nIterative methods have in common\
    \ that compute a converging sequence x^{(0)}, x^{(1)}, ..., x^{(k)} of approximations\
    \ to the solution x* of the linear system, i.e., lim_{k→∞} x^{(k)} = x*. In practice\
    \ one can find a suitable criterion to stop the iteration soon as the current\
    \ approximation x^{(k)} is accurate enough, i.e., if the norm of the error\n\n\
    ```\ne^{(k)} := x* - x^{(k)}\n```\n\nis less than some ε. Since the solution x*\
    \ is not known beforehand, the error must be estimated by considering the residual\n\
    \n```\nr^{(k)} := b - Ax^{(k)}\n```\n\nError and residual are related by the residual\
    \ equations\n\n```\nAe^{(k)} = r^{(k)}\n```\n\n```\n||e^{(k)}|| ≤ ||A⁻¹|| ||r^{(k)}||\n\
    ```\n\nThis leads to an upper bound of the error\n\nwhich, however, requires the\
    \ norm of the inverse matrix to be estimated or approximated in some way [Barrett\
    \ et al. 94]. In practice, the vector x^{(k)} is often updated until the residual\
    \ ||Ax^{(k)} - b|| < ε for some user-defined tolerance ε. It is also common practice\
    \ to specify a maximum number of iterations that the algorithm stops even if it\
    \ does not converge due to numerical inaccuracies. We now review the most used\
    \ iterative methods for sparse spd systems.\n\n# A.3.1 Jacobi and Gauss-Seidel\n\
    \nThe Jacobi and Gauss-Seidel methods are the simplest approaches, both from the\
    \ conceptual and the implementation point of view. However, they are rather inefficient\
    \ and should not be used for larger matrices than a few vertices.\n\nThe two approaches\
    \ are derived by writing the linear system Ax = b line by:\n\n```\na_{1,1}x_1\
    \  +  a_{1,2}x_2  +  ... +  a_{1,n}x_n  = b_1,\na_{2,1}x_1  +  a_{2,2}x_2  + \
    \ ... +  a_{2,n}x_n  = b_2,\n:\n                                 ...         \
    \                        ...\n                                 ...           \
    \                      ...\na_{n,1}x_1  +  a_{n,2}x_2  +  ... +  a_{n,n}x_n  =\
    \ b_n.\n```"
