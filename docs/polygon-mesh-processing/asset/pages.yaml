  md: '# 6.2. Global Structure


    surface. When carefully aligned and oriented (see “element alignment and orientation”
    below), anisotropic meshes are preferred for shape approximation because they
    usually need fewer elements than their isotropic pendants to achieve the same
    approximation quality. Anisotropic elements are commonly oriented with the principal
    curvature directions of the surface (see Chapter 3). Furthermore, elements better
    express the structure of geometric primitives (cylinders, cones, etc.) inherent
    in many technical models.


    +   - Element density. In a uniform distribution, the elements are evenly spread
    across the entire model. In a nonuniform or adaptive distribution, the number
    of elements varies, e.g., smaller elements are assigned to areas with high curvature.
    When carefully designed, adaptive meshes need significantly fewer elements to
    achieve an approximation quality that is comparable to that of uniform meshes.


    +   - Element alignment and orientation. Converting a mesh approximating a piecewise
    smooth surface into a new mesh corresponds to a sampling process. Hence, sharp
    features may be affected by alias artifacts. In order to prevent this, elements
    should align to sharp features so that they properly represent discontinuities.
    Furthermore, the orientation of anisotropic elements plays a crucial role in faithful
    shape approximation [Nadler 86].


    # 6.2 Global Structure


    A vertex in a triangle mesh is called regular if (i.e., its number of neighboring
    vertices) is 6 for interior vertices or 4 for boundary vertices. In quadrangle
    meshes, the regular valences are 4 and 3, respectively. Vertices that are not
    regular are called irregular or extraordinary. The global structure of a mesh
    can be classified as being irregular, semiregular, highly regular, or regular
    (see Figure 6.2):


    +   - Irregular meshes do not exhibit any kind of regularities in their connectivity.


    +   - Semiregular meshes are produced by regular subdivision of a coarse initial
    mesh. Thus, the number of extraordinary vertices in a semiregular mesh is small
    and constant [Eck et al. 95, Guskov et al. 00, Lee et al. 98, Kobbelt et al. 99a]
    under uniform refinement.


    +   - In highly regular meshes most vertices are regular. In contrast to semiregular
    meshes, highly regular meshes need not be the result of a'
