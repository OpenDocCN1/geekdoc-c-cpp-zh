    # 1.5.1 Parametric to Implicit


    The conversion of a parametric surface representation to an implicit one

    amounts to the computation or approximation of its signed distance field.

    This can be done efficiently by voxelization or 3D scan-conversion techn-

    n[Kaufman 87], but the resulting approximation is piecewise constant

    only. As a surface''s distance field is, in general, not smooth everywhere, a

    piecewise linear or piecewise trilinear approximation seems to be best

    compromise between approximation accuracy and computational efficiency.


    Since we focus on polygonal meshes as parametric representation in

    this book, the conversion to an implicit representation basically requires

    the computation of signed distances to the triangle mesh at the nodes of

    (uniform or adaptive) 3D grid.


    Computing the exact distance of a grid node to a given mesh requires

    to calculate the distance to the closest triangle, which can be found efficiently

    by spatial data structures, e.g., kd-trees [Samet 94]. Notice that, in

    to compute a signed distance field, one additionally has to determine

    whether a grid node lies inside or outside the object. If g denotes the grid

    node and c its closest point on the surface, then the sign can be derived from

    the angle between the vector g − c and the outer normal n(c): The point g

    is defined to be inside if (g − c) < 0. The robustness and reliability of

    this test depends on whether the normal n(c) is computed. Using

    angle-weighted pseudo-normals for faces, edges, and vertices can be shown

    to yield correct results [Bærent own and Aames 05].


    Computing the distances on the entire grid can be accelerated by fast

    marching methods [Sethian 96]. In a first step, the exact signed distance

    values are computed for all grid nodes in the immediate vicinity of the tri-

    mesh. After this initialization, the fast marching method propagates

    dist to the remaining grid nodes with unknown distance value in a

    breadth-first manner.


