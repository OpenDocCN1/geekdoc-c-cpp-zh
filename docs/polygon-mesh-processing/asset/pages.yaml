    #  6.7 Summary and Further Reading


    We have provided a brief overview of surface remes techniques with a focus on
    isotropic triangle meshes and quad-dominant meshes. Isotropic rem own is now a
    well-studied problem, and robust software components are available for large meshes.
    Although the variational or incremental approaches generate the best results,
    the greedy technique based on Delaunay refinement and filtering guarantees over
    the shape of the elements as well as other useful properties, such as the absence
    of self-intersection. The latter property is of crucial importance for generating
    volumetric meshes for simulation.


    Regarding isotropic triangle-based remeshing, the Lloyd-based isotropic approach
    has been extended in several directions: one uses the geodesic distance on triangle
    meshes to generate a centroidal geodesic-based Voronoi diagram [Peyré and Cohen
    04]; one is a discrete analog of the Lloyd relaxation applied onto the input mesh
    triangles [Valette and Chassery 04]; and another applies a quasi-Newton version
    of the Lloyd relaxation over a Voronoi diagram restricted to the input surface
    mesh [Yan et al. 09]. Regarding quad-dominant remeshing, a recent work [Bommes
    et al. 09] uses a mixed-integer solver in order to compute a set of parameterizations
    that tile the input surface mesh without any T-junctions.'
