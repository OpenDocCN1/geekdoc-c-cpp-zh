    # 6.5 Triangle-Based Remeshing


    In an isotropic mesh all triangles are well shaped, i.e., ideally equilateral.
    One may further require a globally uniform vertex density or allow a smooth change
    in the triangle sizes, i.e., a smooth gradation. There are a number of algorithms
    for isotropic remeshing of meshes ([Alliez et al. 07]). In this section we describe
    three different paradigms commonly employed for isotropic remeshing; we detail
    three representative algorithms for these paradigms.


    Existing algorithms could be roughly classified as *greedy, variational, or incremental*.
    Greedy algorithms commonly perform one change at a time, such as vertex insertion,
    the initially started goal is satisfied. Variational techniques cast the initial
    problem as one of minimizing an energy functional that low levels of this energy
    correspond to good solutions for this problem (reaching a global optimum is in
    exclusive). A solver for this energy commonly performs global relaxation, i.e.,
    vertex relocations and re-triangulations until convergence. Finally, an algorithm
    is said to be incremental when it combines both refinement and decimation, possibly
    interleaved with a relaxation procedure (see [Bossen and Heckbert 96]).


