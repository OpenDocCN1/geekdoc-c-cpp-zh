    Euler''s formula (Equation (1.5)) the number of faces F is about twice the number
    of vertices V, this data structure consumes on average 72 bytes/vertex. As it
    does not represent the mesh, it is commonly referred to as triangle or polygon
    soup. Some data exchange formats, such as stereolithography (STL), use this representation
    as a common denominator.


    However, this representation is not sufficient for many applications: connectivity
    information cannot be accessed explicitly, and vertices and associated data are
    replicated as many times as the degree of the vertices. The latter redundancy
    can be avoided by a so-called indexed face set or shared-vertex data structure,
    which stores an array of vertices and polygons as sets of meshes, and this array
    encodes indices into this array (see Figure 2.1 (right)). For the case of triangle
    meshes, and using 32 bits to store vertex coordinates and face indices, this representation
    requires 12 bytes for each vertex and for each triangle, i.e., it consumes on
    average 12 bytes/vertex + 12 bytes/face 36 bytes/vertex, which is only half of
