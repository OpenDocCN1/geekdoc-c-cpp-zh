    system for the required movements $\delta c_l$ of control points:


    ```

    $$\left[ \begin{matrix} N_i(\mathbf{u}_1) & & N_n(\mathbf{u}_1) \ \vdots & & \vdots
    \ N_i(\mathbf{u}_m) & & N_n(\mathbf{u}_m) \end{matrix} \right] \left[ \begin{matrix}
    \delta c_1 \ \vdots \ \delta c_n \end{matrix} \right] = \left[ \begin{matrix}
    d_1 \ \vdots \ d_m \end{matrix} \right] . \quad (9.13)$

    ```


    This $(m \times n)$ system can be over- as well as under-determined, and is therefore
    solved using the pseudo-inverse [Hsu et al. 92,Golub and Loan 89]. This yields
    a *least-squares* and *least-norm* solution, which minimizes the error in the
    constraints $\sum_i ||d(\mathbf{u}_i) - \tilde{d}_i||^2$ as well as the amount
    of control point movement $\sum_l ||\delta c_l||^2$.


    While a well-defined solution, it has two drawbacks: First, in an over-determined
    setting the displacement constraints cannot be satisfied exactly, but only in
    the least square sense. Second, in the under-determined setting the remaining
    degrees of freedom are determined by minimizing control point movements, instead
    of optimizing for an as-smooth-as-possible deformation, as was the case for the
    fair surface-based deformation of Section 9.2.


    The placement of basis functions $N_l(\mathbf{u})$ on a regular grid is another
    potential problem. As shown in Figure 9.13 (right), a deformation that is not
    well-aligned with the grid axes can lead to aliasing artifacts. This problem can
    be addressed by using more flexible (pre-deformed) control lattices that better
    represent the desired deformation, but these can be difficult to set up for complex
    deformations [Coquillart 90, MacCracken and Joy 96].'
