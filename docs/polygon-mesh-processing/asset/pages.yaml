    Vertex removal. The first operator might think of deletes one vertex plus its
    adjacent triangles. For a vertex with valence k this leaves a k-sided hole. This
    hole can be fixed by any polygon triangulation algorithm [Schroeder et al. 92].
    Although there are several combinatorial freedom, the number of triangles will
    always be k - 2. Hence, the removal operation decreases the number of vertices
    by one, the number of edges by three, and the number of triangles by two Figure
    7.3 (top).


    Edge collapse. Another decimation operator takes two adjacent vertices, p and
    q and collapses the edge between them, i.e., both vertices are moved to the same
    new point r [Hoppe 96] (see Figure 7.3 (middle)). By this operation, two adjacent
    triangles degenerate and can be removed from the mesh. In total this operator
    removes one vertex, three edges, and two triangles. The degrees of freedom in
    this edge collapse operator emerge from the freedom to choose the new point location
    r.'
