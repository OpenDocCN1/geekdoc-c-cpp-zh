    around $s$ in the order that is given by Dijkstra''s algorithm on the dual graph
    of the input mesh $\mathcal{M}$. Note Dijkstra''s algorithm not only computes
    the length of the shortest path from each triangle $t$ to the seed $s$ but also
    produces a parent relation $p(t)$ such that the sequence $t, p(t), p^2(t), \dots,
    s$ traces a shortest path from $t$ back to the seed $s$.


    The boundary of $\mathcal{R}_\varepsilon(s)$ consists of one or more boundary
    loops. Whenever a boundary loop touches itself along an edge, it is split into
    two loops and the algorithm proceeds. However, when two different loops touch
    along a common edge $\varepsilon_{1,2}$, a handle is detected. Let $t_1$ and $t_2$
    be the two'
