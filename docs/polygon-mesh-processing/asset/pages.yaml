    # 9.3.3 Advanced Techniques


    While normal displacements are extremely efficient, their main problem is that
    neighboring displacement vectors are not coupled in any way. When bending the
    surface in a convex or concave manner, the angle between neighboring displacement
    vectors increases or decreases, leading to an undesired distortion of geometric
    details (see Figures 9.5 and 9.10). In the extreme case of neighboring displacement
    vectors crossing each other (which happens if curvature of $B''$ becomes larger
    than the displacement length $h_i$), the surface even-intersects locally. These
    problems are addressed by the advanced detail encoding techniques sketched in
    this section.


    Displacement volumes. Both problems—the unnatural change of the volume and the
    local self-intersections—are addressed by displacement volumes of displacement
    vectors [Botsch and Kobelt]. Each triangle $(p_i, p_j, p_k)$ of $S$, together
    with the corresponding points $(b_i, b_j, b_k)$ on $B$, defines a triangular prism.
    The volumes of these prisms are used as default coefficients $\mathcal{D}$ and
    kept constant during deformations. For a modified surface $B''$, the reconstruction
    operator has to find $S''$ such that the enclosed prisms have the same volumes
    as the original shape. Local volume preservation leads to more intuitive results
    and avoids local self-intersections (see Figures 9.5 and 9.10). However, the improved
    detail preservation comes at the price of higher computational cost compared to
    a linear detail reconstruction process.'
