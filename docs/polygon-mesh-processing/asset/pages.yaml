    # MODEL REPAIR


    Model repair is the process of removing artifacts from a geometric model in order
    to generate an output model suitable for further processing by downstream applications
    that require certain quality guarantees for their input. The specification of
    what kind of “models” are considered, what exactly constitutes an “artifact,”
    and what is meant by “suitable for further processing” depends on the particular
    application scenario: generally, it is not one single algorithm that is applicable
    in all situations.


    Model repair is necessary in a wide range of geometric processing applications.
    For example, consider the design cycle encountered in automotive CAD/CAM. Car
    models are typically manually designed in CAD systems that use trimmed NURBS surfaces
    as the underlying data structure for representing freeform geometry. However,
    numerical fluid simulations for shape analysis and optimization cannot handle
    such NURBS patches directly rather a watertight, manifold triangle mesh as input.
    Thus, there is a need for an intermediate stage that converts the NURBS model
    into a triangle mesh. Unfortunately, this conversion process is prone to producing
    meshing artifacts that cannot be handled by simulation packages. Thus, the converted
    model has to be repaired—usually in a tedious post-process, which often takes
    longer than the simulation itself.


    This chapter has two purposes: to give a practical overview of the kinds of artifacts
    that typically occur in geometric models (Section 8.1) and to introduce the most
    common algorithmic approaches to removing these'
