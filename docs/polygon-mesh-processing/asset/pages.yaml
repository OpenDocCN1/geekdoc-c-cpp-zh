    # 8.5.3 Volumetric Repair with BSP Trees


    A unique method for converting triangle to manifold surfaces is presented by Murali
    and Funkhouser [Murali and Funkhouser 97]. The polygon soup is first converted
    into a BSP tree, where the supporting planes of the input polygons serve as splitting
    planes for the space partition (Figure 8.8 (left)). The leaves of the tree correspond
    to complex convex regions $C_i$. For each $C_i$ a *solidity coefficient* $s_i
    \in [-1,1]$ is computed (Figure 8.8 (center)). Negative coefficients designate
    empty regions while positive coefficients designate solid regions.


    All unbounded regions lie outside the object and thus assigned a solidity value
    of -1. Let $C_i$ be a bounded cell, and let $N(i)$ the indices of all its neighbors.
    For each $j \in N(i)$, the intersection $P_{ij} = C_i \cap C_j$ is a planar polygon
    that might be partially covered by the input geometry. For each $j \in N(i)$,
    let $t_{ij}$ be the transparent area, $o_{ij}$ the opaque area, and $a_{ij}$ the
    total area of $P_{ij}$. The solidity $s_i$ is then related to the solidities $s_j$
    of its neighbors by


    ```

    $s_i = \frac{1}{A_i} \sum_{j \in N(i)} (t_{ij} - o_{ij})s_j, \quad (8.1)

    ```'
