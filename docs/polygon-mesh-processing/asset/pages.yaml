    operator for triangle meshes in computer graphics and is typically applied for
    various geometry processing tasks, such as surface smoothing (Chapter 4), parameterization
    (Chapter 5), and shape modeling (Chapter 9).


    However, there are also some disadvantages of the cotangent discretization. The
    cotangent weights $(\cot \alpha_{i,j} + \cot \beta_{i,j})$ become negative if
    $\alpha_{i,j} + \beta_{i,j} > \pi$. This can lead to flipped triangles in applications,
    e.g., when computing a parameterization (see Chapter 5). In addition, the discrete-Beltrami
    of Equation (3.11) is not purely intrinsic, i.e., its evaluation can lead to different
    results, even for isometric surfaces with different triangulations. We refer to
    the references of Section 3.4 for alternative discrete definitions of the Laplace-Beltrami
    that address some of these shortcomings.


    Since the Laplacian is defined as the divergence of the gradient, for completeness
    we describe the divergence operator [Tong et al. 03]. Consider a vector field
    $w: \mathcal{S} \to \mathbb{R}^3$ defined by a constant vector $w_T$ per triangle
    $T$ (e.g., the gradient of a piecewise linear function $f$). The discrete divergence
    computes a scalar value $div w(v_i)$ per vertex $v_i$ from the vector field at
    its incident triangles $T \in \mathcal{N}(v_i)$


    ```

    $$\div w(v_i) = \frac{1}{A_i} \sum_{T \in \mathcal{N}(v_i)} |\nabla B_i|_T \cdot
    w_T, \quad (3.12)$

    ```


    where $|\nabla B_i|_T$ is the (constant) gradient vector of the basis function
    of $v_i$ in triangle $T$ (see Equation (3.8)). Note that the discretizations of
    divergence (3.12), gradient (3.9), and Laplacian (3.11) are consistent in the
    sense that $\Delta f = \text{div} \nabla f$ also holds in the discrete case.


