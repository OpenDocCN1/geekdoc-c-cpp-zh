    # 6.6 Quad-dominant Remeshing


    Partitioning a surface into quadrangle tiles is a common requirement in computer
    graphics, computer-aided geometric design, and reverse engineering. Such tilings
    are amenable to a variety of subsequent applications due to their tensor-product
    nature, such as B-spline fitting, simulation, texture atlasing, and rendering
    with highly detailed modulation maps. Quad meshes are also useful in modeling
    as they aptly capture the symmetries of natural or man-made geometry.


    In an anisotropic mesh the elements should orient to the principal curvature directions,
    and shortened along the maximum curvature direction (see Chapter 3). Anisotropic
    triangle meshes of a given target complexity can easily be produced by incrementing
    the input model to a desired target complexity (see also Chapter 7). No matter
    whether one uses quad error metrics, (one-sided) Hausdorff distance, or the normal
    deviation to the priorities of removal operations, the result will always be an
    anisotropic triangle mesh that naturally orients to the principal curvature lines.
    The meshes that are produced by this method satisfy the definition of being anisotropic,
    but unfortunately do not convey the orthogonal structure of the curvature lines.
    To produce such a structure, it is usually better to compute a quadrangle mesh.


    Automatically converting a triangulated surface (issued, e.g., from a 3D scanner)
    into a quad mesh is a notoriously difficult task. Stringent topological conditions
    make quadrangulating a surface rather constrained and global problem compared
    to triangulating it. Further hurdles are added by application-dependent meshing
    requirements such as edge orthogonality, sizing, mesh regularity, and orientation
    and alignment of the elements with the geometry.


    Several paradigms have been proposed for generating quadrangle meshes:


    +   * Quadrangulation. A number of techniques have been proposed to quad-rangulate
    point sets. A subset of these techniques allows generating all-convex quadrangles
    by adding Steiner points [Bremner et al. 01] and well-shaped quadrangles using
    circle packing [Bern and Eppstein 00]. Quadrangle meshing this amounts to carefully
    placing a set of points, which are then automatically quadrangulated. In the'
  merge: -1
