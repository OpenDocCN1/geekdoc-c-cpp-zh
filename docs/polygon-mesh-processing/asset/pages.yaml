  md: '# 8.4. Surface-Oriented Algorithms


    Barequet and Kumar propose an algorithm to repair CAD models that identifies and
    merges pairs of boundary edges [Barequet and Kumar 97]. For each pair of boundary
    edges, the area between the two edges normalized by the edge lengths is computed.
    This score measures the geometric error that would be introduced by merging the
    two edges. Pairs of boundary edges are then iteratively merged in order of increasing
    score.


    Borodin et al. propose an algorithm that snaps boundary vertices to nearby boundary
    edges [Borodin et al. 02]. The algorithm is based on a standard mesh-decimation
    technique, but it generalizes the vertex-vertex contraction operator into a vertex-edge
    contraction operator that merges boundary vertices $v$ and boundary edges $e$.
    Let c be the closest point to v on $e$. If c is an interior point of $e$, c is
    inserted into $e$ by splitting the adjacent triangle into two. Finally, $v$ and
    $c$ are merged. The cost of a vertex collapse is defined as the distance of $v$
    to $c$. The algorithm maintains a priority queue of vertex/edge pairs and snaps
    them in order of increasing distance.


    The semantics of surface-oriented algorithms are well defined, and they are usually
    easy to implement. If the input data is well behaved and the user parameters are
    chosen in accordance with the error was accepted during triangulation, they manage
    to produce satisfying results. However, there are no guarantees on the quality
    of the output. Due to the simple heuristics, many artifacts remain unresolved.
    Therefore, these algorithms are usually run in an interactive loop that allows
    the user to override the decisions made by the algorithms or to interactively
    steer the algorithms towards the expected result.


