    # 3.3 Discrete Differential Operators


    The differential properties defined in the previous section require a surface
    to be sufficiently differentiable, e.g., the definition of curvature requires
    the existence of second derivatives. Since polygonal meshes are piecewise linear
    surfaces, the concepts introduced above cannot be applied directly. The following
    definitions of discrete differential operators are thus based on the assumption
    that meshes can be interpreted as piecewise approximations of smooth surfaces.
    The goal is to compute approximations of the differential properties of this underlying
    surface directly from the mesh data. Different approaches have been proposed in
    recent years. We will focus on the de-facto discretization of the Laplace-Beltrami
    operator and provide a brief derivation of the resulting formula, closely following
    [Meyer et al. 03]. Alternative derivations of the same result have been presented
    in [Pinkall and Polthier 93, Desbrun et al. 99]. For more details we refer to
    the references provided in Section 3.4 and the survey [Petitjean 02].


