    \ = \\mathbf{L} \\begin{pmatrix} f(v_1) \\ \\vdots \\ f(v_n) \\end{pmatrix}$\n\
    ```\n\nThis matrix contains in each row $i$ the weights $w_{ij}$ for discretizing\
    \ the Laplacian at vertex $v_i$ (see Section 3.3 and Section A.1):\n\n```\n$\\\
    Delta f(v_i) = \\sum_{v_j \\in \\mathcal{N}(v_i)} w_{ij}(f(v_j) - f(v_i)).$\n\
