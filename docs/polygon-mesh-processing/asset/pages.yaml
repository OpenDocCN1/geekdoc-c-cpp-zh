  md: 'In this appendix we describe different types of solvers for dense and sparse
    linear systems. Within this class of systems, we further concentrate on symmetric
    positive definite (spd) matrices, since exploiting their special structure allows
    for the most efficient and most robust implementations. Examples of such matrices
    are Laplacian systems (to be analyzed in Section A.1) and least-squares systems.
    The general case of a non-symmetric indefinite system is outlined afterwards in
    Section A.5.


    Following [Botsch et al. 05], we propose the use of direct solvers for sparse
    spd systems. After reviewing frequently used data structures and standard linear
    solvers, we introduce the sparse direct solvers and point out their advantages.


    For the following discussion we restrict ourselves to spd problems Ax = b, i.e.,
    square, symmetric, positive definite matrices A \in R^{n\n} and x, b \in R^n.
    We furthermore denote by x* the exact solution A=$^{-1}$b, and by a_{i,j} and
    x_i the individual entries of a matrix A and a vector x, respectively.


    # A.1 Discretizing Poisson and Laplace Equations


    Since Poisson and Laplace equations play a major role in several geometry processing
    applications, including smoothing (Chapter 4), conformal parameterization (Chapter
    5), and shape deformation (Chapter 9), we first describe the matrices obtained
    by discretizing these equations.'
