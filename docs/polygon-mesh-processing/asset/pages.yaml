  md: '# A.6. Comparison


    such problems the solution time, i.e., the third columns of the timings, are more
    relevant, as they correspond to the per-frame computational costs. Here, the pre-computation
    of a sparse factorization clearly pays off and the direct solvers are superior
    to the multigrid method.


    Table A.2 shows the same timings for bi-Laplacian systems $\Delta^2x = \mathbf{b}$.
    In this case, the matrix setup is more complex, the condition number is squared,
    and the sparsity decreases from 7 to about 19 zeros per row. Due to the higher
    number, the iterative solver takes much longer and even fails to converge on large
    systems.


    In contrast, the multigrid solver converges robustly without numerical problems.
    The computational costs required for the sparse factorization are proportional
    to the increased number of non-zeros per row. The LU factorization additionally
    has incorporate pivoting for numerical stability, and it failed for larger systems.
    In contrast, the Cholesky factorization worked reliably in all experiments.


    Besides computational cost, memory consumption is also a very important property
    of a linear system. The memory consumption of the multigrid method is mainly determined
    by the meshes representing the different hierarchy levels. In contrast, the memory
    required for the Cholesky factorization depends significantly on the sparsity
    of the matrix, too. On the largest example (500 unknowns) the multigrid method
    consumes about 1 GB memory for the Laplacian system and about 1.1 GB for the bi-Laplacian
    system, whereas the Cholesky solver needs about 600 MB and 1.2 GB, respectively.
    Hence, the direct solver would not be able to factorize large higher-order Laplacians
    on standard PCs, while the multigrid method would still succeed.


    These comparisons show that direct solvers are a valuable and efficient alternative
    to multigrid methods, even for complex linear systems. In all experiments the
    sparse Cholesky solver was faster than the multigrid method, and if the system
    has to be solved for


    | Method | Pros | Cons |

    | --- | --- | --- |

    | Jacobi | easy to implement low memory cost | inefficient |

    | conjugate gradients | easy to implement low memory cost | low performance |

    | multigrid | highly efficient low memory cost | difficult to implement difficult
    to tune |

    | sparse Cholesky | highly efficient public codes available | high memory cost
    implementations are complex |


    **Table A.3.** Advantages and disadvantages of different classes of linear solvers.'
