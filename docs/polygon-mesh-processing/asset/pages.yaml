  md: '# Spline Surfaces


    # 1.3.1 Spline Surfaces


    Tensor-product spline surfaces—often called NURBS—are the standard surface representation
    in today''s CAD systems. They are used for constructing high-quality surfaces
    (“class A”) as well as for freeform editing tasks. Spline surfaces can be described
    conveniently by piecewise polynomial or rational B-spline functions $N_i^n(\cdot)$.
    For more detail, see e.g., [Farin 197, Piegl and Tiller 197, Prautzsch et al.
    02].


    A tensor product spline surface $f$ of bi-degree $n$ is a piecewise polynomial
    surface that is built by connecting several polynomial patches in a smooth $C^{n-1}$-manifold.
    The rectangular segments are defined by two knots vectors $\{u_0, \dots, u_{m+1}\}$
    and $\{v_0, \dots, v_{k+1}\}$ and the overall surface is obtained by


