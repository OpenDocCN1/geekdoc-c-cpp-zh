  md: 'The following questions may arise: Can we construct a mesh of higher quality?
    With fewer vertices while satisfying the same set of constraints? Some of these
    questions are addressed by variational techniques.


    # 6.5.2 Variational Remeshing


    When high-quality meshes are sought after, it may be desirable to resort to an
    optimization procedure. Two questions now arise: Which criterion should we optimize?
    By exploiting which degrees of freedom? The optimized criterion can be directly
    related to the shape and size of the triangles, but we will describe how other
    criteria achieve satisfactory results as well. As the number of degrees of freedom
    are both continuous and discrete (vertex positions and mesh connectivity), there
    is a need for narrowing the space of possible triangulations.


    Mesh optimization, also commonly referred to as mesh smoothing in the meshing
    community, has addressed parts of these questions, although some work remains
    to be done in order to specialize these techniques for remeshing of surfaces.
    We refer to a comprehensive survey of mesh optimization techniques [Eppstein 01].


    Designing a variational algorithm requires defining an energy and a solver for
    this. Ideally, the solver is fast and robust and converges to a global optimum.
    In practice, the space of possible solutions is so vast reaching a global optimum
    is elusive—even more so when the notion of "best possible mesh" is not well defined.
    The zoo of criteria used for the optimization (see, e.g., [Amenta al. 99]) reveals
    the difficulty of choosing one criterion to optimize: should we optimize the triangle
    angles, the edge lengths, or the compactness of the triangles? Although one optimization
    technique has been specifically designed for optimizing the shape of the triangles
    [Chen 04], a class of mesh smoothing techniques rely on the observation that isotropic
    2D point samplings to well-shaped triangles [Eppstein 01]. Note that in three
    dimensions this observation does not hold anymore since sliver tetrahedron with
    its vertices evenly distributed along the equator of its circumsphere. Isotropic
    remeshing can therefore be cast into the problem of isotropic point sampling,
    which amounts to distributing a set of points on the mesh in a manner as possible.


    One approach to evenly distributing a set of points in two dimensions is to construct
    a centroid Voronoi tessellation [Du et al. 99]. Given a density function defined
    over a bounded domain $\Omega$, a centroid Voronoi tessellation (denoted CVT)
    of $\Omega$ is a class of Voronoi tessellations where each site coincides with
    the centroid (i.e., center of mass) of its Voronoi'
