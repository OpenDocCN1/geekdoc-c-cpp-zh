    The initial proof by Tutte [Tutte 60] uses sophisticated concepts from graph theory.
    A simpler proof was established by Colin de Verdière [de Verdière 90]. Finally,
    a proof based on the notion of discrete forms was established by [Gortler et al.
    06]. Since it uses simple counting arguments, this latter proof is accessible
    without requiring the important graph background involved in the other.


    This theorem—which characterizes a valid family of parameterizations—can be used
    as a method to construct a parameterization [Floater 97]. The idea consists of
    first fixing the vertices of the boundary on a convex polygon. Then, the coordinates
    at the internal vertices are found by solving Equation (5.1). This means solving
    two linear systems, $A\mathbf{u} = \mathbf{u}$ and $A\mathbf{v} = \mathbf{v}$
    of dimension $n_{\text{int}}$, where the vectors $\mathbf{u}$ and $\mathbf{v}$
    gather all the $\mathbf{u}$ and $\mathbf{v}$ coordinates at the internal vertices,
    and where the right side $\mathbf{u}$ (respectively $\mathbf{v}$) contains the
    vertices on the boundary:


