  md: '# Polygon Mesh Processing


    Mario Botsch

    Leif Kobbelt

    Mark Pauly

    Pierre Alliez

    Bruno Lévy


    Geometry processing, or mesh processing, is a fast-growing area of research that
    uses concepts from applied mathematics, computer science, and engineering to design
    efficient algorithms for the acquisition, reconstruction, analysis, manipulation,
    simulation, and transmission of complex 3D models. Applications of geometry processing
    algorithms already cover a wide range of areas from multimedia, entertainment,
    and classical computer-aided design, to biomedical computing, reverse engineering,
    and scientific computing.


    This book covers the whole geometry processing pipeline based on polygon meshes,
    except for acquisition and reconstruction. The pipeline starts with data input,
    for example, a model acquired by 3D scanning techniques. This data can then go
    through processes of error removal, mesh creation, smoothing, conversion, morphing,
    and more. The authors detail techniques for those processes using polygon meshes.
    Each chapter concludes with a summary of the material covered and suggestions
    for further reading.


