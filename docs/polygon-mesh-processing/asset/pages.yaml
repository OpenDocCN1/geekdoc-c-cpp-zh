    Volumetric data arises often in medical imaging (CT, MRI, etc.), as an intermediate
    representation when fusing registered ranges, or in constructive geometry (CSG).
    In a volumetric dataset, each point in space is usually assigned a scalar value
    with negative values indicating points that lie outside the object. Hence the
    surface itself corresponds to the zero-contour of the scalar field. In a discrete
    voxel representation, each voxel can be classified as either *inside*, *outside*,
    or on the *surface* depending on the sign of the scalar field.


    Unfortunately, due to the finite resolution of the underlying grid, voxels are
    often incorrectly classified, leading to the so-called *partial volume effect*.
    The term refers to topological artifacts in the reconstruction, such as small
    handles or disconnected components, that are not consistent with the model that
    should be represented by the volume. A well-known failure case is MRI datasets
    of the human brain. From anatomy it is well known that the cortex of the brain
    is homomorphic to a sphere, but even a model of higher genus is extracted because
    anatomically separate features lie closer than the size of a voxel. Sub-voxel
    precision is required to identify separate features [Bischoff and Kobbelt 03].


    While disconnected components and small holes can be easily detected and removed
    from the main part of the model, handles are more problematic. Due to the simple
    connectivity of the underlying Cartesian grid, it is easier to remove them from
    the volume dataset before applying the contouring algorithm or to identify and
    resolve them during reconstruction [Wood et al. 04]. Guskov and Wood present one
