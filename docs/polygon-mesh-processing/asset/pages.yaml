    \ is often not feasible to find an explicit formulation with a single function\
    \ that approximates a given shape with sufficient accuracy. Hence, the function\
    \ is usually split into smaller sub-regions and an individual function (*surface\
    \ patch*) is defined for each segment. In this *piecewise* definition, each function\
    \ needs to approximate the given shape only locally, while the global approximation\
    \ tolerance is controlled by the size and number of the segments. The mathematical\
    \ challenge is to guarantee a consistent transition from each patch to its neighboring\
    \ ones. The most common piecewise surface definition in the parametric case is\
    \ the segmentation of $\\Omega$ into triangles or quadrangles. For implicit surface\
    \ definitions, the embedding space is usually split into hexahedral (*voxels*)\
    \ or tetrahedral cells.\n\nBoth parametric and implicit representations have their\
    \ particular strengths and weaknesses, such that for each geometric problem the\
    \ better suited one should be chosen. In order to analyze geometric operations\
    \ and their requirements on the surface representation, one can classify them\
    \ into the following three categories [Kobbelt 03]:\n\n+   * *Evaluation.* This\
    \ entails the sampling of the surface geometry or of other surface attributes,\
    \ e.g., the surface normal field. A typical application example is surface rendering.\n\
    \n+   * *Query.* Spatial queries are used to determine whether or not a given\
    \ point $p \\in \\mathbb{R}^3$ is inside or outside of the solid bounded by a\
    \ surface $S$, which is a key component for modeling operations. Another typical\
    \ query is the computation of a point's distance to a surface.\n\n+   * *Modification.*\
    \ A surface can be modified either in terms of *geometry* (surface deformation)\
    \ or in terms of *topology* (e.g., when parts of the surface are to be merged,\
    \ cut, or deleted).\n\nWe will see that parametric and implicit surface representations\
    \ have complementary advantages with respect to these three types of geometric\
    \ operations, i.e., the strengths in terms of efficiency or robustness of the\
    \ one"
