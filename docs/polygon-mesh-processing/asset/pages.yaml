    \ deformation works by propagating the user-defined handle transformation within\
    \ the deformation region (see Figure 9.2). After specifying the support region\
    \ $\\mathcal{R}$ of the deformation and a handle region $\\mathcal{H}$ within\
    \ it, the handle is transformed using some blending interface. Its transformation\
    \ $\\mathbf{T}(\\mathbf{x})$ is propagated and damped within the support region,\
    \ leading to a smooth blend between the transformed handle $\\mathcal{H}'$ and\
    \ the fixed region $\\mathcal{F}$.\n\nThis smooth blend is controlled by a scalar\
    \ field $s: S \rightarrow [0, 1]$, which is 1 at the handle $\\mathcal{H}$ (full\
    \ deformation), 0 on the fixed region $\\mathcal{F}$ (no deformation), and smoothly\
    \ blends between 1 and 0 within the support region. One way to construct such\
    \ a field is to compute the distances $\text{dist}_{\\mathcal{F}}(\\mathbf{p})$\
