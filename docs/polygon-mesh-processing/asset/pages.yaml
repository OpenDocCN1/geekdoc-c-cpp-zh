  md: 'A standard face-based data structure for triangle meshes that includes connectivity
    information consists of storing, for each face, references to its three vertices
    as well as references to its neighboring triangles. Each vertex stores a reference
    to one of its incident faces in addition to its 3D position (see Figure 2.2).
    Based on this connectivity information one can circulate around a vertex in its
    one-ring neighborhood, and perform all other operations listed above. This representation
    is used, for instance, the 2D triangulation data structures of CGAL [CGAL 09]
    and consumes 24 bytes/face + 16 bytes/vertex = 64 bytes/vertex.


    However, this data structure also has drawbacks. First, it does not explicitly
    store edges, so, for example, no data can be attached to edges. Second, enduring
    the one-ring of a center vertex requires a large number of case (is the center
    vertex the first, or third vertex of the current triangle?). Finally, if this
    data structure is to be used for general polygonal meshes, the data type for faces
    no longer has constant size, which makes the implementation more complex and less
    efficient.


    # 2.2 Edge-Based Data Structures


    Data structures for general polygon meshes are logically edge-based, since the
    connectivity primarily relates to the mesh edges. Well-known edge-based data structures
    are the winged-edge [Baumgart 72] and quad-edge [Guibas and Stolfi 85] structures
    in different variants (see, for instance, O''Rourke 94]).


    The winged-edge structure is depicted in Figure 2.3. Each edge stores references
    to its endpoint vertices, to its two incident faces, and to the next and previous
    edge within the left and right face, respectively. Vertices and faces store a
    reference to one of its incident edges. In total, this leads to a memory consumption
    of 16 bytes/vertex + 32 bytes/edge + 4 bytes/face = 120 bytes/vertex (since F
    ≈ 2V and E ≈ 3V due to the Euler formula in Equation (1.5)).


    | Vertex | Edge |

    |---|---|

    | Point edge | VertexRef vertex[2] |

    | FaceRef face[2] |

    | EdgeRef next[2] |

    | EdgeRef prev[2] |


    ![](img/50d65c1816c68c45610a75b087632bd3_35_0.png)


    Figure 2.3. Connectivity information stored in an edge-based data structure.'
