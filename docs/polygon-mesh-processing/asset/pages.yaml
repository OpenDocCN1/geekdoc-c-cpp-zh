    The efficiency and memory consumption of the geometric modeling algorithms presented
    in this book largely depend on the underlying surface mesh data structures. This
    chapter provides a brief overview of the most common data structures of the wide
    variety described in the literature.


    Choosing a mesh data structure requires taking into account topological as well
    as algorithmic considerations:


    +   * Topological requirements. Which kinds of meshes need to be represented by
    the data structure? Can we rely on 2-manifold meshes, or do we need to represent
    complex edges and singular vertices (see Section 1.3.3)? Can we restrict ourselves
    to pure triangle meshes, or regular, semi-regular, irregular polygonal meshes
    (see Chapter 6)? Do we want to build a hierarchy of increasingly refined meshes
    (see Section 1.3.2)?


    +   * Algorithmic requirements. Which kinds of algorithms will be operating on
    the data structure? Do we simply want to render the mesh, or do we need efficient
    access to local neighborhoods of vertices, edges, and faces? Will the mesh be
    static or will with its geometry and/or connectivity change over time? Do we need
    to associate additional data with vertices, edges, and faces of the mesh? Do we
    have special requirements in terms of memory consumption (i.e., the data sets
    massive)?


    Evaluating a data structure requires measuring various criteria such as (a) time
    to construct it during preprocessing, (b) time to answer a'
