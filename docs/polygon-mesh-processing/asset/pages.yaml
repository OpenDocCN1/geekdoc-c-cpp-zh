  md: '# 7.2. Incremental Decimation


    Hausdorff distance. Finally, the most expensive but also the sharpest distance
    estimate is the Hausdorff distance [Klein et al. 96]. This distance measure is
    defined to be the maximum minimum distance, i.e., if we have two sets A and B
    H(A, B) is found by computing the minimum distance (a,B) for each point a ∈ A
    and then the maximum of those values:


    ```

    H(a, B) = \max_{a \in A, b \in B} ||a - b||

    ```


    Notice that, in general, H(A, B) ≠ H(B, A) and hence the symmetric Hausdorff distance
    is the maximum of both values.


    If we assume that the vertices of the original mesh represent points measured
    on some original geometry, then the faces have been generated by triangulation
    preprocess and should be considered as piecewise linear approximations to the
    original shape. From this point of view, the correct error estimate for the decimated
    mesh would be the one-sided Hausdorff distance H(A, B) from the original samples
    A to the decimated mesh.


    To efficiently compute the Hausdorff distance, we have to keep track of the assignment
    of original vertices to the decimated mesh. When an collapse operation is performed,
    the removed vertices p and q (or p alone in the case of a halfedge collapse) are
    assigned to the nearest triangle in a local vicinity. In addition, since the collapse
    changes the shape of the adjacent triangles, the data points that previously have
    been assigned to these triangles must be re-distributed. By this, every triangle
    ti of the decimated mesh at any time maintains a list of original vertices belonging
    to the currently patch Si. The Hausdorff distance is then evaluated by finding
    the most distant point in this list.


    A special technique for exact distance computation is suggested in [Cohen et al.
    96], where two offsets to the original mesh are computed to bound the space in
    which the decimated mesh is to stay. The method of Borouchaki and Frey performs
    an approximate computation of the Hausdorff distance [Borouchaki and Frey 05].


    # 7.2.3 Fairness Criteria


    The distance measures can be used to decide which removal operations among the
    candidates are legal and are not (because they violate the global error threshold
    ε). In an incremental mesh decimation scheme we have to provide an additional
    criterion that ranks all the removal operations. This criterion determines the
    ordering of candidates in the heap.


    A straightforward solution is to use the distance measure for the ordering as
    well. This implies that the decimation algorithm will always remove vertex in
    the next step that increases the approximation error'
