    # A.4 Sparse Direct Cholesky Solver


    Direct solvers for linear systems are based on the factorization of the matrix
    A into matrices of simpler structure, e.g., triangular or orthogonal matrices.
    Once the factorization has been computed, this special structure allows for an
    efficient solution of the linear system. It can therefore also be used to efficiently
    solve the linear system for multiple right-hand sides.


    For symmetric and positive definite linear systems the Cholesky factorization
    is the most efficient choice [Golub and Loan 89. Trefhen and Bau 97]: it factorizes
    the matrix A into the product $LL^T$ of a lower triangular L and its transpose.
    Once the Cholesky factorization is obtained, it is a trivial matter to solve the
    linear system Ax = b:


    ```

    Ax = b \Leftrightarrow LL^T x = b \Leftrightarrow \begin{cases} Ly = b \ L^T x
    = y \end{cases}

    ```


    A Cholesky solver solves the linear system by solving two triangular systems,
    which can be performed efficiently through forward and backward substitutions.
    The Cholesky solver, in comparison to the more general LU-factorization, exploits
    the symmetry of A and is numerically robust due to the positive definiteness of
    A.


    On the downside, we have to consider that the asymptotic complexity of a standard
    Cholesky solver is $O(n^3)$ for the factorization and $O(n^2)$ for solving the
    two triangular systems. for the problems we are targeting, $n$ can be of the order
    of $10^6$, this cubic complexity is prohibitive. In practice, it takes 0.01 seconds
    to solve a (tiny) linear system of size $n = 100$, but the cubic complexity makes
    this time become 10 centuries if $n = 10^5$. Even if the A is highly sparse, a
    naive Cholesky solver does not exploit this structure, that the matrix factor
    L is dense in general (see Figure A.2, top row). Note that this is true for all
    dense matrix factorizations (LU, QR, SVD), which all have cubic time complexity.


    However, an analysis of the Cholesky factorization reveals that the bandwidth
    of the matrix A is defined


    ```

    \beta(A) = \max_{i,j} \{|i - j| : a_{i,j} \neq 0\}

    ```


    and intuitively describes the maximum distance of a non-zero entry from the diagonal.
    If A has a certain bandwidth, then so does its factor L, i.e., $\beta(L)\leq \beta(A)$.
    Hence, additional non-zeros (so-called fill-in elements'
