    This additional structure can be exploited in both the factorization and the solution
    processes, that their complexities reduce from $O(n^3)$ to $O(n\beta^2)$ and $O(n\beta)$,
    respectively [George and Liu 81].


    An stricter bound is that the Cholesky factorization also preserves the so-called
    *envelope*, i.e., all leading zeros of each row. The true complexity of factorization
    and solution generally depend linearly on the number of non-zeros of the factor
    **L**—instance, if the width of the band or the envelope is a small constant—then
    we get the $O(n)$ time complexity for multigrid solvers!


    However, if the matrix **A** is sparse but does not have a special band-envelope
    structure, this result does not apply: the Cholesky factor **L** will be a dense
    matrix and the complexity cubics see [Figure A.2, top row). We can, minimize the
    matrix envelope in a first step, which can be achieved by symmetric row and column
    permutations. This corresponds to a reordering of the mesh vertices. Although
    finding the optimal reordering is an NP-complete problem, several good heuristics
    exist, which we outline the most frequently used in the Following. All of these
    methods work on the *adjacency graph* *Adj(A)*, where nodes $i, j \in \{1, \dots,
    n\}$ are connected by an edge if and only if $a_{i,j} \neq 0$.


    The standard method for envelope minimization is the *Cuthill-McKee*, which picks
    a start node and all its neighbors by traversing the adjacency graph in a greedy
    breadth-first manner. Reverting this permutation further improves the reordering,
    leading to the *reverse Cuthill-McKee* method [Liu and Sherman 76]. The result
    of this reordering is shown in the second row of Figure A.2.


    The **minimum degree** algorithm [George and Liu 89, builds on the fact that the
    non-zero structure of **L** can be symbolically derived from the non-zero structure
    of the matrix **A**, or, equivalently, its adjacency graph **Adj(A)**. By analyzing
    the graph interpretation of the Cholesky factorization it tries to fill-in. This
    reordering does not yield a band structure (which implicitly limits fill-in),
    but instead explicitly minimizes non-zeros and thus higher performance (see **Figure
    A.2**, third row).


    The last of considering approaches is based on graph partitioning. A matrix **A**
    whose adjacency graph has $m$ separate connected components can be reconstructed
    to a block-diagonal matrix of $m$ blocks, such that factorization can be performed
    on each block individually. If the adjacency graph is small, a small subset $S$
    of separating nodes, whose elimination would separate the graph into two components
    of roughly equal size, is found by one of several heuristics [Karypis and Kumar
    98]. This graph partitioning results in a matrix consisting of two large diagonal'
