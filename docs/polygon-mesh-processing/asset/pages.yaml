    # 3.4 Summary and Further Reading


    The derivation of discrete analogs to differential properties of smooth surfaces
    has been an active area of research for many years. Pinkall and Polthier discuss
    discrete minimal surfaces and present a derivation of Equation (3.11) using a
    minimization on the mesh [Pinkall and Polthier 93]. Bobenko and Springborn [Bobenko
    and Springborn 07] evaluate Equation (3.11) on intrinsic Delaunay triangulation
    of the simplicial surface, which makes the evaluation independent of the specific
    selection of the mesh. Zayer and co-workers [Zayer et al. 05] replace the cotangent
    weights with the positive mean value coordinates and integrate over circles instead
    of Voronoi cells. While this leads to a less accurate discretization of the Laplace-Beltrami,
    negative weights are avoided. A systematic study of convergence conditions for
    discrete geometry is given in [Hildebrandt et al. 06].


    An alternative approach to estimating local surface properties uses a local higher-order
    reconstruction of the surface, followed by analytic evaluation of the desired
    properties on the reconstructed surface. Local surface patches, bivariate polynomials
    of low degree, are fitted to sample points [Cazals and Pouget 03, Petitjean 02,
    Welch and Witkin 94] and properly normals [Goldfeather and Interrante 04] within
    a local neighborhood.


    Ruskinkiewicz proposed a scheme that approximates the curvature tensor using finite
    differences of vertex normals [Ruskinkiewicz 04]. A related approach by Theisel
    and co-workers [Theisel et al. 04] considers the piecewise linear surface with
    a piecewise linear normal field.


    Grinsup and colleagues provide an extensive overview of concepts and applications
    of discrete differential geometry. In particular, they present an alternative
    approach to define discrete differential operators based on discrete calculus
    [Grinsup et al. 08]. Wardetzky and colleagues classify the most common discrete
    Laplace operators according to a set of desirable properties derived from the
    smooth smoothing [Wardzky et. 07]. They show that the discrete operators cannot
    simultaneously satisfy all of the identified properties of symmetry, locality,
    linear precision, and positivity. For example, the cotangent formula of Equation
    (3.11) satisfies the first three properties, but not the fourth, since edge weights
    can assume negative values. The choice of discretization depends on the specific
    application.'
