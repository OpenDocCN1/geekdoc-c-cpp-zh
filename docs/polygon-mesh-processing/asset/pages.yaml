  md: '# A.1. Discretizing Poisson and Laplace Equations


    Sparsity. Since the Laplacian $\Delta f(v_i)$ is defined $locally$ in terms of
    its one-ring neighbors, the matrix $\mathbf{M}$—and hence the Laplacian matrix
    $\mathbf{L}$—is highly sparse. In the ith row it has nonzeros on the diagonal
    and in the columns corresponding to $v_i$''s one-ring neighbors $v_j \in \mathcal{N}(v_i)$
    only. In a triangle mesh each vertex has six neighbors on average (Section 1.3.3),
    $L$ has seven non-zero entries per row. As an example, for a (small) mesh with
    10,000 vertices there will only be about 0.07%non-zero entries. For complex meshes
    the sparsity will be even higher. A Bi-Laplacian matrix $L^2$ has an increased
    density of 19 nonzeros per row, which is still very sparse.


    Symmetry. Due to the diagonal matrix $\mathbf{D}$, which scales each row of $M$
    by $w_i$, the Laplacian matrix $\mathbf{L} = \mathbf{DM}$ is not symmetric in
    general. However, Laplacian systems $L^k\mathbf{x} = \mathbf{b}$ of any order
    $k$ can be easily turned into symmetric systems by moving the left-most factor
    $\mathbf{D}$ to the right-hand side:


    ```

    $\mathbf{M}(\mathbf{DM})^{k-1}\mathbf{x} = \mathbf{D}^{-1}\mathbf{b}. \quad (A.2)$

    ```


    Definiteness. For the PDE to have a well-defined solution, and for the matrix
    to be non-singular, boundary constraints must be implemented. Typically the values
    $f(v_i)$ of a set of constrained vertices $v_i \in C$ are described (*Dirichlet
    constraints*). When we solve a linear system $\mathbf{Ax} = \mathbf{b}$ with certain
    values $x_i$ for $v_i \in C$ being constrained, these values are no longer unknown
    variables. Hence, their corresponding columns $a$ are moved to the right-hand
    side $(\mathbf{b} \leftarrow \mathbf{b}-x_i a_i)$ and their corresponding rows
    $i$ are removed from the system. Note that symmetrically eliminating both column
    $i$ and row $i$ from the system keeps the matrix symmetric. After incorporating
    constraints into a Laplacian system, the resulting matrix $L$ can be shown to
    be negative definite [Pinkall and Polthier 93]. As a consequence, we multiply
    the system by $-1$ to get a positive definite system.


    Combining these three observations we see that higher-order Laplacian systems
    $L^k\mathbf{x} = \mathbf{b}$ can be rewritten as


    ```

    $(-1)^k(\mathbf{DM})^{k-1}\mathbf{x} = (-1)^k\mathbf{D}^{-1}\mathbf{b},$

    ```


    which is a sparse, symmetric, and positive definite (spd) linear system. These
    beneficial properties allow us to apply the efficient linear solvers presented
    in the remainder of this appendix.


    However, note that other matrices used in mesh processing have very similar properties.
    For instance, solving overdetermined systems $\mathbf{Ax} = \mathbf{b}$ in a least
    squares manner through the normal equations $\mathbf{A}^T\mathbf{Ax} = \mathbf{A}^T\mathbf{b}$
    also leads to spd systems. Moreover, discretizing PDEs leads to very sparse matrices,
    since the required partial derivatives depend on local vertex neighborhoods only.'
