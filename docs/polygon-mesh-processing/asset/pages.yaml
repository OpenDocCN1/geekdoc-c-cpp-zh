  md: '# 2.3. Halfedge-Based Data Structure


    While an edge-based data structure can represent arbitrary polygonal meshes, traversing
    the one-ring still requires case distinctions (the center vertex the first or
    second vertex of edge?). This issue is finally addressed by halfedge data structures,
    as described in the next section.


    # 2.3 Halfedge-Based Data Structure


    Halfedge data structures [Mantyla 99] avoid the case distinctions of edge-based
    data structures by splitting each (unoriented) edge into two oriented halfedges,
    as depicted in Figure 2.4. This data structure is able to represent arbitrary
    polygonal meshes that are subsets of (combinatorial) 2-manifolds (no complex edges
    and vertices, see Figure 1.6).


    In a halfedge data structure, halfedges are oriented consistently in clockwise
    order around each face and along each boundary Any may be seen here as an face
    of potentially high degree. As a by-product, each halfedge designates a unique
    corner (a non-shared vertex in a face) and hence attributes such as texture coordinates
    or normals can be stored per corner.


    For each halfedge we store a reference to


    +   - the vertex it points to,

    - its adjacent face (a zero pointer if it is a boundary halfedge),

    - the next halfedge of the face or boundary (counterclockwise direction),

    - the previous halfedge in the face,

    - its opposite (or inverse) halfedge.


    Note that the opposite halfedge does not have to be stored if two opposing halfedges
    are always grouped in pairs and stored in subsequent array


    | Vertex | Halfedge |

    | --- | --- |

    | Point position | HalfedgeRef halfedge |

    | Face | VertexRef vertex |

    | HalfedgeRef next |

    | HalfedgeRef prev |

    | HalfedgeRef opposite |


    ![](img/50d65c1816c68c45610a75b087632bd3_36_0.png)


    Figure 2.4. Connectivity information stored in an halfedge-based data structure.'
