    \n**Figure 9.8.** Representing the displacements with regard to the global coordinate\
    \ system does not lead to the desired result (left). The geometrically intuitive\
    \ solution is achieved by storing the details with regard to local frames that\
    \ rotate according to the local tangent plane’s rotation of $\\mathcal{B}$ (right).\
