    # 8.5.1 Volumetric Repair on Regular Grids


    Nooruddin and Turk proposed one of the first volumetric techniques to reify arbitrary
    models that contain gaps, overlaps, and intersections [Nooruddin and Turk 03].
    Additionally, they employed morphological operators to resolve topological artifacts
    like holes and handles.


    The first model is converted into a Cartesian voxel grid: {d} is produced (e.g.,
    by subdividing an octahedron or icosahedron). Then the model is projected along
    these directions onto an orthogonal planar grid. For each grid point x, the algorithm
    records the first and last intersection points of the ray x+ with the input model.
    A voxel is classified by such ray as *inside* if it is between these two extremal
    depth samples; otherwise, it is classified as *outside*. The final classification
    of each voxel is derived from the majority vote of all the rays passing through
    that voxel. The Marching Cubes algorithm is applied to extract the surface inside
    and outside voxels.


    In an optional second step, then handles and holes are removed from the volume
    by applying morphological operators that are also known from image processing
    [Haralik et al. 87]. The dilation operator Eε computes the distance from each
    outside voxel to the inside component. All voxels that are within a distance of
    ε to the inside are also set to be inside. Thus, the dilation operator closes
    small handles and bridges gaps. The erosion operator Eε works exactly the other
    way around and removes bridges and handles. Usually, dilation and erosion are
    used in conjunction, Eε~Dε, to avoid expansion or shrinkage of the model.


    The classification of inside and outside voxels in this algorithm is rather heuristic
    and often not reliable. Furthermore, the algorithm is not feature-sensitive.


    # 8.5.2 Volumetric Repair on Adaptive Grids


    Bischoff et. propose an improved volumetric technique to repair arbitrary triangle
    soups [Bischoff et al. 05] (see Figure 8.6). The user provides an error tolerance
    ε and a maximum depth ρ to which gaps should be closed. The algorithm creates
    an adaptive octree representation of the input model where each cell stores the
    triangles intersecting with it. From these triangles a feature-sensitive sample
    point can be computed for each cell. Then, a sequence of morphological operations
    is applied to the cell, and the octree to determine the topology of the model.
    Finally, the connectivity and geometry of the reconstruction are derived from
    the octree structure and samples, respectively.


    Let us assume that the triangle soup is scaled to fit into the root cell of the
    octree. We set the maximum depth of the octree cells such that the diameter of
    the finest-level cells is smaller than ε. Each cell stores'
