  md: "# 7. Simplification & Approximation\n\n# 7.1.1 Computing Cluster Representatives\n\
    \nVertex clustering algorithms vary mainly in how they compute the representative.\
    \ Simply taking the center of each cell or the straight average of its associated\
    \ vertices are obvious choices, but these methods rarely lead to satisfying results\
    \ see Figure 7.1.\n\nA more reasonable choice is based on finding the optimal\
    \ vertex position as a least-squares approximation. For this we exploit the fact\
    \ that for sufficiently small $\\varepsilon$ the polygonal surface within one\
    \ cell is expected to be piecewise flat, i.e., either the associated normal cone\
    \ has a small opening angle (totally flat) or the patch can be split into a small\
    \ number of sectors for which the normal cone has a small opening angle. The optimal\
    \ representative vertex position should have a minimum deviation from all the\
    \ (regression) tangent planes that correspond to these sectors. If these approximate\
    \ tangent planes do not intersect in a single point, we need to compute a solution\
    \ in the least-squares sense.\n\nConsider one triangle $t_i$ within the current\
    \ cell of interest. Let us denote by $P_i = (\\mathbf{x}_i, \\mathbf{n}_i)$ the\
    \ supporting plane of this triangle, $t_i$, with $\\mathbf{x}_i$ an arbitrary\
    \ vertex on the plane and $d_i = \\mathbf{n}_i^T\\mathbf{x}$ the squared distance\
    \ of a point $\\mathbf{x}$ from the plane $P_i$ can be computed\n\n```\n$dist^2(\\\
    mathbf{x}, P_i) = (\\mathbf{n}_i^T\\mathbf{x} - d_i)^2.$\n```\n\nUsing homogeneous\
    \ coordinates $\bar{\\mathbf{x}} = (\\mathbf{x}, 1)$ and $\bar{\\mathbf{n}}_i\
    \ = (\\mathbf{n}_i, -d_i)$ the above simplifies to\n\n```\n$dist^2(\\bar{\\mathbf{x}},\
    \ P_i) = (\bar{\\mathbf{n}}_i^T\\bar{\\mathbf{x}})^2 = \\bar{\\mathbf{x}}^T\\\
    bar{\\mathbf{n}}_i\\bar{\\mathbf{n}}_i^T\\bar{\\mathbf{x}} = \\bar{\\mathbf{x}}^T\
    \ Q_i\\bar{\\mathbf{x}}.$\n```\n\n**Figure 7.1.** Different choices for the representative\
    \ vertex when decimating a mesh using clustering: original (left), average (center),\
