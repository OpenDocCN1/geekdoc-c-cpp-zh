  md: '# 9. Deformation


    These problems are avoided by space deformations, which deform the ambient space
    and thus deform the embedded objects (see Figure 9.12). In contrast to surface-based
    methods, space deformation approaches employ a trivariate deformation function
    $d: R^3 \rightarrow R^3$ to transform all points of the original surface $S$.
    The space deformation function $d$ does not depend on a particular surface representation,
    it can be used to transform all kinds of explicit surface representations, e.g.,
    by transforming all vertices of a triangle mesh or all points of a point-sampled
    model.


    # 9.5.1 Lattice-Based Freeform Deformation


    Classical freeform deformation (FFD) [Sederberg and Parry 86] represents the space
    deformation by a trivariate tensor spline function


    ```

    $d(u, v, w) = \sum_{i} \sum_{j} \sum_{k} \delta c_{ijk} N_i(u) N_j(v) N_k(w),
    \quad (9.12)$

    ```


    where $N_i$ are B-spline basis functions and $\delta c_{ijk} = (c''_{ijk} - c_{ijk})$
    are the displacements of the control points $c_{ijk}$ (compare this to tensor-product
    spline surfaces of Section 1.3). Let us for the sake of simpler notation order
    grid points and basis functions in a linear manner:


    ```

    $\delta c_l := \delta c_{ijk} \quad N_l(u) = N_i(u, v, w) := N_i(u) N_j(v) N_k(w).$

    ```


    This allows us to re-write Equation (9.12) as


    ```

    $d(u) = \sum_{l=i}^{n} \delta c_l N_l(u).$

    ```


    Each original vertex $p_i \in S$ has a corresponding parameter value $u_i = (u_i,
    v_i, w_i)$ such that $p_i = \sum c_l N_l(u_i)$. The vertex is transformed by $p''_i
    = p_i + d(u_i)$, which can be computed efficiently since $N_i(u_i)$ stays constant
    and can be precomputed.


    The deformation can be controlled by the manipulating of control points, i.e.,
    by prescribing the control point displacements $\delta c$ (see Figure 9.13). However,
    this can become tedious for more complex control grids. Moreover, the support
    of the deformation is sometimes difficult to predict since it is the intersection
    of a volumetric function''s support with the surface $S$.


    A handle-based interpolation for direct surface points $p_i \in S$ instead of
    control points $c_i$, simplifies the deformation process [Hsu et al. 92]. Given
    a set of displacement constraints $d(u_i) = d_i$ for $\{p_1, \dots, p_m\} = H
    \cup \mathcal{F}$, one solves a linear'
