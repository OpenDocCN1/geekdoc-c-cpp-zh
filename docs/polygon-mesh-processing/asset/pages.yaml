    # 2.1 Face-Based Data Structures


    The simplest way to represent a surface mesh consists of storing a set of individual
    polygonal faces represented by their vertex positions (the-called face-set). For
    the simpler case of triangular meshes this requires storing three vertex positions
    per face (see Figure 2.1 (left)). Using 32-bit precision numbers to represent
