  md: '# 7.3. Shape Approximation


    Furthermore, let $\mathcal{P}=\{P_1, \dots, P_k\}$ be a set of proxies. A proxy
    $P_i ==(\mathbf{x}_i, \mathbf{n}_i)$ is simply a plane in space through the point
    $\mathbf{x}_i$ with normal direction $\mathbf{n}_i$. Cohen-Steiner et al. consider
    two metrics that measure a generalized distance of a region $\mathcal{R}_i$ to
    its proxy $P_i$. The standard $\mathcal{L}^2$ metric is defined as


    ```

    $$\mathcal{L}^2(\mathcal{R}_i, P_i) = \int_{\mathbf{x} \in \mathcal{R}_i}(\mathbf{n}_i^T\mathbf{x}
    - \mathbf{n}_i^T\mathbf{x}_i)^2 d\mathbf{A}$$

    ```


    where the integrand is just squared orthogonal distance of x from the plane $P_i$.
    They also introduce a new shape metric $\mathcal{L}^{2,1}$ that is based on a
    measure of the normal field:


    ```

    $$\mathcal{L}^{2,1}(\mathcal{R}_i, P_i) = \int_{\mathbf{x} \in \mathcal{R}_i}|\mathbf{n}(\mathbf{x})
    - \mathbf{n}_i|^2 d\mathbf{A}$$

    ```


    The goal of variational shape approximation is then the following: given a number
    $k$ and an error metric $E$ (i.e., either $E=\mathcal{L}^2$ or $E=\mathcal{L}^{2,1}$),
    find a set $\mathcal{R}=\{\mathcal{R}_1,\ \dots, \mathcal{R}_k\}$ of regions and
    a set $\mathcal{P}=\{P_1,\ \dots, P_k\}$ of proxies such that the global distortion


    ```

    $E(\mathcal{R}, \mathcal{P}) = \sum_{i=1}^k E(\mathcal{R}_i, P_i) \quad (7.3)$$

    ```


    minimized. We can then extract a mesh of the original input from the proxies.


    In the following sections we describe and compare two algorithms for computing
    an (approximate) minimum of Equation (7.3). The first algorithm is due to Cohen-Steiner
    et al. and uses Lloyd clustering to produce the regions $\mathcal{R}_i$. The second
    method is a greedy approximation to VSA with additional injectivity guarantees.


    # 7.3.1 Variational Shape Approximation


    Cohen-Steiner et al. [Cohen-Steiner et al. 04] use a method to minimize Equation
    (7.3) that is inspired by Lloyd’s clustering algorithm, which has been used for
    mesh segmentation [Sander et al. 03]. The algorithm iteratively alternates between
    a geometry partitioning phase and a proxy fitting phase. In the geometry partitioning
    phase, the algorithm computes a set of regions that best fit a set of proxies.
    In the proxy fitting phase, the partitioning is kept fixed and the proxies are
    adjusted.


    Geometry partitioning. In the geometry partitioning phase, the algorithm modifies
    the set $\mathcal{R}$ of regions to achieve a lower approximation error (Equation
    (7.3)) while keeping the proxies $\mathcal{P}$ fixed. It does so by selecting
    a number of seed triangles and greedily growing new regions $\mathcal{R}_i$ around
    them.'
