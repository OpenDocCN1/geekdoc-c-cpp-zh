  md: '# 4.1. Fourier Transform and Manifold Harmonics


    These equations have an intuitive geometric interpretation: the function $f(x)$
    can be considered an element of a certain vector space (integrable complex-valued
    functions), which is equipped with the inner product


    ```

    $$(f, g) = \int_{-\infty}^{\infty} f(x)\overline{g(x)} \,dx$$

    ```


    where $(\overline{a+ib}) = (a-ib)$ denotes complex conjugation. The complex exponential
    functions


    ```

    $$f_{\omega}(x) := e^{2\pi\omega x} = \cos(2\pi\omega x) - i\sin(2\pi\omega x)$

    ```


    consist of sine and cosine functions of frequency $\omega$ and hence are considered
    *complex waves* of frequency $\omega$. They build a frequency-related orthogonal
    basis of our vector space—the *frequency domain*.


    In this context the Fourier transform is simply a change of basis by orthogonal
    projection of the "vectors" $e_{\omega}$:


    ```

    $$f(x) = \sum_{-\infty}^{\infty} \langle f, e_{\omega} \rangle e_{\omega}.$$

    ```


    The scalar coefficient $(f, e_{\omega})$ is nothing other than $F(\\omega)$ in
    Equation (4.1). It describes how much of the basis function $e_{\omega}$ is contained
    in $f$, i.e., what amplitude of the frequency $\omega$ is contained in the signal
    $f(x)$. Since the frequencies $\omega$ are real values and not just integers,
    the sum in the above equation turns into an integral, which reproduces Equation
    (4.2).


    Since the coordinates $F(\\omega)$ with respect to the basis $e_{\omega}$ directly
    correspond to frequencies, we can implement an ideal *low-pass filter* by simply
    cutting off all frequencies above a user-defined threshold $\omega_{\max}$. This
    is equivalent to reconstructing the filtered function $f$ from the lower frequencies
    $|\omega| < \omega_{\max}$ only:


    ```

    $$\hat{f}(x) = \int_{-\omega_{\max}}^{\omega_{\max}} \langle f, e_{\omega} \rangle
    e_{\omega} \,d\omega. \quad (4.3)$$$

    ```


    # 4.1.2 Manifold Harmonics


    The 1D Fourier framework is now to be generalized to functions $f: S \to \mathbb{R}$
    on a directa (discrete)-2 surface. The Fourier transform of Equation (4.1) cannot
    be translated directly to functions on manifolds. The missing link is provided
    by the following observation: sine and cosine functions, and therefore also the
    complex waves $e_{\omega}$, are eigenfunctions of the Laplace operator, i.e.,


    ```

    $$$(e^{2\pi\omega x}) = \frac{d^2}{dx^2}e^{2\pi\omega x} = -(2\pi\omega)^2 e^{2\pi\omega
    x}.$$

    ```'
