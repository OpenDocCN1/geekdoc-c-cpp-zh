  md: '182


    A. Numerics


    Let us consider the discretization and solution of a Poisson PDE $\Delta f = b$
    or a higher-order PDE $\Delta^k f = b$ on a triangle mesh. The scalar-valued function
    $f: S \to \mathbb{R}$ is defined by piecewise linear interpolation of its values
    $f_i = f(v_i)$ at the mesh vertices $v_i$. As discussed in Chapter 3, the continuous
    Laplace or Laplace-Beltrami $\Delta f$ can be discretized at a mesh vertex $v_i$
    by a linear combination of the function values at the center vertex $v_i$ and
    its one-ring neighbors $v_j$:


    ```

    $$\Delta f(v_i) = w_i \sum_{v_j \in N(v_i)} w_{ij}(f(v_j) - f(v_i)).$

    ```


    If instance, for the cotangent discretization of Equation (3.11), the weights
    are $w_i = \frac{1}{2A_i}$ and $w_{ij} = (\cot \alpha_{i,j} + \cot \beta_{i,j})$.


    If we stack the function values $f(v_i)$ and Laplacians $\Delta f(v_i)$ of all
    $n$ vertices into two vectors, the discretized Laplacian of all mesh vertices
    can be written in matrix notation:


    ```

    $$\begin{pmatrix} \Delta f(v_1) \ \vdots \ \Delta f(v_n) \end{pmatrix} = \mathbf{DM}
    \begin{pmatrix} f(v_1) \ \vdots \ f(v_n) \end{pmatrix}$

    ```


    Here, $\mathbf{D} = diag(w_1, \dots, \, w_n)$ is a diagonal matrix of the vertex
    weights $w_i$, and $\mathbf{M}$ is a symmetric matrix of edge weights $w_{ij}$:


    ```

    $m_{i,j} = \begin{cases} -\sum_{v_k \in N(v_i)} w_{ik}, & i = j, \ w_{ij}, & v_j
    \in N(v_i), \ 0, & \text{otherwise.} \end{cases}$

    ```


    Discretizations of higher-order Laplacians can be obtained recursively by


    ```

    $$\Delta^k f(v_i) = w_i \sum_{v_j \in N(v_i)} (\Delta^{k-1} f(v_j) - \Delta^{k-1}
    f(v_i)).$

    ```


    Their matrix representation simply corresponds to the $k$-th power $\mathbf{L}^k
    = (\mathbf{DM})^k$ of the Laplacian matrix $\mathbf{L}$.


    The discretization of a higher-order Laplace PDE $\Delta^k f = b$ on a mesh of
    $n$ vertices leads to the $(n \times n)$ linear system


    ```

    $$\mathbf{L}\mathbf{x} = \mathbf{b}, \quad (A.1)$

    ```


    with $\mathbf{x} = (f(v_1), \dots, f(v_n))^T$ and $\mathbf{b} = (b(v_1), \dots,
    b(v_n))^T$. In order to pick the most efficient linear solver for this problem,
    we have to analyze the properties of the system matrix $\mathbf{L}$, or $\mathbf{L}^k$,
    respectively.'
