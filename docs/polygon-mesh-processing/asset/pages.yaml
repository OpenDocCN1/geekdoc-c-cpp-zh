    # 8.4.2 Surface-Bole Filling


    In this section we describe an algorithm for computing a smooth triangulation
    of a hole. The algorithm was proposed by Liepa [Liepa 03] and builds on work of
    Klincec [Klinscec 08] and of Barequet and Sharir [Barequet 95]. It is a basic
    building block of many other repair algorithms.


    The goal is to produce a triangle mesh with a prescribed polygon $\mathbf{p}_0,
    \dots, \mathbf{p}_{n-1}$ that fits into a hole of the mesh to be repaired. The
    new patch should be optimized with respect to some surface quality functional.
    In the context of mesh repair, this quality functional typically measures the
    fairness of the triangulation (e.g., the variation of the triangle normals, or
    the curvature distribution; see also Section 4.3).


    $\phi(i, j, k)$ is a quality functional that is defined on the set of all triangles
    $(\mathbf{p}_i, \mathbf{p}_j, \mathbf{p}_k)$ that could possibly be generated
    during construction of the triangulation, and let $w_{i,j}$ be the optimal total
    quality score that can be achieved in triangulating the subpolygon $\mathbf{p}_i,
    \dots, \mathbf{p}_j$, $0 \le i < j < n$. $w_{i,j}$ can be computed recursively
    as


    ```

    $w_{i,j} = \min_{i<m<j} w_{i,m} + w_{m,j} + \phi(i, m, j)$.

    ```


    In formulation, the triangulation that minimizes the overall quality $w_{n-1}$
    can be computed by a dynamic programming algorithm that caches the intermediate
    values $w_{i,j}$ (see Figure 8.2).


    Liepa suggests a quality functional $\phi$ is designed to take into account the
    dihedral angles between neighboring triangles as well as the triangle''s area.
    It produces


    $\phi(i, j, k) = (\alpha, A)$,


