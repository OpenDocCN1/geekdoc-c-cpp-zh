    # 1.3.2 Subdivision Surfaces


    Subdivision surfaces [Zorin et al. 00] can be considered a generalization of spline
    surfaces, since they are also controlled by a coarse control mesh, but in contrast
    to spline surfaces, they can represent surfaces of arbitrary topology. Subdivision
    surfaces are generated by repeated refinement of control meshes: after each topological
    refinement step, the positions of the (old and new) vertices are adjusted based
