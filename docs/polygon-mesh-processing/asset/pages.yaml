    # 5.5.2 Green-Lagrange Deformation Tensor


    To minimize the distortions of a parameterization, one of the first methods that
    was developed consists of minimizing a matrix norm of the Green-Lagrange deformation
    tensor L [Mailot et al. 93]. This notion comes from mechanics, and it measures
    the deformation of a material. Clearly, if the metric tensor I is equal to the
    identity matrix Id, then an elementary circle is transformed into an elementary
    circle of the same radius (see Section 3.2.2), and the parameterization is said
    to be isometric. As mentioned above, only developable surfaces admit isometric
    parameterization. In the general case, for a given (possibly non-developable)
    surface with a parameterization, the Green-Lagrange deformation tensor is given
    by L = I - Id and measures the "non-isometry" of the parameterization. However,
    minimizing a matrix norm of L is extremely difficult since the function is highly
    nonlinear, with many local minima.


    # 5.5.3 MIPS


    The MIPS (most isometric parameterization of surfaces) method [Hormann and Greiner
    00] was the first mesh parameterization method that computes a natural boundary.
    This method is based on the minimization of the ratio between $\sigma_1$ and $\sigma_2$,
    the two lengths of the axes of the anisotropy ellipse. This corresponds to the
    2-norm of the Jacobian matrix:


    > $E_2(J_T) = ||J_T||_2 ||J_T^{-1}||_2 = \sigma_1/\sigma_2.$


    Since minimizing this energy is a difficult numerical problem, Hormann and Greiner
    have replaced the 2-norm $|\cdot||_F$, i.e., the square root of the sum of squared
    values:


    > $E_{MIPS}(J_T) = ||J_T||_F ||J_T^{-1}||_F = \frac{trace(I_T)}{det(J_T)}.$


    As we see in this equation, cancellation of terms yields a simpler expression
    in the end. The final expression corresponds to the ratio between the trace of
    the first fundamental form and the determinant of the Jacobian matrix. As indicated
    in the original article, this value can also be interpreted as the Dirichlet energy
    per parameter-space area: the term trace($I_T$)'
