    Since in the discrete computational domain $\mathcal{M}$ is an irregular triangle
    mesh instead of a regular 2D or 3D grid, the coarsening operator for building
    the hierarchy is based on mesh decimation techniques (Chapter 7). The shape of
    the resulting triangles is important for numerical robustness, and the edge lengths
    on the different levels should mimic the case of regular grids. Therefore, the
    decimation usually removes edges in the order of increasing lengths, such that
    the hierarchy have uniform edge lengths and triangles of bounded aspect ratio.
    The simplification from one hierarchy level $M_i$ to the next coarser $M_{i+1}$
    should additionally be restricted to remove a maximally independent set of vertices,
    i.e., no two removed vertices $v_j, v_l \in \mathcal{M}_i \setminus \mathcal{M}_{i+1}$
    are connected by an edge $e_{jl} \in \mathcal{M}_i$. In [Aksoylu et al. 05] some
    more efficient alternatives for building the hierarchy.


    Due to the logarithmic nature of hierarchy levels $O(\log n)$, the full multigrid
    and the cascading multigrid method can both be to have $O(n)$ asymptotic complexity,
    as opposed to $O(n^2)$ complexity for non-hierarchical iterative methods. This
    linear complexity allows for highly efficient implementations even for very complex
    systems. Successful applications of multigrid methods in computer graphics are,
    for instance [Ray and Lévy 03, Bolz et al. 06, Georgii and Westermann 06, Kazhdan
    and Hoppe 08, Zhu et al. 10].


    However, the main problem of multigrid solvers is their implementation, specialized
    care be taken for building the hierarchy, for specialized preconditioners. In
    addition, the inter-level convergence by restriction and prolongation operators.
    appropriate numbers of iterations per hierarchy level are chosen either empirically
    or from experience, since they depend not only on the nature of the problem (the
    structure of $\mathbf{A}$) but also on its specific instance (values of $\mathbf{A}$).
    A detailed overview of these techniques is given in [Aksoylu et al. 05].


    For these reasons, sparse direct solvers, as described in the following, are easier
    to use since they do not require parameter tuning'
