  md: '# 1.1. Surface Definition and Properties


    are often the drawbacks of the other. Hence, for each specific geometric problem,
    the more suitable representation should be chosen, which, in turn, requires efficient
    conversion routines between the two representations (see Section 1.5). In Section
    1.6 we present an outlook to approaches that combine both representations in order
    to design algorithms that are both efficient and robust.


    # 1.1 Surface Definition and Properties


    The common definition of a surface in the context of computer graphics applications
    is “an orientable continuous 2D manifold embedded in R³.” Intuitively, this can
    be understood as the boundary surface of a non-degenerate 3D solid where non-degenerate
    means that the solid does not have any infinitely thin parts or features such
    that the surface properly separates the “interior” and “exterior” of the solid
    (see Figure 1.1). A surface with boundaries is one that can be extended into a
    proper manifold surface by filling the holes.


    ![](img/50d65c1816c68c45610a75b087632bd3_14_0.png)


    **Figure 1.1.** An orientable continuous 2-manifold describes the surface of a
    non-degenerate solid. A degenerate/non-manifold vertex (top left), which is fixed
    in (top right). A solid with a degenerate/non-manifold edge (bottom left), fixed
    in (bottom right).'
  merge: -1
