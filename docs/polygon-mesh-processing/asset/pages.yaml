    \ or empty. In the following we discuss different solutions for assigning $(u,\
    \ v)$ coordinates to the vertices.\n\n# 5.3 Barycentric Mapping\n\nBarycentric\
    \ map is one of the most widely used methods for constructing a parameterization\
    \ of a triangulated surface. This method is based on Tutte’s barycentric mapping\
    \ theorem [Tutte 60], from graph theory, which states:\n\n> A triangulated surface\
    \ homeomorphic to a disk, if the $(u, v)$ coordinates at the boundary vertices\
    \ lie on a convex polygon, and if the coordinates of the internal vertices are\
    \ a convex combination of their neighbors, then the $(u, v)$ coordinates form\
    \ a valid parameterization (without self-intersections).\n\nSupposing that the\
    \ vertices are ordered so that indices $\\{1, \\dots, n_{int}\\}$ correspond to\
    \ interior vertices and indices $\\{n_{int}+1, \\dots, n\\}$ correspond to boundary,\
    \ the second condition of the theorem can be written as\n\n```\n\\forall i \\\
