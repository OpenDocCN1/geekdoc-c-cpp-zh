    \ 4), and for surface deformation we can employ the techniques discussed in the\
    \ previous sections. The missing component is a suitable representation for the\
    \ geometric detail $D = S \\oplus \\mathcal{B}$, which we describe.\n\n# 9.3.1\
    \ Displacement Vectors\n\nThe straightforward representation for multi-scale details\
    \ is a displacement of the base surface $\\mathcal{B}$. The detail information\
    \ is a vector-valued displacement function $h: \\mathcal{B} \rightarrow \\mathbb{R}^3$\
    \ that associates a displacement vector $h(\\mathbf{b})$ to each point $\\mathbf{b}$\
    \ on the base surface. In most cases $S$ and $\\mathcal{B}$ have the same connectivity,\
    \ leading to per-vertex displacement vectors $h_i = (\\mathbf{p}_i - \\mathbf{b}_i)$\
    \ [Zorin et al. 97, Kobbelt et al. 98b, Guskov et al. 99] such that\n\n```\n$p_i\
    \ = \\mathbf{b}_i + \\mathbf{h}_i, \\quad \\mathbf{h}_i \\in \\mathbb{R}^3$,\n\
    ```\n\nwhere $\\mathbf{b}_i \\in \\mathcal{B}$ is the vertex corresponding to\
    \ $\\mathbf{p}_i \\in S$. The vectors $\\mathbf{h}_i$ have to be encoded in *local\
    \ frames* with regard to $\\mathcal{B}$ [Forsey and Bartels 88, Bisby and Bartels\
    \ 95], determined by the normal vector $\\mathbf{n}_i$ and the tangent vectors\
    \ $\\mathbf{t}_{i,1}$ and $\\mathbf{t}_{i,2}$ of the base surface $\\mathcal{B}$\
    \ at point $\\mathbf{b}_i$,\n\n```\n$$\\mathbf{h}_i = \\alpha_i \\mathbf{n}_i\
    \ + \\beta_i \\mathbf{t}_{i,1} + \\gamma_i \\mathbf{t}_{i,2}.$ (9.8)\n```\n\n\
    When the base surface $\\mathcal{B}$ is deformed to $B'$, the displacement vectors\
    \ rotate according to the rotations of the base surface's local frames, which\
    \ then leads to a plausible detail reconstruction for $\\mathcal{S}'$ (see Figure\
    \ 9.8):\n\n```\n$$\\mathbf{p}'_i = \\mathbf{b}'_i + \\alpha_i \\mathbf{n}'_i +\
