  md: '# 9.7 Limitations of Linear Methods


    surfaces consisting of disconnected patches can be handled by this technique,
    whereas all surface-based techniques would fail in this situation.


    For the two space deformation approaches described in Sections 9.5 and 9.6, the
    deformed surface S'' depends largely on the displacement constraints **d(p_i)
    = d**. As a consequence, nonlinear effects such as local detail rotation cannot
    be achieved, similar to the linear surface-based methods discussed in Sections
    9.2-9.4. Although space deformations can be enhanced by multi-scale techniques
    as well (see, e.g., [Marinov et al. 07]), they generally suffer from the same
    limitations as surface-based methods when it comes to large-scale deformation,
    as discussed next.


    The methods we described so far provide high quality results and can be computed
    robustly and efficiently. However, it is equally important to understand their
    limitations as is to understand their strengths. In this section we therefore
    compare some of the discussed methods and point out their limitations. To this
    end, the goal is *not* to show the best-possible results each method can produce
    (those can be found in the original papers) but rather show under which circumstances
    each individual method works. Figure 9.16 shows deformation examples that were
    particularly chosen to identify the respective limitations of the different techniques.
    For comparison we show the results of the nonlinear surface deformation PriMo
    [Botsch et al. 06a], which does not suffer from linearization artifacts.


    +   * The shell-based deformation (Section 9.2), in combination with a multi-scale
    technique (Section 9.3), works fine for pure translations and yields fair and
    detail-preserving deformations. However, due to the linearization of the shell
    energy, this approach fails for large rotations.


    +   * Gradient-based editing (Section 9.4.1) updates the face gradients using
    the gradient of the handle transformation (its rotation and scale/shear components)
    and therefore works very well for rotational deformation. However, the explicit
    propagation of local rotations is translation insensitive, such that the plane
    example is smoother than not detail preserving.


    +   * Laplacian surface editing (Section 9.4.2) implicitly optimizes for local
    rotations and hence works comparatively well for translations and rotations. However,
    the required linearization of rotations yields artifacts for large deformations.'
