  md: 'Both operators that we discussed so are not unique. In either case there is
    some optimization involved to find the best local triangulation or Conceptually
    this is not well designed since it mixes the global optimization (which candidate
    is best according to the sorting criteria for the heap) with local optimization.


    **Halfedge collapse.** A possible way out is the so-called halfedge collapse operation:
    for an ordered pair (p, q) of adjacent vertices, p is moved to q’s position (Kobbelt
    et al. 98a) (see Figure 7.3 (bottom)). This can be considered as a special case
    of edge collapse where the new vertex r coincides with q. On the other hand, it
    can also be considered a special case of vertex deletion where the triangulation
    of the k-sided hole is generated by connecting all neighboring vertices with q.


    The halfedge collapse has no degrees of freedom. Notice that p → q and q → p are
    treated as independent removal operations that have both been evaluated and stored
    in the candidate head. Since halfedge collapsing is a special case of the other
    two removal operations, one might expect an inferior quality of the decimated
    mesh. Sub-samples the set of original vertices while the full edge collapse acts
    as a low-pass filter where vertex positions are computed, e.g., by averaging vertex
    positions. However, in practice this effect becomes noticeable for extremely strong
    decimation where the location of individual vertices really matters.


    The big advantage of halfedge collapsing is that for moderate decimation, the
    global optimization (i.e., candidate selection based on user-specified criteria)
    is completely separated from the decimation operator that makes the design of
    mesh decimation schemes more modular.


    Note that each edge collapse or halfedge collapse can lead to a topologically
    invalid configuration. Collapsing an edge (p, q) is a valid operation if and only
    the following two criteria hold [Hoppe et al. 93]:


    +   * If both p and q are boundary vertices, then the edge (p, q) has to be a
    boundary edge.


    +   * For all vertices r incident to both p and q there has to be a triangle (p,
    q, r). In other words, the intersection of the one-rings of p and q consists of
    vertices opposite the edge (p, q) only.


    Another formulation of these criteria is the so-called link condition [Dey et
    al. 99, Edelbrunner 06], which states under conditions an edge collapse preserves
    the mesh topology. Examples of illegal edge collapses are shown in Figure 7.4.'
