  md: '# 4.2. Diffusion Flow


    cesses can be described by diffusion flow (e.g., heat diffusion and Brownian motion).
    Diffusion flow is modeled by the diffusion equation


    ```

    $$\frac{\partial \mathbf{f}(x,t)}{\partial t} = \lambda \Delta \mathbf{f}(x,t).$$

    ```


    This equation is a second-order linear partial differential equation (PDE), which
    states that the function $f$ changes over time by a scalar coefficient $\lambda$
    times its Laplacian $\Delta f$. As an example, if $\mathbf{f}(x,t)$ denotes the
    temperature at time $t$ of a material point $\mathbf{x}$, the equation describes
    the temporal heat diffusion in an object, and is therefore called the heat equation.


    We employ the diffusion to smooth an arbitrary function $f:\mathcal S \to R$ on
    a manifold surface S, simply replacing the regular Laplace operator by the manifold
    Laplace-Beltrami. Since Equation (4.5) is a continuous time-dependent PDE, we
    discretize it in both space and in time.


    For the spatial discretization we regain the function $f$ by its sample values
    at the mesh vertices $(f(v_i,t),...,f(v_n,t))^T$ and compute the discrete Laplace-Beltrami
    using either the uniform or cotangent- discretizations (Section 3.3). This yields
    an equation for the evolution of the value of each vertex,


    ```

    $$\frac{\partial f(v_i,t)}{\partial t} = \lambda \Delta f(v_i,t), \quad i=1,...,n.$

    ```


    which can be written in matrix notation as $\mathbf{f}(t)/\partial t = \lambda
    \mathbf{f}(t)$ using the Laplace matrix discussed in Section A.1.


    For the temporal discretization we divide the time axis into intervals of step
    $h$, yielding time steps $\{t,t+h,t+2h,...\}$. Approximating the time derivative
    by finite differences


    ```

    $$\frac{\partial \mathbf{f}(t)}{\partial t} \approx \frac{\mathbf{f}(t+h)-\mathbf{f}(t)}{h}$$

    ```


    and solving for $\mathbf{f}(t+h)$ yields the explicit Euler integration:


    ```

    $$\mathbfmathbf{f}(t+h) = \mathbf{f}(t) + h\frac{\partial \mathbf{f}(t)}{\partial
    t} = \mathbf{f}(t) + h\lambda \mathbf{f}(t).$$

    ```


    Note that for numerically robust integration a sufficiently small time step h
    has to be chosen. In order to guarantee unconditional robustness for large time
    steps, implicit time integration should be used [Desbrunun et al. 99]. Evaluating
    the Laplace $\Delta f$ at the next time step $(t+h)$ instead of the current time
    $t$ leads to the implicit Euler integration:


    ```

    $$\mathbf{f}(t+h) = \mathbf{f}(t) + h\lambda \mathbf{Lf}(t+h) \quad \quad \mathbf{(Id}-h\lambda
    \mathbf{L})\mathbf{f}(t+h) = \mathbf{f}(t).$$

    ```'
