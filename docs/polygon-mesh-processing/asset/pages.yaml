  md: '# 1. Surface Representations


    ![](img/50d65c1816c68c45610a75b087632bd3_15_0.png)


    **Figure 1.2.** A manifold curve. While the points f(a), f(b), and f(c) are all
    in close spatial proximity, only f(a) and f(b) are geodesic neighbors since their
    pre-images $a$ and $b$ are neighbors. In red: the pre-image of a sufficiently
    small $\delta$ neighborhood around f(a) in $\mathbb{R}^2$ lies in an $\epsilon$
    neighborhood of $a$ in $\mathbb{R}$.


    Since most applications the raw information about the input surface is obtained
    by discrete sampling (i.e., by *evaluation* if there already exists a digital
    representation, or by *probing* if the input comes from a real object), the first
    step in generating a mathematical surface representation is to establish *continuity*.
    This requires building a consistent neighborhood relation between the samples.
    In this context, *consistency* refers to the existence of a manifold surface from
    which the samples are drawn.


    While this so-called *geodesic* neighborhood relation (in contrast to a *spatial*
    neighborhood relation), it is difficult to extract from parametric representations
    in implicit representations, out if two points on the surface are in geodesic
    proximity, if the pre-images in $\Omega$ are close to each other (see Figure 1.2).
    From this observation we can derive an alternative characterization of *local
    manifoldness*: locally at point **p**, if for every other point **q** within a
    sufficiently small sphere of radius $\delta$ around **p**, the corresponding pre-image
    is contained in a circle of some radius $\epsilon = O(\delta)$ around the pre-image
    of **p**. A more intuitive way to express this condition is to say that the surface
    patch that lies within a sufficiently small $\delta$-sphere around **p** is topologically
    equivalent (homeomorphic) to a disk. Since this second definition does not require
    a parameterization, it applies to implicit representations as well.


    When generating a continuous surface from a set of discrete samples, we can either
    require this surface to *interpolate* the samples or to *approximate* them subject
    to a certain prescribed tolerance. The latter case is considered more relevant
    in practical applications, since samples are usually affected by position noise
    and the surface in between the samples is an approximation'
