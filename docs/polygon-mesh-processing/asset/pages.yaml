  md: '# 9.8. Summary and Further Reading


    Eigensatz and Pauly introduce a surface deformation method that allows directly
    prescribing positional, metric, and curvature constraints anywhere-on the surface.
    A global nonlinear optimization solves for a deformed surface that satisfies these
    user constraints as best as possible, minimizing the overall metric and curvature
    distortion [Eigensatz and Pauly 09].


    Nonlinear space deformation. Sumner et al. compute detail-preserving space deformations
    by formulating an energy functional that explicitly normalizes deviation from
    local rigidity by optimizing the local deformation gradients to rotations [Sumner
    et al. 07]. In addition to static geometries, their method can also be applied
    to hand-crafted animations and precomputed simulations.


    Botch et al. extend the PriMo framework [Botsch et al. 06a] to deforms of solid
    objects [Botsch et al. 07]. The input model is voxelized in an adaptive manner,
    and the resulting hexahedral cells are kept rigid under deformations to ensure
    numerical robustness. The deformation is governed by a nonlinear elastic energy
    coupling neighboring rigid cells.


    Another class of approaches uses divergence-free vector fields to deform shapes
    [Angelidis et al. 06, von Funck et al. 06]. The advantage of those techniques
    is that by construction they yield volume-preserving and intersection-free deformations.
    As a drawback, it is harder to construct vector fields that exactly satisfy user-defined
    deformation constraints.'
