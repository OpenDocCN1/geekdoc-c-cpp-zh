    # 7. Simplification & Approximation


    here is to design suitable data structures that avoid random access to parts of
    the mesh during the simplification.


    Lindstrom presented an approach based on vertex clustering combined with quadric
    metrics for computing the cluster representatives [Lindstrom 00] (see Section
    7.1). This algorithm requires only limited connectivity and processes meshes stored
    as a triangle soup, where each triangle is represented as a triplet of vertex
    coordinates. Using a single pass over the mesh data, an in-core representation
    of the simplified mesh is build incrementally. A dynamic hash table is used for
    fast localization, and quadrics with a cluster are aggregated until all triangles
    have been processed. The final simplified mesh is then produced by computing a
    representative of the per-cluster quadrics and the corresponding connectivity
    information as described above.


    Lindstrom and Silva improved on this approach by removing the requirement for
    the output to fit into main memory using a multi-pass approach [Lindstrom and
    Silva 01]. Their method requires only a constant amount of memory that is independent
    of the size of the input and output data. This improvement is achieved by a careful
    (slower, but cheaper) use of disk space, which typically leads to performance
    overheads between a factor of two and five, as compared to [Lindstrom 00]. To
    avoid the list of clusters and associated quadrics in main memory, the required
    information from each triangle to compute the quadrics are stored to disk. This
    file is then sorted according the grid locations using an external sort algorithm.
    Finally, quadrics and final vertex positions are computed in a single linear sweep
    over the sorted file. The authors also apply a scheme similar to the one proposed
    in [Garland and Heckbert 97] to better preserve boundary edges.


    Wu and Kobbett presented a streaming approach to out-of-core mesh decimation with
    a quadric error metric [Wu and Kobbett 04]. Their method uses a fixed-size working
    set and is independent of the input and output complexity. In contrast to the
    previous two approaches for out-of-core decimation, their method allows prescribing
    the size of the output mesh exactly and supports explicit control over the topology
    during the simplification. The basic idea is to sequentially stream the mesh and
    incrementally apply decimation operations on an active working set that is kept
    in memory. Assuming that the geometry stream is approximately pre-sorted, e.g.,
    by one coordinate, the spatial coherence guarantees that the working set can be
    as small as possible (see Figure 7.7). For decimation they apply randomized multiple-choice
    optimization, which has been shown to produce results of similar quality as those
