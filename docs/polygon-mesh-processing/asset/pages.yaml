  md: '# 2.1. Face-Based Data Structures


    Because it is simple and efficient in storage, this representation is used in
    many file formats such as OFF, OBJ, and VRML. Similarly, it is relevant for a
    class of efficient rendering algorithms that assume static data (OpenGL vertex
    arrays; see |Shreiner and Khronos OpenGL AR Working Group 09|).


    However, without additional connectivity information, this data structure requires
    expensive searches to recover the local adjacency information of a vertex and
    hence is not enough for most algorithms.


    This is a minimal set of operations frequently used by most algorithms:


    +   - Access to individual vertices, edges, and faces. This includes the enumeration
    of all elements in unspecified order.


    +   - Oriented traversal of the edges of a face, which refers to finding the next
    edge (or previous edge) in a face. With additional access to vertices, the rendering
    of faces is enabled.


    +   - Access to the incident faces of an edge. Depending on the orientation, this
    is either the left or right face in the manifold face. This enables access to
    neighboring faces.


    +   - Given an edge, access to its two endpoints


    +   - Given a vertex, at least one incident face or edge must be accessible. For
    manifold meshes all other elements in the so-called one-ring neighborhood of a
    vertex can be enumerated (i.e., all incident faces or edges and neighboring vertices).


    These operations, which enable both local and global traversal of the mesh, relate
    vertices, edges, and faces of the mesh by connectivity information (and orientation).


    We review several data structures devised for fast traversal of surface meshes.


    | Vertex | |

    |---||

    | Point position |

    | FaceRef face |

    | Face | |

    | VertexRef vertex[3] |

    | FaceRef neighbor[3] |


    ![](img/50d65c1816c68c45610a75b087632bd3_34_0.png)


    Figure 2.2. Connectivity information stored in a face-based data structure.'
