  md: '# 3. Differential Geometry


    trajectory of a point is a curve parameterized by time $(u = t)$ and the tangent
    vector $\mathbf{x}''(t)$ corresponds to the velocity vector at time $t$. We assume
    the parameterization to be *regular* such that $\mathbf{x}''(u) \neq 0$ for all
    $u \in [a, b]$. A normal vector $\mathbf{n}(u)$ can be computed as $\mathbf{n}(u)
    = \mathbf{x}''(u)^\perp\|\mathbf{x}''(u)\|^{-1}$, where $^\perp$ denotes rotation
    by $90^\circ$.


    Since a curve is defined as the image of a function $x$, the same curve can be
    obtained with a different parameterization. For example, $\mathbf{x}_1(u)=(u,u)^T$
    and $\mathbf{x}_2(u)=(u^2,u^2)^T$ describe the same curve for $u \in [0, 1]$,
    the straight line segment connecting the points $(0,0)^T$ and $(1,1)^T$. However,
    their parameterization is different and thus $\mathbf{x}_1(u) \neq \mathbf{x}_2(u)$
    for a fixed $u$. As this illustrates, we can change the parameterization without
    changing the shape of the curve. Using the reparameterization $v=u^2$, we obtain
    $x_1(v) = x_2(u)$. Differential geometry of curves is concerned with properties
    of a curve that are independent of the specific parameterization, such as length
    or curvature.


    # 3.1.1 Arc Length


    The length $l(c,d)$ of any curve defined on an interval $[c, d] \subseteq [a,b]$
    can be computed as the integral of the tangent vector, i.e., $l(c,d) = \int_c^d
    \|\mathbf{x}''(u)\|du$. The tangent vector $\mathbf{x}''$ thus encodes the *metric*
    of the curve. Parametric curves allow for a unique parameterization that can be
    defined as a length-preserving mapping, i.e., an *isometry*, between the interval
    and the curve using the reparameterization


    > $s = s(u) = \int_a^u \|\mathbf{x}''(t)\|dt.$


    This *arc length parameterization* is independent of the specific representation
    of the curve and maps the parameter interval $[a, b]$ to $[0, L]$, where $L =
    l(a,b) = \int_a^b \|\mathbf{x}''(u)\|du$ is the total length of the curve. The
    name stems from the important property that for any point $\mathbf{x}(s)$ on the
    curve, the length of the curve from $\mathbf{x}(0)$ to $\mathbf{x}(s)$ is equal
    to $s$. While any regular curve can be parameterized with respect to arc length,
    we will see in Chapter 5 that such a canonical parameterization cannot in general
    be for surfaces.


    # 3.1.2 Curvature


    Assuming a regular curve is parameterized with respect to arc length, we can define
    the curvature at a point $\mathbf{x}(s)$ as


    ```

    $\kappa(s) := ||\mathbf{x}''''(s)||$

    ```'
