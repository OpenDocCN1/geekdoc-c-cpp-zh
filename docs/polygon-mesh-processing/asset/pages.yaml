  md: '# 9.8 Summary and Further Reading


    In this chapter we introduced several methods of deforming a given surface and
    showed that accurate and high-quality deformations can be obtained by minimizing
    suitable energies, which in the end involve solving a linear system for the deformed
    vertex positions. While described in the appendix, this can be computed robustly
    and interactively. The interested reader can find more details on linear surface
    deformation methods in [Botch and Sorkine 08].


    However, the accurate physics equations governing the surface deformation process
    are inherently nonlinear, which requires simplifying or linearizing the involved
    energies at some point. We have seen the consequence of this in Section 9.7: all
    linear techniques fail under certain circumstances. The shell-based approach typically
    works well for translations, but has problems with large rotations, which is the
    other way around methods based on differential coordinates. From these examples
    one can derive the following guidelines for picking the “right” deformation technique
    for a specific scenario:


    +   - In technical, CAD-like engineering applications, the required shape deformations
    are typically rather small, since in many cases prototyping is only slightly adjusted,
    but they have high requirements for surface fairness, boundary continuity, and
    precise control thereof. For such problems a linearized shell model is typically
    best suited.


    +   - In contrast, applications like character animation mostly involve (possibly
    large) rotations of limbs around bends and joints. Here, methods based on differential
    coordinates are clearly the better choice. Moreover, the required rotations might
    be available from, e.g., a sketching interface [Zhou et al. 05, Nealen et al.
    05] or a motion capture system [Shi et al. 06].


    +   - Applications that require both large-scale translations and rotations are
    problematic for all linear approaches. In this case one can employ a more complex
    nonlinear technique or split large deformations into sequence of smaller ones.
    While the nonlinear techniques are computationally and implementation-wise more
    involved, splitting off deformations or providing a denser set of constraints
    complicates the user interaction.


    Thanks to the rapid increase in both computational power and available memory
    of today’s workstations, nonlinear deformation methods have become more and more
    tractable, which in the last few years has already led to a first set of nonlinear
    yet interactive surface deformation approaches.'
