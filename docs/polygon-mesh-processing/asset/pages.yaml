    # 9.5.2 Cage-Based Freeform Deformation


    Cage-based techniques can be considered a generalization of the lattice-based
    freeform deformation. Instead of a regular control lattice, a so-called control
    cage is used to deform the object. This cage typically is a coarse, arbitrary
    triangle mesh enclosing the object to be modified, which allows the cage to better
    match the shape and structure of the embedded object than regular control lattices
    do


    The vertices $\mathbf{p}_i$ of the original mesh $\mathcal{S}$ can be represented
    as linear combinations of the cage''s control vertices $\mathbf{c}_l$ by


    ```

    $\mathbf{p}_i = \sum_{l=1}^{n} c_l \varphi_l(\mathbf{p}_i)$

    ```


    the weights $\varphi_l(\mathbf{p}_i)$ are generalized barycentric coordinates*
    [Floater et al. 05, Ju et al. 05, Ju et al. 07, Lipman et al. 08]. The coordinate
    functions $\varphi_l$ in (9.14) therefore correspond to the spline basis functions
    $N_i$ in Equation (9.12).


    Once the per-vertex weights $\varphi_l(\mathbf{p}_i)$ have been pre-computed,
    the object can be deformed by manipulating the cage vertices $\mathbf{c}_l \mapsto
    \mathbf{c}_l + \delta\mathbf{c}_l$ and computing the per-vertex displacement as


    ```

    $\mathbf{d}(\mathbf{p}_i) = \sum_{l=1}^{n} \delta c_l \varphi_l(\mathbf{p}_i)$

    ```


    Finding control vertex displacements $\delta\mathbf{c}_l$ resulting in a deformation
    that satisfies user-defined constraints $\mathbf{d}(\mathbf{p}_i) = \mathbf{d}_i$
    works equivalently to Equation (9.13), with $N''_i(u_i)$ replaced by $\varphi_i(\mathbf{p}_i)$.
    While being more flexible


