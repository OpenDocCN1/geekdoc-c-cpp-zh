    \ \\mathbf{n}_b + \\gamma \\mathbf{n}_c\\}$.$\n```\n\nUsing this continuous normal\
    \ field $\\mathbf{n}(\\mathbf{b})$ on the surface $\\mathcal{B}$, a local Newton\
    \ iteration can find the barycentric coordinates $(\\alpha, \beta, \\gamma)$ of\
    \ the base point $\\mathbf{b}_i$ as the root of the function\n\n```\n$$\\f(\\\
    alpha, \\beta, \\gamma) = (\\mathbf{p}_i - \\mathbf{b}_i) \\times \\mathbf{n}_i$.$\n\
    ```"
