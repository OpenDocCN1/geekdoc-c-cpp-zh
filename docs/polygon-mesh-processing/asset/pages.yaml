  md: '# 1.2. Approximation Power


    ![](img/50d65c1816c68c45610a75b087632bd3_16_0.png)


    In the next section we will consider the issue of approximation in more detail.


    Except for a well-defined set of sharp feature-curves and -corners, a surface
    should be smooth in general. Mathematically this is measured by the number k of
    continuous derivatives that the functions f or F have. Notice that this analytical
    definition of $C^k$ smoothness coincides with the intuitive geometrical ordering
    of smoothness only if the partial derivatives of f or the gradient of F, respectively,
    do not vanish locally (regularity).


    An stricter requirement for surfaces is fairness, where not only the continuity
    of the derivatives but also their magnitude and variation are considered. There
    is no general formal definition for the aesthetic concept of fairness, but a surface
    is usually considered fair if, e.g., the curvature or its variation is globally
    minimized (see Figure 1.3).


    In Chapter 3 we will explain how the notion of curvature can be generalized to
    polygon meshes such as smoothness and fairness to meshes as well (see Chapter
    4).


    # 1.2 Approximation Power


    The exact mathematical modeling of a real object or its boundary is usually intractable.
    Hence, a digital surface representation can only be an approximation in general.
    As mentioned in the introduction, in order to simplify the approximation tasks,
    the domain of the representation is split into small segments, and for each segment
    a function (a patch) is defined that locally approximates the part of the input
    that belongs to the segment.'
  merge: -1
  pgno: 16
