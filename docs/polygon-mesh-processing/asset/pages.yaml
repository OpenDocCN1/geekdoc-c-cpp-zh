    9. Deformation


    Deformation transfer. [Botsch et al. 0c] use [Sumner and Popović 04] to transfer
    the deformation transfer approach of $B \mapsto B''$ onto the detailed surface
    $\mathcal{S}$, resulting in a multi-scale deformation $S''$. This method yields
    results similar in quality to displacement volumes (see Figures 9.5 and 9.10),
    but it only requires a sparse linear Poisson system. Both in terms of results
    and computational efficiency, this method can be considered as lying in between
    displacement vectors and displacement volumes.


    # 9.4 Differential Coordinates


    While multi-scale deformation is an effective tool for enhancing shape deformations
    by fine-scale detail preservation, the generation of such a hierarchy can become
    quite geometrically or topologically complex models. To avoid the explicit multi-scale
    decomposition, another class of methods modifies surface properties instead of
    spatial coordinates and reconstructs a deformed surface having the desired differential
    coordinates. We first describe two typical representations—gradients and Laplacians—and
    how to derive the deformed surface from the manipulated differential coordinates.
    We then explain how to compute the local transformations of differential coordinates
    based on the user''s deformation constraints.


