    \nMultigrid methods overcome the problem of slow convergence by building a fine-to-coarse\
    \ hierarchy of meshes\n\n$\\mathcal{M} = \\mathcal{M}_0 \\supset \\mathcal{M}_1\
    \ \\supset \\dots \\supset \\mathcal{M}_k$\n\nof the computational domain $\\\
    mathcal{M}$ and solving the linear system hierarchy from coarse to fine [Hacksbusch,\
