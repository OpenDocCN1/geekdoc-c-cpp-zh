  md: '# 9. Deformation


    ![](img/50d65c1816c68c45610a75b087632bd3_169_0.png)


    **Figure 9.5.** From left to right: The right strip $\mathcal H$ of the bumpy
    plane is lifted. The intuitive local rotations of geometric details cannot be
