    The manifold harmonics provide a natural generalization of the Fourier transform
    to continuous and discrete 2-manifold surfaces of arbitrary geometry and topology.
    They allow for ideal low-pass filtering using exact cut-off frequencies $\omega_{max}$
    and also for flexible convolution filtering. Unfortunately, this approach is too
    expensive for many applications, since the required eigenvector decomposition
    of the potentially large Laplace matrix **L** is numerically difficult to compute
    [Vallet and Lévy 08].


    A cheaper and more practical approach is diffusion flow, discussed in the next
    section. It corresponds to a damping of high frequencies by multiplying them with
    a Gaussian kernel instead of strictly cutting off all frequencies a threshold
    $\omega_{max}$. Since the inverse transform of a Gaussian in the frequency domain
    yields a Gaussian in the spatial domain, the Fourier transform is not necessary
    in this approach and the smoothing can be computed directly in the spatial domain,
    i.e., on the triangle mesh [Taubin 95].


