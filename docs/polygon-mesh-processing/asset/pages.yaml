    \ alternative, the scalar field can also be computed as a harmonic field on the\
    \ surface, i.e., $\\Delta s = 0$, with Dirichlet constraints 1 and 0 for the\n\
    \n![](img/50d65c1816c68c45610a75b087632bd3_164_0.png)\n\n**Figure 9.2.** After\
