    # 5.1 General Goals


    Computing a parameterization of an object means attaching a coordinate system
    to it. Such a coordinate system has many possible applications. One of the main
    applications of mesh parameterization is texture mapping. Figure 5.1 shows an
    example of a parameterization implemented in the Blender¹ open-source model. The
    parameterization is used to put the surface into one-to-one correspondence with
    an image, stored in the 2D domain. It is possible to map an existing image onto
    the 3D model, or to define the parameter space image by directly painting the
    model.


    With the advent of programmable graphics hardware, texture mapping can be used
    to map more complex attributes onto surfaces. The example shown in Figure 5.2
    illustrates a technique referred to as normal mapping (see, e.g., [Sander et al.
    01]). The initial object is replaced with a significantly decimated version (Chapter
    7). Its visual appearance is nevertheless presented accurately by encoding the
    original, high-resolution normal vectors in a texture and using a fragment shader
    to compute the lighting while preserving its overall visual appearance. Since
    details can be stored more compactly in a texture image than by using a large
    number of triangles, normal-mapping is an important technique for real-time rendering.


    Another class of applications concerns re-meshing algorithms (see Chapter 6).
    Finally, the coordinate system defined by the parameterization facilitates converting
    from a mesh representation into an alternative one. This is of paramount importance
    for modeling and simulation tasks, which use representations that are completely
    different from the dense triangulated meshes constructed by 3D scanners and their
    companion reconstruction


    > ¹http://www.blender.org/'
