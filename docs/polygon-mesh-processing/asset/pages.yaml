    # 9.5 Freeform Deformation


    All deformation approaches described so far are *surface-based*: they compute
    a smooth deformation field *on* the surface $\mathcal{S}$ by minimizing some quadratic
    energy, which amounts to solving a linear system corresponding to the respective
    Euler-Lagrange equation.


    An apparent drawback of such methods is that their computational effort and numerical
    robustness are strongly related to the complexity and quality of the surface tessellation.
    In the presence of degenerate triangles, the discrete cotangent weights (3.11)
    for the Laplacian operator are not well defined and thus the involved linear systems
    become singular. Similarly, topological artifacts like gaps or non-manifold configurations
    lead to problems, where local vertex neighborhoods become inconsistent. In such
    cases quite some effort is spent to be able to compute smooth deformations, like
    eliminating degenerate triangles (Chapter 8) or even remeshing the complete surface
    (Chapter 6). But even if the mesh quality is sufficiently high, extremely complex
    meshes will result in linear systems that cannot be solved due to their size.


    ![](img/50d65c1816c68c45610a75b087632bd3_180_0.png)


    **Figure 9.12.** Space deformations warp the embedding space around an object
    and thus implicitly deform the object. (Image taken from [Botsch et al. 06b].
    ©2006 ACM, Inc. Included here by permission).'
