  md: '![](img/50d65c1816c68c45610a75b087632bd3_127_0.png)


    minimum requirements, e.g., minimum aspect ratio of triangles. Continuous criteria
    measure the fairness of the mesh with respect to the approximation error or in
    some other sense such as, e.g., isotropic triangles are better than anisotropic
    ones, and small normal jumps between neighboring triangles are better than large
    normal jumps.


    Every time a removal is executed, the surface geometry in the vicinity changes.
    Therefore, the quality criteria must be re-evaluated. During the iterative procedure,
    this re-evaluation is computationally most expensive part. To preserve the order
    of the candidates, they are usually kept in a modifiable heap data structure with
    the best removal operation on top. Whenever removal candidates have to be re-evaluated,
    they are deleted from the heap and re-inserted with their new value. By this procedure,
    the complexity of the update step increases only about $O(log n)$ for large meshes
    if the criteria evaluation itself has constant complexity.


    # 7.2.1 Topological Operations


    There are several different choices for the basic removal operation. The major
    design goal is to keep the operation as simple as possible. In particular, this
    means that we do not want to remove large parts of the original mesh at once but
    rather want to remove a single vertex at a time. Strong decimation is then achieved
    by applying many simple decimation steps instead of a few complicated ones. If
    mesh consistency, i.e., topological correctness,'
