    # 2.4 Directed-Edge Data Structure


    The directed-edge data structure [Campagna et al. 98] is a memory-efficient variant
    of the halfedge data structure that is particularly designed for triangle meshes.
    It is based on indices that reference each element in the mesh (vertex, face,
    or halfedge). The indexing flows contains certain rules that implicitly encode
    some of the connectivity information of the triangle mesh. Instead of pairing
    opposite halfedges (as proposed in the previous section), this data structure
    groups the three halfedges belonging to a common triangle.


    To be more precise, let f be the index of the face. Then, the indices of its three
    halfedges are given


    ```

    halfedge(f, i) = 3f + i, \quad i = 0, 1, 2.

    ```


    Now let h be the index of a halfedge. Then, the index of its adjacent face and
    its index within the face are simply given


    ```

    face(h) = h/3, \quad face_index(h) = h mod 3.

    ```


    The index of h’s next halfedge can be computed as (h + 1) mod 3. The remaining
    parts of the connectivity have to be stored explicitly: each vertex stores its
    position and the index to an outgoing halfedge; each halfedge stores the index
    of its opposite halfedge and the index of its vertex. This leads to a memory consumption
    of only 16 bytes/vertex + 8 bytes/halfedge = 64 bytes/vertex, which is just as
    much as the simple face-based structure of Section 2.1, although the directed
    edges structure offers much more functionality.


    Directed edges can represent all triangle meshes that can be represented by a
    general halfedge data structure. Note, however, the boundaries are handled by
    special (e.g., negative) indices indicating that the opposite halfedge is invalid.
    Traversing boundary loops is more expensive, since there is no atomic operation
    to enumerate the next boundary edge. For a general halfedge structure, this can
    be efficiently accessed by the next halfedge along the boundary.


    Although we have described the directed-edge data structure for pure triangle
    meshes, an adaptation to pure quad meshes is straightforward. However, it is not
    possible to mix triangles and quads, or to represent'
