  md: '# 1. Surface Representations


    Since our surface representations are supposed to support efficient processing,
    a natural choice is to restrict functions to the class of *polynomials* because
    those can be evaluated by elementary arithmetic operations. Another justification
    for the restriction to polynomials is the well-known *Weierstrass theorem* that
    guarantees each smooth function can be approximated by a polynomial up to any
    desired precision [Ross 80].


    From calculus we know that a $C^\infty$ function $g$ with bounded derivatives
    can be approximated over an interval of length $h$ by a polynomial of degree $p$
    such that the approximation error behaves like $O(h^{p+1})$ (e.g., Taylor''s theorem
    or generalized mean value theorem) [Rudin 02]. As a consequence there are, two
    possibilities to improve the accuracy of an approximation with piecewise polynomials
    ($p$-refinement) and we can either raise the degree of the polynomial segments
    or use more segments for the approximation ($h$-refinement).


    In geometry processing, h-refinement is usually preferred over p-refinement, since
    for a discretely sampled input surface, we cannot make reasonable assumptions
    about the boundedness of higher-order derivatives. Moreover, for piecewise polynomials
    with higher degree, the $C^k$ smoothness conditions between segments are sometimes
    quite difficult to satisfy. Finally, with today''s computer architectures, processing
    a large number of simple objects is much more efficient than processing a smaller
    number of complex ones. This is why extremal choice of $C^0$ piecewise linear
    surface representations, i.e., *polygonal meshes*, have become the widely established
    standard in geometry processing.


    While, for parametric surfaces, the $O(h^{p+1})$ approximation error estimate
    follows from the mean value theorem in a straightforward manner, a more careful
    consideration is necessary for implicit representations. The generalized mean
    value theorem states that if a sufficiently smooth function $g$ over an interval
    $[a, a+h]$ is interpolated at the abscissae $t_0, \dots, t_p$ by a polynomial
    $f$ of degree $p$, then the approximation error is bounded


    ```

    $|f(t) - g(t)| \leq \frac{1}{(p+1)!} \max f^{(p+1)} \prod_{i=0}^{p} (t_i - t)
    = O(h^{p+1})$

    ```


    For an implicit representation $G: \mathbb{R}^3 \to \mathbb{R}$ and the corresponding
    polynomial $F$, this theorem is still valid; however, the actual surface geometry
    is not defined by the function values $G(\mathbf{x})$, for which this theorem
    gives an error estimate, but by the zero level set of $G$, by $S = \{\mathbf{x}
    \in \mathbb{R}^3 \mid G(\mathbf{x}) = 0\}


    Consider a point $x$ on the implicit surface defined by the approximating polynomial
    $F$, i.e., $F(\mathbf{x}) = 0$ within some voxel. We can find a corresponding
    point $\mathbf{x} + \mathbf{d}$ on the implicit surface defined by $G$, i.e.,
    $G(\mathbf{x} + \mathbf{d}) = 0$ by shooting a ray in normal direction to $F$,
    i.e., $d = d\nabla F/|\nabla F|$. For a'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.3. Parametric Surface Representations


    sufficiently small voxel $h$, we obtain


    $|F(\mathbf{x+mathbf{d})| \approx |d| \\nabla F(\mathbf{x})| \quad \Rightarrow
    \quad |d| \approx \frac{|F(\mathbf{x+mathbf{d})|}{\|}{\nabla F(\mathbf{x})|}$


    and from the mean value theorem we get


    $|F(\mathbf{x+mathbf{d})| - G(\mathbf{x+mathbf{d})| = |F(\mathbf{x+mathbf{d})|
    = O(h^{p+1}),$


    which yields $|d|=O(h^{p+1})$ if the magnitude of the gradient $|\nabla F|$ is
    bounded below by some $\varepsilon>0$. In practice one tries to find an approximating
    polynomial $F$ with low variation of the gradient magnitude in order to have a
    uniform distribution of the approximation error.


    # 1.3 Parametric Surface Representations


    Parametric surface representations have the advantage that the function $f : \Omega
    \to S$ enables the reduction of many 3D problems on the surface $S$ to 2D problems
    in the parameter domain $\Omega$. For instance, sample points on the surface can
    easily be generated by sampling the domain $\Omega$ and evaluating the function
    $\mathbf{f}$. In a similar manner, geodesic neighborhoods, i.e., neighborhoods
    on the surface $S$, can easily be found by considering neighboring points in the
    parameter domain $\Omega$. A simple composition of $\mathbf{f}$ with a deformation
    function $\mathbf{d} : \mathbb{R}^3 \to \mathbb{R}^3$ results in an efficient
    modification of the surface geometry.


    On the other hand, generating a parametric surface parameterization $\mathbf{f}$
    can be very complex, since the parameter domain $\Omega$ has to match the topological
    and metric structure of the surface $S$ (Chapter 5). When changing the shape of
    $S$, it might be necessary to update the parameterization accordingly in order
    to reflect the respective changes of the underlying geometry: a low-distortion
    parameterization requires the metrics in $S$ and $\Omega$ to be similar, and we
    have to avoid or adapt to excessive stretching.


    Since the manifold surface $S$ is defined as the range of the parameterization
    $\mathbf{f}$, its topology is equivalent to that of $\Omega$ if $f$ is continuous
    and injective. This implies that changing the topology of a parametric surface
    $S$ can be extremely complicated not only the parameterization but also the domain
    $\Omega$ has to be adjusted accordingly. The typical inside/outside or signed
    distance queries are, in general, also expensive on parametric surfaces since
    they usually require finding the closest point on $S$ to the query point (foot
    point). The same applies to the detection of self-collisions (i.e., non-injectivities).
    Hence, topological modification and spatial queries are the weak points of parametric
    surfaces.'
