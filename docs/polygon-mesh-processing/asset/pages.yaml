    # A.3.2 Conjugate Gradients


    In this section we provide a short introduction to the conjugate gradients algorithm
    and refer the interested reader to the book [Golub and Loan 89] and the comprehensive
    tutorial [Shewchuk 94] for more details.


    The conjugate gradients (CG) algorithm is based on the equivalence of solving
    the linear system Ax = b and minimizing the quadratic form


    ```

    $$\Phi(\mathbf{x}) = \frac{1}{2}\mathbf{x}^T\mathbf{Ax} - \mathbf{b}^T\mathbf{x}$

    ```


    Straightforward minimizing $\Phi(x)$ by gradient descent results in inefficient
    zig-zag paths in valleys of $\Phi(x)$, which correspond to strongly differing
    eigenvalues of **A** (see [Shewchuk 94]). The speed of convergence is influenced
    by the ratio


    ```

    $$\kappa(\mathbf{A}) = \lambda_{max}(\mathbf{A})/\lambda_{min}(\mathbf{A})$ (A.4)

    ```


    of the largest to the smallest eigenvalue, the condition number of A. Problems
    with low or high condition numbers are said to be well-conditioned or ill-conditioned,
    respectively.


    In order to reduce the effect of A''s eigenvalues, the CG method minimizes $\Phi(x)$
    along a line of linearly independent search directions **p(k)** that define the
    so-called Krylov spaces $\mathcal{K}^{(k)}$:


    ```

    $$\mathbf{x}^{(k)} = \argmin_{\mathbf{x}\in\mathcal{K}^{(k)}} \Phi(\mathbf{x})
    \quad with \ span \{\mathbf{p}^{(0)},...,\mathbf{p}^{(k-1)}\}$\}$ (A.5)

    ```


    The search directions are chosen to be A-conjugate, i.e., orthogonal with respect
    to the scalar product induced by: **A**. $p^{(j)T}\mathbf{Ap}^{(i)} = 0$ for $i
    \neq j$. Fortunate simplifications in the computations make it possible to obtain
    the vectors **p(k)** one by one, by only keeping one vector in memory. The next
    one is then based on a linear combination of the previous one and the gradient
    $

    abla\Phi = \mathbf{Ax}^{(k)} - \mathbf{r}^{(k)}$ at the current point **x^{(k)}**.
    The complete algorithm can be summarized as follows:'
