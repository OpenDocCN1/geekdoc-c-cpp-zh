  md: 'smoothing iterations (e.g., Jacobi, Gauss-Seidel) on the finest level $M_0$
    (so-called *pre-smoothing*), the high frequencies of the error are removed and
    the smoothing iterations become inefficient. However, the remaining low frequency
    error $e_0 = \mathbf{x}_0 - \mathbf{x}$ on $M_0$ corresponds to higher frequencies
    when restricted to the coarser mesh $M_1$ and can be removed efficiently on $M_1$.


    Hence, the error is used for using the residuals $\mathbf{Ae}_1 = \mathbf{r}_1$
    on $M_1$, where $\mathbf{r}_1 = \mathbf{R}_1\mathbf{e}_0$ is the residual on $M_0$
    transferred to $\mathbf{M}_1$ by a restriction operator $\mathbf{R}_1$. The result
    $\mathbf{e}_1$ is prolonged to $M_0$ by $e_0 \leftarrow \mathbf{P}_1\mathbf{e}_1$
    and used to correct the current approximation: $\mathbf{x}_0 \leftarrow \mathbf{x}_0
    + e_0$. Small high-frequency errors due to the prolongation are finally removed
    by a few Jacobi iterations (so-called *post-smoothing*) on $M_0$.


    The recursive application of this two-level approach to the whole hierarchy is
    summarized as follows:


    ```

    $\Phi_i = S_\mu P_{i+1} \Phi_{i+1} R_{i+1} S_\lambda, \quad i = 0, \dots, k-1$\n\Phi_k
    = A_k^{-1}\mathbf{b}_k$

    ```


    where $S_\lambda$ and $S_\mu$ denote $\lambda$ pre-smoothing and $\mu$ post-smoothing
    iterations, respectively. The recursiveion stops on the coarsest level $M_k$,
    where the (small) linear system $\mathbf{A}_k\mathbf{x}_k = \mathbf{b}_k$ is solved
    using any linear solver, denoted by the operator $\Phi_k$. One recursive run is
    referred to as a $V$-cycle.


    Another concept is the method of *nested iterations*, which exploits the fact
    that iterative solvers are very efficient if the starting value is sufficiently
    close to the actual solution. One starts by computing the exact solution on the
    coarsest level $M_k$, which can be done efficiently since the system $\mathbf{A}_k\mathbf{x}_k
    = \mathbf{b}_k$ corresponding to the restriction to $M_k$ is small. The prolonged
    solution $P_k\mathbf{x}_k$ is used as the starting value for an iterative solver
    on level $M_{k-1}$, and this process is repeated until the finest level $M_0$
    is reached and the solution $\mathbf{x}_0 = \mathbf{x}^*$ is computed.


    The remaining question is what kind of iterative solver to choose for the solution
    on each level $M_i$ in a nested iterations approach? The typical approach is to
    perform one or two $V$-cycles (from $M_i$ to $M_k$ and back to $M_i$). In this
    so-called *full multigrid* approach, however, one can use an iterative smoothing
    solver (e.g., Jacobi or CG) at each level and avoid $V$-cycles. In the latter
    case the number of iterations $m_i$ at level $i$ should not be constant but instead
    be chosen as $m_i = m\gamma^i$ to decrease exponentially from coarse to fine [Bormann
    and Deuflhard 96]. Besides implementation, the advantage of this cascading multigrid
    approach is that once a level is computed, it is not involved in further computations
    and thus can be discarded. A comparison of the three methods in terms of visited
    multigrid levels is given in Figure A.1.'
