  md: '# 9.2 Shell-Based Deformation


    More intuitive surface deformations d prescribed geometric constraints d(p) =
    d, can be modeled by minimizing physically-inspired deformation energies. The
    surface is assumed to behave like a physical skin or sheet that stretches and
    bends as forces are acting on it. Mathematically, this behavior is captured by
    an energy functional that penalizes both stretching and bending.


    Let us for the following deformations assume S and S'' to be given smooth parametric
    surfaces, i.e., by functions p: Ω → R³ and p'': Ω → R³. Similarly, the displacement
    function is defined as d: Ω → R³.


    As introduced in Chapter 3, the first and second fundamental forms, I(u, v) and
    II(u, v), can be used to measure geometrically intrinsic (i.e., parameterization
    independent) properties of S, such as lengths, areas, and curvatures. When the
    surface S is deformed to S'', such that its fundamental forms change to I'' and
    II'', the difference of the fundamental forms can be used as an elastic thin shell
    energy that measures stretching and bending [Terzopoulos et al. 87]:


    ```

    E(S'') = \iint k_s ||I''(u,v) - I(u,v)||_F^2 + k_b ||II''(u,v) - II(u,v)||_F^2
    du dv.

    ```


    The stiffness k_s and k_b are used to control the resistance of stretching and
    bending, respectively, and ||·|_F is a (weighted) Frobenius norm. In a modeling
    scenario one is to minimize the elastic (9.3) subject to user-defined deformation
    constraints. As shown in Figure 9.1, this typically means fixing certain surface
    parts F and prescribing displacements for the handle region(s).


    However, minimizing the nonlinear energy (9.3) is computationally expensive for
    interactive applications. It is therefore simplified by replacing the difference
    of fundamental forms by partial derivatives of the displacement function d (difference
    of positions) [Celnik and Gossard 91, Welsh and Weiner 92]. This leads to the
    following thin-shell energy:


    ```

    E(d) = \iint_Omega k_s ||d_u(u,v)||^2 + ||d_v(u,v)||^2 + k_b (||d_{uu}(u,v)||^2
    + 2||d_{uv}(u,v)||^2 + ||d_{vv}(u,v)||^2) du dv,

    ```


    where we use the notation d_u = \partial/\u d and d_v = \partial/\v d to denote
    partial derivatives. Note that the stretching and bending terms of this energy
    are almost the same as the membrane and thin plate energies employed in'
