  md: '# 6.3 Correspondences


    All remeshing algorithms compute point locations on or near the original surface.
    Most algorithms furthermore iteratively relocate mesh vertices in order to improve
    the quality of the mesh. Thus, a key issue in all remeshing algorithms is to compute
    or maintain correspondences between points p on the generated mesh and their counterparts
    φ(p) on the input mesh. There are a number of approaches to address this problem:


    +   - Global parameterization. The input model is globally parameterized onto
    a 2D domain (see Chapter 5). Sample points can be easily distributed and relocated
    in the 2D domain and be lifted to three dimensions [Alliez et al. 03b, Alliez
    et al. 03a].


    +   - Local parameterization. The algorithm maintains a parameterization of a
    local geodesic neighborhood around φ(p). When a leaf leaves this neighborhood,
    a new neighborhood is to be computed [Surazsky et al. 03].


    +   - Projection. The sample point is projected onto the nearest element (point,
    edge, or triangle) of the input model [Botch and Kobelt 04b].


    Global parameterization is, in general, expensive and may suffer from parametric
    distortion or discontinuities when the mesh needs to be cut into a topological
    disk. Naive direct projection may produce local and global foldovers if the points
    are too far away from the surface. However, in practice the projection operator
    can be stabilized by constraining the movement of the sample points to their tangent
    planes. Although no theoretical guarantees can be provided, this makes that the
    samples do not move too far from the surface, so that the projection can be safely
    evaluated. The local parameterization approach is stable and produces high-quality
    results. However, it requires expensive bookkeeping to track, cache, and re-parameter
    the local neighborhoods.


    # 6.4 Voronoi Diagrams and Delaunay Triangulations


    Voronoi diagrams and Delaunay triangulations are important geometric data structures
    for meshing and remeshing. We now provide definitions for Voronoi diagrams and
    Delaunay triangulations in arbitrary dimensions, although they will later be used
    only in two and three dimensions.'
