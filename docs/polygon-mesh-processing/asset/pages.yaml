  md: '# 8. Model Repair


    artifacts (Section 8.2). From a top-level view we distinguish model repair schemes
    that explicitly identify and resolve artifacts from those that rely

    \on an intermediate volumetric representation, which automatically enforces topological
    consistency. In Section 8.3 we review the various characteristics of input models
    that emerge from different data sources in practical applications. We describe
    the specific artifacts and problems of each type and explain their origins. We
    also reference algorithms that are designed to process meshes.


    Finally, in Sections 8.4 and 8.5, we present in more detail of the standard model
    repair algorithms. Some of these algorithms are relatively straightforward while
    others are more involved that we can only discuss their basic mechanisms. We give
    a short description of how each algorithm works and to which types of model it
    is applicable. This provides a deeper understanding of the subtle problems that
    occur in model repair and offers ways to address these problems.


    # 8.1 Types of Artifacts: The “Freak Show”


    The chart in Figure 8.1 shows the most common types of artifacts that occur in
    typical input models. Note that this collection is by no means complete, and in
    particular, in CAD models one encounters artifacts like self-intersecting (trimming)
    curves, feature points that do not lie on their geometric primitive, and so on.
    While some of artifacts (e.g., complex edges) have a precise definition, others,
    like the distinction between small-scale and large-scale overlaps, are described
    intuitively rather than by strict definitions. Particularly tricky are (self-)
    intersections since they do not affect the proper mesh connectivity and are sometimes
    hard to detect. Non-topological artifacts such as badly shaped triangles are usually
    removed by remeshing techniques (see Chapter 6).


    # 8.2 Types of Repair Algorithms


    Most model repair algorithms can roughly classified as either surface-oriented
    or volumetric. Understanding these concepts already helps one to evaluate the
    strengths and weaknesses of a given algorithm and the quality that can be expected
    of its output.


    Surface-oriented algorithms operate directly on the input data and try to explicitly
    identify and resolve artifacts on the surface. For example, gaps could be removed
    by snapping boundary elements (vertices and edges) onto each other or by stitching
    triangle strips in between the gap. Holes can be'
