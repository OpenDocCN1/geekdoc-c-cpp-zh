  md: "# 7. Simplification & Approximation\n\nThe generic situation during mesh decimation\
    \ is that each triangle $t_i$ in the decimated mesh is associated with a sub-patch\
    \ $S_i$ of the original mesh. Distance measures have to be computed between each\
    \ triangle $t_i$ and either the vertices or faces of $S_i$. Depending on the application,\
    \ we have to take the maximum distance or we can average the distance over the\
    \ patch.\n\nError accumulation. The simplest of these techniques is error accumulation\
    \ [Schroeder et al. 92]. For example, each edge collapse modifies the adjacent\
    \ triangles $t_i$ by shifting one of their vertices from **p** or **q** to **r**.\
    \ Hence, the distance of **r** to **t** is an upper bound for the error introduced\
    \ in this step. Error accumulation means that we store an error value for each\
    \ triangle and simply add the new error contribution for every decimation step.\
    \ The error accumulation can be done either on scalar distance values or on distance\
    \ vectors. Vector addition takes into account that approximation error estimates\
    \ in opposite directions cancel each other.\n\nError quadrics. Another distance\
    \ measure assigns distance values to the vertices $p_j$ of the decimated mesh.\
    \ It is based on estimating the sum of squared distances of $p_j$ from all supporting\
    \ planes of triangles in the patches $S_i$ that are associated with the triangles\
    \ $t_i$ surrounding $p_j$. This is, in fact, what the quadric metric does [Garland\
    \ and Heckbert 97].\n\nInitially we compute the quadric $\\mathbf{Q}_p$ for each\
    \ original vertex $p$ according to Equation (7.1) by summing over all triangles\
    \ that are directly adjacent to $p$. Then, whenever the edge between two vertices\
    \ $p$ and $q$ is collapsed, the quadric for the new vertex $r$ is accumulated\
    \ as $\\mathbf{Q}_r = \\mathbf{Q}_p+\\mathbf{Q}_q$. The error of collapsing $p$\
    \ and $q$ into $r$ is computed using Equation (7.1). The optimal position for\
    \ $r$ is given by the solution of Equation (7.2).\n\nBy summing the squares of\
    \ the edge's endpoints, the new quadric $\\mathbf{Q}_r$ represents the sum of\
    \ squared distances to planes stored inside $\\mathbf{Q}_p$ or $\\mathbf{Q}_q$.\
    \ Consequently, triangle planes can occur multiple (at most three) times, which\
    \ can overestimate the error. Approximating the distance from a triangle by the\
    \ distance to a plane can underestimate the true error. Hence, the quadric metric\
    \ gives neither a strict upper nor a strict lower bound on the true geometric\
    \ error.\n\nOn the other hand, error quadrics have major advantages regarding\
    \ memory consumption and computational efficiency: each vertex $x$ stores a symmetric\
    \ $4 \times 4$ matrix $\\mathbf{Q}$ only, and the error can be efficiently computed\
    \ in constant time as $\\mathbf{x}^T\\mathbf{Q}\\mathbf{x}$—no how many planes\
    \ are associated to vertex $x$ during decimation. Because of this, error quadrics\
    \ are one of the most frequently employed techniques in mesh decimation."
