  md: '# 7.1. Vertex Clustering


    # 7.1 Vertex Clustering


    The basic idea of vertex clustering is as follows: For a given approximation tolerance
    $\varepsilon$ we partition the bounding space around the given object into cells
    with diameter smaller than the tolerance. For each cell we compute a representative
    vertex position, which we assign to all vertices that fall into this cell. By
    this clustering step, original faces degenerate if two or three of their corners
    lie in the same cell and consequently are mapped to the same position. The decimated
    mesh is eventually obtained by removing all degenerate faces [Roscignac and Borel
    93].


    The remaining faces correspond to those original triangles whose corners lie in
    different cells. Stated otherwise, if $p$ is the representative vertex for the
    vertices $p_0, \dots, p_n$ in the cluster $P$, and $q$ is the representative for
    the vertices $q_0, \dots, q_m$ in the cluster $Q$, then $p$ and $q$ are connected
    in the decimated mesh if at least one pair of vertices $(p, q)$ was connected
    in the original mesh.


    One drawback of vertex clustering is that the resulting mesh might not be 2-manifold,
    even if the original mesh was. Topological changes occur when a part of a surface
    collapses into a single point is not homeomorphic to a disk, i.e., when two different
    sheets of the surface pass through a single $\varepsilon$-cell. However, this
    disadvantage can also be considered as an advantage. Since the scheme is able
    to change the topology of the given model, we can effectively reduce the object
    complexity. Consider, a 3D model of a sponge. Here, any decimation scheme that
    preserves the surface topology cannot reduce the mesh complexity significantly
    since all the small holes have to be preserved.


    The computational efficiency of vertex clustering is determined by the effort
    it takes to map the mesh vertices to clusters. For uniform spatial grids this
    can be achieved in linear time with small constants. Then, for each cell, a representative
    has to be found that might require involved computations. But the number of clusters
    is usually much smaller than the number of vertices.


    Another apparently nice aspect of vertex clustering is that it guarantees a global
    approximation tolerance by defining the clusters accordingly. However, in practice
    it turns out that the actual approximation error of the decimated mesh is usually
    much smaller than the radius of the clusters. This indicates that, for a given
    error threshold, vertex clustering algorithms do not achieve optimal complexity
    reduction. Consider, as an extreme example, a very planar mesh. here, decimation
    down to a single triangle without any approximation error would be possible. The
    result of vertex clustering instead will always keep one vertex for every $\varepsilon$-cell.'
