    # 8.3 Types of Input


    In this section we list the most common types of input models that occur in practice.
    For each type we describe its typical artifacts (see also Section 8.1) and give
    references to algorithms that can be used to remove them.


    **Registered range scans** are a set of patches (usually triangle meshes) that
    represent overlapping parts of the surface S of a scanned object. While large
    overlaps are a distinct advantage in registering the scans, they pose severe problems
    when these patches are to be fused into a single consistent triangle mesh. The
    main geometric problem in this setup is the potentially very large overlap of
    the scans that a point x on S is often described by multiple patches, due to measurement
    inaccuracies, do not necessarily agree on x''s position. Furthermore, each patch
    has its connectivity to that is usually not compatible with the connectivity of
    the other patches. This is in particular a problem for surface-oriented repair
    algorithms. (Image taken from [Botsch et al. 06b]).©2006 ACM, Included here


    ![](img/50d65c1816c68c45610a75b087632bd3_146_0.png)


    There are only a few surface-oriented algorithms for fusing ranges (e.g., Turk
    et al.''s mesh figuring [Turk and Levoy 94]). The most-known volumetric method
    is by Curless and Levoy [Curless and Levoy 96].


    **Fused range scans** are manifold meshes with boundaries (i.e., gaps, holes and
    islands). Either these artifacts are due to obstructions in the line of sight
    of the scanner or they result from bad surface properties of the scanned model,
    as transparency or glossiness. The goal is to identify and fill these holes (in
    the simplest case, the filling is a patch that minimizes some bending energy and
    connects smoothly to the boundary of the hole). Advanced algorithms either synthesize
    geometric detail that resembles the present detail in a local neighborhood of
    the hole or they transplant geometry from other parts of the model'
