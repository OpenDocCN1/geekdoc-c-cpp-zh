  md: '# A.3. Iterative Solvers


    for the many cases where the matrix is not strongly diagonal dominant. Both methods
    rapidly remove the high frequencies of the error, but the iteration stalls as
    soon as the error becomes a smooth function. As a consequence, the convergence
    to the exact solution x* is usually too slow in practice. We review next the conjugate
