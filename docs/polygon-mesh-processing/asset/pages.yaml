    \ eigenvector of a matrix $\\mathbf{A}e_i = \\lambda_i e_i$.\n\nHence, the base\
    \ functions of the 1D Fourier transform are eigenfunctions of the Laplacian. It\
    \ therefore seems natural to choose eigenfunctions of the Laplace-Beltrami operator\
    \ on 2-manifold surfaces as generalized functions. Because we know how to discretize\
    \ the Laplace-Beltrami, this will also provide the generalization of the Fourier\
    \ transform to discrete triangle meshes.\n\nThis idea is also consistent with\
    \ other frequency-related basis functions on bivariate surfaces: for a 2D square,\
    \ the eigenfunctions of the Laplace-Beltrami operator correspond to the basis\
    \ functions of the discrete cosine transform (used by the JPEG format) and, for\
    \ a sphere, they correspond to spherical harmonics. Thus, the eigenfunctions of\
    \ the Laplace-Beltrami generalize these to arbitrary 2-manifold surfaces. Therefore,\
    \ they are called *manifold harmonics*.\n\nFor a discretization on a triangle\
    \ mesh, we replace the continuous function $f(x)$ by the vector of sample values\
