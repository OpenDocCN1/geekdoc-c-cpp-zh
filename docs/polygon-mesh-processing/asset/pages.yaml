  md: 'least. While this is a reasonable heuristic in general, we can use other criteria
    to optimize the resulting mesh for special application-dependent requirements.


    For example, we might prefer triangle meshes with faces that are as close as possible
    to equilateral. In this case we can measure the quality of a vertex removal operation,
    e.g., by the ratio of the circumcircle radius to the length of the shortest edge
    [Shewch 97] of all incident triangles after the removal.


    Other criteria might include color deviation or texture distortion if the input
    data does not consist of pure geometry but also has color and texture attributes
    attached [Cignoni et al. 99; Cohen et al. 98, Garland and Heckbert 98].


    All these criteria for sorting vertex removal operations are called fairness since
    they rate the quality of the mesh beyond the approximation tolerance. If we keep
    the fairness criterion separate from the other modules in an implementation of
    incremental mesh decimation, we can adapt the algorithm to arbitrary user-defined
    requirements by simply exchanging one procedure. This gives rise to a flexible
    toolbox for building custom-tailored mesh decimation schemes [Kobbelt et al. 98a].


    # 7.3 Shape Approximation


    Cohen-Steiner et al. [Cohen-Steiner et al. 04] have introduced a variational shape
    approximation (VSA) algorithm. VSA is highly sensitive to features and symmetries
    and produces anisotropic meshes of high approximation quality. In VSA the input
    shape is approximated by a set of proxies. The approximation error is iteratively
    decreased by clustering faces into best-fitting regions. In contrast to some remodeling
    methods, VSA does not require a parameterization of the input or local estimates
    of differential quantities. VSA techniques can also be used in mesh segmentation.


    Let $M$ be a triangle mesh and $\mathcal{R} ={\mathcal{R}_1, \dots, \mathcal{R}_k\}$
    be a partition of $M$ into $k$ regions, i.e., $\mathcal{R}_i \subset M$ and


    $\mathcal{R}_1 \cup \dots \cup \mathcal{R}_k = M$.'
