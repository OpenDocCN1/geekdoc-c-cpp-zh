  md: '# A.6 Comparison


    converging GMRES; it provides a much smoother convergence and is reasonably efficient
    and easy to implement. For this reason, BiCGStab was used in early parameterization
    methods [Floater 97].


    When considering direct solvers, the Cholesky factorization cannot be used for
    general matrices. Therefore the LU factorization is typically employed since it
    is similarly efficient and also extends to sparse direct methods. After factorizing
    the matrix A into the product of a lower triangular matrix L and an upper triangular
    matrix U, it solves two systems by forward and backward substitution:


    ```

    Ax = b \Leftrightarrow LUx = b \Leftrightarrow \begin{cases} Ly = b, \ Ux = y.
    \end{cases}

    ```


    In contrast to the Cholesky factorization, (partial) row and column pivoting is
    essential for the numerical robustness of the LU factorization.


    Similarly to the Cholesky factorization, the LU factorization preserves the bandwidth
    and envelope of the matrix A. Techniques like the minimum degree algorithm generalize
    to non-symmetric matrices as well. However, for dense matrices, the sparse LU
    factorization relies on pivoting in order to guarantee numerical stability. This
    means that two competing types of permutations are to be found: permutations for
    matrix reordering and pivoting permutations for numerical robustness. Because
    these permutations cannot be handled separately, a trade-off between stability
    and fill-in minimization is found, resulting in a more complex factorization.
    Efficient implementations of sparse LU factorization are provided by the libraries
    SuperLU [Demmel et al. 99] and UMFPACK [Davis 04].


    # A.6 Comparison


    In the following we compare different linear system solvers on Laplacian and Laplacian
    systems of varying size:


    +   CG. The iterative conjugate gradients solver from the gmm++ library [Renard
    and Pommier 05], using incomplete LDL$^T$ factorization as preconditioner.


    +   MG. The cascading multigrid solver of [Botsch and Kobbelt 04a], which exploits
    SSE instructions in order to solve for up to four right-hand sides simultaneously.


    +   LL$^T$. The sparse Cholesky solver of the TAUCS library [Toledo et al. 03],
    using nested dissection matrix reordering.'
