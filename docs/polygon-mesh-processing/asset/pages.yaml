  md: '# SIMPLIFICATION

    & APPROXIMATION


    Mesh simplification and approximation describes a class of algorithms that transform
    a given polygonal mesh into another with fewer faces, edges, and vertices [Gotsman
    et al. 02, Luecke et al. 03]. The simplification or approximation procedure is
    usually controlled by user-defined quality criteria, which favor meshes that preserve
    specific properties of the original data as much as possible. Typical criteria
    include geometric distortion (e.g., Hausdorff distance, normals) or visual appearance
    (e.g., colors, features, etc.) [Cignoni et al. 98].


    There are many applications for simplification and approximation algorithms. First,
    they obviously can be used to adjust the complexity of a geometric data set. This
    makes geometry processing a scalable task where differently complex models can
    be used on computers with varying performance. Second, since many decimation schemes
    work iteratively, i.e., they decimate a mesh by removing one vertex at a time,
    they usually can be inverted. Running a decimation scheme backwards means reconstructing
    the original data from a decimated version by inserting and more detail information.
    This inverse decimation can be used for adaptive refinement and progressive transmission
    of geometry data [Hoppe 96]. Obviously, in order to make progressive transmission
    effective, we have to use decimation operators whose inverses can be encoded compactly
    (Figure 7.3).


    There are several conceptual approaches to mesh simplification. In principle we
    can think of the complexity reduction as a one-step operation'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 112 7. Simplification & Approximation


    or as an iterative procedure. The vertex positions of the decimated mesh can be
    obtained as a subset of the original set of vertex positions, as a set of weighted
    averages of original vertex positions, or by resampling the original piecewise
    linear surface. In the literature the different approaches are classified into


    +   - vertex clustering algorithms;


    +   - incremental decimation algorithms;


    +   - resampling algorithms;


    +   - mesh approximation algorithms.


    **Vertex clustering algorithms** are usually efficient and robust. The computational
    complexity is typically linear in the number of vertices. However, the quality
    of the resulting meshes is not always satisfactory.


    **Incremental algorithms** in most iterative decision procedure can take arbitrary
    user-defined criteria into account, according which the next remove operation
    is chosen. However, its total computational complexity in the average case is
    $O(n \log n)$ and can go up to $O(n^2)$ in the worst case, especially when a global
    error threshold is to be respected.


    **Resampling algorithms** are the most general approach to mesh decimation. Here,
    new sample points are more or less distributed over the original surface mesh.
    By connecting these samples, a new mesh is constructed. One major motivation for
    resampling techniques is that they can force the resulting mesh to have a special
    connectivity structure, i.e., subdivision connectivity (or semi-regular connectivity).
    By this can be used to build multiresolution representations based on subdivision
    functions [Ek et al. 95]. The most serious disadvantage of resampling, however,
    is that aliasing errors can occur if the sampling pattern is not aligned to features
    in the original geometry. To avoid aliasing effects, many resampling schemes to
    some degree require manual pre-segmentation of the data for reliable feature detection.
    Resampling techniques are discussed in detail in Chapter 6.


    **Mesh approximation algorithms** are devised to minimize well-defined metrics
    through various mesh optimization strategies [Hoppe et al. 93,Alliez et al. 99,
    Cohen-Steiner et al. 04].


    In the following sections we explain in more detail the various approaches to
    mesh simplification and approximation. Usually there are many choices for the
    different ingredients and sub-procedures in each algorithm, and we will point
    out the advantages and disadvantages for each class.'
