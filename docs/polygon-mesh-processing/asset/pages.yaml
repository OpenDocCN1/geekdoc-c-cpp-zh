    8. Model Repair


    # 8.6 Summary and Further Reading


    In this chapter we have presented several methods for repairing surface meshes,
    primarily distinguishing between surface-oriented and volumetric algorithms. Over
    the years we have observed an increasing trend towards volumetric algorithms,
    which by construction provide a number of guaranteed properties in the output—even
    if they require resampling of the input geometry. This is why hybrid methods are
    receiving more and more attention. They combine volumetric and surface-oriented
    approaches in order to exploit the superior precision that is achieved from processing
    polygons directly but at the same time taking advantage of the robustness of volumetric
    voxel operations and the efficiency of hierarchical partitions.


    An important case of the mesh repair problem we did not address in this chapter
    is the removal of geometric self-intersections in 3D models that are not necessarily
    reflected by inconsistencies in the topological connectivity of the mesh. Recently,
    there have been some powerful algorithms proposed in response to this special
    case (e.g., [Campen and Kobbett 10, Attene 10]).


    As knowledge advances in the field, it is tempting to think that model repair
    is a necessity that will disappear and when all algorithms along the geometry
    processing pipeline will become artifact-free outputs (note that ironically, some
    algorithms in the literature do not guarantee their output). However, with more
    and more data emerging from physical measurements and coming from heterogeneous
    sources, the processing of geometric data will continue to require frequent format
    conversions and will increase the probability of inconsistencies and flaws due
    to numerical inaccuracies. For reasons, model repair will remain one of the most
    enduring problems and will be critical for streamlining the geometry processing
    pipeline.


    In today''s industrial design and development processes compute-intensive steps
    like simulation and shape analysis become faster and faster due to improved (parallel)
    algorithms and more powerful hardware. However, version and repair steps cannot
    be accelerated as long as the user is to control this process manually. Hence,
    providing automatic conversion and repair techniques will have maximum impact
    on the overall process optimization measured in wall clock time, which is what
    matters in industrial practice. Nonetheless, the inherent ill-posed nature of
    the model repair problem explains the parallel development of semiautomatic methods
    that provide topology control [Hétroy et al. 08] to the user.


    Finally, we recommend for further reading a comprehensive survey by Tao Ju [Ju
    09].'
