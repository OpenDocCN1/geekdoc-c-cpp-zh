  md: '# 7.2. Incremental Decimation 115


    with a symmetric $4 \times 4$ matrix $Q_i = \mathbf{n}_i\mathbf{n}_i^T$. The sum
    of the quadratic distances to the supporting planes $P_i$ of all triangles $t_i$
    within a cell $C$ is given by


    ```

    $E(\mathbf{x}) = \sum_{t_i\in C} \mathbf{x}^T Q_i \mathbf{x} = \mathbf{x}^T \left(
    \sum_{t_i\in C} Q_i \right) \mathbf{x} =: \mathbf{x}^T Q \mathbf{x}. \quad (7.1)$

    ```


    The error function is a quadratic form, the iscontours of which are ellipses,
    and consequently the resulting error measure is called the *quadric error metric*
    (QEM). The coefficients of the quadric are stored in the symmetric $4 \times 4$
    matrix Q, no matter how many triangle planes $P_i$ contribute to the error [Garland
    and Heckbert 97, Lindstrom 000].


    The optimal position $\mathbf{x}$ minimizing the quadric error can be computed
    as the solution of the least squares system


    ```

    $\left( \sum_{i} \mathbf{n}_i\mathbf{n}_i^T \right) \mathbf{x} = \left( \sum_{i}
    n_i d_i \right). \quad (7.2)$

    ```


    which can be obtained from the matrix Q as


    ```

    $\mathbf{Q} = \begin{bmatrix} A & \mathbf{-b} \ \mathbf{-b}^T & c \end{bmatrix}$.

    ```


    If the matrix A has full rank, i.e., the normal vectors of the patch do not lie
    in a plane, then Equation (7.2) could be solved directly. However, to avoid special
    case handling and to make the solution more robust, a pseudo-inverse based on
    singular value decomposition is preferred [Lindstrom 00].


    Note for irregular triangulations, a weighted sum of squared distances can improve
    the result, where typically triangle areas $t_i$ are used as weights $w_i$. This
    leads to an error function $E(\mathbf{x}) = \sum_i w_i \text{dist}^2(\mathbf{x},
    P_i)$, which simply corresponds to a quadric matrix $\mathbf{Q = \sum_i w_i Q_i}$.
    Based on the blocks of this matrix as defined above, the optimal point is again
    computed as the solution of $\mathbf{Ax = \mathbf{b}}$.


    # 7.2 Incremental Decimation


    Incremental algorithms remove one mesh vertex at a time (see Figure 7.2). In each
    step, the best candidate for removal is determined on user-specified criteria.
    Those criteria can be either *binary* (removal or is not allowed) or *continuous*
    (rate the quality of the mesh after the removal). Binary criteria usually refer
    to the global approximation tolerance or to other'
