  md: '# 6.6. Quad-dominant Remeshing


    ![](img/50d65c1816c68c45610a75b087632bd3_120_0.png)


    **Figure 6.19.** Quad-dominant remeshing: The input is a manifold triangle mesh
    (left). In regions of low confidence, the curvature lines are not well defined
    (center). The algorithm bridges these regions by extrapolation and produces the
    result (right). (Image taken from [Marinov and Kobbelt 04]. ©2008 IEEE.)


    In addition to mere curvature directions, a confidence value for each face and
    vertex of the input mesh is estimated as well. The estimate is based on the coherence
    of the principal directions at the face''s vertices. This confidence estimate
    is then used to propagate the curvature tensors from regions of high confidence
    (highly curved regions) into regions of low confidence (flat regions and noisy
    regions). Curvature lines are traced directly on the 3D mesh, at any time a line
    position is identified by a tuple $(f,(u,v,w))$, where $f$ is the index of a triangle
    and $u,v,w$ are the barycentric coordinates of the sample within triangle. To
    advance the current sample point, the face $f$ and its neighborhood are locally
    flattened, either by a hinge map (if the curvature line crosses an edge of f)
    or by a polar map (if the curvature crosses one of $f$''s vertices); see Figure
    6.20.


    When a streamline enters a region of low confidence, the algorithm traces the
    switching mode: instead of integrating along the principal curvatures, the line
    is simply extrapolated from its last sample points along a geodesic curve until
    it enters a region of high confidence again. At this point the line is then “snapped”
    to the most similar principal curvature direction.


    Due to the visual and structural importance of curvatures, remeshing algorithms
    that track these lines produce results that are similar to those that would have
    been created by a human designer. However, estimating and tracking the principal
    curvatures on a discrete triangle mesh is not easy, in particular for coarse or
    noisy meshes. Aliez et.’s algorithm outsources most of the computationally hard
    work to a constrained Delaunay triangulation [CGAL 09] by globally parameterizing
    the whole input model. Apart from being hard to compute for large models,'
