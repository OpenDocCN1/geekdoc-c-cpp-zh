    \ when $V_i$ are the centroids $c_i$ of their corresponding regions $V_i$. Moreover,\
    \ for a fixed set of sites $p_1, \\dots, p_n$, the energy function is minimized\
    \ if $\\{V_1, \\dots, V_n\\}$ is a Voronoi tessellation.\n\nOne way to build a\
    \ centroidal Voronoi tessellation is to use Lloyd's relaxation method. The Lloyd\
    \ algorithm is a deterministic, fixed-point iteration [Lloyd 82]. Given a density\
    \ function and an initial set of $n$ sites, it consists of the following three\
    \ steps (see Figure 6.8):\n\n+   1. Construct the Voronoi tessellation corresponding\
    \ to the sites $p_i$.\n\n+   2. Compute the centroids $c_i$ of the Voronoi regions\
    \ $V_i$ using Equation (6.1), and move the sites $p_i$ to their respective centroids\
    \ $c_i$.\n\n+   3. Repeat steps 1 and 2 until satisfactory convergence is achieved."
