  md: Nonlinear smoothing. For surface fairing we replaced nonlinear intrinsic properties
    (e.g., fundamental forms and principal curvatures) with first- second-order partial
    derivatives, which eventually led to a simple linear system to be solved for the
    fair surface. Nonlinear smoothing approaches solve the true nonlinear minimization
    problem, but provides surfaces of higher quality since they are less dependent
    on the initial triangulation or parameterization [Moreton and Séquin 92]. For
    instance, Schneider et al. [Schneider and Kobbelt 01, Schneider and Kobbelt 00]
    solve the nonlinear equation $\Delta H = 0$, and Bobenko and Schröder minimize
    the discrete Willmore flow [Bobenko and Schröder 05]. Eigensatz et al. apply a
    bilateral filter directly on the discrete mean curvature and reconstruct a triangle
    mesh that best approximates the filtered curvature values [Eigensatz et al. 08].
