    \ involving curvatures or higher-order derivatives. We will show that mesh fairing\
    \ directly computes the limit surfaces of iterative denoising processes, which\
    \ illustrates the connection between these two approaches.\n\n# 4.1 Fourier Transform\
    \ and Manifold Harmonics\n\nThe Fourier transform is the classic tool for analyzing\
    \ a signal’s frequency spectrum. It allows for efficient implementations of low-pass\
    \ filters and more general convolution filters. We will first consider low-pass\
    \ filtering of simple univariate functions $f(x)$ based on the Fourier transform,\
    \ and then generalize these concepts to signal processing on triangle meshes.\n\
    \n# 4.1.1 1D Fourier Transform\n\nThe Fourier transform maps a univariate function\
    \ $f: \\mathbb{R} \to \\mathbb{C}$ from its representation $f(x)$ in the *spatial\
    \ domain* to its representation $F(\\omega)$ in the *frequency domain*. This transformation\
    \ and its inverse can be written as\n\n```\n$F(\\omega) = \\int_{-\\infty}^{\\\
    infty} f(x) e^{-2\\pi\\omega x} dx, \\quad (4.1)$\n```\n\n```\n$f(x) = \\int_{-\\\
    infty}^{\\infty} F(\\omega) e^{2\\pi\\omega x} d\\omega. \\quad (4.2)$\n```"
