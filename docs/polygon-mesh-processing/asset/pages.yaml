    6. Remeshing


    our discussion by structuring the different types of remeshing algorithms and
    by clarifying some concepts commonly used in the remeshing literature. Beginning
    with Section 6.4, we discuss several remeshing methods, focusing on the key paradigms
    behind each of them.


    # 6.1 Local Structure


    The local structure of a mesh is described by the type, shape, orientation, and
    distribution of the mesh elements.


    +   Element type. The most common target element types are triangles and quadrangles.
    Triangle meshes are usually easier to produce, while in quadrangular remeshing
    one often has to contend with results that are only quad-dominant. Note that,
    in principle, any quadrangle can be trivially converted into a triangle mesh by
    inserting a diagonal into each quadrangle. Converting a triangle mesh into a quadrangle
    mesh can be performed either by barycentric subdivision (splitting each triangle
    into three quadrangles by inserting its barycenter and linking it to edge midpoints)
    or by splitting each triangle at its barycenter into three new triangles (one-to-three)
    and discarding the original mesh edges.


    +   Element shape. Elements can be classified as being either isotropic or anisotropic.
    The shape of isotropic elements is uniform in all directions. Ideally, a triangle/quadrangle
    is isotropic if it is close to equilateral/square (see [Figure 6.1](https://Figure
    6.1)).


    For triangles roughness can be measured by the ratio of the circumradius to the
    length of the shortest edge (see [Shewchuk 97]). Isotropic elements are favored
    in numerical applications (FEM or geometry processing), as the local uniform shape
    of their elements often leads to a better conditioning of the resulting systems
    (see [Shewchuk 02] for a more detailed discussion). The shape of anisotropic elements
    locally varies according to the orientation on the


