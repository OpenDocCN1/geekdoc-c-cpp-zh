    is an inherently nonlinear behavior and therefore cannot be modeled by a purely
    linear technique. One way to better preserve geometric details, while still using
    a linear deformation approach, is to use multi-scale techniques, as described
    in this section.


    The main idea of multi-scale deformations is to decompose the object into two
    frequency bands using the smoothing and fairing techniques introduced in Chapter
    4; the low frequencies correspond to the smooth global shape, while the high frequencies
    correspond to the fine-scale details. Our goal is to deform the low frequencies
    (global shape) while preserving the high-frequency details, resulting in the desired
    multi-scale deformation.

    Figure 9.6 shows a simple 2D example of this concept.


    The multi-scale deformation process is depicted in Figure 9.7. First a low-frequency
    representation of the given surface $S$ is computed by removing the high frequencies,
    yielding a smooth base surface $B$. The geometric details $\mathcal D = S \ominus
    B$, i.e., the fine-scale features that have been removed, represent the high frequencies
    of $S$ and are stored as detail information.


    ![](img/50d65c1816c68c45610a75b087632bd3_169_1.png)


    **Figure 9.6.** A multi-scale deformation of a sine wave. A frequency decomposition
    yields the dashed line as its low frequency component (left). Bending this line
    and adding the higher frequencies back onto results in the desired global shape
    deformation (right). (Image taken from [Botsch 05]).'
