    # 5.3.1 Discrete Laplacian


    The Laplacian, or Laplace operator, is a generalization of the second-order derivative
    for multivariate functions. In flat 2D space, this operator is defined by


    ```

    $$\Delta f = \frac{\partial^2 f}{\partial x^2} + \frac{\partial^2 f}{\partial
    y^2}$

    ```


