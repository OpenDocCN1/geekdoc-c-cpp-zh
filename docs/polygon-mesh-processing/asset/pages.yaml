  md: '# 8. Model Repair


    closed by filling in a triangulated patch that is optimal with respect to some
    surface quality functional. Intersections can be located and resolved by explicitly
    splitting edges and triangles.


    Surface-oriented repair algorithms only minimally perturb the input model and
    are able to preserve the polygonal mesh structure in areas that are not in the
    direct vicinity of artifacts. In particular, geometric structure that might be
    encoded in the connectivity of the input (e.g., curvature lines) or material properties
    that are associated with triangles or vertices are usually well preserved. Furthermore,
    these algorithms introduce only a small number of additional triangles.


    To guarantee a valid output, surface-oriented repair algorithms usually require
    that the input model already satisfy certain quality requirements (error tolerances).
    Often enough these requirements cannot be guaranteed nor be checked automatically,
    so these algorithms are rarely fully automatic but need user interaction and manual
    post-processing. Furthermore, due to numerical inaccuracies, certain types of
    artifacts (like intersections or large overlaps) cannot be resolved robustly.
    Other artifacts, like gaps between separate solids that are geometrically close
    to each other, cannot be identified.


    Volumetric algorithms convert the input model into an intermediate volumetric
    representation from which the output model is extracted. Here, a volumetric representation
    can be any kind of partitioning of the embedding space into cells that each cell
    can be classified as being inside, outside, or intersected by the surface. Examples
    of volumetric representations that have been used in model repair include regular
    Cartesian grids, adaptive octrees, kd-trees, BSP-trees, and Delaunay triangulations
    (see also Section 1.4). By their nature, volumetric representations do not allow
    for artifacts like intersections, holes, overlaps, or inconsistent normal orientations.
    Depending on the type of extraction algorithm, one can also guarantee the absence
    of complex edges and singular vertices. Spurious handles, however, might still
    be present in the reconstruction.


    Volumetric algorithms are typically fully automatic and guaranteed watertight
    models (see Section 1.5.2). Depending on the type of volume, they can be implemented
    very robustly. In particular, the combinatorial neighborhood relation between
    cells allows one to reliably extract a consistent topology of the repaired model.
    Furthermore, well-known morphological operators can be used to robustly remove
    handles from the volume.


    On the downside, the conversion to and from volume leads to a resampling of the
    model. It often introduces aliasing artifacts and loss of model features, and
    it destroys any structure that might have been present in the'
