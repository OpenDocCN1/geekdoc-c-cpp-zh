  md: "# 186 A. Numerics\n\nBelow is a C++ example implementation of the CRS data\
    \ structure.\n\n```\n// CRS format for sparse matrices\nstruct CRSMatrix {\nint\
    \ n; // matrix dimension\nint nnz; // number of non-zero coefficients\nint rowptr[];\
    \ // row pointers (array of size n+1)\nint colind[]; // column indices (array\
    \ of size nnz)\ndouble v[]; // non-zero coefficients (array of size nnz)\n};\n\
    \n// sparse matrix vector product=A*x\nvoid mult(Vector& y, const CRSMatrix& A,\
    \ const Vector& x) {\n  for (int i=0; i<A.n; i++) {\n    y[i] = 0.0;\n    for\
    \ (int i=0; i<A.n; i++) {\n      for (int k=A.rowptr[i]; k<A.rowptr[i+1]; k++)\
    \ {\n        y[i] += A.v[k] * x[A.colind[k]];\n      }\n    }\n  }\n}\n```\n\n\
    There are several variants of the CRS data structure [Barrett et al. 94]. If the\
    \ matrix is symmetric, it is possible to store the lower triangular part of the\
    \ matrix only. Other variants store the diagonal coefficients in a separate array\
    \ to facilitate the implementation of a diagonal Jacobi preconditioner. Alternatively,\
    \ the block compressed row (BCRS) format partitions the matrix into fixed-size\
    \ blocks and stores these (instead of scalars) in the array v[]. This optimizes\
    \ memory access and is amenable to the use of extended instruction sets, such\
    \ as SSE on Intel processors. It is also well suited for efficient GPU implementations\
    \ [Biatois et al. 09].\n\nThe CRS data structure and its variants are compact\
    \ and efficient, at the price of an increased rigidity compared to, e.g., the\
    \ Triplet data structure. This rigidity translates into either the need to generate\
    \ the matrix one row after the other or two mesh traversals to first count the\
    \ number of non-zero entries before filling the matrix. Practical implementations\
    \ therefore typically create a Triplet matrix first, which can then be converted\
    \ into a CRS matrix using efficient conversion routines [Davis 06]. An alternative\
    \ is a CRS-like data structure based on dynamic arrays per row, which is slightly\
    \ less efficient but more flexible than the static CRS format; an example implementation\
    \ is available in the OpenNL library.¹¹\n\n> ¹http://alice.loria.fr/index.php/software/4-library/23-opennl.html"
