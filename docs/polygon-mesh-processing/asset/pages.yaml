  md: '# 7.5 Summary and Further Reading


    We have presented an overview of the main paradigms used for the simplification
    and approximation of surface meshes. Incremental mesh decimation using repeated
    edge collapses is the most popular algorithm and is widely used in applications.
    This approach has been extended in many variants, such as efficient view-dependent
    simplification [Hu et al. ], maximum error tolerances (Hausdorff distance) [Botsch
    et al. 04, Borouchaki and Frey 05], and intersection-free simplification [Gumhold
    et al. 03].


    In [Wu and Kobbelt 05] the variational shape approximation approach is taken a
    step further by allowing for proxies other than simple planes, e.g., spheres,
    cylinders, and rolling-ball blends. Apart from requiring fewer primitives to achieve
    a certain fitting approximation, this method can also recover to some extent the
    semantic structure of the input model. In [Julius et al. 05] a similar idea is
    used to decompose the input mesh into nearly developable segments. Another extension
    of this algorithm to handling general quadric proxies has been elaborated in [Yan
    et al. 06].'
