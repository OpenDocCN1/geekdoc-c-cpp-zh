    Notice used to interpolate a large number of constraints [Morse et al. 01, Ohtake
    et al. 04]; they do not provide the same degree of fairness as basis functions
    of global support [Carr et al. 01]. It was shown by Duchon [Duchon 77] that the
    globally supported basis function $\varphi(r) = r^3$ yields a tri-harmonic function
    d, i.e., $\Delta^3 d = 0$. From variational calculus we know that it therefore
    minimizes the fairness


    ```

    $\int_{\mathbb{R}^3} \|d_{xxx}(\mathbf{x})\|^2 + \|d_{xy}(\mathbf{x})\|^2 + \dots
    + \|d_{zz}(\mathbf{x})\|^2 dx.$

    ```


    Notice that these functions are conceptually equivalent to the minimum variation
    of surfaces [Moreton and Séquin 92] and the tri-harmonic surfaces used in [Botsch
    and Kobelt 04], and therefore provide the same degree of fairness. The difference
    is that for tri-harmonic RBFs the energy minimization is "built in", whereas for
    surface-based approaches we explicit. The major drawback is that the global support
    of $\varphi(r) = r^3$ leads to a dense linear system (9.15), which is numerically
    harder to solve [Botsch and Kobelt 05].


    Note that as the constraints change, e.g., by interactively manipulating the handle,
    the linear system (9.15) has to be solved for each new right-hand side. For efficiency
    reasons one can factorize the matrix, and only compute a back-substitution for
    each new right-hand side [Golub and Loan 89]. As shown in [Botsch and Kobelt 05],
    when restricting to affine handle transformations one can precompute special basis
    functions, which can efficiently evaluated instead of solving (9.15). Moreover,
    evaluating these basis functions on the graphics card further accelerates this
    approach and provides real-time deformations of several million points per second.
