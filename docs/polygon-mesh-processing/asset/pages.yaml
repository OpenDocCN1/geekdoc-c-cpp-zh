    subdivision process [Szymczak et al. 02, Surazovsky and Gotsman 03, Allianz et
    al. 02, Surazhusky et al. 03].


    +   - In a regular mesh all vertices are regular. A regular mesh can compactly
    be represented as a 2D array that can be used for efficient rendering (a so-called
    *geometry image*) [Gu et al. 02, Sander et al. 03, Losasso et al. 03].


    Besides this topological characterization, the suitability of a remeshing algorithm
    usually depends on its ability to capture the global structure of the input geometry
    by aligning elements to the dominant geometric features. Since this corresponds
    to the alignment of entire submeshes, e.g., to global curvature lines of geometric
    primitives, it is strongly related to mesh segmentation techniques [Marinov and
    Kobbelt 06].


    Fully regular meshes can be generated only for a limited number of input models,
    namely those that topologically are (part of) a torus. All other models have to
    be cut into one or more topological disks before processing (and then the global
    regularity is broken at the seams). Furthermore, special care has to be taken
    to identify and handle the seams that result from cutting. Semiregular meshes
    are, in particular, suitable for multiresolution analysis and modeling [Zorin
    et al. 97, Guskov et al. 00]. Highly regular meshes require different techniques
    for multiresolution analysis, and they are well suited to numerical simulations.
    In particular, mesh compression algorithms can take advantage of the mostly uniform
    valence distribution and produce a very efficient connectivity encoding [Touma
    and Gotsman 98, Allianz and Desbrun 01, Kälberer et al. 05].'
