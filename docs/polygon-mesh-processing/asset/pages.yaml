    # 1.4 Implicit Surface Representations


    The basic concept of *implicit* or *volumetric* representations for geometric
    models is to characterize the embedding space of an object by classifying each
    3D point to either lie inside, outside, or on the surface $S$ that bounds a solid
    object.


    There are different representations for implicit functions, such as algebraic
    surfaces, radial basis functions, or discrete voxelizations. In any case, the
    surface $S$ is defined to be the zero-level isosurface of a scalar-valued function
    $F: \mathbb{R}^3 \rightarrow \mathbb{R}$. By convention, negative function values
    of $F$ designate points inside and positive value points outside the object. The
    zero-level isosurface $S$ contains the points exactly *on the surface*, separating
    the inside from the outside. An implicit surface does not have any holes as long
    as the defining function $F$ is continuous. Moreover, since an implicit surface
    is a level set of a potential function, geometric self-intersections cannot occur.
    This will be exploited for mesh repair (Chapter 8).


    As a consequence, geometric inside/outside queries simplify function evaluations
    of $F$ and checking the sign of the resulting value. This makes implicit representations
    well suited for constructed solid geometry (CSG), where complex objects are constructed
    by Boolean operations applied to geometric primitives (see Figure 1.8).


    ![](img/50d65c1816c68c45610a75b087632bd3_24_0.png)


    Figure 1.8. A complex object constructed by Boolean operations. (Image taken from
    [Botch et al. 06b]).'
