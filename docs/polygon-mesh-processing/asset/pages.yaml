    # 8.4 Surface-Oriented Algorithms


    In this section we describe some of the most common surface-oriented repair algorithms.
    These algorithms work directly on the input mesh and try to remove artifacts by
    explicitly modifying the geometry and the connectivity of the input.


    # 8.4.1 Consistent Normal Orientation


    Consistently orienting the normals of an input model is part of surface-oriented
    repair algorithms and can even improve the performance of volumetric algorithms.
    Usually the orientation of normals is propagated along a minimum spanning tree
    either in a preprocessing step or implicitly during traversal of the input [Hoppe
    et al. 92].


    Borodin et al. describe a more sophisticated algorithm that additionally takes
    visibility into account [Borodin et al. 04]. The input is a set of arbitrarily
    oriented polygons. In a preprocessing phase the polygons are assembled into larger,
    manifold patches (possibly with boundaries) as described in Section 8.4.3. The
    algorithm then builds a connectivity graph of neighboring patches where the label
    of each edge encodes the normal coherence of the two patches. Furthermore, for
    each side of patch, a visibility coefficient is computed that describes how much
    of the patch is visible when viewed from the outside. Finally, a globally consistent'
