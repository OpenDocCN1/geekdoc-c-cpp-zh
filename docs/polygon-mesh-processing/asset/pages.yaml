    # 8.4.3 Conversion to Manifolds


    Guziec et al. propose a method to remove complex edges and singular vertices from
    non-manifold input models [Guziec et al. 01]. The output is guaranteed to be a
    clean manifold triangle mesh, possibly with boundaries. As the algorithm operates
    solely on the connectivity of the input model, it does not suffer from numerical
    robustness issues. In a preprocessing phase all complex edges and singular vertices
    are identified by counting the number of adjacent faces. The input is cut along
    these complex edges into separate manifold patches. Finally, pairs of matching
    edges (i.e., edges that have geometrically the same endpoints) are identified
    and merged, if possible, in a topologically consistent manner.


    The scope of this algorithm is limited to the removal of complex edges and singular
    vertices. This, however, is done efficiently and robustly.


    # 8.4.4 Gap Closing


    A number of surface-oriented algorithms have been proposed to close the gaps and
    small overlaps that are typical for triangulated NURBS models. Barequet and Sharir
    proposed one of the first algorithms to fill gaps and remove small overlaps [Barequet
    and Sharir 95]. The algorithm identifies matching parts of the boundaries by a
    geometric hashing technique and fills the gaps by patching them with triangle
    strips or by the technique presented in Section 8.4.2.'
