  md: '# 1.6 Summary and Further Reading


    In this chapter we discussed the advantages and disadvantages of various mathematical
    geometry representations. The two major concepts of parametric vs. implicit representations
    have almost complementary strengths and weaknesses. Parametric surfaces can capture
    the finest detail, easy to sample, and can be modified intuitively but it is difficult
    to answer distance queries and topological changes require a major restructuring.
    On the other hand, topological changes and distance queries are easy for implicit
    surfaces but shaping editing is not straightforward and the geometric detail resolution
    depends on the voxel size.


    There is the approach of hybrid representations [Bischoff 05, Bischoff et al.
    05], which merges the two concepts such that the advantages of both can be combined.
    For example, an adaptive octree with a set of triangles stored in each voxel cell
    supports efficient distance queries as well as a high detail resolution.


    There are many other conversion techniques for further reading. Shen et al. [Shen
    et al. 04], e.g., have proposed an approach which converts a polygon soup into
    implicit surfaces, which can range from interpolating to approximating with adjustable
    smoothness and tolerance.


    Besides the approaches described here, which are most relevant for the techniques
    presented in this book, there are many other representations suitable for efficient
    geometry processing. Radial basis functions [Light 92] are a prominent example,
    as partition of unity implicits [Ohtake et al. 03] and point-based representations
    [Pauly 03, Kobbelt and Botsch 04]—just to mention a few.'
