  md: '# 3 DIFFERENTIAL GEOMETRY


    This chapter introduces some of the fundamental concepts of differential geometry.
    We focus on properties that are relevant for the geometry processing algorithms
    described in subsequent chapters and refer to standard textbooks as [do Carmo
    76] for proofs and an in-depth discussion. Differential geometry employs methods
    of differential calculus to describe local properties of smooth curves and surfaces.
    We will start our discussion with planar curves to provide some geometric intuition,
    before reviewing fundamental differential geometry concepts of smooth 2-manifold
    surfaces. The remainder of the chapter will be concerned with the extension to
    polygonal surfaces. In particular, we will present discrete curvature measures
    and give a derivation of the standard discrete approximation of the Laplace-Beltrami
    operator for triangle meshes.


    # 3.1 Curves


    We consider planar curves, that is, differentiable 1-manifolds embedded in $\mathbb{R}^2$.
    Such a curve can be represented in parametric form by a vector-valued function
    $x:[[a,b] \to \mathbb{R}^2$ with $\mathbf{x}(u)=(x(u),y(u))^T$ for $u \in[a,b]
    \subset \mathbb{R}$ (see Chapter 1). The coordinates $x$ and $y$ are assumed to
    be differentiable functions of $u$. The tangent vector $\mathbf{x}''(u)$ to the
    curve at a point $x(u)$ is defined as the first derivative of the coordinate function,
    that is $\mathbf{x}''(u)=(x''(u),y''(u))^T$. For instance, in point mechanics,
    the'
