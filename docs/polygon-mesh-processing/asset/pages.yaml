  md: '# SMOOTHING


    Building on the concepts of differential geometry and the discrete counter-parts
    introduced in Chapter 3, in this chapter we present mesh smoothing. On an abstract
    level, mesh smoothing is concerned with the design and computation of mesh functions
    $f: S \rightarrow \mathbb{R}^d$ on a triangle mesh. Due to this general version,
    mesh smoothing $f$ is a fundamental tool in geometry processing. The function
    $f$ can flexibly be chosen to describe, for instance, vertex positions, texture
    coordinates, or vertex displacements, such that the techniques introduced in this
    chapter can be used for mesh parameterization (Chapter 5), isotropic remeshing
    (Chapter 6), hole filling (Chapter 8), and mesh deformation (Chapter 9).


    We will discuss two aspects of mesh smoothing: *denoising* and *fairing*. Denoising
    is used to remove high-frequency noise from the function $f$. In most cases, $f$
    denotes the vertex positions, which might be corrupted by high-frequency noise
    due to a physical scanning process (see Figure 4.1). Removing the noise (the high
    frequencies) and keeping the overall shape (the low frequencies) requires generalizing
    the concepts of frequencies and low-pass filters to filtering on discrete triangle
    meshes. We will present the "mesh version" of Fourier transform and diffusion
    filters in Sections 4.1 and 4.2, respectively.


    Mesh fairly, discussed in Section 4.3, does not just smooth the function $f$ in
    order to remove the high frequency noise. It also smooths the function as much
    as possible in order to obtain, e.g., an as-smooth-as-possible surface patch or
    an as-smooth-as-possible shape deformation. "As smooth as possible" means that
    fairness energies have to be'
