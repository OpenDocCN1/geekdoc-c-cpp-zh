  md: "# 188 A. Numerics\n\nThe Jacobi method traverses these equations by one and\
    \ updates the value $x_i$ by rearranging equation $i$ and assuming all other variables\
    \ $x_j$ for $j \neq i$ to be known. This leads to the following simple update\
    \ rule:\n\n```\n$x_i^{(k+1)} = \\frac{1}{a_{i,i}} \\left( b_i - \\sum_{j \\neq\
    \ i} a_{i,j}x_j^{(k)} \\right)$\n```\n\nThe complete algorithm for a simple Jacobi\
    \ solver can be summarized by the following pseudocode:\n\n```\nwhile ($|\\mathbf{x}^{(k)}\
    \ - \\mathbf{b}\\| < \\epsilon$) and ($k < k_{max}$)\n  for $i$ from 1 to $n$\n\
    \    $x_i^{(k+1)} = (b_i - \\sum_{j \\neq i} a_{i,j}x_j^{(k)}) / a_{i,i}$\n  end\n\
    \  k = k + 1\nend\n```\n\n$\\epsilon$ denotes the precision specified by the user\
    \ and $k_{max}$ the maximum number of iterations. Note that the computation of\
    \ $x_i^{(k+1)}$ does not make use of the already available new values $x_1^{(k+1)},\
    \ \\dots, x_{i-1}^{(k+1)}$. Taking into account the update rule of the Gauss-Seidel\
    \ method:\n\n```\n$x_i^{(k+1)} = \\frac{1}{a_{i,i}} \\left( b_i - \\sum_{j=1}^{i-1}\
    \ a_{i,j}x_j^{(k+1)} - \\sum_{j=i+1}^{n} a_{i,j}x_j^{(k)} \\right)$\n```\n\nIt\
    \ is easy to see that the Gauss-Seidel method needs one copy of the solution vector\
    \ $\\mathbf{x}$, which is successively overwritten, whereas the Jacobi method\
    \ has to store the current state $(k)$ and the next state $(k+1)$. However the\
    \ Gauss-Seidel method depends on the order of variables $x_i$ and is inherently\
    \ serial, whereas a Jacobi solver is order-independent and can trivially be parallelized.\n\
    \nAs seen from the pseudocode, both algorithms are not applicable to matrices\
    \ with zero values on the diagonal. More specifically, it is possible to provide\
    \ a sufficient condition for convergence. If the $diagonal$ dominant,$ i.e.,\n\
    \n```\n$|a_{i,i}| > \\sum_{j \\neq i} |a_{i,j}| \\quad \\forall i = 1, \\dots,\
    \ n,$\n```\n\nthen the algorithm converges.\n\nThe main advantage of the Jacobi\
    \ and Gauss-Seidel methods are their extreme simplicity from the implementation\
    \ point of view, as they do not even require a sparse matrix data structure (see\
    \ [Taubin 95, Floater and Hermann 05]). Their main disadvantage, however, is the\
    \ slow convergence"
