    # 2.5 Summary and Further Reading


    Carefully designed data structures are central for geometry processing algorithms
    based on polygonal meshes. For most algorithms presented in this book we recommend
    halfedge data structures, or directed-edge data structures as a special case for
    triangle meshes. While implementing such data structures may look like a simple
    programming exercise at first glance, it is actually much harder to achieve a
    good balance between versatility, memory consumption, and computational efficiency.
    For these reasons we recommend using existing implementations that provide a number
    of generic features and have been matured over time. Some of the publicly available
    implementations include CGAL¹, OpenMesh², and MeshLab³.


    For a detailed overview and comparison of different mesh data structures we refer
    the reader to [Kettner 99], and to [Floriani and Hui 03] for data structures for
    non-manifold meshes. For further reading there are a number of data structures
    that are specialized for a variety of tasks and size of data, such as processing
    massive meshes [Isenberg and Lindstrom 05] and view-dependent rendering of massive
    meshes [Cignoni et al. 04]. Finally, we point the reader to data structures that
    offer a trade-off between low memory consumption and full access [Kallmann and
    Thalmann 01, Aleardi et al. 08].


    ¹CGAL: http://www.cgal.org


    ²OpenMesh: http://www.openmesh.org


    ³MeshLab: http://www.meshlab.org'
