  md: "# 9.3. Multi-Scale Deformation\n\nWhile the normal vector $\\mathbf{n}_i$ is\
    \ well defined, it is not obvious how to compute the tangent angles $\\mathbf{t}_{i,1}$\
    \ and $\\mathbf{t}_{i,2}$. One heuristic is to choose $\\mathbf{t}_{i,1}$ as the\
    \ projection of the first edge incident to $\\mathbf{p}_i$ into the tangent plane\
    \ and pick $\\mathbf{t}_{i,2}$ to be orthogonal to $\\mathbf{n}_i$ and $\\mathbf{t}_{i,1}$.\n\
    \n# 9.3.2 Normal Displacements\n\nAs we see next, long displacement vectors might\
    \ lead to instabilities, in particular for bending deformations. As a consequence,\
    \ the displacement vectors should be as short as possible, which is the case if\
    \ they connect vertices $\\mathbf{p}_i \\in \\mathcal{S}$ to their closest surface\
    \ points on $\\mathcal{B}$ instead of their corresponding vertices $\\mathbf{b}_i\
    \ \\in \\mathcal{B}$.\n\nThis idea leads to normal displacements that are perpendicular\
    \ to $\\mathcal{B}$, i.e., parallel to its normal field $\\mathbf{n}(\\mathbf{b})$:\n\
    \n```\n$$\\mathbf{p}_i = \\mathbf{b}_i + h_i \\mathbf{n}_i, \\quad h_i \\in \\\
    mathbb{R}$.$\n```\n\nSince the per-vertex displacements $\\mathbf{h}_i$ of (9.8)\
    \ are not in general particular to the surface normal $\\mathbf{n}_i$, displacements\
    \ require a re-sampling of either $\\mathcal{S}$ or $\\mathcal{B}$. Shooting rays\
    \ in normal direction from each base vertex $\\mathbf{b}_i \\in \\mathcal{B}$\
    \ and deriving new vertex positions $\\mathbf{p}_i$, as their intersections with\
    \ the latter surface $\\mathcal{S}$ is likely a resampling of (Guskov et al. 00,Lee\
    \ et al. 00). Because $\\mathcal{S}$ might be a deated surface with high-frequency\
    \ features, such a resampling is likely to introduce alias artifacts.\n\nHence\
    \ we go the other direction, following [Kobbelt et al. 99b]. For each point $\\\
    mathbf{p}_i \\in \\mathcal{S}$, a local Newton iteration finds a base point $\\\
    mathbf{b}_i \\in \\mathcal{B}$ such that $(\\mathbf{p}_i - \\mathbf{b}_i)$ is\
    \ parallel to the surface normal $\\mathbf{n}_i = \\mathbf{n}(\\mathbf{b}_i)$.\
    \ Note that $\\mathbf{b}_i$ is now an arbitrary point on $\\mathcal{B}$ (not necessarily\
    \ a vertex). This is contained in a triangle $(\\mathbf{a}, \\mathbf{b}, \\mathbf{c})\
    \ \\subset \\mathcal{B}$ and therefore can be represented by barycentric interpolation\
    \ (see Equation (1.3)):\n\n```\n$$\\mathbf{b}_i = \\alpha \\mathbf{a} + \\beta\
    \ \\mathbf{b} + \\gamma \\mathbf{c}$.$\n```\n\nIts normal vector $\\mathbf{n}_i$\
    \ is computed by barycentric interpolation of the vertex normals, similar in concept\
    \ to Phong shading\n\n```\n$$\\mathbf{n}_i = \\frac{\\alpha \\mathbf{n}_a + \\\
