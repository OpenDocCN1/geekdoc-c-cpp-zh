  md: '# 6.6. Quad-dominant Remeshing


    context of surface remeshing, the main issue with this paradigm is the lack of
    control over the orientation and alignment of the edges as well as the mesh regularity.


    +   - Conversion. One way to generate quadrangle meshes is first generate a triangle
    or polygon mesh, then convert it to a quadrangle mesh. Examples of such approaches
    commonly proceed by pairwise triangle merging and 4-8 subdivision, or by bisection
    of hex-dominant meshes followed by barycentric subdivision [Boier-Martin et al.
    04]. As for quadrangulation of point sets, this approach provides the user with
    little control over the orientation and alignment of the mesh edges.


    +   - Curve-based sampling. One way to control the edge alignment and orientation
    of the mesh edges is to place a set of curves that are everywhere tangent to direction
    fields. The vertices of the final mesh are obtained by intersecting the networks
    of curves. When using lines of curvatures, the output meshes are quad-dominant,
    although not pure quadrangle meshes as T-junctions appear due to the greedy process
    used for tracing the lines of curvatures. Another curve-based approach consists
    of placing a set of minimum-bending curves [Marinov and Kobbelt 06].


    +   - Contouring. When quadrangle meshes are sought after (with T-junctions),
    a robust approach consists of computing two scalar functions and extracting a
    quadrangle tiling by contouring these functions along well-chosen isovals.


    We restrict ourselves to the approaches based on curve-based sampling and refer
    to Chapter 5 for methods based on contouring, as they are very close to parameterization
    techniques.


    # 6.6.1 Lines of Curvatures


    The remeshing technique introduced by Alliez et al. generates a quad-dominant
    mesh that reflects the symmetries of the input shape by sampling the input shape
    instead of the usual points [Alliez et al. 03a] (see overview in Figure 6.15).


    The algorithm comprises three stages. The first stage recovers a continuous model
    from the input mesh by estimating 3D curvature tensor per vertex (see Chapter
    3). The normal component of each tensor is discarded, and a 2D piecewise curvature
    tensor field is built after computing a discrete conformal parameterization. This
    tensor field is then filtered by linear convolution with a Gaussian kernel to
    obtain smoother principal curvature directions. The singularities of the tensor
    field (the umbilics) are also extracted. (See Figure 6.16.)'
