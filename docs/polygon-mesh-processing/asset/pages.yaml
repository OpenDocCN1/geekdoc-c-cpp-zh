  md: '# 178


    # 9. Deformation


    Nonlinear surface deformation. Pyramid coordinates (see [Sheffer and Kraevoy 04,
    Kraevoy and Sheffer 06]) can be considered nonlinear versions of Laplacian coordinates,
    leading to differential coordinates invariant under rigid motions, which can be
    used for deformation as well as for morphing.


    Huang et. employ a nonlinear version of the volumetric graph Laplacian, which
    also features nonlinear preservation constraints [Huang et. 06]. In order to increase
    the performance and efficiency of their optimization, they use a subspace approach:
    the original mesh is embedded in a coarse coarse grid (see Section 9.5.2), and
    the optimization is embedded in the cage vertices c, while considering the constraints
    from the original mesh vertices p, in a least-squares manner.


    An alternative approach to subspace methods is the handle-aware technique of [Au
    et. 07]. In a preprocessing step one constructs a set of iso-lines of the geodesic
    distance from the fixed regions or the handle regions, similar in spirit to [Zayer
    al. 05a]. For each of these iso-lines, a local transformation M, for a Laplacian-based
    deformation is found by a nonlinear optimization. The number of required iso-lines
    is relatively small, which guarantees an efficient numerical optimization and
    allows for interactive editing.


    Shi et. combine Laplacian-based deformation with skeleton-based inverse kinematics
    [Shi et. 07]. Their approach allows for easy and intuitive character posing, featuring
    control of lengths, rigidity, and joint limits, but in it turns a complex cascading
    optimization for the involved nonlinear energy minimization.


    PriMo [Botsch et. 06a] is a nonlinear version of the shell-based minimization
    of bending and stretching energies. The surface is modeled as a thin layer of
    triangular prisms, which are coupled by a nonlinear elastic energy. During deformation
    the prisms are rigid, which allows for a robust geometric optimization. A hierarchical
    optimization is used to increase the computational efficiency.


    The as-rigid-as-possible surface deformation of [Sorkine and Alexa 07] models
    local rotations in terms of each vertex''s one-ring. An easy-to-implement alternating
    optimization solves for the local rotations and the new vertex positions.'
