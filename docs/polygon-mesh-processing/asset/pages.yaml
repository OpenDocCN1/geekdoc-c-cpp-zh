  md: 'LU. Although our linear systems are spd, we also compare to the popular SuperLU
    solver [Demmel et al. 99], which is based on a sparse LU factorization.


    All timings were taken on a 3.0 GHz Pentium4 running Linux.


    Iterative solvers (CG, MG) have the advantage that the computation can be stopped
    as soon a sufficiently small error is reached, which—in typical computer graphics—does
    not have to be the highest possible precision. In contrast, direct methods ($LL^T$,
    LU) always compute the exact solution to numerical round-off errors, which in
    our application examples was more precise than required. The stopping criteria
    of the iterative methods were therefore chosen to yield results comparable to
    that achieved by direct solvers. Their residual errors were allowed to be by one
    order of magnitude higher than those of the direct


    Table A.1 shows timings for the different solvers on Laplacian systems $\Delta
    x = \mathbf{b}$ for 10k-50k and 100k-500k unknowns. For each solver columns of
    columns are:


    +   - Setup. Computing the cotangent weights for the Laplace discretization and
    building the matrix structure (done per-level for MG).


    +   - Precomputation. Preconditioning (CG), computing the hierarchy by mesh decimation
    (MG), matrix reordering and factorization ($LL^T$, LU).


    +   - Solution. Solving the system for three different right-hand sides corresponding
    to the $x$, $y$, and $z$ components of the free vertices **x**.


    Due to its effective preconditioner, the iterative solver scales almost linearly
    with the system complexity. However, for large and ill-conditioned systems, it
    breaks down. Notice that without preconditioning the solver would not converge
    for the larger systems.


    The experiments clearly verify the linear complexity of multigrid and sparse direct
    solvers. Once their sparse factorizations are pre-computed, the computational
    costs for actually solving the system are the same for the LU and Cholesky solver.
    However, they differ significantly in the factorization performance because the
    numerically more robust Cholesky factorization allows where pivoting is required
    for the LU factorization to guarantee robustness.


    Interactive applications often require the solution of the same linear system
    for multiple right-hand sides (e.g., once per frame), which typically reflects
    the change of boundary constraints due to user interaction. For'
