  md: '# Preface


    many different areas of computer graphics and geometry processing. In computer-aided
    geometric design (CAGD), triangle and polygon meshes developed into a valuable
    alternative to traditional surfaces since their conceptual simplicity allows for
    flexible and highly efficient processing. Moreover, the consequent use of polygon
    meshes as a surface representation avoids error-prone conversions (e.g., from
    CAD surfaces to mesh-based input data). Besides geometric modeling, other areas
    frequently employing polygon meshes are computer games and movie production. In
    this context, geometric models acquired by 3D scanning techniques typically have
    to undergo postprocessing and shape optimization techniques before being used
    in production.


    This book discusses the geometry processing pipeline based on polygon meshes,
    as illustrated on the right. For the instructive purposes of this book, the order
    in which topics are described deviates from the typical processing order shown
    in the figure. We first discuss general concepts of surface representations in
    Chapter 1 and highlight the advantageous properties of polygon meshes for geometry
    processing. Chapter 2 presents efficient data structures for the implementation
    of polygon meshes. Chapter 3 introduces fundamental concepts of differential geometry
    and gives derivations for their discrete analogs. These form the basis of algorithms
    for mesh smoothing (Chapter 4) to reduce noise in scanned surfaces by generalizing
    signal processing techniques to irregular polygon meshes. Chapter 5 introduces
    different methods for computing surface parameterizations that are essential in
    many geometry processing tasks. General


    ![](img/50d65c1816c68c45610a75b087632bd3_10_0.png)


    Figure 1. Geometry processing pipeline. (Image from [Botsch et al. 06b])'
