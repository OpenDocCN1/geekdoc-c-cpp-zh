  md: '# 7.4 SUMMARY 231


    # KEY IDEAS TO REMEMBER


    The goal of this case study was to examine what could happen when project managers
    focus too much on their short-term project success without attempting to identify
    and mitigate risk conditions that might prevent long-term project success. Decision
    makers need to remember the following:


    +   * Managing risks explicitly on software projects is very important. Identifying
    and mitigating risk directly correlates to project success.

    * Risk management is an activity that should be conducted throughout the project.
    Thinking about risk early in a project provides decision makers with more options
    and time to deal with potential problems.

    * Project success needs to be defined in a way that enables decision makers to
    understand what might be being successful (that is, risks). This threshold of
    success should be the criteria against which project actions are evaluated. Actions
    that directly contribute to project success should be performed, and those that
    detract from it should be avoided.


    # 7.4 Summary


    The chapter discussed the following activities for managing risk in the context
    of decision making for a software project:


    +   * Defining a threshold of success

    * Identifying risks

    * Formulating risk statements

    * Mitigating, tracking, and controlling risk

    * Trading off in making decisions about how to manage risk


    The case studies focused on how poor or no risk management can lead to problems.
    The first case, "SEWeb and Rosoft Technologies,” involved unexpected problems
    encountered while working with an offshore development team located in Russia.
    The second case, “Falcon Edutainment and the RiskSim Project,” presented a project
    whose troubles stemmed from the client-developer interaction. The software project
    managers in both cases considered schedule and budget in making decisions,'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'but they did not identify, evaluate, and mitigate the risks associated with
    their decisions.


    Software project managers frequently do risk management in a haphazard way or
    simply ignore it. The case studies highlighted project risks that could have been
    identified and managed but were not. The resulting project problems are classical
    examples of project risk conditions that can be disastrous if they are not managed.
    Risk management is an integral part of evaluating and making project decisions.


    Risk management is an ongoing event in the life of a software project and, when
    not done correctly or at all, can lead to disastrous results.'
