  md: '# CHAPTER 10 MANAGING GLOBAL DEVELOPMENT


    not always strictly followed in terms of keeping related functions together in
    a welldefined layer, if not most products involved in telecommunication make an
    attempt to describe themselves in relation to the OSI model. It is also valuable
    as a single reference view of communication that furnishes everyone common ground
    for education and discussion (Searchnetworking.com, OSI).


    **Packet-switched:** The type of network where relatively small units of data
    called packets are routed through a network to the destination address contained
    within each packet. Breaking communication down into packets allows the same data
    path to be shared among many users in the network. This type of communication
    between sender and receiver is known as **connectionless** (rather than directed).
    Most traffic over the Internet uses packet switching. The Internet is basically
    a connectionless network (Searchnetworking.com, Packet-switched).


    **V of software development:** A software development approach that focuses on
    the verification and validation (V&V) of a software system at each stage in the
    software development process. Two objectives to be accomplished by following a
    V Model are to discover defects in a software system as early as possible and
    to assess whether the system is usable in an operational situation (Graphical
    Development of Standards and Technologies Assistant).


    **VoIP:** The transmission of voice over packet-switched IP networks (National
    Institute of Standards and Technologies 2005).


