  md: '# CHAPTER 9 MANAGING STAKEHOLDER EXPECTATIONS


    term. For developers, the stakeholder is the customer/user/manager entity. For
    the customer/user, the stakeholder might be the person who in turn buys the software
    from them. For the manager, the stakeholder is the customer/user/team/boss entity.
    Because of the many different types of stakeholders, managing stakeholder expectations
    on a project is a daunting task. Start by selecting a point view. For the purpose
    of this chapter, the point of view will be that of the software project manager.


    The project manager is primarily concerned about three main groups: customer/user,
    the software development team, and the boss. Each of these stakeholders has a
    sets of expectations. Some of their expectations overlap, and Table 9-1 summarizes
    the key expectations for each of the three stakeholder groups for a software project.
    These expectations are not intended to be a complete set and may seem to be self-centered,
    overly optimistic, and unrealistic. Throughout the rest of this chapter, we will
    discuss the project decisions that affect stakeholder expectations over the life
    of the software project. Conversely, we will also discuss ways to better analyze
    stakeholder expectations and their impact on project decisions.


    Table 9–1: Stakeholder Group Expectations for a Software Project


    | Stakeholder Group | Stakeholder Expectations |

    |---|---|

    | Customer/user | The product will be available tomorrow or soon. The product
    will work out of the box. The product will solve all of my problems. The product
    will not cost more than what was budgeted. |

    | Developers | The product is doable with the skills available. The scope changes,
    if any, will be reasonable. The work will be interesting. The team will get the
    resources it needs. |

    | Management | The project will be completed on time. The project will cost less
    than expected. The customer will not call with any problems. The project manager
    will not ask for more resources. |'
