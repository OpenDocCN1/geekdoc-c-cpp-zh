  md: '# 3.2 Context 69


    Table 3–1: Descriptions of Activities in Managing Estimates


    | Activity | Description of Activity |

    | Understanding requirements | **Definition:** Process of understanding the problem
    in sufficient detail to scope all the pieces needed. **Target outcome:** A sufficient
    understanding that the problem can be stated and the majority of the stakeholders
    believe the statement covers the problem. |

    | Conceptually designing a solution | **Definition:** A solution that is sufficiently
    detailed to allow for partitioning the problem into smaller pieces, but not so
    changed and to make commitments to a solution that cannot be changed. Might require
    prototypes to understand the major issues with a solution. **Target outcome:**
    Sufficient understanding of “a solution” that resources can be allocated to a
    problem. |

    | Performing element-wise decomposition (divide) | **Definition:** Breaking down
    a problem into key parts that can be understood and estimated. **Target outcome:**
    A basic “work breakdown” structure that can be used for understanding dependencies
    and also relationships between logical elements of a solution. |

    | Allocating resources from the bottom-up (conquer) | **Definition:** The assignment
    of resource needs for each component in a solution. **Target outcome:** All components
    are allocated a place in the solution and are understood in relation to other
    components in the system. The result is a relational hierarchy of how the system
    can be built. |

    | Allocating overhead | **Definition:** The allocation of the resources to manage
    the overall development process for this project. This typically would management
    cost and reserves and the cost of infrastructure modifications needed to support
    the project. **Target outcome:** The additional indirect costs associated with
    the project are understood and allocated to the project. |


    Continues'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# ### Table 3–1: Descriptions of Activities in Managing Estimates (Continued)


    | Activity | Description of Activity |

    | --- | --- |

    | Estimating construction | **Definition:** Creation of an estimate “plan” in
    which all the components of an estimate are identified, defined, and assigned
    values.<br>**Target outcome:** All values for the elements of the estimate are
    entered into the plan. The assumptions and risks associated with the decisions
    about estimates are identified. |

    | Estimating change management | **Definition:** Changes to the estimate are tracked
    as gained and assumptions are verified or decisions are invalidated. The changes
    are made, and new components are created.<br>**Target outcome:** An estimate that
    accurately reflects what is known in time and is usable as a model for future
    similar |


    When performing the activities of managing estimates, you may need to consider
    multiple dimensions of stakeholder expectation at the same time. In other words,
    you may have to estimate aspects of projects that are related but not the same,
    such as scope quality versus budget (cost) versus schedule (time). Trade-offs
    of the different dimensions of stakeholder expectation makes estimation decisions
    difficult and complicated.


    Another helpful approach when managing estimates is to view estimates as snapshots
    in time. As soon as you have more information, you should consider updating your
    estimates. Even global positioning systems acquire information on a regular basis
    to update your estimates. With his famous “cone of uncertainty,” McConnell (2006)
    explained that the only way to increase “certainty” is to move in time toward
    the solution. As McConnell suggested, you cannot improve the estimate by staying
    with your current knowledge. Likewise, Cohn (2005) states that trying harder at
    the same point may only reduce the value of your estimate. Therefore, we propose
    that you estimate early and often.


