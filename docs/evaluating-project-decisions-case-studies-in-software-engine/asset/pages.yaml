    # CONCLUSIONS


    In this case study, the client''s expectations changed as the project progressed
    because the client did not see evidence of a software implementation as quickly
    as he expected. The change in the client''s expectations concerned the process
    by which the client expected the product team to determine a viable solution.
    The team became aware of the client''s expectations regarding this process when
    the client insisted that the team solve the problem by constructing an implementation
    of his own design. This happened after the team had spent significant time studying
    communication protocols to determine their potential use in the solution. Later
    when the team had problems developing an implementation that would satisfy the
    requirements for performance and reliability, the client said that he had already
    implemented a solution on his design that was simple to do. The team questioned
    the client''s purpose for the project.


    From these facts, you could conclude that the team was not effective in managing
    the client''s expectations. At the beginning of the project, the team did not
    address the risk associated with the assumption that a satisfactory software implementation
    based upon modification of the UDP protocol was feasible. The team did not discuss
    this risk with the client and thereby missed the opportunity to set the client''s
    expectation for how the project should proceed if the planned solution was found
    not to be feasible. The team also did not set the client''s expectation for the
    process that it would use to explore alternative solutions and for the importance
    of studying existing communication protocols to determine their potential for
    use in the solution.


    The client did not satisfy his responsibilities to provide requested information
    in a timely manner and to inform the team of project-related issues. Communications
    between the client and team were not transparent and clear. Trust between the
    client and team decreased as the project progressed. The team questioned the client''s
    motives for the project. The client''s perception of the team''s accomplishments
    may not match reality. The team still has the opportunity to correct the client''s
    perception as well as to influence the client''s expectations and satisfaction
    regarding the value of the project. The team will need to explain the facts in
    an objective and unemotional way to the client and provide options that would
    require the client to make transparent exactly what he originally wanted to accomplish
    with the project and what he would like to do now. The state of the ongoing communications
    will likely help make or break this project.'
