    # Case Summary


    # DESCRIPTION


    This case deals with consultants who have been called into a bank to help with
    general software engineering principles for all the developers. The person who
    asked the consultants to come and who was a former student of the consultants
    ask them to evaluate one of their projects and provide ways to ''improve'' what
    they are doing. The bank has evolved through an era in which traditional, though
    now outdated, software development practices became standard at the bank. For
    example, the bank''s software projects usually follow the traditional waterfall-like
    view of software development (Royce 1970) with the ''added benefit'' that developers
    work alone. The developers do not see projects as team efforts but as individual
    efforts that collectively make the project successful. New Agile methods that
    emphasize cooperation among developers are being adopted slowly, but some of senior
    developers are resistant to process changes. The organization''s culture of working
    alone has been difficult to change, especially when project managers try to introduce
    new processes, such as Agile approaches, in which two people work together on
    one console (Beck 1999).


    In particular, the sponsor for the consultants wants to know how he can get more
    of his senior engineers involved in process improvement efforts and whether the
    processes that his team are using can be improved to help all engineers better
    participate in the effort. He can see that the ''senior'' engineers are not comfortable
    with the techniques being proposed as the ''new'' engineers.'
