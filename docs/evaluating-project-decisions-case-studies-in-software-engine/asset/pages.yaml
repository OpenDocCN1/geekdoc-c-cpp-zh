  md: 'You have to be able to answer the following three questions in order to answer
    the age-old children’s question on automobile trips (“When will we get there?”):


    +   - How far did we go to originally (problem)?

    - How have we traveled so far (experience)?

    - How are we going now, or what is our average speed (knowledge)?


    The first question in the trip analysis concerns the topic of scope. That is,
    how far do you plan to travel? The second question is a project-tracking issue.
    What have you done with the time you have spent? In other words, what distance
    have you traveled? You can also use the distance traveled and time to generate
    your “average” velocity (assumption). Knowing the velocity, you can “assume” that
    everything remains the same, then the distance left to travel by the velocity
    is the time you have left (solution). You can use this time to estimate the remaining
    schedule for the project.


    Many of the Agile methods specifically call this “calculating the velocity of
    the team.” These Agile methods combine the estimation, tracking, and planning
    steps into one action. This can be useful if it is understood.


    The following is how to apply the PEAK model to determine a time estimate:


    +   (P) Problem: How long will it take?

    (E) Experience: How much have you done?

    (A) Assumptions: You can keep doing things at the same rate.

    (K) Knowledge: How much did you have to do when you started?


    # Estimating Quality for Project


    Quality is the fourth dimension you need to estimate for a project. The question
    is, “What type and degree of quality is right for your project?” You need to consider
    the level of quality that your project can afford. People have a tendency in software
    to trade quality for time. For example, people trade testing to ship a product
    on time. This is a direct trade-off. You also have indirect trade-offs such as
    cutting inspection or reviews from the development process to save time.


    The following is how to apply the PEAK model to decide upon the right quality
    for a project:


    +   (P) Problem: How much quality is needed to support this project?

    (E) Experience: What processes are in place to support the effort?

    (A) Assumptions: You know that this level of effort is correct for this project.

    (K) Knowledge: What have you done in the past that has worked?'
