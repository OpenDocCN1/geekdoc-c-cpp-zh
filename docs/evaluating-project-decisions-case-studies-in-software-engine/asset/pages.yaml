  md: '# Making Decisions About Process


    You cannot control what you cannot measure Process goes in hand with improvement.
    If your projects are running perfectly and you see no need to change anything,
    you don''t have to worry about process obviously you have good processes. But
    if your project is like many other software projects, the results are not always
    acceptable, and things are always changing. As the saying goes, "The only thing
    consistent is change." Therefore, if you are making changes, you want to make
    sure the changes are improvements; and you can''t improve your process if you
    can''t measure it. So, decisions made about process usually focus on how to evaluate
    its effectiveness.


    An important concept is that process and product can be viewed as two sides of
    the same coin. For this discussion, process consists of the artifacts that compose
    the output of a project. They can be customer or manager focused. The execution
    of a process results in a result. Most of the time, the quality of the product
    is highly dependent on how the process is followed. People who insist on focusing
    on only product or only process are cheating themselves. People who deal with
    software, software development effort involves compromise. The software stakeholders
    make decisions regarding one alternative or another because of a slight advantage.
    The choice of how much effort goes into managing the process and how much goes
    into making the product is a compromise at the project level. Project managers
    are constantly making decisions regarding the resources needed to manage progress
    and regarding what and how to measure that the project delivers the product to
    the customer. The process resources include variables as people''s time, reports,
    and reviews. Every project must decide which and how many resources to expend.


    Schedules are key factors in making project decisions and are likewise dominant
    in making process decisions regarding how to execute the project in order to produce
    acceptable project deliverables on time. Process can serve as a defect filter
    that can reduce complexity while improving quality. When selecting processes to
    be followed are deciding how many "issues" they would like to filter out as soon
    as possible within the project. The right amount of process is always a balancing
    act to manage effort and time while attaining the proper effect on the product.
    Usually this balancing act is directly related to quality (that is, zero defects),
    but most project managers have given up on the idea of process nirvana and strive
    for minimal rather than zero defects.


    Process decisions often involve the search for ways to improve project speed through
    efficiency and productivity. One of the major decisions a project manager has
    to make is how much new process technology the team can handle. Many projects
    have suffered from the introduction of new support tools, languages, and hardware
    that is supposed to make the team more efficient, faster, smarter, and able to
    leap'
