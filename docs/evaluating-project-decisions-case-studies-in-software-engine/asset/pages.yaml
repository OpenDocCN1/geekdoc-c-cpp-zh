  md: '# CHAPTER 2 MANAGING REQUIREMENTS


    In general, changes in the requirements for a software project are beneficial
    when they improve the clarity, compatibility, completeness, consistency, or correctness
    of the requirements. It is important that the software project stakeholders carefully
    consider the impact of a change regarding the scope, time, quality, and cost of
    the deliverables before deciding to make the change. Obviously, changes that increase
    the scope of the requirements for the software project deliverables run the risk
    of overshooting the budget or schedule of a software project.


    The main idea to keep in mind is that changing the software requirements involves
    a cost-benefit trade-off; there is a cost associated with the resources and time
    needed to handle the change as well as a potential benefit. The primary decisions
    that project stakeholders must make are whether the software budget can support
    the cost of a particular change and whether the business benefit associated with
    the software is worth the cost (including time). Stakeholders must weigh the benefit
    versus the cost of a particular change in the software requirements. The software
    managers should help the project stakeholders decide whether including the change
    later than in a currently planned release of the software yields better value.
    The stakeholders may need to reevaluate and make new decisions about the project
    agreements to accommodate changes in the requirements.


    We''ll now a moment to apply the PEAK model when making a decision regarding a
    feature to the requirements for a software project''s deliverables. Suppose that
    the customer for a robotic surgical assistant requests the addition of a new software
    algorithm after the project agreements have been established. Using the PEAK model,
    the software developers can ask questions such as following to help the customer
    decide whether the benefit of adding this feature weighs the cost:


    +   (P) Problem: Should the software project stakeholders expand or modify the
    requirements to include the new software algorithm?


    +   (E) Experience:


    +   - How difficult or will it be to develop and integrate the new algorithm (with
    respect to process, staff, time, quality, and so on)?


    +   - How difficult or will it be to verify and validate the software with the
    new algorithm (with respect to process, staff, time, quality, and so on)?


    +   (A) Assumptions: What aspects of the algorithm should be established rather
    than assumed? For instance, the project stakeholders should determine whether
    the following assumptions are factual:


    +   - This algorithm will be the most appropriate one for the foreseeable future.
    In other modes, there is no other better algorithm that will be available in the
    near future.


    +   - The algorithm will not interfere with or be incompatible with the other
    requirements.'
