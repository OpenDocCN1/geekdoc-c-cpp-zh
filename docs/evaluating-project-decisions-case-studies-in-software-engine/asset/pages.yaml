    # CONCLUSIONS


    As you examine the assumptions that you have to make to produce estimates, you
    need to be aware of when assumptions are directly in opposition to the solutions
    or options produced by your decisions. You want to minimize the assumptions that
    increase the risks to the solutions or verify the assumptions and convert them
    into knowledge. The chapter discussion shows that assumptions are the largest
    generator of bad decisions. You'
