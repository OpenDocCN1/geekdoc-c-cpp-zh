    # CONCLUSIONS


    As you can see from the results of the project, the process seemed to deliver
    the right quality, to meet stakeholder expectations, to handle the requirements,
    and to deliver a product that worked. This process crosses many of the domains
    discussed in this book and is sometimes hard to separate from other aspects of
    software management. Decisions concerning process affect not only the development
    team but everyone involved in the project. As a manager, you must not only make
    a process visible but also teach, use, and measure it to ensure that the process
    is always improving or doing the job that is expected. People often have the attitude
    that something has always been done a certain way, they are going to do it the
    same way. Processes need to evolve in a systematic, disciplined manner to satisfy
    project expectations.


    # KEY IDS TO REMEMBER


    +   - Process and product are related, but they are not the same thing.


    +   - Decisions to introduce the right amount of process are dominated by the
