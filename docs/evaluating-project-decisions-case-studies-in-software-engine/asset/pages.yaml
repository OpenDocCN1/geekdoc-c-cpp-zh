    # Managing Process


    # 6.1 Chapter Objectives


    After reading and thinking about the concepts and case studies presented in this
    chapter, you will be able to do the following:


    +   * Recognize the key issues involved with process management

    * Understand the relationship between product and process

    * Understand the key factors that influence process in the eyes of the stakeholders

    * Recognize factors that can significantly improve the development process with
    minimal cost

    * Understand that process is not a dirty word


    # 6.2 Context


    A process is a set of steps with purpose. A process is a framework for action
    whose goal is to achieve a well-understood goal in a repeated fashion. A process
    consists of a set of actions or tactics to achieve the goal. A process is also
    a set of steps that standardizes the production of a product. Humphrey (1989)
    defines process as a set of tasks that, when properly performed, produce the desired
    result. In other words, a process can help you produce a product and also serve
    as a filter to ensure that defects do not get into the product we are creating.


    Viewing process as a filter enables a project to remove defects early when the
    cost is lower. We all know about the 10-to-1 cost when software defects are allowed'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'to migrate into later phases of development. It is important that defects are
    encapsulated or removed before they spread out. If not contained or removed, they
    "infect" other code and are therefore harder to remove. The processes that you
    use serve as a uniform, disciplined way to remove these defects so that the later
    phases of the project are not delayed because of the need for bug fixing. The
    process can save the engineer from having to spend time rework.


    To use the development process as a quality filter for the results of your software
    project tasks, you need to be able to perform the following activities to manage
    the processes used by the project members: define or select the process, measure
    the process, evaluate the process effectiveness, and change the process to improve
    its effectiveness. project member who uses a process should be able to perform
    the following activities: understand the process, execute the process, evaluate
    the results of executing the process, and understand how to change the execution
    of process results.


    As you examine this chapter, you will look at the decisions that a manager must
    make to influence or instantiate process in a software development effort. How
    you use the PEAK model to make decisions will impact the activities performed
    by the project team. Table 6-1 presents what-if questions to answer when evaluating
    and making process decisions. For each what-if question, can you determine whether
    the PEAK input statements are true. Study the table, and think about how you would
    answer these questions to manage process for your current software project.


    # Table 6-1: Managing Process Decisions Using PEAK


    | Activity | PEAK Inputs |

    |---|---|n| Understand the process | **(P) Problem:** How will the process benefit
    the project?<br>**(E) Experience:** Is this right process for the people working
    on the project?<br>**(A) Assumptions:** Is the assumption that there is not a
    better process to use true?<br>**(K) Knowledge:** Do you know whether the process
    will lead to the generation of a product that is usable? |

    | Execute the process | **(P) Problem:** What has to be done to make the process
    work?<br>**(E) Experience:** Do you know how this process works and whether the
    target product can be produced by using this?<br>**(A) Assumptions:** As might
    be assumed, do you have everything you need to run the process?<br>**(K) Knowledge:**
    Do you know whether the people are properly trained in doing the process? |'
