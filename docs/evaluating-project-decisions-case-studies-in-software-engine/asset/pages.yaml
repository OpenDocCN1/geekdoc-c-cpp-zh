  md: '# 3.2 CONTEXT 75


    categories for pieces of the scope such as “must have,” “should have,” and “nice
    to have.” (See Chapter 7, “Managing Risk” for more details.) These categories
    can quickly set the priority for the scope and help with estimation of the project.


    These priorities for the scope determine the inputs into the decision process
    for estimation. Our decisions about what you can do are based on what you must
    have and what resources are available. A “must have” requirement that requires
    an engineer to go to training for a month is still a month away at. The engineer
    should not be scheduled for tasks that occur during training, and training should
    be scheduled prior to when the engineer needs the skill to complete a task. This
    shows that estimation is also related to the planning decisions. See Chapter 4,
    “Managing Plans,” for more details.


    In estimation of scope for a project, reality, timing, and capability are all
    part of the decision process. One of the keys when estimating scope is size. A
    number of estimation processes use size or relative size. Some techniques for
    deciding about scope (size estimation) are function points (Albrecht 1979), story
    points (Cohn 2004), and use case points (Schneider and Winters 2001). All support
    relative size estimation and provide a value for “scope.” Other techniques provide
    for lines-of-code values, which also give you a feeling for scope that can then
    be used to determine or justify.


    Using the PEAK model, can you ask the following questions to make decisions about
    scope:


    +   (P) Problem: What is the most likely achievable on this project with the constraints?

    (E) Experience: What are the reusable components you know about previous projects
    that will make this scope achievable?

    (A) Assumptions: Should you assume that people currently working on other projects
    will be free to work on this project and that training will be available for any
    new technology to support the scope?

    (K) Knowledge: What skills and resources do you have available for the project?


    # Estimating Schedule (Time) for Project


    There is a difference between development time and clock time. In a sense, development
    time assumes an ideal world. Every hour will one hour of productive work produced.
    Reality is far from this.


    When you estimate the schedule for a project, you almost always look at the things
    that have gone wrong in past projects. You see these as “unusual” events that
    affect the project. However, if you were to look over time, you would see that
    these unusual events are the norm for these types of projects. Things just happen.
    As you estimate, you are trying to evaluate the future environment. The analogy
    that best fits this is driving in a car from one place to another.'
