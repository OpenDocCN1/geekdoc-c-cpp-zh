    store and manipulate geographic information. See Aronoff (1989) for a foundational
    discussion of geographic information systems.


    Geographical Navigational Satellite System (GNSS): A satellite system that is
    used to pinpoint the geographic location of a user’s receiver anywhere in the
    world. Two systems are currently operational: the United States Global Positioning
    System (GPS) and the Russian Federation’s Global Orbiting Navigation Satellite
    System (GLONASS). A third, Europe’s Galileo, is due to be fully operational in
    2013. Each of the GNSS systems employs a constellation of orbiting satellites
    in conjunction with a network of ground stations (SearchNetworking.com GNSS; British
    National Science 2008).'
