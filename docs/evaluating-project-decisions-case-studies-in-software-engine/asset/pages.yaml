  md: '# CASE STUDY: UNFAMILIAR LEGACY CODE PROBLEM 13


    Iola is inspecting some “ancient” legacy code and discovers some unfamiliar routines.
    She asks her colleagues whether they know what routines do, but most people reply
    they don’t. The entire system is too large to rebuild and test as a whole, so
    she temporarily forgets about the code. The mysterious code continues to bother
    her. What if the code performs no useful function and is just wasting space? Maybe
    she should comment out or refactor it to be more efficient. She knows that the
    company is looking for ways to improve legacy code, but removing the code might
    cause another part of the system to fail or to produce bad results.


    Iola decides that the risk of system failure is minimal. Therefore, she decides
    to comment out the unfamiliar code and reload the component containing this code
    into the test environment. She has observed that changes to the other code in
    the component seem to affect the regression test results, so she assures that
    the unfamiliar code will do the same. After three hours of regression testing,
    Iola detects no failures. She is not sure how to proceed because she has not seen
    the system respond to the removal of the unfamiliar code. In other words, there
    has no smoke from the smoke test. Since the software developers have never built
    a system-wide regression test, Iola is concerned she may never be able to know
    conclusively whether removing the code has a negative impact on system. Iola decides
    the risk of removing the code is too high because she can’t determine whether
    the removal actually has an impact on the system. She uncomments the code and
    puts it back into the test system. Figure 1-5 shows the inputs and outputs for
    Iola’s initial but not final decision.


    | Inputs | Outputs |

    |---|---|

    |(P) Problem: What does the unfamiliar code do? | Solution: Remove unfamiliar
    code, and see what happens to the tests. |

    |(E) Experience: The other code seems to function.(A) Assumptions: The unfamiliar
    code does something.(K) Knowledge: The other code seems to have a purpose and
    affects the tests. | Assumed Risk: Removed code may cause something bad to happen
    later.|


    Figure 1-5: Unfamiliar legacy code problem'
