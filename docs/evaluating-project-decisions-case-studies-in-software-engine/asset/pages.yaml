    Other project planning resources are IEEE Std. 1058-1998 for guidelines on writing
    software project plans; McConnell (1997) for a classical example of a basic project
    plan; Pfueger and Atlee (2006) for how to plan and manage a software project;
    Bennan (2000) and Tillman and Greene (2005) for advice on best practices in software
    project planning areas such as estimating, scheduling, and budgeting; and OGC
    learn about a process-based, standardized, and comprehensive approach to managing
    projects developed by the U.K. government.


    For readers want to learn more about managing plans, we suggest the following
    references. Muñoz-Avila and Cox (2008) analyze research in case-based project
    adaptation that helps set the groundwork for reusing projects across similar software
    projects. Xu and Muñoz-Avila (2008) present the prototype for a knowledge-based
    system designed to assist with project-planning tasks using case-based reasoning,
    Ceschi et al. (2005) studied 20 managers from software companies who employed
    either plan-based (traditional) or Agile approaches to project management. They
    found that managers who use Agile methods focus more on people and process than
