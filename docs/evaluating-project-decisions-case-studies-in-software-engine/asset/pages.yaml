    Though product management is the crux of developing a software product, you cannot
    really consider product without considering process. Product management also involves
    aligning the processes used to develop the product with the stakeholder expectations
    of scope, time, quality, and cost. At different times in the life cycle of the
    product, these dimensions elevate in prominence. Early in the project, the stakeholders
    may consider scope, and cost to be most important. As the project begins, the
    quality issues begin to dominate. As the project nears its end, the budget may
    again become prominent because it is nearly exhausted (sometimes the scope is
    attained). You can use the PEAK model to ensure that you have the correct information
    about the relevant dimensions of stakeholder expectation to make the best decisions
    possible. In the end, your decisions will be bounded by these four dimensions.


    > “Price is no object” is a famous saying that everyone likes to hear but that
    usually should have the addendum “for the next N minutes or until the end of the
    project, whichever comes first.” In software product development, you must always
    be concerned with critical aspects of the product, even if you consider what you
    are going to make, how long it will take, and of course how well it will meet
    all of its requirements.


    Some people think that the customer is interested only in the software product.
