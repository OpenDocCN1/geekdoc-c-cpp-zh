    (MDSD) is that models of the software requirements can be verified, validated,
    and then mapped into software designs (which also may be expressed as models)
    and implementations that improve quality while reducing the time and cost associated
    with development. See IBM Systems Journal 2006 for an excellent collection of
    papers that give an overview of model-driven software development. A question
