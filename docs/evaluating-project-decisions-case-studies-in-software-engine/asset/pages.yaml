    The support engineers had to make regular boots of the system, one a day on average.
    Corporate customers were very angry with the bank (the bank was considered a corporate
    bank since its customers were mainly corporations and firms).


    The vendor of the system was a Russian software company that sent one of their
    software consultants to the system update. While updating the legacy system, the
    development team the consultant realized that the system would continue to cause
    problems even after the update. The consultant discussed the system condition
    with her company, and the company advised the bank''s developers to consider reengineering
    the system.


    The process of acquiring an understanding of the legacy system along with requirements
