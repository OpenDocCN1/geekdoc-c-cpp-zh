  md: '# 1.3 Decision Model for Software Engineering


    For many people, the decision-making process consists of three basic (and usually
    vague) stages:


    +   1. Information goes into a decision process.

    2. A person-dependent miracle occurs.

    3. A solution or decision comes out.


    Professionals often consider people to be experts or gurus in their fields if
    they can make good decisions easily. This section gives an overview of a decision
    model whose purpose is to help software professionals manage their decision processes
    so they better understand the solutions they generate.


    The PEAK decision model presented in Figure 1-2 does not indicate "what a particular
    decision should be." It implies that stakeholders need to carefully examine their
    decision processes to help ensure that successful decisions are made. When making
    decisions, stakeholders should consider the inputs and their relation to the solution
    as well as the risk assumed with alternative solutions. The model provides insight
    into how the inputs and outputs of the decision-making process influence the way
    in which decisions are made.


    ![](img/b881997d603ad72821fd2f4c10efba76_29_0.png)


    Figure 1-2: PEAK decision model'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# CHAPTER 1 MANAGING DECISIONS


    The inputs to the decision model are the following elements:


    (P) Problem: What is the issue to be resolved or the problem to be solved? The
    problem statement should provide a clear representation of what needs to be solved.


    (E) Experience: From prior events, what does the decision maker know or know how
    to do that might help with this problem? Has the decision maker seen or solved
    a problem like this before? How appropriate and accurate is the decision maker''s
    historical information?


    (A) Assumptions: What information is accepted as fact without having evidence?
    What information about the problem does the decision maker abstract away because
    the information is not thought to be relevant to the solution?


    (K) Knowledge: What conceptual understanding or factual basis can help the decision
    maker with the problem? What has the decision maker learned since last dealing
    with a problem like this? What facts does the decision maker have about problem?
    What is the environment that surrounds this problem? For instance, looking at
    military problems to be solved, soldiers might say, “What is the current situation
    and terrain?”


    The outputs from the model are the following elements:


    Solution: What do the stakeholders need in order to solve the problem or resolve
    the issue? What alternative solutions are feasible, and what are the benefits
    and cost associated with each alternative? Have the relevant stakeholders discussed
    the issues considering the alternative solutions and expressed their preferences?
    The stakeholders may not know whether a solution is successful until they implement
    it. The results, whether successful or not, of implementing a decision feed back
    into the model as part of decision maker’s knowledge and experience. In response
    to a colleague who asked he thought himself to be a failure, Thomas Edison said,
    “Not at all. I know more than a thousand ways for NOT to make a light bulb” (Rovira
    and Trias de Bes 2004, 1).


    Assumed Risk: What is the probability that the solution will not work as envisioned?
    When a stakeholder makes a decision, the stakeholder assumes some level of risk
    that the solution or decision will not lead to a successful result. Risk is a
    consequence of making decisions. What are the risks associated with the alternative
    solutions? Have the relevant stakeholders discussed these risks with respect to
    their preferences for the alternatives?


    Even if the decision maker is not aware of them, the inputs and outputs always
    exist when a decision is being made. To manage their decisions, stakeholders'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# CASE STUDY: SOFTWARE TEST RERUN PROBLEM


    need to identify and manage these inputs and outputs when making decisions. The
    case studies in the book will describe situations in which most but not necessarily
    all of the inputs are known. Each case study will present the problem, the assumptions,
    and many facts. You will bring other knowledge and experience as inputs to the
    decision model, as they occur in the case studies, to evaluate your decision processes.


    So, why do decision makers need a model for evaluating decisions? A model helps
    decision makers think about the following aspects of their decision processes:


    +   - Information that should be considered in making decisions


    +   - The impact that the inputs to the decision process have on the outputs


    +   - Solutions that are feasible with respect to the nature of the problem


    +   - The assumed risk associated with alternative solutions


    +   - Ways to improve the management of decisions


    The remainder of this section provides four examples to illustrate how you can
    apply the model to evaluate alternative solutions and then make a decision by
    selecting the best alternative. The first example, "Software Test Rerun Problem,"
    shows how to identify the inputs and outputs to a decision regarding whether to
    rerun a software-test. The second example, "California Bridge Problem," demonstrates
    how to apply the model to the more complex problem of building a bridge that can
    withstand earthquakes, a major issue for the California Department of Transportation.
    This example demonstrates how newly acquired knowledge feeds back into the decision-making
    process. The third example, "Unfamiliar Legacy Code Problem," highlights the risk
    that is assumed when making a decision. The last example, "Data-Processing Problem,"
    clarifies why it is important to understand the nature of the real problem before
    working on a solution. The diagram shown with each story problem summarizes inputs
    and outputs for the decision being made.


    CASE STUDY


    # Software Test Rerun Problem


    This example involves a testing problem that software developers often face. The
    scenario for the problem follows. Before leaving the office, Bob started a software
    regression test on the computer used for testing software products. He expected
    the test to complete and the'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'test results to be ready sometime during the night. Bob came into the office
    the next morning and saw the login prompt on the test computer. He knew either
    that someone logged out the test account or that the machine rebooted. Bob quickly
    determined that there had been a power failure and that the machine rebooted when
    the power resumed. The test that had been running did not complete before the
    power failure, and the complete test results were not available.


    Bob examined the incomplete test results and thought they did not provide sufficient
    verification of the software component being tested that would be needed to integrate
    this component with other software system components. He reasoned that the incomplete
    test results probably would not be useful to the software engineers who were depending
    on them. Bob estimated that rerunning the entire test would take about four hours
    and that the complete results could be available by the afternoon if he reruns
    the test morning. He rationalized that it would be better to have complete results
    that are late by half a day than provide the test stakeholders with incomplete
    results. Bob decided to rerun the test now because he did not want the delivery
    of the test results to be a day or more late.


    Let''s use the PEAK model to evaluate Bob''s decision. Figure 1-3 outlines the
    inputs to and outputs of Bob''s decision process. The risk associated with Bob''s
    decision is also an output of his decision-making process.


    | Inputs | Outputs |

    | --- | --- |

    | (P) Problem: What should Bob do? (Should he rerun the test? If so, when?) |
    Solution: Bob decides to rerun the whole test this morning. |

    | (E) Experience: Bob knows the test. | Assumed Risk: Incomplete results may be
    of value to stakeholders. The test may fail and further delay getting complete
    test results. |

    | (A) Assumptions: The test results are insufficiently complete. Resources are
    available during the test. The test will execute to completion. | |

    | (K) Knowledge: Bob knows what to do. The resources are working sufficiently
    well to run the test. | |


    Figure 1-3: Software rerun problem'
