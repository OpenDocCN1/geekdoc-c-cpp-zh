    for Julian. The team was bothered because of some basic business drivers for this
    project that no longer made sense in light of the experiments they had run and
    the data they had collected.


    Reviewing Julian''s design, the team found it was trying to improve on the Pseudo
    TCP algorithm in which there is network latency, typically because an out-of-order
    packet is received. Julian wanted to address this problem in a more fundamental
    way through the algorithm. His approach was to use a packet-based protocol, using
    acknowledgment types and a new property of window size adjustment based on round-trip
    time (RTT). The team couldn''t figure out which specific scenario this would help,
    a question Julian answering. Assuming there was something wrong with the existing
    TCP algorithm Brian Sparrow had already implemented and integrated into Net5,
    the team wondered there could be another existing TCP implementation that was
    already customized for this scenario, much like FAST TCP, which was for high-gigabit
    networks.


    The team struggled to understand Gigapixel''s business driver for having a new
    protocol integrated with NetCom5. Was it simply file transfer? What was the intended
    benefit? It seemed answering this question would certainly help the team members
