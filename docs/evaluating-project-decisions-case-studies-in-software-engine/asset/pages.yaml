    in France. Bob expected Joe would be open and direct. He hadn''t necessarily expected
    that they would reach an agreement that day, but he certainly expected that Joe
    would express ideas and opinions. Bob wondered whether he should say or not get
    a resolution to the issue.

    The shaded in Table 8-4 show the factors that Bob considered before with Joe.
    Would he have shaded the table after talking with Joe? What does Bob still not
    know the factors that might be influencing his interaction with Joe? How might
    Bob adjust his behavior to resolve the issue while maintaining a good relationship
    with Joe and the other staff working at the lab in France?


    Managing people interactions involves defining your objectives for important interactions,
    examining the various factors that might potentially influence them, and using
    that knowledge to plan your interactions. Once your interactions are over, you
    can reflect on your experiences and ideally improve your future interactions.


    # 8.3 Case Studies


    The two cases in this chapter focus on aspects of managing people interactions
    at various levels within the organization. In the first case, "To Be or Not to
    Be: A Sense of Urgency at TestBridge," tough decisions have to be made with respect
    to the ability and willingness of specific players within the team to contribute
    as team members in light of an organization that is changing its focus and direction.
    The second case, "A Friend or Fo at Hanover-Tech," focuses on the need to manage
    people interactions at the managerial level while balancing opposing financial,
    strategic, personal, and temporal. Decisions made in both cases appear to leave
    the stakeholders in positions that have both short-term and long-term repercussions
    unless they are handled carefully. Read these cases to determine the steps taken
    to manage people interactions and the decisions and actions that led to the problems.'
