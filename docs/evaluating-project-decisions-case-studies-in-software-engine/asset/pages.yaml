  md: '# 9.2 CONTEXT 269


    You probably noticed that the expectations of the stakeholders described in Table
    9-1, “Managing Decisions,” are discussed in Chapter 1, (STQC). these are the four
    dominant characteristics and dimensions of expectation that stakeholders have
    for a software project. Software project processes and decisions should focus
    on the production of deliverables that satisfy the STQC expectations of the various
    stakeholder groups, in particular those of customer/user. To manage the expectations
    of software project stakeholders, the project manager must not only be able to
    understand what stakeholders expect of the product (project deliverables) and
    process (project execution) with respect to each of the STQC dimensions but also
    be able to clarify and influence these expectations over the life of the project.
    Later, we will say more about how these expectations may change.


    The stakeholder expectation management life cycle has three basic phases: setting,
    maintaining, and influencing expectations. The first phase ensures that the customer/user
    and developer/management stakeholders have the same understanding and focus for
    a project. Establishing a common understanding and project depends on effective
    communications. Communications that involve active listening and asking the right
    questions, as well as clear and unambiguous written representation of whatever
    communicated help stakeholders maintain focus, clarity, and understanding. To
    manage expectations for project success, software project managers need to think
    and make decisions about how they will communicate with different project stakeholders.
    Chapter 8, “Managing People Interactions,” discusses ways in which software project
    stakeholders evaluate and influence their interactions, such as communications,
    to make them more effective.


    The software project manager stakeholder performs the following activities in
    managing stakeholder expectations:


    +   - Communicating with the customer stakeholder

    - Managing multiple dimensions of stakeholder expectation over time

    - Managing product and process to satisfy stakeholder expectations

    - Understanding different types of customers

    - Managing stakeholder perception


    Table 9-2 describes in more detail the primary activities in managing stakeholder
    expectations. Study the table, and think of other activities that you may have
    performed in managing stakeholder expectations in the past.'
