    # SETTING


    The setting involves three software research and development centers of FibOptia,
    a company that develops network systems, applications, and services for fiber-optic
    communications. The centers are located in Hyderabad, India; Toulouse, France;
    and Montréal.


    # KEY CONCEPTS


    +   Collaboration in a global software development environment requires particular
    attention to communication and culture.


    +   Stationing representatives from remote sites with local team members promote
    effective communication, cultural integration, collaboration, and coordination
    between globally distributed project sites.


    +   Managing process and product across globally distributed projects requires
    definitions of standard software processes and product requirements to be applied
    at all software development sites. Local control of process execution and product
    quality is critical.


    # TERMINOLOGY


    Agile software development processes: A group of software development methodologies
    that are based on similar principles. Agile methodologies generally promote a
    project management process that encourages frequent inspection and adaptation;
    a leadership philosophy that encourages teamwork, self-organization, and accountability;
    a set of engaging practices that allow for rapid development of high-quality software;
    and a business approach that aligns with customer needs and company goals. Beck
    et al. (2001) describes the issue of involving an agile software development techniques.
    Fowler (2005) gives an overview of issues involving the use of agile software
    development


    Rational Unified Process (RUP): A software engineering process delivered through
    a Web-enabled, searchable knowledge base. The process enhances team productivity
    and delivers software best practices via guidelines, templates, and tool mentors
    for all critical software life-cycle activities. The knowledge base allows development
    teams to gain the full benefits of the industry-standard Unified Modeling Language
    (UML) (Rational 201).


    V Model of software development: A software development approach that focuses
    on the verification and validation (V&V) of a software system at each stage in
    the development process. Two objectives to be accomplished by a V Model is to
    discover defects in a software system as early as possible and to assess whether
    the system is usable in an operational situation (Graphical Development Process
    Assistant).'
