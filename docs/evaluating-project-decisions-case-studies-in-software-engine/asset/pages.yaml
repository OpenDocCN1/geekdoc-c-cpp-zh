  md: '# CASE STUDY: To Replan or Not to Replan?


    Budgeted cost of work performed (BCWP): See Earned value (EV).

    Budgeted cost of work scheduled (BCWS): See Planned value (PV).


    CEO: Chief executive officer.

    CFO: Chief finance officer.

    CIO: Chief information officer.

    COO: Chief operations officer.


    Cost Performance Index (CPI): The ratio of work accomplished versus work cost
    incurred for a specific time period. The CPI is an efficiency rating of work expenses
    expended (U.S. Department of the Navy).


    In practice, CPI is BCWP/ACWP (See the definitions for BCWP and ACWP) CPI ≥ 1
    means that the budgeted cost of work performed by end of a reporting period is
    equal or greater than the actual cost for this work. In others, project costs
    are within or below budget.


    More detail: CPI is calculated as BCWP divided by ACWP (BCWP/ACWP). The budgeted
    and actual costs may be monetary values (for example, in dollars) or in another
    unit of measure such as hours. A ratio of two values having the same unit of measure,
    CPI has no unit of measure. A CPI ≥ 1 is a preferred situation in which the budgeted
    cost of work performed is greater or equal to the actual cost for this work. On
    the other hand, a CPI < 1 suggests a less desirable situation in which the actual
    cost for the work exceeds the budgeted cost for this work. Also, a CPI that is
    much greater than 1 indicates that the original plan grossly overestimated the
    cost for this work. The managers in the case study track the CPI for their project
    time to determine how well their project stays on budget. A project CPI value
    does not reflect a performance with respect to schedule. A project may be on budget
    while being or behind schedule.


    Earned value (EV): The amount or value of work completed to date, commonly referred
    to the budgeted cost of work performed (BCWP). When compared to the planned value
    (budgeted cost of work scheduled) and actual cost (actual cost of work performed),
    EV provides an objective measure of schedule and cost performance (U.S. Department
    of the Navy).


    In practice, EV is the sum of the hours assigned to each task that is actually
    complete by the end of the reporting period.


    More detail: Calculations of earned value typically consider units of work that
    are entirely complete, such as the completion of an entire task. Earned value
    calculations usually do not consider tasks that are partially complete. The related
    SPI and CPI'
