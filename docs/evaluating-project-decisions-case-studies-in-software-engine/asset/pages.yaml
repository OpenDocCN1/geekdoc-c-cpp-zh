  md: '# CHAPTER 8 MANAGING PEOPLE INTERACTIONS


    You need to think about both what you are trying to achieve as well as what the
    other person is trying to achieve. Once you understand your own objectives, and
    the best of your ability, the objectives of the people with whom you are going
    to interact, you can determine the factors that might affect the interaction.
    In Table 8-3, you will notice factors that might be within your control (for example,
    communication style, your goals and motivation, or the environment to some degree)
    as well as those that be outside your control (for example, the personality type
    of the person with whom you are interacting, the context, or possibly the location
    where you are meeting). You might use your influence to change the factors that
    are within your control to enable a better interaction to take place. For example,
    you might choose a convenient location and time of day to talk.


    Although certain factors are controllable, each interaction involves aspects such
    as behavioral styles, personality types, and preferences that may not be controllable.
    As a stakeholder, you are able to control and adapt your own behavior to the dynamics
    of a given interaction but not able to control or make others adapt the situation,
    unless they decide so. Proper planning allows you to think ahead, to be prepared,
    and to adjust your behavior, as needed, in a focused and controlled way. If you
    set realistic expectations for how to act in the event that goes outside the boundaries
    of your plan. Since people are different, you should not expect they will behave
    the way you think they do. A proper analysis of previous interactions with these
    people (if you had any) may reveal valuable information regarding their personality,
    preferences, behaviors, or communication style, all of which are key to understanding
    how to approach the interaction.


    In their book The Platinum Rule: Discover the Four Basic Business Personalities
    and How They Can Lead to Success, Tony Alessandra and Dr. Michael O''Connor use
    an interesting model to study personality styles. The model classifies people
    along two dimensions. The first concerns directness or indirectness. It relates
    to whether people tend to be direct (expansive, fast moving, rising and talkative)
    or indirect (relaxed, risk aware, listening, and slower to decide). The second
    dimension has to do with a person''s preference for being open (relationship and
    feeling oriented, warm, relaxed, and flexible) or guarded (planning and task oriented,
    thinking, and fact). The reason to use a model, whether one suggested by Alessandra
    and O''Connor or by others, is to assess how people might react in various situations
    and we also need to alter or adapt our behaviors before, during, or after an interaction
    (Alessandra and O''Connor 1998).


    Most important, we should understand that differences in personalities can often
    create conflict between individuals with respect to pace (slower-paced faster-paced
    personalities that tend to be direct) and preference (task-oriented for those
    who tend to be guarded versus people-oriented for those who tend to be open).
    Our recognition that these differences can lead to potential conflict can help
    you flexibly manage your behavior in situations in which'
