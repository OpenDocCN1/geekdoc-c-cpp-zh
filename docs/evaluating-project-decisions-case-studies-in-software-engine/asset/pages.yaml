    # Wrapping Hands Around the Project


    Gigapixel was using an open source library, called NetCom5, that supported peer-to-peer
    communication over a wide number of network configurations, including firewalls
    and Network Address Translations (NATs). To be able to go through firewalls, NetCom5
    used a protocol based on Datagram Protocol (UDP), which had a reliability mechanism—similar
    to TCP—embedded in the data section of the UDP messages. This protocol, dubbed
    Pseudo TCP, was faster than TCP but not reliable. One of the project''s objectives
    was to create an improved version, also based on UDP which ideally be faster than
    TCP for file transfers. The team decided to call this new protocol RUDP, where
    RUDP was not going to replace Pseudo TCP but was going to be part of NetCom5 as
    another option.


    A crucial part of the project was testing the reliability and performance of the
    new protocol. To accomplish this, the team needed to build a test suite that could
    automatically execute test cases using parameters simulating different network
    conditions. One of the main objectives of the test suite was to evaluate the RUDP
    protocol based on its correctness (the protocol does what is expected, such as
    transfer a file) and its reliability (the protocol also works under adverse network
    conditions). In addition, the test suite was to measure the performance of the
    RUDP protocol by benchmarking it against Pseudo TCP and TCP (where appropriate).
    The client''s goals were simple: to allow all Gigapixel applications using NetCom5
    to transfer files using the implementation of the new protocol, thereby improving
    the performance and efficiency with respect to bandwidth of Gigapixel file transfers
    within the organization.


    As the project unfolded, Gupta set clear parameters for what his team needed to
    do: develop a test suite to test it thoroughly; and integrate it into the existing
    NetCom5 library. As the NetCom5 library was implemented in C++, the RUDP protocol
    had to be implemented using the same language. To make sure his team was able
    to achieve all of these objectives, he sat down with Julian (client) and Patrick
    Adam, the "people person" on the team and the appointed client liaison, to define
    a set of responsibilities between them. Specifically, these responsibilities were
    the following:


    # Team Responsibilities


    +   - Implement RUDP.

    - Test the reliability and performance of RUDP.


    +   - Merge RUDP into NetCom5.


    +   - Keep the customer informed of the status of the project on a biweekly basis.'
