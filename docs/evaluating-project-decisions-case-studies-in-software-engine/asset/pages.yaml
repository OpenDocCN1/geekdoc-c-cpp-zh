    In particular, the model helps decisions begin the process of “divide and con-quer”
    in a systematic way. They start by perusing all the information (data) that they
    received to find the four decision-making inputs. First, they ask themselves whether
    they have sufficient information to clearly identify the problem or needs a solution.
    If they do, then they work on the other inputs needed for the decision. If they
    cannot identify the real problem, they will not be able to determine an appropriate
    solution.


