    for anything. In the development of complex integrated systems, this "person"
    usually seems to be software.


    Halley Anderson had a tough day ahead. He knew that he was going to tell his manager
    that the Washington Transit Authority (WTA) project was going to be late. This
    might seem unusual because the project was not due for another six months, but
    nonetheless that was going to be late.


