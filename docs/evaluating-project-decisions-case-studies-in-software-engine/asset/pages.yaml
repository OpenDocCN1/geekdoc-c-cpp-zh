    # TERMINOLOGY


    **BFM:** Brake feedback monitor.


    **Greenfield development:** Completely new development; interfaces to older systems
    but internally starting from a clean design.


    **OO:** Object-oriented. This is the use of software structures that model physical
    structures in the product or system context to implement a new product.


    **QA:** Quality assurance.


    **Reuse:** The idea that software components or features are reusable in future
    products.


