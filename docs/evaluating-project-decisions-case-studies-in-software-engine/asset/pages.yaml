    **Performance index (SPI):** The ratio of work accomplished versus planned for
    a specific time period. The SPI is an efficiency rating for work accomplishment
    by comparing what accomplished to what should have been accomplished (U.S. Department
    of the Navy).


    In practice, SPI is EV/PV (See the definitions for EV and PV). SPI ≥ 1 means the
    amount of work performed by the end of a reporting period is equal to or greater
    than what is scheduled to be completed. In other words, the project is on ahead
    of schedule.


    More detail: SPI is calculated as BCWP divided by BCWS (BCWP/BCWS). This is the
    ratio of earned value to planned value (EV/PV). The budgeted and actual costs
    may be expressed as monetary values (for example, dollars) or in another unit
    of measure as hours. As a ratio of two values having the same unit of measure,
    SPI has no unit of measure. An SPI ≥ 1 is a preferred status in which the work
    completed is greater than or equal to what was scheduled. An SPI < 1 suggests
    a less desirable situation in which the actual work performed is less than the
    scheduled work. Also, an SPI that is much greater than 1 indicates that the original
