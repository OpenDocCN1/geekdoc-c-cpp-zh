    # KEY CONCEPTS


    These are the questions project stakeholders must answer when making product decisions:


    +   - How much newness can a project take?

    - Who is affected by decisions made in development?

    - What are the best ways to integrate new technology?

    - Who is responsible for change?


    Some principles for managing product are the following:

    - Product management involves the consideration of long-term issues. The product
    you deliver today is the product you have to maintain tomorrow.

