  md: '# Chapter 3


    # # Managing Estimates


    #  3.1 Chapter Objectives


    After reading and thinking about the concepts and case studies presented in this
    chapter, you will be able to do the following:


    +   - Understand what estimation is and what it is not

    - Understand when to estimate

    - Understand the major approaches of estimation that can be used

    - Understand what contributes to an estimation model and its successful use

    - Identify key problems with estimation

    - Understand key decisions to make with estimation

    - Understand how to choose an approach to estimation


    #  3.2 Context


    This chapter will help you identify problems with estimation and ways to improve
    the estimation processes that you use. It will help you see how to gather information
    and apply that information to improve estimates in the future. Estimation should
    not be a black art (McConnell 2006) but should become a systematic, disciplined
    practice that you can use to better support your software development efforts.
    Estimation is'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'sometimes considered something that is done to get managers off one''s back
    or to fill out the paperwork to start a project. We view estimation and evaluating
    decisions about estimates as essential components of successful software project
    management.


    To begin our discussion of estimation, we need to define the concept of an estimate.
    Estimates are the information we use to evaluate the cost of a future decision.
    The following are commonly used definitions for estimate and estimation:


    **Estimate:** An approximate calculation of quantity, degree, or worth.


    **Estimate:** A judgment of the qualities of something or somebody (Princeton
    University).


    **Estimation:** The prediction of the quantitative result. It is usually applied
    to project costs, resources, and durations (Wideman).


    Most of these definitions are similar statements about what is needed to make
    a best guess at a future value. Here we paraphrase the last definition to relate
    it more directly to software estimation:


    **Software estimate:** An approximate calculation of the scope, time, quality,
    and cost of a software product (the four dimensions of project stakeholder concern).


    The last definition works well for the models used in the book and for the purpose
    of managing estimates with respect to stakeholder expectations. See Chapter 9,
    “Managing Stakeholder Expectations,” for further information on how to manage
    the four dimensions of stakeholder expectation.


    So, what do software project managers do to manage estimates? People who manage
    estimates perform activities such as the following:


    +   - Understanding requirements

    - Conceptually designing a solution

    - Performing element-wise decomposition (divide)

    - Allocating resources from the bottom-up (conquer)

    - Allocating overhead

    - Estimating construction

    - Estimating change management


    Table 3-1 describes the activities to be performed when managing estimates in
    detail. Study the table, and think of any other activities that you may have performed
    when managing estimates.'
