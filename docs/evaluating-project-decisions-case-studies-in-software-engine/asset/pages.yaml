    # KEY CONCEPTS


    +   - Managers must consider issues such as communication, culture, collaboration,
    and trust when making decisions for global software development projects.


    +   - For effective collaboration, software project team members need to understand
    and follow best practices for communication and cooperation in a global development
    environment.


    +   - Centralized project planning supported by localized management of project
    execution ensures successful achievement of project objectives across a globally
    distributed team.


    # TERMINOLOGY


    ARCEP: Autorité de Régulation des Communications Électroniques des Postes, an
    independent agency for regulating the telecommunication and postal services in
    France.


    FTTH: Fiber to the home, also known as fiber to the building (FTTB).


    Incremental release: A model for releasing software as a series of versions that
    iteratively add more functionality or features. The development of each version
    usually involves a cycle with phases such as requirements, analysis and design,
    implementation, and test. In this way, an incremental release is iterative. The
    terms iterative and incremental are often used synonymously. An iterative model
    differs in that it emphasizes both refinement and augmentation of successive iterations,
    whereas an incremental model typically focuses only on augmentation of successive
    iterations. See Larman and Basil (2003) for further discussion of iterative and
    incremental software development.


    IP: Internet Protocol.


    Iterative software development: A cyclical model in which a software system evolves
    over a series of development cycles where the system is refined and augmented.
    Each cycle includes phases for activities such as requirements, analysis and design,
    implementation, and test. The final product grows incrementally from iteration
    to become the final system. The phases within a cycle are frequent by limiting
    the scope of the requirements so that an iteration is available sooner for user
    evaluation and feedback. See Larman and Basil (2003) for a discussion of the history
    of the formulation of iterative and incremental development.


    Open System Interconnection (OSI) Reference Model: A standard description or reference
    model for how messages get transmitted between any two points in a telecommunication
    network. Its purpose is to guide product development that products from different
    vendors are compatible. The reference model defines seven layers of functions
    that take place at each end of a communication. Although OSI is'
  merge: -1
