  md: '# CASE STUDY: WHEN A TEAM RUNS A RACE 91


    are forced to make the assumptions because sometimes you don''t have the needed
    data until later in the project. Although, for estimation, the PEAK model will
    mostly show that assumptions are a problem, other factors such as the availability
    and accuracy of knowl-edge are also issues.


    An example might be the one-year problem in the case. The risk was that free time
    might not be available, but the assumption was that free time would be sometime
    within a year. When the original estimate of one year was put forth, everyone
    assumed the time would become available. No one verified this assumption, and
    the know-ledge that this issue was pending was probably not to the engineers who
    had to work on it. The project went forward with an estimate decision based on
    an assumption that may not hold.


    The main principle Halley learned that would influence his decisions about esti-mates
    in the future is that some costs, such as the 5,000 hours needed to integrate
    software into new hardware, are fixed. If these fixed costs were better understood,
    estimation process could be improved. Halley increased his knowledge for future
    estimate decisions. He also learned that his knowledge about the production process,
    actual costs, and esti-mation needed to be available to everyone in the organization
    if the group was going to be successful.


    # KEY IDEAS TO REMEMBER


    At first glance, it seems that the problem for project managers is that software
    is always late. As the title of the case indicates, the software people "run the
    anchor leg" of the project race. They usually handle the integration of the product
    and, in doing so, are the last people to work on it. Therefore, they may be expected
    to make up for any previ-ous deficiencies that have occurred earlier in the project.
    The estimation decisions early in the project may be completely invalid if this
    is not taken into account.


    In practice, being 14 days late on an 11-month (220 working days) project is very
    small amount, but critical to knowing how to keep the project schedule. Many factors
    can influence this understanding, and taking the time to reflect can be critical
    to making the right decisions.


    When Halley and Calvin stepped back from "running the race" of managing their
    proj-ects and reflected, they learned to understand a much deeper issue of what
    was influencing their projects. Their reflection effort increased their knowledge
    for future PEAK decisions about estimates. They learned that one of the problems
    they thought was the fault of the software engineering organization was actually
    related to the manufacturing require-ments and the order of performing the related
    tasks in the compressed schedule. This issue, which was not completely under their
    control, indicates the complexity of factors that can influence estimation and
    schedule planning for a project. After this experience, Halley was better prepared
    to defend his estimate decisions.'
