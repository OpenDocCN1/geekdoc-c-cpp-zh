    * Understand that there are different stakeholder points of view regarding process

    * Understand how process decisions can affect a group of engineers


    # SUBJECTS COVERED


    Process management, quality issues, life-cycle development, and buy-in from rank-and-file
    engineers


    # SETTING


    A software consultant must help a development manager decide how new processes
    can be taught to all engineers while continuing to produce deliverables on time
    and with the right quality. In particular, the consultant must assess the development
    group''s processes and help develop an effective way to measure the successful
    introduction of new Agile processes to traditional development processes. The
    company is hiring many new engineers who are comfortable with Agile development
    processes. The decision to use these new processes is being reviewed with respect
    to what the consultants have learned about the developers in the company and about
    how management makes decisions.


    # KEY CONCEPTS


    The following are basic concepts to keep in mind when making process management
    decisions:


    +   * How much process change can a project handle?

    * Who is affected by the decisions about development processes?

    * What are the best ways to integrate new processes into a development group?

    * How do you ensure that process change meets expectations?


    Process management involves the consideration of long-term issues. The processes
    used today must be able to deliver expected development information for the past
    and the future. (The process must enable the use of metrics to evaluate how well
    the process is working.)'
