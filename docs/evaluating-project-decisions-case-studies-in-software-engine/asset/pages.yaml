    Much has been written about motivation, an internal force that drives people to
    act and say what they do. The main idea to remember is that motivation is an internal
    force. People cannot really motivate others to do something. Each individual has
    objectives and goals, ways of reacting to external events, thoughts, and other
    motivating factors that influence what the person says or does. When people share
    common goals and objectives, they are more likely to cooperate or to work together
    in their interactions. See ChangingMinds.org for an online overview of theories
    about motivation.


    The number of participants (interaction size) also influences an interaction.
    Decision making, in particular, becomes increasingly difficult as the number of
    joint decision makers increases. In general, group interactions are agreed upon
    a process for how they will interact to accomplish a common purpose.


    Personality is a topic of study for psychologists and psychiatrists. We will not
