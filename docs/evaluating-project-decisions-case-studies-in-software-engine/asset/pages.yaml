    also develop plans for how to obtain time commitments from the business operations
    personnel as well as access to the business software.


    # KEY IDEAS TO REMEMBER


    +   - Project execution frequently does not proceed as planned.

    - Replanning is necessary when the current plans no longer help managers manage
    their projects to completion on time and within budget or help them achieve project
    objectives.


