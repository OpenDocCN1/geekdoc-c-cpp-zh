    # Establishing the Requirements


    Considering the user''s needs and the relevant stakeholders is paramount to successfully
    establishing the requirements. The software project requirements should support
    the user''s business objectives. In other words, each requirement should map to
    a specific business objective. Determining and aligning the expectations of the
    customer or client with those of the developer or service provider is necessary
    to establish software requirements that will be acceptable to both types of stakeholders.
    Chapter 9, “Managing Stakeholder Expectations,” discusses the alignment between
    the customer and software developer expectations.


    Involving the appropriate stakeholders in effective ways at the right times is
    critical to successfully establishing the software requirements (as well as the
    success of the software project). In particular, stakeholders with the responsibility
    or authority to sign off or approve the software requirements, software project,
    or software deliverables including the budget or cost should be involved in establishing
    the requirements. Before eliciting them, the leaders of the requirements establishment
    process should consult all stakeholders regarding the nature of their preferred
    involvement in the process.


    In general, projects with requirements that are unpredictable or involve unknowns,
    such as the use of innovative technologies, should include feasibility studies
    in which the issues are explored and resolved before the project requirements
    are established. Neglecting to identify and resolve uncertainties about the requirements
    can lead to project failure. For instance, this problem may occur if the software
    developer decides that requirements depend on the use of a software component
    to be developed by another vendor that ultimately does not provide the component
    on time or at all. One way to handle the uncertainty associated with this type
    of decision is to negotiate an agreement with the component vendor and to design
    a contingency plan in the event that the vendor is late or unable to deliver the
    component.'
