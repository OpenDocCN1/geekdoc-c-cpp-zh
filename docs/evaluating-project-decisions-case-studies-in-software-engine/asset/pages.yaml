    of the project after the Train Control (TC) group had received a notice to proceed
    on the contract. He wanted to make sure that the proper resources were assigned
    and that the risks were observed in the project. Halley used a number of techniques
    to estimate the cost of this project, but the assumptions made in one of them
    were being reviewed.


