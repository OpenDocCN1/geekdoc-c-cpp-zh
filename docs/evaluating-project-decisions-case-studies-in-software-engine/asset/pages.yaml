  md: '# 2.2 CONTEXT 37


    Last, but certainly not least, we''ll talk about the types of decisions that software
    engineers make to validate the software project deliverables with respect to their
    requirements.


    # Validating the Software Project Deliverables with Respect to Their Requirements


    Software project stakeholders and managers often anxiously await the delivery
    of software project deliverables that demonstrate the success of the project and
    the culmination of a business venture. Validating the software project deliverables
    with respect to their requirements is the apex of their development. Project managers
    should consider validating project deliverables to be an integral part of managing
    requirements for several reasons:


    +   * The reason for defining requirements is to help ensure that the resulting
    project deliverables satisfy the needs and expectations of the user.

    * The validation of software project deliverables with respect to requirements
    must be done from the user''s point of view.

    * The tests used to validate software project deliverables need to reflect changes
    to the requirements. Furthermore, managing requirements involves changes to requirements
    as well as the associated tests used to validate the software project deliverables.


    Validating software project deliverables is best done by people who represent
    the point of view of the user, who are able to understand the various aspects
    of different types of software project requirements and deliverables, and which
    observations are likely to be cleared by detailed knowledge of how the project
    deliverables are developed. Validation experts should also be knowledgeable about
    problems that are likely to occur in the types of products or services being produced
    or delivered by the software project as well as how to find obscure bugs that
    can occur.


    When making decisions regarding the validation of software project deliverables,
    software managers need to remember that requirements should be tested from the
    user''s point of view with respect to a system context. Validating software project
    deliverables ensures that the stakeholder expectations regarding software requirements
    and contractual agreements are met. Project managers also need to keep in mind
    the software project deliverables with respect to their requirements is worthwhile
    only if the specified requirements and corresponding software systems have been
    verified and validated. In addition, they need to remember that incorporating
    changes to requirements into the software requirements specifications and corresponding
    software system tests is critical to ensure the complete and correct validation
    of software project deliverables with respect to requirements.


