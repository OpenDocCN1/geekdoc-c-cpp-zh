  md: 'should determine realistically what they can and cannot do and ask for help
    with training and planning for meetings across the development sites if they think
    they need this.


    # CONCLUSIONS


    Communication, collaboration, and coordination are essential elements of global
    software development. Factors such as trust, cultural differences, time separation,
    communication protocols, and planning are likely to influence communication, collaboration,
    and coordination more than the selected technology for communication. Project
    planners must make decisions about how much to spend on communication technology
    and travel between development sites. They should make decisions at the beginning
    of the project about the types and amount of communication, collaboration, and
    coordination that will be needed to complete the specific deliverables. Establishing
    protocols for communication are useful but may require training and guidance to
    put them into practice.


    # KEY IDEAS TO REMEMBER


    +   - Problems involving communication, collaboration, coordination, and trust
    are common to global software development.

    - Decisions about how to communicate, collaborate, and coordinate in a global
    software development environment are equally, if not, more important than decisions
    about communication technologies.

    - Planning for global software development projects should include the establishment
    of protocols for how to communicate, collaborate, and coordinate.


