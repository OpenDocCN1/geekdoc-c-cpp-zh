    Marvin Saymore was being asked to estimate his first full project after starting
    his new job with Transad. He had to give his boss an estimate, and he was not
    sure what the primary estimation issues were on his projects. The question was
    whether estimates were driven by events that were unavoidable or because of mistakes
    in estimating past projects. He began to reflect on what he had learned in school
    about estimation and what might influence the Washington Transit Authority (WTA)
    project.


    Marvin thought that when people in the company tried to estimate, they tried,
    in some sense, to predict the future. Marvin was not sure whether this was really
    true as the WTA project was. He thought that estimates were more based on the
    past and that they were best guess of what might happen, not a prediction. With
    that “best guess” came some risk and probability of success or failure. He had
    been taught that humans are creatures of habit and tend to do more or less the
    same unless a major change occurs in the environment. In a sense, Transad had
    more or less the same for the last 100 years of development, so change was not
    necessarily a big issue for the managers. So, based on this, history should be
    a good predictor of future activities.


    Marvin was still left with deciding what past, or more accurately, what data from
    the past, he should use. There are always so much data, but if you do not know
    what the data means or represents, it is hard to decide how to use it. For his
    purpose, Marvin would accept that data to follow the progress of a project was
