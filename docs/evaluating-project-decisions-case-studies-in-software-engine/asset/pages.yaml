  md: '# Preface


    Software engineering professionals and students all over the world make decisions
    every day that impact the outcome of their software projects (MSE). Although some
    people are very successful, others unfortunately do not take the steps necessary
    to ensure that decisions are likely to lead to success. For instance, not asking
    the right questions generally leads to solutions that do not adequately solve
    the problem considered. Likewise, the formulation of faulty assumptions can cause
    bigger engineering after the root cause of poor decisions. A common challenge
    for software professionals is the identification and correction of poor decisions
    before they cause even bigger problems. This may be because it is the fact than
    to monitor and evaluate them before their full impact is known.


    With our own experiences as software engineers and project managers, we observed
    firsthand the need for systematic approaches to evaluating and making decisions
    for software engineering. We observed that, in general, decision making for software
    projects lacks an analytical approach that can be applied systematically and consistently
    to increase the likelihood of making decisions that lead to successful projects.
    As educators of graduate students at the Carnegie Mellon Master of Software Engineering
    (MSE) Program, we use textbooks in software engineering that discuss issues involving
    decisions to be made but not specifically talk about how to evaluate and make
    these decisions. We found publications on decision making in the fields of general
    business and project management. Unfortunately, these works do not address the
    specific decisions that must be made for software development projects or the
    nuances of the issues related to these decisions.


    We searched for case studies to help students learn about software engineering
    issues in the context of real-world scenarios. The use of simulated cases is recognized
    to be an effective teaching tool for computer science and engineering, feeling
    few published cases that address the specific problems faced by software project
    managers or software developers discuss the decision-making aspects of software
    engineering. To fill the gap between theory and practice, we decided to write
    a book that would address the need of both practitioners and students of software
    engineering to understand decision making in the context of real software projects.


    The purpose of this book is to help practitioners, managers, students, and educators
    acquire the knowledge and skills needed to evaluate and make good decisions as
    well as to recognize bad decisions for software project management and software
    development. The book focuses on case studies constructed to help readers'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# PREFACE


    comprehend and apply concepts important to forming, implementing, monitoring,
    and evaluating critical decisions in real software projects. The case studies
    are based upon real project scenarios in organizations that differ in industry,
    size, and budget, but the names of the organizations and stakeholders have been
    changed to keep the real entities confidential. The book does not exhaustively
    cover every possible engineering event that might occur. Rather, the case studies
    focus on issues and decisions that typically make or break today''s software projects.


    Readers who have hands-on development or management experience with the full cycle
    of a software project will benefit the most from this book. We intend for the
    book to serve as a handbook of professional guidance for managing the decisions
    that can lead to software project success. Upper-level undergraduate or graduate
    students who have some undergraduate-level coursework in software engineering
    or professional software engineering experience will also find the materials to
    be a stimulating way to explore decision making in real-world software projects.


    Readers of this book can acquire knowledge of issues and problems that contribute
    to software project failure. Readers will learn about issues and problems that
    occur frequently, with a high impact on software projects, or are of emerging
    and growing importance. The case studies illustrate important decisions in the
    mapping between the user''s expectations and the provider''s solution. The case
    analysis highlights effective techniques to analyze software engineering issues
    or problems and to determine the best decisions or solutions to make. The book
    also discusses indicators to assess whether a decision or solution for a particular
    software project issue or problem is working.


    By reading and analyzing the software engineering case studies, you can develop
    skills to identify key factors that characterize software project problems. You
    can learn how to analyze the issues and problems that relate to a specific project
    scenario. The case analysis activities will guide you through the study of alternative
    decisions that could be made to address the case issues. They will help you develop
    ideas about how to apply the cases to real software projects. We hope that you
    will find the case studies to be an interesting way to learn about critical issues
    in software engineering and how to apply decision-making techniques to real-world
    software engineering projects.


    # Synopses of Book Chapters


    Following is a synopsis of the topics and case studies for each chapter. You will
    notice that all of the chapter titles include the word managing. We use managing
    to emphasize the need for project managers and software engineers proactively
    to identify issues or problems in a particular management area, to analyze and
    evaluate their nature and importance, to decide upon actions that need to be taken,
    to implement decisions by taking action, and to monitor results. We would like
    to promote the idea that all'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'software professionals, not just managers, need to manage the decisions that
    they make on the job. The case studies illustrate decisions made or that need
    to be made by various software project stakeholders. In some cases, the stakeholders
    manage the decisions in a way that leads to project success. In other cases, the
    stakeholders do not manage the decisions they make very well and thereby encounter
    project problems and sometimes failure.


    # Chapter 1: Managing Decisions


    Chapter 1 discusses decision making in software engineering, presents a model
    for evaluating decisions, and shows how the model can be applied to the decisions
    made by stakeholders in the case studies. The chapter illustrates the application
    of the model through several decision scenarios that involve technical issues.


    # Chapter 2: Managing Requirements


    Chapter 2 overviews the following activities involved in managing requirements:
    eliciting and stating requirements, verifying and validating requirements, negotiating
    and contracting requirements, managing requirements change and scope, and validating
    software deliverables with respect to requirements. The chapter provides an in-depth
    discussion of issues and decisions for each requirements activity. The chapter
    emphasizes that managing requirements does does not end until the software is
    retired.


    Case studies:


    +   * The New Account Project at HBC: This study highlights the activities and
    decisions involved in establishing the requirements. In particular, the case illustrates
    problems that can occur regarding decisions about the selection and involvement
    of stakeholders.


    +   * On Time, Within Budget, but Wrong: This study illustrates how decisions
    made when establishing and managing requirements can result in software project
    deliverables that do not satisfy the user stakeholder''s expectations though the
    project appears to be going well. In particular, the case scenario covers both
    functional and non own requirements including statements about required quality
    attributes.


    # Chapter 3: Managing Estimates


    Chapter 3 illuminates the importance of estimation in planning and managing software
    projects and other software engineering efforts. The chapter discusses the following
    activities involved in managing estimates: understanding requirements,'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'conceptually designing a solution, performing element-wise decomposition (divide),
    allocating resources from the bottom up (conquer), allocating overhead, estimating
    construction, and estimating change management. The chapter presents ways to factor
    considerations of scope, time, quality, and cost into decisions about project
    estimates.


    Case studies:


    +   - Estimation as a Tool: This case study examines process improvement in managing
    via collecting, studying, and applying historical data. In the case, a software
    project manager must determine the appropriate inputs to make a good decision
    regarding an estimate for a job.

    - When a Team Runs a Race: This case study examines factors that influence estimation
    and how these factors can lead to poor decisions about estimates. The case also
    looks at issues related to the concurrent execution of multiple projects with
    interdependent resources, personnel, and developments.


    # Chapter 4: Managing Plans


    Chapter 4 examines the role of decision making in planning software projects.
    The chapter outlines planning activities such the following: defining project
    objectives, policies, and scope; planning tasks and milestones; planning schedules;
    planning budgets; other resource planning; tracking and controlling the budget
    and schedule; managing midterm to project plans; managing processes with respect
    to project objectives, policies, and other project plans; and managing software
    development with respect to project objectives, policies, schedule, and budget.


    Case studies:


    +   - To Replan or Not to Replan?: This case study discusses the evaluation and
    decision of when, why, and how to adjust the budget, schedule, or staffing plans.

    - Managing Plans Is in the Details: This case study looks at problems and decisions
    that a software development organization faces in planning and tracking software
    projects, especially those that share resources with other projects or engineering
    groups.


    # Chapter 5: Managing Product


    Chapter 5 outlines the issues and decisions involved in managing software product.
    The chapter discusses the following activities involved in managing product: proper
    product definition, development process management, quality assurance and control,
    configuration management, product delivery and installation, training, field service,
    and the application of the decision model to make product decisions.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# PREFACE XV


    Case studies:


    +   * New Technology—Is It Always the Best?: In this case study, the project manager
    must make a decision regarding the adoption of new development technologies and
    techniques to create a product that is easier to maintain and less expensive to
    use.

    * Why This Product Wrong?: In this case study, a software developer is faced with
    the dilemma that it seems as though he did everything correctly, he still got
    the wrong answer.


    # Chapter 6: Managing Process


    Chapter 6 emphasizes the importance of managing the processes for software development
    and software project management. The chapter discusses activities involved in
    managing process: defining, selecting, and understanding process; teaching process;
    measuring process; evaluating process performance; changing the process to improve
    its effectiveness; and using the decision to make process decisions.


    Case studies:


    +   * Bank on the Verge: In this case study, a project manager asks two consultants
    to evaluate whether his team has made good decisions on process and whether there
    are things that the team can do.

    * Damn the Process, Full Speed Ahead: In this case study, a project manager is
    asked to review another manager''s project that has problems. The troubled project
    is behind schedule, and no one has been able to clearly identify what is causing
    the schedule slippage or what should be done to fix the project''s processes.
    The manager must decide how he can help the troubled project.


    # Chapter 7: Managing Risk


    Chapter 7 emphasizes the importance of managing risk across the project life cycle.
    The chapter discusses activities involved in managing risk: defining thresholds
    of risk for the project, identifying project risks, formulating statements about
    risk, communicating information about risk to project stakeholders, mitigating
    risk, and conducting resource trade-offs in making decisions about how to manage
    risk.


    Case studies:


    +   * Web Technologies: This case study examines the decisions and risks faced
    by an academic institution in its attempt to use an offshore development firm,
    a Russian company located in Moscow, to develop a Web-based system. In particular,
    the case study exemplifies what can happen when the project stakeholders do only
    minimal risk management throughout the project.'
  merge: -1
