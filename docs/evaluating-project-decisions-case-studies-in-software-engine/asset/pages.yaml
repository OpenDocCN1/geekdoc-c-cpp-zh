    Marc cautioned.


    “That is a good point. As you said, we could start with the identification and
    documentation of the processes being used at each site. Engineers and managers
    need to know what their colleagues are both locally and globally,” Lakshmi replied.


    “This could require significant time of the people who participate in the investigation.
