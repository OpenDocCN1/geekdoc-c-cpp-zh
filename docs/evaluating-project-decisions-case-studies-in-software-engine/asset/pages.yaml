    Yes, I am interested in helping to get this off the ground; but with my new role
    as the lead for the FibreNet product-line strategy, I may not be able to commit
    much time to the investigation. From my experience with the first release of FibreNet,
    I know that you will be very busy getting the release let out. You will need to
