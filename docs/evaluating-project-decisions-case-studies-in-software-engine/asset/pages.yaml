  md: '# 5.2 CONTEXT 145


    decide whether to ship the product, they look at the impact on schedule. The following
    is an example of the PEAK inputs for this decision:


    +   - (P) Problem: The customer needs a change to the product that is contained
    in the next software release as soon as possible, which is a situation that creates
    a very tight schedule for the development group.

    - (E) Environment: The development group has only a small number of computers
    running the new software release.

    - (A) Assumptions: The change is believed not to affect the rest of the software
    application.

    - (K) Knowledge: The specific change requested by the customer has been heavily
    tested with regression tests.


    **Solution:** Install the new version or a patch to meet the customer’s need on
    time.


    **Assumed Risk:** The new change will affect some uncontested component of the
    system or the regression tests do not sufficiently cover the system functionality
    and therefore force the team to deal with undetected problems that would impact
    the product schedule.


    When product managers are considering product decisions that deal with scope,
    they are normally looking at whether there are sufficient features ready to be
    presented to the customer. The “build” must represent a valuable enough “scope”
    for the customer. Many companies regularly release new versions of a product to
    add features and repair defects in older versions.


    As software developers, we have learned to deliver the product in shorter cycles
    to the customer so to avoid “the big bang” or the big surprise of over budget,
    quality over. This means the scope of each delivery must be enough to maintain
    customer expectations. We can ask if questions, such as the following, to formulate
    and evaluate our scope questions using the PEAK model:


    +   - (P) Problem: Is there sufficient scope available in the product to warrant
    delivery?

    - (E) Experience: Does the system allow for incremental delivery? Will the next
    cycle to be delivered adversely affect the data, environment, or software already
    delivered and installed?

    - (A) Assumptions: Is the assumption that the features that are not added to the
    product can wait or are not a high priority to the customer at this time true?

    - (K) Knowledge: Do we know everything that has been built? Do we know everything
    that is left to be built as well as the relative priority of the features not
    added to the product?'
