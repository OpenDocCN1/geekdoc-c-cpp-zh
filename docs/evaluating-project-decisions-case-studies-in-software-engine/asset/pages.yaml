  md: '# 7.2 CONTEXT 199


    # Table 7–2: Descriptions of Activities in Managing Risks (Continued)


    | Activity | Description of Activity |

    | --- | --- |

    | Identifying risks | **Definition:** Key to managing risk is the decision maker’s
    ability to identify the “right” set of risks (right being those actually faced
    by the project stakeholders). Although activities such as analyzing, prioritizing,
    mitigating, and tracking risks are also important, they all require a correct
    identification of risk. Without knowing what should be your real concerns, you
    might haphazardly expand energy and resources dealing with a set of items—some
    that might be relevant, some that might not be relevant, and some that are not
    considered.

    **Target Outcome:** The project managers continuously identify actual risks associated
    with their project decisions and with other existing project conditions |

    | Formulating risk statements | **Definition:** The typical way of phrasing a
    statement about a project risk is to use an “if-then” format. This common practice
    may result in failure to properly identify risk because these types of statement
    are simply hypotheses about things that might happen rather than statements about
    existing conditions that could lead to failure. Therefore, a better way of describing
    risk is to use a condition-consequence framework (Guch 1994; Williams et al. 1999).
    By identifying and describing existing conditions, which are observable and current,
    decision makers can analyze and determine how current conditions might negatively
    impact their projects (the consequence).

    **Target outcome:** The project managers continuously develop statements of existing
    conditions that have the potential to negatively impact the project. |

    | Mitigating, tracking, and controlling risk | **Definition:** Decision makers
    need to analyze the conditions associated with identified risks to determine the
    way in which the conditions could lead to negative consequences for the project.
    They also need to consider the impact of these potential problems with respect
    to scope, time, quality, and cost. Likewise, decision makers should determine
    how the conditions might be removed or controlled to reduce the risks or the potential
