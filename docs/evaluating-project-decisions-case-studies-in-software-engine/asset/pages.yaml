    # Verifying and Validating Requirements


    Verifying the requirements ensures that the specified requirements are clear,
    complete, consistent, and mutually compatible, while validating the requirements
    ensures that the requirements do not indeed satisfy the user’s business needs
    and expectations for the software project deliverables. It is particularly important
    that the software professionals who validate the requirements include stakeholders
    who represent the user’s point of view. It may also help if the professionals
    have university degrees in majors not related to computer science or have prior
    experience in writing requirements. We see the report on a statistically controlled
    experiment at Microsoft Corporation involving 700 professionals who participated
    in a requirements inspection (Carver et al. 2008).


