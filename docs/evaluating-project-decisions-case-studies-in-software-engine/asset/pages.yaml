    This chapter focuses on decisions that software project managers make to manage
    project requirements. The chapter discusses decisions in the context of activities
    performed by a software project team in managing requirements. It does not delve
    into the details of specific techniques for managing requirements because many
    other people have written about this subject. Some insightful books that present
    techniques as well practical advice for engineering software requirements are
    Hull et al. (2005), Jackson (2000), Wiegers (2003), and Wiegers (2006). IEEE Std.
    830-1998 describes the content and qualities of a good software requirements specification
    (SRS) and provides several sample outlines for an SRS. Other suggested references
    related to managing software requirements appear at the end of the chapter context.


    Before we talk about activities that compose the management of requirements, we
    should clarify some terminology. Practitioners use different terms to describe
    the activities involved in managing requirements. Some practitioners refer to
    the determination, documentation, and sign-off of the requirements as requirements
    engineering or requirements definition and to the activities after which the requirements
    are signed off as requirements management (Borland 2006). We have chosen a more
    expansive use of the term managing requirements to reflect that stakeholders,
    including software project managers, make decisions regarding requirements throughout
    the life of a software project as well as throughout the life of the resulting
    software. Effective management of decision making and the impact of that decisions
    have on the requirements and resulting software deliverables is critical to the
    success of a software project.


    Our discussion of managing requirements includes references to functional and
    nonfunctional requirements. Functional requirements are statements about the software
    that perform for the user. Some software project stakeholders refer to these collectively
    as the required software behavior. Nonfunctional requirements are statements about
    quality attributes such as maintainability, performance, reliability, safety,
    security, or usability that the software should satisfy. Project stakeholders
    generally describe and make decisions about software quality with respect to software
    quality attributes.


    We''ll start by presenting activities that software project teams perform to manage
    requirements; and while doing this, we will discuss decisions that software project
    managers make or should make during each activity. As you will note, managing
    requirements involve multiple activities, each of which involves multiple decisions
    to be made. Because decision making involves risk, the chapter briefly mentions
    risks associated with making decisions about requirements. Chapter 7, "Managing
    Risk," provides a more general discussion of risk in the context of making decisions
    for software projects.'
