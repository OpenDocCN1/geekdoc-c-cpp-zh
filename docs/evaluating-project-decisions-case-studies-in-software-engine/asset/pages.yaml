    +   3. What experiences have you had in which negatively or positively impacted
    the collaboration among team members? If you were one of the project managers,
    what would you decide to help minimize or resolve the trust issue?


    +   4. What other solutions to the problems involving communication, collaboration,
    coordination, and trust would you have considered? Use the PEAK model to analyze
    and explain the value as well as the risks associated with each of your alternatives.


    # DISCUSSION


    Being new to global software development, Marc was not aware that communications,
    collaboration, and coordination interfere with the successful achievement of objectives
    by globally distributed projects. In the project planning phase, he thought about
    the means of communication across geographical distances; however, did not consider
    the impact that factors such as trust, cultural differences, and geographical
    and time separation could have on communication, collaboration, and coordination
    across his globally distributed team. He has learned firsthand experience that
    understanding and controlling these factors affect communication can help project
    managers minimize the tendency for globally distributed groups to work in isolation
    rather than to collaborate and coordinate their work.


    Marc has decided that the solution to the problem centers on the leadership that
    the project managers will provide to their teams regarding communication protocols
    and the need for collaborative and coordinated work across the development sites.
    Establishing an organizational culture of open communications and collaborative
    thinking usually starts from the top. Marc''s idea that the project managers will
    have to lead this effort is reasonable since Marc cannot provide the necessary
    hands-on guidance at geographically dispersed sites.


    One might argue that training may be needed in addition to leadership to help
    the team understand the factors that affect communication and how to apply protocols
    that the project leaders or organization define for communications and collaborations.
    Lastly, there is the practical reality that the project managers may not have
    the time and energy required for effective leadership in this area. Marc should
    discuss these issues with the project managers at their meeting in Toulouse. The
    project managers'
