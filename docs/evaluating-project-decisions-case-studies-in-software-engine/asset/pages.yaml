    The following two examples about experiences at restaurants illustrate the historical
    effect of experience on expectation:


    Case 1: When you arrive at the restaurant, a waiter greets you at the door and
    leads you to a table. The waiter eagerly takes orders and delivers the food promptly.
    The bill is presented in a timely fashion, and you leave. Two hours later you
    are sick to your stomach and must go to the hospital.


    Case 2: You do arrive at a restaurant, and there is a sign that says to seat yourself.
    There is tape over the word phrase. Someone runs by your table and throws down
    two menus even though there are three people in your party. You finally grab an
    apron on a waiter who takes your order. Forty-five minutes later, the food arrives,
    but the smell is like one from heaven. You spend 40 minutes eating and enjoying
    every bite. You don''t even notice that the bill is already on the table. You
    pay the bill and go home.


    Which experience will generate the best expectations in the future? Which restaurant
    will you visit? Expectations are both product and process based, and software
    developers and development managers must balance these two.


    To deliver a software product or service that will satisfy the customer/user stakeholder,
    a software project team needs to understand customer satisfaction depends on two
    factors: the customer''s expectations for the way in which the product or service
    to be delivered will perform and the actual performance of the delivered product
    or service. A customer will be satisfied with your product or service only if
    it performs as expected. Any difference between the expected and the perceived
    or real performance will change the customer''s satisfaction level (not necessarily
    in your favor). Setting the customer''s expectations for the product that will
    be delivered is the first step, then the project team must deliver a product or
    service whose actual performance is as high as the customer expectations. Because
    expectations can change over time, it is important to monitor and try to adjust,
    if needed, the customer''s expectations over the life of the project.


    In summary, expectations are based on some level of performance in the four dimensions
    of time, quality, and cost. Stakeholders have expectations for both the product
    delivered and the process used to produce the product. Managers of software development
    have historically found it difficult to help set, influence, and manage stakeholder
    expectations over the life of a project or product. To improve their management
    of stakeholder expectations, project managers need to understand and decisively
    how to do the following:


    +   - Manage expectations along all four STQC dimensions

    - Manage both product and process with respect to expectations

    - Formulate questions that help them determine what stakeholders really want and
    remember that stakeholders may not be forthcoming or adept in clearly expressing
    what they want'
