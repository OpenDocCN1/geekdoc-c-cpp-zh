  md: '# 342 CHAPTER 10 MANAGING GLOBAL DEVELOPMENT


    distributed project teams. Factors such as cultural differences, geographical
    and time separation, trust, and the limits of communication technologies affect
    the ability of a global project team to conduct the dialogue to achieve project
    objectives in a collaborative way. Failure to plan for communication, collaboration,
    and coordination at the beginning of a project and then to follow the agreed-upon
    protocols for how these should be accomplished frequently results in projects
    in which team members are geographically separated have problems working and making
    decisions together on project tasks.


    The case studies in this chapter focused on project management issues and decisions
    that affect global software development. The first case study, “Globally Distributed
    Team: FibreNet Project,” highlighted issues of communication, collaboration, and
    trust for a globally distributed team. More specifically, the case study revealed
    challenges associated sharing information and making software decisions in a global
    development environment. The second case study, “Managing Global Software Development
    at FibOptia,” focused on problems and decisions regarding how to manage process,
    product quality, and cost in a global software development environment. The senior
    software manager in this case also needed to decide how to establish trust among
    a globally distributed team.


    Managing global software development starts with an evaluation of decisions regarding
    how to handle communication, collaboration, and coordination within a global environment.'
