- img_proc: true
  md: '# 196 CHAPTER 7 MANAGING RISK


    In the PEAK decision model, risk is one of the outputs of decisions that are made
    for a project. In a way, managing risk means managing the level of risk that is
    tolerable to the project as each project decision is made. The basic risk management
    activities discussed later in the chapter apply to the management of general project
    risks, but understanding that risk is inherently part of making choices is also
    key to managing risk. The fastest way to get people about what they are doing
    is to ask them the simple question, “Are you sure?” Having to face the risks involved
    in making decisions stimulates people to question or evaluate their choices.


    Using the PEAK model to make transparent the risk associated with each decision
    (or chosen solution) is one way to make risk management an integral part of a
    project. Decision makers can ask-if questions about the inputs to the decision
    model to identify and verify the factors that contribute to the risk associated
    with each alternative solution. They can verify the risks associated with the
    alternative solutions are valid and can confidently use this information to make
    a decision.


    Many of the common software projects originate from decisions that are made about
    the topics discussed in this book, such as requirements, estimates, plans, product,
    and so on. But some software projects specifically have to deal with issues involving
    (S), time (T), quality (Q), and cost (C), which we have discussed throughout the
    book as four STQC dimensions of a software project. Table 7-1 contains a suggested
    set of questions to help you evaluate the risk associated with the STQC dimensions
    of a software project via the inputs to the PEAK decision model. By answering
    these questions, you can determine how well the risk associated with each STQC
    is being managed for your project. You can incorporate these evaluation into your
    project for managing software project risk. Now examine the table, and think about
    how you would answer these questions for your current soft-project.


    Table 7-1: Risk Management of STQC Dimensions Using PEAK


    | Dimension | Risk PEAK Review |

    | --- | --- |

    | Scope | (P) Problem: Is the scope stable as stated?

    (E) Experience: Has this customer reliable in keeping the scope stable?

    (A) Assumptions: Is the assumption that the specified scope is doable with the
    available resources?

    (K) Knowledge: Do you understand the relationship between scope and resources
    on software projects? |'
