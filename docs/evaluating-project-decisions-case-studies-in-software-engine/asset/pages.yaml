    Also, they were reluctant to work collaboratively on the interfaces to their software
    because there were decisions to be made regarding the required QoS service policies.
    The engineers working on the QoS algorithms were also reluctant to release the
    algorithms without full documentation because they were concerned that the software
    engineers working on the business layer software might not know how to interpret
    the algorithms. It seemed to be a general concern all that partially project deliverables
    should not be reviewed, released, or even discussed across the development sites
    until they were complete, including the documentation,” Marc explained.


    How does this relate to share partially complete relation to differing interpretations
    of the V Model?” Lakshmi inquired.


    In the Case of Hyderabad, the software engineers interpreted the blocks in the
    diagram. When the model showed that the software system requirements are done
    before the architectural design, they interpreted this to mean that all the requirements
    were to be produced and released before the architectural design could be reviewed
    outside the local group. In Montreal, the concern was simply that releasing the
    QoS algorithms before they were fully documented might lead to misinterpretation.
    In both situations, the team did not see the value of reviewing those parts of
    a specification that are complete and of discussing those that are still evolving,”
    Marc replied.


    Are any of the development sites using the Rational Unified Process or Agile techniques?”
    Lakshmi asked.


    Yes, the user interface group in Toulouse has applied both of these techniques.
    The software engineers work directly with customers on the design of the user
    interface. They have found that use cases are helpful for describing requirements
    in a way that can be discussed with customers. They are comfortable with creating
    mock-ups of user interfaces that can be quickly modified in response to customer
    feedback,” Marc explained.


    How familiar are the team members at each site with the processes being used at
    the other sites?” Lakshmi probed.


    Other than the processes that were outlined in the plan projects, such as iterative
    development and incremental release, no processes have been documented for use
    across the software development sites,” Marc replied.


    I am interested in helping FIBOptia standardize and fine-tune the software product
    that it uses at the different sites. FIBOptia has made significant investments
    of capital to establish the three research and development sites, and I think
    global software development is here to stay. Therefore, we need to understand
    how to manage global software development effectively. Considering the speed at
    which new technologies emerge, effective management of global product development
    may differentiate us from other companies that develop telecommunications products
    and services,” Lakshmi commented.'
