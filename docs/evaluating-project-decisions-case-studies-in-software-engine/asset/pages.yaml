    impact on project success. An effective risk management approach involves all
    the risk management activities and is applied consistently and continuously from
    the beginning of the project until the end.


    Managing risk is an integral part of managing decisions. Evaluating and making
    project decisions should encompass the assessment of risk associated with alternative
    solutions. Therefore, all the chapters in the book discuss risk in the context
    of making project decisions.


    For information about managing project risks as an approach to decision making,
    see Chapman and Ward (2002). Gluch (1994) and Williams et al. (1999) provide additional
    information about stating risks for software development projects in a decision-consequence
    form. Mojahedi et al. (2008) discuss a group decision-making approach to perform
    risk identification and analysis concurrently. Dillen and Tinsley (2008) discuss
    how prior misses are opportunities to learn how to better manage risk in future
    decisions. To learn about managing risk in global development, see Willey and
    Hall (2007). Wartentin et al. (2009) present an integrative framework for analyzing
    systems project risks.


    # 7.3 Case Studies


    The two cases in this chapter focus on aspects of managing risk that are often
    overlooked by software project stakeholders. In the first case, “SEWeb and Rusoft
    Technologies,” the software project managers encounter unexpected problems related
    to their work with an offshore development team located in Russia and the cross-cultural
    differences that arise. The second case, “Falcon Edainment and the RiskSim Project,”
    presents a project whose troubles stem from the client-developer interaction.
    Decisions made on both projects appear to have led the developers and customers
    none of them wanted to take. Minimal risk management was applied in both cases.
    Read these cases to determine the risks and decisions that led to project problems.


