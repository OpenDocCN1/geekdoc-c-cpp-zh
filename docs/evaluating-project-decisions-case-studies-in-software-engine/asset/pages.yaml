  md: '# CASE STUDY: SOFTWARE TEST RERUN PROBLEM


    # Inputs


    (P) Problem: The software test failed and yielded incomplete test results. What
    should Bob do?


    (E) Experience: Bob knows the test. (He has this regression test before. He can
    estimate the execution time and predict potential causes of failure. Therefore,
    Bob knows the test can be executed completely by noon if he starts the test now.)


    (A) Assumptions:


    +   The test results are insufficiently complete. (Only complete test results
    are of sufficient to the software engineers who use them.)


    +   The resources are available during the test period (the next four hours).


    +   The test will execute to completion without problems. (The problem that occurred
    last night or any other problem will not occur.)


    (K) Knowledge:


    +   Bob knows what to run and understands the system well enough to run the test
    (fact).


    +   The resources are working sufficiently well to successfully run the test (environment).


    Outputs


    Solution: Bob did not give the first alternatives in the following list much consideration
    and choose the last alternative:


    +   Do not rerun the test. (Deliver incomplete test results to the software engineers.)


    +   Rerun the whole test later. (The test results will be a day or more late.)


    +   Rerun the whole test this morning. (The test results will be approximately
    half a day.)


    Assumed Risk:


    +   Incomplete results that are available now may be of value to the software
    engineers who use them.


    +   The test may fail, or the completion of the test results may be delayed for
    some other reason. (For example, another user may have already planned to use
    the computer for testing during the day. The execution of another test on the
    computer may delay or interfere with may the execution of the target test. The
    power outage may occur again.)


    You might wonder whether each of the inputs is true. The assumption that "only
    complete test results are of sufficient value" is particularly suspect. If this
    assumption is correct, then failure of the test to complete once again preclude
    the usefulness of the test results. This constraint would necessitate a more controlled
    test environment (for example,'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'a battery backup for the test computer) including more extensive monitoring
    of the test execution. Bob could have assumed that any results up to the point
    where the power failure occurred might be valid. His actual assumption may have
    overly constrained the decision so he did not consider other alternative solutions,
    such as delivering partially test results and rerunning only the complete part
    of the test later after verifying that the test computer would be available. In
    addition, he is assuming that the power failure will not occur again when he returns.
    What if the test is the cause of the power failure? An unproven assumption, as
    the problem will not occur again, introduces risk for a decision based upon this
    assumption. If one of the assumptions is not true, the decision acted upon may
    result in failure. Decision makers reduce the risk associated with assumptions
    by gathering the information to convert them into (knowledge inputs).


    A critical aspect to understand about the decision model is that the inputs and
    outputs exist if the decision maker does not acknowledge them. Bob made the implicit
    assumption that he has time to run the regression test this morning. Faced with
    the failed test, Bob did not explicitly, at not yet, but asked about tasks he
    might already have scheduled to do this morning. By explicitly identifying the
    inputs, decision makers have the opportunity to correct faulty information they
    might otherwise use to make their decisions. The model encourages decision makers
    to explore the kinds of information that they have about a problem and to carefully
    determine feasible solutions. The model also guides decision makers to consider
    risks that may be associated with associative solutions or decisions. Faulty assumptions
    or incorrect knowledge about the problem environment introduces the risk that
    a chosen solution will not or succeed in solving the problem.


    # CASE STUDY


    # California Bridge Problem


    The California Department of Transportation, Caltrans, was very proud of the state''s
    freeinfrastructure, which included thousands of bridges. Before the 1991 earthquake,
    the Caltrans engineers thought that they had the perfect model for freeway bridges
    in California. They used concrete, oblong, cylinder columns that they thought
    would withstand an earthquake of magnitude 8.49 on the Richter scale. The 1991
    earthquake, of magnitude 6.2, changed the engineers'' understanding of earthquake
    movement. Instead of moving up and down as engineers previously understood, this
    quake generated a side-to-side motion, which caused the bridge support columns
    to shear. The two-minute earthquake in 1991 collapsed many bridges in California,
    including part of the Oakland Bay Bridge.'
