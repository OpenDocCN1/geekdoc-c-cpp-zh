  md: '# More Resources for Successful Software Project Management


    # The Mythical Man-Month


    Few books on software management have been influential and time-less as The Mythical
    Man-Month. With a blend of software engineering facts and thought-provoking opinions,
    Fred Brooks offers insight for anyone managing complex projects.


    ![](img/b881997d603ad72821fd2f4c10efba76_394_0.png)


    ISBN-13: 978-0-201-83595-3


    # Agile Project Management


    Renowned agile pioneer Jim Highsmith thoroughly updates his classic guide to APM,
    extending and refining it to support the largest projects and organizations.


    ![](img/b881997d603ad72821fd2f4c10efba76_394_1.png)


    ![](img/b881997d603ad72821fd2f4c10efba76_394_2.png)


    ISBN-13: 978-0-321-65839-5


    # The Software Project Manager''s Bridge to Agile


    ![](img/b881997d603ad72821fd2f4c10efba76_394_3.png)


    Two long-time certified Management Professionals (PMP®s) and Scrum trainers—Mikele
    Sliger and Stacia Broderick—show experienced project managers how to successfully
    transition to agile by refocusing on facilitation and collaboration.


    ISBN-13: 978-0-321-50275-9


    # Catastrophic Disentanglement


    Author E. M. Bennattan describes a 10-step process to identify severely troubled
    projects and avoid costly failure. Whenever projects are in trouble—whether you
    are a senior manager, project manager, team member, or software customer—this
    book could save your career.


    ![](img/b881997d603ad72821fd2f4c10efba76_394_4.png)


    ISBN-13: 978-0-321-33662-0


    ![](img/b881997d603ad72821fd2f4c10efba76_394_5.png)


    For more information and to read sample material, visit informit.com.


    Titles are also available at safari.informit.com.'
