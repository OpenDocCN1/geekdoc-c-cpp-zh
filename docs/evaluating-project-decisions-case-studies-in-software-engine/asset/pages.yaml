    communication and coordination, two factors that are complicated by distributed
    software development. Making decisions about task breakdowns and task assignments
    involves tradeoffs between the benefits of global software development and the
    complexity complexity managing globally distributed tasks.


    The management areas and activities discussed earlier in the book are the same
