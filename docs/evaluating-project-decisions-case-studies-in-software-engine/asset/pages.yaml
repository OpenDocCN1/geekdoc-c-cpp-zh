    Another challenge involves scope creep that may occur when software developers
    implicitly expand or contract the requirements. The problem with implicit changes
    to scope is that they are less likely to be communicated uniformly to the project
    stakeholders who need to be aware of. Uninformed stakeholders are likely to be
    surprised and possibly dissatisfied with the resulting validation test results
    or software project deliverables. The software project stakeholders should discuss,
    evaluate, and explicitly decide upon changes to the software requirements and
    their scope. The decision makers need to know about them, as the software analysts
    who can make certain that the changes are compatible with the ongoing requirements
    and the software engineers designing them to validate the software project deliverables.
    Hazard and implicit changes to requirements can lead to software development problems
    and many to unsatisfactory software project deliverables.


