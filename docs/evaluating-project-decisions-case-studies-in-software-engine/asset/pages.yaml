    # Reflection on Decisions to Be Made


    Back in her new office at the FIBOptia in Hyderabad, Lakshmi reflected on what
    she had learned from Marc in Toulouse. She will be working with other project
    stakeholders on the schedule and budget for the development of software for the
    FibreNet II product. To effectively manage this global software effort, she will
    need to make some decisions to resolve issues that she knows.


    One ongoing issue has been to improve the communications, collaboration, and coordination
    across the globally distributed sites. Trust still seems to be an influential
    factor. What can Lakshmi do to resolve or alleviate the impact of this issue for
    the development of the FibreNet II software? How will her choices affect the budget
    and schedule?


    She brainstormed some ways to improve communications, collaboration, and coordination
    across the development sites:


    +   Exchange project members between sites for the project duration. For example,
    relocate one project member from Montréal and one from Toulouse to India to help
    the Hyderabad team members work with the remote sites. Likewise, two team members
    from India could be relocated to Montréal and Toulouse, respectively. How many
    relocations would be most effective? Should there be at least one team member
    from each remote site at each local site (six relocations), or would some other
    arrangement be effective from communications/collaboration and budget points of
    view?'
