  md: '# Case Summary


    # DESCRIPTION


    A developer is pondering how his company got the product wrong after having done
    everything right, at least from his perspective. He is wondering where things
    went off track and why he couldn''t deliver a customer''s product on time, on
    schedule, on budget, and in a way that makes all the customer''s needs.


    This case study will present the idea that although things appear to be "easy"
    in the product definition, this doesn''t always mean that you will get correct.
    There are hidden assumptions, issues, and expectations that, if not properly understood,
    will lead to poor product management decisions and possibly project failure. This
    case study illustrates the failure of the product was set by the very first decision
    that was made for the Three-Tech phone search product. By the time the developer
    is brought on to the project, decisions have been made that have a lasting impact
    on the final product and may not be recoverable.


    # CASE STUDY OBJECTIVES


    After reading the case study, you will be able to do the following:


    +   See how decisions early in the life of a product can have a dramatic impact
    on the product management to be done later


    +   Understand how various product management decisions affect the product and
    why


    +   Understand that scope and time are not all that matters


    +   Show that early bad decisions can create poor customer expectations


    # SUBJECTS COVERED


    Product versus process issues, what makes a good product in the eyes of a customer,
    quality attributes, and perceptions of product


    # SETTING


    The case study occurs in a garage with a start-up company that always wants to
    take shortcuts. "You can figure it out" and "Doing things for fun" are common
    phrases that usually present risks in a project. The environment is a small project.
    But the case product is interesting and has enough technical challenge to leave
    you saying, "I could have made that mistake." The case study should help you see
    that a dumb question is simply one that is not asked. The product is managed correctly,
    but the influences of the environment determine the project''s success or failure.'
