  md: '# CASE STUDY: CALIFORNIA BRIDGE PROBLEM


    Inputs


    Outputs


    | (P) Problem: Need earthquake-proof, low-maintenance bridges. | |

    | (E) Experience: Concrete structures held up against earthquakes in the past.
    | |

    | (A) Assumptions: Engineers understand how earthquakes move. Concrete pillars
    withstand earthquakes. | |

    | (K) Knowledge: Concrete is maintenance free. Concrete columns withstand up-and-down
    movement. | Decision Process | Solution: Build bridges supported by oval, concrete
    columns.<br>Assumed Risk: Will bridges concrete columns survive an earthquake
    and be low maintenance?


    Figure 1–4: California bridge problem


    Engineers studied the new models of earthquake movement and decided that the solution
    was to combine two materials to create a new "unbreakable" column. This column
    has the same concrete oblong in the middle as before but now has a steel sleeve
    on the outside. The steel sleeve holds the concrete in place against the shear,
    while the concrete columns still defend against an up-and-down motion. The problem
    is that the columns need regular maintenance because the steel sleeves rust. The
    original columns were basically "maintenance free" (El-Azazy).


    This scenario shows some of the inputs based on faulty knowledge. Caltrans wanted
    a solution to survive in earthquakes that was maintenance free. They based their
    solution on knowledge and experience that they thought was correct. The new earthquake
    model forced a new decision with the constraint of required bridge maintenance.
    The idea that knowledge remains fixed and is correct can correct an environment
    in which the risk associated with decisions based upon this knowledge is unacceptable.
    As the Caltrans case illustrates, the inputs and outputs to making a decision
    can and sometimes change. Figure 1–4 shows the inputs and outputs for the initial
    decision to build concrete structures.


