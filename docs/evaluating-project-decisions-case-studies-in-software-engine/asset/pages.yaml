  md: '# CHAPTER 4 MANAGING PLANS


    You would probably imagine that most projects could not be accomplished without
    planning. Imagine trying to construct a new home, to develop an extensive travel
    tour for a group of tourists, to organize a national conference, to put together
    a trade show, or to develop a large software system without a plan. Projects,
    regardless of their scope or complexity, need a plan of attack. The project plans
    should be inputs into daily decisions about project execution.


    Project plans address any aspect of a project that will be managed, such as development
    plans for how a project is developed; work progress; budget plans for managing
    tasks, schedules, resources; and process plans for managing product and process
    quality; and support plans for managing tools needed to execute the project (configuration
    management system, development tools, issue-tracking system), and on. Humphrey
    (2000) defines a comprehensive software team in which members of the team assumes
    these types of management responsibilities in the roles of development manager,
    planner, quality or process manager, and support manager, respectively. He adds
    a team lead and does not assign a specific role for the management of project
    costs.


    The chapter discusses activities and decisions that compose managing project plans
    and givesviews of fundamental principles for evaluating and making decisions about
    project plans. This chapter focuses on helping you develop a practical understanding
    of basic project plans that specify the project purpose and objectives, work organization
    and responsibilities, constraints, and budgetary aspects. Other chapters discuss
    planning related to process, product, and risk. It provides basic ideas to keep
    in mind when planning the scope (objectives), time (schedule), and cost (budget)
    for your projects. Chapter 5, “Managing Product,” and Chapter 6, “Managing Process,”
    discuss quality constraints in more detail. Chapter 2, “Managing Requirements,”
    more comprehensively discusses the issues and decisions associated with managing
    software requirements change and scope.


    Because software projects rarely proceed exactly as planned, the replanning is
    inevitable. The client wants to keep the project scope midstream, there are unexpected
    requests from the field service organization, project members leave the company,
    the project estimates are too low, the project is behind schedule or over budget,
    and so. At some point, for most software projects, the plans will not reflect
    the actual status of the project. Questions arise regarding the need to replan
    as well as regarding the aspects of the project to replan. Project managers usually
    decide to replan when the current plans no longer help in directing the project
    to completion of the objectives on time, within budget, and according to specification.
    Replanning usually involves changes to the scope, schedule, quality, or budget
    for the project. When software plans do not work out, it is necessary. See Rönkkö
    et al. (2005) for an empirical study of the necessary means that needs to be provided
    within a company in order to cope with situations. Deleris et al. (2007) from
    the IBM Research Center discuss a two-pronged approach to adaptive project replanning
    that involves'
