  md: '# Chapter 7


    # Managing Risk


    # 7.1 Chapter Objectives


    After reading and thinking about the concepts and case studies presented in this
    chapter, you will be able to do the following:


    +   * Identify major risks as they pertain to software projects and the decisions
    risk that will impact a project

    * Identify key issues and decisions involving the management of risks (or lack
    thereof) in the case chapter studies

    * Use the concepts to suggest feasible solutions to the problems faced by the
    case study stakeholders


    # 7.2 Context


    Risk management activities are an integral part of what project managers and team
    members should practice and make decisions about a software project. Since risk
    is inherent in projects, the question is not whether risks will materialize but
    rather when they do so. Experienced managers recognize the need to systematically
    identify, analyze, and mitigate the risks faced by their project. They need to
    communicate with project stakeholders (for example, their team, the client, and
    management) to apprise them of project risks, the actions to be taken to mitigate
    these risks, and the potential consequences associated with these risks. In particular,
    they need to be aware of and consider the risks associated with their project
    decisions.'
