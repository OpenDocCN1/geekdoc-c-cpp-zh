    The new system design and architecture started on September 15, 2006, and ended
    on November 30, 2006. The effort for this stage was 8 developers x 2.5 months
    or 20 man-months. The new system prototyping prototyping started on October 15,
    2006, and ended on November 30, 2006.


    The new system development for the bank market started on December 1, 2006, and
    ended on February 28, 2007. The new system was integrated and tested using ten
