- img_proc: true
  md: '# CHAPTER 2 MANAGING REQUIREMENTS


    Global Positioning System (GPS): A “constellation” of at least 24 well-spaced
    satellites that orbit Earth and make it possible for GPS receivers to determine
    their geographic location, direction, and time. The location accuracy is anywhere
    from 100 to 15 meters for most equipment. Accuracy can be pinpointed to one meter
    with special military-approved equipment (SearchMobileComputing).


    Radio Frequency Identification (RFID): A method of identifying unique items using
    radio waves. Typically, a reading device communicates with a tag, which holds
    digital information in a microchip (RFID Journal).


    Selective availability (SA): A DoD program that controls the accuracy of pseudorange
    measurements, degrading the signal available to unqualified receivers by differing
    the time and ephemeris data provided in the navigation message (National Park
    Service).


    The United States removed SA on May 1, 2000, and currently has the capability
    to retrieve the feature (Leopold 2000).


    Software quality: The degree to which the software exhibits a desired combination
    of attributes (IEEE Std. 1061-1998; ISO/IEC Std. 9126-1:2001).


    Note that functionality is a quality attribute that describes what the software
    is supposed to do. Nonfunctional quality attributes (such as performance and security)
    impose constraints on the design and implementation of software systems. Practitioners
    refer to specifications regarding software quality attributes as quality of service
    (QoS) requirements. A requirements statement about a software quality attribute
    describes the degree (or the way in which) a particular attribute is to be achieved.


    Software release plan: A description of how the software and its requirements
    are expected or likely to change over the life of the software. A product release
    plan outlines the functional and nonfunctional requirements to be satisfied by
    each release of the software (Ruhe and Sali 2005).


    # REFERENCES


    See Finkenzeller (2003) and Garfinkel and Rosenberg (2005) for information about
    RFID technology and its use. Bock (2006) addresses RFID interoperability, which
    is important for the evolution of commercial products.


    Lomer (2007) provides information to support the design of navigational systems
    using both Galileo and GPS signals. For a comparison of Galileo, GLONASS, and
    NAVSTAR (U.S. constellation of navigational satellites), read Thurston (2002).
    Peruse Proceedings of the IEEE International Conference on RFID for a review of
    current GPS research.'
