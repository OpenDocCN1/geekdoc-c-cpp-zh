    # DISCUSSION


    Since we are attempting to restructure a project in a way to minimize risk, the
    decision regarding what to do is dependent on evaluating the risk associated with
    alternative solutions. Whatever risk is assumed must still allow the project to
    succeed even if an risk materializes. Naturally, any decision that negatively
    impacts the project requirements, schedule, or budget (which has already been
    compromised) is not a good choice. Fisher and his boss Johnson should look for
    solutions that would maximize their control over scope, time, and cost.


    The solution to minimize the risk associated with communication and cultural barriers
    because these are primary contributors to the problem. Handling the communication
    issue would be a viable mitigation strategy to reduce the likelihood that open
    issues enters into problems. Another approach might be to improve or reduce the
    impact of the poor project management skills exhibited by the Russ staff members
    assigned to the project.


    With respect to cultural differences regarding work styles, the decision should
    focus on the amount of project control and oversight needed by the U.S. managers.
    Fisher should realize granting unlimited flexibility in how he executes the project
    is a risk that he cannot afford. Fisher must also justify to his boss that he
    has the ability to control the project and to minimize the downside of working
    with Russian developers. To do this, he must oversee and control the project deliverables,
    project execution processes, and communications with the developers.'
