    # 4.2 Context


    A project is commonly understood to be an undertaking requiring concerted effort
    that is synonymous with a plan or proposal (TheFreeDictionary by Farlex, Project).
    A plan is a scheme, program, or method worked out beforehand for the accomplishment
    of an objective (TheFreeDictionary by Farlex, Plan). In practice, the software
    project objectives (scope), schedule for completion (time), quality attributes
    to be achieved (quality), and budget (cost) need to be finite. These four dimensions
    relate to the expectations of the project stakeholders (as discussed in Chapter
    9, “Managing Stakeholder Expectations”). Also, a project is usually characterized
    by a clear start and end.'
