  md: '# CASE STUDY: THE NEW ACCOUNT PROJECT AT HBC 53


    stakeholders has requested a delay in the project that would be costly if upper-level
    management grants the request. This new stakeholder may or may not be able to
    “improve” the requirements.


    The assumption that there would be no corporate-level involvement resulted in
    a decision to not consider stakeholders from the new Corporate IT group and Web
    Strategy Team. Likewise, the software project managers, Susan and Georg, assumed
    that they had sufficient knowledge to select the stakeholders who would be candidates
    for establishing the requirements. They might have reduced the risk that these
    assumptions were faulty by asking upper-level management as well as the other
    project stakeholders to review the list of candidate stakeholders and to suggest
    additional people who should be considered.


    The case also presents the problem of allocating time to handle feedback from
    the verification and validation of requirements. The time scheduled for the verification
    and validation of the requirements was not sufficient. The time interval needed
    to correct errors and handle questions resulting from the review of the requirements
    overlapped with the week scheduled for the completion of the project agreements.
    Notably in this case, the software project managers were able to add a week to
    the establishment of requirements by using some of the extra time allocated to
    the project. But unfortunately, the project now has “space” to handle unexpected
    events that may arise in the future.


    Lastly, this case raises issues regarding the corporate-level management of IT
    projects across independent business units. The decision to be made by upper-level
    management regarding the review of requirements for software projects that are
    “internal” to a business unit relates to these issues. In particular, the new
    corporate-wide focus on Web-based services highlights the needs for policies regarding
    Web software projects to be undertaken within as as across the business units.


    # CONCLUSIONS


    Despite couple and budget pressures, the software project managers decided upon
    a set of stakeholders who worked effectively to establish the requirements for
    the New Account Project. The case problem involved the process that the software
    project managers used to make their decision regarding the selection of candidate
    stakeholders. They did not adequately consider the risks associated with their
    assumptions and did not have their decision reviewed by people who might have
    been able to find potential problems associated with their list of candidate stakeholders.


    # KEY IDEAS TO REMEMBER


    +   - Selecting appropriate stakeholders for establishing software project requirements
    is critical.


    +   - The appropriate involvement of stakeholders increases the likelihood that
    acceptable requirements will be established on time and within budget.'
