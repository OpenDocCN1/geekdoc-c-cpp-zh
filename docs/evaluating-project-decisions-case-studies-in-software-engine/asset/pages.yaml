    When managing customer expectations with respect to STQC, software developers
    set their own expectations about technology, process, and people. While establishing
    the requirements, developers interact with the customer/user stakeholder to determine
    what the customer wants. To decide whether they can achieve the customer''s desired
    scope while satisfying cost and time constraints, developers are likely to think
    about the processes to be used or any technologies used to develop the project.
    Likewise, they focus on technology or process as they produce the project deliverables.
    The main point is that the customer has STQC expectations about the project and
    project deliverables, the developer has expectations about the technology, process,
    and people need to execute the project and produce the project deliverables.


    In managing stakeholder expectations, the project manager and the development
    team make decisions about the composition of technology, process, and people that
    is needed to satisfy stakeholder expectations. Some project decisions concern
    the relationship to be maintained with critical stakeholders as the customer/user
    or upper-level management, and at other times project decisions involve the actual
    tasks that need to be done project deliverables with respect to STQC. The focus
    or concern of project decisions changes throughout the life of the project. Initially,
    project manager and development teams are interested in establishing strong relationships
    with their clients. When the focus is centered on relationships. As the project
    progresses, and especially on projects where time constraints become apparent,
    the focus changes to getting the tasks done as a mechanism for enhancing the client
    relationship.


    Figure-9 models the relationship between the STQC expectations of the customer
