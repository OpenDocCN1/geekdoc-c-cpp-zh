    At the upcoming replanning session, the PMO will work on the problem of adjusting
    the schedule, staffing, and budgetary plans so that the project can complete the
    Phase 1 tasks on time and within budget.


    # Case Analysis


    # ANALYSIS ACTIVITY


    Analysis Background


    +   (P) Problem: In the case, the project managers and planners must identify
    the root causes of the schedule slippage and decide whether replanning is needed.
    In particular, they must decide whether adjustments to the schedule are necessary.


    +   (E) Experience: The project managers and planners communicate their understanding
    adding more people to the project may actually cause the schedule to slip because
    of the extra communication, coordination, and management that would be needed.
    Their understanding of this phenomenon may be from experience, or it may simply
    be that they have studied and agree with Brooks'' Law (Brooks 1995).


    +   (A) Assumptions: The project managers and planners assume the estimates used
    to schedule the tasks and allocate resources are good since they were based upon
    a similar project from the past.


    +   (K) Knowledge: At the special project meeting, the managers and team identified
    the following factors that they think have caused the schedule slippage and are
    related to the decision of whether replanning is needed.


    +   The business analysis and data modeling staff have not been able to complete
    their tasks because of a lack of information and help from business operations
    personnel.


    +   While waiting for information from the business people, some project members
    have worked on tasks outside the project.


    +   The staff members analyzing the existing software have inadequate access to
    the software.


    +   The skill level and productivity of the outsourced staff working on the data
    modeling tasks is lower than expected.'
