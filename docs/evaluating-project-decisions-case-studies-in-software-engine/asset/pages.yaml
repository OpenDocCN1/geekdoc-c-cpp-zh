    As noted earlier, this chapter does not introduce new project management activities.
    Rather, it illustrates how project management activities and decisions discussed
    in prior chapters have additional challenges as well as potential opportunities
    when a software project involves global development. It shows how factors such
    as communication, culture, collaboration, and storage of information within a
    global development context are inputs to project decisions made with consideration
    of scope, time, quality, and cost.


    # ## 10.3 Case Studies


    The case studies in this chapter focus on project management issues that particularly
    affect global software development. The first case study, “Globally Distributed
    Team: FibreNet Project,” highlights issues of communication, collaboration, and
    trust when project teams are globally distributed. The second case study, “Managing
    Global Software Development at FibOptia,” looks at problems specific to global
    software development in managing process, product quality, and cost. Read these
    case studies to better understand the challenges of managing global software development.


