    # Analysis Questions


    +   1. Which factors did Marc listed in the case are affecting the communication,
    collaboration, and coordination between the global development sites? Describe
    the impact of each relevant factor.


    +   2. What other factors do you think could be affecting the communication, collaboration,
    and coordination between the global development sites? Describe how these factors
