    they were asked whether to speed up delivery. Their unanimous answer was no. They
    agreed that the only way the team would make the scheduled delivery date by continuing
    reviews. The team knew the quality they were producing on the code was keeping
    them on schedule. The final product delivered on the Wabash Project had only minor
    defects that could be attributed to the software from the TC group. A number of
    defects were found, but all were quickly shown to be other components in the system.


    # DISCUSSION


    As you can see from the results, the product was successful. Not only was the
    product delivered as expected, but the processes used were integrated as standard
    practices for the teams to ensure product quality. The normal testing time for
    a new development in the test lab was one to three months. The new Wabash system
    took three weeks to complete testing in the lab. The team was able to use the
    new techniques to develop the software as expected. What can also be seen is Sal
    had to do some product development analysis to make the final decision. Sal also
    had to include the key stakeholders in the effort to ensure that everyone was
    receptive to the idea of the new development technique.


    There were many problems to overcome even after the decision was made. Training
    the engineers to use OO techniques in conjunction with a non-OO programming language
    was possibly the most difficult. New concepts such as OO can help in understanding
