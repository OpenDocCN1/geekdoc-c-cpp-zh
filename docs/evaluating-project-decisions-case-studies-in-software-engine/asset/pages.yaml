    in higher altitudes, city centers and mountainous regions. The customers were
    also surprised that the product does not support the integration of GPS signals
    (from the U.S. NAVSTAR satellite system) and Galileo (to be from the European
    navigational satellite system under development) to enable more accurate and reliable
    positioning.


    Daniel recalled that the Requirements Team had customers in gathering and validating
