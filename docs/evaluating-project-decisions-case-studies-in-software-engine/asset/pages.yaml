  md: '# PREFACE xvii


    +   Tough Sell at Henkel Labs: This case study presents a difficult situation
    in which stakeholder expectations need to be managed across a global organization
    with multiple subsidiaries and people from different cultures who reside in different
    countries and sometimes have opposing organizational and business objectives.


    # Chapter 10: Managing Global Development


    Chapter 10 discusses issues and decisions related to managing software engineering
    efforts that are geographically distributed. The chapter illuminates the challenges
    of communicating across geographical and time differences, understanding and handling
    cultural differences, managing distributed projects and software development,
    managing outsourced software development, managing software quality with distributed
    or outsourced development, and managing expectations across geographically dispersed
    stakeholders.


    Case studies:


    +   Globally Distributed Team: FibreNet Project: This case study highlights issues
    of communication, collaboration, and trust when a project team is globally distributed.
    The software project manager needs to decide how to improve these aspects across
    the different distributed project sites.


    +   Managing Global Software Development at FibOptia: This case study looks at
    problems specific to global software development in managing process, product
    quality, and cost. A senior manager is deciding how she can help her global software
    development organization make process and product improvements.


    # How This Book Is Organized


    In Chapter 1, “Managing Decisions,” we discuss the nature and importance of decision
    making for software engineering. We present a decision model that we developed
    and have used in practice to assist software professionals in evaluating decisions.
    This chapter provides context information that will help you easily identify and
    think about issues and problems that occur in the case studies. You will therefore
    benefit from reading this chapter before you read the other chapters in the book.
    The other chapters discuss decision making in the context of well-known management
    areas for software projects. These chapters broadly cover people, process, and
    technology in the context of making decisions about them. Because evaluating risk
    should be an integral part of making decisions, all chapters discuss risk in the'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii PREFACE


    context of making decisions for a particular management area. Chapter 7, “Managing
    Risk,” more generally covers risk management throughout the life of a software
    project. In addition, since process concerns something is done, all of the chapters
    in we discuss process issues when how software professionals manage a particular
    aspect of software engineering.


    Chapters 2–10 have the objectives for the first chapter. The second section sets
    the context for making decisions in a particular software management area. The
    context describes primary activities that software professionals perform to manage
    a project area. Alternatively, the context for Chapter 10, “Managing Global Development,”
    explains that the activities for managing global development include those for
    the other management areas with added challenges, constraints, and opportunities.
    The chapter also discusses key ideas, practical guidelines, or what-if questions
    for making decisions in the relevant management area. The context explains decisions
    with examples that apply the PEAK decision from Chapter 1. Some of the context
    information appears in tables to help you rapidly assimilate and remember when
    needed. The chapters present the context of making decisions with respect to factors
    that influence stakeholder expectations for software projects: scope (requirements),
    time (schedule), quality, and cost (budget). The chapter also includes references
    to publications that provide background in the software management area for interested
    readers. The authors recommend that you read or peruse each chapter objectives
    and content before reading the case studies.


    The next section of each chapter presents two case scenarios highlight key issues
    and decisions related to the chapter topic. The first case study includes a full
    analysis of the case study decisions and decisions with respect to the PEAK decision
    model. The case study discusses decisions made by the stakeholders in the case
    scenarios and pose-follow decisions that need to be made. Some case studies tell
    you what the stakeholders decide to do to solve the case problems and include
    the results of these decisions; others leave the evaluation of solutions for the
    case problems to the case analyses. A set of questions to stimulate an analysis
    of the secondly concludes the case. The last section summarizes important ideas
    to remember about the chapter. A list of references for all chapters appears at
    the back of the book.


    We would like to set your expectations regarding the references in the book. We
    do not intend for the book to be a survey of research and publication in the various
    software management areas. We have included selected references to provide background
    for readers who are new to software engineering or to topics covered in the case
    studies or that provide supplemental information for interested readers. Some
    of the references are purposely dated because they provide the original and best
    definition of particular concepts or the concepts discussed in these sources are
    still highly relevant for software projects of today. The referenced materials
    include books, conference and workshop proceedings, journal and magazine articles,
    and'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# PREFACE xix


    online information. They eclectically cover topics, events, or quotes from the
    subject areas of business management, civil engineering, communications, computer
    science, decision sciences, English literature, filmography, management and management
    sciences, networking, psychology, regulatory policy, software engineering, systems
    engineering, and others that provide background information for the case studies
    and decision scenarios.


    Some of our reviewers commented that a particular case study seemed to be relevant
    for different chapters or software project management areas. As you read the book,
    you may recognize that a particular case study involves issues from multiple management
    areas. We purposely designed the cases in a specific chapter and management area,
    you might might analyze the case studies in other chapters whose issues and decisions
    involve the same management area. Instance, all of the case studies entail issues
    and decisions involving scope, time, quality, cost, risk, stakeholder expectations,
    communications and other people interactions, or set of these. As another example,
    case studies in Chapter 7, “Managing Risk,” Chapter 9, “Managing Stakeholder Expectations,”
    and Chapter 10, “Managing Global Development,” encompass issues related to global
    software development. The scenario for one of the cases in Chapter 7 involves
    development by an offshore team, and one of the cases in Chapter 9 looks at establishing
    projects to be executed by globally distributed branches of a company. Both cases
    for Chapter 10 involve globally distributed software development teams.


    The reviewers for our book requested that we provide full analyses for all the
    case studies. We talked with our editor about this and together decided that for
    space and cost it would not be practical to include this additional information
    in the book itself. Our reviewers gave us excellent suggestions for topics that
    they would like to discuss in case studies. Therefore, we decided to offer a Web
