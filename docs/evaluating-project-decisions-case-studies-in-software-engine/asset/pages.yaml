    going to be easy. Barry had just returned from a two-week overseas trip to Hong
    Kong and Malaysia where he met with existing clients in an attempt to generate
    potentially new business. His time alone had provided him with an opportunity
    to reflect on what had happened in the past year with the company, on his interactions
    with Bob, and on what he cared most in courting a course for the future (around
    TestBridge and getting some buy-in from his team). He had already made his mind
    up and was going to see the conversation developed before taking action in any
    single direction.


    # Background


    TestBridge was a software development company established in 1996 and located
    in the United States. The company specialized in testing tools for safety-critical
    systems. The flagship product, Testlogic, had been in the market for quite some
    time and was used by a variety of clients in the United States and abroad. Typical
    clients used Testlogic in their quality assurance departments to automate various
    kinds of testing of software applications and to enhance capabilities in the areas
    of unit, system, and performance testing. The system was developed by multiple
    developers over the years, was architected by Bob Rowe and was constantly updated
    to make it compatible with ongoing upgrades in operating systems, with newer database
    versions, and with enhancements to the programming language it was implemented.


    Unfortunately, over the past three years the company had witnessed a growing decline
    in product marketing and shrinkage in extension of client service-level agreements
    (SLAs), in which triggered a large reduction in support and technical personnel
    and the departure of mid- and senior-level management. Left at TestBridge were
    a few sales and marketing personnel, some technical folks who handled IT infrastructure,
    and Rowe as Testlogic''s primary care feeder.'
