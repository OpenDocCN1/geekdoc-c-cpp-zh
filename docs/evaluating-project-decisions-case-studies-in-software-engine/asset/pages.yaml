    references to techniques for modeling software requirements appear at the end
    of the chapter context.


    Another process decision, discussed earlier, is how the software developers will
    detect and resolve unknowns about the requirements. Identifying and resolving
    unknowns should be done throughout the life of the software project, and it is
    particularly important during the early stages of the software project when it
    is easier and less costly to make changes to the requirements and project direction.
    Even if project stakeholders do not expect unknowns in the requirements, the verification
    and validation of requirements should determine whether any requirements may not
    be achievable or may preclude the achievement of other requirements.


