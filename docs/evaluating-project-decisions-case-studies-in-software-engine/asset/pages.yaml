- img_proc: true
  md: '# CHAPTER 10 MANAGING GLOBAL DEVELOPMENT


    software systems and may consist of people from one or more organizations. Global
    development can go across companies as well as countries or cultural boundaries.
    The concepts distributed software development and remote or virtual software development
    teams also pertain to the collaborative development of software by people in different
    geographical locations, but they do not highlight the fact that people may be
    globally separated. In the case of telecommuting, team members may be dispersed
    as they work from their homes but still be located in the same geographical area.


    The demand for global software development continues to grow as companies search
    globally for economic benefits such as low-cost or specialized labor; localities
    where the tax, regulatory, or other governmental policies are favorable to their
    businesses; better access to markets; and so on. Global development frequently
    involves outsourcing, or contracting professionals from outside the company to
    perform software development. The outsourced people may work independently or
    be associated with another company. Outsourcing usually involves distributed software
    development. When deciding whether to outsource software development or maintenance,
    decision makers must weigh the costs with respect to the benefits.


    For example, chief information officers frequently decide to outsource their computing
    infrastructure to reduce cost, to optimize service, to transform to new technologies,
    or to improve operational efficiency through the best use of resources) the cost
    savings do not outweigh the challenges posed by offshoring CIO must consider issues
    related to training, governance, politics, turnover, geographic and time zone
    differences, required skill sets, and custom code that needs support. Making decisions
    to outsource infrastructure to an offshore site requires you to consider many
    factors (Overby 2008).


    Managing global software development has become a ubiquitous, inevitable, and
    challenging issue for organizations that develop or maintain software. In particular,
    global software development makes project management more challenging. The global,
    time zone, and cultural differences of globally dispersed project stakeholders
    communicate communications and collaboration. The added complexity makes it difficult
    to handle the project management areas discussed in this book. Project activities
    that require high degrees of communication and coordination are most challenging.
    Front-end project activities such as eliciting requirements, architecting software
    systems, and negotiating and planning projects are difficult to accomplish when
    the software stakeholders are geographically separate and culturally different.


    For a specific example in the area of managing plans, let’s consider the development
    of task breakdowns and task assignments in the context of global software development.
    When developing a task breakdown, project managers need to consider task granularity
    as well as task cohesion and coupling. Smaller tasks increase the'
