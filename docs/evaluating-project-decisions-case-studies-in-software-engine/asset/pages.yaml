  md: '# 238 CHAPTER 8 MANAGING PEOPLE INTERACTIONS


    Communication style is a highly influential factor for human interactions. Since
    most, if not all, people interactions involve communications, communication style
    plays a key role in influencing the situation for better or worse. Communication
    style involves observable characteristics of speech such as the speed, loudness,
    of pausing, and so on. It also involves approaches to communication such as towards
    directness/indirectness or the level of assertiveness in how something is stated.
    People are natural communicators, while other people tend to listen. If you are
    interested in learning more about communication style, see works by Deborah Tannen,
    a sociologist at Georgetown University who has worked extensively on language
    and its impact on people interactions (Tannen). Other interacting places to look
    for information about communication style are ASME, Jensen, and Pleeger and Atlee
    (2006, 99–104). In particular, Pleeger and Atlee discuss communication styles
    in the context of people who work on software engineering efforts.


    The context of a situation impacts how or why an interaction occurs as the history
    of related events that precede an interaction. Interactions between stakeholders
    who are establishing the requirements for a software project are likely to be
    different from interactions between stakeholders who are trying to resolve a problem
    in a software product that has been delivered. Interactions between stakeholders
    who have worked together or interacted in the past are likely to be different
    from those stakeholders who are meeting for the first time.


    Cultural differences influence the interactions of people who are located in different
    countries or regions of the world. In some cultures, group discussions appear
    to be chaotic with multiple people talking at the same time; in other cultures,
    people stop may wait until others comment, and possibly may be offended if the
    other people don''t stop. Dr. Geoffrey Hofstede has extensively researched a framework
    for assessing culture on international business and in the process developed that
    if people go into other countries and make decisions on how they operate in their
    own countries, they are likely to make bad decisions (Hofstede).


    Likewise, environment has a significant influence on interactions between globally
    distributed stakeholders. The time and space differences geographically separated
    stakeholders usually occur at times (often outside the normal working hours) or
    involve a time delay when waiting for a response to an e-mail. During phone calls
    and even teleconferences, the stakeholders frequently do not hear or see the voice
    or body language that can help them gauge the other people’s reactions to what
    is communicated or to the way in which the interaction is progressing. The absence
    of face-to-face communications complicates the interactions between people involved
    in global development projects. Environment and culture typically have a high
    influence on the interactions between globally distributed project stakeholders.
    See Chapter 10,'
