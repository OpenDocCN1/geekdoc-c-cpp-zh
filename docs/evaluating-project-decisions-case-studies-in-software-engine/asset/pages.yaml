    # 6.3 Case Studies


    This chapter has two case studies. One case study focuses on the process decisions
    that have been made for a project and analyzes whether they were the right decisions
    for the project. The second case study examines decisions about processes that
    can directly impact the quality of the project deliverables and therefore the
    schedule.


    In the first case, “Bank on the Verge,” two consultants are asked by a project
    manager to evaluate the project he is working on. The project manager wants the
    consultants to evaluate whether the team has made good decisions on process and
    whether there are things that the team could do better. In particular, the project
    manager wants all the members in his group to work on the product to ensure that
    it is the best that they can produce. He is concerned if then the expected project
    features cannot be delivered in the time allocated, and the project will not be
    the best that his team could achieve.


    In the second case, “Dann, Full Speed Ahead,” one project manager is asked to
    review a project with problems that is being run by another project manager to
    determine what can be done to improve the situation. The troubled project is behind
    schedule, and no one has been able to clearly identify what is causing the schedule
    slippage or what should be done, if needed, to fix the processes or to help the
    project stay on schedule.'
