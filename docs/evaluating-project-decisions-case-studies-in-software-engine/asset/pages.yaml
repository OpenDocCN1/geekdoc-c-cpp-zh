  md: '# CASE STUDY: ESTIMATION AS A TOOL 83


    # KEY IDEAS TO REMEMBER


    The PEAK model can help clarify the inputs and show that a decision based on faulty
    input data is also likely to be faulty.


    The decision to put new functionality in hardware rather than software is not
    the best decision because it is based on faulty input data. The experience and
    the assumptions are flawed in the decision:


    +   (P) Problem: New functionality is needed.

    (E) Experience: It''s easy to add hardware to the system.

    (A) Assumptions: It''s easier and less costly to add hardware than to add software
    to a system.

    (K) Knowledge: Basically, for a hardware company, software is harder to manage.


    Solution: Add a new hardware to the system to meet the functionality.

    Assured Risk: The cost to get software running on new hardware is not well understood
    and may be greater than expected. The recent cost model shows the cost to be about
    5,000 hours to integrate software with new hardware.


    The estimation to split the engineers'' time also needs to be reviewed. The information
    being used shows all time being equal, but the concept of context switching is
    ignored. Machines can switch back and forth, but humans cannot easily do this.
    Application of the PEAK model reveals the flawed assumptions associated with this
    decision:


    +   (P) Problem: Projects are late because engineers are overloaded.

    (E) Experience: The company has many projects all in different phases of development.

    (A) Assumptions: Engineers can support more than one project without much impact.

    (K) Knowledge: Senior engineers will most quickly resolve problems with products
    in the field.


    Solution: Split the engineers'' time as needed to solve problems.

    Assured Risk: Junior and senior engineers may not actually get the same amount
    of time on a project, and therefore using senior engineers to solve problems may
    be an issue.


    The PEAK model helps you evaluate the estimation decisions that were made and
    look for where problems with the inputs can contribute to issues with the solutions.'
