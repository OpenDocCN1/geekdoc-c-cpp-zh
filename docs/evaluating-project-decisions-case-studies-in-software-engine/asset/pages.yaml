    The Renaissance Project is behind schedule. The actual work accomplished is 88
    percent of the planned work (SP1 = 0.88) and does not appear to be improving.
    Henrik Holmann, a lead manager for the project, has asked the project managers
    and planners to determine the root causes for the schedule slippage and to propose
    a way to bring the project back on schedule. At a special meeting, the project
    managers and planners identify some root causes for the schedule slippage. They
    discuss the problem of whether to replan and make a decision to replan the schedule,
