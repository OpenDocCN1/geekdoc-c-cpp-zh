    # Synopsis of Key Resource Management Problems


    Problem 1: After a new product release, conflicts frequently occur between the
    staff needs of the software development and field service organizations.


    In general, field service engineers are able to handle customer service requests
    on their own. They receive training after the release of a product and continually
    increase their own knowledge as they help customers use the released product.
    “Low-priority” defects found in the field are typically not repaired until the
    next release of the product and therefore do not place demands upon the development
    organization between product releases.


    The conflict occurs when the knowledge and skills of software engineers who developed
    a product are needed to repair “high-priority” defects detected in the field or
    to enhance product between releases. These engineers are usually working on the
    release of product and must be taken away from their current development activities
    to produce interim versions of the software. Software project managers must first
    determine the overall impact of the time spent on interim bug fixes or enhancements
    and decide whether they can accommodate these service requests. Delays in responding
    to field service requests often occur. As a result, field service engineers take
    their requests for help from the development organization to the director of field
    service, who in turn them them to the director of software. The overall process
    of coordinating bug fixes and handling special enhancements between product releases
    is slow and disruptive.


    The problem is complicated by the fact that software engineers tend to move on
    to similar development assignments in successive product releases. Software developers
    become experts on particular aspects of products and become the “owners” in some
    sense of feature products. Software engineers are rewarded for high productivity
    and low error rates, a policy that motivates them to focus their knowledge and
    expertise within a'
