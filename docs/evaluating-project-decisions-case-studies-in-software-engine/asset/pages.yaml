  md: '# Chapter 1


    # Managing Decisions


    # 1.1 Chapter Objectives


    This chapter introduces concepts about evaluating decisions for software development
    projects and other software engineering efforts. This chapter will help you understand
    the purpose, rationale, and application of a model for evaluating decisions. Succeeding
    chapters will illustrate how to apply the model to decisions being made to manage
    various aspects of software projects and to handle problems faced by the stakeholders
    in case scenarios. Managing decisions involves identifying a problem to be solved,
    formulating and evaluating alternative solutions to the problem, selecting among
    the alternatives, and executing the decision or implementing the solution. The
    model discussed in this chapter applies to the following phases: identifying the
    problem, formulating and evaluating alternative solutions, and selecting among
    alternative solutions or decision. The case studies in succeeding chapters focus
    on these phases but may also include the execution aspect of managing decisions.


    # 1.2 Context


    A decision involves passing judgment on an issue under consideration. It is commonly
    understood to be the act of reaching a conclusion or making up one''s mind. All
    software projects involve making decisions. The act of not making a decision is
    a decision. For example, if a software project manager chooses to ignore a project
    member''s request for more resources, the manager is making a decision not to
    act and must deal with the consequences of this noncommittal decision. Increasing
    a software professional''s responsibility increases the number of decisions that
    the'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# CHAPTER 1 MANAGING DECISIONS


    professional must make. This book will explore decisions made by different software
    project stakeholders and will light on how these decisions can be made.


    The importance of managing the way in which project decisions are made is evident
    by the numerous publications that discuss decision making, particularly in the
    context of managing projects, managing project risks, and more specifically of
    managing projects product development. The following references are just a few
    select examples of current publications in these areas. For more about decision
    making as an integral part of project management, Cleland and Ireland (2006),
    McManus (2004), Pollack-Johnson and Liberatore (2006), Verine and Trumper (2007).
    For more about the relationship between decision making and risk, see Ward and
    Ward (2012), Dillon and Tinsley (2008), Hussey and Hall (2007), and Wartenkit
    et al. (2009). For product development project decisions, see Barry et al. (2006),
    Gutierrez et al. (2008), Krishnan and Ulrich (2001), Messerschmitt (2004), and
    Schmidt et al. (With the rise of global decision, there is also an increasing
    interest in the effect of cultural, geographical, and time differences on how
    decisions are made within organizations and projects. For a current discussion
    of these issues, see Bourgault et al. (2008), Brett (2001), Espinosa et al. (2008),
    Mohtahede et al. (2008), Shore (2008), and Wang and Liu (2007).


    In general, software professionals do not understand how to systematically make
    decisions that result in software projects that are considered to be by the project
    stakeholders. One main problem is that decision makers for software projects often
    do not state or analyze the inputs and outputs of their processes specifically
    with respect to the needs and expectations of the stakeholders. They may recall
    that a solution was successful for a particular problem, but they are surprised
    when the solution is not successful in solving a simple problem in which the stakeholders
    have different expectations. This book focuses on the viewpoints of different
    software project stakeholders to help you refine your decision-making processes
    so that the resulting solutions are more likely to satisfy stakeholder needs and
    values.


    In general, software project stakeholders make decisions to satisfy their expectations
    regarding the scope of the project deliverables, the time for the project (schedule),
    the quality of the project deliverables or product, and the cost (budget). 1-1
    shows a model of the expectations that stakeholders have for software projects
    and the project deliverables.


    The model shows that the dimensions of stakeholder expectation (scope, time, quality,
    and cost) are related. Stakeholders trade different values for scope, time, and
    cost when establishing the requirements for a software project. Prioritizing their
    expectations can help stakeholders to make trade-offs more easily and effectively.
    Different software project stakeholders make different decisions to support their
    interests. They have different inputs feeding their decision process and different
    expectations over the outcomes of their decisions. For instance, stakeholders
    have different levels of tolerance for the risks associated with the decisions
    that they make.'
