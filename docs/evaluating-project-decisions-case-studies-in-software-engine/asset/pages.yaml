  md: '# 1.2 CONTEXT 3


    ![](img/b881997d603ad72821fd2f4c10efba76_27_0.png)


    Figure 1–1: Stakeholder expectation model


    Consider an example of how software stakeholders makes decisions based upon their
    expectations with respect to scope, time, quality, and cost. Suppose a customer
    decides upon an acceptable budget for a specific work product, schedule, and quality.
    Likewise, the solution provider establishes a definition of quality to satisfy
    both the customer’s expectations for the work product as the product standards
    set by the solution provider (who has a reputation to maintain). The solution
    provider then determines an amount to charge that factors into the cost of developing
    the work product to satisfy the customer’s expectations regarding scope, time,
    and quality.


    But what happens if the customer’s acceptable cost is lower than the amount the
    solution provider wants to charge? This would generate another set of decisions.
    Will the customer and solution provider agree to negotiate the amount to be charged?
    Will the stakeholders consider alternative costs, schedules, levels of quality,
    and budgets? Or will the stakeholders decide they are unwilling to negotiate an
    amount to be charged that is agreeable to both of them?


    The customer may decide to pursue other solution providers and find that the costs
    posed by these solution are significantly higher than the amount asked by the
    first solution provider. The customer may discover that the first solution provider
    in the meantime has taken on other projects and will not be available to perform
    the work until a time is not acceptable to the customer. Will the customer do
    now? Did something go wrong in the customer’s decision-making process?


    This customer–solution provider scenario highlights the interconnected or causal
    nature of decision making: One good or poor decision leads to another good or
    poor decision. As the scenario described, a mismatch between the customer’s acceptable
    cost and the solution provider’s desired price may result in a cascade of successive
    decisions that eventually leave the customer with the choice of selecting a provider
    who would charge a higher amount or abandoning the desired work to be done.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# CHAPTER 1 MANAGING DECISIONS


    Therefore, it is important that stakeholders understand the factors that affect
    their decisions as well as the potential consequences of their decisions. Project
    delays and failures are usually related to a series of poor decisions. When asked
    how a project becomes a year late, Frederick Brooks answered, "One day at a time"
    (Brooks 1995, 160). We suggest that a more revealing answer is "One decision at
    a time."


    One way to solve the problem of interconnected decisions is to disconnect them
    as much as possible, but this solution is not always applicable. For instance,
    a mismatch between customer and solution provider expectations is common. The
    issue is to manage the stakeholder decisions to resolve the mismatch in a way
    that leads to the best possible outcome. The stakeholders need a systematic way
    to make software engineering decisions that are likely to lead to successful results.
    They also need a management strategy to monitor and correct less than optimal
    decisions before their harm is done to a project.


    The purpose of this book is to help you refine your decision-making processes
    and decision management strategies. We examine the decision-making process with
    respect to the decision evaluation model presented in the next section. The model
    is a visualization of factors that are used to make decisions in software development
    and software project management. The model provides decision makers with a systematic
    way to analyze the inputs and outputs of the decision-making process. The book
    shows how software project stakeholders use their expectations regarding scope,
    time, quality, and cost as inputs to making decisions in case scenarios.


    The model emphasizes that every decision may not succeed in solving the stated
    problem. It is important for decision makers to understand the risk assumed when
    making a decision because it may be unacceptable to the project stakeholders.
    Assumed risk may accumulate over time to a level that is unhealthy for software
    projects. The objective is to recognize decision situations that need to be carefully
    managed because (1) the risk assumed or (2) the cost associated with unsuccessful
    outcomes to these decisions. The case studies in the book show how the model can
    be applied to make less risky decisions for critical software project management
    and engineering scenarios. In particular, the case studies show how stating the
    inputs and outputs of the decision model in terms of the stakeholder expectations
    reduce the risks assumed by alternative solutions.


    The next section and the remaining chapters in the book will answer questions
    such as the following within the context of software projects:


    +   * What do decision makers know when making decisions?

    * Do decision makers use a process when making decisions?

    * Are all decisions of equal value?

    * Are software project decisions different from those for other projects? If so,
    how?

    * What does it mean to manage decisions?

    * Why is it important to manage decisions?'
