    As discussed in the chapter context, managing stakeholder expectations involves
    setting, monitoring, and influencing stakeholder expectations. In addition, stakeholders
    are not likely to be satisfied if their perceptions are less than their expectations.
    Julian may not be satisfied because his perception of what the project team has
    done is in some way than what he expected the project team to do. You might start
    by trying to understand how Julian''s expectations may have changed over the project.
    You may detect how the project team could have been more effective in setting
    Julian''s expectations at the beginning of the project as well as in monitoring
    and influencing them as the project progressed.


    The objective, as stated in Gupta''s outline of responsibilities for the team,
    was to implement, and integrate a reliable communications protocol that would
    be based upon an existing protocol. At the beginning of the project, the team
    thought that it had flexibility in determining the solution. Julian expressed
    a similar expectation when saying that he was not going to force his own ideas
    about the solution onto the team. The client and the team have similar expectations
    that the team would explore and develop its own solution.


    So, what happened? Why did Julian push an implementation of his own design as
    the solution, and why did he do this if he already had implemented the solution?
    Julian was impatient when the team did not arrive more quickly to a solution.
    Julian seemed to have high expectations about the process for how the team would
    determine the solution and how quickly it would find the solution. We do not know
    whether Julian had these expectations at the beginning of the project.


    When Julian saw the team struggle in finding a solution, expectations regarding
    what the team should probably change. He may have welcomed the exploration of
    alternative solutions at the beginning of the project and become unhappy when
    the exploration did not quickly yielded an implementation. Julian may be pushing
    for an implementation of his own design because the team has not found another
    one that satisfies the requirements. He may think that by telling the team he
    has already implemented the solution, the team will work harder. On the other
    hand, Julian may want to compare the team''s implementation of his design with
    his own implementation (if one exists) and for the stated reason of nondisclosure
    unallowing the team to use his implementation for this comparison.


    How could the team have managed Julian''s expectations in a better way? An issue
    from the beginning of the project has been the assumption, not, fact, that a satisfactory
    solution could be found and implemented. There was a risk that Julian would be
    if a solution was not found in a timely manner. The team could have mitigated
    this by working with the client to specify and agree upon the process by which
    the team would determine whether a viable solution exists. Likewise, the team
    and client would have needed to agree upon measurable criteria for determining
    the viability of a solution. The main objective for this slightly different project
    would have been to determine the'
