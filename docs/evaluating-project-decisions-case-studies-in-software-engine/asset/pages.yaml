    # # 3.3 Case Studies


    These case studies will emphasize the key issues involved with estimation for
    software projects. In particular, they will look at overcoming entrenched estimation
    practices that affect decisions dealing estimation either adversely or in ways
    that are not well understood. The case studies will tell a software project manager''s
    point of view and show how the software project manager identified, planned for,
    and corrected the estimation issues affecting their projects.


    The mini case study, "Estimation as a Tool," examines how people interested in
    improving their estimation process begin to look for information that will help
    them with future decisions about estimates. Most of the techniques for estimation
    require historical information. Understanding this information and its origin
    will make using the data easier and more productive for estimating.


    The full-length case study, "When a Team Runs a Race," examines how estimation
    can be influenced indirectly by aspects that need to be understood. It also examines
    the influence that multiple projects operating at the same time can have there
