    of the project scope. Our immediate response on a new project is to try to do
    everything, but the first thing that we do when the project falls behind is to
    cut scope.


    The reality is not all scope is of the same priority. You must consider how to
    prioritize the scope, or you can fall into the trap of thinking everything is
    of equal value. In fact, if you develop a “threshold of success,” then you can
    see there are'
