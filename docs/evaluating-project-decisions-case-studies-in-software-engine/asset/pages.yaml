  md: 'The case study ‛ank on the the looked at decisions concerning process definition,
    teaching the process, and process measurement. "Damn the Process, Full Speed Ahead"
    covered decisions related to evaluating and changing the current process.


    Many people view process as a necessary evil. They think that it is needed because
    someone else wants visibility into the project. This is the wrong reason for process,
    although sometimes it is used as the "stick" to get engineers to listen. Software
    developers can view process as a filter that enables them to remove defects early
    when the cost is lower. They can also see process as a way to improve efficiency
    when they recognize better ways to engineer software.


    Process and product are two sides of the same coin. Software project managers
    must decide how much resource to expend so that the amount of process improvement
    yields the desired product improvement. They also need to look for ways to make
    the project processes more efficient while making them more effective. Managing
    process for the sake of process is a waste of time.


    Process decisions are particularly important when they affect the project''s ability
    to save time, reduce cost, and improve quality.'
