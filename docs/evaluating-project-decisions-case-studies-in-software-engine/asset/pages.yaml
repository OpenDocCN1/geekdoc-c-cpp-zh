  md: '# CHAPTER 7 MANAGING RISK


    # CONCLUSIONS


    Both Fisher and Laughlin face tough decisions that, in addition to influencing
    the daily implementation details, concern their ongoing relationship, reputation,
    and how each of their respective organizations are perceived. There is a tendency
    to ignore long-term implications when trying to finish a troubled project. Fisher
    and Laughlin should step back and carefully analyze their situation to avoid making
    hasty decision without evaluating the options and risks.


    Risk management is a way for decision makers to proactively handle project challenges.
    Although Fisher has not yet done this effectively, he is aware of the problems
    that his project has encountered and wants to minimize or solve them. Finding
    fault is easy for Fisher and Laughlin, especially because of the distance and
    cultural issues. Future project risks might be greater if one of the key stakeholders
    takes a coercive stance with statements such as "Do it now because I said so."
    Fisher and Laughlin need to analyze the results and assumed risks of their previous
    project decisions before deciding how to go forward.


    # KEY IDEAS TO REMEMBER


    This case study presents a typical project in which neither the developer nor
    the client explicitly practiced risk management. In general, the lack of risk
    management has led to a number of problems that could have been foreseen. We hope
    you will remember the following ideas after reading this:


    +   Risk management needs to be planned and executed as part of the overall project
    plan. Decision makers often make decisions with limited information and time constraints.
    Project managers should invest some of time at the start of the project to identify
    project risks and mitigate those that might preclude project success.


    +   As projects become more complex, in terms of environment and domain, the need
    for explicit risk management increases. Complex projects usually involve multiple
    components, technical sophistication, and many decision makers. Project environment
    also contributes to project complexity, and even a small project with two to three
    project engineers may involve complexities associated with distance, culture,
    language, expertise, and so on. It is easier to deal with project risks on a less
    complex project when project complexity grows, the complexity of the decisions
    made by project stakeholders also increases. Decisions for complex projects often
    involve more time, effort, and resources.


    +   Ignoring risk management, even for small-scale projects, can lead to significant
    problems. Decision makers use benefit-cost analysis to evaluate the value of performing
    risk management activities. From a business perspective, this may be a reasonable
    approach because it is often very difficult to precisely value the impact of various
    risks. Ignoring project risks may result in unexpected and significant project
    delays, product quality, and cost overruns.'
