    # DISCUSSION


    At the project meeting, the managers and planners first identify factors that
    they have determined are causing the schedule slippage and discuss a few approaches
    to solving the problem. The factors (such as inadequate access to information,
    help, and software) highlight issues associated with obtaining time and resource
    commitments from business operations personnel. Another factor is the lower than
    planned productivity of the data modeling staff that is a result of the extra
    time spent guiding the outsourced project members whose skills are lower than
    expected. The solution to the schedule slippage problem must realistically address
    these issues.


    As a second step, the project managers decide whether they need to replan. They
    discuss two commonly strategies for making schedule adjustments: adding more people
    to tasks and increasing the productivity of the people working on tasks. The managers
    and planners reason that adding more people or increasing productivity will not
    resolve the delays because of lack of information, help, and resources. They are
    also aware that adding people may or may not speed up task completion. Calling
    the necessary increase in productivity, in particular for the data modeling tasks,
    to “catch up” is unrealistic. Increasing the productivity of the data modeling
    teams would require extensive training or replacement of the outsourced staff,
    which would require increased expenditures of time and money.


    The project managers decide that there is no way that contracting the project
    agreements for Phase II could be complete by July 25, 2008, without replanning.
