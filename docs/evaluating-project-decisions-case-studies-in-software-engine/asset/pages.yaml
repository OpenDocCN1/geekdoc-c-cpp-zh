    To explore the last activity in establishing the requirements, we’ll next cover
    the types of decisions that software engineers make when negotiating and contracting
    requirements.


    # Negotiating and Contracting Requirements


    In many organizations, the people who negotiate and contract agreements for software
    projects are not the people who eventually manage or lead these projects. Whether
    this separation of stakeholders hinders or promotes successful software outcomes
    depends on the degree to which the interests of all of relevant stakeholders are
    represented in negotiating and contracting the software project agreements.


    Negotiating the software project requirements is inherently a process of trade-offs
    and decisions. Stakeholder discussion and agreement upon the trade-offs helps
    stakeholders to focus on elements of the requirements that they can actually control
    such scope, time, quality, or cost. The negotiation process stimulates stakeholders
    to explore options that optimize the expectation space for all. In other words,
    it maximizes the min-win opportunities for “opposing” stakeholders.


    Software project agreements (contracted decisions) should provide the stakeholders
    with a clear, compatible, consistent, and correct description of elements such
    as those described in Table 2–5.'
