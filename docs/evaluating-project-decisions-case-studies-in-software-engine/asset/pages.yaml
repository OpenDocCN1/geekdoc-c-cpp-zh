    # 9.3 Summary


    This chapter focused on the following activities for managing stakeholder expectations
    in the context of decision making for software projects:

    * Communicating with the customer stakeholder

    * Managing multiple dimensions of stakeholder expectation over time

    * Managing product and process to satisfy stakeholder expectations

    * Understanding different types of customers

    * Managing perception


    Decisions made by the stakeholders in both case studies placed them in unfavorable
    positions. In the first case, “TCP Enhancements at Gigapex Systems,” the software
    project encountered unexpected problems related to the customer’s expectations
    as well as the internal and external interactions with project stakeholders. The
    second case, “Tough Sell at Helsinki Labs,” portrays a difficult situation in
    which stakeholder expectations need to be managed across a global organization
    involving people from different cultures residing in different countries who sometimes
    have opposing organizational and business objectives.


    Managing stakeholder expectations for a software project in a systematic way is
    challenging. Software project managers typically pay minimal attention to the
    impact of their project decisions on stakeholder expectations. All three phases
    of the stakeholder expectation management life cycle (setting, monitoring, and
    influencing expectations) are important. As many interaction activities that are
    people oriented, managing stakeholder expectations depends on effective communications.


    Effective communications enable software project managers to manage stakeholder
    expectations to achieve project success.'
