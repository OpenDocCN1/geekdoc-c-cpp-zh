    We''ll now progress to the types of decisions that software engineers make when
    managing requirements change and scope.


    # Managing Requirements Change and Scope


    Some software project managers think that the requirements work ends when the
    requirements are established. In practice, project requirements need management
    throughout the life of the project and across multiple projects for software that
    evolves iteratively or incrementally. The continuous and ongoing management of
    requirements is necessary because software is not static. Engineering teams may
    use techniques such as prototyping, simulation, and mock-ups to help users determine
    exactly what the software should do and how the interface to the software should
    look. Even by applying techniques to better understand the nature of the requirements,
    the user’s (customer’s) view and expectations may still change as the software
    project progresses.


    The developer’s view of requirements may also change for various reasons. There
    is sometimes communication with the stakeholders while eliciting the requirements.
    Other times, the developer viewpoint changes because knowledge is acquired through
    ongoing communication with potential users (especially with those who were not
    involved in establishing the original requirements), through applying the chosen
    technologies and development techniques, and through other forms of research or
    information gathering. For instance, the developer may discover unexpected technical
    issues that warrant changes in the requirements.'
