    applies the PEAK model to examine the impact that process can have on quality:


    +   (P) Problem: A team sees it might be late for a delivery. The team members
    are deciding whether they should eliminate code inspections to reduce the time
    needed to get the software out the door.


    +   (E) Experience: The software being delivered in this release contains only
    the GUI code. The complete software application will be delivered in the next
    release.


    +   (A) Assumptions: If the team eliminates code inspections, the code will be
    “ready” for delivery sooner.


    +   (K) Knowledge: The team understands that the software tests provide sufficient
    verification and may be willing to deal with the impact of releasing software
    with “less quality” more quickly.


    Solution: The team would release a software version that consists only of the
    GUI code, which would not be fully inspected. The next software release would
    contain all code and be fully inspected.


    Assumed Risk: The team assumes that the consequence of delivering lower-quality
    code is not as severe as the consequence of delivering late code because the customer
    knows that this is an interim release. If this assumption is inaccurate, then
    the consequence of releasing lower-quality code may be more severe than the team
    expects.


    Cost is frequently a concern when project managers are considering the process
