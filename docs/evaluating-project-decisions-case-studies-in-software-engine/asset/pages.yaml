  md: '# CHAPTER 2 MANAGING REQUIREMENTS


    to “wrap up” the requirements elicitation, they may quickly draft statements about
    the desired software qualities that are imprecise, inaccurate, incomplete, or
    simply incompatible.


    For example, a common requirements mistake is to state that the software system
    should respond in real time and be fast (whatever fast means). A real-time software
    system is not simply a system that responds quickly. A real-time system responds
    predictably with respect to events and time. The system may execute periodically
    (repeatedly every specified time interval) or aperiodically (only when a specific,
    noncyclic event occurs). The real-time system may need to satisfy hard deadlines
    (for example, it must respond within 20 milliseconds after an event or something
    undesirable will happen), may be allowed to miss a deadline by some specified
    amount of time (for example, it is preferable to respond within ten seconds after
    the event, but it is sufficient to respond within one minute), or may be permitted
    to not respond at all to the event if the processing system is overloaded.


    A quality attribute that software stakeholders often do not consider is the expected
    or likely evolution of software. Decisions about software evolution are important
    if the software is to continue provide value to the user over a lifetime beyond
    a single release. For software to be developed and released iteratively or incrementally
    in a cost-effective way, there needs a software release plan to indicate which
    requirements are expected to be developed for each release. The release plan may
    be flexible or change as the software developers receive feedback from users with
    Agile development or other iterative approaches (Beck et al. 2001; Larman and
    Basili 2003). While establishing the requirements, the software stakeholders should
    consider and decide upon an overall plan for the evolution of the software to
    help the software architects and designers design an appropriate composition for
    the software. Ullah and Rube (2006), who present ongoing research in the project
    to develop a comprehensive and formalized model for planning and optimizing releases
    for software products.


