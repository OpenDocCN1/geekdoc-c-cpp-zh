    # Case Summary


    # DESCRIPTION


    Nordic Petro has adopted an enterprise approach to managing its business operations.
    All business and management decisions will be based on company-wide information
    accessed in real time. With this goal in mind, Nordic Petro converted its core
    business systems to a centralized SAP suite of software to manage human resources,
    finance, and sales and distribution. The software conversion yielded significant
    savings in operational expenses as well as increased revenues. The company now
    wants to add the SAP enterprise customer relationship management, supplier management,
    and asset management. The company''s goal is to reduce the costs of managing customer
    service and the supply chain as well as the expenses associated with the maintenance
    and use of plants, equipment, and other capital assets. The estimated cost for
    the Renaissance Project is 300 million USD in June of 2007. The estimated rollout
    of all new systems is 2.5 years from the start of the project. The company has
    contracted a large consulting firm, IT Sphinx, to help with project planning and
    management, business and integration process planning, and software development
    and integration. The case scenario focuses on the project-planning phase.


    # CASE STUDY OBJECTIVES


    After reading the case study, you will be able to do the following:


    +   Understand better the following issues when managing software project plans:

    - Determining when and why replanning is needed

    - Selecting project management metrics and data to be collected

    - Managing risks associated with project plans'
