    # Analysis Questions


    +   1. Consider the reasons that the software project managers and team have given
    for the schedule slippage. What other factors, if any, *not* identified by these
    stakeholders do you think might be contributing to the delay?

    2. Explain why the stakeholders think that replanning is needed. Do you agree
