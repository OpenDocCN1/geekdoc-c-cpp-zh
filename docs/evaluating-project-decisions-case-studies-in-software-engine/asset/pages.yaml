    Project managers or software engineers can better eliminate defects by managing
    the decisions about how they do their work. To manage these decisions, software
    engineers need to understand the way in which they complete tasks (or the processes
    they use) and to be able to perform them in different ways if needed to achieve
    fewer defects. The way you perform a process to improve its outcome is called
    **process improvement**.


    Process improvement is a way to improve efficiency through the recognition of
    better ways to perform actions. When you write things down and are able to evaluate
    what you are doing systematically, you can see “better” ways to do things. Many
    of the decisions you make with respect to involve making the process more efficient
    or less error prone when applied. In a sense, a process is a tool like any other
    development tool. It can be used badly or wisely. For software engineers, process
    is essential because the work they do is detailed and requires their best efforts.
    One guideline to remember in making decisions about process is that process should
    serve the user. The user does not serve the process. Another guideline when making
    process decisions is to consider whether the process or the tools should come
    first. When these get reversed, teams get into trouble.


