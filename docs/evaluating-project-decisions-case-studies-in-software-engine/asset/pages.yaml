  md: 'xvi PREFACE


    +   - Falcon Edutainment and the RiskSim Project: This case study focuses on software-project
    risks associated with client-developer interactions, communications, requirements
    elicitation, and the related decisions.


    # # Chapter 8: Managing People Interactions


    Chapter 8 discusses factors that influence interactions between people and shows
    how an understanding of these can help software professionals to manage their
    interactions with people on the job. The chapter specifically describes activities
    involved in managing stakeholder interactions: understanding scenarios of interaction,
    understanding factors that influence interactions, deciding upon interaction objectives,
    evaluating factors that influence an interaction, deciding how to adjust controllable
    factors for an interaction, and reflecting on past interactions to improve performance
    in future interactions.


    Case studies:


    +   - To or Not to Be: A Sense of Urgency at TestBridge: In this case study, tough
    decisions have to be made with respect to the ability and willingness of specific
    players within the team to contribute as team members in light of an organization
    that is changing its focus and business direction.


    +   - A Friend or Oe Hanover-Tech: This case study focuses on the need to manage
    people interactions at the managerial level while balancing opposing constraints
    that are financial, strategic, personal, and temporal.


    # # Chapter 9: Managing Stakeholder Expectations


    Chapter 9 clarifies the nature of stakeholder expectations. The chapter introduces
    a model for understanding the mapping between customer expectations and provider
    expectations. The chapter discusses the activities involved in managing interactions
    between software stakeholders: communicating with the customer stakeholder, managing
    multiple dimensions of stakeholder expectation over time, managing product and
    process to satisfy stakeholder expectations, understanding different types of
    customers, and managing stakeholder perception.


    Case studies:


    +   - TCP Enhancements at Gigapixel Systems: In this case study, the software
    team encounters unexpected problems related to satisfying the customer’s expectations
    as well as internal team dynamics and the external relationship with the customer.'
  merge: -1
