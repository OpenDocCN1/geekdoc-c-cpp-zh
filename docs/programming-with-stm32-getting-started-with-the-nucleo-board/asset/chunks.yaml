    which is the one applicable for use with a 64-bit Windows system. This executable
    file is 2.19 MB in size. Download this file to the STM32Toolchain directory so
    that it is readily available to any toolchain application that needs it. This
    file is a self-contained executable, which simply needs to be run in order to
