- fmt: '

    In this chapter I present an in-depth discussion of the STM32CubeMX application,
    which is a free utility provided by STMicroelectronics (STM). I will also start
    referring to it as `CubeMX` to just simplify the terminology. I would also like
    to acknowledge a fine Leanpub eBook published by Carmine Noviello titled Mastering
    STM32. Carmine’s book was invaluable invaluable reference alongside the STM datasheets
    without which I could not have created this book.


    `CubeMX` is a fairly complex utility because it is intended to encompass nearly
    all the microcontroller chips (MCUs) and development boards that STM offers. This
    is quite an amazing feat considering that there are hundreds of MCU variants and
    dozens of development boards that STM manufactures. The `CubeMX` supports these
    devices by automatically generating C code that developers can easily use in their
    programs. The generated code is designed to support specific integrated peripheral
    (IP) devices included on the selected MCU. `CubeMX` may be regarded as a MCU-centric
    utility because of the following features:


    - MCU selection based on the STM family, that is, F0, F1, …

    - Specific IP required for the project involving mapping MCU peripherals to a
    specific pinout

    - Handles specific MCU clock, power, interrupt control, ...

    - Automatically adapts pinout to package configuration

    - Manages the ST hardware abstraction layer (ST HAL)

    - Manages external libraries

    - Adaptable to a variety of IDEs


    [Figure 3-1](#ch3.xhtml_ch3fig1) shows the opening screen when the application
    is initially launched.


    ![images](fig03-01.jpg)


    **Figure 3-1** CubeMX opening screen.


    There are three choices available on the screen:


    - New Project

    - Load Project

    - Help


    The New Project selection will be shortly discussed in-depth, but I do first want
    to briefly mention what happens with the other two selections. Clicking on Load
    Project will display the open file dialog box, as shown in [Figure 3-2](#ch3.xhtml_ch3fig2).


    ![images](fig03-02.jpg)


    **Figure 3-2** Load Project screen shot.


    In this figure there is only one project file named `Hello.ioc`, which is located
    in a project directory that is automatically created whenever a new project is
    created. The project directory is named using the same name entered in the new
    project dialog box. The project file contains everything that `CubeMX` needs to
    reconstitute the project in order to continue with any development efforts.


    Clicking on the Help selection will display the opening page of a PDF document,
    as shown in [Figure 3-3](#ch3.xhtml_ch3fig3).


    ![images](fig03-03.jpg)


    **Figure 3-3** Opening page for CubeMX Help document.


    This PDF revision is a 261-page document that carefully details all the many features
    and functions contained within the `CubeMX` application. I would strongly recommend
    that you select and open this document and then save it to any convenient directory.
    In that way, you will always have access to the help document without needing
    to open the `CubeMX` application itself. You should also consider printing applicable
    portions of the document to have ready reference to appropriate material while
    using the application.


    Clicking on the New Project selection will display a page with two tab selections.
    One tab is entitled MCU Selector and the other is Board Selector. Clicking on
    the Board Selector will cause the dialog box shown in [Figure 3-4](#ch3.xhtml_ch3fig4)
    to appear.


    ![images](fig03-04.jpg)


    **Figure 3-4** Board Selector dialog screen shot.


    I selected a Nucleo64 as the board type and `NUCLEO-F302R8` as the reference as
    may may be seen in the figure, which matched the demonstration board I selected
    to use in this book. [Figure 3-5](#ch3.xhtml_ch3fig5) shows the result of selecting
    this particular board.


    ![images](fig03-05.jpg)


    **Figure 3-5** NUCLEO-F302R8 board selection.


    There are four tabs shown in this figure, which I will discuss here one by one.
    These tabs, displayed from left to right, are as follows:


    - Pinout

    - Clock Configuration

    - Configuration

    - Power Consumption Calculator


    ### Pinout Tab


    [Figure 3-5](#ch3.xhtml_ch3fig5) shows the Pinout tab display, which is divided
    into two parts. The right-hand side shows the selected board MCU with all predesignated
    peripheral and GPIO pins clearly shown. ST refers to this as the Chip view for
    obvious reasons. These pin designations will be explored in detail in later sections
    as well as later chapters. The left-hand portion of the Pinout display in [Figure
    3-5](#ch3.xhtml_ch3fig5) shows all the peripheral pins as well as software MiddleWares
    in a tree view. Next to each tree element is a symbol, which reflects the individual
    status of the peripheral or software line item. I will discuss these symbols after
    discussing Chip view and exploring the significant amount of information that
    can be gained from this view.


    [Figure 3-6](#ch3.xhtml_ch3fig6) is an expanded diagram of the `STM32F302R8Tx`
    MCU chip that is used as the core processor in the `NUCLEO-F411RE` development
    board.


    ![images](fig03-06.jpg)


    **Figure 3-6** STM32F302R8Tx MCU.


    ***NOTE*** It will be somewhat difficult for readers of the hard copy book to
    follow the next discussion as the figure uses color coded pins, which are very
    hard to distinguish in the gray-scaled rendered images. Therefore, I will attempt
    to identify the pins under discussion as completely as I can, given this constraint.


    There are two fully enabled GPIO pins colored in green, which are `PC13` and `PB13`.
    `PC13` is located near the top left-hand corner, while `PB13` is at the lower
    right-hand corner. Pin `PC13` is permanently connected to the development board’s
    user blue push button and `PB13` is permanently connected to the user green LED.
    These connections are also noted in the diagram, as shown in [Figure 3-6](#ch3.xhtml_ch3fig6).


    There are nine orange-coded pins located on all sides of the board. An orange-coded
    pin indicates that a peripheral normally assigned to a specific pin has not been
    enabled. For example, `PA2` and `PA3` are located on either side of the lower
    left-hand corner of [Figure 3-6](#ch3.xhtml_ch3fig6) and have the peripheral TX
    and RX functions assigned to each. Being orange coded will mean that the `CubeMX`
    application will not automatically generate C code for these pins.


    All of the yellow-coded pins are typically located at or near the corners of the
    chip and are solely dedicated to power source functions such as `V[dd]`, `V[ss]`,
    `V[bat]`, and `V[ca]`. These pins are strict hardware designations and cannot
    be programmed or reconfigured.


    Finally, there are two remaining olive colored pins, `BOOT` and `NRST`, with `BOOT`
    located on the top edge and `NRST` on the left edge. Like the power source pins,
    these two pins have dedicated MCU functions and cannot be programmed or reconfigured.


    All remaining pins in the Chip view are gray-coded GPIO pins and can be initialized
    to suit program requirements. How this is accomplished is thoroughly discussed
    in the next chapter. All these pins have various functions or status outputs,
    which may be revealed by hovering the mouse over a particular pin. The functions
    and status outputs for pin `PC0` as shown in [Figure 3-6](#ch3.xhtml_ch3fig6)
    are as follows:


    - Reset_State

    - ADC1_IN6

    - TIM1_CH1

    - GPIO_Input

    - GPIO_Output

    - GPIO_Analog

    - EVENTOUT

    - GPIO_EXTI0


    It would be difficult at this point to explain each of these functions and status
    outputs. They are all discussed in the comprehensive STM32F302R8 MCU datasheet.
    The GPIO functions, however, will be discussed in the next chapter.


    ### MCU Alternative Functions


    The STM MCU architecture allows for alternative pin mapping for various peripheral
    functions. Control clicking on any enabled GPIO pin such as `PC13` will reveal
    the alternate pin mappings associated with that pin, as shown in [Figure 3-7](#ch3.xhtml_ch3fig7).

