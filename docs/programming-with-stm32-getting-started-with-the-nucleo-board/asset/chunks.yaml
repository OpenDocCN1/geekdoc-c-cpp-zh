    ### 通用定时器 (TIMx)


    共有四个通用定时器可供。这些定时器 `TIM2`、`TIM15`、`TIM17` 和 `TIM16` 是带有 16 位分频器的全功能定时器。`TIM2` 是唯一的
    32 位定时器，而其余的使用 16 位。除了基础定时器外，所有这些定时器都有多达四个通道用于以下功能：


    • 输入捕获

    • 输出比较

    • PWM

    • 单脉冲输出


    这些定时器可以以前联的方式共同工作，它们也可以与 `TIM1` 链接。


    ### 基础定时器 (TIM6)


    剩余定时器是 `TIM6`，这是一个基础 16 位类型。它的选项有限，正如其名所示，仅用于最基本的定时功能。


    ### 看门狗定时器


    有两个看门狗定时器。第一个是独立的 12 位倒计数器，带有 8 位分频器。它由单独的 `32-KHz` 晶振驱动，使其独立于 MCU 主时钟运行。当 MCU
    处于待机（standby）甚至停止（stop）模式时它也能运行。这允许它在意外停止 MCU 的事件发生时重置 MCU。


    第二个看门狗定时器是一个自由运行的 7 位倒计数器，也可以设置为在发生问题时重置 MCU。该看门狗从 MCU 主时钟运行，但它具有早期预警中断能力，可以在发生意外问题时优雅地停止
    MCU。


    ### SysTick 定时器


    还有一个定时器 `SysTick`，但不建议使用它。该定时器通常专门用于支持实时操作系统 (RTOS)。然而，如果 MCU 项目没有使用 RTOS，则该定时器可以空闲使用。此定时器具有以下特性：


    • 24 位倒计数器

    • 当计数器达到 0 时生成具有自动重载能力的可掩码系统中断

    • 可编程时钟源


    我认为，此定时器只有在所有其他定时器都被完全占用的极罕见情况下，才作为最后的手段使用。我无法想象有足够复杂以会发生这种情况的项目。


    ## 位串行端口


    此 MCU 支持 4 位串行协议，允许它与其他计算系统或外设之间进行串行通信。


    ### USART 串行协议


    讨论的第一个位串行协议是标准通用同步/异步收发器 (`USART`)。取决于是否配置为同步模式，此串行协议可能可能不需要时钟信号。MCU 提供两个 `USART`
    终端端口；但只有名为 `USART2` 的一个是激活的，它直接连接到位于 Nucleo-64 PCB 上 ST-LINK 部分另一个 MCU 上的 `USART`
    端口。ST-LINK 上还有一组位于引脚对 `CN3`，它暴露了 `TX` 和 `RX` 线。


    可以通过打开焊桥 `SB13` 和 `SB14` 并关闭焊桥 `SB62` 和 `SB63` 来断开 `USART2` 链接。如果这样做，使用引脚 `PA2`
    和 `PA3` 的主 MCU 上的 `USART2` 端口分别连接到 `CN9` 的第 1 和 2 引脚，以及 `CN10` 的第 35 和 37 引脚。这将为位于扩展板上的任何兼容串行设备提供一个
    `USART` 端口。


    可以通过位于 ST-LINK 上的 ST Morpho 连接器 `CN7` 和 `CN3` 之间的跳线来启用名为 `USART3` 的第二个 `USART`
    端口。例如，在该 Nucleo-64 板上，可以使用位于 `PC10` (TX) 和 `PC11` (RX) 的 `USART3`。需要按如下方式连接两根跳线：


    • `CN7` 引脚 1 上的 `PC10 (USART3_TX)` 连接到 `CN3` 引脚 `RX`

    • `CN7` 引脚 2 上的 `PC11 (USART3_RX)` 连接到 `CN3` 引脚 `TX`


    虽然这在物理上恢复了 `USART` 链接，但我确定底层的 ST-LINK 通信软件必须修改以使用这个新的 `USART` 端口号。


    ### I2C 串行协议


    第二个位串行协议是集成电路接口或 `I2C`（读作“eye-two-cee”或“eye-squared-cee”），也称为同步串行数据链路。由于它是同步的，因此需要时钟信号。图
    1-9 是 `I2C` 接口的框图，显示了一个主和一个从设备。这种配置被称为多点或总线网络。


    ![images](img/fig01-09.jpg)


    **图 1-9** *I2C 框图。*


    `I2C` 支持多个主以及多个从设备。该协议由飞利浦在 1982 年创建，是一项非常成熟的技术，意味着它极其可靠。只使用两条线：用于串行时钟的 `SCLK`
    和用于串行数据的 `SDA`。


    STM MCU 实现三个独立的 `I2C` 总线。这些总线可以以 `100 KHz` 的标准时钟和 `400 KHz` 的快速速率运行。制造商可以将此速率增加到非标准的
    `1 MHz`。


