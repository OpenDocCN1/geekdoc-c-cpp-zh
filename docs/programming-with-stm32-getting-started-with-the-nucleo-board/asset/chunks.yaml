    The 70-MHz bandwidth calculated for the Very Fast speed setting reflects several
    factors including the maximum possible AHB1 bus speed, which is 100 MHz and the
    `STM32F302R8` high-speed clock rate, which is 72 MHz for the Nucleo-64 development
    board it controls. All-in-all, a 70-MHz bandwidth is fairly decent while the 19.4
    MHz for the Low speed setting could be problematic for demanding applications
    such as very high-speed data communications. My experimental results actually
    agree quite closely with STM’s estimates of 75 MHz for the Very Fast setting and
    25 MHz for the Low setting.


    ## Summary


    This chapter’s focus was on how to work with GPIO pins and the HAL. I began with
    a review of how STM peripherals are memory-mapped because that is the fundamental
    basis on how the MCU configures and controls them.


    I next proceeded to discuss how a typical GPIO hardware pin is set up and the
    various functions by which it may be configured including as an input, an output,
    an analog role, or an alternate function. The various control registers associated
    with a GPIO pin were also discussed.


    A simple LED test demonstration was next shown where I used an LED/resistor combination,
    which was inserted into Arduino protoboard sockets. The protoboard in turn was
    inserted into the Nucleo-64 development board. I went through all the program
    changes required to be entered into a `main.c` file in order to light the LED.
    A complete and annotated `main.c` listing was provided for your reference and
    use.


    The above program was next modified to accommodate multiple outputs, which controlled
    an additional LED.


    The next demonstration illustrated how the blue user bush button located on the
    Nucleo-64 development board could be programmed with a GPIO input pin to light
    an LED when it was pressed. The purpose of this program was to show you how to
    set up a GPIO pin as an input.


    The last demonstration concerned how the GPIO clock speed parameter affected GPIO
    signal output waveforms. I explained that the clock speed was a misnomer and the
    real intent was to control GPIO signal skew. Skew is the time it takes to transition
    from one state to another state.


    ## 6 Interrupts


    This chapter covers interrupts. As the name implies, they deal with stopping the
    normal program execution upon recognition of a predesignated event and then attending
    to that event.


    ### Interrupts


    An interrupt from a high-level perspective is any process that momentarily stops
    an ongoing program execution and requires the MCU to execute specialized code
    related to the event that initiated the interrupt. This specialized code is known
    as an interrupt handler. The event that causes the interrupt is termed an asynchronous
    event, meaning that it has no causal relationship with the normally executing
    program code. You will shortly see that timer peripherals are typically the source
    of these asynchronous events. Data communication channels as well as direct memory
    access (DMA) processes also commonly use interrupts.


    An interrupt can originate with hardware, which is the case when a timer is involved.
    It can also be purely software driven, which will often happen when an abnormal
    program termination is detected, such as an attempt to divide by zero or attempting
    to access a nonexistent memory location. Software interrupts in most computer
    languages are normally referred to as exceptions. However, in ARM terminology,
    all interrupts whether they are a hardware or software initiated are called exceptions.


    The ARM Cortex-M integrated peripheral (IP) contains a hardware device called
    the nested vector interrupt controller (`NVIC`) whose purpose is to manage exceptions.
    [Figure 6-1](#ch6.xhtml_ch6fig1) is a block diagram illustrating how the `NVIC`
    is connected with other key Cortex-M components, including the Cortex-M core and
    other peripherals.


    ![images](fig06-01.jpg)


    **Figure 6-1** NVIC block diagram.


    You can see two types of wired connections in the left side of [Figure 6-1](#ch6.xhtml_ch6fig1).
    A single line labeled `NMI` stands for non-maskable interrupt and is used to allow
    a peripheral to signal the `NVIC` to unconditionally start the interrupt process.
    The other interrupt type is `IRQ`, which stands for interrupt request. This interrupt
    type can be masked, meaning that the `NVIC` does not have to immediately respond
    to an `IRQ` if a corresponding masking `IRQ` register bit has been set. There
    is usually only one `NMI`, but there are many `IRQ` lines that are dependent on
    the specific model `NVIC` capacity.


    The `NVIC` is also linked between the Cortex-M core with both dedicated I/O lines
    and the standard internal bus interconnect structure. This means the `NVIC` is
    completely CMCIS compliant and uses the same type of control and configuration
    registers as has been detailed in the GPIO discussion. The `NVIC` is fully integrated
    into the HAL software framework and uses its own C structures to set up a variety
    of registers. Driver software for the `NVIC` will be discussed in a demonstration
    program. At this point, I will discuss some important details regarding the `NVIC`.


    ## NVIC Specifications


    The STM `NVIC` general specification states that up to 256 interrupt channels
    can be managed by a single `NVIC`. Out of the 256 channels, 240 may be external,
    while 16 are always internal. In reality, the `NVIC` portion of the `STMF302R8`
    MCU, which controls the project development board, only supports 52 channels.
    In addition, there are 16 hardware interrupt lines that have direct connections
    to the `NVIC`. Any of the MCU’s 51 GPIO lines may be configured as a maskable
    interrupt, which means they can become an interrupt channel. You should think
    of an interrupt channel as more of a software construct than a hardware implementation.
    In fact, the interrupt C structure uses the word “channel” to reinforce this concept.


    Interrupts also may be assigned a priority level. This means that a higher priority
    interrupt can interrupt a lower priority interrupt. This action gives meaning
    to the word “nested” in the acronym `NVIC`. An 8-bit register holds priority levels,
    which means there can be a maximum of 256 priority levels. I cannot conceive of
    a practical embedded system that would ever need anywhere that priority levels.
    Such a system would likely be impossible to design, let alone implement.


    It is time to now return to a detailed discussion of the interrupt process as
    I have already introduced the `NVIC`.


    ### Interrupt Process


    There a few definitions to be set before proceeding with this section:


    - Arm: Allows a hardware device to trigger an interrupt

    - Disarm: Disallows a device to trigger an interrupt

    - Enable: Allows the interrupt process

    - Disable: Disallows the interrupt process


    Enabling and disabling interrupts are easily accomplished in the C language by
    using the `EnableInterrupts()` and `DisableInterrupts()` methods, respectively.
    A potential interrupt source can trigger an interrupt provided that interrupts
    are enabled and a specific trigger bit associated with that potential source has
    been set in the appropriate `NVIC` control register. This is considered arming
    a specific device. Conversely, resetting that same register trigger bit will be
    considered disarming the device. There is one important deviation from this procedure
    when considering the SysTick interrupt. It has no enable bit because of its importance
    in having its events always recognized by the MCU.


    Interrupt priorities are established by setting appropriate bits in the `NVIC`
    `BASEPRI` register. For example, if a specific interrupt is set at a priority
    level equal to 3, then any interrupt with priority level of 0, 1, or 2 will interrupt
    the level 3 interrupt. However, if the `BASEPRI` register is set to 0, then the
    interrupt priority feature is disabled and all interrupts are processed as they
    are received by the `NVIC`.


    There are five preconditions that must be true before an interrupt can be generated:

