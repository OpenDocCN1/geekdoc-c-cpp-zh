  trans: '

    死循环（forever loop）包含一系列 `if` 语句，这些语句将根据特定的计数器值被触发。`if` 语句内部的内容用于设置或重置用户 LED。每次计数器递增需要
    0.25 s 完成，这意味着两次递增将需要 0.5 s。在最初 4 秒内，LED 每秒会切换两次。接下来的 4 秒内，LED 每秒会切换一次。


    这种代码格式显得相当冗长，但它确实用代码空间换取了简单性。通过这种格式，可以很容易地遵循算法步骤，以确定如何使用该格式控制 LED。


    ![Images](img/c0163-02.jpg)


    ![Images](img/c0164-01.jpg)


    ## 测试运行


    我构建了项目并将其上传到 Nucleo-64 板板上。用户 LED 立即开始以 0.5 秒的频率闪烁 4 秒，然后以 1.0 秒的频率闪烁 4 秒，这证实了程序运行结果符合预期。


    ### 对多速率程序的修改


    我重写了上述死循环代码中的代码片段，使其更加紧凑。修改内容如下所示。


    ![Images](img/c0165-01.jpg)


    使用修改后的代码，程序功能几乎相同，该代码使用了取模运算结合切换方法（toggle method）来控制 LED。代码比原始代码短得多，但它更复杂，更难理解，因此也难以维护。这种变化凸显了开发者经常面临的一个有趣挑战：这个挑战在于是使用更简单但占用更多代码空间的代码，还是使用紧凑且“高效”的代码（而后者可能更难理解和修改）。


    ## 测试运行


    我构建了修改后的项目并将其上传到 Nucleo-64 板板上。用户 LED 立即开始以 0.5 秒的频率闪烁 4 秒，然后以 1.0 秒的频率闪烁 4 秒，这证实了修改后的程序运行与原始程序相同。我注意到与原始版本相比，这个版本的
    LED 闪烁似乎更频繁。我只能将闪烁归于使用了 `toggle` 方法而不是固定的设置（set）和重置（reset）方法。


    最后一个演示完成了我希望传达的中断和定时器的所有讨论和演示。这一章真的只是冰山一角，因为关于这些主题有海量的信息是我无法涵盖的。仅 STM 的 HAL 用户手册就有近
    2000 页。一如既往，STM 的数据表、用户手册和参考手册将是学习通过中断和定时器执行许多额外特性和功能的宝贵资源。


    ### 总结


    我从关注定时器开始章节讨论，定时器是重要的外设，因为它们减轻了 MCU 不需要直接执行定时函数的负担。我解释了 STM 定器的五类可用类型，其中项目 MCU
    提供了三种类型。这些是：基础型、通用型（GP）和高级型。


    接下来，我向你们展示了如何配置定时器来执行特定的定时事件。该讨论之后是一个演示，其中板载 LED 每秒闪烁一次。这个演示没有使用中断，而那是第二个定时器演示的重点。


    在第二个定时器演示中，我展示了将定时操作集成到中断过程中是多么容易。在这个演示中，板载 LED 也闪烁了，但它是通过中断过程进行闪烁的。


    第三个定时器演示展示了如何重构中断过程，以实现多速率 LED 闪烁。中断回调方法控制一个计数器变量，该变量反过来控制死循环中 LED 的实际激活。


    在最后一个定时器演示中，我将原始的死循环代码更改为功能相同但更紧凑、复杂的版本。这样做是为了说明开发者必须不断决定如何编写代码：是更简单但消耗更多代码空间，还是非常紧凑且复杂（更难理解）。


    ## 8


    ## 比特串行通信


    本章涵盖了 MCU 如何使用比特串行通信在外部设备和系统之间双向传输数据。用于此功能的主要外设设备是通用异步收发传输器（UART）和通用同步/异步收发传输器（USART）。这些外设之间的主要区别是
    USART 可以使用节点之间的同步时钟脉冲串，而 UART 是完全自同步的。这些差异将在接下来的章节“UART 和 USART”中进行更详细的解释。


    ### UART 和 USART


    图 8-1 是显示两个连接的 UART 的框图，其中节点 A 向节点 B 发送数据。


    ![images](img/fig08-01.jpg)


    图 8-1 UART 框图。


    节点之间的数字脉冲串由一个起始位、八个数据位和一个停止位组成。这些位合在一起被视为一个帧。你应该注意，起始位和停止位的持续时间比数据位长 50%。这种脉冲持续时间的差异是
    UART 区分起始/停止位与数据位的方式。接收节点必须检测起始位以确定帧何时开始。接收节点还被配置为接受指定数量的数据位，以及是否有一个或两个停止位。UART
    可以设置为发送七位或八位数据位，以及一个或两个停止位。此外还提供了发送额外校验位的规定，这有助于检测传输错误。通常不使用校验位，特别是在传输通道不嘈杂或不存在传输线延迟的情况下。


    USART 是 UART 的变体，因为在节点之间可以使用额外的时钟线，如图 8-2 所示。


    ![images](img/fig08-02.jpg)


    图 8-2 USART 框图。


    当两个 USART 节点互连时，不需要使用起始和停止位，如图 8-2 是使用 UART 和 USART 节点的全工通信设置框图。


    ![images](img/fig08-03.jpg)


    图 8-3 全工通信框图。


    全工通信意味着节点之间可以同时发送和接收数据。这是严格可能的，因为每个节点的 UART 或 USART 都由其自己的 MCU 控制。


    通常，评估给定节点是否能够积极参与链路是非常重要的。可能会出现接收节点的 MCU 由于某些原因被临时阻塞，此时远程节点的 UART 可以发送数据，但接收节点可能无法处理。因此，UART
    和 USART 硬件中提供了协议控制线，以确保在允许时发送和接收数据。两个主要的控制线是请求发送（RTS）和清除发送（CTS）。想要传输数据的节点首先置高或设置
    RTS 线。接收节点随后置高或设置 CTS 线表示可以发送数据。这一过程也被称为请求/确认，常用于全工通信链路。然而，这种协议对于书中的项目并不需要，因为项目板
    MCU 永远不会被阻塞，而接收节点通常是 PC，PC 也永远不会被阻塞。


