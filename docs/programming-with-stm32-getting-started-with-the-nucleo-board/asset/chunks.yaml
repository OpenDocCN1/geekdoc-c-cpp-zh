  trans: "\n\n项目板使用的 STM32F302R8 MCU 中有两个 USART。它们在逻辑上分别被称为 `USART1` 和 `USART2`。它们是\
    \ MCU 除通过 `GPIO` 端口处理数据位或使用其他通信协议（如 `I2C` 和 `SPI` 位串行接口）之外，发送和接收数据的主要手段。后两者主要用于传感器数据，尽管有一个非常出色的\
    \ `I2C` 外设可以显示文本消息。在本章稍后的部分，我将讨论如何设置 `USART2` USART 以与 PC 终端程序通信。然而，我现在需要讨论如何初始配置\
    \ USART。\n\n注意：初始化和配置 UART 与 USART 的软件是相同的。不要担心讨论的是 USART，但函数或类型定义（typedef）的名称中带有\
    \ `UART` 字样。\n\n# USART 配置\n\nSTM32 USART 的配置方式与我之前讨论过的 GPIO 引脚、中断和定时器类似。STM32\
    \ USART 使用一个名为 `UART_HandleTypeDef` 的 C 结构体进行初始化。它通过使用一个名为 `UART_InitTypeDef`\
    \ 的 C 结构体进行配置的。我将首先讨论 `UART_HandleTypeDef`，它包含以下成员：\n\n![Images](img/c0170-04.jpg)\n\
    \n以下讨论了该结构体的一些较重要的成员：\n\n*   `Instance`: 这是指向 USART 描述符的指针。例如，`USART2` 是与 ST-LINK\
    \ 接口关联的 `UART` 描述符。\n*   `Init`: 这是 C 结构体 `UART_InitTypeDef` 的实例，用于配置 `UART` 接口。\n\
    *   `AdvancedInit`: 用于配置更高级 UART 特性，如自动 `BaudRate` 检测和 TX/RX 引脚交换。\n*   `pTxBuffPtr`:\
    \ 指向发送缓冲区，用作传输字节的数据源。\n*   `TxXferCount`: 存储传输字节计数。\n*   `pRxBuffPtr`: 指向接收缓冲区，传入的字节存储在此。\n\
    *   `RxXferCount`: 存储接收字节计数。\n*   `Lock`: 该字段由 `HAL` 内部用于用于锁定对 UART 接口的并发访问。\n\
    \nC 结构体 `UART_InitTypeDef` 包含以下成员：\n\n![Images](img/c0171-02.jpg)\n\n这些结构体成员代表以下\
    \ USART 参数和设置：\n\n`Baudrate`: 该参数是每秒位数的连接速率。表 8-1 显示了 STM USART 外设可用支持的标准和非标准波特率表。\n\
    \n![images](img/tab08-01.jpg)\n\n**表 8-1 波特率表**\n\n*   `WordLength`: 此值指定在帧中传输或接收的数据位数。该字段可以取以下定义之一：\n\
    \    *   `UART_WORDLENGTH_8B`\n    *   `UART_WORDLENGTH_9B`\n*   `StopBits`: 该字段指定传输的停止位数量。该字段可以取以下定义之一：\n\
    \    *   `UART_STOPBITS_1`\n    *   `UART_STOPBITS_2`\n*   `Parity`: 此值表示奇偶校验模式。该字段可以取以下定义之一：\n\
    \    *   `UART_PARITY_NONE`\n    *   `UART_PARITY_EVEN`\n    *   `UART_PARITY_ODD`\n\
    *   `Mode`: 此值指定启用或禁用 RX 和/或 TX 模式。该字段可以取以下定义之一：\n    *   `UART_MODE_RX`\n   \
    \ *   `UART_MODE_TX`\n    *   `UART_MODE_TX_RX`\n*   `HwFlowCtl`: 此值指定启用或禁用 RS2326\
    \ 硬件流控模式。该字段可以取以下定义之一：\n    *   `UART_HWCONTROL_NONE`\n    *   `UART_HWCONTROL_RTS`\n\
    \    *   `UART_HWCONTROL_CTS`\n    *   `UART_HWCONTROL_RTS_CTS`\n*   `OverSampling`:\
    \ 此值有助于区分噪声与真实的信号电平。所选的过采样率是噪声免疫能力与最大可能通信速度之间的权衡。该字段可以取以下定义之一：\n    *   `UART_OVERSAMPLING_8`\n\
    \    *   `UART_OVERSAMPLING_16`\n\n上述讨论详细说明了如何初始化和配置 USART，但我仍然需要解释如何建立项目板与远程节点（即连接到板的\
    \ PC）之间的通信链路。\n\n# Windows 终端程序\n\n你需要安装一个终端程序来显示从演示板传输的文本消息。有很多免费且可以方便下载的终端程序。我选择了一个名为\
    \ `Realterm` 的程序，它可以在 [`sourceforge.net/projects/realterm/`](https://sourceforge.net/projects/realterm/)\
    \ 获取。它是一个功能全终端程序，我发现它非常容易配置和运行。图 8-4 显示了我点击后的 `Realterm` 屏幕。\n\n![images](img/tab08-01.jpg)\n\
