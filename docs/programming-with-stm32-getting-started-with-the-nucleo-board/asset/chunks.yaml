    ## 9


    ## 模拟量数字转换


    本章涵盖了模拟数字转换这一非常重要的主题。实际执行转换的设备称为模拟数字转换器（ADC）。STM 系列 MCU 具有多种 ADC；然而，它们的工作方式和编程方式相似。项目板上的
    STM32F302R8 MCU 使用了单个 ADC。但是，它可以接受来自 15 条独立外部引线中任意 1 条的模拟输入。还有一个第 16 个 ADC 输入端，但它永久连接到内部温度传感器，不可用于任何其他用途。


    嵌入式开发的初学者有时会质疑是否需要 ADC 外设。答案是，现实世界的测量通常是使用模拟传感器进行的，这些传感器提供连续的电压范围，电压与所监测的环境参数成正比。例如，图
    9-1 所示的 Analog Devices TMP36 温度传感器提供了约 0.1 到 2.0 V 的电压范围，该范围与大约从 –40°C 到 150°C
    的温度范围直接正比。这种模拟电压在被 MCU 处理之前必须转换为等效的数字。这就是 ADC 的作用。


    ![images](img/fig09-01.jpg)


    **图 9-1**   *Analog Devices TMP36 温度传感器。*


    接下来的讨论详细解释了 STM ADC 是如何工作的。


    ### ADC 功能


    STM ADC 中使用的技术被称为逐次逼近寄存器（SAR）。SAR 的架构非常简单，如图 9-2 所示框图所示。


    ![images](img/fig09-02.jpg)


    **图 9-2**   *SAR ADC 框图。*


    模拟电压首先输入保持电路。该电路也称为采样保持电路，它获取模拟电压的瞬时采样，并将其采样值作为待转换数字。图 9-2 所示的 N-BIT 寄存器块被设置为中间值。该值取决于转换的位数。为了本次讨论，我将仅使用
    4 位进行转换，这足以解释转换过程。实际上，真实的 STM ADC 是 12 位。回到寄存器意味着预设的中间值为 1000。因此，该值将强制图中所示数字模拟转换器（DAC）输出等于
    `V[REF]/2` 的电压。`V[REF]` 是 ADC 使用的参考电压，通常与电源或电源轨电压相同。对于大多数 MCU 来说就是 3.3 V。


    由采样保持（`V[IN]`）模块保持的采样电压与 DAC 输出（`V[DAC]`）之间的比较将通过 图 9-2 右上部分的比较器模块完成。如果 `V[IN]`
    大于 `V[DAC]`，比较器将输出 1，否则输出 0。如果输出 1，则 N-BIT 寄存器中的最高位将被保留，否则将被重置为 0。


    SAR 逻辑模块随后将向右移动一位并重复比较过程。该序列一直重复直到到达最低位（LSB）位置并处理。一旦完成该步骤，N-BIT 寄存器将包含与采样模拟输入电压等效的数字。SAR
    逻辑模块随后允许完全转换的数字值以并行或串行格式释放。


    图 9-3 显示了一个完整的 4 位转换序列。


    ![images](img/fig09-03.jpg)


    **图 9-3**   *四位转换序列。*


