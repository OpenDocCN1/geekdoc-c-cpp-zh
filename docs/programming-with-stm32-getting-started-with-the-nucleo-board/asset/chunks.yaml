    **表 11-1** 二进制输入与模拟电压输出——3 位 DAC 示例


    图 11-7 从更详细的方面展示了模拟电压输出，可以明显看出，由于位数限制，二进制输入值之间没有平滑过渡。


    ![images](img/fig11-07.jpg)


    **图 11-7** 显示模拟电压输出的柱状图。


    表 11-1 和图 11-7 充分证明了必须具有足够的位数，才能使 DAC 输出较为平滑且连续的电压。然而，即使在位数较高的情况下，由于 DAC 内部不断发生的固有切换，仍然会有少量的噪声。这种噪声可以使用有源低通模拟滤波器轻松滤除掉。不过，我将证明
    DAC 输出非常干净，可以直接使用而无需额外的滤波。


    STM DAC 还具有切换缓冲器输出放大器的选项。该设备将降低 DAC 的输出阻抗，并提供额外的驱动电流，而无需为此目的添加外部输出运算放大器。


    现在是时候讨论用于配置和初始化 STM DAC 外设的 HAL 软件了。


    ## 用于 DAC 的 HAL 软件


    HAL 框架使用名为 `DAC_HandleTypeDef` 的 C 结构体来配置 DAC 外设。每个成员将在结构体定义之后分别进行讨论。


    ![_Images](img/c0261-01.jpg)


    `DAC_HandleTypeDef` 结构体成员在以下列表中简要定义：


    - `DAC_TypeDef *Instance;`—这是指向将使用的 DAC 描述符的指针。例如，`DAC1` 是第一个 DAC 外设的描述符。

    - `__IO HAL_DAC_StateTypeDef State;`—该值代表 DAC 通信状态。

    - `HAL_LockTypeDef Lock;`—该值是一个 DAC 锁对象。

    - `DMA_HandleTypeDef *DMA_Handle1;`—这是指向 DMA 程序的指针，用于在 DMA 模式下执行数字模拟转换。

    - `DMA_HandleTypeDef *DMA_Handle2;`—这是指向另一个 DMA 处理程序的指针，用于在 DMA 模式下执行数字模拟转换。

    - `__IO uint32_t ErrorCode;`—这是一个代表 DAC 错误代码的值。


    `DAC_HandleTypeDef` 结构体与所有其他相似结构体的不同在于它没有 `Init` 成员，而是依赖于不同类型的 C 结构体在通道级上初始化 DAC。该
    C 结构体名为 `DAC_ChannelConfTypeDef`，具有以下定义。与之前一样，每个成员将在结构体定义之后分别进行讨论。


    ![_Images](img/c0262-09.jpg)


    `DAC_ChannelConfTypeDef` 结构体成员在以下列表中简要定义：


    - `uint32_t DAC_Trigger;`—该值指定用于触发 DAC 转换的源。此参数可以是以下定义中的任何值：

    - `DAC_TRIGGER_NONE`—用于手动触发。

    - `DAC_TRIGGER_SOFTWARE`—当 DAC 处于无定时器的 DMA 模式时。

    - `DAC_TRIGGER_Tx_TRGO`—当 DAC 由专用定时器驱动时。

    - `uint32_t DAC_OutputBuffer;`—指定 DAC 通道输出缓冲区是否启用或禁用。


