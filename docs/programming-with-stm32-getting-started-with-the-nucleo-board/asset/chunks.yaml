    嵌入式开发人员使用“工具链”来创建和调试运行在 MCU 上的软件。并没有唯一的工具链，因为所使用的工具取决于所用的主机计算机、目标 MCU、开发语言、链接器/加载器以及其他各种组件。通常情况下，工具链由编辑器、交叉编译程序、支持库、链接器/加载器和调试器组成。工具链的大部分组件通常被集成在一个名为*集成开发环境*（IDE）的单一应用程序中，或者它们也可以是独立的各个部分，开发者必须按照正确的顺序对其进行连接和使用。


    使用 IDE 绝对有助于开发人员高效地为微控制器创建代码，因为 IDE 具有以下功能：


    *   集成的源代码编辑器

    *   创建软件项目并自动创建和存储所有必要支持文件的方法

    *   一种能够快速筛选组成项目的许多文件的导航方案

    *   一键交叉编译

    *   易于与合适的加载和调试程序集成，在这种情况下该程序为 `ST-LINK/V2`

    *   多功能调试模式


    我还想提到，Keil IDE 包含的功能比许多读者可能已经在使用的 Arduino IDE 要多得多。Arduino IDE 采用后后“开箱即用”，这对于大多数用户来说非常方便，但同时也限制了它支持各种不同微控制器的能力，而且你被限制一种编程语言，即
    Processing。设置你自己的自定义工具链仅仅是为你提供了一种非常灵活的方式，以支持你独特的编程需求。


    工具链可能非常简单（如 Arduino IDE 所示），也可能非常复杂（例如在 Linux 系统中使用开源软件开发的独特 MCU 可能会出现的情况）。我认为书中建立的
    STM32 工具链属于中等复杂程度。然而，一个好消息是，制造商免费提供了一个应用程序，可以很好地支持其 MCU 系列，特别是在使用 C 语言设置时钟和外设方面。我将在稍后的章节中讨论这个名为
    `STMCube32MX` 的应用程序。图 2-2 显示了通用嵌入式开发项目的工具链工作流。


    ![images](img/fig02-02.jpg)


    **图 2-2** *通用工具链工作流。*


    流程的第一步是使用文本编辑器创建源代码。大多数情况下，编辑器是 IDE 的不可或的一部分，但开发者通常有自己喜爱的、习惯使用的编辑器。在所有情况下，源代码都是使用所需的计算机语言生成的，然后它将作为交叉编译程序的输入。交叉编译程序之所以这样命名，是因为它在主机计算机的操作系统上运行，但产生运行在目标
    MCU 上的二进制代码。这些新生成的二进制代码随后必须与所有必要的二进制库链接，以形成一个完全可执行的 MCU 程序。这项工作是链接器的责任。完全形成且可执行的二进制程序接下来必须被上传到
    MCU 中。这是加载器的责任。加载器功能通常被划分为部分硬件和部分软件。`ST-LINK/V2` 为书中项目使用的 `Nucleo-64` 开发板执行加载功能。


    现在 MCU 就可以运行一个工作良好的程序并进行测试，以查看其性能是否符合预期。这被称为调试，在图中显示为菱形。如果程序在没有任何缺陷的情况下运行（尽管这并不常见），那么
    MCU 就可以进入生产或发布阶段了。然而，如果检测到错误，则必须解决它们，这通常意味着要一直回溯到源代码并在那里进行适当的修改。然后必须根据需要重复整个工具链过程，直到
    MCU 功能符合预期，或者任何遗留的错误微小到可以忽略并留在最终的程序可执行代码中。一个微小错误的例子可能是 MCU 在 21 ms 内对传感器事件做出响应，而不是
    20 ms，但这种微小的偏差对 MCU 的整体性能没有可衡量的影响。


    ## 配置 STM32 工具链


    如前所述，配置工具链有许多方法。我选择使用 Keil 评估版 IDE，版本 4.74。


    注意：我使用 Windows 10 平台来托管此工具链。这样做是因为我确定与使用 Mac OS 或 Linux 环境相比，`ST-LINK/V2` 实用程序在
    Windows 上运行正常。你始终可以选择使用 Mac 或 Linux 主机创建工具链，但要准备好在尝试将程序从主机链接并加载到目标平台时可能会遇到一些兼容性问题。


    ### 安装 Keil IDE


    最新的 Keil IDE 是第 5 版本；但是，我决定安装较旧的 4.74 评估版 IDE，因为它看起来更稳定，而且在使用它时有更好的体验。如果你决定这样做，你可以选择安装最新版本，但我所有的项目都将使用较早的版本完成。可执行的评估版
    4.74 可以从以下网站获得：


    [`www.keil.com/demo/eval/armv4.htm`](https://www.keil.com/demo/eval/armv4.htm)


    在访问下载页面之前，你必须先填写注册表。该表单如图 2-3


    **图 2-3** *Keil 表单。*


    你将看到下载页面，如图 2-4


    **图 2-4** *IDE 下载页面。*


    一旦你填写表单并点击 `Submit` 按钮，下载的文件为 `MDK474.exe`，这是一个约为 576 MB 的 Windows 可执行文件。我建议在运行安装程序时接受所有默认建议，因为它们对于我的工具链运行良好。


    安装完成后，你应该能在桌面上看到 Keil IDE 图标，如图 2-5 所示。此外注意 Keil 将其 IDE 标记为 `uVision`。你将在构建期间自动生成的许多文件中看到
    `uVision` 标签。这就是安装 Keil 所需的所有步骤。


    ![images](img/fig02-05.jpg)


    **图 2-5** *IDE v474 图。*


    ### STM32CubeMX


    制造商 提供了一个名为 `STM32CubeMX` 的非常好应用程序，用于配置其 MCU 系列和演示板。`STM32CubeMX` 实用程序是一个基于图形界面的工具，帮助你使用
    C 语言创建自定义配置文件，特别适用于 Nucleo 板。例如，该工具可以创建用于闪烁 NUCLEO-F302R8 板用户 LED（LD2）的所有源代码，该板反过来使用
    `STM32F302R8` 微控制器。C 语言涵盖了处理器时钟、外设端口和通用输入输出（GPIO）配置以及其他一些。`STM32CubeMX` 应用程序可以从
    STM 网站免费下载 [`www.st.com/en/development-tools/stm32cubemx.html`](http://www.st.com/en/development-tools/stm32cubemx.html)。为了下载此软件，你需要在
    STM 网站注册，但它是免费的，STM 在发布工具的更改和更新时会你。此应用程序应该下载到 `STM32Toolchain` 目录，就像之前所有的应用程序一样。


    图 2-6 显示了 `STM32CubeMX` 实用程序在下载和安装后的启动闪屏。我建议在运行安装程序时接受所有默认建议。


    '
