    1. 潜在的中断设备必须处于已就绪状态，即触发位已设置。

    2. `NVIC` 必须启用。

    3. 全局中断必须启用。

    4. 中断优先级必须高于当前级别。

    5. 必须发生实际的硬件触发事件。


    这五个条件可以以任何顺序发生。然而，它们必须同时满足，中断才能被识别并处理。


    如果识别到中断，将发生以下五个事件：


    1. 当前正在执行的指令将完成。

    2. 当前运行的线程将挂起。

    3. 12 个寄存器的内容将存储在栈中。如果在识别到中断时浮点单元（`FPU`）恰好处于激活，则将额外存储 18 个字。

    4. `LR` 寄存器将被设置为特定值（`LR` 是一个特殊的栈寄存器）。

    5. `PC` 寄存器将加载中断服务程序（`ISR`）地址。


    图 6-2 是上述五个事件的图形化描述。


    ![images](img/fig06-02.jpg)


    **图 6-2** 中断处理序列。


    关键的一点是，`NVIC` 在识别到有效中断请求后，将使用存储在 `NVIC` 的固件自动与 MCU 接口。不需要特殊的代码，这使得中断处理尽可能快。如图
    6-2 所示，从识别到中断到执行 `ISR` 中的第一条指令只需要 12 个时钟周期。这意味着对于时钟频率 80 MHz 的 MCU 来说，大约有 1.5
    µs 的延迟。


    系列事件被称为上下文切换，由 `NVIC` 硬件自动调用。上下文切换的结果是当前运行的线程变为后台线程，而 `ISR` 变为前台线程。上下文切换在优先级中断中也工作得很好，低优先级的
    `ISR` 变成后台线程，高优先级的 `ISR` 变成前台线程。


    还有等待中断请求（pending interrupt request）的概念，你应该了解。如果检测到全局中断尚未启用，或者请求的中断优先级低于当前激活的中断，则请求的中断将处于挂起状态。一旦满足五个前提条件，请求的中断状态将从挂起变为激活。


    清除所有设备触发位也非常重要，否则会出现持续反复的中断请求。清除触发位的操作称为确认（acknowledgment），并通过软件指令完成。只有 `SysTick`
    中断具有自动确认功能，因为它在 MCU 中起着关键作用且其操作具有循环性。确认指令几乎总是包含在 `ISR` 中。


    关于 `ISR` 属性的几句话对于理解它在中断过程中所扮演的角色会有帮助。`ISR` 包含了处理并完成触发初始中断的动作所需的所有代码。`ISR` 通常是一个非常紧凑的软件模块，为支持中断设备的单一任务设计。然而，有一种实现方式仅用一个大型
    `ISR` 服务于许多中断源。在这种情况下，采用轮询技术来确定精确的中断源，并仅使用该大型 `ISR` 的部分来处理中断设备。STM MCU 并非如此。STM
    实现使用独立的、较小的 `ISRs` 来处理每个请求的中断设备。这些小型 `ISRs` 的地址列表存储在向量表中。这一特性引入了 `NVIC` 名称中的“向量（vector）”一词。


    我想提到一个 STM 向量中断过程实际上使用轮询的区域。这种情况是同一个端口上的多个 GPIO 引脚可以分别发出它们自己的中断。由于 GPIO 端口只有一个向量地址，因此由软件轮询该端口的所有触发位，以确定哪一个位已就绪（请求了中断）。


    每个 `ISR` 的编写都是为了尽可能高效地处理中断设备，并在发出确认信号的同时调用上下文切换。后者可以通过 C 语言命令轻松实现，该命令具有类似于 `BX
    LR` 的汇编语言格式，它将非常快速地将所有存储的寄存器值弹出到各自的寄存器中，从而将 MCU 恢复到中断前的状态。软件工程的设计目标是 `ISRs` 应该运行得越快并返回之前的前台线程。这意味着永远不应在
    `ISR` 中放置等待循环。


    在 `ISR` 中生成或修改的任何数据必须存储在全局共享内存位置中，否则由于 C 语言实现 `ISR` 框架的性质，它将对任何其他软件模块不可。


    ## 外部中断


    如通过 GPIO 引脚源的外部中断通过外部中断控制器（`EXTI`）连接到 `NVIC`。使用 `EXTI` 允许将许多 GPIO 引脚复用到 `NVIC`
    外部中断输入。图 6-3 是 `EXTI` 的框图。


    ![images](img/fig06-03.jpg)


    **图 6-3** EXTI 框图。


    STM32F302R8 MCU 中的 `EXTI` 控制器执行以下活动：


    - 处理连接到 16 条外部中断/事件线的最多 23 个独立软件事件和/或硬件触发

    - 为每条线提供状态位

    - 为每条线提供独立的触发器和掩码

    - 可以检测周期比驱动 EXTI 的 APB2 总线时更短的外部脉冲


    STM32302R8 51 个 GPIO 引脚中的任何一个都可以作为中断源。当然，任何时候最多只有 23 个激活。还有五条 `EXTI` 线连接如下：


    1. 线 16 连接到 PVD 输出

    2. 线 17 连接到 RTC 闹钟事件

    3. 线 18 连接到 USB OTG FS 唤醒事件

    4. 线 21 连接到 RTC 旁路时间戳事件

    5. 线 22 连接到 RTC 唤醒


    图 6-4 显示了 GPIO 引脚、外部控制器和 `NVIC` 中断之间的关系。


    ![images](img/fig06-04.jpg)


    **图 6-4** GPIO 引脚、外部控制器和 NVIC


    你应该注意 GPIO 引脚 PC13 与许多其他引脚组合在名为 `EXTI15_10_IRQ` 的共同 NVIC 中。这对中断程序非常重要。


    到这里，你应该已经获得了足够的知识来理解下一节简单的中断演示。


    ## 中断演示


