    讨论的第一个位串行协议是从外设备接口 (`SPI`)。通过位于 ST-LINK 上的 ST Morpho 连接器 `CN7` 和 `CN3` 之间的跳线可以启用名为
    `USART3` 的第二个 `USART` 端口。例如，在该 Nucleo-64 板上，可以使用位于 `PC10` (TX) 和 `PC11` (RX) 的
    `USART3`。需要按如下方式连接两根跳线：


    • `CN7` 引脚 1 上的 `PC10 (USART3_TX)` 连接到 `CN3` 引脚 `RX`

    • `CN7` 引脚 2 上的 `PC11 (USART3_RX)` 连接到 `CN3` 引脚 `TX`


    虽然这在物理上恢复了 `USART` 链接，但我确定底层的 ST-LINK 通信软件必须修改以使用这个新的 `USART` 端口号。


