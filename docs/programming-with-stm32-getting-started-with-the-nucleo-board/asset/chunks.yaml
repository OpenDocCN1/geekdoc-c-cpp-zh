    This demonstration controls the intensity or luminescence of a single, red LED,
    using a PWM output as shown in the previous demonstration. The only parameter
    to be varied is the CCRx value assigned in the main method by this statement:


    ![Images](c0228-01.jpg)


    I chose to vary this value by editing the main.c file and then quickly rebuilding
