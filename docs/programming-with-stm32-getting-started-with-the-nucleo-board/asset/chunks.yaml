    ### Summary


    Analog-to digital conversion (ADC) was the chapter’s topic. There was an explanation
    of how the 16-channel, 12-bit ADC works within the MCU. It uses a successive approximation
    technique to acquire precise numerical samples of a continuously varying analog
    input.


    The discussion next turned to how the HAL framework supports the ADC function.
    I went through the two C structs that both configure and initialize the ADC peripheral.
    The discussion also included the various conversion modes, channels, groups, and
    ranks.


    A full-scale ADC demonstration closed out the chapter. A TMP36 temperature sensor
    was used as an analog voltage source to the ADC. The program used the USART2 peripheral
    to stream out continuous temperature readings to a terminal window.


    ## 10


    ## Pulse Width Modulation (PWM)


    This chapter concerns pulse width modulation (PWM), which is a digital signal
    easily generated by a MCU for a variety of purposes. These purposes commonly include
    controlling the following:


    •   A standard servo motor’s position


    •   The rotational speed of a continuous rotation servo


    •   The luminescence of a light emitter


    •   The rotation speed of a standard electric motor with external driver circuitry


    •   A photovoltaic solar battery charger


    •   The maximum power-point track


    •   An output waveform such as sine, triangle, or square


    •   An acoustic sound generator


    This chapter’s projects will demonstrate how to control the luminescence (light
    intensity) of a normal LED, the color and luminescence of a tricolor LED, and
    the positioning of a standard servo motor.


    It is wise to first discuss the nature and properties of a PWM signal before proceeding
    to show how to generate that using the STM project board. [Figure 10-1](#ch10.xhtml_ch10fig1)
    is a typical PWM signal with various properties annotated in the figure.


    ![images](fig10-01.jpg)


    **Figure 10-1**   *Typical PWM signal.*


    The first thing to note is that the signal is repetitive with a frequency around
    50 Hz or an equivalent 20 ms period. This frequency is very common in servo control
    and it will be what I will use for the chapter projects. However, there is nothing
    limiting about this frequency and you can use any value up to the limit of what
    the MCU can support.


    The second important feature is the duty cycle, which is a percentage of the amount
    of time the signal is in a high state to the total period, which is the sum of
    the high and low times. Duty cycle is often considered the primary property for
    a PWM signal, for it solely determines the servo position and LED luminescence.


    It turns out that each type of device being controlled by PWM acts differently
    with the signal. I will describe each specific interaction when I go through the
    device demonstration.


    ### General-Purpose Timer PWM Signal Generation


    PWM signals are generated only by using either an advanced or a general purpose
    (GP) timer. This section describes the process on how this is done.


    The signal generation is relatively simple and involves using a timer in an upcounting
    mode. The top portion of [Figure 10-2](#ch10.xhtml_ch10fig2) shows a timer counting
    up from 0 to a maximum 16-bit count equal to 65535.


    ![images](fig10-02.jpg)


    **Figure 10-2**   *PWM signal generation.*


    Each GP timer has a series of registers known as compare capture registers (CCRx),
    which store a number. When the upcounting reaches that number, an event is generated
    that depends on the timer mode. If the timer is set for a direct output as is
    the case for this PWM mode, then the event will be to turn on the channel associated
    with the CCRx register. In [Figure 10-2](#ch10.xhtml_ch10fig2), channel 1 is switched
    high when the count reaches 52428\. The channel remains high until the timer counter
    reaches the maximum count (MAX) and overflows or resets as shown in the top waveform.
    The net result of this action is that a repetitive pulse is emitted from the channel
    1 line with a 20% duty cycle. The following equation relates the timer count with
    the duty cycle (DC):


    ![Images](c0215-01.jpg)


    This equation may be rearranged to find the CCRx value given a desired duty cycle:


    ![Images](c0215-02.jpg)


    In [Figure 10-2](#ch10.xhtml_ch10fig2), I have also shown an additional channel
    output with a desired 60% duty cycle but no specific count shown for the CCRx
    register. I will use the second form of the equation to solve for T[2], which
    is the count value to be stored in register CCR2:


