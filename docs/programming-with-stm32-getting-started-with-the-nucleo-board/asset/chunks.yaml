    # About the Author


    ![Images](f000V-01.jpg)


    **Donald J. Norris** has a degree in electrical engineering and an MBA specializing
    in production management. He is currently an adjunct professor teaching an Embedded
    Systems course in the College of Engineering, Technology and Aeronautics, part
    of the Southern New Hampshire University (SNHU). He has also taught many different
    undergrad and grad courses mainly in the computer science and technology areas
    at SNHU and other regional schools for the past 33 years. Don created and taught
    the initial robotics courses at SNHU both on-campus and online.


    Don retired from civilian government service with the U.S. Navy, where he specialized
    in underwater acoustics related to nuclear submarines and associated advanced
    digital signal processing systems. Since then, he has spent more than 23 years
    as a professional software developer using the `C`, `C#`, `C++`, `Python`, `Micro
    Python`, `Node.JS`, `JavaScript`, `PHP`, and `Java` languages in varied development
    projects. He also has been a certified IT security consultant for the last six
    years.


    He has written and had published seven books including three involving the Raspberry
    Pi, one on how to build and fly your own drone, a book on the Intel Edison, one
    on the Internet of Things, and one on Micro Python.


    Don started a consultancy, Norris Embedded Software Solutions (dba NESS LLC),
    which specializes in developing application solutions using microcontrollers,
    sensors, and actuators. The business has also recently completed several robotics
    projects for clients.


    Don likes to think of himself as a perpetual hobbyist and geek and is constantly
    trying out new technologies and out-of-box experiments. He is a licensed private
    pilot, photography buff, amateur extra.

