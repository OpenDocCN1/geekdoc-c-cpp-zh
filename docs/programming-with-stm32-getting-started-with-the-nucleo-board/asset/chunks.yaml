    You should be able to see that the period of the over signal is 20 ms and the
    high time for the pulse is 10 ms, which creates the 50% duty cycle as expected.
    This waveform used a prescaler value equal to `655`, which caused each timer count
    to be `10.23` `µs` as discussed above. The `Period` value was set at `1960`, which
    means the actual period time is 1960 times 10.23 µs or 20050.8 µs, equivalent
    to 20.0508 ms. That was close enough for my purposes. The `CCR1` register held
    a value of `980`, which meant the output switched at 980 times 10.23 µs or 10025.4
    µs, equivalent to 10.0254 ms. This is extremely close to a 50% duty cycle for
    all practical purposes. This demonstration proved that the PWM generation was
    working as desired.


