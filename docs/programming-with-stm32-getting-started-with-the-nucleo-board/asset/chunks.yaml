    be any value of the following `ADC_Resolution` defines:


    ![Images](c0194-06.jpg)


    There is a definite relationship between the resolution and maximum possible conversions
    that can be accomplished per second. This rule is *the greater the resolution,
    the lower the maximum conversion rate*.


    `uint32_t DataAlign;`—This value establishes how the bits in the N-Bit register
    are aligned. This parameter can be any value of the following `ADC_DATAALIGN`
    defines:


    ![Images](c0194-08.jpg)


    `uint32_t ScanConvMode;`—This value specifies the ADC mode. It is either single
    or continuous. This parameter can be either value of the following `ADC_SCAN`
    defines:


    ![Images](c0194-10.jpg)


    `uint32_t EOCSelection;`—This value sets the flag type indicating an end of a
    conversion (EOC). The flag type value also depends upon the ADC mode, which may
    be single or continuous. This parameter can be set to either of the following
    `ADC_EOC` defines:


    ![Images](c0195-02.jpg)


    `uint32_t ContinuousConvMode`—Specifies whether the conversion is performed in
    single mode (one conversion) or continuous mode for regular group, after the selected
    trigger occurred (software start or external trigger). This parameter can be set
    to `ENABLE` or `DISABLE`.


    `uint32_t NbrOfConversion;`—This value specifies the number of ranks or channels
    that will be converted within the regular group sequencer. To use regular group
    sequencer and convert several ranks, parameter `ScanConvMode` must be enabled.
    This parameter must be a number between `Min_Data = 1` and `Max_Data = 16`.


    `uint32_t DiscontinuousConvMode;`—This value specifies whether the conversion
    sequence of regular group is performed in Complete sequence/Discontinuous sequence
    (main sequence subdivided in successive parts). Discontinuous mode is used only
    if sequencer is enabled (parameter `ScanConvMode`). If sequencer is disabled,
    this parameter is discarded. Discontinuous mode can be enabled only if continuous
    mode is disabled. If continuous mode is enabled, this parameter setting is discarded.
    This parameter can be set to `ENABLE` or `DISABLE`.


    `uint32_t NbrOfDiscConversion;`—This value specifies the number of discontinuous
    conversions in which the main sequence of regular group (parameter `NbrOfConversion`)
    will be subdivided. If parameter `DiscontinuousConvMode` is disabled, this parameter
    is discarded. This parameter must be a number between `Min_Data = 1` and `Max_Data
    = 8`.


    `uint32_t ExternalTrigConv;`—This value selects the external event used to trigger
    the start of regular group. If set to `SOFTWARE_START`, external triggers are
    disabled. If set to external trigger, triggering is on rising edge by default.
    This parameter can be a value in the format `ADC_External_trigger_Source`:


    ![Images](c196-01.jpg)


    `uint32_t ExternalTrigEdge;`—This value selects the external trigger edge of regular
    group. If set to `SOFTWARE_START`, this parameter is discarded. This parameter
    can be a value in the format `ADC_External_edge_Regular` and one of the following:


    ![Images](c196-03.jpg)


    `uint32_t DMAContinuousRequests;`—This value specifies whether the DMA requests
    are performed in one shot mode (DMA transfer stop when number of conversions is
    reached) or in continuous mode (DMA transfer unlimited, whatever number of conversions).
    Note: In continuous mode, DMA must be configured in circular mode. Otherwise,
    an overrun will be triggered when DMA buffer maximum pointer is reached. This
    parameter must be modified when no conversion is ongoing on both regular and injected
    groups (ADC disabled, or ADC enabled without continuous mode or external trigger
    could launch a conversion). This parameter can be set to `ENABLE` or `DISABLE`.

