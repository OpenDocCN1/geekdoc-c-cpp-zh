    The forever loop contains a series of `if` statements that will be triggered based
    on specific counter values. The statements within the `if` statements either set
    or reset the user LED. Each counter increment takes 0.25 s to complete, which
    means that two increments will take 0.5 s. The LED will toggle at two times per
    second for the first 4 s. The second set of 4 s will toggle the LED once every
    second.


    This code format is rather lengthy, but it does trade code space for simplicity.
    It is rather easy to follow the algorithm step-by-step to determine how the LED
    is controlled using this format.


    ![Images](c0163-02.jpg)


    ![Images](c0164-01.jpg)


    ## Test Run


    I built the project and then uploaded it into the Nucleo-64 board. The user LED
    immediately began to blink at a 0.5-s rate for 4 s and then at a 1.0-s rate for
    4 s, which confirmed that the program worked as desired.


    ### Modification to the Multi-rate Program


    I changed code snippet in the above forever code to make that much more compact.
    That modification is listed below.


    ![Images](c0165-01.jpg)


    The program functioned just about the same with this modified code, which used
    the modulus operator along with a toggle method to control the LED. The code is
    much smaller than the original, but it is more complex and harder to understand
    and consequently maintain. This change highlights an interesting challenge that
    developers constantly face. This challenge is whether or not to use simpler code,
    which can take more code space versus using compact and “efficient” code, which
    is likely harder to understand and modify.


    ## Test Run


    I built the modified project and then uploaded it into the Nucleo-64 board. The
    user LED immediately began to blink at a 0.5-s rate for 4 s and then at a 1.0-s
    rate for 4 s, which confirmed the modified program worked the same as the original
    program. I did notice that the LED seemed to flicker more using this version vice
    the original. I can only attribute the flicker to the use of the `toggle` method
    versus the firm set and reset methods.


    This last demonstration completes all discussions and demonstrations that I wished
    to convey regarding interrupts and timers. This chapter really is just the tip
    of the proverbial iceberg because there is a tremendous amount of information
    on these topics that I could not cover. There are almost 2,000 pages alone in
    STM’s HAL user manual. As always, the STM datasheets, and user and reference manuals
    will be an invaluable resource to learn about the many additional features and
    functions that you can carry out with interrupts and timers.


    ### Summary


    I started the chapter discussions with the focus on timers, which are important
    peripherals because they alleviate the MCU from having to directly perform timing
    functions. I explained the five available categories of STM timers, of which there
    are three types provided on the project MCU. These are basic, general purpose
    (GP), and advanced.


    I next showed you how to configure a timer to perform a specific timing event.
    This discussion was followed by a demonstration in which the onboard LED blinked
    once per second. This demonstration did not use an interrupt, which was the focus
    of the second timer demonstration.


    In the second timer demonstration, I showed how easy it was to integrate a timing
    operation with an interrupt process. In this demonstration also the onboard LED
    blinked, but it blinked using only the interrupt process.


    The third timer demonstration showed how to restructure the interrupt process
    such that a multi-rate LED blink could be implemented. The interrupt callback
    method controlled a counter variable, which in turn controlled the actual LED
    activation within the forever loop.


    In the final timer demonstration, I changed the original forever loop code with
    a much more compact and complex version with the same functionality . I did this
    to illustrate how developers must constantly decide on how to write code, simpler
    and consuming more code space or very compact and complex, which is harder to
    understand.


    ## 8


    ## Bit Serial Communications


    This chapter covers how a MCU uses bit serial communication to bidirectionally
    transfer data between it and external devices and systems. The primary peripheral
    devices used for this function are the universal asynchronous receiver transmitter
    (UART) and the universal synchronous/asynchronous receiver/transmitter (USART).
    The principal difference between these peripherals is that the USART can use a
    synchronizing clock pulse train between nodes, while the UART is completely self-synchronizing.
    These differences are explained in more detail in the following section “UARTs
    and USARTs.”


    ### UARTs and USARTs


    [Figure 8-1](#ch8.xhtml_ch8fig1) is a block diagram showing two UARTs connected,
    where Node A is transmitting to Node B.


    ![images](fig08-01.jpg)


    Figure 8-1 UART block diagram.


    The digital pulse train between the nodes is composed of one start bit, eight
    data bits, and one stop bit. These bits all together are considered to be a single
    frame. You should note that the start and stop bits are 50% longer in duration
    then the data bits. This difference in pulse duration is how the UART distinguishes
    the start and stop bits from the data bits. The receiving node must detect the
    start bit in order to determine when the frame starts. The receiving node also
    has been configured to accept a predetermined number of data bits and whether
    or not there will be one or two stop bits. UARTs can be set to send seven or eight
    data bits as well as one or two stop bits. There is also a provision for sending
    an additional parity bit, which aids in detecting transmission errors. Often,
    parity bits are not used, especially in cases where the transmission channel is
    not noisy or transmission line delays are not present.


    The USART is a variant of the UART because an additional clock line can be used
    between nodes, as shown in [Figure 8-2](#ch8.xhtml_ch8fig2).


    ![images](fig08-02.jpg)


    Figure 8-2 USART block diagram.


    There is no need for start and stop bits to be used when two USART nodes are interconnected,
    as shown in [Figure 8-2](#ch8.xhtml_ch8fig2). The data bits are clearly synchronized
    to the clock pulses, which shortens the frame length and improves channel efficiency.
    However, seven or eight data bits may be set as well as a parity bit, as was the
    case for the UART node. It should also be obvious from the name that a USART can
    operate as a UART, if so desired.


    [Figure 8-3](#ch8.xhtml_ch8fig3) is a block diagram that shows full-duplex communication
    setups using UART and USART nodes.


    ![images](fig08-03.jpg)


    Figure 8-3 Full-duplex communications block diagram.


    Full-duplex communications means that data can simultaneously be sent and received
    between nodes. This is strictly possible because each node’s UART or USART is
    controlled by its own MCU.


    Often, it is important to assess the state of a given node that it is able to
    actively participate in a communications link. It can happen that a receiving
    node’s MCU is temporarily blocked for some reason and while a remote node’s UART
    can send data, the receiving node may not be able to process it. For this reason,
    there are protocol control lines that are provided in UART and USART hardware
    to ensure that data is sent and received when allowed. The two primary control
    lines are request-to-send (RTS) and clear-to-send (CTS). A node that desires to
    transmit data would first raise or set the RTS line. The receiving node would
    then raise or set the CTS line indicating that it is okay to send the data. This
    process is also known as request/acknowledge and is commonly used in full-duplex
    communications links. However, this protocol is really not required for the book
    projects because the project board MCU will never be blocked and the receiving
    node will typically be a PC, which will also never be blocked.

