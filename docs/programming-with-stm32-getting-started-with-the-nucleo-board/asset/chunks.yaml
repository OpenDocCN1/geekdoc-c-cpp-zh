    - `Read`: Output from one of the associated read register lines


    The GPIO pin configuration settings determine which input is used at a given time.


    Likewise, the output section has multiple ways of creating a signal output for
    the I/O pin. These are as follows:


    - `Write`: Output from an associated write register line. The output register
    also has a `R/W` control line.

    - `Alternate function`: Generated from an internal MCU peripheral.


    Note that the output control block has two MOSFET transistors connected to the
    output control circuitry, which provide for the following operations:


    - `Push-pull`

    - `Open-drain`

    - `Disabled`


    Finally, the I/O pin has programmable enabled resistors attached to the pin, which
    will allow for the following:


    - `Pull-up`

    - `Pull-down`

    - `Neither`


    This sample circuitry is replicated for every GPIO pin existing in the MCU.


    Each GPIO port has several registers attached to it, which control all of its
    pins’ behaviors by setting or resetting bits associated with the respective pins.
    [Figure 5-6](#ch5.xhtml_ch5fig6) shows the format for the GPIO port mode register
    for ports A … E and H.


    ![images](fig05-06.jpg)


    **Figure 5-6** *GPIO port mode register.*


    This register would be programmatically accessed by using the symbol `GPIOx_MODER`
    where `x` = A … E and H for the targeted port. The power-on reset values automatically
    placed in all the GPIO registers are as follows:


    - `0x0C00 0000` for port A

    - `0x0000 0280` for port B

    - `0x0000 0000` for all other ports


    The di-bit or two bit values that can be stored in a register have the following
    meanings:


    - `00`—Input mode

    - `01`—Output mode

    - `10`—Alternate function mode

    - `11`—Analog mode


    Additional GPIO registers further configure other behaviors that are associated
    with the port pins including the following:


    - Enabling `push-pull`, `open-drain`, or none (also called floating)

    - Enabling `pull-up`, `pull-down`, or none

    - Operational speed


    The next two figures concisely display all the registers involved in all GPIO
    configurations. These figures are very important and will serve as the basis for
    configuring GPIO ports for all future projects. I had to break the GPIO register’s
    listings into two separate figures due to the number of involved registers. [Figure
    5-7](#ch5.xhtml_ch5fig7) shows the first nine registers in order of their offset
    addresses to the base `MODER` address.


    ![images](fig05-07.jpg)


    **Figure 5-7** *First nine GPIO registers’ details in order of offset addresses.*


    The last nine registers in the offset address order are shown in [Figure 5-8](#ch5.xhtml_ch5fig8).


    ![images](fig05-08.jpg)


    **Figure 5-8** *Last nine GPIO registers’ details in order of offset addresses.*


    The key to reading these figures is to understand what each register is supposed
    to control, its offset address, and how individual GPIO pins are accessed in the
    register.


