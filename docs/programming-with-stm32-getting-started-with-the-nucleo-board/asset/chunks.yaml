  raw: '•   Prescaler: The division factor used to scale the master clock rate. There
    are only 16-bit prescalers used in all the timers. A 16-bit register can hold
    prescaler values ranging from 1 to 65535\. For example, a prescaler value of 40,000
    applied to an 80-MHz master clock would mean a 2-kHz clock rate would be input
    into the timer.


    •   CounterMode: Sets the count direction. The available CounterModes are as follows:


    •   TIM_COUNTERMODE_UP


    •   TIM_COUNTERMODE_DOWN


    •   TIM_COUNTERMODE_CENTERALIGNED1


    •   TIM_COUNTERMODE_CENTERALIGNED2


    •   TIM_COUNTERMODE_CENTERALIGNED3


    •   Period: This is a number that represents the maximum time to be elapsed before
    the timer counter is reloaded with this number. The maximum number is 0xffff for
    16-bit counters and 0xffff ffff for 32-bit counters. A value of 0x0 will ensure
    a timer does not start.


    •   ClockDivision: This is a bit-specific field used for setting the ratio between
    the internal timer clock frequency and a sampling clock used for digital filters.
    It is also used to set dead-time parameters. The available ClockDivision modes
    are as follows:


    •   TIM_CLOCKDIVISION_DIV1


    •   TIM_CLOCKDIVISION_DIV2


    •   TIM_CLOCKDIVISION_DIV4


    •   RepetitionCounter: Sets a limit for the number of times a timer can overflow
    or underflow. The timer update register will be set when the limit is reached.
    An event can also be raised in conjunction with the register update.


