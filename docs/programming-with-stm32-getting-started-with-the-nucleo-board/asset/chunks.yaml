    ![images](fig02-06.jpg)


    **Figure 2-6** STMCubeMX opening splash screen.


    I clicked on the “New Project” button in order to show you how this utility functions.
    A selection page will next appear with two tabs located near the upper-hand corner
    of the window. These tabs are labeled as follows:


    • MCU Selector

    • Board Selector


    I next selected the `MCU Selector` tab and scrolled down an extensive listing
    of microcontrollers until I encountered the `STM32F302R8` MCU, which is the type
    installed on the Nucleo board used in this book. [Figure 2-7](#ch2.xhtml_ch2fig7)
    shows the screen with this particular MCU selected.


    ![images](fig02-07.jpg)


    **Figure 2-7** Selecting a specific MCU with STMCubeMX utility.


    You should notice that a nice abstract of the MCU components and features appears
    in the window’s upper-top section. This information is often useful to confirm
    that the MCU does support whatever functions you intend to implement.


    The other tab labeled `Board Selector` will be the one most useful to support
    a Nucleo board demonstration project. I clicked on that tab and scrolled down
    in order to select the precise Nucleo board used in the book, which is the `Nucleo64
    NUCLEO-F302R8` board. [Figure 2-8](#ch2.xhtml_ch2fig8) shows the result of making
    this selection.


    ![images](fig02-08.jpg)


    **Figure 2-8** Selecting the NUCLEO-F302R8 board.


    A peripheral selection panel appropriate to the selected board appears near the
    window’s left-hand side. You should notice that some peripherals will have any
    empty box appearing in the `Nb` column next to the peripheral name, which indicates
    that particular peripheral is not included on the selected board. There is also
    a `Max` column located next to the `Nb` column, which shows how many peripherals
    of a particular type are available for that specific Nucleo board. An additional
    handy feature is the ability to quickly download the selected Nucleo board user
    guide by clicking on the “Load User Manual” located near the window’s lower right-hand
    corner.


    [Figure 2-9](#ch2.xhtml_ch2fig9) shows a very useful and convenient MCU pinout
    diagram for the unit installed on the Nucleo board. It shows all the pins already
    connected to various peripherals including the User LED, which I will demonstrate
    in the next chapter.


    ![images](fig02-09.jpg)


    **Figure 2-9** STM32F302RE MCU pinout diagram.


    ### ST-LINK


    The `ST-LINK` software is the next part of the toolchain, which must be installed
    in order to start developing the Nucleo board. It is an extremely important toolchain
    component because it supports the USB physical link between the board and the
    host computer and is the only means by which software can be uploaded to the board.


    The `USB ST-LINK` driver software must first be downloaded and installed into
    the host computer in order to establish a communications link between the host
    and the Nucleo board. This driver software is available from the same [st.com](http://st.com)
    website where you downloaded the STM32CubeMX utility application. The software
    part number from the ST website is `STSW-LINK009` and the technical description
    is “USB driver for ST-LINK/V2 and ST-LINK/V2-1.” This particular download is a
    signed driver suitable for Windows 7, Windows 8, and Windows 10 for both 32- and
    64-bit hosts. The downloaded driver is an archive format named `en-stsw-link009`
    and must be extracted from being run. Go into the newly created directory `en-stsw-link009`
    and click on the Windows batch file named `stlink_winusb_install` to install the
    USB driver. You will briefly see a command window showing the installation in
    progress. There is no driver software icon created, so the only way to know if
    the driver installation successfully completed is to run the ST-LINK utility.
    The ST-LINK utility installation is discussed below.


    The actual `ST-LINK/V2` utility must be separately downloaded from the [st.com](http://st.com)
    website. Its part number is `STSW-LINK004` and it is approximately 22 MB in size.
    The downloadable archive is named `en.stsw-link004`, which must also be extracted
    before being installed. Ensure that the archive has been downloaded into the STM32Toolchain
    directory. Next, go into the newly created directory `en.stsw-link004` and click
    on the `STM32-ST-LINK Utility V4.0.0.setup` application, which will install and
    configure the ST-LINK/V2 utility. You should see the utility opening screen, as
    shown in [Figure 2-10](#ch2.xhtml_ch2fig10), after you click on the ST-LINK/V2
    icon appearing on the host desktop.


    ![images](fig02-10.jpg)


    **Figure 2-10** ST-LINK/V2 opening screen.


    One of the first things you need to do is to check which ST-LINK firmware version
    is currently installed on the Nucleo board you are using. To do this, first ensure
    the ST-LINK utility is NOT running and then connect the Nucleo board to the host
    computer using a USB cable with mini-A connector that plugs into the Nucleo board.
    [Figure 2-11](#ch2.xhtml_ch2fig11) shows the screen with this particular MCU selected.


    ![images](fig02-11.jpg)


    **Figure 2-11** USB cable.


    Follow the steps below after connecting the Nucleo board to determine the current
    firmware:


    1. Open the ST-LINK utility by clicking on the desktop.

    2. Click on the `ST-LINK` selection on the horizontal menu.

    3. Click on “ST-LINK Upgrade” in the sub-menu.

    4. Click `Device Connect`.


    [Figure 2-12](#ch2.xhtml_ch2fig12) shows the result after I clicked the Device
    Connect button.


    ![images](fig02-12.jpg)


    **Figure 2-12** ST-LINK firmware version.


    Obviously, do NOT upgrade the firmware version if the reported version is more
    current than the one shown as the upgrade. This odd situation likely happens because
    the upgrade version has been hard-coded into the ST-LINK/V2 archive, which in
    turn is not updated as often as the firmware in newly manufactured Nucleo boards.
    The way around this issue that companies often use is to have a dynamic download
    in their upgrade software such that the latest firmware version is always available.
    Apparently, STM chose not to pursue this approach, which is why this situation
    happens. Hopefully, it will change its upgrade technique in the near future. In
    any case, the firmware check, in itself, confirms that the USB communication link
    between the host and the Nucleo board is working properly.


    The next step in the toolchain configuration is to set up a debugging tool named
    OpenOCD. It is not really required to install the debugger, but it may come in
    handy when you are trying to troubleshoot a program that doesn’t work the way
    you believe it should.


    ### OpenOCD15


    The Open On-Chip Debugger (`OpenOCD15`) utility was designed to upload new firmware
    onto a STM32 Nucleo board as well as support an extensive software debugging mode.
    This utility was originally created by Dominic Rath, but is now maintained by
    the STM community, including the STM company. A Windows compatible version has
    been created by Liviu Ionescu and is available at [https://github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124](https://github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124).
    [Figure 2-13](#ch2.xhtml_ch2fig13) shows the many OpenOCD15 versions that are
    available to be downloaded when you go to that website.


    ![images](fig02-13.jpg)


    **Figure 2-13** OpenOCD15 downloads.

