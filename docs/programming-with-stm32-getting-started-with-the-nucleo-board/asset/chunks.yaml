    The discussion on the demonstration project presented below will show you how
    to configure a GP timer in a polled mode, which in turn will blink an LED.


    ### Polled or Non-interrupt Blink LED Timer Demonstration


    This is the first of two demonstrations showing you how to configure the TIM2
    GP timer to control LD2, the onboard green LED. This demonstration will not use
    an interrupt, so I can focus on the discussion of how to configure a timer. The
    LED will blink at a 0.5-s rate based on the selection of prescaler and period
    values as well as the Nucleo-64 board’s preset 64-MHz high-speed clock rate.


    You should start this project using the CubeMX application by providing an appropriate
    project name. I used the name TIM2_Example1 for this project. In the Pinout view,
    you should select the internal high-speed clock as timer TIM2 clock source, which
    is shown in [Figure 7-1](#ch7.xhtml_ch7fig1).


    ![images](fig07-01.jpg)


    **Figure 7-1**   *TIM2 clock source selection.*


    Selecting the clock source also triggers the CubeMX application to include all
    the TIM2 initialization statements to be included in the new project. This step
    is vital to generate a working project.


    Don’t forget that all the other previous project creation steps are still appropriate,
    such as including only the necessary library files and ensuring that a hex file
    is generated.


    I will discuss the key parts of the project code after the below listing.


    ![Images](c0150-01.jpg)


    ![Images](c0151-01.jpg)


    ![Images](c0152-01.jpg)


    ![Images](c0153-01.jpg)


    ![Images](c0154-01.jpg)


    Most of this code is a repeat of the main.c code shown in the interrupt demonstration
    project discussed in the previous chapter. The key differences are the addition
    of a `MX_GPIO_Init` method and some new operational code required in the forever
    loop portion of the `main` method.


    The `MX_GPIO_Init` method configures the `TIM_HandleTypeDef,` a typed C struct
    with specific values to have the timer reset every 0.5 s. The struct is named
    htim2 and is both initialized and started in this method.


    The forever loop in the `main` method has code, which continually checks the timer
    count and will turn on the LED when the count reaches 150\. It will remain on
    until the count progresses to a value of 399, at which point the LED will be reset.
    These statements result in the LED being on for 0.25 s and off for 0.25 s.


    ## Test Run


    I built the project and uploaded it into the Nucleo-64 board. The user LED immediately
    began to blink at a 0.5-s rate, which confirmed the program worked as desired.
    The next step in this timer demonstration series is to implement an interrupt-driven
    version that will also blink the LED, but not require any specialized code in
    the `main` method’s forever loop.


    ### Interrupt-Driven Blink LED Timer Demonstration


    This demonstration will also blink an LED. In this demonstration, I will use an
    interrupt approach, thus eliminating any specialized code in the forever loop
    main that continually reads the timer counter value and reacts when certain values
    are reached.


    You will need to generate a new project using the CubeMX application. I named
    this project Timer_int to reflect its purpose. You will also need to select the
    timer clock source as has been done in the previous demonstration. Simply use
    the internal high-speed clock as the source, which will trigger the application
    to include all the TIM2 timer initialization and configuration code. However,
    this time you will also have to set up the timer to trigger an interrupt when
    its period is elapsed. This is easily done using the CubeMX Configuration tab.
    You should see timer TIM2 appear in the tab, but first ensure you have selected
    the clock source. Otherwise timer TIM2 will not appear. Click on the TIM2 icon
    and then click on the enable global interrupt check box. The Configuration tab
    and the enable global interrupt check box are both shown in [Figure 7-2](#ch7.xhtml_ch7fig2).


    ![images](fig07-02.jpg)


    **Figure 7-2**   *Configuring timer TIM2 interrupt functionality.*


    I will not repeat the extensive code listing previously shown, but will instead
    just present the code segments needed to implement the interrupt-based code.


    The first part is the easy one, where the forever loop is changed to a null action:


    `while(1);`


    The only other change that needs to be done is to set the timer period to 250
    to ensure the LED blinks twice a second. The timer will now interrupt at the appropriate
    interval without any special code needed to monitor real-time counter values.


    The following three statements must be added just before the forever loop in the
    `main` method:


    ![Images](c0156-01.jpg)


    The TIM2 IRQ handler method must be defined in the main.c file as follows:


    ![Images](c0156-02.jpg)


    Finally, a callback method must also be defined, which toggles the LED pin every
    time the TIM2 timer generates an interrupt:


    ![Images](c0156-03.jpg)


    ![Images](c0157-01.jpg)


    ## Test Run


    I made the modifications to the main.c file, built the project and then uploaded
    it into the Nucleo-64 board. The user LED immediately began to blink at a 0.5
    second rate, which confirmed the program worked as desired.


    ### Multi-rate Interrupt-Driven Blink LED Timer Demonstration


    This demonstration is an expansion of the previous demonstration in which the
    user LED will be repeatedly blinked at two different rates, one at 0.5 s and the
    other at a 1.0-s rate. A timer interrupt will also be used in this program but
    with a significant difference between the single- and multi-rate implementations.
    In the single-rate program, the LED is directly controlled in the callback function.
    In the multi-rate version, the callback function simply increments a counter variable,
    which is then used in the forever loop to control the LED. The incrementing counter
    variable `timCnt` causes the LED to be set or reset depending on its value. The
    following listing is the complete main.c listing. I have also added additional
    comments regarding the forever loop code snippet following the listing.


