    ## 9


    ## Analog-to-Digital Conversion


    This chapter covers a very important topic of analog-to-digital conversion. The
    devices that actually do the conversions are called analog-to-digital converters
    (ADCs). The STM line of MCU has a good variety of ADCs; however, they all operate
    and are programmed in a similar manner. There is a single ADC used in the project
    board STM32F302R8 MCU. However, it can accept analog inputs from any 1 of 15 separate
    external lines. There is a sixteenth ADC input, but it is permanently connected
    to an internal temperature sensor and is not available for any other use.


    Beginners in the embedded development sometimes question the need for an ADC peripheral.
    The answer is that measurements in the real world are taken typically using analog
    sensors that provide a continuous range of voltages that are proportional to the
    environmental parameter that is being monitored. For instance, the Analog Devices
    TMP36 temperature sensor, shown in [Figure 9-1](#ch9.xhtml_ch9fig1), provides
    a range of voltages from approximately 0.1 to 2.0 V that is directly proportional
    to a range of temperatures roughly from –40°C to 150°C. This analog voltage must
    be converted to an equivalent digital number before being able to be processed
    by the MCU. That is the role of an ADC.


    ![images](fig09-01.jpg)


    **Figure 9-1**   *Analog Devices TMP36 temperature sensor.*


    The following discussion provides a detailed explanation of how a STM ADC functions.


    ### ADC Functions


    The technique used in STM ADCs is known as successive-approximation register (SAR).
    The architecture for a SAR is fairly simple as may be seen in the block diagram,
    as shown in [Figure 9-2](#ch9.xhtml_ch9fig2).


    ![images](fig09-02.jpg)


    **Figure 9-2**  *SAR ADC block diagram.*


    An analog voltage is first inputted to a track/hold circuit. This circuit is also
    called a sample/hold circuit, which takes an instantaneous sample of the analog
    voltage and uses that sample as the value to be converted into a digital number.
    The N-BIT REGISTER block, shown in [Figure 9-2](#ch9.xhtml_ch9fig2), is set at
    a mid-scale value. This value depends upon the number of bits created in the conversion.
    For this discussion, I will use only 4 bits for the conversion, which will be
    adequate to explain the conversion process. In reality, the real STM ADC 12 bits.
    Getting back to the register will mean a mid-scale value of 1000 will be preset
    in the register. This value will therefore force the digital-to-analog converter
    (DAC) shown in the figure as N-BIT DAC to output a voltage equal to `V[REF]/2`.
    `V[REF]` is a reference voltage used by the ADC and is often the same as the supply
    or power rail voltage. That would be 3.3 V for most MCUs.


    A comparison between the sampled analog voltage held by the TRACK/HOLD (`V[IN]`)
    module and the DAC output (`V[DAC]`) is then accomplished by a COMPARATOR module
    shown in the upper right-hand portion of [Figure 9-2](#ch9.xhtml_ch9fig2). The
    COMPARATOR will output a 1 if `V[IN]` is greater than `V[DAC]`, otherwise it will
    output a 0. If a 1 is output, the most significant bit in the N-BIT REGISTER will
    be retained, otherwise it will be reset to 0.


    The SAR LOGIC module will then shift 1 bit to the right and repeat the comparison
    process. This sequence is repeated until the least significant bit (LSB) position
    is reached and processed. Once that point has been done, the N-BIT REGISTER will
    then contain the complete digital equivalent to the sampled analog input voltage.
    The SAR LOGIC module will then allow the fully converted digital value to be released
    either in a parallel or serial format.


    [Figure 9-3](#ch9.xhtml_ch9fig3) shows a complete 4-bit conversion sequence.


    ![images](fig09-03.jpg)


    **Figure 9-3**   *Four-bit conversion sequence.*

