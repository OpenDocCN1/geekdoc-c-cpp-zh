- fmt: '

    The vertical axis represents the `V[DAC]` voltage and the horizontal axis represents
    time. The result of the first conversion is to set the MSB to 0 because `V[IN]`
    is less than `V[REF]/2`. The `SAR LOGIC` module will then reset the `V[DAC]` to
    `V[REF]/4` before the next comparison. In this case, `V[IN]` is greater than `V[REF]/4`
    and the bit one position to the right of the MSB will be set to 1. Next, the `SAR
    LOGIC` module will split the difference between `V[REF]/2` and `V[REF]/4`, which
    is `3V[REF]/8`. This new comparison results in a 0 being output from the `COMPARATOR`
    module. In actuality, the `SAR LOGIC` module changes the `VDAC` voltage in some
    multiple of `V[REF]/2⁴` or `V[REF]/16` for each comparison operation. This results
    in the converging step-like waveform, as shown in [Figure 9-3](#ch9.xhtml_ch9fig3).
    Some multiples of the step value are either added to or subtracted from `V[DAC]`
    depending upon the result of the previous bit comparison. In this case the resulting
    digital value held by the `N-BIT REGISTER` is 0101, which is 5 in a decimal format.
    This all makes sense if you equate `V[REF]` to 16 where each step in the `V[REF]`
    range is 1. The `V[IN]` line in the figure would then be approximately at the
    5 level.


    I believe you can see that the SAR process converges fairly rapidly to a final
    value. In this case, it took four comparisons, while a 12-bit ADC would take 12
    comparisons. The good news is the `SAR LOGIC` module operations are all done in
    firmware with no MCU instructions required other than to start the conversion.


