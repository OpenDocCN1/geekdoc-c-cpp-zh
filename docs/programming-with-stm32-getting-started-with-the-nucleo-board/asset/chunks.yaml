    The CubeMX application generated this code when the DAC peripheral was enabled
    during the project creation process. There is really nothing remarkable that is
    happening in this function other than the output buffer is enabled and any DAC
    trigger is disabled.


    The functional code that produces an output waveform is located in the forever
    loop.


    ![Images](c0268-04.jpg)


    There are two while loops, one counts up and other counts down. The `HAL_DAC_SetValue`
    method causes the DAC to output channel 1 with a 12-bit value based on the index
    `i`.


    ### Test Results


    [Figure 11-7](#ch11.xhtml_ch11fig7) is a screen shot from `PA4`.


