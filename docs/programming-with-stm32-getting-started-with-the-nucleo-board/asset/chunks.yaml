  trans: '

    本章从介绍 `STM32CubeMX` 应用开始，在本书的剩余部分，我将其简称为 `CubeMX`。该应用程序包含四个主要部分或标签页，我对它们进行了详细讨论。`CubeMX`
    的作用是初始化和配置 `STM MCUs` 或相关的开发板，包括自动生成 C 代码以支持所需的配置。自动生成的 C 代码并不适用于任何嵌入式应用程序，那部分仍然是开发者的责任。


    我创建了一个通用的 `CubeMX` 项目，它的作用除了为自动生成的 C 代码提供平台外没有别的，该代码支持特定 `Nucleo` 开发板的外设、时钟、通信通道和中断。我还展示了
    `main.c` 文件中的代码，并简要讨论了其内容及其操作。


    接下来，我讨论了 `ARM CMSIS`，大多数 ARM 供应商都试图遵循该标准。我还展示了自动生成的 C 代码是如何与 `CMSIS` 框架相关的。


    我向你们演示了如何构建一个无法运行的项目，以证明工具链按预期工作。`CubeMX` 应用创建了所有的 C 代码，因为该项目不需要开发者负责的代码。使用 `ST-LINK`
    应用程序将 hex 文件下载到目标平台。


    本章详细描述的过程将在书中剩余的所有项目中重复，并将添加专门的代码来执行所有所需的功能。


    # 4. STM 项目开发


    在本章中，我将演示如何使用第 2 章中创建的工具链和第 3 章中描述的 `CubeMX` 应用使用 `STM Nucleo` 板构建 C/C++ 语言项目。我将使用
    C/C++ 语言来创建这些项目的源代码。如果读者对 C/C++ 语言比较熟悉，将有助于更好地理解整个过程，但并非强制要求。我将深入讲解“Hello World”项目的示例代码，帮助那些不太精通
    C 语言的读者理解源代码中发生了什么。


    ## Hello World 项目


    传统的惯例“Hello World”程序是初学者在开始学习计算机语言时几乎总是编写的程序。在嵌入式世界，这个程序已经演变为闪烁 LED，而不是在显示器屏幕上显示“Hello
    World!”。我将逐步演示如何使用连接到运行第 2 章所建立的工具链的 Windows 10 主系统的 `Nucleo64-STMF302R8` 演示板创建一个“Hello
    World”项目。除非你阅读了之前的章节并创建了可用的工具链，并且熟悉使用 `CubeMX` 应用，否则你从本章中获益有限。


    ## 创建 Hello Nucleo 项目


    创建项目的第一步是打开 `CubeMX` 应用。应用程序启动后，点击 `New Project` 并点击 `Board` 标签。选择你使用的 `Nucleo`
    板。在我的情况下，它是 `NUCLEO-F302R8` 板，如图 4-1


    **图 4-1** 新的 C/C++ 项目对话框。


    接下来，双击开发板选择行将显示如图 4-2


    **图 4-2** 项目引脚分配屏幕。


    下一步是点击 `Project`菜单项，这将弹出如图 4-3


    **图 4-3** 项目下拉菜单。


    点击 `Generate Code` 选项将出现如图 4-4


    **图 4-4** 项目设置对话框。


    你需要在 `Project Name` 框中提供一个名称。它应该与预期的项目目的相关。同时，确认 `Project Location` 以及 `Toolchain
    Folder Location`正确。


    从 `Toolchain/IDE` 组合列表中选择 `MDK-ARM V4` 非常重要。如果不选择 `MDK-ARM V4`，将无法创建项目。


    默认的 `Linker Settings` 应该没问题，`Mcu and Firmware Package` 以及 `Firmware Package Name
    and Version` 也应该与图中所示。


    最后，确保 `Use Default Firmware Location` 旁边的复选框已选，否则 IDE 将无法创建二进制文件。


    **不要**点击 `Ok` 按钮，而是点击对话框顶部的 `Code Generator` 标签。这应该显示如图 4-5 所示的 `Project Settings/Code
    Generator` 对话框。


    ![images](img/fig04-05.jpg)


    **图 4-5** 项目设置/代码生成对话框。


    `Copy all used libraries into the project folder` 旁的单选按钮最初会被选中。你应该点击 `Copy only
    the necessary library files` 旁的单选按钮，以减小整个项目的大小。忽略此更改不会影响最终二进制文件的大小，但会不必要地增大项目文件夹。现在你可以点击
    `Ok` 按钮让 CubeMX 自动生成代码。


    稍短后，将出现一个成功的代码生成对话框，如图 4-6 所示。


    ![images](img/fig04-06.jpg)


    **图 4-6** 成功生成代码对话框。


    点击 `Open Project` 按钮将打开 `Keil IDE`，新项目将显示在左侧的 `Project` 格中，如图 4-7 所示。


    ![images](img/fig04-07.jpg)


    **图 4-7** 带有新项目的 Keil IDE。


    图 4-7 中出现的错误对话框在上一章中讨论过，它是由于 IDE 没有目标硬件的引用。可以通过进入 `Device Database` 轻松解决，如第 3
    章所述。解决后，点击 `+` 框展开 `Project` 目录。展开后，点击 `Application/User` 子目录旁箭头显示该目录下的文件。最后，双击
    `main.c` 文件，将显示以下代码。注意，此代码与第 3 章中所示相同。然而，我这样做是为了提供正确的上下文，以便在原本无法运行的程序中添加某些功能。此外，注意大量的
    STM 免责声明注释已最小化以节省代码空间。


    ![Images](img/c0092-01.jpg)

    ![Images](img/c0093-01.jpg)

    ![Images](img/c0094-01.jpg)

    ![Images](img/c0095-01.jpg)

    ![Images](img/c0096-01.jpg)


    我选择使用斜体数字注释来对代码提供说明，只需引用代码和对应的斜体数字即可跟进讨论主题。


    *[1]*—使用 `/* ... */` 或 `//` 表示注释行，编译器会忽略这些内容。第一种格式允许多行注释，而第二种仅用于单行。


    '
- fmt: '

    2]—The `#` symbol indicates a compiler instruction or directive immediately follows.
    In this case the statement is `#include “main.h”` which instructs the compiler
    to use a header file named `main.h`. This particular header file is stored in
