    # Summary


    This is an introductory chapter on the STMicroelectronics (STM) Nucleo-64 microcontroller
    (`MCU`) development board. This board features the model `STM32F302R8` `MCU`,
    which runs at 72-MHz clock rate and has 64-KB flash and 16-KB SRAM memories.


    I first reviewed the differences between a microcomputer and a `MCU`. A review
    of the principal components that make up a `MCU` followed next. The first component
    discussed was the `ARM Cortex M-4` 32-bit microcomputer. The next was the memory,
    where I briefly explained how the `Cortex M-4 Harvard Architecture` speeds up
    the processing cycle. The last component portion was an extensive discussion of
    the `MCU peripherals`.


    I carefully explained how the `Arduino` and `ST Morpho` connectors were set up
    on the board using a series of detailed tables with additional comments. Next
    followed some peripheral discussions concerning an interrupt controller, timers/counters,
    and bit-serial interfaces.


    The chapter finished up with a thorough discussion of the many board options available
    with which you can customize the `Nucleo-64` development board to suit your own
    situation.


    # 2 STM MCU Software


    This chapter explores the software side of `MCU` development. The discussion on
    `MCU` hardware in `[Chapter 1](#ch1.xhtml)` becomes largely irrelevant without
    a thorough discussion on how to use it, which is the role of software. It would
    be helpful to provide a bit of prospective as it pertains to the software situation
    as related to `STM MCUs`.


    ## Open-Source versus Commercial Proprietary Software


    The first thing you need to realize is that `STM` is a multibillion dollar, for-profit
    company and must make a profit to stay in business as well as satisfy its stakeholders.
    Although `STM` supports the maker community and open-source development, it has
    fostered commercial software suites to be the primary means by which software
    is developed for their `MCUs` and other product lines. This means it is up to
    each individual maker and/or open-source developer to decide whether or not to
    craft your own open-source software toolchains or use a proprietary solution.
    I discuss both approaches and you will shortly see what my decision was and why
    I made that decision.


    The available `STM MCU` commercial toolchains can be used with very little fuss
    but they are very expensive, with all of them costing more than $1,000 for a single
    license. Some software suppliers such as `Keil` and `IAR` do provide evaluation
    versions of their software freely available for those developers who want to try
    their suites out before purchasing. The only constraint with these versions is
    that they limit the uploaded `MCU program` size to 32 KB. While this limit might
    appear to be small, in reality, it is more than adequate for almost all projects
    the maker community would develop. I used the `Keil` evaluation `IDE` for all
    the book project code development. I have found that using this particular `IDE`
    makes developing code quite easy and with little issues that happen when attempting
    to develop using purely open-source tools. I want to be very clear that I am not
    recommending that you avoid the open-source approach, but simply stating that
    I have attempted both approaches and determined that using a proprietary `IDE`
    was much simpler and almost always worked the first time.


    ## Bare Metal Development


    The phrase “bare metal development” is a fairly recent addition to the developer’s
    lexicography. It generally is taken to mean any low-level method of programming
    related to a specific hardware set. It is derived from the phrase “programming
    on the bare metal.” This type of development has been around since the advent
    of `MCUs` in the 1970s, when it was the only type available. It wasn’t called
    `bare metal development` at that time, just embedded development or simply `MCU
    programming`. It would be helpful to relate some history to understand the present
    state of `MCU` software development.


    # Brief History of MCU


    The Texas Instruments (TI) `TMS1000` is often called the `first microcontroller`.
    It was released in 1971 and had read-write memory (`RAM`), read-only memory (`ROM`),
    an embedded 8-bit processor, and an on-board clock system. Previous to this chip,
    other processors relied on external memory and clock peripherals for those functions.
    `TMS1000` was used in early `TI` calculators as well as some gaming consoles.
    Meanwhile, Intel designed and produced `Intel 8048`, which too had on-board `RAM`
    and `ROM`, as well as an 8-bit processor, clock circuitry, and some `GPIO` pins
    for direct peripheral interface. This chip turned out to be immensely popular,
    especially with computer keyboard manufacturers. There were millions of `8048s`
    used in keyboards and it soon became a big revenue generator for Intel.


    `TMS1000` and `Intel 8048` were likely programmed using the `C` language along
    with a cross-compiler, which is a software application running on a host `PC`
    that produces raw binary code suitable for use with the embedded `MCU processor`.
    The early `MCUs` used a masked `ROM` to store the program. This meant the program
    was first developed, tested, and then converted to a mask that was used in the
    `MCU` wafer production process. There was no ability to reconfigure a program
    in the field. As you might expect, the costs to create a masked `MCU` was very
    high and developers had to get it right the first time or risk very high retooling
    costs to change the program.


    In the 1980s, `MCUs` started to appear with `EPROMs`, which stored programs that
    could be changed once the `MCU` was exposed to ultraviolet (`UV`) light. `[Figure
    2-1](#ch2.xhtml_ch2fig1)` shows `Intel 8751`, which is `UV` reprogrammable version
    of the immensely popular `8051` `MCU`.


    ![images](fig02-01.jpg)


    **Figure 2-1**  **Intel 8751 MCU.*


    If look carefully at the figure, you may see the outline of a sticker that once
    was applied to cover the window. This covering was important to prevent ambient
    sunshine from inadvertently erasing the `EPROM`. The `UV EPROM` eventually gave
    way to the `EEPROM`, which is an electrically erasable `ROM`. The `Intel 8052`
    is a `MCU` version that uses an `EEPROM`. This chip became hugely successful in
    the embedded development community with many millions, if not billions, being
    employed in a wide variety of systems, devices, and other embedded applications.
    In fact, Intel `8052` and certain variants are still being manufactured today.
    At one time, the `805x` family was by far the world’s most widely used `MCU` line.
    However, I now believe smartphone `MCUs` have overtaken the `805x’s` as the most
    widely used `MCUs`.


    I include `[Table 2-1](#ch2.xhtml_ch2tab1)`, which compares similar features between
    an `8052` and the `STM32F302R8` `MCUs`. This table starkly shows huge improvements
    in technology in this field.


    ![images](tab02-01.jpg)


    **Table 2-1**  *Comparison between an 8052 and STM32F302R8 MCUs*


    Just remember that in its day, the `8052` was considered a very powerful `MCU`.
    In the 1990s, I had the privilege of working with a new product development team
    that used an `8052` development board as its main controller. I programmed the
    `MCU` using the `C` language. Fortunately for the team and myself, we could reprogram
    it very easily as bugs in the product were discovered and resolved.


