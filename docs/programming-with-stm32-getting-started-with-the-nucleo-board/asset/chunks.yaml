    ### Memory-Mapped Peripherals


    STM MCU peripherals are controlled and data is transferred using addresses within
    a 32-bit range. This is known as memory mapping because it makes no difference
    from a programming perspective whether it is communicating with a memory location
    or a peripheral register. The 32-bit address range is usually represented by eight
    integer digits, meaning the total possible range of locations is `0x0000 0000`
    to `0xFFFF FFFF`. Note that the hex number is preceded by a `0x` and a space is
    paced after four of the leading hex digits. The `0x` is a common programming construct
    indicating that the number is in a hex format and the space between the two hex
    number groups is just to make the number more readable. This address format is
    also used throughout the STM documentation.


    [Figure 5-2](#ch5.xhtml_ch5fig2) shows the major blocks that constitute the entire
    32-bit address range.


    ![images](fig05-02.jpg)


    **Figure 5-2** *Complete 32-bit STM address range.*


    Also shown in [Figure 5-2](#ch5.xhtml_ch5fig2) are two breakout blocks, which
    detail the core memory locations as well as the peripheral/bus locations. I will
    next briefly discuss the core memory locations, which are important in their own
    right, but not very relevant to the peripheral address locations.


    ### Core Memory Addresses


    [Table 5-1](#ch5.xhtml_ch5tab1) shows the types of memory and their preassigned
    memory addresses.


    ![images](tab05-01.jpg)


    **Table 5-1** *STM Core Memory Address Ranges*


    One question that many readers might be pondering is how a PC can handle 8, 16,
    or even 32 GB of SRAM with only 32 bits of addressing capability? The answer lies
    in using both an operating system designed for extended memory accesses and a
    hardware unit known as a memory management unit (`MMU`). All the major PC OSs
    such as Windows, OSX, and Linux have extended memory functionality built-in that
    allows for 32-bit addressing to extend into multiple blocks or pages. You could
    think of using a 4-bit register, where each bit would activate a particular block
    or page. Therefore, bit 0 would allow access to all the base addresses starting
    at `0x0000 0000`, while bit 1 would allow addressing to virtually start at `0x0001
    0000 0000`. Of course, there are only 32 real bits being used, but the OS handles
    the addresses as if they started one location beyond `0xFFFF FFFF`. This 4-bit
    register can be thought of as being part of the `MMU`. Four bits means that a
    maximum of 64 GB can be handled in a 32-bit PC, which coincidentally is often
    the maximum SRAM that may be installed in such a PC. Of course, all practical
    physical memory limitations are relieved when a 64-bit system is used, but that
    requires an expensive CPU and additional energy requirements.


    The preceding discussion is not applicable to a typical STM MCU because memory
    is quite constrained and vast amounts are not needed to handle typical embedded
    applications. I do want to mention that `STM32F302R8` does incorporate a memory
    protection unit (`MPU`). The `MPU` is not a `MMU`, but is provided to manage CPU
    memory accesses such that one task will not accidentally corrupt or conflict with
    another task’s memory accesses. Memory can be arranged in up to eight areas with
    each area sized between 32 B and 4 GB, the last comprising the whole addressable
    memory range. The `MPU` is normally controlled by a real-time operating system
    (`RTOS`), which has an API contained within the `CMSIS`, which has been introduced
    in the last chapter. I will not be using the `MPU` for any of the book projects.
    You should consider its use only for the most safety-critical or mission-essential
    applications. Think of it being used in automotive or flight safety systems.


