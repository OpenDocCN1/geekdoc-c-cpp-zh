    **Figure 11-10**   *Sine wave spectrum display.*


    The average total harmonic distortion (THD) was measured at only 1.372%, which
    is very low for this type of signal generation. The third harmonic at 200 Hz was
    the highest distortion component and was measured at –42 dBu, which is less than
    one-hundredth of the primary frequency’s amplitude.


    I also experimented by changing the timer TIM6 period to determine the highest
    possible output frequency. I determined that a minimum period value of 105 created
    a sine wave frequency slightly over 3 kHz. Any value lower than that period value
    simply caused the DAC to remain at steady high level.


    The last point I will make, which is the same one that I have often repeated,
    is that the core Cortex-M processor is not involved with this signal generation
    once it has been configured, initialized, and started. Notice that the forever
    loop in the main method is completely devoid of any functional code because the
    signal generation is completely being accomplished by a combination of hardware
    and firmware. This approach is the essence of efficient and effective embedded
    design.


    ### Summary


    This is a combination chapter that explains both direct memory access (DMA) and
    the digital-to-analog converter (DAC). I chose this combination because the DAC
    is an ideal peripheral to use with DMA operations.


    The first section explains the theory behind DMA and how a DMA controller effectively
    implements this operational mode.


    The next discussion focuses on how to use the HAL framework to both configure
    and initialize the MCU for DMA operations. I presented a detailed discussion concerning
    two C structs that are critical for setting up the DMA mode.


    The first demonstration simply has the USART2 peripheral sending a character string
    to memory using the DMA mode. A complete program listing was provided with all
    the important details concerning DMA operations highlighted.


    The next section introduces the DAC and provides a brief background on how it
    functions. This is followed by a section on how to use the HAL framework to configure
    and initialize this peripheral.


    The second demonstration illustrates how to have the DAC generate a triangular
    waveform using functional code placed in the main method’s forever loop. This
    demonstration was purposefully designed to be computationally “heavy” in anticipation
    of the next demonstration.


    The third and final demonstration shows how the DAC could generate a relatively
    “pure” sine wave using a DMA mode and then being periodically triggered by a timer.
    The initial signal was set at a 66-Hz frequency, but I eventually was able to
    generate sine wave signals slightly exceeding 3 kHz. The signal waveforms were
    generated without any core processor involvement other than the initial configuration.


