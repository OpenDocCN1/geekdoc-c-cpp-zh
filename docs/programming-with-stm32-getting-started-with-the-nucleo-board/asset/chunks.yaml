    ## ADC Conversion Modes


    There are few common ways to use one or more input channels with an ADC. These
    ways are known as conversion modes and I will cover the most popular conversion
    modes next.


    ### Single Channel/Single Conversion


    This is the absolute simplest mode. [Figure 9-4](#ch9.xhtml_ch9fig4) shows a block
    diagram for this mode.


    ![images](fig09-04.jpg)


    **Figure 9-4**   *Single channel/single conversion ADC mode block diagram.*


    In this mode, the ADC takes or more accurately samples the analog voltage present
    on a selected input line or channel and converts that voltage to a digital number.
    The number is then read from the ADC and used in any application that requires
    it.


    ### Multi-channel Scan/Single Conversion


    This mode is a little more complex than the previous one. In this mode, multiple
    input analog lines are sampled and the sampled voltage levels are then converted
    into digital numbers. The block diagram for this mode is shown in [Figure 9-5](#ch9.xhtml_ch9fig5).


    ![images](fig09-05.jpg)


    **Figure 9-5**   *Multi-channel scan/single conversion ADC mode block diagram.*'
