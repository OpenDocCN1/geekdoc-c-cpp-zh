    series of `CCRx` values that will generate a respective duty cycle given that
    value. Note that the small duty cycles shown at the table’s beginning are important
    for the servo control demonstration. This table is based upon a 50 Hz or 20 ms
    period PWM signal.


    ![images](tab10-01.jpg)


    **Table 10-1**   *CCRx Values and Corresponding Duty Cycles and Pulse High Times*


