    ## 10 脉冲宽度调制 (PWM)


    本章涉及脉冲宽度调制 (`PWM`)，这是一种由 `MCU` 易于生成的用于多种目的数字信号。这些目的通常包括控制以下内容：


    - 控制以下内容：

    - 电机速度

    - LED 亮度

    - 舵机位置

    - 扬声器音量

    - 信号频率


    `HAL` 框架通过各种定时器支持 `PWM` 功能。


    ### 通用定时器 PWM 信号生成


    PWM 信号是通过高级或通用 (`GP`) 定器生成的。本节描述了如何实现。


    信号生成相对简单，涉及使用向上计数模式的定时器。图 10-2 的顶部部分显示定时器从 0 计数到 16 位最大计数 65535。每个通用定时器有一组称为捕获寄存器
    (`CCRx`)，用于存储数值。当向上计数达到该数值时，会产生一个取决于定时器的事件。如果定时器设置为直接输出（如 `PWM` 模式所示），则事件将开启与
    `CCRx` 关联的通道。图 10-2 中，计数达到 52428 时通道 1 置高。直到定时器达到最大计数 (`MAX`) 并溢出或重置（如顶部波形所示）。此操作的最终是从通道
    1 发出一个占空比为 20% 的重复脉冲。以下方程建立了定时器计数与占空比 (`DC`)的关系：


    ```

    DC = (CCRx / MAX) * 100

    ```


    首先注意的是信号是重复的，频率为 50 Hz 或等效周期。另一个重要特征是占空比，它是信号处于高电平时间的百分比。占空比通常被认为是 `PWM` 的主要属性。以下方程可以重新排列，以便在给定占空比的情况下找到
    `CCRx` 值：


    ```

    CCRx = (DC * MAX) / 100

    ```


