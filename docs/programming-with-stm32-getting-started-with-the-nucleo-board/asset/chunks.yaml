    ![images](img/fig03-07.jpg)


    **图 3-7** *PC13 复用引脚映射。*


    在选定引脚上右键点击，所有可备用引脚都会立即标记为蓝色。在图 3-7 中，备用引脚为`PA13`和`PB13`，但前提是备用引脚未处于复位状态。如果向主引脚布线不方便，使用复用映射可以优化电路板布局。当
    `CubeMX` 检测到引脚布局冲突时，它会尝试通过将外设功能分配给备用引脚来自动解决冲突。然而，通过在选定的 MCU 引脚上放置逻辑“推钉”，可以将所需的外设功能锁定在某个引脚上。这些“推钉”在图中清晰可见。锁定这些引脚会防止
    `CubeMX` 启用已锁定引脚的备用映射。被锁定无法映射的引脚也被标记为橙色。


    ## 集成外设 (IP) 树形面板


    图 3-6 左侧显示的 IP 树形面板允许 `CubeMX` 用户能够方便地启用或禁用可能分配给 MCU 引脚的外设。树形面板还允许用户启用某些软件中间件库。树列表使用各种颜色的图标和文本来指示外设的状态和配置。图
    3-8 显示了与每个外设相关的这些彩色图标及其文本含义。此图摘自 `CubeMX` 用户手册，我敦促感兴趣的读者下载并保存。这本 261 页的 PDF 手册中包含了丰富的信息，我没有足够的空间对其进行详细介绍。


    ![images](img/fig03-08.jpg)


    **图 3-8** *树形面板 IP 图标及文本描述。*


    ### 时钟配置选项卡


    STM32 系列 MCU 使用了一种非常灵活的方法来配置 MCU 运行所需的各种时源。这些时源同时适用于 MCU 核心功能和大多数外设功能。时源及相关的锁相环（`PLL`）在图
    3-9 中以图形形式显示，当你点击时钟配置选项卡时，它将会显示。


    ![images](img/fig03-09.jpg)


    **图 3-9** *时钟配置 GUI。*


    图 3-9 乍看起来可能有些望人生畏，但不要绝望，因为它实际上并不复杂，尤其是是在你交互几次之后。与普通的 8 位 MCU 相比，STM32 的时钟源能力非常强大且灵活。


    首先必须考虑的是基础时源。STM32 MCU 系列使用了高速时钟（`HSE`）和低速时钟（`LSE`）。这些时钟可以从内部或外部进行供电。在本书的所有项目中，这些时钟将使用内部源；然而，如果根据需要，其中一个或两者都可以使用外部源。如果需要使用外部时钟，必须首先启用相应的时钟输入引脚。这是通过返回引脚视图（Pinout
    view）中的 IP 树并展开 `RCC` 部分完成的。图 3-10 显示了这些引脚的典型配置。


    ![images](img/fig03-10.jpg)


    **图 3-10** *RCC 引脚配置。*


    一旦启时钟输入引脚，必须返回时钟配置选项卡并完成时源配置。


    不需要更改任何时钟配置，因为它们在默认状态下已完美支持书中的所有项目。但我想提醒可能考虑对 MCU 进行超频的读者。超频是一种常见的黑手段，用户有时会尝试借此从计算机系统中“获得”一些感知上的性能提升。超频在游戏系统中尤为常见，因为人们认为高时钟频率可以提高显示帧率和游戏性能。虽然对于某些游戏系统确实如此，但由于芯片散热量大幅增加导致的过度压力会显著缩短处理器的寿命。游戏系统还采用了复杂的冷却子系统，而这在
    STM Nucleo 板系列中是不存在的。结论是：**不要**超频，因为那绝对会导致 MCU 过热并导致其过早失效。


    ### 配置视图选项卡


    配置视图（Configuration View）提供了所有软件可配置组件的概述，包括 GPIO、外设和中间件。如图 3-11 所示，那里有可点击的按钮，允许对各种组件进行配置。`CubeMX`
    应用程序会自动创建支持所需配置的底层 C/C++ 代码。


    ![images](img/fig03-11.jpg)


    **图 3-11** *配置视图。*


    图 3-11 中有带有颜色的图标和文本，其方式与 IP 树面板视图显示的内容非常相似。图 3-12 详细说明了这些图标和文本应用于配置视图时的含义。


    ![images](img/fig03-12.jpg)


    **图 3-12** *配置视图图标及文本描述。*


    ### 功耗计算器视图选项卡


    点击剩余的选项卡将显示未初始化的功耗计算器界面，如图 3-13 所示。


    ![images](img/fig03-13.jpg)


    **图 3-13** *功耗计算器 (PCC)。*


    此 PCC 允许你计算以下内容：


    - 平均电流消耗

    - 预期电池寿命

    - 平均 DMIPS（每秒 Dhrystone 指令）：本质上使用标准软件测试衡量 MCU 效率

    - 最高环境温度（TAMAX）：根据 MCU 封装类型、内部功耗和预设的 105°C 结温计算


    `CubeMX` 用户手册详细说明了一系列操作步骤，引导你进行逐步分析，以确保所选电池适用于你的应用程序。我不会使用 PCC，因为书中所有的项目都使用电源。


    ### 使用 CubeMX 创建示例项目


    现在是讨论如何使用 `CubeMX` 应用程序创建新项目了。首先启动应用程序，然后点击新项目（New Project）。将显示如图 3-14](#ch3.xhtml_ch3fig14)所示的新项目界面。


    ![images](img/fig03-14.jpg)


    **图 3-14** *新项目启动界面。*


    点击板卡（Board）选择选项卡，显示板卡选择界面。像我在图 3-4 中一样选择你的项目板。双击板卡选择将弹出 STM32F-302R8Tx MCU 的引脚布局视图，如图
    3-5 所示。


    现在你需要点击菜单栏上的项目（Project）标题为你的新项目命名。从下拉菜单中选择设置（Setting），如图 3-15 所示。


    ![images](img/fig03-15.jpg)


    **图 3-15** *项目下拉菜单。*


