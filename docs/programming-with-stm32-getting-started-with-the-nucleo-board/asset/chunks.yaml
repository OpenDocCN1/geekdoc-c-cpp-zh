    levels, which means there can be a maximum of 256 priority levels. I cannot conceive
    of a practical embedded system that would ever need anywhere that many interrupt
    priority levels. Such a system would likely be impossible to design, let alone
    implement.


    It is time to now return to a detailed discussion of the interrupt process as
    I have already introduced the NVIC.


    ### Interrupt Process


    There a few definitions to be set forth before proceeding with this section:


    •   Arm: Allows a hardware device to trigger an interrupt


    •   Disarm: Disallows a device to trigger an interrupt


    •   Enable: Allows the interrupt process


    •   Disable: Disallows the interrupt process


    Enabling and disabling interrupts are easily accomplished in the C language by
    using the `EnableInterrupts()` and `DisableInterrupts()` methods, respectively.
    A potential interrupt source can trigger an interrupt provided that interrupts
    are enabled and a specific trigger bit associated with that potential source has
    been set in the appropriate NVIC control register. This is considered arming a
    specific device. Conversely, resetting that same register trigger bit will be
    considered disarming the device. There is one important deviation from this procedure
    when considering the SysTick interrupt. It has no enable bit because of its importance
    in having its events always recognized by the MCU.


    Interrupt priorities are established by setting appropriate bits in the NVIC BASEPRI
    register. For example, if a specific interrupt is set at a priority level equal
    to 3, then any interrupt with priority level of 0, 1, or 2 will interrupt the
    level 3 interrupt. However, if the BASEPRI register is set to 0, then the interrupt
    priority feature is disabled and all interrupts are processed as they are received
    by the NVIC.


    There are five preconditions that must be true before an interrupt can be generated:'
