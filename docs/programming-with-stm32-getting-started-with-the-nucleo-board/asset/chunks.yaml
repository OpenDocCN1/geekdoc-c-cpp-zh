    从定义上立刻看出，MCU（微控制器）包含一个微处理器，微处理器有时被称为微计算机。它还必须同时包含动态（或易失性）内存和非易失性（或静态）内存，后者存储运行微处理器所需的任何程序或脚本。最后，设计中总是加入了外设，用于数字信号的输入和输出。根据
    MCU 必须满足的需求，通常还有额外的外设，如定时器、中断控制器、串行数据端口以及各种其他外设。


    我将在下文中讨论所有主要的 MCU 组件，以就理解 MCU 如何工作提供坚实的背景知识。以下的大部分解释都基于 STM 在其微控制器上提供的海量信息。STM
    提供如此大量信息的原因是为了让工程师/软件开发人员能够访问所需的所有数据，以便将 STM 产品集成到原始设备制造商（OEM）的设计和产品中。这种方法从根本上不同于创客开发板和产品供应商的方法，例如
    `Arduino`、`Raspberry Pi`、`BeagleBone` 等。对于后者，开发板文档侧重于如何在项目中使用开发板。而 STM 的数据则非常具体，描述了如内存芯片与处理器总线之间的纳秒级定时脉冲等项目。这正是为什么某些
    STM MCU 数据表的长度超过了 1,100 页的原因。幸运的是，我在书中将使用的主要 STM MCU 数据表仅有 138 页。我将在本章晚些时候提供可以下载该数据表的网站。


    ## STM Nucleo 开发板


    像 `STM` 这样的 MCU 制造商早已意识到，他们不能向潜在客户提供芯片，因为大多数客户没有方法有效评估这些芯片在其产品中的潜在用途。这就是制造商提供相对低成本的评估和演示板的原因，这些开发板配备了所有代表性的
    MCU，并已准备好运行。STM 提供了一系列此类开发板，称为 `Nucleo` 系列。我将在书中的项目中使用相当简单的 `Nucleo-64` 开发板。STM
    实际上通过将 `Nucleo` 系列营销为适合创客项目使用的开发板，已经拥抱了创客社区。这些开发板非常便宜，通常在 10 到 15 美元之间，这让我相信 STM
    正在通过实际上补贴开发板的制成本来在创客社区中立足。无论如何，这对于创客和爱好者来说都是一件幸事，我们应该拥抱它。


    图 1-1 显示了本书编写时提供的三种基础 Nucleo 开发板。


    ![images](img/fig01-01.jpg)


    **图 1-1** 三种基础 Nucleo 开发板。


    开发板从左到右分别命名为 `Nucleo-32`、`Nucleo-64` 和 `Nucleo-144`，如图图 1-1 获取。实际处理器电路是 `STM MCU`
    的一部分，因为 STM 从 `ARM Corporation` 购买了知识产权 (IP)，以便将其集成到其芯片中。然而，对于所有实际用途，`ARM` 处理器是使用
    `ARM Corporation` 发布的工具和技术编程的，以支持其处理器 IP。这种区别对我们的情况无关，因为用于书中项目的软件工具都已由 STM 精心制作和测试，可以无缝协同工作。任何许可问题都已解决，没有打扰终端用户。


    以下列表包含了针对感兴趣读者的 `Cortex M-4` 处理器的一些重要规格：


    - 全功能 `ARMv7-M` 指令集，针对嵌入式应用进行了优化

    - 浮点单元 (`FPU`)

    - 低功耗 32 位处理器

    - 内存保护单元 (`MPU`)

    - 嵌套向量中断控制器 (`NVIC`)

    - 跟踪（Trace）、断点和 JTAG 能力

    - 高级微控制器总线架构 (`AMBA`)

    - 高级性能总线 (`AHB5`, `AHB`-`Lite`)


    `Cortex M-4` 处理器的功能远比 278 页用户指南建议的要多。我也向真正想要深入研究此处理器的读者推荐 Joseph Yiu 的书 *The Definitive
    Guide to ARM*® *Cortex*®*-M3 and Cortex*^®*-M4 Processors* 第三版。


    图 1-2 是 `Cortex M-4` 处理器的框图，显示了所有列出的项目及更多。


    ![images](img/fig01-02.jpg)


    **图 1-2** ARM Cortex M-4 框图。


    STM 负责图 1-2 所示框之外所有组件的设计和实现。当然，STM 的设计必须符合 `ARM` 处理器的规范。图中缺失的一个项是时钟输入。缺失的原因是该框图来自
    `ARM Cortex M-4` 用户指南，而时钟电路是 MCU 设计者 STM 的责任。STM 将基础处理器频率设置为 `72 MHz`，在当今大多数 PC
    使用 GHz 时钟的世界中这似乎非常低。事实上，最新的 `Raspberry Pi` 3 型具有 `1.2-GHz` 时钟频率。但在这种情况下，表象是欺骗性的。`Cortex
    M-4` 处理器使用极其高效的指令集，具有三级流水线，从而最大化了处理器采用的精精指令计算性能。此外，我在下文中讨论的许多常用 MCU 任务通过硬件和固件相结合实现，进一步提高了性能，同时将功耗保持在最低。功耗和性能是系统设计者始终考虑的两个关键
    MCU 属性。将时钟频率尽可能降低将减少功耗并延长芯片寿命。


    ### 内存


    `Cortex M-4` 处理器使用哈佛架构（Harvard architecture）。这意味着程序指令存储并检索在与存储数据的内存独立的内存中。另一种常见的计算机架构命名为冯·诺依曼（von
    Neumann），其中指令和数据共享公共内存。MCU 内存非常有限，并利用并行指令和数据访问带来的速度提升。此外，独立的内存意味着处理器不再受到相同数据宽的限制。这意味着指令可以以
    `4 字节` 块或 `32 位`块进行取和执行，而数据可以同时以 `1 字节`或 `8 字节` 块处理，从而加快了处理器与内存之间的整体吞吐量。哈佛架构相比冯·诺依曼形式的另一个优势是，指令预取现在可以与常规指令执行并行，从而进一步加快了整个系统性能。最后，并行指令和数据访问消除了对冯·诺依曼机器中通常使用数据缓存的需求。这进一步降低了系统的复杂性和功耗。


