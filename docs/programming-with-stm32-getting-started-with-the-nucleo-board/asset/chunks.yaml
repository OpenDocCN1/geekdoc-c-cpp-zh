    \ 5-1** *STM 核心内存地址范围*\n\n许多读者可能思考的问题是，PC 如何在仅有 32 位寻址能力的情况下处理 8、16 甚至 32 GB 的\
    \ SRAM？答案在于使用了为扩展内存访问设计的操作系统以及名为内存管理单元（`MMU`）的硬件单元。所有主要的 PC OS（如 Windows、OSX 和\
    \ Linux）内置了扩展内存功能，允许 32 位寻址扩展到多个块或页。你可以理解为使用一个 4 位寄存器，其中每一位激活一个特定的块或页。因此，位 0 允许访问从\
    \ `0x0000 0000` 开始的所有基地址，而位 1 则允许寻址几乎从 `0x0001 0000 0000` 开始。当然，实际上只使用了 32 位，但操作系统处理地址的方式就像它们从\
    \ `0xFFFF FFFF` 之后的一个位置开始一样。这个 4 位寄存器可以被认为是 `MMU` 的一部分。4 位意味着在 32 位 PC 中最多可以处理\
    \ 64 GB 内存，这恰好通常是此类 PC 可安装的最大 SRAM。当然，当使用 64 位系统时，所有实际的物理内存限制都会缓解，但这需要昂贵的 CPU\
    \ 和额外的能量需求。\n\n前面的讨论不适用于典型的 STM MCU，因为内存非常受限，且处理典型的嵌入式应用不需要大量的内存。我想提一下，`STM32F302R8`\
    \ 确实包含一个内存保护单元（`MPU`）。`MPU` 不是 `MMU`，而是用于管理 CPU 内存访问，以确保一个任务不会意外损坏或冲突另一个任务的内存访问。内存可以分为最多八个区域，每个区域的大小在\
    \ 32 B 到 4 GB 之间，最后一个区域占有整个可寻址内存范围。`MPU` 通常由实时操作系统（`RTOS`）控制，该系统包含在上一章中介绍的 `CMSIS`\
