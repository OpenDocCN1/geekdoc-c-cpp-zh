    The fourth step is dependent on the selected peripheral. You will normally consult
    the STM data sheet, which describes the selected peripheral in order to determine
    how to enable the DMA transfer and to find out the exact channel it has been preassigned.
    Remember from the earlier discussion that peripherals have been preassigned channel
    numbers during the MCU design phase. In the following example, I will be demonstrating
    how to use USART2 peripheral in the DMA mode.


    ## Demonstration One


    This first demonstration will involve sending a string using the USART2 peripheral
    operating in the normal DMA mode. There are just a few steps necessary to configure
    this demonstration:


    1.   First configure the USART2 peripheral using the Pinout view in the CubeMX
    application as has been done several times in previous demonstrations.


    2.   Set the DMA1 channel as follows (STM32F302R8 MCU) for the USART2 peripheral
    for a memory-to-peripheral transfer:


    a.   USART2_TX = DMA1/CH7


    b.   USART2_RX = DMA1/CH6


    The following statement sets the USART2 peripheral DMA1, channel 7 to output characters
    to a terminal program:


    ![Images](c0251-01.jpg)


    It must be put in the `main` method. In addition, there is no need to instantiate
    DMA1, channel 6 because no characters will be received from the terminal program
    in this demonstration.


    3.   Enable the USART2 peripheral for DMA operations and arm the appropriate channel
    to execute the transfer.


    The following statement enables the USART2 peripheral for DMA operations:


    ![Images](c0251-02.jpg)


    It must be put in the `main` method.


    ### Program Listing


    The following is the code listing for this demonstration. I have also provided
    some additional discussion regarding pertinent code segments following the listing.


    ![Images](c0252-01.jpg)


    ![Images](c0253-01.jpg)


    ![Images](c0254-01.jpg)


    ![Images](c0255-01.jpg)


    ![Images](c0256-01.jpg)


    ![Images](c0257-01.jpg)


    I have first configured and initialized all the appropriate DMA setting in the
    main method. Some `DMA_InitTypeDef` struct members were not set because they are
    not needed in this demonstration and their values are not read during this particular
    DMA operation. The first three steps in the DMA preoperation sequence are as follows:


    1.   Set up appropriate memory and/or peripheral port addresses.


    2.   Establish the size of the data transfer.


    3.   Arm the DMA controller.


    These steps were all accomplished using the following statement:


    ![Images](c0257-03.jpg)


    The fourth and the final step is to start the DMA operation for the selected peripheral.
    This was accomplished by the following statement:


    ![Images](c0257-04.jpg)


    The seventh bit in the USART2 control register CR3 is named DMAT and is set to
    commence normal DMA operations for this peripheral.


    The core processor has also been set up to poll to determine when the DMA operation
    has been completed. This operation was accomplished by the following statement:


    ![Images](c0257-05.jpg)


    Polling for completion is completely appropriate for this demonstration simply
    because it is a “one-shot” occurrence and does not impede, nor conflict with any
