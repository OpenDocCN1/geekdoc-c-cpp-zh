    - `CMSIS-Driver`: Peripheral driver software interfacing all applicable devices
    with supported middleware software. This CMSIS portion contains items such as
    the file systems, communication stacks, and user interfaces.

    - `CMSIS-DSP`: Extensive optimized library supporting different data including
    both fixed and floating point data types. Library is applicable to `Cortex M0`,
    `M3`, `M4`, and `M7` core processors.

    - `CMSIS-RTOS`: A standardized API implementing a real-time operating system (RTOS).
    This API provides a framework that supports a variety of specific `Cortex`, RTOS
    implementations.

    - `CMSIS-DAP`: Debug access port (DAP) is a standardized set of firmware routines
    that implements debugging features optimized for `Cortex` processors. It connects
    to the `CoreSight Debug Access Port` to have rapid access to real-time data.

    - `CMSIS-SVD`: This is an extensible markup language (XML) file named System View
    Description (SVD), which contains peripheral descriptions suitable for use by
    programming language header (include) files as well as debuggers and interrupt
    controllers.

    - `CMSIS-Pack`: An XML file collection containing logical descriptions and parameters
    for a variety of devices. A main file named `PDSC` is used to extract desired
    data from the XML file collection.


    It should be noted that the STM hardware abstraction layer (`HAL`), discussed
    in the next chapter, contains specifics only related to STM MCUs and is somewhat
    noncompliant with the ARM Cortex Microcontroller Software Interface Standard (`CMSIS`).
    Using the `CMSIS` is totally voluntary on part of vendors manufacturing ARM-based
    MCUs and STM has apparently decided that using `HAL` is the best approach in its
    case to handle the wide variety of MCUs and associated development boards it makes.
    I believe STM tried to stay compliant with the `CMSIS` but still needed to support
    its vast array of products.


    ## CubeMX-Generated C Code


    It is now time to return to a discussion of the automatically generated code that
    the CMSIS framework has introduced. [Figure 3-24](#ch3.xhtml_ch3fig24) is an interesting
    composite of the newly generated directories that show how they are related to
    the various CMSIS components.


    ![images](fig03-24.jpg)


    **Figure 3-24** Generated code related to CMSIS structure.


    The `Application/User` directory contains essentially skeleton files that present
    a framework that users can populate with specific code to implement a desired
    application. The files contained within these directories are only applicable
    to the `Application` block, as shown in [Figure 3-24](#ch3.xhtml_ch3fig24).


    The `Drivers/CMSIS` structure contains header files with names such as `core_cm3`,
    `core_cm4`, and so on, which contain specific logical definitions required by
    the real MCU peripherals and all associated control/data registers. There are
    also core MCU definitions as well as interrupt controller definitions and helper
    functions.


    The `Drivers/STM32F3xx_Hal_Driver` directory contains all the remaining data and
    parameters necessary for MCU operations not already provided in other directory
    files. This data covers items such as interrupt numbers, peripheral device addresses,
    restart vectors, and additional helper functions.


    The `Application/MDK-ARM` contains ARM-specific startup code necessary to initialize
    the target MCU.


    ## Compiling and Downloading the Project


    At this point there is sufficient initialization and configuration code to build
    a downloadable file suitable to be run on the target. Unfortunately, it is a null
    project, meaning that nothing meaningful is being accomplished by the MCU. However,
    it is still a useful exercise to determine if the code, as it stands, can be compiled
    and downloaded to the target.


    [Figure 3-25](#ch3.xhtml_ch3fig25) shows where the Keil IDE build icon is located.
    Clicking on this icon will start the automatic build process converting the source
    code in the project to a binary file.


    ![images](fig03-25.jpg)


    **Figure 3-25** Keil IDE build icon.


    [Figure 3-26](#ch3.xhtml_ch3fig26) shows all the intermediate results that happen
    during the build process. This log can be very useful in the case of errors that
    can happen during the build process.


    ![images](fig03-26.jpg)


    **Figure 3-26** Build process log.


    You may have noticed that the final compiled and linked binary file is in an `axf`
    format. This format is not compatible to be used with the `ST-LINK`, which expects
    the download file to have a `hex` format. This is easily fixed by clicking on
    the `Flash` menu selection and then clicking on the `Configure Flash Tools`. Click
    on the `Output` tab once the flash tools selection has opened. Then click on the
    checkbox next to the `Create HEX File` selection. [Figure 3-27](#ch3.xhtml_ch3fig27)
    shows this selection.


    ![images](fig03-27.jpg)


    **Figure 3-27** Select hex file output.


    The project must be rebuilt once the `hex` file has been selected. This is easily
    done by just again clicking on the build icon. The IDE is smart enough to understand
    that the source code does not have to be recompiled but simply linked again to
    form a `hex` file. The resulting `hex` file is clearly shown in [Figure 3-28](#ch3.xhtml_ch3fig28).


    ![images](fig03-28.jpg)


    **Figure 3-28** Hex file output.


    The target can now be programmed once the `hex` file is created. The `ST-LINK`
    application is used to download the hex file into the target.


    ## Downloading the Hex Code


    You first need to open the ST-LINK application and open the appropriate hex file
    to be downloaded. The hex file is automatically placed into the project’s `MDK-ARM`
    subdirectory as part of the build process. You will have to browse to this directory
    using the `File` menu selection. [Figure 3-29](#ch3.xhtml_ch3fig29) shows how
    the sample hex file was selected.


    ![images](fig03-29.jpg)


    **Figure 3-29** Open the hex file to be downloaded.


    The target must then be connected to the host computer running the ST-LINK application
    using an USB cable, as has been previously discussed. You will next need to click
    on the `Target` menu selection and then click on the `Connect` selection. [Figure
    3-30](#ch3.xhtml_ch3fig30) shows the ST-LINK window after the application is connected
    to the target.


    ![images](fig03-30.jpg)


    **Figure 3-30** ST-LINK connected to a target.


    All that’s left is to download the hex file that has been loaded into the ST-LINK
    application. Click on the `Target` menu selection and then click on the `Program
    and Verify` selection. [Figure 3-31](#ch3.xhtml_ch3fig31) shows the Program and
    Verify dialog box.


    ![images](fig03-31.jpg)


    **Figure 3-31** Program and Verify dialog box.


    Click on the `Start` button to download the hex file into the target board. The
    red/green LED on the Nucleo board will start flashing with alternating colors
    to indicate that the download operation is progressing. While the download is
    very quick, the LED will continue to flash. I guess the STM engineers just wanted
    to let users know the board was programmed. [Figure 3-32](#ch3.xhtml_ch3fig32)
    shows the result of a successful download.


    ![images](fig03-32.jpg)


    **Figure 3-32** Successful hex file download.


    The target board should be functioning in accordance with its program. In this
    case, absolutely nothing will happen because no functionality was programmed.
    This addition of functionality to the program will be investigated in the next
    chapter. However, I want to ensure that the download was okay, so I previously
    programmed the target to flash the user LED. Once the new hex file was downloaded,
    the LED stopped blinking, which indirectly confirmed that the nonfunctioning program
    was properly downloaded.

