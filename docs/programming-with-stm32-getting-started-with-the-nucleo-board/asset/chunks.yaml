- fmt: '

    The chapter began with an introduction to the `STM32CubeMX` application, which
    I simply referred to as `CubeMX` for the remainder of the book. The application
    has four main portions or tabs that I thoroughly discussed. `CubeMX`’s purpose
    is to initialize and configure either `STM MCUs` or associated development boards,
    which include automatically generating C code to support the desired configuration.
    The automatic C code generation does not extend to any embedded application, which
    is still the developer’s responsibility.


    A generic `CubeMX` project was created that did not do anything other than to
    provide a platform for the automatically generated C code, which supports the
    peripherals, clocks, communication channels, and interrupts for the specific `Nucleo`
    development board. I also presented the code contained in the `main.c` file and
    briefly discussed the contents and their operations.


    I next discussed the `ARM CMSIS`, which most ARM vendors try to be in compliance.
    I also showed how the automatic C code is related to the `CMSIS` framework.


    I showed you how to build a nonfunctioning project to prove that the toolchain
    works as desired. The `CubeMX` application created all the C code because there
    was no developer-responsible code required for this project. The `ST-LINK` application
    was used to download a hex file to the target platform.


    The process detailed in this chapter will be repeated for all the remaining book
    projects, and specialized code will be added to perform all desired functions.


    # 4. STM Project Development


    In this chapter I will demonstrate how to build C/C++ language projects with a
    `STM Nucleo` board using the toolchain created in [Chapter 2](#ch2.xhtml_ch2)
    and the `CubeMX` application described in [Chapter 3](#ch3.xhtml_ch3). I will
    be using C/C++ language to create the source code for these projects. It would
    be helpful, but not really required, if readers are somewhat familiar with the
    C/C++ language in order to achieve a better understanding of the entire process.
    I will go thoroughly into the example code for the “Hello World” project to help
    clarify what is happening with the source code for those readers who are not too
    proficient in using C.


    ## Hello World Project


    The traditional and customary “Hello World” program is the one that beginning
    developers almost always make when starting their computer language studies. In
    the embedded world, this program has morphed into blinking an LED instead of displaying
    “Hello World!” on a monitor screen. I will demonstrate step-by-step how to create
    a “Hello World” project using a `Nucleo64-STMF302R8` demonstration board connected
    to a Windows 10-based host system running the toolchain established in [Chapter
    2](#ch2.xhtml_ch2). You will not benefit much from this chapter unless you have
    read the previous chapters and created a working toolchain and become somewhat
    comfortable using the `CubeMX` application.


    ## Creating the Hello Nucleo Project


    The first step in creating a project is to open `CubeMX` application. Once the
    application is started, click on `New Project` and click on the `Board` tab. Select
    the `Nucleo` board that you are using. In my case, it is the `NUCLEO-F302R8` board,
    as shown in [Figure 4-1](#ch4.xhtml_ch4fig1).


    ![images](fig04-01.jpg)


    **Figure 4-1** New C/C++ Project dialog box.


    Next, double-clicking on the board selection line will cause the project pinout
    screen shown in [Figure 4-2](#ch4.xhtml_ch4fig2) to be displayed.


    ![images](fig04-02.jpg)


    **Figure 4-2** Project pinout screen.


    The next step is to click on the `Project` menu item, which will result in the
    dropdown menu, as shown in [Figure 4-3](#ch4.xhtml_ch4fig3).


    ![images](fig04-03.jpg)


    **Figure 4-3** Project dropdown menu.


    Clicking on the `Generate Code` selection will cause the `Project Settings` dialog
    box appear, as shown in [Figure 4-4](#ch4.xhtml_ch4fig4).


    ![images](fig04-04.jpg)


    **Figure 4-4** Project Settings dialog box.


    You need to provide a name in the `Project Name` textbox. It should be something
    relevant to the intended project purpose. Also confirm that the `Project Location`
    is correct along with the `Toolchain Folder Location`.


    It is very important that you select the `MDK-ARM V4` from the `Toolchain/IDE`
    combo list. The project cannot be created without `MDK-ARM V4` selection.


    The default `Linker Settings` should be okay and the `Mcu and Firmware Package`
    and `Firmware Package Name and Version` should also be similar to what is shown
    in the figure.


    Finally, ensure that the checkbox next to `Use Default Firmware Location` is checked,
    otherwise the IDE will not be able to create the binary file.


    Do NOT click on the `Ok` button, but instead click on the `Code Generator` tab
    near the top of the dialog box. This should make the `Project Settings/Code Generator`
    dialog box appear, as shown in [Figure 4-5](#ch4.xhtml_ch4fig5).


    ![images](fig04-05.jpg)


    **Figure 4-5** Project Settings/Code Generator dialog box.


    The radio button next to `Copy all used libraries into the project folder` will
    initially be selected. You should click on the radio button next to `Copy only
    the necessary library files` in order to minimize the size of the overall project.
    Neglecting to make this change will not affect the size of the final binary file,
    but will needlessly enlarge the project folder. Now you can click on the `Ok`
    button to have CubeMX automatically generate the code.


    After a short interval, a successful Code Generation dialog box should appear,
    as shown in [Figure 4-6](#ch4.xhtml_ch4fig6).


    ![images](fig04-06.jpg)


    **Figure 4-6** Successful Code Generation dialog box.


    Clicking on the `Open Project` button will cause the `Keil IDE` to be opened with
    the newly project shown in the `Project` pane to the left side, as shown in [Figure
    4-7](#ch4.xhtml_ch4fig7).


    ![images](fig04-07.jpg)


    **Figure 4-7** Keil IDE with the new project.


    The error dialog that appears in [Figure 4-7](#ch4.xhtml_ch4fig7) has been discussed
    in the previous chapter and is due to the IDE not having a reference to the target
    hardware. That is easily fixed by going to the `Device Database`, as described
    in [Chapter 3](#ch3.xhtml_ch3). Once that is resolved, you should expand the `Project`
    directory by clicking on the `+` check box. Once expanded, click on the dropdown
    arrow next to `Application/User` subdirectory to reveal the files in that directory.
    Finally, double-click on the `main.c` file, which will display the following listing.
    Note that this listing is the same, as has been previously shown in [Chapter 3](#ch3.xhtml_ch3).
    However, I do this to provide the proper context to make the desired modifications
    in order to add some functionality into an otherwise nonfunctional program. Also,
    note that the extensive STM disclaimer commentary has been minimized to save listing
    space.


    ![Images](c0092-01.jpg)

    ![Images](c0093-01.jpg)

    ![Images](c0094-01.jpg)

    ![Images](c0095-01.jpg)

    ![Images](c0096-01.jpg)


    I have chosen to provide commentary to the listing using italicized number annotations
    to designate those portions of the listing being discussed. Simply refer to the
    listing and the associated number in italics to keep track of the discussion topic.


    *[1]*—Either the `/* ... */` or `//` designate a commented line, which is ignored
    by the compiler. The first format allows for multiple comment lines, while the
    second is only for a single line. Comments are for human use as a means for the
    developer to explain what is happening within the source code. I strongly recommend
    that you always comment your programs as you see with this listing.

