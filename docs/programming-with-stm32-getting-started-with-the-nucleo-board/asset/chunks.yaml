    ### Establishing a Telnet Link


    The very first thing that you must do prior to using telnet is to enable it on
    Windows 10. Unfortunately, it is not enabled by default and must be done by the
    user. It is a relatively easy procedure as detailed below:


    1.   Enter “Control Panel” in the Search text box


    2.   Click on “Programs”


    3.   Click on “Program and Features”


    4.   Click on “Turn Windows features on or off” found in the left-hand column


    5.   Scroll down and click on the check box next to “Telnet Client”


    6.   Click on the “OK” button


    There is an equivalent command-line procedure to enable telnet, but I found the
    GUI approach just as effective.


    You will next need to determine the appropriate telnet script that supports the
    particular board that is being used for your projects. All the available scripts
    currently supporting Nucleo boards are detailed in [Table 2-2](#ch2.xhtml_ch2tab2).


    ![images](tab02-02.jpg)


    **Table 2-2**   *Telnet Scripts*


    I used the configuration file named “st_nucleo_f3.cfg” because it was associated
    to my NUCLEO-F302R8 board.


    The next part of this process is to open a terminal window. The easiest and fastest
    way is to enter “cmd” in the Search textbox. Type in the following two command
    lines into the window:


    ![Images](c0047-01.jpg)


    Remember to use the appropriate configuration file associated with your Nucleo
    board.


    The OpenOCD service should then respond in the terminal window with what is shown
    in [Figure 2-16](#ch2.xhtml_ch2fig16).


    ![images](fig02-16.jpg)


    **Figure 2-16**   *Starting the OpenOCD service.*


    Notice that an error message is shown in the OpenOCD response sequence, but I
    found that it was inconsequential and did not affect the program operations. However,
    if you do not see the responses following the error, it means that a real problem
    exists because no communications link was created between the OpenOCD program
    and the target board. This problem is usually caused by having an incorrect libusb
    version trying to be used by Windows. Follow the Zadig utility procedure to correct
    this issue.


    1.   Download the Zadig utility from [http://zadig.akeo.ie/](http://zadig.akeo.ie/)
    for your Windows version.


    2.   Connect the Nucleo board to your computer.


    3.   Run the Zadig utility and select Options → List All Devices.


    4.   The Nucleo board should appear in the device list combo box after a short
    interval.


    5.   Select the WinUSB driver if it is not already listed.


    6.   Click on the Reinstall Driver button as shown in [Figure 2-17](#ch2.xhtml_ch2fig17).


    ![images](fig02-17.jpg)


    **Figure 2-17**   *Reinstall WinUSB driver dialog box.*


    This action should fix the libusb driver issue. Go back and try starting the OpenOCD
    service as previously described.


    You can now minimize the terminal window, but do not close it because the OpenOCD
    service will stop if you do. Open another terminal window and enter the following
    command:


    `telnet localhost 4444`


    The OpenOCD service should respond with message as shown in [Figure 2-18](#ch2.xhtml_ch2fig18).


    ![images](fig02-18.jpg)


    **Figure 2-18**   *Opening OpenOCD response.*


    There will be a prompt awaiting your input to the service. There are many ways
    of interacting with OpenOCD and typing in “help” will give a big response for
    all of the many varied commands. [Figure 2-19](#ch2.xhtml_ch2fig19) shows just
    the beginning portion of the help response.


    ![images](fig02-19.jpg)


    **Figure 2-19**   *Beginning portion of the OpenOCD help request.*


    For much greater details, I would highly recommend that you download the OpenOCD
    user guide in PDF format from [http://openocd.org/doc/pdf/openocd.pdf](http://openocd.org/doc/pdf/openocd.pdf).
    This is a 172-page document and currently references version 0.10.0 as of January
    15, 2017.


    I did try out a few commands just to see how OpenOCD worked. The first command
    was to halt the Nucleo board from running a program. This command was:


    `reset halt`


    The board was running a “blinky” type program when the command was given. It instantly
    stopped after I pressed the Enter key on the keyboard. The next command displayed
    the current contents of all the MCU registers. This command was simply:


    `reg`


    [Figure 2-20](#ch2.xhtml_ch2fig20) shows the impressive results of using this
    very simple command.


    ![images](fig02-20.jpg)


    **Figure 2-20**   *OpenOCD reg command results after a reset.*


    It is obvious that all the data registers were reset to 0 content based on the
    `reset` command that was given previous to the `reg` command. In [Figure 2-21](#ch2.xhtml_ch2fig21),
    I halted the blinky program without issuing a reset. In this case, the contents
    of the general-purpose registers were not reset as you can see in the figure.


    ![images](fig02-21.jpg)


    **Figure 2-21**   *OpenOCD reg command results after a halt.*


    OpenOCD also has a very handy command to examine any memory location. The location
    contents can be returned as a word, half-word, or byte using the commands mdw,
    mdh, and mdb, respectively. [Figure 2-22](#ch2.xhtml_ch2fig22) shows the results
    of these commands being executed on memory location 0x4000 0000.


    ![images](fig02-22.jpg)


    **Figure 2-22**   *Memory content display commands.*


    I could expand upon the OpenOCD commands, but I feel you probably understand by
    now that the only way to get comfortable with OpenOCD is to use it and explore
    its many features.


    The OpenOCD installation completes the overall toolchain installation process.
    I will demonstrate in the next chapter how to create a new C language project
    using the toolchain established in this chapter.


    ### Summary


    This chapter’s discussions provide instructions on how to set up a STM32 toolchain
    that will enable you to create software projects that will execute on STM MCUs
    and demonstration boards. Instructions were only provided for Windows-based host
    platforms. However, I did include a reference that shows how to set up toolchains
    on Mac OSX and Linux platforms.


    The Keil IDE using the C/C++ languages is used for this particular toolchain.


