    - 当 I/O 值为 HIGH 时，LED 亮起

    - 当 I/O 值为 LOW 时，LED 熄灭


    `LD3` 是一个红色 LED，用于指示 Nucleo-64 板板已通电且 `5-V` 电源可用。


    ### 压力按键 (Push Buttons)


    板板上有两个按键：


    - `B1 USER`：用户按钮连接到 MCU 的 I/O `PC13` (`CN7/23`)。该引脚通过一个 `47K` 电阻拉高。当按下 `B1` 时，引脚接地。

    - `B2 RESET`：此按键连接到 `NRST`，用于复位（`RESET`）MCU。


    > **注意**：必要时可以移除放置在按键上的蓝色和黑色塑料帽，例如在 Nucleo-64 板板上插入扩展板或外接板时。这可以避免对按钮产生压力，从而防止意外的设备
    `RESET`。


    ### JP6


    跳线 `JP6` 标记为 `IDD`，用于通过移除跳线并将电流表与两个引脚引线*串联*来测量 MCU 电流。


    - `Jumper ON`：MCU 通电（默认）。

    - `Jumper OFF`：必须连接电流表来测量 MCU 电流。如果没有连接电流表，MCU 将无法接收电源。


    ### OSC 时钟 (OSC Clock)


    在 Nucleo-64 板板上有四种连接高速外部时钟（`HSE`）的方式。


    ### 来自 ST-LINK 主钟输出（默认）


    主钟输出（`MCO`）由位于 ST-LINK PCB 上的 `8-MHz` 晶振产生，并通过 `PF0/PD0/PH0-OSC_IN` 引脚输入主 MCU。该晶振频率是固定的。顺便提到，在本章之前提到的
    `72-MHz` 时钟速率是通过使用 MCU 内的锁相环（`PLL`）利用 `8-MHz` 输入时钟信号生成的。


    ### 带有可选 X3 晶振的上载 HSE 振荡器


    在空的 `X3` PCB 焊盘上安装一个 `8-MHz` 晶振。此外，还需要更改一些焊桥，并添加一些电阻和电容。细节请见用户指南。


    ### 通过 CN7 连接器第 29 脚使用外部振荡器


    需要更改一些焊桥，并移除一些电阻。细节请见用户指南。


    ### 不使用 HSE


    `PF0/PD0/PH0` 和 `PF1/PD1/PH1` 用作 `GPIOs` 而不是时钟源。需要更改一些焊桥，并移除一些电阻。细节请见用户指南。我不确定
    MCU 在没有 `HSE` 的情况下如何工作，但根据用户指南这是一个可选选项。


    ### OSC 32-kHz 时钟供应


    有三种方法配置对应低速外部时钟（`LSE`）的引脚。


    ### LSE 板载振荡器


    你可以更换 `X2` 晶振，前提是它符合 `STM32 MCU` 的振荡器设计指南。板上安装的默认晶振是 Abracon 公司制造的 `ABS25-32.768KHZ-6-T`
    型。


    ### 通过 CN7 连接器第 25 脚使用外部振荡器


    需要更改一些焊桥，并移除一些电阻。细节请见用户指南。


    ### 不使用 LSE


    `PC14` 和 `PC15` 用作 `GPIOs` 而不是 `LSE` 源。需要更改一些焊桥，并移除一些电阻。细节请见用户指南。我非常确定在禁用 `LSE`
    时，实时时钟和看门定时器无法运行。


    ### 电源与电源选择 (Power Supply and Power Selection)


    我已经讨论过在 Arduino 连接器中可以连接外部电源。然而，仍然有一些你应该了解的电源功能和选项。


    ### 来自 USB 连接器的电源输入


    整个 Nucleo-64 板板（包括任何连接的扩展板）都可以通过 `CN1` USB 连接器提供的 `5-V` 电源供电，只要主机 USB 设备符合提供 `500
    mA` 的 USB 标准。ST-LINK 需要 `100 mA`，主 MCU 需要 `300 mA`，为任何扩展板或外部设备（如 LED 或 LCD 显示器）留
    `100 mA`。如果计划总电流超过额定 `500-mA` 负载，则必须使用外部电源。如果电流不足为 MCU 提供电，红色 LED `LD3` 将不会亮。


    当板板由 USB 供电（`U5V`）时，必须在 `JP5` 的引脚 `1` 和 `2` 之间连接跳线。


    跳线 `JP1` 根据 USB 连接（`U5V`）供电时的最大电流消耗配置。如果板板由 USB 供电且 `U5V` 最大电流消耗不超过 `100 mA`（包括可能的扩展板或
    Arduino 扩展），可以设置 `JP1` 跳线。在这种情况下，USB 枚举将始终成功，因为主机需要的不超过 `100mA`。`JP1` 的可能配置汇总在表
    1-9 中。


