    \ 的分频器值。例如，对 80-MHz 主时钟应用 40,000 的分频器值意味着输入定时器的时钟频率为 2-kHz。\n- **CounterMode**:\
    \ 设置计数方向。可用的 CounterModes 如下：\n    - `TIM_COUNTERMODE_UP`\n    - `TIM_COUNTERMODE_DOWN`\n\
    \    - `TIM_COUNTERMODE_CENTERALIGNED1`\n    - `TIM_COUNTERMODE_CENTERALIGNED2`\n\
    \    - `TIM_COUNTERMODE_CENTERALIGNED3`\n- **Period**: 这是一个代表在定时器计数器加载该数值之前所经过的最大时间的数值。16\
    \ 位计数器的最大值为 `0xffff`，32 位计数器为 `0xffffff`。值为 `0x0` 将确保定时器启动。\n- **ClockDivision**:\
    \ 这是一个特定的位字段，用于设置内部定时器时钟频率与用于数字滤波采样时钟之间的比例。它还用于设置死时间参数。可用的 ClockDivision 模式如下：\n\
    \    - `TIM_CLOCKDIVISION_DIV1`\n    - `TIM_CLOCKDIVISION_DIV2`\n    - `TIM_CLOCKDIVISION_DIV4`\n\
    - **RepetitionCounter**: 设置定时器溢出或下溢的次数限制。达到限制时将设置定时器更新寄存器。也可以结合寄存器更新触发一个事件。\n\n\
    ## 更新事件计算\n\n应使用以下公式来计算给定高速时钟频率、分频器值和周期值之间更新事件之间的时间：\n\n![Images](img/c0148-1.jpg)\n\
    \n下方显示了示例计算：\n\n给定：\n\n![Images](img/c0149-01.jpg)\n\n下面对所述演示项目的讨论将向你展示如何在轮询模式下配置\
    \ GP 定器，从而使 LED 闪烁。\n\n### 轮询或非中断 LED 闪烁定时器演示\n\n这是两个演示中的第一个，向你展示如何配置 TIM2 GP\
    \ 定器来控制 LD2（板载绿色 LED）。此演示将不使用中断，因此我可以专注于讨论如何配置定时器。LED 将根据分频器和周期值的选择以及 Nucleo-64\
    \ 板预设的 64-MHz 高速时钟频率，以 0.5-s 的速率闪烁。\n\n你应该使用 CubeMX 通过提供适当的项目名称来启动此项目。我为此项目使用了\
    \ `TIM2_Example1`。在引脚视图中，你应该选择内部高速时钟作为定时器 TIM2 的时源，如图 7-1 所示。\n\n![images](img/fig07-01.jpg)\n\
    \n**图 7-1** TIM2 时源选择。\n\n选择时源还会触发 CubeMX 应用将所有的 TIM2 初始化语句包含在新项目中。这一步对于生成可运行的项目至关重要。\n\
    \n不要忘记之前所有的项目创建步骤仍然适用，例如仅包含必要的库文件并确保生成了 hex 文件。\n\n我将在下方列举之后讨论项目代码的关键部分。\n\n![Images](img/c0150-01.jpg)\n\
    ![Images](img/c0151-01.jpg)\n![Images](img/c0152-01.jpg)\n![Images](img/c0153-01.jpg)\n\
    ![Images](img/c0154-01.jpg)\n\n此代码大部分是上一章讨论的中断演示项目中所示 main.c 代码的重复。主要区别在于增加了 `MX_GPIO_Init`\
    \ 方法，以及在 `main` 方法的无限循环部分需要的一些新操作代码。\n\n`MX_GPIO_Init` 方法配置了 `TIM_HandleTypeDef`，这是一个带有特定值的类型\
    \ C 结构体，使定时器每 0.5 s 重置一次。该结构体命名为 `htim2`，并在该方法中初始化和启动。\n\n`main` 方法中的无限循环包含代码，它会持续检查定时器计数，并在计数达到\
    \ 150 时开启 LED。它将保持开启，直到计数增加到 399，此时 LED 将被重置。这些语句导致 LED 开启 0.25 s 并关闭 0.25 s。\n\
    \n## 测试运行\n\n我构建了项目并将其上传到 Nucleo-64 板中。用户 LED 立即开始以 0.5-s 的速率闪烁。\n\n### 中断驱动的\
    \ LED 闪烁演示\n\n这是两个演示中的第二个，向你展示如何配置 TIM2 GP 定器来控制 LD2（板载绿色 LED）。此演示将使用中断，因此我可以专注于讨论如何配置定时器。LED\
    \ 将根据分频器和周期值的选择以及 Nucleo-64 板预设的 64-MHz 高速时钟频率，以 0.5-s 的速率闪烁。\n\n你应该使用 CubeMX\
    \ 通过提供适当的项目名称来启动此项目。我为此项目使用了 `TIM2_Example1`。在引脚视图中，你应该选择内部高速时钟作为定时器 TIM2 的时源，如图\
    \ 7-1 所示。\n\n![images](img/fig07-01.jpg)\n\n**图 7-1** TIM2 时源选择。\n\n选择时源还会触发 CubeMX\
    \ 应用将所有的 TIM2 初始化语句包含在新项目中。这一步对于生成可运行的项目至关重要。\n\n不要忘记之前所有的项目创建步骤仍然适用，例如仅包含必要的库文件并确保生成了\
    \ hex 文件。\n\n我将在下方列举之后讨论项目代码的关键部分。\n\n![Images](img/c0150-01.jpg)\n![Images](img/c0151-01.jpg)\n\
    ![Images](img/c0152-01.jpg)\n![Images](img/c0153-01.jpg)\n![Images](img/c0154-01.jpg)\n\
    \n此代码大部分是上一章讨论的中断演示项目中所示 main.c 代码的重复。主要区别在于增加了 `MX_GPIO_Init` 方法，以及在 `main` 方法的无限循环部分需要的一些新操作代码。\n\
    \n`MX_GPIO_Init` 方法配置了 `TIM_HandleTypeDef`，这是一个带有特定值的类型 C 结构体，使定时器每 0.5 s 重置一次。该结构体命名为\
    \ `htim2`，并在该方法中初始化和启动。\n\n`main` 方法中的无限循环包含代码，它会持续检查定时器计数，并在计数达到 150 时开启 LED。它将保持开启，直到计数增加到\
    \ 399，此时 LED 将被重置。这些语句导致 LED 开启 0.25 s 并关闭 0.25 s。\n\n"
