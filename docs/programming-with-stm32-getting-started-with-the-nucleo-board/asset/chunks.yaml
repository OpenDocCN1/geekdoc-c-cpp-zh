  trans: "\n\n模拟舵机本质上是一种电机，其内部内置了一个电子电路，可以将特定的脉冲宽度转换为成比例的旋转。业余级模拟舵机的规格相当“松散”，这意味着脉冲宽度与物理旋转之间存在较大的公差。这主要是由于在组成舵机的电学和机械部件中都使用了非常廉价的元件。表\
    \ 10-2 详细列出了脉冲宽度和预期旋转角度。\n\n![images](img/tab10-02.jpg)\n\n**表 10-2**���*脉冲宽度与舵机旋转*\n\
    \n当向模拟舵机发送重复的 1.5 ms 脉冲信号时，它应离开中性位。从正前方看，1.0 ms 的脉冲序列将导致其主轴逆时针旋转 60°。同样，2.0 ms\
    \ 的脉冲序列将导致其顺时针旋转 60°。然而，由于公差的影响，旋转角度通常会有正负 10° 到 15° 的偏差。\n\n在所有情况下，脉冲序列频率都设置为额定的\
    \ 50 Hz 或周期 20 ms。\n\n图 10-13 显示了我在此演示中使用的业余级舵机。它是一台 Hitec HS-311 型，这是一个可靠且制作良好的舵机。\n\
    \n![images](img/fig10-13.jpg)\n\n**图 10-13**���*Hitec HS-311 型模拟舵机。*\n\n该舵机的运行需要较大的电流，略超过了\
    \ STM 项目板能提供的电流。因此，我为它使用了独立的电源，如图 10-14 连接原理图所示。\n\n![images](img/fig10-14.jpg)\n\
    \n**图 10-14**���*舵机连接原理图。*\n\n PWM 输出的舵机控制信号只需要几毫安，这完全在 GPIO 引脚的驱动能力范围内。\n\n图\
    \ 10-15 显示了 1.5 ms 中性位信号的波形。这是一个非常清晰的信号，具有陡峭的上升和下降时间，这对于舵舵机至关重要。\n\n![images](img/fig10-15.jpg)\n\
    \n**图 10-15**���*1.5 ms 舵机控制信号。*\n\n1.0 ms 和 2.0 ms 的波形除脉冲宽度外，非常相似。\n\n图 10-16\
    \ 显示了物理设置，其中模拟舵机连接到免焊接面包板上，面包板再通过跳线连接到 Arduino 实验板。\n\n![images](img/fig10-16.jpg)\n\
    \n**图 10-16**���*舵机测试设置。*\n\n### 测试结果\n\n我首先将 `CCR1` 值改为 148，这会产生 1.5 ms 的脉冲宽度。在程序下载到项目板后，舵机立即移动到中性位。我重复了之前的步骤，将\
    \ `CCR1` 设为 98，这会产生 1.0 ms 的脉冲宽度。舵机做出响应，主轴逆时针移动 60°。最后，我将 `CCR1` 改为 196，产生 2.0\
    \ ms 的脉冲宽度。正如预期的，舵机的主轴顺时针旋转了 120°。\n\n舵机的表现完美，没有出现抖动或震动的迹象，这在使用业余级舵机时有时会出现。\n\n\
    接下来，我添加了一些功能代码并将其放入 `forever` 循环中以持续驱动舵机，从而避免了反复编辑、重新编译和下载控制程序。\n\n## 添加功能测试代码\n\
    \n将以下 C 代码放在 `main.c` 文件中，以便持续控制舵机。这段代码使舵机主轴在 ±60° 的端点之间缓慢振荡。\n\n![Images](img/c0239-01.jpg)\n\
    \n## 测试结果\n\n在修改后的代码下载到项目板后，我观察到舵机主轴正如预期在端点之间缓慢振荡。\n\n最后的演示结束了本章内容。我相信我已经为你提供了足够的背景知识，使你能够成功使用\
    \ STM Nucleo 板配合舵机。\n\n### 总结\n\n在本章开始时，我通过解释脉冲宽度调制 (PWM) 的组成部分并详细说明该信号的某些关键属性。随后简单讨论了\
    \ STM 定器硬件如何产生 PWM 信号。\n\n接下来讨论了如何使用 HAL 框架来配置和初始化通用 (GP) 定器以发射 PWM 信号。\n\n展示了一个完整的\
    \ C 代码列表，用于生成具有 50% 占空比和 50 Hz 输出频率的 PWM 信号。\n\n随后是四个 PWM 演示中的第一个。第一个 PWM 演示仅输出项目板在代码编译并下载到板后生成的\
    \ 50% 占空比波形。\n\n第二个演示使用变化的占空比波形来调节红色 LED 的亮暗。\n\n第三个演示使用多通道 PWM 波形同时控制 RGB LED\
    \ 的颜色和强度。\n\n第四也是最后一个演示说明了如何使用 PWM 信号控制标准的模拟舵机。\n\n## 11\n\n## 直接内存访问 (DMA) 和数模转换器\
    \ (DAC)\n\n本章内容经过精心挑选，用于解释直接内存访问 (DMA) 和非常有用的数模转换器 (DAC) 外设，后者利用了高效的 DMA 传输。本章中展示了几个演示项目，涉及\
    \ DMA 和 DAC\n\n### DMA\n\n数据通常由 Cortex-M 处理器执行的指令进行传输。数据通常发送到内部存储器和其他设。这种数据传输过程消耗了宝贵的处理器周期，而这些周期在嵌入式系统中非常有限。这就是设计\
    \ DMA 控制器的原因。它可以承担许多数据传输任务，让处理器处理其他任务。\n\n从技术上讲，DMA 控制器可以被视为外设设备；然而我更倾向于将其视为协处理器而非外设。与任何其他外设不同，DMA\
    \ 控制器可以担任总线角色，这是处理器本身以外的任何设备都不允许的。事实上，将 DMA 控制器视为控制器是查看该设备的好方法。\n\n图 11-1 用于项目板\
    \ STM32F302R8 MCU 的 DMA 控制器框图。图对于解释 DMA 控制器如何工作非常有帮助。\n\n![images](img/fig11-01.jpg)\n\
    \n**图 11-1** *DMA 框图。*\n\n***注意*** DMA2、SPI1、TIM3、TIM4、UART4、UART5 和 ADC2 在 STM32F302R8\
    \ MCU 中不可用。\n\n在进入 DMA 操作细节之前，考虑数据传输的基础知识是值得的。\n\n## 基本数据传输概念\n\n图 11-2 是一个简化的系统框图，从图\
    \ 11-1 中移除了所有 DMA 组件。此图的目的是关注核心处理器与所有剩余系统外设之间是如何传输数据的。\n\n![images](img/fig11-02.jpg)\n\
    \n**图 11-2** *核心处理器与系统外设之间的数据传输。*\n\n"
