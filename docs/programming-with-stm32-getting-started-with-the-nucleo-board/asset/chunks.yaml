    sunshine from inadvertently erasing the EPROM. The UV EPROM eventually gave way
    to the EEPROM, which is an electrically erasable ROM. The Intel 8052 is a MCU
    version that uses an EEPROM. This chip became hugely successful in the embedded
    development community with many millions, if not billions, being employed in a
    wide variety of systems, devices, and other embedded applications. In fact, Intel
    8052 and certain variants are still being manufactured today. At one time, the
    805x family was by far the world’s most widely used MCU line. However, I now believe
    smartphone MCUs have overtaken the 805x’s as the most widely used MCUs.


    I include [Table 2-1](#ch2.xhtml_ch2tab1), which compares similar features between
    an 8052 and the STM32F302R8 MCUs used in this book. This table starkly shows huge
    improvements in technology in this field.


    ![images](tab02-01.jpg)


    **Table 2-1**   *Comparison between an 8052 and STM32F302R8 MCUs*


    Just remember that in its day, the 8052 was considered a very powerful MCU. In
    the 1990s, I had the privilege of working with a new product development team
    that used an 8052 development board as its main controller. I programmed the MCU
    using the C language. Fortunately for the team and myself, we could reprogram
    it very easily as bugs in the product were discovered and resolved.


    ### The MCU Toolchain'
