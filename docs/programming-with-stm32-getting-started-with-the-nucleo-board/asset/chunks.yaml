  raw: 'One of the exceptionally nice features for this mode is that each channel
    is independent and may be configured to have different sample rates, trigger sources,
    and other custom items. This feature is implemented by using a ranks object. By
    using ranks, the MCU does not have to stop and reconfigure each channel for its
    custom configuration. This mode only does one scan and the result numbers are
    often directly stored in a memory using a direct memory access (DMA).


    ### Single Channel/Continuous Conversion


    In this mode, a single channel is continuously being sampled and the resulting
    digital numbers are continuously being stored in memory. This mode almost always
    uses DMA to alleviate excessive load on the MCU. This mode is ordinarily use for
    real-time monitoring of sensors or other environmental devices.


    ### Multi-Channel Scan/Continuous Conversion


    In this mode, multiple channels are being continuously sampled and the resulting
    digital numbers are stored in memory. This mode demands that DMA be used to alleviate
    an intolerable computation load on the MCU. This mode is ordinarily used for comprehensive
    real-time monitoring of sensors or other environmental devices.


    ## Channels, Groups, and Ranks


    The number of channels that can be converted varies with the particular STM MCU
    being used. That number is set at 16 for the STM32F302R8 MCU used in the Nucleo
    project board. Sequences of channel conversions may be set up within independent
    collections known as groups. Channels may be arranged in any order within a specific
    group.


    Input channels are hardware based and thus fixed and linked to specific MCU pins,
    that is, IN0 is the first channel, IN1 the second, and so on. They can, however,
    be logically reordered to form a custom sampling sequence within a group. The
    reordering of channels is done by assigning the input channel to an index ranging
    from 1 to 16. This index is called rank in the HAL.


    [Figure 9-6](#ch9.xhtml_ch9fig6) shows this concept. Although the IN3 channel
    in the figure is fixed, for example, it is connected to PA3 pin in an STM32F302R8
    MCU, it can be assigned to the rank 1 to make it the first channel to be sampled.


    ![images](fig09-06.jpg)


    **Figure 9-6**   *ADC diagram showing channels and ranks.*


    The following C struct is defined for an `ADC_ChannelConfTypeDef`. Each struct
    member will separately be discussed after the struct definition.


    ![Images](c0199-02.jpg)


    The `ADC_ChannelConfTypeDef` struct members are defined in the following list:


    `uint32_t Channel;`—This value specifies the channel to configure into ADC regular
    group. This parameter can be any value of the following ADC_CHANNEL defines:


    ![Images](c0199-05.jpg)


    `uint32_t Rank;`—This value specifies the rank in the regular group sequencer.
    This parameter must be a number between Min_Data = 1 and Max_Data = 16: This parameter
    can be any value of the following ADC_REGULAR_RANK defines:


    ![Images](c0200-01.jpg)


    `uint32_t SamplingTime;`—The sampling time value to be set for the selected channel
    in units of ADC clock cycles. The total conversion time is the addition of sampling
    time and processing time (12 ADC clock cycles at ADC resolution 12 bits, 11 cycles
    at 10 bits, 9 cycles at 8 bits, 7 cycles at 6 bits). This parameter can be any
    value of the following ADC_SAMPLETIME defines:


    ![Images](c0200-03.jpg)


    ***CAUTION:*** *This parameter updates the parameter property of the channel,
    which can be used into regular and/or injected groups. If this same channel has
    been previously configured in the other group (regular/injected), it will be updated
    to last setting. In case of usage of internal measurement channels (VrefInt/Vbat/TempSensor),
    sampling time constraints must be respected (sampling time can be adjusted in
    function of ADC clock frequency and sampling time setting).*


    `uint32_t Offset;`—Reserved for future use, can be set to 0.


    ## ADC Demonstration


    The ADC, like many STM peripherals, can be controlled using one of three methods:


    •   Polling


    •   Interrupt


    •   DMA


    This first demonstration will use polling as the control approach because it is
    the simplest and will allow the focus to be mainly on the ADC process.


    The initial step is to create a reference to a `ADC_HandleTypeDef` struct and
    then assign the appropriate values to struct members that will define the ADC
    instance to be implemented. This new instance will next be configured using the
    `ADC_InitTypeDef` struct, which requires a reference to the now defined `ADC_HandleTypeDef`
    struct. It will time to initialize and start the ADC once all the `ADC_InitTypeDef`
    struct members have been defined. The initialize and start commands are accomplished
    using these calls:


    ![Images](c0201-06.jpg)


    The ADC will then either do one conversion if the single mode was selected or
    continue with a stream of conversions if the continuous mode was selected. In
    the case of the single mode, the `HAL_ADC_Stop()` method must first be called
    to stop the ADC thread and then the `HAL_ADC_Start()` method must be called again
    to do another conversion.


    Any application desiring access to the converted data must use the following method
    when using polling to determine when an ADC conversion has finished and the data
    is available:


    ![Images](c0201-09.jpg)


    The argument methods are a pointer to the `ADC_HandleTypeDef` struct and an integer
    named Timeout representing the maximum number of milliseconds to wait for data
    to be available from the ADC register. It is also possible to use the define HAL_MAX_DELAY
    for the Timeout value, which will cause the system to wait indefinitely for data.
    I would not recommend that approach because it has the potential to “hang” the
    system without any apparent symptom.


    You must use the following method to actually transfer the data from the ADC register
    to any user application:


