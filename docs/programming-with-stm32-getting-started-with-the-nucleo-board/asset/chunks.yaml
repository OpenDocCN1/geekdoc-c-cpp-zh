  raw: 'It can be used as a GP 16-bit timer if desired; however, the PWM mode is especially
    useful for the control of standard and continuous rotation servos. This timer
    may also be linked with the GPx timers for event synchronization and chaining.


    ### General-Purpose Timers (TIMx)


    There are four GP timers available for use. These timers, TIM2, TIM15, TIM17,
    and TIM16, are full-featured timers with 16-bit prescalars. TIM2 is the only 32-bit
    timer, while the rest use 16 bits. All of these timers, except for the basic,
    have up to four channels for the following:


    •   Input capture


    •   Output compare


    •   PWM


    •   Single pulse output


    These timers can work together in a linked manner and they can also link with
    TIM1.


    ### Basic Timer (TIM6)


    The remaining timer is TIM6, which is a basic 16-bit type. It has limited options
    and is used only for the most basic timing feature as its name implies.


    ### Watchdog Timers


    There are two watchdog timers. The first is an independent 12-bit, count-down
    with an 8-bit prescalar. It is driven by a separate 32-KHz crystal, which allows
    it to operate independently from the main MCU clock. It also operates when the
    MCU is in the standby or even stop mode. This allows it to reset the MCU if an
    event happens that inadvertently stops the MCU.


    The second watchdog timer is a free-running 7-bit downcounter that can also be
    set up to reset the MCU in case a problem occurs. This watchdog runs from the
    MCU main clock, but it does have an early-warning interrupt capability, which
    gracefully stops the MCU in case of an unanticipated problem.


    ### SysTick Timer


    There is one more timer, SysTick, but it is not recommended to use. This timer
    is ordinarily dedicated to support real-time operating systems (RTOS). However,
    if the MCU project is not using an RTOS, then the timer is freely available. This
    timer features the following:


    •   A 24-bit downcounter


    •   Autoreload capability maskable system interrupt generation when the counter
    reaches 0


    •   Programmable clock source


    I would say that this timer should only be used as a last resort in the unlikely
    case that all the other timers have been fully committed. I cannot conceive of
    a project complex enough where this would happen.


    ## Bit Serial Ports


    This MCU supports 4-bit serial protocols that allow for serial communication between
    it and other computing systems or peripherals.


    ### USART Serial Protocol


    The first bit-serial protocol to be discussed is the standard Universal Synchronous/Asynchronous
    Receiver/Transmitter (USART). This serial protocol may or may not require a clock
    signal depending upon if it is configured as synchronous or not. The MCU provides
    two USART terminal ports; however, only one named USART2 is active and it is directly
    connected to another USART port on a separate MCU located on the ST-LINK portion
    of the Nucleo-64 PCB. There is also pin pair CN3 located on the ST-LINK that exposes
    the TX and RX lines.


    It is possible to disconnect the USART2 link by opening solder bridges SB13 and
    SB14 and closing solder bridges SB62 and SB63\. If this is done, then the USART2
    port on the main MCU using pins PA2 and PA3 would be connected to CN9, pins 1
    and 2, as well as to CN10, pins 35 and 37, respectively. This would then provide
    a USART port to any compatible serial device located on an extension board.


    A second USART port named USART3 can be enabled by using jumper wires between
    the ST Morpho connectors CN7 and CN3, located on the ST-LINK. For example, on
    this Nucleo-64 board it is possible to use USART3 available on PC10 (TX) and PC11
    (RX). Two jumper wires would need to be connected as follows:


    •   PC10 (USART3_TX) available on CN7 pin 1 to CN3 pin RX


    •   PC11 (USART3_RX) available on CN7 pin 2 to CN3 pin TX


    While this physically restores the USART link, I am fairly sure that the underlying
    ST-LINK communications software would have to be modified to use this new USART
    port number.


    ### I2C Serial Protocol


    The second bit-serial protocol is the Inter-Integrated Circuit interface or I2C
    (pronounced “eye-two-cee” or “eye-squared-cee), which is also known as a synchronous
    serial data link. A clock signal is needed because it is synchronous. [Figure
    1-9](#ch1.xhtml_ch1fig9) is a block diagram of the I2C interface showing one master
    and one slave. This configuration is known as a multidrop or a bus network.


    ![images](fig01-09.jpg)


    **Figure 1-9**   *I2C block diagram.*


    I2C supports more than one master as well as multiple slaves. This protocol was
    created by Philips in 1982 and is a very mature technology, meaning it is extremely
    reliable. Only two lines are used: SCLK for serial clock and SDA for serial data.


    The STM MCU implements three separate I2C buses. These buses can operate at the
    standard clock rate of 100 KHz and the fast rate of 400 KHz. This clock rate can
    be increased by the manufacturer to a nonstandard 1 MHz. However, that would make
    the I2C implementation noncompliant with the protocol. [Table 1-7](#ch1.xhtml_ch1tab7)
    shows the Nucleo-64 pin designations for bus 1 clock and data lines.


    ![images](tab01-07.jpg)


    **Table 1-7**   *I2C Signal Lines*


    ### SPI Serial Protocol


    The third bit-serial protocol that I will discuss is the Serial Peripheral Interface
    (SPI), which is shown in [Figure 1-10](#ch1.xhtml_ch1fig10).


    ![images](fig01-10.jpg)


    **Figure 1-10**   *SPI block diagram.*


    SPI (pronounced “spy” or “ess-pee-eye”) is also known as a synchronous serial
    data link. It is also a full duplex protocol, meaning data can be simultaneously
    sent and received between the host and slave. SPI is also referred to as a Synchronous
    Serial Interface (SSI) or a 4-wire serial bus.


    The MCU supports five SPI links in slave and master modes using full-duplex and/or
    simplex communication. The interfaces are labeled SPI1 to SPI5 and can use a clock
    rate of up to 25 Mbits/s. The data may be framed in either a byte or double-byte
    format. There is also automatic error correction in the form of CRC generation
    and verification.


    [Table 1-8](#ch1.xhtml_ch1tab8) shows the Nucleo-64 pin designations for SPI2.


    ![Images](tab01-08.jpg)


    **Table 1-8**   *SPI2 Signal Lines*


    ### Inter-Integrated Sound


    The fourth and final bit-serial interface to be discussed is the inter-integrated
    sound (I2S) interface. There are five standard I2S interfaces that are multiplexed
    with SPI1 to SPI5\. I2S2 and I2S3 may be operated in a master or slave mode, in
    either simplex or full-duplex communication modes, and can be configured to operate
    with a 16/32-bit resolution as an input or output channel. All I2Sx interfaces
    can have audio sampling frequencies from 8 kHz up to 192 kHz. Finally, the master
    I2S clock can be output to the external DAC/CODEC at 256 times the sampling frequency
    when either I2S2 or I2S3 interface is configured in a master mode.


    The above discussion is simply informational because I will not be demonstrating
    the I2S interface.


    ## Nucleo-64 Board Options


    The following sections discuss options specific to the Nucleo-64 board and are
    presented to provide you with some options when working with the board.


    ### LEDs


    LD1 is a tricolor LED located on the ST-LINK PCB and provides information concerning
    the state of communications between the ST-LINK, the host PC, and the main MCU.
    The following list shows the various LED states and the corresponding meaning:


    •   Slow blinking Red/Off: at power-on before USB initialization


    •   Fast blinking Red/Off: after the first correct communication between the PC
    and ST-LINK/V2-1 (enumeration)


    •   Red LED On: when the initialization between the PC and ST-LINK/V2-1 is complete


    •   Green LED On: after a successful target communication initialization


    •   Blinking Red/Green: during communication with target


    •   Green On: communication finished and successful


    •   Orange On: communication failure


    LD2 is a green LED-labeled user and connected to Arduino signal D13 (CN5/CN6),
    which corresponds to STM32 I/O PB13'
