  trans: '


    书中使用的 Nucleo-64 开发板是 STM MCU，型号号为 `STM32F302R8`。该芯片具有 64-KB 的闪存内存和 16-KB 的静态随机访问存储器（`SRAM`）。是的，这些是千字节，而不是兆字节或千字节。你不能期望在这个有限的内存空间内运行任何图形化程序。微控制器程序确实是对计算机极早期的回溯，那时内存非常有限，开发者必须利用每一个可用字节来存储和执行程序。既然提到了稀缺的内存资源，你将可以使用各种现代图形界面程序来开发
    MCU 程序，但它们将在 PC 上运行。编译并优化的二进制代码将从 PC 下载到 MCU 中。


    事实证明，64 `KB` 的空间对于足够运行相当庞大的程序了，因为本书项目使用的 C/C++ 交叉编译器会产生优化代码，消除了程序运行所需的本质指令以外的所有指令。16-KB
    的 `SRAM` 大小足以支持最大为 64-KB 大小程序的动态内存需求。实际内存集成在 MCU 芯片上，其类型对我们的目的而言在很大程度上并不重要。


    ### 外设


    外设使 MCU 能够实现其预期用途的关键。在我的微控制器定义中，我提到“一组符合所有设计要求的外设”。这意味着微控制器通常根据其设计要满足的要求而具有不同的外设配置。这是
    STM 制造如此多种 MCU 的主要原因。我将重点关注上面提到的 Nucleo-64 微控制器，并以其外设集作为我的讨论点。接下来，我需要演示如何设置 Nucleo-64
    开发板，以充分解释所有外设功能是如何在该板上协同工作的。


    ### Nucleo-64 开发板布局


    图 1-3 是一个显示构成 Nucleo-64 开发板的主要组件配置的框图。


    ![images](img/fig01-03.jpg)


    **图 1-3** *Nucleo-64 框图。*


    你应该注意的第一点是，该板实际上由两个部分组成，顶部部分是一个 `ST-LINK/V2-1` 编程器，底部部分是 `STM32 MCU`。底部还配备了两组连接器。其中一组与
    Arduino 扩展板引脚配置兼容，另一组是 ST Morpho 引脚配置。图中显示了两个推动按钮，`B1` 和 `B2`。`B1` 是多用途的，而 `B2`
    是复位推动按钮。图中还指示了一个 LED；然而，在随后的图中还显示了其他几个 LED。通过折断稀疏的印制电路板（`PCB`）焊点，可以将编程器部分与微控制器部分分离，这可以在图
    1-1 中看到。我不建议这样做，因为你将失去 MCU 部分的所有编程能力。我假设它以这种方式设置是为了以便在特定项目有了可以运行的 MCU 且不再需要进一步编程时，你可以这些部分分开。


    图 1-4 是 Nucleo-64 开发板的顶视图，大部分组件都有了清晰的注释。


    ![images](img/fig01-04.jpg)


    **图 1-4** *Nucleo-64 开发板注释顶视图。*


    值得注意的是，板上的组件相对较少。大部分空间被连接器、推动按钮、配置跳线、LED 和微控制器芯片占据。这种稀疏的布局反映了 MCU 的本质，它是一个嵌入式设备，没有任何人机交互（`HCI`）所需的便利功能。通过使用插入此板的适当扩展板，可以在此板上实现
    HCI。


    图 1-5 显示了 Nucleo-64 开发板的背面。


    ![images](img/fig01-05.jpg)


    **图 1-5** *Nucleo-64 开发板注释底视图。*


    图中除了一些 0 姆电阻外没什么看到的，如果需要，可以移除这些电阻以禁用某些功能（如复位键、用户按钮和用户 LED），或者对 ST-LINK 编程器进行硬件配置更改。


    图 1-6 更有趣，因为它显示了 Nucleo-64 开发板顶部所有连接器的引脚定义。


    ![images](img/fig01-06.jpg)


    **图 1-6** *Nucleo-64 引脚图。*


    在图 1-6 中显示了两组引脚定义，一组属于 Arduino，另一组属于 ST Morpho。连接器 `CN5`、`CN6`、`CN8` 和 `CN9` 属于
    Arduino 。连接器 `CN7` 和 `CN10` 属于 Morpho 组。重要的是，这些组之间没有一一对应的关系。Morpho 连接器是两排每排 38
    个脚，共 76 个脚。Arduino 连接器是单排连接器，分布在四个连接器中总共 32 个脚。


    ### Arduino 连接器


    表 1-1 到 1-4 详细列出了带有 STM32 引脚的 Arduino 连接器。


    表 1-1 详细列出了 CN6 连接器。参考图 1-4 查看 CN6 在板上的位置。


    ![Images](img/tab01-01.jpg)


    **表 1-1** *CN6 引脚图*


    引脚 3 将复位 MCU。STM32 引脚标记 `NRST` 代表不可掩的复位，这意味着该引脚上的低电平会被识别为强制复位。引脚 2 和 4 提供 3.3
    V，但我建议从这些引脚抽取的电流要小，否则可能会干扰板运行。引脚 5 提供 5 V，但同样注意大电流抽取。`VIN` 是你可以连接外部电源的地方。根据连接此引脚的电压调节器，输入电压范围约为
    7 到 12 V。必须切换跳线 `JP5` 以适应外部电源。最后，`IOREF` 引脚允许 Arduino 板将 I/O 电板调整为 3V3。


    表 1-2 详细列出了 CN8 连接器。参考图 1-4 查看 CN8 在板上的位置。


    ![Images](img/tab01-02.jpg)


    **表 1-2** *CN8 引脚图*


    这些引脚是连接到 MCU 多通道模数转换器（`ADC`）的模拟电压输入。你必须将模拟输入电压限制在 3.3 V 或以下，以免损坏 ADC 输入。注意 Arduino
    通道与 MCU 通道之间没有一一对应关系。引脚 5 和 6 是默认 ADC 输入。如果你需要它们作为总线 1 I2C 输入，你必须断开焊桥 `SB51` 和
    `SB56` 并连接 `SB42` 和 `SB46`。这些连接是通过 MCU 板背面的 0 姆电阻实现的。请注意总线 1 I2C 连接已在连接器 `CN5`
    的引脚 1 和 2 上可用。


