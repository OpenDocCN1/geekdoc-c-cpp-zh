    This requirement for core processor involvement ties up precious cycles that otherwise
    could be utilized for more efficient operations. A somewhat analogous model is
    where data is represented by cars and the processor by a city. Cross-country drivers
    wanting to go to a distant location are forced to go through a city with all its
    traffic lights and congested streets. It would be much better for the drivers
    if a bypass highway were available, allowing them to avoid going through the city.
    The DMA controller plays the role of the bypass.


    Returning to [Figure 11-1](#ch11.xhtml_ch11fig1), you should be able to see that
    DMA1 controller, in the case of the STM32F302R8 MCU, connects directly to the
    Bus Matrix. This controller, as I earlier mentioned, is set up to be a bus controller
    or master and thus is able to configure the Bus Matrix to directly connect data
    between peripherals and internal memory, memory to memory, or even to another
    peripheral. These configurations are naturally named as follows:


    •   Peripheral-to-memory transfers


    •   Memory-to-peripheral transfers


    •   Peripheral-to-peripheral transfers


    •   Memory-to-memory transfers


    The Bus Matrix controls the access of both the core processor and the DMA controller
    to various data busses, memory, and peripherals. It implements this control with
    a Round Robin algorithm, which ensures equitable access to both controllers. [Figure
    11-3](#ch11.xhtml_ch11fig3) is a block diagram illustrating how the Bus Matrix
    is connected with all the system components.


    ![images](fig11-03.jpg)


    **Figure 11-3**   *Bus Matrix block diagram.*


    The Bus Matrix is a complex circuit that interconnects the following master and
    slave devices:


    •   Core Cortex-M processor (master)


    •   DMA controller(s) (master)


    •   Flash memory interface (FLITF) using the ICODE (slave)


    •   Flash memory interface (FLITF) using the DCODE buss (slave)


    •   Direct connection to SRAM (slave)


    •   Advanced High-Speed Bus 1 (AHB1), which connects to the Advanced Peripheral
    Busses (AHB1 and AHP2) through bridge circuits (Bridge 1 and Bridge 2) (slave)


    •   Advanced Peripheral Bus (APB) connected to the GPIO pins (slave)


    •   Direct connection to the ADC1 peripheral (slave)


    ## DMA Controller Details


    Every STM32 DMA controller contains two master ports, one named the memory port,
    which connects to internal memory such as SRAM and flash. The other is named the
    peripheral port and it connects to the Advanced High-Performance Bus (AHB). The
    AHB in turn connects with the slave peripherals. In the STM32F302R8 DMA controller,
    the peripheral port can also connect to a memory control circuit permitting memory-to-memory
    transfers.


    STM32 DMA controllers also have one slave port connected to the AHB bus. This
    allows the DMA controller to be programmed from the other master, that is, the
    core processor.


    The STM32F302R8 DMA controller has seven independent and programmable channels,
    which are each connected to separate hardware lines. These are how the slave peripherals
    can request a response from the DMA controller. The exact nature and type of request
    is configured during the MCU hardware design phase. Different STM MCUs will have
    a varying numbers of channels as well as different request types depending upon
    the MCU design requirements.


    There is also a priority assignment hardware unit, which allows different priorities
    to be assigned to the seven DMA request channels. Higher priorities will normally
    be assigned to fast peripherals needing immediate DMA response as well as to any
    memory accesses.


    [Figure 11-4](#ch11.xhtml_ch11fig4) shows all seven DMA channels along with their
    respective peripheral request signals that are bound to them during the MCU design
    phase.


    ![images](fig11-04.jpg)


    **Figure 11-4**   *DMA channel block diagram.*


    [Figure 11-4](#ch11.xhtml_ch11fig4) is an important figure because it will be
    your ready reference to use when trying to determine which DMA channel to use
    for a given peripheral DMA request. It is very important to note that only one
    peripheral can be active on a given peripheral request line.


    Notice in [Figure 11-4](#ch11.xhtml_ch11fig4) that the DMA channels have default
    priorities, which are fixed in hardware with channel 1 being the highest and progressing
    to channel 7 as the lowest. However, these default priorities may be overridden
    with user-assigned priorities, designed to determine which peripherals have preference
    when accessing the AHB. DMA channel lines are normally trigged through hardware
    signals from selected peripherals but they can also be activated by software.
    Software triggering is the means by which memory-to-memory transfers are activated.


    ## Using HAL with DMA


    The HAL framework uses a C struct named `DMA_HandleTypeDef` to configure the DMA
    controller. Each member will separately be discussed after the struct definition.


    ![Images](c0246-02.jpg)


    The `DMA_HandleTypeDef` struct members are briefly defined in the following list:


    •   `DMA_Channel_TypeDef *Instance;`—This is the pointer to the DMA/Channel pair
    descriptor which will be used. For example, DMA1_Channel5 indicates the fifth
    channel of DMA1\. Recall that these designations are bound to peripherals during
    the MCU design. Refer to [Figure 11-4](#ch11.xhtml_ch11fig4) to see the channel-to-peripheral
    designations.


    •   `DMA_InitTypeDef Init`;—This is an instance of the C struct `DMA_InitTypeDef`,
    which is used to configure the DMA/Channel pair. This value will be further explained
    below.


    •   `HAL_LockTypeDef Lock;`—DMA locking object.


    •   `__IO HAL_DMA_StateTypeDef State;`—DMA transfer state.


    •   `void *Parent;`—This is a pointer used to keep track of the peripheral handlers
    associated with the current DMA/Channel. For example, if we are using a UART in
    DMA mode, this field will point to an instance of `UART_HandleTypeDef`.


    •   `void (* XferCpltCallback)(struct __DMA_HandleTypeDef *hdma);`—This is a pointer
    to a callback function, which is used to signal user code that a DMA transfer
    is completed. It is automatically called by the HAL when a DMA interrupt is paired,
    by the function `HAL_DMA_IRQHandler()`.


    •   `void (* XferHalfCpltCallback)(struct __DMA_HandleTypeDef *hdma);`—This is
    a pointer to a callback function, which is used to signal user code that a DMA
    transfer is completed, half-completed, or an error occurred. It is automatically
    called by the HAL when a DMA interrupt is paired by the function `HAL_DMA_IRQHandler()`.


    •   `void (* XferErrorCallback)(struct __DMA_HandleTypeDef *hdma);`—This is a
    pointer to a callback function, which is used to signal user code that a DMA transfer
    has an error. It is automatically called by the HAL when a DMA interrupt is paired
    by the function `HAL_DMA_IRQHandler()`.


    •   `__IO uint32_t ErrorCode;`—DMA error code.


    The HAL framework uses a C struct named `DMA_InitTypeDef` to initialize the DMA
    controller. Each member will separately be discussed after the struct definition.


    ![Images](c0248-21.jpg)


    ![Images](c0249-01.jpg)


    The `DMA_InitTypeDef` struct members are briefly defined in the following list:


    •   `uint32_t Direction;`—This value defines the DMA transfer direction. This
    parameter can be any value of the following defines:


    •   `DMA_PERIPH_TO_MEMORY`


    •   `DMA_MEMORY_TO_PERIPH`


    •   `DMA_MEMORY_TO_MEMORY`'
