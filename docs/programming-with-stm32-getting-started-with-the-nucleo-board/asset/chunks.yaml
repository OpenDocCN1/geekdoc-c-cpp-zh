    MHz 对于极高速度数据通信等对要求的较高的应用可能会出现问题。我的实验结果实际上与 STM 对极速设置 75 MHz 和低速设置 25 MHz 的估计值非常接近。


    ## 总结


    本章的重点是如何操作 GPIO 引脚和 HAL（硬件抽象层）。我首先回顾了 STM 外围器是如何进行内存映射的，因为这是 MCU 配置和控制它们的根本基础。


    接下来，我讨论了典型的 GPIO 硬件引脚是如何设置的，以及它可以配置的各种功能，包括输入、输出、模拟角色或复用功能。还讨论了与 GPIO 引脚相关的各种控制寄存器。


    接着展示了一个简单的 LED 测试演示，我在其中使用了插入到 Arduino 面板插座中的 LED/电阻组合。该面板反过来插入到 Nucleo-64 开发板中。我详细介绍了点亮
