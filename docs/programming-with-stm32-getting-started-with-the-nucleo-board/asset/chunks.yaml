    Right away, you can see from the definition that a MCU contains a microprocessor
    which is sometimes referred to as a microcomputer. There also must be both dynamic
    or volatile memory as well as nonvolatile or static memory, where the latter holds
    any programs or scripts necessary to run the microprocessor. Finally, there are
    always peripherals added to the design that allow for the input and output of
    digital signals. There are often additional peripherals such as timers, interrupt
    controllers, serial data ports, and a variety of others depending upon what requirements
    the MCU must meet.


    I discuss all the principal MCU components below to provide you with a solid background
    to understand how a MCU functions. Most of the following explanations are based
    on the voluminous amount of information provided by STM on their microcontrollers.
    The reason behind STM providing such a large amount of information is to allow
    engineers/software developers access to all the data they need in order to incorporate
    STM products into original equipment manufacturer (OEM) designs and products.
    This approach is fundamentally different than the approach taken by suppliers
    of maker style boards and products, such as the `Arduino`, `Raspberry Pi`, `BeagleBone`,
    and so forth. In the case of the latter, board documentation is geared toward
    how to use a board in a project. The STM data is extremely specific describing
    items such as the nanosecond timing pulses between memory chips and processor
    buses. This is exactly the reason why some of the STM MCU datasheets are over
    1,100 pages in length. Fortunately, the datasheet for the primary STM MCU I will
    be using in this book is only 138 pages. I will provide later in this chapter
    the website where you can download the datasheet.


    ## STM Nucleo Boards


    MCU manufacturers such as `STM` have long recognized that they just couldn’t provide
    only chips to potential customers as most would have no way to effectively evaluate
    them for potential use in their products. This is the reason why the manufacturers
    offer relatively low-cost evaluation and demonstration boards, which have representative
    MCUs all setup and ready to run. STM offers a series of such boards that it calls
    the `Nucleo` line. I will be using a fairly simple `Nucleo-64` board for the book
    projects. STM has actually embraced the maker community by marketing the `Nucleo`
    lineup as boards suitable for maker project use. These boards are very inexpensive,
    usually about US$10–15, which leads me to believe that STM is striving to gain
    a foothold in the maker community by actually subsidizing the manufacturing costs
    for the boards. In any case, this is a boon for makers and hobbyists and one that
    we should embrace.


    [Figure 1-1](#ch1.xhtml_ch1fig1) shows the three basic Nucleo boards available
    at the time of writing this book.


    ![images](fig01-01.jpg)


    **Figure 1-1** Three basic Nucleo boards.


    The boards are named `Nucleo-32`, `Nucleo-64`, and `Nucleo-144` from left to right,
    respectively, as shown in [Figure 1-1](#ch1.xhtml_ch1fig1). The number in each
    name represents the number of pins present in the MCU chip. `Nucleo-64` is the
    principal board used in this book.


    ## Principal MCU Components


    The first component to consider is the processor or microcomputer.


    ### Processor


    The processor used in `Nucleo-32` and `Nucleo-64` boards is the `ARM Cortex M-4`
    32-bit processor. It too has a lengthy 278-page user guide available from `infocenter.arm.com/help/topic/com.arm.doc.dui0553a/DUI0553A_cortex_m4_dgug.pdf`](http://infocenter.arm.com/help/topic/com.arm.doc.dui0553a/DUI0553A_cortex_m4_dgug.pdf).
    The actual processor circuitry is part of the `STM MCU` because STM has purchased
    intellectual property (IP) rights from the `ARM Corporation` in order to integrate
    it into its chips. However, for all practical purposes, the `ARM` processor is
    programmed using the tools and techniques promulgated by the `ARM Corporation`
    to support its processor IP. This distinction is of no consequence in our case
    because the software tools to be used for the book projects have all been carefully
    crafted and tested to work seamlessly together by STM. Any license issues have
    already been resolved without bothering the end user.


    The following list contains some of the important specifications for the `Cortex
    M-4` processor for interested readers:


    - Full-featured `ARMv7-M` instruction set, optimized for embedded applications

    - Floating point unit (`FPU`)

    - Low-power 32-bit processor

    - Memory protection unit (`MPU`)

    - Nested vector interrupt controller (`NVIC`)

    - Trace, breakpoint, and JTAG capabilities

    - Advanced Microcontroller Bus Architecture (`AMBA`)

    - Advanced High-Performance Bus (`AHB5`, `AHB`-`Lite`)


    There are many more features to the `Cortex M-4` processor as the 278-page user
    guide would suggest. I would also recommend Joseph Yiu’s book, *The Definitive
    Guide to ARM*® *Cortex*®*-M3 and Cortex*^®*-M4 Processors*, Third Edition, to
    readers who really want to delve into this processor to a great depth.


    [Figure 1-2](#ch1.xhtml_ch1fig2) is a block diagram of the `Cortex M-4` processor
    showing all of the listed items and more.


    ![images](fig01-02.jpg)


    **Figure 1-2** ARM Cortex M-4 block diagram.


    STM is responsible for the design and implementation of all components outside
    of the box shown in [Figure 1-2](#ch1.xhtml_ch1fig2). Of course, the STM design
    must be compliant with the `ARM` processor specifications. One item missing in
    the figure is a clock input. The reason for it being missing is that the block
    diagram is from the `ARM Cortex M-4` user guide, while the clock circuitry is
    the responsibility of STM, the MCU designer. STM has set the base processor clock
    frequency at `72 MHz`, which appears to be very low in today’s world of multi-gigahertz
    clock rates for most PCs. In fact, the latest `Raspberry Pi` model 3 has a `1.2-GHz`
    clock rate. But first appearances are deceiving in this case. The `Cortex M-4`
    processor uses an extremely efficient instruction set, with three-stage pipelining,
    which maximizes the performance of the underlying reduced instruction set computing
    (`RISC`) that the processor employs. In addition, many common microcontroller
    tasks, which I discuss below, have been implemented in a combination of hardware
    and firmware, further improving the overall performance, while keeping the power
    consumption as low as possible. Power consumption and performance are two key
    microcontroller attributes that system designers always keep in mind. Keeping
    the clock rate as low as possible will always minimize the power consumed as well
    as increase the longevity of the chip.


    ### Memory


    The `Cortex M-4` processor uses a `Harvard` architecture. This means that program
    instructions are stored and retrieved from a memory separate and distinct from
    the memory that holds data. The other common computer architecture is named `von
    Neumann` in which instructions and data share a common memory. MCUs have very
    limited memory and take advantage of the speed-up available by using concurrent
    instruction and data access. Additionally, having separate memories means that
    the processor is no longer constrained to the same sized data widths. This means
    instructions can be fetched and executed in `4-byte` chunks or `32 bits`, while
    data can be simultaneously handled with `1-byte` or `8-bit` chunks, thus speeding
    up the overall throughput to and from the processor and memory. Another advantage
    the `Harvard` architecture has over the von Neumann` form is that instruction
    prefetches can now be done in parallel with regular instruction executions, thus
    further speeding up the overall system performance. Finally, concurrent instruction
    and data access eliminates the need for data caches, which are typically used
    in `von Neumann` machines. This further reduces system complexity and power consumption.

