    33 年里，他主要在 SNHU 和其他地区学校教授了计算机科学和技术领域的许多本科和研究生课程。Don 在 SNHU 创建并教授了最初的线下和在线机器人课程。


    Don 从美国海军民政府服务部门退休，他专攻与核潜艇相关的水下声学以及相关的数字信号处理系统。从那时起，他花了 23 多年担任专业软件开发人员，在各种开发项目中使用
    `C`、`C#`、`C++`、`Python`、`Micro Python`、`Node.JS`、`JavaScript` 和 `Java` 语言。在过去的六年里，他一直担任认证的
    IT 安全顾问。


    他编写并出版了七本书，其中三本涉及树莓派（Raspberry Pi），一本关于如何制造和飞行无人机，一本关于 Intel Edison 的书，一本关于物联网以及一本关于
    Micro Python 的书。


    Don 创立了一家咨询公司 Norris Embedded Software Solutions（注册名为 NESS LLC），专门从事使用微控制器、传感器和执行器开发应用程序解决方案。该业务最近还为客户完成了几个机器人项目。


    Don 喜欢认为自己是一个永久的爱好者和极客，并不断尝试新技术和跳出框架的实验。他是有执照的私人飞行员、摄影爱好者和业余无线电操作员。


