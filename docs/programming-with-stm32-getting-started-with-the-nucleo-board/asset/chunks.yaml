- fmt: '

    An analog servo is essentially an electric motor that has a built-in electronic
    circuit that converts specific pulse widths into a proportional rotation. The
    specifications for hobby-grade analog servos are fairly “relaxed” meaning that
    there are loose tolerances relating pulse width to physical rotation. This is
    mainly due to the use of very low cost components in both the electrical and mechanical
    components that comprise the servo. [Table 10-2](#ch10.xhtml_ch10tab2) details
    pulse width and expected rotation.


    ![images](tab10-02.jpg)


    **Table 10-2**  *Pulse Width and Servo Rotation*


    An analog servo should not move from its neutral position when it is sent a repetitive
    1.5-ms pulse signal. A 1.0-ms pulse train will cause it to rotate its main shaft
    counter-clockwise 60°if viewed from head-on. Similarly, a 2.0-ms pulse train will
    cause it to rotate clockwise 60°. However, loose tolerances come into play and
    often the degree of rotation can be 10° to 15°, more or less.


    In all cases, the pulse train frequency is set at a nominal 50 Hz or 20 ms period.


    [Figure 10-13](#ch10.xhtml_ch10fig13) shows the hobby-grade servo I used for this
    demonstration. It is a Hitec model HS-311, which is a reliable, well-built servo.


    ![images](fig10-13.jpg)


    **Figure 10-13**  *Hitec model HS-311 analog servo.*


    This servo takes quite a bit of current to operate, somewhat in excess of what
    the STM project board can provide. Consequently, I used a separate supply for
    it as may be seen in the [Figure 10-14](#ch10.xhtml_ch10fig14) connection schematic.


    ![images](fig10-14.jpg)


    **Figure 10-14**  *Servo connection schematic.*


    The servo control signal from the PWM output only requires several milliamperes,
    which is well within the GPIO pin drive capabilities.


    [Figure 10-15](#ch10.xhtml_ch10fig15) shows the waveform for the 1.5-ms neutral
    position signal. It is a nice, clean signal with sharp rise and fall times, which
    are important for proper servo control.


    ![images](fig10-15.jpg)


    **Figure 10-15**  *1.5-ms servo control signal.*


    The 1.0-ms and 2.0-ms waveforms are very similar except for the pulse width.


    [Figure 10-16](#ch10.xhtml_ch10fig16) shows the physical setup with the analog
    servo connected to a solderless breadboard, which in turn is connected to the
    Arduino protoboard with jumper wires.


    ![images](fig10-16.jpg)


    **Figure 10-16**  *Servo test setup.*


    ### Test Results


    I first changed the `CCR1` value to 148, which causes a 1.5-ms pulse width to
    be generated. The servo immediately moved to its neutral position after the program
    was downloaded into the project board. I repeated the previous step with a `CCR1`
    equal to 98, which generates a 1.0-ms pulse width. The servo responded by moving
    its main shaft 60° counter-clockwise. Finally, I changed `CCR1` to 196, which
    generates a 2.0-ms pulse width. The servo’s main shaft rotated clockwise 120°
    as expected.


    The servo performed flawlessly and showed no signs of jitter or vibration, which
    sometimes occurs with using hobby-grade servos.


    I next added some functional code and placed it in the forever loop to continuously
    exercise the servo, thus eliminating the need to edit, rebuild, and download the
    controlling program.


    ## Adding Functional Test Code


    The following C code was placed within the `main.c` file in order to continuously
    control the servo. This code caused the servo main shaft to slowly oscillate between
    the ±60° end points.


    ![Images](c0239-01.jpg)


    ## Test Results


    I observed the servo main shaft to slowly oscillate between the end points as
    expected after the modified code was downloaded into the project board.


    This final demonstration concludes the chapter. I believe I have provided you
    with a sufficient background that will enable you to successfully use servos with
    a STM Nucleo board.


    ### Summary


    I started this chapter on pulse width modulation (PWM) by explaining what makes
    up a PWM signal and detailing certain key properties of that signal. This was
    followed by a brief discussion of how the STM timer hardware generates a PWM signal.


    Next came a discussion on how the HAL framework is used to both configure and
    initialize a general purpose (GP) timer to emit a PWM signal.


    A complete C code listing was shown that generated a PWM signal with a 50% duty
    cycle and a 50-Hz output frequency.


    Next followed the first of four PWM demonstrations. The first PWM demonstration
    just output the 50% duty cycle waveform that was generated by the project board
    after the code was built and downloaded into the board.


    The second demonstration used a varying duty-cycle waveform to dim and brighten
    a red LED.


    The third demonstration used multi-channel PWM waveforms to control both the color
    and intensity of a RGB LED.


    The fourth and final demonstration illustrated how to control a standard analog
    servo using PWM signals.


    ## 11


    ## Direct Memory Access (DMA) and the Digital-to-Analog Converter (DAC)


    This chapter content is carefully chosen to explain direct memory access (DMA)
    and the very useful digital-to-analog converter (DAC) peripheral, which takes
    advantage of efficient DMA transfers. There are several demonstration projects
    shown in the chapter, which show both DMA and DAC


    ### DMA


    Data is normally transferred by using instructions executed by the Cortex-M core
    processor. This data is normally sent to or internal memories and peripherals.
    This data transfer process consumes valuable processor cycles that could be put
    to use within a constrained embedded system. This is the reason why the DMA controller
    was designed. It can assume the data transfer process in many cases and allow
    the core processor to take on other embedded system processes.


    Technically, the DMA controller can be considered a peripheral device; however,
    I prefer to think of it as like a co-processor than a peripheral. Unlike any other
    peripheral, the DMA controller can take on the role of being a bus master, which
    is not allowed for any other device other than the core processor itself. In fact,
    thinking of the DMA controller as more of a bus controller is a good way to view
    this device.


    [Figure 11-1](#ch11.xhtml_ch11fig1) is a block diagram for the DMA controller
    used in the project board’s STM32F302R8 MCU. This figure will be very useful in
    explaining how the DMA controller works.


    ![images](fig11-01.jpg)


    **Figure 11-1**  *DMA block diagram.*


    ***NOTE***  DMA2, SPI1, TIM3, TIM4, UART4, UART5, and ADC2 are not available in
    the STM32F302R8 MCU.


    It would be worthwhile to consider some of the basics of data transfers before
    going into the specifics of DMA operations.


    ## Basic Data Transfer Concepts


    [Figure 11-2](#ch11.xhtml_ch11fig2) is a simplified system block diagram where
    all the DMA components have been removed from [Figure 11-1](#ch11.xhtml_ch11fig1).
    The purpose of this diagram is to focus on how data transfers happen between the
    core processor and all remaining system peripherals.


    ![images](fig11-02.jpg)


    **Figure 11-2**  *Data transfers between the core processor and system peripherals.*

