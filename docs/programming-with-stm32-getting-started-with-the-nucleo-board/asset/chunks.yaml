    HAL 框架来调用连接到蓝色按键的 GPIO 引脚 PC13 的相应中断。`ISR` 包含了切换 LD2（连接到 GPIO 引脚 PA5）的代码。


    以下是项目中 `main.c` 文件的完整代码列表。代码关键部分的讨论将在列表之后。


