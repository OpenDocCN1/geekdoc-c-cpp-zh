- fmt: '

    The analog voltage reference (`AREF`) should be connected to 3.3 V because that
    is the maximum allowed voltage to be input to the MCU ADC channels. If you have
    another supply available with a lesser voltage, say 2.5 V, then you can connect
    `AREF` to that and increase the ADC dynamic range by a third. Just be aware that
    inputting a voltage greater than 2.5 V will not change the ADC output, effectively
    saturating it. Pins 3 to 6 may be configured as general-purpose input/output (`GPIO`)
    or act as the bus #2 serial peripheral interface (`SPI`). Pins 2, 3, and 4 can
    also act as timer pins if neither the GPIO nor the SPI is required.


    [Table 1-4](#ch1.xhtml_ch1tab4) details the CN9 connector pinout. Refer to [Figure
    1-4](#ch1.xhtml_ch1fig4) to see the placement of CN9 on the board.


    ![Images](tab01-04.jpg)


    **Table 1-4** *CN9 Pinout*


    These eight pins are normally regular `GPIO`, but they may be reconfigured so
    that pins 4, 6, and 7 are timer pins. In addition, pins 1 and 2 can act as the
    #2 USART.


    ### Morpho Connectors


    [Table 1-5](#ch1.xhtml_ch1tab5) is from the Nucleo-64 User Guide and details the
    STM Morpho connections with references to the STM32 pins. I have provided further
    clarifications on some of the pin functions following the table, where I felt
    it was appropriate. I did not repeat the comments I provided for Arduino connection
    as they are equally valid for the Morpho connections.


    ![Images](tab01-05.jpg)


    **Table 1-5** *CN7 and CN10 Pinouts*


    [Table 1-5](#ch1.xhtml_ch1tab5) details the CN7 and CN10 connector pinouts. Refer
    to [Figure 1-4](#ch1.xhtml_ch1fig4) to see the placement of CN7 and CN10 on the
    board.


    `U5V` is 5-V power supplied from the ST-LINK/V2-1 USB connector. The `BOOT0` input
    pin allows for changing how the MCU initially boots during a power-on event. I
    will discuss the boot options in a later chapter. `VBAT` input is often used as
    a battery backup for powering a real-time clock or a security key. It is typically
    tied to `VCC` if not used for a battery backup.


    The next series of MCU components that I will discuss enable the MCU to perform
    its operations more efficiently and quickly than possible by relying on software
    constructs.


    ### Nested Vectored Interrupt Controller (NVIC)


    Interrupts are essential elements in the MCU structure. Without them, MCUs cannot
    efficiently function given the limited memory available and low clock speeds.
    MCU interrupts are implemented both in hardware and software. But first I need
    to define what an interrupt is and how it is used:


    *An interrupt is a disruption in the normal flow of a program initiated by an
    external or temporal event.*


    [Figure 1-7](#ch1.xhtml_ch1fig7) is a flow diagram of a generic interrupt sequence.
    This diagram will make it easier to understand how an interrupt works.


    ![images](fig01-07.jpg)


    **Figure 1-7** *Interrupt flow diagram.*


    `ISR` in [Figure 1-7](#ch1.xhtml_ch1fig7) stands for interrupt service routine,
    which is the program code that executes whatever needs to be accomplished due
    to the interrupt. The block containing the phrase “Call ISR” causes the current
    state or context of the MCU to be saved in `SRAM`. The current state typically
    consists of the contents of program counter (`PC`) and a preset number of registers
    that depends on the MCU model. The `PC` is a register, which contains the address
    of the next instruction to be executed when the interrupt was recognized. The
    actual `ISR` code may be located anywhere in memory because it is accessed by
    replacing the `PC` with the first address of the `ISR`. That address is contained
    in a list, which is known as the vector interrupt list. The last instruction in
    an `ISR` is always a return from interrupt, which restores the MCU’s pre-interrupt
    state and resumes executing instructions at the stored `PC` address.


    The figure is slightly off target and shows a block in the `ISR` section containing
    the phrase “Enable interrupt system.” The STM `NVIC` uses prioritized interrupts,
    which means a higher priority interrupt can always interrupt a lower priority
    interrupt while it is executing. This normally is not possible with a purely software-implemented
    interrupt scheme, which is depicted by the figure’s flow diagram.


    [Figure 1-8](#ch1.xhtml_ch1fig8) shows two ways the `NVIC` handles multiple interrupt
    requests (`IRQs`).


    ![images](fig01-08.jpg)


    **Figure 1-8** *NVIC handling multiple IRQs.*


    I don’t believe it makes much difference on how the `NVIC` handles interrupts
    for most non-safety-related projects. However, it would be very important if a
    designer was creating a safety critical system. One case that came to mind was
    an automotive control system, in which a STM MCU was managing a variety of systems
    including the infotainment system and a collision avoidance system. I certainly
    think that a collision avoidance `IRQ` would need immediate attention if the MCU
    was processing a radio station change request at the time the higher priority
    `IRQ` was received.


    The `NVIC` used in the Nucleo-64 MCU project board has the following specifications:


    - Sixteen interrupt lines

    - Sixteen priority levels

    - Up to 62 maskable interrupt

    - Low-latency interrupt

    - Supporting tail chaining

    - Interrupt entry

    - No instruction overhead


    I will discuss how to program `ISRs` in the software.


    ### General-Purpose Inputs/Outputs (GPIO)


    Each of the 51 `GPIO` pins can be configured as output with push-pull or open-drain
    and with or without pull-up or pull-down. All `GPIOs` are high-current-capable
    and have limited speed selection to better manage internal noise, power consumption,
    and electromagnetic emission.


    ### Analog-to-Digital Converter (ADC)


    There is one 12-bit `ADC` that has 16 channels. `ADC` conversions can be done
    in either single-shot or scan mode. In the scan mode, an automatic conversion
    is performed on a preselected group of analog inputs. An interrupt can be generated
    if a converted voltage is outside preset threshold. In addition, a specific channel
    conversion can be triggered by `TIM1`, `TIM2`, `TIM3`, `TIM4`, or `TIM5` timers.


    ### External Interrupt/Event Controller (EXTI)


    There is an external interrupt/event controller that uses 23 edge-detector lines
    to generate interrupt/event requests. Each line may be independently configured
    to select the trigger event such as leading edge, trailing edge, or both. All
    these lines can be independently masked. There is a register that maintains the
    status of each interrupt request. The `EXTI` can detect an external line with
    a pulse width shorter than the internal clock period. Up to a maximum of 81 `GPIOs`
    can be connected to the 16 external interrupt lines.


    ### Timers and Counters


    Many typical MCU activities involve temporal or timing events. Using hardware
    timers and counters can minimize software execution cycles that are best allocated
    to other activities. That is why MCUs typically incorporate an array of timers
    and counters in their structure. Timers and counters are also tightly coupled
    with interrupts to provide an extremely efficient way to process timing and counting
    events.


    [Table 1-6](#ch1.xhtml_ch1tab6) details the features supported by a single advanced
    control timer as well as the general purpose (GP) and basic timers.


    ![Images](tab01-06.jpg)


    **Table 1-6** *MCU Timer Features*


    Although there are two more watchdog timers, they are not listed in the table.
    I discuss each timer type below.


    ### Advanced Control Timer (TIM1)


    This timer has four independent channels that may be used for the following:


    - Input capture

    - Output capture

    - Pulse width modulation (PWM)

    - Single pulse output

