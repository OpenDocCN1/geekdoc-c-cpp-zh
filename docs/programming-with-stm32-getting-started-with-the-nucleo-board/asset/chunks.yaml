    This result happens because the step size is `3.3/8` or `0.4125`. This is a rather
    large error and only happens in this case due to the small number of bits involved.
    For the real 12-bit STM DAC, the step size would only be `3.3/4096` or `0.00080566
    V` or roughly `0.8 mV`. That step size will provide an excellent analog voltage
    representation for a digital number. Returning to the digital example, I have
    calculated all eight analog voltage outputs for all the possible binary combinations.
    These are shown in [Table 11-1](#ch11.xhtml_ch11tab1).


    ![images](tab11-01.jpg)


    **Table 11-1** Binary Input vs Analog Voltage Output—3-bit DAC Example


    [Figure 11-7](#ch11.xhtml_ch11fig7) shows the analog voltage output in more start
    terms where it becomes very apparent that there is no smooth transition between
    binary input values due to the limited number of bits.


    ![images](fig11-07.jpg)


    **Figure 11-7** Bar chart showing analog voltage outputs.


    [Table 11-1](#ch11.xhtml_ch11tab1) and [Figure 11-7](#ch11.xhtml_ch11fig7) provide
    more than ample proof that a sufficient number of bits must be present to have
    a somewhat smooth and continuous voltage output from a DAC. However, there will
    still be a small noise present even with a high number of bits present due to
    the inherent switching that is constantly happening with the DAC. This noise may
    be easily filtered out using an active low-pass analog filter. However, I will
    demonstrate that the DAC output is very clean and can be directly used as is without
    additional filtering.


    A STM DAC also has the option of switching in a buffer output amplifier. This
    device will lower the DAC’s output impedance and provide additional drive current
    without the need to add an external output operational amplifier for this purpose.


    It is now time to discuss the HAL software that can configure and initialize the
    STM DAC peripheral.


    ## HAL Software for the DAC


    The HAL framework uses a C struct named `DAC_HandleTypeDef` to configure the DAC
    peripheral. Each member will separately be discussed after the struct definition.


    ![Images](c0261-01.jpg)


    The `DAC_HandleTypeDef` struct members are briefly defined in the following list:


    - `DAC_TypeDef *Instance;`—This is a pointer to the DAC descriptor which will
    be used. For example, `DAC1` is the descriptor for the first DAC peripheral.

    - `__IO HAL_DAC_StateTypeDef State;`—This value represents the DAC communication
    state.

    - `HAL_LockTypeDef Lock;`—This value is a DAC-locking object.

    - `DMA_HandleTypeDef *DMA_Handle1;`—This is a pointer to a DMA handler configured
    to perform digital-to-analog conversions in DMA mode.

    - `DMA_HandleTypeDef *DMA_Handle2;`—This is a pointer to a DMA handler configured
    to perform digital-to-analog conversions in DMA mode.

    - `__IO uint32_t ErrorCode;`—This is a value representing the DAC error code.


    The `DAC_HandleTypeDef` struct differs from all the other similar structs in that
    it does not have an `Init` member, but instead relies on a different type of C
    struct to initialize the DAC at the channel level. This C sruct is named `DAC_ChannelConfTypeDef`
    and has the following definition. As before, each member will separately be discussed
    after the struct definition.


    ![Images](c0262-09.jpg)


    The `DAC_ChannelConfTypeDef` struct members are briefly defined in the following
    list:


    - `uint32_t DAC_Trigger;`—This value specifies the source used to trigger the
    DAC conversion. This parameter can be any value of the following defines:

    - `DAC_TRIGGER_NONE`—Used for a manual trigger.

    - `DAC_TRIGGER_SOFTWARE`—Used when DAC is in a DMA mode without a timer.

    - `DAC_TRIGGER_Tx_TRGO`—Used when DAC is driven by a dedicated timer.

    - `uint32_t DAC_OutputBuffer;`—Specifies whether the DAC channel output buffer
    is enabled or disabled.


