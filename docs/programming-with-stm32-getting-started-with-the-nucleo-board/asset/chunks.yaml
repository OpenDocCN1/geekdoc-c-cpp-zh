    ![images](fig03-07.jpg)


    **Figure 3-7** *PC13 alternative pin mappings.*


    All available alternative pins will immediately be color-coded blue in response
    to control clicking on a selected pin. In [Figure 3-7](#ch3.xhtml_ch3fig7), the
    alternative pins are `PA13` and `PB13`, but only if the alternative pin(s) are
    not in a reset state. Using alternative mapping allows for optimized board layout
    if it is inconvenient to layout a trace to the primary pin. The `CubeMX` will
    attempt to automatically resolve pin layout conflicts whenever detected by assigning
    a peripheral function to an alternative pin. However, by placing a logical “push
    pin” on a selected MCU pin will lock a desired peripheral function to a pin. These
    “push pins” are easily seen in the figure. These pins prevent `CubeMX` from enabling
    an alternative mapping of the locked pins. Pins locked out from alternative mapping
    are also color coded orange.


    ## Integrated Peripheral (IP) Tree Pane


    The IP tree pane shown in the left-hand side of [Figure 3-6](#ch3.xhtml_ch3fig6)
    allows a `CubeMX` user an easy way to enable or disable peripherals that may be
    assigned to a MCU pin. The tree pane also allows the user to enable certain software
    middleware libraries. The tree listing uses a variety of colored icons and text
    to indicate the peripheral status and configuration. [Figure 3-8](#ch3.xhtml_ch3fig8)
    shows these colored icons and textual meanings associated with each of them. This
    figure is excerpted from the `CubeMX` user manual, which I urge interested readers
    to download and save. There is a wealth of information available in the 261-page
    PDF manual, which I simply do not have the space to cover.


    ![images](fig03-08.jpg)


    **Figure 3-8** *Tree pane IP icons and textual descriptions.*


    ### Clock Configuration Tab


    The STM32 series of MCUs use a very flexible approach to configure a variety of
    clock sources needed for MCU operations. These sources apply to both core MCU
    functions and most of the peripheral functions. Clock sources and the associated
    phase-locked loops (`PLL`) are shown graphically in [Figure 3-9](#ch3.xhtml_ch3fig9),
    which will be displayed when you click on the Clock Configuration tab.


    ![images](fig03-09.jpg)


    **Figure 3-9** *Clock Configuration GUI.*


    [Figure 3-9](#ch3.xhtml_ch3fig9) appears a bit daunting at first glance, but do
    not despair as it is really not that complicated, especially after you interact
    with it a few times. The STM32 clock sourcing is very much capable and flexible
    as compared to ordinary 8-bit MCUs.


    The very first thing that must be considered is the basic clock sources. There
    is a high-speed clock (`HSE`) and a low-speed clock (`LSE`) used for the STM32
    MCU series. These clocks may be sourced either internally or externally. These
    clocks will be internally sourced for all of this book’s projects; however, either
    one or both can be externally sourced if so desired. You must first enable the
    appropriate clock input pins if it desired to use external clock(s). This is done
    by returning to the IP tree in the Pinout view and expand the `RCC` section. [Figure
    3-10](#ch3.xhtml_ch3fig10) shows a typical configuration for these pins.


    ![images](fig03-10.jpg)


    **Figure 3-10** *RCC pin configurations.*


    You must return to the Clock Configuration tab once the clock input pins have
    been enabled and complete the clock source configurations.


    There will be no need to change any of the clock configurations because they are
    perfectly suitable to support all book projects as they are set in their default
    states. I do want to caution readers who might be considering overclocking the
    MCU. Overclocking is a common hack that users will sometimes attempt in order
    to “gain” some perceived performance increase from a computer system. Overclocking
    is especially prevalent in gaming systems where high clock rates are thought to
    improve display frame rates and game performance. While this may be true for some
    gaming systems, the undue stress due to much higher chip heat dissipation will
    shorten processor life considerably. Gaming systems also employ sophisticated
    cooling subsystems, which are not present in the STM Nucleo board series. The
    bottom line is to NOT overclock as that will definitely overheat the MCU and cause
    it to prematurely fail.


    ### Configuration View Tab


    The Configuration View provides an overview for all of the software configurable
    components including GPIOs, peripherals, and middleware. There are clickable buttons,
    as can be seen in [Figure 3-11](#ch3.xhtml_ch3fig11), which allow for configuration
    options for various components. The `CubeMX` application will automatically create
    the supporting C/C++ code that supports the desired configuration.


    ![images](fig03-11.jpg)


    **Figure 3-11** *Configuration View.*


    There are color-coded icons and text in [Figure 3-11](#ch3.xhtml_ch3fig11), in
    much similar fashion to what was displayed in the IP tree pane view. [Figure 3-12](#ch3.xhtml_ch3fig12)
    details what the icons and text mean as they are applied to the Configuration
    View.


    ![images](fig03-12.jpg)


    **Figure 3-12** *Configuration View icons and textual descriptions.*


    ### Power Consumption Calculator View Tab


    Clicking on the remaining tab will display an uninitialized power consumption
    calculator screen, as shown in [Figure 3-13](#ch3.xhtml_ch3fig13).


    ![images](fig03-13.jpg)


    **Figure 3-13** *Power consumption calculator (PCC).*


    This PCC will allow you to calculate the following:


    - Average current consumption

    - Expected battery life

    - Average DMIPS (Dhrystone million instructions per second): It is essentially
    a measure of the MCU efficiency as computed using a standardized software test

    - Maximum ambient temperature (`TAMAX`): The maximum ambient temperature is computed
    based on the MCU package type, internal power consumption, and a preset 105°C
    junction temperature


    There are a series of procedural steps that are carefully detailed in the `CubeMX`
    user manual, which will lead you through a step-by-step analysis to ensure that
    the selected battery will handle your desired application. I will not use the
    PCC because all the book projects use a power source.


    ### Creating an Example Project using CubeMX


    It is now time to discuss how to create a new project using the `CubeMX` application.
    First start the application and then click on the New Project selection. The opening
    New Project screen, as shown in [Figure 3-14](#ch3.xhtml_ch3fig14), will be displayed.


    ![images](fig03-14.jpg)


    **Figure 3-14** *New Project opening screen.*


    Click on the Board selection tab, which should cause the Board Selection screen
    to be shown. Select your project board as I did in [Figure 3-4](#ch3.xhtml_ch3fig4).
    Double-clicking on the board selection will cause a Pinout window view to appear
    for the STM32F-302R8Tx MCU, as shown in [Figure 3-5](#ch3.xhtml_ch3fig5).


    You will now need to click on the menu bar selection title Project in order to
    name your new project. Select Setting from the drop-down menu, which is shown
    in [Figure 3-15](#ch3.xhtml_ch3fig15).


    ![images](fig03-15.jpg)


    **Figure 3-15** *Project dropdown menu.*


    [Figure 3-16](#ch3.xhtml_ch3fig16) shows the Project Settings window that will
    appear after you click on the Settings selection in the Project dropdown menu.


    ![images](fig03-16.jpg)


    **Figure 3-16** *Project Settings screen.*

