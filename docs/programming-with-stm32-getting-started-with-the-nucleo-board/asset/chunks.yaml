    ## 6 中断


    本章涵盖了中断。顾顾义，它们处理在识别到预定事件时停止程序的正常执行，然后处理该事件。


    ### 中断


    从高层角度来看，中断是任何暂时停止正在进行的程序执行并要求 MCU 执行与触发中断的事件相关的特殊代码的过程。这种特殊代码被称为中断处理程序（interrupt
    handler）。导致中断的事件被称为异步事件，意味着它与正常执行的程序代码没有因果关系。你很快就会看到，定时器外围器通常是这些异步事件的源。数据通信通道以及直接内存访问（DMA）过程也经常使用中断。


    中断可以源于硬件，涉及定时器时就是如此。它也可以完全由软件驱动，这通常在检测到程序异常终止时发生，例如尝试除以零或尝试访问不存在的内存位置。大多数编程语言中的软件中断通常被称为异常（exceptions）。然而，在
    ARM 术语中，所有中断（无论是硬件启动还是软件启动）统称为异常。


    ARM Cortex-M 集成外围器（IP）包含一个名为嵌套向量中断控制器（`NVIC`）的硬件设备，其目的是管理异常。图 6-1 是一个说明 `NVIC`
    如何与其他关键 Cortex-M 组件连接的框图，包括 Cortex-M 核心和其他外围器。


    ![images](img/fig06-01.jpg)


    **图 6-1** NVIC 框图。


    你可以在图 6-1 的左侧看到两种类型的线连接。标记为 `NMI` 的单线代表不可掩码中断，用于允许外围器信号 `NVIC` 无条件地启动中断过程。另一种中断类型是
    `IRQ`，代表中断请求。这种中断类型可以被屏蔽，这意味着如果设置了相应的掩码 `IRQ` 寄存器位，`NVIC` 则不必立即响应 `IRQ`。通常只有一个
    `NMI`，但有许多取决于特定型号 `NVIC` 容量的 `IRQ` 线。


    `NVIC` 同样连接在 Cortex-M 核心与专用的 I/O 线以及标准的内部总线互连结构之间。这意味着 `NVIC` 完全符合 CMSIS 标准，并使用与
    GPIO 讨论中详细描述相同类型的控制和配置寄存器。`NVIC` 完全集成到 HAL 软件框架中，并使用它自己的 C 结构来设置各种寄存器。`NVIC` 的驱动软件将在一个演示程序中讨论。此时，我将讨论关于
    `NVIC` 的一些重要细节。


    ## NVIC 规范


    STM `NVIC` 通用规范规定单个 `NVIC` 可以管理多达 256 个中断通道。在 256 个通道中，240 个可以是外部的，而 16 个始终是内部的。实际上，控制项目开发板的
    STMF302R8 MCU 的 `NVIC` 部分仅支持 52 个通道。此外，还有 16 条直接连接到 `NVIC` 的硬件中断线。MCU 的 51 条 GPIO
    线中的任何一条都可以被配置为可掩码中断，这意味着它们可以变成中断通道。你应该将中断通道看作是软件结构而非硬件实现。事实上，中断的 C 结构使用了“通道”（channel）一词来强化这一概念。


    中断还可能分配一个优先级级别。这意味着高优先级中断可以中断低优先级的中断。这种行为为 `NVIC` 缩写中的“嵌套”（nested）一词赋予了意义。一个 8
    位寄存器持有优先级级别，这意味着最多可以有 256 个优先级级别。我无法想象任何需要如此数量优先级的实用嵌入式系统。这样的系统可能无法设计，更不用说实现了。


    既然已经介绍了 `NVIC`，现在是时候详细讨论中断过程了。


    ### 中断过程


    在继续本节之前，有几个定义需要设定：


    - 开启（Arm）：允许硬件设备触发中断

    - 关闭（Disarm）：不允许设备触发中断

    - 启用（Enable）：允许中断过程

    - 禁用（Disable）：不允许中断过程


    启用和禁用中断可以通过 C 语言分别使用 `EnableInterrupts()` 和 `DisableInterrupts()` 方法轻松实现。只要启并在相应的
    `NVIC` 控制寄存器中设置了与潜在中断源相关的特定触发位，就可以触发中断。这被认为是开启了特定的设备。相反，重置相同的寄存器触发位被认为是关闭该设备。在考虑
    SysTick 中断时，此过程中有一个重要的偏差。由于其事件必须始终被 MCU 识别，它没有启用位。


    中断优先级通过设置 `NVIC` `BASEPRI` 寄存器来建立。例如，如果将特定中断设置为优先级 3，那么任何优先级级别为 0、1 或 2 的中断将中断级别
    3 的中断。然而，如果 `BASEPRI` 寄存器设置为 0，则中断优先级功能被禁用，所有中断将按它们被 `NVIC` 的顺序处理。


    在生成中断之前，必须满足五个前提条件：


    '
- fmt: '

    1. The potential interrupt device must be armed, that is, trigger bit set.

    2. `NVIC` must be enabled.

    3. Global interrupts must be enabled.

    4. Interrupt priority must be higher than the current level.

    5. An actual hardware triggering event must happen.


    These five conditions can happen in any order. However, they must all be true
    simultaneously for an interrupt to be recognized and processed.


    The following five events will happen if an interrupt is recognized:


    1. The instruction currently executing will complete.

    2. The currently operating thread will be suspended.

    3. The contents of 12 registers will be stored on the stack. An additional 18
    words will be stored if the floating point unit (`FPU`) happened to be active
    when the interrupt was recognized.

    4. The `LR` register is set to a specific value. (`LR` is a special stack register.)

    5. The `PC` register is loaded with the interrupt service routine (`ISR`) address.


    [Figure 6-2](#ch6.xhtml_ch6fig2) is a graphical depiction of the five events listed
    above.


    ![images](fig06-02.jpg)


    **Figure 6-2** Interrupt processing sequence.


    The key point to make is that the `NVIC` upon recognizing a valid interrupt request
    will interface automatically with the MCU using firmware stored within the `NVIC`.
    No special code is needed, which makes the interrupt processing as fast as possible.
    It only takes 12 clock cycles, as shown in [Figure 6-2](#ch6.xhtml_ch6fig2), to
    go from recognizing an interrupt to executing the first instruction in the `ISR`.
    This means there is a latency time of approximately 1.5 µs for an MCU clocked
    at 80 MHz.


    This series of events is called a context switch and is automatically invoked
    by the `NVIC` hardware. The result of a context switch is that the currently operating
    thread becomes a background thread and the `ISR` becomes a foreground thread.
    The context switch also works quite nicely with prioritized interrupts where the
    lower priority `ISR` becomes a background thread and the higher priority `ISR`
    becomes a foreground thread.


    There is also the concept of a pending interrupt request, which you should know
    about. A requesting interrupt is held in a pending state if it is detected if
    the global interrupts are not yet enabled or the requesting interrupt has a lower
    priority than a currently active interrupt. Once the five preconditions are met,
    the requesting interrupt’s state will be changed from pending to active.


    It is also very important to clear all device trigger bits or else there will
    be continuous interrupt requests reoccurring. It is called an acknowledgment to
    clear a trigger bit and is done by a software instruction. The only device which
    has an automatic acknowledgment is the `SysTick` interrupt because of its critical
    role in MCU operation and its recurring nature of operation. The acknowledgment
    instruction is almost always included in the `ISR`.


    A few words on the nature of an `ISR` would be helpful in order to understand
    what role it plays in the interrupt process. The `ISR` contains all the code required
    to process and complete whatever action prompted the initial interrupt. An `ISR`
    is usually a very compact software module designed for a single task supporting
    the interrupting device. However, there is one implementation where just one large
    `ISR` services many interrupt sources. In this case, a polling technique is employed
    to determine the exact interrupt source and use just that portion of the large
    `ISR` to service the interrupting device. This is not the case for STM MCUs. The
    STM implementation uses separate and small `ISRs` to service each requesting interrupt
    device. There is a list of addresses for these small `ISRs` stored in a vector
    table. This feature gives rise to the word “vector” in the `NVIC` name.


    I do want to mention one area where the STM vectored interrupt process actually
    uses polling. This would be the case where multiple GPIO pins on the same port
    could separately issue their own interrupt. Since the GPIO port only has one vector
    address, it is left to the software to poll all the port’s trigger bits to determine
    which bit is armed (requested the interrupt).


    Every `ISR` is written to service the interrupting device as efficiently as possible
    and will issue the acknowledgment as well as invoke the context switch. The latter
    is easily accomplished by a C language command that has an assembly language format
    similar to `BX LR`, which will very quickly pop all the stored register values
    back to their respective registers and thus restore the MCU to its pre-interrupt
    state. It is software engineering design objective that `ISRs` should run as quickly
    as possible and return to the previous foreground thread. This means no wait loops
    should ever be placed in an `ISR`.


    Any data which is generated or modified in an `ISR` must be stored in globally
    shared memory locations, because it will otherwise not be available to any other
    software module due to the nature of how the C language implements the `ISR` framework.


    ## External Interrupts


    External interrupts such as those which are sourced through GPIO pins are connected
    to the `NVIC` using an external interrupt controller (`EXTI`). Using an `EXTI`
    allows for multiplexing of many GPIO pins into the `NVIC` external interrupt inputs.
    [Figure 6-3](#ch6.xhtml_ch6fig3) is a block diagram of the `EXTI`.


    ![images](fig06-03.jpg)


    **Figure 6-3** EXTI block diagram.


    The `EXTI` controller in the STM32F302R8 MCU carries out the following activities:


    - Handles up to 23 separate software events and/or hardware triggers connected
    to 16 external interrupt/event lines

    - Provides a status bit for each line

    - Provides independent triggers and masks for each line

    - Can detect external pulse with a short period than the APB2 bus clock, which
    drives the EXTI


    Any of the STM32302R8 51 GPIO pins may be used as an interrupt source. Of course,
    only up to 23 could be active at any given time. There are also five other `EXTI`
    lines that are connected as follows:


    1. line 16 connected to the PVD output

    2. line 17 connected to the RTC Alarm event

    3. line 18 connected to the USB OTG FS Wakeup event

    4. line 21 connected to the RTC Tamper and TimeStamp events

    5. line 22 connected to the RTC Wakeup


    [Figure 6-4](#ch6.xhtml_ch6fig4) shows relationship between the GPIO pins, external
    interrupt controller, and the `NVIC` IRQs.


    ![images](fig06-04.jpg)


    **Figure 6-4** GPIO pins, external interrupt controller, and NVIC IRQs.


    You should take note that GPIO pin PC13 is grouped together with many other pins
    into a common `NVIC` IRQ named `EXTI15_10_IRQ`. This is quite important in the
    interrupt program.


    At this point, you should have gained sufficient knowledge to appreciate a simple
    interrupt demonstration discussed in the next section.


