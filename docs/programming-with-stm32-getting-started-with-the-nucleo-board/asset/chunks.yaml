- fmt: '

    Embedded developers use a “toolchain” to create and debug software run on a MCU.
    There is no unique toolchain because what is used depends on the host computer
    being used, the target MCU, the development language, the linker/loader, and other
    various components. Generally speaking, the toolchain consists of an editor, cross-compiler,
    support libraries, linker/loader, and a debugger. Most of the toolchain components
    are often integrated into a single application called an *integrated development
    environment* (IDE) or they can be separate pieces for which the developer must
    connect and use in a proper sequence.


    Using an IDE definitely helps a developer in efficiently creating code for a microcontroller
    because an IDE has the following:


    * An integrated source code editor

    * A means to create a software project and automatically create and store all
    necessary supporting files

    * A navigation scheme to quickly sort through the many files that constitute a
    project

    * One-step cross-compilation

    * Easy integration with appropriate load and debug applications, which in this
    case is `ST-LINK/V2`

    * Versatile debug modes


    I also want to mention that the Keil IDE contains many more features than the
    Arduino IDE, which many readers already likely use. The Arduino IDE comes ready
    to use “right out-of-the box,” which makes it very convenient for most users but
    at the same time limits its capabilities of supporting a vast variety of different
    microcontrollers, and you are limited to one programming language, that being,
    Processing. Setting up your own, customized toolchain simply provides you a very
    flexible way to support your unique programming requirements.


    Toolchains may be quite simple, as is the case with the Arduino IDE, or very complex,
    as might be the situation for a unique MCU being developed in a Linux system with
    open-source software. I would consider the STM32 toolchain as established in this
    book as moderately complex. However, one piece of good news is that the manufacturer
    freely provides an application that nicely supports its MCU line as far as setting
    up clocks and peripherals using the C language. I discuss this application named
    `STMCube32MX` in a later section. [Figure 2-2](#ch2.xhtml_ch2fig2) shows the toolchain
    workflow for a generic embedded development project.


    ![images](fig02-02.jpg)


    **Figure 2-2** *Generic toolchain workflow.*


    The first step in the process is to create the source code using a text editor.
    Most often, the editor is an integral part of the IDE, but developers often have
    their own favorite editor, which they have been accustomed to use. In all cases,
    the source is generated using the desired computer language, which will then be
    used as the input to a cross-compiler. The cross-compiler is so named because
    it functions with the host computer’s operating system, yet produces binary code
    that will run on the target MCU. This newly generated binary code must then be
    linked with all necessary binary libraries to form a fully executable MCU program.
    That job is the responsibility of the linker. The fully formed and executable
    binary program must next be uploaded into the MCU. This is the responsibility
    of the loader. The loader function is often partitioned as part hardware and part
    software. The `ST-LINK/V2` performs the load function for the `Nucleo-64` development
    board used in this book’s projects.


    The MCU can now be run with a working program and tested to see if it performs
    as desired. This is called debugging and is shown as a diamond in the figure.
    If the program works without any flaws, which does not happen very often, the
    MCU is ready to go into the production or release phase. However, if bugs are
    detected, they must be resolved and this normally means iterating all the way
    back to the source code and making appropriate changes at that point. The whole
    toolchain must then be repeated as often as necessary until the MCU functions
    as desired or any left-over bugs are so trivial that they can be tolerated and
    stay in the final program executable code. One example of a trivial bug may be
    that the MCU responds to a sensor event in 21 ms instead of 20 ms, but that slight
    deviation has no measurable impact in the overall MCU performance.


    ## Configuring a STM32 Toolchain


    There are many ways to configure a toolchain, as previously mentioned. I have
    elected to use the Keil evaluation IDE, version 4.74.


    NOTE: I used a Windows 10 platform to host this toolchain. I did this because
    I determined that the `ST-LINK/V2` utility worked properly with Windows as compared
    to using a Mac OS or a Linux environment. You can always choose to create a toolchain
    with a Mac or Linux host, but be prepared to encounter some compatibility problems
    when attempting to link and load programs from the host to the target platform.


    ### Installing the Keil IDE


    The latest Keil IDE is version 5; however, I decided to install an older evaluation
    version 4.74 of the IDE because it seems to be more stable and I had more favorable
    experiences in using it. You may elect to install the latest version if you so
    decide, but all my projects will be done with the earlier version. The executable
    evaluation version 4.74 is available from the following website:


    [https://www.keil.com/demo/eval/armv4.htm](https://www.keil.com/demo/eval/armv4.htm)


    You will first have to fill out a registration form before you are allowed to
    access the download page. This form is shown in [Figure 2-3](#ch2.xhtml_ch2fig3)
    and doesn’t appear to be too onerous and just requests some basic information
    about yourself and how you intend to use the application.


    ![images](fig02-03.jpg)


    **Figure 2-3** *Keil form.*


    You will see the download page, as shown in [Figure 2-4](#ch2.xhtml_ch2fig4),
    once you fill out the registration form and click on the `Submit` button.


    ![images](fig02-04.jpg)


    **Figure 2-4** *IDE download page.*


    The download file is `MDK474.exe` and is a straight Windows executable of approximately
    576 MB. I would also recommend that you accept all the default suggestions as
    you run the installer application because they worked just fine for my toolchain.


    You should see the Keil IDE icon on the Desktop, as shown in [Figure 2-5](#ch2.xhtml_ch2fig5),
    once the installation is complete. Also notice that Keil brands its IDEs as `uVision`.
    You will also see the `uVision` tag on many files that are automatically created
    during the target build. That’s all that is needed to install the Keil IDE.


    ![images](fig02-05.jpg)


    **Figure 2-5** *IDE v4.74 icon.*


    ### STM32CubeMX


    The manufacturer STM provides a very nice application called `STM32CubeMX` that
    helps configure its line of MCUs and demonstration boards. The `STM32CubeMX` utility
    is a GUI-based tool that helps you create custom configuration files using the
    C language that are especially suited to the Nucleo board. For instance, this
    utility can create all the source code required to blink the user LED (`LD2`)
    on the `NUCLEO-F302R8` board, which in turn uses a `STM32F302R8` microcontroller.
    The C language source code covers the processor clock, peripheral port, and general-purpose
    input/output (`GPIO`) configuration as well as a few more. The `STM32CubeMX` application
    can be freely downloaded from the STM website, [http://www.st.com/en/development-tools/stm32cubemx.html](http://www.st.com/en/development-tools/stm32cubemx.html).
    You will have to register at the STM website in order to download this software,
    but it is free and STM will notify you of changes and updates to their tools as
    they are published. This application should be downloaded into the `STM32Toolchain`
    directory as was done with all the previous applications.


    [Figure 2-6](#ch2.xhtml_ch2fig6) shows the opening splash screen for the `STM32CubeMX`
    utility after it has been downloaded and installed. I would recommend that you
    accept all the default suggestions as you run the installer application.

