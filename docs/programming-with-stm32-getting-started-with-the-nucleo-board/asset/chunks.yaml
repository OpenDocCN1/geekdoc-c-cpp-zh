- fmt: "\nYou must first enter a name in the Project Name textbox. I used `STM32Nucleo_F302`\
    \ as a project name, but you can choose anything that you like. You should ensure\
    \ that the Project Location textbox displays where you desire the project folder\
    \ to be stored. You can use the Browse button to find the appropriate directory.\
    \ For this demonstration, I used the same location I previously used for earlier\
    \ book projects. The next textbox entitled `Toolchain Folder Location` should\
    \ be a directory named using the combination of the Project Location and the Project\
    \ Name. Make note of this location because you will shortly need to access files\
    \ that CubeMX will automatically create and store in it.\n\nNext, ensure that\
    \ you have selected `MDK-V4` as the Toolchain/IDE to use, as shown in [Figure\
    \ 3-16](#ch3.xhtml_ch3fig16). This selection is very important because CubeMX\
    \ cannot generate the correct `C`/`C++` code without this being selected. In addition,\
    \ ensure that the `Generate Under Root` checkbox is checked, which will allow\
    \ the generated code to be located in the proper directories.\n\nThe default linker\
    \ Settings are okay. Check that the `MCU Reference` textbox matches the MCU you\
    \ are using. If it does not match, then the generated code cannot function with\
    \ the physical MCU.\n\nFinally, the `Firmware Pack Name` and `Version` textbox\
    \ as well as the `Use Default Firm Location` textbox should be okay as is.\n\n\
    In preparation for code generation, go back and click on the `Project` menu bar\
    \ selection and click on the `Project Settings` submenu selection. Next, click\
    \ on the `Code Generator` tab and the screen shown in [Figure 3-17](#ch3.xhtml_ch3fig17)\
    \ should appear.\n\n![images](fig03-17.jpg)\n\n**Figure 3-17** *Code Generator\
    \ screen.*\n\nEnsure that all the radio buttons and checkboxes are selected, as\
    \ shown in [Figure 3-17](#ch3.xhtml_ch3fig17). You should note that I selected\
    \ the radio button to `Copy only the necessary library files` in order to minimize\
    \ the size of the project as stored on the host computer. Selecting the radio\
    \ button `Copy all used libraries into the project folder` would have increased\
    \ the overall project folder size. In either case, the final binary file size\
    \ would still be the same.\n\nNext, return to the `Project` submenu as has been\
    \ shown in [Figure 3-17](#ch3.xhtml_ch3fig17), but this time click on the `Generate\
    \ Code` selection. The CubeMX will take a few seconds to generate the code with\
    \ a progress bar appearing on the screen. When the code generation is completed,\
    \ you should see the informational dialog box, as shown in [Figure 3-18](#ch3.xhtml_ch3fig18).\n\
    \n![images](fig03-18.jpg)\n\n**Figure 3-18** *Successful code generation dialog\
    \ box.*\n\nAfter you click the `Open Project` button, you have the Keil IDE main\
    \ window with the `STM32Nucleo_F302` project directories and files listing appearing\
    \ in the IDE’s Project pane. This view is shown in [Figure 3-19](#ch3.xhtml_ch3fig19).\n\
    \n![images](fig03-19.jpg)\n\n**Figure 3-19** *Initial STM32Nucleo_F302 project\
    \ in the Keil IDE.*\n\nThere should be four subdirectories in the Project pane\
    \ named `STM32Nucleo_F302`, `Application/MDK-ARM`, `Drivers/CMSIS`, and `Application/User`,\
    \ respectively. In [Figure 3-20](#ch3.xhtml_ch3fig20), I expand all the subdirectories\
    \ to show you all the files contained in them.\n\n![images](fig03-20.jpg)\n\n\
    **Figure 3-20** *Project directory, subdirectory, and file list.*\n\nYour listing\
    \ should be similar, depending upon the particular MCU that you used. Don’t be\
    \ dismayed by the number of directories and files. You will only be dealing with\
    \ three at most in the upcoming chapter projects.\n\nThere will also be a pop-up\
    \ dialog box warning you that a device was not found. This dialog box is shown\
    \ in [Figure 3-21](#ch3.xhtml_ch3fig21) and is simply a consequence that the initial\
    \ project load did not have a specific MCU selected.\n\n![images](fig03-21.jpg)\n\
    \n**Figure 3-21** *Device not found dialog box.*\n\nThis is easily fixed by clicking\
    \ on `File` → `Device Database`, as shown in [Figure 3-22](#ch3.xhtml_ch3fig22).\n\
    \n![images](fig03-22.jpg)\n\n**Figure 3-22** *Device Database menu selection.*\n\
    \nNext select `STMicroelectronics` as the manufacturer and scroll down its rather\
    \ impressive list of MCUs until you find your specific model. In my case, I did\
    \ not find `STM32F302R8`, but did find `STM32F302RB`, which seems to work quite\
    \ well. Maybe there will be some problems in the future, but I have not encountered\
    \ any to date with this selection. [Figure 3-23](#ch3.xhtml_ch3fig23) shows the\
    \ result of the `STM32F302RB` selection.\n\n![images](fig03-23.jpg)\n\n**Figure\
    \ 3-23** *STM32F302RB selection.*\n\nJust click on the `Close` button because\
    \ there is not a `Submit` or `Select` button.\n\n## The main.c Code Listing\n\n\
    The following code is `main.c`, which was automatically generated based on the\
    \ parameters and settings I entered. The main method, as I have mentioned, contains\
    \ most of the functional code required by the program. In this template, it is\
    \ intentionally empty because there is no functionality desired. The automatic\
    \ comments generated by the CubeMX application will help guide you in placing\
    \ your own code in the proper spots.\n\nThere are also a series of method calls\
    \ in `main` that both initialize and configure the internal peripherals and GPIO\
    \ pins for the MCU. These are listed in the same sequence as they are called:\n\
    \n```c\nwhile (1) {\n    // Functional code goes here\n}\n```\n\nThe `while (1)`\
    \ statement causes everything within its scope to be repeated indefinitely. This\
    \ is a necessary software construct because the majority of embedded systems do\
    \ not use an operating system (OS) and any running program would simply run once\
    \ and then likely crash. Functional code, such as for blinking an LED, would be\
    \ placed in this while loop.\n"
