- fmt: '

    The Nucleo-64 board used in this book is the STM MCU, model number `STM32F302R8`.
    This chip has a 64-KB flash memory and a 16-KB static random access memory (`SRAM`).
    Yes, those are kilobytes, not mega- or gigabytes. You cannot expect to create
    any graphical programs that run in this limited memory space. Microcontroller
    programs are truly a throwback to the earliest days of computing where memory
    was very limited and developers had to use every available byte to store and execute
    programs. Having mentioned the scarce memory resources, you will be able to use
    a variety of modern-day graphic-based programs to develop the MCU program, but
    they will run on a PC. The compiled and optimized binary code will be downloaded
    into the MCU from the PC.


    It turns out that 64 `KB` is plenty of space to run fairly large programs because
    the C/C++ cross-compiler used for this book’s projects produces optimize code,
    eliminating all but the essential instructions needed for the program. The 16-KB
    `SRAM` size is more than adequate for the dynamic memory requirements to support
    a maximum 64-KB sized program. The actual memory is integrated onto the MCU chip
    and its type is largely irrelevant for our purposes.


    ### Peripherals


    The peripherals are what make the MCU viable for its intended purposes. In my
    microcontroller definition I stated, “a set of peripherals consistent with all
    design requirements.” This means that microcontrollers typically have different
    peripheral configurations depending upon the requirements they are designed to
    meet. This is a major reason why STM manufactures such a wide variety of MCUs.
    I will focus on the Nucleo-64 microcontroller I mentioned above and will use its
    set of peripherals as my discussion points. I will next need to demonstrate how
    the Nucleo-64 board is set up in order to fully explain how all the peripheral
    features function with this board.


    ### Nucleo-64 Board Layout


    [Figure 1-3](#ch1.xhtml_ch1fig3) is a block diagram showing how the major components
    that make up a Nucleo-64 board are configured.


    ![images](fig01-03.jpg)


    **Figure 1-3** *Nucleo-64 block diagram.*


    The first item you should note is that the board is actually made of two sections,
    the top section being a `ST-LINK/V2-1` programmer and the bottom section is the
    `STM32 MCU`. The bottom section is also fitted with two sets of connectors. One
    set is compatible with the Arduino shield pin configuration and other set is the
    ST Morpho pinout configuration. There are two push buttons, `B1` and `B2`, shown
    in the figure. `B1` is multipurpose, while `B2` is the reset push button. There
    is also one LED indicated in the figure; however, there are several others also
    which are shown in follow-on figures. The programmer section may be separated
    from the microcontroller section by snapping the sparse printed circuit board
    (`PCB`) joints, which can be seen in [Figure 1-1](#ch1.xhtml_ch1fig1). I would
    not recommend doing so because you would lose all programming capability for the
    MCU section. I suppose it was set up in this fashion so you could separate the
    sections once there was a working MCU for a specific project and there was no
    need for any further programming.


    [Figure 1-4](#ch1.xhtml_ch1fig4) is a top view of the Nucleo-64 board with most
    of the components clearly annotated.


    ![images](fig01-04.jpg)


    **Figure 1-4** *Annotated top view of the Nucleo-64 board.*


    Remarkably, there are relatively few components on the board. Most of the space
    is taken up by connectors, push buttons, configuration jumpers, LEDs, and the
    microcontroller chip. This sparse layout reflects the nature of the MCU, which
    is to be an embedded device without any of the niceties needed for the human-computer
    interface (`HCI). HCI is possible with this board by using an appropriate extension
    board that plugs into this board.


    [Figure 1-5](#ch1.xhtml_ch1fig5) shows the bottom side of the Nucleo-64 board.


    ![images](fig01-05.jpg)


    **Figure 1-5** *Annotated bottom view of the Nucleo-64 board.*


    Not much to see in this figure other than a bunch of 0-ohm resistors that may
    be removed if it was desired to disable certain features such as the reset and
    user buttons and user LED, or make hardware configuration changes to the ST-LINK
    programmer.


    [Figure 1-6](#ch1.xhtml_ch1fig6) is much more interesting as it shows the pinouts
    for all the connectors on the top of the Nucleo-64 board.


    ![images](fig01-06.jpg)


    **Figure 1-6** *Nucleo-64 pinout diagram.*


    There are two sets of pinouts shown in [Figure 1-6](#ch1.xhtml_ch1fig6), one belonging
    to the Arduino and the other to the ST Morpho. Connectors `CN5`, `CN6`, `CN8`,
    and `CN9` belong to the Arduino set. Connectors `CN7` and `CN10` belong to the
    Morpho set. It is important to note that there are no one-to-one relationships
    between the sets. The Morpho connectors are two double rows of 38 pins for a total
    of 76 pins. The Arduino connectors are single-row connectors totaling 32 pins
    in all spread across four connectors.


    ### Arduino Connectors


    [Tables 1-1](#ch1.xhtml_ch1tab1) to [1-4](#ch1.xhtml_ch1tab4) detail the Arduino
    connectors with STM32 pins.


    [Table 1-1](#ch1.xhtml_ch1tab1) details the CN6 connector. Refer to [Figure 1-4](#ch1.xhtml_ch1fig4)
    to see the placement of CN6 on the board.


    ![Images](tab01-01.jpg)


    **Table 1-1** *CN6 Pinout*


    Grounding pin 3 will reset the MCU. The STM32 pin designation `NRST` is short
    for non-maskable reset, which means a low on this pin is always recognized as
    a forcible reset. Pins 2 and 4 provide 3.3 V, but I would recommend that a very
    limited amount of current be drawn from these pins or you risk disrupting board
    operations. Pin 5 provides 5 V, but again my caution exists for excessive current
    draw. `VIN` is where you can attach an external power supply. The input voltage
    range is approximately 7 to 12 V based on the voltage regulator connected to this
    pin. Jumper `JP5` must be switched to accommodate the external power supply. Finally,
    the `IOREF` pin allows Arduino shields to adjust the I/O voltage to the 3V3 for
    the STM32 if those shields follow the STM specification.


    [Table 1-2](#ch1.xhtml_ch1tab2) details the CN8 connectorout. Refer to [Figure
    1-4](#ch1.xhtml_ch1fig4) to see the placement of CN8 on the board.


    ![Images](tab01-02.jpg)


    **Table 1-2** *CN8 Pinout*


    These pins are the analog voltage inputs that are routed to the MCU multichannel
    analog-to-digital converter (`ADC`). You must restrict the analog input voltage
    to 3.3 V or less to avoid damaging the ADC inputs. Note that there is no one-to-one
    correspondence between the Arduino channels and the MCU channels. Pins 5 and 6
    are the default ADC inputs. If you need these to bus #1 I2C inputs, you must disconnect
    solder bridges `SB51` and `SB56` and connect `SB42` and `SB46`. These connections
    are made using 0-ohm resistors on the bottom side of the MCU board. Please note
    that the bus #1 I2C connections are already available on pins 1 and 2 on connector
    `CN5`.


    [Table 1-3](#ch1.xhtml_ch1tab3) details the CN5 connector pinout. Refer to [Figure
    1-4](#ch1.xhtml_ch1fig4) to see the placement of CN5 on the board.


    ![Images](tab01-03.jpg)


    **Table 1-3** *CN5 Pinout*

