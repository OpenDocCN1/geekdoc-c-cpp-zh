    ### Test Results

    `Figure 11-9` (`ch11.xhtml_ch11fig9`) is a shot from the oscilloscope connected
    to `PA4`, which is the `DAC` channel 1 output for the `STM32F302R` MCU.


    ![images](fig11-09)


    #### DAC output

    You can see that it is a relatively clean sine waveform with a `15ms` period or
    an approximate frequency equal to `66.67 Hz`. The peak-to-peak amplitude varies
    between `0` and `3.3 V`. This waveform is exactly what was programmed. `Figure
    11-10` (`ch11.xhtml_ch11fig10`) is an averaged spectrum, which shows the main
    components in the `DAC` sine wave.


    ![images](fig11-10)


    #### Sine wave display

    The average total distortion (`THD`) was measured at only `1.372%`, which is very
    low for this type of signal. The third harmonic at `200 Hz` was the highest component
    and was measured at `-42 dB`, which is less than one-hundredth of the primary
    frequency’s amplitude. I also experimented by changing the timer `TIM6` period
    to determine the highest output. I determined that a minimum period value of `105`
    created a sine wave frequency slightly over `3 kHz`. Any value lower than that
    caused the `DAC` to remain at a steady level. The last point I will make, which
    is the same one, is that the `Cortex-M` processor is not involved with signal
    generation once it has been configured and started. Notice that the `forever`
    loop in the `main` method is completely devoid of any code because the signal
    generation is completely accomplished by a combination of hardware and firmware.
    This approach is the essence of effective embedded design.


    ### Summary

    This chapter explains both direct memory access (`DMA`) and the digital-to-analog
    converter (`DAC`). I chose this combination because the `DAC` is an ideal peripheral
    to use with `DMA`. The first section explains the theory behind how a `DMA` controller
    implements this operational mode. The next discussion focuses on how to use the
    `HAL` framework to both configure and initialize the `DMA` operations. I presented
    a detailed discussion concerning two `structs` that are critical for setting up
    the `DMA` mode.


    The first demonstration simply has the `USART2` peripheral sending a character
    string to memory using the `DMA` mode. A complete program listing was provided
    with all the important details concerning `DMA`. The next section introduces the
    `DAC` and provides a brief background on how it functions. This is followed by
    a section on how to use the `HAL` framework to configure and initialize this peripheral.
    The second demonstration illustrates how to have the `DAC` generate a triangular
    waveform using code placed in the `main` method’s `forever` loop. This demonstration
    was purposefully designed to be computationally “heavy” in anticipation of the
    next demonstration. The third and final demonstration shows how the `DAC` could
    generate a relatively “pure” sine wave using a `DMA` mode and then being periodically
    triggered by a timer. The initial signal was set at `66 Hz`, but I eventually
    was able to generate sine signals slightly exceeding `3 kHz`. The waveforms were
    generated without any involvement other than the initial configuration.


