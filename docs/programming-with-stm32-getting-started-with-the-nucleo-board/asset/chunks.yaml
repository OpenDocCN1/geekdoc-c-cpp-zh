    as described above.


    ## Demonstration Three


    In this last demonstration I will be operating the DAC in a DMA mode to output
    a sine wave that is synthesized by the application. Generating an analog signal
    is a common task assigned to a DAC. DMA is the preferred operational method because
    it frees up the core processor to attend to higher priority tasks. The following
    generalized statement both starts the DAC and performs a DMA transfer:


    ![Images](c0269-01.jpg)


    In this demonstration, only one DAC channel named `DAC_CHANNEL_1` is available.
    The argument `uint32_t* pData` is a data pointer, which in this case will point
    to the beginning of the 200 element `SINE` array. The `uint32_t Length` argument
    is the number of data elements to be transferred, which is the `NSAMP` constant
    with value 200. Finally, the `uint32_t Alignment` argument specifies the data
    element bit size and whether the data is right or left justified. In this case,
    the define `DAC_ALIGN_12B_R` shows the data is 12-bit and is aligned to the right.


    Synthesizing a sine wave requires setting the number of increments or steps that
    will go into making up a single cycle waveform. In this example, the number was
    200, which is a good trade-off between having a representative sample and minimizing
    the total steps that need to be constantly handled. The resulting equation used
    to synthesize a 12-bit sine wave is as follows:


    ```

    ![Images](c0270-05.jpg)

    ```


    This equation was used to synthesize a single sine wave cycle with the `i` step
    ranging from 0 to 199. I next arbitrarily selected a period of 15 ms for the DAC
    sine wave output or an equivalent frequency of 66.67 Hz. This means that the conversion
    rate must be set at `66.67 * 200` or `13,334`.

