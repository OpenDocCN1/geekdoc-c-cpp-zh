    ![images](img/fig02-06.jpg)


    **图 2-6** STMCubeMX 启动界面。


    我点击了“新项目”（New Project）按钮，以便向你展示此工具是如何工作的。接下来将出现一个选择页面，窗口右上角有两个标签页。这些标签标记如下：


    • MCU 选择器 (MCU Selector)

    • 板载选择器 (Board Selector)


    我接着选择了 `MCU Selector` 标签页，并在大量的微控制器列表中向下滚动，直到遇到 `STM32F302R8` MCU，这就是本书中使用的 Nucleo
    板上安装的类型。图 2-7 显示了选中此特定 MCU 的屏幕。


    ![images](img/fig02-07.jpg)


    **图 2-7** 使用 STMCubeMX 工具选择特定的 MCU。


    你应该注意到，窗口顶部区域出现了一个关于 MCU 组件和特征的简要摘要。这些信息通常用于确认 MCU 是否支持你打算实现的任何功能。


    另一个标记为 `Board Selector`（板载选择器）的标签对于支持 Nucleo 板演示项目最为有用。我点击了该标签并向下滚动，以选择书中使用的精确
    Nucleo 板，即 `Nucleo64 NUCLEO-F302R8` 板。图 2-8 显示了进行此选择的结果。


    ![images](img/fig02-08.jpg)


    **图 2-8** 选择 NUCLEO-F302R8 板。


    窗口左侧出现了一个适用于所选板卡的外设选择面板。你应该注意到，某些外设在 във设名称旁边的 `Nb` 列中会出现一个空框，这表示该特定外设未包含在所选板卡上。在
    `Nb` 列旁边还有一个 `Max` 列，它显示了该特定 Nucleo 板上可用的某种特定类型的外设数量。另一个方便的功能是，可以通过点击窗口右下角的“加载用户手册”（Load
    User Manual）来快速下载所选 Nucleo 板的用户指南。


    图 2-9 显示了用于 Nucleo 板上单元的非常有用且方便的 MCU 引脚图。它显示了所有已连接到各种外设的引脚，包括用户 LED（我将在下一章中演示它）。


    ![images](img/fig02-09.jpg)


    **图 2-9** STM32F302RE MCU 引脚图。


    ### ST-LINK


    `ST-LINK` 软件是工具链的下一个部分，必须安装它才能开始开发 Nucleo 板。它是一个极其重要的工具链组件，因为内核支持板卡与主机计算机之间的 USB
    物理链路，并且是软件上传到板卡的唯一手段。


    必须首先下载 `USB ST-LINK` 驱动程序并安装到主机计算机中，以建立主机与 Nucleo 板之间的通信链路。该驱动程序可以从同一个 [st.com](http://st.com)
    网站下载，你从那里下载了 STM32CubeMX 实用程序。ST 网站上的软件编号为 `STSW-LINK009`，技术描述为“ST-LINK/V2 和 ST-LINK/V2-1
    的 USB 驱动”。此特定下载是一个经过签名的驱动程序，适用于 Windows 7、Windows 8 和 Windows 10 的 32 位和 64 位主机。下载的驱动程序是一个名为
    `en-stsw-link009` 的压缩格式文件，运行前必须解压。进入新创建的目录 `en-stsw-link009` 并点击名为 `stlink_winusb_install`
    的 Windows 处理文件来安装 USB 驱动程序。你会短暂看到一个显示正在安装的命令行窗口。不会创建驱动程序图标，因此判断驱动安装是否成功完成的唯一方法是运行
    ST-LINK 工具。下文将讨论 ST-LINK 工具的安装。


    实际的 `ST-LINK/V2` 工具必须从 [st.com](http://st.com) 网站单独下载。它的部分编号为 `STSW-LINK004`，大小约为
    22 MB。可下载的压缩包名为 `en.stsw-link004`，在安装之前也必须解压。确保压缩包已下载到 STM32Toolchain 目录。接下来，进入新创建的目录
    `en.stsw-link004` 并点击 `STM32-ST-LINK Utility V4.0.0.setup` 应用程序，这将安装并配置 ST-LINK/V2
    工具。


    在你点击主机桌面显示的 ST-LINK/V2 图标后，你应该看到工具的启动界面，如图 2-10 所示。


    ![images](img/fig02-10.jpg)


    **图 2-10** ST-LINK/V2 启动界面。


    你需要做的第一件事之一是检查正在使用的 Nucleo 板上安装了哪个版本的 ST-LINK 固件。要做到这一点，首先确保 ST-LINK 工具未运行，然后使用插入
    Nucleo 板的 mini-A 连接 USB 线将 Nucleo 板连接到主机计算机。图 2-11 显示了选中此特定 MCU 的屏幕。


    ![images](img/fig02-11.jpg)


    **图 2-11** USB 线。


    在连接 Nucleo 板后，按照以下步骤确定固件版本：


    1. 点击桌面打开 ST-LINK 工具。

    2. 点击水平菜单上的 `ST-LINK`。

    3. 点击子菜单中的“固件升级”（Upgrade）。

    4. 点击“设备连接”（Device Connect）。


    图 2-12 显示了点击 Device Connect 按钮的结果。


    ![images](img/fig02-12.jpg)


    **图 2-12** ST-LINK 固件版本。


    显然，如果报告的版本比升级显示的版本新，请不要升级固件。这种奇怪的情况可能是因为升级版本被硬编码在 ST-LINK/V2 存档中，而其更新频率不如新制造的板。公司通常解决此问题的方法是在其升级软件中使用动态下载，以便始终可以使用最新的固件版本。显然，STM
    没有采用这种方法，这就是这种情况发生的原因。希望它在不久后改变升级技术。无论如何，固件检查本身确认了主机与 Nucleo 板之间的 USB 通信正常。


    工具链配置的下一步是设置名为 OpenOCD 的调试工具。并不是真的需要安装调试器，但当你尝试调试运行不正常的程序时，它可能会很有帮助。


    ### OpenOCD15


    Open On-Chip Debugger (`OpenOCD15`) 工具旨在向 STM32 Nucleo 板上传新固件，并支持大量的软件调试模式。该工具最初由
    Dominic Rath 创建，但现在由包括 STM 公司在内的 STM 社区维护。兼容 Windows 版本由 Liviu Ionescu 创建，可以在
    [`github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124`](https://github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124)
    获取。


