    Therefore, storing a value of 26214 in `CCR2` will cause a 60% duty cycle pulse
    train to be generated from `TIM2`’s channel 2 output. Please note that the numbers
    I used for this calculation are relative in the sense that the actual `CCRx` numbers
    stored depend upon the real timer clock rate. You will shortly see that the numbers
    are much smaller, but the principle to figure them out is the same.


    The `TIM2` GP timer I used for PWM generation has a maximum of four output channels,
    meaning that it is possible to simultaneously generate four synchronized PWM signals
    using a single GP timer. One of the following demonstrations uses three channels,
    which is ample to demonstrate this capability.


    ### Timer Hardware Architecture


    [Figure 10-3](#ch10.xhtml_ch10fig3) is a portion of the GP timer block diagram
    highlighting the multi-channel outputs and associated `CCRx` registers.


    ![images](fig10-03.jpg)


    **Figure 10-3** *GP timer block diagram with four output channels.*


    The architecture is very straightforward, showing that each `CCRx` register has
    an input from the common timer counter (`CNT`) register as well as its own prescaled
    clock-rate input. This arrangement enables a very flexible PWM pulse train output
    to be implemented.


    It is now time to describe how the HAL software enables PWM signal generation.


    ### PWM Signals with HAL


    The HAL framework uses a C struct named `TIM_MasterConfigTypeDef` to configure
    the timer peripheral generating a PWM signal. Each member will separately be discussed
    after the struct definition.


    ![Images](c0216-02.jpg)


    The `TIM_MasterConfigTypeDef` struct members are briefly defined in the following
    list:


    `uint32_t MasterOutputTrigger;`—This value specifies the behavior of the trigger
    output (`TRGO`). This parameter can be any value of the following defines:


    `uint32_t MasterSlaveMode;`—This is used to enable/disable the master/slave mode
    of a timer. This parameter can be one of the two values of the following defines:


    ![Images](c0216-06.jpg)


    A PWM timer configured using the `TIM_MasterConfigTypeDef` struct must further
    be initialized using the `TIM_OC_InitTypeDef` C struct, which is defined as follows:


    ![Images](c0218-02.jpg)


    The `TIM_OC_InitTypeDef` struct members are briefly defined in the following list:


    `uint32_t OCMode;`—Specifies the output compare mode. This parameter can be any
    value of the following defines:


    `TIM_OCMODE_TIMING`—The comparison between the output compare register (`CCRx`)
    and the timer counter (`CNT`) has no effect on the output, which is known as a
    frozen mode.


    `TIM_OCMODE_ACTIVE`—Set the channel output to active level on `CCRx` match.


    `TIM_OCMODE_INACTIVE`—Set channel output to inactive level on `CCRx` match.


    `TIM_OCMODE_TOGGLE`—Toggle channel output when the timer counter (`CNT`) matches
    the `CCRx`.


    ![Images](c0218-03.jpg)


    `TIM_OCMODE_FORCED_ACTIVE`—Force channel output high independently from the timer
    counter (`CNT`) value.


    `TIM_OCMODE_FORCED_INACTIVE`—Force channel output low independently from the timer
    counter (`CNT`) value.


    **NOTE** PWM Mode 1: When the timer is upcounting, the channel will be active
    for as long as the `Period` is less than the `Pulse`, otherwise it is inactive.
    In a downcounting mode, the channel is inactive for as long as the `Period` is
    greater than the `Pulse`, otherwise it is active.


    PWM Mode 2: When the timer is upcounting, the channel will be inactive as long
    as the `Period` is less than the `Pulse`, otherwise it is active. In downcounting
    mode, the channel is active for as long as the `Period` is greater than the `Pulse`,
    otherwise it is inactive.


    `uint32_t Pulse;`—This value be stored inside the `CCRx` register and it establishes
    when the output is triggered.


    `uint32_t OCPolarity;`—Define the output channel polarity when the `CCRx` registers
    matches with the `CNT`. This parameter can be one of the two values of the following
    defines:


    ![Images](c0219-03.jpg)


    `uint32_t OCNPolarity;`—Define the complementary output polarity. It is a mode
    available only in `TIM1` and `TIM8` advanced timers, which allow two additional
    dedicated channels to generate complementary signals, i.e., when the channel 1
    is HIGH then channel 1N is LOW and vice versa. This feature is especially useful
    for motor control applications. This parameter can be one of the two values of
    the following defines:


    ![Images](c0219-05.jpg)


    `uint32_t OCFastMode;`—Specifies the fast mode state. This parameter is valid
    only in `PWM1` and `PWM2` mode. This parameter can be one of the two values of
    the following defines:


    ![Images](c0219-07.jpg)


    `uint32_t OCIdleState;`—Specifies the state of the channel output compare pin
    during the timer idle state. This parameter can be one of the two values of the
    following defines:


    ![Images](c0219-09.jpg)


    **NOTE** This parameter is available only in `TIM1` and `TIM8` advanced timers.


    `uint32_t OCNIdleState;`—Specifies the state of the complimentary channel output
    compare pin during the timer idle state. This parameter can be one of the two
    values of the following defines:


    ![Images](c0220-02.jpg)


    **NOTE** This parameter is available only in `TIM1` and `TIM8` advanced timers.


