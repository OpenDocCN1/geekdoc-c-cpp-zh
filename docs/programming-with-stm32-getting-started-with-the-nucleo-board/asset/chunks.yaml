    \ Location”（项目位置）文本框显示你希望存储项目文件夹的位置。你可以使用“Browse”（浏览）按钮找到合适的目录。对于本次演示，我使用了与之前书籍项目相同的路径。下一个标题为\
    \ `Toolchain Folder Location`（工具链文件夹位置）的文本框应该是使用项目位置和项目名称组合命名的目录。请记住此位置，因为你稍后需要访问\
    \ CubeMX 自动创建并存储在其中的文件。\n\n接下来，确保你已选择 `MDK-V4` 作为要使用的工具链/IDE，如图 3-16 所示。此选择非常重要，因为如果不勾选此项，CubeMX\
    \ 将无法生成正确的 `C`/`C++` 代码。此外，确保勾选了 `Generate Under Root`（在根目录下生成）复选框，这将允许生成的代码位于正确的目录。\n\
    \n默认的链接器设置（Settings）是可以的。检查 `MCU Reference`（MCU 参考）文本框是否与你使用的 MCU 匹配。如果不匹配，生成的代码无法在物理\
    \ MCU 上运行。\n\n最后，`Firmware Pack Name`（固件包名称）、`Version`（版本）文本框以及 `Use Default Firm\
    \ Location`（使用默认固件位置）文本框保持默认即可。\n\n为了准备生成代码，返回点击 `Project`（项目）菜单栏并点击 `Project\
    \ Settings`（项目设置）子菜单。接下来，点击 `Code Generator`（代码生成器）选项卡，将出现如图 3-17\n\n**图 3-17**\
    \ *代码生成器界面*\n\n确保所有的单选按钮和复选框都已选中，如图 3-17 所示，返回 `Project` 子菜单，但这次点击 `Generate Code`（生成代码）选项。CubeMX\
    \ 需要几秒钟来生成代码，屏幕上会出现进度条。当代码生成完成后，你应该会看到信息对话框，如图 3-18 所示。\n\n![images](img/fig03-18.jpg)\n\
    \n**图 3-18** *成功生成代码的对话框*\n\n点击 `Open Project`（打开项目）按钮后，你将看到 Keil IDE 主窗口，其中 `STM32Nucleo_F302`\
    \ 项目目录和文件列表将出现在 IDE 的 Project（项目）窗格中。此视图如图 3-19 所示。\n\n![images](img/fig03-19.jpg)\n\
    \n**图 3-19** *Keil IDE 中的 STM32Nucleo_F302 项目*\n\nProject 窗格中显示四个子目录：`STM32Nucleo_F302`、`Application/MDK-ARM`、`Drivers/CMSIS`\
    \ 和 `Application/User`，如图 3-20 所示。你可以展开这些目录以查看其中包含的文件。\n\n![images](img/fig03-20.jpg)\n\
    \n**图 3-20** *项目、子目录和文件列表*\n\n你的列表将根据你使用的 MCU 而变得类似。你还会看到一个提示你未找到设备的弹出对话框，如图 3-21\
    \ 所示。\n\n![images](img/fig03-21.jpg)\n\n**图 3-21** *未找到设备的对话框*\n\n通过点击 `File`\
    \ → `Device Database` 可以解决此问题，如图 3-22 所示。\n\n![images](img/fig03-22.jpg)\n\n**图\
    \ 3-22** *设备数据库选择*\n\n接下来，选择 `STMicroelectronics` 作为制造商，向下滚动其大量的 MCU 列表，直到找到你的特定型号。在我的情况下，我没有找到\
    \ `STM32F02R8`，但找到了 `STM32F02RB`，它看起来运行良好。未来可能会出现某些问题，但到目前我还没有遇到过。图 3-23 显示了 `STM32F02RB`\
    \ 选择的结果。\n\n![images](img/fig03-23.jpg)\n\n**图 3-23** *STM32F02RB 选择*\n\n只需点击\
    \ `Close` 按钮，因为没有 `Submit` 或 `Select` 按钮。\n\n## main.c 代码列表\n\n以下代码是 `main.c`，它是根据我输入的参数和设置自动生成的。`main`\
    \ 方法正如我提到的，包含了程序所需的大部分功能代码。在这个模板中，它是故意留空的，因为没有所需的功能。CubeMX 自动生成的注释将帮助你将自己的代码放置在正确的位置。\n\
    \n在 `main` 中还有一系列方法调用，用于初始化和配置 MCU 的内部外设和 GPIO 引脚。它们按照调用顺序列出：\n\n```c\nwhile (1)\
    \ {\n    // 功能性代码在此处\n}\n```\n\n`while (1)` 语句会导致其范围内的所有内容无限重复。这是一个必要的软件结构，因为大多数嵌入式系统不使用操作系统（OS），任何运行的程序只会运行一次然后就会崩溃。功能性代码（例如闪烁\
    \ LED）应该放置在此 while 循环中。\n\n"
