    ## The main.c Code Listing


    The following code listing is a file named main.c which was automatically generated
    by the CubeMX application based solely on the parameters and configuration settings
    that I entered. My purpose for this listing is to show you the basic template,
    which will constitute the bulk of the code for all the remaining projects in this
    book. In this listing is a method named main, which is where the majority of any
    functional code will be placed. In this template, it is intentionally empty because
    there is no functionality desired for this program. I am also required to show
    the voluminous STM disclaimer comments, which are part of STM’s copyright requirements
    to use this code. This disclaimer will be present in all the actual code examples
    presented in the book. However, it will not be expanded as shown in this listing.
    You can always click on a small + sign to display the disclaimer.


    After the listing, I have provided some additional comments regarding the methods
    contained in the listing.


    ![Images](c0073-01.jpg)


    ![Images](c0074-01.jpg)


    ![Images](c0075-01.jpg)


    ![Images](c0076-01.jpg)


    ![Images](c0077-01.jpg)


    The main method, as I have previously mentioned, contains most of the functional
    code required by the program. The following code snippet in the main method is
    what I refer to as a forever loop:


    ![Images](c0078-01.jpg)


    The `while (1)` statement causes everything contained within its scope braces
    to be repeated indefinitely or as I call it “forever.” This is a necessary software
    construct because the majority of embedded systems do not use an operating system
    (OS) and any running program would simply run once and then halt and likely crash.
    Functional code, such as for blinking an LED, would be placed in this while loop.
    The automatic comments generated by the CubeMX application will help guide you
    in placing your own code in the proper spots.


    There are also a series of method calls in main that both initialize and configure
    the internal peripherals and GPIO pins for the MCU. These are listed in the same
    sequence as they are called:


    ![Images](c0078-02.jpg)


    There can be additional methods added to the main.c file depending upon the number
    and types of internal peripherals that are enabled. In addition, some extra code
    will have to be added to files outside of main.c to support operations such as
    interrupts. I will cover those cases in later chapters.


    At this point, I need to discuss the ARM CMSIS software architecture in order
    for you to understand how the newly generated code fits in with the overall software
    architecture.


    ### ARM Cortex Microcontroller Software Interface Standard (CMSIS)


    ARM, which holds the intellectual property (IP) rights to all the Cortex-based
    MCUs, has created an interface standard that allows for efficient cross-vendor
    software development. This standard is called the Cortex Microcontroller Software
    Interface Standard and usually abbreviated as CMSIS. CMSIS addresses a full set
    of development tools including compilers, run-time libraries, debuggers, and other
    associated tools and utilities. CMSIS consists of the following main components:


    •   CMSIS-CORE: Standard application programming interface (API) covering the
    Cortex M0, M3, M4, and M7 processors and associated peripherals.'
