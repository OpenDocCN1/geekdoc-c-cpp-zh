  raw: 'In this chapter I present an in-depth discussion of the STM32CubeMX application,
    which is a free utility provided by STMicroelectronics (STM). I will also start
    referring to it as CubeMX to just simplify the terminology. I would also like
    to acknowledge a fine Leanpub eBook published by Carmine Noviello titled *Mastering
    STM32*. Carmine’s book was invaluable reference alongside the STM datasheets without
    which I could not have created this book.


    CubeMX is a fairly complex utility because it is intended to encompass nearly
    all the microcontroller chips (MCUs) and development boards that STM offers. This
    is quite an amazing feat considering that there are hundreds of MCU variants and
    dozens of development boards that STM manufactures. The CubeMX supports these
    devices by automatically generating C code that developers can easily use in their
    programs. The generated code is designed to support specific integrated peripheral
    (IP) devices included on the selected MCU. CubeMX may be regarded as a MCU-centric
    utility because of the following features:


    •   MCU selection based on the STM family, that is, F0, F1, …


    •   Specific IP required for the project involving mapping MCU peripherals to
    a specific pinout


    •   Handles specific MCU clock, power, interrupt control, ...


    •   Automatically adapts pinout to package configuration


    •   Manages the ST hardware abstraction layer (ST HAL)


    •   Manages external libraries


    •   Adaptable to a variety of IDEs


    [Figure 3-1](#ch3.xhtml_ch3fig1) shows the opening screen when the application
    is initially launched.


    ![images](fig03-01.jpg)


    **Figure 3-1**   *CubeMX opening screen.*


    There are three choices available on the screen:


    •   New Project


    •   Load Project


    •   Help


