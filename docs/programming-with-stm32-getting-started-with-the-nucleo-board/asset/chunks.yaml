    ### Connecting Channel 1 PWM Output to an LED/Resistor


    [Figure 10-7](#ch10.xhtml_ch10fig7) shows the connections for the same LED/resistor
    combination, which I earlier used for the project demonstration in [Chapter 5](#ch5.xhtml_ch5).
    The LED/resistor is connected between PA1 and ground using the Arduino protoboard.


    ![images](fig10-07.jpg)


    **Figure 10-7**   *LED/resistor connected on the Arduino protoboard.*


    ### Test Results


    I observed that the LED luminescence did vary considerably with the duty cycle
    of the applied PWM signal. You should realize one important distinction between
    dimming an incandescent bulb and an LED. The incandescent bulb intensity corresponds
    to the average voltage applied to it, while the LED luminescence depends on your
    eye’s integrative response. By this, I mean the voltage applied to the LED is
    at a constant level, but the time interval applied varies with the duty cycle.
    The human eye will tend to integrate or average out the LED light intensity and
    thus perceive different intensities for varying duty cycles. The eye also has
    a nonlinear relationship between actual luminance and perceived brightness, as
    shown in [Figure 10-8](#ch10.xhtml_ch10fig8).


    ![images](fig10-08.jpg)


    **Figure 10-8**   *Human eye brightness perception.*


    What this all means is that the eye will more easily recognize different LED luminescence
    at small duty cycles but will not perceive any significant differences as the
    duty cycle increases. There are equations that model the eye brightness to luminance
    relationship quite well and have been codified as the CIE1931 lightness formula.
    White light LED manufacturers have modified their products using this relationship
    to make their commercial LEDs have a linear dimming property. I have not done
    this with this single LED demonstration, but it is quite doable and you would
    put the code into the main.c forever loop.


    I did try to capture the intensity difference between 100% and 10% duty cycles.
    [Figure 10-9](#ch10.xhtml_ch10fig9) is a composite photograph with the 100% PWM
    on the left and the 10% PWM on the right.


    ![images](fig10-09.jpg)


    **Figure 10-9**   *100% and 10% PWM signal-duty cycles applied to a red LED.*


    The camera shutter speed that was required for these images was fairly long, which
    tended to make the 10% image much brighter than it actually was. I guess you will
    just have to duplicate this demonstration and see the actual duty cycle versus
    perceived luminance for yourself.


    ## Demonstration Three


    In this demonstration I will be controlling a RGB LED that has three input lines,
    one for each color. GP timer TIM2 will be reconfigured to have three PWM outputs
