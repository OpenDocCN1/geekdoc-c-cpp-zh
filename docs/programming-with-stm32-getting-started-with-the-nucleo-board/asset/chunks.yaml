  trans: '


    - `CMSIS-Driver`: 外设驱动程序软件，用于将所有适用设备与支持的中间件软件进行接口。该 CMSIS 部分包含文件系统、通信栈和用户界面等项。

    - `CMSIS-DSP`: 广泛的优化库，支持包括固定点和浮点数据类型在内的不同数据。该库适用于 `Cortex M0`、`M3`、`M4` 和 `M7`
    核心处理器。

    - `CMSIS-RTOS`: 实现实时操作系统（RTOS）的标准化 API。该 API 提供了一个支持多种特定 `Cortex` RTOS 实现的框架。

    - `CMSIS-DAP`: 调试访问端口（DAP）是一组标准的固件例程，实现了针对 `Cortex` 处理器优化的调试功能。它连接到 `CoreSight
    Debug Access Port` 以快速访问实时数据。

    - `CMSIS-SVD`: 这是一个名为系统视图描述（SVD）的可扩展标记语言（XML）文件，它包含了外设描述，适用于编程语言头文件（include）文件以及调试器和中断控制器。

    - `CMSIS-Pack`: 一个包含各种设备逻辑描述和参数的 XML 文件集合。使用名为 `PDSC` 的主文件从 XML 文件集合中提取所需数据。


    需要注意的是，下一章讨论的 STM 硬件抽象层（`HAL`）仅包含与 STM MCU 相关的特定内容，在某种程度上不符合 ARM Cortex 微控制器软件接口标准（`CMSIS`）。对于制造基于
    ARM 的 MCU 的厂商来说，使用 `CMSIS` 完全是自愿的，而 STM 显然认为使用 `HAL` 是其处理所生产的各种 MCU 及相关开发板的最佳方法。我相信
    STM 试图保持与 `CMSIS` 的兼容性，但仍然需要支持其庞大的产品。


    ## CubeMX 生成的 C 代码


    现在是回到讨论 CMSIS 框架引入的自动生成代码了。图 3-24 是新生成目录的一个有趣组合，展示了它们如何与各种 CMSIS 组件相关联。


    ![images](img/fig03-24.jpg)


    **图 3-24** 与 CMSIS 结构相关的生成代码。


    `Application/User` 目录本质上包含骨架文件，提供了一个框架，用户可以在其中填充特定代码以实现所需的应用程序。这些目录中的文件仅适用于 `Application`
    块，如图 3-24 所示。


    `Drivers/CMSIS` 结构包含命名如 `core_cm3`、`core_cm4` 等的头文件，这些文件包含了真实 MCU 外设及所有相关控制/数据寄存器所需的特定逻辑定义。还有核心
    MCU 定义以及中断控制器定义和辅助函数。


    `Drivers/STM32F3xx_Hal_Driver` 目录包含了 MCU 操作所需的其他目录文件中未提供的全部剩余数据和参数。这些数据涵盖了中断号、外设设备地址、重启向量和额外的辅助函数等项。


    `Application/MDK-ARM` 包含初始化目标 MCU 所的 ARM 特定启动代码。


    ## 编译并下载项目


    此时，已经有足够的初始化和配置代码来构建一个适用于在目标上运行的可下载文件。遗憾的是，这是一个空项目，意味着 MCU 没有完成任何有意义的任务。然而，确定当前代码是否可以编译并下载到目标机仍然是一项有用的练习。


    图 3-25 显示了 Keil IDE 编译图标的位置。点击此图标将启动自动构建过程，将项目中的源代码转换为二进制文件。


    ![images](img/fig03-25.jpg)


    **图 3-25** Keil IDE 编译图标。


    图 3-26 显示了构建过程中发生的所有中间结果。在构建过程中可能发生错误的情况下，此日志会非常有用。


    ![images](img/fig03-26.jpg)


    **图 3-26** 构建过程日志。


    你可能已经注意到最终编译并链接的二进制文件是 `axf` 格式。这种格式不兼容 `ST-LINK`，因为 `ST-LINK` 期望下载文件为 `hex` 格式。通过点击
    `Flash` 菜单选择然后点击 `Configure Flash Tools` 可以轻松解决这个问题。在 flash 工具选择打开后，点击 `Output`
    选项卡。然后勾选 `Create HEX File` 旁边的复选框。图 3-27 显示了此选择。


    ![images](img/fig03-27.jpg)


    **图 3-27** 选择 hex 文件输出。


    一旦选择了 `hex` 文件，必须重新构建项目。这只需再次点击编译图标即可完成。IDE 足够智能，能够源代码不需要重新编译，只需再次链接即可形成 `hex`
    文件。生成的 `hex` 文件清晰地显示在图 3-28 中。


    ![images](img/fig03-28.jpg)


    **图 3-28** Hex 文件输出。


    一旦创建了 `hex` 文件，就可以对目标机进行程序设计了。使用 `ST-LINK` 应用将 hex 文件下载到目标机。


    ## 下载 Hex 代码


    你首先需要打开 ST-LINK 应用并打开要下载的 hex 文件。该文件作为构建过程的一部分自动放在项目的 `MDK-ARM` 子目录下。你将需要使用 `File`
    菜单浏览到目录。图 3-29 显示了如何选择示例 hex 文件。


    ![images](img/fig03-29.jpg)


    **图 3-29** 打开要下载的 hex 文件。


    然后必须使用 USB 线将目标机连接到运行 ST-LINK 应用的主机，如前所述。你接下来需要点击 `Target` 菜单选择，然后点击 `Connect`
    选择。图 3-30 显示了应用程序连接到目标后的 ST-LINK 窗口。


    ![images](img/fig03-30.jpg)


    **图 3-30** ST-LINK 连接到目标


    剩下的就是下载到 ST-LINK 应用中的 hex 文件。点击 `Target` 菜单选择，然后点击 `Program and Verify` 选择。图 3-31
    显示了 Program and Verify 对话框。


    ![images](img/fig03-31.jpg)


    **图 3-31** Program and Verify 对话框


    点击 `Start` 按钮将 hex 文件下载到目标板。Nucleo 板上的红绿 LED 开始交替闪烁，指示下载操作正在进行。虽然下载非常快，但 LED 将继续闪烁。我猜
    STM 的工程师只是想让用户知道板子已经下载了程序。图 3-32 显示了成功下载的结果。


    ![images](img/fig03-32.jpg)


    **图 3-32** 成功的 hex 文件下载


    目标板应该按照其程序运行。在这种情况下，什么都不会发生，因为没有编写任何功能。在程序中添加功能的操作将在下一章中研究。然而，我想确保下载是正确的，因此之前为目标机编写了闪烁用户
    LED。一旦新的 hex 文件下载完成，LED 停止了闪烁，这间接证明了无功能的程序已正确下载。


