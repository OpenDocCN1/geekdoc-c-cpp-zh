    The timer `TIM6` is used as trigger for the `DAC`’s `TRGO` line and its period
    must then be set to `13334`. The high-speed external clock (`HSE`) input into
    `TIM6` was set at `64 MHz` with no prescaling. This means the timer period value
    must be set to `64 MHz/13.33 K` or approximately `4800`. The actual period value
    was set at `4799` to account for the added `frequency` calculation.


