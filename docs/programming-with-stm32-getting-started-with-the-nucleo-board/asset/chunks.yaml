    The significant addition to this basic code is the DAC Init function `MX_DAC_Init`.
    The CubeMX application generated this code when the DAC peripheral was enabled
    during the project creation process. There is really nothing remarkable that is
    happening in this function other than the output buffer is enabled and any DAC
    trigger is disabled.


    The functional code that produces an output waveform is located in the forever
    loop of the main method. This code segment is relisted below to allow for an easier
    reference:


    ![Images](c0268-04.jpg)


    There are two while loops within the forever loop, one which counts up and outputs
    a slowly increasing voltage and other counts down and outputs a slowly decreasing
    voltage. The waveform period is determined by the delay value, which in this demonstration
    has been set to 1 ms between each digital incremental value. The `HAL_DAC_SetValue`
    method causes the DAC to output on DAC channel 1 an analog voltage based on the
    12-bit, right endian justified value for the index i.


    ### Test Results


    [Figure 11-8](#ch11.xhtml_ch11fig8) is a screen shot from a USB oscilloscope connected
    to PA4, which is the DAC channel 1 output for the STM32F302R8 MCU.


    ![images](fig11-08.jpg)


    **Figure 11-8**   *DAC output.*


    You can see that it is relatively clean triangular waveform with a 1.626-ms period
    or an approximate frequency equal to 615 Hz. The peak-to-peak amplitude varies
    between approximately 1.6 and 3.3 V. These particular voltages are a result of
    using the values 2000 and 4000 as the DAC input limits, respectively.


    I am reasonably sure that you can also increase the waveform frequency by decreasing
    the delay in the code as described above. Readers should try experimenting to
    determine the ultimate frequency limit.


    ## Demonstration Three


    In this last demonstration I will be operating the DAC in a DMA mode to output
    a sine wave that is synthesized by the application. Generating an analog signal
    is a common task assigned to a DAC. DMA is the preferred operational method because
    it frees up the core processor to attend to higher priority tasks rather than
    focusing on generating binary input for the DAC. The following generalized statement
    both starts the DAC and performs a DMA data transfer from memory to the peripheral:


    ![Images](c0269-01.jpg)


    In this demonstration, only one DAC channel named `DAC_CHANNEL_1` is available.
    The argument uint32_t* pData is a data pointer, which in this case will point
    to the beginning of the 200 element SINE array. The uint32_t Length argument is
    the number of data elements to be transferred, which is the NSAMP constant with
    value 200\. Finally, the uint32_t Alignment argument specifies the data element
    bit size and whether the data is right or left justified. In this case, the define
    `DAC_ALIGN_12B_R` shows the data is 12-bit and is aligned to the right, meaning
    that the least significant data bit is also the rightmost bit.


    Synthesizing a sine wave requires setting the number of increments or steps that
    will go into making up a single cycle waveform. In this example, the number was
    set at 200, which is a good trade-off between having a representative sample and
    minimizing the total steps that need to be constantly handled. The resulting equation
    used to synthesize a 12-bit sine wave is as follows:


    ![Images](c0270-05.jpg)


    This equation was used to synthesize a single sine wave cycle with the `i` step
    ranging from 0 to 199.


    I next arbitrarily selected a period of 15 ms for the DAC sine wave output or
    an equivalent frequency of 66.67 Hz. This means that the conversion rate must
    be set at 66.67 * 200 or 13,334.'
