    You should also recall from the [Chapter 4](#ch4.xhtml_ch4) discussion that the
    blue user push button is connected to GPIO Port C, pin 13 and it is also constantly
    being pulled high. This means the button state will be high when not pushed and
    transition to a low value when pushed. The corresponding C snippet must continuously
    respond to this event as follows:


    ![Images](c0124-01.jpg)


    Enter the above code segment in the `main()` method to continue with the demonstration.
    Next compile and upload the hex file to the `Nucleo-64` board.


