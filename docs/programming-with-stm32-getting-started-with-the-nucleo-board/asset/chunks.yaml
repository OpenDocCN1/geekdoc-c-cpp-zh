    出现这一结果是因为步长为 `3.3/8` 或 `0.4125`。这是一个相当大的误差，仅由于涉及的位数较少才在这种情况下发生。对于真实的 12 位 STM
    DAC，步长将仅为 `3.3/4096` 或 `0.00080566 V`，大约为 `0.8 mV`。该步长将为数字提供极佳的模拟电压表示。回到数字示例，我计算了所有可能的二进制组合的所有八个模拟电压输出。这些如表
    11-1 所示。


