    ### Test Results


    The RGB LED initially showed a bright white light, which was expected because
    all the individual LED components had the same duty cycle. I then reset the individual
    CCRx registers to separately test each color and confirmed that they were operating
    properly. I also tried varying the duty cycles to create different colors with
    little success because of the way the RGB LED was constructed. It did not merge
    the light from each colored LED and therefore did not properly create an alternate
    color, which you can do if you were mixing paint. I believe I would have been
    successful if I had used a more expensive RGB LED with some built-in optics, but
    unfortunately all I had was a very inexpensive RGB LED. In any case, the objective
    for this demonstration was to show you how to create and use multiple PWM outputs,
    which I believe was achieved.


