    ### Test Results


    I observed that the user LED did light after the hex file was downloaded into
    the project board. However, I desired a better indication that the DMA operation
    did run successfully. To do this, I started the Realterm application and monitored
    the virtual communications port that is logically connected to the USART2 peripheral.
    [Figure 11-5](#ch11.xhtml_ch11fig5) shows the screen capture displaying the data
    message sent out from the peripheral.


    ![images](fig11-05.jpg)


    **Figure 11-5**   *Realterm screen display.*


    This absolutely confirmed that the USART2 peripheral transmitted the data message
    to memory via DMA.


    This demonstration should now have convinced you of the DMA usefulness. It is
    time to introduce the DAC peripheral and really demonstrate how DMA can significantly
    improve MCU operations.


    ### DAC Peripheral


    I will first explain the principles behind the DAC peripherals in order for you
    to understand how it requires rapid data transfers to operate efficiently.


    ## DAC Principles


    The DAC design used in STM MCUs is based on a R-2R resistor ladder network concept.
    This concept is easily explained by referring to [Figure 11-6](#ch11.xhtml_ch11fig6).


    ![images](fig11-06.jpg)


    **Figure 11-6**   *R-2R design concept.*


    The resistive network acts like a programmable voltage divider between a reference
    voltage and ground. The usual reference voltage (V[ref]) for the STM DAC is the
    main 3.3-V supply. There is a 3-bit DAC, shown [Figure 11-6](#ch11.xhtml_ch11fig6),
    which makes it easy to discuss. In reality the DAC used in the project board has
    a 12-bit input.


    The binary inputs shown in [Figure 11-6](#ch11.xhtml_ch11fig6) are switched between
    0 V and V[ref] or 3.3 V. If a bit is high, it will cause its voltage input to
    weighted in the summed voltage output according to its bit position.


