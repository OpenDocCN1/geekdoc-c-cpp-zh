    我选择了名为 `gnuarmeclipse-openocd-win64-0.10.0-201701241841-setup.exe` 的版本，这是适用于 64
    位 Windows 系统的。该可执行文件的大小为 2.19 MB。将此文件下载到 `STM32Toolchain` 目录，以便任何需要它的工具链应用程序都能直接使用。该文件是一个自包含的可执行文件，只需运行即可在宿主机上安装
    OpenOCD。图 2-14 显示了软件安装的启动界面。


    ![images](img/fig02-14.jpg)


    **图 2-14** *OpenOCD 15 启动界面。*


    我建议在安装过程中接受所有的默认选项，在我的特定情况下，这只花费了一分钟左右。图 2-15 显示了 OpenOCD 设置软件完成安装过程后的完成界面。


    ![images](img/fig02-15.jpg)


    **图 2-15** *OpenOCD 完成界面。*


    运行 OpenOCD 工具与普通应用程序有所不同，因为它被设计成一种服务或后台程序。在 Unix 和 Linux 术语中，这种程序类型被称为守护进程（daemon）。访问该程序有两种方法：


    1. 使用端口 `4444` 的 `telnet` 工具：当创建 `telnet` 连接时，OpenOCD 像服务器一样工作。在接收到命令时它会做出相应响应。这是一个严格的命令行环境。

    2. 将 `telnet` 工具作为 GNU 项目调试器 (GDB) 的远程服务器：OpenOCD 实现了 GDB 远程协议，可以作为 GDB 和目标平台之间的中间器组件使用。GDB
    使用 IDE 的 GUI 环境。


    我选择使用 telnet 方法，因为它简单直接，并且能够满足大多数调试需求。GDB 更加复杂，并且通常与 Eclipse IDE 耦合，而本工具链中并没有使用该
    IDE。


    ### 建立 Telnet 连接


    在使用 telnet 之前，你必须完成的第一件事是在 Windows 10 上启用它。遗憾的是，它默认未启用，必须由用户手动完成。操作步骤相对简单，详细如下所示：


    1. 在搜索文本框中输入“控制面板”

    2. 点击“程序”

    3. 点击“程序和功能”

    4. 点击左栏中的“启用或关闭 Windows 功能”

    5.向下滚动并勾选“Telnet 客户端”旁边的复框

    6. 点击“确定”按钮


    启用 telnet 也有等效的命令行操作方法，但我发现 GUI 方法同样有效。


    接下来，你需要确定支持你项目所用特定开发板的相应 telnet 脚本。目前所有支持 Nucleo 板板的脚本详见 表 2-2。


    ![images](img/tab02-02.jpg)


    **表 2-2** *Telnet 脚本*


    我使用了名为 `st_nucleo_f3.cfg` 的配置文件，因为它与我的 `NUCLEO-F302R8` 开发板相关联。


    此过程的下部分是打开终端窗口。最简单、最快的方法是在搜索文本框中输入 `cmd`。在窗口中输入以下两条命令行：


    ```

    ![Images](img/c0047-01.jpg)

    ```


    切记使用与你的 Nucleo 开发板相应的配置文件。


    随后，OpenOCD 服务将在终端窗口中响应，显示如 图 2-16 所示。


    ![images](img/fig02-16.jpg)


    **图 2-16** *启动 OpenOCD 服务。*


    注意，OpenOCD 的响应序列中显示了一个错误信息，但我发现它并无关大碍，不会影响程序运行。然而，如果你在错误之后没有看到响应，意味着存在真实问题，因为在
    OpenOCD 程序和目标板之间没有建立通信链路。这个问题通常是由 Windows 尝试使用不正确的 `libusb` 版本导致的。请按照 Zadig 工具的步骤修复此问题。


    1. 根据你的 Windows 版本从 `http://zadig.akeo.ie/` (http://zadig.akeo.ie/) 下载 Zadig 工具。

    2. 将 Nucleo 开发板连接到电脑。

    3. 运行 Zadig 工具并选择 `Options → List All Devices`（选项 → 列出所有设备）。

    4. 短暂后，Nucleo 开发板将出现在设备列表组合框中。

    5. 如果尚未列出，请选择 `WinUSB` 驱动。

    6. 点击如 图 2-17 所示的 `Reinstall Driver`（重新安装驱动）按钮。


    ![images](img/fig02-17.jpg)


    **图 2-17** *重新安装驱动程序。*


