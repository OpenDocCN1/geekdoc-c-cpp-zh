    你应该清楚地看到，核心 `Cortex-M` 处理器与任何外设或内部内存之间的所有数据传输都必须通过 `Bus Matrix` 或 `FLITF` 块。数据根本没有其他方式可以到达处理器。每次数据传输都需要一定数量的处理器周期来完成。例如，处理器必须处理从连接到
    `UART` 外设的外部设备发送的所有数据，而这些数据被指定要存储在 `SRAM` 中。重要的是，处理器不会以任何方式修改或更改数据，而简单地将它们发送到正确的内存存储位置。这种对核心处理器参与的要求占用了宝贵的周期，而这些周期本可以被用于更高效的操作。一个类似的模型是：数据用汽车表示，而处理器比作城市。想要前往遥远目的地的跨国司机被迫通过一个拥有所有交通信号灯和拥堵街道的城市。如果有一条绕道公路，对司机来说将会好得多，因为这让他们可以避开城市。`DMA`
    控制器扮演了这条绕道的角色。


    回到图 11-1，你应该能看到在 `STM32F302R8` MCU 的情况下，`DMA1` 控制器直接连接到 `Bus Matrix`。正如我之前提到的，该控制器被设置为总线控制器或主设备，因此能够配置
    `Bus Matrix` 以直接在外设与内部内存之间、内存与内存之间、甚至另一个外设之间建立数据连接。这些配置自然地命名如下：


    * 外设到内存的传输

    * 内存到外设的传输

    * 外设到外设的传输

    * 内存到内存的传输


    `Bus Matrix` 控制核心处理器和 `DMA` 控制器对各种数据线、内存和外设的访问。它使用 `Round Robin`（轮询）算法来实现这种控制，确保两个控制器都能获得公平的访问。图
    11-3 是说明 `Bus Matrix` 如何与所有系统组件连接的框图。


    ![images](img/fig11-03.jpg)


    **图 11-3** *Bus Matrix 框图。*


    `Bus Matrix` 是一个复杂的电路，互连了以下主设备和从设备：


    * 核心 `Cortex-M` 处理器（主设备）

    * `DMA` 控制器（主设备）

    * 使用 `ICODE` 的 Flash 内存接口 (`FLITF`)（从设备）

    * 使用 `DCODE` 总线的 Flash 内存接口 (`FLITF`)（从设备）

    * 直接连接到 `SRAM`（从设备）

    * 高级高速总线 1 (`AHB1`)，它通过桥接电路（`Bridge 1` 和 `Bridge 2`）连接到高级外设总线 (`AHB1` 和 `APB`）（从设备）

    * 连接到 `GPIO` 引脚的高级外设总线 (`APB`)（从设备）

    * 直接连接到 `ADC1` 外设（从设备）


    ## DMA 控制器详情


    每个 `STM32 DMA` 控制器包含两个主端口，一个名为内存端口，连接到 `SRAM` 和 flash 等内部内存。另一个名为外设端口，连接到高级高性能总线
    (`AHB`)。`AHB` 反而与从设备外设连接。在 `STM32F302R8 DMA` 控制器中，外设端口还可以连接到内存控制电路，允许内存到内存的传输。


    `STM32 DMA` 控制器还有一个连接到 `AHB` 总线的从端口。这允许从另一个主设备（即核心处理器）对 `DMA` 控制器进行编程。


    `STM32F302R8 DMA` 控制器具有七个独立的可编程的通道，每个通道连接到单独的硬件线路。这就是从设备外设请求 `DMA` 控制器响应的方式。请求的确性质和类型是在
    MCU 硬件设计阶段配置的。不同的 `STM MCUs` 会根据 `MCU` 设计需求具有不同数量的通道以及不同的请求类型。


    还有一个优先级分配硬件单元，允许为七个 `DMA` 请求通道分配不同的优先级。高优先级通常分配给需要立即 `DMA` 响应的快速外设以及任何内存访问。


    图 11-4 显示了所有七个 `DMA` 通道以及在 MCU 设计阶段绑定到它们上的相应外设请求信号。


    ![images](img/fig11-04.jpg)


    **图 11-4** *DMA 通道框图。*


    图 11-4 是一个重要的图，因为当你尝试确定为特定的外设 `DMA` 请求使用哪个 `DMA` 通道时，它是你的准备参考。非常重要的是，在给定的外设请求线上，只能有一个外设处于激活状态。


    注意在图 11-4，`DMA` 通道具有默认优先级，这些优先级在硬件中固化，通道 1 最高，一直到通道 7 最低。然而，这些默认优先级可以被用户指定的优先级覆盖，用于确定在访问
    `AHB` 时哪些外设具有优先权。`DMA` 通道线通常通过所选外设的硬件信号触发，但也可以通过软件激活。软件触发是激活内存到内存传输的。


    ## 使用 HAL 配合 DMA


    `HAL` 框架使用 C 结构体 `DMA_HandleTypeDef` 来配置 `DMA` 控制器。


    `HAL` 框架使用 C 结构体 `DMA_HandleTypeDef` 来配置 `DMA` 控制器。


    ![Images](img/c0246-02.jpg)


    `DMA_HandleTypeDef` 结构体成员有：


    * `DMA_Channel_TypeDef *Instance;`——指向 `DMA` 通道的指针。例如，`DMA1_Channel5` 表示 DMA1
    的第五通道。

    * `DMA_InitTypeDef Init;`——`DMA_InitTypeDef` 的实例。

    * `HAL_LockTypeDef Lock;`——锁定对象。

    * `HAL_StateTypeDef State;`——DMA 状态。

    * `void *Parent;`——用于跟踪与当前 `DMA` 关联的外设句柄。例如，如果我们使用 `UART`，此字段将指向 `UART_HandleTypeDef`
    实例。

    * `void (* XferCpltCallback)(struct __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户
    `DMA` 传输完成。当 `DMA` 中断发生时，由 `HAL_IRQHandler` 函数自动调用。

    * `void (* XferHalfCpltCallback)(struct __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户
    `DMA` 传输完成一半或发生错误。当 `DMA` 中断发生时，由 `HAL_IRQHandler` 函数自动调用。

    * `void (* XferErrorCallback)(struct __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户
    `DMA` 传输发生错误。当 `DMA` 中断发生时，由 `HAL_IRQHandler` 函数自动调用。

    * `__IO uint32_t ErrorCode;`——DMA 错误代码。


    `HAL` 框架使用 C 结构体 `DMA_InitTypeDef` 初始化 `DMA` 控制器。每个成员将在结构体定义后分别讨论。


    ![Images](img/c0248-21.jpg)


    ![Images](img/c0249-01.jpg)


    `DMA_InitTypeDef` 结构体成员在下简要定义：


    * `uint32_t Direction;`——此值定义了 `DMA` 传输方向。此参数可以是以下定义中的任何值：

    * `DMA_PERIPH_TO_MEMORY`

    * `DMA_MEMORY_TO_PERIPH`

    * `DMA_MEMORY_TO_MEMORY`


