    - `Open-drain`

    - `Disabled`


    Finally, the I/O pin has programmable enabled resistors attached to the pin, which
    will allow for the following:


    - `Pull-up`

    - `Pull-down`

    - `Neither`


    This sample circuitry is replicated for every GPIO pin existing in the MCU.


    Each GPIO port has several registers attached to it, which control all of its
    pins’ behaviors by setting or resetting bits associated with the respective pins.
    [Figure 5-6](#ch5.xhtml_ch5fig6) shows the format for the GPIO port mode register
    for ports A … E and H.


    ![images](fig05-06.jpg)


    **Figure 5-6** *GPIO port mode register.*


    This register would be programmatically accessed by using the symbol `GPIOx_MODER`
    where `x` = A … E and H for the targeted port. The power-on reset values automatically
    placed in all the GPIO registers are as follows:


    - `0x0C00 0000` for port A

    - `0x0000 0280` for port B

    - `0x0000 0000` for all other ports


    The di-bit or two bit values that can be stored in a register have the following
    meanings:


    - `00`—Input mode

    - `01`—Output mode

    - `10`—Alternate function mode

    - `11`—Analog mode


    Additional GPIO registers further configure other behaviors that are associated
    with the port pins including the following:


    - Enabling `push-pull`, `open-drain`, or none (also called floating)

    - Enabling `pull-up`, `pull-down`, or none

    - Operational speed


