    ## 7


    ## Timers


    Timer peripherals are very important components within a MCU. Many embedded applications
    are time or temporal dependent and timers are the primary means by which the MCU
    controls the application. While it is certainly possible to use a MCU to directly
    time processes, it would be great waste of processing power and highly inefficient
    approach. Using hardware timers along with interrupts is really the only practical
    way to implement embedded time-dependent applications. Fortunately, there is a
    powerful timer variety provided by STM in its line of MCUs.


    ### STM Timer Peripherals


    A timer is simply a free-running counter that counts pulses from a clock source.
    Since the pulse train from a clock source has a known period or interval between
    pulses, the elapsed time is directly related to the number of pulses counted.
    The timer clock source used with a typical MCU is usually derived from an internal
    master clock. However, the master clock usually runs at a very fast speed, so
    timer pulses must be divided by hardware to more reasonable values that can be
    used by timers. The hardware used to “slow” the master clock rate varies and can
    be binary dividers (prescaler) or phase-locked loops (PLL). Timer counters can
    count up or accumulate counts until they overflow based on the number of bits
    used in the counter. A 16-bit counter will overflow when the maximum count of
    65535 is reached. An overflow interrupt is often the event which happens with
    this situation.


    Conversely, a timer counter can count down from some preset value and trigger
    an interrupt when it reaches a 0 value. This counter type is known as a decrementing
    counter and has many uses.


    Timers have many uses, including but not limited to the following:


    •   Generating a precise time base. All STM timers can do this.


    •   Measuring the frequency of an incoming digital pulse train.


    •   Measuring elapsed time on an output signal. This is called output compare
    for STM timers.


    •   Generating precise pulse-width modulation (PWM) signals used for servo and
    motor control.


    •   Generating single pulse with programmable length and delay characteristics.


    •   Generating periodic direct memory access (DMA) signals in response to update,
    trigger, input capture, and output compare events.


    There are following five broad categories of STM timers:


    •   Basic: Simple 16-bit timers. They do not have inputs or output pins. They
    are principally used as “masters” for other timers. They also are used as a digital-to-analog
    converter (DAC) clock source. They can generate a time base like all STM timers
    can do.


    •   General purpose (GP): These are 16-bit or 32-bit timers with both input and
    output pins. They can do all of the functions described in the above list. GP
    timers can have up to four programmable channels, which may be configured as follows:


    •   One or two channels


    •   One or two channels with a complementary output. The complementary output
    has a “dead time” generator, which provides for an independent time base.


    •   Advanced: All the features of the GP timer with additional functions related
    to motor control and digital power conversion. There are three complementary outputs
    available with this timer category with an emergency shutdown input.


    •   High resolution: Multiple high-resolution outputs made possible by six sub-timers,
    one master and five slaves. Multiple dead-time insertions are possible with this
    timer. There are also five fault inputs and 10 external event inputs. This timer
    has the acronym HRTIM1 in STM terminology.


    •   Low power: Timers used in exceptional low-power applications. These timers
    are designed to stay running in just about all STM MCU modes, except the Standby
    mode. They can even continue to operate without an internal clock source.


    The STM32F302R8 MCU used in the demonstration board has basic, GP, and advanced
    timers. I will focus on how these timers function and are programmed. The concepts
    discussed will also apply to the other timer types if you encounter them in other
    projects. As always, the manufacturer datasheets are your best resource to determine
    how a particular timer works and how it should be programmed.


    The STM32F302R8 MCU has six timers, as shown in [Table 6-1](#ch7.xhtml_ch6tab1).
    This table has a handy reference to keep in mind when selecting and programming
    a timer.


    ![images](tab06-01.jpg)


    **Table 6-1**   *STM32F302R8 MCU Timers*


    I will now discuss how to configure a STM timer using the HAL framework.


    ### STM Timer Configuration


