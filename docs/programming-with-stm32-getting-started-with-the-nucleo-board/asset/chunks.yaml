- fmt: "\nThere are two USARTs in the STM32F302R8 MCU use in the project board. These\
    \ are logically referred to as `USART1` and `USART2\\`. They are the primary means\
    \ by which the MCU can send and receive data other than by processing data bits\
    \ through the `GPIO` ports or by using one of the other communication protocols,\
    \ such as the `I2C` and `SPI` bit-serial interfaces. The latter two are used mainly\
    \ for sensor data, although there is a very nice `I2C` peripheral that can display\
    \ text messages. Later in the chapter, I will discuss how to set up the `USART2`\
    \ USART to communicate with a PC terminal program. However, I now need to discuss\
    \ how to initially configure a USART.\n\nNOTE The software to initialize and configure\
    \ UARTs and USARTs is identical. Do not worry that a USART is being discussed,\
    \ while the function or typedef has `UART` in the name.\n\n# USART Configuration\n\
    \nSTM USARTs are configured in a similar manner as GPIO pins, interrupts, and\
    \ timers that I have previously discussed. STM USARTs are initialized using a\
    \ C struct named `UART_HandleTypeDef`. It is configured using a C struct named\
    \ `UART_InitTypeDef`. I will first discuss the `UART_HandleTypeDef`, which contains\
    \ the following members:\n\n![Images](c0170-04.jpg)\n\nSome of the more important\
    \ members of this struct are discussed below:\n\n*   `Instance`: This is the pointer\
    \ to the USART descriptor. For example, `USART2` is the descriptor of the `UART`\
    \ associated to the ST-LINK interface.\n*   `Init`: This is an instance of the\
    \ C struct `UART_InitTypeDef`, which is used to configure the `UART` interface.\n\
    *   `AdvancedInit`: Used to configure more advanced UART features like the automatic\
    \ `BaudRate` detection and TX/RX pin swaps.\n*   `pTxBuffPtr`: Points to the transmit\
    \ buffer used as the data source for transmitted bytes.\n*   `TxXferCount`: Holds\
    \ the count of transmitted bytes.\n*   `pRxBuffPtr`: Points to the receive buffer\
    \ where incoming bytes will be stored.\n*   `RxXferCount`: Holds the count of\
    \ received bytes.\n*   `Lock`: This field is used internally by the `HAL` to lock\
    \ concurrent accesses to UART interfaces.\n\nThe C struct `UART_InitTypeDef` contains\
    \ the following members:\n\n![Images](c0171-02.jpg)\n\nThese struct members represent\
    \ the following USART parameters and settings:\n\n`Baudrate`: This parameter is\
    \ the connection speed in bits per second. [Table 8-1](#ch8.xhtml_ch8tab1) shows\
    \ a chart of standard and nonstandard baud rates that are available with the STM\
    \ USART peripheral.\n\n![images](tab08-01.jpg)\n\n**Table 8-1 Baud Rate Chart**\n\
    \n*   `WordLength`: This value specifies the number of data bits transmitted or\
    \ received in a frame. This field can assume one of the following defines:\n \
    \   *   `UART_WORDLENGTH_8B`\n    *   `UART_WORDLENGTH_9B`\n*   `StopBits`: This\
    \ field specifies the number of stop bits transmitted. This field can assume one\
    \ of the following defines:\n    *   `UART_STOPBITS_1`\n    *   `UART_STOPBITS_2`\n\
    *   `Parity`: This value indicates the parity mode. This field can assume one\
    \ of the following defines:\n    *   `UART_PARITY_NONE`\n    *   `UART_PARITY_EVEN`\n\
    \    *   `UART_PARITY_ODD`\n*   `Mode`: This value specifies whether the RX and/or\
    \ TX mode is enabled or disabled. This field can assume one of the following defines:\n\
    \    *   `UART_MODE_RX`\n    *   `UART_MODE_TX`\n    *   `UART_MODE_TX_RX`\n*\
    \   `HwFlowCtl`: This value specifies whether the RS2326 Hardware Flow Control\
    \ mode is enabled or disabled. This field can assume one of the following defines:\n\
    \    *   `UART_HWCONTROL_NONE`\n    *   `UART_HWCONTROL_RTS`\n    *   `UART_HWCONTROL_CTS`\n\
    \    *   `UART_HWCONTROL_RTS_CTS`\n*   `OverSampling`: This value helps discriminate\
    \ noise from true signal levels. The selected oversampling rate is a tradeoff\
    \ between noise immunity and maximum possible communication speed. This field\
    \ can assume one of the following defines:\n    *   `UART_OVERSAMPLING_8`\n  \
    \  *   `UART_OVERSAMPLING_16`\n\nThe above discussion details how a USART can\
    \ be initialized and configured, but I still need to explain how to set up a communication\
    \ link between the project board and a remote node, which will be the PC connected\
    \ to the board.\n\n# Windows Terminal Program\n\nYou will need a terminal program\
    \ installed in order to display the text messages being transmitted from the demonstration\
    \ board. There are a number of terminal programs that are free and readily available\
    \ to download. I chose a program named `Realterm` that is available from [https://sourceforge.net/projects/realterm/](https://sourceforge.net/projects/realterm/).\
    \ It is full-featured terminal program that I found very easy to configure and\
    \ run. [Figure 8-4](#ch8.xhtml_ch8fig4) shows the `Realterm` screen after I clicked\
    \ on.\n\n![images](tab08-01.jpg)\n\n**Table 8-4 Realterm screen**\n\n*   `Baudrate`:\
    \ 9600\n*   `Parity`: None\n*   `Data Bits`: 8\n*   `Stop Bits`: 1\n*   `Hardware\
    \ Flow Control`: None\n*   `Port`: 6\n\nThe above discussion is is to show how\
    \ to configure the terminal.\n\n# Enabling USART2\n\nUp until this program, I\
    \ have not had to use the IP tree view in the CubeMX application to configure\
    \ a peripheral. That has been done for me because I was only using GPIO pins and\
    \ not alternative functions. However, I will now need to enable the USART2 alternative\
    \ function in order to have the communications link work. You configure `USART2`\
    \ when creating a new project, and the Pinout window is shown. [Figure 8-7](#ch8.xhtml_ch8fig7)\
    \ shows how `USART2` is configured by selecting `Asynchronous` from the `Mode`\
    \ dropdown menu.\n\n![images](tab08-01.jpg)\n\n**Figure 8-7 Configuring USART2**\n\
    \nThe CubeMX application will automatically insert an initialization method `static\
    \ void MX_USART2_UART_Init(void)` in the `main.c` file when the `USART2` function\
    \ is enabled.\n\nYou need to set the appropriate communications parameters in\
    \ this method as shown in the following code:\n\n```c\nstatic void MX_USART2_UART_Init(void)\n\
    {\n  huart2.Instance = USART2;\n  huart2.Init.BaudRate = 9600;\n  huart2.Init.WordLength\
    \ = UART_WORDLENGTH_8B;\n  huart2.Init.Parity = UART_PARITY_NONE;\n  huart2.Init.StopBits\
    \ = UART_STOPBITS_1;\n  huart2.Init.Mode = UART_MODE_TX_RX;\n  huart2.Init.HwFlowCtl\
    \ = UART_HWCONTROL_NONE;\n  HAL_UART_Init(&huart2);\n}\n```\n\n# USART Transmit\
    \ Demonstration Program\n\nThe following program will display a continuously varying\
    \ value in a terminal window. The purpose of this demonstration is to show how\
    \ the `USART` can transmit data to a terminal program. \n\n```c\nwhile (1)\n{\n\
    \  HAL_UART_Transmit(&huart2, (uint8_t *)\"Hello World\\r\\n\", 13, HAL_MAX_DELAY);\n\
    \  HAL_Delay(500);\n}\n```\n"
  raw: 'There are two USARTs in the STM32F302R8 MCU use in the project board. These
    are logically referred to as USART1 and USART2\. They are the primary means by
    which the MCU can send and receive data other than by processing data bits through
    the GPIO ports or by using one of the other communication protocols, such as the
    I2C and SPI bit-serial interfaces. The latter two are used mainly for sensor data,
    although there is a very nice I2C peripheral that can display text messages. Later
    in the chapter, I will discuss how to set up the USART2 USART to communicate with
    a PC terminal program. However, I now need to discuss how to initially configure
    a USART.


    ***NOTE***  *The software to initialize and configure UARTs and USARTs is identical.
    Do not worry that a USART is being discussed, while the function or typedef has
    UART in the name.*


    ## USART Configuration


    STM USARTs are configured in a similar manner as GPIO pins, interrupts, and timers
    that I have previously discussed. STM USARTs are initialized using a C struct
    named `UART_HandleTypeDef.` It is configured using a C struct named `UART_InitTypeDef`.
    I will first discuss the `UART_HandleTypeDef`, which contains the following members:


    ![Images](c0170-04.jpg)


    Some of the more important members of this struct are discussed below:


    •   Instance: This is the pointer to the USART descriptor. For example, USART2
    is the descriptor of the UART associated to the ST-LINK interface.


    •   Init: This is an instance of the C struct UART_InitTypeDef, which is used
    to configure the UART interface.


    •   AdvancedInit: Used to configure more advanced UART features like the automatic
    BaudRate detection and TX/RX pin swaps.


    •   pTxBuffPtr: Points to the transmit buffer used as the data source for transmitted
    bytes.


    •   TxXferCount: Holds the count of transmitted bytes.


    •   pRxBuffPtr: Points to the receive buffer where incoming bytes will be stored.


    •   RxXferCount: Holds the count of received bytes.


    •   Lock: This field is used internally by the HAL to lock concurrent accesses
    to UART interfaces.


    The C struct `UART_InitTypeDef` contains the following members:


    ![Images](c0171-02.jpg)


    These struct members represent the following USART parameters and settings:


    Baudrate: This parameter is the connection speed in bits per second. [Table 8-1](#ch8.xhtml_ch8tab1)
    shows a chart of standard and nonstandard baud rates that are available with the
    STM USART peripheral.


    ![images](tab08-01.jpg)


    **Table 8-1**   *Baud Rate Chart*


    •   WordLength: This value specifies the number of data bits transmitted or received
    in a frame. This field can assume one of the following defines:


    •   UART_WORDLENGTH_8B


    •   UART_WORDLENGTH_9B


    •   StopBits: This field specifies the number of stop bits transmitted. This field
    can assume one of the following defines:


    •   UART_STOPBITS_1


    •   UART_STOPBITS_2


    •   Parity: This value indicates the parity mode. This field can assume one of
    the following defines:


    •   UART_PARITY_NONE


    •   UART_PARITY_EVEN


    •   UART_PARITY_ODD


    •   Mode: This value specifies whether the RX and/or TX mode is enabled or disabled.
    This field can assume one of the following defines:


    •   UART_MODE_RX


    •   UART_MODE_TX


    •   UART_MODE_TX_RX


    •   HwFlowCtl :This value specifies whether the RS2326 Hardware Flow Control mode
    is enabled or disabled. This field can assume one of the following defines:


    •   UART_HWCONTROL_NONE


    •   UART_HWCONTROL_RTS


    •   UART_HWCONTROL_CTS


    •   UART_HWCONTROL_RTS_CTS


    OverSampling: This value helps discriminate noise from true signal levels. The
    selected oversampling rate is a tradeoff between noise immunity and maximum possible
    communication speed. This field can assume one of the following defines:


    •   UART_OVERSAMPLING_8


    •   UART_OVERSAMPLING_16


    The above discussion details how a USART can be initialized and configured, but
    I still need to explain how to set up a communication link between the project
    board and a remote node, which will be the PC connected to the board.


    ## Windows Terminal Program


    You will need a terminal program installed in order to display the text messages
    being transmitted from the demonstration board. There are a number of terminal
    programs that are free and readily available to download. I chose a program named
    Realterm that is available from [https://sourceforge.net/projects/realterm/](https://sourceforge.net/projects/realterm/).
    It is full-featured terminal program that I found very easy to configure and run.
    [Figure 8-4](#ch8.xhtml_ch8fig4) shows the Realterm screen after I clicked on
    the Port tab.


    ![images](fig08-04.jpg)


    **Figure 8-4**   *Realterm Port screen.*


    Note that I selected the following parameters to match those configured in the
    STM program:


    •   Baud—9600


    •   Parity— None


    •   Data Bits—8


    •   Stop Bits—1


    •   Hardware Flow Control—None


    •   Port—6


    The last parameter named Port deserves some further explanation. This value refers
    to the virtual com port number that was created when I installed the ST-LINK Virtual
    COM Port USB driver into the host computer. In Windows 10, I had to use the following
    lengthy sequence just to find the port number:


    Control Panel → Hardware and Sound → Devices and Printers → Device Manager → Ports
    (COM & LPT)


    [Figure 8-5](#ch8.xhtml_ch8fig5) shows the screen that appeared when I clicked
    on the Ports (COM & LPT) selection.


    ![images](fig08-05.jpg)


    **Figure 8-5**   *Ports screen.*


    The USART2 peripheral is connected to the ST-LINK circuit, as shown in the [Figure
    8-6](#ch8.xhtml_ch8fig6) schematic.


    ![images](fig08-06.jpg)


    **Figure 8-6**   *USART2 connection to ST-LINK schematic.*


    GPIO pins PA2 and PA3 are connected as USART_TX and USART_RX, respectively. It
    is also possible to use these pins as an external USART by shorting the solder
    bridges SB62 and SB63\. The pins would then be available on both the Arduino and
    Morpho connectors, as discussed in a previous chapter.


    The Realterm program will be all set to display the USART output when the program
    is run. However, there is an additional step that is required for the USART to
    work as desired. This is described in the next section.


    ## Enabling USART2


    Up until this program, I have not had to use the IP tree pane view in the CubeMX
    application to configure a peripheral. That has been done for me by the application
    because I was only using GPIO pins for a program and not any alternative functions.
    However, I will now need to enable the USART2 alternative function in order to
    have the communications link work. You configure USART2 when creating a new project,
    and the Pinout window is shown. [Figure 8-7](#ch8.xhtml_ch8fig7) shows how USART2
    is configured by selecting Asynchronous from the Mode dropdown menu.


    ![images](fig08-07.jpg)


    **Figure 8-7**   *Configuring USART2.*


    The CubeMX application will automatically insert an initialization method `static
    void MX_USART2_UART_Init(void)` in the main.c file when the USART2 function is
    enabled.


    You need to set the appropriate communications parameters in this method as shown
    in the following code snippet:


    ![Images](c0176-01.jpg)


    At this point, all the prerequisites have been introduced that are needed for
    an actual USART demonstration program.


    ### USART Transmit Demonstration Program


    The following program will display a continuously varying value in a terminal
    window. The purpose of this demonstration is to show how the USART can transmit
    data to a terminal program.


    ![Images](c0176-02.jpg)


    ![Images](c0177-01.jpg)


    ![Images](c0178-01.jpg)


    ![Images](c0179-01.jpg)


    ![Images](c0180-01.jpg)


    A small amount of functional code has been placed in the forever loop. The following
    code snippet shows this code with an explanation following the listing.


    ![Images](c0180-02.jpg)'
