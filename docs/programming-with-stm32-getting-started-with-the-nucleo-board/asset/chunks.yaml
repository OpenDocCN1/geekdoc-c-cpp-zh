    模拟电压参考（`AREF`）应连接到 3.3 V，因为这是允许输入 MCU ADC 通道的最大电压。如果你有另一个电压较低的电源（例如 2.5 V），则你可以将
    `AREF` 连接到该电源，并将 ADC 动态范围增加三分之一。请注意，输入大于 2.5 V 的电压不会改变 ADC 输出，这实际上会使其达到饱和。引脚 3
    到 6 可以配置为通用输入/输出（`GPIO`）或作为总线 #2 串行外接口（`SPI`）。如果不需要 GPIO 也不需要 SPI，引脚 2、3 和 4 也可以作为定时器引脚。


    表 1-4 详细列出了 CN9 连接器的引脚定义。请参阅图 1-4 查看 CN9 在板子上的位置。


    ![Images](img/tab01-04.jpg)


    **表 1-4** *CN9 引脚定义*


    这八个引脚通常是普通的 `GPIO`，但它们可以重新配置，使引脚 4、6 和 7 成为定时器引脚。此外，引脚 1 和 2 可以作为 #2 USART。


    ### Morpho 连接器


    表 1-5 取自 Nucleo-64 用户指南，详细列出了 STM Morpho 连接，并引用了 STM32 引脚。在表格之后，我在认为合适的地方对某些引脚功能提供了进一步的说明。我没有重复之前为
    Arduino 连接所提供的注释，因为这些注释对 Morpho 连接同样有效。


    ![Images](img/tab01-05.jpg)


    **表 1-5** *CN7 和 CN10 引脚定义*


    表 1-5 详细列出了 CN7 和 CN10 连接器的引脚定义。请参阅图 1-4 查看 CN7 和 CN10 在板子上的位置。


    `U5V` 是由 ST-LINK/V2-1 USB 接口供的 5-V 电源。`BOOT0` 输入引脚允许更改 MCU 在上电期间的初始启动方式。我将在稍后的章节中讨论启动选项。`VBAT`
    输入通常用作实时时钟或安全密钥的电池备电。如果不用于电池备份，它通常与 `VCC` 连接。


    我接下来将讨论的系列系列 MCU 组件将使 MCU 能够更高效、更快速地执行操作，而不仅仅依赖软件结构。


    ### 嵌套向量中断控制器 (NVIC)


    中断是 MCU 结构中的基本元素。没有中断，由于内存有限且时钟频率较低，MCU 无法高效运行。MCU 中断同时在硬件和软件中实现。但首先我需要定义什么是中断以及如何使用它：


    *中断是由外部或定时事件引发的对程序正常执行流的干扰。*


    图 1-7 是通用中断序列的流程图。此图将有助于理解中断的工作原理。


    ![images](img/fig01-07.jpg)


    **图 1-7** *中断流程图。*


    图 1-7 中的 `ISR` 代表中断服务程序，它是执行因中断而需要完成的任务的程序代码。包含“Call ISR”字样的区块会将 MCU 的当前状态或上下文保存到
    `SRAM` 中。当前状态通常由程序计数器（`PC`）的内容和一组预设的寄存器组成，取决于 MCU 模型。`PC` 是一个寄存器，包含了识别到中断时要执行的下一条指令的地址。实际的
    `ISR` 代码可能位于内存中的任何位置，因为它通过将 `PC` 替换为 `ISR` 的第一个地址来访问。该地址包含在一个列表中，被称为向量中断列表。`ISR`
    中的最后一条指令总是从中断，它会恢复 MCU 中断之前的状态并从存储的 `PC` 地址处继续执行指令。


    该图略有偏离，显示了 `ISR` 部分中一个包含“Enable interrupt system”（启用中断系统）字样的区块。STM `NVIC` 使用优先级中断，这意味着高优先级中断始终可以中断正在执行的低优先级中断。这在纯软件实现的中断方案中通常是不可能的，图中流程图描述了这种方案。


    图 1-8 显示了 `NVIC` 处理多个中断请求（`IRQs`）的两种方式。


    ![images](img/fig01-08.jpg)


    **图 1-8** *NVIC 处理多个 IRQ。*


    我不认为对于大多数非安全相关的项目，`NVIC` 处理中断的方式会有太大区别。然而，如果设计人员正在创建一个安全关键系统，这将会非常重要。我想到的一个案例是汽车控制系统，其中
    STM MCU 管理着各种系统，包括信息娱乐系统和碰撞回避系统。我确实认为，如果 MCU 在处理收电台切换请求的同时接收到较高优先级的 `IRQ`，那么碰撞回避
    `IRQ` 将需要立即关注。


    Nucleo-64 MCU 项目板使用的 `NVIC` 具有以下规格：


    - 十六条中断线

    - 十六个优先级级别

    - 最多 62 个可屏蔽中断

    - 低延迟中断

    - 支持尾链

    - 中断进入

    - 无指令开销


    我将讨论如何在软件中编写 `ISRs`。


    ### 通用输入/输出 (GPIO)


    51 个 `GPIO` 引脚中的每一个均可配置为推挽或开漏输出，并带有或不带上拉或下拉。所有 `GPIO` 均为大电流能力，并具有速度限制以更好地管理噪声、功耗和电磁发射。


    ### 模拟数字转换器 (ADC)


    有一个具有 16 个通道的 12 位 `ADC`。`ADC` 可以在单次或扫描模式下进行。在扫描模式下，会对选取的一组模拟输入进行自动转换。如果转换电压超出设定阈值，则会中断。此外，特定的通道转换由
    `TIM1`、`TIM2`、`TIM3`、`TIM4` 或 `TIM5` 定时器触发。


    ### 外部中断/事件控制器 (EXTI)


    有一个外部中断/事件控制器使用 23 条边缘检测线产生中断/事件请求。每条线都可以独立配置选择触发事件，例如上升沿、下降沿或两者。所有线都可以独立屏蔽。有一个寄存器维护每个中断请求的状态。`EXTI`
    可以检测脉宽小于内部时钟周期的外部线。最多 81 个 `GPIO` 可以连接到 16 条外部中断线。


    ### 定时器和计数器


    许多典型的 MCU 活动涉及时间或定时事件。使用硬件定时器和计数器可以尽量减少分配给其他活动的软件执行周期。这就是为什么 MCU 通常在其结构中包含一组定时器和计数器。定时器和计数器还与中断紧密结合，为处理定时和计数事件提供了极其高效的方法。


    表 1-6 详细列出了单个高级控制定时器以及通用（GP）和基础定时器支持的功能。


    ![Images](img/tab01-06.jpg)


    **表 1-6** *MCU 定时器功能*


    虽然还有两个看门定时器，但在未列表中。我将在下面讨论每种定时器类型。


    ### 高级控制定时器 (TIM1)


    该定时器具有四个独立的通道，可用于后续：


    - 输入捕捉

    - 输出捕捉

    - 脉宽调制 (PWM)

    - 单脉冲输出

