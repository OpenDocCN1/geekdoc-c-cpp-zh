    在本章中，我将深入讨论 STM32CubeMX 应用，这是意法半导体（STM）提供的一项免费工具。为了简化术语，我也将开始将其简称为 `CubeMX`。此外，我想感谢由
    Carmine Noviello 出版的一名为《Mastering STM32》的优秀 Leanpub 电子书。Carmine 的书与 STM 数据手册一起是我无价的参考资料，没有它们，我无法完成这本书。


    `CubeMX` 是一个相当复杂的工具，因为它旨在涵盖 STM 提供的几乎微控制器（MCU）和开发板。考虑到 STM 制造了数百种 MCU 变体和几十种开发板，这是一项了不起的成就。`CubeMX`
    通过自动生成 C 代码来支持这些设备，开发者可以轻松在程序中使用这些代码。生成的代码旨在支持所选 MCU 中的特定集成外设（IP）设备。由于以下功能，`CubeMX`
    可视为以 MCU 为中心的工具：


    - 基于 STM 系列（如 F0、F1……）的 MCU 选择

    - 项目所需的特定 IP，涉及将 MCU 外设映射到特定引脚

    - 处理特定的 MCU 时钟、电源、中断控制等

    - 自动将引脚布局适配封装配置

    - 管理 ST 硬件抽象层（ST HAL）

    - 管理外部库

    - 适配多种 IDE


    图 3-1 显示了应用程序首次启动时的打开界面。


    ![images](img/fig03-01.jpg)


    **图 3-1** CubeMX 启动界面。


    屏幕上有三个选项：


    - 新项目（New Project）

    - 加载项目（Load Project）

    - 帮助（Help）


    我们将稍后深入讨论“新建项目”选项，但首先想简要提到另外两个选项的作用。点击“加载项目”将显示打开文件对话框，如图 3-2 所示。


    ![images](img/fig03-02.jpg)


    **图 3-2** 加载项目截图。


    在此图中只有一个名为 `Hello.ioc` 的项目文件，它位于每次创建新项目时自动创建的项目目录中。项目目录的名称与在新建项目对话框中输入的名称相同。项目文件包含了
    `CubeMX` 重建项目以继续任何开发工作所需的所有内容。


    点击“帮助”将显示 PDF 文档的打开页，如图 3-3 所示。


    ![images](img/fig03-03.jpg)


    **图 3-3** CubeMX 帮助文档打开页。


    此 PDF 版本是一份 261 页的文档，详细介绍了 `CubeMX` 应用中包含的所有特性和功能。我强烈建议你选择并打开此文档，然后将其保存到任何方便的目录。这样，你就可以随时访问帮助文档，而无需打开
    `CubeMX` 程序本身。你还应该考虑打印文档的相关部分，以便在使用程序时有适当的材料参考。


    点击“新建项目”将显示一个带有两个标签页的页面。一个标签是“MCU 选择器”（MCU Selector），另一个是“板载选择器”（Board Selector）。点击“板选择器”将显示如图
    3-4 所示的对话框。


    ![images](img/fig03-04.jpg)


    **图 3-4** 板选择器对话框截图。


    如图所示，我选择了 Nucleo64 作为板类型，并选择 `NUCLEO-F302R8` 作为参考，这与我在书中选用的演示板相匹配。图 3-5 显示了选择此特定板的结果。


    ![images](img/fig03-05.jpg)


    **图 3-5** NUCLEO-F302R8 板选择。


    图中显示了四个标签页，我将在这里逐一讨论。这些标签从左到右的顺序如下：


    - 引脚布局（Pinout）

    - 时钟配置（Clock Configuration）

    - 配置（Configuration）

    - 功耗计算器（Power Consumption Calculator）


    ### 引脚布局标签页


    图 3-5 显示了引脚布局界面，它分为两个部分。右侧显示选定的板 MCU，清晰地了所有预设的外设和 GPIO 引脚。由于显而易见，ST 将其称为芯片视图（Chip
    view）。这些引脚定义将在后续章节和章节中详细探讨。图 3-5 引脚布局的左侧部分以树形视图显示了所有外设引脚以及软件中间件（MiddleWares）。每个树元素旁边是一个符号，反映了外设或软件行项目的单独状态。我将在讨论完芯片视图并探索从该视图中获得的大量信息后讨论这些符号。


    图 3-6 是 `STM32F302R8Tx` MCU 芯片的扩展图，它被用 `NUCLEO-F411RE` 开发板的核心处理器。


    ![images](img/fig03-06.jpg)


    **图 3-6** STM32F302R8Tx MCU。


    ***注意*** 对于纸质书的读者来说，接下来的讨论可能会有些困难，因为图中使用了颜色编码引脚，这些引脚在灰度渲染图像中很难区分。因此，我将尽可能根据这一限制来识别引脚。


    有两个绿色的 GPIO 引脚，分别是 `PC13` 和 `PB13`。如图 3-6 所示，`PC13` 位于左上角，而 `PB13` 位于右下角。`PC13`
    连接到开发板上的蓝色按键，而 `PB13` 连接到绿色 LED。这些连接在图 3-6 中也有说明。


    在板的所有侧都有九个橙色编码引脚。橙色编码引脚表示分配给特定引脚的外设未启用。例如，`PA2` 和 `PA3` 位于图 3-6 的左下角，并分配了 TX 和
    RX 功能。橙色编码意味着 `CubeMX` 应用不会为这些引脚生成 C 代码。


    所有的黄色编码引脚通常位于芯片的角落附近，专门用于电源功能，如 `V[dd]`、`V[ss]`、`V[bat]` 和 `V[ca]`。这些引脚是严格的硬件定义，无法编程或重新配置。


    最后，有两个橄榄色的引脚，`BOOT` 和 `NRST`，`BOOT` 位于顶部，`NRST` 位于左侧。与电源引脚一样，这两个引脚具有专用的 MCU 功能，无法编程或重新配置。


    芯片视图中其余引脚都是灰色编码的 GPIO 引脚，可以根据程序需求进行初始化。如何实现这一点将在下一章中详细讨论。所有引脚都有各种功能或状态输出，可以通过鼠标悬停在特定引脚上来显示。如图
    3-6 所示，引脚 `PC0` 的功能和输出如下：


    - Reset_State

    - ADC1_IN6

    - TIM1_CH1

    - GPIO_Input

    - GPIO_Output

    - GPIO_Analog

    - EVENTOUT

    - GPIO_EXTI0


    现在很难解释这些每一个功能和状态输出。它们在全面的 STM32F302R8 MCU 数据书中都有讨论。然而，GPIO 功能将在下一章中讨论。


    ### MCU 备用功能


    STM MCU 架构允许对各种外设功能进行替代引脚映射。控制键点击任何启用的 GPIO 引脚（例如 `PC13`），将显示与该引脚相关的替代引脚映射，如图
    3-7 所示。

