    虽然这在物理上恢复了 `USART` 链接，但我确定底层的 ST-LINK 通信软件必须修改以使用这个新的 `USART` 端口号。


    ### USART 串行协议


    第一个讨论的协议是标准通用同步/异步收发器 (`USART`)。取决于是否配置为同步模式，此串行协议可能可能不需要时钟信号。MCU 提供两个 `USART`
    终端端口；但只有名为 `USART2` 的一个是激活的，它直接连接到位于 Nucleo-64 PCB 上 ST-LINK 部分另一个 MCU 上的 `USART`
    端口。


    ### I2C 串行协议


    第二个位串行协议是集成电路接口或 `I2C`（读作“eye-two-cee”或“eye-squared-cee”），也称为同步串行数据链路。由于它是同步的，因此需要时钟信号。图
    1-9 是 `I2C` 接口的框图，显示了一个主和一个从设备。这种配置被称为多点或总线网络。


    ![images](img/fig01-09.jpg)


    **图 1-9** *I2C 框图。*

    '
- fmt: '

    - When the I/O value is HIGH, the LED is on

    - When the I/O value is LOW, the LED is off


    `LD3` is a red LED that indicates that the Nucleo-64 board is powered on and `5-V`
    power is available.


    ### Push Buttons


    There are two push buttons on the board:


    - `B1 USER`: The user button is connected to the I/O `PC13` (`CN7/23`) of the
    MCU. This pin is pulled high through a `47K` resistor. When `B1` is pressed the
    pin is grounded.

    - `B2 RESET`: This push button is connected to `NRST`, and is used to `RESET`
    the MCU.


    > **NOTE**: The blue and black plastic hats that are placed on the push buttons
    can be removed if necessary, for example, when a shield or when an extension board
    is plugged on top of the Nucleo-64 board. This will avoid pressure on the buttons
    and consequently a possible target `RESET`.


    ### JP6


    Jumper `JP6` is labeled `IDD` and is used to measure the MCU current by removing
    the jumper and connecting an ammeter in `series` with the two pin leads.


    - `Jumper ON`: MCU is powered (default).

    - `Jumper OFF`: an ammeter must be connected to measure the MCU current. The MCU
    cannot receive any power if there is no ammeter connected.


    ### OSC Clock


    There are four options on how to connect an high-speed external clock (`HSE`)
    on the Nucleo-64 board.


    ### Master Clock Output from the ST-LINK (Default)


    The master clock output (`MCO`) is generated by an `8-MHz` crystal located on
    the ST-LINK PCB and input into the main MCU via the `PF0/PD0/PH0-OSC_IN` pins.
    This crystal frequency is fixed. Incidentally, the `72-MHz` clock rate I mentioned
    earlier in this chapter is generated by using a phase-locked loop (`PLL`) embedded
    in the MCU using the `8-MHz` input clock signal.


    ### HSE Oscillator On-board with the Optional X3 Crystal


    An `8-MHz` crystal must be installed in empty `X3` PCB pads. In addition, there
    are some solder bridges to be changed, and some resistors and capacitors to be
    added. The details are specified in the user’s guide.


    ### External Oscillator Through Pin 29 of the CN7 Connector


    There are some solder bridges to be changed, and some resistors to be removed.
    The details are specified in the user’s guide.


    ### HSE Not Used


    `PF0/PD0/PH0` and `PF1/PD1/PH1` are used as `GPIOs` instead of as a clock source.
    There are some solder bridges to be changed, and some resistors to be removed.
    The details are specified in the user’s guide. I am unsure how the MCU functions
    without an `HSE`, but it is an option according to the user’s guide.


    ### OSC 32-kHz Clock Supply


    There are three ways to configure the pins corresponding to low-speed external
    clock (`LSE`).


    ### LSE On-board Oscillator


    You can change the `X2` crystal provided that it conforms to the oscillator design
    guide for `STM32 MCU`. The default crystal already installed is a model `ABS25-32.768KHZ-6-T`
    manufactured by Abracon Corporation.


    ### External Oscillator Through Pin 25 of the CN7 Connector


    There are some solder bridges to be changed, and some resistors to be removed.
    The details are specified in the user’s guide.


    ### LSE Not Used


    `PC14` and `PC15` are used as `GPIOs` instead of the `LSE` source. There are some
    solder bridges to be changed, and some resistors to be removed. The details are
    specified in the user’s guide. I am fairly sure that the real-time clock and watchdog
    timers will become inoperative with the `LSE` disabled.


    ### Power Supply and Power Selection


    I have already discussed on where an external power supply may be attached in
    the Arduino connector. However, there are still some more power supply features
    and options you should know about.


    ### Power Supply Input from the USB Connector


    The whole Nucleo-64 board including any attached extension board can be powered
    by the `5-V` power supplied through the `CN1` USB connector provided the host
    USB device complies with the USB standard of providing `500 mA`. The ST-LINK requires
    `100 mA` and the main MCU requires `300 mA`, which leaves `100 mA` for any extension
    board or external devices such as LEDs or LCD displays. You must use an external
    supply if the total current is planned to exceed a nominal `500-mA` load. The
    red LED `LD3` will not light if there is insufficient current present to power
    the MCU.


    When the board is power supplied by USB (`U5V`), a jumper must be connected between
    pins `1` and `2` of `JP5`.


    Jumper `JP1` is configured according to the maximum current consumption of the
    board when powered by the USB (`U5V`) connection. `JP1` jumper can be set in case
    the board is powered by USB and maximum current consumption on `U5V` does not
    exceed `100 mA` (including an eventual extension board or Arduino shield). In
    such condition, the USB enumeration will always succeed since no more than `100mA`
    is required from the host. Possible configurations of `JP1` are summarized in
    [Table 1-9](#ch1.xhtml_ch1tab9).


    ![Images](tab01-09.jpg)


    **Table 1-9** *JP1 Configuration Table*


    > **NOTE**: If the Nucleo-64 board is powered by an USB charger, there will be
    no USB enumeration from the ST-LINK causing the `LD2` LED to remain off. In this
    case, `JP1` needs to remain in place so that the MCU can be powered on.


    ### VIN and E5V External Power Supply Inputs


    The details and limitations of external power sources `VIN` and `E5V` are summarized
    in [Table 1-10](#ch1.xhtml_ch1tab10).


    ![Images](tab01-10.jpg)


    **Table 1-10** *VIN and E5V External Supply Input Limitations*


    When the board is power supplied by `VIN` or `E5V`, these jumper configurations
    must be set as follows:


    - Jumper on `JP5` pins `2` and `3`

    - Jumper removed on `JP1`


    ### 3.3-V external Power Supply Input


    It is possible to power the MCU with an external `3.3-V` power supply. The power
    connection would be made at `CN6`, pin `4` or `CN7`, pins `12` and `16`. In this
    situation the `3.3-V` supply is coming from an extension board. The ST-LINK will
    not be powered on with this configuration, thus making programming and debugging
    unavailable. The `3.3-V` external supply configuration is summarized by [Table
    1-11](#ch1.xhtml_ch1tab11).


    ![Images](tab01-11.jpg)


    **Table 1-11** *3.3V External Supply Configuration*


    ### Power Supply Output


    When powered by USB, `VIN`, or `E5V`, the `5-V` supply (`CN6`, pin `5` or `CN7`,
    pin `18`) may be used as output power supply for Arduino shield or extension board.
    In this case, the maximum current of the power source specified in [Table 1-10](#ch1.xhtml_ch1tab10)
    must be respected. The `3.3 V` (`CN6`, pin `4` or `CN7`, pins `12` and `16`) can
    be used also as power supply output. The current is limited by the maximum current
    capability of `U4` (`500 mA`).


    [Table 1-12](#ch1.xhtml_ch1tab12) details the position of the `JP5` jumper with
    regard to using an external supply.


    ![Images](tab01-12.jpg)


    **Table 1-12** *JP5 Jumper Positions*


    ### Using VIN or E5V as an External Power Supply


    `VIN` or `E5V` can be used as an external power supply in case the current consumption
    of Nucleo-64 and the extension board exceeds the maximum current provided by the
    USB connection. It is still possible to use the USB for programming and debugging
    only, but it is mandatory to power-on the Nucleo-64 board first using `VIN` or
    `E5V` and then connect the USB cable to the host PC. Following this sequence ensures
    that the USB enumeration will occur when connected to an external power source.


    The following power-on sequence procedure should be used:


    1. Connect the jumper between pins `2` and `3` of `JP5`

    2. Check that jumper `JP1` is removed

    3. Connect the external power source to `VIN` or `E5V`

    4. Turn-on the external power supply `VIN` or `E5V`

    5. Check that `LD3` is turned on

    6. Connect the host PC to USB connector, `CN1`


    If this order is followed, the board may be supplied by `VBUS` first and then
    by `VIN` or `E5V`. The following risks may be encountered:


    - The host PC USB power supply can be damaged if more than `300 mA` is drawn by
    the Nuclueo-64 board and host cannot supply it.

    '
