    I observed that the LED turned on for as long as the push button was depressed.
    Note that you will have to use a small screwdriver to press the button as it is
    hidden under the Arduino protoboard.


    The next demonstration concerns a basic property involved with all MCU signal
    operations, including the GPIO pins.


    ### Clock Speed Demonstration


    Clock speed as related to MCU signal operations is a misnomer. You would ordinarily
    consider it to be a measure of the maximum number of signal transitions per second.
    However, it is really a measure of the clock skew or amount of time it takes to
    transition a signal from 10% to 90% of the maximum value. It also applies in the
    opposite direction or going from 90% to 10% of the maximum value. The former is
    known as leading edge delay and the latter is called trailing edge delay.


    Clock skew is directly related to true clock speed because the leading and trailing
    edge delays ultimately determine the maximum possible number of signal transitions
    per second. I will still refer to clock skew as clock speed because that is how
    STM choose to label this important signal property.


    The important question that one should ask is why should clock speed even be considered.
    The answer lies in extending both MCU and battery life. The physics behind improving
    clock speed dictates that it takes energy or power, in this case, to overcome
    the circuit capacitance effects that mainly determine clock speed. Small amounts
    of additional power are required to improve the circuit switching times. This
    implies an increase in current flow from the battery over time and consequently
    a shortened battery life. In addition, increased power dissipation will induce
    small amounts of additional heat stress in the MCU and also shorten its life.
    The aforementioned are the main reasons why clock speed should always be selected
    to be the lowest level but still support required functionality.


    This demonstration will illustrate the actual clock speed timings that are associated
    with the maximum and minimum clock speed settings. There are four speed settings
    available with the HAL framework, which are as follows:


    * Low

    * Medium

    * Fast

    * Very Fast


    I will be using both the Low and Very Fast settings and applying them to signal
    outputs from pins `PC0` and `PC1`, respectively. No additional MCU hardware is
    required. However, you will need a fast multi-channel oscilloscope to replicate
    this demonstration. The oscilloscope should also have a minimum bandwidth rating
    of at least 100 MHz. I used a `Picoscope USB oscilloscope`, model `3406B`, to
    capture the measurements. This test device functions with a PC to measure and
    display up to four independent channels.


    ### Setting the Pin Clock Speeds


    The `PC0` and `PC1` pin clock speeds are set by creating two more `GPIO_InitStruct`
    C data structures and placing them in the `MX_GPIO_Init(void)` method. In addition,
    there will be a small amount of code required in the `main()` method.


    The two new `GPIO_InitStruct` C data structures are:


    ![Images](c0125-01.jpg)


    ![Images](c0126-01.jpg)


    The new C structs set up the pins as identical GPIO outputs with the exception
    that one is low speed and the other is very fast speed. The code segment in `main()`
    simply toggles the pin outputs between high and low at the fastest possible rate
    because there is no intervening code.


    ### Test Results


    [Figure 5-13](#ch5.xhtml_ch5fig13) is a screenshot showing an instantaneous capture
    of the GPIO pin signal waveforms.


    ![images](fig05-13.jpg)


    **Figure 5-13** PC0 and PC1 pins’ signal waveforms.


    It is easy to see that the signal waveforms are not crisp digital signals with
    sharp transitions but instead are slightly distorted with definite rising and
    falling edge slopes. The distortions are likely due to high oscilloscope probe
    capacitive loading and the slight inductance due to the jumper leads I connected
    between the oscilloscope probes and the Arduino protoboard sockets. I also used
    10× high impedance probe settings to help reduce the loading on the GPIO pins.
    I know this helped because I repeated the measurements using the direct X1 probe
    settings, which further distorted the settings. The vertical voltage amplitude
    scale must be multiplied by 10 to account for the 10× probe settings.


    If you carefully examine the figure you should see two automatic measurements
    that were computed by the oscilloscope on the displayed waveforms. I have repeated
    these measurements below for easy viewing:


    Pulse period: 94.1 ns


    Frequency: 10.62 MHz


    I also closely examined waveforms in [Figure 5-13] to estimate parameters that
    I used to calculate the equivalent bandwidth necessary reflecting the measured
    waveforms leading edges. I also used a rule of thumb for estimating the equivalent
    bandwidth using the leading edge rise time. These calculations follow:


    ![Images](c0127-01.jpg)

