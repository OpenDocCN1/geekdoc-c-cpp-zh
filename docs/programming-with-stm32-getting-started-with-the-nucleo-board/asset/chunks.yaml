    ## 10 Pulse Width Modulation (PWM)


    This chapter concerns pulse width modulation (`PWM`), which is a digital signal
    easily generated by a `MCU` for a variety of purposes. These purposes commonly
    include controlling the following:


    - Controlling the following:

    - Motor speed

    - LED brightness

    - Servo position

    - Speaker volume

    - Signal frequency


    The `HAL` framework supports the `PWM` functionality through various timers and
    structures.


    ### General-Purpose Timer PWM Signal Generation


    PWM signals are generated by using an advanced or a general purpose (`GP`) timer.
    This section describes how this is done.


    The signal generation is relatively simple and involves using a timer in an upcounting
    mode. The top portion of [Figure 10-2](#ch10.xhtml_ch10fig2) shows a timer counting
    up from 0 to a maximum 16-bit count equal to 65535. Each GP timer has a series
    of registers known as capture registers (`CCRx`), which store a number. When the
    upcounting reaches that number, an event is generated that depends on the timer
    mode. If the timer is set for a direct output as is the case for `PWM` mode, then
    the event will be to turn on the channel associated with the `CCRx` register.
    In [Figure 10-2](#ch10.xhtml_ch10fig2), channel 1 is switched high when the count
    reaches 52428. The channel remains high until the timer counter reaches the maximum
    count (`MAX`) and overflows or resets as shown in the top waveform. The net result
    of this action is that a repetitive pulse is emitted from the channel 1 line with
    a 20% duty cycle. The following equation relates the timer count with the duty
    cycle (`DC`):


    ```

    DC = (CCRx / MAX) * 100

    ```


    The first thing to note is that the signal is repetitive with a frequency 50 Hz
    or an equivalent period. The second important feature is the duty cycle, which
    is a percentage of the time the signal is in high state. Duty cycle is often considered
    the primary property for `PWM`. The following equation may be rearranged to find
    the `CCRx` value given a desired duty cycle:


    ```

    CCRx = (DC * MAX) / 100

    ```


    In [Figure 10-2](#ch10.xhtml_ch10fig2), I have also shown an additional channel
    output with a desired 60% duty cycle but no specific count shown for the `CCRx`
    register. I will use the second form of the equation to solve for `T[2]`, which
    is the count value to be stored in register `CCR2`:


    ```

    T[2] = (60 * MAX) / 100

    ```

