    -   由于 `JP1` 处于关闭位置，可能会从主机 PC 的 USB 连接抽取高达 300 mA 的电流。如果主机无法提供这么多电流，USB 枚举将失败且
    `MCU` 将不会启动。


    本节结束了 `STM32 Nucleo-64` 开发板的介绍章节。


    # 总结


    本章是关于法意半导体（STM）Nucleo-64 微控制器（`MCU`）开发板的介绍。该板采用 `STM32F302R8` `MCU` 型，运行频率为 72-MHz，拥有
    64-KB 闪存和 16-KB SRAM 内存。


    我首先回顾了微机与 `MCU` 之间的区别。接着回顾了构成 `MCU` 的主要组件。讨论的第一个组件是 `ARM Cortex M-4` 32 位微机。下一个是内存，我在其中简要解释了
    `Cortex M-4 霍佛曼架构`是如何加速处理周期的。最后一部分组件是对 `MCU 外设` 的详细讨论。


    我通过一系列详细的表格和额外的注释，仔细解释了如何在板上设置 `Arduino` 和 `ST Morpho` 连接器。接下来是关于中断控制器、定时器/计数器和位串接口的一些外设讨论。


    本章最后详细讨论了许多可用的开发板选项，你可以根据自己的需求对 `Nucleo-64` 开发板进行定制。


    # 2 章节 STM32 MCU 软件


    本章探讨了 `MCU` 开发的软件方面。如果不对如何使用硬件进行深入讨论，那么 `第 1 章` 中对 `MCU` 硬件的讨论将在很大程度上变得毫无意义，而这正是软件的角色。对于与
    `STM MCUs` 相关的软件状况提供一些前瞻性的视角会有帮助。


    ## 开源与商业专有软件


    你首先需要意识到，`STM` 是一家价值数十亿美元的营利性公司，必须通过盈利来维持运营并满足利益相关者的需求。尽管 `STM` 支持开发者社区和开源开发，但培养了商业软件套件，作为为其
    `MCUs` 及其他产品线开发软件的主要手段。这意味着由每位个人创作者和/或开源开发者来决定是构建自己的开源软件工具链还是使用专有解决方案。我讨论了这两种方法，你很快就会看到我的决定以及为什么做那个决定。


    可用的 `STM MCU` 商业工具链可以非常费力地使用，但它们非常贵，所有许可证的价格都超过了 1,000 美元。某些软件供应商如 `Keil` 和 `IAR`
    确实提供了免费的评估版本，供那些在购买前想要尝试套件的开发者使用。这些版本的唯一限制是它们将上传的 `MCU 程序` 大限制在 32 KB。虽然这个限制看起来很小，但实际上，它对于开发者社区开发的几乎所有项目来说绰绰有余。我在书中项目的代码开发中使用了
    `Keil` 评估版 `IDE`。我发现使用这个特定的 `IDE` 开发代码变得非常容易，而且在尝试使用纯开源工具进行开发时出现的问题很少。我想非常明确的是，我并不是建议你避免开源方法，只是说明我尝试过这两种方法，并确定使用专有
    `IDE` 要简单得多，而且几乎总是一次成功。


    ## 裸金属开发


    “裸金属开发（bare metal development）”一词是开发者词汇中相当新加入的术语。它通常是指任何与特定硬件组相关的低级编程方法。它源于“在裸金属上编程”这一短语。这种开发自
    20 世纪 70 年代 `MCUs` 出现以来一直存在，当时它是唯一的类型。那时并不被称为“裸金属开发”，而被称为嵌入式开发或简单的 `MCU 编程`。结合一些历史来理解
    `MCU` 软件开发的现状会有帮助。


    # MCU 简史


    德州仪器（TI）的 `TMS1000` 通常被称为“第一个微控制器”。它于 1971 年发布，具有读写内存（`RAM`）、只读存储器（`ROM`）、嵌入式
    8 位处理器和板载时钟系统。在此芯片之前，其他处理器依赖外部内存和时钟外设来实现这些功能。`TMS1000` 用于早期的 `TI` 计算器以及一些游戏机。同时，英特尔设计并生产了
    `Intel 8048`，它同样具有板载 `RAM` 和 `ROM`，以及 8 位处理器、时钟电路以及一些用于直接外设接口的 `GPIO` 引脚。这个芯片被证明非常受欢迎，特别是在计算机键盘制造商中。数以百万计的
    `8048` 用于键盘，它很快成为英特尔的巨大收入来源。


    `TMS1000` 和 `Intel 8048` 可能使用 `C` 语言配合交叉编译器进行编程，交叉编译器是一种运行在主机 `PC` 上的应用程序，产生适用于嵌入式
    `MCU 处理器` 的原始二进制代码。早期的 `MCUs` 使用掩膜 `ROM` 来存储程序。这意味着程序首先经过开发、测试，然后转换为用于 `MCU` 晶圆生产过程的掩膜。在当时没有在现场重新配置程序的能力。正如你预期的那样，制造掩膜
    `MCU` 的成本非常高，开发者必须第一次就做对，否则将面临更改程序的高昂重新工具成本风险。


    在 20 世纪 80 年代，`MCUs` 开始带有 `EPROMs`，存储程序在 `MCU` 暴露于紫外（`UV`）光后可以更改。`图 2-1` 显示了 `Intel
    8751`，它是极其受欢迎的 `8051` `MCU` 的 `UV` 可重编程版本。


    ![images](img/fig02-01.jpg)


    **图 2-1**  **Intel 8751 MCU。**


    如果你仔细观察图片，你可能会看到曾经贴在窗口上的贴纸轮廓。这种覆盖物对于防止环境阳光无意中擦除 `EPROM` 至关重要。`UV EPROM` 最终让位于
    `EEPROM`，这是一种电学擦除 `ROM`。`Intel 8052` 是一个使用 `EEPROM` 的 `MCU` 版本。这个芯片在嵌入式开发社区取得了巨大的成功，数百万、甚至数十亿个被应用于各种系统、设备和其他嵌入式应用中。事实上，英特尔
    `8052` 及其变体仍在生产。曾经，`805x` 系列是世界上最广泛使用的 `MCU` 产品。然而，现在我相信手机 `MCU` 已经超过了 `805x`
    成为最广泛使用的 `MCU`。


    我包含了 `表 2-1`，它比较了 `8052` 和 `STM32F302R8 MCUs` 之间的相似特征。该表清楚地展示了该领域技术的巨大进步。


    ![images](img/tab02-01.jpg)


    **表 2-1**  *8052 与 STM32F302R8 MCU 的比较*


    ### MCU 工具链


