- "# STM32 编程：Nucleo 开发板与 C/C++ 入门指南\n\n## 关于作者\n\n![图片](img/f000V-01.jpg)\n\n**Donald\
  \ J. Norris** 拥有电气工程学位和专攻生产管理的 MBA 学位。他目前是新汉普郡州大学（SNHU）工程、技术与航空学院的兼职教授，教授嵌入系统课程。在过去的\
  \ 33 年里，他主要在 SNHU 和其他地区学校教授了计算机科学和技术领域的许多本科和研究生课程。Don 在 SNHU 创建并教授了最初的线下和在线机器人课程。\n\
  \nDon 从美国海军民政府服务部门退休，他专攻与核潜艇相关的水下声学以及相关的数字信号处理系统。从那时起，他花了 23 多年担任专业软件开发人员，在各种开发项目中使用\
  \ `C`、`C#`、`C++`、`Python`、`Micro Python`、`Node.JS`、`JavaScript` 和 `Java` 语言。在过去的六年里，他一直担任认证的\
  \ IT 安全顾问。\n\n他编写并出版了七本书，其中三本涉及树莓派（Raspberry Pi），一本关于如何制造和飞行无人机，一本关于 Intel Edison\
  \ 的书，一本关于物联网以及一本关于 Micro Python 的书。\n\nDon 创立了一家咨询公司 Norris Embedded Software Solutions（注册名为\
  \ NESS LLC），专门从事使用微控制器、传感器和执行器开发应用程序解决方案。该业务最近还为客户完成了几个机器人项目。\n\nDon 喜欢认为自己是一个永久的爱好者和极客，并不断尝试新技术和跳出框架的实验。他是有执照的私人飞行员、摄影爱好者和业余无线电操作员。\n\
  \n\n\n\n\n\n图 2-6 显示了 `STM32CubeMX` 实用程序在下载和安装后的启动闪屏。我建议在运行安装程序时接受所有默认建议。\n\n\n\n\
  \n\n![images](img/fig02-06.jpg)\n\n**图 2-6** STMCubeMX 启动界面。\n\n我点击了“新项目”（New Project）按钮，以便向你展示此工具是如何工作的。接下来将出现一个选择页面，窗口右上角有两个标签页。这些标签标记如下：\n\
  \n• MCU 选择器 (MCU Selector)\n• 板载选择器 (Board Selector)\n\n我接着选择了 `MCU Selector` 标签页，并在大量的微控制器列表中向下滚动，直到遇到\
  \ `STM32F302R8` MCU，这就是本书中使用的 Nucleo 板上安装的类型。图 2-7 显示了选中此特定 MCU 的屏幕。\n\n![images](img/fig02-07.jpg)\n\
  \n**图 2-7** 使用 STMCubeMX 工具选择特定的 MCU。\n\n你应该注意到，窗口顶部区域出现了一个关于 MCU 组件和特征的简要摘要。这些信息通常用于确认\
  \ MCU 是否支持你打算实现的任何功能。\n\n另一个标记为 `Board Selector`（板载选择器）的标签对于支持 Nucleo 板演示项目最为有用。我点击了该标签并向下滚动，以选择书中使用的精确\
  \ Nucleo 板，即 `Nucleo64 NUCLEO-F302R8` 板。图 2-8 显示了进行此选择的结果。\n\n![images](img/fig02-08.jpg)\n\
  \n**图 2-8** 选择 NUCLEO-F302R8 板。\n\n窗口左侧出现了一个适用于所选板卡的外设选择面板。你应该注意到，某些外设在 във设名称旁边的\
  \ `Nb` 列中会出现一个空框，这表示该特定外设未包含在所选板卡上。在 `Nb` 列旁边还有一个 `Max` 列，它显示了该特定 Nucleo 板上可用的某种特定类型的外设数量。另一个方便的功能是，可以通过点击窗口右下角的“加载用户手册”（Load\
  \ User Manual）来快速下载所选 Nucleo 板的用户指南。\n\n图 2-9 显示了用于 Nucleo 板上单元的非常有用且方便的 MCU 引脚图。它显示了所有已连接到各种外设的引脚，包括用户\
  \ LED（我将在下一章中演示它）。\n\n![images](img/fig02-09.jpg)\n\n**图 2-9** STM32F302RE MCU 引脚图。\n\
  \n### ST-LINK\n\n`ST-LINK` 软件是工具链的下一个部分，必须安装它才能开始开发 Nucleo 板。它是一个极其重要的工具链组件，因为内核支持板卡与主机计算机之间的\
  \ USB 物理链路，并且是软件上传到板卡的唯一手段。\n\n必须首先下载 `USB ST-LINK` 驱动程序并安装到主机计算机中，以建立主机与 Nucleo\
  \ 板之间的通信链路。该驱动程序可以从同一个 [st.com](http://st.com) 网站下载，你从那里下载了 STM32CubeMX 实用程序。ST\
  \ 网站上的软件编号为 `STSW-LINK009`，技术描述为“ST-LINK/V2 和 ST-LINK/V2-1 的 USB 驱动”。此特定下载是一个经过签名的驱动程序，适用于\
  \ Windows 7、Windows 8 和 Windows 10 的 32 位和 64 位主机。下载的驱动程序是一个名为 `en-stsw-link009`\
  \ 的压缩格式文件，运行前必须解压。进入新创建的目录 `en-stsw-link009` 并点击名为 `stlink_winusb_install` 的 Windows\
  \ 处理文件来安装 USB 驱动程序。你会短暂看到一个显示正在安装的命令行窗口。不会创建驱动程序图标，因此判断驱动安装是否成功完成的唯一方法是运行 ST-LINK\
  \ 工具。下文将讨论 ST-LINK 工具的安装。\n\n实际的 `ST-LINK/V2` 工具必须从 [st.com](http://st.com) 网站单独下载。它的部分编号为\
  \ `STSW-LINK004`，大小约为 22 MB。可下载的压缩包名为 `en.stsw-link004`，在安装之前也必须解压。确保压缩包已下载到 STM32Toolchain\
  \ 目录。接下来，进入新创建的目录 `en.stsw-link004` 并点击 `STM32-ST-LINK Utility V4.0.0.setup` 应用程序，这将安装并配置\
  \ ST-LINK/V2 工具。\n\n在你点击主机桌面显示的 ST-LINK/V2 图标后，你应该看到工具的启动界面，如图 2-10 所示。\n\n![images](img/fig02-10.jpg)\n\
  \n**图 2-10** ST-LINK/V2 启动界面。\n\n你需要做的第一件事之一是检查正在使用的 Nucleo 板上安装了哪个版本的 ST-LINK 固件。要做到这一点，首先确保\
  \ ST-LINK 工具未运行，然后使用插入 Nucleo 板的 mini-A 连接 USB 线将 Nucleo 板连接到主机计算机。图 2-11 显示了选中此特定\
  \ MCU 的屏幕。\n\n![images](img/fig02-11.jpg)\n\n**图 2-11** USB 线。\n\n在连接 Nucleo 板后，按照以下步骤确定固件版本：\n\
  \n1. 点击桌面打开 ST-LINK 工具。\n2. 点击水平菜单上的 `ST-LINK`。\n3. 点击子菜单中的“固件升级”（Upgrade）。\n4.\
  \ 点击“设备连接”（Device Connect）。\n\n图 2-12 显示了点击 Device Connect 按钮的结果。\n\n![images](img/fig02-12.jpg)\n\
  \n**图 2-12** ST-LINK 固件版本。\n\n显然，如果报告的版本比升级显示的版本新，请不要升级固件。这种奇怪的情况可能是因为升级版本被硬编码在\
  \ ST-LINK/V2 存档中，而其更新频率不如新制造的板。公司通常解决此问题的方法是在其升级软件中使用动态下载，以便始终可以使用最新的固件版本。显然，STM\
  \ 没有采用这种方法，这就是这种情况发生的原因。希望它在不久后改变升级技术。无论如何，固件检查本身确认了主机与 Nucleo 板之间的 USB 通信正常。\n\n\
  工具链配置的下一步是设置名为 OpenOCD 的调试工具。并不是真的需要安装调试器，但当你尝试调试运行不正常的程序时，它可能会很有帮助。\n\n### OpenOCD15\n\
  \nOpen On-Chip Debugger (`OpenOCD15`) 工具旨在向 STM32 Nucleo 板上传新固件，并支持大量的软件调试模式。该工具最初由\
  \ Dominic Rath 创建，但现在由包括 STM 公司在内的 STM 社区维护。兼容 Windows 版本由 Liviu Ionescu 创建，可以在\
  \ [`github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124`](https://github.com/gnu-mcu-eclipse/openocd/releases/tag/gae-0.10.0-20170124)\
  \ 获取。\n\n\n\n\n\n我选择了名为 `gnuarmeclipse-openocd-win64-0.10.0-201701241841-setup.exe`\
  \ 的版本，这是适用于 64 位 Windows 系统的。该可执行文件的大小为 2.19 MB。将此文件下载到 `STM32Toolchain` 目录，以便任何需要它的工具链应用程序都能直接使用。该文件是一个自包含的可执行文件，只需运行即可在宿主机上安装\
  \ OpenOCD。图 2-14 显示了软件安装的启动界面。\n\n![images](img/fig02-14.jpg)\n\n**图 2-14** *OpenOCD\
  \ 15 启动界面。*\n\n我建议在安装过程中接受所有的默认选项，在我的特定情况下，这只花费了一分钟左右。图 2-15 显示了 OpenOCD 设置软件完成安装过程后的完成界面。\n\
  \n![images](img/fig02-15.jpg)\n\n**图 2-15** *OpenOCD 完成界面。*\n\n运行 OpenOCD 工具与普通应用程序有所不同，因为它被设计成一种服务或后台程序。在\
  \ Unix 和 Linux 术语中，这种程序类型被称为守护进程（daemon）。访问该程序有两种方法：\n\n1. 使用端口 `4444` 的 `telnet`\
  \ 工具：当创建 `telnet` 连接时，OpenOCD 像服务器一样工作。在接收到命令时它会做出相应响应。这是一个严格的命令行环境。\n2. 将 `telnet`\
  \ 工具作为 GNU 项目调试器 (GDB) 的远程服务器：OpenOCD 实现了 GDB 远程协议，可以作为 GDB 和目标平台之间的中间器组件使用。GDB\
  \ 使用 IDE 的 GUI 环境。\n\n我选择使用 telnet 方法，因为它简单直接，并且能够满足大多数调试需求。GDB 更加复杂，并且通常与 Eclipse\
  \ IDE 耦合，而本工具链中并没有使用该 IDE。\n\n### 建立 Telnet 连接\n\n在使用 telnet 之前，你必须完成的第一件事是在 Windows\
  \ 10 上启用它。遗憾的是，它默认未启用，必须由用户手动完成。操作步骤相对简单，详细如下所示：\n\n1. 在搜索文本框中输入“控制面板”\n2. 点击“程序”\n\
  3. 点击“程序和功能”\n4. 点击左栏中的“启用或关闭 Windows 功能”\n5.向下滚动并勾选“Telnet 客户端”旁边的复框\n6. 点击“确定”按钮\n\
  \n启用 telnet 也有等效的命令行操作方法，但我发现 GUI 方法同样有效。\n\n接下来，你需要确定支持你项目所用特定开发板的相应 telnet 脚本。目前所有支持\
  \ Nucleo 板板的脚本详见 表 2-2。\n\n![images](img/tab02-02.jpg)\n\n**表 2-2** *Telnet 脚本*\n\
  \n我使用了名为 `st_nucleo_f3.cfg` 的配置文件，因为它与我的 `NUCLEO-F302R8` 开发板相关联。\n\n此过程的下部分是打开终端窗口。最简单、最快的方法是在搜索文本框中输入\
  \ `cmd`。在窗口中输入以下两条命令行：\n\n```\n![Images](img/c0047-01.jpg)\n```\n\n切记使用与你的 Nucleo\
  \ 开发板相应的配置文件。\n\n随后，OpenOCD 服务将在终端窗口中响应，显示如 图 2-16 所示。\n\n![images](img/fig02-16.jpg)\n\
  \n**图 2-16** *启动 OpenOCD 服务。*\n\n注意，OpenOCD 的响应序列中显示了一个错误信息，但我发现它并无关大碍，不会影响程序运行。然而，如果你在错误之后没有看到响应，意味着存在真实问题，因为在\
  \ OpenOCD 程序和目标板之间没有建立通信链路。这个问题通常是由 Windows 尝试使用不正确的 `libusb` 版本导致的。请按照 Zadig 工具的步骤修复此问题。\n\
  \n1. 根据你的 Windows 版本从 `http://zadig.akeo.ie/` (http://zadig.akeo.ie/) 下载 Zadig 工具。\n\
  2. 将 Nucleo 开发板连接到电脑。\n3. 运行 Zadig 工具并选择 `Options → List All Devices`（选项 → 列出所有设备）。\n\
  4. 短暂后，Nucleo 开发板将出现在设备列表组合框中。\n5. 如果尚未列出，请选择 `WinUSB` 驱动。\n6. 点击如 图 2-17 所示的 `Reinstall\
  \ Driver`（重新安装驱动）按钮。\n\n![images](img/fig02-17.jpg)\n\n**图 2-17** *重新安装驱动程序。*\n\n\
  \n\n\n在本章中，我将深入讨论 STM32CubeMX 应用，这是意法半导体（STM）提供的一项免费工具。为了简化术语，我也将开始将其简称为 `CubeMX`。此外，我想感谢由\
  \ Carmine Noviello 出版的一名为《Mastering STM32》的优秀 Leanpub 电子书。Carmine 的书与 STM 数据手册一起是我无价的参考资料，没有它们，我无法完成这本书。\n\
  \n`CubeMX` 是一个相当复杂的工具，因为它旨在涵盖 STM 提供的几乎微控制器（MCU）和开发板。考虑到 STM 制造了数百种 MCU 变体和几十种开发板，这是一项了不起的成就。`CubeMX`\
  \ 通过自动生成 C 代码来支持这些设备，开发者可以轻松在程序中使用这些代码。生成的代码旨在支持所选 MCU 中的特定集成外设（IP）设备。由于以下功能，`CubeMX`\
  \ 可视为以 MCU 为中心的工具：\n\n- 基于 STM 系列（如 F0、F1……）的 MCU 选择\n- 项目所需的特定 IP，涉及将 MCU 外设映射到特定引脚\n\
  - 处理特定的 MCU 时钟、电源、中断控制等\n- 自动将引脚布局适配封装配置\n- 管理 ST 硬件抽象层（ST HAL）\n- 管理外部库\n- 适配多种\
  \ IDE\n\n图 3-1 显示了应用程序首次启动时的打开界面。\n\n![images](img/fig03-01.jpg)\n\n**图 3-1** CubeMX\
  \ 启动界面。\n\n屏幕上有三个选项：\n\n- 新项目（New Project）\n- 加载项目（Load Project）\n- 帮助（Help）\n\n\
  我们将稍后深入讨论“新建项目”选项，但首先想简要提到另外两个选项的作用。点击“加载项目”将显示打开文件对话框，如图 3-2 所示。\n\n![images](img/fig03-02.jpg)\n\
  \n**图 3-2** 加载项目截图。\n\n在此图中只有一个名为 `Hello.ioc` 的项目文件，它位于每次创建新项目时自动创建的项目目录中。项目目录的名称与在新建项目对话框中输入的名称相同。项目文件包含了\
  \ `CubeMX` 重建项目以继续任何开发工作所需的所有内容。\n\n点击“帮助”将显示 PDF 文档的打开页，如图 3-3 所示。\n\n![images](img/fig03-03.jpg)\n\
  \n**图 3-3** CubeMX 帮助文档打开页。\n\n此 PDF 版本是一份 261 页的文档，详细介绍了 `CubeMX` 应用中包含的所有特性和功能。我强烈建议你选择并打开此文档，然后将其保存到任何方便的目录。这样，你就可以随时访问帮助文档，而无需打开\
  \ `CubeMX` 程序本身。你还应该考虑打印文档的相关部分，以便在使用程序时有适当的材料参考。\n\n点击“新建项目”将显示一个带有两个标签页的页面。一个标签是“MCU\
  \ 选择器”（MCU Selector），另一个是“板载选择器”（Board Selector）。点击“板选择器”将显示如图 3-4 所示的对话框。\n\n![images](img/fig03-04.jpg)\n\
  \n**图 3-4** 板选择器对话框截图。\n\n如图所示，我选择了 Nucleo64 作为板类型，并选择 `NUCLEO-F302R8` 作为参考，这与我在书中选用的演示板相匹配。图\
  \ 3-5 显示了选择此特定板的结果。\n\n![images](img/fig03-05.jpg)\n\n**图 3-5** NUCLEO-F302R8 板选择。\n\
  \n图中显示了四个标签页，我将在这里逐一讨论。这些标签从左到右的顺序如下：\n\n- 引脚布局（Pinout）\n- 时钟配置（Clock Configuration）\n\
  - 配置（Configuration）\n- 功耗计算器（Power Consumption Calculator）\n\n### 引脚布局标签页\n\n图 3-5\
  \ 显示了引脚布局界面，它分为两个部分。右侧显示选定的板 MCU，清晰地了所有预设的外设和 GPIO 引脚。由于显而易见，ST 将其称为芯片视图（Chip view）。这些引脚定义将在后续章节和章节中详细探讨。图\
  \ 3-5 引脚布局的左侧部分以树形视图显示了所有外设引脚以及软件中间件（MiddleWares）。每个树元素旁边是一个符号，反映了外设或软件行项目的单独状态。我将在讨论完芯片视图并探索从该视图中获得的大量信息后讨论这些符号。\n\
  \n图 3-6 是 `STM32F302R8Tx` MCU 芯片的扩展图，它被用 `NUCLEO-F411RE` 开发板的核心处理器。\n\n![images](img/fig03-06.jpg)\n\
  \n**图 3-6** STM32F302R8Tx MCU。\n\n***注意*** 对于纸质书的读者来说，接下来的讨论可能会有些困难，因为图中使用了颜色编码引脚，这些引脚在灰度渲染图像中很难区分。因此，我将尽可能根据这一限制来识别引脚。\n\
  \n有两个绿色的 GPIO 引脚，分别是 `PC13` 和 `PB13`。如图 3-6 所示，`PC13` 位于左上角，而 `PB13` 位于右下角。`PC13`\
  \ 连接到开发板上的蓝色按键，而 `PB13` 连接到绿色 LED。这些连接在图 3-6 中也有说明。\n\n在板的所有侧都有九个橙色编码引脚。橙色编码引脚表示分配给特定引脚的外设未启用。例如，`PA2`\
  \ 和 `PA3` 位于图 3-6 的左下角，并分配了 TX 和 RX 功能。橙色编码意味着 `CubeMX` 应用不会为这些引脚生成 C 代码。\n\n所有的黄色编码引脚通常位于芯片的角落附近，专门用于电源功能，如\
  \ `V[dd]`、`V[ss]`、`V[bat]` 和 `V[ca]`。这些引脚是严格的硬件定义，无法编程或重新配置。\n\n最后，有两个橄榄色的引脚，`BOOT`\
  \ 和 `NRST`，`BOOT` 位于顶部，`NRST` 位于左侧。与电源引脚一样，这两个引脚具有专用的 MCU 功能，无法编程或重新配置。\n\n芯片视图中其余引脚都是灰色编码的\
  \ GPIO 引脚，可以根据程序需求进行初始化。如何实现这一点将在下一章中详细讨论。所有引脚都有各种功能或状态输出，可以通过鼠标悬停在特定引脚上来显示。如图 3-6\
  \ 所示，引脚 `PC0` 的功能和输出如下：\n\n- Reset_State\n- ADC1_IN6\n- TIM1_CH1\n- GPIO_Input\n\
  - GPIO_Output\n- GPIO_Analog\n- EVENTOUT\n- GPIO_EXTI0\n\n现在很难解释这些每一个功能和状态输出。它们在全面的\
  \ STM32F302R8 MCU 数据书中都有讨论。然而，GPIO 功能将在下一章中讨论。\n\n### MCU 备用功能\n\nSTM MCU 架构允许对各种外设功能进行替代引脚映射。控制键点击任何启用的\
  \ GPIO 引脚（例如 `PC13`），将显示与该引脚相关的替代引脚映射，如图 3-7 所示。\n\n\n\n\n![images](img/fig03-07.jpg)\n\
  \n**图 3-7** *PC13 复用引脚映射。*\n\n在选定引脚上右键点击，所有可备用引脚都会立即标记为蓝色。在图 3-7 中，备用引脚为`PA13`和`PB13`，但前提是备用引脚未处于复位状态。如果向主引脚布线不方便，使用复用映射可以优化电路板布局。当\
  \ `CubeMX` 检测到引脚布局冲突时，它会尝试通过将外设功能分配给备用引脚来自动解决冲突。然而，通过在选定的 MCU 引脚上放置逻辑“推钉”，可以将所需的外设功能锁定在某个引脚上。这些“推钉”在图中清晰可见。锁定这些引脚会防止\
  \ `CubeMX` 启用已锁定引脚的备用映射。被锁定无法映射的引脚也被标记为橙色。\n\n## 集成外设 (IP) 树形面板\n\n图 3-6 左侧显示的 IP\
  \ 树形面板允许 `CubeMX` 用户能够方便地启用或禁用可能分配给 MCU 引脚的外设。树形面板还允许用户启用某些软件中间件库。树列表使用各种颜色的图标和文本来指示外设的状态和配置。图\
  \ 3-8 显示了与每个外设相关的这些彩色图标及其文本含义。此图摘自 `CubeMX` 用户手册，我敦促感兴趣的读者下载并保存。这本 261 页的 PDF 手册中包含了丰富的信息，我没有足够的空间对其进行详细介绍。\n\
  \n![images](img/fig03-08.jpg)\n\n**图 3-8** *树形面板 IP 图标及文本描述。*\n\n### 时钟配置选项卡\n\n\
  STM32 系列 MCU 使用了一种非常灵活的方法来配置 MCU 运行所需的各种时源。这些时源同时适用于 MCU 核心功能和大多数外设功能。时源及相关的锁相环（`PLL`）在图\
  \ 3-9 中以图形形式显示，当你点击时钟配置选项卡时，它将会显示。\n\n![images](img/fig03-09.jpg)\n\n**图 3-9** *时钟配置\
  \ GUI。*\n\n图 3-9 乍看起来可能有些望人生畏，但不要绝望，因为它实际上并不复杂，尤其是是在你交互几次之后。与普通的 8 位 MCU 相比，STM32\
  \ 的时钟源能力非常强大且灵活。\n\n首先必须考虑的是基础时源。STM32 MCU 系列使用了高速时钟（`HSE`）和低速时钟（`LSE`）。这些时钟可以从内部或外部进行供电。在本书的所有项目中，这些时钟将使用内部源；然而，如果根据需要，其中一个或两者都可以使用外部源。如果需要使用外部时钟，必须首先启用相应的时钟输入引脚。这是通过返回引脚视图（Pinout\
  \ view）中的 IP 树并展开 `RCC` 部分完成的。图 3-10 显示了这些引脚的典型配置。\n\n![images](img/fig03-10.jpg)\n\
  \n**图 3-10** *RCC 引脚配置。*\n\n一旦启时钟输入引脚，必须返回时钟配置选项卡并完成时源配置。\n\n不需要更改任何时钟配置，因为它们在默认状态下已完美支持书中的所有项目。但我想提醒可能考虑对\
  \ MCU 进行超频的读者。超频是一种常见的黑手段，用户有时会尝试借此从计算机系统中“获得”一些感知上的性能提升。超频在游戏系统中尤为常见，因为人们认为高时钟频率可以提高显示帧率和游戏性能。虽然对于某些游戏系统确实如此，但由于芯片散热量大幅增加导致的过度压力会显著缩短处理器的寿命。游戏系统还采用了复杂的冷却子系统，而这在\
  \ STM Nucleo 板系列中是不存在的。结论是：**不要**超频，因为那绝对会导致 MCU 过热并导致其过早失效。\n\n### 配置视图选项卡\n\n\
  配置视图（Configuration View）提供了所有软件可配置组件的概述，包括 GPIO、外设和中间件。如图 3-11 所示，那里有可点击的按钮，允许对各种组件进行配置。`CubeMX`\
  \ 应用程序会自动创建支持所需配置的底层 C/C++ 代码。\n\n![images](img/fig03-11.jpg)\n\n**图 3-11** *配置视图。*\n\
  \n图 3-11 中有带有颜色的图标和文本，其方式与 IP 树面板视图显示的内容非常相似。图 3-12 详细说明了这些图标和文本应用于配置视图时的含义。\n\n\
  ![images](img/fig03-12.jpg)\n\n**图 3-12** *配置视图图标及文本描述。*\n\n### 功耗计算器视图选项卡\n\n点击剩余的选项卡将显示未初始化的功耗计算器界面，如图\
  \ 3-13 所示。\n\n![images](img/fig03-13.jpg)\n\n**图 3-13** *功耗计算器 (PCC)。*\n\n此 PCC\
  \ 允许你计算以下内容：\n\n- 平均电流消耗\n- 预期电池寿命\n- 平均 DMIPS（每秒 Dhrystone 指令）：本质上使用标准软件测试衡量 MCU\
  \ 效率\n- 最高环境温度（TAMAX）：根据 MCU 封装类型、内部功耗和预设的 105°C 结温计算\n\n`CubeMX` 用户手册详细说明了一系列操作步骤，引导你进行逐步分析，以确保所选电池适用于你的应用程序。我不会使用\
  \ PCC，因为书中所有的项目都使用电源。\n\n### 使用 CubeMX 创建示例项目\n\n现在是讨论如何使用 `CubeMX` 应用程序创建新项目了。首先启动应用程序，然后点击新项目（New\
  \ Project）。将显示如图 3-14](#ch3.xhtml_ch3fig14)所示的新项目界面。\n\n![images](img/fig03-14.jpg)\n\
  \n**图 3-14** *新项目启动界面。*\n\n点击板卡（Board）选择选项卡，显示板卡选择界面。像我在图 3-4 中一样选择你的项目板。双击板卡选择将弹出\
  \ STM32F-302R8Tx MCU 的引脚布局视图，如图 3-5 所示。\n\n现在你需要点击菜单栏上的项目（Project）标题为你的新项目命名。从下拉菜单中选择设置（Setting），如图\
  \ 3-15 所示。\n\n![images](img/fig03-15.jpg)\n\n**图 3-15** *项目下拉菜单。*\n\n\n\n\n\n你必须首先在“Project\
  \ Name”（项目名称）文本框中输入名称。我使用了 `STM32Nucleo_F302` 作为项目名称，但你可以选择任何喜欢的名称。你应该确保“Project\
  \ Location”（项目位置）文本框显示你希望存储项目文件夹的位置。你可以使用“Browse”（浏览）按钮找到合适的目录。对于本次演示，我使用了与之前书籍项目相同的路径。下一个标题为\
  \ `Toolchain Folder Location`（工具链文件夹位置）的文本框应该是使用项目位置和项目名称组合命名的目录。请记住此位置，因为你稍后需要访问\
  \ CubeMX 自动创建并存储在其中的文件。\n\n接下来，确保你已选择 `MDK-V4` 作为要使用的工具链/IDE，如图 3-16 所示。此选择非常重要，因为如果不勾选此项，CubeMX\
  \ 将无法生成正确的 `C`/`C++` 代码。此外，确保勾选了 `Generate Under Root`（在根目录下生成）复选框，这将允许生成的代码位于正确的目录。\n\
  \n默认的链接器设置（Settings）是可以的。检查 `MCU Reference`（MCU 参考）文本框是否与你使用的 MCU 匹配。如果不匹配，生成的代码无法在物理\
  \ MCU 上运行。\n\n最后，`Firmware Pack Name`（固件包名称）、`Version`（版本）文本框以及 `Use Default Firm\
  \ Location`（使用默认固件位置）文本框保持默认即可。\n\n为了准备生成代码，返回点击 `Project`（项目）菜单栏并点击 `Project Settings`（项目设置）子菜单。接下来，点击\
  \ `Code Generator`（代码生成器）选项卡，将出现如图 3-17\n\n**图 3-17** *代码生成器界面*\n\n确保所有的单选按钮和复选框都已选中，如图\
  \ 3-17 所示，返回 `Project` 子菜单，但这次点击 `Generate Code`（生成代码）选项。CubeMX 需要几秒钟来生成代码，屏幕上会出现进度条。当代码生成完成后，你应该会看到信息对话框，如图\
  \ 3-18 所示。\n\n![images](img/fig03-18.jpg)\n\n**图 3-18** *成功生成代码的对话框*\n\n点击 `Open\
  \ Project`（打开项目）按钮后，你将看到 Keil IDE 主窗口，其中 `STM32Nucleo_F302` 项目目录和文件列表将出现在 IDE 的\
  \ Project（项目）窗格中。此视图如图 3-19 所示。\n\n![images](img/fig03-19.jpg)\n\n**图 3-19** *Keil\
  \ IDE 中的 STM32Nucleo_F302 项目*\n\nProject 窗格中显示四个子目录：`STM32Nucleo_F302`、`Application/MDK-ARM`、`Drivers/CMSIS`\
  \ 和 `Application/User`，如图 3-20 所示。你可以展开这些目录以查看其中包含的文件。\n\n![images](img/fig03-20.jpg)\n\
  \n**图 3-20** *项目、子目录和文件列表*\n\n你的列表将根据你使用的 MCU 而变得类似。你还会看到一个提示你未找到设备的弹出对话框，如图 3-21\
  \ 所示。\n\n![images](img/fig03-21.jpg)\n\n**图 3-21** *未找到设备的对话框*\n\n通过点击 `File` →\
  \ `Device Database` 可以解决此问题，如图 3-22 所示。\n\n![images](img/fig03-22.jpg)\n\n**图 3-22**\
  \ *设备数据库选择*\n\n接下来，选择 `STMicroelectronics` 作为制造商，向下滚动其大量的 MCU 列表，直到找到你的特定型号。在我的情况下，我没有找到\
  \ `STM32F02R8`，但找到了 `STM32F02RB`，它看起来运行良好。未来可能会出现某些问题，但到目前我还没有遇到过。图 3-23 显示了 `STM32F02RB`\
  \ 选择的结果。\n\n![images](img/fig03-23.jpg)\n\n**图 3-23** *STM32F02RB 选择*\n\n只需点击 `Close`\
  \ 按钮，因为没有 `Submit` 或 `Select` 按钮。\n\n## main.c 代码列表\n\n以下代码是 `main.c`，它是根据我输入的参数和设置自动生成的。`main`\
  \ 方法正如我提到的，包含了程序所需的大部分功能代码。在这个模板中，它是故意留空的，因为没有所需的功能。CubeMX 自动生成的注释将帮助你将自己的代码放置在正确的位置。\n\
  \n在 `main` 中还有一系列方法调用，用于初始化和配置 MCU 的内部外设和 GPIO 引脚。它们按照调用顺序列出：\n\n```c\nwhile (1)\
  \ {\n    // 功能性代码在此处\n}\n```\n\n`while (1)` 语句会导致其范围内的所有内容无限重复。这是一个必要的软件结构，因为大多数嵌入式系统不使用操作系统（OS），任何运行的程序只会运行一次然后就会崩溃。功能性代码（例如闪烁\
  \ LED）应该放置在此 while 循环中。\n\n\n\n\n\n- `CMSIS-Driver`: 外设驱动程序软件，用于将所有适用设备与支持的中间件软件进行接口。该\
  \ CMSIS 部分包含文件系统、通信栈和用户界面等项。\n- `CMSIS-DSP`: 广泛的优化库，支持包括固定点和浮点数据类型在内的不同数据。该库适用于\
  \ `Cortex M0`、`M3`、`M4` 和 `M7` 核心处理器。\n- `CMSIS-RTOS`: 实现实时操作系统（RTOS）的标准化 API。该\
  \ API 提供了一个支持多种特定 `Cortex` RTOS 实现的框架。\n- `CMSIS-DAP`: 调试访问端口（DAP）是一组标准的固件例程，实现了针对\
  \ `Cortex` 处理器优化的调试功能。它连接到 `CoreSight Debug Access Port` 以快速访问实时数据。\n- `CMSIS-SVD`:\
  \ 这是一个名为系统视图描述（SVD）的可扩展标记语言（XML）文件，它包含了外设描述，适用于编程语言头文件（include）文件以及调试器和中断控制器。\n\
  - `CMSIS-Pack`: 一个包含各种设备逻辑描述和参数的 XML 文件集合。使用名为 `PDSC` 的主文件从 XML 文件集合中提取所需数据。\n\n\
  需要注意的是，下一章讨论的 STM 硬件抽象层（`HAL`）仅包含与 STM MCU 相关的特定内容，在某种程度上不符合 ARM Cortex 微控制器软件接口标准（`CMSIS`）。对于制造基于\
  \ ARM 的 MCU 的厂商来说，使用 `CMSIS` 完全是自愿的，而 STM 显然认为使用 `HAL` 是其处理所生产的各种 MCU 及相关开发板的最佳方法。我相信\
  \ STM 试图保持与 `CMSIS` 的兼容性，但仍然需要支持其庞大的产品。\n\n## CubeMX 生成的 C 代码\n\n现在是回到讨论 CMSIS 框架引入的自动生成代码了。图\
  \ 3-24 是新生成目录的一个有趣组合，展示了它们如何与各种 CMSIS 组件相关联。\n\n![images](img/fig03-24.jpg)\n\n\
  **图 3-24** 与 CMSIS 结构相关的生成代码。\n\n`Application/User` 目录本质上包含骨架文件，提供了一个框架，用户可以在其中填充特定代码以实现所需的应用程序。这些目录中的文件仅适用于\
  \ `Application` 块，如图 3-24 所示。\n\n`Drivers/CMSIS` 结构包含命名如 `core_cm3`、`core_cm4` 等的头文件，这些文件包含了真实\
  \ MCU 外设及所有相关控制/数据寄存器所需的特定逻辑定义。还有核心 MCU 定义以及中断控制器定义和辅助函数。\n\n`Drivers/STM32F3xx_Hal_Driver`\
  \ 目录包含了 MCU 操作所需的其他目录文件中未提供的全部剩余数据和参数。这些数据涵盖了中断号、外设设备地址、重启向量和额外的辅助函数等项。\n\n`Application/MDK-ARM`\
  \ 包含初始化目标 MCU 所的 ARM 特定启动代码。\n\n## 编译并下载项目\n\n此时，已经有足够的初始化和配置代码来构建一个适用于在目标上运行的可下载文件。遗憾的是，这是一个空项目，意味着\
  \ MCU 没有完成任何有意义的任务。然而，确定当前代码是否可以编译并下载到目标机仍然是一项有用的练习。\n\n图 3-25 显示了 Keil IDE 编译图标的位置。点击此图标将启动自动构建过程，将项目中的源代码转换为二进制文件。\n\
  \n![images](img/fig03-25.jpg)\n\n**图 3-25** Keil IDE 编译图标。\n\n图 3-26 显示了构建过程中发生的所有中间结果。在构建过程中可能发生错误的情况下，此日志会非常有用。\n\
  \n![images](img/fig03-26.jpg)\n\n**图 3-26** 构建过程日志。\n\n你可能已经注意到最终编译并链接的二进制文件是 `axf`\
  \ 格式。这种格式不兼容 `ST-LINK`，因为 `ST-LINK` 期望下载文件为 `hex` 格式。通过点击 `Flash` 菜单选择然后点击 `Configure\
  \ Flash Tools` 可以轻松解决这个问题。在 flash 工具选择打开后，点击 `Output` 选项卡。然后勾选 `Create HEX File`\
  \ 旁边的复选框。图 3-27 显示了此选择。\n\n![images](img/fig03-27.jpg)\n\n**图 3-27** 选择 hex 文件输出。\n\
  \n一旦选择了 `hex` 文件，必须重新构建项目。这只需再次点击编译图标即可完成。IDE 足够智能，能够源代码不需要重新编译，只需再次链接即可形成 `hex`\
  \ 文件。生成的 `hex` 文件清晰地显示在图 3-28 中。\n\n![images](img/fig03-28.jpg)\n\n**图 3-28** Hex\
  \ 文件输出。\n\n一旦创建了 `hex` 文件，就可以对目标机进行程序设计了。使用 `ST-LINK` 应用将 hex 文件下载到目标机。\n\n## 下载\
  \ Hex 代码\n\n你首先需要打开 ST-LINK 应用并打开要下载的 hex 文件。该文件作为构建过程的一部分自动放在项目的 `MDK-ARM` 子目录下。你将需要使用\
  \ `File` 菜单浏览到目录。图 3-29 显示了如何选择示例 hex 文件。\n\n![images](img/fig03-29.jpg)\n\n**图\
  \ 3-29** 打开要下载的 hex 文件。\n\n然后必须使用 USB 线将目标机连接到运行 ST-LINK 应用的主机，如前所述。你接下来需要点击 `Target`\
  \ 菜单选择，然后点击 `Connect` 选择。图 3-30 显示了应用程序连接到目标后的 ST-LINK 窗口。\n\n![images](img/fig03-30.jpg)\n\
  \n**图 3-30** ST-LINK 连接到目标\n\n剩下的就是下载到 ST-LINK 应用中的 hex 文件。点击 `Target` 菜单选择，然后点击\
  \ `Program and Verify` 选择。图 3-31 显示了 Program and Verify 对话框。\n\n![images](img/fig03-31.jpg)\n\
  \n**图 3-31** Program and Verify 对话框\n\n点击 `Start` 按钮将 hex 文件下载到目标板。Nucleo 板上的红绿\
  \ LED 开始交替闪烁，指示下载操作正在进行。虽然下载非常快，但 LED 将继续闪烁。我猜 STM 的工程师只是想让用户知道板子已经下载了程序。图 3-32\
  \ 显示了成功下载的结果。\n\n![images](img/fig03-32.jpg)\n\n**图 3-32** 成功的 hex 文件下载\n\n目标板应该按照其程序运行。在这种情况下，什么都不会发生，因为没有编写任何功能。在程序中添加功能的操作将在下一章中研究。然而，我想确保下载是正确的，因此之前为目标机编写了闪烁用户\
  \ LED。一旦新的 hex 文件下载完成，LED 停止了闪烁，这间接证明了无功能的程序已正确下载。\n\n\n\n\n本章从介绍 `STM32CubeMX`\
  \ 应用开始，在本书的剩余部分，我将其简称为 `CubeMX`。该应用程序包含四个主要部分或标签页，我对它们进行了详细讨论。`CubeMX` 的作用是初始化和配置\
  \ `STM MCUs` 或相关的开发板，包括自动生成 C 代码以支持所需的配置。自动生成的 C 代码并不适用于任何嵌入式应用程序，那部分仍然是开发者的责任。\n\
  \n我创建了一个通用的 `CubeMX` 项目，它的作用除了为自动生成的 C 代码提供平台外没有别的，该代码支持特定 `Nucleo` 开发板的外设、时钟、通信通道和中断。我还展示了\
  \ `main.c` 文件中的代码，并简要讨论了其内容及其操作。\n\n接下来，我讨论了 `ARM CMSIS`，大多数 ARM 供应商都试图遵循该标准。我还展示了自动生成的\
  \ C 代码是如何与 `CMSIS` 框架相关的。\n\n我向你们演示了如何构建一个无法运行的项目，以证明工具链按预期工作。`CubeMX` 应用创建了所有的\
  \ C 代码，因为该项目不需要开发者负责的代码。使用 `ST-LINK` 应用程序将 hex 文件下载到目标平台。\n\n本章详细描述的过程将在书中剩余的所有项目中重复，并将添加专门的代码来执行所有所需的功能。\n\
  \n# 4. STM 项目开发\n\n在本章中，我将演示如何使用第 2 章中创建的工具链和第 3 章中描述的 `CubeMX` 应用使用 `STM Nucleo`\
  \ 板构建 C/C++ 语言项目。我将使用 C/C++ 语言来创建这些项目的源代码。如果读者对 C/C++ 语言比较熟悉，将有助于更好地理解整个过程，但并非强制要求。我将深入讲解“Hello\
  \ World”项目的示例代码，帮助那些不太精通 C 语言的读者理解源代码中发生了什么。\n\n## Hello World 项目\n\n传统的惯例“Hello\
  \ World”程序是初学者在开始学习计算机语言时几乎总是编写的程序。在嵌入式世界，这个程序已经演变为闪烁 LED，而不是在显示器屏幕上显示“Hello World!”。我将逐步演示如何使用连接到运行第\
  \ 2 章所建立的工具链的 Windows 10 主系统的 `Nucleo64-STMF302R8` 演示板创建一个“Hello World”项目。除非你阅读了之前的章节并创建了可用的工具链，并且熟悉使用\
  \ `CubeMX` 应用，否则你从本章中获益有限。\n\n## 创建 Hello Nucleo 项目\n\n创建项目的第一步是打开 `CubeMX` 应用。应用程序启动后，点击\
  \ `New Project` 并点击 `Board` 标签。选择你使用的 `Nucleo` 板。在我的情况下，它是 `NUCLEO-F302R8` 板，如图\
  \ 4-1\n\n**图 4-1** 新的 C/C++ 项目对话框。\n\n接下来，双击开发板选择行将显示如图 4-2\n\n**图 4-2** 项目引脚分配屏幕。\n\
  \n下一步是点击 `Project`菜单项，这将弹出如图 4-3\n\n**图 4-3** 项目下拉菜单。\n\n点击 `Generate Code` 选项将出现如图\
  \ 4-4\n\n**图 4-4** 项目设置对话框。\n\n你需要在 `Project Name` 框中提供一个名称。它应该与预期的项目目的相关。同时，确认\
  \ `Project Location` 以及 `Toolchain Folder Location`正确。\n\n从 `Toolchain/IDE` 组合列表中选择\
  \ `MDK-ARM V4` 非常重要。如果不选择 `MDK-ARM V4`，将无法创建项目。\n\n默认的 `Linker Settings` 应该没问题，`Mcu\
  \ and Firmware Package` 以及 `Firmware Package Name and Version` 也应该与图中所示。\n\n最后，确保\
  \ `Use Default Firmware Location` 旁边的复选框已选，否则 IDE 将无法创建二进制文件。\n\n**不要**点击 `Ok` 按钮，而是点击对话框顶部的\
  \ `Code Generator` 标签。这应该显示如图 4-5 所示的 `Project Settings/Code Generator` 对话框。\n\n\
  ![images](img/fig04-05.jpg)\n\n**图 4-5** 项目设置/代码生成对话框。\n\n`Copy all used libraries\
  \ into the project folder` 旁的单选按钮最初会被选中。你应该点击 `Copy only the necessary library files`\
  \ 旁的单选按钮，以减小整个项目的大小。忽略此更改不会影响最终二进制文件的大小，但会不必要地增大项目文件夹。现在你可以点击 `Ok` 按钮让 CubeMX 自动生成代码。\n\
