  \n当向模拟舵机发送重复的 1.5 ms 脉冲信号时，它应离开中性位。从正前方看，1.0 ms 的脉冲序列将导致其主轴逆时针旋转 60°。同样，2.0 ms 的脉冲序列将导致其顺时针旋转\
  \ 60°。然而，由于公差的影响，旋转角度通常会有正负 10° 到 15° 的偏差。\n\n在所有情况下，脉冲序列频率都设置为额定的 50 Hz 或周期 20\
