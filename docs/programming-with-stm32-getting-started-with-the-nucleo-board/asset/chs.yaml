  ![Images](img/c0210-01.jpg)\n![Images](img/c0211-01.jpg)\n\n### 测试运行\n\n随后编译程序并下载到项目板中。然后我启动了\
  \ `Realterm` 终端程序来显示来自板的通信流。图 9-10 显示了终端输出。\n\n![images](img/fig09-10.jpg)\n\n**图\
  \ 9-10** 终端输出。\n\n我尝试冷却和加热传感器，看到传感器根据环境温度做出反应。\n\n### 总结\n\n数数转换 (`ADC`) 是本章的主题。解释了\
  \ 16 通道、12 位 `ADC` 在 `MCU` 内部的工作原理。它使用逐次逼近技术来获取连续变化的模拟输入的精确数值采样。\n\n接下来的讨论转向 `HAL`\
  \ 框架如何支持 `ADC` 功能。我介绍了两个同时用于配置和初始化 `ADC` 外设的 `C` 结构体。讨论还包括各种转换模式、通道、组和秩。\n\n一个全比例的\
  \ `ADC` 演示结束了本章。使用一个 `TMP36` 温度传感器作为模拟电压源连接到 `ADC`。程序使用 `USART2` 外设将连续的温度读取值流到终端窗口。\n\
  \n# 10 脉冲宽度调制 (PWM)\n\n本章涉及脉冲宽度调制 (`PWM`)，这是一种由 `MCU` 易于生成的用于多种目的数字信号。这些目的通常包括控制以下内容：\n\
  \n- 控制以下内容：\n- 电机速度\n- LED 亮度\n- 舵机位置\n- 扬声器音量\n- 信号频率\n\n`HAL` 框架通过各种定时器支持 `PWM`\
  \ 功能。\n\n### 通用定时器 PWM 信号生成\n\nPWM 信号是通过高级或通用 (`GP`) 定器生成的。本节描述了如何实现。\n\n信号生成相对简单，涉及使用向上计数模式的定时器。图\
  \ 10-2 的顶部部分显示定时器从 0 计数到 16 位最大计数 65535。每个通用定时器有一组称为捕获寄存器 (`CCRx`)，用于存储数值。当向上计数达到该数值时，会产生一个取决于定时器的事件。如果定时器设置为直接输出（如\
  \ `PWM` 模式所示），则事件将开启与 `CCRx` 关联的通道。图 10-2 中，计数达到 52428 时通道 1 置高。直到定时器达到最大计数 (`MAX`)\
  \ 并溢出或重置（如顶部波形所示）。此操作的最终是从通道 1 发出一个占空比为 20% 的重复脉冲。以下方程建立了定时器计数与占空比 (`DC`)的关系：\n\n\
  ```\nDC = (CCRx / MAX) * 100\n```\n\n首先注意的是信号是重复的，频率为 50 Hz 或等效周期。另一个重要特征是占空比，它是信号处于高电平时间的百分比。占空比通常被认为是\
  \ `PWM` 的主要属性。以下方程可以重新排列，以便在给定占空比的情况下找到 `CCRx` 值：\n\n```\nCCRx = (DC * MAX) / 100\n\
  ```\n\n\n\n\n因此，在 `CCR2` 中存储值 26214 将导致 `TIM2` 通道 2 输出产生一个 60% 占空比的脉冲序列。请注意，我在此计算中使用的数字是相对的，因为实际存储的\
  \ `CCRx` 数值取决于真实的定时器时钟频率。你会发现这些数值要小得多，但计算它们的原理是相同的。\n\n我用于 PWM 生成的 `TIM2` GP 定器最多有四个输出通道，这意味着可以使用单个\
  \ GP 定器同时生成四个同步 PWM 信号。以下演示之一使用了三个通道，足以演示这一能力。\n\n### 定时器硬件架构\n\n图 10-3 是 GP 定器器框图的一部分，突出了多通道输出和相关的\
  \ `CCRx` 寄存器。\n\n![images](img/fig10-03.jpg)\n\n**图 10-3** *带有四个输出通道的 GP 定器器框图。*\n\
  \n该架构非常直观，显示每个 `CCRx` 寄存器都有来自通用定时器计数器（`CNT`）寄存器的输入，以及其自身的预分频时钟输入。这种安排能够实现非常灵活的 PWM\
  \ 脉冲序列输出。\n\n现在是描述 HAL 软件如何实现 PWM 信号生成。\n\n### 使用 HAL 的 PWM 信号\n\nHAL 框架使用名为 `TIM_MasterConfigTypeDef`\
  \ 的 C 结构体来配置生成 PWM 信号的定时器外设。每个成员将在结构体定义后单独讨论。\n\n![Images](img/c0216-02.jpg)\n\n\
  `TIM_MasterConfigTypeDef` 结构体成员在列表中简单如下：\n\n`uint32_t MasterOutputTrigger;`—此值指定了触发输出（`TRGO`）的行为。此参数可以是以下定义宏的任意值：\n\
  \n`uint32_t MasterSlaveMode;`—这用于启用/禁用定时器的主/从模式。此参数可以是以下定义宏的两个值之一：\n\n![Images](img/c0216-06.jpg)\n\
  \n使用 `TIM_MasterConfigTypeDef` 结构体配置的 PWM 定器必须进一步使用 `TIM_OC_InitTypeDef` C 结构体进行初始化，其定义如下：\n\
  \n![Images](img/c0218-02.jpg)\n\n`TIM_OC_InitTypeDef` 结构体成员在列表中简单如下：\n\n`uint32_t\
  \ OCMode;`—指定输出比较模式。此参数可以是以下定义宏的任意值：\n\n`TIM_OCMODE_TIMING`—输出比较寄存器（`CCRx`）与定时器计数器（`CNT`）之间的比较对输出没有影响，这被称为冻结模式。\n\
  \n`TIM_OCMODE_ACTIVE`—在 `CCRx` 匹配时将通道输出设置为有效电电平。\n\n`TIM_OCMODE_INACTIVE`—在 `CCRx`\
  \ 匹配时将通道输出设置为非有效电电平。\n\n`TIM_OCMODE_TOGGLE`—当定时器计数器（`CNT`）匹配 `CCRx` 时，翻转通道输出。\n\n\
  ![Images](img/c0218-03.jpg)\n\n`TIM_OCMODE_FORCED_ACTIVE`—独立于定时器计数器（`CNT`）的值，强制通道输出高电平。\n\
  \n`TIM_OCMODE_FORCED_INACTIVE`—独立于定时器计数器（`CNT`）的值，强制通道输出低电平。\n\n**注意** PWM 模式 1：当定时器向上计数时，只要\
  \ `Period` 小于 `Pulse`，通道将保持有效，否则为非有效。在递减模式下，只要 `Period` 大于 `Pulse`，通道将保持非有效，否则为有效。\n\
  \nPWM 模式 2：当定时器向上计数时，只要 `Period` 小于 `Pulse`，通道将处于非有效状态，否则为有效。在递减模式下，只要 `Period`\
  \ 大于 `Pulse`，通道将保持有效，否则为非有效。\n\n`uint32_t Pulse;`—此值将存储在 `CCRx` 寄存器中，它确定了何时触发输出。\n\
  \n`uint32_t OCPolarity;`—定义当 `CCRx` 寄存器匹配 `CNT` 时的输出通道极性。此参数可以是以下定义宏的两个值之一：\n\n\
  ![Images](img/c0219-03.jpg)\n\n`uint32_t OCNPolarity;`—定义互补输出极性。这种模式仅适用于 `TIM1`\
  \ 和 `TIM8` 高级定时器，它们允许两个额外的专用通道来生成互补信号，即当通道 1 为高电平时，通道 1N 为低电平，反之亦然。此功能对于电机控制应用特别有用。此参数可以是以下定义宏的两个值之一：\n\
  \n![Images](img/c0219-05.jpg)\n\n`uint32_t OCFastMode;`—指定快速模式状态。此参数仅在 `PWM1` 和\
  \ `PWM2` 模式下有效。此参数可以是以下定义宏的两个值之一：\n\n![Images](img/c0219-07.jpg)\n\n`uint32_t OCIdleState;`—指定定时器空闲期间通道输出比较引脚的状态。此参数可以是以下定义宏的两个值之一：\n\
  \n![Images](img/c0219-09.jpg)\n\n**注意** 此参数适用于 `TIM1` 和 `TIM8` 高级定时器。\n\n`uint32_t\
  \ OCNIdleState;`—指定定时器空闲期间互补通道输出比较引脚的状态。此参数可以是以下定义宏的两个值之一：\n\n![Images](img/c0220-02.jpg)\n\
  \n**注意** 此参数适用于 `TIM1` 和 `TIM8` 高级定时器。\n\n## 启用 PWM 功能\n\n你现在需要启用 PWM 功能以获得脉宽。`TIM2`\
