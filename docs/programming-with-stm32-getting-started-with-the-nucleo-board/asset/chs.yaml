  \ 作为 LED 输出，仅仅是因为它在 `main.c` 模板程序中尚未配置为外设。图 5-11 是用于此设置的原理图。\n\n![images](img/fig05-11.jpg)\n\
  \n**图 5-11** *LED 原理图。*\n\n最长的引脚连接到正极，最短的引脚连接到负极。\n\n\n\n修改 `main.c` 文件以启用多个输出是相对简单的。我选择了\
