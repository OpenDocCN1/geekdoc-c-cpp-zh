  \ 100 Mbps 的速率在内部传输数字数据。HAL 有效地管理了来自 GPIO 端口以及图中所示许多其他外设组件的数据传输。\n\n我将通过检查可能最简单的\
  \ HAL 模块——`HAL_GPIO` 来开始关于 HAL 的讨论。该模块在前面的章节讨论的程序中已经多次使用。`HAL_GPIO` 模块之所以在使用时没有进行任何解释，仅仅是因为实现某些被要求的功能（如闪烁\
  \ LED 或读取按键开关状态）是必要的。我很快将将详细检查 `HAL_GPIO` 模块，在此之前，我将先讨论内存映射外设的概念。\n\n### 内存映射外设\n\
  \nSTM MCU 外设的控制和数据传输是通过位于 32 位范围内的地址完成的。这被称为内存映射（memory mapping），因为从编程的角度来看，与内存位置通信还是与外设寄存器通信是没有区别的。32\
  \ 位地址范围通常由八个整数数字表示，这意味着位置的总可能范围从 `0x0000 0000` 到 `0xFFFF FFFF`。注意，十六进制数前面有一个 `0x`，并且在前四个十六进制数字之后留有一个空格。`0x`\
  \ 是一个常见的编程结构，表示该数字为十六进制格式，两个十六进制组之间的空格只是为了增加数字的可读性。这种地址格式也贯穿整个 STM 文档。\n\n图 5-2\
  \ 显示了构成整个 32 位地址范围的主要模块。\n\n![images](img/fig05-02.jpg)\n\n**图 5-2** *完整的 32 位 STM\
  \ 地址范围。*\n\n图 5-2 中还了两个分解块，它们详细说明了核心内存位置以及外设/总线位置。接下来我将简要讨论核心内存位置，这些位置本身非常重要，但与外设地址位置的相关性不大。\n\
  \n### 核心内存地址\n\n表 5-1 显示了内存类型及其预分配的内存地址。\n\n![images](img/tab05-01.jpg)\n\n**表 5-1**\
  \ *STM 核心内存地址范围*\n\n许多读者可能思考的问题是，PC 如何在仅有 32 位寻址能力的情况下处理 8、16 甚至 32 GB 的 SRAM？答案在于使用了为扩展内存访问设计的操作系统以及名为内存管理单元（`MMU`）的硬件单元。所有主要的\
  \ PC OS（如 Windows、OSX 和 Linux）内置内置扩展内存功能，允许 32 位寻址扩展到多个块或页。你可以理解为使用一个 4 位寄存器，其中每一位激活一个特定的块或页。因此，位\
  \ 0 允许访问从 `0x0000 0000` 开始的所有基地址，而位 1 则允许寻址几乎从 `0x0001 0000 0000` 开始。当然，实际上只使用了\
  \ 32 位，但操作系统处理地址的方式就像它们从 `0xFFFF FFFF` 之后的一个位置开始一样。这个 4 位寄存器可以被认为是 `MMU` 的一部分。4\
  \ 位意味着在 32 位 PC 中最多可以处理 64 GB 内存，这恰好通常是此类 PC 可安装的最大 SRAM。当然，当使用 64 位系统时，所有实际的物理内存限制都会缓解，但这需要昂贵的\
  \ CPU 和额外的能量需求。\n\n前面的讨论不适用于典型的 STM MCU，因为内存非常受限，且处理典型的嵌入式应用不需要大量的内存。我想提一下，`STM32F302R8`\
  \ 确实包含一个内存保护单元（`MPU`）。`MPU` 不是 `MMU`，而是用于管理 CPU 内存访问，以确保一个任务不会意外损坏或冲突另一个任务的内存访问。内存可以分为最多八个区域，每个区域的大小在\
  \ 32 B 到 4 GB 之间，最后一个区域占有整个可寻址内存范围。`MPU` 通常由实时操作系统（`RTOS`）控制，该系统包含在上一章中介绍的 `CMSIS`\
  \ 中的 API。我不会在书中的任何项目中使用 `MPU`。你应该只在对安全最关键或任务至重要的应用中考虑使用它。将其想象为用于汽车或飞行安全系统。\n\n###\
  \ 外设内存地址\n\n图 5-3 显示了分配给 `STM32F302R8` 外设的内存地址起始部分，\n\n![images](img/fig05-03.jpg)\n\
  \n**图 5-3** *STM32F302R8 外设分配的起始部分。*\n\n你应该能 `AHB2` 总线的地址范围为 `0x4800 0000` 到 `0x4FFF\
  \ 17FF`。本章的重点是总 GPIO 范围 `0x4002 0000` 到 `0x4002 0x1FFF`。图 5-1 左侧显示了六组 GPIO 端口，它们连接到双向高级高速总线\
  \ `AHB1`。该总线以最高 100 Mbps 的速率在内部传输数字数据。HAL 有效地管理了来自 GPIO 端口以及图中所示许多其他外设组件的数据传输。\n\
  \n我将通过检查可能最简单的 HAL 模块——`HAL_GPIO` 来开始关于 HAL 的讨论。该模块在前面的章节讨论的程序中已经多次使用。`HAL_GPIO`\
  \ 模块之所以在使用时没有进行任何解释，仅仅是因为实现某些被要求的功能（如闪烁 LED 或读取按键开关状态）是必要的。我很快将详细检查 `HAL_GPIO` 模块，在此之前，我将先讨论内存映射外设的概念。\n\
