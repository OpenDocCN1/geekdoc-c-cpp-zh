  ## 演示三\n\n在最后一个演示中，我将以 DMA 模式运行 DAC 以输出由应用程序合成的正弦波。生成模拟信号是分配 DAC 的常用任务。DMA 是首选方法，因为它释放了内核处理器处理更高优先级的任务。以下通用语句启动了\
  \ DAC 并执行 DMA 传输：\n\n![_Images](img/c0269-01.jpg)\n\n在本次演示中，只有一个名为 `DAC_CHANNEL_1`\
  \ 的 DAC 通道可用。参数 `uint32_t* pData` 是数据指针，在这种情况下指向 200 个元素的数组开头。`uint32_t Length`\
  \ 参数是要传输的数据元素数量，即值为 200 的 `NSAMP` 常量。最后，`uint32_t Alignment` 参数指定数据元素的大小以及数据是右对还是左对。在这种情况下，定义\
  \ `DAC_ALIGN_12B_R` 显示数据为 12 位并右对。\n\n合成正弦波需要设置构成单个周期波形的增量或步数。在示例中，该数量为 200，这在具有代表性的样本和最小化需要持续处理的总步数之间取得了很好的平衡。用于合成\
  \ 12 位正弦波的相应方程如下：\n\n```\n![_Images](img/c0270-05.jpg)\n```\n\n该方程用于合成单个正弦波周期，`i`\
  \ 步长范围从 0 到 199。接下来，我为 DAC 正弦波输出任意选择了 15 ms 的周期，或等效频率 66.67 Hz。这意味着转换率必须设置为 `66.67\
  \ * 200` 或 `13,334`。\n\n\n\n\n\n定时器 `TIM6` 用作 `DAC` 的 `TRGO` 线的触发器，其周期必须设置为 `13334`。输入\
  \ `TIM6` 的高速外部时钟 (`HSE`) 设置为 `64 MHz` 且不进行分频。这意味着定时器周期值必须设置为 `64 MHz/13.33 K`，大约等于\
  \ `4800`。实际的周期值设置为 `4799`，以考虑到新增的 `frequency` 频率。\n\n### 程序列表\n以下是该演示的代码列表。我还针对相关段落提供了一些额外的讨论。\n\
