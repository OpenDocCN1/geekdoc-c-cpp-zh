  同样，输出部分有多种方法为 I/O 引脚创建信号输出。这些如下：\n\n- `Write`: 来自关联写寄存器行的输出。输出寄存器还有一个 `R/W` 控制线。\n\
  - `Alternate function`: 从内部 MCU 外设生成。\n\n请注意，输出控制块有两个连接到输出控制电路的 MOSFET 晶体管，它们提供了以下操作：\n\
  \n- `Push-pull`（推挽挽）\n- `Open-drain`（开漏）\n- `Disabled`（禁用）\n\n最后，I/O 引脚在引脚上带有可编程的启用电阻，这将允许以下操作：\n\
