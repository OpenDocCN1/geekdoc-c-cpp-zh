  \n点击 `Open Project` 按钮将打开 `Keil IDE`，新项目将显示在左侧的 `Project` 格中，如图 4-7 所示。\n\n![images](img/fig04-07.jpg)\n\
  \n**图 4-7** 带有新项目的 Keil IDE。\n\n图 4-7 中出现的错误对话框在上一章中讨论过，它是由于 IDE 没有目标硬件的引用。可以通过进入\
  \ `Device Database` 轻松解决，如第 3 章所述。解决后，点击 `+` 框展开 `Project` 目录。展开后，点击 `Application/User`\
  \ 子目录旁箭头显示该目录下的文件。最后，双击 `main.c` 文件，将显示以下代码。注意，此代码与第 3 章中所示相同。然而，我这样做是为了提供正确的上下文，以便在原本无法运行的程序中添加某些功能。此外，注意大量的\
  \ STM 免责声明注释已最小化以节省代码空间。\n\n![Images](img/c0092-01.jpg)\n![Images](img/c0093-01.jpg)\n\
  ![Images](img/c0094-01.jpg)\n![Images](img/c0095-01.jpg)\n![Images](img/c0096-01.jpg)\n\
  \n我选择使用斜体数字注释来对代码提供说明，只需引用代码和对应的斜体数字即可跟进讨论主题。\n\n*[1]*—使用 `/* ... */` 或 `//` 表示注释行，编译器会忽略这些内容。第一种格式允许多行注释，而第二种仅用于单行。\n\
  \n\n\n\n\n[2]—`#` 符号表示紧随其后的编译器指令或指示。在这种情况下，语句是 `#include “main.h”`，指示编译器使用名为 `main.h`\
  \ 的头文件。此特定的头文件存储在工作区头文件目录中，因为头文件名被双引号包围。`main.h` 包含了常量、定义和函数，这些内容为通用输入/输出 (GPIO)\
  \ 引脚提供了“易于理解”的名称，例如用于用户 LED 的 `LD2` 和用于用户按键的 `Push Button`。\n\n[3]—此头文件为项目代码利用 `HAL`\
  \ 框架提供了所有必需的常量和定义。\n\n[4]—在 C/C++ 语言中，所有调用的方法都必须在使用之前声明。这就是原型部分（prototype section）的作用。\n\
  \n[5]—这是程序的起始点。`main` 函数名称前的 `int` 表示 `main` 函数返回一个整数值。如果程序正常终止，返回给操作系统的值通常为 `0`，否则返回\
  \ `1`。\n\n函数参数\n\n![Images](img/c0097-01.jpg)\n\n仅当在程序开始执行前需要提供初始值时才使用。在这种情况下，它们不是必需的。\n\
  \n[6]—这是左大括号。所有的 C/C++ 函数都将其代码包含在左右大括号之间。此 `main` 函数必须有一个匹配的右大括号，否则 C/C++ 编译器将生成错误。\n\
  \n[7]—此语句启动了一个系统定时器，每 `1 ms` 生成一次 `SysTick`。注意该语句以分号结尾，这通常是所有 C/C++ 声明语句所要求的。遗漏分号是初学者（以及并不那么初学的开发者）常见的错误。\n\
  \n[8]—此语句初始化了直接控制用户 LED 的相应 GPIO 引脚。在这种情况下，GPIO 引脚为 `PA5`，这意味着它是端口 A 中找到的八个引脚之一。`STM`\
  \ MCU 有多个 GPIO 端口。具体数量取决于特定型号。\n\n[9]—这是无限循环的开始，意味着程序将一直运行，直到手动停止或断开电源。括号中的 `1`\
  \ 表示真值。开发者通常会使用 `Boolean` 变量代替固定常量，从而允许在 `while` 结构的作用范围内从程序内部停止程序。该范围由左右大括号确定，类似于在\
  \ `main` 函数中使用的方法。这种多对大括号的使用被称为嵌套。\n\n我将提供有关代码修改的额外解释。\n\n希望这次对 `main.c` 源码的简要回顾能让你对\
  \ C/C++ 程序如何运行有一定的见解。\n\n## 为程序添加功能\n\n我将向你展示如何向此程序添加一个非常简单的函数，该函数将以每秒一次的频率闪内置绿色用户\
  \ LED。要添加的两个语句在下面的代码片段中显示（无限循环）。\n\n![Images](img/c0098-01.jpg)\n\n第一条语句 `HAL_GPIO_TogglePin(LD2_GPIO_Port,\
  \ LD2_Pin);` 切换选定 Nucleo 板上永久连接到用户 LED 的 GPIO 引脚。注意对连接 LED 的 GPIO 引脚和相关的 GPIO 端口使用了人类可识别的名称。该功能通过\
  \ `main.h` 文件包含的定义实现，该文件已包含在 `main.c` 中。\n\n第二条语句 `HAL_Delay(500);` 在 LED 状态改变之前让处理器暂停\
  \ `500 ms`。这将导致 LED 以每秒一次的频率闪烁，占空比为 50%，即开启 `0.5 s` 并关闭 `0.5 s`。\n\n## 编译并执行修改后的程序\n\
  \n在无限循环中添加了另外两个语句后，只需点击构建图标即可。此外，确保你已启用了 hex 文件输出，如前一章所述。在使用 `ST-LINK` 工具之前这是必须的。\n\
  \n再次，请参考第 3 章中提供的 `ST-LINK` 详细说明，如何加载 hex 文件并将其下载到目标板。\n\nhex 文件下载后，用户 LED 应该立即开始闪烁。鉴于程序构建成功，我有信心你在此过程中不会遇到问题。\n\
  \n## main.c 函数的简单修改\n\n对 `main.c` 函数简单的修改是更改 LED 定时时长，这就是我在下一个演示中所做的。以下代码片段显示了对\
