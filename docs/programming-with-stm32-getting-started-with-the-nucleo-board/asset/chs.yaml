  ![Images](img/c276-01.jpg)\n\n### 测试结果\n`图 11-9` (`ch11.xhtml_ch11fig9`) 是连接到 `PA4`\
  \ 的示波器截图，该端口是 `STM32F302R` MCU 的 `DAC` 通道 1 输出。\n\n![images](img/fig11-09)\n\n###\
  \ DAC 输出\n你可以看到这是一个干净的正弦波，周期为 `15ms`，或频率约等于 `66.67 Hz`。峰峰幅度在 `0` 到 `3.3 V` 之间变化。此波形完全符合程序设定。`图\
  \ 11-10` (`ch11.xhtml_ch11fig10`) 是平均频谱，显示了 `DAC` 正弦波的主要分量。\n\n![images](img/fig11-10)\n\
  \n### 正弦波显示\n测得的总失真 (`THD`) 仅为 `1.372%`，对于这种信号来说非常低。`200 Hz` 处的三次谐波是最高分量，测量值为 `-42\
  \ dB`，小于主频率幅值的百分分之一。我还尝试通过更改定时器 `TIM6` 周期来确定最高输出。我确定最小周期值 `105` 可以产生频率略高于 `3 kHz`\
  \ 的正弦波。任何低于该值都会导致 `DAC` 保持在稳定水平。我要说的最后一点（也是同样的）是，一旦 `Cortex-M` 处理器配置并启动，信号参与生成。注意\
  \ `main` 方法中的 `forever` 循环完全没有任何代码，因为信号生成完全通过硬件和固件的完成。这种方法是高效嵌入式设计的精髓。\n\n### 总结\n\
  本章解释了直接内存访问 (`DMA`) 和数模转换器 (`DAC`)。我选择这种组合是因为 `DAC` 是与 `DMA` 配合的理想外设。第一部分解释了 `DMA`\
  \ 控制器实现这种操作模式的原理。接下来的讨论重点在于如何使用 `HAL` 框架来配置和初始化 `DMA` 操作。我针对两个设置 `DMA` 模式至关重要的 `structs`\
  \ 进行了详细讨论。\n\n第一个演示简单地让 `USART2` 外设使用 `DMA` 模式向内存发送字符字符串。提供了一个完整的程序列表，包含了所有关于 `DMA`\
  \ 的重要细节。下一节介绍了 `DAC` 并提供了关于其工作原理的简要背景。随后是一个关于如何使用 `HAL` 框架配置和初始化该外设的章节。第二个演示说明了如何通过放在\
  \ `main` 方法 `forever` 循环中的代码让 `DAC` 生成三角波。这个演示刻意设计成计算“密集型”，以便为下一个演示做准备。第三个也是最后一个演示展示了\
