  \n进行以下更改以启用多路 LED 输出。\n\n在 `main` 方法中进行更改：\n\n![Images](img/c0122-02.jpg)\n\n![Images](img/c0123-01.jpg)\n\
  \n你需要重新编译并将新的 hex 文件上传到 `Nucleo-64` 板上以测试新功能。\n\n### 测试运行\n\n我将 LED/电阻组合连接在 `PA10`\
