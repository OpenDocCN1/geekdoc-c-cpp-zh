  \ C 代码段必须如下持续响应此事件：\n\n![Images](img/c0124-01.jpg)\n\n在 `main()` 方法中输入上述代码段以继续演示。接下来，编译并将\
  \ hex 文件上传到 `Nucleo-64` 板上。\n\n### 测试运行\n\n我观察到只要按下按键，LED 就会亮起。注意，你必须使用小螺丝刀来按按钮，因为它隐藏在\
  \ Arduino 实验板下方。\n\n下一个演示涉及涉及所有 MCU 信号操作（包括 GPIO 引脚）的一个基本属性。\n\n### 时钟速度演示\n\n与\
  \ MCU 信号操作相关的时钟速度是一个误称。你通常会将其视为每秒信号传输的最大数量衡量标准。然而，它实际上是时钟抖斜（clock skew）或测量信号从最大值的\
  \ 10% 传输到 90% 所需的时间。它也适用于反方向，即从最大值的 90% 传输到 10%。前者被称为前沿延迟，后者被称为后沿延迟。\n\n时钟抖斜与真实的时钟速度直接相关，因为前沿和后沿延迟最终决定了每秒可能的信号传输最大数量。我仍然将时钟抖斜称为时钟速度，因为这是\
  \ STM 选择标记这一重要信号属性的方式。\n\n人们应该问的关键问题是，为什么要考虑时钟速度。答案在于延长 MCU 和电池的寿命。提高时钟速度背后的物理学决定了需要能量或功率（在这种情况下）来克服主要决定时钟速度的电容效应。需要少量的额外功率来改善电路切换时间。这意味着随着时间的推移，从电池流出的电流将会增加，从而缩短电池寿命。此外，功耗的增加将导致\
  \ MCU 产生少量的额外热应力，并缩短其寿命。上述是为什么时钟速度应始终选择在最低水平但仍支持所需功能的主要原因。\n\n此演示将说明与最大和最小时钟速度设置相关的实际时钟定时。HAL\
  \ 框架提供了四种速度设置，如下：\n\n*   低 (Low)\n*   中 (Medium)\n*   快 (Fast)\n*   极快 (Very Fast)\n\
  \n我将同时使用低和极快设置，并分别它们分别应用于引脚 `PC0` 和 `PC1` 的信号输出。不需要额外的 MCU 硬件。然而，你需要一台快速的多通道示波器来复制此演示。示波器的带宽额至少也应为\
  \ 100 MHz。我使用了 `Picoscope USB oscilloscope`，型号 `3406B` 来捕捉测量值。该测试设备配合 PC 可以测量并显示多四个独立通道。\n\
  \n### 设置引脚时钟速度\n\n`PC0` 和 `PC1` 引脚的时钟速度通过创建两个 `GPIO_InitStruct` C 数据结构并将它们放在 `MX_GPIO_Init(void)`\
  \ 方法中设置。此外，在 `main()` 方法中还需要少量代码。\n\n两个新的 `GPIO_InitStruct` C 数据结构如下：\n\n![Images](img/c0125-01.jpg)\n\
  \n![Images](img/c0126-01.jpg)\n\n新的 C 结构将引脚配置为相同的 GPIO 输出，区别在于一个是低速，另一个是极速。`main()`\
  \ 中的代码段以最快速率在引脚输出的高低状态之间切换，因为中间没有其他代码。\n\n### 测试结果\n\n图 5-13 是一个显示 GPIO 引脚信号波形瞬时捕的截图。\n\
  \n![images](img/fig05-13.jpg)\n\n**图 5-13** PC0 和 PC1 引脚的信号波形。\n\n很容易看出信号波形不是具有陡峭转换的数字信号，而是带有明显的边缘斜率。失真可能是由于示波器探头的电容负载以及连接示波器探头与\
  \ Arduino 实验板之间的跳线引起的轻微电感造成的。我还使用了 10× 高阻探头设置来帮助减少 GPIO 引脚的负载。我知道这很有帮助，因为我重复使用了\
  \ X1 探头设置进行测量，这进一步扭曲了设置。垂直电压幅度比例必须乘以 10 以考虑 10× 探头设置。\n\n如果你仔细观察图片，应该看到示波器对显示的波形计算出的两个自动测量。我在下方重复了这些测量以便查看：\n\
  \n脉冲周期：94.1 ns\n\n频率：10.62 MHz\n\n我还仔细检查了[图 5-13]中的波形，以估计我用于计算反映测得波形前沿所需的等效带宽的参数。我还使用了使用前沿上升时间估算等效带宽的经验法则。这些计算如下：\n\
  \n![Images](img/c0127-01.jpg)\n\n\n\n为“极速”（Very Fast）设置计算出的 70-MHz 带宽反映了若干因素，包括\
  \ 100 MHz 的最大 AHB1 总线速度，以及其控制的 Nucleo-64 开发板的 `STM32F302R8` 高速时钟频率 72 MHz。总而言之，70-MHz\
  \ 的带宽相当不错，而“低速”（Low speed）设置的 19.4 MHz 对于极高速度数据通信等对要求的较高的应用可能会出现问题。我的实验结果实际上与 STM\
  \ 对极速设置 75 MHz 和低速设置 25 MHz 的估计值非常接近。\n\n### 总结\n\n本章的重点是如何操作 GPIO 引脚和 HAL（硬件抽象层）。我首先回顾了\
  \ STM 外围器是如何进行内存映射的，因为这是 MCU 配置和控制它们的根本基础。\n\n接下来，我讨论了典型的 GPIO 硬件引脚是如何设置的，以及它可以配置的各种功能，包括输入、输出、模拟角色或复用功能。还讨论了与\
  \ GPIO 引脚相关的各种控制寄存器。\n\n接着展示了一个简单的 LED 测试演示，我在其中使用了插入到 Arduino 面板插座中的 LED/电阻组合。该面板反过来插入到\
  \ Nucleo-64 开发板中。我详细介绍了点亮 LED 所需输入 `main.c` 文件的所有程序更改。提供了一个完整且带注释 `main.c` 列表供参考和使用。\n\
  \n随后对上述程序进行了修改以适应多个输出，控制了一个额外的 LED。\n\n下一个演示说明了位于 Nucleo-64 开发板上的蓝色用户按钮如何通过 GPIO\
  \ 输入引脚编程，以便在按下时点亮 LED。该程序的目的是向你展示如何将 GPIO 引脚配置为输入。\n\n最后一个演示涉及 GPIO 时钟速度参数如何影响 GPIO\
  \ 信号输出波形。我解释了时钟速度是一个误称，真实的意图是控制 GPIO 信号斜率（Skew）。斜率是从一个状态转换到另一个状态所需的时间。\n\n# 6 中断\n\
  \n本章涵盖了中断。顾顾义，它们处理在识别到预定事件时停止程序的正常执行，然后处理该事件。\n\n### 中断\n\n从高层角度来看，中断是任何暂时停止正在进行的程序执行并要求\
  \ MCU 执行与触发中断的事件相关的特殊代码的过程。这种特殊代码被称为中断处理程序（interrupt handler）。导致中断的事件被称为异步事件，意味着它与正常执行的程序代码没有因果关系。你很快就会看到，定时器外围器通常是这些异步事件的源。数据通信通道以及直接内存访问（DMA）过程也经常使用中断。\n\
  \n中断可以源于硬件，涉及定时器时就是如此。它也可以完全由软件驱动，这通常在检测到程序异常终止时发生，例如尝试除以零或尝试访问不存在的内存位置。大多数编程语言中的软件中断通常被称为异常（exceptions）。然而，在\
  \ ARM 术语中，所有中断（无论是硬件启动还是软件启动）统称为异常。\n\nARM Cortex-M 集成外围器（IP）包含一个名为嵌套向量中断控制器（`NVIC`）的硬件设备，其目的是管理异常。图\
  \ 6-1 是一个说明 `NVIC` 如何与其他关键 Cortex-M 组件连接的框图，包括 Cortex-M 核心和其他外围器。\n\n![images](img/fig06-01.jpg)\n\
  \n**图 6-1** NVIC 框图。\n\n你可以在图 6-1 的左侧看到两种类型的线连接。标记为 `NMI` 的单线代表不可掩码中断，用于允许外围器信号\
  \ `NVIC` 无条件地启动中断过程。另一种中断类型是 `IRQ`，代表中断请求。这种中断类型可以被屏蔽，这意味着如果设置了相应的掩码 `IRQ` 寄存器位，`NVIC`\
  \ 则不必立即响应 `IRQ`。通常只有一个 `NMI`，但有许多取决于特定型号 `NVIC` 容量的 `IRQ` 线。\n\n`NVIC` 同样连接在 Cortex-M\
  \ 核心与专用的 I/O 线以及标准的内部总线互连结构之间。这意味着 `NVIC` 完全符合 CMSIS 标准，并使用与 GPIO 讨论中详细描述相同类型的控制和配置寄存器。`NVIC`\
  \ 完全集成到 HAL 软件框架中，并使用它自己的 C 结构来设置各种寄存器。`NVIC` 的驱动软件将在一个演示程序中讨论。此时，我将讨论关于 `NVIC`\
  \ 的一些重要细节。\n\n## NVIC 规范\n\nSTM `NVIC` 通用规范规定单个 `NVIC` 可以管理多达 256 个中断通道。在 256 个通道中，240\
  \ 个可以是外部的，而 16 个始终是内部的。实际上，控制项目开发板的 STMF302R8 MCU 的 `NVIC` 部分仅支持 52 个通道。此外，还有 16\
  \ 条直接连接到 `NVIC` 的硬件中断线。MCU 的 51 条 GPIO 线中的任何一条都可以被配置为可掩码中断，这意味着它们可以变成中断通道。你应该将中断通道看作是软件结构而非硬件实现。事实上，中断的\
  \ C 结构使用了“通道”（channel）一词来强化这一概念。\n\n中断还可能分配一个优先级级别。这意味着高优先级中断可以中断低优先级的中断。这种行为为 `NVIC`\
  \ 缩写中的“嵌套”（nested）一词赋予了意义。一个 8 位寄存器持有优先级级别，这意味着最多可以有 256 个优先级级别。我无法想象任何需要如此数量优先级的实用嵌入式系统。这样的系统可能无法设计，更不用说实现了。\n\
  \n既然已经介绍了 `NVIC`，现在是时候详细讨论中断过程了。\n\n### 中断过程\n\n在继续本节之前，有几个定义需要设定：\n\n- 开启（Arm）：允许硬件设备触发中断\n\
  - 关闭（Disarm）：不允许设备触发中断\n- 启用（Enable）：允许中断过程\n- 禁用（Disable）：不允许中断过程\n\n启用和禁用中断可以通过\
  \ C 语言分别使用 `EnableInterrupts()` 和 `DisableInterrupts()` 方法轻松实现。只要启并在相应的 `NVIC` 控制寄存器中设置了与潜在中断源相关的特定触发位，就可以触发中断。这被认为是开启了特定的设备。相反，重置相同的寄存器触发位被认为是关闭该设备。在考虑\
  \ SysTick 中断时，此过程中有一个重要的偏差。由于其事件必须始终被 MCU 识别，它没有启用位。\n\n中断优先级通过设置 `NVIC` `BASEPRI`\
  \ 寄存器来建立。例如，如果将特定中断设置为优先级 3，那么任何优先级级别为 0、1 或 2 的中断将中断级别 3 的中断。然而，如果 `BASEPRI` 寄存器设置为\
  \ 0，则中断优先级功能被禁用，所有中断将按它们被 `NVIC` 的顺序处理。\n\n在生成中断之前，必须满足五个前提条件：\n\n\n\n\n\n1. 潜在的中断设备必须处于已就绪状态，即触发位已设置。\n\
  2. `NVIC` 必须启用。\n3. 全局中断必须启用。\n4. 中断优先级必须高于当前级别。\n5. 必须发生实际的硬件触发事件。\n\n这五个条件可以以任何顺序发生。然而，它们必须同时满足，中断才能被识别并处理。\n\
  \n如果识别到中断，将发生以下五个事件：\n\n1. 当前正在执行的指令将完成。\n2. 当前运行的线程将挂起。\n3. 12 个寄存器的内容将存储在栈中。如果在识别到中断时浮点单元（`FPU`）恰好处于激活，则将额外存储\
  \ 18 个字。\n4. `LR` 寄存器将被设置为特定值（`LR` 是一个特殊的栈寄存器）。\n5. `PC` 寄存器将加载中断服务程序（`ISR`）地址。\n\
  \n图 6-2 是上述五个事件的图形化描述。\n\n![images](img/fig06-02.jpg)\n\n**图 6-2** 中断处理序列。\n\n关键的一点是，`NVIC`\
  \ 在识别到有效中断请求后，将使用存储在 `NVIC` 的固件自动与 MCU 接口。不需要特殊的代码，这使得中断处理尽可能快。如图 6-2 所示，从识别到中断到执行\
  \ `ISR` 中的第一条指令只需要 12 个时钟周期。这意味着对于时钟频率 80 MHz 的 MCU 来说，大约有 1.5 µs 的延迟。\n\n系列事件被称为上下文切换，由\
  \ `NVIC` 硬件自动调用。上下文切换的结果是当前运行的线程变为后台线程，而 `ISR` 变为前台线程。上下文切换在优先级中断中也工作得很好，低优先级的 `ISR`\
  \ 变成后台线程，高优先级的 `ISR` 变成前台线程。\n\n还有等待中断请求（pending interrupt request）的概念，你应该了解。如果检测到全局中断尚未启用，或者请求的中断优先级低于当前激活的中断，则请求的中断将处于挂起状态。一旦满足五个前提条件，请求的中断状态将从挂起变为激活。\n\
  \n清除所有设备触发位也非常重要，否则会出现持续反复的中断请求。清除触发位的操作称为确认（acknowledgment），并通过软件指令完成。只有 `SysTick`\
  \ 中断具有自动确认功能，因为它在 MCU 中起着关键作用且其操作具有循环性。确认指令几乎总是包含在 `ISR` 中。\n\n关于 `ISR` 属性的几句话对于理解它在中断过程中所扮演的角色会有帮助。`ISR`\
  \ 包含了处理并完成触发初始中断的动作所需的所有代码。`ISR` 通常是一个非常紧凑的软件模块，为支持中断设备的单一任务设计。然而，有一种实现方式仅用一个大型\
  \ `ISR` 服务于许多中断源。在这种情况下，采用轮询技术来确定精确的中断源，并仅使用该大型 `ISR` 的部分来处理中断设备。STM MCU 并非如此。STM\
  \ 实现使用独立的、较小的 `ISRs` 来处理每个请求的中断设备。这些小型 `ISRs` 的地址列表存储在向量表中。这一特性引入了 `NVIC` 名称中的“向量（vector）”一词。\n\
  \n我想提到一个 STM 向量中断过程实际上使用轮询的区域。这种情况是同一个端口上的多个 GPIO 引脚可以分别发出它们自己的中断。由于 GPIO 端口只有一个向量地址，因此由软件轮询该端口的所有触发位，以确定哪一个位已就绪（请求了中断）。\n\
  \n每个 `ISR` 的编写都是为了尽可能高效地处理中断设备，并在发出确认信号的同时调用上下文切换。后者可以通过 C 语言命令轻松实现，该命令具有类似于 `BX\
  \ LR` 的汇编语言格式，它将非常快速地将所有存储的寄存器值弹出到各自的寄存器中，从而将 MCU 恢复到中断前的状态。软件工程的设计目标是 `ISRs` 应该运行得越快并返回之前的前台线程。这意味着永远不应在\
  \ `ISR` 中放置等待循环。\n\n在 `ISR` 中生成或修改的任何数据必须存储在全局共享内存位置中，否则由于 C 语言实现 `ISR` 框架的性质，它将对任何其他软件模块不可。\n\
  \n## 外部中断\n\n如通过 GPIO 引脚源的外部中断通过外部中断控制器（`EXTI`）连接到 `NVIC`。使用 `EXTI` 允许将许多 GPIO 引脚复用到\
  \ `NVIC` 外部中断输入。图 6-3 是 `EXTI` 的框图。\n\n![images](img/fig06-03.jpg)\n\n**图 6-3**\
  \ EXTI 框图。\n\nSTM32F302R8 MCU 中的 `EXTI` 控制器执行以下活动：\n\n- 处理连接到 16 条外部中断/事件线的最多 23\
  \ 个独立软件事件和/或硬件触发\n- 为每条线提供状态位\n- 为每条线提供独立的触发器和掩码\n- 可以检测周期比驱动 EXTI 的 APB2 总线时更短的外部脉冲\n\
  \nSTM32302R8 51 个 GPIO 引脚中的任何一个都可以作为中断源。当然，任何时候最多只有 23 个激活。还有五条 `EXTI` 线连接如下：\n\n\
  1. 线 16 连接到 PVD 输出\n2. 线 17 连接到 RTC 闹钟事件\n3. 线 18 连接到 USB OTG FS 唤醒事件\n4. 线 21 连接到\
  \ RTC 旁路时间戳事件\n5. 线 22 连接到 RTC 唤醒\n\n图 6-4 显示了 GPIO 引脚、外部控制器和 `NVIC` 中断之间的关系。\n\n\
  ![images](img/fig06-04.jpg)\n\n**图 6-4** GPIO 引脚、外部控制器和 NVIC\n\n你应该注意 GPIO 引脚 PC13\
  \ 与许多其他引脚组合在名为 `EXTI15_10_IRQ` 的共同 NVIC 中。这对中断程序非常重要。\n\n到这里，你应该已经获得了足够的知识来理解下一节简单的中断演示。\n\
