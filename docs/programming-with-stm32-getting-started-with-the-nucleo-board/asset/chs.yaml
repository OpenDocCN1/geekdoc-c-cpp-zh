  \n![Images](img/c0143-01.jpg)\n\n你应该能立即发现 ISR 只有七条语句，这与我之前的讨论非常吻合：ISR 必须尽可能简洁，并专注于单一任务。第一条语句是一个无操作（nop）“for”循环，引入了极短的延迟以对按键进行去抖。下一条语句是一个复合“if”，读取连接到按键的电压电平。由于程序已经在中断处理程序中，它将为高电。如果外部\
  \ C 变量 `tDelay` 被设置为 250，它将被重置为 1000，反之亦然。ISR 中的最后语句激活了连接到引脚 `PC13` 的外部控制器的 `NVIC`\
  \ IRQ 处理器。\n\n### 测试\n\n我构建了项目并使用之前章节中详细说明的方法将其下载到 `Nucleo-64` 开发板上。最初我观察到在初始下载后\
  \ LED 每秒闪烁两次。然后我按下蓝色按钮，观察到 LED 开始以每秒闪烁一次的速度闪烁。再次按下则回到每秒闪烁两次的频率。这有力地证明了中断演示正按预期工作。诚然，这是一个非常简单的演示，但它包含了支持更复杂中断驱动程序的所有元素。你会发现中断是嵌入式开发者的最好朋友。我的大多数嵌入式开发项目都使用中断。不使用中断将剥夺你在创建高效嵌入式程序的重要工具。可以说，如果不采用至少一个中断，现代嵌入式项目将是不实用的。\n\
  \n### 总结\n\n我在本章开始讨论了 `STM MCU` 中断过程是如何工作的。这段讨论包括对 `NVIC` 的描述和功能，以及对完整中断处理序列的遍历。\n\
  \n接下来是一个中断演示，其中用户按下项目 `Nucleo-64` 板上的蓝色按键，导致产生了中断。相应的中断服务程序（ISR）代码随后切换了板载 LED 的状态。\n\
  \n# 7. 定时器\n\n定时器外设是 MCU 中非常重要的组件。许多嵌入式应用依赖于时间或时间特性，而定时器是 MCU 控制应用程序的主要手段。虽然可以使用\
  \ MCU 直接对过程进行计时，但这将是对计算力的极大浪费，且效率极低。使用硬件定时器配合中断确实是实现嵌入式时间相关应用的唯一实用方法。幸运的是，`STM`\
  \ 在其 MCU 系列中提供了强大的定时器种类。\n\n### STM 定时器外设\n\n定时器简单来说自由运行的计数器，计算来自时钟源的脉冲。由于时钟源的脉冲序列具有已知的周期或脉冲间隔，因此经过的时间与计数的脉冲数直接相关。典型\
  \ MCU 使用的定时器时钟通常来自内部主时钟。然而，主时钟运行速度通常非常快，因此定时器脉冲必须通过硬件分频到定时器可以使用合理值。用于“减慢”主时钟速率的硬件各不相同，可以是二进制分频器（预分频器）或相锁环（PLL）。定时器计数器可以根据计数器使用的位数进行向上计数或累加计数直到溢出。16\
  \ 位计数器在达到最大计数 65535 时溢出。溢出中断通常是这种情况下发生的事件。\n\n相反，定时器计数器可以从某个预设值递减，并在达到 0 值时触发中断。这种计数器类型被称为减计数器，有许多用途。\n\
  \n定时器有许多用途，包括但不限于以下内容：\n\n* 生成精确的时间基。所有 `STM` 定时器都能做到这一点。\n* 测量输入的数字脉冲序列的频率。\n*\
  \ 测量输出信号的经过时间。这在 `STM` 定时器中被称为输出比较。\n* 生成精确的脉冲宽调制（PWM）信号，用于舵青和电机控制。\n* 生成具有可编程长度和延迟特性的单脉冲。\n\
  * 更新、触发、输入捕获和输出比较事件生成周期性直接内存访问（DMA）信号。\n\n以下是五大类 `STM` 定时器：\n\n* **基础型 (Basic)**：简单的\
  \ 16 位定时器。它们没有输入或输出引脚。它们主要用作其他定时器的“主器”。它们还被用作数模转换器（DAC）时钟。它们可以像所有 `STM` 定时器一样生成时间基。\n\
  * **通用型 (GP)**：这些具有输入和输出引脚的 16 位或 32 位定时器。它们可以实现上述的所有功能。GP 定时器多达四个可编程通道，可以配置如下：\n\
  \    * 一个或两个通道\n    * 带有互补输出的一个或两个通道\n* **高级型 (Advanced)**：具有 GP 定时器的所有功能，以及与电机控制和数字电源相关的附加。该定时器提供三个互补输出，并带有紧急停止输入。\n\
  * **高分辨率 (High resolution)**：由六个子定时器（一个主器和五个从器）制成的多个高分辨率输出。该定时器可以多次插入死区时间。还有五个故障输入和\
  \ 10 个外部事件输入。该定时器在 `STM` 术语中的缩写为 `HRTIM1`。\n* **低功耗 (Low power)**：用于特殊低功耗应用的定时器。这些定时器设计为在几乎所有\
  \ STM MCU 模式下运行，甚至可以在没有内部时钟源的情况下继续运行。\n\n演示板使用的 `STM32F302R8` MCU 具有基础、通用和高级定时器。我将重点关注这些定时器如何工作以及如何编程。所讨论的概念如果你在其他项目中遇到这些定时器类型也同样适用。一如既往，制造商的数据表是确定特定定时器如何工作以及如何对其进行编程的最佳资源。\n\
  \n`STM32F302R8` MCU 有六个定时器，如表 6-1 所示。在选择和编程定时器时，该表非常有参考。\n\n### STM 定时器配置\n\n我现在将讨论如何使用\
  \ HAL 框架配置 STM 定时器。\n\nSTM 定时器的配置方法与之前讨论的 GPIO 引脚和中断相同。STM 定时器使用名为 `TIM_HandleTypeDef`\
  \ 的 C 结构体进行配置，该结构体包含以下成员：\n\n\n\n\n\n- **Prescaler**: 用于缩放主时钟频率的分频因子。所有定时器均仅使用 16\
  \ 位分频器。16 位寄存器可以存储从 1 到 65535 的分频器值。例如，对 80-MHz 主时钟应用 40,000 的分频器值意味着输入定时器的时钟频率为\
  \ 2-kHz。\n- **CounterMode**: 设置计数方向。可用的 CounterModes 如下：\n    - `TIM_COUNTERMODE_UP`\n\
  \    - `TIM_COUNTERMODE_DOWN`\n    - `TIM_COUNTERMODE_CENTERALIGNED1`\n    - `TIM_COUNTERMODE_CENTERALIGNED2`\n\
  \    - `TIM_COUNTERMODE_CENTERALIGNED3`\n- **Period**: 这是一个代表在定时器计数器加载该数值之前所经过的最大时间的数值。16\
  \ 位计数器的最大值为 `0xffff`，32 位计数器为 `0xffffff`。值为 `0x0` 将确保定时器启动。\n- **ClockDivision**:\
  \ 这是一个特定的位字段，用于设置内部定时器时钟频率与用于数字滤波采样时钟之间的比例。它还用于设置死时间参数。可用的 ClockDivision 模式如下：\n\
  \    - `TIM_CLOCKDIVISION_DIV1`\n    - `TIM_CLOCKDIVISION_DIV2`\n    - `TIM_CLOCKDIVISION_DIV4`\n\
  - **RepetitionCounter**: 设置定时器溢出或下溢的次数限制。达到限制时将设置定时器更新寄存器。也可以结合寄存器更新触发一个事件。\n\n\
