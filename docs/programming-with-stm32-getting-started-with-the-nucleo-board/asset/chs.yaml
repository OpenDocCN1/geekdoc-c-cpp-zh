  \n## 11\n\n## 直接内存访问 (DMA) 和数模转换器 (DAC)\n\n本章内容经过精心挑选，用于解释直接内存访问 (DMA) 和非常有用的数模转换器\
  \ (DAC) 外设，后者利用了高效的 DMA 传输。本章中展示了几个演示项目，涉及 DMA 和 DAC\n\n### DMA\n\n数据通常由 Cortex-M\
  \ 处理器执行的指令进行传输。数据通常发送到内部存储器和其他设。这种数据传输过程消耗了宝贵的处理器周期，而这些周期在嵌入式系统中非常有限。这就是设计 DMA 控制器的原因。它可以承担许多数据传输任务，让处理器处理其他任务。\n\
  \n从技术上讲，DMA 控制器可以被视为外设设备；然而我更倾向于将其视为协处理器而非外设。与任何其他外设不同，DMA 控制器可以担任总线角色，这是处理器本身以外的任何设备都不允许的。事实上，将\
  \ DMA 控制器视为控制器是查看该设备的好方法。\n\n图 11-1 用于项目板 STM32F302R8 MCU 的 DMA 控制器框图。图对于解释 DMA\
  \ 控制器如何工作非常有帮助。\n\n![images](img/fig11-01.jpg)\n\n**图 11-1** *DMA 框图。*\n\n***注意***\
  \ DMA2、SPI1、TIM3、TIM4、UART4、UART5 和 ADC2 在 STM32F302R8 MCU 中不可用。\n\n在进入 DMA 操作细节之前，考虑数据传输的基础知识是值得的。\n\
  \n## 基本数据传输概念\n\n图 11-2 是一个简化的系统框图，从图 11-1 中移除了所有 DMA 组件。此图的目的是关注核心处理器与所有剩余系统外设之间是如何传输数据的。\n\
  \n![images](img/fig11-02.jpg)\n\n**图 11-2** *核心处理器与系统外设之间的数据传输。*\n\n\n\n\n\n你应该清楚地看到，核心\
  \ `Cortex-M` 处理器与任何外设或内部内存之间的所有数据传输都必须通过 `Bus Matrix` 或 `FLITF` 块。数据根本没有其他方式可以到达处理器。每次数据传输都需要一定数量的处理器周期来完成。例如，处理器必须处理从连接到\
  \ `UART` 外设的外部设备发送的所有数据，而这些数据被指定要存储在 `SRAM` 中。重要的是，处理器不会以任何方式修改或更改数据，而简单地将它们发送到正确的内存存储位置。这种对核心处理器参与的要求占用了宝贵的周期，而这些周期本可以被用于更高效的操作。一个类似的模型是：数据用汽车表示，而处理器比作城市。想要前往遥远目的地的跨国司机被迫通过一个拥有所有交通信号灯和拥堵街道的城市。如果有一条绕道公路，对司机来说将会好得多，因为这让他们可以避开城市。`DMA`\
  \ 控制器扮演了这条绕道的角色。\n\n回到图 11-1，你应该能看到在 `STM32F302R8` MCU 的情况下，`DMA1` 控制器直接连接到 `Bus\
  \ Matrix`。正如我之前提到的，该控制器被设置为总线控制器或主设备，因此能够配置 `Bus Matrix` 以直接在外设与内部内存之间、内存与内存之间、甚至另一个外设之间建立数据连接。这些配置自然地命名如下：\n\
  \n* 外设到内存的传输\n* 内存到外设的传输\n* 外设到外设的传输\n* 内存到内存的传输\n\n`Bus Matrix` 控制核心处理器和 `DMA`\
  \ 控制器对各种数据线、内存和外设的访问。它使用 `Round Robin`（轮询）算法来实现这种控制，确保两个控制器都能获得公平的访问。图 11-3 是说明\
  \ `Bus Matrix` 如何与所有系统组件连接的框图。\n\n![images](img/fig11-03.jpg)\n\n**图 11-3** *Bus\
  \ Matrix 框图。*\n\n`Bus Matrix` 是一个复杂的电路，互连了以下主设备和从设备：\n\n* 核心 `Cortex-M` 处理器（主设备）\n\
  * `DMA` 控制器（主设备）\n* 使用 `ICODE` 的 Flash 内存接口 (`FLITF`)（从设备）\n* 使用 `DCODE` 总线的 Flash\
  \ 内存接口 (`FLITF`)（从设备）\n* 直接连接到 `SRAM`（从设备）\n* 高级高速总线 1 (`AHB1`)，它通过桥接电路（`Bridge\
  \ 1` 和 `Bridge 2`）连接到高级外设总线 (`AHB1` 和 `APB`）（从设备）\n* 连接到 `GPIO` 引脚的高级外设总线 (`APB`)（从设备）\n\
  * 直接连接到 `ADC1` 外设（从设备）\n\n## DMA 控制器详情\n\n每个 `STM32 DMA` 控制器包含两个主端口，一个名为内存端口，连接到\
  \ `SRAM` 和 flash 等内部内存。另一个名为外设端口，连接到高级高性能总线 (`AHB`)。`AHB` 反而与从设备外设连接。在 `STM32F302R8\
  \ DMA` 控制器中，外设端口还可以连接到内存控制电路，允许内存到内存的传输。\n\n`STM32 DMA` 控制器还有一个连接到 `AHB` 总线的从端口。这允许从另一个主设备（即核心处理器）对\
  \ `DMA` 控制器进行编程。\n\n`STM32F302R8 DMA` 控制器具有七个独立的可编程的通道，每个通道连接到单独的硬件线路。这就是从设备外设请求\
  \ `DMA` 控制器响应的方式。请求的确性质和类型是在 MCU 硬件设计阶段配置的。不同的 `STM MCUs` 会根据 `MCU` 设计需求具有不同数量的通道以及不同的请求类型。\n\
  \n还有一个优先级分配硬件单元，允许为七个 `DMA` 请求通道分配不同的优先级。高优先级通常分配给需要立即 `DMA` 响应的快速外设以及任何内存访问。\n\n\
  图 11-4 显示了所有七个 `DMA` 通道以及在 MCU 设计阶段绑定到它们上的相应外设请求信号。\n\n![images](img/fig11-04.jpg)\n\
  \n**图 11-4** *DMA 通道框图。*\n\n图 11-4 是一个重要的图，因为当你尝试确定为特定的外设 `DMA` 请求使用哪个 `DMA` 通道时，它是你的准备参考。非常重要的是，在给定的外设请求线上，只能有一个外设处于激活状态。\n\
  \n注意在图 11-4，`DMA` 通道具有默认优先级，这些优先级在硬件中固化，通道 1 最高，一直到通道 7 最低。然而，这些默认优先级可以被用户指定的优先级覆盖，用于确定在访问\
  \ `AHB` 时哪些外设具有优先权。`DMA` 通道线通常通过所选外设的硬件信号触发，但也可以通过软件激活。软件触发是激活内存到内存传输的。\n\n## 使用\
  \ HAL 配合 DMA\n\n`HAL` 框架使用 C 结构体 `DMA_HandleTypeDef` 来配置 `DMA` 控制器。\n\n`HAL` 框架使用\
  \ C 结构体 `DMA_HandleTypeDef` 来配置 `DMA` 控制器。\n\n![Images](img/c0246-02.jpg)\n\n`DMA_HandleTypeDef`\
  \ 结构体成员有：\n\n* `DMA_Channel_TypeDef *Instance;`——指向 `DMA` 通道的指针。例如，`DMA1_Channel5`\
  \ 表示 DMA1 的第五通道。\n* `DMA_InitTypeDef Init;`——`DMA_InitTypeDef` 的实例。\n* `HAL_LockTypeDef\
  \ Lock;`——锁定对象。\n* `HAL_StateTypeDef State;`——DMA 状态。\n* `void *Parent;`——用于跟踪与当前\
  \ `DMA` 关联的外设句柄。例如，如果我们使用 `UART`，此字段将指向 `UART_HandleTypeDef` 实例。\n* `void (* XferCpltCallback)(struct\
  \ __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户 `DMA` 传输完成。当 `DMA` 中断发生时，由 `HAL_IRQHandler`\
  \ 函数自动调用。\n* `void (* XferHalfCpltCallback)(struct __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户\
  \ `DMA` 传输完成一半或发生错误。当 `DMA` 中断发生时，由 `HAL_IRQHandler` 函数自动调用。\n* `void (* XferErrorCallback)(struct\
  \ __DMA_HandleTypeDef *hdma);`——这是一个回调指针，用于通知用户 `DMA` 传输发生错误。当 `DMA` 中断发生时，由 `HAL_IRQHandler`\
  \ 函数自动调用。\n* `__IO uint32_t ErrorCode;`——DMA 错误代码。\n\n`HAL` 框架使用 C 结构体 `DMA_InitTypeDef`\
  \ 初始化 `DMA` 控制器。每个成员将在结构体定义后分别讨论。\n\n![Images](img/c0248-21.jpg)\n\n![Images](img/c0249-01.jpg)\n\
  \n`DMA_InitTypeDef` 结构体成员在下简要定义：\n\n* `uint32_t Direction;`——此值定义了 `DMA` 传输方向。此参数可以是以下定义中的任何值：\n\
  * `DMA_PERIPH_TO_MEMORY`\n* `DMA_MEMORY_TO_PERIPH`\n* `DMA_MEMORY_TO_MEMORY`\n\n\
  \n\n\n\n- `uint32_t PeriphInc;`—此值可以自动递增持有传输数据地址的外设寄存器。该参数可以是以下定义的两个值之一：\n    -\
  \ `DMA_PINC_ENABLE`\n    - `DMA_PINC_DISABLE`\n- `uint32_t MemInc;`—此值可以自动递增持有传输数据地址的内存端口寄存器。该参数可以是以下定义的两个值之一：\n\
  \    - `DMA_MINC_ENABLE`\n    - `DMA_MINC_DISABLE`\n- `uint32_t PeriphDataAlignment;`—此值设置要传输的外设数据元素的大小。该参数可以是以下定义中的任意值：\n\
  \    - `DMA_PDATAALIGN_BYTE`\n    - `DMA_PDATAALIGN_HALFWORD`\n    - `DMA_PDATAALIGN_WORD`\n\
  - `uint32_t MemDataAlignment;`—此值设置要传输内存数据元素的大小。该参数可以是以下定义中的任意值：\n    - `DMA_MDATAALIGN_BYTE`\n\
  \    - `DMA_MDATAALIGN_HALFWORD`\n    - `DMA_MDATAALIGN_WORD`\n- `uint32_t Mode;`—此值设置\
  \ DMA 模式。在普通模式下，DMA 控制器从源端口向目的端口发送指定数量的数据然后停止。必须重新加载控制器以进行下一次传输。在循环模式下，DMA 控制器发送源数据缓冲区的内容，重置到源数据缓冲区的第一个字节，并重新发送缓冲区。在传输间隙，外设将有机会重新填充源缓冲区，因此源缓冲区将会有数据。在这种情况下，源缓冲区也被称为环形缓冲区。由于显而易见的原因，DMA\
  \ 循环模式也称为连续模式。该参数可以是以下定义的两个值之一：\n    - `DMA_NORMAL`\n    - `DMA_CIRCULAR`\n- `uint32_t\
  \ Priority;`—使用此值为 DMA 通道分配优先级。该参数可以是以下定义中的任意值：\n    - `DMA_PRIORITY_LOW`\n    -\
  \ `DMA_PRIORITY_MEDIUM`\n    - `DMA_PRIORITY_HIGH`\n    - `DMA_PRIORITY_VERY_HIGH`\n\
  \n### 设置 DMA 传输的最后步骤\n\n为了在选定的通道上配置 DMA 传输，还需要几个步骤。步骤如下：\n\n1. 设置合适的内存和外设端口地址\n\
