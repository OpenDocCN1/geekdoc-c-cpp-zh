  ### 总结\n\n在本章开头解释了通用异步收发器（UART）和通用同步/异步收发器（USART）内部外设。该讨论还包含了数据传输协议的工作原理。\n\n接着讨论了如何配置\
  \ USART。配置过程使用了两个 C 结构体来配置和初始化 USART。我解释了两个 C 结构体中的所有元素。\n\n接下来，我展示了如何安装终端程序，该程序用于显示\
  \ USART 发出的字母数字数据。我选择了名为 Realterm 的开源终端程序。\n\n随后解释了如何使用 CubeMX 应用程序启用 USART2 外设。USART2\
  \ 选择在 CubeMX 树形面板视图中配置。我还详细介绍了如何使用 C 结构体配置设备的步骤。\n\n接着展示了一个演示程序，该程序显示了一个不断更新的数值变量。\n\
  \n最后一个演示显示了手动输入的终端数据，以及在输入触发短语时点亮 LED。\n\n## 9\n\n## 模拟量数字转换\n\n本章涵盖了模拟数字转换这一非常重要的主题。实际执行转换的设备称为模拟数字转换器（ADC）。STM\
  \ 系列 MCU 具有多种 ADC；然而，它们的工作方式和编程方式相似。项目板上的 STM32F302R8 MCU 使用了单个 ADC。但是，它可以接受来自 15\
  \ 条独立外部引线中任意 1 条的模拟输入。还有一个第 16 个 ADC 输入端，但它永久连接到内部温度传感器，不可用于任何其他用途。\n\n嵌入式开发的初学者有时会质疑是否需要\
  \ ADC 外设。答案是，现实世界的测量通常是使用模拟传感器进行的，这些传感器提供连续的电压范围，电压与所监测的环境参数成正比。例如，图 9-1 所示的 Analog\
  \ Devices TMP36 温度传感器提供了约 0.1 到 2.0 V 的电压范围，该范围与大约从 –40°C 到 150°C 的温度范围直接正比。这种模拟电压在被\
  \ MCU 处理之前必须转换为等效的数字。这就是 ADC 的作用。\n\n![images](img/fig09-01.jpg)\n\n**图 9-1**   *Analog\
  \ Devices TMP36 温度传感器。*\n\n接下来的讨论详细解释了 STM ADC 是如何工作的。\n\n### ADC 功能\n\nSTM ADC\
  \ 中使用的技术被称为逐次逼近寄存器（SAR）。SAR 的架构非常简单，如图 9-2 所示框图所示。\n\n![images](img/fig09-02.jpg)\n\
  \n**图 9-2**   *SAR ADC 框图。*\n\n模拟电压首先输入保持电路。该电路也称为采样保持电路，它获取模拟电压的瞬时采样，并将其采样值作为待转换数字。图\
  \ 9-2 所示的 N-BIT 寄存器块被设置为中间值。该值取决于转换的位数。为了本次讨论，我将仅使用 4 位进行转换，这足以解释转换过程。实际上，真实的 STM\
  \ ADC 是 12 位。回到寄存器意味着预设的中间值为 1000。因此，该值将强制图中所示数字模拟转换器（DAC）输出等于 `V[REF]/2` 的电压。`V[REF]`\
  \ 是 ADC 使用的参考电压，通常与电源或电源轨电压相同。对于大多数 MCU 来说就是 3.3 V。\n\n由采样保持（`V[IN]`）模块保持的采样电压与\
  \ DAC 输出（`V[DAC]`）之间的比较将通过 图 9-2 右上部分的比较器模块完成。如果 `V[IN]` 大于 `V[DAC]`，比较器将输出 1，否则输出\
  \ 0。如果输出 1，则 N-BIT 寄存器中的最高位将被保留，否则将被重置为 0。\n\nSAR 逻辑模块随后将向右移动一位并重复比较过程。该序列一直重复直到到达最低位（LSB）位置并处理。一旦完成该步骤，N-BIT\
  \ 寄存器将包含与采样模拟输入电压等效的数字。SAR 逻辑模块随后允许完全转换的数字值以并行或串行格式释放。\n\n图 9-3 显示了一个完整的 4 位转换序列。\n\
  \n![images](img/fig09-03.jpg)\n\n**图 9-3**   *四位转换序列。*\n\n\n\n\n纵轴代表 `V[DAC]` 电压，横轴代表时间。第一次转换的结果是将最高有效位（MSB）设置为\
  \ 0，因为 `V[IN]` 小于 `V[REF]/2`。随后，`SAR LOGIC` 模块会在下次比较之前将 `V[DAC]` 重置为 `V[REF]/4`。在这种情况下，`V[IN]`\
  \ 大于 `V[REF]/4`，MSB 右侧一位的位将被设置为 1。接下来，`SAR LOGIC` 模块将平分 `V[REF]/2` 和 `V[REF]/4`\
  \ 之间的差值，即 `3V[REF]/8`。这次比较会导致 `COMPARATOR` 模块输出 0。实际上，`SAR LOGIC` 模块在每次比较操作中都会以\
  \ `V[REF]/2⁴` 或 `V[REF]/16` 的倍数改变 `VDAC` 电压。这产生了收敛的阶梯状波形，如图 9-3 所示。根据上一个位比较的结果，将阶梯值的倍数加或减到\
  \ `V[DAC]` 上。在这种情况下，`N-BIT REGISTER` 保持的数字值为 0101，十进制格式为 5。如果将 `V[REF]` 等于 16，且\
  \ `V[REF]` 范围内的每个步长为 1，那么这一切都是合理的。此时图中的 `V[IN]` 线大约位于 5 的水平。\n\n我相信你可以看到 SAR 过程相当迅速地收敛到最终值。在这种情况下，它需要四次比较，而\
  \ 12 位 ADC 需要 12 次比较。好消息是，`SAR LOGIC` 模块的操作都在固件中完成，除了启动转换外不需要 MCU 指令。\n\n## 使用 HAL\
  \ 的 ADC 模块\n\nHAL 框架使用类似的 C 结构体来声明 ADC 外设，这在之前讨论 GPIO 引脚和定时器外设时已经提到过。为 ADC 定义了如下\
  \ C 结构体。将在结构体定义之后分别讨论每个结构体成员。\n\n![Images](img/c0192-01.jpg)\n![Images](img/c0193-01.jpg)\n\
  ![Images](img/c0193-02.jpg)\n![Images](img/c0194-01.jpg)\n\n`ADC_InitTypeDef` 结构体成员定义如下列表：\n\
  \n`uint32_t ClockPrescaler;`—这定义了 ADC 使用的 ADC 时钟频率 (`ADCCLK`)。该频率间接决定了 ADC 可实现的最大采样率。ADC\
  \ 分频器具有预设的分频倍率，从 1 开始按 2 的倍数递增，即 2、4、6 或 8。ADC 时钟频率影响所有 MCU ADC。此参数可以是以下 `ADC_ClockPrescaler`\
  \ 定义的任何值：\n\n![Images](img/c0194-04.jpg)\n\n`uint32_t Resolution;`—此值设置 ADC 分辨率。此参数可以是以下\
  \ `ADC_Resolution` 定义的任何值：\n\n![Images](img/c0194-06.jpg)\n\n分辨率与每秒可完成的最大转换次数之间存在确定的关系。这条规则是：*分辨率越高，最大转换率就越低*。\n\
  \n`uint32_t DataAlign;`—此值确定了 N 位寄存器中位的对齐方式。此参数可以是以下 `ADC_DATAALIGN` 定义的任何值：\n\n\
  ![Images](img/c0194-08.jpg)\n\n`uint32_t ScanConvMode;`—此值指定 ADC 模式。可以是单次或连续模式。此参数可以是以下\
  \ `ADC_SCAN` 定义的两个值：\n\n![Images](img/c0194-10.jpg)\n\n`uint32_t EOCSelection;`—此值设置指示转换结束\
  \ (EOC) 的标志类型。标志类型的值还取决于 ADC 模式（可能是单次或连续模式）。此参数可以设置为以下 `ADC_EOC` 定义的任一：\n\n![Images](img/c0195-02.jpg)\n\
  \n`uint32_t ContinuousConvMode`—指定在选定触发发生（软件启动或外部触发）后，转换是在单次模式（一次转换）还是连续模式（针对常规组）执行。此参数可以设置为\
  \ `ENABLE` 或 `DISABLE`。\n\n`uint32_t NbrOfConversion;`—此值指定常规组序列器内将转换的秩（ranks）或通道数。要使用常规组序列器并转换多个秩，必须启用\
  \ `ScanConvMode` 参数。此参数必须是 `Min_Data = 1` 到 `Max_Data = 16` 之间的数字。\n\n`uint32_t\
  \ DiscontinuousConvMode;`—此值指定常规组的转换序列是在完整序列/不连续序列（主序列划分为连续部分）中执行。仅在启用序列器（参数 `ScanConvMode`）时才使用不连续模式。如果禁用序列器，则丢弃此参数。只有在禁用连续模式的情况下才能启用不连续模式。如果启用连续模式，此参数设置将被忽略。此参数可以设置为\
  \ `ENABLE` 或 `DISABLE`。\n\n`uint32_t NbrOfDiscConversion;`—此值指定常规组主序列（参数 `NbrOfConversion`）划分的不连续转换次数。如果禁用\
  \ `DiscontinuousConvMode` 参数，则丢弃此参数。此参数必须是 `Min_Data = 1` 到 `Max_Data = 8` 之间的数字。\n\
  \n`uint32_t ExternalTrigConv;`—此值选择用于触发常规组启动的外部事件。如果设置为 `SOFTWARE_START`，则禁用外部触发。如果设置为外部触发，默认在上升沿触发。此参数可以是符合\
  \ `ADC_External_trigger_Source` 格式的值：\n\n![Images](img/c196-01.jpg)\n\n`uint32_t\
  \ ExternalTrigEdge;`—此值选择常规组的外部触发沿。如果设置为 `SOFTWARE_START`，则丢弃此参数。此参数可以是符合 `ADC_External_edge_Regular`\
  \ 格式的以下之一：\n\n![Images](img/c196-03.jpg)\n\n`uint32_t DMAContinuousRequests;`—此值指定\
  \ DMA 请求是在单次模式中（达到转换次数时停止 DMA 传输）还是连续模式中（DMA 传输无限制，无论转换次数多少）。注意：在连续模式下，DMA 必须配置为循环模式。否则，当到达\
  \ DMA 缓冲区最大指针时触发溢出。在常规组和注入组均未进行转换时必须修改此参数（禁用 ADC，或启用 ADC 但未开启连续模式或外部触发可能会启动转换）。此参数可以设置为\
  \ `ENABLE` 或 `DISABLE`。\n\n\n\n\n该模式的一个非常出色的特性是，每个通道都是独立的，并且可以配置为不同的采样率、触发源和其他自定义项。此功能通过使用一个\
  \ `ranks` 对象来实现。通过使用 `ranks`，`MCU` 无需为每个通道的自定义配置而停止并重新配置通道。这种模式只进行一次扫描，结果数字通常通过直接存储器访问（`DMA`）直接存储在内存中。\n\
  \n### 单通道/连续转换\n\n在此模式下，单个通道被连续地采样，产生的数字结果被连续地存储在内存中。这种模式几乎总是使用 `DMA` 来减轻 `MCU`\
  \ 的过载负载。该模式通常用于传感器或其他环境设备的实时监控。\n\n### 多通道扫描/连续转换\n\n在此模式下，多个通道被连续地采样，产生的数字结果被存储在内存中。这种模式要求使用\
  \ `DMA` 来减轻 `MCU` 无法承受的计算负载。该模式通常用于传感器或其他环境设备的全面实时监控。\n\n### 通道、组与秩 (Channels, Groups,\
  \ and Ranks)\n\n可转换的通道数量取决于所使用的特定 `STM MCU`。在 Nucleo 项目板上使用的 `STM32F302R8 MCU`，该数量设置为\
  \ 16。通道转换序列可以建立在名为 `groups`（组）的独立集合中。通道可以在特定组内以任意顺序排列。\n\n输入通道是基于硬件的，因此是固定的并与特定的\
  \ `MCU` 引脚相关，例如，`IN0` 是第一个通道，`IN1` 是第二个，以此此类推。然而，它们可以在逻辑上重新排序，以形成组内的自定义采样序列。通道的重排序通过将输入通道分配到从\
  \ 1 到 16 的索引来实现。该索引在 `HAL` 中被称为 `rank`（秩）。\n\n图 9-6 显示了这一概念。虽然图中 `IN3` 通道是固定的（例如，它连接到\
  \ `STM32F302R8 MCU` 的 `PA3` 引脚），但它可以被分配给 `rank 1` 以成为第一个采样的通道。\n\n![images](img/fig09-06.jpg)\n\
  \n图 9-6 显示通道和秩的 ADC 图形。\n\n接下来的 C 结构体用于 `ADC_ChannelConfTypeDef`。每个结构体成员将在结构体定义之后逐一讨论。\n\
  \n![Images](img/c0199-02.jpg)\n\n`ADC_ChannelConfTypeDef` 结构体成员定义在如下列表中：\n\n`uint32_t\
  \ Channel;`—此值指定配置到 ADC 正规组的通道。此参数可以是以下 `ADC_CHANNEL` 定义的任何值：\n\n![Images](img/c0199-05.jpg)\n\
  \n`uint32_t Rank;`—此值指定正规组序列器中的 `rank`。此参数必须是 `Min_Data = 1` 和 `Max_Data = 16` 之间的数字：此参数可以是以下\
  \ `ADC_REGULAR_RANK` 定义的任何值：\n\n![Images](img/c0200-01.jpg)\n\n`uint32_t SamplingTime;`—为所选通道设置的采样时间，单位为\
  \ ADC 时钟周期。总转换时间是采样时间与处理时间之和（在 ADC 12 位分率率下为 12 个 ADC 时钟周期，10 位时为 11 个周期，8 位时为 9\
  \ 个周期，6 位时为 7 个周期）。此参数可以是以下 `ADC_SAMPLETIME` 定义的任何值：\n\n![Images](img/c0200-03.jpg)\n\
  \n注意：此参数更新通道的参数属性，该属性可以用于正规组和/或注入组。如果该通道之前在其他组（正规/注入）中配置过，它将更新更新为最后一个设置。在使用内部测量通道（`VrefInt/Vbat/TempSensor`）的情况下，必须遵守采样时间限制（采样时间可以根据\
  \ ADC 时钟频率和采样时间设置进行调整）。\n\n`uint32_t Offset;`—留作后用，可以设置为 0。\n\n## ADC 演示\n\n`ADC`\
  \ 与许多 `STM peripherals` 一样，可以使用三种方法之一进行控制：\n\n- 轮询 (Polling)\n- 中断 (Interrupt)\n\
  - DMA\n\n第一个演示将使用轮询作为控制方法，因为是最简单的，并且可以让重点主要放在 ADC 过程上。\n\n初始步骤是创建一个 `ADC_HandleTypeDef`\
  \ 结构体的引用，然后为结构体成员分配适当的值，用以定义要实现的 ADC 实例。此新实例接下来将使用 `ADC_InitTypeDef` 结构体进行配置，它需要指向已定义的\
  \ `ADC_HandleTypeDef` 结构体的引用。一旦定义了所有的 `ADC_InitTypeDef` 结构体成员，就可以进行初始化并启动 ADC 了。初始化和启动命令通过这些调用完成：\n\
  \n![Images](img/c0201-06.jpg)\n\n`ADC` 然后将如果选择了单通道模式则执行一次转换，或者如果选择了连续模式，则继续进行流式转换。在单通道模式的情况下，必须先调用\
  \ `HAL_ADC_Stop()` 方法停止 ADC 线程，然后再次调用 `HAL_ADC_Start()` 方法进行另一次转换。\n\n任何需要访问转换数据的应用程序在轮轮询时必须使用以下方法来判断\
  \ ADC 转换何时完成以及数据可用：\n\n![Images](img/c0201-09.jpg)\n\n参数方法是指 `ADC_HandleTypeDef`\
  \ 的指针和一个表示等待 ADC 数据可用的毫秒数的整数 `Timeout`。\n\n![Images](img/c0201-11.jpg)\n\n现在是讨论\
  \ TMP36 温度传感器，它是我们在章节开始介绍的。该传感器将作为 ADC 演示的电压源。\n\n### Analog Devices TMP36 温度传感器\n\
  \n该传感器的图像如图 9-1 所示。它采用三个引脚的普通 TO-92 外壳。然而，它内部组件允许输出与周围温度成正比的直流电压。该传感器非常廉价，可以在许多在线渠道获得。传感器规格如下：\n\
  \n- 尺寸：TO-92 封装（约 0.2″ × 0.2″ × 0.2″），带有三个引脚\n- 温度范围：–40°C 到 150°C/–40°F 到 302°F\n\
  - 输出范围：0.1V（–40°C）到 2.0V（150°C）（125°C 后精度下降）\n- 电源：仅 2.7 V 至 5.5 V，典型电流消耗为 0.05mA\n\
  \n图 9-7 显示了每个引脚应该连接到哪里。\n\n![images](img/fig09-07.jpg)\n\n图 9-7 TMP36 引脚连接。\n\n\
  引脚应连接到 Arduino 原型板，如表 9-1 所示。\n\n可以使用以下公式很容易计算温度：\n\n°C = [(Vout in mV) – 500] /10\n\
  \n相应的 °F 温度也可以通过此公式轻松计算：\n\n°F = (9 * °C/5) + 32\n\n现在是讨论 `main.c` 文件了，因为所有的准备项目都已介绍并解释。\n\
  \n### 启用 ADC1\n\n现在我需要启用 `ADC1` 备用功能以获得模拟数字转换功能。在创建新项目时配置 `ADC1`，会显示引脚窗口。图 9-8 显示了如何从\
  \ `ADC1 IN1` 下拉菜单中选择 `IN1 Single-ended` 来启用 `ADC1` 外设。\n\n![images](img/fig09-08.jpg)\n\
  \n图 9-8 在 ADC1 中启用 IN1 通道。\n\n\n\n\n\n当启用 `ADC1` 功能时，CubeMX 应用将自动在 `main.c` 文件中插入一个初始化方法\
  \ `static void MX_ADC1_Init(void)`。\n\n将根据你在 `ADC1` IP 树视图中设置的参数，自动为你设置合适的 `ADC`\
  \ 参数，如下代码所示：\n\n![Images](img/c0204-02.jpg)\n\n### 将 ADC1 连接到 TMP36 传感器\n\n图 9-9\
  \ 显示了如何使用免焊接面包板、跳线和 `Arduino` 原型板将 `TMP36` 温度传感器连接到 `ADC1` 内部外设。\n\n![images](img/fig09-09.jpg)\n\
  \n**图 9-9** `TMP36` 传感器与 `Arduino` 原型板之间的相互连接。\n\n`TMP36` 的引脚连接已在表 9-1 中详细介绍过。你需要三根跳线来将传感器连接到\
  \ `Arduino` 原型板。\n\n![images](img/tab09-01.jpg)\n\n**表 9-1** TMP36 引脚连接\n\n此时，已经介绍了演示实际\
  \ `ADC` 程序所需的所有先决条件。\n\n### ADC 演示软件\n\n以下程序基于上一节所示的 `USART` 程序。采取这一步是因为处理后的 `ADC`\
  \ 输出需要在终端窗口中显示。`main.c` 文件现在有一个新方法，用于配置和初始化 `ADC1` 内部外设。\n\n还有一段在 `while` 循环中运行的新功能代码。该代码在以下片段所示，列表后附有详细说明：\n\
  \n![Images](img/c0206-01.jpg)\n\n代码片段中的所有语句将在下文中进行讨论：\n\n- `HAL_ADC_Start(&hadc1);`—启动\
  \ `ADC1` 内部外设。\n- `HAL_ADC_PollForConversion(&hadc1, 100);`—等待转换结束 (`EOC`) 信号后再执行下一条指令。`100`\
  \ 值是等待 `EOC` 信号的最大时间（毫秒）。这是一条阻塞类型的指令。\n- `raw = (double) HAL_ADC_GetValue(&hadc1);`—将值从\
  \ `adc` 输出寄存器传输到 `raw` 变量。这是一个 12 位值，最大值为 `4095`，约等于 `5 V`。该值也被强制转换为 `double` 格式。\n\
  - `raw = raw * 0.452;`—从原始计数转换为绝对 `mV` 输出。缩放因子 `0.452` 是通过精密电压测量确定的。\n- `value =\
  \ (raw - 500.0)/10;`—使用 `TMP36` 方程将原始 `mV` 值转换为 `°C` 温度。\n- `value = (9*value)/5\
  \ + 32;`—将 `°C` 转换为 `°F` 的经典方程。\n- `sprintf(msg, \"%f\\r\\n\", value);`—将双精度变量 `value`\
  \ 转换为字符串，并在值后拼接回车符和换行符。\n- `HAL_UART_Transmit(&huart2, (uint8_t*) msg, 20, 100);`—执行从\
  \ `MCU` 到终端程序的实际数据传输。\n- `HAL_Delay(1000);`—在采样之间插入一秒的延迟。\n\n完整的 `main.c` 程序列在下方：\n\
