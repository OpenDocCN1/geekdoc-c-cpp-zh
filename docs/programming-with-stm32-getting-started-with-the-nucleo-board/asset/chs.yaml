  \ 秒的频率闪烁 4 秒，这证实了修改后的程序运行与原始程序相同。我注意到与原始版本相比，这个版本的 LED 闪烁似乎更频繁。我只能将闪烁归于使用了 `toggle`\
  \ 方法而不是固定的设置（set）和重置（reset）方法。\n\n最后一个演示完成了我希望传达的中断和定时器的所有讨论和演示。这一章真的只是冰山一角，因为关于这些主题有海量的信息是我无法涵盖的。仅\
  \ STM 的 HAL 用户手册就有近 2000 页。一如既往，STM 的数据表、用户手册和参考手册将是学习通过中断和定时器执行许多额外特性和功能的宝贵资源。\n\
  \n### 总结\n\n我从关注定时器开始章节讨论，定时器是重要的外设，因为它们减轻了 MCU 不需要直接执行定时函数的负担。我解释了 STM 定器的五类可用类型，其中项目\
  \ MCU 提供了三种类型。这些是：基础型、通用型（GP）和高级型。\n\n接下来，我向你们展示了如何配置定时器来执行特定的定时事件。该讨论之后是一个演示，其中板载\
  \ LED 每秒闪烁一次。这个演示没有使用中断，而那是第二个定时器演示的重点。\n\n在第二个定时器演示中，我展示了将定时操作集成到中断过程中是多么容易。在这个演示中，板载\
  \ LED 也闪烁了，但它是通过中断过程进行闪烁的。\n\n第三个定时器演示展示了如何重构中断过程，以实现多速率 LED 闪烁。中断回调方法控制一个计数器变量，该变量反过来控制死循环中\
  \ LED 的实际激活。\n\n在最后一个定时器演示中，我将原始的死循环代码更改为功能相同但更紧凑、复杂的版本。这样做是为了说明开发者必须不断决定如何编写代码：是更简单但消耗更多代码空间，还是非常紧凑且复杂（更难理解）。\n\
  \n## 8\n\n## 比特串行通信\n\n本章涵盖了 MCU 如何使用比特串行通信在外部设备和系统之间双向传输数据。用于此功能的主要外设设备是通用异步收发传输器（UART）和通用同步/异步收发传输器（USART）。这些外设之间的主要区别是\
  \ USART 可以使用节点之间的同步时钟脉冲串，而 UART 是完全自同步的。这些差异将在接下来的章节“UART 和 USART”中进行更详细的解释。\n\n\
  ### UART 和 USART\n\n图 8-1 是显示两个连接的 UART 的框图，其中节点 A 向节点 B 发送数据。\n\n![images](img/fig08-01.jpg)\n\
  \n图 8-1 UART 框图。\n\n节点之间的数字脉冲串由一个起始位、八个数据位和一个停止位组成。这些位合在一起被视为一个帧。你应该注意，起始位和停止位的持续时间比数据位长\
  \ 50%。这种脉冲持续时间的差异是 UART 区分起始/停止位与数据位的方式。接收节点必须检测起始位以确定帧何时开始。接收节点还被配置为接受指定数量的数据位，以及是否有一个或两个停止位。UART\
  \ 可以设置为发送七位或八位数据位，以及一个或两个停止位。此外还提供了发送额外校验位的规定，这有助于检测传输错误。通常不使用校验位，特别是在传输通道不嘈杂或不存在传输线延迟的情况下。\n\
  \nUSART 是 UART 的变体，因为在节点之间可以使用额外的时钟线，如图 8-2 所示。\n\n![images](img/fig08-02.jpg)\n\
  \n图 8-2 USART 框图。\n\n当两个 USART 节点互连时，不需要使用起始和停止位，如图 8-2 是使用 UART 和 USART 节点的全工通信设置框图。\n\
  \n![images](img/fig08-03.jpg)\n\n图 8-3 全工通信框图。\n\n全工通信意味着节点之间可以同时发送和接收数据。这是严格可能的，因为每个节点的\
  \ UART 或 USART 都由其自己的 MCU 控制。\n\n通常，评估给定节点是否能够积极参与链路是非常重要的。可能会出现接收节点的 MCU 由于某些原因被临时阻塞，此时远程节点的\
  \ UART 可以发送数据，但接收节点可能无法处理。因此，UART 和 USART 硬件中提供了协议控制线，以确保在允许时发送和接收数据。两个主要的控制线是请求发送（RTS）和清除发送（CTS）。想要传输数据的节点首先置高或设置\
  \ RTS 线。接收节点随后置高或设置 CTS 线表示可以发送数据。这一过程也被称为请求/确认，常用于全工通信链路。然而，这种协议对于书中的项目并不需要，因为项目板\
  \ MCU 永远不会被阻塞，而接收节点通常是 PC，PC 也永远不会被阻塞。\n\n\n\n\n\n项目板使用的 STM32F302R8 MCU 中有两个 USART。它们在逻辑上分别被称为\
  \ `USART1` 和 `USART2`。它们是 MCU 除通过 `GPIO` 端口处理数据位或使用其他通信协议（如 `I2C` 和 `SPI` 位串行接口）之外，发送和接收数据的主要手段。后两者主要用于传感器数据，尽管有一个非常出色的\
  \ `I2C` 外设可以显示文本消息。在本章稍后的部分，我将讨论如何设置 `USART2` USART 以与 PC 终端程序通信。然而，我现在需要讨论如何初始配置\
  \ USART。\n\n注意：初始化和配置 UART 与 USART 的软件是相同的。不要担心讨论的是 USART，但函数或类型定义（typedef）的名称中带有\
  \ `UART` 字样。\n\n## USART 配置\n\nSTM32 USART 的配置方式与我之前讨论过的 GPIO 引脚、中断和定时器类似。STM32\
  \ USART 使用一个名为 `UART_HandleTypeDef` 的 C 结构体进行初始化。它通过使用一个名为 `UART_InitTypeDef` 的\
  \ C 结构体进行配置的。我将首先讨论 `UART_HandleTypeDef`，它包含以下成员：\n\n![Images](img/c0170-04.jpg)\n\
  \n以下讨论了该结构体的一些较重要的成员：\n\n*   `Instance`: 这是指向 USART 描述符的指针。例如，`USART2` 是与 ST-LINK\
  \ 接口关联的 `UART` 描述符。\n*   `Init`: 这是 C 结构体 `UART_InitTypeDef` 的实例，用于配置 `UART` 接口。\n\
  *   `AdvancedInit`: 用于配置更高级 UART 特性，如自动 `BaudRate` 检测和 TX/RX 引脚交换。\n*   `pTxBuffPtr`:\
  \ 指向发送缓冲区，用作传输字节的数据源。\n*   `TxXferCount`: 存储传输字节计数。\n*   `pRxBuffPtr`: 指向接收缓冲区，传入的字节存储在此。\n\
  *   `RxXferCount`: 存储接收字节计数。\n*   `Lock`: 该字段由 `HAL` 内部用于用于锁定对 UART 接口的并发访问。\n\n\
  C 结构体 `UART_InitTypeDef` 包含以下成员：\n\n![Images](img/c0171-02.jpg)\n\n这些结构体成员代表以下 USART\
  \ 参数和设置：\n\n`Baudrate`: 该参数是每秒位数的连接速率。表 8-1 显示了 STM USART 外设可用支持的标准和非标准波特率表。\n\n\
  ![images](img/tab08-01.jpg)\n\n**表 8-1 波特率表**\n\n*   `WordLength`: 此值指定在帧中传输或接收的数据位数。该字段可以取以下定义之一：\n\
  \    *   `UART_WORDLENGTH_8B`\n    *   `UART_WORDLENGTH_9B`\n*   `StopBits`: 该字段指定传输的停止位数量。该字段可以取以下定义之一：\n\
  \    *   `UART_STOPBITS_1`\n    *   `UART_STOPBITS_2`\n*   `Parity`: 此值表示奇偶校验模式。该字段可以取以下定义之一：\n\
  \    *   `UART_PARITY_NONE`\n    *   `UART_PARITY_EVEN`\n    *   `UART_PARITY_ODD`\n\
  *   `Mode`: 此值指定启用或禁用 RX 和/或 TX 模式。该字段可以取以下定义之一：\n    *   `UART_MODE_RX`\n    *\
  \   `UART_MODE_TX`\n    *   `UART_MODE_TX_RX`\n*   `HwFlowCtl`: 此值指定启用或禁用 RS2326\
  \ 硬件流控模式。该字段可以取以下定义之一：\n    *   `UART_HWCONTROL_NONE`\n    *   `UART_HWCONTROL_RTS`\n\
  \    *   `UART_HWCONTROL_CTS`\n    *   `UART_HWCONTROL_RTS_CTS`\n*   `OverSampling`:\
  \ 此值有助于区分噪声与真实的信号电平。所选的过采样率是噪声免疫能力与最大可能通信速度之间的权衡。该字段可以取以下定义之一：\n    *   `UART_OVERSAMPLING_8`\n\
  \    *   `UART_OVERSAMPLING_16`\n\n上述讨论详细说明了如何初始化和配置 USART，但我仍然需要解释如何建立项目板与远程节点（即连接到板的\
  \ PC）之间的通信链路。\n\n## Windows 终端程序\n\n你需要安装一个终端程序来显示从演示板传输的文本消息。有很多免费且可以方便下载的终端程序。我选择了一个名为\
  \ `Realterm` 的程序，它可以在 [`sourceforge.net/projects/realterm/`](https://sourceforge.net/projects/realterm/)\
  \ 获取。它是一个功能全终端程序，我发现它非常容易配置和运行。图 8-4 显示了我点击后的 `Realterm` 屏幕。\n\n![images](img/tab08-01.jpg)\n\
  \n**表 8-4 Realterm 屏幕**\n\n*   `Baudrate`: 9600\n*   `Parity`: None\n*   `Data Bits`:\
  \ 8\n*   `Stop Bits`: 1\n*   `Hardware Flow Control`: None\n*   `Port`: 6\n\n上述讨论是为了显示如何配置终端。\n\
  \n## 启用 USART2\n\n在此程序之前，我还没有需要使用 CubeMX 中的 IP 树来配置外设。那是因为我只使用了 GPIO 引脚而不是复用功能。然而，现在需要启用\
  \ USART2 复用功能以使通信链路工作。在创建新项目时你会配置 `USART2`，此时会显示引脚窗口。图 8-7 显示了如何通过 `Mode` 下拉菜单选择\
  \ `Asynchronous` 来配置 `USART2`。\n\n![images](img/tab08-01.jpg)\n\n**图 8-7 配置 USART2**\n\
  \n当启用 `USART2` 功能时，CubeMX 应用会在 `main.c` 文件中插入一个初始化方法 `static void MX_USART2_UART_Init(void)`。\n\
  \n你需要在该方法中设置相应的通信参数，如下所示：\n\n```c\nstatic void MX_USART2_UART_Init(void)\n{\n  huart2.Instance\
  \ = USART2;\n  huart2.Init.BaudRate = 9600;\n  huart2.Init.WordLength = UART_WORDLENGTH_8B;\n\
  \  huart2.Init.Parity = UART_PARITY_NONE;\n  huart2.Init.StopBits = UART_STOPBITS_1;\n\
  \  huart2.Init.Mode = UART_MODE_TX_RX;\n  huart2.Init.HwFlowCtl = UART_HWCONTROL_NONE;\n\
  \  HAL_UART_Init(&huart2);\n}\n```\n\n## USART 传输演示程序\n\n以下程序将在终端窗口中显示一个不断变化的值。此演示的目的是展示\
  \ USART 如何向终端程序传输数据。 \n\n```c\nwhile (1)\n{\n  HAL_UART_Transmit(&huart2, (uint8_t\
  \ *)\"Hello World\\r\\n\", 13, HAL_MAX_DELAY);\n  HAL_Delay(500);\n}\n```\n\n\n\n\
  \n\n`sprintf` 语句导致双精度变量 `value` 被转换为字符串，并在该值后拼接回车符和换行符。下一条语句 `HAL_UART_Transmit(&huart2,\
  \ (uint8_t*) msg, 10, 100);` 执行了数据从 MCU 到终端程序的实际传输。四个参数如下：\n\n![Images](img/c0181-04.jpg)\n\
  \n下一条语句 `HAL_Delay(200);` 在显示数值字符串之间引入了短时间延迟。最后一条语句略微改变了 `value` 变量以帮助显示。\n\n###\
  \ 测试运行\n\n随后，程序被编译并下载到项目板中。然后我启动了 Realterm 终端程序来显示来自开发板的通信流。图 8-8 显示了 UART 发送程序的终端输出。\n\
