  **图 11-5：Realterm 显示。**\n\n这绝对证实了 `USART2` 外设通过 DMA 向内存传输了数据。这个演示应该让你相信 DMA 的用途。现在是介绍\
  \ DAC 外设并真正演示 DMA 如何显著改进 MCU 操作。\n\n## DAC 外设\n\n我将首先解释 DAC 外设的原理，以便你理解它为什么需要快速数据传输。\n\
  \n### DAC 原理\n\nMCU 中使用的 DAC 设计基于 R-2R 电阻分压网络。该概念通过参考图 11-6 很容易解释。\n![images](img/fig11-06.jpg)\n\
  **图 11-6：R2R 设计概念。**\n\n电阻网络充当参考电压和地之间的可变分压器。STM DAC 的参考电压 `V[ref]` 是主 3.3V 电源。图\
  \ 11-6 显示了一个 3 位 DAC，这使其很容易讨论。\n\n图 11-6 所示位输入在 0 V 和 `V[ref]` 或 3.3 V 之间切换。如果某位为高电，则其电压输入将根据其位值加权到和输出电压中。\n\
  \n\n\n\n\n出现这一结果是因为步长为 `3.3/8` 或 `0.4125`。这是一个相当大的误差，仅由于涉及的位数较少才在这种情况下发生。对于真实的 12\
  \ 位 STM DAC，步长将仅为 `3.3/4096` 或 `0.00080566 V`，大约为 `0.8 mV`。该步长将为数字提供极佳的模拟电压表示。回到数字示例，我计算了所有可能的二进制组合的所有八个模拟电压输出。这些如表\
  \ 11-1 所示。\n\n![images](img/tab11-01.jpg)\n\n**表 11-1** 二进制输入与模拟电压输出——3 位 DAC 示例\n\
  \n图 11-7 从更详细的方面展示了模拟电压输出，可以明显看出，由于位数限制，二进制输入值之间没有平滑过渡。\n\n![images](img/fig11-07.jpg)\n\
  \n**图 11-7** 显示模拟电压输出的柱状图。\n\n表 11-1 和图 11-7 充分证明了必须具有足够的位数，才能使 DAC 输出较为平滑且连续的电压。然而，即使在位数较高的情况下，由于\
  \ DAC 内部不断发生的固有切换，仍然会有少量的噪声。这种噪声可以使用有源低通模拟滤波器轻松滤除掉。不过，我将证明 DAC 输出非常干净，可以直接使用而无需额外的滤波。\n\
  \nSTM DAC 还具有切换缓冲器输出放大器的选项。该设备将降低 DAC 的输出阻抗，并提供额外的驱动电流，而无需为此目的添加外部输出运算放大器。\n\n现在是时候讨论用于配置和初始化\
  \ STM DAC 外设的 HAL 软件了。\n\n### 用于 DAC 的 HAL 软件\n\nHAL 框架使用名为 `DAC_HandleTypeDef`\
  \ 的 C 结构体来配置 DAC 外设。每个成员将在结构体定义之后分别进行讨论。\n\n![_Images](img/c0261-01.jpg)\n\n`DAC_HandleTypeDef`\
  \ 结构体成员在以下列表中简要定义：\n\n- `DAC_TypeDef *Instance;`—这是指向将使用的 DAC 描述符的指针。例如，`DAC1` 是第一个\
  \ DAC 外设的描述符。\n- `__IO HAL_DAC_StateTypeDef State;`—该值代表 DAC 通信状态。\n- `HAL_LockTypeDef\
  \ Lock;`—该值是一个 DAC 锁对象。\n- `DMA_HandleTypeDef *DMA_Handle1;`—这是指向 DMA 程序的指针，用于在\
  \ DMA 模式下执行数字模拟转换。\n- `DMA_HandleTypeDef *DMA_Handle2;`—这是指向另一个 DMA 处理程序的指针，用于在\
  \ DMA 模式下执行数字模拟转换。\n- `__IO uint32_t ErrorCode;`—这是一个代表 DAC 错误代码的值。\n\n`DAC_HandleTypeDef`\
  \ 结构体与所有其他相似结构体的不同在于它没有 `Init` 成员，而是依赖于不同类型的 C 结构体在通道级上初始化 DAC。该 C 结构体名为 `DAC_ChannelConfTypeDef`，具有以下定义。与之前一样，每个成员将在结构体定义之后分别进行讨论。\n\
  \n![_Images](img/c0262-09.jpg)\n\n`DAC_ChannelConfTypeDef` 结构体成员在以下列表中简要定义：\n\n\
  - `uint32_t DAC_Trigger;`—该值指定用于触发 DAC 转换的源。此参数可以是以下定义中的任何值：\n- `DAC_TRIGGER_NONE`—用于手动触发。\n\
  - `DAC_TRIGGER_SOFTWARE`—当 DAC 处于无定时器的 DMA 模式时。\n- `DAC_TRIGGER_Tx_TRGO`—当 DAC 由专用定时器驱动时。\n\
  - `uint32_t DAC_OutputBuffer;`—指定 DAC 通道输出缓冲区是否启用或禁用。\n\n## 演示二\n\n在本次演示中，我将手动触发\
