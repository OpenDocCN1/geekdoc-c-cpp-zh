  \ Nucleo 板。在新 hex 文件下载到目标设备后，我立即观察到用户 LED 以 `2 s` 开启和 `2 s` 关闭的频率闪烁。\n\n## main.c\
  \ 文件的复杂修改\n\n下一个演示比上一个稍微复杂，因为我想向你展示如何以不同的开启和关闭时间闪烁 LED。我将继续使用用户 LED `LD2` 作为光源，但修改\
  \ `main.c` 文件以包含两个不同的时间间隔。\n\n我选择使用几个 `define` 语句为 LED 创建不同的开启和关闭时长。`main` 函数还使用了\
  \ `if/else` 语句，根据名为 `sw` 的 `Boolean` 变量的真值导致开启和关闭间隔切换。以下是 `main.c` 修改部分的代码片段：\n\n\
