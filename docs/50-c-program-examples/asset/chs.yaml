  \n```cpp\n#include <iostream>\n#include <vector>\n\nclass MyIterator {\n```\n\n\n\
  \n\n\n```cpp\nprivate:\n    int index;\n    std::vector<int>& data;\n\npublic:\n\
  \    MyIterator(std::vector<int>& arr) : index(0), data(arr) {}\n\n    bool hasNext()\
  \ {\n        return index < data.size();\n    }\n\n    int next() {\n        return\
  \ data[index++];\n    }\n};\n\nint main() {\n    std::vector<int> numbers = {1,\
  \ 2, 3, 4, 5};\n    MyIterator iterator(numbers);\n    while (iterator.hasNext())\
  \ {\n        std::cout << iterator.next() << \" \";\n    }\n    std::cout << std::endl;\n\
  \    return 0;\n}\n```\n\n感谢\n\n"
