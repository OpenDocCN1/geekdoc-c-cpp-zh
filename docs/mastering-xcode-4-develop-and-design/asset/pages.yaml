- pgno: 95
  md: '# NAVIGATING **SOURCE CODE**


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_95_0.png)


    **FIGURE 7.2** The Jump Bar showing the symbols belonging to the selected file


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_95_1.png)


    **FIGURE 7.3** Symbols made hyperlinks by holding down the Command key


    The Source Editor provides several ways to navigate your code. These include moving
    to symbols, showing only the code you want to work with, and splitting the editor
    to view multiple parts of the file at once.


    # THE JUMP BAR


    One of the most common ways to move between symbols in your source is to use the
    Jump Bar discussed in Chapter 3 (**Figure 7.2**). When a source file with defined
    symbols is open, the last segment of the Jump Bar shows another level beneath
    the file itself—a list of the symbols within the source. The segment shows the
    symbol in which the insertion point of the editor resides. Choosing a different
    symbol takes you to its location in the source.


    # JUMP TO DEFINITION


    Another common navigation action is to jump to the definition of a symbol. The
    Source Editor makes this simple by turning symbols into hyperlinks while holding
    down the Command key (**Figure 7.3**). Clicking a symbol while holding the Command
    key jumps to its definition (which is not necessarily within the currently selected
    file). Recall the similar action for obtaining inline help—Option-clicking a symbol
    brings up the inline Quick Help pop-up.'
  merge: -1
