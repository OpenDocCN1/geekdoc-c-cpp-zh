- pgno: 401
  md: '# APPENDIXES'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# Appendix A


    MANAGING YOUR

    iOS DEVICES'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'If you’re developing for iOS, sooner or later you’ll want to test your apps
    on physical devices to make sure they work properly before submitting them to
    the App Store. To do this, you must *provision* your devices for use in development.
    Provisioning requires a current iOS Developer account and enables you to install
    and debug your own applications as well as access the device’s console logs, screenshots,
    and more. In this appendix, you’ll learn how to link Xcode to your developer portal,
    provision your devices for development, and generally manage the device.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_403_0.png)'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# USING THE ORGANIZER''S DEVICES TAB


    FIGURE A.1 The Organizer''s Devices tab


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_404_0.png)


    The Organizer''s Devices section (Figure A.1) lets you manage the iOS devices
    you use for development as well as your provisioning profiles, software images,
    application data, console logs, and screenshots. In this section of the Organizer,
    you can automatically provision devices for development, letting you run and test
    applications on the device rather than only in the Simulator. To open the Organizer,
    choose Window > Organizer from the main menu, and then click the Devices tab in
    the Organizer toolbar.


    Figure A.1 shows a single device—my iPhone—as well as the developer and provisioning
    profiles pulled from an active iOS Developer account. The green indicator next
    to "Josh''s Phone" shows that the device is provisioned and ready for use in development.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# PROVISIONING A DEVICE


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_405_0.png)


    FIGURE A.2 A device in the Devices tab of the Organizer


    In order to run and test your applications on an actual iOS device (as opposed
    to the Simulator), you’ll need to provision your device for development. Provisioning
    involves obtaining the proper certificates from your Apple Developer account through
    their Provisioning Portal site and installing them onto your devices. This is
    necessary for a device to allow applications that didn’t come from the App Store
    to be installed on the device. If you have a current Apple iOS Developer Program
    membership, provisioning can be simple in Xcode 4.


    Most developers will need only to open the Devices tab of the Organizer and plug
    in the device. When the device appears in the list, select it and then click the
    Use for Development button (Figure A.2).'
  merge: -1
  img_proc: true
- pgno: 406
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_406_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_406_1.png)


    **FIGURE A.3** Logging in to your Apple Developer account


    **FIGURE A.4** Prompting to request a certificate


    You may at this point be asked for your Apple iOS Developer Program credentials.
    (**Figure A.3**). Provide your information and click Log In. You may also be informed
    that no development certificate was found (**Figure A.4**) and asked if you would
    like to request one. Click Submit Request to submit the request automatically
    and obtain the needed certificates.


    Once you’ve made it through the various hurdles, the device will be analyzed and
    provisioned automatically. The indicator dot to the right of the device in the
    list will turn green, informing you that your device is ready for development
    use. You should now be able to run your iOS applications on the device itself
    by choosing the device in the Schemes pop-up in the workspace window’s toolbar
    and pressing the Run button.


    In addition to automatic provisioning, you can import and export developer and
    provisioning profiles by using the Import and Export buttons at the bottom of
    the window with either Developer Profile or Provisioning Profiles selected in
    the list. This is useful for manually provisioning or for moving your profile
    to a different computer. You will be required to set a password upon export and
    use the same password on import to protect the private key used to sign your applications
    cryptographically (referred to as *code signing*).


    > **NOTE:** Apple has done an excellent job automating this cumbersome process
    in Xcode 4. Nevertheless, it does not always work correctly. Read the guidelines
    supplied in the Provisioning Portal site found under your iOS Developer account
    to help you figure out what went wrong and how to complete the process manually.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_406_2.png)'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# INSTALLING iOS ON A DEVICE


    During development, it is sometimes necessary to install different versions of
    iOS on your device for compatibility testing. This includes beta versions of iOS
    itself, to which you have access via the iOS Developer Program. iOS versions are
    downloaded from the Apple Developer site (http://developer.apple.com).


    To install a different version of iOS on a device, make sure the device is plugged
    in and selected in the list that appears in the Devices tab of the Organizer.
    You can then select a version from the Software Version pop-up just below the
    device information. If your version does not appear in the list, choose Other
    Version from the pop-up and locate the iOS package you downloaded. Click the Restore
    button and confirm the action in the confirmation sheet, then wait for the iOS
    version to be installed (restored). When the installation is complete, reactivate
    the device and restore its contents using iTunes (just as you’d do as an end user).'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# MANAGING DEVICE SCREENSHOTS


    FIGURE A.5 The device screenshots list


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_408_0.png)


    The Devices section of the Organizer also lets you manage the screenshots you
    take with your device. Screenshots can be located by selecting the Screenshots
    entry under the desired device in the Organizer list (Figure A.5). Screenshots
    are useful for two reasons: as marketing material for the App Store or your own
    Web site, and as a “default launch image,” which users see as the application
    is launching on their device.


    # TAKING SCREENSHOTS


    You can take new screenshots by clicking the New Screenshot button in the lower-right
    corner of the window. All screenshots are listed as time-stamped thumbnails. Selecting
    a thumbnail will display the full-size image to the right of the thumbnails list.
    This image may be scaled down to fit the window (this is especially useful if
    you have a small display and are viewing screenshots taken from a device with
    a much higher-resolution Retina display).'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# FIGURE A.6 Comparing screenshots


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_409_0.png)


    # COMPARING SCREENSHOTS


    You can compare screenshots by selecting two or more images and selecting the
    Compare check box at the bottom of the window (Figure A.6). Choosing Difference
    from the pop-up to the right of the check box shows only the differences between
    the selected screenshots. You can adjust the tolerance (how much of a difference
    is required for a pixel to be visible in Difference mode) by using the slider
    to the right of the pop-up. Figure A.6 shows the difference between two screenshots
    (dock badges and signal strength fluctuations).'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'FIGURE A.7 Naming the image and selecting a workspace


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_410_0.png)


    # USING A SCREENSHOT AS THE DEFAULT IMAGE


    To use a screenshot as the default launch image for an iOS application, select
    it from the thumbnails list and click Save as Launch Image at the bottom of the
    window. You''ll be prompted to give the launch image a name and to select a workspace
    to which to add the image (Figure A.7).'
  merge: -1
  img_proc: true
- pgno: 411
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_411_0.png)


    FIGURE A.8 Choosing a target for the default image


    If there is more than one target in the workspace, you''ll need to click Next
    to choose the target for which you want to set the default image (Figure A.8).
    Xcode will guess the target or targets to which you intend to add the image; you
    may need to change the selection using the check boxes. Make your selection, then
    click Finish. The screenshot will be added as the default launch image for the
    selected target.


    NOTE: A workspace containing an iOS application must be open in order to select
    it in the Save as Launch Image sheet.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_411_1.png)'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# MANAGING APPS AND DATA


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_412_0.png)


    The Devices tab of the Organizer gives you a simple interface for adding and removing
    applications you’re developing as well as for downloading the applications’ data.
    To manage the applications, select the Applications entry under the desired device
    in the Organizer list (Figure A.9).'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# INSTALLING AND REMOVING APPS


    You can install applications by clicking the Add button and selecting the application
    bundle to add. You’ll need to have a provisioning profile for the application
    (which is usually only an issue if a friend is letting you test one of their applications).
    To uninstall, select the desired applications in the list and click the Delete
    button. The applications *and their associated data* will be removed from the
    device.


    # DOWNLOADING APPLICATION DATA


    You can download an application’s data for safekeeping (or analysis) by locating
    it in the list and clicking the Download button to its right. Choose a location
    to which to save the data and a folder will be created at that location containing
    the application’s data and settings. Only applications for which you have a provisioning
    profile will allow you to download their data.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# REVIEWING LOGS


    FIGURE A.10 The device logs


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_414_0.png)


    When running an application on the device without the benefit of an attached debugger,
    application crashes are a mystery. The logs of all connected devices can be accessed
    through the Device Logs section in the Devices tab of the Organizer. You can get
    the logs of individual devices by choosing the Device Logs entry under the desired
    device (Figure A.10).'
  merge: -1
  img_proc: true
- pgno: 415
  md: '# FIGURE A.11 The device console log


    A device''s console log is available under the Console entry under the desired
    device (Figure A.11). The console log can reveal useful information about an application
    that was running on its own, outside of a debugging session.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_415_0.png)'
  merge: -1
  img_proc: true
- pgno: 416
  md: '# Appendix B


    # GESTURES

    AND KEYBOARD

    SHORTCUTS'
