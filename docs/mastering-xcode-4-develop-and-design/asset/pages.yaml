- pgno: 135
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_135_0.png)


    # FIGURE 10.10 Adding an array controller


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_135_1.png)


    # CREATING THE CONTROLLER


    Core Data works well with another Cocoa mechanism called Cocoa Bindings. The Cocoa
    Bindings controller layer provides several easy-to-use controllers (such as NSArrayController)
    that simplify displaying and managing Core Data information. Locate and drag an
    NSArrayController into the Interface Builder dock (Figure 10.10). Select the array
    controller in the dock, then select the Attributes inspector in the Utility panel.
    (Note: Controllers are dragged into the Interface Builder dock because they''re
    not visual user interface elements.)


    Select the Auto Rearrange Content check box so that newly created to-do items
    are properly sorted. Change the Mode pop-up to Entity Name. Change the Entity
    Name field to ToDoItem to tell the array controller it is managing the ToDoItem
    entity from the MOM. Select the Prepares Content check box to avoid having to
    manually fetch its contents. The Attributes inspector should look like Figure
    10.11.


    Next you''ll need to bind the array controller to its contents, which come from
    the Core Data persistent store. Select the Bindings inspector and expand the Managed
    Object Context binding. Select the Bind To check box and select Test App App Delegate
    from the pop-up menu next to it. Set the Model Key Path field to managedObjectContext.
    The Bindings inspector should look like Figure 10.12. This will cause the array
    controller to use the managed object context (MOC) from the TestAppAppDelegate
    class (via its -managedObjectContext method).


    # FIGURE 10.11 The array controller attribute settings


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_135_2.png)


    # FIGURE 10.12 The array controller bindings settings'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'FIGURE 10.13 The Due column''s bindings settings


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_136_0.png)


    # WIRING UP THE UI


    To finish the interface, you''ll need to wire the controls to the array controller
    so the to-do items are shown and editable in the table and the Add and Remove
    buttons work.


    First, connect the Add and Remove buttons'' actions to the array controller''s
    -add: and -remove: actions, respectively. As you learned in Chapter 5, you can
    do this by Control-dragging a connection from the buttons to the array controller
    in the Placeholders and Objects panel and choosing the appropriate action.


    Lastly, you''ll need to bind the table columns to the content of the array controller.
    This will let each column represent the corresponding attribute (the due date
    and content string) of each instance of ToDoItem the table represents (one item
    per row). Select the Bindings inspector in the Utility area if it''s not already
    selected. Select the Due column (it will take several clicks on the column to
    descend through the window and view hierarchy). Expand the Value binding and select
    the Bind To check box. Select Array Controller in the pop-up. Set the Model Key
    Path field to dueDate (Figure 10.13). Do the same for the Description column,
    using content for the Model Key Path field.'
  merge: -1
