  md: '# CONTROLLING PROGRAM EXECUTION


    You can control program execution from within the console just as you can by using
    the Debugger Bar or the menu system. This can be handy if you’re working heavily
    with the console. Here are a few basic commands:


    | COMMAND | DESCRIPTION |

    |---|---|

    | `c` | Continue |

    | `next` | Step program |

    | `s` | Step into |

    | `fin` | Finish current method |


    There are many more execution control commands but these are the basics you’re
    likely to need most. The debugger itself can offer help.


    # CODE COMPLETION


    Recall from Chapter 7 that the Source Editor offers code completion, the ability
    for the editor to predictively suggest completions for the symbols you type. The
    debugger console offers limited support for this as well.'
