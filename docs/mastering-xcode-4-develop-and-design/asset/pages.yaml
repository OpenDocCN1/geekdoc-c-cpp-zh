- pgno: 120
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_120_0.png)


    **FIGURE 9.10** A breakpoint set in the greeting action of TestApp


    # USING BREAKPOINTS


    Breakpoints are used to pause the application (or perform other actions) in the
    debugger when a particular instruction (point in code) is reached. There are several
    ways to manage breakpoints in Xcode 4.


    # ENABLING BREAKPOINTS


    For Xcode to stop at breakpoints in the debugger, breakpoints must be active.
    You can use the Breakpoints button at the top of the project window to activate
    or deactivate all breakpoints. If this button is not selected, the debugger will
    stop only when a program signal (such as a memory-management-related crash) is
    encountered. Alternatively, you can use Command+Y to toggle breakpoints.


    > **NOTE:** In previous versions of Xcode, Command+Y would launch the targeted
    application in the debugger, whereas Command+R would run it without the debugger
    attached. Starting in Xcode 4, pressing Command+Y toggles activation of all breakpoints,
    and the running application is effectively always in debug mode.


    # MANAGING BREAKPOINTS IN THE SOURCE EDITOR


    You can set breakpoints in the Source Editor by clicking the gutter on the left
    edge of the editor beside an instruction. A blue marker appears, showing that
    a breakpoint is set at that location (**Figure 9.10**).


    You can toggle individual breakpoints in the editor by clicking them once. The
    breakpoint will turn lighter, appearing translucent when inactive. To remove a
    breakpoint entirely, you can drag it from the gutter and release it. It will disappear
    in a puff of animated smoke to indicate it has been deleted.


    You can also set breakpoints in the editor with a keyboard shortcut. Command+\\
    (Command and the backslash character) will set a breakpoint at the current line
    in the code. If a breakpoint already exists, the shortcut will remove it.'
  merge: -1
