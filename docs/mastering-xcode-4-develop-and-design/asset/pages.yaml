  md: '# VIEWING GENERATED OUTPUT


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_272_0.png)


    The build process entails a number of steps. Along the way, your code is run through
    the preprocessor (covered in Chapter 19), where macros are expanded, includes
    are included, and so on. Further down the line, the assembly code is generated
    by the compiler. Xcode provides several ways to view this generated output.


    # GENERATING THE OUTPUT MANUALLY


    You can generate and view this output at any time by choosing Product > Generate
    Output from the main menu. From there you can choose Generate Preprocessed File
    or Generate Assembly File. Xcode will produce the requested output and display
    it. Figure 17.24 shows the preprocessed result of TestAppAppDelegate.m.


    In Figure 17.24, content from all the included headers is shown. The toolbar at
