- pgno: 224
  md: 'FIGURE 15.12 Creating a new header file


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_224_0.png)


    # ADD SOME CODE


    As you read in earlier chapters, TestApp isn’t particularly useful for anything
    beyond exploring Xcode. Its shared framework won’t help it sell on the App Store
    either, but it will be a handy demonstration in Chapter 16.


    To start with, a framework should have a simple umbrella header—that is, a header
    that includes all other headers needed to use the framework and that allows a
    one-stop import into other classes. To add this umbrella header, select the TestAppSharedFramework
    group in the Project navigator and then choose File > New > New File from the
