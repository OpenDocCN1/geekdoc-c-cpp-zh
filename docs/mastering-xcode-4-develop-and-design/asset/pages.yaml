- pgno: 326
  md: '# EXTENDING THE SCRIPT


    As mentioned, this simple script shows how easy it is to customize the build process.
    When pre- and post-action scripts eventually provide environment variables—and
    they’re almost certain to in future releases—the scripts can be even more specific
    and less "conditional."


    The Web reveals a number of creative deployment scripts cobbled together and shared
    by Xcode users. Some involve uploading to a build server for testing in continuous
    integration environments. Some involve checking things into and out of repositories
    and even setting build numbers to revision numbers pulled from those repositories.
    Some scripts use release notes to generate update entries for "appcast" feeds,
    such as those used by Andy Matuschak’s venerable Sparkle automatic update framework.
    Others upload the archive (and associated appcast, release notes, and so on) to
    a staging area for testing prior to deployment on their public Web server.


    With some scripting knowledge and a list of available command-line programs and
    Xcode environment variables, you can build quite a complex process. If you’re
    new to a Unix-based platform (of which Mac OS X is one), you owe it to yourself
    as a professional developer to explore the possibilities shell scripting offers
    and to leverage the rich tools the OS offers to automate your deployment tasks.'
