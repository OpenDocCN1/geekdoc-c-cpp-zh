- pgno: 194
  md: '# FIGURE 14.26 The New Scheme sheet


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_194_0.png)


    # CREATING SCHEMES


    You can create a scheme by clicking the Add (+) button at the bottom of the schemes
    table and choosing New Scheme from the menu. A sheet (Figure 14.26) will appear
    asking for a target and a name. As you recall, schemes are linked to targets,
    so a new scheme must be given a target when created. Once you give the scheme
    a target and a name, click OK and you’re finished.


    # DUPLICATING SCHEMES


    To duplicate a scheme, select it in the list, click the Add button, and then choose
    Duplicate from the menu. The duplicate scheme will be created and the editing
    sheet (discussed in the “Editing Schemes” section) will appear.


    # REORDERING SCHEMES


    You can reorder schemes by dragging them into the desired order in the list. This
    affects the order in which they appear in the Scheme control.


    # REMOVING SCHEMES


    To remove a scheme, just select it and click the Remove (–) button. You’ll be
    prompted before the scheme is removed because this cannot be undone. If you’re
    certain you want to remove the scheme, click Delete to confirm and the scheme
    will be removed.


    # IMPORTING AND EXPORTING SCHEMES


    You can also import and export schemes to share across unrelated projects by using
    the Action button to the right of the Remove button. You’ll be prompted with a
    standard save panel for export and a standard open panel for import.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_195_0.png)


    FIGURE 14.27 The Scheme Editor sheet


    # AUTO-CREATING SCHEMES


    As mentioned previously, Xcode can create schemes automatically as targets are
    created or duplicated within the project. This feature is active by default so
    that appropriate schemes will be created for targets in projects created by previous
    versions of Xcode and opened in Xcode 4.


    To prevent Xcode from automatically creating schemes, deselect the Autocreate
    Schemes check box. If you want to have Xcode generate schemes automatically only
    when you want it to, open the Manage Schemes sheet and click the Autocreate Schemes
    Now button. Otherwise, you can leave this feature disabled and manage schemes
    manually.


    Xcode version 4.0 does not remove schemes for deleted targets regardless of the
    auto-create setting; you must remove schemes manually.


    # EDITING SCHEMES


    To edit a scheme, you can double-click it in the table in the Manage Schemes sheet
    or select it in the Schemes control (remember to click the scheme name on the
    left part of the control; the right side chooses the destination) and then choose
    Edit Scheme from the menu. The Scheme Editor sheet (Figure 14.27) will appear.
    This is the same edit sheet that appears when duplicating an existing scheme.
    In the figure, the main TestApp target is shown.


    > NOTE: At the time this book was written, Apple''s documentation of some of the
    settings available in the Scheme Editor was terse or nonexistent. In some cases,
    this book provides a best guess at an explanation and may be incomplete. Please
    consult Apple''s documentation if some settings don''t appear to work quite as
    they''ve been explained.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_195_1.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# FIGURE 14.28 The main Scheme Editor controls


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_196_0.png)


    # THE SCHEME CONTROLS


    The main scheme controls (Figure 14.28) are shown across the top of the editor
    sheet. These controls match the functionality of the Scheme pop-up as well as
    of the Breakpoints button next to it. The behavior of these controls can be confusing.


    The Scheme pop-up in the editor changes the scheme currently being edited as well
    as the active scheme in the Scheme pop-up. Its purpose is primarily to allow you
    to move between schemes without closing the editor sheet. Be aware that it also
    affects the active scheme even after you close the editor.


    The Destination pop-up is somewhat more confusing. It directly sets the active
    destination in the main Scheme control but does not appear to do anything more.
    Its presence implies you might have separate destination-dependent settings within
    the scheme, but this is not the case in version 4.0.


    The buttons along the bottom of the editor sheet let you duplicate the current
    scheme, go back to the scheme manager sheet, or dismiss the editor sheet (using
    the OK button, which should probably be a Done button).


    In the middle of the sheet are two panels, used to edit the settings of each action
    for the scheme. The left panel shows a list of actions corresponding to those
    found under the Product menu in the main menu. Selecting each action reveals that
    action’s scheme settings in the right panel.'
  merge: -1
