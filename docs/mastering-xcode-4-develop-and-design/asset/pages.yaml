- pgno: 160
  md: '# RENAMING SYMBOLS


    ```

    NSString * bob = @"Bob";

    NSLog(@"My name is %@.", bob);

    ```


    ```

    NSString * robert = @"Bob";

    NSLog(@"My name is %@.", robert);

    ```


    FIGURE 13.1 All instances of the symbol bob underlined


    FIGURE 13.2 In the current scope, bob is now robert.


    The Edit All in Scope command is a simple and often overlooked editor feature.
    As its name suggests, you can edit a symbol name and automatically change each
    instance of it within the current scope at the same time.


    Consider a local variable named bob. You’ve decided a variable should sound more
    formal, so you want to change bob to robert. Assuming bob is reused throughout
    the current scope of a long method, it would be tedious and error-prone to find
    and rename each instance, even though they’re temporarily underlined when one
    instance is selected. To formalize bob, you can click the symbol, placing the
    insertion point somewhere inside its text. All instances of bob within the current
    scope then appear with a dotted underline (Figure 13.1).


    If you hover your mouse pointer over any highlighted bob, you’ll notice a button
    appears immediately to its right. Click this button to open a context menu, and
    select Edit All in Scope. Xcode responds by highlighting each bob in the current
    scope, ready to edit them all. Begin typing to replace the text, or move the cursor
    around within the highlighted text to modify it. In this example, every instance
    of bob has been renamed to robert (Figure 13.2).


    Click to place the text insertion point somewhere outside the symbol to end editing.
    Note that only the symbol name changed. It remains a pointer to the string literal
    @"Bob". You could further edit the symbol to give robert a sex change. Repeat
    the procedure, but instead of replacing the text, place the cursor after the t
    in robert and then add an a. The symbol should now be roberta, who is suddenly
    in need of a new wardrobe or at least a new string literal.


    It’s important to note that this operation works only within the current scope.
    You cannot use this feature to rename an instance variable or a method.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# REFACTORING


    The programming term *refactor* is perhaps overused but in general means to “repurpose”
    or “reengineer” code or even architecture. Xcode’s Refactor function allows you
    to modify code in an intelligent way.


    In the previous section, you learned how to rename symbols within a given scope.
    The Edit All in Scope function is a more surgical approach than a blind search
    and replace, since replacing all instances of the common iterator i, for example,
    would likely make a mess of anything containing the letter *i*. Still, renaming
    symbols is limited to the current scope, so you cannot rename an instance variable.


    The Refactor function goes a step beyond Edit All in Scope, using its knowledge
    of your code base to make more intelligent decisions about your code, simplifying
    common but error-prone refactoring tasks.


    # REFACTORING OPTIONS


    You can find the various types of refactoring Xcode can automate for you in the
    Edit > Refactor menu.


    # RENAME


    Rename works in much the same way as Rename Symbols, with one exception: It is
    not limited to scope. This distinction means you can rename an instance variable.
    In the case of an Interface Builder outlet, Rename will update the outlet in your
    xib as well (a huge time-saver). In the case of a class, filenames themselves
    can also be automatically changed to match.


    # EXTRACT


    Extract takes a selected block of code and creates a method or function (depending
    on your choice) with it. If the code block depends on local variables, they will
    be converted to arguments of the method or function.


    # CREATE SUPERCLASS


    Create Superclass does just as the name suggests—it creates a superclass from
    the selected class. You can choose to place the declaration and implementation
    in the selected class’s files or in their own new files.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_162_0.png)


    **FIGURE 13.3** The Rename sheet


    # MOVE UP/MOVE DOWN


    Move Up takes the declaration and implementation of the selected item and moves
    them to a superclass. Move Down moves the selection to one or more subclasses
    of the current class.


    # ENCAPSULATE


    Encapsulate creates accessor methods (getters and setters) for a selected instance
    variable and changes all direct references to them so the accessors are used instead.


    # MODERNIZE LOOP


    Modernize Loop converts while or C-style for loops to Objective-C 2.0 for loops.


    # CONVERT TO OBJECTIVE-C 2.0


    Convert to Objective-C 2.0 modifies the code in the selected source files to take
    advantage of Objective-C 2.0 features. This includes modernizing loops and converting
    accessor methods to properties and synthesized accessors.


    # USING REFACTOR


    To familiarize yourself with the Refactor feature, you can rename the NSTextField
    outlet you created in Chapter 5 from textField to a more descriptive helloTextField.
    To begin, open the TestApp project and navigate to the TestAppAppDelegate.m file.
    Double-click the textField symbol on line 13, and select Edit > Refactor > Rename
    from the main menu. A sheet will appear similar to **Figure 13.3**.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_163_0.png)


    # FIGURE 13.4 The Rename preview sheet


    Change the name to helloTextField, and click Preview. Xcode will present a preview
    sheet similar to Figure 13.4 and analyze your project to locate all references
    to the symbol. You can use the Rename preview sheet to verify and cherry-pick
    individual replacements.


    You can use the list on the left side of the window to jump directly to each instance
    that will be renamed. Each item has a check box that lets you choose whether that
    file will be included in the renaming changes. In this case, there are three files
    that will be modified: TestAppAppDelegate.h, TestAppAppDelegate.m, and the English
    version of MainMenu.xib. The right pane shows two versions (“before” and “after”)
    of the selected file. If you select TestAppAppDelegate.m in the list, you’ll notice
    two red tick marks in the track of the scroll bar. These indicate the places within
    the file where the symbol is referenced or defined (where changes will be made).
    Click Save to make the changes.


    If you examine all three files (right-click the text field in the xib to examine
    its referencing outlets), you’ll notice the change has been applied. You should
    now be able to build and run the application to test it. Click the Say Hello button
    to make sure the greeting still appears in the renamed field.


    The process is similar for each of the available Refactor actions. Though the
    preview sheet works the same, the initial sheet (shown in Figure 13.3) will contain
    the various options available for each action.


    > TIP: Not all refactoring actions can be carried out without your intervention.
    The Issues button above the change list can be used to explore any problems that
    Refactor anticipates with performing the proposed action.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_163_1.png)'
