  md: '# CONFERRING WITH THE CONSOLE


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_264_0.png)


    The debugger console is your command-line interface to the debugger. Whether you’re
    using GDB or LLDB, you can do more than read messages spat out by your applications.
    Both debuggers provide command-line interfaces to the same features that Xcode
    gives you graphically. Nevertheless, a few quick commands to the debugger via
    the console (Figure 17.20) can be helpful. Especially so if you want a text dump
    of the results.


    In order to issue commands to the debugger console, you must click inside the
    console window to place the cursor to the right of the debugger prompt ((gdb)
    or (lldb), depending on the debugger you’re using). The examples that follow will
    use GDB, as LLDB is still “under construction.”


    Following are a few common tasks that can sometimes be done more easily with the
    console.


    > **NOTE:** As of this writing, LLDB is incomplete, and some commands that are
    available in GDB are not available or are incomplete in LLDB.


    FIGURE 17.20  The debugger console'
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_265_0.png)


    # FIGURE 17.21 TestApp paused in the debugger


    # PRINTING OBJECTS AND VALUES


    There are a few different ways to print objects and values from the console. The
    command you use depends on the kind of information you want to see.


    # PRINTING OBJECTS


    “Print object” (po) is the single most commonly used debugger command for Cocoa
    developers. The command will ask Objective-C objects to print the result of their
    common -description method. Inherited from NSObject, the method returns a string
    that describes the object. This description is intended to be useful for debugging.
    When the application is paused in the debugger, all the symbols in the current
    stack are available to you. This lets you issue a print object command to inspect
    objects (or other objects to which those objects hold references).


    To print an object, you’ll need to pause the application in the debugger. Usually
    it’s most convenient to use a breakpoint. Once paused, find something interesting
    to print. Figure 17.21 shows TestApp paused once again in its -applicationDidFinishLaunching:
    method. This time, it’s paused below the line where you create an NSURL object
    and assign it to the googleURL variable, giving you a handy object to print. To
    print the object assigned to googleURL, type the following command into the console
    and press Return:


    ```

    po googleURL

    ```'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_266_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_266_1.png)


    The debugger will respond by logging the string returned when the NSURL object
    is asked for its -description. **Figure 17.22** shows the results in the debugger
    console. You can also print self when stopped within a method belonging to an
    instance of an Objective-C class. In the current scope of the example, self refers
    to an instance of the TestAppAppDelegate class. **Figure 17.23** shows the result
    of printing self in this scope. In this case, the TestAppAppDelegate class doesn’t
    override -description, so the information displayed is the default description
    format inherited from NSObject. That is, the class name and address of the instance
    being printed are given.


    Of course you can also print objects through the accessors of other objects. For
    example, NSURL has a string property called -scheme. To print the scheme of the
    NSURL instance assigned to googleURL, you can issue the following command:


    ```

    ```text

    po [googleURL scheme]

    ```

    ```'
