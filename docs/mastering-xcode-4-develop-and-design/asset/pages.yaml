- pgno: 313
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_313_0.png)


    This chapter is about using scripting as well as the preprocessor to customize
    the build process. One size most certainly does not fit all coding environments,
    and large groups as well as independent developers can take advantage of Xcode’s
    scripting and preprocessing capabilities to automate a variety of testing and
    deployment tasks.


    This chapter will not serve as an exhaustive list of everything you can achieve—that
    would be an entire book unto itself. Instead, the goal is to introduce you to
    the scripting hooks and to some preprocessor tricks to spark your imagination
    so you will be better equipped to dream up your ideal automation pipeline.'
