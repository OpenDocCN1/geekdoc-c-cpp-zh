- pgno: 150
  md: '# ARCHIVING


    FIGURE 12.1 The Locations preferences panel


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_150_0.png)


    In previous versions of Xcode, you would switch between Debug and Release modes
    and then build the application for that mode. Xcode 4 introduces the Archive action,
    which automatically builds in Release mode and packages the build target along
    with its dSYM files (containing separate debugging information for analyzing release-built
    applications) into an archive file.


    # CREATING THE ARCHIVE


    Open the TestApp project if it’s not already open. To perform the Archive action,
    choose Product > Archive from the main menu. Xcode will build in Release mode
    and then archive any built products that are part of your project or workspace
    in addition to their corresponding dSYM files.'
