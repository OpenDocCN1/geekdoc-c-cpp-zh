- pgno: 370
  md: '# USING AN SCM SYSTEM


    Xcode’s snapshots feature manages backup copies and can be used to store multiple
    versions of your project and its resources, but if you’re familiar with SCM systems—and
    this section of the chapter assumes that you are at least somewhat familiar—you
    can see how comparatively limited snapshots are.


    Xcode currently supports and integrates with two well-known SCM systems: Git and
    Subversion (SVN). Whereas Subversion is primarily server-based (with the server
    usually but not always being a remote location), Git is what is known as a “distributed
    SCM” and does not require a server (remote or otherwise) to operate. There are
    many benefits to distributed SCMs, and this and other reasons make it likely that
    Git (or some other distributed SCM) will usurp Subversion in the coming years.
    Apple seems to agree. Xcode’s Git support is slightly more pervasive and noticeably
    more polished than its Subversion support. All that said, Xcode installs the necessary
    tools for both Git and Subversion support. Type man git or man svn in the terminal
    for details.


    **NOTE:** To learn more about Git, see http://xcodebook/gitimmersion; for SVN,
    see http://xcodebook.com/svnprimer.


    # GIT AND SVN DIFFERENCES


    In most cases, the biggest differences are in the terminology. For example, where
    a Git user clones, a Subversion user checks out a working copy. Where a Git user
    pulls, a Subversion user updates (and possibly merges). Git users stage changes
    and commit them, then possibly push them to the remote server (the origin); Subversion
    users simply commit (though don’t be fooled—there’s a lot to be said for Git’s
    model).


    The biggest difference between the two systems is that, as hinted at in the previous
    paragraph, a Subversion user’s commit means the change becomes part of the repository
    (usually on a remote server from which it was checked out), whereas a Git user’s
    commit is a local operation. The Git user has a copy of the entire repository
    (and its full history) and can choose whether or not to push those changes to
    the origin (usually a central repository hosted on a server). Git commits can
    happen whether or not the remote server (the clone’s origin) is reachable.


    This chapter will focus on Xcode’s Git support only partly because Apple seems
    to have chosen sides. Mainly, Git gets the spotlight because Xcode provides, where
    possible, a homogenized user interface that works nearly the same way whether
    you’re using Git or Subversion. The differences, where there are any, are mild.
    Unless specifically mentioned, the differences are mostly those of terminology.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_370_0.png)'
  merge: -1
