- pgno: 333
  md: 'FIGURE 19.11 Managing the schemes


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_333_0.png)


    FIGURE 19.12 Editing the Beta Release scheme''s Archive configuration


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_333_1.png)


    To use the separate configuration, you''ll need a separate scheme. Click the Schemes
    pop-up and choose Manage Schemes from the menu. In the scheme manager sheet (Figure
    19.11), select the TestApp scheme and then click the Add (+) button and choose
    Duplicate from the menu. In the Scheme Editor sheet that appears, set the scheme''s
    name to TestApp (Beta) and then select the Archive action. Choose Beta Release
    from the Build Configuration pop-up (Figure 19.12) and click OK. There are now
    two schemes that build TestApp, but the beta scheme (when built for archiving)
    will use the Beta Release configuration you created.'
