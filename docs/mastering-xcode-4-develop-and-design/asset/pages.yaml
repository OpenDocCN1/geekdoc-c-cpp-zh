- pgno: 131
  md: '# CREATING A BASIC DATA MODEL


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_131_0.png)


    FIGURE 10.3 TestApp''s managed object model


    Now that you''ve toured the Data Model Editor, you''re ready to expand TestApp''s
    capabilities by adding a simple data model. For this example, assume the goal
    is to add the ability to create, edit, save, and restore simple to-do items. A
    to-do item will have a content string and a due date.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_131_1.png)


    To create the to-do entity, navigate to the TestAppDataModel.xcdatamodel file.
    Click the Add Entity button. An entity will be added with a default name of Entity,
    ready to be renamed. Type ToDoItem, and press Return to rename the entity.


    Add the due date attribute by clicking the Add (+) button in the Attributes table
    in the editor. Change the attribute name to dueDate and set its type to Date.
    Do the same for the content attribute, setting its name to content and its type
    to String. The MOM should now look like Figure 10.3.


    That is all that is required to give TestApp the ability to maintain and persist
    a list of to-do items. To let the user manipulate a list (including adding, editing,
    and deleting), you''ll need to add a user interface (UI).'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# CREATING A UI FOR THE MODEL


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_132_0.png)


    **FIGURE 10.4** Making room in the TestApp interface


    To manage TestApp’s to-do items, you’ll need a table view and a few buttons to
    add and remove items. Cocoa’s NSArrayController object can fulfill all of the
    controller layer needs with no code via the Cocoa Bindings mechanism. To create
    the interface, select the `MainMenu.xib` file in the Project navigator. The file
    will open in Interface Builder.


    # LAYING OUT THE INTERFACE


    First, make room for more user interface elements. You can do this by moving the
    Say Hello button and its text field to the top of the window (Figure 10.4). You
    could also make more room by making the window larger.


    Drag two NSButtons into the window (Figure 10.5). Position the buttons, then double-click
    each and set their titles to Add and Remove. You should end up with something
    like Figure 10.6. These buttons will let the user add and remove instances of
    the ToDoItem entity.


    To display the to-do items to the user and provide a means by which to manipulate
    them, a simple table view will work just fine. Find the NSTableView control and
    drag one into the window, positioning it as in Figure 10.7. Double-click the headers
    of each of the two columns and set them to Due and Description. You’ll bind these
    columns to the dueDate and content attributes of the ToDoItem instance the table
    will display.'
  merge: -1
  img_proc: true
