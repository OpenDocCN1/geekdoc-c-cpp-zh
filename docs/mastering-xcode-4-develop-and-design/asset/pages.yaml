- pgno: 126
  md: '# INTRODUCING **CORE DATA**


    A data model gives your application a well-defined structure for managing and
    persisting its data. The model corresponds with the Model layer of the Model-View-Controller
    design pattern. There are a number of ways to manage your application’s model
    layer but Apple has created a solution that works well in many situations: Core
    Data. This facility is well integrated with Xcode.


    Apple is very careful to specify Core Data as an “object graph management and
    persistence framework.” Although the framework shares much in common with a relational
    database, it is important to note that it is not intended to act as one. Core
    Data is primarily focused on the needs of desktop applications (though it can
    be used in server applications as well, provided care is taken to manage it properly).


    The framework provides standard persistent store types (binary, SQLite, and XML)
    and can be extended with custom store types. The minimum requirement the developer
    must supply is a managed object model, which describes the application’s entities
    (such as Person, Group, Account, or BlogPost) and their relationships to one another,
    if any. With this model and UI to manipulate it, Core Data is smart enough to
    handle managing, saving, and loading your application’s data without writing a
    single line of code. In practice, however, a moderately complex application will
    need further customization.


    There are a few key concepts you’ll need to understand to use this API and its
    related Xcode features.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_126_0.png)


    > **NOTE:** Core Data relies on several underlying Cocoa technologies. This is
    considered an advanced topic. This book will introduce the basic concepts but
    will focus on Xcode’s Core Data features only. For more information, refer to
    Apple’s developer documentation.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# MANAGED OBJECT MODELS


    A managed object model (MOM) is Core Data’s facility for describing the application’s
    data model. It can be described in code but is most often built with the Data
    Model Editor. When you create a project from a template that uses Core Data, all
    the necessary code is included as well as an empty MOM file that shares the application’s
    name. For TestApp, the file is `TestAppDataModel.xcdatamodel`.


    # PERSISTENT STORES


    A persistent store is the on-disk representation of the data created with your
    managed object model. Core Data supports three store types by default: XML, SQLite,
    and binary. Each store type has its advantages and disadvantages (see the Core
    Data documentation for details). Additionally, Core Data supports developer-implemented
    custom store types. The managed object model “does not care” about how (or even
    if) the data is persisted in a store.


    Developers new to Core Data sometimes confuse the model with a data store created
    using the model. Some even look for a way to browse (in Xcode) the data they put
    into a store with their application. It’s important to understand that the data
    created in your application is not stored in the managed object model but rather
    in a store.


    > **NOTE:** Throughout the rest of this chapter, the term *model* can be assumed
    to refer to a Core Data managed object model.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# ENTITIES


    Entities represent your model objects. *Entity* in this context means the same
    as it does in relational databases. It is a description of a type of object and
    its properties. In Core Data terminology, a *managed object* is an *instance*
    of an entity.


    When an entity is selected in the editor, containers appear that allow you to
    add attributes, relationships, and fetch properties.


    An attribute requires, at minimum, a name (such as lastName or age) and a type
    (such as a string or a number). A relationship requires a name (such as parentFolder)
    and a destination entity (such as Folder) and can be a one-to-one or one-to-many
    relationship.


    # MANAGED OBJECT CONTEXTS


    A managed object context can be thought of as a “scratch pad,” a context in which
    managed objects are created or pulled from a persistent store, potentially modified,
    and potentially saved back to the store. To work with Core Data, you must have
    at least one context.


    You may have multiple contexts to keep sets of changes separate. For example,
    a desktop application might create a separate context for an “import” task that
    runs in the background while the user continues using the existing data. A server
    application might have one context for each session (connected user) to isolate
    their activities until they’re ready to “commit” any additions, changes, or deletions
    they may have made.


    Separate contexts are merged using one of several available merge policies that
    dictate how conflicting changes are to be handled. The merged contexts can then
    be persisted to the store. In the case of this import example, the contexts can
    be merged (and persisted) when the import completes successfully, revealing the
    newly imported data to the user in the main user interface.'
  merge: -1
  img_proc: true
