- pgno: 371
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_371_0.png)


    FIGURE 21.7 The Repositories tab of the Organizer


    # MANAGING REPOSITORIES


    More than likely, you have existing Xcode projects that are tied to existing repositories.
    You may already have a local clone (in Git) or checked-out working copy (in Subversion).
    The quickest way to make Xcode aware of an SCM-attached status is to open the
    project. Xcode will try to set up any connections to the repository''s origin
    or to the Subversion remote server. If authentication is required and Xcode does
    not have the credentials, it will prompt you for them upon opening the project.


    You can manage repositories with the Organizer window. To view them, choose Window
    > Organizer from the main menu, then choose the Repositories tab. The Repositories
    tab of the Organizer (Figure 21.7) maintains a list, on the left side of the panel,
    of all repositories it''s encountered (and their associated clones and origins).
    The repository''s details as well as its history are displayed on the right when
    a repository is selected; when a working copy or clone is selected, the file and
    folder structure, the working copy''s history, and an SCM-specific toolbar are
    shown. You''ll explore this UI in detail throughout the rest of the chapter.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'FIGURE 21.8 Creating a Git repository when saving a new project


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_372_0.png)


    If you’ve been following along with a TestApp project of your own, then Xcode
    has already been tracking the Git repositories for each of the projects you’ve
    created (TestApp, TestAppSharedFramework, and TestApp Touch). Because you chose
    to let Xcode create a Git repository for each project, you have three separate
    repositories. Some may choose to have one repository for a suite of related applications
    and libraries, but with Xcode’s new workspaces concept, the borders between these
    repositories are barely noticeable and don’t get in the way of typical day-to-day
    tasks.


    # CREATING REPOSITORIES


    As you learned in previous chapters, Xcode will let you create new Git repositories
    when you create new projects. When you’re prompted for a location into which to
    save a new project, the Save dialog contains a Source Control option at the bottom.
    Figure 21.8 shows the Source Control option to create a Git repository selected.
    Unfortunately, this is the extent of Xcode’s repository-creating powers. That
    is, it’s limited to creating local Git repositories at the time a project is created.
    It cannot initialize a new repository for existing projects.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'All is not lost. You can still take full advantage of Git by using the command
    line to turn an existing project into a Git repository. In the terminal, type
    the following (where your_project_folder is the full path to your project''s main
    folder):


    ```

    cd your_project_folder

    git init

    ```


    That’s it. The folder is now the home of a Git repository, albeit one in which
    nothing is yet committed.


    To create a locally hosted Subversion repository, you can’t use Xcode, but you
    can use the terminal:


    ```

    svnadmin create your_project_folder

    mkdir your_project_folder

    ```


    You can then manually import an existing project into the new repository using
    the following code:


    ```

    svn import path_to_existing_files file://full_path_to_project_

    → folder/trunk/ -m "Initial import"

    ```


    Not as elegant as Git, but it gets the job done.


    # ADDING REPOSITORIES MANUALLY


    You can add repositories and working copies with the Organizer. Whether you removed
    them yourself or Xcode could not for some reason add them automatically when opening
    a project under version control, you can add and remove them manually. This is
    done with the Add (+) button at the bottom of the source list.


    Keep in mind that the source list is an outline. The top-level nodes are individual
    repositories. Their children are all the known working copies or clones that belong
    to them, as well as convenient folders to access branches and tags.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# **FIGURE 21.9** Adding a remote Git repository


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_374_0.png)


    To add a repository, click the Add (+) button and choose Add Repository from the
    menu. A sheet (**Figure 21.9**) will appear, asking you for a name, location,
    and type. The name is just a convenient identifier and can be anything you like
    (for example, *My Company Repository* or just *Fred*). The location, however,
    must be a valid URL to a repository.


    The type will be automatically detected when using URLs with schemes like *svn://*
    and *git://*, but those starting with *ssh://*, *http://*, or *https://* will
    require you to choose the correct SCM system type in the Type field. The indicator
    light beneath the Location field will glow green when the supplied URL points
    to a valid repository.


    > **TIP:** The Add a Repository sheet is probably more useful for Subversion repositories,
    since a cloned Git repository is a copy of the entire repository. For Git, it’s
    actually more user friendly to add a repository by opening the project in which
    it’s contained—Xcode will set up everything (including the origin, if one exists)
    for you.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_375_0.png)


    FIGURE 21.10 Specifying a remote repository location


    To add a Git clone (or a Subversion working copy), you can either drag it into
    the source list in the Repositories tab of the Organizer or again use the Add
    (+) button, selecting Add Working Copy from the menu instead. This time you’ll
    be faced with a standard Open dialog that allows you to choose the folder containing
    the working copy or clone. Once you choose the folder, the working copy (and its
    associated repository entry) should be added to the Organizer.


    NOTE: For Subversion repositories, the branches and tags folders must exist at
    the root level of the repository you added in order for Xcode to recognize them
    automatically. There is currently no way to “map” the corresponding entries in
    the Organizer list to folders that are not in this expected location.


    # CLONING AND CHECKING OUT


    If you don’t already have a local clone, Xcode offers several ways to create one
    from within its UI. One way is to use the Organizer’s Add (+) button. Another
    way is to use the Welcome to Xcode window (Command+Shift+1) by selecting the Connect
    to a Repository option. Figure 21.10 shows a Git repository called GitTestApp
    that is hosted on a remote server via ssh. The indicator beneath the Location
    field shows that the host is reachable and the location is valid.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_375_1.png)'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'FIGURE 21.11 Naming the clone


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_376_0.png)


    Click Next to reveal the sheet seen in Figure 21.11, which asks you to give the
    working copy or clone a recognizable name. Again, this can be anything you want.
    The Type field is usually already set to the correct SCM type (Subversion or Git),
    but if it''s incorrect or not specified, you''ll need to select it here. Click
    the Clone (or, for Subversion, Checkout) button to continue. You''ll be prompted
    for a location on your computer into which to save the clone or working copy.
    Choose a location and click Clone.'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'The clone or checkout will begin. You may be asked for authentication information.
    Supply the necessary information and click OK to proceed. Depending on the size
    of your repository, the actual checkout or clone may take a while. When it''s
    finished, it will show up in the Organizer along with the rest of your repositories.


    NOTE: It''s common to set up an SSH key for “passwordless” authentication to an
    SCM server. If you have a key set up for the server already and Xcode prompts
    you for a username and password, it''s best to leave the username field as it
    is and supply no password. For a Git-themed example of setting up an SSH key,
    see http://xcodebook.com/gitkey.


    # PERFORMING ROUTINE SCM TASKS


    You''ve seen how to clone and generally manage your Git repositories. Now you''ll
    explore how to perform the more typical day-to-day SCM management tasks in Xcode
    and manage changes to your projects.


    # MANAGING FOLDERS IN SUBVERSION


    Subversion works with files and folders; Git works with files or chunks (changed
    parts of files). For this reason, Subversion users need to make directory structure
    changes through Subversion, whereas Git users are able to freely move files and
    folders around.


    In Xcode, you manage Subversion folders using the Repositories tab of the Organizer.
    You''ll need to first select the repository. To add a folder, use the list in
    the right-hand pane (the one showing your working copy''s directory structure)
    to select a folder in which you want to create the subfolder, then click the New
    Directory button. To delete a folder, click the Delete button in the Organizer.
    Rename folders by clicking them in the Organizer and editing them as you would
    any other filename. Each of these changes will require an immediate commit. Xcode
    will prompt you to enter a commit message.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_377_0.png)'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# FIGURE 21.12 SCM status in the Project navigator


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_378_0.png)


    # CHECKING STATUS


    Throughout the book, you’ve been avoiding the elephant in the room (or rather
    the symbols in the Project navigator). Figure 21.12 shows the TestApp Suite workspace
    in the Project navigator. The expanded TestApp project shows project members’
    pending SCM status as “badges” along the right edge of the list.


    The meaning of each of the status badges is as follows:


    +   M Locally modified

    +   U Updated in repository

    +   A Locally added

    +   D Locally deleted

    +   I Ignored

    +   R Replaced in the repository

    +   - Mixed status (for groups and folders)

    +   ? Not under source control (hence, status unknown)'
  merge: -1
  img_proc: true
- pgno: 379
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_379_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_379_1.png)


    FIGURE 21.13 Project navigator filtered by SCM status


    FIGURE 21.14 Source control in the Utility area


    The status messages can have different meanings, depending on the SCM system you''re
    using. See the SCM system''s documentation for details. These generic symbols
    represent the least common denominator for the two SCM systems.


    You can also filter the Project navigator list so that it shows only those project
    members that have a pending SCM status (Figure 21.13). Turn off the filter button
    to go back to showing all project members.


    The status of individual files can be examined in slightly more detail by using
    the File inspector of the Utility area. The Source Control section (Figure 21.14)
    shows the version, status, and location of the source-controlled file.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# FIGURE 21.15 The commit review sheet


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_380_0.png)


    # COMMITTING AND PUSHING


    Comitting your changes to the repository is straightforward, and there are several
    ways to do it. You can commit all outstanding changes or only the selected files.


    Xcode stages files newly added to the project for the next commit. That’s currently
    the limit of Xcode’s support for Git’s powerful staging feature, where all or
    part of a file’s changes are staged to be part of the next commit (which would
    leave you the option to commit only specific changes within a file). Instead,
    Xcode’s commit means stage and commit with Git repositories.


    To commit all outstanding changes across all projects in the workspace (or merely
    all changes in the project if you have only one project open), choose File > Source
    Control > Commit from the main menu. A sheet similar to Figure 21.15 will appear.
    Like the Find and Replace preview sheet you learned about in Chapter 8, this sheet
    displays a list of files on the left and a preview area on the right. Select any
    file in the list to preview the differences between the repository and the working
    copy of the file. To choose a file to commit, select the check box to the left
    of the file’s name.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_381_0.png)


    FIGURE 21.16 The branch selection sheet


    Enter your commit message in the text editor at the bottom of the sheet, and click
    the Commit button to commit the changes. Assuming there were no errors, the SCM
    status flags will then disappear, showing that there are no files with outstanding
    SCM status.


    > NOTE: When you use the main File menu to commit changes to projects across multiple
    repositories, Xcode treats this as if you''d performed individual commits for
    each working copy or clone using the same commit message.


    If you need to commit only a handful of files, you can select them individually
    in the Project navigator, right-click one of the selected files, and choose Source
    Control > Commit Selected Files from the context menu. The same commit sheet you
    saw in Figure 21.15 will appear, and it works the same way. You can also commit
    from the Repositories tab of the Organizer by selecting a working copy or clone
    from the source list and pressing the Commit button on the bottom toolbar.


    # PUSHING CHANGES


    When using a Git repository cloned from a remote origin, you can also use the
    Source Control menu to push your local commits to the origin from within Xcode.
    Choose File > Source Control > Push from the main menu. A sheet will appear (Figure
    21.16), asking you to choose the branch to which to push. Once you choose the
    branch, click Push. Xcode will then push the changes.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_381_1.png)'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# FIGURE 21.17 The pull review sheet


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_382_0.png)


    # FIGURE 21.18 The merge control buttons


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_382_1.png)


    # PULLING (OR UPDATING) AND MERGING CHANGES


    Pull changes into your clone by choosing File > Source Control > Pull from the
    main menu. A sheet similar to the branch selection sheet will appear, asking you
    to choose the remote from which to pull. Make your selection and click the Choose
    button. If there are any differences, a sheet (Figure 21.17) will appear, allowing
    you to review each difference. This allows you to cherry-pick the changes you
    want to pull into your clone.


    Figure 21.17 shows two changes (there are in fact three pending, but only two
    are visible in the figure). The first, outlined in blue, is simply a text addition.
    The second, outlined in red, is a conflict. That is, both the local clone and
    the remote version have changes on the same line. Select a highlighted difference
    by clicking anywhere within the highlighted area, and use the buttons on the bottom
    of the sheet (Figure 21.18) to control the changes.


    The buttons control whose changes you want to keep. Starting from left to right,
    the choices are:


    +   Left then Right — Keep your changes and insert the remote changes below them.

    +   Left — Keep your changes and discard the remote changes.

    +   Right — Discard your changes and accept the remote changes.

    +   Right then Left — Keep your changes and insert the remote changes above them.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_383_0.png)


    FIGURE 21.19 The “Create a branch” sheet


    You might get away with ignoring unconflicting changes pulled in from others,
    but Xcode will not allow you to continue until you resolve any conflicts. Resolving
    the conflict can be as simple as choosing a side or as complicated as pulling
    in both changes and fixing the mess (and then committing and pushing that resolution)
    yourself.


    # CREATING AND SWITCHING BRANCHES


    Git branches can be created in the Repositories tab of the Organizer. Select the
    repository’s Branches folder in the repositories list, and click the Add Branch
    button on the bottom toolbar. A sheet will appear (Figure 21.19), prompting you
    for a name for the new branch and for the “starting point” (the branch from which
    to create the new branch).


    You can also select the “Automatically switch to this branch” check box to have
    Xcode immediately switch (or check out for Subversion) branches after creating
    the new one. Subversion users will additionally be asked to type a commit message.
    Click the Create button, and the new branch will be created and will show up in
    the Branches folder.'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'FIGURE 21.20 The switch branch sheet


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_384_0.png)


    FIGURE 21.21 The Version Editor


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_384_1.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_384_2.png)


    Switching branches is similarly done in the Repositories tab of the Organizer.
    Select the clone itself in the repositories list, then click the Switch Branch
    button in the bottom toolbar. A sheet (Figure 21.20) will appear, letting you
    choose the branch you want to switch to. Click OK to switch to the selected branch.


    # COMPARING AND BROWSING HISTORY


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_384_3.png)


    It’s often necessary to browse previous versions of files in your repository or
    to compare versions. Xcode’s support for this is hidden in plain sight. You’re
    already familiar with the first two buttons in the editor mode button bar in the
    main toolbar. The first button is the plain editor mode. The second reveals the
    Assistant editor. The third and final button reveals the Version Editor (Figure
    21.21).'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'FIGURE 21.22 Scrubbing the revision timeline


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_385_0.png)


    FIGURE 21.23 The revisions Jump Bar


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_385_1.png)


    FIGURE 21.24 The view mode button bar


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_385_2.png)


    At the bottom of the channel between the two source editors, you can click the
    clock icon to reveal a timeline. Scrubbing the mouse over the timeline reveals
    past versions (Figure 21.22), much like the user interface of the Mac''s Time
    Machine backup feature. Click a version to display it in the right-hand editor
    for comparison. Differences are highlighted, as in the pull review sheet (Figure
    21.17), though you have to hide the timeline to see the familiar expanding or
    contracting highlight.


    Just beneath each editor is a Jump Bar that allows you to select revisions directly
    from any branch in which the file exists (Figure 21.23). This lets you compare
    two non-current revisions.


    There are two other handy view modes in the Version Editor: Blame and Log. Select
    a view mode by using the button bar in the lower-right corner of the Version Editor
    (Figure 21.24).'
  merge: -1
  img_proc: true
- pgno: 386
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_386_0.png)


    **FIGURE 21.25** Blame mode


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_386_1.png)


    **FIGURE 21.26** Log mode


    Blame mode (**Figure 21.25**) shows “who is to blame” for each revised section
    of the file. If the entire file is from the same revision, there will be only
    one person to blame. If, however, different sections have been revised (changed
    and committed) at different times, each section might have different people to
    blame at different times. Each revised section is labeled along the right with
    the name of the person who made the change, the date they did it, their commit
    message, and other details.


    Log mode (**Figure 21.26**) is a flat history of revisions of the file. It’s mainly
    useful for seeing the history of commits involving that file. For an unfiltered
    view of history, use the Repositories tab of the Organizer window.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# REVERTING AND DISCARDING LOCAL CHANGES


    Perfect people don’t make mistakes and therefore likely don’t need a source code
    management system. Unfortunately, none of them are employed at software companies,
    so the rest of us need a way of undoing our mistakes. There are two levels of
    severity: discarding your local changes (replacing them with the most recently
    committed version) and reverting to earlier committed versions.


    To discard changes in a single file, navigate to it and choose File > Source Control
    > Discard Changes from the main menu. Confirm the decision by clicking Discard
    Changes when prompted. To discard changes for multiple files, select each one
    in the navigator and choose the same menu option. All changes in all selected
    files will be discarded.


    # WRAPPING UP


    You may have noticed that a few SCM topics are missing. That’s because, as of
    this writing, Xcode’s SCM support is still somewhat limited. In some cases, a
    feature may simply not have been added yet. In others, it may not be added because
    it’s too specific to the SCM system. Either way, for anything beyond the basics,
    you may still turn to your favorite GUI front end or to the command line.


    If your SCM needs are basic to moderate, Xcode has you covered. At the very least,
    snapshots provide very basic version control so you don’t lose hours (or days)
    of work to a stupid but honest mistake. If you haven’t begun using version control
    yet, you should start now. Xcode makes it easy.


    In the next chapter . . . oh wait. There is no next chapter. Xcode has many more
    hidden gems, but let’s leave the deep-diving and spelunking to heavier and much
    more pedantic books.'
  merge: -1
  img_proc: true
