- pgno: 203
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_203_0.png)


    **FIGURE 14.38** Archive action options


    # THE ANALYZE ACTION


    The Analyze action runs the static analyzer (introduced in Chapter 9 and covered
    in more depth in Chapter 17) against the targets specified in the Build action.


    The editor has only one option: the Build Configuration pop-up. As with other
    actions, use this to specify the configuration (usually the default Debug or a
    debugger-friendly configuration) to use when analyzing the built target(s).


    # THE ARCHIVE ACTION


    The Archive action, covered in Chapter 12, is responsible for creating an archive
    of all built targets and their dSYM debugging information. The archives are suitable
    for submission to Apple’s (Mac and iOS) App Stores.


    The editor (**Figure 14.38**) has only three options. The first, Build Configuration,
    works as expected. A Release build makes the most sense and is the default, but
    you’re free to create your own release-friendly configurations for use here. The
    Archive Name field lets you specify a name to use for the created archives. The
    Options section (with only one option) lets you specify via the check box that
    you’d like Xcode to reveal the archive in the Archives tab of the Organizer (also
    mentioned in Chapter 12) when the action is complete.'
  merge: -1
