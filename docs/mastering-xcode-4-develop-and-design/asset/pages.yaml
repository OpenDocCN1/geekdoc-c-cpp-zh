- pgno: 438
  md: '# THE BOOK SITE


    This book''s companion site (http://xcodebook.com) contains Xcode 4 news, tips
    and tricks, downloadable sample projects reflecting each chapter''s tasks, and
    errata.


    # APPLE RESOURCES


    **Developer Forums** (http://devforums.apple.com)

    Apple''s developer forums site has an Xcode-specific forum with a number of active
    members. A current Apple Developer account is required.


    **Xcode-Users Mailing List** (http://lists.apple.com/mailman/listinfo/xcode-users)

    The Xcode-Users mailing list doesn''t require an Apple Developer account to use
    and is an active list full of helpful people.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# THIRD-PARTY RESOURCES


    **Stack Overflow** (*http://stackoverflow.com/questions/tagged/xcode*)


    Stack Overflow is a great developer resource with questions tagged by topic. Questions
    and answers are voted up or down depending on their clarity and usefulness, encouraging
    thoughtful questions and answers by community members.


    **CocoaDev Wiki** (*http://cocoadev.com*)


    Although somewhat dated, this community-built wiki was pumped full of useful Cocoa
    developer information over the course of the last decade and still contains many
    valuable lessons for beginner, intermediate, and expert developers.


    **Cocoa Dev Central** (*http://cocoadevcentral.com*)


    This celebrated collection of informative how-to articles contains many Cocoa
    developer favorites. It’s worth browsing.'
  merge: -1
  img_proc: true
