- pgno: 327
  md: '# USING THE PREPROCESSOR


    In Chapter 13, you saw how you can use the C preprocessor (cpp) to create separators
    that show up in the Jump Bar and aid code navigation. If you''re unfamiliar with
    the preprocessor, it may surprise you to know that it''s far more powerful than
    that. It has a lot more to offer than the simple pragma mark directive.


    TIP: To learn more about what the C preprocessor can do for you, visit http://xcodebook.com/cpp.


    # MACROS


    One of the simplest ways to use the preprocessor is to define macros. Since the
    preprocessor does as its name suggests—processes the text prior to compilation—macros
    are automatically expanded for the compiler. This means you can use the #define
    command to create a kind of “lazy man’s constant” or to compress a set of nested
    method calls down to a simple stand-in symbol.


    # WHERE TO PUT THEM


    It’s usually preferable to define macros in a header file so they can be imported
    elsewhere without needing to repeat them. Many developers use a global header
    file for this. The default .pch file found under your project’s Supporting Files
    group is included everywhere and is a great place to keep global macros.


    # DEFINING A MACRO


    A macro is defined using the #define directive and a macro name (such as PlaceholderString
    or TRUNCATED_PI), followed by the expanded text for the macro. For example, the
    following defines a macro:


    ```

    #define TRUNCATED_PI 3.14

    ```


    Any time the preprocessor encounters TRUNCATED_PI in source files, the value will
    be “expanded to” (or replaced by) 3.14.


    In Cocoa applications, it’s commonplace to use uniform type identifiers (such
    as com.mycompany.TestApp.testappdocument) to identify data types such as documents,
    pasteboard drag types, and more. As with constants, the benefit of using a macro
    is to cut down on the number of opportunities you might mis-type a string constant
    (which the compiler cannot verify for you). Since a macro, like a symbol,


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_327_0.png)'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'must be typed properly (and participates in code completion), Xcode will help
    you spell it correctly and the compiler will flag it as an error if you miss.
    A simple string macro can be defined like this:


    ```

    #define TestAppDocType @"com.mycompany.TestApp.testappdocument"

    ```


    This will define the macro TestAppDocType, which will be expanded to @"com.mycompany.TestApp.testappdocument"
    anywhere it''s used.


    Another handy use for macros is to shorten long, deeply nested method calls. Many
    non-document-based Cocoa applications “hang” top-level controllers from the application
    delegate to provide an easy means of reaching them from anywhere else in the application’s
    code. A call to such a controller might look like this:


    ```

    [[[NSApp delegate] importantController] doSomethingImportant];

    ```


    You can shorten the call by defining a macro for the controller:


    ```

    #define ImportantController [[NSApp delegate] importantController]

    ```


    The shortened call is now:


    ```

    [ImportantController doSomethingImportant];

    ```


    Macros can be used as functions as well. In fact, many common (but verbose) evaluations
    have macros predefined in the Foundation.framework (under NSObjCRuntime.h). For
    example, finding the larger of two values can be evaluated as follows:


    ```

    int largest = (a > b) ? a : b;

    ```


    The MAX macro, however, simplifies this (for any type, not just int) as:


    ```

    int largest = MAX(a, b);

    ```


    TIP: An easy way to find system-defined symbols and macros is to type them into
    the Source Editor and then Command-click them. The editor will navigate to the
    definition. Try it by typing MAX and Command-clicking the word.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_328_0.png)'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# POISON


    Although not quite as severe as it sounds, the GCC poison pragma directive can
    turn the use of any symbol or macro into a hard error. This is useful when trying
    to avoid using a particular function, variable, or predefined macro. For example,
    if you wanted to make sure all logging calls are made to Cocoa’s NSLog() rather
    than to printf(), you could “poison” printf(). This would cause the compiler to
    flag all existing calls and ensure any future slip-ups are avoided, should you
    forget and try to use printf() again later. To poison a symbol, use the following
    (substituting the desired symbol for printf in the example below):


    ```

    #pragma GCC poison printf

    ```


    Now printf() is considered poison. The antidote is to simply delete or comment
    out the pragma directive you just set:


    ```

    // #pragma GCC poison printf

    ```


    # CONDITIONALS


    The preprocessor has another handy trick up its sleeve. You can use conditionals
    to include (or exclude) blocks of text between #ifdef and #endif or to issue errors
    and warnings that are dependent on the environment. The supported conditionals
    are #if, #ifdef, #ifndef, #else, #elif, and #endif. The #ifdef and #ifndef ("if
    defined" and "if not defined," respectively) conditionals are the most commonly
    used.


    You might use conditionals to exclude blocks of code at build time depending on
    some set of criteria. For example, you might include a message dialog box that
    appears when an application is launched and that warns the user they’re running
    a beta version. A simple “beta” flag can be defined in the configuration used
    by a “beta build” scheme, while the normal scheme does not define it. Depending
    on which scheme is used, the beta warning code block may or may not be included
    at compile time.'
  merge: -1
  img_proc: true
