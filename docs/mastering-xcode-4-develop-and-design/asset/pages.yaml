  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_241_0.png)


    FIGURE 16.10 The scheme manager


    # CHANGING A SCHEME’S CONTAINER


    The Container field of the scheme manager indicates where the scheme is stored.
    This field lets you move schemes by changing their container to another project.
    When viewing the schemes at the workspace level, you can move schemes to be contained
    entirely in that workspace. This capability lets you create a shared scheme that
    builds an entire suite of products from disparate projects with a scheme that
    only appears when working with the entire workspace.


    > **NOTE:** Recall that the scheme manager’s Shared check boxes dictate whether
    a scheme shows for other users who open the project or workspace. In a team setting,
    there will likely be at least one shared scheme—the scheme to build them all.'
