- pgno: 354
  md: '# FIGURE 20.18 TestApp''s call tree


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_354_0.png)


    To silence the warning that appears, declare -doSomethingStupid in the app delegate’s
    header (TestAppAppDelegate.h) by adding the following code before the @end directive:


    ```

    - (void)doSomethingStupid;

    ```


    Taken together, this code creates a mutable array with a capacity of 1,000,000
    objects and fills it with 10,000 instances of NSNumber. Not surprisingly, this
    will take a bit of time and cause the app’s UI to be unresponsive for a short
    time after launch. Once you have this code in place, press Command+I to invoke
    the Profile action.


    Assuming there are no errors, Instruments will launch and prompt you for a template.
    Choose the Time Profiler template and click the Profile button. TestApp will launch,
    but it’ll take just a bit longer than usual. Once it launches and shows its windows,
    stop the trace by pressing the Record button. Make sure the Instruments and Detail
    views are shown and that the Detail view mode is set to Call Tree. Then, under
    the Call Tree options on the left side of the Detail view, make sure that Invert
    Call Tree, Hide System Libraries, and Show Obj-C Only are the only options that
    are selected. This shows only TestApp’s symbols. You should see something similar
    to Figure 20.18.


    In the figure, only four symbols (all from TestAppAppDelegate.m) are shown. Though
    your numbers may vary slightly (especially depending on how long after launch
    you waited to stop the trace), it should be painfully clear that TestApp spent
    most of its time doing something stupid.'
  merge: -1
