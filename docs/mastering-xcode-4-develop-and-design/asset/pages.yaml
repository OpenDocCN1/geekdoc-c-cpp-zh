  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_255_0.png)


    # LOGIC ERRORS


    Logic errors can cause crashes or more subtle problems. In complex code, they
    can be easy to miss and difficult to debug, but the static analyzer picks them
    up and highlights them easily.


    One type of logic error is using an uninitialized variable. A variable declared
    without an initial value can point to any old garbage lying around in RAM. Attempting
    to access that variable gives you undefined or garbage values. Figure 17.8 demonstrates
    this problem in a basic scenario (the second step is highlighted in the figure).


    On line 20, a BOOL variable named positiveFlag is declared with no initial value.
    Because the code inside the if/else if blocks (lines 22–27) may not be executed,
    the positiveFlag may never have a defined value assigned to it before the value
    is returned in line 29.'
