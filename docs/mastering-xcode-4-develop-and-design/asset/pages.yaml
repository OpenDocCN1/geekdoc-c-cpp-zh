- pgno: 182
  md: 'project levels. An example of this can be seen with the Wrapper Extension setting
    (also in the Packaging settings). An application bundle always gets an extension
    of .app. Other bundle types would have different extensions. Take a look at the
    same setting for the TestAppTests target. The Mac OS Default setting is .bundle;
    at the target level it’s .octest.


    When viewing settings arranged by level, settings defined for a given level are
    outlined in green (also seen in Figure 14.14). You can see this in the Product
    Name setting. If a value is overridden further down the hierarchy (working toward
    the left), that value is also outlined in green. This helps you determine the
    level at which a setting is customized and, when considered with the Resolved
    column, lets you easily determine the precise setting for your individual targets.


    You can also add user-defined build settings by using the Add Build Setting button
    at the bottom of the editor. This lets you further customize the build process
    by passing custom settings not shown in the editor. User-defined settings appear
    at the bottom of the list in a group called User-Defined. For example, you might
    want to include a “This app is BETA!” user interface element for beta builds.
    You might add a “Show Beta UI” setting with a value of Yes if building a beta
    release (using a “Beta Release” configuration you can add to the project’s Configurations),
    or with a value of No otherwise. You can use the preprocessor to check the value
    of this setting at compile time and include or exclude your custom “add the beta
    UI element” code. See Chapter 19 for more information on using similar approaches.


    There are many settings in this tab that affect the build environment, the built
    product, and even what kinds of errors and warnings the build system should respect
    or ignore. The depth and breadth of these settings is beyond the scope of this
    book, but it’s worth noting that the Quick Help pane of the Utility area will
    give you detailed information on each. Just select the setting in the editor and
    the Quick Help pane will provide an overview of the setting, its options, and
    its implications.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_183_0.png)


    **FIGURE 14.15** The Build Phases tab


    # THE BUILD PHASES TAB


    The Build Phases tab (**Figure 14.15**) lets you manage, add, and remove build
    phases for your target. The available phases depend on the type of target you
    are building. For example, only bundles can have bundle resources (such as images,
    sounds, Help Book files, and so on), so the build phase would not be used for
    a command-line tool.


    You can add phases using the Add Build Phase button at the bottom of the editor.
    Those that are removable can be removed by clicking the remove (x) button in the
    upper-right corner of the phase’s table.


    The first build phase—Target Dependencies—is the one phase that cannot be removed.
    This special phase lets Xcode know of other dependencies (such as a framework
    or plug-in for an application) that must be built before the currently selected
    target can be built. This build phase defines implicit dependencies as opposed
    to allowing Xcode to determine target dependencies automatically as configured
    in the active scheme. You can add and remove targets (any target except the selected
    one, for obvious reasons) for this phase using the Add (+) and Remove (−) buttons
    at the bottom of the phase’s table.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The Compile Sources phase compiles any source files belonging to your target
    using the appropriate compiler for the file type as defined in the Build Rules.
    You can set compiler flags (such as optimization settings like `-funroll-loops`
    or `-O3`) for each individual file by double-clicking in this phase’s Compiler
    Flags column, typing the flags, and then pressing Return. You can add source files
    to and remove source files from this phase using the Add (+) and Remove (−) buttons
    at the bottom of the phase’s table. This phase seems like it should not be optional,
    however if you recall that there can be aggregate targets and other types, you
    can see why this phase is not always necessary.


    The Link Binary With Libraries phase lets you control which libraries your product
    is linked against using the linker. While it’s true you don’t have to use a library
    or framework in your source code to make use of it in your application (because
    it might be used from an instantiated object in your xib), you’ll always have
    to link against it if you use it at all. By default, all Cocoa applications are
    linked against the Cocoa framework, which explains the framework’s presence in
    the TestApp target. When using additional libraries and frameworks, it’s easiest
    to add them here. You can add and remove linked libraries and frameworks for your
    product using the Add (+) and Remove (−) buttons at the bottom of the phase’s
    table. Pressing the Add button reveals the same Frameworks and Libraries sheet
    you saw in Figure 14.4, from which you can select the library or framework to
    which to link.


    The Copy Bundle Resources phase copies any resources included with your bundle
    into a ../Contents/Resources folder relative to your bundle’s file path (the standard
    location for resources in any type of Cocoa bundle). Resources include application
    and button icons, video and sound clips, template files, and so on. Notice the
    TestAppIcon.icns file you added to the project in Chapter 11 is included in this
    phase, ensuring it will be available as a resource to the application at runtime
    and to the Finder when displaying the application in the file system.


    > **NOTE:** Linking is accomplished using a “linker,” which can be the `ld` command,
    evoked by the GCC (GNU Compiler Collection) compiler, or `llvm-ld`, evoked by
    the LLVM (Low Level Virtual Machine) compiler.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'FIGURE 14.16 The Copy Files build phase


    There are three other types of build phases that you can add to your target using
    the Add Build Phase button at the bottom of the editor. These phases don''t show
    up by default for a standard Cocoa application target.


    The Copy Files phase (Figure 14.16) lets you identify a path into which to copy
    the files you specify. You can choose a predefined destination path from the Destination
    pop-up or specify a custom path. Most often, a Copy Files phase would specify
    a location within a bundle (the bundle built by the target), but this phase can
    be used to copy files or even built products to a variety of locations. Predefined
    paths include a bundle''s Resources or Frameworks folders, the Shared Frameworks
    system path, and more. It''s not uncommon to have multiple Copy Files build phases
    in a target. For example, you may specify a framework you either built yourself
    or are including from a third-party source, and choose to copy it into the application
    bundle''s Frameworks path so the framework is available to the application at
    runtime (see Chapter 15). You might also add a Copy PlugIns build phase, with
    which you can copy a set of built plug-ins included with your main application
    into the application bundle''s PlugIns folder. The Subpath field lets you append
    a subpath to whichever path you''ve selected in the Destination pop-up. The “Copy
    only when installing” check box instructs Xcode to copy the files only when your
    current scheme''s build settings include the install flag. The Add and Remove
    buttons work the same way as in the other phases, allowing you to specify the
    files that are copied to the selected location.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_186_0.png)


    FIGURE 14.17 The Run Script build phase


    FIGURE 14.18 The Copy Headers build phase


    The Run Script phase (Figure 14.17) lets you run any script (by typing in the
    script editor field or dropping a script file into it). Again, you might have
    multiple Run Script phases in a given target. The Shell field lets you choose
    the shell you wish to use (it defaults to sh). Using the check boxes beneath the
    script field, you can choose whether to show the script’s environment variables
    in the build log and whether to run the script only when installing. You can specify
    input files from which your script can pull information, as well as output files
    into which the script’s results can be placed.


    The Copy Headers phase (Figure 14.18) lets you specify header files and their
    visibility for products such as frameworks, plug-ins, or drivers. The scopes (Public,
    Private, and Project) determine the visibility of the header in the built product.
    A public header is included in the product as readable source code; a private
    header is included in the product but is marked as private so clients know not
    to use its symbols directly; a project header is not included in the product and
    is meant to be used only by the project when building the target. The Add and
    Remove buttons work the same way as in the other phases, but in this case, when
    you add, you’ll see a sheet similar to Figure 14.4, but which lets you select
    only header files. Once added, a header will first appear in the Project scope.
    You can then drag it into Private or Public scope as desired.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_187_0.png)


    # FIGURE 14.19 The Build Rules tab


    # THE BUILD RULES TAB


    Xcode maintains a default list of predefined (system) rules that determine which
    file types are processed by which script or program during the build process.
    This is found under the Build Rules tab (Figure 14.19). For example, C source
    files are compiled using GCC System Version (which is LLVM GCC 4.2 in Xcode 4.0).
    The Build Rules tab lets you customize these rules or define new ones for the
    selected target.


    With the filter bar set to All, you see all the default system build rules and
    any target-defined rules. Set the Build Rules tab’s filter bar to Target to see
    the rules overridden or defined only for the target (that is, to filter out the
    default system rules).


    To customize a system build rule for a given file type, locate it in the list
    and click its Copy to Target button. The new custom rule will be added to your
    target, ready for you to specify the script or predefined program to use to process
    the file type. You can also add a rule to your target for a file type not covered
    by the system rules by clicking the Add Build Rule button at the bottom of the
    editor.'
  merge: -1
  img_proc: true
