- pgno: 256
  md: '# THREADS AND STACKS


    Chapter 3 introduced the Debug navigator, and Chapter 9 took you in for a closer
    look at features a typical developer will use most often. Here you''ll see several
    other features that more-experienced developers will be looking for.


    # REVIEWING THE DEBUG NAVIGATOR


    The button bar at the bottom of the Debug navigator has two controls (Figure 17.9).
    When activated, the button on the left side of the bar filters out any threads
    that aren''t relevant to the current debugging session. That is, only crashed
    threads and threads with debugging symbols available (those for which you have
    source code or have saved debugging symbols) will be shown. When the button is
    inactive, all threads are shown.


    The slider control affects how much of each thread''s stack you are shown. When
    the slider is all the way to the left (Figure 17.10), only the top frame of each
    thread''s stack is shown. When the slider is all the way to the right (Figure
    17.11), all frames of each thread''s stack are shown. As you slide the control
    from right to left, Xcode begins to collapse the stack by filtering out frames
    that represent recursive function calls, internal Cocoa API calls, disassembled
    object code, and finally all code that doesn''t belong to your workspace. Figure
    17.12 shows the slider three quarters of the way to the right with the collapsed
    portions of the stack represented by a dashed line.


    You also learned in earlier chapters that you can navigate to a method by clicking
    a stack frame in the Debug navigator. If source or disassembled object code is
    available for the frame, it will be displayed in the Editor area.'
  merge: -1
  img_proc: true
