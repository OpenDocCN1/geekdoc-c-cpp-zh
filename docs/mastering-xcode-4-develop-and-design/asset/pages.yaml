- pgno: 109
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_109_0.png)


    You can replace specific instances by selecting them (hold down the Command key
    and click individual results) and clicking the Replace button. This will replace
    only those instances with the replacement term. To replace all instances, click
    Replace All. Xcode will replace the desired instances, and the changes will be
    saved automatically when you build or close your project.


    # PREVIEWING REPLACEMENTS


    Xcode has a visual replacement preview interface for previewing replacements.
    When you click the Preview button, a sheet similar to **Figure 8.7** appears.
    The preview sheet lets you “cherry-pick” the replacements you want and view the
    effect each change will have before you apply it.


    To test this, assume you want to change only the `-sayHello:` action in your project
    to `-sayGreeting:`. You don’t want to change the actual message that is presented
    to the user, only the method name.


    Perform a case-sensitive search for **Hello**. Once you have results, make sure
    Replace is selected in the pop-up so that the replace options are revealed. Enter
    the term **Greeting** in the replace field.


    Click the Preview button to reveal the replacement preview sheet. As in Figure
    8.7, select the `-sayHello:` method declaration in the header file and the implementation
    in the implementation file. Leave the line with the `@"Hello World"` string deselected.
    You can do this by placing a check mark next to the desired matches in the left-hand
    outline view or by flipping the switches to the right in the preview panel.'
  merge: -1
