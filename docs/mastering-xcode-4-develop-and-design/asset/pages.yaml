- pgno: 221
  md: '# USING THE FRAMEWORK IN CODE


    Foo.framework doesn''t have any UI components, but it provides two classes: MyFoo
    and MyBar. You can verify this by creating an instance of two classes provided
    by the framework and logging their descriptions to the console. You''ll do this
    at application launch, as in the previous example, so navigate to the -applicationDidFinishLaunching:
    method of the TestAppAppDelegate.m source file and add the following to its body:


    ```

    MyFoo * foo = [[[MyFoo alloc] init] autorelease];

    MyBar * bar = [[[MyBar alloc] init] autorelease];

    NSLog(@"Foo says: %@", foo);

    NSLog(@"Bar says: %@", bar);

    ```


    Remember to add the following to import the framework''s header so Xcode is aware
    of the new symbols the framework provides:


    ```

    #import <Foo/Foo.h>

    ```


    TIP: If you''re unsure which header to include, you can either use AutoComplete
    or expand the framework itself in the Project navigator list, open its Headers
    subfolder, and take a look around. Also, most frameworks have an umbrella header
    named for the framework itself, such as “Foo.h” for Foo.framework or “WebKit.h”
    for WebKit.framework.


    Run TestApp and watch the debugger console''s output. You should see something
    like the following:


    ```

    2011-03-05 15:50:57.623 TestApp[40877:903] Foo says: <MyFoo:

    →0x1006f0b10> - Foo!


    2011-03-05 15:50:57.623 TestApp[40877:903] Bar says: <MyBar:

    →0x1006f1670> - Bar!

    ```


    To summarize, the extra steps to use a third-party framework are: adding it to
    your project, optionally copying it into the project folder when adding it, and
    embedding it into your application bundle so it''s distributed with the application.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# CREATING A **FRAMEWORK**


    In addition to using system and third-party frameworks, it can be useful to create
    your own. One simple benefit is that you can place code that is shared between
    a Mac OS version and an iOS version of your application in a single, common location.
    Both can link against the same framework and benefit from improvements and bug
    fixes from the same source.


    To familiarize you with this process, you’ll create a simple framework in a separate
    project and learn how to build it for release so it’s ready to use in other projects.
    In Chapter 16, you’ll learn how to combine projects into a single workspace, allowing
    Xcode to recognize it as a dependency and build and include it in TestApp automatically.


    # CREATE THE PROJECT


    To create a new project, choose File > New > New Project from the main menu. Choose
    the Framework & Library group under the Mac OS X section. Select Cocoa Framework
    from the list and click Next.


    The project options sheet (**Figure 15.10**) will appear. In the Product Name
    field, enter **TestAppSharedFramework** so you can distinguish it from the TestApp
    project. It’s also a good idea to make sure the Company Identifier value is the
    same as the one you gave for the TestApp project. You can deselect the Include
    Unit Tests check box for simplicity. Click Next.


    Select the “Create local git repository for this project” check box and select
    the same folder that contains the TestApp project folder (the TestApp folder’s
    parent). Make certain you don’t save it in the TestApp project folder, but one
    level above. Click Create to create the project. You should have a shiny new project
    window, as seen in **Figure 15.11**. Now you’re ready to add some code.'
  merge: -1
  img_proc: true
