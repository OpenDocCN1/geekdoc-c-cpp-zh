- pgno: 344
  md: '# THE TOOLBAR


    There are some important clusters of controls on the toolbar you’ll need to understand.
    Let’s explore each major grouping, starting on the left side of the toolbar.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_344_0.png)


    The Record and Target controls work closely together. Use the Target control to
    attach Instruments to any running process. Depending on how you launched Instruments
    (see the “Launching Instruments” section, later in this chapter), a target (the
    application you’re tracing) may already be selected. Use the Record controls to
    control the trace. From left to right, there is a pause button to pause and resume
    tracing the running program; the Record button to start and stop recording new
    tracks; and a restart button, which stops the current trace and starts a new one
    (producing a new track). If the program is not running when the Record button
    is pressed, it will be launched. If the program was launched by the trace session,
    pressing the Record button while recording will stop recording and terminate the
    program.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_344_1.png)


    The Inspection Range controls specify the range of time in the track’s timeline
    you want to inspect. Specifically, you can filter out all trace information that
    is not within the specified range. The left button marks the beginning of the
    time you want to inspect; the right button marks the end. Setting a beginning
    point with no end means start here and show me everything to the end; setting
    an end point with no beginning means show me everything from the beginning up
    to this point. The middle button clears the selected range.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Though not part of the toolbar, it’s important to understand how to specify
    a point in time. You do this by dragging the scrubber control to the desired location
    in the timeline. The scrubber control is located in the graduated bar just above
    the instrument tracks. The term scrubber comes from audio/video applications,
    where the time-pointer control is moved or scrubbed across a track to view and
    listen to the scrubbed region of time.


    The status control in the center of the toolbar shows (in hours, minutes, and
    seconds) the length of the current trace session (by default) or the currently
    displayed trace session and number of sessions in the document (if there’s more
    than one recorded) and provides controls (the left and right arrows) to switch
    between sessions. Click the small icon to the right of the time display to toggle
    between running time (the session’s length) and inspection time (the current position
    of the scrubber control).


    The View controls toggle the three primary views in a trace document’s interface.
    From left to right, the buttons toggle the Instruments, Detail, and Extended Detail
    views. You’ll explore them in a moment.


    The Library control toggles the Library panel (Figure 20.5), which provides all
    available instruments. To add a new instrument to the trace, drag it from the
    Library panel and drop it into the Instruments list.


    The Search control filters the displayed trace information by symbol or library
    (to choose the filter, click the magnifying glass icon in the control’s left edge
    and select from the menu). For example, typing “drawRect” into the field will
    show only the trace information about the -drawRect: method provided by NSView
    (and any other methods containing “drawRect” in their names), assuming it’s been
    called during the recorded trace session.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_345_0.png)


    FIGURE 20.5 The Library panel'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# FIGURE 20.6 The Strategy bar


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_346_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_346_1.png)


    # FIGURE 20.7 The Status bar legend


    # THE STRATEGY BAR


    The Strategy bar (Figure 20.6) is new in Instruments 4. It gives you three main
    tracing strategies to choose from. The buttons on the left edge of the bar toggle
    between the (from left to right) CPU, Instruments, and Threads strategies. (All
    the figures in this chapter thus far have shown the Instruments strategy—the default
    strategy in Instruments 4.) The pop-up menus let you filter by core, process,
    and thread. An additional pop-up appears in CPU and Threads strategies, letting
    you specify additional chart options.


    The right-most button pops up a graphical legend (Figure 20.7) whose contents
    depend upon the chart mode (which colorizes the chart information). The legend
    shows each color used and what it represents in the chart.


    Figure 20.8 shows the trace session from Figure 20.3 using the CPU strategy. The
    application’s activity is divided according to the CPU core on which that activity
    took place. If you have more than one instrument in the Instruments list, use
    the pop-up below the Instruments list to switch between them and see their collected
    trace information (Figure 20.9).


    Figure 20.10 again shows the same trace session, this time using the Threads strategy.
    Here, the application’s activity is divided by thread (if you’re running Mac OS
    X 10.6 or later, you may see many threads here that you never knew were created).'
