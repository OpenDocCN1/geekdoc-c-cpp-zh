- pgno: 430
  md: '# EDITING KEYBOARD SHORTCUTS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_430_0.png)


    FIGURE B.1  Key Bindings preferences


    Keyboard shortcuts can be customized using Xcode’s Key Bindings preferences. To
    access these preferences, choose Xcode > Preferences from the main menu, then
    select the Key Bindings tab.


    **Figure B.1** shows the Key Bindings preferences. You can create your own command
    sets (a set of customized keyboard shortcuts) by using the Add (+) button at the
    bottom of the list to create a new set. You can then edit each shortcut by double-clicking
    its Key field and pressing the keyboard shortcut (the combination of keys) you
    wish to trigger the event. The list can be filtered using the search field or
    by selecting one of the categories (All, Menu, or Text) from the bar above the
    list.'
  merge: -1
  img_proc: true
