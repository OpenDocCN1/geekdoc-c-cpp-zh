  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_77_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_77_1.png)


    **FIGURE 5.18** Cut-off controls in a small window


    **FIGURE 5.19** Setting window size constraints


    # CONSTRAINTS


    Run TestApp once again and play with the window size. Notice how the text field
    now grows and shrinks. And notice that if the window gets too small, the button
    is cut off and the field gets a little too narrow (Figure 5.18). This is a limitation
    of the springs and struts model: The only way to apply any kind of constraints
    is by setting a minimum size so things don’t get smoothed together or cut off.


    The simplest fix is to set a minimum window size. Select the window, and in the
    Constraints section of the Size inspector, select the Minimum Size check box and
    set a reasonable minimum size (such as 200 by 150), as shown in Figure 5.19.


    Now when you run TestApp and play with the sizing, the controls should more or
    less behave themselves. You may need to play with the minimum window size or the
    sizes of the text field and enclosing custom view to get it right.


    # USING AUTOLAYOUT IN LION


    As mentioned, Lion (Mac OS X 10.7) introduces a new layout mechanism called Autolayout.
    Although it certainly has vast improvements over springs and struts (and a nifty
    layout language all its own for use in code), its use is not compulsory on Lion
    or above. That is, the springs and struts mechanism will still work as it always
    has. In fact, you must turn on Autolayout for each Interface Builder document
    in which you intend to use it, otherwise springs and struts still rule. Correspondingly,
    Autolayout can only be used with applications that target OS X 10.7 and above.


    > **NOTE:** You’ll need to be running Xcode version 4.1 or later to use the Autolayout
    features of the editor.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_77_2.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'FIGURE 5.20 The Interface Builder document''s file settings


    FIGURE 5.21 The Mac OS X 10.7 upgrade prompt


    # ACTIVATING AUTOLAYOUT


    To activate Autolayout for MainMenu.xib, navigate to it and make sure the Utility
    area is visible with the File Inspector panel selected. Under the Interface Builder
    Document section (Figure 5.20), select the Use Autolayout check box.


    You may be prompted to upgrade your project’s minimum deployment version to Mac
    OS X 10.7 if it’s set to a lower version, as in Figure 5.21. Click the Continue
    and Upgrade button to accept the upgrade.


    > NOTE: Accepting the Autolayout upgrade and setting the minimum deployment version
    to 10.7 means your application will not run on versions of Mac OS X prior to 10.7.
    As mentioned, 10.7 is required for Autolayout.


    # CONSTRAINTS


    You’ll notice something different immediately. Figure 5.22 shows the new Constraints
    entries in Interface Builder’s Objects dock. Constraints are real objects, just
    like buttons and windows. They define the sizing and positioning behavior of the
    controls they constrain. Because they’re real objects, you can select, configure,
    or remove them in Interface Builder the same as you would a button or a window.


    Figure 5.23 shows a vertical space constraint selected. This constraint manages
    the vertical space between the Say Hello button and the custom view’s top border.
    With Autolayout, dragging controls into a window or view and snapping them to
    the guides will automatically create the constraint that the system determined
    appropriate to maintain the best positioning.'
  merge: -1
  img_proc: true
