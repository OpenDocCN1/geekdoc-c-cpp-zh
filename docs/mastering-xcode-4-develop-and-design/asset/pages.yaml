- pgno: 339
  md: 'Instruments is Apple’s front end (and a few more things as well) to DTrace,
    a dynamic tracing system that records debugging and performance information about
    a running program. If you’ve never used it before, Instruments will revolutionize
    the way you profile and debug your applications. Once you’ve let it spoil you,
    you’ll wonder how you ever managed to make it out of the dark ages of leaks, zombies,
    and performance sinks.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_339_0.png)'
