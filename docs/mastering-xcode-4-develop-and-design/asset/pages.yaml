- pgno: 242
  md: '# ANOTHER KIND OF WORKSPACE


    FIGURE 16.11 The Behaviors panel


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_242_0.png)


    The term *workspace* has been overloaded in the software industry. Its meaning
    in Xcode is no exception. It makes sense that Xcode calls its new feature “workspaces”
    (a good name for a feature that binds projects together), but in the broader sense,
    *your workspace* refers more to the layout and configuration of your project.


    Your Xcode workspace includes, among other things, controls for whether or not
    certain auxiliary views are enabled. Xcode 4 helps you maintain control of your
    workspace by using behaviors. Under Xcode’s Preferences (Command-Comma), the Behaviors
    panel reveals a number of configurable options (Figure 16.11).


    Although there are many options, the feature is simple. Each item in the list
    on the left can trigger any of the actions on the right. Behaviors affect all
    projects and workspaces (the bound-together-projects kind). With Lion’s auto-hiding
    scroll bars, it’s easy to miss, but both the left and right lists are scrollable.
    Figure 16.11 shows the window large enough to see the contents of both lists without
    scrolling.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_243_0.png)


    FIGURE 16.12 The Behaviors menu


    # USES FOR BEHAVIORS


    An example of a custom behavior would be to not show the debugger when the app
    runs (“Run starts”) unless the application generates output (“Run generates output”).
    Another might be to create a new tab and navigate to the current run log in that
    tab if the app crashes (“Run quits unexpectedly”). The options are simple and
    speak for themselves. They allow navigation, activation of the various editing
    modes and assistant panels, running scripts, and so on.


    # DEFINING BEHAVIORS


    Xcode already has a number of common situations in the list on the left side of
    the Behaviors panel. To configure a behavior for a given situation, select the
    situation on the left and use the check boxes to enable each custom behavior.
    Those that are customizable have additional controls to the right of their check
    boxes. Situations that have defined behaviors have a check mark to the left of
    their names.


    # CREATING CUSTOM BEHAVIORS


    In Xcode 4.1, Apple has introduced custom behaviors. Although these behaviors
    aren’t triggered automatically like the built-in ones, you can create them and
    trigger them via the Xcode application menu (Figure 16.12) or with a custom keyboard
    shortcut.'
