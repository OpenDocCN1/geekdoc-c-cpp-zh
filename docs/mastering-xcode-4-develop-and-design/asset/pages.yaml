- pgno: 18
  md: '# DOWNLOADING


    The latest stable release of Xcode 4 is obtained through the Mac App Store. To
    download the installer, launch the App Store application from your Applications
    folder and search the store for Xcode. Click Install and log in if requested.


    As with any application purchased through the App Store, the installer (called
    “Install Xcode”) will appear on your dock with a progress bar tattooed on its
    icon. Go get some coffee because the installer is several gigabytes in size.


    # INSTALLING


    Once the download is complete, just launch the installer by clicking it in the
    Dock. If the Dock shortcut has gone away, you can find the installer in your Applications
    folder (again, it’s called “Install Xcode”). Just follow the on-screen instructions.
    The installer is very basic as the options you might know from previous versions
    have gone away. Xcode 4 overwrites any existing versions in your system’s /Developer
    folder. This is the default (and now, unchangeable) install location for the Xcode
    Tools suite. Once the installation is complete, you’ll have a very powerful software
    development suite at your fingertips. Just look in the /Developer/Applications
    folder of your system disk. Xcode and its friends live there.


    **NOTE:** The file you downloaded contains the tools and relevant SDKs. It does
    not contain the documentation for those SDKs, however. When you launch Xcode,
    it will check for the latest version of this documentation and download it in
    the background. These files are large as well. The processor, disk, and network
    activity this causes can be alarming, given that Xcode seems to be peacefully
    awaiting orders. You can turn off this automatic updating in the Documentation
    panel of Xcode’s preferences.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# EXPLORING


    Now that you’ve installed Xcode Tools, you can find it on your system disk under
    the /Developer folder unless you’ve chosen to install elsewhere. You’ll find Xcode
    and a number of other applications in the /Developer/Applications folder. Although
    this book concentrates on the Xcode 4 application, there are other important tools
    with which you should become familiar.


    Let’s explore some of the tools included in the suite.


    # THE BIG TOOLS


    There are three important applications in which you’ll spend most of your time.


    # XCODE


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_19_0.png)


    The Xcode integrated development environment (IDE) is the star of the suite. With
    Xcode, you create and manage projects, write and debug your code, design your
    UI, build your data models, write and run unit tests, and build and package your
    apps and plug-ins. You’ll spend most of your development time in Xcode. Some of
    these tools can be launched automatically from within Xcode (Instruments and the
    iOS Simulator, for example). This will be covered in later chapters.


    # INSTRUMENTS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_19_1.png)


    Instruments is Apple’s profiling and analysis tool. We’ll briefly visit Instruments
    in Part III, but this application could easily justify a book of its own. It could
    be loosely described as a luxury wrapper around DTrace (a performance measuring
    tool), but that would be understating its power. We’ll explore its most common
    uses for application development, which are profiling and memory management debugging.


    # IOS SIMULATOR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_19_2.png)


    Not all iOS developers can afford every iOS device on the market. Debugging an
    application directly on the device has some limitations as well. The iOS Simulator
    (previously named iPhone Simulator) provides a solution to both of these problems.
    We’ll explore the iOS Simulator in Chapter 17.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# OTHER HELPFUL TOOLS


    The following are some additional tools you are likely to use in a typical Mac
    or iOS project. These tools are also installed with the Xcode Tools suite.


    # HELP INDEXER


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_20_0.png)


    Mac OS users expect applications to come with the customary built-in manual, called
    a *Help Book*. This is a simple collection of HTML documents accompanied by a
    special—and required—index file for the OS X Help Viewer. The Help Indexer application
    processes your Help Book files and builds this index for you.


    # ICON COMPOSER


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_20_1.png)


    Mac OS and iOS applications use the `.icns` format. The Icon Composer application
    allows you to drop your appropriately sized artwork into the image wells and test
    your icon against various backdrops.


    # PACKAGEMAKER


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_20_2.png)


    PackageMaker is used to build Mac OS Installer packages. The Installer packages
    let you tell OS X where to install your application and other resources, as well
    as run various pre- and post-flight scripts (scripts that are run before and after
    the main installation) with administrative privileges if desired.


    # QUARTZ COMPOSER


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_20_3.png)


    Quartz Composer lets you create stunning visualizations for screen savers, interactive
    menu screens à la Front Row and Cover Flow, and more. The compositions can be
    self-contained or accept input from your application to affect various properties.
    Even non-developers can enjoy Quartz Composer, because it does not require writing
    a single line of code.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# WRAPPING UP


    Plenty of other helpful utilities (both GUI and command-line) exist in addition
    to those covered here. Consult the Xcode user guide (found under Xcode’s Help
    menu) for details.


    > **NOTE:** In the Cocoa developer community, you’ll hear people refer to Interface
    Builder as a separate application. Prior to Xcode 4, Interface Builder was indeed
    a separate application. It is now integrated into Xcode.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_21_0.png)'
  merge: -1
