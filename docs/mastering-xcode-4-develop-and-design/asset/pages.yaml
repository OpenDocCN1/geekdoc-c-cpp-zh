- pgno: 114
  md: '# COMPILE-TIME DEBUGGING


    FIGURE 9.1 A compiler issue highlighted in the Source Editor


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_114_0.png)


    FIGURE 9.2 An analyzer issue highlighted in the Source Editor


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_114_1.png)


    In Xcode, errors, warnings, and analyzer results are collectively called issues.
    Xcode is constantly compiling and checking your code for issues. Errors are red,
    warnings are yellow, and static analyzer issues are blue. Like any modern integrated
    development environment, Xcode flags issues by highlighting them directly in the
    source code (Figure 9.1) with a corresponding icon in the gutter along the left
    edge of the Source Editor. In addition to the immediate issues in the selected
    source file, all issues Xcode finds in your entire workspace are displayed in
    the Issue navigator (as described in Chapter 3).


    # USING THE STATIC ANALYZER


    Xcode integrates the Clang Static Analyzer, which goes a step beyond basic compiler
    errors and warnings. It knows enough about C, Objective-C, and Cocoa patterns
    to find memory management problems, unused variables, and more. Its integration
    with Xcode means it can show an impressive amount of detail, including the path
    of execution leading to the problem and the conditions that caused it along the
    way. Figure 9.2 shows an analyzer issue. In this case, an instance of NSArray
    has been created on one line and leaked on the next. On each line, the instructions
    that led to the problem are highlighted and explained.


    NOTES: You can learn more about the Clang Static Analyzer at http://clang-analyzer.llvm.org.


    More complicated analyzer scenarios are explored in Chapter 17.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_115_0.png)


    **FIGURE 9.3** The Fix-it window suggesting a fix


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_115_1.png)


    **FIGURE 9.4** The undeclared Bob build error in the Log navigator


    # FIXING ERRORS WITH FIX-IT


    You can fix common errors with Xcode’s Fix-it feature. When you click an issue
    in the Source Editor, Xcode will display a pop-up window with suggestions for
    possible fixes if it has any to offer (**Figure 9.3**). To apply a suggested fix,
    click the suggestion in the Fix-it pop-up. The code will be changed according
    to the chosen fix.


    # USING THE LOG NAVIGATOR


    The full results of each build are stored in the Log navigator, which you explored
    in Chapter 3. You can filter and explore the results. Double-clicking an issue
    will navigate to the corresponding file. **Figure 9.4** shows a build error that
    resulted when class Bob was referenced but not declared. It’s a good idea to expand
    issues by clicking the disclosure triangle to the left of the issue. This reveals
    crucial details about the issue that can help you figure out how to fix it.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# RUNTIME DEBUGGING


    FIGURE 9.5 TestApp paused in the debugger


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_116_0.png)


    For runtime debugging, Xcode integrates with GDB and the new LLDB debugger. Xcode
    provides a UI for managing breakpoints, controlling program execution, exploring
    the threads and stacks of the running application, accessing the debugger console,
    and more.


    By default, all newly created Xcode projects are run in the debugger. The application
    will pause at the point of failure if it crashes or at any breakpoints you set
    if they’re encountered. The Debug area (Figure 9.5) appears when running an application
    with a debugger attached. The current instruction is highlighted with a green
    arrow in the Source Editor gutter.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_116_1.png)


    NOTE: Whether or not a debugger is attached to the running application is controlled
    by the active scheme. Schemes are covered in Chapter 14.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "![](img/d4b18a89aece4a6ccac4cb886bdef5f7_117_0.png)\n\n# USING THE DEBUGGER\
    \ BAR\n\nThe basic program execution controls—including Step Into, Step Over,\
    \ Continue, and others—and the Threads and Stacks navigator are located in the\
    \ Debugger Bar (Figure 9.6) at the top of the Debug area. You can pause a program\
    \ (or trigger other actions in Xcode) by setting breakpoints. You can navigate\
    \ threads and stacks using the navigation pop-up.\n\n# USING THE BASIC CONTROLS\n\
    \n+   - The Pause/Continue button pauses and resumes program execution. The keyboard\
    \ shortcut for this action is Control+Command+Y.\n+   \n+   - The Step Over button\
    \ executes the currently highlighted instruction while execution is paused. If\
    \ the instruction is a routine, the routine is executed and the debugger stops\
    \ at the next instruction in the current file. The keyboard shortcut is F6.\n\
    +   \n+   - The Step Into button executes the currently highlighted instruction\
    \ while execution is paused. If the instruction is a routine, the debugger moves\
    \ on to the first line of that routine and pauses. The keyboard shortcut is F5.\n\
    +   \n+   - The Step Out button finishes the current routine and jumps back to\
    \ the calling routine or next instruction after the routine was called. The keyboard\
    \ shortcut is F8.\n\nYou can find additional debugger actions under the Product\
    \ > Debug submenu of the main menu.\n\n> **TIP:** Holding Option or Option+Shift\
    \ while clicking the step buttons will vary the functionality of the buttons.\
    \ You can step through assembly instructions or through only the instructions\
    \ in the current thread. See the Xcode documentation for details."
