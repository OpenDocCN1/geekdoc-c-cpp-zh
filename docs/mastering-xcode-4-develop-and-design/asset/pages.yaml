- pgno: 122
  md: '# FIGURE 9.13 Examining a variable in the Source Editor


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_122_0.png)


    # FIGURE 9.14 The continue-to-here button


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_122_1.png)


    # INTERACTING WITH THE SOURCE EDITOR


    While the application is paused, you can interact with the debugger directly in
    the Source Editor in several helpful ways.


    # INSPECTING VARIABLES IN THE SOURCE EDITOR


    The Variables panel isn’t the only way to examine the state or content of variables
    in the debugger. While the application is paused, you can hover the mouse pointer
    over a variable to examine it as long as it is within the current scope. A yellow
    box will appear, showing the details of the inspected variable (Figure 9.13).


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_122_2.png)


    > NOTE: You’ve seen that pointers to Objective-C objects can be examined in the
    Source Editor, in the Variables panel, and when using the print object command
    in the console. The information that is displayed is the result of calling the
    -description method, inherited from the NSObject class.


    # USING CONTINUE-TO-HERE


    Sometimes it may be advantageous to continue to a point in your code farther down
    from where you’re currently paused or to continue through a loop back to the top.
    You can continue execution to the desired point using the continue-to-here command.


    To continue execution to a chosen instruction, hover your mouse pointer over the
    gutter next to the instruction. A green button will appear (Figure 9.14). Click
    the button to execute up until that instruction.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# MOVING THE EXECUTION POINTER


    You can drag the execution pointer and place it anywhere within the local scope.

    You can use this to skip parts of code or to jump backward to repeat instructions.

    To move the execution pointer, grab the green arrow along the left edge of the
    Source Editor and drag it to the desired instruction.


    Moving the execution pointer backward to repeat instructions will not undo the
    instructions that were just executed. It will execute them again when you continue
    or step through your code. If you are new to debugging, missing this distinction
    can be confusing.


    # USING THE DEBUG NAVIGATOR


    As you learned in Chapter 3, the Debug navigator shows the threads and stacks
    when execution is paused in the debugger. This view represents the same information
    found in the Threads and Stacks navigator in the Debugger Bar. You can organize
    the navigator by thread or by Grand Central Dispatch queue.


    You can further refine the navigator using the controls at the bottom. The button
    at the left side of the slider (∑), when enabled, filters the threads and stacks
    to show only the threads that have your code in them or for which debugging symbols
    exist. The slider controls how much stack detail to show—the left side shows only
    the top frame of each stack while the right shows all stack frames.


    > **NOTE:** For more information about Grand Central Dispatch, refer to the Apple
    developer documentation.


    # WRAPPING UP


    You should now have a firm grasp of the basic debugging facilities that Xcode
    4 offers. You’ll find more debugging techniques in Chapter 17. In the next chapter,
    you’ll explore Xcode’s graphical data modeler and use it to add some data management
    and storage capabilities to TestApp.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_123_0.png)'
  merge: -1
  img_proc: true
