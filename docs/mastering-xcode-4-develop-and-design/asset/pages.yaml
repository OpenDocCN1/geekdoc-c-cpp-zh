- pgno: 72
  md: '# LAYOUT


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_72_0.png)


    **FIGURE 5.11** Improperly behaving layout


    You’ve learned the basics of creating and wiring up a simple user interface. There’s
    one small problem, however. Run TestApp again if it isn’t running already, and
    try resizing the window. The controls stubbornly stay where they are, refusing
    to do something smart (**Figure 5.11**).


    There are, as of the release of Mac OS X 10.7 Lion, two mechanisms through which
    you can define the sizing and positioning behavior of views: the original “springs
    and struts” and the new Autolayout feature.


    > **NOTE:** Each of the two layout mechanisms has a well-defined API that allows
    you to use code to control layout behavior. Because this book focuses on Xcode
    and not Cocoa development, the coding topic will not be covered.'
