  md: '# CREATING **NEW FILES**


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_88_0.png)


    Xcode includes templates and options for creating a variety of common file types
    and adding them to your project. To begin adding a new file, choose File > New
    File from the main menu. A sheet similar to **Figure 6.3** will appear.


    The sheet contains a sidebar on the left that categorizes the available templates
    first by SDK and then by file type. The top area to the right of the sidebar contains
    the specific templates that are available for the selected category. Select your
    desired template there. The area immediately below the templates shows a description
    of the selected template.'
