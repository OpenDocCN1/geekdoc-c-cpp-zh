- pgno: 11
  md: '# WHAT YOU WILL LEARN


    This book is divided into three major parts and includes four appendixes on the
    book’s companion Web site.


    # Part I: The Basics: Getting Started with Xcode 4


    In very short order, you’ll install Xcode and get down to business building a
    useless application. Nobody but perhaps your mother would buy it, but it very
    neatly demonstrates the Xcode 4 project workflow and how to find your way around
    a project.


    # Part II: Working with Cocoa Applications


    Next, you’ll learn how to build and edit user interfaces, add resources, and customize
    the application. You’ll explore all major aspects of the Xcode user interface
    and its primary editors. You’ll learn to refactor code, to use the debugger and
    the Core Data modeler, and to archive builds for deployment (independently or
    via the App Store).


    # Part III: Going Beyond the Basics


    Then you’ll dive a little deeper and explore Xcode’s build system (including the
    new schemes system). You’ll learn how to create and use libraries and frameworks
    and how to combine multiple projects into a single workspace. You’ll create and
    run unit tests and use custom scripts with the build process.


    Finally, you’ll take a solid tour of Instruments (Apple’s profiling tool) and
    experience its uncanny ability to point out your mistakes and make you feel stupid.
    Thoroughly abashed, you’ll wrap up with an overview of Xcode’s integrated source
    code management support.


    # Appendixes


    You’ll find four appendixes on the book’s companion Web site (http://xcodebook.com/extracontent).
    Appendix A helps you manage your iOS devices. Appendix B includes tables of gestures
    and keyboard shortcuts for frequently used tasks. Appendix C shows you how to
    manage Xcode documentation updates. Appendix D provides you with Apple and third-party
    resources for additional information.'
  merge: -1
  img_proc: true
