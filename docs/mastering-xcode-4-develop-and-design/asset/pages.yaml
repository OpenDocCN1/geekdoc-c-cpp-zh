- pgno: 151
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_151_0.png)


    FIGURE 12.2 The TestApp archive in the Organizer


    # FINDING THE ARCHIVE


    The archives of any given project are stored in the default Archives folder Xcode
    creates. The default folder is ~/Library/Developer/Xcode/Archives. You can change
    this and other locations in the Locations panel of Xcode''s preferences (Figure
    12.1). Archives are stored at the path labeled Archives Location. You can click
    the arrow button to the right of the path to open the folder in the Finder. Archives
    are organized by date (under folders named in YYYY-MM-DD format) and then by project
    name.


    The Archives tab of the Organizer (Figure 12.2) serves as a collection point and
    browser for the archives you create. Using the Organizer, you can annotate the
    archives as well as share them with others or submit them to the App Store. To
    open the Organizer, click the Organizer button in the toolbar or choose Window
    > Organizer from the main menu. When the Organizer window appears, select the
    Archives tab.'
