- pgno: 365
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_365_0.png)


    Source code management, also known as revision control or version control, is
    a form of change control that is vital to any medium-sized to large development
    project. In team environments, a full source code management system is often used
    for managing work that is done by multiple people on the same resources.


    Xcode offers two primary ways to manage your source code: by using snapshots and
    through its integration with two full source code management (SCM) systems. You’ll
    explore both in this chapter.'
  merge: -1
