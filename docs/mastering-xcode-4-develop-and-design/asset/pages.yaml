- pgno: 205
  md: '# ENTITLEMENTS (SANDBOXING)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_205_0.png)


    FIGURE 14.41 The Entitlements controls


    Application sandboxing is a security concept introduced in Mac OS X 10.7. Opting
    into this system makes your application more secure by limiting its access to
    various system resources unless specifically requested in the application’s entitlements.


    Because of the flexibility and openness of an Objective-C application, foreign
    code can be “injected” into the application or the application’s binary can be
    modified. This code would run with the same privileges your application enjoys.
    By voluntarily limiting your application’s system access to only those resources
    it actually needs, you are reducing the chances for malicious code to achieve
    whatever goal it has in its evil little bytes. Much could be said on the topic,
    and likely will be by plenty of other books, but as always, this book’s focus
    is on the IDE, not the technologies it helps you control.


    Xcode makes managing your application’s entitlements easy. To find their settings,
    navigate to the desired build target and click the Summary tab. The Entitlements
    section (Figure 14.41 contains a list of toggles and choices.


    > NOTE: Application sandboxing relies on code signing. For more information, see
    the Code Signing and Application Sandboxing Guide at http://xcodebook.com/codesigning.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_206_0.png)


    # ACTIVATING ENTITLEMENTS AND SANDBOXING


    You can turn on entitlements for your app by selecting the Enable Entitlements
    check box at the top of the list. You then choose an entitlements file from the
    Entitlements File pop-up. Xcode helpfully creates one matching the name of your
    target and adds it to your project (Figure 14.42). The file is a simple preference
    list. You can edit it by selecting it using the same preference list editor you’ve
    used elsewhere, but it is easier to use the Entitlements section you’re exploring
    now.


    To sandbox your application, select the App Sandbox check box. Now you must grant
    your application access to the functionality it needs.


    # SETTING SPECIFIC ENTITLEMENTS


    The remaining settings in the Entitlements section grant specific entitlements
    to your application.


    # FILE SYSTEM


    Use the File System pop-up to allow your application to read and write, to read-only,
    or to have no access to the file system. Select the Allow Downloads Folder Access
    check box to grant access to the Downloads folder regardless of the general file
    system access setting. File system access is disallowed by default.


    # NETWORK


    Use the Network check boxes to allow incoming or outgoing connections. Network
    communication is disallowed by default.


    # HARDWARE


    Use the Hardware controls to allow access to cameras, microphones, USB devices,
    and printers attached to or accessible by the system. None of these are allowed
    by default.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# APPS


    Use the Apps controls to allow access to the user''s address book and calendar
    data as well as to location services. None of these are allowed by default.


    # MEDIA FOLDERS


    Use the Music, Movies, and Pictures folders to access pop-ups that grant read-only
    or read and write access to each of these folders. Access is disallowed for each
    by default.


    # WRAPPING UP


    This chapter covers a lot of material, but Xcode''s new build system is easily
    the most important and arguably the most difficult concept to understand. An IDE
    is an environment that helps the developer manage the most basic actions performed
    during the course of development: building, running, debugging, testing, and deploying
    a product. The Xcode 4.0 approach differs significantly from that of previous
    versions and, as Xcode veterans will attest, has quite a learning (or un-learning)
    curve.


    In the next chapter, you''ll expand on this knowledge by exploring the concept
    of plug-ins and frameworks a bit further. Then, in Chapter 16, you''ll learn to
    work with Xcode''s workspaces concept and the true power of automatic dependency
    detection by combining a framework project with the TestApp project.'
  merge: -1
