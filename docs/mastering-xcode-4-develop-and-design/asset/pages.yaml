- pgno: 152
  md: 'FIGURE 12.3 The Info.plist file in the Property List Editor


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_152_0.png)


    FIGURE 12.4 The TestApp.app bundle in the Xcode archive file


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_152_1.png)


    # EXAMINING THE ARCHIVE


    Currently the only available archive format is the Xcode Archive (.xcarchive)
    format. An Xcode archive file is a package (a folder that appears to be a single
    file). This means you can view its contents in the Finder as well. To do this,
    right-click (or Control-click) the archive file and choose Show Package Contents
    from the context menu.


    Inside you’ll see the dSYM folder, the Products folder (where the built application
    resides), and an Info.plist file. The .plist (property list) file, which can be
    opened in Xcode’s Property List Editor (Figure 12.3), contains a description of
    the package’s contents.


    To find the application (TestApp.app), navigate through the Products folder. The
    products are placed in a folder structure mirroring that of the Installation Directory
    build setting for the target (see Chapter 14). When you get to the end of the
    trail of folders, you should see the TestApp application bundle, along with the
    icon you added to it in Chapter 11 (Figure 12.4).'
