- pgno: 340
  md: '# AN OVERVIEW OF DTRACE


    DTrace lets you trace your application as it runs. Tracing is logging information
    about a running computer program for debugging and performance analysis; it is
    used mainly by developers. Contrast this with “high-level logging,” which is used
    by end users and system administrators to log program errors, exceptions, failed
    scripts, and so on.


    Apple added DTrace support and debuted Instruments in Mac OS X 10.5. Instruments
    reduces the DTrace learning curve to manageable levels and makes a lot of traditionally
    difficult debugging tasks seem almost trivial by comparison.


    In DTrace, a probe is a script to perform a specific task. In the glossy, graphic
    realm of Instruments, a probe (or collection of interrelated probes) is more generally
    referred to as an instrument. A probe is essentially a script that watches for
    specific events and records relevant information.


    In the field of quantum mechanics, it’s been shown that the act of observing something
    changes its nature. This is true of profiling software as well. For example, adding
    a bunch of code to an application to track its performance will affect its performance.
    One of the most celebrated aspects of DTrace is its extremely minimal performance
    impact when a probe is enabled; and there is no impact for disabled probes. This
    means that for most developers, the act of tracing won’t have a noticeable impact
    on the application’s performance profile. Because of this, DTrace can be used
    on production systems without slowing them down.


    TIP: You can run DTrace from the command line by using the dtrace command. Type
    man dtrace in the Terminal and press Return to learn more.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_340_0.png)'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# A TOUR OF INSTRUMENTS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_341_0.png)


    # FIGURE 20.1 The template chooser sheet


    An entire book could (and should) be dedicated to DTrace and Instruments. The
    long list of available instruments continues to grow, and many require a solid
    grasp of one or more debugging and profiling techniques. This section will use
    as examples the three most common tasks for which the typical developer would
    use Instruments. First, however, you’ll need to get familiar with Instruments’
    user interface.


    # AN OVERVIEW OF THE INSTRUMENTS USER INTERFACE


    When you first launch Instruments, you’re given an empty document and prompted
    to choose a template for the trace document that Instruments will create for you.
    A template is one or more instruments configured in a particular way. Figure 20.1
    shows the template chooser sheet with a number of templates. This sheet, like
    Xcode’s template chooser sheet, is broken down into categories: iOS, iOS Simulator,
    Mac OS X, and User (templates you’ve created and supplied).


    > TIP: The trace operations you perform are done inside an Instruments trace document.
    A document contains the instruments and their configuration as well as every trace
    session recorded into it. It can be saved for later review, and future trace sessions
    can be appended to it.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_341_1.png)'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# FIGURE 20.2 An Instruments trace document


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_342_0.png)


