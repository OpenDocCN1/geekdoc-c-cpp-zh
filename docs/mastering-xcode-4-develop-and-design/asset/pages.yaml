- pgno: 262
  md: '# VIEWING MEMORY


    The easier way to inspect the contents of your application’s memory requires pausing
    the application at least momentarily and locating the memory address you want
    to view by the variable that represents it. This works the same way as setting
    a watch. This time, however, when you right-click the variable, choose View Memory
    of “variableName” from the menu. A new group called Memory will appear in the
    Debug navigator with the address you chose to view under it (Figure 17.17). When
    a memory address is selected in the Debug navigator for viewing, the memory’s
    contents are displayed in the Editor area (Figure 17.18).


    The view is manipulated via the controls at its bottom (Figure 17.19). The Address
    field shows the exact memory address the view will begin with. The Memory Page
    controls let you page forward and backward. The Number of Bytes control lets you
    adjust the memory page size you’re viewing. The Byte Grouping control lets you
    control how many bytes are grouped together as a single word.


    The Lock button’s behavior isn’t as intuitive as the rest. Your first thought
    might be that it locks the memory contents, preventing it from being modified.
    This is not the case. Instead, it lets you lock the current view of the contents
    from being updated. Since the memory view is normally updated as the memory changes,
    locking the display prevents it from being updated until you unlock it again.
    The memory continues to be changed (or not) as it normally would be while execution
    continues, but what’s displayed will remain the same as it was when you locked
    it.


    Since the memory addresses are valid only while the application is running, all
    viewed addresses are removed from the Debug navigator when the debugging session
    ends. If you’d like to remove an address during the session, simply select it
    and press the Delete key.'
