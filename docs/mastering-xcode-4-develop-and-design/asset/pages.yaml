- pgno: 65
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_65_0.png)


    # THE EDITOR AREA


    The Editor area (Figure 5.2) is where you construct the interface. This involves
    dragging interface elements from the Utility area’s object library into the canvas
    (the grid area) of the Editor and sizing and positioning them as needed. You can
    also create interface elements and controller objects by dragging them into the
    Dock, immediately to the left of the canvas.


    The dock bar along the left side of the Editor (to the left of the grid) in Figure
    5.2 is expanded to show more detail about the objects contained in the xib. Use
    the button at the bottom of the dock to expand or collapse the dock.


    Only user interface elements (such as buttons and windows) can be dragged into
    the canvas. Instances of controllers aren’t part of the user interface but are
    created or represented in the nib to serve as a connection point between the UI
    and your code; therefore, they exist only in the Dock.


    You can make connections to outlets by holding down the Control key and dragging
    from the controller in which the outlet is defined to the desired interface element.
    The controller could be File’s Owner (the controller to which the contents of
    the nib belong) or some other controller object that you’ve instantiated in your
    nib.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_66_0.png)


    FIGURE 5.3  The connections window


    You can make connections to actions by holding down the Control key and dragging
    from the interface element to the controller that defines the desired action.
    For example, a button could be connected to a Create User action. More than one
    user interface element (such as a menu item) can be connected to a given action.
    The sender of the action is always passed along to the action, allowing you to
    respond differently depending on the sender or to query the sender for its state,
    such as whether a check box is selected or deselected.


    Right-clicking an object in the Editor displays a semitransparent window that
    contains a list of the object’s outlets, the outlets of other objects that reference
    it, and actions the object can receive (Figure 5.3). Connections can be formed
    from this window by dragging a connection from the circle that is to the right
    of a given outlet or action to the target. To disconnect an outlet or action,
    click the X in the middle of the connection.


    The Jump Bar follows the same hierarchy as the windows and views in the nib and
    represents the currently selected object. For example, the selected object could
    be a button within a tab view within a window within the nib.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_67_0.png)


    **FIGURE 5.4** The Utility area showing available Interface Builder inspectors


    **FIGURE 5.5** The Connections inspector


    **FIGURE 5.6** The Interface Builder Object library


    # THE UTILITY AREA


    When a nib is selected in the navigator, the Utility area (**Figure 5.4**) adds
    additional inspectors to the File and Quick Help panes, such as the control’s
    style, auto-sizing settings, and animation settings. Select any element or controller
    object in the canvas or the Dock to view or adjust its properties using the inspectors.


    Connections can also be formed with the Utility area, using the Connections inspector
    (**Figure 5.5**). This inspector is similar to the window that appears when right-clicking
    an object in the Editor, and it behaves in the same way.


    Below the inspectors is the Libraries pane mentioned in Chapter 3. The Object
    library (**Figure 5.6**) contains a list of standard Cocoa objects as well as
    objects belonging to other frameworks and code libraries (such as QTKit or WebKit).


    The pop-up at the top filters the list by library while the search field at the
    bottom filters by search term. Hovering the mouse pointer over an object provides
    a description of the object if one exists. Drag an object from the library to
    the canvas or the Dock to add it to the nib (or to a specific view or window).
    You can also double-click an object to add it.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# THE ASSISTANT


    As you learned in Chapter 3, the Assistant acts as a secondary editor that can
    display “counterparts” to the selected project member. In the case of a nib, the
    counterpart is the interface (usually in a separate header file) of the class
    represented by the File’s Owner placeholder or that of a selected controller object.


    Using the Assistant with Interface Builder goes a step beyond simply allowing
    you to add outlets and actions by typing them yourself. You can add actions and
    outlets by dragging a connection from a control directly into the class interface
    source code in the Assistant area. Xcode responds by inserting the appropriate
    source code for the action or outlet.


    # AVAILABLE ASSISTANT BEHAVIORS


    *Automatic* behavior shows the files Xcode considers to be the best choice for
    the selected item or view in the xib.


    *Top Level Objects* behavior shows the objects at the “top” of the xib’s object
    hierarchy. This can include the windows and views as well as any instantiated
    objects (such as custom classes and ready-made object controllers).


    *Sent Actions* behavior shows any files containing actions called by the selected
    item.


    *Outlets and Referencing Outlets* behaviors show any files containing outlets
    for the selected item or referenced by its outlets.


    *Class* behavior shows any file containing the class of the selected item.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# ADDING USER INTERFACE ELEMENTS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_69_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_69_1.png)


    Now that you’re familiar with Interface Builder, you’re ready to add some actions
    and outlets to TestApp. You’ll start by adding a button that displays the traditional
    “Hello World” in a dialog box. You’ll then add a text field with corresponding
    outlet in which to display the greeting.


    To prepare, locate and select the MainMenu.nib file in the Project navigator.
    Click the window icon in the Dock to open the application’s main window in the
    canvas. Click the Assistant button so the Assistant area is visible, and make
    sure the Assistant is showing the TestAppAppDelegate.h file (the interface for
    the class represented by the File’s Owner placeholder of this nib). The project
    window should look similar to Figure 5.1.


    FIGURE 5.7 Dragging a connection into the Assistant


    FIGURE 5.8 The connection creator pop-up window


    # ADDING AN ACTION BUTTON


    To add the Hello World action, you’ll need a button. Find the Push Button control
    in the Object library, and drag it into the window. Double-click the button, set
    its title to Say Hello, and then press Return. Control-drag a connection from
    the button to the source code in the Assistant. For best results, place the action
    after the – (IBAction)saveAction:sender; line and before the @end directive, as
    in Figure 5.7.


    A pop-up will appear (Figure 5.8). Make sure the Action connection type is selected,
    and then type sayHello in the Name field. The method name is actually sayHello:
    (with a colon), but Xcode will add this for you automatically. Press Return or
    click Connect to add the action.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "![](img/d4b18a89aece4a6ccac4cb886bdef5f7_70_0.png)\n\nYou’ll need to add some\
    \ code to make the action do something interesting. Navigate to the TestAppAppDelegate.m\
    \ file (the implementation file for the TestAppAppDelegate class), and scroll\
    \ down to find the -sayHello: method. Edit it to look like the following:\n\n\
    ```\n```objective-c\n- (IBAction)sayHello:(id)sender {\n    [[NSAlert alertWithMessageText:@\"\
    Important Message\"\n                     defaultButton:@\"Hello Yourself\"\n\
