    \nClick the Run button to build and run the application. Give your Say Hello button\
    \ a test click to make sure it’s working. You should see something similar to\
    \ **Figure 5.9**. When you’re satisfied, quit the application and navigate back\
    \ to the `MainMenu.nib` file."
