- pgno: 174
  md: '# FIGURE 14.3 Selecting a project''s target


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_174_0.png)


    # FINDING YOUR PROJECT''S TARGETS


    When you create a new Xcode project, an initial target is created and configured
    for you, sharing the name you specified for your project. You can find every project''s
    targets by selecting the project itself in the Project navigator (Figure 14.3).
    You''ll recall the target view in Figure 14.3 (the result of selecting the TestApp
    target in the Targets list) from Chapter 11.


    Note the other target in the list: TestAppTests. This particular target produces
    a .octest bundle, which Xcode uses to run unit tests (see Chapter 18). Note the
    different icon—a building block signifying a plug-in bundle.


    # PROJECT-WIDE SETTINGS


    Selecting the TestApp project under the Project group reveals project-wide settings.
    These settings serve as the “global” settings used by the targets defined within
    it.


    The Info tab reveals three main groups: Deployment Target, Configurations, and
    Localizations.


    The Deployment Target group currently holds only one setting (depending on the
    platform—Mac OS or iOS): the minimum OS version for which your project''s targets
    are built.


    The Configurations group lets you define the configurations available to your
    targets. As mentioned at the beginning of the chapter, Xcode creates Debug'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'and Release configurations (and appropriate build settings for each) by default.
    Here you can add, rename, or remove configurations as desired. At the bottom of
    this group is an option to specify which configuration command-line builds use
    when builds are initiated using Xcode’s command-line interface (which is beyond
    the scope of this book).


    The Localizations group lets you specify to which languages your Cocoa applications
    are localized, which helps you automatically manage the individual copies of user
    interface and other resource files that are specific to a language. Localization
    is also beyond the scope of this book.


    # EXPLORING A TARGET


    Application targets (a standard Mac or iOS Cocoa application bundle) have the
    most settings, so the TestApp target is a good one to explore. Make sure you’ve
    selected it, as in Figure 14.3. You’ll explore each tab along the top of the editor,
    starting with the Summary tab.


    # THE SUMMARY TAB


    The Summary tab displays the basic information—mostly reflecting the options you
    chose when you created the project—in the top panel, titled Mac OS X Application
    Target. The Application Category pop-up menu is used to categorize the application
    if you plan to sell it in Apple’s App Store. The Identifier field is the canonical
    name you chose (which should correspond to your organization’s domain name in
    most cases). The Version number is the string that the Finder and the application’s
    About panel display for the application. The deployment target specifies the version
    of Mac OS for which your application is built. The image well, as you learned
    in Chapter 11, holds the application’s icon (and sets its corresponding configuration
    entry when a new .icns image is dragged into it).


    The next section, Linked Frameworks and Libraries, displays (and lets you edit)
    the frameworks and libraries to which your application is linked. This affects
    the Link Binary With Libraries build phase in the Build Phases tab. The Add (+)
    and Remove (–) buttons let you edit this information directly. Clicking the Add
    button reveals a searchable list of libraries and frameworks available on your
    computer from which you can choose (Figure 14.4). You can also choose Add Other
    from this sheet to locate a library or framework not present in the default locations
    that Xcode knows to search.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_175_0.png)


