  md: '# FIGURE 19.9 The Info tab for the TestApp target


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_332_0.png)


    # FIGURE 19.10 Duplicating the Release configuration


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_332_1.png)


    To do this, you’ll start by creating a “beta” configuration. Navigate to the TestApp
    project, and select the TestApp target in the Targets list. Click the Info tab
    if it’s not already selected (Figure 19.9).


    The beta configuration should be based on the Release configuration because you
    intend to present beta warnings in released copies of the application. In the
    Configurations section, select the Release configuration. Using the Add (+) button
    just beneath the list, choose Duplicate “Release” Configuration from the menu
    (Figure 19.10). Change the name from “Release copy” to Beta Release and press
    Return.'
