    Figure 19.7 shows the new script. The if condition on line 2 evaluates the `CONFIGURATION`
    variable to check for the Release configuration. Line 17 ends the conditional
    block (`fi` is `if` spelled backward).


    Test the script. Run the application normally—the script should not run. Now call
    the Archive action. This time the script runs and the Finder reveals your archive.'
