- pgno: 366
  md: '# XCODE SNAPSHOTS


    FIGURE 21.1 The project’s Snapshots settings


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_366_0.png)


    The simplest way to place your code under version control is to use Xcode’s snapshots
    feature. A snapshot is merely an archived copy of your entire workspace. Xcode
    lets you restore a snapshot, which is the equivalent of extracting a copy of the
    workspace folder from the time of the snapshot.


    It’s the most basic form of version control there is, and if you don’t use a full
    SCM system, you owe it to yourself to at least use snapshots. If you ever make
    complicated experimental changes that don’t work out, you’ll be thankful you took
    that snapshot before you started really messing things up. It’s so important,
    Xcode attempts to coerce you into enabling automatic snapshots the first time
    you use the Refactor features.


    # CONFIGURING SNAPSHOTS


    Snapshots can be configured by choosing File > Workspace Settings (or Project
    Settings, if you’re working with individual projects) from the main menu. The
    Workspace settings sheet will appear. Click the Snapshots tab to reveal the Snapshots
    settings (Figure 21.1).


    The check box controls whether snapshots are taken automatically before mass-editing
    operations (such as refactoring or workspace-wide find and replace). Since Xcode
    asks you if you want to enable automatic snapshots prior to your first use of
    a mass-editing feature, it’s unnecessary to enable this feature through this panel,
    but it can be useful if you want to disable it later in favor of a full SCM system.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_367_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_367_1.png)


    FIGURE 21.2 The Create Snapshot sheet


    FIGURE 21.3 A meaningful name and description


    The Snapshots Location control lets you store snapshots for the current workspace
    or project in an alternative location. The default is a location in your home
    folder, which lives alongside Xcode''s derived data and archive folders.


    Snapshot settings belong to individual projects or workspaces. That is, any settings
    you change here affect only the current workspace or project.


    # TAKING A SNAPSHOT


    You can create a snapshot of your project at any time by choosing File > Create
    Snapshot from the main menu (or by pressing Command+Control+S). You''ll be prompted
    for a name and description (Figure 21.2).


    Leaving all your snapshots named "New snapshot" and without a description would
    be useless to you later. A good name and description should be chosen so you can
    identify exactly at what point the snapshot was taken if you need to find it later.


    Choose whatever naming and description system works best for you, but you should
    definitely have a system. Figure 21.3 shows a possible name and description. Click
    Create Snapshot to take the snapshot. A complete copy of your workspace—exactly
    as it is now—will be archived and stored in the snapshots location that you specified.'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'FIGURE 21.4 The TestApp project''s snapshots


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_368_0.png)


    # MANAGING SNAPSHOTS


    Snapshots are managed in the Organizer window. Choose Window > Organizer from
    the main menu and select the Projects tab. Select the project or workspace whose
    snapshots you want to manage. Figure 21.4 shows the TestApp Suite workspace snapshots.


    In the figure, a filter bar is positioned directly above the list of snapshots.
    The search bar filters by keyword (in the title as well as the description). You
    can also choose to show all snapshots for the workspace or only those you took
    yourself (that is, you can exclude automatic snapshots).


    The list shows the snapshots sorted by date. Selecting a snapshot enables the
    Export Snapshot and Delete Snapshot buttons along the bottom edge. The Export
    Snapshot button will place an extracted copy of the snapshot into the location
    of your choosing, while the Delete Snapshot button will remove the snapshot permanently.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_369_0.png)


    FIGURE 21.5 The snapshot chooser sheet


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_369_1.png)


    FIGURE 21.6 The snapshot review sheet


    # RESTORING FROM A SNAPSHOT


    You can restore a snapshot by choosing File > Restore Snapshot from the main menu.
    Select the snapshot from the list (Figure 21.5) and click Restore.


    A sheet will appear (Figure 21.6). Choose the specific files you want to restore
    from the list on the left. To restore the entire project, just leave all the files
    selected. Click Restore. The project will be restored to the state it was in when
    you took the snapshot (or only the selected files will be, if you’ve not included
    all the files in the restore). As a bonus, Xcode will automatically create a snapshot
    just before restoring a snapshot so you can undo your undo. This will happen only
    if you enabled the “Create snapshot of project before mass-editing operations”
    feature.'
  merge: -1
