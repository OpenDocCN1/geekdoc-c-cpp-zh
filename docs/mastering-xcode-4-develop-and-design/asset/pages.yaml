- pgno: 417
  md: 'Xcode 4 comes with a number of standard keyboard shortcuts and multi-touch
    gestures.

    This appendix contains a list of both.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_417_0.png)'
