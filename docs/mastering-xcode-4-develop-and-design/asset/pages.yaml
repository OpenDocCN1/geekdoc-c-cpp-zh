- pgno: 98
  md: '# USING CODE COMPLETION


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_98_0.png)


    Xcode’s Source Editor provides code completion of symbols as you type. When you
    begin to type a symbol that Xcode recognizes from your project or linked libraries
    and frameworks, an inline suggestion as well as a list of other possible suggestions
    appears (Figure 7.7).


    You can choose to accept the inline suggestion by pressing Tab. To select an alternative
    suggestion, use the arrow keys to choose and then press Return to use the selection.
    When there is more than one suggestion for a given prefix (such as NSSet or NSSetFocusRingStyle()),
    the common prefix will be underlined and pressing Tab will complete only up to
    the underlined portion. Subsequent Tabs will complete to the next whole or part
    of the inline suggestion.


    Code completion can be canceled by pressing Escape or Control+spacebar. Completion
    can also be requested by placing the text insertion point at the end of an incomplete
    symbol and pressing Control+spacebar.


    Although Xcode will automatically suggest code completion while you type by default,
    you can turn this feature off in the “Text Editing” panel of Xcode’s preferences.
    To do this, toggle the check box named “Suggest completions while typing.” When
    this feature is disabled, you may still request suggestions by pressing Control+spacebar
    while the text insertion point is at the end of an incomplete symbol.


    Code completion uses the same information in the Symbol navigator, which you saw
    in Chapter 3. This information is derived from all available sources and libraries
    within the workspace, which means separate projects within the same workspace
    can share it among themselves. This feature is discussed in Chapter 16.'
  merge: -1
  img_proc: true
