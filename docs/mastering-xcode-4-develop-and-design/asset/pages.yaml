- pgno: 191
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_191_0.png)


    FIGURE 14.23 Establishing a target dependency


    Since the importer should be a part of the app, you would need to take a few extra
    steps for it to become part of TestApp. First, select the app’s target, select
    the Build Phases tab, and drag the importer target into the Target Dependencies
    build phase (Figure 14.23) to instruct Xcode to build it first so it’s available
    when building the application target. Then, add the importer target to the app
    target’s Copy Bundle Resources build phase. The next time you build TestApp, the
    importer will be built first, then copied into the app bundle’s Resources folder
    when TestApp itself is built.


    TIP: In Xcode 4.0, you cannot drag the importer target directly into the resources
    for some reason. You’ll need to click the Add (+) button and choose the product
    from the Products folder in the sheet.


    The importer would not function as it currently exists. To make it work, you would
    need to customize the code in the MySpotlightImporter.m source file to teach it
    to interpret the application’s data. You would also need to teach Spotlight, by
    other means, how to gather interesting information from the data model you created
    in Chapter 10. The importer is otherwise harmless if left in the TestApp project,
    so you could leave it, customize it to get it working if you’re feeling adventurous,
    or remove the target and its source and resources from the project to keep things
    tidy.


    NOTE: The code and knowledge necessary to customize the importer is beyond the
    scope of this book. Search the documentation for the Spotlight Importer Programming
    Guide for more information.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# WORKING WITH SCHEMES


    You learned that schemes tie together one or more targets with a build configuration
    and destinations. There is no hard set of rules that determines how many schemes
    a target has or how many targets a scheme has. Schemes are meant to be a simple
    way to switch between conceptual sets of these items—sets that make sense to your
    project and workflow.


    There are many ways you might use the system, but the simplest example is creating
    separate schemes for an Apple App Store build of your application and a build
    that uses your own customer relations and registration management system. You
    might have a separate scheme to run, analyze, test, and deploy a server-side registration
    key generator—a command-line program that is called from your Web store’s server
    upon successful payment. Any way you look at it, schemes are meant to give you
    an extra layer of flexibility as well as a collection point for these conceptual
    products and code/build/run/test/distribute scenarios.


    # FINDING YOUR PROJECT''S SCHEMES


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_192_0.png)


    Unlike many of the target-related settings, schemes are right in front of you
    at all times. The Scheme selector control, in addition to letting you select schemes
    and destinations, allows you to manage, edit, and create schemes. This control,
    which behaves similarly to the Jump Bar, is used to select the scheme and destination
    but is also used to edit the currently selected scheme or manage the list of schemes.
    The first (leftmost) segment lets you select the scheme or lets you create, edit,
    and manage schemes. The second (rightmost) segment selects the destination (Mac,
    device, simulator, and so on) available for the selected scheme.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# MANAGING SCHEMES


    Figure 14.24 shows the TestApp project’s schemes, which Xcode automatically created
    for each target (except unit test targets—see Chapter 18). Recall the Spotlight
    importer example from earlier in this chapter and note its presence in the schemes
    list. Because the app and plug-in targets are for Mac OS X only and support both
    32- and 64-bit architectures, each scheme has a 32- and 64-bit Mac destination.


    Choose Manage Schemes from the Scheme control to display the sheet shown in Figure
    14.25. The sheet lets you create, duplicate, delete, reorder, rename, and generally
    wrangle schemes within the current workspace.


    FIGURE 14.24 The Scheme pop-up’s menu


