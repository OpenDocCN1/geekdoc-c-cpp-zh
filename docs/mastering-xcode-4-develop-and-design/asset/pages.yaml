    **FIGURE 17.7** The highlighted fourth step of the memory issue


    The fourth and final step (**Figure 17.7**) reveals the end result: if ever the
    if condition on line 20 evaluates to false, the object in question will be accessed
    after having been released.


    This is a good demonstration of the power the static analyzer puts in your hands.
    It follows all the possible paths through your code, highlighting a problem if
    one series of logical branches is followed.


    > **NOTE:** The static analyzer is smart enough to know when Objective-C garbage
    collection is unsupported, supported, or required in your code and adjusts accordingly
    for memory-management-related issues.'
