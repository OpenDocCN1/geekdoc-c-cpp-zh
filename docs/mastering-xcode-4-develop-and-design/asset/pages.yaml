  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_202_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_202_1.png)


    # THE PROFILE ACTION


    The Profile action is Xcode’s gateway to launching Instruments, Apple’s code-profiling
    tool (covered in Chapter 20). **Figure 14.36** shows the Info tab of the Profile
    action editor. The Build Configuration, Executable, Working Directory, and UI
    Resolution settings all work the same as in previously discussed actions. The
    key setting here is the Instrument pop-up. The Ask on Launch setting will open
    Instruments’ Trace Template sheet (**Figure 14.37**), prompting you to choose
    a trace instrument to use when profiling your executable. All other settings in
    the pop-up launch the executable within Instruments with the chosen trace instrument
    selected.


    The Arguments and Options tabs work in the same way as those of the Test action.
    That is, you can specify arguments and environment variables or use the Run action’s
    settings.


    > **NOTE:** If you’ve selected Ask on Launch and Instruments is already running
    (that is, you’ve already selected a trace instrument the first time), subsequent
    calls to the Profile action will immediately run your executable using the previously
    chosen instrument without asking again. Close the Instruments window to be prompted
    again next time.'
