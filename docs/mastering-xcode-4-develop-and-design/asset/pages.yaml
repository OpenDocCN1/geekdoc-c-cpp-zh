- pgno: 248
  md: '# USING THE CLANG STATIC ANALYZER


    FIGURE 17.1 An issue highlighted by the static analyzer


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_248_0.png)


    FIGURE 17.2 A static analyzer issue expanded into steps


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_248_1.png)


    LLVM (the modular compiler) provides static analysis functionality via Clang,
    its C language family front end. The Clang Static Analyzer performs semantic analysis
    and can find logic problems, memory management errors, dead stores (unused variables),
    and API usage problems. This functionality is built right into Xcode.


    When you invoke Xcode’s Analyze action, the analyzer works to identify problems
    with your code. If an issue is found, it is flagged in the Source Editor and in
    the Issue navigator alongside errors and warnings (Figure 17.1). Clicking the
    issue in the editor or the Issue navigator reveals details about the issue in
    the editor, including helpful blue lines indicating the problematic code path
    with descriptions of your errant actions along the way (Figure 17.2).


    TIP: The Clang Static Analyzer can be run as a standalone tool, providing textual
    output of its analysis results. Its integration with Xcode is what provides the
    much nicer graphical interface.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_249_0.png)


    **FIGURE 17.3** The analyzer results bar atop the Source Editor


    For issues that are spread over longer bodies of code, following all the curved
    blue lines can be confusing. Xcode helps you with this in two ways. First, expanding
    an analyzer issue in the Issue navigator reveals the individual points in the
    problematic code path. Second, and by far more helpful, an analyzer results bar
    (similar to a search bar) appears at the top of the editor (**Figure 17.3**).
    This bar lets you navigate the analyzer issue step by step so it’s easier to follow
    along with the analyzer’s complaints.


    You can find some of the following issues with Instruments (see Chapter 20) and
    by using draconian warning levels, but the analyzer can find them while you’re
    coding and show you exactly where and how you went wrong. Apple’s own documentation
    suggests you get into the habit of analyzing early and often.


    > **NOTE:** Recall that errors, warnings, and analyzer results are called “issues.”


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_249_1.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# EXPLORING ANALYZER RESULTS


    Following are a few examples of the types of issues the static analyzer can identify
    for you, with a walk-through of each result.


    # MEMORY LEAKS


    A simple description of a memory leak in a Cocoa application is an object to which
    you’ve lost any references and which thus can no longer be told to release its
    memory and go away. In this sense, the object’s memory is “leaked” as it cannot
    be reclaimed for the remainder of the application’s lifetime. Further, the object
    keeps living, which, depending on what the object does, can cause unexpected and
    sometimes very bad behavior.


    Figure 17.2 showed an analyzer result for a memory leak. In this case, an NSString
    is leaked. From the top of the -init method, execution path is followed through
    the method. The issue is broken down into the two “steps” in the code that caused
    it.


    In the first step, the instruction on line 16 returns an object with a +1 retain
    count (which, in a memory-managed environment, makes you responsible for properly
    releasing the object when necessary). In the second step, the method returns without
    releasing (or autoreleasing) the NSString instance beforehand. This means the
    NSString instance has been leaked at this point.


    In the example, the fix is simple: Just uncomment line 19, where the string instance
    (assigned to message) is sent a -release (or you could send it an -autorelease).


    NOTES: The code examples used are “quick and dirty” demonstrations and should
    not be used as examples of good coding practices for a number of reasons.


    The memory management descriptions given here are oversimplified, but the particulars
    are beyond the scope of this book. For the purposes of this chapter, memory management
    issues refer to Objective-C objects in a manually memory-managed (versus garbage-collected)
    environment.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
