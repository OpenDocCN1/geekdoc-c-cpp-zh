- pgno: 169
  md: 'Xcode 4 offers an overhauled user interface for its build system that de-emphasizes
    switching between separate build configurations for Debug and Release and focuses
    more on what developers spend most of their time doing within the IDE: coding
    and debugging.


    Developers are meant to handle release builds with the Archive action. The Archive
    action in version 4.0 is heavily biased toward the preparation of a release build
