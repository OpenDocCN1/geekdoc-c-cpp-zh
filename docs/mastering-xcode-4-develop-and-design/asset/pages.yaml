- pgno: 336
  md: '# LIMITATIONS


    It’s important to understand the distinction between *compile* or *build time*
    and *runtime*. The C preprocessor processes source files prior to compilation.
    All effects on the source code happen when the code is *built*, not when it is
    *run*. You cannot, for example, use a preprocessor conditional to run one block
    of code if the application is running on Mac OS X 10.6 and another block of code
    if running on Mac OS X 10.5.


    > **TIP:** This is a good time to recall two things you read about in Chapter
    17: the Generate Preprocessed File command and the Assistant editor’s Generated
    Output behaviors.


    # WRAPPING UP


    You’ve seen how Xcode’s scripting hooks can be used to extend and automate various
    tasks. You’ve also explored the C preprocessor’s ability to provide macros with
    text replacement and conditionally include text in source. Armed with a basic
    knowledge of these two tools, Xcode can be extended and integrated into a much
    larger workflow, automating tasks and making them less prone to human error. In
    the next chapter, you’ll learn how to profile your code, and more, with Xcode’s
    companion application Instruments.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_336_0.png)'
