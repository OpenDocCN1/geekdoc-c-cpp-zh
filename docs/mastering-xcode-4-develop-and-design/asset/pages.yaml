- pgno: 433
  md: 'Xcode automatically downloads and installs documentation updates in the background.
    In addition, you can control the installed documentation sets and check for updates
    manually. This is controlled through the Documentation preferences panel.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_433_0.png)'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# SETTING DOCUMENTATION

    PREFERENCES


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_434_0.png)


    **FIGURE C.1** The Documentation preferences panel


    To open the Documentation preferences panel, choose Xcode > Preferences from the
    main menu, then select the Documentation tab. **Figure C.1** shows the preferences.
    Xcode downloads only what it considers “necessary” documentation sets at first.
    If you want missing libraries (the ones that are grayed out), you’ll need to press
    the GET button beside them. Xcode will download and install the documentation
    set and, from that point forward, will include those sets in its automatic update
    checks.


    Additionally, you can add third-party documentation sets using the Add (+) button
    at the bottom of the list. The documentation must come from an *http://* or *feed://*
    URL.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# FIGURE C.2 The documentation set information panel


    You can view information about the selected document set by pressing the disclosure
    button to the left of the Add button, as in Figure C.2. Finally, you can disable
    automatic updating and force update checks by using the controls just beneath
    the toolbar. The check box toggles the automatic updates, and the button forces
    a check and install immediately.'
  merge: -1
  img_proc: true
