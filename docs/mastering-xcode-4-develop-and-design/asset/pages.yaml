- pgno: 104
  md: '# USING THE SEARCH NAVIGATOR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_104_0.png)


    FIGURE 8.1 The Search navigator showing matches


    FIGURE 8.2 The search options context menu


    As mentioned in Chapter 3, initiating a basic search is simple. Type a term into
    the familiar search box at the top of the Search navigator and press Return. The
    results are displayed in the navigator outline (Figure 8.1), organized by source
    file. Selecting a file or a matching line within a file will cause Xcode to navigate
    to it in the appropriate editor. The search results themselves can be further
    refined by typing an additional term in the search field at the bottom of the
    Search navigator. You can start a project-wide search by choosing Edit > Find
    > Find in Workspace from the main menu.


    The basic scope of the search can be selected as you are typing the search term,
    before you press Return. A context menu will appear as you type (Figure 8.2),
    allowing you to limit the scope to your project or to your project and all frameworks,
    as well as choosing a "begins with" or "contains" type of search. You can select
    one of these options rather than pressing Return; Return always chooses the first
    option, which is defined by your chosen find options.


    TIP: You can jump immediately to the Search navigator by pressing Command+Shift+F
    (for Find). The search field is focused so you can immediately begin typing your
    search term.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_104_1.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_105_0.png)


    FIGURE 8.3 The Find Options panel


    # USING THE FIND OPTIONS


    A number of options are available to specify your search. Click the magnifying
    glass icon at the left edge of the top search field to reveal a context menu.
    Choose Show Find Options, and the Find Options panel will emerge (Figure 8.3).


    # USING THE STYLE OPTION


    This option allows you to specify a textual search or a regular expression search.
    A textual search matches the literal text term you type. A regular expression
    (or regex) search will search for patterns using the regular expression syntax.


    Although you can perform reasonably complex changes with carefully chosen search-and-replace
    strings, regular expressions are a far more powerful pattern-matching tool. Support
    for regex is built directly into many modern APIs and text editors. Although the
    subject is beyond the scope of this book, there exists an abundance of books and
    online tutorials.


    # USING THE "HITS MUST" OPTION


    This option allows you to specify the location of the search term within the searched
    items. That is, you can choose to view any results containing the term, only those
    that begin or end with the term, or only those that exactly match the entire term.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_106_0.png)


    # USING THE MATCH CASE OPTION


    This option lets you choose whether the search is case sensitive. For example,
    with Ignore Case selected, the term *hello* would produce three results across
    two files in your TestApp project: the **-sayHello:** method in your header and
    implementation files, and the @"Hello World" string in the body of the **-sayHello:**
    method. If you choose Match Case, there would be no results since all the instances
    of the word *hello* are capitalized.


    # USING THE “FIND IN” OPTION


    This option lets you narrow the scope to specific projects in a multiproject workspace
    or any custom scope you define. Workspaces are covered in detail in Chapter 16.
    Custom scopes are covered in the next section. You can also choose to include
    any frameworks your project links by selecting the “And linked frameworks” check
    box.


    # CUSTOM FIND SCOPES


    This powerful feature lets you define search scopes with user-defined rules that
    can match locations, names, paths, extensions, or file types. To define a custom
    scope, choose Custom from the Find In pop-up button menu. A sheet will appear
    listing custom scopes (empty by default) and their associated rules (**Figure
    8.4**).'
  merge: -1
