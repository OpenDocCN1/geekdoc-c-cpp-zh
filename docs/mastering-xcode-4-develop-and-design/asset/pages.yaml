- pgno: 355
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_355_0.png)


    FIGURE 20.19 Source code overlaid with a heat map


    Many developers’ knee-jerk reaction would be to blame the tight for loop. Of course
    it’s going to take a while to create ten thousand objects. Astute Cocoa / Objective-C
    developers will know better with such a contrived example, but here’s where the
    Time Profiler really shines. Double-click the -[TestAppAppDelegate doSomethingStupid]
    symbol in the list, and the Detail view will prove its name (Figure 20.19).


    In the figure, TestAppAppDelegate.m is displayed with some additional information
    overlaid. Instruments has broken down the time spent in that symbol (the -doSomethingStupid
    method) to highlight the most time-consuming instructions within it.


    To see the percentages (as in Figure 20.19), you may need to click the gear button
    in the upper-right corner and select View as Percentage from the menu. The overlay
    is color-coded to serve as a sort of heat map, where the color (ranging from “red
    hot” to “not-so-hot yellow” and beyond) represents how much time your computer
    spent executing the most time-consuming instructions.


    This makes one thing very obvious: The culprit isn’t the for loop, though it certainly
    takes time. The red-hot instruction (89.5 percent of the method’s time in the
    example above) was the line where you allocated and initialized an NSMutableArray.
    If you don’t already know why this is, here’s where Instruments gets even better.


    Click the Call Tree segment of the Detail view’s navigation bar to get back to
    the list of symbols. Deselect the Hide System Libraries check box to show all
    the system library calls in addition to those of TestApp. TestApp’s symbols should
    be gone, replaced by some system library symbols. Because the call tree is inverted,
    the deepest call in the stack is shown as top-level objects, and the top results
    are the calls that happened as a result of -doSomethingStupid.'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'FIGURE 20.20 TestApp call tree with system libraries


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_356_0.png)


    Expand the items until you see something similar to Figure 20.20. You see that
    -doSomethingStupid goes on to call into Cocoa, and it’s spending lots of time
    just creating the array. While it doesn’t tell you why, it certainly draws your
    attention to it. The reason, for those still wondering, is that you’re abusing
    -[NSMutableArray arrayWithCapacity:] by allocating a ton of memory you aren’t
    even using. Of course it’d take just as long to allocate all that space if you
    were using it, but the point is that the problem wasn’t where so many developers
    would’ve initially suspected (especially if that allocation were done in another
    part of the code).


    Although this was a contrived example, it neatly demonstrates Instruments’ powerfully
    intuitive way of visualizing trace information—a way that takes only a few clicks
    to reveal the source of a performance problem. Now that you know what the problem
    is, it might be easiest to use a saner capacity (especially since you already
    know you need 10,000 objects). Contrast this approach with using -[NSMutableArray
    array] to create the array by profiling both scenarios. You’ll see that the -arrayWithCapacity:
    approach is the better way to go, as long as you use it wisely.


    # FINDING LEAKS


    Reference-counted memory management, as offered in Objective-C, is difficult.
    It’s easy to “let go” of an object before you’ve had a chance to tell it that
    it’s no longer needed. As you learned in Chapter 17, such an object—or, more specifically,
    its memory—is said to have been leaked. This is because as long as the application
    is still running, you no longer have a reference to the object and can’t release
    it (hopefully causing it to be deallocated). That memory is now stuck until your
    program terminates. Worse, if your leak is triggered by something that happens
    often, your application will quickly eat up tons of memory. On iOS and (to a lesser
    extent) Lion, this will result in your application receiving a low memory warning
    and, eventually, being terminated by the OS.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_357_0.png)


    FIGURE 20.21 The Leaks instrument


    Leaks have traditionally been difficult to track down. Fortunately, Instruments
    makes it much simpler. To test this, let’s create and leak a single object in
    TestApp. You don’t need anything fancy—a simple NSObject instance will do. Add
    the following code to the -applicationDidFinishLaunching: method in TestAppAppDelegate.m,
    just after the call to -doSomethingStupid:


    ```

    NSObject * leaked = [[NSObject alloc] init];

    ```


    Now press Command+I to invoke the Profile action. When Instruments asks for a
    template, choose Leaks and click the Profile button. Since the Leaks instrument
    only analyzes the data every 10 seconds or so (and needs a few seconds to get
    started), let the trace run for 15–20 seconds before stopping it. Click the Leaks
    instrument to select it (the Allocations instrument is at the top of the list
    and is along for the ride to help out). You should see something similar to Figure
    20.21.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'FIGURE 20.22 The leaked object''s history


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_358_0.png)


    FIGURE 20.23 The leaked object highlighted in code


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_358_1.png)


    You’ll see that Leaks found exactly one leaked object. It’s an NSObject, just
    as expected. If you click the right-facing arrow to the right of its memory address
    (in the Address column), you’ll see the object’s history (Figure 20.22). It doesn’t
    have much of a history (a live object with a long life span might have pages worth
    of retains, releases, and autoreleases), but the history that’s there tells you
    everything you need to know. The Responsible Caller column indicates it was leaked
    in -applicationDidFinishLaunching:, just where you expected it to be.


    Double-click the history entry. Figure 20.23 shows exactly where in the code the
    object was leaked. By the time -applicationDidFinishLaunching: finishes, the reference
    to the object (named leaked) is no longer valid. You’ve lost any chance to tell
    that object that it’s no longer needed by sending it a -release or -autorelease.


    Often, you’ll need the object’s complex history to follow the lifecycle of an
    object that’s been created, handed around, and then mishandled rather than being
    properly destroyed when it’s no longer needed. Double-clicking each point in the
    history can not only help you identify where the object’s destruction was fumbled,
    but it can also provide insight on where the fumble really started (which can
    be well upstream of the fumble itself).'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# KILLING ZOMBIES (GO FOR THE HEAD)


    If leaks had an opposite, the *dangling reference*, or accidentally over-released
    object, would be it. A dangling reference is a pointer variable that wasn’t set
    to nil when its object went away (was deallocated) and that now points to an invalid
    memory address. It results in a crash with the telltale signal EXC_BAD_ACCESS,
    which is the operating system’s way of telling you you’re not supposed to be poking
    your nose around there anymore. These are officially many Cocoa developers’ least
    favorite memory management bugs.


    A mechanism, NSZombie, has existed for a long time that helps developers track
    down these pesky bugs. When “zombies” are enabled, the runtime, rather than deallocating
    objects, will turn the objects into zombies and keep them around. If a zombie
    is messaged (indicating your code tried to reference an object it shouldn’t have),
    the system flags it as a messaged zombie. Zombies aren’t bad things that happen
    to an object; they do developers an invaluable service. Then the developer bashes
    in their heads with a shovel.


    In the past, you’d have to pass an argument into your application manually on
    startup and then do a bunch of digging around to make sense of the results. You
    should now expect how much simpler Instruments makes it. To find out, replace
    the leaked object line from the previous example with these three lines (and make
    sure you get the spelling right—that’s *brraaiinns*):


    ```

    NSObject * brraaiinns = [[NSObject alloc] init];

    [brraaiinns release];

    NSLog(@"%@", brraaiinns);

    ```'
  merge: -1
  img_proc: true
