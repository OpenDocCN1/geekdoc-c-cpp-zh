- pgno: 141
  md: 'Both Mac OS and iOS use the same icon file format (.icns). Icon files are used
    primarily for application and document icons but can be used as standard images
    in your application like any other image format. In this chapter, you’ll learn
    how to use the Xcode Tools utility application Icon Composer to turn your artwork
    into icon files, as well as how to use these icons in your application.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# PICKING THE IDEAL ARTWORK


    The ideal artwork for a Mac OS or iOS icon is a PNG (.png) or TIFF (.tif) image.
    The image should use transparency to let the background show through “empty” areas
    of your design. You should also have a version of the artwork in 512×512, 256×256,
    128×128, 64×64, 32×32, and 16×16 sizes, each with an appropriate amount of detail
    for its given size. Though it takes more effort, this multisize approach helps
    the operating system maintain a crisp image no matter the size of the icon when
    displayed.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_142_0.png)


    For the examples in this chapter, I’ve created a simple piece of artwork that
    communicates the “test” nature of TestApp.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# CREATING ICONS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_143_0.png)


    **FIGURE 11.1** A filled-in Icon Composer document


    The Icon Composer application (found in the same folder as Xcode, under the Utilities
    subfolder) takes your artwork and generates an .icns file. Launch this application,
    and you’ll be presented with an empty document with a series of wells (one for
    each of the sizes listed in the previous section).


    # CREATING THE ICON DOCUMENT


    Drag your artwork into each of these wells. This would be the point where you
    drag the appropriately sized artwork into the matching well if your graphic designer
    has created icons with varying detail for each size. Otherwise, just drag the
    largest copy of the artwork you have into each well (**Figure 11.1**).'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'FIGURE 11.2 The new icon downsized against a desktop background image


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_144_0.png)


    # TESTING AND VERIFYING THE ICON


    Icon Composer provides a way to examine your icon at various sizes against various
    backgrounds. This allows you to make sure the drop shadow and alpha transparency
    look correct, and it shows how fine details appear when the icon is sized too
    small for such detail to survive (Figure 11.2).


    To use this feature, click the Preview button along the bottom edge of the icon
    document. You can then manipulate the pop-up to choose a background, and the slider
    to vary the size of the document.


    # SAVING THE ICON


    When you''re satisfied, save your document icon somewhere sensible. Give it a
    name such as TestAppIcon.icns. You can now use it to set your application''s icon
    using Xcode.'
  merge: -1
  img_proc: true
