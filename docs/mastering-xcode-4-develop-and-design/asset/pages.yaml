  md: '# GETTING DEBUGGER HELP


    There are an impressive number of commands available in GDB (and the list is growing
    for LLDB as well, as its development progresses). Getting help with these commands
    is easy. Type help in the debugger and press Return for a list of categories of
    commands. Type help categoryname to list commands that fall under the named category.
    Type help commandname for help on the given command. To use one of the previous
    examples, type the following into the console:


    ```

    help print

    ```


    Here are the first few lines of the debugger''s response:


    ```

    Print value of expression EXP.

    Variables accessible are those of the lexical environment of the

    → selected stack frame, plus all those whose scope is global or an

    → entire file.

    ...

    ```


    Remember to use the help command to find your way around the debugger''s toolkit.'
