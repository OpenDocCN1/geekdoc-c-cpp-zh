  md: "# EXPLORING THE  \n**SOURCE EDITOR** INTERFACE\n\n![](img/d4b18a89aece4a6ccac4cb886bdef5f7_94_0.png)\n\
    \nThe Source Editor (Figure 7.1) appears when you select source code files, when\
    \ you view issues within source code files, or when you stop at a breakpoint in\
    \ your own source in the debugger. This is the editor in which you will spend\
    \ most of your time.\n\nNote the gutter that runs along the left edge of the Source\
    \ Editor. The gutter can display breakpoints, line numbers, and the code-folding\
    \ and focus ribbon. Breakpoints are discussed in more depth in Chapter 9. You\
    \ can toggle line numbers and the code-folding ribbon via Xcode’s preferences.\n\
    \nWhen editing source code, the Assistant window—which you saw in Chapter 3—can\
    \ be used to open one or more files (or even separate parts of the same file)\
    \ alongside the file displayed in the main editor. The Assistant in this case\
    \ serves as a split-pane editor. You can use the various automatic modes (selected\
    \ in the Assistant pane’s Jump Bar), such as Counterparts, Includes, Categories,\
    \ and so on, which will cause the Assistant to display context-sensitive files\
    \ depending on the main selection in the Project navigator. You can add as many\
    \ panes as you like, and they’ll be arranged according to the settings you saw\
    \ in Chapter 3.\n\n> **NOTE:** The Source Editor also has a Version Editor mode,\
    \ the button to the right of the Assistant button.  \n> This feature is covered\
