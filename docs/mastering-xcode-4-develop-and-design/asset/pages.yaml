- pgno: 189
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_189_0.png)


    # ADDING NEW TARGETS


    There are several reasons why you might want to add multiple targets to a project.
    Your application might need a Spotlight plug-in (kept in its bundle’s Resources
    subfolder so OS X can find it easily). A Spotlight importer plug-in can be kept
    in a separate project, but it makes more sense to keep it within the same project
    as its parent application. Therefore, your project might have a separate target
    to build that plug-in (which would be a dependency of the application’s target
    and would be included in a Copy Files build phase that copies the built plug-in
    into the app bundle’s Resources folder when it is built). The same applies to
    other plug-ins, libraries, bundles, and so on.


    Another example might be two separate builds of the same application: a free version
    and a paid “Pro” version. Both applications might share 95 percent of the source
    code and resources but differ only in that the Pro version has the ability to
    access certain features, or in that the free version expires 30 days after its
    first launch. Or, because of Apple’s App Store policies, you might choose to link
    against, include, and use your own registration system in one build of your app,
    while using the App Store receipt validation process in an App-Store-only build.


    You might also add a unit test target, which executes unit tests against your
    code. Unit tests are covered in Chapter 18.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# FIGURE 14.22 The new target''s resources


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_190_0.png)


    To add a new target, use the Add Target button at the bottom of the editor while
    a target or project is selected. A sheet appears (Figure 14.21), similar to the
    one that appears when creating a new project. In the figure, a Spotlight importer
    target (for teaching the OS X Spotlight searching facility how to index your application’s
    information) is selected.


    If you were to click Next and continue defining the target to add to your TestApp
    project, you’d be prompted with much the same line of questioning as when you
    created the TestApp project (which was necessary to create the TestApp application
    bundle target). In the case of a Spotlight importer target, you only need to give
    it a sensible name (such as TestAppImporter) and a company identifier (preferably
    the same as that of your application). Xcode will add the target to the project’s
    targets list (complete with build settings appropriate to the target type), create
    a separate build scheme for the target, and add the necessary source and resources
    to the project, as seen in Figure 14.22.


    > NOTE: The New Target sheet is similar to the New Project sheet primarily because
    Xcode needs to know what kind of target (or targets) to add to your newly created
    project.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_190_1.png)'
