- pgno: 289
  md: '# THE CONTROVERSY


    Developers tend to be an obsessive lot. We like the *idea* of unit testing. It’s
    neat, predictable, and verifiable. The trouble is, many of us admit we don’t unit
    test. The most often cited reason is the amount of work it takes to create and
    maintain the tests to maintain “full coverage” of all your code’s functions (and
    all the possible scenarios those functions may face). For independent software
    developers in particular, the engineering time proper unit testing takes may be
    unacceptable for a number of reasons.


    Adding to the controversy is confusion over what exactly to test and how to test
    it. More specifically, those new to unit testing have trouble determining how
    to design the tests for their code. That particular subject is well beyond the
    scope of this book, so this chapter will focus on the tools Xcode provides, leaving
    the study of unit test design for a better-suited book. Whether or not unit testing
    is for you (and how best to approach it for your project) is up to you to explore.'
  merge: -1
  img_proc: true
