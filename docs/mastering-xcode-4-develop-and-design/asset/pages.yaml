- pgno: 298
  md: '# WRITING A UNIT TEST


    FIGURE 18.6 Adding a Person class


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_298_0.png)


    To create an appropriately illustrative unit test for TestApp, you’ll need to
    create something easily tested, design the test based on what you know must work,
    and then write the test to those specifications. In the following sections, you’ll
    do just that using a very simple Person class.


    # CREATING SOMETHING TESTABLE


    You’ll start by adding a Person class to TestApp. To do so, add a new Objective-C
    class to the project (to the TestApp target) by choosing File > New > New File
    from the main menu. Name the class Person and make it a subclass of NSObject.
    Make certain before saving that the new Person class is added to both the TestApp
    and TestAppTests targets (Figure 18.6) so it can be used by the test case you’ll
    write shortly. Click Save to add the file.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "Build a basic Objective-C class using the code below. Replace the entire contents\
    \ of your Person.m file with the following code:\n\n```\n```objective-c\n#import\
