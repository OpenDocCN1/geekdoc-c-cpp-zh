  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_348_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_348_1.png)


    # THE INSTRUMENTS VIEW


    The Instruments view (**Figure 20.11**) shows a list of all instruments (or cores
    or threads, depending on the selected strategy) in the top list. Each instrument
    can be selected by clicking it in the list. Once selected, pressing the Delete
    key will remove the instrument (and its data for all recorded sessions) from the
    trace document. Click the info button (i) to the right of each instrument to reveal
    a popover (**Figure 20.12**) that offers more trace recording data and track display
    options.


    > **NOTE:** The control immediately below the list of instruments zooms in and
    out of the timeline. It is not actually part of the Instruments view and remains
    where it is when the view is toggled. Similarly, the instrument chooser pop-up
    seen in Figure 20.9 belongs to the navigation bar of the Detail view.'
