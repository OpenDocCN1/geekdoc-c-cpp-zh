- pgno: 350
  md: '# FIGURE 20.15 The Detail view showing call tree information


    The main view (usually a table or outline) lists the individual data points that
    Instruments gathered about your application; the information it shows is specific
    to the selected instrument. Figure 20.15 shows the Objective-C–related call tree
    information collected by the Time Profiler. The top result reveals the method
    in which TestApp spent most of its time during the profiling session: the -drawRect:contentsOnly:
    method of the WebFrame class, which is part of the WebKit framework. This makes
    sense because I used TestApp’s Web window to navigate around a few Web pages for
    the duration of the trace. As a result, WebKit was busy drawing Web pages. You’ll
    explore the Time Profiler in more depth later in this chapter. Double-clicking
    entries in the list can often drill down into further detail. Again, this is instrument
    specific, so a general description is not possible here.


    # THE EXTENDED DETAIL VIEW


    The Extended Detail view (Figure 20.16) shows extended information about the selected
    data in the Detail view. As with the rest of the detail-oriented views, its content
    is instrument specific. In the figure, the view is displaying extended detail
    about the selected Time Profiler symbol in Figure 20.15. In this case, it’s appropriate
    to show the heaviest stack trace (the stack trace responsible for the bulk of
    the calls to the selected symbol). This view represents the same information as
    found in the Debug navigator. The slider on the bottom works in the same way as
    the slider in the Debug navigator as well—it smartly filters out “uninteresting”
    chunks of the stack trace, depending on its position.


