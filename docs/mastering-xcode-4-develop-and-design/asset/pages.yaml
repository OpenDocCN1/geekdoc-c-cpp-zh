  md: 'To fix this (and explore adding constraints), select the custom view and choose
    Editor > Pin > Leading Space to Superview from the main menu. Select the custom
    view again and choose Editor > Pin > Trailing Space to Superview. Your window
    should look something like **Figure 5.25**.


    If you run TestApp now, you’ll see that this didn’t quite fix things. Although
    the button stays the same distance from the field below it, and the custom view
    seems to be resizing (as evidenced by the text field’s left edge following along),
    nothing else seems to be behaving itself.


    The fix for the text field is easy enough. By snapping the left and right edges
    to the blue guides inside the custom view (**Figure 5.26**), the appropriate constraints
    are created for you automatically.


    **Figure 5.27** shows the constraints that were added as a result of your snapping
    the text field’s edges to the left and right guides. The constraints indicate
    that you want to maintain the space between the field’s sides and the sides of
    the superview’s bounds. Running TestApp once more shows that the Autolayout constraints
    now work as the original springs and struts did.


