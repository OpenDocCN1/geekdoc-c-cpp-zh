- pgno: 40
  md: '# THE JUMP BAR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_40_0.png)


    **FIGURE 3.9** The Jump Bar, TestAppAppDelegate.m selected


    **FIGURE 3.10** The Jump Bar pop-up menu showing members of TestAppAppDelegate.m


    The Jump Bar, found above the Editor area, shows you where you are in the organizational
    structure in your project (Figure 3.9). It additionally serves as a more compact
    version of the Project navigator. It is accessible even when the Navigator area
    is hidden and can be used to navigate your project by clicking any one of the
    segments and choosing a different path from the pop-up menu.


    The Jump Bar goes beyond the group and file level. It allows you to drill further
    down into the contents of the file. In the case of a source file, you can further
    select methods to jump around the file’s contents by clicking any segment after
    the file’s segment (Figure 3.10). With Interface Builder files, you can navigate
    the window and view hierarchy of your user interface.


    The Jump Bar also appears in Assistant windows (covered later in this chapter)
    and can be used to select various behaviors in addition to individual files.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# THE EDITOR AREA


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_41_0.png)


    The Editor area (Figure 3.11) dynamically switches between editors appropriate
    to the currently selected file (either through the Project navigator or through
    the Jump Bar). This means that, for source code files, you’ll see the Source Editor;
    for Interface Builder files you’ll see the Interface Editor, and so on. Among
    the other available editor types are the Data Model Editor, the Project Editor,
    the Version Editor, the Rich Text Editor, and more.


    Although it is called the “Editor” area, this is something of a misnomer where
    some items are concerned. Some items are not editable, which means the Editor
    area serves more as a “Viewer” area. For example, the area might display an image
    resource (such as the application icon) when selected; however, there is currently
    no image-editing facility in Xcode 4, so you can only view the image.


    The other major editors are covered in their related chapters throughout the book.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_42_0.png)


    # THE ASSISTANT


    The Editor area conceals a deceptively powerful feature called the Assistant (**Figure
    3.12**). The Assistant acts as a “split pane” editor with some added intelligence,
    depending on the behavioral mode you use. You can toggle the Assistant using the
    middle button of the Editor button bar that sits toward the right side of the
    toolbar area.


    The Assistant is a very flexible contextual tool that helps you perform common
    tasks ancillary to the current editing context. For example, in the Data Model
    Editor, if you select a Core Data entity with a corresponding managed object subclass,
    the Assistant can display that subclass for reference or editing. If you select
    a xib to edit in Interface Builder, the Assistant can show the source file corresponding
    to the xib’s File’s Owner class (see Chapter 5) or can show the class of the object
    selected in the Dock to facilitate establishing action and outlet connections.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_43_0.png)


    # OPENING FILES IN THE ASSISTANT


    When you turn on the Assistant using the toolbar, it displays the selected source
    file’s counterpart in a single pane in Manual behavior mode (where you choose
    what is displayed in the Assistant pane yourself using its Jump Bar). You can
    use the Assistant’s Jump Bar to view or edit any file in your workspace. There
    will always be at least one Assistant pane visible while the Assistant is active.


    # ADDING AND REMOVING ASSISTANT PANES


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_43_1.png)


    You can add or remove additional Assistant windows using the Add (+) and Remove
    (x) buttons in the upper-right corner of the existing Assistant pane (at the right
    edge of the panel’s Jump Bar).


    To add a new pane, click the Add button on any existing pane. The new pane will
    have its own Jump Bar and will be added after the pane whose Add button you clicked.
    That is, if you clicked the Add button of the last pane, the new pane will appear
    after the last one; if you clicked Add for the first of several panes, the new
    pane will appear after the first one. To remove a pane, click the Remove button
    on the desired pane.


    You can also open assistant panes using keyboard shortcuts. By default, holding
    down the Option key and clicking an item in the Project navigator will open the
    item in the Assistant when only one pane is present. If more than one pane is
    present or you perform an Option-Shift-click, Xcode asks you where you’d like
    to view the file with an intuitive destination chooser (Figure 3.13).'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_44_0.png)


    **FIGURE 3.14** The Assistant


    # CHANGING LAYOUT BEHAVIOR


    In the previous section, the phrase “after the pane whose Add button you clicked”
    is intentionally vague. This is because you can customize the Assistant’s layout
    behavior. To do so, choose View > Assistant Layout to see and select available
    layout modes (**Figure 3.14**).


    # ASSISTANT BEHAVIOR MODES


    You can change the Assistant’s behavior by clicking the segment of the Jump Bar
    immediately to the right of the navigation buttons. A menu appears (**Figure 3.15**)
    listing the available behaviors.


    When in Manual mode, the Assistant behaves like a glorified—if neatly arranged—split
    pane editor. Its real power is in its automatic behavioral modes. When you choose
    any behavior other than Manual, the Assistant becomes contextually aware. Depending
    on the chosen behavior, the Assistant shows files related to the file (or a subselection
    within it) currently displayed in the main editor (the selection in the Project
    navigator).


    The power of this feature becomes evident when you’re faced with a scenario where
    it’s necessary to edit a class’s implementation, header, and associated protocol,
    or when you select an object in Interface Builder’s Dock and need to add a new
    outlet or action while connecting it to the interface at the same time.


    When there is more than one related file that the Assistant can display, additional
    controls appear to the left of the Add and Remove buttons. The controls include
    standard back and forward navigation buttons with the count of available associated
    files between them. These controls are not visible if there are fewer than two
    available associated files. The count is shown in the Jump Bar when selecting
    the behavior mode.


    The term *selection* in this context means “the project member that is currently
    selected in the Project Navigator, shown in the main editor.”


    The available modes are explored in their related chapters.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_44_1.png)


    **FIGURE 3.15** The Assistant’s behavior modes in the Jump Bar'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# THE UTILITY AREA


    The Utility area **(Figure 3.16)** provides supplementary information and controls
    for the current editor. Essentially anything you would expect to be in a floating
    palette for the editor can be found in the Utility area. To toggle the Utility
    area, click the right button in the View button bar in the toolbar.


    Like the Editor area and its Assistant, the Utility area is highly contextual.
    Additional buttons representing various inspectors appear along the top, depending
    on what you’re editing. For example, while editing a xib, buttons will appear
    for the Attributes inspector, Size inspector, Connection inspector, and more.
    With a data model selected, the Data Model inspector button appears. In most situations,
    two inspectors remain omnipresent: the File inspector and the Quick Help inspector.


    The bottom panel contains the File Template library, the Code Snippet library
    (Chapter 7), the Object library (Chapter 5), and the Media library, which contains
    available template media (such as standard OS icons) as well as any media included
    in your workspace.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_45_0.png)


    **FIGURE 3.16** The Utility area'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# THE DEBUG AREA


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_46_0.png)


    **FIGURE 3.17** The Debug area


    The Debug area (Figure 3.17) appears by default when you run your application.
    You can also toggle it using the middle button of the View button bar in the toolbar.


    The Debug area is the primary interface for the debugger. It includes a control
    bar, a console, and a view for inspecting in-scope variables when paused. The
    Debug area and its controls are covered in more detail in Chapter 9.


    # CUSTOMIZING DEBUGGER BEHAVIOR


    You can customize the Debug area’s behavior in Xcode’s preferences, on the Behaviors
    tab. There you can choose what actions the debugger takes when certain events
    occur (including run, pause, unexpected quits, successful quits, and so on).


    For example, you could choose to show the Debug navigator when debugging starts
    or pauses. You could also choose to show the Project navigator and close the Debug
    area when the application quits normally. If the application quits unexpectedly,
    you could choose to show the Log navigator, navigate to the most recent run log,
    and play an alert sound to draw attention to the problem. Custom behaviors are
    covered in more detail in Chapter 16.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# THE ACTIVITY VIEWER


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_47_0.png)


    **FIGURE 3.18** The Activity Viewer


    The Activity Viewer (**Figure 3.18**) isn’t overly complicated and offers little
    interaction, but its prominent (and immutable) placement in the center of the
    toolbar makes it worth mentioning. It provides you with visual feedback of all
    the activities Xcode is performing on the workspace.


    When more than one activity is underway, the Activity Viewer alternates between
    them like an ad banner and displays the number of concurrent tasks on its left
    side. You can click the number to display a pop-up, which lists all the current
    activities and their progress individually.


    In previous versions of Xcode, the right side of each window’s bottom edge had
    its own status field showing the same information (mostly related to build and
    debug status). Xcode 4’s all-in-one approach makes it easier to have a single
    place to see the current status of any actions Xcode is performing.


    If there are any issues (errors, warnings, and so on), the number of issues will
    be displayed in the Activity Viewer as well. Clicking the issue counter will switch
    to the Issue navigator so you can find and review the issues.'
  merge: -1
  img_proc: true
