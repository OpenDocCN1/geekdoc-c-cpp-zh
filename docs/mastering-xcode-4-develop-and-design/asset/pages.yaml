- pgno: 100
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_100_0.png)


    # CREATING AND EDITING SNIPPETS


    To create a snippet, drag the desired “template” code into the snippet library.
    The snippet will be added to the list of available snippets. To edit the snippet,
    select it in the library. When the pop-up window appears, click the Edit button
    in the lower-left corner. The pop-up will reveal editing controls (Figure 7.10).


    You can set the title and description that appear in the library list, and the
    platform and language the snippet targets. You can also set a completion shortcut
    to use when editing code. Finally, you can edit the snippet itself. When you’re
    finished editing, click Edit or Done.


    An example of a useful snippet is a ready-to-go set of the three primary NSTableViewDataSource
    protocol methods. When using this protocol to populate an NSTableView programmatically,
    the quickest way to get up and running used to be to copy the method signatures
    from the documentation and then insert the brackets, the if conditionals for determining
    the table being operated on, and so on. Now you need to define this only once,
    format it as you want, and then save it as a snippet for reuse in any future projects
    and workspaces.


    You can also insert placeholder tokens that are the parts of the snippet (such
    as arguments) that must be filled in to complete the code. For example, to add
    a placeholder for an NSNumber argument, you would type <#NSNumber#> where the
    argument belongs. When the snippet is used, the text that appears between the
    hash marks is what will appear in the snippet. The token’s text should serve as
    a helpful prompt regarding what should be filled in when using the snippet.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# THE ASSISTANT


    When editing source files, the Assistant can act as a smarter split-screen editor,
    showing (and allowing you to edit) different parts of the current file or any
    other file of your choosing. As mentioned in Chapter 3, the Assistant can become
    contextually aware, depending on the behavioral mode you select.


    In any context, you can manually choose a file to display in the Assistant and
    of course create as many assistants (each with any behavioral mode you like) as
    you need.


    # AVAILABLE ASSISTANT BEHAVIORS


    *Counterparts* behavior shows files that are considered to be counterparts of
    the selected item. A counterpart might be the header file for a selected implementation
    file, or vice versa.


    *Superclasses and Subclasses* behaviors show any known superclasses or subclasses
    of the selection, respectively.


    *Siblings* behavior shows any files within the same Project navigator group as
    the selection.


    *Categories and Protocols* behaviors show available Objective-C categories or
    protocols for the selected file, respectively.


    *Includes and Included By* behaviors show all files that include the selection
    or those included by the selection, respectively.


    # WRAPPING UP


    You’re now familiar with the basics of Xcode’s Source Editor. Additional features,
    including the Refactor tool, Fix-it, and the ability to rename symbols, will be
    covered in depth in Part III. In the next chapter, you’ll learn how to perform
    a project-wide search and replace.'
  merge: -1
  img_proc: true
