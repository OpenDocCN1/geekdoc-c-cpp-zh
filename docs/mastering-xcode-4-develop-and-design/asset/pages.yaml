- pgno: 111
  md: '# SEARCHING WITHIN FILES


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_111_0.png)


    FIGURE 8.8 The Source Editor''s Find panel


    You can also perform a search or a search and replace within the currently selected
    source file in the Source Editor. The simpler UI works much the same way as the
    Search navigator, including additional options (by clicking the search field’s
    magnifying glass icon) and a replace field (Figure 8.8).


    To find a word or phrase, select Edit > Find > Find from the main menu. Enter
    a search term and press Return. You can navigate the matches within the file using
    the back and forward buttons to the left of the search field.


    Although there is no preview as with a project-wide search and replace, you can
    choose Replace All to replace all matches, Replace to replace the current selection,
    or Replace & Find to replace the current selection and select the next match.


    Click Done to close the Find panel.


    TIP: You can initiate a search within the Source Editor by pressing Command+F.
    This is similar to the Command+Shift+F shortcut that opens the Search navigator.
    You can navigate the matches by pressing Command+G to go to the next match and
    Command+Shift+G to go to the previous one.


    # WRAPPING UP


    You’ve seen how you can search and replace within your project or the currently
    selected file. The comprehensive set of options—including user-customizable, rules-based
    scopes—is flexible enough to help you find exactly what you’re looking for. The
    replace preview system lets you cherry-pick exactly what you want to replace.
    All this code editing and text replacing is bound to introduce bugs. In the next
    chapter, you’ll learn the basics of debugging an application using Xcode’s built-in
    debugger.'
  merge: -1
  img_proc: true
