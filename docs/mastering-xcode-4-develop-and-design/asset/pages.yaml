- pgno: 108
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_108_0.png)


    Click the Done button to close the sheet. The new scope is now selected in the
    Find In pop-up and will remain as one of the available search scopes. You can
    edit or delete it or add new scopes at any time by choosing the Custom option
    from the Find In pop-up.


    With Ignore Scope selected in the “Hits must” pop-up and the new HTML Source scope
    selected in the Find In pop-up, type **hello** into the search field again and
    press Return. Note there are no matches because the only files in your project
    that currently contain the term are not HTML files.


    # REPLACING TEXT


    To the left of the top search field is a pop-up button with Find selected. Click
    the pop-up and choose Replace. More options are revealed below the search field
    (Figure 8.6). An additional field, in which you can specify the replacement term,
    accompanies three buttons (Preview, Replace, and Replace All). When the navigator
    area is not wide enough to contain all three buttons, the Preview button is represented
    by an icon representing a loupe.


    > **NOTE:** The additional Find options revealed when choosing Show Find Options
    from the search field’s magnifying glass menu are also available when performing
    a Find and Replace.'
