  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_178_0.png)


    **FIGURE 14.8** More (to the row) than meets the eye


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_178_1.png)


    **FIGURE 14.9** Choosing keys


    **FIGURE 14.10** Some example document types


    The Custom Mac OS X Application Target Properties section lists all the basic
    parts of the property list that define your unique application (including version
    number, the principal class used to load the application, the main nib or xib
    file to use, and so on). Selecting an individual row reveals more aspects of the
    editor (Figure 14.8). Each row’s type (the key used to specify its corresponding
    value) can be edited by clicking the arrows to reveal a list of other available
    keys (Figure 14.9). Double-clicking a key or value lets you edit each directly.
    See the “Bundle Structures” section of the Bundle Programming Guide in Apple’s
    documentation for more information about the keys used and their meaning.


    The Document Types section holds any document types defined for your application.
    Since TestApp is not a document-based application, this section is empty by default.
    That’s not to say a non-document-based application can’t be given document types
    that it can recognize and provide viewing or editing capabilities for, however.
    Figure 14.10 shows an example of what some custom document types might look like.


    The Exported UTIs and Imported UTIs sections (also empty) let you define any UTIs
    (Uniform Type Identifiers) your application imports or exports. Defining UTIs
    here is a way of letting your application “claim” (and provide icons or system
    services for) a particular data type as well as define new data types and lineage
    that your application provides. See the Uniform Type Identifiers guide in Apple’s
    documentation for more information.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'FIGURE 14.11 The Build Settings tab


    FIGURE 14.12 A multiple-selection pop-up window


    The URL Types section allows you to define URL schemes your application understands.
    An example might be a URL that takes the form of testapptask://taskid and causes
    your application to be launched and display the task with the specified taskid.
    See the Launch Services Programming Guide in Apple’s documentation for more information.


    The Services section lets you define system services (such as Insert Employee
    ID Here), which can be accessed from other applications. See the Services Implementation
    Guide in Apple’s documentation for more information.


    # THE BUILD SETTINGS TAB


    The Build Settings tab (Figure 14.11) contains all the build settings for the
    selected target, grouped by category. The simplest view, as shown in Figure 14.11,
    can be seen by setting the filter bar (just beneath the tab bar) to show Basic
    and Combined. This instructs the editor to show you only the most commonly used
    settings and only the values for the selected target.


    For each setting, you can edit the matching value under the column named after
    your target. Some values are simple strings while others are presented in a pop-up
    menu. In cases where you can make more than one selection (such as the Architectures
    setting), you can select Other from the menu and you’ll be presented with a pop-up
    window (Figure 14.12) that allows you to add multiple selections. In the figure,
    an environment variable is used that, to Xcode, means the standard 32/64-bit universal
    binary.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_180_0.png)


    # FIGURE 14.13


    A per-configuration setting


    You can also have per-configuration settings. That is, separate settings for Debug
    versus Release configurations (or any others you define). In **Figure 14.13**,
    you see that the Strip Debug Symbols During Copy setting has an open disclosure
    triangle next to it and has separate settings for the two configurations—Debug
    and Release. It would be pointless to remove debugging information from a debug
    build, so the build system will strip debug symbols only from a release build,
    leaving them intact for debug builds. This is an excellent example of why different
    configurations (or at least separate settings for debug and release) are necessary.
    The information is removed from a release version to reduce the size of the executable
    and to improve performance.


    > **NOTE:** The disclosure control appears only for settings that already have
    per-configuration values defined.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_181_0.png)


    For projects with multiple targets (or workspaces with multiple projects), you
    may need finer control than you get by choosing Combined versus Levels in the
    filter bar. Choosing Levels reveals multiple columns after the Setting column,
    showing what the settings are for each “level” (Figure 14.14). From right to left,
    the columns represent global defaults down to project- and target-specific settings.


    Starting from the right and working to the left, you see the default settings
    for the platform (Mac OS Default). These settings cannot be edited because they
    are the same for every Mac OS target. All levels below this one inherit its settings.
    Project- and workspace-level settings come next, then target-level settings. The
    Resolved column shows the final state of all inherited settings for the selected
    target.


    The simplest example of the usefulness of multi-level inherited settings is the
    Product Name setting (exposed by the Packaging disclosure triangle). Each target
    produces an application bundle or executable, which must have a name. No two targets
    are likely to share the same name, so each target would have its own non-inherited
    name. Of course the product name isn’t specified at the OS or'
  merge: -1
