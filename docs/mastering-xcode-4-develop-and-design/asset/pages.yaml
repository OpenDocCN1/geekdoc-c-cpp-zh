    # FIGURE 6.4 The Save As sheet


    Some templates have additional options that allow you to specify things such as
    a superclass. Such options are displayed on the next sheet when you click the
    Next button. Keep clicking Next and you’ll eventually be prompted to save the
    file with a standard Save As sheet with a few additional options (Figure 6.4):
