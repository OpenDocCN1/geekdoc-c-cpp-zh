- pgno: 292
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_292_0.png)


    # POWERED BY OCUNIT


    It’s important to know that Xcode uses OCUnit, part of the SenTestingKit framework.
    OCUnit provides the test management and interface code, the Cocoa Unit Testing
    Bundle target template, and the Objective-C test case class template.


    # TEST TARGETS AND CLASSES


    The target links against `SenTestingKit.framework`. In its Compile Sources build
    phase, it contains not only the `.m` files of its test classes but those of the
    classes they test (since they must be compiled and linked so the test classes
    can use them).


    The test classes, as mentioned above, can be created using the Objective-C test
    case class template (accessed from the Add Files panel or by dragging the template
    file into the project from the File Template library, as in **Figure 18.3**).


    Again, it’s important to note that the test case classes and the classes they
    test against must be added to the unit test target. The test case classes are
    subclasses of the SenTestCase class provided by `SenTestingKit.framework`. The
    test case class template provides basic stub methods for setup and tear-down of
    the testing environment. Beyond that, it’s up to you to add individual tests in
    the form of methods. Test case classes are created for each class in your code
    base.


    > **TIP:** You can learn more about OCUnit by visiting www.sente.ch/software/ocunit.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# ASSERTING YOURSELF


    Tests ultimately pass or fail an assertion. Depending on what you''re testing,
    you will assert that a condition must be satisfied. For example, you may assert
    equality with an expected value, or that an exception must or must not be raised,
    or that a return value must or must not be nil. Following are some of the assertions
    provided by OCUnit with descriptions and basic example code for each.


    STAssertEqualObjects() generates a failure if the two objects passed to it are
    not equal.


    ```

    STAssertEqualObjects(objectA, objectB, @"One of these objects is not

    → like the other.");

    ```


    STAssertEquals() generates a failure if the two scalars, structs, or unions passed
    to it are not equal.


    ```

    STAssertEquals(myValue, kSomeConstant, @"myValue should be %f but

    → it''s %f. My world view is shattered.", myValue, kSomeConstant);

    ```


    STAssertEqualsWithAccuracy() generates a failure if two scalars are not equal
    to within some accuracy. In other words, if the accuracy is .1, the values 0.9
    and 1.0 would be considered equal. The primary use is for float or double scalars
    but works for others.


    ```

    STAssertEqualsWithAccuracy(piCloseEnough, M_PI, 0.005,

    → @"piCloseEnough (%) isn''t close enough to pi for our

    → tastes. Mmm. Tasty pi.", piCloseEnough);

    ```


    STFail() generates an unconditional failure. It''s useful for those edge cases
    the other assertions do not cover, as well as for cases where a certain block
    of code should never be reached (the line after a while loop that''s not intended
    to be broken, for example).


    ```

    STFail(@"Error: Hamster should not float; Q has changed the

    → gravitational constant of the universe.");

    ```


    STAssertNil() generates a failure if the passed object is not nil.


    ```

    STAssertNil(someNilObject, @"How exactly do you get something from

    → nothing?");

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'STAssertNotNil() generates a failure if the passed object is nil.


    ```

    STAssertNotNil(aValidObject, @"I visited this method and all I got

    → was this lousy nil.");

    ```


    STAssertTrue() generates a failure if the passed Boolean (BOOL) expression evaluates
    to false.


    ```

    STAssertTrue((M_PI == 3.0f), @"Professor Frink says pi is exactly

    → three!");

    ```


    STAssertFalse() generates a failure if the passed Boolean (BOOL) expression evaluates
    to true.


    ```

    STAssertFalse((1 == 1), @"We don''t BELIEVE in equality ''round THESE

    → parts, stranger!");

    ```


    STAssertNoThrow() generates a failure if the expression throws an Objective-C
    exception.


    ```

    STAssertNoThrow([someCalculatorObject addOneToThree], "The answer

    → is 4, you doIt. What went wrong?");

    ```


    STAssertThrows() generates a failure if the expression does not throw an Objective-C
    exception.


    ```

    STAssertThrows([someCalculatorObject divideByZero], @"Wait, what?

    → What result did YOU get?!");

    ```


    Each test should contain at least one assertion. Some argue that each test should
    include only one assertion so that the test''s name (the method signature) is
    precisely descriptive of what is being tested, making the precise failure easier
    to identify should it arise.'
  merge: -1
  img_proc: true
