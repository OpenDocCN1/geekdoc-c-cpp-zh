- pgno: 282
  md: '# USING THE DEBUGGER


    There’s nothing special required to use all of Xcode’s debugging facilities with
    the iOS Simulator. Breakpoints, the Debug navigator, and the Debug area all work
    in exactly the same way.


    # DEBUGGING ON iOS DEVICES


    You just read that the debugger works as expected with the iOS Simulator. The
    same is true when debugging your applications on an iOS device as well. There
    are only a few differences.


    # DEVICES MUST BE PROVISIONED


    Your device *must* be provisioned for development. Please see Appendix A for more
    information regarding provisioning and managing your iOS devices.


    # DEVICES MUST BE UNLOCKED


    Your device must be unlocked. That is, if your device is passcode-protected and
    requires entering the passcode to unlock it for use, you’ll need to first unlock
    it before Xcode can use it for development. It must also remain unlocked for the
    duration of your debugging session.


    # DEVICES MUST REMAIN CONNECTED


    You’ll need to leave the device connected. If you unplug the device during a debugging
    session, you won’t be able to reconnect during that session. You’ll have to stop
    the session in Xcode, make sure the device is plugged in again and that it is
    selected as a run destination in the Schemes pop-up (since it disappears when
    your device disappears), and then begin a new session.'
  merge: -1
  img_proc: true
