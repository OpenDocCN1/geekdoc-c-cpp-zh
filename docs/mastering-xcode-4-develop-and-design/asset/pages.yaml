- pgno: 33
  md: 'In the previous chapter, you created a Cocoa application project called TestApp.
    In this chapter, you’ll explore the anatomy of this project and familiarize yourself
    with Xcode’s user interface.


    Earlier versions of Xcode allowed users to select a multiple-window interface,
    but the default was single-window (where most views related to the open project
    were contained within the same window). Single-window mode wasn’t quite single-window
    mode, however; a number of auxiliary windows could appear. In Xcode 4, Apple has
    taken the all-in-one-window design approach much further.


    If it’s not open already, open the TestApp project you created in Chapter 2.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_33_0.png)'
  merge: -1
