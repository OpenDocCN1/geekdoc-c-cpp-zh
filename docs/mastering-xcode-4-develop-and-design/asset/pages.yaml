- pgno: 23
  md: 'Xcode comes with a number of template projects to make it easier for developers
    to get started. Beyond templates for Mac OS and iOS applications, there are templates
    for command-line tools, AppleScript applications, frameworks, bundles, plug-ins,
    Spotlight plug-ins, IOKit drivers, and more.


    In this chapter, you’ll create a basic Cocoa application, which you’ll use throughout
    this book to explore Xcode.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# WELCOME TO XCODE!


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_24_0.png)


    You can find Xcode in the /Developer/Applications folder (assuming you chose this
    default location when you installed Xcode Tools). When you launch the application,
    you’ll be presented with the Welcome to Xcode window, as shown in Figure 2.1.


    You can use this welcome window to start a new project, check out an existing
    project from a source code repository (such as Subversion or Git), open the documentation
    viewer, or visit Apple’s developer site. You can also ask Xcode not to show you
    this window on startup again.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# CREATING A NEW PROJECT


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_25_0.png)


    To create a new project, click the “Create a new Xcode project” option on the
    welcome screen. You can also choose File > New > New Project from the main menu
    at the top of the screen. You’ll be presented with a sheet from which you can
    choose a project template, as shown in **Figure 2.2**.


    # EXPLORING THE TEMPLATES


    Let’s take a moment to look through the available project templates Xcode offers.
    The left panel separates the template categories by their types (such as Mac OS,
    iOS projects, and any third-party template types you may have installed). Beyond
    the obvious platform categorization, the templates are further subdivided by the
    type of product (application, plug-in, framework, and so on) you’ll be building.


    In most cases, selecting an individual template yields an Options bar, allowing
    you to choose common subtypes (such as document-based versus non-document-based,
    static library versus dynamic, and so on) and optional subcomponents (such as
    Spotlight importers or Cocoa views for plug-ins).


    Most projects will be Mac OS or iOS applications.


    **FIGURE 2.2** The New Project template sheet'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_26_0.png)


    # CREATING A TEST PROJECT


    Let’s create a test project with which to explore. To do this, choose the Application
    category under the Mac OS X type and then click the Cocoa Application template.
    Click Next to continue. Xcode will respond by asking you for some additional information
    to customize your project, as shown in **Figure 2.3.**


    The Product Name field is where you would put your application’s name in most
    cases. Let’s call our product TestApp in the interest of clarity. This not only
    determines the name of your project file and its enclosing folder but the name
    of your built product (your application, plug-in, library, and so on).


    The Company Identifier field is just as important as your product name. This identifier
    is used to create your bundle identifier. The bundle identifier, in turn, can
    be used as a unique identifier for your application’s preferences file, its document
    files, its associated Spotlight importer, and many other things. Apple encourages
    developers to use a reverse-ordered ICANN domain name. Assuming your domain is
    *yourcompany.com*, your company identifier would be *com.yourcompany*. Xcode fills
    in your app’s name (substituting illegal characters as needed) to form your project’s
    bundle identifier (displayed below the Company Identifier field).'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Although only the Product Name field is required, you should always provide
    a suitable company identifier. The identifier doesn’t necessarily have to correspond
    to an existing domain, but it should be unique.


    The App Store Category pop-up lets you select a general category under which your
    application would fall if you choose to deploy to the Mac App Store. Since you
    won’t be submitting TestApp to the App Store, you can leave that set to None,
    its default.


    The next three options (Create Document-Based Application, Document Class, and
    Document Extension) let you use a document-based application template. A plain
    Cocoa application (Create Document-Based Application deselected) is intended for
    applications that do not work with individual files as documents; a document-based
    Cocoa application uses the Cocoa document architecture to open and manipulate
    document files. For simplicity, TestApp will not be document-based, so leave that
    option deselected.


    The Use Core Data option adds support for Cocoa’s object graph management and
    persistence framework, called Core Data. Select this option so you can explore
    the Data Model Editor in Chapter 10.


    The Include Unit Tests option will add support for unit tests to your project.
    Select this option to include unit tests, which you’ll explore in Chapter 18.


    The Include Spotlight Importer option adds a Spotlight importer plug-in as a dependent
    build target to your project’s application target. When you add the necessary
    code, Spotlight—the Mac OS X search facility—will use the importer to add the
    data you provide to its search index automatically. Leave this deselected, and
    leave Spotlight importer plug-in programming for another book.


    Different project and option choices can cause different fields to appear when
    creating a new project. Consult the Xcode documentation (covered in Chapter 4)
    for further details about these options.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_28_0.png)


    Once you’ve filled in the requested information, click Next to continue. Xcode
    will present a Save As dialog box. Select the option to create a local Git repository
    for this project. You’ll explore Xcode’s Git (and Subversion) support in Chapter
    21. Choose a convenient location (such as your desktop), and click Save. You should
    now have a basic Xcode project ready to go, as shown in **Figure 2.4.**'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# PROJECT MODERNIZATION\n\n![](img/d4b18a89aece4a6ccac4cb886bdef5f7_29_0.png)\n\
    \n**FIGURE 2.5** Warnings of  \noutdated project settings\n\nFor those who weren’t\
    \ born (as Mac or iOS developers) yesterday, Xcode introduces the concept of “project\
    \ modernization.” As much fun as it is to create brand new projects full of new\
    \ possibilities, many of us have existing projects that were created in earlier\
    \ versions of Xcode.\n\nThese preexisting projects often contain settings that\
    \ are not compatible with modern versions of Xcode. Fortunately, Xcode not only\
    \ finds these problems but offers to fix them as well. It even lets you pick the\
    \ fixes to apply, since its idea of “fixing” may not necessarily agree with yours.\n\
    \n# MODERNIZING A PROJECT\n\nWhen opening projects that were created with previous\
    \ versions of Xcode, you might notice some warnings appear in the Issue navigator\
    \ (**Figure 2.5**), informing you of issues that need cleaning up.\n\n> **NOTES:**\
    \ Project modernization was introduced in Xcode version 4.1 and is not available\
    \ in 4.0.\n> \n> The Issue navigator is explored in Chapter 3.\n\n![](img/d4b18a89aece4a6ccac4cb886bdef5f7_29_1.png)"
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_30_0.png)


    Selecting the issue (or choosing Editor > Check for Outdated Settings from the
    main menu) will display a Build Settings sheet (Figure 2.6) summarizing the changes
    that Xcode thinks you should make. Deselect the check box to the left of any settings
    you think Xcode ought to ignore.


    To perform the selected changes, click Perform Changes. To cancel without performing
    any changes, click Cancel. To ignore the selected issues, select Don’t Perform
    Changes. The separate Perform Changes and Don’t Perform Changes buttons let you
    accept some updates and then come back and instruct Xcode to ignore others.


    Remember that you can always check for outdated settings at any time by choosing
    Editor > Check for Outdated Settings from the main menu.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# BUILDING AND RUNNING AN APPLICATION


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_31_0.png)


    **FIGURE 2.7** The new Cocoa application


    At this point you have a fully functional—if uninteresting—Cocoa application project
    that is ready to be built and run. To see your application, click the Run button
    in the project window toolbar (or choose Product > Run “TestApp” from the main
    menu). Xcode will build the project from scratch (because this is the first time
    it’s been built) and then launch it. After a short time, you’ll see your application’s
    empty window (Figure 2.7). It’s not particularly exciting at the moment, but it
    is a functioning application at this point, even without customization.


    The Run button doesn’t just trigger a build and run. You can click and hold the
    button to reveal a menu of other actions similar to those found under the Product
    menu. These actions include Test, Profile, and Analyze. Each of these will build
    the project automatically if it needs building before performing the requested
    action. These other actions are covered in later chapters.


    # WRAPPING UP


    TestApp isn’t very interesting in its current state, but it is a fully functional
    application with a main menu, a window, and even an About panel. You now know
    how to create, build, and run a basic template application. In the next chapter,
    you’ll explore Xcode’s user interface using the project you just created.'
  merge: -1
  img_proc: true
