- pgno: 232
  md: '# WHAT IS A WORKSPACE?


    Xcode 4 introduces the idea of a workspace as a kind of project binder—a container
    for multiple projects. A project groups together its related files and settings;
    a workspace binds multiple related projects. A workspace merely contains pointers
    to Xcode projects. Projects remain distinct in that you can remove them from a
    workspace without affecting the project’s content or settings. In other words,
    the project can still be opened and edited outside its workspace. Workspaces give
    you several advantages over projects that reference files and built products from
    other projects.


    Projects contained within the same workspace share a common build location. This
    makes it possible for one project to use another’s built products. This one feature
    makes a world of difference for managing complex applications and application
    suites. It makes it far easier, for example, to include the built product of a
    common framework project into one or more of your application projects.


    The automatic dependency detection you learned about in Chapter 14 extends to
    the workspace level as well. This means that including a product’s framework in
    the target of an application project within the same workspace usually requires
    no additional work for Xcode to recognize the dependency. As with dependent targets
    within the same project, Xcode will see this dependency and build the framework
    before building the application. In other words, you don’t have to copy shared
    libraries into each project folder in which you intend to use the library.


    > NOTE: Xcode may not be able to detect complex dependencies automatically. In
    this case, you’ll need to disable the Find Implicit Dependencies setting of the
    affected scheme and add and sort the interdependent targets manually.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Another benefit of a workspace is shared indexing. A project index is used
    primarily for features such as code completion (Code Sense). Xcode’s automatic
    code completion and refactoring facilities will take the symbols of all projects
    included in the workspace into account. This means code completion will automatically
    find your framework project’s symbols and make them available to you when editing
    source files in the application project that uses the framework.


    Still another benefit of workspaces pertains to schemes. A standalone project
    might contain a primary scheme for building, testing, and profiling a primary
    product in addition to schemes for smaller, dependent targets (such as a Spotlight
    plug-in). In a workspace, you may only want to see the scheme for each project’s
    primary product. Using the Manage Schemes panel you explored in Chapter 14, you
    can specify whether the schemes for those smaller “sub-targets” are visible at
    the workspace level or only when the project is opened individually. This can
    help keep the list of schemes short and manageable, hiding unnecessary detail
    from the various projects within the workspace.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# WHEN TO USE A WORKSPACE


    It’s hopefully obvious that a workspace is useless without two or more projects.
    Less obvious but just as important is that a workspace doesn’t help with multiple
    *unrelated* projects. A workspace is only helpful for two or more projects that
    must share each other’s code and resources. Let’s look at two real-world examples.


    # DISTINCT APPLICATIONS


    Imagine Acme Corporation has a whole host of unrelated desktop (and even mobile)
    applications. Here, “unrelated” means a calculator application, a calendar application,
    and an address book application. Each of these applications has only one thing
    in common: They’re products of Acme Corporation.


    Being the property of the same business entity, the applications presumably use
    the same software registration system, company logo, contact information, and
    so on. They may even be able to share user data among them. This means each application
    would use the same code, resources, or both.


    A change to the Person and Event classes, for example, might need to be updated
    in both the address book and calendar applications. While these classes may or
    may not be wrapped in a library or framework, it makes little sense to maintain
    two copies of Person and Event (one in each project). Here, a separate project
    that at least contains the common model-layer classes (and corresponding unit
    tests) makes sense. A separate framework project makes even better sense.


    Since the applications are otherwise unrelated, each application might have its
    own workspace that includes the application project and the shared framework project.


    # APPLICATION SUITES


    Imagine Acme Corporation’s desktop calendar application has gone where no calendar
    application has gone before. Against all odds, it has become a best seller, and
    users are clamoring for mobile versions for their various devices. Acme Corporation,
    in addition to its other products that share company-wide resources, now has a
    product that supports two platforms, shares company-wide resources, and has a
    device synchronization library to let users share calendar information between
    their devices and their desktop computers.


    In this case it would make sense to have a workspace containing the two application
    projects (Mac OS and iOS), their sync library project, and the company-wide resource
    project.'
  merge: -1
  img_proc: true
