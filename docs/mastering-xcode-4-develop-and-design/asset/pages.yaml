- pgno: 197
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_197_0.png)


    FIGURE 14.29 The Build action''s options


    # THE BUILD ACTION


    The Build action serves as the basis for the rest of the actions. As it’s necessary
    to build a product before it can be run, tested, or profiled, the Build action
    is always performed before performing any of the other actions that need a built
    product. To edit this action, select it from the list on the left of the Scheme
    Editor sheet. Figure 14.29 shows the settings for the Build action.


    Two build options are visible at the top of the editor. The Parallelize Build
    option allows Xcode to build multiple independent targets—targets that do not
    depend on other targets—to be built in parallel, taking advantage of your modern
    multi-core Mac. The Find Implicit Dependencies option allows Xcode to try identifying
    dependencies automatically. That is, if one target’s product is linked against
    or copied into the resources of another, Xcode can probably figure this dependency
    out automatically. This lets Xcode build the targets in the necessary order without
    your having to define the dependencies yourself. You’ll explore this in more detail
    in Chapters 15 and 16.


    The complicated-looking table beneath the build options lists all the targets
    that are to be built for the current scheme. Obviously there would need to be
    at least one target listed here for the Build action to be helpful. Note the columns
    with check boxes that correspond to each of the remaining actions. These check
    boxes control whether the target is built automatically (if necessary) before
    each action is run. In the figure, two targets are listed—the TestApp application
    itself and the tests bundle (see Chapter 18 for more on unit tests). Notice that
    the check box for the Test action is selected and disabled so you cannot deselect
    it.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# FIGURE 14.30 The Run action''s Info tab


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_198_0.png)


    Likewise, TestApp''s Test, Run, and Profile actions are selected and disabled.
    This indicates that a built product is required for these actions.


    You can use this table to define dependencies directly (especially useful in complex
    situations where Xcode is unable to determine the dependencies itself). Use the
    Add (+) button at the bottom to choose another target within the workspace (including
    multi-project workspaces). You can drag the dependencies into the required order
    if necessary (just remember to deselect the Parallelize Build option if order
    truly is important).


    There''s one other item of interest hiding in the Build action''s settings. Notice
    the disclosure triangle beside the TestApp target. If you expand it, you''ll see
    the TestAppImporter target you created earlier in the chapter. Because you placed
    the Spotlight importer product into the TestApp target''s Target Dependencies
    build phase, it''s been automatically included in the list (and has the same per-action
    settings as TestApp).


    # THE RUN ACTION


    The Run action specifies the executable to run, the debugger to use, arguments
    to pass, and some environmental settings when you ask Xcode to run with the active
    scheme. Figure 14.30 shows the Run action''s multi-tab editor.


    The Info tab (Figure 14.30) holds the basic settings for the Run action. The Build
    Configuration pop-up lets you select the configuration (such as Debug or Release)
    to use when running. The default is the Debug configuration so the debugger can
    be used. The Executable pop-up, predictably, lets you choose the executable to
    run.'
