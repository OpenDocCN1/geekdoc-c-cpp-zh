- pgno: 153
  md: '# TESTING THE APPLICATION


    A lot can be said on the subject of thoroughly testing an application before deployment,
    but that is beyond the scope of this book (except unit tests, which are covered
    in Chapter 18). For now, you can verify that the application launches and performs
    the functionality you added in previous chapters. When you’re satisfied that TestApp
    says hello when asked and properly manages, saves, and loads a list of task items,
    quit the application.


    # SHARING THE APPLICATION


    Use the Share button in the Organizer’s Archive tab to let Xcode help you share
    the application with others by saving it to a readily accessible location. Alternatively,
    you can navigate to the application itself and create a zip file with it. To do
    this, right-click (or Control-click) the application and choose Compress “TestApp”
    from the context menu. A zip file will be created, which you can easily transmit.


    > TIP: Zipping any package or bundle, including .xarchive and .app files, is a
    good idea since most e-mail systems and many file systems can mangle them.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_153_0.png)


    # SUBMITTING TO THE APP STORE


    To submit to the App Store, you must first have signed up for one of Apple’s developer
    programs and have provided Apple with the required information for eligibility
    to sell products in the store. Contact the Apple Developer Relations department
    if you’re unsure about your status.


    Before submitting, you’ll need to validate the app. Validation is a series of
    tests Xcode 4 runs as a simple way of helping make sure your application isn’t
    doing something or using code and resources Apple does not approve of. It’s wise
    to perform this step prior to submission. To validate the app, click the Validate
    button in the Organizer’s Archive tab and follow any instructions it gives.


    Once you’re satisfied, click the Submit button to submit the application to the
    App Store for review and (ideally) eventual acceptance.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# ALTERNATIVES TO ARCHIVING


    Although the Archive action makes App Store submission easier, it makes getting
    at your built application to package it for other purposes slightly less convenient.
    Independent Mac developers, for example, have their own staged archive folders
    into which they dump the latest release build. This folder may include a “quick
    start guide” in PDF format, a .webloc (web location file) shortcut to their site,
    and other marketing goodies. This folder is archived as a zip file or disk image
    to form a user-friendly downloadable.


    Xcode 4’s Archive action does not currently provide enough options to support
    this level of customization. Until the Archive action is built up with more options,
    the best workaround for independent developers is to create your own scheme to
    perform all of this staging with your own custom packaging and accoutrements.
    Alternatively, you can add minimal convenience in the form of a script at the
    end of the Archive action, which opens the built product’s enclosing folder within
    the archive in a Finder window.


    All is not lost, however. An important set of environment variables was added
    to Xcode’s build system that can be used within build scripts to manipulate aspects
    of the build environment. These are ARCHIVE_PATH, ARCHIVE_PRODUCTS_PATH, and ARCHIVE_DSYMS_PATH.
    Arguably ARCHIVE_PRODUCTS_PATH is the most important, since it makes it relatively
    easy to extend the Archive action to build your own custom archives alongside
    those that Xcode curates.


    See Chapter 14 for an overview of the new Schemes system. For more ideas regarding
    how to customize the build process to perform extra tasks, see Chapter 19.'
  merge: -1
  img_proc: true
