- pgno: 82
  md: '# FIGURE 5.28 Simpler constraints for maintaining vertical spacing


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_82_0.png)


    # NEW FUNCTIONALITY


    In the springs and struts demo, you needed the custom view so that the button
    and field would maintain the same vertical distance from each other as the window
    was resized (to prevent them from overlapping or growing apart).


    Here’s where Autolayout with constraints really shines. To get this working the
    way it should have for years, you’ll remove that custom view and do it right.
    A simple trick to remove the view without moving the button and field is to select
    the custom view, then choose Editor > Unembed from the main menu. The custom view
    is removed and its subviews are left exactly as they are.


    To fix the Autolayout constraints, just select the button and the field and drag
    them to the middle until they snap (as a group) to the blue vertical and horizontal
    centerlines that appear. You should see something similar to Figure 5.28. Run
    TestApp, and you’ll see an improvement. Although the text field doesn’t yet size
    horizontally as before, the button and the field maintain their positions relative
    to one another without the help of an otherwise pointless custom view. This is
    because of the vertical space constraint between the field and the button.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_83_0.png)


    To finish the job, you can once again add the leading and trailing spacing to
    the text field. Select the text field, and choose Editor > Pin > Leading Space
    to Superview from the main menu; select the text field again, and choose Editor
    > Pin > Trailing Space to Superview. Select the text field once again, and your
    constraints should look something like **Figure 5.29**.


    Now TestApp should behave as expected when you run it. This should give you a
    pretty good idea of how the new Autolayout system works, as well as some of its
    advantages over the springs and struts system.


    # WRAPPING UP


    Unless you write server applications and command-line tools, you will need to
    build at least a basic user interface. Now that you’re familiar with Interface
    Builder and the basics of actions and outlets, you have enough knowledge to get
    started with some test applications of your own for learning purposes. More complicated
    applications often require more than a single controller and likely more than
    a single nib. In the next chapter, you’ll learn how to add additional source code
    and resources (including additional nib files) to your project.


    **FIGURE 5.29** The final constraints for a horizontally growing text field'
