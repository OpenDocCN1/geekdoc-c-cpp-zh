  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_258_0.png)


    **FIGURE 17.13** The Debug navigator grouped by queue


    # WORKING WITH DISPATCH QUEUES


    With Mac OS X 10.6, Apple introduced Grand Central Dispatch. This new facility
    makes it far easier for developers to take advantage of multiple cores. Rather
    than focusing on the deeper complexities of threads, thread pool management, and
    all that they entail, Grand Central Dispatch is intended to abstract these notions
    away into “units of work submitted to a queue.”


    Queues act as a logical group of background tasks and are created at runtime.
    A queue can be paused and resumed, can process tasks serially or in parallel,
    and can even be given simple names to help the developer with debugging efforts.
    By default, your application’s main thread runs in a dispatch queue named `com.apple.main-thread`.
    You might create a queue to process pictures into thumbnails (one task per picture)
    in parallel and name it `com.acme.testapp.thumbnailer`.


    In Xcode’s Debug navigator, you can choose to view the list of threads grouped
    by the Grand Central Dispatch queues to which each belongs. **Figure 17.13** shows
    the Debug navigator as it appears with By Queue selected in the filter bar at
    the top of the view. Here, TestApp is paused in its `-applicationDidFinishLaunching:`
    method, which is being run in the main thread, which in turn belongs to the `com.apple.main-thread`
    queue. Other queues may be visible, depending on your code and that of the various
    frameworks and libraries you use.


    **TIP:** Learn more about Grand Central Dispatch at http://developer.apple.com.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The most important reason for remembering this is that when you create your
    own queues with Grand Central Dispatch, you can give them a meaningful name so
    you can identify them clearly in the Debug navigator and (as you''ll discover
    in Chapter 20) when using Instruments to profile your code.


    # SUSPENDING THREADS


    Grand Central Dispatch notwithstanding, threads are still threads, and the typical
    Cocoa application has several of them hanging around whether you created them
    or not. If you have created some threads of your own directly, chances are you
    did it wrong the first (several) times. You realize this because things are freezing,
    crashing, or just not acting right. It can be helpful in these cases to suspend
    a thread at runtime to keep it from interfering with other parts of your application
    or simply to examine it.


    Why not just use breakpoints? Suspending a thread is different from using a breakpoint
    in two important ways. First, a breakpoint will pause execution regardless of
    the thread calling the instruction. That is, each time a breakpoint is encountered
    and execution is paused, the thread that hit the breakpoint could be any thread.
    Second, your goal may be to suspend only some background process your application
    is performing, not the entire application itself.


    To suspend a thread is simple. Make sure you''ve paused the application in the
    debugger (either at a breakpoint or by using the Pause button in the Debugger
    Bar), then right-click (or Control-click) the thread in the Debug navigator and
    choose Suspend Thread from the menu. A red indicator will appear to the right
    of the suspended thread, showing that it is suspended. You could at this point
    resume the application (by hitting the Continue button in the Debugger bar) and
    the thread will remain paused—for good or ill—while your application goes about
    its business. To resume the thread, you''ll need to be paused again, right-click
    (or Control-click) the paused thread, and choose Resume Thread from the menu.


    > NOTE: Suspending a thread can cause unintended consequences that make your application
    act strangely at best or corrupt its data, freeze, or crash at worst. Pausing
    a thread that holds a lock, for example, could deadlock other threads. Use with
    caution.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_259_0.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# INSPECTING MEMORY


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_260_0.png)


    FIGURE 17.14 The Variables view in the Debug area


    In addition to allowing you to set watches (instructing Xcode to notify you if
    a memory address has changed), Xcode 4 allows you to view the contents of locations
    in memory. Given a memory address (usually found by a specific variable that uses
    it), Xcode can let you examine the memory contents directly. These tools are useful
    when you want to know when a variable’s value changes and the precise nature of
    the changes to a location or region in memory.


    # WATCHING ADDRESSES


    The ability to set a watch on a variable’s memory address and be notified when
    its content changes is a common feature in most any IDE. In Xcode 4, this is done
    by pausing the debugger and showing the Debug area’s Variables view (Figure 17.14),
    then right-clicking the variable and choosing Watch Address of “variableName”
    from the menu.


    Figure 17.15 shows how to set a watch for the bar variable you created in TestApp
    in earlier chapters. Nothing special happens immediately after you set the watch.
    It’s only when the contents of the watched variable’s address changes that you
    are notified in the debugger console.


    In Figure 17.16, you see that the instruction on line 47 was executed, assigning
    a newly created object to the bar pointer. The memory for that address was updated
    to point to the address of the new object, so the contents of the memory address
    for the bar pointer is now the memory address of the newly created object assigned
    to it. This information is shown in the console.


    Watching addresses is a quick and dirty way to see what’s going on with a particular
    variable in memory, but it’s like looking at memory through a keyhole. Xcode provides
    a much better way of viewing the contents of your application’s memory.'
  merge: -1
  img_proc: true
