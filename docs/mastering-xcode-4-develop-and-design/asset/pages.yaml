- pgno: 321
  md: '# SIMPLE SCRIPTING EXAMPLE


    A great many words could be spent detailing scripting examples both simple and
    elaborate. Since this book focuses on Xcode, only a basic practical example is
    needed to demonstrate some of the power of extending the build system with your
    custom processing.


    In Chapter 12, you learned how to deploy an application using Xcode 4’s preferred
    method: the Archive action. This action builds a target for release and then creates
    an Xcode archive that is meant to be submitted to Apple’s App Store. As mentioned
    in Chapter 12, Apple seems to assume that by “deploy,” developers of course mean
    “sell on the App Store.” But many independent software vendors with Mac OS X products
    may not necessarily be ready to abandon their existing distribution channel in
    favor of Apple’s. Some extra effort is necessary, therefore, to customize the
    deployment process for these heretics.


    # THE SCENARIO


    Consider the following scenario. You want to distribute TestApp on your own Web
    site, flouting Apple’s benevolence. You’d like your users to download the application
    in the form of a simple zip file whose only contents is the application itself.
    The zip file (or some archive) is necessary because application bundles are essentially
    special folders, which would be cumbersome to download. Upon archiving, you want
    to produce this zip file and have it pop up in a Finder window so you can conveniently
    copy the file to a server. Of course this is a very basic solution, but this simple
    “gateway script” can lead you to more elaborate solutions (see the “Extending
    the Script” section) to suit your needs.


    One way is to hook into the Archive process since it automatically builds for
    release and does indeed result in an archive intended for distribution. Xcode
    will still create its own archive (there’s currently no way to prevent it), but
    the custom script will create *your* archive as well.


    > **NOTE:** Of course you can hook your archive manipulation script into the Archive
    action’s post-action, but the example that follows will serve as a practical example
    of scripting in general.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_321_0.png)'
  merge: -1
  img_proc: true
- pgno: 322
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 323
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_323_0.png)


    # FIGURE 19.6 The completed custom archiving script


    ```

    # Move to the built products directory

    cd $BUILT_PRODUCTS_DIR


    # Clean up any previous archiving folder and create a new one

    rm -Rf Archive

    mkdir Archive


    # Compress the target into a zip file in the Archive folder

    zip -r Archive/$TARGETNAME.zip $FULL_PRODUCT_NAME


    # Show the Archive folder in the Finder

    open ./Archive

    ```


    To test it, run the Archive action by choosing Product > Archive from the main
    menu. The Archive action runs as usual, but you should also see the Finder window
    appear.


    TIP: You may prefer to prevent Xcode from opening the Organizer (enabled by default).
    To do so, edit the scheme and select the Archive action. Deselect the Reveal Archive
    in Organizer option and click OK.'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# TRIGGERING THE SCRIPT ON RELEASE BUILDS ONLY\n\nYou're not quite finished\
    \ yet. Currently the script will run every time the target is built. Run the application\
    \ (which builds for debugging). The archiving script also runs and pops up in\
    \ a Finder window when the application is running. This is less than ideal. Since\
    \ the stated goal was to run this script only when archiving (synonymous with\
    \ “building for release”), a little more customization is necessary.\n\nWhy not\
    \ use an Archive action post-action script? (See the “Pre- and Post-Action Scripts”\
    \ section.) Xcode’s environment variables (such as BUILT_PRODUCTS_DIR, TARGETNAME,\
    \ and FULL_PRODUCT_NAME) are unavailable in pre- and post-action scripts in the\
    \ current version of Xcode 4. Until that changes, it’s easiest (in terms of there\
    \ being far fewer and far-more-flexible lines of script) to use a Run Script build\
    \ phase.\n\nThe on-archive-only problem is easy to solve using just one more environment\
    \ variable: CONFIGURATION. You can use an if conditional to check if the script\
    \ is run under the Release configuration. Replace the existing script with the\
    \ following:\n\n```\n# Only under Release configuration ...\nif [ $CONFIGURATION\
    \ = Release ]; then\n    # Move to the built products directory\n    cd $BUILT_PRODUCTS_DIR\n\
    \    # Clean up any previous archiving folder and create a new one\n    rm -Rf\
    \ Archive\n    mkdir Archive\n    # Compress the target into a zip file in the\
    \ Archive folder\n    zip -r Archive/$TARGETNAME.zip $FULL_PRODUCT_NAME\n    #\
    \ Show the Archive folder in the Finder\n    open ./Archive\nfi\n```"
  merge: -1
  img_proc: true
