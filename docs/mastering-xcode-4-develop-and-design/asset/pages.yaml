    Much of your Xcode exploration to this point has been done with a Mac OS X application
    because it’s simpler to demonstrate. If you happen to be an iOS developer (or
    plan to become one), however, this won’t work because of hardware differences.
    Your debugging, therefore, will have to be done using the iOS Simulator or a connected
    and provisioned iOS device.


    For this demonstration, you’ll need to create an iOS project. Name it TestApp
    Touch. Refer to Chapter 2 to review how to create a new project. In the New Project
    template chooser (Figure 17.27), select the Application list under the iOS group,
    choose Tab Bar Application, and click Next. In the next sheet (Figure 17.28),
    specify the name and company identifier, leave the Device Family pop-up set to
    iPhone, do not include unit tests, and click Next. When prompted, save the project
    in the same folder in which your TestApp Suite workspace lives.


    NOTE: You must be subscribed to Apple’s iOS Developer Program to test and debug
    applications on an iOS device. See Appendix A for details regarding provisioning
    your iOS device for development use.'
