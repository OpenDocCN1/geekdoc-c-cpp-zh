- pgno: 170
  md: '# AN OVERVIEW


    Let’s take a brief tour of the terminology before exploring each term in depth.
    The end result of a build is some sort of product—an application, a plug-in, a
    command-line program, a framework, or a library.


    # TARGETS


    A target describes a product (an application, a plug-in, a library, a unit testing
    bundle, or an aggregate of other targets) to be built and the instructions for
    building it. The instructions specify source code and resource files within the
    project, build settings, phases, and rules. A project might contain more than
    one target. For example, a project might contain targets for a desktop application,
    a companion command-line program, and a library of shared code used by both. A
    target can also specify another target and a script to run, giving you the ability
    to create a “deployment package” target.


    # SCHEMES


    A scheme describes one or more targets to build, a configuration to use when building
    them, custom build scripts to execute before and after a given action, and tests
    to execute against the target (see Chapter 18). A project will have at least one
    scheme but can contain as many as you need. A scheme can be shared with others
    who use the project or workspace and can be exported for use in other, unrelated
    projects to save the trouble of re-establishing settings used commonly in your
    organization. Xcode will also create new schemes as you add targets (a feature
    that can be disabled in the Manage Schemes sheet). Schemes (and a corresponding
    run destination) are selected when building and running applications in order
    to specify which target and dependencies to build with what configuration, and
    in what environment to run the built product.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# BUILD SETTINGS


    *Build settings* include the target architecture and SDK, the location of intermediate
    build files, compiler selection (LLVM versus GCC, for example), linker settings,
    search paths, and more. The settings can be project-wide or target-specific, and
    a separate value can be defined for a given configuration (Debug versus Release,
    for example).


    # CONFIGURATIONS


    A *configuration* describes a collection of build settings for the build environment.
    By default, an Xcode project has two configurations: Debug and Release. The configuration
    Xcode uses when performing a given action (such as Run, Analyze, or Archive) is
    dictated by the settings in the active scheme. For example, the Run action of
    the default scheme of a Cocoa application project would use the Debug configuration,
    while the Archive action would use the Release configuration. Common configurations
    can be exported and imported to enable sharing and reuse between an organization’s
    projects.


    # RUN DESTINATIONS


    A *run destination* describes the environment in which to run an executable product
    (that is, a target that specifies an application or command-line program). The
    environment can be your Mac (in 32-bit or 64-bit mode), the iOS Simulator, or
    an actual iOS device. The available run destinations shown in the Scheme controls
    are determined automatically by the build settings specified for the associated
    target—specifically, the combination of settings specified in the Supported Platforms,
    Architectures, and Base SDK build settings.'
  merge: -1
  img_proc: true
