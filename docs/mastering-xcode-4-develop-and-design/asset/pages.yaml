- pgno: 213
  md: '# USING EXISTING LIBRARIES AND FRAMEWORKS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_213_0.png)


    FIGURE 15.1 The Framework and Library sheet


    FIGURE 15.2 The WebKit framework in the linking build phase


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_213_1.png)


    Using an existing library or framework is simple in Xcode, especially if it’s
    included as part of the operating system. At a minimum, you need to link your
    target against the library or framework. You learned how to do this in Chapter
    14. To use a framework in code, you may need to include one or more of its shared
    headers.


    If you’re using a framework that isn’t part of the operating system, you’ll have
    to distribute it with your product. This means you would have to add a Copy Files
    build phase to the product, specifying the framework to copy into the bundle’s
    Frameworks folder.


    # SYSTEM FRAMEWORK EXAMPLE


    Let’s use WebKit.framework as a simple example of how to use a system framework
    to add Web browsing capabilities to a product. You’ll add a simple window containing
    a Web view that automatically loads Google’s home page.


    # LINKING AGAINST THE FRAMEWORK


    To link against WebKit, select the project in the Project navigator. Select the
    TestApp target, then click the Build Phases tab. Expand the Link Binary With Libraries
    phase and click the Add (+) button. A sheet (Figure 15.1) will appear, prompting
    you to choose from the list of available system or workspace libraries and frameworks
    or to add another from an alternative location. Type web to filter the list, select
    WebKit.framework, and click Add. In addition to Cocoa.framework, TestApp will
    now be linked against WebKit to gain all its super Web powers (Figure 15.2).'
