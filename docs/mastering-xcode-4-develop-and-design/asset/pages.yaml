- pgno: 138
  md: '# CREATING CUSTOM CLASSES


    It’s often necessary to create a custom NSManagedObject subclass to customize
    an entity instance’s behavior. The class behind an entity must be specified in
    the managed object model.


    To create a subclass for an entity, select the entity in the editor and choose
    File > New > New File from the main menu. In the sheet that appears, choose the
    Core Data category and select the NSManagedObject Subclass option. Click Next.
    You’ll be prompted to choose the folder and group (but not the filename) under
    which to store the new class. Click Create to complete the action. The new file
    will be created and added to your project, and the selected entity’s class will
    be reflected in the Utility area of the Data Model inspector.


    To point an entity at an existing NSManagedObject subclass in your project, select
    the entity in the editor and open the Utility area. Select the Data Model inspector,
    and change the Class field to reflect the name of the desired class.


    # CREATING ACCESSORS QUICKLY


    When using custom NSManagedObject subclasses, you can generate accessor source
    code automatically for the attributes of your entities. To do so, select the entity
    and then select one or more attributes. Choose Edit > Copy from the main menu.
    You can either select the custom NSManagedObject subclass in the Project navigator
    or use the Assistant (discussed in the next section) so that the implementation
    for the subclass is visible. Place the cursor at the point in the source file
    where you want the accessors to be inserted, and then choose Edit > Paste Attribute
    Implementation. Xcode will generate and insert valid accessor code in the desired
    location. You can repeat the process for the header file (the menu item will be
    Paste Attribute Interface in this case).'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# USING THE ASSISTANT


    When editing a data model, additional Assistant behaviors are revealed. In this
    case, the Assistant shows only source code files that are associated with (or
    hold references to) custom NSManagedObject subclasses defined in your workspace
    and used in your managed object model.


    *Automatic* behavior shows the files that Xcode considers to be the best choice
    for the data model or the selected entity.


    *Runtime Classes* behavior shows all custom NSManagedObject subclasses defined
    in your workspace that are used by your managed object model.


    *References* behavior shows any files containing references to any NSManagedObject
    subclasses defined in your workspace that are used by your managed object model.


    # WRAPPING UP


    Core Data and Cocoa Bindings are a complex set of Cocoa topics. You''ve only scratched
    the surface of creating a very simple data model and accompanying UI with Xcode.
    In the next chapter, you''ll learn how to give TestApp a custom icon.'
  merge: -1
  img_proc: true
