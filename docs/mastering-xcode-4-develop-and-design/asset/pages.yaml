- pgno: 286
  md: '# WHAT IS UNIT TESTING?


    Most sources define unit testing as a method of testing the functionality of individual
    units of code to make certain they work under any possible condition. Many developers
    define it as a royal pain in the butt (to put it mildly).


    A unit is a single part of your code. Many describe a unit as a single function
    or method. As there tends to be a one-to-one relationship between a class in your
    code base and a matching class with which to test the first, some argue that the
    class is the unit. Either definition is saying more or less the same thing: A
    unit is a logical, testable piece of your code.


    For example, if you have a MyCalculator class with methods that perform various
    calculations (such as additions, subtractions, factorials, or square roots), you
    might have a matching MyCalculatorTests class that tests each of those functions.
    Each test is typically its own method with a descriptive signature such as -testSquareRootOfNumber:,
    which does exactly as its name suggests.


    Of course methods can pass objects back and forth, so you may have test cases
    that involve making sure that a valid object is returned from a method with various
    types of input under certain conditions, including verifying that no object is
    returned with certain input or conditions. For example, you may need to test a
    method that returns an object representing a network connection. The method may
    not be able to fulfil the request, either because you failed to provide it some
    valid input (such as a valid host name) or because of networking errors (such
    as an unplugged network cable or deactivated Wi-Fi connection).


    The tests should be designed to cover all the imaginable ways the code could fail,
    to make sure that it doesn’t. No matter what changes you make to the code, the
    existing tests should still pass, and new tests (to cover new functionality or
    new scenarios) should pass, too.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# THE BENEFITS


    Unit testing gives developers several clear advantages. The following are usually
    found at the top of the list.


    # DESIGN


    When software design is test-driven, the tests themselves are designed first and
    provide the goals for the software to meet. That is, if you design the tests to
    specify how the software should behave and then write the software with the intention
    of passing the tests, the developer knows that the design goals are met only when
    the code passes all the defined tests.


    # CHANGE MANAGEMENT


    Part of maintaining an application’s code base involves refactoring the existing
    code. With proper unit tests, a developer can make these changes confidently,
    re-running the tests after each change to verify that the code still meets the
    requirements the tests have set. The developer will know immediately whether their
    “new way of doing things” broke things when the test fails. Even better, well-designed
    unit tests tell the developer exactly where and why the new code failed.


    # SIMPLIFIED INTEGRATION TESTING


    Integration testing is the testing of the various software components when brought
    together as a whole. For example, integration testing is done on the entire application
    to make sure all its parts work together properly. For this reason, integration
    testing is often done manually by people using the software. Unit tests ensure
    the individual components work properly, catching errors before they manifest
    as potentially confusing behavior to the user, leaving only integration-related
    problems for the tester to deal with. This clear delineation between “problem
    with component” versus “problem between components” simplifies the debugging process.'
  merge: -1
  img_proc: true
- pgno: 288
