- pgno: 36
  md: '# SYMBOL NAVIGATOR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_36_0.png)


    The Symbol navigator (**Figure 3.3**) gives you a somewhat different look at your
    project. Depending upon the filters you select in the filter bar (just above the
    list of symbols), you can jump to symbols defined within your project or within
    the Cocoa frameworks.


    For example, rather than selecting a file from the Project navigator and then
    looking for your method or instance variable in the editor, you can type the symbol
    name in the search bar at the bottom of the Symbol navigator and then click the
    symbol in the list to jump directly to that symbol in your source.


    The bar along the bottom edge of the Symbol navigator offers several list-filtering
    options. The first filter button (starting from the left) lets you choose whether
    the list shows all symbol types (whether symbols exist for those types or not)
    as opposed to only showing types for which symbols exist. The second button specifies
    whether all symbols are shown or only those belonging to the workspace. The third
    button specifies whether members of a given symbol are shown (for example, the
    methods of a class). The search field further filters the list by a given search
    term.


    **FIGURE 3.3**  The Symbol navigator'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# SEARCH NAVIGATOR


    The Search navigator (Figure 3.4) allows you to search your entire project. The
    search field at the top of the pane searches the project, while the one at the
    bottom further filters the search results themselves. The results are arranged
    first by filename and then by matches within the file. Clicking a result opens
    the file and selects the match in the editor. Searching and replacing will be
    covered in more detail in Chapter 8.


    # ISSUE NAVIGATOR


    Upon building your project, the Issue navigator (Figure 3.5) lists any issues
    it finds. In Xcode, an issue can be an error or a warning. Like the Search navigator,
    the Issue navigator can organize the issues by the file in which the issues appear.
    Additionally, Xcode can show you issues organized by type. Clicking to select
    an issue will cause Xcode to navigate to the issue in the Editor area. Figure
    3.5 shows Xcode reporting that the TestAppAppDelegate.m file has, like most people,
    some issues.


    At the top of the Issue navigator are buttons that let you choose to show issues
    by the file in which they exist or by their type. The controls at the bottom of
    the navigator let you filter the list. The first button (starting from the left)
    lets you choose to show issues only from the last build. The second button lets
    you choose to show only errors (as opposed to warnings or static analyzer results).
    The search field lets you filter the list by a given search term.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_37_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_37_1.png)


    > **NOTE:** You can also jump from issue to issue using the arrows just above
    the scroll bar in the upper-right corner of the Editor area.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# DEBUG NAVIGATOR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_38_0.png)


    While execution is paused in an active debugging session (because of encountering
    a breakpoint or a crashed thread), the Debug navigator (Figure 3.6) allows you
    to navigate the threads and stacks of your application. You can organize the information
    by thread or by queue using the selector bar at the top of the navigator.


    The controls along the bottom of the navigator control how much information the
    navigator displays. The button, when activated, causes the navigator to show only
    crashed threads or threads for which there are debugging symbols available (typically
    your own code). The slider controls the amount of stack information that is displayed.
    Sliding all the way to the right shows the full stack, while sliding to the left
    shows only the top frame.


    The icons to the left of each stack frame indicate to whose code the frame belongs.
    For example, frames with a blue-and-white icon depicting a person’s head belong
    to your code, whereas purple-and-white icons depicting a mug belong to the Cocoa
    frameworks.


    **FIGURE 3.6** The Debug navigator


    # BREAKPOINT NAVIGATOR


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_38_1.png)


    All the breakpoints associated with your project are collected in the Breakpoint
    navigator (Figure 3.7). When you set breakpoints in the Source Editor (see Chapter
    9), they appear in the Breakpoint navigator list, grouped by file.


    Clicking a breakpoint’s name navigates to its location in the editor. Clicking
    the blue breakpoint marker toggles the breakpoint on and off. Right-clicking a
    breakpoint and selecting Edit Breakpoint from the context menu pops up a detailed
    view that lets you set additional breakpoint properties (also covered in Chapter
    9).


    The controls along the bottom of the navigator allow you to add and remove breakpoints,
    as well as further filter the list. The Add (+) button pops up a menu when clicked,
    offering to add one of two non-workspace-specific breakpoints (to break on exceptions
    or at a named symbol you supply manually). The Remove (-) button removes any selected
    breakpoints. The next button to the right of the Remove button can filter the
    list to show only enabled breakpoints, while the search field can filter the breakpoints
    by a given search term.


    **FIGURE 3.7** The Breakpoint navigator'
  merge: -1
  img_proc: true
