- pgno: 319
  md: 'The “Show environment variables in build log” check box (Figure 19.3) is a
    handy option for debugging your script to make sure the variables you use have
    the values you expect. When this check box is selected, the environment variables
    available to the shell will be included in the build log. But you can safely turn
    off this option without affecting the script’s environment and cut down on the
    build log size.


    When the “Run script only when installing” check box is selected, the script will
    be executed only when both the Installation Directory build setting is set to
    a valid path and the Deployment Location build setting is set to Yes for the current
    configuration (triggering an “install build”).


    # XCODE’S ENVIRONMENT VARIABLES


    Xcode provides a number of environment variables that contain information useful
    to your scripting endeavors. For example, it may be important to know the path
    to a built product or to some resource that is external to the project but relative
    to the project’s folder. It might also be useful to know what build configuration
    is being used or what install directory is specified in the build settings.


    This build environment information is invaluable when using scripts to extend
    the build process with your own postprocessing.


    # GETTING AT THE VARIABLES THE DIRTY WAY


    You can employ a trick to get a quick list of the environment variables used in
    your project as well as their values at build time. The trick is particularly
    devious because it uses a build script itself. If you’re familiar with Unix, you
    might be aware of the printenv command, which prints the current environment variables
    and their values.


    To use this trick, just add a Run Script build phase to the TestApp target. Recall
    that to do this, you must navigate to the TestApp project, select the TestApp
    target, and then click the Build Phases tab. Using the Add Build Phase button
    at the bottom of the window, choose Add Run Script. Add the following to the script
    editor in the Run Script phase controls:


    ```

    printenv > ~/Desktop/XcodeBuildEnvironmentVariables.txt

    ```'
