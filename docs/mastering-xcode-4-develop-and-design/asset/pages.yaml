- pgno: 49
  md: '# THE ORGANIZER WINDOW


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_49_0.png)


    The Organizer window (Figure 3.20) stands apart from workspace windows as a collection
    point for project and device management, including repositories, archives, snapshots,
    and more. The various aspects of the Organizer will be explored throughout the
    book. To open the Organizer, choose Window > Organizer from the main menu.


    # WRAPPING UP


    This chapter gave you a taste of the most obvious user interface elements in the
    workspace window. You’ll explore more of the user interface in later chapters,
    but there’s far more to Xcode than can fit in a book this size. In the next chapter,
    you’ll learn how to use Xcode’s built-in documentation browser and help facilities
    to get help with your coding and with using Xcode itself.'
