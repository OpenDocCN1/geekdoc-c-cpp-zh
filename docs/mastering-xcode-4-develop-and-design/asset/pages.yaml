- pgno: 52
  md: '# THE HELP MENU


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_52_0.png)


    **FIGURE 4.1** The Xcode Help menu


    You’ll start with the most obvious place first. If you’re familiar with Mac OS
    X, you should be familiar with the Help menu. Starting with Mac OS X 10.5, the
    Help menu (Figure 4.1) features a standard Search field, which shows you not only
    help topics but main menu items that match your search term.


    Beneath the Search field are menu choices to open some of the more important help
    libraries with which you should familiarize yourself. A link to Xcode’s release
    notes is also listed there. Most of these will open the Organizer window, which
    you saw in Chapter 3.


    # XCODE HELP


    The Xcode User Guide menu item opens a splash page containing video and links
    about how to find help in Xcode.


    # XCODE USER GUIDE


    The Xcode Help menu item opens the user manual for Xcode. Inside you’ll find in-depth
    explanations and how-to instructions for all Xcode features.


    # DOCUMENTATION AND API REFERENCE


    The Documentation and API Reference menu item simply opens the Organizer window
    in Documentation mode so you can browse or search the installed documentation
    libraries. It will remain on the currently selected page without navigating away
    and simply show the window.


    # THE REST


    The remaining menu items trigger quick help for the currently selected code in
    the active workspace window, and open the Organizer window in Documentation mode
    with the text input cursor in the search bar, respectively.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# THE ORGANIZER’S

    DOCUMENTATION TAB


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_53_0.png)


    **FIGURE 4.2** The Organizer’s Documentation tab


    The Documentation section of the Organizer is Xcode’s main viewer for all SDK
    and developer tools documentation. Open the Organizer by choosing Window > Organizer
    from the main menu, and then choose the Documentation tab in the toolbar (Figure
    4.2).


    The Organizer responds by showing you a pane on the left (similar to Xcode’s Navigator
    area) and a main viewing area. Along the top of the main viewing area, you’ll
    see a Jump Bar similar to the one you explored in Chapter 3. This Jump Bar, however,
    allows you to navigate the documentation as opposed to your project.


    The Organizer’s navigation area has three modes: Explore, Search, and Bookmarks.
    The button bar at the top of the pane switches between the modes.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_54_0.png)


    **FIGURE 4.3** The Organizer’s search options panel


    # EXPLORE


    In Explore mode, an outline of each of the documentation sets and their sections
    displays. You can drill down by topic through the guides and API reference documents.


    # SEARCH


    In Search mode, a search field appears, allowing you to search all installed documentation
    sets. Clicking the magnifying glass icon, then choosing Show Find Options from
    the context menu reveals a set of filtering options (Figure 4.3) that let you
    ignore unwanted libraries and more. The results are grouped by type (such as Reference,
    System Guides, Sample Code, and so on).


    # BOOKMARKS


    In Bookmarks mode, you can jump directly to documentation pages you’ve bookmarked.
    You can set bookmarks by choosing Editor > Bookmarks from the main menu or by
    right-clicking anywhere in the page and choosing Add Bookmark for Current Page
    from the context menu. To delete a bookmark, select it and press the Delete key.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Although you’ll explore the depths of the Source Editor in Part II, there are
    a couple of useful ways to find contextual help from within your code.


    # QUICK HELP IN THE UTILITY AREA


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_55_0.png)


    As you saw in Chapter 3, Xcode’s Utility area gives you access to various properties,
    code snippets, user interface elements for Interface Builder, and Quick Help.
    The Quick Help utility continuously updates its content depending on what you’ve
    selected in the Source Editor.


    To get a feel for this utility, make sure your TestApp project is open and then
    select the TestAppAppDelegate.m source file from the Classes group in the Project
    navigator. Open the Utility area, and select the Quick Help utility. In the Source
    Editor, click window in the @synthesize window; statement. Quick Help responds
    by showing you the name of the symbol (window) and the header file in which it
    is declared (the TestApp project’s TestAppAppDelegate.h file).


    For a more interesting example, scroll down a bit until you find the – (NSString
    *) applicationSupportDirectory method, and click the NSString symbol. Quick Help
    responds by showing a much more detailed description of the NSString class (Figure
    4.4), which is part of the Cocoa frameworks and is documented by the built-in
    document libraries. Any text highlighted in blue is a hyperlink to the corresponding
    documentation. Clicking a Quick Help hyperlink opens the linked information in
    the Documentation section of the Organizer.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_55_1.png)


    **FIGURE 4.4** The Quick Help utility


    # SEARCH DOCUMENTATION FOR SELECTED TEXT


    Another handy way to find the documentation for symbols such as NSString is to
    select the symbol in the Source Editor and then choose Help > Search Documentation
    for Selected Text from the main menu. As with hyperlinks in the Quick Help pane,
    choosing this option will open any corresponding documentation it finds in the
    Documentation section of the Organizer.


    > **TIP:** It’s not necessary to open the Utility pane to see Quick Help content.
    The same information will appear in a pop-up bubble by holding down the Option
    key and clicking the symbol you want to locate.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_55_2.png)'
  merge: -1
