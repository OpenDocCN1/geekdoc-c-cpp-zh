- pgno: 97
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_97_0.png)


    **FIGURE 7.6** Folded code, using the code-folding feature


    # FOLDING CODE


    *Folding* refers to collapsing and hiding the text within the desired scope. This
    does not change the text within the file but rather obscures it, making the file
    effectively shorter and easier to navigate. **Figure 7.6** depicts the TestAppAppDelegate.m
    file with the `-applicationDidFinishLaunching:` method folded; the “folded” code
    is depicted as a yellow marker containing an ellipsis.


    To fold code, click the desired scope in the folding ribbon. In cases where there
    are nested scopes, it’s easiest to click one of the arrows at either end of the
    desired scope.'
