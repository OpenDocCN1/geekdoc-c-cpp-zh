  md: '# CREATING A WORKSPACE


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_235_0.png)


    Creating the workspace is easy. Choose File > New > New Workspace from the main
    menu. A new workspace window will appear with a Save As sheet prompting you for
    a location in which to save it (Figure 16.1). Note in Figure 16.1 the two project
    folders you created in previous chapters—TestApp and the shared framework you
    created in Chapter 15.


    The common parent folder that contains these two project folders is a good place
    to keep the workspace file so that it’s easy to find. Enter **TestApp Suite**
    as the workspace name so it’s clear that this workspace contains subprojects belonging
    to the whole TestApp suite of applications (a Mac OS X app, an iOS app, and a
    shared framework between them, in the product plan of your imagination). Once
    you’ve chosen the name and location, click Save. The sheet will close and leave
    you with a disconcertingly empty workspace window.'
