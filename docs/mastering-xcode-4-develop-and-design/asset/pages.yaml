- pgno: 149
  md: 'To deploy an application, you must build it in Release mode. Whether you’re
    turning the application over to an employer, selling it on your own Web site,
    submitting it to Apple’s App Store, or just sharing it with a friend, your application
    must be built for release. In Xcode 4, this is accomplished most directly with
    the Archive action.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_149_0.png)'
  merge: -1
