- pgno: 216
  md: '# USING THE FRAMEWORK IN CODE


    Now you just need to add some code to load Google.com into the Web view when the
    application launches. Before you can use symbols from WebKit, you have to include
    its main header. Since you reference a WebView as an outlet in the app delegate’s
    header, it’s easiest to import the WebKit header there. Since the Assistant window
    is already open to it, find the #import statement near the top of the source file
    and add the following code on a new line after it:


    ```

    #import <WebKit/WebKit.h>

    ```


    Navigate to the implementation file (TestAppAppController.m) and find the -applicationDidFinishLaunching:
    method. Add the following code into the body of the method:


    ```

    NSURL * googleURL = [NSURL URLWithString:@"http://google.com"];

    NSURLRequest * request = [NSURLRequest requestWithURL:googleURL];

    [[webView mainFrame] loadRequest:request];

    ```


    TIP: The WebKit.h header is an “umbrella” header that includes any other headers
    in the WebKit framework. Referencing this header includes all headers from WebKit.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_217_0.png)


    FIGURE 15.5 A working WebView showing Google.com


    That''s it. Run the application. You might have to fish around for the second
    window (look behind the one you''re familiar with), but it should be waiting there
    with Google loaded and ready for a search (Figure 15.5). Go ahead and try it out.


    # NEGATIVE REINFORCEMENT


    Now break it. To prove that the power to use a Web view comes from linking against
    WebKit.framework, unlink it. Navigate back to the TestApp target in the project,
    and then remove WebKit.framework from the Link build phase. Try running the app.
    I dare you. The app should terminate on launch on signal SIGABRT and spew a bunch
    of messages and a stack trace into the debugger console. The most interesting
    console message is the second one, that mentions "cannot decode object of class
    (WebView)," which is a good indicator you''re referencing symbols from a library
    that hasn''t been loaded (usually because you haven''t linked against it). To
    fix it again, just add WebKit.framework back into your Link build phase.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_218_0.png)


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_218_1.png)


    FIGURE 15.6 Adding the framework to the project by dragging and dropping


    FIGURE 15.7 Copying items into the project folder via the Add Files sheet


    # THIRD-PARTY FRAMEWORK EXAMPLE


    Third-party frameworks require a little more work to use. Since they aren’t a
    part of the operating system, they must be distributed with the application. The
    most common way to do this is to embed the framework inside the application bundle
    so that it goes along for the ride when the user installs your application.


    # ADDING A FRAMEWORK TO THE PROJECT


    Most third-party frameworks are open source and many must be built before they
    can be used in your project. For this example, you can download a simple (and
    almost entirely useless) framework called Foo.framework from this book’s Web site.
    The direct download URL is http://files.xcodebook.com/fooframework/FooFramework.zip.
    Download the file and unzip its contents. You should see a folder titled Foo.framework.


    > NOTE: You can skip copying the framework into the project folder, but you’ll
    have to keep track of where all the pieces necessary to build your project are
    located. One way to do so is to create a conveniently located folder called Third-Party
    Frameworks or something similar so you always know where it is, no matter the
    project.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_218_2.png)'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_219_0.png)


    FIGURE 15.8 The Foo framework in the target''s Link build phase


    To add the framework to the project, drag Foo.framework into the Project navigator
    and drop it inside the Frameworks group (Figure 15.6) for neatness (although it
    doesn''t actually matter where you drag it—you can organize your project however
    it best suits you). The Add Files sheet you encountered in Chapter 6 will appear
    (Figure 15.7). Make sure to select the “Copy items into destination group’s folder
    (if needed)” check box and click Finish. The framework will be copied into the
    project folder and appear in the Project navigator.


    # LINKING AGAINST THE FRAMEWORK


    Unlike in the last example, Xcode has automatically added the framework to the
    Link build phase of the TestApp target. This was done for you because, as you
    saw in Figure 15.7, you accepted the default settings for the Add to Targets table
    (that is, you asked Xcode to add the framework to the TestApp target only). Xcode
    is smart enough to know that a library should be added to the Link build phase
    of the selected targets. You can verify this for yourself by examining the target’s
    Link phase (Figure 15.8).'
