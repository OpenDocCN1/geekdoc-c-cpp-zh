  md: 'FIGURE 16.2 Locating individual project files with the Finder


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_236_0.png)


    # ADDING PROJECTS TO THE WORKSPACE


    Now it’s time to add the projects to the workspace. Using the Finder, navigate
    to the folder containing the workspace and projects. For each project (the application
    and the framework), find its .xcodeproj file (Figure 16.2) and drag it into the
    Project navigator list of the TestApp Suite workspace window (Figure 16.3).


    After you add the first project, take care to drop subsequent projects either
    above or below existing projects, keeping the blue insertion bar as far left as
    possible. Dropping a project into another makes it a subproject, which is not
    the same thing. Figure 16.4 shows the TestApp project being inserted above the
    framework project and not inside it.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_236_1.png)


    > NOTE: A subproject is treated as an implicit dependency of the project in which
    it is contained and doesn’t benefit from shared build locations without careful
    configuration.


