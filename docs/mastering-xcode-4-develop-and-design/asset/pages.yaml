- pgno: 231
  md: 'Up to this point, the TestApp project has been just that—an Xcode project.
    The collection of files and folders are bound by an .xcodeproj file that contains
    all the project-wide settings (such as a description of your schemes and targets).
    Throughout the book, however, the word “workspace” has been used as a more general
    description of the project and the window that contains it all. A true workspace
    encompasses multiple projects.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_231_0.png)'
