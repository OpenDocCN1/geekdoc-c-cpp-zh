- pgno: 34
  md: '# THE WORKSPACE WINDOW


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_34_0.png)


    **FIGURE 3.1** The workspace window


    An Xcode project consists of a collection of source files (such as Objective-C
    files, Interface Builder nibs, and Core Data managed object models), resources
    (such as images and rich text files), and the Xcode project file, in which the
    various settings and build rules are maintained. It is helpful to think of an
    Xcode project as a collection of sources and resources with a project file to
    bind them together. Xcode 4 goes a step further and allows you to combine multiple
    related projects into a single *workspace* (see *Chapter 16*). The main window
    for a given project or workspace is called the *workspace window* (**Figure 3.1**).


    The workspace window is divided into multiple areas, which you’ll examine in detail
    in this chapter. Almost everything related to your workspace is contained within
    these areas, whose responsibilities include organization, navigation, editing,
    inspection, and debugging.'
  merge: -1
  img_proc: true
