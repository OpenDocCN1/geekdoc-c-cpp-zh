  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_351_0.png)


    FIGURE 20.17 The Target control''s menu


    # LAUNCHING INSTRUMENTS


    Now that you''re familiar with the main aspects of the Instruments interface,
    you''re ready to launch it for yourself. There are two ways to do this. You''ll
    learn the long way first to get a feel for how Instruments attaches to a process,
    and then you''ll learn the easy way.


    # THE LONG WAY


    The long way involves launching Instruments yourself from the /Developer/Applications
    folder. You''ll then choose a template for your document and click Choose. The
    document is configured and awaits your command. The next step is to choose the
    process to which you want Instruments to attach. Use the Target control and navigate
    its menu (Figure 20.17) to find and select the running process of your choice.
    The final step is to begin the trace by pressing the Record button.


    The long way is the only way to attach to processes that are already running or
    that are running outside Xcode. The most interesting part of that sentence is
    the implication that you can in fact attach to other processes for a variety of
    diagnostic reasons. As a power user or system administrator, for example, you
    can even monitor a process''s file system access—handy for snooping on an installer''s
    payload as it''s delivered.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# THE EASY WAY


    The easy way (for your Xcode projects) is to choose the Profile action from within
    Xcode. You''re already familiar with the Run, Test, and Archive actions. You can
    trigger the Profile action by choosing Product > Profile from the main menu; or
    by clicking and holding the Run button and then choosing Profile from its menu;
    or by pressing Command+I. Of course, you must have a project or workspace open
    and it must build successfully (just as when performing the Run action).


    Assuming your project builds successfully, Instruments will launch and prompt
    you for a template for your new trace document, just as you saw in Figure 20.1.
    Once you choose your template, Instruments will launch your application, attach
    to it, and begin recording the trace. You''ll see this in action in the examples
    in the next section.'
