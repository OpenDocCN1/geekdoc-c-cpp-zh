- pgno: 62
  md: '# UNDERSTANDING NIBS


    Cocoa applications load their graphic user interfaces from Interface Builder files
    (called nibs, or xibs if using XML format, which is the new default). The files
    are essentially “freeze-dried” object graphs representing the user interface you’ve
    constructed and the connections between the UI elements and one or more controller
    objects. Several key concepts are important to grasp when designing and working
    with a Mac OS or iOS application.


    # FILE’S OWNER AND CONTROLLER OBJECTS


    A nib and its content always have an owner. Whether it’s an instance of NSWindowController,
    NSViewController, NSDocument, or any other object, the owner serves as the top-level
    object that serves as the primary point to which to wire the user interface elements
    found in the nib.


    Generally speaking, File’s Owner is intended to be a controller object (or, in
    the case of NSDocument, a model-controller). There can be and often are multiple
    controller objects within a single nib, any of which can provide outlets or actions.


    # ACTIONS AND OUTLETS


    Two types of connections exist between your code and a nib’s contents: actions
    and outlets. Both types of connection are established by drag and drop.


    An action is a method that is called by a control. That is, depending on the type
    of control, some form of user input has triggered the control to perform its function.
    In the case of a button, a mouse click would trigger the button’s action. Any
    given control’s action requires two elements: the action itself and a target.
    Actions are defined in source code as follows:


    ```

    - (IBAction)performSomeAction: (id)sender;

    - (IBAction)performSomeOtherAction: (id)sender;

    ```


    An outlet is an instance variable of an object (typically a controller or view
    object) that serves as a pointer to an element in a nib. Outlets are used to communicate


    > **NOTE:** The file extension `.nib` stands for NextStep Interface Builder, which
    is a holdover from the original creators of these tools—Next, Inc. The newer file
    extension `.xib` stands for XML Interface Builder.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'with these objects. An example would be an outlet named tableView that points
    to an NSTableView instance that exists within a nib. The outlet could be used
    to ask the table view to refresh after some change to its underlying contents.
    Outlets are defined in source code as instance variables of a controller as follows:


    ```

    IBOutlet NSTextField * titleField;


    IBOutlet NSTableView * userListTable;

    ```


    # COMPARTMENTALIZATION


    It’s common for an application to have multiple xib files that contain portions
    of the UI. In all but the simplest applications, there are usually some parts
    of the application that the user won’t access in every session, so it’s not necessary
    to load every part of the UI every time the application is executed. Loading only
    those portions of the UI that are needed can make the application more responsive
    and can give it a smaller memory footprint.


    An example of this would be the preferences window of a Mac OS application or
    the user account view of an iOS application. These are user interface elements
    that should be kept in their own separate nibs and their associated controllers
    only created as needed.


    The first advantage of this approach is performance. Your application will save
    memory by loading only the parts of the interface the user needs when they need
    it, which is a necessity on an iOS device. Since your application is creating
    controllers and their associated UI on demand, it takes less time to launch the
    application and reach a ready state for the user.


    The second advantage is maintainability for the developer. By separating the user
    interface into distinct areas of responsibility (the preferences, the user login
    window, the export sheet, the map view), your application’s architecture is clearer
    and more easily managed and navigable.


    > **NOTE:** The details of the target/action mechanism and its various forms are
    beyond the scope of this book. Consult the Cocoa Fundamentals Guide in Apple’s
    Cocoa documentation (found in Xcode’s documentation browser or on the ADC Web
    site) for more information.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_63_0.png)'
