- pgno: 204
  md: '# FIGURE 14.39 Extra action options


    # FIGURE 14.40 Some example post-actions


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_204_0.png)


    # PRE-ACTIONS AND POST-ACTIONS SCRIPTS


    You may have noticed the disclosure triangle next to each action in the Scheme
    Editor’s actions list. When expanded, you’ll see three entries (Figure 14.39).
    When you select the action, you’re viewing the options for the action itself (the
    middle item in the expanded action’s children), but what about the Pre- and Post-actions
    items? Pre-actions are things that can be done prior to the start of an action.
    Post-actions are done after. If you select one of them, you’ll see an empty editor.


    In Xcode 4.0, there are two different pre/post action types you can perform: execute
    script or send e-mail. Using the Add (+) button, you can add one or more of either
    type of action. Figure 14.40 shows a simple set of actions that notifies the pathetic
    humans (and their pointy-haired masters) of the completion of an Archive action.


    These extra hooks into Xcode’s main actions open up the possibilities for process
    customization considerably. See Chapter 19 for more ideas regarding interesting
    ways of taking advantage of Xcode’s various scripting hooks.


    ```

    say "Archive complete, pathetic human!"

    ```'
