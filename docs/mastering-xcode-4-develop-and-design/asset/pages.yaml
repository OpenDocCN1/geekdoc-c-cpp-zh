  md: 'Xcode provides many ways to search and filter project members, source code,
    and documentation. You briefly scratched the surface of searching your source
    code with the Search navigator in Chapter 3. In this chapter, you’ll learn how
    to search and filter project members and how to perform replacements to all or
    specific parts of your project source.


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_103_0.png)'
