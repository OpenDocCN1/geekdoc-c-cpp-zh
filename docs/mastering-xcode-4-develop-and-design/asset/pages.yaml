- pgno: 91
  md: '# REMOVING FILES FROM THE PROJECT


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_91_0.png)


    To remove a file from a project, select it in the Project navigator and press
    Delete. Xcode will prompt you to make a decision (Figure 6.6) to remove only the
    reference to the file within the project or to remove the reference and delete
    the file from disk. The operation cannot be undone, so you’ll need to restore
    the file if you’ve deleted it and then add it to the project as shown earlier
    in this chapter.


    # WRAPPING UP


    A typical project will require adding many new source and resource files. You
    should also expect to remove files while maintaining and improving the application.
    You’ve seen how straightforward both of these actions are. In the next chapter,
    you’ll learn how to use the Source Editor effectively to write and edit source
    code.'
