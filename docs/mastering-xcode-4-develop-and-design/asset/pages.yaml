  md: '![](img/d4b18a89aece4a6ccac4cb886bdef5f7_87_0.png)


    # FIGURE 6.2 The Add Files drag and drop options sheet


    # FOLDERS


    The Folders option lets you choose what Xcode will do when adding file system
    folders to the project. The first option creates groups of the same name as the
    folder and then adds the folder’s contents under that group. The second option
    creates folder references. These are similar to groups but represent the physical
    folder itself, preserving its file system hierarchy.


    # ADD TO TARGETS


    The Add to Targets option instructs Xcode to add the files to the appropriate
    build phases for the selected targets within your project, depending on the file
    type. Xcode automatically adds source files to the Compile Sources build phase
    of the selected targets. Most other file types are added to the Copy Bundle Resources
    build phase. Targets and build phases are discussed in more detail in Part III.


    # USING DRAG AND DROP


    In addition to using the Add Files sheet, you can add files to your project by
    dropping them into the Project navigator. A sheet (Figure 6.2) will appear, offering
    the same options shown in the Add Files sheet. Choose your options, and click
    Finish to add the files to the project.


    > **NOTE:** It is common to add additional libraries and frameworks to a project.
    Adding libraries and frameworks, as well as packaging frameworks for distribution
    with the application, is discussed in depth in Part III.'
  merge: -1
  img_proc: true
