    You can allow TestApp to use the shared framework you created in Chapter 15 (building
    it first if necessary) by adding the framework to the TestApp target’s Link and
    Copy Frameworks build phases. To do so, navigate to the TestApp project, select
    the TestApp target, and then select the Build Phases tab. Expand the Link Binary
    With Libraries phase and click its Add (+) button. You’ll be prompted with the
    standard libraries and frameworks chooser (Figure 16.5).'
