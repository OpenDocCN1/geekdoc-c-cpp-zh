  md: '# SETTING DOCUMENT ICONS


    ![](img/d4b18a89aece4a6ccac4cb886bdef5f7_147_0.png)


    FIGURE 11.5 A custom document type


    When working with document-based Cocoa applications, you''ll need to add document
    types (covered in Chapter 14) that the application recognizes. Setting a document
    type''s icon is just as easy as setting its application icon.


    After selecting the target as you did in the previous section, click the Info
    tab at the top of the editor. Expand the desired document type (or add one; again,
    see Chapter 14) and note the image well similar to the App Icon well (Figure 11.5).
    Drag the desired .icns file into the well, and let Xcode add the file to the project.
    Documents of this type will use this icon when created or edited with your application.


    # WRAPPING UP


    In this brief chapter, you learned the simple process behind creating and using
    icons. This is often one of the final touches before deploying an application.
    In the next chapter, you''ll learn how to configure Xcode to build a deployment-ready
    application.'
