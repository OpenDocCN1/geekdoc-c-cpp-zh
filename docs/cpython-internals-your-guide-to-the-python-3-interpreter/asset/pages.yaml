    # Frame Execution


    As covered earlier in the compiler and AST chapters, the code object contains
    a binary encoding of the bytecode to be executed. It also contains a list of variables
    and a symbol table.


    The local and global variables are determined at runtime based on how that function,
    module, or block was called. This information is added to the frame by the `PyEval_EvalCode()`
    function. There are other uses of frames, like the coroutine decorator, which
    dynamically generates a frame with the target.


    The public API, `PyEval_EvalFrameEx()` calls the interpreter''s configured frame
    evaluation function in the `eval_frame` property. Frame evaluation was made pluggable
    in Python 3.7 with PEP 523.


    `_PyEval_EvalFrameDefault()` is the default function and the only option bundled
    with CPython.


    Frames are executed in the main execution loop inside `_PyEval_EvalFrameDefault()`.
    This central function brings everything together and brings your code to life.
    It contains decades of optimization since even a single line of code can have
    a significant impact on performance for the whole of CPython.


    Everything that gets executed in CPython goes through this function.'
