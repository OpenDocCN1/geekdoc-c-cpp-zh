  md: '# Building a Module From Input


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_88_0.png)


    Due to this flexibility, a large portion of the CPython source code is dedicated
    to processing inputs to the CPython parser.


    # Related Source Files


    There are two main files dealing with the command line interface.


    | File | Purpose |

    | :--- | :--- |

    | Lib runpy.py | Standard Library module for importing Python modules and executing
    them |

    | Modules main.c | Functions wrapping the execution of external code, e.g. from
    a file, module, or input stream |

    | Programs python.c | The entry point for the python executable for Windows, Linux
    and macOS. Only serves as a wrapper for Modules/main.c. |

