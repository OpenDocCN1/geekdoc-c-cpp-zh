    # Using the tracemalloc Module


    The tracemalloc in the standard library can be used to debug memory allocation
    through an object through the Object Allocator. It provides information on where
    an object was allocated, and the number of memory blocks allocated.


    As a debug tool, it is beneficial to calculate the amount of memory consumed by
    running your code or detect memory leaks.


    To enable memory tracing, you should start Python with the `-X tracemalloc=1`,
    1 is the number of frames deep you want to trace. Alternatively, you can enable
    memory tracing using `PYTHONTRACEMALLOC=1` environment variable. 1 is the number
    of frames deep you want to trace and can be replaced with any integer.


    You can use the `take_snapshot()` function to create a snapshot instance, then
    compare multiple snapshots using `compare_to()`.'
