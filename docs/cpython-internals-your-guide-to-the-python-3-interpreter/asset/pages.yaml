  md: "# Example\n\nIn this example, you will test the multithreaded port scanner\
    \ created in the chapter on Parallelism and Concurrency.\n\nCreate a profile script\
    \ in D, profile_compare.d. This profiler will start when portscanner_multithreaded.py:main()\
    \ is entered, to reduce the noise from the interpreter startup.\n\ncython-book-samples\
    \ > 62 profile_compare.d\n\n```\n#pragma D option quiet\nself int indent;\n\n\
    python$target::function-entry\n/basename(copyinstr(arg0)) == \"portscanner_multithreaded.py\"\
    \n&& copyinstr(arg1) == \"main\"/\n{\n    self->trace = 1;\n    self->last = timestamp;\n\
    }\n\npython$target::function-entry\n/self->trace/\n{\n    this->delta = (timestamp\
    \ - self->last) / 1000;\n    printf(\"%d*s:%s\", this->delta, 15, probename);\n\
    \    printf(\"%d*s:%s\", self->indent, \"\");\n    printf(\"%d*s:%s\\dn\", basename(copyinstr(arg0)),\
    \ copyinstr(arg1), arg2);\n    self->indent++;\n    self->last = timestamp;\n\
    }\n\npython$target::function-return\n/self->trace/\n{\n    this->delta = (timestamp\
    \ - self->last) / 1000;\n    self->indent--;\n    printf(\"%d*s:%s\", this->delta,\
    \ 15, probename);\n```"
