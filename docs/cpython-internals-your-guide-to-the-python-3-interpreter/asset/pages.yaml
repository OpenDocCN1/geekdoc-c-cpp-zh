  md: '# Using This Knowledge to Contribute to the CPython Project


    # # Using This Knowledge to Contribute to the CPython Project


    While writing this book, CPython had 12 new minor releases, 100''s of changes,
    bug reports, and 1000''s of commits to the source code.


    CPython is one of the biggest, most vibrant, and open software projects out there.
    So what sets apart the developers who work on CPython and you, the reader?


    **Nothing.**


    That''s right; the only thing stopping you from submitting a change, improvement,
    or fix to CPython is knowing where to start. The CPython community is eager for
    more contributors. Here are some places you could start:


    +   - Triaging issues raised by developers on bugs.python.org

    - Fixing small, easy issues


    Let''s explore each of those in a bit more detail.


    # ## Triaging Issues


    All bug reports and change requests are first submitted to bugs.python.org. This
    website is the bug tracker for the CPython Project. Even if you want to submit
    a pull request on GitHub, you first need a "BPO Number," which is the issue number
