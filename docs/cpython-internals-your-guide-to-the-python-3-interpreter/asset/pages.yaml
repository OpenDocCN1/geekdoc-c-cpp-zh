    JetBrains make an IDE for Python, called PyCharm, as well as an IDE for C/C++
    development called CLion.


    CPython has both C and Python code. You cannot install C/C++ support into PyCharm,
    but CLion comes bundled with Python support.


    To set up CPython in CLion, install the following plugins:


    +   - Makefile support


    CPython is fully integrated with the CMake system. However, CPython uses GNU Make.
    CLion will give an error saying it cannot locate a CMakeLists.txt file when you
    open the CPython source code directory. There is a workaround to create a compile_commands.json
    file from the compilation steps inside the CPython Makefile.


    | Important |

    |---| This assumes you can compile CPython, please read compiling CPython for
    your Operating System and return to this chapter. |


    We need to create a “Compile Database” using a utility called compileddb. At the
    command line, within the CPython repository:


    ```

    $ pip install compileddb

    $ compileddb make

