  md: '# Building a Module From Input


    +   1. If the file path is a .pyc file, it will call run_pyc_file().


    +   2. If the file path is a script file (.py) it will run PyRun_FileInEx().


    +   3. If the file path is stdin because the user ran command | python, then treat
    stdin as a handle and run PyRun_FileInEx().


    For stdin and basic script files, CPython will pass the handle to PyRun_FileInEx()
    located in the Python ▸ pythonrun.c.


    The purpose of PyRun_FileInEx() is similar to PyRun_SimpleStringFlags(). CPython
    will load the handle into PyParser_ASTFromFileObject.


    Identical to PyRun_SimpleStringFlags(), once PyRun_FileInEx() has created a Python
    module from the file, it sent it to run_mod() to be executed.


    # Input From Compiled Bytecode


    If the user runs python with a path to a .pyc file, then instead of loading the
    file as a plain text file and parsing it, CPython will assume that the .pyc file
    contains a code object written to disk.


    In PyRun_SimpleFileFlags() there is a clause for the user providing a file path
    to a .pyc file.


    The run_pyc() function inside Python ▸ pythonrun.c marshals the code object from
    the .pyc file by using a handle. The code object data structure on the disk is
    the CPython compiler''s way to cache compiled code so that it doesn''t need to
    parse every time the script is called.


    > Note Marshaling is a term for copying the contents of a file into memory and
    converting them to a specific data structure.


    Once the code object has been marshaled to memory, it is sent to run_eval_code_obj(),
    which calls Python ▸ ceval.c to execute the code.'
