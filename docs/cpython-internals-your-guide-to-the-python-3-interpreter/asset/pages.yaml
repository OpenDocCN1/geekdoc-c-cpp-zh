  md: "# Example\n\nIn this book, you have introduced changes to the float type by\
    \ supporting the almost-equal operator.\n\nTry this test to see the current performance\
    \ of comparing two float values:\n\n```\n$ ./python -m timeit -n 1000 \"x=1.0001;\
    \ y=1.0000; x-=y\"\n1000 loops, best of 5: 177 nsec per loop\n```\n\nThe implementation\
    \ of this comparison is in float_richcompare(), inside Objects►floatobject.c:\n\
    \nObjects►floatobject.c\n\n```\nstatic PyObject*\nfloat_richcompare(PyObject *v,\
    \ PyObject *w, int op)\n{\n    ...\n    case Py_ALE: {\n        double diff =\
    \ fabs(i - j);\n        double rel_tol = 1e-9;\n        double abs_tol = 0.1;\n\
    \        r = (((diff <= fabs(rel_tol * j)) ||\n             (diff <= abs_tol)));\n\
    \    }\n    break;\n}\n```\n\nNotice that the rel_tol and abs_tol values are constant,\
    \ but haven't been marked as constant. Change them to:\n\n```\nconst double rel_tol\
    \ = 1e-9;\nconst double abs_tol = 0.1;\n```\n\nNow, compile CPython and re-run\
    \ the test:"
