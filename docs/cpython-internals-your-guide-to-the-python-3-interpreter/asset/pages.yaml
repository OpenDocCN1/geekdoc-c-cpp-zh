    \ If you want to learn more, check out John Sturtz' article on metaprogramming.\n\
    \n# Bool and Long Integer Type\n\nThe bool type is the most straightforward implementation\
    \ of the built-in types. It inherits from long and has the predefined constants,\
    \ Py_True and Py_False. These constants are immutable instances, created on the\
    \ instantiation of the Python interpreter.\n\nInside Objects ▸ boolobject.c, you\
    \ can see the helper function to create a bool instance from a number:\n\nObjects\
    \ ▸ boolobject.c line 28\n\n```\nPyObject *PyBool_FromLong(long ok)\n{\n    PyObject\
    \ *result;\n\n    if (ok)\n        result = Py_True;\n    else\n        result\
    \ = Py_False;\n    Py_INCREF(result);\n    return result;\n}\n```\n\nThis function\
    \ uses the C evaluation of a numeric type to assign Py_True or Py_False to a result\
    \ and increment the reference counters.\n\nThe numeric functions for and, xor,\
    \ and or are implemented, but addition, subtraction, and division are dereferenced\
    \ from the base type since it would make no sense to divide two boolean values."
