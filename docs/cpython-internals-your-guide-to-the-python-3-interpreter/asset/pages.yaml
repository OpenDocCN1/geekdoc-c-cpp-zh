  md: '# Multi-Process Parallelism


    There is two types of communication between processes, depending on the nature
    of the task.


    # Semaphores


    Many of the mechanisms in multipcessing use semaphores as a way of signaling that
    resources are locked, being waited on, or not used. Operating Systems use binary
    semaphores as a simple variable type for locking resources, like files, sockets,
    and other resources.


    If one process is writing to a file or a network socket, you don''t want another
    process to suddenly start writing to the same file. The data would become corrupt
    instantly. Instead, Operating Systems put a “lock” on resources using a semaphore.
    Processes can also signal that they are waiting for that lock to be released so
    that when it is, they a message to say it is ready and they can start using.


    Semaphores (in the real world) are a signaling method using flags, so the states
    for a resource of waiting, locked and not-used would look like:


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_244_0.png)


    The semaphore API is different between Operating Systems, so there is an abstraction
    class, multiprocessing.synchronize.Semaphore.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'Semaphores are used by CPython multiprocessing because they are both thread-safe
    and process-safe. The Operating System handles any potential deadlocks of reading
    or writing to the same semaphore.


    The implementation of these semaphore API functions is located in a C extension
    module Modules ▸ _multiprocessing ▸ semaphore.c. This extension module offers
    a single method for creating, locking, releasing semaphores, and other operations.


    The call to the Operating System is through a series of Macros, which are compiled
    into different implementations depending on the Operating System platform. The
    <winbase.h> API functions for semaphores are used:


    ```

    #define SEM_CREATE(name, val, max) CreateSemaphore(NULL, val, max, NULL)

    #define SEM_CLOSE(sem) (CloseHandle(sem) ? 0 : -1)

    #define SEM_GETVALUE(sem, pval) _GetSemaphoreValue(sem, pval)

    #define SEM_UNLINK(name) 0

    ```


    For POSIX, the macros use the <semaphore.h> API is used:


    ```

    #define SEM_CREATE(name, val, max) sem_open(name, O_CREAT | O_EXCL, 0600, val)

    #define SEM_CLOSE(sem) sem_close(sem)

    #define SEM_GETVALUE(sem, pval) sem_getvalue(sem, pval)

    #define SEM_UNLINK(name) sem_unlink(name)

    ```


