  md: "# Basic C Syntax\n\n```\nif (x == 13)\n    printf(\"x is 13!n\");\nprintf(\"\
    past the it blockn\");\"\n```\n\nIn general you will see that the C code is very\
    \ cleanly formatted and generally sticks to a single style within a given module.\n\
    \n# if Statements\n\nIn C, if it works generally like it does in Python. If the\
    \ condition is true then the following block is executing. The else and else if\
    \ syntax should be familiar enough to Python programmers to understand. Note that\
    \ C if statements do not need endif because blocks are delimited by {}.\n\nThere\
    \ is a shorthand in C for short if/else statements call the ternary operator:\n\
    \nYou can find in semaphore.c where, for Windows, it defines a macro for SEM_CLOSE():\n\
    \n```\n#define SEM_CLOSE(sem) (CloseHandle(sem) ? 0 : -1)\n```\n\nThe return value\
    \ of this macro will be 0 if the function CloseHandle returns true and -1 otherwise.\n\
    \nJust a note true in C. Boolean variable types are supported and used in parts\
    \ of the CPython source, but they were not a part of the original language. C\
    \ interprets binary conditions using a simple rule: o or NULL is false, everything\
    \ else is true.\n\n# switch Statements\n\nUnlike Python, C also supports switch.\
    \ Using switch can be viewed as a shortcut for extended if/elseif chains. This\
    \ example is from semaphore.c:\n\n383"
