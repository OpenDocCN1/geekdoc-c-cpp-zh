    # Memory Allocators


    CPython uses two memory allocators:


    +   1. The Operating System allocator (malloc) for the Raw memory domain


    +   2. The CPython allocator (pymalloc) for the PyMem and Object Memory domains


    Note

    CPython allocator, pymalloc, is compiled into CPython by default. You can remove
    it by recompiling CPython after setting WITH_PYMEM = 0 in pyconfig.h. If you remove
    it, the PyMem and Object memory domain APIs will use the system allocator.


    If you compiled CPython with debugging (--with-pymdebug on macOS/Linux, or with
    the Debug target on Windows), then each of the memory allocation functions will
    go to a Debug implementation. For example, with debugging enabled, your memory
    allocation calls would execute _PyMem_DebugAlloc() instead of _PyMem_Alloc().


    # The CPython Memory Allocator


    The CPython memory allocator sits atop the system allocator and has its algorithm
    for allocation. This algorithm is similar to the system allocator, except that
    it is customized to CPython:


    +   - Most of the memory allocation requests are small, fixed-size because PyObject
    is 16 bytes, PyASCIIObject is 42 bytes, PyCompactUnicodeObject is 72 bytes, and
    PyLongObject is 32 bytes.'
