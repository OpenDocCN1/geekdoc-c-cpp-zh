  md: '# Stack Frames


    Stack Frames are a data type used by many runtimes, not just Python. Stack Frames
    allow functions to be called and variables to be returned between functions. Stack
    Frames also contain arguments, local variables, and other stateful information.


    A Stack Frame exists for every function call, and they are stacked in sequence.
    You can see CPython’s frame stack anytime an exception is unhandled:


    ```

    Traceback (most recent call last):

    File "example_stack.py", line 8, in <module> <---- function1()

    File "example_stack.py", line 5, in function1 <---- function2()

    File "example_stack.py", line 2, in function2 <---- raise RuntimeError

    ```


