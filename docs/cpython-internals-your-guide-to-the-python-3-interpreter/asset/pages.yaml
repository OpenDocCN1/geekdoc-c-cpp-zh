    Now that you have reviewed what makes up a process. Next, you can explore forking
    and spawning child processes.


    # Multi-Process Parallelism


    POSIX systems provide an API for any process to **fork** a child process.


    Forking processes is a low-level API to the Operating System that can be made
    by any running process.


    When this call is made, the OS will clone all the attributes of the currently
    running process and create a new process.


    This clone operation includes the heap, register, and counter position of the
    parent process. The child process can read any variables from the parent process
    at the time of forking.


    # Forking a Process in POSIX


