    \ */\n#define Py_RETURN_RICHCOMPARE(val1, val2, op)\ndo {\n    switch (op) {\n\
    \    case Py_EQ: if ((val1) == (val2)) Py_RETURN_TRUE; Py_RETURN_FALSE;\n    case\
    \ Py_NE: if ((val1) != (val2)) Py_RETURN_TRUE; Py_RETURN_FALSE;\n    }\n}\n```"
