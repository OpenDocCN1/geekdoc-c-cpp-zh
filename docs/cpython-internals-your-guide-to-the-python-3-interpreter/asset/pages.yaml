  md: 'Python language features.


    Before code is compiled, the CST needs to be converted into a higher-level structure
    that represents actual Python constructs. The structure is a representation of
    the CST, called an Abstract Syntax Tree (AST).


    As an example, a binary operation in the AST is called a BinOp and is defined
    as a type of expression. It has three components:


    +   - left - The left-hand part of the operation

    - op - The operator, e.g., +, -, *

    - right - - The right-hand part of the expression


