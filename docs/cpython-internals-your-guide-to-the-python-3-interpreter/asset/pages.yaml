  md: 'Pools are allocated on demand. When no available pools are available for the
    requested class size index, a new one is provisioned. Arenas have a “high water
    mark” to index how many pools have been provisioned.


    Pools have three possible states:


    +   1. **Full**: all available blocks in pool are allocated

    2. **Used**: the pool is allocated, and some blocks have been set, but it still
    has space

    3. **Empty**: the pool is allocated, but no blocks have been set


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_194_0.png)


