    The source files relating to PyPreConfig are:


    | File | Purpose |

    | --- | --- |

    | Python ▸ initconfig.c | Loads the configuration from the system environment
    and merges it with any command line flags |

    | Include ▸ cpython ▸ initconfig.h | Defines the initialization configuration
