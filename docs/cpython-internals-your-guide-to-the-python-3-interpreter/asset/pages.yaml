  md: "# General\n\nUnlike in Python, whitespace is not important to the C compiler.\
    \ It does not care if you split statements across lines or if you jam your program\
    \ onto a single, very long line. This is because it uses delimiters for all statements\
    \ and blocks.\n\nThere are, of course, very specific rules for the parser, but\
    \ in general you'll understand the CPython source just knowing that each statement\
    \ ends with the semicolon (;) and all blocks of code are surrounded by curly braces\
    \ ({}).\n\nThe exception to this rule is that if a block has only a single statement,\
    \ the curly braces can be omitted.\n\nAll variables in C must be declared meaning\
    \ there needs to be a single statement giving the type of variable. Note that,\
    \ unlike Python, the data type of a single variable cannot hold change.\n\nLet's\
    \ look at some examples:\n\n```\n/* comments are included between slash-asterisk\
    \ and asterisk-slash */\n/* This style of comment can span several lines -\nso\
    \ this part is still a comment. */\n\n// OR comments can be after two slashes\n\
    // This type of comments only go until the end of the line, so new\n// lines must\
    \ have //s again.\n\nint x = 0; // declares x to be of type 'int' and initializes\
    \ it to 0\n\\if (x == 0) {\n    // this is a block of code\n    int y = 1; //\
    \ y is only a valid variable name until the closing )\n    // more statements\
    \ here\n    printf(\"%x is %d y is %dn\", x, y);\n}\n\n// single line blocks do\
    \ not require curly brackets\n```"
  merge: -1
