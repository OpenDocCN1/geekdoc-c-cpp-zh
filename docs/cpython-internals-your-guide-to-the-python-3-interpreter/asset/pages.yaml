    # # Constructing Frame Objects


    Compiled code objects are inserted into frame objects. Frame objects are a Python
    type, so they can be referenced from C, and from Python. Frame objects also contain
    other runtime data that is required for executing the instructions in the code
    objects. This data includes the local variables, global variables and builtin
    modules.


