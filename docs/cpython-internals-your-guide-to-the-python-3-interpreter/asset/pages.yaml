    ```

    assert_stmt: ''assert'' test ['', ''test'']

    ```


    An alternate test token type was added in 3.8, so that the grammar could be prescriptive
    about which statements should support assignment-expressions and which should
    not.


    This is called namedexpr_test and is defined in the Grammar as:


    ```

    namedexpr_test: test [='': test]

    ```


    Or, visualized in a Railroad Diagram:


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_77_0.png)


    The new syntax for the if statement was changed to replace test with namedexpr_test:


    ```

    if_stmt: ''if'' namedexpr_test '': suite (''elif'' namedexpr_test '': suite

    ''else'' '': suite

    ```


    Visualized in a Railroad Diagram:


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_77_1.png)


    To distinguish := and the existing COLON (:) and EQUAL (=) token, the following
    token was then added to Grammar Tokens


    ```

    COLONEQUAL: '':=''

    ```


    This is not the only change required to support assignment expressions. The change
    altered many parts of the CPython compiler, as seen in the Pull Request.'
