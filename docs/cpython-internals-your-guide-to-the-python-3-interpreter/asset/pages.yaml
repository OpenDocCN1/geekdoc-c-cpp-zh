    # Stack Effects


    Each of the opcodes has a predefined stack effect, calculated by the stack_effect()
    function inside Python ▸ compile.c. This function returns the delta in the number
    of values inside the stack for each opcode. Stack effects can have a positive,
    negative, or zero value. Once the operation has been executed, if the stack effect
    (e.g., +1) does not match the delta in the value stack, an exception is raised
    to ensure there is no corruption to objects on the value stack.'
