  md: "# Basic C Syntax\n\ntypes like int and double as well as custom types like\
    \ PyObject like in this example from semaphore.c:\n\n```\nstatic PyObject *\n\
    semock_release(SemLockObject *self, PyObject *args)\n{\n  <statements of function\
    \ body here>\n}\n```\n\nHere you see a couple of C-specific things in play. First\
    \ off, remember code that whitespace does not matter. Much of the CPython source\
    \ puts the return type of a function on the line above the rest of that function\
    \ declaration. That's the PyObject * part. We'll talk about the * aspect of this\
    \ little later, but here we should point out that there are several modifiers\
    \ you can place on functions and variables.\n\nstatic is one of these modifiers.\
    \ Unfortunately these modifiers have some complex rules governing how they operate.\
    \ For instance, the static modifier means something very different than placing\
    \ it in front of a variable declarations.\n\nFortunately, these modifiers can\
    \ generally be ignored while trying to read and understand the CPython source\
    \ code.\n\nThe parameter list for functions is a comma-separated list of variables,\
    \ similar to Python. Again, C requires specific types for each parameter, so the\
    \ SemLockObject *self says that the first parameter (all parameters in C are positional)\
    \ is a pointer to a SemLockObject and is called self.\n\nLet's look at what the\
    \ pointer part of that statement means.\n\nTo give some context, the parameters\
    \ that are passed to C are all passed by value, meaning the function operates\
    \ on a copy of the value and not the original in the calling function. To work\
    \ around this, functions will frequently pass in the address of some data that\
    \ the function can modify. These addresses are called pointers and have types,\
    \ so int * is a pointer to an int value and is of a different type than double\
    \ * which is a pointer to a double.\n\n386"
  merge: -1
  pgno: 386
- img_proc: true
  md: "# Pointers\n\nAs mentioned above, pointers are variables that hold the address\
    \ of a value. These are used frequently in C as seen in the example above:\n\n\
    ```\nstatic PyObject *\nsemlock_release(SemLockObject *self, PyObject *args)\n\
    {\n    <statements of function body here>\n}\n```\n\nHere the self parameter will\
    \ hold the address of (usually called \"pointer to\"). Note also that the function\
    \ will return a pointer to a PyObject value.\n\nThere is a special value in C\
    \ to indicate that a pointer does not point to anything, You'll see pointers assigned\
    \ to NULL and checked against NULL throughout the CPython source. This is important\
    \ as there are very few limitations on what values a pointer can have and access\
    \ a memory location that is not officially part of your program can exit immediately.\
    \ This may cause very strange behavior.\n\nIf you try to access the memory at\
    \ NULL, on the other hand, your program will exit immediately. This may not seem\
    \ better, but it's generally easier to figure out a memory bug if NULL is accessed\
    \ than if a random memory address is modified.\n\n# Strings\n\nIn there is not\
    \ a string type. There is a convention around which many standard library functions\
    \ are written, but there is not an actual type. Rather, strings in C are stored\
    \ as arrays of char or wchar values, each of which holds a single character. Strings\
    \ are marked with a **null-terminator** which has a value 0 and is usually shown\
    \ in code as 0.\n\nBasic string operations like strlen() rely on this null-terminator\
    \ to mark the end of the string."
  merge: -1
  pgno: 387
- img_proc: true
  md: "Because strings are just arrays of values, they cannot be directly copied or\
    \ compared. The standard library has strcpy() and strcmp functions (and their\
    \ wchar cousins) for doing these operations and more.\n\n# Structs\n\nYour final\
    \ stop on this mini-tour of C is how you can create new types in C: structs. The\
    \ struct keyword allows you to group a set of different data types together into\
    \ a new, custom data type:\n\n```\nstruct <struct_name> {\n  <type> <member_name>;\n\
    \  <type> <member_name>;\n  ...\n}\n```\n\nThis partial example from Modules/arraymodule.c\
    \ shows a struct declaration:\n\n```\nstruct arraydescr {\n  char typecode;\n\
    \  int itemsize;\n  ...\n};\n```\n\nThis creates a new data type called struct\
    \ arraydescr which has many members, the first two of which are a char typecode\
    \ and an int itemsize.\n\nFrequently structs will be used as part of a typedef\
    \ which provides a simple alias for the name. In the example above, all variables\
    \ of the new type must be declared with the full name struct arraydescr x;\n\n\
    You'll frequently see syntax like this:\n\n```\ntypedef struct {\n  PyObject_HEAD\n\
    \  SEM_HANDLE handle;\n```"
