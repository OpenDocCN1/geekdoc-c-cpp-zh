  md: 'functions that tend to be along the same execution path are moved to the same
    section of the compiled application.


    +   **Conditional Branch Optimization** - PGO can look at a decision branch, like
    an if..else or switch statement and spot the most commonly used path. For example,
    if there are 10 cases in a switch statement and one is used 95% of the time, it
    will be moved to the top so that it will be executed immediately in the code path.


    +   **Dead-Spot Separation** - Code that isn''t called during PGO is moved to
    a separate section of the application.


