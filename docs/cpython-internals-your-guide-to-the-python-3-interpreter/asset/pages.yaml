  md: '# Configuration State


    Before any Python code is executed, the CPython runtime first establishes the
    configuration of the runtime and any user-provided options.


    The configuration of the runtime is in three data structures, defined in PEP587:


    +   1. PyPreConfig, used for pre-initialization configuration

    2. PyConfig, used for the runtime configuration

    3. The compiled configuration of the CPython interpreter


    Both data structures are defined in Include ▸ cpython ▸ initconfig.h.


    # Pre-Initialization Configuration


    The pre-initialization configuration is separate to the runtime configuration
    as it’s properties relate to the Operating System or user environment.


    The three primary functions of the PyPreConfig are:


    +   - Setting the Python memory allocator

    - Configuring the LC_CTYPE locale

    - Setting the UTF-8 mode (PEP540)


    The PyPreConfig type contains the following fields; all of type int:


    | Name | Purpose |

    | allocator | Name of the memory allocator (e.g. PYMEM_ALLOCATOR_MALLOC). Run
    ./configure --help for more information on the memory allocator |

    | configure__locale | Set the LC_CTYPE locale to the user preferred locale. If
    equal to 0, coerce_c_locale and coerce_c_locale_warn to 0 |

    | coerce_c_locale | If equal to 2, coerce the C locale; if equal to 1, read the
    LC_CTYPE locale to decide if it should be coerced |

    | coerce_c_locale_warn | If non-zero, emit a warning if the C locale is coerced
    |

    | dev_mode | See PyConfig.dev_mode |'
