    | --- | --- | --- |

    | b_next | basicblock* | If b_next is non-NULL, it is a pointer to the next block
    reached by normal control flow |

    | b_seen | unsigned | Used to perform a DFS of basicblocks. See assembly |

    | b_return | unsigned | Is true if block returns a value (a RETURN_VALUE opcode
    is inserted) |

    | b-- | int | Depth of stack upon entry of block, computed by stackdepth() |

    | b_offset | int | Instruction offset for block, computed by assemble_jump_offsets()
    |


    # # Operations and Arguments


    Depending on the type of operation, there are different arguments required. For
    example, ADDOP_JABS and ADDOP_JREL refer to “**ADD Operation with Jump to a Relative
    position** and “ADD Operation with Jump to an Absolute position”. The ADDOP_JREL
    and ADDOP_JABS macros call compiler_addop_j(struct compiler *c, int opcode, basicblock
    *b, int absolute) and set the argument to o and 1 respectively.


    There are some other macros, like ADDOP_I calls compiler_addop_i() which add an
    operation with an integer argument, and ADDOP_0 calls compiler_addop_o() which
    adds an operation with a PyObject argument.


    # # Assembly


    Once compilation stages have completed, the compiler has a list of frame blocks,
    each containing a list of instructions and a pointer to the next block. The assembler
    performs a “depth-first-search” of the basic frame blocks and merges the instructions
    into a single bytecode sequence.


    # # Assembler Data Structure


    The assembler state struct, assembler, is declared in Python ▸ compile.c.'
