    Some compilers will compile into a low-level machine code, which can be executed
    directly on a system. Other compilers will compile into an intermediary language,
    to be executed by a virtual machine.


    A consideration when choosing a compiler is the system portability requirements.
    Java and .NET CLR will compile into an Intermediary Language so that the compiled
    code is portable across multiple systems architectures. C, Go, C++, and Pascal
    will compile into an executable binary. This binary is built for the platform
    on which it was compiled.


