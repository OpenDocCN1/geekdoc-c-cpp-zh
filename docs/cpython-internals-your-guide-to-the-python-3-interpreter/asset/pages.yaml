  md: "```\nswitch (WaitForSingleObjectEx(handle, 0, FALSE)) {\ncase WAIT_OBJECT_0:\n\
    \  if (!ReleaseSemaphore(handle, 1, &previous))\n    return MP_STANDARD_ERROR;\n\
    \  *value = previous + 1;\n  return 0;\ncase WAIT_TIMEOUT:\n  *value = 0;\n  return\
    \ 0;\ndefault:\n  return MP_STANDARD_ERROR;\n}\n```\n\nThis performs a switch\
    \ on the return value from WaitForSingleObjectEx(). If the value is WAIT_OBJECT_0,\
    \ the first block is executed. The WAIT-TIMEOUT value results in the second block,\
    \ and anything else matches the default block.\n\nNote that the value being tested,\
    \ in this case the return value from WaitForSingleObjectEx(), must be an integral\
    \ value or an enumerated type and that each case must be a constant value.\n\n\
    # Loops\n\nThere are three looping structures in C:\n\n+   - for loops\n- while\
    \ loops\n- do..while loops\n\nLet's look at each of these in turn.\nfor loops\
    \ have syntax that is quite different than Python:\n\n```\nfor (<initialization>;\
    \ <condition>; <increment>) {\n  code to be looped over\n}\n```"
