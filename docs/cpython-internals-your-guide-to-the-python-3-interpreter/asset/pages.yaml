    The modules written in pure Python are all located in the Lib directory in the
    source code. Some of the larger modules have submodules in subfolders, like the
    email module.


    An easy module to look at would be the colorsys module. It’s only a few hundred
    lines of Python code. You may not have come across it before. The colorsys module
    has some utility functions for converting color scales.'
