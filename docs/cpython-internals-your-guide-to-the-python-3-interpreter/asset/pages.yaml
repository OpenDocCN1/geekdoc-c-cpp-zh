    - 2-byte Py_UCS2, stored as 16-bit unsigned int type, uint16_t

    - 4-byte Py_UCS4, stored as 32-bit unsigned int type, uint32_t


    # Related Source Files


    Source files related to strings are:


    | File | Purpose |

    | --- | --- |

    | Include ▸ unicodeobject.h | Unicode String Object definition |

    | Include ▸ cpython unicodeobject.h | Unicode String Object definition |

    | Objects ▸ unicodeobject.c | Unicode String Object implementation |

    | Lib ▸ encodings | Encodings package containing all the possible encodings |

    | Lib ▸ codecs.py | Codecs module |

    | Modules ▸ _codemodule.c | Codecs C extensions, implements OS-specific encodings
    |

    | Modules ▸ _codecs | Code implementations for a range of alternative encodings
    |


    # Processing Unicode Code Points


    CPython does not contain a copy of the UCD, nor does it have to update whenever
    scripts and characters are added to the Unicode standard. Unicode Strings in CPython
    only to care about the encodings, the Operating System has the task of representing
    the code points in the correct scripts.


    The Unicode standard includes the UCD and is updated regularly with new scripts,
    new Emojis, and new characters.


    Operating Systems take on these updates to Unicode and update their software via
    a patch. These patches include the new UCD code-points and support the various
    Unicode encodings. The UCD is split into sections called code blocks.


    302'
