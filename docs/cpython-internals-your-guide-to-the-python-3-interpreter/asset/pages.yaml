    # Using the Python Benchmark Suite for Runtime Benchmarks


    The benchmark suite is the tool to use when comparing the complete performance
    of Python. The Python Benchmark suite is a collection of Python applications designed
    to test multiple aspects of the Python runtime under load. The Benchmark suite
    tests are pure-Python, so they can be used to test multiple runtimes, like PyPy
    and Jython. They are also compatible with Python 2.7 through to the latest version.


    Any commits to the master branch on github.com/python/cpython will be tested using
    the benchmark tool, and the results uploaded to the Python Speed Center at speed.python.org:'
