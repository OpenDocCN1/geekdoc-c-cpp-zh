  md: "In addition to the code to be executed in the loop, there are three blocks\
    \ of code that control the for loop.\n\nThe <initialization> section is run exactly\
    \ one time when the loop is started. Traditionally it is used to set a loop counter\
    \ to an initial value (and possibly declare the loop counter). The <increment>\
    \ code is run immediately after each pass through the main block of the loop.\
    \ Traditionally this will increment the loop counter. Finally, the <condition>\
    \ is run after the <increment>. The return value of this code will be evaluated\
    \ and the loop breaks when this condition returns false.\n\nHere's an example\
    \ from Modules/sha512module.c:\n\n```\nfor (i = 0; i < 8; ++i++) {\n    S[i] =\
    \ sha_info->digest[i];\n}\n```\n\nThis loop will run 8 times, with i going from\
    \ 0 to 7, terminating the condition is check and i is 8.\n\nwhile loops are virtually\
    \ identical to their Python counterparts. The do..while() syntax is a little different,\
    \ however. The condition on a do..while() loop is not checked until after the\
    \ first time the body of the loop is executed.\n\nThere are many instances for\
    \ for and while loops in the CPython code base, but do..while() is unused.\n\n\
    # Functions\n\nThe syntax for functions in C is similar to that in Python, with\
    \ the addition that the return type and parameter types must be specified. The\
    \ C syntax looks like this:\n\n```\n<return_type> function_name(<parameters>)\
    \ {\n    <function_body>\n}\n```\n\nThe return type can be any valid type in C,\
    \ including both built-in"
