  md: '# Debugging


    CPython comes with a builtin debugger for debugging Python applications, pdb.
    The pdb debugger is excellent for debugging crashes inside a Python application,
    writing tests and inspecting local variables.


    When it comes to CPython, you need a second debugger, one that understands C.


    In this chapter, you will learn how to:


    +   - Attach a debugger to the CPython interpreter

    - Use the debugger to see inside a running CPython process


    There are two types of debugger, console and visual. Console debuggers (like pdb)
    give you a command prompt and custom commands to explore variables and the stack.
    Visual debuggers are GUI applications that present the data for you in grids.


    The following debuggers are covered in this chapter:


    | Debugger | Type | Platform |

    |------|---|--- |

    | ldb | Console | macOS |

    | gdb | Console | Linux |

    | Visual Studio Debugger | Visual | Windows |

    | CLion Debugger | Visual | Windows, macOS, Linux |

    | VS Code Debugger | Visual | Windows, macOS, Linux |'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Using the Crash Handler


    In C, if an application tries to read or write to an area of memory it shouldn''t
    be, a segmentation fault is raised. This fault halts the running process immediately
    to stop it from doing any damage to other applications.


    Segmentation faults can also happen when you try to read from memory that contains
    no data, or an invalid pointer.


    If CPython causes a segmentation fault, you get very little information about
    what happened:


    CPython comes with a builtin fault handler. If you start CPython with -X faulthandler,
    or -X dev, instead of printing the system segmentation fault message, the fault
    handler will print the running threads and the Python stack trace to where the
    fault occurred:


    ```

    Fatal Python error: Segmentation fault

    Thread 0x0000001102ld0 (most recent call first):

    File "cpython/lib/threading.py", line 1039 in _wait_for_tstate_lock

    File "cpython/lib/threading.py", line 1023 in join

    File "cpython/portscanner.py", line 26 in main

    File "cpython/portscanner.py", line 32 in <module>

    [1] 63540 segmentation fault ./python -X dev portscanner.py

    ```


    This feature is also helpful when developing and testing C extensions for CPython.


    # Compiling Debug Support


    To get meaningful information from the debugger, the debug symbols must be compiled
    into CPython. Without symbols, the stack traces within a debug session won''t
    contain the correct function names, the variable names, or file names.'
  merge: -1
