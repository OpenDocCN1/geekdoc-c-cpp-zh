    # Event Loops


    Event loops are the glue that holds async code together. Written in pure Python,
    event loops are an object containing tasks.


    When started, a loop can either run once or run forever. Any of the tasks in the
    loop can have callbacks. The loop will run the callbacks if a task completes or
    fails.'
