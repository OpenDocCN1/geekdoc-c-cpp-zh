    # Wide Character Type


    When handling Unicode string input in an unknown encoding within the CPython source
    code, the wchar_t C type will be used. wchar_t is the C standard for a wide-character
    string and is sufficient to store Unicode strings in memory. After PEP 393, the
    wchar_t type was selected as the Unicode storage format.


    The Unicode string object provides a utility function, PyUnicodeFromWideChar(),
    that will convert a wchar_t constant to a string object. For example, the pymain_run_command(),
    used by python -c converts the -c argument into a Unicode string:


