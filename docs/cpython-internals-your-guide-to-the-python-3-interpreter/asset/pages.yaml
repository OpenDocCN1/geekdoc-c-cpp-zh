  md: '# # Benchmarking, Profiling, and Tracing


    When making changes to CPython, you need to verify that your changes do not have
    a significant detrimental impact on performance.


    You may want to make changes to CPython that improve performance.


    There are solutions for profiling that you will cover in this chapter:


    +   1. Using the `timeit` module to check a simple Python statement thousands
    of times for the median execution speed


    +   2. Running the Python Benchmark suite to compare multiple versions of Python


    +   3. Using `cProfile` to analyze execution times of frames


    +   4. Profiling the CPython execution with probes


    The choice of solution depends on the type of task:


    +   * A **benchmark** will produce an average/median runtime of a fixed code snippet
    so that you can compare multiple versions of Python runtime


    +   * A **profil** will produce a call graph, with execution times so that you
    can understand which function is the slowest'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Using Timeit for Micro-Benchmarks


    Profilers are available at a C or Python level. If you are profiling a function,
    module, or script written in Python, you want to use a Python profiler. If you
    are profiling a C extension module or a modification to the C code in CPython,
    you need to use a C profiler (or a combination).


    Here is a summary of some of the tools available:


    | Tool | Category | Level | Support |

    | --- | --- | --- | --- |

    | timeit | Benchmarking | Python | All |

    | pyperformance | Benchmarking | Python | All |

    | cProfile | Profiling | Python | All |

    | dtrace | Tracing/Profiling | C | Linux/macOS |


    > Important

    Before you run any benchmarks, it is best to close down all applications on your
    computer so the CPU is dedicated to the benchmark.


    # Using Timeit for Micro-Benchmarks


    The Python Benchmark suite is a thorough test of CPython''s runtime with multiple
    iterations. If you want to run a quick, simple comparison of a specific snippet,
    use the timeit module.


    To run timeit for a short script, run the compiled CPython with the -m timeit
    module and a script in quotes:


    ```

    ./python -m timeit -c "x=1; x+=1; x**"

    100000 loops, best of 5: 258 nsec per loop

    ```


    To run a smaller number of loops, use the -n flag:


    ```

    ./python -m timeit -n 1000 "x=1; x+=1; x**"

    1000 loops, best of 5: 227 nsec per loop

    ```


    354'
  merge: -1
  pgno: 354
