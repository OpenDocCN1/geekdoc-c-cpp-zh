    # Important


    Throughout this chapter, it is important to remember that the unit of compilation
    for CPython is a module. The compilation steps and process indicated in this chapter
    will happen once for each module in your project.


    In this chapter, you will focus on the compilation of an AST module into a code
    object:


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_120_1.png)


    The `PyAST_CompileObject()` function is the main entry point to the CPython compiler.
    It takes a Python AST module as its primary argument, along with the name of the
    file, the globals, locals, and the PyArena all created earlier in the interpreter
    process.'
