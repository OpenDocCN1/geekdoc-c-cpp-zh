  md: '# # The Compiler


    After completing the task of parsing, the interpreter has an AST with the operations,
    functions, classes, and namespaces of the Python code. The job of the **compiler**
    is to turn the AST into instructions the CPU could understand.


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_119_0.png)


    This compilation task is split into two components:


    +   1. **Compiler** - Traverse the AST and create a **control-flow-graph** (CFG),
    which represents the logical sequence for execution

    2. **Assembler** - Convert the nodes in the CFG to sequential, executable statements,
    known as **bytecode**'
