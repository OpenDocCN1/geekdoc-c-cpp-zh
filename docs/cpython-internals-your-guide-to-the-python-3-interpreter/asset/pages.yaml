    \ “almost-equal” operator you compiled into the grammar in the last chapter.\n\
    \nFirst you have to add an internal #define for the Py_ALE operator, so it can\
    \ be referenced inside the rich comparison functions for PyObject.\n\nOpen Include>object.h,\
    \ and locate the following #define statements:\n\n```\n/* Rich comparison opcodes\
    \ */\n#define Py_LT 0\n#define Py_LE 1\n#define Py_EQ 2\n#define Py_NE 3\n#define\
