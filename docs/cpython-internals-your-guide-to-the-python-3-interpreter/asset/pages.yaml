    # Byte Order Markers


    When decoding input, like a file, CPython can detect the byte-order from a byte-order-marker
    (BOM). BOMs are a special character that appears at the beginning of a Unicode
    byte stream. They tell the receiver which byte-order the data is stored in. Different
    computer systems can encode with different byte-orders. If the wrong byte-order
    is used, even with the right encoding, the data will be garbled.


