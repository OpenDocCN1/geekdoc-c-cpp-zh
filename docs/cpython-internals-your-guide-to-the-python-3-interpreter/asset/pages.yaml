    # ## What’s in the Source Code?


    > Note

    This book targets version 3.9.0b1 of the CPython source code.


    The CPython source distribution comes with a whole range of tools, libraries,
    and components. We''ll explore those in this book.


    To download a copy of the CPython source code, you can use git to pull the latest
