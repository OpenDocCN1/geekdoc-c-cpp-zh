  md: '# # The Evaluation Loop


    So far, you have seen how Python code is parsed into an Abstract Syntax Tree and
    compiled into code objects. These code objects contain lists of discrete operations
    in the form of bytecode. There is one major thing missing for these code objects
    to be executed and come to life. They need input. In the case of Python, these
    inputs take the form of local and global variables. In this chapter, you will
    be introduced to a concept called a Value Stack, where variables are created,
    modified, and used by the bytecode operations in your compiled code objects.


    Execution of code in CPython happens within a central loop, called the “evaluation
    loop.” The CPython interpreter will evaluate and execute a code object, either
    fetched from the marshaled .pyc file, or the compiler:


    ![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_154_0.png)


    In the evaluation loop, each of the bytecode instructions is taken and executed
    using a “Stack Frame” based system.'
