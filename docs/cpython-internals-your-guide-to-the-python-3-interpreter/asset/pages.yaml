  md: '# # Compiling CPython on macOS


    Compiling CPython on macOS requires some additional applications and libraries.
    You will first need the essential C compiler toolkit. “Command Line Development
    Tools” is an app that you can update in macOS through the App Store. You need
    to perform the initial installation in the terminal.


    > > Note

    To open a terminal in macOS, go to Applications > Other Terminal. You will want
    to save this app to your Dock, right-click the Icon and select Keep in Dock


    In the terminal, install the C compiler and toolkit by running the following:


    ```

    $ xcode-select --install

    ```


    This command will pop up with a prompt to download and install a set of tools,
    including Git, Make, and the GNU C compiler.


    You will also need a working copy of OpenSSL to use for fetching packages from
    the PyPI.org website. If you later plan on using this build to install additional
    packages, SSL validation is required.


    The simplest way to install OpenSSL on macOS is by using Homebrew.


    > > Note

    If you don''t have Homebrew, you can download and install Homebrew directly from
    GitHub with the following command:


    $ /usr/bin/ruby -e "$(curl -fsSL \

    https://raw.githubusercontent.com/Homebrew/install/master/install)"


    Once you have Homebrew installed, you can install the dependencies for CPython
    with the brew install command:'
  merge: -1
  pgno: 44
- img_proc: true
  md: '```

    $ brew install openssl xz zlib gdbm sqlite

    ```


    Now that you have the dependencies, you can run the configure script. Homebrew
    has a command brew --prefix [package] that will give you the directory where the
    package is installed. You will enable support for SSL by compiling the location
    that Homebrew uses.


    The flag --with-debug enables debug hooks. Add this if you intend on debugging
    for development or testing purposes. Debugging CPthon is covered extensively in
    the Debugging chapter.


    The configuration stage only needs to be run once, also specifying the location
    of the zlib package:


    ```

    $ CPPFLAGS="-I$(brew --prefix zlib)/include" \

    LDFLAGS="-L$(brew --prefix zlib)/lib" \

    ./configure --with-openssl=$(brew --prefix openssl) --with-pydebug

    ```


    Running configure will generate a Makefile in the root of the repository that
    you can use to automate the build process.


    You can now build the CPython binary by running:


    ```

    $ make -j2 -s

    ```


    |See Also

    For more help on the options for make, see section A Quick Primer on Make.


    During the build, you may receive some errors. In the summary, make will notify
    you that not all packages were built. For example, ossaudiodev, spwd, and _tkinter
    would fail to build with this set of instructions. That''s okay if you aren''t
    planning on developing against those packages. If you are, check out the official
    dev guide website for more information.


    The build will take a few minutes and generate a binary called python.exe. Every
    time you make changes to the source code, you will'
  merge: -1
