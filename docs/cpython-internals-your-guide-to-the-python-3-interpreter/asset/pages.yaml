  md: '# See Also


    Rich comparisons in the data model were proposed for Python 2.1 in PEP207. The
    PEP contains context, history, and justification for custom Python types to implement
    comparison methods.


    We will now add another comparison operator, called almost equal, represented
    by ~= with the following behaviors:


    +   - If you compare a float and an integer, it will cast the float into an integer
    and compare the result.

    - If you compare two integers, it will use the normal equality operators.


    Once implemented, this new operator should return the following in a REPL:


    ```

    >>> 1 ~= 1

    True

    >>> 1 ~= 1.0

    True

    >>> 1 ~= 1.01

    True

    >>> 1 ~= 1.9

    False

    ```


