    need to rerun make with the same flags. The python.exe binary is the debug binary
    of CPython. Execute python.exe to see a working REPL:


    ```

    $ ./python.exe

    Python 3.9.0 (tags/v3.9.0b:97fe9cf, May 19 2020, 10:00:00)

    [Clang 10.0.1 (clang-101.0.46)] on darwin

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    # Important


    Yes, that''s right, the macOS build has a file extension for .exe. This extension
    is not because it''s a Windows binary! Because macOS has a case-insensitive filesystem
    and when working with the binary, the developers didn''t want to accidentally
    refer to the directory Python/ .exe was appended to avoid ambiguity. If you later
    run make install or make altinstall, it will rename the file back to python before
    installing it into your system.


    # Compiling CPython on Linux


    To compile CPython on Linux, you first need to download and install make, gcc,
    configure, and pkgconfig.


    For Fedora Core, RHEL, CentOS, or other yum-based systems:


    ```

    $ sudo yum install yum-utils

    ```


    For Debian, Ubuntu, or other apt-based systems:


    ```

    $ sudo apt install build-essential

    ```


    Then install some additional required packages.


    For Fedora Core, RHEL, CentOS, or other yum-based systems:'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Compiling CPython on Linux


    ```

    $ sudo yum-buildldep python3

    ```


    For Debian, Ubuntu, or other apt-based systems:


    ```

    $ sudo apt install libss1-dev zlib1-dev libncurses5-dev \\

    libncurses5-dev readline-dev libsqlite3-dev libgdbm-dev \\

    libdb5.3-dev libbz2-dev libbexpat1-dev liblzma-dev libffi-dev

    ```


    Now that you have the dependencies, you can run the configure script, optionally
    enabling the debug hooks --with-pydebug:


    ```

    $ ./configure --with-pydebug

    ```


    Next, you can build the CPython binary by running the generated Makefile:


    ```

    $ make -j2 -s

