  md: "# A More Complex Example\n\nThe compiler.\n\nIn practice, most changes to the\
    \ grammar are more complicated.\n\nPython 3.8 introduced assignment expressions,\
    \ with the format :=.\n assignment expression both assigns a value to a name and\
    \ returns the value of the named variable.\n\nOne of the statements impacted by\
    \ the addition of assignment expressions to the Python language was the if statement.\n\
    \nPrior to 3.8, the if statement was defined as:\n\n+   - The keyword if followed\
    \ by a test, then a :\n- A nested series of statements (suite)\n- Zero-or-more\
    \ elif statements, which are followed by a test, a : and a suite\n- An optional\
    \ else statement, which is followed by a : and a suite\n\nIn the grammar this\
    \ was represented as:\n\n```\nif_stmt: 'if' test ':' : suite ('elif' test ':'\
    \ : suite)* ['else' ':' : suite]\n```\n\nVisualized, this looks like:\n\n![](img/826aa5e3e0d3a5997a0ec0a647c5e3c6_76_0.png)\n\
    \nTo support assignment expressions, the change needed to be backward compatible.\
    \ The use of := in an if statement, therefore, had to be optional.\n\nThe test\
    \ token type used in the if statement is generic between many statements. For\
    \ example, the assert statement is followed by a test (and then optionally a second\
    \ test)."
