- img_proc: true
  md: 'There are three basic forms of #if that you''ll see in the CPython source:


    +   * #ifdef <macro>: includes the following block of text if the specified macro
    is defined

    * #if defined(<macro>): same as #ifdef

    * #ifndef <macro>: includes the following block of text if the specified macro
    is not defined

    * #if <macro>: includes the following text if the macro is defined and evaluates
    to True


    The use of “text” instead of “code” to describe what is included or excluded from
    the file. The preprocessor knows nothing of C syntax and does not care what the
    specified text is.


    # #pragma


    Pragmas are instructions or hints to the compiler. In general you can ignore these
    while reading the code as they usually deal with how the code is compiled, not
    how the code runs.


    # #error


    Finally, #error displays a message and causes the preprocessor to stop executing.
    Again, you can safely ignore these for reading the CPython source code.


    # Basic C Syntax


    This section will not cover ALL aspects of C nor, again, is it intended to teach
    you how to write C. It will focus on things that are different or confusing for
    Python developers the first time they see them.'
  merge: -1
