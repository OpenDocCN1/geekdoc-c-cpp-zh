  md: '# # Getting the CPython Source Code


    When you type python at the console or install a Python distribution from python.org,
    you are running CPython. CPython is one of many Python implementations, maintained
    and written by different teams of developers. Some alternatives you may have heard
    as PyPy, Cython, and Jyton.


    The unique thing about CPython is that it contains both runtime and the shared
    language specification that all other Python implementations use. CPython is the
    “official” or reference implementation of Python.


    The Python language specification is the document that describes the Python language.
    For example, it says that assert is a reserved keyword, and that [] is used for
    indexing, slicing, and creating empty lists.


    Think about what you expect to be inside the Python distribution:


    +   * When you type python without a file or module, it gives an interactive prompt
    (REPL).

    * You can import built-in modules from the standard library like json, csv, and
    collections.

    * You can install packages from the internet using pip.

    * You can test your applications using the built-in unittest library.


    These are all part of the CPython distribution. There’s a lot more'
  merge: -1
  pgno: 21
