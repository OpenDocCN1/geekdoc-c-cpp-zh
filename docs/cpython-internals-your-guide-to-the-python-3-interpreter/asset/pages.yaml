  md: '# Appendix 1 : Introduction to C for Python Programmers


    This introduction is intended to get an experienced Python programmer up to speed
    with the basics of the C language and how it''s used in the CPython source code.
    It assumes you''ve already got an intermediate understanding of Python syntax.


    That said, C is a fairly limited language and most of it''s usage in CPython falls
    into a small set of syntax. Getting to the point where you understand the code
    is a much smaller step than being able to write C effectively. This tutorial is
    aimed at the first goal but not the second.


    One of the first things that stand out as a big difference between Python and
    C is the C preprocessor. Let''s look at that first.


    # C Preprocessor


    The preprocessor, as the name suggests, is run on your source files before the
    compiler runs. It has very limited abilities, but these can be used to get great
    advantage in building C programs. The preprocessor produces a new file which is
    what the compiler will actually process. All of the commands to the preprocessor
    start at the beginning of a line with a # symbol as the first non-whitespace character.


    The main purpose of the preprocessor is to do text substitution in the source
    file, but it will also do some basic conditional code if #if state-'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# C Preprocessor


    ments.


    Let''s start with the most frequent preprocessor directive, #include.


    # #include


    #include is used to pull the contents of one file into the current source file.
    There is nothing sophisticated about this, it reads from the file system, runs
    the preprocessor on that file and puts the results of that into the output file.
    This is done recursively for each #include directive found.


    For example, if you look at the Modules/_multiprocessing/semaphore.c file, near
    the top you''ll see:


    ```

    #include "multiprocessing.h"

    ```


    This tells the preprocessor to pull in the entire contents of multiprocessing.h
    and put it into the output file at this position.


    You will notice two different forms for the include statement. One of them uses
    quotes to specify the name of the include file, the other uses angle brackets
    (<). The difference comes from which paths are searched... If you use <> for the
    filename, the preprocessor will only look on “system” include files. Using quotes
    around the filename instead will force the preprocessor to look in the local directory
    first and then fall back to the system directories.


    # #define


    #define allows you to do simple text substitution and also plays into the #if
    directives we see below.


    At''s most basic, #define let’s you define a new symbol that gets placed with
    a text string in the preprocessor output.


    Continuing in semaphore.c you''ll find this line:'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# C Preprocessor


    ```

    #define SEM_FAILED NULL

    ```


    This tells the preprocessor to replace every instance of SEM_FAILED below this
    point with the literal string NULL before the code is sent to the compiler.


    #define items can also take parameters as in this Windows-specific version of
    SEM_CREATE:


    ```

    #define SEM_CREATE(name, val, max) CreateSemaphore(NULL, val, max, NULL)

    ```


    In this case the preprocessor will expect SEM_CREATE() to look like a function
    and have three parameters. This is generally referred to as a macro. It will directly
    replace the text of the three parameters into the output code, For example, on
    line 459, the SEM_CREATE macro is used like this:


    ```

    handle = SEM_CREATE(name, val, maxvalue);

    ```


    When compiling for Windows, this macro will be expanded so that line is:


    ```

    handle = CreateSemaphore(NULL, value, max, NULL);

    ```


    We''ll see how this macro is defined differently on Windows and other operating
    systems.


    #undef


    This directive erases any previous preprocessor definition of #define. This makes
    it possible to have a #define in effect for only part of a file.


    #if


    The preprocessor also allows conditional statements, allowing you to either include
    or exclude sections of text based on certain conditions. Conditional statements
    are closed with the #endif directive and also make use of #elif and #else for
    fine-tuned adjustments.


    380'
  merge: -1
