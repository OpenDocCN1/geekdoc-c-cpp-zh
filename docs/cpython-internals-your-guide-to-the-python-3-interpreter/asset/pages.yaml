  md: 'converted into tasks.


    The task API is used to schedule and execute multiple coroutines currently.


    Before tasks are scheduled, an event loop must be running. The job of the event
    loop is to schedule concurrent tasks and connect events such as completion, cancellation,
    and exceptions with callbacks.


    When you called `asyncio.run()`, the run function (in Lib `asyncio.py`) did these
    tasks for you:


    +   - Started a new event loop


    +   - Wrapped the coroutine object in a task


    +   - Set a callback on the completion of the task


    +   - Looped over the task until it completed


    +   - Returned the result


