    # Profile Guided Optimization


    The macOS, Linux, and Windows build processes have flags for “PGO,” or “Profile
    Guided Optimization.” PGO is not something created by the Python team, but a feature
    of many compilers, including those used by CPython.


    PGO works by doing an initial compilation, then profiling the application by running
    a series of tests. The profile created is then analyzed, and the compiler will
    make changes to the binary that would improve performance.


    For CPython, the profiling stage runs `python -m test --ppgo`, which executes
    the regression tests specified in Lib > test > libregtest > pgo.py. These tests
    have been specifically selected because they use a commonly used C extension module
    or type.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Note


    The PGO process is time-consuming, so throughout this book I''ve excluded it from
    the list of recommended steps to keep your compilation time short. If you want
    to distribute a custom compiled version of Cython into a production environment,
    you should run ./configure with the --with-pgo flag in Linux and macOS, and use
    the --pgo flag in build.bat on Windows.


    The optimizations are specific to the platform and architecture that the profile
    was executed on, PGO profiles cannot be shared between operating systems or CPU
    architectures. The distributions of Cython on python.org have already been through
    PGO, so if you run a benchmark on a vanilla-compiled binary it will be slower
    than one downloaded from python.org.


    The Windows, macOS and Linux profile-guided optimizations include these checks
    and improvements:


    +   **Function Inlining** - If a function is regularly called from another function,
    then it will be “lined” to reduce the stack-size.


    +   **Virtual Call Speculation and Inlining** - If a virtual function frequently
    targets a certain function, PGO can insert conditionally executed direct call
    to that function. The direct call can be inlined.


    +   **Register Allocation Optimization** - Based on profile data results, the
    PGO will optimize register allocation.


    +   **Basic Block Optimization** - Basic block optimization allows commonly executed
    basic blocks that temporally execute within a given frame to be placed in the
    same set of pages (locality). It minimizes the number of pages used, which minimizes
    memory overhead.


    +   **Hot-Spot Optimization** - Functions where the program spends the most execution
    time can be optimized for speed.


    +   **Function Layout Optimization** - After analyzing the call graph,'
  merge: -1
