  md: "# Profiling Python Code with cProfile\n\nThe standard library comes with two\
    \ profilers for profiling Python code. The first is profile, a pure-Python profiler,\
    \ and the second, cProfile, a faster profiler written in C. In most cases, cProfile\
    \ is the best model to use.\n\nThe cProfile profiler is used for analyzing a running\
    \ application and collecting deterministic profiles on the frames evaluated. The\
    \ output from cProfile can be summarized on the command-line, or saved into a\
    \ .pstat file for analysis in an external tool.\n\nIn the Parallelism and Concurrency\
    \ chapter, you wrote a port scanner application in Python. Try profiling that\
    \ application in cProfile.\n\nRun python at the command-line with the -m cProfile\
    \ argument to run the cProfile module. The second argument is the script to execute:\n\
    \n```\n$ python -m cProfile portscanner_multithreaded.py\nPort 80 is open\nCompleted\
    \ scan in 19.890110226593 seconds\n    6833 function calls (6787 primitive calls)\
    \ in 19.971 seconds\n```\n\n> Ordered by: standard name\ncalls tottime percall\
    \ cumtime percall filename:lineno(function)\n2 0.000 0.000 0.000 0.000 ...\n\n\
    The output will print a table with the columns:\n\n| Column | Purpose |\n| ncalls\
    \ | Number of calls |\n| tottime | Total time spent in the function (minus subfunctions)\
    \ |\n| percall | Quotient of tottime divided by ncalls |\n| cumtime | Total time\
    \ spent in this (and subfunctions) |\n| percall | Quotient of cumtime divided\
    \ by primitive calls |\n| filename:lineno(function) | Data of each function |"
  merge: -1
