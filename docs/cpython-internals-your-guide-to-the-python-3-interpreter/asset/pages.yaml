  md: '# POSIX Threads


    POSIX threads, named pthreads, have an implementation in Python pthread.h. This
    implementation abstracts the <pthread.h> CAPI with some additional safeguards
    and optimizations.


    Threads can have a configured stack size. Python has its own stack frame construct,
    as you explored in the chapter on the Evaluation Loop. If there is an issue causing
    a recursive loop, and the frame execution hits the depth limit, Python will raise
    a RecursionError which can be handled from a try...except block in Python code.
    Because pthreads have their own stack size, the max depth of Python and the stack
    size of the thread might conflict.


    If the stack size is smaller than the max frame depth in Python, the entire Python
    process will crash before a RecursionError is raised. Also, the max depth in Python
    can be configured at runtime using sys.setrecursionlimit().


    To avoid these crashes, the CPython thread implementation sets the stack size
    to the thread_stacksize value of the Interpreter State.


    Most modern POSIX-compliant Operating Systems support system scheduling of threads.
    IfPTHREAD_SYSTEM_SCHED_SUPPORTED is defined in pyconfig.h, the thread is set to
    PTHREAD_SCOPE_SYSTEM, meaning that the priority of the thread on the Operating
    System scheduler is decided against the other threads on the system, not just
    the ones within the Python process.


    Once the thread properties have been configured, the thread is created using the
    pthread_create() API. This runs the bootstrap function from inside the new thread.'
