    # Using the GC API From Python


    CPython’s standard library comes with a Python module to interface with the arena
    and the garbage collector, the gc module. Here''s how to use the gc module in
    debug mode:


    ```

    >>> import gc

    >>> gc.set_debug(gc.DEBUG_STATS)

    ```


    This will print the statistics whenever the garbage collector is run:


    ```

    gc: collecting generation 2...

    gc: objects in each generation: 3 0 4477

    gc: objects in permanent generation: 0

    gc: done, 0 unreachable, 0 collectible.0008s elapsed

    ```


