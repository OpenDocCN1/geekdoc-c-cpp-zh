  md: "# Note\n\n**Positional-only arguments** are a new feature in Python 3.8. Introduced\
    \ in PEP570, positional-only arguments are a way of stopping users of your API\
    \ from using positional arguments with a keyword syntax.\n\nFor example, this\
    \ simple function converts Fahrenheit to Celsius. Note, the use of / as a special\
    \ argument separates positional-only arguments from the other arguments.\n\n```\n\
    def to_celsius(fahrenheit, /, options=None):\n    return (fahrenheit-32)/5/9\n\
    ```\n\nAll arguments to the left of / must be called only as a positional argument,\
    \ and arguments to the right can be called as either positional or keyword arguments:\n\
    \n```\n>>> to_celsius(110)\n```\n\nCalling the function using a keyword argument\
    \ to a positional-only argument will raise a TypeError:\n\n```\n>>> to_celsius(fahrenheit=110)\n\
    Traceback (most recent call last):\nFile \"stdin>\", line 1, in <module>\nTypeError:\
    \ to_celsius() got some positional-only arguments passed as keyword arguments:\
    \ 'fahrenheit'\n```\n\nThe resolution of the keyword argument dictionary values\
    \ comes after the unpacking of all other arguments. The PEP570 positionalonly\
    \ arguments are shown by starting the keyword-argument loop at co_posonlyargcount.\
    \ If the / symbol was used for the 3rd argument, the value of co_posonlyargcount\
    \ would be 2. PyDict_SetItem() is called for each remaining argument for adding\
    \ it to the locals dictionary. When executing, each of the keyword arguments become\
    \ scoped local variables."
