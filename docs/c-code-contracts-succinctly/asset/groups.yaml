    \nAs mentioned previously, you are able to get additional extensions for the test\
    \ framework to use when creating IntelliTests. To do this, you can use the Visual\
    \ Studio Extension Manager or go to the Visual Studio Gallery on the MSDN website.\n\
    \nHere's how to install third-party frameworks from Visual Studio Extensions:\n\
    \n-   1. Navigate to **Tools** and select **Extensions and Updates**.\n-   2.\
    \ Expand **Online > Visual Studio Gallery > Tools**, and select **Testing**.\n\
    -   3. Browse the results and select the framework you require.\n-   4. Click\
    \ **Download**.\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_81_0.png)\n\n*Figure\
    \ 56: Installing Third-Party Frameworks from Visual Studio*\n\nInstalling third-party\
    \ frameworks from the Visual Studio Gallery:\n\n-   1. Go to the Visual Studio\
    \ Gallery.\n-   2. Enter the framework name in the **Find** text box.\n-   3.\
    \ Select the framework from the search results to download.\n\nIf you are not\
    \ sure which framework you want or don't know the name of the framework you are\
    \ looking for, you can browse a list of frameworks on the Visual Studio Gallery:\n\
    \n-   1. Go to the Visual Studio Gallery.\n-   2. Click the Browse link.\n-  \
    \ 3. Under **Categories**, expand **Tools** and choose **Testing**.\n-   4. Choose\
    \ the framework you want and download the tool.\n\n## Chapter 5  Code Contracts\
    \ Editor Extensions\n\n### Making Code Contracts more useful\n\nSo far we have\
    \ seen a lot of what Code Contracts can do. Here’s a tip on how to make the contracts\
    \ you create more useful to developers using your classes and methods. Using Code\
    \ Contracts Editor Extensions will allow you to see what the method you’re calling\
    \ into requires with regard to the contracts defined in that method. It will do\
    \ this without requiring you to drill down into the method and see what Code Contracts\
    \ it implements.\n\n```\nProductionVolumePerBin(binVol, factor);\n```\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_83_0.png)\n\
    \n*Figure 57: ProductionVolumePerBin Quick Info*\n\nThe method we used in Chapter\
    \ 4 displays the comments you provided in the XML comments for that method in\
    \ the Quick Info window when the pointer hovers over the method. This is expected\
    \ behavior, but I have no idea from that Quick Info window what contracts the\
    \ method implements. Code Contracts Editor Extensions changes this. To install\
    \ it, go to the Tools menu in Visual Studio and click Extensions and Updates.\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_83_1.png)\n\n*Figure 58: Extensions\
    \ and Updates*\n\nFrom the **Extensions and Updates** window, select the **Online**\
    \ tab and search for **Code Contracts Editor Extensions**. The results returned\
    \ should be fairly limited. From here, click **Download** to download and install\
    \ the extension.\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_84_0.png)\n\nFigure\
    \ 59: Install Code Contracts Editor Extensions\n\nOnce Code Contracts Editor Extensions\
    \ have been installed, you will need to restart Visual Studio. The beauty of this\
    \ extension is that you now get a peek inside the methods you create, which will\
    \ display the contracts for that method.\n\nBefore this will work though, you\
    \ need to ensure that the **Contract Reference Assembly** is set to **Build**\
    \ in the Code Contracts settings.\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_84_1.png)\n\
    \nFigure 60: Contract Reference Assembly\n"
  mdcn: "\n```csharp\n/// Calculate a new cutting factor\n/// r.Next(1, 7); returns\
    \ a random number between 1 and 6\n/// </summary>\n/// <param name=\"binVol\"\
    >Upper range value of random (bin volume + 1)</param>\n/// <returns>\n/// A new\
    \ cutting factor greater than 1 and equal to the bin volume\n/// </returns>\n\
    private int CalculateNewCutFactor(int binVol)\n{\n    Random r = new Random();\n\
    \    return r.Next(2, binVol + 1);\n}\n\n/// <summary>\n/// Ensure that the passed\
    \ volume is even\n/// </summary>\n/// <param name=\"volume\">The volume to verify</param>\n\
    /// <returns>boolean</returns>\npublic bool IsEven(int volume)\n{\n    return\
    \ volume % 2 == 0;\n}\n```\n\n*代码清单 66：智能 ProductionVolumePerBin 方法*\n\n从前面修改后的代码清单可以看出，我做了几件事。业务规则规定，料箱容量将始终为偶数。因此，我添加了一个\
    \ **Contract.Requires()** 前置条件，以确保只有偶数整数会传递给 **ProductionVolumePerBin()** 方法。\n\
    \n代码中的另一项新增内容是 **CalculatedCuttingFactor** 属性，如果提供的因子无效，该属性将保存新计算出的切割因子。为此，我加入了一个名为\
    \ **CalculateNewCutFactor** 的新方法，它会尝试使用备用的切割因子值，以产生完美切割。\n\n**ProductionVolumePerBin()**\
    \ 方法将判断切割因子是否有效。如果无效，它将运行 while 循环，直到返回有效的切割因子并实现完美切割。不过，在生产环境中，你可能需要考虑使用一个合理性循环计数器变量来创建退出条件，或在达到某个最大迭代次数时引发异常。**ProductionVolumePerBin()**\
    \ 方法仍然可以做很多微调，但这里我不再深入，因为我只是想说明一个概念。\n\n修改代码后，再次运行 IntelliTest。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_79_0.png)\n\
    \n图 54：所有 IntelliTest 测试均已通过\n\n从测试结果可以看到，ProductionVolumePerBin() 方法已经满足代码契约所施加的要求。它还生成了六条警告，我稍后会讨论。\n\
    \n现在，调用代码可以实现 ProductionVolumePerBin() 方法，而无需处理返回无效值的情况。它知道该方法每次都会返回完美切割。唯一需要做的检查是查看是否建议了新的因子，或者提供的因子是否有效。\n\
    \n```\nint binVol = 20;\nint factor = 3;\nCodeContractsDemoProject.ERPWarehouseIntegration\
    \ owhi =\n    new CodeContractsDemoProject.ERPWarehouseIntegration();\nint result\
    \ = owhi.ProductionVolumePerBin(binVol, factor);\nif (owhi.CalculatedCuttingFactor\
    \ != factor &&\n    owhi.CalculatedCuttingFactor != 0)\n{\n    Console.Write($\"\
    The supplied cutting factor of {factor} resulted in \"\n        + \"an imperfect\
    \ cut. The system suggests using the following \"\n        + $\"cutting factor:\
    \ {owhi.CalculatedCuttingFactor}\");\n}\nelse\n    Console.Write($\"The cutting\
    \ factor of {factor} resulted in 0 scrap\");\n\nConsole.ReadLine();\n```\n\n代码清单\
    \ 67：调用 ProductionVolumePerBin 的代码\n\n你会注意到，我每次都在 Console.Write 中使用了字符串内插。这是 C#\
    \ 6 的新特性之一。前面的代码只需要检查 CalculatedCuttingFactor 属性，以查看切割因子是否已更改。它知道在契约约束下，ProductionVolumePerBin()\
    \ 方法始终会实现完美切割。\n\n我们还可以进一步改进前面的代码，但我要说明的概念已经很清楚了。代码契约非常适合与 Visual Studio Enterprise\
    \ 2015 中通过 IntelliTest 创建的测试配合使用。你可以结合这两种技术的强大能力，创建高度健壮的代码和高度强制的业务规则，使应用程序在生产环境中表现良好。\n\
    \n## IntelliTest 警告\n\n如果不讨论警告输出屏幕，对 IntelliTest 的讨论就不完整。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_80_0.png)\n\
    \n*图 55：IntelliTest 警告*\n\n你会注意到，**IntelliTest 探索结果**屏幕生成了六条警告。这些大多是可能需要你关注的普通警告。为稳妥起见，请检查这些警告是否存在任何明显问题。虽然这在一定程度上超出了本书的范围，但我会简要提及在**可测试性**和**边界**中看到的两种警告类型。\n\
    \n### 可测试性\n\n我们看到的警告是：在我们的代码中检测到未插桩的方法。这具体涉及 `CalculateNewCutFactor()` 方法中使用的\
    \ `Random()` 方法。这仅意味着 IntelliTest 无法深入我代码中的所有路径，以生成测试所需的输出。\n\n### 边界\n\nIntelliTest\
    \ 会对其执行的路径施加某些限制，以防止在应用程序进入无限循环时卡住。可以通过单击菜单栏上的 **修复** 图标来修改这些限制。\n\n### 代码覆盖率\n\
    \n理想情况下，你希望看到 100% 的代码覆盖率（33/33 个块）。我们的测试只覆盖了 28/33 个块。进一步阅读有关 IntelliTests 的资料，可以让你了解如何确保良好的代码覆盖率，以及哪些警告可以安全地抑制。\n\
    \n## 安装第三方框架\n\n如前所述，你可以获取测试框架的附加扩展，以便在创建 IntelliTests 时使用。为此，你可以使用 Visual Studio\
    \ 扩展管理器，或访问 MSDN 网站上的 Visual Studio Gallery。\n\n以下是从 Visual Studio 扩展安装第三方框架的方法：\n\
    \n-   1. 导航到 **工具**，然后选择 **扩展和更新**。\n-   2. 展开 **联机 > Visual Studio Gallery >\
    \ 工具**，然后选择 **测试**。\n-   3. 浏览结果并选择你需要的框架。\n-   4. 单击 **下载**。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_81_0.png)\n\
    \n*图 56：从 Visual Studio 安装第三方框架*\n\n从 Visual Studio Gallery 安装第三方框架：\n\n-   1.\
    \ 转到 Visual Studio Gallery。\n-   2. 在 **查找** 文本框中输入框架名称。\n-   3. 从搜索结果中选择要下载的框架。\n\
    \n如果你不确定需要哪个框架，或者不知道要查找的框架名称，可以浏览 Visual Studio Gallery 上的框架列表：\n\n-   1. 转到 Visual\
    \ Studio Gallery。\n-   2. 单击“浏览”链接。\n-   3. 在 **类别** 下，展开 **工具** 并选择 **测试**。\n\
    -   4. 选择你想要的框架并下载该工具。\n\n## 第 5 章  代码契约编辑器扩展\n\n### 让代码契约更有用\n\n到目前为止，我们已经了解了代码契约的许多功能。这里有一个提示，说明如何让你创建的契约对使用你的类和方法开发人员更有用。使用代码契约编辑器扩展，可以让你看到所调用的方法对该方法中定义的契约有什么要求。它无需你深入该方法并查看它实现了哪些代码契约，就能做到这一点。\n\
    \n```\nProductionVolumePerBin(binVol, factor);\n```\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_83_0.png)\n\
    \n*图 57：ProductionVolumePerBin 快速信息*\n\n我们在第 4 章中使用的方法，在指针悬停于该方法上时，会在快速信息窗口中显示你在该方法的\
    \ XML 注释中提供的注释。这是预期行为，但从该快速信息窗口中我无法知道该方法实现了哪些契约。代码契约编辑器扩展改变了这一点。要安装它，请转到 Visual\
    \ Studio 中的“工具”菜单，然后单击“扩展和更新”。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_83_1.png)\n\
    \n*图 58：扩展和更新*\n\n在 **扩展和更新** 窗口中，选择 **联机** 选项卡，然后搜索 **代码契约编辑器扩展**（Code Contracts\
    \ Editor Extensions）。返回的结果应该相当有限。在此处单击 **下载**，以下载并安装该扩展。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_84_0.png)\n\
    \n图 59：安装代码契约编辑器扩展\n\n安装代码契约编辑器扩展后，你需要重启 Visual Studio。这个扩展的美妙之处在于，你现在可以窥探所创建方法的内部，它会显示该方法的契约。\n\
    \n不过，在此功能生效之前，你需要确保在代码契约设置中将 **契约引用程序集**（Contract Reference Assembly）设置为 **生成**。\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_84_1.png)\n\n图 60：契约引用程序集\n"
