    # Chapter 6  Conclusion


    So far, we have looked at setting up Code Contracts and using them to validate
    logical correctness by using the various contract methods. We looked at how Code
    Snippets make life easier for developers who use Code Contracts extensively. We
    also saw how to integrate Code Contracts into your documentation output and how
    to generate user-friendly documentation using Sandcastle Help File Builder.


    Moving on to more advanced topics and tips, we looked at how to integrate Code
    Contracts with abstract classes and interfaces, and we saw that Code Contracts
    lend themselves very well to testing your methods with IntelliTest. We explored
    how another tool called Code Contracts Editor Extensions expose base classes and
    your custom Code Contracts to calling code right there in the Quick Info window.


    From here, I would suggest checking out the [Code Contracts GitHub page](https://github.com/microsoft/CodeContracts)
    and starting to integrate Code Contracts into your projects. The more you use
    Code Contracts, the easier it will become to create well documented, robust code.'
