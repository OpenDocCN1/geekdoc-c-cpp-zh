  mdcn: "\n## 第三章 有用的提示\n\n### 使用代码片段\n\n你可能已经熟悉 Visual Studio 中的代码片段；代码契约也提供了此功能。安装代码契约时，片段会被添加。如果你使用的是\
    \ C#，只需输入快捷方式然后按两次 Tab 键即可。\n\n在 Visual Basic 中，使用代码片段的方式略有不同。输入快捷方式然后按 Tab 键。C#\
    \ 和 Visual Basic 之间的快捷键存在细微差异。**Contract.Requires** 快捷方式，例如，在 C# 中通过输入 **cr**\
    \ 调用，而在 Visual Basic 中则通过输入 **creq** 调用。\n\n### C# 代码片段\n\n以下代码清单说明了 C# 代码片段快捷方式。使用的快捷方式是被注释掉的第一行，后跟片段生成的代码。\n\
    \n```csharp\n//cr\nContract.Requires(false);\n```\n\n*代码清单 27：Contract.Requires\
    \ 片段*\n\n```csharp\n//ce\nContract.Ensures();\n```\n\n*代码清单 28：Contract.Ensures\
    \ 片段*\n\n```csharp\n//ci\nContract.Invariant(false);\n```\n\n*代码清单 29：Contract.Invariant\
    \ 片段*\n\n```csharp\n//crr\nContract.Result<int>()\n```\n\n*代码清单 30：Contract.Result\
    \ 片段*\n\n```csharp\n//co\nContract.OldValue(x)\n```\n\n*代码清单 31：Contract.OldValue\
    \ 片段*\n\n```csharp\n//cim\n[ContractInvariantMethod]\n[System.Diagnostics.CodeAnalysis.SuppressMessage(\n\
    \    \"Microsoft.Performance\", \"CA1822:MarkMembersAsStatic\",\n    Justification\
    \ = \"Required for code contracts.\")]\nprivate void ObjectInvariant()\n{\n  \
    \  Contract.Invariant(false);\n}\n```\n\n*代码清单 32：Contract.Invariant 方法片段*\n\n\
    ```csharp\n//crn\nContract.Requires(arg != null);\n```\n\n*代码清单 33：Contract.Requires\
    \ Not Null 片段*\n\n```csharp\n//cen\nContract.Ensures(Contract.Result<string>()\
    \ != null);\n```\n\n*代码清单 34：Contract.Ensures Contract.Result 片段*\n\n```csharp\n\
    //crsn\nContract.Requires(!String.IsNullOrEmpty(arg));\n```\n\n*代码清单 35：Contract.Requires\
    \ String with Value 片段*\n\n```csharp\n//cesn\nContract.Ensures(!String.IsNullOrEmpty(Contract.Result<string>()));\n\
    ```\n\n*代码清单 36：Contract.Ensures Contract Result with String Value 片段*\n\n```csharp\n\
    //cca\nContract.Assert(false);\n```\n\n*代码清单 37：Contract.Assert 片段*\n\n```csharp\n\
    //cam\nContract.Assume(false);\n```\n\n*代码清单 38：Contract.Assume 片段*\n\n```csharp\n\
    //cre\nContract.Requires<ArgumentException>(false);\n```\n\n*代码清单 39：Contract.Requires\
    \ with ArgumentException 片段*\n\n```csharp\n//cren\nContract.Requires<ArgumentNullException>(arg\
    \ != null, \"arg\");\n```\n\n*代码清单 40：Contract.Requires Argument Not Null 片段*\n\
    \n```csharp\n//cresn\nContract.Requires<ArgumentException>(!String.IsNullOrEmpty(arg));\n\
    ```\n\n*代码清单 41：Contract.Requires String Parameter with Value*\n\n```csharp\n\
    //cintf\n#region IFoo contract binding\n[ContractClass(typeof(IFooContract))]\n\
    public partial interface IFoo\n{\n\n}\n\n\n[ContractClassFor(typeof(IFoo))]\n\
    abstract class IFooContract : IFoo\n{\n}\n#endregion\n```\n\n*代码清单 42：接口模板和关联契约类片段*\n\
    \n### 扩展代码片段\n\n本节严格来说并不专属于代码契约，但如果我不提及你扩展代码片段的能力，我会觉得有所疏忽。我一直觉得扩展代码片段有点麻烦。幸运的是，对于开发者来说，有一些非常慷慨的社区成员创建了\
    \ Visual Studio 的优秀扩展。Snippet Designer 就是其中之一。\n\n在使用它之前，你需要从 **工具** 菜单下的 **扩展和更新**\
    \ 安装 Snippet Designer。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_42_0.png)\n\
    \n*图 27：Visual Studio 扩展和更新菜单项*\n\n安装 Snippet Designer 后，它会出现在已安装的扩展下。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_42_1.png)\n\
    \n*图 28：Snippet Designer 扩展*\n\n最基本的功能是，Snippet Designer 让你能够即时生成代码片段。关于代码契约，有几项是我总想包含在方法中的。我希望能够将它们链接到单个代码片段下，而对于这一点，Snippet\
    \ Designer 非常合适。\n\n突出显示你想要创建片段的代码契约，打开上下文菜单，然后单击 Export as Snippet。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_43_0.png)\n\
    \n*图 29：导出为片段*\n\nSnippet Designer 窗口现在在 Visual Studio 2015 IDE 中以新标签页显示。\n\n\
    ![](img/0a07386735fd4e6427d20aa9bc165f5d_43_1.png)\n\n*图 30：Snippet Designer 编辑器*\n\
    \n```csharp\npublic int MethodToRun(int param)\n{\n    Contract.Requires(param\
    \ > 0, \"\");\n    Contract...\n    return\n}\n```\n\n```csharp\nContract.Requires(param\
    \ > 0, \"\");\nContract.Ensures(Contract.Result<int>() >= 0, \"\");\n```\n\n请注意，粉红色高亮不是\
    \ Snippet Designer 的功能；它是另一个名为 Heat Margin 的优秀扩展。然而，这超出了本书的范围。\n\n在 Snippet Designer\
    \ 窗口中，你可以看到在编辑器窗口中突出显示的代码。\n\n选择生成时想要替换的代码部分。然后右键单击并从上下文菜单中选择 **设为替换**。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_44_0.png)\n\
    \n*图 31：设为替换*\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_44_1.png)\n\n*图 32：完成的新片段*\n\
    \n你会看到参数被占位符替换，并且该占位符的属性在 Replacements 网格中定义。剩下的就是为快捷方式命名（我将其命名为 **ccre**，代表“Code\
    \ Contract Requires Ensures”）并保存你的代码片段。\n\n在 Visual Studio 的代码编辑器中，输入 **ccre**\
    \ 快捷方式并按两次 Tab 键。我的代码片段会被插入，标识为替换的参数会被高亮显示，以便我立即编辑它。\n\n```csharp\n@references\n\
    public int MethodToRun(int parameter)\n{\n    Contract.Requires(param > 0, \"\"\
    );\n    Contract.Ensures(Contract.Result<int>() >= 0, \"\");\n\n    return parameter;\n\
    }\n```\n\n*图 33：代码片段已插入*\n\n这是一个非常易于使用的工具，我甚至还没有开始探索它为开发者提供的可能性。我的重点只是说明代码片段对开发者非常有用，并且可以在开发过程中扩展以满足你的特定需求。\n\
    \n### 代码契约文档生成\n\n我确信大多数（如果不是全部）开发者都不喜欢创建文档。它在许多项目会议中已成为房间里的大象。每个人都知道文档至关重要，我相信有很多开发者确实会创建简洁丰富的文档。这显然导致了许多旨在使此过程更轻松的工具和扩展。\n\
    \n因此，代码契约也可以集成所包含契约的文档是合理的。要启用文档生成，你需要打开项目属性的 **生成** 选项卡。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_46_0.png)\n\
    \n*图 34：启用 XML 文档文件*\n\n在这里，你需要选择 XML 文档文件选项。如果不启用此选项，文档 XML 文件将不会被创建。在这里你也可以指定文档文件的输出路径和名称。\n\
    \n下一个需要修改的选项在代码契约选项卡中。如果你滚动到代码契约选项卡底部，你会看到 Contract Reference Assembly 值未指定。将其更改为\
    \ Build。\n\n最后，你必须确保选择了 Emit contracts into XML doc file 选项。这将使代码契约注释成为生成文档文件的一部分。\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_46_1.png)\n\n*图 35：启用 Code Contracts\
    \ 文档*\n"
