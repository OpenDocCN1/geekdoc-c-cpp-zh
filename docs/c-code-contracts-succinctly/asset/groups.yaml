    *图 44：Male 类 Sleep 方法协定通过*\n\nCode Contracts 和抽象类完美协作，可为开发团队创建一个真正稳定且健壮的代码库。\n\
    \n## 接口\n\n让我们沿用前面 **Male** 和 **Female** 类的例子。快进 20 年，我们在火星上发现了外星人。他们与我们惊人地相似，因此属于人类，但他们既不是男性也不是女性。现在我们有了一个新类型\
    \ **Alien**，它继承自抽象类 **Human**。\n\n现在把接口想象成动词。一般来说，哪个动词可以应用于我的类？所有人类都需要学习新事物，并且可以被教导，所以现在我们可以创建一个名为\
    \ **ITeachable** 的接口。我们将在 **Human** 抽象类上实现 **ITeachable** 接口，因为所有人类都是可教导的。然而，外星人比\
    \ **Male** 或 **Female** 稍微高级一些，并且可以重新排列其分子成为不同结构，使外星人能够变形。因此，我们可以创建一个名为 **IShapeShiftable**\
    \ 的接口，它仅适用于 **Alien**。\n\n创建接口与创建抽象类非常相似。它也需要包含一个协定类，并且接口和协定类都需要通过各自的特性相互指向。\n\
    \n```csharp\nusing System.Diagnostics.Contracts;\n\n[ContractClass(typeof(IShapeShiftableContract))]\n\
