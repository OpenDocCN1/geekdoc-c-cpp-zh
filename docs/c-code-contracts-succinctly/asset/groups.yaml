  md: "\n## Chapter 3 Some Useful Tips\n\n### Using code snippets\n\nYou are likely\
    \ already familiar with code snippets in Visual Studio; Code Contracts also provide\
    \ this feature. When installing Code Contracts, the snippets are added. If you\
    \ are using C#, you simply type the shortcut and press the Tab key twice.\n\n\
    In Visual Basic, the use of code snippets is slightly different. Type the shortcut\
    \ and press the Tab key. There are subtle differences between the shortcut keys\
    \ in C# and Visual Basic. The **Contract.Requires** shortcut, for example, is\
    \ invoked in C# by typing **cr**, but in Visual Basic, it is invoked by typing\
    \ **creq**.\n\n### C# Code Snippets\n\nThe following code listings illustrate\
    \ the C# code snippet shortcuts. The shortcut used is the first line that is commented\
    \ out followed by the code generated by the snippet.\n\n```csharp\n//cr\nContract.Requires(false);\n\
    ```\n\n*Code Listing 27: Contract.Requires Snippet*\n\n```csharp\n//ce\nContract.Ensures();\n\
    ```\n\n*Code Listing 28: Contract.Ensures Snippet*\n\n```csharp\n//ci\nContract.Invariant(false);\n\
    ```\n\n*Code Listing 29: Contract.Invariant Snippet*\n\n```csharp\n//crr\nContract.Result<int>()\n\
    ```\n\n*Code Listing 30: Contract.Result Snippet*\n\n```csharp\n//co\nContract.OldValue(x)\n\
    ```\n\n*Code Listing 31: Contract.OldValue Snippet*\n\n```csharp\n//cim\n[ContractInvariantMethod]\n\
    [System.Diagnostics.CodeAnalysis.SuppressMessage(\n    \"Microsoft.Performance\"\
    , \"CA1822:MarkMembersAsStatic\",\n    Justification = \"Required for code contracts.\"\
    )]\nprivate void ObjectInvariant()\n{\n    Contract.Invariant(false);\n}\n```\n\
    \n*Code Listing 32: Contract.Invariant Method Snippet*\n\n```csharp\n//crn\nContract.Requires(arg\
    \ != null);\n```\n\n*Code Listing 33: Contract.Requires Not Null Snippet*\n\n\
    ```csharp\n//cen\nContract.Ensures(Contract.Result<string>() != null);\n```\n\n\
    *Code Listing 34: Contract.Ensures Contract.Result Snippet*\n\n```csharp\n//crsn\n\
    Contract.Requires(!String.IsNullOrEmpty(arg));\n```\n\n*Code Listing 35: Contract.Requires\
    \ String with Value Snippet*\n\n```csharp\n//cesn\nContract.Ensures(!String.IsNullOrEmpty(Contract.Result<string>()));\n\
    ```\n\n*Code Listing 36: Contract.Ensures Contract Result with String Value Snippet*\n\
    \n```csharp\n//cca\nContract.Assert(false);\n```\n\n*Code Listing 37: Contract.Assert\
    \ Snippet*\n\n```csharp\n//cam\nContract.Assume(false);\n```\n\n*Code Listing\
    \ 38: Contract.Assume Snippet*\n\n```csharp\n//cre\nContract.Requires<ArgumentException>(false);\n\
    ```\n\n*Code Listing 39: Contract.Requires with ArgumentException Snippet*\n\n\
    ```csharp\n//cren\nContract.Requires<ArgumentNullException>(arg != null, \"arg\"\
    );\n```\n\n*Code Listing 40: Contract.Requires Argument Not Null Snippet*\n\n\
    ```csharp\n//cresn\nContract.Requires<ArgumentException>(!String.IsNullOrEmpty(arg));\n\
    ```\n\n*Code Listing 41: Contract.Requires String Parameter with Value*\n\n```csharp\n\
    //cintf\n#region IFoo contract binding\n[ContractClass(typeof(IFooContract))]\n\
    public partial interface IFoo\n{\n\n}\n\n\n[ContractClassFor(typeof(IFoo))]\n\
    abstract class IFooContract : IFoo\n{\n}\n#endregion\n```\n\n*Code Listing 42:\
    \ Interface Template and Associated Contract Class Snippet*\n\n### Extending code\
    \ snippets\n\nThis next section is not, strictly speaking, exclusive to Code Contracts,\
    \ but I would be remiss if I didn't mention the ability you have to extend your\
    \ code snippets. I have always found that extending code snippets is a bit of\
