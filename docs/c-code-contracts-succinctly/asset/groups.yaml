    }\n```\n\n```csharp\nContract.Requires(param > 0, \"\");\nContract.Ensures(Contract.Result<int>()\
    \ >= 0, \"\");\n```\n\nPlease note that the pink highlight is not a feature of\
    \ Snippet Designer; it’s another great extension called Heat Margin. This, however,\
    \ is beyond the scope of this book.\n\nIn the Snippet Designer window, you can\
    \ see the code you highlighted in the editor window.\n\nSelect the section of\
    \ code that you want replaced at the time of generation. Then, right-click and\
    \ select **Make Replacement** from the context menu.\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_44_0.png)\n\
    \n*Figure 31: Make Replacement*\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_44_1.png)\n\
