    \ easily cater to both.\n\n# ## Method purity\n\nA book on Code Contracts would\
    \ not be complete without mentioning purity. When referring to Code Contracts,\
    \ what exactly does method purity mean? Well, Code Contracts have an attribute\
    \ called **[Pure]** that you can decorate methods with. This is basically an expression\
    \ of the quality of the method, and that the method can’t change the state of\
    \ any objects seen by callers. In other words, pure methods are only allowed to\
    \ change objects created after the method has been entered.\n\nCode Contracts\
    \ require all methods called inside a contract to be pure. The reasons for this\
    \ are simply:\n\n+   - To avoid side effects in methods used in preconditions\
    \ and postconditions.\n+   - To make the task of the static checker easier because\
    \ it can assume object states will be the same after the method is called.\n+\
    \   - To improve design by specifically clarifying your intent that the method\
    \ will not alter the state of objects after the method call has ended.\n\nTo illustrate\
    \ the effect that a non-pure method has on the static checker, consider the following\
    \ code listing.\n\n```\n```csharp\npublic class DemoPurity\n{\n    /// <summary>\n\
