    \n对于代码契约的下一个示例，我将使用废料处理流程来说明 Contract.OldValue<> 方法的使用。我必须提到的是，Contract.OldValue<>\
    \ 方法只能在 Ensures 契约的条件表达式中使用。\n\n让我们假设钢铁制造商需要最大限度地减少切割过程中产生的边角料。为此，他们使用一种计算方法，取待切割钢材的体积，并根据切割系数计算可使用的钢材量。完美切割意味着如果钢材体积为\
    \ 10 m³，则 resulting 切削钢材也等于 10 m³。因此，所有钢材都已被消耗且产生零边角料。\n\n不完美的切割会导致钢材体积小于原始体积，这意味着用户需要更改切割系数，直到能够确保接近完美的切割。不深入讨论阈值和限制的更详细细节，让我们假设如果返回的不是完美切割，则切割过程不予批准。\n\
