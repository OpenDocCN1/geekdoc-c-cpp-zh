    # # Chapter 3 Some Useful Tips


    # ## Using code snippets


    You are likely already familiar with code snippets in Visual Studio; Code Contracts
    also provide this feature. When installing Code Contracts, the snippets are added.
    If you are using C#, you simply type the shortcut and press the Tab key twice.


    In Visual Basic, the use of code snippets is slightly different. Type the shortcut
    and press the Tab key. There are subtle differences between the shortcut keys
    in C# and Visual Basic. The **Contract.Requires** shortcut, for example, is invoked
    in C# by typing **cr**, but in Visual Basic, it is invoked by typing **creq**.


