    # About the Author


    Dirk Strauss is a Microsoft .NET MVP with over 13 years of programming experience.
    He uses his love for code and technology in general as inspiration to learn and
    share as much as he can. He has extensive experience in ERP systems (specifically
    SYSPRO), with warehousing and inventory being the areas that interest him most.


    He currently works for Evolution Software (the best company in the universe),
    which is situated in Cape Town, South Africa. Learning from such skilled individuals
    who are passionate about technology is the perfect environment where he can live
    out his passion and creativity.


    He is married to Adele, the most stunningly wonderful woman, who gave him two
    beautiful children, Irénée and Tristan. They are his rock upon which the troubles
    of this world founder and break.


    He is always busy after hours tinkering with something or other, being interested
    in too many things when it comes to technology. Blogging and writing are creational
    outlets for him; you can find him on Twitter at [@DirkStrauss](https://twitter.com/DirkStrauss),
    and at his blog, [Dirkstrauss.com](https://dirkstrauss.com).


    > > “There is a different breed of person that can be found in the lonely hours
    of the night, faces illuminated by the glow of a computer screen, yapping on technology.”
    ~ Dirk Strauss'
  - '[PAGE 7]


    # Chapter 1 Getting Started


    # What are Code Contracts?


    Many developers might have an idea what Code Contracts are, but they don''t have
    an understanding of the benefits they provide or how to implement them. I have
    to mention, though, that I''ve found the attitude toward Code Contracts and their
    use in development is somewhat divided. There is a group of staunch supporters
    on the one hand, and on the opposite end of that spectrum, there is a group of
    opponents. In the middle, however, is a broad group of developers who are unfamiliar
    with Code Contracts and their uses. It is here that I suspect many of you will
    find yourself. After working with Code Contracts for a while, I would expect that
    many of you will naturally migrate to one end of this love-hate spectrum.


    Created by RiSE (Research in Software Engineering) at Microsoft, Code Contracts
    have been around for a number of years. As a matter of fact, the release notes
    on the RiSE website start at release 1.1.20215 on February 23, 2009. Code Contracts
    have gone through various revisions throughout the years, and have now found a
    new home on GitHub after being open-sourced by Microsoft.


    Before we continue, let''s define what Code Contracts are exactly. The goal of
    Code Contracts is to provide a language-agnostic way to convey code assumptions
    in your .NET applications. Let us use the analogy of an actual contract between
    yourself and a third-party (for example, a bank). It is an agreement between the
    two of you to ensure both parties act in a specific manner. This is at the heart
    of Code Contracts. We are assuming certain logic within code, and we define contracts
    within that code in order to maintain those assumptions. These assumptions can
    take the form of preconditions, postconditions, and state invariants. If at any
    time those contractual conditions are broken, we will know about it. This is especially
    valuable when working in teams.


    # Download and installation


    For the rest of this book, I will be referring to Visual Studio Enterprise 2015
    (.NET Framework 4.6) and Code Contracts version 1.9.10714.2. Code Contracts will
    also work with Visual Studio 2015 Professional, but unfortunately, at the time
    of this writing, Code Contracts do not work with the free Visual Studio 2015 Community
    edition. Getting started with Code Contracts in Visual Studio is very easy. From
    the **Tools** menu in Visual Studio, click **Extensions and Updates**.'
