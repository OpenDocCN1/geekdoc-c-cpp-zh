  mdcn: "\n然后你需要确保已为代码添加了良好的注释。你需要在创建新方法或逻辑不明显的代码行时尽快养成这个习惯。反过来，代码中注释过多也并非好主意。那么什么时候应该注释，什么时候不应该？一个很好的经验法则是，仅当代码背后的逻辑不明显时才注释代码。\n\
