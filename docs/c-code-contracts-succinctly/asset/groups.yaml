  mdcn: "\n现在如果将鼠标悬停在 **ProductionVolumePerBin()** 方法上，你会看到 Quick Info 窗口包含了有关其实现的契约的丰富信息。\n\
    \n```\n.ProductionVolumePerBin(binVol, factor);\n\nint CodeContractsDemoProject.ERP.WarehouseIntegration.ProductionVolumePerBin(int\
    \ binVolume, int factor)\nCalculate the production volume of steel per bin\n\n\
    Contracts:\nrequires IsEven(binVolume)\nrequires factor > 1\nrequires binVolume\
    \ > factor\nensures result == binVolume\n```\n\n*图 61：使用契约增强的方法工具提示*\n\n这使我能够在无需查看方法内部的情况下使用该方法，并传递能够成功验证的有效参数。我现在对正在调用的方法有了更多信息。\n\
    \n使用 Code Contracts Editor Extensions 时的另一个亮点是可以查看基类实现的 Code Contracts。让我们再看看我们的\
    \ **CalculateNewCutFactor()** 方法。\n\n```\n/// <summary>\n/// Calculate a new cutting\
    \ factor\n/// r.Next(1, 7); returns a random number between 1 and 6\n/// </summary>\n\
    /// <param name=\"binVol\">Upper range value of random (bin volume + 1)</param>\n\
    /// <returns>\n/// A new cutting factor greater than 1 and equal to the bin volume\n\
    /// </returns>\nprivate int CalculateNewCutFactor(int binVol)\n{\n    Random r\
    \ = new Random();\n    return r.Next(2, binVol + 1);\n}\n```\n\n*代码清单 68：Random()\
    \ 方法*\n\n将鼠标悬停在 **Next()** 方法上，我们可以查看其所需契约。Code Contracts Editor Extensions 通过挖掘基类并显示已实现的契约来实现这一点。\n\
    \n```csharp\nprivate int CalculateNewCutFactor(int binVol, int factor)\n{\n  \
    \  Random r = new Random();\n    return r.Next(2, binVol + 1);\n}\n```\n\n```\n\
    int Random.Next(int minValue, int maxValue) (+ 2 overloads)\n\nContracts:\n  \
    \  requires minValue <= maxValue\n    ensures result >= minValue\n    ensures\
    \ result < maxValue || maxValue == minValue && result == minValue\n```\n\n图 62：Random\
    \ Next 方法契约\n\n我们可以看到，Next() 方法实现的一个 Code Contracts 是 minValue 必须小于或等于 maxValue。对于我们的需求，我希望确保\
    \ minValue 始终大于或等于 2。利用我们从 Next() 方法实现的 Code Contracts 中获得的信息，我们现在可以继续创建自己的 GetRandom()\
    \ 方法，使其符合我们的 Code Contract 要求。\n\n```csharp\n/// <summary>\n/// Calculate a new\
    \ cutting factor\n/// r.Next(1, 7); returns a random number between 1 and 6\n\
    /// </summary>\n/// <param name=\"binVol\">Upper range value of random (bin volume\
    \ + 1)</param>\n/// <returns>\n/// A new cutting factor greater than 1 and equal\
    \ to the bin volume\n/// </returns>\nprivate int CalculateNewCutFactor(int binVol)\n\
    {\n    return GetRandom(2, binVol + 1);\n}\n\n/// <summary>\n/// Get a random\
    \ number\n/// </summary>\n/// <param name=\"minValue\">Value not less than 2</param>\n\
    /// <param name=\"maxValue\">Upper range value of the random number to generate</param>\n\
    /// <returns>A random integer</returns>\nstatic int GetRandom(int minValue, int\
    \ maxValue)\n{\n    Contract.Requires(minValue >= 2,\n        \"minValue cannot\
    \ be less than 2\");\n    Random r = new Random();\n    return r.Next(minValue,\
    \ maxValue);\n}\n```\n\n代码清单 69：自定义 GetRandom() 方法\n\n使用 Code Contracts 和 Code\
    \ Contracts Editor Extensions 可以让我们编写更健壮的代码，并轻松微调代码以符合所需业务规则。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_87_0.png)\n\
    \n提示：你需要记住 Random 类并不是真正的随机数生成器。例如，当你调用 Next() 时，Random 类使用某些内部状态返回一个看似随机的数字。然后它会更改其内部状态，以便下次调用\
    \ Next() 时返回另一个看似随机的数字。生成真正的随机数超出了本书的范围；如果你需要真正的随机性，你需要做一些额外的研究。\n\n## 第 6 章 结论\n\
    \n到目前为止，我们已经了解了如何设置 Code Contracts 并使用各种契约方法来验证逻辑正确性。我们了解了 Code Snippets 如何让大量使用\
    \ Code Contracts 的开发人员更轻松。我们还了解了如何将 Code Contracts 集成到文档输出中，以及如何使用 Sandcastle\
    \ Help File Builder 生成用户友好的文档。\n\n在更高级的主题和技巧方面，我们了解了如何将 Code Contracts 与抽象类和接口集成，并且我们看到\
    \ Code Contracts 非常适合使用 IntelliTest 测试方法。我们探讨了另一个名为 Code Contracts Editor Extensions\
    \ 的工具如何将基类和你的自定义 Code Contracts 直接在 Quick Info 窗口中暴露给调用代码。\n\n从这里开始，我建议查看 [Code\
