    - 第 7 章 工具和资源 90\n\n## 《*Succinctly 系列*》书籍背后的故事\n\nDaniel Jebaraj，副总裁  \nSyncfusion,\
    \ Inc.\n\n### 保持领先\n\n如您所知，Syncfusion 是 Microsoft 平台软件组件的提供商。这使我们处于令人兴奋但具有挑战性的位置，始终处于领先地位。\n\
    \n每当 Microsoft 发布平台或工具时，这些天似乎大约每隔一周就会发布一次，我们必须迅速自行教育。\n\n### 信息丰富但更难消化\n\n实际上，这转化为大量的书籍订单、博客搜索和\
    \ Twitter 扫描。\n\n虽然互联网上可获得的信息越来越多，越来越多的书籍也在出版，甚至是关于相对较新主题的书籍，但继续阻碍我们的一方面是找不到简明的技术概览书籍的能力。\n\
    \n我们通常面临两个选择：阅读几本 500 多页的书籍，或在网络上搜索相关的博客文章和其他文章。就像其他有工作要做、需要服务客户的人一样，我们发现这非常令人沮丧。\n\
    \n### *简明* 系列\n\n这种沮丧转化为深切的愿望，生产一系列针对在 Microsoft 平台上工作的开发人员的简明技术书籍。\n\n我们坚信，鉴于此类开发人员已有的背景知识，大多数主题都可以翻译成\
    \ 50 到 100 页的书籍。\n\n这正是我们决心用 *简明* 系列来实现的目标。难道不是一切美好的事物都源于深切改变现状的愿望吗？\n\n### 最佳作者，最佳内容\n\
    \n每位作者都是从一群才华横溢的专家中精心挑选出来的，他们与我们有相同的愿景。你现在手中的这本书，以及该系列中其他可用的书籍，都是作者们不懈努力的结果。你会发现原创内容，保证在喝几杯咖啡的时间内让你快速上手。\n\
    \n### 永久免费\n\nSyncfusion 将致力于制作多主题的书籍。这些书籍将永远免费。我们发布的任何更新也将免费。\n\n### 免费？有什么条件？\n\
    \n这里没有条件。Syncfusion 对此努力有切身利益。\n\n作为组件供应商，我们独特的声明一直是我们提供市场上最深最广的框架。开发人员教育极大地帮助我们针对竞争对手的供应商进行市场营销和销售，他们承诺“只需点击一下即可启用\
    \ AJAX 支持”，或“把月亮变成奶酪！”\n\n### 让我们知道你怎么想\n\n如果您有任何感兴趣的话题、想法或反馈，请随时发送至我们 [succinctly-series@syncfusion.com](mailto:succinctly-series@syncfusion.com)。\n\
    \n我们衷心希望您喜欢阅读这本书，并且它能帮助您更好地理解学习主题。感谢您的阅读。\n\n请在 Twitter 上关注我们并在 Facebook 上“点赞”，以帮助我们传播\
    \ *简明* 系列！\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_5_0.png)\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_5_1.png)\n\
    \n## 关于作者\n\nDirk Strauss 是一位拥有超过 13 年编程经验的 Microsoft .NET MVP。他利用自己对代码和技术的热爱作为灵感，学习和分享尽可能多的内容。他在\
    \ ERP 系统方面拥有丰富的经验（特别是 SYSPRO），其中仓储和库存是他最感兴趣的领域。\n\n他目前在 Evolution Software（宇宙中最好的公司）工作，该公司位于南非开普敦。从这些对技术充满热情的熟练人士身上学习，是他能够实现自己热情和创造力的完美环境。\n\
    \n他已婚，妻子 Adele 是最令人惊艳的女人，她为他生了两个美丽的孩子 Irénée 和 Tristan。他们是他的依靠，世间的烦恼都在他们身上撞碎。\n\
    \n他下班后总是忙于摆弄这东西或那东西，对技术感兴趣的事情太多。博客和写作是他的创作出口；您可以在 Twitter 上找到他 [@DirkStrauss](https://twitter.com/DirkStrauss)，以及他的博客\
    \ [Dirkstrauss.com](https://dirkstrauss.com)。\n\n> “夜晚孤独的时光里，可以找到一种不同的人，他们的脸被电脑屏幕的光辉照亮，喋喋不休地谈论着技术。”\
    \ ~ Dirk Strauss\n\n## 第 1 章 入门\n\n### 什么是代码契约？\n\n许多开发人员可能对代码契约有所了解，但他们并不理解其提供的益处或如何实现它们。不过，我必须提到，我发现人们对代码契约及其在开发中的使用态度有些分歧。一方面有一群坚定的支持者，另一方面则有一群反对者。然而，中间却有一大群开发人员不熟悉代码契约及其用途。我怀疑你们中的许多人会发现自己处于这里。在使用代码契约一段时间后，我预计你们中的许多人会自然地迁移到这种爱恨光谱的某一端。\n\
    \n代码契约由 Microsoft 的 RiSE（软件工程研究）创建，已经存在多年。事实上，RiSE 网站上的发布说明从 2009 年 2 月 23 日的\
    \ 1.1.20215 版本开始。代码契约在这些年里经历了各种修订，并在被 Microsoft 开源后，现在在 GitHub 上找到了新的家。\n\n在继续之前，让我们确切地定义代码契约是什么。代码契约的目标是为您的\
    \ .NET 应用程序提供一种语言无关的方式来传达代码假设。让我们用您与第三方（例如银行）之间的实际合同作类比。这是一项协议，以确保双方以特定方式行事。这正是代码契约的核心。我们假设代码中的某些逻辑，并在代码中定义契约以维护这些假设。这些假设可以采用前置条件、后置条件和状态不变式的形式。如果在任何时候这些契约条件被破坏，我们就会知道。这在团队协作时尤其有价值。\n\
    \n### 下载和安装\n\n在本书的其余部分，我将参考 Visual Studio Enterprise 2015（.NET Framework 4.6）和代码契约版本\
    \ 1.9.10714.2。代码契约也适用于 Visual Studio 2015 Professional，但不幸的是，在撰写本文时，代码契约不适用于免费的\
    \ Visual Studio 2015 Community 版。在 Visual Studio 中开始使用代码契约非常容易。从 Visual Studio\
    \ 中的 **工具** 菜单中，单击 **扩展和更新**。\n"
