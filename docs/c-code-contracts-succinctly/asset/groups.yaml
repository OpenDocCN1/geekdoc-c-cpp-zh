    \ = \"SS\";\n            IssuedToWarehouse.BinReorderLevel = 5000;\n         \
    \   IssuedToWarehouse.LastStockTake = Convert.ToDateTime(\"2015-09-09\");\n  \
    \          break;\n    }\n    return IssuedToWarehouse;\n}\n```\n\n*Code Listing\
    \ 6: Warehouse Issue Logic*\n\nYou can see how postconditions can be used in Code\
    \ Contracts to create highly robust code. Think of a developer working in a distributed\
    \ team. Being able to work from anywhere in the world has many advantages and\
    \ disadvantages (depending on your point of view). The absence of personal, one-to-one\
    \ communication can be construed as a distinct disadvantage. Not being able to\
    \ sit in a boardroom where developers can flesh out a problem together remains\
    \ a challenge. Your brain can subconsciously infer feelings, meanings, and viewpoints\
    \ based on the multitude of other signals (such as body language, eye movement,\
    \ or breathing) that we tend to give out.\n\nCommunication is more than just the\
    \ act of speaking. Therefore, as developers, we need to become sharper and heighten\
    \ our effectiveness in other areas. A great place to start is at the code. With\
    \ Code Contracts, we are able to defensively preempt certain conditions that may\
    \ occur. Just because the specification doesn’t explicitly mention that a null\
    \ condition would break the integration, that doesn’t mean we don’t need to defend\
    \ against it.\n"
  mdcn: "\n当控制台应用程序运行时，异常会被抛出并显示在控制台窗口中。当使用具有自定义异常的代码契约时，例如代码清单 2 中所示的内容，你必须将 Code\
    \ Contracts 程序集模式属性设置为 **标准契约要求**。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_17_0.png)\n\
    \n*图 8：前置条件失败*\n\n前面的示例是说明 Code Contracts 强大功能的一种相当简单的方法。然而在生产系统中，显然不会在方法调用中硬编码值。这些值很可能来自数据库或用户输入。正如我们所知，所有输入（用户或数据存储）都是我们无法控制的东西，我们应如此对待。Code\
    \ Contracts 缓解了不良数据带来的负面影响。\n\n虽然前面的示例是可行的，但我希望我的代码契约能提供更多。我不想运行应用程序后才发现有代码段会导致我的契约失败。个人而言，我希望在构建项目时就能看到任何失败。这个项目足够小，所以我可以在项目属性窗口中指定的代码契约属性方面稍微大胆一些。\n\
    \n## 警告时构建失败\n\n返回到 Code Contracts 属性页，如果尚未启用，请启用 **执行静态契约检查**。接下来，你需要清除 **在后台检查**\
    \ 选项。然后你会看到 **警告时构建失败** 选项已启用。选择此选项。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_17_1.png)\n\
    \n*图 9：启用警告时构建失败*\n\n继续构建你的项目。静态契约检查会立即启动，并且由于你的代码契约未通过，构建将失败，如图 10 所示。然而，有一个问题。即使构建失败，你的错误列表也是空的。由于我们只有一个代码契约，我们知道去哪里查找。但是，当我们有多个代码契约时，这就不切实际了。\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_18_0.png)\n\n*图 10：Visual Studio 2015\
    \ 构建失败*\n\n出了什么问题？要找到导致构建失败的问题，请转到输出窗口。如果看不到输出窗口，请按 Ctrl+W、O 将其调出。然后你将看到构建结果以及失败的代码契约。\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_18_1.png)\n\n*图 11：Visual Studio 输出窗口*\n\
    \n在 Code Contracts 的当前版本 1.9.10714.2 中，构建错误未输出到错误列表的问题已被确定为 Visual Studio 2015\
    \ 版本中的一个错误。该错误已得到修复，并将在 Code Contracts 的下一个版本中包含。有关与 Visual Studio 2015 的 Code\
    \ Contracts 相关的此问题的更多信息，请查看 GitHub 上的 pull request 166 和 issue 137。如果你想查看有关 Code\
    \ Contracts 的所有开放问题，请查看 Code Contracts GitHub 页面上的 Issues。\n\nCode Contracts 是少数致力于不断改进当前版本的人们的成果。像我们这样的用户有责任报告我们遇到的問題，从而建立一个健康的意见领袖社区和更稳定的产品。最后，由于它是开源的，你可以为\
    \ Code Contracts 做出贡献，成为这个令人难以置信的 Visual Studio 扩展的一部分。\n\n## 代码契约后置条件\n\n代码契约后置条件是受契约方法向调用代码保证的方式，即如果所有前置条件都满足，它将返回特定结果。让我们回到银行和贷款的类比，为其制定合同。银行确保贷款将具有固定利率，但前提是还款按时且金额正确。你所做的付款可以等同于代码契约的前置条件。银行确保固定利率这一事实可以等同于后置条件。\n\
    \n因此，代码契约后置条件的语法使用 Ensures 方法也就不足为奇了。另一个值得注意的有趣点是，虽然后置条件验证受契约方法的结果，但它必须出现在方法中的前置条件之后。考虑以下代码示例：\n\
    \n```csharp\npublic static Warehouse AddSerializedItem(string productCode, int\
    \ serialNumber, int qty)\n{\n    Contract.Requires<SerialNumberException>\n  \
    \      (serialNumber >= 10000001, \"Invalid Serial number\");\n    Contract.Ensures(Contract.Result<Warehouse>()\
    \ != null);\n\n    ProductCode = productCode;\n    SerialNumber = serialNumber;\n\
    \    Quantity = qty;\n\n    return CreateItem();\n}\n```\n\n*代码清单 4：契约后置条件*\n\n\
    如前一个代码清单所示，我稍微扩展了我们的方法。我添加了后置条件，告诉调用代码此方法的返回值将是 Warehouse 类型并且不为 null。因此，调用代码无需检查返回给它的对象是否有效。契约指定它将返回一个\
    \ **Warehouse** 对象给它。\n\n```csharp\nContract.Ensures(Contract.Result<Warehouse>()\
    \ != null);\n```\n\n*代码清单 5：代码契约确保结果*\n\n在实际示例中，这基本上意味着创建的库存项目将根据特定条件（产品代码）发放到特定仓库。产品代码将产品标识为快速周转品、原材料、成品等，并在创建时必须发放到正确的仓库。我们受契约的\
    \ **AddSerializedItem** 方法告诉调用代码，它确保此仓库发放的结果将存储在 **Warehouse** 对象中。如果出现任何问题，产品代码将被发放到默认仓库。ERP\
    \ 系统的用户可以检查存储在默认仓库中的项目，并在稍后手动将产品代码发放到正确的仓库。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_20_0.png)\n\
    \n*图 12：代码契约后置条件结果*\n\n我在下面的代码清单中包含了 **CreateItem()** 方法的代码。虽然此代码示例仅用于解释概念，但逻辑是合理的。**switch**\
    \ 语句将有一组固定的情况供其检查，如代码清单 6 所示。然而，它不会为其返回的 **Warehouse** 对象硬编码值。这些值将在代码与 ERP 交互以创建产品代码条目并将其发放到仓库时从数据库或其他对象读取。代码逻辑所确保的是，该方法将始终返回一个\
    \ **Warehouse** 对象，并且该对象将始终是系统中的有效仓库。\n\n```csharp\nprivate static Warehouse CreateItem()\n\
    {\n    // Add Stocked Item code goes here\n    Warehouse IssuedToWarehouse = new\
    \ Warehouse();\n    switch (ProductCode.Substring(0,1))\n    {\n        case \"\
    A\":\n            IssuedToWarehouse.Code = \"FM\";\n            IssuedToWarehouse.Name\
    \ = \"Fast movers\";\n            IssuedToWarehouse.Bin = \"A\";\n           \
    \ IssuedToWarehouse.BinReorderLevel = 10000;\n            IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-01\");\n            break;\n        case \"B\"\
    :\n            IssuedToWarehouse.Code = \"FG\";\n            IssuedToWarehouse.Name\
    \ = \"Finished Goods\";\n            IssuedToWarehouse.Bin = \"B\";\n        \
    \    IssuedToWarehouse.BinReorderLevel = 500;\n            IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-04\");\n            break;\n        case \"C\"\
    :\n            IssuedToWarehouse.Code = \"RM\";\n            IssuedToWarehouse.Name\
    \ = \"Raw Materials\";\n            IssuedToWarehouse.Bin = \"AD\";\n        \
    \    IssuedToWarehouse.BinReorderLevel = 7500;\n            IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-02\");\n            break;\n        default:\n\
    \            IssuedToWarehouse.Code = \"GS\";\n            IssuedToWarehouse.Name\
    \ = \"General Stock\";\n            IssuedToWarehouse.Bin = \"SS\";\n        \
    \    IssuedToWarehouse.BinReorderLevel = 5000;\n            IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-09\");\n            break;\n    }\n    return\
    \ IssuedToWarehouse;\n}\n```\n\n*代码清单 6：仓库发放逻辑*\n\n你可以看到后置条件如何在代码契约中用于创建高度健壮的代码。想象一下在分布式团队中工作的开发人员。能够从世界任何地方工作有很多优点和缺点（取决于你的观点）。个人一对一沟通的缺失可以被视为一个明显的缺点。无法坐在会议室里让开发人员共同深入探讨问题仍然是一个挑战。你的大脑可以基于我们倾向于发出的众多其他信号（例如肢体语言、眼动或呼吸）潜意识地推断出感受、含义和观点。\n\
    \n沟通不仅仅是说话的行为。因此，作为开发人员，我们需要在其他方面变得更敏锐并提高效率。一个很好的起点是代码。有了代码契约，我们能够防御性地预先应对可能发生的某些条件。仅仅因为规范没有明确提到空条件会破坏集成，并不意味着我们不需要对其进行防御。\n"
