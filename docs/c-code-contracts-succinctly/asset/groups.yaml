    represents the smallest possible value for **Int32**. It is also a constant with
    a value of **-2,147,483,648**. The factor has a value of **-1** and the modulus
    results in an **OverflowException**. This means that our code in the **CutSteel()**
    method will effectively be **int.MinValue % -1**; and this fails our test.'
