    # ### Abstract Class


    If you have many classes that can be grouped together and described by a single
    noun, you are most likely dealing with an abstract class. The abstract class is
    then named as this noun. Another very important thing to take into consideration
    is that these inherited classes share some sort of functionality, and that you
    would never create an instance of the noun (abstract class).'
