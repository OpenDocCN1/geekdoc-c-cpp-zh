    *Code Listing 11: Assume Static Check*\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_25_0.png)\n\
    \n*Figure 14: Assume Passed*\n\nWhen we use **Contract.Assume**, we are telling\
