  mdcn: "\nThe preceding example shows how developers can bullet-proof code against\
    \ certain issues that logically could adversely affect the integration.\n\n##\
    \ The Code Contract invariant\n\nCode Contracts allow for the verification of\
    \ a class's internal state. It does this via the use of Code Contract invariants.\
    \ As the name suggests, an invariant is something that can never change. It will\
    \ always be as it is specified in the class under contract.\n\nWe now know that\
    \ our **AddSerializedItem** method must be supplied with a valid serial number.\
    \ Valid serial numbers fall within a specific range.\n\n```csharp\nContract.Requires<SerialNumberException>\n\
    \    (serialNumber >= 10000001, \"Invalid Serial number\");\n```\n\n*代码清单 7：契约要求条件*\n\
    \nWe also know that the method under contract guarantees the calling code that\
    \ a non-null **Warehouse** object will be returned when the valid serial number\
    \ precondition is met.\n\n```csharp\nContract.Ensures(Contract.Result<Warehouse>()\
    \ != null);\n```\n\n*代码清单 8：契约确保条件*\n\nLet us now assume that additional logic\
    \ has to be added that needs to check the validity of the production date. This\
    \ date can be in the future as well, so this needs to be supplied by an external\
    \ data store, user entry, or lookup.\n\nThis is quite easy, and accomplished by\
    \ adding a new private method to the class that has the **[ContractInvariantMethod]**\
    \ attribute applied to it. If we had to add this check on the **Warehouse** class,\
    \ we would need to add the following code to it.\n\n```csharp\n[ContractInvariantMethod]\n\
    private void Invariants()\n{\n    Contract.Invariant(this.ProductionYear >= 0);\n\
    \    Contract.Invariant(this.ProductionMonth >= 0);\n    Contract.Invariant(this.ProductionMonth\
    \ <= 12);\n    Contract.Invariant(this.ProductionDay >= 0);\n    Contract.Invariant(this.ProductionDay\
    \ <= 30);\n}\n```\n\n*代码清单 9：契约不变量方法*\n\nThis tells the Code Contracts that the\
    \ following properties for the production date have to fall within the following\
    \ ranges. None of them can be zero, the number of months can't be greater than\
    \ **12**, and the days can have a maximum value of **30** (assume we're working\
    \ with 30-day months).\n\nUsually, you can call the contract invariant method\
    \ anything you like, but many prefer to call it **ObjectInvariant**. Another point\
    \ to note regarding the preceding code listing is that the method must have a\
    \ void return type and be scoped as **private** or **protected**.\n\nCode Contract\
    \ invariant methods allow us to specify the state of a class that is not allowed\
    \ to change. The code is short and easy to understand and implement.\n\n## Other\
    \ Code Contract methods\n\nCode Contracts also contain various other methods for\
    \ use in your code. Let us have a look at these examples in the following sections.\n\
    \n### Contract Assert and Assume\n\nSome of you might be wondering what the difference\
    \ is between **Debug.Assert** and **Contract.Assert** when used in your code.\
    \ **Debug.Assert** is only executed when your code is compiled in **Debug** mode.\
    \ The **Contract.Assert** method, however, is executed when you debug your code\
    \ in **Debug** or **Release** mode.\n\nThe **Assert** method in Code Contracts\
    \ can also easily be confused with the **Contract.Requires** method. As we saw\
    \ in previous code listings, the **Requires** method is a precondition and must\
    \ always be called at the start of a specific method. This is because **Contract.Requires**\
    \ contains information regarding the method it resides in. **Contract.Assert**\
    \ and **Contract.Assume**, on the other hand, are specific to a certain bit of\
    \ code at some point in time within the method under contract.\n\nSo when do we\
    \ use which method? With **Assert**, the static checker runs and will try to prove\
    \ the assertion at that specific line of code. **Assume** will let the static\
    \ checker simply assume that whatever the check is it needs to prove, is true.\
    \ So why have both? Consider the next code listing.\n\n```csharp\npublic void\
    \ CompleteBinPreparation(int quantityRequired)\n{\n    QuantityRequired = quantityRequired;\n\
    \    int available = BinQtyAvailable();\n    Contract.Assert(QuantityRequired\
    \ <= available, \"Quantity required exceeds available bin quantity\");\n}\n\n\
    public int BinQtyAvailable()\n{\n    MaxBinQuantity = 75;\n    CurrentBinQuantity\
    \ = 50;\n    int QtyAvailable = MaxBinQuantity - CurrentBinQuantity;\n    return\
    \ QtyAvailable;\n}\n```\n\n*代码清单 10：Assert 静态检查*\n\nThe code in Code Listing 10\
    \ checks to see if the Bin containing the parts has enough space to contain the\
    \ required quantity. With the Assert method, we are letting the static checker\
    \ inspect the value of the QuantityRequired variable. If we had to pass through\
    \ a value of 77 for QuantityRequired, we would see the static checker emit a warning\
    \ and fail the build (remember, we turned on Fail build on warnings in the Code\
    \ Contracts property page).\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_24_0.png)\n\
    \n*图 13：Assert 失败*\n\nIf we had to modify the code in Code Listing 10 to contain\
    \ an Assume, the output would be quite different indeed. Consider the code in\
    \ the following listing.\n\n```csharp\npublic void CompleteBinPreparation(int\
    \ quantityRequired)\n{\n    QuantityRequired = quantityRequired;\n    int available\
    \ = BinQtyAvailable();\n    Contract.Assume(QuantityRequired <= available, \"\
    Quantity required exceeds available bin quantity\");\n}\n\npublic int BinQtyAvailable()\n\
    {\n    MaxBinQuantity = 75;\n    CurrentBinQuantity = 50;\n    int QtyAvailable\
