    # The Code Contract postcondition\n\nThe Code Contract postcondition is the method\
    \ under contract's way of guaranteeing to the calling code that it will return\
    \ a specific result if all the preconditions are met. Let us go back to the analogy\
    \ of a bank and a loan for which a contract is drawn up. The bank ensures that\
    \ the loan will have a fixed interest rate, but only if the repayments are made\
    \ on time and for the amount due. The payments made by you can be equated to the\
    \ preconditions of the Code Contract. The fact that the bank ensures a fixed interest\
    \ rate can be equated to the postcondition.\n\nIt is therefore no surprise that\
    \ the syntax of Code Contract postconditions use the Ensures method. Another interesting\
    \ point to take note of is that while the postcondition validates the result of\
    \ the method under contract, it must appear immediately after the preconditions\
