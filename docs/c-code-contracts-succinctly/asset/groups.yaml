    # ## Making Code Contracts more useful


    So far we have seen a lot of what Code Contracts can do. Here’s a tip on how to
    make the contracts you create more useful to developers using your classes and
    methods. Using Code Contracts Editor Extensions will allow you to see what the
    method you’re calling into requires with regard to the contracts defined in that
    method. It will do this without requiring you to drill down into the method and
    see what Code Contracts it implements.


