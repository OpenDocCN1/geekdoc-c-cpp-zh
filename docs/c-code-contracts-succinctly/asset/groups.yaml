    \ Visual Studio 工具栏选择**项目**（确保已在解决方案资源管理器中选择你的项目），然后单击*项目名 属性*菜单项（图 4）来找到代码契约集成。\n\
    \n我将自己的 Visual Studio 项目命名为 **CodeContractsDemo**，因此 Visual Studio 中**项目**菜单里的项将称为\
    \ **CodeContractsDemo 属性**。项目会打开熟悉的属性页，在属性页左侧列表的底部，你会看到一个新的属性窗格，名为**代码契约**。\n\n\
    单击它会显示琳琅满目的设置供你选择。不要让设置的数量吓到你；我们将在下一节中逐一介绍这些设置。只需知道许多设置都有默认值，如果你愿意，可以保持原样。\n\n\
    ![](img/0a07386735fd4e6427d20aa9bc165f5d_11_0.png)\n\n*图 4：项目属性*\n\n## 代码契约属性页\n\
    \n代码契约属性最初会向你展示许多选项和设置。代码契约下的属性分为三组：运行时检查、静态检查和契约引用程序集。\n\n通过选择**执行运行时契约检查**或**执行静态契约检查**来启用代码契约。\n\
    \n至少需要确保选择其中一个选项，才能在项目中启用代码契约。如果不选择其中任一选项，代码契约将不会在你的项目中启用，你也无法受益于它们为系统带来的价值。\n\
    \n运行时契约检查，顾名思义，会在运行时发挥作用。然而，静态契约检查则完全不同。它让代码契约在你键入代码或生成项目时分析你的代码。这正是代码契约变得有趣并为我带来最大价值的地方。\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_12_0.png)\n\n*图 5：代码契约属性页*\n\n## 静态检查\n\
    \n如果启用静态检查，建议在属性页中保持选择**在后台检查**选项。这是因为分析可能需要一些时间才能完成。另一个建议的选项是在 Visual Studio\
    \ 中选择并行生成选项。从 Visual Studio 的**工具**菜单中选择**选项**。在选项屏幕左侧的树视图（图 6）中，展开**项目和解决方案**节点。你会注意到一个名为**生成和运行**的节点。选择它，你将看到启用并行生成的选项。\n\
    \n任何大于 **1** 的值都将启用 Visual Studio 中的并行生成选项。我机器上的默认值是 **8**。在此文本框中输入值 **1** 将有效关闭\
    \ Visual Studio 中的并行生成。通过在 Visual Studio 中启用并行生成，你可以让代码契约并行分析多个项目。根据 RiSE 的说法，该\
    \ Visual Studio 扩展是线程安全的。代码契约属性页中还有许多其他可用选项，但你现在无需进一步配置这些设置即可开始使用代码契约。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_13_0.png)\n\
    \n图 6：Visual Studio 并行生成选项\n\n你会注意到 Visual Studio 2015 建议了几处更正。在图 7 中，你会看到 **using**\
    \ 语句是第一项建议，也是此实例中我们需要应用的修复。\n\n## Visual Studio 2015 灯泡\n\n这项生产力功能是 Visual Studio\
    \ 2015 中的新功能。灯泡会自动出现在 Visual Studio 编辑器中，并针对开发者当前正在键入的代码行提供错误修复和重构建议。还可以通过在代码行上按\
    \ **Ctrl+Period** 手动调用灯泡，以查看潜在修复列表。\n\n## 代码契约前置条件\n\n请考虑以下代码清单，它检查传递给方法的序列号的值。此方法用于将序列化库存项添加到新\
    \ ERP 系统的库存表中。\n\n```csharp\npublic static class ERPIntegration\n{\n    public\
    \ static void AddSerializedItem(string productCode, int\nserialNumber, int qty)\n\
    \    {\n        Contract.Requires<SerialNumberException>\n            (serialNumber\
    \ >= 10000001, \"Invalid Serial number\");\n    }\n}\n\npublic class SerialNumberException\
    \ : Exception\n{\n    public SerialNumberException()\n    {\n    }\n\n    public\
    \ SerialNumberException(string message)\n        : base(message)\n    {\n    }\n\
    \n    public SerialNumberException(string message, Exception inner)\n        :\
    \ base(message, inner)\n    {\n    }\n}\n```\n\n*代码清单 2：代码契约前置条件*\n\nContract.Requires\
    \ 语句表示前置条件。前置条件是方法体中的第一批语句。在上面的代码清单中，前置条件检查传递给方法的序列号的值，并确定它是否是有效序列号。\n\n现在让我们更仔细地看看实际的代码契约。代码契约的组成如下：Contract.Requires<TException>(bool\
    \ condition, string errorMessage)，其中 TException : Exception。布尔条件会被验证，如果失败，代码契约将抛出带有所提供消息的异常。请注意，我向契约添加了一个名为\
    \ SerialNumberException 的自定义异常。它派生自 Exception 类，但你可以在此处添加任何适用的异常以满足需求。\n\n上述代码清单中的代码契约格式只是一种实现。以下列表说明了代码契约前置条件的有效语法：\n\
    \n- Contract.Requires(bool condition)\n- Contract.Requires(bool condition, string\
    \ errorMessage)\n- Contract.Requires<TException>(bool condition)\n- Contract.Requires<TException>(bool\
    \ condition, string errorMessage)\n\n就个人而言，我更喜欢指定异常类与用户定义错误消息的组合，当代码契约中表达的条件失败时抛出该错误消息。这为开发者提供了一种非常强大的机制，以确保传递给方法的值有效。它还将开发者从必须为可能破坏系统的每一种可能情况编写防御性代码中解放出来。知道受契约约束的方法始终遵循你指定的预定规则，会让作为开发者的你更加安心。\n\
    \n## 代码契约前置条件的实际应用\n\n为了演示代码契约中定义的前置条件失败，我在方法调用中硬编码了一个无效序列号。由于这是一个控制台应用程序，对方法的调用被包裹在\
    \ try/catch 语句中，该语句将错误输出到控制台。请考虑以下代码清单。\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    try\n    {\n        ERPIntegration.AddSerializedItem(\"BC32WL\"\
    , 70012, 1);\n    }\n    catch (Exception ex)\n    {\n        Console.Write(ex.Message);\n\
    \        Console.ReadLine();\n    }\n}\n```\n\n代码清单 3：代码契约前置条件的实际应用\n\n"
