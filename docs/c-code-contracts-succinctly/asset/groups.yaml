    # Test 3: Failed, ContractException


    Test 3 failed because the Code Contract ensures a result that the method isn''t
    adhering to. Remember, the **ProductionVolumePerBin()** method ensures that the
    bin volume is returned to the calling code, which signifies that we have produced
    a perfect cut with zero scrap. The test failed, and in a production environment
    this situation will happen. Our Code Contract ensures that the result returned
    by the method will always equal the bin volume. This means that we need to deal
    with the eventuality of an imperfect cut.


    # Test 4: Failed, OverflowException


    The last failed test is rather interesting. We can see that the test was passed
