    # ## Testability


    The warning we see is that an uninstrumented method was detected in our code.
    This is specific to the `Random()` method used in the `CalculateNewCutFactor()`
    method. This simply means that IntelliTest cannot dig down into all the paths
    in my code in order to generate the required outputs it needs in order to test.


    # ## Boundary


    IntelliTest imposes certain limits on paths it executes in order to prevent it
    from getting stuck in the event that the application goes into an infinite loop.
    These limits can be modified by clicking the **Fix** icon on the menu bar.'
