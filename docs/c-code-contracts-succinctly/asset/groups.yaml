    \ 抽象类和接口\n\n为抽象类和接口创建 Code Contracts 需要采用稍微不同的方式，正如你可能预料的那样。这是因为抽象类和接口不能包含方法体。许多开发者仍然想知道抽象类和接口之间的区别。我听说过的最好的区分何时使用抽象类、何时使用接口的解释之一如下。\n\
    \n### 抽象类\n\n如果你有许多类可以归为一组，并用一个名词来描述，那么你很可能是在处理一个抽象类。然后，这个抽象类就以该名词命名。另一个非常重要的考虑因素是，这些继承类共享某种功能，而且你永远不会创建该名词（抽象类）的实例。\n\
    \n想一想下面的例子：你有一个类型为 Human 的抽象类。你永远不会只实例化一个 Human，而是实例化一种 Human，例如 Female 或 Male。因此，Male\
    \ 和 Female 都继承自抽象类 Human。然后，这个抽象类将实现一个方法 void Sleep()，这是所有人类都必须做的（共享功能）。\n\n要在抽象类上实现\
    \ Code Contracts，你需要创建一个单独的 ContractClass 类，并通过使用特性将该协定类与抽象类关联起来。\n\n```csharp\n\
    using System.Diagnostics.Contracts;\n\n/// <summary>\n/// Human Abstract Class\n\
    /// </summary>\n[ContractClass(typeof(HumanContract))]\npublic abstract class\
    \ Human\n{\n    public abstract void Run(int distance);\n    public abstract void\
    \ Sleep(int hours);\n}\n\n/// <summary>\n/// Human Contract Class\n/// </summary>\n\
    [ContractClassFor(typeof(Human))]\npublic abstract class HumanContract : Human\n\
    {\n    public override void Sleep(int hours)\n    {\n        Contract.Requires(hours\
    \ >= 8,\n            \"You need more than 8 hours of sleep each night.\");\n \
    \   }\n}\n```\n\n代码清单 49：抽象类和协定类\n\n抽象类 Human 使用特性 [ContractClass(typeof(HumanContract))]，而协定类\
    \ HumanContract 使用特性 [ContractClassFor(typeof(Human))]。\n\n抽象类 Human 基本上规定了所有人类都会睡觉和奔跑。在\
    \ Sleep() 方法的协定中（定义于 HumanContract），我们定义所有人类每晚必须至少睡八小时。\n\n让我们创建一个继承自 Human 抽象类的\
    \ Male 类。\n\n```csharp\npublic class Male : Human\n{\n    public override void\
    \ Run(int distance)\n    {\n        Console.Write(\"The distance run was \" +\
    \ distance);\n        Console.ReadLine();\n    }\n    public override void Sleep(int\
    \ hours)\n    {\n        Console.Write(\"The hours slept were \" + hours);\n \
    \       Console.ReadLine();\n    }\n}\n```\n\n*代码清单 50：继承自 Human 的 Male 类*\n\n\
    从 Male 类可以看出，它完全不包含 Code Contracts。它所做的只是继承自 Human 抽象类。\n\n```csharp\nnamespace\
    \ CodeContractsDemo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            try\n            {\n                Male oMan\
    \ = new Male();\n                oMan.Sleep(5);\n            }\n            catch\
    \ (Exception ex)\n            {\n                Console.Write(ex.Message);\n\
    \                Console.ReadLine();\n            }\n        }\n    }\n}\n```\n\
    \n*代码清单 51：实例化 Male 类并指定五小时睡眠*\n\n如果我们实例化 Male 类并以五小时调用 Sleep 方法，我们的 Code Contract\
    \ 就会生效，并告诉我们人类每晚需要八小时睡眠。\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_57_0.png)\n\
    *图 43：Male 类 Sleep 方法协定被违反*\n\n将调用代码修改为指定周六早上舒舒服服地睡上九小时，情况就不同了。\n\n```csharp\n\
    namespace CodeContractsDemo\n{\n    class Program\n    {\n        static void\
