    \ installed Snippet Designer, it will appear under your installed extensions.\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_42_1.png)\n\n*Figure 28: Snippet Designer\
    \ Extension*\n\nAt its most basic, Snippet Designer gives you the ability to generate\
    \ code snippets on the fly. Regarding Code Contracts, there are a set few that\
    \ I always want to include within my methods. I want to be able to chain them\
    \ together under a single code snippet, and for this, Snippet Designer is very\
    \ well suited.\n\nHighlight the Code Contracts you want to create a snippet of,\
    \ open the context menu, and click Export as Snippet.\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_43_0.png)\n\
