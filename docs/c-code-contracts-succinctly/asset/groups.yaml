    \ the previous examples regarding **Assert** and **Assume** only apply to the\
    \ static checker. Because we have **Perform Runtime Code Contract Checking** on\
    \ and set to **Full**, the **Contract.Assume** will still fail during run-time\
    \ if the condition being checked fails (the external library returns an invalid\
    \ value for the available bin quantity).\n\n![](img/0a07386735fd4e6427d20aa9bc165f5d_26_0.png)\n\
    \n*Figure 15: Assume Failed at Runtime*\n\nAssert and Assume make for a very powerful\
