- pgno: 15
  md: "You will notice that Visual Studio 2015 suggests a few corrections. In Figure\
    \ 7, you see that the **using** statement is the first suggestion, and is the\
    \ fix we need to apply in this instance.\n\n# ## Visual Studio 2015 light bulbs\n\
    \nThis productivity feature is new in Visual Studio 2015. Light bulbs appear automatically\
    \ in the Visual Studio editor and provide error-fixing and refactoring suggestions\
    \ to the developer on the current line of code being typed. Light bulbs can also\
    \ manually be invoked by pressing **Ctrl+Period** on a line of code to see a list\
    \ of potential fixes.\n\n# ## The Code Contract precondition\n\nConsider the following\
    \ code listing, which checks the value of the serial number being passed to the\
    \ method. This method is used to add a serialized stock item to the inventory\
    \ table of the new ERP system.\n\n```\n```csharp\npublic static class ERPIntegration\n\
    {\n    public static void AddSerializedItem(string productCode, int\nserialNumber,\
    \ int qty)\n    {\n        Contract.Requires<SerialNumberException>\n        \
    \    (serialNumber >= 10000001, \"Invalid Serial number\");\n    }\n}\n\npublic\
    \ class SerialNumberException : Exception\n{\n    public SerialNumberException()\n\
    \    {\n    }\n\n    public SerialNumberException(string message)\n        : base(message)\n\
    \    {\n    }\n\n    public SerialNumberException(string message, Exception inner)\n\
    \        : base(message, inner)\n    {\n    }\n}\n```\n```\n\n*Code Listing 2:\
    \ Code Contract Precondition*"
  merge: -1
  img_proc: true
- pgno: 16
  md: "The Contract.Requires statement denotes a precondition. Preconditions are the\
    \ first statements in the method body. In the previous code listing, the precondition\
    \ checks the value of the serial number passed to the method and determines if\
    \ it is a valid serial number.\n\nNow let us take a closer look at the actual\
    \ Code Contract. The Code Contract is put together as follows: Contract.Requires<TException>(bool\
    \ condition, string errorMessage) where TException : Exception. The Boolean condition\
    \ is validated, and if it fails, the Code Contract will throw an exception with\
    \ the message provided. Note that I have added a custom exception to the contract\
    \ called SerialNumberException. It is derived from the Exception class, but you\
    \ can add any applicable exception here to suit your requirements.\n\nThe format\
    \ of the Code Contract in the preceding code listing is but one implementation.\
    \ The following list illustrates the valid syntax for the Code Contract preconditions:\n\
    \n+   - Contract.Requires(bool condition)\n+   - Contract.Requires(bool condition,\
    \ string errorMessage)\n+   - Contract.Requires<TException>(bool condition)\n\
    +   - Contract.Requires<TException>(bool condition, string errorMessage)\n\nPersonally,\
    \ I prefer the combination of a specified exception class and the user-defined\
    \ error message thrown if the condition expressed in the Code Contract fails.\
    \ This provides the developer with a very powerful mechanism to ensure that the\
    \ values passed to the method are valid. It also frees the developer from having\
    \ to defensively code for every eventuality that might break the system. Knowing\
    \ that the method under contract will always answer to the predetermined rules\
    \ you specified gives you more peace of mind as a developer.\n\n# The Code Contract\
    \ precondition in action\n\nTo illustrate the failure of the precondition defined\
    \ in the Code Contract, I hard-coded an invalid serial number in the method call.\
    \ Being a console application, the call to the method is wrapped in a try/catch\
    \ statement that outputs the error to the console. Consider the following code\
    \ listing.\n\n```\nstatic void Main(string[] args)\n{\n    try\n    {\n      \
    \  ERPIntegration.AddSerializedItem(\"BC32WL\", 70012, 1);\n    }\n    catch (Exception\
    \ ex)\n    {\n        Console.Write(ex.Message);\n        Console.ReadLine();\n\
    \    }\n}\n```\n\nCode Listing 3: The Code Contract Precondition in Action"
  merge: -1
  img_proc: true
- pgno: 17
  md: 'When the console application is run, the exception is thrown and displayed
    in the console window. When using a Code Contract that has a custom exception,
    such as the one shown in Code Listing 2, you must set the Code Contracts Assembly
    Mode property to **Standard Contract Requires**.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_17_0.png)


    *Figure 8: Precondition Failed*


    This preceding example is a rather simple way to illustrate the power of Code
    Contracts. In a production system, however, one would obviously not have hard-coded
    values in the method call. The possibility that these values would come from a
    database or from user input is very high. As we all know, all input (user or data
    store) is something beyond our control, and we should treat it as such. Code Contracts
    mitigate the negative effects of bad data.


    While the preceding example is functional, I want more from my Code Contract.
    I do not want to run my application and then realize that there are sections of
    code that cause my contracts to fail. Personally, I would like to see any failures
    at the moment I build my project. This project is small enough, so I can be a
    bit cavalier with the Code Contract properties as specified in the Project Properties
    window.


    # Fail build on warnings


    Return to the Code Contracts property page, and if you haven''t already done so,
    enable **Perform Static Contract Checking**. Next, you need to clear the **Check
    in background** option. Then you will see that the **Fail build on warnings**
    option is enabled. Select this option.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_17_1.png)


    *Figure 9: Enable Fail Build on Warnings*'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Go ahead and build your project. Static Contract Checking kicks in immediately,
    and because your Code Contract does not pass, your build will fail, as shown in
    Figure 10. There is, however, a problem. Your Error List is empty even though
    your build failed. Because we only have a single Code Contract, we know where
    to look. This, however, isn''t feasible when we have several code contracts.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_18_0.png)


    Figure 10: Visual Studio 2015 Build Failed


    So what went wrong? To find the issue causing the build failure, head over to
    the Output window. If you don''t see the Output window, press Ctrl+W, O to bring
    it into view. You will then see the results of the build and the Code Contract
    that failed.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_18_1.png)


    Figure 11: Visual Studio Output Window'
  merge: -1
  img_proc: true
- pgno: 19
  md: "With the current version 1.9.10714.2 of Code Contracts, the build errors not\
    \ being output to the Error List has been identified as a bug in the release for\
    \ Visual Studio 2015. This bug has been fixed and will be included in the next\
    \ release of Code Contracts. For more information on this issue relating to Code\
    \ Contracts for Visual Studio 2015, have a look at pull request 166 and issue\
    \ 137 on GitHub. If you want to view all the open issues regarding Code Contracts,\
    \ have a look at the Issues on the Code Contracts GitHub page.\n\nCode Contracts\
    \ is the result of a handful of dedicated individuals who continually work to\
    \ improve the current version. It's up to users like us to report issues we come\
    \ across, and in doing so, build a healthy community of influencers and a more\
    \ stable product. Lastly, since it's open source, you can contribute to Code Contracts\
    \ and be a part of this incredible Visual Studio extension.\n\n# The Code Contract\
    \ postcondition\n\nThe Code Contract postcondition is the method under contract's\
    \ way of guaranteeing to the calling code that it will return a specific result\
    \ if all the preconditions are met. Let us go back to the analogy of a bank and\
    \ a loan for which a contract is drawn up. The bank ensures that the loan will\
    \ have a fixed interest rate, but only if the repayments are made on time and\
    \ for the amount due. The payments made by you can be equated to the preconditions\
    \ of the Code Contract. The fact that the bank ensures a fixed interest rate can\
    \ be equated to the postcondition.\n\nIt is therefore no surprise that the syntax\
    \ of Code Contract postconditions use the Ensures method. Another interesting\
    \ point to take note of is that while the postcondition validates the result of\
    \ the method under contract, it must appear immediately after the preconditions\
    \ in the method. Consider the following code sample:\n\n```\n```csharp\npublic\
    \ static Warehouse AddSerializedItem(string productCode, int serialNumber, int\
    \ qty)\n{\n    Contract.Requires<SerialNumberException>\n        (serialNumber\
    \ >= 10000001, \"Invalid Serial number\");\n    Contract.Ensures(Contract.Result<Warehouse>()\
    \ != null);\n\n    ProductCode = productCode;\n    SerialNumber = serialNumber;\n\
    \    Quantity = qty;\n\n    return CreateItem();\n}\n```\n```\n\nCode Listing\
    \ 4: Contract Postcondition\n\nAs you can see from the previous code listing,\
    \ I have expanded our method slightly. I have added the postcondition that tells\
    \ the calling code that the return value of this method will be of type Warehouse\
    \ and that it will not be null. The calling code therefore does not need to check\
    \ if"
  merge: -1
  img_proc: true
- pgno: 20
  md: "the object being returned to it is valid or not. The contract specifies that\
    \ it will return a **Warehouse** object to it.\n\n```\nContract.Ensures(Contract.Result<Warehouse>()\
    \ != null);\n```\n\n*Code Listing 5: The Code Contract Ensures a Result*\n\nIn\
    \ the real-world example, this basically means that the created stock item will\
    \ be issued to a specific warehouse based on a certain condition (the product\
    \ code). The product code identifies the product as a fast mover, raw material,\
    \ finished good, etc., and has to be issued to the correct warehouse upon creation.\
    \ Our **AddSerializedItem** method under contract tells the calling code that\
    \ it ensures the result of this warehouse issue will be stored in the **Warehouse**\
    \ object. If anything goes wrong, the product code will be issued to a default\
    \ warehouse. Users of the ERP system can inspect items stored in the default warehouse\
    \ and manually issue the product codes to the correct warehouse at a later stage.\n\
    \n![](img/0a07386735fd4e6427d20aa9bc165f5d_20_0.png)\n\n*Figure 12: Code Contract\
    \ Postcondition Result*\n\nI have included the **CreateItem()** method's code\
    \ in the following code listing. While this code sample is shown merely to explain\
    \ a concept, the logic is sound. The **switch** statement will have a fixed set\
    \ of cases it examines, as shown in Code Listing 5. It would not, however, have\
    \ hard-coded values for the **Warehouse** object it returns. These would be read\
    \ from a database or other object as the code interacts with the ERP to create\
    \ the product code entry and issue it to a warehouse. What the code logic does\
    \ ensure is that the method will always return a **Warehouse** object, and that\
    \ object will always be a valid warehouse in the system.\n\n```\nprivate static\
    \ Warehouse CreateItem()\n{\n    // Add Stocked Item code goes here\n    Warehouse\
    \ IssuedToWarehouse = new Warehouse();\n    switch (ProductCode.Substring(0,1))\n\
    \    {\n        case \"A\":\n            IssuedToWarehouse.Code = \"FM\";\n  \
    \  }\n```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "```\n```csharp\nIssuedToWarehouse.Name = \"Fast movers\";\nIssuedToWarehouse.Bin\
    \ = \"A\";\nIssuedToWarehouse.BinReorderLevel = 10000;\nIssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-01\");\nbreak;\ncase \"B\":\n    IssuedToWarehouse.Code\
    \ = \"FG\";\n    IssuedToWarehouse.Name = \"Finished Goods\";\n    IssuedToWarehouse.Bin\
    \ = \"B\";\n    IssuedToWarehouse.BinReorderLevel = 500;\n    IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-04\");\n    break;\ncase \"C\":\n    IssuedToWarehouse.Code\
    \ = \"RM\";\n    IssuedToWarehouse.Name = \"Raw Materials\";\n    IssuedToWarehouse.Bin\
    \ = \"AD\";\n    IssuedToWarehouse.BinReorderLevel = 7500;\n    IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-02\");\n    break;\ndefault:\n    IssuedToWarehouse.Code\
    \ = \"GS\";\n    IssuedToWarehouse.Name = \"General Stock\";\n    IssuedToWarehouse.Bin\
    \ = \"SS\";\n    IssuedToWarehouse.BinReorderLevel = 5000;\n    IssuedToWarehouse.LastStockTake\
    \ = Convert.ToDateTime(\"2015-09-09\");\n    break;\n}\nreturn IssuedToWarehouse;\n\
    }\n```\n```\n\n*Code Listing 6: Warehouse Issue Logic*\n\nYou can see how postconditions\
    \ can be used in Code Contracts to create highly robust code. Think of a developer\
    \ working in a distributed team. Being able to work from anywhere in the world\
    \ has many advantages and disadvantages (depending on your point of view). The\
    \ absence of personal, one-to-one communication can be construed as a distinct\
    \ disadvantage. Not being able to sit in a boardroom where developers can flesh\
    \ out a problem together remains a challenge. Your brain can subconsciously infer\
    \ feelings, meanings, and viewpoints based on the multitude of other signals (such\
    \ as body language, eye movement, or breathing) that we tend to give out.\n\n\
    Communication is more than just the act of speaking. Therefore, as developers,\
    \ we need to become sharper and heighten our effectiveness in other areas. A great\
    \ place to start is at the code. With Code Contracts, we are able to defensively\
    \ preempt certain conditions that may occur. Just because the specification doesn’t\
    \ explicitly mention that a null condition would break the integration, that doesn’t\
    \ mean we don’t need to defend against it."
