    \ Contract Checking*\n\nOnce this is done, you should be able to have the Code\
    \ Contract perform the required action and validate the condition you specified.\n\
    \nWith that out of the way, let’s modify our **CompleteBinPreparation** method.\
    \ The business rules require that before a bin can be processed, the quantity\
    \ needs to be greater than 5. Let's build this contract by requiring that the\
    \ **binQuantities** array never be null. As explained previously, this is easily\
    \ done by adding the **Contract.Requires** method.\n\nNext, we need to add **Contract.Assert**\
    \ to include the **Contract.ForAll** method. This will then use a lambda expression\
    \ to check that all the quantities are greater than 5. The implementation is shown\
    \ in the following code listing.\n\n```\n```csharp\npublic void CompleteBinPreparation(int[]\
    \ binQuantities)\n{\n    Contract.Requires(binQuantities != null);\n    Contract.Assert(Contract.ForAll(binQuantities,\
    \ x => x > 5),\n        \"Some Bins contain invalid quantities\");\n\n    // Process\
    \ bin quantities\n    BinCount = binQuantities.Length;\n}\n```\n```\n\n*Code Listing\
    \ 12: Contract.ForAll Example*"
