  md: 'Using Code Contracts and Code Contracts Editor Extensions allows us to write
    more robust code and fine-tune our code to easily conform to the required business
    rules.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_87_0.png)


    Tip: You need to keep in mind that the Random class isn''t a true random number
    generator. When you call Next(), for example, the Random class uses some internal
    state to return a number that appears to be random. It then changes its internal
    state so that the next time you call Next(), it returns another apparently random
    number. Generating true random numbers is beyond the scope of this book; if you
    require true randomness, you will need to do a bit more research.'
