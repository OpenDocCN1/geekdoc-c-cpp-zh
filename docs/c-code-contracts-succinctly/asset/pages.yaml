- pgno: 47
  md: "You then need to ensure that you have added good comments to your code. It's\
    \ a habit you need to get into as soon as you create a new method or line of code\
    \ where the logic isn't obvious. On the flip side, having too many comments in\
    \ your code is also not a good idea. So when should you comment, and when should\
    \ you not? A good rule of thumb is to only comment code when the logic behind\
    \ the code isn't obvious.\n\nIn the following code listings, the logic is obvious\
    \ in the first one (Code Listing 43), so commenting is not actually needed. In\
    \ Code Listing 44, however, the use of the modulus operator should be explained\
    \ in a comment because the reason for doing this isn't obvious.\n\n```\n```csharp\n\
    //Bad comment: Calculate the available quantity\nint QtyAvailable = MaxBinQuantity\
    \ - CurrentBinQuantity;\n```\n```\n\n*Code Listing 43: Unnecessary Code Comment*\n\
    \n```\n```csharp\n//Good comment: Use modulus to determine if the factor produces\
    \ any scrap\nreturn volumeToCut % factor;\n```\n```\n\n*Code Listing 44: Comment\
    \ Clearly Explains Logic*\n\nA well-commented method might look as follows.\n\n\
    ```\n```csharp\n/// <summary>\n/// Calculate any remainder after the modulus operation\
    \ between volume\nand factor\n/// </summary>\n/// <param name=\"volumeToCut\"\
    ></param>\n/// <param name=\"factor\"></param>\n/// <returns>Remainder after cutting</returns>\n\
    private int CutSteel(int volumeToCut, int factor)\n{\n    // Use modulus to determine\
    \ if the factor produces any scrap\n    return volumeToCut % factor;\n}\n```\n\
    ```\n\n*Code Listing 45: Well-Commented Method*\n\nAfter adding relevant comments,\
    \ you need to build your solution. You need to be aware of any warnings you might\
    \ receive during your build when the documentation file is being generated. These\
    \ will usually be related to missing XML comments in your source code. It's a\
    \ good idea to go ahead and fix these by adding clear and relevant code comments\
    \ to your methods and properties.\n\nAfter the build has completed, your XML document\
    \ will be found in the path you specified when you configured your build settings.\
    \ In this example, the XML document generated includes the Code Contract descriptions."
  merge: -1
  img_proc: true
