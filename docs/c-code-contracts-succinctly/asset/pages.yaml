    # ## Abstract classes and interfaces


    Creating Code Contracts for abstract classes and interfaces needs to be approached
    slightly differently, as you might expect. This is because abstract classes and
    interfaces cannot contain method bodies. Many developers still wonder what the
    difference is between abstract classes and interfaces. One of the best explanations
    I have heard to distinguish when to use an abstract class and when to use an interface
    is the following.


    # ### Abstract Class


    If you have many classes that can be grouped together and described by a single
    noun, you are most likely dealing with an abstract class. The abstract class is
    then named as this noun. Another very important thing to take into consideration
    is that these inherited classes share some sort of functionality, and that you
    would never create an instance of the noun (abstract class).'
  merge: -1
  img_proc: true
- pgno: 55
  md: "Think about the following example, where you have an abstract class of type\
    \ Human. You will never instantiate just a Human, but rather a kind of Human,\
    \ such as a Female or Male. Therefore, Male and Female both inherit from the abstract\
    \ class Human. The abstract class will then implement a method void Sleep(), which\
    \ all humans must do (shared functionality).\n\nTo implement Code Contracts on\
    \ abstract classes, you need to create a separate ContractClass class and associate\
    \ the contract class with the abstract class via the use of attributes.\n\n```\n\
    using System.Diagnostics.Contracts;\n\n/// <summary>\n/// Human Abstract Class\n\
    /// </summary>\n[ContractClass(typeof(HumanContract))]\npublic abstract class\
    \ Human\n{\n    public abstract void Run(int distance);\n    public abstract void\
    \ Sleep(int hours);\n}\n\n/// <summary>\n/// Human Contract Class\n/// </summary>\n\
    [ContractClassFor(typeof(Human))]\npublic abstract class HumanContract : Human\n\
    {\n    public override void Sleep(int hours)\n    {\n        Contract.Requires(hours\
    \ >= 8,\n            \"You need more than 8 hours of sleep each night.\");\n \
    \   }\n}\n```\n\nCode Listing 49: Abstract Class and Contract Class\n\nThe abstract\
    \ class Human uses the attribute [ContractClass(typeof(HumanContract))] and the\
    \ contract class HumanContract uses the attribute [ContractClassFor(typeof(Human))].\n\
    \nThe abstract class Human basically specifies that all humans will sleep and\
