  md: "The preceding example shows how developers can bullet-proof code against certain\
    \ issues that logically could adversely affect the integration.\n\n# The Code\
    \ Contract invariant\n\nCode Contracts allow for the verification of a class’\
    \ internal state. It does this via the use of Code Contract invariants. As the\
    \ name suggests, an invariant is something that can never change. It will always\
    \ be as it is specified in the class under contract.\n\nWe now know that our **AddSerializedItem**\
    \ method must be supplied with a valid serial number. Valid serial numbers fall\
    \ within a specific range.\n\n```\n```csharp\nContract.Requires<SerialNumberException>\n\
    \    (serialNumber >= 10000001, \"Invalid Serial number\");\n```\n```\n\n*Code\
    \ Listing 7: Contract Requires Condition*\n\nWe also know that the method under\
    \ contract guarantees the calling code that a non-null **Warehouse** object will\
    \ be returned when the valid serial number precondition is met.\n\n```\n```csharp\n\
    Contract.Ensures(Contract.Result<Warehouse>() != null);\n```\n```\n\n*Code Listing\
    \ 8: Contract Ensures Condition*\n\nLet us now assume that additional logic has\
    \ to be added that needs to check the validity of the production date. This date\
    \ can be in the future as well, so this needs to be supplied by an external data\
    \ store, user entry, or lookup.\n\nThis is quite easy, and accomplished by adding\
    \ a new private method to the class that has the **[ContractInvariantMethod]**\
    \ attribute applied to it. If we had to add this check on the **Warehouse** class,\
    \ we would need to add the following code to it.\n\n```\n```csharp\n[ContractInvariantMethod]\n\
    private void Invariants()\n{\n    Contract.Invariant(this.ProductionYear >= 0);\n\
    \    Contract.Invariant(this.ProductionMonth >= 0);\n    Contract.Invariant(this.ProductionMonth\
    \ <= 12);\n    Contract.Invariant(this.ProductionDay >= 0);\n    Contract.Invariant(this.ProductionDay\
    \ <= 30);\n}\n```\n```\n\n*Code Listing 9: Contract Invariant Method*\n\nThis\
    \ tells the Code Contracts that the following properties for the production date\
    \ have to fall within the following ranges. None of them can be zero, the number\
    \ of months can’t be greater"
  merge: -1
