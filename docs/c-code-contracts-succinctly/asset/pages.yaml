  md: "```\n```csharp\nprivate int CalculateNewCutFactor(int binVol, int factor)\n\
    {\n    Random r = new Random();\n    return r.Next(2, binVol + 1);\n}\n```\n```\n\
    \n```\n```\nint Random.Next(int minValue, int maxValue) (+ 2 overloads)\n\nContracts:\n\
    \    requires minValue <= maxValue\n    ensures result >= minValue\n    ensures\
    \ result < maxValue || maxValue == minValue && result == minValue\n```\n```\n\n\
    Figure 62: Random Next Method Contracts\n\nWe can see that one of the Code Contracts\
    \ implemented by the Next() method is that the minValue must be less than or equal\
    \ to the maxValue. For our requirements, I want to ensure that the minValue is\
    \ always greater than or equal to 2. Using the information we were able to glean\
    \ regarding the Code Contracts implemented by the Next() method, we can now go\
    \ ahead and create our own GetRandom() method that will conform to our Code Contract\
    \ requirements.\n\n```\n```csharp\n/// <summary>\n/// Calculate a new cutting\
    \ factor\n/// r.Next(1, 7); returns a random number between 1 and 6\n/// </summary>\n\
    /// <param name=\"binVol\">Upper range value of random (bin volume +\n1)</param>\n\
    /// <returns>\n/// A new cutting factor greater than 1 and equal to the bin volume\n\
    /// </returns>\nprivate int CalculateNewCutFactor(int binVol)\n{\n    return GetRandom(2,\
    \ binVol + 1);\n}\n\n/// <summary>\n/// Get a random number\n/// </summary>\n\
    /// <param name=\"minValue\">Value not less than 2</param>\n/// <param name=\"\
    maxValue\">Upper range value of the random number to\ngenerate</param>\n/// <returns>A\
    \ random integer</returns>\nstatic int GetRandom(int minValue, int maxValue)\n\
    {\n    Contract.Requires(minValue >= 2,\n        \"minValue cannot be less than\
    \ 2\");\n    Random r = new Random();\n    return r.Next(minValue, maxValue);\n\
    }\n```\n```\n\nCode Listing 69: Custom GetRandom() Method"
