- pgno: 83
  md: '# # Chapter 5  Code Contracts Editor Extensions


    # ## Making Code Contracts more useful


    So far we have seen a lot of what Code Contracts can do. Here’s a tip on how to
    make the contracts you create more useful to developers using your classes and
    methods. Using Code Contracts Editor Extensions will allow you to see what the
    method you’re calling into requires with regard to the contracts defined in that
    method. It will do this without requiring you to drill down into the method and
    see what Code Contracts it implements.


    ```

    ProductionVolumePerBin(binVol, factor);

    ```


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_83_0.png)


    *Figure 57: ProductionVolumePerBin Quick Info*


    The method we used in Chapter 4 displays the comments you provided in the XML
    comments for that method in the Quick Info window when the pointer hovers over
    the method. This is expected behavior, but I have no idea from that Quick Info
    window what contracts the method implements. Code Contracts Editor Extensions
    changes this. To install it, go to the Tools menu in Visual Studio and click Extensions
    and Updates.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_83_1.png)


    *Figure 58: Extensions and Updates*'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'From the **Extensions and Updates** window, select the **Online** tab and search
    for **Code Contracts Editor Extensions**. The results returned should be fairly
    limited. From here, click **Download** to download and install the extension.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_84_0.png)


    Figure 59: Install Code Contracts Editor Extensions


    Once Code Contracts Editor Extensions have been installed, you will need to restart
    Visual Studio. The beauty of this extension is that you now get a peek inside
    the methods you create, which will display the contracts for that method.


    Before this will work though, you need to ensure that the **Contract Reference
    Assembly** is set to **Build** in the Code Contracts settings.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_84_1.png)


    Figure 60: Contract Reference Assembly'
