- pgno: 23
  md: "than **12**, and the days can have a maximum value of **30** (assume we’re\
    \ working with 30-day months).\n\nUsually, you can call the contract invariant\
    \ method anything you like, but many prefer to call it **ObjectInvariant**. Another\
    \ point to note regarding the preceding code listing is that the method must have\
    \ a void return type and be scoped as **private** or **protected**.\n\nCode Contract\
    \ invariant methods allow us to specify the state of a class that is not allowed\
    \ to change. The code is short and easy to understand and implement.\n\n# Other\
    \ Code Contract methods\n\nCode Contracts also contain various other methods for\
    \ use in your code. Let us have a look at these examples in the following sections.\n\
    \n# Contract Assert and Assume\n\nSome of you might be wondering what the difference\
    \ is between **Debug.Assert** and **Contract.Assert** when used in your code.\
    \ **Debug.Assert** is only executed when your code is compiled in **Debug** mode.\
    \ The **Contract.Assert** method, however, is executed when you debug your code\
    \ in **Debug** or **Release** mode.\n\nThe **Assert** method in Code Contracts\
    \ can also easily be confused with the **Contract.Requires** method. As we saw\
    \ in previous code listings, the **Requires** method is a precondition and must\
    \ always be called at the start of a specific method. This is because **Contract.Requires**\
    \ contains information regarding the method it resides in. **Contract.Assert**\
    \ and **Contract.Assume**, on the other hand, are specific to a certain bit of\
    \ code at some point in time within the method under contract.\n\nSo when do we\
    \ use which method? With **Assert**, the static checker runs and will try to prove\
    \ the assertion at that specific line of code. **Assume** will let the static\
    \ checker simply assume that whatever the check is it needs to prove, is true.\
    \ So why have both? Consider the next code listing.\n\n```\n```csharp\npublic\
    \ void CompleteBinPreparation(int quantityRequired)\n{\n    QuantityRequired =\
    \ quantityRequired;\n    int available = BinQtyAvailable();\n    Contract.Assert(QuantityRequired\
    \ <= available, \"Quantity required exceeds available bin quantity\");\n}\n\n\
    public int BinQtyAvailable()\n{\n    MaxBinQuantity = 75;\n    CurrentBinQuantity\
    \ = 50;\n}\n```\n```"
