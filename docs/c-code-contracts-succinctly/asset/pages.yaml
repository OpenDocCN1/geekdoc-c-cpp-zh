- pgno: 80
  md: '# # IntelliTest warnings


    A discussion of IntelliTest would not be complete without discussing the Warnings
    output screen.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_80_0.png)


    *Figure 55: IntelliTest Warnings*


    You will notice that the **IntelliTest Exploration Results** screen generated
    six warnings. These are mostly normal warnings that might require your attention.
    To be on the safe side, review these for any obvious issues. While this is somewhat
    beyond the scope of this book, I will briefly mention two warning types seen in
    **Testability** and **Boundary**.


    # ## Testability


    The warning we see is that an uninstrumented method was detected in our code.
    This is specific to the `Random()` method used in the `CalculateNewCutFactor()`
    method. This simply means that IntelliTest cannot dig down into all the paths
    in my code in order to generate the required outputs it needs in order to test.


    # ## Boundary


    IntelliTest imposes certain limits on paths it executes in order to prevent it
    from getting stuck in the event that the application goes into an infinite loop.
    These limits can be modified by clicking the **Fix** icon on the menu bar.'
  merge: -1
  img_proc: true
