    *Code Listing 63: Generated Code in Details*


    Looking at the **Details** node, we can see the generated code for the unit test.


    # Test 1: Failed, DivideByZeroException


    Looking at Test 1, we can see that it failed because it tried to divide by zero.


    IntelliTest Exploration Results - stopped


    ERPWarehouseIntegrationTest.Pro — 1 Warnings — 10/15 blocks, 1/1 asserts, 4 runs


    | # | target | binVolume | factor | result(target) | result | Summary / Exception
    | Error Message |

    |---|---|---|---|---|---|---|---|

    | 1 | new ERPWa... | 0 | 0 |  |  | DivideByZeroException | Attempted to divide
    by zero. |

    | 2 | new ERPWa... | 0 | 1 | new ERPWar... | 0 | ContractException | Postcondition
    failed: Contract.Result<int>() ... |

    | 3 | new ERPWa... | 1 | 386 |  |  | ContractException | Arithmetic operation
    resulted in an overflow. |

    | 4 | new ERPWa... | int.MinValue | -1 |  |  | OverflowException | Arithmetic
    operation resulted in an overflow. |


    *Figure 51: Divide by Zero Exception*


    This means that we forgot to take care of a factor value of zero. If you look
    at the **CutSteel()** method you will see that we are dealing with a modulus and
    not a divisor. So how can we have a divide by zero exception? Well the rule of
    thumb is that if the second operand of a / or a % is zero, we will have a divide
    by zero exception.


    # Test 3: Failed, ContractException


    Test 3 failed because the Code Contract ensures a result that the method isn''t
    adhering to. Remember, the **ProductionVolumePerBin()** method ensures that the
    bin volume is returned to the calling code, which signifies that we have produced
    a perfect cut with zero scrap. The test failed, and in a production environment
    this situation will happen. Our Code Contract ensures that the result returned
    by the method will always equal the bin volume. This means that we need to deal
    with the eventuality of an imperfect cut.


    # Test 4: Failed, OverflowException


    The last failed test is rather interesting. We can see that the test was passed
    **int.MinValue** for **binVolume**. According to the MSDN documentation, **int.MinValue**
    represents the smallest possible value for **Int32**. It is also a constant with
    a value of **-2,147,483,648**. The factor has a value of **-1** and the modulus
    results in an **OverflowException**. This means that our code in the **CutSteel()**
    method will effectively be **int.MinValue % -1**; and this fails our test.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "The reason that this happens is because the C# language specification implements\
    \ it as such. In **7.8.3 Remainder operator** of the **C# Language Specification**\
    \ it states: \"If the left operand is the smallest int or long value and the right\
    \ operand is -1, a System.OverflowException is thrown.\"\n\n> **Note:** If you\
    \ would like to dig a little deeper, you can view this thread on StackOverflow\
    \ for a very good explanation on why this is implemented this way in C#.\n\n#\
    \ ## Fixing test failures\n\nWe can see from the previous IntelliTests that there\
    \ are some loopholes in our **ProductionVolumePerBin()** method. These need fixing,\
    \ and the most obvious one to fix is the divide by zero exception. Let's add a\
    \ **Contract.Requires()** to our method to only allow factor values greater than\
    \ 1.\n\n```\n```csharp\n/// <summary>\n/// Calculate the production volume of\
