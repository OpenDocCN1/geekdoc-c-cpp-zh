  md: "```\npublic void EnsureAllBinsFilled(out int binOverCount, int binVol, int\
    \ steelVol)\n{\n    Contract.Ensures(Contract.ValueAtReturn<int>(out binOverCount)\
    \ == 0,\n        \"The steel volume exceeds the bin volume\");\n\n    binOverCount\
    \ = steelVol % binVol;\n}\n```\n\n# Code Listing 24: Contract.ValueAtReturn\n\n\
    Our method under contract needs to specify that the out parameter binOverCount\
