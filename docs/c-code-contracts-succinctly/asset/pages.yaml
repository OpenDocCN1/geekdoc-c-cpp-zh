- pgno: 9
  md: '![](img/0a07386735fd4e6427d20aa9bc165f5d_9_0.png)


    # ## NuGet


    The NuGet package manager can also be used to download and include Code Contracts
    in your solution. You can use the NuGet Package Manager (Figure 3) to search for
    Code Contracts, or you can use the Package Manager Console from the Tools > NuGet
    Package Manager option to run the following command to install Code Contracts.


    ```

    ```powershell

    PM> Install-Package CodeContracts

    ```

    ```


    You will also find a portable version (for use with Windows Mobile applications)
    of the Code Contracts package on NuGet. It doesn’t really matter which method
    you use to install Code Contracts; it’s just a matter which method you prefer.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/0a07386735fd4e6427d20aa9bc165f5d_10_0.png)


    *Figure 3: NuGet Package Manager*


    # Visual Studio integration


    You will need to restart Visual Studio for the Code Contracts item in the Properties
    page to become visible. The Code Contracts integration can be found by right-clicking
    on your project and selecting **Properties** from the context menu. You can also
    find the Code Contracts integration by selecting **Project** from the Visual Studio
    toolbar (be sure that you have selected your project in the Solution Explorer),
    and clicking the *ProjectName Properties* menu item (Figure 4).


    I have called my Visual Studio project **CodeContractsDemo**, so the item in the
    **Projects** menu in Visual Studio will be called **CodeContractsDemo Properties**.
    The familiar Property page opens for your project, and at the bottom of the list
    on the left of the Property page you will see a new property pane called **Code
    Contracts**.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Clicking on this will display a smorgasbord of settings for you to select.
    Don''t let the number of settings intimidate you; we will go through these in
    the next section. Only know that many of the settings are defaulted, and you can
    leave them that way should you wish to.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_11_0.png)


    *Figure 4: Project Properties*


    # Code Contracts property page


    The Code Contracts properties will expose many options and settings to you initially.
    The properties under Code Contracts are separated into three groups: Runtime Checking,
    Static Checking, and Contract Reference Assembly.


    Enable Code Contracts by selecting either **Perform Runtime Contract Checking**
    or **Perform Static Contract Checking**.


    At minimum, you need to ensure that one of these options is selected in order
    to enable Code Contracts in your project. Without selecting either of these options,
    Code Contracts will not be enabled in your project, and you will not be able to
    benefit from the value they add to your system.


    Runtime Contract Checking, as the name suggests, will work its magic during run-time.
    Static Contract Checking, however, is a different animal altogether. It lets Code
    Contracts analyze'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'your code while you’re typing code or building your project. This is where
    Code Contracts become interesting and add the most value for me.


    ![](img/0a07386735fd4e6427d20aa9bc165f5d_12_0.png)


    *Figure 5: Code Contracts Property Page*


    # Static checking


    If you enable static checking, it is advisable to keep the **Check in background**
    option selected in the Properties page. This is because analysis can take some
    time to perform. Another advisable option is to select the parallel build option
    in Visual Studio. From the **Tools** menu in Visual Studio, select **Options**.
    In the tree-view on the left of the Options screen (Figure 6), expand the **Projects
    and Solutions** node. You will notice a node called **Build and Run**. Select
    that, and you will see the option to enable parallel builds.


    Any value greater than **1** will enable the parallel builds option in Visual
    Studio. The default value on my machine is **8**. Entering the value **1** in
    this text box will effectively switch off parallel builds in Visual Studio. By
    enabling parallel builds in Visual Studio, you enable Code Contracts to'
  merge: -1
  img_proc: true
