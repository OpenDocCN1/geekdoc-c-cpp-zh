- pgno: 45
  md: "You will see that the parameter is replaced by a placeholder and the properties\
    \ of that placeholder are defined in the Replacements grid. All that is left to\
    \ do is give the shortcut a name (I called mine **ccre** for “Code Contract Requires\
    \ Ensures”) and save your code snippet.\n\nIn the code editor of Visual Studio,\
    \ type the **ccre** shortcut and press the Tab key twice. My code snippet is inserted\
    \ for me with the parameter identified as a replacement highlighted so that I\
    \ can edit it immediately.\n\n```\n```csharp\n@references\npublic int MethodToRun(int\
    \ parameter)\n{\n    Contract.Requires(param > 0, \"\");\n    Contract.Ensures(Contract.Result<int>()\
    \ >= 0, \"\");\n\n    return parameter;\n}\n```\n```\n\n*Figure 33: Code Snippet\
    \ Inserted*\n\nThis is an extremely easy tool to use, and I have not even begun\
    \ to explore the possibilities it provides developers. My focus here is simply\
    \ to illustrate that code snippets can be extremely useful to developers and can\
    \ be extended to suit your specific needs during development.\n\n# Code Contract\
    \ documentation generation\n\nOne thing that I am sure most (if not all) developers\
    \ dislike is creating documentation. It has become somewhat of the elephant in\
    \ the room in many project meetings. Everybody knows that documentation is essential,\
    \ and I am sure that there are a lot of developers out there that do create concise\
    \ and rich documentation. This has obviously led to many tools and extensions\
    \ that aim to make this process easier.\n\nIt therefore makes sense that Code\
    \ Contracts can also integrate documentation of the included contracts. To enable\
    \ the documentation generation, you need to open the **Build** tab of your project\
    \ properties."
