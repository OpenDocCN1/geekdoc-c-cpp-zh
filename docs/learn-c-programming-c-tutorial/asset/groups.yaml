    \ between.\n\nFor the **for** loop, **continue** statement causes the conditional\
    \ test and increment portions of the loop to execute. For the **while** and **do...while**\
    \ loops, **continue** statement causes the program control to pass to the conditional\
    \ tests.\n\n## Syntax\n\nThe syntax for a **continue** statement in C is as follows:\n\
    \n```c\ncontinue;\n```\n\n## Flow Diagram\n\n![C Programming](img/6e49c39a6ef9e32d938b03dc613e44f6_79_0.png)\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local variable definition\
    \ */\n    int a = 10;\n\n    /* do loop execution */\n    do\n    {\n        if(\
