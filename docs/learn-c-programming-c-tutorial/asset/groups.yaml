    \ a file, use the fclose() function. The prototype of this function is:\n\n```c\n\
    int fclose( FILE *fp );\n```\n\nThe **fclose()** function returns zero on success,\
    \ or **EOF** if there is an error in closing the file. This function actually\
    \ flushes any data still pending in the buffer to the file, closes the file, and\
    \ releases any memory used for the file. The EOF is a constant defined in the\
