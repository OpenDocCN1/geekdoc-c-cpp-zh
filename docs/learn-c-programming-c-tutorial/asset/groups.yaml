  mdcn: "\n### Preprocessor Operators\n\nC 预处理器提供以下运算符来帮助创建宏：\n\n#### 宏延续（\\）运算符\n\
    \n宏通常局限于单行。宏延续运算符（\\）用于延长过长的单行宏。例如：\n\n```c\n#define  message_for(a, b)  \\\n\
    \    printf(#a \" and \" #b \": We love you!\\n\")\n```\n\n#### 字符串化（#）运算符\n\n\
    在宏定义中，字符串化或井号（#）运算符将宏参数转换为字符串常量。该运算符仅可在指定参数列表的宏中使用。例如：\n\n```c\n#include <stdio.h>\n\
    \n#define  message_for(a, b)  \\\n    printf(#a \" and \" #b \": We love you!\\\
    n\")\n\nint main(void)\n{\n    message_for(Carole, Debra);\n    return 0;\n}\n\
    ```\n\n编译并执行上述代码后，输出为：\n\n```text\nCarole and Debra: We love you!\n```\n\n####\
    \ 令牌粘接（##）运算符\n\n在宏定义中，令牌粘接运算符（##）将两个参数组合。它允许宏定义中的两个独立令牌在宏展开时合并为一个令牌。例如：\n\n```c\n\
    #include <stdio.h>\n\n#define tokenpaster(n) printf (\"token\" #n \" = %d\", token##n)\n\
    \nint main(void)\n{\n    int token34 = 40;\n\n    tokenpaster(34);\n    return\
    \ 0;\n}\n```\n\n编译并执行后，输出为：\n\n```text\ntoken34 = 40\n```\n\n这是因为预处理器的实际输出如下：\n\
    \n```c\nprintf (\"token34 = %d\", token34);\n```\n\n本例展示了将 `token##n` 连接为 `token34`，同时使用了\
    \ **字符串化** 和 **令牌粘接**。\n\n#### 定义（defined）运算符\n\n`defined` 运算符用于在常量表达式中判断标识符是否已通过\
    \ `#define` 定义。若标识符已定义，结果为真（非零）；否则为假（零）。用法如下：\n\n```c\n#include <stdio.h>\n\n\
    #if !defined (MESSAGE)\n    #define MESSAGE \"You wish!\"\n#endif\n\nint main(void)\n\
    {\n    printf(\"Here is the message: %s\\n\", MESSAGE);\n    return 0;\n}\n```\n\
    \n编译并执行后，输出为：\n\n```text\nHere is the message: You wish!\n```\n\n#### 参数化宏\n\n\
    CPP 的强大之处在于可以通过参数化宏模拟函数。例如，用宏实现对数的平方：\n\n```c\nint square(int x) {\n\n    return\
    \ x * x;\n\n}\n```\n\n可以改写为：\n\n```c\n#define square(x) ((x) * (x))\n```\n\n宏参数必须在使用前通过\
    \ `#define` 定义。参数列表放在宏名后的括号内，宏名与左括号之间**不能有空格**。例如：\n\n```c\n#include <stdio.h>\n\
    \n#define MAX(x,y) ((x) > (y) ? (x) : (y))\n\nint main(void)\n{\n    printf(\"\
    Max between 20 and 10 is %d\\n\", MAX(10, 20));\n    return 0;\n}\n```\n\n运行后输出：\n\
    \n```text\nMax between 20 and 10 is 20\n```\n\n头文件是带有 **.h** 扩展名的文件，包含 C 函数声明和宏定义，用于多个源文件共享。分为两类：程序员编写的头文件和编译器自带的头文件。\n\
    \n使用头文件的方式是通过预处理器指令 **#include** 包含，如包含 **stdio.h** 所示。包含头文件等同于复制其内容，但这样做容易出错且不佳，尤其是在多个源文件的项目中。\n\
    \nC/C++ 程序的常见做法是将常量、宏、全局变量和函数原型放在头文件中，并在需要的地方 `#include` 该头文件。\n\n#### Include\
    \ 语法\n\n用户和系统头文件均通过 **#include** 指令包含，有两种形式：\n\n```c\n#include <file>\n```\n\n\
    用于系统头文件，编译器在标准目录中查找 `file`。可使用 `-I` 选项预定义查找路径。\n\n```c\n#include \"file\"\n```\n\
    \n用于用户自定义头文件，编译器在当前文件所在目录查找 `file`。同样可通过 `-I` 选项预定义路径。\n\n#### Include 操作\n\n\
    `#include` 指令使预处理器在继续处理当前源文件前，先读取指定文件的内容。预处理器输出包含原文件已生成的内容、被包含文件的内容以及 `#include`\
    \ 之后的文本。\n\n例如，若 `header.h` 为：\n\n```c\nchar *test (void);\n```\n\n而 `program.c`\
    \ 包含：\n\n```c\nint x;\n\n#include \"header.h\"\n\nint main (void)\n{\n    puts\
    \ (test ());\n}\n```\n\n编译器实际看到的等价于：\n\n```c\nint x;\nchar *test (void);\n\nint\
    \ main (void)\n{\n    puts (test ());\n}\n```\n\n#### Once-Only Headers（防重复包含）\n\
    \n若头文件被多次包含，会导致重复编译错误。标准做法是使用 **#ifndef** 保护器：\n\n```c\n#ifndef HEADER_FILE\n\
    #define HEADER_FILE\n\nthe entire header file\n\n#endif\n```\n\n这种结构常被称为 **#ifndef\
    \ 包装**。第二次包含时，`HEADER_FILE` 已定义，条件为假，预处理器跳过文件内容，避免重复。\n\n#### Computed Includes（计算包含）\n\
    \n有时需根据条件选择不同头文件，例如为不同操作系统选择相应的配置头文件。使用条件编译时会写成：\n\n```c\n#if SYSTEM_1\n\n   \
    \ # include \"system_1.h\"\n\n#elif SYSTEM_2\n\n    # include \"system_2.h\"\n\
    \n#elif SYSTEM_3\n\n    ...\n\n#endif\n```\n\n但条件过多会显得繁琐。预处理器提供 **计算包含** 功能，使用宏作为\
    \ `#include` 的参数：\n\n```c\n#define SYSTEM_H \"system_1.h\"\n\n...\n\n#include\
    \ SYSTEM_H\n```\n\n在编译时，`SYSTEM_H` 会被展开为 `\"system_1.h\"`，预处理器按此路径查找文件。该宏可在 Makefile\
    \ 中通过 `-D` 选项定义。\n\n### 25. TYPE CASTING\n\n类型强制转换（type casting）用于将变量从一种数据类型转换为另一种类型。例如，将\
    \ `long` 值存入 `int` 变量时，可将 `long` 强制转换为 `int`。使用 **cast operator** 显式转换语法如下：\n\n\
    ```c\n(type_name) expression\n```\n\n下例展示强制转换使整数除法转为浮点运算：\n\n```c\n#include <stdio.h>\n\
    \nmain()\n{\n    int sum = 17, count = 5;\n    double mean;\n\n    mean = (double)\
    \ sum / count;\n    printf(\"Value of mean : %f\\n\", mean );\n}\n```\n\n运行后输出：\n\
    \n```text\nValue of mean : 3.400000\n```\n\n注意：cast operator 的优先级高于除法，因此 `sum`\
    \ 先转为 `double` 再参与除法运算，结果为 `double`。\n\n类型转换可由编译器自动完成（隐式），也可通过 **cast operator**\
    \ 显式指定。编程最佳实践是：在需要显式类型转换时使用 cast operator。\n\n"
