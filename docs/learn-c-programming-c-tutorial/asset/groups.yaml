  - "[PAGE 158]\n\n# # Preprocessor Operators\n\nThe C preprocessor offers the following\
    \ operators to help create macros:\n\n# ## The Macro Continuation (\\\\) Operator\n\
    \nA macro is normally confined to a single line. The macro continuation operator\
    \ (\\\\) is used to continue a macro that is too long for a single line. For example:\n\
    \n```\n```c\n#define  message_for(a, b)  \\\\\n    printf(#a \" and \" #b \":\
    \ We love you!\\\\n\")\n```\n```\n\n# ## The Stringize (#) Operator\n\nThe stringize\
    \ or number-sign operator (#), when used within a macro definition, converts a\
