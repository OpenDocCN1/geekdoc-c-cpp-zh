    \ 0;\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果：\n\n```text\nValue of var = 3000\nValue available\
    \ at *ptr = 3000\nValue available at **pptr = 3000\n```\n\n## 向函数传递指针\n\nC 语言允许将指针传递给函数。要做到这一点，只需将函数参数声明为指针类型。\n\
    \n下面是一个简单的示例，我们将一个指向 unsigned long 的指针传递给函数，并在函数内部修改该值，这个修改会反映回调用函数中：\n\n```c\n\
