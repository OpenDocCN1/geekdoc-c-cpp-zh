    \ following result:\n\n```text\nGreeting message: Hello\n```\n\nC supports a wide\
    \ range of functions that manipulate null-terminated strings:\n\n| S.N. | Function\
    \ & Purpose |\n| --- | --- |\n| 1 | `strcpy(s1, s2);` Copies string s2 into string\
    \ s1. |\n| 2 | `strcat(s1, s2);` Concatenates string s2 onto the end of string\
