  md: "\n## break Statement\n\nThe **break** statement in C programming has the following\
    \ two usages:\n\n- When a **break** statement is encountered inside a loop, the\
    \ loop is immediately terminated and the program control resumes at the next statement\
    \ following the loop.\n- It can be used to terminate a case in the **switch**\
    \ statement (covered in the next chapter).\n\nIf you are using nested loops, the\
    \ break statement will stop the execution of the innermost loop and start executing\
    \ the next line of code after the block.\n\n## Syntax\n\nThe syntax for a **break**\
    \ statement in C is as follows:\n\n```c\nbreak;\n```\n\n## Flow Diagram\n\n# C\
    \ Programming\n\n![C Programming](img/6e49c39a6ef9e32d938b03dc613e44f6_77_0.png)\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local variable definition\
    \ */\n    int a = 10;\n\n    /* while loop execution */\n    while( a < 20 )\n\
    \    {\n        printf(\"value of a: %d\\n\", a);\n        a++;\n        if( a\
    \ > 15)\n        {\n            /* terminate the loop using break statement */\n\
    \            break;\n        }\n    }\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\n\n```\nvalue of a: 10\n\nvalue\
    \ of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\nvalue of a: 14\n\nvalue of a:\
    \ 15\n```\n\n## Continue Statement\n\nThe **continue** statement in C programming\
