    ### switch Statement\n\nA **switch** statement allows a variable to be tested\
    \ for equality against a list of values. Each value is called a case, and the\
    \ variable being switched on is checked for each **switch case**.\n\n#### Syntax\n\
    \nThe syntax for a **switch** statement in C programming language is as follows:\n\
    \n```c\nswitch(expression){\n    case constant-expression :\n        statement(s);\n\
    \        break; /* optional */\n\n    case constant-expression :\n        statement(s);\n\
    \        break; /* optional */\n\n    /* you can have any number of case statements\
    \ */\n    default : /* Optional */\n        statement(s);\n}\n```\n\nThe following\
    \ rules apply to a **switch** statement:\n\n- The **expression** used in a **switch**\
    \ statement must have an integral or enumerated type, or be of a class type in\
    \ which the class has a single conversion function to an integral or enumerated\
    \ type.\n- You can have any number of case statements within a switch. Each case\
    \ is followed by the value to be compared to and a colon.\n- The **constant-expression**\
    \ for a case must be the same data type as the variable in the switch, and it\
    \ must be a constant or a literal.\n- When the variable being switched on is equal\
    \ to a case, the statements following that case will execute until a **break**\
    \ statement is reached.\n- When a **break** statement is reached, the switch terminates,\
    \ and the flow of control jumps to the next line following the switch statement.\n"
