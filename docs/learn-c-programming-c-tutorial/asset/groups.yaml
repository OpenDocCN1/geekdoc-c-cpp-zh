  mdcn: "\n## break 语句\n\n在 C 语言中，**break** 语句具有以下两种用法：\n\n- 当 **break** 语句出现在循环内部时，循环会立即终止，程序控制在循环之后的下一条语句继续执行。\n\
    - 它可以用于终止 **switch** 语句中的一个 case（在下一章节中介绍）。\n\n如果你在嵌套循环中使用 break 语句，它会停止最内层循环的执行，并开始执行\
    \ break 语句之后的下一条语句。\n\n### 语法\n\nC 语言中 **break** 语句的语法如下：\n\n```c\nbreak;\n```\n\
    \n### 流程图\n\n# C 语言\n\n![C Programming](img/6e49c39a6ef9e32d938b03dc613e44f6_77_0.png)\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* 定义局部变量 */\n    int a = 10;\n\
    \n    /* 循环执行 */\n    while( a < 20 )\n    {\n        printf(\"value of a: %d\\\
    n\", a);\n        a++;\n        if( a > 15)\n        {\n            /* 使用 break\
    \ 语句终止循环 */\n            break;\n        }\n    }\n}\n```\n\n当上述代码编译并执行后，它会产生以下输出：\n\
    \n```\nvalue of a: 10\n\nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\n\
    value of a: 14\n\nvalue of a: 15\n```\n\n## 继续语句\n\nC 语言中的 **continue** 语句的作用与\
    \ **break** 语句相似，但它并不强制终止循环，而是强制执行下一次循环的迭代，跳过循环体中剩余的代码。\n\n对于 **for** 循环，**continue**\
    \ 语句会导致循环的条件检查和增量部分执行。对于 **while** 和 **do...while** 循环，**continue** 语句会使程序控制跳转到条件表达式。\n\
    \n### 语法\n\nC 语言中 **continue** 语句的语法如下：\n\n```c\ncontinue;\n```\n\n### 流程图\n\n\
    ![C Programming](img/6e49c39a6ef9e32d938b03dc613e44f6_79_0.png)\n\n```c\n#include\
    \ <stdio.h>\n\nint main ()\n{\n    /* 定义局部变量 */\n    int a = 10;\n\n    /* do\
    \ 循环执行 */\n    do\n    {\n        if( a == 15)\n        {\n            /* 跳过本次迭代\
    \ */\n            a = a + 1;\n            continue;\n        }\n        printf(\"\
    value of a: %d\\n\", a);\n        a++;\n    } while( a < 20 );\n}\n```\n\n当上述代码编译并执行后，它会产生以下输出：\n\
    \n```\nvalue of a: 10\nvalue of a: 11\nvalue of a: 12\nvalue of a: 13\nvalue of\
    \ a: 14\nvalue of a: 16\nvalue of a: 17\nvalue of a: 18\nvalue of a: 19\n```\n\
    \n## goto 语句\n\nC 语言中的 **goto** 语句提供了一个从当前位置无条件跳转到同一函数中标记（label）的语句。\n\n**注意**：在任何编程语言中，使用\
    \ goto 语句都被强烈 discouraged，因为它会使程序的控制流难以追踪，导致程序难以理解和修改。任何使用 goto 的程序都可以重写以避免使用\
    \ goto。\n\n### 语法\n\n**goto** 语句的语法如下：\n\n```\ngoto label;\n\n..\n.\n\nlabel:\
    \ statement;\n```\n\n其中 label 可以是除 C 关键字之外的任意纯文本，并且可以在 goto 语句的上方或下方的任何位置定义。\n\
    \n![C Programming](img/6e49c39a6ef9e32d938b03dc613e44f6_80_0.png)\n\n### 示例\n\n\
    ```c\n#include <stdio.h>\n\nint main ()\n{\n    /* 定义局部变量 */\n    int a = 10;\n\
    \n    /* do 循环执行 */\n    LOOP: do\n    {\n        if( a == 15)\n        {\n  \
    \          /* 跳过本次迭代 */\n            a = a + 1;\n            goto LOOP;\n    \
    \    }\n        printf(\"value of a: %d\\n\", a);\n        a++;\n\n    }while(\
    \ a < 20 );\n}\n```\n\n```c\nreturn 0;\n}\n```\n\n当上述代码编译并执行后，它会产生以下输出：\n\n```\n\
    value of a: 10\n\nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\nvalue\
    \ of a: 14\n\nvalue of a: 16\n\nvalue of a: 17\n\nvalue of a: 18\n\nvalue of a:\
    \ 19\n```\n\n## 无限循环\n\n当循环条件永远不会为假时，循环会变成无限循环。传统上 **for** 循环用于此目的。由于构成 **for**\
    \ 循环的三个表达式（初始化、条件、增量）中，条件表达式是可选的，你可以通过留空条件表达式来创建无限循环。\n\n```c\n#include <stdio.h>\n\
    \nint main ()\n{\n    for( ; ; )\n    {\n        printf(\"This loop will run forever.\\\
    \\n\");\n    }\n\n    return 0;\n}\n```\n\n当条件表达式缺失时，它被视为真。你可以在 for 循环中使用初始化和增量表达式，但\
    \ C 语言程序员更常用 for(;;) 来表示无限循环。\n\n**注意**：可以通过按下 Ctrl + C 键来终止无限循环。\n\n## 函数参数\n\
    \n如果函数需要使用参数，它必须声明接受参数值的变量。这些变量被称为函数的**形式参数**。\n\n形式参数在函数内部行为如其他局部变量，在函数进入时创建，在函数退出时销毁。\n\
    \n在调用函数时，参数可以以两种方式传递：\n\n| 传递方式 | 描述 |\n|---|---|\n| 传值调用 | 此方法将实际参数的值复制到函数的形式参数中。因此，在函数内部对参数的修改不会影响原始参数。\
    \ |\n| 传址调用 | 此方法将参数的地址复制到形式参数中。在函数内部，通过该地址访问实际参数，这意味着对形式参数的修改会影响原始参数。 |\n\n##\
    \ 传址调用\n\n**传址调用** 方法会将参数的地址复制到形式参数。在函数内部，通过该地址访问实际参数，这意味着对形式参数的修改会影响传入的参数。\n\n\
    要通过引用传递值，需要像传递普通值一样将指针传递给函数。因此，你需要在函数声明中将参数声明为指针类型，如下面的 **swap()** 函数，它交换两个整数变量的值，这些变量是通过参数传递的。\n\
    \n```\nvoid swap(int *x, int *y)\n\n{\n\n    int temp;\n\n    temp = *x;    /*\
    \ 保存地址 x 中的值 */\n\n    *x = *y;      /* 将 y 的值赋给 x */\n\n    *y = temp;    /*\
    \ 将 temp 赋给 y */\n}\n```\n\n我们现在通过传址调用函数 swap() 来演示：\n\n```c\n#include <stdio.h>\n\
    \n/* 函数声明 */\nvoid swap(int *x, int *y);\n\nint main ()\n{\n    /* 定义局部变量 */\n\
    \    int a = 100;\n    int b = 200;\n\n    printf(\"Before swap, value of a :\
    \ %d\\n\", a );\n    printf(\"Before swap, value of b : %d\\n\", b );\n\n    /*\
