    \    char str[20];\n} data;\n```\n\n现在，**Data** 类型的变量可以存储整数、浮点数或字符串。这意味着一个单一变量（即同一内存位置）可以用来存储多种类型的数据。你可以根据需求在联合中使用任何内置的或用户自定义的数据类型。\n\
    \n联合所占用的内存大小将足以容纳联合中最大的成员。例如，在上述示例中，Data 类型将占用 20 字节的内存空间，因为这是字符字符串所能占用的最大空间。下面的示例显示了上述联合所占用的总内存大小：\n\
