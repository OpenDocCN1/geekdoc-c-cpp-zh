    }\n```\n\n# Bit Fields\n\nBit Fields allow the packing of data in a structure.\
    \ This is especially useful when memory or data storage is at a premium. Typical\
    \ examples include:\n\n- Packing several objects into a machine word, e.g. 1 bit\
    \ flags can be compacted.\n- Reading external file formats -- non-standard file\
    \ formats could be read in, e.g. 9-bit integers.\n\nC allows us to do this in\
    \ a structure definition by putting :bit length after the variable. For example:\n\
    \n```c\nstruct packed_struct {\n    unsigned int f1:1;\n    unsigned int f2:1;\n\
    \    unsigned int f3:1;\n    unsigned int f4:1;\n};\n```\n\n[PAGE 135]\n\nunsigned\
    \ int type:4;\nunsigned int my_int:9;\n} pack;\n```\n\nHere, the packed_struct\
    \ contains 6 members: Four 1 bit flags f1..f3, a 4-bit type, and a 9-bit my_int.\n\
    \nC automatically packs the above bit fields as compactly as possible, provided\
    \ that the maximum length of the field is less than or equal to the integer word\
    \ length of the computer. If this is not the case, then some compilers may allow\
    \ memory overlap for the fields, while others would store the next field in the\
    \ next word.\n\n[PAGE 136]\n\n# # 18. UNIONS\n\nA **union** is a special data\
    \ type available in C that allows to store different data types in the same memory\
    \ location. You can define a union with many members, but only one member can\
    \ contain a value at any given time. Unions provide an efficient way of using\
    \ the same memory location for multiple purpose.\n\n# ## Defining a Union\n\n\
    To define a union, you must use the **union** statement in the same way as you\
    \ did while defining a structure. The union statement defines a new data type\
    \ with more than one member for your program. The format of the union statement\
    \ is as follows:\n\n```\nunion [union tag]\n{\n    member definition;\n    member\
    \ definition;\n    ...\n    member definition;\n} [one or more union variables];\n\
    ```\n\nThe **union tag** is optional and each member definition is a normal variable\
    \ definition, such as int i; or float f; or any other valid variable definition.\
    \ At the end of the union's definition, before the final semicolon, you can specify\
    \ one or more union variables, but it is optional. Here is the way you would define\
    \ a union type named Data having three members i, f, and str:\n\n```\nunion Data\n\
    {\n    int i;\n    float f;\n    char str[20];\n} data;\n```\n\nNow, a variable\
    \ of **Data** type can store an integer, a floating-point number, or a string\
    \ of characters. It means a single variable, i.e., same memory location, can\n\
    \nbe used to store multiple types of data. You can use any built-in or user-defined\
    \ data types inside a union based on your requirement.\n\nThe memory occupied\
    \ by a union will be large enough to hold the largest member of the union. For\
    \ example, in the above example, Data type will occupy 20 bytes of memory space\
    \ because this is the maximum space which can be occupied by a character string.\
    \ The following example displays the total memory size occupied by the above union:\n\
    \n```\n#include <stdio.h>\n#include <string.h>\n\nunion Data\n{\n    int i;\n\
    \    float f;\n    char str[20];\n};\n\nint main( )\n{\n    union Data data;\n\
    \n    printf(\"Memory size occupied by data : %d\\n\", sizeof(data));\n\n    return\
    \ 0;\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result:\n\n```\nMemory size occupied by data : 20\n```\n\n# Accessing\
    \ Union Members\n\nTo access any member of a union, we use the member access operator\
    \ (.). The member access operator is coded as a period between the union variable\
    \ name and the union member that we wish to access. You would use the keyword\
    \ union to define variables of union type. The following example shows how to\
    \ use unions in a program:\n\n```\n#include <stdio.h>\n```\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_137_0.png)\n\
    \n[PAGE 138]\n\n<!-- no content -->\n\n[PAGE 139]\n\n# # C Programming\n\n```\n\
    #include <string.h>\n\nunion Data\n{\n    int i;\n    float f;\n    char str[20];\n\
