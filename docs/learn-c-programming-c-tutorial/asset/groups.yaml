    - A **switch** statement can have an optional **default** case, which must appear\
    \ at the end of the switch. The default case can be used for performing a task\
    \ when none of the cases is true. No **break** is needed in the default case.\n\
    \n## Flow Diagram\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_62_0.png)\n\n##\
    \ Example\n\n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local variable\
    \ definition */\n    char grade = 'B';\n\n    switch(grade)\n    {\n    case 'A'\
    \ :\n        printf(\"Excellent!\\n\" );\n        break;\n    case 'B' :\n   \
    \ case 'C' :\n        printf(\"Well done\\n\" );\n        break;\n    case 'D'\
    \ :\n        printf(\"You passed\\n\" );\n        break;\n    case 'F' :\n   \
    \     printf(\"Better try again\\n\" );\n        break;\n    default :\n     \
    \   printf(\"Invalid grade\\n\" );\n    }\n    printf(\"Your grade is %c\\n\"\
    , grade );\n\n    return 0;\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result:\n\n```text\nWell done\n\nYour grade is B\n\
    ```\n\n## Nested switch Statements\n\nIt is possible to have a switch as a part\
    \ of the statement sequence of an outer switch. Even if the case constants of\
    \ the inner and outer switch contain common values, no conflicts will arise.\n\
    \n## Syntax\n\nThe syntax for a **nested switch** statement is as follows:\n\n\
    ```c\nswitch(ch1) {\n    case 'A':\n        printf(\"This A is part of outer switch\"\
    );\n        switch(ch2) {\n            case 'A':\n                printf(\"This\
    \ A is part of inner switch\");\n                break;\n            case 'B':\
    \ /* case code */\n        }\n        break;\n    case 'B': /* case code */\n\
    }\n```\n\n## Example\n\n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local\
    \ variable definition */\n    int a = 100;\n    int b = 200;\n\n    switch(a)\
    \ {\n        case 100:\n            printf(\"This is part of outer switch\\n\"\
    , a );\n            switch(b) {\n                case 200:\n                 \
    \   printf(\"This is part of inner switch\\n\", a );\n            }\n    }\n \
    \   printf(\"Exact value of a is : %d\\n\", a );\n    printf(\"Exact value of\
    \ b is : %d\\n\", b );\n\n    return 0;\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_64_0.png)\n\
    \nThis is part of outer switch\nThis is part of inner switch\nExact value of a\
    \ is : 100\nExact value of b is : 200\n\n## The ? : Operator:\n\nWe have covered\
    \ **conditional operator ? :** in the previous chapter which can be used to replace\
    \ **if...else** statements. It has the following general form:\n\n```\nExp1 ?\
    \ Exp2 : Exp3;\n```\n\nWhere Exp1, Exp2, and Exp3 are expressions. Notice the\
    \ use and placement of the colon.\n\nThe value of a ? expression is determined\
    \ like this:\n\n1. Exp1 is evaluated. If it is true, then Exp2 is evaluated and\
    \ becomes the value of the entire ? expression.\n2. If Exp1 is false, then Exp3\
    \ is evaluated and its value becomes the value of the expression.\n\n## 11. LOOPS\n\
    \nYou may encounter situations when a block of code needs to be executed several\
    \ number of times. In general, statements are executed sequentially: The first\
    \ statement in a function is executed first, followed by the second, and so on.\n\
    \nProgramming languages provide various control structures that allow for more\
    \ complicated execution paths.\n\nA loop statement allows us to execute a statement\
    \ or group of statements multiple times. Given below is the general form of a\
    \ loop statement in most of the programming languages:\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_66_0.png)\n\
    \nC programming language provides the following types of loops to handle looping\
    \ requirements.\n\n| Loop Type | Description |\n|---|---|\n| while loop | Repeats\
    \ a statement or group of statements while a given condition is true. It tests\
    \ the condition before executing the loop body. |\n| for loop | Executes a sequence\
    \ of statements multiple times and abbreviates the code that manages the loop\
    \ variable. |\n\nHere, the key point to note is that a while loop might not execute\
    \ at all. When the condition is tested and the result is false, the loop body\
    \ will be skipped and the first statement after the while loop will be executed.\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local variable definition\
    \ */\n    int a = 10;\n\n    /* while loop execution */\n    while( a < 20 )\n\
    \    {\n        printf(\"value of a: %d\\n\", a);\n        a++;\n    }\n}\n```\n\
    \n4. The condition is now evaluated again. If it is true, the loop executes and\
    \ the process repeats itself (body of loop, then increment step, and then again\
    \ condition). After the condition becomes false, the ‘for’ loop terminates.\n\n\
    ## Flow Diagram\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_70_0.png)\n\n## Example\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* for loop execution */\n \
    \   for( int a = 10; a < 20; a = a + 1 )\n    {\n        printf(\"value of a:\
    \ %d\\n\", a);\n    }\n\n    return 0;\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\n\n```text\nvalue of a: 10\n\
    \nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\nvalue of a: 14\n\nvalue\
    \ of a: 15\n\nvalue of a: 16\n\nvalue of a: 17\n\nvalue of a: 18\n\nvalue of a:\
    \ 19\n```\n\n## do...while Loop\n\nUnlike **for** and **while** loops, which test\
    \ the loop condition at the top of the loop, the **do...while** loop in C programming\
    \ checks its condition at the bottom of the loop.\n\nA **do...while** loop is\
    \ similar to a while loop, except the fact that it is guaranteed to execute at\
    \ least one time.\n\n## Syntax\n\nThe syntax of a **do...while** loop in C programming\
    \ language is:\n\n```c\ndo\n{\n    statement(s);\n\n}while( condition );\n```\n\
    \nNotice that the conditional expression appears at the end of the loop, so the\
    \ statement(s) in the loop executes once before the condition is tested.\n\nIf\
    \ the condition is true, the flow of control jumps back up to do, and the statement(s)\
    \ in the loop executes again. This process repeats until the given condition becomes\
    \ false.\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_72_0.png)\n\n```c\n#include\
    \ <stdio.h>\n\nint main ()\n{\n    /* local variable definition */\n    int a\
    \ = 10;\n\n    /* do loop execution */\n    do\n    {\n    printf(\"value of a:\
    \ %d\\n\", a);\n    a = a + 1;\n    }while( a < 20 );\n\n    return 0;\n}\n```\n\
    \nWhen the above code is compiled and executed, it produces the following result:\n\
    \n```text\nvalue of a: 10\n\nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\
    \nvalue of a: 14\n\nvalue of a: 15\n\nvalue of a: 16\n\nvalue of a: 17\n\nvalue\
    \ of a: 18\n\nvalue of a: 19\n```\n\n## Nested Loops\n\nC programming allows to\
    \ use one loop inside another loop. The following section shows a few examples\
    \ to illustrate the concept.\n\n## Syntax\n\nThe syntax for a **nested for loop**\
    \ statement in C is as follows:\n\n```c\nfor ( init; condition; increment )\n\
    {\n    for ( init; condition; increment )\n    {\n        statement(s);\n    }\n\
    \    statement(s);\n}\n```\n\nThe syntax for a **nested while loop** statement\
    \ in C programming language is as follows:\n\n```c\nwhile(condition)\n{\n    while(condition)\n\
    \    {\n        statement(s);\n    }\n    statement(s);\n}\n```\n\nThe syntax\
    \ for a **nested do...while loop** statement in C programming language is as follows:\n\
    \n```c\ndo\n{\n    statement(s);\n    do\n    {\n        statement(s);\n    }while(\
    \ condition );\n}while( condition );\n```\n\nA final note on loop nesting is that\
    \ you can put any type of loop inside any other type of loop. For example, a ‘for’\
    \ loop can be inside a ‘while’ loop or vice versa.\n\n## Example\n\nThe following\
    \ program uses a nested for loop to find the prime numbers from 2 to 100:\n\n\
    ```c\n#include <stdio.h>\n\nint main ()\n{\n    /* local variable definition */\n\
    \    int i, j;\n\n    for(i=2; i<100; i++) {\n        for (j=2; j <= (i/j); j++)\n\
    \            if(!(i%j)) break;          // if factor found, not prime\n      \
    \  if(j > (i/j)) printf(\"%d is prime\\n\", i);\n    }\n    return 0;\n}\n```\n\
    \nWhen the above code is compiled and executed, it produces the following result:\n\
    \n```text\n2 is prime\n\n3 is prime\n\n5 is prime\n\n7 is prime\n\n11 is prime\n\
    \n13 is prime\n\n17 is prime\n\n19 is prime\n\n23 is prime\n\n29 is prime\n\n\
    31 is prime\n\n37 is prime\n\n41 is prime\n\n43 is prime\n\n47 is prime\n\n53\
    \ is prime\n\n59 is prime\n\n61 is prime\n\n67 is prime\n\n71 is prime\n\n73 is\
    \ prime\n\n79 is prime\n\n83 is prime\n\n89 is prime\n\n97 is prime\n```\n\n##\
    \ Loop Control Statements\n\nLoop control statements change execution from its\
    \ normal sequence. When execution leaves a scope, all automatic objects that were\
    \ created in that scope are destroyed.\n\nC supports the following control statements.\n"
  mdcn: "\n\n- 并非每个 `case` 都必须包含 **break**。如果没有 **break**，控制流将 *穿透*（fall through）到后续的\
    \ `case`，直到遇到 break 为止。\n- **switch** 语句可以有一个可选的 **default** 分支，它必须出现在 switch\
    \ 的末尾。当所有 `case` 都不匹配时，可以使用 default 分支来执行相应任务。default 分支中不需要 **break**。\n\n##\
    \ 流程图\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_62_0.png)\n\n## 示例\n\n```c\n\
    #include <stdio.h>\n\nint main ()\n{\n    /* 局部变量定义 */\n    char grade = 'B';\n\
    \n    switch(grade)\n    {\n    case 'A' :\n        printf(\"Excellent!\\n\" );\n\
    \        break;\n    case 'B' :\n    case 'C' :\n        printf(\"Well done\\\
    n\" );\n        break;\n    case 'D' :\n        printf(\"You passed\\n\" );\n\
    \        break;\n    case 'F' :\n        printf(\"Better try again\\n\" );\n \
    \       break;\n    default :\n        printf(\"Invalid grade\\n\" );\n    }\n\
    \    printf(\"Your grade is %c\\n\", grade );\n\n    return 0;\n}\n```\n\n当上面的代码被编译和执行时，它会产生以下结果：\n\
    \n```text\nWell done\n\nYour grade is B\n```\n\n## 嵌套 switch 语句\n\n将一个 switch\
    \ 作为外部 switch 语句序列的一部分是可能的。即使内部和外部 switch 的 case 常量包含相同的值，也不会产生冲突。\n\n## 语法\n\n\
    **嵌套 switch** 语句的语法如下：\n\n```c\nswitch(ch1) {\n    case 'A':\n        printf(\"\
    This A is part of outer switch\");\n        switch(ch2) {\n            case 'A':\n\
    \                printf(\"This A is part of inner switch\");\n               \
    \ break;\n            case 'B': /* 分支代码 */\n        }\n        break;\n    case\
    \ 'B': /* 分支代码 */\n}\n```\n\n## 示例\n\n```c\n#include <stdio.h>\n\nint main ()\n\
    {\n    /* 局部变量定义 */\n    int a = 100;\n    int b = 200;\n\n    switch(a) {\n \
    \       case 100:\n            printf(\"This is part of outer switch\\n\", a );\n\
    \            switch(b) {\n                case 200:\n                    printf(\"\
    This is part of inner switch\\n\", a );\n            }\n    }\n    printf(\"Exact\
    \ value of a is : %d\\n\", a );\n    printf(\"Exact value of b is : %d\\n\", b\
    \ );\n\n    return 0;\n}\n```\n\n当上面的代码被编译和执行时，它会产生以下结果：\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_64_0.png)\n\
    \nThis is part of outer switch\nThis is part of inner switch\nExact value of a\
    \ is : 100\nExact value of b is : 200\n\n## ? : 运算符\n\n我们在前一章中已经介绍了**条件运算符 ? :**，它可以用来替代\
    \ **if...else** 语句。它的一般形式如下：\n\n```\nExp1 ? Exp2 : Exp3;\n```\n\n其中 Exp1、Exp2\
    \ 和 Exp3 是表达式。注意冒号的使用和位置。\n\n? 表达式的值是这样确定的：\n\n1. 对 Exp1 进行求值。如果它为真，则对 Exp2 求值，并使其成为整个\
    \ ? 表达式的值。\n2. 如果 Exp1 为假，则对 Exp3 求值，并将其值作为表达式的值。\n\n## 11. 循环\n\n你可能会遇到需要多次执行一段代码的情况。通常情况下，语句是按顺序执行的：函数中的第一条语句先执行，接着是第二条，以此类推。\n\
    \n编程语言提供了各种控制结构，允许实现更复杂的执行路径。\n\n循环语句允许我们多次执行一条语句或一组语句。下面是大多数编程语言中循环语句的一般形式：\n\
    \n![](img/6e49c39a6ef9e32d938b03dc613e44f6_66_0.png)\n\nC 编程语言提供了以下类型的循环来处理循环需求。\n\
    \n| 循环类型 | 描述 |\n|---|---|\n| while 循环 | 当给定条件为真时，重复执行一条语句或一组语句。它在执行循环体之前测试条件。\
    \ |\n| for 循环 | 多次执行一系列语句，并简化管理循环变量的代码。 |\n\n这里需要重点注意的是，while 循环可能根本不会执行。当条件被测试且结果为假时，循环体将被跳过，while\
    \ 循环之后的第一条语句将被执行。\n\n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* 局部变量定义\
    \ */\n    int a = 10;\n\n    /* while 循环执行 */\n    while( a < 20 )\n    {\n  \
    \      printf(\"value of a: %d\\n\", a);\n        a++;\n    }\n}\n```\n\n4. 现在再次对条件进行求值。如果条件为真，则循环执行并重复此过程（循环体，然后增量步骤，然后再条件）。当条件变为假后，`for`\
    \ 循环终止。\n\n## 流程图\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_70_0.png)\n\n##\
    \ 示例\n\n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* for 循环执行 */\n    for(\
    \ int a = 10; a < 20; a = a + 1 )\n    {\n        printf(\"value of a: %d\\n\"\
    , a);\n    }\n\n    return 0;\n}\n```\n\n当上面的代码被编译和执行时，它会产生以下结果：\n\n```text\n\
    value of a: 10\n\nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\nvalue\
    \ of a: 14\n\nvalue of a: 15\n\nvalue of a: 16\n\nvalue of a: 17\n\nvalue of a:\
    \ 18\n\nvalue of a: 19\n```\n\n## do...while 循环\n\n与 **for** 和 **while** 循环在循环顶部测试循环条件不同，C\
    \ 编程中的 **do...while** 循环在循环底部检查其条件。\n\n**do...while** 循环与 while 循环类似，不同之处在于它保证至少执行一次。\n\
    \n## 语法\n\nC 编程语言中 **do...while** 循环的语法是：\n\n```c\ndo\n{\n    statement(s);\n\n\
    }while( condition );\n```\n\n注意，条件表达式出现在循环的末尾，因此循环中的语句在条件被测试之前先执行一次。\n\n如果条件为真，控制流跳回到\
    \ do，并再次执行循环中的语句。此过程重复，直到给定条件变为假。\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_72_0.png)\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* 局部变量定义 */\n    int a = 10;\n\
    \n    /* do 循环执行 */\n    do\n    {\n    printf(\"value of a: %d\\n\", a);\n  \
    \  a = a + 1;\n    }while( a < 20 );\n\n    return 0;\n}\n```\n\n当上面的代码被编译和执行时，它会产生以下结果：\n\
    \n```text\nvalue of a: 10\n\nvalue of a: 11\n\nvalue of a: 12\n\nvalue of a: 13\n\
    \nvalue of a: 14\n\nvalue of a: 15\n\nvalue of a: 16\n\nvalue of a: 17\n\nvalue\
    \ of a: 18\n\nvalue of a: 19\n```\n\n## 嵌套循环\n\nC 编程允许在一个循环内部使用另一个循环。以下部分展示了一些示例来说明这个概念。\n\
    \n## 语法\n\nC 中**嵌套 for 循环**语句的语法如下：\n\n```c\nfor ( init; condition; increment\
    \ )\n{\n    for ( init; condition; increment )\n    {\n        statement(s);\n\
    \    }\n    statement(s);\n}\n```\n\nC 编程语言中**嵌套 while 循环**语句的语法如下：\n\n```c\n\
    while(condition)\n{\n    while(condition)\n    {\n        statement(s);\n    }\n\
    \    statement(s);\n}\n```\n\nC 编程语言中**嵌套 do...while 循环**语句的语法如下：\n\n```c\ndo\n\
    {\n    statement(s);\n    do\n    {\n        statement(s);\n    }while( condition\
    \ );\n}while( condition );\n```\n\n关于循环嵌套的最后一点说明是，你可以在任何其他类型的循环中放置任何类型的循环。例如，一个\
    \ `for` 循环可以放在 `while` 循环内，反之亦然。\n\n## 示例\n\n下面的程序使用嵌套的 for 循环来找出 2 到 100 之间的素数：\n\
    \n```c\n#include <stdio.h>\n\nint main ()\n{\n    /* 局部变量定义 */\n    int i, j;\n\
    \n    for(i=2; i<100; i++) {\n        for (j=2; j <= (i/j); j++)\n           \
    \ if(!(i%j)) break;          // 如果找到因子，则不是素数\n        if(j > (i/j)) printf(\"\
    %d is prime\\n\", i);\n    }\n    return 0;\n}\n```\n\n当上面的代码被编译和执行时，它会产生以下结果：\n\
    \n```text\n2 is prime\n\n3 is prime\n\n5 is prime\n\n7 is prime\n\n11 is prime\n\
    \n13 is prime\n\n17 is prime\n\n19 is prime\n\n23 is prime\n\n29 is prime\n\n\
    31 is prime\n\n37 is prime\n\n41 is prime\n\n43 is prime\n\n47 is prime\n\n53\
    \ is prime\n\n59 is prime\n\n61 is prime\n\n67 is prime\n\n71 is prime\n\n73 is\
    \ prime\n\n79 is prime\n\n83 is prime\n\n89 is prime\n\n97 is prime\n```\n\n##\
