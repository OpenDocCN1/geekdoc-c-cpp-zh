  - "[PAGE 128]\n\n# # 17. STRUCTURES\n\nArrays allow to define type of variables\
    \ that can hold several data items of the same kind. Similarly, **structure**\
    \ is another user-defined data type available in C that allows to combine data\
    \ items of different kinds.\n\nStructures are used to represent a record. Suppose\
    \ you want to keep track of your books in a library. You might want to track the\
    \ following attributes about each book:\n\n+   - Title\n+   - Author\n+   - Subject\n\
    +   - Book ID\n\n# ## Defining a Structure\n\nTo define a structure, you must\
    \ use the **struct** statement. The struct statement defines a new data type,\
    \ with more than one member. The format of the struct statement is as follows:\n\
    \n```\nstruct [structure tag]\n{\n    member definition;\n    member definition;\n\
    \    ...\n    member definition;\n} [one or more structure variables];\n```\n\n\
    The **structure tag** is optional and each member definition is a normal variable\
    \ definition, such as int i; or float f; or any other valid variable definition.\
    \ At the end of the structure's definition, before the final semicolon, you can\
    \ specify one or more structure variables but it is optional. Here is the way\
    \ you would declare the Book structure:\n\n```\nstruct Books\n{\n    char  title[50];\n\
    \    char  author[50];\n    char  subject[100];\n```"
