    \n    printf(\"Memory size occupied by data : %d\\n\", sizeof(data));\n\n    return\
    \ 0;\n}\n```\n\n当上面的代码被编译并执行时，它产生以下结果：\n\n```\nMemory size occupied by data :\
    \ 20\n```\n\n# 访问联合成员\n\n要访问联合的任何成员，我们使用成员访问运算符 (.)。成员访问运算符是一个句点，位于联合变量名和我们希望访问的联合成员之间。你可以使用关键字\
    \ union 来定义联合类型的变量。下面的示例展示了如何在程序中使用联合：\n\n```\n#include <stdio.h>\n```\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_137_0.png)\n\
