    \ as follows:\n\n```\n```c\n#if SYSTEM_1\n\n    # include \"system_1.h\"\n\n#elif\
    \ SYSTEM_2\n\n    # include \"system_2.h\"\n\n#elif SYSTEM_3\n\n    ...\n\n#endif\n\
    ```\n```\n\nBut as it grows, it becomes tedious, instead the preprocessor offers\
