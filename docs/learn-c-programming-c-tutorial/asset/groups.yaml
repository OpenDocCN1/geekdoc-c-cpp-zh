    \ 'l', 'o', '\\0' };\n```\n\nIf you follow the rule of array initialization, then\
    \ you can write the above statement as follows:\n\n```c\nchar greeting[] = \"\
    Hello\";\n```\n\nFollowing is the memory presentation of the above defined string\
    \ in C/C++:\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_125_0.png)\n\nActually,\
    \ you do not place the null character at the end of a string constant. The C compiler\
    \ automatically places the `'\\0'` at the end of the string when it initializes\
    \ the array. Let us try to print the above mentioned string:\n\n```c\n#include\
    \ <stdio.h>\n\nint main ()\n{\n    char greeting[6] = { 'H', 'e', 'l', 'l', 'o',\
    \ '\\0' };\n\n    printf(\"Greeting message: %s\\n\", greeting );\n\n    return\
