    Value of names[0] = Zara Ali\nValue of names[1] = Hina Ali\nValue of names[2]\
    \ = Nuha Ali\nValue of names[3] = Sara Ali\n```\n\n## 指向指针的指针\n\n指向指针的指针是一种多级间接寻址形式，或者说是指针链。通常，指针包含一个变量的地址。当我们定义一个指向指针的指针时，第一个指针包含第二个指针的地址，而第二个指针则指向包含实际值的位置，如下所示。\n\
