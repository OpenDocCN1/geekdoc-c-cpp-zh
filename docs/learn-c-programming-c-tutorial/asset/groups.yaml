  mdcn: "\n\n## 20. TYPEDEF\n\nC 编程语言提供了一个名为 **typedef** 的关键字，你可以用它为某个类型赋予一个新名称。以下是一个示例，为一字节数字定义术语\
    \ **BYTE**：\n\n```\ntypedef unsigned char BYTE;\n```\n\n在此类型定义之后，标识符 BYTE 可以用作类型\
    \ `unsigned char` 的缩写，例如：\n\n```\nBYTE b1, b2;\n```\n\n按照惯例，这些定义使用大写字母，以提醒用户该类型名实际上是一种符号缩写，但你也可以使用小写字母，如下所示：\n\
    \n```\ntypedef unsigned char byte;\n```\n\n你也可以使用 **typedef** 为你自定义的数据类型命名。例如，你可以将\
    \ typedef 与结构体结合使用来定义一个新的数据类型，然后直接使用该数据类型定义结构体变量，如下所示：\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n\ntypedef struct Books\n{\n    char title[50];\n    char\
    \ author[50];\n    char subject[100];\n    int book_id;\n} Book;\n\nint main(\
    \ )\n{\n    Book book;\n\n    strcpy( book.title, \"C Programming\");\n}\n```\n\
    \n当以上代码被编译并执行时，会产生以下结果：\n\n```\nBook  title : C Programming\nBook  author : Nuha\
    \ Ali\nBook  subject : C Programming Tutorial\nBook  book_id : 6495407\n```\n\n\
    ## typedef vs #define\n\n**#define** 是一个 C 指令，它也可以像 **typedef** 一样用于为各种数据类型定义别名，但有如下区别：\n\
    \n-   **typedef** 仅限于为类型赋予符号名称，而 **#define** 也可以用于为数值定义别名，例如，你可以将 1 定义为 ONE 等。\n\
    -   **typedef** 的解释由编译器执行，而 **#define** 语句由预处理器处理。\n\n下面的示例展示了如何在程序中使用 #define：\n\
    \n```\n#include <stdio.h>\n\n#define TRUE  1\n\n#define FALSE 0\n\nint main( )\n\
    {\n    printf( \"Value of TRUE : %d\\n\", TRUE);\n}\n```\n\n```\nprintf( \"Value\
    \ of FALSE : %d\\n\", FALSE);\n\nreturn 0;\n}\n```\n\n当以上代码被编译并执行时，会产生以下结果：\n\n\
    ```\nValue of TRUE : 1\n\nValue of FALSE : 0\n```\n\n当我们说到“输入”时，意思是向程序提供一些数据。输入可以通过文件或命令行给出。C\
    \ 编程提供了一组内置函数，用于读取给定的输入，并根据要求将其提供给程序。\n\n当我们说到“输出”时，意思是把一些数据显示在屏幕、打印机或任何文件中。C\
    \ 编程提供了一组内置函数，用于将数据输出到计算机屏幕，也可以将其保存到文本或二进制文件中。\n\n# 标准文件\n\nC 编程将所有设备都视为文件。因此，诸如显示器之类的设备与文件一样被处理，并且当一个程序执行时，会自动打开以下三个文件，以提供对键盘和屏幕的访问。\n\
    \n\\begin{tabular}{ccc}\n**标准文件** & **文件指针** & **设备** \\\\\n标准输入 & stdin & 键盘\
    \ \\\\\n标准输出 & stdout & 屏幕 \\\\\n标准错误 & stderr & 你的屏幕 \\\\\n\\end{tabular}\n\n\
    文件指针是访问文件以进行读写的途径。本节解释如何从屏幕读取值以及如何在屏幕上打印结果。\n\n# getchar() 和 putchar() 函数\n\n\
    int getchar(void) 函数从屏幕读取下一个可用字符，并将其作为整数返回。该函数一次只读取一个字符。如果你想从屏幕读取多个字符，可以在循环中使用此方法。\n\
    \nint putchar(int c) 函数将传入的字符显示在屏幕上，并返回同样的字符。该函数一次只输出一个字符。如果你想在屏幕上显示多个字符，可以在循环中使用此方法。请查看以下示例：\n\
    \n```\n#include <stdio.h>\n\nint main( )\n{\n    int c;\n\n    printf( \"Enter\
    \ a value :\");\n    c = getchar( );\n\n    printf( \"\\nYou entered: \");\n \
    \   putchar( c );\n\n    return 0;\n}\n```\n\n当以上代码被编译并执行时，它会等待你输入一些文本。当你输入文本并按下回车键后，程序会继续执行，并且只读取一个字符，然后将其显示如下：\n\
    \n```\nEnter a value : this is test\nYou entered: t\n```\n\n# gets() 和 puts()\
    \ 函数\n\n**char *gets(char *s)** 函数从 **stdin** 读取一行到由 *s* 指向的缓冲区，直到遇到终止换行符或 EOF（文件结束符）。\n\
    \n**int puts(const char *s)** 函数将字符串's'和一个尾随换行符写入 **stdout**。\n\n```\n#include\
    \ <stdio.h>\n\nint main( )\n{\n    char str[100];\n\n    printf( \"Enter a value\
    \ :\");\n    gets( str );\n\n    printf( \"\\nYou entered: \");\n}\n```\n\n当以上代码被编译并执行时，它会等待你输入一些文本。当你输入文本并按下回车键后，程序会继续执行，读取整行直到末尾，并将其显示如下：\n\
    \n# scanf() 和 printf() 函数\n\nint scanf(const char *format, ...) 函数从标准输入流 stdin\
    \ 读取输入，并根据提供的格式扫描该输入。\n\nint printf(const char *format, ...) 函数将输出写入标准输出流 stdout，并根据提供的格式生成输出。\n\
    \n格式可以是一个简单的常量字符串，但你可以指定 %s、%d、%c、%f 等，分别用于打印或读取字符串、整数、字符或浮点数。还有许多其他格式选项可以根据需要使用。现在让我们看一个简单的例子来更好地理解这些概念：\n\
    \n```\n#include <stdio.h>\nint main( )\n{\nchar str[100];\nint i;\nprintf(\"Enter\
    \ a value :\");\nscanf(\"%s %d\", str, &i);\nprintf(\"\\nYou entered: %s %d \"\
    , str, i);\nreturn 0;\n}\n```\n\n当以上代码被编译并执行时，它会等待你输入一些文本。当你输入文本并按下回车键后，程序会继续执行，读取输入并将其显示如下：\n\
    \n```\n$. /a.out\n\nEnter a value : seven 7\n\nYou entered: seven 7\n```\n\n这里需要注意的是，scanf()\
    \ 期望的输入格式与你提供的 %s 和 %d 一致，这意味着你必须提供有效的输入，例如“string integer”。如果你提供“string string”或“integer\
    \ integer”，则会被认为是错误的输入。其次，在读取字符串时，scanf() 一旦遇到空格就会停止读取，因此“this is test”对于 scanf()\
    \ 来说是三个字符串。\n\n"
