  mdcn: "\n# 15. POINTERS\n\nPointers in C are easy and fun to learn. Some C programming\
    \ tasks are performed more easily with pointers, and other tasks, such as dynamic\
    \ memory allocation, cannot be performed without using pointers. So it becomes\
    \ necessary to learn pointers to become a perfect C programmer. Let's start learning\
    \ them in simple and easy steps.\n\nAs you know, every variable is a memory location\
    \ and every memory location has its address defined which can be accessed using\
    \ ampersand (&) operator, which denotes an address in memory. Consider the following\
    \ example, which prints the address of the variables defined:\n\n```c\n#include\
    \ <stdio.h>\n\nint main ()\n{\n    int var1;\n    char var2[10];\n\n    printf(\"\
    Address of var1 variable: %x\\n\", &var1 );\n    printf(\"Address of var2 variable:\
    \ %x\\n\", &var2 );\n\n    return 0;\n}\n```\n\nWhen the above code is compiled\
    \ and executed, it produces the following result:\n\n```\nAddress of var1 variable:\
    \ bff5a400\n\nAddress of var2 variable: bff5a3f6\n```\n\n# What are Pointers?\n\
    \nA **pointer** is a variable whose value is the address of another variable,\
    \ i.e., direct address of the memory location. Like any variable or constant,\
    \ you must declare a pointer before using it to store any variable address. The\
    \ general form of a pointer variable declaration is:\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_109_0.png)\n\
    \n[PAGE 110]\n\n<!-- no content -->\n\n[PAGE 111]\n\n```\n```c\n/* access the\
    \ value using the pointer */\nprintf(\"Value of *ip variable: %d\\n\", *ip );\n\
    \nreturn 0;\n}\n```\n\nWhen the above code is compiled and executed, it produces\
    \ the following result:\n\n```\nAddress of var variable: bffd8b3c\n\nAddress stored\
    \ in ip variable: bffd8b3c\n\nValue of *ip variable: 20\n```\n```\n\n# NULL Pointers\n\
    \nIt is always a good practice to assign a NULL value to a pointer variable in\
    \ case you do not have an exact address to be assigned. This is done at the time\
    \ of variable declaration. A pointer that is assigned NULL is called a **null\
    \ pointer**.\n\nThe NULL pointer is a constant with a value of zero defined in\
    \ several standard libraries. Consider the following program:\n\n```c\n#include\
    \ <stdio.h>\n\nint main ()\n{\n    int *ptr = NULL;\n\n    printf(\"The value\
    \ of ptr is : %X\\n\", ptr );\n\n    return 0;\n}\n```\n\nWhen the above code\
    \ is compiled and executed, it produces the following result:\n\n```\nThe value\
    \ of ptr is 0\n```\n\nIn most of the operating systems, programs are not permitted\
    \ to access memory at address 0 because that memory is reserved by the operating\
    \ system. However, the memory address 0 has special significance; it signals that\
    \ the pointer is not intended to point to an accessible memory location. But by\
    \ convention, if a pointer contains the null (zero) value, it is assumed to point\
    \ to nothing.\n\n[PAGE 112]\n\nTo check for a null pointer, you can use an `if`\
    \ statement as follows:\n\n```\nif(ptr)    /\\* succeeds if p is not null \\*/\n\
    if(!ptr)    /\\* succeeds if p is null \\*/\n```\n\n# Pointers in Detail\n\nPointers\
    \ have many but easy concepts and they are very important to C programming. The\
    \ following important pointer concepts should be clear to any C programmer:\n\n\
    \\begin{tabular}{cc}\n**Concept** & **Description** \\\\\nPointer arithmetic &\
    \ There are four arithmetic operators that can be used in pointers: ++, --, +,\
    \ - \\\\\nArray of pointers & You can define arrays to hold a number of pointers.\
    \ \\\\\nPointer to pointer & C allows you to have pointer on a pointer and so\
    \ on. \\\\\nPassing pointers to functions in C & Passing an argument by reference\
    \ or by address enable the passed argument to be changed in the calling function\
    \ by the called function. \\\\\nReturn pointer from functions in C & C allows\
    \ a function to return a pointer to the local variable, static variable, and dynamically\
    \ allocated memory as well. \\\\\n\\end{tabular}\n\n# Pointer Arithmetic\n\nA\
    \ pointer in C is an address, which is a numeric value. Therefore, you can perform\
    \ arithmetic operations on a pointer just as you can on a numeric value. There\
    \ are four arithmetic operators that can be used on pointers: ++, --, +, and -\n\
    \nTo understand pointer arithmetic, let us consider that ptr is an integer pointer\
    \ which points to the address 1000. Assuming 32-bit integers, let us perform the\
    \ following arithmetic operation on the pointer:\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_112_0.png)\n\
    \n[PAGE 113]\n\n```\n```c\nptr++\n```\n```\n\nAfter the above operation, the **ptr**\
    \ will point to the location 1004 because each time ptr is incremented, it will\
    \ point to the next integer location which is 4 bytes next to the current location.\
    \ This operation will move the pointer to the next memory location without impacting\
    \ the actual value at the memory location. If **ptr** points to a character whose\
    \ address is 1000, then the above operation will point to the location 1001 because\
    \ the next character will be available at 1001.\n\n# Incrementing a Pointer\n\n\
    We prefer using a pointer in our program instead of an array because the variable\
    \ pointer can be incremented, unlike the array name which cannot be incremented\
    \ because it is a constant pointer. The following program increments the variable\
    \ pointer to access each succeeding element of the array:\n\n```\n```c\n#include\
    \ <stdio.h>\n\nconst int MAX = 3;\n\nint main ()\n{\n    int var[] = {10, 100,\
    \ 200};\n    int i, *ptr;\n\n    /* let us have array address in pointer */\n\
    \    ptr = var;\n    for ( i = 0; i < MAX; i++)\n    {\n        printf(\"Address\
    \ of var[%d] = %x\\n\", i, ptr );\n        printf(\"Value of var[%d] = %d\\n\"\
    , i, *ptr );\n\n        /* move to the next location */\n        ptr++;\n    }\n\
    \    return 0;\n}\n```\n```\n"
