    这里很容易理解，首先 c 被转换为整数，但由于最终值是 double 类型，因此适用通常的算术转换，编译器将 i 和 c 转换为 ‘float’，然后将它们相加，得到\
    \ ‘float’ 结果。\n\n# 26. 错误处理\n\n因此，C 语言编程并不直接提供错误处理支持，但作为一种系统编程语言，它通过返回值的形式在较低层次上为你提供访问。大多数\
    \ C 函数甚至 Unix 函数调用在发生任何错误时都会返回 -1 或 NULL，并设置一个错误代码 **errno**。它被设置为一个全局变量，表示在任何函数调用期间发生了错误。你可以在\
    \ <error.h> 头文件中找到各种错误代码的定义。\n\n因此，C 程序员可以检查返回值，并根据返回值采取适当的操作。在初始化程序时将 errno 设置为\
    \ 0 是一种良好的实践。0 值表示程序中没有任何错误。\n\n# errno、perror() 和 strerror()\n\nC 语言提供了 **perror()**\
    \ 和 **strerror()** 函数，可用于显示与 **errno** 关联的文本消息。\n\n+   - **perror()** 函数显示你传递给它的字符串，后跟一个冒号、一个空格，然后是当前\
    \ errno 值的文本表示形式。\n+   - **strerror()** 函数返回一个指向当前 errno 值文本表示形式的指针。\n\n让我们尝试模拟一个错误条件，尝试打开一个不存在的文件。这里我使用这两个函数来演示用法，但你可以使用一种或多种方式打印错误。第二个重要注意事项是，你应该使用\
    \ **stderr** 文件流来输出所有错误。\n\n```c\n#include <stdio.h>\n\n#include <errno.h>\n\n\
    #include <string.h>\n\n\nextern int errno ;\n\n\nint main ()\n{\n    FILE * pf;\n\
    \    int errnum;\n    pf = fopen (\"unexist.txt\", \"rb\");\n```\n\n# 程序退出状态\n\
    \n通常的做法是，在程序成功操作后退出时，使用 EXIT_SUCCESS 值作为退出状态。这里，EXIT_SUCCESS 是一个宏，定义为 0。\n\n如果你的程序中存在错误条件并准备退出，那么你应该使用\
    \ EXIT_FAILURE 状态退出，它被定义为 -1。因此，让我们将上述程序编写如下：\n\n```c\n#include <stdio.h>\n\n\
    #include <stdlib.h>\n\nmain()\n{\n    int dividend = 20;\n\n    int divisor =\
    \ 5;\n    int quotient;\n\n    if( divisor == 0){\n        fprintf(stderr, \"\
