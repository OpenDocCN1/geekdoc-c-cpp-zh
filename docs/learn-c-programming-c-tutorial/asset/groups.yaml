    \n```c\n#include <stdio.h>\n\nconst int MAX = 3;\n\nint main ()\n{\n    int var[]\
    \ = {10, 100, 200};\n    int i, *ptr[MAX];\n\n    for ( i = 0; i < MAX; i++)\n\
    \    {\n        ptr[i] = &var[i]; /* assign the address of integer. */\n    }\n\
    \n    for ( i = 0; i < MAX; i++)\n    {\n        printf(\"Value of var[%d] = %d\\\
    n\", i, *ptr[i] );\n    }\n    return 0;\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果：\n\n\
    ```text\nValue of var[0] = 10\nValue of var[1] = 100\nValue of var[2] = 200\n\
