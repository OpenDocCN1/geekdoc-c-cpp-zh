    {\n    char name[100];\n    char *description;\n\n    strcpy(name, \"Zara Ali\"\
    );\n\n    /* allocate memory dynamically */\n    description = malloc( 200 * sizeof(char)\
    \ );\n    if( description == NULL )\n    {\n        fprintf(stderr, \"Error -\
    \ unable to allocate required memory\\n\");\n    }\n    else\n    {\n        strcpy(\
    \ description, \"Zara ali a DPS student in class 10th\");\n    }\n    printf(\"\
    Name = %s\\n\", name );\n    printf(\"Description: %s\\n\", description );\n}\n\
    ```\n```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result.\n\n```\n```text\nName = Zara Ali\nDescription: Zara ali a DPS student\
    \ in class 10th\n```\n```\n\nSame program can be written using **calloc();** only\
    \ thing is you need to replace malloc with calloc as follows:\n\n```\n```c\ncalloc(200,\
    \ sizeof(char));\n```\n```\n\nSo you have complete control and you can pass any\
    \ size value while allocating memory, unlike arrays where once the size is defined,\
    \ you cannot change it."
