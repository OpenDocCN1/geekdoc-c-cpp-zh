    [PAGE 136]\n\n# # 18. 联合\n\n**联合**是 C 语言中一种特殊的数据类型，它允许在同一内存位置存储不同的数据类型。你可以定义一个包含多个成员的联合，但在任意给定时刻，只能有一个成员包含值。联合提供了一种在多个用途中有效利用同一内存位置的方式。\n\
    \n# ## 定义联合\n\n要定义联合，你必须使用 **union** 语句，其方式与定义结构体时相同。union 语句为你的程序定义了一个包含多个成员的新数据类型。union\
