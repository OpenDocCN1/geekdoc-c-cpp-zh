    \ the exponent, or both; and while representing exponential form, you must include\
    \ the integer part, the fractional part, or both. The signed exponent is introduced\
    \ by e or E.\n\nHere are some examples of floating-point literals:\n\n```\n3.14159\
    \       /* Legal */\n314159E-5L    /* Legal */\n510E          /* Illegal: incomplete\
