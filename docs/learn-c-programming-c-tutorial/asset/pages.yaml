  md: "# # 8. STORAGE CLASSES\n\nA storage class defines the scope (visibility) and\
    \ life-time of variables and/or functions within a C Program. They precede the\
    \ type that they modify. We have four different storage classes in a C program:\n\
    \n+   - auto\n+   - register\n+   - static\n+   - extern\n\n# ## The auto Storage\
    \ Class\n\nThe **auto** storage class is the default storage class for all local\
    \ variables.\n\n```\n```c\n{\n    int mount;\n    auto int month;\n}\n```\n```\n\
    \nThe example above defines two variables within the same storage class. ‘auto’\
    \ can only be used within functions, i.e., local variables.\n\n# ## The register\
    \ Storage Class\n\nThe **register** storage class is used to define local variables\
    \ that should be stored in a register instead of RAM. This means that the variable\
    \ has a maximum size equal to the register size (usually one word) and can't have\
    \ the unary '&' operator applied to it (as it does not have a memory location).\n\
    \n```\n```c\n{\n    register int miles;\n}\n```\n```\n\nThe register should only\
    \ be used for variables that require quick access such as counters. It should\
    \ also be noted that defining 'register' does not mean that the variable will\
    \ be stored in a register. It means that it MIGHT be stored in a register depending\
    \ on hardware and implementation restrictions."
  merge: -1
  img_proc: true
- pgno: 33
  md: "# # The static Storage Class\n\nThe static storage class instructs the compiler\
    \ to keep a local variable in existence during the life-time of the program instead\
    \ of creating and destroying it each time it comes into and goes out of scope.\
    \ Therefore, making local variables static allows them to maintain their values\
    \ between function calls.\n\nThe static modifier may also be applied to global\
    \ variables. When this is done, it causes that variable's scope to be restricted\
    \ to the file in which it is declared.\n\nIn C programming, when static is used\
    \ on a class data member, it causes only one copy of that member to be shared\
    \ by all the objects of its class.\n\n```\n#include <stdio.h>\n\n/* function declaration\
    \ */\nvoid func(void);\n\nstatic int count = 5;    /\\* global variable \\*/\n\
    \nmain()\n{\n    while(count--)\n    {\n        func();\n    }\n    return 0;\n\
    }\n/\\* function definition \\*/\nvoid func( void )\n{\n    static int i = 5;\
    \    /\\* local static variable \\*/\n    i++;\n    printf(\"i is %d and count\
    \ is %d\\n\", i, count);\n}\n```\n\nWhen the above code is compiled and executed,\
    \ it produces the following result:\n\n> i is 6 and count is 4\n> i is 7 and count\
    \ is 3"
