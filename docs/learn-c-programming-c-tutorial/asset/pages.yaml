  md: "# 26. ERROR HANDLING\n\nAs such, C programming does not provide direct support\
    \ for error handling but being a system programming language, it provides you\
    \ access at lower level in the form of return values. Most of the C or even Unix\
    \ function calls return -1 or NULL in case of any error and set an error code\
    \ **errno**. It is set as a global variable and indicates an error occurred during\
    \ any function call. You can find various error codes defined in <error.h> header\
    \ file.\n\nSo a C programmer can check the returned values and can take appropriate\
    \ action depending on the return value. It is a good practice to set errno to\
    \ 0 at the time of initializing a program. A value of 0 indicates that there is\
    \ no error in the program.\n\n# errno, perror(), and strerror()\n\nThe C programming\
    \ language provides **perror()** and **strerror()** functions which can be used\
    \ to display the text message associated with **errno**.\n\n+   - The **perror()**\
    \ function displays the string you pass to it, followed by a colon, a space, and\
    \ then the textual representation of the current errno value.\n+   - The **strerror()**\
    \ function, which returns a pointer to the textual representation of the current\
    \ errno value.\n\nLet's try to simulate an error condition and try to open a file\
    \ which does not exist. Here I'm using both the functions to show the usage, but\
    \ you can use one or more ways of printing your errors. Second important point\
    \ to note is that you should use **stderr** file stream to output all the errors.\n\
    \n```\n```c\n#include <stdio.h>\n\n#include <errno.h>\n\n#include <string.h>\n\
    \n\nextern int errno ;\n\n\nint main ()\n{\n    FILE * pf;\n    int errnum;\n\
    \    pf = fopen (\"unexist.txt\", \"rb\");\n```\n```"
