- pgno: 163
  md: "# Computed Includes\n\nSometimes it is necessary to select one of the several\
    \ different header files to be included into your program. For instance, they\
    \ might specify configuration parameters to be used on different sorts of operating\
    \ systems. You could do this with a series of conditionals as follows:\n\n```\n\
    ```c\n#if SYSTEM_1\n\n    # include \"system_1.h\"\n\n#elif SYSTEM_2\n\n    #\
    \ include \"system_2.h\"\n\n#elif SYSTEM_3\n\n    ...\n\n#endif\n```\n```\n\n\
    But as it grows, it becomes tedious, instead the preprocessor offers the ability\
    \ to use a macro for the header name. This is called a **computed include**. Instead\
    \ of writing a header name as the direct argument of **#include**, you simply\
    \ put a macro name there:\n\n```\n```c\n#define SYSTEM_H \"system_1.h\"\n\n...\n\
    \n#include SYSTEM_H\n```\n```\n\nSYSTEM_H will be expanded, and the preprocessor\
    \ will look for system_1.h as if the **#include** had been written that way originally.\
    \ SYSTEM_H could be defined by your Makefile with a -D option."
