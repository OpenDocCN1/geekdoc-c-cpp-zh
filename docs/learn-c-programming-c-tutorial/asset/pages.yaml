  md: "# 25. TYPE CASTING\n\nType casting is a way to convert a variable from one\
    \ data type to another data type. For example, if you want to store a ‘long’ value\
    \ into a simple integer, then you can type cast ‘long’ to ‘int’. You can convert\
    \ the values from one type to another explicitly using the **cast operator** as\
    \ follows:\n\n```\n```c\n(type_name) expression\n```\n```\n\nConsider the following\
    \ example where the cast operator causes the division of one integer variable\
    \ by another to be performed as a floating-point operation:\n\n```\n```c\n#include\
    \ <stdio.h>\n\nmain()\n{\n    int sum = 17, count = 5;\n    double mean;\n\n \
    \   mean = (double) sum / count;\n    printf(\"Value of mean : %f\\n\", mean );\n\
    }\n```\n```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result:\n\n```\n```text\nValue of mean : 3.400000\n```\n```\n\nIt should be\
    \ noted here that the cast operator has precedence over division, so the value\
    \ of sum is first converted to type **double** and finally it gets divided by\
    \ count yielding a double value.\n\nType conversions can be implicit which is\
    \ performed by the compiler automatically, or it can be specified explicitly through\
    \ the use of the **cast operator**. It is considered good programming practice\
    \ to use the cast operator whenever type conversions are necessary."
  merge: -1
  img_proc: true
