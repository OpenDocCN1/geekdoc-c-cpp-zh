- pgno: 142
  md: "|  |  |\n|---|---|\n|  | interpreted. The type may be int, signed int, or unsigned\
    \ int. |\n| member_name | The name of the bit-field. |\n| width | The number of\
    \ bits in the bit-field. The width must be less than or equal to the bit width\
    \ of the specified type. |\n\nThe variables defined with a predefined width are\
    \ called **bit fields**. A bit field can hold more than a single bit; for example,\
    \ if you need a variable to store a value from 0 to 7, then you can define a bit-field\
    \ with a width of 3 bits as follows:\n\n```\nstruct\n{\n    unsigned int age :\
    \ 3;\n} Age;\n```\n\nThe above structure definition instructs the C compiler that\
    \ the age variable is going to use only 3 bits to store the value. If you try\
    \ to use more than 3 bits, then it will not allow you to do so. Let us try the\
    \ following example:\n\n```\n#include <stdio.h>\n#include <string.h>\n\nstruct\n\
    {\n    unsigned int age : 3;\n} Age;\n\nint main( )\n{\n    Age.age = 4;\n   \
    \ printf( \"Sizeof( Age ) : %d\\n\", sizeof(Age) );\n    printf( \"Age.age : %d\\\
    n\", Age.age );\n\n    Age.age = 7;\n    printf( \"Age.age : %d\\n\", Age.age\
    \ );\n\n    Age.age = 8;\n```"
