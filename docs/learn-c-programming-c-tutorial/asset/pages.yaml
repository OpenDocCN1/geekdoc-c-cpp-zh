    \ of *ip variable: 20\n```\n```\n\n# NULL Pointers\n\nIt is always a good practice\
    \ to assign a NULL value to a pointer variable in case you do not have an exact\
    \ address to be assigned. This is done at the time of variable declaration. A\
    \ pointer that is assigned NULL is called a **null pointer**.\n\nThe NULL pointer\
    \ is a constant with a value of zero defined in several standard libraries. Consider\
    \ the following program:\n\n```\n```c\n#include <stdio.h>\n\nint main ()\n{\n\
    \    int *ptr = NULL;\n\n    printf(\"The value of ptr is : %X\\n\", ptr );\n\n\
    \    return 0;\n}\n```\n```\n\nWhen the above code is compiled and executed, it\
    \ produces the following result:\n\n```\n```\nThe value of ptr is 0\n```\n```\n\
    \nIn most of the operating systems, programs are not permitted to access memory\
    \ at address 0 because that memory is reserved by the operating system. However,\
    \ the memory address 0 has special significance; it signals that the pointer is\
    \ not intended to point to an accessible memory location. But by convention, if\
    \ a pointer contains the null (zero) value, it is assumed to point to nothing."
