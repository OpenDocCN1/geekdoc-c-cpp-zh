    \ of your program and they can be accessed inside any of the functions defined\
    \ for the program.\n\nA global variable can be accessed by any function. That\
    \ is, a global variable is available for use throughout your entire program after\
    \ its declaration. The following program shows how global variables are used in\
    \ a program.\n\n```\n```c\n#include <stdio.h>\n\n/* global variable declaration\
    \ */\nint g;\n\nint main ()\n{\n    /* local variable declaration */\n    int\
    \ a, b;\n\n    /* actual initialization */\n    a = 10;\n    b = 20;\n    g =\
    \ a + b;\n\n    printf (\"value of a = %d, b = %d and g = %d\\n\", a, b, g);\n\
    \n    return 0;\n}\n```\n```\n\nA program can have same name for local and global\
    \ variables but the value of local variable inside a function will take preference.\
    \ Here is an example:\n\n```\n```c\n#include <stdio.h>\n\n/* global variable declaration\
    \ */\nint g = 20;\n```\n```"
