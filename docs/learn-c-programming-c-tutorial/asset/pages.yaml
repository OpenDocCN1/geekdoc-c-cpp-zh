  md: "# # Preprocessor Operators\n\nThe C preprocessor offers the following operators\
    \ to help create macros:\n\n# ## The Macro Continuation (\\\\) Operator\n\nA macro\
    \ is normally confined to a single line. The macro continuation operator (\\\\\
    ) is used to continue a macro that is too long for a single line. For example:\n\
    \n```\n```c\n#define  message_for(a, b)  \\\\\n    printf(#a \" and \" #b \":\
    \ We love you!\\\\n\")\n```\n```\n\n# ## The Stringize (#) Operator\n\nThe stringize\
    \ or number-sign operator (#), when used within a macro definition, converts a\
    \ macro parameter into a string constant. This operator may be used only in a\
    \ macro having a specified argument or parameter list. For example:\n\n```\n```c\n\
    #include <stdio.h>\n\n#define  message_for(a, b)  \\\\\n    printf(#a \" and \"\
    \ #b \": We love you!\\\\n\")\n\nint main(void)\n{\n    message_for(Carole, Debra);\n\
    \    return 0;\n}\n```\n```\n\nWhen the above code is compiled and executed, it\
    \ produces the following result:\n\n```\n```text\nCarole and Debra: We love you!\n\
    ```\n```\n\n# ## The Token Pasting (##) Operator\n\nThe token-pasting operator\
    \ (##) within a macro definition combines two arguments. It permits two separate\
    \ tokens in the macro definition to be joined into a single token. For example:\n\
    \n```\n```c\n#include <stdio.h>\n```\n```"
