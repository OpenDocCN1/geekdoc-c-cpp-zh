  md: "# 20. TYPEDEF\n\nThe C programming language provides a keyword called **typedef**,\
    \ which you can use to give a type, a new name. Following is an example to define\
    \ a term **BYTE** for one-byte numbers:\n\n```\ntypedef unsigned char BYTE;\n\
    ```\n\nAfter this type definition, the identifier BYTE can be used as an abbreviation\
    \ for the type `unsigned char`, for example:\n\n```\nBYTE b1, b2;\n```\n\nBy convention,\
    \ uppercase letters are used for these definitions to remind the user that the\
    \ type name is really a symbolic abbreviation, but you can use lowercase, as follows:\n\
    \n```\ntypedef unsigned char byte;\n```\n\nYou can use **typedef** to give a name\
    \ to your user-defined data types as well. For example, you can use typedef with\
    \ structure to define a new data type and then use that data type to define structure\
    \ variables directly as follows:\n\n```\n#include <stdio.h>\n#include <string.h>\n\
    \ntypedef struct Books\n{\n    char title[50];\n    char author[50];\n    char\
    \ subject[100];\n    int book_id;\n} Book;\n\nint main( )\n{\n    Book book;\n\
    \n    strcpy( book.title, \"C Programming\");\n};\n```\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_144_0.png)"
