  md: '# 23. PREPROCESSORS


    The **C Preprocessor** is not a part of the compiler, but is a separate step in
    the compilation process. In simple terms, a C Preprocessor is just a text substitution
    tool and it instructs the compiler to do required preprocessing before the actual
    compilation. We''ll refer to the C Preprocessor as CPP.


    All preprocessor commands begin with a hash symbol (#). It must be the first nonblank
    character, and for readability, a preprocessor directive should begin in the first
    column. The following section lists down all the important preprocessor directives:


    | Directive | Description |

    |---|---|

    | `#define` | Substitutes a preprocessor macro. |

    | `#include` | Inserts a particular header from another file. |

    | `#undef` | Undefines a preprocessor macro. |

    | `#ifdef` | Returns true if this macro is defined. |

    | `#ifndef` | Returns true if this macro is not defined. |

    | `#if` | Tests if a compile time condition is true. |

    | `#else` | The alternative for `#if`. |

    | `#elif` | `#else` and `#if` in one statement. |

    | `#endif` | Ends preprocessor conditional. |

    | `#error` | Prints error message on stderr. |

    | `#pragma` | Issues special commands to the compiler, using a standardized |'
  merge: -1
  img_proc: true
- pgno: 156
  md: "# ## Preprocessors Examples\n\nAnalyze the following examples to understand\
    \ various directives.\n\n```\n```c\n#define MAX_ARRAY_LENGTH 20\n```\n```\n\n\
    This directive tells the CPP to replace instances of MAX_ARRAY_LENGTH with 20.\
    \ Use #define for constants to increase readability.\n\n```\n```c\n#include <stdio.h>\n\
    \n#include \"myheader.h\"\n```\n```\n\nThese directives tell the CPP to get stdio.h\
    \ from **System Libraries** and add the text to the current source file. The next\
    \ line tells CPP to get **myheader.h** from the local directory and add the content\
    \ to the current source file.\n\n```\n```c\n#undef FILE_SIZE\n\n#define FILE_SIZE\
    \ 42\n```\n```\n\nIt tells the CPP to undefine existing FILE_SIZE and define it\
    \ as 42.\n\n```\n```c\n#ifndef MESSAGE\n    #define MESSAGE \"You wish!\"\n\n\
    #endif\n```\n```\n\nIt tells the CPP to define MESSAGE only if MESSAGE isn't already\
    \ defined.\n\n```\n```c\n#ifdef DEBUG\n    /* Your debugging statements here */\n\
    \n#endif\n```\n```\n\nIt tells the CPP to process the statements enclosed if DEBUG\
    \ is defined. This is useful if you pass the **-DDEBUG** flag to the gcc compiler\
    \ at the time of compilation. This will define DEBUG, so you can turn debugging\
    \ on and off on-the-fly during compilation.\n\n# ## Predefined Macros\n\nANSI\
    \ C defines a number of macros. Although each one is available for use in programming,\
    \ the predefined macros should not be directly modified."
