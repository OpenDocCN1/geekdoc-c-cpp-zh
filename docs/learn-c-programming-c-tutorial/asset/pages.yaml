  md: "# 19. BIT FIELDS\n\nSuppose your C program contains a number of TRUE/FALSE\
    \ variables grouped in a structure called status, as follows:\n\n```\n```\nstruct\n\
    {\n    unsigned int widthValidated;\n    unsigned int heightValidated;\n}\nstatus;\n\
    ```\n```\n\nThis structure requires 8 bytes of memory space but in actual, we\
    \ are going to store either 0 or 1 in each of the variables. The C programming\
    \ language offers a better way to utilize the memory space in such situations.\n\
    \nIf you are using such variables inside a structure, then you can define the\
    \ width of a variable which tells the C compiler that you are going to use only\
    \ those number of bytes. For example, the above structure can be rewritten as\
    \ follows:\n\n```\n```\nstruct\n{\n    unsigned int widthValidated : 1;\n    unsigned\
    \ int heightValidated : 1;\n}\nstatus;\n```\n```\n\nThe above structure requires\
    \ 4 bytes of memory space for status variable, but only 2 bits will be used to\
    \ store the values.\n\nIf you will use up to 32 variables, each one with a width\
    \ of 1 bit, then also the status structure will use 4 bytes. However, as soon\
    \ as you have 33 variables, it will allocate the next slot of the memory and it\
    \ will start using 8 bytes. Let us check the following example to understand the\
    \ concept:\n\n```\n```\n#include <stdio.h>\n#include <string.h>\n/* define simple\
    \ structure */\nstruct\n{\n    unsigned int widthValidated;\n```\n```\n\n![](img/6e49c39a6ef9e32d938b03dc613e44f6_140_0.png)"
  merge: -1
  img_proc: true
- pgno: 141
  md: "```\n```c\nunsigned int heightValidated;\n} status1;\n\n/* define a structure\
