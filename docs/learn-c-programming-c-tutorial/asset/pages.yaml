    # Once-Only Headers\n\nIf a header file happens to be included twice, the compiler\
    \ will process its contents twice and it will result in an error. The standard\
    \ way to prevent this is to enclose the entire real contents of the file in a\
    \ conditional, like this:\n\n```\n```c\n#ifndef HEADER_FILE\n#define HEADER_FILE\n\
    \nthe entire header file file\n\n#endif\n```\n```\n\nThis construct is commonly\
    \ known as a wrapper **#ifndef**. When the header is included again, the conditional\
    \ will be false, because HEADER_FILE is defined. The preprocessor will skip over\
    \ the entire contents of the file, and the compiler will not see it twice."
