    \ int heightValidated : 1;\n} status2;\n\nint main( )\n{\n    printf( \"Memory\
    \ size occupied by status1 : %d\\n\", sizeof(status1));\n    printf( \"Memory\
    \ size occupied by status2 : %d\\n\", sizeof(status2));\n\n    return 0;\n}\n\
