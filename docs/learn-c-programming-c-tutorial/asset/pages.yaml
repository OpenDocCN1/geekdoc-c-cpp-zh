- pgno: 12
  md: 'The name and version of text editors can vary on different operating systems.
    For example, Notepad will be used on Windows, and vim or vi can be used on Windows
    as well as on Linux or UNIX.


    The files you create with your editor are called the source files and they contain
    the program source codes. The source files for C programs are typically named
    with the extension **.c**.


    Before starting your programming, make sure you have one text editor in place
    and you have enough experience to write a computer program, save it in a file,
    compile it and finally execute it.


    # The C Compiler


    The source code written in source file is the human readable source for your program.
    It needs to be "compiled" into machine language so that your CPU can actually
    execute the program as per the instructions given.


    The compiler compiles the source codes into final executable programs. The most
    frequently used and free available compiler is the GNU C/C++ compiler, otherwise
    you can have compilers either from HP or Solaris if you have the respective operating
    systems.


    The following section explains how to install GNU C/C++ compiler on various OS.
    We keep mentioning C/C++ together because GNU gcc compiler works for both C and
    C++ programming languages.


    # Installation on UNIX/Linux


    If you are using **Linux** or **UNIX**, then check whether GCC is installed on
    your system by entering the following command from the command line:


    ```

    ```shell

    $ gcc -v

    ```

    ```


    If you have GNU compiler installed on your machine, then it should print a message
    as follows:


    ```

    ```

    Using built-in specs.


    Target: i386-redhat-linux


    Configured with: ../configure --prefix=/usr .......


    Thread model: posix


    gcc version 4.1.2 20080704 (Red Hat 4.1.2-46)

    ```

    ```


    If GCC is not installed, then you will have to install it yourself using the detailed
    instructions available at http://gcc.gnu.org/install/.


    This tutorial has been written based on Linux and all the given examples have
    been compiled on the Cent OS flavor of the Linux system.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Installation on Mac OS


    If you use Mac OS X, the easiest way to obtain GCC is to download the Xcode development
    environment from Apple''s web site and follow the simple installation instructions.
    Once you have Xcode setup, you will be able to use GNU compiler for C/C++.


    Xcode is currently available at developer.apple.com/technologies/tools/.


    # Installation on Windows


    To install GCC on Windows, you need to install MinGW. To install MinGW, go to
    the MinGW homepage, www.mingw.org, and follow the link to the MinGW download page.
    Download the latest version of the MinGW installation program, which should be
    named MinGW-<version>.exe.


    While installing MinGW, at a minimum, you must install gcc-core, gcc-g++, binutils,
    and the MinGW runtime, but you may wish to install more.


    Add the bin subdirectory of your MinGW installation to your **PATH** environment
    variable, so that you can specify these tools on the command line by their simple
    names.


    After the installation is complete, you will be able to run gcc, g++, ar, ranlib,
    dlltool, and several other GNU tools from the Windows command line.'
  merge: -1
  img_proc: true
- pgno: 14
  md: "# 3. PROGRAM STRUCTURE\n\nBefore we study the basic building blocks of the\
    \ C programming language, let us look at a bare minimum C program structure so\
    \ that we can take it as a reference in the upcoming chapters.\n\n# Hello World\
    \ Example\n\nA C program basically consists of the following parts:\n\n+   - Preprocessor\
    \ Commands\n+   - Functions\n+   - Variables\n+   - Statements & Expressions\n\
    +   - Comments\n\nLet us look at a simple code that would print the words \"Hello\
    \ World\":\n\n```\n```c\n#include <stdio.h>\n\nint main()\n{\n    /* my first\
    \ program in C */\n    printf(\"Hello, World! \\n\");\n\n    return 0;\n}\n```\n\
    ```\n\nLet us take a look at the various parts of the above program:\n\n+   1.\
    \ The first line of the program `#include <stdio.h>` is a preprocessor command,\
    \ which tells a C compiler to include stdio.h file before going to actual compilation.\n\
    +   2. The next line `int main()` is the main function where the program execution\
    \ begins.\n+   3. The next line `/* ... */` will be ignored by the compiler and\
    \ it has been put to add additional comments in the program. So such lines are\
    \ called comments in the program."
