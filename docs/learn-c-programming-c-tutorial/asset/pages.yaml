- pgno: 53
  md: '# 10. DECISION MAKING


    Decision-making structures require that the programmer specifies one or more conditions
    to be evaluated or tested by the program, along with a statement or statements
    to be executed if the condition is determined to be true, and optionally, other
    statements to be executed if the condition is determined to be false.


    Shown below is the general form of a typical decision-making structure found in
    most of the programming languages:


    ![](img/6e49c39a6ef9e32d938b03dc613e44f6_53_0.png)


    C programming language assumes any **non-zero** and **non-null** values as **true**,
    and if it is either **zero** or **null**, then it is assumed as **false** value.


    C programming language provides the following types of decision-making statements.


    | Statement | Description |

    |---|---|

    | if statement | An **if statement** consists of a boolean expression followed
    by one or more statements. |

    | if...else statement | An **if statement** can be followed by an optional **else
    statement**, which executes when the condition is false. |'
  merge: -1
  img_proc: true
