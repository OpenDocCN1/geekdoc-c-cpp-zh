    # Relational Operators


    The following table shows all the relational operators supported by C. Assume
    variable **A** holds 10 and variable **B** holds 20, then:


    | Operator | Description | Example |

    |---|---|---|

    | `==` | Checks if the values of two operands are equal or not. If yes, then the
    condition becomes true. | `(A == B)` is not true. |

    | `!=` | Checks if the values of two operands are equal or not. If the values
    are not equal, then the condition becomes true. | `(A != B)` is true. |

    | `>` | Checks if the value of left operand is greater than the value of right
    operand. If yes, then the condition becomes true. | `(A > B)` is not true. |

    | `<` | Checks if the value of left operand is less than the value of right operand.
    If yes, then the condition becomes true. | `(A < B)` is true. |

    | `>=` | Checks if the value of left operand is greater than or equal to the value
    of right operand. If yes, then the condition becomes true. | `(A >= B)` is not
    true. |

    | `<=` | Checks if the value of left operand is less than or equal to the value
    of right operand. If yes, then the condition becomes true. | `(A <= B)` is true.
    |'
