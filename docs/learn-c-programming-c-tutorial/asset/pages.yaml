  md: '# # Assignment Operators


    The following tables lists the assignment operators supported by the C language:


    | Operator | Description | Example |

    |---|---|---|

    | `=` | Simple assignment operator. Assigns values from right side operands to
    left side operand. | `C = A + B` will assign the value of `A + B` to `C` |

    | `+=` | Add AND assignment operator. It adds the right operand to the left operand
    and assigns the result to the left operand. | `C += A` is equivalent to `C = C
    + A` |

    | `-=` | Subtract AND assignment operator. It subtracts the right operand from
    the left operand and assigns the result to the left operand. | `C -= A` is equivalent
    to `C = C - A` |

    | `*=` | Multiply AND assignment operator. It multiplies the right operand with
    the left operand and assigns the result to the left operand. | `C *= A` is equivalent
    to `C = C * A` |

    | `/=` | Divide AND assignment operator. It divides the left operand with the
    right operand and assigns the result to the left operand. | `C /= A` is equivalent
    to `C = C / A` |

    | `%=` | Modulus AND assignment operator. It takes modulus using two operands
    and assigns the result to the left operand. | `C %= A` is equivalent to `C = C
    % A` |

    | `<<=` | Left shift AND assignment operator. | `C <<= 2` is same as `C = C <<
    2` |

    | `>>=` | Right shift AND assignment operator. | `C >>= 2` is same as `C = C >>
    2` |

    | `&=` | Bitwise AND assignment operator. | `C &= 2` is same as `C = C & 2` |'
