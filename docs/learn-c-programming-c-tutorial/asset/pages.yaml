    # Operators Precedence in C


    Operator precedence determines the grouping of terms in an expression and decides
    how an expression is evaluated. Certain operators have higher precedence than
    others; for example, the multiplication operator has a higher precedence than
    the addition operator.


    For example, x = 7 + 3 * 2; here, x is assigned 13, not 20 because operator *
    has a higher precedence than +, so it first gets multiplied with 3*2 and then
    adds into 7.'
