    \ enclosed in parentheses and must immediately follow the macro name. Spaces are\
    \ not allowed between the macro name and open parenthesis. For example:\n\n```\n\
    ```c\n#include <stdio.h>\n\n#define MAX(x,y) ((x) > (y) ? (x) : (y))\n\nint main(void)\n\
