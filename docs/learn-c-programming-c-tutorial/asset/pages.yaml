- pgno: 16
  md: '# # 4. BASIC SYNTAX


    You have seen the basic structure of a C program, so it will be easy to understand
    other basic building blocks of the C programming language.


    # ## Tokens in C


    A C program consists of various tokens and a token is either a keyword, an identifier,
    a constant, a string literal, or a symbol. For example, the following C statement
    consists of five tokens:


    ```

    ```c

    printf("Hello, World! \\n");

    ```

    ```


    The individual tokens are:


    ```

    ```c

    printf

    (

    "Hello, World! \\n"

    )

    ;

    ```

    ```


    # ## Semicolons


    In a C program, the semicolon is a statement terminator. That is, each individual
    statement must be ended with a semicolon. It indicates the end of one logical
    entity.


    Given below are two different statements:


    ```

    ```c

    printf("Hello, World! \\n");

    return 0;

    ```

    ```


    # ## Comments


    Comments are like helping text in your C program and they are ignored by the compiler.
    They start with /* and terminate with the characters */ as shown below:


    ```

    ```c

    /* my first program in C */

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'You cannot have comments within comments and they do not occur within a string
    or character literals.




    A C identifier is a name used to identify a variable, function, or any other user-
    defined item. An identifier starts with a letter A to Z, a to z, or an underscore
    ''_'' followed by zero or more letters, underscores, and digits (0 to 9).


    C does not allow punctuation characters such as @, $, and % within identifiers.
    C is a **case-sensitive** programming language. Thus, _Manpower_ and _manpower_
    are two different identifiers in C. Here are some examples of acceptable identifiers:


    \begin{tabular}{ccccc}

    mohd & zara & abc & move_name & a_123 \\

    myname50 & _temp & j & a23b9 & retVal \\

    \end{tabular}




    The following list shows the reserved words in C. These reserved words may not
    be used as constants or variables or any other identifier names.


    \begin{tabular}{cccc}

    auto & else & long & switch \\

    break & enum & register & typedef \\

    case & extern & return & union \\

    char & float & short & unsigned \\

    const & for & signed & void \\

    continue & goto & sizeof & volatile \\

    default & if & static & while \\

    do & int & struct & _Packed \\

    double & & & \\

    \end{tabular}


    ![](img/6e49c39a6ef9e32d938b03dc613e44f6_17_0.png)'
