  md: "# 28. VARIABLE ARGUMENTS\n\nSometimes, you may come across a situation, when\
    \ you want to have a function, which can take variable number of arguments, i.e.,\
    \ parameters, instead of predefined number of parameters. The C programming language\
    \ provides a solution for this situation and you are allowed to define a function\
    \ which can accept variable number of parameters based on your requirement. The\
    \ following example shows the definition of such a function.\n\n```\n```c\nint\
    \ func(int, ...)\n{\n    .\n    .\n    .\n}\n\nint main()\n{\n    func(1, 2, 3);\n\
    \    func(1, 2, 3, 4);\n}\n```\n```\n\nIt should be noted that the function **func()**\
    \ has its last argument as ellipses, i.e., three dots (**...**) and the one just\
    \ before the ellipses is always an **int** which will represent the total number\
    \ variable arguments passed. To use such functionality, you need to make use of\
    \ **stdarg.h** header file which provides the functions and macros to implement\
    \ the functionality of variable arguments and follow the given steps:\n\n+   1.\
    \ Define a function with its last parameter as ellipses and the one just before\
    \ the ellipses is always an **int** which will represent the number of arguments.\n\
    +   2. Create a **va_list** type variable in the function definition. This type\
    \ is defined in stdarg.h header file.\n+   3. Use **int** parameter and **va_start**\
    \ macro to initialize the **va_list** variable to an argument list. The macro\
    \ va_start is defined in stdarg.h header file.\n+   4. Use **va_arg** macro and\
    \ **va_list** variable to access each item in argument list."
  merge: -1
  img_proc: true
- pgno: 176
  md: "5. Use a macro va_end to clean up the memory assigned to va_list variable.\n\
    \nNow let us follow the above steps and write down a simple function which can\
    \ take the variable number of parameters and return their average:\n\n```\n#include\
    \ <stdio.h>\n#include <stdarg.h>\n\ndouble average(int num, ...)\n{\n    va_list\
    \ valist;\n    double sum = 0.0;\n    int i;\n\n    /* initialize valist for num\
    \ number of arguments */\n    va_start(valist, num);\n\n    /* access all the\
    \ arguments assigned to valist */\n    for (i = 0; i < num; i++)\n    {\n    sum\
    \ += va_arg(valist, int);\n    }\n\n    /* clean memory reserved for valist */\n\
    \    va_end(valist);\n\n    return sum/num;\n}\n\nint main()\n{\n    printf(\"\
    Average of 2, 3, 4, 5 = %f\\n\", average(4, 2,3,4,5));\n    printf(\"Average of\
    \ 5, 10, 15 = %f\\n\", average(3, 5,10,15));\n}\n```"
