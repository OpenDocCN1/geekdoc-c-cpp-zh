    # Closing a File


    To close a file, use the fclose( ) function. The prototype of this function is:


    ```

    ```c

    int fclose( FILE *fp );

    ```

    ```


    The **fclose()** function returns zero on success, or **EOF** if there is an error
    in closing the file. This function actually flushes any data still pending in
    the buffer to the file, closes the file, and releases any memory used for the
    file. The EOF is a constant defined in the header file **stdio.h**.


    There are various functions provided by C standard library to read and write a
    file, character by character, or in the form of a fixed length string.


    # Writing a File


    Following is the simplest function to write individual characters to a stream:


    ```

    ```c

    int fputc( int c, FILE *fp );

    ```

    ```


    The function **fputc()** writes the character value of the argument c to the output
    stream referenced by fp. It returns the written character written on success otherwise
    **EOF** if there is an error. You can use the following functions to write a null-terminated
    string to a stream:


    ```

    ```c

    int fputs( const char *s, FILE *fp );

