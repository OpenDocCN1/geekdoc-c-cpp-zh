  md: "# # 18. UNIONS\n\nA **union** is a special data type available in C that allows\
    \ to store different data types in the same memory location. You can define a\
    \ union with many members, but only one member can contain a value at any given\
    \ time. Unions provide an efficient way of using the same memory location for\
    \ multiple purpose.\n\n# ## Defining a Union\n\nTo define a union, you must use\
    \ the **union** statement in the same way as you did while defining a structure.\
    \ The union statement defines a new data type with more than one member for your\
    \ program. The format of the union statement is as follows:\n\n```\nunion [union\
    \ tag]\n{\n    member definition;\n    member definition;\n    ...\n    member\
    \ definition;\n} [one or more union variables];\n```\n\nThe **union tag** is optional\
    \ and each member definition is a normal variable definition, such as int i; or\
    \ float f; or any other valid variable definition. At the end of the union's definition,\
    \ before the final semicolon, you can specify one or more union variables, but\
    \ it is optional. Here is the way you would define a union type named Data having\
    \ three members i, f, and str:\n\n```\nunion Data\n{\n    int i;\n    float f;\n\
    \    char str[20];\n} data;\n```\n\nNow, a variable of **Data** type can store\
    \ an integer, a floating-point number, or a string of characters. It means a single\
    \ variable, i.e., same memory location, can"
  merge: -1
  img_proc: true
- pgno: 137
  md: "be used to store multiple types of data. You can use any built-in or user-defined\
    \ data types inside a union based on your requirement.\n\nThe memory occupied\
    \ by a union will be large enough to hold the largest member of the union. For\
    \ example, in the above example, Data type will occupy 20 bytes of memory space\
    \ because this is the maximum space which can be occupied by a character string.\
    \ The following example displays the total memory size occupied by the above union:\n\
    \n```\n#include <stdio.h>\n#include <string.h>\n\nunion Data\n{\n    int i;\n\
    \    float f;\n    char str[20];\n};\n\nint main( )\n{\n    union Data data;\n\
    \n    printf(\"Memory size occupied by data : %d\\n\", sizeof(data));\n\n    return\
    \ 0;\n}\n```\n\nWhen the above code is compiled and executed, it produces the\
    \ following result:\n\n```\nMemory size occupied by data : 20\n```\n\n# Accessing\
