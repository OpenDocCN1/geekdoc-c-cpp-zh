  md: "# 27. RECURSION\n\nRecursion is the process of repeating items in a self-similar\
    \ way. In programming languages, if a program allows you to call a function inside\
    \ the same function, then it is called a recursive call of the function.\n\n```\n\
    ```\nvoid recursion()\n{\n    recursion();    /\\* function calls itself */\n\
    }\n\nint main()\n{\n    recursion();\n}\n```\n```\n\nThe C programming language\
    \ supports recursion, i.e., a function to call itself. But while using recursion,\
    \ programmers need to be careful to define an exit condition from the function,\
    \ otherwise it will go into an infinite loop.\n\nRecursive functions are very\
    \ useful to solve many mathematical problems, such as calculating the factorial\
    \ of a number, generating Fibonacci series, etc.\n\n\n\nThe following example\
    \ calculates the factorial of a given number using a recursive function:\n\n```\n\
    ```\n#include <stdio.h>\n\nint factorial(unsigned int i)\n{\n    if(i <= 1)\n\
    \    {\n        return 1;\n    }\n    return i * factorial(i - 1);\n}\n```\n```\n\
