  md: "# 30. COMMAND LINE ARGUMENTS\n\nIt is possible to pass some values from the\
    \ command line to your C programs when they are executed. These values are called\
    \ command line arguments and many times they are important for your program especially\
    \ when you want to control your program from outside instead of hard coding those\
    \ values inside the code.\n\nThe command line arguments are handled using main()\
    \ function arguments where argc refers to the number of arguments passed, and\
    \ argv[] is a pointer array which points to each argument passed to the program.\
    \ Following is a simple example which checks if there is any argument supplied\
    \ from the command line and take action accordingly:\n\n```\n#include <stdio.h>\n\
    \nint main( int argc, char *argv[] )\n{\n    if( argc == 2 )\n    {\n    printf(\"\
    The argument supplied is %s\\n\", argv[1]);\n    }\n    else if( argc > 2 )\n\
    \    {\n    printf(\"Too many arguments supplied.\\n\");\n    }\n    else\n  \
    \  {\n    printf(\"One argument expected.\\n\");\n    }\n}\n```\n\nWhen the above\
    \ code is compiled and executed with a single argument, it produces the following\
    \ result.\n\n```\n$./a.out testing\nThe argument supplied is testing\n```\n\n\
    ![](img/6e49c39a6ef9e32d938b03dc613e44f6_182_0.png)"
