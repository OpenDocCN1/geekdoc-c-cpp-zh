    Figure 7.2. A SNON move, changing the spanned node \(v_3 \in V_3\) with another
    node belonging to the same cluster.


    # 7.3.2 Node Re-Arrangement Neighborhood (NRAN)


    The node rearrangement neighborhood consists of all solutions that differ from
    a current solution by exchanging exactly two nodes. This situation is illustrated
    in the next figure.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_192_1.png)


    Figure 7.3. A NRAN move, swapping the nodes \(v_1\) and \(v_2\).


    # 7.3.3 Edge Augmentation Neighborhood


    The edge augmentation neighborhood mainly considers modifications on the edges
    and consists of all solutions that differ from a current solution by adding a
    new edge and removing other edges that now are redundant. Such a move within this
    neighborhood is presented in the next figure.'
  merge: -1
