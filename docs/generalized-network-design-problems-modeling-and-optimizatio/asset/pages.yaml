  md: "This idea is expressed in our algorithm by allowing the value of the parameter\
    \ \\( q_0 \\) from formula (3.25) to vary in a given range, at each construction\
    \ step:\n\n\\( q_0 = \\begin{cases} q_{\\min} + s \\cdot \\frac{q_{\\max}-q_{\\\
    min}}{s_{\\max}} & \\text{if } s < s_{\\max} \\\\ q_{\\max} & \\text{otherwise}\
    \ \\end{cases}, \\quad (3.28) \\)\n\nwhere \\( s \\) is the strength of the recommended\
    \ arc and \\( q_{\\min} \\), \\( q_{\\max} \\) and \\( s_{\\max} \\) are constant\
    \ parameters. The use of confidence somehow compensates for the absence of a heuristic\
    \ during the solution construction phase.\n\n# Local search\n\nThe global tours\
    \ built during the strategy construction and solution construction phases are\
    \ improved by using a local search procedure of which a generic description is\
    \ given in Algorithm 3.10.\n\n# Algorithm 3.10 (The local search procedure).\n\
    \n```\nprocedure applyLocalSearch(H_G)\n  H <- clusterOptimization(H_G)\n  foreach\
    \ H'_G \\in tourNeighborhood(H_G) do\n    if quickCheck(H'_G) then\n      H' <-\
    \ partialClusterOptimization(H'_G, H_G)\n      if cost(H') < cost(H) then\n  \
    \      H_G <- H'\n        H <- H'\n      end if\n    end if\n  end foreach\nend\
    \ procedure\n```\n\n\\( H_G \\) and \\( H'_G \\) denote global Hamiltonian tours,\
    \ that is, tours in the graph of clusters, while \\( H \\) and \\( H' \\) denote\
    \ generalized Hamiltonian tours. Our algorithm can be combined with any local\
    \ search procedure that conforms to the above algorithmic structure. The working\
    \ of the \\( clusterOptimization \\) function (line 2) was explained in Section\
    \ 3.2.\n\nThe \\( cost \\) function in line 6 computes the cost of a generalized\
    \ Hamiltonian tour. The other functions referred in Algorithm 3.10 are only specified\
    \ in generic form and they must be implemented by each concrete instantiation\
    \ of the local search procedure.\n\nThe \\( tourNeighborhood \\) function (line\
    \ 3) should return a set of global tours that represent the neighborhood of the\
    \ global tour \\( H_G \\) provided as its argument. The \\( quickCheck \\) function\
    \ (line 4) is intended to speed up the local search by quickly rejecting a candidate\
    \ global tour from the partial cluster optimization, if this tour is not likely\
    \ to lead to an improvement."
