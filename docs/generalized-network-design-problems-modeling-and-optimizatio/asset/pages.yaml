  md: 'The partialClusterOptimization function (line 5) starts with the generalized
    tour obtained by traversing the nodes of H in accordance with the ordering of
    clusters in the global tour H''_G. Then, it reallocates some vertices in the resulting
    generalized tour, and tries to improve its cost. Typically, this function considers
    only a limited number of vertices for reallocation and it usually has a lower
    complexity than the clusterOptimization function.


    The generalized tour constructed by the function partialClusterOptimization is
    accepted only if its cost is better than the cost of the current generalized tour
    (lines 6–9).


    We provide two instantiations of the generic local search procedure shown in Algorithm
    3.10: one based on a 2-opt local search and one based on a 3-opt local search.
    We describe here only the 2-opt based variant. Except for the fact that it considers
    exchanges between 3 arcs, the 3-opt based local search is very similar to the
    2-opt based variant.


    In the 2-opt based local search, the tourNeighborhood function returns a set of
    global tours obtained by replacing a pair of arcs (C_a, C_β) and (C_γ, C_δ) in
    the original global tour with the pair of arcs (C_a, C_γ) and (C_β, C_δ). In order
    to reduce the number of exchanges that must be taken into consideration, the set
    returned by our tourNeighborhood function includes only tours for which γ is in
    the candidate list of α. In other words, a pair of arcs is considered for exchange,
    only if the center of mass of the cluster γ is close to the center of mass of
    the cluster α.


    The partialClusterOptimization function used in this case is similar to the RP1
    procedure introduced in [43]. Let (C_a, C_β) and (C_γ, C_δ) be the two arcs from
    the original global tour H_G that have been replaced with (C_a, C_γ) and (C_γ,
    C_δ) in the neighboring global tour H''_G, as shown in Figure 3.5:


    The vertices in clusters C_α, C_β, C_γ and C_δ can then be reallocated, in order
    to minimize the cost of the generalized tour. For this purpose, we have to determine
    the two node pairs (a'', w'') and (v'', z'') such that:


    d_{a''w''} + d_{w''w} + d_{w''h} = min{d_{ia} + d_{ab} + d_{bh} | a ∈ C_α, b ∈
    C_γ}

    d_{jv''} + d_{v''z''} + d_{z''k} = min{d_{ja} + d_{ab} + d_{bk} | a ∈ C_β, b ∈
    C_δ} (3.29)


    This computation requires |C_α||C_γ| + |C_β||C_δ| comparisons. In order to speed
    up the local search, we first perform a quick rejection test. We compute the quantities
    from formula (3.29), only if the following inequality holds:


    d_{min}(C_ρ, C_α) + d_{min}(C_α, C_γ) + d_{min}(C_γ, C_α) + d_{min}(C_α, C_β)
    +

    d_{min}(C_β, C_δ) + d_{min}(C_δ, C_τ) < d_{iw} + d_{wv} + d_{vj} + d_{hw} + d_{wz}
    + d_{zk} (3.30)


    where d_{min}(C_α, C_β) is the minimum distance between each pair of vertices
    from clusters C_α and C_β. These minimum distances are computed only once, when
    starting the algorithm.'
