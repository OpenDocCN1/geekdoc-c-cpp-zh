- pgno: 11
  md: "# Chapter 1\n\n# Introduction\n\n# 1.1 Combinatorial optimization and integer\
    \ programming\n\nCombinatorial optimization is a lively field of applied mathematics,\
    \ combining techniques from combinatorics, linear programming, and the theory\
    \ of computation, to solve optimization problems over discrete structures. One\
    \ of the main challenges of combinatorial optimization is to develop efficient\
    \ algorithms, with their corresponding running times bounded by a polynomial of\
    \ the same size as their representation.\n\nThe study of combinatorial optimization\
    \ owes its existence partially to the advent of modern digital computers. Most\
    \ currently accepted methods for solving combinatorial optimization problems would\
    \ hardly have been taken seriously 30 years ago, for the simple reason that no\
    \ one could have carried out the computations involved. Moreover, the existence\
    \ of digital computers has also led to a multitude of technical problems of a\
    \ combinatorial character. Our ability to solve large, important combinatorial\
    \ optimization problems has improved dramatically in the past decades. The availability\
    \ of reliable software, extremely fast and inexpensive hardware, and high-level\
    \ languages that make the modeling of complex problems much faster, have led to\
    \ a much greater demand for optimization tools.\n\nThe versatility of the combinatorial\
    \ optimization model stems from the fact that in many practical problems, activities\
    \ and resources such as machines, airplanes and people are indivisible. Also,\
    \ many problems (e.g. scheduling) have rules that define a finite number of allowable\
    \ choices and consequently can be formulated appropriately using procedures that\
    \ transform the logical alternatives descriptions to linear constraint descriptions\
    \ where some subset of the variables is required to take on values.\n\nCombinatorial\
    \ optimization models are often referred to as integer programming models, where\
    \ some or all of the variables are required to take on discrete values. In most\
    \ cases, these values are integers giving rise to the name of this class of models.\
    \ In this book we consider combinatorial optimization problems for which the objective\
    \ function and the constraints are linear and the variables are integers. These\
    \ problems are called integer programming problems:\n\n```\nmin c^T x\n(IP) s.t.\
    \ Ax <= b,\n    x \\in Z^n_+ ,\n```"
  merge: -1
  img_proc: true
- pgno: 12
  md: 'where $\mathbb{Z}^n$ is the set of integral $n$-dimensional vectors, $x = (x_1,
    \dots, x_n)$ is an integer $n$-vector and $c$ is an $n$-vector. Furthermore, we
    let $m$ denote the number of inequality constraints, $A$ an $m \times n$ matrix
    and $b$ an $m$-vector. If we allow some variables $x_i$ to be real numbers instead
    of integers, i.e., $x_i \in \mathbb{R}$ instead of $x_i \in \mathbb{Z}$, we obtain
    a *mixed integer programming problem*, denoted by (MIP). For convenience, we discuss
    integer linear programs that are *minimization* problems with *binary* variables,
    i.e., the integer variables are restricted to the values 0 or 1.


    Solving integer programming problems can be a difficult task. The difficulty arises
    from the fact that, unlike linear programming, where the feasible region is a
    convex set, in integer problems one must search a lattice of feasible points or,
    in the mixed integer case, a set of disjoint half lines or line segments, to find
    an optimal solution. Therefore, unlike linear programming where, due to the convexity
    of the problem, we can exploit the fact that any local solution is a global optimum,
    integer programming problems may have many "local optima", and finding a global
    optimum to the problem requires one to prove that a particular solution dominates
    all feasible points, by arguments other than the calculus-based derivative approaches
    of convex programming.


    When optimizing combinatorial problems, there is always a trade-off between the
    computational effort (and hence the running time of the algorithm) and the quality
    of the obtained solution. We may either try to solve the optimization problem
    with an *exact algorithm*, or choose an *approximation* or *heuristic algorithm*,
    which uses less running time but does not guarantee optimality of the solution.


    Therefore, there are three main categories of algorithms for solving integer programming
    problems:


    +   • **Exact algorithms**, are guaranteed to find the optimal solution, but may
    take an exponential number of iterations. In practice, they are typically applicable
    to small instances only, due to long running times caused by the high complexity.
    They include: branch-and-bound, branch-and-cut, cutting plane, and dynamic programming
    algorithms.


    +   • **Approximation algorithms** provide a sub-optimal solution in polynomial
    time, together with a bounding constraint on the degree of suboptimality.


    +   • **Heuristic algorithms** provide a suboptimal solution, but makes no guarantees
    about its quality. Although the running time is not guaranteed to be polynomial,
    empirical evidence suggests that some of these algorithms rapidly find a good
    solution. These algorithms are especially suitable for large instances of the
    optimization problems.


    Because, as we have seen, there are general techniques for dealing with integer
    programming, it is usually better to take advantage of the structure of the specific
    integer programming problems and to develop special-purpose approaches to take
    advantage of this particular structure.'
  merge: -1
