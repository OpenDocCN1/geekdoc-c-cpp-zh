    is NP-hard. Integer programming formulations for the L-GMSTP have been presented
    by Pop et al. [149].


    # ## 2.1 Definition and complexity of the GMSTP


    The generalized minimum spanning tree problem (GMSTP) requires finding a minimum-cost
    tree T, spanning a subset of nodes, which includes exactly one node from each
    cluster Vi, i ∈ {1, ..., m}. We will call such a tree a generalized spanning tree.
    In the next figure, we present an example of a generalized spanning tree.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_20_0.png)


    Figure 2.1. An example of a generalized spanning tree.


    Myung et al. [128] proved that the GMSTP is an NP-hard problem by reducing the
    vertex cover problem.


    Garey and Johnson [45] have shown that, for certain combinatorial optimization
    problems, the simple structure of trees can offer algorithmic advantages for efficient
    solution. Indeed, a number of problems that are NP-complete, when formulated on
    a general graph, become polynomially solvable when the graph is a tree. Unfortunately,
    this is not the case for the GMSTP. We will prove a stronger result concerning
    the complexity of the problem, namely that the GMSTP even defined on trees is
    NP-hard.


    To show that the GMSTP on trees is NP-hard we introduce the so-called set cover
    problem which is known to be NP-complete (see [45]).


    Given a finite set X = {x1, ..., xa}, a collection of subsets, S1, ..., Sb ⊆ X
    and an integer k < |X|, the set cover problem consists in determining whether
    there exists a subset Y ⊆ X, such that |Y| ≤ k and


    $S_c \cap Y \neq \emptyset, \quad \forall c \text{ with } 1 \le c \le b.$


    We call such a set Y a set cover for X.'
