    Flows from cluster \( V_p \) to the cluster \( V_r \) are defined by \( w_{pr}
    \). Thus, \( w_{pr} \) must be equal to the sum of \( x_{ij} \) ''s from \( V_p
    \) to \( V_r \). Hence, we write:


    \( w_{pr} = \sum_{i \in V_p} \sum_{j \in V_r} x_{ij} \quad (5.6)\)


    With the above definitions and constraints, a general integer programming formulation
    for the GVRP may be given as:


    minimize \(\sum_{i=1}^n \sum_{i=1}^n x_{ij}\)

    subject to (5.1)–(5.6)

    Capacity bounding constraints (5.7)

    Subtour elimination constraints (5.8)

    \( x_{ij} \in \{0, 1\}, \forall (i, j) \in A. \)


    Note that \( w_{pr} \) will automatically be 0 or 1 due to the degree constraints
    given by (5.1), (5.2), (5.3) and (5.4). Therefore we do not need to impose integrality
