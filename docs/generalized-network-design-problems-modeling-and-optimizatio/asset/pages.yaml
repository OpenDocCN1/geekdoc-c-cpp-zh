    # ## 2.4 Approximation results for the GMSTP


    Throughout this section, we will discriminate between so-called *positive results*,
    which establish the existence of some approximation algorithms, and so-called
    *negative results* which disprove the existence of good approximating results
    for some combinatorial optimization problems, under the assumption that $\mathcal{P}
    \neq \mathcal{NP}$.


    We start with some basic results of approximation theory that follow the descriptions
    of Goemans [57] and Schuurman and Woeginger [183].'
