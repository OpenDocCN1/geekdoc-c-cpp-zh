  md: '# Decision Variables:


    We define the following binary variables:


    ```

    $x_{ij} = \begin{cases} 1 & \text{if the arc } (i, j) \in A \text{ is included
    in the tour of a vehicle} \\ & i \in V_p, j \in V_r, p, r \in C \\ 0 & \text{otherwise}
    \end{cases}$

    ```


    ```

    $w_{pr} = \begin{cases} 1 & \text{if there is a path from cluster } V_p \text{
    to cluster } V_r, p, r \in C \\ 0 & \text{otherwise} \end{cases}$

    ```


    # Parameters:


    $c_{ij}$ is the cost of traveling from node $i$ to node $j, i \neq j, i \in V_p,
    j \in V_r, p \neq r, p, r \in C$;

    $d_i$ is the demand of customer $i, i = 1, 2, ..., n$;

    $q_r$ is the demand of the cluster $V_r. q_r = \sum_{i \in V_r} d_i, r \in C$;

    $K = \{1, ..., s\}$ is the set of the uniform vehicles (tours);

    $Q$ is the capacity of each vehicle.


    Throughout this paper, we assume that $m \ge s$.


    Constraints to the problem, are given below, under the corresponding header:


    # Cluster Degree Constraints


    For each cluster, excluding $V_0$, there can be only a single outgoing arc to
    any other node belonging to other clusters. This condition is implied by the following
    constraints:


    ```

    \(\sum_{i \in V_p} \sum_{j \in V \backslash V_p} x_{ij} = 1, \quad p \neq 0, \quad
    p \in C \quad (5.1)\)

    ```


    There can be only a single incoming arc to a cluster from any other node belonging
    to other clusters, excluding $V_0$. This condition is implied by the following
    constraints:


    ```

    \(\sum_{i \in V \backslash V_p} \sum_{j \in V_p} x_{ij} = 1, \quad p \neq 0, \quad
    p \in C \quad (5.2)\)

    ```'
