    # 6.5 Notes


    The GFCNDP consists of finding the cheapest backbone mesh network that interconnects
    one hub from a given number of clusters. This problem is an important subproblem
    when constructing hierarchical telecommunication networks and was introduced by
    Thomadsen and Stidsen [200].


    In this chapter the following results have been presented:


    +   two novel formulations of the GFCNDP based on integer programming: a directed
    multicommodity flow model from which we obtained a closely related formulation
    called the bidirectional flow formulation described by Thomadsen and Stidsen [200]
    and the local-global model;


    +   two approaches for solving the GFCND problem: a branch-cut-and-price algorithm,
    proposed by Thomadsen and Stidsen [200], and a solution procedure, based on the
    local-global formulation of the problem developed by Pop and Pop Sitar [169].


    The material presented in this chapter is based on the results published by Pop
    and Pop Sitar [169], and Thomadsen and Stidsen [200].


    Further work may be directed towards the design of exact methods and metaheuristic
    algorithms for solving the GFCND problem.'
