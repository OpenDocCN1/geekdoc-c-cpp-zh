- pgno: 13
  md: 'As integer programming is NP-hard, every NP problem can, in principle, be formulated
    as an integer linear program. In fact, such problems usually admit different integer
    programming formulations. Finding a particularly suitable one is often a decisive
    step towards providing a solution of a combinatorial optimization problem.


    Therefore, it is important to become familiar with a wide variety of different
    classes of integer programming formulations. Since there are often different ways
    of mathematically representing the same problem and since obtaining an optimal
    solution to a large integer programming problem, within a reasonable amount of
    computing time, may well depend on the way it is formulated, much recent research
    has been directed toward reformulation of combinatorial optimization problems.
    In this regard, it is sometimes advantageous to increase (rather than decrease)
    the number of integer variables, the number of constraints, or both.


    When we discuss the notion of a “good” formulation, we normally think about creating
    an easier problem, that provides a good approximation of the objective function
    value of the original problem. Since the integrality restrictions on the decision
    variables destroy the convexity of the feasible region, the most widely used approximation
    removes this restriction. Such an approximation is known as the Linear Programming
    (LP) relaxation. However, merely removing these integrality restrictions can alter
    the structure so significantly, that the optimal LP solution is generally far
    from the optimal integer solution.


    # 1.2 Complexity theory


    The first step in studying a combinatorial problem is to find out whether the
    problem is “easy” or “hard”. This classification is a task of complexity theory.
    In this section, we summarize the most important concepts in complexity theory.
    Most approaches are taken from the book of Grötschel, Lovász and Schrijver [60].


    An algorithm is a list of instructions that solves every instance of a problem
    in a finite number of steps. (This also means that the algorithm detects if a
    particular instance of a problem has no solution.)


    The size of a problem is the amount of information needed to represent the instance.
    The instance is assumed to be described (encoded) by a string of symbols. Therefore,
    the size of an instance equals the number of symbols in the string.


    The running time of a combinatorial optimization algorithm is measured by an upper
    bound on the number of elementary arithmetic operations (addition, subtraction,
    multiplication, division and comparison) necessary for any valid input, expressed
    as a function of the input size. The input is the data used to represent an instance
    of a problem. If the input size is measured by s, then the running time of the
    algorithm is expressed as O(f(s)), if there are constants b and s0 such that the
    number of steps, for any instance with s >= s0, is bounded from above by bf(s).
    We say that the running time of such an algorithm is of order f(s).'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'An algorithm is said to be a *polynomial time algorithm* when its running time
    is bounded by a polynomial function, f(s). An algorithm is said to be an *exponential
    time algorithm* when its running time is bounded by an exponential function (e.g.,
    O(2^(s))).


    Complexity theory concerns, in the first place, decision problems. A *decision
    problem* is a question that can be answered only with "yes" or "no". For example,
    in the case of the integer programming problem (IP), the decision problem is:


    > Given an instance of (IP) and an integer L, does a feasible solution x exist,
    such that c^T x <= L?


    For a combinatorial optimization problem we have the following: if one can solve
    the decision problem efficiently, then one can also solve the corresponding optimization
    problem efficiently.


    Decision problems solvable in polynomial time are considered to be "easy" and
    the class of these problems is denoted by P. P includes, for example, linear programming
    and the minimum spanning tree problem.


    The class of decision problems, solvable in exponential, time is denoted by EXP.
    Most combinatorial optimization problems belong to this class. If a problem is
    in EXP \ P, solving large size instances of this problem will be difficult. To
    distinguish between "easy" and "hard" problems we first describe a class that
    contains P.


    The complexity class NP is defined as the class of decision problems that are
    solvable by a so-called non-deterministic algorithm. A decision problem is said
    to be in NP if, for any input that results in a positive answer, there is a certificate
    from which the correctness of this answer can be derived in polynomial time.


    Obviously, P subseteq NP holds. It is widely assumed that P = NP is very unlikely.
    The class NP contains a subclass of problems that are considered to be the hardest
    problems in NP. These problems are called NP-complete problems. Before giving
    the definition of an NP-complete decision problem, we explain the technique of
    polynomially transforming one problem into another. Let Pi_1 and Pi_2 be two decision
    problems.


    **Definition 1.1.** A *polynomial transformation* is an algorithm A that, for
    every instance sigma_1 of Pi_1, produces an instance sigma_2 of Pi_2 in polynomial
    time, such that the following holds: for every instance sigma_1 of Pi_1, the answer
    to sigma_1 is "yes" if and only if the answer to sigma_2 of Pi_2 is "yes".


    **Definition 1.2.** A decision problem Pi is called NP-*complete* if Pi is in
    NP and every other NP decision problem can be polynomially transformed into Pi.


    Clearly, if an NP-*complete* problem can be solved in polynomial time, then all
    problems in NP can be solved in polynomial time, hence P = NP. This explains why
    the NP-complete problems are considered the hardest problems in NP.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Note that polynomial transformability is a transitive relation, i.e if \(\Pi_1\)
    is polynomially transformable to \(\Pi_2\) and \(\Pi_2\) is polynomially transformable
    to \(\Pi_1\), then \(\Pi_1\) is polynomially transformable to \(\Pi_3\). Therefore,
    if we want to prove that a decision problem \(\Pi\) is \(\mathcal{NP}\)-complete,
    we only have to show that


    +   (i) \(\Pi\) is in \(\mathcal{NP}\).


    +   (ii) A decision problem already known to be \(\mathcal{NP}\)-complete can
    be polynomially transformed to \(\Pi\).


    We now want to focus on combinatorial optimization problems. We therefore extend
    the concept of polynomial transformability. Let \(\Pi_1\) and \(\Pi_2\) be two
    problems (not necessarily decision problems).


    **Definition 1.3.** A **polynomial reduction** from \(\Pi_1\) to \(\Pi_2\) is
    an algorithm \(\mathcal{A}_1\) that solves \(\Pi_1\) by using an algorithm \(\mathcal{A}_2\)
    for \(\Pi_2\) as a subroutine such that, if \(\mathcal{A}_2\) were a polynomial
    time algorithm for \(\Pi_2\), then \(\mathcal{A}_1\) would be a polynomial time
    algorithm for \(\Pi_1\).


    **Definition 1.4.** An optimization problem \(\Pi\) is called \(\mathcal{NP}\)-**hard**
    if there exists an \(\mathcal{NP}\)-**complete** decision problem that can be
    polynomially reduced to \(\Pi\).


    Clearly, an optimization problem is \(\mathcal{NP}\)-**hard**, if the corresponding
    decision problem is \(\mathcal{NP}\)-**complete**.


    # 1.3 Heuristic and relaxation methods


    As we have seen, once it is established that a combinatorial problem is \(\mathcal{NP}\)-**hard**,
    it is unlikely that it can be solved by a polynomial algorithm. Different approaches
    have been suggested in the past, to solve this kind of problems. In principle,
    they can be classified as exact algorithms, approximation algorithms, relaxation
    methods, or heuristic approaches.


    When trying to find good solutions to hard minimization problems in combinatorial
    optimization, two issues must be taken into consideration:


    +   calculating an upper bound that is as close as possible to the optimum;


    +   calculating a lower bound that is as close as possible to the optimum.


    It is a fundamental goal of computer science to find algorithms which have both
    provably good running times and provably good or optimal quality of the solution.


    A heuristic is an algorithm that abandons one aspect, e.g. it usually finds pretty
    good solutions, but there is no proof that the solutions may not become arbitrarily
    bad. On the other hand, the algorithm may run reasonably quickly, but there is
    no'
