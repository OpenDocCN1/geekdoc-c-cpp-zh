  md: '# Chapter 4


    # The Railway Traveling Salesman Problem (RTSP)


    In this chapter, we consider a problem of central interest in railway optimization
    called the Railway Traveling Salesman Problem (RTSP). This problem is a practical
    extension of the classical traveling salesman problem, which considers a railway
    network and train schedules, and was introduced by Hadjicharalambous et al. [67].


    In addition, we present a variant of the RTSP called the dynamic RTSP, where we
    assume that the distances between cities are interpreted as travel times and are
    no longer fixed. In real life we are faced with this problem, when delays may
    be introduced, due to maintenance work, accidents, etc., which leads to possibly
    varying travel times.


    # 4.1 Definition of the RTSP


    We assume that we are given a set of stations, a timetable with trains connecting
    these stations, an initial station, a subset B of the stations and a starting
    time. A salesman wants to travel from the initial station, starting no earlier
    than the designated time, to every station in B and finally returns to the initial
    station, subject to the constraint that he/she spends the necessary amount of
    time in each station in B, to carry out his/her business. The goal is to find
    a set of train connections such that the overall time of the journey is minimized.
    This problem is called the Railway Traveling Salesman Problem and was introduced
    by Hadjicharalambous et al. [67].


    The RTSP is related to the Generalized Traveling Salesman Problem (GTSP), in which
    a clustered graph is given and a round trip of minimal length, connecting exactly
    one node per cluster, is desired. By virtue of the TSP, the GTSP is an NP-hard
    problem. It can be easily seen, that the TSP is also polynomially time reducible
    to the RTSP. For each pair of cities, to which there exists a connection, consider
    a train leaving from the first one to the second with a travel time equal to the
    cost of the corresponding connection in the TSP. This reduction puts the RTSP
    in the class of NP-hard problems.


    Consider the so-called time-expanded digraph G, introduced by Schulz et al. [182],
    constructed from the timetable information. In that graph, there is a node for
    every event (departure or arrival) at a station, and edges between nodes represent
    either elementary connections between the two events (i.e., served by a non-stop
    train), or waiting time at a station. The weight of an edge is the time difference
    between the time events associated with its endpoints. Now, roughly speaking,
    and considering each set of nodes belonging to a specific station as a node cluster,
    the RTSP reduces'
  merge: -1
  img_proc: true
- pgno: 111
  md: "by finding a minimum-weight tour that starts at a specific node of a specific\
    \ cluster, visits at least one node of each cluster in B, and ends at a node of\
    \ the initial cluster. Despite their superficial similarity, the RTSP differs\
    \ from the GTSP in at least three aspects:\n\n+   1. The GTSP is typically solved\
    \ by transforming it to an instance of the TSP. The transformation is done by\
    \ modifying the weights, such that inter-cluster edges are \"penalized\" by adding\
    \ a large weight to them. Consequently the tour has to visit all nodes within\
    \ a cluster before moving to the next one.\n+   \n+   2. The RTSP starts from\
    \ a specific node in a specific cluster, whereas the GTSP starts from any node\
    \ within any cluster.\n+   \n+   3. The GTSP requires visiting all clusters, whereas\
    \ the RTSP requires visiting only a subset of them.\n\n# 4.2 Preliminaries\n\n\
    In this section, we describe the input of an RTSP instance, provide some definitions\
    \ and present the time-expanded graph.\n\nIn the following, we assume timetable\
    \ information in a railway system, but the modeling and solution approaches that\
    \ will be described can be applied to any other public transportation system,\
    \ provided that it has the same characteristics.\n\nA timetable consists of data\
    \ concerning: stations (or bus stops, ports, etc.), trains (or buses, ferries,\
    \ etc), connecting stations, and departure and arrival times of trains at stations.\
    \ More formally, we are given a set of trains Z, a set of stations S and a set\
    \ of elementary connections C whose elements are 5-tuples of the form (z, o1,\
    \ o2, td, ta). Such a tuple (elementary connection) is interpreted as train z\
    \ leaving station o1 at time td and the immediately nearest stop of train z is\
