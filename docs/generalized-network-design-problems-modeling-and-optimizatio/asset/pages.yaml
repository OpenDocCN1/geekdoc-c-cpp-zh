    A feasible solution to the 2-GTSP may be seen as a cycle free subgraph with $2m
    - 1$ edges, connecting all clusters, such that exactly two nodes from each cluster
    are selected .


    Therefore, the 2-GTSP can be formulated as the following 0-1 integer programming
    problem:


    ```

    min \sum_{e \in E} c_e x_e.

    s.t. z(V_k) = 2, \quad \forall k \in \{1, ..., m\}, (4.9)

    x(\delta(i)) = 2z_i, \quad \forall i \in V \\ V_1, (4.10)

    x(E) = 2m - 1, (4.11)

    x(V_k, V_k) = 1, \quad \forall k \in \{2, ..., m\}, (4.12)

    x(E(S)) \le 2r - 1, \quad \forall S = \cup_{j=1}^r V_j, 2 \le r \le m - 1, (4.13)

    x_e \in \{0, 1\}, \quad \forall e \in E,

    z_i \in \{0, 1\}, \quad \forall i \in V.

    ```


    In the above formulation, constraint (4.9) guarantees that we select exactly two
    nodes from every cluster. The constraints (4.10) require the number of edges incident
    with a node $i$ to be either 2 (if node $i$ is visited) or 0 (otherwise). Constraint
    (4.11) guarantees that the selected subgraph has $2m - 1$ edges, constraints (4.12)
    guarantee that we select one edge from each cluster (except the starting cluster).
    Finally, the constraints (4.13) eliminate all cycles connecting at most $m - 1$
    clusters.'
