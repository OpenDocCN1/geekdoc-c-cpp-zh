    # ## 4.3.2 A cutting plane approach for the RTSP


    On the basis of the time-expanded graph, we can see that the RTSP reduces to finding
    a Hamiltonian tour H of minimum cost in the subgraph of G, induced by S, with
    S ⊆ V , such that S contains exactly two nodes from every cluster. This leads
    to a variant of the generalized traveling salesman problem which we will denote
    by 2-GTSP. Clearly, a solution to 2-GTSP is a solution to the RTSP.


    In the following we present an efficient cutting plane approach for solving the
    RTSP (see [157]).


    # ### Definition of the 2-GTSP


    The 2-generalized traveling salesman problem (2-GTSP) aims to find a minimum-cost
    tour H, spanning a subset of nodes, such that H contains exactly two nodes from
    each cluster Vi, i ∈ {1, ..., m}. The problem involves two related decisions:


    +   • Choosing a node subset S ⊆ V , such that |S ∩ Vk| = 2, for all k = 1, ...,
    m.


    +   • Finding a minimum cost Hamiltonian cycle in the subgraph of G, induced by
    S.


    We will call such a cycle a 2-generalized Hamiltonian tour. An example of a 2-generalized
    Hamiltonian tour, for a graph with nodes partitioned into 6 clusters, is presented
    in the next figure.


    # ### Integer programming formulations of the 2-GTSP


    In order to formulate the 2-GTSP as an integer program, we introduce the following
    binary variables:


    ```

    \( x_e = \left\{ \begin{array}{ c c } 1 & \text{if edge } e = \{i, j\} \in E \text{
    is included in the selected subgraph} \\ 0 & \text{otherwise} \end{array} \right.
    , \quad z_i = \left\{ \begin{array}{ c c } 1 & \text{if node } i \text{ is included
    in the selected subgraph} \\ 0 & \text{otherwise} \end{array} \right. . \)

    ```


    For \( F \subseteq E \) and \( S \subseteq V \), let \( E(S) = \{e = \{i, j\}
    \in E \mid i, j \in S\} \), \( x(F) = \sum_{e \in F} x_e \) and \( z(S) = \sum_{i
    \in S} z_i \). Also, let \( x(V_k, V_k) = \sum_{i,j \in V_k, i < j} x_{ij} \),
    where \( k \in \{1, ..., m\} \).'
