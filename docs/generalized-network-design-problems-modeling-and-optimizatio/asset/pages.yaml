    With regard to the computational times, it is difficult to make a fair comparison
    between algorithms, because they have been evaluated on different computers and
    are implemented in different languages. The running times of our described approaches
    are proportional to the number of generations. From the computational experiments,
    it seems that \(10^4\) generations are enough to explore the solution space of
    the GVRP. Our proposed heuristic algorithms seem to be slower than ALNS and comparable
    with ITS. Therefore, we can conclude that our approaches will be appropriate when
    the execution speed is not critical.


    # 5.7 Notes


    The generalized vehicle routing problem (GVRP) is an extension of the vehicle
    routing problem, and consists of designing optimal delivery or collection routes
    from a given depot to a number of predefined, mutually exclusive and exhaustive
    clusters, subject to capacity restrictions. The GVRP was introduced by Ghiani
    and Improta [48] and reduces to the generalized traveling salesman problem if
    there is no restriction on the capacity of the vehicle.


    Within this chapter, we described the following results concerning the GVRP:


    +   • An efficient transformation of the GVRP into the classical capacitated arc
    routing problem.'
