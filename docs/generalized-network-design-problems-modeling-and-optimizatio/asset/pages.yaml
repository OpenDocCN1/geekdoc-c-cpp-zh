    # ## 3.6 The drilling problem


    In this section we present a new metaheuristic algorithm called the Sensitive
    Robot Metheuristic (SRM), which aims to solve the drilling problem.


    The large drilling problem is a practical application of the generalized traveling
    salesman problem which involves a large graph and targets finding the minimal
    tour for drilling on a large scale printed circuit board. This problem plays an
    important role for an economical process for manufacturing printed circuit boards.
    A printed circuit board is used to mechanically support and electrically connect
    electronic components, using conductive pathways, tracks, or signal traces.


    The process of manufacturing the printed circuit board is difficult and complex
    and is characterized by many layers that have to be linked through drilling small
    holes, using the shortest connecting route. These holes require precision and
    are done with use of an automated drilling machine controlled by computer programs.
    A layer is'
  merge: -1
  img_proc: true
- pgno: 103
