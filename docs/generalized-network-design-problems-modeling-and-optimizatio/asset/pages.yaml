- pgno: 181
  md: 'satisfied between each origin-destinations clusters. The right hand-side is
    $z_i$ if the demand originates at the cluster $s_d$, $-z_i$ if the demand ends
    in the cluster $t_d$ and 0 otherwise. The restrictions (6.3) guarantee that only
    edges between selected hubs will be established. The restrictions (6.4) not only
    ensure that arc capacities are respected, but they force the flow of any commodity
    to be 0 if the arc is not chosen in the design and the constraints (6.5) relate
    the connection between the variables attached to the edges and those attached
    to the arcs. Finally the constraints (6.7) and (6.8) define the domains of the
    variables.


    We will call this model the directed multicommodity flow model. We let $P_{\text{mcflow}}$
    denote the projection of the feasible set of the linear programming relaxation
    of this model into the $(x, z)$-space.


    We obtain a closely related formulation by eliminating the binary variables $w_{ij}$.
    The resulting formulation consists of the constraints (6.1), (6.2), (6.3), (6.6),
    (6.7) plus


    ```

    $f_{ij}^d + f_{ji}^{d''} \le x_e, \quad \forall d \in D \text{ and } \forall e
    \in E. \quad (6.8)$

    ```


    We refer to this model as the *bidirectional flow formulation* of the GFCNDP and
    let $P_{\text{bidflow}}$ denote its set of feasible solutions in $(x, z)$-space.
    Observe that, since we have eliminated the variables $w_a$ in constructing the
    bidirectional flow formulation, this model is defined on the undirected graph
    $G = (V, E)$, even though for each demand $d \in D$ we perform flows $f_{ij}^d$
    and $f_{ji}^d$ in both directions on edge $e = \{i, j\}$. This model was introduced
    by Thoradsen and Stidsen [200] and, based on it, the authors proposed a branch-cut-and-price
    algorithm for solving the GFCNDP.


    In the bidirectional flow formulation, the constraints (6.8) which we called the
    bidirectional flow inequalities, link the flow of different demands flowing in
    different directions on the edge $\{i, j\}$.


    The following result holds:


    # **Proposition 6.1.** $P_{\text{mcflow}} = P_{\text{bidflow}}$.


    **Proof.** If $(w, x, z, f) \in P_{\text{mcflow}}$, then, using the constraints
    (6.4) we have that


    ```

    $f_{ij}^d + f_{ji}^{d''} \le w_{ij} + w_{ji} = x_e, \quad \forall e = \{i, j\}
    \in E \text{ and } \forall d, d'' \in D.$

    ```


    On the other hand, assume that $(x, z, f) \in P_{\text{bidflow}}$. From the constraints
    (6.8), we get


    ```

    $\max_d f_{ij}^d + \max_{d''} f_{ji}^{d''} \le x_e. \quad \forall e = \{i, j\}
    \in E.$

    ```


    Hence, we can choose $w$ such that $\max_d f_{ij}^d \le w_{ij}$ and $x_e = w_{ij}
    + w_{ji}$ for all $e = (i, j) \in E$. For example, take


    ```

    $w_{ij} = \frac{1}{2}(x_e + \max_d f_{ij}^d - \max_{d''} f_{ji}^{d''}).$

    ```


    Clearly, $(w, x, z, f) \in P_{\text{mcflow}}.$'
