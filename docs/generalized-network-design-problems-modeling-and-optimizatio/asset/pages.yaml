    probability, the crossover rate being 90% or higher. In contrast, the mutation
    rate is much smaller, typically being in the region of 10%.


    # Selection


    The selection process is deterministic. In our algorithm, we use the \((\mu +
    \lambda)\) selection, where \(\mu\) parents produce \(\lambda\) offspring. The
    new population of \((\mu + \lambda)\) is reduced again to \(\mu\) individuals
    by a selection based on the “survival of the fittest” principle. In other words,
    parents survive until they are suppressed by better offspring. It might be possible
    for very well adapted individuals to survive forever.'
