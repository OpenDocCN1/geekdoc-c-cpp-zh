    In our case, an initial feasible solution for the GMSTP was found with the following
    greedy algorithm:


    # Algorithm 2.22.


    +   Input: A connected graph G = (V, E), with nodes partitioned into m clusters
    and edges defined between nodes from different clusters with positive cost.


    +   Output: A generalized spanning tree T = (W, F) of G.


    ```

    F := \emptyset (F is the edge set of the current tree T)

    ```


    ```

    W := {v_i, v_i \in V_k, 1 \le k \le m} (W is the node set of T)

    ```


    ```

    while |S| < m do

    ```


    From among all edges with exactly one end in W, find an edge (v_i, v_j) with minimum
    cost and, whenever we choose a node from a cluster, delete all the other nodes
    from that cluster and all edges adjacent to the deleted nodes;


    ```

    F := F \cup {(v_i, v_j)}

    ```


    ```

    W := W \cup ({v_i, v_j} \\ W)

    ```


    ```

    end; (while).

    ```


    An algorithm similar to the greedy algorithm may be applied in order to find a
    feasible solution for the GMSTP (i.e. a generalized spanning tree of G), if we
    start with a generalized tree T = (W, F) of G (|W| < m), instead of randomly selecting
    a node from a random cluster. We will call this algorithm the local greedy algorithm.


    # Neighborhood structure


    The neighborhood is one of the most important factors in designing a simulated
    annealing algorithm. It should be designed such that the structures common to
    good solutions are preserved after the neighborhood operation is applied.


    In the case of the GMSTP, we defined a neighborhood structure as follows: The
    neighborhood of any given generalized spanning tree T is defined as the set of
    all generalized spanning trees obtained with the local greedy algorithm, for any
    subtree of T. The size of the neighborhood of any given generalized spanning tree
    T is given by the number of subtrees. The maximum number of subtrees of a tree
    with m nodes is reached for trees with nodes distributed on exactly one level,
    except the root, which has degree m - 1. Therefore, in this case, the maximum
    size of the neighborhood is 2^{m-1} + m - 1, see [195]. Given a current solution
    of the GMSTP, i.e. a generalized spanning tree T, for any subtree U of T, using
    the local greedy algorithm, we obtain'
