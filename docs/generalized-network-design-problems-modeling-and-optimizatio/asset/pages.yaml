    # ## 5.3 Integer linear programming formulations of the GVRP


    In this section, we first propose a general semi-closed formulation for the GVRP
    and then we specify its explicit forms and present four formulations of the problem
    (see as well [9, 94, 163]).


    # ### 5.3.1 A general formulation


    We define the related sets, associated with the GVRP, decision variables and parameters
    as follows


    +   **Sets:**

    +   - $V = \{0, 1, 2, ..., n\}$ the set of nodes corresponding to customers, where
    0 represents the origin (depot).

    +   - $V_0, V_1, ..., V_m$ a partition of $V$ into mutually exclusive and exhaustive
    non-empty sub-sets, each of which represents a cluster of customers with $V_0
    = \{0\}$ the origin (home city, depot).

    +   - $C = \{0, 1, 2, ..., m\}$ the set of clusters.

    +   - $A = \{(i, j) | i, j \in V, i \neq j\}$ the set of arcs.'
