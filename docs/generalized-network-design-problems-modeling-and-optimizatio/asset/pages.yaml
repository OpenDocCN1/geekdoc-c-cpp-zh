  md: '# 2.2 An exact algorithm for the GMSTP


    Let G'' be the graph obtained from G after replacing all nodes of a cluster V_i
    with a supernode representing V_i. We will call the graph G'' the global graph.
    For convenience, we identify V_i with the supernode that represents it. Edges
    of the graph G'' are defined between each pair of the graph vertices V_1, ...,
    V_m.


    The local-global approach to the GMSTP aims at distinguishing between global connections
    (connections between clusters) and local connections (connections between nodes
    from different clusters). As we will see, having a global tree connection of the
    clusters makes it rather easy to find the least cost generalized spanning tree.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_22_0.png)


    Figure 2.2. An example showing a generalized spanning tree corresponding to a
    global spanning tree.


    To each global spanning tree there are several corresponding generalized spanning
    trees. Among these generalized spanning trees there exists one called the best
    generalized spanning tree (w.r.t cost minimization), which can be determined either
    by dynamic programming or by solving a linear integer program.


    In the following, based on the local-global approach and making use of dynamic
    programming, we will present an exact exponential time algorithm.


    Given a spanning tree of the global graph G'', which we shall refer to as a global
    spanning tree, we use dynamic programming in order to find the corresponding best
    (w.r.t. cost minimization) generalized spanning tree.


    Fix an arbitrary cluster V_root as the root of the global spanning tree and orient
    all the edges away from vertices of V_root, according to the global spanning tree.
    A directed edge (V_k, V_l) of G'', resulting from the orientation of edges of
    the global spanning tree, provides a natural definition of an orientation (i,
    j) of an edge (i, j) ∈ E, where i ∈ V_k and j ∈ V_l. Let v be a vertex of cluster
    V_k for some 1 ≤ k ≤ m. All such nodes v are potential candidates to be incident
    to an edge of the global spanning tree.


    On the graph G, we denote by T(v) the subtree rooted at such a vertex v from G.
    T(v) includes all vertices reachable from v under the above orientation of the
    edges of G, based on the orientation of the edges of the global spanning tree.
    The children of v ∈ V_k, denoted by C(v), are those vertices u ∈ V_l which are
    heads of'
