  md: '![](img/8ee31706d554c7b9e05caa9ab83aec83_193_0.png)


    Figure 7.4. A EAN move, adding the edge (v1, v6) and removing the redundant edges
    (v1, v5) and (v3, v6).


    # 7.3.4 Node Exchange Neighborhood


    The node exchange neighborhood is a combination of the simple node optimization
    neighborhood and edge augmentation neighborhood, and addresses modifications of
    the spanned nodes as well as the edges connected them. The neighborhood consists
    of all solutions that differ from the current solution by exactly one spanned
    node and an arbitrary number of edges. This situation is illustrated in Figure
    7.5.


    # 7.3.5 Variable Neighborhood Descent


    In their proposed VNS scheme, Hu et al. [82] used the variable neighborhood descent
    (VND) as local improvement. They provided three VND variants. The first one, denoted
    VND1, applies the previously described neighborhood structures. The second one,
    denoted VND2, applies the above mentioned neighborhoods and in addition two neighborhoods,
    based on the graph reduction technique [82]. Finally, the last variant called
    the self-adapted variable neighborhood descent (SAVND), applies the same neighborhood
    structures as VND2, but instead of a given static order, the neighborhoods are
    rearranged automatically during the search process. The pseudocode of the general
    VNS is presented in Algorithm 7.1.


    # Algorithm 7.1 (VNS algorithm for solving the GMEBCNP).


    +   1 Create initial solution S

    +   2 repeat

    +   3   k = 0

    +   4   repeat

    +   5     S'' = S'
