    # 2.5 Solving the GMSTP


    Myung et al. [128] used a branch and bound procedure in order to solve the GMSTP.
    Their lower procedure is a heuristic method, which approximates the linear programming
    relaxation associated with the dual of the multicommodity flow formulation of
    the GMSTP. They also developed a heuristic algorithm, which finds a primal feasible
    solution for the GMSTP, using the obtained dual solution and they reported the
    exact solution of instances with up to 100 vertices. The GMSTP was solved to optimality
    for nodes up to 200 by Femermans [37], using a branch-and-cut algorithm. More
    recently, Pop et al. [150] have proposed a new integer programming formulation
    of the GMSTP, based on a distinction between local and global variables and a
    solution procedure that finds an optimal solution on instances with up to 240
    vertices.


    The difficulty of obtaining optimum solutions for the GMSTP has led to the development
    of several metaheuristics. The first such algorithms were the tabu search (TS)
    heuristic of Femermans [37] and the simulated annealing (SA) heuristic of Pop
    [142]. An improved version of the SA was described in [154]. Two variants of the
