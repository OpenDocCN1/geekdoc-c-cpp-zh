    local search procedure, in order to improve the global tour that represents either
    the global solution of a client, or the strategy of a consultant in sabbatical
    mode. Then, using the cluster optimization procedure described in Section 3.2,
    the algorithm finds the best generalized tour, which corresponds to the global
    tour returned by the local search procedure.


    In order to compare the strategies constructed during the sabbatical leave, a
    consultant uses the cost of the generalized tour corresponding to each strategy.
    Similarly, the success of a client is evaluated based on the cost of the generalized
    solution. The pseudocode of our algorithm is shown in Algorithm 3.6.


    A virtual person may be in either normal or sabbatical mode. During the initialization
    phase (lines 2-5), virtual people are created and placed in sabbatical mode. Based
    on his mode, on each iteration of the algorithm (lines 7-31), a virtual person
    constructs either a global solution to the problem (line 19) or a global consultant
    strategy (line 9). Later in this subsection, we describe the operations involved
    in the construction of a global solution or strategy, as well as the method used
    by a client in order to choose a consultant for the current iteration (line 17).


    Global strategies and global solutions are improved by applying a local search
    procedure (lines 10 and 20). The clusterOptimization procedure, described in Section
    3.2, is then used to find the best generalized strategy (line 11) that corresponds
    to the current global strategy or to find the best generalized solution (line
    21) that corresponds to the current global solution. After constructing a global
    strategy, a virtual person in sabbatical mode checks if the corresponding generalized
    strategy is the best generalized strategy found since the beginning of the sabbatical
    (lines 12-15). Similarly, after constructing a global solution, a client checks
    the corresponding generalized solution, in order to decide if he has achieved
    a success and if so, he updates the strategy of his consultant (lines 22-26).
    At the end of each iteration, the reputation and action mode of each virtual person
    are updated (lines 30-31).


    Algorithm 3.7 details how consultants'' reputations are updated, based on the
    successes achieved by their clients.


    Reputations fade over time with a constant rate, given by the parameter fadingRate
    (line 4). The reputation of a consultant is incremented with each success achieved
    by one of his clients (line 5) and he receives an additional bonus of 10 for finding
    a best-so-far solution (lines 6-9).


    The reputation of a consultant cannot exceed a maximum value (lines 10-12) and
    the algorithm prevents the reputation of the best consultant, that is, the consultant
    that has found the best-so-far solution, from sinking below a given value (lines
    13-17).


    The constant parameter initialReputation represents the reputation assigned to
    a consultant at the end of the sabbatical leave.'
