  img_proc: true
- pgno: 73
  md: 'On the directed graph \( G'' \) a path is called a *cluster path*, if it consists
    of all nodes of the cluster. A Hamiltonian cycle with cost less than \( (m + 1)M
    \) is called a *clustered Hamiltonian cycle*.


    # **Lemma 3.1.** (Behzad and Modarres [8]) Every clustered Hamiltonian cycle in
    \( G'' \) enters and leaves each cluster exactly once.


    **Proof.** From the definition of the costs in the directed graph \( G'' \), we
    see that the costs of moving from one cluster to another is at least \( M \).
    Since every Hamiltonian cycle visits all the \( m \) clusters, its cost is at
    least \( mM \). If the clustered Hamiltonian cycle in \( G'' \) does not traverse
    along the cluster paths, this implies that it enters and leaves each of the \(
    m \) clusters more than once. Therefore, the cost of the tour cannot be less than
    \( (m + 1)M \), which is a contradiction. \(\square\)


    We can now define the one-to-one correspondence between clustered Hamiltonian
    cycles in \( G'' \) and generalized Hamiltonian tours in \( G \):


    +   1. Consider a clustered Hamiltonian cycle in \( G'' \) and connect the first
    nodes of its cluster paths together in the order of their corresponding clusters,
    then the result is a generalized Hamiltonian tour in \( G \).


    +   2. Consider a generalized Hamiltonian tour in \( G \) that includes the following
    nodes \(\cdots \rightarrow v''_i \rightarrow v''''_i \rightarrow \cdots, r \neq
    t\). Replacing the node \( v''_i \) with the \( V_i \)-th cluster path starting
    with \( v''_i \) and then connecting the last node of this path to the next cluster
    path starting with \( v''_j \), we obtain a clustered Hamiltonian cycle in \(
    G'' \).


    It is obvious that the cost of a generalized Hamiltonian tour in \( G \) visiting
    \( m \) clusters is equal to the cost of the corresponding clustered Hamiltonian
    cycle in \( G'' \) minus \( mM \).


    In Figure 3.2 we present an optimal solution of the GTSP, defined on the graph
    \( G \), and the corresponding TSP defined on the graph \( G'' \). The nodes of
    each cluster are cycled in \( G'' \) by solid arcs, as depicted in the figure.
    The optimal solution of the TSP as well as its corresponding solution in the GTSP
    are illustrated by dash-dot arcs.


    Even though the idea of transforming the GTSP into the TSP seems to be very promising,
    this approach has very limited application, because it requires exact solutions
    of the obtained TSP instances. Even a near-optimal solution of such a TSP may
    correspond to an infeasible GTSP solution.


    # ## 3.3 An exact algorithm for the Generalized Traveling Salesman Problem


    In this section, we present an algorithm that finds an exact solution to the generalized
    traveling salesman problem.'
