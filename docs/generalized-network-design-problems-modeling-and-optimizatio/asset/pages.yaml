  md: '# Chapter 2


    # The Generalized Minimum Spanning Tree Problem (GMSTP)


    The minimum spanning tree (MST) problem has a venerable history in the field of
    combinatorial optimization. The problem was first formulated in 1926 by Boruvka,
    who is said to have learned about it during the rural electrification of the Southern
    Moravia, where he provided a solution to find the most economical layout of a
    power-line network. The importance and popularity of the MST problem stem from
    several facts: it allows an efficient solution, which makes the problem practical
    to solve for large graphs. Some polynomial-time algorithms for solving the MST
    problem were developed by Kruskal [100], Prim [171], Dijkstra [25] and Sollin
    [189] and have been applied to many combinatorial optimization problems such as
    transportation problems, telecommunication network design, distribution systems,
    and so on.


    However, most attractive to many researchers has been the extension of the MST
    problem, in the last decade, to e.g., the degree-constrained minimum spanning
    tree problem (dc-MST) by Narula and Ho [130], the probabilistic minimum spanning
    tree problem (p-MST) by Bertsimas [11], the stochastic minimum spanning tree problem
    (s-MST) by Ishii et al. [89], the quadratic minimum spanning tree problem (q-MST)
    by Xu [204], the minimum Steiner tree (MStT) problem by Maculan [117], the generalized
    minimum spanning tree problem (GMSTP) by Myung, Lee and Tcha [128], etc. The extensions
    of the MST problem are generally NP-hard problems and therefore polynomial-time
    solutions do not exist.


    In this section, we are concerned with the generalized version of the minimum
    spanning tree problem (MST), called the generalized minimum spanning tree problem
    (GMSTP). Given an undirected graph, whose nodes are partitioned into a number
    of subsets (clusters), the GMSTP aims to find a minimum-cost tree, spanning a
    subset of nodes, which includes exactly one node from each cluster. Therefore,
    the MST problem is a special case of the GMSTP, with each cluster consisting of
    exactly one node.


    The GMSTP was introduced by Myung et al. [128] and has several real world applications
    in the design of metropolitan area networks [47] and regional area networks [173]
    and in determining the locations of regional service centers [142], energy transportation
    [135], agricultural irrigation [30], etc.


    Two variants of the generalized minimum spanning tree problem were considered
    in the literature: in the first one, in addition to the cost attached to the edges,
    we also have costs attached to the nodes. This is called the prize collecting
    generalized minimum spanning tree problem, see [54, 151]. The second one consists
    in finding a minimum cost tree, spanning at least one node from each cluster,
    denoted by L-GMSTP, which'
  merge: -1
