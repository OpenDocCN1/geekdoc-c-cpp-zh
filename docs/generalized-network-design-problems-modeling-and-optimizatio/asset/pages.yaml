    \( x(\delta(S, C_1, \dots, C_k)) \ge \sum_{j=0}^k z_{ij} - 1 = z_i + z(V \setminus
    S) - 1 \),


    where \( i \in S \subset V \). Therefore


    \( x(E(S)) = x(E) - x(\delta(S, C_1, \dots, C_k)) \le z(V) - 1 - z_i - z(V \setminus
    S) + 1 = z(S - i) \).


    # **Cluster subpacking formulation** (Feremans [37])


    We may strengthen the generalized subtour formulation of the GMSTP by replacing
    the subtour elimination constraints (2.2) with the cluster subpacking constraints


    \( x(E(S)) \le z(S \setminus V_k), \quad \forall S \subset V, 2 \le |S| \le n
    - 1, k \in K \)


    We observe that these constraints are dominated by:


    \( x(E(S'')) \le z(S'' \setminus V_k) = z(S'') - 1 \)


    where \( S'' = S \cup V_k \). Therefore, we arrive at the cluster subpacking formulation
    of the GMSTP, introduced by Feremans [37]:


    ```

    min \(\sum_{e \in E} c_e x_e\)

    s.t. (2.1), (2.3), (2.4), (2.5) and

    \( x(E(S)) \le z(S) - 1, \forall S \subset V, 2 \le |S| \le n - 1, |\{k : V_k
    \subseteq S\}| \neq 0 \quad (2.8) \)

    ```


    The cluster subpacking constraints (2.8) guarantee that the number of edges selected
    from any subset of nodes S with \( 2 \le |S| \le n - 1 \), cannot be greater than
    the number of nodes selected from that set minus 1. We will denote by \( P_{\text{spack}}
    \), the feasible set of the linear programming relaxation of the cluster subpacking
    formulation.'
