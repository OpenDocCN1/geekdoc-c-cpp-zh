    ```

    \(\sum_{(v,u) \in E} y^i_{(v,u)} - \sum_{(u,v) \in E} y^i_{(u,v)} = 0, \quad \forall
    u \in V \\ \{s_0, f_i\} \quad (4.6)\)

    \(y^i_{(s_0, d_0)} = \sum_{(v,f_i) \in E} y^i_{(v,f_i)} = 1 \quad (4.7)\)

    \(y_e^i \le x_e, \quad \forall e \in E \\ \{(u, f_i) \in E\}. \quad (4.8)\)

    ```


    The above constraints form a multicommodity flow problem, introducing a commodity
    for each selected station and asking for one unit of flow of each commodity \(i
    \in [0, |B| - 1]\) to be routed from the source node to the corresponding selected
    station''s sink node \(f_i\). An additional condition imposed on the y-variables
    is that the flow \(y_e^i\) of commodity \(i\) on any edge \(e \in E\) cannot have
    a value greater than \(x_e\). This means that, if the x-flow is zero on some edge
    \(e\), the y-flows will all be zero on that edge, too.


    The constraints (4.6)-(4.8) force the x variables to be assigned appropriately,
    so that, for each selected station, there exists a path from so to some departure
    node in that station, using only edges for which the corresponding x variables
    are non-zero.'
