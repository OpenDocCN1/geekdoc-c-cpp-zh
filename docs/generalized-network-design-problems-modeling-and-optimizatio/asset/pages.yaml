    procedure sets the number of clusters m = [k/4], identifies the m farthest nodes
    from each other, and assigns each remaining node to its nearest center. Obviously,
    some real-world problems may have different cluster structures. However, the solution
    proposed in this paper is able to handle any cluster structure.


