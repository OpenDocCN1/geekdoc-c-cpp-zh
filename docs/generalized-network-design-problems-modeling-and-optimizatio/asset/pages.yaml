    The formulations of the RTSP are based on the so-called time-expanded digraph,
    introduced by Schulz et al. [182]. Such a graph G = (V, E) is constructed using
    the timetable information provided as follows:


    +   There is a node for every time event at a station (departure or arrival),
    and there are four types of edges.


    +   For every elementary connection (z, σ1, σ2, td, ta) in the timetable, there
    is a train-edge in the graph that connects a departure node, belonging to station
    σ1 and associated with time td, with an arrival node, belonging to station σ2
    and associated with time ta. In other words, the endpoints of the train-edges
    induce the set of nodes of the graph.


    +   For each station σ ∈ S, all departure nodes belonging to σ are ordered according
    to their time values. We denote with v1, v2, ..., vk the nodes of σ, in that order.


    +   There is a set of stay-edges, denoted by Stay(σ), (vi, vi+1), 1 ≤ i ≤ k −
    1, and (vk, v1), connecting the time events within a station and representing
    a stay at that station;


    +   Additionally, for each arrival node in a station there is an arrival-edge
    to the immediately nearest (w.r.t. their time values) departure node of the same
    station.


    The cost of an edge (u, v) is the cycle-difference (tu, tv), where tu and tv are
    the time values associated with u and v, respectively.


    In the next figure, Figure 4.1, we present an example of two stations in the time-expanded
    graph, that illustrates our construction.


    To formulate the RTSP, we introduce the following modifications to the time-expanded
    digraph:


    +   In the first place, we do not include any elementary connections that have
    departure times greater than the latest possible departure time, or smaller than
    the earliest.


    +   In the second place, we explicitly model the fact that the salesman has to
    wait for a time at least fB(b) at each station b ∈ B by introducing a set of busy-edges,
    denoted by Busy(b). We introduce a busy-edge from each arrival node in a station
    b ∈ B, to the first possible departure node of the same station that differs in
    time value by at least fB(b).


