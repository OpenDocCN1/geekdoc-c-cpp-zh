  md: 'Let \( G'' \) be the graph obtained from \( G \) after replacing all nodes
    of a cluster \( V_i \) with a supernode representing \( V_i \). For convenience,
    we identify \( V_i \) with the supernode that represents it. We will call this
    graph the global graph and we assume that \( G'' \) with vertex set \( \{V_1,
    ..., V_m\} \) is complete. We will denote the set of nodes of this global graph
    by \( V_g \), \( V_g = \{1, ..., m\} \), the set of edges by \( E_g \), \( E_g
    = \{e_g = (i, j) \mid i, j \in \{1, ..., m\} \} \) and the set of arcs to \( A_g
    \).


    Our last formulation aims to distinguish between global, i.e. inter-cluster connections,
    and local ones, i.e. connections between nodes from different clusters. The local-global
    approach introduced by Pop [142] was applied successfully to provide strong integer
    programming formulations, exact algorithms, solution procedures in the case of
    the generalized minimum spanning tree problem [160, 150] and the generalized traveling
    salesman problem [79].


    We introduce the binary variables \( y_{ij} \) (\( i, j \in \{1, ..., m\} \))
    to describe the global connections, so \( y_{ij} = 1 \) if cluster \( V_i \) is
    connected to cluster \( V_j \) and \( y_{ij} = 0 \) otherwise. This polytope,
    denoted by \( P_{FCND} \), can be represented by the following polynomial number
    of constraints:


    \sum_{a_g \in \delta^+(i)} F_{a_g}^d - \sum_{a_g \in \delta^-(i)} F_{a_g}^d =
    \begin{cases} 1, & i \in s_{gd} \\ -1, & i \in t_{gd} \\ 0, & \text{otherwise}
    \end{cases} \quad \forall d \in D, i \in V_g, \quad (6.9)

    F_{ij}^d + F_{ji}^d \leq y_e \kappa_e, \quad \forall e_g = (i, j) \in E_g, d \in
    D. \quad (6.10)

    y_{ij} \in \{0, 1\}, \quad \forall i, j \in V_g. \quad (6.11)

    F_{a_g}^d \geq 0, \quad \forall a_g \in A_g, d \in D. \quad (6.12)


    where the continuous decision variables \( F_{a_g}^d \) correspond to the fraction
    of demand \( d \) routed on the arc \( a_g \) and the relation to the decision
    variables \( f_a^d \) is given by \( F_{a_g}^d = \sum_{(a=(i,j)) \in A \mid i
    \in V_k, j \in V_l} f_a^d \). \( \kappa_e = (k,l) \in A_g \).


    If the 0-1 vector \( y \) corresponds to a fixed-charge network design problem
    on the contracted graph, the corresponding local solution \( x, z \in \{0, 1\}^{|E|}
    \) that minimizes the costs can be obtained by solving the following integer linear
    programming problem:


    \min \sum_{e \in E} c_e x_e

    s.t.

    z(V_k) = 1, \quad \forall k \in K = \{1, ..., m\},

    x(V_l, V_r) = y_{lr}, \quad \forall l, r \in K = \{1, ..., m\}, l \neq r,

    x(i, V_r) \leq z_i, \quad \forall r \in K, \forall i \in V \setminus V_r,

    x_e, z_i \in \{0, 1\}, \quad \forall e = \{i, j\} \in E, \forall i \in V,


    where \( x(V_l, V_r) = \sum_{i \in V_l, j \in V_r} x_{ij} \) and \( x(i, V_r)
    = \sum_{j \in V_r} x_{ij} \).'
