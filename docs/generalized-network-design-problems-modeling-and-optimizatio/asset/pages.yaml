- pgno: 145
  md: 'In the case of an integer programming formulation, if the number of constraints
    of the formulation grows exponentially, with respect to the number of nodes of
    the graph, it is called the *exponential size formulation*. If the number of constraints
    grows polynomially, it is called the *polynomial size formulation*. In addition,
    if a formulation has additional auxiliary decision variables, it may be classified
    with respect to the new decision variables as, *node based formulation* if the
    additional variables are relative to the nodes of the graph, and *flow based formulation*
    if the new variables are relative to the arcs of the graph.


    In the following subsections, we propose integer programming formulations for
    the GVRP, by defining new auxiliary variables.


    # ## 5.3.2 A node based formulation


    In addition to the decision variables defined before, let us define the following
    auxiliary variables:


    Let \(u_p\) be the load of a vehicle just after leaving the cluster \(V_p\) (collection
    case) or the delivered amount of goods from a vehicle just after leaving the cluster
    \(V_p\) (delivery case), \(p \neq 0, p \in C\).


    # ### Capacity Bounding Constraints


    The following proposition gives capacity bounding constraints for a node based
    formulation.


    **Proposition 5.3.** The following inequalities are valid capacity bounding constraints
    for the GVRP:


    ```

    u_p - \sum_{r \in C, r \neq p} q_r w_{pr} \ge q_p \quad p \neq 0, \quad p \in
    C \quad (5.9)

    u_p + (Q - q_p)w_{0p} \le Q \quad p \neq 0, \quad p \in C \quad (5.10)

    u_p + \sum_{r \in C, r \neq p} q_r w_{pr} \le Q \quad p \neq 0, \quad p \in C
    \quad (5.11)

    ```


    where \(q_0 = 0\).


    **Proof.** Any cluster \(V_p\) may be on the first, last or an intermediate position
    in a vehicle tour, i.e., either \(w_{0p} = 1\) and/or \(w_{p0} = 1\), or there
    exist clusters \(V_s\) and \(V_t\), such that \(w_{sp} = w_{pt} = 1\). If \(w_{0p}
    = 1\) (or \(w_{p0} = 1\)), the inequalities (5.10), (5.11) and (5.12) imply that
    \(u_p = q_p\) and if \(w_{p0} = 1\), the bounding constraints imply \(q_p = u_p
    = Q\). If a vehicle comes from cluster \(V_s\), goes to cluster \(V_p\) and then
    travels from \(V_p\) to the cluster \(V_t\), which means that \(w_{rp} = 0\) and
    \(w_{pr} = 0\) for all \(r \neq s\) and \(r \neq t\), then from the bounding constraint
    we obtain \(q_p + q_s \le u_p \le Q - q_t\).'
