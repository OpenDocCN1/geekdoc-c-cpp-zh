  md: '# Chapter 6


    # The Generalized Fixed-Charge Network Design Problem (GFCNDP)


    Network design problems that arise in telecommunication applications have originated
    new challenges in the field of combinatorial optimization. Hierarchical telecommunication
    networks are physical organizations of communications facilities, each higher
    level covering a wider or more general area of operation than the next lower level.
    Hierarchical networks consist of layers of networks and are well-suited for coping
    with changing and increasing demands. Hierarchical telecommunication networks
    exist for historical reasons and enable economy of scale in the central high speed
    networks, the backbone-networks.


    A network consists of nodes and links interconnecting the nodes. A hierarchical
    network consists of disjoint sets of nodes called clusters. In addition, each
    cluster contains at least one hub node. The backbone consists of hub nodes interconnected
    by backbone links. Similarly, the nodes in each cluster are interconnected by
    cluster links.


    When dealing with designing hierarchical network problems, the following inter-related
    subproblems have to be solved [199]:


    +   • Hub location.

    +   • Clustering of the nodes.

    +   • Interconnection of the nodes in the backbone and cluster networks.

    +   • Routing.


    These four subproblems have often been considered, and were mostly solved independently.
    Only a few of them have been considered simultaneously. The problem of treating
    all mentioned subproblems in an integrated way is called the hierarchical network
    design problem. For more information on hierarchical network design we refer to
    [20, 98, 199].


    An example of a hierarchical network is shown in Figure 6.1.


    In the above figure, each cluster contains one hub, which is marked by a filled
    square. The backbone links are the links interconnecting the hubs and the cluster
    links are the links which interconnect nodes internally in a cluster. Note, that
    there are no links between non-hub-nodes in different clusters.


    This chapter deals with the problem of designing a backbone mesh network interconnecting
    a given number of clusters. The problem is an important subproblem when constructing
    hierarchical telecommunication networks. It is called the generalized'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/8ee31706d554c7b9e05caa9ab83aec83_178_0.png)


    Figure 6.1. Example of a hierarchical network design.


    fixed-charge network design (GFCND) problem and was introduced by Thomadsen and
    Stidsen [200].


    The GFCND problem belongs to the class of generalized network design problems
    which are obtained from the classical network design problems in a natural way
    by considering a related problem relative to a given partition of the nodes of
    the graph into node sets.


    # ## 6.1 Definition of the GFCNDP


    Given an n-node undirected graph G = (V, E) and V1,...,Vm a partition of V into
    m clusters, we assume that the nodes in each cluster are internally connected
    by a cluster-network and the clusters, on the other hand, are not connected but
    have to be connected by a backbone-network, in order to be able to communicate.
    We assume as well, that between any two selected nodes (hubs) from different clusters
    there exists an inter-cluster edge having a positive cost. In addition to the
    costs of edge establishment, each inter-cluster edge has a required capacity that
    depends on the communication demand and on the way the demands are routed.


    The GFCNDP seeks to find the cheapest backbone network connecting exactly one
    hub from each of the given clusters. The problem involves two related decisions


    +   * Selecting a hub from each cluster |Vi|, for all i = 1, ..., m.


    +   * Finding the cheapest backbone network connecting exactly the selected hubs.


    In Figure 6.2(a) five node sets (clusters) are presented. The clusters may have
    a different number of nodes. We assume that all nodes from each cluster are connected
    by an intercluster network.'
