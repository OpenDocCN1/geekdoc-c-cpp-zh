    \ the above formulation, the constraints (4.14) are the connectivity constraints,\
    \ which state that each cut separating two visited nodes (\\(i\\) and \\(j\\))\
    \ must be crossed at least twice.\n\nIn addition to the constraints that appear\
    \ in the previous formulations, we consider the following constraints specific\
    \ to the railway traveling salesman problem:\n\n\\(t_d z_d - t_a z_d \\ge t_k,\
    \ \\forall a, d \\in V_k, 2 \\le k \\le m. \\quad (4.15)\\)\n\nThe above constraints\
    \ state that the difference between the departure and arrival times must be at\
    \ least a specified period \\(t_k\\) (depending on the city). This means that\
    \ the traveling salesman has to stay in each city for some time, in order to finish\
    \ business. If the difference is too small, the salesman may fail to achieve this.\
    \ If, on the other hand, the difference is too large, the waiting time at the\
    \ station will be inconvenient.\n\nThe disadvantage of the described integer programming\
    \ formulations are their exponential number of constraints (we have to choose\
    \ subsets of \\(V\\), constraints (4.13) and (4.14)). These constraints can be\
    \ omitted and can then be generated, as needed, as needed, by a *separation algorithm*:\
    \ one can start without constraints (4.13), solve the corresponding relaxation,\
    \ and then generate subtour inequalities that are violated by the current solution.\
    \ The separation algorithm for subtour constraints is based on network flow techniques.\
    \ For further details see [43].\n\n# Solution procedure and computational results\n\
    \nWe used the following *cutting plane algorithm*, in order to solve the 2-GTSP:\n\
    \n+   1. Let the integer programming (IP) formulation consist of the constraints\
    \ (4.9)–(4.12), (4.15) and the integrality constraints.\n+   \n+   2. Solve the\
    \ IP and assume that the optimal solution consists of \\(r\\) subtours: \\(S_1,\
    \ \\dots, S_r\\).\n+   \n+   3. If \\(r = 1\\), then STOP. The solution to the\
    \ 2-GTSP is optimal. Otherwise, add the corresponding constraints that eliminate\
    \ the cycles \\(S_1, \\dots, S_r\\) to the IP formulation and go to Step 2."
