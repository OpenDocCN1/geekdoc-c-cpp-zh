- pgno: 159
  md: 'GA are not well suited for fine-tuning structures which are close to optimal
    solutions. Therefore, we use local search optimization in order to refine the
    solutions explored by GA. The general scheme of our hybrid heuristic is:


    # Algorithm 5.7.


    +   Step 1. Initialization. Construct the first generation of global solutions,
    i.e. collection of global routes.

    +   Step 2. Creation of next generation. Use genetic operators (crossover and
    mutation) to produce next generation of global solutions. The parents are selected
    from the previous generation.

    +   Step 3. Producing the corresponding best GVRP generation. Using the procedure
    described in section 5.2, for each global solution, determine its best corresponding
    GVRP solution.

    +   Step 4. Improving next generation. Use a local search procedure to replace
    each of the current generation solutions by the local optimum. Eliminate duplicate
    solutions.

    +   Step 5. Termination condition. Repeat Steps 3, 4 and 5 until a stopping condition
    is reached.


    # The genetic algorithm


    # Genetic encoding


    In our algorithm, we used the following genetic representation of the solution
    domain: a chromosome is represented as a list of clusters


    ```

    \((V_0, V_{l_1}^{(1)}, V_{l_2}^{(1)}, \dots, V_{l_p}^{(1)}, V_0, \dots, V_0, V_{l_1}^{(r)},
    V_{l_2}^{(r)}, \dots, V_{l_p}^{(r)}) \quad (5.46)\)

    ```


    representing a collection of \(r\) global routes \(V_0 - V_{l_1}^{(1)} - V_{l_2}^{(1)}
    - \dots - V_{l_p}^{(1)} - V_0, \dots, V_0 - V_{l_1}^{(r)} - V_{l_2}^{(r)} - \dots
    - V_{l_p}^{(r)} - V_0\), where \(p, t \in N\) with \(1 \le p, t \le k\).


    For the feasible solution of the GVRP illustrated in Figure 5.7, the corresponding
    chromosome is: (1 2 0 3 4 5 0 6) and represents the collection of 3 global routes,
    passing through the clusters in the following order:


    ```

    \((V_1 V_2 V_0 V_3 V_4 V_5 V_0 V_6). \quad (5.47)\)

    ```


    The values {1,...,6} represent the clusters, while the depot, denoted by {0},
    is the route splitter. Route 1 starts at the depot then visits the clusters \(V_1,
    V_2\) and returns to the depot. Route 2 starts at the depot and visits the clusters
    \(V_3 - V_4 - V_5\). Finally, in route 3 only the cluster \(V_6\) is visited.'
