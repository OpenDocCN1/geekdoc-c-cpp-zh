- pgno: 17
  md: 'the dual variables (the Lagrangian multipliers) is called the Lagrangian dual
    problem. Choosing “good” values for the Lagrangian multipliers is of key importance
    in terms of quality of the generated lower bound. We refer to [110] for more details
    on this technique.


    +   - Semidefinite programming. (SDP) relaxation. Combinatorial optimization problems
    often involve binary (0, 1 or +1, -1) decision variables, which can be modeled
    with use of quadratic constraints x^2 - x = 0, and x^2 = 1, respectively. Using
    the positive semidefinite matrix X = xx^T, we can lift the problem into a higher
    dimensional matrix space and obtain a Semidefinite Programming Relaxation problem,
    by ignoring the rank-one restriction on X, see e.g. [115]. These semidefinite
    relaxations provide tight bounds for many classes of hard problems. In addition,
    they can be solved efficiently by interior-point methods.


    # 1.4 Generalized network design problems


    In combinatorial optimization, many network design problems can be generalized
    in a natural way, by considering a related problem on a clustered graph, where
    the original problem’s feasibility constraints are expressed in terms of the clusters,
    i.e., node sets, instead of individual nodes. This class of problems is usually
    referred to as generalized network design problems (GNDPs) or generalized combinatorial
    optimization problems.


    In the literature, several GNDPs have already been considered, such as the generalized
    minimum spanning tree problem, the generalized traveling salesman problem, the
    generalized vehicle routing problem, the generalized (subset) assignment problem,
    the generalized fixed-charge network design problem, etc. All such problems belong
    to the class of NP-complete problems, and in practice are typically harder to
    solve than their original counterparts. Nowadays, they are intensively studied
    due to their interesting properties and important real-world applications in telecommunication,
    network design, resource allocation, transportation problems, etc. Nevertheless,
    many practitioners are still reluctant to use them for modeling and solving practical
    problems, because of the complexity of finding optimal or near-optimal solutions.


    For all the generalized network design problems described in this book, we are
    given an n-node undirected weighted graph G = (V, E), with node set V and edge
    set E. The nodes are partitioned into a given number of node sets called clusters
