- pgno: 141
  md: 'is strongly NP-hard. However, there exist efficient polynomial algorithms for
    solving special classes of the CARP for special structures of graph, demand or
    costs, see Assad et al. [4]. Due to the complexity of the CARP, several approximation
    procedures (see Assad and Golden [3], Eiselt et al. [33, 34]) and heuristic algorithms
    (see Chapelat et al. [17], Hertz et al. [74], etc.) to solve the problem have
    been developed.


    In what it follows, we will describe the efficient transformation of the GVRP
    into the CARP, introduced by Ghiani and Improta [48].


    For the sake of simplicity, we assume that the GVRP is symmetric (i.e. cij = cji
    for all customers i, j ∈ V ). It is easy to show that the assumption mentioned
    is not restrictive and every GVRP can be transformed into an instance of our problem.


    Assad and Golden [3] and Eiselt [33] proved that, in the case of every feasible
    solution of the CARP, every vertex is entered by an even number of copies of edges.
    For the sake of simplicity, the parity condition is formulated using the word
    “edge” instead of “copy of an edge”.


    Let us denote by GR the subgraph induced by edges in R, by Nh the set of nodes
    of the h-th connected component of GR, h = 1, ..., m and by NR the set of nodes
    vi such that an edge (vi, vj) exists in R, i.e. VR = ∪h={1,...,m} Nh.


    In this case, the transformation of the GVRP into a CARP is defined as follows:


    +   1. A loop of “very expensive” required edges is created with the vertices
    v(h), ..., v(r(h))h of the cluster Vh for h = 1, ..., m, where r(h) denotes the
    number of customers belonging to cluster Vh. The following edges (v(i)h, v(i mod
    r(h))+1h) with i = 1, ..., r(h) and cost equal to a large positive number M, are
    inserted into R. In particular, if r(h) = 1, a required loop v(h)1, v(h)1 is introduced.
    These loops create m connected components of required edges. The remaining edges
    are non-required.


    +   2. The non-required intra-cluster edges are removed.


    +   3. The cost of each inter-cluster edge is increased by M/2 if an endpoint
    coincides with the depot, or by M otherwise.


    +   4. Strictly positive demands, having sum equal to dh are assigned to the edges
    of the loop corresponding to Vh, h = 1, ..., m.


    In the next figure, we illustrate the described transformation procedure and show
    the corresponding CARP solution on the transformed graph belonging to the feasible
    solution of the GVRP shown in Figure 5.1.


    The following results hold:


    Proposition 5.1. (Ghiani and Improta [48]) The optimal solution to the CARP on
    the transformed graph corresponds to the GVRP optimal solution on the original
    graph.'
