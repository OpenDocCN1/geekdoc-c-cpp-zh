    to the home city (origin), which is implied by the following constraints:


    \(\sum_{i=1}^n x_{0i} = s \quad (5.3)\)


    \(\sum_{i=1}^n x_{i0} = s \quad (5.4)\)


    # Cluster Connectivity Constraints


    The incoming and outgoing nodes should be the same for each cluster, which is
    satisfied by:


    \(\sum_{i \in V_p \backslash V_p} x_{ij} = \sum_{i \in V_p \backslash V_p} x_{ji},
