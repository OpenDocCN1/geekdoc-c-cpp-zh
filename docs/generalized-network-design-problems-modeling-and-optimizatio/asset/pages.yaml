    The constraints (3.15) ensure that the solution contains no subtour on a set of
    nodes \(S\) with \(|S| \le m-1\) and hence, that no solution involves less than
    \(m\) nodes. The constraints (3.16) ensure that the \(u_i\) variables are uniquely
    defined for any feasible tour.


    If the vector \(y\) describes a Hamiltonian tour on the global graph \(G''\),
    the corresponding best *generalized Hamiltonian tour* (w.r.t. cost minimization)
    \((x, z) \in \{0, 1\}^{|E| \times |V|}\) can be obtained either by determining
    all shortest paths from each edge \(v \in V_{k_1}\) to each \(w'' \in V_{k_1}\)
    that visit exactly one node from clusters \((V_{k_2}, ..., V_{k_m})\), or by solving
    the following 0 - 1 programming problem:


    \(\begin{aligned}

    \min & \sum_{e \in E} c_e x_e, \\

    \text{s.t. } & z(V_k) = 1, \quad \forall k \in K = \{1, ..., m\}, \\

    & x(V_r, V_r) = y_{lr}, \quad \forall l, r \in K = \{1, ..., m\}, \\

    & x(i, V_r) \le z_i, \quad \forall r \in K, \forall i \in V \setminus V_r, \\

    & x_e, z_i \in \{0, 1\}, \quad \forall e = \{i, j\} \in E, \forall i \in V.

    \end{aligned}\)


    For a given \(y\), we denote the feasible set of the linear programming relaxation
    of this program by \(P_{local}(y)\).


    Pop et al. [150] proved that if \(z\) is the 0 - 1 incidence vector of a spanning
    tree of the contracted graph, the polyhedron \(P_{local}(y)\) is integral. But,
    as we will show in the next example, a similar result does not hold when \(y\)
    is the incidence vector of the Hamiltonian tour, because if \(y\) is the 0 - 1
    incidence vector of a Hamiltonian tour on the contracted graph, \(P_{local}(y)\)
    may not be integral.


    If the lines drawn in Figure 3.4 (i.e., \(\{1, 4\}, \{2, 3\}\), etc.) have cost
    \(M \gg 1\), then \(y = \frac{1}{2}\) and \(x = \frac{1}{2}\), on the drawn lines,
    is an optimal solution of \(P_{local}(z)\), showing that the polyhedron \(P_{local}(y)\)
    is not integral.


    The observations presented so far lead to our final formulation, called the local-global
    formulation of the GTSP, as a 0-1 mixed integer programming problem:


    \(\begin{aligned}

    \min & \sum_{e \in E} c_e x_e. \\

    \text{s.t. } & z(V_k) = 1, \quad \forall k \in K = \{1, ..., m\}, \\

    & x(V_r, V_r) = y_{lr}, \quad \forall l, r \in K = \{1, ..., m\},

    \end{aligned}\)'
