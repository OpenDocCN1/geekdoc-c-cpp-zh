    In this section we will describe four algorithmic methods for solving the generalized
    minimum spanning tree problem:


    +   - a branch-and-cut algorithm, based on the undirected cluster subpacking formulation;

    +   - a heuristic method, based on the local-global approach;

    +   - a rooting procedure, based on the local-global integer programming formulation
    of the GMSTP;

    +   - an improved version of the simulated annealing for solving the GMSTP.


    # 2.5.1 A branch-and-cut algorithm for solving the GMSTP


    Branch-and-cut is a combinatorial optimization method for solving integer linear
    programs. The method is a hybrid of branch and bound and cutting plane methods,
    where, after solving the LP relaxation, and having been unsuccessful in pruning
    the node on the basis of the LP solution, we try to find a violated cut. If one
    or more violated cuts are found, they are added to the formulation and the LP
    is solved again. If none are found, we branch. For more information on this method
    we refer to [123].


    In the following, we present the branch-and-cut algorithm for solving the GMSTP,
    as developed by Feremans et al. [40]. This algorithm is based on the undirected
    cluster subpacking formulation of the GMSTP, that was described in subsection
    2.3.1.'
