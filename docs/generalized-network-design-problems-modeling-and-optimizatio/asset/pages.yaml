- pgno: 69
  md: '# 2.6 Notes


    The generalized minimum spanning tree problem (GMSTP) has been introduced by Myung
    et al. [128] in 1995. Since then, several research papers have appeared which
    deal with different aspects of the problem, such as complexity, approximation
    results, integer programming formulations, and solving the problem with exact,
    heuristic, metaheuristic and hybrid algorithms. The problem finds several important
    applications in designing metropolitan area networks [47] and regional area networks
    [173], and in determining the location of the regional service centers [142],
    energy transportation [135], agricultural irrigation [30], etc.


    Within this chapter the following results were presented:


    +   - a survey of the (mixed) integer programming formulations of the GMSTP;

    +   - a local-global approach to the problem, which has lead to the development
    of exact solution procedures, heuristic and metaheuristic algorithms for GMSTP,
    and other generalized network design problems;

    +   - an exact algorithm for the GMSTP

    +   - an approximation algorithm for the problem, in the case where the size of
    the clusters is bounded;

    +   - four algorithmic methods: a branch-and-cut algorithm, based on the the undirected
    cluster subpacking formulation of the GMSTP, a heuristic algorithm, based on the
    local-global approach, a rooting procedure, based on the local-global integer
    programming formulation, and a simulated annealing heuristic for solving the GMSTP.


    The material presented in this chapter is mainly based on the results published
    by Pop [142, 143, 151], Feremans et al. [40] and Pop et al. [149, 154].'
  merge: -1
