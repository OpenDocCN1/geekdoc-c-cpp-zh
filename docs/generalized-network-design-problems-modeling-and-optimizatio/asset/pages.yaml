    # 4.3.4 An ant-based heuristic for solving the RTSP


    Due to the complexity of the RTSP, the problem cannot be solved by means of exact
    methods, within polynomially bounded computation times. Nevertheless, sub-optimal
    solutions are sometimes easy to find. Consequently, it seems reasonable to focus
    on metaheuristic algorithms, that can find near optimal solutions within a reasonable
    running time. Such an approach, based on ant colony optimization, was described
    by Pop et al. [156].


    # The ant colony algorithm for solving the RTSP


    In [137], Pineo et al. proposed a new algorithm, based on the Ant Colony System,
    called the Reinforcing Ant Colony System (RACS), in order to solve the Generalized
    Traveling Salesman Problem.


    For solving the RTSP, the RACS algorithm must be changed, following the characteristics
    of the railway problem. The salesman starts from a specific station (cluster),
    has to visit a given number of stations (cities), spends a minimum amount of time
    in each station, and must finally return to the starting station.'
  merge: -1
  img_proc: true
