    # 2.5.2 A heuristic algorithm for solving the GMSTP


    Simple constructive heuristic algorithms based on Prim''s, Kruskal''s and Sollin''s
    algorithms for the minimum spanning tree problem have been proposed for the GMSTP
    by Feremans [37]. In this section, we will describe a better heuristic algorithm,
    based on the local-global approach.


    We start with some notations. Let \( F^{\text{global}} \) denote the current edge
    set in the complete global graph, \( S^{\text{global}} \) denotes the current
    node set in the complete global graph, \( F \) denotes the current edge set in
    the graph \( G \) and \( S \) denotes the current node set in the graph \( G \).


    Given a global subtree connecting some of the clusters, we denote by \( T \) the
    minimum generalized subtree corresponding to the given connection of the clusters.
    This minimum generalized subtree can be determined easily, using the dynamic programming
    method described in Section 2.2.


