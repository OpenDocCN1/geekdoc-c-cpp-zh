    # ## 3.5.2 Computational results


    To evaluate the performance of our algorithm, the RACS was compared to three other
    heuristics from the literature. For numerical experiments, we used problems from
    the TSPLIB library [177], which provides optimal objective values for each of
    the problems. Several problems involving Euclidean distances have been considered.


    Originally, in these problems, the sets of nodes are not divided into clusters.
    To divide them into subsets, we used the procedure, proposed by Fischetti et al.
    [43], called Clustering. This procedure sets the number of clusters \( nc = \lceil
    n/5 \rceil \), identifies the \( nc \) nodes farthest from each other, called
    centers, and assigns each remaining node to its nearest center. Obviously, some
    real world problems may have different cluster structures, but the solution procedure
    presented in this paper is able to handle any cluster structure.'
