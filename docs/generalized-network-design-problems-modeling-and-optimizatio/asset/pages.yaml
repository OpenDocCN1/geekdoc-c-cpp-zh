- pgno: 42
  md: '# 1. Rounding


    The idea is to solve the linear programming relaxation and then convert the obtained
    fractional solution into an integral solution. The approximation guarantee is
    established by comparing the costs of the integral and fractional solutions.


    Therefore, we find an optimal solution \(x^*\) to the relaxation, and we “round”
    \(x^* \in R\) to an element \(x'' \in S\). Then, we prove that \(f(x'') \le \alpha
    g(x^*)\), which implies that


    \(f(x'') \le \alpha LB \le \alpha OPT.\)


    Often, randomization is helpful. In this case \(x^* \in R\) is randomly rounded
    to some element \(x'' \in S\), such that \(E[f(x'')] \le \alpha g(x^*)\). These
    algorithms can sometimes be derandomized, in which case one finds an \(x''''\)
    such that \(f(x'''') \le E[f(x'')]\).


    An example of the application of the rounding technique is provided by the Minimum
    Weight Vertex Cover Problem, with the result due to Hochbaum [75].


    # 2. Primal-Dual


    We consider the linear programming relaxation of the primal program. This method
    iteratively constructs an integer solution to the primal program and a feasible
    solution to the dual program, \(max\{h(y) : y \in D\}\). The approximation guarantee
    is established by comparing the two solutions.


    The weak duality property of the relaxation implies:


    \(max\{h(y) : y \in D\} \le min\{g(x) : x \in R\}.\)


    We construct \(x \in S\) from \(y \in D\) such that:


    \(f(x) \le \alpha h(y) \le \alpha h(y_{max}) \le \alpha g(x_{min}) \le \alpha
    OPT.\)


    Notice that \(y\) can be any element of \(D\), and must not necessarily be an
    optimal solution to the dual.


    More details about the primal-dual technique can be found in [7] and [203].


    # 2.4.3 A negative result for the GMSTP


    For some hard combinatorial optimization problems it is possible to show that
    they don’t have an approximation algorithm, unless \(\mathcal{P} = \mathcal{NP}\).
    In order to get a result of this form it is enough to show that the existence
    of an \(\alpha\)-approximation algorithm would allow one to solve some decision
    problem, known to be \(\mathcal{NP}\)-complete, in polynomial time.


    Applying this scheme to the GMSTP, we obtain an in-approximability result. This
    result is a different formulation, in terms of approximation algorithms, of a
    result provided by Myung et al. [128], which says that even finding a near optimal
    solution for the GMSTP is \(\mathcal{NP}\)-hard. Our proof is slightly different
    from the proof provided in [128].'
