    columns contain the values of the best solutions, obtained using the adaptive
    large neighborhood search (ALNS) [9], the incremental tabu search (ITS) [126],
    and our proposed methods: the hybrid algorithm and the memetic algorithm.


    If we analyze the computational results reported in Table 5.1 (Parts 1 and 2)
    and Table 5.2 (Parts 1 and 2), we can observe that our proposed memetic algorithm
    performs slightly better compared to all other approaches for solving both small
    and medium size instances. We were able to improve the best known solutions for
    6 out of 148 instances. In one instance, P-n55-k15-C28-V8, the solution returned
    by our algorithm exhibits a gap of 0.01 %, with the best known solution provided
    by the ALNS. The rest of the instances for which the optimal solution is known,
    we solved optimally with our algorithm. The proposed hybrid algorithm is comparable
    with the other existing approaches for solving the GVRP, in terms of the quality
    of the solutions.


    We next present the results of the computational experiments on the large-scale
    instances generated using $\theta = 2$ and $\theta = 3$ in Tables 5.3 and 5.4,
