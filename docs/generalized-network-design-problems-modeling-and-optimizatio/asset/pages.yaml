  md: 'structured solutions, we used a Monte Carlo based method. However, from carrying
    out the experiments we learned that the Monte Carlo method of generating the initial
    population has not brought any improvements. Randomly generating the initial population
    has the advantage that it is representative for any area of the search space.


    # Genetic operators


    # Crossover


    Two parents are selected from the population by the binary tournament method.
    Offspring are produced from two parent solutions, using a 2-point order crossover
    procedure that creates offspring which preserves the order and position of symbols
    in a subsequence of one parent, while preserving the relative order of the remaining
    symbols from the other parent. The procedure is implemented by selecting two random
    cut points which define the boundaries for a series of copying operations.


    The recombination of two collections of global routes requires some further explanation.
    First, the symbols between the cut points are copied from the first parent to
    the offspring. Then, starting just after the second cut-point, the symbols are
    copied from the second parent to the offspring, omitting any symbols that were
    copied from the first parent. When the end of the second parent sequence is reached,
    this process continues with the first symbol of the second parent until all symbols
    have been copied to the offspring. The second offspring is produced by swapping
    the parents and then using the same procedure.


    Next, we present the application of the proposed 2-point order crossover in the
    case of a problem consisting of 8 cutters and the depot. We assume two well-structured
    parents chosen randomly, with cutting points between nodes 3 and 4, respectively
    6 and 7:


    ```

    P1 = 6 8 1 | 0 2 7 | 0 5 4 3

    P2 = 8 2 1 | 6 0 4 | 3 5 7

    ```


    Note that the length of each individual differs according to the number of routes.


    The sequences between the two cutting-points are copied to the two offspring


    ```

    O1 = x x x | 0 2 7 | x x x x

    O2 = x x x | 6 0 4 | x x x .

    ```


    The nodes of the parent P1 are copied to the offspring O2 if O2 does not contain
    already the clusters of P1 and therefore the offspring O2 is


    ```

    O2 = 8 1 2 | 6 0 4 | 7 0 5 3 .

    ```


    Then the nodes of parent P2 are copied to the offspring O1 in the same manner.
    The nodes of the clusters not present in O1 are copied into the remaining positions


    ```

    O1 = 8 1 6 | 0 2 7 | 0 4 3 5 .

    ```'
