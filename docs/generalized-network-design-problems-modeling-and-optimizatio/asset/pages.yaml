- pgno: 70
  md: '# Chapter 3


    # The Generalized Traveling Salesman Problem (GTSP)


    The traveling salesman problem (TSP) certainly is one of the classical and most
    intensively studied and analyzed representatives of combinatorial optimization
    problems, with a lot of solution methodologies and several applications in, e.g.
    logistics, transportation, planning, microchips manufacturing, DNA sequencing,
    etc.


    Some mathematical problems related to the TSP were treated in the 1800s by W.R.
    Hamilton and the TSP already appeared in the literature in the early 19th century.
    It was published in Vienna, in the 1930s, by the mathematician and economist Karl
    Menger [120] and later was promoted by H. Whitney and M. Flood in the circles
    of Princeton, being named the traveling salesman problem.


    Comparing the TSP to other combinatorial optimization problems, the main difference
    is that very powerful problem-specific methods, such as the Lin–Kernighan algorithm
    [113] and effective branch and bound methods are available, that are able to achieve
    a global optimal solution in very high problem dimensions.


    Several extensions of the TSP have been considered in the literature: the time-dependent
    TSP, the bottleneck TSP, TSP with profits, TSP with mixed deliveries and collections,
    TSP with backhauls, one commodity pickup and delivery TSP, the multiple TSP, etc.


    In this chapter, we are concerned with an extension of the traveling salesman
    problem (TSP) called the the generalized traveling salesman problem (GTSP). Given
    a complete undirected graph whose nodes are partitioned into a number of subsets
    (clusters) and with nonnegative costs associated to the edges, the GTSP consists
    of finding a minimum-cost Hamiltonian tour including exactly one node from each
    cluster. Therefore, the TSP is a special case of the GTSP, where each cluster
    consists of exactly one node.


    A variant of the GTSP is the problem of finding a minimum cost Hamiltonian tour
    including at least one vertex from each cluster. This problem was introduced by
    Laporte and Nobert [103] and by Noon and Bean [133].


    The GTSP has several applications to location problems, telecommunication problems,
    railway optimization, planning, postal routing, manufacture of microchips, logistics,
    computer file sequencing, etc. More information on the problem and its applications
    can be found in Fischetti, Salazar and Toth [42, 43], Laporte, Asef-Vaziri and
    Sriskandarajah [105], Laporte and Nobert [103], etc.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 3.1 Definition and complexity of the GTSP


    The generalized traveling salesman problem (GTSP) seeks to find a minimum-cost
    tour H, spanning a subset of nodes, such that H contains exactly one node from
    each cluster V_i, i \in {1, ..., m}.


    We will call such a cycle a generalized Hamiltonian tour. An example of a generalized
    Hamiltonian tour, for a graph with nodes partitioned into 6 clusters, is presented
    in Figure 3.1.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_71_0.png)


    Figure 3.1. Example of a generalized Hamiltonian tour.


    The GTSP involves two related decisions:


    +   - choosing a node subset S \subseteq V, such that |S \cap V_k| = 1, for all
    k = 1, ..., m.

    +   - finding a minimum cost Hamiltonian cycle in the subgraph of G, induced by
    S.


    Both the GTSP and the at least version of the GTSP are NP-hard, since they reduce
    to the traveling salesman problem, when each cluster consists of exactly one node.


    # 3.2 An efficient transformation of the GTSP into the TSP


    Because of the complexity of generalized network design problems, efficient transformations
    of these problems into classical combinatorial optimization problems seem to be
    an appropriate approach. In addition, for the classical combinatorial optimization
    problems, there exist many heuristic and optimal solution methods.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Motivated by the fact that there exists a large variety of exact and heuristic
    algorithms for TSP, see for example [64, 109], several efficient transformations
    of the generalized traveling salesman problem into TSP have been developed:


    +   • the first transformation of the GTSP was described by Noon and Bean [134].
    They transformed the GTSP into a standard asymmetric TSP over the same number
    of nodes, using a two stages approach: in the first stage the GTSP was transformed
    into a clustered TSP, which was then transformed into a standard asymmetric TSP.
    Ben-Arieh et al. [10] investigated the Noon and Bean transformation in computational
    experiments.


    +   • Lien, Ma and Wah [112] provided a transformation of the GTSP into classical
    TSP, in which the number of nodes of the transformed TSP was quite large, in fact
    more than three times the number of nodes in the associated GTSP.


    +   • Dimitrijević and Saric [26] developed another transformation, that decreased
    the size of the corresponding TSP. In their method, the number of nodes of the
    TSP was twice the number of nodes of the original GTSP.


    +   • Behzad and Modarres [8] provided an efficient transformation, in which the
    number of nodes in the transformed TSP does not exceed the number of nodes in
    the original GTSP.


    In the following, we will describe the efficient transformation of the GTSP into
    the TSP proposed by Behzad and Modarres [8], which is a modification of the transformation
    developed by Dimitrijević and Saric [26]. It should be mentioned that, although
    in the transformation, the underlying TSP is represented by a directed graph,
    the graph associated with the GTSP is not necessarily a directed one.


    Let \(v_i^f\) denote the i-th node of the cluster \(V_r\). We define the TSP on
    a directed graph \(G''\) associated to \(G\) as follows:


    +   1. The set of nodes of G and G'' are identical.


    +   2. All nodes of each cluster are connected by arcs into a cycle in G''. We
    denote by \(v_{i(t)}^f\) the node following \(v_i^f\) in the cycle.


    +   3. The costs of the arcs of the transformed graph G'' are defined as:


    ```

    \(c''(v_i^f, v_{t(o)}^f) = 0\)

    ```


    and


    ```

    \(c''(v_i^f, v_j^f) = c(v_{t(o)}^f, v_j^f) + M . \quad r \neq t\)

    ```


    where M must be a sufficiently large number, for example \(\sum_{(i,j) \in E}
    c(i,j)\).'
