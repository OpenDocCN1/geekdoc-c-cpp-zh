    \ \\(k\\) in arc \\((i, j)\\) we obtain the following formulation:\n\n```\n\\\
    (\\begin{aligned}\n\\min & \\sum_{e \\in E} c_e x_e. \\\\\n\\text{s.t.} & \\quad\
