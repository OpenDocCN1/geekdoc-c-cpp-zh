    clusters. The constraints (5.43) initialize the variables \(v_i\)’s for each cluster.


    # A flow based formulation for CGVRP


    We introduce a new flow variable \(t_{ij}\) as the number of arcs visited within
    a given cluster on the route of a vehicle after just leaving the \(i\)-th node,
    if the vehicle goes from node \(i\) to node \(j\), or zero otherwise.


