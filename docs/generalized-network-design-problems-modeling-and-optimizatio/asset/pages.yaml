    incoming edge (the one from the corresponding departure node), and a single out-going
    edge (to some departure node of the same station), whereas there are no busy edges
    starting from them. Therefore, we can eliminate these nodes (as well as their
    adjacent edges), and introduce a new virtual edge connecting the departure node
    that was the source of the incoming edge to the departure node that was the target
    of the outgoing edge, with a cost of the sum of the costs of the two eliminated
    edges. In this way, we can reduce the number of edges and nodes in the graph and,
    consequently, the number of variables and constraints in the integer program.


    The construction of the graphs is based both on synthetic as well as on real-world
    data. For the synthetic case, we have considered grid graphs (with nodes representing
    stations). Each node has connections (in both directions) with all its neighboring
    nodes, i.e., the stations located immediately next to it in its row or column
    in the grid.


    Note that the number of connections is equal to half the number of nodes, since
    two nodes form one connection, and the number of edges is twice the number of
    nodes. The number of edges does not include the incoming edges of $s_f$ and the
    outgoing edge of $s_0$ or any other artificial nodes or edges.


