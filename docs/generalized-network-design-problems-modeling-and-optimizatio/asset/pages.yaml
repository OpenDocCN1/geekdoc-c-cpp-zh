    # ## 3.5.4 Computational results


    The performance of the proposed algorithm has been tested on 18 GTSP problems
    generated from symmetric Euclidean TSP instances. These TSP instances, containing
    between 198 and 442 nodes, are drawn from the TSPLIB [209] benchmark library.
    The corresponding GTSP problems are obtained by applying the CLUSTERING procedure
    introduced in [43]. For 16 of these GTSP instances, the optimum objective values
    have been determined for Fischetti et al. [43]. For the remaining 2 instances,
    the best known results are conjectured to be optimal.


