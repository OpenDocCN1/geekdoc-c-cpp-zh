- pgno: 157
  md: '# 5.6 Solving the Generalized Vehicle Routing Problem


    Despite the importance of the GVRP in the real world, due to the many interesting
    applications, not much much research has been done on the problem until recently.
    Ghiani and Improta [48] proposed a solution procedure that transforms the GVRP
    into a capacitated arc routing problem for which an exact algorithm and several
    approximate procedures are reported in literature.


    Recently, some specific algorithms have been proposed for solving the GVRP, which
    are an ant colony based algorithm, described by Pop et al. [158], a genetic algorithm,
    proposed by Pop et al. [162], a branch-and-cut algorithm and an adaptive large
    neighborhood search, proposed by Bektaş et al. [9], an incremental tabu search
    heuristic described by Moccia et al. [126], and an improved genetic algorithm
    proposed by Pop et al. [168].


    In this section, we will describe two algorithmic methods for solving the generalized
    vehicle routing problem:


    +   • A hybrid algorithm based on a genetic algorithm applied to the global graph.


    +   • a novel memetic algorithm, that combines a genetic algorithm (GA) with a
    powerful local search (LS) procedure.


    # 5.6.1 An improved hybrid algorithm for Solving the GVRP


    In this section we describe a hybrid heuristic algorithm that combines a genetic
    algorithm (GA) with a local-global approach to the problem and with a powerful
    local search (LS) procedure. Some of the advantages of the proposed heuristic
    are that we considerably reduce the search space by using the GA with respect
    to the global graph, and the power and diversity of the local search heuristic.


    # The local-global approach to the GVRP


    In the case of the GVRP, as in the case of the other generalized network design
    problems, the local-global approach aims at distinguishing between global connections
    (connections between clusters) and local connections (connections between nodes
    belonging to different clusters).


    We denote by G'' the graph obtained from G after replacing all nodes of a cluster
    Vi with a supernode representing Vi, Vi ∈ {1, ..., m}, the cluster V0 (depot)
    already consists of one vertex. We will call the graph G'' the global graph. For
    convenience, we identify Vi with the supernode that represents it and we suppose
    that the edges of the graph G'' are defined between each pair of graph vertices
    V0, V1, ..., Vm.


    Given a solution in the global graph, i.e. a collection of r global routes of
    form (V0, Vk1, ..., Vkn) in which the clusters are visited, we want to find the
    best feasible route R* (w.r.t. cost minimization), i.e. a collection of r generalized
    routes visiting the clusters according to the given sequence.'
