- pgno: 23
  md: 'the directed edges \(\{u, v\}\) in the orientation. The leaves of the tree
    are those vertices without children.


    Let \(W(T(v))\) denote the minimum weight of a generalized subtree rooted at \(v\).
    We want to compute


    ```

    \(\min_{r \in V_{root}} W(T(r)).\)

    ```


    We are now ready to present the dynamic programming recursion for solving the
    subproblem \(W(T(v))\). The initialization is:


    ```

    \(W(T(v)) = 0. \quad \text{if } v \in V_k \text{ and } V_k \text{ is a leaf of
    the global spanning tree.}\)

    ```


    To compute \(W(T(v))\) for a vertex \(v \in V\) interior to a cluster, i.e., to
    find the optimal solution of the subproblem \(W(T(v))\), we have to look at all
    vertices from the clusters \(V_l\) such that \(C(v) \cap V_l \neq \emptyset\).
    If \(u\) denotes a child of the interior vertex \(v\), then the recursion for
    \(v\) is as follows:


    ```

    \(W(T(v)) = \sum_{l, C(v) \cap V_l \neq \emptyset} \min_{u \in V_l} [c(v, u) +
    W(T(u))].\)

    ```


    Hence, for fixed \(v\), we have to check at most \(n\) vertices. Consequently,
    for the given global spanning tree, the overall complexity of this dynamic programming
    algorithm is \(O(n^2)\). Since, by Cayley''s formula, the number of all distinct
    global spanning trees is \(m^{m-2}\), we have established the following:


    **Theorem 2.2.** There exists a dynamic programming algorithm which provides an
    exact solution to the GMSTP in \(O(m^{m-2}n^2)\) time, where \(n\) is the number
    of nodes and \(m\) is the number of clusters in the input graph.


    Clearly, the above is an exponential time algorithm, unless the number of clusters
    \(m\) is fixed.


    A similar dynamic programming algorithm can provide an exact solution to the prize
    collecting generalized minimum spanning tree problem, with the difference that
    the dynamic programming recursion to solve the subproblem \(W(T(v))\) for a node
    \(v \in G\), should be considered as follows:


    ```

    \(W(T(v)) = \sum_l L, C(v) \cap V_l \neq \emptyset \min_{u \in V_l} [c(v, u) +
    d(u) + W(T(u))].\)

    ```


    where by \(d(u)\) we denote the cost associated to the node \(u\).'
