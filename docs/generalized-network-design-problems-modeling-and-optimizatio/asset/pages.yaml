    1 & \text{if the node } i \in V \text{ is included in the selected subgraph} \\
    0 & \text{otherwise} \end{cases}, \quad y_{lr} = \begin{cases} 1 & \text{if cluster
    } V_l \text{ is connected to cluster } V_r \text{ in the global graph} \\ 0 &
    \text{otherwise} \end{cases}, \quad f_{lr}^k = \begin{cases} 1 & \text{if a flow
    } f \text{ of commodity } k \text{ exists from cluster } V_l \text{ to cluster
    } V_r \\ 0 & \text{otherwise} \end{cases}

    ```


    where \( l, r \in \{1, \dots, m\} \) and \( k \in \{2, \dots, m\} \).


    The formulation consists of two parts. The first part, called the multi-commodity
    flow part, operates on the global graph and is based on sending from the root
    cluster \( V_1 \) two units of flow \( f \) to every other cluster, using edge-disjoint
    routes. The flows for different clusters are distinguished by their commodity
    \( k \). The second part, called the local-global part, described in Section 2.5.3
    relates the local variables \( x_{ij} \) and \( z_i \) to the global variables
    \( y_{lr} \), describing the connections between clusters.


    ```

    \begin{aligned}

    \min \sum_{e \in E} c_e x_e \\

    s.t. \quad \sum_{l=1}^m f_{lr}^k - \sum_{r=1}^m f_{rp}^k = \begin{cases} -2 &
    \text{if } r=1 \\ 2 & \text{if } r=k, \quad \forall r \in \{1, \dots, m\}, \\
    0 & \text{else} \end{cases} \quad \forall k \in \{2, \dots, m\}, \quad (7.1) \\

    f_{lr}^k + f_{rl}^k \le 1 \quad \forall l, r \in \{1, \dots, m\}, \forall k \in
    \{2, \dots, m\} \quad (7.2) \\

    \sum_{i \in V_k} z_i = 1, \quad \forall k \in K = \{1, \dots, m\}, \quad (7.3)
    \\

    x(V_l, V_r) = y_{lr}, \quad \forall l, r \in K = \{1, \dots, m\}, l \neq r \quad
    (7.4) \\

    x_{ij} \le z_i, \quad \forall i \in V_l, \forall j \in V \setminus V_l, \forall
    l \in \{1, \dots, m\}, \quad (7.5) \\

    y_{lr} \ge f_{lr}^k, \quad \forall l, r \in \{1, \dots, m\} l \neq r \quad \forall
    k \in \{2, \dots, m\}, \quad (7.6) \\

    f_{lr}^k \ge 0, \quad \forall l, r \in \{1, \dots, m\}, \forall k \in \{2, \dots,
    m\}, \quad (7.7) \\

    y_{lr} \in \{0, 1\}, \quad \forall l, r \in \{1, \dots, m\}, \quad (7.8) \\

    x_e, z_i \in \{0, 1\}, \quad \forall e = (i, j) \in E, \forall i \in V, \quad
    (7.9)

    \end{aligned}

    ```


    where \( x(V_l, V_r) = \sum_{i \in V_l, j \in V_r} x_{ij} \).'
