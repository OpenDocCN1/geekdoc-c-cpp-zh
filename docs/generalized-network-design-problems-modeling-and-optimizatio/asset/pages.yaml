- pgno: 74
  md: '![](img/8ee31706d554c7b9e05caa9ab83aec83_74_0.png)


    Figure 3.2. Illustration of the GTSP and the associated TSP with their optimal
    solutions.


    Let G'' be the graph obtained from G after replacing all nodes of a cluster $V_i$
    with a supernode representing $V_i$. For convenience, we identify $V_i$ with the
    supernode that represents it. We assume that $G''$, with vertex set $\{V_1, ...,
    V_m\}$, is complete.


    Given a sequence in which the clusters are visited $(V_{k_1}, ..., V_{k_m})$,
    we want to find the best feasible Hamiltonian tour $H^*$ (w.r.t. cost minimization),
    visiting the clusters according to the given sequence. This can be done in polynomial
    time, by solving $|V_{k_1}|$ shortest path problems as we will describe below.


    We construct a layered network, depicted in Figure 3.3, having $m + 1$ layers
    corresponding to the clusters $V_{k_1}, ..., V_{k_m}$. In addition, we duplicate
    the cluster $V_{k_1}$. The layered network contains all nodes of $G$ plus some
    extra nodes $v''$ for each $v \in V_{k_1}$. There is an edge $\{i, j\}$ for each
    $i \in V_{k_l}$ and $j \in V_{k_{l+1}}$ ($l = 1, ..., m - 1$), with cost $c_{ij}$.
    Moreover, there is an edge $\{i, j''\}$ for each $i \in V_{k_m}$ and $j'' \in
    V_{k_1}$, with cost $c_{ij}''$.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_74_1.png)


    Figure 3.3. Example of a generalized Hamiltonian tour in the constructed layered
    network LN.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'For any given \( v \in V_{k_1} \), we consider paths from \( v \) to \( v'',
    w'' \in V_{k_1} \), that visit exactly one node from each cluster \( V_{k_2},
    \dots, V_{k_m} \), hence giving it a feasible generalized Hamiltonian tour.


    Conversely, each generalized Hamiltonian tour visiting the clusters according
    to the sequence \( (V_{k_1}, \dots, V_{k_m}) \) corresponds to a path in the layered
    network from a certain node \( v \in V_{k_1} \) to \( w'' \in V_{k_1} \).


    Therefore, it follows that the best generalized Hamiltonian tour \( H^* \) (w.r.t.
    cost minimization) visiting the clusters in a given sequence, can be found by
    determining all shortest paths from each \( v \in V_{k_1} \) to the corresponding
    \( v'' \in V_{k_1} \), that visit exactly one node from each of the clusters \(
    (V_{k_2}, \dots, V_{k_m}) \).


    The overall time complexity then is \( |V_{k_1}| (O(|E| + \log n)) \), i.e. \(
    O(n|E| + n \log n) \) in the worst case. We can reduce the time by choosing \(
    |V_{k_1}| \) as the cluster with minimum cardinality.


    Notice that the above procedure leads to an \( O((m-1)!(n|E| + n \log n)) \) time
    exact algorithm for the GTSP, obtained by trying all the \( (m-1)! \) possible
    cluster sequences. So, we have established the following result:


    # Theorem 3.2. The above procedure provides an exact solution to the generalized
    traveling salesman problem in \( O((m-1)!(n|E| + n \log n)) \) time, where \(
    n \) is the number of nodes, \( |E| \) is the number of edges and \( m \) is the
    number of clusters in the input graph.


    Clearly, the presented algorithm is an exponential time algorithm, unless the
    number of clusters \( m \) is fixed.


    # 3.4 Integer programming formulations of the GTSP


    # 3.4.1 Formulations based on the properties of Hamiltonian tours


    In order to formulate the GTSP problem as an integer program, we introduce the
    binary variables \( x_e \in \{0, 1\} \), \( e \in E \) and \( z_i \in \{0, 1\}
    \), \( i \in V \), to indicate whether an edge \( e \) respectively node \( i
    \) is contained in the Hamiltonian tour. A feasible solution to the GTSP can be
    seen as a cycle with \( m \) edges, connecting all clusters and exactly one node
    from each cluster. Therefore the GTSP can be formulated as the following integer
    programming problem:


    ```

    min \(\sum_{e \in E} c_e x_e\)

    s.t. \(x(V_k) = 1, \quad \forall k \in K = \{1, \dots, p\},\) (3.1)

    \(x(\delta(i)) = z_i, \quad \forall i \in V,\) (3.2)

    \(x(E(S)) \le z(S - \{i\}), \quad \forall i \in S \subset V, 2 \le |S| \le n -
    2.\) (3.3)

    ```'
