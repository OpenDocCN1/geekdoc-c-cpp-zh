  md: 'During the sabbatical leave, a consultant uses a random proportional rule to
    decide which cluster to visit next. For a consultant $k$, currently at cluster
    $V_i$, the probability to choose cluster $V_j$ is given by the following formula:


    $$p_{ij}^k = \frac{1/d_{ij}}{\sum_{l \in \mathcal{N}_i^k} (1/d_{il})}$$ (3.24)


    where $\mathcal{N}_i^k$ is the feasible neighborhood of person $k$ when at cluster
    $V_i$ and $d_{il}$ is the virtual distance between clusters $V_i$ and $V_j$.


    As mentioned before, the feasible neighborhood $\mathcal{N}_i^k$ contains the
    set of clusters in the candidate list of cluster $V_i$ that person $k$ has not
    yet visited. If all clusters in the candidate list have already been visited,
    the consultant may choose one of the clusters not in the candidate list, by using
    a random proportional rule similar to the one given by formula (3.24).


    Use of virtual distances between clusters as a heuristic during sabbatical leave,
    leads to reasonably good initial strategies. In general, however, after applying
    the cluster optimization procedure, a global tour that is optimum with respect
    to the virtual distances between clusters, does not produce the optimum generalized
    tour. Therefore, during the solution construction phase, the algorithm does not
    rely on the distances between clusters, although it still uses candidate lists
    in order to determine the feasible neighborhood of a cluster.


    In each step, a client receives a recommendation for the next cluster to be visited.
    This recommendation is based on the global tour advertised by the consultant.
    Let $V_i$ be the cluster visited by client $k$ during a construction step in the
    current iteration. To decide which cluster to recommend for the next step, the
    consultant finds the position at which the cluster $V_i$ appears in its advertised
    global tour and identifies the clusters preceding and succeeding $V_i$ in this
    tour. If neither of these clusters has already been visited by the client, the
    consultant randomly recommends one of them. If only one is unvisited, this one
    is chosen as the recommendation. Finally, if both clusters are already visited,
    the consultant is not able to make a recommendation for the next step.


    The client does not always follow the consultant''s recommendation. The rule used
    for choosing the next cluster $V_j$ to move to, is given by the following formula:


    $$V_j = \begin{cases} v & \text{if } v \neq null \land q \le q_0 \\ \text{random}(\mathcal{N}_i^k)
    & \text{otherwise.} \end{cases}$$ (3.25)


    where:


    +   - $V_p$ is the cluster recommended by the consultant for the next step;

    +   - $q$ is a random variable uniformly distributed in [0,1] and $q_0$ ($0 \le
    q_0 \le 1$) is a parameter;'
  merge: -1
