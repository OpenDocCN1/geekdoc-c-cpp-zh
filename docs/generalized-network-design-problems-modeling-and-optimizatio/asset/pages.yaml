    # 4.4 Dynamic Railway Traveling Salesman Problem


    After an initial emphasis on static problems, part of our focus now shifts towards
    dynamic variants of combinatorial optimization problems. Recently, research has
    been done on ACO for dynamic problems, see [61, 62, 63, 108].


    The Dynamic Railway Traveling Salesman Problem, denoted DR TSP, and introduced
    by Pop et al., is a variation on the RTSP in the sense that it is assumed that
    the distances between cities, determined as the travel times, are no longer fixed.
    In real life, This situation is encountered, when delays due to maintenance work,
    accidents, etc., may occur. Therefore, the travel times may vary.


    In the definition given below, we verbally define what we mean when we talk about
    a static RTSP.'
