    Analyzing Tables 5.3 and 5.4, we see that, overall, in the case of large-size
    instances, our memetic algorithm performs better, in comparison to ALNS and ITS
    heuristics, while the hybrid algorithm provides the same solution as ALNS and
    ITS heuristics in 7 out of 10 instances. In the other 3 instances, the solution
    returned by our algorithm exhibits a gap to the best known solution provided at
