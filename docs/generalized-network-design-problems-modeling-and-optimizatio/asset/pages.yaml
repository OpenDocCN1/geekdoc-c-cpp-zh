  md: '# 2. Final value of the control parameter.


    The stopping criteria that we used, determining the final value of the control
    parameter, was specified by fixing the number of values \( T_k \), for which the
    algorithm is to be executed, ending on a suitably low temperature.


    # 3. Number of repetitions at each temperature.


    The number of iterations at each temperature, which is related to the size of
    the neighborhoods, may vary from temperature to temperature. It is important to
    stay at lower temperatures for a long time, to ensure possible local optima have
    been fully explored. Therefore, we increased the value of \( L \) arithmetically
    (by adding a constant factor).


    # 4. Decrementing the control parameter.


    We used the following decrement rule:


    \(\alpha(T) = rT\)


    where \( r \) is a constant smaller than but close to 1, called the cooling rate.


    As in [90], we used \( r = 0.95 \). This corresponds to a fairly slow cooling
    process.


    In the following, we present the problem specific decisions.


    # Solution space


    We define the solution space as the set of all the feasible solutions. Suppose
    that the graph \( G = (V, E) \) consists of \( n \) nodes which are partitioned
    into \( m \) clusters \( V_1, \dots, V_m \), all having the same number of nodes,
    i.e.


    \( |V_1| = \dots = |V_m| = \frac{n}{m} \).


    By Cayley''s formula, we know that the total number of global spanning trees (i.e.
    trees connecting the clusters) is equal to \( m^{m-2} \). Given a global spanning
    tree there are \( (\frac{n}{m})^m \) possible generalized spanning trees (feasible
    solutions of the GMSTP).


    Therefore, the solution space of the GMSTP contains


    \( m^{m-2} \cdot \left( \frac{n}{m} \right)^m = n^m \cdot m^{-2} \)


    elements. The number of elements in the solution space is exponentially large,
    so that they cannot be explored exhaustively.


    # Objective function


    We will consider the objective function of the integer programming formulations
    of the GMSTP, described in Section 2.3.


    # Initialization


    Simulated Annealing is an improvement heuristic, which requires an initial solution.
    It is desirable to start with a relatively good solution (as compared with, for
    example,'
