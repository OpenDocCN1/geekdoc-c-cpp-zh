  md: 'After the size reduction procedure, $G$ consists only of stations $\sigma \in
    B$, their arrival and departure-nodes, the edges connecting them, and the newly
    added shortest path edges.


    # An integer linear programming formulation


    The objective of the RTSP is to find a tour from node $s_0$ to node $s_f$ that
    passes through each station $b \in B$, with minimum total cost.


    In order to model the RTSP problem as an Integer Linear Program (ILP), we introduce
    for each edge $(u, v)$ a variable $x_{(u,v)} \in \mathbb{N}_0$ that indicates
    the number of times the salesman uses the edge $(u, v)$. If $c(u, v)$ denotes
    the cost of edge $(u, v)$, then the ILP becomes:


    ```

    \begin{align*}

    \min \sum_{(u,v) \in E} c(u, v) x_{(u,v)}, \qquad & (4.1) \\

    s.t. \sum_{(v,u) \in E} x_{(v,u)} - \sum_{(u,v) \in E} x_{(u,v)} = 0, \qquad &
    \forall u \in V \setminus \{s_0, s_f\} \quad (4.2) \\

    x_{(s_0, d_0)} = \sum_{(v, s_f) \in E} x_{(v, s_f)} = 1 \qquad & (4.3) \\

    \sum_{e \in Busy(b)} x_e \ge 1, \qquad & \forall b \in B \quad (4.4) \\

    x_e \in \mathbb{N}_0, \qquad & \forall e \in E. \quad (4.5)

    \end{align*}

    ```


    The constraints (4.2) and (4.3) are the flow conservation constraints that form
    a path from node $s_0$ to node $s_f$, whereas the constraints (4.4) ensure that
    the salesman spends the required time at each station $b \in B$.


    The problem with the formulation so far is that it permits feasible solutions
    that contain cycles disjoint from the rest of the path (subtours). To deal with
    this problem, we have to add more constraints which will force the solution to
    not use any subtours.


    Suppose that the selected stations are numbered from 0 to $|B| - 1$. For each
    such station $i$, we introduce a new node $f_i$ called the *sink node* of that
    station. Moreover, we create a copy $d_k^i$ for the $k$-th departure node $d_k^i$
    of station $i$ that has one or more incoming busy edges. We connect this new node
    to the original node with a zero cost edge. All busy edges now point to $d_k^i$
    instead to $d_k^i$, whereas all other edges remain unchanged. We also add an edge
    $(d_k^i, f_i)$, for all $k$, such that $d_k^i \in V$. An example is given in Figure
    4.2.'
