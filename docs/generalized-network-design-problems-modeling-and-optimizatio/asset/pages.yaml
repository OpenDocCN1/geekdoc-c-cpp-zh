  md: 'The new algorithm enforces construction of a valid solution, used in (ACS),
    with an update pheromone rule as in [140] and pheromone evaporation as in Stützle
    and Hoos, [194].


    Let \( V_k(v) \) denote the node \( v \) from the cluster \( V_k \). The RACS
    algorithm for the GTSP works as follows:


    +   • Initially, the ants are placed in the nodes of the graph, choosing random
    *clusters* and randomly selecting a node from the chosen cluster.


    +   • At iteration \( t+1 \), each ant moves to a new node in an unvisited *cluster*,
    and the parameters controlling the algorithm are updated.


    Each edge is labeled by a trail intensity. Let \( \tau_{ij}(t) \) represent the
    trail intensity of edge \( (i, j) \) at time \( t \). When an ant decides which
    node it moves to next, it does so with a probability based on the distance to
    that node (i.e. cost of the edge) and the amount of trail intensity on the connecting
    edge.


    The inverse of the distance from a node to the next node, is known as the *visibility*,
    \( \eta_{ij} = \frac{c_{ij}}{d_{ij}} \).


    +   • During each unit of time, evaporation takes place, to stop the intensity
    trails from increasing unbounded. The rate evaporation is denoted by \( \rho \),
    and its value is between 0 and 1.


    In order to stop ants from visiting the same *cluster* in the same tour a tabu
    list is maintained. This prevents ants from visiting *clusters* they have previously
    visited. The ant tabu list is cleared after each completed tour.


    +   • To favor selection of an edge with high pheromone value, \( \tau \), and
    high visibility \( \eta \), a probability function \( p^k_{iu} \) is considered.
    Denoting by \( J^k_i \) the neighbors of node \( i \) unvisited by ant \( k \)
    and letting \( u \in J^k_i, u = V_k(v) \) being the node \( v \) from the unvisited
    cluster \( V_k \), this probability function is defined as follows:


    ```

    \( p^k_{iu}(t) = \frac{[\tau_{iu}(t)][\eta_{iu}(t)]^\beta}{\sum_{o \in J^k_i}
    [\tau_{io}(t)][\eta_{io}(t)]^\beta}.\) (3.17)

    ```


    where \( \beta \) is a parameter used for tuning the relative importance of the
    edge cost in selecting the next node.


    If \( q > q_0 \), \( p^k_{iu} \) is the probability of choosing \( j=u \), where
    \( u = V_k(v) \) is the next node (the current node is \( i \)).


    If \( q \le q_0 \) the next node \( j \) is chosen as follows:


    ```

    \( j = \arg\max_{u \in J^k_i} \{ [\tau_{iu}(t)][\eta_{iu}(t)]^\beta \}\) (3.18)

    ```


    where \( q \) is a random variable uniformly distributed in the interval \( [0,
    1] \), and \( q_0 \) is a parameter similar to the temperature in simulated annealing,
    with \( 0 \le q_0 \le 1 \).'
