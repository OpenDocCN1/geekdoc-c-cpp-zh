    (b) backbone network.


    The clusters, on the other hand, are not connected but have to be connected by
    a backbone network, in order to be able to communicate. In Figure 6.2 b) such
    a possible backbone network is presented.


    # ## 6.2 Integer programming formulations of the GFCNDP


    Given an undirected graph \( G = (V, E) \), the associated directed graph is obtained
    by replacing each edge \( e = \{i, j\} \in E \) with the opposite arcs \( (i,
    j) \) and \( (j, i) \) with the same weight as the edge \( \{i, j\} \in E \).
    In order to model the GFCND problem as a mixed integer programming problem, we
    define the following related sets, parameters and decision variables


    # ### Sets and notations:


    +   - \( V \) – the set of all the nodes, \( i \in V \).

    +   - \( V_1, \dots, V_m \) – a partition of \( V \) into \( m \) subsets called
    *clusters*.

    +   - \( E \) – the set of edges (unordered node-pairs), \( e \in E \).

    +   - \( A \) – the set of arcs (ordered node-pairs), \( a \in A \).

    +   - \( D \) – the set of commodities which represent the demands to be satisfied
    between any unordered cluster-pair, \( d \in D \).

    +   - \( s_a \) and \( t_a \) – denote the start and terminating nodes of arc
    \( a \).

    +   - \( s_d \) and \( t_d \) – denote the start and terminating clusters of demand
    \( d \).'
