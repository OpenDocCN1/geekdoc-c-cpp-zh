    # 4.4.2 Implementation details and computational results


    The initial value of all pheromone trails, $\tau_0 = 0.1$. As in all other ant
    systems, the parameters chosen for the algorithm are critical. Currently, no mathematical
    analysis has been developed to give optimal parameter values in each situation.
    In our algorithm, for both static and dynamic RTSP, the values of the parameters
    were chosen as $\alpha = 1, \beta = 2, \rho = 0.001, q_0 = 0.5$. The number of
    ants considered is $m = 10$ for $B = 5$ and $m = 100$ for $B = 10$. Each ant makes
    100 tours in order to find a good one.


    The experiments were conducted on synthetic as well on real-world data. We used
    the same real-world data as in [67] representing part of the railroad network
