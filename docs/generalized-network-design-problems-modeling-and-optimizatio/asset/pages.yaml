  md: 'Since now the only way to reach \(f_i\) is through the busy edges of station
    \(i\), the flow modeled by the \(x\) variables is forced to use some busy edge
    for each selected station, which makes the constraints (4.4) redundant.


    The reason that the variables \(x_{(u,v)}\) (\(u, v) \in E\), are not restricted
    to be 0-1 variables is the fact that the salesman is allowed to pass through the
    same station \(\sigma\) more than one time, regardless of whether \(\sigma\) belongs
    to \(S\), or to \(B\), or is the starting station \(o_0\).


    Knowing the values of the variables \(x_{(u,v)}\), we can easily retrieve the
    path, using the Flow Decomposition Theorem (see e.g., [1, Chap. 3]). Let \(n\)
    (respectively \(m\)) be the number of nodes (respectively edges) of the time-expanded
    graph \(G\). We decompose the flows into at most \(m\) simple cycles and one simple
    path (from \(s_0\) to \(s_f\)) in time \(O(nm)\). We can then construct the minimum
    cost tour, as a linked list of edges, as \(O(nm)\). Initially, we set the tour
    equal to the path, and then we iteratively expand it, by merging it with a cycle
    that has a common edge. This can be done in a time linearly related to the length
    of the final tour, which is at most \(O(nm)\).


    # Size reduction through shortest paths


    The time-expanded graph can be rather large. In this section, we present a method
    that reduces the size of the graph, which in turn may be beneficial in the case
    where the salesman wishes to visit a relatively small number of stations in comparison
    with the total number of stations. We reduce the size of the problem by transforming
    the time-expanded graph \(G\) to a new graph \(G_{sh}\), called *reduced time-expanded
    graph*. The graph \(G_{sh}\) can be constructed by precomputing the shortest paths
    among the stations that belong to \(B\), as follows.


    Let \(\sigma_0\) again denote the starting station. For each station \(o\) in
    \(B \cup \{o_0\}\) we introduce a sink-node \(s_o\) and connect each arrival node
    of \(\sigma\) to \(s_o\) with a zero cost edge. Then, for each departure node
    \(d\) of \(\sigma \in B \cup o_0\), we compute a shortest path to the sink-nodes
    of every other station in \(B \cup o_0\). If such a shortest path does not pass
    through some other station in \(B \cup o_0\), then we insert a *shortest path
    edge* from \(d\) to the last arrival node of that path. The cost of this edge
    is equal to the cost of the corresponding shortest path.


    We can now transform \(G\) in the following way. We first remove the sink-nodes
    (and their incoming edges) that were previously introduced. Next, we delete from
    \(G\) all nodes and edges that belong to stations not in \(B \cup o_0\). The remaining
    arrival nodes (that belong to some station \(\sigma \in B \cup o_0\)), that were
    not used by any of the shortest paths previously computed, are also deleted, together
    with the remaining travel-edges. This procedure results in the reduced time-expanded
    graph \(G_{sh}\).


