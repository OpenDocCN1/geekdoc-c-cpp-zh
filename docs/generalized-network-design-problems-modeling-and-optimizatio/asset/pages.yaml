- pgno: 125
  md: '# Transformation of the RTSP to the asymmetric TSP


    Applying ideas similar to those from Behzad et al. [8], who presented an efficient
    transformation of the GTSP into the classical TSP, Hu et al. proposed a scheme
    to transform the reduced RTSP into an asymmetric TSP, defined on a graph \(G''
    = (V'', E'')\). The transformation works as follows: for each station \(\sigma
    \in B\) in the original reduced graph, the following procedure is applied to obtain
    a corresponding new station \(\sigma'' \in V''\).


    Let \(a''_1, ..., a''_k \in \sigma''\) be exact copies of arrival-nodes \(a_1,
    ..., a_k \in \sigma\), ordered according to their times. We connect them to a
    cycle with zero cost edges \((a''_1, a''_2), ..., (a''_{k-1}, a''_k), (a''_k,
    a''_1)\). The same procedure is applied to the departure-nodes \(d''_1, ..., d''_l\),
    which get connected with zero cost edges \((d''_1, d''_2), ..., (d''_{l-1}, d''_l),
    (d''_l, d''_1)\). Let \(pred(v)\) denote the cyclic predecessor node \(v\), according
    to these cycles. Every arrival-node \(a''_i, i=1,...,k\) is connected with every
    departure-node \(d''_j, j=1,...,l\). For the initial station, \(c(a''_i, d''_j)\)
    is set to \(t_{d''_j} - t_{d''_i}\), which does not depend on \(t(a''_i)\).


    The reason for choosing such a value is that the salesman has to end his tour
    at the initial station, but not at the initial time. So it only makes a difference
    when he starts the journey, thus


    \(c(a''_i, d''_j) = t_{d''_j} - t_{d''_i},\)


    where \(t(d''_i)\) is the earliest possible departure time from the initial station.
    For all other stations in \(B\), the costs are set to


    \(c(a''_i, d''_j) = [1440 + t_{d''_j} - t_{pred(a''_i)} - f_B(\sigma)] \mod 1440
    + f_B(\sigma).\)


    Note that, since not all original stay-edges are present, their costs are included
    in these new edges. For example, in Figure 4.5, going from \(a_1\) to \(d_4\)
    means taking the busy-edge \((a_1, d_3)\) and the stay-edge \((d_3, d_4)\). The
    costs are \(t_{d_4} - t_{a_1}\), which equal the costs of the new edge \((a''_2,
    d''_4)\).


    Finally, the outgoing edges from \(d''_j, j=1,...,l\) were also adapted. For each
    original travel-edge \((d_j, v)\) an edge \((pred(d''_j), v)\) was introduced
    with cost


    \((pred(d''_j), v) = c(d_j, v) + M.\)


    where \(M\) must be a sufficiently large number, e.g. \(\sum_{(u,v) \in E} c(u,
    v)\), so that no more than one travel-edge will be included in the optimal solution.


    This transformation will illustrated in Figure 4.5 and additionally shows an example
    of how a route is adapted to the new graph. We may notice that the resulting graph
    is directed and, therefore, the TSP is asymmetric.'
  merge: -1
  img_proc: true
