- pgno: 5
  md: '# Preface


    Combinatorial optimization is a fascinating topic. Combinatorial optimization
    problems arise in a wide variety of important fields such as transportation, telecommunications,
    computer networking, location, planning, distribution problems, etc. Over the
    last few decades, important and significant results have been obtained on theory,
    algorithms and applications.


    In combinatorial optimization, many network design problems can be generalized
    in a natural way by considering a related problem on a clustered graph, where
    the original problem’s feasibility constraints are expressed in terms of the clusters,
    i.e. node sets instead of individual nodes. This class of problems is usually
    referred to as generalized network design problems (GNDPs) or generalized combinatorial
    optimization problems.


    The express purpose of this book is to describe, in a unified manner, a series
    of mathematical models, methods, propositions and algorithms arising from generalized
    network design problems, developed in the last years. The book consists of seven
    chapters. In addition to an introductory chapter, the following generalized network
    design problems are formulated and examined:


    +   1. generalized minimum spanning tree problem;

    +   2. generalized traveling salesman problem;

    +   3. railway traveling salesman problem;

    +   4. generalized vehicle routing problem;

    +   5. generalized fixed-charge network design problem;

    +   6. generalized minimum vertex-biconnected network problem.


    While these topics will be described in the framework of generalized combinatorial
    optimization problems, my intention was to make each chapter relatively self-contained,
    so that each can be read separately.


    This book will be useful for researchers, practitioners, and graduate students
    in the fields of operations research, optimization, applied mathematics and computer
    science. Due to the substantial practical importance of some presented problems,
    researchers in other areas will also find this book useful.


    I am indebted to Georg Still, Gunther Raidl, Walter Kern, Andrei Horbat Marc and
    to many other colleagues, including my co-authors of the articles cited herein.'
