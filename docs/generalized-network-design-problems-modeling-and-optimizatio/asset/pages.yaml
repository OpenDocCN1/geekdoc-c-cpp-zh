    \        choose the next arrival node j from an unvisited cluster,\n        j\
    \ = \\begin{cases} \\arg\\max_{u \\in J^k_i} [\\tau_{iu}(t)]^\\alpha [\\eta_{iu}(t)]^\\\
    beta & \\text{if } q \\le q_0 \\\\ J & \\text{if } q > q_0 \\end{cases}\n```"
