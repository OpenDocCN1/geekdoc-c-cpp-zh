    # Proposition 3.4. $P_{\text{mcflow}} = P_{\text{bdflow}}$.


    Proof. If $(w, x, z, f) \in P_{\text{mcflow}}$, using the constraints (3.11) and
    (3.12), we have


    $f_{ij}^h + f_{ji}^h \le w_{ij} + w_{ji} = e,$


    for all $e = \{i, j\} \in E$ and for all $h, k \in K_1$.


    If, on the other hand, we assume that $(x, z, f) \in P_{\text{bdflow}}$, then,
    using the constraints (3.14), we get


    \max_h f_{ij}^h + \max_k f_{ji}^k \le x_e, \quad \forall e = \{i, j\} \in E.$


    Hence, we can choose $w$ such that \max_h f_{ij}^h \le w_{ij}$ and $x_e = w_{ij}
    + w_{ji}$ for all $e = \{i, j\} \in E$. For example, take


    $w_{ij} = \frac{1}{2}(x_e + \max_h f_{ij}^h + \max_k f_{ji}^k).$


    Clearly, we obtain $(w, x, z, f) \in P_{\text{mcflow}}.$


    # 3.4.3 A local-global formulation


    Our last model arises from discriminating between global variables and local ones.
    Recall the construction of the graph $G''$, obtained by shrinking each cluster
    of $G$ into a single node.


    We introduce the variables $y_{ij}$ ($i, j \in \{1, \dots, m\}$) to describe the
    inter-cluster (global) connections. Hence, $y_{ij} = 1$ if the cluster $V_i$ is
    connected to the cluster $V_j$ and $y_{ij} = 0$ otherwise. We assume that $y$
    represents a Hamiltonian tour. The convex hull of all these $z$-vectors is generally
    known as the Hamiltonian tour polytope on the global graph $G''$.


    Following Miller et al. [122] this polytope, denoted by $P_{\text{TSP}}$, can
    be represented by the following polynomial number of constraints:


    $\sum_{j=1, j \neq i}^m y_{ij} = 1, \quad \forall i \in \{1, \dots, m\},$

    $\sum_{i=1, i \neq j}^m y_{ij} = 1, \quad \forall j \in \{1, \dots, m\},$'
