  md: '# The Generalized Minimum Edge-Biconnected Network Problem (GMEBCNP)


    As we have seen in Chapter 2, when we aim at designing communication networks,
    a minimum spanning tree is usually the cheapest network that will allow a given
    set of sites to communicate. However, such a network is not robust against failures,
    since it might not survive the break of even a single link or site. For many communication
    structures, an important issue, besides the minimization of connection costs,
    is reliability. The network should be robust against failures in connections or
    against switching nodes, in the sense that any two nodes do not loose connection
    in case of simultaneous failures up to a certain maximum number. To accomplish
    this, redundant communication routes must exist for any pair of nodes.


    In order to deal with this issue, the terms vertex-connectivity and edge-connectivity
    have been introduced in graph theory, to describe this kind of robustness.


    The classical edge-biconnectivity augmentation (E2AUG) problem consists of identifying
    the cheapest set of augmented edges, so that a single edge deletion does not disconnect
    the graph. The problem was introduced and investigated by Eswaran and Tarjan [35].
    They also showed that the problem is NP-hard by a reduction from the Hamiltonian
    cycle problem.


    In this section, we are concerned with the generalized version of the edge-biconnectivity
    augmentation (E2AUG) problem called the generalized minimum edge-biconnected network
    problem (GMEBCNP). Given an undirected graph, whose nodes are partitioned into
    a number of clusters, the GMEBCNP is to find a minimum cost subgraph containing
    exactly one node from each cluster and being connected in an edge-biconnected
    way.


    The GMEBCNP was introduced by Huygens [84] and arises in the design of backbones
    in large communication networks.


    A similar problem is the generalized minimum vertex-biconnected network problem
    (GMVBCNP), where the goal is to find a minimum cost subgraph containing exactly
    one node from each cluster and satisfying the vertex-biconnectivity constraint.
    For more information on this problem, we refer to [136].


    # 7.1 Definition and complexity of the GMEBCNP


    Given an n-node weighted undirected graph G = (V, E) whose edges are associated
    with non-negative costs and V1, ... , Vm a partition of V into m clusters, the
    generalized minimum edge-biconnected network problem (GMEBCNP) seeks to find a
    minimum-cost subgraph S, connecting a subset of nodes, which includes exactly
    one'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'node from each cluster \(V_i, i \in \{1, \dots, m\}\) and which contains no
    bridges. The bridges of a connected graph are the graph edges whose removal disconnects
    the graph. More generally, a bridge (also known as a cut-edge or cut arc or an
    isthmus) is an edge whose deletion increases the number of connected components,
    see [72] for further details. We will call such a subgraph a generalized edge-biconnected
    subgraph.


    In the next figure we present an example of a feasible solution of the GMEBCNP.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_189_0.png)


    Figure 7.1. Example of a solution of the GMEBCNP.


    The GMEBNP is an \(\mathcal{NP}\)-hard problem, since in the particular case where
    \(|V_i| = 1, \forall i = 1, \dots, m\), the problem of finding a minimum-cost
    biconnected network, spanning all the nodes of a graph is an \(\mathcal{NP}\)-hard
    problem. See Garey and Johnson [45].


    The generalized minimum edge-biconnected network problem is closely related to
    some other generalized network design problems such as the generalized traveling
    salesman problem (GTSP). Because every solution of the GTSP is obviously edge-biconnected
    and therefore is also a solution of the GMEBCNP, its solution value can be seen
    as an upper bound of the GMEBCNP.


