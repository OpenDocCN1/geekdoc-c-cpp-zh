    in the original CVRP instance, $\Omega$ is the number of clusters and $\Phi$ is
    the number of vehicles in the GVRP instance. These instances were used by Bektaş
    et al. [9] and Moccia et al. [126] in their computational experiments.


    Originally, the set of nodes in these problems are not divided into clusters.
    The CLUSTERING procedure proposed by Fischetti et al. [43] divides data into node-sets.
    This procedure sets the number of clusters $s = \lceil \frac{n}{2} \rceil$, identifies
    the $s$ nodes farthest from each other and assigns each remaining node to its
    nearest center. Fischetti et al. [43] used $\theta = 5$, but according to Bektaş
    et al. [9], the created GVRP instances were too easy to solve.


    For our instances, we considered, as in [9, 126], two clustering procedures. One
    with $\theta = 2$ and the other one with $\theta = 3$. However, the proposed solution
    approaches are able to handle any cluster structure.


    The testing machine was an Intel Dual-Core 1.6GHz and 1 GB RAM. The operating
    system was Windows XP Professional. The algorithms were developed in Java, with
    JDK 1.6.


    In Tables 5.1 and 5.2, we summarize the results of all methods on all 148 small
