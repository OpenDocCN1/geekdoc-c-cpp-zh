    # 4.3.3 Solving the RTSP via a transformation into the classical TSP


    As we have already seen, the RTSP is related to the GTSP. Due to the fact that
    there are several efficient algorithms for solving the GTSP, such as genetic algorithms
    [184, 188], branch-and-cut [43], the algorithms described in Section 3.5, or approaches
    that exploit the transformation of the GTSP into the TSP [8, 26], it seems a reasonable
    idea to transform the RTSP into TSP. Such an approach was described by Hu and
    Raidl [78].'
