    Under the above assumptions, we present, in this section, an approximation algorithm
    for the GMSTP with performance ratio \(2\rho\). The approximation algorithm is
    constructed following the ideas of Slavik [187], which deals with the Generalized
    Traveling Salesman Problem and Group Steiner Tree Problem.


    # An integer programming formulation of the GMSTP


    We consider the following integer programming formulation of the GMSTP:


    # Problem IP1:


    \(Z_1 = \min \sum_{e \in E} c_e x_e,\)


    s.t. \(z(V_k) = 1, \quad \forall k \in K = \{1, \dots, m\},\) (2.36)


    \(x(\delta(S)) \ge z_i, \quad \forall i \in S, \forall S \subset V \text{ such
    that for some cluster } V_k, \text{ with } k \in K, S \cap V_k = \emptyset,\)
    (2.37)


    \(x(E) = m - 1,\) (2.38)


    \(x_e \in \{0, 1\}, \quad \forall e \in E,\) (2.39)


    \(z_i \in \{0, 1\}, \quad \forall i \in V.\) (2.40)


    Here, we used the standard notations introduced in Section 2.3.


    In the above formulation, condition (2.36) guarantees that a feasible solution
    contains exactly one vertex from every cluster. Condition (2.37) guarantees that
    any feasible solution induces a connected subgraph. Condition (2.38) simply assures
    that any feasible solution has \(m - 1\) edges and, because the cost function
    is strict positive this constraint is redundant.


    Now, we consider the linear programming relaxation of the integer programming
    formulation of the GMSTP. To do that, we simply replace the conditions (2.39)
    and (2.40) in IP1 with new conditions:


    \(0 \le x_e \le 1, \quad \text{for all } e \in E,\) (2.41)


