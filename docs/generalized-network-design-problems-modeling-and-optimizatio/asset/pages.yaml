  md: "We wish to send a flow between the nodes of the network and view an edge variable\
    \ \\(x_e\\) as indicating whether the edge \\(e \\in E\\) is able to carry a flow\
    \ or not. We consider three such flow formulations: a single commodity model,\
    \ a multicommodity model, and a bidirectional flow model. In each of these models,\
    \ although the edges are undirected, the flow variables will be directed. That\
    \ is, for each edge \\(\\{i, j\\} \\in E\\), we will have flow in both the directions\
    \ \\(i\\) to \\(j\\) and \\(j\\) to \\(i\\).\n\nIn the single commodity model,\
    \ the source cluster \\(V_1\\) sends one unit of flow to every other cluster.\
    \ Let \\(f_{ij}\\) denote the flow on edge \\(e = \\{i, j\\}\\) in the direction\
    \ \\(i\\) to \\(j\\). This leads to the following formulation:\n\n```\n\\(\\begin{aligned}\n\
    \\min & \\sum_{e \\in E} c_e x_e \\\\\n\\text{s.t.} & \\quad (3.1), (3.2), \\\\\
    \n & \\Delta(f_e) = \\mu, \\quad (3.7) \\\\\n & f_{ij}, f_{ji} \\le (m-1)x_e,\
    \ \\quad \\forall e = (i, j) \\in E, \\quad (3.8) \\\\\n & f_{ij} \\ge 0, \\quad\
    \ (3.9) \\\\\n & x, z \\in \\{0, 1\\},\n\\end{aligned}\\)\n```\n\nwhere \\(\\\
    Delta(f_e) = \\sum_{e \\in \\delta^+(i)} f_e - \\sum_{e \\in \\delta^-(i)} f_e\\\
    ) and\n\\(\\mu = \\begin{cases} (m-1)z_i & \\text{for } i \\in V \\\\ V_1 \\\\\
    \ -z_i & \\text{if } i \\in V_1 \\end{cases}\\).\n\nIn this model, the constraints\
    \ (3.7) restrict \\(m-1\\) units of a single commodity flow to the cluster \\\
    (V_1\\) and 1 unit of flow out of each of the other clusters. These constraints\
    \ are called *mass balance equations* and imply that the network defined by any\
    \ solution contains one node from every cluster and satisfies the degree constraints,\
