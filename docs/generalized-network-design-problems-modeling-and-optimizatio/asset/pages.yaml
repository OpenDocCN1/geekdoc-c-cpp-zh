  md: '# # The Static Railway Traveling Salesman Problem


    +   - All information relevant to the planning of the tour is assumed to be known
    by the salesman, before the process begins.


    +   - Information relevant to planning of the tour does not change after the tour
    has been constructed.


    The information that is assumed to be relevant includes all attributes of the
    customers in different cities, such as the geographical location of the customers
    and times spent within each of the visited cities in order carry out his/her business.
    Furthermore, system information as for example travel times of the trains between
    the cities must be known by the salesman.


    The dynamic counterpart of the static RTSP, as defined in the previous definition,
    may then be formulated as:


    # # The Dynamic Railway Traveling Salesman Problem


    +   - Not all information relevant to the planning of the tour is assumed to be
    known by the salesman before the process begins.


    +   - Information relevant to planning of the tour may change after the tour has
    been constructed.


    We mention that several other dynamic variants for combinatorial optimization
    problems may be considered, such as variants resulting from insertion or deletion
    of cities, see [61, 63, 108].


    # ## 4.4.1 Ant colony approach to the Dynamic RTSP


    The combination of positive and negative reinforcement, as mentioned in the case
    of the static RTSP, works well for static problems. In the beginning, there is
    relatively much exploration. After a while all non-promising connections will
    be slowly excluded from the search space, because they do not get any positive
    reinforcement and the associated pheromones have evaporated over time.


    In the dynamic case, solutions that are bad before a change in the environment
    occurs, may be good afterward. Now, if the ant system has converged to a state
    where those solutions are ignored, very promising connections will be lost and
    the result will be a suboptimal solution. We have considered two ways to overcome
    this effect:


    +   - we use a technique called shaking in order to smooth all pheromone levels
    in a certain wav. If the amount of pheromones on an edge becomes much higher than
    all the other edges, this edge will be always chosen. This way, in the static
    case, it can be ensured that a good connection will always be followed, but it
    prevents ants from taking another connection if the good connection is blocked.
    The formula'
