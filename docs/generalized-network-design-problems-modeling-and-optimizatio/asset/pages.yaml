    each cluster. In order to minimize the drilling time, the optimal route connecting
    all layers has to be detected (see Figure 3.7).


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_103_0.png)


    Figure 3.7. A schematic representation of the drilling problem on a Printed Circuit
    Board.


    An example of printed circuit board is presented in Figure 3.8.


    ![](img/8ee31706d554c7b9e05caa9ab83aec83_103_1.png)


    Figure 3.8. Printed Circuit Board.


    In what follows we introduce the concept of the stigmergic autonomous robot and
    describe the proposed metaheuristic for solving the drilling problem.


    # 3.6.1 Stigmergy and autonomous robots


    The proposed metaheuristic combines the concepts of stigmergic communication and
    autonomous robotic search. Stigmergy occurs when an action of an insect is determined
    or influenced by the consequences of previous actions of another insect [12].
    Stigmergy provides a general mechanism to relate individual and colony-level behaviors.
    Individual behavior modifies the environment, which in turn modifies the behavior
    of other individuals. Self-organization of social insects [15] can emerge, due
    to stigmergic interactions among individuals.


    The behavior-based approach to design of intelligent systems has produced promising
    results in a wide variety of areas, including military applications, mining, space'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'exploration, agriculture, factory automation, service industries, waste management,
    health care, and disaster intervention. Autonomous robots can accomplish real-world
    tasks without being told exactly how to do it.


    Researchers try to make the coupling between perception and action as direct as
    possible. This aim remains the distinguishing characteristic of behavior-based
    robotics. The proposed SRM technique attempts to address this goal in an intelligent,
    stigmergic manner.


    # 3.6.2 Sensitive robots


    A stigmergic robot action is determined by the environmental modifications caused
    by prior actions of other robots. Quantitative stigmergy regards stimulus as a
    continuous variable. The value of such a variable modulates the intensity or probability
    of future actions. Qualitative stigmergy [32] involves discrete stimulus. In this
    case the action is not modulated. Instead, the agent switches to a different action,
    [32].


    A qualitative stigmergic mechanism suits our aims better, since robot stigmergic
    communication does not rely on chemical deposition. The robot communication relies
    on local environmental modifications that can trigger specific actions. “Micro-rules”
    define action-stimuli pairs for a robot. The set of all micro-rules used by a
    homogeneous group of stigmergic robots defines their behavioral repertoire and
    determines the type of structure the robots will create [32].


    Within the proposed model, the term Sensitive robots refers to artificial entities
    with a Stigmergic Sensitivity Level (SSL), expressed by a real number in the unit
    interval [0, 1]. Extreme situations are:


    +   • SSL = 0 indicates that the robot completely ignores stigmergic information
    (is a “non-stigmergic” robot);


    +   • SSL = 1 means that the robot has maximum stigmergic sensitivity.


    Robots with small SSL values are highly independent and can be considered environment
    explorers. They have the potential to autonomously discover new promising regions
    of the search space. Therefore, search diversification can be sustained.


    Robots with high SSL values are able to intensively exploit the promising search
    regions already identified. In this case the robot behavior emphasizes search
    intensification. The SSL value can increase or decrease according to the search
    space topology encoded in the robot’s previous experience.


    # 3.6.3 Sensitive robot metaheuristic for solving the drilling problem


    The proposed Sensitive Robot Metaheuristic (SRM) can be implemented using two
    teams of sensitive robots. Robots of the first team have small SSL values. These
    sensitive-explorer robots are called small SSL-robots (sSSL) and can sustain search
    diversification. Robots of the second team have high SSL values. These sensitive-'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'exploiter robots called high SSL-robots (hSSL) intensively exploit promising
    search regions already identified by the first team.


    The SRM is applied for solving a robotic travel problem called the drilling problem.
    This problem can be viewed as an instance of the Generalized Traveling Salesman
    Problem.


    To apply the SRM for solving the drilling problem under consideration, the robots
    are placed in the starting point and will search objects within a specific area.
    Assuming that each cluster has specific objects and the robots are capable to
    recognize this they will each time choose a different cluster. The stigmergic
    values guide the robots to the shorter path-a solution of the Robotic Travel Problem.


    # Solving the Drilling Problem with the SRM


    Initially, the robots are randomly placed in the search space. In each iteration,
    a robot moves to a new node and the parameters controlling the algorithm are updated.


    A robot chooses the next move with a probability based on the distance to the
    candidate node and the stigmergic intensity on the connecting edge and unit evaporation
    takes place each time, to stop the stigmergic intensity from increasing unbounded.


    In order to prevent robots from visiting a cluster twice in the same tour, a tabu
    list is maintained. The stigmergic value of an edge is denoted by \(\tau\) and
    the visibility value is \(\eta\).


    Let us consider \(J^k_i\) as the unvisited successors of node \(i\) by robot \(k\)
    and \(u \in J^k_i\). The sSSL robots choose the next node probabilistically. Let
    \(i\) be the current robot position (the current node).


    Similar to the ACS technique [28], the probability of choosing \(u\) as the next
    node is given by:


    ```

    \(p^k_{iu}(t) = \frac{[\tau_{iu}(t)][\eta_{iu}(t)]^\beta}{\sum_{u \in J^k_i} [\tau_{iu}(t)][\eta_{iu}(t)]^\beta},
    \quad (3.31)\)

    ```


    where \(\beta\) is a positive parameter, \(\tau_{iu}(t)\) is the stigmergic intensity
    and \(\eta_{iu}(t)\) is the inverse of the distance on edge \((i, u)\) at time
    \(t\).


    The membership of robots to one of the two teams is modulated by a random variable,
    uniformly distributed in [0, 1]. Let \(q\) be a realization of this random variable
    and \(q_0\) a constant, \(0 \le q_0 \le 1\) (a parameter similar to the temperature
    in simulated annealing).


    The sSSL robots are characterized by the inequality \(q > q_0\), while for the
    hSSL robots \(q \le q_0\) holds.


    An hSSL-robot uses the information supplied by the sSSL robots. hSSL robots choose
    the new node \(j\) in a deterministic manner, according to the following rule:


    ```

    \(j = \text{argmax}_{u \in J^k_i} \{[\tau_{iu}(t)][\eta_{iu}(t)]^\beta\}, \quad
    (3.32)\)

    ```


    where the value of \(\beta\) determines the relative importance of stigmergy versus
    heuristic information.'
