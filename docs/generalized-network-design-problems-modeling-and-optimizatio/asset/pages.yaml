  md: "# Algorithm 3.9 (Procedures to set sabbatical and normal mode).\n\n```\nprocedure\
    \ setSabbaticalMode(p)\n    actionMode[p] <- sabbatical\n    bestStrategy[p] <-\
    \ null\n    bestStrategyCost[p] <- infinity\n    sabbaticalCountdown <- 20\nend\
    \ procedure\nprocedure setNormalMode(p)\n    actionMode[p] <- normal\n    rep[p]\
    \ <- initialReputation\n    strategy(p) <- bestStrategy[p]\nend procedure\n```\n\
    \n# Strategy and construction of the solution\n\nThe heuristic used during the\
    \ sabbatical leave to build a new strategy is based on virtual distances between\
    \ the supernodes in the global graph. We compute the virtual distance between\
    \ two supernodes as the distance between the centers of mass of the two corresponding\
    \ clusters. The choice of this heuristic is justified by the class of problems\
    \ for which our algorithm is designed, which are symmetric instances with Euclidean\
    \ distances, where the nodes of a cluster are spatially close one to the other.\n\
    \nBy introducing virtual distances between clusters, we have the possibility to\
    \ use candidate lists, in order to restrict the number of choices available at\
    \ each construction step. For each cluster \\( V_i \\), we consider a candidate\
    \ list that contains the closest \\( cand \\) clusters, with \\( cand \\) a parameter.\
    \ This way, the feasible neighborhood of a person \\( k \\) in cluster \\( V_i\
    \ \\) represents the set of clusters in the candidate list of cluster \\( V_i\
    \ \\) that this person \\( k \\) has not yet visited. Several heuristic algorithms\
    \ for the TSP use candidate lists in the solution construction phase (see [13])\
    \ for examples of their use in Ant Colony Optimization algorithms), but candidate\
    \ lists have not been widely used to construct solutions for the GTSP. Our algorithm\
    \ uses candidate lists during the construction of both strategy solution.\n\n\
    The use of candidate lists may significantly improve the time required by an algorithm,\
    \ but it could also lead to missing good solutions. Therefore, the choice of appropriate\
    \ candidate list sizes and elements is critical for an algorithm to work. In the\
    \ case of the TSP, candidate lists with size 20 are frequently used, but other\
    \ values between 10 and 40 are also common [91]. For GTSP, instances with clusters\
    \ composed of nodes spatially close to each other, the appropriate sizes of the\
    \ candidate lists are considerably smaller. Our experiments show that values of\
    \ 4 or 5 are adequate in this case."
