    # 4.3 Methods for solving the RTSP


    Four methods have been proposed for solving the RTSP, three of which are exact
    methods and one heuristic, which we will describe in the remainder of this chapter.


    # 4.3.1 The size reduction method through shortest paths


    Hadjidimalalambous et al. [67] presented a preprocessing algorithm to reduce the
    size of the time-expanded graph. The idea is to consider that, for each station
    sigma in B, a new sink-node s_sigma is added and all arrival-nodes in sigma are
    connected to s_sigma with zero cost edges. Then, for all departure-nodes in d
    in sigma, the shortest paths to sink-nodes in all other stations in B are computed.
    For each path, an edge between d and the last arrival-node of that path is added
    to G. The edge costs equal the costs of the corresponding shortest path. Then,
    all sink-nodes and their incoming edges are removed again, as well as all stations
    not in B, along with their nodes. Arrival nodes, which are not used by any of
    the shortest paths, and all arrival edges are also removed.'
