    # 3.7 Notes


    The generalized traveling salesman problem (GTSP) is an extension of the well-known
    traveling salesman problem and has several applications in location problems,
    telecommunication problems, railway optimization, planning, postal routing, manufacture
    of microchips, logistics, computer file sequencing, scheduling with sequence dependent
    process times, etc.


    Within this chapter, we have described the following aspects concerning the GTSP:


    +   - an exact exponential time algorithm for the problem;


    +   - integer programming formulations of the GTSP;


    +   - two methods for solving the problem: a reinforcing ant colony system and
    a hybrid heuristic technique, obtained by combining the consultant-guided search
    technique with a local-global approach to the GTSP;


    +   - a practical application of the GTSP: the drilling problem that consists
    of finding the minimal tour for drilling on a large-scale printed circuit board;


    +   - a sensitive robot metaheuristic algorithm for solving the drilling problem,
    characterized by a stigmergic sensitivity level that facilitates exploration (by
    low-sensitive robots) as well as the exploitation (by high-sensitive robots) of
    the search space.


    The material presented in this chapter is based on the results published by Pop
    [152], Pop et al. [161, 166] and Pintea et al. [137, 139, 141].'
