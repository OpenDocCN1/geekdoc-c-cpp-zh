  md: '# ## 2.3 Mathematical models of the GMSTP


    In order to formulate the GMSTP as an integer program, we introduce the following
    binary variables:


    ```

    x_e = x_{ij} = \begin{cases} 1 & \text{if the edge } e = \{i, j\} \in E \text{
    is included in the selected subgraph} \\ 0 & \text{otherwise} \end{cases},

    z_i = \begin{cases} 1 & \text{if the node } i \in V \text{ is included in the
    selected subgraph} \\ 0 & \text{otherwise} \end{cases},

    w_{ij} = \begin{cases} 1 & \text{if the arc } (i, j) \in A \text{ is included
    in the selected subgraph} \\ 0 & \text{otherwise} \end{cases}.

    ```


    We use the vector notations \(x = (x_{ij})\), \(z = (z_i)\), \(w = (w_{ij})\)
    and the notations \(x(E'') = \sum_{(i,j) \in E''} x_{ij}\), for \(E'' \subseteq
    E\), \(z(V'') = \sum_{i \in V''} z_i\), for \(V'' \subseteq V\) and \(w(A'') =
    \sum_{(i,j) \in A''} w_{ij}\), for \(A'' \subseteq A\).


    # ### 2.3.1 Formulations based on tree properties


    **Generalized subtour elimination formulation** (Myung et al. [128])


    A feasible solution of the GMSTP can be regarded as a cycle free graph with \(m
    - 1\) edges, connecting all the clusters, with one node selected from each cluster.
    Therefore, the GMSTP can be formulated as the following integer programming problem:


    ```

    \(\min \sum_{e \in E} c_e x_e\)

    \(\text{s.t.} \quad x(E(V_k)) = 1, \quad \forall k \in K = \{1, \dots, m\}, \quad
    (2.1)\)

    \(\quad x(E(S)) \le z(S - \{i\}), \quad \forall i \in S \subset V, 2 \le |S| \le
    n - 1, \quad (2.2)\)

    \(\quad x(E) = m - 1, \quad (2.3)\)

    \(\quad x_e \in \{0, 1\}, \quad \forall e \in E, \quad (2.4)\)

    \(\quad z_i \in \{0, 1\}, \quad \forall i \in V. \quad (2.5)\)

    ```


    In the above formulation, constraints (2.1) guarantee that from every cluster
    we select exactly one node, constraints (2.2) eliminate all the subours and finally
    constraint (2.3) guarantees that the selected subgraph has \(m - 1\) edges. This
    formulation, introduced by Myung [128], is called the generalized subtour elimination
    formulation because constraints (2.2) eliminate all the cycles.


    We denote the feasible set of the linear programming relaxation of this formulation
    by \(P_{sub}\), where we replace the constraints (2.4) and (2.5) with \(0 \le
    x_e, z_i \le 1\), for all \(e \in E\) and \(i \in V\).'
