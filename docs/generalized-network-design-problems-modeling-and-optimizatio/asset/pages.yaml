  md: 'The observations presented so far lead to our final formulation, called the
    *local-global formulation* of the GFCND problem as an 0-1 mixed integer programming
    problem:


    ```

    min \sum_{e \in E} c_e x_e + \sum_{d \in D, a \in A} g_a b_d f_a^d

    s.t.

    z(V_k) = 1, \quad \forall k \in \{1, \dots, m\},

    \sum_{a_s \in \delta^+(i)} F_{a_s}^d - \sum_{a_s \in \delta^-(i)} F_{a_s}^d =
    \left\{\begin{array}{ c c }

    1, & i \in s_{gd} \\

    -1, & i \in t_{gd} \\

    0 & \text{otherwise}

    \end{array}\right. \quad \forall d \in D, i \in V_g

    F_{ij}^d + F_{ji}^d \le y_{eg}, \quad \forall e_g = (i, j) \in E_g, d \in D

    F_{a_s}^d = \sum_{\{a \in (i, j) \in A | i \in V_k, j \in V_l\}} f_a^d, \quad
    \forall a_g = (k, l) \in A_g

    x(V_l, V_r) = y_{lr}, \quad \forall l, r \in K = \{1, \dots, m\}, l \neq r \tag{6.13}

    x(i, V_r) \le z_i, \quad \forall r \in K, \forall i \in V \backslash V_r \tag{6.14}

    f_a^d \ge 0, \quad \forall a = (i, j) \in A, d \in D

    x, z, y \in \{0, 1\}.

    ```


    The integrality restriction on the decision variables z can be relaxed and replaced
    by the restrictions z_i \ge 0, i \in V. Obviously, if the decision variables x,
    y \in \{0, 1\} then restrictions (6.13) and (6.14) imply that z \in \{0, 1\}.


    We observe as well that the local-global model of the GFCND problem has a polynomial
    number of restrictions and variables, and the number of integer decision variables
    is less compared to the other MIP models of the problem.


    # 6.3 Solving the GFCNDP


    Despite the importance of the GFCND problem in network design not much research
    on the problem has been done. As far as we know, only two approaches have been
    developed in order to solve the GFCND problem, a branch-cut-and-price algorithm
    proposed by Thomadsen and Stidsen [200] and a solution procedure based on the
    local-global formulation of the problem developed by Pop and Pop Sitar [160].


    Due to the substantial number of decision variables and constraints that occur
    in the bidirectional flow formulation of the GFCNDP, Thomadsen and Stidsen [200]
    described a branch-cut-and-price algorithm that takes advantage of the fact that
    only few non-zero variables and few binding constraints exist.


    The most widely used method for solving MIPs, however, is the branch-and-cut algorithm,
    employed by most state-of-the-art MIP solvers. Although the user can'
