    \( x(E(C_j)) \le z(C_j) - z_{ij} \).


    Therefore we obtain:


    \( x(\delta(C_0, C_1, \dots, C_k) \ge z(V) - 1 - \sum_{j=0}^k [z(C_j) - z_{ij}]
