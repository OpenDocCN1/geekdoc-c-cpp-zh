  md: 'The proof is by induction, on the support of x, denoted by supp(x) and defined
    as follows:


    $$supp(x) := \{x_e \mid x_e \neq 0, e \in E\}.$$


    Suppose that there is a global connection between the clusters \(V_l\) and \(V_r\)
    (i.e. \(y_{lr} = 1\)) then


    $$1 = x(V_l, V_r) = \sum_{i \in V_l} x(i, V_r) \le \sum_{i \in V_l} z_i = 1,$$


    which implies that \(x(i, V_r) = z_i\).


    We claim that \(supp(x) \subseteq E\) contains a tree connecting all clusters.
    Assume the opposite is true and let \(T^1 \subseteq E\) be a maximal tree in supp(x).
    Since \(T^1\) does not connect all clusters, there is some edge \((l, r)\) with
    \(y_{lr} = 1\), such that \(T^1\) has some vertex \(i \in V_l\) but no vertex
    in \(V_r\).


    Then \(z_i > 0\), and thus \(x(i, V_r) = z_i > 0\), so \(T^1\) can be extended
    by some \(e = (i, j)\) with \(j \in V_r\), which is a contradiction.


    Now, let \(x^{T^1}\) be the incidence vector of \(T^1\) and let


    $$\alpha := \min\{x_e \mid e \in T^1\}.$$


    If \(\alpha = 1\), then \(x = x^{T^1}\) and we are done. Otherwise, let \(z^{T^1}\)
    be the vector with \(z_i^{T^1} = 1\) if \(T^1\) covers \(i \in V\) and \(z_i^{T^1}
    = 0\) otherwise. Then


    $$(\tilde{x}, \tilde{z}) := ((1 - \alpha)^{-1}(x - \alpha x^{T^1}), (1 - \alpha)^{-1}(z
    - \alpha z^{T^1}))$$


    is again in \(P_{local}(y)\) and can be written, by induction, as a convex combination
    of tree solutions. Our claim now follows.


