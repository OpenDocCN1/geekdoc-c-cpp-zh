  md: '# ## 2.4.1 Introduction


    Many of the optimization problems that we would like to solve are $\mathcal{NP}$-hard.
    Therefore, it is very unlikely that these problems can be solved by a polynomial-time
    algorithm. However, these problems still have to be solved in practice. In order
    to do so, we have to relax some of the requirements. In general, there are three
    different possibilities.


    +   * **Superpolynomial-time algorithms:** Even though an optimization problem
    is $\mathcal{NP}$-hard, there are "good" and "not so good" algorithms for solving
    it exactly. The "not so good" algorithms certainly include most of the simple
    enumeration methods, where one enumerates all the feasible solutions and chooses
    the one with the optimal value of the objective function. Such methods have a
    very high time complexity. The "good" algorithms includes methods like branch-and-bound,
    where an analysis of the problem at hand is used to discard most of the feasible
    solutions, before they are even considered. These approaches allow one to obtain
    exact solutions of reasonably large instances of a problem, but their running
    time still depends exponentially on the size of the problem.


    +   * **Average-case polynomial-time algorithms:** For some problems, it is possible
    to have algorithms which require superpolynomial-time on only a few instances
    whereas the other instances run in polynomial time. A famous example is the Simplex
    Method for solving problems in linear programming.


    +   * **Approximation Algorithms:** We may also relax the requirement to obtain
    an exact solution of the optimization problem and be content with a solution that
    is "not too far away" from the optimum. This is partially justified by the fact
    that, in practice, it usually suffices to obtain a slightly sub-optimal solution.


    Clearly, there are good and bad approximation algorithms. We need some means of
    determining the quality of an approximation algorithm and a way of comparing different
    algorithms. There are few criteria to consider:


    **Average-case performance:** Here, we consider some probability distribution
    on the set of all possible instances of a given problem. Based on this assumption,
    an expectation of the performance may then be found. Results of this kind strongly
    depend on the choice of the initial distribution and do not provide us with any
    information about the performance on a particular instance.


    **Experimental performance:** This approach is based on running the algorithm
    on a few "typical" instances. It has been mostly used to compare the performance
    of several approximation algorithms. Of course the result depends on the choice
    of the "typical" instances and may vary from experiment to experiment.


    **Worst-case performance:** This is usually done by establishing upper and lower
    bounds for approximate solutions, in terms of the optimum value. In case of mini-'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'mization problems, we try to establish upper bounds, in case of maximization
    problems, we wants to find lower bounds.


    The advantage of the worst-case bounds on the performance of approximation algorithms
    is that, given any instance of the optimization problem, we are guaranteed that
    the approximate solution stays within these bounds. It should also be noted that
    approximation algorithms usually find solutions much closer to the optimum than
    the worst-case bounds suggest. Thus, it is of interest in and of itself, to see
    how tight the bounds on the performance of each algorithm are, that is, how bad
    the approximate solution can really get. This is usually done by providing examples
    of specific instances, for which the approximate solution is very far from the
    optimum solution.


    Even for simple algorithms, establishing worst-case performance bounds often requires
    a very deep understanding of the problem at hand and the use of powerful theoretical
    methods from areas like linear programming, combinatorics, graph theory, probability
    theory, etc.


    We consider an NP-hard optimization problem, for which, as we have seen, it is
    difficult to find the exact optimal solution within polynomial time. At the expense
    of reducing the quality of the solution by relaxing some of the requirements,
    we can often get a considerable speed-up in the complexity. This leads us to the
    following definition:


    # Definition 2.8 (Approximation algorithms).


    Let X be a minimization problem and \(\alpha > 1\). An algorithm APP is called
    an \(\alpha\)-approximation algorithm for problem X if, for all instances I of
    X, it delivers a feasible solution, in polynomial time, with objective value APP(I)
    such that


    ```

    APP(I) \(\le\) \(\alpha\)OPT(I), (2.35)

    ```


    where by APP(I) and OPT(I) we denote the values of an approximate solution and
    that of an optimal solution for instance I, respectively.


    The value \(\alpha\) is called the performance guarantee or the worst case ratio
    of the approximation algorithm APP. The closer \(\alpha\) is to 1 the better the
    algorithm is.


    # 2.4.2 Positive results: the design of the approximation algorithms


    With regard to approximations, positive results involve the design and analysis
    of polynomial time approximation algorithms. This section concentrates on such
    positive results; we will outline the main strategy.


    Assume that we need to find an approximation algorithm for an NP-hard optimization
    problem X. How shall we proceed? In what follows, we will concentrate on minimization
    problems, but the ideas apply equally well to maximization problems.


    In what follows, given an instance I of an optimization problem and some algorithm
    for its approximation, we will denote by OPT = OPT(I) the value of an optimum
    solution and by APP = APP(I) the value of the solution produced by the'
