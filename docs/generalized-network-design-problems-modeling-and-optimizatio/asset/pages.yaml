  md: '# Parameters:


    +   $c_e$ – the fixed cost of the edge $e, e \in E$.


    +   $g_a$ – the capacity cost of arc $a$, which is the cost per unit of demand
    using that arc.


    +   $b_d$ – the communication demand volume for demand $d$.


    # Decision Variables:


    +   • The binary decision variables


    \( z_i = \left\{ \begin{array}{ll} 1 & \text{if the node } i \text{ is selected
    as a hub-node} \\ 0 & \text{otherwise} \end{array} \right. \) ,

    \( x_e = \left\{ \begin{array}{ll} 1 & \text{if the edge } e \in E \text{ is chosen
    between two hub-nodes} \\ 0 & \text{otherwise} \end{array} \right. \) ,

    \( w_a = \left\{ \begin{array}{ll} 1 & \text{if the arc } a \in A \text{ is chosen
    between two hub-nodes} \\ 0 & \text{otherwise} \end{array} \right. \) .


    +   • The fractional continuous flow variables: \( f_{ij}^d \) reflect transportation
    decisions for each arc \( (i, j) \in A \) and commodity \( d \in D \).


    Our first model uses the binary decision variables defined above and the multicommodity
    flow variables \( f_a^d \).


    ```

    \(\min \sum_{e \in E} c_e x_e + \sum_{d \in D, a \in A} g_a b_d f_a^d\)

    \(s.t.\)

    \( z(V_k) = 1, \quad \forall k \in K = \{1, \dots, m\}, \) (6.1)

    \( \sum_{a \in \delta^+(i)} f_a^d - \sum_{a \in \delta^-(i)} f_a^d = \left\{ \begin{array}{ll}
    z_i, & i \in s_d \\ -z_i, & i \in t_d \\ 0 & \text{otherwise} \end{array} \right.
    \quad d \in D, i \in V, \) (6.2)

    \( x_e \le z_i, \quad \forall e \in E \text{ and } i \in e, \) (6.3)

    \( f_{ij}^d \le w_{ij}, \quad \forall a = (i, j) \in A, d \in D, \) (6.4)

    \( w_{ij} + w_{ji} = x_e, \quad \forall e = \{i, j\} \in E, \) (6.5)

    \( f_a^d \ge 0, \quad \forall a = (i, j) \in A, d \in D, \) (6.6)

    \( x, z, w \in \{0, 1\}. \) (6.7)

    ```


    In the above mixed integer programming formulation of the GFCNDP, the objective
    function represents the combined edge establishment costs and edge capacity requirement
    costs, the constraints (6.1) guarantee that exactly one hub node is selected from
    each cluster, the flow conservation constraints (6.2) guarantee that demands are'
