  md: "argument that this will always be the case. Heuristics are typically used when\
    \ there is no known method to find an optimal solution, under the given constraints\
    \ (of time, space etc.), or at all.\n\nSeveral families of heuristic algorithms\
    \ have been proposed for solving combinatorial optimization problems, which can\
    \ be divided into two main classes: classical heuristics and metaheuristics. The\
    \ first class contains most standard construction and improvement procedures.\
    \ Additionally, for any particular problem, we may well have techniques specific\
    \ to the problem being solved.\n\nThe term “metaheuristic” was first introduced\
    \ by Glover [51] and refers to a number of high-level strategies or concepts that\
    \ can be used to define heuristic methods, which can be applied to a wide set\
    \ of different optimization problems. In other words, a metaheuristic may be seen\
    \ as a general algorithmic framework, which can be applied to different optimization\
    \ problems with relatively few modifications, in order adept them to a specific\
    \ problem. Examples of metaheuristics includes simulated annealing (SA), tabu\
    \ search (TS), iterated local search (ILS), genetic algorithms (EC), variable\
    \ neighborhood search (VNS), ant colony optimization (ACO), memetic algorithms\
    \ (MA), genetic programming (GP), etc. We also remark that several of the leading\
    \ methods are hybrid approaches, which combine different solution techniques [174].\
    \ Some research on them has been done in the last years, and the resulting publications\
    \ document the success of hybrid algorithms in various application domains. However,\
    \ a lot of work still has to be done, in order to find skilled combinations of\
    \ metaheuristics with other optimization techniques, that will lead to more efficient\
    \ behavior and higher flexibility.\n\nThroughout this book, special attention\
    \ will be given to hybrid algorithms for selected GNDPs, that combine exact methods\
    \ based on integer linear programming with local search based metaheuristics.\
    \ Both techniques have their particular advantages and disadvantages, which can\
    \ be seen as complementary to a large degree. After analyzing them, it appears\
    \ natural to combine them, to obtain more effective algorithms.\n\nOn the question\
    \ of lower bounds, the most well known techniques are:\n\n+   - **Linear Programming\
    \ (LP) relaxation.**\n+   \n+   In LP relaxation we take an integer (or mixed-integer)\
    \ programming formulation of the problem and relax the integrality requirement\
    \ on the variables. This gives a linear program which can either be solved exactly,\
    \ using a standard algorithm (simplex or interior point), or heuristically (dual\
    \ ascent). The solution value obtained for this linear program gives a lower bound\
    \ on the optimal solution to the original minimization problem.\n\n+   - **Lagrangian\
    \ relaxation.**\n+   \n+   The general idea of Lagrangian relaxation is to “relax”\
    \ (dualize) some (or all) constraints, by adding them to the objective function\
    \ with the use of Lagrangian multipliers. In practice, the Lagrangian relaxed\
    \ problem can be solved more easily than the original problem. The problem of\
