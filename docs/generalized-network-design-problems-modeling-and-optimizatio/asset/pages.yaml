  md: '# Theorem 2.1 (Pop [142]). The Generalized Minimum Spanning Tree problem on
    trees is $\mathcal{NP}$-hard.


    Proof. In order to prove that the GMSTP on trees is $\mathcal{NP}$-hard it is
    enough to show that there exists an $\mathcal{NP}$-complete problem that can be
    polynomially reduced to a GMSTP.


    We consider the set cover problem for a given finite set $X = \{x_1, ..., x_a\}$,
    a collection of subsets of $X, S_1, ..., S_b \subseteq X$ and an integer $k <
    |X|$.


    We show that we can construct a graph $G = (V, E)$, having a tree structure, such
    that there exists a set cover $Y \subseteq X, |Y| \le k$ if and only if there
    exists a generalized spanning tree in $G$ with a cost of at most $k$.


    The constructed graph $G$ contains the following $m = a+b+1$ clusters $V_1, ...,
    V_m$:


    +   $V_1$ consists of a single node denoted by $r$


    +   $V_2, ..., V_{a+1}$ node sets (corresponding to $x_1, x_2, ..., x_a \in X$)
    each of which has two nodes: one ''expensive'' (see the construction of the edges,
    say $\overline{x_t}$, and one ''non-expensive'', say $\hat{x}_t$, for $i = 2,
    ..., a$, and


    +   $b$ node sets, $V_{a+2}, ..., V_m$ with $V_v = S_{v-(a+1)}$, for $v = a+2,
    ..., m$.


    Edges in $G$ are constructed as follows:


    +   (i) Each ''expensive node'', say $\overline{x_t}$ of $V_t$, for all $t = 2,
    ..., a+1$, is connected with $r$ by an edge with a cost of 1 and each ''non-expensive''
    node, say $\hat{x}_t$ of $V_t$, for all $t = 2, ..., a+1$, is connected with $r$
    by an edge with a cost of 0.


    +   (ii) Choose any node $f \in V_t$ for any $t \in \{a+2, ..., m\}$. Since $V_t
    \subset X$, then $j$ coincides with a node in $X$, say $j = x_t$. We construct
    an edge between $j$ and (the expensive node) $\overline{x_l} \in V_t$ with $l
    \in \{2, ..., a\}$. The cost of the edges constructed this way is 0.


    By design the graph $G = (V, E)$ has a tree structure.


    Now suppose that there exists a generalized spanning tree in $G$, with a cost
    of at most $k$ then, by choosing


    $Y := \{x_t \in X | \text{the expensive vertex } \overline{x_t} \in V_{t+1} \text{
    corresponding to } x_t \text{ is a vertex of the generalized spanning tree in
    } G\}$


    we see that $Y$ is a set cover of $X$.


    On the other hand, if there exists a set cover $Y \subseteq X, |Y| \le k$ then,
    according to the construction of $G$, there exists a generalized spanning tree
    in $G$ with a cost of at most $k$.'
