    # 2.5.4 Solving the GMSTP with Simulated Annealing


    Simulated annealing (SA) is a generic probabilistic metaheuristic for the global
    optimization problem in applied mathematics, which is to locate a good approximation
    to the global minimum of a given function in a large search space. It is inspired
    by Monte Carlo methods in statistical mechanics. The name and inspiration come
    from annealing in metallurgy, which is a technique that involves heating and controlled
    cooling of a material, to increase the size of its crystals and reduce their defects.
    The heat causes the atoms to become unstuck from their initial positions (a local
    minimum of the internal energy) whereupon they start to wander randomly through
    states of higher energy. The slow cooling gives them more chances of finding configurations
    with lower internal energy than the initial one. It is often used when the search
    space is discrete (e.g., all tours that visit a given set of cities). For certain
    problems, simulated annealing may be more effective than exhaustive enumeration,
    provided that the'
  merge: -1
  img_proc: true
- pgno: 59
  md: "goal is merely to find an acceptable solution within a fixed amount of time,\
    \ rather than the best possible solution.\n\nThe ideas that form the basis of\
    \ simulated annealing were first published by Metropolis et al. [121] as an algorithm\
    \ to simulate the cooling of a material in a heat bath, a process known as annealing.\n\
    \nKirkpatrick et al. [97] and Cerny [16] suggested that this type of simulation\
    \ could be used to search for feasible solutions of an optimization problem. Their\
    \ approach can be regarded as a variant of the local search technique.\n\nA central\
    \ problem for local search is the occurrence of local optima, i.e. nodes in the\
    \ search space where no neighbor is a strict improvement over the current node,\
    \ in terms of the cost function, but which are not global optima. In the simulated\
    \ annealing heuristic non-improving local moves are allowed in order to overcome\
    \ the local optima, but their frequency is governed by a probability function\
    \ which changes as the algorithm progresses. It has been shown (see [52]) that\
    \ with a “large enough” initial temperature and a proper cooling schedule, SA\
    \ guarantees a globally optimal solution. However, this theoretical result is\
    \ particularly helpful, since the annealing time needed to ensure a significant\
    \ probability of success will usually exceed the time required for a complete\
    \ search of the solution space.\n\nThe annealing algorithm for a minimization\
    \ problem with solution space S, objective function c and neighborhood structure\
    \ N can be stated as follows:\n\n# Algorithm 2.21.\n\n```\nSelect a starting solution\
    \ s0 \\in S, an initial temperature T0 > 0, a temperature reduction function \\\
    alpha and a number of iterations per temperature L;\nRepeat\n  Repeat\n    Randomly\
    \ select s \\in N(s0) and compute \\delta = c(s) - c(s0);\n    If \\delta < 0\n\
    \      then s0 = s\n    else generate random p, uniformly distributed over the\
    \ range (0, 1);\n    if p < exp(-\\delta/T) then s0 = s\n  Until iterationcount\
    \ = L;\nSet T = \\alpha(T);\nUntil the stopping condition is true.\ns0 is the\
    \ approximation of the optimal solution.\n```\n\nHere, L represents the number\
    \ of repetitions at each temperature, i.e. the number of evaluated, randomly chosen\
    \ candidate solutions, in the neighborhood of the current solution. Therefore,\
    \ at each stage, we evaluate L randomly chosen candidate solutions in the neighborhood\
    \ of the current solution. If a candidate solution improves"
