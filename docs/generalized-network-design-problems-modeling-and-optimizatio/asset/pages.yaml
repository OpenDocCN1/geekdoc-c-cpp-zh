    # Implementation details and computational results


    Our computational experiments were performed on a Dual Intel Pentium III Processor
    – 1000 MHz computer with 512 MB RAM. The procedures for the combined Simulated
    Annealing and local greedy scheme were written in Java.


    After some preliminary tests, we have chosen the following cooling schedule: we
    start with a temperature T0 = 100, the cooling rate r = 0.95 will be used to reduce
    the temperature in each step, and in each stage L = 30 moves are evaluated.


    We considered an undirected graph G = (V, E) having n nodes, partitioned into
    m clusters, such that each cluster contains the same number of nodes. Edges are
    defined between all the nodes from different clusters and the costs of the edges
    were randomly generated in the interval [1,100]. For each type of instance (n,
    m) we randomly generated five different problems, i.e. with different costs of
    the edges. The instances that we used are similar to those considered by Myung
