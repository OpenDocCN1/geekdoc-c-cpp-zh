  md: '# 3.6.4 Numerical experiments


    The validation of the SRM concerns the minimization of the drilling operational
    time on printed circuit boards. The numerical experiments are based on four drilling
    problems, with Euclidean distances drawn from the TSPLIB [209] that provides optimum
    objective values for each problem.


    As in all other metaheuristics, the choice of parameters is critical to the algorithm.
    Currently, no mathematical analysis has been developed that gives the optimum
    parameter in each situation.


    Based on preliminary experiments, the values of the parameters in the SRM algorithm
    were chosen as β = 5, τ0 = 0.01, q0 = 0.9. The parameters were chosen based on
    [28, 137]. The total number of robots considered is 25. The sensitivity level
    q for the hSSL robots is considered to be distributed in the interval (q0, 1),
    while sSSL robots have a sensitivity level in the interval (0, q0).


    The program is implemented in Java and was run on an AMD Athlon 2600+, 333MHz
    with 2 GB memory.


    For all algorithms, the solutions represent the average of five consecutive runs
    for each problem. The termination criterion is given by a maximum of 200 trials
    and 100 tours.


