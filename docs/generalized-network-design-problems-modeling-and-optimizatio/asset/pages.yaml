    of each cluster consecutively. According to Laporte and Palekar [106], this variant
    of the GTSP is defined as the Cumulative Traveling Salesman Problem by Chisman
    [18] and we will denote it by CTSP. Several applications of the CTSP are outlined
    by Laporte and Palekar [106]. Recently, Ding et al. [27] proposed a two level
    genetic algorithm for CTSP.


    As far as we are aware, there is no such extension for GVRP.


    In the following, we define a similar extension of the GVRP, which we call the
    Clustered Generalized Vehicle Routing Problem, denoted by CGVRP, where all nodes
    of each cluster must be visited consecutively on a route of a vehicle. Thus, for
    the case of the CGVRP, we are interested in finding a collection of $s$ tours
    of minimum cost, starting and ending at the depot, such that each node of the
    entire graph is visited exactly once, by performing a Hamiltonian path within
    each cluster. Each cluster should be visited by exactly one vehicle at any of
    its nodes, and the load of each vehicle does not exceed its capacity $Q$.


