  md: '# Genetic parameters


    The genetic parameters are very important for the success of a GA and are of equal
    importance as the other aspects, such as the representation of the individuals,
    the initial population and the genetic operators. The most important parameters
    are:


    +   • The population size \(\mu\) has been set to 2 times the number of the clusters.
    This turned out to be the best number of individuals in a generation.


    +   • The intermediate population size \(\lambda\) was chosen as twice the size
    of the population: \(\lambda = 2 \cdot \mu\).


    +   • The mutation probability was set at 10%.


    # Termination criteria


    The loop of chromosome generation is terminated when certain conditions are met.
    When the termination criteria are met, the elite chromosome is returned as the
    best solution found so far. In our algorithm, we used a termination condition
    based on the number of generations, namely \(10^4\) generations, which seems necessary
    to sufficiently explore the solution space.


    # Local improvement procedure


    For some combinatorial optimization problems, classical GAs are not aggressive
    enough. One possibility to obtain more competitive heuristics is to combine the
    GAs with local search procedures.


    For each solution belonging to the current generation we use a local improvement
    procedure that runs several local search heuristics sequentially. Once an improvement
    move is found, it is immediately executed.


    In our algorithm, we used five local search heuristics. Two of them, the 2-opt
    intra-route and the cluster route optimization that uses the shortest path algorithm
    to find the best node from each cluster when the order of clusters is given, operate
    within the routes and the rest operate between routes and are called neighborhood
    cross, neighborhood exchange and neighborhood relocation. These local search heuristics
    have been described in the previous subsection.


    Our improvement procedure applies all described local search heuristics cyclically.


    # 5.6.3 Computational experiments


    In this section, we present extensive computational results in order to assess
    the effectiveness of our proposed algorithms for solving the GVRP.


    We conducted our experiments on a set of instances generated through an adaptation
    of the existing instances in the CVRP library, available at http://branchandcut.org/VRP/data/.
    The naming of the generated instances follows the general convention of the CVRP
    instances available online, and follows the general format \(X - nY -\)'
