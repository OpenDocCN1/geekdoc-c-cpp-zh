    # 4.5 Notes


    The Railway Traveling Salesman Problem (RTSP) is a practical extension of the
    classical traveling salesman problem that considers railway network and train
    schedules and is related to the Generalized Traveling Salesman Problem. It was
    introduced by Hadjicharalambous [67].


    In this chapter, we have presented the following results concerning the RTSP:


    +   - A model of the problem, based on the time-expanded digraph G, constructed
    from the timetable information introduced by Schulz et al. [182].

    +   - Four methods for solving the RTSP: the size reduction method through shortest
    paths, a cutting plane approach, a method based on transformation of the RTSP
    into the classical TSP, and an ant-based heuristic.

    +   - A variant of the RTSP called the dynamic railway traveling salesman problem,
    in which we assume that the distances between cities seen as travel times are
    no longer fixed.

    +   - An ant colony approach for solving the dynamic railway traveling salesman
    problem.


    The material presented in this chapter is mainly based on the results published
    by Hadjicharalambous [67], Hu et al. [78] and Pop et al. [155, 156, 157].'
