  md: '# Theorem 2.10. Under the assumption $\mathcal{P} \neq \mathcal{NP}$, there
    is no $\alpha$-approximation algorithm for the GMSTP


    Proof. Assume that there exists an $\alpha$-approximation algorithm APP for the
    GMSTP, where $\alpha$ is a real number greater than or equal to 1. This means
    that


    $\text{APP}(I) \le \alpha \text{OPT}(I)$,


    for every instance $I$, where OPT($I$) and APP($I$) are the values of the optimal
    solution and of the solution found by the algorithm APP, respectively.


    Then, we can show that APP also solves the node-cover problem for a given graph
    $G = (V, E)$ and an integer $k$ such that $k < |V|$. This result contradicts the
    assumption that $\mathcal{P} \neq \mathcal{NP}$.


    We construct a graph $G'' = (V'', E'')$ and the edge cost function such that the
    algorithm APP finds a feasible solution with a value not greater than $\alpha$
    times the optimal cost, if and only if G contains C, where C is a node cover of
    G, i.e. a subset of V, such that all the edges of G are adjacent to at least one
    node of C.


    The graph $G''$ contains the following $m = |E| + k + 1$ node sets (clusters),
    $V''_1, \dots, V''_m$:


    +   - $V''_1$ consists of a single node, denoted by $r$,

    +   - $V''_2, \dots, V''_{k+1}$ are identical node sets, each of which has $|V|$
    nodes, corresponding to the nodes of $V$, and

    +   - $|E|$ node sets, $V''_{k+2}, \dots, V''_m$, each of which contains a single
    node corresponding to an edge $e \in E$.


    Edges in $G''$ are constructed as follows:


    +   (i) For all $l = 2, \dots, k + 1$, each node of $V''_l$ is connected to $r$
    by an edge. The set consisting of these edges is denoted by $E''_1$.

    +   (ii) Let $i$ be a node of $V''_l$ for any $l \in \{2, \dots, k + 1\}$ and
    let $j$ be a node of $V''_r$ for any $r \in \{k + 2, \dots, m\}$. Then, an edge
    is constructed between $i$ and $j$ if the edge of $G$ corresponding to $j$ is
    incident to the node of $G$ corresponding to $i$ and we denote the set of those
    edges by $E''_2$.

    +   (iii) We also construct an edge between $i$ and $j$, even though the edge
    of $G$ corresponding to $j$ is not incident to the node of $G$ corresponding to
    $i$, and we let $E''_3$ denote the set of those edges.


    We let $E'' = E''_1 \cup E''_2 \cup E''_3$.'
