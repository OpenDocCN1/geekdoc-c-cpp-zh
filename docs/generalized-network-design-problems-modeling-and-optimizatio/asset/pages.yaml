  md: "In the following, we describe the new algorithm called the Railway Ant Colony\
    \ (RAC) algorithm for the Railway Traveling Salesman Problem.\n\nIn the RAC algorithm\
    \ m, ants individually construct candidate solutions in an imperceptible fashion.\
    \ The choice of the nest node is based on two main components, pheromone trails\
    \ and a heuristic value called visibility.\n\nThe algorithm works similar to the\
    \ case of the reinforcing ant colony system, described in Section 3.5.1 for solving\
    \ the GTSP. We considered the same probability function that favors the selection\
    \ of an edge with a high pheromone value, \\(\\tau\\), and high visibility value,\
    \ \\(\\eta\\) and the same correction rules to update the trail intensity locally\
    \ respectively globally.\n\nAt the outset, the ants are in their nests and will\
    \ start to search for food within a specific area. An ant goes through a given\
    \ number of clusters, \\(B\\) exactly once, and then returns to the nest. An ant\
    \ stays in each cluster for a period of time, in order to find desirable food\
    \ and after that, starting from another node, continues the tour. The choice of\
    \ the next node is probabilistic. The more pheromone there is on a certain road\
    \ (edge) the bigger the chance that this specific road will be taken. Therefore,\
    \ the pheromone trails will guide the ants to the shorter path, which is a solution\
    \ of the RTSP.\n\nWhen each ant has completed a tour, the amounts of pheromone\
    \ are updated. On every road (edge) some fraction of pheromone evaporates whilst\
    \ en route. New pheromones are deposited in those that have been visited by at\
    \ least one ant. All roads on the best tour so far get an extra amount of pheromone.\
    \ This is called an elitist ant approach - the best ants reinforce their associated\
    \ tour even more.\n\nThe process continues until a certain condition, such as\
    \ a certain number of iterations, amount of CPU time or solution quality, has\
    \ been achieved.\n\nThe Railways Ant Colony (RAC) algorithm can be stated as follow:\n\
    \n# Algorithm 4.1 (Railways Reinforcing System algorithm for the RTSP).\n\n```\n\
    For every edge (i, j) do \\(\\tau_{ij}(0) = \\tau_0\\)\nfor k = 1 to m do\n  \
    \  place ant k on a specified chosen node from a specified cluster\nend for\n\
    let T* be the shortest tour found and L+ its length\nfor iter = 1 to N_iter\n\
