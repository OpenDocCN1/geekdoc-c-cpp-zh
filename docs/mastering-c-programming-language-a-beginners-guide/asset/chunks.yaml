  trans: "\n\n变量声明向编译器保证存在一个具有定义类型和名称的单一变量，允许编译器在不了解变量所有细节的情况下继续收集工作。变量语句在程序合并时可能具有意义；当程序连接时，编译器需要一个简单的变量定义。\n\
    \n当使用多个文档时，变量断言是有帮助的，因为你可以在其中一个记录中声明变量，而该记录在应用程序连接时是可访问的。你可以使用 `extern` 关键字在任何地方声明变量。\n\
    \n**示例：**\n\n**输出：**\n\n### 左值（Lvalues）和右值（Rvalues）是两种不同的属性\n\n在 C++ 中，有两种形式的表达式：\n\
    \n`lvalue` 是一种重要的值类型。`lvalue` 表达式是指内存区域的表达式。`lvalue` 可以出现在操作的左侧或右侧。\n\n`rvalue`\
    \ 一词指的是存储在特定内存区域中的信息值。值是一个不能被赋予新值的表达式；因此，它只能出现在操作的右侧，而不能出现在左侧。\n\n作用域是程序中可以声明变量的区域，通常变量可以在三个区域表示：\n\
    \n1. 局部变量位于函数或块内部。\n2. 形式参数位于函数参数规范中。\n3. 全局变量是存在于所有函数之外变量。\n\n### 局部变量\n\n局部因子是在函数或块内部特征化的因子。它们必须由包含在该函数或代码块内部的解释使用。\n\
    \n**示例：**\n\n### 全局级变量\n\n全局因子定义在程序的开头，位于任何函数之外。全局元素的值在你的程序运行期间将保持一致。\n\n任何函数都可以访问全局变量。当声明一个全局变量时，它在整个程序中都是可用的。\n\
    \n**示例：**\n\n### 初始化局部和全局变量\n\n当你声明局部变量时，系统不会自动初始化它；你必须手动完成。当你像如下声明全局变量时，系统将自动初始化它们：\n\
    \n| 数据类型 | 初始值 |\n| --- | --- |\n| int | 0 |\n| char | `‘0’` |\n| float | 0 |\n\
    | double | 0 |\n| pointer | NULL |\n\n## 常量\n\n常量（通常称为字面量）是程序无法更改的固定值。\n\n常量分为整数数字、浮点数数字、字符、字符串和布尔值，并且可以是任何基本数据类型。\n\
    \n*   **整数字面量：** 整数类型可以是十进制、八进制或十六进制常量。前缀决定了数字的基数：`0x` 或 `0X` 表示十六进制，`0` 表示八进制，无表示十进制。\n\
    \n    整数可以给出一个由 `U` 和 `L` 组合的后缀，代表无符号（unsigned）和长型（long）。可以提升或缩小该后缀，并且它可以出现在任何分组中。\n\
    \n    **示例：**\n    * `212` // 合法\n    * `215u` // 合法\n    * `0xFeeL` // 合法\n\n\
    *   **浮点数：** 一个整数部分、一个小数点、小数部分和一个类型部分组成一个浮点数。浮点字面量可以用十进制或科学计数结构表示。\n\n    在十进制结构表示时，你应该包含小数点、指数或两者；在科学计数结构表示时，包含整数部分、小数部分或两者。`e`\
    \ 或 `E` 表示标记（科学计数法指数）。\n\n    * `3.14159` // 合法\n    * `.e55` // 非法：缺少整数或小数\n\
    \    * `314159E-5L` // 合法\n    * `210f` // 非法：没有小数点或指数\n    * `510E` // 非法：指数不完整\n\
    \n### 布尔字面量\n\n布尔字面量是一种布尔逻辑类型。\n\nC++ 中有两个布尔字面量，两者对于标准函数至关重要。\n\n*   True（真）的值为有效。\n\
    *   False（假）的值为假。\n\n你不应该考虑实值等于 1 和虚值等于 0 的情况。\n\n### 字符字面量\n\n单引号用于表示字符字面量。如果精确以字母\
    \ `L`（仅大写）开头，它是一个宽字符字符串（例如 `L‘x’`），应该存储在类型为 `wchar_t` 的变量中。否则，它只是一个普通字符字符串（如 `‘x’`），可以存储在字符类型的变量中。\n\
    \n| 转义序列 | 含义 |\n| --- | --- |\n| `\\\\` | `\\` 字符 |\n| `\\'` | `'` 字符 |\n| `\\\
    \"` | `\"` 字符 |\n| `\\?` | `?` 字符 |\n| `\\a` | 警报或铃声 |\n| `\\b` | 退格 |\n| `\\\
    f` | 换页 |\n| `\\n` | 换行 |\n| `\\r` | 回车 |\n| `\\t` | 水平制表 |\n| `\\v` | 垂直制表 |\n\
    | `\\ooo` | 三位八进制数 |\n| `\\xhh` | 一或两位十六进制数 |\n\n**示例：**\n\n**输出：**\n\n### 字符串中的字面量\n\
    \n双引号用于表示字符串字面量。普通字符、转义序列和全角字符都是字符串的内容。\n\n字符串字面量可以用十进制或科学计数结构表示。\n\n**示例：**\n\
    \n## 修饰符\n\nC++ 允许在 char、int 和 double 数据类型前面带有修饰符。修饰符用于调整基的大小以适应不同的情况。\n\n信息类型修饰符记录如下：\n\
    \n*   signed（有符号）\n*   unsigned（无符号）\n*   long（长型）\n*   short（短型）\n\nsigned、unsigned、long\
    \ 和 short 可以应用于整数基数。此外，signed 和 unsigned 可以应用于 double。\n\nsigned 和 unsigned 也可以作为\
    \ long 或 short 的前缀。C++ 允许在声明 unsigned、short 或 long 时省略 int。因此，伴随的两个断言都表示 int。\n\
    \n### 限定符类型\n\n| 序号 | 限定符 & 含义 |\n| --- | --- |\n| 1 | **const**：const 类型的对象在运行时不能更改。\
    \ |\n| 2 | **volatile**：volatile 修饰符告知编译器变量的值以程序未显式指示的方式发生变化。 |\n| 3 | **restrict**：受限指针是访问其所引用对象的唯一方式。只有\
    \ C99 引入了该限定类型。 |\n\n## 存储类\n\n在 C++ 程序中，存储类指定了变量和函数的作用域和生存周期。这些指定符位于它们的类型之前。这里提到的存储类可以在\
    \ C++ 应用程序中使用。\n\n*   **auto：** 对于所有局部变量，auto 存储类是默认存储类。\n\n    **示例：**\n\n* \
    \  **register：** register 存储类用于创建应保存在寄存器而非 RAM 中的局部变量。该变量的最大长度等于寄存器的大小；因此它不能与一元运算符\
    \ `&` 配合。\n\n    **示例：**\n\n*   **static：** static 存储类告诉编译器在整个程序运行期间保持局部变量存，而不是每次进入和退出作用域时创建和删除它。通过将局部变量变为静态，它们的值在函数调用之间会被保留。\n\
    \n    **示例：**\n\n"
