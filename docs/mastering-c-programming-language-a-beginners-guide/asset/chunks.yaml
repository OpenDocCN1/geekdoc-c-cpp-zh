    我们将统一使用 `return` 语句，因为我们的函数模板将适用于所有的异步接口。C++ 语言对泛型提供了特殊规定，这一点非常值得赞赏。


    四个异步接口中的每一个都有一个唯一的 `Completed` 成员，可以用于注册委托，该委托会在异步方法完成时被调用。在大多数情况下，C++/WinRT 会自动为我们构建委托。我们现在需要做的就是提供一个类似函数的处理程序，这通常是一个
