    ## C++ DATA STRUCTURES


    Structure is a user-defined data type that enables you to combine data items of
    different types. C/C++ arrays allow you to construct variables that mix many data
    items of the same kind, while structure is another user-defined data type that
    allows you to combine data items of other kinds.


