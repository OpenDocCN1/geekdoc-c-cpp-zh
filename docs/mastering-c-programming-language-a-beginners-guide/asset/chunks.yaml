    become complex when producing many coroutines.


    To solve these concerns, the function promise type::initial suspend () can return
    std::suspend_always, causing mkCoroutineB to be stopped immediately upon entrance
    before any code in the coroutine has run. In the sample generator below, we utilize
    this method. It implies that before returning the first value from our generator,
    we must restart the coroutine.


    So, here''s our general-purpose generator. A Generator<D> must be returned by
    a generator that produces type D. The main function checks if the Generator still
    has an output value and then uses operator() to get the next value.


