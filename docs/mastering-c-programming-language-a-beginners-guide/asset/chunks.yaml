    # PROCESS MEMORY


    A process is a runnable programme that is loaded into memory. A method is just
    a running program.


    When a program is generated, it is nothing more than a collection of bytes saved
    on the hard disc as a passive object. When a program is double-clicked on Windows
    or the name of the executable file is entered on the command line, the program
    begins loading in memory and becomes an active entity.


    ## Operating System Memory Management


    Memory management is a component of the operating system that regulates or maintains
    primary memory and moves processes from the main memory to the disc during execution.
    Memory management maintains track of every memory location, whether it''s in use
    or not. It determines how much memory should be allotted to each process. It specifies
    which methods will be allocated memory and when they will be given memory. It
    monitors when memory is freed or unallocated and adjusts the state accordingly.


    Memory may be defined as a collection of data in a certain format. It''s utilized
    to keep track of instructions and data that have been processed. A vast array
    or set of words or bytes makes up the memory, each with its place. A computer
    system''s principal goal is to run programs. During execution, these programs
    and the data they access should reside in the main memory. The CPU retrieves instructions
    from memory based on the program counter value.


    ### What Is Main Memory?


    A modern computer''s main memory is critical to its functionality. A vast array
    of words or bytes, ranging in size from hundreds of thousands to billions, is
    referred to as main memory. The CPU and I/O devices share main memory, which is
    a store of quickly accessible information. When the CPU is actively using programs
    and data, they are stored in the main memory. Because main memory is linked to
    the CPU, transferring instructions and data in and out of the processor is lightning
    fast.


    `RAM` stands for random access memory. This memory is a volatile memory, which
    means it may be erased at any time. When there is a power outage, the data in
    `RAM` is last.


    ### What Is Memory Management?


    In a multiprogramming computer, the operating system takes up a portion of memory,
    while other processes rest. The process of assigning memory to various uses is
    known as memory management. Memory management is a mechanism used by operating
    systems to coordinate actions between the main memory and the disc while running.
    The fundamental objective of memory management is to achieve practical usage of
    memory.


    ### Why Is Memory Management Necessary?


    * Before and after the procedure, allocate and de-allocate memory

    * To keep track of how much memory is being utilized by processes

    * To keep fragmentation to a minimum

    * To make the most use of the main memory

    * To keep data safe while the procedure is running


    ## Space for Logical and Physical Addresses


    * **Space for logical addresses:** The term “logical address” refers to an address
    created by the CPU. A virtual address is another name for it. The size of the
    process can be described as the logical address space. It is possible to modify
    a logical address.

    * **Physical Address space:** A “Physical Address” is an address viewed by the
    memory unit (i.e. one that is loaded into the memory''s memory address register).
    A Real address is the same as a physical address.


    Physical address space is the collection of all physical addresses that correspond
    to these logical addresses. Memory Management Unit (`MMU`) generates a physical
    address. A hardware component known as a `MMU` performs the run-time mapping from
    virtual to physical locations. The physical address is always the same.


    ## Loading Methods: Static and Dynamic


    A loader loads a process into the main memory in two ways: static and dynamic.
    Loading can be divided into two categories:


    * **Static loading:** Static loading is when the complete program is loaded into
    a single address. It necessitates additional memory.

    * **Dynamic loading:** The whole program and its data must be in physical memory
    for a process to operate. As a result, the size of a function is restricted by
    the amount of physical memory available. Dynamic loading is utilized to ensure
    optimal memory use. In dynamic loading, a procedure is not loaded until it is
    called.


    ## Linking, Both Static and Dynamic


    A linker is used to conduct static and dynamic linking tasks. A linker is a software
    that merges several object files created by a compiler into a single executable
    file.


    * **Static linking:** The linker merges all essential software modules into a
    single executable program via static linking. As a result, there isn''t any runtime
    dependence. Some operating systems only allow static linking, which treats system
    language libraries like any other object module.

    * **Dynamic linking:** Dynamic linking is comparable to dynamic loading in terms
    of its core principle. For each suitable library routine reference, “Stub” is
    included in dynamic linking. A stub is a chunk of code that is only a few lines
    long. When the stub is run, it checks to see if the required procedure is already
    present in memory. If the routine is not accessible, the software loads it into
    memory.


    ## SWAPPING


    A process must have resided in memory when it is run. Swapping temporarily moves
    a process from main memory to secondary memory, which is faster than secondary
    memory. More operations may be executed and fit into memory at the same time,
    thanks to swapping. The transferred time is the most critical aspect of swapping,
    and the overall time is proportional to the quantity of memory swapped. Because
    if a higher priority process requests service, the memory manager can swap out
    the lower priority process and then load and run the higher priority process,
    swapping is also known as roll-out, roll-in. After completing the higher priority
    activity, the lower priority process swapped back into memory and resumed the
    execution process.


    ## CONTIGUOUS MEMORY ALLOCATION

