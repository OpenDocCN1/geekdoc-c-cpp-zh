    驱动“基于位置的方法论”创新的重大灵感，是为了消除过程化方法中经历的部分缺陷。在面向对象编程（OOP）中，信息被视为程序进展的核心组成部分，并将其流限制在框架内部。它将信息与其处理它的能力相关联，并防止其受到外部力量的意外修改。它允许将问题拆分为称为“对象”的各种元素，然后围绕这些对象组合信息和功能。对象的信息必须由与特定对象相关的力量访问。然而，在需要时，一个对象的元素也可以访问不同对象的属性。


    它更强调信息而非方法：


    - 项目根据这些原则被划分为对象，使其易于操作。

    - 数据结构被设计用于表示对象。

    - 处理对象信息的功能被封装在数据结构中。

    - 信息被封装起来，未经授权无法被外部函数访问。

    - 对象之间的交互（对应）可以通过功能来实现。

    - 添加新的信息和功能已变得浅层次化。


    ### 对象

    对象是 OOP 中最基本的运行时元素。它们可以代表用户定义的信息，如向量、时间和记录，或程序需要处理的任何内容。编程问题是基于对象以及它们之间对应关系的概念进行研究的。对象的选择应当能够与这些现实对象紧密匹配。对象占用内存空间，并且没有相关的物理位置。同时，执行对象通过相互发送消息进行接口交互。例如，如果“Understudy”和
    `student_rollno` 是程序中的两个对象，`Student` 对象可能会向 `student_rollno` 对象发送消息，提及其相关的 `Marks`。每个部分都包含控制信息的代码。


    ### 类

    对象的整个代码结构可以通过类对象创建为用户定义数据类型，类对象是类（kind）的成员。当我们描述一个类时，我们可以创建多个具有该类位置的对象。每个对象都可以与其创建的类型类信息相关联。通过这种方式，一个类只是同类类型对象的集合。例如，多功能手机、`PC`
    和智能手表都是 `gadgets` 类的个体。类是用户定义的数据类型。用于创建对象的语法非常简单。假设硬件已被描述为一个类，那么断言 `PC;` 将创建一个具有
    `hardware` 类位置的 `PC` 对象。


    ### 封装

    封装可以描述为将信息和数据封装在一个单一单元中。在 OOP 中，封装被描述为将控制它们的知识和功能限制在一起。


    考虑一个简单的封装示例；学校里有许多不同的部门，如学生部门、教师部门、财务部门等。学生部门处理学生的所有活动并跟踪所有与财务相关的信息。同样，教师部门持有每位教师的所有相关活动，并跟踪每个学生的学生的成绩和表现。目前，可能会出现一种情况：学生部门的一名学生由于未知原因需要关于成绩和表现的所有信息。在这种情况下，他不被允许直接访问教师部门的知识。他首先需要联系教师部门的某位老师，然后要求老师提供所有信息。这就是封装的意义。在这里，学生部门和教师部门的可以控制它们的知识被封装在“教师区域”的单一名称下。


    ### 抽象

    抽象指的是仅显示应用程序中重要且必要的元素，并隐藏细节。在 C++ 中，类可以向其他世界提供信息和功能，同时保持因素隐藏不被直接访问；或者类甚至可以向所有人（或获取它的类型）宣布所有可用内容，我们可以根据需要对其进行转换。


    这应该可以通过访问修饰符来实现。C++ 有三种访问修饰符：


    1. `Private`（私有）

    2. `Protected`（保护）

    3. `Public`（公共）


    ### 多态

    多态一词意味着具有多种结构。我们可以将多态描述为功能或信息以超过一种形式显示的能力。一个人可以同时拥有多种身份。一个孩子同时是学生、兄弟/姐妹、孩子，这使得同一个人群体在多种情况下表现出不同的行为。这被称为多态。


    一个活动可以根据多次出现的情况中的需求表现出不同的实践。行为取决于所使用的信息类型及其在操作中的需求。


    C++ 支持运算符重载和函数重载：


    - **运算符重载：** 它是让运算符在不同示例中显示不同行为的方法。

    - **函数重载：** 函数重载是使用单一函数名称来执行各种任务。


    多态广泛应用于执行遗留代码。


    继续阅读关于 C++ 中 OOP 的文章


    ### 继承

    继承是一个类的对象获取另一个类对象的属性、功能和信息的机制。它遵循渐进式安排的概念。例如，“麻雀”鸟是“飞行鸟”类的一部分，也是“鸟”类的一部分。通过这种划分，每个确定的类都向其获取属性的类传递普通属性和信息。继承提供了重用的可能性。这意味着在不修改或发布任何改进的情况下，向当前类添加额外的元素。这通过从当前类获取另一个类来实现。新类将获得父类和子类的合并规定。


    继承的真正用途是它允许开发者重用一个几乎（但并非完全）是他所需的类，并对该类进行修改而不会产生副作用引入其他类中。注意，每个子类仅刻画其自身以及从父类继承的感兴趣的部分。


