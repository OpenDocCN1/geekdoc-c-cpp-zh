    The main memory should be accessible to both the operating system and the numerous
    client programs. As a result, memory allocation in the operating system becomes
    an essential activity. Memory is usually partitioned into two parts: the resident
    operating system and user processes. Many user processes must be retained in memory
    at the same time in most instances. As a result, we must examine how to assign
    available memory to the processes waiting to be brought into memory from the input
    queue. Each process in neighboring memory allotment is housed in a single contiguous
    memory segment.


    ![A diagram shows a process and a memory block.](images/ufig5_1.jpg)

    <details><summary>Long Description</summary>

    A process consists of a stack of three boxes one on top of the other. A memory
    block consists of a stack of 10 boxes one on top of the other. The block consists
    of two processes: one with three light grey blocks and the other with two dark
    grey blocks.</details>


    # Memory Allocation


    Memory allocation must be allocated efficiently to achieve optimal memory utilization.
    Divide memory into numerous fixed-size divisions, each containing precisely one
    process, is one of the simplest ways for allocating memory. The number of divisions
    determines the degree of multiprogramming.


    # Multiple Partition Allocation


    A process is chosen from the input queue and loaded into a free partition in this
    approach. The division becomes accessible for other functions after the process
    finishes.


    # Fixed Partition Allocation


    In this technique, the operating system keeps track of which sections of memory
    are free and used up by processes. All memory is initially available for user
    processes and is treated as a single giant block of memory. The available memory
    is referred to as a `Hole`. When a new process that requires memory, we look for
    a large enough hole to store it. If the need is met, we allocate RAM to process
    it; otherwise, the remaining memory is kept accessible for future requests.


    When allocating memory, dynamic storage allocation difficulties might arise, such
    as meeting a request of size `n` from a list of available holes. There are a few
    options for dealing with this issue:


    ![A graphic shows the types of fit in dynamic storage allocation; first fit, best
    fit, and worst fit.](images/ufig5_2.jpg)


    ## First Fit


    In this case, the first accessible free slot satisfies the process''s criteria.


    ![A diagram shows a process entering a memory block using the first fit allocation.](images/ufig5_3.jpg)

    <details><summary>Long Description</summary>

    The memory block consists of the following: `O S`, `20 K B`, used, `15 K B`, used,
    `40 K B`, used, `60 K B`, used, and `25 K B`. Process `A` with a size of `25 K
    B` enters the `40 K B` space in the memory block. The hole space equals `40 minus
    25`, which leads to `15 K B`.</details>


    Because the previous two memory blocks did not have enough memory space, the first
    available free hole in this diagram is a `40 KB` memory block that can hold process
    `A` (size of `25 KB`).


    ## Best Fit


    Assign the smallest hole that is large enough to process requirements for the
    optimum fit. Unless the list is sorted by size, we search the entire list for
    this.


    ![A diagram shows a process entering a memory block using the best fit allocation.](images/ufig5_4.jpg)

    <details><summary>Long Description</summary>

    The memory block consists of the following: `O S`, `20 K B`, used, `15 K B`, used,
    `40 K B`, used, `60 K B`, used, and `25 K B`. Process `A` with a size of `25 K
    B` enters the `25 K B` space in the memory block. The hole space equals `25 minus
    25`, which leads to `0 K B`.</details>


    ## Worst Fit


    In the worst-case scenario, process the most enormous available hole. This approach
    yields the most significant remaining hole.


    ![A diagram shows a process entering a memory block using the worst fit allocation.](images/ufig5_5.jpg)

    <details><summary>Long Description</summary>

    The memory block consists of the following: `O S`, `20 K B`, used, `15 K B`, used,
    `40 K B`, used, `60 K B`, used, and `25 K B`. Process `A` with a size of `25 K
    B` enters the `60 K B` space in the memory block. The hole space equals `60 minus
    25`, which leads to `35 K B`.</details>


    Process `A` (size `25 KB`) is allocated to the most significant available memory
    block of `60 KB` in this case. In the worst-case scenario, inefficient memory
    use is a big concern.


    # FRAGMENTATION


    A `Fragmentation` is described as a tiny free hole created when a process is loaded
    and deleted from memory after execution. These holes can''t be allocated to new
    techniques since they''re not merged or don''t meet the process''s memory requirements.
    We must decrease memory waste or fragmentation to accomplish a degree of multiprogramming.
    There are two forms of fragmentation in operating systems:


    ![A flow chart shows two forms of fragmentation. The two forms are internal fragmentation
    and external fragmentation.](images/ufig5_6.jpg)


    ## Internal Fragmentation


    Internal fragmentation happens when the process is given more memory blocks than
    requested. As a result, some space remains, resulting in internal fragmentation.


    ## External Fragmentation


    We have a free memory block in external fragmentation, but we can''t allocate
    it to process since the blocks aren''t contiguous.


    # PAGING


    Paging is a memory management method that eliminates the need for physical memory
    allocation in contiguous blocks. This technique allows a process''s physical address
    space to be non-contiguous.


    *   `logical address`: A logical address, sometimes known as a virtual address,
    is created by the CPU.

    *   `logical address space`: The collection of all logical addresses created by
    a program is the logical address space.

    *   `physical address`: An address that can be found on a memory unit.

    *   `physical address space`: The collection of all physical addresses that correlate
    to logical addresses.


    ## WHAT ARE OBJECTS IN MEMORY?


    Above the bar, programs get storage in-memory objects, which are virtual storage
    chunks. The system divides a memory object into virtual segments, each one a megabyte
    in size and starting on a megabyte boundary. A memory object might be as large
    as your installation''s memory limitations or as tiny as one megabyte.

