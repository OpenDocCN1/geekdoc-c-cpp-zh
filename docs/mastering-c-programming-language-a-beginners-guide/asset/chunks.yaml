    You must define sections of a class after the `public` keyword to make them public
    (i.e., available to other parts of your program). All other functions in your
    application can access any variables or functions declared after the public specifier.


    By making one class a buddy of another, the implementation details are exposed
    and encapsulation is lost. The ideal situation is to keep as many of each class''s
    information hidden from other classes as possible.


