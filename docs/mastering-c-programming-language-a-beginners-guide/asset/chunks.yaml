    # 第 1 章 C++ 简介


    DOI: [10.1201/9781003214762-1](https://doi.org/10.1201/9781003214762-1)


    ## 本章内容


    * 了解 C++ 的历史

    * 学习用途和特性

    * C++ 的安装


    ## 什么是 C++？


    C++ 是由 Bjarne Stroustrup 开发的高级编程语言，它适用于 Windows、Mac OS 以及多个 UNIX 变体。本 C++ 教程采用简单实用的方法将
    C++ 概念传递给学者。在 C++ 中，数据类型分为三类：基本类型：这些是用户可以直接使用的底层或预定义数据类型。例如 `int`、`char`、`bool`。`long`
    是 C++ 中的基本数据类型。


    ## 学习 C++ 的好处


    * C++ 非常接近硬件，因此你有机会在底层工作，在内存控制方面获得更好的性能，最后是一种强大的语言。

    * C++ 编程让你对面向对象编程（OOP）有深入的理解。当你实现虚函数和虚函数指针时，你将理解多态的底层实现。

    * C++ 是一种非常流行的编程语言，深受程序员喜爱。如果你是一名优秀的 C++ 软件工程师，你永远不会找不到工作，更重要的是，你将获得丰厚的回报。

    * C++ 是应用程序和框架开发中最广泛使用的编程语言。因此你可以选择自己感兴趣领域。

    * C++ 确实能让你理解编译器、链接器和加载器之间的区别，各种数据类型、存储类、变量类型及其扩展等。


    **C++ 的优势包括：**


    * C++ 是一种高可移植性语言，常用于创建多设备、多平台应用。

    * 类、继承、多态、数据抽象和封装都是 C++ 这种 OOP 语言的特性。

    * C++ 函数库非常丰富。

    * 异常处理和函数重载在 C++ 中都是可能的，但在 C 中不可。


