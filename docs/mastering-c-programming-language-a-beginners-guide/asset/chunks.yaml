    ## FORMATTING ARGUMENT\n\nAn object of type `basic_arg<Context>` represents a\
    \ formatting argument parameterized on a formatting context. It can store one\
    \ of the following sorts of values:\n\nwhere `Char` denotes the `Context::char`\
