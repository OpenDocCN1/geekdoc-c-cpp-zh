  trans: "\n\n从嵌套生成器协程体传播出的异常将通过 `co_yield` 表达式重新抛出到父协程，而不是从顶层的 `iterator::operator++()`\
    \ 传播。这是基于一种心理模型：`co_yield someGenerator` 在语义上等同于手动遍历元素并产出每一个元素。\n\n例如，嵌套的 `ints()`\
    \ 和手动的 `ints()` 在语义上是相似的。\n\n### elements_of\n\n当嵌套生成器类型可转换为当前生成器的值类型时，`elements_of`\
    \ 是一个防止歧义的实用函数。\n\n**示例：**\n\n- 为了避免此问题：\n    - `co_yield expression>` -> 应该始终直接产出该值以防止此问题。\n\
    \    - `co_yield elements of(expression>)` 返回嵌套生成器的值。\n\n我们还建议将 `co_yield elements\
    \ of(x)` 展开为产出除生成器以外任意范围的值，以便方便。\n\n## 对称传输 (SYMMETRIC TRANSFER)\n\n通过对称传输，递归形式可以快速完成。此功能之前在\
    \ `[CppCoro]` 中通过独立的 `recursive_generator` 类型提供。\n\n然而，得益于 HALO 的改进和对称传输，单一类型似乎已经足够高效。该功能的代价是每个生成器额外三个指针的内存换取。鉴于目前编译器对协程的支持状态，估计我们方法的运行时开销是具有挑战性的。然而，我们的测试显示，生成器与\
    \ `recursive_generator`（有时被称为 `non_recursively`）之间没有明显区别。值得一提的是，建议的方法确保了 HALO\
    \ 优化的可能性。\n\n虽然我们认为单一生成器类型已经足够并提供了更优的 API，但还有三种替代方案：\n\n- 在单个生成器类型中支持递归调用（本提议）。\n\
    - 一个递归生成器类型，可以从递归生成器或普通生成器返回值。这可能会导致性能微小提升，同时使用相同数量的内存。\n- 一种递归生成器类型，只能从其他递归生成器类型返回值。\n\
    \n如果我们选择第三种方案，以下代码将是格式错误的：\n\n相反，我们必须写成：\n\n由于这种限制，在构造生成器协程时，决定返回 `generator`\
    \ 还是 `recursive_generator` 可能是棘手的，因为我们可能并不知道这个特定的生成器在此时是否会被 `recursive_generator`\
    \ 利用。\n\n假设我们选择了生成器返回类型，并随后希望从 `recursive_generator` 中产出它的元素。在这种情况下，我们必须手动逐一个产出每个元素，或者使用一个将生成器转换为\
    \ `recursive_generator` 的辅助函数。与生成器最初被构建为产出 `recursive_generator` 的情况相比，这两种选择都增加了运行时开销，因为它们对每个元素都需要两次协程恢复，而不是单次协程恢复。\n\
    \n由于这些缺点，我们并不提倡这种方法。\n\n只要引用类型相同，各种生成器类型都允许进行对称传输，即对称传输不会被不同的值类型或分配器类型所阻止。\n\n\
    ### 在 Promise 类型中存储交付值的最佳方式是什么？\n\n由于给定的表达式保证在协程重启之前一直有效，因此存储其地址就足够了。这使得大产出类型生成器非常高效。然而，由于额外的间接，它在产生比指针小的值时可能是悲观的（这种间接的开销是未知的，因为这些访问都不应该导致缓存未命中）。\n\
    \n结果导致产出表达式中的转换被避免了：\n\n以额外存储为代价，存储副本将允许更少的间接，并提供产出任何可转换为产出类型的灵活性。`generator<const\
    \ D&>` 可用于以避免存储开销。\n\n### 对分配器的支持\n\n通过对 `generator` 和 `promise_type` 的新操作符基于分配器类型进行模板化，`std::generator`\
    \ 可以处理无状态和有状态的分配器，并努力减少无状态分配器的接口冗余。\n\n**示例：**\n\n支持分配器需要在协程帧旁边保留一个函数指针（用于监控内存释放函数），并且在有状态分配器的情况下，保留分配器本身。\n\
    \n根据建议的接口，如果给定了分配器，它必须是协程函数的第二个参数，紧跟在 `std::allocator_arg_t` 实例之前。这种方法用于区分用于创建协程帧的分配器与在协程函数体内使用的分配器。\n\
    \n我们认为所有标准和用户协程类型必须具有等效的分配器支持接口。实际上，分配器支持实现可以在 `generator`、`lazy` 和其他标准类型之间共享。\n\
    \n#### 是否可以推后添加分配器支持？\n\n分配器支持可能会在未来引入 `std::generator`。然而，因为分配器是提议架构中的模板参数，在\
    \ `std::generator` 发布后引入分配器会导致 ABI 破坏。我们敦促按照本文建议的立即添加分配器支持，并确保架构在整个周期内对 `std::lazy`\
    \ 的工作中保持一致。\n\n## 经验与实现\n\n作为 `cppcoro` 和 `folly` 的一部分，已经提供了生成器。另一方面，`Cppcoro`\
    \ 提供了一个独特的递归生成器类型，它与建议的架构不同。\n\nFolly 采用了一种不支持对称传输的单一递归生成器类型。尽管如此，Folly 用户发现 `Folly::Generator`\
    \ 比它所取代的急进算法高效得多。\n\nRanges-v3 也包含一种从不递归的生成器类型，且早于移动只读视图和迭代器的工作，这导致了协程处理器被引用计数。\n\
    \n## 性能与基准测试\n\n由于实现仍在微调中，且性能高度依赖于是否发生了 HALO 优化，目前无法对提议设计的性能给出结论性意见。\n\nClang\
    \ 无论在编写时实现实现是否支持协程，都可以内联非嵌套协程，但 GCC 从不进行 HALO 优化。\n\n当协程未内联时，支持递归对性能没有明显影响。\n\n\
    ## 使用协程编译代码\n\n由于 C++20 目前尚未被广泛支持，我们需要确保编译器支持协程才能使用它们。我们正在使用 GCC 10.2，如果在编译时使用以下选项，它似乎允许协程：\n\
    \n## 协程句 (HANDLES)\n\n如所述，新的 `co_await` 运算符保证函数的当前状态被封装在堆上的某个地方，并生成一个继续当前函数执行的可调用对象。`std::coroutine_handle<...>`\
    \ 是该可调用对象的类型。\n\n协程句的工作类似于 C 指针。它很容易复制，但缺少释放与协程状态相关内存的析构函数。为了尽可能减少内存泄漏，我们应该始终调用\
    \ `coroutine_handle::destroy` 函数来删除协程状态（尽管在某些情况下协程可以在完成时自销毁）。当协程句被销毁时，引用同一协程的协程句将指向垃圾并在执行时产生未定义行为，就像\
    \ C 指针一样。相反，协程句在协程执行期间一直保持有效，即使控制多次进入和离开协程。\n\n"
- fmt: "\n# COROUTINES AND C++ FOR EFFECTIVE ASYNC\n\nIn the same way, everything\
    \ else in the Windows Runtime focuses on allowing components to provide async\
    \ methods and making it simple for applications to use those async methods, the\
    \ Windows Runtime has a fundamental async model. It doesn't provide a concurrency\
    \ runtime or even any building blocks for creating or consuming async methods\
    \ on its own. Instead, unique language projections are responsible for all of\
    \ this.\n\nThis is how it should be, and it's not intended to make the Windows\
    \ Runtime async pattern any easier. Implementing this pattern correctly is no\
    \ easy task. Of course, this implies that the developer's preferred programming\
    \ language significantly impacts a developer's view of async in the Windows Runtime.\
    \ For example, a developer who has only worked with `C++/CX` could incorrectly\
    \ but sensibly believe that async is a disaster.\n\nThe ideal concurrency framework\
    \ for a `C#` developer will be different from the ideal concurrency library for\
    \ a `C++` developer. The language's role, and libraries' role in `C++`, is to\
    \ handle the async pattern's mechanics and offer a logical bridge to a language-specific\
    \ implementation.\n\nIn `C++`, coroutines are the ideal abstraction for both implementing\
    \ and invoking async functions, but first, let's review how the async model works.\
    \ Consider the following example of a class with a single static method:\n\n```cpp\n\
    By convention, async methods finish in “Async”, so we might think of this as the\
    \ Copy async method. There's a chance there's a blocking or synchronous alternative\
    \ named `Copy`. A caller could desire a blocking `Copy` function for a background\
    \ thread and a non-blocking, or asynchronous, `Copy` method for a UI thread that\
    \ can't afford to block for fear of looking unresponsive.\n\nAt first, glance,\
    \ calling the `CopyAsync` function appears to be fairly easy. The following C++\
    \ code might be written:\n```\n```\n\nEven though running the `CopyAsync` function\
    \ in a typical procedural fashion, the resultant `IAsyncAction` isn't the final\
    \ result of the async method. `IAsyncAction` is the object that a caller can use\
    \ to synchronously or asynchronously wait for a result, depending on the context.\
    \ There are three more well-known interfaces that follow a similar pattern and\
    \ provide various capabilities for the callee to convey information back to the\
    \ caller, in addition to `IAsyncAction`. The four async interfaces are compared\
    \ in the table.\n\n| Name | Result | Progress |\n| --- | --- | --- |\n| `IAsyncAction`\
    \ | N | N |\n| `IAsyncActionWithProgress` | N | Y |\n| `IAsyncOperation` | Y |\
    \ N |\n| `IAsyncOperationWithProgress` | Y | Y |\n\n- Async Interfaces are compared\
    \ \n- Expressed Async Interfaces\n\nAlthough `IAsyncAction` and `IAsyncActionWithProgress`\
    \ can wait for an async function to complete, these interfaces do not provide\
    \ any observable result or return value. `IAsyncOperation` and `IAsyncOperationWithProgress`\
    \ expect the `Result` type parameter to specify the kind of result that may be\
    \ expected after the async procedure completes successfully. Finally, the `Progress`\
    \ type argument is used by `IAsyncActionWithProgress` and `IAsyncOperationWithProgress`\
    \ to provide the type of progress information anticipated regularly for long-running\
    \ operations until the async function completes.\n\nThere are a few ways to wait\
    \ for an async method's result. We won't go into detail about each one because\
    \ it would make this a very long essay. While there are other approaches to async\
    \ completion, we only advocate `async.get` method, which does a blocking wait,\
    \ and the `co await` async expression, which conducts a cooperative wait in the\
    \ context of a coroutine. Neither is superior to the other; they just fulfill\
    \ distinct functions. Let's have a look at how to do a blocking wait.\n\n### The\
    \ `get` method may be used to create a blocking wait like follows:\n\n### Holding\
    \ on to the async object has minimal benefit, thus the following form is preferred:\n\
    \nIt's crucial to remember that the `get` method will block the caller thread\
    \ until the async function completes. As a result, using the `get` method on a\
    \ UI thread is not recommended since it may cause the program to become sluggish.\
    \ If we try to do so in an unoptimized build, an assertion will fire. The `get`\
    \ method is excellent for console apps or background threads if we don't want\
    \ to utilize a coroutine for whatever reason.\n\nThe `get` function will return\
    \ any result to the caller after the async procedure has been completed. The return\
    \ type for `IAsyncAction` and `IAsyncActionWithProgress` is `void`. That could\
    \ be beneficial for an async method that begins a file-copy operation but not\
    \ so much for an async method that reads a file's contents.\n\n### To the example,\
    \ let's add another async method:\n\n### When using `ReadAsync`, the `get` method\
    \ will send the `hstring` result to the caller as soon as the process is finished:\n\
    \nIf the `get` method returns true, the resultant string will include the value\
    \ returned by the async function once it completes successfully. If an error occurs,\
    \ for example, execution may not return.\n\nThe `get` method is restricted in\
    \ that it cannot be called from a UI thread, and it does not fully leverage the\
    \ machine's parallelism because it locks the caller thread until the async function\
    \ completes. Using a coroutine allows the async function to finish without tying\
    \ up a valuable resource for an indefinite time.\n\n# MEETING THE NEEDS OF ASYNC\
    \ COMPLETION\n\nLet's take a closer look at how async interfaces operate now that\
    \ we understand how they work in general. What additional choices do we have if\
    \ we're not pleased with the blocking delay given by the `get` method? We'll soon\
    \ shift gears and focus solely on coroutines, but first, let's look at those async\
    \ interfaces to see what they have to offer. The contract and state machines indicated\
    \ by those interfaces are used by both the coroutine support and the `get` method\
    \ we saw before.\n\nWe won't go into too much detail because we don't need to\
    \ know much about them, but let's go over the essentials, so we're prepared if\
    \ we ever have to use them for something unusual. The `IAsyncInfo` interface is\
    \ the logical ancestor of all async interfaces. We can't do much with `IAsyncInfo`,\
    \ and, unfortunately, it exists at all because it adds some overhead.\n\nThe only\
    \ `IAsyncInfo` elements worth considering are `Status` and `Cancel`, which can\
    \ be used to request cancellation of a long-running operation whose result is\
    \ no longer required.\n\nIf we need to know whether an async method has been completed\
    \ without waiting for it, the `Status` member can help.\n\nExample\n\nIndividual\
    \ versions of the `GetResults` method are provided by each of the four async interfaces,\
    \ not by `IAsyncInfo` itself. They should be called only after the async function\
    \ has been completed. This is not to be confused with the `C++/WinRT` `get` method.\
    \ `Get` is implemented by `C++/WinRT`, whereas `GetResults` is implemented via\
    \ the async method. If the async method is still running, `GetResults` will not\
    \ block, and if called prematurely, it will most likely produce `hresult` illegal\
    \ method call exception. Without a doubt, we can begin to comprehend how the blocked\
    \ obtain method works. In terms of concept, it looks like this:\n\n```\nThe actual\
    \ implementation is a little more complex, but this gives us a good idea of what's\
    \ going on. The issue is that `GetResults` is called regardless of whether it's\
    \ an `IAsyncOperation` or an `IAsyncAction` that doesn't return a result. The\
    \ reason for this is because `GetResults` is in charge of propagating any errors\
    \ that may have happened during the async method's implementation and will rethrow\
    \ an exception if necessary.\n```\n"
  raw: '## COROUTINES AND C++ FOR EFFECTIVE ASYNC


    In the same way, everything else in the Windows Runtime focuses on allowing components
    to provide async methods and making it simple for applications to use those async
    methods, the Windows Runtime has a fundamental async model. It doesn''t provide
    a concurrency runtime or even any building blocks for creating or consuming async
    methods on its own. Instead, unique language projections are responsible for all
    of this.


    This is how it should be, and it''s not intended to make the Windows Runtime async
    pattern any easier. Implementing this pattern correctly is no easy task. Of course,
    this implies that the developer''s preferred programming language significantly
    impacts a developer''s view of async in the Windows Runtime. For example, a developer
    who has only worked with C++/CX could incorrectly but sensibly believe that async
    is a disaster.


    The ideal concurrency framework for a C# developer will be different from the
    ideal concurrency library for a C++ developer. The language''s role, and libraries''
    role in C++, is to handle the async pattern''s mechanics and offer a logical bridge
    to a language-specific implementation.


    In C++, coroutines are the ideal abstraction for both implementing and invoking
    async functions, but first, let''s review how the async model works. Consider
    the following example of a class with a single static method:


    By convention, async methods finish in “Async”, so we might think of this as the
    Copy async method. There''s a chance there''s a blocking or synchronous alternative
    named Copy. A caller could desire a blocking Copy function for a background thread
    and a non-blocking, or asynchronous, Copy method for a UI thread that can''t afford
    to block for fear of looking unresponsive.


    At first, glance, calling the CopyAsync function appears to be fairly easy. The
    following C++ code might be written:


    Even though running the CopyAsync function in a typical procedural fashion, the
    resultant IAsyncAction isn''t the final result of the async method. IAsyncAction
    is the object that a caller can use to synchronously or asynchronously wait for
    a result, depending on the context. There are three more well-known interfaces
    that follow a similar pattern and provide various capabilities for the callee
    to convey information back to the caller, in addition to IAsyncAction. The four
    async interfaces are compared in the table.


    | Name | Result | Progress |


    | --- | --- | --- |


    | IAsyncAction | N | N |


    | IAsyncActionWithProgress | N | Y |


    | IAsyncOperation | Y | N |


    | IAsyncOperationWithProgress | Y | Y |


    *   **Async Interfaces are compared**


    *   **Expressed Async Interfaces**


    Although IAsyncAction and IAsyncActionWithProgress can wait for an async function
    to complete, these interfaces do not provide any observable result or return value.
    IAsyncOperation and IAsyncOperationWithProgress expect the Result type parameter
    to specify the kind of result that may be expected after the async procedure completes
    successfully. Finally, the Progress type argument is used by IAsyncActionWithProgress
    and IAsyncOperationWithProgress to provide the type of progress information anticipated
    regularly for long-running operations until the async function completes.


    There are a few ways to wait for an async method''s result. We won''t go into
    detail about each one because it would make this a very long essay. While there
    are other approaches to async completion, we only advocate async.get method, which
    does a blocking wait, and the co await async expression, which conducts a cooperative
    wait in the context of a coroutine. Neither is superior to the other; they just
    fulfill distinct functions. Let''s have a look at how to do a blocking wait.


    **The get method may be used to create a blocking wait like follows:**


    **Holding on to the async object has minimal benefit, thus the following form
    is preferred:**


    It''s crucial to remember that the get method will block the caller thread until
    the async function completes. As a result, using the get method on a UI thread
    is not recommended since it may cause the program to become sluggish. If we try
    to do so in an unoptimized build, an assertion will fire. The get method is excellent
    for console apps or background threads if we don''t want to utilize a coroutine
    for whatever reason.


    The get function will return any result to the caller after the async procedure
    has been completed. The return type for IAsyncAction and IAsyncActionWithProgress
    is void. That could be beneficial for an async method that begins a file-copy
    operation but not so much for an async method that reads a file''s contents.


    **To the example, let''s add another async method:**


    **When using ReadAsync, the get method will send the hstring result to the caller
    as soon as the process is finished:**


    If the get method returns true, the resultant string will include the value returned
    by the async function once it completes successfully. If an error occurs, for
    example, execution may not return.


    The get method is restricted in that it cannot be called from a UI thread, and
    it does not fully leverage the machine''s parallelism because it locks the caller
    thread until the async function completes. Using a coroutine allows the async
    function to finish without tying up a valuable resource for an indefinite time.


    ## MEETING THE NEEDS OF ASYNC COMPLETION


    Let''s take a closer look at how async interfaces operate now that we understand
