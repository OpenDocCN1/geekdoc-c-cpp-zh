    \n    *   The promise object's destructor is called.\n\n    *   Calls the function\
    \ parameter copies' destructors.\n\n    *   To release the memory occupied by\
    \ the coroutine state, call operator delete.\n\n    *   Returns control to the\
    \ caller.\n\n## HEAP ALLOCATION\n\nCoroutine state is allocated on the heap using\
    \ the non-array operator new.\n\nIf a class-level replacement is defined in the\
    \ Promise type, it will be utilized; otherwise, the new global operator will be\
    \ used.\n\nThose arguments will be provided to operator new if the Promise type\
    \ provides a placement form of operator new that accepts extra parameters, and\
    \ they match an argument list where the first argument is the size requested (of\
    \ type std::size_t) and the rest are the coroutine function arguments (this makes\
    \ it possible to use leading-allocator-convention for coroutines).\n\nEven if\
    \ a custom allocator is used, the call to operator new can be optimized away if:\n\
    \n*   The coroutine state's lifespan is tightly nested within the caller's lifetime.\n\
    \n*   If the size of the coroutine frame is known at the call site, the coroutine\
    \ state is embedded in the caller's stack frame (if the caller is an ordinary\
    \ function) or coroutine state is embedded in the caller's stack frame.\n\n###\
    \ Promise\n\nWe can add field value_ to this type and transfer values from the\
    \ coroutine to our main function because we know the coroutine state contains\
