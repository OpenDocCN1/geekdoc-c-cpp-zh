    | 字符 | char |

    | 整数 | int |

    | 浮点 | float |

    | 双精度浮点 | double |

    | 布尔 | void |

    | 宽字符 | wchar_t |


    可以使用一个或多个修饰符来修改任何一种类型。


    | 类型 | 典型宽度 | 典型范围 |

