    # 运算符 (OPERATORS)


    指示编译器执行某些数学或逻辑操作的符号称为运算符。C++ 拥有大量的内置运算符，包括以下：


    *   算术运算符

    *   关系运算符

    *   逻辑运算符

    *   位运算符

    *   赋值运算符

    *   杂运算符


    ### 算术运算符 (Arithmetic Operators)


    | 运算符 | 说明 | 示例 |

    | --- | --- | --- |

    | `+` | 加两个操作数 | `C + D` |

    | `–` | 从第一个操作数中减去第二个操作数 | `C - D` |

    | `*` | 乘两个操作数 | `C * D` |

    | `/` | 被除数除以除数 | `D / C` |

    | `%` | 取模运算符以及整数除法后的余数 | `D % C` |

    | `++` | 递增运算符将整数值加一 | `C++` |

    | `--` | 递减运算符将整数值减一 | `C--` |


    ### 关系运算符 (Relational Operators)


    | 运算符 | 说明 | 示例 |

    | --- | --- | --- |

    | `==` | 如果两个操作数的值相等，则条件设置为真。 | `(C == D)` 为假。 |

    | `!=` | 检查两个操作数的值是否相等；如果不相等，则条件返回真。 | `(C != D)` 为真。 |

    | `>` | 检查左操作数的值是否大于右操作数的值；如果是，则条件为真。 | `(C > D)` 为假。 |

    | `<` | 检查左操作数的值是否小于右操作数的值；如果是，则条件为真。 | `(C < D)` 为真。 |

    | `>=` | 如果左操作数的值大于或等于右操作数的值，则条件为真。 | `(C >= D)` 为假。 |

    | `<=` | 如果左操作数的值小于或等于右操作数的值，则条件为真。 | `(C <= D)` 为真。 |


    ### 逻辑运算符 (Logical Operators)


    | 运算符 | 说明 | 示例 |

    | --- | --- | --- |

    | `&&` | 称为逻辑与（AND）运算符。当两个操作数都非零时，条件变为真。 | `(C && D)` 为假。 |

    | `||` | 称为逻辑或（OR）运算符。如果两个操作数中有一个非零，则条件为真。 | `(C || D)` 为真。 |

    | `!` | 称为逻辑非（NOT）运算符。使用它时，操作数的逻辑状态会反转。如果条件为真，逻辑非运算符返回假。 | `!(C && D)` 为真。 |


    ### 位运算符 (Bitwise Operators)


    | p | q | `p & q` | `p | q` | `p ^ q` |

    | --- | --- | --- | --- | --- |

    | 0 | 0 | 0 | 0 | 0 |

    | 0 | 1 | 0 | 1 | 1 |

    | 1 | 1 | 1 | 1 | 0 |

    | 1 | 0 | 0 | 1 | 1 |


    ### 赋值运算符 (Assignment Operators)


    | 运算符 | 说明 | 示例 |

    | --- | --- | --- |

    | `=` | 赋值运算符非常简单。将右侧操作数的值赋值给左侧操作数。 | `A = C + D` 将 `C + D` 的值赋值给 `A` |

    | `+=` | 使用赋值运算符和加，将右操作数加到左操作数上，并将结果赋值给左操作数。 | `A += C` 等同于 `A = A + C` |

    | `-=` | 减法赋值（减并赋值）（从左操作数中减去右操作数，并将结果赋值给左操作数）。 | `A -= C` 等同于 `A = A - C` |

    | `*=` | 乘法赋值运算符将右、左操作数相加并将结果赋值给左操作数。 | `C *= A` 等同于 `C = C * A` |

    | `/=` | 除法赋值运算符：它将左操作数除以右操作数，并将结果赋值给左操作数。 | `A /= C` 等同于 `A = A / C` |

    | `%=` | 赋值运算符和取模，使用两个操作数计算取模并将结果赋值给左操作数。 | `A %= C` 等同于 `A = A % C` |

    | `<<=` | 左移赋值运算符。 | `A <<= 2` |

    | `>>=` | 右移赋值运算符。 | `A >>= 2` |

    | `&=` | 位与赋值运算符。 | `A &= 2` |

    | `^=` | 位异或赋值运算符。 | `A ^= 2` |

    | `|=` | 位或赋值运算符。 | `A |= 2` |


    ### 杂运算符 (Misc Operators)


    | 序号 | 运算符及说明 |

    | --- | --- |

    | 1 | `sizeof` 返回整数。 |

    | 2 | `? :` 是条件运算符。如果条件为真，返回 `X` 的值；否则返回 `Y` 的值。 |

    | 3 | 使用逗号运算符执行一系列操作。 |

    | 4 | `.` 和 `->` 引用类、结构和联合成员。 |

    | 5 | 转换操作更改数据类型。 |

    | 6 | `&` 返回变量的地址。 |

    | 7 | `*` 引用。 |


    ## 运算符优先级 (OPERATORS PRECEDENCE)


    表达式中项的处理顺序由运算符优先级决定。某些运算符优于其他运算符，例如复制。


    | 类别 | 运算符 | 结合性 |

    | --- | --- | --- |

    | 后置 | `()` `[]` `->` `++` `--` | 左到右 |

    | 一元 | `+` `-` `!` `~` `++` `--` `&` `sizeof` | 右到左 |

    | 乘法 | `*` `/` `%` | 左到右 |

    | 加法 | `+` `-` | 左到右 |

    | 移位 | `<<` `>>` | 左到右 |

    | 关系 | `<` `<=` `>` `>=` | 左到右 |

    | 等于 | `==` `!=` | 左到右 |

    | 位与 | `&` | 左到右 |

    | 位异或 | `^` | 左到右 |

    | 位或 | `|` | 左到右 |

    | 逻辑与 | `&&` | 左到右 |

    | 逻辑或 | `||` | 左到右 |

    | 条件 | `?:` | 右到左 |

    | 赋值 | `=` `+=` `-=` `*=` `/=` `%=` `<<=` `>>=` `&=` `^=` `|=` | 右到左 |

    | 逗号 | `,` | 左到右 |


    ## C++ 中的循环 (LOOP IN C++)


    你可能会遇到需要多次运行代码块的情况。语句通常按以下顺序执行：首先执行函数的第一个语句，然后是第二个，依此类推。


    | 序号 | 循环类型及描述 |

    | --- | --- |

    | 1 | while 循环当给定条件为真时，重复语句或一组断言。在执行循环体之前检查条件。 |

    | 2 | for 循环控制循环变量的代码通过执行一系列指令来多次执行。 |

    | 3 | do...while 循环它与 `while` 语句相似，只是它在循环体结束后检查条件。 |

    | 4 | 嵌套循环可以在另一个‘while’‘for’或`do..while loop`中使用一个或多个循环。 |


    ### 循环控制语句 (Control Statements for Loops)


