    \ const;`\n* **Returns:** True if `*this` represents an integral type argument.\n\
    \n* `bool is_numeric() const;`\n* **Returns:** If `*this` represents a numeric\
    \ type argument, then true.\n\n* `bool is_pointer() const;`\n* **Returns:** If\
    \ `*this` represents an argument of type `const void*`, then it is true.\n* **Complexity:**\
    \ The number of potential value types for a formatting parameter has no bearing\
    \ on the invocation of `is_integral`, `is_numeric`, and `is_pointer`.\n\n## FORMATTING\
    \ ARGUMENT VISITATION\n\n* `template <class Visit, class Cont>`\n* **Requires:**\
    \ For all possible value types of a formatting parameter, the expression in the\
    \ effects section must be a valid expression of the same type otherwise the program\
    \ is ill-formed.\n* **Effects:** Allow value to be the formatting parameter arg's\
    \ value. `INVOKE(forward(vis), value);` returns the result.\n* **Remarks:** The\
