    ## 重载（OVERLOADING）


    函数重载（Function overloading）和运算符重载（operator overloading）是 C++ 中使用的两个术语，用于描述在同一作用域内为同一个函数名或运算符指定多个定义的能力。


    重载声明是指与同一作用域内之前声明的声明具有相同名称，但两个声明具有不同的参数且定义有的定义。


    当你调用重载函数或运算符时，编译器通过比较你调用函数或运算符时使用的参数类型与定义中提供的参数类型，确定应用哪种定义。


    ### 函数重载（Overloading Function）


    在 C++ 中，函数重载意味着同一个函数名在同一作用域内可以有多个定义。每个函数声明中参数列表的种类和/或数量必须不同。仅通过返回类型进行区分来重载函数声明是不可能的。


