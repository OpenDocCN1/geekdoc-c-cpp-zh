  raw: "It's worth noting that our promise object copies i's value from the coroutine\
    \ into promise type::value_ before passing it to the main function. We could have\
    \ made value_an unsigned * and returned a reference to the variable I within counter3\
    \ in a somewhat confusing way. Because the coroutine's local variables are stored\
    \ in the heap's coroutine state object and their memory is preserved between co_await\
    \ calls until the coroutine handle is destroyed; this is something we can achieve.\
    \ It would be even handier to put I within the return object; however, there is\
    \ no graceful method to do so due to the way return objects are built.\n\nUsing\
    \ std::coroutine traits, the compiler determines the Promise type from the coroutine's\
    \ return type.\n\nLet R and Args… indicate the return type and parameter type\
    \ list of a coroutine, respectively, and ClassT and/*cv-qual*/(if any) denote\
    \ the class type to which the coroutine belongs and its cv-qualification, respectively,\
    \ if it is declared as a non-static member function.\n\n*   If the coroutine is\
    \ not declared as a non-static member function, use std::coroutine_traits<R, Args…>::\
    \ promise type.\n\n*   If the coroutine is declared as a non-static member function\
    \ that is not rvalue-reference-qualified, use std::coroutine_traits<R, ClassD/*cv-qual*/&,\
    \ Args…>::promise type.\n\n*   If the coroutine is specified as a rvalue-reference-qualified\
    \ non-static member function, use std::coroutine_traits<R, ClassD/*cv-qual*/&&,\
    \ Args…>::promise type.\n\n### co_await\n\nThe unary operation co_await suspends\
    \ a coroutine and hands control back to the caller. Its operand is an expression\
    \ whose type either defines operator co_await or can be converted to such a type\
    \ using the current coroutine's type conversion Promise::await_transform.\n\n\
    ### co_wait expr\n\n*   **To begin, expr is transformed to an awaitable in the\
    \ following way:**\n\n    *   The awaitable is expr, as-is, if expr is created\
    \ by an initial suspend point, a final suspend point, or a yield expression.\n\
    \n    *   Otherwise, the awaitable is promise.await_transform if the current coroutine's\
    \ Promise type contains the member function await_transform.\n\n    *   Otherwise,\
    \ the awaitable is expr as-is.\n\n*   **The awaiter object is then acquired in\
    \ the following manner:** If the operator co_await overload resolution yields\
    \ a single best overload, the awaiter results from that call (awaitable).\n\n\
    \    *   For member overload, use co_await(); for non-member overload, use co_await(static_castAwaitable&&>(awaitable)).\n\
    \n    *   Otherwise, the awaiter is awaitable as-is if overload resolution finds\
    \ no operator co await.\n\n    *   Otherwise, the program is ill-formed if the\
    \ overload resolution is unclear.\n\nThe awaiter object is a temporary materialized\
    \ from the expression above if it is a prvalue. If the expression above is a glvalue,\
    \ the object to which it refers to the awaiter object.\n\nThen awaiter.await_ready()\
    \ is invoked (a shortcut to avoid the expense of suspension if the result is known\
    \ to be ready or can be finished synchronously). If the result is false when contextually\
    \ transformed to bool, then.\n\nThe coroutine has been halted (its coroutine state\
    \ is populated with local variables and current suspension point).\n\nThe current\
    \ coroutine's handle is called Handle, and awaiter.await_suspend(handle) is invoked.\
    \ The suspended coroutine state is visible via that handle inside that function,\
    \ and it's up to this function to schedule it to restart on some executor or be\
    \ destroyed (returning false counts as scheduling).\n\n*   Otherwise, control\
    \ is instantly given to the current coroutine's caller/resumer if await suspend\
    \ returns void (this coroutine stays suspended).\n\n*   The value true restores\
    \ control to the current coroutine's caller/resumer if await suspend returns bool,\
    \ whereas the value false resumes it.\n\n*   If await suspend delivers a coroutine\
    \ handle for another coroutine, it is resumed (through a call to handle.resume()).\n\
    \nFinally, awaiter.await_resume() is invoked, and the result is the co_await expr\
    \ expression's result.\n\nThe resume point is immediately before the call to awaiter.await_resume\
    \ if the coroutine was suspended in the co_await expression and later resumed\
    \ ().\n\n**Example:**\n\n### The Coroutine Return Object Is As Follows\n\nThe\
    \ return type of counter was disregarded in the preceding case. The language does,\
    \ however, limit the sorts of coroutines that can be returned. A coroutine's return\
    \ type call it R must be an object type with the nested type R::promise_type.\
    \ 2 R::promise type must include a method R get_return object() that returns an\
