    *   性能

    *   使用协程进行异步编程


    在本章中，我们将涵盖什么是 C++ 协程、它们具有什么限制、如何执行它们，以及当一个开始运行时会发生什么。我们还将发现堆分配（Heap allocation）和承诺（promises）是什么。协程在计数内部获取其承诺对象的最佳方法是什么。我们将在在本节介绍
    `co_await()`、`co_yield` 和 `co_return` 运算符。我们还将学习什么是生成器，以及许多生成器、协程以及用于高效异步的 C++。


    ## 什么是 C++ 协程？


    协程是可以在保持状态的同时被挂起和恢复的函数。在 C++ 中，函数的演进更进了一步。我在 C++20 中提出的新概念其实非常古老。“协程”（coroutine）一词是由
    Melvin Conway 创造的。1963 年，他在关于构建编译器的论文中使用了这个词。根据 Donald Knuth 的说法，过程是协程的子集。协程可以在稍后时间挂起并重启的函数。协程是无栈的，因为它们在挂起执行后会返回给调用者，而恢复执行所需的数据独立于栈保存。这使得异步顺序代码（例如，处理非阻塞
    I/O 而无需显式回调）以及惰性计算无限序列和其他应用成为可能。


    C++20 通过新关键字 `co_await` 和 `co_yield` 为 C++ 函数的执行引入了两个新想法。


    使用 `co_await` 表达式可以暂停和重启表达式的执行。当在函数中使用 `co_await` 表达式时，如果函数的结果不可用，则调用 `auto getResult
    = func()` 不会阻塞。我们拥有了资源友好的等待，而不是消耗资源的阻塞。


    可以使用 `co_yield` 表达式编写生成器函数。每次调用生成器函数时，都会返回一个新值。生成器函数是一种数据流，可用于选择值。数据流是无限的。结果是，我们处于惰性求之中。


    协程是可以互相调用的但不共享栈的函数，允许它们随时挂起执行以进入不同的协程。C++20 协程是以 C++ 真正的精神实现的，像是一块埋在成堆垃圾背后的可爱微小金块，我们必须穿过这些垃圾才能到达有趣的部分。我们对这种设计并不满意，因为最近的语言更新都做得更优雅，但协程不是。


    协程变得更加复杂，因为 C++ 标准库没有提供访问协程所需的垃圾堆，所以我们必须自己创建并穿过它。


    Future（未来）和 promise（承诺）被广泛用于解释甚至指定 C++ 协程，这是需要注意的。C++ `<future>` 头文件中的 `std::future`
    和 `std::promise` 类型与这些词无关。具体而言，对于协程承诺对象，`std::promise` 不是一个可接受的类型。


    ### co_await


    现在这些这些之后，C++20 为我们提供了一个名为 `co_await` 的新运算符。通常，公式 `co_await a;` 执行以下操作：


    *   确保当前函数（必须是协程）将所有局部变量保存到堆分配的对象中。

    *   创建一个可调用对象，该对象在调用时会在评估 `co_await` 语句的地方恢复协程的执行。

    *   调用（或者说跳转到）`co_await` 目标对象 `a` 的一个方法，并将步骤 2 中的可调用对象传递给该方法。


