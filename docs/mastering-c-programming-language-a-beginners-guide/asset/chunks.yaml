    \n尝试以以下方式定义已删除的函数将导致错误：\n\n1. **示例：**\n\n## 显式删除函数有什么好处？\n\n- 删除特殊成员函数，以便更容易防止编译器创建我们不想要的特殊成员函数。（如示例“禁用拷贝构造函数”所示）。\n\
    - 通过删除成员函数或非成员函数，防止问题的类型提升调用不必要的函数（如“禁用不必要的参数转换”示例所示）。\n\n## 什么是 Lambda？\n\n它是一种创建函数对象或匿名函数对象的简单方法。它非常有用，因为我们可以局部定义它并调用它，或者将其作为参数传递给函数。Lambda\
    \ 也容易阅读，因为所有内容都在一个位置。\n\n### 使用 Lambda 的表达式\n\n在 C++ 中，lambda 的定义如下：\n\n**示例：**\n\
    \n在底层，`plus one` 是这段代码中的一个函数对象（functor）。\n\n### 函数对象（Functor）\n\n函数对象（通常称为 function\
