    #### is_detected\n\n为了泛化类型特征生成，有实验性的特征 `detected_or`、`detected_t` 和 `is_detected`，它们基于\
    \ SFINAE。\n\n使用模板参数 `template <typename...> Op` 和 `typename ... args`：\n\n- 根据\
