    用于竞赛编程的最优语言是 `C++` 和 `Java`。大多数竞赛编程程序员都使用 `C/C++`。`Java` 是第二受欢迎的竞赛编程语言。由于每种语言中都有标准模板库
    (`STL`) 和 Java 库，`C++` 和 `Java` 是被推荐的语言。由于 `C++` 为用户提供了对系统资源的控制，精通程序员可以构建出比其他编程语言构建的更快、更强大的程序。因此，`C++`
    是创建游戏引擎、游戏和其他资源密集型应用程序的首选语言。


    `C++` 是一种灵活的语言。`C++` 是一种支持多种范式的编码语言。这意味着除了面向对象编程外，它还允许过程编程。这些范式基本上是处理和解决编码挑战的不同方法；两个
    `C++` 程序员可能会以不同的方式处理和解决同一个编码问题。为了获得最佳效果，可能会混合多种范式。


    不同的问题解决方法让 `C++` 变得更加困难，但也让它更加强大。总有新东西可以学习。


    `C++` 是一种性能导向的语言。尽管 `C++` 被广泛应用于各个领域并可用于开发几乎任何东西，但它在交付性能和有效利用系统资源方面表现出色。由于 `C++`
    为用户提供了对系统资源的控制，精通程序员可以构建出比其他编程语言构建的更快、更强大的程序。因此，`C++` 是创建游戏引擎、游戏和其他资源密集型应用程序的首选语言。大多数
    AAA 游戏使用 `C++` 开发，因为它们推向了硬件的极限，因此资源效率至关重要。这使得 `C++` 成为某些金融应用程序的选语言，在高频交易平台中，性能的微小变化就可能是盈亏的区别。


    `C++` 是一门耗时的学习语言，但从远来看是值得的。由于其复杂性，`C++` 通常被认为比其他语言更“难”学习。它确实比其他某些语言需要更多的时间精力，但它并没有那么困难。如果你需要学习其他
    C 系语言的任何一种，你现在投入的时间以后将会得到回报，因为你已经完成了大部分工作。


    作为你投资的回报，你将获得各个领域广泛的职业选择。`C++` 的长期流行反映在高数量的职位空缺中。不仅许多新应用是用 `C++` 编写的，大量使用该语言的现有系统也需要招聘程序员来保持其最新和更新。


    此外，由于 `C++` 应用需要大量的代码来扩展，某些组织要求相当大的开发团队（相对于其他语言）。因此，熟练的 `C++` 程序员将一直很有需求。最后，许多程序员可能因为游戏开发等领域迷人的职业前景而学习
    `C++`。这些是难以进入的领域，需要大量的奉献和努力。


    ### `C++` 职位空缺


    根据开发者调查，`C++` 是整体上最受欢迎的第六大编程语言，19.4% 的受访者表示他们在使用它。其他 C 语言也很流行（任何 `C++` 开发者学习这些语言都会有一个良好的开始）。`C#`（一种基于
    `C++` 的微软语言，旨在整合 Visual Basic 的最佳特性）排名第四，总使用率为 30.9%，而 `C++` 的前身排名第七，使用率为 15.5%。


    技能分析平台 Gooroo 记录了美国每月每月会发布约 5,900 个 `C++` 职位（全球约 10,000 个），美国平均薪资超过 100,000 英镑（全球略高于
    80,000 美元）。根据经验，平均 `C++` 水资 `PayScale` 还有一个趣的图表，说明了程序员工资和经验之间的关系。在大多数情况下（例如，平均
    .NET 开发者的薪资），增长是稳定且可预测的。收入越高，经验年数越多。涉及到 `C++` 开发人员工资时，情况稍微复杂一些。初级和初级开发者的薪资相当稳定，但在工作约
    5 年后会逐渐增加。可以想象，这是因为 `C++` 是一门难以掌握的语言。学习需要多年，但一旦你精通了，你将获得丰厚的回报。


    `C++` 开发者在就业市场上需求很大，因此了解薪资方面的预期情况至关重要。另一方面，`C++` 被广泛应用于各个领域，主要在应用领域。`C++` 是一种广泛使用的编程语言。`Microsoft
    Windows`、`Mac OSX` 和 `Linux` 都是基于 `C++` 和 C 的操作系统，两个最流行的数据库 `MySQL` 和 `Postgres`
    也是。`C++` 也常用于涉及计算机视觉和高端图形处理应用程序（如视频游戏）的后端技术。`C++` 也适用于嵌入式系统（如智能手表和医疗设备）、金融系统、电话交换机、云存储系统、浏览器和编译器。是什么让
    `C++` 如此受欢迎且为人知的后端技术？它是 `C` 的改进版本，是一种通用的、编译的、静态类型的、大小写敏感且自由的编程语言。`C++` 中的 `STL`
    提供了广泛的库。`C++` 比其他语言更快，这是该语言最大的优势之一。`C++` 开发者负责编写或修改高效的 `C++` 代码以创建各种应用程序。他们还负责内存问题。换句话说，`C++`
    开发人员的工作是设计帮助组织运行更顺畅的可执行程序。


    其他影响 `C++` 开发者收入的因素：`C++` 的优势在于可以兼容广泛的硬件技术。因此，具有技能的 `C++` 程序员将一直获得报酬。以下是一些顶尖技能：具有
    `Android`、`OS X`、`iOS`、`Windows` 和 `Linux` 的经验，以及数据库（如 `MySQL` 或 `MongoDB`）、内存管理、`TCP/IP`
    协议、持续集成等，具体取决于项目。


    根据项目和组织，还需要项目管理技术的知识、算法和数据结构的专业知识、对软件开发生命周期的了解以及熟悉其他编程语言（如 `C`、`C#`、`Java`、`Python`
    等）。


    ### C++的应用


    *   **C++ 游戏**：`C++` 很快且接近硬件。它可以快速处理资源，为 CPU 密集型任务提供过程编程，并且接近硬件。它可以处理 3D 游戏的复杂性，并具有多个网络层。由于这些优势，它是创建游戏系统和游戏开发套件的首选平台。


