    ## 分号与代码块


    在 C++ 中，分号是语句的结束符。也就是说，每一条单独的语句都应该以分号结束。它表示一个逻辑实体的结束。


    **例如**


    代码块（block）是封装在左括号和右括号中的逻辑相关的语句集合。


    ### 标识符 (Identifiers)


    C++ 标识符用于标识变量、函数、类、模块或任何其他用户定义的实体。C++ 中的标识符以 A 到 Z、a 到 z 的字母或下划线 (`_`) 开头，随后零或多个字母、下划线或数字（0
    到 9）以及 `@`、`$` 和 `%` 等标点字符。C++ 是一种大小敏感的编程语言。


    ### 关键字 (Keywords)


    C++ 中的保留术语如下表所示。这些保留术语不能用作常量、变量或其他类型的标识符名称。


    | asm | else | new | this |

    | auto | enum | operator | throw |

    | bool | explicit | private | true |

    | break | export | protected | try |

    | case | extern | public | typedef |

    | catch | false | register | typeid |

    | char | float | reinterpret_cast | type name |

    | class | for | return | union |

    | const | friend | short | unsigned |

    | const_cast | goto | signed | using |

    | continue | if | sizeof | virtual |

    | default | inline | static | void |

    | delete | int | static_cast | volatile |

    | do | long | struct | wchar_t |

    | double | mutable | switch | while |

    | dynamic_cast | namespace | template |  |


    ## 注释 (COMMENTS)


    解释性语句可以作为程序注释包含在 C++ 代码中。阅读源代码的人都会从这些注释中受益。所有的编程语言都以某种方式提供注释。


    C++ 支持单行注释和多行注释。C++ 编译器会忽略每个注释内部的所有字符。


    C++ 中的注释以 `/*` 开始，以 `*/` 结束。


    **示例：**


    *   `/* 这是一个注释 */`


    注释也可以以 `//` 开头


    *   `cout << "Hello World"; // 打印 Hello World`


    ## 数据类型 (DATA TYPES)


    在任何语言中开发程序时，你必须使用许多变量来存储不同的信息。变量只是可以存储值的预留内存区域。这意味着当你创建一个变量时，你为它预留了一些内存。


    你可能想要保存不同数据类型的数据，例如字符、宽字符、整数、浮点、双精度浮点、布尔型等。分配内存的操作系统决定了根据变量的数据类型可以在预留内存中存储什么。


