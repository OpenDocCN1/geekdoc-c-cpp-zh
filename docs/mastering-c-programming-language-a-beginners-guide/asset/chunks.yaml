    \ auto storage class is the default storage class.\n\n    **Example:**\n\n*  \
    \ **register:** The register storage class is used to create local variables that\
    \ should be kept in a register rather than RAM. The variable's maximum length\
    \ is equal to the register size; therefore it can't be used with the unary ‘&’\
    \ operator.\n\n    **Example:**\n\n*   **static:** The static storage class tells\
