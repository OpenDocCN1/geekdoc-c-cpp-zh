    Returns a copy of the `args` object provided to the `basic_context` function.\n\
    \n## FORMATTING BUFFER\n\n* `template <class Char>`\n\n## FORMAT STRING\n\n* `template\
    \ <class Char>`\n\n## USER-DEFINED TYPES\n\nIf a format string refers to a user-defined\
    \ type object, as in:\n\n`buf, x, ctx` where `buf` is a reference to the formatting\
