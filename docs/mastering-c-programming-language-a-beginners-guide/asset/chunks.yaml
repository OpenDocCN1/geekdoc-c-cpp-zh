    \ if none is specified.\n\n    *   Calls promise to get return object() returns\
    \ an object and stores it in a local variable. When the coroutine initially suspends,\
    \ the outcome of that call will be returned to the caller. Exceptions are thrown\
    \ up to and, including this stage, returned to the caller rather than stored in\
    \ the promise.\n\n    *   co_awaits the outcome of calls promise.initial_suspend().\
    \ Suspend_always for lazily-started coroutines and never suspend for eagerly-started\
    \ coroutines are the two most used Promise kinds.\n\n    *   When co await promise.initial\
    \ suspend() returns, the coroutine's body is executed.\n\n*   **When a coroutine\
