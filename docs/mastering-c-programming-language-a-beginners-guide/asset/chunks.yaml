    \n## 错误报告\n\n`format_error` 类指定了当格式化库遇到错误时作为异常抛出的对象类型。\n\n在本章中，我们学习了如何在数值类型和字符串类型之间转换数据、数值类型的局限性与其他属性，以及如何创建处理过的（cooked）和原始（raw）用户定义字面量。我们还学习了如何开发字符串辅助库，以及\
    \ `std::format` 用于文本格式化的作用。\n\n# 第 4 章：探索 C++ 函数\n\nDOI: [10.1201/9781003214762-4](https://doi.org/10.1201/9781003214762-4)\n\
    \n## 本章内容\n\n- 默认函数与删除函数\n- Lambda 表达式与标准算法\n- 带有数量数量参数的函数模板\n- 使用折叠表达式简化变变函数模板\n\
    - 实现高阶函数 Map 和 Fold\n\n在上一章中，我们学习了如何在数值类型和字符串类型之间转换数据、数值类型的局限性与其他属性，以及如何创建处理过的（cooked）和原始（raw）用户定义字面量。我们还学习了如何开发字符串辅助库，以及\
    \ `std::format` 用于文本格式化的作用。\n\n在本章中，我们将注意力转向 C++ 函数等主题，包括函数处理、表达式等等。\n\n## 什么是默认函数的定义？\n\
    \n显式默认函数声明是 C++11 标准引入的新种函数声明，它允许通过在函数声明末尾添加 `=default` 指定符来将函数定义为显式默认的。这会导致编译器为显式默认函数创建默认实现，这种实现比人工编写的效率更高。当我们定义一个参数化函数\
    \ `Object` 时，编译器不会构建默认函数 `Object`。在这种情况下，我们可以使用默认指定符构造一个默认函数。下面的代码说明了如何操作：\n\n\
