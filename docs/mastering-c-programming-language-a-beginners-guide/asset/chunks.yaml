    循环中的控制语句会改变执行顺序。当执行离开该作用范围时，在该作用范围内生成的所有自动化对象都会被删除。


    | 序号 | 控制语句及描述 |

    | --- | --- |

    | 1 | `break` 语句：终止循环或 `switch` 语句，并将执行转移到循环或 `switch` 之后的语句。 |

    | 2 | `continue` 语句：强制循环跳过主体的剩余部分，并在重复之前立即重新测试状态。 |

