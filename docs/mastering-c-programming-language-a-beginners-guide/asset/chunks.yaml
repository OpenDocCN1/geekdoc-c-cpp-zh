    尽管有相似之处，但 `C` 和 `C++` 是两种不同的编程语言，应该被区别对待。在它们诞生约 50 年后的今天，`C` 和 `C++` 仍然有独特的用例。


    要决定是学习 `C` 还是 `C++`，请考虑你打算将所学技能用于什么种程序。


    ## 可用的用于集成和运行的 C++ 编译器


    * `IBM C++`

    * `Intel C++`

    * `Microsoft Visual C++`

    * `Prophet C++`

    * `HP C++`


    ## C++ 编程的应用

    如前所述，`C++` 可能是最通用的编程方言。它在编程进步的几乎每个领域都有其精髓。我在这里列出其中几个：


    * **应用软件开发：** `C++` 编程已用于开发几乎每一个主要的操作系统，如 `Windows`、`Mac OSX` 和 `Linux`。除了工作框架外，`Mozilla
    Firefox` 和 `Chrome` 等许多程序的内核都是使用 `C++` 编写的。`C++` 同样用于培养最著名的数据集框架 `MySQL`。

    * **编程语言开发：** `C++` 已广泛用于开发新的编程方言，如 `C#`、`Java`、`JavaScript`、`Perl`、`UNIX 的 C
    Shell`、`PHP` 和 `Python` 以及 `Verilog` 等。

    * **计算编程：** 由于 `C++` 快速运行速度和计算效率，它是研究人员最亲的伴侣。

    * **游戏开发：** `C++` 速度快，允许软件工程师对 CPU 密集型功能进行过程化编程，并对硬件提供更大的控制。它被广泛用于游戏引擎的开发。

    * **嵌入式系统：** `C++` 用于创建医疗和工程应用，例如为 `MRI 机器` 、高质量的 `CAD/CAM` 框架等。


    列表还将继续；在不同的领域，编程设计师乐于使用 `C++` 提供卓越的编程。我强烈建议你学习 `C++`，并为社区贡献独特的虚拟产品。


    ## C++ 的特性

    `C++` 有许多不同的特性。例如：


    * 面对象

    * 简单

    * 依赖平台

    * 中级编程语言

    * 结构化编程语言

    * 丰富的库

    * 内存管理

    * 强大且快速

    * 指针

    * 基于编译器

    * 基于语法的语言


    ## 面对象编程语言

    从 `C` 到 `C++` 的根本性提升是面向对象编程。它遵循诸如 `多态`、`继承`、`封装`、`反射` 等思想。这使得更加改进和支持。


    我们应该暂时理解面向对象编程的概念。


    * **类 (Class)：** `class` 是一个对象的对象的蓝图或模型，据此创建对象。它处理同一类所有对象的公共属性或方法的布局。

    * **对象 (Object)：** 它是 `OOP` 的基本单元，处理真实实体。`C++` 程序创建许多与调用技术相关的对象。

    * **多态 (Polymorphism)：** `多态` 指 `OOP` 编程语言高效地区分具有相同名称实体的能力。

    * **继承 (Inheritance)：** `继承` 是允许一个类获取另一个类型属性的部分。

    * **封装 (Encapsulation)：** `封装` 被描述为将信息封装在单一单元下。它是将代码及其控制的信息结合在一起的部分。

    * **抽象 (Abstraction)：** `抽象` 指只显示最基本的信息而隐藏细节。数据抽象向外部世界暴露数据的关键方面，同时掩盖实现细节。


    ## C++ 的元素

    `C++` 提供了一种结构化的方法，你可以在其中将问题分解部分并单独规划布局。它为你提供了丰富的库函数，你可以在执行约定时使用它们。


    如果你工作过 `C` 语言，迁移到 `C++` 将是一个非常平滑的进展。语言结构几乎相当，只有细微变化。


    ### 平台相关

    平台从属语言意味着可以执行该语言，其中项目在特定的工作框架上被创建和排序。它不能在其他操作系统上运行或管理它。


    ### 中级编程语言

    `C++` 可以同时进行低级和高级别编程。这就是 `C++` 被称为中级编程语言的原因。当我们谈论低级编程时，`C++` 用于开发框架应用，如内核部分、驱动程序等。


    ### 结构化编程语言

    在 `C++` 编程中，代码通过函数、类和过程来衡量，模块之间是松耦合的。代码简单且易于调整。这使得 `C++` 成为一种结构化的编程语言。


    ### 丰富的库

    设计师可以使用 `C++` 语言提供的大量内置功能。这节省了时间并加快了进展。我们应该查看 `C++` 提供的一些头文件和功能。


    * `<iostream>`：包含 `C++` 标准输入和输出功能

    * `<iterator>`：包含用于获取 `C++` 标准库容器中信息的类

    * `<iomanip>`：包含排列信息流的流控制器

    * `<algorithm>`：包含控制 `C++` 标准库容器中信息的功能

    * `<cstdlib>`：包含数字到文本及反之的转换、内存分配、变动数字以及其他工具功能

    * `<memory>`：包含 `C++` 标准库用于为 `C++` 标准库分配内存的类和功能

    * `<ctime>`：包含控制时间和日期的功能

    * `<fstream>`：包含执行从文件输入和输出到文件的功能

    * `<cmath>`：包含数学库功能


    ### 内存管理

    `C++` 支持动态内存分配。你随时可以释放内存。不仅如此，`C++` 同样为执行程序分配动态内存。


    ### 强大且快速

    `C++` 是一种快速的语言，因为运行和执行时间短。此外，它拥有广泛的数据类型、功能和运算符。


    ### 指针

    指针是存储另一个变量位置的。指针关注变量的内存区域。`C++` 支持指针并为许多访问内存区域的问题提供答案。


    ### 基于编译器的

    `C++` 是一种基于编译器的语言。没有汇编无法执行 `C++` 程序。编译器首先排序 `C++` 程序，然后完成。


    ### 基于语法的语言

    `C++` 是一种允许严格遵守语法的语言。语言保持规则和准则严格被称为基于语法的语言。`C`、`C++`、`Java`、`.net` 是其中的模型。


    ## 关于 C++ 中面向对象编程的所有知识

    面向对象编程在出现时无疑震惊了编程界，并且仍然是通用编程的基础。在这篇文章中，我们将调查 `C++` 中的 `OOP`。


    ### 什么是面向对象编程？

    * 对象

    * 类

    * 封装

    * 抽象

    * 多态

    * 继承

