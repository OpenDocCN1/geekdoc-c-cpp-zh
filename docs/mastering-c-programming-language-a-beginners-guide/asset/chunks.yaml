    ## 日期和时间


    C++ 标准库缺乏合适的数据类型，因此它继承了 C 语言中处理日期和时间的结构体和方法。要在你的 C++ 中访问与日期相关的函数和结构，必须包含 `ctime`
    头文件。


    四个与时间相关的类型是 `clock_t`、`time_t`、`size_t` 和 `tm`。要用整数表示系统时间和日期，请使用 `clock_t`、`size_t`
    和 `time_t` 类型。


    **示例：**


    | 序号 | 函数 |

    | --- | --- |

    | 1 | `time_t time(time_t *time);`这返回自 1970 年 1 月 1 日以来的系统当前日历秒数。如果系统没有时间，则返回值
    -1。 |

    | 2 | `char *ctime(const time_t *time);`此函数产生格式为“日 月 年 时:分:秒 年\n\0”的字符串。 |

    | 3 | `struct tm *localtime(const time_t *time);`这给你一个指向 `tm` 结构的指针，该结构用于指示本地时间。
    |

    | 4 | `clock_t clock(void);`这给出一个关于调用应用程序运行多久的粗估计。如果时间不可，则返回值 -1。 |

    | 5 | `char *asctime (const struct tm *tm);`此函数以“日 月 年 时:分:秒”的格式格式化时间。 |

    | 6 | `struct tm *gmtime(const time_t *time);`返回指向格林尼治时间的 tm 结构。 |

    | 7 | `time_t mktime(struct tm *time);`将 tm 结构转换为时间 类型。 |

    | 8 | `double difftime(time_t time2, time_t time1);`此函数计算 `time1` 和 `time2` 之间的秒数差。
    |

    | 9 | `size_t strftime(char *s, size_t max, const char *format, const struct tm
    *tm);`此函数允许按照指定的格式格式化日期。 |


