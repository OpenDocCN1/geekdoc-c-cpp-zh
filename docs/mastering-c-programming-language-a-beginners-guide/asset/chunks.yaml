    ## DATE AND TIME


    The C++ standard library lacks a suitable data type, therefore it inherits the
    structs and methods for handling dates and times from C. To access date and time-related
    functions and structures in your C++ application, you must include the `ctime`
    header file.


    The four time-related types are `clock_t`, `time_t`, `size_t`, and `tm`. To express
    the system time and date as an integer, use the `clock_t`, `size_t`, and `time_t`
    types.


    **Example:**


    | Sr. No | Function |

    | --- | --- |

    | 1 | `time_t time(time_t *time);`This returns the system''s current calendar
    time as a number of seconds since January 1, 1970. If the system does not have
    any time, a value of `-1` is returned. |

    | 2 | `char *ctime(const time_t *time);`This function produces a string of the
    form day month year hours:minutes:seconds year\n\0. |

    | 3 | `struct tm *localtime(const time_t *time);`This gives you a pointer to the
    `tm` structure, which is used to indicate local time. |

    | 4 | `clock_t clock(void);`This gives you a rough estimate of how long the calling
    application has been running. If the time is unavailable, a value of `-1` is returned.
    |

    | 5 | `char *asctime (const struct tm * time);`This returns a reference to a string
    containing the data contained in the structure pointed to by `time`, which has
    been transformed to the form: date (day, month) seconds:minutes. |

    | 6 | `struct tm *gmtime(const time_t *time);`This returns a tm structure with
    Coordinated Universal Time (UTC), which is basically Greenwich Mean Time. |

    | 7 | `time_t mktime(struct tm *time);`The calendar-time equivalent of the structure
    referenced to is returned. |

    | 8 | `double difftime(time_t time2, time_t time1);`The difference in seconds
    between `time1` and `time2` is calculated using this function. |

    | 9 | `size_t strftime(char *s, size_t max, const char *format, const struct tm
    *tm);`This function allows you to format the date in a specified way. |


