  trans: "\n在运行时需要内存块时，这是必要的。你可能用过标准库方法，如 `malloc` 和 `free`，在 `C` 和 `C++` 中从堆上为应用程序动态分配内存。然后应用程序将这些内存用于特定用途。其目标通常是向数据结构添加一个节点。在面向对象的语言中，为了给新对象获取内存，会采用动态内存分配。\n\
    \n一个常见的误区是认为堆总是能满足我们的内存需求。然而，堆是有限制的。物理限制对我们大多数人来说可能是显而易见的，但还存在一个微妙的“虚拟”限制。当我们在长时间运行的中使用大量的分配和释放操作时，这种限制会变得更加明显。即使我们可以完全自由地在不再需要时将内存返回堆，这仍然是有代价的。当仍在使用的内存块之间，之前分配的内存被返回时，堆可能会产生“洞”。\n\
    \n我们的内存分配器必须在空闲洞中寻找合适的“洞”（即足够大以满足我们需求的洞）。考虑一种情况：我们可能找不到足够大的洞，但有大量的开放空间。感到困惑吗？\n\
    \n因为我们需要连续的内存块，可能没有任何一个洞是足够大的；相反，可能会存在大量的微小洞。动态内存分配最严重的问题之一就是内存碎片。\n\n采用了多种方法来减少碎片，例如采用合适的内存分配策略或将小洞合并为大洞。这激励了我们创建一个自定义的内存管理器，在其中，我们对分配方案以及处理此类问题的其他方式具有完全的控制权。\n\
    \n但等一下。为什么 `C` 和 `C++` 的默认内存分配器不能救我们呢？让我们深入细节来回答这个问题。\n\n*   `malloc` 和 `new`\
    \ 是通用型内存分配器的示例。尽管我们的代码是单线程的，但它所连接的 `malloc` 函数也可能处理多线程范式。这种额外的功能损害了这些过程的性能。\n\
    *   `malloc` 和 `new` 反过来向操作系统内核提出内存需求，而 `free` 和 `delete` 则提出内存释放请求。这意味着每当由于内存请求产生内存时，操作系统都必须在用户空间和内核代码之间进行切换，因为频繁的上下文切换；重复调用\
    \ `malloc` 或 `new` 的程序最终会变得迟钝。\n*   程序中分配了但未使用的内存经常被意外遗留未删除，且 `C/C++` 不允许自动垃圾收集。结果是程序的内存占用量随之增长。由于可访问内存变得越来越稀缺，且磁盘操作非常耗时，在大型程序中性能会受到严重损害。\n\
    \n## 自定义内存分配\n\n内存泄漏检测和快速内存分配对游戏速度有显著影响。`malloc` 和 `new` 是两种广知的分配动态（堆）内存的 `C++`\
    \ 方法；然而，因为它们是通用函数，所以它们通常是比较迟钝的，且某些实现需要从用户模式到内核模式的上下文切换。这些函数也没有带有内置的内存泄漏检测机制。我们可以使用自定义分配器来定义良好的使用模式并改进分配过程。几十年来，动态内存分配一直是大多数计算机系统中不可或缺的元素。\n\
    \n## 智能指针与内存管理\n\n*   **RAII 和引用计数：** 引用计数是一个熟悉 `Objective-C/Swift/JavaScript`\
    \ 的程序员应该很熟悉的概念。为了防止内存泄漏，会跟踪引用计数。核心概念是统计有多少个动态分配的对象。每当你向它添加一个引用时，被引用对象的引用计数加 1。每当移除一个引用时，引用计数减\
    \ 1。当对象的引用计数减少到零时，指向的堆内存会被擦除。在传统的 `C++` 中，“记住”手动释放资源并不一定是一项良好的做法。\n\n    因此，对于一个对象，我们通常在调用函数时申请空间，并在析构函数（退出作用域后调用）触发时释放空间。那个例子，`RAII`\
    \ 资源获取有时被称为初始化技术。\n\n    万物皆例外；因此我们必须将对象分配给空存储。在传统的 `C++` 中“记住”释放资源，我们必须利用 `new`\
    \ 和 `delete`。智能指针在 `C++11` 中引入，它们利用引用计数的概念消除了程序员手动释放内存的需求。这些智能指针需要 `<memory>`\
    \ 头文件，并包含 `std::shared_ptr`/`std::unique_ptr`/`std::weak_ptr`。\n\n*   **std::shared_ptr：**\
    \ `std::shared_ptr` 是一种智能指针，它跟踪有多少个 `shared_ptr` 指向一个对象，消除了调用 `delete` 的需要（后者会在引用计数为零时删除对象）。\n\
    \n    然而，这是不够的，因为 `std::shared_ptr` 仍然必须配合 `new` 调用，导致代码出现某些不平衡。\n\n    为了避免使用\
    \ `new`，可以使用 `std::make_shared` 代替。`std::make_shared` 将分配给定参数中的对象。返回该对象类型的 `std::shared_ptr`\
    \ 引用。\n\n    **示例：**\n\n    可以使用 `std::shared_ptr` 的 `get()` 函数来获取原始指针，可以使用 `reset()`\
    \ 方法来降低引用计数 `()`。使用 `use_count()` 查看对象的引用计数 `()`。\n\n    **示例：**\n\n*   **std::unique_ptr：**\
    \ 独占智能指针 `std::unique_ptr` 防止其他智能指针共享同一个对象，确保代码安全：\n\n    `make_unique` 在 `C++11`\
    \ 中并不存在。我们，可以使用 `std::move` 将其移动到另一个 `unique_ptr`，例如：\n\n*   **std::weak_ptr：**\
    \ 如果你仔细考虑 `std::shared_ptr`，你会发现仍然存在资源未释放的问题。考虑以下场景：\n\n    由于内部指针也引用 `c, d`，`c,\
    \ d` 的引用计数达到 2，然后作用域退出。只有当 `c, d` 智能指针销毁时，该区域的引用计数才会减少 1。这导致 `c, d` 对象的内存区域引用计数非零，但外部没有方法找到该区域，导致了内存泄漏。\n\
    \n# 第 6 章 预处理与编译\n\nDOI: [10.1201/978103214762-6](https://doi.org/10.1201/978103214762-6)\n\
    \n## 本章内容\n\n*   编译你的源代码\n*   `C++` 中的预处理指令\n*   使用 `enable_if` 条件编译类和函数\n*  \
    \ 使用属性提供元数据\n\n"
- fmt: "\nIn this chapter, we will focus on compiling our code. Also, we will learn\
    \ about several types of processors, how to compile our basic source code in Visual\
    \ Studio, and what preprocessor directives are in this chapter. Furthermore, we\
    \ discover what `enable if` is and when it should be used. What are `enable if`\
    \ Classes and what are the scenarios that they may be used for? How to use `std::enable_if`\
    \ and `enable_if` to compile classes and functions on a conditional basis, as\
    \ well as how to create a member function conditionally. Furthermore, what are\
    \ attributes in C++, and what is the list of them? What is the difference between\
    \ standard and non-standard qualities, and how can we tell the difference? Since\
    \ C++11, the following has changed, as well as the distinctions between C++ and\
    \ C# features.\n\nThe term “compiling source code” refers to the process of converting\
    \ it into a working program. Object code refers to the machine code that is actually\
    \ executed by the computer. A compiler converts source code to object code, but\
    \ the object code isn't yet ready to be turned into a program. A linker is required\
    \ before object code can be turned into a program.\n\nAside from learning about\
    \ pointers and memory management, one of the most difficult aspects of learning\
    \ C++ was figuring out how to effectively build code while utilizing third-party\
    \ libraries. As a game developer, we rely on libraries for many parts of our game,\
    \ such as graphics and physics, and compiling an empty project with these libraries\
    \ included is difficult.\n\n## THREE STEPS PROCESS\n\n![A flow chart shows the\
    \ three steps process of a code.](images/ufig6_1.jpg)\n<details><summary>Long\
    \ Description</summary>\n\nThe flow chart proceeds as follows. First, the source\
    \ code is created. The code goes through pre-processing and converts into pre-processed\
    \ code. The pre-processed code goes through compilation and converts into object\
    \ files. The object files with the help of libraries go through linking and lead\
    \ to a dot E X E or a library.</details> \n\nCompiling a C++ program entails turning\
    \ the source code we've produced (`.cpp`, `.c`, `.h`, `.hpp` files) into an executable\
    \ or library that can execute on a certain platform. This procedure may be broken\
    \ down into three stages:\n\n1. **Preprocessing:** Preprocessor directives in\
    \ C++ are recognized in code by the prefix `#` and describe behavior to be performed\
    \ on source code before it is built. More information on preprocessor directives\
    \ may be found here. These behaviors are carried performed at the initial stage\
    \ of building a C++ program utilizing the preprocessor.\n\nThe preprocessor directive\
    \ determines the specific nature of the pre-actions. Processor's we frequently\
    \ break code into distinct files, for example, to make it easier to organize and\
    \ understand. The `#include` directive is used to link code in one file with code\
    \ in another. The preprocessor takes this `#include` and copies and pastes the\
    \ code from that header file into the file that includes it in our C++ programme.\
    \ This saves us time and reduces the possibility of errors that manual code copying\
    \ between files might create.\n\n`include` directive is one example of a pre-defined\
    \ directive; check this page for other instances. All preprocessor directives\
    \ in our code will have been handled by the compiler's preprocessor by the conclusion\
    \ of the preprocessor step, and the outputted code is now ready to be built.\n\
    \n2. **Compiling:** The next phase in the process is compiling, which is concerned\
    \ with converting the source code that we write into machine code that a computer\
    \ can comprehend.\n\nCompilation in C++ is a two-step procedure. The compiler\
    \ begins by converting the source code into assembly language. Assembly is a low-level\
    \ programming language that is more closely related to a CPU's machine instructions.\
    \ Second, using an assembler, the source code that has now been translated to\
    \ assembly language is turned back into real machine code. The outcome is a series\
    \ of files saved in an object file format, which is an intermediate file format.\n\
    \n**Important Note:** Machine code is made up of binary instructions that are\
    \ referred to as ‘machine language’ since the CPU understands them.\n\nFor each\
    \ source code file, an object file with the extensions `.obj` or `.o` is produced.\
    \ All of the machine-level instructions for that file are contained in the object\
    \ file. It's called an intermediate file since a real executable or library that\
    \ we can utilize isn't produced until the last stage, linking.\n\nWe'll be alerted\
    \ about any problems in our code that prevent it from compiling during the compilation\
    \ step. Any problems will be caused by the compiler's inability to comprehend\
    \ the code we've written. We've effectively screwed up our syntax someplace because\
    \ the code won't be identifiable as C++. Missing a semi-colon, misspelling a C++\
    \ keyword, or adding too many curly brackets to the end of a method are all common\
    \ compilation errors. If an error is discovered, the compilation process is terminated.\
    \ We won't be able to build our C++ code until we've repaired all of the problems.\n\
    \n3. **Linking:** The final stage of the process is linking, which involves putting\
    \ all of the output from the preceding steps together to create the actual executable\
    \ or library.\n\nThe initial step in this stage is to compile all of the object\
    \ files into an executable or library. The next step is to link this executable\
    \ with any external libraries we want to utilize with our program once this has\
    \ been completed successfully.\n\n**Important Note:** A library, such as a math\
    \ library, is just a reusable collection of functions, classes, and objects with\
    \ a common purpose.\n\nFinally, the linker must resolve any dependencies that\
    \ may exist. This is where any link-related problems will occur. Common problems\
    \ include not being able to locate a given library or attempting to connect two\
    \ files that, for example, have the same class name.\n\nThe compiler will provide\
    \ us with an executable file or library if no problems occur during this stage.\n\
    \n4. **Building:** Another point worth highlighting is that the compilation stages\
    \ mentioned are combined into a process called build in an IDE like Visual Studio.\
    \ When building a program, a common approach is to build and then debug.\n\nWhat\
    \ happens is that build generates an executable by compiling and linking the code,\
    \ or a list of problems, depending on how well we coded since our previous build.\
    \ Visual Studio will launch the executable file created when we select Start Debugging.\n\
    \n## COMPILATION OF A BASIC C++ PROGRAM\n\nWe now understand the fundamentals\
    \ of compiling C++ applications. I thought we might wrap up this post by looking\
    \ at a simple example to help us remember what we've learned so far.\n\n* **The\
    \ following are the steps we will take:**\n    * Make a folder for our C++ program\n\
    \    * Go to that folder and open it\n    * Using a text editor, we created our\
    \ C++ application (I used Visual Studio Code)\n    * Create object files from\
    \ our source code\n    * To make an executable file, we need to link our object\
    \ files together\n* **Make a Location to Save Our C++ Program:** In this stage,\
    \ we simply use the Windows command `md` to create a directory with the name `HelloWorld`\
    \ at the provided path. We could have created the folder using the file explorer,\
    \ but this method is much more convenient.\n* **Navigate to a Folder:** All we\
    \ do in this step is use the command `cd` followed by the location we want to\
    \ navigate to, in this instance the folder we created in the previous step.\n\n\
    This is something we do to make our lives simpler. If we don't browse to the folder\
    \ for each file we want to compile, we must provide the complete path name; but,\
    \ if we are already in the folder, we only need to provide the file name.\n\n\
    **Putting together some C++ code**\n"
