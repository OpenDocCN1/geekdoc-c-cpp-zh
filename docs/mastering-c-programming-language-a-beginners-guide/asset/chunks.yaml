    ### 数据抽象（Data Abstraction）


    数据抽象是指简单地向外部世界暴露重要信息，同时隐藏背景细节，即在程序中表示所需的信息，而不显示其复杂性。


    数据抽象是一种编程方法，在其中接口和实现是分离的。


    以电视机为例，你可以打开和关闭它、切换频道、调整音量，并添加如扬声器、DVD 播放器等外部组件，但你不知道它是如何通过空气或电缆接收信号的，它是如何翻译这些信号并最终将其显示在屏幕上的。


    因此，我们可以认为，电视机清楚地将其内部实现与其外部接口隔离开，允许你与电源按钮、频道调节器和音量控制等接口交互，而无需了解其内部的任何信息。


    C++ 中的类实现了高水平的数据抽象。它们向外部世界暴露了足够的公共方法，允许用户尝试对象的功能并更改对象数据（即状态），而无需知道类内部是如何构建的。


    例如，你的应用程序可以调用 `sort()` 方法，而无需知道该函数使用什么算法对输入数据进行排序。事实上，排序功能的实际实现可能会在库发布之间发生变化，但只要接口保持不变，你的函数调用仍然有效。


    **示例：**


    在这种情况下，你不需要知道 `cout` 如何在用户的屏幕上显示文本。你只需要理解公共接口即可；`cout` 的底层实现可以随时更改。


    #### 数据抽象的优势


    数据抽象有两个主要优势。


    1. 可能会损坏对象状态的无意用户级错误被屏蔽在类内部。

    2. 在不需要更改用户级代码的情况下，类的实现可以随时间响应新需求或问题报告而发展。


    类作者能够通过仅在类的私有部分定义数据成员来更改数据。如果实现发生变化，只需要查看类代码以确定更改可能产生的影响。如果数据是公共的，任何直接访问之前的表示中的数据成员的函数都可能会损坏。


    数据抽象可以在任何实现了具有公共和私有成员类的 C++ 程序中。


    **示例：**


    **输出：**


    ### 封装（Encapsulation）


    以下两个基本组件存在于所有 C++ 程序中：


    函数是程序中执行动作的部分，被称为程序语句。


    程序数据是受程序函数影响的信息。


    封装面向对象编程中的一个概念，它将数据和更改数据的函数结合在一起，使两者免受外部干预和误用。数据隐藏这一核心 OOP 思想诞生于数据封装。


    数据抽象是一种仅暴露接口并隐藏用户实现细节的技术，而数据封装是一种封装数据及其使用它的函数的策略。


    封装和数据隐藏通过使用类（即用户定义类型）在 C++ 中实现。我们之前见过类可以拥有秘密、保护或公共成员。类中声明的所有项默认都是私有的。


    **示例：**


    `length`、`width` 和 `height` 变量都是私有的。这意味着它们只能由 `Box` 类成员访问，而不能由应用程序的任何部分访问。这是封装的一种方法。


    你必须在 `public` 关键字之后定义类的部分，使其变为公共（即对程序的其他部分可用）。应用程序中的所有其他函数都可以访问在公共指定符之后声明的变量或函数。


    通过让一个类成为另一个类的伙伴，实现细节就会暴露，封装也会丢失。理想的情况是尽可能地与其他类隐藏每个类的类的信息。


    **示例：**


    **输出：**


    返回上述类的数字总和。公共成员 `addNum` 和 `getTotal` 是该类的外部接口，用户必须熟悉它们才能利用它。私有成员 `total` 对外部世界隐藏，但它是类正常运行所必需的。


