    One final item to note is that we now remove the coroutine_hande inside the Generator
    destructor because we know that the coroutine handle is no longer required once
    the generator is gone.


    ### Greedy Generator


    The software that follows is as simple as possible. The function getNumbers returns
    all integers from start to finish, which inc has incremented. The beginning must
    be smaller than the ending, and the increment must be positive.


