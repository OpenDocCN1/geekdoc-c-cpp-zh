  trans: "\n在本章中，我们将重点关注代码的编译。此外，我们将学习几种类型的处理器、如何在 Visual Studio 中编译我们的基础源代码，以及本章中提到的预处理器指令。此外，我们还将发现\
    \ `enable if` 是什么以及何时应该使用它。什么是 `enable_if` 类？它们可能用在哪些场景？如何使用 `std::enable_if`\
    \ 和 `enable_if` 根据条件编译类和函数，以及如何有条件地创建成员函数。此外，C++ 中的属性（attributes）是什么？它们的列表有哪些？标准属性和非标准属性之间有什么区别？我们如何辨别它们的区别？自\
    \ C++11 以来，以下内容发生了变化，C++ 与 C# 特性之间的区别也有所不同。\n\n“编译源代码”一术指的是将其转换为可运行程序的过程。对象代码指的是由计算机实际执行的机器码。编译器将源代码转换为对象代码，但对象代码尚未准备好转换为程序。在对象代码转换为程序之前，需要一个链接器（Linker）。\n\
    \n除了学习指针和内存管理之外，学习 C++ 最困难的方面之一是研究如何在利用第三方库的同时有效地构建代码。作为一名游戏开发者，我们游戏的许多部分依赖于库，例如图形和物理，而编译一个包含了这些库的空项目是非常困难的。\n\
    \n## 三步流程\n\n![流程图显示了代码的三个步骤流程。](img/ufig6_1.jpg)\n<details><summary>详细描述</summary>\n\
    \n流程图如下：首先，创建源代码。代码经过预处理并转换为预处理后的代码。预处理后的代码经过编译转换为对象文件。在库的帮助下，对象文件经过链接并生成 .dot\
    \ E X E 文件或库。</details> \n\n编译 C++ 程序意味着将我们生成的源代码（`.cpp`、`.c`、`.h`、`.hpp` 文件）转换为可以在特定平台上执行的可执行文件或库。此过程可以细分为三个阶段：\n\
    \n1. **预处理（Preprocessing）：** C++ 中的预处理器指令在代码中通过前缀 `#` 被识别，并描述了在构建之前对源代码要执行的行为。关于预处理器指令的更多信息可以查阅此处。这些行为是在利用预处理器构建\
    \ C++ 程序的初始阶段执行的。\n\n预处理器指令决定了预操作的具体性质。我们经常将代码拆分为不同的文件，例如，以便更容易组织和理解。`#include`\
    \ 指令用于将一个文件中的代码与另一个文件中的代码链接。预处理器获取此 `#include`，并将该头文件中的代码复制并粘贴到包含它的 C++ 程序文件中。这节省了我们的时间，并减少了在文件之间手动复制代码时可能产生的错误概率。\n\
    \n`include` 指令是预定义指令的一个示例；请查看此页面获取其他实例。我们代码中的所有预处理器指令在预处理步骤结束时将由编译器的预处理器处理完毕，输出的代码现在已准备好构建。\n\
    \n2. **编译（Compiling）：** 过程的下一阶段是编译，它涉及将我们写的源代码转换为计算机可以理解的机器码。\n\nC++ 中的编译是一个两步过程。编译器首先将源代码转换为汇编语言。汇编是一种低级编程语言，与\
    \ CPU 的机器指令更为密切。其次，使用汇编器（Assembl）将已翻译为汇编语言的代码转换回真实的机器码。结果是一系列保存为对象文件格式的文件，这是一种中间文件格式。\n\
    \n**重要提示：** 机器码由二进制指令组成，被称为“机器语言”，因为 CPU 理解它们。\n\n对于每个源代码文件，都会生成扩展名为 `.obj` 或\
    \ `.o` 的对象文件。该文件所有的机器级指令都包含在对象文件中。它被称为中间文件，因为在最后的链接阶段之前，还没有产生我们可以利用的真实可执行文件或库。\n\
    \n在编译步骤，如果代码中出现任何阻止其编译的问题，我们将会收到警报。任何问题都是由于编译器无法理解我们编写的代码而导致的。我们实际上在某处把语法搞砸了（screwed\
    \ up），因为该代码无法被识别为 C++。缺少分号、拼写错误的 C++ 关键字或在方法末尾添加过多的大括号都是常见的编译错误。如果发现错误，编译过程将终止。在修复所有问题之前，我们将无法构建我们的\
    \ C++ 代码。\n\n3. **链接（Linking）：** 过程的最后阶段是链接，它涉及将之前步骤的所有输出结合在一起，创建实际的可执行文件或库。\n\
    \n此阶段的第一步是将所有对象文件编译为可执行文件或库。一旦成功完成，下一步是将该可执行文件与我们程序可能想要使用的任何外部库进行链接。\n\n**重要提示：**\
    \ 库（例如数学库）只是具有共同目的的函数、类和对象的复用集合。\n\n最后，链接器必须解决任何可能存在的依赖。这就是发生任何链接相关问题的地方。常见问题包括无法找到指定的库，或尝试连接两个具有（例如）相同类名的文件。\n\
    \n如果在此阶段没有问题，编译器将为我们提供一个可执行文件或库。\n\n4. **构建（Building）：** 另一个值得强调点是，提到的编译阶段在 Visual\
    \ Studio 等 IDE 中被组合名为“构建”的过程。在构建程序时，常用的方法是先构建后调试。\n\n发生的情况是构建通过编译和链接代码生成可执行文件，或者根据我们自上次构建的情况生成一个问题列表。当我们选择启动调试时，Visual\
    \ Studio 将启动创建的可执行文件。\n"
- fmt: "\nThe `main.cpp`, `HiWorld.h`, and `HelloWorld.cpp` files in the preceding\
