    协程中需要 `co_return` 或 `co_await` 语句。它可以包含多个这样的语句，但必须至少包含其中一个才能被视为协程。`co_return`
    语句不会像预期的那样导致任何挂起或异步。结果，`CopyAsync` 方法返回了一个同步或即时完成的 `IAsyncAction`。例如，考虑以下内容：


    该断言绝对是正确的。这里没有竞争。因为 `CopyAsync` 仅仅是一个函数，调用者会被停止直到它返回，而 `co_return` 语句是它返回的第一个机会。这意味着，如果我们有一个需要实现的异步合约，但不需要引入任何异步性，我们只需要返回数据而不会产生阻塞或导致上下文切换。


    考虑以下方法，它下载一个值然后返回缓存的它：


    当第一次使用 `ReadAsync` 时，缓存可能是空的，并且会下载结果。在此进行期间，协程极可能会被挂起。挂起意味着控制权返回给了调用者。调用者将获得一个尚未完成的异步对象，这使得需要以某种方式等待完成。


    协程的优势在于，它们为生成和消费异步对象提供了一个单一的抽象。异步函数可以由 API 或组件作者实现，但 API 消费者或应用开发者可以使用协程来调用它并等待其完成。


    让我们修改上述代码中的 `main` 函数，让协程来处理等待：


    之前的 `main` 函数体已已移动到 `MainAsync` 协程中。`main` 函数中使用了 `get` 方法，以防止程序在协程异步完成之前退出。`MainAsync`
    函数中已添加了 `co await` 语句。与其阻塞调用者线程直到 `ReadAsync` 完成，不如使用 `co await` 语句以协作或非阻塞的方式等待
    `ReadAsync` 函数完成。这就是我们谈论“挂起点”时的意思。`co` 代表挂起点 `await` 语句。


    这带我们来到了本章的结尾。到目前为止，在本书中我们涵盖了许多主题，例如 C++ 语法、数据类型、函数等！希望这对你来说是一段收获丰颇的经历。


    # 评估


    DOI: [10.1201/97810032147628](https://doi.org/10.1201/97810032147628)


    如果你看重速度和效率，C++ 是一门非常值得学习的编程语言。由于指针等特性，它是 Unix 系统的主流语言，允许开发者构建自己可以管理的代码。以下是你应该学习这种编程语言的一些原因：C++
    是一种灵活的语言，它可以与几乎任何其他语言通信，并可以在几乎任何机器上执行和构建程序。它提供了卓越的性能和速度。C++ 是一门结合了高层和低层能力的语言，`MongoDB`
    数据库就是用这种语言开发的。开发者非常喜欢这种语言，因为它提供了对代码的完全控制。多重继承、模板、运算符重载、预处理器指令以及开发者可能需要的其他功能在 C++
    中都有。


    雇主希望 C++ 开发者具备以下素质：


    *   应该具备基础的 C++ 编程经验。

    *   应该熟悉 Unix 和 Linux 等操作系统。

    *   数据库、`SQL` 和 NoSQL 数据库（如 `MongoDB`）都是重要的概念。

    *   需要 `JavaScript` 和 `XML` 知识。

    *   应该熟悉敏捷软件开发技术。

