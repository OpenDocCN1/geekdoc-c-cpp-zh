    \ can return a coroutine handle in addition to `void` and `bool`, in which case\
    \ the returned handle is instantly restarted. `GetPromise::await_suspend` might\
    \ have returned the handle `h` instead of `false` to continue the coroutine immediately,\
    \ but this would likely be less efficient.\n\n**Example:**\n"
  raw: "The procedure in step 3 does not restore control to the coroutine when it\
    \ returns. The coroutine continues to run if and when the callable from step 2\
    \ is invoked. The callable in step 2 is similar to a continuation if we've used\
    \ a language that supports the call with the current continuation or if we've\
    \ toyed with the Haskell Cont monad.\n\nIf a function's definition accomplishes\
    \ any of the following, it's a coroutine:\n\n*   The co_await operator is used\
    \ to pause execution until it is restarted.\n\n    **Syntax:**\n\n*   co_yield\
    \ is a keyword that suspends execution and returns a value.\n\n    **Syntax:**\n\
    \n*   co_return is a keyword that completes execution and returns a value.\n\n\
    \    **Syntax:**\n\n### Restrictions\n\nVariadic arguments, simple return statements,\
    \ and placeholder return types are not allowed in coroutines (auto or concept).\n\
    \nCoroutines aren't allowed in constexpr functions, constructors, destructors,\
    \ or the primary function.\n\n### Execution\n\n*   **Each coroutine is linked\
    \ to the following:**\n\n    *   Manipulation of the promise objects from within\
    \ the coroutine. The coroutine uses this object to submit its result or exception.\n\
