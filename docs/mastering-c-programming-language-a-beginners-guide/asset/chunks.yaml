  trans: "\n\n# 函数模板的重载\n\n### 什么是函数模板的合法重载？\n\n非模板函数重载（同名但参数类型不同）的规则可以应用于函数模板，当满足以下条件时，该重载是有效的：\n\
    \n* 返回类型不同。\n* 除了参数命名和默认参数的存在外，模板参数列表不同。\n\n对于编译器来说，比较普通函数的两个参数类型是简单的，因为它知道所有信息。另一方面，模板内部的类型可能尚未确定。因此，关于两个参数类型在何时相等的估算规则是：非依赖类型和值必须匹配，而依赖类型和表达式必须具有相同的拼写（模板参数除外，它们可以重命名）。然而，如果类型中的两个值在这些不同的拼写下被视为不同，但总是实例化为相同的值，则该重载是不正确的，但不需要编译器诊断。\n\
