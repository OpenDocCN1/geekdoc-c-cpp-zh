    ### 性能


    在创建格式化库时已经考虑了性能。它的目标是尽可能地减少每次格式化操作的虚函数调用次数和动态内存分配。如果格式化输出可以适应在栈上创建的固定大小缓冲区，那么通过使用适当的
    API 完全消除它们应该是可行的。


    出于此目的，使用了 `fmt::basic buffer` 模板来表示缓冲区抽象。缓冲区是一段连续的内存，可以直接访问，并在必要时增加大小。在格式化期间，只需调用一个虚函数
    `grow()`，且仅当缓冲区大小不够大时才调用。


    实现区域无关的格式化比实现区域感知的格式化更高效。然而，后者的主要目标不是提高性能，而是服务某些用例。


    ### 二进制占用


    每个使用变变模板的格式化函数都是其非变变等价物的小内联封装，以减小二进制体积。该封装使用 `fmt::make_args` 构建一个表示参数数组的对象，然后调用非变变函数执行实际工作。格式变函数函数使用变量
    `vformat`。


    如果参数数量很少，多个参数类型代码可以合并并作为一个整数传递给格式化函数。因为参数类型在构建时是已知的，这种情况下不需要编写代码。


    这将产生紧凑的调用二进制代码，在栈上设置参数指针和打包类型代码并执行格式化函数，假设有一个良好的优化编译器。


    ### 空终止字符串视图


    格式化库没有使用基本字符串视图，而是使用了基本 `cstring`，即空终止字符串视图。代码更小且运行速度更快，因为不需要计算和提供未使用的字符串大小。使用终止符对其进行解析也更容易。


