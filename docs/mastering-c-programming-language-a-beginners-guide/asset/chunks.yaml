    After we do not need a variable in C++, we must manually deallocate the dynamically
    created memory. Using the `new` and `delete` operators, we may dynamically allocate
    and subsequently deallocate memory.


    ### What Is the Purpose of Memory Management?


    Because arrays contain homogenous data, memory is allocated to the array when
    it is declared most of the time. When the precise memory is not specified until
    runtime, a problem might emerge. We declare an array with a limit size to avoid
    this issue, but some memory will be unused. To prevent memory waste, we utilize
    the `new` operator to allocate memory during runtime dynamically.


    ### Operators for Memory Management


    In C, the `malloc()` and `calloc()` functions are used to allocate memory at runtime,
    whereas the `free()` function is used to deallocate dynamically generated memory.
    These functions are also available in C++, although unary operators such as `new`
    and `delete` are defined to do the same job, namely allocating and freeing memory.


    ## THE NEW OPERATOR''S BENEFITS


    The `new` operator has the following advantages over the `malloc()` function:


    - It does not need the `sizeof()` operator since the `size` of the data object
    is calculated automatically.

    - It does not necessary employ typecasting because it delivers the right data
    type pointer.

    - The `new` and `delete` operators, like other operators, can be overloaded.

    - It also lets you initialize the data object while it''s being built in memory.


    ## NEW OPERATOR IN C++


    The `new` operator gives a variable memory. As an example,


    Using the `new` operator, we have dynamically allocated memory for an `int` variable.


    We allocated memory dynamically using the reference `pntVar`. Because the `new`
    operator returns the memory location''s address, this is the case. When dealing
    with an array, the `new` operator returns the address of the array''s first element.


    The syntax for employing the `new` operator may be seen in the example above:


    ## DELETE OPERATOR


    We can deallocate the memory held by a variable that we have declared dynamically
    after requiring it. The `delete` operator is used for this. Memory deallocation
    refers to the process of returning memory to the operating system.


    This operator''s syntax is as follows:


    **Example:**


    Using the pointer `pointVari`, we have dynamically allocated memory for an `int`
    variable.


    ### Is It Permissible for a Member Function to Tell You to Remove Something?


    - You must be sure that this object was allocated using `new` (not `new[]`, placement
    new, a local object on the stack, a namespace-scope/global, or a member of another
    object; but just `new`).

    - You must be confident that your member function will be the very last member
    function called on this object.

    - You must be sure that the remainder of your member function (after the `delete`
    line) does not come into contact with any part of this object. This includes code
    that will execute in destructors for any still-alive objects allocated on the
    stack.

    - You must be very specific that no one touches this pointer after you delete
    this line. To put it another way, you can''t look at it, compare it to another
    pointer, compare it to `nullptr`, print it, cast it, or do anything with it.


    ### Allocating Memory in a Dynamic Way


    A simple memory architecture utilized by each C++ software is shown below:


    - **Code segment:** This is where the compiled program containing executive instructions
    is saved. It is a read-only document. The code portion is put behind the stack
    and heap to avoid overwriting them.

    - **Data segment:** This is where global variables and static variables are maintained.
    It isn''t just for reading.

    - **Stack:** A stack is a type of memory that has been pre-allocated. A LIFO data
    structure is a stack. The stack is pushed up with each new variable. Memory is
    released when a variable is no longer in scope. When a stack variable is removed,
    the memory space it used becomes accessible for other variables. As functions
    push and pop local variables, the stack expands and contracts. It keeps track
    of local data, return addresses, arguments provided to functions, and memory status.

    - **Heap:** Memory is allocated while the application is running. Memory is allocated
    using the `new` operator, whereas memory is dealt with using the `delete` operator.


