    \ is a non-owning handle for resuming coroutine execution or destroying the coroutine\
    \ frame.\n\n*   The coroutine state is a heap-allocated (unless the allocation\
    \ is optimized out) internal object that includes.\n\n    *   The object of the\
    \ promise.\n\n    *   The variables (all copied by value).\n\n    *   A representation\
    \ of the current suspension point, so resume knows where to go next and destroy\
