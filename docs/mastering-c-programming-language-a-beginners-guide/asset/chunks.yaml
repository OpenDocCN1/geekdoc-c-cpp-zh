    \n### 表达式中的二进制运算符\n\n在表达式中，二进制运算符作用于两个操作数。\n\n二进制运算符如下：\n\n*   乘法运算符\n    *  \
    \ 乘法 `*`\n    *   除法 `/`\n    *   取模 `%`\n*   加法运算符\n    *   加法 `+`\n    *   减法\
