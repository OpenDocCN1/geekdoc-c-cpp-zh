  trans: "\n\n这可能会导致多个格式良好的选项；我们通过使用“标签”（tags）来区分它们，这些标签类似于迭代器特性标签（如随机访问标签等）。这是因为直接匹配优于基类，而基类又优于基类中的基类，依此类推。\n\
    \n### 示例\n\n#### `enable_if` 类\n\n用于 SFINAE 重载解析，根据条件有条件地创建类型的实例。当且仅当 `Condition`\
    \ 为真时，嵌套的类型定义 `enable_if<Condition,Type>::type` 才存在——并且它是 `Type` 的别名。\n\n####\
    \ 语法\n\n#### 参数：\n\n* `B`: 决定结果类型是否存在的值\n* `D`: 如果 `B` 为真，则 `D` 是要实例化的类型\n\n####\
    \ 备注\n\n* 如果 `B` 为真，`enable_if<B, D>` 包含一个名为 `type` 的嵌套类型定义，该类型定义是 `D` 的别名\n*\
    \ 如果 `B` 为假，`enable_if<B, D>` 不包含名为 `type` 的嵌套类型定义\n\n#### 语法\n\n在 C++ 中，模板参数替换失败本身并不是一个错误，被称为\
    \ SFINAE（替换失败不是错误）。通常，`enable_if` 用于过滤重载集合——即从重载解析中消除候选方案——以便舍弃其中一个定义而选择另一个。\n\
    \n* **这里有四种需要考虑的场景：**\n    * **场景 1**：包装函数的返回类型：\n    * **场景 2**：为函数参数添加默认参数：\n\
    \    * **场景 3**：为模板参数添加默认参数：\n    * **场景 4**：我们可能在函数中封装一个非模板参数的类型：\n\n由于构造函数和转换运算符没有返回类型，因此场景\
    \ 1 是不起作用的。\n\n场景 2 没有提到该参数。我们可能会说：`:type Dummy = BAR`，但 `Dummy` 这个名字是没有意义的，而且给它指定一个名字几乎会会导致“未引用的参数”错误。我们必须选择一个\
    \ `FOO` 函数参数类型以及 `BAR` 默认参数。我们可能会说 `int` 和 `0`，但我们代码的用户可能会无意中给方法传递额外的整数，而该整数会被忽略。由于实际上几乎没有东西可以转换为\
    \ `void`，我们提倡使用 `void` 以及 `0` 或 `nullptr` 代：\n\n场景 2 同样适用于普通的构造函数。然而，它对转换运算符不起作用，因为它们无法接受额外的参数。它对变长构造函数也不作用，因为添加更多参数会导致函数参数包变得不可推导，从而违背了\
    \ `enable_if` 的目标。\n\n场景 3 中使用了 `Dummy` 名字，但并不是必须的。如果我们认为 “typename = typename”\
    \ 看起来很奇怪，我们可以使用一个“哑符”（dummy）名称——只要不要使用可能在函数描述中使用的名称即可。如果我们不为 `enable_if` 指定类型，它将默认为\
    \ `void`，这是可以的，因为我们不在乎 `Dummy` 是什么。\n\n场景 4 通过处理没有返回类型的构造函数，解决了场景 1 的包装限制。然而，场景\
    \ 4 局限于非模板函数参数，而这些参数通常是无法访问的。（当场景 4 应用于模板函数参数时，模板参数推导会被禁用。））\n\n`enable_if` 是一个强大的工具，但如果使用不当，它也可能是危险的。因为它的意图是在重载解析之前让候选方案消失，当使用不当时，结果可能会相当令人疑惑。这里有几个建议：\n\
    \n* 在编译时选择不同的实现时，不要使用 `enable_if`。永远不要写两个 `enable_ifs`，一个用于 `CONDITION`，另一个用于\
    \ `!CONDITION`。相反使用标签分发（tag dispatch）模式，例如根据所给迭代器的强度来选择实现方法的算法。\n* 要强制执行要求，不要使用\
    \ `enable_if`。使用 `static assert` 来检查模板参数，如果验证失败，提供一个错误而不是选择另一个实现。\n* 当我们的重载集合使得原本可以接受的代码变得晦涩时，使用\
    \ `enable_if`。这在隐式转换构造函数中最常见。\n\n### 要有条件地构建成员函数，请使用 `std::enable_if`\n\nSFINAE\
    \ 只有在在参数推导中替换模板参数会导致格式不正确的结构时才起作用。不存在所谓的“替换失败”。\n\n我曾有同样的想法，并尝试使用 `std::is_same<T,\
    \ int>::value` 和 `!`，它返回的值与 `std::is_same<T, int>::value` 相同。\n\n那是因为当类模板被实例化时（这发生在其他当我们创建一个类型为\
    \ `Y<int>` 的对象时），它会实例化其所有的成员声明（不一定是它们的定义/体！）。它的成员模板也被包含在。此时 `T` 是已知的，`!std::is_same<T,\
    \ int>::value` 返回假。结果是名为 `Y<int>` 的类将被创建。\n\n#### 示例\n\n由于 `std::enable_if<false>::type`\
    \ 指向一个不存在的类型，声明是无效的。结果是我们的软件无法使用。\n\n我们必须让成员模板的 `enable_if` 依赖于成员模板本身的参数。由于整个类型仍然是依赖的，声明是合法的。模板参数的参数推导发生在我们尝试调用其中一个时，SFINAE\
    \ 会如预期那样发生。\n\n### 使用 ENABLE_IF 根据条件编译类和函数\n\nC++ 的模板元编程能力允许我们创建处理任何类型的泛型类和函数。这在某些情况下可能是一个问题，因为语言缺乏限制模板类型的方法。然而，我们仍然可以通过利用元编程技术并利用“替换失败不是错误”的概念来实现这一点。本教程将展示如何在模板中使用类型限制。\n\
    \n#### 准备\n\n多年来，开发者一直结合 SFINAE 使用 `enable_if` 类模板来施加限制。\n\n`enable_if` 模板族现在是\
    \ C++ 标准的一部分，它的工作方式如下：\n\n#### 语法\n\n为了使用 `std::enable_if`，我们包含 `<traits>` 头文件。\n\
    \n#### 工作原理\n\n考虑以下 `enable_if` 在不同语境下使用以实现不同目标的示例：\n\n* 根据类模板参数匹配给定条件以激活类模板：\n\
