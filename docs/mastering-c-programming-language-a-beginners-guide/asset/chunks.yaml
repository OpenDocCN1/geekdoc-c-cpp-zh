  trans: "\n\n如果遇到类似 `func (42)` 的调用，编译器必须寻找一个可以接受 `int` 参数的重载。由于 `int` 没有数据类型成员，当编译器创建重载集并将模板参数替换为提供的模板实参时，输出的\
    \ `void func (int::data_type const)` 是错误的。编译器不会因为 SFINAE 而报告错误并停止；相反，它只会忽略该重载并继续。接着它寻找\
    \ `void func (int const)`，这是它能找到的最匹配。\n\n如果编译器发现类似 `func<some type<<int>>(42)`\
    \ 的调用，它会创建一个重载集，其中包含 `void func(some type<int>::data_type const)` 和 `void func\
    \ (int const)`，在在这种情况下，第一个重载是最佳匹配；此时没有使用 SFINAE。\n\n如果编译器发现类似 `func (\"string\"\
    s)` 的调用，它将再次依赖 SFINAE 来忽略该函数模板，因为 `std::basic_string` 没有值类型成员。然而，这次重载集中不包含任何与字符串参数匹配的项；结果是，程序是非法的（ill-formed），编译器会发出错误并退出。\n\
    \n类模板 `enable_if<bool, D>` 中没有成员，但其部分特化 `enable_if<true, D>` 包含一个名为 `type` 的内部类型，它是\
    \ `D` 的别名。当作为 `enable_if` 第一个参数的编译语句求值为真时，该内部类型可用，否则不可用。\n\n当编译器发现类似 `mul (2,\
    \ 3)` 的调用时，它尝试用 `int` 替换模板参数 `T`；由于 `int` 是整数类型，`std::is_integral` 求值为真，并会创建一个定义了名为\
    \ `type` 的内部类型的 `enable_if` 特化。结果是`EnableIf` 别名变为该类型的别名，即 `void`（由于 `typename\
    \ D = void` 表达式）。结果是一个 `int mul<int, void> (int x, int y)` 函数模板，可以使用提供的参数对其进行调用。\n\
    \n另一方面，当编译器发现类似 `mul (1.2, 2.4)` 的调用时，它尝试用 `double` 替换模板参数 `D`。由于这不是整数类型，`std::enable_if`\
    \ 条件求值为假，且类模板没有指定内部成员类型。这导致了替换错误，但根据 SFINAE，编译器不会产生错误并将继续执行。然而，由于没有发现备选重载，将无法调用\
    \ `mul()` 方法。结果是，程序被认为是非法的，编译器生成一个错误。\n\n在使用类模板 `pod_wrapper` 时也会出现类似的问题。它包含两个模板类型参数：第一个是被封装的\
    \ POD 类型，第二个是 `enable_if` 的结果，且它们都是 POD 替换。如果该类型是 POD 类型（如在 `pod_wrapper` 中），则来自\
    \ `enable_if` 的内部成员类型就存在，并替换掉第二个模板类型参数。如果内部成员类型不是 POD 类型（如在 `pod_wrapper<std::string>`\
    \ 中），则替换将失败，并带有类似“模板参数太少”的消息。\n\n# C++ 中的属性\n\n属性是现代 C++ 的一项基础元素，它允许程序员向编译器提供额外信息，以便编译器施加约束（条件）、优化代码某些部分或生成特定代码。简单来说，属性是给编译器的注释或标记，为了优化代码并对代码施加特定约束，提供了关于代码的更多信息。它们首次引入\
    \ C++11，并随着后续每个版本的更新而演变。\n\n## C++ 属性的用途\n\n- **强制执行代码约束：** 约束是函数参数为了执行而必须满足的要求（先决条件）。在之前的\
    \ C++ 版本中，指定限制的代码是这样写的。\n\n  **示例：**\n  它提高了我们代码的可读性，并消除了在方法内部放置参数检查代码所造成的混乱。\n\
    \n- **为优化目的向编译器提供额外信息：** 编译器非常擅长优化，但在某些领域仍然落后于人类，并会建议低效的通用代码。这是由于人类对他们所面临的“问题”的信息不足。为了解决这个问题，C++\
    \ 标准包含了一些额外的特性，允许我们告诉编译器比单纯代码语句多一点信息。“probable”（可能的）一词就是其中一个例子。\n\n  **示例：**\n\
    \  当语句前面跟有 `likely` 时，编译器会对该语句进行特定优化，从而提高代码的整体性能。\n\n- **抑制作者有意保留的代码中的特定警告和故障：**\
    \ 在极少数情况下，程序员可能会刻意产生错误代码，这些代码会被编译器发现并报告为错误或警告。出于特定原因保留在该状态的未使用变量，或者在某些实例后没有插入\
    \ break 语句的 switch 语句以导致穿透（fall-through）情况，都是例子。C++ 拥有如 `[[maybe_unused]]` 和 `[[fallthrough]]`\
    \ 等属性，可以防止编译器在这种情况下发出警告或错误，从而避免问题和警告。\n\n  **示例：**\n\n## 以下是标准 C++ 属性列表：\n\n1.\
    \ **noreturn:** 使用 `noreturn` 时，函数不返回值。\n\n  **语法：**\n  查看上面的代码，可以发现当返回类型实际上为\
    \ `void` 时使用 `noreturn` 的问题。如果函数是 `void` 类型，它会返回调用者，但如果函数永远返回调用者（例如无限循环），添加 `noreturn`\
    \ 属性可以为编译器提供优化提示。\n\n  **示例：**\n\n2. **deprecated:** 表示带有此属性的名称或实体不再有效，应该被避免。命名空间、函数、类、结构都可以具有此属性。\n\
    \n  **语法：**\n  **示例：**\n\n3. **nodiscard:** 调用者不应忽略带有 `nodiscard` 定义的实体返回值。简单来说，如果一个函数返回值并被标记为\
    \ `nodiscard`，调用者必须使用该返回值而不是将其丢弃。\n\n****语法：**\n  函数中的 `nodiscard` 与类声明中的 `nodiscard`\
    \ 的主要区别在于，对于函数，`nodiscard` 仅适用于声明的函数；而对于结构体/类声明，`nodiscard` 适用于所有按值返回该对象的函数。\n\
    \n  **示例：**\n\n4. **maybe_unused:** 抑制对未使用实体的警告（例如：未使用的变量或函数的未使用参数）。\n\n  **语法：**\n\
    \  **示例：**\n\n5. **fallthrough:** `[[fallthrough]]` 表示 switch 语句的穿透是有意为之。程序员错误通常是\
    \ switch 语句中缺少 break 或 return，尽管穿透在某些情况下可以产生非常简洁的代码，因此被采用。\n\n  **示例：**\n\n6.\
    \ **likely:** 用于优化比其他情况更有可能执行的断言。出于测试原因，Likely 已包含当前版本的 GCC 编译器中。\n\n  **示例：**\n\
    \n7. **no_unique_address:** 表示此数据成员不需要与其类的其他非静态数据成员具有唯一的地址。这表明如果一个类拥有空类型，编译器可以通过空基类优化对其进行优化。\n\
    \n  **示例：**\n\n8. **expects:** 它定义了为了运行函数而参数必须满足的条件（合约的形式）。\n\n  **语法：**\n\n"
- fmt: "\n# There is a distinction between standard and non-standard characteristics\n\
    \n| Standard Attributes | Non Standard Attributes |\n| --- | --- |\n| The standard\
    \ specifies them, and they are present in all compilers. | Vendors of compilers\
    \ provide this information and they aren't found in all compilers. |\n| Without\
    \ any warnings or problems, the code is entirely portable. | Despite the fact\
    \ that code for non-standard attributes in “standard syntax” has become portable\
    \ (since C++17), compilers still generate warnings and errors. |\n| Attributes\
    \ are written using the `[[atr]]` standard syntax. | Some attributes are expressed\
    \ in a compiler-specific term like `declspec()` or `__attribute__`, while others\
    \ are written in non-standard syntax. |\n| There are no standard characteristics\
    \ in any namespace that surrounds it. | Standard syntax is used to write nonstandard\
    \ characteristics.With the namespace `[[namespace::attr]]` that surrounds them.\
    \ |\n\n## SINCE C++11, THE FOLLOWING HAS CHANGED\n\n- **Ignoring unknown attributes:**\
    \ Since C++17, one of the most significant modifications to the attribute feature\
    \ in C++ has been the compiler's explanation of unknown attributes. If the compiler\
    \ didn't recognize an attribute in C++11 or 14, it would throw an error and prevent\
    \ the code from being built. To make it function as a workaround, the programmer\
    \ had to delete the attribute from the code. This posed a significant problem\
    \ in terms of mobility. None of the vendor-specific characteristics could be utilized\
    \ apart from the standard attributes since the code would fail. This made it impossible\
    \ to use this functionality.\n\n  As a result, the standard made it mandatory\
    \ for all compilers to disregard characteristics that they did not specify. These\
    \ allowed programmers to freely use vendor-specific characteristics in their code\
    \ while yet ensuring that it was portable. When undefined attributes are found,\
    \ most C++17 compilers now disregard them and provide a warning. This helps programmers\
    \ to be more versatile with their code since they may now provide numerous characteristics\
    \ for the same action in various vendor namespaces.\n\n  **Example:** //on their\
    \ respective the attributes will work\n  ```\n  [[msvc::deprecated]][[gnu::deprecated]]\
    \ char* gets(char* str) compilers\n  ```\n\n- **Use of attribute namespaces without\
    \ repetition:** Some of the requirements for using “non-standard” attributes were\
    \ loosened in C++17. Prefixing namespaces with a following non-standard attribute\
    \ is one such example. When several attributes were put together in C++11 or 14,\
    \ each one had to be prefixed with its surrounding namespace, resulting in the\
    \ code style seen below.\n\n  **Example:**\n  ```\n  [[gnu::always_inline, gnu::const,\
    \ gnu::hot, nodiscard]] int g();\n  ```\n\n  When looking at the code above, it\
    \ appears to be bloated and crowded. As a result, the committee agreed to simplify\
    \ the scenario when combining numerous attributes. At this time, the programmer\
    \ is not required to prefix the namespace with following attributes when they\
    \ are used simultaneously. This results in the code pattern given below, which\
    \ appears to be tidy and comprehensible.\n\n  **Example:**\n  ```\n  [[using gnu:const,\
    \ always_inline]] int g() {return 0;}\n  ```\n\n- **Multiple attributes for a\
    \ single piece of code:** In C++, multiple attributes may now be applied to a\
    \ single piece of code. In such instance, the compiler evaluates each of the characteristics\
    \ in the order in which they are written. This enables programmers to create code\
    \ that can include many restrictions.\n\n  **Example:**\n\n## DIFFERENCES BETWEEN\
    \ C++ AND C# CHARACTERISTICS\n\nThere is a significant difference between C# and\
    \ C++ attributes. Deriving from `System` in C# allows the programmer to specify\
    \ additional characteristics. Unlike in C++, where the meta information is fixed\
    \ by the compiler and cannot be used to define new user-defined characteristics,\
    \ in C# the meta information is not fixed by the compiler and may be used to define\
    \ new user-defined attributes. This limitation was put in place to prevent the\
    \ language from developing into a new form that would have made it more difficult.\n\
    \n## ATTRIBUTES IN METADATA\n\nThe metadata characteristics describe the content's\
    \ credentials. These qualifiers can be used to change how the material is processed.\n\
    \nThe metadata attributes are commonly used to filter material based on their\
    \ values. Another common application is to mark content based on its values, for\
    \ as by highlighting the impacted words in the output. Filtering is often done\
    \ using `audience`, `platform`, `product`, and otherprops, and flagging is done\
    \ with the same characteristics plus `rev`. For example, designating stages in\
    \ a job as optional or mandatory, `status` and `significance` are utilized for\
    \ tool-specific or transform-specific behavior.\n\n> A metadata attribute, in\
    \ general, offers a list of one or more qualification values separated by whitespace.\
    \ The `audience` attribute administrator programmer, for example, classifies the\
    \ material as being relevant to administrators and programmers.\n\n> The `audience`,\
    \ `platform`, and `product` metadata for a subject can be represented using properties\
    \ on the topic element or components in the topic prologue. While the metadata\
    \ components are more descriptive, the values have the same meaning and can be\
    \ used together.\n\n- **audience:** When the values from the enumerated attributes\
    \ of the `audience` metadata element are used in the `audience` attribute of a\
    \ content element, they have the same meaning. The “user” value, for example,\
    \ has the same meaning whether it appears in the type property of a topic's audience\
    \ element or the `audience` attribute of a content element. The idea applies to\
    \ the `audience` element's `type`, `job`, and `experience level` properties.\n\
    \n  The `audience` attribute's values can also be used to point to a more detailed\
    \ description of an audience in an `audience` element. When referring to the same\
    \ audience in an `audience` attribute, use the name of the audience from the `audience`\
    \ element. The `audience` property accepts a list of values separated by blanks\
    \ that may or may not match the name value of any audience components.\n\n- **platform:**\
    \ The operating system, hardware, or other environment can all be considered platforms.\
    \ This property is the subject metadata's counterpart of the `platform` element.\n\
    \n  The `platform` property accepts a list of values separated by blanks, which\
    \ may or may not correspond to the content of a `platform` element in the prologue.\n\
    \n- **product:** The name, version, brand, or internal code or number of the product\
    \ or component. This property is the subject metadata's counterpart of the `prodinfo`\
    \ element.\n\n  The `product` property accepts a list of values separated by blanks,\
    \ which may or may not match the `prodname` element's value.\n\n- **importance:**\
    \ The importance of the material is measured in terms of its priority. This property\
    \ accepts a single enumeration value.\n\n- **rev:** The revision level's unique\
    \ identifier.\n\n- **status:** The current state of the content and this property\
    \ accepts a single enumeration value.\n\n## PROVIDING METADATA TO THE COMPILER\
    \ WITH ATTRIBUTES\n\nWhen it comes to features that enable reflection or introspection\
    \ on types or data, as well as standard procedures for defining language extensions,\
    \ C++ has been severely lacking. As a result, compilers have created their own\
    \ extensions specifically for this purpose. The VC++ `__declspec()` specifier\
    \ and the GCC `__attribute__(…)` specifier are two examples. C++11, on the other\
    \ hand, adds the idea of attributes, which allow compilers to incorporate extensions\
    \ or even embedded domain-specific languages in a standard fashion. The new C++\
    \ standards establish a number of characteristics that all compilers must support.\n\
    \n### How To Do It\n\nUse standard attributes to provide hints for the compiler\
    \ about various design goals:\n\n- **To gurantee that the return value from a\
    \ function cannot be overlooked, declare the function with `[[nodiscard]]` attribute:**\n"
