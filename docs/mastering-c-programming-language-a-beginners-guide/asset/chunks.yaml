    Function overloading and operator overloading are terms used in C++ to describe
    the ability to specify several definitions for a function name or an operator
    in the same scope.


    An overloaded declaration is one that has the same name as a previously declared
    declaration in the same scope, but both declarations have distinct parameters
    and clearly different definitions.


    The compiler determines which definition to apply when you call an overloaded
    function or operator by comparing the argument types you used to invoke the function
    or operator to the parameter types supplied in the definitions.


    ### Overloading Function


