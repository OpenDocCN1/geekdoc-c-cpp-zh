- fmt: "\nExceptions propagated from the body of nested generator coroutines are rethrown\
    \ into the parent coroutine from the `co yield` expression instead of propagating\
    \ from the top-level `iterator::operator++()`. This is based on the mental model\
    \ that `co_yield someGenerator` is semantically identical to manually iterate\
    \ through the elements and yielding each one.\n\nFor example, nested `ints()`\
    \ and manual `ints()` are semantically similar.\n\n### elements_of\n\nWhen a nested\
    \ generator type is convertible to the value type of the current generator, `elements_of`\
    \ is a utility function that prevents ambiguity.\n\n**Example:**\n\n- To avoid\
    \ this issue:\n    - `co_yield expression>` -> should always yield the value directly\
    \ to prevent this problem.\n    - `co_yield elements of(expression>)` return the\
    \ nested generator's values.\n\nWe also suggest that `co_yield elements of(x)`\
    \ be expanded for convenience to yielding the values of arbitrary ranges other\
    \ than generators.\n\n## SYMMETRIC TRANSFER\n\nWith the symmetric transfer, the\
    \ recursive form may be accomplished quickly. This functionality was previously\
    \ provided in a separate `recursive_generator` type in `[CppCoro]`.\n\nHowever,\
    \ owing to HALO improvements and symmetric transfer, it looks that a single type\
    \ is quite efficient. That functionality comes at a memory cost of three additional\
    \ pointers per generator. Given the current state of compiler support for coroutines,\
    \ estimating the runtime cost of our approach is challenging. Our testing, however,\
    \ reveals no discernible difference between a generator and a `recursive_generator`,\
    \ sometimes known as `non_recursively`. It's worth mentioning that the suggested\
    \ approach ensures the possibility of HALO optimizations.\n\nWhile we believe\
    \ that a single generator type is adequate and provides a superior API, there\
    \ are three alternatives:\n\n- Support for recursive calls in a single generator\
    \ type (this proposal).\n- A recursive generator type that may return values from\
    \ either a recursive generator or a generator. That might result in minimal performance\
    \ gains while using the same amount of RAM.\n- A recursive generator type that\
    \ can only return values from other recursive_- generator types.\n\nThe following\
    \ would be ill-formed if we choose the third option:\n\nInstead, we'd have to\
    \ write:\n\nDue to this constraint, deciding whether to return a generator or\
    \ `recursive_generator` while constructing a generator coroutine can be tricky\
    \ since we may not know whether or not this specific generator would be utilized\
    \ within `recursive_-generator` at the moment.\n\nSuppose we pick the generator\
    \ return-type and subsequently wish to yield its elements from a `recursive_generator`.\
    \ In that case, we must either manually yield each element one at a time or use\
    \ a helper function that converts the generator to a `recursive_generator`. When\
    \ compared to the situation where the generator was initially built to yield a\
    \ `recursive_generator`, both of these choices add runtime cost since they need\
    \ two coroutine resumptions for each element instead of a single coroutine resumption.\n\
    \nWe do not advocate this method because of these drawbacks.\n\nThe symmetric\
    \ transfer is allowed for various generator types as long as the reference type\
    \ is the same, i.e., the symmetric transfer is not prevented by a different value\
    \ type or allocator type.\n\n### What Is the Best Way to Store the Delivered Value\
    \ in a Promise Type?\n\nBecause the given expression is assured to be alive until\
    \ the coroutine restarts, storing its address is sufficient. This makes a big\
    \ yielding type generator efficient. However, due to the extra indirection, it\
    \ may be pessimistic in terms of producing values smaller than a pointer (The\
    \ cost of this indirection is unknown, as none of these accesses should cause\
    \ cache misses.)\n\nConversions in yielding expressions are avoided as a result\
    \ of this:\n\nAt the cost of extra storage, storing a copy would allow less indirection\
    \ and the flexibility to yield any values convertible to the yielded type. A `generator<const\
    \ D&>` can be utilized to avoid the storage expense.\n\n### Support for Allocators\n\
    \nBy templating both the `generator` and the `promise_type`'s new operator on\
    \ the allocator type, `std::generator` can handle both stateless and stateful\
    \ allocators and strives to reduce the interface verbosity for stateless allocators.\n\
    \n**Example:**\n\nSupporting allocators necessitates keeping a function pointer\
    \ adjacent to the coroutine frame (to monitor a deallocation function) and, in\
    \ the case of stateful allocators, the allocator itself.\n\nIf an allocator is\
    \ given, it must be the second argument to the coroutine function, immediately\
    \ before an instance of `std::allocator_arg_t`, according to the suggested interface.\
    \ This method is required to distinguish between the allocator that will be used\
    \ to create the coroutine frame and the allocators that will be used in the body\
    \ of the coroutine function.\n\nWe believe all standard and user coroutine kinds\
    \ must have equivalent allocator support interfaces. In reality, the allocator\
    \ support implementation may be shared between the `generator`, `lazy`, and other\
    \ standard types.\n\n#### Is It Possible to Postpone Adding Allocator Support\
    \ for Later?\n\nIt's possible that allocator support will be introduced to `std::generator`\
    \ in the future. However, because the allocator is a template parameter in the\
    \ proposed architecture, introducing allocator after `std::generator` ships would\
    \ be an ABI break. We urge that we add allocator support immediately, as recommended\
    \ in this article, and ensure that the architecture remains consistent throughout\
    \ this cycle's work on `std::lazy`.\n\n## EXPERIENCE AND IMPLEMENTATION\n\nAs\
    \ part of `cppcoro` and `folly`, a generator has been given. `Cppcoro`, on the\
    \ other hand, provides a distinct recursive generator type, which differs from\
    \ the suggested architecture.\n\nFolly employs a single recursive generator type\
    \ that does not support symmetric transfer. Regardless, Folly users found `Folly::Generator`\
    \ to be significantly more efficient than the eager algorithm it replaced.\n\n\
    Ranges-v3 also includes a generator type that is never recursive and precedes\
    \ the work on move-only views and iterators, which causes the coroutine handler\
    \ to be ref-counted.\n\n## PERFORMANCE AND BENCHMARKS\n\nBecause implementations\
    \ are still being fine-tuned, and performance is highly dependent on whether HALO\
    \ optimization happens, it is impossible to make conclusive comments regarding\
    \ the proposed design's performance at this time.\n\nClang can inline non-nested\
    \ coroutines whether the implementation supports coroutines or not at the time\
    \ of authoring, but GCC never does HALO optimization.\n\nSupport for recursion\
    \ has no noticeable influence on performance when the coroutine is not inlined.\n\
    \n## COMPILING CODE WITH COROUTINES\n\nBecause C++20 isn't currently widely supported,\
    \ we'll need to make sure compiler supports coroutines to use them. We are using\
    \ GCC 10.2, which appears to allow coroutines if we use the following options\
    \ while compiling:\n\n## HANDLES FOR COROUTINES\n\nThe new `co_await` operator,\
    \ as previously noted, guarantees that a function's current state is packaged\
    \ up someplace on the heap and generates a callable object whose activation continues\
    \ the current function's execution. `std::coroutine handle>` is the type of the\
    \ callable object.\n\nA coroutine handle works similarly to a C pointer. It's\
    \ simple to copy, but it lacks a destructor to release the memory associated with\
    \ coroutine state. To minimize memory leaks, we should always call the `coroutine\
    \ handle::destroy` function to delete coroutine state (though in certain cases\
    \ a coroutine can destroy itself on completion). When a coroutine handle is destroyed,\
    \ coroutine handles referencing the same coroutine will lead to the trash and\
    \ have undefined behavior when executed, just like a C pointer. On the other hand,\
    \ a coroutine handle remains valid for the duration of a coroutine's execution,\
    \ even if control passes in and out of the coroutine several times.\n"
