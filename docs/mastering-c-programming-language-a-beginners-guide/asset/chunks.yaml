    \ In order to generate the final executable, we must link our object files in\
    \ this final stage. To do so, we utilize the `LINK` command, followed by the newly\
    \ generated object files.\n\n## PREPROCESS DIRECTIVES IN C++\n\n### Preprocessor\
    \ Directives\n\nA few lines at the start of nearly every C/C++ program preceded\
    \ by a hash (`#`) sign are preprocessor directives. The compiler preprocesses\
    \ these lines before starting the real compilation. The newline letter “n” signifies\
    \ the end of these lines; no semicolon `;;` is required to complete them.\n\n\
    Preprocessor directives are commonly used to define macros, evaluate conditional\
    \ statements, include source files, use the `pragma` directive, regulate line\
    \ length, and identify errors.\n\nWe'll go through some additional preprocessor\
    \ directives in the sections below:\n\n- Compilation with conditions\n- Line control\n\
    - Error directive\n- **Conditional Compilation:** Conditional compilation directives\
    \ assist in compiling a specified piece of a program or allow us to forgo compiling\
    \ a certain part of the program based on certain criteria. We examined two of\
    \ these directives in our last article: `ifdef` and `endif`. We'll talk about\
    \ `#ifndef`, `#if`, `#else`, and `#elif` in this post.\n\n    1. **#ifdef:** The\
    \ simplest conditional directive is `#ifdef`. A conditional group is the name\
    \ for this type of block. If the `macroname` is specified, the controlled text\
    \ will be included in the preprocessing output. Preprocessing instructions will\
    \ be included in the controlled text of a conditional. Only if the conditional\
    \ succeeds are they performed. These can be stacked in several levels, but they\
    \ must be fully nested. In other words, the closest `#ifdef` (or `#ifndef`, or\
    \ `#if`) is always matched by `#endif`. A conditional group can't be started in\
    \ one file and finished in another.\n\n        **Syntax:**\n\n    2. **#ifndef:**\
    \ We know that if the `macroname` is defined in the `#ifdef` directive, the block\
    \ of statements following it will run properly, but if it is not defined, the\
    \ compiler will simply skip this block of statements. The `#ifndef` directive\
    \ works in the exact opposite way as the `#ifdef` directive. If the macro or identifier\
    \ with `#ifndef` is not defined, the block of statements between `#ifndef` and\
    \ `#endif` will be executed only if the macro or identifier with `#ifndef` is\
    \ not declared.\n\n        **Syntax:**\n\n    3. **#if, #else, and #elif:** These\
    \ directives work together to control the compilation of programme segments based\
    \ on certain situations. If the condition with the `#if` directive evaluates to\
    \ a non-zero value, the group of lines immediately following the `#if` directive\
    \ will be executed; if the condition with the `#elif` directive evaluates to a\
    \ non-zero value, the group of lines immediately following the `#elif` directive\
    \ will be executed; otherwise, the lines following the `#else` directive will\
    \ be executed.\n\n        **Syntax:**\n\n- **Line control (#line):** When we build\
    \ a program, there is a risk that it will include an error. When a compiler detects\
    \ an error in a program, it gives us the filename where the fault was located,\
    \ as well as a list of lines and the precise line numbers where the error occurred.\
    \ This makes it simple for us to locate and correct errors.\n\n    The `#line`\
    \ directive, on the other hand, allows us to specify what information the compiler\
    \ should show during compilation problems.\n\n    **Syntax:**\n\n    `number—the\
    \ following code line will be allocated this number. From this point on, the line\
    \ numbers of subsequent lines will be raised one by one.\n\n    “filename”—an\
    \ optional argument that allows us to change the name of the file that will be\
    \ shown.\n\n- **Error directive (#error):** When this directive is detected in\
    \ a programme during compilation, it aborts the process and generates an optional\
    \ error that may be provided as a parameter.\n\n    **Syntax:**\n\n    `optional_error`\
    \ is any error that the user specifies and that will be displayed if this derective\
    \ is discovered in the application.\n\n## WHAT IS ENABLE_IF?\n\n**Using boolean\
    \ conditions to activate SFINAE is simple using `std::enable_if`. It is defined\
    \ as follows:**\n\nThat is, `enable_if<true, R>::type` is an alias for `R`, but\
    \ `enable_if<false, T>::type` is ill-formed since it lacks a type member `type`.\n\
    \n**To limit templates, use `std::enable_if`:**\n\n**Because of the ambiguity,\
