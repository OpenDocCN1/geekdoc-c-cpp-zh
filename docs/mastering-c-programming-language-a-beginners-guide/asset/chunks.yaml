    \ do not manipulate data:\n\n- To sort the provided vector, use `sort(first iterator,\
    \ last iterator)`.\n- To reverse a vector, use `reverse(first iterator, last iterator)`.\n\
    - `max_element(first iterator, last iterator)`: Returns the vector's maximum element.\n\
    - `min_element(first iterator, last iterator)`: Returns the vector's minimal element.\n\
    - `accumulate(first iterator, last iterator, sum start value)`: Performs vector\
    \ element summing.\n\n  **Example:**\n\n  **Output:**\n\n- `count(first iterator,\
    \ last iterator, x)`: Counts the number of times `x` appears in the vector.\n\
    - `find(first iterator, last iterator, x)`: Returns an iterator to the first occurrence\
    \ of `x` in the vector and pointers to the vector's last address (name of vector,`end()`)\
    \ if the element isn't in the vector.\n\n  **Example:**\n\n  **Output:**\n\n-\
    \ `binary_search(first iterator, last iterator, x)`: Determines if `x` is present\
    \ in the sorted vector.\n- `lower_bound(first iterator, last iterator, x)`: returns\
    \ an iterator pointing to the first element in the range `[first,last]` with a\
    \ value greater than or equal to `x`.\n- `upper_bound(first iterator, last iterator,\
    \ x)`: produces an iterator pointing to the first element with a value larger\
    \ than “x” in the range `[first,last]`.\n\n  **Example:**\n\n  **Output:**\n\n\
    ## ALGORITHMS FOR MANIPULATION\n\n- `arr.erase(position to be removed)`: Removes\
    \ a chosen element from a vector and resizes and adjusts the vector elements appropriately.\n\
    - `arr.erase(unique(arr.begin(),arr.end()),arr.end())`: This deletes duplicate\
    \ occurrences on a single line in a sorted vector.\n\n  **Example:**\n\n  **Output:**\n\
    \n- `next_permutation(first iterator, last iterator)`: This function changed the\
    \ vector's permutation to the next one.\n- `prev_permutation(first iterator, last\
    \ iterator)`: This changed the vector's permutation to the previous one.\n- `distance(first_iterator,\
    \ desired_position)`: Returns the distance between the first iterator and the\
    \ desired position. This method is quite handy when looking for an index.\n\n\
    \  **Example:**\n\n  **Output:**\n\n## VARIADIC FUNCTION\n\nVariadic functions\
    \ take a variable number of arguments, for example `std::printf`.\n\nAn ellipsis\
    \ comes after the list of parameters, e.g., `int printf(const char* format…);`,\
    \ which may be preceded by an optional comma, to declare a variadic function.\
    \ For more information on the syntax, automated argument conversions, and alternatives,\
    \ see Variadic arguments.\n\nThe following library facilities are given to access\
    \ the variadic arguments from the function body:\n\n| `va_start` | Access to variadic\
    \ function arguments is enabled |\n| :--- | :--- |\n| `va_arg` | accesses the\
    \ next argument of a variadic function |\n| `va_copy` (C++11) | duplicates the\
    \ variadic function parameters |\n| `va_end` | The traversal of the variadic function\
    \ parameters comes to a conclusion |\n| `va_list` | contains the data that `va_start`,\
    \ `va_arg`, `va_end`, and `va_copy` (typedef) require |\n\n**Syntax:**\n\n**Example:**\n\
    \n**Output:**\n\n## EXPRESSIONS\n\nThis section covers C++ expressions, which\
    \ are collections of operators and operands that serve one or more of the following\
    \ purposes:\n\n- The operands are used to calculate a value.\n- Objects or functions\
    \ are designated.\n- Creating “unintended consequences” (Side effects are any\
    \ activities other than evaluating the expression, such as changing an object's\
    \ value.)\n\nOperators in C++ can be overloaded, and their semantics can be customized.\
    \ Their order of precedence and the number of operands they accept, however, cannot\
    \ be changed. Without becoming overloaded, this section discusses the syntax and\
    \ semantics of operators as supplied by the language.\n\n### Expressions of Many\
    \ Kinds\n\n#### The following are the different types of C++ expressions\n\n-\
    \ **Expressions that are fundamental:** These are the essential elements upon\
    \ which all other expressions are built.\n- **Expressions with a postfix:** These\
    \ are main expressions that are followed by an operator, such as array subscript\
    \ or postfix increment.\n- **Unary operators are used to creating expressions:**\
    \ In an expression, unary operators affect just one operand.\n- **Binary operators\
    \ are used to creating expressions:** In an expression, binary operators act on\
    \ two operands.\n- **The conditional operator is used in expressions:** The conditional\
    \ operator is a ternary operator that accepts three operands and is the only one\
    \ in C++.\n- **Expressions that never change:** Constant expressions are fully\
    \ made up of constant data.\n- **Type conversions are explicit in expressions:**\
    \ In expressions, explicit type conversions, or “casts”, can be employed.\n- **Pointer-to-member\
    \ operators are used in expressions**.\n- **Casting:** In expressions, type-safe\
    \ “casts” can be employed.\n- **Information about the type of run-time:** During\
    \ program execution, determine the type of object.\n\n### Primary Expressions\n\
    \nPrimary expressions serve as the foundation for more complicated expressions.\
    \ They can be literals, names, or names with the scope-resolution qualified (::).\n\
    \n**Syntax:**\n\nA literal is a basic expression that never changes. Its type\
    \ is determined by the way it is specified. See Literals for further information\
    \ on how to specify literals.\n\nThe `this` keyword is a class object reference.\
    \ It can be accessed using nonstatic member functions. It refers to the class\
    \ instance for which the function was called. Outside of the body of a class member\
    \ function, the `this` keyword isn't allowed.\n\nThe `this` pointer type is `type\
    \ * const` within procedures that don't explicitly change it (where type is the\
    \ class name). The kinds of this member function declarations are seen in the\
    \ following example:\n\n**Example:**\n\nSee this pointer for additional information\
    \ on changing the type of this.\n\nThe main expression is a scope resolution operator\
    \ (::) followed by a name. These names must be global names, not member names.\
    \ The statement of the name determines the kind of expression. If the declaring\
    \ name is an l-value (that is, it may appear on the left-hand side of an assignment\
    \ expression), it's an l-value. Even though a global name is concealed in the\
    \ current scope, the scope-resolution operator permits it to be referenced.\n\n\
    The main expression is contained in parenthesis. Its type and value are the same\
    \ as the unparenthesized expression's type and value. If the unparenthesized expression\
    \ is an l-value, it's an l-value.\n\n### Variadic Templates and Ellipsis\n\nA\
    \ variadic template is a class or function template that accepts an unlimited\
    \ number of arguments. This method is beneficial for C++ library authors since\
    \ it can be used to create both class and function templates, providing a wide\
    \ variety of type-safe and non-trivial functionality and flexibility.\n\n**Syntax:**\n\
    \nVariadic templates employ an ellipsis in two ways. It denotes a parameter pack\
    \ to the left of the parameter name, and it extends the parameter packs into distinct\
    \ names to the right of the parameter name.\n"
