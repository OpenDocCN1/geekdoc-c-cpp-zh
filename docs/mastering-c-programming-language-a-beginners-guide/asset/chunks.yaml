    ### std::generator: Ranges Synchronous Coroutine Generator


    **Example:**


    ### Motivation


    Coroutine support in C++ 20 was quite limited. Synchronous generators are standard
    for coroutines that would be impossible to implement without the technology described
    in this work. Writing an efficient and appropriately behaved recursive generator;
    thus, the standard should provide one.


    ### Design


    While the proposed std::generator interface is straightforward, there are a few
    considerations worth noting.


    *   **input_view:** The std::generator input view is a non-copyable view that
    models input_range and spawns move-only iterators. The coroutine frame is a one-of-a-kind
    resource (even if the coroutine handle is copyable). Unfortunately, certain generators
    can meet the view restrictions but not the view O(1) destruction requirement:


    ### Header


    There are several places where the generator class may be placed.


    *   <coroutine>, but coroutine is a low-level header, and generator is reliant
    on <type traits> and <iterator> bits.


    *   <ranges>


    *   A new <generator>


    ### Value Type Can Be Specified Separately


    This proposal allows we to define both the “yielded” type, which is the iterator
    “reference” type (which isn''t needed to be a reference), and the value type that
    corresponds to it. This enables ranges to support proxy types and wrapped references,
    such as in the following zip implementation:


    The use of string as a value type in the second example guarantees that the calling
    code may take the necessary precautions to ensure that iterating over a generator
    does not invalidate any returned values.


    ### Recursive Generator


    A “recursive generator” is a coroutine that allows to directly co_yield a generator
    of the same type to emit its elements as elements of the current generator.


    **A generator, for example, can co_yield other generators of the same type.**


    **Example:**


    The ability to directly yield a nested generator provides certain performance
    advantages versus iterating through the contents of the nested generator and manually
    yielding each of its elements, in addition to being more succinct.


    When using a nested generator, the top-level coroutine''s consumer can directly
    resume the current leaf generator when incrementing the iterator, but manually
    iterating over elements of the child generator takes O(depth) coroutine resumptions/suspensions
    each element of the sequence.


    **Example: The non-recursive version has O(depth) resumptions/suspensions per
    element and is hence more difficult to write**'
