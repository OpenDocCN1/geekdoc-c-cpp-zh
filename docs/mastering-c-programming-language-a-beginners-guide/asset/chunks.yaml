  trans: "\n步骤 3 中的过程在返回时不会将控制权归还给协程。当步骤 2 中的可调用对象被触发时，协程将继续运行。如果我们使用的语言支持带有当前延续（contin）的调用，或者我们研究过\
    \ Haskell 的 `Cont` Monad，那么步骤 2 中的可调用对象就类似于延续（continuation）。\n\n如果一个函数的定义实现了以下任意操作，它\
    \ 就是一个协程：\n\n* 使用 `co_await` 操作符来挂起执行，直到其重启。\n  **语法：**\n\n* `co_yield` 是一个关键字，用于挂起执行并返回一个值。\n\
    \  **语法：**\n\n* `co_return` 是一个关键字，用于完成执行并返回一个值。\n  **语法：**\n\n### 限制\n\n协程中不允许使用变长参数、简单的返回语句和占位符返回类型（`auto`\
    \ 或 `concept`）。\n\n`constexpr` 函数、构造函数、析构函数或主函数中不允许使用协程。\n\n### 执行\n\n* **每个协程都与以下内容相关联：**\n\
    \    * 在协程内部对承诺对象（promise objects）进行操作。协程使用此对象来提交其结果或异常。\n    * 在协程外部对协程句柄进行操作。这是一个非所有权的句柄，用于恢复协程执行或销毁协程帧。\n\
    \n* 协程状态是一个在堆上分配的内部对象（除非分配被优化掉），它包含：\n    * 承诺对象（promise object）。\n    * 变量（全部按值拷贝）。\n\
    \    * 当前挂起点的表示，以便 `resume` 知道下一步去向哪里，`destroy` 知道哪些变量在局部作用域内。\n    * 寿命超出当前挂起点的局部变量和临时变量。\n\
    \n* **当协程开始运行时，它会执行以下操作：**\n    * 使用 `new` 操作符分配一个协程状态对象对象。\n    * 向协程状态拷贝所有函数参数：按值传递的参数被移动或复制，而按引用传递的参数保持引用（因此如果协程在引用对象的生命周期结束后被恢复，这些引用可能会变成悬悬）。\n\
    \    * 如果承诺类型包含一个接受所有协程参数的函数，则将使用拷贝后的协程参数调用它。如果未指定，则使用默认函数。\n    * 调用 `promise`\
    \ 的 `return object()` 返回一个对象并将其存储在局部变量中。当协程初始挂起时，该调用的结果将返回给调用者。在此阶段之前及该阶段，异常将返回给调用者，而不是存储在承诺中。\n\
    \    * `co_awaits` `promise.initial_suspend()` 的结果。对于延迟启动的协程使用 `Suspend_always`，对于积极启动的协程使用\
    \ `never suspend`，这是两种常用的 `Promise` 类型。\n    * 当 `co await promise.initial_suspend()`\
    \ 返回时，执行协程体。\n\n* **当协程到达挂起点时：**\n    * 调用者/恢复者接收之前获取的返回对象，必要时它会被隐式转换为协程的返回类型。\n\
    \n* **以下是协程到达 `co_return` 语句时执行的操作：**\n    **针对以下情况调用 `promise.return_void()`：**\n\
    \    * `co_return;`\n    * 如果 `expr` 类型为 `void`，则执行 `co_return expr`。\n    * 丢弃返回\
    \ void 的协程的结尾。如果 `Promise` 类型没有 `Promise::return void()` 成员方法，则行为未知。\n    * 或者对于非\
    \ void 类型的 `co_return expr`，调用 `promise.return_value(expr)`。\n    * 按照创建的反向顺序移除任何具有自动存储生存周期的变量。\n\
    \    * 调用 `promise`。\n    * `co_awaits` `final_suspend()` 的结果。\n\n* **如果协程结束时有未捕获的异常，它会执行以下操作：**\n\
    \    * 捕获异常并调用 `promise`。\n    * 在 catch 块内部调用 `unhandled_exception ()`。\n   \
    \ * 调用 `promise`。\n    * `final_suspend()` 并 `co_awaits` 结果；从此点恢复协程是未定义行为。\n\n\
    * **当协程状态被销毁时，它执行以下操作：**\n    * 调用承诺对象的析构函数。\n    * 调用函数参数拷贝的析构函数。\n    * 为了释放协程状态占用的内存，调用\
    \ `operator delete`。\n    * 将控制权归还给调用者。\n\n### 堆分配\n\n协程状态使用非数组运算符 `new` 在堆上分配。\n\
    \n如果在 `Promise` 类型中定义了类级替换，则将利用它；否则将使用新的全局操作符。\n\n如果 `Promise` 类型提供了接受额外参数的放置形式的\
    \ `operator new`，并且它们与参数列表匹配（其中第一个参数是请求的大小，类型为 `std::size_t`，其余是协程函数参数），则这些参数将提供给\
    \ `operator new`（这使得协程可以使用前导分配器约定）。\n\n即使使用了自定义分配器，如果满足以下条件，对 `operator new` 的调用也可以优化掉：\n\
    * 协程状态的寿命紧密嵌套在调用者的寿命内。\n* 如果在调用处已知协程帧的大小，则协程状态将嵌入到调用者的栈帧中（如果调用者是普通函数），或者协程状态将嵌入到调用者的协程状态中。\n\
    \n### 承诺\n\n（注：此处原文似乎截断，以下为根据后文内容的翻译）\n"
- fmt: "\nIt's worth noting that our promise object copies `i`'s value from the coroutine\
    \ into `promise type::value_` before passing it to the main function. We could\
    \ have made `value_` an unsigned `*` and returned a reference to the variable\
    \ `I` within `counter3` in a somewhat confusing way. Because the coroutine's local\
    \ variables are stored in the heap's coroutine state object and their memory is\
    \ preserved between `co_await` calls until the coroutine handle is destroyed;\
    \ this is something we can achieve. It would be even handier to put `I` within\
    \ the return object; however, there is no graceful method to do so due to the\
    \ way return objects are built.\n\nUsing `std::coroutine traits`, the compiler\
    \ determines the `Promise` type from the coroutine's return type.\n\nLet `R` and\
    \ `Args…` indicate the return type and parameter type list of a coroutine, respectively,\
    \ and `ClassT` and `/*cv-qual*/` (if any) denote the class type to which the coroutine\
    \ belongs and its cv-qualification, respectively, if it is declared as a non-static\
    \ member function.\n\n*   If the coroutine is not declared as a non-static member\
    \ function, use `std::coroutine_traits<R, Args…>::promise type`.\n*   If the coroutine\
    \ is declared as a non-static member function that is not rvalue-reference-qualified,\
    \ use `std::coroutine_traits<R, ClassD/*cv-qual*/&, Args…>::promise type`.\n*\
    \   If the coroutine is specified as a rvalue-reference-qualified non-static member\
    \ function, use `std::coroutine_traits<R, ClassD/*cv-qual*/&&, Args…>::promise\
    \ type`.\n\n### co_await\n\nThe unary operation `co_await` suspends a coroutine\
    \ and hands control back to the caller. Its operand is an expression whose type\
    \ either defines `operator co_await` or can be converted to such a type using\
    \ the current coroutine's type conversion `Promise::await_transform`.\n\n### co_wait\
    \ expr\n\n*   **To begin, `expr` is transformed to an awaitable in the following\
    \ way:**\n    *   The awaitable is `expr`, as-is, if `expr` is created by an initial\
    \ suspend point, a final suspend point, or a yield expression.\n    *   Otherwise,\
    \ the awaitable is `promise.await_transform` if the current coroutine's `Promise`\
    \ type contains the member function `await_transform`.\n    *   Otherwise, the\
    \ awaitable is `expr` as-is.\n\n*   **The awaiter object is then acquired in the\
    \ following manner:** If the `operator co_await` overload resolution yields a\
    \ single best overload, the awaiter results from that call (`awaitable`).\n  \
    \  *   For member overload, use `co_await()`; for non-member overload, use `co_await(static_castAwaitable&&>(awaitable))`.\n\
    \    *   Otherwise, the awaiter is `awaitable` as-is if overload resolution finds\
    \ no `operator co await`.\n    *   Otherwise, the program is ill-formed if the\
    \ overload resolution is unclear.\n\nThe awaiter object is a temporary materialized\
    \ from the expression above if it is a `prvalue`. If the expression above is a\
    \ `glvalue`, the object to which it refers to the awaiter object.\n\nThen `awaiter.await_ready()`\
    \ is invoked (a shortcut to avoid the expense of suspension if the result is known\
    \ to be ready or can be finished synchronously). If the result is `false` when\
    \ contextually transformed to `bool`, then.\n\nThe coroutine has been halted (its\
    \ coroutine state is populated with local variables and current suspension point).\n\
    \nThe current coroutine's handle is called `Handle`, and `awaiter.await_suspend(handle)`\
    \ is invoked. The suspended coroutine state is visible via that handle inside\
    \ that function, and it's up to this function to schedule it to restart on some\
    \ executor or be destroyed (returning `false` counts as scheduling).\n\n*   Otherwise,\
    \ control is instantly given to the current coroutine's caller/resumer if `await\
    \ suspend` returns `void` (this coroutine stays suspended).\n*   The value `true`\
    \ restores control to the current coroutine's caller/resumer if `await suspend`\
    \ returns `bool`, whereas the value `false` resumes it.\n*   If `await suspend`\
    \ delivers a coroutine handle for another coroutine, it is resumed (through a\
    \ call to `handle.resume()`).\n\nFinally, `awaiter.await_resume()` is invoked,\
    \ and the result is the `co_await expr` expression's result.\n\nThe resume point\
    \ is immediately before the call to `awaiter.await_resume` if the coroutine was\
    \ suspended in the `co_await` expression and later resumed `()`.\n\n**Example:**\n\
    \n### The Coroutine Return Object Is As Follows\n\nThe return type of `counter`\
    \ was disregarded in the preceding case. The language does, however, limit the\
    \ sorts of coroutines that can be returned. A coroutine's return type call it\
    \ `R` must be an object type with the nested type `R::promise_type`. 2 `R::promise\
    \ type` must include a method `R get_return object()` that returns an instance\
    \ of the outer type `R`, among other things. The coroutine function's return value,\
    \ in this case `counter`, is returned by `get_return object() ()`. Many explanations\
    \ of coroutines refer to the return type `R` as a `future`, but for clarity's\
    \ sake, we'll just call it the return object type.\n\nIt would be good to just\
    \ return the `handle` from the `counter` instead of providing a `coroutine_handle<>*`\
    \ into the `counter ()`. If we place the `coroutine handle` within the return\
    \ object, we can do this. We just require `promise type::get_return_object` to\
    \ attach the `coroutine handle` into the return object because that function computes\
    \ it. How can we acquire a `handle` to a coroutine from within `get_return_object`?\
    \ Because the coroutine state referenced by a `coroutine handle` contains an instance\
    \ of `promise_type` at a given offset, we may calculate a `coroutine handle` from\
    \ the `promise object` using `std::coroutine`.\n\n### co_yield\n\nGetting a coroutine's\
    \ promise object is so hard because the C++ authors had one specific case in mind\
    \ and planned for that rather than the broader situation. Returning values from\
    \ coroutines, on the other hand, is a valuable use case. To that purpose, the\
    \ language includes `co_yield`.\n\nYield-expression gives the caller a value and\
    \ stops the current coroutine: It is a fundamental component of resumable generator\
    \ functions:\n\n**Syntax:**\n\n**equivalent to:**\n\nThe phrase `co yield e;`\
    \ is identical to `co await p.yield value(e);` if `p` is the coroutine's promise\
    \ object. We can simplify the preceding example by adding a `yield value` function\
    \ to the `promise type`. We no longer need to go through hoops to get our hands\
    \ on the promise object because `yield value` is a method on `promise type`. This\
    \ is how the updated code looks:\n\n**Example:**\n\n### co_return Operator\n\n\
    After reading the first three integers, our main function simply deleted the coroutine\
    \ state, resulting in an endless stream of integers. What if our coroutine only\
    \ wishes to create a certain amount of values before indicating the end of the\
    \ coroutine?\n\nC++ includes a new `co_return` operator to mark the end of a coroutine.\
    \ A coroutine can communicate that it is finished in one of three ways:\n\n* \
    \  `co return e;` can be used by the coroutine to return a final value `e`.\n\
    *   The coroutine can finish without a final value using `co_return;` with no\
    \ value (or a `void` expression).\n*   Like the preceding scenario, the coroutine\
    \ can allow execution to break off at the end of the function.\n\nThe compiler\
    \ adds a call to `p.return value(e)` on the promise object `p` in case 1\\. The\
    \ compiler calls `p.return_void` in cases 2–3\\. (). We may check if a coroutine\
    \ is finished by calling `a.done()` on its coroutine handle `h`. (Coroutine_handle::done()\
    \ should not be confused with `coroutine_handle::operator bool) (). The latter\
