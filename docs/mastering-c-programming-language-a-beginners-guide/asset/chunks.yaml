    \ 创建了函数的默认实现。\n\n## 将函数默认化的局限性是什么？\n\n默认函数必须是一个特殊成员函数（默认函数 `Object`、析构函数等），或者它不能有任何默认参数。例如，非特殊成员函数不能被默认化，如下代码所示：\n\
    \n**示例：**\n\n当我们可以使用 `{}` 留空函数体时，使用 `=default` 有什么好处？\n\n尽管两者的作用可能相似，但使用默认值与留空构造函数体相比仍优势。以下几点将向你展示如何做到：\n\
    \n- 即使它什么都不做，为类型添加一个用户定义的函数 `Object` 也会使其既不是聚合类型（aggregate）也不是平凡类型（trivial type）。如果你希望你的类是聚合类型或平凡类型（或通过传递性，是\
    \ POD 类型），则必须使用 `= default`。\n- 在拷贝构造函数和析构函数中使用 `= default` 也是可能的。例如，空拷贝函数的执行结果与默认拷贝函数函数不相同（后者将执行对其成员的逐成员拷贝）。如果在这些特殊成员函数中一致地使用\
    \ `= default` 语法，代码将更易于理解。\n\n## 删除函数\n\n在 C++11 之前，`delete` 运算符只有一个用途：释放动态分配的内存。\n\
    \nC++11 标准引入了该运算符的另一种用法：阻止成员函数被使用。通过在函数定义末尾附加 `=delete;` 指定符来实现这一目标。\n\n显式删除的函数是通过使用\
