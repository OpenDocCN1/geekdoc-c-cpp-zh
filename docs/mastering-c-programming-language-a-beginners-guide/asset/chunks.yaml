    \ a single method `PrintHiWorld()`, which is implemented in `HelloWorld.cpp`,\
    \ with `main.cpp` handling the actual construction of the `HelloWorld` object\
    \ and invoking its function.\n\n- **Compiling:** We just use the `cl` command\
    \ followed by all of the `.cpp` files we want to build to compile and link our\
