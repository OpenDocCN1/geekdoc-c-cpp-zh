    There are few things to remember when it comes to co-return. We didn''t have a
    `return_void()` function on our promise object in the previous examples. That''s
    OK as long as we didn''t use `co return`. If we use `co return` but don''t have
    the proper `return void` or `return value` method, a compilation error regarding
    the missing function will occur. The good news is that this is the case. The bad
    news is that we''ll receive undefined behavior if we fall off the end of a function
    and promise type doesn''t have a `return void` method. We''ll go into more detail
    about this in the editorial that follows, but suffice it to say that undefined
    behavior is terrible—like use-after-free or array-bounds-overflow terrible. So
    be cautious not to drop off the end of a coroutine that doesn''t have a `return_void_function`
    on its promise object!


    Another thing to keep regarding `co return` is that `promise_type::return void()`
    and `promise_type::return value(v)` return `void`; they don''t return awaitable
    objects. This is most likely due to a desire to standardize the processing of
    return values and exceptions. Nonetheless, the dilemma of what to do at the end
    of a coroutine remains.


    Should the compiler make a final change to the coroutine state and halt the coroutine,
    code in the main function may access the promise object and make sensible use
    of the `coroutine_handle` even after evaluating `co_return`? Shouldn''t returning
    from a coroutine, such as an implicit call to `coroutine_handle::destroy()`, remove
    the coroutine state?


    The `final_suspend` function on the promise type answers this question. According
    to the C++ specification, the function-body of a coroutine is effectively wrapped
    in the following:


    #### Syntax


    We implicitly `co await` the outcome of `promise.final_suspend()` when a coroutine
    returns. If `final_suspend` truly suspends the coroutine, the state of the coroutine
    will be changed one last time. It will remain valid, and code outside the coroutine
    will be responsible for releasing the coroutine object by executing the `destroy()`
    function on the `coroutine handle`. If `final_suspend` fails to suspend the coroutine,
    the coroutine state is deleted automatically.


    If we''re never going to touch the coroutine state again (perhaps because the
    coroutine just updated a global variable and/or released a semaphore before `co
    return`, and that''s all we care about), there''s no reason to pay for state saving
    one last time and worry about manually freeing the coroutine state so that `final_suspend()`
    returns `std::suspend_never`. If we need to access the `coroutine handle` or promise
    object after it returns, we''ll need to use `final_suspend()`, which returns `std::suspend_always`.


    ## WHAT ARE GENERATORS?


    ### Generic Generators


    The most helpful way to exceptions is to re-throw them in the main routine that
    calls the generator if we want to develop a generic generator return object type
    to enable others to write coroutines. `Unhandled_exception()` may achieve this
    by using `std::current_exception` to get a `std::exception_ptr`, which then puts
    in the promise object. The generator utilizes `std::rethrow_exception` to propagate
    the exception in the main function when this exception ptr is non-NULL.


    Another key issue is that, until now, our coroutines computed the initial value
    (0) as soon as they were called, before the first `co_await`, and therefore before
    the return object was built. There are two reasons why we might wish to wait until
    after the first coroutine suspension to compute the first value. First, when computing
    values is time-consuming, it may be preferable to store work if the coroutine
    is never restarted (perhaps because of an error in a different coroutine). Second,
    because coroutine handles must be explicitly destroyed, things may become complicated
    if a coroutine throws an exception before being suspended for the first time.


    #### Example


    Assume that `mkCoroutineA()` provides a coroutine handle whereas `mkCoroutineB()`
    throws an error before its first `co await` in the example above. The coroutine
    generated by `mkCoroutineA()` will never be deleted in this scenario. We could
    rearrange the code to encapsulate `mkCoroutineB` in its `try-catch` block, but
    this would rapidly become complex when producing many coroutines.


    To solve these concerns, the function `promise_type::initial_suspend()` can return
    `std::suspend_always`, causing `mkCoroutineB` to be stopped immediately upon entrance
    before any code in the coroutine has run. In the sample generator below, we utilize
    this method. It implies that before returning the first value from our generator,
    we must restart the coroutine.


    So, here''s our general-purpose generator. A `Generator<D>` must be returned by
    a generator that produces type `D`. The main function checks if the `Generator`
    still has an output value and then uses `operator()` to get the next value.


    #### Example


    One final item to note is that we now remove the `coroutine_hande` inside the
    `Generator` destructor because we know that the coroutine handle is no longer
    required once the generator is gone.


    ### Greedy Generator


    The software that follows is as simple as possible. The function `getNumbers`
    returns all integers from start to finish, which `inc` has incremented. The beginning
    must be smaller than the ending, and the increment must be positive.


    #### Example


    ### Lazy Generator


    #### Example


    ### std::generator: Ranges Synchronous Coroutine Generator


    #### Example


    ### Motivation


    Coroutine support in C++ 20 was quite limited. Synchronous generators are standard
    for coroutines that would be impossible to implement without the technology described
    in this work. Writing an efficient and appropriately behaved recursive generator;
    thus, the standard should provide one.


    ### Design


    While the proposed `std::generator` interface is straightforward, there are a
    few considerations worth noting.


    - `input_view`: The `std::generator` input view is a non-copyable view that models
    `input_range` and spawns move-only iterators. The coroutine frame is a one-of-a-kind
    resource (even if the coroutine handle is copyable). Unfortunately, certain generators
    can meet the view restrictions but not the view O(1) destruction requirement:


    ### Header


    There are several places where the generator class may be placed.


    - `<coroutine>`, but coroutine is a low-level header, and generator is reliant
    on `<type traits>` and `<iterator>` bits.

    - `<ranges>`

    - A new `<generator>`


    ### Value Type Can Be Specified Separately


    This proposal allows we define both the “yielded” type, which is the iterator
    “reference” type (which isn''t needed to be a reference), and the value type that
    corresponds to it. This enables ranges to support proxy types and wrapped references,
    such as in the following zip implementation:


    The use of `string` as a value type in the second example guarantees that the
    calling code may take the necessary precautions to ensure that iterating over
    a generator does not invalidate any returned values.


    ### Recursive Generator


    A “recursive generator” is a coroutine that allows to directly `co_yield` a generator
    of the same type to emit its elements as elements of the current generator.


    **A generator, for example, can co_yield other generators of the same type.**


    #### Example


    The ability to directly yield a nested generator provides certain performance
    advantages versus iterating through the contents of the nested generator and manually
    yielding each of its elements, in addition to being more succinct.


    When using a nested generator, the top-level coroutine''s consumer can directly
    resume the current leaf generator when incrementing the iterator, but manually
    iterating over elements of the child generator takes O(depth) coroutine resumptions/suspensions
    each element of the sequence.


    **Example: The non-recursive version has O(depth) resumptions/suspensions per
    element and is hence more difficult to write**

