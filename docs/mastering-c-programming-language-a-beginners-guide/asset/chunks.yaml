- fmt: "\nIf a call like `func (42)` is encountered, the compiler must look for an\
    \ overload that can take an `int` argument. Because `int` does not have a data\
    \ type member, the output `void func (int::data_type const)` is incorrect when\
    \ it creates the overload set and substitutes the template parameter with the\
    \ supplied template argument. The compiler will not report an error and halt because\
    \ of SFINAE; instead, it will just disregard the overload and proceed. It then\
    \ looks for `void func (int const)`, which is the best match it can find.\n\n\
    If the compiler finds a call like `func<some type<<int>>(42)`, it creates an overload\
    \ set that includes `void func(some type<int>::data_type const)` and `void func\
    \ (int const)`, with the first overload being the best match in this case; no\
    \ SFINAE is used.\n\nIf the compiler finds a call like `func (\"string\"s)`, it\
    \ will again rely on SFINAE to disregard the function template, because `std::basic_string`\
    \ does not have a value type member. The overload set, however, does not include\
    \ any matches for the string parameter this time; as a result, the program is\
    \ ill-formed, and the compiler issues an error and exits.\n\nThere are no members\
    \ in the class template `enable_if<bool, D>`, but its partial specialization `enable_if<true,\
    \ D>` does include an inner type named `type`, which is a synonym for `D`. The\
    \ inner member type is available when the compile-time statement given as the\
    \ first parameter to `enable_if` evaluates to true, otherwise it is not.\n\nWhen\
    \ the compiler finds a call like `mul (2, 3)`, it tries to substitute `int` for\
    \ the template argument `T`; because `int` is an integral type, `std::is_integral`\
    \ evaluates to true, and a specialization of `enable_if` that defines an inner\
    \ type named `type` is created. As a result, the `EnableIf` alias becomes a synonym\
    \ for this type, which is `void` (due to the `typename D = void` expression).\
    \ The result is an `int mul<int, void> (int x, int y)` function template that\
    \ may be invoked with the provided parameters.\n\nWhen the compiler finds a call\
    \ like `mul (1.2, 2.4)`, on the other hand, it tries to replace `double` for the\
    \ template argument `D`. Because this isn't an integral type, the `std::enable_if`\
    \ condition evaluates to false, and the class template doesn't specify an inner\
    \ member type. This causes a substitution error, but the compiler, according to\
    \ SFINAE, will not generate an error and will continue. However, because no alternative\
    \ overload is discovered, there will be no way to invoke the `mul()` method. As\
    \ a result, the program is deemed ill-formed, and the compiler generates an error.\n\
    \nA similar issue arises when using the class template `pod_wrapper`. It contains\
    \ two template type parameters: the first is the wrapped POD type, and the second\
    \ is the result of the `enable_if` and are pod substitutions. The inner member\
    \ type from `enable_if` exists if the type is a POD type (as in `pod_wrapper`)\
    \ and it replaces the second template type argument. If the inner member type\
    \ is not a POD type (like in `pod_wrapper<std::string>`), the substitution fails\
    \ with a message like “too few template parameters”.\n\n# Attributes in C++\n\n\
    Attributes are a fundamental element of contemporary C++ that allow the programmer\
    \ to provide extra information to the compiler in order for the compiler to impose\
    \ constraints (conditions), optimize certain portions of code, or generate specific\
    \ code. In basic words, an attribute is a note or annotation to the compiler that\
    \ gives more information about the code for the sake of optimization and imposing\
    \ specific constraints on it. They were first introduced in C++11 and have remained\
    \ one of the greatest aspects of C++, evolving with each subsequent version.\n\
    \n## The Purpose of Attributes in C++\n\n- **Is to enforce code constraints:**\
    \ A constraint is a requirement that the parameters of a function must fulfill\
    \ in order for it to be executed (precondition). This was how the code for specifying\
    \ restrictions was written in prior versions of C++.\n\n  **Example:**\n  It improves\
    \ the readability of our code and eliminates the clutter created by the argument\
    \ checking code placed inside the method.\n\n- **To provide the compiler with\
    \ additional information for optimization purposes:** Compilers are quite adept\
    \ at optimization, yet they still trail below humans in several areas and suggest\
    \ inefficient generic code. This is due to a shortage of information on the “problem”\
    \ that humans face. To address this issue, the C++ standard has included several\
    \ additional characteristics that allow us to tell the compiler a little bit more\
    \ than just the code statement. The term “probable” is one such example.\n\n \
    \ **Example:**\n  When a statement is preceded by a `likely`, the compiler does\
    \ specific optimizations on that statement, improving the code's overall performance.\n\
    \n- **Suppressing specific warnings and faults in the code that the author meant\
    \ to have:** Rarely, a programmer may purposefully try to produce incorrect code,\
    \ which will be discovered by the compiler and reported as an error or a warning.\
    \ An unused variable that has been kept in that state for a specific reason, or\
    \ a switch statement with the break statements not inserted after some instances\
    \ to cause fall-through situations, are two examples. C++ has properties like\
    \ `[[maybe_unused]]` and `[[fallthrough]]` that prevent the compiler from issuing\
    \ warnings or errors in such situations, allowing to avoid problems and warnings.\n\
    \n  **Example:**\n\n## The following is a list of standard C++ attributes:\n\n\
    1. **noreturn:** The function does not return a value when `noreturn` is used.\n\
    \n  **Syntax:**\n  When looking at the code above, the issue of why `noreturn`\
    \ is used when the return type is actually `void` emerges. If a function is of\
    \ the `void` type, it returns to the caller without a value, but if the function\
    \ never returns to the caller (for example, an endless loop), adding a `noreturn`\
    \ attribute offers the compiler clues to optimise the code or create better warnings.\n\
    \n  **Example:**\n\n2. **deprecated:** Indicates that the name or entity specified\
    \ with this property is no longer valid and should be avoided for whatever reason.\
    \ Namespaces, functions, classes, structures, and variables can all have this\
    \ property.\n\n  **Syntax:**\n  **Example:**\n\n3. **nodiscard:** The caller should\
    \ not ignore the return values of entities defined with `nodiscard`. Simply put,\
    \ if a function returns a value and is tagged `nodiscard`, the caller must use\
    \ the return value rather than trash it.\n\n  **Syntax:**\n  The primary difference\
    \ between `nodiscard` with functions and `nodiscard` with class declarations is\
    \ that with functions, `nodiscard` only applies to the function that is declared\
    \ no discard, whereas with struct/class declarations, `nodiscard` applies to all\
    \ functions that return the nodiscard object by value.\n\n  **Example:**\n\n4.\
    \ **maybe_unused:** Suppresses warnings for any entities that aren't in use (For\
    \ example: An unused variable or an unused argument to a function).\n\n  **Syntax:**\n\
    \  **Example:**\n\n5. **fallthrough:** `[[fallthrough]]` indicates that a switch\
    \ statement's fallthrough is intended. A programmer's error is generally missing\
    \ a break or return in a switch statement, although fallthrough can result in\
    \ very succinct code in some circumstances, thus it is employed.\n\n  **Example:**\n\
    \n6. **likely:** For optimization of assertions that have a higher chance of being\
    \ executed than others. For testing reasons, Likely is now included in the current\
    \ version of the GCC compiler.\n\n  **Example:**\n\n7. **no_unique_address:**\
    \ Indicates that this data member does not need to have a unique-address from\
    \ the rest of its class's non-static data members. This indicates that if a class\
    \ has an empty type, the compiler can optimize it via empty base optimization.\n\
    \n  **Example:**\n\n8. **expects:** It defines the conditions (in the form of\
    \ a contract) that must be met by the arguments in order for a function to be\
    \ run.\n\n  **Syntax:**\n"
