    ### Encapsulation


    The following two essential components are present in all C++ programs:


    Functions are the parts of a program that perform actions, and they are termed
    program statements.


    Program data is the program''s information that is influenced by the program''s
    functions.


    Encapsulation is a notion in Object Oriented Programming that ties together data
    and the functions that change it, keeping both protected from outside intervention
    and misuse. The essential OOP idea of data hiding was born from data encapsulation.


    Data abstraction is a technique for exposing only the interfaces and hiding the
    implementation details from the user, whereas data encapsulation is a strategy
    for packaging data and the functions that utilize it.


    Encapsulation and data hiding are supported in C++ via the use of classes, which
    are user-defined types. We''ve previously seen that a class can have members who
    are secret, protected, or public. All items declared in a class are private by
    default.


    **Example:**


