    *   Alternatively, we may use the `[[nodiscard]]` property to specify enumerations
    and classes as the return type of a function; in this case, the return result
    of any function yielding such a type cannot be ignored:

    *   Declare functions or types that are considered deprecated with the `[[deprecated]]`
    attribute to ensure that the compiler issues a warning when they are used:

    *   Use the `[[may_unused]]` attribute to prevent the compiler from emitting a
    warning for unused variables:

    *   Use the `[[fallthrough]]` property to prevent the compiler from flagging the
    deliberate fall-through case labels in a switch statement with a warning:


    ### How Does It Work?


    The attributes are a very versatile element of C++; they may be used practically
    anywhere, but their real usage is determined for each attribute. Types, functions,
    variables, names, code blocks, and whole translation units can all benefit from
    them.


    Attributes are given using double square brackets (for example, `[[attrl]]`),
    and a declaration can have several attributes (for example, `[[attr1, attr2, attr3]]`).


    Attributes can have arguments, such as `[[mode(greedy)]]`, and they can also be
    completely qualified, such as `[[sys::hidden]]` or `[[using sys::visibility(hidden),
    debug]]`.


    Attributes cannot exist in a namespace declaration; however they can occur anywhere
    in a namespace as a single line declaration. In this example, whether an attribute
    applies to the next declaration, the namespace, or the translation unit is unique
    to each attribute:


    Attributes are frequently disregarded or very briefly addressed in current C++
    programming books and tutorials, and this is likely due to the fact that developers
    cannot really use them.


    Attributes are frequently overlooked or very briefly addressed in current C+ programming
    books and tutorials, and this is likely due to the fact that developers cannot
    create attributes because this language feature is meant for compiler implementations.
    It may be possible to define user-provided characteristics in some compilers;
    one such compiler is `GCC`, which offers plugins that bring more capabilities
    to the compiler and may also be used to construct new attributes. The standard
    does, however, specify a number of characteristics that all compilers must support,
    and knowing how to use them can help us create better code. Some of these were
    demonstrated in the preceding section''s examples. Different versions of the standard
    have defined these attributes:


    #### In C++11:

