  trans: "\n\nC++ 数据结构的使用允许程序员将不同的数据类型组合在一起，并将它们作为一个单元进行处理，这使得操作变得更加简单且易于理解。\n\n在\
    \ C++ 中，数据结构分为三类：\n\n1. **简单数据结构：**在 C++ 中，这些数据结构通常由原始数据类型组成，如 `int`、`float`、`double`、`string`\
    \ 和 `char`。\n2. **复合数据结构：**这类数据结构可以通过合并简单数据结构来创建。它进一步分为两类：\n    * **线性数据结构：**如果一个数据结构的元素按照逻辑顺序排列，则认为该数据结构是线性的。\n\
    \    * **非线性数据结构：**多级数据结构是非线性数据结构。\n3. **静态和动态数据结构：**静态数据结构具有固定的大小和结构，并连接到在编译时固定的特定内存位置。例如，数组。\n\
    \n### 数据结构操作\n\n* **插入：**向数据结构中插入新的数据元素的操作称为此操作。\n* **删除：**在数据结构中删除或移除现有的数据元素。\n\
    * **遍历：**使用遍历处理并显示数据结构中的所有数据。\n* **搜索：**在数据结构中查找特定的数据元素。\n* **排序：**将数据结构中的数据项按升、降序或任何其他逻辑顺序进行排序。\n\
    * **合并：**将两个或多个数据结构中的相似数据进行组合以创建一个新的数据结构的过程。\n\n## 面向对象\n\n### C++ 中的类和对象\n\n\
    C++ 编程的根本目标是向 C 语言引入面向对象的特性，类（也称为用户定义类型）是 C++ 中允许面向对象编程的关键元素。\n\n类通过将数据表示和更改数据的方法合并成一个包来指定对象的形状。类的成员是组成类的数据和方法。\n\
    \n### C++ 中的类定义\n\n当你定义一个类时，你本质上是在定义一个数据类型的蓝图。这并没有指定任何数据，但它定义了类名所含义的内容，即类对象将由什么组成，以及可以对其执行哪些操作。\n\
    \n使用关键字 `class` 来开始类的定义，后面紧跟类名，最后是位于大括号括起来的类体。类定义之后必须跟一个分号或一系列声明。例如，我们使用 `class`\
    \ 术语来定义 `Box` 数据类型：\n\n**示例：**\n\n后续类中成员的访问特性由关键字 `public` 决定。在类对象的作用范围内的任何地方，都可以从类外部访问公共成员。你也可以将类的成员设为私有（secret）或受保护（protected），我们将在后的章节中介绍。\n\
    \n### C++ 对象\n\n类充当事物的蓝图，因此对象本质上是根据蓝图产生的。类对象的声明方式与基本类型变量的声明相同。以下语句声明了两个 `Car`\
    \ 对象：\n\n### 具有数据访问成员\n\n直接成员访问运算符 `.` 可用于访问类对象的公共数据成员。为了清楚起见，请考虑以下示例：\n\n**输出：**\n\
    \n必须知道，直接成员访问运算符无法访问私有或受保护成员（`.`）。我们将发现如何访问私有和受保护的用户。\n\n### 类和对象的细节\n\n到为止，你已经学习了\
    \ C++ 类和对象的基础知识。还有一些与 C++ 类和对象相关的迷人概念，我们将在接下来的子节中介绍：\n\n| 序号 | 描述 |\n| --- | ---\
    \ |\n| 1 | 类成员函数：类的成员函数是类中的函数，与其他任何变量一样，它在类声明内部有其定义或原型。 |\n| 2 | 类访问修饰符：类成员可以是公共（public）、私有（private）或受保护（protected）。成员默认是私有的。\
    \ |\n| 3 | 构造函数和析构函数：构造函数是类中的特定函数，在创建该类的新对象时被调用。析构函数是在对象创建并销毁时运行的特定函数。 |\n| 4\
    \ | 拷贝构造函数：拷贝函数是一种通过使用同类之前生成的对象来初始化它以生成对象的函数。 |\n| 5 | 友函数：友函数对类的私有和受保护成员具有完全访问权限。\
    \ |\n| 6 | 内联函数：在内联函数的情况下，编译器尝试扩展函数体中的代码而不是调用它。 |\n| 7 | this 指针：每个对象都有一个指向实际对象的唯一指针。\
    \ |\n| 8 | 指针：类指针的创建方式与结构体指针的创建方式相同。实际上，类无非是一个包含函数的结构。 |\n| 9 | 静态成员：类的数据和函数成员都可以声明为静态（static）。\
    \ |\n\n### 继承\n\n继承的想法是面向对象编程中最核心的概念之一。继承允许我们根据另一个类来定义类，这简化了应用程序的和维护。这还允许代码功能的复用和快速实现。\n\
    \n在建立类时，不需要开发完全新的数据成员和成员方法，程序员可以指定新类应该继承现有类的成员。当前类被称为基类（base class），而新类被称为派生类（derived\
    \ class）。继承是一种实现的连接。\n\n### 基类和派生类\n\n一个类可以从多个基类派生，允许它从各种来源继承数据和功能。为了给派生类提供基类，我们使用派生列表。派生列表的形式为并指定一个或多个基类。\n\
    \n其中基类是之前定义的类名称，访问修饰符是公共、受保护或私有。如果不使用访问修饰符，默认为私有。\n\n**示例：**\n\n**输出：**\n\n###\
    \ 继承与访问控制\n\n派生类可以访问基类的所有非私有成员。因此，任何不应供派生类使用的基类元素都应在基类中设为私有。\n\n不同的访问权限按如下方式总结，取决于谁拥有访问权限：\n\
    \n| 访问权限 | 公共 (public) | 受保护 (protected) | 私有 (private) |\n| --- | --- | --- |\
    \ --- |\n| 同一类 | 是 | 是 | 是 |\n| 派生类 | 是 | 是 | 否 |\n| 外部类 | 是 | 否 | 否 |\n\n排除下列情况，派生类继承所有基类方法。\n\
    \n* 基类的构造函数、析构函数和拷贝构造函数。\n* 基类的运算符重载。\n* 基类的友函数。\n\n### 类型\n\n从基类创建类时，可以通过三种方式继承基类：公共、受保护或私有继承。如前，访问修饰符指定继承类型。\n\
    \n在使用各种继承类型时遵循以下原则：\n\n* **公共类：**当一个类从公共基类派生时，基类的公共成员成为派生类的公共成员，基类的受保护成员成为派生类的受保护成员。基类的私有成员永远无法从派生类直接访问，尽管可以通过基类公共和受保护成员的调用来访问。\n\
    \n"
