    在 C++ 中，当我们不再需要一个变量时，必须手动释放动态创建的内存。通过使用 `new` 和 `delete` 运算符，我们可以动态分配内存并在随后释放它。


    ### 内存管理的目的是什么？


    因为数组包含同质数据，在大多数情况下，内存是在声明数组时分配给数组的。当在运行时未指定精确的内存时，可能会出现问题。我们通过声明一个限制大小的数组来避免这个问题，但会有部分内存是未被使用的。为了防止内存浪费，我们利用
    `new` 运算符在运行时动态分配内存。


    ### 内存管理运算符


    在 C 语言中，使用 `malloc()` 和 `calloc()` 函数在运行时分配内存，而 `free()` 函数用于释放动态生成的内存。这些函数在 C++
    中同样可用，尽管定义了如 `new` 和 `delete` 等一元运算符来完成相同的工作，即分配和释放内存。


    ## new 运算符的优势


    与 `malloc()` 函数相比，`new` 运算符具有以下优势：


    - 它不需要 `sizeof()` 运算符，因为数据对象的 `size` 是自动计算的。

    - 它不需要进行类型转换，因为它交付的是正确的数据类型指针。

    - `new` 和 `delete` 运算符与其他运算符一样可以被重载。

    - 它还允许在内存中构建数据对象的同时对其进行初始化。


    ## C++ 中的 new 运算符


    `new` 运算符为变量提供内存。例如，


    使用 `new` 运算符，我们为一个 `int` 变量动态分配了内存。


    我们使用引用 `pntVar` 动态分配了内存。因为 `new` 运算符返回内存位置的地址，所以是这种情况。在处理数组时，`new` 运算符返回数组第一个元素的地址。


    使用 `new` 运算符的语法可以看上面的示例：


    ## delete 运算符


    我们可以在需要动态声明的变量后，释放该变量所占用的内存。`delete` 运算符用于此操作。内存释放是指将内存返回操作系统的过程。


    该运算符的语法如下：


    **示例：**


    使用指针 `pointVari`，我们为一个 `int` 变量动态分配了内存。


    ### 成员函数可以告诉你移除某些内容吗？


    - 你必须确保该对象是使用 `new` 分配的（而不是 `new[]`、放置 new、栈上的局部对象、命名空间作用域/全局，或另一个对象的成员；仅仅是 `new`）。

    - 你必须确信你的成员函数将是该对象上调用的最后一个成员函数。

    - 你必须确保你的成员函数的剩余部分（`delete` 行之后）不会接触到该对象的任何部分。这包括在任何分配在栈上且仍然存的对象的析构函数中执行的代码。

    - 你必须非常明确，在删除 `delete` 这一行之后，没有任何人触碰这个指针。换句话说，你不能查看它、不能与其他指针比较、不能与 `nullptr` 比较、打印它、强制转换它或对其进行任何操作。


    ### 动态分配内存


    下面显示了每个 C++ 软件使用的简单内存架构：


    - **代码段：** 这是保存包含执行指令的编译后程序的地方。它是一个只读文档。代码部分被放在栈和堆之后，以避免覆盖它们。

    - **数据段：** 这是维护全局变量和静态变量的地方。它不仅仅用于读取。

    - **栈（Stack）：** 栈是一种预分配的内存类型。栈是一种后进先出（LIFO）数据结构。每增加一个新变量，栈就会向上推。当变量不再处于作用范围内时，内存会被释放。当栈变量被移除时，它使用的内存空间即可供其他变量使用。随着函数推送和弹出局部变量，栈会扩展和收缩。它跟踪局部数据、返回地址、传递给函数的参数以及内存状态。

    - **堆（Heap）：** 内存是在应用程序运行时分配的。使用 `new` 运算符分配内存，而使用 `delete` 运算符处理内存。


