    ## C++ 中，malloc() 对比 new


    在 C++ 中，`malloc()` 和 `new` 都用于相同的事。在运行时，它们被用于分配内存。然而，`malloc()` 和 `new` 具有不同的语法。`malloc()`
    和 `new` 的显著区别在于 `new` 是一个运算符，而 `malloc()` 是 `stdlib` 头文件中的预定义库函数。


    ### new 是什么？


    `new` 是一个在运行时用于分配内存的运算符。使用 `new` 运算符分配内存，而使用 `delete` 运算符处理内存。它返回内存地址，并赋值给变量。在
    C++ 中的 `new` 类似于 C 语言中的 `malloc()` 函数。由于 `new` 具有优势，它更为常用。


    **语法：**


    - `type`：指定 `new` 运算符分配内存的变量的数据类型。

    - `variable`：指向内存的变量名。

    - `parameter_list`：用于变量的初始化值列表。


    `new` 运算符不需要使用 `sizeof()` 运算符来分配内存。它还允许在构建对象时创建足够的内存。它是一种在声明时调用函数初始化对象的构造。


    由于 `new` 运算符在堆中分配内存，如果在尝试分配时不可用，则会抛出异常。如果我们的代码无法处理该异常，应用程序将意外终止。


