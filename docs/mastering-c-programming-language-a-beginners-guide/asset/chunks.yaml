    on sized integers in C.


    ## C++ NUMERIC DATA TYPES


    C++ is a fundamental programming language that unusually uses numeric data types.
    Integers and floating points are two different kinds of numeric data. Whole numbers
    are integers, while decimal points are floating points.


    ### Types of Primitive Data


    These data types are built-in or preset data types that may be used to declare
    variables directly by the user.


    *   Integer


    *   Character


    *   Boolean


    *   Floating Point


    *   Double Floating Point


    *   Valueless or Void


    *   Wide Character


    ### Derived Data Types


    Derived Data Types are information types that are gotten from crude or underlying
    data types. They are separated into four classifications:


    1.  Function


    2.  Array


    3.  Pointer


    4.  Reference


    ### User-Defined Data Types


    These are data types that the user defines. As an example, in C++, declaring a
    class or a structure. The following user-defined datatypes are available in C++:


    *   Class


    *   Structure


    *   Union


    *   Enumeration


    *   Typedef defined DataType


    ### C++ Provides the Following Primitive Data Types


    *   **Integer:** Integer data types are described by the keyword int. Integers
    have a range of –2,147,483,648 to 2,147,483,647 and take up 4 bytes of memory.


    *   **Character:** Characters are stored using the data type character. The keyword
    for the character data type is char, and characters range from –128 to 127 or
    0 to 255, taking up 1 byte of RAM on average.


    *   **Boolean:** True or false can be saved in a boolean variable, which uses
    the boolean data type to hold logical or boolean values. The keyword for the boolean
    data type is bool.


    *   **Floating Point:** The Floating Point data type stores floating point or
    decimal numbers with single precision. The keyword float is used to describe the
    floating-point data type. Float variables usually take up 4 bytes of memory.


    *   **Double Floating Point:** The Double Floating Point data type stores floating
    point or decimal numbers with double precision. The keyword double is used to
    describe the double floating-point data type. Double variables usually take up
    8 bytes of memory.


    *   **Void:** The term void refers to something that has no worth. The void datatype
    represents a valueless entity.


    ### User-Defined Literals'' Objectives


    Only the “interesting” categories of literals can have user-defined literals:
    integral numbers, floating-point numbers, characters, and character strings. New
    literal types can be defined (it is not possible to specify new literal prefixes).
    As stated in the proposals, the Committee''s primary aims were to provide a mechanism
    for describing new literal types using the Standard Library rather than expanding
    the core language. It looks that changing the Standard Library is less complicated.
    The Committee intends to utilize this tool to add any literals introduced to C
    or standard C extensions or planned to be added in the future. A decimal floating-point
    literal, such as 10.2df, is one such example. Because many new C literals require
    prefixes or syntax other than suffixes/prefixes, this aim has only been partially
    met:


    *   binary integer literals (0b11011) (offered to C but refused)


    *   0x102Ap12 is a hex floating-point literal


    *   u‘A’ is a new char literal


    The literals also served as a springboard for developing additional C++ Standard
    Library components such as arbitrary-precision integers, decimal floating-point
    numbers, fixed-point numbers, new string types, and SI units.


    While user-defined literals are primarily a tool for Standard Library designers,
    they are also available to ordinary users with restrictions.


    ### Integers


    In programming, integers are classified into three categories: short int, int,
    and long int. A short int can be any integer between –32,768 and 32,767, but a
    regular int, sometimes known as just int, has a much more extensive range, ranging
    from 2,147,483,648 to 2,147,483,647.


    It''s crucial to remember that in C++, there''s no one standard for numeric data
    types. Thus the names and range values may change somewhat depending on the implementation
    and processor.


    **Example**


    ### Decimal


    The decimal data type is a very exact numeric data type distinguished by its accuracy
    and scale.


    ### Floating Points'
