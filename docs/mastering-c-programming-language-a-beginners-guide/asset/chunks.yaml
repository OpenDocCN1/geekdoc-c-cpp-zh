    \ might be one of the following:\n\nThe `#` option forces the converter to use\
    \ the other form. For each kind, the alternative form is specified differently.\
    \ This option supports only integer and floating-point types. This option adds\
    \ the prefix `0b` (`0B`), `0`, or `0x` (`0X`) to the output value for integers\
    \ and to binary, octal, or hexadecimal output. The case of the type specifier\
    \ determines whether the prefix is lower-case or upper-case; the prefix `0x` is\
    \ used for the type `x`, whereas `0X` is used for the type `X`. The alternate\
    \ form always causes the conversion output to contain a decimal-point character,\
    \ even if no digits follow it, for floating-point values.\n\nIn most cases, a\
    \ decimal-point character only appears in the output of these conversions if a\
    \ digit follows it. Furthermore, trailing zeros are not eliminated from the result\
    \ for `g` and `G` conversions.\n\nThe decimal integer width defines the minimum\
    \ field width. If no field width is given, the content will decide the field width.\n\
    \nSign-aware zero-padding for numeric types is enabled by preceding the width\
    \ field with a zero (`0`) character. This is the same as using the fill character\
    \ `0` with the alignment type `=`.\n\nFor a floating-point value formatted with\
    \ `f` or `F`, the precision is a decimal number that indicates how many digits\
    \ should be displayed after the decimal point. A floating-point number is formatted\
    \ with `g` or `G` before and after the decimal point. The field determines the\
    \ maximum field size for non-number kinds, or how many characters will be used\
    \ from the field content. Integer, character, Boolean, and pointer values are\
    \ not permitted to be precise.\n\nFinally, the type affects how the information\
    \ is displayed.\n\nThe following string presentation types are available:\n\n\
    The following character display types are available:\n\nThe following are the\
    \ integer presentation kinds that are available:\n\nCharacter and Boolean values\
    \ can also be utilized with integer presentation types. If the presentation type\
    \ is not provided, Boolean values are presented using textual representation,\
    \ either true or false.\n\nFor floating-point values, the following presentation\
    \ formats are available:\n\nThe following are the many sorts of pointer presentations\
    \ that are available:\n\n## FORMATTING FUNCTIONS\n\n* `template <class ...Args>`\
    \ \n* **Effects:** The method returns a string object created from the format\
    \ string parameter `format str`, with each replacement field replaced with the\
    \ character representation of the argument it refers to, formatted according to\
    \ the field's specification.\n* **Returned:** The formatted string is returned.\n\
    * **Thrown:** If `format str` is not a valid format string, format error is thrown.\n\
    \n```\nstring vformat(cstring_view format_str, fmt::args args);\n```\n\n* **Effects:**\
    \ The method returns a string object created from the format string parameter\
    \ `format str`. Each replacement field is replaced with the character representation\
    \ of the argument it refers to, formatted according to the field specification.\n\
    * **Returned:** The formatted string is returned by this method.\n* **Thrown:**\
