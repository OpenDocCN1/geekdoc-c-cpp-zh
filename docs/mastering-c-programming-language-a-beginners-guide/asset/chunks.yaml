    \ in that situation, the coroutine is not suspended. In other words, a coroutine\
    \ isn't truly stopped until await_ready returns false, followed by await_suspend\
    \ (if type bool instead of void) returning true.\n\nAs a result, we create a new\
    \ awaiter type GetPromise with the property promise_type *p_. Its await suspend\
    \ function saves the address of the promise object in p_ but returns false instead\
    \ of suspending the coroutine. We've only encountered co_await expressions of\
    \ type void so far. We also add an await resume method that returns p_ since we\
    \ want our co_await to return the address of the promise object this time.\n\n\
    await_suspend can return a coroutine handle in addition to void and bool, in which\
    \ case the returned handle is instantly restarted. GetPromise::await_suspend might\
    \ have returned the handle h instead of false to continue the coroutine immediately,\
    \ but this would likely be less efficient.\n\n**Example:**"
