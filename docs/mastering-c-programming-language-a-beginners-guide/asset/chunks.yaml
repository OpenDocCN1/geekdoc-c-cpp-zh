- fmt: "\nThe usage of C++ data structures allows a programmer to mix different data\
    \ types in a group and process them as a single unit, making things more easy\
    \ and understandable.\n\nIn C++, data structures are divided into three categories.\n\
    \n1. **Simple:** In C++, these data structures are usually made up of primitive\
    \ data types like `int`, `float`, `double`, `string`, and `char`.\n2. **Compound:**\
    \ These sorts of data structures can be created by merging simple data structures.\
    \ It is further divided into two categories:\n    * **Linear data structure:**\
    \ A data structure is considered to be linear if its elements are arranged in\
    \ a logical order.\n    * **Non-linear data structure:** Multilevel data structures\
    \ are non-linear data structures.\n3. **Static and Dynamic:** Static data structures\
    \ have a constant size and structure connected with some specified memory locations\
    \ that are fixed at compilation time. For instance, consider arrays.\n\n### Data\
    \ Structures Operations\n\n* **Insertion:** Inserting a new data element into\
    \ the data structure is referred to as this operation.\n* **Deletion:** In the\
    \ data structure, delete or remove an existing data element.\n* **Traversal:**\
    \ Process and display all data pieces in the data structure using traversal.\n\
    * **Searching:** Look through the data structure for a certain data element.\n\
    * **Sorting:** Sort the data items in the data structure in ascending or descending\
    \ order, or in any other logically sequential order.\n* **Merging:** It is the\
    \ process of combining similar data pieces from two or more data structures to\
    \ create a new data structure.\n\n## OBJECT ORIENTED\n\n### Classes and Objects\
    \ in C++\n\nThe fundamental goal of C++ programming is to introduce object orientation\
    \ to the C programming language, and classes, also known as user-defined types,\
    \ are the key element of C++ that allows object-oriented programming.\n\nA class\
    \ specifies an object's form by combining data representation and methods for\
    \ changing that data into a single package. Members of a class are the data and\
    \ methods that make up the class.\n\n### Class Definitions in C++\n\nWhen you\
    \ define a class, you're essentially defining a data type's blueprint. This doesn't\
    \ specify any data, but it does define what the class name implies, that is, what\
    \ a class object will be made up of and what actions can be done on it.\n\nThe\
    \ keyword `class` is used to start a class definition, followed by the class name,\
    \ and lastly the class body, which is enclosed by a pair of curly brackets. A\
    \ semicolon or a series of declarations must come after a class definition. For\
    \ example, we used the term `class` to define the `Box` data type:\n\n**Example:**\n\
    \nThe access characteristics of the members of the class that follows it are determined\
    \ by the keyword `public`. Anywhere inside the scope of the class object, a public\
    \ member can be accessed from outside the class. You may also make a class's members\
    \ secret or protected, which we'll cover in a later section.\n\n### C++ Objects\n\
    \nA class serves as the blueprint for things, thus an object is essentially produced\
    \ from one. Objects of a class are declared in the same way as variables of fundamental\
    \ types are declared. The following statements declare two `Car` objects:\n\n\
    ### Members Having Access to Data\n\nThe direct member access operator `.` may\
    \ be used to access the public data members of a class's objects. To clarify matters,\
    \ consider the following example:\n\n**Output:**\n\nIt's crucial to know that\
    \ the direct member access operator cannot access private or protected members\
    \ (`.`). We'll discover how to gain access to secret and protected users.\n\n\
    ### Detail on Classes and Objects\n\nSo far, you've learned the fundamentals of\
    \ C++ Classes and Objects. There are a few more fascinating ideas linked to C++\
    \ Classes and Objects that we'll go over in the following sub-sections:\n\n| Sr.\
    \ No | Description |\n| --- | --- |\n| 1 | Functions of Class Members: A member\
    \ function of a class is a function that, like any other variable, has its definition\
    \ or prototype within the class declaration. |\n| 2 | Modifiers for Class Access:\
    \ A class member can be made public, private, or protected. Members are presumed\
    \ to be private by default. |\n| 3 | Constructor and Destructor: A class function\
    \ is a specific function in a class that is called when a new object of that class\
    \ is created. A destructor is a specific function that is run when an object is\
    \ created and then destroyed. |\n| 4 | Copy Constructor: The copy function is\
    \ a function that produces an object by initialising it using a previously generated\
    \ object of the same class. |\n| 5 | Friend Functions: A friend function has full\
    \ access to a class's private and protected members. |\n| 6 | Inline Functions:\
    \ In the case of an inline function, the compiler tries to extend the code in\
    \ the body of the function rather than calling it. |\n| 7 | this Pointer: Every\
    \ object has a unique pointer that refers to the actual object. |\n| 8 | Pointer:\
    \ A class pointer is created in the same manner as a structure pointer is created.\
    \ In reality, a class is nothing more than a structure containing functions. |\n\
    | 9 | Static Members: A class's data and function members can both be declared\
    \ static. |\n\n### Inheritance\n\nThe idea of inheritance is one of the most essential\
    \ in object-oriented programming. Inheritance enables us to define a class in\
    \ terms of another class, which simplifies application development and maintenance.\
    \ This also allows for the reuse of code functionality and a quick implementation\
    \ time.\n\nInstead of developing entirely new data members and member methods\
    \ when establishing a class, the programmer can specify that the new class should\
    \ inherit the members of an existing class. The current class is known as the\
    \ base class, while the new class is known as the derived class. Inheritance is\
    \ a connection that is implemented.\n\n### Base and Derived Classes\n\nA class\
    \ can be derived from several base classes, allowing it to inherit data and functionalities\
    \ from various sources. To provide the base class for a derived class, we utilize\
    \ a class derivation list. A class derivation list takes the form and names one\
    \ or more base classes.\n\nWhere base-class is the name of a previously class\
    \ and access-specifier is one of public, protected, or private. It is private\
    \ by default if the access-specifier is not used.\n\n**Example:**\n\n**Output:**\n\
    \n### Inheritance and Access Control\n\nA derived class has access to all of its\
    \ base class's non-private members. As a result, any base-class elements that\
    \ should not be available to derived class should be made private in the base\
    \ class.\n\nThe different access kinds can be summarized in the following fashion\
    \ based on who has access to them:\n\n| Access | public | protected | private\
    \ |\n| --- | --- | --- | --- |\n| Same class | yes | yes | yes |\n| Derived classes\
    \ | yes | yes | no |\n| Outside classes | yes | no | no |\n\nWith the exclusions\
    \ listed below, a derived class inherits all base class methods.\n\n* The base\
    \ class's constructors, destructors, and copy constructors.\n* The base class's\
    \ operators are overloaded.\n* The base class's friend functions.\n\n### Types\n\
    \nWhen creating a class from a base class, the base class can be inherited in\
    \ one of three ways: public, protected, or private inheritance. As previously\
    \ stated, the access-specifier specifies the type of inheritance.\n\nThe following\
    \ principles apply when utilizing various types of inheritance:\n\n* **Public\
    \ class:** When a class is derived from a public base class, the base class's\
    \ public members become public members of the derived class, and the base class's\
    \ protected members become protected members of the derived class. The private\
    \ members of a base class are never directly available from a derived class, although\
    \ they can be accessed via calls to the base class's public and protected members.\n"
