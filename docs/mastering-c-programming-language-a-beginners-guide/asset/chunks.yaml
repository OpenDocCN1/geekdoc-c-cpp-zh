  trans: "\n\n# 标准特性与非标准特性之间的区别\n\n| 标准属性 | 非标准属性 |\n| --- | --- |\n| 标准规定了它们，并且它们存在于所有编译器中。\
    \ | 编译器供应商提供这些信息，它们并不是在所有编译器中都存在。 |\n| 在没有任何警告或问题的情况下，代码是完全可移植的。 | 尽管“标准语法”中用于非标准属性的代码已变得可移植（自\
    \ C++17 起），但编译器仍会生成警告和错误。 |\n| 属性使用 `[[atr]]` 标准语法编写。 | 某些属性使用编译器特定的术语（如 `declspec()`\
    \ 或 `__attribute__`）表示，而另一些则使用非标准语法编写。 |\n| 在它的任何命名空间中都没有标准特性。 | 使用标准语法来编写非标准特性，并使用包裹它们的\
    \ `[[namespace::attr]]` 命名空间。 |\n\n## 自 C++11 以来，发生了以下变化\n\n- **忽略未知属性：** 自 C++17\
    \ 起，C++ 属性功能最重大的修改之一是编译器对未知属性的处理。如果编译器在 C++11 或 14 中无法识别某个属性，它会抛出错误并阻止代码构建。为了作为临时解决方案，程序员必须从代码中删除该属性。这在可移植性方面造成了严重问题。除了标准属性外，无法利用任何特定供应商的特性，因为代码会失败。这使得使用这些功能变得不可能。\n\
    \n  因此，标准强制所有编译器忽略它们未指定的特性。这允许程序员在代码中自由地使用特定供应商的特性，同时确保了代码的可移植性。当发现未定义的属性时，大多数\
    \ C++17 编译器现在会忽略它们并提供警告。这帮助程序员编写代码时更具灵活性，因为他们现在可以在不同的供应商命名空间中为同一个操作提供许多特性。\n\n\
    \  **示例：** // 在各自的编译器中，这些属性将生效\n  ```\n  [[msvc::deprecated]][[gnu::deprecated]]\
    \ char* gets(char* str) compilers\n  ```\n\n- **无需重复使用属性命名空间：** C++17 放宽了使用“非标准”属性的一些要求。在命名空间后缀后跟一个非标准属性就是其中一个例子。在\
    \ C++11 或 14 中将多个属性组合在一起时，每个属性都必须以前其所在的命名空间名前缀，导致如下所示的代码风格。\n\n  **示例：**\n  ```\n\
    \  [[gnu::always_inline, gnu::const, gnu::hot, nodiscard]] int g();\n  ```\n\n\
    \  观察上面的代码，它看起来臃肿且拥挤。因此，委员会同意简化组合多个属性的场景。此时，当同时使用这些属性时，程序员不需要在后续属性前缀加上命名空间。这产生了下述的代码模式，它看起来整洁且易懂。\n\
    \n  **示例：**\n  ```\n  [[using gnu:const, always_inline]] int g() {return 0;}\n\
    \  ```\n\n- **单段代码的多个属性：** 在 C++ 中，现在可以将多个属性应用于单段代码。在这种情况下，编译器将按照它们编写的顺序评估每种特性。这允许程序员创建包含许多限制条件的代码。\n\
    \n  **示例：**\n\n## C++ 与 C# 特性的区别\n\nC# 和 C++ 属性之间存在显著差异。在 C# 中派自 `System` 允许程序员指定额外的特性。与\
    \ C++ 不同（C++ 的元信息是由编译器固定的，不能用于定义新的用户自定义特性），在 C# 中，元信息不是由编译器固定的，可以用于定义新的用户自定义属性。设置这一限制是为了防止语言演变成一种会增加其复杂性的新形式。\n\
    \n## 元数据中的属性\n\n元数据特性描述了内容的凭证。这些修饰符可以改变处理材料的方式。\n\n元数据属性通常用于根据其值过滤材料。另一个常见应用是根据值对内容进行标记，例如通过高亮输出中受影响的单词。过滤通常使用\
    \ `audience`、`platform`、`product` 和其他属性，标记则使用相同特性加上 `rev` 完成。例如，将作业中的阶段指定为可选或强制性，`status`\
    \ 和 `significance` 被用于特定工具或特定转换的行为。\n\n> 通俗地说，元数据属性提供了一列表由空格分隔的一个或多个限定值。例如，`audience`\
    \ 属性管理员、程序员将材料归类为与管理员和程序员相关。\n\n针对主对象的 `audience`、`platform` 和 `product` 元数据可以使用主题（topic）元素上的属性或主题引言（topic\
    \ prologue）中的组件来表示。虽然元数据组件更具描述性，但值具有相同的含义并可以一起使用。\n\n- **audience：** 当 `audience`\
    \ 元数据元素的枚举属性值被用在内容元素的 `audience` 属性时，它们具有相同的含义。例如，“user”值无论出现在主题 `audience` 元素的\
    \ `type` 属性中还是内容元素的 `audience` 属性中，其含义都是相同的。这一概念也适用于 `audience` 元素的 `type`、`job`\
    \ 和 `experience level` 属性。\n\n  `audience` 属性的值也可以指向 `audience` 元素中对观众的更详细描述。在\
    \ `audience` 属性中引用同一个观众时，请使用来自 `audience` 元素的观众名称。`audience` 属性接受一组由空格分隔的值，可能匹配任何观众组件的名称。\n\
    \n- **platform：** 操作系统、硬件或其他环境都可以被视为平台。该属性是 `platform` 元素的对应项。\n\n  `platform`\
    \ 属性接受一组由空格分隔的值，这些可能对应于引言中 `platform` 元素的内容。\n\n- **product：** 产品名称、版本、品牌或内部代码或编号。该属性是\
    \ `prodinfo` 元素的对应项。\n\n  `product` 属性接受一组由空格分隔的值，这些可能匹配 `prodname` 元素的值。\n\n\
    - **importance：** 材料的重要性根据其优先级来衡量。该属性接受单个枚举值。\n\n- **rev：** 修订版本的唯一标识符。\n\n- **status：**内容的当前状态，该属性接受单个枚举值。\n\
    \n## 通过属性向编译器提供元数据\n\n在实现对类型或数据的反射或内省功能，以及定义语言扩展的标准程序方面，C++ 非常缺乏这些功能。因此，编译器为此目的创建了它们自己的扩展。VC++\
    \ 的 `__declspec()` 符和 GCC 的 `__attribute__(…)` 符就是两个例子。另一方面，C++11 引入了属性的概念，允许编译器以标准方式整合扩展甚至嵌入领域特定语言。新的\
    \ C++ 标准规定了一系列所有编译器必须支持的特性。\n\n### 如何操作\n\n使用标准属性为编译器提供有关各种设计目标的提示：\n\n- **为了确保函数的返回值不会被忽略，请使用\
    \ `[[nodiscard]]` 属性声明函数：**\n\n"
