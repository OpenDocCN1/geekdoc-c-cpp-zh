    ## STD::STRING


    C++ includes a method for representing a series of characters as a class object
    in its definition. `std:: string` is the name of this class. The `String` class
    holds characters as a series of bytes, with the ability to retrieve a single-byte
    character.


    Character Array vs. `std:: string`:


    * A character array is just a collection of characters that can end with a null
    character. A string is a type of object that may be represented as a continuous
    stream of characters.

    * The size of the character array must be allocated statically; if extra memory
    is necessary, it cannot be allocated at run time. In the case of a character array,
    any allocated memory that is not used is squandered. Memory is allocated dynamically
    in the case of strings. On-demand, more memory can be assigned during runtime.
    There is no memory waste since no memory is preallocated.

    * In the case of a character array, there is a risk of array decay. There is no
    array decay since strings are represented as objects.

    * Character array implementation is quicker than `std:: string` implementation.
    When compared to character arrays, strings are slower to implement.

    * There aren''t many built-in functions for manipulating strings in character
    arrays. The `String` class offers several features that enable for a variety of
    string operations.


    ### String Operations Include


    #### Functions for Input


    * `getline()`: This function stores a stream of characters entered by the user
    in object memory.

    * `push back()`: Use this method to insert a character at the end of a string.

    * `pop back()`: This method was introduced in C++11(for strings) and is used to
    remove the final character from the string.


    **Example:**


    **Output:**


    ### Functions of Capacity


    * `capacity()`: This method returns the string''s capacity, which can be equal
    to or more than the string''s size. Additional space is set aside to complete
    actions quickly when additional characters are introduced to the string.

    * `resize()`: This method alters the length of a string, allowing it to be increased
    or lowered.

    * `length()`: This method returns the string''s length.

    * `shrink to fit()`: This function reduces the string''s capacity until it is
    equal to the string''s minimal capacity. If we are certain that no more character
    additions are required, we may utilize this method to conserve memory.


    **Example:**


    **Output:**


    ### Iterator Methods


    * `begin()`: This method returns an iterator to the first character in the string.

    * `end()`: Returns an iterator to the end of the string.

    * `rbegin()`: This method returns a reverse iterator that points to the string''s
    end.

    * `rend()`: This method produces a reverse iterator that points to the start of
    the string.


    **Example:**


    **Output:**


    ### Functions Manipulation


    * `copy("char array", len, pos)`: This method copies the substring from the destination
    character array specified in the parameters. It has three arguments: a target
    char array, a length to copy, and a starting point in the string to copy from.

    * `swap()`: switches one string with another.


    **Example:**


    **Output:**


    ## LIBRARY FORMATTING


    The text formatting library is a secure and flexible replacement for the `printf`
    routines. It''s meant to work with the current C++ I/O streams library, reusing
    parts of its infrastructure like overloaded insertion operators for user-defined
    types.


    **Example:**


    Formatting options include:


    | format | description |

    | :--- | :--- |

    | `format` | In a new string, saves a structured version of the arguments |

    | `format_to` | Through an output iterator, it generates a formatted representation
    of its parameters |

    | `format_to_n` | An output iterator generates a formatted representation of its
    parameters that do not exceed the size limit |

    | `formatted_size` | specifies how many characters are required to hold the formatted
    representation of the parameters |


    **Extensibility support and implementation detail:**


    | method | description |

    | :--- | :--- |

    | `vformat` | Type-erased argument representation in a non-template version of
    `std::format` |

    | `vformat_to` | `std::format` to non-template version with type-erased argument
    representation |

    | `basic_format_arg` | a class template that gives user-defined formatters access
    to a formatting parameter |

    | `formatter` | Formatting rules for a certain type are defined by a class |

    | `basic_format_arg_context` | condition of string parser |

    | `basic_format_context` | All formatting parameters and the output iterator are
    included in the formatting state |

    | `visit_format_arg` | For user-defined formatters, an argument visitation interface
    is provided |

    | `make_format_arg` | Converts to format args a type-erased object referencing
    formatting parameters |

    | `basic_format_args` | All formatting arguments are accessible through this class
    |

    | `format_error` | Formatting problems cause an exception of this type to be thrown
    |


    Text remains one of the most common ways for people to interact with computer
    systems, despite the growth of graphical and voice user interfaces, and programming
    languages give a range of methods for text formatting.


    ## STRING SYNTAX FOR DESIGN FORMAT


    The `printf` format string syntax is perhaps the most widely used among computer
    languages, and `printf` is inherited from C++. The `printf` syntax has the advantage
    of being well-known among programmers. However, it has a number of flaws in its
    current state:


    * Many format specifiers, such as `hh`, `h`, `l`, `j`, and others, are solely
    used to communicate type information. They are unnecessary in type-safe formatting
    and would make specification and parsing excessively difficult.

    * For user-defined types, there is no standard mechanism to expand the syntax.

    * There are minor differences between various implementations. Some systems, for
    example, do not accept POSIX positional parameters.

    * It''s impossible to use “percent” in a custom format specifier, such as for
    put time-like time formatting.

