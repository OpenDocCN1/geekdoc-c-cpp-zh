  trans: "\n\nLambda 可以通过两种方式作为参数传递给函数：\n\n- STL 方法，使用模板\n- 使用 `std::function`\n\n\
    ## STL 方法，使用模板\n\n**示例：**\n\n## 使用 std::function\n\n**示例：**\n\n## 标准模板库算法 (STL\
    \ Algorithm)\n\n对于想要在竞赛编程中脱颖出的个人来说，仅仅了解 STL 容器帮助不大，除非他们了解 STL 提供的所有功能。\n\n对于任何\
    \ `<algorithm>` 库函数，STL 都提供了大量的算法：请参阅此页面获取更多信息。\n\n以下是一些最常用的向量（vector）算法，以及一些在竞赛编程中非常有用的算法：\n\
    \n### 不操作数据的算法：\n\n- 要排序提供的 vector，使用 `sort(first iterator, last iterator)`。\n\
    - 要反转一个 vector，使用 `reverse(first iterator, last iterator)`。\n- `max_element(first\
    \ iterator, last iterator)`：返回 vector 的最大元素。\n- `min_element(first iterator, last\
    \ iterator)`：返回 vector 的最小元素。\n- `accumulate(first iterator, last iterator, sum\
    \ start value)`：执行向量元素求和。\n\n  **示例：**\n\n  **输出：**\n\n- `count(first iterator,\
    \ last iterator, x)`：统计 `x` 在 vector 中出现的次数。\n- `find(first iterator, last iterator,\
    \ x)`：返回指向 vector 中 `x` 首次出现的迭代器；如果元素不在 vector 中，则返回 vector 的末尾地址（vector 的名称，`end()`）。\n\
    \n  **示例：**\n\n  **输出：**\n\n- `binary_search(first iterator, last iterator, x)`：确定\
    \ `x` 是否存在于排序后的 vector 中。\n- `lower_bound(first iterator, last iterator, x)`：返回指向范围\
    \ `[first,last]` 范围内第一个大于或等于 `x` 的元素的迭代器。\n- `upper_bound(first iterator, last\
    \ iterator, x)`：产生指向范围 `[first,last]` 范围内第一个大于“x”的元素的迭代器。\n\n  **示例：**\n\n  **输出：**\n\
    \n## 操作类算法\n\n- `arr.erase(position to be removed)`：从 vector 中删除选定的元素，并适当调整 vector\
    \ 的大小和元素位置。\n- `arr.erase(unique(arr.begin(),arr.end()),arr.end())`：这一行代码可以在排序后的\
    \ vector 中删除重复的出现项。\n\n  **示例：**\n\n  **输出：**\n\n- `next_permutation(first iterator,\
    \ last iterator)`：此函数将 vector 的排列更改为下一个排列。\n- `prev_permutation(first iterator,\
    \ last iterator)`：此函数将 vector 的排列更改为上一个排列。\n- `distance(first_iterator, desired_position)`：返回第一个迭代器与目标位置之间的距离。在查找索引时，这种方法非常方便。\n\
    \n  **示例：**\n\n  **输出：**\n\n## 可变函数\n\n可变函数接受任意数量的参数，例如 `std::printf`。\n\n参数列表后跟一个省略号（...），例如\
    \ `int printf(const char* format…);`，前面可以跟一个可选的逗号，用于声明可变函数。有关语法、自动参数转换和替代方案的更多信息，请参阅可变参数。\n\
    \n提供了以下库设施用于从函数体访问可变参数：\n\n| `va_start` | 启用对可变函数参数的访问 |\n| :--- | :--- |\n| `va_arg`\
    \ | 可变函数的下一个参数 |\n| `va_copy` (C++11) | 复制可变函数的参数 |\n| `va_end` | 可变函数参数的遍历结束\
    \ |\n| `va_list` | 包含 `va_start`、`va_arg`、`va_end` 和 `va_copy` (typedef) 需要的数据\
    \ |\n\n**语法：**\n\n**示例：**\n\n**输出：**\n\n## 表达式\n\n本节涵盖 C++ 表达式，表达式是运算符和操作数的集合，用于实现以下一个或多个目的：\n\
    \n- 操作数用于计算一个值。\n- 指定对象或函数。\n- 创建“意外之外的后果”（副作用是指求值表达式之外的任何活动，例如更改对象的值）。\n\nC++\
    \ 中的运算符可以被重载，它们的语义可以自定义。然而，它们的优先级和接受的操作数数量是不能更改的。在不考虑重载的情况下，本节讨论了语言提供的运算符的语法和语义。\n\
    \n### 各种类型的表达式\n\n#### 以下是 C++ 表达式的不同类型\n\n- **基础类型表达式**：这些是构建所有其他表达式的要素元素。\n\
    - **带有后置符号的表达式**：这些主表达式后面跟着一个运算符，例如数组下标或后置递增。\n- **一元运算符用于创建表达式**：在表达式中，一元运算符只影响一个操作数。\n\
    - **二元运算符用于创建表达式**：在表达式中，二元运算符作用于两个操作数。\n- **条件运算符用于表达式**：条件运算符是一个三元运算符，接受三个操作数，是\
    \ C++ 中唯一的三元运算符。\n- **永恒变化的表达式**：常量表达式完全由常量数据组成。\n- **类型转换在表达式中是显式的**：在表达式中，可以使用显式类型转换或“强制转换（casts）”。\n\
    - **成员指针运算符用于表达式**。\n- **强制转换**：在表达式中，可以使用类型安全的“强制转换”。\n- **运行时类型信息**：在程序执行期间，确定对象的类型。\n\
    \n### 基础表达式\n\n基础表达式是更复杂表达式的基础。它们可以是字面量、名称或带有作用域解析（::）的名称。\n\n**语法：**\n\n字面量是一个永远改变的基本表达式。其类型取决于其指定方式。有关如何指定字面量的更多信息，请参阅字面量。\n\
    \n`this` 关键字是一个类对象的引用。它可以在非静态成员函数中使用。它指向被调用的类实例。在类成员函数之外不允许使用 `this` 关键字。\n\n\
    在不显式更改的情况下，`this` 指针类型为 `type * const`（其中 type 是类名）。这种 this 成员函数的声明如下例所示：\n\n\
    **示例：**\n\n有关更改 this 类型的更多信息请见 this 指针。\n\n主表达式是域解析运算符（::）后跟一个名称。这些名称必须是全局名称而非成员名称。名称决定了表达式的种类。如果声明名称是左值（即可以出现在赋值表达式的左侧），它是左值。即使全局名称在当前作用域中被隐藏，作用域解析运算符允许引用它。\n\
    \n主表达式包含在括号内。它的类型和值与无括号表达式的类型和值相同。如果无括号表达式是左值，它是左值。\n\n### 可变模板与省略号\n\n可变模板是接受无限数量参数的类或函数模板。这种方法对于\
    \ C++ 库作者非常有利，因为它可以创建类模板和函数模板，提供广泛的类型安全且非平庸的功能和灵活性。\n\n**语法：**\n\n可变模板以两种方式使用省略号。它在参数名称左侧表示参数包（parameter\
    \ pack），并在参数名称右侧将参数包扩展为不同的名称。\n\n"
- fmt: "\nPrimary expressions or expressions in which postfix operators follow a primary\
    \ expression make up postfix expressions. The following table lists the postfix\
    \ operators.\n\n| Operator Name | Operator Notation |\n| --- | --- |\n| Subscript\
    \ | `[ ]` |\n| Function call | `( )` |\n| Explicit type conversion | `*type-name*\
    \ ( )` |\n| Member access | `.` or `->` |\n| Postfix increment | `++` |\n| Postfix\
    \ decrement | `--` |\n\n### Arguments Both Formal and Informal\n\nIn “actual arguments”,\
    \ calling programs send information to called functions. The data is accessed\
    \ by the called functions using “formal arguments”.\n\nWhen a function is invoked,\
    \ it performs the following tasks:\n\nAll actual arguments (those provided by\
    \ the caller) are assessed. There is no implied sequence in which these arguments\
    \ are processed, but before entering the function, all arguments are evaluated\
    \ and all side effects are finished.\n\nIn the expression list, each formal argument\
    \ is initialized with its real matching parameter. (In the body of a function,\
    \ a formal argument is one that is defined in the function header and utilized.)\
    \ Conversions are executed as initialized, with both standard and user-defined\
    \ conversions used to transform an actual input to the right type. The following\
    \ code illustrates the initialization process conceptually:\n\n**Syntax:**\n\n\
    **Example:**\n\n### Unary Operators in Expressions\n\nIn an expression, unary\
    \ operators affect just one operand.\n\nThe following are the unary operators:\n\
    \n*   Indirection operator `*`\n*   Address-of operator `&`\n*   Unary plus operator\
    \ `+`\n*   Unary negation operator `-`\n*   Logical negation operator `!`\n* \
