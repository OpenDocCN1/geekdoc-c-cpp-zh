  trans: "\n\n上述代码中的 `main.cpp`、`HiWorld.h` 和 `HelloWorld.cpp` 文件都是极其基础程序。我们的 `HelloWorld`\
    \ 头文件提供了一个方法 `PrintHiWorld()`，该方法在 `HelloWorld.cpp` 中实现，而 `main.cpp` 负责 `HelloWorld`\
    \ 对象的实际构造并调用其函数。\n\n- **编译：** 我们只需使用 `cl` 命令后跟所有我们想要构建的 `.cpp` 文件来编译并链接我们的应用程序。我们可以使用\
    \ `cl/c` 命令进行不链接的编译。\n- **链接：** 为了生成最终的可执行文件，我们必须在最后一个阶段链接我们的对象文件。为此，我们利用 `LINK`\
    \ 命令，后跟上新生成的对象文件。\n\n## C++ 中的预处理器指令\n\n### 预处理器指令\n\n几乎每个 C/C++ 程序开头处以井号（`#`）开头的几行都是预处理器指令。编译器在开始实际编译之前会对这些行进行预处理。换行符“n”表示这些行的结束；不需要分号\
    \ `;;` 来完成它们。\n\n预处理器指令通常用于定义宏、求值条件语句、包含源文件、使用 `pragma` 指令、调节行长度以及识别错误。\n\n我们将在下面的章节中介绍一些额外的预处理器指令：\n\
    \n- 带条件的编译\n- 行控制\n- 错误指令\n- **条件编译：** 条件编译指令有助于编译程序的指定部分，或者允许我们根据某些标准跳过编译程序的某部分。我们在上篇文章中检查了这些指令中的两个：`ifdef`\
    \ 和 `endif`。我们将在本文中讨论 `#ifndef`、`#if`、`#else` 和 `#elif`。\n\n    1. **#ifdef：**\
    \ 最简单的条件指令是 `#ifdef`。条件组是这种块的名称。如果指定了 `macroname`，则受控制的文本将包含在预处理输出中。预处理指令将包含在条件的受控制文本中。只有当条件成功时，它们才会被执行。这些可以多层堆叠，但必须完全嵌套。换句话说，最接近的\
    \ `#ifdef`（或 `#ifndef`，或 `#if`）总是会被 `#endif` 匹配。条件组不能在一个文件中开始而在另一个文件中结束。\n\n \
    \       **语法：**\n\n    2. **#ifndef：** 我们知道，如果在 `#ifdef` 指令中定义了 `macroname`，则后续语句块将正常运行；但如果没有定义，编译器将直接跳过此语句块。`#ifndef`\
    \ 指令的工作方式与 `#ifdef` 指令完全相反。如果 `#ifndef` 的宏或标识符未定义，则只有在所述宏或标识符未声明时，`#ifndef` 和\
    \ `#endif` 之间的语句块才会执行。\n\n        **语法：**\n\n    3. **#if, #else 和 #elif：** 这些指令共同工作，根据某些情况控制程序段的编译。如果\
    \ `#if` 指令的条件求值为非零，则执行紧跟在 `#if` 指令后的行组；如果 `#elif` 指令的条件求值为非零，则执行紧跟在 `#elif` 指令后的行组；否则，执行\
    \ `#else` 指令后的行。\n\n        **语法：**\n\n- 行控制 (#line)：** 当我们构建程序时，存在包含错误的风险。当编译器检测到程序中的错误时，它会告诉我们错误所在的文件名，以及错误发生的行列表和精确行号。这使得我们能够轻松地定位并纠正错误。\n\
    \n    另一方面，`#line` 指令允许我们指定在编译问题期间编译器应该显示哪些信息。\n\n    **语法：**\n\n    `number`——后续代码行将分配此数字。从该点开始，后续行的行号将逐个增加。\n\
    \n    “filename”——一个可选参数，允许我们更改将显示的名称。\n\n- 错误指令 (#error)：当编译期间在程序检测到此指令时，它会中止进程并生成一个可能作为参数提供的可选错误。\n\
    \n    **语法：**\n\n    `optional_error` 是用户指定的任何错误，如果在应用程序中发现了此指令，则会显示该错误。\n\n##\
    \ 什么是 ENABLE_IF？\n\n**使用 `std::enable_if` 使用布尔条件激活 SFINAE 是简单的。它的定义如下：**\n\n也就是说，`enable_if<true,\
    \ R>::type` 是 `R` 的别名，但 `enable_if<false, T>::type` 是格式错误的，因为它缺少类型成员 `type`。\n\
    \n**要限制模板，请使用 `std::enable_if`：**\n\n**由于歧义性，调用 `neg(1)` 将失败。然而，由于第二个重载并不是为了与整数类型一起使用的，我们可以添加：**\n\
    \n实例化 `negate<int>` 将导致替换失败。`std::is_arithmetic::value` 的值为 `false`。由于 SFINAE，这不是一个硬错误；相反，这个候选仅被从重载列表中删除了。结果，`neg(1)`\
    \ 仅限于一个可行的候选，然后被调用。\n\n### 我们应该何时利用它？\n\n请记住，`std::enable_if` 仅是 SFINAE 的辅助；它不是让其运行的根本原因。看看这两个实现类似于\
    \ `std::size` 功能的选项，一个返回容器或数组大小的 `size(arg)` 重载：\n\n**示例：**\n\n只要 `is_sizeable`\
    \ 陈述正确，这两个声明在 SFINAE 方面应该是完全相同的。\n\n#### enable_if_all/enable_if_any\n\n当模板列表中存在变量模板包时，如下代码片段所示：\n\
    \n标准库没有提供一种使用 `enable_if` 应用于所有或任何 `Args` 的直接方法。C++17 中的 `std::conjunction` 和\
    \ `std::disjunction` 函数解决了这个问题。考虑以下场景：\n\n如果我们没有 C++17，则有一些变通方法。正如对此问题的回答所示，这些方法之一是利用带有部分特化化的基类。\n\
    \n另一种，`std::conjunction` 和 `std::disjunction` 的功能可以通过非常直接的方式手动实现。在下面的示例中，我将展示如何将实现与\
