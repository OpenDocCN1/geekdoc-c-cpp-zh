    \ 小于 `<`\n    *   大于 `>`\n    *   小于或等于 `<=`\n    *   大于或等于 `>=`\n    *   等于 `==`\n\
    \    *   不等于 `!=`\n*   按位运算符\n    *   位按与 `&`\n    *   位异或 `^`\n    *   位按或 `|`\n\
    *   逻辑运算符\n    *   逻辑与 `&&`\n    *   逻辑或 `||`\n*   赋值运算符\n    *   赋值 `=`\n   \
    \ *   加法赋值 `+=`\n    *   减法赋值 `-=`\n    *   乘法赋值 `*=`\n    *   除法赋值 `/=`\n   \
    \ *   取模赋值 `%=`\n    *   左移赋值 `<<=`\n    *   右移赋值 `>>=`\n    *   位按与赋值 `&=`\n\
    \    *   位异异赋值 `^=`\n    *   位按或赋值 `|=`\n*   逗号运算符 `,`\n\n### 永不变的表达式\n\n“常量值”一词指的是不变化的值。C++\
    \ 提供了两个关键字，允许你表达并强制执行对象不应更改的想法。\n\n常量表达式——在 C++ 中，常量求值表达式对于以下声明是必要的：\n\n*   数组边界\n\
    *   在 `case` 语句中，选择器\n*   位域长度的指定\n*   枚举的初始化器\n\n在常量表达式中，只允许以下操作数：\n\n*   字面量\n\
    *   枚举常量\n*   常量表达式用于初始化指定为 `const` 的值\n*   `sizeof` 表达式\n\n## 折叠表达式 (FOLD Expressions)\n\
    \nC++11 支持变长模板。这些是具有无限数量模板参数的模板。参数包存储任意数量的内容。此外，使用 C++17，我们可以使用二进制运算符直接减少参数包。结果，你可以使用\
    \ C++ 实现 Haskell 的函数 `foldl`、`foldr`、`foldl1` 和 `foldr1`。让我们来看看如何将列表转换为值。\n\n\
    **示例：**\n\n如果所有参数都为真，两个模板 `allVar` 和 `all` 都将在编译时返回真。`AllVar` 使用了变长模板；所有变长模板都与折叠表达式结合。首先，进入\
    \ `allVar`。变量模板使用递归来评估其参数。结果，如果参数包为空，函数 `allVar` 就是边界条件。递归发生在函数模板 `allVar` 中。参数包由三个点定义。参数包支持两种操作。\n\
    \n**输出：**\n\n### 有两种选择\n\n现在让我们看看产生四种不同折叠表达式的两种重折叠表达式变体。折叠表达式起初可能很难理解。\n\n应该有一个默认值。二进制运算符决定了该值如何从右到左被减少。\n\
    \n在算法 `allVar` 和 `all` 之间存在细微差异。对于空参数包，`all` 的默认值为真。\n\n在折叠表达式中，C++17 允许 32 种二进制运算符：`+\
    \ - * / % ^ & | = < > << >> += -= *= /= %= ^= &= |= << >>`。\n\n| 运算符 | 符号 | 默认值\
    \ |\n| --- | --- | --- |\n| 逻辑与 | `&&` | 真 |\n| 逻辑或 | `||` | 假 |\n| 逗号运算符 | `,`\
    \ | 空 |\n\n必须为没有默认值的二进制运算符指定一个初始值。对于具有默认值的二进制运算符，可以设置初始值。\n\n如果省略号在左侧，参数包将从左侧处理。右侧也是如此。这取决于是否存在起始值。\n\
