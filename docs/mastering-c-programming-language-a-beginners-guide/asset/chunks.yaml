    \ kinds since precise value types are implementation-defined.\n* **Complexity:**\
    \ The number of potential values types of a formatting argument has no impact\
    \ on the callable object's invocation.\n\nExample:\n\n## CLASS TEMPLATE arg_store\n\
    \n* `template <class Context, class ...Args>`\nFormatting parameters or references\
