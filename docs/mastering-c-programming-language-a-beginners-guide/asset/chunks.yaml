    ### PERFORMANCE


    The performance of the formatting library was taken into consideration when it
    was created. It aims to keep the number of virtual function calls and dynamic
    memory allocations per formatting operation as low as possible. It should be feasible
    to eliminate them entirely by using an appropriate API if formatting output can
    fit within a fixed-size buffer created on the stack.


    To this purpose, the `fmt::basic buffer` template is used to represent a buffer
    abstraction. A buffer is a continuous piece of memory that may be accessed directly
    and can increase in size if necessary. During formatting, just one virtual function,
    `grow()`, has to be called, and it''s only when the buffer isn''t big enough.


    Locale-independent formatting is also more efficient to implement than locale-aware
    formatting. However, rather than improving performance, the former''s primary
    objective is to serve certain use cases.


    ### BINARY FOOTPRINT


    Each formatting function that utilizes variadic templates is a tiny inline wrapper
    over its non-variadic equivalent to reducing binary code size. This wrapper uses
    `fmt::make_args` to construct an object representing an array of argument references,
    then calls the non-variadic function to perform the real job. The format variadic
    function, for example, uses the `vformat` variable.


    If the number of arguments is minimal, several argument-type codes can be merged
    and given as a single integer to a formatting function. Because the kinds of arguments
    are known at build time, this can be an integer constant for which no code is
    written except to store it according to calling conventions.


    This will produce a compact per-call binary code that sets argument pointers and
    packed type codes on the stack and executes a formatting function, assuming a
    decent optimizing compiler.


    ### NULL-TERMINATED STRING VIEW


    Instead of using a basic string view, the formatting library utilizes a basic
    `cstring view`, which is a null-terminated string view. The code is somewhat smaller
    and faster because the string size, which isn''t utilized, doesn''t have to be
    computed and provided. It''s also easier to parse with a termination character.


