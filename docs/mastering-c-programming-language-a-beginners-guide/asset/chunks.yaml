  trans: "\n除 ‘{’ 或 ‘}’ 的任何字符都可以用作填充字符。填充字符之后的字符必须是可能的对齐选项之一，它指示一个填充字符。如果 `format-spec`\
    \ 的第二个字符不是有效的对齐选项，则假设填充字符和对齐选项均缺失。\n\n以下是各种对齐选项的定义：\n\n除非指定了最小字段宽度，否则字段宽度始终与用于填充它的数据相同；因此，在这种情况下对齐选项是无关的。\n\
    \n只有数字类型具有 `sign`（符号）选项，它可能是以下之一：\n\n`#` 选项强制转换器使用另一种形式。对于每种类型，替代形式的指定方式均不同。此选项仅支持整数和浮点类型。此选项为整数以及二进制、八进制或十六进制输出的输出值添加前缀\
    \ `0b` (`0B`)、`0` 或 `0x` (`0X`)。类型说明符的大小写决定了前缀是小写还是大写；前缀 `0x` 用于类型 `x`，而 `0X`\
    \ 用于类型 `X`。对于浮点值，替代形式始终会导致转换输出包含一个小数点，即使其后没有数字。\n\n在大多数情况下，只有当其后有数字时，这些转换的输出中才会出现小数点。此外，对于\
    \ `g` 和 `G` 转换，结果不会消除尾零。\n\n十进制整数宽度定义了最小字段宽度。如果没有给出字段宽度，将由内容决定字段宽度。\n\n通过在宽度字段前加上零（`0`）字符，可以启用数字类型的符号感知性零填充。这与使用对齐类型\
    \ `=` 的填充字符 `0` 相同。\n\n对于使用 `f` 或 `F` 格式化的浮点值，精度是一个小数，表示小数点后应显示多少位数字。浮点数用 `g`\
    \ 或 `G` 格式化时，小数点前后都会处理。字段决定了非数字类型的最大字段大小，或者将使用字段内容中的多少字符。整数、字符、布尔值和指针值不允许指定精度。\n\
    \n最后，类型影响信息的显示方式。\n\n支持以下字符串表示类型：\n\n支持以下字符显示类型类型：\n\n以下是可用的整数表示种类：\n\n字符和布尔值也可以用于整数表示类型。如果未提供表示类型，布尔值将使用文本表示，即\
    \ true 或 false。\n\n对于浮点值，可用以下表示格式：\n\n以下是可用的多种指针表示：\n\n## 格式化函数\n\n* `template\
    \ <class ...Args>` \n* **效果：** 该方法返回一个由格式字符串参数 `format str` 创建的字符串对象，每个替换字段都被替换为它所引用参数的字符表示，并根据字段规范进行格式化。\n\
    * **返回：** 返回格式化后的字符串。\n* **异常：** 如果 `format str` 不是有效的格式字符串，则抛出格式错误。\n\n```\n\
    string vformat(cstring_view format_str, fmt::args args);\n```\n\n* **效果：** 该方法返回一个由格式字符串参数\
    \ `format str` 创建的字符串对象。每个替换字段都被替换为它所引用参数的字符表示，并根据字段规范进行格式化。\n* **返回：** 此方法返回格式化后的字符串。\n\
    * **异常：** 如果 `format str` 不是有效的格式字符串，将抛出格式错误。\n\n## 格式化参数\n\n类型为 `basic_arg<Context>`\
    \ 的对象表示基于格式化上下文参数化的格式化参数。它可以存储以下类型的值之一：\n\n其中 `Char` 表示 `Context::char` 类型。该值可以使用下一节的访问接口获取。\n\
    \n* `basic_arg();`\n* **效果：** 创建一个不引用参数的 `basic_arg` 对象。\n* **后置条件：** `!(*this)`。\n\
    * **返回：** 如果 `*this` 与参数相关，则为真；否则为假。\n\n* `bool is_integral() const;`\n* **返回：**\
    \ 如果 `*this` 代表整数类型参数，则为真。\n\n* `bool is_numeric() const;`\n* **返回：** 如果 `*this`\
    \ 代表数字类型参数，则为真。\n\n* `bool is_pointer() const;`\n* **返回：** 如果 `*this` 代表类型为 `const\
    \ void*` 的参数，则为真。\n* **复杂度：** 格式化参数的潜在值类型数量不影响 `is_integral`、`is_numeric` 和 `is_pointer`\
    \ 的调用。\n\n## 格式化参数访问\n\n* `template <class Visit, class Cont>`\n* **要求：** 对于格式化参数所有可能值类型，效果部分中的表达式必须是相同类型的有效表达式，否则程序将是格式错误的。\n\
    * **效果：** 允许值为格式化参数 arg 的值。`INVOKE(forward(vis), value);` 返回结果。\n* **备注：** 返回类型是效果部分中所有\
    \ `INVOKE` 表达式共同的类型。访问器应该利用类型特征来管理各种类型，因为精确的值类型是由实现定义的。\n* **复杂度：** 格式化参数的潜在值类型数量不影响可调用对象的调用。\n\
    \n示例：\n\n## 类模板 arg_store\n\n* `template <class Context, class ...Args>`\n格式化参数或对它们的的引用存储在类型为\
    \ `arg_store` 的对象中。\n\n## 类模板 basic_args\n\n* `template <class Context>`\n通过 `basic_args`\
    \ 对象提供对存储参数的访问。当 `basic_args` 对象被复制时，参数不会被复制。\n\n* `basic_args() noexcept;`\n\
    * **效果：** 构建一个空的 `basic_args` 对象。\n* **后置条件：** `!(*this)[0]`。\n\n* `template <class\
    \ ...Args>`\n* **效果：** 构建一个允许你访问存储参数的 `basic_args` 对象。\n\n* `basic_arg<Context>\
    \ operator[](size_type i) const;`\n* **要求：** `i <=` basic_args 对象表示的格式参数数量。\n\
    * **返回：** 如果 `i` 是参数索引，则返回表示索引 `i` 的 `basic_arg` 对象。否则返回一个空的 `basic_arg` 对象。\n\
    \n## 模板 make_args\n\n* `template <class ...Args>`\n* **效果：** 该方法返回一个包含 args 指针或副本的\
    \ `arg_store` 对象。\n* **返回：** 使用格式化参数创建 `arg_store` 对象。\n\n## 格式化上下文\n\n* `template\
    \ <class Char>`\nbasic_context 是一个自定义类型格式化上下文，提供了对格式化参数以及格式字符串当前解析位置的访问。\n\n*\
    \ `basic_context(const Char* format_str, args_type args);`\n构建一个包含格式化参数指针和格式字符串的基础对象。\n\
    * **后置条件：** `ptr() == format_str`。\n\n* `const Char*& ptr();`\n作为指针返回当前解析的格式字符串的位置。\n\
    \n* `args_type args() const;`\n返回提供给 `basic_context` 函数的 `args` 副本。\n\n## 格式化缓冲区\n\
    \n* `template <class Char>`\n\n## 格式字符串\n\n* `template <class Char>`\n\n## 自定义类型\n\
    \n如果格式字符串引用了自定义类型对象，例如：\n\n`buf, x, ctx` 其中 `buf` 是格式化缓冲区的引用，`x` 是常量引用，`ctx` 是格式化上下文的引用。在解析后的格式字符串中，`ptr()`\
    \ 将指向以下位置之一：\n\n* 当前参数格式规范之前的 `‘:’`\n* 如果不存在格式规范，则指向 `‘}’。\n\n"
- fmt: "\nThe `format` value function should read `format-spec`, format the argument,\
    \ and advance `ctx.ptr()` to `“`, which terminates the current argument's replacement\
    \ field.\n\n## ERROR REPORTING\n\nThe `format_error` class specifies the kind\
    \ of objects thrown as exceptions when the formatting library encounters an error.\n\
    \nIn this chapter, we have learned how to convert data between numeric and string\
    \ types, the limits and other properties of numeric types, and how to create cooked\
    \ and raw user-defined literals. We also learnt how to develop a library of string\
