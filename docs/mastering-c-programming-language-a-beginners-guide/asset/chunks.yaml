    ### Data Abstraction


    Data abstraction refers to simply exposing important information to the outer
    world while hiding background details, i.e. to represent the needed information
    in a programme without displaying the intricacies.


    Data abstraction is a programming approach in which the interface and implementation
    are separated.


    Take, for example, a television, which you can turn on and off, change the channel,
    adjust the volume, and add external components such as speakers, DVD players,
    but you have no idea how it receives signals over the air or through a cable,
    how it translates them, and finally displays them on the screen.


    As a result, we can argue that a television clearly isolates its internal implementation
    from its exterior interface, allowing you to interact with its interfaces such
    as the power button, channel changer, and volume control without knowing anything
    about its internals.


    Classes in C++ enable a high level of data abstraction. They expose enough public
    methods to the outside world to allow them to experiment with the object''s functionality
    and change object data, i.e. state, without having to know how the class is built
    inside.


    Your application, for example, can call the `sort()` method without knowing what
    algorithm the function uses to sort the input data. In reality, the actual implementation
    of the sorting feature may change between library releases, but your function
    call will still work as long as the interface remains the same.


    **Example:**


    You don''t need to know how `cout` displays text on the user''s screen in this
    case. You just need to understand the public interface; the underlying implementation
    of `cout` can be changed at any time.


    #### Data Abstraction''s Advantages


    Data abstraction has two major advantages.


    1. Inadvertent user-level mistakes that might damage the object''s state are shielded
    from class internals.

    2. Without requiring changes to user-level code, the class implementation may
    develop over time in response to new needs or problem reports.


    The class author is able to alter the data by defining data members only in the
    private part of the class. If the implementation changes, all that has to be done
    is look at the class code to determine what impact the change could have. Any
    function that directly accesses the data members of the previous representation
    may be broken if the data is public.


    Data abstraction may be seen in any C++ program that implements a class with public
    and private members.


    **Example:**


