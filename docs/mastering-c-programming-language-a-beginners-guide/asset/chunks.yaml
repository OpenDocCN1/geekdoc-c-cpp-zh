    \ it to a std::coroutine_handle<>. The promise type& that we require will be returned\
    \ by the function promise() on this coroutine handle.\n\n#### How May a Coroutine\
    \ Acquire Its Promise Object Within Counter?\n\nRemember how the Awaiter object\
    \ in our first example saved a copy of the coroutine handle for main1? Within\
