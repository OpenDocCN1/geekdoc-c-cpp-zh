  \n类作者能够通过仅在类的私有部分定义数据成员来更改数据。如果实现发生变化，只需要查看类代码以确定更改可能产生的影响。如果数据是公共的，任何直接访问之前的表示中的数据成员的函数都可能会损坏。\n\
