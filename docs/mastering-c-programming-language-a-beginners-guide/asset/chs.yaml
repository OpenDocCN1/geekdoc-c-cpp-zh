  * `swap()`：交换两个字符串。\n\n**示例：**\n\n**输出：**\n\n## 库格式化\n\n文本格式化库是 `printf` 过程的安全且灵活的替代方案。它旨在与当前的\
  \ C++ I/O 流库配合使用，重用其部分基础设施，例如用于自定义类型的重载插入运算符。\n\n**示例：**\n\n格式化选项包括：\n\n| format\
  \ | 描述 |\n| :--- | :--- |\n| `format` | 在新字符串中保存参数的结构化版本 |\n| `format_to` | 通过输出迭代器生成参数的格式化表示\
  \ |\n| `format_to_n` | 输出迭代器生成不超出大小限制的参数的格式化表示 |\n| `formatted_size` | 指定容纳参数格式化表示所需的字符数\
  \ |\n\n**扩展性支持和实现细节：**\n\n| method | 描述 |\n| :--- | :--- |\n| `vformat` | 非模板版本\
  \ `std::format` 中的类型擦除参数表示 |\n| `vformat_to` | 带有类型擦除参数表示的非模板版本 `std::format` |\n\
  | `basic_format_arg` | 一种类模板，允许用户自定义的格式化器访问格式化参数 |\n| `formatter` | 特殊类型的格式化规则由类定义\
  \ |\n| `basic_format_arg_context` | 字符串解析器的状态 |\n| `basic_format_context` | 所有格式化参数和输出迭代器都包含在格式化状态中\
  \ |\n| `visit_format_arg` | 为自定义格式化器提供了访问接口 |\n| `make_format_arg` | 将引用格式参数的对象转换为格式参数\
  \ |\n| `basic_format_args` | 可以通过此类访问所有格式参数 |\n| `format_error` | 格式化问题会抛出此类异常 |\n\
  \n尽管图形界面和语音用户界面日益增长，文本仍然是人与计算机交互的最常见方式之一，编程语言提供了多种文本格式化方法。\n\n## 设计格式语法\n\n`printf`\
  \ 格式字符串语法可能是计算机语言中最广泛的，它继承自 C。`printf` 语法的优势在于广为人知。然而，它在目前的状态存在许多缺陷：\n\n* 许多格式说明符（如\
  \ `hh`、`h`、`l`、`j` 等）仅用于传递类型信息。在类型安全的格式化中这些是不必要的，并且使规范和解析变得异常。\n* 对于自定义类型，没有标准的扩展机制。\n\
  * 各种实现之间存在细微差异。例如，某些系统不支持 POSIX 位置参数。\n* 在自定义格式说明符中无法使用“百分号”，例如用于时间类时间的格式化。\n\n\n\
  \n\n虽然在保持与原始 `printf` 格式高度相似的同时解决这些问题是可行的，但这将破坏兼容性，并且对于用户来说可能比创建一个新语法更令人困惑。\n\n\
  ### 一些优势包括\n\n* 一种一致且易于理解的微语言，重点关注格式化而非类型信息。\n* 用户定义类型的可扩展性，以及支持从位置传递自定义格式字符串参数。\n\
  * 同时支持特定区域（locale）的格式和与区域无关的格式。\n* 格式化改进包括更好的对齐控制、填充字符和二进制格式。\n\n该语法具有足够的表达性，允许对大多数\
  \ `printf` 格式字符串进行自动转换。下表显示了 `printf` 与新语法之间的关系。\n\n| printf | new |\n| --- | ---\
  \ |\n| – | < |\n| + | + |\n| *space* | *space* |\n| # | # |\n| 0 | 0 |\n| hh | unused\
  \ |\n| h | unused |\n| l | unused |\n| ll | unused |\n| j | unused |\n| z | unused\
  \ |\n| t | unused |\n| L | unused |\n| c | s (optional) |\n| s | s (optional) |\n\
