  \n8. **expects:** 它定义了为了运行函数而参数必须满足的条件（合约的形式）。\n\n  **语法：**\n\n\n\n\n\n# 标准特性与非标准特性之间的区别\n\
  \n| 标准属性 | 非标准属性 |\n| --- | --- |\n| 标准规定了它们，并且它们存在于所有编译器中。 | 编译器供应商提供这些信息，它们并不是在所有编译器中都存在。\
  \ |\n| 在没有任何警告或问题的情况下，代码是完全可移植的。 | 尽管“标准语法”中用于非标准属性的代码已变得可移植（自 C++17 起），但编译器仍会生成警告和错误。\
  \ |\n| 属性使用 `[[atr]]` 标准语法编写。 | 某些属性使用编译器特定的术语（如 `declspec()` 或 `__attribute__`）表示，而另一些则使用非标准语法编写。\
  \ |\n| 在它的任何命名空间中都没有标准特性。 | 使用标准语法来编写非标准特性，并使用包裹它们的 `[[namespace::attr]]` 命名空间。\
  \ |\n\n## 自 C++11 以来，发生了以下变化\n\n- **忽略未知属性：** 自 C++17 起，C++ 属性功能最重大的修改之一是编译器对未知属性的处理。如果编译器在\
  \ C++11 或 14 中无法识别某个属性，它会抛出错误并阻止代码构建。为了作为临时解决方案，程序员必须从代码中删除该属性。这在可移植性方面造成了严重问题。除了标准属性外，无法利用任何特定供应商的特性，因为代码会失败。这使得使用这些功能变得不可能。\n\
  \n  因此，标准强制所有编译器忽略它们未指定的特性。这允许程序员在代码中自由地使用特定供应商的特性，同时确保了代码的可移植性。当发现未定义的属性时，大多数 C++17\
  \ 编译器现在会忽略它们并提供警告。这帮助程序员编写代码时更具灵活性，因为他们现在可以在不同的供应商命名空间中为同一个操作提供许多特性。\n\n  **示例：**\
  \ // 在各自的编译器中，这些属性将生效\n  ```\n  [[msvc::deprecated]][[gnu::deprecated]] char* gets(char*\
  \ str) compilers\n  ```\n\n- **无需重复使用属性命名空间：** C++17 放宽了使用“非标准”属性的一些要求。在命名空间后缀后跟一个非标准属性就是其中一个例子。在\
  \ C++11 或 14 中将多个属性组合在一起时，每个属性都必须以前其所在的命名空间名前缀，导致如下所示的代码风格。\n\n  **示例：**\n  ```\n\
  \  [[gnu::always_inline, gnu::const, gnu::hot, nodiscard]] int g();\n  ```\n\n \
  \ 观察上面的代码，它看起来臃肿且拥挤。因此，委员会同意简化组合多个属性的场景。此时，当同时使用这些属性时，程序员不需要在后续属性前缀加上命名空间。这产生了下述的代码模式，它看起来整洁且易懂。\n\
  \n  **示例：**\n  ```\n  [[using gnu:const, always_inline]] int g() {return 0;}\n \
  \ ```\n\n- **单段代码的多个属性：** 在 C++ 中，现在可以将多个属性应用于单段代码。在这种情况下，编译器将按照它们编写的顺序评估每种特性。这允许程序员创建包含许多限制条件的代码。\n\
  \n  **示例：**\n\n## C++ 与 C# 特性的区别\n\nC# 和 C++ 属性之间存在显著差异。在 C# 中派自 `System` 允许程序员指定额外的特性。与\
  \ C++ 不同（C++ 的元信息是由编译器固定的，不能用于定义新的用户自定义特性），在 C# 中，元信息不是由编译器固定的，可以用于定义新的用户自定义属性。设置这一限制是为了防止语言演变成一种会增加其复杂性的新形式。\n\
  \n## 元数据中的属性\n\n元数据特性描述了内容的凭证。这些修饰符可以改变处理材料的方式。\n\n元数据属性通常用于根据其值过滤材料。另一个常见应用是根据值对内容进行标记，例如通过高亮输出中受影响的单词。过滤通常使用\
  \ `audience`、`platform`、`product` 和其他属性，标记则使用相同特性加上 `rev` 完成。例如，将作业中的阶段指定为可选或强制性，`status`\
  \ 和 `significance` 被用于特定工具或特定转换的行为。\n\n> 通俗地说，元数据属性提供了一列表由空格分隔的一个或多个限定值。例如，`audience`\
  \ 属性管理员、程序员将材料归类为与管理员和程序员相关。\n\n针对主对象的 `audience`、`platform` 和 `product` 元数据可以使用主题（topic）元素上的属性或主题引言（topic\
  \ prologue）中的组件来表示。虽然元数据组件更具描述性，但值具有相同的含义并可以一起使用。\n\n- **audience：** 当 `audience`\
  \ 元数据元素的枚举属性值被用在内容元素的 `audience` 属性时，它们具有相同的含义。例如，“user”值无论出现在主题 `audience` 元素的\
  \ `type` 属性中还是内容元素的 `audience` 属性中，其含义都是相同的。这一概念也适用于 `audience` 元素的 `type`、`job`\
  \ 和 `experience level` 属性。\n\n  `audience` 属性的值也可以指向 `audience` 元素中对观众的更详细描述。在 `audience`\
  \ 属性中引用同一个观众时，请使用来自 `audience` 元素的观众名称。`audience` 属性接受一组由空格分隔的值，可能匹配任何观众组件的名称。\n\
  \n- **platform：** 操作系统、硬件或其他环境都可以被视为平台。该属性是 `platform` 元素的对应项。\n\n  `platform` 属性接受一组由空格分隔的值，这些可能对应于引言中\
  \ `platform` 元素的内容。\n\n- **product：** 产品名称、版本、品牌或内部代码或编号。该属性是 `prodinfo` 元素的对应项。\n\
  \n  `product` 属性接受一组由空格分隔的值，这些可能匹配 `prodname` 元素的值。\n\n- **importance：** 材料的重要性根据其优先级来衡量。该属性接受单个枚举值。\n\
  \n- **rev：** 修订版本的唯一标识符。\n\n- **status：**内容的当前状态，该属性接受单个枚举值。\n\n## 通过属性向编译器提供元数据\n\
  \n在实现对类型或数据的反射或内省功能，以及定义语言扩展的标准程序方面，C++ 非常缺乏这些功能。因此，编译器为此目的创建了它们自己的扩展。VC++ 的 `__declspec()`\
  \ 符和 GCC 的 `__attribute__(…)` 符就是两个例子。另一方面，C++11 引入了属性的概念，允许编译器以标准方式整合扩展甚至嵌入领域特定语言。新的\
  \ C++ 标准规定了一系列所有编译器必须支持的特性。\n\n### 如何操作\n\n使用标准属性为编译器提供有关各种设计目标的提示：\n\n- **为了确保函数的返回值不会被忽略，请使用\
  \ `[[nodiscard]]` 属性声明函数：**\n\n\n\n\n\n*   或者，我们也可以使用 `[[nodiscard]]` 属性将枚举和类指定为函数的返回类型；在这种情况下，任何产生此类类型的函数返回值都无法被忽略：\n\
  *   使用 `[[deprecated]]` 属性声明认为已弃的函数或类型，以确保在它们被使用时编译器会发出警告：\n*   使用 `[[may_unused]]`\
  \ 属性防止编译器为未使用的变量发出警告：\n*   使用 `[[fallthrough]]` 属性防止编译器对 `switch` 语句中刻意的贯穿（fall-through）分支标签标记警告：\n\
  \n### 它是如何工作的？\n\n属性是 C++ 中一个非常多用途的元素；它们几乎可以于任何地方，但其具体用法是针对每个属性决定的。类型、函数、变量、名称、代码块以及整个翻译单元都可能从中获益。\n\
  \n属性使用双方括号给出（例如，`[[attrl]]`），一个声明可以有多个属性（例如，`[[attr1, attr2, attr3]]`）。\n\n属性可以带有参数，例如\
  \ `[[mode(greedy)]]`，它们也可以是完全限定的，例如 `[[sys::hidden]]` 或 `[[using sys::visibility(hidden),\
  \ debug]]`。\n\n属性不能存在命名命名空间中；但它们可以作为单行声明出现在命名空间中的任何地方。在这个示例中，属性是应用于下一个声明、命名空间还是翻译单元，取决于每个属性的独特性：\n\
  \n在现有的 C++ 编程书籍和教程中，属性经常被忽略或仅简要提及，这可能是因为开发者实际上无法真正使用它们。\n\n在目前的 C++ 编程书籍和教程中，属性经常被忽视或仅简要提及，这很可能是因为开发者无法创建属性，因为这项语言特性是为编译器实现设计的。在某些编译器中，可能定义用户提供的特性；其中一个编译器是\
  \ `GCC`，它提供了插件来为编译器带来更多功能，并可能也用于构建新属性。然而，标准规定了所有编译器都必须支持的特性，了解如何使用它们可以帮助我们编写更好的代码。其中一些特性已在前一节的示例中得到演示。不同版本的标准定义了这些属性：\n\
  \n#### 在 C++11 中：\n*   具有 `[[noreturn]]` 属性的函数不返回。\n*   `[[carries dependency]]`\
  \ 属性指定在 release-consume `std::memory_order` 下，依赖链在函数内部和外部传播，允许编译器省略多余的内存屏操作。\n\n\
  #### 在 C++14 中：\n*   属性 `[[deprecated]]` 和 `[[deprecated(\"reason\")]]` 表示用这些属性属性声明的对象已弃用，不应被使用。这些属性表示用这些属性指定的实体已弃用，且不应再被使用。类、非静态数据成员、类型定义、函数、枚举和模板特化都可以从这些特性中获益。原因字符串是一个可以留空的参数。\n\
  \n#### 在 C++17 中：\n*   `[[fallthrough]]` 属性表示 `switch` 语句跨标签的贯穿是刻意为之。该属性必须放置在 case\
  \ 标签之前的单独行中。\n*   `[[nodiscard]]` 属性指定函数的返回值不能被忽略。\n*   `[[maybe_unused]]` 属性表示对象可能未未使用，但编译器不应发出警告。变量、类、非静态数据成员、枚举、枚举器和类型定义都可以具有此特性。\n\
  \n这标志着我们本章的结束。在下一章中，我们将注意力转向 C++ 中的协程。\n\n# 第 7 章协程与惰性生成器\n\nDOI: [10.1201/9781003214762-7](https://doi.org/10.1201/9781003214762-7)\n\
  \n## 本章内容\n\n*   协程抽象\n*   C++ 中的协程\n*   生成器\n*   性能\n*   使用协程进行异步编程\n\n在本章中，我们将涵盖什么是\
  \ C++ 协程、它们具有什么限制、如何执行它们，以及当一个开始运行时会发生什么。我们还将发现堆分配（Heap allocation）和承诺（promises）是什么。协程在计数内部获取其承诺对象的最佳方法是什么。我们将在在本节介绍\
  \ `co_await()`、`co_yield` 和 `co_return` 运算符。我们还将学习什么是生成器，以及许多生成器、协程以及用于高效异步的 C++。\n\
  \n## 什么是 C++ 协程？\n\n协程是可以在保持状态的同时被挂起和恢复的函数。在 C++ 中，函数的演进更进了一步。我在 C++20 中提出的新概念其实非常古老。“协程”（coroutine）一词是由\
  \ Melvin Conway 创造的。1963 年，他在关于构建编译器的论文中使用了这个词。根据 Donald Knuth 的说法，过程是协程的子集。协程可以在稍后时间挂起并重启的函数。协程是无栈的，因为它们在挂起执行后会返回给调用者，而恢复执行所需的数据独立于栈保存。这使得异步顺序代码（例如，处理非阻塞\
  \ I/O 而无需显式回调）以及惰性计算无限序列和其他应用成为可能。\n\nC++20 通过新关键字 `co_await` 和 `co_yield` 为 C++\
  \ 函数的执行引入了两个新想法。\n\n使用 `co_await` 表达式可以暂停和重启表达式的执行。当在函数中使用 `co_await` 表达式时，如果函数的结果不可用，则调用\
  \ `auto getResult = func()` 不会阻塞。我们拥有了资源友好的等待，而不是消耗资源的阻塞。\n\n可以使用 `co_yield` 表达式编写生成器函数。每次调用生成器函数时，都会返回一个新值。生成器函数是一种数据流，可用于选择值。数据流是无限的。结果是，我们处于惰性求之中。\n\
  \n协程是可以互相调用的但不共享栈的函数，允许它们随时挂起执行以进入不同的协程。C++20 协程是以 C++ 真正的精神实现的，像是一块埋在成堆垃圾背后的可爱微小金块，我们必须穿过这些垃圾才能到达有趣的部分。我们对这种设计并不满意，因为最近的语言更新都做得更优雅，但协程不是。\n\
  \n协程变得更加复杂，因为 C++ 标准库没有提供访问协程所需的垃圾堆，所以我们必须自己创建并穿过它。\n\nFuture（未来）和 promise（承诺）被广泛用于解释甚至指定\
  \ C++ 协程，这是需要注意的。C++ `<future>` 头文件中的 `std::future` 和 `std::promise` 类型与这些词无关。具体而言，对于协程承诺对象，`std::promise`\
  \ 不是一个可接受的类型。\n\n### co_await\n\n现在这些这些之后，C++20 为我们提供了一个名为 `co_await` 的新运算符。通常，公式\
  \ `co_await a;` 执行以下操作：\n\n*   确保当前函数（必须是协程）将所有局部变量保存到堆分配的对象中。\n*   创建一个可调用对象，该对象在调用时会在评估\
  \ `co_await` 语句的地方恢复协程的执行。\n*   调用（或者说跳转到）`co_await` 目标对象 `a` 的一个方法，并将步骤 2 中的可调用对象传递给该方法。\n\
  \n\n\n\n步骤 3 中的过程在返回时不会将控制权归还给协程。当步骤 2 中的可调用对象被触发时，协程将继续运行。如果我们使用的语言支持带有当前延续（contin）的调用，或者我们研究过\
  \ Haskell 的 `Cont` Monad，那么步骤 2 中的可调用对象就类似于延续（continuation）。\n\n如果一个函数的定义实现了以下任意操作，它\
  \ 就是一个协程：\n\n* 使用 `co_await` 操作符来挂起执行，直到其重启。\n  **语法：**\n\n* `co_yield` 是一个关键字，用于挂起执行并返回一个值。\n\
  \  **语法：**\n\n* `co_return` 是一个关键字，用于完成执行并返回一个值。\n  **语法：**\n\n### 限制\n\n协程中不允许使用变长参数、简单的返回语句和占位符返回类型（`auto`\
  \ 或 `concept`）。\n\n`constexpr` 函数、构造函数、析构函数或主函数中不允许使用协程。\n\n### 执行\n\n* **每个协程都与以下内容相关联：**\n\
  \    * 在协程内部对承诺对象（promise objects）进行操作。协程使用此对象来提交其结果或异常。\n    * 在协程外部对协程句柄进行操作。这是一个非所有权的句柄，用于恢复协程执行或销毁协程帧。\n\
  \n* 协程状态是一个在堆上分配的内部对象（除非分配被优化掉），它包含：\n    * 承诺对象（promise object）。\n    * 变量（全部按值拷贝）。\n\
  \    * 当前挂起点的表示，以便 `resume` 知道下一步去向哪里，`destroy` 知道哪些变量在局部作用域内。\n    * 寿命超出当前挂起点的局部变量和临时变量。\n\
  \n* **当协程开始运行时，它会执行以下操作：**\n    * 使用 `new` 操作符分配一个协程状态对象对象。\n    * 向协程状态拷贝所有函数参数：按值传递的参数被移动或复制，而按引用传递的参数保持引用（因此如果协程在引用对象的生命周期结束后被恢复，这些引用可能会变成悬悬）。\n\
  \    * 如果承诺类型包含一个接受所有协程参数的函数，则将使用拷贝后的协程参数调用它。如果未指定，则使用默认函数。\n    * 调用 `promise`\
  \ 的 `return object()` 返回一个对象并将其存储在局部变量中。当协程初始挂起时，该调用的结果将返回给调用者。在此阶段之前及该阶段，异常将返回给调用者，而不是存储在承诺中。\n\
  \    * `co_awaits` `promise.initial_suspend()` 的结果。对于延迟启动的协程使用 `Suspend_always`，对于积极启动的协程使用\
  \ `never suspend`，这是两种常用的 `Promise` 类型。\n    * 当 `co await promise.initial_suspend()`\
  \ 返回时，执行协程体。\n\n* **当协程到达挂起点时：**\n    * 调用者/恢复者接收之前获取的返回对象，必要时它会被隐式转换为协程的返回类型。\n\
  \n* **以下是协程到达 `co_return` 语句时执行的操作：**\n    **针对以下情况调用 `promise.return_void()`：**\n\
  \    * `co_return;`\n    * 如果 `expr` 类型为 `void`，则执行 `co_return expr`。\n    * 丢弃返回\
  \ void 的协程的结尾。如果 `Promise` 类型没有 `Promise::return void()` 成员方法，则行为未知。\n    * 或者对于非\
  \ void 类型的 `co_return expr`，调用 `promise.return_value(expr)`。\n    * 按照创建的反向顺序移除任何具有自动存储生存周期的变量。\n\
  \    * 调用 `promise`。\n    * `co_awaits` `final_suspend()` 的结果。\n\n* **如果协程结束时有未捕获的异常，它会执行以下操作：**\n\
  \    * 捕获异常并调用 `promise`。\n    * 在 catch 块内部调用 `unhandled_exception ()`。\n    *\
  \ 调用 `promise`。\n    * `final_suspend()` 并 `co_awaits` 结果；从此点恢复协程是未定义行为。\n\n* **当协程状态被销毁时，它执行以下操作：**\n\
  \    * 调用承诺对象的析构函数。\n    * 调用函数参数拷贝的析构函数。\n    * 为了释放协程状态占用的内存，调用 `operator delete`。\n\
  \    * 将控制权归还给调用者。\n\n### 堆分配\n\n协程状态使用非数组运算符 `new` 在堆上分配。\n\n如果在 `Promise` 类型中定义了类级替换，则将利用它；否则将使用新的全局操作符。\n\
  \n如果 `Promise` 类型提供了接受额外参数的放置形式的 `operator new`，并且它们与参数列表匹配（其中第一个参数是请求的大小，类型为 `std::size_t`，其余是协程函数参数），则这些参数将提供给\
  \ `operator new`（这使得协程可以使用前导分配器约定）。\n\n即使使用了自定义分配器，如果满足以下条件，对 `operator new` 的调用也可以优化掉：\n\
  * 协程状态的寿命紧密嵌套在调用者的寿命内。\n* 如果在调用处已知协程帧的大小，则协程状态将嵌入到调用者的栈帧中（如果调用者是普通函数），或者协程状态将嵌入到调用者的协程状态中。\n\
  \n### 承诺\n\n（注：此处原文似乎截断，以下为根据后文内容的翻译）\n\n\n\n值得注意的是，我们的承诺对象在将其传递给主函数之前，会将 `i` 的值从协程中拷贝到\
