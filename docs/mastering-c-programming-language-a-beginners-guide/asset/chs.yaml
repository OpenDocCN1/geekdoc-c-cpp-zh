  \n设计良好的类封装其功能，隐藏其实现，同时提供清晰、良好的接口。只要接口不变，就可以进行重新设计或修改。\n\n对于更复杂的场景，可能需要多个相互依赖实现的类。友类和函数允许这些伙伴在不损害指定接口封装和隐藏信息的情况下相互访问。\n\
