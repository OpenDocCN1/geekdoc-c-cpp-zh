  \ 了解更多。\n\n# 第 1 章 C++ 简介\n\nDOI: [10.1201/9781003214762-1](https://doi.org/10.1201/9781003214762-1)\n\
  \n## 本章内容\n\n* 了解 C++ 的历史\n* 学习用途和特性\n* C++ 的安装\n\n## 什么是 C++？\n\nC++ 是由 Bjarne\
  \ Stroustrup 开发的高级编程语言，它适用于 Windows、Mac OS 以及多个 UNIX 变体。本 C++ 教程采用简单实用的方法将 C++ 概念传递给学者。在\
  \ C++ 中，数据类型分为三类：基本类型：这些是用户可以直接使用的底层或预定义数据类型。例如 `int`、`char`、`bool`。`long` 是 C++\
  \ 中的基本数据类型。\n\n## 学习 C++ 的好处\n\n* C++ 非常接近硬件，因此你有机会在底层工作，在内存控制方面获得更好的性能，最后是一种强大的语言。\n\
  * C++ 编程让你对面向对象编程（OOP）有深入的理解。当你实现虚函数和虚函数指针时，你将理解多态的底层实现。\n* C++ 是一种非常流行的编程语言，深受程序员喜爱。如果你是一名优秀的\
  \ C++ 软件工程师，你永远不会找不到工作，更重要的是，你将获得丰厚的回报。\n* C++ 是应用程序和框架开发中最广泛使用的编程语言。因此你可以选择自己感兴趣领域。\n\
  * C++ 确实能让你理解编译器、链接器和加载器之间的区别，各种数据类型、存储类、变量类型及其扩展等。\n\n**C++ 的优势包括：**\n\n* C++ 是一种高可移植性语言，常用于创建多设备、多平台应用。\n\
  * 类、继承、多态、数据抽象和封装都是 C++ 这种 OOP 语言的特性。\n* C++ 函数库非常丰富。\n* 异常处理和函数重载在 C++ 中都是可能的，但在\
  \ C 中不可。\n\n## C 还是 C++ 哪个更难学\n\n\n\n\n尽管有相似之处，但 `C` 和 `C++` 是两种不同的编程语言，应该被区别对待。在它们诞生约\
  \ 50 年后的今天，`C` 和 `C++` 仍然有独特的用例。\n\n要决定是学习 `C` 还是 `C++`，请考虑你打算将所学技能用于什么种程序。\n\n\
  ## 可用的用于集成和运行的 C++ 编译器\n\n* `IBM C++`\n* `Intel C++`\n* `Microsoft Visual C++`\n\
  * `Prophet C++`\n* `HP C++`\n\n## C++ 编程的应用\n如前所述，`C++` 可能是最通用的编程方言。它在编程进步的几乎每个领域都有其精髓。我在这里列出其中几个：\n\
  \n* **应用软件开发：** `C++` 编程已用于开发几乎每一个主要的操作系统，如 `Windows`、`Mac OSX` 和 `Linux`。除了工作框架外，`Mozilla\
  \ Firefox` 和 `Chrome` 等许多程序的内核都是使用 `C++` 编写的。`C++` 同样用于培养最著名的数据集框架 `MySQL`。\n* **编程语言开发：**\
  \ `C++` 已广泛用于开发新的编程方言，如 `C#`、`Java`、`JavaScript`、`Perl`、`UNIX 的 C Shell`、`PHP` 和\
  \ `Python` 以及 `Verilog` 等。\n* **计算编程：** 由于 `C++` 快速运行速度和计算效率，它是研究人员最亲的伴侣。\n* **游戏开发：**\
  \ `C++` 速度快，允许软件工程师对 CPU 密集型功能进行过程化编程，并对硬件提供更大的控制。它被广泛用于游戏引擎的开发。\n* **嵌入式系统：** `C++`\
  \ 用于创建医疗和工程应用，例如为 `MRI 机器` 、高质量的 `CAD/CAM` 框架等。\n\n列表还将继续；在不同的领域，编程设计师乐于使用 `C++`\
  \ 提供卓越的编程。我强烈建议你学习 `C++`，并为社区贡献独特的虚拟产品。\n\n## C++ 的特性\n`C++` 有许多不同的特性。例如：\n\n* 面对象\n\
  * 简单\n* 依赖平台\n* 中级编程语言\n* 结构化编程语言\n* 丰富的库\n* 内存管理\n* 强大且快速\n* 指针\n* 基于编译器\n* 基于语法的语言\n\
  \n## 面对象编程语言\n从 `C` 到 `C++` 的根本性提升是面向对象编程。它遵循诸如 `多态`、`继承`、`封装`、`反射` 等思想。这使得更加改进和支持。\n\
  \n我们应该暂时理解面向对象编程的概念。\n\n* **类 (Class)：** `class` 是一个对象的对象的蓝图或模型，据此创建对象。它处理同一类所有对象的公共属性或方法的布局。\n\
  * **对象 (Object)：** 它是 `OOP` 的基本单元，处理真实实体。`C++` 程序创建许多与调用技术相关的对象。\n* **多态 (Polymorphism)：**\
  \ `多态` 指 `OOP` 编程语言高效地区分具有相同名称实体的能力。\n* **继承 (Inheritance)：** `继承` 是允许一个类获取另一个类型属性的部分。\n\
  * **封装 (Encapsulation)：** `封装` 被描述为将信息封装在单一单元下。它是将代码及其控制的信息结合在一起的部分。\n* **抽象 (Abstraction)：**\
  \ `抽象` 指只显示最基本的信息而隐藏细节。数据抽象向外部世界暴露数据的关键方面，同时掩盖实现细节。\n\n## C++ 的元素\n`C++` 提供了一种结构化的方法，你可以在其中将问题分解部分并单独规划布局。它为你提供了丰富的库函数，你可以在执行约定时使用它们。\n\
  \n如果你工作过 `C` 语言，迁移到 `C++` 将是一个非常平滑的进展。语言结构几乎相当，只有细微变化。\n\n### 平台相关\n平台从属语言意味着可以执行该语言，其中项目在特定的工作框架上被创建和排序。它不能在其他操作系统上运行或管理它。\n\
  \n### 中级编程语言\n`C++` 可以同时进行低级和高级别编程。这就是 `C++` 被称为中级编程语言的原因。当我们谈论低级编程时，`C++` 用于开发框架应用，如内核部分、驱动程序等。\n\
  \n### 结构化编程语言\n在 `C++` 编程中，代码通过函数、类和过程来衡量，模块之间是松耦合的。代码简单且易于调整。这使得 `C++` 成为一种结构化的编程语言。\n\
  \n### 丰富的库\n设计师可以使用 `C++` 语言提供的大量内置功能。这节省了时间并加快了进展。我们应该查看 `C++` 提供的一些头文件和功能。\n\n\
  * `<iostream>`：包含 `C++` 标准输入和输出功能\n* `<iterator>`：包含用于获取 `C++` 标准库容器中信息的类\n* `<iomanip>`：包含排列信息流的流控制器\n\
  * `<algorithm>`：包含控制 `C++` 标准库容器中信息的功能\n* `<cstdlib>`：包含数字到文本及反之的转换、内存分配、变动数字以及其他工具功能\n\
  * `<memory>`：包含 `C++` 标准库用于为 `C++` 标准库分配内存的类和功能\n* `<ctime>`：包含控制时间和日期的功能\n* `<fstream>`：包含执行从文件输入和输出到文件的功能\n\
  * `<cmath>`：包含数学库功能\n\n### 内存管理\n`C++` 支持动态内存分配。你随时可以释放内存。不仅如此，`C++` 同样为执行程序分配动态内存。\n\
  \n### 强大且快速\n`C++` 是一种快速的语言，因为运行和执行时间短。此外，它拥有广泛的数据类型、功能和运算符。\n\n### 指针\n指针是存储另一个变量位置的。指针关注变量的内存区域。`C++`\
  \ 支持指针并为许多访问内存区域的问题提供答案。\n\n### 基于编译器的\n`C++` 是一种基于编译器的语言。没有汇编无法执行 `C++` 程序。编译器首先排序\
  \ `C++` 程序，然后完成。\n\n### 基于语法的语言\n`C++` 是一种允许严格遵守语法的语言。语言保持规则和准则严格被称为基于语法的语言。`C`、`C++`、`Java`、`.net`\
  \ 是其中的模型。\n\n## 关于 C++ 中面向对象编程的所有知识\n面向对象编程在出现时无疑震惊了编程界，并且仍然是通用编程的基础。在这篇文章中，我们将调查\
  \ `C++` 中的 `OOP`。\n\n### 什么是面向对象编程？\n* 对象\n* 类\n* 封装\n* 抽象\n* 多态\n* 继承\n\n\n\n\n\
  驱动“基于位置的方法论”创新的重大灵感，是为了消除过程化方法中经历的部分缺陷。在面向对象编程（OOP）中，信息被视为程序进展的核心组成部分，并将其流限制在框架内部。它将信息与其处理它的能力相关联，并防止其受到外部力量的意外修改。它允许将问题拆分为称为“对象”的各种元素，然后围绕这些对象组合信息和功能。对象的信息必须由与特定对象相关的力量访问。然而，在需要时，一个对象的元素也可以访问不同对象的属性。\n\
  \n它更强调信息而非方法：\n\n- 项目根据这些原则被划分为对象，使其易于操作。\n- 数据结构被设计用于表示对象。\n- 处理对象信息的功能被封装在数据结构中。\n\
  - 信息被封装起来，未经授权无法被外部函数访问。\n- 对象之间的交互（对应）可以通过功能来实现。\n- 添加新的信息和功能已变得浅层次化。\n\n### 对象\n\
  对象是 OOP 中最基本的运行时元素。它们可以代表用户定义的信息，如向量、时间和记录，或程序需要处理的任何内容。编程问题是基于对象以及它们之间对应关系的概念进行研究的。对象的选择应当能够与这些现实对象紧密匹配。对象占用内存空间，并且没有相关的物理位置。同时，执行对象通过相互发送消息进行接口交互。例如，如果“Understudy”和\
  \ `student_rollno` 是程序中的两个对象，`Student` 对象可能会向 `student_rollno` 对象发送消息，提及其相关的 `Marks`。每个部分都包含控制信息的代码。\n\
  \n### 类\n对象的整个代码结构可以通过类对象创建为用户定义数据类型，类对象是类（kind）的成员。当我们描述一个类时，我们可以创建多个具有该类位置的对象。每个对象都可以与其创建的类型类信息相关联。通过这种方式，一个类只是同类类型对象的集合。例如，多功能手机、`PC`\
  \ 和智能手表都是 `gadgets` 类的个体。类是用户定义的数据类型。用于创建对象的语法非常简单。假设硬件已被描述为一个类，那么断言 `PC;` 将创建一个具有\
  \ `hardware` 类位置的 `PC` 对象。\n\n### 封装\n封装可以描述为将信息和数据封装在一个单一单元中。在 OOP 中，封装被描述为将控制它们的知识和功能限制在一起。\n\
  \n考虑一个简单的封装示例；学校里有许多不同的部门，如学生部门、教师部门、财务部门等。学生部门处理学生的所有活动并跟踪所有与财务相关的信息。同样，教师部门持有每位教师的所有相关活动，并跟踪每个学生的学生的成绩和表现。目前，可能会出现一种情况：学生部门的一名学生由于未知原因需要关于成绩和表现的所有信息。在这种情况下，他不被允许直接访问教师部门的知识。他首先需要联系教师部门的某位老师，然后要求老师提供所有信息。这就是封装的意义。在这里，学生部门和教师部门的可以控制它们的知识被封装在“教师区域”的单一名称下。\n\
  \n### 抽象\n抽象指的是仅显示应用程序中重要且必要的元素，并隐藏细节。在 C++ 中，类可以向其他世界提供信息和功能，同时保持因素隐藏不被直接访问；或者类甚至可以向所有人（或获取它的类型）宣布所有可用内容，我们可以根据需要对其进行转换。\n\
  \n这应该可以通过访问修饰符来实现。C++ 有三种访问修饰符：\n\n1. `Private`（私有）\n2. `Protected`（保护）\n3. `Public`（公共）\n\
  \n### 多态\n多态一词意味着具有多种结构。我们可以将多态描述为功能或信息以超过一种形式显示的能力。一个人可以同时拥有多种身份。一个孩子同时是学生、兄弟/姐妹、孩子，这使得同一个人群体在多种情况下表现出不同的行为。这被称为多态。\n\
  \n一个活动可以根据多次出现的情况中的需求表现出不同的实践。行为取决于所使用的信息类型及其在操作中的需求。\n\nC++ 支持运算符重载和函数重载：\n\n-\
  \ **运算符重载：** 它是让运算符在不同示例中显示不同行为的方法。\n- **函数重载：** 函数重载是使用单一函数名称来执行各种任务。\n\n多态广泛应用于执行遗留代码。\n\
  \n继续阅读关于 C++ 中 OOP 的文章\n\n### 继承\n继承是一个类的对象获取另一个类对象的属性、功能和信息的机制。它遵循渐进式安排的概念。例如，“麻雀”鸟是“飞行鸟”类的一部分，也是“鸟”类的一部分。通过这种划分，每个确定的类都向其获取属性的类传递普通属性和信息。继承提供了重用的可能性。这意味着在不修改或发布任何改进的情况下，向当前类添加额外的元素。这通过从当前类获取另一个类来实现。新类将获得父类和子类的合并规定。\n\
  \n继承的真正用途是它允许开发者重用一个几乎（但并非完全）是他所需的类，并对该类进行修改而不会产生副作用引入其他类中。注意，每个子类仅刻画其自身以及从父类继承的感兴趣的部分。\n\
  \n\n\n\n\n*   为“Hello, World!”项目输入源代码。如果你还没有执行此操作，请按照 `创建一个 C++ 控制台应用项目` 中的说明进行操作。\n\
  \n本章将解释 C++ 是什么以及它是如何演变的。它的特性是什么，不同类型的编译器又是什么？学习 C++ 的用途和特性，以及如何在你的计算机上安装 C++。\n\
  \n# 第二章 C++ 入门指南\n\nDOI: [10.1201/9781003214762-2](https://doi.org/10.1201/9781003214762-2)\n\
  \n## 本章内容\n\n*   基础语法\n*   C++ 如何处理文件\n*   文件处理\n\n在上一章中，我们涵盖了 C++ 是什么、它的历史、它的功能，以及不同类型的编译器是什么，并学习了\
  \ C++ 的用途和特性，以及如何在计算机上安装 C++。\n\n当我们考虑一个 C++ 程序时，它倾向于被描述为一系列对象，这些对象传递了如何相互调用策略的方法。让我们暂时研究一下类（class）、对象（object）、方法（methods）和成员变量（instance\
  \ variables）意味着什么。\n\n*   **对象 (Object)：** 对象具有状态和行为；例如，一只狗有状态——颜色、名字、品种，以及行为——摇尾、吠叫、进。。对象是类的实例。\n\
  *   **类 (Class)：** 类可以被描述为一种布局/蓝图，描述了该类型对象所支持的行为/表达式。\n*   **方法 (Methods)：** 方法本质上是执行的操作。一个类可以包含许多方法。它是在组织逻辑、控制信息以及执行每一个活动时使用的场景。\n\
  *   **成员变量 (Instance Variables)：** 每个对象都有其特殊的成员因子排列。对象的状态是由分配给这些成员因子的属性构成的。\n\n\
