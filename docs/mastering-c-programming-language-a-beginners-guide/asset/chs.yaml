  \ `age` 设置为 10。\n\n## C++ 中，malloc() 对比 new\n\n在 C++ 中，`malloc()` 和 `new` 都用于相同的事。在运行时，它们被用于分配内存。然而，`malloc()`\
  \ 和 `new` 具有不同的语法。`malloc()` 和 `new` 的显著区别在于 `new` 是一个运算符，而 `malloc()` 是 `stdlib`\
  \ 头文件中的预定义库函数。\n\n### new 是什么？\n\n`new` 是一个在运行时用于分配内存的运算符。使用 `new` 运算符分配内存，而使用 `delete`\
  \ 运算符处理内存。它返回内存地址，并赋值给变量。在 C++ 中的 `new` 类似于 C 语言中的 `malloc()` 函数。由于 `new` 具有优势，它更为常用。\n\
  \n**语法：**\n\n- `type`：指定 `new` 运算符分配内存的变量的数据类型。\n- `variable`：指向内存的变量名。\n- `parameter_list`：用于变量的初始化值列表。\n\
  \n`new` 运算符不需要使用 `sizeof()` 运算符来分配内存。它还允许在构建对象时创建足够的内存。它是一种在声明时调用函数初始化对象的构造。\n\n\
  由于 `new` 运算符在堆中分配内存，如果在尝试分配时不可用，则会抛出异常。如果我们的代码无法处理该异常，应用程序将意外终止。\n\n**示例：**\n\n\
  **输出：**\n\n### malloc() 到底是什么？\n\n\n\n\n\n*   `new` 运算符通过调用构造函数生成对象，但 `malloc()`\
  \ 方法不会。构造函数由 `new` 运算符调用，而析构函数则由 `delete` 运算符调用以销对象。`malloc()` 和 `new` 之间最重要的区别就在于。\n\
  \n*   `malloc()` 是 `stdlib` 头文件中的一个预定义函数，而 `new` 是一个运算符。\n\n*   可以对 `new` 运算符进行重载，但\
  \ `malloc()` 函数则不行。\n\n*   如果堆中没有足够的内存，`new` 运算符将抛出一个异常，而 `malloc()` 方法将返回一个 `NULL`\
  \ 指针。\n\n*   在 `new` 运算符中，必须指定要分配的对象数量，而在 `malloc()` 函数中，必须指定要分配的字节数。\n\n*   要释放\
  \ `new` 运算符分配的内存，必须使用 `delete` 运算符。然而，在 `malloc()` 方法中，我们必须使用 `free()` 函数释放内存。\n\
  \n**语法：**\n\n**示例：**\n\n上述代码为整型变量在堆上分配内存，并将预留内存的地址保存在变量 `b` 中。\n\n*   使用 `malloc()`\
  \ 方法分配的内存可以使用 `free()` 函数释放。\n\n*   使用 `new` 运算符分配的内存在使用后无法扩展。另一方面，使用 `malloc()`\
  \ 方法分配的内存随后可以使用 `realloc()` 函数进行重新分配。\n\n*   由于 `new` 是一个构造结构而 `malloc` 是一个函数，因此\
  \ `new` 的执行时间比 `malloc()` 短。\n\n*   `new` 运算符返回的是新形成对象的地址，而不是特定的指针变量。相反，`malloc()`\
  \ 方法返回的是一个 `void` 指针，该指针可以强制转换为任何类型。\n\n# 进程内存\n\n进程是一个被加载到内存中的可运行程序。方法（Method）仅仅是一个运行中的程序。\n\
  \n当程序被生成时，它仅仅是保存在硬盘上作为被动对象的字节集合。当在 Windows 上双击程序或在命令行中输入可执行文件的名称时，程序开始加载到内存中并成为一个活动实体。\n\
  \n## 操作系统内存管理\n\n内存管理是操作系统的一个组件，用于调节或维护主内存，并在执行期间将进程从主内存移动到磁盘。内存管理跟踪每一个内存位置，无论其是否正在使用。它决定了应为每个进程分配多少内存。它指定了哪些方法将分配内存以及何时给予它们内存。它监控内存何时被释放或未分配，并相应地调整状态。\n\
  \n内存可以定义为特定格式的数据集合。它用于跟踪已处理的指令和数据。大量的字或字节数组或集合组内存，每个字都有自己的位置。计算机系统的主要目标是运行程序。在执行期间，这些程序以及它们访问的数据应该留在主内存中。CPU\
  \ 根据程序计数器的值从内存中检索指令。\n\n### 什么是主内存？\n\n现代计算机的主内存对其功能至关重要。从几十万到数十亿不等的巨大字或字节数组被称为主内存。CPU\
  \ 和 I/O 设备共享主内存，主内存是快速访问信息的存储器。当 CPU 积极使用程序和数据时，它们存储在主内存中。由于主内存与 CPU 关联，指令和数据在处理器之间的进出传输速度极快。\n\
  \n`RAM` 代表随机访问存储器。这种内存是易失性内存，意味着它可能在时候被擦除。当断电时，`RAM` 中的数据将会丢失。\n\n### 什么是内存管理？\n\
  \n在多程序处理计算机中，操作系统占用部分内存，而其他进程处于静态状态。将内存分配给各种用途的过程被称为内存管理。内存管理是操作系统在运行期间协调主内存和磁盘之间动作的机制。内存管理的根本目标是实现内存的实际利用。\n\
  \n### 为什么内存管理是必要的？\n\n*   在过程执行前和后分配和释放内存\n*   跟踪进程占用了多少内存\n*   将分碎片化降至最低\n*   最大限度地利用主内存\n\
  *   在过程运行期间保持数据安全\n\n## 逻辑地址与物理地址的空间\n\n*   **逻辑地址空间：** “逻辑地址”一词是指由 CPU 创建的地址。虚拟地址是它的另一个名称。进程的大小可以被描述为逻辑地址空间。逻辑地址是可以修改的。\n\
  *   **物理地址空间：** “物理地址”是内存单元看到的地址（即加载到内存地址寄存器中的地址）。实际地址与物理地址相同。\n\n物理地址空间是与这些逻辑地址相对应的所有物理地址的集合。内存管理单元（`MMU`）生成物理地址。名为\
  \ `MMU` 的硬件组件执行从虚拟位置到物理位置的运行时映射。物理地址始终是相同的。\n\n## 加载方法：静态与动态\n\n加载器以两种方式将进程加载到主内存中：静态和动态。加载可以分为两类：\n\
  \n*   **静态加载：** 静态加载是将整个程序加载到单个地址中。它需要额外的内存。\n*   **动态加载：** 整个程序及其数据必须在物理内存中，进程才能运行。因此，函数的大小受可用物理内存量的限制。动态加载用于确保内存的最利用。\n\
  \n## 链接：静态与动态\n\n链接器用于执行静态和动态链接任务。链接器是将编译器生成的多个对象文件合并为单个执行文件的软件。\n\n*   **静态链接：**\
  \ 链接器通过静态链接将所有必要的软件模块合并到可执行文件中。结果是没有运行时依赖。某些操作系统只允许静态链接，将系统语言库视为其他对象模块。\n*   **动态链接：**\
  \ 动态链接在原理上与动态加载相似。对于每个合适的库引用，动态链接中包含一个“存根（Stub）”。存根是一个只有几行代码的块。\n\n## 交换（SWAPPING）\n\
  \n进程在运行时必须驻留在内存中。交换将进程从主内存临时移动到辅助内存（后者比辅助内存快）。得益于交换，更多的操作可以同时进入内存并执行。传输时间是交换最关键的方面，总时间与交换的数量成正比。因为当高优先级进程请求服务时，内存管理器可以交换低优先级进程，然后加载并运行高优先级进程，交换也被称为换入换（roll-out,\
  \ roll-in）。在完成高优先级活动后，低优先级进程被换回内存并继续执行过程。\n\n\n\n\n\n主内存应该能够被操作系统和大量的客户端程序同时访问。因此，操作系统中的内存分配变成了一项至关重要的活动。内存通常分为两个部分：常驻操作系统和用户进程。在大多数情况下，许多用户进程必须同时保留在内存中。因此，我们必须研究如何将可用内存分配给等待从输入队列调入内存的进程。相邻内存分配中的每个进程都存储在单一的连续内存段中。\n\
  \n![一张图表显示了一个进程和一个内存块。](img/ufig5_1.jpg)\n<details><summary>长详细描述</summary>\n一个进程由三个堆叠的方框组成。一个内存块由\
  \ 10 个堆叠的方框组成。该块包含两个进程：一个有三个浅灰色方块，另一个有两个深灰色方块。</details>\n\n# 内存分配\n\n内存分配必须高效地进行分配，以实现内存利用率的最优化。将内存划分为许多固定大小的划分，每个划分恰好包含一个进程，这是分配内存最简单的方法之一。划分的数量决定了多道程序设计的程度。\n\
  \n# 多分区分配\n\n在这种方法中，从输入队列中选择一个进程并将其加载到空分区中。在进程完成后，该划分将对其他函数可用。\n\n# 固定分区分配\n\n在这种技术中，操作系统会跟踪哪些内存区域是空闲，哪些被进程占用了。所有内存最初对用户进程可用，并被视为一个巨大的单一内存块。可用内存被称为\
  \ `Hole`（空洞）。当需要内存的新进程出现时，我们寻找一个足够大的空洞来存储它。如果满足需求，我们就分配 RAM 来处理它；否则，剩余内存将保留以供后续请求。\n\
  \n在分配内存时，可能会出现动态存储分配困难，例如从可用空洞列表中满足大小为 `n` 的请求。处理这个问题有几种选择：\n\n![一张图表显示了动态存储分配的各种适应类型：首次适应、最佳适应和最坏情况适应。](img/ufig5_2.jpg)\n\
  \n## 首次适应 (First Fit)\n\n在这种情况下，第一个可用的空隙满足了进程的标准。\n\n![一张图表显示一个进程使用首次适应分配进入一个内存块。](img/ufig5_3.jpg)\n\
  <details><summary>长详细描述</summary>\n内存块由以下部分组成：`O S`、`20 K B`已占用、`15 K B`已占用、`40\
  \ K B`已占用、`60 K B`已占用，以及 `25 K B`。大小为 `25 K B` 的进程 `A` 进入内存块中的 `40 K B` 空间。空洞空间等于\
  \ `40 减 25`，结果为 `15 K B`。</details>\n\n由于之前的两个内存块没有足够的内存空间，图中第一个可用空洞是一个 `40 KB`\
  \ 的内存块，它可以容纳进程 `A`（大小为 `25 KB`）。\n\n## 最佳适应 (Best Fit)\n\n分配足够处理进程要求的最小空洞以实现最佳适应。除非列表按大小排序，否则我们需要在整个列表中进行搜索。\n\
  \n![一张图表显示一个进程使用最佳适应分配进入一个内存块。](img/ufig5_4.jpg)\n<details><summary>长详细描述</summary>\n\
  内存块由以下部分组成：`O S`、`20 K B`已占用、`15 K B`已占用、`40 K B`已占用、`60 K B`已占用，以及 `25 K B`。大小为\
  \ `25 K B` 的进程 `A` 进入内存块中的 `25 K B` 空间。空洞空间等于 `25 减 25`，结果为 `0 K B`。</details>\n\
  \n## 最坏情况适应 (Worst Fit)\n\n在最坏的情况下，处理最大的可用空洞。这种方法会产生最大的剩余空洞。\n\n![一张图表显示一个进程使用最坏情况分配进入一个内存块。](img/ufig5_5.jpg)\n\
  <details><summary>长详细描述</summary>\n内存块由以下部分组成：`O S`、`20 K B`已占用、`15 K B`已占用、`40\
  \ K B`已占用、`60 K B`已占用，以及 `25 K B`。大小为 `25 K B` 的进程 `A` 进入内存块中的 `60 K B` 空间。空洞空间等于\
  \ `60 减 25`，结果为 `35 K B`。</details>\n\n在这种情况下，进程 `A`（大小为 `25 KB`）被分配到最大的 `60 KB`\
  \ 可用内存块。在最坏的情况下，内存使用的低效是一个大问题。\n\n# 碎片 (FRAGMENTATION)\n\n`Fragmentation`（碎片）被描述为进程加载并在执行后从内存中删除时产生的微小空洞。由于这些空洞没有合并或不满足进程的内存需求，它们无法分配给新技术。我们必须减少内存浪费或碎片以达到多道程序设计的程度。操作系统中有两种形式的碎片：\n\
  \n![流程图显示了两种形式的碎片。分别是内部碎片和外部碎片。](img/ufig5_6.jpg)\n\n## 内部碎片 (Internal Fragmentation)\n\
  \n当给进程的内存块多于请求的时，就会发生内部碎片。因此，剩余了一些空间，导致内部碎片。\n\n## 外部碎片 (External Fragmentation)\n\
  \n在外部碎片中，我们有一个空闲内存块，但由于块是不连续的，我们无法将其分配给进程。\n\n# 分页 (PAGING)\n\n分页是一种内存管理方法，消除了在连续块中分配物理内存的需求。这种技术允许进程的物理地址空间是非连续的。\n\
  \n*   `logical address`（逻辑地址）：逻辑地址（有时称为虚拟地址）由 CPU 创建。\n*   `logical address space`（逻辑地址空间）：程序创建的所有逻辑地址的集合是逻辑地址空间。\n\
  *   `physical address`（物理地址）：在内存单元上可以找到的地址。\n*   `physical address space`（物理地址空间）：所有与逻辑地址相关的物理地址的集合。\n\
  \n## 内存中的对象是什么？\n\n在栏上方，程序获取内存中的对象，这些是虚拟存储块。系统将内存对象划分为虚拟段，每个段的大小为一兆字节并从兆字节边界开始。内存对象的大小可能等于你安装的内存限制，也可能小到一兆字节。\n\
  \n\n\n\n在运行时需要内存块时，这是必要的。你可能用过标准库方法，如 `malloc` 和 `free`，在 `C` 和 `C++` 中从堆上为应用程序动态分配内存。然后应用程序将这些内存用于特定用途。其目标通常是向数据结构添加一个节点。在面向对象的语言中，为了给新对象获取内存，会采用动态内存分配。\n\
  \n一个常见的误区是认为堆总是能满足我们的内存需求。然而，堆是有限制的。物理限制对我们大多数人来说可能是显而易见的，但还存在一个微妙的“虚拟”限制。当我们在长时间运行的中使用大量的分配和释放操作时，这种限制会变得更加明显。即使我们可以完全自由地在不再需要时将内存返回堆，这仍然是有代价的。当仍在使用的内存块之间，之前分配的内存被返回时，堆可能会产生“洞”。\n\
  \n我们的内存分配器必须在空闲洞中寻找合适的“洞”（即足够大以满足我们需求的洞）。考虑一种情况：我们可能找不到足够大的洞，但有大量的开放空间。感到困惑吗？\n\n\
  因为我们需要连续的内存块，可能没有任何一个洞是足够大的；相反，可能会存在大量的微小洞。动态内存分配最严重的问题之一就是内存碎片。\n\n采用了多种方法来减少碎片，例如采用合适的内存分配策略或将小洞合并为大洞。这激励了我们创建一个自定义的内存管理器，在其中，我们对分配方案以及处理此类问题的其他方式具有完全的控制权。\n\
  \n但等一下。为什么 `C` 和 `C++` 的默认内存分配器不能救我们呢？让我们深入细节来回答这个问题。\n\n*   `malloc` 和 `new` 是通用型内存分配器的示例。尽管我们的代码是单线程的，但它所连接的\
  \ `malloc` 函数也可能处理多线程范式。这种额外的功能损害了这些过程的性能。\n*   `malloc` 和 `new` 反过来向操作系统内核提出内存需求，而\
  \ `free` 和 `delete` 则提出内存释放请求。这意味着每当由于内存请求产生内存时，操作系统都必须在用户空间和内核代码之间进行切换，因为频繁的上下文切换；重复调用\
  \ `malloc` 或 `new` 的程序最终会变得迟钝。\n*   程序中分配了但未使用的内存经常被意外遗留未删除，且 `C/C++` 不允许自动垃圾收集。结果是程序的内存占用量随之增长。由于可访问内存变得越来越稀缺，且磁盘操作非常耗时，在大型程序中性能会受到严重损害。\n\
  \n## 自定义内存分配\n\n内存泄漏检测和快速内存分配对游戏速度有显著影响。`malloc` 和 `new` 是两种广知的分配动态（堆）内存的 `C++`\
  \ 方法；然而，因为它们是通用函数，所以它们通常是比较迟钝的，且某些实现需要从用户模式到内核模式的上下文切换。这些函数也没有带有内置的内存泄漏检测机制。我们可以使用自定义分配器来定义良好的使用模式并改进分配过程。几十年来，动态内存分配一直是大多数计算机系统中不可或缺的元素。\n\
  \n## 智能指针与内存管理\n\n*   **RAII 和引用计数：** 引用计数是一个熟悉 `Objective-C/Swift/JavaScript` 的程序员应该很熟悉的概念。为了防止内存泄漏，会跟踪引用计数。核心概念是统计有多少个动态分配的对象。每当你向它添加一个引用时，被引用对象的引用计数加\
  \ 1。每当移除一个引用时，引用计数减 1。当对象的引用计数减少到零时，指向的堆内存会被擦除。在传统的 `C++` 中，“记住”手动释放资源并不一定是一项良好的做法。\n\
  \n    因此，对于一个对象，我们通常在调用函数时申请空间，并在析构函数（退出作用域后调用）触发时释放空间。那个例子，`RAII` 资源获取有时被称为初始化技术。\n\
  \n    万物皆例外；因此我们必须将对象分配给空存储。在传统的 `C++` 中“记住”释放资源，我们必须利用 `new` 和 `delete`。智能指针在 `C++11`\
  \ 中引入，它们利用引用计数的概念消除了程序员手动释放内存的需求。这些智能指针需要 `<memory>` 头文件，并包含 `std::shared_ptr`/`std::unique_ptr`/`std::weak_ptr`。\n\
  \n*   **std::shared_ptr：** `std::shared_ptr` 是一种智能指针，它跟踪有多少个 `shared_ptr` 指向一个对象，消除了调用\
  \ `delete` 的需要（后者会在引用计数为零时删除对象）。\n\n    然而，这是不够的，因为 `std::shared_ptr` 仍然必须配合 `new`\
  \ 调用，导致代码出现某些不平衡。\n\n    为了避免使用 `new`，可以使用 `std::make_shared` 代替。`std::make_shared`\
  \ 将分配给定参数中的对象。返回该对象类型的 `std::shared_ptr` 引用。\n\n    **示例：**\n\n    可以使用 `std::shared_ptr`\
  \ 的 `get()` 函数来获取原始指针，可以使用 `reset()` 方法来降低引用计数 `()`。使用 `use_count()` 查看对象的引用计数 `()`。\n\
  \n    **示例：**\n\n*   **std::unique_ptr：** 独占智能指针 `std::unique_ptr` 防止其他智能指针共享同一个对象，确保代码安全：\n\
  \n    `make_unique` 在 `C++11` 中并不存在。我们，可以使用 `std::move` 将其移动到另一个 `unique_ptr`，例如：\n\
  \n*   **std::weak_ptr：** 如果你仔细考虑 `std::shared_ptr`，你会发现仍然存在资源未释放的问题。考虑以下场景：\n\n\
  \    由于内部指针也引用 `c, d`，`c, d` 的引用计数达到 2，然后作用域退出。只有当 `c, d` 智能指针销毁时，该区域的引用计数才会减少 1。这导致\
  \ `c, d` 对象的内存区域引用计数非零，但外部没有方法找到该区域，导致了内存泄漏。\n\n# 第 6 章 预处理与编译\n\nDOI: [10.1201/978103214762-6](https://doi.org/10.1201/978103214762-6)\n\
  \n## 本章内容\n\n*   编译你的源代码\n*   `C++` 中的预处理指令\n*   使用 `enable_if` 条件编译类和函数\n*   使用属性提供元数据\n\
  \n\n\n\n在本章中，我们将重点关注代码的编译。此外，我们将学习几种类型的处理器、如何在 Visual Studio 中编译我们的基础源代码，以及本章中提到的预处理器指令。此外，我们还将发现\
  \ `enable if` 是什么以及何时应该使用它。什么是 `enable_if` 类？它们可能用在哪些场景？如何使用 `std::enable_if` 和\
  \ `enable_if` 根据条件编译类和函数，以及如何有条件地创建成员函数。此外，C++ 中的属性（attributes）是什么？它们的列表有哪些？标准属性和非标准属性之间有什么区别？我们如何辨别它们的区别？自\
  \ C++11 以来，以下内容发生了变化，C++ 与 C# 特性之间的区别也有所不同。\n\n“编译源代码”一术指的是将其转换为可运行程序的过程。对象代码指的是由计算机实际执行的机器码。编译器将源代码转换为对象代码，但对象代码尚未准备好转换为程序。在对象代码转换为程序之前，需要一个链接器（Linker）。\n\
  \n除了学习指针和内存管理之外，学习 C++ 最困难的方面之一是研究如何在利用第三方库的同时有效地构建代码。作为一名游戏开发者，我们游戏的许多部分依赖于库，例如图形和物理，而编译一个包含了这些库的空项目是非常困难的。\n\
  \n## 三步流程\n\n![流程图显示了代码的三个步骤流程。](img/ufig6_1.jpg)\n<details><summary>详细描述</summary>\n\
  \n流程图如下：首先，创建源代码。代码经过预处理并转换为预处理后的代码。预处理后的代码经过编译转换为对象文件。在库的帮助下，对象文件经过链接并生成 .dot E\
  \ X E 文件或库。</details> \n\n编译 C++ 程序意味着将我们生成的源代码（`.cpp`、`.c`、`.h`、`.hpp` 文件）转换为可以在特定平台上执行的可执行文件或库。此过程可以细分为三个阶段：\n\
  \n1. **预处理（Preprocessing）：** C++ 中的预处理器指令在代码中通过前缀 `#` 被识别，并描述了在构建之前对源代码要执行的行为。关于预处理器指令的更多信息可以查阅此处。这些行为是在利用预处理器构建\
  \ C++ 程序的初始阶段执行的。\n\n预处理器指令决定了预操作的具体性质。我们经常将代码拆分为不同的文件，例如，以便更容易组织和理解。`#include`\
  \ 指令用于将一个文件中的代码与另一个文件中的代码链接。预处理器获取此 `#include`，并将该头文件中的代码复制并粘贴到包含它的 C++ 程序文件中。这节省了我们的时间，并减少了在文件之间手动复制代码时可能产生的错误概率。\n\
  \n`include` 指令是预定义指令的一个示例；请查看此页面获取其他实例。我们代码中的所有预处理器指令在预处理步骤结束时将由编译器的预处理器处理完毕，输出的代码现在已准备好构建。\n\
  \n2. **编译（Compiling）：** 过程的下一阶段是编译，它涉及将我们写的源代码转换为计算机可以理解的机器码。\n\nC++ 中的编译是一个两步过程。编译器首先将源代码转换为汇编语言。汇编是一种低级编程语言，与\
  \ CPU 的机器指令更为密切。其次，使用汇编器（Assembl）将已翻译为汇编语言的代码转换回真实的机器码。结果是一系列保存为对象文件格式的文件，这是一种中间文件格式。\n\
  \n**重要提示：** 机器码由二进制指令组成，被称为“机器语言”，因为 CPU 理解它们。\n\n对于每个源代码文件，都会生成扩展名为 `.obj` 或 `.o`\
  \ 的对象文件。该文件所有的机器级指令都包含在对象文件中。它被称为中间文件，因为在最后的链接阶段之前，还没有产生我们可以利用的真实可执行文件或库。\n\n在编译步骤，如果代码中出现任何阻止其编译的问题，我们将会收到警报。任何问题都是由于编译器无法理解我们编写的代码而导致的。我们实际上在某处把语法搞砸了（screwed\
  \ up），因为该代码无法被识别为 C++。缺少分号、拼写错误的 C++ 关键字或在方法末尾添加过多的大括号都是常见的编译错误。如果发现错误，编译过程将终止。在修复所有问题之前，我们将无法构建我们的\
  \ C++ 代码。\n\n3. **链接（Linking）：** 过程的最后阶段是链接，它涉及将之前步骤的所有输出结合在一起，创建实际的可执行文件或库。\n\n\
  此阶段的第一步是将所有对象文件编译为可执行文件或库。一旦成功完成，下一步是将该可执行文件与我们程序可能想要使用的任何外部库进行链接。\n\n**重要提示：**\
  \ 库（例如数学库）只是具有共同目的的函数、类和对象的复用集合。\n\n最后，链接器必须解决任何可能存在的依赖。这就是发生任何链接相关问题的地方。常见问题包括无法找到指定的库，或尝试连接两个具有（例如）相同类名的文件。\n\
  \n如果在此阶段没有问题，编译器将为我们提供一个可执行文件或库。\n\n4. **构建（Building）：** 另一个值得强调点是，提到的编译阶段在 Visual\
  \ Studio 等 IDE 中被组合名为“构建”的过程。在构建程序时，常用的方法是先构建后调试。\n\n发生的情况是构建通过编译和链接代码生成可执行文件，或者根据我们自上次构建的情况生成一个问题列表。当我们选择启动调试时，Visual\
  \ Studio 将启动创建的可执行文件。\n\n\n\n\n上述代码中的 `main.cpp`、`HiWorld.h` 和 `HelloWorld.cpp`\
  \ 文件都是极其基础程序。我们的 `HelloWorld` 头文件提供了一个方法 `PrintHiWorld()`，该方法在 `HelloWorld.cpp`\
  \ 中实现，而 `main.cpp` 负责 `HelloWorld` 对象的实际构造并调用其函数。\n\n- **编译：** 我们只需使用 `cl` 命令后跟所有我们想要构建的\
  \ `.cpp` 文件来编译并链接我们的应用程序。我们可以使用 `cl/c` 命令进行不链接的编译。\n- **链接：** 为了生成最终的可执行文件，我们必须在最后一个阶段链接我们的对象文件。为此，我们利用\
  \ `LINK` 命令，后跟上新生成的对象文件。\n\n## C++ 中的预处理器指令\n\n### 预处理器指令\n\n几乎每个 C/C++ 程序开头处以井号（`#`）开头的几行都是预处理器指令。编译器在开始实际编译之前会对这些行进行预处理。换行符“n”表示这些行的结束；不需要分号\
  \ `;;` 来完成它们。\n\n预处理器指令通常用于定义宏、求值条件语句、包含源文件、使用 `pragma` 指令、调节行长度以及识别错误。\n\n我们将在下面的章节中介绍一些额外的预处理器指令：\n\
  \n- 带条件的编译\n- 行控制\n- 错误指令\n- **条件编译：** 条件编译指令有助于编译程序的指定部分，或者允许我们根据某些标准跳过编译程序的某部分。我们在上篇文章中检查了这些指令中的两个：`ifdef`\
  \ 和 `endif`。我们将在本文中讨论 `#ifndef`、`#if`、`#else` 和 `#elif`。\n\n    1. **#ifdef：** 最简单的条件指令是\
  \ `#ifdef`。条件组是这种块的名称。如果指定了 `macroname`，则受控制的文本将包含在预处理输出中。预处理指令将包含在条件的受控制文本中。只有当条件成功时，它们才会被执行。这些可以多层堆叠，但必须完全嵌套。换句话说，最接近的\
  \ `#ifdef`（或 `#ifndef`，或 `#if`）总是会被 `#endif` 匹配。条件组不能在一个文件中开始而在另一个文件中结束。\n\n   \
  \     **语法：**\n\n    2. **#ifndef：** 我们知道，如果在 `#ifdef` 指令中定义了 `macroname`，则后续语句块将正常运行；但如果没有定义，编译器将直接跳过此语句块。`#ifndef`\
  \ 指令的工作方式与 `#ifdef` 指令完全相反。如果 `#ifndef` 的宏或标识符未定义，则只有在所述宏或标识符未声明时，`#ifndef` 和 `#endif`\
  \ 之间的语句块才会执行。\n\n        **语法：**\n\n    3. **#if, #else 和 #elif：** 这些指令共同工作，根据某些情况控制程序段的编译。如果\
  \ `#if` 指令的条件求值为非零，则执行紧跟在 `#if` 指令后的行组；如果 `#elif` 指令的条件求值为非零，则执行紧跟在 `#elif` 指令后的行组；否则，执行\
  \ `#else` 指令后的行。\n\n        **语法：**\n\n- 行控制 (#line)：** 当我们构建程序时，存在包含错误的风险。当编译器检测到程序中的错误时，它会告诉我们错误所在的文件名，以及错误发生的行列表和精确行号。这使得我们能够轻松地定位并纠正错误。\n\
