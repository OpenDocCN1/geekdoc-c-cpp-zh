  \ API 完全消除它们应该是可行的。\n\n出于此目的，使用了 `fmt::basic buffer` 模板来表示缓冲区抽象。缓冲区是一段连续的内存，可以直接访问，并在必要时增加大小。在格式化期间，只需调用一个虚函数\
  \ `grow()`，且仅当缓冲区大小不够大时才调用。\n\n实现区域无关的格式化比实现区域感知的格式化更高效。然而，后者的主要目标不是提高性能，而是服务某些用例。\n\
