  \n`get` 方法的限制在于它不能从 UI 线程调用，而且它没有充分利用机器的并行性，因为它锁定调用者线程直到异步函数完成。使用协程允许异步函数完成，而无需无限期地占用贵的资源。\n\
  \n# 满足异步完成的需求\n\n既然我们已经理解了异步接口的一般工作原理，现在让我们仔细观察它们是如何操作的。如果我们对 `get` 方法提供的阻塞延迟不满意，我们还有哪些额外选择？我们将很快转换重心专门关注协程，但首先，让我们看看这些异步接口看看它们能提供什么。这些接口指示的约和状态机被协程支持和我们之前看到的\
  \ `get` 方法使用。\n\n我们不会进入太多细节，因为我们不需要了解它们太多，但让我们概述一下要点，以便在将来需要使用它们时做好准备。`IAsyncInfo`\
  \ 接口是所有异步接口的逻辑先驱。我们对 `IAsyncInfo` 做不了什么，不幸的是，它的存在增加了一些开销。\n\n值得考虑的 `IAsyncInfo`\
