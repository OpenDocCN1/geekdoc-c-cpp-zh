  \ type`。\n*   如果协程被声明为非 rvalue 引用限定的非静态成员函数，使用 `std::coroutine_traits<R, ClassD/*cv-qual*/&,\
  \ Args…>::promise type`。\n*   如果协程被指定为带 rvalue 引用限定的非静态成员函数，使用 `std::coroutine_traits<R,\
  \ ClassD/*cv-qual*/&&, Args…>::promise type`。\n\n### co_await\n\n一元操作 `co_await`\
  \ 会挂起协程并将控制权交回调用者。它的操作数是一个表达式，其类型要么定义了 `operator co_await`，要么可以使用当前协程的类型转换 `Promise::await_transform`\
  \ 转换为此类类型。\n\n### co_wait expr\n\n*   **首先，`expr` 以以下方式转换为可等待对象（awaitable）：**\n\
  \    *   如果 `expr` 是由初始挂起点、最终挂起点或 yield 表达式创建的，则可等待对象为 `expr` 本身。\n    *   否则，如果当前协程的\
  \ `Promise` 类型包含成员函数 `await_transform`，则可等待对象为 `promise.await_transform`。\n    *\
  \   否则，可等待对象为 `expr` 本身。\n\n*   **然后按以下方式获取等待者对象（awaiter object）：** 如果 `operator\
  \ co_await` 的重载解析产生唯一的最佳重载，则等待者源于该调用（`awaitable`）。\n    *   对于成员重载，使用 `co_await()`；对于非成员重载，使用\
  \ `co_await(static_castAwaitable&&>(awaitable))`。\n    *   否则，如果重载解析没有找到 `operator\
  \ co await`，则等待者为 `awaitable` 本身。\n    *   否则，如果重载解析不明确，则程序是非良的（ill-formed）。\n\n\
  如果上述表达式是 `prvalue`，则等待者对象是从上述表达式实物化的临时对象。如果上述表达式是 `glvalue`，则是该等待者对象所引用的对象。\n\n\
  然后调用 `awaiter.await_ready()`（如果结果已知就绪或可以同步完成，则这是一个避免挂起开销的快捷方式）。如果结果在上下文中转换为 `bool`\
  \ 时为 `false`，则：\n\n协程已停止（其协程状态填充了局部变量和当前的挂起点）。\n\n当前协程的句柄称为 `Handle`，并调用 `awaiter.await_suspend(handle)`。被挂起的协程状态在该函数内部通过该句柄可见，由该函数负责调度其在某个执行器上重启或将其销毁（返回\
  \ `false` 算作调度）。\n\n*   否则，如果 `await suspend` 返回 `void`，则控制权将立即交给当前协程的调用者/恢复者（此协程保持挂起状态）。\n\
  *   如果 `await suspend` 返回 `bool`，值 `true` 将控制权交回当前协程的调用者/恢复者，而值 `false` 则恢复它。\n\
  *   如果 `await suspend` 交付另一个协程的协程句柄，则将其恢复（通过调用 `handle.resume()`）。\n\n最后，调用 `awaiter.await_resume()`，结果为\
  \ `co_await expr` 表达式的结果。\n\n如果协程在 `co_await` 表达式中挂起并在后恢复 `()`，则恢复点紧邻对 `awaiter.await_resume`\
  \ 的调用。\n\n**示例：**\n\n### 协程返回对象如下\n\n在前面的案例中，`counter` 的返回类型被忽略了。然而，语言限制了可以返回的协程类型。协程的返回类型（称之为\
  \ `R`）必须是一个带有嵌套类型 `R::promise_type` 的对象类型。`R::promise type` 必须包含一个方法 `R get_return\
  \ object()`，该方法返回一个外部类型 `R` 的实例。协程函数的返回值（在本例中为 `counter`）通过 `get_return object()\
  \ ()` 返回。许多对协程的解释将返回类型 `R` 称为 `future`，但为了清晰起见，我们只需称之为返回对象类型。\n\n如果直接从 `counter`\
  \ 返回 `handle` 而不是为 `counter ()` 提供一个 `coroutine_handle<>*`，将会很好。如果我们将 `I` 放在返回对象中；由于返回对象的构建方式，目前还没有优雅的方法可以做到。\n\
  \n\n\n\n关于共同返回（co-return），有几点需要记住。在之前的示例中，我们的 promise 对象上没有 `return_void()` 函数。只要我们没有使用\
  \ `co return`，这就没关系。如果我们使用了 `co return` 但没有提供适当的 `return void` 或 `return value`\
  \ 方法，就会发生关于缺少该函数的编译错误。好消息是，这种情况会被编译器捕获。坏消息是，如果我们从函数末尾滑出且 promise 类型没有 `return void`\
  \ 方法，将会导致未定义行为。我们将在接后的论述中详细讨论这一点，但足以说明的是，未定义行为是极其糟糕的——就像“释放后使用”（use-after-free）或数组越界访问那样糟糕。因此，请务必不要在一个\
  \ promise 对象上没有 `return_void_function` 的协程中结束！\n\n关于 `co return` 需要注意的另一点是，`promise_type::return\
  \ void()` 和 `promise_type::return value(v)` 返回的是 `void`；它们不返回可等待（awaitable）对象。这很可能是为了标准化返回值和异常的处理。尽管如此，在协程结束时该做什么的困境依然存在。\n\
  \n编译器是否应该对协程状态进行最终更改并停止协程，以便即使在评估 `co_return` 之后，主函数中的代码仍可以访问 promise 对象并合理地使用 `coroutine_handle`？从协程中返回（例如隐式调用\
  \ `coroutine_handle::destroy()`）难道不应该移除协程状态吗？\n\npromise 类型上的 `final_suspend` 函数回答了这个问题。根据\
  \ C++ 规范，协程的函数体实际上被封装在以下结构中：\n\n#### 语法\n\n当协程返回时，我们隐式地 `co await` `promise.final_suspend()`\
  \ 的结果。如果 `final_suspend` 真的挂起了协程，则协程的状态将发生最后一次改变。它将保持有效，协程外部的代码将负责通过在 `coroutine\
  \ handle` 上执行 `destroy()` 函数来释放协程对象。如果 `final_suspend` 未能挂起协程，则协程状态将自动删除。\n\n如果我们再也不会触碰协程状态（可能因为协程在\
  \ `co return` 之前刚刚更新了全局变量和/或释放了信号量，而这正是我们关心的），那么没有理由为了最后一次保存状态而付出代价，并担心手动释放协程状态以使\
  \ `final_suspend()` 返回 `std::suspend_never`。如果我们需要在返回后访问 `coroutine handle` 或 promise\
  \ 对象，则需要使用 `final_suspend()`，它返回 `std::suspend_always`。\n\n## 什么是生成器（GENERATORS）？\n\
  \n### 通用生成器\n\n如果我们想开发一种通用的生成器返回对象类型以便他人编写协程，处理异常最有效的方法是在调用生成器的主例程中重新抛出异常。`Unhandled_exception()`\
  \ 可以通过 `std::current_exception` 获取 `std::exception_ptr`，然后将其放入 promise 对象中来实现。生成器利用\
  \ `std::rethrow_exception` 在该异常指针非空时在主函数中传播该异常。\n\n另一个关键问题是，到目前为止，我们的协程在被调用时立即（在第一个\
  \ `co_await` 之前）就计算了初始值（0），因此在构建返回对象之前。。我们可能希望等到第一次协程挂起之后再计算第一个值，这有两个原因：第一，当计算值非常耗时时，如果协程从不重启（可能是因为另一个协程的错误），那么存储工作可能更优；第二，因为协程句柄必须显式销毁，如果协程在第一次挂起之前抛出异常，情况可能会变得复杂。\n\
  \n#### 示例\n\n假设在上面的示例中，`mkCoroutineA()` 提供一个协程句柄，而 `mkCoroutineB()` 在第一次 `co await`\
  \ 之前抛出错误。在这种情况下，由 mkCoroutineA()` 生成的协程永远不会被删除。我们可以重新排列代码将 `mkCoroutineB` 封装在它的\
  \ `try-catch` 块中，但在产生许多协程时这将迅速变得复杂。\n\n为了解决这些担忧，函数 `promise_type::initial_suspend()`\
  \ 可以返回 `std::suspend_always`，导致 `mkCoroutineB` 在进入时立即停止，此时协程中的代码尚未运行。在下方的示例生成器中，我们使用了这种方法。这意味着在从生成器返回第一个值之前，我们必须重启协程。\n\
  \n所以，这是我们的通用生成器。`Generator<D>` 必须由产生类型 `D` 的生成器返回。主函数检查 `Generator` 是否仍有输出值，然后使用\
  \ `operator()` 获取下一个值。\n\n#### 示例\n\n最后需要注意的是，我们现在移除了 `Generator` 析构函数内部的 `coroutine_hande`，因为我们知道一旦生成器消失，协程句柄就不再需要。\n\
  \n### 贪婪生成器（Greedy Generator）\n\n下面的软件尽可能简单。`getNumbers` 函数从开始到结束返回所有被 `inc` 增过的整数。起始值必须小于结束值，且增量必须为正数。\n\
  \n#### 示例\n\n### 懒性生成器（Lazy Generator）\n\n#### 示例\n\n### std::generator: Ranges\
  \ 同步协程生成器\n\n#### 示例\n\n### 动机（Motivation）\n\nC++ 20 对协程的支持相当有限。同步生成器是协程的标准写法，如果没有本文描述的技术，这种生成器是无法实现的。为了编写一个高效且行为正确的递归生成器，标准应该提供一个。\n\
  \n### 设计（Design）\n\n虽然提议的 `std::generator` 接口很直观，但有一些值得注意的考虑因素：\n\n- `input_view`：`std::generator`\
  \ 输入视图是一个不可拷贝的视图，它实现了 `input_range` 并产生仅移动的迭代器。协程帧是独有的资源（即使协程句柄是可以拷贝的）。遗憾的是，某些生成器可以满足视图限制，但不能满足视图\
  \ O(1) 析构的要求：\n\n### 头文件（Header）\n\n生成器类可以放在几个地方：\n\n- `<coroutine>`，但协程是一个底层头文件，而生成器依赖于\
  \ `<type traits>` 和 `<iterator>`。\n- `<ranges>`\n- 新的 `<generator>`\n\n### 值类型可以单独指定（Value\
  \ Type Can Be Specified Separately）\n\n此提议允许我们分别定义“产生”类型（即迭代器的“引用”类型，它不需要是引用）以及与之对应的值类型。这使得范围能够支持代理类型和封装引用，如下文中的\
  \ zip 实现所示：\n\n在第二个示例中使用 `string` 作为值类型确保了调用代码可以采取必要的预防措施，以确保在遍历生成器时不会导致返回的值失效。\n\
  \n### 递归生成器（Recursive Generator）\n\n“递归生成器”是一种允许直接 `co_yield` 同一类型的生成器的协程，以便将其元素作为当前生成器的元素发射。\n\
  \n**例如，生成器可以 co_yield 其他相同类型的生成器。**\n\n#### 示例\n\n与遍历嵌套生成器的内容并手动产出其每个元素相比，直接产出嵌套生成器具有某些性能优势，而且更加简洁。\n\
  \n当使用嵌套生成器时，顶层协程的消费者在增加迭代器时可以直接恢复当前的叶子生成器，但手动遍历子生成器的元素会导致序列中的每个元素都需要 O(depth) 次协程恢复/挂起。\n\
  \n**示例：非递归版本每个元素需要 O(depth) 次恢复/挂起，因此更难编写**\n\n\n\n\n\n从嵌套生成器协程体传播出的异常将通过 `co_yield`\
  \ 表达式重新抛出到父协程，而不是从顶层的 `iterator::operator++()` 传播。这是基于一种心理模型：`co_yield someGenerator`\
  \ 在语义上等同于手动遍历元素并产出每一个元素。\n\n例如，嵌套的 `ints()` 和手动的 `ints()` 在语义上是相似的。\n\n### elements_of\n\
  \n当嵌套生成器类型可转换为当前生成器的值类型时，`elements_of` 是一个防止歧义的实用函数。\n\n**示例：**\n\n- 为了避免此问题：\n\
  \    - `co_yield expression>` -> 应该始终直接产出该值以防止此问题。\n    - `co_yield elements of(expression>)`\
  \ 返回嵌套生成器的值。\n\n我们还建议将 `co_yield elements of(x)` 展开为产出除生成器以外任意范围的值，以便方便。\n\n## 对称传输\
  \ (SYMMETRIC TRANSFER)\n\n通过对称传输，递归形式可以快速完成。此功能之前在 `[CppCoro]` 中通过独立的 `recursive_generator`\
  \ 类型提供。\n\n然而，得益于 HALO 的改进和对称传输，单一类型似乎已经足够高效。该功能的代价是每个生成器额外三个指针的内存换取。鉴于目前编译器对协程的支持状态，估计我们方法的运行时开销是具有挑战性的。然而，我们的测试显示，生成器与\
  \ `recursive_generator`（有时被称为 `non_recursively`）之间没有明显区别。值得一提的是，建议的方法确保了 HALO 优化的可能性。\n\
  \n虽然我们认为单一生成器类型已经足够并提供了更优的 API，但还有三种替代方案：\n\n- 在单个生成器类型中支持递归调用（本提议）。\n- 一个递归生成器类型，可以从递归生成器或普通生成器返回值。这可能会导致性能微小提升，同时使用相同数量的内存。\n\
  - 一种递归生成器类型，只能从其他递归生成器类型返回值。\n\n如果我们选择第三种方案，以下代码将是格式错误的：\n\n相反，我们必须写成：\n\n由于这种限制，在构造生成器协程时，决定返回\
  \ `generator` 还是 `recursive_generator` 可能是棘手的，因为我们可能并不知道这个特定的生成器在此时是否会被 `recursive_generator`\
  \ 利用。\n\n假设我们选择了生成器返回类型，并随后希望从 `recursive_generator` 中产出它的元素。在这种情况下，我们必须手动逐一个产出每个元素，或者使用一个将生成器转换为\
  \ `recursive_generator` 的辅助函数。与生成器最初被构建为产出 `recursive_generator` 的情况相比，这两种选择都增加了运行时开销，因为它们对每个元素都需要两次协程恢复，而不是单次协程恢复。\n\
  \n由于这些缺点，我们并不提倡这种方法。\n\n只要引用类型相同，各种生成器类型都允许进行对称传输，即对称传输不会被不同的值类型或分配器类型所阻止。\n\n###\
  \ 在 Promise 类型中存储交付值的最佳方式是什么？\n\n由于给定的表达式保证在协程重启之前一直有效，因此存储其地址就足够了。这使得大产出类型生成器非常高效。然而，由于额外的间接，它在产生比指针小的值时可能是悲观的（这种间接的开销是未知的，因为这些访问都不应该导致缓存未命中）。\n\
  \n结果导致产出表达式中的转换被避免了：\n\n以额外存储为代价，存储副本将允许更少的间接，并提供产出任何可转换为产出类型的灵活性。`generator<const\
  \ D&>` 可用于以避免存储开销。\n\n### 对分配器的支持\n\n通过对 `generator` 和 `promise_type` 的新操作符基于分配器类型进行模板化，`std::generator`\
  \ 可以处理无状态和有状态的分配器，并努力减少无状态分配器的接口冗余。\n\n**示例：**\n\n支持分配器需要在协程帧旁边保留一个函数指针（用于监控内存释放函数），并且在有状态分配器的情况下，保留分配器本身。\n\
  \n根据建议的接口，如果给定了分配器，它必须是协程函数的第二个参数，紧跟在 `std::allocator_arg_t` 实例之前。这种方法用于区分用于创建协程帧的分配器与在协程函数体内使用的分配器。\n\
  \n我们认为所有标准和用户协程类型必须具有等效的分配器支持接口。实际上，分配器支持实现可以在 `generator`、`lazy` 和其他标准类型之间共享。\n\
  \n#### 是否可以推后添加分配器支持？\n\n分配器支持可能会在未来引入 `std::generator`。然而，因为分配器是提议架构中的模板参数，在 `std::generator`\
  \ 发布后引入分配器会导致 ABI 破坏。我们敦促按照本文建议的立即添加分配器支持，并确保架构在整个周期内对 `std::lazy` 的工作中保持一致。\n\n\
  ## 经验与实现\n\n作为 `cppcoro` 和 `folly` 的一部分，已经提供了生成器。另一方面，`Cppcoro` 提供了一个独特的递归生成器类型，它与建议的架构不同。\n\
  \nFolly 采用了一种不支持对称传输的单一递归生成器类型。尽管如此，Folly 用户发现 `Folly::Generator` 比它所取代的急进算法高效得多。\n\
  \nRanges-v3 也包含一种从不递归的生成器类型，且早于移动只读视图和迭代器的工作，这导致了协程处理器被引用计数。\n\n## 性能与基准测试\n\n由于实现仍在微调中，且性能高度依赖于是否发生了\
  \ HALO 优化，目前无法对提议设计的性能给出结论性意见。\n\nClang 无论在编写时实现实现是否支持协程，都可以内联非嵌套协程，但 GCC 从不进行 HALO\
  \ 优化。\n\n当协程未内联时，支持递归对性能没有明显影响。\n\n## 使用协程编译代码\n\n由于 C++20 目前尚未被广泛支持，我们需要确保编译器支持协程才能使用它们。我们正在使用\
  \ GCC 10.2，如果在编译时使用以下选项，它似乎允许协程：\n\n## 协程句 (HANDLES)\n\n如所述，新的 `co_await` 运算符保证函数的当前状态被封装在堆上的某个地方，并生成一个继续当前函数执行的可调用对象。`std::coroutine_handle<...>`\
  \ 是该可调用对象的类型。\n\n协程句的工作类似于 C 指针。它很容易复制，但缺少释放与协程状态相关内存的析构函数。为了尽可能减少内存泄漏，我们应该始终调用\
  \ `coroutine_handle::destroy` 函数来删除协程状态（尽管在某些情况下协程可以在完成时自销毁）。当协程句被销毁时，引用同一协程的协程句将指向垃圾并在执行时产生未定义行为，就像\
  \ C 指针一样。相反，协程句在协程执行期间一直保持有效，即使控制多次进入和离开协程。\n\n\n\n\n\n# 协程与 C++ 高效异步\n\n同样，Windows\
  \ Runtime 的其他所有部分都聚焦于允许组件提供异步方法，并让应用程序轻松使用这些异步方法，Windows Runtime 有一个基础的异步模型。它本身并不提供并发运行时，甚至不提供用于创建或消费异步方法的任何构建块。相反，独特的语言投影（language\
  \ projections）负责了这一切。\n\n这种情况本应该是这样的，而且它的意图并不是为了让 Windows Runtime 的异步模式变得更容易。正确地实现这种模式并非易事。当然，这意味着开发者偏好的编程语言会显著影响他们对\
  \ Windows Runtime 中异步操作的看法。例如，一个只工作过 `C++/CX` 的开发者可能会错误但合情地认为异步是一场灾难。\n\n对于 `C#`\
  \ 开发者来说，理想的并发框架将与 `C++` 开发者的理想并发库有所不同。在 `C++` 中，语言和库的作用是处理异步模式的机制，并为针对特定语言的实现提供逻辑桥梁。\n\
  \n在 `C++` 中，协程是实现和调用异步函数的理想抽象，但在那，让我们先回顾一下异步模型是如何工作的。考虑以下这个具有单个静态方法的类示例：\n\n```cpp\n\
