  \n数据抽象是一种编程方法，在其中接口和实现是分离的。\n\n以电视机为例，你可以打开和关闭它、切换频道、调整音量，并添加如扬声器、DVD 播放器等外部组件，但你不知道它是如何通过空气或电缆接收信号的，它是如何翻译这些信号并最终将其显示在屏幕上的。\n\
  \n因此，我们可以认为，电视机清楚地将其内部实现与其外部接口隔离开，允许你与电源按钮、频道调节器和音量控制等接口交互，而无需了解其内部的任何信息。\n\nC++\
  \ 中的类实现了高水平的数据抽象。它们向外部世界暴露了足够的公共方法，允许用户尝试对象的功能并更改对象数据（即状态），而无需知道类内部是如何构建的。\n\n例如，你的应用程序可以调用\
