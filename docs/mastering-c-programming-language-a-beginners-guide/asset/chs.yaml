  \ `std::transform()` 和 `std::accumulate()` 已在本书的许多示例中使用，例如创建字符串实用程序来生成字符串的大写或小写副本，或求加范围内的值。这些本质上是映射（map）和折叠（fold）的高阶函数实现。高阶函数接受一个或多个其他函数作为参数，并使用它们从一组数据（列表、vector、map、树等）产生新的数据集合或值。我们将在本食谱中探索如何使用\
