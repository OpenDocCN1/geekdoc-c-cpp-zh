  \n在 C++ 中，数据结构分为三类：\n\n1. **简单数据结构：**在 C++ 中，这些数据结构通常由原始数据类型组成，如 `int`、`float`、`double`、`string`\
  \ 和 `char`。\n2. **复合数据结构：**这类数据结构可以通过合并简单数据结构来创建。它进一步分为两类：\n    * **线性数据结构：**如果一个数据结构的元素按照逻辑顺序排列，则认为该数据结构是线性的。\n\
  \    * **非线性数据结构：**多级数据结构是非线性数据结构。\n3. **静态和动态数据结构：**静态数据结构具有固定的大小和结构，并连接到在编译时固定的特定内存位置。例如，数组。\n\
  \n### 数据结构操作\n\n* **插入：**向数据结构中插入新的数据元素的操作称为此操作。\n* **删除：**在数据结构中删除或移除现有的数据元素。\n\
  * **遍历：**使用遍历处理并显示数据结构中的所有数据。\n* **搜索：**在数据结构中查找特定的数据元素。\n* **排序：**将数据结构中的数据项按升、降序或任何其他逻辑顺序进行排序。\n\
  * **合并：**将两个或多个数据结构中的相似数据进行组合以创建一个新的数据结构的过程。\n\n## 面向对象\n\n### C++ 中的类和对象\n\nC++\
  \ 编程的根本目标是向 C 语言引入面向对象的特性，类（也称为用户定义类型）是 C++ 中允许面向对象编程的关键元素。\n\n类通过将数据表示和更改数据的方法合并成一个包来指定对象的形状。类的成员是组成类的数据和方法。\n\
