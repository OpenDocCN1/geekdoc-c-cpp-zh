  \ 成员可以有所帮助。\n\n示例\n\n四个异步接口的每个接口都提供了 `GetResults` 方法的独立版本，而不是 `IAsyncInfo` 本身。它们应该只在异步函数完成后调用。这不要与\
  \ `C++/RT` 的 `get` 方法混淆。`Get` 是由 `C++/RT` 实现，而 `GetResults` 是通过异步方法实现的。如果异步方法仍在运行，`GetResults`\
  \ 将不会阻塞，如果过早调用，它可能会产生 `hresult` 非法方法调用异常。毫无疑问，我们可以开始理解阻塞获取方法是如何工作的。在概念上，它看起来如下：\n\
  \n```\n实际实现要复杂得多，但它让我们很好地了解发生了什么。问题在于，无论是 `IAsyncOperation` 还是不返回结果的 `IAsyncAction`，`GetResults`\
  \ 都会被调用。这是是因为 `GetResults` 负责传播异步方法实现期间可能发生的任何错误，并在必要时抛出异常。\n```\n\n\n\n\n我们将统一使用\
  \ `return` 语句，因为我们的函数模板将适用于所有的异步接口。C++ 语言对泛型提供了特殊规定，这一点非常值得赞赏。\n\n四个异步接口中的每一个都有一个唯一的\
  \ `Completed` 成员，可以用于注册委托，该委托会在异步方法完成时被调用。在大多数情况下，C++/WinRT 会自动为我们构建委托。我们现在需要做的就是提供一个类似函数的处理程序，这通常是一个\
  \ lambda 表达式：\n\n委托的第一个参数将是刚刚完成的异步接口的类型；然而，完成应该被视为一个简单的信号。换句话说，不要在 `Completed` 处理器中塞入大量代码。我们应该将其视为一个\
  \ `noexcept` 处理器，因为如果此处理器内部发生错误，异步方法将不知道该如何处理。那么，我们有哪些选择呢？\n\n我们可以直接使用事件来通知等待的线程。\n\
  \n因为这种方式效率高一些，C++/WinRT 的 `get` 方法利用了带有轻量级读/写锁的条件变量。\n\n如果我们需要，可以利用 C++ 标准库中的 `mutex`\
  \ 和条件变量。其思路是使用 `Completed` 处理器来连接异步完成，并且可以用多种方式实现。\n\n自然地，我们不需要构建 `get` 函数，而且协程通常来说更易于访问且适应性更强。尽管如此，我们希望这能帮助我们理解\
  \ Windows Runtime 的一些优势和多功能性。\n\n## 如何将它们变为异步对象\n\n在查看了异步接口和通用的基本完成技术后，现在让我们开发或生成这四个异步接口的实现。正如我们之前展示的，使用\
