  ## C++ 中的函数\n\n函数是一组协作执行特定任务的语句。每个 C++ 程序都至少包含一个函数 `main()`，即使是最简单的程序也可以指定许多函数。\n\
  \n你可以将代码拆分为不同的函数。如何将代码拆分为单独的函数取决于你，但从逻辑上讲，每个函数都应该实现一个特定的目的。\n\n函数的名称、返回类型和参数都是在函数声明中指定的。函数定义则定义了函数的体。\n\
  \n**函数定义**\n\nC++ 中的函数定义由两部分组成：函数头头部和函数体。\n\n- **返回值**：作为其返回类型，函数可以返回一个值。函数返回的值的数据类型由返回类型指定。某些函数的执行符合预期，但不返回任何值。在这种情况下，返回类型称为\
  \ `void`。\n- **函数名**：这是函数的实际名称。函数签名由函数名和参数列表组成。\n- **参数**：参数是一个占位符。当你调用一个能力时，你向调用发送一个值。这个值由实际参数或实参引用。边界列表指的是类型、请求和能力边界的数量。参数是可选的；它们可能出现在能力中。\n\
  - **函数体**：函数体由一系列说明组成，展示了该能力如何工作。\n\n**示例：**\n\n### 函数声明\n\n函数声明为编译器提供了函数名称以及如何调用它。\n\
  \n**语法：**\n\n### 调用函数\n\n当你创建一个 C++ 函数时，你必须定义函数必须执行的操作。在使用函数之前，你必须调用或触发该函数。\n\n\
  当程序调用函数时，控制权从调用程序传递到被调用的函数。函数执行定义的工作，然后在执行 `return` 语句或到达函数结束的右大括号时，将程序控制权返回给主程序。\n\
  \n### 函数参数\n\n如果某个能力将使用参数，它需要描述将取参数值的因素。这些因素被称为函数的形参。\n\n形参在进入能力时产生，在离开能力时被删除，非常像函数内部的任何邻近因素一样。\n\
  \n| 序号 | 调用类型及描述 |\n| --- | --- |\n| 1 | 值传递：这种技术将参数的实际值复制到函数的形参中。在这种情况下，函数内部对参数的更改对参数没有影响。\
  \ |\n| 2 | 指针传递：这种方法将参数的地址复制到形参中。该地址在函数内部用于检索调用中使用的实际参数。这意味着对参数的更改会对参数产生影响。 |\n\
  | 3 | 引用传递：这种方法将参数的引用复制到形参中。在函数内部，使用引用访问调用中使用的实际参数。这意味着对参数的更改会影响参数。 |\n\n### 参数默认值\n\
