  \ 用于过滤重载集合——即从重载解析中消除候选方案——以便舍弃其中一个定义而选择另一个。\n\n* **这里有四种需要考虑的场景：**\n    * **场景\
  \ 1**：包装函数的返回类型：\n    * **场景 2**：为函数参数添加默认参数：\n    * **场景 3**：为模板参数添加默认参数：\n   \
  \ * **场景 4**：我们可能在函数中封装一个非模板参数的类型：\n\n由于构造函数和转换运算符没有返回类型，因此场景 1 是不起作用的。\n\n场景 2\
  \ 没有提到该参数。我们可能会说：`:type Dummy = BAR`，但 `Dummy` 这个名字是没有意义的，而且给它指定一个名字几乎会会导致“未引用的参数”错误。我们必须选择一个\
  \ `FOO` 函数参数类型以及 `BAR` 默认参数。我们可能会说 `int` 和 `0`，但我们代码的用户可能会无意中给方法传递额外的整数，而该整数会被忽略。由于实际上几乎没有东西可以转换为\
  \ `void`，我们提倡使用 `void` 以及 `0` 或 `nullptr` 代：\n\n场景 2 同样适用于普通的构造函数。然而，它对转换运算符不起作用，因为它们无法接受额外的参数。它对变长构造函数也不作用，因为添加更多参数会导致函数参数包变得不可推导，从而违背了\
  \ `enable_if` 的目标。\n\n场景 3 中使用了 `Dummy` 名字，但并不是必须的。如果我们认为 “typename = typename”\
  \ 看起来很奇怪，我们可以使用一个“哑符”（dummy）名称——只要不要使用可能在函数描述中使用的名称即可。如果我们不为 `enable_if` 指定类型，它将默认为\
  \ `void`，这是可以的，因为我们不在乎 `Dummy` 是什么。\n\n场景 4 通过处理没有返回类型的构造函数，解决了场景 1 的包装限制。然而，场景\
  \ 4 局限于非模板函数参数，而这些参数通常是无法访问的。（当场景 4 应用于模板函数参数时，模板参数推导会被禁用。））\n\n`enable_if` 是一个强大的工具，但如果使用不当，它也可能是危险的。因为它的意图是在重载解析之前让候选方案消失，当使用不当时，结果可能会相当令人疑惑。这里有几个建议：\n\
  \n* 在编译时选择不同的实现时，不要使用 `enable_if`。永远不要写两个 `enable_ifs`，一个用于 `CONDITION`，另一个用于 `!CONDITION`。相反使用标签分发（tag\
  \ dispatch）模式，例如根据所给迭代器的强度来选择实现方法的算法。\n* 要强制执行要求，不要使用 `enable_if`。使用 `static assert`\
  \ 来检查模板参数，如果验证失败，提供一个错误而不是选择另一个实现。\n* 当我们的重载集合使得原本可以接受的代码变得晦涩时，使用 `enable_if`。这在隐式转换构造函数中最常见。\n\
  \n### 要有条件地构建成员函数，请使用 `std::enable_if`\n\nSFINAE 只有在在参数推导中替换模板参数会导致格式不正确的结构时才起作用。不存在所谓的“替换失败”。\n\
  \n我曾有同样的想法，并尝试使用 `std::is_same<T, int>::value` 和 `!`，它返回的值与 `std::is_same<T, int>::value`\
  \ 相同。\n\n那是因为当类模板被实例化时（这发生在其他当我们创建一个类型为 `Y<int>` 的对象时），它会实例化其所有的成员声明（不一定是它们的定义/体！）。它的成员模板也被包含在。此时\
  \ `T` 是已知的，`!std::is_same<T, int>::value` 返回假。结果是名为 `Y<int>` 的类将被创建。\n\n#### 示例\n\
  \n由于 `std::enable_if<false>::type` 指向一个不存在的类型，声明是无效的。结果是我们的软件无法使用。\n\n我们必须让成员模板的\
  \ `enable_if` 依赖于成员模板本身的参数。由于整个类型仍然是依赖的，声明是合法的。模板参数的参数推导发生在我们尝试调用其中一个时，SFINAE 会如预期那样发生。\n\
  \n### 使用 ENABLE_IF 根据条件编译类和函数\n\nC++ 的模板元编程能力允许我们创建处理任何类型的泛型类和函数。这在某些情况下可能是一个问题，因为语言缺乏限制模板类型的方法。然而，我们仍然可以通过利用元编程技术并利用“替换失败不是错误”的概念来实现这一点。本教程将展示如何在模板中使用类型限制。\n\
  \n#### 准备\n\n多年来，开发者一直结合 SFINAE 使用 `enable_if` 类模板来施加限制。\n\n`enable_if` 模板族现在是 C++\
  \ 标准的一部分，它的工作方式如下：\n\n#### 语法\n\n为了使用 `std::enable_if`，我们包含 `<traits>` 头文件。\n\n\
  #### 工作原理\n\n考虑以下 `enable_if` 在不同语境下使用以实现不同目标的示例：\n\n* 根据类模板参数匹配给定条件以激活类模板：\n  \
  \  **示例：**\n* 根据函数模板参数、函数参数或函数返回类型匹配给定条件允许函数模板：\n    **示例：**\n\n为了减少在使用 `std::enable_if`\
  \ 时编写的杂乱代码，我们可以使用别名模板定义两个别名 `EnableIf` 和 `DisabledIf`：\n\n基于这些别名模板，以下定义与上面所示相同：\n\
  \n#### 工作原理\n\n\n\n\n\n如果遇到类似 `func (42)` 的调用，编译器必须寻找一个可以接受 `int` 参数的重载。由于 `int`\
  \ 没有数据类型成员，当编译器创建重载集并将模板参数替换为提供的模板实参时，输出的 `void func (int::data_type const)` 是错误的。编译器不会因为\
  \ SFINAE 而报告错误并停止；相反，它只会忽略该重载并继续。接着它寻找 `void func (int const)`，这是它能找到的最匹配。\n\n如果编译器发现类似\
  \ `func<some type<<int>>(42)` 的调用，它会创建一个重载集，其中包含 `void func(some type<int>::data_type\
  \ const)` 和 `void func (int const)`，在在这种情况下，第一个重载是最佳匹配；此时没有使用 SFINAE。\n\n如果编译器发现类似\
  \ `func (\"string\"s)` 的调用，它将再次依赖 SFINAE 来忽略该函数模板，因为 `std::basic_string` 没有值类型成员。然而，这次重载集中不包含任何与字符串参数匹配的项；结果是，程序是非法的（ill-formed），编译器会发出错误并退出。\n\
  \n类模板 `enable_if<bool, D>` 中没有成员，但其部分特化 `enable_if<true, D>` 包含一个名为 `type` 的内部类型，它是\
  \ `D` 的别名。当作为 `enable_if` 第一个参数的编译语句求值为真时，该内部类型可用，否则不可用。\n\n当编译器发现类似 `mul (2, 3)`\
  \ 的调用时，它尝试用 `int` 替换模板参数 `T`；由于 `int` 是整数类型，`std::is_integral` 求值为真，并会创建一个定义了名为\
  \ `type` 的内部类型的 `enable_if` 特化。结果是`EnableIf` 别名变为该类型的别名，即 `void`（由于 `typename D\
  \ = void` 表达式）。结果是一个 `int mul<int, void> (int x, int y)` 函数模板，可以使用提供的参数对其进行调用。\n\
  \n另一方面，当编译器发现类似 `mul (1.2, 2.4)` 的调用时，它尝试用 `double` 替换模板参数 `D`。由于这不是整数类型，`std::enable_if`\
  \ 条件求值为假，且类模板没有指定内部成员类型。这导致了替换错误，但根据 SFINAE，编译器不会产生错误并将继续执行。然而，由于没有发现备选重载，将无法调用\
  \ `mul()` 方法。结果是，程序被认为是非法的，编译器生成一个错误。\n\n在使用类模板 `pod_wrapper` 时也会出现类似的问题。它包含两个模板类型参数：第一个是被封装的\
  \ POD 类型，第二个是 `enable_if` 的结果，且它们都是 POD 替换。如果该类型是 POD 类型（如在 `pod_wrapper` 中），则来自\
  \ `enable_if` 的内部成员类型就存在，并替换掉第二个模板类型参数。如果内部成员类型不是 POD 类型（如在 `pod_wrapper<std::string>`\
  \ 中），则替换将失败，并带有类似“模板参数太少”的消息。\n\n# C++ 中的属性\n\n属性是现代 C++ 的一项基础元素，它允许程序员向编译器提供额外信息，以便编译器施加约束（条件）、优化代码某些部分或生成特定代码。简单来说，属性是给编译器的注释或标记，为了优化代码并对代码施加特定约束，提供了关于代码的更多信息。它们首次引入\
  \ C++11，并随着后续每个版本的更新而演变。\n\n## C++ 属性的用途\n\n- **强制执行代码约束：** 约束是函数参数为了执行而必须满足的要求（先决条件）。在之前的\
  \ C++ 版本中，指定限制的代码是这样写的。\n\n  **示例：**\n  它提高了我们代码的可读性，并消除了在方法内部放置参数检查代码所造成的混乱。\n\n\
  - **为优化目的向编译器提供额外信息：** 编译器非常擅长优化，但在某些领域仍然落后于人类，并会建议低效的通用代码。这是由于人类对他们所面临的“问题”的信息不足。为了解决这个问题，C++\
  \ 标准包含了一些额外的特性，允许我们告诉编译器比单纯代码语句多一点信息。“probable”（可能的）一词就是其中一个例子。\n\n  **示例：**\n \
  \ 当语句前面跟有 `likely` 时，编译器会对该语句进行特定优化，从而提高代码的整体性能。\n\n- **抑制作者有意保留的代码中的特定警告和故障：**\
  \ 在极少数情况下，程序员可能会刻意产生错误代码，这些代码会被编译器发现并报告为错误或警告。出于特定原因保留在该状态的未使用变量，或者在某些实例后没有插入 break\
  \ 语句的 switch 语句以导致穿透（fall-through）情况，都是例子。C++ 拥有如 `[[maybe_unused]]` 和 `[[fallthrough]]`\
  \ 等属性，可以防止编译器在这种情况下发出警告或错误，从而避免问题和警告。\n\n  **示例：**\n\n## 以下是标准 C++ 属性列表：\n\n1. **noreturn:**\
