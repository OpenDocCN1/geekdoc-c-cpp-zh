  \ 还有一个趣的图表，说明了程序员工资和经验之间的关系。在大多数情况下（例如，平均 .NET 开发者的薪资），增长是稳定且可预测的。收入越高，经验年数越多。涉及到\
  \ `C++` 开发人员工资时，情况稍微复杂一些。初级和初级开发者的薪资相当稳定，但在工作约 5 年后会逐渐增加。可以想象，这是因为 `C++` 是一门难以掌握的语言。学习需要多年，但一旦你精通了，你将获得丰厚的回报。\n\
  \n`C++` 开发者在就业市场上需求很大，因此了解薪资方面的预期情况至关重要。另一方面，`C++` 被广泛应用于各个领域，主要在应用领域。`C++` 是一种广泛使用的编程语言。`Microsoft\
  \ Windows`、`Mac OSX` 和 `Linux` 都是基于 `C++` 和 C 的操作系统，两个最流行的数据库 `MySQL` 和 `Postgres`\
  \ 也是。`C++` 也常用于涉及计算机视觉和高端图形处理应用程序（如视频游戏）的后端技术。`C++` 也适用于嵌入式系统（如智能手表和医疗设备）、金融系统、电话交换机、云存储系统、浏览器和编译器。是什么让\
  \ `C++` 如此受欢迎且为人知的后端技术？它是 `C` 的改进版本，是一种通用的、编译的、静态类型的、大小写敏感且自由的编程语言。`C++` 中的 `STL`\
  \ 提供了广泛的库。`C++` 比其他语言更快，这是该语言最大的优势之一。`C++` 开发者负责编写或修改高效的 `C++` 代码以创建各种应用程序。他们还负责内存问题。换句话说，`C++`\
  \ 开发人员的工作是设计帮助组织运行更顺畅的可执行程序。\n\n其他影响 `C++` 开发者收入的因素：`C++` 的优势在于可以兼容广泛的硬件技术。因此，具有技能的\
  \ `C++` 程序员将一直获得报酬。以下是一些顶尖技能：具有 `Android`、`OS X`、`iOS`、`Windows` 和 `Linux` 的经验，以及数据库（如\
  \ `MySQL` 或 `MongoDB`）、内存管理、`TCP/IP` 协议、持续集成等，具体取决于项目。\n\n根据项目和组织，还需要项目管理技术的知识、算法和数据结构的专业知识、对软件开发生命周期的了解以及熟悉其他编程语言（如\
  \ `C`、`C#`、`Java`、`Python` 等）。\n\n### C++的应用\n\n*   **C++ 游戏**：`C++` 很快且接近硬件。它可以快速处理资源，为\
  \ CPU 密集型任务提供过程编程，并且接近硬件。它可以处理 3D 游戏的复杂性，并具有多个网络层。由于这些优势，它是创建游戏系统和游戏开发套件的首选平台。\n\
  \n\n\n\n\n*   C++ 可以轻松创建大多数基于 GUI 的和桌面应用程序，因为它提供了所有必要的能力。例如，Adobe Photoshop。\n\n\
  *   **数据库管理软件：** 它也被用于数据库管理软件的开发。`MySQL` 和 `Postgres` 这两个最流行的数据库都是用 C++ 开发的。\n\n\
  *   **操作系统：** C++ 是一种构建操作系统的合适编程语言，因为它是强类型且运行速度快。此外，C++ 包含了一大量的系统级函数，有助于底层应用程序的开发。\n\
  \nC++ 有五种不同的职业路径：\n\n1.  **数字电子工程师：** 除了理解电子学知识外，现代电子工程师还需要具备出色的编程技能。`C` 和 `C++`\
  \ 是开发电气设备软件的广泛使用的语言。在这一领域寻找工作时，具备固件控制和其他相关能力将是加分项。\n\n2.  **实时软件工程师：** 嵌入式系统被设计为实时工作。C++\
  \ 提供了让电气设备再次运行所需的低级动力支持。在这些种类型的系统上担任软件工程师时，通常要求具备 C++ 能力。\n\n3.  **多媒体桌面应用编程：**\
  \ 桌面上的多媒体程序——音乐应用、图形设计应用等——依赖于 C++ 的性能。为了帮助构建这些以视觉为向的应用，开发者经常使用库，而这些库有时是用 C++ 编写的。\n\
  \n4.  **软件开发经理：** 持续展示项目领导力（包括指导年轻员工）的高级 C++ 程序员正朝着成为软件开发经理迈进。虽然有些人喜欢技术方面，但那些具有卓越业务意识和沟通能力的人非常适合管理职位。考虑获得一个研究生学位，例如\
  \ `MBA`，在进入管理层之前为你的简历加分。\n\n5.  **DevOps 工程师：** 许多组织使用 DevOps 来推动其软件工程运营，因为他们希望快速高效地构建软件。具备\
  \ C++ 以及其他 DevOps 工具（如 `Docker`、`Kubernetes` 和 `Jenkins`）知识的开发者需求很大。高级软件开发者可以沿着这条路线实现丰富的职业。\n\
  \n如果你想学习如何用 C++ 编写代码，这本书是一个极佳的起点。由于多种因素，我们相信 Android 将继续巩固其全球市场领导地位。\n\n在书中，我们涵盖了广泛的\
  \ C++ 主题。现在，让我们顺序回顾本文的内容，以复习和重申我们中学关于 C++ 的事实和信息。我们在第 1 章中开始讨论 C++ 的基础以及它是如何发展的。编译器具有什么特征？不同类型的编译器有哪些？学习\
  \ C++ 的函数和特性，以及如何在你你的计算机上设置它。在第 2 章中，我们涵盖了 C++ 语法的基础，以及如何编译和运行程序。C++ 的基本术语有哪些，例如分号、块、关键字和注释。我们还学习了各种数据和变量，以及如何使用几个示例来说明类型。此外，`Constants`（常量）和\
  \ `Modifiers`（修饰符）及其许多类型，以及存储类、`operators`（运算符）以及各种类型的 `Loop`（循环）和 `Decision`（判断）语句。C++\
  \ 中的函数是什么？如何声明它？参数是什么？`Numbers`（数字）、`Arrays`（数组）、`Strings`（字符串）和 `Pointers`（指针）是什么？最后，通过各种词汇和示例，我们学习了如何在\
  \ C++ 中处理 `Files`（文件）。\n\n在第 3 章中，我们涵盖了如何在数值类型和字符串类型之间转换数据、数值类型的限制和其他属性，以及如何创建处理过的和原始的用户定义字面量。我们还学习了如何开发字符串助手库，以及\
  \ `std::format` 用于格式化文本。第 4 章将涵盖 `Defaulted`（默认）和 `Deleted`（删除）函数，以及本章中的 `Lambdas`\
  \ 和 `Standard Algorithms`（标准算法）。我们还学习了如何使用带有 `Number of Arguments`（参数数量）的 `Variable`\
  \ 来 `Write a Function Template`（编写函数模板），以及如何使用 `Fold Expressions`（折叠表达式）来简化变变函数模板。学习更多如何使用高阶函数\
  \ `Map` 和 `Fold`。在第 5 章中，我们将学习什么是内存管理以及它为什么至关重要，内存管理运算符是什么以及它们为什么有用。此外，我们将学习什么是动态内存分配、如何动态分配内存，以及为什么内存管理至关重要。对象的\
  \ `new` 和 `delete` 运算符是什么？此外，我们学习学习内存对象和自定义内存。\n\n此外，在第 6 章中，我们将学习几种类型的处理器，如何在 `Visual\
  \ Studio` 中编译我们的基础源代码，以及本章中的预处理指令是什么。此外，我们发现了启用 `if` 的东西是什么，以及何时应该使用它。`enable if`\
  \ 类是什么？它们可能用于在哪些场景？如何使用 `std::enable if` 和 `enable if` 根据条件编译类和函数，以及如何条件地创建成员函数。此外，C++\
  \ 中的 `attributes`（属性）是什么？它们的列表是什么？标准和非标准属性有什么区别？我们如何区分它们？自从 C++11 以来，发生了以下变化，以及\
  \ C++ 和 C# 特性之间的区别。\n\n在第 7 章中，我们关注什么是 C++ 协程、它们有哪些限制、如何执行它们以及当一个开始运行时会发生什么。我们还发现了\
  \ `Heap allocation`（堆分配）和 `promises`（承诺）是什么。协程在计数器获取其承诺对象的最佳方式是什么？我们将在本节介绍 `co_await()`、`co_yield`\
  \ 和 `co_return` 运算符。我们还学习了 `generators`（生成器）是什么以及许多生成器和 `Coroutines`（协程）以及 `C++\
  \ for Effective Async`。\n\nC++ 的发展是非凡的，是一个解决了程序员长期困扰许多问题的突破。虽然这本书是学习这个巨兽的极佳介绍，但你应该继续你的学习之旅以充分理解这头巨兽。祝你好运！\n\
