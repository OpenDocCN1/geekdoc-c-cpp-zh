  \n# 评估\n\nDOI: [10.1201/97810032147628](https://doi.org/10.1201/97810032147628)\n\
  \n如果你看重速度和效率，C++ 是一门非常值得学习的编程语言。由于指针等特性，它是 Unix 系统的主流语言，允许开发者构建自己可以管理的代码。以下是你应该学习这种编程语言的一些原因：C++\
  \ 是一种灵活的语言，它可以与几乎任何其他语言通信，并可以在几乎任何机器上执行和构建程序。它提供了卓越的性能和速度。C++ 是一门结合了高层和低层能力的语言，`MongoDB`\
  \ 数据库就是用这种语言开发的。开发者非常喜欢这种语言，因为它提供了对代码的完全控制。多重继承、模板、运算符重载、预处理器指令以及开发者可能需要的其他功能在 C++\
  \ 中都有。\n\n雇主希望 C++ 开发者具备以下素质：\n\n*   应该具备基础的 C++ 编程经验。\n*   应该熟悉 Unix 和 Linux 等操作系统。\n\
  *   数据库、`SQL` 和 NoSQL 数据库（如 `MongoDB`）都是重要的概念。\n*   需要 `JavaScript` 和 `XML` 知识。\n\
  *   应该熟悉敏捷软件开发技术。\n\n\n\n\n用于竞赛编程的最优语言是 `C++` 和 `Java`。大多数竞赛编程程序员都使用 `C/C++`。`Java`\
  \ 是第二受欢迎的竞赛编程语言。由于每种语言中都有标准模板库 (`STL`) 和 Java 库，`C++` 和 `Java` 是被推荐的语言。由于 `C++`\
  \ 为用户提供了对系统资源的控制，精通程序员可以构建出比其他编程语言构建的更快、更强大的程序。因此，`C++` 是创建游戏引擎、游戏和其他资源密集型应用程序的首选语言。\n\
  \n`C++` 是一种灵活的语言。`C++` 是一种支持多种范式的编码语言。这意味着除了面向对象编程外，它还允许过程编程。这些范式基本上是处理和解决编码挑战的不同方法；两个\
  \ `C++` 程序员可能会以不同的方式处理和解决同一个编码问题。为了获得最佳效果，可能会混合多种范式。\n\n不同的问题解决方法让 `C++` 变得更加困难，但也让它更加强大。总有新东西可以学习。\n\
  \n`C++` 是一种性能导向的语言。尽管 `C++` 被广泛应用于各个领域并可用于开发几乎任何东西，但它在交付性能和有效利用系统资源方面表现出色。由于 `C++`\
  \ 为用户提供了对系统资源的控制，精通程序员可以构建出比其他编程语言构建的更快、更强大的程序。因此，`C++` 是创建游戏引擎、游戏和其他资源密集型应用程序的首选语言。大多数\
  \ AAA 游戏使用 `C++` 开发，因为它们推向了硬件的极限，因此资源效率至关重要。这使得 `C++` 成为某些金融应用程序的选语言，在高频交易平台中，性能的微小变化就可能是盈亏的区别。\n\
  \n`C++` 是一门耗时的学习语言，但从远来看是值得的。由于其复杂性，`C++` 通常被认为比其他语言更“难”学习。它确实比其他某些语言需要更多的时间精力，但它并没有那么困难。如果你需要学习其他\
  \ C 系语言的任何一种，你现在投入的时间以后将会得到回报，因为你已经完成了大部分工作。\n\n作为你投资的回报，你将获得各个领域广泛的职业选择。`C++` 的长期流行反映在高数量的职位空缺中。不仅许多新应用是用\
  \ `C++` 编写的，大量使用该语言的现有系统也需要招聘程序员来保持其最新和更新。\n\n此外，由于 `C++` 应用需要大量的代码来扩展，某些组织要求相当大的开发团队（相对于其他语言）。因此，熟练的\
  \ `C++` 程序员将一直很有需求。最后，许多程序员可能因为游戏开发等领域迷人的职业前景而学习 `C++`。这些是难以进入的领域，需要大量的奉献和努力。\n\n\
