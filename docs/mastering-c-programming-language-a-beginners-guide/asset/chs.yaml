  \ iostreams Shortcomings` 强调了使用区域无关的技术将整数转换为字符串以及将浮点值转换为字符串的重要性。因此，用户在格式化期间可以方便地决定是否使用区域。\n\
  \n### 位置参数\n\n由于不同语言的语序不同，更改格式化参数的能力对于本地化至关重要。考虑以下场景：\n\n使用了 POSIX 位置参数。然而，这些位置指定符是不可迁移的。因为它们与字面量部分交织在一起，C++\
