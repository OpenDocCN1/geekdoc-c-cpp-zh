  \ `Object` 函数。它是类的一种特殊类型成员函数。\n\n构造函数与其他成员函数的区别：\n\n1. 构造函数的名称与类名相同。\n2. 在创建类的对象时，会考虑构造函数。\n\
  3. 构造函数没有返回值。\n4. 当没有指定构造函数时，编译器会产生一个空闲的默认构造函数。\n5. 构造函数有三种：\n    1. 默认构造函数\n  \
