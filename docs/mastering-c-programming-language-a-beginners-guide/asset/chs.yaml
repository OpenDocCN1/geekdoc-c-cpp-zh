  \ `I` 放在返回对象中会更方便；然而，由于返回对象的构建方式，目前还没有优雅的方法可以做到。\n\n使用 `std::coroutine traits`，编译器根据协程的返回类型确定\
  \ `Promise` 类型。\n\n让 `R` 和 `Args…` 分别表示协程的返回类型和参数类型列表，而 `ClassT` 和 `/*cv-qual*/`（如果有）分别表示当协程被声明为非静态成员函数时，它所属的类类型及其\
