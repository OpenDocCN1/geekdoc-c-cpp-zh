  \ 单引号和双引号：`‘ “`\n* 折号号：`-`\n\n**示例：**\n\n## STD::STRING\n\nC++ 在其定义中包含了一种方法，可以将一系列字符表示为类对象。`std::\
  \ string` 是该类的名称。`String` 类将字符存储为字节序列，并具有获取单个字节字符的能力。\n\n字符数组对比 `std:: string`：\n\
  \n* 字符数组只是字符的集合，可以以空字符结束。字符串是一种对象，可以表示为连续字符流。\n* 字符数组的大小必须静态分配；如果需要额外的内存，则无法在运行时分配。对于字符数组，任何分配但未使用的内存都是浪费。而在字符串情况下，内存是动态分配的。在运行时可以根据需要分配更多内存。由于没有预分配内存，因此没有内存浪费。\n\
  * 对于字符数组，存在数组退化的风险。由于字符串被表示为对象，因此不存在数组退化。\n* 字符数组的实现比 `std:: string` 实现快。与字符数组相比，字符串的实现较慢。\n\
  * 字符数组中没有许多操作字符串的内置函数。`String` 类提供了许多功能，能够实现各种字符串操作。\n\n### 字符串操作包括\n\n#### 输入函数\n\
  \n* `getline()`：此函数将用户输入的字符流存储在对象内存中。\n* `push back()`：使用此方法在字符串末尾插入插入一个字符。\n* `pop\
  \ back()`：此方法在 C++11 中引入（用于字符串），用于删除字符串的最后一个字符。\n\n**示例：**\n\n**输出：**\n\n### 容量函数\n\
  \n* `capacity()`：此方法返回字符串的容量，该容量可以等于或大于字符串的长度（size）。当向字符串中引入额外字符时，会留出额外的空间以快速完成操作。\n\
  * `resize()`：此方法更改字符串的长度，允许其增加或减小。\n* `length()`：此方法返回字符串的长度。\n* `shrink to fit()`：此函数减小字符串的容量，直到其等于字符串的最小容量。如果我们确定不再需要添加字符，可以使用此方法来节省内存。\n\
  \n**示例：**\n\n**输出：**\n\n### 迭代器方法\n\n* `begin()`：此方法返回指向字符串中第一个字符的迭代器。\n* `end()`：返回指向字符串末尾的迭代器。\n\
  * `rbegin()`：此方法返回一个指向字符串结尾的反向迭代器。\n* `rend()`：此方法产生一个指向字符串开头的反向迭代器。\n\n**示例：**\n\
