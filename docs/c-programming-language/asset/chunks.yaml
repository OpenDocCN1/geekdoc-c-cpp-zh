  raw: 'As has already been noted, you can write a C program in lines as few as three
    or as many as you wish. The text files need to have the extension, “.c”. You can,
    for example, write hi.c, when your source statement contains, hi. To write your
    C program, you use a text editor like vi, vim, Emacs and such others. Essentially,
    you use a text editor to enter your statements from the source to the program,
    using your chosen language, say, the C programming language.


    IBM is known for using XEDIT as their text editor, and operators who use UNIX
    systems are known for using Emacs as well as vi as their preferred text editors.
    For fresh starters, vi stands for visual editor. In accomplishing laying out commands,
    it uses keystroke combinations in place of menus, making it faster than most other
    text editors. You may also like the Pico text editor if you are entirely new in
    using UNIX systems.


    Setting the Environment


    In this chapter, you are going to learn how to set up your C programming environment,
    if that is the way you want to go. Otherwise, if you simply want to test how successful
    you are in writing in the C language, you can log onto [http://www.compileonline.com](http://www.compileonline.com).
    In setting the environment required for the C programming language, you need to
    ascertain that the computer you are using has two specific software tools, namely,
    the text editor and the C compiler.


    (1) Role of the text editor tool


    This is the tool to use when doing the actual typing of your program. Besides
    the text editors already mentioned, like the vi and the Emacs, there are others
    like the Windows Notepad, the OS Edit command, Epsilon, and even Brief.


    When you use a text editor, what you create goes by the term, source file, and
    what it contains are the source codes for your program. As noted earlier, C programs
    have the extension “.c”.


    The text editor is so basic to programming that you cannot begin doing any programming
    without a text editor ready for use. However, with your chosen text editor ready,
    you write your computer program; next you save it in form of a file; and after
    compiling it, you execute it.


    (2) Role of the Compiler


    What, exactly, is a compiler? Well, you can term it a computer program, though
    sometimes its make-up is a combination of more than one computer program. What
    is its role in the C language? The role of the compiler is to make the source
    file you have created usable by your computer. In short, as it is initially, the
    source code that you have written in your source file is the human readable source
    that is now contained in your program. Yet you would like that source code put
    into binary form, which is what your target computer language is made of. Once
    you are done, you will have translated your source code into object code, the
    term used after the process.


    So, a compiler effectively compiles your source code into your chosen machine
    language, making it possible for your computer’s CPU (Central Processing Unit)
    to execute your instructions, and finally producing executable programs. You will
    often have a ready compiler on the net, which you can use free of charge. Many
    programmers prefer using GNU C/C++ compiler, although, depending on the operating
    system one has, some go for HP and sometimes Solaris. The reason you see C and
    C++ put together is that what works for the C language also works for C++.


    Installing your GNU C/C++ compiler:


    It is not surprising to find the compiler already installed on your system, particularly
    when your computer is using either Linux or UNIX, so it is good to check before
    proceeding to install afresh.


    Checking If Your Computer Has The Compiler


    How do you check? Simple – after opening a terminal, try and locate, say, your
    Linux C compiler. And the way to do this is by using the which-command: $ which
    gcc. If your machine actually has the C compiler, you will, very likely, see the
    output, /usr/bin/gcc. That /usr/bin is, obviously, a directory.


    Now, to see the compiler version that you have, you need to type, $ gcc –v as
    your command, within the command line available.  Just in case your computer already
    has the compiler you are looking for, the message you will receive will look like
    this:


    Using specs already built in


    Target: i386-redhat-linux


    Configured with: ../configure—prefix=/usr .......


    Thread model: posix


    gcc version 4.1.2 20080704 (Red Hat 4.1.2-46)


    Installing a Linux/UNIX Compiler 


    Suppose your computer does not have the compiler installed? Well, you will have
    to do the installation yourself. Luckily, it is an easy process. All you need
    to do is log onto [http://gcc.gnu.org/install/](http://gcc.gnu.org/install/),
    and follow the simple guidance provided on the site.


    Installing The Mac OS X Compiler


    However, in case your computer is using the Mac OS X, and not Linux or UNIX, you
    can log onto the apple website, developer.apple.com/technologies/tools/, and then
    download the relevant code, which happens to be Xcode. The site gives instructions
    that are easy to follow, so installation of your Xcode development environment
    should be relatively easy. After you have the environment ready, you will be in
    a position to make use of the GNU compiler in relation to the C programming language.


    Installing the Windows compiler


    What you need to do in case your computer is using Windows, is to log onto [www.mingw.org](http://www.mingw.org),
    which is actually the homepage for MinGW, and by clicking on the link provided
    you will be able to download the MinGW, which is the compiler you need for your
    computer. During the process, you should be able to ascertain that you are downloading
    a version of MinGW that is current – the latest. Just to be sure you are downloading
    the correct program, see that it reads something like: MinGW-<version>.exe.


    Note too that there is a minimum set of programs you need to download for Windows
    if you want to have your compiler working as required. They include gcc-core;
    gcc-g++; binutils, as well as MinGW runtime. You could install others as well,
    but those mentioned make the bare minimum. Remember to include to the PATH variable
    the sub-directory, bin, as you install your MinGW, reason being that it will help
    you specify tools in the command line just by looking at their names, which are
    relatively simple. After successful completion of your installation, you should
    be able to run the tools you downloaded right from the command line – tools like
    the gcc; ranlib, and the rest. 


    # Chapter 3: The C Structure and Data Type


    It is important that you know how the structure of C looks like at the bare minimum,
    before you can proceed to learn what its main building blocks are. Once you know
    these basics, they will become your reference points as you learn more about the
    C language.


    Here are the basic components of the C program:


    1.  The pre-processor commands


    2.  The functions


    3.  The variables


    4.  The Statements as well as Expressions


    5.  The comments


    Example


    Let us use our example: “Hello, learners!” What code could we use to print those
    words?


    (i)  First of all, you would have your first program line as: #include <stdio.h>,
    being your pre-processor command.


    (ii) Your next would contain: int main(), being the program’s main function; and
    that is where the program begins to execute commands.


    (iii)  The line that follows is: /*...*/. The compiler usually ignores it because
    it is where you are meant to add your comments if you so wish. You call such lines
    simply comments. Just for illustration’s sake, you could enter the comments: /*
    beginning to learn C */.


    (iv)  The next line that follows is: printf(...); and that is the line that enables
    your message, “Hello, learners!” to appear on your screen. So, essentially, after
    your entry, you will have: printf(“Hello learners!\n”)


    (v)  Finally, you have the next line returning the value 0 and terminating the
    main function, (). 


    Compiling and Executing the C language program'
