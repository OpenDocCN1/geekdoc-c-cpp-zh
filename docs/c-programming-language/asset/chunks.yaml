  trans: "\n\n(5) `C`语言同样不具备命名空间的概念。\n\n(6) 而且它还缺少构造函数和析构函数的设计理念。\n\n纵观优势与劣势的全局对比，显然优点远远超过了挑战。实际上，这些挑战中的大部分都较为轻微，用户完全可以在不损害其工作或使用的前提下与之共存。\n\
    \n# 结论\n\n终于有了一本提供简单 C 语言编程技巧的书，这真是太棒了！所有想了解 C 语言精髓的人现在都可以从这本书中学习：*《C 程序设计：初学者终极指南》*\
    \ 。\n\n如果你已经读完它 ，我希望你现在明白了为什么 C 在程序员和其他精通技术的计算机用户中依然流行 。你还应该知道 ：它支持哪些数据类型 ；如何存储及检索数据；以及众多使其在当今市场中脱颖而出的细节——远超其他许多编程语言的特性\
