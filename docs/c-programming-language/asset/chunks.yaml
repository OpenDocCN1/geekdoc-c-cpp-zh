    parameter value through the formal parameter.


    (iii)  It is important to appreciate during your calling of the C function that
    the actual parameter and the formal parameter have varying memory.


    You also need to take note of the difference between the actual parameter and
    the formal parameter. Here lies the primary difference: 


    *   The actual parameter is effectively the one used in the course of a function
    call.


    The formal parameter happens to be the argument that you use within the function
    definition.


    # Chapter 9: Structures and Union in C


    The general meaning of C structures as represented by the C keyword, struct, is
    a data type declaration of a complex nature, which defines a variable list whose
    items are grouped under a single name within a memory block. It makes it convenient
    to reach individual variables through just one pointer.


    As such, when we speak of structures in the C programming language context, we
    are referring to a data type that is user defined, and which facilitates combination
    of data items that are varied in nature. Structures effectively stand for records
    just the same way you safeguard literature in libraries. This enables you to track
    down details about the book title, the author and such other pertinent details.


    Here is the syntax of struct:


    Struct structure_name { //statements};


    In case you want a C structure that reflects the dictionary name, its prices as
    well as its number of pages, you could have it as follows:


    Struct Dictionary { char name [15]; int price; int pages; };


    How To Define C Structure


    It is necessary to utilize the struct statement in defining the structure of the
    C language, a statement that is good at defining fresh data type that happens
    to have in excess of one member. Important to note too is the fact that it is
    optional to use a structure tag. As you do your definition, you need to appreciate
    that every member definition is an ordinary variable definition, as exemplified
    by int i; float f, and such other valid definitions that are variable based. Before
    you insert the semi-colon, you are at liberty to specify additional structure
    variables. Being at liberty, of course, means that you do not have to.


    When you want to declare structure variables, remember it is all right and doable
    to declare the variables after you have completed defining the structure itself.
    Act


    Declaring Structure Variables


    It is possible to declare variables of a structure, after the structure is defined.
    Structure variable declaration is similar to the declaration of variables of any
    other data types. Structure variables can be declared in following two ways.


    Getting Access To Structure Members


    How do you access structure members? You accomplish this by using what is known
    in C as member access operator, which is coded as period (.). That code exists
    right between the name of the structure variable and the very structure member
    you are trying to have access to. The keyword to use in trying to define any variable
    of the structure kind is struct. 


    Just to alert you, a structure can pass for a function argument in C, just as
    you do with other variables or even pointers. Here is an example:


    #include <stdio.h>


    Relating Pointers With Structures


    It is also possible to define a pointer to a structure just as you are able to
    define a pointer to a variable of any kind. Here is a fitting example:


    struct dictionaries * struct _pointer;


    Hereafter you can always store the particular address associated with a structure
    variable within the pointer variable just defined above. What you need to do in
    order to locate the actual address associated with a structure variable is to
    place the operator, &, right before the name of the structure.


    Here below is a fitting example:


    Struct_pointer = &dictionaries1;


    To succeed in accessing the members of any structure by use of a pointer associated
    with the structure, you need to make use of operator, ->.


    Here below is a suitable illustration:


    struct_pointer->title;


    Bit Fields


    What are they? Bit fields is generally a term applied, within the computer programming
    arena, to encompass storage of multiple neighboring bits that bear logic; also
    in situations where sets of bits as well as single bits are easily addressed.
    The bit field often represents integral kinds of already known bit=width, one
    that is fixed in nature.


    Another thing you need to know about bit fields is that they facilitate data packing
    within a structure. This comes in handy particularly in times when data storage
    or the memory in general, is at a real premium. You will find more details pertaining
    to bit fields later in the book.


    Union in C


    Do you recall that a computer has storage space in which to store data? Now that
    is very central in explaining what union in the C programming language is because
    union happens to be some special data type, which facilitates taking into the
    computer memory varied data types. In C, union is almost similar to structure;
    actually being more like a derived mode of structure. In fact, the main difference
    you will see is in the definition, and only on the part of the keyword. Whereas
    you use struct when defining structure in C, with union in C the keyword you use
    is union.


    Still, you need to note that even when the union comes with a number of members,
    it is only one of them that can bear value at any one time. Suffice it to say,
    it is the union, this special data, which enables the memory to work with efficiency
    even as it handles different tasks.


    You can define a union this way:


    union car { char name [20] ; int price ; } ;


    In order to appreciate better what a union is, you need to take the union statement
    into account, where you will notice the new data type being laid out with its
    numerous members, all helping in running your program.


    Below is the union statement format:


    Union [union tag] { member definition; member definition; ... member definition;
    } [a single or several union variables];


    Something else you need to note is that it is optional for you to use a union
    tag. You also need to know that every one of your member definitions is basically
    an ordinary variable definition, such as, int i; float f; or any of those other
    variable definitions that are valid. 


    How would you define data of a union type that bears three members, i, f, as well
    as str?


    To accomplish this, you need first of all to have it clear in your mind that the
    minute you finalize the definition of the union, and even before you can insert
    your ending semi-colon, there is room to specify a union variable, or even multiple
    of them. Note you have room to do that but you are not obliged to do it – it remains
    optional.


    Here is how you define the data with three members:


    union data { int i; float f; char str[20]; } data;


    What becomes clear is that your data type variable is capable of storing an integer,
    a floating point number, and sometimes even a whole string of characters. So you
    end up having that one variable that is, certainly, in a single memory location,
    being utilized as storage for multiple data types. Gladly, it is possible for
    you to utilize a built in data type of your choice, or a user defined data type
    within a union, all depending on the prevailing requirement.


    Another important thing to know is that you need not worry about accommodation
    of a large union member because the memory a union occupies happens to be sufficient
    to accommodate the largest of your union members.


    If you consider the example provided immediately above, the data type is ready
    to occupy memory space of 20 bytes; reason being that 20 bytes happens to be the
    maximum space that a character string can occupy. If you would like to know the
    size of the entire memory that the above union has occupied, here it is:'
