  trans: "\n\n此循环的工作原理与 `while` 循环几乎相同，但有一处不同。它的循环体在检查测试表达式之前就会执行。只有在初始执行之后，才会对测试表达式进行求值。如果测试表达式被证明为真，则\
    \ `do...while` 循环的体会再次执行。重复过程将一直持续，直到测试表达式返回零（`0`）值；这意味着它变为假。\n\n这就是 `do...while`\
    \ 循环的语法格式所示：\n\n```\ndo { statement; } while ( condition );\n```\n\n你需要注意语句所在的位置——它不是像其他循环那样位于末尾，而是在正开头；位于条件之前。原因是什么呢？正如前面提到的，`do...while`\
    \ 循环内的语句在测试条件之前，必须至少执行一次。因此，该循环中的条件位于最后面。\n\n### 1. 嵌套循环\n\n当你发现自己在前面提到的循环内部还有其他循环时，你所处理的就是嵌套循环——这些循环包括\
    \ `while`；`do...while`；甚至甚至是 `for` 循环。\n\n#### a) 嵌套 `for` 循环的语法格式如下：\n\n```\n\
    for ( init; condition; increment ) { for ( init; condition; increment) { statement;\
    \ } statement }\n```\n\n#### b) 嵌套 `while` 循环的语法格式如下：\n\n```\nwhile(condition)\
    \ { while (condition) {statement;} statement; }\n```\n\n#### c) 嵌套 `do...while`\
    \ 循环的语法格式如下：\n\n```\nDo { statement; do { statement; } while (condition);\n```\n\
    \n### 2. 无限循环\n\n你是否设想过某种情况，即给定条件永远不会变为假？这类情况就需要使用 `for` 循环。当然，在三个 `for` 表达式中，没有一个是是必须。所以，你最终得到一个无尽的循环，仅仅是因为你的条件表达式将会为空。这就是你得到无尽——或无限循环的原因。万一你想终止你的无限循环，只需同时按下\
    \ `Ctrl + C` 键即可。\n\n# 第 8 章：C 编程中的函数\n\n你如何定义一个函数？嗯，对于 C 编程语言而言，函数可以被视为一组执行任务的语句，而不是作为独立的语句执行。你会在每个\
    \ C 程序中找到一个函数，即使它只有一个。本质上，你始终拥有一个 `main` 函数。其他函数作为由可能存在的简单程序定义的附加项出现。如果你愿意，可以将函数看作一个代码模块，它可以很方便地接收信息——那些传统上被称为\
    \ `parameters`（参数）的符号名称的信息——然后进行某些计算，并通常返回一些新的信息。当然，函数返回的信息取决于所捕获的参数信息。\n\n`main`\
    \ 函数有什么独特之处吗？是的，有的。尽管在处理时你把 `main` 函数当成任何其他函数对待，但它的独特之处在于，每当你作为计算机用户开始运行程序时，它是操作系统需要运行的唯一函数。简而言之，每当你开始运行机器时，第一个执行的代码就是\
    \ `main` 函数。\n\n以下是 `main` 函数的结构化外观所示：\n\n| Int | //如果成功，预期返回零 (0) |\n| :--- |\
    \ :--- |\n| `Main()` | //这里是放置名称的地方，就此而言，是 main |\n| {} | //这里是放置大量代码的地方；即函数体\
    \ |\n\n在 C 语言中，代码被分为不同的函数，你可以根据自己的意愿进行划分。然而，从逻辑角度考虑，你需要将代码分配到现有的函数中，使每个函数都执行一个定义的任务。你实际上需要将每个\
    \ C 函数视为程序中的一个主要构建块。简单来说，你运行的每个 C 程序都是通过使用函数编写的。这样做是为了使程序能够重复使用并保持一致的效率，同时也使其更易理解。\n\
    \n当你继续学习 C 编程时，你会遇到一些术语，并需要知道它们在相关语境中的含义。其中一个术语就是函数声明。\n\n## 函数声明\n\n你还记得函数是什么吗？函数声明本身负责指示编译器关于函数名、返回类型以及函数参数。而函数体实际上是源自函数定义。\n\
    \n以下是函数定义在 C 中通常采用的格式：\n\n```\nReturn_type function_name( parameter list ) {function\
    \ body}\n```\n\n下面是函数定义的组成部分，包括头部和体，它们是主要部分：\n\n### 1. 返回类型\n\n预计函数将返回一个值；而且它确实可以返回。现在，该值具有特定的数据类型。该数据类型就是我们所说的\
    \ `return_type`。然而，正如你可能已经注意，有些函数在程序中运行良好，但它们并不返回值。在这种情况下，我们声明 `return_type` 为\
    \ `void` —— `void` 是 C 语言的关键字之一。\n\n### 2. 函数名\n\n这是函数的精确名称。\n\n### 3. 参数\n\n\
    首先，你需要意识到，在 C 编程的函数中，你不一定需要处理参数。然而，当你拥有它们时，知道它们由什么组成很重要。你实际上可以像处理占位符一样获取参数。当你启动函数时，你给参数一个值。你可以引用这个值称为实际参数；或者说是\
    \ `argument`。\n\n从参数你得到 `parameter list`；这涉及到函数拥有的类型。如果你将参数列表添加到函数名，你得到的就是函数签名。\n\
    \n### 4. 函数体\n\n当涉及到函数体时，你在其中找到的是定义实际函数的语句集合。\n\n## 为什么要使用函数？\n\n让我们总结一下使用函数的重要性：\n\
    \na) 避免重复编写程序代码的任务\nb) 当你需要类似的功能时，可以调用函数\nc) 得益于函数，你可以在任何时间、任何地方访问程序\nd) 函数使你能够且方便地跟踪大型程序。因为你面对的不是原始的海量数据，而是被分解为逻辑函数的数据。\n\
    \n## C 函数如何工作\n\nC 函数有三个不同的方面，即：\n\ni) 原型，你也可以将其称为函数声明。它的作用是让编译器了解函数名、函数参数以及返回值的数据类型。函数声明的语法为：\n\
    \n```\nreturn_type function_name( argument list );\n```\n\nii) 函数调用。这是实际函数的调用者。它的语法为：\n\
    \n```\nfunction_name( arguments list );\n```\n\niii) 函数定义。这是你找到所需的全部语句集合的地方。函数定义的语法为：\n\
    \n```\nreturn_type function_name( arguments list ) { body of function; }\n```\n\
    \n你需要记住，在 C 程序中调用函数之前，声明函数并清晰地定义它是非常重要的。\n\n 调用 C 函数\n\n当在程序内部调用 C 函数时，最好的方法是：\n\
    \ni) 按值调用\nii) 按引用调用\n\n### 按值调用 C 函数\n\ni) 当按值调用 C 函数时，你将变量的值直接传递给 C 函数的参数状态。\n\
