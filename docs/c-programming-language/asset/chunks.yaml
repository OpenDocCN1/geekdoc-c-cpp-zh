- fmt: "\nThis loop is works almost similarly to how the `while` loop works but for\
    \ one difference. Its body gets executed even before it can check the test expression.\
    \ It is only after that initial execution that the evaluation of the test expression\
    \ takes place. In the event that the test expression is proven to be true, the\
    \ `do...while` loop’s body gets executed once again. The repetition process then\
    \ continues till such a time as the test expression returns a zero (`0`) value;\
    \ meaning it turns false.\n\nThis is how `do...while` loop syntax looks like:\n\
    \n```\ndo { statement; } while ( condition );\n```\n\nYou need to take note of\
    \ the position of the statement – not at the end as in other loops, but right\
    \ at the beginning; preceding the condition. Reason...? As pointed out earlier,\
    \ the statement within the `do...while` loop must, of necessity, execute at least\
    \ one time before it is time to test the condition. Hence the condition in this\
    \ loop comes last.\n\n### 1. Nested loops\n\nYou are dealing with nested loops\
    \ when you find yourself with loops within the other loops already mentioned –\
    \ the `while`; the `do...while`; or even the `for` loop.\n\n#### a) This is how\
    \ a nested `for` loop syntax looks like:\n\n```\nfor ( init; condition; increment\
    \ ) { for ( init; condition; increment) { statement; } statement }\n```\n\n####\
    \ b) This is how a nested `while` loop syntax looks like:\n\n```\nwhile(condition)\
    \ { while (condition) {statement;} statement; }\n```\n\n#### c) This is how a\
    \ nested `do...while` loop syntax looks like:\n\n```\nDo { statement; do { statement;\
    \ } while (condition);\n```\n\n### 2. The infinite loop\n\nWould you envisage\
    \ a situation where a given condition never has a chance of turning out false?\
    \ Such are the situations that call for the use of the `for` loop. Of course,\
    \ of the three `for` expressions, none will be required. So, what you end up with\
    \ is an endless loop simply because your conditional expression will, certainly,\
    \ be empty. That is how you end up with an endless – or infinite – loop. And just\
    \ in case you feel like terminating your infinite loop, simply press the keys,\
    \ `Ctrl + C` simultaneously.\n\n# Chapter 8: Functions in C Programming\n\nHow\
    \ would you define a function? Well, for the purposes of the C programming language,\
    \ a function may be termed as that set of statements that perform tasks as one\
    \ and not as independent statements. You will find a function in every C program,\
    \ even if it is just a single one. Essentially what you always have is a `main`\
    \ function. Other functions then come in as additions defined by trivial programs\
    \ that may be present. If you so wish, you can look at a function as a code module\
    \ that readily takes in information – the kind of information that comes in symbolic\
    \ names conventionally referred to as `parameters` – then processes some computations,\
    \ and often returns some fresh information. Of course, the information a function\
    \ returns depends on the captured parameter information.\n\nAnything unique about\
    \ the `main` function? Yes, there is. Although in handling you treat the `main`\
    \ function just like any other function, it is unique in that it is the only function\
    \ that the operating system needs working whenever you, as the computer user,\
    \ begin running your program. In short, every time you begin running your machine,\
    \ the first code to be executed is the `main` function.\n\nHere is how the `main`\
    \ function structurally looks like:\n\n| Int | //if successful, expect to return\
    \ a zero (0) |\n| :--- | :--- |\n| `Main()` | //this is the place for the name,\
    \ which, in this regard, is main |\n| {} | //this is the place for numerous codes;\
    \ being the function body |\n\nIn C, a code is divided into diverse functions\
    \ and you can do the division as you wish. However, for the purpose of logic,\
    \ you need to distribute your code amongst the functions at hand in a way that\
    \ leaves every function performing a defined task. You actually need to take every\
    \ C function as a major building block within your program. Simply put, every\
    \ C program that you have working is written through the use of functions. This\
    \ is done so that the program can be used repetitively and with consistent efficiency,\
    \ and also to make it better understood.\n\nAs you continue working on C programming,\
    \ there are some terms that you will come across and you need to know their meaning\
    \ in the relevant context. One of those terms is function declaration.\n\n## Function\
    \ declaration\n\nDo you recall what a function is? A function declaration, on\
    \ its part, is responsible for instructing the compiler on the function name,\
    \ the return type, as well as the function parameters. And the function body is\
    \ actually derived from the function definition.\n\nHere is the form that a function\
    \ definition generally takes in C:\n\n```\nReturn_type function_name( parameter\
    \ list ) {function body}\n```\n\nHere below are the components of a function definition,\
    \ including the header and the body, which are the main parts:\n\n### 1. Return\
    \ type\n\nIt is anticipated that a function will return a value; and it actually\
    \ may. Now, that value is of a certain data type. That data type is what we refer\
    \ to as `return_type`. However, as you may have already noted, there are some\
    \ functions that go well within the program, yet they do not return a value. This\
    \ is the scenario where we declare that the `return_type` is `void` – `void` being\
    \ one of C’s keywords.\n\n### 2. Function name\n\nThis is the exact function’s\
    \ name.\n\n### 3. Parameters\n\nFirst of all you need to realize that you do not\
    \ have to work with parameters when it comes to functions in C programming. However,\
    \ when you have them, it is important to know what they constitute. You can actually\
    \ take a parameter the way you do a placeholder. What happens is that the minute\
    \ you initiate a function, you give the parameter some value. It is this value\
    \ that you can cite as being the actual parameter; or alternatively, the `argument`.\n\
    \nFrom the parameter, you get a `parameter list`; and this one is in reference\
    \ to the type; as well as the actual number the function has. If you then add\
    \ your parameter list to the function name, what you get is the function signature.\n\
    \n### 4. Function body\n\nWhen it comes to the function body, what you will find\
    \ in it is an assembly of statements defining what the actual function is about.\n\
    \n## Why Use Functions?\n\nLet us summarize why it is important to use functions:\n\
    \na) To save yourself the repetitive task of re-writing the program’s code\nb)\
    \ You can call on the functions any time you need a similar functionality\nc)\
    \ You always have access to the program anywhere and anytime, thanks to the functions\
    \ that keep the program stable and working even when your machine is off.\nd)\
    \ Functions make it possible and easy for you to track a huge program. This is\
    \ because you are not faced with plain massive data but data that is broken down\
    \ in logical functions.\n\n## How C Function Works\n\nThe C function has three\
    \ distinct aspects, namely:\n\ni) The prototype, which you can also term function\
    \ declaration. What this one does is keep the compiler informed on the issues\
    \ of function name; the function parameters; as well as the return value of the\
    \ data type. The syntax for the function declaration is:\n\n```\nreturn_type function_name(\
    \ argument list );\n```\n\nii) The function call. This is the caller of the real\
    \ function. Its syntax is:\n\n```\nfunction_name( arguments list );\n```\n\niii)\
    \ The function definition. This is where you find the entire set of statements\
    \ requiring execution. The syntax for the function definition is:\n\n```\nreturn_type\
    \ function_name( arguments list ) { body of function; }\n```\n\nYou need to remember\
    \ that it is important to declare a function and to clearly define it before you\
    \ can proceed to call in a C program.\n\n Calling a C function\n\nWhen it comes\
    \ to calling a C function within a program, the best way to go about it is:\n\n\
    i) Calling it by value\nii) Calling it by reference\n\n### Calling a C Function\
    \ By Value\n\ni) When it comes to calling a C function by value, you have the\
    \ variable’s value passed right to the C function in its parameter state.\n"
