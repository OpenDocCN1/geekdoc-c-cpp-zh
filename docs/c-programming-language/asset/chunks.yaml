    \ 1 直接定义为 ONE 一样简单。\n-   另一个不同之处在于处理阶段。在 C 语言中是由编译器决定你的 typedef 含义并进行解释；然而对于#define\
    \ 语句来说则是由预处理器负责处理的。\n\n如何在程序中使用 #define？\n\n这里有一个很好的例子：\n```c\n#include<stdio.h>\
    \ \n#define TRUE  1  \n<FALSE0>\n\nintmain() { \n    printf( “ValueofTRUE:%d\\\
