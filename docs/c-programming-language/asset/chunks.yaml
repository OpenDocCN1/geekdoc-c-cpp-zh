  trans: "\n\n在这一阶段，你需要学习如何保存源代码并运行它。还记得我们提到过输入源代码以便计算机的 CPU 能够相应处理吗？\n\n以下是简单的步骤：\n\
    \n*   打开你的文本编辑器，然后输入你拥有的源代码\n*   接着，以 `hello.c` 为名保存你的文件\n*   下一步是打开命令提示符并切换到刚刚保存文件的特定目录。\n\
    *   到达那里后，键入 `gcc hello.c`\n*   输完后按回车键即可编译代码。如果‘yourprocess’中没有错误存在,你会看到生成的可执行文件：executeablefilegenerated\
    \ –a.out . 现在你需要输入“./”加文件名来运行程序.一切都顺利的话,你应该能在屏幕上看到如下的输出：“Hello learners!”.\n所以基本上来说我们会遇到类似的命令：\n\
    \   \n```bash \n$ gcc hello c .\n ./_.out  \n Hello 。learners！\\\n```\n## C 语言基础语法\n\
    \n为了使任何过程顺利进行并且让你能发出正确指令识别每一个元素是什么至关重要这可以避免混乱并最小化错误因此在 C 编程中我们需要标识符.\n\n### 什么是标识符?\
    \ \n\n在 C 语言编程中高级别的作用域以及作用规则均适用于对象但是当我们谈论具体细节时可使用\"identifier\"(即指代变量函数或其他用户自定义项).其命名规范允许开头发字母\
    \ A 到 Z 有时下划线'_'后面可跟零个或多个字母数字或更多下划线。\n\n注意:\n•  像@ % £等标点符号不能出现在标识符内部.\n •  区分大小写例如\
    \ 'Learners ’会被当作两个完全不同实体 。\n\n以下示例是在编写程序时可以接受的:abc hername30 a40c9 retVal _temp　a\
    \  \n\n有些词永远不会用作常量或变量的名称它们是保留关键字包括 auto else long switch break enum register typedef\
    \ case char extern float return short union unsigned const continue for goto signed\
    \ sizeof volatile default do int if struct static packed while double．\n\n####\
    \ 使用空白                        一整行完全空白的被称为空格但它包含换行字符(如\\n)、制表位、注释它们有什么实际意义？有显示一个语句结束另一个开始通常构成部分各自带有含义组合起来精确传递信息编译器借此正确解读各片段例如:`int\
