  raw: 'The fclose statement closes the text file for you. If what you are doing is
    writing files, you should not expect this function to take place before you initiate
    it. So it is for you to instigate the fclose command at the time you deem appropriate.
    Something else, if in the course of typing your command you omit ‘f’ and type
    only ‘close’, the function will not operate. It is worth noting that the close
    command is entirely different from fclose in C programming.


    You need to note that the fclose function, or fclose(), ordinarily returns a zero
    whenever it is successful. However, whenever it encounters an error while attempting
    to close the file, the result it returns is EOF. This EOF, though meaning End
    of File, happens to be also a constant, which is defined within stdio.h, a file
    in the header. There is also something else that this function does besides closing
    your file – it does flush any pending data, the one remaining in the buffer, and
    sends it into the file before closing the file.


    Any danger if files fail to close in the right manner? Sure! If the affected files
    happen to be many, you run the risk of your program crashing. This is after failing
    to locate any remaining file handles, and probably, running out of memory space.


    Dealing With Printf


    When it comes to the printf statement, you should not expect to see the newline,
    \n, anywhere within the format string. The newline is rendered redundant by virtue
    of the fgets function adding the newline, \n, to each line end after reading it.


    # Chapter 12: C Header Files and Type Casting


    What, exactly, is a header file? It is an important file in C programming, as
    it contains declarations as well as macro definitions, and those are shared amongst
    a good number of source files. What you do when you want to reach a header file
    in C is ensure you have included it in your pre-processing command or directive
    that you issue; and that is by typing ‘#include’. It is actually the same way
    you see the header file that comes with the C compiler having stdio.h.


    The header file has an extension that is denoted as .h and it is the one that
    bears the declarations of the C function as well as the macro definitions. Headers
    in C come in two types, namely:


    *   Programmer written files


    *   Compiler attached files


    When you include a header file, the impact of it is equivalent to having the header
    file content copied. Even then, you are discouraged from attempting to copy a
    header file’s content because you would be risking creating many errors. The danger
    is particularly high in cases where your source files are many within the program.


    Instead of attempting to work on the content in the header file, you need to adopt
    the accepted and widely used practice of keeping a select set of items in your
    header files. Those C items include:


    *   The constants


    *   The macros


    *   The global variables for the system


    *   The function prototypes


    With these properly secured within the header file, you are at liberty to include
    that particular header file as and when you need to.


    How The include syntax Works


    In the working of the pre-processing directive, #include, you as the user, and
    your system header files, are brought together by the program. These are the two
    forms that the directive takes:


    a)  #include <file>


    What this directive initiates is a search through specific system directories
    contained in a standard list. This search is meant to track down a file that bears
    the name, file. As a programmer, you are at an advantage as you can also pre-pend
    directories to the existing standard list. The way to do this is by using the
    –I option as you compile your own source code. 


    b)  #include “file”


    This happens to be the form you are meant to use for your header files whenever
    you are writing using own program. What it does is search for a specific file
    that goes by the name of file, and the place it searches is right within the directory
    with your current file. Here, too, you can pre-pend your directories to the list
    with the existing –I option as you compile your own source code. 


    How The include operation Works


    This one, which you may also refer to as the #include directive, works by simply
    guiding the C pre-processor into scanning some specific file as your input, and
    then proceeding to work with the remaining part of the source file which is current.


    As for the pre-processor output, it has varied categories of output as follows:


    *   The output generated at program initiation


    *   Output emanating from the file you have included


    *   Output emanating from text following execution of the #include directive


    Let us take the example of a header file, say, header.h:


    char *test (void);


    And the main program using the header file is named program.c


    This is generally what you would comprehensively have:


    int x; #include “header.h” int main (void) { puts (test () ); }


    In this case, the compiler will be seeing a token stream similar to the one it
    would see if it was program.c reading. See such a situation here below:


    Int x; char*test (void); int main (void) { puts (test ()); }


    Establishing One-Time Headers


    You need to guard against having headers processed severally so that you end up
    with more than one header, which is basically an error. The way to do this is
    to include the header file only once; the only way there is to ensure the C compiler
    processes it once only. The question is how to go about ascertaining that you
    include your header file only that once. Gladly, there is a standard way of doing
    this, and it also happens to be simple. This standard method involves enclosing
    the entire file contents within a conditional.


    See example here below:


    #ifndef HEADER_FILE


    #define HEADER_FILE


    the entire header file file


    #endif


    This is how our example here, what is referred to as construct, works. It is generally
    known as wrapper #ifndef. When you find yourself including the header a second
    time, be sure the conditional will come out false. This is because the header
    file, (or HEADER_FILE), happens to be already defined. The processor, on the other
    hand, will efficiently ignore the file contents so that the C compiler does not
    get opportunity to see it a repeat time.


    The Workings Of Computed Includes


    It is practical to imagine that you may sometimes have several header files to
    choose from when you want to include one into your C program. However, there may
    be specifications to fulfill, like particular configuration parameters and so
    on. To be able to accomplish your task, here are some conditionals you may want
    to use:


    #if SYSTEM_1 # include “system_1.h” #elifSYSTEM_2 # #include “system_2.h” #elifSYSTEM_3
    ... #endif


    Does this help you accomplish your mission? It sure does – but it brings along
    a problem. If you continue with the above conditionals, soon it is going to prove
    too tedious for comfort or even too clumsy for your concentration. So it is advisable
    to make use of the advantages of C, where you can use a macro to represent a header
    name; a function your pre-processor has enabled. When you do this, you speak of
    utilizing a computed include. In short, you do not write any header name anywhere,
    the way you would do as an #include argument. This is how to use a macro name:


    #define SYSTEM_H “system_1.h” ... #include SYSTEM_H


    Any idea what is going to happen? SYSTEM_H as you see it will undergo expansion.
    In the process, your pre-processor will be seeking out system_1.h just as would
    happen if your #include had been there all along, written as it is.


    C Type Casting


    What do you reckon type casting is within the context of the C programming language?
    It is one of the easiest things you will learn about C. For starters, you can
    define it as a means of converting a variable from what it is, to a different
    data type.'
