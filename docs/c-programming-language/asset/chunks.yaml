- fmt: "\n`fclose`语句用于关闭文本文件。如果你正在执行写入操作，则不应期望该函数在你主动调用之前自动生效。因此，你需要在认为合适的时候自行调用`fclose`命令。另外请注意，如果在输入命令时省略了字母'f'而只输入了‘close’，该函数将不会执行。值得注意的是，在C编程中\
    \ ` close ` 命令与 ` fclose < /code > 是完全不同的。<br /><br />你需要了解的是：当成功无虞时，“加密”即< code\
    \ >“FCLOSE()”；而当试图关闭文件遇到错误时它会返回EOF(File End Of File)。这个 EOF（代表文件的结束）实际上是一个定义于头文件夹\
    \ stdio.h里的常量 ；不过除此之外还有一点值得注意——调用了本函数的另一项工作除了完结你所需外还会清空暂存数据 （即在缓冲区里残余的部分），然后在真正收官前将这些残留内容送进那个待关停的同名档案之下\
