    difference. Its body gets executed even before it can check the test expression.
    It is only after that initial execution that the evaluation of the test expression
    takes place. In the event that the test expression is proven to be true, the do...while
    loop’s body gets executed once again. The repetition process then continues till
    such a time as the test expression returns a zero (0) value; meaning it turns
    false.


    This is how do...while loop syntax looks like:


    do { statement; } while ( condition );


    You need to take note of the position of the statement – not at the end as in
