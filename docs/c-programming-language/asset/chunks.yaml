    \ difference being in its linkage, which happens to be external. It enables a\
    \ global variable or function defined in one program file to be visible across\
    \ every other program file.\n\nYou cannot initialize an `extern` variable; however,\
    \ using this keyword will direct you (or the compiler) to its relevant storage\
    \ location. This usually occurs when multiple files have been created: after defining\
    \ a global function or a global variable in one file and then referencing it from\
    \ another by prefixing that reference with `extern`, you provide a direction—a\
    \ pointer back—to where either was initially defined (or declared). The same applies\
    \ generally for functions as well.\n\n## What Is Linkage In C?\n\nIt simply describes\
    \ how names denoting objects (`varName`) , values (`val`), references(`ref)` templates\
    \ /functions/namespaces/types are handled across translation units during compilation\
