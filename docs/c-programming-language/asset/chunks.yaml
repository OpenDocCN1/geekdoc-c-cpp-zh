    \na.) Scanner      –引入数字字符串空格制表等等..\nb”)Print       -向标的目标介质按照期望写精确形状的序列 。\n``Read\
    \ s''查找下一个词直至句子边界为止存缓冲区区处 .\n最后 flush 缓冲...\n\n为了成功实现有效使用必须正确选择标志允许一些组合包括只读’r',写入‘w`,追加´A´附加能力同时读写清零截断缺失创建前缀加号得到的几种筛选列于下表\
