    ### (x)  {肯星 (Vulcan)

    这是一台位于劳伦斯·利弗摩国家实验室的美国超级计算机。


    ## 1. Mac

    `Mac` 完全运行在 `C` 之上，包括其驱动程序和程序，这适用于它的所有模型，就像 `Windows` 和 `Linux` 中的情况一样。


    ## 1. 手机

    提到 `Windows` 手机、`android` 以及 `iOS`，它们的内核都是 `C` 语言编写的。简而言之，它们的内核编写方式与上述描述的计算机内核相同，只不过它们是移动端的适配版本。


    ## 1. 数据库

    用于金融系统；电信；娱乐；健康和教育系统；通用网络及其他领域的数据库大部分用 `C` 甚至 `C++` 编写的。这些包括最流行的，如 `Oracle`、`MySQL`、`MS
    SQL Server` 甚至 `PostgreSQL`。


    ## 使用 C 语言的主要优势

    1. 它是一门结构化语言。

    2. 对于初学者来说，相对容易学习。

    3. 它在编写程序时非常高效。

    4. 它在不同的计算机平台上表现良好。

    5. 它处理低级活动的能力也很好。


    ## C 语言的日常用途

    对于初学者来说，提供一份 `C` 编程语言常用用途的分类可能会有所帮助。`C` 语言实际上很容易找到，不仅在操作系统中，而且在语言编译器；汇编器；文本编辑器；打印机处理程序；网络驱动程序；语言解释器；实用程序；网络驱动程序；以及前面提到的，在现代程序和数据库中。


    足以说明，`C` 编程语言在现代软件应用程序编写者中非常受欢迎，其中一些被用于 3D 电影和嵌入式系统（如电视、遥控器等）。


    以一种常见的实用物品——汽车为例，以下是使用 `C` 语言编写的某些功能：

    1. 自动变速箱。

    2. 检测车辆轮胎压力的系统。

    3. 监控氧气、温度和机油水平的传感器。

    4. 各种内存类别，包括后视镜设置。

    5. 仪表盘显示。

    6. 防锁死刹车（ABS）。

    7. 自动车辆稳定性控制。

    8. 巡航控制以及气囊控制。

    9. 儿童锁系统。

    10. 气候控制。


    汽车示例只是其他拥有 `C` 语言编写系统的实用物品之一。甚至许多你购买汽水的自动售卖机都有 `C` 语言系统。许多商店的收银机也运行用 `C` 语言编写的程序。


    这些让生活变得相对简单的设备共同点是嵌入式系统，它们像小电脑一样运行，拥有运行 `C` 语言编写程序的微处理器。这就是为什么当有人按下按键时系统会检测到并以预设的方式做出反应。它们还会相应地显示相关信息。许多实用制造商倾向于使用
    `C` 语言编写程序，因为它具有灵活性；提高效率；并且与多种类型的硬件兼容。


    ## 为什么要费力学习 C 编程语言？

    `C` 是今天用户可以使用的唯一编程语言吗？当然不是！程序员和其他计算机用户可以学习和利用其他的编程语言，有些比 `C` 低，有些比 `C` 高且更现代。那么为什么选择
    `C` 呢……


    除了书中已经提到的，还有其他学习 `C` 编程语言的理由。首先，`C` 编程语言在许多其他计算机语言被提出之前就已经存在了。因此，它建立了丰富的源代码库。简而言之，你可以学到很多东西，在这方面有丰富的资源池可以利用。`C`
    还有许多函数你可以用来满足你的程序需求。


    同时，由于 `C` 编程语言已经使用了很长时间，你不可能在使用时遇到无法快速获得解决方案的挑战。多年来，`C` 用户在互联网上发布问题并从其他用户专家那里获得解答，你可以从中学习很多关于
    `C` 的知识。


    # 第 2 章：设置本地环境

    在尝试学习新事物时，有一个策略通常会很有。在学习 `C` 编程语言的情况下，必须从基础过渡到更复杂的方面。这就是为什么我们在书的开头介绍了 `C` 的起源以及它是如何帮助构建其他编程语言的。


    ## 准备学习 C 编程语言

    下载并安装编译器是一个好主意。尽早这样做的理由是为了有一个程序可以解释你的 `C` 代码，并将其转换为计算机友好的信号。


    是否有通用的编译器？

    答案是否定的，因为有些程序适用于 `Windows` 但对其他操作系统不太友好，或者适用于 `Linux` 但对其他操作系统不太友好。


    这里有一些用的建议：

    * 如果你的电脑运行在 `Windows` 上，请安装 `Microsoft Visual Studio Express` 甚至 `MinGW`。

    * 如果你的电脑运行在 `Mac` 上，请安装 `XCode`。

    * 如果你的电脑操作系统是 `Linux`，请安装 `gcc`。


