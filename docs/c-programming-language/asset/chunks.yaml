    0 indicating octal, and of course nil marking a decimal. 


    You can also have a suffix on an integer literal, for example, U combined with
    L to denote unsigned and long, in that respective order. You also need to appreciate
    that when it comes to the suffix, both the upper and lower cases are acceptable.


    Here below are some great examples of literal integers:


    | 078 | /*Illegal: 8 is not an octal digit*/ |


    | 215u | /*Legal*//* |


    | 032UU | /* Illegal: cannot repeat a suffix*/ |


    | 212 | /*Legal*/ |


    | OxFeeL | Legal*/ |


    Additional examples of varied integer literals:


    | 85 | /* decimal */ |


    | 30 | /* int */ |


    | 30u | /* unsigned int */ |


    | 0213 | /* octal */ |


    | Ox4b | /* hexadecimal */ |


    | 30l | /* long */ |


    | 30ul | /* unsigned long */ |


    The Floating Point Literals


    Floating point literals have combinations of parts – some integers, others decimal,
    some fractions, and still some exponents. When it comes to representation, these
    literals are shown in decimal; otherwise exponential.


    In times when your literals are coming in decimals, you need to remember the decimal
    point; and sometimes both the decimal point and the exponent. Then when the literals
    are coming in exponential form, you need to factor in the integer; fraction part;
    and sometimes you add the part that is fraction to that integer. Note that your
    signed exponent needs to be preceded by an e or E. 


    Here is some demonstration of floating point literals:


    | 510E | /* Illegal: incomplete exponent */ |


    | 3.14159 | /* Legal*/ |


    | 314159E-5L | /* Legal*/ |


    | .e55 | /* Illegal: missing integer or fraction */ |


    | 210f | /* Illegal: no decimal or exponent */ |


    The Character Constants


    Character literals come in single quotes, for example, ‘x’. The character literal
    is then stored as a char type; just being one simple variable. You need to note
    that although it is fine to have simple character literals, sometimes you are
    called upon to create an escape sequence.


    Example of such an escape sequence:


    ''\t''), or just a universal character like ''\u02C0'').


    Something else worth noting is that you can vary the meaning of a character constant
    just by preceding it with a backlash. Good examples are the newline, which is
    represented by \n; and the tab, which is represented by \t. In short, you can
    have character literals being plain characters, as in x; escape sequence, as in
    \t; and even as universal character, as in \u02CO. 


    Further Demonstrations of Escape Sequence Codes:


    | Escape Sequence Codes | Meaning |


    | \\ | \character |


    | \’ | ‘character |


    | \” | “character |


    | \? | ?character |


    | \a | Alert (or bell) |


    | \b | Backspace |


    | \f | Form feed |


    | \n | Newline |


    | \r | Carriage return |


    | \t | Horizontal tab |


    | \v | Vertical tab |


    | \xhh ... | Hexadecimal number of one or more digits |


    | Example of ‘Hello, learners’ in Escape Sequence |


    | #include <stdio.h> |


    | int main() |


    | {printf(“Hello\tlearners\n\n”); return 0} |


    |  |  |


    The escape sequence code after execution


    After the sequence code above has been compiled and also executed, the result
    you get is as follows:


    | Hello  learners |


    The String Literal


    As for the string literals or string constants, you need to know that they are
    enclosed within quotes, as in (“”). That string has characters that are plain,
    escape sequence or universal. Something else worth noting is that the characters
    in string literals never come in singular; always as two or more.


    Ordinarily, you begin your string literal with a backlash (\); and then you follow
    it up with characters that will determine the ultimate interpretation of your
    escape sequence. Just for example, if you want your computer to bring out newline,
    what you type as your escape sequence is \n.


    As for the universal characters, they are those that represent Unicode code points
    within the string literal. These are the ones you write like \uxxxx or \Uxxxxxxxx.
    X in this context represents one hex digit. What we are essentially saying is
    that you have the escape sequence, \uxxxx playing the role of marking or representing
    xxxx as the code point.


    Although string literals are sometimes long, you have an opportunity to break
    them by the use of white spaces. Here below is an example of three ways you can
    break one literal string, so that you end up with the same string in three identical
    forms:


    | “hello, learners” | “hello, \ learners” | “hello, “ “l” “earners” |


    Manner of Defining Constants


    When it comes to defining constants for use in the C language, this is done in
    two main ways:


    (i)  By a pre-processor: #define


    (ii) By a keyword: const


    Pre-processing is the first thing that happens compilation is going on in the
    C program. It is a feature strictly unique to C language programming compilers.
    It is also important to note that every directive being undertaken by the pre-processor
    begins with #. By directive here we mean command.


    The benefits that come with the C pre-processor include:


    *   Easy process of developing programs


    *   It is relatively easy to read


    *   It is similarly easy to modify


    *   Its C code is easy to transport to varying machine architectures.


    # Chapter 5: C Storage Classes


    What does a storage class got to do with the C language? Storage classes in C
    actually play a big role in the name declaration syntax. A storage class indicates
    the scope the variables cover and also the duration they are to remain stored
    – what you can call their lifetime. It also controls its linkage. In the C programming
    language, storage classes are four.


    Here are C’s storage classes:


    1.  Auto


    This is C’s default storage class for every local variable. Its storage duration
    is automatic and it operates within functions.


    1.  Register


    The term register is used here because the storage class specifier prompts the
    compiler to put the object in question within the register in the processor. As
    for storage, the duration here is also automatic. The uniqueness with the register
    storage class is that it helps identify any local variable that needs to be stored
    within the register as opposed to being held within RAM (Random Access Memory).
    This automatically means that the size of your variable cannot exceed that of
    the register. Ordinarily that size which is meant to fit the register is only
    a single word; without adding something like & as there is no memory location
    for it.


    1.  Static


    This is the same one sometimes referred to as thread storage. Its storage is static
    and has internal linkage. What this static storage class does is give indication
    to the compiler that the local variable needs to be spared as long as the program
    lasts. This is as opposed to it being destroying it when it gets out of scope.
    Owing to this manner of functioning, the variables retain their exact values in
    between function calls.


