    + C simultaneously.


    # Chapter 8: Functions in C Programming


    How would you define a function? Well, for the purposes of the C programming language,
    a function may be termed as that set of statements that perform tasks as one and
    not as independent statements. You will find a function in every C program, even
    if it is just a single one. Essentially what you always have is a main function.
    Other functions then come in as additions defined by trivial programs that may
    be present. If you so wish, you can look at a function as a code module that readily
    takes in information – the kind of information that comes in symbolic names conventionally
    referred to as parameters – then processes some computations, and often returns
    some fresh information. Of course, the information a function returns depends
    on the captured parameter information.


    Anything unique about the main function? Yes, there is. Although in handling you
    treat the main function just like any other function, it is unique in that it
    is the only function that the operating system needs working whenever you, as
    the computer user, begin running your program. In short, every time you begin
    running your machine, the first code to be executed is the main function.


    Here is how the main function structurally looks like:


    | Int | //if successful, expect to return a zero (0) |


    | Main () | //this is the place for the name, which, in this regard, is main |


    | {} | //this is the place for numerous codes; being the function body |


    In C, a code is divided into diverse functions and you can do the division as
    you wish. However, for the purpose of logic, you need to distribute your code
    amongst the functions at hand in a way that leaves every function performing a
    defined task. You actually need to take every C function as a major building block
    within your program. Simply put, every C program that you have working is written
    through the use of functions. This is done so that the program can be used repetitively
    and with consistent efficiency, and also to make it better understood.


    As you continue working on C programming, there are some terms that you will come
    across and you need to know their meaning in the relevant context. One of those
    terms is function declaration. What is it? 


    Function declaration


    Do you recall what a function is? A function declaration, on its part, is responsible
    for instructing the compiler on the function name, the return type, as well as
    the function parameters. And the function body is actually derived from the function
    definition.


    Here is the form that a function definition generally takes in C:


    Return_type function_name( parameter list ) {function body}


    Here below are the components of a function definition, including the header and
    the body, which are the main parts:


    1.  Return type


    It is anticipated that a function will return a value; and it actually may. Now,
    that value is of a certain data type. That data type is what we refer to as return_type.
    However, as you may have already noted, there are some functions that go well
    within the program, yet they do not return a value. This is the scenario where
    we declare that the return_type is void – void being one of C’s keywords.


    1.  Function name


    This is the exact function’s name.


    1.  Parameters


    First of all you need to realize that you do not have to work with parameters
    when it comes to functions in C programming. However, when you have them, it is
    important to know what they constitute. You can actually take a parameter the
    way you do a placeholder. What happens is that the minute you initiate a function,
    you give the parameter some value. It is this value that you can cite as being
    the actual parameter; or alternatively, the argument.


    From the parameter, you get a parameter list; and this one is in reference to
    the type; the order; as well as the actual number of parameters the function has.
    If you then add your parameter list to the function name, what you get is the
    function signature.


    1.  Function body


    When it comes to the function body, what you will find in it is an assembly of
    statements defining what the actual function is all about.


    Why Use C Functions?


    Let us summarize why it is important to use C functions:


    a)  To save yourself the repetitive task of re-writing the program’s code or logic


    b)  You can call on the C functions any time you need a similar functionality


    c)  You always have access to the program anywhere and anytime, thanks to the
    functions that keep the program stable and working consistently even when your
    machine is off.


    d)  Functions make it possible and easy for you to track a huge C program. This
    is because you are not faced with plain massive data but data that is broken down
    in logical functions.


    How C Function Works


    The C function has three distinct aspects, namely:


    (i)  The prototype, which you can also term function declaration.


    What this one does is keep the compiler informed on the issues of function name;
    the function parameters; as well as the return value of the data type. The syntax
    for the function declaration is:


    return_type function_name ( argument list );


    (ii)  The function call


    This is the caller of the real function. Its syntax is:


    function_name ( arguments list );


    (iii)  The function definition


    This is where you find the entire set of statements requiring execution. The syntax
    for the function definition is:


    return_type function_name ( arguments list ) { body of function; }


    You need to remember that it is important to declare a function and to clearly
    define it before you can proceed to call in a C program.


    Calling a C function


    When it comes to calling a C function within a program, the best way to go about
    it is:


    (i)  Calling it by value


    (ii) Calling it by reference


    Calling a C Function By Value


    (i)  When it comes to calling a C function by value, you have the variable’s value
    passed right to the C function in its parameter state.'
