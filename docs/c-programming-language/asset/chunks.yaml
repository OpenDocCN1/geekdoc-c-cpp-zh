- fmt: "\n在此类语句形式中，你选择的表达式从阶梯顶端开始向下测试，并尝试验证当前条件。仅当条件符合预期时，相关的语句才会被执行。\n\n值得注意的要点：\n\
    \n- 在 C 语言中，只有非零或非空的值才能被视为真（true）。因此对于值为零或为空的情况程序会自动返回假（false）的结果。\n- `if` 语句内部可以包含一条不包裹在大括号\
    \ (`{}`) 中的单条语句。\n\n请看这个示例：\n\n```\nInt a = 6\n\nIf (a >5)\n\nPrintf (\"success\"\
