  raw: 'So, where does the difference between typedef and #define lie?


    Well, you will find more than one difference when you compare typedef to #define.
    Here are the differences:


    *   Remember typedef provides symbolic names for data types? Although #define
    does this as well, it goes further to provide aliases for data values also. Incidentally,
    this is as simple as defining 1 as simply ONE.


    *   You will find the other difference right within the processing. In C, it is
    the compiler that determines what your typedef is all about; performing its interpretation.
    However, when it comes to your #define statements, it is the pre-processor that
    does the processing.


    How would you use $define within your program?


    Here is a good example:


    Include <stdio.h> #define TRUE 1 #define FALSE 0 int main( ) { printf( “Value
    of TRUE : %d\n”. TRUE); printf( “Value of FALSE : %d\n”. FALSE); return 0; }


    What is the result after compilation as well as execution of the code? Here it
    is:


    Value of TRUE : 1


    Value of FALSE : 0


    # Chapter 11: Input Output (I/O) In C


    Is this, by any chance, the conventional input and output that are found in various
    processes? Well, the input and output here may well be associated with a process,
    but they are not necessarily conventional in the real sense. In C, the two happen
    to be facilitated by some functions that are in-built within the program; the
    functions being printf() and also scanf().


    In order to appreciate what input means in C, after mentioning that it is the
    act of feeding data right into your program, you need to know that input sometimes
    comes as a file. Other times it emerges from some command line.


    As far as output goes, you will be right to associate it with what you see on
    your computer screen; what comes out through your printer; or in general whatever
    data that comes into any of your files. When your data that has become your output
    does not appear on your screen, it is often saved within your computer in form
    of text or what is referred to as binary files.


    One thing you need to know is that every time you have a program running that
    calls for the use of your keyboard or even your screen, certain three files automatically
    open. In fact, the C program has a way of treating every device as a computer
    file even when all you are interested in is displaying some data.


    Incidentally, what do we name as file in C programming? In simple language, what
    you refer to as file is some disk space where you store grouped data. You could
    also look at a file as representing some byte sequence, irrespective of whether
    the file happens to be text or binary.


    Why have files, anyway? Simple – to ensure your data is well preserved for use
    at a later time. If you terminate a computer program and you happen not to have
    a file, all the data you have been looking at, and probably working with, will
    be lost. However, once you create your file, your data remains intact all through,
    and all you need to do is give your computer a few simple commands and your file
    appears. In C, what you are bound to find in plenty are functions.


    Here are two main categories of the high level Input/Output functions:


    (1) The text file


    (2) The binary file


    The file functions in C are not complicated, so you will find them easy to learn.
    At all times, you need to get in touch with the stdio library for your functions
    to succeed. Of course, you have already seen it used in examples provided in earlier
    chapters of this book. The question at this juncture is: what exactly is in the
    stdio library? Well, what you may actually be interested in that is stored in
    the stdio library are the file functions involving input as well as output.


    ––––––––


    Here they are below:


    (i)  Fopen


    This one performs the function of opening your text file. You may find this prototype
    from fopen helpful:


    FILE *fopen( const char * filename, const char * mode );


    (ii) Fclose


    This is the one that performs the function of closing your text file


    (iii)  Feof


    This one performs the function of detecting your end-of-file marker in the file


    (iv)  Fscanf


    The function performed by this one is reading the input from your file that happens
    to be formatted


    (v) Fprintf


    This one does the function of printing the file output that happens to be formatted


    (vi)  Fgets


    This one undertakes the function of reading any string your file contains


    (vii)  Fputs


    This one performs the function of printing any string required into your file


    (viii) Fgetc


    This is the one that performs the function of reading characters right from your
    file


    (ix)  Fputc


    This is the one that does the function of printing characters right into your
    file


    Dealing With File Opening  In Case Of I/O Text File


    This is the function denoted by Fopen. It is important that you know that besides
    opening your text file, this function utilizes a specific mode as it undertakes
    file opening. The three modes it often uses are:


    *   Read, denoted as r


    *   Write, denoted as w


    *   Append, denoted as a.


    There are other modes besides the three already named, and they are as follows:


    *   The one used for reading as well as writing and is denoted as mode r+


    *   The one that does the opening of the text file for the purposes of reading
    as well as writing; proceeds to truncate it so that it reduces to a length of
    zero; or if no file exists proceeds to create one. This is the mode referred to
    as w+.


    *   This is the mode credited with opening your text file for reading as well
    as writing; and beyond that it engages in creating a file where none exists. On
    top of those functions borne by this same mode, it enables reading right from
    the beginning while only facilitating appending when it comes to writing.


    The way text file opening works is by the fopen statement opening file, “output.txt”
    within the write or w-mode. In cases where the function finds the file not existing,
    the file gets created.


    However, you need to be cautious not to try creating a file when another one is
    in existence because if you do, the existing file gets destroyed and you are left
    with the new one.


    As for the fopen command, it function is to return a pointer to your file, and
    that gets stored within the variable ptr_file. Just in case your file fails to
    open, you get the variable ptr_file returning NULL.if(!ptr_file).


    What then assesses if your file has opened is the if-statement, and that is executed
    only after fopen performs its function. How do you tell if or not your file has
    opened? Well, you will observe the program returning a one (1) in case fopen failed
    in its function of opening the file. Of course, this then becomes your indication
    that something is amiss and needs addressing.


    ––––––––


    Reading your text file in C


    The function that reads your file content is the fgets; but that is only after
    you have successfully opened your file in read or r-mode. The fscanf function
    is also helpful in this situation, and that is on condition your file is well
    formatted.


    When you want to prepare a file for reading, you open the file as “input.txt”,
    and the function you apply for this purpose is fopen; the mode being read mode
    or r-mode. The process involves fgets, which is essentially a library function,
    reading every line comprising not more than 1,000 characters. Then in case fgets
    is successful in executing the function, which means it has read all the lines
    in the text file and reached the end of file, otherwise referred to as EOF, the
    value you should expect to see returned by fgets is NULL. What follows thereafter
    is the printing of every line on stdout, ordinarily on your screen, and it goes
    on till EOF comes. At this juncture, you would be fine instigating the closing
    command to bring the program to a successful end.


    Dealing With File Closing: Fclose(Ptr_File)'
