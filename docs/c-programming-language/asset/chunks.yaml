    How To Access Union Members


    In order to access a union member, what you use is what is referred to as member
    access operator. And while this might sound technical, the member access operator
    is simple to understand because it is coded, (.) – a period. This period appears
    right between the name of the union variable and the select union member; the
    one you are trying to access. In defining union type variables, the keyword you
    need to use is union.


    Illustration on using unions within your program:


    #include <stdio.h> #include <string.h> union data { int i; float f; char str[20];
    }; int main( ) { union data data; data.i = 10; data.f = 220.5; strcpy( data.str,
    “C programming”); printf( data.i: %d\n”, data.i); printf( data.f : %f\n”, data.f);
    printf( “data.str : %s\n”, data.str); return 0; }


    However, the way this illustration is, the members of the union, i and f, could
    have their values corrupted because the final value has taken up the entire memory.
    You could get the following results after code compilation and execution:


    data.i : 1917853763


    data.f : 4122360580327794860452759994368.000000


    data.str : C Programming


    Solution...? Use one member at a time.


    Illustrating how best to use unions within your program:


    #include <stdio.h> #include <string.h> union data { int i; float f; char str[20];
    }; int main( ) { union data data; data.i = 10; data.f = 220.5; strcpy( data.str,
    “C programming”); printf( “data.str : %s\n”, data.str); return 0; }


    In this latter illustration, you have opted to use one member only, giving it
    priority, and as a result, you will have every union member now printed properly.
    After the code has been compiled and also executed, here is the result you are
    bound to receive:


    data.i : 10


    data.f : 220.500000


    data.str : C Programming


    # Chapter 10: Bit Fields and Typedef Within C


    Bits are essential in managing data storage in your machine. That is the reason
    structure, as well as union members, has their sizes specified in bits. What you
    want is to be able to utilize the storage at your disposal as efficiently as possible
    because it is in no way infinite. It is limited in scope and capacity and you
    need to be able to operate successfully within the limited range.


    Take a situation where the C program you have has some variables that are either
    true or false, and they are all grouped in a single structure named status. In
    short, suppose you had the structure looking like the illustration below:


    struct { unsigned int widthValidated; unsigned int heightValidated; } status;


    Bit Field Storage


    Ordinarily what you do is establish the variables within a structure, thereafter
    you define each variable’s width, and that informs the C compiler the precise
    number of bytes you need to utilize. Here is an example of how you can write the
    structure from the illustration above:


    Struct { unsigned int widthValidated : 1; unsigned int heightValidated : 1; }
    status;


    To be clear, you need in total 4 bytes for the status variable’s memory space.
    However, practically, you are only going to use up 2 bits because they are sufficient
    to store the values you have in the illustration above. In C, classes as well
    as structures can have some members occupying less storage space than a major
    type. Such are the members referred to as bit fields.


    Bit field can be used to reduce memory consumption with the knowledge that it
    is only some bits which will be used for the variable. Bit fields allow efficient
    packaging of data in the machine memory.


    The obvious fact is that an integer takes two bytes (16-bits) in memory. Sometimes
    we need to store value that takes less than 2-bytes. In such cases, there is wastage
    of memory. For example, if we use a variable temp to store value either 0 or just
    1\. In our current scenario, only a single bit of memory is going to be used rather
    then 16-bits. By using bit field, we can save lot of memory.


    What you use for creating bit fields in C include unsigned int; signed int, and
    sometimes Bool when it comes to C99\. You begin by setting up your bit field using
    structure declaration, which basically labels every field and also ascertains
    what its width is. After this, the compiler packs all the bit fields in adjacent
    location and which are of uniform type, and ends up reducing the number of words.
    This subsequently drastically reduces the storage space required for the bit fields.
    In short, you can credit the bit fields with allowing data packing into a structure.


    For instance:


    *   Numerous objects can be packed to form a machine word. For example, it is
    possible to compact 1-bit flags


    *   It is also possible to read file formats of a non-standard nature; or those
    with external file formats. A good example is reading 9-bit integers.


    The way the C programming language enables this is through structure definition,
    where you can put: bit length somewhere following the variable.


    A suitable illustration:


    struct packed_struct { unsigned int f1:1; unsigned int f2:1 unsigned int f3:1;
    unsigned int f4:1; unsigned int type:4; unsigned int my_int:9; } pack;


    There are six members in total in the above illustration. They include four 1-bit
    flags, which are f1, f2 as well as f3; a single 4-bit type; and also one 9-bit
    my_int. It is C that then conveniently packs those bit fields in a compact manner.


    It is important to know also that C allocates bit fields within integers starting
    from the one that is least significant to the one that is most significant. Let
    us observe the code below:


    struct mybitfields unsigned a : 4; unsigned b : 5; unsigned c : 7; } test; int
    main( void ) { test.a = 2; test.b = 31; test.c = 0;


    This is how C would arrange the bits:


    00000001 11110010


    cccccccbbbbbaaaa


    Typedef Within C


    Are you familiar with the tact of using an alias? While that may be common to
    people, it is not practically confined to human folk. The C language has a way
    of creating aliases for data types; and typedef is the keyword that helps in this
    process. Essentially what happens is that you give an entirely new name to your
    chosen data type. Sometimes the type name represented is a complex one.


    Here below is an example:


    You are required in this instance to provide a definition for the term, byte,
    for 1-byte numbers. The definition is:


    typedef unsigned char BYTE;


    The important part that follows now is that you can now use BYTE, which is, in
    this position, an identifier, taking it to be the abbreviation for the data type
    shown as unsigned char.


    What you would have after processing is complete is:


    BYTE b1, b2;


    The uppercase in BYTE stands out. Why do we use the uppercase as opposed to the
    lowercase? Simple: It has always been the custom. However, this is not all. It
    is helpful to use the uppercase so that you are always reminded that this type
    name is actually symbolic – symbolic abbreviation. Still, nothing prevents you
    from writing your symbolic abbreviation in lowercase. In short, if you so wish,
    you could write your abbreviation as:


    Typedef unsigned char byte


    Typedef is also used to provide a name for data types that happen to be user-defined.
    You may, for instance, use a structure based typedef in defining an entirely new
    data type. Thereafter, you use the fresh data type in defining structure variables.


    Comparing typedef to #define


    The big question is: what is #define first of all? Only after we know what it
    is can we make a good comparison. #define is actually a C-directive. Next thing
    you should know is that it is also used in defining aliases for different data
    types. Can we call that a similarity with typedef? Sure, we can.'
