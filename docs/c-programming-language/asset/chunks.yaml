    \ operator）来完成从一个整型到另一个整型的值转换。\n\n你还可以将类型转换解释为：改变某个特定类型的表达式，使其属于另一种不同的类型。在 C 语言编程中，「**变量值的转型**」（type\
    \ casting）是非常常见的操作。通常建议的做法是将较低的数据类型转换为较高的数据类型，因为这样不会有数据丢失的风险；反之当你把高数据类型转换成低数据类型时则会发生数据截断的问题——让我们举例说明一下就知道概念了:\
