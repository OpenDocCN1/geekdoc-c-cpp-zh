  md: '# BREAK IT DOWN


    # CODING CONCEPT:

    LOOPS


    I bet I can run loops around that mouseball!


    # DECODE THE CONCEPT


    Computers don''t get bored doing the same thing over and over again, but people
    do! One of the shortcuts that coders take when writing directions is called a
    loop. A loop is any action that''s done more than one time in a row. Clap your
    hands three times. You just did a loop!


    It''s easy to use!


    Just fit the command you want to do into the slot.


    THE COMMAND BLOCK FOR A LOOP LOOKS LIKE THIS:


    | REPEAT | TIMES |

    |---|---|

    | DO | A |


    | REPEAT | TIMES |

    |---|---|

    | DO | A |


    Write the number of times you want it done in the circle.


    # CODING CONNECTION


    Sometimes coders will write loops into a program to save time and space. There''s
    at least one loop in almost every computer program. Sometimes there are loops
    in loops - these are called nested loops Loops save coders lots of time, but they
    can some times make programs run more slowly if not used carefully.


    | REPEAT | 3 | TIMES |

    |---|---|---|

    | DO | A |'
