    # DECODE THE CONCEPT


    Sometimes problems can feel pretty big. And it''s no different for coders when
    they''re writing algorithms. **Decomposition** is one strategy that can help make
    big problems easier to deal with. In decomposition, you break a big problem down
    into smaller pieces.


    > DID YOU KNOW

    Musicians like Mozart and Beethoven are called composers because they put together
    music, like notes in a story, something bigger like a symphony. Decomposition
    of a problem is the opposite—breaking it down into smaller pieces.


    I can sleep all day long by breaking up the day into 2-hour nap blocks!


