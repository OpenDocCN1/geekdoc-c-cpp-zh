  md: '# THE MAGIC SQUARE PUZZLE


    Solving Magic Square puzzles usually requires a little bit of trial and error.
    To solve a Magic Square puzzle, you need to follow two rules:


    +   1. You can only use the numbers 1 through 9, and you can only use each number
    one time.

    2. The sum of the numbers in each column, row, and diagonal must be the same.


    Copy this magic square onto a piece of paper to try it for yourself.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_90_0.png)


    > THINK ABOUT IT

    How would you show your customer that all the rows, columns, and diagonals set
    up in the Magic Square are correct before starting to solve the problem?


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_90_1.png)


    > WHAT''S GOING ON?

    Magic Squares aren''t magic at all of course—they''re based on the number of rows
    and columns in the square. Completing the square can take a lot of time and error.
    One column and row might add up right, but that doesn''t mean they all will'
