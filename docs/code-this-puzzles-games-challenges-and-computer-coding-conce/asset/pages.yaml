  md: '# WHY DO COMPUTERS NEED CODE?


    A computer is like any other kind of tool. A screwdriver won''t drive a screw
    into a board by itself. It takes a person to pick up the screwdriver, point the
    correct end of the screwdriver towards the screw, line up the tip of the screwdriver
    with the slot on the screw, put the end into the slot, push down, turn the screw
    in the right direction, and stop when the screw is all the way in.


    Now, you''d probably do all of that without thinking about it too much. But if
    you didn''t do all of those things, and all of those things in the right order,
    the screwdriver wouldn''t be able to do its job correctly—or at all! The computer
    computer scientists think about how to write the directions so the computer works
    to do a task completely and efficiently, and as quickly as possible. If they write
    them correctly, the right kind of computer will be able to do any kind of job!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_12_0.png)'
