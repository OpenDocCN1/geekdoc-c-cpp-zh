  md: '# INTRODUCTION


    # CODING AND COMPUTER SCIENCE


    The title of this book is Code This!, but there are actually two things we''re
    going to learn. One is the art of figuring out how to do things in general. That''s
    called computer science. The other is the art of explaining how to do something
    in particular. That is called programming, or coding. We call them both "arts"
    because they require the same creativity you use when drawing, dancing, singing,
    or telling stories.


    Why are they two different arts? Because in order to explain something clearly
    enough for a computer to understand, you first have to be able to think about
    it clearly to yourself. If your thoughts don''t make sense, the reflection won''t
    make sense.


    And like kinds of art, computer science and computer programming use different
    tools. If you''re in a painting class, you use brushes and pencils. If you''re
    in band or orchestra, you use a musical instrument. It''s the same with different
    kinds of computer arts. In computer science puzzles, your tools include logic
    and math. In computer programming, you write specific code.

    Computer science and coding are like puzzle pieces—they''re different from each
    other, but they fit together to solve a problem.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_9_0.png)'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# PRACTICAL APPLICATIONS


    ### What can we do with computer science?


    Almost anything! The world increasingly relies on computers—to send and receive
    information through the internet, to use mobile phones, to watch television, and
    to play games. Even this book you''re holding right now was written on a computer.


    > The doctor is in... the computer? Computer scientists write programs that help
    doctors learn diseases and how to cure them. Special programs can even help doctors
    to do surgery


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_0.png)


    Sometimes the best way to learn about Earth is to study space Computer programmers
    write code that helps satellites look deep into space to grab photos. They also
    control the machines that scramble over faraway surfaces, like on Mars, or high
    in the atmosphere of other planets in our solar system


    Do you like to rock out, or are you more of the classical type? Hip-hop, salsa,
    jazz—if you''re listening hearing it courtesy of a computer. It takes special
    code to make your favorite songs sound perfectly in tune.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_1.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_2.png)


    Computers are hard at work even when we are relaxing People-called software engineers
    program computers to make your favorite movies and video games come to life


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_3.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_4.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_5.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_6.png)'
