  md: '# > BREAK IT DOWN


    # CODING CONCEPT:

    USERS & AND EVENTS


    # DECODE THE CONCEPT


    As a computer''s **user**, you are able to control what the computer does. Any
    time you click a mouse or touch a key on the keyboard, you create an **event**.

    A program on the computer picks up on the event. What happens next depends on
    the code!

    When writing code, a coder needs to think not only about what the code will do,
    but also what will trigger that event.


    TAKE A CODE THAT LOOKS LIKE THIS:


    ```

    JUMP

    ```


    The coder connects that command block to something the user can control. For example:


    ```

    WHEN SPACE BAR

    ```


    ```

    JUMP

    ```


    If our frogbot reads this code, it will jump in place when the user presses the
    space bar.


