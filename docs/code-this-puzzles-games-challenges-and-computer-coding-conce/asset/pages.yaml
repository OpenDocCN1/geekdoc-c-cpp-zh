  md: '# THE CATCH


    Whenever an Explorer needs a hand, Cody''s there to help. Unfortunately, it''s
    very particular about the details. It can''t simply collect a rare type of bacteria
    from a volcano. It needs step-by-step instructions on where to go, how to collect
    the bacteria, what bacteria to collect, and how to get back to the Explorers.
    Explorers are busy folks with a lot of cool stuff on their minds. They rarely
    give Cody the instructions it needs, which makes it want to totally short-circuit.
    That''s where YOU come in.

    **Welcome to Cody Crew.**


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_20_0.png)


    # YOUR MISSION


    **THROUGH THIS BOOK, YOUR JOB IS TO GIVE CODY THE INSTRUCTIONS IT NEEDS TO COMPLETE
    THE EXPLORERS'' MISSIONS.**

    You''ll need to break down each of the Nat Geo Explorers'' big tasks into smaller
    ones that you can give Cody instructions for. Then you''ll need to instruct Cody
    what to do. Are you up for the challenge? The Nat Geo Explorers are relying on
    YOU for some of the toughest, trickest, most awesome missions on Earth.

    There are lots of different


    kinds of puzzles in this book—will be easy, and some will be a little more challenging.
    Don''t be afraid to try them all!

    Real computers have something in common with kids—both learn by trying new things
    and making mistakes.

    **And here''s a hint that might surprise you—if you''re really stuck, go find
    the answer in the back!** That''s right. Look at the solution. But here''s the
    catch: Don''t just look at the answer, really examine it. Ask yourself: Why is
    this the right answer? How could you get the answer? Work backward! Sometimes''s
    the best way to learn.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_20_1.png)


