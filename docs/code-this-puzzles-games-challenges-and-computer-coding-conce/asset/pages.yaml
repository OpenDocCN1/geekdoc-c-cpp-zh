  md: '# BREAK IT DOWN


    # CODING CONCEPT: CONDITIONALS


    # DECODING THE CONCEPT


    From the time you wake up in the morning until you go to bed at night, you make
    decisions—lots of them. Computers can''t decide on their own, but they can make
    choices with the right kind of code. Conditionals are special instructions that
    help computers make decisions.


    Conditionals are set up as if/Then statements: If something happens, then do something.
    For example, if the traffic light is red, then stop. If the condition isn''t met
    (for example, the traffic light is any color but red), then the action won''t
    happen.


    IF it''s cheese


    THEN eat the cheese!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_129_0.png)'
  merge: -1
  pgno: 129
