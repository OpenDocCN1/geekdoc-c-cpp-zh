  md: '# # WELCOME TO THE CODER CREW!


    Whether you''re an aspiring computer scientist or just casually curious about
    coding, this book is for YOU!


    # ## Meet Cody.


    This rad robot does everything you could possibly want, with only one teeny problem:
    It needs YOU to write the instructions to get the job done.


    No worries, budding coders! This book will have you tackling totally cool coding
    challenges in no time, using the basics of coding and computer programming. Each
    challenge helps Cody get one step closer to completing its mission. Are you ready
    to take on some of the toughest, trickiest, most awesome missions on Earth?


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_0.png)


    # ## WHAT''S INSIDE:


    +   - Engaging story line to keep the learning fun and accessible

    - Hands-on, active challenges provide ways to learn and practice basic coding
    concepts, such as command blocks, algorithms, loops, debugging, optimizing, constraints,
    conditionals, and more

    - Extension activities for when you''re ready to take it to the next level


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_1.png)


    Check out these other hands-on STEM books!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_2.png)'
