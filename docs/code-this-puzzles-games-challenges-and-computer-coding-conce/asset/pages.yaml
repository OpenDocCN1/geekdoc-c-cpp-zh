  md: '# Spots are a condition for being dice ... or a tapir.


    # IF ACTION SUGGESTIONS


    If a [3] is rolled, raise your left arm. ELSE move the number of spaces you rolled.


    If a [3] is rolled, clap your hands. ELSE move the number of spaces you rolled.


    If a [3] is rolled, stick out your tongue. ELSE move the number of spaces you
    rolled.


    If a [3] is rolled, jump up and down. ELSE move the number of spaces you rolled.


    If a [3] is rolled, say the name of your favorite book. ELSE move the number of
    spaces you rolled.


    If a [3] is rolled, sing a song. ELSE move the number of spaces you rolled.


    If a [3] is rolled, pat your head and rub your stomach at the time. ELSE move
    the number of spaces you rolled.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_134_0.png)


    # WHAT TO DO


    +   1. During each round, ONE PLAYER WILL BE THE PROGRAMMER. EVERYONE ELSE BE
    COMPUTERS for that round.


    +   2. To start each round, THE PROGRAMMER ROLLS THE DIE. Whatever number comes
    up on the die will be the IF-number for that round.


    +   3. THE PROGRAMMER DECIDES WHAT ACTION THE COMPUTERS SHOULD DO whenever they
    roll the IF number on the die (See the suggestions if you get stuck!)


    +   4. EACH COMPUTER WILL TAKE A TURN AND ROLL THE DIE. If a computer rolls the
    IF number, he or she will do the action that the programmer chose at the beginning
    of the round. If they do not roll the IF number, take the ELSE path, and move
    the number of spaces on the die forward.


    +   5. ONCE ALL OF THE COMPUTERS HAVE ROLLED, THE ROUND ENDS. The person to the
    right of the programmer becomes the next programmer, and a new round starts.


    +   6. THE GAME ENDS WHEN SOME REACHES THE END OF THE PATH!


    Grab a few friends. It''s time to play Conditional Land!


    > If there''s a game going on then I''m ready to play!


