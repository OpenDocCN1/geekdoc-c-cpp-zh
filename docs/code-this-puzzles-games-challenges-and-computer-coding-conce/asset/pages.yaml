  md: '# AFTERWORD


    Computers are powerful machines, but they are still the same as all other machines—they
    need people to tell them what to do. Algorithms, the instructions that a computer
    follows to accomplish a task, are written by thinking about how to solve the problem,
    and then writing the code that helps the computer do it.


    But NONE of this would be possible without the thinking power of the human brain.
    And more important, its curiosity. What can you do? Keep asking questions and
    keep thinking about problems. After all, programming is just giving a machine
    some clear directions and the tools to solve problems. What problems will solve
    in the future? The answer could be based on code you might write!


    Some of the first computers, like ENIAC, took up entire rooms. Today, many people
    carry a smartphone that can fit in a pocket. The art of computer programming changed
    a lot, too. People are inventing new ways to use computers, inventing new types
    of computers, and figuring out how to make computers run faster and do more than
    ever before.


