  md: '# TRY IT OUT


    Conditionals can also be set up to give the computer specific instructions about
    what to do if the condition is met and what to do if it isn''t. For a continuous
    carousel of photos (where the buffalo displays after the fish, for example), that
    could look something like this:


    IF the up arrow is clicked, THEN display the photo. ELSE wait 3 seconds, then
    display the next photo to the right.


    Can you figure out what that means? What happens if the arrow is clicked? What
    happens if the arrow isn''t clicked?


    How would you write a conditional statement to open the photo of the frog?


