  md: '# > BREAK IT DOWN


    # CODING CONCEPT:

    ALGORITHMS


    # DECODE THE CONCEPT


    Computers use algorithms to accomplish tasks. An algorithm is just a fancy word
    for a list of directions. You use algorithms all the time, and probably didn''t
    even know it!


    +   THERE ARE TWO BIG RULES FOR WRITING A GOOD ALGORITHM FOR A COMPUTER:

    1. Write down every single step that the computer needs to do.

    2. Write down all the steps in the right order.


    Following these steps is a little like following a path. You need to travel in
    the right order to accomplish your goal.


    > Mmm—nBananas.

    Thai algorithm looks yummy


    # ADA LOVELACE


    The world''s first computer algorithm was written by Ada Lovelace. She wrote a
    list of directions to be followed by a machine that had never been invented yet!
    She is considered to be the world''s first computer programmer.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'If you''ve ever baked a cake or made cookies, you''ve used an algorithm. If
    you don''t follow the steps of a recipe in the right order, you''re likely to
    end up with a kitchen catastrophe ... or at least something that doesn''t taste
    very good!

    But do you know if you''re writing a good algorithm? Computer coders don''t just
    write a list of directions and how it works. After they write an algorithm, they
    make sure all of the steps are there. If there are any missing steps, they go
    back and add them.


    Here are a few other steps that can be added to the algorithm. Can you figure
    out where they should go?


    ```

    TURN OFF THE BLENDER.

    PEEL A BANANA AND BREAK IT INTO PIECES.

    PUT THE LID ON THE BLENDER.

    PUT THE FRUIT INTO THE BLENDER.

    POUR THE SMOOTHIE INTO A GLASS.

