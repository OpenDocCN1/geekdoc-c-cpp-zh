  md: "# CODE ON\n\nBLOCK COMMANDS ARE A GREAT WAY TO START LEARNING TO CODE. But\
    \ most programming is done by writing code in languages. Just like any language,\
    \ programming languages like JavaScript, Python, and Ruby have words and specific\
    \ orders to write them in.\n\n# HTML/JAVASCRIPT\n\nHere's some code in HTML/JavaScript.\
    \ In this game, the computer picks a \"right\" answer between 1 and 10 at random.\n\
    \n```\n<!DOCTYPE html>\n<body>\n<p>I'm thinking of a number. Can you guess it?</p>\n\
    Type in a number between 1 and 10:</p>\n<input id=\"myInput\" type=\"text\">\n\
    <button onclick=\"myFunction()\">Is it right?</button>\n<p id=\"demo\"></p>\n\
    <script>\nvar var = Math.floor(Math.random() * 10) + 1;\nfunction myFunction()\
    \ {\n var guess = document.getElementById(\"myInput\");\n var text = Number(guess.value);\n\
    \ // If the guess is correct\n if (correct === var) {\n \text{text} = \"That's\
    \ it! Great job!\";\n // If the guess is too high\n else if (guess > var) {\n\
    \ \text{text} = \"Try lower.\";\n // If the guess is too low\n } else {\n \text{text}\
    \ = \"Try higher.\";\n}\ndocument.getElementById(\"demo\").innerHTML = text;\n\
    }\n</script>\n</body>\n</html>\n```\n\nThese \"words\" are part of the programming\
    \ language. They tell the computer things like this section of the webpage starts.\n\
    \nThese are the actual words that someone playing the game will see on screen.\
    \ The code pair <p></p> tells the computer which paragraph of text starts and\
    \ ends.\n\nThis command tells the button on the screen how to work.\n\nThis command\
    \ sequence is the If/Else command. It tells the computer how to respond to the\
    \ player's game. If the player guesses the number picked, the computer will read,\
    \ \"That's it! Great job.\" If the player guesses a number too high, the text\
    \ will read, \"Try lower.\" And if the player guesses a number too low, the text\
    \ will read, \"Try higher.\".\n\nI'm thinking of a number. Can you guess it? Type\
    \ in a number between 1 and 10.\n\n| 2 |\n| Is it right? |\n\nTry higher."
