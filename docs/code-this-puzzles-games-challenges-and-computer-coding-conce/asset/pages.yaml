- img_proc: true
  md: '# DECODE THE CONCEPT


    One of the things coders must consider when they write computer programs are **constraints**.
    A constraint is anything that might keep a solution from working, or might keep
    it from working well. Try to tie your shoe. How long does it take? Add the constraint
    of not being able to use your thumbs, and then try to tie your shoe again. How
    does this change the solution?


    You can practice working with constraints by solving this logic problem: Three
    frogs and three toads sit on seven stones in a pond. The frogs on the left three
