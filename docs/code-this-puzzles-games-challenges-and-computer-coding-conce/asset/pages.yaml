  md: '# BREAK IT DOWN


    # CODING CONCEPT: MAKING SHAPES


    # DECODING THE CONCEPT


    Shapes are probably one of the first things that you learned how to draw. Simple
    shapes–like circles, squares, and triangles–are the basics that even professional
    artists and graphic designers use to create all kinds of drawings.


    I''m totally in shape.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_123_0.png)


    It''s the same with coding, too. Student computer programmers don''t start by
    writing graphics code for a super-realistic 3D video game. Instead, they learn
    to give computers directions on how to draw those simple shapes they first made
    themselves. And they don''t get to see their computer drawings until they run
    the program.'
