    \ |\n| I | | | | | | | | W | | | | | | | | |\n| J | | | | | | | | X | | | | |\
    \ | | | |\n| K | | | | | | | | Y | | | | | | | | |\n| L | | | | | | | | Z | |\
    \ | | | | | | |\n| M | | | | | | | | | | | | |\n\n# 试试看\n\n## 你需要\n\n- 铅笔\n- 纸\n\
    \n你能用 ASCII 写出你的名字吗？拿一张纸，从上往下写下你的名字。这就是计算机读取的方式。然后，使用 ASCII 图为每个字母画出正确的框。\nCode\
    \ 是这样拼写它的名字的：\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_76_0.png)\n\n这些字母拼写的是什么？\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_1.png)\n\n# > 拆解\n\n## 编码概念：二分查找\n\n\
    我们一直使用计算机来帮助寻找答案。你是否好奇计算机是如何快速找到答案的？计算机用于查找信息的一种算法叫做二分查找。二分查找和二进制代码一样，依赖于2。让我们来看看吧！\n\
    \n## 你玩过“猜猜数字”吗？\n\n在这个游戏中，一个人想一个数字，另一个人尝试猜。例如，两个朋友决定玩这个游戏。他们规定游戏规则：\n\n1. 数字必须在\
    \ 1 到 10 之间。\n2. 每次猜错后，想数字的人必须说数字大还是小。可能是这样的：\n\n在游戏开始时，1 到 10 之间的任何数字都可能是答案。第一次猜之后，只有大于\
    \ 3 的数字是正确的：4, 5, 6, 7, 8, 9 或 10。\n下次猜之后，只有 4, 5, 6, 7 或 8 可能是正确的。每次答案的数量都被分成两部分，直到剩下正确答案！\n\
    \n## 编码连接\n\n某些二分查找被用于快速搜索数据库。数据库是大型信息池，帮助我们搜索互联网以及通过电子邮件或电话联系他人。\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_77_0.png)\n\
    \n# 让我们试一下。\n\n你想一个数字，我来猜。\n\n# 发生了什么？\n\n这个游戏非常像计算机搜索某个东西。你是在搜索文件、文本文档还是卡通？当计算机通过你的输入创建每条路径时：\n\
    \n... 3\n... 大了！\n... 9\n... 小了！\n... 6\n... 大了！\n... 8\n... 小了！\n... 7\n... 你对了！\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_78_0.png)\n\n二分查找继续\n\n# Cody 的编码挑战\n\
    \n## 编码概念：二分查找\n\n## 试试看\n\n要弄懂 Cody 旗帜的含义，请阅读二分查找树中的每个语句。如果语句是真的，遵循 YES 线。如果语句是假的，遵循\
    \ NO 线。一直下去，直到路径结束！\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_79_0.png)\n\n\
    # 从这里开始！\n\n## 旗帜是方形\n\n是\n否\n\n## 旗帜只有一种颜色\n\n是\n否\n\n##我是危险货物\n\n## 区域内有潜水员\n\
    \n继续探索！\n\n你能使用树图来弄懂这些旗帜的意思吗？\n\n# > 轮到你了\n\n## 编码概念：二分查找\n\n## 试试看\n\n## 你需要\n\
    \n- 纸和铅笔！\n- 一个朋友或更多\n\n# 二十个问题\n\n## 二十个问题\n\n寻找答案并不总是复杂的——你可以通过问问否问题获取大量信息！尝试这个游戏，看看二分查找是如何工作的。\n\
    \n## 怎么做\n\n1. 一个人想一个物体……但不要告诉任何人！这个人是答案者。\n2. 另一个人（或这些人）现在尝试弄清楚物体的身份——这些人是提问者。\n\
    3. 每个提问者轮流对物体提一个问题。问题必须有两个答案：是或否。提问者总共可以问20个。\n4. 将每个问题及其答案写在纸上。\n5. 如果某个提问者猜中了物体，他们成为下一个答案者！\n\
    6. 如果没有人猜出物体的身份，答案者就想一个新的物体。\n\n> 它比冰箱大吗？\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_81_0.png)\n\
    \n# 从这里开始\n\n它是活着的吗？\n\n是\n否\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_0.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_82_1.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_2.png)\n\
    \n## 是动物吗？\n\n否\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_3.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_4.png)\n\
    \n> 继续探索！\n\n这个游戏就像一种通过回答问题来获得物体的游戏。例如，如果你对“它是活着的吗？”回答“否”，那么画出那个不是动物的物体。\n\n最后对每个问题排序，并写下在每个答案后被排除的物体顺序。\n\
    \n## 它有毛吗？\n\n是\n否\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_5.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_82_6.png)\n\
