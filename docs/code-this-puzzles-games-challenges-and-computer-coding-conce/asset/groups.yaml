    > 这不仅仅是移动物品。它是在做出一个对所有参与者都合理的选择。


    # 发生了什么？


    我们很想知道，有时我们无法理解邻居为什么做某些事情。当你扔出一个球却撞歪了，而你并没有重复一遍所需的步骤，而是理解了彼此，这种感觉是很很沮丧的。


