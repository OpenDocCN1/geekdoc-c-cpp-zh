    ### 编程连接

    当程序员编写计算机程序时，他们必须做出像你在寻找解决方案时那样的某些选择。某些类型的代码会与其他代码兼容，或者会让程序运行变慢。程序员必须考虑程序的目标，然后选择最有效的、或最优的运行代码。


    > 如果你想建造某种伟大的东西，你必须从小处开始。一个伟大的主意始于一个小小的角度。


    更进一步！

    你能使用周围发现的其他材料建造一把更好的椅子吗？


    ## Cody 的编程挑战


    ## 编程概念：

    优化


    ## 尝试一下


    ### Cody 的背包

    Cody 的背包只有有限的空间。按照每个像素颜色的出现顺序按下颜色所示指示的按钮。


    - 5

