    ## CODING CONNECTION


    Sometimes coders will write loops into a program to save time and space. There''s
    at least one loop in almost every computer program. Sometimes there are loops
    in loops - these are called nested loops. Loops save coders lots of time, but
    they can sometimes make programs run more slowly if not used carefully.


