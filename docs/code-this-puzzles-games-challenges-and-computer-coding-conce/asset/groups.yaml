    ## 编程概念：用户与事件


    # 解码概念


    作为计算机的**用户**，你可以控制计算机做什么。每当你点击鼠标或触摸键盘键时，你就创建一个**事件**。计算机上的程序会读取该事件。接下来发生什么取决于代码！编写代码时，程序员不仅需要考虑代码做什么，还需要考虑什么会触发该事件。


    编写这样的代码：


    ```

    JUMP

    ```


    将其连接到用户可以控制的东西。例如：


    ```

    WHEN SPACE BAR

    JUMP

    ```


    如果 frogbot 读取这段代码，当用户按下空格键时，它就会原地跳起。


