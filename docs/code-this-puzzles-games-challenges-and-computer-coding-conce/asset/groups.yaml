    The ocean floor can be a dark and dangerous place. Scientists often use robotic-controlled
    vehicles to explore the deepest part of the ocean and see what kinds of animals
    live there. The National Geographic Explorers want to take a look down into the
    ocean depths. How can you program Cody to help the explorers on their deep-sea
    expedition?


    THERE ARE A LOT OF COOL CREATURES WAITING TO BE DISCOVERED! MAKE SURE CODY IS
    EQUIPPED TO GATHER ALL THE INFO IT NEEDS. Captain Cody at your service! IT''S
    HARD TO SEE VERY DEEP INTO THE WATER. YOU''LL NEED WAYS TO DELIVER CLEARLY TO
    CODY.


    # BREAK IT DOWN


    ## CODING CONCEPT: CONSTRAINTS


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_59_0.png)


    ## DECODE THE CONCEPT


    One of the things coders must consider when they write computer programs are **constraints**.
    A constraint is anything that might keep a solution from working, or keep it from
    working well. Try to tie your shoe. How long does it take? Add the constraint
    of not able to use your thumbs, and then try to tie your shoe again. How does
    this change the solution?


    You can practice working with constraints by solving this logic problem: Three
    frogs and three toads sit on seven stones in a pond. The frogs on the left three
    stones would like to sit on the three stones on the right. The toads on the right
    would like to sit on the three stones on the left. Each animal can only hop one
    hop at a time, they can only hop forward, and they can''t share a stone with another
    toad or frog. Each stone can only hold one animal at a time. Can you figure out
    to move the frogs and toads so that they switch sides?


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_60_0.png)


