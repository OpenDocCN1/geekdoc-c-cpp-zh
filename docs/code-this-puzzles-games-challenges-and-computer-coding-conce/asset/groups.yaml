    # MEET THE BLOCK COMMANDS


    Beginning computer coders learn to write code using what we''ll call block commands.
    A command is an instruction that a computer follows. In this book, a block command
    looks like this:


    ```

    JUMP FORWARD

    ```


    To write code, you simply pile blocks together in a list. Frogbot will follow
    the commands beginning at the top, and ending at the bottom.


    +   - START

    - JUMP FORWARD

    - TURN LEFT

    - JUMP FORWARD

    - TURN RIGHT

    - JUMP FORWARD

    - JUMP FORWARD

    - TURN RIGHT

    - JUMP FORWARD

    - TURN LEFT

    - JUMP FORWARD

    - STOP


