  - '[PAGE 11]


    # THINKING

    LOGICALLY


    # WHAT IS LOGIC?


    Good coders always consider logic when they tackle a problem. Logic is just thinking
    about something in a way that makes sense. When you''re getting dressed in the
    morning, you wouldn''t put your shoes before your socks, would you? That wouldn''t
    make sense. If the goal is to have your socks under your shoes, it''s more logical—that
    is, it makes more sense—to put your socks on first.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_1.png)


    # COMPUTER LOGIC


    > My computer will

    need socks and

    shees if it''s going to

    "run" my program!


    Since the idea behind programming a computer is to write directions in a way that
    gets the computer to do something, accomplish a goal, then it helps to think about
    how to write those directions in a way that makes sense. Hey, that''s logic! So,
    doing logic problems is a big part of computer science. Do computers use logic?
    In a way, they do. In fact, the tiny electronic parts that make up computers are
    put together in a way that uses a special kind of logic.


    But computer logic is different from human logic. A human brain is creative. It''s
    also great at sensing the world around us and taking all of what it senses into
    consideration as it tries to figure out what to do next. So, ultimately, it takes
    the human mind to dream up the best way to solve a problem, and to tell the computer
    how to do it.


    CODE THIS!'
  - '[PAGE 12]


    # WHY DO COMPUTERS NEED CODE?


    A computer is like any other kind of tool. A screwdriver won''t drive a screw
    into a board by itself. It takes a person to pick up the screwdriver, point the
    correct end of the screwdriver towards the screw, line up the tip of the screwdriver
    with the slot on the screw, put the end into the slot, push down, turn the screw
    in the right direction, and stop when the screw is all the way in.


    Now, you''d probably do all of that without thinking about it too much. But if
    you didn''t do all of those things, and all of those things in the right order,
    the screwdriver wouldn''t be able to do its job correctly—or at all! The computer
    computer scientists think about how to write the directions so the computer works
    to do a task completely and efficiently, and as quickly as possible. If they write
    them correctly, the right kind of computer will be able to do any kind of job!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_12_0.png)'
