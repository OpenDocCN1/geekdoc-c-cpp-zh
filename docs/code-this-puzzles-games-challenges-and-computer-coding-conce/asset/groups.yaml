    \n> ONCE A CAMERA TRAP IS SET UP, IT CAN ONLY CAPTURE PHOTOS IN A CERTAIN AREA\n\
    \n# BREAK IT DOWN\n\n## CODING CONCEPT: CONDITIONALS\n\n## DECODE THE CONCEPT\n\
    \nFrom the time you wake up in the morning until you go to bed at night, you make\
    \ decisions—lots of them. Computers can't decide on their own, but they can make\
    \ choices with the right kind of code. Conditionals are special instructions that\
    \ help computers make decisions.\n\nConditionals are set up as if/Then statements:\
    \ If something happens, then do something. For example, if the traffic light is\
    \ red, then stop. If the condition isn't met (for example, the traffic light is\
    \ any color but red), then the action won't happen.\n\nIF it's cheese\n\nTHEN\
    \ eat the cheese!\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_129_0.png)\n\n##\
    \ TRY IT OUT\n\nConditionals can also be set up to give the computer specific\
    \ instructions about what to do if the condition is met and what to do if it isn't.\
    \ For a continuous carousel of photos (where the buffalo displays after the fish,\
    \ for example), that could look something like this:\n\nIF the up arrow is clicked,\
    \ THEN display the photo. ELSE wait 3 seconds, then display the next photo to\
    \ the right.\n\nCan you figure out what that means? What happens if the arrow\
    \ is clicked? What happens if the arrow isn't clicked?\n\nHow would you write\
    \ a conditional statement to open the photo of the frog?\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_130_0.png)\n\
    \nHow would you write a conditional statement to open the photo of the snake?\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_130_1.png)\n\n# BREAK IT DOWN\n\n##\
    \ CODING CONCEPT: CONDITIONALS\n\n## DECODE THE CONCEPT\n\nNow that you understand\
    \ how conditionals work, it's time to get coding!\nIf/Else blocks look like this:\n\
    \nIf you have a nut\nTHEN give it to me!\n\n```\nIF THEN\nELSE\n```\n\nTo use\
    \ an If/Else block, just **\"plug in\"** the right words to describe what condition\
    \ you want the computer to look for.\n\n```\nIF CAN'T GO FORWARD THEN\n  ELSE\n\
    ```\n\nNext **add what the action should be if the condition is true.** For example,\
