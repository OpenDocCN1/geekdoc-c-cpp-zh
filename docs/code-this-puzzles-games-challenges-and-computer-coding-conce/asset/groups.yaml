    There are volcanoes all over space. Some, like the ones on Earth, spew lava. Others,
    called **cryovolcanoes**, spew supercold liquids. **Jupiter''s moon Io** is one
    of the most volcanically active worlds in our solar system. And the Explorers
    think one of its active volcanoes is erupting! But the satellite that sends images
    back from space is not functioning properly. **Can you help Cody take the right
