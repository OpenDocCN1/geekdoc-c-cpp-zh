    # CODING CONCEPT:

    # DEBUGGING


    # DECODE THE CONCEPT


    Sometimes coders write code that, well, doesn''t work. And that''s okay! It happens
    all time—a piece of code just doesn''t work the way it''s supposed to. A **bug**
    is a mistake in code. **Debugging** is finding mistakes in code ... and then fixing
    those mistakes.


    Coders don''t just guess when they''re debugging—they have a plan, or **strategy**.
    One easy strategy to use when debugging is to ask your-self these three questions:


    +   1. What happens when you run the code?

    2. What should happen? (Instead of what did happen.)

    3. What does this mean?


    > There might be a bug in my travel plans


    This will tell you what kind of mistake you''re looking-for.


    **Get a pencil, a piece of paper, and a ruler and try it!**


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_65_0.png)'
