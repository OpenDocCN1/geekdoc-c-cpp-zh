    \n> 一旦设置好相机陷阱，它只能捕捉特定区域内的照片\n\n# 拆解分析\n\n## 编程概念：条件语句\n\n## 解码概念\n\n从你早上醒来到晚上睡觉，你都在做决定——而且是很多。计算机不能自己做决定，但它们可以使用正确的代码做出选择。条件语句是帮助计算机做决定的特殊指令。\n\
    \n条件语句设定为“如果/那么”语句：如果发生了某事，就执行某事。例如，如果交通灯是红色的，就停止。如果条件不满足（例如，交通灯是红色以外的任何颜色），动作就不会发生。\n\
