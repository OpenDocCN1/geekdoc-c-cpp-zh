- md: "\n# GLOSSARY\n\n- **algorithm**: a set of steps or list of instructions a computer\
    \ uses to accomplish a goal\n\n- **coding**: the process of thinking about and\
    \ writing down instructions for a computer\n\n- **ASCII**: a type of binary code\
    \ that represents letters, numbers, and symbols (ASCII stands for American Standard\
    \ Code for Information)\n\n- **combine**: to put two or more parts of something\
    \ together\n\n- **binary**: made of two things\n\n- **command**: an instruction\
    \ that a computer follows\n\n- **binary code**: code that uses two symbols to\
    \ represent letters, numbers, and other characters\n\n- **computer science**:\
    \ the study of how to write logical computer programs\n\n- **binary search**:\
    \ the process of repeatedly dividing a large amount of information to find a specific\
    \ piece of information\n\n- **conditional**: a piece of code that causes a computer\
    \ to choose one of two paths\n\n- **constraint**: anything that might keep a solution\
    \ to a problem from working (or working well)\n\n- **bug**: a mistake in computer\
    \ code that causes a program to run poorly or in a way that is not expected\n\n\
    - **cryptology**: the study of writing and breaking codes\n\n- **cipher**: a message\
    \ written in a secret language\n\n- **debugging**: the process of going through\
    \ code to find problems\n\n- **cipher wheel**: a tool used to write and decode\
    \ ciphers\n\n- **decomposition**: the process of breaking down a problem into\
    \ smaller parts that are easier to solve\n\n- **code**: the specific directions\
    \ written for a computer to follow\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_157_0.png)\n\
    \n- **efficient**: working in the best possible way\n\n- **pixel**: a tiny piece\
