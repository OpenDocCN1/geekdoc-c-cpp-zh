    After the first guess, only numbers higher than 3 can be correct: 4, 5, 6, 7,
    8, 9 or 10.

    After the next guess, only 4, 5, 6, 7, or 8 could be right. Each time the number
    of answers is cut into two parts until the right answer is left!


    ## CODING CONNECTION


    Some kinds of binary search are used to quickly search databases. Databases are
    large pools of information that help us to search the internet, and to contact
    others by email or phone.


