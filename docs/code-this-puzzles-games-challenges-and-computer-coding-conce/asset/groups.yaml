    # 解码概念


    你听过“我们都会犯错”这个句语吗？是的，这是真的。但我们学习最重要的方式之一就是试错。试错的工作原理如下：


    1. 尝试一个解决方案

    2. 失败

    3. 回到步骤 1 直到你成功。


    试错可能会令人沮丧，但学习不要做某事与学习如何做某事同样重要。这样，你就可以通过避免重复犯过的错误来节省时间。程序员通过试错学到了很多东西。


