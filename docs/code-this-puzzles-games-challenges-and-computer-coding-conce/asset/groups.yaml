    你的算法有效吗？为什么有效或不有效？如果路中间有两个枕头而不是一个，你会如何修改它？


    ## 编程概念：优化


    ## 解读概念


    计算机可以快速地解决问题。这在某种程度上是因为被称为“优化”的东西。当程序员编写算法时，他们会尝试编写代码，以便计算机能够以最好的方式执行指令。


    程序员使用一个被称为“旅行推销员”的逻辑问题来帮助他们练习如何优化他们编写的代码。


    这个逻辑问题比计算机要老得多。旅行推销问题提出了一个问题：“我如何以最高效的方式到达我需要访问的所有站点？”


    它的名字源于一个时代，当时有销售员会在城市与城市之间——有时甚至是家与家之间旅行——试图销售他们的产品。为了做到这一点，销售员希望使用最短的路线访问所有可能的客户。这样他们就能在相同时间内遇到更多的客户。最有效的路线是显而易见的，但有时要找出来却困难得多。


    ## 编程联系


    计算机科学之所以很复杂的原因之一是，问题往往不止一个答案。如果推销员必须前往 50 个城市呢？100 个呢？那么可能有数百万种方法，而且找到最好的方法并不需要很长时间。除非答案不够好，否则最小代码会选择答案。


    ## 你知道吗？


    这个问题最早在 19 世纪由一位名叫威廉·罗根·哈密顿（William Rowan Hamilton）的数学家正式描述。一个访问区域每个点的路径被称为哈密顿路径。如果它形成了一个环，那么它被称为哈密顿圈。


    ## 在家里尝试这个！


    哈密顿还闻名于 1843 年 10 月 16 日在爱尔林的扫帚桥（Broom Bridge）上刻数学方程式。为了纪念这位数学家，人们每年都会去那里。


