    \n> 点是光的一次快速闪烁或一次快速的敲击声。\n\n> 划是光的闪烁或长度是点三倍的敲击声。\n\n# 摩斯密码\n\n在电话发明之前，人们使用摩斯密码发送电报。一个人会将消息带到电报局并交给操作员。操作员将消息转换为摩斯密码并将其敲入机器中。信号会通过长线传输到另一端的操作员那里，该操作员使用普通字母表将摩斯密码转换为消息。\n\
    \n# 发生了什么？\n\n你可以沿着电话发送和接收信号，但你可能会觉得这非常简单。但如果你想在没有任何线的情况下发送消息呢？摩斯密码是一种由点和划组成的代码，代表字母、数字和标点符号。如果你使用它，只需用手电筒或其他声音就能向另一个人发送消息！\n\
    \n# 思考一下\n\n你能想到其他利用光或声音发送摩斯密码来传递消息的方法吗？\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_74_1.png)\n\
    \n# 二进制代码继续\n\n# > 轮到你了\n\n## 编码概念：二进制代码\n\n嘿，我也是两种颜色！\n\n## 解码概念\n\n有些计算机使用一种类似于摩斯密码的代码。它的正式名称是美国标准信息交换码，但你可以直接叫它的昵称\
    \ ASCII。\n\nASCII 字母由八个框组成。有些是填充的，有些是空的。ASCII 字母表像这样：\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_75_0.png)\n\
    \n| A | | | | | | | | N | | | | | | | |\n| B | | | | | | | | D | | | | | | | |\n\
    | C | | | | | | | | P | | | | | | | |\n| D | | | | | | | | Q | | | | | | | |\n\
    | E | | | | | | | | R | | | | | | | |\n| F | | | | | | | | T | | | | | | | | |\n\
