    ## CODING CONCEPT: OPTIMIZATION


    ## DECODE THE CONCEPT


    Computers can solve problems quickly. This is, in part, because of something called
    optimization. When coders write algorithms, they try to write so that the computer
    can carry out the instructions in the best way possible.


    Coders use a logic problem called the Traveling Salesperson to help them practice
    how to optimize the code they write.


    This logic problem is way older than computers. The Traveling Salesperson asks
    the question: “How can I get to all of the stops I need to make in the most efficient
    way possible?”


    It got its name from a time when there were salespeople who would travel from
    town to town—and sometimes home to home—to try to sell their products. To do that,
    salespeople would want to visit all the possible customers using the shortest
    possible route. That way they could meet with more customers in the same amount
    of time. The most efficient route is clear, but sometimes it’s much harder to
    figure out.


    ## CODING CONNECTION


    One of the reasons that computer science can be tricky is that there''s often
    more than one answer to a problem. What if the salesperson had to travel to 50
    cities? 100? Then there might be a million ways and it wouldn''t take a long time
    to figure out the best one. Minimum codes pick the answer unless it''s not good
    enough.


    ## DID YOU KNOW?


    This problem was first officially described in the 1800s by a mathematician named
    William Rowan Hamilton. A path that visits each of an area''s points is called
    a Hamiltonian path. Unless it makes a loop, in which case it''s called a Hamiltonian
    cycle.


    ## DON''T TRY THIS AT HOME!


    Hamilton is also famous for carving mathematical equations into the Broom Bridge
    in Dublin, Ireland, on October 16, 1843. To honor the mathematician, people visit
    this graffiti every year on that date.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_30_0.png)


