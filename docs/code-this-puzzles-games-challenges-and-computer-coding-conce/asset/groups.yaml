    ## CODING CONCEPT: TRIAL AND ERROR


    > If at first you can''t ride a turtle, try again!


    # DECODE THE CONCEPT


    Have you ever heard the phrase "We all make mistakes"? Well, it''s true. But one
    of the most important ways we learn is through trial and error. Trial and error
    works like this:


    1. Try a solution

    2. Fail

    3. Go back to step 1 until you succeed.


    Trial and error can be frustrating, but learning not to do something is as important
    as learning how to do it. That way, you can save time by not making the same mistakes
    you''ve already made. Coders learn a lot through trial and error.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_89_0.png)


    # MAGIC SQUARES!


    Magic squares may not be magic, but they are the subject of magical stories. According
    to legend from China, a turtle with a Magic Square on its shell was able to keep
    a river from flooding!


