    # 由 Fan Works Design 设计


    姓名：Szymanski, Jennifer，作者。

    书名：Code this! / Jennifer Szymanski 著。

    描述：华盛顿 DC：National Geographic Kids. [2019] 包含索引。读者：9-12 岁。小学 4-6 年级。

    标识符：LCC 20180316281 ISBN 9781412633436 (平装) | ISBN 9781412633443 (精装)

    主题：LCSH: 计算机编程--青少年文学

    分类：L QA67.6115.S96 2019 DDC 005.1--dc23

    LC 记录可用于：lcc.loc.gov/20180316281


    中国印刷

    19/RRDS/1


    160 动手编程吧！


    # # 欢迎来到编码员团队！


    无论你是一个有抱的计算机科学家，还是仅仅对编程充满好奇，这本书都是为你准备的！


    ## 认识 Cody。


    这个酷酷的机器人可以完成你可能想要的一切，但只有一个小问题：它需要**你**来编写指令以完成工作。


    别担心，初级编码员们！这本书将让你能够利用编程和计算机程序的基础知识，很快就能应对超级酷的编程挑战。每个挑战都帮助 Cody 距离完成任务更近一步。你准备好迎接地球上一些最艰巨、最狡猾、最棒的任务了吗？


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_0.png)


    ## 内部：


    - 引人入胜的故事情节让学习变得有趣易懂

    - 动手的互动挑战提供了学习和练习基础编程概念的方法，例如命令块、算法、循环、调试、优化、约束、条件判断等

    - 当你准备好更上一层楼时提供的扩展活动


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_1.png)


    查看我们的其他动手类 STEM 书籍！


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_167_2.png)


