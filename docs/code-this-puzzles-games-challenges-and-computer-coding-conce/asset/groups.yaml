    As a computer''s **user**, you are able to control what the computer does. Any
    time you click a mouse or touch a key on the keyboard, you create an **event**.
    A program on the computer picks up the event. What happens next depends on the
    code! When writing code, a coder needs to think not only what the code will do,
    but what will trigger that event.


