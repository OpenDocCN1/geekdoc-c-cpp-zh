    > A DOT IS ONE QUICK FLASH OF THE LIGHT OR ONE QUICK TAP SOUND.


    > A DASH IS A FLASH OF THE LIGHT OR TAP SOUND THAT IS THREE TIMES LONG AS A DOT.


    # MORSE CODE


    Before telephones, people sent telegrams using Morse code. A person would take
    a message to a telegram office and give it to the operator. The operator would
    change the message into Morse code and tap it into a machine. The signal would
    travel through long wires to an operator on the other end, who would change the
    Morse code into a message using the regular alphabet.


    # WHAT''S GOING ON?


    You could send and receive signals along a telephone, but you might find it perfectly
    easy. But what if you wanted to send a message without any wires? Morse code is
    a code of dots and dashes that represents letters, numbers, and punctuation. If
    you use it, you can send a message to another person with just a flashlight or
    another sound!


    # THINK ABOUT IT


    Can you think of another way to use light or sound to send Morse code to send
    messages?


