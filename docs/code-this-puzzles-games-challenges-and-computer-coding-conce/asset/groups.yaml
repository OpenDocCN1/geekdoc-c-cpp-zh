    ## CODING CONCEPT: BINARY SEARCH


    We use computers to help us find the answers all the time. Did you ever wonder
    how computers find the answers so quickly? One type of algorithm that computers
    use to find information is called binary search. Binary searches, like binary
    code, rely on the power of two. Let''s see how!


    ## DID YOU PLAY "GUESS MY NUMBER?"


    In this game, one person thinks of a number, and the other tries to guess it.
    For example, two friends decide to play this game. They decide that the rules
    of the game are:


    1. The number has to be between 1 and 10.

    2. After every incorrect guess, the person thinking of the number has to say whether
    their number is higher or lower. It might go something like this:


