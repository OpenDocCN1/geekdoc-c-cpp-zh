    > THE "BI" IN BINARY MEANS TWO—nJUST LIKE THERE ARE TWO WHEELS ON A BICYCLE.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_73_0.png)


    Morse code is a kind of binary code. All the letters in the Morse code alphabet
