    - A piece of paper and a pencil or pen

    - Six small objects, like coins or blocks—with three of one kind and three of
    another to symbolize the frogs and toads


    > I''m more of a howler than a hopper


    CODING CONNECTION

    Did you know that frogs and toads have different characteristics? In programming,
    these are called constraints. They are limits or rules that help us solve problems
    in a specific way.


