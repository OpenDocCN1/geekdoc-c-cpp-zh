- md: "\n![](img/ff0a36fd32e78d548bb789af8cd599c4_96_0.png)\n\n# TENNIS FOR TWO\n\n\
    One of the earliest video games dates back to 1958. Players of the game Tennis\
    \ for Two tried to hit an electronic 'ball' back and forth over a net. Users could\
    \ only do one of two things: twist a knob to control the angle of the ball or\
    \ press a button to 'hit' the ball back to the other side.\n\n# CODY'S CODING\
    \ CHALLENGE\n\n## CODING CONCEPT: USERS AND EVENTS\n\n## TRY IT OUT\n\n## REMOTE-CONTROL\
    \ CODY\n\nThe first thing that Cody needs to do to get the satellite back up and\
    \ running is to push some of the buttons on the control panel. Use the command\
    \ blocks to write a code that will tell Cody what to do when the Explorers press\
    \ keyboard buttons back on Earth. Write out the whole algorithm for the Explorers\
    \ and Cody to press the buttons in the right order. The satellite should move\
    \ every time Cody presses a button.\n\n## CODE TOOLBOX\n\n| WHEN LEFT ARROW |\n\
    | :--- |\n| WHEN RIGHT ARROW |\n| WHEN UP ARROW |\n| WHEN DOWN ARROW |\n| WHEN\
    \ SPACE BAR |\n| WHEN PUSH BUTTON |\n| MOVE LEFT |\n| MOVE RIGHT |\n| MOVE UP\
    \ |\n| MOVE DOWN |\n| PUSH BUTTON |\n| REPEAT TIMES |\n| DO |\n| SATELLITE MOVES\
    \ |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_97_0.png)\n\n# Remember Cody can\
    \ only do one thing at a time\n\nCORRECT ORDER:\n\n| | | | |\n| :--- | :--- |\
    \ :--- | :--- |\n| square | triangle | circle | square |\n| circle | square |\
    \ triangle | circle |\n| square | square | triangle | triangle |\n| square | triangle\
    \ | circle | square |\n\n# BREAK IT DOWN\n\n## CODING CONCEPT: PIXELS\n\n> Just\
    \ call me Spot!\n\n## DECODE THE CONCEPT\n\nAll the images, or **graphics**, on\
    \ a computer screen are made of **pixels**. Coders tell which of these dots should\
    \ be colored in by using code. Let's say a coder wanted to create this picture\
    \ on the screen.\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_99_0.png)\n\nHow\
    \ can you write code for the pattern shown?\n\n# PIXEL\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_99_1.png)\n\
    \n# Here's how it works.\n\n1. Start in the first space of the grid, the one's\
    \ in the upper left-hand corner. (Don't start outside the grid!)\n2. The first\
    \ space is white, so you can just write code to move one space to the right: >\n\
    3. This space is black, so you need to use a command that means \"color this space\
    \ in!\": X\n4. Oops, out of squares! Tell the computer to move down one space:\
    \ D\n5. That space is white, so tell the computer to move one space to the left:\
    \ <. It's a black space! So color it in: X\n6. Move over two spaces to get to\
    \ the next black square: << and color it in: X\n\nMove right to the next space:\
    \ >\nIt's white, so move right again: > and then tell the computer to color the\
    \ space in: X\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_0.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_1.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_100_2.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_3.png)\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_4.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_5.png)\n\
    \n> THE CODE FOR THE FIRST TWO ROWS OF THE CHECKERBOARD LOOKS LIKE THIS:\nX>>KD<<X\n\
    CAN YOU FINISH THE REST?\n\n> You can make pictures out of dots? Color me impressed!\n\
    \n# WHAT TO DO\n\n1. Starting in the upper left-hand corner, and moving to the\
    \ right and then down, SEE WHICH PIXELS SHOULD BE COLORED IN.\n2. Now WRITE YOUR\
    \ CODE. Using the symbols in the toolbox write code that your friend can use to\
    \ re-create the hippo on the graph paper.\n3. When you have finished, ASK A FRIEND\
    \ TO FOLLOW YOUR CODE using a clean piece of graph paper. Does the picture look\
    \ exactly the same as original?\n\n## CODE TOOLBOX\n\n| Move right | Color in\
    \ blue |\n| :--- | :--- |\n| Move left | Color in pink |\n| Move down | Color\
    \ in gray |\n| | Color in black |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_102.png)\n\
    \nWHAT'S GOING ON?\nAll the things we see on a computer screen, from the words\
    \ we type to the moving graphics in our favorite games, are because of the way\
    \ code tells a computer to light up pixels on a screen.\n\n# CODY'S CODING CHALLENGE\n\
    \n## CODING CONCEPT: PIXELS\n\n## TRY IT OUT\n\n## WHICH BUTTON?\n\nThe next step\
    \ to fixing the satellite is for Cody to push buttons. The Explorers need to tell\
    \ Cody what it should be looking for. The button code has to be exact match of\
    \ what is in Cody's memory, or it won't know which buttons to push. (It is fussy\
    \ like that.) Cody can't read the picture, so you need to send directions of what\
    \ each button looks like. Can you write the code for each of these pictures? Then\
    \ Cody will know what to look for.\n\n## CODE TOOLBOX\n\n| Move right | Color\
    \ in black |\n| :--- | :--- |\n| Move left | Color in red |\n| Move down | Color\
    \ in yellow |\n| | Color in pink |\n| | Color in gray |\n| | Color in tan |\n\
    | | Color in light green |\n| | Color in dark green |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_103_0.png)\n\
    \n# BUTTON 1 START\n# BUTTON 2 START\n# BUTTON 3 START\n# BUTTON 4 START\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_104_0.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_104_1.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_104_2.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_104_3.png)\n\n# BREAK IT DOWN\n\n## CODING\
    \ CONCEPT: DECOMPOSITION\n\n## DECODE THE CONCEPT\n\nSometimes problems can feel\
    \ pretty big. And it's no different for coders when they are writing algorithms.\
    \ **Decomposition** is one strategy that can help make big problems easier to\
    \ deal with. In decomposition, you break a big problem down into smaller pieces.\n\
    \n> DID YOU KNOW\nMusicians like Mozart and Beethoven are called composers because\
    \ they put together music, like notes in a story, something bigger like a symphony.\
    \ Decomposition of a problem is the opposite—breaking it down into smaller pieces.\n\
    \nI can sleep all day long by breaking up the day into 2-hour nap blocks!\n\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_105_0.png)\n\n# TRY IT OUT\n\n## WHAT\
    \ YOU'LL NEED\n\n- Construction paper\n- This pattern:\n  - Small\n  - Medium\n\
    \  - Large\n- A pen or pencil\n- Scissors\n- A piece of blank paper\n\n## DISC\
    \ DECOMPOSITION\n\nOne of the ways to practice decomposition is to use a puzzle\
    \ that looks like this.\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_106_0.png)\n\
    \nThe goal of this puzzle is to move all the discs from Tower 1 to Tower 3. There\
    \ are two constraints: You cannot put a larger disc onto a smaller disc, and you\
    \ must move only one disc at a time. Try making some discs of your own to see\
    \ if you can decompose a solution to the problem.\n\n## WHAT TO DO\n\n1. DRAW\
    \ EACH CIRCLE on a separate piece of construction paper\n2. Carefully CUT OUT\
    \ EACH CIRCLE with the scissors\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_106_1.png)\n\
    \n# DISC DECOMPOSITION CONTINUES\n\n# DISC DECOMPOSITION\n\n> Did someone say\
    \ discs? I'll play!\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_107_0.png)\n\n\
    ## WHAT TO DO\n\n3. DIVIDE THE PLAIN PIECE OF PAPER INTO THREE COLUMNS. Label\
    \ the first column 'Tower 1', the second column 'Tower 2' and the third column\
    \ 'Tower 3'.\n4. PLACE THE THREE CIRCLES IN A STACK IN THE COLUMN LABELED TOWER\
    \ 1. The largest circle should be on the bottom, and the smallest one on top.\n\
    5. Can you figure out how to MOVE ALL THE DISCS TO TOWER 3 without ever putting\
    \ a larger disc on top of a smaller one?\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_107_1.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_107_2.png)\n\n# 5\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_108_0.png)\n\
    \n# WHAT'S GOING ON?\n\nSolving problems can be a big challenge. Coders break\
    \ them into small pieces... and smaller pieces and even smaller pieces... until\
    \ they find a piece of the problem that they can solve. Then they apply what they\
    \ learned to solve other pieces of the problem. They repeat this process until\
    \ they can put all their solutions together to solve the entire problem.\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_108_1.png)\n\
    \nCan you work with an angle and permutations could help us solve this puzzle?\
    \ There is a legend in which a person trying to solve this problem used 64 years.\
    \ If the legend happened in real life the result would take SBS billion years\
    \ to finish!\n"
  mdcn: "\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_96_0.png)\n\n# 双人网球\n\n最早的视频游戏之一可以追溯到1958年。《双人网球》（Tennis\
    \ for Two）的玩家试图在球网两侧回击一个电子“球”。用户只能做两件事之一：旋转旋钮来控制球的角度，或按下按钮将球“击”回另一侧。\n\n# CODY\
    \ 的编程挑战\n\n## 编程概念：用户与事件\n\n## 尝试一下\n\n## 遥控 CODY\n\nCody 为了让卫星恢复运行需要做的第一件事是按下控制面板上的某些按钮。使用命令块编写一段代码，告诉\
    \ Cody 当探险者在地球上按下键盘按钮时应该做什么。为探险者和 Cody 写出完整的算法，让他们按照正确的顺序按下按钮。每当 Cody 按按钮时，卫星就应该移动。\n\
    \n# 代码箱\n\n| 当按下左箭头 |\n| :--- |\n| 当按下右箭头 |\n| 当按下上箭头 |\n| 当按下下箭头 |\n| 当按下空格键\
    \ |\n| 当按下按钮 |\n| 向左移动 |\n| 向右移动 |\n| 向上移动 |\n| 向下移动 |\n| 按下按钮 |\n| 重复次数 |\n|\
    \ 执行 |\n| 卫星移动 |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_97_0.png)\n\n# 记住\
    \ Cody 只能做一件事\n\n正确顺序：\n\n| | | | |\n| :--- | :--- | :--- | :--- |\n| 正方形 | 三角形\
    \ | 圆形 | 正方形 |\n| 圆形 | 正方形 | 三角形 | 圆形 |\n| 正方形 | 正方形 | 三角形 | 三角形 |\n| 正方形 | 三角形\
    \ | 圆形 | 正方形 |\n\n# 拆解它\n\n## 编程概念：像素\n\n> 就叫我 Spot 吧！\n\n## 解码概念\n\n电脑屏幕上所有的图像或**图形**都是由**像素**组成的。程序员通过代码告诉计算机哪些点应该被上色。假设一个程序员想在屏幕上创建这张图片。\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_99_0.png)\n\n你如何为所示的图案编写代码？\n\n# 像素\n\
    \n![](img/ff0a36fd32e78d548bb789af8cd599c4_99_1.png)\n\n# 它是这样工作的。\n\n1. 从网格的第一个空格开始，即左上角的。（不要从网格外开始！）\n\
    2. 第一个空格是白色的，所以你可以直接写代码向右移动一步：>\n3. 这个空格是黑色的，所以你需要使用表示“给这个空格上色！”的命令：X\n4. 哎，没格子了！告诉计算机向下移动一步：D\n\
    5. 该空格是白色的，所以告诉计算机向左移动一步：。<这是一个黑色空格！所以给它上色：X\n6. 向左移动两个空格到达下一个黑色格子：<< 并给它上色：X\n\
    \n向右移动到下一个空格：>\n它是白色的，再次向右移动：> 然后告诉计算机给该空格上色：X\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_0.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_100_1.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_2.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_100_3.png)\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_100_4.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_100_5.png)\n\n> 棋盘前两行的代码看起来这样：\nX>>KD<<X\n\
    你能完成剩下的部分吗？\n\n> 你能用点组成图片？太让我惊艳了！\n\n# 要做什么\n\n1. 从左上角开始，向右移动再向下移动，看看哪些像素应该被上色。\n\
    2. 现在**编写你的代码**。使用工具箱中的符号编写代码，让你的朋友可以在网格纸上重新创建这只河马。\n3. 完成后，请一位朋友使用干净的网格纸遵循你的代码。图片看起来和原来的一模一样吗？\n\
    \n## 代码箱\n\n| 向右移动 | 涂蓝色 |\n| :--- | :--- |\n| 向左移动 | 涂粉色 |\n| 向下移动 | 涂灰色 |\n\
    | | 涂黑色 |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_102.png)\n\n我们在电脑屏幕上看到的所有东西，从我们输入的文字到我们喜爱的游戏，都是因为代码告诉电脑如何点亮像素。\n\
    \n# CODY 的编程挑战\n\n## 编程概念：像素\n\n## 尝试一下\n\n## 哪个按钮？\n\n修复卫星的下一步是让 Cody 按按钮。探险者需要告诉\
    \ Cody 它应该寻找什么。按钮代码必须与 Cody 记忆中的完全匹配，否则它就不知道按哪些按钮。（这很挑剔。）Cody 无法读取图片，所以你需要发送每个按钮的样子。这样\
    \ Cody 就会知道找什么。\n\n## 代码箱\n\n| 向右移动 | 涂黑色 |\n| :--- | :--- |\n| 向左移动 | 涂红色 |\n\
    | 向下移动 | 涂黄色 |\n| | 涂粉色 |\n| | 涂灰色 |\n| | 涂棕色 |\n| | 涂浅绿色 |\n| | 涂深绿色 |\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_103_0.png)\n\
    \n# 按钮 1 开始\n# 按钮 2 开始\n# 按钮 3 开始\n# 按钮 4 开始\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_104_0.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_104_1.png)\n![](img/ff0a36fd32e78d548bb789af8cd599c4_104_2.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_104_3.png)\n\n# 拆解它\n\n## 编程概念：拆解\n\n\
    ## 解码概念\n\n有时候问题看起来非常大。程序员在编写算法时也一样。**拆解**（Decomposition）是一种可以更容易处理大问题的策略。在拆解中，你将一个大问题拆分成更小的部分。\n\
    \n> 你知道吗\n> 扎特和贝多芬这样的音乐家被称为作曲家，是因为他们把音符组合成故事，变成更大的交响乐。问题的拆解则是相反的——将其分成更小的部分。\n\
    \n我可以通过把一天拆分成 2 小时的小块来睡一整天！\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_105_0.png)\n\
    \n# 尝试一下\n\n## 你需要\n\n- 彩色纸\n- 这种形状：\n  - 小\n  - 中\n  - 大\n- 笔或铅笔\n- 剪刀\n- 一张白纸\n\
    \n## 圆盘拆解\n\n练习拆解的方法之一是使用这样的谜题。\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_106_0.png)\n\
    \n这个游戏的目标是将所有的圆盘从1号移动到3号。有两个限制：你不能将大盘放在小盘上，并且每次只能移动一个盘。尝试自己制作一些盘，看看是否能拆解出解决方案。\n\
    \n# 要做什么\n\n1. 在单独的彩色纸上**画出每个圆形**。\n2. 用剪刀小心地**剪出每个圆形**。\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_106_1.png)\n\
    \n# 圆盘拆解继续\n\n# 圆盘拆解\n\n> 有人说圆盘吗？我来玩！\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_107_0.png)\n\
    \n# 要做什么\n\n3. 将这张白纸分成三列。将第一列标记为“1号塔”，第二列标记为“2号塔”，第三列标记为“3号塔”。\n4. 将三个圆形叠放在标记为“1号塔”的列中。最大的圆形应该在底部，最小的在上面。\n\
    5. 你能想出如何将所有圆盘移动到3号塔，而不将大盘放在小盘之上吗？\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_107_1.png)\n\
    ![](img/ff0a36fd32e78d548bb789af8cd599c4_107_2.png)\n\n# 5\n\n![](img/ff0a36fd32e78d548bb789af8cd599c4_108_0.png)\n\
