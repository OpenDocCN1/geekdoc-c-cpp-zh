    ## DECODE THE CONCEPT


    Computers don''t get bored doing the same thing over and over again, but people
    do! One of the shortcuts that coders take when writing directions is called a
    loop. A loop is any action that''s done more than one time in a row. Clap your
    hands three times. You just did a loop!


    It''s easy to use!


    Just fit the command you want to do into the slot.


    THE COMMAND BLOCK FOR A LOOP LOOKS LIKE THIS:


    | REPEAT | TIMES |

    |---|---|

    | DO | A |


