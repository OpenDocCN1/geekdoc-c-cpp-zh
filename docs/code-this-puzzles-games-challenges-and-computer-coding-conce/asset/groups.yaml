    # 引言


    # 编码与计算机科学


    这本书的标题是《动手编程！》，但实际上我们要学习两件事。其一是思考如何解决通用问题的艺术，这被称为计算机科学。另一件是解释如何执行某个特定任务的艺术，这被称为编程或编码。我们把它们统称为“艺术”，因为它们需要与你绘画、唱歌或讲故事时同样的创造力。


    为什么它们是不同的艺术呢？因为为了让计算机能够清晰地理解某件事，你首先必须能够自己进行思考。如果你的想法没有逻辑，反映出的结果也就没有意义。就像不同的艺术一样，计算机科学和计算机编程使用不同的工具。如果你在绘画课上，你使用画笔和铅笔；如果你在乐队里，你使用乐器。不同的艺术也是如此。在计算机科学中，你的工具包括逻辑和数学；在计算机编程中，你编写特定的代码。计算机科学和编码就像拼图碎片——它们互不相同，但可以组合在一起解决问题。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_9_0.png)


    # 实际应用


    ### 我们用计算机科学做什么？


    几乎可以做任何事！世界越来越依赖计算机——通过互联网发送和接收信息、使用手机、看电视以及玩游戏。甚至你现在拿着的这本书也是在计算机上写出来的。


    > 医生在……？计算机科学家编写程序帮助医生了解并治愈疾病。特殊程序甚至可以帮助医生进行手术。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_0.png)


    有时了解地球最好的方法是研究太空。程序员编写代码，帮助卫星进入太空拍摄照片。它们还控制着在火星表面或太阳系其他行星大气层运行的机器。你喜欢摇滚、嘻哈还是爵士乐？这一切都感谢计算机。需要特殊代码来让你最喜欢的歌曲完美地奏响。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_1.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_2.png)


    当我们休息时，计算机也在努力工作。软件工程师编写计算机，让你喜欢的电影和游戏变成现实。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_3.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_4.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_5.png)


    # 逻辑思维


    # 什么是逻辑？


    优秀的编码者在处理问题时总是考虑逻辑。逻辑就是以合理的方式思考某件事。早上穿衣服时，你不会先穿鞋再穿袜子吧？那不符合逻辑。如果目标是把袜子穿在鞋子里，先穿袜子才更符合逻辑——更合理。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_1.png)


    # 计算机逻辑


    > 如果我的计算机要“运行”我的程序，它需要袜子和鞋！


    因为编程计算机的理念是以一种让计算机执行某事并达成目标的方式编写指令，这有助于思考如何以合理的方式编写这些指令。嘿，这就是逻辑！所以，解决问题是计算机科学的大部分。计算机使用逻辑吗？在某种程度上，是的。事实上，构成计算机的微小电子元件是以特殊的逻辑组合在一起的。


    但计算机逻辑与人类逻辑不同。人类大脑具有创造力。它还擅长感知周围的世界，并在尝试下一步做什么时考虑到这一切。所以，最终需要人类来构思解决问题的方法，并告诉计算机如何去做。


    动手编程！


    # 为什么计算机需要代码？


    计算机就像其他工具。螺丝刀不会自己把螺丝拧进板里。需要人拿起螺丝刀，将正确的端对准螺丝，将螺丝刀尖与螺丝上的槽对齐，向下按，按正确的方向旋转螺丝，直到螺丝到位。


    现在，你可能不需要思考就能完成这一切。但如果你不按照正确的顺序执行这些操作，它就无法正确工作——或者根本无法工作！计算机科学家思考如何编写指令，让计算机尽可能快速地完成任务。如果他们写得正确，正确的计算机就能胜任任何工作！


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_12_0.png)


    # 试一试


    # 认识青蛙


    认识 Frontus 机器人蛙（不是真正的青蛙也不是真正的机器人）。这个机器人是一个非常简单的计算机。它只能向前跳——而且一次只能跳一下。而且和所有计算机一样，它不会做任何没有被程序过的事情！


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_1.png)


    超级弹簧的腿和脚帮助青蛙跳跃远距离。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_2.png)


    除非接到指令，否则青蛙无法转弯。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_3.png)


    它的眼睛和天线可以感知障碍物。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_4.png)


    与真正的青蛙不同，青蛙只能做它被程序过的事情。


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_5.png)


