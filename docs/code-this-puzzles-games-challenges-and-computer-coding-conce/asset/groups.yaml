    # INTRODUCTION


    # CODING AND COMPUTER SCIENCE


    The title of this book is Code This!, but there are actually two things we''re
    going to learn. One is the art of figuring out how to do things in general. That''s
    called computer science. The other is the art of explaining how to do something
    in particular. That is called programming, or coding. We call them both "arts"
    because they require the same creativity you use when drawing, singing, or telling
    stories.


    Why are they different arts? Because in order to explain something clearly for
    a computer to understand, you first have to be able to think about it yourself.
    If your thoughts don''t make sense, the reflection won''t make sense. And like
    kinds of art, computer science and computer programming use different tools. If
    you''re in painting class, you use brushes and pencils. If you''re in band, you
    use a musical instrument. It''s the same with different kinds of arts. In computer
    science, your tools include logic and math. In computer programming, you write
    specific code. Computer science and coding are like puzzle pieces—they''re different
    from each other, but they fit together to solve a problem.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_9_0.png)


    # PRACTICAL APPLICATIONS


    ### What can we do with computer science?


    Almost anything! The world increasingly relies on computers—to send and receive
    information through the internet, to use mobile phones, to watch television, and
    to play games. Even this book you''re holding right now was written on a computer.


    > The doctor is in... the computer? Computer scientists write programs that help
    doctors learn diseases and how to cure them. Special programs can even help doctors
    do surgery.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_0.png)


    Sometimes the best way to learn about Earth is to study space. Computer programmers
    write code that helps satellites look deep into space to grab photos. They also
    control the machines that scramble over surfaces, like on Mars, or high in the
    atmosphere of other planets in our solar system. Do you like to rock out, or are
    you more of the classical type? Hip-hop, salsa, jazz—if you''re listening it courtesy
    of a computer. It takes special code to make your favorite songs sound perfectly
    in tune.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_1.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_2.png)


    Computers are hard at work even when we are relaxing. People-called software engineers
    program computers to make your favorite movies and video games come to life.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_3.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_4.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_10_5.png)


    # THINKING LOGICALLY


    # WHAT IS LOGIC?


    Good coders always consider logic when they tackle a problem. Logic is just thinking
    about something in a way that makes sense. When you''re getting dressed in the
    morning, you wouldn''t put your shoes before your socks, would you? That wouldn''t
    make sense. If the goal is to have your socks under your shoes, it''s more logical—that
    is, it makes more sense—to put your socks on first.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_11_1.png)


    # COMPUTER LOGIC


    > My computer will

    need socks and

    shoes if it''s going to

    "run" my program!


    Since the idea behind programming a computer is to write directions in a way that
    gets the computer to do something, accomplish a goal, then it helps to think about
    how to write those directions in a way that makes sense. Hey, that''s logic! So,
    doing logic problems is a big part of computer science. Do computers use logic?
    In a way, they do. In fact, the tiny electronic parts that make up computers are
    put together in a way that uses a special kind of logic.


    But computer logic is different from human logic. A human brain is creative. It''s
    also great at sensing the world around us and taking all of what it senses into
    consideration as it tries to figure out what to do next. So, ultimately, it takes
    the human mind to dream up the best way to solve a problem, and to tell the computer
    how to do it.


    CODE THIS!


    # WHY DO COMPUTERS NEED CODE?


    A computer is like any other kind of tool. A screwdriver won''t drive a screw
    into a board by itself. It takes a person to pick up the screwdriver, point the
    correct end of the screwdriver towards the screw, line up the tip of the screwdriver
    with the slot on the screw, put the end into the slot, push down, turn the screw
    in the right direction, and stop when the screw is all in.


    Now, you''d probably do all of that without thinking about it too much. But if
    you didn''t do all of those things in the right order, it wouldn''t be able to
    do its job correctly—or at all! The computer scientists think about how to write
    the directions so the computer works to do a task completely and as quickly as
    possible. If they write them correctly, the right kind of computer will be able
    to do any kind of job!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_12_0.png)


    # TRY IT OUT


    # MEET THE FROGBOT


    Meet the Frontus robotic frog (not a real frog or a real robot). This robot is
    a very simple computer. It can only jump forward—and it can only hop at a time.
    And, like all computers, it doesn''t do anything it''s not programmed to do!


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_1.png)


    Super spongyy legs and feet help frogbot leap long distances.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_2.png)


    Frogbot can''t turn unless it''s instructed to.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_3.png)


    Its eyes and antenna can sense obstacles.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_4.png)


    Unlike a real frog, frogbot can only do what it''s programmed to do.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_13_5.png)


    Frogbot can only complete one command at a time. It can move forward or it can
    rotate. not both

