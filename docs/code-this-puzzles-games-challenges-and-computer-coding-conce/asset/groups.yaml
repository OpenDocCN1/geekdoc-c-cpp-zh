  - '[PAGE 157]


    # GLOSSARY


    **algorithm**: a set of steps or list of instructions a computer uses to accomplish
    a goal


    **coding**: the process of thinking about and writing down instructions for a
    computer


    **ASCII**: a type of binary code that represents letters, numbers, and symbols
    (ASCII stands for American Standard Code for Information)


    **combine**: to put two or more parts of something together


    **binary**: made of two things


    **command**: an instruction that a computer follows


    **binary code**: code that uses two symbols to represent letters, numbers, and
    other characters


    **computer science**: the study of how to write logical computer programs


    **binary search**: the process of repeatedly dividing a large amount of information
    to find a specific piece of information


    **conditional**: a piece of code that causes a computer to choose one of two paths


    **constraint**: anything that might keep a solution to a problem from working
    (or working well)


    **bug**: a mistake in computer code that causes a program to run poorly or in
    a way that is not expected


    **cryptology**: the study of writing and breaking codes


    **cipher**: a message written in a secret language


    **debugging**: the process of going through code to find problems


    **cipher wheel**: a tool used to write and decode ciphers


    **decomposition**: the process of breaking down a problem into smaller parts that
    are easier to solve


    **code**: the specific directions written for a computer to follow


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_157_0.png)'
  - '[PAGE 158]


    efficient: working in the best possible way


    pixel: a tiny piece of a picture on a computer screen


    event: anything that causes a computer program to run a certain way


    programming: the process of writing code for computers


    global positioning system (GPS): a tool that uses computers and satellite signals
    to help people find their location on Earth


    sonar: a tool that uses sound waves bouncing off of something to determine its
    location


    graphics: the pictures that computers make by reading code


    # labyrinth: a maze


    logic: thinking about something in a way that makes sense


    strategy: a plan used to accomplish a goal


    substitution cipher: a message written in a secret language in which each letter
    is replaced by a different symbol


    loop: a set of steps that are followed over and again


    Traveling Salesperson: a computer logic problem that asks the user to find the
    shortest path between a group of points


    Lovelace, Ada: English countless wrote the first algorithm and is considered to
    be the world''s first computer programmer


    trial and error: a way to solve problems that involves making a guess, being wrong,
    and then again


    Morse code: a type of binary code made of dots and dashes (short and long signals)


    user: a person that uses a computer


    optimize: to write computer code so that it works best for a particular situation


