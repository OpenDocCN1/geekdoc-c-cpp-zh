    # ### WHAT''S SONAR?


    People use sonar (Sound Navigation and Ranging) to help them find things around
    underwater or identify objects that are ship under the surface. Sonar sends sound
    waves into the water and then measures how long it takes the waves to return after
    they''ve bounced off an object. People are not the only creatures to use sound
    waves to find things—animals such as bats and whales have their own echolocation
    abilities.


