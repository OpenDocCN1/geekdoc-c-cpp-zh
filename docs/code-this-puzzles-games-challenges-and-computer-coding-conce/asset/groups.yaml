    # >> THE CHALLENGE


    ## DEEP-SEA SURPRISES


    OBJECTIVE: WRITE AN ALGORITHM FOR CODY TO PHOTOGRAPH EACH CREATURE AND SEND ITS
    NAME TO THE EXPLORERS.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_83_0.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_83_1.png)


    OK, Coder Crew. You''ve learned a lot in this chapter about debugging, binary
    searches, and binary code. Time to put it all together and send Cody on a deep-sea
    expedition.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_83_2.png)


    Cody''s mission is to find and photograph each deep-sea creature shown on the
    map. Cody needs to first get to the creature without going through the dark spots.
    Then Cody should snap a photo of the creature. Finally, Cody should send the name
    to the Explorers back on the ship using ASCII code. Then Cody can move on to the
    next creature.


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_83_3.png)


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_83_4.png)


    Write your algorithm for Cody to find and photograph each sea creature and send
    its name back to the Explorers. Then follow your algorithm below. Don''t forget
