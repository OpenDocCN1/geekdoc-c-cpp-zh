    You''ve probably worked your way through a maze, but have you ever really thought
    about all the different parts of a maze? You can use the parts of a maze to understand
    how to write a maze-solving code!


    > Who knew that mazes had parts? Me that''s who!


    ENTRANCE

    The starting point, or where you enter the maze from the outside


    WALL

    The barriers that you cannot pass through within the maze. The spaces between
    the walls form the paths.


    PATH

    A route you travel through a maze


    ![](img/ff0a36fd32e78d548bb789af8cd599c4_45_0.png)'
