    A spot in the maze where a path comes to an end—you have no choice but to turn
    around and choose a different direction.


    # BACKTRACK


    Turning around to try a new path


    # EXIT


    The end point of the maze


    # JUNCTION


    A point in the maze where paths branch off from each other or meet up with each
    other


    # SOLUTION


    A successful path from the entrance to the exit'
