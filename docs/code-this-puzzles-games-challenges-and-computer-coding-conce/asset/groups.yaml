    # > BREAK IT DOWN


    # CODING CONCEPT:

    BINARY SEARCH


    We use computers to help us find the answers to problems all the time. Did you
    ever wonder how computers can find the answers so quickly? One type of algorithm
    that computers use to find information is called a binary search. Binary searches,
    like binary code, rely on the power of two. Let''s see how!


    DID YOU EVER PLAY "GUESS MY NUMBER?" In this game, one person thinks of a number,
    and the other tries to guess it. For example, two friends decide to play this
    game. They decide that the rules of the game are:


    +   1. The number has to be between 1 and 10.

    2. After every incorrect guess, the person thinking of the number has to say whether
    their number is higher or lower. If the correct number is 7, it might go something
    like this:


    At the beginning of the game, any number between 1 and 10 could be the right answer.

    After the first guess, only numbers higher than 3 can be correct: 4, 5, 6, 7,
    8, 9 or 10.

    After the next guess of 9, only 4, 5, 6, 7, or 8 could be right. Each time the
    number of right answers is cut into two parts until only the right answer (7)
    is left!


    > CODING CONNECTION

    Some kinds of binary search are used to quickly search a warehouse. Databases
    are large pools of information Some of the world''s largest data help us to search
    the internet, to watch online and to contact others email or phone


