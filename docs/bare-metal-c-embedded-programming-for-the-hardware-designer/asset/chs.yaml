  \n\n\n\n\n\nSteve Oualline 拥有超过 50 年编写嵌入式系统可靠、低 Bug 程序的经验。他拥有南加州大学的科学硕士学位，并为 No\
  \ Starch Press 和 O’Reilly 出版过许多部书籍。他目前是南加州铁路博物馆的志愿者，他最近的一个项目是为他们的 `Acme Traffic`\
  \ 信号灯计算机控制器进行调试（由于蚂蚁在里面筑了巢，不得不将其清理）。你可以访问他的个人网站：[`oualline.com`](http://oualline.com)。\n\
  \n## 关于技术审查员\n\nFrank Duignan 于 1988 年毕业，是一名电气工程师。从那时起他主要工作在硬件与软件的接口领域。他目前在都柏林科技大学教授电气/电子工程课程。Frank\
  \ 的博客位于：[`ioprog.com`](https://ioprog.com)。\n\n\n\n\n这本书名为 `Bare Metal C`（裸机 C），因为它是为那些贴近硬件的人准备的。它不是给那些买来箱式电脑且从不看内部的人准备。书中使用的计算机甚至没有外壳。如果你想使用它，就必须在板子的“裸金属”上连接某些东西。\n\
  \n本书将教你嵌入式编程。`嵌入式计算机`是位于机器内部的，你甚至不知道它的存在。它是运行你的车库门开启器、微波炉、汽车，甚至是问候卡的设备。但在执行这些任何功能之前，需要对其进行编程。这正是本书要教你的：如何编写嵌入式系统。\n\
  \n### 为什么选择 C？C 语言让你对程序的执行行为进行精确控制，而其他语言（如 `C++`）可能会在你背后背后执行很多事情。考虑以下语句：\n\n```c\n\
  a = b;\n```\n\n在 `C++` 中，这可能会调用类的赋值操作符函数，这可能导致堆内存的分配和释放，并抛出异常。这些这些意义现在并不重要；重点在于，你并不确切知道会发生什么。\n\
  \n在 `C` 中，这条语句将值 `b` 赋值给变量 `a`，没有任何副作用；它只是一个赋值，仅此而已。这个例子很简单，但在书中，你将看到 `C` 在处处完全按照你的指令执行的其他方式。\n\
  \n精确控制非常重要，因为我们正在使用 `C` 来编写一个基于 `STM32F030x4` 处理器（一种廉价的基于 `ARM Cortex-M0` 的系统）、具有\
  \ 8KB RAM 的低端`片上系统 (SOC)`。在 RAM 有限的情况下，内存管理非常重要，我们无法负担 `C++` 这样的高级语言在我们背后操控内存。精确控制同样重要，因为嵌入式系统没有操作系统，你需要直接告诉硬件该做什么。高级语言并不总是能让你与硬件交互，但\
  \ `C` 可以。\n\n本书是为具有计算机和硬件基础知识，但编程知识有限的人们设计的。它适用于想要将新硬件连接到微控制器并首次使用它的硬件设计人员。它也适用于对底层编程感兴趣，并想要充分利用一颗\
  \ 38 分钱芯片价值的程序员。\n\n为了让你的程序发挥最大作用，你需要了解底层到底发生了什么。本书不仅会教你如何编写程序，还会教你程序如何被翻译成 `ARM`\
  \ 芯片使用的机器码。这对于实现最高效率非常重要。例如，你将学习如果将程序从使用 16 位整数改为 32 位整数会带来多大的性能损失。令人惊讶的答案是，32 位整数`更高效`且`更快`（32\
  \ 位是 `ARM` 的原生数字宽度，如果它被强制执行 16 位算术运算，它会进行 32 位计算然后丢弃 16 位）。\n\n为了编程和调试 `ARM` 芯片，你需要一些额外的工具：闪存内存编程器（将你的代码写入机器）、USB\
  \ 转串口转换器（因为我们使用串口线进行调试）以及 JTAG 调试器。由于几乎所有开发者都需要这组工具，意法半导体（STMicroelectronics）制造了一个提供你所需所有硬件的板，称为\
  \ `NUCLEO-F030R8`。在写本文时，芯片短缺导致某些板子难以找到。访问 [`nostarch.com/bare-metal-c`](https://nostarch.com/bare-metal-c)\
  \ 查看替代板卡。你还需要一根微型 USB 线（那种不适合你手机的线），以便将板子接入电脑。\n\n你的第一个任务是订购一个 `NUCLEO-F030R8`。然后开始阅读第一章。等板子到达时，你已经准备好了。\n\
  \n\n你使用的工具被设计得简单快速方便，这对于常规编程是好事，但对于嵌入式编程可能是坏事。编译器 `GCC` 实际上运行大量工具的封装器。我们将查看每个工具如何将代码转化为执行。在这个过程中，你将发现优化器带给了我们一个惊喜。尽管我们的程序非常简单，优化器也会决定重写部分内容以使其更高效——而且它不会告诉我们重写了！事实上，如果不查看底层发生了什么，我们永远不会知道。（我不会告诉你它对我们做了什么；你必须阅读本章的内容才能找到答案。）\n\
  \n\n在 Windows 上，安装 Minimalist GNU for Windows (`MinGW`)，你可以在 [`www.mingw.org`](http://www.mingw.org)\
  \ 获取。访问 [`nostarch.com/bare-metal-c`](https://nostarch.com/bare-metal-c) 获取详细说明。\n\
  \n在 macOS 上，`GCC` 编译器是开发包的一部分，可以通过命令访问：\n\n```\n$ xcode-select --install\n```\n\n\
  在安装时选择**命令行工具**（Command Line Tools）。\n\nLinux 安装说明取决于你使用的发行版。对于 Debian 系统（如 Ubuntu\
  \ 和 Linux Mint），使用以下命令：\n\n```bash\n$ sudo apt-get install build-essential\n$ sudo\
  \ apt-get install manpages-dev\n```\n\n对于 Red Hat 类系统（如 Fedora 或 CentOS），使用以下命令：\n\
  \n```bash\n$ yum groupinstall \"Development Tools\"\n```\n\n\n\n\n```\n$ dnf groupinstall\
  \ \"Development Tools\"\n```\n\n对于任何其他基于 Linux 的系统，请使用系统自带的包管理器，或在网上搜索查找所需的安装命令。\n\
  \n安装软件后，打开终端窗口并输入命令 `gcc`。如果你收到“no input files”错误，说明你已经安装成功了。\n\n```\n$ gcc\ngcc:\
  \ fatal error: no input files\ncompilation terminated.\n```\n\n```\n\n使用记事本（Notepad）、Vim\
  \ 或 Gedit 等文本编辑器创建一个名为 `hello.c`的文件并输入以下代码：\n\n```c\n#include <stdio.h>\nint main()\n\
  {\n    printf(\"Hello World!\\n\");\n    return (0);\n}\n```\n\n\n在 Windows 上，我们执行以下命令：\n\
  \n```bash\n$ gcc -o hello.exe hello.c\n```\n\n如果你没有得到输出，只有一个命令提示符，说明命令执行成功了。否则，你会收到错误信息。\n\
  \n该命令告诉程序 `GCC` 去`编译`（compile）并`链接`（link）程序，并将输出放在 macOS 和 Linux 上的 `hello` 文件或\
  \ Windows 上的 `hello.exe` 中。我们现在可以使用以下命令在 macOS 或 Linux 上运行我们的程序：\n\n```bash\n$ ./hello\n\
  Hello World!\n```\n\n在 Windows 上，运行以下命令：\n\n```bash\n$ hello\nHello World!\n```\n\
  \n### 犯错\n\n让我们引入一个错误看看会发生什么。修改第二行使其看起来像这样：\n\n```c\nintxxx main()\n```\n\n\n接下来让我们删掉某些东西——具体是第四行的分号：\n\
  \n```c\nprintf(\"Hello World!\\n\")\n```\n\n这给了我们一个不同的错误信息：\n\n```bash\n$ gcc -o\
  \ hello hello.c\nhello.c: In function 'main':\nhello.c:5:5: error: expected ';'\
  \ before 'return'\n return (0);\n ^\n```\n\n你会注意到编译器在发布错误信息时指向了第 5 行。这是因为虽然我们在第\
  \ 4 行犯了错，但编译器直到查看第 5 行时才检测到它。\n\n有时，前几行的错误可能在某行或多行之后才被检测到，因此不要只看错误指定的某一行，也要看它的上方。\n\
  \n### 理解程序\n\n现在让我们逐行检查程序，看看它在做什么。看第一行：\n\n```c\n#include <stdio.h>\n```\n\n为了构建我们的程序，我们使用了随编译器一起的组件——即标准输入/输出（I/O）包。该包中的函数定义在\
  \ `/usr/include/stdio.h`文件中。（Windows 可能会使用稍不同的目录。）具体来说，我们在程序稍后使用了标准 I/O 函数 `printf`。\n\
  \n接下来，我们定义程序的起点：\n\n```c\nint main()\n```\n\n`main` 名称是特殊的，它表示程序的主体。所有程序都从 `main`\
  \ 开始。之后是一组封装在大括号中的陈语句：\n\n```c\n{\n...\n}\n```\n\n大括号表示 `main` 的主体。换句话说，它们用于分组随后的语句。我们将大括号内的语句缩进四个空格以便于可读性，但你可以使用任何缩进大小。事实上，C\
  \ 编译器并不关心我们使用多少空白。我们可以完全不缩进，但这会让程序难以阅读。\n这告诉程序使用标准 I/O 函数 `printf` 将字符串输出到标准输出位置（我们的终端）。`\\\
  n` 是该字符串中的一个特殊字符。反斜杠（`\\`）被称为`转义字符`。它告诉 C 后面的字符应被视为。在这种情况下，`n` 告诉 C 输出“换行”，这意味着下一个字符将在新行打印。一些更常见的转义字符见表\
  \ 1-1。\n\n| 转义字符 | 结果 |\n| --- | --- |\n| `\\n` | 换行（也称为行符*） |\n| `\\t` | 制表符 |\n\
  | `\\\"` | `\"` |\n| `\\\\` | `\\` |\n| `\\r` | 回车 |\n\n最后，程序以这条语句结束：这导致程序停止并退出，向操作系统返回退出代码\
  \ 0，表示程序正常终止。非零退出代码表示错误。\n\n### 添加注释\n\n到为止，我们完全专注于编写代码。换句话说，我们看到的所有内容都是设计供计算机读取和处理的。程序还可以包含`注释`，编译器不会看到它们；相反，它们是设计供查看程序的人阅读的。注释通常以\
  \ `/*` 开始，以 `*/` 结束。例如，以下是一个注释：\n\n```c\n/* Hello World – 一个空程序 */\n```\n\n它告诉你是编写此程序的程序员对程序的想法。让我们在程序的开头添加一些注释：\n\
  \n```c\n/*\n * Hello World -- 不是宇宙中最复杂的程序，\n *      但作为起点很有用。\n *\n * 用法:\n *  \
  \    1\\.运行程序。\n *      2\\.观察世界。\n */\n```\n\n另一种注释样式以 `//` 开始并持续行尾。当你看到更多程序时，你就能自己判断哪种更好用。\n\
  \n\n\n\n编写程序时，务必为代码添加注释，因为只有在那时你才清楚自己在做什么。五分钟后，你可能会忘记。五天后，你*会*忘记。例如，我曾需要进行一次复杂的位图转换，以便将一张光栅图像转换为喷墨打印喷头的发射指令。该变换涉及获取一张水平光栅图像，将行数据转换为喷头的列数据，然后由于喷头存在偏移，将数据左移以匹配喷头的位置。我写了一整页的注释来描述每一个影响发射顺序的因素。然后我又添加了半页的\
  \ ASCII 艺术图来绘制我刚才描述的内容。只有在完成这些工作并确保我理解了问题之后，我才编写了代码。因为我为了记录这些内容而必须整理思路，程序第一次运行就成功了。\n\
  \n在创建书中介绍编程题的答案时，要养成写注释的习惯。真正优秀的程序员都是注释编写的狂热者。\n\n在 macOS 或 Linux 上创建一个名为 `Makefile`\
  \ 的文件，内容如下：\n\n```\nCFLAGS=-ggdb -Wall -Wextra\n\nall: hello\n\nhello: hello.c\n\
  \       gcc $(CFLAGS) -o hello hello.c\n```\n\n在 Windows 上，makefile 应该包含以下内容：\n\n\
  ```\nCFLAGS=-ggdb -Wall -Wextra\n\nall: hello.exe\n\nhello.exe: hello.c\n      \
  \ gcc $(CFLAGS) -o hello.exe hello.c\n```\n\n缩进行必须以制表符（tab）开头。八个空格是不起作用的。（糟糕的文件设计，但我们别无选择。）第一行定义了一个宏。由于这个定义，每当我们在\
  \ makefile 中指定 `$(CFLAGS)` 时，`make` 程序就会将其替换为 `-ggdb -Wall -Wextra`。接下来，我们定义了目标\
  \ `all`，按照惯例，它是默认目标。当无带参数运行 `make` 时，它会尝试构建它看到的第一个目标。该目标的定义 `all: hello` 告诉 `make`\
  \ 程序：“当你尝试构建 `all` 时，你需要构建 `hello`。”makefile 的最后两行是 `hello`（或 Windows 上的 `hello.exe`）的规范。这些内容告诉\
  \ `make`，`hello` 是通过执行命令 `gcc $(CFLAGS) -o hello hello.c` 由 `hello.c` 生成的。该命令包含了我们定义的宏\
  \ `$(CFLAGS)`，它会展开为 `-ggdb -Wall -Wextra`。你会注意到我们在编译中添加了几个额外的标志。我们将在下一节中讨论它们。\n\n\
  现在让我们使用 `make` 命令来构建程序：\n\n```\n$ make\ngcc -ggdb -Wall -Wextra -o hello hello.c\n\
  ```\n\n如你所见，程序运行了构建可执行文件的命令。`make` 程序是非常智能的。它知道 `hello` 是由 `hello.c` 生成，因此会检查这两个文件的修改日期。如果\
  \ `hello` 更新，则不需要重新编译，所以如果你尝试构建两次程序，你会收到以下消息：\n\n```\nmake: Nothing to be done for\
  \ 'all'.\n```\n\n这并不总是正确的行为。如果我们更改了 makefile 中的标志，就意味着改变了编译过程，并应该重新构建程序。然而，`make`\
  \ 并不知道这个变化，除非我们编辑并保存 `hello.c` 文件或删除输出文件，否则它不会重新构建程序。\n\n2.  `-Wall` 开启一组警告，标记出正确但可疑的代码。（本书将教你不要编写可疑的代码。）\n\
  3.  `-Wextra` 开启额外的警告，努力使我们的代码更加精确。\n4.  `-o hello` 将程序的输出放在文件 `hello` 中。（Windows\
  \ 用户对应的此选项为 `-o hello.exe`。）\n\n## 编译器在背后的工作原理\n\n为了充分利用编译器，你需要了解在运行它时背后发生了什么。这是因为当你为嵌入式设备编写软件时，你通常需要绕过编译器自动执行的一些操作，这些操作由许多步骤组成：\n\
  \n1.  源代码通过`预处理器`，它处理所有以 `#` 开头的行。在我们的程序中，它处理 `#include` 行。\n2.  编译器本身将处理后的源代码转换为汇编语言。C\
  \ 代码据称是机器无关的，可以在多个平台上编译。汇编语言是依赖机器的，可以在特定类型上运行。\n3.  汇编语言文件通过`汇编器`转换为`对象文件`。对象文件包含我们的代码。\n\
  4.  `链接器` 获取对象文件中的代码并与计算机上已有的代码相结合。\n\n### gcc 命令\n\n你会注意到 `gcc` 命令同时充当编译器和链接器的角色。事实上，`gcc`\
  \ 被设计成一个类似于执行程序。它查看参数并决定为了完成工作需要运行哪些其他程序。这可能包括预处理器 (`cpp`)、C 编译器 (`cc1`)、汇编器 (`as`)、链接器\
  \ (`ld`) 或所需的其他程序。让我们详细介绍这些组件。\n\n### 预处理器\n\n第一个运行的程序是预处理器，它是一个`宏处理器`（一种自动文本编辑器），处理所有以\
  \ `#` 开头的行。在我们的程序中，它处理 `#include` 行。我们可以通过以下命令获取预处理器的输出：\n\n```\n$ gcc -E hello.c\
  \ >hello.i\n```\n\n该命令的输出存储在 *hello.i* 文件中。如果我们查看这个文件，会发现它超过了 850 行。这是因为 `#include\
  \ <stdio.h>` 行导致整个 *stdio.h* 文件被复制到我们的程序中，由于 *stdio.h* 文件又有自己的 `#include` 指令，被 *stdio.h*\
  \ 包含的文件也被复制进来了。\n\n\n\n\n\n我们需要 `stdio.h` 来使用 `printf` 函数，如果我们查看 `hello.i`，就能找到该函数的定义，它现在被包含在我们的程序中了：\n\
  \n```\nextern int printf (const char *__restrict __format, ...);\n\nextern int sprintf\
  \ (char *__restrict __s,\n      const char *__restrict __format, ...) __attribute__\
  \ ((__nothrow__));\n```\n\n预处理器还会移除所有注释，并用指示正在处理哪个文件的信息对文本进行标记。\n\n.LC0:\n     \
  \   .string \"Hello World!\"\n```\n\n注意，编译器将 C 字符串 `\"Hello World!\\n\"` 翻译成了汇编语言的\
  \ `.string` 命令。如果你眼睛敏锐，还会注意到 `\\n` 消失了。我们稍后会发现原因。\n\n## 汇编器\n\n汇编语言文件进入汇编器，在那里它被翻译成机器码。`gcc`\
  \ 命令有一个选项 (`-Wa`) 允许我们将标志传递给汇编器。除非你是一台机器，否则无法理解机器码，我们将使用以下命令请求一个以人类可读格式打印机器码的列表，并带有生成该代码的相应汇编语句：\n\
  \n```\n$ gcc -Wall -Wextra -g -Wextra -Wa,-a=hello.lst -c hello.c\n```\n\n`-Wa`\
  \ 选项告诉 GCC 后面的内容传递给汇编器。`-a=hello.lst` 选项告诉汇编器生成名为 `hello.lst` 的列表。让我们来看这个文件。它的开头如下：\n\
  \n```\n4                            .section        .rodata\n5                 \
  \   .LC0:\n6 0000 48656C6C              .string \"Hello World!\"\n6      6F20776F\n\
  6      726C6421\n6      00\n```\n\n汇编语言在每台机器上都不同。在这个文件中，你看到的是 x86 汇编语言。它看起来像是一团混乱，即使与其他汇编语言相比也是如此。你可能无法完全理解它，这没关系；这一章只需要让你对汇编语言的样子有个直观感受。在后面的章节中，当我们学到\
  \ ARM 处理器时，你会看到更理智、更容易理解的汇编语言。\n\n第一列是汇编语言文件的行号。第二列（如果存在）指示所存储数据的地址。所有的计算机内存单元都有一个数值地址。在这种情况下，字符串\
  \ `\"Hello World!\"` 存储在相对于当前使用区域的地址 0000 处（在这种情况下，标题为 `.rodata` 的区域）。当我们在下一节讨论链接器时，我们将看到这个相对地址是如何转换为绝对地址的。\n\
  \n下一列包含要以十六进制格式存储在内存中的数值。紧接着是汇编语言代码本身的文本。在文件中，我们可以看到 `.string` 指令告诉汇编器为文本字符串生成代码。\n\
  \n在文件的后部分，我们找到了 `main` 的代码：\n\n```\n15 0000 55                    pushq   %rbp\n\
  16                            .cfi_def_cfa_offset 16\n17                       \
  \     .cfi_offset 6, -16\n18 0001 4889E5                movq    %rsp, %rbp\n19 \
  \                           .cfi_def_cfa_register 6\n12:hello.c       ****     printf(\"\
  Hello World!\\n\");\n20                            .loc 1 12 0\n21 0004 BF000000\
  \              movl    $.LC0, %edi\n21      00\n22 0009 E8000000              call\
  \    puts\n22      00\n```\n\n在第 15 行，我们可以看到汇编指令 `55`，它将存储在该区域的 0 位置。该指令对应于 `pushq\
  \ %rbp`，它在过程开始时进行一些记录。还要注意某些机器指令长度为 1 字节，而另一些长达 5 字节。21 行的指令是一个 5 字节指令的示例。你可以这条指令正在对\
  \ `.LC0` 操作。如果我们查看列表的顶部，可以看到 `.LC0` 就是我们的字符串。\n\n作为一个 C 语言程序员，并不要求你完全理解汇编语言在做什么。完全理解需要吸收几千页的参考资料。但我们可以在某种程度上理解第\
  \ 22 行的指令，它调用了函数 `puts`。这就是事情变得有趣的地方。记住，我们的 C 程序并没有调用 `puts`——它调用的是 `printf`。\n\n\
  似乎我们的代码在后台被优化了。在嵌入式编程中，“优化”可能是一个贬义词，所以理解这里发生了什么非常重要。本质上，C 编译器查看了 `printf(\"Hello\
  \ World!\\n\");` 这一行并决定它与以下内容相同：\n\n```\nputs(\"Hello World!\");\n```\n\n事实是，这些函数实际上并不相同：`puts`\
  \ 是简单的，而 `printf` 是复杂的。但优化器决定将 `printf`  `puts`。\n\n$ gcc -Wall -Wextra -static\
  \ -Wl,-Map=hello.map -o hello hello.o\n```\n\n`-Wl` 告诉 GCC 将后面的选项 (`-Map=hello.map`)\
  \ 传递给链接器。map 文件告诉我们内容在哪里。我们还添加了 `-static` 指令，将可执行文件从动态链接改为静态链接。\n\n如 `hello.o` 等的对象文件是可重地的。也就是说，它们可以位于内存的任何位置。链接器决定具体的位置。链接器的工作是遍历程序使用的库，提取任何需要的对象文件并包含在最终程序中。链接器映射告诉我们内容在哪里以及哪些库组件包含在我们的程序中。例如，一个典型的链接条目可能如下：\n\
  \n```\n .text          0x000000000040fa90      0x1c8 /usr/lib/gcc/x86_64-linux-gnu/5/../../../x86_64-linux-gnu/libc.a(ioputs.o)\n\
  \                0x000000000040fa90                puts\n                0x000000000040fa90\
  \                _IO_puts\n *fill*         0x000000000040fc58        0x8\n```\n\n\
  记住我们并没有写过 `puts`，尽管它出现在这个链接条目中。正如提到的，它来自标准 C 库文件 (`libc.a`)。我们在这里可以看到该函数的代码位于 `0x000000000040fa90`。这些信息可能会有用，例如我们的程序在\
  \ `0x40fa90` 和 `0x40fc58` 之间发生崩溃。在这种情况下，我们就知道是 `puts` 导致了崩溃。\n\n\n\n\n我们也知道 `puts`\
  \ 占据了 `0x1c8` 字节（`40fc58–40fa90`）。这是十进制的 456 字节，或者略小于 0.5K。当我们开始为内存有限的微处理器编程时，内存占用将成为我们关注的问题。\n\
  \n现在，你应该对 C 程序的每个元素以及这些各个部分的作用有一个良好的理解了。大多数时候，你可以让编译器来处理这些细节，而不必担心底层发生了什么。但当你正在为资源有限的小芯片进行编程时，你确实需要担心内部发生了什么。\n\
  \n## 为你的 Makefile 添加内容\n\n通过修改你的 makefile 来生成上一节中描述的所有文件，你可以自己探索 GCC 编译器、汇编器和链接器的各个方面：\n\
  \n```\nCFLAGS=-Wall -Wextra -ggdb\n\nall: hello hello.i hello.s\n\nhello.o: hello.c\n\
  \        gcc $(CFLAGS) -Wa,-a=hello.lst -c hello.c\n\nhello: hello.o\n        gcc\
  \ $(CFLAGS) -static -Wl,-Map=hello.map -o hello hello.o\n\nhello.i: hello.c\n  \
  \      gcc -E hello.c >hello.i\n\nhello.s: hello.c\n        gcc -S hello.c\n\n##\
  \ 输入 \"make verbose\" 以查看整个命令行执行\nverbose:\n        gcc -v $(CFLAGS) -Wextra -c\
  \ hello.c\n\nclean:\n        rm -f hello hello.i hello.s hello.o\n```\n\n\n因此，如果你编辑了\
  \ `hello.c` 然后执行命令 `make hello.i`，你会看到 `make` 执行了它的工作：\n\n```bash\n$ (修改 hello.c)\n\
  $ make hello.i\ngcc -E hello.c > hello.i\n```\n\n我们 makefile 中的另一个目标 `clean` 会删除所有生成的文件。要删除生成的文件，请执行以下命令：\n\
  \n```bash\n$ make clean\n```\n\nGNU `make` 是一个非常复杂的程序，其手册超过 300 页。好消息是，你只需要处理它的极一小部分子命令就能高效工作。\n\
  \n# 2 集成开发环境简介\n\n![](img/chapterart.png)\n\n到目前为止，我们已经使用了诸如 GCC、`make` 和文本编辑器等单独工具来构建我们的程序。这让你能够看到每个工具的作用，并学习软件开发的细节。现在你将学习使用集成开发环境（IDE）。IDE\
  \ 是一种旨在将所有这些工具（以及其他一些工具）隐藏在一个集成界面背后的程序。\n\n这种方法的主要优势是你可以使用一个基于 GUI 的工具来完成一切。主要的缺点是，只有当你按照\
  \ IDE 预期的方式行为时它才有效。此外，它还向你隐藏了大量内容。例如，为了获取链接器映射（map），你必须经过几层 GUI 并在模糊的自定义框中输入 map\
  \ 选项。\n\n我们在书中将使用的 IDE 是用于 STM32 的 System Workbench。从它的名字可以看出它是为 STM32 微处理器创建的。它是对非常流行的\
  \ IDE —— Eclipse 的增强，包含一个编辑器、一个调试器和一个编译器。它在调试方面特别强大。\n\n\n会弹出一个窗口，指示系统正在为 ARM 处理器下载额外的工具。系统完成后，你应该应该得到一个空项目的\
  \ C/C++ 视图，如图 2-1 所示。\n\n![f02001](img/图)\n\n图 2-1：空项目屏幕\n\nEclipse 是许多工具的前端。以组织方式展示它们是一项巨大的挑战。为了应对这个问题，Eclipse\
  \ 使用了“视图”（views）的概念。*视图*是一种为特定任务设计的窗口布局。例如，Java 程序员的视图可能与 C 程序员的不同。同样，调试需要的视图与编码不同。\n\
  \n\n\n\n\n此版本 Eclipse 的默认视图是 C/C++ 项目视图。（你可以通过使用 `Window▶View` 菜单随时更改视图。）视图的左侧是\
  \ `Project Explorer`（项目资源管理器，目前为空），它允许你查看项目及其详细信息。中间上方是一个文本编辑器。右侧是一个带有三个标签页的窗口：`Outline`（大纲）、`Build\
  \ Targets`（构建目标）和 `Task List`（任务列表）。当我们处理更复杂的项目时，我们会详细介绍它们。\n\n底部是一个宽宽的小窗口，带有 `Problems`（问题）、`Tasks`（任务）、`Console`（控制台）、`Properties`（属性）和\
  \ `Call Graph`（调用图）标签页。`Problems` 窗口包含由当前项目代码生成的错误和警告列表。`Console` 窗口包含构建过程的输出。其他标签我们在开始生成更复杂的程序时再考虑。\n\
  \n## 创建 Hello World\n\n现在我们将再次创建另一个“Hello World”项目。每当你创建一个原生 C 项目时，都必须采取某些步骤（`native`\
  \ 意味着程序运行在编译它的机器上；如果你在一台机器上编译并在另一台机器上运行它，这被称为 `cross-compilation`），本章将详细介绍这些步骤。你将经常执行这些步骤；为了让你不需要记住所有它们，请参考附录中的清单。\n\
  \n从菜单栏选择 `File▶New▶C Project` 开始一个新项目。这会弹出 `C Project` 对话框。\n\n我为我们的项目选择了名称 `02.hello-ide`，因为它是唯一的且描述性强。项目名称可以包含任何字符，但空格和如正斜杠\
  \ (`/`）、反斜杠 (`\\`）、冒号 (`:`）以及对你的文件系统具有特殊意义的字符。字母、数字、连字符、点和下划线都是的。\n\n对于项目类型，选择 `Hello\
  \ World ANSI C Project`。对于工具链，选择适用于你操作系统的工具链，如图图 2-2 所示。点击 **Next**。\n\n![f02002](img/f02002.png)\n\
  \n图 2-2：项目创建对话框*\n\n现在看到了 `Basic Settings`（基本设置）对话框。保持这些设置不变并点击 **Next**。\n\n下一个对话框是\
  \ `Select Configurations`（选择配置）（参见图 2-3）。\n\n![f02003](img/f02003.png)\n\n图 2-3：选择配置对话框*\n\
  \n构建你的项目时有许多不同的选项。Eclipse 将这些分组为项目配置。默认定义的两个是 `Release`（发布）和 `Debug`（调试）。`Release`\
  \ 生成高度优化的代码，很难甚至甚至无法调试。`Debug` 生成未优化的、易于调试的代码并生成调试符号。由于你正在学习，我们将坚持使用 `Debug` 配置。取消勾选\
  \ `Release` 配置，只保留 `Debug` 选中，并点击 **Finish**。\n\nIDE 创建了我们的项目并生成了许多文件。其中之一是我们的源代码，已经填充了该版本的“Hello\
  \ World”程序（参见图 2-4）。\n\n![f02004](img/f02004.png)\n\n图 2-4：创建我们的“Hello World”项目的结果*\n\
  \n![f02005](img/f02005.png)\n\n图 2-5：运行配置对话框*\n\n![f02006](img/f02006.png)\n\n图\
  \ 2-6：应用程序选择对话框*\n\n接下来，点击 **Apply** 并 **Close** 完成运行配置。此设置告诉 IDE 你的程序实际所在的位置。（由于它决定了程序在哪里。）\n\
  \n选择 `Run`。结果将出现在 `Console` 中，如图图 2-7 所示。\n\n![f02007](img/f02007.png)\n每次编辑后选择\
  \ `Save All` 是重要的。如果我们现在运行程序，编译器将看到未保存的文件并对其编译。现在通过 `Run▶Debug` 调试器（参见图 2-8）。\n\n\
  ![f02008](img/f02008.png)\n\n图 2-8：启动调试器*\n\nIDE 即将切换到调试模式，这将视角从开发变为调试。这意味着一个新的窗口布局。系统警告你这即将发生，如图图\
  \ 2-9 所示。（记住你可以通过 `Window▶Perspective▶C/C++` 或 `Window▶Perspective▶Debug` 切换视角。）\n\
  \n![f02009](img/f02009.png)\n\n图 2-9：调试视角*\n\n在警告中点击 **Yes**。调试视角将打开，如图图 2-10 所示。\n\
  \n![f02010](img/f02010.png)\n\n图 2-10：调试视角*\n\n屏幕左上角是 `Stack Trace` 窗口，它显示程序的执行情况以及你执行到了什么程度。这些信息在我们第\
  \ 7 章讨论栈的使用时将非常有用。\n\n旁边是 `Variables/Breakpoints/Registers/I/O Registers/Modules`\
  \ 窗口，它包含：\n\n1.  **Variables**：程序变量的信息。（从第 4 章开始介绍。）\n\n2.  **Breakpoints**：*断点*是程序中停止并允许调试器检查的位置。你可以通过双击程序中执行行的行号来设置断点。我们第\
  \ 3 章开始使用它们。\n\n3.  **Registers**：处理器寄存器的当前状态。（第 10 章讨论。）\n\n4.  **Modules**：动态链接模块。由于此功能对嵌入式系统程序员不可用，我们不会讨论它。\n\
  \n屏幕中间的 `Source` 窗口显示我们的程序。高亮的代码行表示调试器已运行到该行并停止。\n\n\n\n\n源代码（Source）窗口旁边是大纲（Outline）面板。这就像一个目录，指示了哪些文件包含在我们的程序中。我包含了\
  \ `stdio.h` 和 `stdlib.h` 文件，这样它们就会显示在这里。\n\n底部是控制台（Console)/任务（Tasks)/问题（Problems)/可执行文件（Executables)/内存（Memory）窗口。控制台窗口显示程序的输出。所有其他标签都包含我们不感兴趣的信息。\n\
  \n现在我们将`step through`（逐步执行）程序，这意味着我们将使用调试器一次执行一条语句。点击屏幕顶部的单步执行（Step Over）图标（参见图\
  \ 2-11）或按 `F6` 跳过当前行。\n\n![f02011](img/f02011.png)\n\n图 2-11: 单步执行 (F6)\n\n图 2-13:\
  \ 调试命令\n\n在接下来的章节中，我们将大量使用调试器。它将提供一种非常有用的方法从我们的运行程序中获取信息并查看发生了什么。要返回原始的 C/C++ ，选择**Window（窗口）**▶\
  \ **Perspective（视角）**▶**Open Perspective（打开视角）**▶**C++**。\n\n## IDE 为我们做了什么\n\n\
  IDE 生成了 C 源文件，包括用于打印“Hello World”的 `puts` 函数。它还生成了一个名为 `Debug/makefile` 的文件，用作 `make`\
  \ 程序的输入。列表 2-1 包含了该文件的节录。\n\n```\n###########################################################################\n\
  ## 自动生成的文件。请编辑！\n###########################################################################\n\
  \n-include ../makefile.init\n\nRM := rm -rf\n\n## 所有参与构建的源码都定义在此处\n-include 1 sources.mk\n\
  -include src/subdir.mk\n-include subdir.mk\n-include 2 objects.mk\n\nifneq ($(MAKECMDGOALS),clean)\n\
  ifneq ($(strip $(C_DEPS)),)\n-include $(C_DEPS)\nendif\nendif\n\n-include ../makefile.defs\n\
  \n## 将这些工具调用的输入和输出添加到构建变量中\n\n## 所有目标 (All Target)\nall: 02.hello-ide\n目前，IDE 不生成或下载大量数据。但当我们开始进行嵌入式编程时，这种情况将发生巨大变化。\n\
  \n## 导入书中的编程示例\n\n书里使用的编程示例可以在 [`nostarch.com/bare-metal-c.`](https://nostarch.com/bare-metal-c.)\
  \ 下载。要使用下载的编程示例，你需要导入它们。（你不能直接把文件丢进工作区；那样就太简单了。）要执行导入，请使用以下步骤：\n\n1. 选择 **File（文件）**▶**Import（导入）**。\n\
  2. 在导入 对话框中，选择 **General（通用）**▶**Existing Projects into Workspace（将现有项目导入工作区）**。\n\
  3. 点击 **Next（下一步）**。\n4. 选择 **Select Archive File（选择存档文件）** 单选按钮，然后点击空白处的 **Browse（浏览）**\
  \ 以选择包含项目的文件（你从网站下载的）。\n5. 点击 **Finish（完成）**。\n\n## 总结\n\nIDE 是一把双刃剑。一方面，你不需要担心创建程序所需的所有工具。你不需要手动创建\
  \ makefile、手动执行构建或运行调试器。\n\n但这种“甩手掌”的方法是有代价的。要为第 1 节中的程序添加一个编译时标志，你只需要将该标志添加到 makefile\
  \ 中。而在 IDE 中，你无法直接这样做，因为 IDE 会自发生成 makefile。你必须在 IDE 中找到正确的配置项来完成，而且正如我们将会发现的那样，IDE\
  \ 有很多选项。\n\n在本书中，我尽量保持事情尽可能简单。\n\n## 编程题\n\n1. 找出在字符串中放入 `\\t` 时会发生什么。\n2. 在第 1\
  \ 节中，我们使用 `printf` 进行打印。\n\n### 问题\n\n1. 什么是 IDE？\n2. IDE 生成了哪些文件？它们包含什么？\n3. 在哪里可以获得\
  \ C 的帮助？\n\n# 3  微控制器编程\n\n![](img/chapterart.png)\n\n已经在 IDE 中编写并运行了“Hello World”程序，现在我们在\
  \ STM32 NUCLEO-F308 上这样做。在嵌入式系统中，“Hello World”的对应是一个让 LED 闪烁的程序。通过让 LED 闪烁，你将学习到所需的步骤。\n\
  \n过程中，我们将使用上一节探索过的 System Workbench for STM32 创建嵌入式程序。为了帮助我们，我们将使用 ST 名为硬件抽象层（HAL）的软件，它隐藏了一些硬件细节。（然而，这些细节隐藏得并不深，你可以查看源代码了解做了什么。）我们还将详细解释\
  \ IDE 正在使用的选项。\n\n最后，正如我们在第 2 节中所做的，我们将使用调试器查看程序一次执行一条，这在我们开始编写更大的程序时将证明非常有用。\n\n\
  ## NUCLEO-F0308 开发板\n\n*开发板*（Development boards）是包含处理器芯片以及开发该处理器应用程序所需的其他组件的电路板，包括许多用于开发程序和电路的有用物品。除了编程和调试支持外，开发板还包含许多*连接器*（connectors），允许你连接原型硬件。它还包含了一些*外设*（peripherals），例如串口、按键开关和\
  \ LED，尽管某些更高级的板会有额外的外设。\n\n因此，开发板为你使用面包板硬件开发初始软件提供了一个即时原型。微处理器制造商通常销售包含所有内容的开发板，以吸引人们使用他们的芯片。\n\
  \nSTM32 NUCLEO-F0308 板将 STM32F038 与时钟电路、电源以及一些通信设备组合在一起，包括 LED、按钮和串口 I/O 设备。图 3-1\
  \ 显示了我们处理器板的基本构建构建模块。\n\n\n\n电源和时钟驱动 CPU，复位按钮重启 CPU，用户 LED 指示灯和按键用于用户交互，而串口和连接器则用于编程和调试。\n\
  ## 设置开发板\n\n`Nucleo` 板的下半部分包含芯片和支持电路，有许多引脚引出到板侧的连接器上（用于连接外设）。上方是支持板，其中包含编程器、调试器、串口转\
  \ USB 设备和 USB 存储设备。\n\n图 3-2 显示了该板是如何组装的。\n\n![f03002](img/f03002.png)\n\n图 3-2：NUCLEO-F030R8\
  \ 板\n\n板上还包含几个跳线帽和 LED。`Jumpers` 是将两个引脚短接的小塑料装置。它们用于选择硬件选项，例如启用板载调试器（`ST-LINK`），并应按照图\
  \ 3-3 所示所示安装。按照以下步骤操作：\n\n1. 使用两个跳线帽（`CN2`）安装 `ST-LINK`。这样做是将板载调试器（`ST-LINK`）配置为调试板载微控制器。如果你移除这两个跳线帽，可以使用\
  \ `ST-LINK` 调试器调试其他板。\n\n2. 不要安装电源跳线帽（`JP1`）。此配置允许 `Nucleo` 板通过 USB 端口抽取高达 300mA\
  \ 的电流，让你可以使用 USB 端口为设备供电。如果你在板上连接了许多耗电外设，可以使用 `JP1` 启用外部电源。本书没有使用任何外部硬件，因此请留空 `JP1`。\n\
  \n3. 不要安装 `RX-TX`，这是一个将 `serial port` 输入输出短接的调试选项。稍后我们将 `serial port` 作为真正的串口使用，因此不要插此跳线。\n\
  \n4. 将 `JP5` 跳线帽安装到右侧位置（`U5V`）。这样做可确保板将通过 USB 端口供电，而不是通过外部电源。\n\n5. 接通电流测量跳线（`JP6`）。这是一个低功耗设备。`JP6`\
  \ 短接的两个引脚为芯片供电。移除跳线帽并连接电流表以测量功耗。\n\n`CN11` 和 `CN12` 是不使用时存放跳线帽的地方。在这些地方安装跳线不会影响电路。\n\
  \n![f03003](img/f03003.png)\n\n图 3-3：跳线帽和 LED 位置\n\n现在使用小型 USB 线将设备插入到计算机。`LD1`\
  \ 应该变红，表示编程器已供电。`LD2` 应该闪烁，因为板上预装了一个闪烁 `LD2` 的程序。（前提是你买的是新板。如果像我一样是从走廊头的朋友那里得到的第一个板，它将包含你朋友上一次实验的内容。）`LD3`\
  \ 也应该变红，表示芯片已供电。\n\n\n\n\n\n你可能想用你的名字和信息更新此注释。以 `@` 开头的关键字旨在用于 `Doxygen`，这是一个功能强大且完备的系统，可以从大型程序中提取文档。我们的小的小型程序中不会使用这个工具，所以你可以按你喜欢的方式编辑注释。\n\
  \n`main` 函数没有 `return` 语句，因为 `return` 语句会将控制权从程序返回给操作系统，但裸机系统（bare metal system）没有操作系统。操作系统的工作之一就是启动和停止程序（以及其他工作）。由于我们没有操作系统，每当我们的程序停止，处理器就会停止并且什么都不做。所以我们不停止。永不停止。要看我们是如何实现这一点的，请注意第\
  \ 19 行的 `for(;;);`。这是 C 代码，表示“无限循环”（`for(;;)`）和“什么都不做”（结尾的分号）。\n\n但是如果没有操作系统，我们如何启动呢？当处理器开启或重位时，我们的程序就会启动（因此开发板上需要一个大大的黑色的重位按钮）。\n\
  \n目前，我们的程序什么都不做，而且执行这个动作需要永远的时间。让我们加入一些代码来做点事情。\n\n### 初始化硬件\n\n首先，我们需要初始化硬件。为了做到这一点，我们将首次使用\
  \ HAL 库。HAL 软件层旨在隐藏让芯片工作所需涉及的所有糟糕细节。例如，在使用片上时钟为 LED 闪烁计时之前，我们必须先初始化片上时钟。手动完成这一操作需要对特定的\
  \ `I/O registers` 进行程序设计，这些寄存器直接控制 I/O 设备的行为。它们是硬件的一部分。\n\n尽管我们可以查阅芯片的 700 页参考手册来确定要编写哪些寄存器，然后进行所有计算以确定要为它们设置什么值，这将耗费大量工作。\n\
  \n相反，我们可以使用 HAL 软件，特别是 `HAL_Init` 函数来为我们完成所有这些工作。`HAL_Init` 函数配置系统时钟，以便我们以后可以使用它为我们的\
  \ LED 定时。在 `main` 函数的第一个大括号之后插入一个对 `HAL_Init` 的调用，如下所示：\n\n```\nint main(void)\n\
  {\n    HAL_Init();\n```\n\n通常情况下，每使用一组大括号缩进四个空格是最佳实践。C 语言并不要求这样做，但这会让程序更容易理解。（四个空格并没有什么神奇之处。有些程序使用两个，有些使用八个，少数奇怪的人使用三个。）\n\
  \n这就解决了基础硬件。\n\n### 编写 GPIO 引脚\n\n芯片有许多`通用输入输出引脚`，称为 `GPIO pins`，我们可以对其进行编程，以用于各种目的接收输入或发送输出。例如，我们可以将一个引脚配置为输出并将其连接到\
  \ LED（这正是我们在程序中将做的）。或者，我们可以将一个引脚配置为输入并将其连接到开关（我们将在下一章中这样做）。\n\n微控制器的一些引脚可以作为模拟输入或输出。大多数\
  \ GPIO 引脚可以开启或关闭。模拟引脚可以处理开启和关闭之间的电压，例如 32765/65536。其他引脚可以连接到 `USART`（串口 I/O 控制器）或\
  \ `I2C bus`（简单 I/O 总线），与 I2C 外设芯片通信。好消息是这些引脚可以做很多事情。坏消息是，我们需要编写程序来告诉它：“不要做那些花哨的事情。只需要在我让你开启时你开启，在我让你关闭时你关闭。”\n\
  \n我们将编写连接到用户 LED (LED2) 的 GPIO 引脚。我们需要告诉芯片我们正在使用此引脚作为输出；然后必须告诉它许多关于我们将如何使用它的信息。这包括设置\
  \ GPIO 时钟，它控制响应速度。HAL 固件可以完成这大部分工作，但我们必须通过向 `HAL_GPIO_Init` 函数传递配置信息结构体来告诉 HAL 要做什么（C\
  \ 语言的结构概念在第 7 章中有更详细的介绍）：\n\n```\n// LED clock 初始化\nLED2_GPIO_CLK_ENABLE();\n\n\
  // 初始化 LED\nGPIO_InitTypeDef GPIO_InitStruct;\nGPIO_InitStruct.Pin = LED2_PIN;\n\
  GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\nGPIO_InitStruct.Pull = GPIO_PULLUP;\n\
  GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_HIGH;\n\n现在删除最后一个分号。分号表示“什么都不做”。为了让 `for`\
  \ 循环执行，添加以下代码：\n\n```\nfor(;;) {\n    // 翻转 LED\n    HAL_GPIO_TogglePin(LED2_GPIO_PORT,\
  \ LED2_PIN);\n    HAL_Delay(400);\n```\n\n我们将编写连接到用户 LED (LED2) 的 GPIO 引脚。我们需要告诉芯片我们正在使用此引脚作为输出；然后必须告诉它许多关于我们将如何使用它的信息。这包括设置\
  \ GPIO 时钟，它控制响应速度。HAL 固件可以完成这大部分工作，但我们必须通过向 `HAL_GPIO_Init` 函数传递配置信息结构体来告诉 HAL 要做什么（C\
  \ 语言的结构概念在第 7 章中有更详细的介绍）：\n\n```\n// LED clock 初始化\nLED2_GPIO_CLK_ENABLE();\n\n\
  // 初始化 LED\nGPIO_InitTypeDef GPIO_InitStruct;\nGPIO_InitStruct.Pin = LED2_PIN;\n\
  GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\nGPIO_InitStruct.Pull = GPIO_PULLUP;\n\
  GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_HIGH;\nHAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_InitStruct);\n\
  ```\n\n我们将引脚开启以便向 `LED2_PIN` 发送数据，它是连接到用户 LED 的那个。接下来，我们指定该引脚将用于输出，因为我们正在向 LED 发送数据而不是检索数据，并将模式设置为推挽。这种模式由你连接到输出引脚的内容决定。在这种情况下，我们的电路需要推挽。此选项控制用于驱动\
  \ GPIO 引脚的内部硬件。STM 芯片手册显示了该电路是如何组织的（或者，向你的硬件人员展示芯片是如何组织的，他们可以告诉你使用哪种模式）。\n\n上拉标志（pullup\
  \ flags）配置 GPIO 引脚，使得在输入模式下，上拉电阻是电路的一部分。这对于输出引脚无关。\n\n`HAL_GPIO_TogglePin` 函数翻转\
  \ GPIO 引脚。在我们的芯片上，引脚被组织成组，统称为 GPIO 寄存器。我们的端口是 `LED2_GPIO_PORT`。为了告诉函数要翻转哪些 32 引脚，我们指定\
  \ `LED2_PIN`。\n\n在我们翻转引脚后，我们需要等待一段时间；否则 LED 闪烁太快我们看不见。我们使用 `HAL_Delay` 函数延迟 400。\n\
  \n *\n * 一个简单的程序，但让它工作\n * 需要学习很多工具。\n */\n\n#include \"stm32fxx.h\"\n#include \"\
  stm32f0_nucleo.h\"\n\nint main(void)\n{\n    HAL_Init();\n    // LED clock 初始化\n\
  \    LED2_GPIO_CLK_ENABLE();\n\n    // 初始化 LED\n    GPIO_InitTypeDef GPIO_InitStruct;\n\
  \    GPIO_InitStruct.Pin = LED2_PIN;\n    GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\n\
  \    GPIO_InitStruct.Pull = GPIO_NOPULL;\n    GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_HIGH;\n\
  \    HAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_InitStruct);\n\n    for(;;) {\n       \
  \ // 翻转 LED\n        HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN);\n        HAL_Delay(400);\n\
  \    }\n}\n```\n\n现在通过选择 **Project**▶**Build Project** 构建项目。如果一切顺利，你在 Problems 窗口中看不到任何问题。如果有问题，修复它们并重试。\n\
  \n在 Console 窗口中，你会看到 IDE 调用了 `make`，然后 `make` 调用了名为 `arm-none-eabi-gcc` 的 GCC 编译器。这是我们嵌入式芯片的编译器。\n\
  \n通过选择 **Run**▶**Run** 启动程序。（确保点击主菜单上的 Run。也可以右键项目，但运行稍不同的命令。） Run 命令隐藏了大量工作。首先，IDE\
  \ 检查项目是否需要构建。然后它运行一个程序，该程序获取程序文件并与开发板上的闪存编程器通信，将程序烧录到内存中。最后，编程器告诉芯片重位并启动我们的程序。\n\
  \n结果，你应该看到绿色 LED 缓慢地闪烁。\n\n\n\n\n图 3-9 所示控制台窗口包含了构建过程的输出。（如果此窗口是空的，你可以通过 `Project`▶`Clean`\
  \ 之后执行 `Project`▶`Build Project` 来重新创建内容。）\n\n![f03009](img/f03009.png)\n\n-I\"\
  /home/sdo/bare/workspace/blink/HALDriver/Inc/Legacy\" \\\n-I\"/home/sdo/bare/workspace/blink/Utilities/STM32F0xx-Nucleo\"\
  \ \\\n-I\"/home/sdo/bare/workspace/blink/inc\" \\\n-I\"/home/sdo/bare/workspace/blink/CMSIS/device\"\
  \ \\\n-I\"/home/sdo/bare/workspace/blink/CMSIS/core\" \\\n-I\"/home/sdo/bare/workspace/blink/HALDriver/Inc\"\
  \ \\\n-O0 -g3 -Wall -fmessage-length=0 -ffunction-sections \\\n-c -MMD -MP -MF\"\
  HALDriver/Src/stm32f0xxlltim.d\" \\\n-MT\"HALDriver/Src/stm32f0xxlltim.o\" \\\n\
  -o \"HALDriver/Src/stm32f0xxlltim.o\" \"../HALDriver/Src/stm32f0xxll_tim.c\"\n```\n\
  \n这是控制台窗口中的一行，为了格式化进行了拆分。如你看到，编译器被赋予许多额外的选项。以下是该命令行中的关键项：\n\n1. `arm-none-eabi-gcc`\
  \ 这是一个 GCC 编译器，但与为你的计算机编译的本地 GCC 不同，它是一个交叉编译器，用于为 ARM 处理器生成代码。它没有底层操作系统（因此使用了 `none`\
  \ 选项），该系统为嵌入式应用二进制接口 (`eabi`) 设计，该接口定义了程序部分之间以及与外部通信的方式。\n\n2. `-mcpu=cortex-m0`\
  \ 为 `cortex-m0` 版本的 CPU 生成代码。ARM 有多种处理器变体，此标志告诉 GCC 使用哪个版本。\n\n3. `-mthumb` 某些 ARM\
  \ 可以执行两种不同的指令集。一种是完整的 32 位 RISC 指令集，执行速度快但占用大量内存；另一种是 `thumb` 指令集，较慢但紧凑得多。此指令告诉\
  \ GCC 我们想要 thumb 代码（如果你正在使用内存有限的廉价芯片，这是一个好主意，而我们恰恰如此）。\n\n4. `-mfloat-abi=soft`\
  \ 我们的处理器没有浮点硬件，因此此标志告诉 GCC 使用软件模拟它。（关于浮点的更多信息可以参考第 16 章。）\n\n5. `-O0` 指定优化级别为 `0`（即无优化）。这会关闭编译器的的一项功能，即编译器分析你的代码并执行各种技巧以使其运行得更快。这些技巧会让底层代码更难理解和调试。\n\
  \n6. `-g3` 开启调试。\n\n7. `-Wall` 开启名为 `all` 的警告集，它包含了几乎所有有用的警告。\n\n8. `-c` 将单个源文件编译为单个对象文件。\n\
  \n9. `-o\"HALDriver/Src/stm32f0xxlltim.o\"` 将对象文件存储在指定文件中。\n\n10. `\"../HALDriver/Src/stm32f0xxll_tim.c\"\
  ` 指定源代码。\n\n其他选项告诉编译器库文件在哪里以及如何配置这些文件。（我们在第 12 章中讨论 `-D` 指令）。`-I` 指令告诉编译器在标准包含目录之外的指定目录搜索包含文件。\n\
  \n除了编译命令，我们还可以看到链接命令：\n\n```\n\n构建过程以以下两个命令结束：\n\n```\narm-none-eabi-objcopy -O\
  \ binary \"blink.elf\" \"blink.bin\"\narm-none-eabi-size \"blink.elf\"\n   text\
  \       data\t    bss\t    dec\t    hex\tfilename\n   2620       108\t    2728\t\
  \n```\n\n`arm-none-eabi-objcopy` 命令将 `.elf` 文件转换为二进制镜像。`arm-none-eabi-size` 输出生成的\
  \ `.elf` 的大小。\n\n### 表 3-1：程序段大小\n\n| Segment | data | bss | dec | hex | filename\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| text | 2620 | 108 | 2728 | 108c\
  \ | blink.elf |\n\n\n\n\n我们的闪烁程序（blink program）简单且有效，但之后我们将编写更复杂的程序，而这些程序将会包含错误。由于我们正在编程的开发板拥有如此出色的调试器，我们不妨开始学习如何使用它。通过选择\
  \ `Run`▶`Debug` 启动调试器，如图 3-10 所示。\n\n![f03010](img/f03010.png)\n\n图 3-10: 启动调试器\n\
  \nIDE 随后会询问你想运行什么种类型的调试器，如图 3-11 所示。选择 `Ac6 STM32 C/C++ Application`。\n\n![f03011](img/f03011.png)\n\
  \n图 3-11: 选择调试器\n\n系统会询问你是否要“切换到调试视图（Switch to the Debug Perspective）”。回答 `Yes`。系统随后会自动执行若干步骤：\n\
  \n1. 它构建软件。\n2. IDE 使用 Flash 编程器将程序下载到芯片。\n3. 调试器通过 JTAG 接口连接到设备。\n4. 调试器在 `main`\
  \ 函数的第一行设置一个断点。\n5. 断点告诉芯片在执行 `main` 第一行代码之前停止。\n6. 微处理器重位，程序运行到 `main` 处。\n7. 当程序到达\
  \ `main` 处的断点时，调试器重新获得控制权。\n\n一旦调试器到达断点，你就可以对程序进行调试了，如图 3-12 所示。此时，程序已执行到 `main`\
  \ 函数的第一条语句，并在调用 `HAL_Init` 之前停顿。\n\n![f03012](img/f03012.png)\n\n图 3-12: 调试程序\n\n\
  现在我们已经获得了控制权，让我们用起来它吧。使用命令 `Run`▶`Step Over` 开始逐行执行程序。我们会执行多次，所以请记住快捷键 `F6`。继续使用\
  \ `F6` 逐行跳过，直到进入 `for` 循环。\n\n注意，每次你执行 `HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN)`\
  \ 函数时，LED 都会开启或关闭。由于你处于 `for` 循环中，你会在切换状态和延迟之间无限往复。如果你足够敏锐，你会发现执行 `HAL_Delay` 调用需要略多于\
  \ 400 毫秒（秒的五之二）。如果你想为了地观察延迟，可以将此值改为一个非常大的数。\n\n嗯，我们调用了 `HAL_Init` 过程。该过程定义在 `stm32f0xx_hal.c`\
  \ 中，所以当我们步入 `HAL_Init` 调用时，调试器自动打开了该文件。相反，`Step Over`（跳过）命令会将该语句（在此例中为 `HAL_INIT();`）视为单个单元并跳过该函数，隐藏所有细节。\n\
