  \ + 2)\n```\n\n风格规则是在参数化宏的参数周围包含括号。如果没有括号，`DOUBLE(1+2)` 展开为如下：\n\n```c\nDOUBLE(1+2)\
  \ = (2 * 1 + 2)\n```\n\n正如你所看到的，`12 * 12` 与 `10 + 2 * 10 + 2` 是不同的数字。\n\n在使用 `#define`\
  \ 来定义比简单数字更复杂的常量时，我们会在整个表达式周围加上括号，如下所示：\n\n```c\n#define SIDE (10 + 2)   // Size\
  \ + margin\n```\n\n遵循这种风格规则可以防止在替换后由于意外的运算顺序导致错误的结果。\n\n为了完全避免宏评估不正确的问题（当 `#define`\
  \ 的目的是在一个处设置或计算一个值并在整个程序中使用它），请使用 `const`，在尽可能的情况下，它优于 `#define`。这里有一个例子：\n\n```c\n\
  const unsigned int SIDE = 10 + 2;       // 这是有效的。\n```\n\n这条规则的主要原因是 `const` 修饰符是\
  \ C 语言的一部分，编译器会求值赋值给 `const` 变量的表达式，因此 `SIDE` 实际上是 `12`。\n\n在 C 语言设计之初并没有 `const`\
  \ 修饰符，所以每个人都使用 `#define` 语句，这就是为什么 `#define` 被如此广泛的使用，尽管更现代的 `const` 已经可用一段时间了。\n\
  \n### 参数化宏\n\n`Parameterized macros`（参数化宏）允许我们为宏提供参数。这里有一个示例：\n\n```c\n#define DOUBLE(x)\
  \ (2 * (x))\n--snip--\n    printf(\"Twice %d is %d\\n\", 32, DOUBLE(32);\n```\n\n\
  在这种情况下，我们不需要在展开时为参数加上括号。我们可以这样写宏：\n\n```c\n#define DOUBLE_BAD(x) (2 * x)\n```\n\n\
  为什么这是坏的呢？考虑一下当我们在表达式中使用此宏时会发生什么：\n\n```c\nvalue = DOUBLE_BAD(1 + 2)\n```\n\n风格规则是在参数化宏的参数周围包含括号。如果没有括号，`DOUBLE(1+2)`\
  \ 展开为如下：\n\n```c\nDOUBLE(1+2) = (2 * 1 + 2)\n```\n\n正如你所看到的，`12 * 12` 与 `10 + 2\
  \ * 10 + 2` 是不同的数字。\n\n在使用 `#define` 来定义比简单数字更复杂的常量时，我们会在整个表达式周围加上括号，如下所示：\n\n```c\n\
  #define SIDE (10 + 2)   // Size + margin\n```\n\n遵循这种风格规则可以防止在替换后由于意外的运算顺序导致错误的结果。\n\
  \n为了完全避免宏评估不正确的问题（当 `#define` 的目的是在一个处设置或计算一个值并在整个程序中使用它），请使用 `const`，在尽可能的情况下，它优于\
  \ `#define`。这里有一个例子：\n\n```c\nconst unsigned int SIDE = 10 + 2;       // 这是有效的。\n\
  ```\n\n这条规则的主要原因是 `const` 修饰符是 C 语言的一部分，编译器会求值赋值给 `const` 变量的表达式，因此 `SIDE` 实际上是\
  \ `12`。\n\n在 C 语言设计之初并没有 `const` 修饰符，所以每个人都使用 `#define` 语句，这就是为什么 `#define` 被如此广泛的使用，尽管更现代的\
  \ `const` 已经可用一段时间了。\n\n### 代码宏\n\n到为止，我们一直在编写宏来定义常量和简单表达式。我们可以使用 `#define` 来定义代码。这里有一个示例：\n\
  \n```c\n#define FOR_EACH_VALUE for (unsigned int i = 0; i < VALUE; ++i)\n```\n\n\
  这种代码存在一些问题。首先，不清楚 `i` 来自哪里。常见的宏是模拟短函数。让我们定义一个输出消息并杀死程序的 `DIE`：\n\n```c\n// Defined\
  \ badly\n#define DIE(why)              \\\n    printf(\"Die: %s\\n\", why); \\\n\
  \    exit(99);\n```\n\n我们使用反斜杠（`\\`）将宏跨行。我们可以这样使用这个宏：\n\n```c\nvoid functionImplemented(void)\
  \ {\n    DIE(\"Function has not written yet\");\n}\n```\n\n在这种情况下，它是有效的，这更多是因为运气而不是设计。问题是\
  \ `DIE` 看起来像一个函数，所以我们可以将其视为函数。让我们把它放在 `if` 语句中：\n\n```c\n// Problem code\nif (index\
  \ < 0)\n    DIE(\"Illegal index\");\n```\n\n为了理解为什么这是一个问题，让我们看看这段代码的展开：\n\n```c\n\
  if (index < 0)\n   printf(\"Die %s\\n\", \"Illegal index\");\n   exit(99); \n```\n\
  \n这里是正确缩进的：\n\n```c\nif (index < 0)\n    printf(\"Die %s\\n\", \"Illegal index\"\
  );\nexit(99); \n```\n\n换句话说，它总是退出，即使索引是好的。让我们看看是否通过在我们的语句周围加上大括号（`{}`）解决这个问题：\n\n\
  ```c\n// Defined not as badly\n#define DIE(why) {            \\\n    printf(\"Die:\
  \ %s\\n\", why); \\\n    exit(99);                 \\\n}\n```\n\n这现在在以下情况下是有效的：\n\
  \n```c\n// Problem code\nif (index < 0)\n    DIE(\"Illegal index\");\n```\n\n然而，它在以下情况下不起作用：\n\
  \n```c\nif (index < 0)\n    DIE(\"Illegal index\");\nelse\n    printf(\"Did not\
  \ die\\n\");\n```\n\n这段代码产生错误信息：`else without previous if`。然而，我们那里确实有一个 `if`。让我们看看展开：\n\
  \n\n\n\n```c\nif (index < 0)\n{\n    printf(\"Die: %s\\n\", why); \\\n    exit(99);\
  \                 \\\n}; // <=== 注意这里有两个字符。\nelse\n    print(\"Did not die\\n\"\
  );\n```\n\n这里的问题在于，在 `else` 之前，`C` 语言想要一个以分号（`;`）结尾的语句*或者*一组包含在花括号（`{}`）中的语句。它不知道如何处理一个以分号结尾的包含在大括号中的语句。\n\
  \n解决这个问题的方法是使用一种称为 `do`/`while` 的冷门 C 语句。它看起来如下：\n\n```c\ndo {\n   //  Statements\n\
  }\nwhile (condition);\n```\n\n`do` 之后块中的语句始终执行一次，然后只要 `condition` 为真，就会再次执行。尽管它是\
  \ `C` 语言标准的一部分，但在现实世界中只见过它被使用两次，其中一次还是作为一个笑话的梗出现的。\n\n然而，它被用于代码宏：\n\n```c\n#define\
  \ DIE(why)\ndo {            \\\n    printf(\"Die: %s\\n\", why); \\\n    exit(99);\
  \                 \\\n} while (0)\n```\n\n它之所以有效，是因为我们可以在后面加一个分号：\n\n```c\nif (index\
  \ < 0)\n    DIE(\"Illegal index\");   // 注意语句末尾的分号。\nelse\n    printf(\"Did not\
  \ die\\n\");\n```\n\n这段代码展开后如下：\n\n```c\nif (index < 0)\n    do {\n        printf(\"\
  Die: %s\\n\", \"Illegal index\");\n        exit(99);\n    } while (0);\nelse\n \
  \   printf(\"Did not die\\n\");\n```\n\n在语法上，`do`/`while` 是一个单一语句，我们可以毫无问题地在其后面包含分号。花括号内的代码（`printf`\
  \ 和 `exit`）被安全地封装在 `do`/`while` 内部。花括号之外的代码是一个语句，这正是我们所需要的。现在编译器将接受这个代码宏了。\n\n##\
  \ 条件编译\n\n条件编译允许我们在编译时更改代码中的内容。该功能的经典用途是为程序准备一个调试版本和一个生产版本。\n\n`#ifdef`/`#endif`\
  \ 指令对会在符号被定义时编译两个指令之间的代码。这里有一个示例：\n\n```c\nint main()\n{\n#ifdef DEBUG\n    printf(\"\
  Debug version\\n\");\n#endif // DEBUG\n```\n\n严格严格来说，`// DEBUG` 注释不是必须的，但请确保包含它，因为匹配\
  \ `#ifdef`/`#endif` 对已经足够困难了。\n\n如果你的程序看起来如下：\n\n```c\n#define DEBUG   // 调试版本\n\
  \nint main()\n{\n#ifdef DEBUG\n    printf(\"Debug version\\n\");\n#endif // DEBUG\n\
  ```\n\n那么预处理结果将是：\n\n```c\nint main()\n{\n    printf(\"Debug version\\n\");\n```\n\
  \n另一方面，如果你的程序看起来如下：\n\n```c\n//#define DEBUG         // Release 版本\n\nint main()\n\
  {\n#ifdef DEBUG\n    printf(\"Debug version\\n\");\n#endif // DEBUG\n```\n\n那么预处理结果将是：\n\
  \n```c\nint main()\n{\n    // Nothing\n```\n\n由于 `DEBUG` 未被定义，因此没有生成代码。\n\n一个问题是，所有的\
  \ `#ifdef` 语句往往会让程序看起来很难看。考虑以下情况：\n\n```c\nint main()\n{\n#ifdef DEBUG\n    printf(\"\
  Debug version\\n\");\n#endif // DEBUG\n\n#ifdef DEBUG\n    printf(\"Starting main\
  \ loop\\n\");\n#endif // DEBUG\n\n    while (1) {\n#ifdef DEBUG\n        printf(\"\
  Before process file \\n\");\n#endif // DEBUG\n        processFile();\n#ifdef DEBUG\n\
  \        printf(\"After process file \\n\");\n#endif // DEBUG\n```\n\n我们可以用更少的代码实现相同：\n\
  \n```c\n#ifdef DEBUG\n#define debug(msg) printf(msg)\n#else // DEBUG\n#define debug(msg)\
  \ /* nothing */\n#endif // DEBUG\n\nint main()\n{\n    debug(\"Debug version\\n\"\
  );\n    debug(\"Starting main loop\\n\");\n\n    while (1) {\n        debug(\"Before\
  \ process file \\n\");\n        processFile();\n        debug(\"After process file\
  \ \\n\");\n```\n\n注意我们使用了 `#else` 指令来告诉预处理器反转 `#if` 的意义。如果 `DEBUG` 被定义，对 `debug`\
  \ 的调用将被替换为对 `printf` 的调用；否则，它们将被替换为空格。在这种情况下，我们不需要 `do`/`while` 技巧，因为代码宏包含一个单一的函数调用（不带分号）。\n\
  \n另一个指令 `#ifndef` 在符号未定义时为真，否则其用法与 `#ifdef` 指令相同。\n\n## 符号在何处定义\n\n我们可以通过三种方式定义符号：\n\
  \n1. 在程序内部使用 `#define`\n2. 从命令行\n3. 在预处理器内部预定义\n\n我们已经描述了在程序内部定义的符号，让我们来看另外两个选项。\n\
  \n### 命令行符号\n\n要在命令行上定义符号，请使用 `-D` 选项：\n\n```bash\n$ gcc -Wall -Wextra -DDEBUG -o\
  \ prog prog.c\n```\n\n`-DDEBUG` 参数定义了 `DEBUG` 符号，以便预处理器可以使用它。\n\n\n\n\n几个少量的预处理器指令也很有用，例如\
  \ `#warning`、`#error` 和 `#pragma`。\n\n当遇到 `#warning` 指令时，它会显示编译器警告：\n\n```c\n#ifndef\
  \ PROCESSOR\n#define PROCESSOR DEFAULT_PROCESSOR\n#warning \"No processor -- taking\
  \ default\"\n#endif // PROCESSOR\n```\n\n相关的 `#error` 指令会发出错误并停止你的程序编译：\n\n```c\n\
  #ifndef RELEASE_VERSION\n#error \"No release version defined. It must be defined.\"\
  \n#endif // RELEASE_VERSION\n```\n\n`#pragma` 指令定义了依赖编译器的控制。这里有一个示例：\n\n```c\n//\
  \ I wish they would fix this include file.\n#pragma GCC diagnostic ignored \"-Wmissing-prototypes\"\
  \n#include \"buggy.h\"\n#pragma GCC diagnostic warning \"-Wmissing-prototypes\"\n\
  ```\n\n这个 GCC 特有的 `#pragma` 关闭了关于缺少原型定义的警告，包含了一个有 bug 的头文件，然后重新开启警告。\n\n## 预处理器技巧\n\
  \n预处理器是一个愚蠢的宏处理器，因此，我们不得不采用之前描述的许多风格规则来避免陷入麻烦。预处理器的强大还允许我们执行一些有趣的技巧让我们的生活更轻松。其中之一就是\
  \ `enum` 技巧，我们在第 8 章中讨论过。在这一节中，我们将查看注释掉代码。\n\n有时，我们需要为了测试禁用某些代码。这样做的一种方法是将代码注释掉。例如，假设审计过程有\
  \ bug；我们可以禁用它，直到审计组改进好工作。\n\n这里是原始代码：\n\n```c\nint processFile(void) {\n    readFile();\n\
  \    connectToAuditServer();\n    if (!audit()) {\n        printf(\"ERROR: Audit\
  \ failed\\n\");\n        return;\n    }\n    crunchData();\n    writeReport();\n\
  } \n```\n\n这是移除审计功能后的代码：\n\n```c\nint processFile(void) {\n    readFile();\n// \
  \   connectToAuditServer();\n//    if (!audit()) {\n//        printf(\"ERROR: Audit\
  \ failed\\n\");\n//        return;\n//    }\n    crunchData();\n    writeReport();\n\
  }\n```\n\n我们想要想要删除的每一行现在都以 `//` 标记开头。\n\n然而，注释掉每一行是非常耗费体力的。相反，我们可以使用条件编译来移除代码。我们只需要做是将它括在\
  \ `#ifdef UNDEF` 和 `#endif // UNDEF` 语句中，如下：\n\n```c\nint processFile(void) {\n\
  \    readFile();\n#ifdef UNDEF\n    connectToAuditServer();\n    if (!audit()) {\n\
  \        printf(\"ERROR: Audit failed\\n\");\n        return;\n    }\n#endif //\
  \ UNDEF\n    crunchData();\n    writeReport();\n}\n```\n\n`#ifdef`/#endif` 块中的代码在\
  \ `UNDEF` 被定义时才会编译，而任何理智的程序员都不会这样做。使用 `#if 0` / `#endif` 同样的效果，且不取决于其他程序员的理智。\n\n\
  ## 总结\n\nC 预处理器是一个简单而强大的自动文本编辑器。使用得当，它可以让编程变得极其容易。它允许你定义简单的数值宏以及短小的代码宏。（实际上，你可以定义大型代码宏，但你真的不想那样做。）\n\
  \n它最大的特性之一是 `#include` 指令，它促进了模块之间接口的共享。此外，`#ifdef` 能力允许你通过条件编译编写一个具有多种人格的程序。\n\n\
  然而，你必须记住预处理器并不理解 C 语法。结果是，你必须记住几种风格规则和编程模式以有效地使用该系统。\n\n尽管有这些局限性和特殊之处，在创建 C 程序时，预处理器可以是一个强大的工具。\n\
  \n## 编程问题\n\n1. 写一个宏来交换两个整数。\n2. 高级：写一个宏来交换任意类型的两个整数。（在执行之前，请阅读 GCC 的 `typeof` 关键字的文档。）\n\
  3. 创建一个名为 `islower(x)` 的宏，如果 `x` 是小写字母则返回真。\n4. 疯狂的高级：搞清楚程序 `zsmall.c` 是如何工作的([`www.cise.ufl.edu/~manuel/obfuscate/zsmall.hint`](https://www.cise.ufl.edu/~manuel/obfuscate/zsmall.hint))。这个程序是混淆\
  \ C 竞赛的获奖者（它获得了“最佳滥用预处理器”奖）。它做的只是打印一个质数列表，但所有的计算和循环都是使用预处理器完成的。\n\n# 第二部分\n\n##\
  \ 针对大型机器的 C\n\n到目前为止，我们专注于嵌入式编程。在嵌入式系统中，你的内存有限，资源也有限。然而，C 设计用于运行在带有操作系统的大型机器上（我们不需要自己编写这些操作系统），并且它具有许多在这些大型机器上非常有用的特性。\n\
  \n例如，有一个名为 `heap`（堆）的内存区域允许你根据需要分配和释放内存来存储复杂对象。像网络浏览器和 XML 解析器这样的工具大量使用了堆。\n\n我们之前没有涵盖过这个，因为我们的内存几乎仅够栈（stack）使用——而且将内存分为栈和堆就像把一滴水分在两个杯子里。这是可能的，但非常复杂且没有太大用。\n\
  \n我们还没有涵盖过 C I/O 系统。我们一直自己处理 I/O，直接访问硬件。在带有操作系统的大型机器上，操作系统会向你隐藏所有这些细节。让我们看看嵌入式和嵌入式编程的区别。\n\
  \n在嵌入式编程中，当你写入设备时，你直接操作硬件。对于非嵌入式编程，当你调用 `write` 到设备时，操作系统会完成工作。\n\n在嵌入式编程中，你必须了解你正在使用的设备细节。对于非嵌入式编程，当你写入设备时，操作系统会完成工作，包括为了使\
  \ I/O 更高效而进行缓冲。\n\n在嵌入式编程中，你的内存有限。你需要知道每个字节在哪里以及如何被使用。对于非嵌入式编程，你有操作系统和内存映射系统，这让你可以使用大量的内存。大多数程序可以浪费内存，而且很多程序确实如此。\n\
  \n嵌入式程序由外部加载器加载到闪存中。在我们案例中，它被称为 ST-LINK 并隐藏在 IDE 中。程序永远留在闪存中，在系统正常运行期间永远不会卸载或替换。而非嵌入式系统的操作系统则根据需要加载和卸载程序。\n\
  \n嵌入式系统运行一个程序。你的内存仅够运行它。然而非嵌入式系统可以并且同时运行多个程序。我写这些内容的系统当前运行着 341 个程序，而且这是一个小型系统。\n\
  \n嵌入式程序永不停，而非嵌入式程序可以退出并将控制权交给操作系统。\n\n嵌入式系统将所有数据存储在内存中。非嵌入式系统拥有文件系统，可以读写文件数据以及屏幕、网络和其他外设。\n\
  \n最后，嵌入式系统的错误必须由你的程序处理。对于非嵌入式系统，你有一个操作系统可以捕捉程序未处理的错误并打印警告或停止程序。操作系统防止坏程序损坏系统上的其他资源。相比之下，如果嵌入式程序出现问题，你很容易导致系统崩溃（变砖）。\n\
  \nC++ 在大型系统上运行良好，因为在大多数情况下，开销不会显著影响结果。例如，假设你想写一个程序从数据库中读取大量数据并生成报告。对于每天运行一次的报告，谁会在乎程序是用了\
  \ 0.5 秒 CPU 时间还是 0.2 秒呢？\n\n然而，如果你在进行高性能计算，如游戏、动画或视频编辑，你需要 C 的性能和精确性。尽管它是一门古老的语言，C\
  \ 在大型机上仍然有一有一席之地。\n\n\n\n\n在本节中，你将学习如何使用堆（heap），它是可以随意分配或释放的动态内存。你还将学习如何处理操作系统的\
  \ I/O 系统——实际上是两个 I/O 系统：缓冲 I/O 系统和原始 I/O 系统。\n\n最后，你将发现如何使用浮点数。大多数廉价的嵌入式处理器没有浮点单元，因此我们无法在嵌入式程序中使用浮点数。此外，尽管大型主机具有专用的浮点硬件，但你必须谨慎地使用此功能；否则，可能会得到意想不到的结果。\n\
  \n# 13 动态内存\n\n![](img/chapterart.png)\n\n嵌入式系统的随机存储器（`RAM`）非常有限。到目前，我们将空内存划分为了一个小的栈（stack），没有留空间给任何其他东西。在处理更大的系统时，我们拥有\
  \ GB 级的内存，这使得将内存划分为两个部分：栈和堆（heap）变得更加容易。\n\n我们在第 7 章中讨论过栈。它是程序根据需要为每个过程分配局部变量和临时值的地方。堆则有些不同。你决定何时从堆分配内存，以及何时将其返回堆。通过堆，你可以创建非常复杂且大型的数据结构。例如，网络浏览器使用堆来存储构成网页的结构性元素。\n\
  \n本章描述了如何分配和释放内存。此外，我们还将探索如何实现链表数据结构，以演示常见的动态内存操作，以及如何调试常见的内存问题。\n\n## 基础堆分配与释放\n\
  \n我们使用 `malloc` 函数从堆获取内存。这里是该函数的通用形式：\n\n```\npointer = malloc(number-of-bytes);\n\
  ```\n\n该函数从堆获取 `number-of-bytes` 字节并返回指向这些内存的指针。内存是未初始化的，因此它包含随机值。如果程序耗尽了堆，函数将返回\
  \ `NULL` 指针。\n\n列表 13-1 中的程序在堆上为结构分配了内存，然后对其什么都没做。\n\n**simple.c**\n\n```c\n#include\
  \ <stdlib.h>\n#include <stdio.h>\n\n// 以名称为载荷的单链表\nstruct aList {\n     struct aList*\
  \ next; // 列表上的下一个节点\n     char name[50];      // 此节点的名称\n};\n\nint main() {\n \
  \   struct aList* listPtr = malloc(sizeof(*listPtr));\n    if (listPtr == NULL)\
  \ {\n        printf(\"ERROR: Ran out of memory\\n\");\n        exit(8);\n    }\n\
  \    return (0);\n}\n```\n\n列表 13-1: 简单的指针分配\n\n为了让程序更可靠，我们使用 `sizeof(*listPtr)`\
  \ 来确定要分配多少字节，这是一种常见的设计模式：\n\n```\npointer = malloc(sizeof(*pointer));\n```\n\n一个常见的设计错误是省略了星号，如下所示：\n\
  \n```\nstruct aList* listPtr = malloc(sizeof(listPtr));\n```\n\n存在“实体”和“指向实体的指针”。`listPtr`变量是一个指针，而\
  \ `*listPtr`表达式是一个实体。指针很小：在 64 位系统上是 8 字节。在这种情况下，一个实体的大小是 56 字节。这种设计模式确保你为变量分配了正确数量的字节，因为该变量在\
  \ `malloc` 的参数中重复出现。\n\n通常你会看到在 `sizeof` 中直接使用结构本身，而不是指向结构的指针：\n\n```\nstruct aList*\
  \ listPtr = malloc(sizeof(struct aList));\n```\n\n这行得通，但略有危险。假设有人更改了 `listPtr` 的类型。例如，以下是不正确的：\n\
  \n```\nstruct aListImproved* listPtr = malloc(sizeof(struct aList));\n```\n\n那么发生了什么？起初，我们有如下所示正确但危险的声明：\n\
  \n```\nstruct aList* listPtr = malloc(sizeof(struct aList));\n```\n\n一切运行正常，因为 `listPtr`\
  \ 是一个指向 `struct aList` 的指针。只要类型匹配，一切都是没问题的。现在假设有人决定修改代码，让 `listPtr` 指向 `aList` 的新且改进后的版本（即\
  \ `aListImproved`），但他们没有更改 `malloc` 函数中的类型。更糟糕，，如果代码不是之前那种简单、显而易见的单行代码，而是像这样：\n\n\
  ```\nstruct aListImproved* listPtr;\n// 3,000 行密集的代码\n\n// 错误\nlistPtr = malloc(sizeof(struct\
  \ aList));\n```\n\n这段代码没有为新字段分配足够的空间，因此每当有人使用新字段时，随机内存就会被覆盖。\n\n检查是否耗尽内存的好做法是检查\
  \ `malloc` 是否返回了 `NULL` 指针：\n\n```c\nif (listPtr == NULL) {\n    printf(\"ERROR:\
  \ Ran out of memory\\n\");\n    exit(8);\n}\n```\n\n即使你认为 `malloc` 永远不会失败，这至关重要。\n\
  \n我们的程序存在内存泄漏，这意味着它没有释放所使用的内存。当程序释放内存时，它会被返回堆以供随后的 `malloc` 重用。为了做到，我们使用 `free`\
  \ 函数：\n\n```\nfree(listPtr);\n```\n\n## 链表\n\n现在我们有了堆，并且可以在其中存储数据，我们将使用一种名为*单链表*（singly\
  \ linked list）的原始结构，它与数组相比若干优势。（数组的优势是搜索更快。）\n\n假设我们需要存储电话簿名称。问题是由于不知道有多少名称。此外，名称可以随时添加或删除。对于嵌入式系统，这个问题很简单。我们创建一个数组来存储名称。如果数组空间不足，我们就告诉用户无法存储更多名称。如果有链表会更好，如果拥有内存和堆的话。在极其受限的嵌入式系统中，这两者都没有。\n\
  \n列表的每个元素称为节点，是从堆中分配的。为了跟踪这些元素，我们有一个指向第一个节点的指针。第一个节点指向第二个节点，依此类推，直到到达最后一个节点。它的指针为\
  \ `NULL`，表示列表的结束。节点没有固定数量。如果我们还需要另一个，只需从堆中分配。\n\n这里是链表的结构：\n\n```c\n#define NAME_SIZE\
  \ 20    // 名称的最大字符数\n/**\n * 链表中的节点\n */\nstruct linkedList {\n    struct linkedList*\
  \ next;    // 下一个节点\n    char name[NAME_SIZE];       // 节点的名称\n};\n```\n\n`next`\
  \ 指针指向下一个节点（或 `NULL`），`name` 数组存储多达 20 个字符。图 13-1 是此列表的图。\n\n![f13001](img/f13001.png)\n\
  \n图 13-1: 单链表\n\n单链表提供了一种在堆中存储可变数量项目的非常简单的方法。\n\n### 添加节点\n\n\n\n要向列表中添加一个节点（例如，“Fred”），我们必须先创建一个它。在代码中，我们让\
  \ `newNode` 变量指向新创建的节点。现在的内存布局如 图 13-2 所示。\n\n![f13002](img/f13002.png)\n\n图 13-2:\
  \ 创建了新节点\n\n图 13-2 显示了我们的链表（不包含“Fred”）以及我们为“Fred”分配的新节点。接下来，我们让新节点的 `next` 链接指向列表的开头（参见\
  \ 图 13-3）。\n\n![f13003](img/f13003.png)\n\n图 13-3: 新节点的 `next` 指针指向列表开头。\n\n最后一步是赋值\
  \ `theList = newNode`，将原先指向列表头部的指针移动到我们新的第一个节点（参见 图 13-4）。\n\n![f13004](img/f13004.png)\n\
  \n图 13-4: 将新节点移动到列表头部\n\n代码列表 13-2 显示了将新节点添加到列表头部的代码。\n\n```c\nstatic void addName(void)\n\
  {\n    printf(\"Enter word to add: \");\n\n    char line[NAME_SIZE];       // Input\
  \ line\n\n    if (fgets(line, sizeof(line), stdin) == NULL)\n        return;\n\n\
  \    if (line[strlen(line)-1] == '\\n')\n        line[strlen(line)-1] = '\\0';\n\
  \n    // Get a new node.\n    struct linkedList* newNode = malloc(sizeof(*newNode));\n\
  \n    strncpy(newNode->name, line, sizeof(newNode->name)-1);\n    newNode->name[sizeof(newNode->name)-1]\
  \ = '\\0';\n    newNode->next = theList;\n    theList = newNode;\n}\n```\n\n代码列表\
  \ 13-2: 向链表添加一个单词\n\n我们从函数声明开始，`static` 关键字表示该函数对该文件中的代码可见。我们首先请求要添加的单词，并使用 `fgets`\
  \ 函数获取它，该函数的通用格式如下：\n\n```c\nfgets(array, size, file)\n```\n\n该函数从 `file` 中读取一行并将其放入\
  \ `array` 中。`size` 是要存入数组的字节数，包括一个字符串结束符（`\\0`）。在这种情况下，数组是 `line`（输入行），文件是 `stdin`（标准输入，换句话说，就是终端）。如果\
  \ `fgets` 返回 `NULL`，说明由于错误或数据耗尽，我们无法读取 `stdin`。此时，我们放弃操作并返回，因为我们没有获取到任何单词。\n\n`fgets`\
  \ 函数最多读取 `size`-`1` 个字符，因为它总会在数组末尾放置一个字符串结束符（`\\0`）。如果插入行比 `size` 短，则整行（包括换行符）都会被放入缓冲区中。如果行得更长，则输入会被截断。\n\
  \n我们不能依赖缓冲区中存在换行符，也不希望它存在。如果字符串中的最后一个字符（通过 `strlen` 函数找到，它返回字符串的字符数）是换行符，我们通过将其改为空字符（`'\\\
  0'`）来删除它。然后我们为新节点分配内存，并通过将 `line` 拷贝到节点名称中来填充它。\n\n`strncpy` 函数将第二个参数（`line`）拷贝到第一个参数（`newNode->name`），但只拷贝第三个参数指定的字符数。如果要复制的数据（`line`）字符多于\
  \ `size` 参数，它将限制复制的字符数且不会在末尾插入字符串结束符（`\\0`），因此为了安全起见，我们手动在 `name` 数组末尾添加一个字符串结束符。\n\
  \n我们让 `newNode` 指向第一个节点，然后获取 `theList` 并让它指向新节点，如图 13-3 和 13-4 所示。\n\n### 打印链表\n\
  \n打印链表的规则非常简单。这是一个示例：\n\n```c\nfor (const struct linkedList* curNode = 1 theList;\n\
  \   2 curNode != NULL;\n   3 curNode = curNode->next){\n    printf(\"%s, \", curNode->name);\n\
  }\n```\n\n我们从第一个节点 1 开始，打印它，然后跳转到下一个节点 3。我们持续进行直到耗尽列表 2。在这个示例中，`for` 循环的初始化、结束条件和迭代语句被分成了三行。代码确实在列表末尾多了一个逗号，但我确定你可以想出如何修复它。图\
  \ 13-5 显示了它是如何工作的。\n\n![f13005](img/f13005.png)\n\n图 13-5: 正在打印列表\n\n由于我们的链表是一个简单的数据结构，打印非常简单，而且\
  \ `for` 循环的灵活性使得能够遍历列表。\n\n### 删除节点\n\n要删除一个节点，我们首先遍历列表找到目标节点。接下来，我们移除该节点并将上一个节点连接到下一个节点。代码如下：\n\
  \n```c\nstatic void deleteWord(void)\n{\n    printf(\"Enter word to delete: \");\n\
  \n    char line[NAME_SIZE]; // Input line\n\n    if (fgets(line, sizeof(line), stdin)\
  \ == NULL)\n        return;\n\n    if (line[strlen(line)-1] == '\\n')\n        line[strlen(line)-1]\
  \ = '\\0';\n\n    struct linkedList* prevNode = NULL; // Pointer to previous node\n\
  \  1 for (struct linkedList* curNode = theList;\n         curNode != NULL;\n   \
  \      curNode = curNode->next) {\n       2 if (strcmp(curNode->name, line) == 0)\
  \ {\n            if (prevNode == NULL) {\n              3 theList = curNode->next;\n\
  \            } else {\n              4 prevNode->next = curNode->next;\n       \
  \     }\n          5 free(curNode);\n            curNode = NULL;\n            return;\n\
  \        }\n      6 prevNode = curNode;\n    }\n    printf(\"WARNING: Node not found\
  \ %s\\n\", line);\n}\n```\n\n我们使用 `for` 循环，就像打印时一样 1，但不是打印节点，而是使用 `strcmp` 函数检查它是否为我们要的节点，如果字符串相同，该函数返回\
  \ `0`。如果不是，我们更新指向上一个节点的指针 6（我们在删除时需要用到它），并跳转到下一个节点。\n\n如果我们找到了节点（例如，“Joe”），`prevNode`\
  \ 将指向“Sam”，而 `curNode` 将指向“Joe”，如 图 13-6 所示。\n\n接下来我们让从“Sam”的链接指向“Mac”，跳过“Joe”节点\
  \ 4。然后我们通过释放内存并将指针设置为 `NULL`5 来删除该节点，只要 `prevNode` 已设置这种做法就是有效。如果我们要删除第一个节点“Sam”，我们需要更改列表指针以跳过被删除的节点\
  \ 3。\n\n![f13006](img/f13006.png)\n\n图 13-6: 删除节点 `“Joe”`\n\n### 整合\n\n代码列表 13-3\
  \ 是一个旨在交互式编辑和打印链表的小命令行程序。\n\n**linked.c**\n\n\n\n\n\n```c\n/**\n * 演示单链表。\n */\n\
  #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <stdbool.h>\n\
  \n#define NAME_SIZE 20    // 名字的最大字符数\n/**\n * 链表中的一个节点\n */\nstruct linkedList\
  \ {\n    struct linkedList* next;    // 下一个节点\n    char name[NAME_SIZE];       //\
  \ 节点的名称\n};\n// 单词链表\nstatic struct linkedList* theList = NULL;\n\n/**\n * 向链表添加添加一个名称。\n\
  \ */\nstatic void addName(void)\n{\n    printf(\"输入要添加的单词: \");\n\n    char line[NAME_SIZE];\
  \       // 输入行\n\n    if (fgets(line, sizeof(line), stdin) == NULL)\n        return;\n\
  \n    if (line[strlen(line)-1] == '\\n')\n        line[strlen(line)-1] = '\\0';\n\
  \n    // 获取新节点。\n    struct linkedList* newNode = malloc(sizeof(*newNode));\n\n\
  \    strncpy(newNode->name, line, sizeof(newNode->name)-1);\n    newNode->name[sizeof(newNode->name)-1]\
  \ = '\\0';\n    newNode->next = theList;\n    theList = newNode;\n}\n\n/**\n * 从链表中删除一个单词。\n\
  \ */\nstatic void deleteWord(void)\n{\n    printf(\"输入要删除的单词: \");\n\n    char line[NAME_SIZE];\
  \       // 输入行\n\n    if (fgets(line, sizeof(line), stdin) == NULL)\n        return;\n\
  \n    if (line[strlen(line)-1] == '\\n')\n        line[strlen(line)-1] = '\\0';\n\
  \n    struct linkedList* prevNode = NULL; // 指向上一个节点的指针\n    for (struct linkedList*\
  \ curNode = theList;\n         curNode != NULL;\n         curNode = curNode->next)\
  \ {\n        if (strcmp(curNode->name, line) == 0) {\n            if (prevNode ==\
  \ NULL) {\n                theList = curNode->next;\n            } else {\n    \
  \            prevNode->next = curNode->next;\n            }\n            free(curNode);\n\
  \            curNode = NULL;\n            return;\n        }\n        prevNode =\
  \ curNode;\n    }\n    printf(\"警告: 未找到节点 %s\\n\", line);\n}\n\n/**\n * 打印链表。\n\
  \ */\nstatic void printList(void)\n{\n    // 遍历链表中的每个节点。\n    for (const struct\
  \ linkedList* curNode = theList;\n         curNode != NULL;\n         curNode =\
  \ curNode->next) {\n        printf(\"%s, \", curNode->name);\n    }\n    printf(\"\
  \\n\");\n}\n\nint main()\n{\n    while (true) {\n        printf(\"a-添加, d-删除, p-打印,\
  \ q-退出: \");\n        char line[100]; // 输入行\n        if (fgets(line, sizeof(line),\
  \ stdin) == NULL)\n            break;\n\n        switch (line[0]) {\n          \
  \  case 'a':\n                addName();\n                break;\n            case\
  \ 'd':\n                deleteWord();\n                break;\n            case\
  \ 'p':\n                printList();\n                break;\n            case 'q':\n\
  \                exit(8);\n            default:\n                printf(\n     \
  \               \"错误: 未知命令 %c\\n\", line[0]);\n                break;\n        }\n\
  \    }\n}\n```\n列表 13-3: 实现链表的程序\n\n用户输入命令来按名称添加或删除节点、打印链表或退出程序。当用户添加或删除节点时，程序会动态分配或释放内存。\n\
  \n## 动态内存问题\n\n当我们使用动态内存时，可能会发生几种常见错误，例如内存泄漏、释放后使用指针，以及在结构体末尾写入数据破坏随机内存。让我们来看看每个错误以及如何防止它们。\n\
  \n`内存泄漏`（memory leak）发生在内存被分配但从未释放的情况下。这里有一个例子：\n\n```c\n{\n    int* dynamicArray;\
  \    // 一个动态数组\n    // 分配 100 个元素。\n    dynamicArray = malloc(sizeof(int) * 100);\n\
  }\n```\n\n程序每次执行这段代码时，都会分配另外 400 字节的内存。如果程序运行足够的时间，它将消耗所有可用内存并崩溃。（实际上，它会消耗足够的内存资源使得其他程序变得非常慢，在消耗这么多内存导致计算机完全无法用之前再运行一段时间，最终耗尽内存。）\n\
  \n释放后使用指针（通常被称为 `use after free`，释放后使用）可能会导致随机结果或覆盖随机内存。让我们看一个例子：\n\n```c\nfree(nodePtr);\n\
  nextPtr = nodePtr->Next;   // 非法\n```\n\n在这种情况下，`free` 函数可能会向节点中写入记录数据或其他数据，结果导致\
  \ `nextPtr` 是未定义的。\n\n正如本章前面提到的，简单的设计模式将限制此类代码可能造成的破坏。我们总是在释放指针后将该指针设置为 `NULL`：\n\
  \n```c\nfree(nodePtr);\nnodePtr = NULL;\nnextPtr = nodePtr->Next;   // 导致程序崩溃\n\
  ```\n\n我们将一个未定义的、随机的行为交换为了一个可重复、可预测的行为。崩溃的原因很容易找到。\n\n\n\n\n内存问题自第一台计算机出现以来一直困扰着程序，而且它们极难发现。`address\
  \ sanitizer` 是能够帮助我们发现这些问题的工具之一。\n\n## 总结\n\n堆允许你根据需要为程序添加和移除额外的内存。它赋予了你创建大型、复杂且精彩的数据结构的能力。关于各种数据结构和数据结构设计的描述可以填满一整本书。\n\
  \n本章介绍了单向链表，它是数据结构中的“Hello World”。随着学习的深入，你可以学习如何使用堆来存储更复杂的数据。目前，你已经学习了基础知识，接下来的路如何取决于你自己。\n\
  \n## 编程题\n\n1.  修改列表 13-3 中实现链表的程序，使其节点始终保持有序。\n2.  给定两个有序链表，创建一个返回公共节点列表的函数。你可以通过创建一个新列表来实现，也可以创建一个列表体部分仅为指向另一个列表任一个节点指针的列表。\n\
  3.  修改列表 13-3 中的程序以使用双向链表。每个节点将有一个指向后继节点的 `next` 指针和一个指向前驱节点的 `previous` 指针。\n4.\
  \  编写一个反转单向链表顺序的函数。\n5.  编写一个删除链表中重复元素的函数。\n\n# 14\n\n## 缓冲文件 I/O\n\n![](img/chapterart.png)\n\
  \n在本书的第一部分，我们费力才实现向控制台输出最简单的内容。但在本书的这部分，我们拥有了操作系统，这使得处理输入输出变得简单得多。这是因为操作系统向你隐藏了大量的复杂性：你只需要写入\
  \ `\"Hello World\\n\"`，操作系统就会将数据发送到适当的地方。\n\n在本章中，你将学习 C 的 I/O 系统，它不仅包括 `printf`\
  \ 函数，还包括高效且灵活地读写磁盘文件的函数。\n\n## printf 函数\n\n我们已经用 `printf` 函数进行了几次简单输出。该函数的基本格式为：\n\
  \n```\nprintf(format-string, argument, ...)\n```\n\n格式字符串告诉 `printf` 要打印什么。除了百分号\
  \ (`%`) 之外的任何字符都会打印。`%` 字符开始字段说明，告诉 `printf` 转到参数列表，并根据随后的字段说明打印下一个参数。例如：\n\n```\n\
  printf(\"Number: ->%d<-\\n\", 1234);   // 输出 ->1234<-\n```\n\n`%d` 字段说明可以使用数字进行修改：\n\
  \n```\nprintf(\"Number: ->%3d<-\\n\", 12);    // 输出 ->->.12<- (使用 . 填充空格)\nprintf(\"\
  Number: ->%-3d<-\\n\", 12);   // 输出 ->->12.<- (使用 . 填充空格)\nprintf(\"Number: ->%3d<-\\\
  n\", 1234);  // 输出 ->->1234<- (至少 3 个字符)\n```\n\n在这些示例中，`%3d` 告诉 `printf` 使用至少三个字符来打印数字。`%-3d`\
  \ 字段告诉 `printf` 用至少三个字符打印数字并对其进行左对齐。\n\n到目前为止，我们只讨论了 `d` 转换字符，它用于将整数参数转换为文本进行打印。表\
  \ 14-1 列出了主要的转换字符。\n\n| 转换字符 | 参数类型 | 注释 |\n| --- | --- | --- |\n| `%d` | 整数 | `char`\
  \ 和 `short int` 类型在作为参数传递时会被提升为 `int`，因此此格式适用于这三种类型。 |\n| `%c` | 字符 | 由于提升，此转换字符实际上接收一个整数参数并作为字符打印。\
  \ |\n| `%o` | 整数 | 八进制打印。 |\n| `%x` | 整数 | 十六进制打印。 |\n| `%f` | 双精度 |  `float` 和\
  \ `double` 类型，因为所有 `float` 参数在作为参数传递时都会提升为 `double`。 |\n| `%l` | 长整数 | `long int`\
  \ 类型需要单独转换，因为 `int` 类型不会自动提升为 `long int`。 |\n\n表 14-1：主要的 C 转换字符\n\n### 编写 ASCII\
  \ 表格\n\n让我们写一个短程序来创建一个包含可打印字符及其十六进制和八进制值的表格，这将为格式字符串提供一个实用的演示。该程序（列表 14-1）让我们有机会以四种不同的方式表达相同的数据，并尝试\
  \ `printf` 语句内部尝试不同的格式。\n\n**ascii.c**\n\n```\n/**\n * 打印 ASCII 字符表（仅可打印字符）。\n */\n\
  \n#include <stdio.h>\n\nint main()\n{\n    for (char curChar = ' '; curChar <= '~';\
  \ ++curChar) {\n        printf(\"Char: %c Decimal %3d Hex 0x%02x Octal 0%03o\\n\"\
  ,\n               curChar, curChar, curChar, curChar);\n    }\n}\n```\n\n\n\n其中\
  \ `result` 是指向刚刚读取的字符串（`buffer`）的指针，如果到达文件末尾（EOF），则为 `NULL`。`buffer` 是一个用于存放行的字符数组，而\
  \ `file` 是指示要读取哪个文件的文件句柄（在此时，`stdin` 是我们唯一已知道的文件）。\n\n`buffer` 总是以空字符结尾的（`\\0`），因此放入\
  \ `buffer` 中的字符最多有 `size-1` 个。（即使 `buffer` 不够大以容纳整行，系统也会读取一整行。）\n\n`sscanf` 函数与\
  \ `scanf` 函数非常相似，只是第一个参数现在是一个字符串。其余参数相同。`sscanf` 函数返回它转换的项数。\n\n之前的代码假设一切运行正常。让我们重写它，这次要检查错误：\n\
  \n```c\nif (fgets(line, sizeof(line), stdin) == NULL) {\n    fprintf(stderr, \"\
  ERROR: Expected two integers, got EOF \\n\");\n    return (ERROR);\n}\nif (sscanf(line,\
  \ \"%d %d\", &aInteger, &anotherInteger) != 2) {\n    fprintf(stderr, \"ERROR: Expected\
  \ two integers.\\n\");\n    return (ERROR)\n}\n```\n\n如果第一次调用 `fgets` 返回 `NULL`，说明出问题了。我们随后向预定义的错误文件（`stderr`）打印错误信息，并向调用者返回一个错误代码。接下来，我们执行\
  \ `sscanf`，它应该找到两个整数。如果没有找到，我们再次打印错误信息并返回一个错误代码。\n\n## 危险的 gets 函数\n\n`fgets` 函数有一个对应的简写函数，用于从\
  \ `stdin` 读取数据。它被称为 `gets`，并具有以下通用形式：\n\n```c\nresult = gets(buffer);\n```\n\n`gets`\
  \ 函数读取一行数据并将其放入 `buffer` 中，无论 `buffer` 是否能容纳它。\n\n当前的 GCC 编译器使得 `gets` 变得难以使用。首先，除非你正确定义了条件编译宏，否则\
  \ `stdio.h` 不会定义它。当你编译程序时，编译器会发出警告；然后当程序链接时，链接器也会再次发出警告。\n\n[Listing 14-3] 显示了使用\
  \ `gets` 编译程序时发生的情况。\n\n```\n$ gcc -Wall -Wextra -o gets gets.c\nAgets.c: In function\
  \ 'main':\ngets.c:17:5: warning: 'gets' is deprecated [-Wdeprecated-declarations]\n\
  \     gets(line);\n     ^~~~\nIn file included from gets.c:11:0:\n/usr/include/stdio.h:577:14:\
  \ note: declared here\n extern char *gets (char *__s) __wur __attribute_deprecated__;\n\
  \              ^~~~\n/tmp/cc5H1KMF.o: In function `main`:\ngets.c:(.text+0x1f):\
  \ warning: the `gets' function is dangerous and should not be used.\n```\n\nListing\
  \ 14-3: 尝试使用 `gets`\n\n从输出量中， GCC 编译器为了说服你不要使用 `gets` 付出了多少精力。\n\n既然我们已经查看了一些不应该使用的东西，让我们来看看我们应该使用的东西。\n\
  \n## 打开文件\n\n预定义的文件 `stdin`、`stdout` 和 `stderr` 是文件句柄。`fopen` 函数允许你创建文件句柄。[Listing\
  \ 14-4] 显示了一个简单的示例。\n\n**file.c**\n\n```c\n#include <stdio.h>\n\nint main()\n{\n\
  \  1 FILE* outFile = 2 fopen(\"hello.txt\", \"w\");\n    if (outFile == NULL) {\n\
  \        fprintf(stderr, \"ERROR: Unable to open 'hello.txt'\\n\");\n        exit(8);\n\
  \    }\n    if (fprintf(outFile, \"Hello World!\\n\") <= 0) {\n        fprintf(stderr,\
  \ \"ERROR: Unable to write to 'hello.txt'\\n\");\n        exit(8);\n    }\n    if\
  \ (fclose(outFile) != 0) {\n        fprintf(outfile, “ERROR: Unable to close 'hello.txt'\\\
  n\");\n        exit(8);\n    }\n    return (0);\n}\n```\n\nListing 14-4: 文件版本的“Hello\
  \ World”\n\n首先，`FILE*` 声明 1 声明了一个新的文件句柄。所有文件操作都需要文件句柄。接下来我们有 `fopen` 调用 2，它具有以下通用形式：\n\
  \n```c\nresult = fopen(filename, mode);\n```\n\n`mode` 可以是以下内容之一：\n\n1. `r` 只读\n\
  2. `w` 只写\n3. `r+` 读写\n4. `a` 附加（写入，但从文件末尾开始）\n5. `b` 与其他模式结合使用用于二进制文件（在下一节中讨论）\n\
  \n现在我们已经打开了文件，就可以对它们进行读写。文本可以通过 `fprintf` 写入，并通过 `fgets` 读取。接下来，让我们看看其他类型的文件：二进制文件。\n\
  \n## 二进制 I/O\n\n到为止我们仅限制在文本文件上，但 C I/O 系统可以通过 `fread` 和 `fwrite` 处理二进制文件。`fread`\
  \ 的通用形式是：\n\n```c\nresult = fread(buffer, size, count, inFile);\n```\n\n在这里，`buffer`\
  \ 是指向要放置数据的指针，`size` 是每个元素的大小，`count` 是要读取的元素个数，`inFile` 是句柄。`fread` 返回读取的项数，如果到达文件末尾则返回\
  \ `0`。它也可以返回 `-1` 来表示错误。\n\n`fwrite` 函数与之类似，但它是写入数据。通用形式为：\n\n```\nresult = fwrite(buffer,\
  \ size, count, outFile);\n```\n\n在这里，`buffer` 是要写入数据的指针，`size` 是每个元素的大小，`count`\
  \ 是要写入的元素个数，`outFile` 是句柄。`fwrite` 返回实际写入的项目。如果这个数字小于 `count`，说明发生了短写。\n\n## 拷贝文件\n\
  \n我们将使用 `fread` 和 `fwrite` 来拷贝文件。\n\n**copy.c**\n\n```c\n/**\n * 拷贝文件\n */\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n#include <stdbool.h>\n\nint main()\n{\n    //\
  \ 输入文件\n    1 FILE* inFile = fopen(\"infile.bin\", \"rb\");\n    if (inFile == NULL)\
  \ {\n        fprintf(stderr, \"ERROR: Could not open infile.bin\\n\");\n       \
  \ exit(8);\n    }\n    // 输出文件\n    FILE* outFile = fopen(\"outfile.bin\", \"wb\"\
  );\n    if (outFile == NULL) {\n        fprintf(stderr, \"ERROR: Could not create\
  \ outfile.bin\\n\");\n        exit(8);\n    }\n    char buffer[512]; // 缓冲区\n\n\
  \    // 读取数据\n    while (true) {\n      2 ssize_t readSize = fread(buffer, 1, sizeof(buffer),\
  \ inFile);\n      if (readSize < 0) {\n          fprintf(stderr, \"ERROR: Read error\\\
  n\");\n          exit(8);\n      }\n      3 if (readSize == 0) {\n          break;\n\
  \      }\n      4 if (fwrite(buffer, 1, readSize, outFile) != (size_t)readSize)\
  \ {\n          fprintf(stderr, \"ERROR: Write error\\n\");\n          exit(8);\n\
  \      }\n    }\n    fclose(inFile);\n    fclose(outFile);\n    return (0);\n}\n\
  ```\n\nListing 14-5: 拷贝文件\n\n\n\n为了消除警告，我们需要插入一个强制转换，以此告诉 C：“是的，我知道我们正在混合有符号和无符号类型，但由于\
  \ `fread` 和 `fwrite` 的定义非常愚蠢，我们必须这样做”：\n\n```\nif (fwrite(buffer, 1, readSize, outFile)\
  \ != (size_t)readSize) {\n```\n\n另外注意，在最后一次读取时，我们可能无法获得完整的 512 字节。这就是为什么我们在 `fwrite`\
  \ 语句中使用 `readSize` 而不是 `sizeof(buffer)`。\n\n## 缓冲与刷新\n\nC 的 I/O 系统使用*缓冲 I/O*（buffered\
  \ I/O），这意味着当你执行 `printf` 或 `fwrite` 时，数据可能不会立即发送到输出设备。相反，会被存储在内存中，直到系统拥有足够的数据来提高效率。\n\
  \n发送到控制台的数据是*行缓冲的*（line buffered），这意味着如果你只打印了一行的一部分，它可能在这一行的剩余部分发送之前不会输出。让我们看看这如何通过列表\
  \ 14-6 中的程序给我们带来麻烦。\n\n```\n/**\n * 展示缓冲如何通过除以零的错误\n * 欺骗我们。\n */\n\n#include <stdio.h>\n\
  \nint main()\n{\n    int zero = 0;    // 常量零，用于欺骗\n                     // 编译器允许我们除以\
  \ 0\n    int result;      // 用于存放结果的变量\n\n    printf(\"Before divide \");\n    result\
  \ = 5 / zero;\n    printf(\"Divide done\\n\");\n    printf(\"Result is %d\\n\",\
  \ result);\n    return (0);\n}\n```\n\n列表 14-6：除以零\n\n当运行此程序时，你可能会看到以下输出：\n\n```\n\
  Before divide Floating point exception (core dumped)\n```\n\n但你实际上看到的是这个：\n\n```\n\
  Floating point exception (core dumped)\n```\n\n你的第一反应可能是 `printf` 没有执行，但它确实执行了。数据进入了缓冲区，并在程序中止时正留在缓冲区中，给出了一个\
  \ `printf` 没有起作用的假象。\n\n要解决这个问题，我们需要告诉 I/O 系统“现在写出缓冲区的数据”，这是通过 `fflush` 函数实现的：\n\
  \n```\n printf(\"Before divide \");   fflush(stdout);\n```\n\n刷新数据确保了我们可以看到它。另一方面，我们不想在每次写入后都进行刷新，因为那样会违背缓冲的目的，即使\
  \ I/O 更具高效性。\n\n## 关闭文件\n\n最后，在我们处理完一个文件后，我们需要告诉 C 我们已经处理完了它。我们使用 `fclose` 函数来实现：\n\
  \n```\nint result = fclose(file);\n```\n\n其中 `file` 是要关闭的 `FILE*`，如果成功则 `result`\
  \ 为 `0`，失败则为非零。\n\n## 总结\n\n在嵌入式世界中，I/O 是困难的，因为你必须编写代码直接处理设备，并且需要为每种设备编写不同的代码。\n\
  \nC I/O 系统的设计是为了隐藏所有这些细节。它还提供了很多很好的特性，如格式化、缓冲和设备无关性。缓冲 I/O 系统适用于大多数通用应用程序。\n\n##\
  \ 编程题\n\n1. 查看在 `printf` 语句中放入过多或过少参数会发生什么。放入错误的类型（例如用 `double` 代替 `int`）时会发生什么？\n\
  2. 写一个程序，要求用户输入摄氏度温度并将其转换为华氏度。\n3. 写一个程序统计文件中单词的个数。确保你对“单词”的定义进行了说明，因为某些人对单词的理解可能与你不同。\n\
  4. 写一个程序逐行比较两个文件，并写出不同的行。\n\n# 15 命令行参数与原始 I/O\n\n![](img/chapterart.png)\n\n在本章中，我们将探索命令行参数如何允许操作系统在程序被调用时向程序传递信息。我们还将查看另一个与操作系统接近的特性：原始输入输出（I/O）系统。该系统允许我们精确控制程序执行\
  \ I/O 的方式。如果处理得当，它可以成为程序巨大的资产。\n\n我们将使用原始 I/O 系统执行高速文件复制。该程序还将使用命令行参数来指定源文件和目标文件，因此我们不需要将它们硬编码到程序中。\n\
  \n## 命令行参数\n\n操作系统允许用户在程序运行时为程序提供多个命令行选项：\n\n```\n$ ./prog argument1 argument2 argument3\n\
  ```\n\nC 通过两个参数 `argc` 和 `argv` 将这些参数传递给 `main`：\n\n```\nint main(const int argc,\
  \ const char* const argv[])\n```\n\n第一个参数 `argc` 包含参数的数量。由于历史原因，它是一个整数而不是无符号整数。第二个参数\
  \ `argv` 是一个字符串数组，代表实际参数。\n\n如果你像这样运行一个程序：\n\n```\n./prog first second third\n```\n\
  \n`argv` 和 `argc` 参数将包含以下内容：\n\n```\nargc\t4\nargv[0]    ./prog\nargv[1]    first\n\
  argv[2]    second\nargv[3]    third\n```\n\n## 原始 I/O\n\nC 的两种主要的文件 I/O 系统是*缓冲 I/O*和*原始\
  \ I/O*。我们在第 14 章中讨论的标准 I/O 系统（`printf`）使用了缓冲。在本章中，我们将使用原始 I/O。为了展示它们之间的差异，让我们考虑一个例子。假设你想清理衣柜，有\
  \ 500 根电源线要丢掉。你可以这样操作：\n\n1.  拿起一根电源线。\n2.  走到垃圾桶旁。\n3.  把它扔掉。\n4.  重复 500 次。\n\n\
  这种方法就像是使用原始 I/O 来处理电源线。这种*吞吐量*（你工作的速度）非常糟糕。\n\n让我们添加一个缓冲区——在这种情况下是一个垃圾袋。现在的流程是：\n\
  \n1.  把电源线放入袋中。\n2.  继续往袋里放电源线直到装满。（它能装下 100 根。）\n3.  走到垃圾桶旁。\n4.  扔掉袋子。\n5.  重复\
  \ 5 次。\n\n缓冲让重复过程更高效，那么什么时候你想用原始 I/O 呢？当为每个物品单独走一次垃圾桶更有效时，你就会使用它。假设你要丢掉五台冰箱。你不会把五台冰箱装进一个垃圾袋然后扔掉。相反，你会一个一个地扔掉。\n\
  \n### 使用原始 I/O\n\n如果我们想复制一个文件，可以使用缓冲 I/O 系统来完成，但这意味着我们需要让缓冲 I/O 系统选择缓冲区的大小。相反，我们想要设置自己的缓冲区大小。在这种情况下，我们知道\
  \ 1024 字节的大小对于我们正在使用的设备是最优的，因此我们创建了列表 15-2 所示的程序，使用原始 I/O 使用 1024 字节的缓冲区复制文件。\n\n\
  **copy.c**\n\n\n\n\n\n```c\n/**\n * 将一个文件拷贝到另一个。\n *\n * 使用:\n *     copy <from>\
  \ <to>\n */\n\n#include <stdio.h>\n#include <stdbool.h>\n#include <stdlib.h>\n\n\
  #include <unistd.h>\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <fcntl.h>\n\
  \n#ifndef O_BINARY\n#define O_BINARY 0      // 如果未定义，则定义 O_BINARY。\n#endif // O_BINARY\n\
  \nint main(int argc, char* argv[])\n{\n  if (argc != 3) {\n        fprintf(stderr,\
  \ \"Usage is %s <infile> <outfile>\\n\", argv[0]);\n        exit(8);\n    }\n\n\
  \    // 输入文件的文件描述符\n  int inFd = open(argv[1], O_RDONLY|O_BINARY);\n\n  if (inFd\
  \ < 0) {\n        fprintf(stderr, \"ERROR: Could not open %s for input\\n\", argv[1]);\n\
  \        exit(8);\n    }\n\n    // 输出文件的文件描述符\n  int outFd = open(argv[2], O_WRONLY|O_CREAT|O_BINARY,\
  \ 0666);\n    if (outFd < 0) {\n        fprintf(stderr, \"ERROR: Could not open\
  \ %s for writing\\n\", argv[2]);\n        exit(8);\n    }\n\n    while (true)\n\
  \    {\n        char buffer[1024];      // 用于读写的缓冲区\n        size_t readSize;  \
  \      // 上一次读取的大小\n\n      readSize = read(inFd, buffer, sizeof(buffer));\n   \
  \   if (readSize < 0) {\n            fprintf(stderr, \"ERROR: Read error for file\
  \ %s\\n\", argv[1]);\n            exit(8);\n        }\n      if (readSize == 0)\n\
  \            break;\n\n      if (write(outFd, buffer, readSize) != readSize) {\n\
  \            fprintf(stderr, \"ERROR: Write error for %s\\n\", argv[2]);\n     \
  \       exit(8);\n        }\n    }\n  close(inFd);\n    close(outFd);\n    return\
  \ (0);\n}\n```\n\n# 列表 15-2：使用原始 I/O 将一个文件拷贝到另一个程序\n\n要使用列表 15-2 中的程序，我们必须指定一个输入文件和一个输出文件：\n\
  \n```\n$ ./copy input-file output-file\n```\n\n程序首先检查提供的参数是否正确 1。接下来，它打开输入文件 2。`open`\
  \ 函数的通用形式是 `file-descriptor` = `open(`filename`, `flags`)`。这些标志指示了如何打开文件。`O_RDONLY`\
  \ 标志以只读模式打开文件，而 `O_BINARY` 标志表示该文件是二进制文件。`O_BINARY` 标志很有意思（我将在下一节中解释它）。\n\n`open`\
  \ 命令返回一个被称为*文件描述符*的数字。如果发生错误，它会返回一个负数，这意味着程序的下一步是检查错误 3。\n\n接下，我们使用 `O_WRONLY`（只写）和\
  \ `O_CREAT`（如果需要则创建文件）标志打开输出文件 4。\n\n额外的 `0666` 参数意味着如果创建了文件，它将处于保护模式。这是一个八进制数，每个数字代表一组保护用户，每个比特位代表一种保护类型：\n\
  \n1. 4 读取\n2. 2 写入\n3. 1 执行\n\n这些数字的顺序如下：`<user>`, `<group>`, `<other>`。`0666` 参数告诉系统创建文件，使得用户可以读取和写入（`6`），使得与用户同一组的账户获得读写权限（`6`），并让其他人获得相同的读写权限（`6`）。\n\
  \n一旦文件打开打开，我们就进行拷贝 5。`read` 函数的通用形式为：\n\n```\nbytes_read = read(fd, buffer, size);\n\
  ```\n\n其中 `fd` 是文件描述符，`buffer` 是接收数据的缓冲区，`size` 是读取的最大字符数。该函数返回读取的字节数（`bytes read`）、`0`\
  \ 表示文件结束（EOF），或一个负数表示错误。\n\n读取后，我们检查是否有错误 6。然后我们检查是否已到达文件末尾 7。如果是，则数据传输完成。\n\n此时我们确信已经有了一些数据，因此我们将其写入\
  \ 8。`write` 函数的通用形式为：\n\n```\nbytes_written = write(fd, buffer, size);\n```\n\n\
  其中 `fd` 是文件描述符，`buffer` 是包含数据的缓冲区，`size` 是要写入的字符数。此函数返回写入的字节数或一个表示错误的负数。一旦写入完成，我们就关闭文件描述符\
  \ 9。\n\n## 使用二进制模式\n\n遗憾的是，文本文件在不同的操作系统之间是不通用的，因为不同的操作系统使用不同的字符来表示行尾。C 最初是为 Unix\
  \ 编写的，启发了 Linux。\n\n### ioctl\n\n除了读写，原始 I/O 系统提供了一个名为 `ioctl` 的函数用于执行 I/O 控制。它的通用形式是：\n\
  \n```\nresult = ioctl(fd, request, parameter);\n```\n\n其中 `fd` 是文件描述符，`request`\
  \ 是设备控制请求，`parameter` 是请求的参数。对于大多数请求，如果请求成功，函数返回 `0`，否则返回非零值（某些 `ioctl` 调用返回不同的值）。\n\
  \n你可以使用 `ioctl` 弹出可移动介质、倒带或快进磁带驱动、设置串口设备的速度和其他参数，以及为网络设备设置地址信息。由于 `ioctl` 规范是开放的，许多功能都被挤进了这个接口中。\n\
  \n## 总结\n\n原始 I/O 系统对你的 I/O 操作实际执行的内容提供了最佳控制。操作系统的编辑或干扰极少，但这种控制是有代价的。带缓冲 I/O 系统有助于限制你的错误，而原始\
  \ I/O 系统则不会。尽管如此，如果你知道自己在做什么，它可以是一项巨大的资产。\n\n## 编程题\n\n1. 编写一个接受一个参数的程序：运行程序的人员姓名。它会输出\
  \ `Hello` `<name>`。这是一个示例：\n\n\n\n\n\n```\n./hello Fred\nHello Fred\n\n./hello\n\
  Hello stranger\n```\n\n2. 编写一个程序，扫描参数列表。如果 `-d` 是一个参数，则打印 `Debug mode`。如果缺少 `-d`，则打印\
  \ `Release mode`。也添加其他选项。\n\n3. 测量列表 15-2 中拷贝程序复制大文件所需的时间。现在将缓冲区大小更改为 `1`。看这个程序运行得有多快。将缓冲区大小更改为\
  \ `16384`。看它运行得有多快。尝试使用 `17000`。注意：几乎每个磁盘都是以 `512` 字节为块进行读写的。这一事实如何解释你所看到的耗时？\n\n\
  4. 研究 `getopt` 函数，并使用它来解析你为问题 1 编写的命令行参数。\n\n# 16\n\n浮点数\n\n![](img/chapterart.png)\n\
  \n在书的这部分，我们将介绍一些 C 特性，这些特性在嵌入式编程中通常没用，但你可能会在大型机编程中遇到。浮点数在嵌入式编程中并不常见，因为许多低端处理器芯片无法处理它们。即使你有一个可以处理这些数字的\
  \ CPU，浮点运算也是缓慢、不精确且难以使用的。\n\n然而，由于你偶尔会在科学计算或 3D 图形程序中遇到这些数字，你应该应该做好准备。本章涵盖了浮点的基础知识、为什么浮点运算的计算如此昂贵，以及在使用过程中可能出现的某些错误。\n\
  \n## 什么是浮点数？\n\n`浮点数`是指小数点可以发生浮动的数字。它可以出现在数字的任意位置，例如 `1.0`、`0.1`、`0.0001` 或 `1000.0`。严格来说，小数点后并不要求有数字。例如，`1.0`\
  \ 和 `1.` 是同一个数字。但是，如果浮点数的在两侧都有数字，它们会更易读，意义也更明显。\n\n我们还可以使用指数计数法来写浮点数，例如 `1.0e33`，它代表数字\
  \ 1.0 × 10³³。（你可以使用大写的 `E` 或小写的 `e`，但小写版本更易读。）\n\n### 浮点类型\n\n在 C 语言中，浮点类型有 `float`、`double`\
  \ 和 `long double`。`double` 类型的精度和范围应该是 `float`（单精度）类型的两倍。`long double` 比其他两种类型具有更高的精度和范围。\n\
  \n除非你明确告诉 C 语言其他，否则所有浮点常量都是 `double` 类型。在数字末尾添加 `F` 后缀使其成为单精度 `float`，在末尾添加 `L`\
  \ 则使其成为 `long double`。\n\n浮点数需要小数点。请考虑以下代码：\n\n```\nfloat f1 = 1/3;\nfloat f2 =\
  \ 1.0 / 3.0;\n```\n\n第一次赋值并没有给 `f1` 赋值 `0.3333` 的值。相反，它给它赋值了 `0.0` 的值，因为 1 和 3 是整数。C\
  \ 执行了`整数除法`（结果为整数 0），将其提升为浮点数，然后进行赋值。第二行执行了我们想要的操作，并分配了值 `0.3333`。\n\n### 自动转换\n\
  \nC 会在背后为你进行一些自动转换。如果表达式中的一个操作数是浮点数，C 会自动将另一个操作数转换为浮点。这里有一个例子：\n\n```\nf = 1.0 /\
  \ 3;    // 格式不佳\n```\n\n在这种情况下，3 在除法操作之前会被转换为 `3.0`。这个例子被认为是不佳的格式，因为如果可能的话，你不希望混合整数和浮点常量。此外，如果你将一个浮点数赋值给一个整数，它会被转换为整数。\n\
  \n## 浮点数的问题\n\n浮点数的问题之一是它们是不精确的。例如，十进制浮点中的 1/3 是 `0.333333`。无论你使用多少位数字，它仍然是不精确的。与其展示二进制浮点数（计算机使用的）发生的情况，我们将使用十进制浮点数（人类熟悉的）。我们的十进制浮点中可能发生的所有问题在二进制版本中也都会发生。唯一的区别是，对于十进制浮点，例子更容易理解。\n\
  \n十进制浮点数是科学计数法的限制版本。这里有一个例子：\n\n```\n+1.234e+56\n```\n\n这个数字有一个符号（`+`）、一个分数（四位数字）和一个指数。这对于人类来说不是问题，但在计算机中表示这样的数字是很棘手的。\n\
  \n计算机使用类似的格式，只是指数和分数是二进制的。此外，它们打乱了顺序，并按照符号、指数、然后部分的顺序存储组件。更多细节，请参见 IEEE-754 浮点规范，目前几乎所有计算机都在使用它。\n\
  \n### 舍入误差\n\n你知道 1 + 1 等于 2，但 1/3 + 1/3 不是 2/3。让我们来看看如何工作的。首先，让我们把数字相加：\n\n```\n\
  +3.333e-01    // 我们表示法中的 1/3\n+3.333e-01    // 我们表示法中的 1/3\n+6.666e-01\n```\n\n\
  然而，2/3 是如下：\n\n```\n+6.667e-01\n```\n\n这是一个舍入误差的例子。在 `+3.333e-01` 和 1/3 之间存在微小的误差。由于我们正在使用的标准舍入规则，我们向下舍入。当我们计算\
  \ 2/3 时，我们得到 `6.67e-1`。在这种情况下，舍入规则导致我们向上舍入，所以虽然 1 + 1 = 2（整数），但 1/3 + 1/3 != 2/3（浮点数）。\n\
  \n我们可以使用一些技巧来尽可能地减少这里的舍入误差。大多数计算机使用的一种技巧是在计算过程中添加“保护位”。`保护位`是在进行计算时添加到数字上的额外数字。当计算出结果时，保护位被丢弃。\n\
  \n### 精度位数\n\n单精度浮点数（`float`）应该提供大约 6 位的精度，但并不总是如此。在之前的例子中，我们可能会说前三位是准确的。让我们计算 2/3\
  \ – 1/3 – 1/3：\n\n```\n+6.667e-01    // 2/3\n-3.333e-01    // 1/3\n-3.333e-01  \
  \  // 1/3\n+0.001e-01    // 结果规格化结果\n+1.000e-04    // 规格化结果\n```\n\n有多少位是正确的？第一位应该是\
  \ 0。（*规格化*意味着我们改变数字使得第一个位置有一个数字。所有的浮点数都是规格化的，除了少数边界情况。）\n\n浮点运算的设计存在许多问题。主要源于大多数数字是不精确的，这会导致计算错误和比较问题。\n\
  \n如果你只进行有限的浮点运算，它们可能不会困扰你，但你应该意识到它们。如果你进行大量的浮点运算，你应该查看名为*数值分析*的计算机分支，它致力于处理浮点问题以及如何从中获得稳定的结果，但这超出了本书的范围。\n\
  \n## 无穷大、NaN 和非规格数\n\nIEEE 浮点格式具有一些作为数字没有意义的位模式。例如，考虑数字 0*10⁵。由于 0 乘以任何数都是 0，在这种可以使用指数来指示特殊值。在本节中，我们将查看这些情况，以及浮点格式的边界情况。\n\
  \n让我们考虑以下表达式：\n\n```\nfloat f = 1.0 / 0.0;\n```\n\n如果这是整数，除以零将导致程序终止。然而，因为它是浮点数，结果是\
  \ `f` 被赋值为值 `INFINITY`（该常量定义在 `#include <math.h>` 头文件中）。\n\n同样，语句：\n\n```\nfloat\
  \ f = -1.0 / 0.0;\n```\n\n将 `f` 赋值为 `-INFINITY`。\n\n\n\n\n\n`INFINITY` 和 `-INFINITY`\
  \ 并不是浮点数（它们没有数字位，也没有小数点），但 IEEE 浮点规范定义了其中的几种特殊数字。由于你很可能会遇到这些类型的数字（特别是当你的程序包含 bug\
  \ 时），所以了解它们是什么是非常重要的。\n\n你可能还会遇到 `NaN`（代表 Not a Number，即“不是数字”），它是操作无法产生结果时生成的。这里有一个例子：\n\
  \n```\n#include <math.h>\nfloat f = sqrt(-1.0);\n```\n\n较新版本的 C 标准包含了复数，但 `sqrt`\
  \ 函数始终返回一个 `double` 类型，因此 `sqrt(-1.0)` 总是返回 `NaN`。\n\n现在，在我们的浮点方案中能够表示的最小数字是多少？你可能会倾向于说是下面这个：\n\
  \n```\n+1.0000e-99\n```\n\n分数 `1.0000` 是我们能创建的最小分数。（如果我们使用 `0.5000`，它会被归一化为 `5.0000`。）而\
  \ `99` 是我们用两个数字能得到的最小指数。\n\n然而，我们可以得到更小的：\n\n```\n+0.1000e-99   // -99 是指数的限制。\n\
  ```\n\n还有更小的：\n\n```\n+0.0001e-99\n```\n\n到目前为止，我们讨论的数字都是归一化的，这意味着第一位总有一个数字。而那些数字被认为是\
  \ `subnormal`（非归一化数）。我们还丢失了一些有效数字。对于数字 `+1.2345e-99`，我们有五个有效数字，但对于 `+0.0001e-99`\
  \ 只有一个。\n\n在 C 中，`isnormal` 宏在数字是归一化时返回 `true`，而 `issubnormal` 宏在数字是非归一化数字时返回 `true`。\n\
  \n如果你遇到了非归一化数字，你已经触及了 C 浮点数最黑暗的角落。到为止，我还没有见过任何真正使用过它们的程序，但它们确实存在，你应该意识到这一点。\n\n\
  ## 实现\n\n浮点数可以通过多种方式实现。让我们从我们一直在使用的 STM 芯片开始。实现非常简单：你无法使用浮点数。硬件不支持它，机器也没有足够的功率在软件中实现它。\n\
  \n低端芯片通常没有浮点单元。结果是浮点操作是通过使用软件库完成的，这是有成本的。通常，浮点操作耗时大约是整数操作的 1,000 倍。\n\n一旦你使用了更好的芯片，你会发现原生的浮点支持。这些操作仍然是昂贵的；浮点操作的时间大约是整数操作的\
  \ 10 倍。\n\n## 替代方案\n\n处理浮点数的最好方法之一是不使用它。如之前提到的，一个例子是在处理货币时。如果你将金钱存储为 `float`，舍入误差最终会导致你产生错误的总额。相反，如果你以分数为单位的整数存储货币，你就可以避免浮点数及其所有问题。\n\
  \n让我们定义一个小数点后位数固定为 2 位的简单定点数。这里是一些示例和一个整数实现：\n\n```\n定点数            实现\n12.34  \
  \        1234\n00.01             1\n12.00          1200\n```\n\n要相或或减定点数，只需加或减底层的实现即可：\n\
  \n```\n 12.34         1234\n+22.22        +2222\n------        -----\n 34.56   \
  \      2346\n\n 98.76         9876\n-11.11        -1111\n------         ------\n\
  \ 87.65         8765\n```\n\n要乘以定点数，将两个数字相乘并除以 100 以修正小数点的位置：\n\n```\n 12.00   \
  \        1200\nx 00.50         x 0050\n                  60000 (未修正)\n ------  \
  \        ------\nx 06.00            0600 (修正 100 后)\n```\n\n要除法，你执行相反的操作：除以底层数字并乘以一个修正因子。\n\
  \n列表 15-1 包含一个演示使用定点数的程序。\n\n**fixed.c`\n\n```\n/**\n * 演示定点数。\n */\n#include <stdio.h>\n\
  \n/**\n * 我们的定点数形式为\n * xxxxx.xx，小数点后有两个数字。\n */\ntypedef long int fixedPoint; \
  \           // 定点数据类型\nstatic const int FIXED_FACTOR = 100;    // 定点的调整因子\n/**\n\
  \ * 相加两个定点数。\n *\n * @param f1 第一个要加的数字\n * @param f2 第二个要加的数字\n * @returns f1+f2\n\
  \ */\nstatic inline fixedPoint fixedAdd(const fixedPoint f1, const fixedPoint f2)\n\
  {\n    return (f1+f2);\n}\n/**\n * 减去两个定点数。\n *\n * @param f1 第一个要减的数字\n * @param\
  \ f2 第二个要减的数字\n * @returns f1-f2\n */\nstatic inline fixedPoint fixedSubtract(const\
  \ fixedPoint f1, const fixedPoint f2)\n{\n    return (f1-f2);\n}\n/**\n * 乘以两个定点数。\n\
  \ *\n * @param f1 第一个要乘的数字\n * @param f2 第二个要乘的数字\n * @returns f1*f2\n */\nstatic\
  \ inline fixedPoint fixedMultiply(const fixedPoint f1, const fixedPoint f2)\n{\n\
  \    return (f1*f2)/FIXED_FACTOR;\n}\n/**\n * 除以两个定点数。\n *\n * @param f1 第一个要除的数字\n\
  \ * @param f2 第二个要除的数字\n * @returns f1/f2\n */\nstatic inline fixedPoint fixedDivide(const\
  \ fixedPoint f1, const fixedPoint f2)\n{\n    return (f1*FIXED_FACTOR)/f2;\n}\n\
  /**\n * 将定点数转换为浮点数（用于打印）。\n *\n * @param f1 定点数\n * @returns 浮点数\n */\nstatic inline\
  \ double fixedToFloat(const fixedPoint f1)\n{\n    return ((double)f1) / ((double)FIXED_FACTOR;\n\
  }\n\nint main()\n{\n    fixedPoint f1 = floatToFixed(1.2);  // 一个定点数\n    fixedPoint\
  \ f2 = floatToFixed(3.4);  // 另一个定点数\n\n    printf(\"f1 = %.2f\\n\", fixedToFloat(f1));\n\
  \    printf(\"f2 = %.2f\\n\", fixedToFloat(f2));\n    printf(\"f1+f2 = %.2f\\n\"\
  , fixedToFloat(fixedAdd(f1, f2)));\n    printf(\"f2-f1 = %.2f\\n\", fixedToFloat(fixedSubtract(f2,\
  \ f1)));\n    printf(\"f1*f2 = %.2f\\n\", fixedToFloat(fixedMultiply(f1, f2)));\n\
  \    printf(\"f2/f1 = %.2f\\n\", fixedToFloat(fixedDivide(f1, f2)));\n    return\
  \ (0);\n}\n```\n\n列表 16-1: 使用定点数\n\n这不是一个完美的实现。舍入误差发生在某些地方，例如乘法和除操作，但如果你真的研究定点数，你应该很容易发现它们。\n\
  \n## 总结\n\n理解浮点数的底层实现和局限性是重要的。如之前提到的，你不应该对货币使用浮点数。会计喜欢精确的数字，舍入误差会导致错误的答案。计算机科学中的数值分析分支处理分析计算是如何进行的并找出如何减少误差。本章向你展示了基础。如果你要大量使用浮点数，你应该具备数值分析的工作性知识。然而，使用浮点数的最好方法是完全避免它，因此请确保你理解浮点数的替代方案（如定点数）。\n\
  \nWikipedia 有一篇关于 IEEE 浮点标准的精彩文章，包含了许多在线参考资料的链接：[`en.wikipedia.org/wiki/IEEE_754`](https://en.wikipedia.org/wiki/IEEE_754)。\n\
  \n## 题\n\n1. 写一个计算角度 `sin` 的函数。为了得到准确的答案，你需要计算多少个因子？\n\n2. 使用 `float` 尽可能多地计算 pi\
  \ 值。如果你将数据类型更改为 `double`，你会得到多少位数？`long double` 又是多少？\n\n\n\n\n## 3. 假设你想找到浮点数小数部分的位数为。编写一个程序，从\
  \ `x = 1` 开始，不断将 `x` 除以 2 直到 `(1.0 + x = 1.0)` 为止。除以 2 的次数就是你的浮点运算中小数部分的位数。\n\n\
  # 17. 模块化编程\n\n![](img/chapterart.png)\n\n到目前为止，我们一直在处理较小、简单的单文件程序，如果你只是为书编写示例程序，这样没问题。但在现实世界中，你可能会遇到超过\
  \ 50 行代码的程序。\n\nLinux 内核拥有 33,000 个文件和 2800 万行代码（在你阅读这段文字时，这些数字还在增加）。如果不通过将代码划分为多个\
  \ `modules` 来组织它们，你就无法处理如此大量的信息。\n\n理想情况下，模块是一个单一文件，包含一组数据和函数，它能很好地完成一件事，并且与其他模块的交互最少。我们在本书的早期已经使用过\
  \ STM HAL 模块集合，其中包含 `HAL_Init` 函数的模块。它在内部做了大量工作，但我们永远看不到。我们看到的只是一个很好完成一件事的简单模块：它初始化让硬件工作所需的所有内容。\n\
  \n## 简单模块\n\n让我们创建一个使用两个文件的程序。主程序将命名为 `main.c`（参见列表 17-1），并调用 `func.c` 文件中的函数（参见列表\
  \ 17-2）。我们将使用 makefile（参见列表 17-3）将这两个文件编译成一个程序。\n\n**main.c**\n\n```\n/**\n * 演示\
  \ extern 的用法。\n * @note: 过于简化了内容。\n */\n#include <stdio.h>\n\nextern void funct(void);\
  \        // 一个外部函数\n\nint main()\n{\n    printf(\"In main()\\n\");\n    funct();\n\
  \    return (0);\n}\n```\n\n列表 17-1：主程序\n\n首先注意到的是 `main.c` 中对 `funct` 的声明。`extern`\
  \ 关键字告诉 C 该函数在另一个名为 `func.c` 的文件中。列表 17-2 包含了该文件。\n\n**func.c**\n\n```\n/**\n *\
  \ 函数模块演示\n */\n#include <stdio.h>\n/**\n * 演示函数\n */\nvoid funct(void)\n{\n    printf(\"\
  In funct()\\n\");\n}\n```\n\n列表 17-2：定义函数的文件\n\n`funct` 函数定义在 `func.c` 文件中，而列表 17-3\
  \ 中的 makefile 处理编译工作。\n\n```\nmain: main.c func.c\n      gcc -g -Wall -Wextra -o\
  \ main main.c func.c\n```\n\n列表 17-3：simple/Makefile\n\nmakefile 的第一行告诉 `make`，如果\
  \ `main.c` 或 `func.c` 发生变化，目标文件 `main` 必须重新构建。第二行告诉 `make`，当其中一个文件发生变化时，它应该编译这两个文件并使用它们生成程序。\n\
  \n在这个例子中，我们取了一个函数和一个主程序并将它们放在两个不同的文件中。然后我们告诉 `make` 让编译器将它们合并成一个程序。这是模块化编程的过度简化版本，但这些基本原理也用于具有更大、更多模块的更复杂程序。\n\
  \n### 简单模块的问题\n\n上一个示例存在几个问题。第一个问题是相同的信息重复两次。\n\n在 `main.c` 中，我们有：\n\n```\nextern\
  \ void funct(void);        // 一个外部函数\n```\n\n在 `func.c` 中，我们有：\n\n```\nvoid funct(void)\n\
  ```\n\n这意味着如果我们更改了其中一个文件，必须更改另一个。\n\n更糟糕的是，`C 不跨文件检查类型`，这意味着可能在两个不同的文件中存在以下行：\n\n\
  ```\n// File a.c\nextern uint32_t flag;    // 一个标志位\n```\n\n和：\n\n```\n// File b.c\n\
  int16_t flag;        // 一个标志位\n```\n\n假设文件 `a.c` 决定将 `flag` 设置为零。程序将向 `flag` 写入\
  \ 32 位零，但 `flag` 在文件 `b.c` 中定义为只有 16 位。实际发生的情况是 16 位进入 `flag`，另外 16 位进入其他地方。结果是你的程序会发生意料之外、令人惊讶且难以调试的问题。\n\
  \n可以在文件中声明一个 `extern` 变量，稍后不带 `extern` 声明它。C 会检查并确保 `extern` 定义中的类型与实际声明中的类型匹配：\n\
  \n```\n#include <stdint.h>\nextern uint32_t flag;     // 一个标志位\nint16_t flag;  \
  \           // 一个标志位\n```\n\n编译此代码将导致错误：\n\n```\n16.bad\n```\n\n\n\n\n第一行定义了一个名为\
  \ `CFLAGS` 的宏，这是用于编译 C 程序的特定名称。下一行定义了另一个名为 `OBJS` 的宏（这个名称并没有特殊之处），它包含了我们构建程序时所使用的对象列表。在这个示例中，我们将把\
  \ `main.c` 编译为 `main.o` 对象文件，并将 `func.c` 编译为 `func.o` 对象文件。\n\n我们在这里使用宏仅仅是为了避免在下一个规则\
  \ 1 中重复编写该列表，该规则告诉 `make` 从 `main.c` 和 `func.h` 创建 `main.o`。然而，紧随该规则之后并没有告诉 `make`\
  \ *如何* 执行此操作的规则。当 `make` 找不到某项操作的规则时，它会回退到其内置规则列表。当我们从 `.c` 文件创建一个 `.o`（或 `.*obj`）文件时，该内置规则是：\n\
  \n```\n$(CC) $(CFLAGS) -c file.c\n```\n\n其中 `CC` 是一个包含 C 编译器名称的宏（在本例中为 `cc`，它是 `gcc`\
  \ 的别名）。\n\n这个示例展示了一个简单的模块化程序，但当程序具有额外的模块时，这种设计模式同样适用。\n\n## 什么是良好的模块\n\n以下列表概述了创建良好模块的一些规则：\n\
  \n*   每个模块都应该有一个与模块同名的头文件。该文件应该包含该模块中公共类型、变量和函数的定义（不再包含其他内容）。\n*   每个模块都应该包含自己的头文件，以便\
  \ C 语言可以检查并确保头文件与实现相匹配。\n*   模块应该包含用于共同目的的代码，并且向外部世界暴露最少的信息。它们通过 `extern` 声明暴露的信息是全局的（整个程序可见），正如下一节所述，这有时会成为问题。\n\
  \n## 命名空间\n\nC 语言的一个问题是它没有命名空间。例如，在 C++ 中，你可以告诉编译器给定模块中的所有符号都属于 `db` 命名空间，因此你可以创建一个包含\
  \ `insert`、`delete` 和 `query` 等条目的模块，它们在他人看来分别是 `db::insert`、`db::delete` 和 `db::query`。\n\
  \n在 C 中，如果你定义了一个名为 `Init` 的公共函数，那么其他人在任何模块中都不能定义名为 `Init` 的函数。如果发生这种情况，链接器将报错关于重复符号。由于可能有多个需要初始化的项，这可能会成为一个问题。\n\
  \n大多数程序员通过在每个公共函数、类型或变量的名称上添加模块前缀来解决这个问题。你可以在自动添加到你的 Nucleo 项目的 HAL 库中看到这一点。例如，如列表\
  \ 17-8 所示，所有操作 UART 的函数都以 `UART_` 为开头。\n\n```\nHAL_StatusTypeDef UART_CheckIdleState(UART_HandleTypeDef\
  \ *huart);\nHAL_StatusTypeDef UART_SetConfig(UART_HandleTypeDef *huart);\nHAL_StatusTypeDef\
  \ UART_Transmit_IT(UART_HandleTypeDef *huart);\nHAL_StatusTypeDef UART_EndTransmit_IT(UART_HandleTypeDef\
  \ *huart);\nHAL_StatusTypeDef UART_Receive_IT(UART_HandleTypeDef *huart);\n```\n\
  \n列表 17-8：`stm32f0xx_hal_uart.h` 的摘录\n\n这里的关键在于，HAL 库中的公共符号以 `HAL_` 开头，这使得判断一个函数是否属于该库变得容易。它还确保你不会意外使用\
  \ HAL 库已经使用的名称。\n\n## 库\n\n当文件少于 20 个时，列出程序的每个文件并不糟糕。之后，它会变得有点繁琐，但在数量变得非常大之前它是是可以接受的。我们一直在编写的主机程序使用了标准的\
  \ C 库函数。C 库拥有超过 1600 个文件。幸运的是，我们在编译程序时不需要列出所有文件。\n\n标准 C 库是一个名为 `libc.a` 的文件，它在你的程序链接时自动加载。该库是简单归档格式的对象文件集合（因此扩展名为\
  \ `.a`）。\n\n让我们创建一个包含多个模块的自定义库，用于计算各种数字的平方。列表 17-9 显示了一个计算浮点数平方的函数。\n\n**square_float.c**\n\
  \n```\n#include \"square_float.h\"\n\n/**\n * 计算浮点数的平方。\n *\n * @param number 要平方的数字\n\
  \ * @returns 数字的平方\n */\nfloat square_float(const float number) {\n    return (number\
  \ * number);\n}\n```\n\n列表 17-9：计算浮点数平方的函数\n\n列表 17-10 是该模块的头文件。\n\n**square_float.h**\n\
  \n```\n#ifndef __SQUARE_FLOAT_H__\n#define __SQUARE_FLOAT_H__\nextern float square_float(const\
  \ float number);\n#endif // __SQUARE_FLOAT_H__\n```\n\n列表 17-10：`square_float.c`\
  \ 模块的头文件\n\n列表 17-11 是该模块的头文件。\n\n**square_float.h**\n\n```cpp\n#ifndef __SQUARE_FLOAT_H__\n\
  #define __SQUARE_FLOAT_H__\nextern float square_float(const float number);\n#endif\
  \ // __SQUARE_FLOAT_H__\n```\n等待，让我重新与提供的源文本结构对齐，以确保没有内容丢失。\n\n*（自纠：源文本在结尾处有一些重复/异常的顺序。我将严格遵循源文本序列，同时应用格式规则。）*\n\
  \n[content]\n第一行定义了一个名为 `CFLAGS` 的宏，这是用于编译 C 程序的特定名称。下一行定义了另一个名为 `OBJS` 的宏（这个名称并没有特殊之处），它包含了我们构建程序时所使用的对象列表。在这个示例中，我们将把\
  \ `main.c` 编译为 `main.o` 对象文件，并将 `func.c` 编译为 `func.o` 对象文件。\n\n我们在这里使用宏仅仅是为了避免在下一个规则\
  \ 1 中重复编写该列表，该规则告诉 `make` 从 `main.c` 和 `func.h` 创建 `main.o`。然而，紧随该规则之后并没有告诉 `make`\
  \ *如何* 执行此操作的规则。当 `make` 找不到某项操作的规则时，它会回退到其内置规则列表。当我们从 `.c` 文件创建一个 `.o`（或 `.*obj`）文件时，该内置规则是：\n\
  \n```\n$(CC) $(CFLAGS) -c file.c\n```\n\n其中 `CC` 是一个包含 C 编译器名称的宏（在本例中为 `cc`，它是 `gcc`\
  \ 的别名）。\n\n这个示例展示了一个简单的模块化程序，但当程序具有额外的模块时，这种设计模式同样适用。\n\n## 什么是良好的模块\n\n以下列表概述了创建良好模块的一些规则：\n\
  \n*   每个模块都应该有一个与模块同名的头文件。该文件应该包含该模块中公共类型、变量和函数的定义（不再包含其他内容）。\n*   每个模块都应该包含自己的头文件，以便\
  \ C 语言可以检查并确保头文件与实现相匹配。\n*   模块应该包含用于共同目的的代码，并且向外部世界暴露最少的信息。它们通过 `extern` 声明暴露的信息是全局的（整个程序可见），正如下一节所述，这有时会成为问题。\n\
  \n## 命名空间\n\nC 语言的一个问题是它没有命名空间。例如，在 C++ 中，你可以告诉编译器给定模块中的所有符号都属于 `db` 命名空间，因此你可以创建一个包含\
  \ `insert`、`delete` 和 `query` 等条目的模块，它们在他人看来分别是 `db::insert`、`db::delete` 和 `db::query`。\n\
  \n在 C 中，如果你定义了一个名为 `Init` 的公共函数，那么其他人在任何模块中都不能定义名为 `Init` 的函数。如果发生这种情况，链接器将报错关于重复符号。由于可能有多个需要初始化的项，这可能会成为一个问题。\n\
  \n大多数程序员通过在每个公共函数、类型或变量的名称上添加模块前缀来解决这个问题。你可以在自动添加到你的 Nucleo 项目的 HAL 库中看到这一点。例如，如列表\
  \ 17-8 所示，所有操作 UART 的函数都以 `UART_` 为开头。\n\n```\nHAL_StatusTypeDef UART_CheckIdleState(UART_HandleTypeDef\
  \ *huart);\nHAL_StatusTypeDef UART_SetConfig(UART_HandleTypeDef *huart);\nHAL_StatusTypeDef\
  \ UART_Transmit_IT(UART_HandleTypeDef *huart);\nHAL_StatusTypeDef UART_EndTransmit_IT(UART_HandleTypeDef\
  \ *huart);\nHAL_StatusTypeDef UART_Receive_IT(UART_HandleTypeDef *huart);\n```\n\
  \n列表 17-8：`stm32f0xx_hal_uart.h` 的摘录\n\n这里的关键在于，HAL 库中的公共符号以 `HAL_` 开头，这使得判断一个函数是否属于该库变得容易。它还确保你不会意外使用\
  \ HAL 库已经使用的名称。\n\n## 库\n\n当文件少于 20 个时，列出程序的每个文件并不糟糕。之后，它会变得有点繁琐，但在数量变得非常大之前它是是可以接受的。我们一直在编写的主机程序使用了标准的\
  \ C 库函数。C 库拥有超过 1600 个文件。幸运的是，我们在编译程序时不需要列出所有文件。\n\n标准 C 库是一个名为 `libc.a` 的文件，它在你的程序链接时自动加载。该库是简单归档格式的对象文件集合（因此扩展名为\
  \ `.a`）。\n\n让我们创建一个包含多个模块的自定义库，用于计算各种数字的平方。列表 17-9 显示了一个计算浮点数平方的函数。\n\n**square_float.c**\n\
  \n```\n#include \"square_float.h\"\n\n/**\n * 计算浮点数的平方。\n *\n * @param number 要平方的数字\n\
  \ * @returns 数字的平方\n */\nfloat square_float(const float number) {\n    return (number\
  \ * number);\n}\n```\n\n列表 17-9：计算浮点数平方的函数\n\n列表 17-10 是该模块的头文件。\n\n**square_float.h**\n\
  \n```\n#ifndef __SQUARE_FLOAT_H__\n#define __SQUARE_FLOAT_H__\nextern float square_float(const\
  \ float number);\n#endif // __SQUARE_FLOAT_H__\n```\n\n列表 17-10：`square_float.c`\
  \ 模块的头文件\n\n列表 17-11 是该模块的头文件。（等待，源文本在结尾处重复了 square_float.h，我将维持源文本流。）\n\n**square_float.h**\n\
  \n```\n#ifndef __SQUARE_FLOAT_H__\n#define __SQUARE_FLOAT_H__\nextern float square_float(const\
  \ float number);\n#endif // __SQUARE_FLOAT_H__\n```\n\n列表 17-10：`square_float.c`\
  \ 模块的头文件\n\n列表 17-11 定义了一个计算整数平方的函数。\n\n**square_int.c**\n\n```\n#include \"square_int.h\"\
  \n\n/**\n * 计算整数的平方。\n *\n * @param number 要平方的整数\n * @returns 数字的平方\n */\nint square_int(int\
  \ number) {\n    return (number * number);\n}\n```\n\n列表 17-11：计算整数平方的函数\n\n列表 17-12\
  \ 定义了头文件。\n\n**square_int.h**\n\n```\n#ifndef __SQUARE_INT_H__\n#define __SQUARE_INT_H__\n\
  extern int square_int(int number);\n#endif // __SQUARE_INT_H__\n```\n\n列表 17-12：`square_int.c`\
  \ 模块的头文件\n\n\n\n\n`make` 程序非常智能，具有更新归库组件的能力。例如，`libsquare.a` 的组件之一是 `square_int.o`。下面的规则将此变为该库的一个组件：\n\
  \n```\nlibsquare.a(square_int.o): square_int.o\n        ar crU libsquare.a square_int.o\n\
  ```\n\n第一行告诉 `make`，我们正在在 `libsquare.a` 库中创建或更新 `square_int.o` 组件。该组件依赖于 `square_int.o`\
  \ 对象文件。\n\n第二行是添加库的实际命令。`c` 选项告诉 `ar` 如果归库不存在则创建它。`r` 导致 `ar` 在归库中创建或替换 `square_int.o`\
  \ 组件。`U` 标记告诉 `ar` 以非确定性模式运行，该模式下它会在归库中存储文件的创建时间（我们将在本章稍后的部分讨论确定性与非确定性模式）。跟在该命令之后的是库的名称（`libsquare.a`）以及要添加或替换的组件名称（`square_int.o`）。链接器设置了命名约定。它必须以\
  \ `lib` 开头并以 `.a` （关于此命名约定稍后会有更多介绍）。\n\n接下来，通过以下指令，我们告诉 `make` 哪些组件构成了 `libsquare.a`\
  \ 库：\n\n```\nlibsquare.a: libsquare.a(square_int.o) \\\n        libsquare.a(square_float.o)\n\
  \nlibsquare.a(square_unsigned.o)\n        ranlib libsquare.a\n```\n\n前两行告诉 `make`\
  \ 用哪些组件来制作 `libsquare.a`。第三行 `ranlib libsquare.a` 告诉 `make` 在安装所有组件后对归库运行一个名为 `ranlib`\
  \ 的程序，为归库创建一个目录表。\n\n### ranlib 与库链接\n\n我们使用 `ranlib` 的原因是由于早期的一些链接器。假设我们有一个包含组件\
  \ `a.o`（定义了 `a_funct`）、`b.o`（定义了 `b_funct`）和 `c.o`（定义了 `c_funct`）的归库，且程序需要 `b.o`\
  \ 中的一个函数。链接器会打开归库并顺序遍历它，查看每个成员以确定它是否被需要。决策过程如下：\n\n1. 查看未定义符号列表（程序使用了 `b_funct`，所以它是未定义的）。\n\
  2. 打开归库。\n3. 查看 `a.o`。它定义了需要的符号吗？没有。不要加载它。\n4. 查看 `b.o`。它定义了需要的符号吗？是的。加载它。\n5. 查看\
  \ `c.o`。它定义了需要的符号吗？没有。不要加载它。\n\n现在假设 `b.o` 需要 `a_funct` 函数。链接器不会返回并重新检查归库。它将继续向下并只查看\
  \ `c.o`。由于 `c.o` 没有定义该符号，它将不会被加载。链接器到达归库的末尾并终止，因为它没有找到满足 `a_funct` 需要的对象文件。\n\n\
  由于链接器的工作方式，有时你可能指定两次或三次同一个库。为了解决这个问题，归库中添加了目录表，以便组件可以以随机顺序加载（因此 `ranlib` 名称的由来）。\n\
  \n现在加载组件的算法如下：\n\n1. 查看未定义符号列表（程序使用了 `b_funct`，所以它是未定义的）。\n2. 打开归库。\n3. 我们是否有一个在目录表中的未定义符号？\n\
  4. 如果有，加载它。\n5. 重复此过程，直到我们没有更多可以通过此库满足的符号。\n\n这个过程解决了顺序问题，因为目录表使所有内容都可访问。\n\n下面的命令实际上将库与我们的程序链接：\n\
  \n```\nsquare: square.o libsquare.a\n        $(CC) $(CFLAGS) -o square square.o\
  \ -L. -lsquare\n```\n\n`-L.` 标记告诉链接器在当前目录（`.`）中搜索库文件。否则，只会搜索系统库目录。库本身通过 `-lsquare`\
  \ 指令指定。链接器寻找名为 `libsquare.a` 的库，首先在当前目录（因为有 `-L.`），然后在系统目录中。\n\n列表 17-17 显示了该项目的完整\
  \ Makefile。\n\n```\nCFLAGS=-g -Wall -Wextra\n\nall: square\n\nsquare: square.o libsquare.a\n\
  \        $(CC) $(CFLAGS) -o square square.o -L. -lsquare\n\nlibsquare.a: libsquare.a(square_int.o)\
  \ \\\n        libsquare.a(square_float.o) libsquare.a(square_unsigned.o)\n     \
  \   ranlib libsquare.a\n\nlibsquare.a(square_int.o): square_int.o\n       ar crU\
  \ libsquare.a square_int.o\n\nlibsquare.a(square_float.o): square_float.o\n    \
  \    ar crU libsquare.a square_float.o\n\nlibsquare.a(square_unsigned.o): square_unsigned.o\n\
  \        ar crU libsquare.a square_unsigned.o\n```\n\n### 确定性与非确定性\n\n我们使用 `ranlib`\
