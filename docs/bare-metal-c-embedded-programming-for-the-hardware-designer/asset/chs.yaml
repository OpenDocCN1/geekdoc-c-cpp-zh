  \ 2 章中做的那样运行它。程序应该会在 Console（控制台）窗口的底部显示其输出（参见 图 4-1）。\n\n![f04001](img/f04001.png)\n\
  \n图 4-1：运行结果\n\n如你所见，程序应该打印它执行的每次计算的结果。\n\n例如，使用 `int` 作为类型将指示该变量是一个整数。准确地说，它是计算机最容易处理的整数类型。我们将在本章的晚些部分介绍其他类型的整数。\n\
  \n变量名以字母开头，并且只能包含字母、数字和下划线。STM32 固件库使用驼峰命名法（camel case），即名称中的单词首字母大写，因此为了兼容性，我们在整本书中都统一使用驼峰命名法：\n\
  \n```\nstartTime   currentStation  area\n```\n\n虽然名称可以下划线开头，但此类名称被视为系统函数的保留字，不应在普通编程中使用。此外，永远不要使用\
  \ `l`（小写 `L`）或 `O`（大写 `O`）作为变量名。如果理由不明显，请考虑以下代码：\n\n```\nO = l + 1 + O * 0;  //\
  \ 这种编程会让你丢命。\n```\n\n从技术上讲，你可以从变量声明中省略注释。然而，包含注释可以让你之后维护代码的人了解你为什么要声明该变量以及它的作用是什么。换句话说，这有助于你为代码创建一个微型字典或术语表。\n\
  \n### 给变量赋值\n\n一旦我们声明了变量，就可以用赋值语句为它分配一个值。赋值语句的一般形式如下：\n\n```\nvariable = expression;\n\
  ```\n\n这告诉计算机计算表达式的值并将其存储在变量中。变量可以用于任何我们放置整数的地方，例如 `printf` 语句。下面的程序演示了变量的声明、赋值和使用：\n\
  \n`var.c`\n\n```\n/*  \n * 一个计算两个变量之和的程序\n */  \n#include <stdio.h>\n\nint main()\n\
  {\n    int aNumber;        // 某个数字\n    int otherNumber;    // 另一个数字\n\n    aNumber\
  \ = 5;\n    otherNumber = 7;\n### 初始化变量\n\n当你在程序中声明变量时，你告诉 C 编译器为整数 (`int`）分配内存空间。但在为它指定值之前，该变量被视为`uninitialized`（未初始）；它可能包含上一次使用内存时留下的任何随机垃圾值。\n\
  \n为了在我们刚刚编写的程序查看这一效果，请打开调试器并在单步执行程序时查看 Variables（变量）面板。\n\n### 整数的大小和表示\n\nC 语言除了\
  \ `int` 之外，还有其他整数类型用于表示大小。\n\n随着计算机的演进，人们发现组织内存最有效的方法是以每 8 位为一组，称为 `bytes`（字节）。计算机允许你将字节组合成\
  \ 2 字节、4 字节和 8 字节的值，而 `int` 类型告诉 C 使用系统最有效的字节数来定义整数。我们芯片的编译器 ARM Cortex-M0 CPU 使用\
  \ 32 位整数。\n\n为了让程序更加高效，C 允许你选择所需的整数类型。例如，你可能希望存储 0 到 100 之间的数字。你不需要一个全尺寸的整数，因此可以使用\
  \ `short int`，它类似于整数但占空间更小。（从技术上讲，C 标准只规定 `short int` 不大于常规 `int`，但在大多数实现中它更小。）\n\
  \n以下声明了一个 `short int`：\n\n```\nshort int shortNumber;  // 比普通短的整数\n```\n\n一个比普通长的整数可以使用\
  \ `long` 修饰符来声明：\n\n```\nlong int longNumber;    // 比普通长的整数\n```\n\n当计算机获得了高效处理更长数字的能力时，人们需要一种比\
  \ `long` 包含更多位的整数类型。结果就是（有些愚蠢的）`long long` 整数：\n\n```\nlong long int veryLongNumber;\
  \   // 更长的整数\n```\n\nC 标准没有定义每种整数类型的大小。它们的大小可能完全相同，这样你仍然有一个标准的编译器。然而，它保证了以下内容：\n\
  \n```\nsizeof(short int) <= sizeof(int) <= sizeof(long int) <= sizeof(long long\
  \ int)\n```\n\n`sizeof` 运算符返回存储变量或类型所需的字节数。让我们通过一个短程序打印我们系统上各种整数类型的大小，看看每个类型占用多少空间：\n\
  \n`size.c`\n\n#include <stdio.h>\n\nint main()\n{\n    short int aShortInt;    \
  \    // Short integer\n    int aInteger;               // Default integer\n    long\
  \ int aLongInt;          // Long integer\n    long long int aLongLongInt; // Long\
  \ long integer\n\n    printf(\"Size of (short int) = %ld (bytes) %ld bits\\n\",\n\
  \            sizeof(aShortInt), sizeof(aShortInt)*8);\n\n    printf(\"Size of (int)\
  \ = %ld (bytes) %ld bits\\n\",\n            sizeof(aInteger), sizeof(aInteger)*8);\n\
  \n    printf(\"Size of (long int) = %ld (bytes) %ld bits\\n\",\n            sizeof(aLongInt),\
  \ sizeof(aLongInt)*8);\n\n    printf(\"Size of (long long int) = %ld (bytes) %ld\
  \ bits\\n\",\n            sizeof(aLongLongInt), sizeof(aLongLongInt)*8);\n\n   \
  \ return (0);\n}\n```\n\n早些，我们使用 `%d` 来打印数字。在这个程序中，我们使用 `%ld`，因为 `sizeof` 返回的是 `long\
  \ int`，而 `%ld` 用于打印 `long int` 数字。\n\n该程序在我的系统上输出了以下输出：\n\n```\nSize of (short int)\
  \ = 2 (bytes) 16 bits\nSize of (int) = 4 (bytes) 32 bits\nSize of (long int) = 8\
  \ (bytes) 64 bits\nSize of (long long int) = 8 (bytes) 64 bits\n```\n\n从这里我们可以看到，`long\
  \ int` 的大小与 `long long int` 相同。然而，这仅适用于我系统上的这个编译器（运行在 x86_64 处理器上的 GNU GCC）。不同的编译器可能有不同的实现方式。\n\
  \n## 数字表示\n\n假设我们有五头牛。在英语中，我们可以将这个数字表示为“five”、“5”或“V”。同样，在 C 中，你可以使用四种数字表示法：十进制、二进制、八进制和十六进制。\n\
  \n人们通常使用十进制（十进制制），但计算机以二进制（二进制制）存储数字，因为制造二进制电路既廉价又容易。例如，我们可能使用十进制编写以下赋值语句：\n\n```\n\
  aNumber = 5;\n```\n\n同样的语句可以用二进制这样写：\n\n```\naNumber = 0b101;    // 5 的二进制表示\n```\n\
  \n最后，我们可以使用十六进制（十六进制制）：\n\n```\naNumber = 0x5;  // 5 的十六进制表示\n```\n\n二进制数占据的空间很大，所以为了更加紧凑，我们经常在编程中使用十六进制表示法来表示精确的二进制值。每个十六进制位对应四个二进制位，如表\
  \ 4-2 所示。\n\n| Binary | Hex | Binary | Hex |\n| --- | --- | --- | --- |\n| 0000\
  \ | 0 | 1000 | 8 |\n| 0001 | 1 | 1001 | 9 |\n| 0010 | 2 | 1010 | A |\n| 0011 | 3\
  \ | 1011 | B |\n| 0100 | 4 | 1100 | C |\n| 0101 | 5 | 1101 | D |\n| 0110 | 6 | 1110\
  \ | E |\n| 0111 | 7 | 1111 | F |\n\n表 4-2：二进制与十六进制之间的转换\n\n如你所示，1111 1100b 等于十六进制值\
  \ `0xFC`。同样，`0xA5` 是 1010 0101b。使用此表，你可以快速地在二进制和十六进制之间进行转换。\n\n虽然计算机将数字存储为一组位，但这些位的含义完全取决于我们。例如，如果把位模式\
  \ 0000 0101 解释为二进制数，它可以代表 5。但 0000 0101 也可以代表 10,005。我是怎么得到那个数字的？我胡编的。在这种情况下，我随意挑选了一个奇怪的值。其他的任意含义可能包括“May”、字母“E”以及“LED0+LED2”。\n\
  \n一种不那么常见但很有用的位模式映射见表 4-3。\n\n| Bit pattern | Meaning |\n| --- | --- |\n| 000 |\
  \ 0 |\n| 001 | 1 |\n| 011 | 2 |\n| 010 | 3 |\n| 110 | 4 |\n| 111 | 5 |\n| 101 |\
  \ 6 |\n| 100 | 7 |\n\n表 4-3：位模式到数字的映射\n\n乍一看，它看起来是随机的。但如果你仔细观察，你会发现每个数字之间只有一个位发生了变化。这使其非常适合编码器（见图\
  \ 4-2）。事实上，这是一种名为 `Gray code`（盖码）的标准位模式。\n\n图 4-2：格雷码\n\n记住，在你告诉它之前，C 并不知道如何解释位模式。\n\
  \n## 标准整数\n\n整数类型的一个大问题是标准中没有地方告诉你它们有多大，只有相对大小。如果你想向 32 位设备写入数据，你必须猜测哪种 `int` 类型。猜测和编程并不兼容，因此人们发明了一种名为条件编译的技术，来定义具有精确位数的类型：`int8_t`、`int16_t`、`int32_t`\
  \ 和 `int64_t`。与其他好主意一样，这些新类型被广泛使用，C 标准将它们加入了 `stdint` 库。它们不是内置类型，所以你需要通过以下语句包含它们：\n\
  \n * Demonstrate different sizes of integers.\n */\n#include <stdio.h>\n#include\
  \ <stdint.h>\n\nint main()\n{\n    int8_t has8bits = 0x12;               // 8 位整数\n\
  \    int16_t has16bits = 0x1234;             // 16 位整数\n    int32_t has32bits =\
  \ 0x12345678;         // 32 位整数\n    int64_t has64bits = 0x12345678abcdef; // 64\
  \ 位整数\n\n    printf(\" 8 bits %x\\n\", has8bits);\n    printf(\"16 bits %x\\n\"\
  , has16bits);\n    printf(\"32 bits %x\\n\", has32bits);\n    printf(\"64 bits %lx\\\
  n\", has64bits);\n    return (0);\n}\n```\n\nListing 4-1：整数演示\n\n在这个程序中，我们使用格式字符\
  \ `%x` 来打印十六进制数字。具体来说，`%x` 格式打印 `int`，但由于底层的“参数提升”（argument promotion），我们也可以将其用于\
  \ `int8_t`、`int16_t` 和 `int32_t`。C 是一种有点懒的语言。当处理器是 32 位时，向 `printf` 传递 16 位整数，C\
  \ 会将 `int16_t` 转换或提升为 `int32_t`，这让我们对 `int16_t` 也可以使用 `%x`。同样，我们可以对 `int8_t` 使用\
  \ `%x`，因为它同样会被提升为 `int32_t`。（严格来说，C 标准规定可能会发生提升，并没有要求。这段代码在我们的 x86_64 机器上运行，但不可移植。）\n\
  \n现在来看 `int64_t`。如果 C 将其改为 `int` (`int32_t`)，我们将丢失一半数字。C 对此无能，它将 `int64_t` 参数作为\
  \ `int64_t` 参数传递。格式必须从 `%x` (`int`) 更改为 `%lx` (`int64_t`) 才能打印更大的值。\n\n读者的思考：尝试将示例中的\
  \ `%lx` 改为 `%x`，看看得到什么。\n\n## 无符号整数类型\n\n在上节中，我们使用了带符号整数类型，它们可以是正也可以负。无符号整数类型只存储正值，并且比带符号类型更简单。标准的无符号类型有\
  \ `uint8_t`、`uint16_t`、`uint32_t` 和 `uint64_t`。`uint8_t` 类型是一个无符号 8 位整数，可以存储从 0\
  \ (0000 0000b) 到 255 (1111 1111b) 的数字。无符号整数类型的范围如表 4-4 所示。\n\n| Type | Low | High\
  \ |\n| --- | --- | --- |\n| uint8_t | 0000 0000 (0) | 1111 1111 (255) |\n| uint16_t\
  \ | 0000 0000 0000 0000 (0) | 1111 1111 1111 1111 (65,535) |\n| uint32_t | 0000\
  \ 0000 0000 0000 0000 0000 0000 0000 (0) | 1111 1111 1111 1111 1111 1111 1111 1111\
  \ (4,294,967,295) |\n| uint64_t | 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000\
  \ 0000 0000 0000 0000 0000 0000 (0) | 1111 1111 1111 1111 1111 1111 1111 1111 1111\
  \ 1111 1111 1111 1111 1111 1111 1111 (18,446,744,073,709,551,615) |\n\n表 4-4：无符号整数类型范围\n\
  \n\n\n\n这是一个使用 `uint8_t` 变量的简单示例。此程序在不改变 `smallNumber` 值的情况下，打印了它的三种不同的表示形式：\n\n\
  ```c\n/*\n * uint8_t 的简单用法\n */\n\n#include <stdio.h>\n#include <stdint.h>\n\nint\
  \ main()\n{\n    uint8_t smallNumber = 0x12; // 一个小数字\n\n    printf(\"0x12 is %u\
  \ decimal\\n\", smallNumber);\n    printf(\"0x12 is %o octal\\n\", smallNumber);\n\
  \    printf(\"0x12 is %x hex\\n\", smallNumber);\n    return(0);\n}\n```\n\n`%u\
  \ printf` 说明符告诉 C 我们想要打印一个无符号 `int`（默认的无符号整数类型）。我们使用格式规范 `%o` 以八进制形式打印，使用 `%x` 以十六进制形式打印。\n\
  \n该程序的输出如下：\n\n```\n0x12 is 18 decimal\n0x12 is 22 octal\n/*\n * 看看超过最大值会发生什么。\n\
  \ * (包含一个错误)\n */\n\n#include <stdio.h>\n#include <stdint.h>\n\nint main()\n{\n\
  \    // 非常小的整数，设置为最大值\n    uint8_t smallNumber = 255;\n\n    printf(\"255+1 is %u\\\
  n\", smallNumber + 1);\n    return (0);\n}\n```\n\n根据这个程序，在 8 位无符号整数 255 上加 1 的结果是\
  \ 256，但数字 256 在二进制中是 `0b1 0000 0000`，或者 `0x100`，这无法放入 8 位中。我们要么我们扭曲了宇宙法则，要么就是我们的程序出了问题。\n\
  \n为了理解发生了什么，让我们看看第打印语句 1。`smallNumber` 的类型是 `uint8_t`；然而，在大多数 32 位计算机上，很难（甚至不可能）加上两个\
  \ 8 位整数。由于计算机的构造方式，你必须加上两个 32 位数。因此，为了计算一个表达式，C 编译器执行了以下操作：\n\n1. 将 `shortNumber`\
  \ 转换为 `unit32_t` 值\n2. 在结果上加 `1`（类型为 `uint32_t`）\n3. 将结果 (`256`) 作为 `uint32_t` 打印\n\
  \n结果是一个可以容纳值 256 的 `uint32_t`，而打印出来的它。所以，我们并没有导致 8 位溢出（这正是我们想要演示的）。相反，我们演示了自动提升（automatic\
  \ promotion），这是我们在在本章稍早之前讨论过的。为了得到我们想要的结果，我们需要对程序进行微调，将结果存储在 `uint8_t` 值中：\n\n```c\n\
  /*\n * 看看超过最大值会发生什么。\n */\n\n#include <stdio.h>\n#include <stdint.h>\n\nint main()\n\
  {\n    uint8_t smallNumber;\n    uint8_t result;\n\n    smallNumber = 255;\n\n\n\
  \n位通常从 7 到 0 编号，7 是最左边的位，即最高位。假设我们的 LED 寄存器设置如下：\n\n| Bit 7 | Bit 6 | Bit 5 | Bit\
  \ 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- |\n| Out 7 | Out 6 | Out 5 | Out 4 | Out 3 | Out 2 | Out 1 | LED\
  \ 0 |\n\n假设我们想开启 LED #0。由于每个 LED 都是关闭的，我们的寄存器中值为 `0000 0000`。为了开启 LED #0，我们需要将最后一位翻转为\
  \ `1`。为了做到，我们只需要向寄存器加 `1` 得到 `0000 0001`。此时 LED #0 开启，其他所有 LED 保持关闭。\n\n但如果 LED\
  \ 已经是开启状态呢？那么我们的寄存器将包含 `0000 0001`，当我们加上 `1` 时，将得到 `2`，在二进制中为 `0000 0010`。因此，LED\
  \ #0 关闭而 OUT #1 开启。这不是我们想要的。\n\n这里的问题在于，我们一直使用的算术运算符将我们的 8 位整数视为一个单一整数。而*位运算符*则将数字视为一组单独的位，每个位都可以独立地进行开启、关闭和测试。\n\
  \n### OR\n\n第一个位运算符是 `OR`（`|`）。单比特版本的 `OR` 在其两个操作数中有一个被设置为 `1` 时会给出一个真（或 `1`）的结果。我将通过*真表*来展示它的运行方式。它就像你一年级用过的加法表和乘法表，只不过显示的是\
  \ `OR` 等布尔运算符的操作。\n\n`OR` 的真表所示：\n\n| OR (`|`) | 0 | 1 |\n| :--- | :--- | :--- |\n\
  | 0 | 0 | 1 |\n| 1 | 1 | 1 |\n\n`OR` 是一个位运算符，这意味着要对两个 8 位值进行“或”操作，你需要对这两个值中的每一对位执行该操作。例如：\n\
  \n```\n 0010 0101\n| 0000 1001\n  ---------\n  0010 1101\n```\n\n要设置位 0（即开启 LED\
  \ #0），我们使用以下 C 代码：\n\n```\nledRegister = ledRegister | 0x01;\n```\n\n或者，我们可以使用以下简写运算符：\n\
  \n```\nledRegister |= 0x01;\n```\n\n### AND\n\n`AND`（`&`）运算符只有在当它的两个操作数都为真时才返回真（`1`）。以下是\
  \ `AND` 真表：\n\n| AND (`&`) | 0 | 1 |\n| :--- | :--- | :--- |\n| 0 | 0 | 0 |\n| 1\
  \ | 0 | 1 |\n\n像 `OR` 一样，`AND` 运算符作用于每一对位：\n\n```\n 0010 0101\n& 0000 1001\n  ---------\n\
  \  0000 0001\n```\n\n要关闭 LED #0，我们可以通过以下操作将位 0 设置为 `0`：\n\n```\nledRegister &= 0b1111110;\n\
  ```\n\n此命令将我们的寄存器与一个位模式进行“与”运算，该模式除位 0 外的所有位都已设置，因此位 0 将清除而所有其他位保持不变。（位与 1 进行与运算。）\n\
  \n### NOT\n\n*取反*或*NOT*运算符（`~`）接受一个操作数并将其反转。因此，如果该位是 `0`，它就会变成 `1`；如果是 `1`，它就会变成\
  \ `0`。`NOT`运算符的真表相当简单：\n\n| | 0 | 1 |\n| :--- | :--- | :--- |\n| `~` | 1 | 0 |\n\
  \n下面的示例演示了这个运算符是如何工作的：\n\n```\n~ 0000 0001\n  ---------\n  1111 1110\n```\n\n使用我们目前涵盖过的位运算符，我们已经可以编写代码来关闭所有寄存器，然后开启和关闭\
  \ LED：\n\n```\n// 等待一会儿。\nsleep(5);\n\n// 关闭 LED。\nledRegister &= ~LED_BIT;\n```\n\
  \n这正是第 3 章中闪烁程序所做的，不同的是库隐藏了这些细节。\n\n### Exclusive OR\n\n位运算符*异异或*（`^`）的结果在仅其中一个位被设置时为真，而不是两个位都设置。以下是它的真表：\n\
  \n| Exclusive OR (`^`) | 0 | 1 |\n| :--- | :--- | :--- |\n| 0 | 0 | 1 |\n| 1 | 1\
  \ | 0 |\n\n为了查看它是如何工作的，请考虑以下示例：\n\n```\n 0010 0101\n^ 0000 1001\n  ---------\n \
  \ 0010 1100\n```\n\n如果我们想反转 `ledRegister` 中的 LED 值，`异或` 非常有用，例如：\n\n```\nledRegister\
  \ ^= LED_BIT; // 切换 LED。\n```\n\n反转 LED 会使其闪烁。\n\n### Shifting\n\n*左移*运算符（`<<`）将变量的内容向左移动指定的位数，并在空位补零。例如：\n\
  \n```\nuint8_t result = 0xA5 << 2\n```\n\n这会导致计算机将位向左移动，使得：\n\n```\n1010 0101\n\
  ```\n\n变为：\n\n```\n10010100\n```\n\n*右移*运算符（`>>`）稍微复杂。对于无符号数，它的工作方式类似于左移，只是向右移动位。再次，计算机会在空位补零。因此，`uint8_t\
  \ result = 0xA5 >> 2;` 计算结果为：\n\n```\n1010 0101\n```\n\n变为：\n\n```\n00101001\n```\n\
  \n但当符号数时，计算机使用符号位来填充空位。例如，考虑以下操作：\n\n```\nint8_t result = 0xA5 >> 2; // 注意 \"u\"\
  \n```\n\n结果为：\n\n```\n1010 0101\n```\n\n变为：\n\n```\n11101001\n```\n\n因为是符号数右移，右侧的空位填充的是符号位。\n\
  \n## 定义位的含义\n\n硬件人员喜欢用位来定义事物。因为当信号从芯片输出时，它们来自如 `GPIO-3` 这样的单引脚。由于单个引脚的信号高（`1`）或低（`0`），你可以用一个位来表示它。但当程序员看到信号时，它已经与其他许多位打包成一个`8\
  \ 位、16 位或 32 位`寄存器了。因此，我们需要一种方法将硬件语言（如“位 3”）翻译成软件语言（如“0x04”）。使用良好的位移运算符对这种翻译非常有帮助。\n\
  \n例如，假设我们有一个灯板，其硬件规格如下：\n1. `MF` (位 7) 主故障：当任何其他故障灯亮起时。\n2. `DF` (位 6) 数据故障：输入数据不一致或损坏。\n\
  3. `OL` (位 5) 油低：蓄能器中的油位低。\n4. `OP` (位 4) 油压：蓄能器油压低。\n5. `PW` (位 3) 故障：主电源故障。\n\
  6. `PF` (位 2) 位置故障：位置框碰到了限位开关且不在位置。\n7. `AP` (位 1) 压力：空气压缩故障。\n8. `CF` (位 0) 清洁过滤器：空气过滤器需要清洗。\n\
  \n每个位都连接到一个灯。灯电路连接到我们控制器的 GPIO 引脚上。例如，如果我们设置 GPIO 设备的位 0，“清洁过滤器”灯就会开启：\n\n```\n\
  ledRegister = 1; // 开启清洁过滤器。\n                  // (关闭其他。)\n```\n\n尽管如此，要记住哪个数字对应哪个位仍然不容易。位\
  \ 0 是第一个值，位 1 是第二个值，以此此类推。快速：哪个位代表第 6 个值？有一种很好的方法可以变得更容易。位 0 持值 1，等同于表达式 `(1 <<\
  \ 0)`。位 1 是值 2，即 `(1 << 1)`，位 3 是 `(1 << 3)`，以此此类推。从这里很容易看出位 5 是 `(1 << 5)`。使用这个系统，我们可以定义常量表示每个位：\n\
  \n```\nconst uint8_t MASTER_FAIL       = (1 << 7);\nconst uint8_t DATA_FAIL    \
  \     = (1 << 6);\nconst uint8_t OIL_LOW           = (1 << 5);\nconst uint8_t OIL_PRESSURE\
  \      = (1 << 4);\nconst uint8_t POWER_FAILURE     = (1 << 3);\nconst uint8_t POSITION_FAULT\
  \    = (1 << 2);\nconst uint8_t AIR_PRESSURE      = (1 << 1);\nconst uint8_t CLEAN_FILTER\
  \      = (1 << 0);\n```\n\n让我们再次开启 `CLEAN_FILTER` LED 并保持其他灯不变，这次使用我们的新常量来引用相关的位：\n\
  \n```\nledRegister |= CLEAN_FILTER; // 开启清洁过滤器。\n```\n\n\n\n\n\n请注意，这里还使用了在本章早期介绍的\
  \ `|=` 赋值运算符。\n\n### 一次设置两个位的值\n\n现在假设我们想要设置 `POWER_FAILURE` 和 `MASTER_FAIL` 的值。我们可以通过以下语句来实现：\n\
  \n```\nledRegister |= MASTER_FAIL | POWER_FAILURE;\n```\n\n由于 `MASTER_FAIL` 在第 7\
  \ 位的值为 1，且任何非零值都会导致结果为 1，因此面板上的 `MASTER_FAIL` 位将被设置为 1。\n\n### 关闭一个位\n\n我们使用以下模式来关闭一个位：\n\
  \n```\nbitSet &= ~bitToTurnOff;\n```\n\n为了理解此操作是如何运作的，让我们通过以下语句详细分析一遍：\n\n```\n\
  ledRegister &= ~(MASTER_FAIL | POWER_FAILURE);\n```\n\n让我们先从 `(MASTER_FAIL | POWER_FAIL)`\
  \ 的结果开始：\n\n```\n1000 1000 (MASTER_FAIL | POWER_FAIL)\n```\n\n现在我们应用取反或非 NOT（`~`）运算符：\n\
  \n```\n0111 0111 ~(MASTER_FAIL|POWER_FAIL)\n```\n\n接下来，我们查看 `ledRegister` 的现有值。在本示例中，它设置了\
  \ `MASTER_FAIL` 和 `CLEAN_FILTER`。\n\n```\n1000 0001 (ledRegister: MASTER_FAIL, CLEAN_FILTER)\n\
  ```\n\n现在我们将结果进行“按与”（AND）操作：\n\n```\n0111 0111 ~(MASTER_FAIL|POWER_FAIL)\n1000 0001\
  \ (ledRegister: MASTER_FAIL, CLEAN_FILTER)\nResult:  0000 0001 (CLEAN_FILTER)\n\
  ```\n\n### 检查位的值\n#include <stdint.h>\n\n//< 主故障 -- 显示是否存在任何其他错误。\nconst uint8_t\
  \ MASTER_FAIL       = (1 << 7);\n//< 表示收到了不一致的数据。\nconst uint8_t DATA_FAIL     \
  \    = (1 << 6);\n//< 油箱水位低。\nconst uint8_t OIL_LOW           = (1 << 5);\n//< 油压过低。\n\
  const uint8_t OIL_PRESSURE      = (1 << 4);\n//< 主电源故障。\nconst uint8_t POWER_FAILURE\
  \     = (1 << 3);\n//< 我们告诉位置移动到 x，但它没有移动。\nconst uint8_t POSITION_FAULT    = (1\
  \ << 2);\n//< 空压缩机停止。\nconst uint8_t AIR_PRESSURE      = (1 << 1);\n//< 空滤器寿命结束。\n\
  const uint8_t CLEAN_FILTER      = (1 << 0);\n/*!\n * 打印位的状态\n * (替代真实的 LCD 面板)\n\
  \ *\n * \\param ledRegister 包含 LED 位的寄存器\n */\nstatic void printLED(const uint8_t\
  \ ledRegister)\n{\n    printf(\"Leds: \");\n    if ((MASTER_FAIL & ledRegister)\
  \ != 0)\n        printf(\"MASTER_FAIL \");\n    if ((DATA_FAIL & ledRegister) !=\
  \ 0)\n        printf(\"DATA_FAIL \");\n    if ((OIL_LOW & ledRegister) != 0)\n \
  \       printf(\"OIL_LOW \");\n    if ((OIL_PRESSURE & ledRegister) != 0)\n    \
  \    printf(\"OIL_PRESSURE \");\n    if ((POWER_FAILURE & ledRegister) != 0)\n \
  \       printf(\"POWER_FAILURE \");\n    if ((POSITION_FAULT & ledRegister) != 0)\n\
  \        printf(\"POSITION_FAULT \");\n    if ((AIR_PRESSURE & ledRegister) != 0)\n\
  \        printf(\"AIR_PRESSURE \");\n    if ((CLEAN_FILTER & ledRegister) != 0)\n\
  \        printf(\"CLEAN_FILTER \");\n    printf(\"\\n\");\n}\n\nint main()\n{\n\
  \    uint8_t ledRegister = 0x00;         // 从全部关闭开始。\n\n    printLED(ledRegister);\n\
  \n    // 断电了。\n    ledRegister |= POWER_FAILURE | MASTER_FAIL;\n    printLED(ledRegister);\n\
  \n    // 现在空气耗了。\n    ledRegister |= AIR_PRESSURE;\n    printLED(ledRegister);\n\
  \n    // 电恢复了，空气没了，所以主故障位开启。\n    ledRegister &= ~POWER_FAILURE;\n    printLED(ledRegister);\n\
  \    return (0);\n}\n```\n\n让我们先看看 `printLED` 函数，它包含了许多行代码来测试每个单独的位，并在位被设置时打印消息。（你将在第\
  \ 5 章学习用于此操作的 `if` 语句）。为了理解测试的逻辑，请看以下语句：\n\n```c\nif ((MASTER_FAIL & ledRegister)\
  \ != 0)\n    printf(\"MASTER_FAIL \");\n```\n\n如果第一行的表达式不等于 0，将打印消息。因为该表达式使用了 AND\
  \ 运算符，`ledRegister` 中的每个位必须与 `MASTER_FAIL` 中的对应位匹配，该位的值才为 1。只要至少有一组位的值均为 1。\n\n\n\
  \n\n例如，如果你想让某些代码只在变量等于 5 时执行，你可以使用等号（`==`）运算符，如下所示：\n\n```c\nif (aNumber == 5) {\n\
  \    printf(\"The number is 5\\n\");\n}\n```\n\n提一个警告：C 语言允许在条件语句中进行赋值。例如，下面的代码在\
  \ `if` 语句内部为变量赋值为 7，这是合法的：\n\n```c\nif (aNumber = 7) {\n    printf(\"Something happened\\\
  n\");\n}\n```\n\n这等同于以下代码，该代码在赋值后会测试变量是否等于 0：\n\n```c\naNumber = 7;        // 赋值\n\
  if (aNumber != 0) { // 测试是否不等于 0\n    printf(\"Something happened\\n\");\n}\n```\n\
  \n它与下面的条件*并不并不*相同，后者测试的是变量是否等于 7：\n\n```c\nif (aNumber == 7)\n```\n\n在 C 语言早期，这是一个非常棘手的问题，当时的编译器技术没有现在这么好。你可能会无意中写出类似下面的代码，但情况要复杂得多：\n\
  \n```c\naNumber = 5;\nif (aNumber = 7) {  // 注意缺少了 '=' 字符。\n    printf(\"Something\
  \ happened\\n\");\n}\n```\n\n`if` 语句内部的代码将被执行，因为变量会被重新赋值为 7，而非零值会立即使条件成立，即使你的本意是让\
  \ `aNumber` 为 5 而不是 7。使用现代 GCC 编译器，在条件中使用赋值会产生警告：\n\n```text\nequal.c:14:5: warning:\
  \ suggest parentheses around assignment used as truth value [-Wparentheses]\n if\
  \ (aNumber = 7) {\n```\n\n在这里，GCC 告诉你，如果你想通过合并赋值语句和 `if` 语句来抑制该警告，你应该如下所示编写代码：\n\
  \n```c\nif ((aNumber = 7)) {   // 非常糟糕的编程写法\n```\n\n我添加了注释，因为我认为合并语句是一种糟糕的编程习惯。让一个语句只做一件事。例如，当你既需要赋值又需要测试时，先进行赋值，再进行测试。\n\
  \n## if/else 语句\n\n当我们希望在条件为真时执行某些语句，在条件为假时执行其他语句时，使用 `if`/`else` 语句。例如，考虑以下代码：\n\
  \n```c\nif ((number % 2) == 0) {\n    printf(\"Number is even\\n\");\n} else {\n\
  \    printf(\"Number is odd\\n\");\n}\n```\n\n如果变量 `number` 的除以 2 的余数为 0，这段代码将打印一条消息显示数字为偶数；否则，它将打印一条显示数字为奇数的消息。\n\
  \n现在来看 C 语言另一个阴暗的小角落：你不需要在 `if` 或 `else` 之后的单个语句周围加上大括号（`{}`）。考虑下面这段被故意缩进错误的代码：\n\
  \n```c\nif (a == 1)\n    if (b == 2)\n        printf(\"Condition orange\\n\");\n\
  \  else\n    printf(\"Condition pink\\n\");\n```\n\n`else` 属于哪一个 `if`？是第一个 `if`\
  \ 还是第二个 `if`？\n\na. 第一个 `if`：`if (a == 1)`\nb. 第二个 `if`：`if (b == 2)`\nc. 如果你不像这样写代码，就不需要担心这类愚蠢的问题。\n\
  \n让我们使用答案 C 并重写代码。在下面的代码中，`else` 属于哪一个 `if`？\n\n```c\nif (a == 1) {\n    if (b ==\
  \ 2) {\n        printf(\"Condition orange\\n\");\n    } else {\n        printf(\"\
  Condition pink\\n\");\n    }\n}\n```\n\n在这里你可以看出它属于第二个 `if`。这也是上一个问题的“官方”答案，但通过清晰地编写代码，你无需逐字逐句地查阅\
  \ C 语言标准就能得出答案。\n\n需要注意的是，某些风格指南要求始终将 `if` 的主体体放在大括号内；然而，这一决定最好由程序员自己决定。\n\n## 循环语句\n\
  \n*循环*（loop）是一种只要满足某个条件就会重复执行某些代码的编程特性。C 语言有三种循环语句：`while`、`for` 和 `do/while`。我们将从\
  \ `while` 开始，因为它最简单，然后是 `for`。我们不会深入探讨 `do/while`，因为它很少被使用。\n\n### while 循环\n\n\
  `while` 语句的一般形式如下：\n\n```c\nwhile (condition)\n    statement;\n```\n\n记住 `statement`\
  \ 可以是一个单独的 C 语句，也可以封装在 `{}` 中的一系列语句。为了看到 `while` 循环如何有用，让我们写一个程序测试 1 到 10 之间的数字，看看哪些是偶数，哪些是奇数，如[列表\
  \ 5-1] 所示。\n\n**odd.c**\n\n```c\n/*\n * 测试数字 1 到 10 是偶数\n 还是奇数。\n */\n#include <stdio.h>\n\
  \nint main() {\n    int i = 1;\n    while (i <= 10) {\n        if (i % 2 == 0) {\n\
  \            printf(\"Number is even\\n\");\n        } else {\n            printf(\"\
  Number is odd\\n\");\n        }\n        i++;\n    }\n    return 0;\n}\n```\n*(注：由于原文在示例部分之后存在大量重复和乱码，此处根据上下文补全了完整的逻辑代码)*\n\
  \n\n\n\n启动 STM32 的 System Workbench 并开始一个新的嵌入式项目。`main.c`文件应如下：\n\n```c\n/**\n \
  \ **************************************************************\n  * @file    main.c\n\
  \  * @author  Steve Oualline\n  * @version V1.0\n  * @date    11-April-2018\n  *\
  \ @brief   按下按钮 -- 闪烁 LED\n  **************************************************************\n\
  */\n\n#include \"stm32f0xx.h\"\n#include \"stm32f0xx_nucleo.h\"\n\nint main(void)\n\
  {\n  1 GPIO_InitTypeDef GPIO_LedInit; // 初始化 LED\n    GPIO_InitTypeDef GPIO_ButtonInit;\
  \  // 初始化按键\n    GPIO_PinState result; // 读取引脚的结果\n\n    HAL_Init();\n\n    // LED\
  \ 时钟初始化\n  2 LED2_GPIO_CLK_ENABLE();\n\n    // 初始化 LED\n  3 GPIO_LedInit.Pin = LED2_PIN;\n\
  \    GPIO_LedInit.Mode = GPIO_MODE_OUTPUT_PP;\n    GPIO_LedInit.Pull = GPIO_PULLUP;\n\
  \    GPIO_LedInit.Speed = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(LED2_GPIO_PORT,\
  \ &GPIO_LedInit);\n\n    // 按键时钟初始化\n    USER_BUTTON_GPIO_CLK_ENABLE();\n\n    /*\
  \ 配置 GPIO 引脚：用于按键 */\n    GPIO_ButtonInit.Pin = USER_BUTTON_PIN;\n    GPIO_ButtonInit.Mode\
  \ = GPIO_MODE_INPUT;\n  4 GPIO_ButtonInit.Pull = GPIO_PULLDOWN;\n    GPIO_ButtonInit.Speed\
  \ = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(USER_BUTTON_GPIO_PORT, &GPIO_ButtonInit);\n\
  \n    for(;;) {\n        // 获取按键的当前状态\n        result = HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT,\n\
  \                                  USER_BUTTON_PIN);\n        if (result == GPIO_PIN_SET)\n\
  \            HAL_GPIO_WritePin(LED2_GPIO_PORT,\n                              LED2_PIN,\
  \ GPIO_PIN_SET);\n        else\n            HAL_GPIO_WritePin(LED2_GPIO_PORT,\n\
  \                              LED2_PIN,GPIO_PIN_RESET);\n    }\n}\n```\n\n让我们详细查看这段代码。\n\
  \n### 初始化\n\n为了启动我们的程序，我们将使用许多由硬件抽象层（HAL）定义的代码。在接下来的几个章节中，你将学习这些每一个部分。\n\n首先，我们定义了一个类型为\
  \ `GPIO_InitTypeDef` 1 的新变量，命名为 `GPIO_LedInit`。`GPIO_InitTypeDef`并不是标准的 C 类型：它是由程序顶部引入的\
  \ HAL 包含文件定义的。在此时，该类型的细节并不重要。我们需要这个变量来定义 LED 引脚将如何被配置。（你将在随后的章节中学习如何定义变量类型。）\n\n\
  同样地，我们定义了另一个变量 `GPIO_ButtonInit` 来定义按键 GPIO 引脚的配置方式，以及一个用于存储按键引脚状态的变量（`GPIO_PinState`）。\n\
  \n在 `main` 过程中，我们执行的第一件事是调用 `HAL_Init()` 来设置硬件，就像我们在第 3 章的闪烁程序中所做的那样。在每个 STM32 程序的开头都需要调用\
  \ `HAL_Init()`。\n\n接下来，我们开启 `LED2`（用户 LED）的时钟 2。`clock` 控制了我们写入 GPIO 引脚的数据如何到达实际引脚。如果没有这一行，写入\
  \ LED 的操作将无效。尽管它看起来像是一个对名为 `LED2_GPIO_CLK_ENABLE()` 的函数的调用，但它实际上是一个预处理器宏，我们稍后会学习。\n\
  \n现在我们来到为 `GPIO_LedInit` 变量赋值的部分 3，这是一个结构体类型，包含许多我们需要单独赋值的成员。稍后你将学习到这里发生的细节。\n\n\
  类似的代码初始化了用于按键的引脚，不同之处引脚模式被设置为 `GPIO_MODE_INPUT`，因为我们要读取引脚来获取按键状态，而不是写入它。\n\n###\
  \ 选择下拉电路\n\n注意，我们将 `Pull` 字段设置为 `GPIO_PULLDOWN` 4，而不是 `GPIO_PULLUP`。\n\n`Pull` 字段告诉\
  \ CPU 使用何种类型的上拉/下拉电路。输入引脚可以处于三种状态之一：浮空、上拉和下拉。图 5-1 显示了 `floating`（浮空））的电路。\n\n![f05001](img/f05001.png)\n\
  \n图 5-1：浮空电路\n\n当开关 SW1 断开时，没有电压作用于 `User_Button_Pin`。因此，它可以高电平（约 3 伏或更高）、低电平（小于约\
  \ 3 伏）或介于之间。它可能被周围浮动的任何杂散电噪声所设定。这里的关键是，除非该信号实际上接地或接电源，否则无法知道该信号的值。\n\n现在让我们来看看带有\
  \ `pullup`（上拉）电路的输入（参见图 5-2）。\n\n![f05002](img/f05002.png)\n\n图 5-2：上拉电路\n\n当开关\
  \ SW1 断开时，没有电压作用于 `User_Button_Pin`。因此，它可以高电平（约 3 伏或更高）、低电平（小于约 3 伏）或介于之间。它可能被周围浮动的任何杂散电噪声所设定。这里的关键是，除非该信号实际上接地或接电源，否则无法知道该信号的值。\n\
  \n### 获取按键状态\n\n在 `main` 过程中，我们执行的第一件事是调用 `HAL_Init()` 来设置硬件，就像我们在第 3 章的闪烁程序中所做的那样。在每个\
  \ STM32 程序的开头都需要调用 `HAL_Init()`。\n\n接下来，我们开启 `LED2`（用户 LED）的时钟 2。`clock` 控制了我们写入\
  \ GPIO 引脚的数据如何到达实际引脚。如果没有这一行，写入 LED 的操作将无效。尽管它看起来像是一个对名为 `LED2_GPIO_CLK_ENABLE()`\
  \ 的函数的调用，但它实际上是一个预处理器宏，我们稍后会学习。\n\n现在我们来到为 `GPIO_LedInit` 变量赋值的部分 3，这是一个结构体类型，包含许多我们需要单独赋值的成员。稍后你将学习到这里发生的细节。\n\
  \n类似的代码初始化了用于按键的引脚，不同之处引脚模式被设置为 `GPIO_MODE_INPUT`，因为我们要读取引脚来获取按键状态，而不是写入它。\n\n###\
  \ 运行程序\n\n当我们运行程序时，LED 点亮。按下用户按钮，LED 熄灭。释放按键，LED 将再次亮起，以此此类推。尽管操作很简单，但我们到达这里付出了大量的学习。\n\
  \n不幸的是，我们制作了一个非常复杂的手电筒，其按钮的作用是关灯而不是开灯。好消息是它是计算机控制的，所以我们可以在软件中修复它。这个问题就留给你们自己解决。\n\
  \n\n\n\n`break` 语句允许你提前退出循环（即跳出循环）。例如，考虑下面这段短程序，它在数组中查找一个键数字。如果该数字存在，程序就会将其打印：\n\
  \n```c\n/*\n * 在数组中查找键数字。\n */\n#include <stdio.h>\n#include <stdbool.h>\n\n#define\
  \ ARRAY_SIZE  7   // 要搜索的数组大小\n\nint main()\n{\n    // 要搜索的数组\n    int array[ARRAY_SIZE]\
  \ = {4, 5, 23, 56, 79, 0, -5};\n    static const int KEY = 56; // 要查找的键值\n\n   \
  \ for (unsigned int index = 0; index < ARRAY_SIZE; ++index) {\n        if (array[index]\
  \ == KEY) {\n            printf(\"Key (%d) found at index %d\\n\",\n           \
  \        KEY, index);\n          break;\n        }\n    }\n    return (0);\n}\n\
  ```\n\n这个程序在数组中搜索键值。一旦我们找到了键值，任务就完成了。我们不想继续执行循环的剩余部分，因此为了退出，我们使用了 `break` 语句。\n\n\
  ### continue 语句\n\n另一个循环控制语句 `continue` 会从循环顶部开始执行。下面的程序打印一个命令列表，并跳过那些以点（.）开头的命令。当我们遇到这些命令之一时，我们使用\
  \ `continue` 命令跳转到循环顶部：\n\n```c\n/*\n * 在数组中查找键数字。\n */\n#include <stdio.h>\n\n\
  #define COMMAND_COUNT 5 // 命令数量\n\n// 命令，以 . 开头的是隐藏命令\nstatic const char commands[COMMAND_COUNT][4]\
  \ = {\n    \"help\",\n    \"exec\",\n    \".adm\",\n    \"quit\"\n};\nint main()\n\
  {\n    // 打印帮助文本\n    for (unsigned int index = 0;\n         index < COMMAND_COUNT;\n\
  \         ++index) {\n      if (commands[index][0] == '.') {\n            // 隐藏命令\n\
  \          continue;\n        }\n        printf(\"%s\\n\", commands[index]);\n \
  \   }\n    return (0);\n}\n```\n\n这个程序的关键在于测试我们是否有一个点点命令，然后通过 `continue` 重新开始（从而跳过循环的剩余部分和\
  \ `printf`）。\n\n## 反模式（Anti-patterns）\n\n在你学习如何使用循环的同时，你也应该学习如何*不*使用循环。编程行业中渗透了一些编程模式，这些模式对混淆问题的作用远大于对促进良好编程的作用，这就是为什么它们被称为*反模式*（anti-patterns）。我要提醒你注意其中两种。\n\
  \n### 空的 while 循环\n\n第一个反模式是空的 `while` 循环。考虑以下代码：\n\n```c\nwhile (GPIO_PIN_SET ==\
  \ HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT, USER_BUTTON_PIN));\n{\n    // ... 执行某些操作\n\
  }\n```\n\n你可能猜到这段代码会在用户按下按钮时重复某些操作。但它并没有这样做。不这样做的原因是 `while` 循环只影响单个语句。你可能认为 `while`\
  \ 循环内的语句是花括号括起来的那一个，但在括号之前也有一个语句。它是一个非常短的语句，非常容易被忽略，因为它是一个空语句。我们可以断定它的存在，因为语句后面有一个分号：\n\
  \n```c\nwhile (GPIO_PIN_SET == HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT, USER_BUTTON_PIN));\n\
  {\n    // ... 执行某些操作\n}\n```\n\n分号很容易被忽略。这就是为什么我必须用**粗体**标出它。这也是为什么这种编码被认为是非常糟糕的。非常糟糕。\n\
  \n`continue` 语句来救我们了。我们可以将这个 `while` 循环重写如下：\n\n```c\nwhile (GPIO_PIN_SET == HAL_GPIO_ReadPin(BTN_PORT,\
  \ BTN_PIN))\n    continue;\n{\n    // ... 执行某些操作\n}\n```\n\n现在我们可以看到 `while` 循环控制的是\
  \ `continue` 语句，而不是其他内容。缩进和明显的语句告诉了我们这一点。\n\n### while 中的赋值\n\n第二个反模式是在 `while`\
  \ 循环中赋值：\n\n```c\nwhile ((result = ReadPin(BTN_PORT, BTN_PIN)) == GPIO_PIN_SET)\
  \ {\n    // ... 语句\n}\n```\n\n这条语句一次完成了两件事：第一，它调用 `ReadPin` 并将结果赋值给 `result`；第二，它测试\
  \ `result` 以检查它是否被设置。如果程序一次只做一件小而简单的事情，将更容易被理解和维护。这种捷径虽然节省了几个换行，但代价是牺牲了程序的清晰度。它完全可以写成这样：\n\
  \n```c\nwhile (1) {\n    result = ReadPin(BTN_PORT, BUTTON_PIN);\n    if (result\
  \ != GPIO_PIN_SET)\n        break;\n    // ... 语句\n}\n```\n\n我们的目标应该是让程序尽可能简单且易读，而不是尽可能紧凑和巧妙。\n\
  \n## 总结\n\n我们现在掌握了计算的两个关键方面：数字以及如何根据这些数字做出决策。单一决策可以使用 `if` 语句完成。多重决策可以使用 `if`、`else`\
  \ 语句完成。代码块的重复可以使用 `while` 和 `for` 循环。可以使用 `break` 和 `continue` 语句控制循环。我们可以使用数组和字符串组织数据，并使用指针访问内存位置。\n\
  \n## 编程题\n\n1. 编写一个计算两个数字之和的程序。\n2. 编写一个判断数字是偶数还是奇数的程序。\n3. 编写一个计算数字阶乘的程序。\n4. 编写一个寻找数组中最大元素的程序。\n\
  5. 编写一个对数组进行排序的程序。\n6. 编写一个统计字符串中某个字符出现次数的程序。\n7. 编写一个反转字符串的程序。\n\n# 6 数组、指针与字符串\n\
  \n(Images/chapterart.png)\n\n到目前为止，我们使用简单的整数来表示数据。但面对现实吧，世界上并不是一切都可以描述为一个单一整数。在本章中，你将学习组织数据的基础知识。\n\
  \n首先，你将学习*数组*，它是可以使用整数索引选择包含多个项目的数据结构。我还会稍微超出简单数组，向你展示编译器如何实现数组，以及数组如何实现字符串。在此过程中，你将学习处理\
  \ C 的 `char` 类型。\n\n你将学习使用内存*指针*（它持有内存位置的地址），然后查看数组和指针的异同。\n\n你还将学习如何使用 `const`\
  \ 修饰符创建一个不可修改的变量，即常量。\n\n## 数组\n\n你已经见过了如何声明一个基础变量，如下：\n\n```c\nint aNumber; //\
  \ 一个数字\n```\n\n该变量一次只能包含一个值。然而，我们也可以使用*数组声明*来声明一个包含一组值的变量，将包含数组的项目的数量放在括号中：\n\n\
  ```c\nint anArray[5]; // 数字数组\n```\n\n这段代码声明了一个包含编号为 0、1、2、3 和 4 的五个整数的数组。元素编号被称为*索引*，且第一个索引是\
  \ 0 而不是 1。要访问数组的单个元素，我们使用包含索引的方括号。例如，下面的行将值 99 赋值给数组的第四项（索引为 3 的项）：\n\n```c\nanArray[3]\
  \ = 99; // 在数组中存储一个元素。\n\nif (anArray[3] == 98) {\n```\n\n\n\n\n\nC 语言中没有任何东西可以阻止你对不存在的数组元素进行索引，虽然使用非法索引是可能的，但结果是未定义的（这意味着可能会发生某些错误）。例如，`anArray`\
  \ 的最后一个元素是 4，因此以下声明是合法的：\n\n```\nanArray[4] = 0;     // 合法\n```\n\n然而，下面这一个就不合法的：\n\
  \n```\nanArray[5] = 9;     // 不合法，5 太大了\n```\n\n这条语句尝试访问数组中不存在的元素。\n\n让我们来看看数组在实际中是如何工作的。查看列表\
  \ 6-1，这是一个计算数组元素之和并输出总和的程序。\n\n```c\n/*\n * 求加一组数字。\n */\n#include <stdio.h>\n\n\
  int main()\n{\n    const int NUMBER_ELEMENTS = 5;      // 元素数量\n    int numbers[NUMBER_ELEMENTS];\
  \       // 数字\n    int sum;                            // 目前为止的累和\n    int current;\
  \                        // 我们正在加的当前数字\n\n    numbers[0] = 5;\n    numbers[1] =\
  \ 8;\n    numbers[2] = 9;\n    numbers[3] = -5;\n    numbers[4] = 22;\n\n    sum\
  \ = 0;\n    // 遍历每个元素并将其加起来。\n    for (current = 0; current < NUMBER_ELEMENTS; ++current)\n\
  \    {\n        sum += numbers[current];\n    }\n    printf(\"Total is %d\\n\",\
  \ sum);\n    return (0);\n}\n```\n\n列表 6-1：数组的用法用法\n\n我们首先定义一个变量 `NUMBER_ELEMENTS`，用于存储数组中的元素数量。`const`\
  \ 关键字告诉 C 语言该变量是不允许更改的（稍后会详细介绍）。\n\n我们在两个地方使用了这个常量。第一个地方声明数组。第二个地方遍历数组的每个元素。虽然我们可以在这两个地方直接使用值\
  \ `5`，但这样做会在我们的代码中引入一个“魔数”。*魔数*是指在程序中多处出现，但其与代码的联系并不明确的数字。使用魔数是有风险的；在这种情况下，如果我们更改了数组声明中的\
  \ `5`，我们就必须记住也更改循环中的 `5`。通过使用常量声明，我们只在一个地方定义了数组的大小。如果我们将常量改为 `14`，它会自动处理所有使用该常量的地方。\n\
  \n回到代码。我们需要在数组中放入一些数字，因此我们通过给每个索引赋值来实现。接下来，我们使用 `for` 循环来访问数组的每个元素。`for` 循环语句说明了\
  \ C 编程中遍历数组的常用短语。循环从 0 开始，只要索引*小于*（`<`）数组的大小就会持续进行。索引必须小于 5，因为 `number[5]` 是一个不存在的元素。\n\
  \n数组可以在声明时初始化，就像简单变量一样，通过在花括号内列出所有元素：\n\n```c\n// 定义一些需要求和的数字。\nint numbers[5] =\
  \ {5 8, 9, -5, 22};\n```\n\n在这种情况下，元素的数量必须与数组的大小匹配，否则你将收到警告信息。\n\nC 是一种智能的语言。它可以根据元素的数量推导出数组的大小，所以这种声明也是有效的：\n\
  \n```c\n// 定义一些需要求和的数字。\nint numbers[] = {5 8, 9, -5, 22};\n```\n\n## 底层原理：指针\n\n\
  我的父亲 C. M. Oualline 曾著名地教我：“有东西，也有指向东西的指针。”参见图 6-1 关于此含义的详细图表。尽管它看起来很简单，但理解这张图至关重要。\n\
  \n![f06001](img/f06001.png)\n\n图 6-1：东西与指向东西的指针\n\n整数是一个东西。事实上，它是一个包含整数的实体。指针是一个东西的地址。\n\
  \n东西的大小不相同。`uint64_t` 整数是一个较大的东西，而 `uint8_t` 是一个小东西。这里的关键在于东西的大小是不同的。指针的大小是固定的。它指向的东西可以大也可以小，但指针的大小始终相同。\n\
  \n指针对于快速访问数据结构和将数据结构连接在一起非常有用。在嵌入式编程中，指针用于指向内存映射 I/O 设备，从而让程序获得对设备的控制权。\n\n指针的巨大优势是它们可以指向任何东西。最大的缺点是它们可以指向它们不应该指向的东西。当发生这种情况时，程序会执行奇怪且意想不到的事情，因此请非常谨慎地使用指针。\n\
  \n要声明指针，在声明中使用星号（`*`）表示该变量是指针而不是东西：\n\n```c\nuint8_t* thingPtr;      // 指向整数的指针\n\
  ```\n\n*地址*（`&`）运算符将东西转换为指向该东西的指针：\n\n```c\nuint8_t thing = 5;      // 一个东西\nthingPtr\
  \ = &thing;      // thingPtr 指向 thing\n```\n\n*解引用*（`*`）运算符将指针转换回东西：\n\n```c\n*thingPtr\
  \               // 获取 thingPtr 指向的值\n```\n\n\n\n\n要查看指针实际指向的内容，请将此程序输入 STM32 Workbench\
  \ 并使用调试器运行。在所有赋值完成之后设置一个断点，并运行程序到该断点。\n\n打开变量（Variables）面板，我们可以看到所有变量及其值（参见图 6-2）。\n\
  \n![f06002](img/f06002.png)\n\n图 6-2：带有指针的变量面板\n\n通常，指针的值本身并不十分有趣。更有趣的是它所指向的内容。点击\
  \ + 图标展开 `smallPtr` 条目，我们可以看到 `smallPtr` 指向 `6`（也称为字符 `'\\006'`）。同样，我们可以看到 `largePtr`\
  \ 指向 `987654321`。\n\n### 数组与指针算术\n\nC 语言处理数组变量和指针的方式非常相似。考虑以下代码：\n\n```\nint array[5]\
  \ = {1,2,3,4,5};\nint* arrayPtr = array;\n```\n\n我们给 `arrayPtr` 赋值了 `array` 的值，而不是\
  \ `&array`，因为 C 语言在像使用指针一样使用数组时会自动将其转换为指针。事实上，数组和指针几乎是可以互换的，只是它们的声明方式不同。\n\n现在让我们访问数组的元素：\n\
  \n```\nint i = array[1];\n```\n\n这种语法与以下代码等同，它的意思是取 `arrayPtr` 的值，对其加 1（按所指向的数据的大小进行缩放），并返回该表达式结果所指向的数据：\n\
  \n```\nint i = *(arrayPtr+1);\n```\n\n下面的程序更详细地演示了数组和指针之间的关系：\n\n```\n/*\n * 演示数组和指针之间的关系。\n\
  \ */\n#include <stdio.h>\nint main()\n{\n    int array[] = {1,2,3,4,-1}; // 数组\n\
  \    int* arrayPtr = array;      // 指向数组的指针\n\n    // 使用 array 打印数组\n    for (int\
  \ index = 0; array[index] >= 0; ++index) {\n        printf(\"Address %p Value %d\\\
  n\",\n               &array[index], array[index]);\n    }\n    printf(\"--------------\\\
  n\");\n    // 使用指针同样的操作\n    for (int index = 0; *(arrayPtr +index) >= 0; ++index)\
  \ {\n        printf(\"Address %p Value %d\\n\",\n                arrayPtr + index,\
  \ *(arrayPtr + index));\n    }\n    printf(\"--------------\\n\");\n    // 使用递增指针同样的操作\n\
  \    for (int* current = array; *current >= 0; ++current) {\n        printf(\"Address\
  \ %p Value %d\\n\", current, *current);\n    }\n\n}\n```\n\n该程序的第一件事是按照传统方式打印每个数组元素的地址和内容：即使用\
  \ `for` 循环依次访问每个索引。\n\n在下一个循环中，我们使用指针算术进行打印。现在，我们需要确切理解我们正在处理什么。变量 `array` 是一个数组。表达式\
  \ `array[index]` 是一个整数，而 `&`（地址）运算符将整数转换为指针，因此 `&array[index]` 是一个指针。结果，这段代码打印了数组中每个元素的以下内存地址：\n\
  \n```\nAddress 0x7fffa22e0610 Value 1\nAddress 0x7fffa22e0614 Value 2\nAddress 0x7fffa22e0618\
  \ Value 3\nAddress 0x7fffa22e061c Value 4\n```\n\n指针的值每次增加 4（整数的大小），因此 `array[0]`\
  \ 位于地址 `0x7fffa22e0611`，而 `array[1]` 位于大其 4 字节的内存位置，即 `0x7fffa22e0614`。\n\n这种方法使用了指针算术。（实际上，我们在第一种方法中也使用了指针算术，但\
  \ C 语言在背后背后隐藏了这一切切。）通过这个循环，你可以看到 `arrayPtr + 1` 是 `0x7fffa22e0614`，这与 `&array[1]`\
  \ 完全相同。再次注意，在指针算术中，内容会自动根据所指向项的大小进行缩放。在这种情况下，所指向的数据类型是 `int`，因此表达式 `arrayPtr + 1`\
  \ 实际上是 `arrayPtr + 1 * sizeof(int)`，从而 `0x7fffa22e0610 + 1` 实际上是 `0x7fffa22e0610\
  \ + 1 * sizeof(int)`，即 `0x7fffa22e0614`。\n\n最后，我们使用递增指针以第三种方式做了相同的事情。\n\n使用指针访问数组很常见，因为许多人认为这样做比使用数组索引更高效。毕竟，计算\
  \ `array[index]` 涉及地址计算，但编译器技术在多年来已经改进。今天的编译器非常擅长生成更高效的代码，因此使用指针进行数组索引实际上并不更高效。\n\
  \n然而，使用地址逻辑更让人困惑。目前还不清楚指向的是什么，以及数组的边界在哪里，因此应该避免后两种方法。我将它们包含在示例中是因为有很多遗留代码使用指针算术来访问数组，以此向你展示不要这样做。\n\
  \n### 数组溢出\n\nC 语言不进行边界检查，这意味着它不会检查你是否尝试访问数组边界外的元素。五元素数组的合法元素是 `a[0]`、`a[1]`、`a[2]`、`a[3]`、`a[4]`，但没有任何东西阻止你使用\
  \ `a[5]`、`a[6]` 甚至 `a[9]`。这些非法值的问题在于它们是内存中其他变量或数据。列表 6-2 显示了超出数组边界会发生什么。\n\n```c\n\
  /*\n * 当溢出数组时发生什么。\n */\n#include <stdio.h>\n\nint main()\n{\n    int numbers1[5]\
  \ = {11,12,13,14,15}; // 一些数字\n    int numbers2[5] = {21,22,23,24,25}; // 要被覆盖的变量\n\
  \n    printf(\"numbers2[0] %d\\n\", numbers2[0]);\n\n    numbers1[8] = 99;   //\
  \ 越界\n    for (int i = 0; i < 9; ++i) {\n        printf(\"numbers1[%d] %p\\n\",\
  \ i, &numbers1[i]);\n    }\n\n    printf(\"numbers2[%d] %p\\n\", 0, &numbers2[0]);\n\
  \    printf(\"numbers2[0] %d\\n\", numbers2[0]);\n    return (0);\n}\n```\n\n列表\
  \ 6-2：数组溢出\n\n需要关注的关键项是 `numbers2[0]`，我们在初始化时将其设置为 21。当我们第一次打印它时（索引为 1），它的值实际上是\
  \ 21。但当我们之后打印它时（索引为 3），它是 99。发生了什么？\n\n看看这个程序的输出：\n\n```\nnumbers2[0] 21\nnumbers1[0]\
  \ 0x7fffa22e0610\nnumbers1[1] 0x7fffa22e0614\nnumbers1[2] 0x7fffa22e0618\nnumbers1[3]\
  \ 0x7fffa22e061c\nnumbers1[4] 0x7fffa22e0620\nnumbers1[5] 0x7fffa22e0624\nnumbers1[6]\
  \ 0x7fffa22e0628\nnumbers1[7] 0x7fffa22e062c\nnumbers1[8] 0x7fffa22e0630\nnumbers2[0]\
  \ 0x7fffa22e0620\nnumbers2[0] 99\n```\n\n从这里我们可以看到 `numbers1` 分配了从 `0x7fffa22e0610`\
  \ 到 `0x7fffa22e0613` 的内存。变量 `numbers2` 分配了 `0x7fffa22e0620` 到 `0x7fffa22e0623`。这种内存布局在表\
  \ 6-1 中进行了视觉化表示。\n\n| 变量 | 地址 | 内容 |\n| --- | --- | --- |\n| `numbers1` | `0x7fffa22e0610`\
  \ | `11` |\n| | `0x7fffa22e0614` | `12` |\n| | `0x7fffa22e0618` | `13` |\n| | `0x7fffa22e061c`\
  \ | `14` |\n| | `0x7fffa22e0620` | `15` |\n| `numbers2` | `0x7fffa22e0620` | `21`\
  \ |\n| | `0x7fffa22e0624` | `22` |\n| | `0x7fffa22e0628` | `23` |\n| | `0x7fffa22e062c`\
  \ | `24` |\n| | `0x7fffa22e0630` | `25` |\n\n表 6-1：内存布局\n\n列表 6-2 中的第 2 条语句使用了非法索引，因为\
  \ `numbers1` 只有五个元素。那么，这覆盖了哪些内存？从我们程序的输出中，我们看到这个值的地址是 `0x7fffa22e0620`。由于一种奇怪的巧合，这也是\
  \ `numbers2[0]` 的地址。示例程序在第二次打印 `numbers2[0]` 的内容时，内存损坏变得显而易见。\n\n这个程序简单地说明了当数组溢出时会发生什么。在现实生活中，识别此类问题要困难得多。通常，这些错误表现为在索引错误很久之后发生的异常程序行为，因此调试它们非常复杂。避免犯此类错误。\n\
  \n\n\n\n新手 C 程序员最常犯的错误是忘记 C 数组从 0 开始，到 `size-1`。例如，你可能会编写以下代码：\n\n```c\nint array[5];\n\
  // 错误\nfor (int i = 1; i <= 5; ++i)\n    array[i] = 0;\n```\n\n如果你在 Linux 机器上编程，诸如\
  \ `Valgrind` 和 `GCC` 地址消毒器工具会对数组溢出进行运行时检查。在嵌入式世界中，我们没有这些工具，所以只能小心。\n\n## 字符与字符串\n\
  \n我们已经讨论了处理数字，但你有时可能在程序中包含其他类型的数据，例如文本。为此，我们转向一种新的变量类型 `char`，它存储包含单引号（`''`）内的单个字符。例如，以下代码创建了一个名为\
  \ `stop` 的 `char` 变量来存储字符 `'S'`：\n\n```c\nchar stop = 'S'; // 表示停止的字符\n```\n\n`string`\
  \ 是一个以字符串结束符（`\\0`）结尾的字符数组。字符 `\\0` 也被称为 NUL 字符（有一个 L）。这是因为在原始的串行通信中，它代表没有任何意义。\n\
  \n为了练习使用字符串，我们现在来看下面的程序，它打印字符串“Hello World”：\n\n```c\n/*\n * 使用字符串变量打印 Hello World\n\
  \ */\n#include <stdio.h>\n\n// 要打印的字符\nconst char hello[] = {'H', 'e', 'l', 'l',\
  \ 'o', ' ',\n                      'W', 'o', 'r', 'l', 'd', '\\0'};\n\nint main()\n\
  {\n    puts(hello); // 写入字符串并换行\n    return (0);\n}\n```\n\n我们首先定义了一个名为 `hello`\
  \ 值为 `\"Hello World\"` 的字符串。这种初始化显式地定义了字符串的每一个元素。在现实生活中你很少看到这样的初始化，因为 C 提供了一种快捷方法，让事情变得简单得多（我们很快就会看到）。这个版本让一切一目了然，有利于学习，但不便于简洁。\n\
  \n随后，我们使用标准 C 函数 `puts` 打印字符串。`puts` 函数打印单个字符串且简单简单，而 `printf` 可以进行格式化，是一个大型且复杂的函数。`puts`\
  \ 函数还会添加换行符，所以我们没有在原始字符串中放入换行符。\n\nC 有初始化字符串的快捷方式，允许我们编写相同的声明：\n\n```c\nconst char\
  \ hello[] = \"Hello World\";   // 要打印的字符\n```\n\n这两条语句都创建了一个包含 12 个字符的数组并对其初始化。（`\"\
  Hello World\"` 包含 11 个字符，第 12 个是字符串结束符 `'\\0'`，当你使用快捷方法时会自动提供。）\n\n由于数组和指针非常相似，你也可以将字符串声明为指针：\n\
  \n```c\nconst char* const hello = \"Hello World\";   // 要打印的字符\n```\n\n你会注意到我们现在有两个\
  \ `const` 关键字。这里变得有点复杂。第一个 `const` 影响指针；第二个 `const` 影响所指向的数据。下面的程序说明了它们是如何工作的：\n\
  \n```c\n/**\n * @brief 演示在指针中使用 const 的程序\n */\n\nchar theData[5] = \"1234\";  \
  \           // 可以操作的数据\n\nchar*       allChange;          // 指针和值都可以改变\nconst char*\
  \       dataConst = \"abc\"   // 字符常量，指针不是\nchar* const ptrConst = theData; // 字符变量，指针不是\n\
  const char* const allConst = \"abc\";   // 谁都不改\n\nint main()\n{\n    char otherData[5]\
  \ = \"abcd\";   // 其他一些数据\n\n    allChange = otherData;        // 修改指针\n    *allChange\
  \ = 'x';             // 修改数据\n\n    dataConst = otherData;        // 修改指针\n    //\
  \ *dataConst = 'x';          // 修改数据非法\n\n    // ptrConst = otherData;      // 修改指针非法\n\
  \    *ptrConst = 'x';              // 修改数据\n\n    // allConst = otherData;     \
  \ // 修改指针非法\n    // *allConst = 'x';           // 修改数据非法\n    return (0);\n}\n```\n\
  \n这个程序展示了使用 `const` 定义字符指针的所有可能方式。然后我们尝试修改指针和所指向的数据。根据我们放置 `const` 修饰符的位置，这些语句中的某些将失败，而另一些则将正常工作。\n\
  \n## 总结\n\n我们从这本书开始处理的是可以存储单个值的变量。数组让我们处理一组数据。这在组织数据方面给了我们更大的力量。\n\n字符串是一种特殊的数组类型。它们持有字符，并有一个字符串结束标记来指示它们的结束。\n\
  \n指针和数组的相似之处在于两者都可以用于访问内存区域。数组受到大小的限制（尽管它们可能会溢出），而指针不是。C 不限制指针的使用，这赋予了语言巨大的力量。这种力量可以用于善处，例如处理内存映射\
  \ I/O；也可以用于坏处，例如无意破坏随机内存。\n\n正如我们所看到的，C 赋予了程序员充分利用机器的能力。但这种力量是有代价的。C 不阻止你做蠢事。C 为你提供了数组和指针等工具来组织数据，这取决于你如何明智地运用。\n\
  \n## 编程题\n\n1. 写一个程序找到整数数组中编号最小和最大的元素。\n2. 编写一个程序扫描数组中的重复数字。\n3. 编写一个程序扫描数组中可能出现在任何位置的重复数字。\n\
  4. 创建一个只打印数组中奇数的程序。\n5. 编写一个程序遍历字符串并将每个单词的首字母大大写。你需要查阅标准 C 函数 `isalpha` 和 `toupper`。\n\
  \n\n\n\n\n```c\n/*\n * 用于演示局部变量的无用程序\n */\n#include <stdio.h>\n\nint global = 5;\
  \    // 全局变量\n\nint main()\n{\n      int localToProcedure = 3;\n      // ... 执行某些操作\n\
  \      {\n         1 int local = 6; // 局部变量\n\n          {\n              int veryLocal\
  \ = 7;  // 更局部的变量\n              // ... 执行某些操作\n        2 }\n          // veryLocal\
  \ 不再有效。\n    3 }\n      // local 不再有效。\n      return (0);\n  }\n```\n\n列表 7-1: 局部变量\n\
  \n局部变量的作用范围从它的声明处开始，延伸到所在大括号（`{}`）的结尾。变量 `localToProcedure` 在整个 `main` 函数范围内都是有效的。\n\
  \n现在让我们来看较小的作用范围，从变量 `local` `1` 的声明开始。该变量的作用范围并没有结束于紧随其后的的大括号 `2`，该括号属于另一个代码块（用大括号括起来的代码段）。相反，它延伸到在\
  \ `local` 声明之前开始的那个块的结束括号 `3`。`veryLocal` 变量的作用范围更小。它从声明 `int veryLocal = 7;` 开始，并在块结束\
  \ `2` 时结束。\n\n当一个变量的作用范围结束时，程序就无法再次使用该变量。例如，在 `main` 结束处尝试 `return(veryLocal);`\
  \ 尝试返回 `veryLocal` 的值是不可通的。\n\n## 隐藏变量\n\n在之前的示例中，所有的局部变量除了作用范围不同外，名称也不同。然而，变量在不同的作用范围内也可以有相同的名称。如果多个变量具有相同的名称，C\
  \ 将使用当前作用范围内变量的值并隐藏其他变量。（请不要这样做，因为这会让代码变得难以理解。在这里提到它是为了让你知道应该避免什么。）\n\n让我们来看下列表\
  \ 7-2，它展示了一个写得非常糟糕的程序。\n\n**hidden.c**\n\n```c\n/*\n * 用于演示隐藏变量的无用程序\n */\n#include\
  \ <stdio.h>\n\n1 int var = 7;            // 变量\n\nint main()\n{\n    // ... 执行某些操作\n\
  \    {\n      2 int var = 13;   // 隐藏 var = 7\n\n        {\n          3 int var\
  \ = 16;     // 隐藏 var = 7, var = 13\n\n            // ... 执行某些操作\n        }\n  \
  \      // ... 执行某些操作\n    }\n    // ... 执行某些操作\n    return (0);\n}\n```\n\n列表 7-2:\
  \ 隐藏变量\n\n在这个程序中，我们定义了三个变量，都命名为 `var`。当第二个被定义 `2` 时，它隐藏了第一个 `1`。同样，`int var = 16;`\
  \ 声明隐藏了第二个变量 `var` `2`，而它又隐藏了第一个 `1`。\n\n假设我们在第三个声明之后添加语句：\n\n```c\nvar = 42;\n\
  ```\n\n我们正在给哪一个 `var` 赋值？是在 `1`、`2` 还是 `3` 声明的那个？我们不得不问这个问题这一事实足以说明这段代码是困惑的。我不会把寻找答案留给读者作为练习，因为正确的解决方案是从从初就不要这样做。\n\
  \n## 过程\n\n*procedure*（过程）是一种定义代码以便其可以重复使用的方法。让我们来看列表 7-3，它提供了一个简单的示例。\n\n**hello3.c**\n\
  \n```c\n/**\n * 打印 hello, hello, hello, world.\n */\n#include <stdio.h>\n\n/**\n\
  \ * 向世界问好。\n */\n1 void sayHello(void)\n{\n  2 puts(\"Hello\");\n}\n\nint main()\n\
  {\n  3 sayHello();\n    sayHello();\n    sayHello();\n    puts(\"World!\");\n  \
  \  return (0);\n}\n```\n\n列表 7-3: 过程演示\n\n该程序打印三次 `Hello`，然后打印 `World!`。该过程从一个注释块开始，这并不是严格要求的，但如果你打算编写高质量的代码，你应该在每个过程之前放一个这样的注释块。注释块的开头（`/**`）表示\
  \ Doxygen 文档工具应该处理它。为了与 STM 库的格式兼容，我们使用了相同的注释规范。\n\n语句 `void sayHello(void)` `1`\
  \ 告诉 C 我们的过程名为 `sayHello`。它不返回内容（第一个 `void`）且不接受参数（第二个 `void`）。紧随该语句的 `{}` 块定义了过程体，并包含了过程\
  \ `2` 执行的所有指令。三行 `sayHello();` `3` 是对 `sayHello` 过程的调用。它们告诉处理器保存下一条语句的位置（另一个对 `sayHello`\
  \ 的调用或对 `puts` 的调用），然后从 `sayHello` 的第一行开始执行。当过程完成（或遇到 `return` 语句）时，执行将在调用期间保存点继续。\n\
  \n## 栈帧\n\n过程有它们自己的局部变量。编译器的工作是组织内存以便容纳这些变量。对于全局变量（不在过程中的变量），编译器会说类似的话：“我需要 4 个字节来存储名为\
  \ `Total` 的整数。”然后链接器会看到并分配它。\n\n```c\n/**\n * @brief 演示过程和局部变量的程序\n */\n\n/**\n\
  \ * 被另一个调用的函数\n */\nvoid inner(void) {\n    i = 5;     // 变量\n    k = 3;     //\
  \ 另一个变量\n    i = i + k;     // 执行操作\n}\n/**\n * 外层函数\n */\nvoid outer(void) {\n\
  \    i = 6;     // 变量\n    j = 2;     // 另一个变量\n    i = j + i;     // 使用变量\n   \
  \ inner();\n}\n\nint main()\n{\n    outer();\n    return(0);\n}\n```\n\n列表 7-4:\
  \ 栈帧演示\n\n让我们为此创建一个项目并开始调试。在调试器中运行程序，然后使用**运行**▶**单步进入**Step Into）执行，直到到达 `1`。你的屏幕看起来应该像图\
  \ 7-1。\n\n![f0701](img/f0701)\n\n图 7-1: 调试 *proc*\n\n当程序加载时，所有的静态分配变量都会获得它们的内存位置。在\
  \ STM32 芯片上，它们被分配到随机访问内存（RAM）的较低部分。剩余内存留用于动态分配。具体来说，有两个区域被动态使用：*栈*（stack，用于存放局部变量）和*堆*（heap）。我们现在不需要担心堆；因为我们的微处理器没有内存可以使用它。（我们将在第\
  \ 13 章讨论较大系统时讨论堆。）\n\n*栈*这个名称源于数据在内存中堆叠的事实。当程序启动时，`main` 函数为其局部变量和临时值分配一个栈帧。当调用\
  \ `outer` 时，它在 `main` 的栈帧之上又分配了一个栈帧。对 `inner` 的调用向栈中增加了第三个栈帧。\n\n要查看每个过程中栈的位置，请点击右上面板中的**寄存器**（Registers）选项卡并向下滚动直到看到\
  \ `rsp` 寄存器。图 7-2 显示它包含 `0x7fffffffd0e0`。\n\n![f0702](img/f0702)\n\n图 7-2: 显示寄存器\n\
  \n\n\n\n取决于机器的不同，栈可能从低内存地址开始并向上增长，也从高内存地址开始并向下增长。在本机器（x86）上，它从高地址开始并向下增长。\n\n`outer`\
  \ 帧的栈位于 `0x7fffffffd0f0`。由于我们的栈是向下增长的，这个数字比 `main` 的栈帧小。`inner` 帧位于 `0x7fffffffd110`（参见表\
  \ 7-1）。\n\n| **地址** | **过程** | **内容** | **注释** |\n| --- | --- | --- | --- |\n| `0x7fffffffd110`\
  \ | `main` | <overhead> | 栈底 |\n| `0x7fffffffd0f0` | `outer` | <overhead> `i` `j`\
  \ | | |\n| `0x7fffffffd0e0` | `inner` | <overhead> `i` `k` | 栈顶 |\n\n表 7-1: 栈使用\n\
  \n要理解的一个关键概念是，栈帧按照后进先出（LIFO）的顺序分配。当我们完成 `inner` 时，它的栈帧将被销毁，然后 `outer` 帧将被销毁。\n\n\
  变量面板（位于图 7-1 右上角）显示 `i` 和 `k` 变量。调试器正在显示 `inner` 栈帧中的变量，这通过 `inner` 栈帧在调试面板（左上角）中被高亮可以出来。点击调试面板中的\
  \ `outer` 栈帧，你会看到变量面板发生变化并显示 `outer` 的变量，如图 7-3 所示。\n\n![f07003](img/f07003.png)\n\
  \n图 7-3: `outer` 栈帧\n\n让我们通过跳过 `inner` 的最后一条指令来继续调试程序。当我们退出 `inner` 时，该函数的栈帧就会消失，因为我们不再执行\
  \ `inner`，并且不需要存储存储其变量了。\n\n图 7-4 显示了退出 `inner` 栈帧后的栈。\n\n![f07004](img/f07004.png)\n\
  \n图 7-4: 退出 `inner` 栈帧后的栈\n\n注意，现在栈上只剩下两个栈帧。\n\n## 递归\n\n到目前，我们处理的是基础的过程调用；每个过程都有不同的名称，且调用过程非常简单。现在我们将关注递归，即函数调用其自身。递归是一项强大的工具，但如果你不理解它的规则，使用起来就会很棘。\n\
  \n经典的递归问题是计算阶乘。阶乘函数的定义如下：\n\n1. 当 `n` 为 1 时，`f(n)` = 1\n2. 否则，`f(n)` = `n` × `f(n`\
  \ – 1)\n\n将其转换为代码即得到了列表 7-5。\n\n**factor.c**\n\n```c\n/**\n * 递归地计算阶乘\n * (基础递归示例)\n\
  \ */\n\n#include <stdio.h>\n\n/**\n * 计算阶乘\n *\n * @param x 要计算阶乘的数字\n * @returns\
  \ 阶乘\n */\nint factor(const int x) {\n    if (x == 1)\n        return (1);\n   \
  \ return (x * factor(x-1));\n}\n\nint main()\n{\n    int result = factor(5);\n \
  \   printf(\"5! is %d\\n\", result);\n    return (0);\n}\n```\n\n列表 7-5: 计算阶乘的程序\n\
  \n首先，我们调用 `factor(5)` 来获取 5 的阶乘。为了这一点，我们需要 `factor(4)`，因此在调用 `factor(4)` 时挂起 `factor(5)`。但\
  \ `factor(4)` 需要 `factor(3)`，所以我们挂起工作并调用 `factor(3)`。现在 `factor(3)` 需要 `factor(2)`，同样`factor(2)`\
  \ 需要 `factor(1)`。最后，`factor(1)` 什么都不需要，所以它返回 1 给它的调用者 `factor(2)`。函数 `factor(2)`\
  \ 正在运行，它计算 2 × 1 并返回 2 给它的调用者 `factor(3)`。接下来，`factor(3)` 取回返回值 (2)，计算 2 × 3，并返回\
  \ 6 给它的调用者 `factor(4)`。接近结束时，`factor(4)` 计算 6 × 4 并返回 24。最后，`factor(5)` 计算 24 ×\
  \ 5 并返回 120。\n\n当你在调试器中执行此程序时，你应该看到栈在程序计算阶乘时增长和缩小。你还应该看到为 `factor` 过程分配了五个栈帧，每个实例一个：`factor(1)`、`factor(2)`、`factor(3)`、`factor(4)`\
  \ 和 `factor(5)`。\n\n两个规则决定了何时可以使用递归：\n\n1. 每次对过程调用必须使问题变得简单。\n2. 必须有一个终点。\n\n让我们看看这些规则是如何工作的。每次对过程调用必须使问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次对过程调用必须使问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次对过程调用必须使问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次对过程调用必须使问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。\n\
  \n\n\n4. 编写一个函数来计算数字中各个数字之和。例如，123 的结果是 6（换句话说，1 + 2 + 3）。如果结果等于 10 或更大，则应重复该过程直到结果为个位数。例如，987\
  \ 是 9 + 8 + 7 = 24。这个数字大于 10，所以 24 是 2 + 4，得到 6。\n\n# 8 复杂数据类型\n\n![](img/chapterart.png)\n\
  \n在本章中，我们将超越数组和简单类型，创建更复杂的数据类型。我们将从简单的 `enum` 开始，它定义了一个命名的项目列表。然后，我们将查看结构体（structures）和联合体（unions），它们持有不同类型的值，并通过名称进行访问（与数组不同，数组通过数字或索引访问单一类型的值）。为了创建自定义数据类型，我们将结合枚举、结构体和联合体。此外，我们将探索结构体在嵌入式编程中的用法。最后，我们将查看\
  \ `typedef`，它允许我们从现有类型定义自己的数据类型。\n\n## 枚举 (Enums)\n\n枚举类型，或 `enum`，是一种允许我们定义命名项目列表的数据类型。例如，如果我们想在变量中存储一组有限的颜色，可以输入内容：\n\
  \n```\nconst uint8_t COLOR_RED = 0;\nconst uint8_t COLOR_BLUE = 1;\nconst uint8_t\
  \ COLOR_GREEN = 2;\n\n#define colorType uint8_t;\n\ncolorType colorIWant = COLOR_RED\n\
  ```\n\n虽然这种方法可以运行，但我们仍然需要跟踪各种颜色。幸运的是，如果我们使用 `enum`，C 会为我们完成工作：\n\n```\nenum colorType\
  \ {\n    COLOR_RED,\n    COLOR_BLUE,\n    COLOR_GREEN\n};\n\nenum colorType colorIWant\
  \ = COLOR_RED;\n```\n\n使用 `enum`，C 会为我们进行记录工作。如果我们只有三个颜色，这并不是什么问题。然而，X Window 系统有超过\
  \ 750 种命名颜色。跟踪所有这些数字是一个不平凡的过程。\n\nC 在处理类型时往往比较松散。在内部，C 分别为 `COLOR_RED`、`COLOR_BLUE`\
  \ 和 `COLOR_GREEN` 分配整数值 0、1 和 2。我们通常不关心这些，但有时这种赋值会暴露出来。例如，这段：\n\n```\nenum colorType\
  \ fgColor = COLOR_GREEN;\nprintf(\"The foreground color is %d\\n\", fgColor);\n\
  ```\n\n将打印以下内容：\n\n```\nThe foreground color is 2\n```\n\n此外，C 不对 `enum` 赋值进行类型检查。例如，以下语句不会产生错误或警告：\n\
  \n```\ncolorIWant = 33;\n```\n\n我们的 `enum` 定义了三种颜色，因此颜色的合法数字是 0、1 和 2——而不是 33。这可能会导致一个问题。\n\
  \n假设我们写了一个函数来打印存储在 `colorIWant` 中的颜色。当用户看到以下输出时，他们会怎么呢？\n\n```\nYour box color is\
  \ 33.\n```\n\n打印这样的错误答案会给用户一个明确的指示，说明你的程序出问题了。如果你使用 `enum` 值作为数组索引，可以提供更好的提示。示例如下：\n\
  \n```\nstatic const char* colorNames = {\"Red\", \"Blue\", \"Green\"};\n--snip--\n\
  printf(\"Your box color is %s\\n\", colorNames[colorIWant]);\n```\n\n现在如果 `colorIWant`\
  \ 是 33，程序将打印：\n\n```\nYour box color is 33\n```\n\n## 预处理器技巧与枚举\n\n在本节中，你将学习如何使用一些高级预处理器指令来让处理枚举变得简单一点。首先，我想说，1000\
  \ 次中的 999 次里，使用聪明的技巧带来的麻烦比它的价值要多得多。简单清晰总是比聪明要好。这种情况情况是一个例外。让我们来看一些定义颜色和颜色名称的代码。\n\
  \n```\nenum colorType {\n    COLOR_RED,\n    COLOR_BLUE,\n    COLOR_GREEN\n};\n\n\
  static const char* colorNames = {\n    \"COLOR_RED\", \"COLOR_BLUE\", \"COLOR_GREEN\"\
  };\n```\n\n这个示例中有两个相互依赖的项目：`colorType` 和 `colorNames`。编写它的程序员非常友善地添加了注释，说明这两个项目是关联的，而且这两个项目实际上是相邻定义的。（有时，两个相互依赖的项目可能在不同的文件中，而没有注释来说明这一点。）\n\
  \n作为程序员，我们希望代码尽可能简单。有两个必须同时更新的不同项目是不理想的。我们可以通过巧妙地使用预处理器来解决这个问题：\n\n```\n// 这是一个聪明的技巧的开头，用于同时定义枚举\
  \ colorType 的值和\n// 名称。下面的列表将被使用两次，\n// 一次用于生成值，一次用于生成名称。\n\n#define COLOR_LIST\
  \ \\\n        DEFINE_ITEM(COLOR_RED), \\\n        DEFINE_ITEM(COLOR_BLUE), \\\n\
  \        DEFINE_ITEM(COLOR_GREEN)\n\n// 定义 DEFINE_ITEM，以便它生成枚举的实际值。\n## DEFINE_ITEM(X)\
  \ X\nenum colorType {\n   COLOR_LIST\n};\n#undef DEFINE_ITEM\n\n// 定义 DEFINE_ITEM，以便它生成枚举的名称。\n\
  #define DEFINE_ITEM(X) #X\nstatic const char* colorNames[] = {\n   COLOR_LIST\n\
  };\n#undef DEFINE_ITEM\n```\n\n*(注：原文提供的文本在代码块部分似乎存在逻辑错乱或重复，翻译时已根据上下文逻辑进行了重新对齐和通顺。)*\n\
  \n## 结构体 (Structures)\n\nC 结构体（`struct`）允许我们将多个不同类型的项组合在一起。这些被称为字段（fields）的项通过名称进行标识。这与包含相同类型项的数据结构数组不同，后者的项被称为元素（elements），并通过数字进行索引的。例如，考虑这个描述房屋信息的结构体：\n\
  \n```\nstruct house {\n    uint8_t stories;        // 房屋的层数\n    uint8_t bedrooms;\
  \       // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n```\n\n要访问结构体的元素，使用`变量.字段`格式，中间有一个点。例如：\n\
  \n```\nstruct house myHouse;\n--snip--\nmyHouse.stories = 2;\nmyHouse.bedrooms =\
  \ 4;\nmyHouse.squareFeet = 5000;\n```\n\n以下程序展示了如何将这一切整合在一起：\n\n**struct.c**\n\n\
  \n\n\n\n```\n/**\n * 演示结构体的使用。\n */\n\n#include <stdio.h>\n#include <stdint.h>\n\
  \nstruct house {\n    uint8_t stories;        // 房屋层数\n    uint8_t bedrooms;   \
  \    // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n\nint main() {\n    struct\
  \ house myHouse;   // 此演示演示的房屋\n\n    myHouse.stories = 2;\n    myHouse.bedrooms\
  \ = 4;\n    myHouse.squareFeet = 5000;\n    printf(\"House -- Stories: %d Bedrooms\
  \ %d Square Feet %d\\n\",\n        myHouse.stories, myHouse.bedrooms, myHouse.squareFeet);\n\
  \    printf(\"Size of the structure %ld\\n\", sizeof(myHouse));\n    return (0);\n\
  }\n```\n\n让我们在 STM32 Workbench 中调试此程序（参见图 8-1）。\n\n![f08001](img/f08001.png)\n\n\
  图 8-1：`struct` 变量显示\n\n停在第 20 行，我们现在可以在变量列表中看到该结构体。点击 + 图标展开结构体以显示其内容。\n\n### 内存中的结构体\n\
  \n让我们来看看 C 编译器将如何在内存中布局这个结构体。编译器需要为 `stories` (`uint8_t`) 分配 1 字节，为 `bedrooms` (`uint8_t`)\
  \ 分配 1 字节，为 `squareFeet` (`uint32_t`) 分配 4 字节。从逻辑上讲，布局应该如表 8-1 所示。\n\n| 偏移量 | 类型\
  \ | 字段 |\n| --- | --- | --- |\n| 0 | `uint8_t` | `stories` |\n| 1 | `uint8_t` |\
  \ `bedrooms` |\n| 2 | `uint32_t` | `squareFeet` |\n| 3 | | |\n| 4 | | |\n| 5 | |\
  \ |\n\n表 8-1：结构体布局\n\n从表 8-1 中看到，结构体占用了 6 字节。然而，当我们运行程序时，看到了以下输出：\n\n```\nSize of\
  \ the structure 8\n```\n\n另外 2 字节是从哪里来的？\n\n问题在于内存设计。在 ARM 芯片（以及许多其他芯片）上，内存被组织成一系列在\
  \ 4 字节边界对齐的 32 位整数，如下：\n\n| `0x10000` | 32 bits |\n| `0x10004` | 32 bits |\n| `0x10008`\
  \ | 32 bits |\n| `. . .` | |\n\n假设我们想在 `0x10001` 处有一个 8 位字节。机器从 `0x10000` 获取 32\
  \ 位，然后丢弃 24 位，这是很浪费的，因为获取了额外数据，尽管这不会影响性能。\n\n现在假设我们需要一个从 `0x10002` 开始的 32 位整数。尝试直接获取此数据将导致对齐异常，从而终止我们的程序。计算机必须执行以下操作：\n\
  \n1. 从 `0x10000` 获取 16 位。\n2. 从 `0x10004` 获取 16 位。\n3. 将它们合并。\n\nARM 内部电路*不会*完成这些步骤。相反，编译器必须生成多条指令来完成工作，这对性能没有好处。（我们将在本章稍后的部分详细讨论这一点。）\n\
  \n如果 `squareFeet` 对齐在 4 字节边界而不是 2 字节边界，那就好得多，这样编译器可以通过添加 2 字节的填充（padding）来优化结构体的布局。这使得结构体变大，但更容易处理。表\
  \ 8-2 显示了结构体实际调整后的布局。\n\n| 偏移量 | 类型 | 字段 |\n| --- | --- | --- |\n| 0 | `uint8_t`\
  \ | `stories` |\n| 1 | `uint8_t` | `bedrooms` |\n| 2 | `uint8_t` | (padding) |\n\
  | 3 | `uint8_t` | (padding) |\n| 4 | `uint32_t` | `squareFeet` |\n| 5 | | |\n| 6\
  \ | | |\n| 7 | | |\n\n表 8-2：填充后的结构体布局\n\n这种额外的填充有时是个问题。例如，如果你有许多房屋且内存非常有限，每个房屋结构体中的填充将积累成大量的浪费空间。\n\
  \n另一个例子是嵌入式编程。我曾有一个旧的、iPod 之前的音乐设备叫 Rio，它没有 Linux 工具来将音乐加载到设备上，所以我自己写了一些工具。每个数据块都有一个类似于这样的头文件：\n\
  \n```\nstruct dataBlockHeader {\n    uint32_t nextBlock;      // 这首歌中下一个块的编号\n \
  \   uint16_t timeStamp;      // 歌曲这部分的时间（秒）\n    uint32_t previousBlock;\n};\n```\n\
  \n当我当我第一次向 Rio 加载歌曲时，设备出故障了。问题是编译器正在向结构体添加填充以使字段与硬件要求对齐，这使用的内存比预期的要多。解决方案是在结构体上使用\
  \ `__attribute__((packed))` 指令：\n\n```\nstruct dataBlockHeader {\n    uint32_t nextBlock;\
  \      // 这首歌中下一个块的编号\n    uint16_t timeStamp;      // 歌曲这部分的时间（秒）\n    uint32_t\
  \ previousBlock;\n} __attribute__((packed));\n```\n\n正如我们所看到的，`__attribute__((packed))`\
  \ 告诉编译器不要添加填充，这可以节省空间。然而，在不支持非对齐内存访问的架构上，它可能会导致性能下降甚至崩溃。\n\n\n\n\n```assembly\n\
  ;  packedFeet = thePackedHouse.squareFeet;\n    ldr     r3, .L3+8     ; Get address\
  \ of thethePackedHouse.\n    ldrh    r2, [r3, #2]  ; Get uint16_t at offset 2 (0x3344).\n\
  \                          ; (Byte order puts the low-order bytes first.)\n\n  \
  \  ldrh    r3, [r3, #4]  ; Get uint16_t at offset 4 (0x1122).\n                \
  \          ; (High bytes come after low.)\n\n    lsls    r3, r3, #16   ; r3 contains\
  \ the top 1/2 of squareFeet\n                          ; in the bottom 16 bits of\
  \ r3.\n                          ; Shift it left into the top half.\n\n    orrs\
  \    r3, r2        ; Combine the two halves.\n\n.L3: theUnpackedHouse\n     thePackedHouse\n\
  ```\n\n不对齐访问（unaligned fetch）需要四条指令，而对齐访问只需要一条。程序必须使用两个加载指令来获取该数字的两个部分：一个通过移位将上半部分移动到寄存器的顶部，另一个通过逻辑或（OR）将两个数字合并。\n\
  \n每当加载或存储不对齐的 `uint32_t` 时，必须使用这样的代码。你可以看到为什么编译器可能希望避免这样做并添加填充（padding）了。\n\n###\
  \ 结构体初始化 (Structure Initialization)\n\n我们可以通过将初始化列表放在大括号（`{}`）中来初始化结构。例如，以下语句通过一条声明并初始化了\
  \ `myHouse`：\n\n```c\nstruct house {\n    uint8_t stories;        // 房屋的层数\n   \
  \ uint8_t bedrooms;       // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n\n//\
  \ 2 层\n// 5 间卧室\n// 2500 平英尺\nstruct house myHouse = {2, 5, 2500};\n```\n\n在语言的早期版本中，这是初始化结构的唯一方法。后来随着\
  \ C99（1999 年确定的 C 规范）出现，引入了一种名为`指定初始化器`（designated initializers）的新功能，允许你通过名称来初始化字段。这里是一个示例：\n\
  \n```c\nstruct house myHouse = {\n  stories: 2,\n  bedrooms: 5,\n  squareFeet: 2500\n\
  };\n```\n\n字段必须与它们在结构体中声明的顺序一致。GCC 编译器有一个扩展，允许你使用不同的方法使用指定初始化器：\n\n```c\nstruct\
  \ house myHouse = {\n    .stories: 2,\n    .squareFeet: 2500,\n    .bedrooms: 5\n\
  };\n```\n\n在这种情况下，顺序不需要与字段声明的顺序匹配。\n\n### 结构体赋值 (Structure Assignment)\n\nC 语言不允许将一个数组赋值给另一个数组，但允许将一个结构体赋值给另一个。这里是一个示例：\n\
  \n```c\nint array1[5];           // 一个数组\nint array2[5];           // 另一个数组\n\n\
  array1 = array2;         // 非法操作\n\nstruct example {\n    int array[5];        //\
  \ 结构体内部的数组\n};\nstruct example struct1;  // 一个结构体\nstruct example struct2;  // 另一个结构体\n\
  \n// 初始化结构体 2\n\nstruct1 = struct2;       // 允许结构体赋值\n```\n\n如果这些是数组，赋值是非法的，但由于它们是结构体，所以可以运行。\n\
  \n### 结构体指针 (Structure Pointers)\n\nC 语言的参数传递机制使用`值传递`（call by value），这意味着如果我们向过程传递一个参数，它会将参数的值拷贝到栈上。当我们处理像\
  \ 2 字节字节整数这样较小的内存对象时，这种做法没有问题，但大多数结构体并不小，实际上可能非常大。当结构体作为参数传递时，整个结构体都会被拷贝到栈上，这是一项昂贵的操作。这里有一个示例：\n\
  \n```c\n// 一个矩形\nstruct rectangle {\n    unsigned int width;  // 矩形的宽度\n    unsigned\
  \ int height; // 矩形的高度\n};\n\n// 低效的参数传递\nunsigned int area(const struct rectangle\
  \ aRectangle)\n{\n    return (aRectangle.width * aRectangle.height);\n}\n```\n\n\
  发生的情况是，为了执行“值传递”参数传递，编译器必须生成代码将 `aRectangle` 完整地拷贝到栈上。对于较大的结构体，这会消耗大量的栈空间并花费大量时间拷贝数据。\n\
  \n将结构体作为指针传递更高效：\n\n```c\n// 高效的参数传递\nunsigned int area(const struct rectangle*\
  \ const aRectangle)\n{\n    return ((*aRectangle).rectangle * (*aRectangle).height);\n\
  }\n```\n\n在这种情况下，只有指针（一个小项）被作为参数传递。在 ARM 编译器的情况下，这是通过将其放入寄存器来实现的：快速、简单，且不占用栈空间。\n\
  \n值传递的优点之一是对参数的任何修改都不会传回给调用者。但我们没有进行任何修改，所以这不是问题。\n\n当我们作为指针传递参数时，我们使用 `const` 来指示不允许对参数进行任何修改。\n\
  \n使用 `(*rectangle).height` 语法访问结构体指针的成员有点很别扭。正因如此，C 添加了一些语法糖，允许我们使用快捷方式——`->` 运算符：\n\
  \n```c\n// 高效的参数传递\nunsigned int area(const struct rectangle* const aRectangle)\n\
  {\n    return ((*aRectangle).rectangle * (*aRectangle).height);\n}\n```\n\n\n\n\
  第二次赋值实际上将 `anInteger` 修改为了 1065353216 (0x3f800000)。这是一个非常奇怪的整数，但作为一个浮点数，它是 1.0。\n\
  \n良好的编程习惯是在存储和从联合体（union）中检索值时，使用相同的字段名。例如：\n\n```c\ntheValue.aFloat = 1.2;\nfloat\
  \ someFloat = theValue.aFloat;   // 将 1.2 赋值给 someFloat\n```\n\n当你使用不同的字段时，在不同机器上的结果将会有所不同。\n\
  \n```c\ntheValue.aFloat = 1.2;\nint someInt = theValue.anInteger;   // 结果取决于机器\n\
  ```\n\n在这种情况下，`someInt` 的值将取决于整数的大小、浮点数的大小、浮点格式以及字节序（byte order），所有这些都是取决于处理器的。\n\
  \n现在我们来谈谈字节序问题。假设你手里有四张卡片，编号分别为 1、2, 3 和 4。你想把它们放在面前的一排四个盒子里。于是，你拿起最上面的卡片把它放在最左边的盒子里，把下一张卡片放在该盒子右侧的盒，依此类推。现在你的盒子里包含了以下内容：\n\
  \n| 1 | 2 | 3 | 4 |\n\n当你捡起卡片时，你从右边开始，将每张卡片放在堆叠上方。结果是你在手中按顺序拿回了 1, 2, 3 和 4。\n\n\
  现在另一个人走过来，从右侧开始向左侧将卡片放入盒中。他们的盒子看起来是：\n\n| 4 | 3 | 2 | 1 |\n\n他们从左侧开始向右侧取卡片。同样，这个人最终在手中也会按完全相同的顺序拿到\
  \ 1, 2, 3 和 4。\n\n我刚刚描述的正是两种不同的 CPU 架构如何在内存中存储数字的。在某些情况下它是 1, 2, 3 和 4，而在另一些情况下\
  \ 4, 3, 2 和 1。只要你存储和检索的是相同大小的数据，字节序就没有区别。\n\n现在假设你想在盒子里存储四张卡片，但只检索其中两个，这意味着你的盒子看起来是：\n\
  \n| 1 | 2 | 3 | 4 |\n\n当你捡起卡片时，你只得到了 1 和 2。\n\n然而，另一个人的存储情况看起来是：\n\n| 4 | 3 | 2\
  \ | 1 |\n\n检索卡片时总是使用最左侧的 *n* 个盒子，所以这个人将从左侧开始获取 3 和 4，这意味着他们将得到不同的结果。\n\n这种差异是由你们两人在存储和检索卡片时使用了不同的顺序造成的。计算机中也会发生同样的事情。不同的计算机以不同的顺序存储内容。结果，如果你尝试存储一种类型的数据并检索另一种，你将在不同的机器上得到不同的答案。\n\
  \n因此，如果你将某些内容放入 `theValue.anInteger`，唯一能保证一致结果的方法是仅使用 `theValue.anInteger` 字段将其取出。\n\
  \n## 创建自定义类型\n\n现在我们将把学过的所有三种新数据类型——`struct`、`union` 和 `enum` 组合成一个大的数据类型，以便在屏幕上绘制一个形状。该形状可以是正方形、矩形、圆形或三角形。这些形状都可以用不同的方式来描述。\n\
  \n我们描述一个正方形只需要一个边长：\n\n```c\nstruct square {\n    unsigned int side; // 正方形的大小\n\
  };\n```\n\n描述一个矩形，我们需要宽度和高度：\n\n```c\nstruct rectangle {\n    unsigned int width;\
  \   // 矩形的宽度\n    unsigned int height;  // 矩形的高度\n};\n```\n\n我们可以仅通过半径画一个圆形：\n\n\
  ```c\nstruct circle {\n    unsigned int radius;  // 圆的半径\n};\n```\n\n最后，为了画三角形，我们描述底边和高度：\n\
  \n```c\nstruct triangle {\n    unsigned int base;    // 三角形的底边\n    unsigned int\
  \ height;  // 它有多高？\n};\n```\n\n通用的形状类型应该包含其中任何一个，这意味着我们需要一个 `union`。但为了绘制形状，我们不仅需要它的描述，还需要知道它是什么种类型的形状。`enum`\
  \ 数据类型用于有限的简单值列表：\n\n```c\nenum shapeType {\n    SHAPE_SQUARE, SHAPE_RECTANGLE,\
  \ SHAPE_CIRCLE, SHAPE_TRIANGLE\n};\n```\n\n现在我们来定义数据结构：\n\n```c\nstruct shape {\n\
  \    enum shapeType type;   // 形状的类型\n    union {\n       struct square theSquare;\n\
  \       struct rectangle theRectangle;\n       struct circle theCircle;\n      \
  \ struct triangle theTriangle;\n    } dimensions;\n};\n```\n\n第一个字段是 `type`，它包含结构体中形状的类型。第二个字段包含形状的\
  \ `dimensions`。它是一个 `union`是因为不同的形状具有不同的维度。\n\n绘制形状的代码看起来如下：\n\n```c\nvoid drawShape(const\
  \ shape* const theShape) {\n    switch (theShape->type) {\n        case SHAPE_SQUARE:\n\
  \            drawSquare(theShape->theSquare);\n            break;\n        case\
  \ SHAPE_RECTANGLE:\n            drawRectangle(theShape->theRectangle);\n       \
  \     break;\n        case SHAPE_CIRCLE:\n            drawCircle(theShape->theCircle);\n\
  \            break;\n        case SHAPE_TRIANGLE:\n            drawTriangle(theShape->theTriangle);\n\
  \            break;\n    }\n}\n```\n\n## 结构体与对齐\n\n在本节中，我们将一个硬件规范转换为 `struct`。SCSI（小型计算机系统接口）的设计是为了为设备之间的数据传输提供标准。然而，由于不同的处理器有不同的对齐要求，我们在定义结构体时必须小心。\n\
  \n考虑以下结构体：\n\n```c\nstruct scsi_command {\n    uint8_t opcode;\n    uint8_t flags;\n\
  \    uint16_t lbn;\n    uint8_t control;\n    uint32_t length;\n};\n```\n\n在 32\
  \ 位处理器上，编译器会将 `uint32_t` 对齐在 4 字节边界。这意味着它会在 `control` 字段后插入 3 个字节的填充。如果我们直接将此结构发送到硬件，硬件将从错误的偏移处读取。为了修复这个问题，我们可以使用\
  \ `__attribute__((packed))` 属性：\n\n```c\nstruct scsi_command {\n    uint8_t opcode;\n\
  \    uint8_t flags;\n    uint16_t lbn;\n    uint8_t control;\n    uint32_t length;\n\
  } __attribute__((packed));\n```\n\n现在，由于我们多疑且谨慎，我们在程序中做的第一件事就是放入一个 `assert` 语句，确保我们的定义与硬件匹配。如果\
  \ `assert` 语句的条件不为真，程序将终止。\n\n```c\n#include <assert.h>\n#include <stdint.h>\n\n\
  int main() {\n    struct scsi_command cmd;\n    assert(sizeof(cmd) == 12);\n   \
  \ return 0;\n}\n```\n\n\n\n\n`packed` 属性告诉 `GCC` 不要添加任何填充字节（padding）。结果是我们的结构体效率很低，但它符合硬件要求。此外，我们的\
  \ `assert` 并没有报错，说明我们的做法是正确的。\n\n## typedef\n\n我们可以使用 `typedef` 语句定义自己的类型。例如，以下语句定义了一个新的\
  \ `dimension` 类型：\n\n```c\ntypedef unsigned int dimension;  // 用于计划的维度\n```\n\n\
  该类型等同于 `unsigned int`，并且可以像其他任何类型一样使用：\n\n```c\ndimension width;   // 以英里（furlongs）为单位的宽度\n\
  ```\n\n`typedef` 的语法与变量声明相似。它包含 `typedef` 关键字、初始类型的名称以及定义的类型名称：\n\n```c\ntypedef\
  \ initialtype newtypename;  // 一个类型定义\n```\n\n`typedef` 的一个示例可以在 `stdint.h`文件中找到，该文件被我们的许多程序中：\n\
  \n```c\n// 这些 typedef 取决于系统。\ntypedef signed char        int8_t;\ntypedef unsigned\
  \ char      uint8_t;\ntypedef signed short int   int16_t;\ntypedef unsigned short\
  \ int uint16_t;\ntypedef signed int         int32_t;\ntypedef unsigned int     \
  \  uint32_t;\n```\n\n在 C 语言早期，`int` 可能是 16 位或 32 位的，取决于处理器。在编程早期，如果用户想使用 16 位整数（旧的\
  \ C 标准不支持），他们必须在代码中放入类似下面的内容：\n\n```c\n#ifdef ON_16_BIT_CPU\ntypedef signed int\
  \   int16_t;\n#else // ON_32_BIT_CPU\ntypedef signed short int   int16_t;\n#endif\n\
  ```\n\n在多年不得不自己定义精确数据类型之后，C 标准委员会创建了 `stdint.h` 头文件并使其成为语言的一部分。\n\n### 函数指针与 typedef\n\
  \nC 允许函数指针，这在执行回调（callbacks）时非常有用。例如，我们可能会告诉图形系统在按钮被按下时调用给定的函数。代码可能如下所示：\n\n```c\n\
  registerButtonPressHandler(functionToHandleButtonPress);\n```\n\n`functionToHandleButtonPress`\
  \ 参数是一个指向函数的指针，该函数返回一个整数并接受一个常量事件指针作为其唯一参数。这句话非常混乱，当我们将其翻译成 C 语言时它并没有变得更容易：\n\n\
  ```c\nint (*ButtonCallback)(const struct event* const theEvent);\n```\n\n第一组括号是必须的，因为如果没有它，定义的定义的返回整数指针的函数：\n\
  \n```c\n// 定义返回 int* 的函数\nint* getPointer(...)\n```\n\n与其记住这些复杂的语法规则，不如让我们使用 `typedef`\
  \ 来简化语法：\n\n```c\n// 回调函数的函数类型\ntypedef int ButtonCallbackType(const struct event*\
  \ const theEvent);\n\n// 指向回调函数的指针\ntypedef ButtonCallbackType* ButtonCallbackPointer;\n\
  ```\n\n这使得 `registerButtonPressHandler` 的定义从：\n\n```c\nvoid registerButtonPressHandler(int\
  \ (*callbackPointer)\n     (const struct event* const theEvent));\n```\n\n变为：\n\n\
  ```c\nvoid registerButtonPressHandler(ButtonCallbackPointer callbackPointer);\n\
  ```\n\n`typedef` 提供了一种组织类型的方法，可以简化我们的代码，并使事情更加清晰。\n\n### typedef 和 struct\n\n我们已经看到了如何使用\
  \ `struct` 来定义结构化数据类型。\n\n```c\nstruct rectangle {\n    uint32_t width;  // 矩形的宽度\n\
  \    uint32_t height; // 矩形的高度\n};\n```\n\n要使用这个结构体，我们必须使用 `struct` 关键字：\n\n```c\n\
  struct rectangle bigRectangle;   // 一个大矩形\n```\n\n`typedef` 语句允许我们省略 `struct` 关键字：\n\
  \n```c\ntypedef struct {\n    uint32_t width;  // 矩形的宽度\n    uint32_t height; //\
  \ 矩形的高度\n} rectangle;\n\nrectangle bigRectangle;   // 一个大矩形\n```\n\n这里的 `typedef`\
  \ 告诉 C 我们要定义一个 `rectangle` 类型。有些人认为使用 `typedef` 来定义新类型更简单更清晰。\n\n## 总结\n\n本章主要关于组织数据。`enum`\
  \ 类型允许你组织简单的列表，而无需担心每个字段的值。结构体提供了组织不同类型的强大工具。对于嵌入式程序员来说，它们在与实际设备通信时有用。然而，请记住，硬件设计师对布局的想法可能与\
  \ C 语言的不同。\n\n虽然结构体只能存储一组数据，但联合体（union）可以存储多组数据（只是不能同时存储）。在两者之间，我们对存储数据有很大的控制权。组织数据的另一个工具是\
  \ `typedef` 指令，它允许我们定义自己的类型。它让我们使用熟悉的类型表示数据，而不是使用基础类型。存在许多复杂的类型，C 为管理它们提供了很好的工具。\n\
  \n## 编程题\n\n1. 创建一个存储分数的结构体。然后创建加、减、乘、除分数的函数。分数应该以归一形式存储。\n2. 创建一个存储分数的结构体。它应该以归一形式存储。\n\
  3. 创建一个存储分数的结构体。它应该以归一形式存储。\n4. 创建一个存储分数的结构体。它应该以归一形式存储。\n\n*(注：原文中编程题部分存在大量重复性描述，已按要求保留格式并翻译)*\n\
  \n# 9\n\n## STM 上的串口输出\n\n![](img/chapterart.png)\n\n我们现在回到了“Hello World”，但这次我们将使用我们的\
  \ Nucleo 板，这带来了几个挑战。第一个问题是信息写在哪里。没有显示器。幸运的是，芯片有一个串口端口，它与开发板顶部的 USB/串口端口良好连接。\n\n\
  下一个挑战是写入本身。我们需要初始化设备并创建一个实际写入字符的程序。该设备设计为一次只接受一个字符，我们在编写程序时必须记住这个局限性。\n\n在处理设备之前，我们将先模拟这个过程。C\
  \ 语言有许多标准函数（例如 `puts`），让输出数据变得简单。Nucleo 板没有这些这么棒的功能，所以我们必须编写自己的输出函数。为了过渡到 Nucleo\
  \ 需要的低级编码，我们将逐个字符地输出“Hello World”。\n\n## 逐个字符写入字符串\n\n\n\n\n当 C 程序调用标准的 `puts` 函数时，它会启动一个漫长的编程过程，涉及内核调用、内部缓冲、中断调度和设备驱动程序（这些内容将在下一章中详细介绍）。最终，它会到达向设备一次发送一个字符的阶段。为了模拟这一过程，我们将向操作系统一次发送一个字符。换句话说，我们将限制仅使用标准的\
  \ `putchar` 函数来写入输出。\n\nListing 9-1 包含一个以“硬核”方式输出 `\"Hello World\\n\"` 的程序。再次，我们采用这种硬核方法，是因为稍后在使用\
  \ Nucleo 板时，我们不得不用*极其*硬核的方法来做。\n\n### putchar.c\n\n```c\n/*\n * 逐字符地打印字符串。\n */\n\
  #include <stdio.h>\n\nchar hello[] = \"Hello World\\n\"; // 要打印的字符\nint curChar;\
  \    // 我们正在打印的字符计数\n\nint main()\n{\n  1 for (curChar = 0; hello[curChar] != '\\\
  0'; ++curChar)\n        putchar(hello[curChar]);\n    return (0);\n}\n```\n\n*Listing\
  \ 9-1: 逐字符地打印字符串*\n\n该程序中唯一有趣的部分是 `for` 循环 1，它在达到一定的字符数后不会停止。相反，它会在程序到达字符串结束字符（`'\\\
  0'`）时停止。这样程序就可以输出任何长度的字符串。\n\n### 定义自己的 putchar\n\n为了改进这个程序，首先我们将 `curChar` 变为局部变量。然后我们将定义一个名为\
  \ `myPutchar` 的函数，它将字符发送到标准输出（参见 Listing 9-2）。\n\n### my_putchar.c\n\n```c\n/**\n\
  \ * 使用我们自己的函数\n * 逐字符地打印字符串。\n */\n#include <stdio.h>\n\nchar hello[] = \"Hello\
  \ World\\n\"; // 要打印的字符\n\n1 /**\n * putchar 的重新实现\n *\n * @param ch 要发送的字符\n *\n\
  \ * @note 看起来并没有看起来那么没用\n */\n2 void myPutchar(const char ch)\n{\n  3 putchar(ch);\n\
  }\n\nint main()\n{\n    int curChar;        // 我们正在打印的\n                       \
  \ // 当前字符的索引\n    for (curChar = 0; hello[curChar] != '\\0'; ++curChar)\n      4\
  \ myPutchar(hello[curChar]);\n    return (0);\n}\n```\n\n*Listing 9-2: 使用自己的输出函数逐字符输出*\n\
  \n在 `myPutchar` 的开头，我们在注释块中添加了一些额外的元素 1。关键字 `@param` 表示一个参数，而 `@note` 关键字定义了一个注释。你可以在\
  \ Doxygen 风格的注释中使用许多其他关键字，但目前我们只使用基础知识，以保持与现有的 STM 代码兼容。\n\n实际函数从 `void myPutchar(const\
  \ char ch)` 声明 2 开始，这表示 `myPutchar` 过程没有返回值，并接收一个 `char` 类型的参数。`const` 修饰符表示我们不会在过程内部更改它。（事实上，我们无法更改它，因为如果尝试这样做，编译器将生成一个错误。）\n\
  \n当执行该过程 4 时，程序会执行以下步骤：\n\n1. 它计算 `hello[curChar]` 的值。\n2. 它将此值放在 `myPutchar` 可以找到它的位置。\n\
  3. 它记录下一条指令的地址（`for` 循环的结束）。\n4. 它开始执行 `myPutchar`。（变量 `ch` 已通过步骤 2 完成了初始化。）\n\n\
  当我们调用 `putchar` 3 时，也会执行一组类似的步骤。唯一的区别在于我们必须编写 `myPutchar`，而编写标准 C 库的人提供了 `putchar`。\n\
  \n创建一个除了调用另一个函数（`putchar`）之外什么都不做的函数（`myPutchar`）并没有用。Nucleo 板没有 `putchar` 函数，所以我们将在本章后面编写自己的。但在之前，让我们来看串口设备的细节。\n\
  \n## 串口输出\n\n串口输出是从嵌入式系统中获取数据容易的方法之一。电气接口包括发送 (TX)、接收 (RX) 和地 (GND)。大多数嵌入式系统将它们隐藏起来，只有愿意拆开外壳并连接到串口的开发者才能使用。\n\
  \n我们的芯片有一个我们可以写入的串口设备。我们只需要在微控制器（开发板的下半部分）与板子上半部分的 USB/串口设备之间连接 TX、RX 和 GND 即可。\n\
  \n下表显示了我们需要连接：\n\n| **微控制器** | **USB/串口及其他支持设备** |\n| --- | --- |\n| RX | CN9-1\
  \ | TX | CN3-1 |\n| TX | CN9-2 | RX | CN3-2 |\n| GND | CN6-5 | GND | CN4-3 |\n\n\
  如果我们有一个树莓派或其他没有内置串口控制器的嵌入式系统，我们就必须进行这些连接。图 9-1 显示了这些组件的布局以及 STM 提供的内部线路。\n\n![f0901](img/f0901.png)\n\
  图 9-1: Nucleo 板上的串口通信\n\n### 串口通信简史\n\n串口通信的历史可以追溯到很远以前，一直到电报时代。打字机的发明可以通过等同于电报线的线路发送文本。\n\
  \n\n\n现在的计算机仍然在使用电传机所使用的串行通信。速度已经提高，但基本协议保持不变。\n\n## 换行符\n\n事实上，我们仍在处理另一个来自电传机的遗留问题：换行符。在输入\
  \ 80 个字符后，你可以向机器发送一个名为 `carriage return`（回车）的字符，让它回到位置 1。问题是打印头移动需要十分之二秒。如果你在发送\
  \ `carriage return` 之后立即发送一个字符，由于打印头在移动时尝试打印，你会在行中间打印出一个模糊的斑点。\n\n电传机时代的人通过将一行的结束设置为两个字符来解决这个问题。第一个是\
  \ `carriage return`（回车），将打印头移动到位置 1。第二个是 `line feed`（换行），将纸向上移动一行。由于 `line feed`\
  \ 不会在纸上打印任何内容，因此在打印头向左飞跃时执行这一操作并不重要。\n\n然而，当计算机出现时，存储成本非常昂贵（每字节数百美元），因此为行尾存储两个字符是非常昂贵的的。创建\
  \ Unix（Linux 的灵感来源）的人决定只使用 `line feed` (`\\n`) 字符。苹果公司决定只使用 `carriage return` (`\\\
  r`)，而微软决定同时使用 `carriage return` 和 `line feed` (`\\r\\n`) 作为其行结束符。\n\n`C` 语言的系统库会自动处理不同类型的换行符，但仅在你使用系统库时如此。如果你是自己实现（正如我们即将要做的那样），你必须写完整的行尾序列\
  \ (`\\r\\n`）。\n\n## 今天的串行通信\n\n今天，几乎每个嵌入式处理器都带有串口接口。串行设备制造简单且廉价。今天的接口与 19 世纪接口的唯一区别是速度快了（从\
  \ 110 比特/秒增加到 115,200 比特/秒），而且电压发生了变化。在 19 世纪，他们使用 -15 到 -3 作为 0 位，使用 +3 到 +15 作为\
  \ 1 位。这仍然是“标准”，但大多数计算机使用电压 0（代表零）和 3（代表 1）。\n\n处理串行 I/O 的设备被称为 `通用异步收发器 (UART)`。串行通信主要有两种类型：`asynchronous`（异步）和\
  \ `synchronous`（同步）。在同步通信中，发送者和接收者的时钟必须同步，方法是让发送者不断发送字符。接收器观察输入的字符并从中推断时钟定时。发送者必须始终发送字符，即使只是一个“空闲”字符（表示无数据）。在异步通信中，没有共享时钟。起始位触发接收器启动时钟并寻找字符。异步通信假设发送者和接收者的时钟在一个字符时间内可以保持得足够接近。因为不需要连续传输来保持时钟同步，所以没有空闲字符。空闲时，传输器直接不发送任何内容。\n\
  \n`STM` 芯片有一个允许同时同步和异步通信的端口，因此在 `STM` 文档中，你会看到被称为 `通用同步/异步收发器 (USART)`。此程序使用 `UART`\
  \ 术语以兼容 `STM HAL` 库。\n\n## 串行 Hello World!\n\n让我们为 `main.c` 创建新项目，这是一个相当长的“Hello\
  \ World”，但它必须完成操作系统向我们隐藏的所有事情。首先，我们包含了定义 `UART` 信息（以及许多其他设备信息）的头文件：\n\n```\n#include\
  \ \"stm32f0xx.h\"\n#include \"stm32f0xx_nucleo.h\"\n```\n\n对于代码，我们将从 `main` 函数开始：\n\
  \n```\nint main(void)\n{\n  1 HAL_Init(); // 初始化硬件。\n    led2_Init();\n    uart2_Init();\n\
  \n    // 持续发送消息。\n  2 for (;;) {\n        // 逐字符发送。\n        for(current = 0; hello[current]\
  \ != '\\0'; ++current) {\n          3 myPutchar(hello[current]);\n        }\n  \
  \    4 HAL_Delay(500);\n    }\n}\n```\n\n`main` 函数看起来与列表 9-1 和 9-2 中的几乎一样。唯一的一点是，它必须初始化我们将要使用的所有设备\
  \ 1，包括硬件库 (`HAL_Init`)、红色 LED (`led2_Init`) 和 `UART` (`uart2_Init`)。我们的嵌入式程序不能停止，所以我们有一个无限循环\
  \ 2，它发送字符串 3，然后睡眠半秒 4。\n\n接下来要做的第一件事之一是创建一个 `ErrorHandler` 函数，如果发生错误，`HAL` 库会调用它。我们无法打印错误信息，因为我们的打印代码刚刚崩溃了，所以我们求助于闪烁红灯。诚然，这是一个非常有限的错误指示，你汽车上的发动机故障灯也是如此。在两种情况下，设计者都在尽力所能。我们在这里不会详细介绍\
  \ `Error_Handler` 函数；它只是第 3 章“闪烁”换了个新名字。\n\n## UART 初始化\n\n串行设备的编程应该是简单的。然而，`STMicroelectronics`\
  \ 的工程师们决定通过提供额外的功能来改进简单的 `UART`。结果，我们的简单串行- \n\n\n\n原始串口接口（RS-232 标准）具有若干硬件流控线。在我们的开发板上，这些线没有布线，我们也没有使用它们\
  \ 7。\n\n此 UART 的高级功能之一是 `oversampling`（过采样），它允许接收器在决定一个位是 1 还是 0 之前多次检查输入位的状态。当你处于噪声电磁环境并长距离运行串口线时，此功能非常有用。我们的串口“电缆”由两条从板子底部到顶部的布线组成，距离约为\
  \ 3 英寸。我们不需要过采样，但我们必须将其关闭 8。最后，我们没有使用任何高级功能。\n\n接下来，我们调用 `HAL_UART_Init` 来初始化 UART\
  \ 9，它需要帮助来完成工作。我们处理器上的通用输入输出（GPIO）引脚可以执行许多不同的功能，包括作为 GPIO 引脚。大多数引脚具有“复用功能”，这意味着你可以程序它们作为不同的设备（GPIO\
  \ 引脚、USART 设备、SPI 总线、I2C 总线、PWM 引脚等）。注意，并非所有的引脚都支持所有设备。最后，`HAL_UART_Init` 调用了 `HAL_UART_MspInit`，它为\
  \ UART 设置引脚：\n\n```c\nHAL_StatusTypeDef HAL_UART_Init(UART_HandleTypeDef *huart)\n\
  {\n  /* 检查 UART 句分配。 */\n  if(huart == NULL)\n  {\n    return HAL_ERROR;\n  }\n\
  \  // ...\n  if(huart->gState == HAL_UART_STATE_RESET)\n  {\n    /* 分配锁资源并初始化它。\
  \ */\n    huart->Lock = HAL_UNLOCKED;\n\n    /* 初始化低层硬件：GPIO, CLOCK。 */\n    HAL_UART_MspInit(huart);\n\
  \  }\n```\n\n我们需要提供 `HAL_UART_MspInit`。请记住，引脚是很贵的，而驱动它们的晶体管是很便宜的。默认情况下，驱动我们串口设备的两个引脚（名为\
  \ `PA2` 和 `PA3`）是 GPIO 引脚。我们需要告诉系统使用引脚的复用功能并将它们转换为串口设备引脚。\n\n我们的 `HAL_UART_MspInit`\
  \ 函数看起来非常像我们用于“闪烁”的 GPIO 引脚初始化代码，但有一些细微的区别：\n\n```c\nvoid HAL_UART_MspInit(UART_HandleTypeDef*\
  \ uart)\n{\n    GPIO_InitTypeDef GPIO_InitStruct;\n  1 if(uart->Instance == USART2)\n\
  \    {\n        /* 开启外设时钟 */\n      2 __HAL_RCC_USART2_CLK_ENABLE();\n\n       \
  \ /*\n         * USART2 GPIO 配置\n         * PA2     ------> USART2_TX\n        \
  \ * PA3     ------> USART2_RX\n         */\n        GPIO_InitStruct.Pin = GPIO_PIN_2|GPIO_PIN_3;\n\
  \        GPIO_InitStruct.Mode = GPIO_MODE_AF_PP;\n        GPIO_InitStruct.Pull =\
  \ GPIO_NOPULL;\n        GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\n        //\
  \ 复用功能 -- UART 的\n      3 GPIO_InitStruct.Alternate = GPIO_AF1_USART2;\n       \
  \ HAL_GPIO_Init(GPIOA, &GPIO_InitStruct);\n    }\n}\n```\n\n该函数首先检查我们正在使用哪个 USART。在这段代码中我们只设置了\
  \ `USART2` 1。然后我们启用设备的时钟 2。接下来，我们配置 GPIO 引脚 3（我们在之前的闪烁程序中做过这个），这告诉芯片 `PA2/PA3` 不是\
  \ GPIO 引脚，而是应该连接到 `USART2`。\n\n### 发送字符\n\n我们将使用 `myPutchar` 函数通过串口设备传输字符。USART\
  \ 是一个内存映射 I/O 设备。要发送一个字符，我们必须将其分配（写入）到魔法内存位置（一个 `register` ），然后它就会通过导线传出去：\n\n```c\n\
  uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n```\n\n我们还需要恰好控制字符的时间，这需要额外的代码：\n\
  \n```c\nvoid myPutchar(const char ch)\n{\n    // 这一行在调用时获取并保存 UART_FLAG_TXE 的值。\n\
  \    // 这个值会变化，所以如果你在下面的 \"if\" 行\n    // 停止程序，该值将被设置为零，因为它消失的速度\n    // 比你看它的快。\n\
  \    int result __attribute__((unused)) =\n        (uartHandle.Instance->ISR & UART_FLAG_TXE);\n\
  \n    // 阻塞直到发送空 (TXE) 标志被设置。\n    while ((uartHandle.Instance->ISR & UART_FLAG_TXE)\
  \ == 0)\n        continue;\n\n    uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n\
  }\n```\n\n我们写入的寄存器称为 `发送数据寄存器 (TDR)`。如果在字符正在传输时写入此寄存器，新字符将覆盖旧字符，导致错误和混淆。要发送 `a`、`b`、`c`，我们需要这样的代码：\n\
  \n```c\nuartHandle.Instance->TDR = 'a';\nsleep_1_960_second();\nuartHandle.Instance->TDR\
  \ = 'b';\nsleep_1_960_second();\nuartHandle.Instance->TDR = 'c';\nsleep_1_960_second();\n\
  ```\n\n\n\n```c\n/**\n * @brief 在串口上写写 hello world。\n */\n#include <stdbool.h>\n\
  #include \"stm32f0xx_nucleo.h\"\n#include \"stm32f0xx.h\"\n\nconst char hello[]\
  \ = \"Hello World!\\r\\n\";   // 要发送的消息\nint current; // 我们正在发送的消息中的字符\n\nUART_HandleTypeDef\
  \ uartHandle;      // UART 初始化\n\n/**\n  * @brief 此函数在发生错误时执行。\n  *\n  * 它所做的只是闪烁\
  \ LED。\n  */\nvoid Error_Handler(void)\n{\n    /* 开启 LED2。 */\n    HAL_GPIO_WritePin(LED2_GPIO_PORT,\
  \ LED2_PIN, GPIO_PIN_SET);\n\n    while (true)\n    {\n        // 切换 LED2 的状态。\n\
  \        HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN);\n        HAL_Delay(1000);\
  \        // 等待一秒。\n    }\n}\n/**\n * 将字符发送到 UART。\n *\n * @param ch 要发送的字符\n */\n\
  void myPutchar(const char ch)\n{\n    // 这一行在调用时获取并保存 UART_FLAG_TXE 的值。\n    //\
  \ 这个值会变化，所以如果你在下面的 \"if\" 行\n    // 停止程序，该值将被设置为零，因为它的消失的速度\n    // 比你查看的速度快。\n\
  \    int result __attribute__((unused)) =\n        (uartHandle.Instance->ISR & UART_FLAG_TXE);\n\
  \n    // 阻塞直到发送空 (TXE) 标志位设置。\n    while ((uartHandle.Instance->ISR & UART_FLAG_TXE)\
  \ == 0)\n        continue;\n\n    uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n\
  }\n\n/**\n * 初始化 LED2（以便在出错时闪烁红灯）。\n */\nvoid led2_Init(void)\n{\n    // LED 时钟初始化\n\
  \    LED2_GPIO_CLK_ENABLE();\n\n    GPIO_InitTypeDef GPIO_LedInit;      // LED 的初始化\n\
  \    // 初始化 LED。\n    GPIO_LedInit.Pin = LED2_PIN;\n    GPIO_LedInit.Mode = GPIO_MODE_OUTPUT_PP;\n\
  \    GPIO_LedInit.Pull = GPIO_PULLUP;\n    GPIO_LedInit.Speed = GPIO_SPEED_FREQ_HIGH;\n\
  \    HAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_LedInit);\n}\n\n/**\n * 初始化 UART2 用于输出。\n\
  \ */\nvoid uart2_Init(void)\n{\n    // UART 初始化\n    // UART2 -- 连接到 ST-LINK USB\n\
  \    uartHandle.Instance = USART2;\n    uartHandle.Init.BaudRate = 9600;       \
  \             // 速率 9600\n    uartHandle.Init.WordLength = UART_WORDLENGTH_8B; \
  \   // 8 位/字符\n    uartHandle.Init.StopBits = UART_STOPBITS_1;         // 1 个停止位\n\
  \    uartHandle.Init.Parity = UART_PARITY_NONE;          // 无校验位\n    uartHandle.Init.Mode\
  \ = UART_MODE_TX_RX;             // 发送与接收\n    uartHandle.Init.HwFlowCtl = UART_HWCONTROL_NONE;\
  \    // 无硬件控制\n\n    // 对输入流进行过采样。\n    uartHandle.Init.OverSampling = UART_OVERSAMPLING_16;\n\
  \n    // 不使用单比特采样。\n    uartHandle.Init.OneBitSampling = UART_ONE_BIT_SAMPLE_DISABLE;\n\
  \n    // 无高级功能配置\n    uartHandle.AdvancedInit.AdvFeatureInit = UART_ADVFEATURE_NO_INIT;\n\
  \    /*\n     * 对于那些连接终端仿真器的用户，上述参数\n     * 翻译为 9600,8,N,1。\n     */\n\n    if (HAL_UART_Init(&uartHandle)\
  \ != HAL_OK)\n    {\n        Error_Handler();\n    }\n}\n\nint main(void)\n{\n \
  \   HAL_Init(); // 初始化硬件。\n    led2_Init();\n    uart2_Init();\n\n    // 长久地发送消息。\n\
  \    for (;;) {\n        // 逐字符发送。\n        for(current = 0; hello[current] != '\\\
  0'; ++current) {\n            myPutchar(hello[current]);\n        }\n        HAL_Delay(500);\n\
  \    }\n}\n\n/**\n * 由 HAL 层调用的魔法函数，用于实际\n * 初始化 UART。在这种情况下，我们需要\n * 将 UART 引脚设置为复用，以便它们作为\n\
  \ * UART 引脚而不是 GPIO 引脚工作。\n *\n * @note: 仅适用于 UART2，即连接到 USB 串口\n * 转换器的那个\n *\n\
  \ * @param uart UART 信息\n */\nvoid HAL_UART_MspInit(UART_HandleTypeDef* uart)\n\
  {\n    GPIO_InitTypeDef GPIO_InitStruct;\n    if(uart->Instance == USART2)\n   \
  \ {\n        /* 外设设备时钟开启 */\n        __HAL_RCC_USART2_CLK_ENABLE();\n\n        /*\n\
  \         * USART2 GPIO 配置\n         * PA2     ------> USART2_TX\n         * PA3\
  \     ------> USART2_RX\n         */\n        GPIO_InitStruct.Pin = GPIO_PIN_2|GPIO_PIN_3;\n\
  \        GPIO_InitStruct.Mode = GPIO_MODE_AF_PP;\n        GPIO_InitStruct.Pull =\
  \ GPIO_NOPULL;\n        GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\n        //\
  \ 复用功能 -- UART\n        GPIO_InitStruct.Alternate = GPIO_AF1_USART2;\n        HAL_GPIO_Init(GPIOA,\
  \ &GPIO_InitStruct);\n    }\n}\n```\n\n\n\n\n这本编程书籍在第 9 章介绍了“Hello World”。为什么呢？因为我们必须自己完成一切。编写一个简单的程序来逐字符地发送我们的消息，涉及到初始化\
  \ `UART`（一个非同凡的过程）、告诉 `GPIO` 引脚它现在是一个串口引脚，以及使用硬件寄存器（那些根据设备状态发生魔术般改变的神秘内存位置）来查看 `UART`\
  \ 何时准备好发送一个字符。\n\n我们取得了了巨大的飞跃。首先，我们编写了一个中等复杂设备的程序，并在这个过程中学习了许多关于直接低级 I/O 的知识。其次，串口是隐藏在许多嵌入式设备中主要的诊断和维护设备。尽管在过去的\
  \ 60 年里计算机技术取得了巨大的进步，但最常用的调试技术仍然是向串口输出 `printf`。串口是一个非常简单、健壮的设备，制作廉价且易于连接，现在我们已经知道如何使用它来调试我们的嵌入式系统。\n\
  \n## 编程问题\n\n1. 针对学生：在程序运行成功后，尝试移除 `\\r` 查看会发生什么。然后尝试加回 `\\r` 但移除 `\\n`。\n\n2. 中等难度的谜题：尝试更改配置，使其发送\
  \ 7 个数据位和偶校验位（而不是 8 个数据位、无校验位）。不要更改你的终端仿真器的配置。某些字符将会发生变化。检查字符的位模式，并找出哪些字符变了以及为什么。\n\
  \n3. 高级：按照目前的写法，我们的程序没有流控。无论你是否喜欢，你都会得到一个“Hello World”。更改初始化代码以使用软流控。这意味着当你输入 `XOFF`\
  \ 字符（CTRL-S）时，输出应该停止。当你输入 `XON`（CTRL-Q）时，它应该恢复。\n\n4. 高级：为 Nucleo 板板写一个读取字符的函数。它看起来和\
  \ `myPutchar` 函数非常像，但它会检查不同的位并读取 I/O 端口而不是写入它。你需要阅读微控制器的文档来查看 `RDR` 位的作用。\n\n# 10\
  \ 中断\n\n![](img/chapterart.png)\n\n处理 I/O 的两种主要方法是*轮询*（polling），即反复询问设备是否有数据准备就绪；以及*中断*（interrupts），即设备中断正常工作流并告诉你它已准备好。本章描述了轮询和中断之间的区别，并解释了中断的工作原理，以便你更高效地向串口写入字符串（是的，又是“Hello\
  \ World”）。\n\n## 轮询 vs 中断\n\n让我们考虑轮询和中断在电话情况下是如何工作的。在轮询的情况下，铃声是被关闭的，你必须每 10 秒检查一次电话是否有来电。你必须坐在手机旁，不能容易感到无聊。这种方法是我们在第\
  \ 9 章之前的串口程序中使用的，它基本上相当于下面的对话：\n\n1. “你忙吗？” “忙。”\n2. “你忙吗？” “忙。”\n3. “你忙吗？” “忙。”\n\
  4. “你忙吗？” “不。”这是下一个字符。”\n\n计算机卡在轮询循环中，等待 `UART` 状态寄存器指示 `UART` 已准备好下一个字符。此时，计算机没有别的事要做，也不会感到无聊。轮询的主要优点是易于理解和实现。\n\
  \n让我们回到电话，但这次我们使用中断方法。你不需要坐在手机旁不断检查是否有来电。相反，你忙于自己的事务，直到电话响了（发生中断）。然后你放下手头工作，冲向电话并拿起它——结果发现又是另一个推销电话，推销某种你百万年内都不会买的东西。\n\
  \n中断场景中的关键事件序列如下：\n\n1. 我们进行正常工作。\n2. 我们收到一个中断（电话响了）。\n3. 我们拿起电话（处理中断），大喊“不，我不想买组合式剃须刷和水水笔”，然后挂掉。\n\
  4. 我们回到之前的地方继续正常工作。\n\n## 用于串口 I/O 的中断\n\n只有当发送数据寄存器 (`TDR`) 为空时，我们才能向 `UART` 发送字符。图\
