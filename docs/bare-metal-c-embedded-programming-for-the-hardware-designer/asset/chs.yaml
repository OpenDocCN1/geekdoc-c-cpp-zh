  \ 位。额外的 2 个位是起始位和停止位。停止位。\n\n### 中断例程\n\n当中断发生时，CPU 调用一个中断函数，位于由 CPU 设计的固定地址。早期的\
  \ CPU 对所有中断只有*一个*地址，因此代码必须通过检查来查看是什么中断了：\n\n```c\nif (diskInterrupt)      { handleDiskInterrupt();\
  \ return;}\nif (serialInterrupt)    { handleSerialInterrupt(); return;}\nif (keyboardInterrupt)\
  \  { handleKeyboardInterrupt(); return;}\n```\n\n如今，即使是简单的芯片也有许多不同的设备。检查它们是一个耗时的过程。结果，芯片（包括我们的\
  \ ARM 芯片）现在使用*向量中断*，这意味着每个外设都有自己的中断地址。来自 `UART` 的中断将调用一个地址的中断程序，而来自 `UART2` 的中断将到另一个地址（具体为\
  \ `USART2_IRQHandler`），依此类推。\n\n中断向量定义在 *startup/startup_stm32f30x8.S* 文件中：\n\n\
  ```assembly\ng_pfnVectors:\n  .word  _estack\n  .word  Reset_Handler\n  .word  NMI_Handler\n\
  \  .word  HardFault_Handler\n## 许多处理器\n  .word  USART1_IRQHandler              /*\
  \ USART1 */\n  .word  USART2_IRQHandler              /* USART2 */\n```\n\n随后，代码定义了\
  \ `USART2_IRQHandler` 符号：\n\n```assembly\n .weak      USART2_IRQHandler\n  .thumb_set\
  \ USART2_IRQHandler,Default_Handler\n```\n\n第二个指令（`.thumb_set`）将过程 `USART2_IRQHandler`\
  \ 定义为 `Default_Handler`。\n\n第一个 `.weak` 指令将其定义为*弱符号*。如果它是普通符号且我们尝试定义自己的 `USART2_IRQHandler`，链接器将中止并显示\
  \ `Duplicate symbol` 错误信息。但由于符号是弱的，链接器将丢弃弱定义并使用我们提供的。\n\n*startup/startup_stm32f30x8.S*\
  \ 文件之后定义了 `Default_Handler`：\n\n```assembly\n .section .text.Default_Handler,\"\
  ax\",%progbits\nDefault_Handler:\nInfinite_Loop:\n  b Infinite_Loop\n```\n\n\n\n\
  \n中断的默认响应是无限循环，这使得机器几乎完全无法使用（我之所以说“几乎完全无法”，是因为机器仍然会对调试器和重置信号做出响应）。\n\n我们将编写自己的 `USART2_IRQHandler`\
  \ 来在 TDR（传输数据寄存器）为空时做出响应，从而用一个更有实用的处理程序替换默认处理程序。\n\n## 使用中断写入字符串\n\n现在，让我们修改第 9\
  \ 章中的串行 I/O 程序，使其使用中断而不是轮询来写入字符串。上层（主程序）和下层（中断例程）之间通信的只有一个全局变量：\n\n```c\nconst char*\
  \ volatile usart2String = NULL;     // 我们要发送的字符串\n```\n\n`const` 修饰符告诉 C 语言字符数据是常量，我们永远不会尝试修改它。`volatile`\
  \ 修饰符告诉 C 语言该变量可能会被正常 C 程序流之外的东西（例如中断函数）随时更改。\n\n为了明确这一点，由于此时 C 语言的语法有点复杂，`const`\
  \ 出现在 `char` 声明之前，表示字符数据是常量。它没有出现在指针操作符（`*`）之后，因此指针不是常量的。`volatile` 修饰符出现在指针操作符之后，表示指针可能会被更改。指针操作符后缺少\
  \ `const` 修饰符意味着程序可以更改此值。\n\n我们需要小心处理被两层使用的任何变量。幸运的是，对于这个示例，这只有一个变量 `usart2String`。下面的列表显示了该变量的工作流：\n\
  \n### 上层（主程序）\n\n1. 等待 `usart2String` 变为 `NULL`。\n2. 将它指向我们要发送到输出的字符串。\n3. 发送第一个字符。\n\
  4. 增加指针。\n5. 启用 UART 中断。\n\n### 下层（中断）\n\n1. 如果到达了字符串末尾，将 `usart2String` 设置为 `NULL`。\n\
  2. 确认 UART 接收到了中断。\n3. 发送字符串指向的字符。\n4. 增加指针。\n\n上层和下层都会增加指针。在启用中断时，我们需要非常小心，以确保两层不会尝试同时使用该指针。上层在\
  \ `usart2String == NULL` 之前不会执行任何操作，而下层只有在数据耗尽并禁用 UART2 中断时才会将 `usart2String` 设置为\
  \ `NULL`。上层通过在执行增加后不再启用中断来保护自己。因此，中断例程无法扰乱代码。\n\n这种分析极其重要。当不执行或执行得不当时，程序将会失败，且失败会在随机时间产生随机结果。这些结果会带来一个极其困难、且难以调试的问题。\n\
  \n我实际上花了大约三的时间才发现其中一个 bug。这个问题只出现在一个客户身上，而且大约每两个月发生一次。我们完全无法在实验室重现它。幸运的是，客户非常和蔼，愿意与我们合作解决解决方案。在本章稍后的部分，我们将探索如果不进行这种分析会发生什么，并考虑一些诊断中断相关\
  \ bug 技术。\n\nListing 10-1 包含了中断驱动的串行 I/O 程序。\n\n```c\n/**\n  * @brief   向串行 I/O\
  \ 写入 Hello World。\n  * 使用中断代替轮询。\n*/\n\n#include <stdbool.h>\n#include \"stm32f0xx_nucleo.h\"\
  \n#include \"stm32f0xx.h\"\n\nconst char hello[] = \"Hello World!\\r\\n\";   //\
  \ 要发送的消息\nint current; // 我们正在发送的消息中的字符\n\nUART_HandleTypeDef uartHandle;      //\
  \ UART 初始化\n\n... Error_Handler 与 Listing 9-3 相同 ...\n\nconst char* volatile usart2String\
  \ = NULL;       // 我们要发送的字符串\n/**\n * 处理 USART2 中断。\n *\n * 由芯片的中断系统神奇地调用。\n * 名称是固定的，因为启动代码\n\
  \ * 填充了中断向量表。\n */\nvoid USART2_IRQHandler(void)\n{\n    if ((uartHandle.Instance->ISR\
  \ & USART_ISR_TXE) != 0) {\n        // 这不应该发生，但如果真的发生了，我们不希望崩溃。\n        if (usart2String\
  \ == NULL) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n        if (*usart2String == '\\0') {\n       \
  \     usart2String = NULL;        // 我们已经处理完字符串。\n            // 关闭中断。\n       \
  \     uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n            return;\n   \
  \     }\n        uartHandle.Instance->TDR = *usart2String; // 将字符发送到 UART。\n   \
  \     ++usart2String;              // 指向下一个字符。\n        return;\n    }\n    // 因为我们启用的唯一中断是\
  \ TXE，我们不应该\n    // 到达这里。当我们启用其他中断时，我们需要在这里\n    // 放置代码来处理它们。\n}\n/**\n * 我们版本的\
  \ puts\n *\n * 将给定的精确字符串输出到输出\n *\n * @param str 要发送的字符串\n *\n * @note 假设 str 不为空\n\
  \ */\nvoid myuts(const char* str)\n{\n    // 如果有人正在发送字符串，等待它。\n    while (usart2String\
  \ != NULL)\n        continue;\n\n    // 告诉中断路由使用哪个字符串。\n    usart2String = str;\n\
  \n    uartHandle.Instance->TDR = *usart2String;  // 将字符发送到 UART。\n    ++usart2String;\
  \             // 指向下一个字符。\n    // 启用中断。\n    uartHandle.Instance->CR1 |= USART_CR1_TXEIE;\n\
  }\n\nint main(void)\n{\n    HAL_Init(); // 初始化硬件\n    USART_Init(); // 初始化 UART\n\
  \n    // 告诉我们需要中断\n    NVIC_EnableIRQ(USART2_IRQn);\n\n    // 持续发送消息\n    for (;;)\
  \ {\n        myuts(hello);\n        HAL_Delay(500);\n    }\n}\n\n... Error_Handler\
  \ 与 Listing 9-3 相同 ...\n```\n*Listing 10-1: 10.serial.c*\n\n### HAL_UART_MspInit\
  \ 和 HAL_UART_MspDeInit 函数\n\n### 程序细节\n\n`USART2_IRQHandler` 函数在发生中断时由硬件调用。\n\n\
  `NVIC_EnableIRQ` 函数初始化*嵌套向量中断控制器 (NVIC)*，这是一个在处理器接收到中断时决定做什么并启用中断的硬件。当处理器重置时，它会关闭所有中断，因此我们需要告诉它我们需要\
  \ USART2 中断。\n\n现在让我们看看 `myuts` 函数，它将字符串（而不是第 9 章中的 `myPutchar` 单个字符）发送到串行设备：\n\n\
  ```\nvoid myuts(const char* str)\n{\n    // 如果有人正在发送字符串，等待它。\n    while (usart2String\
  \ != NULL)\n        continue;\n\n    // 告诉中断路由使用哪个字符串。\n    usart2String = str;\n\
  \n    uartHandle.Instance->TDR = *usart2String;  // 将字符发送到 UART。\n    ++usart2String;\
  \             // 指向下一个字符。\n    // 启用中断。\n    uartHandle.Instance->CR1 |= USART_CR1_TXEIE;\n\
  }\n```\n\n我们执行的第一件事是等待上一个字符串完成 1。我们知道如果 `usart2String` 不是 `NULL`，中断例程处于激活状态，我们应该等待上一个字符串传输。当它变为\
  \ `NULL` 时，中断例程处于非激活状态，我们可以开始传输。\n\n当我们轮到时，我们告诉中断函数我们正在传输的字符串 2，然后我们发送第一个字符 3。作为最后一步，我们启用传输数据缓冲区空中断\
  \ 4。\n\n\n\n\n\n几个符号控制着哪些中断被启用。`USART_CR1_TXNEIE` 位告诉 UART 在发送数据缓冲区为空时产生中断。这里是其他一些需要注意的符号：\n\
  \n1. `USART_CR1_IDLEIE` 空闲中断启用\n2. `USART_CR1_RXNEIE` 接收中断启用\n3. `USART_CR1_TCIE`\
  \ 传输完成中断启用（当字符已发送出去时中断，而不是在我们首次将字符加载到传输寄存器时中断）\n4. `USART_CR1_PEIE` 校验位错误中断启用\n\n\
  一旦我们发送了第一个字符，`TDR` 就会被填充。当它被传输到 `TSR` 时，`TDR` 将变为空，我们将得到一个中断。从这里开始，中断例程序就开始工作。\n\
  \n实际的中断程序如下：\n\n```c\nvoid USART2_IRQHandler(void)\n{\n  if ((uartHandle.Instance->ISR\
  \ & USART_ISR_TXE) != 0) {\n        // 这不应该发生，但如果发生了，我们不希望程序崩溃。\n      if (usart2String\
  \ == NULL) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n      if (*usart2String == '\\0') {\n         \
  \   usart2String = NULL;        // 字符串处理完毕。\n            // 关闭中断。\n            uartHandle.Instance->CR1\
  \ &= ~(USART_CR1_TXEIE);\n            return;\n        }\n      uartHandle.Instance->TDR\
  \ = *usart2String; // 将字符发送到 UART。\n      ++usart2String;         // 指向下一个字符。\n\
  \        return;\n    }\n    // 因为我们启用的唯一中断是 TXE，我们不应该\n    // 到达这里。当我们启用其他中断时，我们需要在这里\n\
  \    // 编写处理它们的代码。\n}\n```\n\n函数声明使用了一个特殊的名称（magic name），将其标识为中断程序。\n\n如果该函数被调用，我们知道来自来自\
  \ `USART2` 的中断，但我们不知道它是哪种类型的中断，因为 `USART` 有多种类型的中断：\n\n1. `USART_ISR_TXE` TDR 为空\n\
  2. `USART_ISR_CTSIF` CTS 中断\n3. `USART_ISR_TC` 传输完成\n4. `USART_ISR_RXNE` 接收数据寄存器为空（数据准备好读取）\n\
  5. `USART_ISR_ORE` 检测到溢出错误\n6. `USART_ISR_IDLE` 检测到空闲行\n7. `USART_ISR_FE` 帧错误\n\
  8. `USART_ISR_PE` 校验位错误\n9. `USART_ISR_NE` 噪声标志\n10. `USART_ISR_CMF` 字符匹配\n11. `USART_ISR_TXE`\
  \ 接收器超时\n\n所有这些中断都会导致 `USART2_IRQHandler` 被调用。\n\n首先，我们需要检查是否存在发送缓冲区空的中断。我们的中断函数不应该在\
  \ `usart2String` 设置为 `NULL` 的情况下被调用，但“应该”和“现实”有巨大的差异，因此我们加入了一点防御性代码，以确保在出现问题时程序不会崩溃。在此处，`usart2String`\
  \ 不应该应该是 `NULL`，但如果是的话，我们不想引起麻烦。\n\n如果没有那个检查，我们可能会尝试解引用一个 `NULL` 指针。解引用 `NULL` 指针是非法的，而\
  \ `STM32` 非常友好地提供了硬件来检查这种状态。当这种情况发生时，`STM32` 会产生一个*memory fault interrupt*。换句话说，中断处理程序被中断，控制权转移到内存错误中断处理程序。然而，我们还没有编写该程序，因此将执行默认处理程序。如之前提到的，默认处理程序会锁定系统直到你对其重置。为了防止不当的\
  \ `usart2String` 导致问题，当我们看到它时，采取最安全的做法，即关闭中断并什么都不做。\n\n接下来，我们检查是否已经用完了字符串。如果是，我们将字符串置为\
  \ `NULL` 以向顶层信号我们已完成并关闭中断。否则，我们知道为 `UART` 有数据且 `TDR` 是空的，因此我们向其丢入一个字符。一旦发送了该字符，我们需要在下一次收到中断时指向下一个字符，然后返回主程序。\n\
  \n此时，`TDR` 是满的，`UART` 正在发送字符。中断例程序没有更多事情要做，因此它将返回并恢复正常执行。当字符被发送且 `TDR` 为空时，我们将得到另一个中断，这将一直持续直到我们用完字符串并关闭中断。\n\
  \n意 Microelectronics 的硬件工程师们通过图表很好地解释了这一过程（参见图 10-2）。\n\n![f10002](img/f10002.png)\n\
  \n图 10-2: USART 中断映射\n\n此图显示，如果 `TCIE`（传输字符中断启用）位开启且字符已发送（`TC`），则 `AND` 门的输出为真。此结果与另外其他中断的输出结合，如果任何一个为真，结果为真。\n\
  \n### 中断地狱\n\n在控制硬件以及处理实时性方面，中断是非常强大的工具。然而，使用中断会引起独特且困难的问题。首先，它们可以在任何时间中断正常流。例如，考虑以下代码：\n\
  \n```c\ni = 5;\nif (i == 5) {\n```\n\n在执行此语句后，`i` 的值是多少？显然是 `5`，除非中断刚刚执行并修改了它：\n\
  \n```c\ni = 5;\nif (i == 5) { // \n```\n\n其次，中断程序是异步执行的，这意味着它们随时执行，因此由编写不良的中断程序引起的\
  \ Bug 很难复现。我见过某些 Bug 在测试数周后随机出现，因为中断恰好发生在某指令执行时。\n\n由于中断程序固有的困难，对其应该保持尊重。处理中断程序最重要的设计规则是保持它们短小简单，因为程序执行的操作越少，出错的机会就越少。将“思考”留给高层代码，那里调试器工作良好且重复性不是问题。\n\
  \n中断程序还需要快速执行，因为当中断程序执行时，其他中断会被阻塞直到程序结束。如果你在一个从 `UART1` 读取字符的中断程序中花费长时间，另一个设备（如\
  \ `UART2`）可能会丢失数据，因为其中断无法及时处理。\n\n## 使用缓冲区增加速度\n\n我们刚刚使用的系统有一些局限性。它一次只能传输一个消息。假设我们要输出多个短消息。每个消息都必须等待上一个完成。这里有一个例子：\n\
  \n```c\nmyPuts(\"There are \");\nif (messageCount == 0)\n   myPuts(\" no \"); //\
  \ 等待上一个消息\nelse\n   myPuts(\" some \"); // 等待上一个消息\nmyPuts(\"messages waiting\\\
  r\\n\"); // 等待上一个消息\n```\n\n解决此问题的方案是创建一个缓冲区来保存字符数据，直到中断程序可以处理它们。这样做增加了应用程序的复杂性，但它增加了顶层程序发送数据的速度。\n\
  \n\n\n\n\n对于这个问题，让我们回到缓冲区。我们将使用一个具有以下基本结构的 `circular buffer`（环形缓冲区）：\n\n```\nstruct\
  \ circularBuffer {\n    uint32_t putIndex;      // 我们存放下一个字符的位置\n    uint32_t getIndex;\
  \      // 我们获取下一个字符的位置\n    uint32_t nCharacters;   // 缓冲区中字符的数量\n    char data[BUFFER_SIZE];\
  \ // 缓冲区中的数据\n}\n```\n\n它之所以被称为 `circular buffer`，是因为索引会发生回绕。换句话说，当字符被放入 `data`\
  \ 的最后一个元素后，`putIndex` 将从 7 (`BUFFER_SIZE-1`) 回绕到 0。\n\n从图上看，这看起来像图 10-3。\n\n![f10003](img/f10003.png)\n\
  \n图 10-3：工作中的环形缓冲区\n\n我们的实现将包含一个故意的糟糕错误，这样我们就可以在一个小型、受控的程序观察寻找此类错误的技术和步骤。在分析程序的过程中，我将展示\
  \ bug 的症状、用于定位它的诊断技术以及修复方法。\n\n我第一次遇到这类问题是在大约 30 年前。它不是在一个 200 行的演示程序中，而是在 BSD Unix\
  \ 内核中一个数万行的串口模块中。它大约每三到七天随机发生一次，三位工程师花了两个月才找到它。更糟糕的是，它是依赖处理器的，并且在运行原始 BSD 的 VAX\
  \ 处理器上并没有发生。\n\n顶层程序（发送端）将数据放入缓冲区。低层中断例程（接收端）从缓冲区中移除数据。\n\n用伪代码表示，发送者的任务如下：\n\n\
  ```\n如果缓冲区满了，则等待。\n在缓冲区的 putIndex 处放入一个字符。\n将 putIndex 移动一位，如果需要则回绕。\n增加缓冲区中字符的数量。\n\
  ```\n\n接收者的任务如下：\n\n```\n从缓冲区的 getIndex 处获取一个字符。\n增加 getIndex，如果需要则回绕。\n减少缓冲区中字符的数量。\n\
  ```\n\n### 发送函数\n\n为了使用环形缓冲区，我们必须回到使用另一个版本的 `myPutchar` 来逐次发送一个字符。让我们看看执行发送的代码：\n\
  \n```\nvoid myPutchar(const char ch)\n{\n    // 等到有空间为止。\n  1 while (buffer.nCharacters\
  \ == BUFFER_SIZE)\n        continue;\n  2 buffer.data[buffer.putIndex] = ch;\n \
  \ 3 ++buffer.putIndex;\n    if (buffer.putIndex == BUFFER_SIZE)\n        buffer.putIndex\
  \ = 0;\n\n    // 我们添加了另一个字符。\n  4 ++buffer.nCharacters;\n    // 现在完成了。\n\n    //\
  \ 启用中断（或重新启用）。\n  5 uartHandle.Instance->CR1 |= USART_CR1_TXEIE;\n}\n```\n\n在开始时，我们等待缓冲区中有至少能容纳一个字符的空间\
  \ 1。然后我们将字符放入缓冲区 2。`putIndex` 进一位，并在必要时回绕到 0 3。缓冲区中字符的数量增加了，因此我们增加了缓冲区结构中 `nCharacters`\
  \ 的计数 4。最后，我们启用中断 5。如果我们正在传输，中断可能已经启用了。再次启用它不会引起问题。\n\n### 中断例程\n\n中断例程从缓冲区读取数据并将其传输到\
  \ UART。如果缓冲区中有字符，例程会将其移除并发送到 UART。如果缓冲区为空，例程将关闭中断。\n\n以下是该过程的代码：\n\n```\nvoid USART2_IRQHandler(void)\n\
  {\n  1 if ((uartHandle.Instance->ISR & USART_ISR_TXE) != 0) {\n        if (buffer.nCharacters\
  \ == 0) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n      2 // 发送到 UART。\n        uartHandle.Instance->TDR\
  \ = buffer.data[buffer.getIndex];\n      3 ++buffer.getIndex;\n        if (buffer.getIndex\
  \ == BUFFER_SIZE)\n            buffer.getIndex = 0;\n\n      4 --buffer.nCharacters;\n\
  \n      5 if (buffer.nCharacters == 0)\n            uartHandle.Instance->CR1 &=\
  \ ~(USART_CR1_TXEIE);\n        return;\n    }\n    // 因为我们启用的唯一中断是 TXE，我们不应该\n \
  \   // 到这里。当我们启用其他中断时，\n    // 我们需要在这里放置处理它们的代码。\n}\n```\n\n首先，我们检查设备是否已耗尽数据。如果是，我们就关闭中断，直到我们从上层获取更多数据\
  \ 1。然后我们发送字符 2，将 `getIndex` 向上移动，并在必要时回绕 3。接下来，我们让上层知道我们少了一个字符 4。最后，如果这是最后一个字符，我们就关闭中断\
  \ 5。\n\n### 完整程序\n\nListing 10-2 显示了完整的程序。\n\n```\n/**\n  * @brief   向串口写入 Hello\
  \ World\n  *\n  * 填充缓冲区。\n  *\n  * 包含竞态条件。\n  * 执行此程序。\n  * @note 是 USART。\n  */\n\
  #include <stdbool.h>\n#include \"stm32fxx.h\"\n#include <string.h>\n#include <stdio.h>\n\
  \n#define BUFFER_SIZE 8\n\nstruct circularBuffer {\n    uint32_t putIndex;\n   \
  \ uint32_t getIndex;\n    uint32_t nCharacters;\n    char data[BUFFER_SIZE];\n};\n\
  \nvolatile circularBuffer buffer = {0, 0, 0};\nUART_HandleTypeDef uartHandle;\n\
  const char hello[] = \"Hello World!\\r\\n\";\n\n/**\n * 在缓冲区放入一个字符。\n *\n * @param\
  \ ch 要发送的字符\n * @note 假设 str 不为空\n */\nvoid myPutchar(const char ch)\n{\n    //\
  \ 等到有空间为止。\n    while (buffer.nCharacters == BUFFER_SIZE)\n        continue;\n \
  \   buffer.data[buffer.putIndex] = ch;\n    ++buffer.putIndex;\n    if (buffer.putIndex\
  \ == BUFFER_SIZE)\n        buffer.putIndex = 0;\n\n    // 我们添加了另一个字符。\n    ++buffer.nCharacters;\n\
  \n    // 现在完成了。\n\n    // 启用中断（或重新启用）。\n    uartHandle.Instance->CR1 |= USART_CR1_TXEIE;\n\
  }\n\n/**\n * 处理中断。\n *\n * 名称是 USART2。\n */\nvoid USART2_IRQHandler(void)\n{\n \
  \   if ((uartHandle.Instance->ISR & USART_ISR_TXE) != 0) {\n        if (buffer.nCharacters\
  \ == 0) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n        // 发送到 UART。\n        uartHandle.Instance->TDR\
  \ = buffer.data[buffer.getIndex];\n        ++buffer.getIndex;\n        if (buffer.getIndex\
  \ == BUFFER_SIZE)\n            buffer.getIndex = 0;\n\n        --buffer.nCharacters;\n\
  \n        if (buffer.nCharacters == 0)\n            uartHandle.Instance->CR1 &=\
  \ ~(USART_CR1_TXEIE);\n        return;\n    }\n}\n\n/**\n * 我们的 puts 版本\n *\n *\
  \ 将给定的字符串输出到输出\n *\n * @param str 要发送的字符串\n */\nvoid myPuts(const char* str)\n{\n\
  \    for (* str; *str != '\\0'; ++str)\n        myPutchar(*str);\n}\n\nint main(void)\n\
  {\n    // 初始化硬件。\n    HAL_Init();\n    led2_Init();\n    uart2_Init();\n    // 告诉芯片我们希望启用\
  \ USART2\n    // 的的中断向量。\n    NVIC_EnableIRQ(USART2_IRQn);\n\n    // 持续发送消息。\n \
  \   for (;;) {\n        myPuts(hello);\n        HAL_Delay(500);\n    }\n}\n```\n\
  \n### 问题\n\n当我们运行程序时，我们期望看到以下内容：\n\n```\nHello World!\nHello World!\nHello World!\n\
  ```\n\n相反，我们得到的是：\n\n```\nHello World!\nello World!\nHello Wold!\nHello World!\n\
  ```\n\n\n\n\n该问题的发生没有特定的规律，唯一的规律是我们发送到缓冲区的数据越多，出现问题的概率就越大。\n\n要通过这个微型程序在现场复现该问题非常困难，因为它需要非常精确的时机。更有可能的情况是，我们在实现并测试这段代码后，将该模块集成到另一个程序中，这会增加计时冲突的概率。时序错误（Timing\
  \ bugs）很难按需触发，但这段代码中确实存在一个。\n\n我们知道，系统越忙，问题发生的概率就越高。此外，我们还有另一个线索——虽然我们没能在案发现抓住它，但事后我们查看了调试器并发现了以下情况：\n\
  \n```\nnCharacters == 0\ngetIndex != putIndex\n```\n\n在一个正常运行程序中，这两个条件永远不可能同时成立。解决这个问题有两种方法：第一种是对代码进行插桩（instrument），试图弄清楚发生了什么；第二种是对上下层之间共享的所有数据以及操作这些数据的代码进行非常详尽的分析。让我们两种都做。\n\
  \n### 对代码插桩\n\n代码插桩意味着插入临时的调试语句来帮助发现问题。对于大多数代码，这意味着编写 `printf` 语句来输出中间数据，以便我们在程序执行过程中进行检查。有时，数据会被打印到日志文件中，在问题发生后进行分析。但这两种方案对于我们的嵌入式程序都是不可行的。我们不能使用\
  \ `printf`，因为输出会进入串口控制台，而那里正是带有错误的代码。我们无法写日志文件，因为我们没有文件系统来写入日志信息。\n\n我们需要使用一个存储最后\
  \ 100 个事件的日志缓冲区。当我们遇到问题时，可以回溯查看这些事件，看看是什么导致了问题。日志记录了相关数据（`getIndex`、`putIndex`、`nCharacters`）以及调用事件日志代码的行号。\n\
  \n当问题发生且我们有机会在调试器中停止程序时，我们可以查看日志。如果运气好，我们应该能找到几条日志记录，在第 *X* 行缓冲区信息是一致的，而在第 *Y* 行却乱套了，这揭示了问题发生在第\
  \ *X* 和第 *Y* 行之间。\n\nListing 10-3 显示记录事件的代码。在其他定义和变量声明之后添加这段代码。\n\n```c\n#define\
  \ N_EVENTS 100                   // 存储 100 个事件。\nuint32_t nextEvent = 0;       \
  \         // 下一个事件存放的位置\nstruct logEvent debugEvents[N_EVENTS]; // 日志数据\n\nvoid\
  \ debugEvent(const uint32_t line)\n{\n    debugEvents[nextEvent].line = line;\n\
  \    debugEvents[nextEvent].putIndex = buffer.putIndex;\n    debugEvents[nextEvent].getIndex\
  \ = buffer.getIndex;\n    debugEvents[nextEvent].nCharacters = buffer.nCharacters;\n\
  \    ++nextEvent;\n    if (nextEvent == N_NEVETS)\n        nextEvent = 0;\n}\n```\n\
  \n列表 10-3：事件记录器\n\n这个事件记录器包含了我们试图寻找的同类错误，但目前我们假设它工作得足够好，足以让我们定位问题。\n\n现在，我们需要调用几次\
  \ `debugEvent` 函数，看看我们是否能发现错误。由于 `nCharacters` 让我们快疯了，因此我们在对 `nCharacters` 执行的每一次操作前后都放置了一次\
  \ `debugEvent` 调用：\n\n```c\nvoid USART2_IRQHandler(void)\n--snip--\n      debugEvent(__LINE__);\n\
  \      --buffer.nCharacters;\n      debugEvent(__LINE__);\n\nvoid myPutchar(const\
  \ char ch)\n--snip--\n      debugEvent(__LINE__);\n      ++buffer.nCharacters;\n\
  \      debugEvent(__LINE__);\n```\n\n我们还在 `myPutchar` 的开始处放置了一个一致性检查，以确保 `buffer`\
  \ 是正常的。具体来说，如果我们看到 `buffer` 不一致的条件（`nCharacters == 0` 且 `getIndex != putIndex`），我们就调用\
  \ `Error_Handler` 函数停止程序：\n\n```c\nvoid myPutchar(const char ch)\n{\n    if ((buffer.nCharacters\
  \ == 0) && (buffer.getIndex != buffer.putIndex))\n        Error_Handler();\n```\n\
  \n让我们在调试器下启动程序并在 `Error_Handler` 处设置断点，看看是否能捕获到错误。最终，我们命中了断点，并使用调试器检查了 `debugEvents`。通过调试器回溯追踪，我们发现了以下：\n\
  \n* 第 119 行：`nCharacters == 3`\n* 第 89 行：`nCharacters == 3`\n* 第 91 行：`nCharacters\
  \ == 2`\n* 第 121 行：`nCharacters == 4`\n\n为什么 `nCharacters` 在最后两个事件之间跳变了 2？\n\n以下是相关的行：\n\
  \n```c\n77 void USART2_IRQHandler(void)\n--snip--\n89      debugEvent(__LINE__);\n\
  90      --buffer.nCharacters;\n91      debugEvent(__LINE__);\n```\n\n以及：\n\n```c\n\
  106 void myPutchar(const char ch)\n--snip--\n119     debugEvent(__LINE__);\n120\
  \     ++buffer.nCharacters;\n121     debugEvent(__LINE__);\n```\n\n在 119 行和 121\
  \ 行之间，有些事情出问题了。\n\n### 分析代码\n\n解决这个问题有两种方法：第一种是对代码进行插桩，试图弄清楚发生了什么；第二种是对上下层之间共享的所有数据以及操作这些数据的代码进行非常详尽的分析。让我们两种都做。\n\
