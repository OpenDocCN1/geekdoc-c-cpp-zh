  \ 的原因是由于早期的一些链接器。假设我们有一个包含组件 `a.o`（定义了 `a_funct`）、`b.o`（定义了 `b_funct`）和 `c.o`（定义了\
  \ `c_funct`）的归库，且程序需要 `b.o` 中的一个函数。链接器会打开归库并顺序遍历它，查看每个成员以确定它是否被需要。决策过程如下：\n\n1.\
  \ 查看未定义符号列表（程序使用了 `b_funct`，所以它是未定义的）。\n2. 打开归库。\n3. 查看 `a.o`。它定义了需要的符号吗？没有。不要加载它。\n\
  4. 查看 `b.o`。它定义了需要的符号吗？是的。加载它。\n5. 查看 `c.o`。它定义了需要的符号吗？没有。不要加载它。\n\n现在假设 `b.o` 需要\
  \ `a_funct` 函数。链接器不会返回并重新检查归库。它将继续向下并只查看 `c.o`。由于 `c.o` 没有定义该符号，它将不会被加载。链接器到达归库的末尾并终止，因为它没有找到满足\
  \ `a_funct` 需要的对象文件。\n\n由于链接器的工作方式，有时你可能指定两次或三次同一个库。为了解决这个问题，归库中添加了目录表，以便组件可以以随机顺序加载（因此\
  \ `ranlib` 名称的由来）。\n\n现在加载组件的算法如下：\n\n1. 查看未定义符号列表（程序使用了 `b_funct`，所以它是未定义的）。\n\
  2. 打开归库。\n3. 我们是否有一个在目录表中的未定义符号？\n4. 如果有，加载它。\n5. 重复此过程，直到我们没有更多可以通过此库满足的符号。\n\n\
  这个过程解决了顺序问题，因为目录表使所有内容都可访问。\n\n（此处省略原文中重复的段落，以符合指令要求）\n\n\n\n让我们通过自己的代码来实际演示。在列表\
  \ 17-18 和 17-19 中，我们有了 `sub1` 和 `sub2`，其中 `sub2` 定义了两次（一次在 `main.c` 中，一次在 `sub.c`\
  \ 中）。当链接器查看这两个文件时，它会说：“这里有两个 `sub2` 函数。我应该报错吗？不。其中一个是弱引用（weak），我可以把它丢弃。”`main.c`\
  \ 中的 `sub2` 将被链接，而 `sub.c` 中的则不会。\n\n我们首先定义一个主程序，其任务是调用我们的两个子程序（参见列表 17-18）。\n\n\
  ### main.c\n\n```c\n#include \"sub.h\"\n\nint main()\n{\n    sub1();\n    sub2();\n\
  \    return (0);\n}\n```\n列表 17-18：调用两个子程序的主程序\n\n在列表 17-19 中，我们通过 GCC 扩展告诉编译器 `sub.c`\
  \ 中的 `sub2` 是弱引用。\n\n### sub.c\n\n```c\n#include \"sub.h\"\n\nvoid sub2(void) __attribute__((weak));\n\
  \nvoid sub1(void) {}\nvoid sub2(void) {}\n```\n列表 17-19：告诉编译器 `sub2` 是弱引用\n\n接下来，我们需要一个头文件，所以让我们生成一个（参见列表\
  \ 17-20）。\n\n### sub.h\n\n```c\n#ifndef __SUB_H__\n#define __SUB_H__\nextern void\
  \ sub1(void);\nextern void sub2(void);\n#endif // __SUB_H__\n```\n列表 17-20：头文件\n\
  \n最后，我们在列表 17-21 中定义了我们自己的 `sub2` 函数。\n\n### sub2.c\n\n```c\n#include <stdio.h>\n\
  #include \"sub.h\"\n\nvoid sub2(void) {\n    printf(\"The non-weak sub2\\n\");\n\
  }\n```\n列表 17-21：定义 `sub2` 函数\n\n如果我们链接 `main.c` 和 `sub.c`，弱引用的 `sub2`将被链接。如果我们链接\
  \ `main.c`、`sub.c` 和 `sub2.c`，将使用定义在 `sub2.c` 中的非弱引用版本。\n\n这对于中断程序等情况非常有用，在这些情况下，无论是否使用都必须定义一个。它允许你提供一个回退或默认版本。\n\
  \n## 总结\n\n模块允许你将大型程序拆分为可管理的单元。良好的设计意味着大型程序不需要包含巨大的部分。多个模块可以组织成一个库。库的优势是它可以包含大量的专用模块，而链接器只会链接需要的那些。\n\
  \n良好的编程核心在于组织信息，而模块和库让你能够将巨大的编程混乱组织成适大小的单元。\n\n## 编程问题\n\n1. 编写一个库来计算几何形状的面积（`rectangle_area`、`triangle_area`\
  \ 等）。每个函数都应该在自己的对象文件中，并且所有的面积函数应该合并到一个单个库中。编写一个主程序对这些函数进行单元测试。\n2. 重写之前章节中创建的串口输出程序之一，使得所有与\
  \ UART 相关的代码都在自己的模块中。\n3. 测试在以下情况下会发生什么：\n    1. 你定义了两个弱符号和一个强符号。\n    2. 你定义了两个弱符号没有任何强符号。\n\
  \    3. 你定义了两个强符号。\n\n## 后记\n\n![](img/chapterart.png)\n\n这本书应该让你在嵌入式 C 编程有一个良好的开始，但在*裸机\
  \ C（Bare Metal C）*之外，还有一个整个世界等待着你去探索。最后，这里有一些关于开启专业编程之路的实用提示。\n\n## 学习如何写作\n\n到目前为止，专业程序员拥有的最重要的技能是能够写好文章，因为编程过程包括编写多种类型的文档，例如建议书、需求文档、设计文档、用户文档和销售材料。\n\
  \n参加一个创意写作课程，让班里的同学评审你的作品。我从圣地亚哥写作工作坊（San Diego Writing Workshop）获得的反馈是我一生中收到最有价值的培训之一。\n\
  \n这里有一个专业提示：如果你正在为项目编写设计或需求，你对引导项目的方向拥有巨大的权力。\n\n## 学习如何阅读\n\n通过“阅读”技术文档可以学到很多。我给“阅读”加上引号是因为你不会完整地读完大部分技术文档。你通过扫描它们来找到你当时需要的信息。\n\
  \n以下是我在准备这本书时使用的文档列表：\n\n* ISO/IEC9899:2017, “编程语言: C”（500 页）\n* RM0360 参考手册，“STM32F030x4/x6/x8/xC\
  \ 和 STM32F070x6/xB Advanced ARM®-based 32-bit MCUs”（800 页）\n* ARM Developer Suite\
  \ Assembl 编指南版本 1.2（400 页）\n* GNU 编译器集合（1000 页）\n* GNU Make 手册（225 页）\n* Linux 内核（15\
  \ 页）\n\n## 协作与创意借鉴\n\n无论你多有经验，你也一个人。通过与他人合作并评审彼此的工作，你可以扩展自己的知识。这种方法成功的一个例子是 Linux\
  \ 内核。\n\n查看公开代码以了解他人是如何做的也有帮助。一个例子是 STM32 自带的 HAL 固件。它提供了良好的内部文档。（参见后面的 Doxygen\
  \ 章节。）\n\n## 有用的开源工具\n\n开源社区在开发辅助创建和编辑工具方面有着悠久的历史。这些工具是由使用者开发的，而不是那些增加了功能但可能没用的商业程序。本节介绍了一些有助于工具。\n\
  \n### Cppcheck\n\nCppcheck 程序是一个静态程序检查器。换句话说，它寻找你的程序中编译器没有发现的问题，随着编译器变得复杂，这现在变得越来越困难。\n\
  \n这个程序发现了我最喜欢的 C 代码。当时的错误信息是：\n\n```\n检测匹配的 'if' 和 'else if' 条件\n```\n\n换句话说，`if`\
  \ 的体和 `else` 的体包含了相同的代码。当条件为真或假时计算机执行的操作相同时，就不需要条件了。\n\n这就是问题代码：\n\n```c\nif (flag)\
  \ {\n    // processMessage()\n} else {\n    // processMessage()\n}\n```\n\n没错，`if`\
  \ 的体是一个注释掉的函数调用，而 `else` 的体是同一个注释掉的函数调用！\n\n与大多数静态分析器相比，我更喜欢 Cppcheck，因为它产生的误报最少。如果\
  \ Cppcheck 标记了你代码中的某行，查看一下该代码是一个好主意。\n\n### Doxygen\n\n自从第一个程序超过 50 行以来，人们一直试图让编程语言自文档化。到目前为止，它们都失败了。Doxygen\
  \ 的人员创建了一个系统，通过程序中的结构化注释，可以为它创建文档（至少在理论上）。\n\n第一个困难是你需要在代码中编写注释，而许多工程师完全不写注释。另一个问题是文档看起来像是自动生成的。虽然它对于自动生成的文档实际上非常好，但它仍然是自动生成的文档。\n\
  \n\n\n\n上一节提到的 Cppcheck 程序使用 Doxygen 进行内部文档编制。\n\n### Valgrind\nValgrind 项目是一套工具集，设计用于动态检查你的程序以发现错误。该工具集中最流行的工具之一是\
  \ `memcheck`，它会查找内存错误，例如数组溢出、在释放后使用指针等。它在检测大多数简单的运行时错误方面非常有效。\n\n### SQLite\nSQLite\
  \ 是一个嵌入式数据库库，适用于小型数据库（多达 100,000 条记录）。它不是世界上最快的数据库，但对于不需要大型数据库开销的小型嵌入式系统来说，它运行良好。你需要学习\
  \ SQL 来使用它，但这是一项非常有价值的技能。\n\n## 永不停学习\n计算机技术正在以惊人的速度变化。我们在书中使用的那个仅需 38 美分的 STM 微芯片，其性能超过了\
  \ 1950 年全世界所有计算机的总和。技术将永远不会停止，所以你永远不要停止学习。你永远不知道在转角会发现什么新发现。\n\n# 附录\n\n## 项目创建清单\n\
  \n### 原生 C 项目\n对于运行在 PC 上的程序，启动 STM32 Workbench，根据需要选择工作空间，然后完成以下步骤：\n\n1. 在主窗口中，选择\
  \ `File`▶`New`▶`C/C++ Project`。\n2. 在 `C/C++ Project` 窗口中，选择 `C Managed Build` 并点击\
  \ `Next`。\n3. 在 `C Project` 窗口中：\n    1. 名称（不要有空格或特殊字符）。\n    2. 在 `Project Type`\
  \ 列中，选择 `Executable`▶`Empty Project`。\n    3. 在 `Toolchains` 列中，选择适用于你原生系统的工具链。例如，如果你在带有\
  \ Visual C++ 的 Windows 上，你应该选择 Visual C++。如果你在 Linux 上，应选择 Linux C 编译器 `GNU gcc`。\n\
  \    4. 点击 `Next`。\n5. 在 `Configurations` 窗口中：\n    1. 取消勾选 `Release`。\n    2. `Debug`\
  \ 应保持勾选状态。\n    3. 点击 `Finish`。\n6. 在主窗口中：\n    1. 在 `Project Explorer`（左列）中，选择该项目。\n\
  \    2. 选择 `File`▶`New`▶`Source File`。\n7. 在 `Source File` 窗口中：\n    1. 在 `Source\
  \ File` 字段中，输入你的程序文件名（以 `*.c` 结尾）。\n    2. 点击 `Finish`。\n8. 返回主窗口（编辑面板中显示该文件）：\n\
  \    1. 输入程序。\n    2. 选择 `File`▶`Save All`。\n    3. 选择 `Project`▶`Build Project.`。\n\
  \    4. 选择 `Run`▶`Run Configuration`。\n9. 在 `Create, Manage, and Run Configurations`\
  \ 窗口中：\n    1. 在左列中，选择 `C/C++ Application`。\n    2. 点击 `New`。\n    3. 在 `C/C++ Application`\
  \ 下，点击 `Browse`。\n10. 在 `File` 对话框中：\n    1. 进入你的工作空间并打开项目文件夹。\n    2. 在项目文件夹中打开\
  \ `Debug` 目录。\n    3. 选择你程序的的可执行文件。\n    4. 点击 `OK`。\n11. 返回 `Create, Manage, and\
  \ Run Configurations` 窗口中：\n    1. 点击 `Apply`。\n    2. 点击 `Close`。\n\n你现在可以运行并调试你的程序了。\n\
  \n### STM32 Workbench 嵌入式项目\n对于运行在 Nucleo 板上的程序，启动 STM32 Workbench，根据需要选择工作空间，然后完成以下步骤：\n\
