  \     ++buffer.nCharacters;\n121     debugEvent(__LINE__);\n```\n\n在 119 行和 121\
  \ 行之间，有些事情出问题了。\n\n### 仔细检查代码\n\n让我们看看执行以下行时到底发生了什么：\n\n```c\n++buffer.nCharacters;\n\
  ```\n\n这里是该行的汇编代码（已添加注释）：\n\n```assembly\n120:../src/main.c *** ++buffer.nCharacters;\n\
  404               loc 118 0\n405 005c 094B     ldr  r3, .L22     ; 将 .L22 的地址加载到\
  \ r3\n                                    ; 它恰好是 \"buffer\"\n406 005e 9B68     ldr\
  \  r3, [r3, #8] ; 获取\n                                    ; buffer.nCharacters\n\
  407 0060 5A1C   1 adds r2, r3, #1   ; 将 r3 加 1，结果存储在 r2 中\n408 0062 084B     ldr\
  \  r3, .L22     ; 再次加载地址\n409 0064 9A60     str  r2, [r3, #8] ; 存储 buffer.nCharacters\n\
  ```\n\n代码将 `nCharacters` 的值加载到寄存器 `r3`，加 1，然后存回 `nCharacters`。中断可能会任何时间发生，比如在值加载到\
  \ `r3` 之后，这会导致以下情况（假设 `nCharacters` 为 3）：\n\n1. 在第 406 行，寄存器 `r3` 得到了 `nCharacters`\
  \ 的值（`r3 == 3`）。\n2. 在第 407 行指令之前，发生了中断。\n\n\n\n\n3. 中断程序读取了 `nCharacters`（其值为 3）。\n\
  \n4. 它将其减了 1，因此 `nCharacters` 的值现在变为 2。\n\n5. 中断程序完成并将控制权交回第 407 行。\n\n6. 第 407\
  \ 行的指令将寄存器 `r3` 加 1，并将结果存入 `r2`（`r3` 包含 3，`r2` 包含 4）。\n\n7. 第 409 行将 `r2` 的值存入 nCharacters，该值应该是\
  \ 3，但现在是 4。\n\n8. 在第 407 行，程序假设 `r3` 具有 `nCharacters` 的正确值，但事实并非如此。\n\n寄存器 `r3`\
  \ 没有 `nCharacters` 的正确值，是因为中断在恰当的时间发生了，并且变量被修改了。我们未能保护共享数据的一致性。当上层正在修改 `nCharacters`\
  \ 时，下层同时也在修改它。\n\n如果中断发生在其他指令之间，该问题就不会发生。这个问题是随机的且发生频率很低，使其成为最难解决的问题之一。\n\n### 修复问题\n\
  \n解决方案是防止在我们在修改 `nCharacters` 时中断程序对其进行修改。为了做到这一点，我们在递增之前关闭中断，并在之后开启中断：\n\n```\n\
  119      __disable_irq();\n120      ++buffer.nCharacters;\n121      __enable_irq();\n\
  ```\n\n保持关闭中断的时间尽可能短。如果关闭中断的时间过长，可能会错过中断并导致数据丢失。\n\n在中断程序中，我们减了 `nCharacters`，那么难道我们不需要用\
  \ `__disable_irq` 和 `__enable_irq` 来保护它吗？我们不需要，因为当中断发生时，系统会自动执行以下步骤：\n\n1. 它禁用此级别及更低级别的中断。更高级别的中断可以中断我们的中断程序，但低级别的中断则不能。\n\
  \n2. 它保存机器状态，包括所有通用寄存器和状态寄存器。\n\n3. 它调用中断函数。\n\n当中断程序返回时，系统会执行这些步骤：\n\n1. 它恢复机器状态。\n\
  \n2. 它重新开启中断。\n\n3. 它将控制权交回给上层代码。\n\n在中断程序的开始和结束处需要大量的记录工作。幸运的是，ARM 处理器家族的设计者决定在硬件中完成所有这些工作。\n\
  \n## 总结\n\n中断允许你实时响应输入和输出请求。它们也允许你以奇怪且随机的方式搞乱你的程序。请确保中断程序和访问共享数据的代码尽可能简单清晰。花费额外时间确保中断相关代码编写得正确，将会在以后为你节省大量的调试时间。\n\
  \n## 编程问题\n\n1. 创建一个从串口读取字符的中断程序。\n\n2. 添加一个中断程序来处理按钮按下事件，并在事件发生时更改消息。\n\n3. 浏览\
  \ HAL 库并找出 `__disable_irq` 是如何实现的。\n\n# 11 链接器\n\n![](img/chapterart.png)\n\n本章将极其详尽地探索链接过程的工作原理。链接器的工作是组成程序的所有目标文件并将它们组合在一起。链接器必须确切知道你设备的内存布局，以便将程序放入内存中。它还负责将一个文件中的外部符号与另一个文件中的实际定义连接起来。这个过程被称为符号链接。\n\
  \n是链接器确切知道东西的位置。在具有数 GB 内存的大型系统中，这并不十分重要，但在只有 16KB RAM 的微控制器上，知道每个字节的用途是非常关重要的。\n\
  \n让我们来看一个典型的问题，它展示了更好地理解链接器如何有所帮助。假设你现场的一个系统崩溃了。当它崩溃时，它会打印堆栈跟踪，显示导致问题的故障调用栈（参见 Listing\
  \ 11-1）。\n\n```\n#0  0x0000000000001136 in ?? ()\n#1  0x0000000000001150 in ?? ()\n\
  #2  0x0000000000001165 in ?? ()\n#3  0x000000000000117a in ?? ()\n#4  0x00007ffff7de50b3\
  \ in __libc_main (main=0x555555555168) at ../csu/libc-start.c:308\n#5  0x000000000000106e\
  \ in ?? ()\n```\n\nListing 11-1: 示例堆栈跟踪\n\n这告诉你故障发生在地址为 `0x0000000000001136` 的函数中。\n\
  \n由于你没有使用绝对地址编写程序，函数名称对你来说更有用。这正是链接映射（map file）派用用场。\n\nListing 11-2\n\n```\n.text\
  \          0x0000000000001136\n.data          0x0000000000001150\n.bss         \
  \  0x0000000000001165\n```\n\nListing 11-2: map 文件的节选\n\n\n\n`memory model`（内存模型）描述了系统如何规定内存。基本上，内存被划分为若干个命名的段。C\
  \ 标准、对象文件以及 `ARM` 芯片都使用不同的名称来描述它们的内存。糟糕的是，还可能通过 C 语言扩展定义自定义名称。此时，必须告诉链接器如何处理这些自定义扇段。\n\
  \n### 理想的 C 模型\n\n在 C 程序中，所有内容理想情况下都会进入三个标准段之一：`text`、`data` 或 `bss`。\n\n只读指令和只读数据进入\
  \ `text` 段。在这里，`main` 函数的代码和文本字符串（只读）都进入 `text` 段：\n\n```\nint main() {\n   doIt(\"\
  this goes in text too\");\n   return();\n}\n```\n\n已初始化的数据（已初始化的全局变量）进入 `data` 段：\n\
  \n```\nint anExample = 5;\n```\n\n未初始化的数据（未初始化的全局变量）进入 `bss` 段：\n\n```\nint uninitialized;\n\
  ```\n\n从技术角度上说，根据标准，`bss` 是未初始化的。然而，在我见过的每一个 C 编程系统的实现中，`bss` 段都被初始化为零。\n\n这些段的数据是在编译时分配的。C\
  \ 编译器会生成一个对象文件，说明：“我需要这么多 `text`，这里是内容。我需要这么多 `data`，这里是内容。我需要这么多 `bss`，且未指定内容。”\n\
  \n`size` 命令显示了程序在每个段中占用的空间：\n\n```\n$ size example.o\n   text   data    bss    dec\
  \    hex    filename\n    481      4      4    489    1e9    example.o\n```\n\n\
  该对象文件使用了 481 字节的 `text`、4 字节的 `data` 以及另外 4 字节的 `bss`。三部分总字节数为 489，即十六进制的 `1e9`。\n\
  \n理想的 C 模型还有两个内存段。然而，它们不是由编译器分配的，而是由链接器分配的。这些是 `stack`（栈）和 `heap`（堆）。`stack` 用于局部变量，并在过程调用时动态分配。`heap`\
  \ 是一个内存池，可以动态分配和释放（更多关于堆的内容见第 13 章）。\n\n编译器获取我们的变量定义并将它们分配到内存段。这些段使用的命名空间与理想的 C\
  \ 内存段名称不同。在某些情况下名称是类似的，在某些情况下则完全不同。不同的编译器甚至同一编译器的不同版本可能会对段使用不同的名称。\n\nListing 11-3\
  \ 显示了一个包含我们讨论过的所有类型数据的程序。\n\n```c\n/**\n * 一个演示各种类型变量\n * 存储的程序，以便我们能看到链接器如何处理它们\n\
  \ */\nint uninitializedGlobal;   // 未初始化的全局变量 (bss 段)\nint initializedGlobal = 1;\
  \ // 已初始化的全局变量 (data 段)\nint initializedToZero = 0; // 已初始化的全局变量 (bss 段)  \n\n//\
  \ aString -- 已初始化的变量 (bss 段)\n// \"A string.\" -- 常量 (text 段)\nconst char* aString\
  \ = \"A string.\"; // 字符串（指向只读数据）\nstatic int uninitializedModule;    // 未初始化的模块级符号\n\
  \                                   // (bss 段)\nstatic int initializedModule = 2;\
  \  // 已初始化的模块级符号\n                                   // (data 段)\n\nint main()\n\
  {\n    int uninitializedLocal;      // 局部变量 (stack 段)\n    int initializedLocal\
  \ = 1234; // 已初始化的局部变量 (stack 段)\n\n    static int uninitializedStatic;      //\
  \ “未初始化”静态变量 (bss 段)\n    static int initializedStatic = 5678; // 已初始化的静态变量 (data\
  \ 段)\n\n    while (1)\n        continue; // 这里没多少逻辑\n}\n```\n\nListing 11-3：数据类型示例\n\
  \n让我们看看我们的 `GNU GCC` 编译器对 Listing 11-3 中的示例程序做了什么——具体来说，它是如何为各种类型的变量和数据分配内存的。\n\n\
  首先，这是来自 Listing 11-3 的 `initializedGlobal`：\n\n```assembly\nint initializedGlobal\
  \ = 1; // 已初始化的全局变量 (data 段)\n\n  16                            .global initializedGlobal\n\
  \  17                            .data\n  18                            .align \
  \ 2\n  21                    initializedGlobal:\n  22 0000 01000000            \
  \  .word   1\n```\n\n`.global` 指令告诉汇编器这是一个全局符号，可以被其他对象文件引用。`.data` 指令告诉汇编器后续进入 `.data`\
  \ 段。到目前为止，我们一直遵循理想的 C 内存模型命名规范。\n\n`.align` 指令告诉汇编器接下来的数据应该在 4 字节边界上对齐（地址的最后 2 位必须为零，因此是\
  \ `.align 2`）。最后，是 `initializedGlobal` 标签和 `.word 1` 数据。\n\n当变量被初始化为零时（Listing 11-3\
  \ 中的 `initializedToZero`），我们看到略有不同的代码：\n\n```assembly\nint initializedToZero = 0;\
  \ // 已初始化的全局变量 (data 段)\n\n  23                            .global initializedToZero\n\
  \  24                            .bss\n  25                            .align  2\n\
  \  28                    initializedToZero:\n  29 0000 00000000              .space\
  \  4\n```\n\n这里，编译器使用 `.bss` 指令将变量放入 `bss` 段。它还使用 `.space` 指令占用 4 字节并初始化为零。\n\n\
  现在让我们处理未初始化的全局变量（来自 Listing 11-3 的 `initializedGlobal`）：\n\n```assembly\nint uninitializedGlobal;\
  \ // 未初始化的全局变量 (bss 段)\n\n  15                            .comm   uninitializedGlobal,4\n\
  ```\n\n`.comm` 段告诉汇编器定义长度为 4 字节且在 4 字节边界对齐的符号。该符号进入名为 `COMMON` 的内存段。在这种情况下，段名称并没有遵循理想的\
  \ C 内存模型。\n\n定义 `aString` 的语句（来自 Listing 11-3）还定义了字符串常量（\"A string.\"）。该字符串常量是只读的，而指针（`aString`）是可读写的。这是生成的代码：\n\
  \n```assembly\nconst char* aString = \"A string.\"; // 字符串（指向只读数据）\n\n  30     \
  \                       .global aString\n  31                            .section\
  \        .rodata\n  32                            .align  2\n  33              \
  \      .LC0:\n  34 0000 41207374              .ascii  \"A string.\\000\"\n  34 \
  \     72696E67\n  34      2E00\n  35                            .data\n  36    \
  \                        .align  2\n  39                    aString:\n  40 0004\
  \ 00000000              .word   .LC0\n```\n\n首先，编译器必须生成常量 `\"A string.\"`。它为该常量生成了一个内部名称\
  \ `.LC0`，并生成该常量的内容。`.section .rodata` 指令将常量放入名为 `.rodata` 的链接器段。（理想的 C 模型将其称为 `text`。）\n\
  \n现在我们来到变量本身 `aString`。`.data` 指令将其放入 `data` 段。由于它是一个指针，它被初始化为字符串的地址（即 `.LC0`）。\n\
  \n最后一个主要的段是包含代码的段。理想的 C 模型将其称为 `text`。这里是 `main` 函数部分的汇编列表：\n\n```assembly\nint\
  \ main()\n\n  52                            .section        .text.main,\"ax\",%progbits\n\
  \  53                            .align  1\n  54                            .global\
  \ main\n  60                    main:\n  67 0000 80B5                  push    {r7,\
  \ lr}\n```\n\n该段的名称是 `text.main`。在这种情况下，编译器决定采用 `text` 前缀并加上模块名称（`main`）以形成段名称。\n\
  \n\n\n\n我们已经涵盖了编译器所知的内存内存区域，接下来让我们看看其他类型声明生成的代码。在任何过程之外使用的 `static` 关键字表示该变量只能在当前模块内使用。\n\
  \n以下是来自 Listing 11-3 的创建 `initializedModule` 变量的代码：\n\n```\nstatic int initializedModule\
  \ = 2; // 一个初始化的模块级符号\n                                  // (section data)\n\n \
  \ 46                            .data\n  47                            .align  2\n\
  \  50                    initializedModule:\n  51 0008 02000000              .word\
  \  2\n```\n\n它看起来和 `initializedGlobal` 几乎一样，只是缺少`.global` 指令。\n\n同样，来自 Listing 11-3\
  \ 的 `uninitializedModule` 变量看起来非常像 `uninitializedGlobal`，但同样缺少了 `.global` 指令：\n\n\
  ```\nstatic int uninitializedModule; // 一个未初始化的模块级符号\n                         \
  \       // (section bss)\n\n  41                            .bss\n  42         \
  \                   .align  2\n  43                    uninitializedModule:\n  44\
  \ 0004 00000000              .space  4\n```\n\n现在我们来看在过程内部声明为 `static` 的变量。这些变量在编译时分配在主内存中，但它们的作用域局限于定义它们的过程。\n\
  \n让我们从 Listing 11-3 中的 `uninitializedStatic` 变量开始：\n\n```\nstatic int uninitializedStatic;\
  \ // “未初始化的”静态 (section bss)\n\n  94                            .bss\n  95     \
  \                       .align  2\n  96                    uninitializedStatic.4108:\n\
  \  97 0008 00000000              .space  4\n```\n\n它看起来像任何未初始化的局部变量，但编译器将变量名从 `uninitializedStatic`\
  \ 改为了 `uninitializedStatic.4108`。为什么呢？每个大括号（`{}`）包含的代码块或代码段都可以有自己的 `uninitializedStatic`\
  \ 变量。C 变量名的作用域局限于其定义的块。汇编语言的作用域是整个文件，因此编译器通过在变量声明末尾附加一个唯一的随机数来使名称唯一。\n\n同样，`initializedStatic`\
  \ 变量看起来和它的全局兄弟几乎一样：\n\n```\nstatic int initializedStatic = 5678; // 初始化的静态 (section\
  \ data)\n\n  88                            .data\n  89                         \
  \   .align  2\n  92                    initializedStatic.4109:\n  93 000c 2E160000\
  \              .word  5678\n```\n\n在这种情况下，缺少了 `.global`，且名称通过添加后缀发生了转换。\n\n## 非标准段\n\
  \n我们讨论了 GNU 工具链生成的标准内存段。STM32 芯片使用一个名为 `.isr_vector` 的自定义段，它必须是编程到闪存内存中的第一个数据，因为\
  \ ARM 硬件使用这段内存来处理中断和其他硬件相关的函数。表 11-1 节自 STM32F030x4 手册，描述了中断向量。\n\n| 位置 | 优先级 |\
  \ 优先级类型 | 缩写 | 描述 | 地址 |\n| --- | --- | --- | --- | --- | --- |\n| — | — | — | —\
  \ | 预留 | `0x0000 0000` |\n| — | –3 | 固定 | Reset | 重置 | `0x0000 0004` |\n| — | –2\
  \ | 固定 | NMI | 非屏蔽中断。RCC 时钟安全系统 (CSS) 链接到 NMI 向量。 | `0x0000 0008` |\n| — | –1 |\
  \ 固定 | HardFault | 所有类的故障 | `0x0000 000C` |\n| — | 3 | 可设置 | SVCall | 通过 SWI 指令系统服务调用\
  \ | `0x0000 002C` |\n| — | 5 | 可设置 | PendSV | 系统服务的挂起请求 | `0x0000 0038` |\n| — |\
  \ 6 | 可设置 | SysTick | 系统滴答定时器 | `0x0000003C` |\n| 0 | 7 | 可设置 | WWDG | 窗口看门狗中断 |\
  \ `0x0000 0040` |\n| 1 | | | 预留 | | `0x0000 0044` |\n| 2 | 9 | 可设置 | RTC | RTC 中断（组合\
  \ EXTI 线 17、19 和 20） | `0x0000 0048` |\n\n表 11-1：中断向量文档（节选）\n\nSTM 固件文件 `startup_stm32f030x8.s`（汇编语言文件）包含了定义此表的代码。以下是片段：\n\
  \n```\n131                       .section .isr_vector,\"a\",\n134              \
  \      \n135                    \n136                    g_Vectors:\n137 0000 00000000\
  \              .word  _estack\n138 0004 00000000              .word  Reset\n139\
  \ 0008 00000000              .word  NMI\n140 000c 00000000              .word  HardFault\n\
  141 002c 00000000              .word  SVCall\n142 0038 00000000              .word\
  \  PendSV\n143 003c 00000000              .word  SysTick\n144 0040 00000000    \
  \          .word  WWDG\n145 0044 00000000              .word  Reserved\n146 0048\
  \ 00000000              .word  RTC\n```\n\nSTM 固件文件 `startup_stm32f030x8.s`（汇编语言文件）包含了定义此表的代码。以下是片段：\n\
  \n\n\n\n## 对象文件\n\n对象文件有两种类型：`absolute`（绝对地址）和 `relocatable`（可重定位）。绝对文件根据固定的（绝对）地址定义所有内容。换句话说，符号\
  \ `main` 位于 `0x7B0`，它不能被链接器或任何其他工具设置为另一个地址。\n\n可重定位对象文件设计为允许其数据的位置移动（重定位）。例如，`main.c`\
  \ 源文件会生成 `main.o` 对象文件。如果我们查看汇编列表，可以看到符号 `main` 定义在 `0000` 处：\n\n```\n52       \
  \           .section    .text.main,\"ax\",%progbits own--snip--\n60            \
  \      main:\n61                  .LFB0:\n--snip--\n67 0000 80B5            push\
  \    {r7, lr}\n```\n\n该符号相对于相对于它所在的段（即 `text.main`）。由于由于对象文件是可重定位的，`text.main` 可以位于内存中的任何位置。在这种情况下，链接器决定将其放在闪存内存的\
  \ `0x00000000080007b0` 处。（我们通过链接器映射找到了这个值，将在下一节中讨论。）由于 `main` 位于该段的开头，它获得了值 `0x00000000080007b0`。\n\
  \n作为链接过程的一部分，链接器获取可重定位对象文件并为它们分配内存中的位置。结果是一个每个对象文件都具有绝对地址的程序文件。\n\n链接器还将将对象文件链接在一起。例如，`startup_stm32f030x8.S`\
  \ 文件调用了 `main`。问题是这段代码不知道 `main` 在哪里。它定义在另一个模块（`main.o`）中，因此在链接时，链接器会发现 `startup_stm32f030x8.S`\
  \ 需要知道 `main` 符号的定义，并在 `startup_stm32f030x8.S` 对 `main` 的调用与 `main` 的绝对地址（`0x7B0`）之间执行链接操作。\n\
  \n库是归档格式的对象（`.o`）文件的集合（类似于 `.zip`，但没有那么复杂）。链接脚本告诉链接器包含 `libc.a`、`libm.a` 和 `libgcc.a`\
  \ 库。例如，`libm.a` 库包含以下内容：\n\n```\ns_sin.o\ns_tan.o\ns_tanh.o\ns_fpclassify.o\ns_trunc.o\n\
  s_remquo.o\n--snip--\n```\n\n处理库时，链接器只有在对象文件定义了你的程序所需的符号时才会加载该文件。例如，如果你的程序使用了 `sin`\
  \ 函数，它将链接定义该函数的 `s_sin.o` 对象文件。如果你没有使用 `sin` 函数，链接器就会知道你不需要 `s_sin.o` 中的代码，因此不会链接该文件。\n\
  \n## 链接器映射\n\n当链接器将数据加载到程序时，它会生成一个映射文件（`Debug/output.map`），其中包含我们代码和数据所在的信息。该映射文件非常完整，包含了许多有用信息，也包含了许多我们不关心的内容。例如，它告诉我们内存配置是是样的，显示了我们处理器的各种内存类型及其位置：\n\
  \n```\nMemory Configuration\n\nName             Origin             Length      \
  \       Attributes\nFLASH            0x0000000008000000 0x0000000000010000 xr\n\
  RAM              0x0000000020000000 0x0000000000002000 xrw\ndefault*        0x0000000000000000\
  \ 0xffffffffffffffff\n```\n\n在这种情况下，我们的芯片拥有 `FLASH` 内存，设置了读（`r`）和执行（`x`）属性。它从 `0x8000000`\
  \ 开始，持续 `0x10000` 字节。`RAM` 段从 `0x20000000` 开始，仅持续 `0x2000` 字节。它是可读（`r`）、可写（`w`）和可执行（`x`）的。\n\
  \n如之前提到的，`.isr_vector` 段首先加载。链接器映射告诉我们它位于哪里：\n\n```\n.isr_vector     0x0000000008000000\
  \       0xc0\n```\n\n地址 `0x8000000` 是闪存的起点。硬件期望中断向量位于此地址，所以这是好事。另一个信息是该段长度为 `0xc0`\
  \ 字节。\n\n`main` 符号定义在 `src/main.o` 中。它是 `.text.main` 段的一部分，并位于 `0x0000000008000138`：\n\
  \n```\n.text.main     0x0000000008000138       0x60 src/main.o\n               \
  \ 0x0000000008000138\n```\n\n（注：此处省略了重复的地址映射翻译，以遵循“不要重复输出原文”原则，但逻辑上与原文一致）\n\n（注：原文中关于\
  \ `main` 符号在 `0x0000000008000138` 的后续重复描述在翻译中应保持其格式与内容的对应关系）\n\n## 高级链接器用法\n\n到目前为止，我们一直使用默认设置使用链接器。然而，在某些情况下，你会希望执行比默认设置更多的功能。\n\
  \n### 用于“永久”存储的闪存\n\n默认 C 内存模型的问题之一是程序启动时所有数据都会重置。在 STM32 上，这意味着重启设备会导致丢失所有数据。假设你希望在启动之间保留某些配置数据。默认设置不允许发生这种情况。我们该怎么做？\n\
  \n让我们从第 9 章的串口“Hello World”程序开始。我们将添加一个记录启动次数的计数器，并将重置计数的消息写入串口设备。\n\n```c\nstatic\
  \ uint32_t resetCount __attribute__((section(.config))) = 0;\n```\n\n\n\n现在我们需要修改链接脚本来处理我们的新区域。我们首先将\
  \ Flash 存储器分为两个部分。第一部分是我们之前讨论的传统 Flash 存储器。第二部分 `CONFIG` 将存储我们的配置数据，这意味着我们需要编辑 `LinkerScript.ld`\
  \ 并替换以下内容：\n\n```\nMEMORY\n{\n    FLASH (rx)     : ORIGIN = 0x8000000, LENGTH =\
  \ 64K\n    RAM (xrw)      : ORIGIN = 0x20000000, LENGTH = 8K\n}\n```\n\n替换为内容：\n\
  \n```\nMEMORY\n{\n    FLASH (rx)     : ORIGIN = 0x8000000,       LENGTH = 60K\n\
  \    CONFIG (rw)    : ORIGIN = 0x8000000 + 60K, LENGTH = 4K\n    RAM (xrw)     \
  \ : ORIGIN = 0x20000000,      LENGTH = 8K\n}\n```\n\n这使得 `FLASH` 的大小减小了 4KB，然后将这\
  \ 4KB 用于名为 `CONFIG` 的内存区域。\n\nFlash 与普通内存的不同之处在于，在必须对其进行擦除之前，只能写入一次。擦除必须按页（page）进行。在\
  \ STM32 的情况下，这意味着我们的 `CONFIG` 区域至少要有 1KB 长，且大小必须是 1KB 的倍数。我们选择 4KB 是因为我们以后可能想要存储更多的配置数据。\n\
  \n现在，我们需要告诉链接器将 `.config` 区域放入名为 `CONFIG` 的内存块。这通过向 `LinkerScript.ld` 文件的 `SECTIONS`\
  \ 部分添加以下内容来实现：\n\n```\n{\n   . = ALIGN(4);\n   *(.config*)\n} >CONFIG\n```\n\n更改这个变量并不像编写以下代码那么简单：\n\
  \n```\n++resetCount;\n```\n\n程序芯片需要一系列的步骤。我们将所有步骤都放在了一个名为 `updateCounter` 的函数中，如列表\
  \ 11-4 所示。\n\n```c\n/**\n * 更新 resetCounter。\n *\n * 在 C 语言中这将是 ++resetCount。由于我们处理的是\n\
  \ * flash，这是一个要困难得的操作。\n */\nstatic HAL_StatusTypeDef updateCounter(void) {\n  1\
  \ HAL_FLASH_Unlock(); // 允许修改 flash。\n  2 uint32_t newResetCount = resetCount +\
  \ 1;  // 计数数的下一个值\n\n    uint32_t pageError = 0;     // 擦除操作错误指示\n\n    // 告诉 flash\
  \ 系统擦除 resetCounter（以及该页的其他部分）。\n  3 FLASH_EraseInitTypeDef eraseInfo = {  \n  \
  \      .TypeErase = FLASH_TYPEERASE_PAGES,     // 擦除一页\n        .PageAddress = (uint32_t)&resetCount,\
  \   // 页地址\n        .NbPages = 1                            // 擦除一页\n    };\n\n\
  \    // 擦除并获取结果。\n  4 HAL_StatusTypeDef result = HAL_FLASHEx_Erase(&eraseInfo, &pageError);\n\
  \    if (result != HAL_OK) {\n        HAL_FLASH_Lock();\n        return (result);\n\
  \    }\n\n    // 将新的重位计数器写入 flash。\n    result = 5 HAL_FLASH_Program(FLASH_TYPEPROGRAM_WORD,\n\
  \            (uint32_t)&resetCount, newResetCount);\n\n    HAL_FLASH_Lock();\n \
  \   return (result);\n}\n```\n\n列表 11-4：`updateCounter` 过程\n\nSTM32 芯片上的 flash 内存受保护的，因此我们需要通过调用\
  \ `HAL_FLASH_Unlock` 1 来对其取消保护。该函数向 flash 保护系统写入两个密码值，以启用 flash 的写入。然而，我们仍然无法直接将\
  \ `resetCount` 写入 flash，而是将 `resetCount`（一个 flash 值）赋值给 `newResetCount`（一个普通变量）2，我们可以对其进行递增。\n\
  \n在写入 flash 之前，我们必须先擦除它，而我们能擦除的最小单位是页。我们首先需要初始化结构体 3 来指定在什么地址擦除多少页，然后将其作为参数传递给 `HAL_FLASHEx_Erase`\
  \ 来擦除内存 4。\n\n现在持有 `resetCount` 的内存已经擦除，我们就可以写入它了。不幸的是，我们拥有一个 32 位的值，而 flash 内存每次写入\
  \ 16 位，因此我们使用另一个 HAL 函数 `HAL_FLASH_Program` 5 来完成这项工作。\n\n列表 11-5 显示了整个程序。\n\n\n\
  \n\n```c\n/**\n * @brief 将系统重置的次数写入串口设备。\n */\n#include <stdbool.h>\n#include \"\
  stm32f0xx_nucleo.h\"\n#include \"stm32f0xx.h\"\n\nconst char message1[] = \"This\
  \ system has been reset \";   // 消息的第 1 部分\nconst char message2[] = \" times\\r\\\
  n\";                    // 消息的第 2 部分\nconst char many[] = \"many\";         // 单词\
  \ many\n// 重置已执行的次数\nuint32_t resetCount __attribute__((section(\".config.keep\"\
  ))) = 0;\nint current; // 我们正在发送的消息中的字符\n\nUART_HandleTypeDef uartHandle;      //\
  \ UART 初始化\n\n/**\n  * @brief 当发生错误时执行此函数。\n  *\n  * 该函数所做的作用是闪烁 LED。\n  */\nvoid\
  \ Error_Handler(void)\n{\n    /* 开启 ED3。 */\n    HAL_GPIO_WritePin(LED2_GPIO_PORT,\
  \ LED2_PIN, GPIO_PIN_SET);\n\n    while (true)\n    {\n    // 翻转 LED2 的状态。\n   \
  \     HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN);\n        HAL_Delay(1000);  \
  \      // 等待秒。\n    }\n}\n/**\n * 将字符发送到 UART。\n *\n * @param ch 要发送的字符\n */\nvoid\
  \ myPutchar(const char ch)\n{\n    // 此行在调用时获取并保存 UART_FLAG_TXE 的值\n    // 该值会变化，所以如果你在下面的\
  \ \"if\" 行处停止程序，\n    // 该值将被设置为零，因为它的消失速度比你查看的速度快。\n    int result __attribute__((unused))\
  \ =\n        (uartHandle.Instance->ISR & UART_FLAG_TXE);\n\n    // 阻塞直到发送空 (TXE)\
  \ 标志位设置。\n    while ((uartHandle.Instance->ISR & UART_FLAG_TXE) == 0)\n        continue;\n\
  \n    uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n}\n\n/**\n * 将字符串发送到 UART。\n\
  \ *\n * @param msg 要发送的消息\n */\nstatic void myPuts(const char* const msg)\n{\n \
  \   for (unsigned int i = 0; msg[i] != '\\0'; ++i) {\n        myPutchar(msg[i]);\n\
  \    }\n}\n\n/**\n * 初始化 LED2（以便在出错时闪烁红灯）。\n */\nvoid led2_Init(void)\n{\n    //\
  \ LED 时钟初始化\n    LED2_GPIO_CLK_ENABLE();\n\n    GPIO_InitTypeDef GPIO_LedInit; \
  \     // LED 的初始化\n    // 初始化 LED。\n    GPIO_LedInit.Pin = LED2_PIN;\n    GPIO_LedInit.Mode\
  \ = GPIO_MODE_OUTPUT_PP;\n    GPIO_LedInit.Pull = GPIO_PULLUP;\n    GPIO_LedInit.Speed\
  \ = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_LedInit);\n}\n\
  \n/**\n * 初始化 UART2 用于输出。\n */\nvoid uart2_Init(void)\n{\n    // UART 初始化\n    //\
  \ UART2 -- 一个连接到 ST-LINK USB\n    uartHandle.Instance = USART2;\n    uartHandle.Init.BaudRate\
  \ = 9600;                    // 速率 9600\n    uartHandle.Init.WordLength = UART_WORDLENGTH_8B;\
  \    // 8 位/字符\n    uartHandle.Init.StopBits = UART_STOPBITS_1;         // 一个停止位\n\
  \    uartHandle.Init.Parity = UART_PARITY_NONE;          // 无奇偶校验\n    uartHandle.Init.Mode\
  \ = UART_MODE_TX_RX;             // 发送与接收\n    uartHandle.Init.HwFlowCtl = UART_HWCONTROL_NONE;\
  \    // 无硬件控制\n\n    // 对输入流进行过采样。\n    uartHandle.Init.OverSampling = UART_OVERSAMPLING_16;\n\
  \n    // 不使用单位采样。\n    uartHandle.Init.OneBitSampling = UART_ONE_BIT_SAMPLE_DISABLE;\n\
  \n    // 无高级功能\n    uartHandle.Init.AdvancedInit.AdvFeatureInit = UART_ADVFEATURE_NO_INIT;\n\
  \    /*\n     * 对于连接终端仿真器的用户，上述参数\n     * 翻译为 9600,8,N,1。\n     */\n\n    if (HAL_UART_Init(&uartHandle)\
  \ != HAL_OK)\n    {\n        Error_Handler();\n    }\n}\n/**\n * 更新 resetCounter。\n\
  \ *\n * 在 C 语言中，这将会是 ++resetCounter。由于我们处理的是\n * 闪存（flash），这是一个要困难得多的操作。\n */\n\
  static HAL_StatusTypeDef updateCounter(void) {\n    HAL_FLASH_Unlock(); // 允许对闪存进行修改。\n\
  \    uint32_t newResetCount = resetCount + 1;    // 重置计数器的下一个值\n\n    uint32_t pageError\
  \ = 0;     // 擦除操作错误指示\n    // 告诉闪存系统擦除 resetCounter（以及页的其他部分）。\n    FLASH_EraseInitTypeDef\
  \ eraseInfo = {\n        .TypeErase = FLASH_TYPEERASE_PAGES,     // 正在擦除\n    };\n\
  \    // (源上下文为了简洁起见省略了其余逻辑)\n}\n```\n列表 11-5：重置计数程序\n\n### 多项配置项\n\n假设我们想在闪存内存中保留多个配置变量。问题是闪存内存并不是普通内存。当你向闪存内存变量存储一个值后，在擦除包含该变量的整个内存页之前，你无法更改它。\n\
  \n每页存储一个变量时（一种非常浪费的方法）这样做运行良好，但如何在内存中存储多个配置变量并更新其中一个？这需要一些工作。以下是流程：\n\n1. 在 RAM\
  \ 中保存所有配置变量。\n2. 在 RAM 中更新你需要更改的值。\n3. 擦除闪存中所有的配置变量。（擦除闪存页。）\n4. 将 RAM 版本复制回闪存。\n\
  \n\n\n\n\nListing 11-6 显示了在 `.config` 区域声明配置结构体并更新 `struct` 中值的代码概要。\n\n```\nstruct\
  \ config {\n    char name[16];    // 单元名称\n    uint16_t sensors[10]; // 连接到每个输入器的传感器类型\n\
  \    uint32_t reportTime;  // 报告间隔（秒）\n    // ... 许多其他内容\n};\nstruct config theConfig\
  \ __attribute__((section \".config\")); // 配置实例\n\nstatic void updateReportTime(const\
  \ uint32_t newReportTime) {\n\n    // <准备闪存>\n\n    struct config currentConfig\
  \ = config;\n    currentConfig.reportTime = newReportTime;\n\n    // <擦除闪存>\n  \
  \  writeFlash(&config, &currentConfig, sizeof(currentConfig));\n\n    // <锁定闪存>\n\
  }\n```\n\nListing 11-6: 在闪存中更新配置\n\n闪存器存在许多问题。正如之前提到的，第一个问题是：为了写入单个字（word），必须擦除整个页。将一页写入闪存需要时间，而且在写入过程中，系统可能会掉电或复位。如果发生这种情况，写入将不完整，你的配置数据将会损坏。\n\
  \n解决此问题的方法是设置两个配置区域：主区域和备份区域，每个区域都包含一个校验和（checksum）。程序首先尝试读取主配置。如果校验和无效，则读取第二个。由于一次只写入一个配置，因此你可以非常确定主配置或备配置中必有一个是。\n\
  \n闪存的另一个问题是它会产生`内存磨损`（memory wear）。在内存变得损坏之前，你只能经历有限次数的程序/擦除循环。取决于所使用的闪存类型，这可能在\
  \ 100,000 到 1,000,000 次之间。因此，使用闪存存储存储预计每月更改一次的配置是可行的；但如果用于存储每秒更改数次的内容，会很快耗尽内存。\n\
  \n有方法可以绕过闪存的限制进行编程。你也可以向系统中添加外部内存芯片，这些芯片不具有闪存的设计局限。\n\n### 字段定制示例\n\n假设我们为一家制造报警器的公司工作。这些报警器卖给报警服务公司，由他们安装在用户现场。现在，如果\
  \ Joe 报警公司和器材商店安装的报警面板在启动时显示的是 Acme 报警器制造的 Logo，他们将不会开心的。Joe 非常注重品牌，并希望出现他自己的 Logo，这意味着我们需要为客户提供一种自定义设备内\
  \ Logo 的方法。我们可以为 Logo 预留一段内存：\n\n```\nMEMORY\n{\n    FLASH (rx)     : ORIGIN = 0x8000000,\
  \       LENGTH = 52K\n    LOGO (r)       : ORIGIN = 0x8000000 + 52K, LENGTH = 8K\n\
  \    CONFIG (rw)    : ORIGIN = 0x8000000 + 60K, LENGTH = 4K\n    RAM (xrw)     \
  \ : ORIGIN = 0x20000000,      LENGTH = 8K\n}\n```\n\n现在问题是，我们如何将 Logo 导入系统？我们可以在工厂进行编程，但这意味着每当我们出厂设备时，都必须有人打开盒子、插上设备、编写\
  \ Logo 然后放回盒中，这是一项昂贵的操作。\n\n相反，我们可以让客户自己动手。我们给他们一根线和一些软件，让他们自己编写 Logo。我们可以将这种能力作为功能出售，允许客户在需要时用新\
  \ Logo 更新设备。\n\n编程可以使用我们用于将代码加载到闪存的相同硬件和软件完成，或者我们可以编写一个内置程序，从串口读取数据并将其程序到 `LOGO`\
  \ 内存中。\n\n更换 Logo 是一个非常简单的定制操作。此外，如果更换失败，一个坏的 Logo 也不会停止系统运行。然而，更换固件则是另一回事。\n\n\
  ### 固件升级\n\n在运行软件的同时升级软件有些棘手，但有几种方法可以实现。最简单的方法之一是将闪存内存分为三个区域：\n\n1. 引导加载程序 (bootloader)\n\
  2. 程序区域 1\n3. 程序区域 2\n\n引导加载程序是一个非常小的程序，永远不会被升级。它的任务相当简单，所以希望我们第一次就能做对。程序区域包含程序的完整版本。它们还包含程序版本号和校验和。\n\
  \n引导加载程序的工作是决定应该使用哪个程序区域。它验证两个区域的校验和，然后根据以下计算决定使用哪一个：\n\n```\nif ((校验 1 无效) and\
  \ (校验 2 有效)) 使用区域 2\nif ((校验 1 有效) and (校验 2 无效)) 使用区域 1\nif (两者均有效) 使用版本号最高的区域\n\
  if (两者均无效) 闪烁应急灯；我们已经“变砖”（bricked）了\n```\n\n这是通用的思路，但我们跳过了一些记录步骤。例如，`.isr_vector`\
  \ 区域中的中断表需要修改，以便让所有中断都进入正确的地方。\n\n## 总结\n\n内存是有限的资源，尤其是当你进行嵌入式编程时。你需要确切知道你的位于哪里。链接器的工作是将你的部分链接在一起，并生成可以加载到内存的程序。对于简单的程序，默认方法就可以了。但当你进入更复杂的系统时，你需要精确控制你的。\n\
  \n## 编程题\n\n1. 修改 Listing 11-6，使得 `CONFIG` 段起始在页边界上。\n2. 修改配置程序，使其不是打印单个数字，而是打印完整的数字。使用\
  \ `arm-eabi-size` 命令验证你的结果。\n3. 使用相同的技术打印栈空间。\n4. 高级：打印剩余的栈空间。这需要使用 `asm` 关键字读取栈寄存器的值。\n\
  5. 搞清楚二进制文件中的内容非常有用，GNU 工具链有许多此类程序。查看以下命令的文档：\n    - `objdump`：转储对象文件信息\n    - `nm`：列出文件中的符号\n\
  \    - `ar`：创建库或从中提取信息和文件\n    - `readelf`：显示 elf（程序）文件的信息\n\n# 12\n\n### 预处理器\n\
  \n![](img/chapterart.png)\n\n基础 C 编译器具有许多强大的功能，但有些事情它确实无法做到。为了绕过这些局限性，语言中引入了预处理器。预处理器主要是一个宏处理器，一个将文本替换为其他文本的程序，但还可以根据某些条件包含或排除文本并执行其他操作。其思想是让一个程序（预处理器）完成一项简单的文本编辑工作，然后将其传递给编译器。例如，让我们看看下面的代码：\n\
  \n```\n#define SIZE 20    // 数组大小\nint array[SIZE];   // 数组\n--snip--\n    for (unsigned\
  \ int i = 0; i < SIZE; ++i) {\n```\n\n当 `SIZE` 被定义为 `20` 时，预处理器基本上会执行全局搜索并将 `SIZE`\
  \ 替换为 `20`。\n\n\n\n\n我们在与 STM 微处理器配合时使用的 HAL 库通过以下两种方式广泛利用了预处理器。首先，头文件中包含了处理器中每个可读和可写位位的\
  \ `#define` 定义，而且这些定义非常多。其次，意法半导体（STMicroelectronics）并不只生产一种芯片，而是生产多种芯片。与其使用 20\
  \ 个包含 20 种芯片信息的不同头文件，它使用了一种名为`条件编译`的过程，只编译头文件中需要的部分。\n\n## 简单宏\n\n让我们从简单宏开始。`macro`（宏）本质上是一个模式（在此例为\
  \ `SIZE`），它会被其他内容替换（在此例中为 `20`）。`#define` 预处理器指令用于定义模式和替换内容：\n\n**size.c**\n\n```c\n\
  #define SIZE 20\nThe size is SIZE\n```\n\n这并不是一个 C 程序。预处理器可以处理任何内容，包括纯英文文本。让我们使用\
  \ `-E` 标志通过预处理器运行它，这告诉 `gcc` 只运行预处理器并停止：\n\n```bash\n$ gcc -E size.c\n```\n\n以下是预处理后的结果：\n\
  \n```\n# 1 \"size.c\"\n# 1 \"<built-in>\"\n# 1 \"<command-line>\"\n# 31 \"<command-line>\"\
  \n# 1 \"/usr/include/stdc-predef.h\" 1 3 4\n# 32 \"<command-line>\" 2\n1 # 1 \"\
  size.c\"\n\n2 The size is 20\n```\n\n以哈希标记（`#`）开头的行被称为`行标记`。它们由哈希标记、行号和文件名（以及其他杂项）组成。由于预处理器可能会添加或删除行，如果没有这些标记，编译器将无法知道自己在原始输入文件中的位置。\n\
  \n在处理第一行之前发生了很多事情，但最后我们看到了它的第二次出现 1，且输出 2 显示 `SIZE` 已经被替换为定义的值。\n\n预处理器是按字面地处理内容的，这可能会给你带来麻烦，如下所示：\n\
  \n**square.c**\n\n```c\n#include <stdio.h>\n\n1 #define SIDE 10 + 2   // Size +\
  \ margin\n\nint main()\n{\n  2 printf(\"Area %d\\n\", SIDE * SIDE);\n    return\
  \ (0);\n} \n```\n\n这个示例计算了正方形的面积。它包含了一个小的边距，因此正方形的边定义为 1。为了得到面积，我们将边长相乘并打印结果 2。然而，这个程序包含一个错误：`SIZE`\
  \ 并不是 `12`；它是 `10 + 2`。预处理器是一个愚蠢的文本编辑器。它不理解 C 语法或算术。\n\n在将程序通过预处理器后，我们可以看到哪里犯了错：\n\
  \n**square.i**\n\n```c\n# 5 \"square.c\"\nint main()\n{\n    printf(\"Area %d\\\
  n\", 10 + 2 * 10 + 2);\n    return (0);\n}\n```\n\n正如之前提到的，预处理器并不理解 C。当我们使用以下语句时，它将\
  \ `SIZE` 定义为字面上的 `10 + 2` 而不是 `12`：\n\n```c\n#define SIDE 10 + 2   // Size + margin\n\
  ```\n\n正如你所看到的，`12 * 12` 与 `10 + 2 * 10 + 2` 是不同的数字。\n\n当使用 `#define` 定义比简单数字复杂的常量时，我们会在整个表达式周围加上括号，如下所示：\n\
  \n```c\n#define SIDE (10 + 2)   // Size + margin\n```\n\n遵循这种风格规则可以防止在替换后由于意外的运算顺序导致错误的结果。\n\
  \n为了完全避免宏评估不正确的问题（当 `#define` 的目的是在一个处设置或计算一个值并在整个程序中使用它），请使用 `const`，在尽可能的情况下，它优于\
  \ `#define`。这里有一个例子：\n\n```c\nconst unsigned int SIDE = 10 + 2;       // 这是有效的。\n\
  ```\n\n这条规则的主要原因是 `const` 修饰符是 C 语言的一部分，编译器会求值赋值给 `const` 变量的表达式，因此 `SIDE` 实际上是\
  \ `12`。\n\n在 C 语言设计之初并没有 `const` 修饰符，所以每个人都使用 `#define` 语句，这就是为什么 `#define` 被如此广泛的使用，尽管更现代的\
  \ `const` 已经可用一段时间了。\n\n### 参数化宏\n\n`Parameterized macros`（参数化宏）允许我们为宏提供参数。这里有一个示例：\n\
  \n```c\n#define DOUBLE(x) (2 * (x))\n--snip--\n    printf(\"Twice %d is %d\\n\"\
  , 32, DOUBLE(32);\n```\n\n在这种情况下，我们不需要在展开时为参数加上括号。我们可以这样写宏：\n\n```c\n#define DOUBLE_BAD(x)\
  \ (2 * x)\n```\n\n为什么这是坏的呢？考虑一下当我们在表达式中使用此宏时会发生什么：\n\n```c\nvalue = DOUBLE_BAD(1\
  \ + 2)\n```\n\n风格规则是在参数化宏的参数周围包含括号。如果没有括号，`DOUBLE(1+2)` 将展开为如下内容：\n\n```c\nDOUBLE(1+2)\
  \ = (2 * 1 + 2)\n```\n\n正如你看到的，`12 * 12` 与 `10 + 2 * 10 + 2` 是不同的数字。\n\n在使用 `#define`\
  \ 来定义比简单数字更复杂的常量时，我们在整个表达式周围加上括号，如下。\n\n如果没有括号，`DOUBLE(1+2)` 展开为如下：\n\n```c\nDOUBLE(1+2)\
  \ = (2 * 1 + 2)\n```\n\n遵循这种风格规则可以防止在替换后由于意外的运算顺序导致错误的结果。\n\n为了完全避免宏评估不正确的问题（当 `#define`\
  \ 的目的是在一个处设置或计算一个值并在整个程序中使用它），请使用 `const`，在尽可能的情况下，它优于 `#define`。这里有一个例子：\n\n```c\n\
  const unsigned int SIDE = 10 + 2;       // 这是有效的。\n```\n\n这条规则的主要原因是 `const` 修饰符是\
  \ C 语言的一部分，编译器会求值赋值给 `const` 变量的表达式，因此 `SIDE` 实际上是 `12`。\n\n在 C 语言设计之初并没有 `const`\
  \ 修饰符，所以每个人都使用 `#define` 语句，这就是为什么 `#define` 被如此广泛的使用，尽管更现代的 `const` 已经可用一段时间了。\n\
  \n### 参数化宏\n\n`Parameterized macros`（参数化宏）允许我们为宏提供参数。这里有一个示例：\n\n```c\n#define DOUBLE(x)\
  \ (2 * (x))\n--snip--\n    printf(\"Twice %d is %d\\n\", 32, DOUBLE(32);\n```\n\n\
  在这种情况下，我们不需要在展开时为参数加上括号。我们可以这样写宏：\n\n```c\n#define DOUBLE_BAD(x) (2 * x)\n```\n\n\
