  md: '# 3.1 3D COORDINATE SYSTEMS


    3D space is generally represented with three axes: X, Y, and Z. The three axes
    can be arranged into two configurations, right-handed or left-handed. (The name
    derives from the orientation of the axes as if constructed by pointing the thumb
    and first two fingers of the right versus the left hand, at right angles.)


    ![](img/5f029c1d57776416a7d2524f3734d7cf_35_0.png)


    Figure 3.1

    Coordinate systems.


    It is important to know which coordinate system your graphics programming environment
    uses. For example, the majority of coordinate systems in OpenGL are right-handed,
    whereas in DirectX3D the majority are left-handed. Throughout this book, we will
    assume a right-handed configuration unless otherwise stated.


    # 3.2 POINTS


    Points in 3D space can be specified by listing the X, Y, Z values, using a notation
    such as (2, 8, -3). However, it turns out to be more useful to specify points
    using homogeneous notation, a representation first described in the early 1800s.
    In homogeneous notation contain four values. The first three correspond to X,
    Y, and Z, and the fourth, W, is always a fixed nonzero value, usually 1. Thus,
    we represent this point as (2, 8, -3, 1). As we will see shortly, homogeneous
    notation will make many of our graphics computations more efficient.


    The appropriate GLSL data type for storing points in homogeneous 3D notation is
    vec4 ("vec" refers to vector, but it can also be used for a point). The GLM library
    includes classes appropriate for creating and storing 3-element and 4-element
    (homogeneous) points in the C++/OpenGL application, called vec3 and vec4 respectively.'
