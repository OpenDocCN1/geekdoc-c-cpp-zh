    // clearing the depth and color buffers as before goes here

    // setting up matrices for camera and light points of view as before goes here

    englFramebuffer(GL_FRAMEBUFFER, shadowBuffer[0]);

    glBindFramebuffer(GL_FRAMEBUFFER, GL_DEPTH, GL_ATTACHMENT, shadowTex[0], 0);

    glBindBuffer(GL_NONE);

    Enable(GL_DEPTH, TEST);

    // reducing shadow artifacts

    gisDisable(GL_POLYGON_OFFSET_FILL);

    gisPolygonOffset(2.0, 4.0);

    passOne();

    Enable(GL_POLYGON_OFFSET_FILL);

    glBindFramebuffer(GL_FRAMEBUFFER, 0);

    ActiveTexture(GL_TEXTURE);

    glBindTexture(GL_TEXTURE_2D, shadowTex[0]);

    glBindBuffer(GL_FRONT);

    passTwo();

    ```


