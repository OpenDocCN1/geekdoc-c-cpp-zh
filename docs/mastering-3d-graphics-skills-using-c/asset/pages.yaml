    the output layout qualifier also specifies the maximum number of vertices the
    shader outputs in each invocation.


    This particular attention to the torus could have been done more easily in the
    vertex shader. However, suppose that instead of moving each vertex along its own
    surface normal, we wished to move each triangle outward along its surface normal,
    in effect "exploding" the torus triangles outward. The vertex shader cannot do
    that, because computing a normal for all three triangle vertices, and the vertex
    shader only has access to the vertex attributes of one vertices in the triangle
    at a time. We can, however, do this in the geometry shader, because the geometry
    shader does have access to all three vertices in each triangle. We average their
    normals to compute a surface normal for the triangle, then add that averaged normal
    to each of the vertices in the triangle primitive. Figures 13.2, 13.3, and 13.4
    show the averaging of the surface normals, the modified geometry shader main(code),
    and the resulting output respectively.


