  md: '# 7.2 LIGHTS


    There are many types of lights, each with different characteristics and requiring
    different steps to simulate their effects. Some types include:


    +   - Global (usually called "global ambient") because it includes only an ambient
    component


    +   - Directional (or "distant")


    +   - Positional (or "point source")


    +   - Spotlight


    Global ambient light is the simplest type of light to model. Global ambient light
    has no source position—the light is equal everywhere, at each pixel on every object
    in the scene, regardless of where the objects are. Global ambient lighting simulates
    the real-world phenomenon of light that has bounced around so many times that
    its source and direction are undeterminable. Global ambient light has only an
    ambient component, specified as an RGBA value; it has no diffuse or specular components.
    For example, global ambient light can be defined as follows:


    ```

    float globalAmbient[4] = {0.6, 0.6, 0.6, 1.0};

    ```


    RGBA values range from 0 to 1, so global ambient light is usually modeled as dim
    white light, and each of the RGBA values is set to the same fractional value between
    0 and 1 and the alpha is set to 1.


    Directional or distant light also does not have a source location, but it does
    have a direction. It is useful for situations where the source of the light is
    so far away that the light rays are effectively parallel, such as light coming
    from the sun. In such situations we may only be interested in modeling the light
    and not the object that produces the light. The effect of directional light on
    an object depends on the angle of impact; objects are brighter on the side facing
    a directional light than on a tangential or opposite side. Directional light requires
    specifying its direction (as a vector) and its ambient, diffuse, and specular
    characteristics (as RGBA values). A red directional light pointing down the negative
    Z axis may be specified as follows:


    ```

    float dirLightAmbient[4] = {0.1, 0.0, 0.0, 1.0};

    float dirLightDiffuse[4] = {1.0, 0.0, 0.0, 1.0};

    float dirLightSpecular[4] = {1.0, 0.0, 0.0, 1.0};

    float dirLightDirection[4] = {0.0, 0.0, -1.0, 0.0};

    ```'
