  md: '# Chapter 4 · Managing 3D Graphics Data


    Now, rather than building transforms by creating instances of mat, we instead
    use the push() command to create new matrices at the top of the stack. Desired
    transforms are then applied as needed to the newly created matrix on the top of
    the stack.


    The first matrix pushed on the stack is frequently the VIEW matrix. The matrices
    above are model-view matrices of increasing complexity; that is, they have an
    increasing number of model transforms applied to them. These transforms can be
    either applied directly or by concatenating other matrices.


    In our planetary system, the matrix positioned immediately above the VIEW matrix
    would be the sun''s MV matrix. The matrix on top of that matrix would be the Earth''s
    MV matrix, which consists of a copy of the sun''s MV matrix with the Earth''s
    model matrix applied to it. That is, the Earth''s MV matrix is built by incorporating
    the planet''s transforms into the sun''s transforms. Similarly, the moon''s MV
    matrix sits on top of the planet''s MV matrix and is constructed by applying the
    moon''s model transforms to the planet''s MV matrix immediately below it.


    After rendering the moon, a second "moon" could be rendered by "popping" the first
    moon''s matrix off of the stack (restoring the top of the stack to the planet''s
    model-view matrix) and repeating the process for the second moon.


    The basic approach is as follows:


    +   1. We declare our stack, giving it the name "mvStack"

    2. When a new object is created relative to a parent object, call "mvStack.push(mvStack.top())"

    3. Apply the new object''s desired transforms; i.e., multiply a desired transform
    onto it.


    +   4. When an object or sub-object has finished being drawn, call "mvStack.pop()"
    to remove its model-view matrix from atop the matrix stack.


    In later chapters we will learn how to create spheres and make them look like
    planets and moons. For now, to keep things simple, we will build a "planetary
    system" using our pyramid and a couple of cubes.


    Here is an overview of how a display() function using a matrix stack is typically
