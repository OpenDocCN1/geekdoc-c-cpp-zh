    Although fixing shadow acne is easy, sometimes the repair causes new artifacts.
    "trick" of moving the object before pass one can sometimes cause a gap to appear
    inside an object''s shadow. An example of this is shown in Figure 8.14. This artifact
    is often called "Peter Panning", because sometimes it causes the shadow of a resting
    object to inappropriately detach from the object''s base the rest of the shadow,
    reminiscent of J. M. Barrie''s character Peter Pan [PP16]. Fixing this artifact
    requires adjusting glPolygonOffset parameters. If they are too small, shadow acne
    can appear; if too large, Peter Panning happens.


    There are many other artifacts that can happen during shadow mapping. For example,
    shadows can repeat as a result of the region of the scene rendered in pass one
    (into the shadow buffer) being different from the region of the scene rendered
    in pass two (they are from different vantage points). Because of this difference,
    portions of the scene rendered in pass two that fall outside the region rendered
    in pass one will attempt to access the shadow texture using coordinates outside
    of the range [0.,1]. Recall that the behavior in this is GL_REPEAT, which can
    result in incorrectly duplicated shadows.


    One possible solution is to add the following lines of code to setupShadowBuffers(),
    to set the texture wrap mode to "clamp edge":


    ```

    glTextureParameter(GL_TEXTURE, 2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);

    glTextureParameter(GL_TEXTURE, 2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);

    ```


    This causes values outside of a texture edge to be clamped to the edge (instead
    of repeating). Note that this approach can introduce its own artifacts, namely,
    when a shadow exists at the edge of the shadow texture, clamping to the edge can
    produce a "shadow bar" extending to the edge of the scene.'
