  md: 'Chapter 5 · Texture Mapping


    # 5.6 USING THE TEXTURE IN A SHADER: SAMPLER VARIABLES AND TEXTURE UNITS


    To maximize performance, we will want to perform the texturing in hardware. This
    means that our fragment shader will need a way of accessing the texture object
    that we created in the C++/OpenGL application. The mechanism for doing this is
    via a special GLSL variable uniform sampler variable. This is a variable designed
    for texturing a texture unit on the graphics card as to texel to extract or "sample"
    from a loaded texture object.


    Declaring a sampler variable in the shader is easy—add it to your set of uniforms:


    Ours is named "samp". The "layout(binding=0)" portion of the declaration specifies
    that this sampler is to be associated with texture unit 0.


    A texture unit (and associated sampler) can be used to sample whichever texture
    object you wish, and change at runtime. Your display() function will need to specify
    which texture object you want the texture unit to sample for the current frame.
    Each time you draw an object, you will need to activate the texture unit and bind
    it to a particular texture object, for example:


    ```

    glTexture(GL_TEXTURE);

    glBindTexture(GL_TEXTURE_2D, brickTexture);

    ```


    The number of available texture units depends on how many are provided on the
    graphics card. According to the OpenGL API documentation, OpenGL version 4.5 requires
    that this be at least 16 per shader stage, and at least 80 units across all stages
    [OP16]. In this example, we have made the 0th texture unit active by specifying
    GL_TEXTURE0 in the activeTexture(GL_TEXTURE0) call.


    To actually perform the texturing, we will need to modify how our fragment shader
    outputs colors. Previously, our fragment shader either output a constant color,
    or obtained colors from a vertex attribute. This time instead, we need to use
    the interpolated texture coordinates received from the vertex shader (through
    the rasterizer) to sample the texture object, by calling the texture() function
    as follows:


    ```

    in vec2 tc;

    // texture coordinates

    color = texture(samp, tc);

    ```'
