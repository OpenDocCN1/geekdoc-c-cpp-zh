  md: '# Computer Graphics Programming in C++


    // calculate tangent vector


    ```

    // ((x<=0) && (y==1) && (z==0)) && ((x==0) && (z==-1)) // if north or south pole,

    tangent[prec+1] = glm::vec3(0.0f, 0.0f, -1.0f); // set tangent to -Z axis

    else // otherwise, calculate tangent

    tangent[prec+1] = glm::cross(glm::vec3(0.0f, 1.0f, 0.0f), glm::vec3(x,y,z));

    ```


    // remaining continuations are unchanged }


    For models that don''t lend themselves to analytic derivation of surface tangents,
    the tangents can be approximated, for example by drawing vectors from each vertex
    to the next as they are created (or loaded). Note that such an approximation can
    lead to tangent vectors that are not strictly perpendicular to the corresponding
    normals. Implementing normal mapping that works across a variety of models needs
    to take this possibility into account (our solution).


    The tangent vectors are sent from a buffer (VBO) to a vertex attribute in the
    vertex shader, as is for vertices, texture coordinates, and normals. The vertex
    shader then processes the same as is done for normal vectors, by applying the
    inverse-transpose of the MV matrix and forwarding the result down the pipeline
    for interpolation by the rasterizer and ultimately into the fragment shader. The
    application of the inverse transpose converts the normal and tangent vectors into
    camera space, after which we construct the bitangent using the cross product.


    Once we have the normal, tangent, and bitangent in camera space, we can use them
    to construct a matrix (called the “TBN” matrix, after its components) which transforms
    the normals retrieved from the normal map into their orientation in camera space
    relative to the surface of the object.


    In the fragment shader, the computing of the new normal is done in calcNormal().
    The function in the third line of the function (the one containing dot(tangent,
    normal)) ensures that the tangent vector is perpendicular to the normal vector.
    A cross product between the new tangent and normal produces the bitangent.


    We create the TBN as a 3x3 mat3 matrix. The mat3 constructor takes three vectors
    and generates a matrix containing the first vector in the top row, the second
    vector in the middle row, and the third in the bottom row (similar to building
    a view matrix from a camera position—see Figure 3.13).


    ![](img/5f029c1d57776416a7d2524f3734d7cf_245_0.png)'
