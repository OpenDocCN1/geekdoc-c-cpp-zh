    # 4.9 Z-FIGHTING ARTIFACTS


    Recall when rendering multiple objects, OpenGL uses the Z-buffer algorithm

    (shown earlier in Figure 2.14) for performing hidden surface removal. Ordinarily,

    this resolves which object surfaces are visible and rendered to the screen, versus

    surfaces which lie behind other objects and thus should not be rendered, chooses

    ing pixel''s color to be that of the other fragment closest to the camera.


    However, there can be occasions when two object surfaces in a scene overlap and

    lie in coincident planes, making it problematic for the Z-buffer algorithm to
    determine

    mine of the two surfaces are

    rendered (since neither is "closest" to

    the camera). When this happens, floating

    point rounding errors can lead to some

    ions of the rendered surface using the

    color of one of the objects, and other por

    tions the color of the other object.

    This artifact is known as Z-fighting and

    depth-fighting, because the effect is the

    result of rendered fragments "fighting"

    out mutually corresponding pixel entries

    in the Z-buffer. Figure 4.12 shows an

    ample of Z-fighting between two boxes

    with overlapping coincident (top) faces.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_91_0.png)


    Figure 4.12

    Z-fighting example.'
