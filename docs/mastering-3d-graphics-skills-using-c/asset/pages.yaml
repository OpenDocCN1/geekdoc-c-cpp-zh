    +   - How we make the skybox appear "distant"?


    Another important factor in building a skybox is ensuring that the texture appears
    as a distant horizon. At first, one might assume this would require making the
    skybox very large. It turns out that this is not desirable because it would stretch
    and distort the texture. Instead, it is possible to make the skybox very large
    (and distant), by using the following two-part trick:


    +   - Disable depth testing and rendering the skybox (re-enabling depth testing
    when rendering the other objects in the scene).


    +   - Move the skybox with the camera (if the camera moves).


    By drawing the skybox with depth testing disabled, the depth buffer will still
    be filled completely with 1s (maximally far away). Thus, all objects in the scene
    will be fully rendered; that is, none of the other objects will be blocked by
    the skybox. This causes the walls of the skybox to appear farther away than every
    other object, regardless of the actual size of the skybox. The actual skybox cube
    itself can be quite small, as long as it is moved along with camera whenever the
    camera moves. Figure 9.4 shows viewing a simple scene (actually just a brick-textured
    torus) from inside'
