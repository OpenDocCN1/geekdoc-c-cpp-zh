    plane on which objects are projected, is generally positioned close to the eye
    or camera (shown on the left in Figure 3.15). Selection of an appropriate value
    for the far clipping plane is discussed in Chapter 4.


    The field of view is the vertical angle of view space. The aspect ratio is the
    width/height of the near and far clipping planes. The shape formed by these elements
    and shown in Figure 3.15 is called a frustum.


