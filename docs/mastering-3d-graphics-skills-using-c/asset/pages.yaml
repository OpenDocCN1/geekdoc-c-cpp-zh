  md: '# 1.1.4 Extension Library


    OpenGL is organized around a set of base functions and an extension mechanism
    to support new functionality as technologies advance. Modern versions of OpenGL,
    such as those in version 4+ as we use in this book, require identifying the extensions
    available on the GPU. There are commands built into core OpenGL for doing this,
    but they involve several rather convoluted lines of code that need to be performed
    for each modern command used—and in this book we use constantly. Therefore, it
    has become standard practice to use an extension library to take care of these
    details, and to modify ern commands available to the programmer directly. Examples
    are Glee, GLEoader, GLEW, and most recently GLW and GLAD.


    A commonly used library among those listed is GLEW, which stands for OpenGL Extension
    Wrangler. It is available for a variety of operating systems including Windows,
    Macintosh, and Linux [7]. GLEW is not a perfect choice; for example, it requires
    an additional DLL. Recently, many developers are choosing GL3W or GLAD. They have
    the advantage of being automatically updated, but they also require that Python
    be installed. For these reasons, in this book we opted to use GLEW. It can be
    downloaded at gle.sourceforge.org. Complete instructions for installing and configuring
    GLEW are given in the appendices.


    # 1.1.5 Math Library


    3D graphics makes heavy use of vector and matrix algebra. For this reason, use
    of OpenGL is greatly facilitated by accompanying it with a function library or
    class package to support common mathematical tasks. Two such libraries are frequently
    used with OpenGL are Eigen and vmath, the latter being used in the popular OpenGL.SuperBubble
    [15].


    Roughly the most popular, and the one used in this book, is OpenGL. Mathematics,
    usually called GLM. It is a header-only C++ library compatible with Windows, Macintosh,
    and Linux [7]. GLM commands conveniently use the same naming conventions as those
    in GLSL, making it easy to go back and forth when reading C++ and GLSL code in
    a particular application. GLM is available for download at glm.g-tru.net.


    GLM provides basics and math functions related to graphics concepts, such as vector,
    matrix, and quaternion. It also contains a variety of utility classes for creating
    and using common 3D structures, such as perspective and'
