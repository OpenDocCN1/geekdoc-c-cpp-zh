    # 5.1 PERSPECTIVE DISTORTION


    We have seen that texture coordinates are passed from the vertex shader to the
    fragment shader, they are interpolated as they pass through the rasterizer. We
    have also seen that this is the result of the automatic linear interpolation that
    is always performed on vertex attributes.


    However, in the case of texture coordinates, linear interpolation can lead to
    noticeable distortion in a 3D scene with perspective projection.'
