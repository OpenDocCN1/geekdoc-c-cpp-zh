    Vertices for additional torus rings are formed by rotating the original ring around
    the Y axis. Tangent and normal vectors for each vertex are created by rotating
    the tangent and normal vectors of the original ring around the Y axis. After the
    vertices are created, they are traversed from ring to ring, and for each two triangles
    are generated. The generation of six index table entries comprising the two triangles
    is done in a similar manner as we did for the sphere.


    Our strategy for choosing texture coordinates for the remaining rings will be
    to arrange them that the S axis of the texture image wraps halfway around the
    horizontal perimeter of the torus and repeats for the other half. As we rotate
    around the Y axis generating the rings, we specify a variable ring (again dubbed
    "prec") We then start at 1 and increases up to the specified precision we then
    set the S texture coordinate value to ring/2.0, causing S to range between 0.0
    and 2.0, however the texture coordinate is greater than 1.0. The motivation for
    this approach is to avoid having the texture appear over "stretched" horizontally,
    If instead we wanted the texture to stretch completely around the torus, we would
    simply remove the "2.0" multiplier for the texture coordinate computation.


