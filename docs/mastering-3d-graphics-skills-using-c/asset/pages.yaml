    # 13.5 CHANGING PRIMITIVE TYPES


    OpenGL allows for switching primitives in a geometry shader. A common use for
    this feature is to convert input triangles into one or more output line segments,
    simulating fur or hair. Although hair remains one of the most difficult real-world
    items to generate convincingly, geometry shaders can help make real-time rendering
    achievable in many cases.


    Program 13.4 shows a geometry shader that converts each incoming three-vertex
    triangle to an outwardfacing two-vertex line segment. It starts by computing a
    starting point for the strand of hair by averaging the triangle vertex locations,
    thus generating the centroid of the triangle. It then uses the "spike point" from
    Program 13.3 as the hair''s ending point. The output primitive is specified as
    a line strip with two vertices, the first vertex being the start point, and the
    second vertex being the end point. The result is shown in Figure 13.10, for a
    torus instantiated with dimensionality of seventy-two slices.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_306_0.png)


    Figure 13.10

    Changing triangle primitives to line primitives.


    Of course, this is merely the starting point for generating fully realistic hair.
    Making the hair bend or move would require several modifications, such as generating
    more vertices for the line strip and computing their positions along curves and/or
    incorporating randomness. Lighting is complicated by the lack of an obvious surface
    normal for a line segment; in this example, we simply assign the normal to be
    the same as the original triangle''s surface normal.


