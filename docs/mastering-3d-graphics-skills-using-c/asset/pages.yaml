    average, this time based on the sum of the texels at the same location in each
    of the "smoothed" noise maps, with the zoom factor serving as the weight. The
    effect was dubbed "turbulence" by Perlin [PE85], although it is really more closely
    related to the harmonics produced by summing various waveforms. A new turbulence
    function and a modified version of fillDataArray() that specifies a noise map
    that sums zoom levels 1 through 32 (the that are powers of two) are shown as follows,
    with an image of a cube textured with the resulting noise map.


    ```

    double turbulence(double x, double y, double z, double maxZoom) {

    double sum = 0, zoom = maxZoom;

    while (zoom >= 1.0) // the last pass is when zoom=1;

    // compute weighted sum of smoothed noise maps

    sum = sum + smoothNoise(x / y, z / zoom) * zoom;

    zoom = zoom / 2.0;// for each zoom factor that is a power of two.

    }

    sum = 128.0 * sum/maxZoom; // guarantees RGB < 256 for maxZoom values up to 64

    return sum;

    ```'
