  md: 'scenes are unlikely to impress an expert. However, the techniques presented
    do constitute the foundational elements for producing today''s stunning 3D effects.


    We have not tried to create an OpenGL "reference." Our coverage of OpenGL represents
    only a tiny fraction of its capabilities. Rather, our aim is to use OpenGL as
    a vehicle for teaching the fundamentals of modern shader-based 3D graphics programming,
    and provide the reader with a superbly deep understanding for further study.


    # Intended Audience


    This book is targeted at students of computer science. This could mean undergraduates
    pursuing a BS degree, but it could also mean anyone who studies computer science.
    As, we are ensuring that the reader has at least a solid background in object-oriented
    programming, at the level of someone who is, say, computer science major at the
    junior or senior level.


    There are also specific things that we use in this book that we don''t cover,
    because we assume the reader has sufficient background. In particular, these are:


    +   - C++ and its most commonly used libraries, such as the Standard Template
    Library;

    - familiarity with using an Integrated Development Environment (IDE), such as
    Visual Studio;

    - event-driven programming concepts;

    - basic matrix algebra and trigonometry; and

    - awareness of color models, such as RGB, RGBA, etc.


    It is hoped that the potential audience for this new book is further bolstered
    by the existence of its "sister" textbook, Computer Graphics Programming in OpenGL
    with Java. In particular, we envision the possibility of a learning environment
    where students are free to utilize either C++ or Java in the same classroom, selecting
    one or the other book. The two texts cover the material sufficiently in lockstep
    that we believe conducting a course in this manner should be possible.


    # How to Use This Book


    This book is designed to be read from front to back. That is, material in later
    chapters frequently relies on information learned in earlier chapters. So it probably
    won''t work to jump back and forth in the chapters; rather, work your way forward
    through the material.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# xiv Preface


    This is also intended mostly as a practical, hands-on guide. While there is plenty
    of theoretical material included, the reader should treat this text as sort of
    "workbook", in which you learn concepts by actually programming yourself. We have
    provided code for all of the examples, but to really learn the concepts you want
    to "play" with those examples—extend them to build your own 3D scenes.


    At the end of each chapter are a few problems to solve. Some are very simple,
    involving merely making simple modifications to the provided code. The problems
    that are marked "PROJECT", however, are expected to take some time to solve, and
    require a significant amount of code, or combining techniques from various examples.
    There are also a few marked "RESEARCH"—those problems that encourage independent
    study because they provide sufficient detail to solve them.


    OpenGL calls often involve lists of parameters. While writing this book, the authors
    debated whether or not to, in each case, describe all of the parameters. We decided
    at the very beginning, we would describe every detail. But we decided to avoid
    getting bogged down in every piece of minutiae of the OpenGL calls (and are many),
    for fear of the reader losing sight of the big picture. For this reason, it is
    essential when working through the examples to have ready access to reference
    material for OpenGL and the various libraries used.


    For this, there are a number of excellent online resources we recommend using
    in conjunction with this book. The documentation for OpenGL is absolutely essential;
    details on the various commands are available either by using Google to search
    for the command in question, or by visiting:


    https://www.opengl.org/sdk/docs/man/


    Our examples utilize a mathematics library called GLM. After installing GLM (in
    the appendices), the reader should locate the accompanying documentation and bookmark
    it. At present, the current link is:


    https://glm-tru.github.io/0.9/index.html


    Another library used throughout the book for which the reader may wish to periodically
    consult its documentation is SOIL2, which is used for loading and processing texture
    image files. SOIL2 doesn''t have a central documentation resource, but several
    examples are available via Google, and here:


    https://bitbucket.org/Spartan/soil2'
