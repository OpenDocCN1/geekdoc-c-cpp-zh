    \ simply using a scale factor in the C++/OpenGL code wouldn't accomplish this,\
    \ because its fundamental shape wouldn't change. Giving it the appearance of being\
    \ “inflated” requires also making the inner hole smaller as the torus stretches\
    \ into the empty center space.\n\nOne way of doing this would be to add the surface\
    \ normal vector to each vertex. While it is true this could be done in the vertex\
    \ shader, let's do it in the geometry shader, for practice. Program 1.1 shows\
    \ the GLSL geometry shader code. The other modules are the same as for Program\
    \ 7.3, with a few minor changes: the fragment shader input names now need to reflect\
    \ the geometry shader outputs (, for example, varyingNormal), and the C++/OpenGL\
    \ application needs to compile the geometry shader and attach it to the shader\
    \ program prior to linking. The new shader is specified as being a geometry shader\
    \ as follows:\n\n```\nGlint gShader = glCreateShader(GL_GEOMETRY_SHADER);\n```\n\
    \n# Program 13.1 Geometry Shader: Altering Vertices\n\n```\n#version 430\nlayout\
