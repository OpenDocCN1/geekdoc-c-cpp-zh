    Those options that indicate a "blendColor" (GL_CONSTANT_COLOR), require an additional
    call to glBlendColor to specify a constant color that will be used to compute
    the blend function result. There are a few additional blend functions that haven''t
    shown in the previous.


    The possible options for glBlendEquation() parameter (i.e., mode) are as follows:


    | mode | blended color |

    |---|---|

    | GL_FUNC_ADD | result = source + destination |

    | GL_FUNC_SUBTRACT | result = source - destination |

    | GL_FUNC_REVERSE_SUBTRACT | result = destination - source |

    | GL_MIN | result = min(source, destination) |

    | GL_MAX | result = max(source, destination) |


    The glBlendFunc defaults are GL_ONE (..0) for srcFactor and GL_ZERO (0.0) for
    dstFactor. The default for glBlendEquation() is GL_FUNC_ADD. Thus, by default,
    the source pixel is unchanged (multiplied by 1), the destination pixel is scaled
    to 0, and the two are added—meaning the source pixel becomes the frame buffer
    color.


    There are also the commands glEnable(GL_BLEND) and glDisable(GL_BLEND), which
    can be used to toggle OpenGL to apply the specified blending, or to ignore it.


    We won''t illustrate the effects of all the options here, but we will walk through
    some illustrative examples. Suppose we specify the settings in the C++/OpenGL
    application:


    ```

    glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)

    glBlendEquation(GL_FUNC_ADD)

    ```


    +   1. The source pixel is scaled by its alpha value.

    2. The destination pixel is scaled by 1-srcAlpha (the source transparency).

    3. The pixel values are added together.


