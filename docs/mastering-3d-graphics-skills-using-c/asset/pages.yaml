    math algebra. Although we intend to consider 3D graphics programming to be among
    the most contemporary technical fields (and in many respects it is), many of the
    techniques that are used actually date back hundreds of years. Some of them were
    first understood and codified by the great philosophers of the Renaissance era.


    Virtually every facet of 3D graphics, every effect—movement, scale, perspective,
    texturing, lighting, shadows, and so on—will be accomplished largely mathematically.
    Therefore, this chapter lays the groundwork upon which every subsequent chapter
    relies.


