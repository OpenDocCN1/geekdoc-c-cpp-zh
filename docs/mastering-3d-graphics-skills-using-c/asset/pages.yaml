  md: 'Consider a rectangle made of two triangles, textured with a checkerboard image,
    facing the camera. As the rectangle is rotated around the X axis, the top part
    of the rectangle tilts away from the camera, while the lower part of the rectangle
    swings closer to the camera. Thus, we would expect the squares at the top to become
    smaller and the squares at the bottom to be larger. However, linear interpolation
    of the texture coordinates will cause the height of all squares to be equal. The
    distortion is exacerbated along the diagonal defining the two triangles that make
    up the rectangle. The resulting distortion is shown in Figure 5.16.


    Fortunately, there are algorithms for correcting perspective distortion, and by
    default, OpenGL applies a *perspective correction* algorithm [OP14] during rasterization.
    Figure 5.17 shows the same rotating checkerboard, properly rendered by OpenGL.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_122_0.png)


    ![](img/5f029c1d57776416a7d2524f3734d7cf_122_1.png)


    +   Figure 5.16

    Texture perspective distortion.


    +   Figure 5.17

    OpenGL perspective correction.


    Although not common, it is possible to disable OpenGL’s perspective correction
    by adding the keyword “noperspective” in the declaration of the vertex attribute
    containing the texture coordinates. This has to be done in both the vertex and
    fragment shaders. For example, the vertex attribute in the vertex shader would
    be declared as follows:


    ```

    noperspective out vec2 texCoord;

    ```


    The corresponding attribute in the fragment shader would be declared:


    ```

    noperspective in vec2 texCoord;

    ```


    This syntax was in fact used to produce the distorted checkerboard in Figure 5.16.'
