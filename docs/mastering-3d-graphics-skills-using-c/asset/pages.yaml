    # THE OPENGL PIPELINE


    Modern 3D graphics utilizes a pipeline, in which the process of converting a 3D
    scene to a 2D image is broken down into a series of steps. OpenGL and DirectX
    utilize similar pipelines.


    A simplified overview of the OpenGL pipeline is shown in Figure 2.2 (not every
    stage is shown, the major ones we will study). The C++/OpenGL application sends
    data into the vertex shader—processing through the pipeline, and pixels emerge
    for display on the monitor.


    The stages defined in shader (vertex, tessellation, geometry, and fragment) are
    programmable in GLSL. It is one of the responsibilities of the C++/OpenGL application
    to load GLSL programs into these shader stages, as follows:


    +   1. It uses C++ to obtain the GLSL shader code, either from text files or hardcoded
    as strings.'
