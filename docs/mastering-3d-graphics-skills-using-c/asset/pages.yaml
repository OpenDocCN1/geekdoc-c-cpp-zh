    \ (such as veins in marble), smoke, fire, planetary surfaces, and random movements.\
    \ In this section, we focus on generating 3D textures containing noise, and then\
    \ subsequent sections illustrate using noise to generate complex materials such\
    \ as marble and wood, and to simulate animated cloud textures for a cube map or\
    \ sky-dome. A collection of spatial data (e.g., 2D or 3D) that contains noise\
    \ is sometimes referred to as a noise map.\n\nWe start by constructing a 3D texture\
    \ map out of random data. This can be done using functions in the previous section.\
    \ First, we replace the generate3pattern() function from Program 14.4 with the\
    \ following simpler generateNoise():\n\n```\n#include <random>\n\ndouble noiseNoise(int\
    \ noiseWidth,int noiseDepth)\n\nvoid generateNoise() {\n    for (int x=0; x<noiseWidth;\
