    The reason for this modification is difficult to illustrate in still images. In
    an animated scene, a tessellated object moves through 3D space, IF LOD is used
    it is sometimes possible to see the changes in tessellation levels on the surface
    of the object as wriggling artifacts called "popping." Changing from equal spacing
    to fractional spacing reduces this effect by matching the grid geometry of adjacent
    patch instances more similar, even if they differ in level of detail. (See Exercises
    12.2 and 12.3)


    Employing LOD can dramatically reduce the load on the system. For example, when
    animated, the scene might be less likely to appear jerky or to lag the case without
    controlling LOD.


    Applying this simple LOD technique to the version that includes Phong shading
    (Program 12.4) is a bit trickier. This is because the changes between adjacent
    patch instances can in turn cause sudden changes to the associated normal vectors,
    causing popping artifacts in the lighting! As always, there are tradeoffs and
    compromises to consider when constructing a complex 3D scene.


    # SUPPLEMENTAL NOTES


    Combining tessellation with LOD is particularly useful in real-time virtual reality
    applications that require both complex detail for realism and frequent object
    movement and/or changes in camera position, such as in computer games. In this
    chapter we have illustrated the use of tessellation and LOD for real-time terrain
    generation, although it can also be applied in other areas such as displacement
    mapping for 3D models (where tessellated vertices are added to the surface of
    a model and moved so to add detail). It is also useful in computer-aided-design
    applications.


    Sellers al. extends the LOD technique (shown in Program 12.5) further than we
