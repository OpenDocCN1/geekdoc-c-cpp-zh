    both light and material, as described in previous sections, can be combined with

    the texture color using a weighted sum. For example:


    ```

    textureColor = texture(sampler, texCoord)

    lightColor = (ambLight * ambMaterial) + (diffLight * diffMaterial) + specLight

    fragColor = 0.5 * textureColor + lightColor

    ```


    This strategy for combining lighting, materials, and textures can be extended

    to involving multiple lights and/or multiple textures. For example:


    ```

    textureColor1 = texture(sampler1, texCoord)

    textureColor2 = texture(sampler2, texCoord)

    \lightColor1 = (ambLight1 * ambMaterial) + (diffLight1 * diffMaterial) + specLight1

    lightColor2 = (ambLight2 * ambMaterial) + (diffLight2 * diffMaterial) + specLight2

    fragColor = 0.25 * textureColor1

    + 0.25 * textureColor2

    + 0.25 * lightColor1

    + 0.25 * lightColor2

    ```


    > Figure 7.17 shows the Studio 522 Dolphin with a UV-mapped texture image

    (produced by Jay Turnerville [TU16]), and the NASA shuttle model we saw earlier

    in Chapter 6. Both textured models are enhanced with Blinn-Phong lighting, with-

    out the inclusion of materials, and with specular highlights that utilize light
    only.

    In both cases, the relevant output color computation in the fragment shader is:


    ```

    vec4 textureColor = texture(sampler, texCoord);

    fragColor = textureColor * (globalAmb + lightAmb + lightDiff * max(dot(L,N),0.0))

    + lightSpec * pow(max(dot(H,N),0.0), shininess:3.0);

    ```


    Note that it is possible for the computation that determines fragColor to produce

    values greater than 1.0. When that happens, OpenGL clamps the computed value

    to 1.0.


