  md: '# Chapter 4 Managing 3D Graphics Data 99


    vertices progress in a clockwise direction (as viewed from the OpenGL camera)
    are back-facing, and not rendered. This counter-clockwise definition of "front-facing"
    is sometimes called the winding order, and can be set explicitly using the function
    glFrontFace(GL_CCW) for counter-clockwise (the default) or glFrontFace(GL_CW)
    for clockwise. Similarly, whether it is the front-facing or back-facing triangles
    are rendered can be set explicitly. Actually, for this purpose we specify which
    ones are not to be rendered—that is, which ones are "culled". We can specify which
    triangles to be culled (though this would be unnecessary if culling is enabled)
    because it is the default culling glCFace(GL_BACK). Alternatively, we can specify
    that the front-facing triangles be culled, or all of the back triangles be culled,
    by replacing GL_BACK with either GL_FRONT OR GL_FRONT_AND_BACK respectively.


    As we see in Chapter 6, models are typically designed so that the outer surface
    is constructed of triangles with the same winding order—most counter-clockwise—so
    that if culling is enabled, then by default the portion of the model''s outer
    surface that the camera is rendered. Since default OpenGL assumes the winding
    order is clockwise, if a model is designed to be displayed with a clockwise winding
    order, it is up to the programmer to call glFrontFace(GL_CW) to account for this
    back-face culling enabled.


    Note that in the case of GL_TRIANGLE_STRIP, the winding order of each triangle
    alternates. OpenGL compensates for this by "flipping" the vertex sequence when
    building each successive triangle, as follows: 0-1-2, 2-1-3, 2-3-4, 4-3-5, 4-5-6,
    and so on.


    Back-face culling improves performance by ensuring that OpenGL doesn''t spend
    time rasterizing and rendering surfaces that are not intended to be seen. Most
    of the examples we have seen in this chapter are so small that there is little
    motivation to enable face culling (an exception is the example shown in Figure
    4.9, with the 100,000 instant animated cubes, which may pose a performance challenge
    on some systems). In practice, it is common for most 3D models to be "closed,"
    and so it is customary to enable back-face culling to Program 4.3 by modifying
