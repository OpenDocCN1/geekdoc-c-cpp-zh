    out vec3 varyingLightDir;\nout vec3 varyingHalfVector;\n// outputs through the\
    \ rasterizer to the fragment shader\nlayout (triangle_strip, max_vertices=3) out;\n\
    ...\n// matrices and lighting uniforms same as before\n\nvoid main (void)\n  //\
    \ move vertices along the normal, and pass through the other vertex attributes\
    \ unchanged\n```\n\n*"
