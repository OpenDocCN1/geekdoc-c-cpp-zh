  md: '# 242 ■ Computer Graphics Programming in OpenGL with C++


    angle, taking into account the light source location, camera location, and the
    normal vector at the pixel. Thus, we can avoid generating detailed vertices corresponding
    to a bumpy or wrinkled surface if we can find a way of generating the corresponding
    normals.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_241_0.png)


    Figure 10.1 illustrates the concept of modified normals corresponding to a single
    "bump."


    Figure 10.1

    Perturbed normal vectors for bump mapping.


    Thus, if we want to make an object look as though it has bumps (or wrinkles, craters,
    etc.), one way is to compute the normals that would produce the desired illusion
    on such a surface. Then when the scene is lit, the lighting would produce the
    desired illusion. This was first proposed by Blinn in 1978 [Blu78], and it became
    practical with the advent of the capability of performing per-pixel lighting computations
    in a fragment shader.


    Figure 10.2

    Procedural bump mapping example.


    vertex and fragment shaders shown in Program 10.1, which produces a "golf-ball"
    surface as shown in Figure 10.2. The code is almost identical to what we saw previously
    in Program 7.2. The only significant change is in the fragment shader—the interpolated
    normal vectors (named `varyingNormal` in the original program) are altered with
    bumps calculated using a sine wave function in the X, Y, and Z axes applied to
    the original (untransformed) vertices of the torus model. Note that the vertex
    shader therefore needs to pass these untformed vertices down the pipeline.


    Altering the normals in this manner, with a mathematical function computed at
    runtime, is called procedural bump mapping.'
