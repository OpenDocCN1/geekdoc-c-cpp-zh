  md: '# 180 Computer Graphics Programming in OpenGL with C++


    ```

    void main(void) {

    // normalize the light, normal, and view vectors:

    vec3 L = normalize(varyingLightDir);

    vec3 N = normalize(varyingNormal);

    vec3 V = normalize(varyingVertPos);


    // compute light reflection vector with respect to N:

    vec3 R = reflect(-L,N);

    // get the angle between the light and surface normal:

    float cosTheta = dot(L,N);

    // angle between the view vector and reflected light:

    float cosPhi = dot(V,R);


    // compute ADS contributions (per pixel), and combine to build output color:

    vec3 ambient = (globalAmbient * material.ambient) + (light.ambient * material.ambient).xyz;

    vec3 diffuse = light.diffuse.xyz * material.diffuse.xyz * max(cosTheta,0.0);

    vec3 specular = material.specular.xyz * pow(max(cosPhi,0.0), material.shininess);


    fragColor = vec4((ambient + diffuse + specular), 1.0);

    }

    ```


    Phong shading offers better realism than Gouraud shading, it doesnso while incurring
    a performance cost. One optimization to Phong shading was proposed by James Blinn
    in 1997 [BL7], and is referred to as the Blinn-Phong reflection model. It is based
    on the observation that one of the most expensive computations in Phong shading
    is determining the vector R.


    Blinn observed that the vector R itself actually is not needed—R is only produced
    as a means of determining the angle q. It turns out that q can be found out computing
    R, by substituting a vector H that is halfway between L and V. As shown in Figure
    7.13, the angle between H and N is conveniently equal to ½q. Although alpha isn''t
    identical to q, Blinn showed that reasonable results can be obtained by using
    H instead of R.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_179_0.png)


    Figure 7.13

    Blinn-Phong reflection.


    The “halfway” vector H = L+V is most easily determined by finding H (see Figure
    7.14), after which cos(alpha) can be found using the dot product H·N.'
