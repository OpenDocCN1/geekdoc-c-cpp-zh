  md: "# Program 10.1 Procedural Bump Mapping\n\nVertex Shader\n\n```\n//version 430\n\
    // same as Phong shading, but add this output vertex attribute:\nout vec3 originalVertex;\n\
    \nvoid main(void) {\n    // include this pass-through of original vertex for interpolation:\n\
    \    originalVertex = vertPos;\n}\n```\n\nFragment Shader\n\n```\n//version 430\n\
    // same as Phong shading, but add this input vertex attribute:\nin vec3 originalVertex;\n\
    \nvoid main(void) {\n    //// add the following to perturb the incoming normal\
    \ vector:\n    float a = 0.25; // controls height of bumps\n    float b = 100.0;\
    \ // controls width of bumps\n    float x = originalVertex.x;\n    float y = originalVertex.y;\n\
    \    float z = originalVertex.z;\n    Nx = varyingNormal.x + a*sin(b*x); // perturb\
    \ incoming normal using sine function\n    Ny = varyingNormal.y + a*sin(b*y);\n\
    \    Nz = varyingNormal.z + a*sin(b*z);\n    N = normalize(N);\n    // lighting\
    \ computations and output fragColor (unchanged) now utilize the perturbed normal\
    \ N\n}\n```\n\n# 10.2 NORMAL MAPPING\n\nAn alternative to bump mapping is to replace\
    \ the normals using a lookup table. This allows us to construct bumps for which\
    \ there is no mathematical function, such as the bumps corresponding to the craters\
    \ on the moon. A common way of doing this is called normal mapping."
