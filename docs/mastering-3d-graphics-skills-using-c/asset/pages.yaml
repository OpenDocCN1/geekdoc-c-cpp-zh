    We achieve this effect by using a matrix transform that converts parallel lines
    into appropriate non-parallel lines. Such a matrix is called a perspective matrix
    or perspective transform, and is built by the four parameters of a view volume.
    Those parameters are (a) aspect ratio, (b) field of view, (c) projection plane
    or near clipping plane, and (d) far clipping plane.


