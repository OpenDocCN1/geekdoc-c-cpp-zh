    **Figure 9.5**

    Skydome with camera placed inside.


    the center of the skydome. (The skydome texture in Figure 9.5 was made using Terragen
    [TE16]).


    Skydomes have some advantages over skyboxes. For example, they are less susceptible
    to distortion and seams (although spherical distortion at the poles must be accounted
    for in the texture image). One disadvantage of a skydome is that a sphere or dome
    is a more complex model than a cube, with more vertices and a potentially varying
    number of vertices depending on the desired precision.


    When using a skydome to represent an outdoor scene, it is usually combined with
    a ground plane or some sort of terrain. When using a skydome to represent a scene
    in space, such as a starfield, it is often more practical to use a sphere such
    as is shown in Figure 9.6 (a dashed line has been added for clarity in visualizing
    the sphere).


    ![](img/5f029c1d57776416a7d2524f3734d7cf_222_1.png)


