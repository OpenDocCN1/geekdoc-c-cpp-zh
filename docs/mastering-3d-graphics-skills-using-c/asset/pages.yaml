    # 14.2 COMPOSITING / BLENDING / TRANSPARENCY


    We have already seen a few examples of blending—in the supplementary notes for
    Chapter 7, and previously in our implementation of fog. However, we haven''t yet
    seen how to utilize the blending (or compositing) capabilities that follow the
    fragment shader during pixel operations (recall the pipeline sequence in Figure
    2.2). It is there that transparency is handled, which we look at now.


    Throughout this book we have made frequent use of the vec4 data type, to represent
    3D points and vectors in a homogeneous coordinate system. You have noticed that
    we also use a vec4 to store color information, where the first three values consist
    of red, green, and blue, and the fourth element—is what?


    The fourth element in a color is called the alpha channel, and specifies the opacity
    of the color. Opacity is a measure of how non-transparent the pixel color is.
    An alpha value of 0 means "opacity," or completely transparent. An alpha value
    of 1 means "fully opaque," not at transparent. In a sense, the "transparency"
    of a color is 1-α, where α is the value of the alpha channel.


    Recall from Chapter 2 that pixel operations utilize the Z-buffer, which achieves
    surface replacement by replacing an existing pixel color when another object''s
    location at that pixel is found to be closer. We actually have more control over
    this process—we may choose to blend the two pixels.


    When a pixel is being rendered, it is called the "source" pixel. The pixel already
    in the frame buffer (presumably from a previous object) is called the "destination"
    pixel. OpenGL provides many options for deciding which of the two pixels, or what
    sort of combination of them, ultimately is placed in the frame buffer. Note that
    the operations step is not a programmable stage—so the OpenGL tools for configuring
    the desired compositing are found in the C++ application notes.


    The OpenGL functions for controlling compositing are glBlendEquation(mode) and
    glBlendFunc(srcFactor, destFactor). Figure 14.3 shows an overview of the compositing
    process.


    The compositing process works as follows:


    +   1. The source and destination pixels are multiplied by source factor and destination
    factor respectively. The source and destination factors are specified in the glBlendFunc()
    function call.


    * With'
