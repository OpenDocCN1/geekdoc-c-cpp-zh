    6.15 (The actual values of the texture coordinates can vary depending on how the
    model is built.)


    We have color-coded the important sections of the OBJ file for reference. The
    lines at the top beginning with "#" are comments placed there by Blender, our
    poorer importers. This is followed by a line beginning with "o" giving the name
    of the object. Our poorer importer can ignore this line as well. Later, there
    is a line beginning with "s" that specifies that the faces shouldn''t be smoothed.
    Our code will also ignore lines starting with "s".


    The first substantive set of lines in the OBJ file are those starting with "v",
    colored blue. They specify the X, Y, and Z spatial coordinates of the five vertices
    of our pyramid model relative to the origin, which in this case is at the center
    of the pyramid.'
