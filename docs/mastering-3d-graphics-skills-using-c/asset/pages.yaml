  md: '![](img/5f029c1d57776416a7d2524f3734d7cf_215_0.png)


    In this chapter we have only given the most basic of introductions to the world
    of shadows in 3D graphics. Even using the basic shadow mapping methods presented
    here will likely require further study if used in more complex scenes.


    For example, when adding shadows to a scene in which some of the objects are textured,
    it is necessary to ensure that the fragment shader properly distinguishes between
    the shadow texture and other textures. A simple way of doing this is to bind them
    to different texture units, such as:


    ```

    layout (binding = 0) uniform sampler2d shTex;

    layout (binding = 1) uniform sampler2d otherTexture;

    ```


    Then, the C++/OpenGL application can refer to the two samplers by their binding
    values.


    When a scene utilizes multiple lights, multiple shadow textures are necessary—one
    for each light source. In addition, a *pass* one will need to be performed for
    each one, with the results blended in pass two.


    Although we have used perspective projection at each phase of shadow mapping,
    it is worth noting that *orthographic* projection is often preferred when the
    light source is distant and directional, rather than the positional light we utilized.


    Generating realistic shadows is a rich and complex area of computer graphics,
    and many of the available techniques are outside the scope of this text. Readers'
