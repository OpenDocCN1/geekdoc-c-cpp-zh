    # SUPPLEMENTAL NOTES


    In this chapter, we used Perlin noise to generate clouds and to simulate both
    wood and a marble-like stone from which we rendered the dragon. People have found
    many other uses for Perlin noise. For example, it can be used to create fire and
    smoke [CC16, AF14], build realistic bump maps [GR05], and has been used to generate
    terrain in the video game Minecraft [PE11].


    The noise maps generated in this chapter are based on procedures outlined by Lord
    Vandevene [VA04]. There remain some deficiencies in our 3D cloud generation. The
    texture is not seamless, so at the 360° point there is a noticeable line. (This
    is also why we started the depth in the Z dimension of the noise map. 14.8 at
    0.1 rather than 0.0—to avoid encountering the seam in the map). Simple methods
    exist for removing the seams [AS04], if needed. Another issue is at the northern
    peak of the skydome where the spherical distortion causes a pincush effect.


    The clouds implemented in this chapter also fail to model some important aspects
    of real clouds, such as the way that they scatter the sun''s light. Real clouds
    also tend to be white on the top and grayer at the bottom. Our clouds also do
    not achieve a 3D “fluffy” look that many actual clouds have.


    Similarly, more comprehensive models exist for generating fog, such as the one
    described by Kilgard and Fernando [KF03].


    While traversing the OpenGL documentation, the reader might notice that GLSL includes
    some noise functions named noise(1), noise(2), noise(3), and noise(4), which are
    described as taking an input seed and producing Gaussian-like stochastic output.
    We didn''t use these functions in this chapter because, as of this writing, most
    vendors have not implemented them. For example, many NVIDIA cards currently return
    0 for these functions, regardless of the input seed.


