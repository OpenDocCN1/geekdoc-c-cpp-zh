    when rendered in the scene; this is because the "back" portion of the cube map
    has been folded over the camera and thus appears flipped sideways, as shown in
    Figure 9.2.


    +   - How do we construct the texture cube map?


    Building a texture cube map image, from artwork or photos, requires care to avoid
    "seams" at the cube face junctions and to create proper perspective so that the
    skybox will appear realistic and undistorted. Many tools exist for assisting in
    this regard: Terragen, Autodesk 3ds Max, Blender, and Adobe Photoshop have tools
    for building or working with cube maps. There are also many websites offering
    a variety of off-shelf cube maps, for a price, for free.


