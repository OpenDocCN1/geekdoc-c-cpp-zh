    random-looking lines. Even if we increased the tessellation values to 64, or just
    4000 vertices would be woefully inadequate to do height-mapping using the moon
    image.


    A good way to increase the number of vertices is by using instancing, which we
    saw in Chapter 4. Our strategy is to have the tessellator generate grids and use
    repeating many times. In the vertex shader we build a patch by four vertices,
    for each corner of a tessellated grid. In our C++/OpenGL application we use `glDrawArrays()`
    call to `glDrawArraysInstanced()`. There, we specify a grid of 64 by 64 patches,
    each of which contains a tessellated mesh with levels of 32. So we use a total
    of $64^2 \times 32$, or over four million vertices.


    The vertex shader starts by specifying four texture coordinates (0,0), (0,1),
    (1,0), and (1,1). When using instancing, recall that the vertex shader has access
    to an integer `gl_InstanceID`, which holds a counter corresponding to `glDrawArraysInstanced()`
