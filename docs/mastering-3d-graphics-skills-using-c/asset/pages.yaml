  md: '# 96 Computer Graphics Programming in OpenGL with C++


    One important way of keeping overhead in the display() function to a minimum is
    by avoiding any steps that require memory allocation. Obvious examples of things
    to avoid would thus include:


    +   - instantiating objects

    - declaring variables


    The reader is encouraged to review the programs that we have developed so far,
    and observe that virtually every variable used in the display() function was declared,
    and its space allocated, before display(). Declarations or instantiations almost
    never appear in display(). For example, Program 4.1 included the following block
    of code early in its listing:


    ```

    // allocate variables used in display() function, so that they won''t need to
    be allocated during rendering

    GLuint mv_Loc, projLoc;

    int width, height;

    float aspect;

    glm::mat4 pMat, vMat, mMat, mvMat;

    ```


    Note that we purposely placed a comment at the top of the block indicating that
    these variables are pre-allocated for later use in the display() function (although
    we are only explicitly pointing that out).


    One case of a variable that wasn''t pre-allocated occurred in our matrix stack.
    By using the C++ stack class, each "push" operation results in a dynamic memory
    allocation. Interestingly in Java, the JOML library provides a MatrixStack class
    intended for OpenGL that allows one to pre-allocate space for a matrix stack!
    We utilize it in our Java-based "sister" book Computer Graphics Programming in
    OpenGL with Java, Second Edition.


    There are other, subtle examples. For example, function calls that convert data
    from one type to another in some cases instantiate and return the newly converted
    data. It is important to understand the behaviors of any library functions called
    from display(). The math library, GLM, was not specifically designed with speed
    in mind. As a result, some of the operations can lead to dynamic allocation. We
    have to try to use GLM functions that operate directly onto (or into) variables
    whose space has already been allocated, when possible. The reader is encouraged
    to explore alternative methods when performance is critical.'
