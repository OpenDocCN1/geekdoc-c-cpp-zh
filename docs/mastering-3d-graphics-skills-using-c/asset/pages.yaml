    of the individual patches within the larger grid. The patches are positioned in
    rows and columns, the first patch at location (0,0), the second at (1,0), the
    next at (2,0), and so on, and the final patch in the first column at (63,0). The
    next has patches at (0,1), (1,1), and so on up to (63,1). The first column has
    patches at (0,2), (1,2), and so on up to (63,2). The X coordinate for a given
    patch is the instance ID modulo 64, and the Y coordinate is the instance ID divided
    by 64 (with integer division). The shader scales the coordinates back down to
    the range [0..1].


