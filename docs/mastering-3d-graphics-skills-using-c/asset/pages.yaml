    \ combined, taking into account the distance ($d$) from the light source:\n\n\
    > $attenuationFactor = \\frac{1}{k_c+k_ld+k_qd^2}$\n\nMultiplying this factor\
    \ by the light intensity causes the intensity to decrease the distance is to the\
