  md: '# Chapter 4 · Managing 3D Graphics Data 63


    A relative structure in OpenGL is called a Vertex Array Object, or VAO. VAOs were
    introduced in version 3.0 of OpenGL and are provided as a way of organizing buffers
    in complex scenes. OpenGL requires that at least one VAO be created, and for our
    purposes one will be sufficient.


    For example, suppose that we wish to display two objects. On the C++ side, we
    could do this by declaring a single VAO and an associated set of two VBOs (per
    object), as follows:


    ```

    Gluint vao[1]; // OpenGL requires these values be specified in arrays

    Gluint vbo[2];

    ...

    glGenVertexArray(1, vao);

    glBindVertexArray(vao[0]);

    glGenBuffers(2, vbo);

    ```


    The OpenGL commands glGenVertexArrays() and glGenBuffers() create VAOs and VBOs
    respectively, and return integer IDs for them. We store these IDs in the integer
    arrays vao and vbo. The parameters on each return format how many IDs are created,
    and an array to hold the returned IDs. The purpose of glBindVertexArray() is to
    make the specified VAO "active" so that the generated buffers will be associated
    with that VAO.


    A buffer needs to have a corresponding vertex attribute variable declared in the
    vertex shader. Vertex attributes are generally the first variables declared in
    a shader. In our cube, a vertex attribute to represent the cube vertices could
    be declared in the vertex shader as:


    ```

    layout (location = 0) in vec3 position;

    ```


    The keyword means "input" and indicates that this vertex attribute will be receiving
    values from a buffer (as we will see later, vertex attributes can also be used
    for "output"). As seen before, the "vec3" means that each invocation of the shader
    will have three float values (presumably x, y, z; comprising a single vertex).
    The variable name is "position". The "layout (location = 0)" portion of the command
    is called a "layout qualifier" and is how we associate the vertex attribute with
    a particular buffer. Thus this vertex attribute has an identifier 0 that we will
    use later for this purpose.


    1 Throughout this example, two buffers are declared, to emphasize that usually
    we will use several buffers. Later we will use the additional buffer(s) to store
    other information associated with the vertex, such as color. In the current case
    we are using only one of the declared buffers, so it would have been sufficient
    to declare just one VBO.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_62_0.png)'
