  md: '# # APPENDIX C

    USING THE NSIGHT GRAPHICS DEBUGGER


    +   C.1 NVIDIA Nsight ................................................................
    368

    C.2 Setting Up Nsight ................................................................
    368

    C.3 Running a C++/OpenGL Application in Nsight................................
    369


    Debugging GLSL shader code is notoriously difficult. Unlike programming in typical
    languages such as C++ or Java, it is often unclear exactly where a shader program
    failed. Often, a shader error manifests as a blank screen, offering no clues as
    to the nature of the error. Even more frustrating is that there is no way to print
    out the values of shader variables during runtime, as one would commonly do when
    tracking an elusive bug.


    We listed some techniques for detecting OpenGL and GLSL errors in Section 2.2.
    Despite the help that these techniques provide, the lack of a simple ability to
    display shader variables is a serious handicap.


    For this reason, graphics card manufacturers have sometimes provided capabilities
    in hardware for extracting information from shaders at runtime, and then built
    tools for accessing the information in the form of a graphics debugger. Each manufacturer''s
    debugging tool works only in the presence of that manufacturer''s graphics card.
    NVIDIA''s graphics debugger is part of a larger suite of tools called Nsight,
    and AMD has a similar suite of tools called CodeXL. This appendix describes how
    to get started using Nsight.'
  merge: -1
  pgno: 366
- img_proc: true
  md: "368 Computer Graphics Programming in OpenGL with C++\n\n# C.1 ABOUT NVIDIA\
    \ NSIGHT\n\nNsight is an NVIDIA suite tool that includes a graphics debugger,\
    \ which makes it possible to look inside the stages of the OpenGL graphics pipeline,\
    \ including shaders, while a program is running. It Isn't necessary to change\
    \ the code at all, or to add any code. Simply run an existing program with Nsight\
    \ enabled. Nsight allows examining shaders at runtime, which can see the current\
    \ contents of a shader's uniform variables.\n\nThere are versions of Nsight for\
    \ Windows and for Linux/MacOS, including versions that run under Microsoft's Visual\
    \ Studio (VS) and under the Eclipse version. We restrict our to the Windows Visual\
    \ Studio-based version. In our \"sister\" book Computer Graphics Programming in\
    \ OpenGL with Java we describe how to make this VS version of Nsight work with\
    \ Java-based programs.\n\nNsight works only with compatible NVIDIA graphics cards;\
    \ it won't work with Intel or AMD graphics cards. A complete list of supported\
    \ cards is available on the NVIDIA website [Ns18].\n\n# C.2 SETTING UP NSIGHT\n\
    \nSetting up Nsight is surprisingly easy. Our instructions are based on version\
    \ 5.3 of Nsight.\n\n+   1. If you haven't already done so, install Visual Studio\
    \ (VS), such as Visual Studio 2017 Community. Be sure to include the C++ core\
    \ compiler. Note that Visual Studio installation can be extremely slow. Visual\
    \ Studio 2017 is available at https://www.visualstudio.com/downloads.\n   Detailed\
    \ steps for installing Visual Studio are given in Appendix A.\n2. Install NVIDIA\
    \ Nsight, Visual Studio Edition. This should be quick-er than it was to install\
    \ Visual Studio in step 1. While installing, the CUDA elements aren't necessary\
    \ (unless you want them for other reasons). Nsight is available at https://developer.nvidia.com/nsight-visual-studio-edition.\n\
    3. Run Visual Studio, and make sure that the Nsight menu appears at the top of\
    \ the menu bar.\n4. Load the program that you wish to run, if you haven't done\
    \ so already.\n   Steps for configuring a C++ / OpenGL project are given in Appendix\
    \ A."
