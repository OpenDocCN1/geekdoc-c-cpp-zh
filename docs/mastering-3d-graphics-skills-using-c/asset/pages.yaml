    For quadratic Bézier surfaces


    The nine control points in the mesh are labeled $P_{ij}$ where $i$ and $j$ represent
    the indices in the $u$ and $v$ directions respectively. Each of three adjacent
    control points, such as $(P_{00}, P_{01}, P_{02})$, defines a Bézier curve. $P(u,v)$
    on the surface are then defined as a sum of two blending functions, one in the
    $u$ direction and one in the $v$ direction. The form of this then follows from
    the methodology used previously for Bézier curves:


    ```

    $B_0(u) = (1-u)^2$

    $B_1(u) = -2u + u^2$

    $B_2(u) = u^2$

    $B_0(v) = (1-v)^2$

    $B_1(v) = -2v^2 + 2v$

    $B_2(v) = v^2$

    ```


    $P(u,v)$ comprising the Bézier surface are then generated by summing the product
    of each control point $P_{ij}$ and the $i^{th}$ and $j^{th}$ blending functions
    evaluated at parametric values $u$ and $v$:


    ```

    $P(u,v) = \sum_{i=0}^2 \sum_{j=0}^2 P_{ij} * B_i(u) * B_j(v)$

    ```


