  md: '# Computer Graphics Programming in OpenGL with C++


    The manner in which we load the vertices of a model into a buffer (VBO) depends
    on how the model''s vertex values are stored. In Chapter 6 we will see how models
    are commonly built in a modeling tool (such as Blender [BL8] or Maya [MA16]),
    exported to a data file format (such as obj—also described in Chapter 6), and
    imported into the C++OpenGL application. We will also see how a model''s vertices
    are calculated on the fly or generated inside the pipeline using a tessellation
    shader.


    For now, let we wish to draw a cube, and let''s presume that the vertices of our
    cube are hardcoded in an array in the C++OpenGL application. In this case, we
    need to copy those values into one of our buffers that we previously generated.
    To do that, we need to (a) make that buffer (say, the 0th buffer) "active" with
    the OpenGL glBind command, and (b) we use the glBufferData() command to copy the
    array containing the active buffer (the 0th VBO in this case). Assuming that the
    vertices are stored in a float array named vPositions, the C++ code would copy
    those values into the 0th VBO:


    ```

    glBindBuffer(GL_ARRAY_BUFFER, vbo0);

    glBufferData(GL_ARRAY_BUFFER, sizeof(vPositions), vPositions, GL_STATIC_DRAW);

    ```


    Next, we add code to display() that will cause the values in the buffer to be
    the vertex attribute in the shader. We do this with the following three steps:
    (a) make that buffer "active" with the glBindBuffer() command as we did above,
    (b) associate the active buffer with a vertex attribute in the shader, and (c)
    enable the vertex attribute. The following lines of code accomplish these steps:


    ```

    glBindBuffer(GL_ARRAY_BUFFER, vbo0); // make the 0th buffer "active"

    AttribPointer(0, 3, GL_FLOAT, FALSE, 0, 0); // associate 0th attribute with buffer

    EnableVertexArray(0); // enable the 0th vertex attribute

    ```


    Now when we execute glArrays(), data in the 0th VBO will be transmitted to the
    vertex attribute that has a layout qualifier with location 0. This sends the vertices
    to the shader.


    Note that, for the first time, we are refrained from describing every parameter
    in one or more OpenGL calls. As mentioned in Chapter 2, the reader is encouraged
    to utilize the OpenGL documentation for such details as needed.'
