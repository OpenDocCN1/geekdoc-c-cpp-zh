    # MENTAL NOTES


    Researchers have developed a number of uses for texture units beyond just textured
    models in a scene. In later chapters, we will see how texture units can be used
    for altering the light reflects off an object, making it appear bumpy. We can
    also use a texture unit to store "height maps" for generating terrain, and for
    storing "shadow maps" to efficiently add shadows to our scenes. These uses will
    be described in subsequent chapters.


    Shaders can also write to textures, allowing shaders to modify texture images,
    or even copy part of one texture into some portion of another texture.


    Mipmaps and anisotropic scene anti-aliasing are not the only tools for reducing
    aliasing artifacts in textures. Full-scene anti-aliasing (FSAA) and other supersampling
    methods, for example, can also improve the appearance of textures in a 3D scene.
    Although not part of the OpenGL core, they are supported on many graphics cards
    through OpenGL''s extension mechanism [QE16].


    There is an alternative mechanism for configuring and managing textures and samplers.
    Version 3.3 of OpenGL introduced sampler objects (sometimes called "sampler states"—not
    to be confused with sampler variables) that can be used to hold a set of settings
    independent of the actual texture object. Sampler objects are attached to texture
    units and allow for conveniently and efficiently changing texture settings. The
    examples shown in this textbook are sufficiently simple that we decided to omit
    coverage of sampler objects. For interested readers, usage of sampler objects
    is easy to learn, and there are many excellent online tutorials (such as [GE17]).


