    texels at various distances from the pixel''s texel.


    Figure 8.21

    Soft shadow rendering - 64 samples per pixel.


    The accuracy or smoothness of our soft shadows depends on the number of nearby
    texels. Thus, there is a tradeoff between performance and quality—the more points
    sampled, the better the results, the more computational overhead incurred. Depending
    on the complexity of the scene and the framerate required for a given application,
    there is often a practical limit to the quality that can be achieved. Sampling
    64 points per pixel, such as in Figure 8.21, is usually impractical.


    A commonly used algorithm for implementing PCF is to sample four nearby texels
    per pixel, with the samples at offset distances from the texel which corresponds
    to the pixel. As we process each pixel, we alter the offsets used to determine
    which four texels are sampled. Altering the offsets in a staggered manner is sometimes
    less "dithering," and aims to make the soft shadow boundary appear less "blocky"
    than it ordinarily give the small number of sample points.


    A common approach is to assume one of four different offset patterns—we choose
    pattern to use for a given pixel by computing the pixel''s gFragCoord mod 2. Recall
    that gFragCoord is of type vec2, containing the x and y coordinates of the pixel
    location; the result of the mod computation is one of four values: (0,0), (0,1),
    (1,0), or (1,1). We use this to select one of four different offset patterns in
    texel space (i.e., in the shadow map).


    The offset patterns are typically specified in the x and y directions with different
    combinations of -1.5, -0.5, +0.5, and +1.5 (these can also be scaled as desired).'
