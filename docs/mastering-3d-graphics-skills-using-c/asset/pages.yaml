  md: '# Appendix B Installation and Setup for Macintosh 363


    # B.2 MODIFYING THE C++/OPENGL/GLSL APPLICATION CODE FOR THE MAC


    For the most part, the C++ programs themselves, as described in this textbook,
    will run as-is. There are, however, a small number of changes that must be made.
    Most of the changes are to the "main() function inside "main.cpp"; you can build
    it and once that modified version of main() into each of the other projects. The
    remaining changes are small, and can be done as needed.


    Some of these changes won''t make sense until one has studied the corresponding
    programming sections in the text. The reader may choose to skip parts of this
    section and return to it later as/she learns the material in question. While acknowledging
    the risk of introducing confusion, we have decided to pick all of the code changes
    for the Macintosh here, so that they are assembled in one place.


    # B.2.1 Modifying the C++ Code


    Let''s start with the changes that must be made to the "main.cpp" file:


    +   - Xcode generates a huge number of "documentation" warning messages. These
    can make it inconvenient to find more substantive error messages. There are several
    ways to stop these messages; one of the simplest is to add the two lines to the
    top of "main.cpp":n```cpp

    #pragma clang diagnostic

    #pragma clang diagnostic ignored "Wdocumentation"

    ```

    - Homebrew installs GLEW as a static library on the Mac, so you''ll need to add:

    ```cpp

    #define GLE_STATIC

    ```

    at the top of your program, immediately above the #include <GL/glew.h> command.

    - In the glfwWindowHint commands, set the "major" context version to 4, and the
    "minor" to 1.

    - You will need to add two additional glfwWindowHint commands immediately after
    the two that are already there. They are:

    ```cpp

    glfwWindowHint(GLFW_OPENGL_PROFILE, GLFW_OPENGL_CORE_PROFILE);

    glfwWindowHint(GLFW_OPENGL, FORWARD_COMPAT, GLW_TRUE);

    ```

    These lines are necessary because many Macs default to earlier versions of OpenGL.
    They force the Mac to use the latest version of OpenGL available on the hardware.'
  merge: -1
