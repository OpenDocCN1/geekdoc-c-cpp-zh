  md: '# 346 Computer Graphics Programming in OpenGL with C++


    To facilitate the dissolve effect, we introduce the GLSL discard command. This
    command is only legal in the fragment shader, and when executed, it causes the
    fragment shader to discard the current fragment (meaning not render).


    Our strategy is a simple one. In the C++/OpenGL application, we create a fine-grained
    noise texture map identical to the one shown in Figure 14.12, and also a float
    variable counter that gradually increases over time. This variable is then sent
    down to the shader pipeline in a uniform variable, and the noise map is also placed
    in the texture map with an associated sampler. The fragment shader accesses the
    noise texture using the sampler—in this case we use the returned noise value to
    determine whether or not to discard the fragment. We do this by comparing the
    grayscale noise value against the counter, which serves as a sort of "threshold"
    value. Because the threshold is gradually changing over time, we can set it so
    that gradually more and more fragments are discarded. The result is that the object
    appears to gradually dissolve. Program 14.9 shows the relevant code sections,
    which are added to the earth-rendered sphere from Program 6.1. The generated output
    is shown in Figure 14.24.


    # 14.9 Dissolve Effect Using discard Command


    C++ / OpenGL application:


    ```

