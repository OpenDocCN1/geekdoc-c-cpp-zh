    An important property of our transformation matrices is that they are all of size
    4x4. This is made possible by our decision to use the homogeneous notation. Otherwise,
    the transforms would be of diverse and incompatible dimensions. As we have seen,
    ensuring they are the same size is not just for convenience, and it also makes
