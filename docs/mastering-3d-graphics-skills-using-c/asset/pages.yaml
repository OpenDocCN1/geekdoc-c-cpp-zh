    \nThe realism in an outdoor 3D scene can often be improved by generating a realistic\
    \ effect at the horizon. As we look beyond our nearby buildings and trees, we\
    \ are accustomed to seeing large distant objects such as clouds, mountains, or\
    \ the sun (or at night, the moon and stars). However, adding such objects to our\
    \ scene as individual models may come at an unacceptable performance cost. A skybox\
    \ or sky-dome provides a relatively simple way of efficiently generating a convincing\
    \ horizon.\n\n# ## 9.1 SKYBOXES\n\nThe concept of a skybox is a remarkably clever\
    \ and simple one:\n\n+   1. Instantiate a cube object.\n2. Texture the cube with\
    \ the desired environment.\n3. Position the cube so it surrounds the camera.\n\
    \nWe already know how to do all of these steps. There are a few additional details,\
