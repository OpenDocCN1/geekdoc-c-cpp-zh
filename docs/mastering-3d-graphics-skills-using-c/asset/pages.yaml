  md: '# 6.2.2 Indexing in OpenGL


    In both sphere and torus models, we generate an array of integer indices referencing
    the vertex array. In the case of the sphere, we use the list of indices to build
    a complete set of individual vertices and load them into a VBO as we did for examples
    in earlier chapters. Instantiating the torus and its vertices, normals, and so
    into buffers could be done in a similar manner as was in Program 6.1, but instead
    we use OpenGL''s indexing.


    When using OpenGL indexing, we also load the indices themselves into a VBO. We
    generate one additional VBO for holding the indices. Since each index value is
    simply an index reference, we first copy the index array into a C++ vector of
    integers, and use glBufferData() to load the vertex into the added VBO, specifying
    that the VBO is of type GL_ELEMENT_ARRAY_BUFFER (this tells OpenGL that the VBO
    contains indices). The code that this can be added to setup():


    ```

    std::vector<int> ind = myTorus.getIndices(); // torus index accessor returns indices
    an int vector

    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]); // vbo #3 is the additional added
    vbo

    glBufferData(GL_ELEMENT_ARRAY_BUFFER, ind.size()*4, &ind[0], GL_STATIC_DRAW);

    ```


    In the display() we replace the glDrawArrays() with a call to glDrawElements(),
    which tells OpenGL to utilize the VBO for looking up the vertices to be drawn.
    We also add the VBO that contains the indices by using glBindBuffer(), specifying
    which VBO contains the indices and that it is a GL_ELEMENT_ARRAY_BUFFER. The code
    is as follows:


    ```

    numTorusIndices = myTorus.getTorusIndices();

    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]);

    glDrawElements(GL_TRIANGLES, numTorusIndices, GL_UNSIGNED_INT, 0);

    ```


    Interestingly, the shaders used for drawing the sphere continue to work, unchanged,
    for the torus, even with the changes that we made in the C++/OpenGL to implement
    indexing. OpenGL is able to recognize the presence of a GL_ELEMENT_ARRAY_BUFFER
    and utilize it to access the vertex attributes.


