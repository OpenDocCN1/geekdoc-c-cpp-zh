    complicated by the fact that normal (N̂) vectors are typically available to us
    only for the vertices that define the models, not for each pixel. Thus, we need
    to either compute normals for each pixel, which could be time-consuming, or find
    some way of estimating the values that we need to achieve a sufficient effect.


    One approach is called "faded shading" or "flat shading". Here we assume that
    every pixel in each rendered primitive (i.e., polygon or triangle) has the same
    lighting value. Thus, we need only the lighting computations for one vertex in
    each polygon in the model, and then copy lighting values across the nearby rendered
    pixels on a per-polygon or per-triangle basis.


    Faceted shading is rarely used today, because the resulting images tend to look
    very realistic, and because hardware makes more accurate computations feasible.
    An example of a faceted-shaded torus, in which each triangle behaves as a flat
    reflective surface, is shown in Figure 7.7.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_169_0.png)


    Figure 7.7

    Torus with faceted shading.


    Although faceted shading can be adequate in some circumstances (or used as a deliberate
    effect), a better approach is "smooth shading," in which the lighting intensity
    is computed for each pixel. Smooth shading is feasible because of the parallel
    processing done on modern hardware graphics cards, and because of the interpolated
    rendering that takes place in the OpenGL graphics pipeline.


    We will examine two popular methods for smooth shading: Gouraud shading and Phong
    shading.


