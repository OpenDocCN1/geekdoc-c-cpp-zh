  md: "Chapter 13 · Geometry Shaders ■ 299\n\n# 13.2 ALTERING PRIMITIVES\n\nGeometry\
    \ shaders are convenient for changing the shape of an object when that change\
    \ can be affected through isolated changes to the primitives (typically triangles).\n\
    \nConsider, for example, the torus rendered previously in Figure 7.12. Suppose\
