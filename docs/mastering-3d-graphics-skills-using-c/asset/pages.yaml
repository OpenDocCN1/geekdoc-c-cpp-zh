  md: '# Chapter 5 · Texture Mapping 121


    For example, options for specifying what happens when texture coordinates fall
    outside the range [0..1]. The desired behavior is set using glTexParameteri(),
    and the options are as follows:


    +   - GL_REPEAT: The integer portion of the texture coordinates are ignored, generating
    a repeating or "tiling" pattern. This is the default behavior.

    - GL_MIRRORED_REPEAT: The integer portion is ignored, except that the coordinates
    are reversed when the integer portion is odd, so that the repeating pattern alternates
    between normal and mirrored.

    - GL_CLAMP_TO_EDGE: Coordinates less than 0 and greater than 1 are set to 0 and
    1 respectively.


    For example, consider a pyramid where the texture coordinates have been defined
    in the range [0..5] rather than the range [0..1]. The default behavior (GL_REPEAT),
    using the texture image shown previously in Figure 5.2, would result in the texture
    repeating five times over the surface (sometimes called "tiling"), as shown in
    Figure 5.14:


    ![](img/5f029c1d57776416a7d2524f3734d7cf_120_0.png)


    To make the "tiles" appearance alternate between normal and mirrored, we can specify
    the following:


    ```

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_MIRRORED_REPEAT);

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_MIRRORED_REPEAT);

    ```


    Specifying that values less than 0 and greater than 1 are set to 0 and 1 respectively
    can be done by replacing GL_MIRRORED_REPEAT with GL_CLAMP_TO_EDGE.'
