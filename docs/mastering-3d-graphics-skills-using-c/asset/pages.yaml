  md: 'The vertex shader contains our first example of using struct notation. A GLSL
    “struct” is like a datatype; it has a name and set of fields. When a variable
    is declared using the name of a struct, it then contains fields, which are accessed
    using “->” notation. For example, variable “light” is declared of type “Positional_light”,
    so we can thereafter refer to the fields light.ambient, light.diffuse, and so
    forth.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_176_0.png)


    The vertex shader is where most of the computations are performed. For each vertex,
    the appropriate matrix transforms are applied to the vertex position and normal
    vector, and vectors for light direction ($L$) and reflection ($R$) are computed,
    resulting in a color for each vertex (called varyingColor in the code). The fragment
    shader is then a simple pass-through. The lengthy list of uniform variable declarations
    is also present in the fragment shader (for reasons described earlier in Chapter
    4), but none of them are actually used there.


    > Note the use of the GLSL functions normalize(), which converts a vector to unit
    length and is necessary for proper application of the dot product, and reflect(),
    which computes the reflection of one vertex over another.


    Artifacts are evident to other artists. If the specular highlight has a blocky,
    faceted appearance. This artifact is more pronounced if the object is in motion
    (we can’t illustrate that here).


    Gouraud shading is susceptible to other artifacts. If the specular highlight is
    entirely contained within one of the model''s triangles—that is, if it doesn''t
    contain at least one of the model vertices—then it may disappear entirely. The
    specular component is calculated per-vertex, so if a model vertex with a specular
    contribution does not exist, none of the rasterized pixels will include specular
    light either.'
