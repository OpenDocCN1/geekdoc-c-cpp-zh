    A powerful feature of tessellation is that the TCS (and also the TES) shader has
    access to all of the control point vertices simultaneously, in arrays. At first,
    it may seem confusing that the TCS executes once per vertex, when invocation has
    access to all of the vertices. It is also counterintuitive that the tessellation
    layers are specified in assignment statements which are redundant at each TCS
    invocation. Although all of this might seem odd, it is done this way because the
    tessellation architecture is designed so that TCS invocations can run in parallel.


    OpenGL provides several built-in variables for use in the TCS and TES shaders.
    Those that we have already mentioned gl_InvocationID and gl_TessLevelInner and
    gl_TessLevelOuter. Here are some more details and descriptions of some of the
    most useful built-in variables:


    Tessellation Control Shader (TCS) built-in variables:


    +   - gl_in[] — an array containing the incoming control point vertices—one array
    element per incoming vertex. Particular vertex attributes can be accessed as fields
    using the “,” notation. One built-in attribute is gl_Position—thus, the position
    of incoming vertex “i” is accessed as gl_in[i].gl_Position.'
