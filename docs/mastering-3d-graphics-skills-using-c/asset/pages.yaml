  md: '# Chapter 10 · Enhancing Surface Detail ■245


    ![](img/5f029c1d57776416a7d2524f3734d7cf_244_0.png)


    **Figure 10.4**

    Normal mapping examples.


    Figure 10.4 shows two different normal map image files (both are built out of
    textures from Normal Luna [LU16]) and the result of applying them to a sphere
    in the presence of Blinn-Phong lighting.


    Normal vectors retrieved from a normal map cannot be utilized directly, because
    they are defined relative to an arbitrary X-Y plane as described previously, without
    taking into account their position on the object and their orientation in camera
    space. Our strategy for addressing this is to build a transformation matrix for
    converting the normals into camera space, as follows.


    At each vertex on an object, we consider a plane that is tangent to the object.
    The object normal at that vertex is perpendicular to this plane. We define two
    mutually perpendicular vectors in that plane, also perpendicular to the normal,
    called the tangent and bitangent (sometimes called the binormal). Constructing
    our desired transformation matrix requires that our models include a tangent vector
    for each vertex (the bitangent can be built by computing the cross product of
    the tangent and the normal). If the model does not already have tangent vectors
    defined, they can be computed. In the case of a sphere they can be computed exactly,
    as shown in the following modifications to Program 6.1:


    ```

    for (int i=0; i<prec; i++) {

    for (int j=0; j<prec; j++) {

    float y = (float)cos(toRadians(180.0f / prec))*-180.0f / prec);

    float x = (float)cos(toRadians(360.0f / prec)) * (float)abs(cos(asin(y)));

    float z = (float)sin(toRadians(360.0f / prec)) * (float)abs(cos(asin(y)));

    vertices[i*(prec+1)+j] = glm::vec3(x, y, z);

    ```'
