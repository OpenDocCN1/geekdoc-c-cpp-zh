- img_proc: true
  md: 'high precision), this approach can work well. However, when the underlying
    number of vertices is small (such as the corners of a cube), rendering the object''s
    surface relies on vertex interpolation in the rasterizer to fill in the detail.
    When there are very few vertices available in the vertex shader to perturb, the
    heights of many pixels would be interpreted rather than retrieved from the height
    map, leading to poor surface detail. Vertex manipulation in the fragment shader
    is, of course, impossible because by then the vertices have been rasterized into
    pixel locations.


