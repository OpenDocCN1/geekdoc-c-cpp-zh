  md: "364 Computer Graphics Programming in OpenGL with C++\n\n+   * Some Macs, such\
    \ as those with a Retina display, are slightly trickier when it comes to setting\
    \ up the GLFW rendering window resolution. After creating the window with `glfwCreateWindow()`,\
    \ you will need to retrieve the actual screen dimensions from the frame buffer,\
    \ as follows: \n\n```\n```\nactualScreenWidth, actualScreenHeight;\nglGetFramebufferbuffer(window,\
    \ &actualScreenWidth, &actualScreenHeight);\n```\n```\n\n+   * Then, after the\
    \ `glfwMakeCurrent(window)` command, add the following line: \n\n```\n```\nViewport(0,0,actualScreenWidth,actualScreenHeight);\n\
    ```\n```\n\nThis will ensure that what is drawn to the framebuffer matches appears\
    \ in the GLFW window.\n\n+   * Finally, immediately after initializing GLEW with\
    \ `glewInit()`, add the following line: \n\n```\nglewExperimental = GL_TRUE;\n\
    ```\n\n# Modifying the GLSL Code\n\nSome changes will need to be made at various\
    \ locations in our GLSL shader code (and some of the associated C++/OpenGL code)\
    \ because of the slightly earlier version of OpenGL (specifically, 4.1) present\
    \ in Macs:\n\n+   * The version number 4 in the shaders must be changed. Presuming\
    \ that your Mac supports version 4.1, at the top of each shader locate the line\
    \ that says:\n\nthis must be changed to:\n\n```\n#version 430\n```\n\n```\n#version\
    \ 410\n```\n\n+   * Version 4.1 doesn't support layout binding qualifiers for\
    \ texture sampler variables. This affects material starting from Chapter 5. You'll\
    \ need to remove the layout binding qualifiers, and replace them with another\
    \ command that accomplishes the same thing. Specifically, look for lines in the\
    \ shaders that have the following format:\n\n```\nlayout(binding=0) uniform sampler2d;\n\
    ```\n\nThe texture unit specified in the binding clause might be different (it\
    \ is \"0\" here), and the name of the sampler variable might be different (it\
    \ is \"samp\" here). In any case, you'll need to remove the layout clause, and\
    \ simplify the command so that it just says:\n\n```\nuniform sampler2d d;\n```"
