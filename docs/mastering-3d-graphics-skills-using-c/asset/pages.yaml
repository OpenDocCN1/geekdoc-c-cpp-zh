    # 4.8 MATRIX STACKS


    So far, the models we have rendered each been constructed of a single set of vertices.
    It is often desired, however, to build complex models by assembling smaller, simple
    models. For example, a model of a “robot” could be created by separately drawing
    the head, body, legs, and arms, where each of those is a separate model. An object
    built in this manner is often called a hierarchical model. The tricky part of
    building hierarchical models is keeping track of all the model-view matrices and
    making sure they stay perfectly coordinated—otherwise the robot might fly apart
    into pieces!


    ![](img/5f029c1d57776416a7d2524f3734d7cf_84_0.png)


