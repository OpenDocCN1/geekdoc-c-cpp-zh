    # 6.3 LOADING EXTERNALLY PRODUCED MODELS


    3D models, such as characters found in videogames or computer-generated movies,
    are typically produced using modeling tools. Such "DCC" (digital content creation)
    tools make it possible for people (such as artists) to build arbitrary shapes
    in 3D space and automatically produce the vertices, texture coordinates, vertex
    normals, and so on. There are too many tools to list, but some examples are Maya,
    Blender, Lightwave, Cinema4D, and many others. Blender is free and open source.
    Figure 6.13 shows an example Blender screen during the editing of a 3D model.'
