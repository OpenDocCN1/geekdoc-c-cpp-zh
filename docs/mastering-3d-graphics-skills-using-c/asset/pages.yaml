    float pwerMatShininess = 9.85;

    ```


    ADS RGBA values for a few other materials are given in Figure 7.3 (from BA6]).


    Some other properties are included in the material properties. Transparency is
    handled in the RGBA specifications in the fourth (or "alpha") channel, which handles
    of opacity; a value of 1.0 represents completely opaque and 0.0 represents completely
    transparent. For most materials it is simply set to 1.0, for certain materials
    a slight transparency plays a role. For example, in Figure 7.3, note that the
    materials "jade" and "pearl" include a small amount of transparency (values slightly
    less than 1.0) to add realism.


    Emissiveness is also sometimes included in an ADS material specification. This
    is useful when simulating a material that emits its own light, such as phosphorescent
    materials.'
