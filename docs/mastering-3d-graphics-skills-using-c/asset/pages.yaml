  md: 'To understand how this works, start by noting that a vector can be stored to
    reasonable precision in three bytes, one for each of the X, Y, and Z components.
    This makes it possible to store normals in a color image file, with the R, G,
    and B components corresponding to X, Y, and Z. RGB values in an image are stored
    in bytes and are usually interpreted as values in the range [0,1], whereas vectors
    can have positive or negative component values. If we restrict normal vector components
    to the range [-1,+1], a simple conversion to enabling storing a normal vector
    N as a pixel in an image file is:


    ```

    R=(N_x + 1)/2

    G=(N_y + 1)/2

    B=(N_z + 1)/2

    ```


    Normal mapping utilizes an image file (called a normal map) that contains normals
    corresponding to a desired surface appearance in the presence of lighting. In
    a normal map, the vectors are represented relative to an arbitrary X-Y plane,
    with their X and Y components representing deviations from "vertical" and their
    Z component set to 1. A vector strictly perpendicular to the X-Y plane (i., with
    no deviation) would be represented as (0,0,1), whereas non-perpendicular vectors
    would have non-zero X and/ Y components. We use the above formulae to convert
    to RGB space; for example, (0,0,1) would be represented (.5,.5,1), since actual
    offsets range [-1,+1], but RGB values range [0,1].


    We can make use of a normal map through yet another application of texture units:
    instead of storing colors in the texture unit, we store the desired normal vectors.
    We can then use a sampler to look up the value in the normal map for a given fragment,
    and then apply the returned value to texture mapping (as we did in texture mapping),
    we use it as the normal vector.


    One example of such a normal map image file is shown in Figure 10.3. It was generated
    by applying the GIMP normal mapping plugin [G16] to a texture from Luna [LU16].
    Normal image files are not intended for viewing; we show this one to point out
    that images end up being largely blue. This is because every empty in the image
    file has a B value of 1 (maximum blue), making the image appear "bluish" if viewed.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_243_0.png)'
