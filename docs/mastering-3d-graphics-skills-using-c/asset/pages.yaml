  md: '# Chapter 1 - Getting Started


    Its specification and development was managed and controlled by the OpenGL Architecture
    Review Board (ARB), then a newly formed group of industry participants. In 2006
    the ARB transferred control of the OpenGL specification to the Khronos Group,
    a nonprofit consortium which manages not only the OpenGL specification but a wide
    variety of other open industry standards. referred as "immediate mode".


    Since its beginning OpenGL has been revised and extended regularly. In 2004, version
    2.0 introduced the OpenGL Shading Language (GLSL), allowing "shader programs"
    to be installed and run directly in graphics pipeline stages.


    In 2009, 3.1 removed a large number of features that have been deprecated, to
    enforce the use of shader shading as opposed to earlier approaches (referred to
    as core profile). The more recent features, version 4.0 (in 2010) added a tessellation
    stage to the programmable pipeline.


    OpenGL assumes that the user is using a machine with a graphics card that supports
    at least version 4.3 of OpenGL. If you are not sure which version of OpenGL, your
    GPU supports, there are free applications available on the web that can be used
    to find out. One such application is GLView, by a company named realtechvr* [GV16].


    # ## 1.1.3 Window Management


    OpenGL doesn''t draw to a computer screen. Rather, it renders a frame buffer,
    and it is the job of the individual machine to draw the contents of the frame
    buffer onto a window on the screen. There are various libraries that support doing
    this. One option is to use the windowing capabilities provided by the operating
    system, such as the Microsoft Windows API. This is generally impractical and requires
    a lot of low-level coding. GLUT is a historically popular option; however, it
    is deprecated. A modernized extension is freeglut. Other related options are CPW,
    GLOW, and GLUI.


    One of the most popular options, and the one used in this book, is GLFW, which
    has built-in support for Windows, MacOS, Linux, and other systems [GF17]. It can
    be downloaded from www.glfw.org, and it must be compiled on the machine where
    it is to be used (we describe those steps in the Appendices).


    1 Despite this, many graphics card manufacturers (notably NVIDIA) continue to
    support deprecated functionality.'
