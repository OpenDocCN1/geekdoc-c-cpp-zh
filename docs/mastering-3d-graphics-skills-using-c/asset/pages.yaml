  md: 'The second method is to build a “custom framebuffer” back in pass (rather than
    use the default Z-buffer) and attach the shadow texture to it using the command
    glFrameBufferTexture). This command was introduced into OpenGL 3.0 to further
    support shadow mapping. When using this approach, it isn''t necessary to “copy”
    the Z-buffer into a texture, because the buffer already has a texture attached
    to it, and so the depth information is put into the texture by OpenGL automatically.
    This is the method we use in our implementation.


    # 8.4.3 Shadow Mapping (PASS TWO) – Rendering the Scene with Shadows


    Much of pass will resemble what we saw in Chapter 7. Namely, it is here that we
    render our complete scene and all of the items in it, along with the lighting,
    materials, and any textures coloring the objects in the scene. We also need to
    add the necessary code to determine, for each pixel, whether or not it is in shadow.


    An important feature of pass two is that it utilizes MVP matrices. One is the
    standard MVP matrix that transforms object coordinates into screen coordinates
    (as seen in most of our previous examples). The other is the shadowMVP matrix
    that was generated in pass one for use in rendering from the light’s position
    of view—will be used in pass two for looking up depth information from the shadow
    texture.


    A complication arises in pass two when we try to look up pixels in a texture map.
    The OpenGL camera utilizes a [-1,1] space, whereas texture maps utilize a [0,1]
    space. A common solution is to build an additional matrix transform, typically
    called $B$, that converts (or “biases”, hence the name) from camera space to texture
    space. Deriving $B$ is fairly simple—a scale by one-half followed by a one-half.


    The $B$ matrix translates as follows:


    ```

    $B = \begin{bmatrix} 0.5 & 0 & 0.5 \ 0 & 0.5 & 0.5 \ 0 & 0 & 1 \end{bmatrix}$

    ```


    $B$ is then concatenated onto the shadowMVP matrix for use in pass two, as follows:


    ```

    shadowMVP = [B] [shadowMVP_{(pass1)}]$

    ```'
