    The methods presented thus far are limited to producing hard shadows. These are
    shadows with sharp edges. However, most shadows that occur in the real world are
    soft shadows. That is, their edges are blurred to various degrees. In this section,
    we will explore the appearance of soft shadows as they occur in the real world
    and then describe a commonly used algorithm for simulating them in OpenGL.


    # 8.7.1 Soft Shadows in the Real World


