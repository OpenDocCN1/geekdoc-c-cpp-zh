  md: '# Computer Graphics Programming in OpenGL with C++


    By introducing a parameter t, we can build a system of parametric equations that
    define a curve. The t represents a fraction of the distance along the line segment
    connecting control point to the next control point. Values for t within the range
    [0, 1] for points along the segment. Figure 11.2 shows one such value, t=0.75,
    applied to the lines connecting $p_0-p_1$ and $p_1-p_2$. These defines the two
    new points $p_0(t)$ and $p_1(t)$ along the original lines. We repeat this process
    for the line segment connecting the two new points $p_0(t)$ and $p_1(t)$, producing
    $P(t)$ where $t=0.75$ along the line $p_0(t)-p_1(t)$. $P(t)$ is one of the points
    on the resulting curve, and for this reason it is denoted with a capital P.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_259_0.png)


    Figure 11.2

    Points at parametric position t=0.75.


    Figure 11.3

    Building a quadratic Bézier curve.


    Collecting many points P(t) for various values of t that generates a curve, as
    shown in Figure 11.3. The more parameter values of t are sampled, the more points
    P(t) are generated, and the smoother resulting curve.


    The analytic definition of a quadratic Bézier curve can now be derived. First,
    we note that an arbitrary point p on the line segment $p_0-p_1$ connecting two
    points $p_0$ and $p_1$ can be represented in terms of the parameter t as follows:


    > $p(t) = tp_1 + (1-t)p_0$


    Using this, we find the points $p_{01}$ and $p_{12}$ on $p_0-p_1$ and $p_1-p_2$
    respectively as follows:


    > $p_{01}(t) = tp_1 + (1-t)p_0$

    p_{12}(t) = tp_2 + (1-t)p_1$


    Similarly, a point on the connecting line segment between these points would be:


    > $P(t) = tp_{12}(t) + (1-t)p_{01}(t)$'
