  md: '# Chapter 7 · Lighting ■ 169


    The manner in which ϕ is used to compute the specular contribution depends on
    the desired “shininess” of the object being rendered. Objects that are extremely
    shiny, like a mirror, have very small highlights—that is, they reflect the incoming
    light to the eye exactly. Materials that are less shiny have specular highlights
    that are more “spread out,” and thus more pixels are part of the highlight.


    Shininess is generally modeled with a falloff function that expresses how quickly
    the specular contribution reduces to zero as the angle grows. We can use cos(ϕ)
    to model falloff, and increase the shininess by powers of the cosine function,
    such as cos(ϕ), cos²(ϕ), cos³(ϕ), ... , and so on, as illustrated in Figure 7.6.


    ![](img/5f029c1d57776416a7d2524f3734d7cf_168_0.png)


    Figure 7.6

    Shininess modeled as cosine exponent.


    Note that the higher value of the exponent, the faster the falloff, and the smaller
    the specular contribution of pixels with light reflections that are off-axis from
    the viewing angle.


    We call the exponent n, used in cos(ϕ) falloff function, the shininess factor
    for a specified material. Note back in Figure 7.3 that shininess factors for each
    of the materials are specified in the rightmost column.


    We now can specify the full specular calculation:


    ```

    I_{spec} = Light_{spec} * Material_{spec} * max(0, (R•V))

