    # HISTORICAL NOTE


    We took the liberty of over-simplifying some of the terminology in this chapter
    with respect to the contributions of Gouraud and Phong. Phong is credited with
    Gouraud shading—the notion of generating a smoothly curved surface appearance
    by computing lights at vertices and allowing the rasterizer to interpolate these
    values (sometimes called “smooth shading”). Phong is credited with smooth shading
    that instead interpolates normals and computes lighting per pixel. Phong is also
    credited with pioneering the successful incorporation of specular highlights into
    smooth shading. For this reason, the ADS lighting model, when applied to computer
    graphics, is often referred to as the Phong Reflection Model. So, our example
    of Gouraud shading is, more accurately, Gouraud shading with a Phong reflection
    model. Since Phong''s reflection model has become ubiquitous in 3D graphics programming,
    it is common to demonstrate Gouraud shading in the presence of Phong reflection,
    although it is a bit misleading because Gouraud''s original 1971 work did not,
    for example, include any specular component.


