    # SUPPLEMENTAL NOTES


    As was the case in Chapter 5 when we first studied textures, while using SOIL2
    making and texturing a cube map easy, it can have the unintended consequence of
    shielding a user from OpenGL details that are useful to learn. Of course, it is
    possible to instantiate and load an OpenGL cube map in the absence of SOIL2. While
    coverage of this topic is beyond the scope of this book, the basic steps are as
    follows:


    +   1. Read the six image files (they must be square) using C++ tools.

    2. Use glGenTextures() to create a texture for the cube map and its integer reference.

    3. Call glBindTexture(), specifying the texture’s ID and GL_TEXTURE_CUBE_MAP.

    4. Use glTextureStorage2D() to specify the storage requirements for the cube map.

    5. Call glTextureImage2D() or glTexSubImage2D() to assign the images to cube faces.


    For more details on creating OpenGL cube maps in the absence of SOIL2, explore
    any of the several related tutorials available on the Internet ([dV14], [GE16]).'
