    Using instance to generate millions of vertices in real time, as Program 12.4,
    is likely to place a load on even a well-equipped modern computer. Fortunately,
    the strategy of dividing the terrain into separate patches, as we have done to
    increase the number of generated grid vertices, also affords us a nice mechanism
