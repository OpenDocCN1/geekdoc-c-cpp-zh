  md: '# Computer Graphics Programming in OpenGL with C++


    OpenGL with C++ requires configuring several libraries. At this time there is
    a dizzying array of options, depending on one''s individual needs. In this section,
    we describe which libraries are needed, some common options for each, and the
    option(s) that we will use throughout the book. Details on how to install and
    configure these libraries for your specific platform can be found in the Appendices.


    In summary, you will need languages and libraries for the following functions:


    +   - C++ development environment

    - OpenGL / GLSL

    - window management

    - extension library

    - texture management


    It is likely that the reader will need to do several preparatory steps to ensure
    that each of these are installed and properly accessible on his/her system. In
    the following subsections we briefly describe each of them; see the Appendices
    for details on how to install and configure them for use.


    # 1.1.1 C++


    C++ is a general-purpose programming language that first appeared in the mid-1980s.
    Its design, and the fact that it is generally compiled to native machine code,
    make it an excellent choice for systems that require high performance, such as
    3D graphics computing. Another advantage of C++ is that the OpenGL call is C based.


    Many C++ development environments are available. In this textbook we recommend
    using Visual Studio [VS17] if using a PC, and Xcode [XC18] if using a Macintosh.
    Descriptions for installing and configuring each of them, depending on your platform,
    are given in the Appendices.


    # 1.1.2 OpenGL / GLSL


    Version 1.0 of OpenGL appeared in 1992 as an “open” alternative to vendor-specific
    Application Programming Interfaces (APIs) for computer graphics.'
