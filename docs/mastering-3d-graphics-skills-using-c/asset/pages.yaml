  md: 'Substituting the definitions of $p_{02}$ and $p_{01}$ gives:


    $P(t) = t[p_2 + (1-t)p_1] + (1-t)[p_1 + (1-t)p_0]$$


    Factoring and combining terms gives:


    $P(t) = (1-t)^2 p_0 + (-2t^2 + 2t)p_1 + t^2 p_2$$


    or,


    $P(t) = \sum_{j=0}^2 p_j B_j(t)$


    where:


    $B_0(t) = (1-t)^2$

    $B_1(t) = -2t^2 + 2t$

    $B_2(t) = t^2$$


    Thus, we find any point on the curve by a weighted sum of the control points.
    The weighting function $B$ is often called a "blending function" (although the
    name "B" actually derives from Sergei Bernstein [BE86], who first characterized
    this family of polynomials). Note that the blending functions are all quadratic
    in form, which is why the resulting curve is called a quadratic Bézier curve.


    # 11.2 CUBIC BÉZIER CURVES


    We now extend our model to four control points, resulting in a cubic Bézier curve
    as shown in Figure 11.4. Cubic Bézier curves are capable of defining a much richer
    set of shapes than quadratic curves, which are limited to concave shapes.


    As for the quadratic case, we can derive an analytic definition for cubic Bézier
    curves:


    $p_0(t) = t p_0 + (1-t) p_1$

    $p_1(t) = t p_2 + (1-t) p_1$$


    ![](img/5f029c1d57776416a7d2524f3734d7cf_260_0.png)


    Figure 11.4nBuilding a cubic Bézier curve.'
