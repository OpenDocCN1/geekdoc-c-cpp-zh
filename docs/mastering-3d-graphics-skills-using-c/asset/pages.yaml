  md: '# 272 Computer Graphics Programming in OpenGL with C++


    The first and third stages are programmable; the intervening second stage is not.
    In order to use tessellation, the programmer generally provides both a control
    shader and an evaluation shader.


    The tessell (its full name is tessellation primitive generator, or TPG) is a hardware-supported
    engine that produces fixed grids of triangles. The control shader allows us to
    configure what sort of triangle mesh the tessator is to build. The evaluation
    shader then lets us manipulate the grid in various ways. The manipulated triangle
    mesh is then the source of vertices that proceed through the pipeline. Recall
    from Figure 2.2 that tessellation sits in the pipeline between the vertex and
    geometry stages.


    Let''s say an application that uses tessellation to create a triangle mesh of
    vertices, and then displays it without any manipulation. For this, we will need
    the following:


