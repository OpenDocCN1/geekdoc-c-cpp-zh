  md: '# Chapter 12 · Tessellation 277


    Next let''s look at the Tessellation Evaluation Shader. It starts with a line
    of code that says:


    ```

    layout (quads, equal_spacing, cw) in;

    ```


    This may at first appear to be related to the "out" layout statement in the control
    shader, although actually they are unrelated. Rather, this line is where we instruct
    the tessellator to generate vertices so they are arranged in a large rectangle
    ("quad"). It also specifies the subdivisions (inner and outer) to be of equal
    length (later we will see a use for subdivisions of unequal length). The "ccw"
    parameter specifies the winding order in which the tessellated grid vertices are
    generated (in this case, counter-clockwise).


    The vertices generated by the tessellator are then sent to the evaluation shader.
    Thus, the evaluation shader may receive vertices from both the control shader
    (typically as control points) and from the tessellator (the tessellated grid).
    In Program 12.1, vertices are only received from the tessellator.


    The evaluation shader executes once for each vertex produced by the tessellator.
    The vertex location is accessible using the built-in variable gl_TessCoord. The
    tessellated grid is oriented such that it lies in the X-Z plane, and therefore
    gl_TessCoord''s X and Y coordinates are applied at the grid''s X and Z coordinates.
    The grid coordinates, and thus the values of gl_TessCoord, range from 0.0 to 1.0
    evaluation shader then uses the mv matrix to orient each vertex (this was done
    in the vertex shader in examples from earlier chapters).


    Finally, the fragment shader simply outputs a constant color yellow for each pixel.
    We can, of course, also use it to apply a texture or lighting to our scene as
    we saw in previous chapters.


