  md: '# 3.4.3 Rotation


    Rotation is a bit more complex, because rotating an item in 3D space requires
    specifying (a) an axis of rotation and (b) a rotation amount in degrees or radians.


    In the mid-1700s, the mathematician Leonhard Euler showed that a rotation around
    any desired axis could be specified as a combination of rotations around the X,
    Y, and Z axes [EU7]. These three rotation angles around the respective axes have
    come to known as Euler''s angles. The discovery, known as Euler''s Theorem, is
    very useful to us, because rotations around each of the three axes can be specified
    using matrix transforms.


    The three rotation transforms, around the X, Y, and Z axes respectively, are shown
    in Figure 3.5. There are several functions in GLM for building and using rotation
    matrices as:


    +   - glm:rotate(mat4, theta, x, y, z) builds a rotation matrix for an angle theta
    around an axis x,y,z.


    +   - mat4 * vec4


