    Light affects the appearance of our world in varied and sometimes dramatic. When
    a flashlight shines on an object, we expect it to appear brighter on the side
    facing the light. The earth on which we live is itself brightly lit where it faces
    the sun at noon, but as it turns, daytime brightness gradually fades into evening,
    becoming completely dark at midnight.


    Objects also respond differently to light. Besides having different colors, objects
    can have different reflective characteristics. Consider two objects, both green,
    but where one is made of cloth versus another made of polished steel—the latter
    will appear more "shiny."


    # 7.1 LIGHTING MODELS


    Light is the product of photons being emitted by high energy sources and sub-nsequently
    bouncing around until some of the photons we reach our eyes. Unfortunately, it
    is computationally infeasible to emulate this natural process, as it would require
    simulating and then tracking the movement of a huge number of photons, adding
    many objects (and matrices) to our scene. What we need is a *lighting model*.'
