  md: 'Actually, the reason that the back faces of the pyramid did not appear is because
    we enabled back-face culling. A reasonable idea might be to disable back-face
    culling while drawing the pyramid. However, this often produces other artifacts,
    as shown in Figure 14.5 (on the left). The problem with simply disabling back-face
    culling is that it determines the effects of blending depending on the order that
    are rendered (because that determines the source and destination pixels), and
    we don''t always have control over the rendering order. It is generally advantageous
    to render opaque objects first, as well as objects that face back (such as the
    torus) before any transparent objects. This holds true for the surfaces of the
    pyramid, and in this case the reason that the two triangles comprising the base
    of the pyramid appear different is that one of them rendered before the front
    and one was rendered. Artifacts such as these are called "ordering" artifacts,
    and they can manifest in transparent models because we cannot always predict the
    order in which triangles will be rendered.


    We can solve the problem in our pyramid example by rendering the front and back
    faces properly, ourselves starting with the back faces. Program 14.2 shows the
    code for doing this. We specify the alpha value for the pyramid by passing it
    to the shader program in a uniform variable, then apply it in the fragment shader
    by substituting the specified alpha into the computed output color.


    Note that also for lighting to work properly, we must flip the normal vector when
    rendering the back faces. We accomplish this by sending a flag to the vertex shader,
    and we then flip the normal vector.


    # Program 14.2 Two-Pass Blending for Transparency


    C++ / OpenGL application - in display() for rendering pyramid:


    ```

    glEnable(GL_CULL_FACE);

    glEnable(GL_BLEND);                            // configure blend settings

    BlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

    BlendEquation(GL_FUNC_ADD);



    gglCullFace(GL_FRONT);                             // render pyramid back faces
    first

    glProgramUniform1f(renderingProgram, aloc, 0.31);      // back faces very transparent

    glProgramUniform1f(renderingProgram, floc, -1.0f);     // flip normals on back
    faces

    gDrawArrays(GL_TRIANGLES, 0, numPyramidVertices);

    ```'
