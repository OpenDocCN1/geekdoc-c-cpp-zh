    improved performance.


    # 3.4.1 Translation


    A translation matrix is used to move items from one location to another. It consists
    of an identity matrix, with the X, Y, and Z movement(s) given in locations $A_{03},
    A_{13}, A_{23}$. Figure 3.3 shows the form of a translation matrix and its effect
    when multiplied by a homogeneous point; the result is a new point "moved" by the
    translate values.


    ```

    $\begin{bmatrix} X+T_x & 1 & 0 & 0 \ Y+T_y & 0 & 1 & 0 \ Z+T_z & 0 & 0 & 1 \ 0
    & 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} X \ Y \ Z \ 1 \end{bmatrix}$

    ```


    Note that point (X,Y,Z) is translated (moved) to location as a result of being
    multiplied by the translation matrix. Also note that multiplication is specified
    to right left.


    Figure 3.3

    Translation matrix transform.


    For example, if we wish to move a group of points upward 5 units along the Y direction,
    we could build a translation matrix by taking an identity matrix and placing the
    value 5 in the $T_y$, position. Then we simply multiply each of the points we
    wish to move by the matrix.'
