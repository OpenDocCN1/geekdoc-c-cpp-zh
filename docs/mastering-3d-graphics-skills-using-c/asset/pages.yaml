  md: "# Computer Graphics Programming in OpenGL with C++\n\nIt might seem redundant\
    \ to include an ambient contribution for a light when we already have global ambient\
    \ light. The separation of the two, however, is intentional and noticeable when\
    \ the light is \"on\" or \"off\". When \"on,\" the total ambient contribution\
    \ would be increased, as expected. In the above example, we have included only\
    \ a small ambient contribution for the light. It is important to balance the two\
    \ contributions depending on the needs of your scene.\n\nA positional light has\
    \ a specific location in the 3D scene. Light sources that are near the scene,\
    \ such as lamps, candles, and so forth, are examples. Like directional lights,\
    \ the effect of a positional light depends on angle of impact; however intensity\
    \ is not specified, as it is different for each vertex in our scene. Position\
    \ lights may also incorporate attenuation factors in order to model how their\
    \ intensity diminishes with distance. With the other types of lights we have seen,\
    \ positional lights have ambient, diffuse, and specular properties specified as\
    \ RGB values. A red positional light at location (5,2,-3) could for example be\
    \ specified as follows:\n\n```\nfloat posLightAmbient[4] = {0.1, 0.0, 0.0, 1.0};\n\
    float posLightDiffuse[4] = {1.0, 0.0, 0.0, 1.0};\nfloat posLightSpecular[4] =\
    \ {1.0, 0.0, 0.0, 1.0};\nfloat posLightLocation[4] = {5.0, 2.0, -3.0, 1.0};\n\
