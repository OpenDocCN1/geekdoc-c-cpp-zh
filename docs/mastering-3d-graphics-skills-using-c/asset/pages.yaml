  md: '# Computer Graphics Programming in OpenGL with C++


    # 4.1 BUFFERS AND VERTEX ATTRIBUTES


    For an object to be drawn, its vertices must be sent to the vertex shader. Vertices
    are usually sent by putting them in a buffer on the C++ side and associating that
    buffer with a vertex attribute declared in the shader. There are several steps
    to accomplish this, which only need to be done once, and some of which—if the
    scene is animated—must be done at every frame:


    Done once—typically in init():


    +   1. create a buffer

    2. copy the vertices into the buffer

    3. enable the buffer containing the vertices

    4. associate the buffer with a vertex attribute

    5. enable the vertex attribute

    6. glDrawArrays() to draw the object


    Done each frame—typically in display():


    +   1. enable the buffer containing the vertices

    2. associate the buffer with a vertex attribute

    3. enable the vertex attribute


    Buffers are created all at the start of the program, either in init() or in a
    function called by init(). In OpenGL a buffer is contained in a Vertex Buffer
    Object, or VBO, which is declared and instantiated in the C++/OpenGL application.
    A scene may require many VBOs, so it is customary to generate and then fill them
    in init so that they are available whenever your program needs to draw one or
    more of them.


    A buffer interacts with a vertex attribute in a specific way. When glDrawArrays()
    starts, the data in the buffer starts flowing, sequentially from the beginning
    of the buffer, through the vertex shader. As described in Chapter 2, the vertex
    shader executes once per vertex. In 3D space however the appropriate vertex attribute
    in the shader to receive these three values would be of type vec3. Then, for each
    three values in the buffer, the shader is invoked, as illustrated in Figure 4.1.


