    As described in Chapter 1, there are a number of installation and setup steps
    that must be accomplished in order to use OpenGL and C++ on your machine. These
    steps vary depending on which platform you wish to use. This Appendix provides
    step-by-step detailed instructions for the Macintosh platform. For information
    on setting up and running the code samples in the book on a PC with Windows, see
    Appendix A: Installation and Setup for PC (Windows).


    Apple support for OpenGL on the Macintosh has languished in the past few years.
    For example, modern Macs as of this writing still support up to OpenGL version
    4.1. Still, it is possible to run the examples in this book with minor modifications.
    As for preparing the necessary libraries, all of the libraries described in Chapter
    1 are cross-platform and available for the Apple Macintosh. In some cases installation
    is actually simpler on the Mac. We first describe how to install these libraries,
    and then we cover the setup for an appropriate development environment.


    In addition, the code samples in this book are designed to be run (as-given) on
    a Windows platform, this Appendix provides details on converting the code samples
    so they run correctly on the Macintosh.


    # B.1 INSTALLING THE LIBRARIES AND DEVELOPMENT ENVIRONMENT


    # B.1.1 Preparing and Installing the Libraries


    An overview of the purpose and selection of each library was given in Chapter
    1. We won''t repeat that information here; instead, we focus on how to install
    each library.'
