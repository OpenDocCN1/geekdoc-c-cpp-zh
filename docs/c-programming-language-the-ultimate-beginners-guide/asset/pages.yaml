  md: "# Chapter 4: The C Language Variables\n\nPrograms work fine with immediate\
    \ values. Butoftimes, you don't know what the value is. Say the value comes from\
    \ input, the user types it. It is read from a file or the Internet. To store such\
    \ values, you need a specific buffer-hole or container. In programming, container\
    \ is known as a variable. In this chapter, we introduce you to the concept of\
    \ the variable. It is a container into which you can store values—values that\
    \ are unknown or values that can change.\n\nYou'll see how to declare a variable\
    \ in the C language, and how a variable is used in the code. A variable is a container\
    \ for a value. Because C deals with different types of values, a variable must\
    \ be declared as a specific type. It is given a name—a name that's used in the\
    \ code.\n\nIn C, the variable type matches the content—the type of value being\
    \ stored. Integer variables can hold only integer values or whole numbers. Float\
    \ variables floating-point values, which are very large numbers, very small numbers,\
    \ and numbers with a fractional part.\n\nCharacter variables hold single values\
    \ as the letter 'x'. The C language lacks a string type. Instead, a character\
    \ array is used. We'll discuss how this works in a later chapter.\n\nThe int,\
    \ float, and char are all C language keywords. Additional keywords are also used\
    \ to declare variables. These include double, long, short, signed, and unsigned.\
    \ These are all C language keywords used to declare different types of variables.\
    \ Take a look at the code below:\n\n```\n#include <stdio.h>\nint main()\n{\n \
    \   int age;\n    age = 30;\n    printf(\"The C language is %d years old!\\n\"\
    , age);\n    return(0);\n}\n```\n\nThis code declares an integer variable at line\
    \ five. First comes the keyword int, which is used to declare an integer variable.\
    \ Next come the variable name: age. As this is a statement, it ends with a semicolon.\
    \ Variable names can include numbers, letters, and symbols. They must begin with\
    \ a letter, or an underline. The name must be unique, with no two variables having\
    \ the same name, nor variables have the same name or C language keywords.\n\n\
    At line seven the variable age is assigned the value 30. In C, values or equations\
    \ go on the right side of the assignment operator, the equal sign. The value or\
    \ results of the equation is then assigned to the variable on the left. Because\
    \ 30 is an integer value, it fits nicely into the integer variable age."
