  md: '# # Chapter 2: Staring Your First C Project


    The normal human language has two parts: syntax and speech. Likewise, the C programming
    language also has its own syntax and speech. If a person who has no background
    in computer programming looks at a computer source code, it is likely that they
    won''t be able to make heads or tails out of it. However, once they learn the
    syntax and the figures of speech of the programming language, it will all begin
    to make sense.


    In this book, we will introduce you to syntax and figures of speech of the C programming
    language. We will teach you how it is structured, the main function actually does,
    and also familiarize yourself with its various functions, keywords, variables,
    and operators.


    In the Code Blocks IDE, go ahead and click the "New" button, and then click "Empty
    file." At this point, you''re going to type a C programming language code in the
    editor window of the Code Blocks IDE. Don''t be afraid. You''re going to type
    only one line.


    Go ahead and type the word "main", followed by a pair of parenthesis and a space,
    and then lastly, followed by a pair of curly braces or brackets. Once you finish
    typing that in, press Enter on the keyboard. Your Code Blocks editor should now
    look like this:


    +   1 main() {}

    2


    Now, save the source code file by clicking the Save button. If you need to, choose
    the specific folder where you want to save your C programming language source
    code. Type the filename "dummy.c" for the file. The source code file is now created
    and saved. Next, click the Build button.


    The code does compile. What you see is the absolute minimum C program known as
    "The dummy." All C source code must have the main function. This is where the
    program execution starts. The contents of the main function are enclosed in curly
    brackets.


    In our dummy source code, everything is empty, which is okay. However, you might
    see a compiler warning, which isn''t critical. A program was created. Click the
    Run button to run the dummy program. You will notice that there is no output.
    That is to be expected because the program code does nothing.


    Like any language, the C programming language has several parts:


    +   - Keywords

    - Functions

    - Operators

    - Values and Variables

    - Structure'
