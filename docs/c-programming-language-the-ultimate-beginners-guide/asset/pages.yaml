  md: "# Chapter 14: C Language Variables\n\nA variable is a container for some type\
    \ of data. In the C language, that container holds an integer, floating point\
    \ character or other value. But philosophically speaking, what actually is a variable?\
    \ In this chapter, we help you explore the concept of the variable. You'll see\
    \ various ways a variable is described, how to determine its size, and its storage\
    \ location.\n\nIn the typical C language variable declaration, you learned two\
    \ tidbits about the variable: its type and its name. Below, you see an integer\
    \ variable declared:\n\n```\n#include <stdio.h>\nint main()\n{\n    int a;\n \
    \   printf(\"The value of a is %d\\n\",a);\n    return(0);\n}\n```\n\nIt is an\
    \ integer int, and its name is a. The variable is uninitialized, or never assigned\
    \ a value. Even so, you can use it in the code, as is shown in line 7. Build and\
    \ run this program. On your end, you might see any random value. Unlike other\
    \ programming languages, C does not initialize variables as they are declared.\
    \ Internally, the program allocates a chunk of memory to store the variable's\
    \ information.\n\nThat chunk wasn't initialized, and is not set to zero. It is\
    \ just some location in the memory. Whatever value that's already there, is immediately\
    \ absorbed by your variable as shown in whatever your output be. The moral of\
    \ the story is to always initialize variables before you use them. You can fix\
    \ the previous code by adding a line like so:\n\n```\n#include <stdio.h>\nint\
    \ main()\n{\n    int a = 65;\n    printf(\"The value of a is %d\\n\",a);\n   \
    \ return(0);\n}\n```"
