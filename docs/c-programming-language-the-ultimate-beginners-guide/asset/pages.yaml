  md: "# # Chapter 5: Character I/O Functions in C\n\nPrograms are both known for\
    \ input and output. Output goes to the standard output device, which is usually\
    \ the screen or terminal window. Input comes from the standard input device, which\
    \ is normally the keyboard. In this chapter, we'll explore input and output concepts\
    \ in C. These involve character I/O, which is the reading of single characters,\
    \ as well as the output of a single character. We'll also touch upon the concept\
    \ of stream input and output.\n\nThe two common C language character I/O functions\
    \ are getchar() and putchar(). Getchar() fetches the standard input. Both of these\
    \ functions require the inclusion of stdio.h header file for their prototypes\
    \ and such.\n\nAlthough they're are character functions, they work with integer\
    \ values. Yes, that's weird, but so are many things in the C language. In fact,\
    \ you may find yourself frequently using char variables with these functions.\
    \ When you do, the compiler may gently warn you about the mistake. Finally, these\
    \ functions are stream oriented, which is something we'll discuss in the later\
    \ chapters.\n\nTake a look at this code:\n\n```\n1 #include <stdio.h>\n2 \n3 int\
    \ main();\n4 {\n5 int c;\n6 \n7 printf(\"Type a letter: \");\n8 c = getchar();\n\
    9 printf(\"You typed %c.\\n\", c);\n10 \n11 return(0);\n12 \n13 }\n```\n\nInteger\
    \ variable C is declared at line 5. It is used with the getchar() function at\
    \ line eight, storing a single character from the input stream. In this example,\
    \ that would be a character typed by the keyboard. The character is displayed\
    \ at line nine. The int variable C is used, but the character placeholder %c is\
    \ specified. This ensures that the character is displayed, not its code value.\
    \ Build and run the code.\n\nNote that the prompt in the output keeps the cursor\
    \ at the same line, and we've added a space to make it more readable. Type a letter,\
    \ such as a big letter 'Z,' and press the Enter key. As you can see in the output,\
    \ it will immediately specify the letter you typed."
