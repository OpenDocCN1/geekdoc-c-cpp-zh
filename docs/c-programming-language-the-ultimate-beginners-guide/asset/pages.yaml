  md: "# # Chapter 15: C Language Pointers\n\nPointers are puzzling. Yet, we hope\
    \ this section clears the air for you. We'll discuss what a pointer is and how\
    \ it is used. We promise to make nice and slow because this topic is a very important\
    \ part of learning the C language.\n\nThe worst thing about pointers is their\
    \ name. Pointers. It is descriptive, but a poor choice because you end explaining\
    \ a pointer by saying, \"A pointer, points.\" That’s pointless. But we can't change\
    \ the name, so allows us to explain a pointer by giving you this definition: A\
    \ pointer is a variable that holds a memory location—an address.\n\nIt is not\
    \ just address. You can't say, for, \"Let’s see what's at memory location 96.\"\
    \ Pointers do not work that way. The address must be the location of another variable.\
    \ Pointer variables are declared similarly to other variables, although the variable\
    \ name is prefixed by the operator *.\n\nThe pointer variable type matches the\
    \ type of value it references. For example, an int variable requires an int pointer.\
    \ Pointer variables must be initialized before they are used. This is true of\
    \ all the variables in the C language, but especially for pointers. Lots of weird\
    \ errors happen when a pointer isn't initialized.\n\nWe can't repeat it enough:\
    \ Pointers must be initialized before they are used. The code below is similar\
    \ to an example from an earlier chapter:\n\n```\n#include <stdio.h>\nint main()\n\
    {\n    int pokey;\n    printf(\"the address of 'pokey' is %p\\n\\n\", &pokey);\n\
    \    return(0);\n}\n```\n\nThe ampersand operator fetches the address of the variable\
