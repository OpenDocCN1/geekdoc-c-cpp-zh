  md: '# Chapter 3: The Old I/O


    The best way to get started on your programming journey is to write some simple
    programs that are easy to understand and change. To handle that task, it helps
    to know the basics of input and output, or I/O.


    In this chapter, we introduce you to the concept of I/O, and how that plays into
    programming. You will get to explore some basic I/O functions, and use one of
    those functions to create tiny programs that output interesting text.


    A program has to do something. That something involves taking input and generating
    output. This is a typical C program works: it''s a machine that does something
    to input, and then generates output.


    ![](img/16c76b89fcd0f2321c5160df3bad52e2_18_0.png)


    If the program does not do anything, then it is basically plumbing; what comes
    in, goes out. The C library offers a host of output functions. From the lot, these
    three are the most popular. They are:


    +   - printf()

    - putchar()

    - puts()


    # Puts Function


    Each function is designed to send one or more characters to the standard output
    device, which is the screen or terminal window. The puts function puts, or sends
    a string of text to standard output. “Puts” is put string, and a string is a collection
    of characters enclosed in double quotes. This function is defined in the STDIO.IO
    header file, which is included at line one of your dummy program.'
