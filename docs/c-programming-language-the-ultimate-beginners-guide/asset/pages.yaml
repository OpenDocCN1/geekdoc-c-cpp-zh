    \ must specify a condition that makes the loop repeat, a set of statements that\
    \ repeat, and a way for the loop to stop. In the code below, a while loop from\
    \ 1 to 10.\n\n```\n1 #include <stdio.h>\n2 \n3 int main()\n4 {\n5     int x;\n\
