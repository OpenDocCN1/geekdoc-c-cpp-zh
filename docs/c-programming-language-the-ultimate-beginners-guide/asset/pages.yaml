  md: "# # Chapter 12: C Language Structures\n\nAnother variable type in the C language\
    \ is the structure. It is actually a combination of existing variable types tied\
    \ together into a single unit. A structure variable simply has many parts like\
    \ a record in a database. This chapter presents the concept of the structure.\
    \ You'll see how to set up a structure, structure variables, and how to access\
    \ structure members.\n\nWe'll discuss how to fill data into a structure, as well\
    \ as the interesting idea of placing one structure inside another. The code below\
    \ is not a complete code, of course, but shows you how a structure can be created\
    \ in the C language.\n\n```\n#include <stdio.h>\nint main() {\n    struct record\
    \ {\n        int account;\n        float balance;\n    };\n    return(0);\n}\n\
    ```\n\nThe keyword struct is followed by the name of the structure. In this case,\
    \ the name is 'record'. The structure members are contained in curly brackets;\
    \ each ending with a semi-colon because the whole deal is a statement. The structure\
    \ members are variable declarations. Inside this structure, you'll find an int\
    \ and a float member. The int member is named 'account'. The float member is named\
    \ 'balance'.\n\nBy itself, the structure declaration creates a type of structure,\
    \ a new type of variable in the code. To use the structure, you need to declare\
    \ a variable of the structure type. On line 9 we're going to type the following:\n\
    \n```\n#include <stdio.h>\nint main() {\n    struct record {\n        int account;\n\
    \        float balance;\n    };\n    struct record my_bank;\n```"
