  md: '# Keywords


    The keywords are the language part of the C language. They accomplish very basic
    tasks. The good news is that, unlike English which has tens of thousands of words,
    there are only 44 words in the C language. In practice, you may only use about
    half of these keywords.


    | Alignas | break | float | signed |

    | Alignof | case | for | sizeof |

    | Atomic | char | goto | static |

    | Bool | const | if | struct |

    | Complex | continue | inline | switch |

    | Generic | default | int | typedef |

    | Imaginary | do | long | union |

    | Norenten | double | register | unsigned |

    | Static_assert | else | restrict | void |

    | Thread_local | enum | return | volatile |

    | auto | extern | short | WHILE |


    # Functions


    The real workhorses of the C language are functions. What the keywords do is really
    basic. To do more in C, you rely upon a function. The functions are held in libraries.
    The linker''s job is to combine the library with your program''s object code;
    knitting the two together to make a program.


    To use a function in a program, you must incorporate a header file, which defines
    the function. You will see how that''s done in the later chapters.


    # Operators


    Operators are symbols used to manipulate data in the program. These include the
    traditional math operators as well as a host of other special symbols.


    +   - Mathematical: +-*/%&|+-~'
  merge: -1
  pgno: 14
- img_proc: true
  md: '+   - Comparison: == != > <


    +   - Assignment: += - + *=


    +   - Logical: && || !


    +   - Bitwise: | ^ << >>


    +   - Unary: ~ - ! *


    # Values and Variables


    Values and variables are similar. Values include characters and numeric values.
    The numeric values are divided between integers or whole numbers, and floating-point
    values which contain a decimal part or fraction. All of them can be very, very
    large values, or very, very small values.


    A variable, on the other hand, is a container for a value. Its contents can change
    or vary, which is why they are called variables. The values that go into the variables
    are the same types of values you use directly in a program.


    # Structure


    Every piece of the C programming language must be utilized in a particular order
    or manner. This is what''s called as the C programming language structure. To
    assist in controlling the program flow, the C programming language makes use of
    preprocessor directives. The first function that is run in every C language program
    is the main function. The main function is a major requirement in every C language
    program. Without it, the program will not compile, much less run.


    Curly braces/brackets are utilized to enclose the contents of the function. What
    amounts to sentences in the C programming language area are what we call "Statements".
    Statements are but are not limited to C functions, keywords, logical comparisons,
    and so on.


    Finally, we have the "comments". Comments are notes for other programmers, or
    yourself, who will be looking at the source code. Comments serve as general information
    or reminders and are not compiled part of the source code by the compiler. Since
    now you have a little background, let us put it to use by completing the dummy.c
    programming source that we wrote previously.


    Return to the dummy.c program source code in the IDE''s editor. The main function
    is defined as an integer function. That means it returns an integer value to the
    operating system. Therefore, some editing is necessary. In your editor, type the
    C language keyword "int" before the word "main" and ensure that a space separates
    like so:


