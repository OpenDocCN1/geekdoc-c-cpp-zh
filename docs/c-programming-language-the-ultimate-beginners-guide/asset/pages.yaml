  md: "# Chapter 8: Anatomy of a Function\n\nThe C library is brimming with functions.\
    \ Functions do a lot of things, but perhaps not everything you need for your programs.\
    \ Therefore, when necessary, you can concoct your own C language functions. In\
    \ fact, most programmers have dozens, if not hundreds of their own functions.\n\
    \nIn this chapter, we introduce you to the function. You'll see how to setup and\
    \ prototype a function, how to call or access the function, and how to bail out\
    \ of a function early. Everything in the C language, a function has a certain\
    \ style, and various etiquettes must be followed to add a function to your code.\n\
    \nA function has a type, a name, and arguments in parenthesis. A *type* is a value\
    \ returned by the function—its output. The *name* is a unique name that identifies\
    \ the function. The *arguments* are zero, one, or more values passed to the function—its\
    \ input. Below, the alpha function has no input or output, which is valid in the\
    \ C language. Therefore, it is a function.\n\n```\nalpha(void)\n```\n\nVoid is\
    \ a variable type, which means \"I have no variable type.\" Function count is\
    \ an integer function. generates or returns integer values. It requires more input,\
    \ and therefore has no arguments.\n\n```\ncount(void)\n```\n\nFunction hang returns\
    \ values, so it's a void function. It does, however, accept a single character\
    \ as input. The character is an argument. It is reference by variable ch. Before\
    \ you use a function, it must be introduced to the compiler. That way the compiler\
    \ can check its arguments to ensure that it is being used properly.\n\nFunctions\
    \ are called by their name, and then a parenthesis. When a function is called,\
    \ control passes to the function's statement. Then, when the function is over,\
    \ flow continues with the statement after the function call. The code below contains\
    \ two functions:\n\n```\n#include <stdio.h>\nvoid blorf(void);\nint main ()\n\
    {\n\tuts(\"The main () function always runs first\");\n\tblorf();\n\tuts(\"Thanks,\
