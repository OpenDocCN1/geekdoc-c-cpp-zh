  md: '# # What is Programming?


    Programming is where you create software. Software controls hardware, which is
    the physical part of an electronic device such as a computer, phone, tablet, gaming
    console, micro-controller or some other gizmo. These instructions take the form
    of a programming language. For this book, language is the C programming language,
    which was developed back in the early 1970s.


    It is very old. In fact, over time the C programming language has been considered
    the Latin of programming languages. Unlike Latin, C is not dead. Lots of C programming
    still goes on despite of newer and fewer programming languages coming along. But
    like Latin, C is the foundation upon which many other programming languages are
    built. If you know C, you can easily learn these other languages.


    In a later chapter, we will talk about the programming language''s syntax and
    other rules. But for now, know that the code you write is called source code.


    # # What is a Source code?


    A source code is a plain text file that contains the programming language, all
    formatted and pretty written properly. In C, the file is saved with a .c filename
    extension. To create a source code, you use a text editor. Any text editor can
    do, although some editors offer helpful features like color coding, line numbers,
    syntax checking and other tools.


    The source code is compiled into object code. The program that creates the object
    code is called a compiler. The traditional name of the C language compiler is
    CC, which stands for C compiler. The compiler reads the source code file and generates
    an object code file.


    Object code files have a .o extension, and they use the same filename as the original
    source code. The next step is called Linking. It is often forgotten that modern
    compilers compile and link, but linking is a separate step.


    The linker takes object code and combines it with C language libraries. The libraries
    are the workforce of language. They contain routines and functions that control
    whatever device you are programming. If all goes well, the end result is a program.
    You can then run the program to make sure that it works the way you want it to.
    And if not, you start the cycle all over again: edit, compile and link, or “build,”
    and test run.


    All of these tools—the editor, compiler, linker—all originated at the command
    prompt or terminal. You can still find them there too. Programmers do a lot of
    coding at the command prompt because it is quick. More common, however, is to
    use an IDE, or Integrated Development Environment.


    # # What is an IDE?'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'An IDE, or Integrated Development Environment, combines the tools for editing,
    compiling, linking, and running. It also adds tools for debugging, creating complex
    programs, graphical tools and other features.


    Beneath it, however, is the humble command line compiler and linker. The process
    is the same: edit, compile and link. You are going to do a lot of repeating and
    re-working before you get things right.


    The good news is that all the tools you need to begin your programming journey
    are free on the internet. The bad news is that you have to find the right tools
    and install them properly. This is not an issue for you because in this book,
    we''ll show you how to do it.


    You will see how to find a good IDE, or Integrated Development Environment, a
    C language compiler, and everything set and configured. You will find a horde
    of IDEs on the Internet. Microsoft offers the Visual Studio as its IDE, and Apple
    has Xcode.


    You are welcome to use these tools, especially if you are comfortable with them.
    But for this book, we have chosen the Code Blocks IDE. The great thing about Code
    Blocks is that it comes with everything you need. Unlike other IDEs, you don''t
    have to hunt for it after the IDE is installed. You only have to download, configure,
    and you are ready to go. Obtain Code Blocks by visiting the developer''s website:
    http://www.codeblocks.org.


    Point your favorite browser—Chrome, Firefox, Internet Explorer—to that website.
    On that page, look for the download link. The page you may look different, as
    web may change from time to time.


    ![](img/16c76b89fcd0f2321c5160df3bad52e2_6_0.png)


    Click on the download link. Choose to download the binary file. On the next page,
    click the link that represents your operating system: Windows, Linux, or OSX.
    For Windows, look for the setup.exe file that includes the MinGW compiler. For
    example, on the screen below, it is codeblocks-16.01mingw-setup.exe. The number
    is that that you need.'
