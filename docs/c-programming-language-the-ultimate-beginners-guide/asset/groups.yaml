    \ Build and run the code. Type any two letters that you like. The two characters\
    \ you type are stored in variables a and b, and displayed.\n\n## The String\n\n\
    A character is a single letter or symbol. Put two characters together and you\
    \ have a string. But strings are funky things in the C language. They are not\
    \ a variable type, just an array of characters all matching in a line.\n\nIn this\
