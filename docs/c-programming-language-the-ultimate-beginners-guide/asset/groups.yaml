    # 序言


    感谢购买本书：《C 语言——初学者终极指南》。在本书中，我们将为你概述在实际开始使用 C 语言编程之前必须理解的概念。我们将向你解释在深入为不同的操作系统开发更复杂的程序之前，你应该了解的各种元素。


    C 编程语言有许多优点。然而，它也有许多可能让你困惑的细微之处。无法理解这些方面无疑会在未来给你带来麻烦。


    在本书中，我们将讨论这些元素到底是什么。我们还将讨论什么是 C，它源自何处，以及在实际开始编程之前必须理解的所有基础概念。此外，我们还将教你如何设置和使用
    Code Blocks IDE，这在你进行 C 语言编程时将大有帮助。


    希望你喜欢这本书。


    # 第一章：C 语言简介


    当你开始学习编程时，就像面对任何新事物，你会发现自己被各种奇怪且可能古怪的术语和深奥词汇所包围。在书中，我们将回顾这些术语，并介绍整个编程过程的概述。你可能非常急于开始编写代码，并且可能已经看过了书书中后面的章节。了解一些术语和编程概念是非常重要的。


    ## C 编程语言的历史


    回到 1972 年，AT&T 贝尔实验室的一位计算机科学家开始开发一些自己需要的程序。丹尼斯·里奇（Dennis Ritchie）当时开始开发的内容已经演变成了
    C 编程语言，而它现在全球范围内广泛使用。


    他试图让计算尽可能简单。丹尼斯·里奇意识到当时的汇编语言太复杂了。他们试图通过在微型计算机上构建一种小型简单的编程语言来扭转这一趋势。


    丹尼斯·里奇想要保持不仅是一种用于创建程序的高效计算机编程语言，还是一种能够让编程社区形成——同情谊——的计算机编程语言。他们从以前的经验中知道，由分时、远程访问系统提供的联合计算的真实本质不仅仅是向终端输入并执行代码，而是为了激发通信后的交流。


    C 语言是一种通用的结构化编程语言。它也被称为面向过程的编程语言。


    C 语言并不是专门为某个特定的应用领域而设计的。然而，它非常适合商业和科学应用。它具有应用程序所需的各种特性，如控制结构、循环语句和宏。C 语言具有以下特征：


    - 可移植性

    - 灵活性

    - 有效性与效率

    - 可靠性

    - 交互性


    ## 什么是编程？


    编程就是创建软件的过程。软件控制硬件，硬件是电子设备的物理部分，如计算机、手机、平板电脑、游戏主机、微控制器或其他设备。这些指令以编程语言的形式存在。


    C 编程语言有许多优点。然而，它也有许多可能让你困惑的细微之处。


    在本书中，我们将讨论这些元素到底是什么。我们还将讨论什么是 C，它源自何处，以及在实际开始编程之前必须理解的所有基础概念。此外，我们还将教你如何设置和使用
    Code Blocks IDE，这在你进行 C 语言编程时将大有帮助。


    ## 什么是源代码？


    ## 什么是 IDE？


    IDE，或集成开发环境，将编辑、编译和运行的工具结合在一起。它还增加了调试、创建复杂程序、图形化工具。


    然而，在它的下方是命令行编译器和链接器。过程是相同的：编辑、编译和链接。在成功之前，你将进行大量的重复和重工作。


    好消息是，开启这段旅程所需工具在互联网上都是免费的。坏消息是，你必须找到这些工具并正确安装它们。这对你来说不是问题，因为在书中，我们将教你如何做。


    你将看到如何找到一个好的 IDE（集成开发环境）、C 语言编译器，并完成所有设置配置。


    '
