    \ declaration creates a type of structure, a new type of variable in the code.\
    \ To use the structure, you need to declare a variable of the structure type.\
    \ On line 9 we're going to type the following:\n\n```\n#include <stdio.h>\nint\
    \ main() {\n    struct record {\n        int account;\n        float balance;\n\
    \    };\n    struct record my_bank;\n```"
