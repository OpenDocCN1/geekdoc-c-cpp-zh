    \ Yes（是）即可。\n\n## 第2 章：启动你的第一个 C 项目\n\n普通人类语言有两个部分：语法和口语。同样，C 编程语言也有它自己的语法和口语。如果一个没有计算机编程背景的人看计算机源代码，他们可能无法从中看出门道。然而，一旦他们学会了这种编程语言的语法和修辞，一切都会开始变得清晰。\n\
    \n在本书中，我们将为你介绍 C 编程语言的语法和修辞。我们将教你它是如何结构的、`main` 函数（主函数）到底在做什么，并让你熟悉它的各种函数、关键字、变量和操作符。\n\
    \n在 Code Blocks IDE 中，点击“New”（新建）按钮，然后点击“Empty file”（空文件）。此时，你将在 Code Blocks IDE\
