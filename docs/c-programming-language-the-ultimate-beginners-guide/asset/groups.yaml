    \ C 语言的任何地方，一个函数都有特定的风格，并且向代码中添加函数时必须遵循各种准则。\n\n一个函数有一个类型、一个名称以及括号中的参数。*类型*是函数返回的值——即它的输出。*名称*是标识该函数的唯一名称。*参数*是传递给函数的零、一个或多个值——即它的输入。下文所示，`alpha`\
