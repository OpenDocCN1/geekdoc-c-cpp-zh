    4 {\n5 int c;\n6\n7 printf(\"Type a letter: \");\n8 c = getchar();\n9 printf(\"\
    You typed \");\n10 putchar(c);\n11 printf(\"\\n\");\n12\n13\n14 return(0);\n15\
    \ }\n```\n\nEdit to what it says, \"You typed\" and notice how we kept that single\
