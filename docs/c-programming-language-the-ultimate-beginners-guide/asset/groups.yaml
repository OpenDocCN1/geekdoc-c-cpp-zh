  mdcn: "\n编译器知道 `main` 函数的参数。虽然存在两个参数，但如果它们没有被使用，你就不需要指定它们。`main` 函数中的括号保持为空。然而，对于你声明并使用的其他函数，你是不可以这么做的。\n\
    \n## 字符操作函数\n\n字符的操作非常多，因此 C 库提供了一系列字符操作函数。在本节中，我们将介绍其中一些函数，并展示如何在你的代码中使用它们。作为额外，我们还将介绍逻辑表达式，它们在处理字符时也可以派上用场。\n\
    \n在你的 C 代码中，字符要么以单个的形式出现，要么在一个名为字符串的数组中连续排列。你可以一次处理一个字符，或者更常见地对字符串进行处理。下面的代码包含了一个\
    \ `ctype.h` 头文件，该文件包含了字符测试和操作函数的原型声明：\n\n```\n1 #include <stdio.h>\n2 #include\
    \ <ctype.h>\n3 \n4 int main()\n5 {\n6 int ch = 'a';\n7 printf(\"Big %c%c\\n\"\
    ,toupper(ch));\n8 printf(\"Little %c%c\\n\",tolower(ch));\n9 printf(\"What begins\
    \ with %c?%c\\n\",ch);\n10 \n11 return(0);\n12 \n13 }\n```\n\n在第 8 行和第 9 行，你看到了\
    \ `toupper` 和 `tolower` 函数。`toupper` 函数生成字母的大写版本。`tolower` 函数生成字母的小写版本。结果被立即用于\
    \ `printf` 函数。请注意，这些函数需要的是整数值，而不是字符。尽管它们是整数变量，你仍然可以在 `printf` 函数中使用 `%c` 来显示结果。编译并运行代码。\n\
    \n正如你从第 10 行最后一个 `printf` 语句的输出所示，`toupper` 和 `tolower` 函数并没有影响变量 `ch`。它们仅仅生成了大写或小写的等效字符。你也可以在字符串上使用这些函数。要做到，你必须在循环中拆解字符串。看下下面的代码：\n\
    \n```\n1 #include <stdio.h>\n2 #include <ctype.h>\n3 int main()\n4 {\n5 int c;\n\
    6 do\n7 {\n8 c = getchar();\n9 c = toupper(c);\n10 putchar(c);\n11 }\n12 while(c\
    \ != '\\n');\n```\n\n再次，在 `toupper` 函数中使用了一个整数变量。输入在第 11 行被处理并转换为大写，然后输出。在按下回车键之前，你不会看到输出，因为\
    \ C 语言是面向流的。编译并运行代码。\n\n放手输入一些文本。按下回车键。输出全是大写，但请注意标点符号和空格不受 `toupper` 函数的影响。`ctype.h`\
