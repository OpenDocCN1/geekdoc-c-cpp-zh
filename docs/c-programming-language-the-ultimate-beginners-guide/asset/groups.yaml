    \ Enter 键。你的 Code Blocks 编辑器现在应该像这样：\n\n```\n1   main() {}\n2\n```\n\n现在，点击 Save（保存）按钮保存源代码文件。如果需要，选择你想保存\
    \ C 编程语言源代码的特定文件夹。为文件输入文件名 \"dummy.c\"。源代码文件现在已创建并保存。接下来，点击 Build 按钮。\n\n代码可以编译。你看到的是被称为“The\
    \ dummy（空程序）”的极简 C 程序。所有的 C 源代码必须有 `main` 函数。这是程序执行开始的地方。`main` 函数的内容被包含在大括号中。\n\
    \n在我们 dummy 源代码中，所有内容都是空的，这没关系。不过，你可能会看到编译器警告，这并不是致命的。程序已创建。点击 Run（运行）按钮运行这个 dummy\
    \ 程序。你会发现没有输出。这是预料中的，因为程序代码没有做任何事情。\n\n像任何语言一样，C 编程语言有几个部分：\n\n- 关键字（Keywords）\n\
    - 函数（Functions）\n- 操作符（Operators）\n- 值和变量（Values and Variables）\n- 结构（Structure）\n\
    \n## 关键字\n\n关键字是 C 语言的语言部分。它们完成非常基础的任务。好消息是，与拥有成千上万单词的英语不同，C 语言只有 44 个单词。在实践中，你可能只会使用其中一半的关键字。\n\
    \n| Alignas | break | float | signed |\n| Alignof | case | for | sizeof |\n| Atomic\
    \ | char | goto | static |\n| Bool | const | if | struct |\n| Complex | continue\
    \ | inline | switch |\n| Generic | default | int | typedef |\n| Imaginary | do\
    \ | long | union |\n| Noretern | double | register | unsigned |\n| Static_assert\
    \ | else | restrict | void |\n| Thread_local | enum | return | volatile |\n| auto\
    \ | extern | short | while |\n\n## 函数\n\nC 语言真正的得力军是函数。关键字所做的事情非常基础。要在 C 中做更多事情，你依赖于函数。函数存储在库中。链接器的工作是将库与你的程序结合。要在程序中使用函数，你必须包含一个头文件（header\
    \ file）。你将在随后的章节中看到是如何操作的。\n\n## 操作符\n\n操作符是用于处理数据的符号。这包括传统的数学操作符以及其他特殊符号。\n\n\
    - 数学：+-*/%&|\n- 比较：!= != < \n- 赋值：+= *=\n- 逻辑：&& || !\n- 位运算：| ^ >>\n- 一元：~ *\n\
    \n## 值和变量\n\n值和变量很相似。值包括字符和数值。数值分为整数（或全数）以及包含小数部分或分数的浮点数。它们都可以是非常非常大的值，也可以是非常小的值。\n\
    \n另一方面，变量是值的容器。它的内容可以改变或变化，这就是为什么它们被称为变量。进入变量的值类型与你直接在程序中使用的值类型相同。\n\n## 结构\n\n\
    C 编程语言的每一个部分都必须按照特定的顺序或方式使用。这就是所谓的 C 编程语言结构。为了辅助控制程序流，C 编程语言使用了预处理器指令（preprocessor\
    \ directives）。每个 C 语言程序中第一个运行的函数是 `main` 函数。`main` 函数是每个 C 语言程序的主要要求。没有它，程序无法编译，更不用运行了。\n\
    \n大括号/括号用于封装函数的内容。在 C 编程语言领域，相当于句子的是“语句”（Statements）。语句包括但不限于 C 函数、关键字、逻辑比较等。\n\
    \n最后，我们有注释（comments）。注释是给其他程序员或以后查看源代码的自己留的笔记。注释作为通用信息或提醒，不会被编译为源代码的一部分。既然你现在有了一些背景知识，让我们利用它来完成我们之前编写的\
    \ dummy.c 编程源代码。\n\n回到 IDE 编辑器中的 dummy.c 程序源代码。`main` 函数被定义为一个整数函数。这意味着它向操作系统返回一个整数值。因此，一些编辑是必要的。在你的编辑器中，在\
    \ \"main\" 单词之前输入 C 语言关键字 \"int\"，并确保空格分隔如下：\n\n```\n1 int main() {}\n2\n\n```\n"
