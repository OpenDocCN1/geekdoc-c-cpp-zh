    4 {\n5 int c;\n6 \n7 printf(\"Type a letter: \");\n8 c = getchar();\n9 printf(\"\
    You typed %c.\\n\", c);\n10 \n11 return(0);\n12 \n13 }\n```\n\nInteger variable\
