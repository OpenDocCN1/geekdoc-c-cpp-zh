    4 {\n5 int c;\n6\n7 printf(\"Type a letter: \");\n8 c = getchar();\n9 printf(\"\
    You typed \");\n10 putchar(c);\n11 putchar('\\'');\n12 printf(\"\\n\");\n13\n\
    14 return(0);\n```\n\nAt line 11, type a single quote, a backslash, a single quote,\
    \ and then another single quote. That looks odd, but you have to escape the single\
    \ quote character. Otherwise, the compiler becomes confused. A second putchar()\
