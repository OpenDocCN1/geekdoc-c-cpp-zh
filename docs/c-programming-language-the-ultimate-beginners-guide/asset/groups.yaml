    You test run the program to see if the program does what it''s intended to do.
    In other words, run it to see if it is working. In the next chapter, we will show
    you a demonstration of how this process works in Code Blocks. We will talk about
    how to create and execute a sample computer program in the C programming language.
    In addition, we will also teach you how to root out and fix bugs in your program
    using the IDE.


    Once youve finished installing Code Blocks in your PC, start it up. You''ll be
    presented with the Code Blocks start page. If by chance you''re working on a computer
    that has Code Blocks already installed, and has been used to create programs previously,
    click on View > Start page on the Code Blocks to see the start page.


    The majority of work done on the Code Blocks IDE is project-oriented. Code Blocks
    language projects can be a small and simple program, or a huge and complicated
    online computer game. Typically, Code Blocks projects are created by clicking
    the New Project link on the start page. Note that this particular step is not
    required whenever you are viewing and on C language project files that are taken
    from a different source other than your own computer.


    But if you need to make a new C language project in the Code Blocks IDE, particularly
    the console programs/applications that we will be using in this book, then select
    the Console Application option when starting a brand new project.


    ![](img/16c76b89fcd0f2321c5160df3bad52e2_10_0.png)


    After choosing Console Application, select the C language option. Type in a name
    for the project and choose a folder where you will be saving the project file.
    On the Mac, ensure that the names don''t have any spaces, else the program can''t
