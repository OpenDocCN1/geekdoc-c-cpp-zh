- md: '

    To open a pre-written source code file in Code Blocks, click the Open button on
    the toolbar. Browse to the folder containing the pre-written source code file.
    Choose the pre-written C file that you want to open and then click “Open”. Then,
    you will see the source code''s in that file in the Code Blocks editor window.


    C code does not include line numbers, but the Code Block editor will show line
    numbers in the left column. Line numbers are not only handy for reference in this
    book, but also great for tracking down errors. The source code itself appears
    on the right hand side of the window. The Text is color-coded, which helps you
    recognize the different parts of C, as well as spot errors when things aren''t
    colored correctly.


    The next step after writing the source code is to compile and link. In Code Blocks,
    that step is combined into a single action called Build. To build your project,
    click the Build icon:


    ![](img/16c76b89fcd0f2321c5160df3bad52e2_11_0.png)


    The action takes place at the bottom of the screen in the Build log, and then
    Build messages tags. If there are errors in your source code, Code Blocks will
    display a small red box right beside the line number where the error resides.
    Click the Build log tab to review the specific messages related to the error.


    The error messages will also indicate which line error resides. If you spot an
    error in your code, rectify them and click the Build button again. Once there
    are no more errors, save the file and re-build the project to make sure everything
    is ok.


    Now, on the Macintosh, you may see a warning option -s. That linker error and
    you can ignore it. Click the Run button to witness the program''s brilliance.
    In Windows, the program runs in a command prompt window. On the Mac and Linux,
    a terminal window appears. In that window, you may also see any startup scripts
    you''ve written. Ignore that part of the output. Otherwise, what you see is the
    program''s output.


    Close the output window and return to Code Blocks. In Windows, press the Enter
    key. If the terminal window does not close in UNIX, just type “Exit” and then
    press the Enter key. It is recommended that you do this. Otherwise, the terminal
    windows will stack up. You’re now ready to create your first project. If you shutdown
    Code Blocks, it will ask you whether or not you want to save the perspective.
    Go ahead and click Yes.


    ## Chapter 2: Staring Your First C Project


    The normal human language has two parts: syntax and speech. Likewise, the C programming
    language also has its own syntax and speech. If a person who has no background
    in computer programming looks at a computer source code, it is likely that they
    won''t be able to make heads or tails out of it. However, once they learn the
    syntax and the figures of speech of the programming language, it will all begin
    to make sense.


    In this book, we will introduce you to syntax and figures of speech of the C programming
    language. We will teach you how it is structured, the main function actually does,
    and also familiarize yourself with its various functions, keywords, variables,
    and operators.


    In the Code Blocks IDE, go ahead and click the "New" button, and then click "Empty
    file." At this point, you''re going to type a C programming language code in the
    editor window of the Code Blocks IDE. Don''t be afraid. You''re going to type
    only one line.


    Go ahead and type the word "main", followed by a pair of parenthesis and a space,
    and then lastly, followed by a pair of curly braces or brackets. Once you finish
    typing that in, press Enter on the keyboard. Your Code Blocks editor should now
    look like this:


    ```

    1   main() {}

    2

    ```


    Now, save the source code file by clicking the Save button. If you need to, choose
    the specific folder where you want to save your C programming language source
    code. Type the filename "dummy.c" for the file. The source code file is now created
    and saved. Next, click the Build button.


    The code does compile. What you see is the absolute minimum C program known as
    "The dummy." All C source code must have the main function. This is where the
    program execution starts. The contents of the main function are enclosed in curly
    brackets.


    In our dummy source code, everything is empty, which is okay. However, you might
    see a compiler warning, which isn''t critical. A program was created. Click the
    Run button to run the dummy program. You will notice that there is no output.
    That is to be expected because the program code does nothing.


    Like any language, the C programming language has several parts:


    - Keywords

    - Functions

    - Operators

    - Values and Variables

    - Structure


    ## Keywords


    The keywords are the language part of the C language. They accomplish very basic
    tasks. The good news is that, unlike English which has tens of thousands of words,
    there are only 44 words in the C language. In practice, you may only use about
    half of these keywords.


    | Alignas | break | float | signed |

    | Alignof | case | for | sizeof |

    | Atomic | char | goto | static |

    | Bool | const | if | struct |

    | Complex | continue | inline | switch |

    | Generic | default | int | typedef |

    | Imaginary | do | long | union |

    | Noretern | double | register | unsigned |

    | Static_assert | else | restrict | void |

    | Thread_local | enum | return | volatile |

    | auto | extern | short | while |


    ## Functions


    The real workhorses of the C language are functions. What the keywords do is really
    basic. To do more in C, you rely upon a function. The functions are held in libraries.
    The linker''s job is to combine the library with your program. To use a function
    in a program, you must incorporate a header file. You will see how that is done
    in the later chapters.


    ## Operators


    Operators are symbols used to manipulate data. These include the traditional math
    operators as well as other special symbols.


    - Mathematical: +-*/%&|

    - Comparison: != != <

    - Assignment: += *=

    - Logical: && || !

    - Bitwise: | ^ >>

    - Unary: ~ *


    ## Values and Variables


    Values and variables are similar. Values include characters and numeric values.
    The numeric values are divided between integers or whole numbers, and floating-point
    values which contain a decimal part or fraction. All of them can be very, large
    values, or very small values.


    A variable, on the other hand, is a container for a value. Its contents can change
    or vary, which is why they are called variables. The values that go into the variables
    are the same types of values you use directly in a program.


    ## Structure


    Every piece of the C programming language must be utilized in a particular order
    or manner. This is what''s called the C programming language structure. To assist
    in controlling the program flow, the C programming language makes use of preprocessor
    directives. The first function that is run in every C language program is the
