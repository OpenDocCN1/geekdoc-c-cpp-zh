    # Introduction


    Thank you for buying this book: The C Programming Language – The Ultimate Beginner’s
    Guide. In this book, we are going to give you an overview of the concepts that
    you have to understand before you actually start programming in the C language.
    We will explain to you the different elements that you ought to know about before
    you go and delve into developing more complex programs for different operating
    systems.


    The C programming language has many benefits. However, it also has numerous little
    aspects that can leave you perplexed. Not being able to understand these aspects
    can definitely cause you problems in the future.


    In this book, we''re going to talk about what those elements are. We are also
    going to talk about what C is, where it came from, and all of the fundamental
    concepts that you have to understand before you actually start programming. In
    addition, we''ll also teach you how to set up and use the Code Blocks IDE, which
    will help you greatly when programming in the C language.


    We hope you enjoy this book.


    # Chapter 1: Introduction to C Programming Language


    Like anything new when you set out to do programming, you find yourself surrounded
    with strange and potentially weird terms, and fancied jargon. In this book, we''ll
    review those terms as well as present an overview of the entire programming process.
    It is very likely you''re eager to get started with writing codes, and you may
    have already viewed a later chapter in this book. It is important to know a few
    terms and programming concepts.


    ## History of C Programming Language


    Back in 1972, a computer scientist at AT&T''s Bell Laboratories started to develop
    some programs needed for his own use. What Dennis Ritchie started developing then
    has evolved into the C programming language, which by now is widely used around
    the world.


    He was trying to make computing as simple as possible. Dennis Ritchie realized
    that the then-current assembly language were much too complex. They attempted
    to reverse this trend by building a small, simple programming language on a minicomputer.


    What Dennis Ritchie wanted to maintain was not only an efficient computer programming
    language in which to create programs, but also a computer programming language
    around which programming community could form—fellowship. They knew from previous
    experiences that the real nature of joint computing as provided by time-shared,
    remote access systems is not just to enter execute code into a terminal, but to
    motivate post-communication.


    The C language is a general purpose and structured programming language. It is
    also called a procedural oriented programming language.


    C is not specifically designed for specific application areas. However, it was
    well suited for business and scientific applications. It has various features
    like control structures, looping statements, and macros required for applications.
    The C language has the following features:


    - Portability

    - Flexibility

    - Effectiveness and Efficiency

    - Reliability

    - Interactivity


    ## What is Programming?


    Programming is where you create software. Software controls hardware, which is
    the physical part of an electronic device such as a computer, phone, tablet, gaming
    console, micro-controller or some other gizmo. These instructions take the form
    of a programming language.


    The C programming language has many benefits. However, it also also numerous numerous
    little aspects that can leave you perplexed.


    In this book, we''re going to talk about what those elements are. We are also
    going to talk about what C is, where it came from, and all of the fundamental
    concepts that you have to understand before you actually start programming. In
    addition, we''ll also teach you how to setup and use the Code Blocks IDE, which
    will help you greatly when programming in the C language.


    ## What is Source code?


    ## What is an IDE?


    An IDE, or Integrated Development Environment, combines the tools for editing,
    compiling, and running. It also adds tools for debugging, creating complex programs,
    graphical tools.


    Beneath it, however, is the command line compiler and linker. The process is the
    same: edit, compile and link. You are going to do a lot of repeating and re-working
    before you get right.


    The good news is that all the tools you need to begin your journey are free on
    the internet. The bad news is that you have to find the tools and install them
    properly. This is not an issue for you because in this book, we''ll show you how
    to do it.


    You will see how to find a good IDE, or Integrated Development Environment, a
    C language compiler, and everything set and configured.

    '
