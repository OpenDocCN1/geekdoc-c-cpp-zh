    \ take a look at the code below to see a demonstration:\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    int a, b;\n    a = 7;\n    while(a < 30)\n    {\n        b\
    \ = a % 7; /* b equals a mode 7 */\n        printf(\"%d %% 7 = %d\\n\",a,b);\n\
    \        a++;\n    }\n    return(0);\n```\n\nWe're making use of a C program to\
    \ teach you C. The while loop marches through the values 7 through 30. It shows\
    \ you how the modulus operator affects each of those values. Build and run the\
    \ code.\n\nThe modulus operator gives you a remainder. For example, 10 % 7 yields\
    \ 3. That's because 7 goes into 10 once, but with 3 remainders. You can see how\
    \ the value is always going to be between 0 and 6 for mod, no matter what the\
    \ initial value is used.\n\nNow in the code below, edit the value of line 15 so\
    \ that the printf function displays the value of r % 100.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n#include <time.h>\nint main()\n{\n    int x, r;\n    srand((unsigned)time(NULL));\
    \ /*Seed randomizer */\nx = 10;\nwhile(x > 0)\n{\n    r = rand();\n    printf(\"\
    %d\\n\", r % 100);\n    x--;\n}\nreturn(0);\n```\n\nThis change limits the output\
    \ to values between 0 and 99. Save, build, and run the code. You may see some\
    \ single digits in there. The single digits don't really look properly formatted.\
    \ To line up the numbers, you can edit the printf statement to insert a '2' in\
    \ the %d placeholder.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <time.h>\n\nint main()\n{\n    int x, r;\n\n    srand((unsigned)time(NULL));\
    \ /*Seed randomizer */\n\n    x = 10;\n    while(x > 0)\n    {\n        r = rand();\n\
    \        printf(\"%2d\\n\", r % 100);\n        x--;\n    }\n    return(0);\n```\n\
    \nThe '2' sets the width of integer output to two characters wide, right justified.\
    \ Save, build and run the code. Now you'll see a single digit, but it is lined\
    \ up on the right, which actually looks more pleasing.\n\n# Do/While Loop\n\n\
    Another type of loop is the Do/While loop. It is a kind of an upside down while\
    \ loop, but it guarantees that the loop always executes least once. Take a look\
    \ at the code below:\n\n```c\n#include <stdio.h>\nint main() {\n    char ch;\n\
    \    ch = 'A';\n    do {\n        putchar(ch);\n        ch++;\n    } while (ch\
    \ != 'z');\n    putchar('\\n');\n    return(0);\n}\n```\n\nThe Do/While loop starts\
    \ at line 9 with a Do statement. It has no condition. Instead, the statements\
    \ are executed one after the other. The while condition appears at line 14. The\
    \ loop relies on variable ch as its condition. Variable is initialized at line\
    \ 7, and then manipulated in line 12. Build and run the code.\n\nThe 'z' isn't\
    \ printed because it is an exit condition. If you want to see the 'z,' you need\
    \ to save the exit condition to 'z + 1' like so:\n\n```c\n#include <stdio.h>\n\
    int main() {\n    char ch;\n    ch = 'A';\n9 do\n10 {\n11 putchar(ch);\n12 ch++;\n\
    13 }\n14 while (ch != 'z'+1);\n15\n16 putchar('\\n');\n18 return(0);\n19 }\n20\n\
    ```\n\nSave and run the code. This code below demonstrates an endless loop. There\
    \ is no exit condition because the while loop's evaluation is always one.\n\n\
    ```c\n1 #include <stdio.h>\n2\n3 int main()\n4 {\n5 while(1)\n6 {\n7 printf(\"\
    I'm endlessly looping!\");\n8 }\n9\n10 return(0);\n11 }\n```\n\nBuild and run\
    \ the code. Press Ctrl + C to cancel the program and stop the madness. Now, endless\
    \ loops have their place, but most are unintentional. You can, however, fix the\
    \ loop by using the break statement at line 8 of the code above like so: \n\n\
    ```c\n1 #include <stdio.h>\n2\n3 int main()\n4 {\n5 while(1)\n6 {\n7 printf(\"\
    I'm endlessly looping!\");\n8 break;\n9\n10 return(0);\n11 }\n12 }\n```\n\nDon’t\
    \ forget the semi-colon at the end of the break statement. Save, build and run\
    \ the code. The loop spins only once because the break statement busts out of\
    \ it. You can even use a break to out of a loop prematurely.\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    int a = 0;\n    while(1) {\n        puts(\"\
    Here I go...\");\n        a++;\n        if(a>10)\n            break;\n    }\n\
    \    return(0);\n}\n```\n\nThe while loop’s condition is infinite, and it cannot\
    \ change. The variable a is used to monitor the iterations. Once a is greater\
    \ than 10, the loop busts. Of course, a better solution would be to evaluate variable\
    \ a at the while loop’s parenthesis. That’s something you can try on your own.\n\
    \n# The For keyword\n\nThe for keyword is used for creating loops in your C code.\
    \ Unlike the while loop, the for loop is setup on a single line, which makes it\
    \ more popular, or perhaps more traditional type of loop.\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int x;\n    for(x=0;x<10;x++)\n        printf(\"%d\\n\",x);\n\
    10 return(0);\n11 }\n```\n\nIn this section, we discuss the for loop. We will\
    \ see how to setup the loop, and understand its parts. A for loop is presented\
    \ at line 7. The loop's statement contains three parts, each separated by a semicolon.\n\
    \nFirst is the initialization. The statement is 'x=0,' which is an assignment\
    \ made at the start of the loop. Second is the looping condition. The loop repeats\
    \ as this condition is true: x<10. Finally, the iteration statement. Each time\
    \ the loop repeats, this statement is executed. Here, the value of x is incremented.\n\
    \nThe semicolon doesn't follow the for statement's parenthesis. Instead, the semicolon\
    \ follows a single statement, which is shown at line 8, a series of statements\
    \ enclosed in curly brackets. Build and run the code. The values 0 through 9 are\
    \ output. In C programming, you start counting at 0, not 1. To fix the loop for\
    \ the human's eyes, change the printf statement at line 8 to read:\n\n```c\n1\
    \ #include <stdio.h>\n2 \n3 int main(){\n4 {\n5 int x;\n6 \n7 for(x=0;x<10;x++)\n\
    8 printf(\"%d\\n\",x+1);\n9 \n10 return(0);\n11 }\n```\n\nThis modification doesn't\
    \ change the value of x, only the output. Save, build and run the code.\n\n# The\
    \ Nested Loop\n\nThe one thing that's great with a for loop is that you can make\
    \ use the concept of a nested loop. This is easier than using a while loop in\
    \ C language. In this section, we'll talk about how to make a nested loop, as\
    \ well as to avoid the common pitfalls programmers encounter in the C language.\
    \ Take a look at the code below:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <time.h>\n\nint main() \n{\n    int column, r;\n    srand((unsigned)time(NULL));\
    \ /* Seed Randomizer */\n    for(column=0;column<10;column++) {\n        r = rand();\n\
    \        printf(\"%2d\\t\", r % 100);\n    }\n    putchar('\\n');\n    return(0);\n\
    }\n```\n\nThe sample code that we have outputs randomly selected numbers. Build\
    \ and run this code. As you can see from the output, there's now a row of ten\
    \ selected values. The spacing that's present in each value is attained by making\
    \ use of the tab character \"\\t,\" which is at line 14 of the code.\n\nNow, let's\
    \ go ahead and try to make a 100 value grid. In addition to the single row of\
    \ ten values we already have, we need to create nine more rows of ten values.\
    \ To accomplish this, most C programmers use the nested loop, or a secondary for\
    \ loop that repeats the output ten more times. Take a look at the code below:\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main()\
    \ \n{\n    int row, column, r;\n    srand((unsigned)time(NULL)); /* Seed Randomizer\
    \ */\n    for(row=0;row<10;row++) {\n        for(column=0;column<10;column++)\
    \ {\n            r = rand();\n            printf(\"%02d\\t\",r % 100);\n     \
    \   }\n        putchar('\\n');\n    }\n    return(0);\n}\n```\n\nThe code above\
    \ is a modified version of the code that we used earlier. It now has an extra\
    \ loop. The column loop, which was the old loop, is now nested within a new loop\
    \ called the row loop. The indentation that you see in the code is for readability—it\
    \ helps match up the curly brackets of each statement. Build and run this code.\
    \ As you can see, you now have a grid of 100 randomly selected values. Take a\
    \ look at the code below:\n\n```c\n#include <stdio.h>\n\nint main() {\n    int\
    \ alpha, numeric;\n\n    for(alpha='A';alpha<'K';alpha++) {\n        for(numeric=0;numeric<10;numeric++)\
    \ {\n            printf(\"%c%0d\\t\",alpha,numeric);\n            putchar('\\\
    n');\n        }\n    }\n    return(0);\n}\n```\n\nThe nested loop that you see\
    \ above might be a little bit easier to read. The outer alpha loop sweeps through\
    \ letters A through J; K is the limit. The inner loop loops from 0 to 9. You'll\
    \ also notice that this inner loop does not make use of any curly brackets since\
    \ it only contains one statement. At line 11, the loop variables are displayed.\
    \ Build and run this code.\n"
  mdcn: "\n这段代码使用了上一章介绍的 `srand` 和 `rand` 函数。这些函数用于生成随机数。在这种情况下，一个 `while` 循环显示了十个数字。编译并运行代码。现在，让我们讨论两个清理这些数字的技巧。\n\
    \n第一个是模运算符，符号为百分号 `%`。模运算计算数值的余数，就像处理剩余物。事实上，请看下面的代码演示：\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    int a, b;\n    a = 7;\n    while(a < 30)\n    {\n        b\
    \ = a % 7; /* b equals a mode 7 */\n        printf(\"%d %% 7 = %d\\n\",a,b);\n\
    \        a++;\n    }\n    return(0);\n```\n\n我们正在利用一个 C 程序来教你学习 C。`while` 循环遍历了从\
    \ 7 到 30 的值。它向你展示了模运算符如何影响这些值。编译并运行代码。\n\n模运算符给你一个余数。例如，`10 % 7` 得到 3。这是因为 7 除以\
    \ 10 一次，余数为 3。你可以看到，无论初始值是什么，模运算的结果始终介于 0 和 6 之间。\n\n现在，在下面的代码中，修改第 15 行的值，使 `printf`\
    \ 函数显示 `r % 100` 的值。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <time.h>\nint main()\n{\n    int x, r;\n    srand((unsigned)time(NULL)); /*Seed\
    \ randomizer */\nx = 10;\nwhile(x > 0)\n{\n    r = rand();\n    printf(\"%d\\\
    n\", r % 100);\n    x--;\n}\nreturn(0);\n```\n\n此更改将输出限制在 0 到 99 之间的值。保存、编译并运行代码。你可能会看到一些一位数。这些一位数看起来格式并不正确。为了对齐数字，你可以编辑\
    \ `printf` 语句，在 `%d` 占位符中插入一个 '2'。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <time.h>\n\nint main()\n{\n    int x, r;\n\n    srand((unsigned)time(NULL));\
    \ /*Seed randomizer */\n\n    x = 10;\n    while(x > 0)\n    {\n        r = rand();\n\
    \        printf(\"%2d\\n\", r % 100);\n        x--;\n    }\n    return(0);\n```\n\
    \n'2' 将整数输出的宽度设置为两个字符宽，并右对齐。保存、编译并运行代码。现在你会看到一位数，但它是右对齐的，这实际上更美观。\n\n# Do/While\
    \ 循环\n\n另一种循环是 `Do/While` 循环。它是一种倒置的 `while` 循环，但它保证循环至少执行一次。请看下面的代码：\n\n```c\n\
    #include <stdio.h>\nint main() {\n    char ch;\n    ch = 'A';\n    do {\n    \
    \    putchar(ch);\n        ch++;\n    } while (ch != 'z');\n    putchar('\\n');\n\
    \    return(0);\n}\n```\n\n`Do/While` 循环从第 9 行的 `Do` 语句开始。它没有条件。相反，语句是一个接一个执行的。`while`\
    \ 条件出现在第 14 行。循环依赖变量 `ch` 作为其条件。变量在第 7 行初始化，然后在第 12 行进行操纵。编译并运行代码。\n\n'z' 没有被打印，因为它是退出条件。如果你想看到\
    \ 'z'，你需要将退出条件保存为 'z + 1'，如下所示：\n\n```c\n#include <stdio.h>\nint main() {\n  \
    \  char ch;\n    ch = 'A';\n9 do\n10 {\n11 putchar(ch);\n12 ch++;\n13 }\n14 while\
    \ (ch != 'z'+1);\n15\n16 putchar('\\n');\n18 return(0);\n19 }\n20\n```\n\n保存并运行代码。下面的代码演示了一个无限循环。没有退出条件，因为\
    \ `while` 循环的求值结果始终为真（1）。\n\n```c\n1 #include <stdio.h>\n2\n3 int main()\n4 {\n\
    5 while(1)\n6 {\n7 printf(\"I'm endlessly looping!\");\n8 }\n9\n10 return(0);\n\
    11 }\n```\n\n编译并运行代码。按 Ctrl + C 取消程序并停止这种疯狂。现在，无限循环有其用处，但大多数是无意的。不过，你可以使用上面代码第\
    \ 8 行的 `break` 语句来修复循环，如下所示：\n\n```c\n1 #include <stdio.h>\n2\n3 int main()\n\
    4 {\n5 while(1)\n6 {\n7 printf(\"I'm endlessly looping!\");\n8 break;\n9\n10 return(0);\n\
    11 }\n12 }\n```\n\n不要忘记 `break` 语句结尾的分号。保存、编译并运行代码。循环只旋转了一次，因为 `break` 语句跳出了。你甚至可以使用\
    \ `break` 提前退出循环。\n\n```c\n1 #include <stdio.h>\n2\n3 int main()\n4 {\n5 while(1)\n\
    6 {\n7 printf(\"I'm endlessly looping!\");\n8 break;\n9\n10 return(0);\n11 }\n\
    12 }\n```\n\n`while` 循环的条件是无限的且无法改变。变量 `a` 用于监控迭代。一旦 `a` 大于 10，循环跳出。当然，更好的解决方案是在\
    \ `while` 循环的括号内求值变量 `a`。\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int\
    \ a = 0;\n    while(1) {\n        puts(\"Here I go...\");\n        a++;\n    \
    \    if(a>10)\n            break;\n    }\n    return(0);\n}\n\n# For 关键字\n\n`for`\
    \ 关键字用于在 C 代码中创建循环。与 `while` 循环不同，`for` 循环在一行内设置，这使其更流行，或者说是更传统的循环类型。\n\n```c\n\
    #include <stdio.h>\n\nint main()\n{\n    int x;\n    for(x=0;x<10;x++)\n     \
    \   printf(\"%d\\n\",x);\n10 }\n```\n\n在本节中，我们将讨论 `for` 循环。我们将看到如何设置循环并理解它的部分。`for`\
    \ 循环位于第 7 行。循环语句包含三个部分，每个部分由分号隔开。\n\n首先是初始化。语句 `x=0` 在循环开始时赋值。第二是循环条件。当条件为真时循环重复：`x<10`。最后是迭代语句。每次循环重复时都会执行该语句。在这里，`x`\
    \ 的值增加了。\n\n分号跟在 `for` 语句的括号后面。相反，分号跟在第 8 行显示的单个语句后面，在大括号内。编译并运行代码。输出 0 到 9 的值。在\
    \ C 编程中，你从 0 开始计数而不是 1。为了人类视觉，修改第 8 行的 `printf` 语句：\n\n```c\n1 #include <stdio.h>\n\
    2 \n3 int main(){\n4 {\n5 int x;\n6 \n7 for(x=0;x<10;x++)\n8 printf(\"%d\\n\"\
    ,x+1);\n9 \n10 return(0);\n11 }\n```\n\n此修改没有改变 `x` 的值，只改变了输出。保存、编译并运行代码。\n\n\
    # 嵌套循环\n\n`for` 循环的一个大优点是你可以使用嵌套循环的概念。这在 C 语言中比 `while` 循环更容易。在本节中，我们将讨论如何制作嵌套循环，以及避免程序员在\
    \ C 语言中遇到的常见陷阱。请看下面的代码：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <time.h>\n\nint main() \n{\n    int column, r;\n    srand((unsigned)time(NULL));\
    \ /* Seed Randomizer */\n    for(column=0;column<10;column++) {\n        r = rand();\n\
    \        printf(\"%2d\\t\", r % 100);\n    }\n    putchar('\\n');\n}\n```\n\n\
    示例代码输出随机选择的数字。编译并运行此代码。从输出中可以看出，现在有一行十个数值。每个值中的空格是通过使用第 14 行的制表符 `\"\\t\"` 实现的。\n\
    \n现在，让我们尝试创建一个100个值的网格。除了我们已有的十个数值行，我们还需要创建九行十个数值。为了实现这一点，大多数 C 程序员使用嵌套循环，或者说是重复输出十次的二次\
    \ `for` 循环。请看下面的代码：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <time.h>\n\nint main() \n{\n    int row, column, r;\n    srand((unsigned)time(NULL));\
    \ /* Seed Randomizer */\n    for(row=0;row<10;row++) {\n        for(column=0;column<10;column++)\
    \ {\n            r = rand();\n            printf(\"%02d\\t\",r % 100);\n     \
    \   }\n        putchar('\\n');\n    }\n    return(0);\n}\n```上面的代码是我们之前使用的代码的修改版本。它现在有一个额外的循环。旧的\
    \ `column` 循环现在嵌套在一个名为 `row` 循环的新循环中。你在代码中看到的缩是为了是为了读性——它有助于匹配每个语句的大括号。编译并运行此代码。如你所见，你现在有一个100个随机选择值的网格。请看下面的代码：\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    int alpha, numeric;\n\n    for(alpha='A';alpha<'K';alpha++)\
    \ {\n        for(numeric=0;numeric<10;numeric++) {\n            printf(\"%c%0d\\\
    t\",alpha,numeric);\n            putchar('\\n');\n        }\n    }\n    return(0);\n\
    }\n```\n\n你上面看到的嵌套循环可能更容易读一点。外层 `alpha` 循环遍历字母 A 到 J；K 是限制。内部循环从 0 循环到 9。你还会注意到这个内部循环没有使用任何大括号，因为它只包含一条语句。在第\
    \ 11 行，显示了循环变量。编译并运行代码。\n"
