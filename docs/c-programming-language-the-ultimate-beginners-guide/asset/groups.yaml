    # # Chapter 10: C Language Constants


    Occasionally, when learning something specifically, you need to pause and reflect.
    That''s the topic of this section: pausing and reflecting specifically, with regards
    to variables and values. We''ll also introduce a few new concepts—things we feel
    it''s about time you know, especially if you''re new to the C programming language.
    In this section we will creating and using constants. Plus, we''ll also discuss
    some of the `printf` function''s placeholders.


    A constant in the C language is different from an immediate value and a variable.
    It is more like a universal value that doesn''t change throughout the code. Constants
    are used consistently throughout your source code.


    There are things that do not change. They are created by the preprocessor #define
    directive. Normally the constant is written in all caps, one word or with underscores.
    When the compiler encounters a constant, it expands it to its assigned value.


    In the example, the constant `version` is created and it assigned to the value
    3. The compiler converts the word version to the immediate value 3 throughout
    the code.


    ```

    #define VERSION 3

    * Constant is named VERSION

    * Has a value of 3

    * Does not end with a semi-colon

    ```


    Remember, preprocessor directives are not C language statements. Do not put a
    semi-colon after the assignment, unless you need the to be a part of whatever
    is being defined, which hardly happens. Just''t add a semi-colon.


    Below is a string constant defined as `AUTHOR`. The string must be enclosed in
    double quotes. This is an example of one constant that two other constants to
    calculate its value.


    ```

    #define AUTHOR "Adolf Hitler"

    * The constant is named AUTHOR

    * The value is the string "Adolf Hitler."

    * No semi-colon is used.

    ```


    Below, the `GAME_GRID` would equal 120, unless either the `ROWS` or `COLUMNS`
    constants are changed. They wouldn''t be changed in the code. They would be changed
    in the define statement that see below:


    ```

    #define ROWS 20

    #define COLUMNS 60

    #define GAME_GRID ROWS*COLUMNS

    * Three constants are created: ROWS, COLUMNS, and GAME_GRID

    * The value of GAME_GRID is based on the product of constants ROWS and COLUMNS.

    ```'
