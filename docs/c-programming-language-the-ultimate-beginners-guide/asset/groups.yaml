    {\n    char x, y, z;\n    x = 'A';\n    y = 'B';\n    z = 'C';\n    printf(\"\
    It's as easy as %c%c%c\\n\", x,y,z);\n    return(0);\n}\n```\n\nHere, three character\
    \ variables are declared: x, y, and z. You can declare variables of the same type\
    \ on a single line, as long as each variable name is separated by comma. Lines\
    \ 7-9 assign the variables—single quotes are used. Then the values are displayed\
    \ by the printf function at eleven. Save, build, and run the code.\n\nJust as\
    \ you can change integer variables, can also change character variables. You can\
    \ even do math. Edit line to read:\n\n```c\n#include <stdio.h>\nint main()\n{\n\
    \    char x, y, z;\n    x = 'A';\n    y = x+1;\n    z = 'C';\n    printf(\"It's\
    \ as easy as %c%c%c\\n\", x,y,z);\n    return(0);\n}\n```\n\nThen, edit line nine\
    \ to read:\n\n```c\n#include <stdio.h>\nint main()\n{\n    char x, y, z;\n   \
    \ x = 'A';\n    y = x+1;\n    z = y+1;\n    printf(\"It's as easy as %c%c%c\\\
    n\", x,y,z);\n    return(0);\n}\n```\n\nSave, build and run the code. The output\
    \ is the same. Instead of assigning immediate values to variables y and z, you\
    \ did a little character math. Adding 1 to the value of character A gives you\
    \ a B, and adding 1 to the value of B gives you a C.\n\nThe final variable type\
    \ that we would like to introduce is the float. It holds large values, very small\
    \ values, or any values with a fractional part. Take a look at the code below:\n\
    \n```c\n#include <stdio.h>\nint main()\n{\n    float pi;\n    pi = 22.0 / 7.0;\n\
    \    printf(\"The calculated PI as %f\\n\", pi);\n    return(0);\n}\n```\n\nThe\
    \ float variable pi is declared at line five. At line seven, a calculation is\
    \ made and the result is assigned to the variable pi. The calculation uses floating\
    \ point values. By adding .00 to 22 and 7, the compiler assumes that you need\
    \ floating point values and treats them as such. Otherwise, integers would be\
    \ used, and the result would be wrong.\n\nWhen you use a floating point number,\
    \ remember to add the .00. Line eight sends the result to standard output. The\
    \ %f placeholder is used to represent floating point values in a printf statement.\
    \ Build and run the code.\n\nThe value generated for pi is accurate down to the\
    \ hundreds place, which is okay for quite a few things in antiquity, but not acceptable\
    \ for modern calculations.\n"
