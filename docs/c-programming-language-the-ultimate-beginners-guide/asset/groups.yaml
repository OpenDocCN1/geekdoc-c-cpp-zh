  mdcn: "\n\n## 第 5 章：C 中的字符 I/O 函数\n\n程序以输入和输出而闻名。输出到标准输出设备，通常是屏幕或终端窗口。输入来自标准输入设备，通常是键盘。在本章中，我们将探索\
    \ C 语言中的输入和输出概念。这些概念涉及字符 I/O，即单个字符的读取，以及单个字符的输出。我们还将触及流输入和输出的概念。\n\n两种常用的 C 语言字符\
    \ I/O 函数是 `getchar()` 和 `putchar()`。`getchar()` 获取标准输入。这两个函数都需要包含 `stdio.h` 头文件以获取它们的原型等等信息。\n\
    \n尽管它们是字符函数，但它们处理的是整数值。是的，这听起来很奇怪，但 C 语言中的很多事情都是如此。事实上，你可能会发现自己频繁地在这些函数中使用 `char`\
    \ 变量。当你这样做时，编译器可能会温和地提醒你这个错误。最后，这些函数是面向流的，这是我们将在后面的章节中讨论的内容。\n\n看这段代码：\n\n```c\n\
    1 #include <stdio.h>\n2 \n3 int main()\n4 {\n5 int c;\n6 \n7 printf(\"Type a letter:\
    \ \");\n8 c = getchar();\n9 printf(\"You typed %c.\\n\", c);\n10 \n11 return(0);\n\
    12 \n13 }\n```\n\n整数变量 `c` 在第 5 行定义。它在第 8 行配合 `getchar()` 函数使用，从输入流中存储单个字符。在这个示例中，那将是键盘输入的字符。该字符在第\
    \ 9 行显示。使用了 `int` 变量 `c`，但指定了字符占位符 `%c`。这确保显示的是字符，而不是它的代码值。编译并运行代码。\n\n注意输出中的提示符将光标保持在同一行，我们添加了一个空格使其更具读性。输入一个字母，例如大写字母\
    \ 'Z'，然后按回车键。如你在输出中所所示，它会立即指明你输入的字母。\n\n现在，修改代码让 `putchar()` 函数输出你输入的字符。要做到这一点，你需要将\
    \ `printf` 函数拆分为两部分，如下：\n\n```c\n1 #include <stdio.h>\n2\n3 int main()\n4 {\n\
    5 int c;\n6\n7 printf(\"Type a letter: \");\n8 c = getchar();\n9 printf(\"You\
    \ typed \");\n10 putchar(c);\n11 printf(\"\\n\");\n12\n13\n14 return(0);\n15 }\n\
    ```\n\n将内容修改为 \"You typed\"，并注意我们在该字符串后保留了那个单引号。在括号中关闭字符串并用分号结束语句。然后在在第 10 行添加\
    \ `putchar()`，然后使用 `printf` 显示字符串的结果。参数 `c` 不再需要了。相反，它出现在第 10 行的 `putchar()` 函数中并被直接输出。保存、编译并运行源代码。\n\
    \n解决方案提供了 `putchar()` 函数生成输出。但它让代码变得更长且可读性降低。这在 C 语言中是可以的，你会发现输出没有变化。保存、编译并运行代码。\n\
    \n你也可以对立即值使用 `putchar()` 函数。在代码的这一点，第 11 行的语句实际上只输出了三个字符：单引号、句号和换行符。我们可以将第 11\
