    \ main() {\n    struct record {\n        int account;\n        float balance;\n\
    \    };\n    return(0);\n}\n```\n\nThe keyword struct is followed by the name\
    \ of the structure. In this case, the name is 'record'. The structure members\
    \ are contained in curly brackets; each ending with a semi-colon because the whole\
    \ deal is a statement. The structure members are variable declarations. Inside\
    \ this structure, you'll find an int and a float member. The int member is named\
