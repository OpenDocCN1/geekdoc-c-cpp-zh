    \ of the variable. It is a container into which you can store values—values that\
    \ are unknown or values that can change.\n\nYou'll see how to declare a variable\
    \ in the C language, and how a variable is used in the code. A variable is a container\
    \ for a value. Because C deals with different types of values, a variable must\
    \ be declared as a specific type. It is given a name—a name that's used in the\
    \ code.\n\nIn C, the variable type matches the content—the type of value being\
    \ stored. Integer variables can hold only integer values or whole numbers. Float\
    \ variables floating-point values, which are very large numbers, very small numbers,\
    \ and numbers with a fractional part.\n\nCharacter variables hold single values\
