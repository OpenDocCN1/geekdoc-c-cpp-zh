  md: "# Example Guidelines\n\n+   - Avoid “surprising” behavior:\n  - JSF AV Rule\
    \ 177: User-defined conversion functions should be avoided.\n  - Prevents unexpected\
    \ implicit conversions.\n  - MISRA C++ Rule 5-0-1: The value of an expression\
    \ shall be the same under any order of evaluation that the standard permits.\n\
    \  - Prevents compiler- or optimization-dependent behavior.\n  - High Integrity\
    \ C++ Rule 3.3.14: Declare the copy assignment operator protected in an abstract\
    \ class.\n  - Prevents partial assignments to derived objects via base class pointers/references."
