  md: '# # LIFO Heap Allocation


    Dynamic allocation is strictly LIFO (like a stack).


    ![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_103_0.png)


    Easy way to implement a "union" for multiple-mode operations:


    +   - E.g., a system in "normal" or "diagnostic" mode.

    - Static allocation requires the *sum* of the two modes'' memory needs.


    | Normal Mode | Diagnostic Mode |

    |--- |--- |

    | Normal or Diagnostic Mode |


    +   - LIFO allocation only the *maximum* of the modes'' needs.


    LIFO allocation/deallocation is fast in its own right, but another speed benefit
    is that an allocation following a deallocation is likely to refer to memory that
    is already in the data cache.

    LIFO allocation (a natural candidate for region allocation) is good in video games,
    each level can reuse the same memory for its LIFO heap.'
