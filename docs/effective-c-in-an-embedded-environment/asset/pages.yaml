  md: '# "Embedded Systems"


    Embedded systems using C++ are diverse:


    +   - Real-time? Maybe.

    - Safety-critical? Maybe.

    - Challenging memory limitations? Maybe.

    - Challenging CPU limitations? Maybe.

    - No heap? Maybe.

    - No OS? Maybe.

    - Multiple threads or tasks? Maybe.

    - “Old” or “weak” compilers, Maybe.

    - No hard drive? Often.

    - Difficult to field-upgrade? Typically.


    The goal of this slide is to get people to recognize their view about what it
    means to develop for embedded systems may not be the same as others’ views. The
    first time I taught this class, I had one person writing code for a 4-bit microprocessor
    in a digital camera (i.e., a mass-market consumer device), and I also had a team
    writing real-time radar analysis software to be used in military fighter planes.
    The latter would have a very limited production run, and if the developers needed
    more CPU or memory, they simply added a new board to the system. Both applications
    were “embedded,” but they had almost nothing in common.]'
  merge: -1
  pgno: 9
