    \ sz) throw ( ); // ditto\nprivate:\n    union Node {\\ // pool element\n    \
    \    unsigned char data[ElementSize]; // when in use\n        Node *next; // on\
    \ free list\n    };\n    Node *freeList;\n};\n```\n\n+   - Pointer data member\
