    \ Individual bits may sometimes be read-only, other times write-only.\n- Clearing\
    \ a bit may require assigning a 1 to it.\n- One status register may control more\
    \ than one data register.\n  - E.g., bits 0-3 are for one data register, bits\
    \ 4-7 for another.\n\nWhat follows is a framework for modeling memory-mapped IO,\
    \ not a prescription.\n\n+   - The framework tells you where to put whatever special\
