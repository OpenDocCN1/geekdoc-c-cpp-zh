  md: "# Implementing Virtual Functions\n\nConsider this class:\n\n```\nclass B {\n\
    public:\n    B();\n    virtual ~B();\n    virtual void f1();\n    virtual int\
    \ f2(char c) const;\n    virtual void f3(int x) = 0;\n\n    void f4() const;\n\
    \    ..\n}\n```\n\nCompilers typically number the virtual functions in the order\
    \ in which they're declared. In this example,\n\n+   - The destructor is number\
    \ 0\n- f1 is number 1, f2 is number 2, f3 is number 3\n\nNonvirtual functions\
