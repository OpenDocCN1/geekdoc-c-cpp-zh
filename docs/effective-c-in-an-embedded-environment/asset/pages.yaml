- img_proc: true
  md: "# Efficiency\n\n+   - Choose header set at build time.\n- Using checking headers\
    \ catches all errors.\n- Using no-op headers generates optimal code.\n- Clean\
    \ compilation with checking headers ⇒ no unit errors:\n- No-op headers can then\
    \ safely be used.\n  - E.g., velocity-acceleration errors can't exist in code.\n\
    \nCaveats:\n\n+   double computeValue(Mass m); // 3 functions with\ndouble computeValue(Distance\
    \ d); // checking headers,\ndouble computeValue(double d); // only 1 with typedefs\n\
    \n+   - Could lead to undefined behavior via ODR violation.\n\nODR = “One Definition\
    \ Rule”.\nIf the three versions of computeValue are compiled separately with the\
    \ checking headers and linked with object file compiled with the unchecked headers,\
    \ the system will have an inconsistent definition of computeValue."
