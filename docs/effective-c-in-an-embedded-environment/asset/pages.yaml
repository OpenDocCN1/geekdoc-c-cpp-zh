  md: "# # Dimensionless Quantities\n\nDimensionless quantities (i.e., objects of\
    \ type Units<T,0,0,0,0,0,0,0>) should be type-compatible with unitless types (e.g.,\
    \ int, double, etc.).\n\n+   Partial template specialization can help:\n\n```\n\
    template<typename T>\nclass Units<T, 0, 0, 0, 0, 0, 0, 0>\npublic:\n    Units(T\
    \ initVal = 0): val(initVal) {} // allow implicit conversion\n    operator T()\
    \ const { return val; } // to/from values of type T\n    Units& operator=(T newVal)\
    \ // allow assignments from\n    { val = newVal; return *this; } // values of\
    \ type T\n    ...\nprivate:\n    T val;\n};\n```\n\nIf partial template specialization\
    \ is unavailable, you can totally specialize for e.g., T = double and/or T = float."
