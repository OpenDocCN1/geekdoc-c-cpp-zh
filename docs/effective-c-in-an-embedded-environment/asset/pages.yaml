- img_proc: true
  md: "# Approaches to Implementing Exceptions\n\nOne is to keep a shadow stack of\
    \ objects requiring destruction if an exception is thrown.\n\n+   * Code size\
    \ increases to to include instructions for manipulating the shadow stack.\n* Runtime\
    \ data space increases to hold the shadow stack.\n* Program runtime increases\
    \ to allow for shadow stack manipulations.\n* Performance impact?\n  * Unknown.\
    \ Apples-to-apples comparisons are hard to come by.\n  * Ballpark gueststimate:\
    \ 5-10% hit in both time and space.\n  * “Guesimate” = “Speculation”\n\nThis is\
    \ sometimes known as the “Code Approach.”\n\n+   * Microsoft uses it for 32 bit\
    \ (but not 64 bit) Windows code.\n* g++ distributions for Windows use it, too."
  merge: -1
