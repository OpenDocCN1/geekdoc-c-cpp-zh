  md: "# Implementing Virtual Functions\n\nSize penalties:\n\n+   - Vptr makes each\
    \ object larger\n  - Alignment restrictions could cause padding\n  - Reordering\
    \ data members often eliminates problem\n\n| vptr |\n| double int |\n| vptr int\
    \ double |\n\n+   - Per-class vtbl increases each application's data space\n\n\
    Speed penalties:\n\n+   - Call through vtbl slower than direct call:\n  - But\
    \ this is usually only by a few instructions\n- Inlining usually impossible:\n\
    \  - This is often inherent in a virtual call\n\nBut compared to C alternatives:\n\
    \n+   - Faster and smaller than if/then/else or switch-based techniques\n- Guaranteed\
    \ to be right\n\nThe diagram shows that if the first data member declared in a\
    \ class has a type that requires double-word alignment (e.g., double or long double),\
    \ a word of padding may need to be inserted after the vptr is added to the class.\
    \ If the second declared data member is a word in size and requires only single-word\
    \ alignment (e.g., int), reordering the data members in the class can allow the\
    \ compiler to eliminate the padding after the vptr."
  merge: -1
