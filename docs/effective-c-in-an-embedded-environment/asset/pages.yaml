  md: "# Type-Safe Interfaces\n\nWe can partially specialize Stack to generate type-safe\
    \ void*-based classes:\n\n```\ntemplate<typename T>\nclass Stack<T> {\npublic:\n\
    \    void push(T *ptr) { s.push(ptr); }\n    T * pop() { return static_cast<T*>(s.pop());\
    \ }\nprivate:\n    GenericPtrStack s; // implementation\n};\n```\n\nAt runtime,\
    \ the cost of Stack<T> instantiations is zero:\n\n+   - All instantiations use\
    \ the code of the single GenericPtrStack class\n- All Stack<T> member functions\
    \ are implicitly inline\n\nThe cost of type-safety is nothing."
