  md: "# # Modeling Hardware Directly\n\nThere are thus two kinds of classes for modeling\
    \ memory-mapped IO.\nOne kind models hardware *directly*.\n\n+   - Objects of\
    \ such classes are created by clients at specific addresses.\n  Via placement\
    \ *new* or *reinterpret_cast*.\n\n+   - They contain only non-static data that\
    \ maps to MMIO registers:\n\n```\nclass OutputDevice3 {\n    // class designed\
    \ to be\npublic:\n    // instantiated at MMIO\n    private:\n        OutputDevice3(const\
    \ OutputDevice3&);\n        ControlReg cr;           // data members map directly\n\
    \        volatile unsigned data;  // to MMIO device registers\n};\n```\n\n+  \
    \ - Static data is okay.\n\n+   - They never contain virtual functions.\n\n+ \
    \  - Virtual functions leads to a *vptr* *somewhere* within each object."
