  md: "# Efficiency\n\nSome compilers won't put objects in registers:\n\n+   - A Units<double,\
    \ ...> may yield worse code than a raw double.\n\nIdea:\n\n+   - Two sets of headers,\
    \ checking a set and a no-op set.\n\n```\n// checking header // no-op header\n\
    template<...>\ntypef double UnitPrecision;\nclass Units {\n    ...\n}\ntypef Units<...,...>\
    \ Mass; typedef UnitPrecision Mass;\ntypef Units<...,...> Distance; typedef UnitPrecision\
    \ Distance;\ntypef Units<...,...> Velocity; typedef UnitPrecision Velocity;\n\
    typef Units<...,...> Force; typedef UnitPrecision Force;\n...\n```\n\nChecking\
    \ header uses Units template, non-checking header doesn't:\n\nThe “Idea” sketched\
    \ on this slide and the next is just that that. I have not implemented it, so\
    \ there may be problems I have not anticipated."
  merge: -1
