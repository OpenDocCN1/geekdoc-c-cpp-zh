    \ pointers.\n  - Another for B2* pointers.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_24_0.png)\n\
    \nSI = \"Single Inheritance.\" MI = \"Multiple Inheritance.\""
