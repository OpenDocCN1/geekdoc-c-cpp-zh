- img_proc: true
  md: '# Approaches to Implementing Exceptions


    The alternative maps program regions to objects requiring destruction:


    | Region | Objects |

    | --- | --- |

    | R0 | None |

    | R1 | V1 |

    | R2 | V1, V2 |

    | R3 | V1, V2, V3 |

    | R4 | Same as R1 |

    | R5 | V1, V4 |

    | R6 | V1, V4, V5 |


