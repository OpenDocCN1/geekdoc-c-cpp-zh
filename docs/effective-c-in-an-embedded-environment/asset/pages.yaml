  md: "# Modeling a Control Register\n\nSuppose we have a four-byte control register\
    \ such that:\n\n+   - Bit 0 indicates readiness: 1 ⇒ ready, 0 ⇒ not ready.\n-\
    \ Bit 2 indicates whether interrupts are enabled: 1 ⇒ enabled, 0 ⇒ not.\n\nAssuming\
    \ an int is four bytes in size, we can model the register like this:\n\n```\n\
    enum { bit0 = 0x1, bit1 = 0x2, ..., bit31 = 0x80000000 };\nclass ControlReg {\n\
    public:\n    bool ready() const { return regValue & bit0; }\n    bool interruptsEnabled()\
    \ const { return regValue & bit2; }\n    void enableInterrupts() { regValue |=\
    \ bit2; }\n    void disableInterrupts() { regValue &= ~bit2; }\nprivate:\n   \
    \ volatile unsigned regValue; // data in the register may change\n}; // outside\
    \ program control\n```\n\nAll functions are inline, so their existence incur no\
    \ cost.\n\n+   - Assuming they are actually inlined.\n\nSome Int-like tools will\
    \ complain about the implementations of ready and interruptsEnabled, because they\
    \ return the result of operation as bools. To quiet these tools, it can be preferable\
    \ to write them more like:\n\n```\nbool ready() const { return (regValue & bit0)\
    \ == true; }\n```\n\nenableInterrupts and disableInterrupts use read/modify/write\
    \ instructions, so they may be subject to race conditions in multithreaded systems."
