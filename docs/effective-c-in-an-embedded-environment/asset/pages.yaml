    An optimization for when memory for all of a heap''s objects can be released at
    once.


    +   - Clients call a region member function at the appropriate time.

    - Faster than deallocating each object''s memory individually.

    - Common with LIFO allocators, but compatible with pools, blocks, blocks, etc.

