  md: '# Modeling Memory-Mapped IO


    Many systems map IO devices to fixed parts of a program’s address space.


    +   - Input registers are often separate from output registers.


    +   - Control/status registers are often separate from data registers.


    +   - Different status register bits convey information such as readiness or whether
    device interrupts are enabled.


    C++ makes it easy to make memory-mapped IO devices look like objects with natural
    interfaces.


    +   - At zero cost.


    +   - Provided you have a decent compiler :-)'
