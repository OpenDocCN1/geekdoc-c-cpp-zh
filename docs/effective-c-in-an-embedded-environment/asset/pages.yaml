  md: '# # “No-Cost” C++ Features


    These exact a price only during compilation. In object code, they look like C:


    +   - All the C stuff: structs, pointers, free functions, etc.

    - Classes

    - Namespaces

    - Static functions and data

    - Nonvirtual member functions

    - Function and operator overloading

    - Default parameters:


    Note that they are always passed. Poor design can thus be costly:

    ```cpp

    void doThat(const std::string& name = "Unnamed"); // Bad

    const std::string defaultName = "Unnamed";nvoid doThat(const std::string& name
    = defaultName); // Better

    ```


    +   - Overloading is typically a cheaper alternative.


    This slide begins a summary of the costs of various C++ language features (compared
    to C).'
  merge: -1
  pgno: 32
- img_proc: true
  md: "# More “No-Cost” C++ Features\n\nThese look like they cost you something, but\
    \ in truth they rarely do\n(compared to equivalent C behavior):\n\n+   - Constructors\
    \ and destructors:\n  - They contain code for mandatory initialization and finalization.\n\
    \  - However, they may yield chains of calls up the hierarchy.\n\n+   - Single\
    \ inheritance\n\n+   - Virtual functions\n  - Abstract classes with no virtual\
    \ function implementations (i.e.,\n\"Interfaces\") may still generate vtbls.\n\
    \  - Some compilers offer ways to prevent vtbls.\n\n+   - Virtual inheritance\n\
    \nBoth MS and Comeau offer the _declspec(novtable) mechanism to suppress vtbl\n\
    generation and vptr assignment for Interface classes. Apparently the Sun compiler\
    \ will\noptimize away unnecessary vtbls in some cases without any manual user\
    \ intervention.\nFrom what I can tell, as of gcc 4.x, there is no comparable feature\
    \ in g++."
