    - If it''s write-only, you''ll need to cache the most recently written value.


    In theory, you could use std::aligned_storage (or std::tr1::aligned_storage) to
    solve the alignment problem, but then you''d have to worry that the total amount
    of underlying storage might be larger than the register you are modeling. For
    this kind of application, it seems to me that you want more precise control over
    the amount of storage allocated that std::aligned_storage gives you.


    Caching the most recently written value is tricky, because adding a data member
    to the class is unacceptable. One possible approach is to have an external data
    structure indexed by MMIO address (e.g., a map) that holds auxiliary device information,
    e.g., the most recently written value. The cached value would then be accessed
