    \ 名称修饰方案，”，Kang Seonghoon，http://mearie.org/documents/mscmangle/\n\n## 更多信息\n\n\
    调用纯虚函数时程序的行为：\n\n- “调用了纯虚函数：一种解释，”，The C++ Source，2007 年 2 月 26 日，http://www.artima.com/cppsource/pure_virtual.html。\n\
    \n不使用异常进行错误处理的代价：\n\n- “退出、返回、跳转或……抛出，”，”Dan Saks，*Embedded Systems Design*，2007\
    \ 年 3 月。\n- 估算使用返回值报告错误条件会导致对象大小增加 15–40%（与不进行错误检测/传播相比）。\n\n## 更多信息\n\n控制临时对象的生成和代价：\n\
    \n- *More Effective C++: 35 New Ways to Improve Your Programs and Designs*，Scott\
    \ Meyers，Addison-Wesley，1996 年，ISBN 0-201-63371-X。\n- 第 19-22 项涵盖了控制临时对象创建的基础知识。\n\
    - 第 29 项描述了引用计数如何使对象创建变得廉价。\n- 附有该书目录的副本。\n\n- 模板元编程 (TMP)，包括表达式模板和基于 TMP 的库：\n\
    - “使用 C++ 模板元程序，”，Todd Veldhuizen，C++ Report，1995 年 5 月。\n- *C++ Templates*，David\
    \ Vandevooordede 和 Nicolai Josuttis，Addison-Wesley，2003 年，ISBN 0-201-73484-2，第\
    \ 17-18 章。\n\n## 嵌入式环境下的高效 C++ \n\n## 更多信息\n\n代码膨胀：\n\n- **Techniques for Scientific\
    \ C++, Todd Veldhuizen, 印第安纳大学计算机科学技术报告 # 542，2000 年 8 月。访问地址 http://www.osl.iu/~teldhuiz/papers/techniques/**\n\
    - 第 1.5 节标题为“管理代码膨胀”。\n\n- **“模板导致的代码膨胀，”**，comp.lang.c++.moderated 线程，于 2002\
    \ 年 5 月 16 日发起。访问地址 http://tinyurl.com/xnhn。\n- **“C++ 模板对比 .NET 泛型，”**，comp.lang.c++.moderated\
    \ 线程，于 2003 年 10 月 4 日发起。访问地址 http://tinyurl.com/xnhf.\n- Mogens Hansen 在 11 月\
    \ 13 日发布的帖子开启了一个共性/变性分析的良好子线程。\n- **“泛型编程中最小代码膨胀的高效运行时分发，”**，Lumoir Bordev 和 Jaikko\
    \ Järvi，*Library-Centric Software Design (LCSD ‘06)*，2006 年 10 月 22 日。\n- 描述了一种先进的代码提升技术。\n\
    - **“在泛型类中最小化依赖以实现更快速、更小的程序，”**，Dan Tsafrir *等人*，OOPSLA ‘09，2009 年 10 月。\n- 讨论了不必要的类命名对性能的代价。\n\
    \nScott Meyers，软件开发顾问\nhttp://www.aristele.com/\n\n© 2012 Scott Meyers,保留所有权利。\n\
    \nScott Meyers，软件开发顾问\n© 2012 Scott Meyers,保留所有权利。\n\n## 更多信息\n\n内联：\n\n- “Inline\
    \ Redux，”Herb Sutter，*C/C++ Journal*，2003 年 11 月。\n- “Inline Functions，”Randy\
    \ Meyers，*C/C++ Journal*，2002 年 7 月。\n- “高效 C++，”Dov Bulka 和 David Mayhew，Addison-Wesley，2000\
    \ 年，ISBN 0-201-37950。\n- “链接时代码生成，”Matt Pietrek，*Visual C++*。\n- 描述了哪些函数是可以被内联的。\n\
    \n## 更多信息\n\n链接时多态：\n\n- “链接时多态，”Michael Kelly，*Effective Test-Driven Development*，2005\
    \ 年。\n- 使用了链接时多态来达到链接时多态。\n\n## 更多信息\n\n对象的 ROM 机制：\n\n- “静态 vs. 动态初始化，”，Dan Saks，*Embedded\
    \ Systems Programming*，1998 年。\n- 1999 年 3 月的 *Embedded Systems Programming*。\n\
    - 关于 IEEE/IEC 1805 的技术报告。\n- 描述了哪些可以被 ROM 的。\n\n## 更多信息\n\n嵌入式系统的内存映射：\n\n- “内存映射，”James\
    \ Noble 和 Charles Weir，*Embedded Systems*，2001 年，ISBN 0-201-59607。\n- 嵌入式系统中的内存映射。\n\
    - “内存管理，”，Sasha Gontmakher 和 Konstantin Knizhnik，*Journal*，2005 年 12 月。\n- “Boost\
    \ 库，”Stephen Cleary，http://www.boost.org/pool/doc/index.html。\n- “内存分配器，”Doug\
    \ Lea，http://www.cs.osmu.edu/di/html/malloc.html。\n\n## 更多信息\n\nSTL 分配器：\n\n-\
    \ *Effective STL*，Scott Meyers，Addison-Wesley，2001 年，ISBN 0-201-74962。\n- *C++\
    \ 编程语言（第三版)*，Bjarne Stroustrup，Addison-Wesley，1997 年，ISBN 0-201-88954-4，第 567-576\
    \ 页。\n- “自定义 STL 分配器，”Pete Isensee，http://www.tantalon.com/pete/?customallocators.pt。\n\
    - 2003 年游戏开发者大会的 PPT 资料。\n- “使用自定义池分配器提升 STL 性能，”Anthony Aue，*Dr. Forbes Journal*，2005\
    \ 年 9 月。\n\n"
