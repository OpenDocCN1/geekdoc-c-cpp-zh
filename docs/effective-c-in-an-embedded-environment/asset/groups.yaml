    \ (i.e., to zero instructions).\n- If it doesn't away and you care, consider a\
    \ reinterpret_cast instead of placement new:\n\n```\nControlReg * const pcr =\
    \ // pointer version\nreinterpret_cast<ControlReg*>(0xFFFF0000);\nControlReg&\
    \ cr = // reference version\nreinterpret_cast<ControlReg*>(0xFFFF0000);\n```\n\
    \n# Placement new vs. Raw Casts\n\nPlacement new is typically preferable to a\
