    \ Environment\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_2_0.png)\n\n© 2012 Scott\
    \ Meyers, all rights reserved.\nLast Revised: 10/4/12\n\nThese are the official\
    \ notes for Scott Meyers’ training course, “Effective C++ in an Embedded Environment”.\
    \ The course description is at http://www.aristacom.com/c++/in-embedded.html.\
    \ Licensing information is at http://aristacom.com/Licensing/licensing.html. Please\
    \ send bug reports and improvement suggestions to smeyers@aristacom.com.\n\nIn\
    \ these notes, references to numbered documents preceded by N (e.g., N3092) are\
    \ references to C++ standardization document. All documents are available via\
    \ http://www.open-std.org/jtc1/sc22/wg21/docs/papers/.\n\n[Comments in braces,\
    \ such as this, are aimed at instructors presenting the course. All other comments\
    \ should be helpful for both instructors and people reading the notes on their\
    \ own.]\n\nScott Meyers, Software Development Consultant\n\n© 2012 Scott Meyers,\
    \ all rights reserved.\n\nEffective C++ in an Embedded Environment\n\n# Important!\n\
    \nIn this talk, I assume you know all of C++.\nYou may not.\n\nWhen you see or\
    \ hear something you don't recognize, please ask!\n\nScott Meyers, Software Development\
    \ Consultant\nhttp://www.aristela.com/\n\n© 2012 Scott Meyers, all rights reserved.\n\
    \nSlide 2\n\nScott Meyers, Software Development Consultant\n\n© 2012 Scott Meyers,\
    \ all rights reserved.\n\n# Overview\n\nDay 1 (Approximate):\n\n- “C++” and “Embedded\
    \ Systems”\n- A Deeper Look at C++\n  - Implementing language features\n  - Understanding\
    \ inlining\n  - Avoiding code bloat\n- 3 Approaches to Interface-Based Programming\n\
    - Dynamic Memory Management\n- C++ and ROMability\n\n# Overview\n\nDay 2 (Approximate):\n\
    \n- Modeling Memory-Mapped IO\n- Implementing Callbacks from C APIs\n- Interesting\
    \ Template Applications:\n  - Type-safe void*-based containers\n  - Compile-time\
    \ dimensional unit analysis\n  - Specifying FSMs\n- Considerations for Safety-Critical\
    \ and Real-Time Systems\n- Further Information\n\n# Always on the Agenda\n\n-\
    \ Your questions, comments, topics, problems, etc.\n- Always top priority.\n\n\
    The primary course goal is to cover what you want to know.\n\n- It doesn't matter\
    \ whether it's in the prepared materials.\n\n# Overview\n\nDay 1 (Approximate):\n\
    \n- \"C++\" and \"Embedded Systems\"\n- A Deeper Look at C++\n- Implementing language\
    \ features\n- Understanding inlining\n- Avoiding code bloat\n- 3 Approaches to\
    \ Interface-Based Programming\n- Dynamic Memory Management\n- C++ and ROMability\n\
    \n# \"C++\"\n\nTimeline and terminology:\n\n- 1998: C++98: “Old” standard C++.\n\
    - 2003: C++03: Bugfix revision for C++98.\n- 2005: TR1: Proposed extensions to\
    \ standard C++ library.\n  - Common for most parts to ship with current compilers.\n\
    \  - Overview comes later in course.\n- 2011: C++11: “New” standard C++.\n  -\
    \ Common for many parts to ship with latest compiler releases.\n\n# \"Embedded\
    \ Systems\"\n\nEmbedded systems using C++ are diverse:\n\n- Real-time? Maybe.\n\
    - Safety-critical? Maybe.\n- Challenging memory limitations? Maybe.\n- Challenging\
    \ CPU limitations? Maybe.\n- No heap? Maybe.\n- No OS? Maybe.\n- Multiple threads\
    \ or tasks? Maybe.\n- “Old” or “weak” compilers, Maybe.\n- No hard drive? Often.\n\
    - Difficult to field-upgrade? Typically.\n\nThe goal of this slide is to get people\
    \ to recognize their view about what it means to develop for embedded systems\
    \ may not be the same as others’ views. The first time I taught this class, I\
    \ had one person writing code for a 4-bit microprocessor in a digital camera (i.e.,\
    \ a mass-market consumer device), and I also had a team writing real-time radar\
    \ analysis software to be used in military fighter planes. The latter would have\
    \ a very limited production run, and if the developers needed more CPU or memory,\
    \ they simply added a new board to the system. Both applications were “embedded,”\
    \ but they had almost nothing in common.\n\n# Developing for Embedded Systems\n\
    \nIn general, little is “special” about developing for embedded systems:\n\n-\
    \ Software must respect the constraints of the problem and platform.\n- C++ language\
    \ features must be applied judiciously.\n\nThese are true for non-embedded applications,\
    \ too.\n\n- Good embedded software development is just good software development.\n\
    \n# Overview\n\nDay 1 (Approximate):\n\n- \"C++\" and \"Embedded Systems\"\n-\
    \ A Deeper Look at C++\n- Implementing language features\n- Understanding inlining\n\
    - Avoiding code bloat\n- 3 Approaches to Interface-Based Programming\n- Dynamic\
    \ Memory Management\n- C++ and ROMability\n\n# Implementing C++\n\nWhy Do You\
    \ Care?\n\n- You're just curious: how do they do that?\n- You're trying to figure\
    \ out what's going on while debugging.\n- You're concerned: do they do that efficiently\
    \ enough?\n- That's the focus of this presentation\n- Baseline: C size/speed\n\
    \nHave faith:\n\n- C++ was designed to be competitive in performance with C.\n\
    - Generally speaking, you don't pay for what you don't use.\n\n# Implementing\
    \ Virtual Functions\n\nAbandon All Hope, Ye Who Enter!\n\n- Compilers are allowed\
    \ to implement virtual functions in any way they like:\n- There is no mandatory\
    \ “standard” implementation\n\n- The description that follows is mostly true for\
    \ most implementations:\n- I’ve skimmed over a few details\n- None of these details\
    \ affects the fact that virtual functions are typically implemented very efficiently\n\
    \n# Implementing Virtual Functions\n\nConsider this class:\n\n```\nclass B {\n\
    public:\n    B();\n    virtual ~B();\n    virtual void f1();\n    virtual int\
    \ f2(char c) const;\n    virtual void f3(int x) = 0;\n\n    void f4() const;\n\
    \    ..\n}\n```\n\nCompilers typically number the virtual functions in the order\
    \ in which they're declared. In this example,\n\n- The destructor is number 0\n\
    - f1 is number 1, f2 is number 2, f3 is number 3\n\nNonvirtual functions get no\
    \ number.\n\n# Implementing Virtual Functions\n\nA vtbl (\"virtual table\") will\
    \ be generated for the class. It will look something like this:\n\n- implementation\
    \ of B::~B\n- implementation of B::f1\n- implementation of B::f2\n- ??\n\nNotes:\n\
    \n- The vtbl is an array of pointers to functions\n- The ith element points to\
    \ the virtual function numbered $i$\n- For pure virtual functions, what the entry\
    \ is undefined.\n- It's often a function that issues an error and quits.\n\n-\
    \ Nonvirtual functions (including constructors) are omitted:\n- Nonvirtual functions\
    \ are implemented like functions in C\n\nAccording to the \"Pure Virtual Function\
    \ Called\" article by Paul Chisholm (see the \"Further Information\" slides at\
    \ the end of the notes, the Digital Mars compiler does not always issue a message\
    \ when a pure virtual function is called, it just halts execution of the program.\n"
