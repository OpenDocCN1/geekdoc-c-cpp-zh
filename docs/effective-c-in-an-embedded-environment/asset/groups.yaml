  mdcn: "\n\n# 内存池 (Pool Allocation)\n\n- **速度**：极快；确定性。\n- **假设：**\n  - 没有错误尺寸的请求。\n\
    \  - 你不会耗尽内存。\n- **外部碎片**：不可能。\n- **内存泄漏**：可能。\n- **内存耗尽**：可能。\n\n# 块分配 (Block\
    \ Allocation)\n\n本质上是一组具有不同元素（块）大小的池：\n\n| 用于大小 s1 分配的池 | 用于大小 s2 分配的池 | 用于大小\
    \ s3 分配的池 | 用于大小 s4 分配的池 | 用于大小 s5 分配的池 |\n| --- | --- | --- | --- | --- |\n\n\
    n 字节请求由第一个大小 ≥ n 且空闲列表非池处理。\n\n适用场景：\n\n- 需要对相对较少的对象大小进行分配时。\n- 否则会产生内部碎片 ⇒ 浪费内存。\n\
    \n许多实时操作系统（RTOS）都为块分配提供原生支持。\n\n# 块分配 (Block Allocation)\n\n- **速度**：快；几乎是确定性的（且可界定的）。\n\
    - **假设**：\n  - 没有大于最大块池处理范围的请求。\n  - 你不会耗尽内存。\n\n- **外部碎片**：不可能。\n\n- **内存泄漏**：可能。\n\
    \n- **内存耗尽**：可能。\n\n速度不是完全确定性的，因为你可能需要检查多个池以找到一个具有足够空闲内存的池。\n\n# 通用变量分配 (General\
    \ Variable-Sized Allocation)\n\n`new`/`delete`/`malloc`/`free` 已经实现的功能。\n\n- 仅当厂商提供的程序不可接受时，使用它才有意义。\n\
    \n可能的动机：\n\n- 检测溢出/欠界。\n- 收集堆使用数据。\n- 尺寸和生命周期分布、时间性使用模式等。\n- 支持数据结构聚类。\n- 避免线程安全开销。\n\
    - ST（存储跟踪或特定技术，取决于上下文，通常指特定领域）应用。\n- 多线程（MT）应用中的线程本地分配器。\n\n# 区域分配 (Region Allocation)\n\
    \n一种针对堆中所有对象的内存可以一次性释放场景的优化方案。\n\n- 客户端在适当的时间调用区域（region）成员函数。\n- 比逐个释放每个对象的内存更快。\n\
    - 常用于 LIFO（后进先出）分配器，与池、块等兼容。\n- 针对单个对象的 `operator delete` 是空操作，因此非常快。\n- 仍可以使用\
    \ `delete` 运算符来调用析构函数：\n\n```\ndelete p;\n// 调用 *p 的析构函数，然后对 p 执行 operator delete；\n\
    // 如果 *p 在一个区域内，operator delete 是空操作\n```\n\n# 总结：动态内存管理 (Dynamic Memory Management)\n\
    \n- 许多嵌入式系统包含了动态内存管理。\n- 关键问题是速度、碎片、泄漏和内存耗尽。\n- LIFO 快速且没有碎片，但对象的生命周期必须符合 LIFO。\n\
    - 内存快且没有碎片，但对象大小受到限制。\n- 块分配本质上是多个池分配器。\n- 区域在所有堆对象可以同时释放时表现出色。\n\n# 概述 (Overview)\n\
    \n第一天（近似值）：\n\n- “C++”与“嵌入式系统”\n- 深入研究 C++\n- 实现语言内联（inlining）\n- 理解内联\n- 避免代码膨胀\n\
    - 基于接口的编程的三种方法\n- 动态内存管理\n- C++ 与 ROM 可性（ROMability）\n\n# C++ 与 ROM (C++ and ROM)\n\
    \n任何内容都可以被刻入 ROM 并在程序执行前加载到 RAM 中。\n\n- 只要架构允许即可。\n- 哈佛体系架构不允许。\n\n更有趣的问题是：\n\n\
    - 在程序运行时，什么可能残留在 ROM 中？\n\nC++ 标准对 ROM 化保持缄未态度：\n\n- 它本质上允许任何操作，但不保证任何结果。\n- 因此，什么是可以\
