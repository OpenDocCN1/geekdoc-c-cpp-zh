  - '[PAGE 15]


    # Implementing Virtual Functions


    A vtbl ("virtual table") will be generated for the class. It will look something
    like this:


    +   - implementation of B::~B

    - implementation of B::f1

    - implementation of B::f2

    - ??


    Notes:


    +   - The vtbl is an array of pointers to functions

    - The ith element points to the virtual function numbered $i$

    - For pure virtual functions, what the entry is is undefined.

    - It''s often a function that issues an error and quits.


    +   - Nonvirtual functions (including constructors) are omitted:

    - Nonvirtual functions are implemented like functions in C


    According to the "Pure Virtual Function Called" article by Paul Chisholm (see
    the "Further Information" slides at the end of the notes, the Digital Mars compiler
    does not always issue a message when a pure virtual function is called, it just
    halts execution of the program.'
- md: "\n# Aside: Calling Pure Virtual Functions\n\nMost common way to call pure virtuals\
    \ is in a constructor or destructor:\n\n```cpp\nclass B {\npublic:\n  B() { f3(0);\
    \ } // call to pure virtual\n  virtual void f3(int x) = 0;\n  ...\n};\n```\n\n\
    This is easy to detect; many compilers issue a warning.\n\nThe following case\
    \ is trickier:\n\nCompilers rarely diagnose this problem.\n\nFor the first example,\
    \ gcc 4.4-4.7 issue warnings. VC9-11 do not.\n\nFor the second example, none of\
    \ the compilers issues a warning.\n\n# Implementing Virtual Functions\n\nNow consider\
    \ a derived class:\n\n```cpp\nclass D1 : public B {\npublic:\n    D1();      \
    \          // nonvirtual\n    virtual f3(int x);  // overrides base virtual\n\
    \    virtual f5(const std::string& s); // new virtual\n    virtual ~D1();    \
    \  // overrides base virtual\n};\n```\n\nIt yields a vtbl like this:\n\n| D1's\
    \ vtbl | implementation of D1::~D1 |\n| : | :--- |\n| | implementation of B::f1\
    \ |\n| | implementation of B::f2 |\n| | implementation of D1::f3 |\n| | implementation\
    \ of D1::f5 |\n\nNote how corresponding function implementations have corresponding\
    \ indices in the vtbl.\n\nA second derived class would be treated similarly:\n\
    \n```cpp\nclass D2: public B {\npublic:\n    D2();\n    virtual void f3(int x);\n\
    \    ...\n};\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_18_0.png)\n\n- D2's\
    \ destructor is automatically generated by the compiler.\n\nObjects of classes\
    \ with virtual functions contain a pointer to the class’s vtbl:\n\n| Object's\
    \ vptr | Data members for the object |\n| :--- | :--- |\n\nThis pointer is called\
    \ the vptr (\"virtual table pointer\").\n\n- Its location within an object varies\
    \ from compiler to compiler\n\nVptrs point to vtbls:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_20_0.png)\n\
    \nVptrs are set by code compilers insert into constructors and destructors.\n\n\
    - In a hierarchy, each class's constructor sets the vptr to point to that class's\
    \ vtbl\n- Ditto for the destructors in a hierarchy.\n\nCompilers are permitted\
    \ to optimize away unnecessary vptr assignments.\n\n- E.g., vptr setup for a D\
    \ object could look like this:\n\n```cpp\nD obj;\nSet vptr to B's vtbl; // may\
    \ be optimized away\nSet vptr to M's vtbl; // may be optimized away\nSet vptr\
    \ to D's vtbl;\n...\nSet vptr to M's vtbl; // may be optimized away\nSet vptr\
    \ to B's vtbl; // may be optimized away\n```\n\nB = \"Base\", M = \"Middle\",\
    \ D = \"Derived\".\n\nConsider this C++ source code:\n\n```cpp\nvoid makeACall(B\
    \ *pB)\n{\n    pB->f1();\n}\n```\n\nThe call to f1 yields code equivalent to this:\n\
    \n```cpp\n(*pB->vptr[1])(pB); // call the function pointed to by\n// vtbl entry\
    \ 1 in the vtbl pointed\n// to by pB->vptr; pB is passed as\n// the \"this\" pointer\n\
    ```\n\nOne implication:\n\n- When a virtual function changes, every caller must\
    \ recompile!\n  - e.g., if the function's order in the class changes\n    - i.e.\
    \ its compiler-assigned number.\n  - e.g., if the function's signature changes.\n\
    \nSize penalties:\n\n- Vptr makes each object larger\n  - Alignment restrictions\
    \ could cause padding\n  - Reordering data members often eliminates problem\n\n\
    | vptr | |\n| :--- | :--- |\n| double int |\n| vptr int double |\n\n- Per-class\
    \ vtbl increases each application's data space\n\nSpeed penalties:\n\n- Call through\
    \ vtbl slower than direct call:\n  - But this is usually only by a few instructions\n\
    - Inlining usually impossible:\n  - This is often inherent in a virtual call\n\
    \nBut compared to C alternatives:\n\n- Faster and smaller than if/then/else or\
    \ switch-based techniques\n- Guaranteed to be right\n\nThe diagram shows that\
    \ if the first data member declared in a class has a type that requires double-word\
    \ alignment (e.g., double or long double), a word of padding may need to be inserted\
    \ after the vptr is added to the class. If the second declared data member is\
    \ a word in size and requires only single-word alignment (e.g., int), reordering\
    \ the data members in the class can allow the compiler to eliminate the padding\
    \ after the vptr.\n\n# Object Addresses under Multiple Inheritance\n\nUnder SI,\
    \ we can generally think of object layouts and addresses like this:\n\n```cpp\n\
    class B { ... };\nclass D: public B { ... };\n```\n\n- An exception (with some\
    \ compilers) when D has virtual functions.\n\nUnder MI, it looks more like:\n\n\
    ```cpp\nclass B1 { ... };\nclass B2 { ... };\nclass D: public B1, public B2 {\
    \ ... };\n```\n\n- D objects have multiple addresses:\n  - One for B1* and D*\n\
    \  - Another for B2* pointers.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_24_0.png)\n\
    \nSI = \"Single Inheritance.\" MI = \"Multiple Inheritance.\"\n\n# Object Addresses\
    \ under Multiple Inheritance\n\nThere is a good reason for:\n\n```cpp\nvoid f(B1\
    \ *pb1); // expects pb1 to point\n// the top of B1\n\nvoid g(B2 *pb2); // expects\
    \ pb2 to point\n// the top of B2\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_25_0.png)\n\
    \nSome calls require offset adjustments:\n\n```cpp\nD *pd = new D; // no adjustment\n\
    f(pd); // no adjustment\ng(pd); // requires D*->B2* adjustment\nB2 *pb2 = pd;\
    \ // requires D*->B2* adjustment\n```\n\nProper adjustments require proper type\
    \ information:\n\n```cpp\nif (pb2 == pd) // test succeeds (pd converted to B2*)\n\
    if ((void*)pb2 == (void*)pd) // test fails\n```\n\nNull pointers never get an\
    \ offset. At runtime, a nullness test must be performed before applying an offset.\n\
    \n# Virtual Functions under Multiple Inheritance\n\nConsider the plight of compilers:\n\
    \n```cpp\nclass B1 {\npublic:\n    virtual void mf(); // may be overridden by\n\
    \    derived classes\n};\nclass B2 {\npublic:\n    virtual void mf(); // may be\
    \ overridden by\n    derived classes\n};\nvoid g(B2 *pb2) {\n    pb2->mf(); //\
    \ requires offset adjustment\n// before calling mf\n}\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_26_0.png)\n\
    \nAn adjustment is needed only if D overrides mf and pb2 really points to a D.\
    \ What might a compiler do? When generating code for the call:\n- It may not know\
    \ that D exists\n- It can't know whether pb2 points to D\n\nI don’t remember the\
    \ details, but both B1 and B2 need to declare mf for the information on this slide\
    \ to be true for C++. For g++, I believe it suffices for only B2 to declare mf.\n\
    \n# Virtual Functions under Multiple Inheritance\n\nThe problem is typically solved\
    \ by:\n\n- Creating special vbtls that handle offset adjustments.\n- For derived\
    \ class objects, adding new vptrs to vbtls, one additional vptr for each base\
    \ class after the first one:\n\n```cpp\nclass B1 { ... };\nclass B2 { ... };\n\
    class D:\n  public B1,\n  public B2 { ... };\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_27_0.png)\n\
    \nThese special vptrs and vbtls apply only to derived class objects.\n\n- Virtual\
    \ functions for B1 and B2 objects are implemented as before.\n\n# Virtual Functions\
    \ under Multiple Inheritance\n\nOffset adjustments may be implemented in different\
    \ ways:\n\n- Storing deltas in the vtbl:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_28_0.png)\n\
    \n- Typically, most deltas will be 0, especially under SI.\n\n- Passing virtual\
    \ calls through thunks:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_28_1.png)\n\
    \n- Thunks are generated only if an adjustment is necessary.\n- This approach\
    \ is more common.\n\n# Thunk Implementation\n\nOften function with multiple entry\
    \ points:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_29_0.png)\n\nI'm guessing\
    \ about the jump in the diagram. An alternative would be for one thunk to fall\
    \ through to the next, with the sum of the offset adjustments calculated to ensure\
    \ that the proper value is in place when the function body is entered.\n\n# Virtual\
    \ Functions under Multiple Inheritance\n\nThe details of vtbl layout and usage\
    \ under MI vary from compiler to compiler.\n\n- When a virtual is inherited from\
    \ a non-leftmost base, it may or not be entered into both vbtls:\n\n```cpp\nclass\
    \ B1 { ... }; // declares no mf\nclass B2 {\npublic:\n    virtual void mf();\n\
    };\nclass D: public B1, public B2 { ... };\nD *pd = new D;\npd->mf(); // may use\
    \ B2's or D's vptr,\n// depending on the compiler\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_30_0.png)\n\
    \nAs I recall, g++ enters the function into both vbtls, but C++ enters it into\
    \ only the vtbl for B2. This means that the call in red shown above would use\
    \ the B2 vtbl under VC++, and that means there'd be a D*->B2* offset adjustment\
    \ made prior to calling through the B2 vtbl.\n"
  mdcn: "\n\n# 补充：调用纯虚函数\n\n调用纯虚函数的常见方式是在构造函数或析构函数中：\n\n```cpp\nclass B {\npublic:\n\
    \  B() { f3(0); } // 调用纯虚函数\n  virtual void f3(int x) = 0;\n  ...\n};\n```\n\n\
    这种很容易很容易检测；许多编译器会发出警告。\n\n以下情况更为棘手：\n\n编译器很少诊断出这类问题。\n\n对于第一个示例，gcc 4.4-4.7 会发出警告。VC9-11\
    \ 则不会。\n\n对于第二个示例，没有任何编译器会发出警告。\n\n# 实现虚函数\n\n现在考虑一个派生类：\n\n```cpp\nclass D1 :\
    \ public B {\npublic:\n    D1();                // 非虚函数\n    virtual f3(int x);\
    \  // 覆盖基类虚函数\n    virtual f5(const std::string& s); // 新的虚函数\n    virtual ~D1();\
    \      // 覆盖基类虚函数\n};\n```\n\n它会产生一个如下的 vtbl（虚函数表）：\n\n| D1 的 vtbl | D1::~D1 的实现\
    \ |\n| : | :--- |\n| | B::f1 的实现 |\n| | B::f2 的实现 |\n| | D1::f3 的实现 |\n| | D1::f5\
    \ 的实现 |\n\n注意对应的函数实现在 vtbl 中有对应的索引。\n\n第二个派生类将以类似的方式处理：\n\n```cpp\nclass D2: public\
    \ B {\npublic:\n    D2();\n    virtual void f3(int x);\n    ...\n};\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_18_0.png)\n\
    \n- D2 的析构函数由编译器自动生成。\n\n带有虚函数的类对象包含一个指向该类 vtbl 的指针：\n\n| 对象的 vptr | 对象的成员变量 |\n\
    | :--- | :--- |\n\n该指针被称为 vptr（“虚函数表指针”）。\n\n- 它在对象中的位置随编译器而异\n\nvptrs 指向 vtbls：\n\
    \n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_20_0.png)\n\nvptrs 由编译器通过插入构造函数和析构函数的代码来设置。\n\
    \n- 在层次结构中，每个类的构造函数都会将 vptr 指向该类的 vtbl\n- 层次结构中的析构函数也是如此。\n\n编译器允许优化掉不必要的 vptr\
    \ 赋值。\n\n- 例如，D 对象的 vptr 设置可能如下：\n\n```cpp\nD obj;\nSet vptr to B's vtbl; // 可能会被优化\n\
    Set vptr to M's vtbl; // 可能会被优化\nSet vptr to D's vtbl;\n...\nSet vptr to M's vtbl;\
    \ // 可能会被优化\nSet vptr to B's vtbl; // 可能会被优化\n```\n\nB = \"Base\", M = \"Middle\"\
    , D = \"Derived\"。\n\n考虑这段 C++ 源代码：\n\n```cpp\nvoid makeACall(B *pB)\n{\n    pB->f1();\n\
    }\n```\n\n对 f1 的调用产生的代码等同于此：\n\n```cpp\n(*pB->vptr[1])(pB); // 调用由\n// pB->vptr\
    \ 指向的 vtbl 中的第 1 个条目\n// 指向函数；pB 作为\n// \"this\" 指针传递\n```\n\n一个影响：\n\n- 当虚函数发生变化时，每个调用者都必须重新编译！\n\
    \  - 例如，如果函数在类中的顺序发生了变化\n    - 即其编译器分配的编号改变。\n  - 例如，如果函数的签名发生了变化。\n\n尺寸开销：\n\n\
    - Vptr 使每个对象变得变大\n  - 对齐限制可能导致填充（padding）\n  - 重新排列数据成员通常可以消除这个问题\n\n| vptr |\
    \ |\n| :--- | :--- |\n| double int |\n| vptr int double |\n\n- 每个类一个 vtbl 增加了每个应用程序的数据空间\n\
    \n速度开销：\n\n- 通过 vtbl 调用比直接调用慢：\n  - 但这通常只慢几条指令\n- 通常无法内联：\n  - 这通常是虚调固有的特性\n\n\
    但与 C++ 的替代方案相比：\n\n- 比 if/then/else 或基于 switch 的技术更快且更小\n- 保证结果是正确的\n\n图表显示，如果类中声明的第一个数据成员的类型需要双字对齐（例如\
    \ double 或 long double），那么在向类中添加 vptr 之后可能需要插入一个字宽的填充。如果第二个声明的数据成员大小为单字且只需要单字对齐（例如\
    \ int），则重新排列类中的数据成员可以允许编译器消除 vptr 之后的填充。\n\n# 多重继承下的对象地址\n\n在单继承（SI）下，我们通常可以这样考虑对象布局和地址：\n\
    \n```cpp\nclass B { ... };\nclass D: public B { ... };\n```\n\n- 当 D 具有虚函数时（在某些编译器中）产生异常。\n\
    \n在多重继承（MI）下，它看起来更像：\n\n```cpp\nclass B1 { ... };\nclass B2 { ... };\nclass D:\
    \ public B1, public B2 { ... };\n```\n\n- D 对象有多个地址：\n  - 一个用于 B1* 和 D*\n  - 另一个用于\
    \ B2* 指针\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_20.png)\n\nSI = “单继承”。MI\
    \ = “多继承”。\n\n# 多重继承下的对象地址\n\n在多重继承下，我们通常可以这样考虑对象布局和地址：\n\n```cpp\nclass B1 {\
    \ ... };\nclass B2 { ... };\nclass D: public B1, public B2 { ... };\n```\n\n-\
    \ D 对象有多个地址：\n  - 一个用于 B1* 和 D*\n  - 另一个用于 B2* 指针\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_24.png)\n\
    \n多重继承下的对象地址\n\n有一个理由是：\n\n```cpp\nvoid f(B1 *pb1); // 指向 B1 的顶部\nvoid g(B2 *pb2);\
    \ // 指向 B2 的顶部\n需要偏移调整\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_25.png)\n\
    \n有些调用需要偏移调整（adjustments）：\n\n```cpp\nD obj = new D;\nf((B1*)obj); // 需要偏移调整\n\
    g((B2*)obj); // 需要偏移调整\n```\n\n多重继承下的虚函数\n\n空指针不需要偏移调整：\n\n```cpp\nclass B1 {\
    \ ... };\nclass B2 { ... };\nclass D {\npublic:\n    virtual void mf();\n};\n\
    ```\n\n多重继承下的虚函数\n\n虚函数指针需要偏移调整：\n\n"
