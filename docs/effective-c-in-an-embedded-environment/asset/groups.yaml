    - Other parameter lists (types, number of parameters) are possible.\n\n- Return\
    \ types aren't always void.\n\n- Constraints on callback behavior:\n  - E.g.,\
    \ ISRs and signal handlers must be fast, safe to call asynchronously, etc.\n"
