- md: "\n# Pool Allocation\n\n- **Speed**: extremely fast; deterministic.\n- **Assuming:**\n\
    \  - No wrong-sized requests.\n  - You don't run out of memory.\n- **External\
    \ Fragmentation**: impossible.\n- **Memory leaks**: possible.\n- **Memory exhaustion**:\
    \ possible.\n\n# Block Allocation\n\nEssentially a set of pools with different\
    \ element (block) sizes:\n\n| Pool for allocations of size s1 | Pool for allocations\
    \ of size s2 | Pool for allocations of size s3 | Pool for allocations of size\
    \ s4 | Pool for allocations of size s5 |\n| --- | --- | --- | --- | --- |\n\n\
    n-byte requests handled by first pool with size ≥ n and non-null free list.\n\n\
    Useful when:\n\n- Allocations needed for a relatively small number of object sizes.\n\
    - Otherwise internal fragmentation ⇒ wasted memory.\n\nMany RTOSes offer native\
    \ support for block allocation.\n\n# Block Allocation\n\n- **Speed**: fast; nearly\
    \ deterministic (and boundable).\n- **Assuming**:\n  - No requests larger than\
    \ handled by the largest-chunk pool.\n  - You don't run out of memory.\n\n- **External\
    \ Fragmentation**: impossible.\n\n- **Memory leaks**: possible.\n\n- **Memory\
    \ exhaustion**: possible.\n\nSpeed isn't totally deterministic, because you may\
    \ need to examine multiple pools to find one with sufficient free memory.\n\n\
    # General Variable-Sized Allocation\n\nWhat new/delete/malloc/free already do.\n\
    \n- Desirable only if vendor-supplied routines unacceptable.\n\nPossible motivations:\n\
    \n- Detect overruns/underruns.\n- Gather heap usage data.\n- Size and lifetime\
    \ distributions, temporal usage patterns, etc.\n- Support data structure clustering.\n\
    - Avoid thread-safety penalty.\n- ST applications.\n- Thread-local allocators\
    \ in MT applications.\n\n# Region Allocation\n\nAn optimization for when memory\
    \ for all of a heap's objects can be released at once.\n\n- Clients call a region\
    \ member function at the appropriate time.\n- Faster than deallocating each object's\
    \ memory individually.\n- Common with LIFO allocators, but compatible with pools,\
    \ blocks, blocks, etc.\n- operator delete for individual objects is a no-op, hence\
    \ very fast.\n- Can still use delete operator to invoke destructors:\n\n```\n\
    delete p;\n// invoke *p's dtor, then operator delete on p;\n// if *p in a region,\
    \ operator delete is a no-op\n```\n\n# Summary: Dynamic Memory Management\n\n\
    - Many embedded systems include dynamic memory management.\n- Key issues are speed,\
    \ fragmentation, leaks, and memory exhaustion.\n- LIFO is fast and w/o fragmentation,\
    \ but object lifetimes must be LIFO.\n- Pools are fast and w/o fragmentation,\
    \ but object sizes are limited.\n- Block allocation is essentially multiple pool\
    \ allocators.\n- Regions excel when all heap objects can be released simultaneously.\n\
    \n# Overview\n\nDay 1 (Approximate):\n\n- \"C++\" and \"Embedded Systems\"\n-\
    \ A Deeper Look at C++\n- Implementing language inlining\n- Understanding inlining\n\
    - Avoiding code bloat\n- 3 Approaches to Interface-Based Programming\n- Dynamic\
    \ Memory Management\n- C++ and ROMability\n\n# C++ and ROM\n\nAnything can be\
    \ burned into ROM and loaded into RAM prior to program execution.\n\n- Provided\
    \ the architecture allows it.\n- Harvard does not.\n\nThe more interesting question\
    \ is:\n\n- What may remain in ROM as the program runs?\n\nThe C++ Standard is\
    \ silent on ROMing:\n\n- It allows essentially anything, guarantees nothing.\n\
    - What's ROMable is thus up to your compiler and linker.\n\nIn what follows, I\
    \ discuss what is technically possible.\n\n- Your compiler/linker probably imposes\
    \ some restrictions.\n- We'll discuss this first.\n\n# C++ and ROM\n\nTo understand\
    \ the restrictions, we need to know what a “POD type” is.\n\n- “POD” = “Plain\
    \ Old Data\"\n- All C data types are POD types.\n- C++11 classes, structs, and\
    \ unions are generally POD types if they lack:\n  - Base classes\n  - Virtual\
    \ functions\n  - Non-static data members of reference type\n  - User-defined constructors,\
    \ destructor, or assignment operators\n  - Non-static data members of non-POD\
    \ types\n\nEssentially, a C++11 class or struct is a POD type if it’s “laid out\
    \ like C and its semantics are preserved if it’s `memcpy`.”\n\n- Note that non-virtual\
    \ member functions are allowed.\n- Static data and static member functions are\
    \ allowed, too.\n\nThe definition of POD types in C++98/03 is stricter, because\
    \ protected and private non-static data members are precluded.\n\n# C++ and ROM\n\
    \nCommon restrictions on ROMing data:\n\n- Many compilers/linkers will ROM only\
    \ statically initialized POD types.\n  - As we'll see, it is technically possible\
    \ for some dynamically initialized non-PODs to be ROMed.\n- Some compilers/linkers\
    \ will ROM structs, but not classes.\n  - There is no technical reason for this\
    \ distinction.\n\n# C++ and ROM\n\nProgram instructions can always be ROMed.\n\
    \nData in a C++ program can be ROMed if it meets two criteria:\n\n- Its value\
    \ is known before runtime.\n- i.e., either the compiler or the linker knows it\
    \ or can compute it.\n- It can't be modified at runtime.\n\nThe following examples\
    \ are largely based on the ROMability section of the Technical Report on C++ Performance.\n\
    \nA full reference for the Technical Report on Performance is given in the “Further\
    \ Information” slides at the end of the notes.\n\n# C++ and ROM\n\nIf it's ROMable\
    \ in C, it's ROMable in C++:\n\n```\nstatic const int table[] = { 1, 2, 3 }; //\
    \ table is ROMable\nconst char *pc1 = \"Hello World\"; // \"Hello World\" is ROMable\n\
    \                                     // (but pc1 is not)\nconst char * const\
    \ pc2 = \"World\"; // \"World\" is ROMable (and\n                            \
    \         // may be shared with\n                                     // \"Hello\
    \ World\");\n                                     // pc2 is also ROMable\n```\n\
    \n# C++ and ROM\n\nIntegral scalar constants of static storage duration are ROMable,\
    \ but they are often optimized away entirely:\n\n```\nconst unsigned bufsize =\
    \ 128; // typically optimized away unless\n// bufsize's address is taken\n```\n\
    \nEnums take no storage, and they're safer than #defines:\n\n```\nenum { bufsize\
    \ = 128 }; // almost always optimized away\n```\n\n- No portable way to specify\
    \ the size of an enumerant in C++03:\n- Supported directly in C++11:\nenum : unsigned\
    \ short { bufsize = 128 }; // C++11\n\nSuch constants typically become immediate\
    \ operands in instructions.\n\n- If there is no advantage to using #defines in\
    \ these cases:\n- #defines don't respect scope.\n- #defines can't be private or\
    \ protected.\n\nconst objects have internal linkage, so if no const propagation\
    \ is performed, the first example on this page could yield multiple copies of\
    \ bufsize in an executable.\nPer the 2003 ISO C++ Standard (section 4.5, paragraph\
    \ 2), “An value of...an enumeration can be converted to a value of the first of\
    \ the following types that can represent all the values of its underlying type:\
    \ int, unsigned int, long, or unsigned long.” This means that even anonymous enums\
    \ can benefit from the C11 ability to specify the underlying type, because that\
    \ can affect overload resolution when enumerants are passed as parameters.\n\n\
    # C++ and ROM\n\nFor non-integral scalar constants, consts are safer than #defines\
    \ and may be\nmore efficient:\n\n```\n#define pi 3.14159      // ROMable, but\
    \ subject to\n                              // macro drawbacks\nconst double pi\
    \ = 3.14159;    // ROMable, but not subject\n                               //\
    \ to macro drawbacks\n```\n\nFloating point values can rarely be turned into immediate\
    \ operands:\n\n- They're ROMable in both forms above.\n- With a bad compiler,\
    \ the macro form might result in multiple copies of\npi in an object file.\n-\
