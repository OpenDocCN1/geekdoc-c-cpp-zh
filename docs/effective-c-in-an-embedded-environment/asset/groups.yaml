  - '[PAGE 121]


    # Block Allocation


    Essentially a set of pools with different element (block) sizes:


    | Pool for allocations of size s1 | Pool for allocations of size s2 | Pool for
    allocations of size s3 | Pool for allocations of size s4 | Pool for allocations
    of size s5 |

    | --- | --- | --- | --- | --- |


    n-byte requests handled by first pool with size ≥ n and non-null free list.


    Useful when:


    +   - Allocations needed for a relatively small number of object sizes.

    - Otherwise internal fragmentation ⇒ wasted memory.


    Many RTOSes offer native support for block allocation.'
  - "[PAGE 122]\n\n# Block Allocation\n\n+   - Speed: fast; nearly deterministic (and\
    \ boundable).\n- Assuming:\n  - No requests larger than handled by the largest-chunk\
    \ pool.\n  - You don't run out of memory.\n\n+   - External Fragmentation: impossible.\n\
    \n+   - Memory leaks: possible.\n\n+   - Memory exhaustion: possible.\n\nSpeed\
    \ isn't totally deterministic, because you may need to examine multiple pools\
    \ to find one with sufficient free memory."
