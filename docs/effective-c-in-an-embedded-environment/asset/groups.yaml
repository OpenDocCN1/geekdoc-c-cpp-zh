  - "[PAGE 67]\n\n# Avoiding Code Duplication\n\nConsider:\n\n```\nclass IntClass\
    \ {\npublic:\n    void usageInfo(std::ostream& s); // summarize usage info to\
    \ s\n    ...\n}\nclass DoubleClass {\npublic:\n    void usageInfo(std::ostream&\
    \ s); // summarize usage info to s\n    ...\n}\n```\n\nBoth usageInfo functions\
    \ will do essentially the same thing.\n\n+   - This is code duplication.\n- It\
    \ leads to code bloat.\n\nNote that no templates are involved."
  - "[PAGE 68]\n\n# Avoiding Code Duplication\n\nA common way to eliminate such duplication\
    \ is to move the duplicated code to a base class:\n\n```\nclass Base {\npublic:\n\
    \    void usageInfo(std::ostream& s); // summarize usage info to s\n    ...\n\
    protected:\n    ... // data storing usage info\n};\nclass IntClass: public Base\
    \ {\n    ...\\ // no declaration of usageInfo\n};\nclass DoubleClass: public Base\
    \ {\n    ...\\ // no declaration of usageInfo\n};\n```\n\nNow there's only one\
    \ copy of usageInfo in the program, regardless of how many classes inherit from\
    \ Base."
  - "[PAGE 69]\n\n# Avoiding Code Duplication\n\nExactly the same reasoning applies\
    \ when writing templates:\n\n```\ntemplate<typename T> // a template leading to\
    \ bloat\nclass SomeClass {\n    ...\n    void usageInfo(std::ostream& s); // leads\
    \ to code duplication if\n    ...\n    // // usageInfo makes no use of T\n};\n\
    ```\n\nThe solution is the same:\n\n```\nclass Base { // same as on previous page\n\
    public:\n    void usageInfo(std::ostream& s);\n    ...\ntemplate<typename T> //\
    \ a template avoiding bloat\nclass SomeClass: public Base {\n    ...\n// no declaration\
    \ of usageInfo\n};\n```"
  - "[PAGE 70]\n\n# Avoiding Code Duplication\n\nMoving type-invariant code into a\
    \ base class sometimes called code hoisting.\nIt can help avoid code bloat due\
    \ to multiple pointer types:\n\n```\ntemplate<typename T> // general template\n\
    class Stack { ... };\nclass GenericPtrStack { ... }; // non-template using void*s\n\
    template<typename T> // partial specialization for\nclass Stack<T*>>: // pointers;\
    \ uses void \"*\"-based\n    private GenericPtrStack { // base class for all real\
    \ work\n    ...\n};\n// all inline casting functions;\n// they generate no code\n\
    ```\n\nAll Stack instantiations for pointer types thus share their code.\n\n+\
    \   - We'll see this example in detail later."
  - "[PAGE 71]\n\n# Avoiding Code Duplication\n\nCode hoisting works well with inlining\
    \ to avoid duplication arising from non-type template parameters:\n\n```\ntemplate<typename\
    \ T, std::size_t BUFSZ> // Suspect design: each\nclass Buffer { // BUFSZ value\
    \ will yield a\n  T buffer[BUFSZ]; // new set of member functions\n  public:\n\
    \  ...\n};\n```\n\n```\ntemplate<typename T> // Better design: BufferBase\nclass\
    \ BufferBase { // is independent of BUFSZ\n  ...\n};\ntemplate<typename T, std::size_t\
    \ BUFSZ> // Buffer does only BUFSZ-\nclass Buffer: public BufferBase<T> { // dependent\
    \ operations.\n  // Ideally, all are inline, so\n  // Buffer classes cost nothing\n\
    };\n```"
  - "[PAGE 72]\n\n# Avoiding Code Duplication\n\nAvoiding code bloat with templates\
    \ fundamentally calls for disciplined commonality and variability analysis:\n\n\
    +   - The parts of a template that don't depend on the template parameters (the\
    \ common parts) should be moved out of the template.\n- The remaining parts (the\
    \ variable parts) should stay in the template.\n\nThis kind of analysis is critical\
    \ to avoiding code duplication in any guise:\n\n+   - Features common to multiple\
    \ classes should be moved out of the classes.\n  - Maybe to a base class.\n  -\
    \ Maybe to a class template.\n- Features common to multiple functions should be\
    \ moved out of the functions:\n  - Maybe to a new function.\n  - Maybe to a function\
    \ template.\n\nNeed to distinguish here between source code duplication and object\
    \ code duplication. Templates and inlines can reduce source code duplication,\
    \ but can lead to object code duplication."
