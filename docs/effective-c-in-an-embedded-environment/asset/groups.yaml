    ```


    +   - Overloading is typically a cheaper alternative.


    This slide begins a summary of the costs of various C++ language features (compared
    to C).'
  - "[PAGE 33]\n\n# More “No-Cost” C++ Features\n\nThese look like they cost you something,\
    \ but in truth they rarely do\n(compared to equivalent C behavior):\n\n+   - Constructors\
    \ and destructors:\n  - They contain code for mandatory initialization and finalization.\n\
    \  - However, they may yield chains of calls up the hierarchy.\n\n+   - Single\
