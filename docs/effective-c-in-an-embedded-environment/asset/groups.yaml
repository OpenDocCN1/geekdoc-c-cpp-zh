  - "[PAGE 77]\n\n# Interface-Based Programming\n\nInterface-based programming:\n\n\
    +   - Coding against an interface that allows multiple implementations.\n  - Function\
    \ interface.\n  - Class interface.\n\n+   - Client code unaware which implementation\
    \ it uses.\n  - It depends only on the interface."
  - "[PAGE 78]\n\n# Polymorphism\n\nPolymorphism:\n\n+   - The use of multiple implementations\
    \ through a single interface.\n\n- **Runtime**: each *call* may use a different\
    \ implementation.\n  - Use inheritance + virtual functions.\n- **Link-time**:\
    \ each link may yield a different set of implementations.\n  - Use separately\
    \ compiled function bodies.\n  - Applies to both static and dynamic linking.\n\
    - **Compile-time**: each compilation may yield a different set of implementations.\n\
    \  - Use computed typedefs.\n\nKey question: when is it known which implementation\
    \ should be used?"
