    \ ControlReg;\n```\n\n- Remember, with placement new, no memory is being allocated.\n\
    \nOnce you have pcr, you can use it to communicate with the device:\n\n```cpp\n\
    while (!pcr->ready()) // wait until the ready bit is on\npcr->enableInterrupts();\
    \ // enable device interrupts\nif (pcr->interruptsEnabled()) ... // if interrupts\
    \ are enabled...\n```\n"
  mdcn: "\n\n## C++ 与 ROM\n\nC++98 的 POD 类型封装能力有限。使用包装器通常会有帮助：\n\n```cpp\nclass Widget\
    \ { // C++98 中的非 POD\n    int x, y;               // (含有私有数据)\n};\nconst Widget\
    \ w = { 0, 0 };     // 非法 - w 不是聚合体 (aggregate)\n\nstruct Widget { // POD（且是聚合体）\n\
    \    int x, y;\n};\nconst Widget w = { 0, 0 };     // 通常会被放入 ROM\n\nclass WidgetWrapper\
    \ { // POD\n    struct Widget { int x, y; }; // 可放入 ROM\n    static const Widget\
    \ w;\n};\nconst WidgetWrapper::w = { 0, 0 }; // 通常会被放入 ROM\n```\n\n更多细节请参阅《1998\
    \ 嵌入式系统编程》。在 C++11 中，`Widget` 是 POD，但它仍然不是聚合体，无法通过 `std::initializer_list` 参数进行初始化。\n\
    \n## C++ 与 ROM\n\n某些编译器生成的数据结构通常可以放入 ROM：\n\n- 虚函数表\n- RTTI 表和 `type_info` 对象\n\
    - 支持异常处理的表\n\n如果这些对象来自动态链接库，可能无法放入 ROM。\n\n## C++ 与 ROM\n\n什么不能放入 ROM？可能会被修改的对象。\n\
    \n- 具有非平凡构造函数或析构函数的对象。\n```cpp\nclass Widget {\npublic:\n    Widget(); // 不能\n\
    \    ...\n};\n```\n- 带有 `mutable` 成员的对象。\n```cpp\nclass Widget {\n    mutable\
    \ int lastValue; // 不能\n    ...\n};\n```\n- 非 `const` 定义的对象。\n```cpp\nint x =\
    \ 1; // x 不是 const，因此不能\nstd::string s = \"\"; // s 不是 const，因此不能\n```\n- 当然，`const`\
    \ POD 仍然可以放入 ROM。\n\n## 总结：C++ 与 ROM\n\n- 大多数编译器/链接器允许静态初始化的 POD 类型。\n- 激进的可能会超出此。\n\
    - 可以将 POD 封装为 `private` 以实现 ROM。\n- 编译器生成的数据结构通常是可以放入 ROM。\n\n## 概述\n\n第 2 天（近似）：\n\
    \n- 内存映射 I/O (Memory-Mapped IO)\n- 实现回调函数\n- 有趣的应用：\n  - 类型安全的 `void*` 容器\n  -\
    \ 编译时维度分析\n  - 指定 MSs\n  - 安全关键和实时系统的考虑\n- 更多信息\n\n## 内存映射 I/O\n\n许多系统将 I/O 设备映射到地址空间的固定部分。\n\
    \n- 输入寄存器与输出寄存器分开。\n- 控制/状态寄存器与数据寄存器分开。\n- 不同的寄存器位传递如就绪或中断启用的信息。\n\nC++ 让内存映射\
    \ I/O 设备看起来像具有自然接口的对象。\n\n- 零开销。\n- 只要你有良好的\n\n## 内存映射 I/O\n\n内存映射设备可能需要特殊处理，例如：\n\
    \n- 原子读/写可能需要同步。\n- 单个位有时是只读的，有时是只写的。\n- 清除一个位可能需要赋值为 1。\n- 一个状态寄存器可能控制多个数据寄存器。\n\
    \  - 例如，0-3 位用于一个寄存器，4-7 位用于另一个。\n\n以下是内存映射 I/O 的框架，而不是具体的处方。\n\n- 框架告诉你在哪里放置设备所需的特殊处理。\n\
    \n## 控制寄存器\n\n假设我们有一个四字节的控制寄存器，如下：\n\n- 位 0 表示就绪：1 ⇒ 就绪，0 ⇒ 未就绪。\n- 位 2 表示是否启用中断：1\
    \ ⇒ 已启用，0 ⇒ 未启用。\n\n假设 `int` 大小为四字节，我们可以这样建模寄存器：\n\n```cpp\nenum { bit0 = 0x1,\
    \ bit1 = 0x2, ..., bit31 = 0x80000000 };\nclass ControlReg {\npublic:\n    bool\
    \ ready() const { return regValue & bit0; }\n    bool interruptsEnabled() const\
    \ { return regValue & bit2; }\n    void enableInterrupts() { regValue |= bit2;\
    \ }\n    void disableInterrupts() { regValue &= ~bit2; }\nprivate:\n    volatile\
    \ unsigned regValue; // 寄存器中的可能会变化\n}; // 程序控制之外\n```\n\n所有函数都是内联的，因此不会产生开销。\n\
    \n- 假设它们确实被内联了。\n\n某些类整数的工具会对 `ready` 和 `interruptsEnabled` 的实现表示不满，因为它们将操作结果作为\
    \ bool 返回。为了让这些工具安静，最好将它们写成：\n\n```cpp\nbool ready() const { return (regValue\
    \ & bit0) == true; }\n```\n\n`enableInterrupts` 和 `disableInterrupts` 使用读/修改/写指令，因此在多线程系统中可能会遇到竞态条件。\n\
    \n## 控制寄存器\n\n注意：\n\n- 在此示例中，我们假设 `unsigned int` 具有适合寄存器的尺寸和对齐方式：\n  - 如果没有，你需要选择一个符合的数据类型。\n\
    \  - `<stdint.h>` 头文件（提供如 `uint32_t`）会有帮助。\n  - C99 和 C++11 的标准。\n\n- 我们还假设寄存器是可读可写的。\n\
    - 如果是只写的，你需要缓存最近写入的值。\n\n在理论上，你可以使用 `std::aligned_storage`（或 `std::tr1::aligned_storage`）来解决对齐问题，但你可能需要担心底层存储的总量可能大于你正在建模的寄存器。对于这种应用，在我看来你想要对\
    \ `std::aligned_storage` 提供的存储量有更精确的控制。\n\n缓存最近写入的值是棘手的，因为向类中添加数据成员是不可接受的。一种可能的方法是使用按\
    \ MMIO 地址索引的外部数据结构（例如 `map`）来持有最近写入的值。\n\n## 掩码 vs 位域\n\n- 该设计特意使用掩码而不是位域。\n-\
    \ 编译器不以“明显”的方式映射位域：\n\n```cpp\nclass ControlReg {\n    unsigned int ready : 1;\
    \ // 不靠谱\n    unsigned int interruptsEnabled : 1; // 不靠谱\n};\n```\n\n- 然而，位域在某些平台上可能更快。\n\
    \n"
