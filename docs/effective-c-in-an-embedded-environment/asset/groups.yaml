  mdcn: "\n\n# 概述\n\n第 2 天（大致安排）：\n\n- 内存映射 I/O 建模\n- 从 C API 实现回调函数\n- 有趣的模板应用：\n\
    \  - 基于 void*  的类型安全容器\n  - 编译时维度单位分析\n  - 指定有限状态机 (FSMs)\n- 针对安全关键型和实时系统的考虑因素\n\
    - 更多信息\n\n# 使用模板消除常见的强制转换\n\n考虑一个 `Stack` 模板：\n\n```cpp\ntemplate<typename T>\n\
    class Stack {\npublic:\n    Stack();\n    ~Stack();\n    void push(const T& object);\n\
    \    T pop();\nprivate:\n    ...\n};\n```\n\n每个不同类型将产生一个新类：\n\n- 这可能导致大量的重复代码。\n\
    - 你可能无法承受这种代码膨胀。\n\n# 针对指针的通用栈类\n\n使用 `void*` 指针的类可以实现任何类型的（指针）栈：\n\n```cpp\n\
    class GenericPtrStack {\npublic:\n    GenericPtrStack();\n    ~GenericPtrStack();\n\
    \    void push(void *object);\n    void * pop();\n\nprivate:\n    ...\n};\n```\n\
    \n# 针对指针的通用栈类\n\n`GenericPtrStack` 有于代码共享：\n\n```cpp\nGenericPtrStack stringPtrStack;\n\
    GenericPtrStack intPtrStack;\n\nstd::string *newString = new std::string;\nint\
    \ *newInt = new int;\n\nstringPtrStack.push(newString);\nintPtrStack.push(newInt);\
    \ // 这些执行了\n//相同的代码\n```\n\n但很容易被误用：\n\n```cpp\nstringPtrStack.push(newInt); //\
    \ 哎呀...\nstd::string *sp = static_cast<std::string>(intPtrStack.pop()); // 哎呀（再次出现)...\n\
    ```\n\n代码共享很重要，但类型安全同样重要：\n\n- 我们两者都想要。\n\n# 类型安全接口\n\n我们可以通过部分特化 `Stack` 来生成基于\
    \ `void*` 的类型安全类：\n\n```cpp\ntemplate<typename T>\nclass Stack<T> {\npublic:\n\
    \    void push(T *ptr) { s.push(ptr); }\n    T * pop() { return static_cast<T*>(s.pop());\
    \ }\nprivate:\n    GenericPtrStack s; // 实现\n};\n```\n\n在运行时，`Stack<T>` 实例化的代价为零：\n\
    \n- 所有实例化都使用单个 `GenericPtrStack` 类的代码\n- 所有 `Stack<T>` 成员函数都是隐式内联（inline）的\n\n\
    类型安全的代价为零。\n\n# 类型安全接口\n\n如何强制程序员*仅*使用类型安全的类？\n\n通过将所有内容设为保护（protected）来防止直接使用\
    \ `GenericPtrStack`：\n\n```cpp\nclass GenericPtrStack {\nprotected:\n    GenericPtrStack();\n\
    \    ~GenericPtrStack();\n\n    void push(void *object);\n    void * pop();\n\n\
    private:\n    ... // 与之前相同\n};\n\nGenericPtrStack stringStack; // 错误！\nGenericPtrStack\
    \ intStack; // 错误！\n```\n\n# 类型安全接口\n\n但现在 `Stack<typename*>` 将无法编译：\n\n```cpp\n\
    template<typename T>\nclass Stack<T> {\npublic:\n    void push(T *ptr)\n    {\
    \ s.push(ptr); } // 错误！GenericPtrStack::push\n    // 是保护的\n...\nprivate:\n   \
    \ GenericPtrStack s;\n};\n```\n\n# 类型安全接口\n\n私有继承提供了访问保护成员的权限：\n\n```cpp\ntemplate<typename\
    \ T>\nclass Stack<T*>: private GenericPtrStack {\npublic:\n  void push(T *objectPtr)\n\
    \  { GenericPtrStack::push(objectPtr); }\n\n  T * pop()\n  { return static_cast<T*>(GenericPtrStack::pop());\
    \ }\n};\n```\n\n结果：\n\n- 最大的类型安全\n- 最大的效率\n\n我们是如何走到这里的？\n\n- `void*` 指针\n- 内联\
    \ (Inlining)\n- 模板\n- 保护成员\n\n# 代码膨胀、指针容器与 QOI\n\n你的 C++ 实现可能让你免于需要做此类事情：\n\n\
    - 某些标准库供应商会为你处理这些问题。\n- 某些编译器供应商（例如微软）会消除由于模板实例化产生的重复代码。\n- 该方法不仅适用于指针容器。\n- 当当\
    \ `int` 和 `long` 大小相同时，还会优化 `Template<int>` 和 `Template<long>`。\n\n在寻找手动消除代码膨胀的方法之前，请确保这确实是一个问题。\n\
    \nQOI = “实现质量”（Quality of Implementation）\n\n# 总结：消除常见的强制转换\n\n- 模板可以为不安全的代码生成类型安全的包装器。\n\
    - 内联包装器成员函数可以消除任何不安全的运行时代价。\n- 仔细的实现选择可以强制设计目标。\n\n# 强制维度单位正确性\n\n正确使用单位至关重要：\n\
    \n- 将时间赋值或比较距离是毫无意义的。\n- 将磅赋值或比较牛顿是毫无意义的。\n- 1.00 磅 ≈ 4.45 牛顿。\n- 1999 年 9 月，NASA\
    \ 的火星气候轨道飞行器（Mars Climate Orbiter）丢失。\n\n![](img/4884d44c5f6ddb1d5cbeb521d)\n\n\
    # 强制维度单位正确性\n\n正确使用单位至关重要：\n\n- 将时间赋值或比较距离是毫无意义的。\n- 将磅赋值或比较牛顿是毫无意义的。\n- 1.00\
    \ 磅 ≈ 4.45 牛顿。\n- 1999 年 9 月，NASA 的火星气候轨道飞行器丢失。\n\n![](img/4884d44c5f6ddb1d5cbeb521d)\n\
    \n# 强制维度单位正确性\n\n（此处省略重复内容，已根据要求处理）\n\n"
