    \n# C++ 与 ROM (C++ and ROM)\n\n为了理解这些限制，我们需要知道什么是“POD 类型”。\n\n- “POD” = “普通旧数据”（Plain\
    \ Old Data）\n- 所有 C 数据类型都是 POD 类型。\n- 如果 C++11 的类、结构体（struct）和联合（union）缺少以下内容，则通常是\
    \ POD 类型：\n  - 基类\n  - 虚函数\n  - 引用类型的非静态数据成员\n  - 用户定义的构造函数、析构函数或赋值运算符\n  - 非\
    \ POD 类型的非静态数据成员\n\n从本质上说，如果一个 C++11 类或结构体的“布局方式与 C 相同，且在进行 `memcpy` 时语义保持不变”，那么它就是\
    \ POD 类型。\n\n- 注意，非虚成员函数是允许的。\n- 静态数据和静态成员函数也是允许的。\n\nC++98/03 中对 POD 类型的定义更严格，因为排除了保护（protected）和私有（private）非静态数据成员。\n\
    \n# C++ 与 ROM (C++ and ROM)\n\n数据 ROM 常见限制：\n\n- 许多编译器/链接器仅 ROM静态初始化的 POD 类型。\n\
    \  - 正如我们将看到的，某些动态初始化的非 POD 类型在技术上是可以 ROM 的。\n- 某些编译器/链接器会 ROM结构体（struct），但不是类（class）。\n\
    \  - 这种区分在技术上没有理由。\n\n# C++ 与 ROM (C++ and ROM)\n\n程序指令始终可以 ROM 化。\n\nC++ 程序中的数据如果满足两个标准，就可以\
    \ ROM 化：\n\n- 它的值在运行时已知。\n  - 即：编译器或链接器知道它，或者可以计算出它。\n- 它在运行时不能被修改。\n\n以下示例很大程度上基于《C++\
    \ 性能技术报告》中的 ROM 可性章节。\n\n关于性能技术报告的完整参考见笔记结尾的“更多信息”幻灯片。\n\n# C++ 与 ROM (C++ and\
    \ ROM)\n\n如果在 C 中是可以 ROM 的，那么在 C++ 中也是可以 ROM 的：\n\n```\nstatic const int table[]\
    \ = { 1, 2, 3 }; // table 是 ROM 的\nconst char *p1 = \"Hello World\"; // p1 是 ROM\
    \ 的\nconst char *p2 = \"World\";       // p2 是 ROM 的\n```\n\n# C++ 与 ROM (C++\
    \ and ROM)\n\n具有静态存储期的整型标量常量是 ROM 的，但它们通常会被完全优化掉：\n\n```\nconst unsigned bufsize\
    \ = 128; // bufsize 是 ROM 的，除非取了地址\n```\n\n枚举（enum）不占用存储，它们比 #define 更安全：\n\n\
    ```\nenum { bufsize = 128 }; // 几乎总是被优化掉\n```\n\n- C++03 中没有可移植的方法指定枚举的大小：\n-\
    \ C++11 直接支持：\nenum : unsigned short { bufsize = 128 }; // C++11\n\n此类常量通常变成指令中的立即操作数。\n\
    \n"
