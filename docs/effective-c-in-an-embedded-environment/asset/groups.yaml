  - "[PAGE 205]\n\n# When User Data is Part of the Callback\n\nSome callbacks are\
    \ passed arbitrary user data, e.g.,\n\n```\nextern \"C\" {\n    typedef void (*ISR_t)(int,\
    \ void *pData); // callback APIs\n    void setISR(int interruptID, ISR_t isr,\
    \ void *pData); // may be like this\n}\n```\n\nThis change in signature propagates:\n\
    \n```\nextern \"C\" {\n    void isrHelper(int interruptID, void *pData)\n    {\n\
    \        try {\n            InterruptMgr::isrDispatcher(interruptID, pData);\n\
    \        } catch (...) {\n            set errno, log exception, whatever...\n\
    \        }\n    }\n}\n```"
  - "[PAGE 206]\n\n# When User Data is Part of the Callback\n\nInterruptMgr's ISRs\
    \ array can then be eliminated.\n\n+   The user data is the function pointer or\
    \ object to be invoked:\n\n```\nclass InterruptMgr {\npublic:\n    typedef std::function<void(int)>\
    \ ISRType;\n    ...\n    static void registerISR(int interruptID, ISRType *pFunc)\n\
    \    {\n        setISR(interruptID, isrHelper, pFunc);\n    }\n    static void\
    \ isrDispatcher(int interruptID, void *pFunc)\n    {\n        (\"static_cast<ISRType*>(pFunc))(interruptID);\n\
    \    }\n};\n```\n\nNote that whatever pFunc was passed to to registerISR must\
    \ continue to exist when isrDispatcher invokes it. That is, the lifetime of the\
    \ functor passed to registerISR must extend to the last time isrDispatcher will\
    \ invoke that functor. Among other things, this means that pointers to temporaries\
    \ must not be passed to registerISR."
