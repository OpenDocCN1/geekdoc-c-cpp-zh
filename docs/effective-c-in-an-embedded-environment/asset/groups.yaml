    \n# 嵌入式环境下的有效 C++\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_2_0.png)\n\n© 2012\
    \ Scott Meyers，保留所有权利。\n最后修订：12/10/4\n\n这些是 Scott Meyers 培训课程“嵌入式环境下的有效 C++”的官方笔记。课程描述见\
    \ http://www.aristacom.com/c++/in-embedded.html。许可信息见 http://aristacom.com/Licensing/licensing.html。请将错误报告和改进建议发送至\
    \ smeyers@aristacom.com。\n\n在这些笔记中，以 N 前缀的编号文档（例如 N3092）是指 C++ 标准化文档。所有文档均可通过\
    \ http://www.open-std.org/jtc1/sc22/wg21/docs/papers/ 获取。\n\n[大括号中的注释，如所示，旨在面向主授该课程的讲师。所有其他注释都对讲师和独立阅读笔记的人来说有所帮助。]\n\
    \nScott Meyers，软件开发顾问\n\n© 2012 Scott Meyers，保留所有权利。\n\n嵌入式环境下的有效 C++\n\n# 重要！\n\
    \n在本次讲座中，我假设你了解所有的 C++。\n你可能并不了解。\n\n当你看到或听到你不认识的内容时，请尽管提问！\n\nScott Meyers，软件开发顾问\n\
    http://www.aristela.com/\n\n© 2012 Scott Meyers，保留所有权利。\n\n幻灯片 2\n\nScott Meyers，软件开发顾问\n\
    \n© 2012 Scott Meyers，保留所有权利。\n\n# 概述\n\n第一天（约略）：\n\n- “C++”与“嵌入式系统”\n- 深入探讨 C++\n\
    \  - 语言特性的实现\n  - 理解内联（inlining）\n  - 避免代码膨胀\n- 基于接口编程的三方法\n- 动态内存管理\n- C++ 与\
    \ ROM 可性（ROMability）\n\n# 概述\n\n第二天（约略）：\n\n- 内存映射 I/O 的建模\n- 从 C API 实现回调函数\n\
    - 有趣的模板应用：\n  - 基于 void* 的类型安全容器\n  - 编译时维度单位分析\n  - 指定有限状态机（FSMs）\n- 安全关键型和实时系统的考量\n\
    - 更多信息\n\n# 议程\n\n始终关注\n\n- 安全关键型和实时系统的考量\n- 更多信息\n\n- 始终关注\n\n- 你的问题、意见、问题等。\n\
    - 本课程的首要目标是涵盖你想了解的。\n\n# 概述\n\n第一天（约略）：\n\n- “C++”与“嵌入式系统”\n- 深入探讨 C++\n- 语言特性的实现\n\
    - 理解内联\n- 避免代码膨胀\n- 基于接口编程的三方法\n- 动态内存管理\n- C++ 与 ROM 可性\n\n# “C++”\n\n时间线：\n\n\
    - 1998: C++98: 标准。\n- 2003: C++03: 修订版。\n- 2005: TR1: 提议。\n- 2011: C++11: 新标准。\n\
    - 后续。\n\n# “嵌入式系统”\n\n嵌入式系统是多化的：\n\n- 实时？可能。\n- 安全关键型？可能。\n- 内存限制？可能。\n- CPU 限制？可能。\n\
    - 没有堆？可能。\n- 没有操作系统？可能。\n- 多线程？可能。\n- 虚函数？可能。\n- 硬件限制？可能。\n\n# 开发嵌入式系统\n\n通常情况下，开发嵌入式系统：\n\
    \n- 虚函数必须谨慎使用。\n- 语言特性必须谨慎使用。\n- 必须是。\n- 嵌入式系统开发。\n- 必须是的。\n\n# 概述\n\n第二天（约略）：\n\
    \n- 内存映射 I/O 的建模\n- 从 C API 实现回调函数\n- 有趣的模板应用：\n  - 基于 void* 的类型安全容器\n  - 编译时维度单位分析\n\
    \  - 指定有限状态机（FSMs）\n- 安全关键型和实时系统的考量\n- 更多信息\n\n# 深入探讨 C++\n\n深入探讨 C++\n\n- 语言特性的实现\n\
    - 理解内联\n- 避免代码膨胀\n- 基于接口编程的三方法\n- 动态内存管理\n- C++ 与 ROM 可性\n\n# 有效 C++\n\n为什么你关心？\n\
    \n- 你只是好奇：它们是如何实现的？\n- 你在调试时试图弄清楚发生了什么。\n- 你在担心：效率足够吗？\n- 这是本次演示的重点\n- 基准：大小。\n\
    \n请相信：\n\n- C++ 的设计是为了在性能上与 C 竞争。\n- 一般来说，你不需要为不使用的部分买单。\n\n# 虚函数的实现\n\n所有进入此地的人，放弃绝望吧！\n\
    \n- 编译器被允许以任何方式实现虚函数：\n- 没有强制性的“标准”实现。\n\n- 下述描述对大多数实现是正确的：\n- 我略过了几个细节\n- 这些细节不影响虚函数通常是高效实现的。\n\
    \n# 虚函数的实现\n\n考虑这个类：\n\n```\nclass B {\npublic:\n    B();\n    virtual ~B();\n\
    \    virtual void f1();\n    virtual int f2(char c) const;\n    virtual void f3(int\
    \ x) = 0;\n\n    void f4() const;\n    ..\n}\n```\n\n编译器通常按照声明顺序为虚函数编号。在这个示例中，\n\
    \n- 析构函数是 0\n- f1 是 1，f2 是 2，f3 是 3\n\n非虚函数没有编号。\n\n# 虚函数的实现\n\n将为该类生成 vtbl（虚函数表）。它看起来像这样：\n\
    \n- B::~B 的实现\n- B::f1 的实现\n- B::f2 的实现\n- ??\n\n说明：\n\n- vtbl 是函数指针的数组\n- 第 i\
    \ 个元素指向编号为 i 的虚函数\n- 对于纯虚函数，该条目是什么是未定义的。\n- 它通常是一个发出错误并退出的函数。\n\n- 非虚函数（包括构造函数）被省略：\n\
    - 非虚函数的实现方式就像 C 中的函数\n\n根据 Paul Chisholm 编写的“调用纯虚函数”文章（参见笔记末尾的“更多信息”幻灯片，Digital\
    \ Mars 编译器在调用纯虚函数时并不总是发出消息，它只是停止程序执行）。\n\n"
