    \ unsigned*>(dataAddr) = value; }\n    // 成员变量现在消失\n};\n```\n\n`OutputDevice2`\
    \ 使用静态成员函数来避免传递这些指针。\n\n如 `control` 和 `write` 等静态成员函数可以在 `OutputDevice2` 类型的对象构造之前被调用，这可能会产生问题，但通常情况下且在本例中，如果如下一页所示，`ControlReg`\
    \ 在使用前需要构造，则可以通过使用非静态成员函数来避免此类问题。调用此类函数会导致不必要的 `this` 指针被传递给成员函数（优化除外）。\n\n# 输出设备的建模，方案\
    \ 2\n\n此示例假设 `ControlReg` 的构造函数/析构函数什么什么都不做。\n\n- 否则，`OutputDevice2` 需要一个构造函数/析构函数来调用它们（例如通过\
    \ placement new）。\n\n```cpp\ntemplate<unsigned controlAddr, unsigned dataAddr>\n\
    class OutputDevice2 {\npublic:\n    OutputDevice2()\n    { new (reinterpret_cast<ControlReg*>(controlAddr))\
    \ ControlReg; }\n    ...\n};\n```\n\n- 这种初始化/清理必须只发生一次！\n  - 如果一个硬件设备存在多个 `OutputDevice2`\
    \ 对象，则会有问题。\n  - 使用单例（Singleton）来防止多次实例化？\n  - 使用静态 `alreadyInitialized/alreadyCleaned`\
    \ 标记？\n\n# 输出设备的建模，方案 2\n\n客户端代码看起来与之前几乎相同：\n\n```cpp\nOutputDevice2<0xFFFF0000,\
    \ 0xFFFF0004> od;\nunsigned x;\n...\nwhile (!od.control().ready()); // 等待就位位开启\n\
