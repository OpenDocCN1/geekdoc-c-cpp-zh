    \ 小。\n- `OutputDevice2` 代码可能比 `OutputDevice1` 更小/更快。\n  无需通过指针间接访问。\n\n感谢 Siegfried\
    \ Jäkel 提供的这种方法。\n\n# 输出设备的建模，方案 3\n\n如果像本例所示，控制数据寄存器位于连续内存中，可以使用第三种设计：\n\n- 直接在\
    \ MMIO 位置上创建对象：\n```cpp\nclass OutputDevice {\npublic:\n    ControlReg& control()\
    \ { return cr; }\n    void write(unsigned value) { data = value; }\n\nprivate:\n\
    \    OutputDevice(const OutputDevice&); // 防止拷贝\n    ControlReg cr;\n    volatile\
    \ unsigned data;\n};\n```\n\n- 让客户端自行使用 placement new（或裸强制转换）：\n\n```cpp\n// 在地址\
    \ 0xFFFF0000 创建 OutputDevice3\nOutputDevice& od = new (reinterpret_cast<void*>(0xFFFF0000))\
    \ OutputDevice;\n```\n\n# 直接建模硬件\n\n因此，有两种用于内存映射 IO 的类。一类*直接*建模硬件。\n\n- 此类创建的对象由客户端在特定地址创建。\n\
    \  通过 placement *new* 或 *reinterpret_cast*。\n- 它们仅映射到 MMIO 寄存器的非静态数据：\n\n```cpp\n\
    class OutputDevice3 {\n    // 设计为在 MMIO 中实例化\nprivate:\n    OutputDevice3(const\
    \ OutputDevice3&);\n    ControlReg cr;           // 数据成员直接映射\n    volatile unsigned\
    \ data; // 到 MMIO 设备寄存器\n};\n```\n\n- 静态数据是可以的。\n\n- 它们永远不包含虚函数。\n\n- 虚函数会导致每个对象内部有一个\
    \ *vptr*。\n\n# 间接建模硬件\n\n另一类间接建模硬件。\n\n- 此类创建的对象不在特定地址创建。\n  - 客户端将 MMIO 地址作为模板或构造函数地址传递。\n\
    - 它们可能包含“额外的”成员变量。\n  - 即不对应于 MMIO 设备寄存器的成员。\n\n```cpp\nclass OutputDevice1 {\n\
