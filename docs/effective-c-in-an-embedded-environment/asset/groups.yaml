    # Callbacks via std::function and std::bind


    Functionality present in C++11 and TR1.


    +   - std::function: generalized function pointer; holds any callable entity.

    - std::bind: creates function objects holding callable entities and some parameter
    values.

    - Can do more, but this suffices here.

    - Result often stored in a std::function object.


    TR1 versions are in a nested namespace:


    +   - std::function ⇒ std::tr1::function.

    - std::bind ⇒ std::tr1::bind.'
- md: "\n## Function Types and std::function\n\nA function's type is its declaration\
    \ w/o any names:\n\n```\nvoid f1(int x);                       // type is void(int)\n\
    ```\n\n```\ndouble f2(int x, std::string& s);    // type is double(int, std::string&)\n\
    ```\n\nstd::function's template parameter specifies its target function type:\n\
    \n```\nstd::function<void(int)> func;   // func can hold any callable entity\n\
    \                              // compatible with the type void(int)\n```\n\n\
    ## Callbacks via std::function\n\nChanges to InterruptMgr are small:\n\n```cpp\n\
    class InterruptMgr {\npublic:\n    typedef std::function<void(int)> ISRType;\n\
    \    static void registerISR(int interruptID, ISRType isr) { ... }\n    static\
    \ void isrDispatcher(int interruptID)\n    {\n        ISRs[interruptID](interruptID);\
    \ // note lack of \"->isr\"; function\n        // call syntax is used instead\n\
    \    }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS]; // array of std::function\
    \ objects\n};\n```\n\nAn ISRType object:\n\n- Holds anything callable with an\
    \ int and returning anything.\n- It's a generalized function pointer.\n- Is invoked\
    \ using function syntax.\n  - E.g., inside InterruptMgr::isrDispatcher.\n\n##\
    \ Callbacks via std::function\n\nTimerISR and KeyboardISR are unchanged, except:\n\
    \n- They have no base class.\n- ISRBase is no longer necessary.\n\n- The ISR signatures\
    \ (e.g., constness) need not be identical, either.\n\n```cpp\nclass TimerISR {\
    \ // no base class\npublic:\n    void isr(int interruptID); // nonvirtual function\
    \ (non-const)\n};\nclass KeyboardISR { // no base class\npublic:\n    void isr(int\
    \ interruptID) const; // nonvirtual function (const)\n};\n```\n\n## Callbacks\
    \ via std::function and std::bind\n\nTo register an ISR with InterruptMgr, we\
    \ create a function object that holds:\n\n- The ISR member function.\n- The object\
    \ on which that function should be invoked.\n\n```cpp\nTimerISR t; // as before\n\
    KeyboardISR k; // as before\n\n// on a timer interrupt, call t.isr\nInterruptMgr::registerISR(TIMER_INT_NUM,\n\
    std::bind(&TimerISR::isr, &t, _1));\n\n// on a keyboard interrupt, call k.isr\n\
    InterruptMgr::registerISR(KEYBOARD_INT_NUM,\nstd::bind(&KeyboardISR::isr, &k,\
    \ _1));\n```\n\n- Details on binding coming soon.\n\nThe call to bind on this\
    \ page won't compile as shown unless std::placeholders::_1 has been made visible\
    \ (e.g., via a using declaration). This is virtually always done in code that\
    \ uses bind.\n\n## Callbacks via std::function and std::bind\n\nConsider what\
    \ happens when a timer interrupt occurs:\n\n1. As before, C API calls isrHelper.\n\
    2. As before, isrHelper calls InterruptMgr::isrDispatcher.\n3. InterruptMgr::isrDispatcher\
    \ calls member function held by std::function object ISRs[TIMER_INT_NUM].\n- This\
    \ resolves to this->isr via member function pointer.\n\nInterruptMgr::isrDispatcher\
    \ is still inline, so at runtime we expect:\n\n1. C API calls isrHelper.\n2. isrHelper\
    \ calls this->isr via member function pointer.\n\nSimilarly, when a keyboard interrupt\
    \ occurs:\n\n1. C API calls isrHelper.\n2. isrHelper calls k.isr via member function\
    \ pointer.\n\n## Details on std::bind\n\n```cpp\nvoid f(int x, int y);\n// function\
    \ to ultimately call\nstd::function<void(int)> pbf = // pbf = \"partially bound\
    \ f\";\nstd::bind(f, 10, _1); // f's x param set to 10\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_197_0.png)\n\
    \n```cpp\npbf(20);\n```\n\n```\n// same as f(10, 20)\n```\n\nNote that pbf is\
    \ called like a function.\n\nThe call to bind on this page will not compile as\
    \ shown unless std::placeholders::_1 has been made visible (e.g., via a using\
    \ declaration). This is virtually always done in code that uses bind.\n\nThe diagram\
    \ is conceptual rather than rigorously accurate. In particular, it fails to show\
    \ how pbf contains a copy of the object produced by bind, depicting instead that\
    \ s's inside that bind-produced object is inside pbf. There is no return value\
    \ shown in the diagram, because pbf's signature has a void return type.\n\n##\
    \ Details on std::bind\n\nWhen binding non-static member functions, *this object\
    \ is parameter #1:\n\n```cpp\nclass TimerISR {\npublic:\n    ...\n    void isr(int\
    \ interruptID);\n};\n```\n\n```cpp\n// as before\n// std::bind sees two params:\n\
    // *this is #1, interruptID is #2\n```\n\nSo std::bind(&TimerISR::isr, &this,\
    \ _1) yields:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_198_0.png)\n\n## Callbacks\
    \ via std::function and std::bind\n\nHence:\n\n```cpp\nTimerISR t; // as before\n\
    KeyboardISR k;\nInterruptMgr::registerISR(TIMER_INT_NUM,\nstd::bind(&TimerISR::isr,\
    \ &this, &_1));\n```\n\nbind's return value\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_199_0.png)\n\
    \n```cpp\nInterruptMgr::registerISR(KEYBOARD_INT_NUM,\nstd::bind(&KeyboardISR::isr,\
    \ &k, &_1));\n```\n\nbind's return value\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_199_1.png)\n\
    \n> Scott Meyers, Software Development Consultant\nhttp://www.artistela.com/\n\
    © 2012 Scott Meyers, all rights reserved. Slide 198\n\nThe calls to bind on this\
    \ page will not compile as shown unless std::placeholders::_1 has been made visible\
    \ (e.g., via a using declaration). This is virtually always done in code that\
    \ uses bind.\n\n## Flexibility in std::function\n\nstd::function works with member\
    \ functions and non-member functions, too:\n\n```cpp\nclass Timer {\npublic:\n\
    \    static void on(int interruptID); // static mem.\n};\n\nInterruptMgr::registerISR(TIMER_INT_NUM,\n\
    std::bind(&Timer::on, _1)); // okay\n```\n\n```cpp\nvoid handleBInt(int interruptID);\
    \ // non-const\n\nInterruptMgr::registerISR(KEYBOARD_INT_NUM,\nstd::bind(&handleBInt,\
    \ _1)); // long\n```\n\n## Assessment: Using std::function and std::bind\n\nAdvantages:\n\
    \n- No need for user-defined classes.\n- Function objects:\n  - Static member\
    \ functions\n- Callback signatures need only be compatible with target.\n\n##\
    \ Assessment: std::function and std::bind\n\nDisadvantages:\n\n- TR1 implementations\
    \ common, but not ubiquitous.\n- Some developers unfamiliar with TR1.\n- Open-source\
    \ and commercial versions of bind exist.\n- std::function objects have costs:\n\
    \  - They may allocate memory.\n  - Some implementations may use virtual functions.\n\
    \n## (Simple) Performance Comparison\n\n| VC11 beta /Ox | Non-Members | Virtuals\
    \ | std::function |\n| :--- | :--- | :--- | :--- |\n| Average of 5 trials | 238.6\
    \ | 391.4 | 590.8 |\n| Ratio to non-member call | 1.0 | 1.6 | 2.5 |\n\n| Using\
    \ g++ 4.7 -O3 | | Non-Members | Virtuals | std::function |\n| :--- | :--- | :---\
    \ | :--- |\n| Average of 5 trials | 291.9 | 426.4 | 755.4 |\n| Ratio to non-member\
    \ call | 1.0 | 1.5 | 2.6 |\n\n| Using Boost 1.49 / g++ 4.7 -O3 | Non-Members |\
    \ Virtuals | boost::function | Non-Members | Virtuals | boost::function |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| Average of 5 trials | 259.5 |\
    \ 390.4 | 921.5 | 293.1 | 468.6 | 787.9 |\n| Ratio to non-member call | 1.0 |\
    \ 1.5 | 3.6 | 1.0 | 1.6 | 2.7 |\n| boost::function/Virtuals | | | 2.4 | | | |\n\
    \n- Virtuals notably slower than non-members.\n- Performance using std::function\
    \ varies with libraries and compilers.\n- As little as 50% slower, as much as\
    \ 140% slower.\n\n## (Simple) Performance Comparison\n\nBenchmark setup:\n\n-\
    \ Lenovo W510 laptop (Intel quad-core Core i7, 4GB RAM, Win64)\n- Do-nothing callbacks,\
    \ i.e., empty bodies.\n  - Only callback overhead overhead was measured.\n   \
    \ - Callback execution often – typically? – swamps calling overhead.\n- Maximum\
    \ compiler optimizations enabled.\n\n- All- Embedded developers often disable\
    \ EH and RTTI.\n\nIf performance is important to you, do your own tests.\n\n-\
    \ And let me know what you find out....\n"
