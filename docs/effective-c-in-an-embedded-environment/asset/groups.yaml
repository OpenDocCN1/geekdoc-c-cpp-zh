    # Enforcing Dimensional Unit Correctness


    Real implementations typically use more template arguments for Units:


    +   - One specifies the precision of the value (typically float or double)

    - The others are for the exponents of the seven SI units:

    - Mass

    - Distance

    - Time

    - Current

    - Temperature

    - Luminous intensity

    - Amount of substance'
  - "[PAGE 238]\n\n# # Enforcing Dimensional Unit Correctness\n\n```\ntemplate<class\
    \ T, int m, int d, int t, int q, int k, int i, int a>\nclass Units {\npublic:\n\
    \    explicit Units(T initVal = 0) : val(initVal) {}\n    T& value() { return\
    \ val; }\n    const T& value() const { return val; }\n\nprivate:\n    T val;\n\
    };\n```\n\n```\ntemplate<class T, int m1, int d1, int t1, int q1, int k1, int\
    \ i1, int a1,\n                         int m2, int d2, int t2, int q2, int k2,\
    \ int i2, int a2>\nUnits<T, m1+m2, d1+d2, t1+t2, q1+q2, k1+k2, i1+i2, a1+a2>\n\
    operator*(const Units<T, m1, d1, t1, q1, k1, i1, a1>& lhs,\n          const Units<T,\
    \ m2, d2, t2, q2, k2, i2, a2>& rhs)\n{\n    typedef Units<T, m1+m2, d1+d2, t1+t2,\
    \ q1+q2, k1+k2, i1+i2, a1+a2> ResultType;\n    return ResultType(lhs.value() *\
    \ rhs.value());\n}\n```"
  - "[PAGE 239]\n\n# # Dimensionless Quantities\n\nDimensionless quantities (i.e.,\
    \ objects of type Units<T,0,0,0,0,0,0,0>) should be type-compatible with unitless\
    \ types (e.g., int, double, etc.).\n\n+   Partial template specialization can\
    \ help:\n\n```\ntemplate<typename T>\nclass Units<T, 0, 0, 0, 0, 0, 0, 0>\npublic:\n\
    \    Units(T initVal = 0): val(initVal) {} // allow implicit conversion\n    operator\
    \ T() const { return val; } // to/from values of type T\n    Units& operator=(T\
    \ newVal) // allow assignments from\n    { val = newVal; return *this; } // values\
    \ of type T\n    ...\nprivate:\n    T val;\n};\n```\n\nIf partial template specialization\
    \ is unavailable, you can totally specialize for e.g., T = double and/or T = float."
  - "[PAGE 240]\n\n# Efficiency\n\nSome compilers won't put objects in registers:\n\
    \n+   - A Units<double, ...> may yield worse code than a raw double.\n\nIdea:\n\
    \n+   - Two sets of headers, checking a set and a no-op set.\n\n```\n// checking\
    \ header // no-op header\ntemplate<...>\ntypef double UnitPrecision;\nclass Units\
    \ {\n    ...\n}\ntypef Units<...,...> Mass; typedef UnitPrecision Mass;\ntypef\
    \ Units<...,...> Distance; typedef UnitPrecision Distance;\ntypef Units<...,...>\
    \ Velocity; typedef UnitPrecision Velocity;\ntypef Units<...,...> Force; typedef\
    \ UnitPrecision Force;\n...\n```\n\nChecking header uses Units template, non-checking\
    \ header doesn't:\n\nThe “Idea” sketched on this slide and the next is just that\
    \ that. I have not implemented it, so there may be problems I have not anticipated."
  - "[PAGE 241]\n\n# Efficiency\n\n+   - Choose header set at build time.\n- Using\
    \ checking headers catches all errors.\n- Using no-op headers generates optimal\
    \ code.\n- Clean compilation with checking headers ⇒ no unit errors:\n- No-op\
    \ headers can then safely be used.\n  - E.g., velocity-acceleration errors can't\
    \ exist in code.\n\nCaveats:\n\n+   double computeValue(Mass m); // 3 functions\
    \ with\ndouble computeValue(Distance d); // checking headers,\ndouble computeValue(double\
    \ d); // only 1 with typedefs\n\n+   - Could lead to undefined behavior via ODR\
    \ violation.\n\nODR = “One Definition Rule”.\nIf the three versions of computeValue\
    \ are compiled separately with the checking headers and linked with object file\
    \ compiled with the unchecked headers, the system will have an inconsistent definition\
    \ of computeValue."
