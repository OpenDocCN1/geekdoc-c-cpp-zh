- md: "\n# Instantiating Templates\n\nInstantiated templates may generate both code\
    \ and data:\n\n```\nSomeClass<int> sc;\n// SomeClass<int> instantiated;\n// some\
    \ code generated, memory\n// for static class data set aside\n```\n\nInstantiating\
    \ a class shouldn't instantiate all its member functions:\n\n+   - Only member\
    \ functions that are used should be instantiated.\n  -> You shouldn't pay for\
    \ what you don't use.\n- A few compilers (typically older ones) get this wrong.\n\
    \  -> They instantiate all member functions of a class if any is used.\n  -> We'll\
    \ discuss how to avoid this in a moment.\n\n# Instantiating Templates\n\nMost\
    \ templates are implicitly instantiated:\n\n+   - Compiler notes used functions,\
    \ instantiates them automatically.\n- To create the functions, it needs access\
    \ to their definitions.\n  - This is why template code is typically in header\
    \ files.\n- Without a definition, compiler generates reference to external symbol.\n\
    \  - Hence SomeClass::mf2 callable w/o a definition, but a link-time error will\
    \ result.\n\nTemplates can also be explicitly instantiated:\n\n+   - You can force\
    \ a class or function template to be instantiated.\n- For class templates, all\
    \ member functions are instantiated.\n- Individual member functions can also be\
    \ instantiated.\n\n# Explicit Instantiation\n\nIn a .h file:\n\n```\ntemplate<typename\
    \ T>      // as before\nclass SomeClass {\npublic:\n    SomeClass() { ... }\n\
    \    void mf1() { ... }\n    void mf2();\n};\n```\n\nIn a .cpp file:\n\n```\n\
    // Definitions of SomeClass's non-inline functions go here\ntemplate\nclass SomeClass<double>;\
    \      // explicitly instantiate all SomeClass\n// mem funcs for T=double; compiled\n\
    // code will go in this .cpp's .obj file\n\ntemplate\nvoid SomeClass<int>::mf2();\
    \      // explicitly instantiate SomeClass::mf2\n// for T=int; compiled code will\
    \ go in\n// this .cpp's .obj file\n```\n\n# Explicit Instantiation\n\nExplicit\
    \ instantiation can be a lot of work:\n\n+   - You must manually list each template\
    \ and set of instantiation parameters to be instantiated.\n\nBut it can be useful:\n\
    \n+   - To create libraries of instantiations.\n- To put instantiations into particular\
    \ code sections.\n- To avoid code bloat arising from bad compilers/linkers.\n\
    - Details on next page.\n\n# Explicit Instantiation\n\nYour executable might end\
    \ up with multiple copies of an instantiation:\n\n+   If your compiler (incorrectly)\
    \ instantiates all class template member functions when only some are used.\n\n\
    +   If your linker is bad:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_66_0.png)\n\
    \n+   If you use dynamic linking.\n\nIn the diagrams, code in red is function\
    \ definitions, code in magenta is function declarations (or in an object file,\
    \ references to external symbols), and code in black is function calls.\n\n# Avoiding\
    \ Code Duplication\n\nConsider:\n\n```\nclass IntClass {\npublic:\n    void usageInfo(std::ostream&\
    \ s); // summarize usage info to s\n    ...\n}\nclass DoubleClass {\npublic:\n\
    \    void usageInfo(std::ostream& s); // summarize usage info to s\n    ...\n\
    }\n```\n\nBoth usageInfo functions will do essentially the same thing.\n\n+  \
    \ - This is code duplication.\n- It leads to code bloat.\n\nNote that no templates\
    \ are involved.\n\n# Avoiding Code Duplication\n\nA common way to eliminate such\
    \ duplication is to move the duplicated code to a base class:\n\n```\nclass Base\
    \ {\npublic:\n    void usageInfo(std::ostream& s); // summarize usage info to\
    \ s\n    ...\nprotected:\n    ... // data storing usage info\n};\nclass IntClass:\
    \ public Base {\n    ...\\ // no declaration of usageInfo\n};\nclass DoubleClass:\
    \ public Base {\n    ...\\ // no declaration of usageInfo\n};\n```\n\nNow there's\
    \ only one copy of usageInfo in the program, regardless of how many classes inherit\
    \ from Base.\n\n# Avoiding Code Duplication\n\nExactly the same reasoning applies\
    \ when writing templates:\n\n```\ntemplate<typename T> // a template leading to\
    \ bloat\nclass SomeClass {\n    ...\n    void usageInfo(std::ostream& s); // leads\
    \ to code duplication if\n    ...\n    // // usageInfo makes no use of T\n};\n\
    ```\n\nThe solution is the same:\n\n```\nclass Base { // same as on previous page\n\
    public:\n    void usageInfo(std::ostream& s);\n    ...\ntemplate<typename T> //\
    \ a template avoiding bloat\nclass SomeClass: public Base {\n    ...\n// no declaration\
    \ of usageInfo\n};\n```\n\n# Avoiding Code Duplication\n\nMoving type-invariant\
    \ code into a base class sometimes called code hoisting.\nIt can help avoid code\
    \ bloat due to multiple pointer types:\n\n```\ntemplate<typename T> // general\
    \ template\nclass Stack { ... };\nclass GenericPtrStack { ... }; // non-template\
    \ using void*s\ntemplate<typename T> // partial specialization for\nclass Stack<T*>>:\
    \ // pointers; uses void \"*\"-based\n    private GenericPtrStack { // base class\
    \ for all real work\n    ...\n};\n// all inline casting functions;\n// they generate\
    \ no code\n```\n\nAll Stack instantiations for pointer types thus share their\
    \ code.\n\n+   - We'll see this example in detail later.\n\n# Avoiding Code Duplication\n\
    \nCode hoisting works well with inlining to avoid duplication arising from non-type\
    \ template parameters:\n\n```cpp\ntemplate<typename T, std::size_t BUFSZ> // Suspect\
    \ design: each\nclass Buffer { // BUFSZ value will yield a\n  T buffer[BUFSZ];\
    \ // new set of member functions\n  public:\n  ...\n};\n```\n\n```cpp\ntemplate<typename\
    \ T> // Better design: BufferBase\nclass BufferBase { // is independent of BUFSZ\n\
    \  ...\n};\ntemplate<typename T, std::size_t BUFSZ> // Buffer does only BUFSZ-\n\
    class Buffer: public BufferBase<T> { // dependent operations.\n  // Ideally, all\
    \ are inline, so\n  // Buffer classes cost nothing\n};\n```\n\n# Avoiding Code\
    \ Duplication\n\nAvoiding code bloat with templates fundamentally calls for disciplined\
    \ commonality and variability analysis:\n\n+   - The parts of a template that\
    \ don't depend on the template parameters (the common parts) should be moved out\
    \ of the template.\n- The remaining parts (the variable parts) should stay in\
    \ the template.\n\nThis kind of analysis is critical to avoiding code duplication\
    \ in any guise:\n\n+   - Features common to multiple classes should be moved out\
    \ of the classes.\n  - Maybe to a base class.\n  - Maybe to a class template.\n\
    - Features common to multiple functions should be moved out of the functions:\n\
    \  - Maybe to a new function.\n  - Maybe to a function template.\n\nNeed to distinguish\
    \ here between source code duplication and object code duplication. Templates\
    \ and inlines can reduce source code duplication, but can lead to object code\
    \ duplication.\n\n# Code Bloat Summary\n\nMost bloat can be eliminated by careful\
    \ design. Arrows in your quiver:\n\n+   - Consider disabling support for exceptions.\n\
    - Consider stdio instead of iostre.\n- Avoid excessive inlining, especially with\
    \ templates.\n- Judiciously use explicit instantiation to avoid code duplication.\n\
    - Hoist parameter-independent code out of templates.\n\n# Dealing with Function\
    \ Templates\n\nWe've discussed only class templates, but bloat elimination techniques\
    \ for\nfunction templates are similar:\n\n```cpp\ntemplate<typename T>\nvoid doSomething(const\
    \ T& obj)\n{\n    ...\n    ...\n}\n// template leading to bloat\n// code making\
    \ use of T or obj\n// code independent of T or obj\n// code making use of T or\
    \ obj\n```\n\nA “hoisting” alternative:\n\n```cpp\nvoid doSomethingHelper();\n\
    template<typename T>\nvoid doSomething(const T& obj)\n{\n    ...\n    doSomethingHelper();\n\
    \    ...\n}\n// \"hoisted\" code in non-template\n// function; not inline\n//\
    \ revised template avoiding bloat\n// code making use of T or obj\n// code making\
    \ use of T or obj\n```\n\n# Data Bloat\n\nNot all bloat is due to code. Unnecessary\
    \ classes can yield data bloat, to:\n\n+   - Some classes have a vtbl\n\nAn important\
    \ exception to these issues are class templates that:\n\n+   - Contain only inline\
    \ functions.\n  - Hence no extra EH tables.\n- Contain no virtual functions.\n\
    \  - Hence no extra vbtls.\n\nWe'll see examples of such “bloat-free” templates\
    \ later.\n\n# Overview\n\nDay 1 (Approximate):\n\n+   * \"C++\" and \"Embedded\
    \ Systems\"\n* A Deeper Look at C++\n  * Implementing language features\n  * Understanding\
    \ inlining\n  * Avoiding code bloat\n* 3 Approaches to Interface-Based Programming\n\
    * Dynamic Memory Management\n* C++ and ROMability\n"
  mdcn: "\n\n# 模板实例化\n\n实例化的模板可能会同时生成代码和数据：\n\n```\nSomeClass<int> sc;\n// SomeClass<int>\
    \ instantiated;\n// 生成了某些代码，内存\n// 为静态类数据留出了空间\n```\n\n实例化一个类不应该实例化它所有的成员函数：\n\
    \n+   - 只应该实例化被用到的成员函数。\n  -> 你不应该为你未使用的东西买单。\n- 少数编译器（通常是旧版本的编译器）会犯这个错误。\n  ->\
    \ 只要有任何成员函数被使用，它们就会实例化该类的所有成员函数。\n  -> 我们稍后会讨论如何避免这种情况。\n\n# 模板实例化\n\n大多数模板是隐式实例化的：\n\
    \n+   - 编译器记录用过的函数，并自动实例化它们。\n- 为了创建这些函数，它需要访问它们的定义。\n  - 这就是为什么模板代码通常放在头文件中的。\n\
    - 如果没有定义，编译器会生成对外部符号的引用。\n  - 因此 `SomeClass::mf2` 在没有定义的情况下可以调用，但会导致链接时错误。\n\n\
    模板也可以被显式实例化：\n\n+   - 你可以强制类模板或函数模板进行实例化。\n- 对于类模板，所有的成员函数都会被实例化。\n- 单独的成员函数也可以被实例化。\n\
    \n# 显式实例化\n\n在 .h 文件中：\n\n```\ntemplate<typename T>      // 同前\nclass SomeClass\
    \ {\npublic:\n    SomeClass() { ... }\n    void mf1() { ... }\n    void mf2();\n\
    };\n```\n\n在 .cpp 文件中：\n\n```\n// SomeClass 的非内联函数的定义放在这里\ntemplate\nclass SomeClass<double>;\
    \      // 显式实例化所有 SomeClass\n// T=double 的成员函数已编译\n// 代码将进入此 .cpp 的 .obj 文件中\n\
    \ntemplate\nvoid SomeClass<int>::mf2();      // 显式实例化 SomeClass::mf2\n// 对于 T=int；编译后的代码将进入\n\
    // 此 .cpp 的 .obj 文件中\n```\n\n# 显式实例化\n\n显式实例化可能需要大量工作：\n\n+   - 你必须手动列出每个需要实例化的模板及其一组实例化参数。\n\
    \n但它是很有用的：\n\n+   - 创建实例化的库。\n- 将实例化放在特定的代码段中。\n- 避免由于糟糕的编译器/链接器导致的代码膨胀。\n- 详情见页。\n\
    \n# 显式实例化\n\n你的可执行文件最终可能会包含同一个实例化的多个副本：\n\n+   如果你的编译器（错误地）在只使用部分函数时实例化了所有类模板成员函数。\n\
    \n+   如果你的链接器很糟糕：\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_66_0.png)\n\n+ \
    \  如果你使用了动态链接。\n\n在图图中，红色代码是函数定义，洋红色代码是函数声明（或在对象文件中是对外部符号的引用），黑色代码是函数调用。\n\n#\
    \ 避免代码重复\n\n考虑以下：\n\n```\nclass IntClass {\npublic:\n    void usageInfo(std::ostream&\
    \ s); // 将使用信息汇总到 s\n    ...\n}\nclass DoubleClass {\npublic:\n    void usageInfo(std::ostream&\
    \ s); // 将使用信息汇总到 s\n    ...\n}\n```\n\n两个 `usageInfo` 函数本质上在做相同的事情。\n\n+   -\
    \ 这是代码重复。\n- 它导致代码膨胀。\n\n注意，这里不涉及模板。\n\n# 避免代码重复\n\n消除此类重复的一种常用方法是将重复代码移动到基类：\n\
    \n```\nclass Base {\npublic:\n    void usageInfo(std::ostream& s); // 将使用信息汇总到\
    \ s\n    ...\nprotected:\n    ... // 存储使用信息的数据\n};\nclass IntClass: public Base\
    \ {\n    ...\\ // 没有 usageInfo 的声明\n};\nclass DoubleClass: public Base {\n   \
    \ ...\\ // 没有 usageInfo 的声明\n};\n```\n\n现在程序中只有一份 `usageInfo` 副本，无论有多少个类继承自 `Base`。\n\
    \n# 避免代码重复\n\n在编写模板时，完全相同的逻辑也适用：\n\n```cpp\ntemplate<typename T> // 一个导致膨胀的模板\n\
    class SomeClass {\n    ...\n    void usageInfo(std::ostream& s); // 如果...则会导致代码重复\n\
    \    ...\n    // // usageInfo 并没有使用 T\n};\n```\n\n解决方案是相同的：\n\n```\nclass Base\
    \ { // 与上一页相同\npublic:\n    void usageInfo(std::ostream& s);\n    ...\ntemplate<typename\
    \ T> // 一个避免膨胀的模板\nclass SomeClass: public Base {\n    ...\n// 没有 usageInfo 的声明\n\
    };\n```\n\n# 避免代码重复\n\n将类型无关的代码移动到基类中，被称为“代码提升”（code hoisting）。\n它可以帮助避免由于多个指针类型导致的代码膨胀：\n\
    \n```cpp\ntemplate<typename T> // 通用模板\nclass Stack { ... };\nclass GenericPtrStack\
    \ { ... }; // 使用 void* 的非模板\ntemplate<typename T> // 针对指针的偏特化\nclass Stack<T*>>:\
    \ // 指针；使用基于 void \"*\"\n    private GenericPtrStack { // 所有实际操作的基类\n    ...\n\
    };\n// 所有内联转换函数；\n// 它们不生成代码\n```\n\n因此，所有针对指针类型的 `Stack` 实例都共享它们的代码。\n\n+   -\
    \ 我们稍后会详细查看这个示例。\n\n# 避免代码重复\n\n代码提升与内联结合得良好，可以避免由非类型模板参数导致的重复：\n\n```cpp\ntemplate<typename\
    \ T, std::size_t BUFSZ> // 怀疑的设计：每个都会产生新的\nclass Buffer { //\n```\n\n```cpp\n\
    template<typename T> // 改进的设计：Buffer\nclass BufferBase {\n  ...\n};\ntemplate<typename\
    \ T, std::size_t BUFSZ> // 依赖 BUFSZ\nclass Buffer: public BufferBase<T> { // 理想情况下，所有都是内联的\n\
    \  ```\n\n# 避免代码重复\n\n通过模板避免代码膨胀根本上要求对共性和变异进行分析：\n\n+   - 不依赖模板参数的部分（公共部分）应该移出模板。\n\
    - 剩余部分（变异部分）应留在模板中。\n\n这种分析对于避免任何形式的代码重复至关重要：\n\n+   - 多个类的公共特征应该移出类。\n  - 移动到基类。\n\
    \  - 或者使用类模板。\n- 多个函数的公共特征应该移出函数：\n  - 移动到新函数。\n  - 或者使用函数模板。\n\n这里需要区分源代码重复和对象代码重复。模板和内联可以减少源代码重复，但可能导致对象代码重复。\n\
    \n# 代码膨胀总结\n\n大多数膨胀可以通过仔细的设计来消除。你的武器有：\n\n+   - 考虑禁用异常支持。\n- 考虑使用 stdio 代替 iostre。\n\
    - 避免过度内联，尤其是使用模板时。\n- 审慎使用显式实例化来避免代码重复。\n- 将参数无关的代码提升出模板。\n\n# 处理函数模板\n\n我们只讨论了类模板，但函数模板的膨胀消除技术是类似的：\n\
    \n```cpp\ntemplate<typename T>\nvoid doSomething(const T& obj)\n{\n    ...\n \
    \   ...\n}\n// 导致膨胀的模板\n// 使用 T 或 obj\n// 独立于 T 或 obj\n// 使用 T 或 obj\n```\n\n\
    一种“提升”替代方案：\n\n```cpp\nvoid doSomethingHelper();\ntemplate<typename T>\nvoid doSomething(const\
    \ T& obj)\n{\n    ...\n    doSomethingHelper();\n    ...\n}\n// 提升的代码在非模板\n//\
    \ 函数中；非内联\n// 修改后的避免膨胀的模板\n// 使用 T 或 obj\n// 使用 T 或 obj\n```\n\n# 数据膨胀\n\n并不是所有的膨胀都是由代码引起的。不必要的类会导致数据膨胀，由于：\n\
    \n+   - 某些类具有 vtbl\n\n这些问题的重要例外是以下类模板：\n\n+   - 只包含内联函数。\n  - 因此没有额外的 EH 表。\n\
    - 不包含虚函数。\n  - 因此没有额外的 vtbl。\n\n我们稍后会看到此类“无膨胀”模板的示例。\n\n# 概述\n\n第一天（大致）：\n\n+\
    \   * “C++”与“嵌入式系统”\n* 深入 C++\n  * 实现语言特性\n  * 理解内联\n  * 避免代码膨胀\n* 基于接口编程的三种方法\n\
    * 动态内存管理\n* C++ 与 ROM 可性\n\n"
