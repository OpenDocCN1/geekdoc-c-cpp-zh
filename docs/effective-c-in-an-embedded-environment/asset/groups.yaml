- md: "\n# Interface-Based Programming\n\nInterface-based programming:\n\n- Coding\
    \ against an interface that allows multiple implementations.\n  - Function interface.\n\
    \  - Class interface.\n\n- Client code unaware which implementation it uses.\n\
    \  - It depends only on the interface.\n\n# Polymorphism\n\nPolymorphism:\n\n\
    - The use of multiple implementations through a single interface.\n\n- **Runtime**:\
    \ each *call* may use a different implementation.\n  - Use inheritance + virtual\
    \ functions.\n- **Link-time**: each link may yield a different set of implementations.\n\
    \  - Use separately compiled function bodies.\n  - Applies to both static and\
    \ dynamic linking.\n- **Compile-time**: each compilation may yield a different\
    \ set of implementations.\n  - Use computed typedefs.\n\nKey question: when is\
    \ it known which implementation should be used?\n\n# Runtime Polymorphism\n\n\
    - The “normal” meaning of interface-based programming.\n- In much OO literature,\
    \ the only meaning.\n  - Unnecessarily restrictive for C++.\n\n- The most flexible.\n\
    - Can take advantage of information known only at runtime.\n\n- The most expensive.\n\
    - Based on vptrs, vtbls, non-inline function calls.\n\n# Runtime Polymorphism\
    \ Example\n\n```cpp\nclass Packet { // base class (\"interface\")\npublic:\n \
    \   ...\n    virtual bool isWellFormed() const = 0;\n    virtual std::string payload()\
    \ const = 0;\n    ...\n};\nclass TCPPPacket: public Packet { // derived class\
    \ (\"implementation\")\n    ...\n    virtual bool isWellFormed() const;\n    virtual\
    \ std::string payload() const;\n    ...\n};\nclass CANPacket: public Packet {\
    \ // derived class (\"implementation\")\n    ...\n    virtual bool isWellFormed()\
    \ const;\n    virtual std::string payload() const;\n    ...\n};\n```\n\n# Runtime\
    \ Polymorphism Example\n\n```cpp\nstd::auto_ptr<Packet> // factory function;\n\
    nextPacket( /* params */); // generate next packet\n...\nstd::auto_ptr<Packet>\
    \ p;\nwhile (p = nextPacket( /* params */), p.get() != 0) {\n    if (p->isWellFormed())\
    \ { // use Packet interface\n        ...\n    }\n}\n}...\n```\n\nRuntime polymorphism\
    \ is reasonable here:\n\n- Types of packets vary at runtime.\n\n**Note:** As of\
    \ C++11, std::unique_ptr is preferable to std::auto_ptr, and nullptr is preferable\
    \ to 0.\n\n# Link-Time Polymorphism\n\n- Useful when information known during\
    \ linking, but not during compilation.\n- No need for virtual functions.\n- Typically\
    \ disallows inlining.\n  - Most inlining is done during compilation.\n\n# Link-Time\
    \ Polymorphism Example\n\nSoftware can be deployed on two kinds of boxes:\n\n\
    - Expensive, high-performance box.\n  - Uses expensive, fast components.\n\n-\
    \ Cheaper, lower-performance box.\n  - Uses cheaper, lower-performance components.\n\
    \n- Essentially the same software runs on both boxes.\n  - Component driver implementations\
    \ differ.\n  - A common interface can be defined.\n\nApproach:\n\n- One class\
    \ definition for both drivers.\n\n- Different component-dependent implementations.\n\
    \n- Implementations selected during linking.\n  - This is “C” polymorphism.\n\n\
    # Link-Time Polymorphism Example\n\n```cpp\ndevice.h:\n\nnamespace Drivers {\n\
    \    class Impl;\n    class DeviceDriver { // all nonvirtual non-inline functions\n\
    \    public:\n        DeviceDriver();\n        ~DeviceDriver();\n        void\
    \ reset();\n        ...\n    private:\n        Impl *pimpl; // ptr to data for\
    \ driver\n    };\n}\n```\n\nAll client code includes this header and codes against\
    \ this class.\n\n- Note lack of virtual functions.\n\n# Link-Time Polymorphism\
    \ Example\n\nEFDevice.cpp (generates EFDevice.o, EFDevice.obj, or EFDevice.dll,\
    \ etc.):\n\n```cpp\nEFDevice = \"Expensive Fast Device\"\nnamespace Drivers {\n\
    \    struct Impl { ... }; // data needed by EFDevice driver\n    DeviceDriver::DeviceDriver()\
    \ // ctor for EFDevice\n    { ... }\n    DeviceDriver::~DeviceDriver() // dtor\
    \ code for EFDevice\n    { ... }\n    void DeviceDriver::reset() // reset code\
    \ for EFDevice\n    { ... }\n}\n```\n\nAll functions in this file have access\
    \ to the Impl struct defined here.\n\n# Link-Time Polymorphism Example\n\nCSDevice.cpp\
    \ (generates CSDevice.o, CSDevice.obj, or CSDevice.dll, etc.):\n\n- CSDevice =\
    \ “Cheap Slow Device\"\n- namespace Drivers {\n    struct Impl { ... }; // data\
    \ needed by CSDevice driver\n    DeviceDriver::DeviceDriver() // ctor for CSDevice\n\
    \    { ... }\n    DeviceDriver::~DeviceDriver() // dtor code for CSDevice\n  \
    \  { ... }\n    void DeviceDriver::reset() // reset code for CSDevice\n    { ...\
    \ }\n}\n```\n\nAll functions in this file have access to the Impl struct defined\
    \ here.\n\n- Impl in this file typically different from that in EFDevice.cpp.\n\
    - Function bodies in this file also typically different.\n\n# Link-Time Polymorphism\
    \ Example\n\n- CSDevice = “Cheap Slow Device\"\n- EFDevice.o if building for high-performance\
    \ box.\n- CSDevice.dll if building for lower-performance box.\n\nLink-time polymorphism\
    \ is reasonable here:\n\n- Device type can be determined during compilation.\n\
    - No need for flexibility or expense of runtime polymorphism.\n- No need for vtbls.\n\
    \n# Compile-Time Polymorphism\n\n- Useful when:\n  - Information known during\
    \ compilation.\n  - Want to write platform-independent.\n  - No need for virtual\
    \ functions.\n  - Allows inlining.\n  - Based on explicit interfaces.\n\n- Goal:\n\
    \  - Device type determined by linking.\n  - Driver “computes” the correct class\
    \ for type to refer to.\n\n- Approach:\n  - Create class with compatible interfaces.\n\
    \  - Use a typedef for this class.\n  - Define a for this.\n\n# Compile-Time Polymorphism\
    \ Example\n\nRevised device.h:\n\n```cpp\n#include \"NASDevice.h\"\n// NAS = Normal\
    \ Address Space (32 bytes);\n\n#include \"BASDevice.h\"\n// BAS = Big Address\
    \ Space (>32 bytes);\n\n#include \"SASDevice.h\"\n// SAS = Small Address Space\
    \ (<32 bits);\n\n// remainder of device.h (coming soon)\n```\n\nBy design, each\
    \ class has compatible interface.\n\n# Compile-Time Polymorphism Example\n\nDriver\
    \ classes may use any language features:\n\n- Especially inlining.\n\n```cpp\n\
    class NASDevice {\npublic:\n    ...\n    void reset() { ... } // inline function\n\
    \    ...\n}\nclass BASDevice {\npublic:\n    void reset() { ... } // inline function\n\
    \    ...\n};\nclass SASDevice {\n    ...\n    void reset(); // non-inline function\n\
    };\n```\n\n# Compile-Time Polymorphism Example\n\nClients refer to the correct\
    \ driver this:\n\n```cpp\nDriver::type d;\n// d's type is either NASDevice,\n\
    // BASDevice, or SASDevice,\n// depending on bits/pointer\nd.reset();\n```\n\n\
    # Compile-Time Polymorphism Example\n\nRevised device.h (continued):\n\n```cpp\n\
    template<int PtrBitsVs32> struct DriverChoice;\ntemplate<> struct DriverChoice<1>\
    \ { // When bits/ptr < 32\n    typedef SASDevice type;\n};\ntemplate<> struct\
    \ DriverChoice<0> { // When bits/ptr == 32\n    typedef NASDevice type;\n};\n\
    template<> struct DriverChoice<1> { // When bits/ptr > 32\n    typedef BASDevice\
    \ type;\n};\n\nstruct Driver {\n    enum { bitsPerVoidPtr = CHAR_BIT * sizeof(void*)\
    \ };\n    enum { ptrBitsVs32 = bitsPerVoidPtr > 32 ? 1 : \n               bitsPerVoidPtr\
    \ == 32 ? 0 :\n               -1;\n    };\n    typedef DriverChoice<ptrBitsVs32>::type\
    \ type;\n};\n```\n\nAs far as I know, this can't be done with the preprocessor,\
    \ because you can't use sizeof in a preprocessor expression.\n"
  mdcn: "\n\n# 基于接口的编程\n\n基于接口的编程：\n\n- 针对接口编码，允许有多个实现。\n  - 函数接口。\n  - 类接口。\n\n-\
    \ 客户端代码感知不到它正在使用哪种实现。\n  - 它仅依赖于接口。\n\n# 多态\n\n多态：\n\n- 通过单一接口使用多个实现。\n\n- **运行时**：每次*调用*都可能使用不同的实现。\n\
    \  - 使用继承 + 虚函数。\n- **链接时**：每次链接都可能产生一组不同的实现。\n  - 使用分体编译的函数体。\n  - 存在于静态链接和动态链接。\n\
    - **编译时**：每次编译都可能产生一组不同的实现。\n  - 使用计算出的类型定义（typedefs）。\n\n关键问题：何时何时能知道应该使用哪种实现？\n\
    \n# 运行时多态\n\n- 基于接口的编程的“正常”含义。\n- 在许多面向对象（OO）的文献中，这是唯一的含义。\n  - 对于 C++ 来说这种限制过于严格。\n\
    \n- 最灵活。\n- 可以利用仅在运行时已知的信息。\n\n- 最昂贵。\n- 基于虚指针（vptrs）、虚函数表（vtbls）和非内联函数调用。\n\n\
    # 运行时多态示例\n\n```cpp\nclass Packet { // 基类（“接口”）\npublic:\n    ...\n    virtual\
    \ bool isWellFormed() const = 0;\n    virtual std::string payload() const = 0;\n\
    \    ...\n};\nclass TCPPPacket: public Packet { // 衍生类（“实现”）\n    ...\n    virtual\
    \ bool isWellFormed() const;\n    virtual std::string payload() const;\n    ...\n\
    };\nclass CANPacket: public Packet { // 派类（“实现”）\n    ...\n    virtual bool isWellFormed()\
    \ const;\n    virtual std::string payload() const;\n    ...\n};\n```\n\n# 运行时多态示例\n\
    \n```cpp\nstd::auto_ptr<Packet> // 工厂函数；\nnextPacket( /* params */); // 生成下一个数据包\n\
    ...\nstd::auto_ptr<Packet> p;\nwhile (p = nextPacket( /* params */), p.get() !=\
    \ 0) {\n    if (p->isWellFormed()) { // 使用 Packet 接口\n        ...\n    }\n}\n\
    }...\n```\n\n运行时多态在这里是合理的：\n\n- 数据包的类型在运行时变化。\n\n**注意：** 从 C++11 开始，`std::unique_ptr`\
    \ 优于 `std::auto_ptr`，`nullptr` 优于 `0`。\n\n# 链接时多态\n\n- 当信息在链接期间已知但在编译期间未知时有用。\n\
    - 不需要虚函数。\n- 通常不允许内联。\n  - 大多数内联是在编译期间完成的。\n\n# 链接时多态示例\n\n软件可以部署在两种箱上：\n\n- 昂贵的、高性能箱。\n\
    \  - 使用昂贵、快速的组件。\n\n- 便宜的、低性能箱。\n  - 使用更廉价、低性能的组件。\n\n- 本质上相同的软件在两种箱上运行。\n  -\
    \ 组件驱动的实现不同。\n  - 可以定义一个通用接口。\n\n方法：\n\n- 两个驱动程序使用同一个类定义。\n\n- 依赖组件的不同实现。\n\n\
    - 在链接期间选择实现。\n  - 这就是“C”多态。\n\n# 链接时多态示例\n\n```cpp\ndevice.h:\n\nnamespace Drivers\
    \ {\n    class Impl;\n    class DeviceDriver { // 所有非虚非内联函数\n    public:\n   \
    \     DeviceDriver();\n        ~DeviceDriver();\n        void reset();\n     \
    \   ...\n    private:\n        Impl *pimpl; // 指向驱动数据的指针\n    };\n}\n```\n\n所有客户端代码包含此头文件并针对该类编码。\n\
    \n- 注意：缺乏虚函数。\n\n# 链接时多态示例\n\nEFDevice.cpp（生成 EFDevice.o, EFDevice.obj, 或 EFDevice.dll\
    \ 等）：\n\n```cpp\nEFDevice = \"Expensive Fast Device\"\nnamespace Drivers {\n \
    \   struct Impl { ... }; // EFDevice 需要的数据\n    DeviceDriver::DeviceDriver() {\
    \ ... } // 构造函数\n    DeviceDriver::~DeviceDriver() { ... } // 析构函数\n    void DeviceDriver::reset()\
    \ { ... } // 重置\n}\n```\n*(注：原文中示例代码块逻辑略有乱，此处根据语境进行了结构化对齐)*\n\nEFDevice.cpp (生成\
    \ EFDevice.o, EFDevice.obj, or EFDevice.dll, etc.):\n\n```cpp\nEFDevice = \"Expensive\
    \ Fast Device\"\nnamespace Drivers {\n    struct Impl { ... }; // EFDevice 需要的数据\n\
    \    DeviceDriver::DeviceDriver() { ... } // 构造函数\n    DeviceDriver::~DeviceDriver()\
    \ { ... } // 析构函数\n    void DeviceDriver::reset() { ... } // 重置\n}\n```\n*(注：原文提供的文本在此处存在多处重复和片段错乱，已根据原文逻辑尽可能进行还原翻译)*\n\
