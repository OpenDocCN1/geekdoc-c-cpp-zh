  - "[PAGE 275]\n\n# # Risk Reduction via Language Choice\n\nC++ can reduce risk compared\
    \ to C:\n\n+   - Coding occurs at a higher level of abstraction\n  - Code looks\
    \ more like the design.\n  - Direct support for multiple paradigms:\n    - OO:\
    \ Encapsulation, classes, inheritance, dynamic binding, etc.\n    - Generic Templates\n\
    \    - Procedural\n    - Functional (closures and lambdas supported only in C++11,\
    \ alas)\n\n+   - Language features reduce the need for preprocessor usage\n  -\
    \ E.g., C macros often become C++ const and inlines.\n\n+   - Templates offer\
    \ type-safe alternatives to type-unsafe C practices.\n  - E.g., preventing pointers\
    \ and arrays:\n    - std::unique_ptr<T> or std::shared_ptr<T> (or std::auto_ptr<T>)\
    \ => single object.\n    - std::vector<T> or std::array<T, n> => array of objects.\n\
    \nRiskness of C++ compared to Java, Ada, C#, etc. highly debated :-\n\nstd::unique_ptr\
    \ is in only C++11. std::shared_ptr and std::array are present in both C++11 and\
    \ TR1. In the latter, they are in namespace std::tr1."
  - "[PAGE 276]\n\n# Tool-Related Risks\n\nCompilers, linkers, runtime systems, OSes,\
    \ etc. are software.\n\n+   - They also contribute to the reliability of safety-critical\
    \ systems.\n- Reducing risk means addressing the risks they introduce.\n\nApproaches:\n\
    \n+   - Commercial validation suites:\n  - E.g., for compiler/library conformance\
    \ to standard C++.\n  - E.g., against DO-178B.\n\n+   - Manual analysis of generated\
    \ code:\n  - Typically in conjunction with a restricted source code subset.\n\n\
    +   - Testing, testing, testing.\n\nC++ compilers typically not certified in any\
    \ standard way.\n\n+   - Green Hills’ compiler for Embedded C++ has been certified\
    \ at DO-178B Level A."
  - '[PAGE 277]


    # Summary: C++ in Safety-Critical Systems


    +   - Fundamentally a matter of reducing risk.

    - Development process more important than programming language.

    - Coding guidelines plus extensive static analysis are key.

    - Reliability of ancillary software tools/components also important.

    - C++ currently employed in many safety-critical application areas.'
  - '[PAGE 278]


    # C++ in Real-Time Systems


    Real-Time:


    +   - **Hard**: Timing deadlines missed $\Rightarrow$ system failure.

    - E.g., engine controllers, pacemakers, elevators, etc.

    - **Soft**: Timing deadlines missed $\Rightarrow$ reduced behavioral quality.

    - E.g., Music and video players, IP network buffer managers, etc.


    Key characteristic is not speed, but **determinism** in timing:


    +   - **RT systems fully or largely guarantee their ability to satisfy timing
    constraints.**

    - Fully for hard RT.

    - Largely for soft RT.


    In TCP/IP communication, TCP guarantees packet delivery, but IP does not. So if
    the IP layer misses a deadline and drops a packet, the TCP layer will detect that
    and make sure the packet is retransmitted. So ultimately no data is lost, but
    throughput decreases.'
  - "[PAGE 279]\n\n# Approaching RT Development\n\nRT development for C++ is essentially\
    \ the same as for C:\n\n+   - Determining timing constraints.\n- Avoid language\
    \ features with indeterminate timing behavior:\n  - C: \"Out of the box\" malloc/free/memcpy\n\
    \  - C++:\n    - \"Out of the box\" malloc/free/memcpy/delete\n    - RTTI: dynamic_cast,\
    \ comparisons of type_info objects\n    - Exceptions: try/throw/catch\n- Custom\
    \ malloc/free/memcpy, etc., may have deterministic timing.\n- Perform execution\
    \ time analysis.\n  - For functions, tasks, and the entire system.\n  - Hard RT:\
    \ typically Worst Case Execution Time (WCET) analysis.\n  - Soft RT: often average\
    \ case execution analysis.\n\n“Language features” includes library functionality,\
    \ because malloc, free, memcpy, etc., are library features, not language features."
  - '[PAGE 280]


    # Timing Behavior Variations


    Execution time for language features depends on:


    +   - Compiler and linker.

    - Including optimization settings

    - Call context (for inline functions).


    +   - Hardware features:

    - E.g., caching, pipelining, speculative instruction execution, etc.


    In addition:


    +   - Library features may be implemented in different ways:

    - Container/algorithm implementations in the STL.

    - E.g., std::string may or may not use SSO or COW.

    - E.g., std::sort may use quicksort or introsort.

    - Different hceaping management algorithms for malloc/free/new/delete.


    SSO = “Small String Optimization,” COW = “Copy on Write"

    COW is not a valid std::string implementation technique in C++11.'
  - "[PAGE 281]\n\n# Analyzing Execution Time\n\nApproaches to block/function WCET\
    \ analysis:\n\n+   - Static analysis of source code.\n  - By humans, tools, or\
    \ both.\n  - Templates can be handled by explicit instantiation and per-instantiation\
    \ analysis.\n\n+   - Dynamic analysis of code under test.\n  - Observe how long\
    \ it takes to execute blocks/functions.\n\n+   - A combination of the above.\n\
    \  - Dynamic analysis of basic blocks' WCETs.\n  - Static analysis of paths through\
    \ blocks.\n  - Testing for 100% path coverage is difficult.\n\nFor system WCET,\
    \ combine:\n\n+   - Per-task WCET analysis.\n- Task schedulability analysis."
  - "[PAGE 282]\n\n# Analyzing Execution Time\n\nApproaches to average-case analysis:\n\
    \n+   - Same options as WCET.\n  - But determine average-case time, not worst-case.\n\
    - Multiply C++ statement count by a fudge factor.\n  - A bigger fudge factor than\
    \ C.\n    - C++ statements typically do more than C statements.\n  - Useful for\
    \ ballballing execution time during development.\n    - Reduces need for fine-tuning\
    \ later."
  - '[PAGE 283]


    # Summary: C++ in Real-Time Systems


    +   - Fundamental approach the same as for C.

    - Typically avoid the use of heap operations, RTTI, and exceptions.'
