    \nBasic approach:\n\n- Treat heap memory as an array.\n- Each element is the size\
    \ of an allocation unit.\n- No need to store the size of each allocation.\n- Unallocated\
    \ elements are kept on a free list.\n- Allocation/deallocation is a simple list\
    \ operation:\n- Removing/adding to the front of the free list.\n\n# Pool Allocation\n\
    \n```cpp\ntemplate<std::size_t ElementSize>\nclass PoolAllocator {\npublic:\n\
    \    PoolAllocator(unsigned char* heapAddr, // on next page\n                \
    \  std::size_t heapSize);\n    void* allocate(std::size_t sz) throw (std::bad_alloc);\
    \ // coming soon\n    void deallocate(void* ptr, std::size_t size) throw (); //\
    \ ditto\nprivate:\n    union Node { // pool element\n        unsigned char data[ElementSize];\
    \ // when use\n        Node *next; // free list\n    };\n    Node *freeList;\n\
    };\n```\n\n- Pointer data member should be declared.\n- If PoolAllocator template,\
    \ template param could be.\n- Ideally, ElementSize > 0.\n- There’s no deallocate\
