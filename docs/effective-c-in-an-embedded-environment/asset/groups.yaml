- md: "\n# Summary: Specifying FSMs\n\n- Template metaprogramming makes it possible\
    \ to create Domain-Specific Embedded Languages (DSELs).\n- DSELs facilitate a\
    \ declarative programming style.\n- Declarative code tends to be easier to create,\
    \ understand, and enhance.\n\n# Other Approaches to FSMs\n\nThere are many ways\
    \ to specify and implement FSMs in C++. They vary:\n\n- Expressiveness, e.g.,\
    \ support for both hierarchical and concurrent states.\n- UML supports both (“Statecharts\
    \ + Petri Nets\")\n- Support for both static and dynamic FSM specification.\n\
    - Type safety of source code.\n- Demands on compiler template support.\n- Size\
    \ and speed of executable code.\n- Use of heap memory at runtime.\n- Support for\
    \ multithreading.\n- Debuggability.\n- Coupling between, e.g., states and transitions.\n\
    \nA plethora of approaches are described in the Further Information.\n\nRegarding\
    \ coupling, the interface just shown has all states in a global list (high coupling),\
    \ but states have no knowledge of transitions or actions (low coupling). In Boost.Statechart,\
    \ it's the opposite: there is no global list of states, but states know about\
    \ transitions and actions.\n\n# Summary: Interesting Template Applications\n\n\
    - Templates are useful for a lot more than just containers\n- Templates can generate\
    \ type-safe wrappers around type-unsafe code.\n- Templates can be used to enforce\
    \ novel kinds of type safety (e.g., dimensional units).\n- Domain-Specific Embedded\
    \ Languages (DSELs) can be built on templates.\n\n# Overview\n\n#### Day 2 (Approximate):\n\
    \n- Modeling Memory-Mapped IO\n- Implementing Callbacks from C APIs\n- Interesting\
    \ Template Applications:\n  - Type-safe void*-based containers\n  - Compile-time\
    \ dimensional unit analysis\n- Specifying FSMs\n- Considerations for Safety-Critical\
    \ and Real-Time Systems\n- Further Information\n\n# C++ in Safety-Critical Systems\n\
    \nSafety-Critical: System failure ⇒ loss of (human) life or serious injury.\n\
    Some application areas:\n\n- Transportation: airplanes, cars, trains, ships, spacecraft,\
    \ etc.\n- Medicine: radiation machines, heart-lung machines, drug-delivery equipment,\
    \ etc.\n- Communication: battlefield radios, emergency response (e.g., 911 in\
    \ USA, 112 in Europe), etc.\n\nCurrent C++ use in such systems?\n\n- Extensive:\
    \ All application areas above.\n\n# Safety-Critical Software and Risk\n\nSafety-critical\
    \ software is like “normal” software, except:\n\n- The risk of incorrect behavior\
    \ must be extraordinarily low.\n\nThe key is therefore simple:\n\n- Minimize risk\
    \ of incorrect behavior.\n\n# Minimizing Risk\n\nGeneral approaches:\n\n- Very\
    \ detailed specifications.\n  - Plus rigorous change management.\n- Comprehensive\
    \ testing.\n  - At multiple levels, e.g., unit, module, system.\n  - Includes\
    \ performance.\n    - Adequate performance is a correctness criterion.\n- Constrained\
    \ programmer discretion.\n  - Via coding guidelines.\n\n- Extensive static analysis:\n\
    \  - Ensure coding guidelines are obeyed.\n  - Look for problems unlikely to be\
    \ exposed by testing.\n  - Analyses performed by both machines and humans.\n \
    \   - Lint-like tools.\n    - Formal code inspections.\n\n# Minimizing Risk\n\n\
    - Independent redundant computation:\n  - Independent teams implement the same\
    \ functionality.\n  - Possibly using different programming languages.\n  - At\
    \ runtime, all implementations execute in parallel.\n  - When implementations\
    \ produce different results,\n    - Vote?\n    - Shut down?\n    - Revert to known\
    \ state?\n\n# Minimizing Risk\n\nRecap:\n\n- Detailed specifications.\n- Comprehensive\
    \ testing.\n- Constrained programmer discretion.\n- Extensive static analysis.\n\
    - Independent redundant computation.\n\nNothing above is specific to C++.\n\n\
    - **Development process vastly dominates programming language.**\n- The only thing\
    \ C++-specific is the coding guidelines employed.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_267_0.png)\n\
    \n# Coding Guidelines\n\nGoals:\n\n- Maximize code clarity and comprehensibility.\n\
    - For both humans and static analysis tools.\n- Maximize code’s behavioral predictability.\n\
    \nMeans:\n\n- Requirements and prohibitions regarding coding practices.\n\nIdeally,\
    \ guideline violations can be automatically detected.\n\n- Ideal rarely achieved.\n\
    - E.g., Hatton notes that 5-10% of MISRA-C rules not so enforceable.\n- Human\
    \ static analysis must enforce rules not automatically checkable.\n\n> Hatton\
    \ is \"Les Hatton,\" author of Safer C and a researcher on, among other things,\
    \ factors affecting software correctness, especially in safety-critical systems.\
    \ His comment on this slide is, I believe, from a personal conversation I had\
    \ with him. His web site is http://www.leshatton.org.\n\n# Guideline Levels\n\n\
    Guidelines usually have multiple levels of stringency.\n- E.g., Joint Strike Fighter\
    \ (JSF) rules use three levels:\n- Should: advisory.\n- Will: mandatory, verification\
    \ not required.\n- Shall: mandatory, verification required.\n- Higher levels are\
    \ therefore preferable.\n- Violating even a JSF “Should” rule requires a manager’s\
    \ approval.\n\nThe Joint Strike Fighter (JSF) rules use three levels:\nShould:\
    \ advisory.\nWill: mandatory, verification not required.\nShall: mandatory, verification\
    \ required.\nHigher levels are therefore preferable.\nViolating even a JSF “Should”\
    \ rule requires a manager’s approval.\n\n# Guideline Types\n\nLexical guidelines:\n\
    \n- No effect on semantics.\n- Reduce programmer discretion.\n- Improves code\
    \ clarity and comprehensibility.\n\n- Naming rules:\n- JSF AV Rule: All words\
    \ in an identifier be separated by '_'.\n\n- Formatting rules:\n- High Integrity\
    \ C++ Rule: Organise 'class' definitions by access level, in the following order:\
    \ 'public', 'protected', 'private'.\n- MISRA C Rule: Literal suffixes shall be\
    \ upper case.\n\n# Guideline Types\n\nLanguage use:\n\n- Specify language features\
    \ and constructs.\n- Remove \"unnecessary\" and \"dangerous\" things.\n- Identify\
    \ the acceptable language.\n- Reduce code’s complexity.\n- Increases its behavioral\
    \ predictability.\n\nFor C++, coding guidelines often based on MISRA-C++ or MISRA-C.\n\
    \n# Example Guidelines\n\n- Make no use of \"undersified\" behavior.\n- Many official\
    \ terms: \"undefined\", \"unspecified\", etc.\n- Common in C++.\n\n| Category\
    \ | Language issues | Library Issues | Total Number of Issues |\n|---|---|---|\n\
    | Unspecified behaviour | 25 | 25 | 50 |\n| Undefined behaviour | 77 | 29 | 106\
    \ |\n| Implementation behaviour | 58 | 23 | 81 |\n| Indeterminate behaviour |\
    \ 5 | 0 | 5 |\n| Behaviour that requires no diagnostic | 18 | 0 | 18 |\n\nExample:\n\
    \n```cpp\nf(calcThis(), calcThat()); // prohibited: eval order undefined\nint\
    \ thisVal = calcThis();\nint thatVal = calcThat();\nf(thisVal, thatVal); // fine,\
    \ eval order fully defined\n```\n\n# Example Guidelines\n\n- Avoid “surprising”\
    \ behavior:\n  - JSF AV Rule 177: User-defined conversion functions should be\
    \ avoided.\n  - Prevents unexpected implicit conversions.\n  - MISRA C++ Rule\
    \ 5-0-1: The value of an expression shall be the same under any order of evaluation\
    \ that the standard permits.\n  - Prevents compiler- or optimization-dependent\
    \ behavior.\n  - High Integrity C++ Rule 3.3.14: Declare the copy assignment operator\
    \ protected in an abstract class.\n  - Prevents partial assignments to derived\
    \ objects via base class pointers/references.\n\n# Example Guidelines\n\n- Avoid\
    \ complex code:\n- JSF AV Rule 3: All functions shall have a cyclomatic complexity\
    \ number of 20 or less.\n- High Integrity C++ Rule 4.1: Do not write functions\
    \ with an excessive McCabe Cyclomatic Complexity.\n- Recommended C++ maximum is\
    \ 10.\n- MISRA C Rule 6-6-3: The continue statement shall only be used within\
    \ a well-formed for loop.\n\nThe motivation for the MISRA rule is as follows:\
    \ “Over-use of the continue statement can lead to unnecessary complexity within\
    \ the code. This complexity may impede effective testing as extra logic must be\
    \ tested. The required testing may not be achievable due to control flow dependencies.”\n"
  mdcn: "\n\n# 总结：指定状态机（FSM）\n\n- 模板元编程使得创建领域特定嵌入语言（DSELs）成为可能。\n- DSEL 促进了声明式编程风格。\n\
    - 声明式代码往往更容易创建、理解和增强。\n\n# FSM 的其他方法\n\n在 C++ 中有许多方法可以规范和实现 FSM。它们各不相同：\n\n- 表达能力，例如同时支持分层状态和并发状态。\n\
    - UML 同时支持两者（“状态图 + 推理网”）。\n- 同时支持静态和动态 FSM 规范。\n- 源代码的类型安全。\n- 对编译器模板支持的要求。\n\
    - 可执行代码的大小和速度。\n- 运行时对堆内存的使用。\n- 对多线程的支持。\n- 可调试性。\n- 耦合性，例如状态与转换之间的耦合。\n\n在“更多信息”中描述了大量方法。\n\
    \n关于耦合性，刚才显示的接口将所有状态都放在一个全局列表中（高耦合），但状态对转换或动作一无所知（低耦合）。在 Boost.Statechart 中，情况相反：没有状态的全局列表，但状态了解转换和动作。\n\
    \n# 总结：有趣的模板应用\n\n- 模板的用途远不止于容器。\n- 模板可以为不安全的代码生成类型安全的包装器。\n- 模板可以强制执行新类型的类型安全（例如维度单位）。\n\
    - 可以在模板的基础上构建领域特定嵌入语言（DSELs）。\n\n# 概述\n\n#### 第 2 天（概括）：\n\n- 内存映射 I/O 建模\n- 从\
    \ C API 实现回调\n- 有趣的模板应用：\n  - 基于 `void*` 的类型安全容器\n  - 编译时维度单位分析\n- 指定 FSM\n- 安全关键型和实时系统的考虑因素\n\
    - 更多信息\n\n# 安全关键系统中的 C++\n\n安全关键型（Safety-Critical）：系统失败 ⇒ 导致（生命）损失或严重伤害。\n一些应用领域：\n\
    \n- 交通：飞机、汽车、火车、船只、航天器等。\n- 医疗：放射设备、心肺机、给药设备等。\n- 通信：战场无线电、应急响应（例如美国的 911，欧洲的\
    \ 112）等。\n\n目前 C++ 在此类系统中的应用情况？\n\n- 广泛使用：上述所有应用领域。\n\n# 安全关键软件与风险\n\n安全关键软件与“普通”软件类似，区别在于：\n\
    \n- 错误行为的风险必须极低。\n\n因此，关键在于：\n\n- 将错误行为的风险降至最低。\n\n# 降低风险\n\n通用方法：\n\n- 非常详细的规范。\n\
    \  - 加上严谨的变更管理。\n- 全面测试。\n  - 在多个级别，例如单元、模块、系统。\n  - 包含性能。\n    - 足够的性能是一个正确性标准。\n\
    - 限制程序员的裁量权。\n  - 通过编码规范。\n\n- 大量静态分析：\n  - 确保遵守编码规范。\n  - 寻找测试难以暴露的问题。\n  - 由机器和人类共同进行分析。\n\
    \    - 类 Lint 的工具。\n    - 正式代码审查。\n\n# 降低风险\n\n- 独立冗余计算：\n  - 由独立团队实现相同的功能。\n\
    \  - 可能使用不同的编程语言。\n  - 在运行时，所有实现并行执行。\n  - 当实现产生不同结果时，\n    - 投票？\n    - 关机？\n\
    \    - 回到已知状态？\n\n# 降低风险\n\n回顾：\n\n- 详细的规范。\n- 全面测试。\n- 限制程序员的裁量权。\n- 大量静态分析。\n\
    - 独立冗余计算。\n\n以上内容均非 C++ 特有。\n\n- **开发过程远胜于编程语言。**\n- 唯一 C++ 特有的是所采用的编码规范。\n\n\
    ![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_267_0.png)\n\n# 编码规范\n\n目标：\n\n- 最大化代码的清晰度和理解性。\n\
    - 针对人类和静态分析工具。\n- 最大化行为的可预测性。\n\n手段：\n\n- 关于编码实践的要求和禁止。\n\n理想情况下，违规行为可以被自动检测。\n\
    \n- 理想情况很少实现。\n- 例如，Hatton 注意到 5-10% 的 MISRA-C 规则无法执行。\n- 人工静态分析必须执行无法自动检查的规则。\n\
    \n> Hatton 是 \"Les Hatton\"，他是《Safer C》的作者，也是影响软件正确性因素（特别是安全关键系统中的因素）等的研究员。我相信他对这一页幻灯片的的评论源于我与他的一次私人谈话。他的网站是\
    \ http://www.leshatton.org。\n\n# 规范级别\n\n规范通常有多个严格程度的级别。\n- 例如，联合战斗机（JSF）规则使用三个级别：\n\
    - Should（应该）：建议性的。\n- Will（将要）：强制性的，不需要验证。\n- Shall（必须）：强制性的，需要验证。\n- 因此，级别越高越好。\n\
    - 即使是违反 JSF 的“Should”规则也需要经理的批准。\n\n联合战斗机（JSF）规则使用三个级别：\nShould：建议性的。\nWill：强制性的，不需要验证。\n\
    Shall：强制性的，需要验证。\n因此，级别越高越好。\n即使是违反 JSF 的“Should”规则也需要经理的批准。\n\n# 规范类型\n\n词法规范：\n\
    \n- 对语义没有影响。\n- 减少程序员的裁量权。\n- 提高代码的清晰度和理解性。\n\n- 命名规则：\n- JSF AV 规则：标识符中的所有单词应用\
    \ '_' 隔开。\n\n- 格式规则：\n- 高完整性 C++ 规则：按访问级别组织 'class' 定义，顺序如下：'public'、'protected'、'private'。\n\
    - MISRA C 规则：字面后缀应大写。\n\n# 规范类型\n\n语言使用：\n\n- 指定语言特性和结构。\n- 移除“不必要”和“危险”的内容。\n\
    - 识别可接受的语言。\n- 减少代码复杂度。\n- 增加行为的可预测性。\n\n对于 C++，编码规范通常基于 MISRA-C++ 或 MISRA-C。\n\
    \n# 示例规范\n\n- 不要使用“未下划”（undersified）行为。\n- 许多官方术语：“undefined”、“unspecified”等。\n\
    - 在 C++ 中常见。\n\n| 类别 | 语言问题 | 库问题 | 问题总数 |\n|---|---|---|---|\n| 未指定的行为 (Unspecified\
    \ behaviour) | 25 | 25 | 50 |\n| 未定义行为 (Undefined behaviour) | 77 | 29 | 106 |\n\
    | 实现行为 (Implementation behaviour) | 58 | 23 | 81 |\n| 不确定行为 (Indeterminate behaviour)\
    \ | 5 | 0 | 5 |\n| 无需诊断的行为 | 18 | 0 | 18 |\n\n示例：\n\n```cpp\nf(calcThis(), calcThat());\
    \ // 禁止：求值顺序未\nint thisVal = calcThis();\nint thatVal = calcThat();\nf(thisVal,\
    \ thatVal); // 可以，求值顺序定义\n```\n\n# 示例规范\n\n- 避免“意外”行为：\n  - JSF AV 规则 177：应避免用户定义的转换函数。\n\
    \  - 防止意外的隐式转换。\n  - MISRA C++ 规则 5-0-1：表达式的值在标准允许的任何求值顺序下相同。\n  - 防止编译器或优化相关的行为。\n\
    \  - 高完整性 C++ 规则 3.3.14：在抽象类中将拷贝赋值运算符声明为保护。\n  - 防止通过基类指针/引用对派生对象进行部分赋值。\n\n#\
    \ 示例\n\n- 避免复杂代码：\n- JSF AV 规则 3：所有函数的圈复杂度数不应超过 20。\n- 高完整性 C++ 规则 4.1：不要编写 McCabe\
    \ 圈复杂度过高的函数。\n- 建议的 C++ 最大值为 10。\n- MISRA C 规则 6-6-3：continue 语句应仅在结构良好的 for 循环中使用。\n\
    \n该 MISRA 规则的动机如下：“过度使用 continue 语句会导致代码内部产生不必要的复杂度。这种复杂性可能会阻碍有效测试，因为额外的逻辑需要被测试。由于控制流依赖，所需的测试可能无法实现。”\n\
    \n"
