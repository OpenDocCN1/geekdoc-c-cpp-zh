    # C++ and ROM


    Integral scalar constants of static storage duration are ROMable, but they are
    often optimized away entirely:


    ```

    const unsigned bufsize = 128; // typically optimized away unless

    // bufsize''s address is taken

    ```


    Enums take no storage, and they''re safer than #defines:


    ```

    enum { bufsize = 128 }; // almost always optimized away

    ```


    +   - No portable way to specify the size of an enumerant in C++03:

    - Supported directly in C++11:

    enum: unsigned short { bufsize = 128 }; // C++11


    Such constants typically become immediate operands in instructions.


    +   - If there is no advantage to using #defines in these cases:

    - #defines don''t respect scope.

    - #defines can''t be private or protected.


    const objects have internal linkage, so if no const propagation is performed,
    the first example on this page could yield multiple copies of bufsize in an executable.

    Per the 2003 ISO C++ Standard (section 4.5, paragraph 2), “An value of...an enumeration
    can be converted to a value of the first of the following types that can represent
    all the values of its underlying type: int, unsigned int, long, or unsigned long.”
    This means that even anonymous enums can benefit from the C++11 ability to specify
    the underlying type, because that can affect overload resolution when enumerants
    are passed as parameters.'
