    \ will\noptimize away unnecessary vtbls in some cases without any manual user\
    \ intervention.\nFrom what I can tell, as of gcc 4.x, there is no comparable feature\
    \ in g++."
  - "[PAGE 34]\n\n# Still More “No-Cost” C++ Features\n\n+   - new and delete:\n \
    \ - By default, new = malloc + constructor(s) and\n    delete = destructor(s)\
    \ + free\n  - Note that error-handling behavior via exceptions is built in.\n\n\
    Important: new is useful even in systems where all memory is statically allocated.\n\
    \n+   - Placement new allows objects to be constructed at particular locations:\n\
    \  - E.g., in statically allocated memory.\n  - E.g., at memory-mapped addresses.\n\
    \n+   - We’ll see examples later.\n\nNote: for all of the preceding features,\
    \ if you don't use them, you don't pay."
  - '[PAGE 35]


    # "Low-Cost" C++ Features


    You may pay for these features, even if you don''t use them:


    +   - Exceptions: a small speed and/or size penalty (code)

    - When evaluating the cost of exceptions, be sure to do a fair comparison.

    - Error handling costs you something, no matter how it is implemented.

    - E.g., Saks reports object code increases of 15-40% for error handling based
    on return values.


    Details on Dan Saks’ analysis is in the *Embedded Systems Design* article referenced
    in the “Further Information” slides at the end of the notes.'
  - "[PAGE 36]\n\n# Approaches to Implementing Exceptions\n\nConsider the problem\
    \ of local object destruction:\n\n```\n{\n  V1\n  ...\n  {\n    V2\n    V3\n \
    \   ...\n  }\n  V4\n  V5\n  ...\n}\n```\n\nWhich objects should be destroyed if\
    \ an exception is thrown?\n\n+   - There are two basic approaches to keeping track."
  - "[PAGE 37]\n\n# Approaches to Implementing Exceptions\n\nOne is to keep a shadow\
    \ stack of objects requiring destruction if an exception is thrown.\n\n+   * Code\
    \ size increases to to include instructions for manipulating the shadow stack.\n\
    * Runtime data space increases to hold the shadow stack.\n* Program runtime increases\
    \ to allow for shadow stack manipulations.\n* Performance impact?\n  * Unknown.\
    \ Apples-to-apples comparisons are hard to come by.\n  * Ballpark gueststimate:\
    \ 5-10% hit in both time and space.\n  * “Guesimate” = “Speculation”\n\nThis is\
    \ sometimes known as the “Code Approach.”\n\n+   * Microsoft uses it for 32 bit\
    \ (but not 64 bit) Windows code.\n* g++ distributions for Windows use it, too."
  - '[PAGE 38]


    # Approaches to Implementing Exceptions


    The alternative maps program regions to objects requiring destruction:


    | Region | Objects |

    | --- | --- |

    | R0 | None |

    | R1 | V1 |

    | R2 | V1, V2 |

    | R3 | V1, V2, V3 |

    | R4 | Same as R1 |

    | R5 | V1, V4 |

    | R6 | V1, V4, V5 |


    +   - This analysis is simplified, e.g., it ignores the possibility that destructors
    may throw.


    +   - Most compilers for Unix use this approach. The 64 bit Itanium ABI uses it.'
  - '[PAGE 39]


    # Approaches to Implementing Exceptions


    +   - Program speed is unaffected when no exceptions are thrown.

    - Program size increases due to need to store the code to use the tables.

    - Static program size increases due to need to store the tables.

    - When no exception is thrown, these tables need not be in memory, in working
    set, or in cache.

    - Throwing exceptions is slow:

    - Tables must be read, possibly after being swapped in, possibly being uncompressed.

    - However, throwing exceptions should be ... exceptional.'
  - '[PAGE 40]


    # # Exceptions and Dynamically Allocated Memory


    Some compilers try to use heap memory for exception objects.


    +   - This can be unacceptable in some embedded systems.


    ## Don''t let this scare you:


    +   - Implementations reserve some non-heap memory for exception objects.

    - They have to be able to propagate std::bad_alloc exceptions!

    - Platforms with no heap should still be able to use exceptions.


    One platform that uses heap memory for exceptions (when it can) is g++.'
