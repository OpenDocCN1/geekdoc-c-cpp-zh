    };\n```\n\nAt runtime, the cost of Stack<T> instantiations is zero:\n\n+   - All\
    \ instantiations use the code of the single GenericPtrStack class\n- All Stack<T>\
    \ member functions are implicitly inline\n\nThe cost of type-safety is nothing."
