- md: "\n# When User Data is Part of the Callback\n\nSome callbacks are passed arbitrary\
    \ user data, e.g.,\n\n```cpp\nextern \"C\" {\n    typedef void (*ISR_t)(int, void\
    \ *pData); // callback APIs\n    void setISR(int interruptID, ISR_t isr, void\
    \ *pData); // may be like this\n}\n```\n\nThis change in signature propagates:\n\
    \n```cpp\nextern \"C\" {\n    void isrHelper(int interruptID, void *pData)\n \
    \   {\n        try {\n            InterruptMgr::isrDispatcher(interruptID, pData);\n\
    \        } catch (...) {\n            set errno, log exception, whatever...\n\
    \        }\n    }\n}\n```\n\n# When User Data is Part of the Callback\n\nInterruptMgr's\
    \ ISRs array can then be eliminated.\n\n- The user data is the function pointer\
    \ or object to be invoked:\n\n```cpp\nclass InterruptMgr {\npublic:\n    typedef\
    \ std::function<void(int)> ISRType;\n    ...\n    static void registerISR(int\
    \ interruptID, ISRType *pFunc)\n    {\n        setISR(interruptID, isrHelper,\
    \ pFunc);\n    }\n    static void isrDispatcher(int interruptID, void *pFunc)\n\
    \    {\n        (static_cast<ISRType*>(pFunc))(interruptID);\n    }\n};\n```\n\
    \nNote that whatever pFunc was passed to registerISR must continue to exist when\
    \ isrDispatcher invokes it. That is, the lifetime of the functor passed to registerISR\
    \ must extend to the last time isrDispatcher will invoke that functor. Among other\
    \ things, this means that pointers to temporaries must not be passed to registerISR.\n\
    \n# When User Data is Part of the Callback\n\nSample client code:\n\n```cpp\n\
    InterruptMgr::ISRType f(std::bind(&TimerISR::isr, &isr, _1));\nInterruptMgr::registerISR(TIMER_INT_NUM,\
    \ &f);\n```\n\nThe call to bind on this page won't compile as shown unless std::placeholders::_1\
    \ has been made visible (e.g., via a using declaration). This is virtually always\
    \ done in code that uses bind.\n\n# Summary: Implementing Callbacks from C\n\n\
    - C API callbacks in C++ can't be to non-static member functions.\n- Some platforms\
    \ allow calls to static member functions.\n- Support only callbacks to non-members\
    \ declared extern \"C\".\n\n- 2 basic approaches to getting into member functions:\n\
    \  - Virtual functions.\n  - std::function objects.\n\n- Approaches vary in several\
    \ ways:\n  - Need to declare base classes and virtual functions.\n  - Whether\
    \ non-member functions are directly supported.\n  - Whether callback signatures\
    \ may vary.\n  - Use of \"non-standard\" features (i.e., TR1 or C++11 components).\n\
    \  - Use of heap memory and/or vtbls.\n  - Invocation speed.\n\n# TR1\n\n- Standard\
    \ C++ Committee Library “Technical Report 1.”\n- Basis for new library functionality\
    \ in C++11.\n- TR1 functionality is in namespace std::tr1.\n- TR1-like functionality\
    \ in C++11 is in std.\n  Such functionality not identical to that in TR1.\n  Uses\
    \ new C++11 language features.\n  Tweaks APIs based on experience with TR1.\n\
    - Calling interfaces largely backwards compatible\n  C++11 primarily offers “enhanced”\
    \ TR1 functionality\n\nAmong other things, C++11 versions of function and shared_ptr\
    \ allocator support present in TR1, and tuples in C++11 offer concatenation functions\
    \ (tuple_cat) not in TR1.\n\n# Effective C++ in an Embedded Environment\n\n# TR1\
    \ Summary\n\n| New Functionality | Summary |\n|---|---|\n| Reference Wrapper |\
    \ Objects that act like references |\n| Smart Pointers | Reference-counting smart\
    \ pointers |\n| Getting Function Object Return Types | Useful for template programming\
    \ |\n| Enhanced Member Pointer Adapter | 2nd-generation mem_fun/mem_fun_ref |\n\
    | Enhanced Binder | 2nd-generation bind1st/bind2nd |\n| Generalized Functors |\
    \ Generalization of function pointers |\n| Type Traits | Compile-time reflection\
    \ |\n| Random Numbers | Supports customizable distributions |\n| Mathematical\
    \ Special Functions | Laguerre polynomials, beta function, etc. |\n| Tuples |\
    \ Generalization of pair |\n| Fixed Size Array | Like vector, but no dynamic allocation\
    \ |\n| Hash Tables | Hash table-based set/multiset/map/multimap |\n| Regular Expressions\
    \ | Generalized regex searches/replacements |\n| C99 Compatibility | 64-bit ints,\
    \ <cstdint>, new format specs, etc. |\n\nScott Meyers, Software Development Consultant\n\
    http://www.artistela.com/\n\n© 2012 Scott Meyers, all rights reserved.\nSlide\
    \ 209\n\nRegarding random numbers, C supports only rand, which is expected to\
    \ produce a uniform distributions. TR1 supports both “engines” and “distributions.”\
    \ An engine produces a uniform distribution, while a distribution takes the result\
    \ of an engine and produces an arbitrary distribution from it. TR1 specifies default\
    \ versions for the engine and distributions, but it also allows for customized-versions\
    \ of both.\n\nScott Meyers, Software Development Consultant\n\n© 2012 Scott Meyers,\
    \ all rights reserved.\n\n# TR1 Itself\n\nTR1 is a specification:\n\n- Aimed at\
    \ implementers, not users.\n- Lacks background, motivation, rationale for functionality\
    \ it specifies.\n- Doesn't stand on its own.\n  - E.g., assumes information in\
    \ C++03.\n\n# Understanding TR1\n\nTo understand the functionality in TR1:\n\n\
    - Consult the Further Information.\n- Look at the extension proposals.\n- Links\
    \ are available at Scott Meyers’ TR1 Information web page, http://www.aristeia.com/ECGE/TR1_info.html.\n\
    \n| EC++, Third Edition Page | Name | TR1 Name | Proposal Document |\n|---|---|---|---|\n\
    | 265 | Smart Pointers | Smart Pointers | n1450 |\n| 265 | Traits | Polymorphic\
    \ Function Wrappers | n1402 |\n| 266 | ioul | Function Object Binders | n1455\
    \ |\n| 266 | Hash Tables | Unspecified Associates Containers | n1456 |\n| 266\
    \ | Regular Expressions | Regular Expressions | n1429 |\n| 267 | Tuples | Tuple\
    \ Types | n1403 (PDF) |\n| 267 | array | Fixed Size Array | n1479 |\n| 267 | mem_fn\
    \ | Function fn | n1432 |\n| 267 | reference_wrapper | Reference Wrappers | n1453\
    \ |\n| 267 | Random Number Generation | Random Number Generation | n1452 |\n|\
    \ 267 | Mathematical Special Functions | Mathematical Special Functions | n1423\
    \ |\n| 267 | C99 Compatibility | C9 Compatibility | n1468 |\n| 267 | Type Traits\
    \ | Type Traits | n1424 |\n| 267 | traits_of | Function Return Types | n1454 |\n\
    \nScott Meyers, Software Development Consultant\nhttp://www.aristeia.com/\n\n\
    © 2012 Scott Meyers, all rights reserved.\nSlide 211\n\n[It’s a good idea to have\
    \ an open window showing the page depicted here, if time allows.]\n\n# What is\
    \ Boost?\n\n* A volunteer organization and a web site (boost.org).\n* A repository\
    \ for C++ libraries that are\n  * Open-source\n  * Portable\n  * Peer-reviewed\n\
    \  * Available under a “non-viral” license.\n* A place to try out prospective\
    \ standard library enhancements.\n\n# Boost and TR1\n\nBoost motivated most of\
    \ and implements all of TR1:\n\n- Other full or partial TR1 implementations are\
    \ available:\n- Microsoft:\n  - 12/14 libs included in VC++ 2010-11 (VC10-11)\n\
    \  - C++11 versions ship with VC++2011.\n- Dinkumware: full TR1 impls for selected\
    \ platforms.\n- Gnu: 10/14 libs ship with gcc 4.\n\n10 of 14 libraries in TR1\
    \ are modeled on Boost libraries.\nLibraries missing from the VC9 TR1 update are\
    \ mathematical special functions and C99 compatibility. The same is true in VC10-11.\n\
    Using Boost instead of native library implementations is a way to reduce variability\
    \ (e.g., in implementation and performance) across platforms.\n\n# TR1 and Boost\n\
    \nBoost ≠ TR1:\n\n* Boost offers *much* more functionality than TR1.\n  ➡ Libraries\
    \ rarely consider embedded issues.\n  * But performance always a concern.\n\n\
    * Boost APIs don’t match corresponding TR1 APIs.\n  ➡ E.g., Bind and Tuple have\
    \ some namespace “issues”.\n\n* Other TR1 implementations may differ from Boost\
    \ implementations.\n  ➡ TR1 specifies *interfaces, not implementations*.\n\n#\
    \ Boost/TR1 Summary\n\n- TR1 is a specification for standard library functionality\
    \ beyond C++03.\n- Boost is the premier repository of open-source, portable, peer-reviewed\
    \ C++ libraries.\n- Much TR1 functionality is available from Boost and others.\n\
    - Boost offers many non-TR1 libraries, too.\n"
  mdcn: "\n\n# 当用户数据作为回调的一部分\n\n某些回调函数传递了任意的用户数据，例如：\n\n```cpp\nextern \"C\" {\n \
    \   typedef void (*ISR_t)(int, void *pData); // 回调 API\n    void setISR(int interruptID,\
    \ ISR_t isr, void *pData); // 可能像这样\n}\n```\n\n此签的更改会向下传播：\n\n```cpp\nextern \"\
    C\" {\n    void isrHelper(int interruptID, void *pData)\n    {\n        try {\n\
    \            InterruptMgr::isrDispatcher(interruptID, pData);\n        } catch\
    \ (...) {\n            set errno, log exception, whatever...\n        }\n    }\n\
    }\n```\n\n# 当用户数据作为回调的一部分\n\n此时可以消除 InterruptMgr 的 ISR 数组。\n\n- 用户数据是需要被调用的函数指针或对象：\n\
    \n```cpp\nclass InterruptMgr {\npublic:\n    typedef std::function<void(int)>\
    \ ISRType;\n    ...\n    static void registerISR(int interruptID, ISRType *pFunc)\n\
    \    {\n        setISR(interruptID, isrHelper, pFunc);\n    }\n    static void\
    \ isrDispatcher(int interruptID, void *pFunc)\n    {\n        (static_cast<ISRType*>(pFunc))(interruptID);\n\
    \    }\n};\n```\n\n注意，无论传递给 `registerISR` 的 pFunc 是什么，在 `isrDispatcher` 调用时必须存在。也就是说，传递给\
    \ `registerISR` 的函数对象的寿命必须持续到 `isrDispatcher` 最后一次调用该函数。此外，这意味着不能将指向临时对象的指针传递给\
    \ `registerISR`。\n\n# 当用户数据作为回调的一部分\n\n示例客户端代码：\n\n```cpp\nInterruptMgr::ISRType\
    \ f(std::bind(&TimerISR::isr, &isr, _1));\nInterruptMgr::registerISR(TIMER_INT_NUM,\
    \ &f);\n```\n\n除非 `std::placeholders::_1` 可见（例如通过 `using` 声明），否则本页所示的 bind 调用将无法编译。这在使用\
    \ `bind` 的代码中几乎是总是做法。\n\n# 总结：从 C 实现回调\n\n- C++ 中的 C API 回调不能是非静态成员函数。\n- 某些平台允许调用静态成员函数。\n\
    - 仅支持声明为 `extern \"C\"` 的非成员回调。\n\n- 进入成员函数的 2 种方法：\n  - 虚函数。\n  - `std::function`\
    \ 对象。\n\n- 方法在多个方面有所不同：\n  - 需要声明基类和虚函数。\n  - 是否直接支持非成员函数。\n  - 回调签名是否可以变化。\n\
    \  - “非标准”特征的使用（即 TR1 或 C++11 组件）。\n  - 堆内存和/或虚函数表（vtbl）的使用。\n- 调用速度。\n\n# TR1\n\
    \n- C++ 委员会库“技术报告 1”（Technical Report 1）。\n- C++11 新库功能的基础。\n- TR1 功能位于 `std::tr1`\
    \ 命名空间中。\n- C++11 中类 TR1 的功能位于 `std`。\n  此类功能与 TR1 中的并不完全相同。\n  使用了新的 C++11 语言特性。\n\
    \  根据对 TR1 的经验调整了 API。\n- 调用接口在很大程度上向后兼容\n  C++11 主要提供了“增强型”的 TR1 功能\n\n此外，C++11\
    \ 版本的函数和 `shared_ptr` 分配器支持 TR1 中存在的功能，而 C++11 中的 tuple  TR1 中不具备的连接函数（`tuple_cat`）。\n\
    \n# 嵌入式环境下的有效 C++\n\n# TR1 总结\n\n| 新功能 | 总结 |\n|---|---|\n| 引用包装 (Reference Wrapper)\
    \ | 行为类似于引用的对象 |\n| 智能指针 (Smart Pointers) | 引用计数智能指针 |\n| 获取函数对象返回类型 | 对模板编程有用\
    \ |\n| 增强型成员指针适配器 | 第二代 mem_fun/mem_fun_ref |\n| 增强型绑定器 (Binder) | 第二代 bind1st/bind2nd\
    \ |\n| 通用函数对象 (Generalized Functors) | 函数指针的泛化 |\n| 类型特质 (Type Traits) | 编译时反射\
    \ |\n| 随机数 (Random Numbers) | 支持自定义分布 |\n| 数学特殊函数 | Laguerre 多项式、Beta 函数等 |\n\
    | 元组 (Tuples) | 对（pair）的泛化 |\n| 固定大小数组 | 类似 vector，但没有动态分配 |\n| 哈希表 (Hash Tables)\
    \ | 基于哈希表的 set/multiset/map/multimap |\n| 正则表达式 (Regular Expressions) | 通用的正则搜索/替换\
    \ |\n| C99 兼容性 | 64 位整数、`<cstdint>`、新格式说明符等 |\n\nScott Meyers, 软件开发顾问\nhttp://www.artistela.com/\n\
    \n© 2012 Scott Meyers, 保留所有。\n幻灯片 209\n\n关于随机数，C 仅支持 `rand`，其预期是产生均匀分布。TR1 同时支持“引擎”（engines）和“分布”（distributions）。引擎产生均匀分布，而分布获取引擎的结果并据此产生任意分布。TR1\
    \ 为引擎和分布指定了默认版本，但它允许对两者进行自定义版本定制。\n\nScott Meyers, 软件开发顾问\n\n© 2012 Scott Meyers,\
    \ 保留所有。\n\n# TR1 本身\n\nTR1 是一个规范：\n\n- 目标是实现者，而非用户。\n- 对其所规定的功能缺乏背景、动机和原理说明。\n\
    - 无法独立存在。\n  - 例如，假设了 C++03 中的信息。\n\n# 理解 TR1\n\n要理解 TR1 中的功能：\n\n- 咨询“更多信息”。\n\
    - 查看扩展提案。\n- Scott Meyers 处提供了链接。\n\n| EC++ 页 | 名称 | TR1 名称 | 提案文档 |\n|---|---|---|\n\
    | 265 | 智能指针 | 智能指针 | 1450 |\n| 265 | 特质 | 泛包装器 | 1402 |\n| 266 | 绑定器 | 函数绑定器\
    \ | 1455 |\n| 266 | 哈希表 | 未指定的容器 | 1456 |\n| 266 | 正则表达式 | 正则表达式 | 1429 |\n| 267\
    \ | 元组 | 元组类型 | 1403 (PDF) |\n| 267 | 数组 | 固定大小数组 | 1479 |\n| 267 | mem_fn | 函数\
    \ fn | 1432 |\n| 267 | 引用包装器 | 引用包装器 | 1453 |\n| 267 | 随机数生成 | 随机数生成 | 1452 |\n\
    | 267 | 数学特殊函数 | 数学特殊函数 | 1423 |\n| 267 | C99 兼容性 | C99 兼容性 | 1468 |\n| 267 |\
    \ 特质 | 类型特质 | 1424 |\n| 267 | traits_of | 函数返回类型 | 1454 |\n\nScott Meyers, 软件开发顾问\n\
    http://www.aristeia.com/\n\n© 2012 Scott Meyers, 保留所有。\n幻灯片 211\n\n[如果允许，最好有一个显示此处页面的窗口。]\n\
    \n# 什么是 Boost\n\n* 一个志愿者组织和一个网站（boost.org）。\n* 一个 C++ 库仓库，这些库：\n  * 开源\n  * 可移植\n\
    \  * 经过评审\n  * 根据“非病毒性”许可可用。\n* 一个尝试标准库增强功能的地方。\n\n# Boost 与 TR1\n\nBoost 促进了大部分\
    \ TR1 并实现了所有 TR1：\n\n- 可用的其他完整或部分的 TR1 实现：\n- Microsoft:\n  - 12/14 个库包含在 VC++\
    \ 2010-11 中（VC10-11）\n  - C++11 版本随 VC++2011 发布\n- Dinkumware: 针对选择平台的完整 TR1 实现\n\
    - GNU: 10/14 个库随 gcc 4 发布\n\nTR1 中的 14 个库有 10 个是 Boost 库模型。\n缺失的库是数学特殊函数和 C99\
    \ 兼容性。VC10-11 也是如此。\n使用 Boost 代替原生库实现是减少平台间差异（例如在实现和性能方面）的方法。\n\n# TR1 与 Boost\n\
    \nBoost ≠ TR1：\n\n* Boost 提供的功能比 TR1 多得多。\n  ➡ 库很少考虑嵌入式问题。\n  * 但性能始终是一个关注点。\n\
    \n* Boost API 与对应的 TR1 API 不匹配。\n  ➡ 例如，Bind 和 Tuple 在命名空间上存在一些“问题”。\n\n* 其他 TR1\
    \ 实现可能与 Boost 实现不同。\n  ➡ TR1 规定的是接口，而非实现。\n\n# Boost/TR1 总结\n\n- TR1 是 C++03 之后标准库功能的规范。\n\
    - Boost 是开源、可移植、经过评审的 C++ 库的主要仓库。\n- 许多 TR1 功能可以通过 Boost 和其他地方获取。\n- Boost 还提供许多非\
    \ TR1 的库。\n\n"
