  - "[PAGE 208]\n\n# Summary: Implementing Callbacks from C\n\n+   - C API callbacks\
    \ in C++ can't be to non-static member functions.\n  - Some platforms allow calls\
    \ to static member functions.\n  - Support only callbacks to non-members declared\
    \ extern \"C\".\n\n+   - 2 basic approaches to getting into member functions:\n\
    \  - Virtual functions.\n  - std::function objects.\n\n+   - Approaches vary in\
    \ several ways:\n  - Need to declare base classes and virtual functions.\n  -\
    \ Whether non-member functions are directly supported.\n  - Whether callback signatures\
    \ may vary.\n  - Use of \"non-standard\" features (i.e., TR1 or C++11 components).\n\
    \  - Use of heap memory and/or vtbls.\n  - Invocation speed."
  - "[PAGE 209]\n\n# TR1\n\n+   - Standard C++ Committee Library “Technical Report\
    \ 1.\\n- Basis for new library functionality in C++11.\n- TR1 functionality is\
    \ in namespace std::tr1.\n- TR1-like functionality in C++11 is in std.\n  Such\
    \ functionality not identical to that in TR1.\n  Uses new C++11 language features.\n\
    \  Tweaks APIs based on experience with TR1.\n- Calling interfaces largely backwards\
    \ compatible\n  C++++11 primarily offers “enhanced” TR1 functionality\n\nAmong\
    \ other things, C++11 versions of function and shared_ptr allocator support present\
    \ in TR1, and tuples in C++11 offer concatenation functions (tuple_cat) not in\
    \ TR1."
  - '[PAGE 210]


    # Effective C++ in an Embedded Environment


    # TR1 Summary


    | New Functionality | Summary |

    |---|---|

    | Reference Wrapper | Objects that act like references |

    | Smart Pointers | Reference-counting smart pointers |

    | Getting Function Object Return Types | Useful for template programming |

    | Enhanced Member Pointer Adapter | 2nd-generation mem_fun/mem_fun_ref |

    | Enhanced Binder | 2nd-generation bind1st/bind2nd |

    | Generalized Functors | Generalization of function pointers |

    | Type Traits | Compile-time reflection |

    | Random Numbers | Supports customizable distributions |

    | Mathematical Special Functions | Laguerre polynomials, beta function, etc. |

    | Tuples | Generalization of pair |

    | Fixed Size Array | Like vector, but no dynamic allocation |

    | Hash Tables | Hash table-based set/multiset/map/multimap |

    | Regular Expressions | Generalized regex searches/replacements |

    | C99 Compatibility | 64-bit ints, <cstdint>, new format specs, etc. |


    Scott Meyers, Software Development Consultant

    http://www.artistela.com/


    © 2012 Scott Meyers, all rights reserved.

    Slide 209


    Regarding random numbers, C supports only rand, which is expected to produce a
    uniform distributions. TR1 supports both “engines” and “distributions.” An engine
    produces a uniform distribution, while a distribution takes the result of an engine
    and produces an arbitrary distribution from it. TR1 specifies default versions
    for the engine and distributions, but it also allows for customized-versions of
    both.


    Scott Meyers, Software Development Consultant


    © 2012 Scott Meyers, all rights reserved.'
