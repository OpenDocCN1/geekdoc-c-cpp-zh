- md: "\nEffective C++ in an Embedded Environment\n\n## Creating Typed Values\n\n\
    Useful (typed) constants from the SI system:\n\n```cpp\nconst Mass kilogram(1);\
    \              // in each case, the internal\nconst Distance meter(1);       \
    \  // double is set to 1.0\nconst Time second(1);\n```\n\nOther useful (typed)\
    \ constants are easy to define:\n\n```cpp\nconst Mass pound(kilogram/2.2);   \
    \   // Avoirdupois pound\nconst Time minute(60 * second);\nconst Distance inch(.0254\
    \ * meter);\n```\n\nAs are variables:\n\n```cpp\nint rawLength;              \
    \        // untyped length from outside\nstd::cin >> rawLength;             //\
    \ source, known to be in inches\nDistance length(rawLength * inch);   // typed\
    \ length\n```\n\nScott Meyers, Software Development Consultant\n© 2012 Scott Meyers,\
    \ all rights reserved.\n\nThe term “pound” is used for both mass and force. As\
    \ a unit of mass, it’s more formally known as “Avoirdupois pound.” As a unit of\
    \ force, it’s more formally known as “pound-force.” Both are sometimes abbreviated\
    \ as “lb”.\n\n## Enforcing Dimensional Unit Correctness\n\nThe real fun comes\
    \ when multiplying/dividing Units:\n\n```cpp\ntemplate<int m1, int d1, int t1,\n\
    \    int m2, int d2, int t2>\nUnits<m1+m2, d1+d2, t1+t2>\noperator*(const Units<m1,\
    \ d1, t1>& Lhs,\n    const Units<m2, d2, t2>& rhs)\n{\n    typedef Units<m1+m2,\
    \ d1+d2, t1+t2> ResultType;\n    return ResultType(Lhs.value() * rhs.value());\n\
    }\n```\n\n```cpp\ntemplate<int m1, int d1, int t1,\n    int m2, int d2, int t2>\n\
    Units<m1-m2, d1-d2, t1-t2>\noperator/(const Units<m1, d1, t1>& Lhs,\n    const\
    \ Units<m2, d2, t2>& rhs)\n{\n    typedef Units<m1-m2, d1-d2, t1-t2> ResultType;\n\
    \    return ResultType(Lhs.value() / rhs.value());\n}\n```\n\nReal implementations\
    \ typically use more template arguments for Units:\n\n- One specifies the precision\
    \ of the value (typically float or double)\n- The others are for the exponents\
    \ of the seven SI units:\n- Mass\n- Distance\n- Time\n- Current\n- Temperature\n\
    - Luminous intensity\n- Amount of substance\n\n```cpp\ntemplate<class T, int m,\
    \ int d, int t, int q, int k, int i, int a>\nclass Units {\npublic:\n    explicit\
    \ Units(T initVal = 0) : val(initVal) {}\n    T& value() { return val; }\n   \
    \ const T& value() const { return val; }\n\nprivate:\n    T val;\n};\n```\n\n\
    ```cpp\ntemplate<class T, int m1, int d1, int t1, int q1, int k1, int i1, int\
    \ a1,\n                         int m2, int d2, int t2, int q2, int k2, i2, int\
    \ a2>\nUnits<T, m1+m2, d1+d2, t1+t2, q1+q2, k1+k2, i1+i2, a1+a2>\noperator*(const\
    \ Units<T, m1, d1, t1, q1, k1, i1, a1>& lhs,\n          const Units<T, m2, d2,\
    \ t2, q2, k2, i2, a2>& rhs)\n{\n    typedef Units<T, m1+m2, d1+d2, t1+t2, q1+q2,\
    \ k1+k2, i1+i2, a1+a2> ResultType;\n    return ResultType(lhs.value() * rhs.value());\n\
    }\n```\n\n## Dimensionless Quantities\n\nDimensionless quantities (i.e., objects\
    \ of type Units<T,0,0,0,0,0,0,0>) should be type-compatible with unitless types\
    \ (e.g., int, double, etc.).\n\n- Partial template specialization can help:\n\n\
    ```cpp\ntemplate<typename T>\nclass Units<T, 0, 0, 0, 0, 0, 0, 0>\npublic:\n \
    \   Units(T initVal = 0): val(initVal) {} // allow implicit conversion\n    operator\
    \ T() const { return val; } // to/from values of type T\n    Units& operator=(T\
    \ newVal) // allow assignments from\n    { val = newVal; return *this; } // values\
    \ of type T\n    ...\nprivate:\n    T val;\n};\n```\n\nIf partial template specialization\
    \ is unavailable, you can totally specialize for e.g., T = double and/or T = float.\n\
    \n## Efficiency\n\nSome compilers won't put objects in registers:\n\n- A Units<double,\
    \ ...> may yield worse code than a raw double.\n\nIdea:\n\n- Two sets of headers,\
    \ checking set and no-op set.\n\n```cpp\n// checking header // no-op header\n\
    template<...>\ndouble UnitPrecision;\nclass Units {\n    ...\n}\ntypedef Units<...>\
    \ Mass; typedef Mass;\ntypedef Units<...> Distance; typedef Distance;\ntypedef\
    \ Units<...> Velocity; typedef Velocity;\ntypedef Units<...> Force; typedef Force;\n\
    ```\n\nChecking header uses template, non-checking header doesn't: The “Idea”\
    \ sketched on this slide and the next is just that I have not implemented, so\
    \ there may be problems.\n\n- Choose header set at build time.\n- Using checking\
    \ headers catches all errors.\n- Using no-op headers generates optimal code.\n\
    - Clean compilation with checking headers ⇒ No-op headers can then safely used.\n\
    - E.g., acceleration errors can't exist in code.\n\nCaveats:\n\n- double computeValue(Mass\
    \ m); // 3 functions with double computeValue(Distance d); double computeValue(double\
    \ d); // only 1 with typedef could lead to undefined behavior via ODR violation.\n\
    \nODR = “One Definition Rule”. If the three versions of computeValue are compiled\
    \ separately with checking headers and linked with unchecked headers, the system\
    \ will have an inconsistent definition of computeValue.\n\n## Industrial-Strength\
    \ Dimensional Analysis\n\nState-of-the-art implementations more sophisticated\
    \ than what I've shown:\n\n- Allow fractional exponents (e.g., distance$^{1/2}$)\n\
    - Support multiple unit systems (beyond just SI)\n- Use template metaprogramming\
    \ for compile-time.\n- E.g., to compute GCDs when reducing fractional exponents.\n\
    - distance$^{1/2}$ = distance$^{4/8}$\n\nIt can determine whether this “simple”\
    \ formula, $\\frac{1}{X_0} = 4\\alpha r_e^2 \\frac{N_A}{A} [Z_{rad} - f(Z)] +\
    \ Z'_{rad}$ is correctly modified by this C++:\n\n```cpp\nEnergy<> finalEnergy(Element\
    \ const material, Density<> const dens,\n    Length<> const thick, Energy<> const\
    \ initEnergy) {\n    AtomicWeight<> const A = material->atomicWeight;\n    AtomicNumber<>\
    \ const Z = material->atomicNumber;\n    Number<> const L_rad = log(184.15 / sqrt(3));\n\
    \    Number<> const Lp_rad = log(119.4 / sqrt(Z));\n    Length<> const X_0 = 4.0\
    \ * r_e * r_e * N_A / A *\n    (Z * Z * L_rad + Z * Lp_rad);\n    return initEnergy\
    \ / exp(thick / X_0);\n}\n```\n\n(It's not. There are three dimensional type errors.)\
    \ Everything on this slide is Walter E. Brown’s paper, which is referenced in\
    \ the “Further Information” slides at the end of the notes.\n\n## Not Quite Foolproof\n\
    \nSome unit combinations correspond to more than one physical quantity.\n\n- Energy\
    \ and torque both correspond to Distance * Force.\n\nOur approach can't tell them\
    \ apart:\n\n```cpp\ntypedef Units<1, 2> Energy;\ntypedef Units<1, 2, -2> Torque;\n\
    \nEnergy e;\nTorque t;\n\ne = t; // nonsensical, but will compile\n```\n\n## Summary:\
    \ Enforcing Dimensional Unit Correctness\n\n- Templates can be used to add new\
    \ kinds of type safety.\n- Non-type template parameters are both powerful and\
    \ useful.\n- Templates can add type safety to code with little or no runtime penalty\n\
    \n## Specifying FSMs\n\nConsider this FSM (Finite State Machine) for a CD player:\n\
    \n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_246_0.png)\n\nTaken (as is the entire\
    \ FSM example) from Abhams' and Gurtovoy's C++ Template Metaprogramming.\n\n-\
    \ Full citation in Further Information.\n- I modified their material slightly\
    \ for presentation.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_246_1.png)\n\n\
    The legal folks at Pearson require that I note that the FSA diagram and FSA table\
    \ in this section of the notes is adapted from Abhams/Gurtovoy, C++ TEMPLATE METAPROGRAM:\
    \ CONCEPTS TOOLS & TECHNIQUES FROM BOOST AND BEYOND, 2005 Pearson Education, Inc.\
    \ and is used with permission of Pearson Education, Inc.\n\n## Effective C++ in\
    \ an Embedded Environment\n\n## Specifying FSMs\n\nHere's a table version that\
    \ also shows transition actions:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_247_0.png)\n\
    \n| Current State | Event | Next State | Transition Action |\n| --- | --- | ---\
    \ | --- |\n| Empty | Open/Close | Open | Open drawer |\n| Empty | CD-Detected\
    \ | Stopped | Store CD info |\n| Stopped | Play | Playing | Start playback |\n\
    | Stopped | Open/Close | Open | Open Drawer |\n| Open | Open/Close | Empty | Close\
    \ drawer; collect CD info |\n| Paused | Play | Playing | Resume playback |\n|\
    \ Paused | Stop | Stopped | Stop playback |\n| Paused | Open/Close | Open | Stop\
    \ playback; open drawer |\n| Playing | Stop | Stopped | Stop playback |\n| Playing\
    \ | Pause | Paused | Pause playback |\n| Playing | Open/Close | Open | Stop playback;\
    \ open drawer |\n"
  mdcn: "\n嵌入式环境中的高效 C++\n\n## 创建带类型的值\n\n来自国际单位制（SI）的有用的（带类型）常量：\n\n```cpp\nconst\
    \ Mass kilogram(1);              // 在每个情况下，内部的\nconst Distance meter(1);     \
    \    // double 被设为 1.0\nconst Time second(1);\n```\n\n其他有用的（带类型）常量也易于定义：\n\n```cpp\n\
    const Mass pound(kilogram/2.2);      // 市场磅\nconst Time minute(60 * second);\n\
    const Distance inch(.0254 * meter);\n```\n\n变量也是如此：\n\n```cpp\nint rawLength;\
    \                      // 来自外部的未类型化长度\nstd::cin >> rawLength;             // 源，已知单位为英寸\n\
    Distance length(rawLength * inch);   // 带类型长度\n```\n\nScott Meyers, 软件开发顾问\n©\
    \ 2012 Scott Meyers, 保留所有权利。\n\n“磅（pound）”一词既用于质量也用于力。作为质量的单位，它更正式的名称是“爱衡制磅（Avoirdupois\
    \ pound）”。作为力的单位，它更正式的名称是“磅力（pound-force）”。两者有时都缩写为“lb”。\n\n## 强制执行维度单位的正确性\n\n\
    当单位进行乘法/除法时，真正的乐趣来自于：\n\n```cpp\ntemplate<int m1, int d1, int t1,\n    int m2,\
    \ int d2, int t2>\nUnits<m1+m2, d1+d2, t1+t2>\noperator*(const Units<m1, d1, t1>&\
    \ Lhs,\n    const Units<m2, d2, t2>& rhs)\n{\n    typedef Units<m1+m2, d1+d2,\
    \ t1+t2> ResultType;\n    return ResultType(Lhs.value() * rhs.value());\n}\n```\n\
    \n```cpp\ntemplate<int m1, int d1, int t1,\n    int m2, int d2, int t2>\nUnits<m1-m2,\
    \ d1-d2, t1-t2>\noperator/(const Units<m1, d1, t1>& Lhs,\n    const Units<m2,\
    \ d2, t2>& rhs)\n{\n    typedef Units<m1-m2, d1-d2, t1-t2> ResultType;\n    return\
    \ ResultType(Lhs.value() / rhs.value());\n}\n```\n\n实际实现通常为 Units 使用更多的模板参数：\n\
    \n- 一个用于指定值的精度（通常为 float 或 double）\n- 其它的用于七个国际标准单位的指数：\n- 质量\n- 距离\n- 时间\n- 电流\n\
    - 温度\n- 光光\n- 物质量\n\n```cpp\ntemplate<class T, int m, int d, int t, int q, int\
    \ k, int i, int a>\nclass Units {\npublic:\n    explicit Units(T initVal = 0)\
    \ : val(initVal) {}\n    T& value() { return val; }\n    const T& value() const\
    \ { return val; }\n\nprivate:\n    T val;\n};\n```\n\n```cpp\ntemplate<class T,\
    \ int m1, int d1, int t1, int q1, int k1, int i1, int a1,\n                  \
    \       int m2, int d2, int t2, int q2, int k2, i2, a2>\nUnits<T, m1+m2, d1+d2,\
    \ t1+t2, q1+q2, k1+k2, i1+i2, a1+a2>\noperator*(const Units<T, m1, d1, t1, q1,\
    \ k1, i1, a1>& lhs,\n          const Units<T, m2, d2, t2, q2, k2, i2, a2>& rhs)\n\
    {\n    typedef Units<T, m1+m2, d1+d2, t1+t2, q1+q2, k1+k2, i1+i2, a1+a2> ResultType;\n\
    \    return ResultType(lhs.value() * rhs.value());\n}\n```\n\n## 无量纲量\n\n无量纲量（即类型为\
    \ `Units<T,0,0,0,0,0,0,0>` 的对象）应该与无单位类型（例如 int、double 等）具有类型兼容。\n\n- 部分模板特化可以有所帮助：\n\
    \n```cpp\ntemplate<typename T>\nclass Units<T, 0, 0, 0, 0, 0, 0, 0>\npublic:\n\
    \    Units(T initVal = 0): val(initVal) {} // 允许隐式转换\n    operator T() const {\
    \ return val; } // 与类型 T 的值转换\n    Units& operator=(T newVal) // 允许从...\n    {\
    \ val = newVal; return *this; } // 类型 T 的值赋值\n    ...\nprivate:\n    T val;\n\
    };\n```\n\n如果无法使用部分模板特化，你可以完全为 T = double 和/或 T = float 进行特化。\n\n## 效率\n\n某些编译器不会将对象放入寄存器中：\n\
    \n- 一个 `Units<double, ...>` 产生的代码可能比原始 double 更差。\n\n主意：\n\n- 两组头文件：检查集（checking\
    \ set）和空操作集（no-op set）。\n\n```cpp\n// checking header // no-op header\ntemplate<...>\n\
    double UnitPrecision;\nclass Units {\n    ...\n}\ntypedef Units<...> Mass; typedef\
    \ Mass;\ntypedef Units<...> Distance;\n```\n"
