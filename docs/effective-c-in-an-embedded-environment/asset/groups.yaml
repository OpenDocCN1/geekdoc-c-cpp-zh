- md: "\n# Summary: Interface-Based Programming\n\n- One interface, multiple implementations.\n\
    - Polymorphism used to select the implementation.\n  - Runtime polymorphism uses\
    \ virtual functions.\n  - Link-time polymorphism uses linker configuration.\n\
    \  - Compile-time polymorphism uses typedefs.\n\n# Overview\n\nDay 1 (Approximate):\n\
    \n- \"C++\" and \"Embedded Systems\"\n- A Deeper Look at C++\n  - Implementing\
    \ language features\n  - Understanding inlining\n  - Avoiding code bloat\n- 3\
    \ Approaches to Interface-Based Programming\n  - Dynamic Memory Management\n \
    \ - C++ and ROMability\n\n# Dynamic Memory Management\n\nEmbedded developers often\
    \ claim heap management isn’t an issue:\n\n- Client: “We don’t have a heap.”\n\
    - Me: “You’re right. You have five heaps.”\n- Dynamic memory management is present\
    \ in many embedded systems.\n- Even if malloc/free/new/delete never called.\n\
    - Key indicator:\n  - Variable-sized objects going in fixed-size pieces of memory.\n\
    \    - E.g., event/error logs, rolling histories, email messages, etc.\n\nThe\
    \ quote at the top of the slide is based on my first interaction with an embedded\
    \ team. They warned me that they had no heap, but when I examined their design,\
    \ I saw that they had five pools of dynamically allocated memory. What they meant\
    \ was that they didn’t call *new* or *delete*, but they still performed dynamic\
    \ memory management. Effectively, they had five heaps.\n\nScott Meyers, Software\
    \ Development Consultant\n© 2012 Scott Meyers, all rights reserved.\n\n# Dynamic\
    \ Memory Management\n\nFour common worries:\n\n- Speed:\n  - Are new/delete/malloc\
    \ fast enough?\n  - How much variance, i.e., how deterministic?\n\n- Fragmentation:\n\
    \  - Will heap devolve into unusably small chunks?\n  - This is external fragmentation.\n\
    \n- Memory leaks:\n  - Will some allocations go undeallated?\n\n- Memory exhaustion:\n\
    \  - What if an allocation request can't be satisfied?\n\nEach concern can be\
    \ addressed.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_97_0.png)\n\nThis is\
    \ not an exhaustive list of concerns, just a list of common ones.\n\n# A Survey\
    \ of Allocation Strategies\n\nEach less general than malloc/free/new/delete.\n\
    \n- Typically more suited to embedded use.\n\nWe'll examine:\n\n- Fully static\
    \ allocation\n- LIFO allocation\n- Pool allocation\n- Block allocation\n- Region\
    \ allocation\n\nAn optimization that may be combined with other strategies.\n\n\
    # Fully Static Allocation\n\nNo heap. Objects are either:\n\n- On the stack: Local\
    \ to a function.\n- Of static storage duration:\n  - At global scope.\n  - At\
    \ namespace scope.\n  - static at: file, function, or class scope.\n\nUseful when:\n\
    \n- Exact or maximum number of objects in system statically determinable.\n\n\
    # Fully Static Allocation\n\n\"Allocation\" occurs at build time. Hence:\n\n-\
    \ Speed: essentially infinite; deterministic.\n- External Fragmentation: impossible.\n\
    - Memory leaks: impossible.\n- Memory exhaustion: impossible.\n\nBut:\n\n- Initialization\
    \ order of static objects in different TUs indeterminate.\n\nTU = \"Translation\
    \ Unit.\"\n\n# “Heap Allocation\"\n\nTwo common meanings:\n\n- Dynamic allocation\
    \ outside the runtime stack.\n- Irregular dynamic allocation outside the runtime\
    \ stack.\n- Unpredictable numbers of objects.\n- Unpredictable object sizes.\n\
    - Unpredictable object lifetimes.\n\nWe'll use the first meaning.\n\n- The second\
    \ one is just the most general (i.e., hardest) case of the first.\n\nUser-controlled\
    \ non-heap memory for multiple variable-sized objects entails heap management:\n\
    \n```\nunsigned char buffer[SomeSize]; // this is basically a heap\n// create/destroy\
    \ multiple different-\n// sized objects in buffer\n...\n```\n\n# The C++ Memory\
    \ Management Framework\n\nUser-defined memory management typically built upon:\n\
    \n- User-defined versions of malloc/free\n- User-defined versions of operator\
    \ new/new[[], operator delete/delete[]\n- New handlers:\n  - Functions called\
    \ when operator new/new[] can’t satisfy a request\n\nInterface details are in\
    \ Further Information.\n\n- Here we focus on allocation strategies suitable for\
    \ embedded systems.\n\n# LIFO Heap Allocation\n\nDynamic allocation is strictly\
    \ LIFO (like a stack).\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_103_0.png)\n\
    \nEasy way to implement a \"union\" for multiple-mode operations:\n\n- E.g., a\
    \ system in \"normal\" or \"diagnostic\" mode.\n- Static allocation requires the\
    \ *sum* of the two modes' memory needs.\n\n| Normal Mode | Diagnostic Mode |\n\
    |--- |--- |\n| Normal or Diagnostic Mode | |\n\n- LIFO allocation only the *maximum*\
    \ of the modes' needs.\n\nLIFO allocation/deallocation is fast in its own right,\
    \ but another speed benefit is that an allocation following a deallocation is\
    \ likely to refer to memory that is already in the data cache.\nLIFO allocation\
    \ (a natural candidate for region allocation) is good in video games, each level\
    \ can reuse the same memory for its LIFO heap.\n\n# LIFO Heap Allocation\n\nA\
    \ first cut at an implementation:\n\n```cpp\nclass LIFOAllocator {\npublic:\n\
    \    LIFOAllocator(unsigned char* heapAddr, // provides behavior\n           \
    \                      // of new/delete via\n                                \
    \ std::size_t heapSize)   // allocate/deallocate\n    : heapBase(heapAddr), heapEnd(heapAddr+heapSize),\n\
    \      heapTop(heapAddr)\n\n    void* allocate(std::size_t sz) throw(std::bad_alloc);\
    \ // shown shortly\n    void deallocate(void* ptr, std::size_t sz) throw (); //\
    \ ditto\n\nprivate:\n    unsigned char *const heapBase;\n    unsigned char *const\
    \ heapEnd;\n    unsigned char *heapTop;\n};\n```\n\n- allocate/deallocate behave\
    \ like class-specific new/delete.\n- Pointer data member -> copying functions\
    \ should be declared.\n- If LIFOAllocator templated, ctor params could be template\
    \ params.\n- The MMIO section has an example.\n\nThis \"first cut\" implementation\
    \ is suitable only use as class-specific new, the deallocate function requires\
    \ that size be passed. The next implementation allows for the size of the block\
    \ to be hidden in the block.\n\n# LIFO Heap Allocation\n\nClasses can easily build\
    \ new/delete using LIFO:\n\nunsigned char heapSpace[HeapSize]; // memory for heap\n\
    \nLIFOAllocator customAllocator(heapSpace); // typically at global scope\n\n```\n\
    void* Widget::operator new(std::size_t bytes) throw (std::bad_alloc)\n{\n    return\
    \ customAllocator.allocate(bytes);\n}\nvoid Widget::operator delete(void* ptr,\
    \ std::size_t size) throw ()\n{\n    customAllocator.deallocate(ptr, size);\n\
    }\n```\n\nHere there's one global heap, but per-class or per-thread heaps are\
    \ easy.\n\n- Create a LIFOAllocator for each memory to be used as LIFO heap.\n\
    - For per-class allocators, make the LIFOators static and private.\n- For per-thread\
    \ allocators, use thread-local storage (TLS).\n\n# LIFOAllocator::allocate\n\n\
    Implemented just like global operator:\n```cpp\nvoid* LIFOAllocator::allocate(std::size_t\
    \ bytes) throw (std::bad_alloc) {\n  if (bytes == 0) bytes = 1;\n  while (true)\
    \ {\n    if (heapTop + bytes <= heapEnd)\n      unsigned char *pMem = heapTop;\n\
    \      heapTop += bytes;\n      return pMem;\n    }\n  }\n}\n```\n\nstd::new_handler\
    \ currentHandler = std::get_new_handler();\nif (currentHandler) currentHandler();\n\
    else throw std::bad_alloc();\n\n- Comments indicate issues we're ignoring.\n-\
    \ With this design, hard for new handler to increase available memory.\n\nThe\
    \ only way 0 bytes can be requested is that somebody explicitly calls className::operator\
    \ new(0); it's not possible to get it from a new expression. Proper deallocation\
    \ in this case would be tricky, because the caller would have to explicitly call\
    \ className::operator delete(ptr, 1), i.e., *a priori* a 0-byte request yields\
    \ a 1-byte allocation. I don't know of a simple way to address this problem.\n"
  mdcn: "\n\n# 摘要：基于接口的编程\n\n- 一个接口，多种实现。\n- 使用多态来选择实现方式。\n  - 运行时多态使用虚函数。\n  - 链接时多态使用链接器配置。\n\
    \  - 编译时多态使用 typedef。\n\n# 概述\n\n第 1 天（大致安排）：\n\n- “C++”与“嵌入式系统”\n- 深入理解 C++\n\
    \  - 语言特实现\n  - 理解内联（inlining）\n  - 避免代码膨胀\n- 基于接口的编程的三种方法\n  - 动态内存管理\n  - C++\
    \ 与 ROM 可读性（ROMability）\n\n# 动态内存管理\n\n嵌入式开发者经常声称堆管理不是问题：\n\n- 客户：“我们没有堆。”\n-\
    \ 我：“你说对了。你有五个堆。”\n- 动态内存管理存在于许多嵌入式系统中。\n- 即使从未调用过 `malloc`/`free`/`new`/`delete`。\n\
    - 关键指标：\n  - 大小的对象放入固定大小的内存块。\n    - 例如：事件/错误日志、滚动历史记录、电子邮件消息等。\n\n幻灯片顶部的引用基于我与一个嵌入式团队的首次互动。他们警告我说没有堆，但当我检查他们的设计时，我发现他们有五个动态分配内存池。他们的意思是他们没有调用\
    \ *new* 或 *delete*，但他们仍然执行动态内存管理。实际上，他们有五个堆。\n\nScott Meyers，软件开发顾问\n© 2012 Scott\
    \ Meyers, 版所有所有。\n\n# 动态内存管理\n\n四个常见的担忧：\n\n- 速度：\n  - `new`/`delete`/`malloc`\
    \ 速度足够快吗？\n  - 波动有多大，即确定性如何？\n\n- 碎片：\n  - 堆会退化为无法使用的微小分块吗？\n  - 这是外部碎片。\n\n-\
    \ 内存泄漏：\n  - 是否会有某些分配未被释放？\n\n- 内存耗尽：\n  - 如果分配请求无法满足该怎么办？\n\n每个担忧都可以得到解决。\n\n\
    ![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_97_0.png)\n\n这并不是担忧的清单，只是常见担忧的列表。\n\n\
    # 分配策略综述\n\n每种都比 `malloc`/`free`/`new`/`delete` 具体。\n\n- 通常更适用于嵌入式使用。\n\n我们将检查：\n\
    \n- 全静态分配\n- LIFO（后进先出）分配\n- 池分配\n- 块分配\n- 区域分配（Region allocation）\n\n一种可以与其他策略结合的优化方法。\n\
    \n# 全静态分配\n\n没有堆。对象位于：\n\n- 在栈上：函数的局部变量。\n- 具有静态存储生存期：\n  - 在全局作用域内。\n  - 在命名空间作用范围内。\n\
    \  - 在文件、函数或类作用域内为 `static`。\n\n适用于：\n\n- 系统中对象的精确数量或最大数量可以静态确定。\n\n# 全静态分配\n\n\
    “分配”发生在编译时。因此：\n\n- 速度：本质上无限；具有确定性。\n- 外部碎片：不可能。\n- 内存泄漏：不可能。\n- 内存耗尽：不可能。\n\n\
    但是：\n\n- 不同编译单元（TU）中静态对象的初始化顺序是不确定的。\n\nTU = “翻译单元（Translation Unit）”。\n\n# “堆分配”\n\
    \n两个常见含义：\n\n- 运行时栈之外的动态分配。\n- 运行时栈之外的不规则动态分配。\n- 不可预测的对象数量。\n- 不可预测的对象大小。\n-\
    \ 不可预测的对象生命周期。\n\n我们将使用第一个含义。\n\n- 第二种只是第一种最通用（即最困难）的情况。\n\n用于多个可变大小对象的的用户控制非堆内存涉及堆管理：\n\
    \n```\nunsigned char buffer[SomeSize]; // 这本质上是一个堆\n// 在 buffer 中创建/销毁多个不同\n//\
    \ 大小的对象\n...\n```\n\n# C++ 内存管理框架\n\n用户定义的内存管理通常构建在：\n\n- 用户定义的 `malloc`/`free`\
    \ 版本\n- 用户定义的 `operator new`/`new[]`、`operator delete`/`delete[]` 版本\n- 新句处理程序（New\
    \ handlers）：\n  - 当 `operator new`/`new[]` 无法满足请求时调用的函数\n\n接口细节请见“更多信息”。\n\n-\
    \ 在这里我们关注适用于嵌入式系统的分配策略。\n\n# LIFO 堆分配\n\n动态分配严格遵循 LIFO 原则（类似于栈）。\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_103_0.png)\n\
    \n实现多模式操作“联合体”的简单方法：\n\n- 例如，处于“正常”或“诊断”模式的系统。\n- 静态分配需要两种模式内存需求的*总和*。\n\n| 正常模式\
    \ | 诊断模式 |\n|--- |--- |\n| 正常或诊断模式 | |\n\n- LIFO 分配仅需模式需求的*最大值*。\n\nLIFO 分配/释放本身速度很快，但另一个速度优势是，释放后的后续分配可能会引用已存在于数据缓存中的内存。\n\
    LIFO 分配（区域分配的自然候选者）在视频游戏中很好，每个关卡都可以为其 LIFO 堆复用同一块内存。\n\n# LIFO 堆分配\n\n实现的初步尝试：\n\
    \n```cpp\nclass LIFOAllocator {\npublic:\n    LIFOAllocator(unsigned char* heapAddr,\
    \ // 提供 new/delete 的                                 // 行为\n                 \
    \                std::size_t heapSize)   // 分配/释放\n    : heapBase(heapAddr), heapEnd(heapAddr+heapSize),\n\
    \      heapTop(heapAddr)\n\n    void* allocate(std::size_t sz) throw(std::bad_alloc);\
    \ // 稍后显示\n    void deallocate(void* ptr, std::size_t sz) throw (); // 同\n\nprivate:\n\
    \    unsigned char *const heapBase;\n    unsigned char *const heapEnd;\n    unsigned\
    \ char *heapTop;\n};\n```\n\n- allocate/deallocate 行为类似于特定的 new/delete。\n- 指针数据成员应声明函数。\n\
    - 如果 LIFOAllocator 是模板化的，构造参数可以是模板参数。\n- MMIO 章节有一个示例。\n\n这种“初步实现”仅适用于特定的 new，`deallocate`\
    \ 函数需要传递大小。接下来的实现允许将大小隐藏在块中。\n\n# LIFO 分配\n\n类可以很容易使用 LIFO 构建 new/delete：\n\n\
    unsigned char heapSpace[HeapSize]; // 用于堆的内存\n\nLIFOAllocator customAllocator(heapSpace);\
    \ // 通常位于全局作用域\n\n```\nvoid* Widget::operator new(std::size_t bytes) throw (std::bad_alloc)\n\
    {\n    return customAllocator.allocate(bytes);\n}\nvoid Widget::operator delete(void*\
    \ ptr, std::size_t size) throw ()\n{\n    customAllocator.deallocate(ptr, size);\n\
    }\n```\n\n这里有一个全局堆，但每类或每线程的堆很容易。\n\n- 为每个用作 LIFO 堆的内存创建一个 LIFOAllocator。\n- 对于每类分配器，将\
    \ LIFOator 设为静态且私有。\n- 对于每线程分配器，使用线程本地存储（TLS）。\n\n# LIFOAllocator::allocate\n\n\
    实现与全局 operator 相同：\n\n```cpp\nvoid* LIFOAllocator::allocate(std::size_t bytes)\
    \ throw (std::bad_alloc) {\n  if (bytes == 0) bytes = 1;\n  while (true) {\n \
    \   if (heapTop + bytes <= heapEnd) {\n      unsigned char *pMem = heapTop;\n\
    \      heapTop += bytes;\n      return pMem;\n    }\n  }\n}\n```\n\nstd::new_handler\
    \ currentHandler = std::get_new_handler();\nif (currentHandler) currentHandler();\n\
    else throw std::bad_alloc();\n\n- 注释指示了我们正在忽略的问题。\n- 这种设计下，new handler 很难增加可用内存。\n\
    \n请求 0 字节的唯一方法是有人显式调用 className::operator new(0)；无法通过 new 表达式获取。在这种情况下，正确的释放将很棘，因为调用者必须显式调用\
    \ className::operator delete(ptr, 1)，即*先验* 0 字节请求产生 1 字节分配。我不知道有什么简单的方法可以解决这个问题。\n\
    \n"
