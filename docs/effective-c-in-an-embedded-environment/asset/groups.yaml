  - "[PAGE 62]\n\n# Instantiating Templates\n\nInstantiated templates may generate\
    \ both code and data:\n\n```\nSomeClass<int> sc;\n// SomeClass<int> instantiated;\n\
    // some code generated, memory\n// for static class data set aside\n```\n\nInstantiating\
    \ a class shouldn't instantiate all its member functions:\n\n+   - Only member\
    \ functions that are used should be instantiated.\n  -> You shouldn't pay for\
    \ what you don't use.\n- A few compilers (typically older ones) get this wrong.\n\
    \  -> They instantiate all member functions of a class if any is used.\n  -> We'll\
    \ discuss how to avoid this in a moment."
  - "[PAGE 63]\n\n# Instantiating Templates\n\nMost templates are implicitly instantiated:\n\
    \n+   - Compiler notes used functions, instantiates them automatically.\n- To\
    \ create the functions, it needs access to their definitions.\n  - This is why\
    \ template code is typically in header files.\n- Without a definition, compiler\
    \ generates reference to external symbol.\n  - Hence SomeClass::mf2 callable w/o\
    \ a definition, but a link-time error will result.\n\nTemplates can also be explicitly\
    \ instantiated:\n\n+   - You can force a class or function template to be instantiated.\n\
    - For class templates, all member functions are instantiated.\n- Individual member\
    \ functions can also be instantiated."
  - "[PAGE 64]\n\n# # Explicit Instantiation\n\nIn a .h file:\n\n```\ntemplate<typename\
    \ T>      // as before\nclass SomeClass {\npublic:\n    SomeClass() { ... }\n\
    \    void mf1() { ... }\n    void mf2();\n};\n```\n\nIn a .cpp file:\n\n```\n\
    ...                              // Definitions of SomeClass's\n             \
    \                 // non-inline functions go here\ntemplate\nclass SomeClass<double>;\
    \      // explicitly instantiate all SomeClass\n// mem funcs for T=double; compiled\n\
    // code will go in this .cpp's .obj file\n\ntemplate\nvoid SomeClass<int>::mf2();\
    \      // explicitly instantiate SomeClass::mf2\n// for T=int; compiled code will\
    \ go in\n// this .cpp's .obj file\n```"
