- md: "\n# Overview\n\nDay 2 (Approximate):\n\n- Modeling Memory-Mapped IO\n- Implementing\
    \ Callbacks from C APIs\n- Interesting Template Applications:\n  - Type-safe void*-based\
    \ containers\n  - Compile-time dimensional unit analysis\n  - Specifying FSMs\n\
    - Considerations for Safety-Critical and Real-Time Systems\n- Further Information\n\
    \n# Using Templates to Eliminate Common Casts\n\nConsider a Stack template:\n\n\
    ```cpp\ntemplate<typename T>\nclass Stack {\npublic:\n    Stack();\n    ~Stack();\n\
    \    void push(const T& object);\n    T pop();\nprivate:\n    ...\n};\n```\n\n\
    Each different type will yield a new class:\n\n- This could result in a lot of\
    \ duplicated code.\n- You may not be able to afford such code bloat.\n\n# A Generic\
    \ Stack Class for Pointers\n\nA class using void* pointers can implement any kind\
    \ of (pointer) stack:\n\n```cpp\nclass GenericPtrStack {\npublic:\n    GenericPtrStack();\n\
    \    ~GenericPtrStack();\n    void push(void *object);\n    void * pop();\n\n\
    private:\n    ...\n};\n```\n\n# A Generic Stack Class for Pointers\n\nGenericPtrStack\
    \ is good for sharing code:\n\n```cpp\nGenericPtrStack stringPtrStack;\nGenericPtrStack\
    \ intPtrStack;\n\nstd::string *newString = new std::string;\nint *newInt = new\
    \ int;\n\nstringPtrStack.push(newString);\nintPtrStack.push(newInt); // these\
    \ execute\n// the same code\n```\n\nBut it's easy to misuse:\n\n```cpp\nstringPtrStack.push(newInt);\
    \ // uh oh...\nstd::string *sp = static_cast<std::string>(intPtrStack.pop());\
    \ // uh oh (reprise)...\n```\n\nCode-sharing is important, but so is type-safety:\n\
    \n- We want both.\n\n# Type-Safe Interfaces\n\nWe can partially specialize Stack\
    \ to generate type-safe void*-based classes:\n\n```cpp\ntemplate<typename T>\n\
    class Stack<T> {\npublic:\n    void push(T *ptr) { s.push(ptr); }\n    T * pop()\
    \ { return static_cast<T*>(s.pop()); }\nprivate:\n    GenericPtrStack s; // implementation\n\
    };\n```\n\nAt runtime, the cost of Stack<T> instantiations is zero:\n\n- All instantiations\
    \ use the code of the single GenericPtrStack class\n- All Stack<T> member functions\
    \ are implicitly inline\n\nThe cost of type-safety is nothing.\n\n# Type-Safe\
    \ Interfaces\n\nHow force programmers to use the type-safe classes *only*?\n\n\
    Prevent direct use of GenericPtrStack by making everything protected:\n\n```cpp\n\
    class GenericPtrStack {\nprotected:\n    GenericPtrStack();\n    ~GenericPtrStack();\n\
    \n    void push(void *object);\n    void * pop();\n\nprivate:\n    ... // same\
    \ as before\n};\n\nGenericPtrStack stringStack; // error!\nGenericPtrStack intStack;\
    \ // error!\n```\n\n# Type-Safe Interfaces\n\nBut now Stack<typename*> won't compile:\n\
    \n```cpp\ntemplate<typename T>\nclass Stack<T> {\npublic:\n    void push(T *ptr)\n\
    \    { s.push(ptr); } // error! GenericPtrStack::push\n    // is protected\n...\n\
    private:\n    GenericPtrStack s;\n};\n```\n\n# Type-Safe Interfaces\n\nPrivate\
    \ inheritance gives access to protected members:\n\n```cpp\ntemplate<typename\
    \ T>\nclass Stack<T*>: private GenericPtrStack {\npublic:\n  void push(T *objectPtr)\n\
    \  { GenericPtrStack::push(objectPtr); }\n\n  T * pop()\n  { return static_cast<T*>(GenericPtrStack::pop());\
    \ }\n};\n```\n\nNet result:\n\n- Maximal type safety\n- Maximal efficiency\n\n\
    How did we get here?\n\n- void* Pointers\n- Inlining\n- Templates\n- Protected\
    \ Members\n\n# Code Bloat, Containers of Pointers, and QOI\n\nYour C++ implementation\
    \ may spare you the need to do this kind of thing:\n\n- Some standard library\
    \ vendors take care of this for you.\n- Some compiler vendors (e.g., Microsoft)\
    \ eliminate replicated code arising from template instantiations.\n- Approach\
    \ applies to more than just containers of pointers.\n- Also optimizes Template<int>\
    \ and Template<long> when int and long are the same size.\n\nBefore looking for\
    \ ways to manually eliminate code bloat, make sure it's really an issue.\n\nQOI\
    \ = “Quality of Implementation”\n\n# Summary: Eliminating Common Casts\n\n- Templates\
    \ can generate type-safe wrappers around type-unsafe code.\n- Inlining wrapper\
    \ member functions can eliminate any unsafe runtime cost.\n- Careful implementation\
    \ choices can enforce design objectives.\n\n# Enforcing Dimensional Unit Correctness\n\
    \nProper unit use is crucial:\n\n- Nonsensical to assign or compare time to distance.\n\
    \n- Nonsensical to assign or compare pounds to newtons.\n- 1.00 pounds ≈ 4.45\
    \ newtons.\n- Loss of NASA's Mars Climate Orbiter, September 1999.\n\n![](img/4884d44c5f6ddb1d5cbeb521d)\n\
    \n# Enforcing Dimensional Unit Correctness\n\nProper unit use is crucial:\n\n\
