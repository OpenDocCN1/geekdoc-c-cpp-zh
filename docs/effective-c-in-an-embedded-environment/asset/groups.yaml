- md: "\n## Domain-Specific Embedded Languages\n\nBoth diagram and table are declarative\
    \ specifications of FSMs.\n\n- They specify what should happen, not how.\n\nTMP\
    \ makes it possible for such specifications to be given in C++.\n\n- Via Domain-Specific\
    \ Embedded Languages (DSELs).\n- Domain-specific languages embedded within C++.\n\
    - With DSELs, specifications are programs.\n\n## The FSM DSEL\n\nFor the FSM DSEL,\n\
    \n- Clients specify:\n  - States\n  - Events\n  - Transitions\n  - Transition\
    \ actions\n\nThe compiler generates the FSM code automatically.\n\n- Via template\
    \ instantiation.\n\n## The FSM DSEL\n\nIn this presentation we examine only the\
    \ DSEL's client interface:\n\n- How clients use a TMP-based FSM library.\n- Goal:\
    \ demonstrate what can be accomplished.\n- The library implementation is in C++\
    \ Template Metaprogramming.\n- It's Chapter 11 of an 11-chapter book.\n- No time\
    \ here to cover chapters 1-10 :-\n\nOnly fundamental functionality is shown.\n\
    \n- No state-entry/exit actions, no guards, no state hierarchies, etc.\n- Goal\
    \ is to demonstrate unobvious template functionality, not to show how to implement\
    \ FSMs.\n\n## Specifying FSMs and States\n\nAn FSM is specified by a class, its\
    \ states by a nested enum:\n\n```cpp\nclass player : public state_machine<player>\
    \ // player = FSM for\n{ // the CD player\nprivate:\n    enum states { // states\
    \ in the FSM\n        Empty, Open, Stopped, Playing, Paused,\n        initial_state\
    \ = Empty // initial FSM state\n    };\n...};\n```\n\n- Base class state_machine\
    \ provides generic FSM functionality\n- TMP-generated code will go in this class.\n\
    - Base class takes the derived class as a template parameter.\n- \"The Curiously\
    \ Recurring Template Pattern\"\n- States are private.\n- FSM clients don't need\
    \ to access them.\n- FSM clients just cause events to be generated.\n- The FSM\
    \ reacts accordingly.\n\nStates are identified by enumerators so that they can\
    \ be passed as template parameters and also stored as the value of a data member.\
    \ A more natural design (IMO) is to model them as classes, an approach that's\
    \ taken in the Boost Statechart library. How that library keeps track of which\
    \ state the FSM is in, I don't know.\n\n## Specifying FSM Events\n\nEvents are\
    \ classes. In this example,\n\n- They are defined outside the FSM class.\n  -\
    \ If desired, they could be nested inside.\n\n- They are largely empty.\n- In\
    \ a real system, they could be arbitrarily complex.\n\n```cpp\nstruct play {};\n\
    struct open_close {};\nstruct pause {};\nstruct stop {};\nclass cd_detected {\n\
    public:\n  cd_detected(char const cdName,\n  std::vector<std::clock_t> const&\
    \ trackLengths) { ... }\n};\n```\n\n## Specifying FSM Transition Actions\n\nTransition\
    \ actions are FSM member functions:\n\n```cpp\nclass player : public state_machine<player>\n\
    \  private:\n    enum states { ... };\n    void start_playback(play const);\n\
    \    void open_drawer(open_close const);\n    void close_drawer(open_close const);\n\
    \    void store_cd_info(cd_detected const);\n    void stop_playback(stop const);\n\
    \    void pause_playback(pause const);\n    void resume_playback(play const);\n\
    \    void stop_and_open(open_close const);\n  ...\n```\n\n- Like states, transition\
    \ actions are private.\n- FSM clients just generate events.\n- The FSM automatically\
    \ reacts.\n\n## Specifying FSM Transitions\n\nFSM structure is specified in table\
    \ form.\n\n- Base class state_machine declares a row template:\n\n```cpp\ntemplate<class\
    \ Derived>\nclass state_machine\n{\nprotected:\n    template<\n    int CurrentState,\n\
    \    class Event,\n    int NextState::*(action)(Event const&)\n>\nstruct row {\
    \ ... };\n```\n\n| Current State | Event | Next State | Transition Action |\n\
    | :--- | :--- | :--- | :--- |\n| Idle | OpenClose | Open | Open drawer |\n| Idle\
    \ | OpenDeject | Stopped | Start playback |\n| Stopped | OpenClose | Open | Open\
    \ drawer |\n| Stopped | OpenClose | Playing | Stop effect CD link |\n| Passed\
    \ | Play | Stopped | Resume playback |\n| Passed | Stop | Playing | Open drawer\
    \ |\n| Playing | OpenClose | Stopped | Stop playback |\n| Playing | Pause | Paused\
    \ | Pause playback/open drawer |\n\n## Specifying FSM Transitions\n\nThe FSM creates\
    \ the table as a collection of rows:\n\n```cpp\nclass player : public state_machine<player>\
    \ {\nprivate:\n  ...\n  // states and transitions\n  typedef player p;\n  // makes\
    \ transition table cleaner\n  struct transition_table : mpl::vector11 {\n  //\
    \          Start           Event           Next           Action\n  row < Stopped,\
    \    play        , Playing,      &p::playback>,    \n  row < Stopped,    open_close\
    \      Open,           &p::open_drawer>,  \n  row < Open,       open_close   \
    \   Empty,         &p::close_drawer>,  \n//};\n}\n```\n\n- A fixed-width makes\
    \ the table clearer.\n- mpl::vector11 is a vector-like container.\n- In this case,\
    \ row instantiations.\n- The name of the transition table must be the base class\
    \ state_machine<T> refers to it.\n\n## Specifying FSM Transitions\n\nHere's the\
    \ complete table:\n\n```cpp\nclass player : public state_machine<player> {\nprivate:\n\
    \  ...\n  // states and transitions\n  typedef player p;\n  // makes transition\
    \ table cleaner\n  struct transition_table : mpl::vector11 {\n  //          Start\
    \           Event           Next           Action\n  row < Stopped,    play  \
    \      , Playing,      &p::playback>,    \n  row < Stopped,    open_close    \
    \  Open,           &p::open_drawer>,  \n  row < Open,       open_close      Empty,\
    \         &p::close_drawer>,  \n//};\n}\n```\n\n## FSM in C++ vs. FSM in a Table\n\
    \nCompare with the original table:\n\n| Current State | Event | Next State | Transition\
    \ Action |\n|---|---|---|---|\n| Empty | OpenClose | Open | Open drawer |\n| Empty\
    \ | CD-Detected | Stopped | Store CD info |\n| Stopped | Play | Playing | Start\
    \ playback |\n| Stopped | OpenClose | Open | Open Drawer |\n| Open | OpenClose\
    \ | Empty | Close drawer; collect CD info |\n| Paused | Play | Playing | Resume\
    \ playback |\n| Paused | Stop | Stopped | Stop playback |\n| Paused | Open/Close\
    \ | Open | Stop playback; open drawer |\n| Playing | Stop | Stopped | Stop playback\
    \ |\n| Playing | Pause | Paused | Pause playback |\n| Playing | Open/Close | Open\
    \ | Stop playback; open drawer |\n\n- The table is the source code!\n\n## Using\
    \ FSMs\n\nClient code just generates events:\n\n- Again, this is taken from C++\
    \ Template Metaprogramming.\n\n```cpp\nplayer p; // An instance of the FSM\np.process_event(open_close());\
    \ // user opens CD player\np.process_event(open_close()); // inserts CD and closes\n\
    p.process_event(\\ // CD is detected\ncd_detected(\"louie, \"louie\", std::vector<std::clock_t>(/*\
    \ track lengths */));\nnp.process_event(play()); // etc.\np.process_event(pause());\n\
    p.process_event(play());\np.process_event(stop());\n```\n\nThe member function\
    \ process_event is defined by the state_machine<T> base class.\n"
