  - '[PAGE 259]


    # Summary: Specifying FSMs


    +   - Template metaprogramming makes it possible to create Domain-Specific Embedded
    Languages (DSELs).

    - DSELs facilitate a declarative programming style.

    - Declarative code tends to be easier to create, understand, and enhance.'
  - '[PAGE 260]


    # Other Approaches to FSMs


    There are many ways to specify and implement FSMs in C++. They vary:


    +   - Expressiveness, e.g., support for both hierarchical and concurrent states.

    - UML supports both (“Statecharts + Petri Nets")

    - Support for both static and dynamic FSM specification.

    - Type safety of source code.

    - Demands on compiler template support.

    - Size and speed of executable code.

    - Use of heap memory at runtime.

    - Support for multithreading.

    - Debuggability.

    - Coupling between, e.g., states and transitions.


    A plethora of approaches are described in the Further Information.


    Regarding coupling, the interface just shown has all states in a global list (high
    coupling), but states have no knowledge of transitions or actions (low coupling).
    In Boost.Statechart, it''s the opposite: there is no global list of states, but
    states know about transitions and actions.'
  - '[PAGE 261]


    # Summary: Interesting Template Applications


    +   - Templates are useful for a lot more than just containers

    - Templates can generate type-safe wrappers around type-unsafe code.

    - Templates can be used to enforce novel kinds of type safety (e.g., dimensional
    units).

    - Domain-Specific Embedded Languages (DSELs) can be built on templates.'
  - "[PAGE 262]\n\n# Overview\n\n####Day 2 (Approximate):\n\n+   - Modeling Memory-Mapped\
    \ IO\n- Implementing Callbacks from C APIs\n- Interesting Template Applications:\n\
    \  - Type-safe void*-based containers\n  - Compile-time dimensional unit analysis\n\
    - Specifying FSMs\n- Considerations for Safety-Critical and Real-Time Systems\n\
    - Further Information"
  - '[PAGE 263]


    # C++ in Safety-Critical Systems


    Safety-Critical: System failure ⇒ loss of (human) life or serious injury.

    Some application areas:


    +   - Transportation: airplanes, cars, trains, ships, spacecraft, etc.


    +   - Medicine: radiation machines, heart-lung machines, drug-delivery equipment,
    etc.


    +   - Communication: battlefield radios, emergency response (e.g., 911 in USA,
    112 in Europe), etc.


    Current C++ use in such systems?


    +   - Extensive: All application areas above.'
  - '[PAGE 264]


    # Safety-Critical Software and Risk


    Safety-critical software is like “normal” software, except:


    +   - The risk of incorrect behavior must be extraordinarily low.


    The key is therefore simple:


    +   - Minimize risk of incorrect behavior.'
  - "[PAGE 265]\n\n# # Minimizing Risk\n\nGeneral approaches:\n\n+   - Very detailed\
    \ specifications.\n  - Plus rigorous change management.\n\n+   - Comprehensive\
    \ testing.\n  - At multiple levels, e.g., unit, module, system.\n  - Includes\
    \ performance.\n    - Adequate performance is a correctness criterion.\n\n+  \
    \ - Constrained programmer discretion.\n  - Via coding guidelines.\n\n+   - Extensive\
    \ static analysis:\n  - Ensure coding guidelines are obeyed.\n  - Look for problems\
    \ unlikely to be exposed by testing.\n  - Analyses performed by both machines\
    \ and humans.\n    - Lint-like tools.\n    - Formal code inspections."
  - "[PAGE 266]\n\n# Minimizing Risk\n\n+   * Independent redundant computation:\n\
    \  * Independent teams implement the same functionality.\n  * Possibly using different\
    \ programming languages.\n  * At runtime, all implementations execute in parallel.\n\
    \  * When implementations produce different results,\n    * Vote?\n    * Shut\
    \ down?\n    * Revert to known state?"
  - '[PAGE 267]


    # # Minimizing Risk


    Recap:


    +   - Detailed specifications.

    - Comprehensive testing.

    - Constrained programmer discretion.

    - Extensive static analysis.

    - Independent redundant computation.


    Nothing above is specific to C++.


    +   - **Development process vastly dominates programming language.**

    - The only thing C++-specific is the coding guidelines employed.


    ![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_267_0.png)'
  - '[PAGE 268]


    # Coding Guidelines


    Goals:


    +   - Maximize code clarity and comprehensibility.

    - For both humans and static analysis tools.

    - Maximize code’s behavioral predictability.


    Means:


    +   - Requirements and prohibitions regarding coding practices.


    Ideally, guideline violations can be automatically detected.


    +   - Ideal rarely achieved.

    - E.g., Hatton notes that 5-10% of MISRA-C rules not so enforceable.

    - Human static analysis must enforce rules not automatically checkable.


    > Hatton is "Les Hatton," author of Safer C and a researcher on, among other things,
    factors affecting software correctness, especially in safety-critical systems.
    His comment on this slide is, I believe, from a personal conversation I had with
    him. His web site is http://www.leshatton.org.'
  - '[PAGE 269]


    # Guideline Levels


    Guidelines usually have multiple levels of stringency.

    - E.g., Joint Strike Fighter (JSF) rules use three levels:

    - Should: advisory.

    - Will: mandatory, verification not required.

    - Shall: mandatory, verification required.

    - Higher levels are therefore preferable.

    - Violating even a JSF “Should” rule requires a manager’s approval.


    The Joint Strike Fighter is also known as the F-35. All the avionics code is apparently
    written in C++ following the JSF coding standard.'
  - "[PAGE 270]\n\n# # Guideline Types\n\nLexical guidelines:\n\n+   - No effect on\
    \ execution semantics.\n\n+   - Reduce programmer-to-programmer variation.\n \
    \ - Improves code/system clarity and comprehensibility.\n\n+   - Examples:\n\n\
    +   - Naming rules:\n  - JSF AV Rule 45: All words in an identifier will be separated\
    \ by the '_' character.\n\n+   - Formatting rules:\n  - High Integrity C++ Rule\
    \ 3.1.1: Organise 'class' definitions by access level, in the following order:\
    \ 'public', 'protected', 'private'.\n  - MISRA C++ Rule 2-13-4: Literal suffixes\
    \ shall be upper case. [E.g., \"2.5f\" is disallowed, but \"2.5F\" is okay.]\n\
    \nJSF = \"Joint Strike Fighter\", AV = \"Air Vehicle\""
  - "[PAGE 271]\n\n# Guideline Types\n\nLanguage use guidelines:\n\n+   - Specify\
    \ acceptable language features and constructs.\n- Remove \"unnecessary\" and \"\
    dangerous\" things.\n  - Identify the acceptable language subset.\n\n+   - Reduce\
    \ code’s complexity.\n\n+   - Increases its behavioral predictability.\n\n+  \
    \ - Make it more amenable to static analysis.\n\nFor C++, coding guidelines often\
    \ based on MISRA-C++ or MISRA-C."
  - '[PAGE 272]


    # # Example Guidelines


    +   * Make no use of "underspecified" behavior.

    * Many official terms: "undefined", "unspecified", etc.

    * Common in C++.

    * From An Investigation of the Unpredicable Features of the C++[98] Language:


    | Category | Language issues | Library Issues | Total Number of Issues |

    |---|---|---|--|

    | Unspecified behaviour | 25 | 25 | 50 |

    | Undefined behaviour | 77 | 29 | 106 |

    | Implementation behaviour | 58 | 23 | 81 |

    | Indeterminate behaviour | 5 | 0 | 5 |

    | Behaviour that requires no diagnostic | 18 | 0 | 18 |


    Example:


    ```

    f(calcThis(), calcThat()); // prohibited: eval order undefined

    int thisVal = calcThis();

    int thatVal = calcThat();

    f(thisVal, thatVal); // fine, eval order fully defined

    ```'
  - "[PAGE 273]\n\n# Example Guidelines\n\n+   - Avoid “surprising” behavior:\n  -\
    \ JSF AV Rule 177: User-defined conversion functions should be avoided.\n  - Prevents\
    \ unexpected implicit conversions.\n  - MISRA C++ Rule 5-0-1: The value of an\
    \ expression shall be the same under any order of evaluation that the standard\
    \ permits.\n  - Prevents compiler- or optimization-dependent behavior.\n  - High\
    \ Integrity C++ Rule 3.3.14: Declare the copy assignment operator protected in\
    \ an abstract class.\n  - Prevents partial assignments to derived objects via\
    \ base class pointers/references."
  - '[PAGE 274]


    # Example Guidelines


    +   - Avoid complex code:

    - JSF AV Rule 3: All functions shall have a cyclomatic complexity number of 20
    or less.

    - High Integrity C++ Rule 4.1: Do not write functions with an excessive McCabe
    Cyclomatic Complexity.

    - Recommended C++ maximum is 10.

    - MISRA C Rule 6-6-3: The continue statement shall only be used within a well-formed
    for loop.


    The motivation for the MISRA rule is as follows: “Over-use of the continue statement
    can lead to unnecessary complexity within the code. This complexity may impede
    effective testing as extra logic must be tested. The required testing may not
    be achievable due to control flow dependencies.'
- md: "\n## Risk Reduction via Language Choice\n\nC++ can reduce risk compared to\
    \ C:\n\n- Coding occurs at a higher level of abstraction\n  - Code looks more\
    \ like the design.\n  - Direct support for multiple paradigms:\n    - OO: Encapsulation,\
    \ classes, inheritance, dynamic binding, etc.\n    - Generic Templates\n    -\
    \ Procedural\n    - Functional (closures and lambdas supported only in C++11,\
    \ alas)\n\n- Language features reduce the need for preprocessor usage\n  - E.g.,\
    \ C macros often become C++ const and inlines.\n\n- Templates offer type-safe\
    \ alternatives to type-unsafe C practices.\n  - E.g., preventing pointers and\
    \ arrays:\n    - std::unique_ptr<T> or std::shared_ptr<T> (or std::auto_ptr<T>)\
    \ => single object.\n    - std::vector<T> or std::array<T, n> => array of objects.\n\
    \nRiskness of C++ compared to Java, Ada, C#, etc. highly debated :-\n\nstd::unique_ptr\
    \ is in only C++11. std::shared_ptr and std::array are present in both C++11 and\
    \ TR1. In the latter, they are in namespace std::tr1.\n\n## Tool-Related Risks\n\
    \nCompilers, linkers, runtime systems, OSes, etc. are software.\n\n- They also\
    \ contribute to the reliability of safety-critical systems.\n- Reducing risk means\
    \ addressing the risks they introduce.\n\nApproaches:\n\n- Commercial validation\
    \ suites:\n  - E.g., for compiler/library conformance to standard C++.\n  - E.g.,\
    \ against DO-178B.\n\n- Manual analysis of generated code:\n  - Typically in conjunction\
    \ with a restricted source code subset.\n\n- Testing, testing, testing.\n\nC++\
    \ compilers typically not certified in any standard way.\n\n- Green Hills’ compiler\
    \ for Embedded C++ has been certified at DO-178B Level A.\n\n## Summary: C++ in\
    \ Safety-Critical Systems\n\n- Fundamentally a matter of reducing risk.\n- Development\
    \ process more important than programming language.\n- Coding guidelines plus\
    \ extensive static analysis are key.\n- Reliability of ancillary software tools/components\
    \ also important.\n- C++ currently employed in many safety-critical application\
    \ areas.\n\n## C++ in Real-Time Systems\n\nReal-Time:\n\n- **Hard**: Timing deadlines\
    \ missed $\\Rightarrow$ system failure.\n  - E.g., engine controllers, pacemakers,\
    \ elevators, etc.\n- **Soft**: Timing deadlines missed $\\Rightarrow$ reduced\
    \ behavioral quality.\n  - E.g., Music and video players, IP network buffer managers,\
    \ etc.\n\nKey characteristic is not speed, but **determinism** in timing:\n\n\
    - **RT systems fully or largely guarantee their ability to satisfy timing constraints.**\n\
    \  - Fully for hard RT.\n  - Largely for soft RT.\n\nIn TCP/IP communication,\
    \ TCP guarantees packet delivery, but IP does not. So if the IP layer misses a\
    \ deadline and drops a packet, the TCP layer will detect that and make sure the\
    \ packet is retransmitted. So ultimately no data is lost, but throughput decreases.\n\
    \n## Approaching RT Development\n\nRT development for C++ is essentially the same\
    \ as for C:\n\n- Determining timing constraints.\n- Avoid language features with\
    \ indeterminate timing behavior:\n  - C: \"Out of the box\" malloc/free/memcpy\n\
    \  - C++:\n    - \"Out of the box\" malloc/free/memcpy/delete\n    - RTTI: dynamic_cast,\
    \ comparisons of type_info objects\n    - Exceptions: try/throw/catch\n- Custom\
    \ malloc/free/memcpy, etc., may have deterministic timing.\n- Perform execution\
    \ time analysis.\n  - For functions, tasks, and the entire system.\n  - Hard RT:\
    \ typically Worst Case Execution Time (WCET) analysis.\n  - Soft RT: often average\
    \ case execution analysis.\n\n“Language features” includes library functionality,\
    \ because malloc, free, memcpy, etc., are library features, not language features.\n\
    \n## Timing Behavior Variations\n\nExecution time for language features depends\
    \ on:\n\n- Compiler and linker.\n  - Including optimization settings\n  - Call\
    \ context (for inline functions).\n\n- Hardware features:\n  - E.g., caching,\
    \ pipelining, speculative instruction execution, etc.\n\nIn addition:\n\n- Library\
    \ features may be implemented in different ways:\n  - Container/algorithm implementations\
    \ in the STL.\n  - E.g., std::string may or may not use SSO or COW.\n  - E.g.,\
    \ std::sort may use quicksort or introsort.\n  - Different heap management algorithms\
    \ for malloc/free/new/delete.\n\nSSO = “Small String Optimization,” COW = “Copy\
    \ on Write\"\nCOW is not a valid std::string implementation technique in C++11.\n\
    \n## Analyzing Execution Time\n\nApproaches to block/function WCET analysis:\n\
    \n- Static analysis of source code.\n  - By humans, tools, or both.\n  - Templates\
    \ can be handled by explicit instantiation and per-instantiation analysis.\n\n\
    - Dynamic analysis of code under test.\n  - Observe how long it takes to execute\
    \ blocks/functions.\n\n- A combination of the above.\n  - Dynamic analysis of\
    \ basic blocks' WCETs.\n  - Static analysis of paths through blocks.\n  - Testing\
    \ for 100% path coverage is difficult.\n\nFor system WCET, combine:\n\n- Per-task\
    \ WCET analysis.\n- Task schedulability analysis.\n\n## Analyzing Execution Time\n\
    \nApproaches to average-case analysis:\n\n- Same options as WCET.\n  - But determine\
    \ average-case time, not worst-case.\n- Multiply C++ statement count by a fudge\
    \ factor.\n  - A bigger fudge factor than C.\n    - C++ statements typically do\
    \ more than C statements.\n  - Useful for ballballing execution time during development.\n\
    \    - Reduces need for fine-tuning later.\n\n## Summary: C++ in Real-Time Systems\n\
    \n- Fundamental approach the same as for C.\n- Typically avoid the use of heap\
    \ operations, RTTI, and exceptions.\n\n## Overview\n\nDay 2 (Approximate):\n\n\
    - Modeling Memory-Mapped IO\n- Implementing Callbacks from C APIs\n- Interesting\
    \ Template Applications:\n  - Type-safe void*-based containers\n  - Compile-time\
    \ dimensional unit analysis\n  - Specifying FSMs\n- Considerations for Safety-Critical\
    \ and Real-Time Systems\n- Further Information\n\n## Further Information\n\nUsing\
    \ C++ in embedded systems:\n\n- “Abstraction and the C++ Machine,” Bjarne Stroustrup,\
    \ Keynote address at ICESS04, December 2004, available at http://www.research.att.com/~bs/abstraction-and-machine.\n\
    - An overview of C++.\n- “OO Techniques Applied to a Real-time, Spaceborne Application,”\
    \ Alexander Murray and Muhammad Shabab, Proceedings of OOPLA 2006.\n- Describes\
    \ the design, functionality, and performance of a C++ runtime library for embedded\
    \ systems; the runtime replaces the OS.\n- “C++ Exceptions and the Linux Kernel,”\
    \ Haldór Isak Glyfason and Gisli Hjálmtýsson, Dr. Dobbs Journal, September 2005.\n\
    - Focuses on exceptions, mentions other language features, too.\n- “Reducing Run-Time\
    \ Overhead in C++,” Embedded Systems Conference, Dan Saks, 1998.\n- How to avoid\
    \ common C++ “gotchas”.\n\n## Further Information\n\nMore on using C++ in embedded\
    \ systems:\n\n- \"C++ in Embedded Systems: Myth and Reality,\" Dominic Herity,\
    \ Embedded Systems Programming, February 1998.\n- Dated, but a good, comprehensive\
    \ overview of C++ vs. C. Considers code size, code speed, exceptions, ROMability,\
    \ etc.\n- \"Embedded Programming with C++,” Stephen Williams, Third USENIX Conference\
    \ on Object-Oriented Technologies and Systems (COOTS), 1997.\n- Summarizes the\
    \ design, functionality, and performance of a C++ runtime library for embedded\
    \ systems; the runtime replaces the OS.\n- \"C++ in der Automotive-Softwareentwicklung,\"\
    \ Matthias Kessler, Oliver Müller, and Gerd Schäfer, Elektronik automotive, May\
    \ 2006.\n- An overview of C++ language features and how they’ve proven useful\
    \ in the development of embedded software.\n- Article is in German.\n\n## Further\
    \ Information\n\nGeneral information on how C++ is implemented:\n\n- Technical\
    \ Report on C++ Performance, ISO/IEC TR 18015:2006(E), February 2006, http://www.open-std.org/jtc1/sc22/wg21/docs/TR18015.pdf.\n\
    - Summarizes likely overhead for various language features.\n- Inside the C++\
    \ Object Model, Stanley B. Lippman, Addison-Wesley, 1996, ISBN 0-201-83454-5.\n\
    - Information is sometimes outdated, incorrect, or cfront-specific.\n- Secure\
    \ Coding in C and C++, Robert Seacord, Addison-Wesley, 2006, ISBN 0-321-33572-4.\n\
    - Good treatments of runtime data structures and how undefined behavior can lead\
    \ to security vulnerabilities.\n"
  mdcn: "\n\n## 通过语言选择降低风险\n\n与 C 相比，C++ 可以降低风险：\n\n- 代码在更高层次的抽象上编写\n  - 代码看起来更像设计方案。\n\
    \  - 对多种范式的直接支持：\n    - 面对象（OO）：封装、类、继承、动态绑定等。\n    - 泛型模板\n    - 过程化\n    - 函数式（遗憾的是，C++11\
    \ 才支持闭包和 lambda 表达式）\n\n- 语言特性减少了对预处理器的需求\n  - 例如，C 宏通常可以被 C++ 的 `const` 和 `inline`\
    \ 取代。\n\n- 模板为不安全的 C 实践提供了类型安全的替代方案。\n  - 例如，防止指针和数组：\n    - `std::unique_ptr<T>`\
    \ 或 `std::shared_ptr<T>`（或 `std::auto_ptr<T>`） => 单个对象。\n    - `std::vector<T>`\
    \ 或 `std::array<T, n>` => 对象数组。\n\nC++ 与 Java、Ada、C# 等相比的风险性存在很大争议 :-\n\n`std::unique_ptr`\
    \ 仅在 C++11 中。`std::shared_ptr` 和 `std::array` 在 C++11 和 TR1 中都有。在后者中，它们位于 `std::tr1`\
    \ 命名空间。\n\n## 与工具相关的风险\n\n编译器、链接器、运行时系统、操作系统等都是软件。\n\n- 它们也影响安全关键系统的可靠性。\n- 降低风险意味着解决它们引入的风险。\n\
    \n方法：\n\n- 商业化验证套件：\n  - 例如，用于编译器/库是否符合标准 C++。\n  - 例如，针对 DO-178B 标准。\n\n- 对生成的代码进行人工分析：\n\
    \  - 通常结合限制的源代码子集。\n\n- 测试、测试、再测试。\n\nC++ 编译器通常没有通过任何标准化的认证。\n\n- Green Hills\
    \ 的嵌入式 C++ 编译器已通过 DO-178B A 认证。\n\n## 总结：安全关键系统中的 C++\n\n- 从根本上是一个降低风险的问题。\n-\
    \ 开发过程比编程语言更重要。\n- 编码准则加上广泛的静态分析是关键。\n- 辅助软件工具/组件的可靠性同样重要。\n- C++ 目前已应用于许多安全关键应用领域。\n\
    \n## 实时系统中的 C++\n\n实时：\n\n- **硬实时（Hard）**：错过时间截止 $\\Rightarrow$ 系统失败。\n  - 例如：引擎控制器、起搏器、电梯等。\n\
    - **软实时（Soft）**：错过时间截止 $\\Rightarrow$ 行为质量下降。\n  - 例如：音乐视频播放器、IP 网络缓冲区管理器等。\n\n\
    关键特征不是速度，而是时间上的**确定性**：\n\n- **实时系统完全或很大程度上保证其满足时间约束的能力。**\n  - 硬实时完全保证。\n  -\
    \ 软实时很大程度上保证。\n\n在 TCP/IP 通信中，TCP 保证数据包交付，但 IP 不保证。因此，如果 IP 层错过了截止并丢弃数据包，TCP 层将检测到并确保重传数据包。最终数据不会丢失，但吞吐量会降低。\n\
    \n## 实时开发方法\n\nC++ 的实时开发与 C 本质相同：\n\n- 确定时间约束。\n- 避免具有不确定时间行为的语言特性：\n  - C：“开箱即用”的\
    \ `malloc`/`free`/`memcpy`\n  - C++：\n    - “开箱即用”的 `malloc`/`free`/`memcpy`/`delete`\n\
    \    - RTTI：`dynamic_cast`、`type_info` 对象的比较\n    - 异常：`try`/`throw`/`catch`\n\
    - 自定义的 `malloc`/`free`/`memcpy` 等可能具有确定性的时间。\n- 执行时间分析。\n  - 针对函数、任务和整个系统。\n \
    \ - 硬实时：通常进行最坏情况执行时间（WCET）分析。\n  - 软实时：通常进行平均执行分析。\n\n“语言特性”包含了库功能，因为 `malloc`、`free`、`memcpy`\
    \ 等是库特性而非语言特性。\n\n## 时间行为变异\n\n语言特性的执行时间取决于：\n\n- 编译器和链接器。\n  - 包括优化设置。\n  - 调用上下文（针对内联函数）。\n\
    \n- 硬件特性：\n  - 例如：缓存、流水线、推测性指令执行等。\n\n此外：\n\n- 库功能可能以不同的方式实现：\n  - STL 中的容器/算法实现。\n\
    \  - 例如，`std::string` 可能使用或不 SSO（短字符串优化）或 COW（写时复制）。\n  - 例如，`std::sort` 可能使用快速排序或内省排序。\n\
    \  - 针对 `malloc`/`free`/`new`/`delete` 的不同堆管理算法。\n\nSSO = “Small String Optimization”，COW\
    \ = “Copy on Write”\nCOW 在 C++11 中不是有效的 `std::string` 实现技术。\n\n## 分析执行时间\n\n块/函数\
    \ WCET 分析的方法：\n\n- 源代码的静态分析。\n  - 通过人工、工具或两者均可。\n  - 模板可以通过显式实例化和逐实例化分析来处理。\n\n\
    - 对测试代码进行动态分析。\n  - 观察执行块/函数所需的时间。\n\n- 上述方法的结合。\n  - 基础块 WCET 的动态分析。\n  - 块通过路径的静态分析。\n\
    \  - 实现 100% 路径覆盖非常困难。\n\n对于系统 WCET，结合：\n\n- 单个任务的 WCET 分析。\n- 任务调度性分析。\n\n##\
    \ 分析执行时间\n\n平均情况分析的方法：\n\n- 与 WCET 相同的选项。\n  - 但确定的是平均时间，而非最坏情况。\n- 将 C++ 语句数乘以一个修正系数（fudge\
    \ factor）。\n  - 比 C 的修正系数大。\n    - C++ 语句通常比 C 语句做的更多。\n  - 在开发期间估算执行时间非常有用。\n\
    \    - 减少了后期精调的需求。\n\n## 总结：实时系统中的 C++\n\n- 基本方法与 C 相同。\n- 通常避免使用堆操作、RTTI 和异常。\n\
    \n## 概览\n\n第 2 天（大致）：\n\n- 内存映射 I/O（Memory-Mapped IO）建模\n- 从 C API 实现回调\n- 有趣的模板应用：\n\
    \  - 基于 `void*` 的类型安全容器\n  - 编译时代维度分析\n  - 指定有限状态机（FSMs）\n- 安全关键系统和实时系统的考虑因素\n\
    - 更多信息\n\n## 更多信息\n\n在嵌入式系统中使用 C++：\n\n- “Abstraction and the C++ Machine,” Bjarne\
    \ Stroustrup, ICESS04 主旨演讲，2004年12月，见 http://www.research.att.com/~bs/abstraction-and-machine。\n\
    - C++ 概览。\n- “OO Techniques Applied to a Real-time, Spaceborne Application,” Alexander\
    \ Murray and Muhammad Shabab, OOPLA 2006 论文。\n- 描述了用于嵌入式系统的 C++ 运行时库的设计、功能和性能；运行时替换操作系统。\n\
    - “C++ Exceptions and the Linux Kernel,” Haldór Isak Glyfason and Gisli Hjálmtsson,\
    \ Dobbs Journal，2005年9月。\n- 关注异常，也提到了其他语言特性。\n- “Reducing Run-Time Overhead in\
    \ C++,” Embedded Systems, Dan Saks,1998。\n- 如何避免常见的 C++ “坑”。\n\n## 更多信息\n\n更多关于在嵌入式系统中使用\
    \ C++：\n\n- \"C++ in Embedded Systems: Myth and Reality,\" Dominic Herity, Embedded\
    \ Systems Programming, 1998年2月。\n- 虽然过时，但是关于 C 的良好且全面的概述。考虑了代码大小、代码速度、异常、ROM性等。\n\
    - \"Embedded Programming with C++,” Stephen Williams, 第三次 USENIX Conference on\
    \ Object-Oriented Technologies and Systems (COOTS),1997。\n- 描述了用于嵌入式系统的 C++ 运行时库的设计、功能和性能；运行时替换操作系统。\n\
    - \"C++ in der Automotive-Softwareentwicklung,\" Matthias Kessler, Oliver Müller,\
    \ and Gerd Schäfer, Elektronik automotive,2006年5月。\n- C++ 语言特性概述及其在嵌入式软件开发中的实用性。\n\
    - 文章为德语。\n\n## 更多信息\n\n关于 C++ 如何实现的通用信息：\n\n- C++ 技术报告, ISO/IEC TR 18015:2006(E),\
    \ 2006年2月，http://www.open-std.org/jtc1/sc22/wg21/docs/TR18015.pdf。\n- 总结了各种语言特性可能的开销。\n\
    - Inside the C++ Object Model, Stanley B. Lippman, Addison-Wesley, 1996, ISBN\
    \ 0-201-83454-5。\n- 信息有时会过时、错误或仅针对 cfront。\n- Secure Coding in C and C++, Robert\
    \ Seacord, Addison-Wesley, 2006, ISBN 0-321-33572-4。\n- 对运行时数据结构以及未定义行为如何导致安全漏洞有良好的探讨。\n\
    \n"
