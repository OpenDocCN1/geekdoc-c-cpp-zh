    \nYou can pass operator new where you want to put something, and it will return\
    \ that location:\n\n```cpp\nvoid* operator new(std::size_t, void*ptrToMemory)\
    \ {\n  return ptrToMemory; }\n```\n\n- This form of operator new is called placement\
