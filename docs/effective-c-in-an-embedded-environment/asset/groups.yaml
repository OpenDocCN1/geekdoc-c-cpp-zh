    \  - E.g., ISRs and signal handlers must be fast, safe to call asynchronously,\
    \ etc."
- md: "\n## ISRs as Example Callbacks\n\nOur example is ISRs, but our focus is on\
    \ design issues:\n\n- Real ISR code is more complex:\n  - May require special\
    \ ISR calling conventions.\n  - Behavior often constrained:\n    - May require\
    \ disabling other interrupts during execution.\n    - May safely manipulate only\
    \ atomic data.\n    - May have a hard real-time limit on execution time.\n- We'll\
    \ ignore such details.\n  - They don't affect the basic design options.\n\n##\
    \ Example C Callback API\n\nAssume this ISR API implemented in C:\n\n```\ntypedef\
    \ void (*ISR_t)(int); // param = interrupt ID\nvoid setISR(int interruptID, ISR_t\
    \ isr);\n```\n\n## C-Like Function Pointers\n\nConceptually, two kinds of C++\
    \ function pointers can be passed to setISR:\n- Non-member functions, e.g., global\
    \ or namespace-scoped functions.\n- Static member functions.\n\nReason: neither\
    \ has this pointer.\n- Pointers to non-static member functions require this pointer.\n\
    - They’re not-layout compatible with \"normal\" function pointers.\n\nStatic member\
    \ functions are preferable:\n- Reduced namespace pollution: their names are local\
    \ to their class.\n- Encapsulation opportunities: they can be protected or private.\n\
    - Access privileges: they can access protected or private (static) members.\n\n\
    Our first goal is to use static member functions as callbacks.\n\n## C vs. C++\
    \ Linkage\n\nLinkage can be an issue:\n\n- C functions have C linkage.\n- C++\
    \ functions have C linkage only if declared extern \"C\":\n\n```\nvoid f1(int);\
    \              // non-member fcn: default C++ linkage\nextern \"C\" void f2(int);\
    \     // non-member fcn: explicit C linkage\nclass Widget {\npublic:\n    static\
    \ void smf(int);   // member fcn: always C++ linkage\n};\n```\n\nFor C++ compilation,\
    \ ISR_t and setISR need C linkage, so:\n\n```\nextern \"C\" {              //\
    \ use C calling conventions\n    typedef void (*ISR_t)(int);\n    void setISR(int\
    \ interruptID, ISR_t isr);\n}\n```\n\n## C vs. C++ Linkage\n\nCompilers may treat\
    \ C and C++ linkage differently:\nsetISR(0, &f1); // may or may not compile/link/run\n\
    setISR(1, &Widget::smf); // ditto\nsetISR(2, &f2); // typically compiles/links/run\n\
    \nIn general, only non-member extern \"C\" functions are valid callbacks.\n\n\
    - Even then only for compatible C and C++ code.\n- There is no standard ABI for\
    \ C++ linkage.\n\n## Static Member Functions as Callbacks\n\nThe non-member can\
    \ make an inline call to a static member function:\n\n```\nclass InterruptMgr\
    \ {\npublic:\n    static void isr(int interruptID) // effective ISR\n    { code\
    \ to handle interrupt; }\n};\nextern \"C\" {\n    void isrHelper(int interruptID)\
    \ // function to pass to C API\n    { InterruptMgr::isr(interruptID); } // inline\
    \ call\n}\nsetISR(0);\n```\n\nOn some platforms, the non-member function can be\
    \ omitted:\n\n- On some platforms, C and C++ linkage are same.\nsetISR(0, &InterruptMgr::isr);\n\
    \n## Static Member Functions as Callbacks\n\nThe static member function usually\
    \ calls another function to actually service the interrupt, so a better name is:\n\
    \n```\nclass InterruptMgr {\npublic:\n    static void isrDispatcher(int interruptID)\n\
    \    { function to handle interrupt; }\n}\nextern \"C\" {\n    void isrHelper(int\
    \ interruptID)\n    { InterruptMgr::isrDispatcher(interruptID); }\n}\nsetISR(0);\
    \ // as before\n\n## Preventing Exception into C\n\nExceptions from C++ must not\
    \ propagate into C.\n\n- C stack frames may be laid out differently from C stack\
    \ frames!\n\nIf callback code can throw, prevent exception, e.g.:\n\n```\nextern\
    \ \"C\" {\n    void isrHelper(int interruptID) // function to pass to C API\n\
    \    try {\n        InterruptMgr::isrDispatcher(interruptID);\n    } catch (...)\
    \ {\n        log exception, whatever...\n    }\n}\n```\n\nA `try` block may incur\
    \ runtime cost:\n\n- A preferable design is to ban exceptions in callback code.\n\
    \n## The Basic Callback-Handling Strategy\n\nimg/4884d4c5f6dd1d5beb5260fcde7_185_0.png\n\
    img/4884d4c5f6dd1d5beb5260fcde7_185_1.png\n\nScott Meyers, Software Development\
    \ Consultant\nhttp://www.aristela.com/\n© 2012 Scott Meyers, all rights reserved.\n\
    \n## The Basic Callback-Handling Strategy\n\n```\nInterruptMgr works like this:\n\
    class InterruptMgr {\npublic:\n    typedef ISRType; // details in a moment\n \
    \   static void registerISR(int interruptID, ISRType isr)\n    { ISRs[interruptID]\
    \ = isr; }\n    static void isrDispatcher(int interruptID)\n    { ISRs[interruptID](interruptID);\
    \ }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS]; // decl. arr. of actual\
    \ ISRs\n};\nInterruptMgr // define array of actual\nInterruptMgr::ISRs[NUM_INTERRUPTS];\
    \ // ISRs\n```\n\nThe ISR array mimics the system's interrupt vector table.\n\n\
    - But we can make it an array of anything in C++:\n- It could hold objects, pointers\
    \ to objects, member func. ptrs., etc.\n- We're now in the world of C++.\n\n##\
    \ Callbacks via Virtual Functions\n\nCreate a base class for objects that handle\
    \ interrupts:\n\n```\nclass ISRBase { // classes implementing ISRs\npublic:\n\
    \    // inherit from this\n    ...\n    virtual void isr(int interruptID) = 0;\
    \ // or maybe operator()(int)\n};\n```\n\nInterruptMgr can then look like this:\n\
    \n```\nclass InterruptMgr {\npublic:\n    typedef ISRBase* ISRType;\n    ...\n\
    \    static void registerISR(int interruptID, ISRType isr) { }\n    static void\
    \ isrDispatcher(int interruptID)\n    {\n        ISRs[interruptID]->isr(interruptID);\
    \ // invoke ISR via virtual call\n    }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS];\
    \ // array of ptrs to objects w/ISRs\n};\n```\n\n## Callbacks via Virtual Functions\n\
    \nDerived classes provide actual ISRs:\n\n```cppclass TimerISR: public ISRBase\
    \ {\npublic:\n    virtual void isr(int interruptID);\n};\n```\n\n```\nclass KeyboardISR:\
    \ public ISRBase {\npublic:\n    virtual void isr(int interruptID);\n};\n```\n\
    \nObjects of these types are then created and registered:\n\n```\nTimerISR t;\n\
    KeyboardISR k;\nInterruptMgr::registerISR(TIMER_INT_NUM, &t);\nInterruptMgr::registerISR(KEYBOARD_INT_NUM,\
    \ &k);\n```\n\nResult:\n\n- Interrupt number TIMER_INT_NUM is handled by t.isr.\n\
    - Interrupt number KEYBOARD_INT_NUM is handled by k.isr.\n\n## Callbacks via Virtual\
    \ Functions\n\nConsider what happens when a timer interrupt occurs:\n\n1. C API\
    \ calls non-member function isrHelper.\n2. isrHelper calls static member function\
    \ InterruptMgr::isrDispatcher.\n3. InterruptMgr::isrDispatcher calls member function\
    \ ISRs[TIMER_INT_NUM]->isr.\n   * This virtual call resolves to t.isr (i.e., TimerISR::isr\
    \ on t).\n\nInterruptMgr::isrDispatcher is inline, so at runtime we expect:\n\n\
    1. C API calls isrHelper.\n2. isrHelper calls t.isr via vtbl.\n\nSimilarly, when\
    \ a keyboard interrupt occurs:\n\n1. C API calls isrHelper.\n2. isrHelper calls\
    \ k.isr via vtbl.\n\n## Assessment: Using Virtual Functions\n\nAdvantages:\n\n\
    - Clear, clean, “object-oriented” solution.\n- Heap objects are allowed, but not\
    \ required.\n- Note that t and k could be globals, namespace-local, or file static.\n\
    \nDisadvantages:\n\n- Must introduce a base class and virtual functions.\n  -\
    \ Virtual functions ⇒ vtbl.\n- Base class may exist only to support callbacks.\n\
    \  - Can lead to many small “interface” classes (and the files they’re in).\n\n\
    - Actual ISRs must be non-static member functions.\n  - Even if static member\
    \ functions or non-members would do.\n  - Of course, the non-static member functions\
    \ could call them.\n- Actual ISRs must have the same signature (including constness).\n\
    - Modulo covariant return types....\n\n## Callbacks via std::function and std::bind\n\
    \nFunctionality present in C++11 and TR1.\n\n- std::function: generalized function\
    \ pointer; holds any callable entity.\n- std::bind: creates function objects holding\
    \ callable entities and some parameter values.\n- Can do more, but this suffices\
    \ here.\n- Result often stored in a std::function object.\n\nTR1 versions are\
    \ in a nested namespace:\n\n- std::function ⇒ std::tr1::function.\n- std::bind\
    \ ⇒ std::tr1::bind.\n"
  mdcn: "\n\n## 以 ISR 作为回调函数的示例\n\n我们的示例是 ISR（中断服务例程序），但我们的关注在于设计上的问题：\n\n- 真实的 ISR\
    \ 代码更复杂：\n  - 可能需要特殊的 ISR 调用约定。\n  - 行为通常受到限制：\n    - 执行期间可能需要禁用其他中断。\n    - 可能仅能安全地操作原子数据。\n\
    \    - 执行时间可能存在硬性实时性限制。\n- 我们将忽略这些细节。\n  - 它们不影响基础设计方案。\n\n## 示例 C 回调 API\n\n\
    假设此 ISR API 用 C 语言实现：\n\n```\ntypedef void (*ISR_t)(int); // 参数 = 中断 ID\nvoid\
    \ setISR(int interruptID, ISR_t isr);\n```\n\n## 类 C 风格函数指针\n\n从概念上说，有两种类型的 C++\
    \ 函数指针可以传递给 setISR：\n- 非成员函数，例如全局函数或命名空间作用域内的函数。\n- 静态成员函数。\n\n原因：这两者都没有 `this`\
    \ 指针。\n- 指向非静态成员函数的指针需要 `this` 指针。\n- 它们与“普通”函数指针在布局上是不兼容的。\n\n静态成员函数更优：\n- 减少命名空间污染：它们的名称局限于所属的类。\n\
    - 封装机会：它们可以被设为 `protected` 或 `private`。\n- 访问权限：它们可以访问 `protected` 或 `private`（静态）成员。\n\
    \n我们的首要目标是使用静态成员函数作为回调。\n\n## C 与 C++ 链接\n\n链接方式可能成为一个问题：\n\n- C 函数具有 C 链接。\n\
    - C++ 函数只有在声明为 `extern \"C\"` 时才具有 C 链接：\n\n```\nvoid f1(int);              //\
    \ 非成员函数：默认为 C++ 链接\nextern \"C\" void f2(int);     // 非成员函数：显式 C 链接\nclass Widget\
    \ {\npublic:\n    static void smf(int);   // 成员函数：始终为 C++ 链接\n};\n```\n\n对于 C++\
    \ 编译，ISR_t 和 setISR 需要 C 链接，因此：\n\n```\nextern \"C\" {              // 使用 C 调用约定\n\
    \    typedef void (*ISR_t)(int);\n    void setISR(int interruptID, ISR_t isr);\n\
    }\n```\n\n## C 与 C++ 链接\n\n编译器可能会不同的处理 C 和 C++ 链接：\nsetISR(0, &f1); // 可能可以或不可以编译/链接/运行\n\
    setISR(1, &Widget::smf); // 同亦\nsetISR(2, &f2); // 通常可以编译/链接/运行\n\n通常情况下，只有非成员的\
    \ `extern \"C\"` 函数是有效的回调函数。\n\n- 即使如此，也仅适用于兼容的 C 和 C++ 代码。\n- C++ 链接没有标准的 ABI。\n\
    \n## 静态成员函数作为回调\n\n非成员函数可以内联调用一个静态成员函数：\n\n```\nclass InterruptMgr {\npublic:\n\
    \    static void isr(int interruptID) // 有效的 ISR\n    { 处理中断的代码; }\n};\nextern\
    \ \"C\" {\n    void isrHelper(int interruptID) // 传递给 C API 的函数\n    { InterruptMgr::isr(interruptID);\
    \ } // 内联调用\n}\nsetISR(0);\n```\n\n在某些平台上，可以省略非成员函数：\n\n- 在某些平台上，C 和 C++ 链接是相同的。\n\
    setISR(0, &InterruptMgr::isr);\n\n## 静态成员函数作为回调\n\n静态成员函数通常调用另一个函数来实际处理中断，因此更好的名称是：\n\
    \n```\nclass InterruptMgr {\npublic:\n    static void isrDispatcher(int interruptID)\n\
    \    { 处理中断的代码; }\n}\nextern \"C\" {\n    void isrHelper(int interruptID)\n  \
    \  { InterruptMgr::isrDispatcher(interruptID); }\n}\nsetISR(0); // 同前\n```\n\n\
    ## 防止异常传播到 C\n\n来自 C++ 抛出的异常不能传播到 C 中。\n\n- C 的栈帧布局可能与 C 的栈帧不同！\n\n如果回调代码可能会抛出异常，请阻止异常，例如：\n\
    \n```\nextern \"C\" {\n    void isrHelper(int interruptID) // 传递给 C API 的函数\n\
    \    try {\n        InterruptMgr::isrDispatcher(interruptID);\n    } catch (...)\
    \ {\n        记录异常，等等...\n    }\n}\n```\n\n`try` 块可能会产生运行时开销：\n\n- 一个更优的设计是在回调代码中禁止异常。\n\
    \n## 基础回调处理策略\n\nimg/4884d4c5f6dd1d5beb5260fcde7_185_0.png\nimg/4884d4c5f6dd1d5beb5260fcde7_185_1.png\n\
    \nScott Meyers, 软件开发顾问\nhttp://www.aristela.com/\n© 2012 Scott Meyers, 版所有。\n\n\
    ## 基础回调处理策略\n\n```\nInterruptMgr 的工作如下：\nclass InterruptMgr {\npublic:\n    typedef\
    \ ISRType; // 稍后说明\n    static void registerISR(int interruptID, ISRType isr)\n\
    \    { ISRs[interruptID] = isr; }\n    static void isrDispatcher(int interruptID)\n\
    \    { ISRs[interruptID](interruptID); }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS];\
    \ // 实际 ISR 的数组声明\n};\nInterruptMgr // 定义实际的数组\nInterruptMgr::ISRs[NUM_INTERRUPTS];\
    \ // ISRs\n```\n\nISR 数组模拟了系统的中断向量表。\n\n- 但在 C++ 中我们可以将其变为任何类型的数组：\n- 它可以持有对象。\n\
    \n## 静态成员函数作为回调\n\n非成员函数可以对静态成员函数进行内联调用：\n\n```\nclass InterruptMgr {\npublic:\n\
    \    static void isr(int interruptID) // 有效的 ISR\n    { 处理中断的代码; }\n};\nextern\
    \ \"C\" {\n    void isrHelper(int interruptID) // 传递给 C API 的函数\n    { InterruptMgr::isr(interruptID);\
    \ } // 内联调用\n}\nsetISR(0);\n```\n\n在某些平台上，可以省略非成员函数：\n\n- 在某些平台上，C 和 C++ 链接是相同的。\n\
    setISR(0, &InterruptMgr::isr);\n\n## 静态成员函数作为回调\n\n静态成员函数通常调用另一个函数来实际处理中断，因此更好的名称是：\n\
    \n```\nclass InterruptMgr {\npublic:\n    static void isrDispatcher(int interruptID)\n\
    \    { 处理中断的代码; }\n}\nextern \"C\" {\n    void isrHelper(int interruptID)\n  \
    \  { InterruptMgr::isrDispatcher(interruptID); }\n}\nsetISR(0); // 同前\n\n## 防止异常传播到\
    \ C\n\n来自 C++ 抛出的异常不能传播到 C 中。\n\n- C 的栈帧布局可能与 C 的栈帧不同！\n\n如果回调代码可能会抛出异常，请阻止异常，例如：\n\
    \n```\nextern \"C\" {\n    void isrHelper(int interruptID) // 传递给 C API 的函数\n\
    \    try {\n        InterruptMgr::isrDispatcher(interruptID);\n    } catch (...)\
    \ {\n        记录异常，等等...\n    }\n}\n```\n\n`try` 块可能会产生运行时开销：\n\n- 一个更优的设计是在回调代码中禁止异常。\n\
    \n## 基础回调处理策略\n\nimg/4884d4c5f6dd1d5beb5260fcde7_185_0.png\nimg/4884d4c5f6dd1d5beb5260fcde7_185_1.png\n\
    \nScott Meyers, 软件开发顾问\nhttp://www.aristela.com/\n© 2012 Scott Meyers, 版所有。\n\n\
    ## 基础回调处理策略\n\n```\nInterruptMgr 的工作如下：\nclass InterruptMgr {\npublic:\n    typedef\
    \ ISRType; // 稍后说明\n    static void registerISR(int interruptID, ISRType isr)\n\
    \    { ISRs[interruptID] = isr; }\n    static void isrDispatcher(int interruptID)\n\
    \    { ISRs[interruptID](interruptID); }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS];\
    \ // 实际 ISR 的数组声明\n};\nInterruptMgr // 定义实际的数组\nInterruptMgr::ISRs[NUM_INTERRUPTS];\
    \ // ISRs\n```\n\nISR 数组模拟了系统的中断向量表。\n\n- 但在 C++ 中我们可以将其变为任何类型的数组：\n- 它可以持有对象。\n\
    \n## 使用虚函数作为回调\n\n创建一个基类来处理中断：\n\n```cpp\nclass ISRBase { // 处理中断\npublic:\n \
    \   virtual void isr(int interruptID) = 0; // 虚函数\n};\n```\n\nInterruptMgr 看起来像这样：\n\
    \n```cpp\nclass InterruptMgr {\npublic:\n    typedef ISRBase* ISRType; // 稍后说明\n\
    \    static void registerISR(int interruptID, ISRType isr)\n    { ISRs[interruptID]\
    \ = isr; }\n    static void isrDispatcher(int interruptID)\n    { ISRs[interruptID](interruptID);\
    \ } // 通过虚函数调用\n    }\nprivate:\n    static ISRType ISRs[NUM_INTERRUPTS]; // 对象的指针数组\n\
    };\n```\n\n派生类提供了实际的 ISR：\n\n```cpp\nclass TimerISR: public ISRBase {\npublic:\n\
    \    void isr(int interruptID) override { /* 处理中断 */ };\n};\n```\n\n```cpp\nclass\
    \ KeyboardISR: public ISRBase {\npublic:\n    void isr(int interruptID) override\
    \ { /* 处理中断 */ };\n};\n```\n\n这些对象对象创建并注册：\n\n```cpp\nTimerISR t;\nKeyboardISR\
    \ k;\nInterruptMgr::registerISR(TIMER_INT_NUM, &t);\nInterruptMgr::registerISR(KEYBOARD_INT_NUM,\
    \ &k);\n```\n\n结果：\n\n- 中断 TIMER_INT_NUM 由 t.isr 处理。\n- 中断 KEYBOARD_INT_NUM 由\
    \ k.isr 处理。\n\n## 使用虚函数的回调\n\n考虑当定时中断发生时发生了什么：\n\n1. C API 调用非成员函数 isrHelper。\n\
    2. isrHelper 调用静态成员函数 InterruptMgr::isrDispatcher。\n3. InterruptMgr::isrDispatcher\
    \ 调用 ISRs[TIMER_INT_NUM]->isr。\n   * 此虚调用解析为 t.isr（即 TimerISR::isr）。\n\nInterruptMgr::isrDispatcher\
    \ 是内联的，因此运行时预期：\n\n1. C API 调用 isrHelper。\n2. isrHelper 通过虚表调用 t.isr。\n\n同样，当键盘中断发生时：\n\
    \n1. C API 调用 isrHelper。\n2. isrHelper 通过虚表调用 k.isr。\n\n## 评估：使用虚函数\n\n优点：\n\n\
    - 清晰、简洁、面向对象的解决方案。\n- 允许使用堆对象，但不是必须。\n- 注意 t 和 k 可以是全局的、命名空间局或文件静态。\n\n缺点：\n\n\
    - 必须引入基类和虚函数。\n  - 虚函数导致虚表。\n- 基类可能仅为了支持回调而存在。\n  - 导致许多小的“接口”类（以及它们所在的文件）。\n\n\
    - 实际的 ISR 必须是非静态成员函数。\n  - 即使静态成员函数或非成员函数也可以。\n  - 当然，非静态成员函数可以调用它们。\n- 实际 ISR\
    \ 必须具有相同的签名（包括 const）。\n- 忽略协变返回类型....\n\n## 使用 std::function 和 std::bind 的回调\n\
    \n功能存在于 C++11 和 TR1。\n\n- std::function：通用函数指针；持有任何可调用实体。\n- std::bind：创建持有可调用实体和某些参数值的函数对象。\n\
    - 可以做更多，但这里足够了。\n- 结果通常存储在 std::function 对象中。\n\nTR1 版本在嵌套命名空间中：\n\n- std::function\
    \ ⇒ std::tr1::function.\n- std::bind ⇒ std::tr1::bind.\n\n"
