    \ the vptr is added to the class. If the second declared data member is a word\
    \ in size and requires only single-word alignment (e.g., int), reordering the\
    \ data members in the class can allow the compiler to eliminate the padding after\
    \ the vptr."
  - "[PAGE 24]\n\n# Object Addresses under Multiple Inheritance\n\nUnder SI, we can\
