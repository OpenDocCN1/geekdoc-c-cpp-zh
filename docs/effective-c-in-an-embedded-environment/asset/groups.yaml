  - "[PAGE 44]\n\n# Efficiency Beyond C\n\nC++ can be more efficient than C:\n\n+\
    \   - C++ feature implementation often offer better than C approximations:\n \
    \ - E.g., virtual functions\n- Abstraction + encapsulation $\\Rightarrow$ flexibility\
    \ to improve implementations:\n  - std::strings often outperform char* - based\
    \ strings:\n    - Use reference counting\n    - May employ \"the small optimization\"\
    \n- STL-proven techniques have revolutionized library design:\n  - Shift work\
    \ from runtime to compile-time:\n    - Template metaprogramming (TMP), e.g., “traits\"\
    \n    - Inlined operator()s\n- Sample success story: C++'s sort is faster than\
    \ C's qsort.\n\nReference-counting implementations for std::string are valid in\
