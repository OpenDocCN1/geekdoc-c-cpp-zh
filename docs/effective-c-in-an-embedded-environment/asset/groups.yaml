    \ and D* pointers.\n  - Another for B2* pointers.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_24_0.png)\n\
    \nSI = \"Single Inheritance.\" MI = \"Multiple Inheritance.\""
  - '[PAGE 25]


    # Object Addresses under Multiple Inheritance


    There is a good reason for:


    ```

    void f(B1 *pb1); // expects pb1 to point

    // to the top of a B1


    void g(B2 *pb2); // expects pb2 to point

    // to the top of a B2

    ```


    ![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_25_0.png)


    Some calls require offset adjustments:


    ```

    D *pd = new D; // no adjustment needed

    f(pd); // no adjustment needed

    g(pd); // requires D* -> B2* adjustment

    B2 *pb2 = pd; // requires D* -> B2* adjustment adjustment

    ```


    Proper adjustments require proper type information:


    ```

    if (pb2 == pd) ... // test succeeds (pd converted to B2*)

    if ((void*)pb2 == (void*)pd) ... // test fails

    ```


    Null pointers never get an offset. At runtime, a pointer nullness test must be
    performed before applying an offset.'
  - "[PAGE 26]\n\n# Virtual Functions under Multiple Inheritance\n\nConsider the plight\
    \ of your compilers:\n\n```\nclass B1 {\npublic:\n    virtual void mf(); // may\
    \ be overridden by\n    derived classes\n};\nclass B2 {\npublic:\n    virtual\
