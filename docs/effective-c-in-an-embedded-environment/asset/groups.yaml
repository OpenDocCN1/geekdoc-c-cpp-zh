    ```\n\n```cpp\nvoid handleBInt(int interruptID); // 非 const\n\nInterruptMgr::registerISR(KEYBOARD_INT_NUM,\n\
    std::bind(&handleBInt, _1));\n```\n\n## 评估：std::function 和 bind\n\n优点：\n\n- 无需自定义类。\n\
    - 函数对象：\n  - 静态成员函数\n- 回调签名只需与目标兼容。\n\n## 评估：std::function 和 bind\n\n：\n\n- TR1\
    \ 实现很常见，但无处不在。\n- 开发者对 TR1 不熟悉。\n- 存在 bind 的开源和商业版本。\n- std::function 对象有代价：\n\
    \  - 它们可能会分配内存。\n  - 实现使用虚函数。\n\n## (简单) 性能对比\n\n| VC11 beta /Ox | 非成员函数 | 虚函数\
