  mdcn: "\n\n# 控制寄存器的建模\n\n通过将解引用后的指针绑定到引用，可以避免指针语法：\n\n```\nControlReg& cr = \n \
    \   new (reinterpret_cast<void*>(0xFFFF0000)) ControlReg;\nwhile (!cr.ready());\
    \ // 等待就位位设置\n    cr.enableInterrupts(); // 启用设备中断\n    if (cr.interruptsEnabled())\
    \ ... // 如果中断已启用...\n```\n\n# 定位 new (Placement new) vs 原始强制转换 (Raw Casts)\n\n\
    我们使用 placement new 调用默认的 ControlReg 构造函数。\n\n- 它是隐式的、内联的且空的。\n- 它应该被优化掉（即变为零指令）。\n\
    - 如果它没有被优化掉且你在意，可以考虑使用 `reinterpret_cast` 代替 placement new：\n\n```cpp\nControlReg\
    \ * const pcr = // 指针版本\nreinterpret_cast<ControlReg*>(0xFFFF0000);\nControlReg&\
    \ cr = // 引用版本\nreinterpret_cast<ControlReg*>(0xFFFF0000);\n```\n\n# 定位 new vs\
    \ 原始强制转换\n\nPlacement new 通常优于原始的 `reinterpret_cast`：\n\n- 如果设备对象的构造函数有需要执行的工作，它就能生效。\n\
    - 在那种，原始强制转换的行为将不正确。\n- 但某些情况下 `reinterpret_cast` 可能更好：\n  - 如果 placement new\
    \ 没有被优化为零指令（且你在意）。\n  - 如果你想将 IO 寄存器的地址固存在 ROM 中且：\n    - 你的编译器会将 `reinterpret_cast`\
    \ 的结果存入 ROM\n    - 但它不会将 placement new 的结果存入 ROM。\n\n# 通过编译器扩展放置对象\n\n在某些编译器/链接器中，还有另一种替代方案：\n\
    \n- 使用编译器扩展在特定地址放置对象。\n\n示例：\n\n- Altium Tasking 编译器提供此类语法：\n  `ControlReg cr\
    \ __at(0xFFFF0000);`\n- Wind Rabi 编译器提供这种方式：\n  `#pragma section MMIO address=0xFFFF0000`\n\
    \  `#pragma use_section MMIO cr`\n  `ControlReg cr;`\n\n此类扩展可能会带来限制：\n\n- 例如，此类手动放置的对象可能必须是\
    \ POD 类型（纯数据类型）。\n\n收益：\n\n- 无需通过指针间接访问 MMIO 对象。\n- 无需为每个 MMIO 对象的指针分配空间。\n\n\
    # 通过链接器命令放置对象\n\n链接器可能支持指定对象的放置位置：\n\n- C++ 源代码是“常规的”。\n- 不包含对象放置信息。\n- `ControlReg;\
    \ // 在 C++ 源文件中`\n- 链接器脚本将 C++ 对象映射到内存位置，通常通过：\n  - 链接器只看到修后的名称（mangled names）。\n\
    \  - 将对象映射到段（sections）。\n  - 将地址映射到地址范围。\n\n结果是更具移植性的 C++ 代码。\n\n- 特定平台的地址仅在链接器脚本中提到。\n\
    - “硬件工程师别人身上施加恐怖统治。”\n\n为了让这种方法生效，要放置的对象（例如 `cr`）必须具有外部链接。\n\n我没有链接器脚本的示例片段，因为我找不到或开发出一个简单的示例。gcc\
    \ 支持链接器脚本，关于它们的基本信息（例如参考手册）可以通过 Google 轻松找到。\n\n# 输出设备的建模，方案 1\n\n一个 `int` 大小的输出设备寄存器可以建模为一个\
    \ `ControlReg` 对象，并与它控制的 `int` 大小的数据封装：\n\n```\nclass OutputDevice1 {\npublic:\n\
    \    OutputDevice1(unsigned controlAddr,\n    unsigned dataAddr); // 见页\n    ControlReg&\
    \ control() { return *pcr; }; // 获取 ControlReg\n    void write(unsigned value)\
    \ // 将数据写入\n    { *pd = value; } // 设备\nprivate:\n    ControlReg * const pcr;\
    \ // 指向 ControlReg 的指针；注意 const\n    volatile unsigned * const pd; // 指向数据的指针；注意\
    \ const 和 volatile\n};\n```\n\n# 输出设备的建模，方案 1\n\n构造函数使 `pcr` 和 `pd` 指向正确的地址：\n\
    \n```cpp\ninline\nOutputDevice1::OutputDevice1(unsigned controlAddr, unsigned\
    \ dataAddr)\n  : pcr(reinterpret_cast<void*>(controlAddr)) ControlReg,\n    pd(reinterpret_cast<volatile\
    \ unsigned*>(dataAddr)) {}\n```\n\n客户端这样使用该类：\n\n```cpp\nOutputDevice1 od(0xFFFF0000,\
