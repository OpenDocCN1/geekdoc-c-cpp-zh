    \nThe diagram is supposed to make it easy to refer to the memory layout of an\
    \ allocated block where the size has been stored at the beginning.\n\n# LIFO Heap\
    \ Allocation\n\n- **Speed**: extremely fast; deterministic.\n  - ➡ Assuming you\
