    \nThis slide begins a summary of the costs of various C++ language features (compared\
    \ to C).\n\n## More “No-Cost” C++ Features\n\nThese look like they cost you something,\
    \ but in truth they rarely do (compared to equivalent C behavior):\n\n- Constructors\
    \ and destructors:\n  - They contain code for mandatory initialization and finalization.\n\
    \  - However, they may yield chains of calls up the hierarchy.\n- Single inheritance\n\
    - Virtual functions\n  - Abstract classes with no virtual function implementations\
    \ (i.e, \"Interfaces\") may still generate vtbls.\n  - Some compilers offer ways\
    \ to prevent vtbls.\n- Virtual inheritance\n\nBoth MS and Comeau offer the `__declspec(novtable)`\
    \ mechanism to suppress vtbl generation and vptr assignment for Interface classes.\
    \ Apparently the Sun compiler will optimize away unnecessary vtbls in some cases\
    \ without any manual user intervention. From what I can tell, as of gcc 4.x, there\
    \ is no comparable feature in g++.\n\n## Still More “No-Cost” C++ Features\n\n\
    - new and delete:\n  - By default, new = malloc + constructor(s) and delete =\
    \ destructor(s) + free\n  - Note that error-handling behavior via exceptions is\
    \ built in.\n\nImportant: new is useful even in systems where all memory is statically\
    \ allocated.\n\n- Placement new allows objects to be constructed at particular\
    \ locations:\n  - E.g., in statically allocated memory.\n  - E.g., at memory-mapped\
    \ addresses.\n- We’ll see examples later.\n\nNote: for all of the preceding features,\
    \ if you don't use them, you don't pay.\n\n## \"Low-Cost\" C++ Features\n\nYou\
    \ may pay for these features, even if you don't use them:\n\n- Exceptions: a small\
    \ speed and/or size penalty (code)\n- When evaluating the cost of exceptions,\
    \ be sure to do a fair comparison.\n- Error handling costs you something, no matter\
    \ how it is implemented.\n- E.g., Saks reports object code increases of 15-40%\
    \ for error handling based on return values.\n\nDetails on Dan Saks’ analysis\
    \ is in the *Embedded Systems Design* article referenced in the “Further Information”\
    \ slides at the end of the notes.\n\n## Approaches to Implementing Exceptions\n\
    \nConsider the problem of local object destruction:\n\n```\n{\n  V1\n  ...\n \
    \ {\n    V2\n    V3\n    ...\n  }\n  V4\n  V5\n  ...\n}\n```\n\nWhich objects\
    \ should be destroyed if an exception is thrown?\n\n- There are two basic approaches\
    \ to keeping track.\n\n## Approaches to Implementing Exceptions\n\nOne is to keep\
    \ a shadow stack of objects requiring destruction if an exception is thrown.\n\
    \n- Code size increases to include instructions for manipulating the shadow stack.\n\
    - Runtime data space increases to hold the shadow stack.\n- Program runtime increases\
    \ to allow for shadow stack manipulations.\n- Performance impact?\n  - Unknown.\
    \ Apples-to-apples comparisons are hard to come by.\n  - Ballpark guesstimate:\
    \ 5-10% hit in both time and space.\n  - “Guesimate” = “Speculation”\n\nThis is\
    \ sometimes known as the “Code Approach.”\n\n- Microsoft uses it for 32 bit (but\
    \ not 64 bit) Windows code.\n- g++ distributions for Windows use it, too.\n\n\
    ## Approaches to Implementing Exceptions\n\nThe alternative maps program regions\
    \ to objects requiring destruction:\n\n| Region | Objects |\n| --- | --- |\n|\
    \ R0 | None |\n| R1 | V1 |\n| R2 | V1, V2 |\n| R3 | V1, V2, V3 |\n| R4 | Same\
    \ as R1 |\n| R5 | V1, V4 |\n| R6 | V1, V4, V5 |\n\n- This analysis is simplified,\
    \ e.g., it ignores the possibility that destructors may throw.\n- Most compilers\
    \ for Unix use this approach. The 64 bit Itanium ABI uses it.\n\n## Approaches\
    \ to Implementing Exceptions\n\n- Program speed is unaffected when no exceptions\
    \ are thrown.\n- Program size increases due to need to store the code to use the\
    \ tables.\n- Static program size increases due to need to store the tables.\n\
    - When no exception is thrown, these tables need not be in memory, in working\
    \ set, or in cache.\n- Throwing exceptions is slow:\n  - Tables must be read,\
    \ possibly after being swapped in, possibly being uncompressed.\n  - However,\
    \ throwing exceptions should be ... exceptional.\n\n## Exceptions and Dynamically\
    \ Allocated Memory\n\nSome compilers try to use heap memory for exception objects.\n\
    \n- This can be unacceptable in some embedded systems.\n\n## Don't let this scare\
    \ you:\n\n- Implementations reserve some non-heap memory for exception objects.\n\
    - They have to be able to propagate std::bad_alloc exceptions!\n- Platforms with\
    \ no heap should still be able to use exceptions.\n\nOne platform that uses heap\
    \ memory for exceptions (when it can) is g++.\n\n## Effective C++ in an Embedded\
    \ Environment\n\n## “Low-Cost” C++ Features\n\nMore features you may pay for,\
    \ even if you don't use them:\n\n- Multiple inheritance: a small size penalty\
    \ (vtbl) that store vptrs\n- dynamic_cast and other RTTI features: a small size\
    \ penalty (vtbl)\n- Each use of dynamic_cast may be linear in the number of base\
    \ classes (direct and indirect) of the object being cast.\n  - Each use may involve\
    \ a call to strcmp for each class in the hierarchy.\n- QOIs vary. The Technical\
    \ Report on C++ Performance provides details.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_41_0.png)\n\
    \n“QOI” = “Quality of Implementation”\n\nScott Meyers, Software Development Consultant\n\
    \n© 2012 Scott Meyers, all rights reserved.\n\nSlide 40\n\nScott Meyers, Software\
    \ Development Consultant\n\n© 2012 Scott Meyers, all rights reserved.\n\n## C++\
    \ Features that can Surprise Inexperienced C++ Programmers\n\nThese can cost you\
    \ if you're not careful:\n\n- Temporary objects, e.g., returned from a+b:\n  -\
    \ Many techniques exist to reduce the number and/ cost of temporaries.\n  - I'll\
    \ provide some references at the end of this talk.\n- Templates:\n  - We'll discuss\
    \ techniques based on inheritance and void*-pointers that can eliminate code bloat.\n\
    \n## Common Questions\n\nWhy are simple \"hello world\" programs in C++ so big\
    \ compared to C?\n\n- iostream vs. stdio\n- \"hello world\" is an atypical program:\n\
    - For small programs, C++ programmers can still use stdio\n\nWhy do C developers\
    \ moving to C++ often find that their code is big and slow?\n\n- C++ isn't C,\
    \ and C programmers aren't C++ programmers\n- C++ from good C++ developers as\
    \ good as C from good C developers\n\n## Efficiency Beyond C\n\nC++ can be more\
    \ efficient than C:\n\n- C++ feature implementation often offer better than C\
    \ approximations:\n  - E.g., virtual functions\n- Abstraction + encapsulation\
    \ $\\Rightarrow$ flexibility to improve implementations:\n  - std::strings often\
    \ outperform char* - based strings:\n    - Use reference counting\n    - May employ\
    \ \"the small optimization\"\n- STL-proven techniques have revolutionized library\
    \ design:\n  - Shift work from runtime to compile-time:\n    - Template metaprogramming\
    \ (TMP), e.g., “traits\"\n    - Inlined operator()s\n- Sample success story: C++'s\
    \ sort is faster than C's qsort.\n"
  mdcn: "\n\n# 虚函数、多重继承与虚基类\n\n通用情况涉及：\n\n- 带有非静态数据成员的虚基类。\n- 继承自其他虚基类的虚基类。\n- 在同一继承层次结构中混合使用虚继承和非虚继承。\n\
    \n> 虚基类的支持已经走入了拜占庭式的深奥……\n> 这些内容太晦奥了，不值得讨论……\n\n> 我也放弃了 :-)\n\n这段引用自 Lippman 的《C++\
    \ 对象模型内析》（*Inside the C++ Object Model*），笔记末尾的“更多信息”幻灯片中有其完整参考文献。\n\n## “无成本”C++\
    \ 特性\n\n这些特性仅在编译期间会产生代价。在目标代码中，它们看起来就像 C 语言：\n\n- 所有 C 语言内容：结构体、指针、全局函数等。\n- 类\n\
    - 命名空间\n- 静态函数和数据\n- 非虚成员函数\n- 函数和运算符重载\n- 默认参数：\n\n注意，它们总是会被传递的。因此，糟糕的设计可能是昂昂的：\n\
    ```cpp\nvoid doThat(const std::string& name = \"Unnamed\"); // 坏\nconst std::string\
    \ defaultName = \"Unnamed\";\nvoid doThat(const std::string& name = defaultName);\
    \ // 更好\n```\n\n- 重载通常是一种更廉价的替代方案。\n\n这张幻灯片开始总结各种 C++ 语言特性（与 C 相比）的成本。\n\n## 更多“无成本”C++\
    \ 特性\n\n这些特性看起来付出了代价，但实际上很少（与等效的 C 行为相比）：\n\n- 构造函数和析构函数：\n  - 它们包含了强制初始化和最终清理化的代码。\n\
    \  - 然而，它们可能会产生向上层次传递的调用链。\n- 单继承\n- 虚函数\n  - 没有虚函数实现的抽象类（即“接口”）可能仍会生成虚表（vtbl）。\n\
    \  - 某些编译器提供了防止虚表的方法。\n- 虚继承\n\nMS 和 Comeau 都提供了 `__declspec(novtable)` 机制，用于抑制接口类的虚表生成和虚指针（vptr）赋值。显然，Sun\
    \ 编译器会在某些情况下无需用户手动干预即可优化掉不必要的虚表。据我所知，截至 gcc 4.x，g++ 还没有类似的特性。\n\n## 更多“无成本”C++\
    \ 特性\n\n- new 和 delete：\n  - 默认情况下，`new = malloc + 构造函数(s)`，`delete = 析构函数(s)\
    \ + free`\n  - 注意内置了通过异常进行错误处理的行为。\n\n重要：放置 new（Placement new）允许在特定位置构造对象：\n \
    \ - 例如，在静态分配的内存中。\n  - 例如，在内存映射地址处。\n  - 我们稍后会看到示例。\n\n注意：对于上述的所有特性，如果你不使用它们，就不需要付费。\n\
    \n## “低成本”C++ 特性\n\n即使你不使用这些特性，也可能需要为它们付出代价：\n\n- 异常：微小的速度和/或尺寸（代码）惩罚。\n- 在评估异常的成本时，务必进行公平的比较。\n\
    - 错误处理无论如何实现，都会让你付出一些代价。\n- 例如，Saks 报告称，基于返回值的错误处理会导致目标代码增加 15-40%。\n\n关于 Dan\
    \ Saks 分析的细节见笔记末尾“更多信息”幻灯片中引用的《嵌入式系统设计》文章。\n\n## 异常实现方法\n\n考虑局部对象析毁的问题：\n\n```\n\
    {\n  V1\n  ...\n  {\n    V2\n    V3\n    ...\n  }\n  V4\n  V5\n  ...\n}\n```\n\
    \n如果发生异常，哪些对象应该被销毁？\n\n- 有两种跟踪的基本方法。\n\n## 异常实现方法\n\n一种方法是维护一个在抛出异常时需要析毁对象的影子栈。\n\
    \n- 代码 own增加以包含操作影子栈的指令。\n- 运行时数据空间增加以存放影子栈。\n- 程序运行时间增加以允许对影子栈的操作。\n- 对性能的影响如何？\n\
    \  - 未知。很难找到同等标准的比较。\n  - 大致估算：时间和空间上都有 5-10% 的影响。\n  - “估算” = “推测”。\n\n这有时被称为“代码方法”。\n\
    \n- 微软将其用于 32 位（但未使用 64 位）Windows 代码。\n- Windows 上的 g++ 发行版也使用这种方法。\n\n## 异常实现方法\n\
    \n另一种方法是将程序区域映射到需要析毁的对象：\n\n| 区域 | 对象 |\n| --- | --- |\n| R0 | 无 |\n| R1 | V1\
    \ |\n| R2 | V1, V2 |\n| R3 | V1, V2, V3 |\n| R4 | 同 R1 |\n| R5 | V1, V4 |\n| R6\
    \ | V1, V4, V5 |\n\n- 这种分析是简化的，例如，它忽略了析构函数可能抛出异常。\n- 大多数 Unix 编译器使用这种方法。64 位 Itanium\
    \ ABI 也使用这种方法。\n\n## 异常实现方法\n\n- 当不发生异常时，程序速度不受影响。\n- 由于需要存储使用这些表的代码，程序尺寸增加。\n\
    - 由于需要存储表，静态程序尺寸增加。\n- 当不抛出异常时，这些表不需要在内存中、工作集中或缓存中。\n- 抛出异常是缓慢的：\n  - 必须读取表，可能在换入后，也可能在解压缩后。\n\
    \  - 然而，抛出异常应该是……异常的。\n\n## 异常与动态内存\n\n即使在所有内存都是静态分配的系统中，new 也是有用的。\n\n放置 new\
    \ 允许在特定位置构造对象（见上文）。\n\n## 别让这吓到你：\n\n某些编译器尝试使用堆内存异常。\n- 这在某些嵌入式系统中是不可接受的。\n\n\
    ## 嵌入式环境中的有效 C++\n\n异常与堆内存\n\n- 能够使用堆内存的平台是 g++。\n\n## 让缺乏经验的 C++ 程序员感到惊讶的 C++\
    \ 特性\n\n如果你不小心，这些特性可能会让你付出代价：\n\n- 临时对象，例如从 `a+b` 返回的对象：\n  - 有许多技术可以减少临时对象的数量和/成本。\n\
    \  - 我会在演讲结束时提供参考文献。\n- 模板：\n  - 我们将讨论基于继承和 void 指针的技术来消除代码膨胀。\n\n## 常见问题\n\n\
    为什么 C++ 的简单 \"hello world\" 程序相比 C 语言要大？\n\n- iostream 对比 stdio\n- \"hello world\"\
    \ 是一个典型的程序：\n- 对于小型程序，C++ 程序员仍然可以使用 stdio\n\n为什么转向 C++ 的 C 开发者经常发现他们的代码既大又慢？\n\
    \n- C++ 不是 C，C 程序员也不是 C++ 程序员\n- 优秀的 C++ 开发者编写的 C++ 与优秀的 C 开发者编写的 代码一样好\n\n##\
    \ 超 C 的效率\n\nC++ 可以比 C 更高效：\n\n- C++ 特性的实现通常比 C 的近似方案更好：\n  - 例如，虚函数\n- 抽象 + 封装提供了改进实现的灵活性：\n\
    \  - std::string 通常优于基于 char* 的字符串：\n    - 使用引用计数\n    - 可能采用“微优化”\n- STL 证明的技术革新了库的设计：\n\
    \  - 将工作从运行时转移到编译时：\n    - 模板元编程 (TMP)，例如“特征（traits）”\n    - 内联 operator()\n-\
    \ 成功案例：C++ 的排序比 C 的 qsort 快。\n\n"
