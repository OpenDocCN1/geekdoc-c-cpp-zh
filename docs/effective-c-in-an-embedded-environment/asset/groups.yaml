    \ // 注意缺少 size 参数\n}\n```\n\n类类特定的版本也是如此：\n\n```cpp\nvoid* Widget::operator new(std::size_t\
    \ bytes) throw (std::bad_alloc)\n{\n    return customAllocator.allocate(bytes,\
    \ false);\n}\n```\n\n```cpp\nvoid Widget::operator delete(void* ptr, std::size_t\
    \ size) throw () {\n    customAllocator.deallocate(ptr, size);\n}\n```\n\n# 支持全局\
    \ new/delete\n\n```cpp\nvoid* LIFOAllocator::allocate(std::size_t bytes, bool\
    \ hideSize) throw (std::bad_alloc) {\n    if (bytes == 0) bytes = 1;\n    if (hideSize)\n\
    \        bytes += sizeof(std::size_t); // 为大小留空间；如果隐藏隐藏则使用 pmem\n    while (true)\
    \ {\n        if (heapTop + bytes <= heapEnd) {\n            unsigned char *pMem\
    \ = heapTop;\n            if (hideSize)\n                *reinterpret_cast<std::size_t*>(pMem)\
    \ = bytes; // 溢出？\n            pMem += sizeof(std::size_t); // 对齐？\n        }\n\
    \        heapTop += bytes;\n        return pMem;\n    }\n    通常一样检查/使用新的 handler；\n\
    }\n```\n\n在与之前提到的情况下，如果 `bytes` 为 0 且 `hideSize` 为 `false`，这段代码将出现问题。和之前一样，这只有在有人显式调用\
    \ `className::operator new(0)` 时才会发生。\n\n注释“overflow”和“alignment?”显示了必须考虑这些问题的地方。在这些幻灯片中的骨架代码中，它们只是被标记并忽略了。\n\
    \n处理内存对齐的唯一标准方法是确保此函数始终返回一个对任何数据类型对齐的内存指针。\n\n该图旨在方便引用在开头存储大小的分配块的内存布局。\n\n# 支持全局\
    \ new/delete\n\n```cpp\nvoid LIFOAllocator::deallocate(void *ptr) throw ()\n{\n\
    \    if (ptr == nullptr) return;\n    unsigned char *pMem =\n        static_cast<unsigned\
    \ char*>(ptr) - sizeof(std::size_t);\n    std::size_t size = *reinterpret_cast<std::size_t*>(pMem);\n\
    \    if (heapTop != pMem + size) {\n        // 其他客户端使用错误或与堆相关的数据结构无效\n       \
    \ // 记录问题，然后调用 exit 或 abort/重置系统。\n    }\n    heapTop -= size;\n}\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_111_0.png)\n\
    \n该图旨在方便引用在开头存储大小的分配块的内存布局。\n\n# LIFO 堆分配\n\n- **速度**：极快；确定性。\n  - ➡ 假设你没有耗尽内存。\n\
    - **外部碎片**：可能，但容易检测（如所示）。\n- **内存泄漏**：可能，易于检测。\n- **内存耗尽**：可能。\n\n# 池化分配\n\n堆分配的大小都是相同的。\n\
    \n- 通常是因为所有堆对象都是同一种大小。\n- 适用于所有堆对象都是同一种大小的分配器。\n- 适用于堆对象几乎相同时大小的情况。\n\n基础方法：\n\
    \n- 将内存视为数组。\n- 每个分配单元的大小固定的。\n- 无需存储大小。\n- 释放到空闲链表。\n- 分配/释放是简单的操作。\n- 释放时是添加到空闲链表头部。\n\
    \n# 池化分配\n\n```cpp\ntemplate<std::size_t ElementSize>\nclass PoolAllocator {\n\
    public:\n    PoolAllocator(unsigned char* heapAddr,\n                  std::size_t\
    \ heapSize);\n    void* allocate(std::size_t sz) throw (std::bad_alloc);\n   \
    \ void deallocate(void* ptr, std::size_t size) throw ();\nprivate:\n    union\
    \ Node { // 池元素\n        unsigned char data[ElementSize];\n        Node *next;\
    \ // 链表\n    };\n    Node *freeList;\n};\n```\n\n- `data` 成员应当声明。\n- 如果是 `ElementSize`\
    \ 。\n- 理想情况下，`ElementSize > 0`。\n- 此处没有接收 `void*` 的 `deallocate`。\n\n# 池化构造函数\n\
    \n```cpp\ntemplate<std::size_t ElementSize>\nPoolAllocator<ElementSize>::PoolAllocator(unsigned\
    \ char* heapAddr,\n                                           std::size_t heapSize)\n\
    \    : freeList(reinterpret_cast<Node*>(heapAddr))\n{\n    const std::size_t nElems\
    \ = heapSize / ElementSize;\n    for (std::size_t i = 0; i < nElems-1; ++i) //\
    \ 链接元素\n        freeList[i].next = &freeList[i+1];\n    freeList[nElems-1].next\
    \ = nullptr;\n}\n```\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_115_0.png)\n\n\
    为了避免对齐问题，这段代码应该检查 `heapAddr` 是否对齐。如果没有，可以抛出异常或在开头跳过字节以获取对齐的地址。\n\n# PoolAllocator::allocate\n\
    \n```cpp\ntemplate<std::size_t ElementSize>\nvoid* PoolAllocator<ElementSize>::allocate(std::size_t\
    \ bytes)\nthrow (std::bad_alloc)\n{\n    if (bytes != ElementSize) return ::operator\
    \ new(bytes);\n    while (true) {\n        if (freeList != nullptr) { // 对齐；\n\
    \            void *pMem = freeList;\n            freeList = freeList->next;\n\
    \            return pMem;\n        }\n        std::new_handler currentHandler\
    \ = std::get_new_handler();\n        if (currentHandler) currentHandler();\n \
    \       else throw std::bad_alloc();\n    }\n}\n```\n\n处理对齐问题的正确位置是构造函数。查看幻灯片上关于该代码的注释。\n\
    \n```cpp\nstd::new_handler currentHandler = std::set_new_handler(0);\nstd::set_new_handler(currentHandler);\n\
    ```\n\n# PoolAllocator::deallocate\n\n```cpp\ntemplate<std::size_t ElementSize>\n\
    void PoolAllocator<ElementSize>::deallocate(void *ptr, std::size_t size)\n{\n\
    \  if (ptr == nullptr) return;\n  if (size != ElementSize) {\n    ::operator delete(ptr);\n\
    \    return;\n  }\n\n  Node *p = static_cast<Node*>(ptr);\n  p->next = freeList;\n\
    \  freeList = p;\n}\n```\n\n# PoolAllocator::allocate\n\n变体：允许 `bytes <= ElementSize`，即请求符合大小。\n\
    \n- 更灵活，但可能导致内部碎片。\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_118_0.png)\n\n\
    # 池化分配\n\n客户端代码：\n\n- “客户端”是运算符 `new/delete` 的实现者。\n- 留给会者的练习题 :-\n  - `operator\
    \ new` 调用 `allocate`\n  - `operator delete` 调用 `deallocate`\n  - 与 `LIFOAllocator`\
    \ 相似。\n\n"
