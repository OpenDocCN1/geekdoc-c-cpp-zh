  - '[PAGE 288]


    # # Further Information


    More general information on how C++ is implemented:


    +   - **Vtbl layout order in MI,** comp.lang.c++.moderated thread, initiated 27
    May 2005 by Scott Meyers. Available at http://tinyurl.com/rs3rb.

    - Note gcc''s "-fdump-class-hierarchy" option.

    - **“Exception Handling,”** Josée Lajoie, C++ Report, March-April 1994 (Part 1)
    and June 1994 (Part 2).

    - Overview of a table-based EH implementation.

    - Part 1 was reprinted in C+ Gems, Stanley Lippman (Ed.), SIGS Books & Multimedia,
    1996, ISBN 1-884842-37-2.

    - **“Itanium C++ ABI,”** CodeSourcery web site, available at http://www.codesourcery.com/cxx-abi/abi.html.

    - Includes an ABI specification for table-based EH implementations (for 64 bit
    applications).

    - **“Fast Dynamic Casting,”** Michael Gibbs and Bjarne Stroustrup, Software Practice
    & Experience, December 2005.

    - Describes a constant-time implementation of dynamic_cast.'
  - '[PAGE 289]


    # Further Information


    Information on how Microsoft’s C++ is implemented:


    +   - "How a C Compiler Implements Exception Handling," Vishal Kochhar, The Code
    Project web site, April 2002, available at http://www.codeproject.com/cpp/exceptionhandler.asp.

    - An excruciatingating detailed description of how EH is implemented in MSVC6-7.

    - "The Cost of C++ Exception Handling on Windows," Kevin Frey, Presentation to
    the Northwest C++ Users Group, October 18, 2006.

    - "C++ Under the Hood," Jan Gray, in Black Belt C++: The Masters Collection, M&T
    Books, 1994, ISBN 1-55851-334-5

    - Describes how language features are (were?) implemented in MSVC.

    - "Microsoft C++ Name Mangling Scheme," Kang Seonghoon, http://mearie.org/documents/mscmangle/'
  - '[PAGE 290]


    # Further Information


    Program behavior when pure virtual functions are called:


    +   - “Pure Virtual Function Called: An Explanation,” The C++ Source, February
    26, 2007, http://www.artima.com/cppsource/pure_virtual.html.


    Cost of error handling with without exceptions:


    +   - “Bail, return, jump, or...throw,” Dan Saks, Embedded Systems Design, March
    2007.


    +   - Estimates object size increase of 15–40% for using return values to report
    error conditions (vs. no error detection/propagation).'
  - '[PAGE 291]


    # Further Information


    Controlling the generation and cost of temporary objects:


    +   - More Effective C++: 35 New Ways to Improve Your Programs and Designs,

    Scott Meyers, Addison-Wesley, 1996, ISBN 0-201-63371-X.

    - Items 19-22 cover the basics of controlling temporary creation.

    - Item 29 describes how reference counting can make object creation inexpensive.

    - A copy of the book’s table of contents is attached.


    +   - Template metaprogramming (TMP), including expression templates and TMP-based
    libraries:

    - “Using C++ Template Metaprograms,” Todd Veldhuizen, C++ Report, May 1995.

    - C++ Templates, David Vandevooordede and Nicolai Josuttis, Addison-Wesley, 2003,
    ISBN 0-201-73484-2, chapters 17-18.'
  - '[PAGE 292]


    # Effective C++ in an Embedded Environment


    # Further Information


    Code bloat:


    +   - **Techniques for Scientific C++, Todd Veldhuizen, Indiana University Computer
    Science Technical Report # 542, August 2000. Available at http://www.osl.iu/~teldhuiz/papers/techniques/**

    - Section 1.5 is entitled "Managing Code Bloat."


    +   - **“Code Bloat due to Templates,”** comp.lang.c++.moderated thread, initiated
    16 May 2002. Available at http://tinyurl.com/xnhn.

    - **“C++ Templates vs. .NET Generics,”** comp.lang.c++.moderated thread, initiated
    4 October 2003. Available at http://tinyurl.com/xnhf.

    - The 13 November posting by Mogens Hansen initiates a good subthread on commonality/variability
    analysis.

    - **“Efficient Run-Time Dispatching in Generic Programming with Minimal Code Bloat,”**
    Lumoir Bordev and Jaikko Järvi, Library-Centric Software Design (LCSD ‘06), 22
    October 2006.

    - Describes an advanced code hoisting technique.

    - **“Minimizing Dependencies within Generic Classes for Faster and Smaller Programs,”**
    Dan Tsafrir *et al.*, OOPSLA ‘09, October 2009.

    - Discusses performance costs of unnecessarily class naming.


    Scott Meyers, Software Development Consultant

    http://www.aristele.com/


    © 2012 Scott Meyers, all rights reserved.


    Slide 291


    Scott Meyers, Software Development Consultant


    © 2012 Scott Meyers, all rights reserved.'
  - '[PAGE 293]


    # Further Information


    Inlining:


    +   - “Inline Redux,” Herb Sutter, C/C++ Users Journal, November 2003.

    - “Inline Functions,” Randy Meyers, C/C++ Users Journal, July 2002.

    - “Efficient C++,” Dov Bulka and David Mayhew, Addison-Wesley, 2000, ISBN 0-201-37950-3.

    - 3 chapters on getting the most out of inlining!

    - “Link-Time Code Generation,” Matt Pietrek, MSD Magazine, May 2002.

    - Describes link-time inlining in Visual C++ .NET, including how the system determines
    which functions will be inlined.'
  - '[PAGE 294]


    # Further Information


    Using link-time polymorphism:


    +   - “Effective Test-Driven Development for Embedded Software,” Michael Karlesky
    et. al., IEEE 2006 Electro/Information Technology Conference, May 2006.

    - Uses link-time polymorphism to achieve TDD for C.'
  - "[PAGE 295]\n\n# Further Information\n\nROMing objects:\n\n+   - \"Static vs.\
    \ Dynamic Initialization,\" Dan Saks, Embedded Systems Programming, December 1998\
    \ and \"Ensuring Static Initialization in C++,\" Embedded Systems Programming,\
    \ March 1999.\n  - Summarizes when compilers are most likely to ROM data.\n- Technical\
    \ Report on C++ Performance, ISO/IEC TR 18015:2006(E).\n  - Discusses what can\
    \ be ROMed, at least in theory.\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_295_0.png)"
  - '[PAGE 296]


    # Further Information


    Memory management in embedded systems:


    +   - Small Memory Software, James Noble and Charles Weir, Addison-Wesley, 2001,
    ISBN 0-201-59607-7, chapter 5.

    - Also explores other topics related to embedded systems software.

    - Real-Time Design Patterns, Bruce Powel Douglass, Addison-Wesley, 2003, ISBN
    0-201-69956-7, chapter 6.

    - “Improving Performance for Dynamic Memory Allocation,” Marco Varsele, Embedded
    Systems Design, May 2009.

    - Describes implementation of a block allocator.


    Guidelines for understanding, using, and writing new and delete:


    +   - Effective C++, Third Edition, Scott Meyers, Addison-Wesley, 2005, ISBN 0-321-33487-6.

    - Effective C++, Second Edition, Scott Meyers, Addison-Wesley, 1998, ISBN 0-201-92488-9.

    - More Effective C++, Scott Meyers, Addison-Wesley, 1996, ISBN 0-201-63371-X.


    Both Small Memory Software and Real-Time Design Patterns are written as collections
    of patterns, but Small Memory Software makes better use of the form, IMO.'
  - '[PAGE 297]


    # Further Information


    General information on new, delete, and memory management:


    +   - **Efficient Memory Allocation**, Sasha Gontmakher and Ilan Horn, Dr. Dobbs
    Journal, January 1999, pp. 116f.


    +   - **Modern C++ Design**, Andrei Alexandrescu, Addison-Wesley, 2001, ISBN 0-201-70431-5,
    chapter 4.


    +   - **Memory Management & Embedded Databases**, Andrei Gorine and Konstantin
    Knizhnik, Dr. Dobbs Journal, December 2005.


    +   - **Boost Pool Library**, Stephen Cleary, http://www.boost.org/libs/pool/doc/index.html.


    +   - **A Memory Allocator**, Doug Lea, http://gee.cs.oswegdu.edu/di/html/malloc.html.


    +   - **Scalable Lock-Free Dynamic Memory Allocation**, Maged M. Michael, Proceedings
    of the 2004 Conference on Programming Language Design and Implementation (PLDI),
    available at http://www.cs.utah.edu/~wilson/compilers/papers/pldi04-michael.pdf.'
  - '[PAGE 298]


    # Further Information


    STL allocators:


    +   - Effective STL, Scott Meyers, Addison-Wesley, 2001, ISBN 0-201-74962-9.

    - The C++ Programming Language (Third Edition), Bjarne Stroustrup, Addison-Wesley,
    1997, ISBN 0-201-88954-4, pp. 567-576.

    - "Custom STL Allocators.\ Pete Isensee, http://www.tantalon.com/pete/?customallocators.pt.

    - PPT materials from a 2003(?) Game Developers Conference Talk.

    - "Improving Performance with Custom Pool Allocators for STL," Anthony Aue, Dr.
    Dobbs Journal, September 2005.'
