    \ script, because I was unable to find or develop a simple example. gcc supports\
    \ linker scripts, and basic information about them (e.g., reference manuals) is\
    \ easy to find via Google.\n\n# Modeling an Output Device, Take 1\n\nAn int-sized\
    \ output device register can be modeled as a ControlReg object bundled with the\
