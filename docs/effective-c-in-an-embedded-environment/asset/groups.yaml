- md: "\n# C++ Implementation Summary\n\n- C++ designed to be competitive with C in\
    \ size and speed\n- Compiler-generated data structures generally better than hand-coded\
    \ C equivalents\n- You generally don't pay for what you don't use\n- C++ is successfully\
    \ used in many embedded systems, e.g.:\n  - Mobile devices (e.g., cell phones,\
    \ PDAs)\n  - Air- and Spacecraft\n  - Medical devices\n  - Video game consoles\n\
    \  - Networking/telecom hardware (e.g., routers, switches, etc.)\n  - Shipping\
    \ navigations systems\n\n# Overview\n\nDay 1 (Approximate):\n\n- \"C++\" and \"\
    Embedded Systems\"\n- A Deeper Look at C++\n- Implementing language features\n\
    - Understanding inlining\n- Avoiding code bloat\n- 3 Approaches to Interface-Based\
    \ Programming\n- Dynamic Memory Management\n- C++ and ROMability\n\n# The Pros\
    \ and Cons of Inlining\n\nAdvantages of inlining:\n\n- Function call overhead\
    \ is eliminated:\n  - For very small functions, overall code size may shrink;\n\
    \  - Essential for decent performance in layered systems\n- Allows modular source\
    \ code with branch-free object code.\n  - Function calls in source code yield\
    \ straight-line object code.\n- Often allows for better object code optimization\
    \ by compilers:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_47_0.png)\n\nThe lines\
    \ in the diagram represent intermediate code generated by the compiler. Black\
    \ lines are not function calls, red lines are. The two red lines on the left expand\
    \ into the black lines on the right if the calls represented by the red lines\
    \ are inlined.\n\n# The Pros and Cons of Inlining\n\nDisadvantages:\n\n- Debuggers\
    \ can't cope:\n  - How do you set a breakpoint in a function that doesn't exist?\n\
    - Overall system code size typically increases.\n  - This can decrease cache hit\
    \ rate or increase paging.\n- Constrains binary compatibility for upgrade releases.\n\
    \n# The Pros and Cons of Inlining\n\n- Some “small” functions may result in a\
    \ lot of code being generated:\n- Overhead to support EH may be significant\n\
    - Constructors may set vptrs, call base class constructors, etc.\n\n```cpp\nclass\
    \ Base {\n  T1 x, y;\n  ...\n};\nclass Derived: public Base {\n  T2 z;\n  public:\n\
    \  Derived(){\n    1. If on heap, call operator new\n    2. Call Base::Base\n\
    \    3. Make vptr point to Derived vbtl\n    4. Call constructor for z\n  }\n\
    }\n```\n\n# The Pros and Cons of Inlining\n\ninline is only a request — compilers\
    \ are free to ignore it:\n\n- Compilers rarely inline virtual function calls:\n\
    \  - Inlining occurs at build-time, but virtuals are resolved at runtime.\n- Optimizations\
    \ are sometimes possible:\n  - Virtuals invoked on objects (not pointers or references)\n\
    \  - Explicitly qualified calls (e.g., ClassName::virtualFunctionName()).\n\n\
    - Compilers often ignore inline for “complex” functions, e.g., those containing\
    \ loops\n\n- Compilers must ignore inline when they need a pointer to the function,\
    \ e.g., constructors and destructors for arrays of objects\n\n# Automatic Inlining\n\
    \nCompilers may inline functions not declared inline, but this is uncommon.\n\n\
    - To inline a function, compilers need its definition, but non-inline functions\
    \ are not defined in header files.\n- They’d create duplicate symbol errors during\
    \ linking:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_51_0.png)\n\n- Non-inline\
    \ functions are thus declared in headers, not defined there.\n- The rules for\
    \ function templates are a bit different...\n\nCode in red is function definitions,\
    \ code in black is function calls.\n\n# Automatic Inlining\n\nCompilers rarely\
    \ inline functions only declared in headers.\n\n- They need to know the function\
    \ body to inline it.\n- When they do know it, inlining is easy (and common).\n\
    - E.g., in the .cpp file defining the function:\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_52_0.png)\n\
    \nCode in red is function definitions, code in magenta is function declarations\
    \ (or in an object file, references to external symbols), code in black is un-lined\
    \ function calls, code in blue is inlined function calls.\n\n# Link-Time Inlining\n\
    \nLinkers may also perform inlining:\n\n- Many already do (with appropriate options\
    \ enabled)\n  - E.g., Microsoft, Gnu, Intel, Sun.\n\nStill, manual inline declarations\
    \ remain a necessary evil.\n\nOptions that enable link-time inlining are typically\
    \ named whole program optimization (WPO) or link-time optimization (LTO).\n\n\
    Link-time optimization became available in gcc as of version 4.5.\n\n# The Pros\
    \ and Cons of Inlining\n\nBottom line:\n\n- Inlining is almost always a good bet\
    \ for small, frequently called functions.\n- Overall runtime speed is likely to\
    \ increase.\n- Imprudent inlining can lead to code bloat.\n- Minimize inlining\
    \ if binary upgradeability is important.\n\n# Overview\n\nDay 1 (Approximate):\n\
    \n- \"C++\" and \"Embedded Systems\"\n- A Deeper Look at C++\n- Implementing language\
    \ features\n- Understanding inlining\n- Avoiding code bloat\n- 3 Approaches to\
    \ Interface-Based Programming\n- Dynamic Memory Management\n- C++ and ROMability\n\
    \n# Code Bloat in C++\n\nC++ has a few features you pay for (in code size and/or\
    \ runtime speed), even if you don't use them:\n\n- Support for exceptions.\n-\
    \ Support for generalized customizable iostreams.\n  ie., streams of other than\
    \ char or wchar_t.\n\nThese things may reasonably be considered bloat.\n\nPossible\
    \ workarounds:\n\n- Disable exceptions during compilation.\n  - Practical only\
    \ if you know that no code (including libraries, plug-ins, etc.) throws.\n- Use-io\
    \ instead of iostreams.\n\n# Code Bloat in C++\n\nHowever, most bloat accusations\
    \ are unfair, traceable to either:\n\n- Comparing functionality in C++ with lesser\
    \ functionality in C:\n- C++ virtual functions do more than C.\n- Improper use\
    \ of the language:\n- E.g., Putting inessential code in headers.\n\nThe feature\
    \ associated with bloat is templates.\n\n- That's what I'll focus on.\n- Most\
    \ problems with “template bloat” arise from:\n- Misunderstandings of template.\n\
    - Improper use of templates.\n\n# Templates, Header Files, and Inlining\n\nConsider:\n\
    \n```cpp\ntemplate<typename T>\nclass SomeClass {\npublic:\n    SomeClass() {\
    \ ... }\n    void mf1() { ... }\n    void mf2();\n    ...\n};\n```\n\n```cpp\n\
    template<typename T>\nvoid SomeClass<T>::mf2() { ... }\n```\n\nTemplates need\
    \ not to be defined in headers:\n\n```cpp\ntemplate<typename T>\nclass SomeClass\
    \ {\npublic:\n    SomeClass() { ... }\n    void mf1() { ... }\n    void mf2();\n\
    \    ...\n};\n```\n\nCode using this header will compile fine.\n\n- But if SomeClass::mf2\
    \ is called, it won't link.\n- We'll cover how to fix that in a moment.\n- Templates\
    \ are typically defined in headers to avoid such problems.\n\n# Templates, Header\
    \ Files, and Inlining\n\nThe convention of putting all template code in headers\
    \ has an advantage:\n\n- Single point of change for client-visible code, e.g.,\
    \ function declarations.\n- No need to change both header and implementation files.\n\
    \nAnd some disadvantages:\n\n- Increased compilation times.\n- Increased compilation\
    \ dependencies for clients.\n\n# Instantiating Templates\n\nTemplates that aren't\
    \ used aren't instantiated.\n\n- They generate no code and no data.\n- But the\
    \ need to read template headers usually slows compilation.\n\n- Templates can\
    \ thus generate less code than non-templates!\n```cpp\nclass C {\n  public:\n\
    \    void f1();\n    ...\n    void fn();\n};\n// Even if C is never used, object\
    \ files\n// typically contain f1..fn. Few lingers\n// will remove all code and\
    \ data related\n// to uncalled functions.\n\ntemplate-typename T>\nclass C {\n\
    \  public:\n    void f1();\n    ...\n    void fn();\n};\n// Object files should\
    \ contain only those\n// functions that are called.\n```\n- Templates can thus\
    \ help avoid linking dead code into executables.\n\nSafety-critical systems often\
    \ require the elimination of dead code, so the fact that templates can avoid generating\
    \ it in the first place is attractive to people developing such systems.\n"
  mdcn: "\n\n# C++ 实现总结\n\n- C++ 的设计目标是在代码大小和运行速度上与 C 语言竞争\n- 编译器生成的数据结构通常比手编写的 C\
    \ 语言对应更好\n- 你通常不需要为未使用的功能付出代价\n- C++ 已成功应用于许多嵌入式系统，例如：\n  - 移动设备（如手机、PDA）\n  -\
    \ 航空器与航天器\n  - 医疗设备\n  - 视频游戏主机\n  - 网络/电信硬件（如路由器、交换机等）\n  - 船舶航行导航系统\n\n# 概述\n\
    \n第一天（大致安排）：\n\n- “C++”与“嵌入式系统”\n- 深入探讨 C++\n- 语言特性的实现\n- 理解内联（inlining）\n- 避免代码膨胀\n\
    - 基于接口的编程的 3 种方法\n- 动态内存管理\n- C++ 与 ROM 可读性（ROMability）\n\n# 内联的优与缺点\n\n内联的优点：\n\
    \n- 消除了函数调用开销：\n  - 对于非常小的函数，整体代码 own可能会缩小；\n  - 对于分层系统中的良好性能至关重要\n- 允许生成无分支的模块化目标代码。\n\
    \  - 源代码中的函数调用会产生直线型目标代码。\n- 通常通常允许编译器进行更好的目标代码优化：\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_47_0.png)\n\
    \n图中的线条表示编译器生成的中间代码。黑线不是函数调用，红线是。如果红线所代表的调用被内联，则左侧的两条红线将展开为右侧的几条黑线。\n\n# 内联的优与缺点\n\
    \n缺点：\n\n- 调试器无法处理：\n  - 你如何在一个不存在的函数中设置断点？\n- 整个系统代码大小通常会增加。\n  - 这可能会降低缓存命中率或增加分页开销。\n\
    - 限制了升级发布时的二进制兼容性。\n\n# 内联的优与缺点\n\n- 某些“小”函数可能会导致大量代码生成：\n- 支持异常处理（EH）的开销可能很大\n\
    - 构造函数可能会设置虚函数指针（vptrs）、调用基类构造函数等。\n\n```cpp\nclass Base {\n  T1 x, y;\n  ...\n\
    };\nclass Derived: public Base {\n  T2 z;\n  public:\n  Derived(){\n    1. 如果在堆上，调用\
    \ operator new\n    2. 调用 Base::Base\n    3. 使 vptr 指向 Derived vbtl\n    4. 调用\
    \ z 的构造函数\n  }\n}\n```\n\n# 内联的优与缺点\n\n`inline` 只是一个请求——编译器可以忽略它：\n\n- 编译器很少内联虚函数调用：\n\
    \  - 内联发生在编译时，但虚函数是在运行时解析的。\n- 有时可以进行优化：\n  - 在对象（而非指针或引用）上调用的虚函数\n  - 显式限定调用（例如\
    \ `ClassName::virtualFunctionName()`）。\n\n- 编译器经常忽略“复杂”函数的 `inline`，例如包含循环的函数\n\
    \n- 当编译器需要函数指针时，必须忽略 `inline`，例如对象数组的构造函数和析构函数\n\n# 自动内联\n\n编译器可能会内联未声明为 `inline`\
    \ 的函数，但这种情况并不常见。\n\n- 为了内联一个函数，编译器需要其定义，但非 `inline` 函数没有在头文件中定义。\n- 它们会在链接期间产生重复符号错误：\n\
    \n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_51_0.png)\n\n- 因此，非 `inline` 函数在头文件中声明，而不是在其中定义。\n\
    - 函数模板的规则略有不同……\n\n红色的代码是函数定义，黑色代码是函数调用。\n\n# 自动内联\n\n编译器很少内联仅在头文件中声明的函数。\n\n\
    - 编译器需要函数体才能进行内联。\n- 当它们知道函数体时，内联是可能的。\n  - 例如，在头文件中定义。\n\n![](img/4884d44c5f6ddb1d5cbeb52e60fc5de7_51_0.png)\n\
    \n红色的代码是函数定义，黑色的代码是函数调用。\n\n# 自动内联\n\n编译器很少内联仅在头文件中声明的函数。\n\n- 编译器需要函数体才能进行内联。\n\
    - 当它们知道函数体时，内联是可能的。\n  - 例如，在头文件中定义。\n\n# 链接时内联\n\n链接器可能会执行内联：\n\n- 即使函数没有声明为\
    \ `inline`。\n- 许多内联是可见的。\n\n# 链接时内联\n\n链接器可能会执行内联：\n\n- 即使函数没有声明为 `inline`。\n\
    - 许多内联是可见的。\n\n# 总结\n\n内联是一把双刃剑：\n\n- 如果内联会导致代码膨胀。\n- 即使函数没有声明为 `inline`。\n\n\
    # 总结\n\n内联是一把刃刃剑：\n\n- 如果内联会导致代码膨胀。\n- 即使函数没有声明为 `inline`。\n\n# 总结\n\n内联是一把刃的：\n\
    \n- 如果内联会导致代码膨胀。\n- 即使函数没有声明为 `inline`。\n\n"
