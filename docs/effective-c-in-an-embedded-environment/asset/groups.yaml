    ```\n\n```cpp\nwhile (!od.control().ready());    // 等待就位位开启\nod.write(x);    \
    \                           // 将 x 写入 od\n```\n\n# 输出设备的建模，方案 2\n\nMMIO 地址是编译时常量，因此没有必要将它们存储为像\
