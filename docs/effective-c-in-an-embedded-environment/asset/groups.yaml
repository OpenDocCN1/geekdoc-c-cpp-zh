  - "[PAGE 74]\n\n# Dealing with Function Templates\n\nWe've discussed only class\
    \ templates, but bloat elimination techniques for\nfunction templates are similar:\n\
    \n```\ntemplate<typename T>\nvoid doSomething(const T& obj)\n{\n    ...\n    ...\n\
    }\n// template leading to bloat\n// code making use of T or obj\n// code independent\
    \ of T or obj\n// code making use of T or obj\n```\n\nA “hoisting” alternative:\n\
    \n```\nvoid doSomethingHelper();\ntemplate<typename T>\nvoid doSomething(const\
    \ T& obj)\n{\n    ...\n    doSomethingHelper();\n    ...\n}\n// \"hoisted\" code\
    \ in non-template\n// function; not inline\n// revised template avoiding bloat\n\
    // code making use of T or obj\n// code making use of T or obj\n```"
  - "[PAGE 75]\n\n# Data Bloat\n\nNot all bloat is due to code. Unnecessary classes\
    \ can yield data bloat, to:\n\n+   - Some classes have a vtbl\n\nAn important\
    \ exception to these issues are class templates that:\n\n+   - Contain only inline\
    \ functions.\n  - Hence no extra EH tables.\n- Contain no virtual functions.\n\
    \  - Hence no extra vbtls.\n\nWe'll see examples of such “bloat-free” templates\
