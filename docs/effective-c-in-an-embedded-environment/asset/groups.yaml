    \ Errors\n\nTo prevent such errors, consider declaring the destructor private:\n\
    \n```cpp\nclass OutputDevice3 {   // class modeling hardware\n    ...        \
    \                         // directly; prevents some\n    private:\n    ~OutputDevice3()\
    \ {}               // kinds of client errors\n    ControlReg cr;\n    volatile\
    \ unsigned data;\n};\n\nOutputDevice3 d;                   // error! implicit\
    \ destructor\n                                     // invocation. (We want to\n\
    \                                     // prevent MMIO objects from\n         \
    \                            // being placed on the stack).\n\nOutputDevice3*\
    \ pd = new (reinterpret_cast<void*>(0xFFFF0000)) OutputDevice3; // fine\n\ndelete\
    \ pd;                          // error! another implicit\n                  \
    \                   // destructor invocation\n```\n\n# Preventing Likely Client\
    \ Errors\n\nBut if the destructor has to work to do, clients must manually invoke\
    \ it.\n\n- This suggests that these classes need a public destructor:\n```cpp\n\
    class OutputDevice3 {\npublic:\n~OutputDevice3();\n...\n};\nOutputDevice3* pd\
    \ = new (reinterpret_cast<void*>(0xFFFF0000)) OutputDevice3;\n...\npd->~OutputDevice3();\n\
    ```\n\nBut we just decided that public destructors might lead to client errors...\n\
    \n# Preventing Likely Client Errors\n\nThe proverbial additional level of indirection\
    \ lets you have your cake and\neat it, too:\n\n```cpp\nclass OutputDevice3 {\n\
    public:\n    void destroy() { this->~OutputDevice3(); } // \"this->\" is required\
    \ for\n... // a correct parse\nprivate:\n    ~OutputDevice3() { ... }\n};\n\n\
    OutputDevice3 d; // still an error\nOutputDevice3* pd = // still\n    new (reinterpret_cast<void*>(0xFFFF0000))\
    \ OutputDevice3; // fine\n...\ndelete pd; // still an error\npd->~OutputDevice3();\
    \ // error!\npd->destroy(); // fine\n```\n\n# Preventing Likely Client Errors\n\
    \nClients can still put MMIO at invalid addresses, but we can prevent\nthat, too.\
    \ One way:\n\n```cpp\nclass InDevCtrlRegAddr { ... }; // classes representing\n\
    class OutDevCtrlRegAddr { ... }; // valid MMIO addresses\n...\nconst OutDevCtrlRegAddr\
    \ ODCRA1(0xFFFF0000); // an object for each\n...\nclass OutputDevice {\npublic:\n\
    \    static void* operator new(std::size_t, // op. new taking\n              \
    \             OutDevCtrlRegAddr); // only MMIO objs\n};\n```\n\nThis can also\
    \ eliminate the need for clients to reinterpret_casts when\ncreating objects.\n\
    \n- But there must be a way to get a void* from an OutDevCtrlRegAddr\nobject.\n\
    \n# Preventing Likely Client Errors\n\nBecause class-specific operator news hide\
    \ all other operator news, this also prevents the creation of MMIO objects on\
    \ the heap!\n\n```cpp\nOutputDevice& od = *new OutputDevice(params); // error!\
    \ requires an\n// OutDevCtrlRegAddr\n// object\n```\n\nBasis:\n\n- A name in an\
    \ inner scope hides that name in an outer scope.\n- Derived class scopes are nested\
    \ inside base class and global scopes.\n\n| int x; | Standard Global scope |\n\
    |---|---|\n| | operator new declarations | |\n| | Class-specific operator new\
    \ declarations | Class scope |\n| | Derived class-specific operator new declarations\
    \ | Derived class scope |\n\nScott Meyers, Software Development Consultant http://www.aristelia.com/\
    \ 2012 Scott Meyers, all rights reserved. Slide 168\n\nThe boxed code snippet\
    \ (with two declarations for x) points to a depiction of the nested scopes that\
    \ explain why the inner x hides the outer x. The nested scopes to the right correspond\
    \ to how derived class operator news hide any other operator new declarations\
    \ at base class or global scope.\n\nScott Meyers, Software Development Consultant\
    \ 2012 Scott Meyers, all rights reserved.\n\n# Preventing Likely Client Errors\n\
    \nDetails of this approach are left as an exercise, but:\n\n- A fundamental design\
    \ goal is that design violations should not compile.\n\n# Generalizing via Templates\n\
    \nDevices are likely to vary in several ways:\n\n- Number of bits in each register.\n\
    - Which bits correspond to ready and interrupt status, etc.\n\nTemplates make\
    \ it easy to handle such variability:\n\n```cpp\ntemplate<typename RegType,\n\
    \             RegType ReadyBitMask,\n             RegType InterruptBitMask>\n\
    class ControlReg {\npublic:\n    bool ready() const { return regValue & ReadyBitMask;\
    \ }\n    bool interruptsEnabled() const { return regValue & InterruptBitMask;\
    \ }\n    void enableInterrupts() { regValue |= InterruptBitMask; }\n    void disableInterrupts()\
    \ { regValue &= ~InterruptBitMask; }\nprivate:\n    volatile RegType regValue;\n\
    };\n```\n\n# Generalizing via Templates\n\n```cpp\n// CRui03 is a control register\
    \ the size of an unsigned int where\n// 0 is the ready bit and 3 is the interrupt\
    \ bit\ntypedef ControlReg<unsigned int, 0, 3> CRui03;\nCRui03& cr1 = new (reinterpret_cast<void*>(0xFFFF0000))\
    \ CRui03;\n// use cr1\n\n// CRuc15 is a control register the size of an unsigned\
    \ char where\n// 1 is the ready bit and 5 is the interrupt bit\ntypedef ControlReg<unsigned\
    \ char, 1, 5> CRuc15;\nCRuc15& cr2 = new (reinterpret_cast<void*>(0xFFFF0010))\
    \ CRuc15;\n// use cr2\n```\n\n# Summary: Memory-Mapped IO\n\nC++ tools you'll\
    \ probably want to use:\n\n* Classes\n* Class templates (with type and non-type\
