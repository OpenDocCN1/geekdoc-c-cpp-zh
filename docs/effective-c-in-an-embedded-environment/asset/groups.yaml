- md: "\n## C++ and ROM\n\nC++98 POD types have limited encapsulation. A wrapper can\
    \ often help:\n\n```cpp\nclass Widget { // non-POD in C++98\n    int x, y;   \
    \            // (has private data)\n};\nconst Widget w = { 0, 0 };     // illegal\
    \ - w isn't an aggregate\n\nstruct Widget { // POD (and an aggregate)\n    int\
    \ x, y;\n};\nconst Widget w = { 0, 0 };     // typically will be ROMed\n\nclass\
    \ WidgetWrapper { // POD\n    struct Widget { int x, y; }; // ROMable\n    static\
    \ const Widget w;\n};\nconst WidgetWrapper::w = { 0, 0 };     // typically will\
    \ be ROMed\n```\n\nFor details, consult Henry's 1998 Embedded Systems Programming\
    \ article.\n\nIn C++11, class Widget is a POD, but it's still not an aggregate,\
    \ nor can it be brace-initialized without adding a constructor taking a std::initializer_list\
    \ parameter.\n\n## C++ and ROM\n\nSome compiler generated data structures can\
    \ usually be ROMed:\n\n- Virtual function tables\n- RTTI tables and type_info\
    \ objects\n- Tables supporting exception handling\n\nROMing these objects may\
    \ be impossible if they are dynamically linked from shared libraries.\n\n## C++\
    \ and ROM\n\nWhat's not ROMable? Objects that may be modified at runtime.\n\n\
    - Objects with nontrivial constructors or destructors.\n```cpp\nclass Widget {\n\
    public:\n    Widget(); // Widget objects won't be ROMable\n    ...\n};\n```\n\
    - Objects with mutable members.\n```cpp\nclass Widget {\n    mutable int lastValue;\
    \ // Widget objects won't be ROMable\n    ...\n};\n```\n- Objects not defined\
    \ to const.\n```cpp\nint x = 14; // x isn't const, hence not ROMable\nstd::string\
    \ s = \"xyzy\"; // s isn't const, hence not ROMable\n```\n- Of course, 14 and\
    \ \"xyzy\" can still be ROMable.\n\n## Summary: C++ and ROM\n\n- Most compilers/linkers\
    \ are willing to ROM statically initialized POD types.\n- Aggressive build chains\
    \ may go beyond this.\n- ROMable PODs can be encapsulated by making them protected\
    \ private in a non-POD type.\n- Compiler-generated data structures are typically\
    \ ROMable.\n\n## Overview\n\nDay 2 (Approximate):\n\n- Modeling Memory-Mapped\
    \ IO\n- Implementing Callbacks from C APIs\n- Interesting Template Applications:\n\
    \  - Type-safe void*-based containers\n  - Compile-time dimensional unit analysis\n\
    \  - Specifying FMSs\n- Considerations for Safety-Critical and Real-Time Systems\n\
    - Further Information\n\n## Modeling Memory-Mapped IO\n\nMany systems map IO devices\
    \ to fixed parts of a program’s address space.\n\n- Input registers are often\
    \ separate from output registers.\n- Control/status registers are often separate\
    \ from data registers.\n- Different status register bits convey information such\
    \ as readiness or whether device interrupts are enabled.\n\nC++ makes it easy\
    \ to make memory-mapped IO devices look like objects with natural interfaces.\n\
    \n- At zero cost.\n- Provided you have a decent compiler :-\n\n## Modeling Memory-Mapped\
    \ IO\n\nMemory-mapped devices may require special handling, e.g.,\n\n- Atomic\
    \ reads/writes may require explicit synchronization.\n- Individual bits may sometimes\
    \ be read-only, other times write-only.\n- Clearing a bit may require assigning\
    \ a 1 to it.\n- One status register may control more than one data register.\n\
    \  - E.g., bits 0-3 are for one data register, bits 4-7 for another.\n\nWhat follows\
    \ is a framework for modeling memory-mapped IO, not a prescription.\n\n- The framework\
    \ tells you where to put whatever special handling your devices require.\n\n##\
    \ Modeling a Control Register\n\nSuppose we have a four-byte control register\
    \ such that:\n\n- Bit 0 indicates readiness: 1 ⇒ ready, 0 ⇒ not ready.\n- Bit\
    \ 2 indicates whether interrupts are enabled: 1 ⇒ enabled, 0 ⇒ not.\n\nAssuming\
    \ an int is four bytes in size, we can model the register like this:\n\n```cpp\n\
    enum { bit0 = 0x1, bit1 = 0x2, ..., bit31 = 0x80000000 };\nclass ControlReg {\n\
    public:\n    bool ready() const { return regValue & bit0; }\n    bool interruptsEnabled()\
    \ const { return regValue & bit2; }\n    void enableInterrupts() { regValue |=\
    \ bit2; }\n    void disableInterrupts() { regValue &= ~bit2; }\nprivate:\n   \
    \ volatile unsigned regValue; // data in the register may change\n}; // outside\
    \ program control\n```\n\nAll functions are inline, so their existence incur no\
    \ cost.\n\n- Assuming they are actually inlined.\n\nSome Int-like tools will complain\
    \ about the implementations of ready and interruptsEnabled, because they return\
    \ the result of operation as bools. To quiet these tools, it can be preferable\
    \ to write them more like:\n\n```cpp\nbool ready() const { return (regValue &\
    \ bit0) == true; }\n```\n\nenableInterrupts and disableInterrupts use read/modify/write\
    \ instructions, so they may be subject to race conditions in multithreaded systems.\n\
    \n## Modeling a Control Register\n\nNotes:\n\n- In this example, we assume that\
    \ an unsigned int has the proper size and alignment for the register:\n- If it\
    \ doesn't, you'll need to choose a data type that does.\n- The header <stdint.h>\
    \ (offering e.g., uint32_t) can be helpful.\n- Standard in C99 and C++11.\n\n\
    - We also assume that the register is both readable and writable.\n- If it's write-only,\
    \ you'll need to cache the most recently written value.\n\nIn theory, you could\
    \ use std::aligned_storage (or std::tr1::aligned_storage) to solve the alignment\
    \ problem, but then you'd have to worry that the total amount of underlying storage\
    \ might be larger than the register you are modeling. For this kind of application,\
    \ it seems to me that you want more precise control over the amount of storage\
    \ allocated that std::aligned_storage gives you.\n\nCaching the most recently\
    \ written value is tricky, because adding a data member to the class is unacceptable.\
    \ One possible approach is to have an external data structure indexed by MMIO\
    \ address (e.g., a map) that holds auxiliary device information, e.g., the most\
    \ recently written value. The cached value would then be accessed as something\
    \ like auxiliaryData[this].\n\n## Masks vs. Bitfields\n\n- The design deliberately\
    \ uses manual masking instead of bitfields.\n- Compilers do not map bitfields\
    \ in the “obvious” fashion:\n\n```cpp\nclass ControlReg {\npublic:\n    bool ready()\
    \ const { return readyBit; } // suspect design\n    ...\nprivate:\n    volatile\
