- pgno: 233
  md: '# Summary


    Information can be shared between agents either directly, using events, or indirectly
    using objects in the cache. If the cache is used, inference and process agents
    must explicitly retrieve the information from the cache. This retrieval must be
    triggered by an event and that event must contain sufficient information to identify
    the object(s) that must be retrieved.


    When multiple agents are sharing information in the cache, locking must be used
    to ensure data integrity. Locks are logical: What is locked is an identifier that
    corresponds to the object being locked, typically the object’s extID. Local locks
    can be used if the design ensures that the object being locked can only be present
    in the local agent; otherwise, global locks must be used.


    One mechanism for ensuring that objects are only present in a single agent is
    to distribute load in such a way that all the work involving a given object is
    always sent to the same agent. Content-aware load distribution can be used for
    this purpose.


    In some situations it may be important to process events in the order in which
    they are received. Within an inference agent, this can be accomplished by using
    a JMS queue and the Caller’s Thread to process the event. This makes the agent
    single-threaded with respect to that queue. When multiple agents are involved,
    content-aware load distribution must also be employed.


    The use of JMS queues can result in the duplicate delivery of events when agents
    are shut down unexpectedly. Duplicate delivery can be detected by adding a JMSRedelivery
    property to the event. If there are non-idempotent activities being performed,
    logic must be added in the event of redelivery to determine whether the activity
    was previously completed and to take appropriate alternate actions.'
  merge: -1
  img_proc: true
