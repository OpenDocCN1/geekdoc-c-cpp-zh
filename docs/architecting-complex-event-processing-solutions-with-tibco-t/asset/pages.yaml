    The Decision-as-a-Service pattern is useful when the business rules change frequently
    but the data used to drive the decision and the outputs of the decision can be
    fixed.


    # Orchestrated Response


    While process orchestration is not a traditional focus of complex-event processing,
    the need to orchestrate portions of CEP solution activity is increasing in importance
    (Figure 3-14). In this relatively common'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_75_0.png)


    # Figure 3-14: Response Orchestration Pattern


    pattern, process orchestration is used to coordinate multiple participants in
    responding to a situation. The reason for the orchestration is twofold: to control
    the order in which the actions are performed and to confirm the successful completion
    of the actions. Less common is a situation in which process coordination is required
    for situation recognition.


    This pattern is a hybrid of event-driven and request-driven interactions. All
    of the interactions up to the receipt of the situation recognition announcement
    are event driven. The response orchestration component, however, uses request-driven
    interactions to not only request that each participant perform its work but also
    to confirm the successful completion of that work.


    When this pattern is used, a choice must be made regarding the type of technology
    to be used for the response orchestration. Traditionally, this would be a component
    designed specifically for process orchestration, such as TIBCO ActiveMatrix BusinessWorks™
    or TIBCO ActiveMatrix® BPM. With this approach, if rule-based reasoning is required
    in the orchestration, the Decision-as-a-Service pattern is used. The service returns
    values that then guide the subsequent process execution.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'However, separating process orchestration from complex-event processing may
    become a performance barrier, particularly if a significant amount of repetitive
    information must be passed to the decision service on each invocation. In such
    cases, it is better to have the process orchestration performed directly by a
    CEP component. This is the purpose of the TIBCO BusinessEvents® Process Orchestration
    product. It adds process orchestration capabilities to TIBCO BusinessEvents®.


    # Pioneering Solutions


    We close this chapter on a cautionary note. Early explorers drew maps of the territories
    they became familiar with and drew dragons in the unexplored corners of these
    maps, warning those later map readers to beware of those unexplored spaces. Even
    worse, many explorers never even reached their goals: Columbus was seeking Asia
    when he found the Americas, and numerous explorers sought unsuccessfully for the
    Northwest Passage that would provide a North American route from the Atlantic
    to the Pacific.


    The relevance here is that there are many types of applications for complex-event
    processing that have been well explored. If you are working in one of these areas,
    the problem is well defined, and implementing your solution will be a straightforward
    engineering exercise. If, however, you are working in an area that is not well
    defined, one in which the analytical approach for either situation recognition
    or action determination has not yet been established, proceed with caution. Some
    (but not all) of these areas are true research topics—you need to invest a little
    time in determining whether or not your particular problem is well defined before
    you commit to building a solution. Remember, it took more than 400 years to find
    the Northwest Passage!


    How can you tell when you are on safe ground? Ask yourself the following questions:


    +   - Is the information related to the problem understood well enough to create
    a quality information model (including relevant state information)?

    +   - Is there a well-defined (i.e., measurable) set of criteria that defines
    the situation that needs to be recognized?

    +   - Are there well-defined triggers that identify the points in time at which
    the situation recognition analysis will be performed?'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - Is the information necessary for this recognition analysis readily accessible?

    +   - Is there a clearly articulated approach for using the available information
    to recognize the situation?

    +   - Is there a well-defined (i.e., measurable) approach for responding to the
    situation once it has been recognized?

    +   - Is the reference information needed for determining the response readily
    accessible?

    +   - Does the business value of the resulting situation recognition and response
    capabilities warrant the investment in the solution?


    If you answered yes to all of these questions, you are on solid ground. If you
    answered no to any of them, you may be plowing new ground. You need to eliminate
    this uncertainty before you commit to producing a solution. Focus your initial
    efforts on developing the answers to these questions, with particular attention
    to the last one: Is the result worth the effort? Then, and only then, should you
    commit to building a solution.


    The riskiest question in the list is the first: What is it that you are trying
    to recognize? Define your goals based on solid analytical results and beware of
    open-ended criteria. For example, you are never going to recognize all forms of
    financial fraud: The bad guys are constantly inventing new ways to scam the financial
    system and circumvent the checks currently in place. Identifying fraud, in general,
    is not an achievable goal.


    On the other hand, there are specific behavior patterns that fairly reliably indicate
    that there might be fraud in progress. An analysis of login patterns might identify
    these behavior patterns, and the recognition of these patterns as they occur is
    definitely a well-defined and measurable goal.


    If you find yourself waving your hands as you attempt to get specific about defining
    your recognition goals—stop! You are treading on thin ice. Do your analytical
    homework and convince yourself that you can be precise about what is to be recognized.


    # Summary


    There are two factors that contribute to the variability in complex-event processing
    architectures. One is the handling of reference data and the extent to which the
    stream of events modifies the reference data used to'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'interpret subsequent events. The other is the myriad ways in which the necessary
    sense, analyze, and respond activities can be partitioned and assigned to components.
    There is no one-size-fits-all architecture for complex event processing.


    The simplest architectures are those in which the reference data is not impacted
    by the stream of events. The Threshold Detection and Condition Detection patterns
    are examples of these.


    When the event stream can alter the reference data, the architecture gets a bit
    more complicated. The reference data now contains some historical information.
    If this information is essential for analysis, the solution must now become a
    system of record for this information. This requires persisting the information.


    The Situation Recognition pattern uses historical data in its analysis. Some of
    the events that simply result in updates to the historical data. Others, when
    analyzed, signify the recognition of a business-significant condition that must
    be announced. Track-and-Trace is a specialization of this pattern that does milestone-level
    tracking of a process. The Business Process Timeliness Monitor extends Track-and-Trace
    to determine whether the milestones are achieved on time.


    Some applications require more than simply announcing that a condition exists.
    The Situational Response pattern applies contextual analysis to determine the
    actions that are required in a specific situation. The Decision-as-a-Service pattern
    makes these analytical capabilities available to non-CEP components. Sometimes
    the requirement extends beyond simply identifying the required actions to include
    the management of their execution. The result is the Orchestrated Response pattern.


    Building a solution in which the situations to be recognized, the desired responses,
    and the analytical techniques to be used are all well defined is a straightforward
    (though sometimes complex) engineering exercise. Building a solution when any
    of these is not well defined has a significant degree of uncertainty. In these
    situations, before a commitment is made to produce a solution, preliminary work
    should be undertaken to clarify the approach to recognition and response. Once
    this preliminary work has been completed, an estimate of the effort required to
    implement the solution should be made to ensure that it is warranted by the expected
    business benefit.'
  merge: -1
  img_proc: true
