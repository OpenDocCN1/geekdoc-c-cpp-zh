- pgno: 177
  md: '# Continuous Query Change Recognition Pattern


    Continuous queries (Chapter 7) can also be used to recognize change (Figure 10-9).
    Cached object changes or events directed to the cache agent enter the buffer if
    they meet the query selection criteria. Changes to the contents of the buffer
    trigger the reevaluation of the query. The query’s callback function then examines
    the query results and determines whether a change notification is warranted.


    When investigating fraudulent activity on accounts it is sometimes necessary to
    be notified in real time when there is activity on the account. The notification
    serves to prompt an investigator to immediately examine the activity and perhaps
    gather sufficient information to apprehend a suspect. Figure 10-10 shows how the
    activity alert could be generated by a continuous query set up to monitor the
    account. Note that there can be a number of these queries in operation at any
    given time, each monitoring a different account.


    # Handling Duplicate Events


    When JMS is being used as the message transport, it is possible for a message
    to be delivered more than once even when a JMS queue is being used. The reason
    for this is that, by default, agents do not acknowledge message receipt until
    the work triggered by the message receipt is complete. This occurs at the end
    of the RTC cycle in an inference agent or when a checkpoint is taken in a process
    agent.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_177_0.png)


    Figure 10-9: Continuous Query Change Recognition Pattern'
  merge: -1
  img_proc: true
- pgno: 178
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Recognize that there is no magic one-size-fits-all approach to solving this
    problem. What you need to do in the design depends to a great extent on the nature
    of the activity that cannot be repeated. However, TIBCO BusinessEvents provides
    you with the ability to recognize that the message has been redelivered. The incoming
    JMS message property `JMSRedelivered` indicates that the message has been redelivered.
    However, if you want to have access to this value in your logic, you need to define
    a Boolean `JMSRedelivered` property on the event.


    The general strategy for handling message redelivery when there are non-idempotent
    activities is shown in Figure 10-11. When it appears as if a message has been
    redelivered, the first step is to investigate to determine how much of the normal
    processing was completed. With this information in hand, the required remaining
    activities can then be identified and performed.


    Of course, this is just a sketch of the approach—the devil is in the details.
    Depending upon your design, you may implement this logic in preprocessor functions,
    rule conditions, or process orchestration exclusive gateways—or a combination
    of these. Some judgment is required as well. A lot of time and effort can be devoted
    to handling these situations. Be sure you clearly understand the negative consequences
    of repeating activities and adjust your design effort to be commensurate with
    the consequences.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_179_0.png)


    **Figure 10-11:** *Handling Message Redelivery for Non-idempotent Activities*'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Enabling Run-Time Rule Changes\n\nSome business requirements change faster\
    \ than the normal IT project release cycle. Commonly these are the requirements\
    \ for business rules that govern decisions, and the reason for the frequent change\
    \ is to respond to changing market conditions. To make this possible, a mechanism\
    \ is required that allows the business rule to be changed without requiring an\
    \ IT change and subsequent deployment. Ideally, this type of change can be made\
    \ by the business user directly, without requiring IT involvement.\n\nThe TIBCO\
    \ BusinessEvents® Decision Manager extension provides two mechanisms that provide\
    \ this capability, rule templates and decision tables, along with the Rules Management\
    \ Server that administers these run-time modifications.\n\n# Rule Templates\n\n\
    A rule template is a variation of a rule that adds variables whose values can\
    \ be changed at runtime (Listing 10-1). These variables are declared in the bindings\
    \ section of the rule template. In this example, tinyThreshold and giantThreshold\
    \ have been declared as variables. Both variables have initial values, but these\
    \ values can be changed at runtime using the Rules Management Server. Thus the\
    \ threshold values for identifying potential fraud with this pattern can be changed\
    \ at runtime.\n\n# Listing 10-1: ACEPSTRuleTemplate Example\n\n```\n```\nruletemplate\
    \ Rules.FraudRuleTemplate {\n attribute {priority = 5;forwardChain = true;}\n\
    \ views{\n  bindings{\n    double tinyThreshold = 5.0;\n    double giantThreshold\
    \ = 10000.0;\n  }\n declare {\n   Events.Transaction transactionA;\n   Events.Transaction\
    \ transactionB;\n }\n when {\n   transactionB.transactionAmount <= tinyThreshold;\n\
    \   transactionA.transactionAmount >= giantThreshold;\n   transactionA.accountNumber\
    \ == transactionB.accountNumber;\n   transactionA.transactionDateTime > transactionB.\n\
    ```\n```"
