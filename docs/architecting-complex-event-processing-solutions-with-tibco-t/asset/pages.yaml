    Figure 6-8: Selecting Shared-All Options


    performs the database update. If the box is not checked, the cache agent performs
    the update. This is referred to as “Write Behind.” Note that the Cache-Aside option
    is not available for the Berkeley DB.


    # Cache-Aside Behavior


    With Cache-Aside, the inference agent performs the database update. This activity
    is performed in the postprocessing after the RTC cycle has completed. The details
    of this update are described in Chapter 5.


    A key parameter driving this update is the `Agent.<agentName>.enableParallelOps`
    property in the CDD file for the agent that will be performing the update. Figure
    5-22 shows the behavior when this property is set to `false`, and Figure 5-23
    shows the behavior when the property is set to true.


    When Cache-Aside is selected, database operations may be batched together and
    executed as a single transaction for efficiency. With `enableParallelOps = false`,
    all database updates occur before any cache updates.


    # Write-Behind Behavior


    If the Cache Aside box is not checked, the result is Write-Behind behavior (Figure
    6-9). In this mode, the inference agent updates the cache, and the cache agent,
    in turn, updates the database. In this mode, each individual cache object update
    results in a separate database transaction.'
