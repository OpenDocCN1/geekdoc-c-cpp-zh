    # Preprocessing Behavior


    The default preprocessing behavior is shown in Figure 5-21. An external event
    source generates a message, which is received by the channel and processed by
    the channel thread. The channel thread creates the event from the incoming message
    and places it on a shared queue.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_117_0.png)


    Actions that assert events and concepts into working memory do not take effect
    until this thread runs the RTC.


    Locking occurs if RTC is configured for single-threaded operation.


    Figure 5-21: Default Preprocessing Behavior'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The type of channel determines how many channel threads there are. For JMS,
    there is one. For HTTP, there is a pool of channel threads. You should consult
    the product manuals for details on the threads associated with each channel type.


    Each destination designates the pool of threads that are used for preprocessing.
    There are three possibilities:


    +   1. Shared Queue: This is the default. The event is placed in a queue shared
    by all destinations in this agent. There is a shared pool of threads for executing
    the preprocessor activities, and events wait in the shared queue until one of
    the threads from this pool becomes available.

    +   2. Destination Queue: The event is placed in a queue specific to this destination.
    There is a pool of threads dedicated to this destination, and the event waits
    in the destination queue until one of these threads becomes available.

    +   3. Caller Thread: There is no queue for this alternative. The channel thread
    (the one that created the event) immediately performs the preprocessor activities.


    When a thread becomes available, if a preprocessor function has been associated
    with the event for this destination, it executes the function.


    If the Concurrent RTC box in the inference agent configuration has not been checked
    (this is the default), then the thread is placed in a queue of threads waiting
    their turn to execute the RTC activities. If the box is checked, the thread immediately
    proceeds.


    Once the thread is ready to execute, if the Concurrent RTC box is not checked
    the thread acquires the Rete lock. This prevents other threads from performing
    RTC activities. Any objects that were created or retrieved from the cache are
    asserted into working memory. Note that despite the fact that a call to Event.assertEvent()
    may have been made in the preprocessor function, the event is not actually placed
    in working memory until this point is reached. Once working memory has been updated,
    the RTC behavior (described earlier) is executed.


    Upon completion of RTC, the lock is released (allowing other threads to execute
    other RTC), a signal is sent to trigger the postprocessing related to the just-completed
    RTC, and (if necessary) the receipt of the initial JMS message is acknowledged.
    The thread is now ready to process another event.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Postprocessing Behavior


    Once the RTC cycle has completed, there are a number of postprocessing activities
    to perform. Depending upon the value of the Boolean Agent.<agentName>.enableParallelOps
    property in the CDD file, these activities may be single-threaded or occur in
    parallel.


    Figure 5-22 shows the behavior for the single-threaded option. If changes have
    been made to objects with the cache-aside object management option selected, the
    required database updates are performed first (this is further described in Chapter
    6). Next the cache updates are performed. This sequencing ensures that object
    changes are not exposed in the cache until after the database operations have
    been successfully completed. Outbound events are sent next, followed by pending
    message acknowledgments. Finally, object locks are released (object locking is
    discussed in Chapter 6).


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_119_0.png)


    Figure 5-22: Postprocessing Behavior—Single Threaded'
  merge: -1
  img_proc: true
- pgno: 120
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_120_0.png)


    Figure 5-23: Postprocessing Behavior—Multi-Threaded


    Figure 5-23 shows the behavior with multi-threading. All the activities run in
    parallel, with the event output and cache update activities using threads from
    the Agent.threadcount thread pool and the database update (if required) using
    threads from the Agent.dbthreadcount pool.


