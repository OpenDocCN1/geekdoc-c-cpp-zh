- pgno: 99
  md: 'the `transactionDateTime`. There are two sub-classes as well. The `CreditDebitTransaction`
    sub-class adds an `accountNumber` property to indicate the account from which
    the funds were taken or added. The `FundsTransferTransaction` has two account
    number properties: the `sourceAccountNumber` to indicate the account from which
    the funds were taken and the `targetAccountNumber` to indicate the account to
    which the funds were added.


    # Concepts


    A concept is an editable data structure that can be used for many purposes (Figure
    5-5). The name of the concept should indicate what the concept is intended to
    represent. Each concept instance has an optional external identifier (`extID`)
    property that can be set at the time the concept is instantiated.¹ It is good
    practice to assign a value to the `extID` that is unique across all concept instances.
    It serves as a unique identifier that can be used for retrieving the concept when
    needed (discussed later in this chapter) and also serves as a key for locking
    the concept when locking is required (discussed in Chapter 6).


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_99_0.png)


    Figure 5-5: Concept Data Structure


    1. All objects in TIBCO BusinessEvents® actually have this property, but it is
    particularly important on concepts.'
