    \ = 5; forwardChain = true; }\n    declare {\n        Events.Transaction transA;\n\
    \        Events.Transaction transB;\n    }\n    when {\n        transB.transactionAmount\
    \ <= 5.0; /* C1 */\n        transA.transactionAmount >= 10000; /* C2 */\n    \
    \    transA.accountNumber == transB.accountNumber; /* C3 */\n        transA.transactionDateTime\
    \ > transB.transactionDateTime ; /*\n            C4 */\n    }\n    then {\n  \
    \      System.debugOut(\"Fraud!\");\n    }\n}\n```\n```\n\n# Attributes\n\nThe\
    \ attributes clause is marked by the `attribute` keyword. There are three possible\
    \ attributes: `forwardChain`, `priority`, and `rank`. The `forwardChain` attribute\
    \ determines whether object changes made by the rule will cause the rule agenda\
    \ to be reevaluated. In general this attribute should always be set to true. The\
    \ priority and rank attributes determine the relative order in which rules will\
    \ be applied. The priority attribute is an integer whose value is fixed at design\
    \ time. The rank attribute designates a rule function that will be called at runtime.\
    \ This function returns a double value. Rules that are eligible to run are sorted\
    \ with priority as the primary sort key and rank as a secondary sort key. This\
    \ sorting occurs as part of the run-to-completion (RTC) cycle described later\
    \ in this chapter.\n\n# Declarations\n\nThe declarations clause is marked by the\
    \ `declare` keyword. It identifies, by type, the objects in the working memory\
    \ that are used by the rule. These objects may be events, concepts, or scorecards.\
    \ In this listing, the two declared objects are both Transaction events."
