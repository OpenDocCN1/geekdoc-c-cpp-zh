    # Destinations


    Each channel has one or more logical destinations associated with it (Figure 5-20).
    Non-local destinations have a default event type and a deserializer associated
    with them. When an incoming communication occurs, the deserializer creates an
    instance of the default event type populated with information from the incoming
    communication. Events created in this manner are automatically asserted into working
    memory.


    In the outbound direction, each event type can have a default destination associated
    with it. When an event of that type is created and sent (Event.sendEvent()), it
    is sent to the default destination whose serializer creates the appropriate format
    for the outbound communication.


