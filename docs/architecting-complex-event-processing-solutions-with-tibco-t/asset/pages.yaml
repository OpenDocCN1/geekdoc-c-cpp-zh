- pgno: 100
  md: 'Concepts have a set of properties. Each property has a name, which must be
    unique within the concept. Properties may have multiple values associated with
    them, as indicated by the multiple flag. A person, for example, might have several
    alternative names (i.e., aliases).


    A property can also maintain a history of previous values. An Account concept,
    for example, might have a balance property, and it might be useful to have a history
    of previous account balances for statistical or analytical purposes. History is
    specified by giving the number of historical values to be kept. The policy property
    determines whether all historical values are kept (even when the value does not
    change) or only different values are kept. There are some limitations on the use
    of history. One is that rule conditions can only access history via catalog functions,
    and the use of these functions in conditions is inefficient. Another is that when
    XML representations of concepts are automatically generated, history is not included.


    Properties can be of three types: simple types, contained concepts, and referenced
    concepts. Simple types are the same as for events: String, int, long, double,
    boolean, or DateTime. Optionally, these values can be constrained to be values
    found in a specified domain.


    Contained concepts are owned by their parent concept, and a contained concept
    can only be owned by one parent concept. Instances of contained concepts share
    the same lifetime as their parent instances. Deleting the parent instance also
    deletes the contained instance. However, contained instances can be added and
    removed without affecting the lifetime of the parent instance.


    Referenced concepts are pointers to concepts. A concept may be referenced by many
    other concepts. There is no connection between the lifetime of the referenced
    instance and that of the holder of the reference—either may be deleted without
    impacting the other. However, if the referenced instance is deleted, the reference
    becomes a null pointer.


    Figure 5-6 shows three example concepts, all related to a bank account. The Account
    has an accountNumber property and a balance property. In this context, a history
    of the account balance might be of interest. The Account contains Transaction
    concepts that record the amount and the dateTime of each transaction. The Transaction
    concept provides a persistent record of the transaction, in contrast to the Transaction
    event from Figure 5-4 that simply announced the'
