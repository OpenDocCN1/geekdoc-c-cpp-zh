- pgno: 184
  md: 'If the rules are truly independent, this approach can simplify the maintenance
    of the individual action invocations and their associated logic. But there are
    drawbacks as well.


    One drawback is that because the logic is now distributed across a number of rules,
    it is more difficult to understand the overall behavior. From a performance perspective,
    distributing the logic in this manner is demonstrably less efficient in terms
    of overhead than executing all the logic in a single rule action, particularly
    if there are common conditions across multiple rules.


    But the biggest drawback may be the assumption that the logic for each of the
    actions is truly independent. If you are trying to implement if-then-else logic,
    there is a sequencing dependency: The “else” clause is only executed when the
    “if” clause is not executed. This requires some sequential coordination, and some
    additional design work, to achieve this sequencing.


    # Sequencing the Execution of Rules


    There are two mechanisms for managing the sequential execution of rules in TIBCO
    BusinessEvents: priority and rank. Rule priority is established at design time,
    while rule rank is computed dynamically at runtime when the rule is placed in
    the rule agenda (see Chapter 5). When the rule agenda is sorted, rules are sorted
    by priority first, and then by rank within priority.


    The challenge with priority and rank is one of clarity. Understanding the overall
    prioritization and ranking scheme can be complex, particularly when there are
    multiple situations requiring sequencing. This scheme must be clearly understood
    by anyone creating rules that are involved in the sequencing. And since producing
    the proper sequencing requires that this scheme be properly applied in every rule,
    testing whether the desired sequencing has actually been achieved can be even
    more complex.


    For these reasons, schemes involving priority and rank should be used sparingly.
    Two common applications are executing clean-up logic and detecting exceptions.
    In both cases, these are functions that you want to perform after all of the normal
    processing has been completed. Since, by default, rules run at priority 5, you
    might want to set up your clean-up logic rules to run at priority 9, and your
    exception detection logic to run at priority 10 (assuming it does not need to
    be part of the mainstream work). Of course, these prioritization policies must
    be clearly understood by everyone involved in order for them to work!'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Orchestration Implemented in an Explicit Orchestration Component


    Orchestration components are designed to coordinate the execution of multiple
    activities and thus are well-suited for the task. TIBCO BusinessEvents® Process
    Orchestration, TIBCO ActiveMatrix BusinessWorks™, and TIBCO ActiveMatrix® BPM
    are all viable candidates for this role. Broadly speaking, TIBCO BusinessEvents
    Process Orchestration fits when rule-driven logic plays a significant role, ActiveMatrix
    BusinessWorks fits when the orchestration involves a lot of integration, and ActiveMatrix
    BPM when there is a workforce involved.


    Employing an explicit orchestration component requires coordination between the
    TIBCO BusinessEvents agent initiating the work and the orchestration component.
    Initiating the orchestration work simply involves sending a request (an event)
    to the orchestration component. However, you need to think about the coordination
    pattern that will be used and how your choice impacts the solution’s ability to
    detect breakdowns in the process. The basic choices are


    +   - Fire and Forget: Just send the request; no breakdown detection possible

    +   - Request Reply (synchronous or asynchronous): Reply confirms successful completion
    of coordinated work; requires timeout to detect breakdown

    +   - Delegation with Confirmation: Immediate reply indicates responsibility has
    been transferred; eventual asynchronous confirmation indicates successful completion
    of coordinated work; requires timeout to detect breakdown


    A more detailed description of these coordination patterns can be found in TIBCO™
    Architecture Fundamentals.¹


    The Asynchronous Request-Reply and Delegation with Confirmation patterns each
    require some logic to track the response and determine whether the response was
    delivered within the expected time frame. This is an ideal application for a state
    machine (Figure 10-14). When this machine is started, it sends the Request event
    and enters the Request Sent state, which starts the timer. It remains in that
    state until one of two things happens: the Response event is received or a'
