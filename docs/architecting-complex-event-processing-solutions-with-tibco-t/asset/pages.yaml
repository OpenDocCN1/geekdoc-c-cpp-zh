  img_proc: true
- pgno: 191
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_191_0.png)


    # Figure 11-2: State Machine Pattern Recognizer with Timeouts


    state machine, and a run-time environment in which the state machine can be applied
    to recognize the patterns. The TIBCO BusinessEvents Event Stream Processing extension
    provides these capabilities for recognizing patterns of events.'
