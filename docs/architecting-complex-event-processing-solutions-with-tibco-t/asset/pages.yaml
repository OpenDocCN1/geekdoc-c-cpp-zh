    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_199_1.png)


    **Figure 12-2:** *TIBCO ActiveMatrix BusinessWorks™ Waiting for an Event*


    # TIBCO ActiveMatrix BusinessWorks™ Wait for Event


    The Wait for Event activity is a blocking activity in an ActiveMatrix BusinessWorks
    process (Figure 12-2). When the process executes the activity, it waits for TIBCO
    BusinessEvents to send the event. The properties of the event are available to
    the ActiveMatrix BusinessWorks process.


    The Wait for Event activity can be used in conjunction with the Send Event activity
    to implement a synchronous request-reply interaction between ActiveMatrix BusinessWorks
    and TIBCO BusinessEvents.


    # TIBCO ActiveMatrix BusinessWorks™ Receive Event


    The TIBCO ActiveMatrix Receive Event activity is an ActiveMatrix BusinessWorks
    process starter (Figure 12-3). When TIBCO BusinessEvents sends an event of the
    indicated type, the ActiveMatrix BusinessWorks process starter receives the event
    and creates an instance of the process that uses that event as its process starter.
    The properties of the event are available for use in the process.'
