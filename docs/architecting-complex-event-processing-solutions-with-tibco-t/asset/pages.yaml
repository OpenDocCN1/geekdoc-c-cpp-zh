  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_194_0.png)


    +   1) Register the fraud pattern.

    +      - Pattern.Manager register(<pattern>)

    +   2) Create an instance of the pattern.

    +      - Pattern.Manager instantiate()

    +   3) Bind the completion and failure listeners and set parameters.

    +      - Pattern.Manager setCompletionListener(<instance> <<function>)

    +      - Pattern.Manager setFailureListener(<instance> <<function>)

    +      - Pattern.Manager setParameter<parameterType>(<value>)

    +   4) Deploy the pattern.

    +      - Pattern.Manager deploy(<instance> <deploymentInstanceName>)

    +   5) Send events to the pattern.

    +      - Pattern.IO.toPattern(<event>)


    Figure 11-5: Pattern Life Cycle


    The actual deployment process is managed by code running in the inference agent
    (Figure 11-5). The process begins with the call to `Pattern.Manager.register(<pattern>)`
    that creates the class representing the pattern. Typically, this call is made
    in a start-up function, but it can be made anywhere a catalog function can be
    invoked. An instance of the pattern is made with a call to `Pattern.Manager.instantiate()`.
    For patterns that should run continuously, this call is made in the start-up function.
    For patterns that only run under certain circumstances, this call is made either
    in a preprocessor function in response to an event that announces that these circumstances
    exist or in the action part of a rule that recognizes these circumstances. Wherever
    the instantiation is done, the completion listener and failure listener must be
    set along with the values of any parameters. Once these actions are complete,
    the pattern can be deployed.


    # Liveness Monitoring


    One application of patterns is liveness monitoring. From time to time it may be
    necessary to determine whether a particular component is operational. One approach
    to making this determination is to have the component send a periodic heartbeat
    and use pattern recognition to'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_195_0.png)


    *Figure 11-6: Heartbeat Recognition*


    determine whether the component is still operational (Figure 11-6). For example,
    the component might send a heartbeat event once every three seconds. The pattern
    might be that there should be at least one heartbeat in a ten-second sliding window
    of time. The absence of heartbeats for ten seconds would then constitute a failure
    of the pattern.


    # Summary


    Complex patterns can be difficult to recognize using rules and hand-crafted state
    machines. For this reason the TIBCO BusinessEvents Event Stream Processor extensions
    provide a pattern recognition language that makes it easy to define patterns of
    interest. This language is used to automatically create state machines that recognize
    the specified patterns.


    Patterns are deployed by inference agents. Events must be explicitly sent to the
    pattern matcher either by the preprocessor or the action part of a rule. When
    a match is made, the completion listener callback function is invoked; and if
    the pattern fails to match, the failure listener callback function is invoked.


    The life cycle of a pattern is managed by code running in the inference agent.
    This code defines the pattern, creates instances, sets the callback functions
    and variable values, and deploys the pattern. The code performing these functions
    can be located in start-up functions, preprocessor functions, or the action part
    of a rule.


    Patterns can be used for component liveness monitoring. If a component is expected
    to send a heartbeat periodically, a pattern can be used to recognize the absence
    of the heartbeats and conclude that the component is no longer operational.'
  merge: -1
