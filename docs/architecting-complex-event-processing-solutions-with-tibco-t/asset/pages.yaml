    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_165_1.png)


    Figure 9-7: M_TickerTracker Drill Down


    # Deployment


    If metric information changes frequently, considerable resources may be required
    to maintain the real-time display of the dashboard. For this reason, it is recommended
    that the entire set of agents used to maintain the view be executed in a cluster
    that is separate from the solution whose information is being displayed. Communications
    between the two clusters can use JMS as a transport. The cluster managing the
    views should be run on different machines than the solution cluster to avoid resource
    conflicts.


    It is good practice to run the inference and dashboard agents in different processing
    units. Since their resource demands will likely grow at different rates, this
    will allow them to be tuned independently.


    # Summary


    TIBCO BusinessEvents Views provides a means of maintaining a real-time display
    of solution information. Data is accumulated in metric'
