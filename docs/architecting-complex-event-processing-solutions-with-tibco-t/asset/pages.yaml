    has been created, values can be assigned to any variables in the pattern definition.


    Patterns are deployed in inference agents (Figure 11-4). The processing of patterns
    is handled by a pool of threads dedicated to the pattern matcher. Events are sent
    to the pattern matcher either by preprocessor functions or rule actions using
    the Pattern.IO.toPattern() function. The pattern callback functions can create
    events and send them to channels, but it cannot interact with concepts. The size
