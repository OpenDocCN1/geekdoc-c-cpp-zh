    # ## Event-Driven Processes


    Events, and the ability to trigger activity based on the receipt of an event,
    make possible the implementation of an event-driven process as opposed to a request-driven
    process.


    In a request-driven process (Figure 2-9), one party (party A in the figure) does
    two things: (1) recognizes that some condition has occurred,


