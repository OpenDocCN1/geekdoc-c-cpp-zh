  md: '# Event Pattern Recognition


    # Objectives


    The TIBCO BusinessEvents® Event Stream Processing extension includes features
    for recognizing patterns of events. This chapter explores these capabilities.
    After reading this chapter, you will be able to describe how these patterns are
    defined and how the pattern recognition is deployed. You will also be able to
    describe how patterns can be used for component liveness monitoring.


    # The Need for Event Pattern Recognition


    Some patterns of events are awkward to recognize using rules. Consider the following
    example:


    +   - Three red balls

    +   - Followed by two blue balls

    +   - Followed by one yellow ball


    You could, of course, craft a state machine to recognize this pattern (Figure
    11-1). The problem with this approach is that as the pattern gets'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_190_0.png)


    **Figure 11-1:** *State Machine Pattern Recognizer*


    more complex, it becomes increasingly difficult and tedious to craft the state
    machine—and verify that the pattern that it recognizes is the pattern you are
    trying to recognize.


    Another dimension of complexity is the introduction of time constraints. Consider
    this variation:


    +   - Three red balls within five minutes

    +   - Followed by two blue balls within 30 seconds

    +   - Followed by a yellow ball within an hour


    Again, you could craft a state machine to recognize this pattern (Figure 11-2),
    but the increasing complexity of doing so is beginning to become apparent.


    From a recognition perspective, the state machine is the right tool to use. The
    problem lies in the crafting of the machine. The traditional computer science
    answer to this problem is to define a pattern language, an accompanying compiler
    that automatically generates the'
