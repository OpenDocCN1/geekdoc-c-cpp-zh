  md: '# Chapter 4


    # TIBCO

    BusinessEvents®


    # Objectives


    TIBCO BusinessEvents® is a product suite that supports complex event processing.
    This chapter provides an overview of the product suite, describing the base product
    and its five available functional extensions. It also describes the life cycle
    of a TIBCO BusinessEvents project. The five chapters following this one are devoted
    to a more detailed examination of the internal product architecture.


    # TIBCO BusinessEvents® Product Suite


    The TIBCO BusinessEvents® product suite consists of six products (Figure 4-1).
    The core product is TIBCO BusinessEvents itself. The five functional extensions
    are TIBCO BusinessEvents® Views, TIBCO BusinessEvents® Data Modeling, TIBCO BusinessEvents®
    Decision Manager, TIBCO BusinessEvents® Event Stream Processing, and TIBCO BusinessEvents®
    Process Orchestration. The core product, TIBCO BusinessEvents, is required for
    all of the functional extensions.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_82_0.png)


    **Figure 4-1:** *TIBCO BusinessEvents Product Suite*


    # TIBCO BusinessEvents®


    The core product, TIBCO BusinessEvents® (Figure 4-2) provides basic event processing,
    a rules engine, and the modeling of concepts and events. The primary run-time
    component is the processing unit, which is a Java virtual machine (JVM) configured
    to support functional units known as agents. The core product provides two types
    of agents. *Inference agents* provide the functionality for processing rules.
    *Cache agents* provide a distributed data grid that can extend across multiple
    processing units. There are three additional kinds of agents that are part of
    the functional extensions described later.


    TIBCO BusinessEvents comes with TIBCO BusinessEvents® Studio, an eclipse-based
    design environment with an integrated debugger. It provides two administrative
    options. One is the TIBCO Administrator™ and its supporting TIBCO Runtime Agent™.
    The other is the TIBCO BusinessEvents Monitoring and Management component (BEMM).


    An optional component is the rules management server. This server, along with
    its associated web studio interface, provides the ability to change values used
    in rules at runtime.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_83_0.png)


    Figure 4-2: TIBCO BusinessEvents®


    # TIBCO BusinessEvents® Data Modeling


    TIBCO BusinessEvents® Data Modeling is an extension to TIBCO BusinessEvents that
    adds capabilities in two areas: data modeling and state machine modeling (Figure
    4-3).


    The data modeling capabilities include the ability for the TIBCO BusinessEvents
    Studio to import relational database schema definitions and automatically define
    the corresponding memory-resident TIBCO BusinessEvents concepts (these are discussed
    in Chapter 5). Functional extensions are added to the inference agent, which enable
    it to query and update the database. Functional extensions are added to the cache
    agent, which enable it to load information from the database into the cache. Transactional
    interactions with the database are supported.


    The state modeling capabilities include the ability to define a state machine
    using UML 1.2 state machine notation. State machine representations are used to
    model business processes and the life cycles of concepts (these are discussed
    further in Chapter 5). State machine modeling capabilities include the modeling
    of timeouts (the failure to reach'
