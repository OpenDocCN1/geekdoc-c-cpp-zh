    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_2.png)


    Figure 13-4: Partitioning with Multiple Processing Unit Deployment


    own RTC cycle, the operation of one will not have an adverse impact on the other
    provided the processing unit as a whole has sufficient resources.


    A third alternative is to deploy the two agents in different processing units
    (Figure 13-4). Although this incurs the overhead of inter-process communication,
    the two roles can now be tuned and scaled independently. Indeed, multiple instances
    of either or both processing units can be deployed as needed to handle the load.'
