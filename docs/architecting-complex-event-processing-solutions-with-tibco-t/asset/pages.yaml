- pgno: 175
  md: 'unless some preprocessor logic has explicitly brought the object into the agent''s
    working memory. The typical sequence is that the arrival of an event triggers
    a rule that updates the object: The preprocessor for that event will bring the
    cached object into working memory.


    In order for a rule to be subsequently triggered by a change to that object, this
    rule must be deployed in the same inference agent as the rule that made the change
    to the object. If rules are split up and deployed to different inference agents
    (as is frequently done in complex applications), you must bear in mind that rules
    triggered by the change in an object must be deployed to the same agent as the
    rules that modify the object when you decide which rules to deploy to which inference
    agents.


    Note that this consideration applies to all types of objects: events, concepts
    (including those with associated state machines), scorecards, processes, and metrics.
    If you have an inference agent rule triggered by an object change, that rule must
    be deployed in the same inference agent that made the change to the object.


    # State Machine Change Recognition Pattern


    When the situation you are monitoring is modeled with a state machine, the machine
    itself can be used to announce changes in the situation (Figure 10-7). Transitions
    can be configured to send notifications. For example, the transition from Start
    to State X, which is taken when Event 1 occurs, can be configured to send Notification
    A when the transition is taken. States can also be configured to send notifications
    when they are entered or exited. For example, State X is configured to send Notification
    B when it is entered and Notification C when it is exited.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_175_0.png)


    Figure 10-7: State Machine Change Recognition Pattern'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'A more realistic example is the sales order life cycle of Figure 10-8. Here
    the challenge is to notify accounting when the sales order has been fully delivered
    so that the revenue can be recognized from the sale. Since partial shipments are
    possible, recognizing that the order has been fully delivered is potentially complex,
    hence the use of the state machine to track the situation. Note the conditions
    on the transitions for Shipping Notice and Delivery Notice events, checking to
    see whether the order has been partially or fully shipped or delivered.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_176_0.png)


    Figure 10-8: Sales Order Life Cycle'
  merge: -1
