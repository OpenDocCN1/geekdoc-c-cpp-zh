    socket connections. Commonly an inference agent is used as the service provider,
    but process agents and even query agents can play this role as well.


    In most situations, when the agent is playing the role of a service provider,
    the receipt of the request is the triggering event for all of the processing required
    to produce the result. After receipt of the request, processing continues until
    the result is produced.


    In some situations, when the agent plays the role of an asynchronous provider,
    the receipt of the request does not trigger all of the work: Some remainder of
    the work is performed in response to another event. In some situations this event
    is directly related to the request—a timer expiring or an asynchronous response
    from some back-end system. In other situations, the other event may be an update
    to a cached concept whose change triggers the generation of the response (see
    Reference-Data Change Coordination pattern in Chapter 10).


    # TIBCO BusinessEvents® as an Asynchronous Service Consumer


    Consuming services with an asynchronous interaction is fairly straightforward
    with TIBCO BusinessEvents. However, asynchronous interactions generally require
    the retention of contextual information required'
