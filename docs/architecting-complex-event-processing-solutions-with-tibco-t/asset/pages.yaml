- pgno: 221
  md: '# Common Design Challenges


    # Objectives


    Complex-event processing solutions often present some significant design challenges.
    This chapter covers the challenges you are most likely to encounter in your designs.
    After reading this chapter you will be able to


    +   - Describe how information can be shared

    +   - Describe how locking can be used to maintain data integrity

    +   - Describe the approaches for managing sequencing constraints

    +   - Describe the approaches for managing event duplication


    # Information Sharing


    As soon as a solution is modularized and those modules are deployed in different
    agents, the problem of sharing information between the modules arises. There are
    two main approaches for information sharing. One is to use an event to convey
    the information directly from one module to another. The other is to use the cache
    as an intermediary.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Using an Event for Information Sharing


    The most straightforward means of information sharing is to load the information
    into an event and send it to the party that requires the information (Figure 14-1).


    As simple as this approach is, it has its drawbacks. An event is transient: It
    lives in the memory of the agent that receives it. If the agent is restarted,
    the information is gone. The distribution of events is limited: An event delivered
    to a queue will only be delivered to a single agent.


    # Using the Cache for Information Sharing


    Another approach to information sharing is to use the cache. In this approach,
    one agent loads the information into a concept that is being managed in Cache
    Only mode. This results in the concept being placed in the cache, which optionally
    may have replication and backing store configured to ensure the survivability
    of the information.


    There are two variations on this approach depending on the type of agent consuming
    the information. Figure 14-2 shows the pattern when


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_222_0.png)


    Figure 14-1: Information Sharing via Event


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_222_1.png)


    Figure 14-2: Information Sharing with an Inference or Process Agent via Cache'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'the consuming agent is an inference or process agent. The consuming agent is
    not automatically aware of the cached information: It must explicitly load the
    concept from the cache. This requires that there be sufficient information in
    the event triggering the activity in this agent to identify the concept(s) that
    need to be loaded. This pattern also characterizes the behavior when the consuming
    agent is a query agent executing a snapshot query.


    One potential problem with this pattern arises if the producing agent makes subsequent
    changes to the concept while the consuming agent is in the process of using the
    concept. This problem gives rise to the need for locking, which is described later
    in this chapter.


    The pattern is a bit different when the consuming agent is a query agent running
    a continuous query or a dashboard agent (Figure 14-3). In this situation, the
    consuming agent is automatically notified when the cached object changes. In the
    case of the query agent, the object may be a cached event or a concept. In the
    case of a dashboard agent, the object is a metric. Locking is generally not an
    issue with this pattern.


    A variant on these patterns arises when there are multiple agents that can modify
    the same concept (Figure 14-4). Here locking is clearly needed to maintain the
    consistency of the information residing in the concept.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_223_0.png)


    Figure 14-3: Information Sharing with a Continuous Query or Dashboard Agent via
    Cache


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_223_1.png)


    Figure 14-4: Multiple Producers'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'This situation is one that is particularly difficult to manage in practice.
    Locking not only adds overhead, but also the potential for delays as agents wait
    for other agents to release their locks. Preferable is an approach in which no
    more than one agent instance ever updates a particular concept. The patterns described
    in the section on managing sequencing constraints later in this chapter can be
    used for this purpose.


    A best practice with all these variants is to keep producers distinct from consumers.
    Mixing both roles in a single agent unnecessarily complicates locking and can
    lead to serious performance problems.


    # Locking


    Whenever parallel processing is going on there is the potential for conflict when
    multiple threads attempt to access the same object. The multiple-producers scenario
    of Figure 14-4 is a good example. When conflicts such as these are unavoidable,
    locks can be used to manage the situation. A lock ensures that only one thread
    at a time can access the object.


    # Locks


    Locks in TIBCO BusinessEvents® are not actually locks on the objects themselves—what
    is actually locked is a value. To make the lock useful, that value must somehow
    correlate to the object that you want to lock. The recommended best practice is
    to use the extID of the object as the lock value. The extID is a value that is
    specified when the object is created and must be unique across all the objects
    in the cluster.


    There are two possible scopes for a lock: local (within an agent) and global (across
    all agents). Local locks are used when an object is only being used in one agent,
    but there are multiple threads within the agent that can use the object. This
    arises when concurrent RTC is enabled in an inference agent and in process agents.
    Global locks are used when an object may be used by more than one agent. From
    a performance perspective, local locks are more efficient than global locks.


    In inference agents, locks are generally obtained in a preprocessor function and
    are automatically released at the end of the RTC cycle. In process agents, locks
    are obtained in script tasks and are automatically released whenever a checkpoint
    is performed (see Chapter 8).'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Locking Requires Programming Discipline


    Because objects are not physically locked, making effective use of locks requires
    programming discipline. Every thread that requires access to an object requiring
    locking must obtain a lock. All it takes is one omission and the locking scheme
    breaks down. For this reason, it is good practice to clearly identify objects
    that require locking in their description and in accompanying design documentation.


    # Avoiding Deadlocks


    A deadlock can arise when two agents are each waiting for a lock that is presently
    being held by the other. Here is an example.


    +   - Agent X has locked object A and is trying to lock object B; meanwhile,

    +   - Agent Y has locked object B and is trying to lock object A.


    This situation is commonly referred to as a deadly embrace. There are three approaches
    for dealing with this situation, all of which should be routinely employed.


    +   - If there is a natural hierarchy to the objects, lock in top-to-bottom order.

    +   - Before locking, obtain the extID of all objects that require locking. Sort
    the extID list with the primary sort using the object hierarchy and the secondary
    sort using the values of the extID. After the sort, obtain locks in the sort order.
    This minimizes the likelihood of a deadly embrace.

    +   - Always use a timeout on the lock call, and provide exception handling for
    the timeout scenario.


    # Locking and Data Structures


    The design of concept data structures can have a significant impact on the complexity
    of locking. Consider a shipping application in which packages are loaded into
    containers that are, themselves, loaded onto planes. Two possible data (concept)
    structures for representing packages, containers, and planes are shown in Figure
    14-5. The natural structure is the one that arises from a classical object-oriented
    modeling approach, and it is the one most people would consider to be representative
    of the situation.'
  merge: -1
  img_proc: true
