- pgno: 32
  md: '# Innovation in Sensing, Analyzing, and Responding


    Pre-computer business processes were driven exclusively by human activity. Each
    process started when one person took an action: a customer placed an order; an
    associate recorded the results of an inventory check. Someone else sensed this
    initial activity: the salesman recorded the order; the store manager received
    the updated inventory. Someone analyzed what was sensed to determine the appropriate
    response: the salesman validated the order and the pricing; the store manager
    determined which items required reordering. Someone responded to this situation:
    the salesman submitted the order for fulfillment; the store manager ordered replacement
    inventory.


    This sense-analyze-respond pattern is pervasive. Every participant in every business
    process performs these three functions. The participants interact with each other,
    each sensing what other participants have done and responding accordingly. When
    you include information systems as participants in business processes, each system
    has to sense some activity, analyze what it has sensed, and respond accordingly.
    The collaboration of these participants, human and system alike, creates an overall
    business process that, viewed as a whole, defines how the enterprise senses, analyzes,
    and responds.


    When it comes to improving a business process, every improvement to every business
    process is an improvement in sensing, analyzing, and responding somewhere in that
    business process. Let’s take a look at the types of innovations that can be applied.


    # Innovation in Sensing


    The sensing functionality of many business processes is passive; the process waits
    for a person or a system to submit a request. The sales process waits for the
    customer to place an order; the stock replenishment process waits for an associate
    to update an inventory level.


    Active sensing—sensing business significant events—can speed up processes. Consider
    the case of the stock replenishment process. Instead of manually taking inventory,
    you might maintain a running inventory that is automatically updated each time
    an item is sold, and then use this inventory to automatically order replenishment
    stock. Implementing such an innovation requires changes to three business processes:
    the Sales Process, the Inventory Management Process, and the Replenishment Process.
    The Sales Process changes are'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - Sensing which products are being sold (e.g., using bar-code scanning)

    +   - Responding by generating point-of-sale transaction records that identify
    the products and quantities sold


    The Inventory Management Process changes are


    +   - Sensing the point-of-sale transactions as they occur

    +   - Analyzing each transaction to determine which product inventories require
    updating

    +   - Responding by updating the inventory record


    The Replenishment Process changes are


    +   - Sensing the change in inventory level

    +   - Analyzing the change to determine whether new stock needs to be ordered

    +   - Responding by ordering new stock as required


    Active sensing—automation—requires the sensing of business significant events
    and the subsequent analysis of and response to those events. In the previous example,
    there are three significant events: identification of the item being sold, sale
    of the goods, and updating of the inventory.


    Often one of the challenges you will face in active sensing is the lack of an
    observable event. Prior to bar-code scanning, for example, there really was no
    identification of what was being sold at the cash register. Only high-value items
    such as cars and appliances had sales receipts that identified the specific items
    being sold. Active sensing often requires changes to the process that make the
    events of interest observable in an automated way.


    A key difference between active and passive sensing is timeliness. Passively,
    the point-of-sale transactions might accumulate in a file or database, and the
    sensing might be done on a periodic basis by reading those records. Actively,
    the point-of-sale transactions might be published—announced—as they occur. Subscribers—announcement
    listeners—are informed immediately when a transaction occurs.


    Another key difference is data quality. Passively, during the time between one
    periodic inventory update and the next, the inventory data is out of date. Actively,
    the inventory data is up to date within seconds of the actual transaction—before
    the goods have even left the store. Errors in data can result in faulty decisions
    that adversely impact the enterprise.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'In summary, there are two possible innovations in sensing. One is automating
    the sensing of business-significant events and thus providing information about
    what has occurred. The other is propagating those events in real time, as they
    are happening, and thus facilitating timely responses and improving data quality.


    # Innovation in Analysis


    Once an event of business significance has been sensed, some evaluation may be
    required to determine what, if anything, needs to be done. Such analysis typically
    requires access to reference information, which raises two questions: How is the
    reference information accessed, and when does the analysis occur? Both provide
    opportunities for innovation.


    Reference information often needs to be retrieved. If the same reference information
    needs to be retrieved repeatedly, accessing it can be computationally expensive.
    One approach to dealing with this is to accumulate the sensed events and perform
    the analysis periodically on batches of events. Such batching leads to delays
    in analysis and the subsequent responses.


    An alternative approach is to stage the reference information in such a way that
    the analysis of the event can occur immediately without a significant computational
    penalty. This makes possible the immediate analysis of events as they occur, making
    possible immediate responses as well.


    If events are analyzed soon enough, it then becomes possible to recognize an emerging
    situation before it actually occurs. This is what Vivek Ranadivé refers to as
    the two-second advantage.^1^ This anticipation makes it possible to take action
    and either take advantage of the situation or alter the outcome. For example,
    a bank might observe one of its good customers using its web site mortgage calculator
    and proactively make an offer for a mortgage to that customer.


    In summary, there are two possible innovations in analysis. One is positioning
    reference information so that its retrieval does not present a computational barrier
    to analysis. The other is to perform the analysis in real time, as the events
    occur. Doing both of these makes it possible to anticipate situations before they
    occur and leverage that anticipation through appropriate actions.


    1. Vivek Ranadivé and Kevin Maney, _The Two-Second Advantage: How We Succeed by
    Anticipating the Future—Just Enough_, London: Hodder & Stoughton (2011).'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Innovation in Response


    Analyzing events results in an understanding that a particular situation exists
    and a determination of what type of response, if any, is required. Innovation
    in response lies in improving the interaction between the party performing the
    analysis and the party executing the action. In all cases, requests (which are
    simply another form of event) must be sent to the party doing the work. However,
    there are two choices that impact the timeliness of the work performance. One
    choice lies in the delivery of the requests: Requests may be sent immediately,
    or they may accumulate and be sent periodically. The other choice lies in the
    timeliness of work performance: Work may be performed immediately upon request,
    or it may be performed at some later time.


    Delays in work performance can negate any advantage gained in anticipating a situation.
    This is not to say that all work must be performed immediately, but rather that
    the timing of the work performance must be appropriate for the present situation.


    In summary, there are two possible innovations in response. One is sending work
    requests immediately as soon as the need for the work is recognized. The other
    is in performing the work either immediately or within a timeframe appropriate
    to take advantage of a recognized situation. Together, these innovations enable
    the enterprise to respond more appropriately.


    # The Event-Enabled Enterprise


    From a business perspective, innovations in sensing, analyzing, and responding
    enable the enterprise to not only react faster and more appropriately to situations,
    but also to be proactive, anticipating situations and taking advantage of that
    anticipation. Both enable the enterprise to increase the value they deliver to
    their customers and business partners and gain competitive advantage. Realizing
    this business value requires the automation of sense, analysis, and response activities
    along with the appropriate positioning of reference information for immediate
    and efficient use.


    So what is an event-enabled enterprise? It is simply an enterprise that has the
    infrastructure in place to sense, analyze, and respond to events as they occur
    and has positioned reference information to support this real-time activity. The
    event-enabled enterprise is thus in a position to efficiently innovate in how
    it senses, analyzes, and responds'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'to the world around it. Through continuous innovation in these areas, the event-enabled
    enterprise distinguishes itself from its competitors and builds competitive advantage.
    Done well, such innovations provide extreme value for its customers, turning them
    into loyal fans.


    # Summary


    Extreme value sets your enterprise apart from its peers and turns your customers
    into loyal fans. Business process improvements are one way of providing this extreme
    value. These improvements make your enterprise more responsive to its customer
    base by innovations in how the enterprise senses, analyzes, and responds to the
    world around it. The most significant innovation lies in performing these activities
    in real time. Proactively sensing events—recognizing that something has happened
    rather than passively waiting to be told—is a significant enabler for this type
    of process improvement. The event-enabled enterprise is one that recognizes such
    events and continuously innovates in its analysis and response. It delivers extreme
    value to its customers.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Chapter 2


    # Concepts


    # Objectives


    The event-enabled enterprise concept is, itself, built upon a number of ideas.
    As a prerequisite to having a meaningful discussion about realizing the event-enabled
    enterprise, these underlying concepts must first be clearly understood. That is
    the purpose of this chapter.


    After reading this chapter you will understand the essential concepts underlying
    the event-enabled enterprise: events, complex events, complex-event processing,
    context, event responses, and event-driven processes.


    # Overview


    The event-enabled enterprise (Figure 2-1) innovates in the manner in which it
    senses, analyzes, and responds to the world around it. It senses events that are
    happening in the world. When it senses an event occurring outside the enterprise,
    it announces the fact within the enterprise. This announcement becomes an internal
    event within the enterprise. The announcement triggers an analysis of the event,
    determining its business significance and whether a business response is required.
    The announcement that a response is required is another event, one that triggers
    the actual response. The response is an action, and the'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_38_0.png)


    Figure 2-1: Event-Enabled Enterprise


    completion of this action is, itself, an event—one that may be observable outside
    the enterprise. This is the way an event-enabled enterprise works.


    # Events


    An event is simply something that occurs: an order is placed, a service is delivered,
    a customer arrives on premises. To act on the event, you need to know what occurred
    and perhaps when it occurred, but first and foremost you need to recognize that
    it happened. The question is, how?


    # Recognizing Events


    On the surface, recognizing an event may appear trivial: The customer placed an
    order. But dig a bit deeper and some challenges appear. What if you are using
    a commercial off-the-shelf (COTS) software package to manage your orders? The
    event you seek is internal to the software package, an update to the database
    that underlies the system. What if the system does not provide a mechanism—a callback—to
    inform other components that an order has been placed?


    In cases like this you must identify a mechanism for recognizing such events.
    There are a number of standard techniques for doing this. These techniques and
    their implementations are discussed in the companion book TIBCO® Architecture
    Fundamentals.¹'
  merge: -1
