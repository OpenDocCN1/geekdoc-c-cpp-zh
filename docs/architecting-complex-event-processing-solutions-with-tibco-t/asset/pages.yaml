    deployment of the components on individual machines can be specified. Upon deployment,
    the administrator communicates with the TRA on each involved machine to place
    both configuration files and executables on the machine. When the administrator
    starts the application, it instructs each involved TRA to execute the command
    line for each processing unit to be started. Upon start-up, each processing unit
    reads its configuration files from the local machine and begins processing.


    TIBCO BusinessEvents provides another deployment and management option: TIBCO
