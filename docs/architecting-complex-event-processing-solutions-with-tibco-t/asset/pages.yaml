- pgno: 95
  md: '# Chapter 5


    # Inference Agents


    # Objectives


    The inference agent is the heart of TIBCO BusinessEvents®. It provides analytical
    capabilities for complex event processing, staging information in memory and operating
    on that information with rules. It interacts with its external environment through
    a variety of channels through which it can both sense and respond to activity
    in its environment.


    After reading this chapter you will be able to describe


    +   - The role of the inference agent in TIBCO BusinessEvents

    +   - How information is represented in the form of event, concept, and scorecard
    data structures

    +   - How events, concepts, and scorecards are created and consumed in an inference
    agent

    +   - How rules are structured and operate on events, concepts, and scorecards

    +   - How an inference agent uses channels to interact with its external environment

    +   - The threading model of the inference agent and the available tuning options'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Inference Agent Overview


    There’s quite a bit to the inference agent, and to present it all at once would
    be confusing. We’ll start with the simplified overview of Figure 5-1 and then
    add components until the picture is complete.


    The functional heart of the inference agent is the run-to-completion function
    (RTC) that executes the rules. It operates on events, concepts, and scorecards
    being held in working memory. Channels provide both input and output capabilities,
    and the cache interface provides for information sharing between agents. We’ll
    get to the channels and the cache later on, but for now let’s look at how information
    is represented in the working memory and analyzed by the RTC function executing
    rules.


    # Events, Concepts, and Scorecards


    There are three primary memory-resident data structures used by the inference
    agent: events, concepts, and scorecards (Figure 5-2). Events are static representations
    of information characterizing an event, whether it is an event originating elsewhere
    or one that originates within the inference agent. Events, once placed in working
    memory, are not editable.


    Concepts are representations of information, other than events, that is required
    by the rules. This may be information imported from other sources or accumulated
    and maintained by inference agents


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_96_0.png)


    Figure 5-1: Inference Agent Simplified View'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_97_0.png)


    # Figure 5-2: Working Memory


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_97_1.png)


    # Figure 5-3: Event Data Structure


    and other parties. In contrast with events, concepts are editable: Rules can modify
    concepts.


    Scorecards are a special kind of concept generally used for accumulating summary
    information.


    The following sections explore these data structures and their intended usage.


    # Events


    An event data structure (Figure 5-3) is intended to be a representation of an
    event: a snapshot of a situation at some point in time. Be sure to name your events
    so that they are descriptive of the situation whose occurrence they are intended
    to represent. Events can have a timeToLive, some properties, and a payload. Events
    can also be subclassed from other events.


    The timeToLive parameter indicates, as the name implies, how long the event data
    structure will persist. A positive value, expressed in a time unit, indicates
    the period of time during which the event data structure will remain available.
    A value of zero indicates that the event data structure will remain around only
    until the first RTC cycle'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'completes. A negative value indicates that the event data structure will remain
    until it is explicitly deleted. The implications of selecting values for the `timeToLive`
    parameter are explored in the Chapter 6 discussion of memory management modes.
    Of course, any event may be explicitly removed at any time by calling the `consumeEvent()`
    catalog function.


    Event properties are named values that have a simple data type: `String`, `int`,
    `long`, `double`, `boolean`, or `DateTime`. Optionally, the values can be restricted
    so that they can only be taken from an enumeration of values provided by the indicated
    domain. Event properties are efficiently accessed by conditional expressions in
    rules.


    The event payload is an optional data structure whose structure is specified by
    an XML schema definition (XSD). Elements of the payload can be referenced in rules
    using XPath expressions, but this access is not as efficient as accessing properties.
    For this reason, when elements of the payload need to be accessed in rules and
    performance is a significant consideration, it is common practice to copy those
    element values into properties at the time the event is created. This is done
    during preprocessing, which is discussed later in this chapter.


    With two exceptions, an event is local to the agent that created it (other types
    of agents can create events as well). One of these exceptions is an event that
    is explicitly sent externally via a channel. The other is an event with a non-zero
    `timeToLive` that was also declared to use the Cache-Only memory management mode
    (described in Chapter 6). Such an event will be visible to a query running in
    a query agent (Chapter 7). With these two exceptions, an event is strictly local
    to the agent that creates it.


    Figure 5-4 shows three related events. The parent Transaction event has properties
    that indicate the amount of the transaction and


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_98_0.png)


    **Figure 5-4:** *Event Example*'
  merge: -1
