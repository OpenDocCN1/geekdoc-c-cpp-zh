- pgno: 169
  md: '# Chapter 10


    # # Solution Basics


    # ## Objectives


    This chapter focuses on basic capabilities you will require in crafting your solutions
    using TIBCO BusinessEvents®. After reading this chapter you will be able to


    +   - Describe the various ways in which a change in a situation can be recognized
    and acted upon

    +   - Describe how the sequencing or conditional execution of actions can be managed

    +   - Describe how rules can be modified at runtime without halting your solution

    +   - Explain the options available for exception reporting and logging

    +   - Explain the naming guidelines for rules and rule functions


    # ## Recognizing a Situation Change


    Central to complex-event processing solutions is the recognition of a situation
    that requires action. Often this requires not just the recognition that a situation
    has arisen, but also a deeper understanding of how the'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'situation has changed. Typically this recognition of change then becomes the
    trigger for further analysis.


    This chapter presents several common design patterns for recognizing a situation
    change:


    +   - Reference-Data Comparison pattern

    +   - Reference-Data Change pattern

    +   - State Machine Change Recognition pattern

    +   - Continuous Query Change Recognition pattern


    # Reference-Data Comparison Pattern


    One approach to recognizing change is to compare current status against reference
    data (Figure 10-1). For example, a patient''s current blood pressure is compared
    against an earlier reading to determine whether there has been a significant change.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_170_0.png)


    Figure 10-1: Reference-Data Comparison Pattern'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Systems of Record for Reference Data


    The reference data used in the Reference-Data Comparison pattern is generally
    historical data. The dominant design problem that arises in this pattern is that
    of maintaining the historical data. In crafting your solution, you need to answer
    three questions:


    +   1. What is the system of record for the reference data?

    +   2. How is the system of record being updated when the reference data changes?

    +   3. How is the reference data made available to the CEP engine?


    There are several possible approaches.


    # ## TIBCO BusinessEvents® as Reference-Data System of Record


    When you are using TIBCO BusinessEvents, answering the first question boils down
    to whether you want TIBCO BusinessEvents to be the system of record or some other
    system. If TIBCO BusinessEvents is to be the system of record, you’re going to
    end up with a pattern similar to that of Figure 10-2 for maintaining the reference
    data. Here the inference agent has a rule that updates the cache, which in turn
    updates the backing store. This is the pattern you get if you use the shared-nothing
    option or shared-all with write-behind option discussed in Chapter 6.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_171_0.png)


    **Figure 10-2:** *TIBCO BusinessEvents® as Reference-Data System of Record*'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Database as Reference-Data System of Record


    Another alternative is to use a database as the system of record (Figure 10-3).
    The TIBCO BusinessEvents® Data Modeling extension provides the facilities for
    automatically defining the cached concept representation of the reference data
    based on the database schema and the operations for updating the database and
    updating the cache from the database. This pattern makes the reference data available
    to other systems as well.


    # External System as Reference-Data System of Record


    A third alternative is to use an external system as the system of record for the
    reference data. A seemingly simple approach is shown in Figure 10-4, but there
    is a drawback: If some other entity changes the data in the external system, there
    is no mechanism for getting the change back into the cache.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_172_0.png)


    Figure 10-3: Database as Reference-Data System of Record


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_172_1.png)


    Figure 10-4: External System as Reference-Data System of Record—Naïve Approach'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_173_0.png)


    Figure 10-5: External System as Reference-Data System of Record—Robust Approach


    A more robust approach is shown in Figure 10-5. Here the inference agent updates
    the system of record, and an adapter (such as the TIBCO ActiveMatrix® Adapter
    for Database) recognizes the change and publishes a change notification. The inference
    agent picks up this change notification through a channel and updates the reference
    data accordingly.


    # Reference-Data Change Coordination Patterns


    The activities of comparing status to reference data and updating the reference
    data must be somehow coordinated. In a rule-based system, the simplest approach
    to performing these activities is to use separate rules for each activity (Figure
    10-6a). This approach has a race condition and cannot guarantee that the comparison
    will finish (or even begin) before the reference data update occurs.


    A more robust approach is to coordinate these two activities to ensure that the
    comparison completes before the update begins (Figure 10-6b). TIBCO BusinessEvents
    provides three mechanisms that can be used to ensure this sequencing.


    +   1. Leave the two activities as separate rules and use rule priorities to ensure
    the proper sequence of execution (this is discussed later in this chapter).

    +   2. Have a single rule that performs the two activities sequentially in the
    action part of the rule.

    +   3. Use process orchestration as described in Chapter 8.'
  merge: -1
  img_proc: true
