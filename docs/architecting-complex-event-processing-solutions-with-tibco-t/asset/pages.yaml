    # Completing the Inference Agent: Preprocessing and Postprocessing


    The RTC cycle operates on objects in the working memory, but we have not considered
    how those objects get there. This functionality is termed pre-RTC processing in
    the product manuals, or preprocessing for short (Figure 5-19). Preprocessing handles
    incoming communications. These communications usually (but not always) result
    in changes to working memory, which in turn trigger the evaluation of rules in
    the RTC cycle. The RTC processing takes actions that require outbound communications.
    The execution of these actions is termed post-RTC processing, or postprocessing
    for short.


    There are three types of outbound communications, which occur only after the RTC
    processing is complete. One is the sending of events to other components and agents
    via channels. A second is the updating of objects in the cache: Objects that are
    configured to be in the cache and are created or modified by the inference agent
    must have their cache representations updated. The third is the updating of the
    cache'
