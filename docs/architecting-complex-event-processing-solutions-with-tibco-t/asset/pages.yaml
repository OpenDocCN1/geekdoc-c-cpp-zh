- pgno: 237
  md: '# Chapter 15


    # Case Study: Nouveau

    Health Care


    # Objectives


    One of the challenges in writing about architecture and architecture patterns
    is to pick examples that are rich enough to motivate the discussion and realistic
    enough to represent real-world challenges while at the same time being simple
    enough to be readily explained.


    The fictional Nouveau Health Care case study was created for this purpose. Its
    business processes, though simplified when compared with their real-world equivalent,
    are still complex enough to present most of the common design challenges found
    in their real-world counterparts. An important aspect of reality is that the processes
    and their corresponding solution implementations do not operate in isolation;
    rather, they interact with one another and with other business processes as they
    would in the real world.


    Different aspects of the Nouveau Health Care example are used throughout this
    architecture book series. This chapter provides a conceptual overview of the company
    and its business processes, and then introduces the Claim Tracker and its related
    business processes, which are used to illustrate many of the points and design
    principles in this book.


    After reading this chapter you will be able to describe the Claim Tracker requirements
    and architecture.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Nouveau Health Care Solution Architecture


    Nouveau Health Care is a traditional health care insurance company. It sells health
    care insurance policies and covers claim payments with the revenue it collects
    from its premiums. It also administers the processing of claims.


    There are factors that add to the complexity of Nouveau’s business. In some cases,
    the employers for whom Nouveau provides the health care benefits also provide
    the funds for paying the claims: Nouveau simply administers the policies. In other
    cases, the administration of specialized services (vision and dental care) is
    farmed out to other companies. Both variations present some interesting design
    challenges.


    # Nouveau Health Care Business Processes


    Our use of Nouveau focuses on four of its business processes (Figure 15-1):


    +   1. Validate Membership and its underlying Validate Membership Service

    +   2. Manage Payments, which manages claim payments to health care service providers

    +   3. Process Claim, and its initiator, Route Claim, which together handle the
    processing of insurance claims

    +   4. Monitor Claim Processing, a process that monitors the execution of claim
    processing


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_238_0.png)


    Figure 15-1: *Nouveau Health Care Business Processes*'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The Validate Membership process is used by authorized parties (health care
    providers, employers, and members) to validate whether or not an individual was
    covered by the policy on a given date. This business process uses an underlying
    Validate Membership Service, which is also used by the Process Claim business
    process. Validate Membership is used as an example in the *TIBCO® Architecture
    Fundamentals* book.


    The Manage Payments process manages the payments to health care service providers
    resulting from health care claims.¹ What makes this process interesting is that,
    under normal circumstances, payments are made on a periodic basis (e.g., monthly)
    to health care service providers. This means that the payment manager must keep
    track of pending payments. By exception, payments to health care service providers
    for specific claims may be made immediately. The design of this process is explored
    in *Architecting Composite Applications and Services with TIBCO®*.


    Process Claim and its related Route Claim process actually handle the processing
    of health care claims. Routing is required because some claims are processed by
    Nouveau itself while others are processed by partner companies. Process Claim
    is a consumer of both the Validate Membership Service and the services of the
    Payment Manager. Process Claim and Route Claim are used as examples in the upcoming
    book, *Architecting BPM Solutions with TIBCO®*.


    Monitor Claim Processing keeps track of the progress of claim processing. This
    is necessary because some claim processing is done by partner companies. Monitoring
    provides uniform tracking of all health care claims regardless of whether Nouveau
    or one of its partners is handling the claim. This process is used as an example
    in this book.


    # Nouveau Health Care Architecture Pattern


    The business processes of Nouveau Health Care are executed by a collection of
    components (Figure 15-2). The Claim Router provides an interface for the Billing
    Provider to submit claims. It validates membership with the Membership Service,
    routes claims to the Claim Processor, and reports status to the Claim Tracker.
    The Claim Processor (and there may be more than one) adjudicates the claim, validating
    membership via the Membership Service, requesting claim payment via the Payment
    Manager, and reporting status to the Claim Tracker.


    1. In the real world, the Manage Payments process would also manage payments to
    members, reimbursing them for claim-related expenses that they have already paid
    themselves.'
