- pgno: 152
  md: 'The preprocessor in the queryAgent adds the incoming transactions to the buffer,
    and each time the buffer is modified the query is reevaluated. The query is the
    one shown in Listing 7-4, and it executes in a thread from a thread pool whose
    size can be set with the be.agent.query.continuous.threadpoolsize parameter.


    # Summary


    The query agent executes two types of query: snapshot and continuous. A snapshot
    query is executed in a preprocessor function triggered by the receipt of the event.
    Snapshot queries examine the contents of the cache. The preprocessor function
    running the query determines what to do with the query results, either sending
    the results in the form of an event or analyzing the results and taking appropriate
    actions.


    Continuous queries operate on a buffer of objects. The query specifies the types
    of objects in the buffer along with the conditions for their addition and removal.
    The objects can come from either the cache or the query agent channels. When the
    contents of the buffer change, the query is reevaluated. A user-defined callback
    function is called with the query results and determines what actions to take.


    Both snapshot and continuous queries are defined, instantiated, and executed by
    invoking functions. Typically, the query definition is performed in the query
    agent’s start-up function. The instantiation and execution of snapshot queries
    is generally done in a preprocessor function. The instantiation of a continuous
    query that runs all the time is usually done in the start-up function. If the
    query only runs part of the time, these functions will be invoked in preprocessor
    functions that start and stop the query in response to incoming events.'
