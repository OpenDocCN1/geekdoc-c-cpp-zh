  md: '# TIBCO Education


    # You''ve read the book... now take action!


    TIBCO Education is offering intense companion courses and a professional certification
    for each of the books in the architecture series from TIBCO Press. Each course
    will be released to coincide with the publication of its companion book. The planned
    series includes:


    +   - ARC 701: TIBCO Architecture Fundamentals

    +     (available now)

    +   - ARC 702: Architecting Composite Applications and Services with TIBCO (available
    now)

    +   - ARC 703: Architecting BPM Solutions with TIBCO

    +   - ARC 704: Architecting Complex Event Processing Solutions with TIBCO (available
    now)

    +   - ARC 705: Architecting Data Centric Solutions with TIBCO


    # Accelerate your career with TIBCO Certification.


    TIBCO Certified Architect certifications are the highest level of accreditation
    in the TIBCO Certified Professional Program. These prestigious credentials recognize
    those individuals who demonstrate a clear understanding of the selected TIBCO
    products, a sound grasp of architecture concepts, methodology, and principles
    and how they may be combined to solve practical or challenging requirements.


    _To learn more about the courses and certification, visit the TIBCO Education
    website at http://www.tibco.com/services/educational_'
