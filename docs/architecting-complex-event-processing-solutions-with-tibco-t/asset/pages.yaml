- pgno: 70
  md: 'independently begin an initiative that will eventually provide more detailed
    evidence of progress. This is exactly what happened in the telecommunications
    case study described back in Chapter 2.


    # Business Process Timeliness Monitor


    The Business Process Timeliness Monitor (Figure 3-9) is an extension of the Track-and-Trace
    pattern. State machine models can be extended so that the absence of an expected
    event within some period of time can be recognized. While, of course, you can
    apply this approach to recognizing that an overall process did not complete on
    time, the greatest benefit comes from recognizing that some intermediate event
    did not occur on time, and thus the overall process is in jeopardy of being late.
    The recognition can be used to trigger an action that will correct the course
    of the overall process and get it back on track for an on-time completion. The
    telecommunications case study discussed back in Chapter 2 is an example of this
    pattern in action.


    Detecting the absence of an event requires the establishment of a service-level
    agreement specifying the maximum amount of time it should take for the process
    to complete or remain in each intermediate state. When the state machine monitoring
    the process is started or a particular intermediate state is entered, a timer
    is started. When the overall process completes, or the intermediate state is exited,
    the corresponding timer is stopped. However, if the timer expires before the


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_70_0.png)


    Figure 3-9: Business Process Timeliness Monitor'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'process completes or the intermediate state is exited, a timeout event is generated.
    This is an indication that some expected event did not occur.


    In recognizing this situation, it is the expiration of the timer that serves as
    the trigger for the analysis. Some introspection of the state machine may be required
    to identify which events did not occur, but the larger design requirement is to
    determine which parties should be notified when this situation arises and what
    actions those parties are going to take to get the overall process back on track.


    # Situational Response


    All the patterns in this chapter up to this point have had one characteristic
    in common: They simply recognize that some condition exists and announce that
    fact with an event. Other independent participants receive these notifications
    and decide what action to take.


    In some situations there is an additional challenge in determining what the appropriate
    response ought to be (Figure 3-10). Further analysis is required, generally to
    focus the actions on achieving specific business objectives. Reference data, often
    containing historical information, is required for the analysis. The result of
    the analysis is generally one or more directives to actually perform the identified
    actions.


    Consider the case in which there is some form of perishable commodity being sold:
    fresh produce and meat, seats on a plane, or hotel rooms—anything that becomes
    worthless if not sold by some point in


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_71_0.png)


    Figure 3-10: Situational Response Pattern'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'time. The desired business strategy is to dynamically set the price of the
    commodity based on the remaining inventory and the time remaining before the commodity
    becomes worthless. The situation being responded to in these cases is the presence
    of a potential consumer for the perishable commodity.


    The simplistic approach to pricing the commodity is to fix a point in time at
    which it will be put on sale. The idea is that this will raise demand and ensure
    that the commodity does not go to waste. The problem with this approach is that
    it neither maximizes revenue nor minimizes the likelihood that the commodity will
    go to waste. If the commodity is selling well and will likely sell out, putting
    it on sale will result in lost revenue. On the other hand, if the commodity is
    selling very poorly, lowering the price by a set amount at a fixed point in time
    might not ensure that the commodity actually sells out.


    A more sophisticated approach is to track the rate at which the commodity is selling
    versus the price of the commodity. With this approach, the offering price for
    the commodity can be adjusted dynamically. This approach is often applied to online
    product sales. It requires complex event processing to do the dynamic price adjustments
    as consumers shop and as commodity inventories change. Note that the rate of sales
    and the current inventory become part of the reference data—a dynamic part whose
    currency must be maintained in a timely manner—most likely via events!


    # Decision as a Service


    In the Decision-as-a-Service pattern (Figure 3-11), the logic necessary to make
    a decision is factored into a separate component. The service consumer gathers
    all relevant current-state input data for the decision and passes it to the service.
    This is typically a synchronous request-reply interaction, but it may be asynchronous.
    In either case, the decision service computes output data from the input data,
    using static reference data as appropriate. The output data reflects the decision
    results.


    The value of this pattern is that it encapsulates the logic of the decision as
    a service. This simplifies the maintenance of both the service consumer and the
    decision service. In particular, it allows the implementation of the service (that
    is, the business rules) to be updated without requiring a modification to the
    service consumer.'
