- pgno: 17
  md: '# Preface


    # Complex-Event Processing


    Complex-event processing is a nontraditional style of building solutions. This
    style makes it possible to address problems that do not yield well to traditional
    approaches such as real-time situation analysis. More broadly, complex-event processing
    enables the enterprise to sense, analyze, and respond to its business situations
    in new and innovative ways—ways that provide extreme value and competitive advantage.


    In complex-event processing solutions, the word complex comes into play in two
    very different ways. The first refers to sensing, analyzing, and responding to
    what is going on. It''s not just, “Oh, this event occurred, therefore I need to
    do <some activity>.” It''s more complex than that: It requires correlating that
    event with other events and with contextual information in order to understand
    whether a situation of business importance exists, and then deciding what, if
    anything, needs to be done. Complexity in sensing, complexity in analyzing, complexity
    in responding.


    The other way that complexity applies is that complex-event processing involves
    a wide variety of computational techniques. There is no single approach to sensing,
    analyzing, and responding that is suitable for all types of situations. Each of
    the approaches has its own strengths and weaknesses, all of which need to be understood
    in order for you to craft your solution.


    # About This Book


    This book provides an introduction to the complex-event processing space and the
    computational approaches enabled by TIBCO BusinessEvents®. It is divided into
    four parts: Getting Started, Technology, Design Patterns, and Deployment.


    Part I, Getting Started, provides a conceptual overview of the complex-event processing
    space. It discusses how complex-event'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'processing can be employed in a business context to provide competitive differentiation,
    covers the terminology of complex-event processing, and explores the ways in which
    complex-event processing is different from traditional computing. It also explores
    a number of business applications for complex-event processing.


    Part II, Technology, covers the capabilities of the TIBCO Business Events™ product
    suite. It covers the TIBCO Business Events suite of products and presents a life-cycle
    overview of solutions based on these products. The TIBCO Business Events executable,
    a Java virtual machine (JVM), can be configured with combinations of five functional
    components: inference agents, cache agents, query agents, process agents, and
    dashboard agents. Inference agents process rules, and cache agents provide the
    information-sharing mechanism within TIBCO BusinessEvents. Query agents provide
    both snapshot and continuous queries of cached information. Process agents provide
    orchestration capabilities, while dashboard agents provide real-time visualization
    capabilities. The architecture and functionality of each type of agent are explored.


    Part III, Design Patterns, explores the building-block design patterns used in
    constructing complex-event processing solutions with TIBCO BusinessEvents. Patterns
    for recognizing situation changes, comparisons and changes to reference data,
    systems of record, handling duplicate inputs, run-time rule changes, and orchestrating
    actions are explored. Patterns for pattern recognition, integration, solution
    modularization, information sharing, locking, load distribution, and sequencing
    are covered.


    Part IV, Deployment, covers the architecturally significant aspects of putting
    a solution into production. The Nouveau Health Care case study is a realistic
    design problem that illustrates many of the issues an architect needs to address.
    It is used as an example to explore performance, modularization for deployment,
    managing the cache and backing store, defining deployment patterns, and monitoring.
    Design patterns for solution fault tolerance, high availability, and site disaster
    recovery are discussed, along with best practices for the conduct of complex-event
    processing projects.


    The organization of the book is shown in Figure P-1.


    # Online Examples


    Many of the examples in this book are taken from actual TIBCO BusinessEvents projects
    that are available online. All of these projects begin with the prefix ACEPST
    and can be found at informit.com/title/9780321801982.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_19_0.png)


    Figure P-1: Organization of the Book


    # TIBCO Architecture Book Series


    Architecting Complex-Event Processing Solutions with TIBCO® is the third book
    in a series on architecting solutions with TIBCO products (Figure P-2). It builds
    upon the material covered in TIBCO® Architecture Fundamentals, which provides
    material common to all TIBCO-based designs. Each of the more advanced books, including
    this one, explores a different style of solution, all based on TIBCO technology.
    Each explores the additional TIBCO products that are relevant to that style of
    solution. Each defines larger and more specialized architecture patterns relevant
    to the style, all built on top of the foundational set of design patterns presented
    in TIBCO® Architecture Fundamentals.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_20_0.png)


    Figure P-2: TIBCO Architecture Book Series


    # Intended Audience


    Project architects are the intended primary audience for this book. These are
    the individuals responsible for defining an overall complex-event processing solution
    and specifying the components and services required to support that solution.
    Experienced architects will find much of interest, but no specific prior knowledge
    of architecture is assumed in the writing. This is to ensure that the material
    is also accessible to novice architects and advanced designers. For this latter
    audience, however, a reading of TIBCO® Architecture Fundamentals¹ and Architecting
    Composite Applications and Services with TIBCO®² is highly recommended. These
    books explore integration and services along with the broader topics of solution
    architecture specification and documentation.


    TIBCO specialists in a complex-event processing center of excellence will find
    material of interest, including background on TIBCO BusinessEvents product suite
    and related best-practice design patterns. The material on performance and tuning
    lays the foundation for building high-performance applications based on the product
    suite.


    1. Paul C. Brown, TIBCO® Architecture Fundamentals, Boston: Addison-Wesley (2011).

    2. Paul C. Brown, Architecting Composite Applications and Services with TIBCO®,
    Boston: Addison-Wesley (2013).'
  merge: -1
  img_proc: true
