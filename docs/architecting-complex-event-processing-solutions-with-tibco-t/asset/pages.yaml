  md: '# HTTP Send Request Invocation


    This pattern uses the catalog HTTP function sendRequest(). It can be used for
    both conventional HTTP request-reply interactions and for SOAP interactions (Figure
    12-9). Care should be exercised when using this pattern, as the thread making
    the call is tied up while waiting for the reply. When there are many threads available,
    such as when executing a preprocessor function, the blocked thread may be only
    a condition to be considered when deciding the size of the thread pool. However,
    when the function is executed in the action part of a rule and the RTC is configured
    to be single threaded, all RTC processing will be blocked until the request completes.


    # TIBCO BusinessEvents® Process Orchestration


    # Web Service Invocation


    The TIBCO BusinessEvents Process Orchestration extension includes a Web Service
    task, which is used for synchronous service invocations (Figure 12-10). Recall
    that all tasks are executed by a pool of threads in


