  md: '# BusinessEvents Solution Life Cycle


    A TIBCO BusinessEvents solution begins its life in the TIBCO BusinessEvents Studio
    (Figure 4-13). Here the solution design is created and saved in an EAR file, and
    the deployment description is captured in a CDD file. These files are then picked
    up by the TIBCO Administrator. During deployment, the administrator communicates
    using TIBCO Rendezvous® or TIBCO Enterprise Message Service™ (EMS) with the TIBCO
    Runtime Agent (TRA) on each machine on which a processing unit will be deployed.
    The TRA places the required configuration information on the local machine’s file
    system, executes command lines to start and stop engines, and communicates with
    the engines to obtain status information.


    Figure 4-14 details the interactions between these components during the life
    cycle. The TIBCO BusinessEvents Studio is used to design the application, with
    the design being saved in an EAR file. It is also used to define the packaging
    of the application components for deployment, with this packaging being saved
    in a cluster deployment descriptor (CDD) file. From the TIBCO Administrator these
    files are uploaded. Once the EAR file has been loaded, its properties and global
    variables can be set in


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_91_0.png)


    Figure 4-13: TIBCO BusinessEvents® Administrative Architecture Pattern'
