- pgno: 58
  md: 'the enterprise has the infrastructure in place to recognize and raise the visibility
    of events as needed.


    +   - Immediately analyzing and interpreting events in an appropriate context.

    +   - Recognizing complex events.

    +   - Performing context-dependent analysis to determine appropriate actions.

    +   - Initiating required actions.


    These capabilities make it possible for the event-enabled enterprise to innovate
    in the way it senses, analyzes, and responds to the world around it. Such innovations
    help it to build competitive advantage and turn customers into fans.


    # Summary


    Events are occurrences, things that happen. Technical events are those that can
    be directly observed. Business events are those whose recognition has business
    value. Some business events correspond to a single technical event.


    Some events, known as complex events, are the result of an analysis that correlates
    one or more technical events with contextual information. The analysis determines
    whether something of business significance has occurred. Different parties may
    require different contextual information in order to determine the significance
    of the event.


    This type of analysis, involving correlation and reference data, is referred to
    as complex-event processing. It can be applied both to recognizing situations
    and to determining appropriate responses.


    Contextual information comes in many forms, including constants, reference data,
    and metadata. One of the significant challenges in complex-event processing is
    identifying the contextual information that will be required and ensuring its
    availability to support efficient real-time analysis.


    When events drive processes, the result is an event-driven process as opposed
    to a request-driven process. In a request-driven process a single party both recognizes
    that a situation has occurred and determines what the response should be. In an
    event-driven process these two roles are separated, with one party recognizing
    the situation and'
