  md: 'When this pattern is employed, the filtering and enrichment inference agent
    typically performs the filtering and/or enrichment in preprocessor functions and
    sends the resulting event directly to the output channel. This allows the agent
    to employ the shared thread pool for these activities. Very often there are no
    rules deployed to this agent.


    There is an additional consideration when using this pattern for enrichment: how
    the additional information is going to be conveyed to the rule execution inference
    agent. The best practice in this situation is to define a new type of event that
    contains both the information from the technical event and the additional information
    required for the processing. This new event becomes the type of the Business Event
    that is conveyed to the rule execution inference agent.


    # Using TIBCO ActiveMatrix BusinessWorks™ for Filtering and Enrichment


    When filtering and enhancement activity require access to other components and
    systems, it may be advantageous to use TIBCO ActiveMatrix BusinessWorks™ for these
    activities (Figure 13-6). The integration capabilities of ActiveMatrix BusinessWorks
    can significantly reduce the design time required to implement these functions,
    and the resulting efficiency is comparable to performing these activities in TIBCO
    BusinessEvents®.


