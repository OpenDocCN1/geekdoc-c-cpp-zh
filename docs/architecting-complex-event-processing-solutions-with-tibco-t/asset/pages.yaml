- pgno: 250
  md: '# Obtain Claim Status


    The behavior for Obtain Claim Status is shown in Figure 15-15.


    # Summary


    The Nouveau Health Care case study provides a coordinated set of example problems
    across the TIBCO Press architecture book series. The primary focus of the case
    study is the processing of health insurance claims. With the business model described
    in the case study, the processing of claims can be distributed across multiple
    parties. This creates the need for a Claim Tracker to centralize the status tracking
    for claims.


    The Claim Tracker is involved in three processes: (1) monitoring the claim processing,
    (2) obtaining and returning claim status upon request, and (3) reporting exceptions
    to a process that resolves the exceptions.


    The core of the Claim Tracker functionality is represented by a state machine
    associated with the Claim Status concept that is kept in the cache. This state
    machine shows the expected milestones of normal claim processing as well as exception
    states that are entered when service-level agreements are violated. Violations
    of these service-level agreements result in a Claim Processing Exception event
    being sent. The state machine also shows the recovery actions that are possible
    once an exception has occurred.


    Since most of the monitoring logic is embedded in the state machine, the processing
    of a Claim Status Notification is straightforward. If it is a new claim, the Claim
    Status concept is created. Otherwise, the existing status is retrieved from the
    cache. In either case, the object is locked and a Status Report appended containing
    the details of the report. The RTC cycle is then allowed to process the event
    and drive the transitions in the state machine.


    Timeouts in the state machine require their associated preprocessor functions
    to be specially registered. As with the normal processing, timeouts require the
    retrieval of the Claim Status from the cache and locking it prior to evaluating
    the state machine transitions in the RTC cycle.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Performance


    # Objectives


    Having the right functional capabilities doesn''t do you any good if your solution
    can''t meet the performance requirements. This chapter explores the design choices
    that impact performance, the tuning mechanisms available in TIBCO BusinessEvents®,
    and describes an approach to performance estimation. It concludes with some sizing
    rules of thumb that can be used in the absence of any detailed information. After
    reading this chapter you will be able to


    +   - Describe how the profiler can be used to obtain RTC performance data

    +   - Describe how design choices impact agent performance

    +   - Explain how to perform a demand analysis

    +   - List some rule-of-thumb sizing guidelines for development environments


    # TIBCO BusinessEvents® Profiler


    TIBCO BusinessEvents® contains a profiler that gives you performance information
    about the execution of the RTC cycle. This information can be used not only to
    understand where time is being spent, but also to compare the performance profiles
    of different rule designs.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'There are several ways in which the profiler can be turned on and off. These
    include the following:


    +   - TIBCO BusinessEvents Monitoring and Management: This application provides
    an interactive mechanism for turning profiling on and off.

    +   - Agent properties: The `be.engine.profile...` family of properties can be
    used to statically configure profiling. These properties are applied when the
    agent starts.

    +   - TIBCO Hawk®: Each agent has an embedded Hawk microagent interface that includes
    operations for turning profiling on and off. The Hawk console can be used to interactively
    control profiling, or Hawk rules can be written to turn profiling on and off when
    specific conditions exist.

    +   - Catalog functions: Catalog functions are provided that turn profiling on
    and off. These can be incorporated into preprocessor functions or rule actions.


    Profiling is an essential tool for understanding the performance implications
    of your design. However, just turning the profiler on will not necessarily provide
    you with the information you require. Many performance issues will not be apparent
    unless there are a significant number of objects in the memory and/or cache. You
    need to analyze your solution and determine the worst-case peak-condition number
    of objects, and then observe the behavior under those conditions. This may require
    a special test to simulate those conditions.


    # Design Choices and Agent Performance


    There are a number of design choices that can impact performance, including


    +   - Structuring rule conditions

    +   - Organizing decision tables

    +   - Accessing large XML event payloads

    +   - Locking objects

    +   - Choosing threading models

    +   - Using synchronous I/O calls in rule actions'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Structuring Rule Conditions


    There are three basic types of rule conditions: filters, equivalent joins, and
    nonequivalent joins. Filters are comparisons of object properties against fixed
    values. Filter operations consume minimal resources. An example is:


    ```

    transaction.amount <= 5.00;

    ```


    Equivalent joins compare values from two objects using an equality operator. The
    fact that a join is being performed makes it computationally more expensive than
    a simple filter operation, but the operator being used for comparison is relatively
    efficient. An example is:


    ```

    transaction.accountNumber == account.accountNumber;

    ```


    Nonequivalent joins compare values from two objects using an inequality operator.
    This is the least efficient type of condition. An example is:


    ```

    transactionA.amount < transactionB.amount;

    ```


    When you compile your project, creating an EAR file, TIBCO BusinessEvents sorts
    the conditions so that filter conditions are performed first, followed by equivalent
    joins, and then nonequivalent joins. However, there is no sorting performed within
    each of these categories: The conditions are evaluated in the order in which they
    appear in the rule definition.


    If you perceive that one condition will be more efficient than another, you should
    order the clauses accordingly. This is so important that if you have multiple
    equivalent joins in a rule, you will receive a log file warning that there are
    multiple equivalent joins in the rule. The warning is intended as a reminder that
    you need to carefully consider the ordering. This is a situation in which the
    use of the profiler is highly recommended—it will give you better insight as to
    what is actually going on in the RTC cycle.


    Beyond simply ordering the clauses, you have design choices in structuring your
    rule conditions. The normal best practice is to keep each type of condition separate,
    on its own line with a semicolon at the end. If you do this, the compiler will
    sort the conditions as described above. However, you have the option of combining
    clauses into larger expressions. This is commonly employed as a means of handling
    null values:


    ```

    Account.tinyTransaction != null && Account.tinyTransaction.

    amount < 5.00;

    ```'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'If you place multiple clauses in an expression, the clauses will be evaluated
    in the order specified. But be careful when you build compound expressions: You
    may be forcing a less-efficient evaluation. See Listing 5-2 for an example of
    such an inefficient design.


    # Organizing Decision Tables


    Decision tables are compiled into a decision tree that is used at runtime to compute
    the return values. This tree can be visualized in the TIBCO BusinessEvents® Studio.
    The tree will show you the order in which conditions are going to be evaluated.
    As with rule conditions, you want to organize your decision table so that filter
    conditions are evaluated before equivalent joins and equivalent joins are evaluated
    before non-equivalent joins. Exactly the same considerations apply as with rule
    conditions.


    Sometimes you will encounter situations in which performance will be better if
    you split a decision table into two or more tables. A common situation is one
    in which some of the input data fields are used to compute a score or ranking,
    and the result of this computation is used as part of the logic for the rest of
    the decision table. In such cases, execution will often be more efficient if the
    scoring is factored into one decision, and then the scoring result is fed to another
    decision table that makes the final decision (Figure 16-1).


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_254_0.png)


    # Accessing Large XML Event Payloads


    When a value in an XML event payload is accessed in a rule condition, an XPath
    expression is used to identify the value. This expression must be evaluated in
    order to obtain the value, and it is evaluated once for each appearance of the
    value in a conditional expression. Furthermore, the cost of this evaluation increases
    with the depth of the nesting in the XML data structure.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'When a particular value is accessed frequently, there may be benefits in adding
    a property to the event specifically to lessen the cost of accessing the value.
    A preprocessor function can be used to compute the value of the property at the
    time the event is created. With this approach, the cost of accessing the value
    in the XML structure is incurred once, and the value is now in a location where
    it can be accessed at minimal cost.


    # Locking Objects


    Whenever a mutable object is used in more than one rule or rule function, locks
    must be employed to ensure the integrity and consistency of the information in
    the object. Recall that locks can be either local to one agent or global across
    multiple agents, with local locks being more efficient than global locks.


    The placement of rules and rule functions will determine the type of locking required.
    If your design ensures that a given object will be accessed only by a single instance
    of an agent, then you can safely use local locking and gain the resulting efficiency.
    On the other hand, if you cannot guarantee that the object will only be accessed
    by one agent instance, you have no choice other than to use global locks.


    Global locking carries with it a performance penalty. Often the need for global
    locking arises when multiple agents of the same type are deployed to distribute
    the load. The goal is to increase capacity, but the added overhead of global locking
    can significantly detract from the expected gains. This is a situation in which
    content-aware load balancing (discussed in Chapter 14) can be employed to direct
    work to agents in such a way that local locks will provide adequate protection.


    # Choosing Inference Agent Threading Models


    There are three choices you have to make with regard to inference agent threading:
    pre-RTC, RTC, and post-RTC. Each choice has its own performance implications.


    # Pre-RTC Choices


    Each destination specifies the threads to be used in processing the events that
    arrive at the destination. These are the threads that not only'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'perform the preprocessor functions, but also execute the RTC cycle that follows.
    There are three choices:


    +   1. Shared pool threads (the default)

    +   2. Dedicated worker thread pool

    +   3. Caller thread


    The shared pool is shared across all destinations that select this option. At
    peak periods, events arriving at different destinations may compete for these
    threads. While convenient, this option does not guarantee the availability of
    threads to process inputs from a given destination.


    The dedicated worker thread pool is specific to the destination. Creating a dedicated
    pool guarantees the availability of threads to process events arriving at the
    destination. However, this approach is not magic. There are practical limitations
    on the number of threads a given Java virtual machine (JVM) can effectively support.
    This limit varies depending upon the hardware being used and the manufacturer
    of the JVM. In high-performance situations, some research and/or experimentation
    are warranted to understand these practical limits.


    The third option, caller thread, uses the thread that actually received the event
    for all of the preprocessing and RTC execution activities. The number of caller
    threads varies, depending upon the channel transport being used. Many of the channel
    callers, such as HTTP and TCP, are multi-threaded. Others, specifically the JMS
    channel, are single threaded. The use of the caller thread for JMS channels is
    a way of ensuring that the associated preprocessing and RTC execution is single
    threaded. This can be important when sequencing is a requirement.


    Just because you choose a threading model that has multiple threads does not necessarily
    mean that all of these threads are going to be actively processing inputs. Threads
    may be blocked for a variety of reasons: making synchronous I/O calls, waiting
    for object locks, or waiting to execute the RTC cycle if RTC is configured to
    be single threaded. All of this needs to be considered when choosing the threading
    model and determining the size of the thread pools.


    # RTC Choices


    There are two threading choices for RTC: single-threaded (the default) or concurrent.
    Choosing the concurrent option creates a situation in which multiple Rete networks
    (each running in a different thread) may be operating on the same working memory
    contents. Changes made by'
  merge: -1
  img_proc: true
