- pgno: 29
  md: '# Chapter 1


    # The Event-Enabled Enterprise


    # Objectives


    The pragmatic question that arises when discussing complex-event processing in
    a business context is, “Why?” What is it about this approach that makes it interesting
    as a business investment?


    Answering this question is the focus of this chapter. After reading this chapter
    you will be able to explain the concept of an event-enabled enterprise and describe
    how such an enterprise gains competitive advantage through innovations in its
    ability to sense, analyze, and respond to its business environment.


    # Extreme Value


    Enterprises, whether they are commercial companies or governmental agencies, exist
    to provide value to their constituents. Enterprises that cease to deliver value
    soon cease to exist. Those that continue to deliver modest value survive. Enterprises
    that deliver what Vivek Ranadivé refers to as extreme value soon outstrip their
    competition and prosper.


    One example of extreme value is the iPhone. When the iPhone was introduced in
    2007 it cost substantially more than basic cell phones.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Yet people bought the iPhone—even people who had barely enough money for food.
    Why? What value did the iPhone offer that was so compelling that people who arguably
    couldn’t afford them still bought them?


    The answer is that the iPhone (and other types of smart phone) enables people
    to interact with the world around them in new and innovative ways. It enables
    people to sense what is going on, analyze the situation, and respond to the world—and
    to do so in real time, anywhere they happen to be. The user senses in new ways,
    no longer just by receiving phone calls but now by receiving text messages, e-mails,
    social media posts, and alerts from apps as well. The user analyzes what is going
    on in new ways, not only by using their address book and other personal reference
    information but also by using web browsers, social media, and apps. The user can
    respond not only with phone calls but also by using this new technology to communicate
    with others, purchase products, and make reservations. The iPhone makes it possible
    for the user to sense, analyze, and respond to the world around them anywhere
    and anytime they choose. This is the extreme value delivered by the iPhone.


    So what makes extreme value important to your enterprise? Extreme value turns
    customers into fans—fans who prefer the products and services of your enterprise
    to the exclusion of its competitors. Fans whose attitude is, as the 1960s commercial
    put it, “I’d rather fight than switch!” (Figure 1-1). Fans whose loyalty to your
    enterprise fosters its growth and profitability. So how can complex-event processing
    enable your enterprise to deliver extreme value?


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_30_0.png)


    Figure 1-1: “I’d Rather Fight than Switch!”'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Sense, Analyze, and Respond


    What provides the user of the iPhone with extreme value is the ability to innovate,
    particularly in how the user interacts with the world. Enterprises can benefit
    by innovating in similar ways—specifically, in how they sense, analyze, and respond
    to the needs of their customers and business partners.


    Enterprises deliver value to their customers through their business processes.
    If you think about how a business process does this, each process senses something
    that is going on, analyzes the situation to determine whether action is required
    and what action to take, and responds by executing those actions. The enterprise
    senses an order from a business, analyzes the order by validating it and checking
    the company''s credit, and responds by shipping the requested goods and invoicing
    the business. The enterprise senses a change in stock inventory, analyzes it to
    determine whether new inventory needs to be ordered, and orders replenishment
    stock if necessary. Everything the enterprise does is through business processes,
    and business processes are nothing more than an organized way of sensing, analyzing,
    and responding to the enterprise''s ecosystem.


    A significant way in which an enterprise can gain competitive advantage is by
    improving its business processes. Businesses respond faster, offering next-day
    or same-day delivery instead of asking customers to wait six to eight weeks. Businesses
    sense customer needs and provide value-added services. Auto dealerships locate
    suitable financing for their customers, saving their customers time and trouble.
    Businesses develop an understanding of customer preferences. Retailers leverage
    customer loyalty programs to make targeted offers that not only please the customer
    by only making offers for things they are truly interested in, but also increase
    the efficiency of the marketing process and thus lowering the cost of sales.


    Every business process improvement is a change to the way in which that process
    senses, analyzes, and responds to the world around it. Sometimes this means doing
    things faster—doing them now. Sometimes this means doing them better—having the
    right information at the right time. Sometimes this means doing it cheaper—using
    more cost-effective resources to get the job done. Gaining competitive advantage—the
    two-second advantage—requires improving business processes through innovation
    in sensing, analyzing, and responding.'
