- pgno: 164
  md: '# TickerTracker Example


    The TickerTracker example, distributed with the TIBCO BusinessEvents Views product,
    illustrates the use of metrics and the dashboard agent by showing how stock market
    information might be displayed. The example listens to Ticker events (Figure 9-4),
    which contain the ticker symbol, the trading price of the shares, the number of
    shares traded, and the full company name.


    The preprocessor of the inference agent receives this event and updates the M_TickerTracker
    metric shown in Figure 9-5. The Price and Volume metric fields are aggregation
    fields, with each incoming price and volume being added. The Ticker, which is
    the stock market ticker symbol, is a group-by field: the Price and Volume are
    grouped by the ticker symbol with which they are associated. Finally, the CompanyName
    is a tracking field that has a URL providing a link to company information.


    The resulting dashboard display is shown in Figure 9-6. The latest price and volume
    information are shown in both the table and the graph.


    Clicking on any row of the table or column in the graph will bring up a display
    of the complete metric, showing the full set of price and volume data associated
    with the metric (Figure 9-7).


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_164_0.png)


    Figure 9-4: TickerTracker Ticker Event


    Figure 9-5: M_TickerTracker Metric Definition


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_164_1.png)'
