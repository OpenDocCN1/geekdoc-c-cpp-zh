- pgno: 214
  md: '# Partitioning Situation Recognition from Action


    The characteristic pattern of an event-driven process (Figure 2-11) is also a
    best practice for partitioning logic in a design (Figure 13-1). In this pattern,
    the logic of recognizing that a particular situation exists is separated from
    the logic of what to do now that the situation has been recognized. The recognition
    that the situation exists is announced by sending an event, and the subsequent
    action is triggered by the arrival of that event.


    When situation recognition and the execution of the action both involve complex
    logic, mixing the logic together makes it difficult to clearly understand the
    logic behind either. Partitioning the two not only adds clarity but simplifies
    logic maintenance as well. It also makes it trivially easy to add additional actions
    in response to the event.


    Partitioning in this manner does not necessarily require that the two roles are
    being played by different agents. The situation announcement event could be locally
    asserted by an inference agent, triggering separate rules in the same agent that
    manages the required action (Figure 13-2). In this case, the partitioning primarily
    provides a modularization of the rules for ease of understanding and maintenance.


    A second alternative is to deploy the rules to two agents running in the same
    processing unit using a local channel for communications (Figure 13-3). Since
    each agent has its own working memory, the management of working memory can be
    simpler, provided different concepts are needed for recognition and action. Since
    each agent has its


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_214_0.png)


    Figure 13-1: Partitioning Situation Recognition from Taking Action'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_0.png)


    Figure 13-2: Partitioning with Single Agent Deployment


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_1.png)


