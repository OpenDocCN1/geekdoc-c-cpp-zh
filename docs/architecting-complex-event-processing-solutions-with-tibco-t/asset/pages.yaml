    # Rule Management Server (RMS)


    Rule templates and decision tables set the stage for run-time changes, but the
    actual run-time modification is achieved using the Rules Management Server (RMS).
    The life cycle of a solution is a bit different when RMS is used (Figure 10-13).
    RMS projects are placed in a specially configured directory (details are in the
    *Developer’s Guide*), and the EAR file is actually generated by the Rules Management
    Server. This makes the project RMS-aware and sets the stage for run-time modification
    of rule templates and decision tables.'
