- pgno: 157
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_157_0.png)


    # Figure 8-5: Process Agent Behavior


    When a process execution thread becomes available, it takes one task from the
    head of the queue and executes it. If the task implicitly requires a checkpoint
    or has the checkpoint box checked, the process is checkpointed to the cache and,
    if configured, the backing store as well. Any object locks that have been acquired
    are released, and any pending message receipt acknowledgments are sent.


    A checkpoint is the full state of the process at the moment the checkpoint is
    taken. It contains the state of the process''s execution and the values of all
    variables associated with the process. Processes are managed using the cache-only
    approach (described in Chapter 6), and checkpointing is the update of the cached
    copy.


    A checkpoint is performed whenever any of the following conditions occurs.


    +   - A task is performed that has its Checkpoint box checked

    +   - A Send Message task is executed

    +   - A Receive Message task is executed

    +   - A Call Activity is executed

    +   - A Gateway task is executed (a fork, join, or conditional branch)

    +   - A process ends'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_158_0.png)


    **Figure 8-6:** *Process Agent Deployment*


    It is important to note that whenever a checkpoint occurs, all locks that the
    process has obtained are released. Should a process agent fail or be shut down
    before a checkpointed process finishes executing, the process will be recovered
    by the next process agent that starts.


    # Deployment


    Due to potential conflicts in cached object identities, process agents cannot
    be deployed in the same cluster as inference agents (Figure 8-6). Thus a solution
    requiring both inference and processing agents would require a separate cluster
    for each, with each cluster having its own cache agents.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Summary


    Process agents provide the ability to orchestrate tasks, including those that
    require asynchronous interactions. The processes executed by the agent are defined
    using a subset of the industry-standard BPMN notation.


    Each process has a starter task. Some starter tasks identify a type of event whose
    occurrence will cause the creation of a process instance. Processes without such
    tasks are explicitly invoked either with a Call Activity from another process
    or as a start-up or shutdown activity for a process agent.


    Once a process has been started, its tasks that are ready to run are placed on
    a queue. When a process execution thread becomes available, it takes a task off
    the queue and executes the activity.


    Processes are managed as cached objects. Certain tasks in the process initiate
    checkpoints that update the cache. Any locks that have been obtained by the process
    are released when a checkpoint occurs. Should a process agent be shut down or
    fail before a checkpointed process completes, the next process agent that starts
    will recover any incomplete processes.


    Process agents cannot be deployed in the same cluster as an inference agent.'
  merge: -1
  img_proc: true
