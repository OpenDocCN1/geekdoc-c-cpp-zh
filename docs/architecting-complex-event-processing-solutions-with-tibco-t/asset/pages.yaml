- pgno: 265
  md: '# Deployment Planning


    # Objectives


    When planning the deployment of a complex-event processing solution based on TIBCO
    BusinessEvents®, there are a number of things that you, the architect, need to
    define. How should the functionality be modularized? How should objects be managed
    and persisted? What is your intent regarding the actual deployment of the solution?
    What are the deployment requirements for supporting run-time configurability?
    What do you need to consider in terms of monitoring your solution?


    This chapter focuses on these issues. After reading this chapter, you will be
    able to describe what the architect needs to say about the following:


    +   - Modularization

    +   - Object management configuration

    +   - Deployment patterns

    +   - Deployment requirements for run-time configurability

    +   - Monitoring'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Modularization


    When you modularize a design, you are defining a decomposition of your design
    into units that are more readily maintained, managed, and tuned. The modularization
    of your design can be as important as the functionality itself in determining
    the success of your solution.


    # Modularization Units


    There are three levels of modularization in a TIBCO BusinessEvents® solution (Figure
    17-1). At the highest level is the cluster. Each cluster contains one or more
    processing units, and each processing unit contains one or more agents.


    Each solution requires at least one cluster, and some may involve more than one.
    For example, a solution using both inference agents and process agents must have
    at least two clusters, since inference agents and process agents cannot be deployed
    in the same cluster. For performance reasons, a solution in which dashboard agents
    are being used for visualization should have a separate cluster for the agents
    involved in managing the visualization (including inference, cache, and dashboard
    agents). These should be in a cluster separate from the cluster executing the
    functional part of the solution.


    Modularization is largely about the packaging of functionality. It reflects your
    decisions about where different blocks of functionality


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_266_0.png)


    Figure 17-1: TIBCO BusinessEvents® Modularization Units'
  merge: -1
  img_proc: true
- pgno: 267
  md: '(e.g., rules and rule functions) should be located. How many different types
    of agents should there be, and what functionality goes in each? How many different
    types of processing units should there be, and which types of agents go in each
    processing unit? And, finally, how many clusters are required, and which types
    of processing units go in each cluster?


    There’s more to modularization than just packaging decisions. When you place blocks
    of functionality that need to interact in different modules, you also need to
    define how these units will interact, and what events and/or concepts need to
    be exchanged. When events are exchanged, you need to define the channels and destinations
    that will be used for their delivery.


    # Agents


    In the cluster deployment descriptor for each cluster you define the classes of
    agents that are available for deployment. The simplest approach to modularization
    is simply to have one class for each type of agent (inference, cache, query, process,
    and dashboard). However, this may not be suitable for more complex designs. Performance
    considerations often warrant a partitioning of functionality, resulting in different
    classes for some types of agent.


    Partitioning keeps one block of functionality from competing with another for
    the same resources. Generally, when you partition functionality into different
    classes, the intent is that each class will eventually be deployed in a different
    processing unit and possibly on a different machine as well. By deploying in this
    manner, instances of the classes can be scaled and tuned independently.


    For example, if you were to employ the partitioning patterns discussed in Chapter
    13, you might end up defining three different inference agent classes (Figure
    17-2). One of the classes, the Filtering IA, executes the filtering and enrichment
    logic. A second, the Situation Recognition IA, executes the logic necessary to
    recognize the situation. A third, the Action IA, executes the logic necessary
    to determine what actions are required.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_267_0.png)


    **Figure 17-2:** *Partitioning Functionality across Multiple Inference Agents*'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_268_0.png)


    **Figure 17-3:** *Claim Tracker Agent Modularization*


    Figure 17-3 shows the Claim Tracker agent modularization. There are three blocks
    of functionality: Monitor Claim Processing, SLA Timeout Processing, and Obtain
    Claim Status. TIBCO BusinessEvents requires that the timeout processing for a
    state machine be executed in the same inference agents as the normal transition
    processing, thus the Monitor Claim Processing and SLA Timeout Processing are co-located
    in the Monitor Claim Processing IA.


    As was determined in Chapter 16, initial estimates are that the solution will
    require twelve agents to support Monitor Claim Processing and two to support SLA
    Timeout Processing, so a total of fourteen Monitor Claim Processing IA agents
    will be required. Seventeen Claim Tracker Cache Agents will be required, each
    with its own backing store file. A single Obtain Claim Status IA agent is needed.


    # Processing Units


    Processing units are the engines of a TIBCO BusinessEvents solution. Some decisions
    about how many types of processing units to have in a'
  merge: -1
