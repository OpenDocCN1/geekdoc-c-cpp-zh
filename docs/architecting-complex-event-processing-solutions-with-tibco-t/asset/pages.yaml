- pgno: 47
  md: 'Correlating events with reference data can provide a broader analysis perspective.
    Using the account number from an event to access other information about the account
    or using the customer ID to access information about the customer permits this
    related information to be used as part of the analysis.


    Perhaps the richest form of correlation is between an event and a model of the
    behavior that is expected to be observed. A model of the proper execution of a
    business process that identifies the events that should be observed during its
    execution provides an excellent reference for interpreting the events that actually
    occur. This perspective makes it possible to determine whether the process is
    executing as planned.


    Analysis often combines multiple types of correlation. For example, you might
    want to analyze the calls coming in to a customer support center to identify customers
    that are having an unusually hard time getting a problem resolved. Given an initial
    event indicating an incoming call, you might correlate the telephone number in
    the event with customer records to identify the customer who is calling. You might
    also correlate this event with other incoming call events to see whether there
    were other calls from the same customer within the past hour. If you find three
    or more events correlated in this way, you might conclude that the customer is
    having a significant problem and take action by escalating the call to a supervisor.
    Note that by correlating each call with a customer, you set the stage for recognizing
    and correlating other calls from that same customer that happen to have originated
    from different phones (for example, home, mobile, work).


    Correlation is fundamental to CEP analysis. As such, when you undertake a CEP
    project it is prudent to focus your initial attention on identifying the things
    that need to be correlated and the basis upon which they will be correlated. This
    understanding will then guide the design of your data structures and inform the
    rest of your design.


    # Context


    The analysis of an event always requires some form of contextual information.
    The previous examples involved context, such as reference data and expected-behavior
    models. In general, context falls into three broad categories:


    +   1. Constants

    +   2. Data

    +   3. Metadata'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Constants


    Constants are typically used as thresholds for making decisions. The $5 and $10,000
    dollar values used earlier are typical examples. Values that are used as thresholds
    for decisions are often somewhat arbitrary and may be subject to change as conditions
    vary and understanding evolves. It is thus important to identify whether the values
    might, in fact, change over time.


    Your understanding of whether values are subject to change will alter your design
    thinking. You can bake constants into the design, but if you do so the only way
    to subsequently change them is to modify and redeploy the design. It’s an IT project.


    A more flexible approach is to design your solution in such a way that the values
    can be changed at runtime without modifying the design. This might involve values
    that are looked up (and possibly cached) at the time they are used. To address
    this type of requirement, TIBCO BusinessEvents has a special construct, a rule
    template, that enables reference values to be modified at runtime. Whatever approach
    you choose, if values are subject to change it is prudent to design in the change
    mechanism.


    # Data


    The most common type of context is data. There is a lot of data in use in the
    enterprise that can be used to support analysis. Some of this is relatively static
    reference data: customer data, product data, partner data, and so on. Other data
    is dynamically changing transactional data: orders, shipments, inventory, and
    so on.


    Whether it is reference data or transactional data, you have to consider where
    the data is coming from, how you are going to gain access to it, and how you are
    going to stage the data for efficient use in analysis. Efficiency often requires
    that copies of the data be cached for convenient access, but, of course, the accuracy
    and consistency of the cache then come into play.


    Another form of data that is often required is a recent history of events, either
    the events themselves or summaries of information about those events. For example,
    the number of transactions that have occurred in the past hour or the dollar volume
    of those transactions may be of interest in interpreting current events.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Metadata


    Metadata is information about data. A common form of metadata you are probably
    familiar with is a schema: information about the structure of data. In complex-event
    processing, other forms of metadata come into play.


    One useful form of metadata in CEP is the structure of a data query. The query
    specifies how to identify a set of data relevant to the current analysis. The
    metadata of the query (i.e., the definition of the query) can be encoded directly
    into the analysis logic at design time, but this requires that you be able to
    formulate the query in advance. There may be times when the query cannot be formulated
    in advance: The information needed to define the query will not be available until
    runtime, either because of dynamic changes in business logic or because the query
    is based on current information. TIBCO BusinessEvents supports both approaches,
    allowing queries to be defined both at design time and at runtime. These approaches
    are discussed in Chapter 7.


    Another type of CEP metadata is the description of expected behavior, expressed
    as an expected pattern of events. This pattern description then provides the context
    for recognizing the pattern as it occurs, or fails to occur. As with queries,
    some patterns can be defined at design time, while others cannot be defined until
    runtime. Chapter 11 shows how TIBCO BusinessEvents supports both approaches.


    Yet another form of CEP metadata is a process description. TIBCO BusinessEvents
    has two different metamodels for describing processes. State models, described
    in Chapter 5, are well suited to monitoring unmanaged processes and determining
    whether they are executing properly. Business Process Modeling Notation (BPMN)
    models, described in Chapter 8, are well suited for orchestrating (managing) process
    execution.


    # Analysis Requires Context


    It should be obvious by now that there is no analysis without appropriate contextual
    information. The type of contextual information may vary, from constants to data
    to metadata, but context provides the basis for'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'analysis. Making sure that the required contextual information is readily available
    for an efficient analysis is a major requirement for every CEP solution architecture.


    It is not uncommon for the same event to be analyzed for different purposes. For
    example, a phone call from a customer to a magazine publisher may be of interest
    to the customer service department, but it may be of interest to the marketing
    department as well. Each of these purposes may require different contextual information
    to support the associated analysis (Figure 2-6). While both departments need to
    understand who the customer is (assuming it is a customer), the call center is
    interested in knowing whether there were any prior calls from this customer, who
    handled them, and to whom they were forwarded. The marketing department, on the
    other hand, is interested in knowing whether any of the customer''s subscriptions
    are about to expire so that it can take advantage of this opportunity to offer
    a subscription renewal.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_50_0.png)


    Figure 2-6: Contextual Information for a Call Event to a Magazine Publisher'
