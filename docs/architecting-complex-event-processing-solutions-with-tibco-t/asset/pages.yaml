- pgno: 140
  md: 'reside in working memory and never enter the cache. In Cache-Only mode, objects
    reside in the cache and must be explicitly brought into working memory when needed.
    In Cache + Memory mode, objects reside in both working memory and the cache. This
    mode must be used with caution, as any change to an object may trigger every rule
    in every agent that uses that object.


    Because objects can be accessed from multiple agents or multiple threads within
    one agent, a locking mechanism is required. The locks provided by TIBCO BusinessEvents
    are logical: The objects themselves are not locked, key values are. A convention
    associates the key being locked with the object, with the common convention being
    the use of the object''s extID as the lock key. Programming discipline is required
    to ensure the consistent use of locks.


    The cache provides the ability to replicate objects in memory, with each copy
    of the object residing in a different cache agent. This guarantees that the object
    will survive the loss of a cache agent.


    Objects in cache may be optionally persisted, either in a database (Shared-All
    option) or in files (Shared-Nothing option). With Shared-All, there are two sub-modes:
    Cache-Aside and Write-Behind. With Cache-Aside, the inference agent does the database
    update, while in Write-Behind the cache agent does the database update. In the
    Shared-Nothing option, each cache agent persists the objects in its memory to
    a separate file.'
