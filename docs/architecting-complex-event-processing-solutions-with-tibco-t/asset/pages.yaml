    Figure 5-15 shows the state after the T2 is introduced. Note that the results
    from processing T1 still present. T2 passes through the type filter and ends up
    in the type filter result set. Since Rete processing is driven entirely by changes,
    only the newly present T2 will be processed by the C1 and C2 filters, and T2 ends
    up in the C2 result set now. The C3 equivalent join has two transactions to compare.
    Since they have the same account value, the pair T1 and T2 end up in the C3 result
    set. The appearance of the pair now triggers the evaluation of the C4 non-equivalent
    join. Since the time conditions are met, the pair end up in the C4 result set.
    The presence of results in the C4 result set now triggers the execution of the
    actions associated with the fraud rule.


