- pgno: 25
  md: '# About the Author


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_25_0.png)


    Dr. Paul C. Brown is a Principal Software Architect at TIBCO Software Inc. His
    work centers on enterprise and large-scale solution architectures, the roles of
    architects, and the organizational and management issues surrounding these roles.
    His total architecture approach, the concurrent design of both business processes
    and information systems, can reduce project duration by 25 percent. He has architected
    tools for designing distributed control systems, process control interfaces, internal
    combustion engines, and NASA satellite missions. Dr. Brown is the author of *Succeeding
    with SOA: Realizing Business Value Through Total Architecture* (2007), *Implementing
    SOA: Total Architecture in Practice* (2008), *TIBCO® Architecture Fundamentals*
    (2011), *Architecting Composite Applications and Services with TIBCO®* (2012),
    and *Architecting Complex-Event Processing Solutions with TIBCO®* (2014), all
    from Addison-Wesley, and he is a coauthor of the *SOA Manifesto* (soa-manifesto.org).
    He received his Ph.D. in computer science from Rensselaer Polytechnic Institute
    and his BSEE from Union College. He is a member of IEEE and ACM.'
