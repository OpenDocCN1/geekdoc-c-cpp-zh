    # Event-Enabled Enterprise Capabilities


    The concepts discussed in this chapter provide a straightforward way to explain
    the capabilities of the event-enabled enterprise. The event-enabled enterprise
    is capable of the following:


    +   - Recognizing and announcing events. This does not necessarily mean that every
    event is recognized and announced. It means that'
