    # Simple Event Recognition May Be Inadequate


    Sometimes the business significant situation you are trying to recognize doesn’t
    correspond to a single event that can be observed. If you are looking for potential
    fraud on an account, a single failed login may not be significant: Users frequently
    make mistakes entering their userids and passwords. What is significant is that
    there have been repeated failed login attempts within a short period of time:
    for example, three failed logins in five minutes. In order to recognize the business-significant
    situation, the present event (the latest failed login attempt) must be correlated
    with earlier failed-login events. Events that require some kind of analysis in
    order to recognize an event of business significance are called complex events,
    a topic that will be discussed in more detail shortly.


    # Categories of Events


    Events can be categorized in a number of ways. These categorizations often impact
    the approach you will use to sense, analyze, and respond to the events, so these
    must be kept in mind as you conceptualize your solutions.


    # *Technical and Business Events*


    Events that can be directly observed are called *technical events*. Typically
    what is detected is a state change (e.g., a database update) in an application
    or a communication between components. *Business events* represent occurrences
    that are of business significance. But there is not always a 1:1 correspondence
    between technical and business events.


    Some technical events represent occurrences that are of business significance,
    others (in fact, the majority of technical events) do not. Every click on every
    link on a website and every message being sent between systems is an occurrence
    that can be observed. However, only a subset of these technical events will likely
    be of business significance.


    # *Simple and Complex Events*


    A *simple event* is a business event that is also a technical event. But some
    business events don’t correspond to a single technical event: Their'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'recognition is the result of an analysis that determines something of business
    significance has occurred. Events that require this type of analysis are referred
    to as *complex events*.


    # *Point and Interval Events*


    Usually when you think about an event you associate the occurrence of the event
    with a point in time: the time at which the order was submitted or the time that
    the power failed. Generally, this is the time at which a technical event was captured.
    Such events are referred to as *point events*.


    Some events, however, occur over a period of time. For example, the TIBCO User
    Conference (TUCON) is an event that takes place over several days. A television
    show happens over the course of 30 minutes or an hour. Events that occur over
    some period of time are *interval events*.


    Why is this distinction important? It is important when you need to compare the
    temporal relationships between two events: Comparing interval events is more complicated
    than comparing point events. For a pair of point events, there are only three
    possible relationships: before, simultaneous, or after. For interval events, there
    are fifteen possible relationships between two events (Figure 2-2). The last two
    relationships are special cases in which one of the events has degenerated into
    a point event that is coincident with either the start or the end of the remaining
    interval.


    # Missing Events


    Sometimes the business-relevant event you are looking for is the observance that
    some other event was not observed, at least when it was expected. These cases
    arise when there is a service-level agreement regarding when an event should occur
    and the expected event does not occur within this time interval. Typically the
    beginning of this time interval coincides with some previous event: The clock
    marking the deadline for delivering a product starts when the order is placed.


    Sometimes the recognition is more complicated: An event is supposed to occur at
    some regular intervals, and the observance is that the expected events have been
    absent for some period of time. This is a common approach to liveness testing:
    A component sends a heartbeat at regular intervals indicating that it is operating
    properly. The absence of these heartbeats for some period of time is an indication
    that there is a problem.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_42_0.png)


    **Figure 2-2:** *Possible Relationships between Two Intervals*


    Note that the event marking the recognition of a missing event is always a complex
    event: Its generation is the result of an analysis triggered by another event,
    namely the expiration of a timer. The analysis indicates that the expected event
    has not occurred and results in the generation of an event marking this recognition.


    # Complex Events


    A complex event is one whose recognition requires analysis (Figure 2-3). The analysis
    itself is triggered by the arrival of an event that serves as the triggering event
    for the analysis. The expiration of a timer, for example, might serve as the triggering
    event for an analysis that determines whether an expected event has actually occurred.
    The triggering event, which could be either a technical or business event, is
    an indication that some state of the world has changed and consequently an analysis
    is warranted.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_43_0.png)


    **Figure 2-3:** *Complex Event*


    The complexity and nature of the required analysis varies greatly. Sometimes the
    analysis is simple: It just examines the current event to determine its business
    significance. For example, the current event might be a banking transaction, and
    the analysis determines whether the transaction amount exceeds $10,000 and therefore
    requires the filing of a Currency Transaction Report with the Internal Revenue
    Service.² Sometimes the analysis is complex, determining whether a pattern indicating
    fraud has been recognized or whether a process is executing as it should. There
    are, in fact, many types of analysis that could be performed, each appropriate
    for recognizing a different kind of situation. In fact, it is the variety of possible
    types of analysis that lead to the varied feature set of TIBCO BusinessEvents®.


    # Complex-Event Processing (CEP)


    Complex-event processing is a term used to describe the computational activity
    that is driven by events. The analysis leading up to the recognition of a complex
    event is one example of complex-event processing. The orchestration of actions
    taken subsequent to event recognition also falls into this category.


    Complex-event processing is challenging for several reasons. One is the rate at
    which events can occur. Twitter processes hundreds of millions of messages per
    day, which poses challenges for applications trying to track the nature of the
    dialogs on Twitter. During peak periods, Visa processes upwards of 20,000 transactions'
