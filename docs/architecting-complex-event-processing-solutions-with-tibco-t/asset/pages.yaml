    Figure 10-14: Asynchronous Request-Response State Machine


    Timeout occurs. Receiving the Response event completes the execution of the state
    machine. If a Timeout occurs, a Timeout Alert is sent, but the subsequent behavior
    still needs to be added to this state machine. It is important to explore recovery
    behaviors for critical processes while your design is still in its formative stages;
    these behaviors can be difficult to retrofit into a design.


    # Logging and Exception Reporting


    Virtually every solution you define will require some form of logging and exception
    reporting. Each processing unit has a log file configuration defined in the CDD
    file for the cluster. The choice of logging levels determines the amount of information
    logged. The CDD file defines the default level, but the logging level can be changed
    at runtime using the Hawk AMI interface or the BEMM interface.


    The Data Grid underlying the cache agent is an implementation of TIBCO ActiveSpaces®.
    Its log settings are set via the CDD properties (see the Developer''s Guide for
    details).


    For inference, query, and process agents, additional reporting can be managed
    via rule functions. Here, logic can be added to either generate events or make
    log file entries. However, be sure to consider the performance implications—disk
    activity can slow down a design!


    # Naming Guidelines


    In an event-driven system, there is a tendency to name rules and rule functions
    in a way that identifies the event or situation that triggers their execution.
    Unfortunately, in terms of understanding a design, this'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'type of naming is not particularly useful: You end up having to look at each
    rule and rule function in order to understand what it does. This leads to the
    following best practice recommendations:


    +   - The name of a rule should indicate the type of situation being recognized
    by the conditions of the rule.

    +   - The name of the rule function should indicate the intended use of the rule
    function. In particular, rule functions intended to be used as preprocessor or
    start-up functions should be labeled as such.

    +   - The name of the event should identify the situation whose existence is being
    announced by the event.


    # Summary


    Changes in situations can be recognized in many ways. Trivially, an event may
    itself announce the change. In more complex situations, you may need to compare
    the event’s representation of current status against reference data to determine
    whether a change has occurred.


    If the reference data is not static, the event that you are comparing against
    the reference data may also result in a reference-data update. Here, the coordination
    of the comparison and the reference data update must be considered, as well as
    the system-of-record for the reference data.


    When the situation being monitored is complex, the use of a state machine or continuous
    query may be warranted.


    Abrupt shutdowns when JMS messaging is being used for input events can lead to
    the duplicate delivery of messages. Duplicates can be detected by adding a JMSRedelivered
    property to the incoming event. This property can then be used to trigger additional
    logic to determine how much prior work had been completed and adjust activity
    performance accordingly.


    Some situations require changing business logic at runtime. TIBCO BusinessEvents
    provides two mechanisms that provide this capability: rule templates that allow
    constant values in rules to be altered and decision tables that allow the mapping
    of input data to results to be modified at runtime.


    Some situations require multiple activities to be performed. There are several
    approaches that can be used to coordinate these activities: Execute all the activities
    in the action part of a rule; use a separate rule for each action, possibly using
    priority and rank to control the'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'sequence of execution; or use an external orchestration component. In the latter
    case, if the process is critical, a state machine can be used to manage the dialog
    with the coordination component and detect breakdowns.


    TIBCO BusinessEvents has built-in logging that can be configured in the CDD file.
    Additional logging and exception reporting can be added via rule functions in
    inference, query, and process agents.


    Naming best practices will make your design easier to understand. The name of
    the rule should indicate the condition recognized by the rule. The name of a function
    should indicate its intended role in the solution. The name of an event should
    identify the situation whose existence is being announced by the event.'
  merge: -1
