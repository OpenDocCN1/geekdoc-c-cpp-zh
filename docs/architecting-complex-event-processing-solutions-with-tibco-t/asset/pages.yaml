  md: 'Event responses are generally determined by business rules. Sometimes the rules
    are not obvious because they are embedded in established practices. In such cases
    some effort will be required to understand and extract the business rules in preparation
    for re-implementing them as part of your solution. In other cases the business
    rules may be codified in well-defined formulas, decision trees, or decision tables
    ready for incorporation into the solution.


    An event response in a CEP solution has a structure similar to that of an event
    analysis (Figure 2-8). The arrival of an event indicating that some situation
    exists (which could be either simple or complex) triggers an analysis to determine
    what the appropriate response should be for this situation. That analysis generally
    requires some contextual information. The results of the analysis are the events
    that trigger actions—the enterprise responses to the triggering event.


    A trivial example is a business rule that says if the order amount exceeds $500,
    then an approval is required. The triggering event is the arrival of the order.
    The analysis is simply a comparison of the order amount with the threshold value.
    Depending upon your design decisions, the threshold value itself may be fixed
    in the analysis logic or it may be a piece of contextual information. The action
    is to initiate the approval process if required.


    Trivial as this example is, it does raise an interesting design question with
    respect to the approval: To what extent should the component doing the response
    analysis also be responsible for ensuring that the follow-on approval activity
    is performed? Deciding which component is responsible is an important question
    for the solution as a whole, as the answer will impact the robustness of the solution.


    A richer example is a business rule stating that unless 99% of the received data
    is valid, the data should be rejected. Here the triggering event is the arrival
    of the data. However, validating the data will likely


