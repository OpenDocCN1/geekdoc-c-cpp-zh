- pgno: 273
  md: '# Deployment Patterns


    The performance analysis you have performed and modularization decisions you have
    made are not, in themselves, sufficient to ensure that your solution, when deployed,
    will meet the performance goals. In order to ensure this, you need to indicate
    your intent with regard to the deployment of the solution components on machines,
    indicating which components can share machines and which should be on separate
    machines. You should also indicate the minimum class of machine required.


    While the deployment pattern may be trivial, it is important to clearly communicate
    your design intent in terms of how the application should be deployed. Figure
    17-6 shows the intended deployment for the Claim Tracker solution. This clearly
    shows that each processing unit should be deployed on a separate machine.


    Table 17-2 shows the intended configuration for each machine used in the Claim
    Tracker deployment pattern and the number of each that will be required.


    In addition to specifying the initial deployment, it is prudent to give guidelines
    on how capacity can be scaled. In the Claim Tracker example, each Cache Machine
    is holding the status information for 4.26 million claims. The initially deployed
    capacity is thus 76.7 million claims, and the initial demand is expected to be
    for 70.4 million claims. As the demand begins to approach the deployed capacity,
    additional Cache Machines can be deployed, each adding a capacity of 4.26 million
    claims.


    Similarly, each Monitoring Machine can process 425 events/second, giving a capacity
    of 5,950 events/second. Initial demand is expected to be 5,356 events/second (4,736
    normal events + 620 timeout events). As demand grows, Monitoring Machines can
    be added, each adding a capacity of 425 events/second.


    **Table 17-2: Claim Tracker Machine Configuration**


    | Machine | RAM | CPU | Number Required |

    |---|---|---|---:|

    | Monitoring Machine | 16GB | 8 core | 14 |

    | Cache Machine | 64GB | 8 core | 18 |

    | Claim Status Machine | 16GB | 8 core | 1 |

    | EMS Machine | 8GB | 4 core | 1 |'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_274_0.png)


    Figure 17-6: Claim Tracker Deployment


    The EMS server, properly configured, should be able to handle 10,000 messages/second
    with asynchronous persistence. The initial solution demand will be 5,356 messages/second.
    It is not anticipated that the message volume will exceed the capacity of the
    server. Should this occur, message traffic would have to be partitioned.


    Some of the EMS message traffic is coming from business partners. Further design
    is required for the business partner communication.


    # Deployment Requirements for Run-Time Configurability


    Rule templates and decision tables provide the ability to modify decision logic
    at runtime. However, doing so requires the deployment of the Rule Management Server.
    The Rule Management Server has its own CDD file and runs as a separate cluster.
    Its deployment must be planned as with any other cluster.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Another option for supporting run-time changes is to select Hot Deployment
    on the processing unit configuration in the solution’s CDD file. When this box
    is checked, the processing unit monitors the EAR files for changes. If it discovers
    a change, it halts inference agents at the end of the RTC cycle, loads the changes,
    and resumes execution.


    The types of changes that are supported for hot deployment are limited. You can’t,
    for example, add a state machine to an existing concept, as this would change
    existing instances of the concept. Consult the TIBCO BusinessEvents® Administration
    manual for the specifics regarding allowed types of changes.


    # Monitoring


    An important part of deployment planning is the determination of the monitoring
    that will be required for the solution. It almost goes without saying that liveness
    monitoring of the individual executables is a requirement. In addition, there
    should be monitoring to indicate when the solution is getting into performance
    trouble. This monitoring should indicate whether service-level agreements are
    being met and further track whether actual activity volumes remain within the
    planned-for bounds.


    The architect’s tasks in this regard are to


    +   - Identify the measurements that need to be made

    +   - Define the mechanism(s) for making the required measurements

    +   - Define the mechanism(s) for determining whether the measurements lie within
    expected bounds

    +   - Define the mechanism(s) for alerting personnel when measurements exceed
    the bounds


    For the Claim Tracker solution, the rate at which events are being processed is
    a key indicator of both the solution’s ability to keep up with demand and the
    demand itself. A secondary measure is the backlog of Claim Status Notification
    events waiting to be processed.


    To make the measurement of the event processing rate, a Monitoring Scorecard is
    used (Figure 17-7). Each Monitor Claim Processing IA inference agent has its own
    instance of this scorecard. The preprocessing'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_276_0.png)


    # **Figure 17-7:** *Monitoring Scorecard*


    for each `Claim Status Notification` event increments the count. A timer event
    periodically (say, every five minutes) reads the count, updates the rate, and
    resets the count to zero. Thus each agent has a score-card containing the current
    rate at which events are being processed.


    The TIBCO Hawk® agent running on each `Monitoring Machine` uses the Hawk microagent
    embedded in the `Monitor Claim Processing PU` to periodically read the rate and
    compare it against a preestablished performance threshold (e.g., 425 events/second)
    and sends an alert if the threshold is exceeded.


    The TIBCO Hawk agent running on the `EMS Machine` monitors the `ReportClaimStatus`
    queue and sends an alert if the queue back-log exceeds a preestablished threshold
    (e.g., 20,000 events).


    Further design is required to connect the Hawk alerts to the customer’s system
    monitoring solution.


    # ## Summary


    Functionality in TIBCO BusinessEvents solutions can be modularized at three different
    levels: cluster, processing unit, and agent. At the agent level, different classes
    of agents can be defined, each executing a subset of the functionality. These
    agent classes are then grouped into processing units, each of which represents
    a JVM configuration. Finally, each cluster contains a number of processing unit
    configurations.


    Partitioning functionality into different processing units sets the stage for
    scaling and tuning the solution. When different processing units are deployed
    on different machines, you can be assured that they will not compete with one
    another for machine resources.


    Multiple clusters may be required for technical or performance reasons. Inference
    and process agents, for example, cannot be run in the same cluster. Monitoring
    solutions (BEMM, for example) are usually run in a separate cluster from the solution
    they are monitoring so that monitoring resource demands do not adversely impact
    the solution being monitored.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The configuration of object management impacts the detailed design of rules
    and rule functions. Because of this, it is good practice to define the object
    management mode, replication, and backing store for each type of object before
    detailed design is started.


    The need to change logic at runtime impacts both detailed design and deployment.
    If rule templates or decision tables are to be used, the logic to be changed must
    be represented using these constructs. Furthermore, the Rule Management Server
    must be deployed as part of the solution to enable the run-time changes. Another
    approach is to enable processing units to pick up changes at runtime by monitoring
    the EAR file for changes. However, there are restrictions as to the types of changes
    that can be accommodated with this approach.


    The architect needs to specify the intended run-time deployment pattern for the
    solution. This should indicate the different machine types required, what is installed
    on each, and the number of each that will be required. The manner in which the
    solution will be monitored should also be defined.'
