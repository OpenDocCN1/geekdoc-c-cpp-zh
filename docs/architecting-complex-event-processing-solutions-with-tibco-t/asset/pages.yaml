  md: '# Process Agents


    # Objectives


    This chapter covers the operation of the process agent. After reading this chapter
    you will be able to describe the intended utilization of the process agent, how
    processes are defined, the available types of process tasks, and how processes
    execute. You will also be able to explain process checkpointing and recovery,
    as well as some restrictions on process agent deployment.


    # Intended Utilization


    While rules provide a very powerful paradigm for analyzing situations and drawing
    conclusions, there are some things that are actually difficult to do with rules.
    One of these is to orchestrate the execution of multiple activities being performed
    by other components, particularly when some of the activities involve asynchronous
    interactions. The purpose of the process agent is to provide a convenient means
    for implementing this type of process orchestration.


    One common application of the process agent is to provide an orchestrated response
    to an event (Figure 8-1). In this type of application, some other component (e.g.,
    an inference agent) has announced the existence of a situation that requires an
    orchestrated response. In this example, the recognition of potential fraud resulted
    in the generation'
