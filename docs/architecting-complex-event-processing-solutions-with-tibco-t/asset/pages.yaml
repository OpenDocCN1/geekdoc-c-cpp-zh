- pgno: 203
  md: 'In sending the Request, if the concept that will hold the context already exists,
    the Request must be sent in the action part of the rule since a preprocessor function
    cannot modify an existing concept—it can only create a new concept.


    # State Machine Maintains Asynchronous State


    The TIBCO BusinessEvents® Data Modeling extension adds state machine capabilities
    to concepts. This makes possible a pattern that uses a state machine to maintain
    the asynchronous state and also to manage the entire interaction. A sketch of
    such a state machine is shown in Figure 12-7.


    Recall that a state machine is owned by a concept (Chapter 5). When the state
    machine starts, the Request it sends contains a data element the extID of the
    concept owning the state machine. This extID is expected to be returned in the
    Reply and will be used to correlate the reply with this particular state machine
    instance. The state machine then enters a state where it is waiting for a reply.
    When a reply arrives with a matching extID, the machine makes another transition.


    As for actions to be taken when the reply is received, there are two possible
    approaches. One is that the actions can be part of the state machine structure,
    executed when state transitions are taken or when states are entered or exited.
    The other approach is to place actions in the action part of a rule that is triggered
    when a change occurs to the state machine. From a rule perspective, this is a
    change to the concept that owns the state machine.


    One advantage of this approach is that the state machine has timer infrastructure
    that can be used to recognize that a reply has not been received within a designated
    period of time.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_203_0.png)


    Figure 12-7: State Machine Maintains Asynchronous State'
