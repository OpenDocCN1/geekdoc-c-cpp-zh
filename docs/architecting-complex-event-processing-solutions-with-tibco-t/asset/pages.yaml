  md: '# Integration


    # Objectives


    The components that provide complex-event processing capabilities cannot live
    in isolation. Most of the events to which they react originate in other systems,
    and many of the actions they take are implemented by other systems. Integration
    with these systems is key.


    Integration is a broad topic, much of which is beyond the scope of this book.
    The basics of integration and services are covered in TIBCO™ Architecture Fundamentals¹;
    more advanced related topics are covered in Architecting Composite Applications
    and Services with TIBCO™ ² These books describe some TIBCO™ products commonly
    used in conjunction with TIBCO BusinessEvents™, TIBCO ActiveMatrix BusinessWorks™,
    TIBCO ActiveMatrix® Adapter for Database, TIBCO ActiveMatrix® Adapter for Files,
    and TIBCO Enterprise Message Service™, among others. They also cover SOA concepts
    and design patterns involving these products.


    1. Paul C. Brown, TIBCO® Architecture Fundamentals, Boston: Addison-Wesley (2011).

    2. Paul C. Brown, Architecting Composite Applications and Services with TIBCO®,
    Boston: Addison-Wesley (2012).'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'TIBCO BusinessEvents can, of course, interact via its channels with any component
    using a supported transport. There are also additional integration capabilities
    in the product. This chapter explores these additional integration capabilities.
    After reading this chapter you will be able to describe how TIBCO BusinessEvents
    can interact with:


    +   - TIBCO ActiveMatrix BusinessWorks™

    +   - Web services

    +   - Databases


    # Interacting with TIBCO ActiveMatrix BusinessWorks™


    TIBCO ActiveMatrix BusinessWorks™ has a plugin to simplify interactions with TIBCO
    BusinessEvents®. The use of the plugin enables ActiveMatrix BusinessWorks to define
    RuleServiceProvider Configurations. Each of these configurations contains pointers
    to the EAR and CDD files from a TIBCO BusinessEvents project with which you want
    to interact. The configuration also identifies a processing unit that is defined
    in the CDD file. When the ActiveMatrix BusinessWorks engine runs, it will run
    an instance of this processing unit in the same JVM as the ActiveMatrix BusinessWorks
    engine.³


    The plugin provides four activities that can be employed in ActiveMatrix BusinessWorks
    processes: (1) Send Event, (2) Receive Event, (3) Wait for Event, and (4) Invoke
    RuleFunction.


    # TIBCO ActiveMatrix Business Works™ Send Event


    The Send Event activity enables ActiveMatrix BusinessWorks to send an event to
    a specific destination in a processing unit (Figure 12-1). The configuration of
    this activity shows the event data structure so that values can be readily mapped
    to the event properties. Executing the activity sends the event to the specified
    destination.


    3. A similar integration, in which an instance of TIBCO ActiveMatrix BusinessWorks
    executed in the same JVM as a processing unit, has been deprecated as of the 5.x
    release of TIBCO BusinessEvents.'
  merge: -1
  img_proc: true
