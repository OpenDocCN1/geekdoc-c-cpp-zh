    a given state within a period of time). This makes it possible to identify events
    that should have happened, but did not, and take appropriate action.


    Figure 4-4 shows a state machine model for the handling of luggage by an airline.
    This model can then be used to keep track of the state of each individual piece
    of luggage as it moves through the system.


    # TIBCO BusinessEvents® Decision Manager


    TIBCO BusinessEvents® Decision Manager (Figure 4-5) is an extension to TIBCO BusinessEvents
    that is designed to make it possible for business users to define business rules.
    It includes a plugin for the TIBCO BusinessEvents Studio that provides a spreadsheet-style
    interface for defining and testing business rules. It provides facilities to import
    and export rules from Microsoft® Excel spreadsheets so that business users can
    work with spreadsheets directly. The studio extension can check rules for both
    completeness and consistency, and can automatically generate test data from rules.
    Also included is the Decision Manager Browser Interface is an extension to the
    Web Studio that enables the run-time updating of decision tables while the BusinessEvents
    solution is running. Figure 4-6 shows the TIBCO BusinessEvents Studio user interface
    provided by the Decision Manager plugin. This interface is described in Chapter
    5.'
