    \ 属性，对于统计或分析目的，保留先前账户余额的历史可能很有用。历史是通过指定要保留的历史值的数量来指定的。policy 属性决定是保留所有历史值（即使值未更改）还是仅保留不同的值。历史的使用存在一些限制。其中之一是规则条件只能通过目录函数访问历史，而在条件中使用这些函数效率低下。另一个是当概念的\
