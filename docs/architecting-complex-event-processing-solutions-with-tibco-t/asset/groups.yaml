    process are the observable actions of a participant (human or system) in some
    business process. Most of these participants do not announce their activities,
    at least to components not engaged in that business process. For this reason,
    CEP solutions generally have one or more components dedicated to sensing these
    actions and announcing their observations.


    The techniques used for these observations are the same ones traditionally used
    in application integration. These techniques, and the products that support them,
    are detailed in TIBCO™ Architecture'
