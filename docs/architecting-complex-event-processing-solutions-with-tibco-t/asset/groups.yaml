    **Figure 6-2:** *Selecting the Object Management Mode*


    management modes can be selected for individual object types or groups of types.
    The following sections describe the individual modes.


    # Cache Only


    Cache only is the recommended default mode of operation. In this mode, objects
    reside in the cache and must be explicitly loaded into the inference agent’s working
    memory by a preprocessor function.


    When a cache-only object is brought into working memory, only its identifier is
    initially loaded. The data associated with the object is not loaded until it is
    actually accessed by the inference agent.


    If a change is made to a cached object and that object happens to also be in working
    memory, the working memory copy of that object is updated, regardless of the state
    of the RTC processing. Locking (discussed later in this chapter) can be used to
    prevent this.


    Cache-only objects are automatically removed from working memory at the end of
    the RTC cycle unless the Constant box is checked (this should only be done by
    exception—never for the default configuration). When this box is checked, once
    the object has been brought into working memory it will remain there until it
    is explicitly removed. These objects are typically loaded by start-up functions.


    # Memory Only


    Objects configured with this mode reside only in working memory and do not appear
    in the cache. Such objects reside in exactly one inference agent.'
