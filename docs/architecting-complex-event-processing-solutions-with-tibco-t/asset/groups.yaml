    ## 第 1 章


    ### 事件驱动型企业


    ### 目标


    在业务背景下讨论复杂事件处理时出现的一个务实问题是：“为什么？”这种方法有什么特点使其成为一项有趣的业务投资？


    回答这个问题是本章的重点。阅读本章后，你将能够解释事件驱动型企业的概念，并描述此类企业如何通过对其感知、分析和响应业务环境能力的创新来获得竞争优势。


    ### 极致价值


    企业，无论是商业公司还是政府机构，都存在于为其利益相关者提供价值。停止提供价值的企业很快就会不复存在。继续提供适度价值的企业得以生存。Vivek Ranadivé
    所称的提供极致价值的企业很快就会超越竞争对手并繁荣发展。


    iPhone 就是极致价值的一个例子。当 iPhone 于 2007 年推出时，其成本远高于基础手机。


    然而人们购买了 iPhone——甚至连勉强够吃饭钱的人也买了。为什么？iPhone 提供了什么价值，以至于人们明明买不起却仍然购买？


    答案是 iPhone（以及其他类型的智能手机）使人们能够以新的创新方式与周围世界互动。它使人们能够感知正在发生的事情、分析情况并响应世界——并且能够实时进行，无论身在何处。用户以新的方式感知，不再只是接收电话呼叫，现在还接收短信、电子邮件、社交媒体帖子和来自应用的提醒。用户以新的方式分析正在发生的事情，不仅使用地址簿和其他个人参考信息，还使用网络浏览器、社交媒体和应用。用户不仅可以通过电话呼叫响应，还可以通过这种新技术与其他人交流、购买产品和预订。iPhone
    使用户能够随时随地按自己的选择感知、分析和响应周围的世界。这就是 iPhone 提供的极致价值。


    那么极致价值对你的企业意味着什么？极致价值将客户转变为粉丝——粉丝更偏爱你的企业的产品和服务而排斥竞争对手。粉丝的态度正如 1960 年代的广告所说：“宁愿打仗也不换！”（图
    1-1）。粉丝对你的企业的忠诚促进了其成长和盈利。那么复杂事件处理如何使你的企业能够提供极致价值？


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_30_0.png)


    图 1-1：“宁愿打仗也不换！”

