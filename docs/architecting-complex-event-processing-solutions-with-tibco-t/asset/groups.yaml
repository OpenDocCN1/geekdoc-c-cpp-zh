    Agents，每个代理都有自己的后备存储文件。需要一个 Obtain Claim Status IA 代理。


    ## 处理单元


    处理单元是 TIBCO BusinessEvents 解决方案的引擎。设计中应有多少种处理单元类型的一些决策由技术限制驱动。例如，托管缓存代理的处理单元不能托管超过一个缓存代理，也不能托管任何其他类型的代理。


    将代理进一步划分为处理单元通常由性能考虑驱动。虽然每个代理都有很多调优能力，但在处理单元中能做的事情存在实际限制，而处理单元只是一个 JVM。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_269_0.png)


    图 17-4：处理单元模块化示例


    图 17-4 显示了索赔跟踪器示例的处理单元模块化。请注意，每个处理单元恰好包含一个代理。根据之前的需求分析，必须有十七个 Cache PU 和十四個 Monitor
    Claim Processing PU 处理单元来支持预期的活动量。


    ## 集群


    集群是 TIBCO BusinessEvents 的最高组织级别。在某种程度上，你选择的代理类型将决定所需的最小集群数量。例如，如果你决定同时使用流程代理和推理代理，你别无选择，只能使用至少两个集群，因为两者不能混合在同一个集群中（参见第
    8 章）。


    然而，更常见的是，你决定使用多个集群将由性能考虑驱动。默认情况下，集群内缓存代理与其他代理之间的通信通过定义该集群的多播地址进行。如果你的解决方案涉及彼此无关且不共享逻辑的缓存对象，为每个缓存对象组及其相关逻辑使用不同的集群具有性能优势。然后可以使用通道在集群之间进行通信。其理由是


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_270_0.png)


    **图 17-5：** *索赔跟踪器处理单元模块化*


    将监控解决方案（尤其是 BEMM）分离到单独的集群中（图 17-5）。同样，如果 Claim Tracker 正在监控也在 TIBCO BusinessEvents
    中执行的流程，将 Claim Tracker 部署在其自己的集群中将是良好的实践。


    ## 对象管理配置


    你为设计中的各种对象选择的 object management 模式将影响规则函数和


    的详细设计


    未标记为保存在后备存储中的对象。配置选项为


    - 无后备存储

    - 共享全部（数据库）采用 cache-aside

    - 共享全部（数据库）采用 write-behind

    - 共享无（文件）


    你选择的后备存储方法决定了在代理意外终止时可能出现的不一致类型。因为这会影响设计的细节，后备存储决策应在进行任何详细设计之前做出。


    ## 索赔跟踪器对象管理配置


    表 17-1 显示了索赔跟踪器示例的对象管理配置。由于索赔跟踪器不是状态信息的记录系统（它存在的目的是加快索赔定位并加速处理问题的识别），因此容错不是要求，因此不会有复制。由于活动量大，出于效率考虑选择了
    Shared-Nothing 后备存储。入站事件仅用作触发器，发出的出站事件不再需要，因此所有事件均以 Memory Only 模式管理。Claim Status
    和 Status Report 概念以 Cache Only 管理。


    表 17-1：索赔跟踪器对象管理配置


    | 对象 | 管理模式 | 复制 | 后备存储 |

    |---|---|---|---|

    | 索赔状态概念 | Cache Only | none | Shared Nothing |

    | 状态报告概念 | Cache Only | none | Shared Nothing |

    | 索赔状态通知事件 | Memory Only, ttl=0 | none | none |

    | 索赔处理异常事件 | Memory Only, ttl=0 | none | none |

    | 索赔状态请求事件 | Memory Only, ttl=0 | none | none |

    | 索赔状态响应事件 | Memory Only, ttl=0 | none | none |


    ## 部署模式


    你已执行的性能分析和做出的模块化决策本身不足以确保你的解决方案部署后将满足性能目标。为了确保这一点，你需要说明关于解决方案组件在机器上部署的意图，指出哪些组件可以共享机器，哪些应位于单独的机器上。你还应指出所需的最低机器类别。


    虽然部署模式可能很简单，但以应用程序应如何部署的方式清晰传达你的设计意图很重要。图 17-6 显示了索赔跟踪器解决方案的预期部署。这清楚地表明每个处理单元应部署在单独的机器上。


    表 17-2 显示了在索赔跟踪器部署模式中使用的每台机器的预期配置以及所需数量。


    除了指定初始部署外，提供容量如何扩展的指南是明智的。在索赔跟踪器示例中，每台缓存机器保存 4.26 百万份索赔的状态信息。因此，初始部署容量为 76.7 百万份索赔，预计初始需求为
    70.4 百万份索赔。随着需求开始接近部署容量，可以部署额外的缓存机器，每台增加 4.26 百万份索赔的容量。


    同样，每台监控机器可以处理 425 事件/秒，提供 5,950 事件/秒的容量。预计初始需求为 5,356 事件/秒（4,736 个正常事件 + 620 个超时事件）。随着需求增长，可以添加监控机器，每台增加
    425 事件/秒的容量。


    **表 17-2：索赔跟踪器机器配置**


    | 机器 | 内存 | CPU | 所需数量 |

    |---|---|---|---|

    | 监控机器 | 16GB | 8 核 | 14 |

    | 缓存机器 | 64GB | 8 核 | 18 |

    | 索赔状态机器 | 16GB | 8 核 | 1 |

    | EMS 机器 | 8GB | 4 核 | 1 |

