    # Summary


    An inference agent provides the ability to evaluate objects using rules. Each
    rule identifies the types of objects used by the rule, the conditions those objects
    must satisfy, and the actions to be taken when the conditions are met.


    Inference agents operate on three key types of objects: events, concepts, and
    scorecards. An event is a representation of some external occurrence and is not
    modifiable except in the preprocessor function associated with its creation. Events
    are local to the agent that created them (with the exception of query agents)
    unless the event is explicitly sent via a channel.


    Concepts are modifiable representations intended to be shared via the cache. They
    can be created in preprocessor functions and created, modified, and deleted in
    rule actions.


    Scorecards are special types of concepts. For each type of scorecard there is
    exactly one instance of that scorecard in each inference agent using that scorecard.
    Scorecards are used to accumulate historical information within a processing agent.


    Rules operate on objects in an inference agent''s working memory. Newly created
    or modified objects in working memory trigger rules. The evaluation of rules occurs
    in the run-to-completion (RTC) cycle. The cycle begins by identifying all triggered
    rules and placing them in a list known as the rule agenda. The rule agenda is
    then sorted by the priority and rank of the rules. Then one rule is selected for
    evaluation and the Rete network required to evaluate its conditions is assembled.
    Objects from working memory are inserted into the Rete network one at a time,
    and the output of the Rete network is a collection of objects that have met the
    conditions. The actions of the rule are applied to these objects. Some of these
    actions may alter the contents of working memory.


    When the evaluation of one rule has been completed, the rule agenda is again assembled.
    With forward chaining, changes in working memory may result in some of the rules
    that were in the agenda being removed, and others added. The agenda is sorted
    and a single rule is again evaluated. This process continues until there are no
    more rules in the agenda.


    Channels provide the mechanisms for the inference agent to interact with external
    components and other agents. There are channels for JMS, TIBCO Rendezvous, HTTP,
    TCP, TIBCO ActiveSpaces, TIBCO'
  - '[PAGE 127]


    Hawk, and local channels for communicating between agents hosted in the same processing
    unit.


    Channels have one or more destinations associated with them. For incoming events,
    each destination specifies the default type of event to be constructed and the
    deserializer to be used in its construction. The destination identifies an optional
    preprocessor function to be invoked after the event is created. Events may identify
    a default destination to which the event may be sent. The destination identifies
    the type of thread to be used for executing preprocessor activities.


    Whatever thread performs the preprocessor activities associated with an event
    also executes the RTC cycle for that event. If the Concurrent RTC option is not
    selected, the thread must wait its turn before executing RTC. The use of the Concurrent
    RTC option requires the careful use of locking to avoid accidental interactions
    between threads executing RTC cycles.


    Postprocessor activities consist of updating the cache (and cache-aside database)
    for cache-resident objects that have changed, sending outbound events, acknowledging
    the receipt of incoming messages, and releasing object locks that may have been
    obtained. Postprocessing may occur either single-threaded or multi-threaded.


    Concepts can have state machines associated with them. A state machine consists
    of a number of states and transitions. Transitions can have rules associated with
    them that define the conditions under which the transition will be taken. Actions
    can be taken when rules fire and when states are entered or exited. Timeouts can
    be specified for individual states and the state machine as a whole. If the timer
    expires before the state is exited (or the machine reaches its end state), specified
    actions are taken and a specified state is entered.'
