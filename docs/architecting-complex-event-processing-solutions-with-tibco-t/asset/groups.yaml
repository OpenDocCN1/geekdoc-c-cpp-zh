  mdcn: "\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_282_0.png)\n\n*图 18-2：用于容错的持久事件模式*\n\
    \n使用 `EXPLICIT CLIENT ACKNOWLEDGE` 模式。这将确保在所有挂起的缓存更新完成且待发送消息已发送之前，不会发送确认。\n\n\
    ## 代理间通信\n\n第三个设计要求是，所有代理间通信都使用 JMS 消息传递。这确保了消息不会丢失。特别是，您不希望使用本地通道进行代理之间的通信。使用本地通道时，从消息发送到工作完成、缓存更新和出站消息发送之间发生的任何故障都将导致进行中的工作丢失。\n\
    \n## 站点灾难恢复\n\n为解决方案启用站点灾难恢复，需要在缓存和消息服务器后面提供一个存储子系统，用于在站点之间复制文件。如果遵循刚刚讨论的解决方案容错准则，所有必要的状态信息都存储在这些文件中，并且可以在远程站点恢复该解决方案。\n\
    \n## 摘要\n\n使用 TIBCO BusinessEvents 创建容错解决方案需要使用适当的后备存储配置，使用具有消息持久性的 TIBCO Enterprise\
    \ Message Service，并使用适当的代理工作协调模式。所有代理间交互都必须使用持久消息传递。\n\n站点灾难恢复要求存储子系统将后备存储和消息服务底层的文件复制到远程站点。\n\
    \n本页有意留白\n\n## 对象管理模式、线程和锁定\n\n在每个项目中，您都必须做出三个高度相关的架构选择：为每个对象选择对象管理模式，为每个目标选择线程模型，以及为每个对象建立锁定策略。您为每种对象类型和目标所做的组合选择将对解决方案的实现细节产生深远影响。这些选择应在项目早期做出，并通过分析进行验证。您的大部分测试工作应致力于确保锁定策略已正确实现，并且不存在与竞争条件相关的问题。这类问题在已部署的系统中几乎无法排查。它们值得进行扎实的测试投入。\n\
    \n## 设计规则\n\n保持规则简单。\n\n-   为了提高效率，将条件中的概念数量保持在最少。请记住，多个概念需要进行连接，而连接是开销很大的操作。\n\
    -   避免复杂条件。\n-   选择带有中间事件的多个简单规则，而不是一个复杂规则。\n\n这些准则适用于整个应用程序。在复杂情况下，可得出中间结论并将其作为事件公布。然后使用此事件触发进一步分析。如有必要，可以使用瞬态概念在规则之间传递信息。瞬态概念是指使用仅内存管理定义的概念。\n\
    \n请记住，条件子句的结构会影响性能。尽可能使用过滤器来缩小将在后续连接子句中尝试的对象数量。类似地，使用等价连接来进一步减少将在非等价连接中尝试的对象数量。涉及的对象越多，这一点就越重要。\n\
    \n## 测试最佳实践\n\n理解基于规则的系统的行为一直是一项挑战。因此，在编写规则时，遵循以下做法是很好的：\n\n-   明确定义您为所实现的每个功能块（规则表、规则和规则函数集合、流程设计等）期望的行为。\n\
    -   定义您如何让自己确信已达到预期行为。\n-   实现测试场景以验证预期行为。\n\n请记住，您指定的行为包括缓存更新和出站事件。请务必测试对象的整个生命周期：创建、修改和删除。如果行为取决于当前信息状态（无论是在缓存中还是在其他地方），请确定如何在测试开始时创建此状态，以及如何在测试结束时检查状态。\n\
    \n虽然这种级别的测试看起来工作量很大，但通常比弄清为什么整个解决方案没有按预期工作的工作量要少。\n\n## 摘要\n\n复杂事件处理解决方案……很复杂！通常有很多事情并行发生，还有很多细节需要考虑。很容易迷失在细节中。为了避免迷失，你必须始终关注全局。解决方案的架构决定了这个全局。在任何人深入编写规则和规则函数的细节之前，必须清楚明确地阐述并透彻理解这一架构。\n\
    \n首先，确保你的问题被明确定义并充分理解。在这个层面上的不确定性是混乱的根源。一旦目标和方案确定，先考虑数据：事件中包含什么信息，需要哪些参考数据来分析这些事件？其中有多少参考数据由事件流动态更新？分析需要哪些元数据（例如，流程的状态模型）？\n\
    \n理解数据后，现在考虑如何处理数据处理的组织方式。哪些处理流将并行发生？需要什么对象锁定？将使用哪些对象管理模式？\n\n在设计规则时，请记住，规则条件结构会对性能产生重大影响。一般来说，简单更好。\n\
    \n最后，测试、测试、再测试（特别是探索边界条件）。基于规则的方法和并行处理都以表现出意外行为而闻名，尤其是在边界情况下。做好充分准备，你将会得到一个堪称典范的解决方案，为企业提供宝贵的能力！\n\
    \n本页有意留白\n\n## 索引\n\n- **A**\n  - 账户变更识别，151–152\n  - 动作\n    - 将情形识别与响应分离，188–189\n\
