    ### Concepts


    ### Objectives


    The event-enabled enterprise concept is, itself, built upon a number of ideas.
    As a prerequisite to having a meaningful discussion about realizing the event-enabled
    enterprise, these underlying concepts must first be clearly understood. That is
    the purpose of this chapter.


    After reading this chapter you will understand the essential concepts underlying
    the event-enabled enterprise: events, complex events, complex-event processing,
    context, event responses, and event-driven processes.


