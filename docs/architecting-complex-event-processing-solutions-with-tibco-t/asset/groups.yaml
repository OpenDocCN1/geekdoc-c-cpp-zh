    ## Summary


    The Nouveau Health Care case study provides a coordinated set of example problems
    across the TIBCO Press architecture book series. The primary focus of the case
    study is the processing of health insurance claims. With the business model described
    in the case study, the processing of claims can be distributed across multiple
    parties. This creates the need for a Claim Tracker to centralize the status tracking
    for claims.


    The Claim Tracker is involved in three processes: (1) monitoring the claim processing,
    (2) obtaining and returning claim status upon request, and (3) reporting exceptions
    to a process that resolves the exceptions.


    The core of the Claim Tracker functionality is represented by a state machine
    associated with the Claim Status concept that is kept in the cache. This state
    machine shows the expected milestones of normal claim processing as well as exception
    states that are entered when service-level agreements are violated. Violations
    of these service-level agreements result in a Claim Processing Exception event
    being sent. The state machine also shows the recovery actions that are possible
    once an exception has occurred.


    Since most of the monitoring logic is embedded in the state machine, the processing
    of a Claim Status Notification is straightforward. If it is a new claim, the Claim
    Status concept is created. Otherwise, the existing status is retrieved from the
    cache. In either case, the object is locked and a Status Report appended containing
    the details of the report. The RTC cycle is then allowed to process the event
    and drive the transitions in the state machine.


    Timeouts in the state machine require their associated preprocessor functions
    to be specially registered. As with the normal processing, timeouts require the
    retrieval of the Claim Status from the cache and locking it prior to evaluating
    the state machine transitions in the RTC cycle.


    ## Performance


    ### Objectives


    Having the right functional capabilities doesn''t do you any good if your solution
    can''t meet the performance requirements. This chapter explores the design choices
    that impact performance, the tuning mechanisms available in TIBCO BusinessEvents®,
    and describes an approach to performance estimation. It concludes with some sizing
    rules of thumb that can be used in the absence of any detailed information. After
    reading this chapter you will be able to


    - Describe how the profiler can be used to obtain RTC performance data

    - Describe how design choices impact agent performance

    - Explain how to perform a demand analysis

    - List some rule-of-thumb sizing guidelines for development environments


    ## TIBCO BusinessEvents® Profiler


    TIBCO BusinessEvents® contains a profiler that gives you performance information
    about the execution of the RTC cycle. This information can be used not only to
    understand where time is being spent, but also to compare the performance profiles
    of different rule designs.


    There are several ways in which the profiler can be turned on and off. These include
    the following:


    - TIBCO BusinessEvents Monitoring and Management: This application provides an
    interactive mechanism for turning profiling on and off.

    - Agent properties: The `be.engine.profile...` family of properties can be used
    to statically configure profiling. These properties are applied when the agent
    starts.

    - TIBCO Hawk®: Each agent has an embedded Hawk microagent interface that includes
    operations for turning profiling on and off. The Hawk console can be used to interactively
    control profiling, or Hawk rules can be written to turn profiling on and off when
    specific conditions exist.

    - Catalog functions: Catalog functions are provided that turn profiling on and
    off. These can be incorporated into preprocessor functions or rule actions.


    Profiling is an essential tool for understanding the performance implications
    of your design. However, just turning the profiler on will not necessarily provide
    you with the information you require. Many performance issues will not be apparent
    unless there are a significant number of objects in the memory and/or cache. You
    need to analyze your solution and determine the worst-case peak-condition number
    of objects, and then observe the behavior under those conditions. This may require
    a special test to simulate those conditions.


    ## Design Choices and Agent Performance


    There are a number of design choices that can impact performance, including


    - Structuring rule conditions

    - Organizing decision tables

    - Accessing large XML event payloads

    - Locking objects

    - Choosing threading models

    - Using synchronous I/O calls in rule actions


    ### Structuring Rule Conditions


    There are three basic types of rule conditions: filters, equivalent joins, and
    nonequivalent joins. Filters are comparisons of object properties against fixed
    values. Filter operations consume minimal resources. An example is:


    ```

    transaction.amount <= 5.00;

    ```


    Equivalent joins compare values from two objects using an equality operator. The
    fact that a join is being performed makes it computationally more expensive than
    a simple filter operation, but the operator being used for comparison is relatively
    efficient. An example is:


    ```

    transaction.accountNumber == account.accountNumber;

    ```


    Nonequivalent joins compare values from two objects using an inequality operator.
    This is the least efficient type of condition. An example is:


    ```

    transactionA.amount < transactionB.amount;

    ```


    When you compile your project, creating an EAR file, TIBCO BusinessEvents sorts
    the conditions so that filter conditions are performed first, followed by equivalent
    joins, and then nonequivalent joins. However, there is no sorting performed within
    each of these categories: The conditions are evaluated in the order in which they
    appear in the rule definition.


    If you perceive that one condition will be more efficient than another, you should
    order the clauses accordingly. This is so important that if you have multiple
    equivalent joins in a rule, you will receive a log file warning that there are
    multiple equivalent joins in the rule. The warning is intended as a reminder that
    you need to carefully consider the ordering. This is a situation in which the
    use of the profiler is highly recommended—it will give you better insight as to
    what is actually going on in the RTC cycle.


    Beyond simply ordering the clauses, you have design choices in structuring your
    rule conditions. The normal best practice is to keep each type of condition separate,
    on its own line with a semicolon at the end. If you do this, the compiler will
    sort the conditions as described above. However, you have the option of combining
    clauses into larger expressions. This is commonly employed as a means of handling
    null values:


    ```

    Account.tinyTransaction != null && Account.tinyTransaction.

    amount < 5.00;

    ```

