    # Summary


    Creating a fault-tolerant solution with TIBCO BusinessEvents requires the use
    of appropriate backing store configurations, the use of the TIBCO Enterprise Message
    Service with message persistence, and the use of appropriate coordination patterns
    for agent work. Persistent messaging must be used for all inter-agent interactions.


