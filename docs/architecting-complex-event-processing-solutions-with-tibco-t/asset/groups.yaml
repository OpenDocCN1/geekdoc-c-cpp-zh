  - '[PAGE 47]


    Correlating events with reference data can provide a broader analysis perspective.
    Using the account number from an event to access other information about the account
    or using the customer ID to access information about the customer permits this
    related information to be used as part of the analysis.


    Perhaps the richest form of correlation is between an event and a model of the
    behavior that is expected to be observed. A model of the proper execution of a
    business process that identifies the events that should be observed during its
    execution provides an excellent reference for interpreting the events that actually
    occur. This perspective makes it possible to determine whether the process is
    executing as planned.


    Analysis often combines multiple types of correlation. For example, you might
    want to analyze the calls coming in to a customer support center to identify customers
    that are having an unusually hard time getting a problem resolved. Given an initial
    event indicating an incoming call, you might correlate the telephone number in
    the event with customer records to identify the customer who is calling. You might
    also correlate this event with other incoming call events to see whether there
    were other calls from the same customer within the past hour. If you find three
    or more events correlated in this way, you might conclude that the customer is
    having a significant problem and take action by escalating the call to a supervisor.
    Note that by correlating each call with a customer, you set the stage for recognizing
    and correlating other calls from that same customer that happen to have originated
    from different phones (for example, home, mobile, work).


    Correlation is fundamental to CEP analysis. As such, when you undertake a CEP
    project it is prudent to focus your initial attention on identifying the things
    that need to be correlated and the basis upon which they will be correlated. This
    understanding will then guide the design of your data structures and inform the
    rest of your design.


    # Context


    The analysis of an event always requires some form of contextual information.
    The previous examples involved context, such as reference data and expected-behavior
    models. In general, context falls into three broad categories:


    +   1. Constants

    +   2. Data

    +   3. Metadata'
