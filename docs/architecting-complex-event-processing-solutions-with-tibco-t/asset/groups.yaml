  - '[PAGE 118]


    The type of channel determines how many channel threads there are. For JMS, there
    is one. For HTTP, there is a pool of channel threads. You should consult the product
    manuals for details on the threads associated with each channel type.


    Each destination designates the pool of threads that are used for preprocessing.
    There are three possibilities:


    +   1. Shared Queue: This is the default. The event is placed in a queue shared
    by all destinations in this agent. There is a shared pool of threads for executing
    the preprocessor activities, and events wait in the shared queue until one of
    the threads from this pool becomes available.

    +   2. Destination Queue: The event is placed in a queue specific to this destination.
    There is a pool of threads dedicated to this destination, and the event waits
    in the destination queue until one of these threads becomes available.

    +   3. Caller Thread: There is no queue for this alternative. The channel thread
    (the one that created the event) immediately performs the preprocessor activities.


    When a thread becomes available, if a preprocessor function has been associated
    with the event for this destination, it executes the function.


    If the Concurrent RTC box in the inference agent configuration has not been checked
    (this is the default), then the thread is placed in a queue of threads waiting
    their turn to execute the RTC activities. If the box is checked, the thread immediately
    proceeds.


    Once the thread is ready to execute, if the Concurrent RTC box is not checked
    the thread acquires the Rete lock. This prevents other threads from performing
    RTC activities. Any objects that were created or retrieved from the cache are
    asserted into working memory. Note that despite the fact that a call to Event.assertEvent()
    may have been made in the preprocessor function, the event is not actually placed
    in working memory until this point is reached. Once working memory has been updated,
    the RTC behavior (described earlier) is executed.


    Upon completion of RTC, the lock is released (allowing other threads to execute
    other RTC), a signal is sent to trigger the postprocessing related to the just-completed
    RTC, and (if necessary) the receipt of the initial JMS message is acknowledged.
    The thread is now ready to process another event.'
