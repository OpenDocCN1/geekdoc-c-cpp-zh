  mdcn: "\n\n## 摘要\n\n推理代理提供使用规则评估对象的能力。每条规则标识该规则所使用对象的类型、这些对象必须满足的条件，以及条件满足时要执行的动作。\n\
    \n推理代理操作三种关键类型的对象：事件、概念和评分卡。事件是某种外部发生的表示，除在与其创建关联的预处理函数中之外，不可修改。事件对于创建它们的代理是局部的（查询代理除外），除非事件通过通道显式发送。\n\
    \n概念是可修改的表示，旨在通过缓存共享。它们可以在预处理函数中创建，也可以在规则动作中创建、修改和删除。\n\n评分卡是特殊类型的概念。对于每种评分卡类型，在使用该评分卡的每个推理代理中恰好有一个该评分卡的实例。评分卡用于在处理代理中累积历史信息。\n\
    \n规则对推理代理工作内存中的对象进行操作。工作内存中新创建或修改的对象会触发规则。规则评估发生在运行至完成（RTC）周期中。该周期首先识别所有已触发的规则，并将它们放入称为规则议程的列表中。然后，规则议程按规则的优先级和等级排序。接着选择一条规则进行评估，并组装评估其条件所需的Rete网络。工作内存中的对象逐个插入Rete网络，Rete网络的输出是满足条件的对象集合。规则的动作应用于这些对象。其中一些动作可能会改变工作内存的内容。\n\
    \n当一条规则的评估完成后，再次组装规则议程。使用正向链接时，工作内存的变化可能导致议程中的某些规则被移除，另一些被添加。议程被排序，并再次评估一条规则。此过程持续进行，直到议程中没有更多规则为止。\n\
    \n通道为推理代理与外部组件及其他代理交互提供机制。有用于JMS、TIBCO Rendezvous、HTTP、TCP、TIBCO ActiveSpaces、TIBCO\
    \ Hawk的通道，以及用于在同一处理单元中托管的代理之间进行通信的本地通道。\n\n通道有一个或多个与之关联的目标。对于传入事件，每个目标指定要构造的事件的默认类型以及在其构造中使用的反序列化器。目标标识事件创建后要调用的可选预处理函数。事件可以标识事件可能发送到的默认目标。目标标识用于执行预处理活动的线程类型。\n\
    \n无论哪个线程执行与事件关联的预处理活动，该线程也会为该事件执行RTC周期。如果未选择并发RTC选项，该线程必须等待轮到自己才能执行RTC。使用并发RTC选项需要谨慎使用锁定，以避免执行RTC周期的线程之间的意外交互。\n\
    \n后处理活动包括：更新已更改的缓存驻留对象的缓存（以及缓存旁数据库）、发送出站事件、确认接收到的入站消息，以及释放可能已经获得的对象锁。后处理可以单线程或多线程执行。\n\
    \n概念可以具有与之关联的状态机。状态机由多个状态和转换组成。转换可以具有与之关联的规则，这些规则定义将进行转换的条件。当规则触发以及进入或退出状态时，可以执行动作。可以为单个状态和整个状态机指定超时。如果计时器在状态退出（或机器达到其结束状态）之前到期，则执行指定的动作并进入指定的状态。\n\
    \n此页面有意留空\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_131_0.png)\n\n**图 6-2：**\
    \ *选择对象管理模式*\n\n可以为单个对象类型或类型组选择管理模式。以下各节描述各个模式。\n\n## 仅缓存\n\n仅缓存是推荐的默认操作模式。在此模式下，对象驻留在缓存中，必须由预处理函数显式加载到推理代理的工作内存中。\n\
    \n当仅缓存对象被带入工作内存时，最初仅加载其标识符。与该对象关联的数据在推理代理实际访问之前不会被加载。\n\n如果对缓存对象进行了更改，而该对象恰好也在工作内存中，则无论RTC处理的状态如何，该对象的工作内存副本都会被更新。可以使用锁定（本章稍后讨论）来防止这种情况。\n\
    \n仅缓存对象在RTC周期结束时自动从工作内存中移除，除非选中了“常量”复选框（这应仅作为例外情况执行——切勿用于默认配置）。当选中此框时，一旦对象被带入工作内存，它将一直保留在那里，直到被显式移除。这些对象通常由启动函数加载。\n\
    \n## 仅内存\n\n使用此模式配置的对象仅驻留在工作内存中，不会出现在缓存中。此类对象恰好驻留在一个推理代理中。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_134_0.png)\n\
    \n**图 6-5：** *ACEPSTAccountConcept 处理*\n\n如果交易金额低于小额阈值，预处理程序将确保存在Account概念（如有必要则创建一个），并添加一个包含的Transaction概念。但是，交易事件会被消费。\n\
    \n此示例的欺诈规则如清单6-1所示。\n\n## **清单 6-1：** *ACEPSTAccountConcept 欺诈规则*\n\n```\nrule\
    \ Rules.Fraud {\n    attribute {\n        priority = 5;\n        forwardChain\
    \ = true;\n    }\n    declare {\n        Events.Transaction transaction;\n   \
    \     Concepts.Account account;\n    }\n    when {\n```\n\n如果需要锁定多个对象，则存在死锁的可能性：X锁定了A，然后试图锁定B，而Y已锁定B，并且正在尝试锁定A。X和Y都无法继续。因此，为锁指定超时并提供适当的异常处理非常重要。\n\
    \n遵循另一种编程约定可以大大降低死锁的可能性：如果你计划锁定多个对象，则获取它们的所有键，对键进行排序，然后按排序顺序获取锁。\n\n请记住，锁的有效性完全取决于它们使用的一致性！\n\
    \n## 缓存对象复制\n\n可以将缓存配置为自动复制对象，对象的副本驻留在不同的缓存代理中（图6-6）。此配置有两个设置。一个是“备份副本数”，它确定缓存中将维护的额外副本（除原始副本外）的数量。默认值为一。另一个设置是“缓存代理法定人数”，它确定集群开始运行前必须运行的最小缓存代理数量。如果对象的所有备份副本都存在同一个缓存代理中，那么拥有备份副本就没有意义，因此该数字应至少比备份副本数大一。如果希望在缓存代理宕机时仍保持复制，请增大此数字。一旦集群启动，此设置对操作没有影响，除非实际运行的缓存代理数量低于此数字时会导致记录一条日志条目。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_136_0.png)\n\n图 6-6：配置缓存对象复制\n\n"
