    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_210_1.png)


    Figure 12-17: Inference Agent Subscription


    ## Database Interaction Using TIBCO ActiveMatrix BusinessWorks™


    Using TIBCO ActiveMatrix BusinessWorks to perform the database interactions requires
    using a combination of two or three design patterns described earlier:


    - TIBCO BusinessEvents as an Asynchronous Service Consumer

    - ActiveMatrix BusinessWorks Receive Event

    - ActiveMatrix BusinessWorks Send Event


    Using the Asynchronous Service Consumer pattern, TIBCO BusinessEvents sends the
    request to ActiveMatrix BusinessWorks, which uses the ActiveMatrix BusinessWorks
    Receive Event pattern to start a process that will perform the database update(s)
    and perhaps other operations as well. Optionally, the process can employ the ActiveMatrix
    BusinessWorks Send Event pattern to report results back to TIBCO BusinessEvents.


    The advantage of this pattern is that the full integration capabilities of ActiveMatrix
    BusinessWorks can be brought to bear. The database update can be performed as
    part of an XA transaction, and it can be coordinated with other activities as
    well.


    ## Summary


    TIBCO BusinessEvents processing units can be deployed in TIBCO ActiveMatrix BusinessWorks
    engines. A palette of ActiveMatrix BusinessWorks activities enables ActiveMatrix
    BusinessWorks to interact with TIBCO BusinessEvents channels. ActiveMatrix BusinessWorks
    can use these activities to send events, wait for events, and invoke TIBCO BusinessEvents
    rule functions. There is also a process starter activity that can be used to define
    a process that can be started by TIBCO BusinessEvents sending a message.


    TIBCO BusinessEvents can play the role of a service provider using a channel as
    the service interface. It can also play the role of a service consumer, with both
    asynchronous and synchronous interactions. There are a number of design patterns
    that can be used for this purpose. When TIBCO BusinessEvents is a synchronous
    service consumer, careful consideration has to be given as to where the operation
    is performed, because it will tie up the execution thread while waiting for the
    operation to complete.


    There are several options for TIBCO BusinessEvents to interact with databases.
    The TIBCO BusinessEvents Data Modeling extension provides the automatic definition
    of concepts that correspond to database tables and a set of RDBMS catalog functions
    for interacting with the database. Database concepts behave differently than ordinary
    concepts. By default, they are managed Memory Only, and they do not appear in
    working memory unless explicitly asserted. Database concepts must be explicitly
    loaded from the database, and changes to database concepts must be explicitly
    applied to the database.


    The TIBCO ActiveMatrix Adapter for Database can also be used for database interactions,
    with a messaging channel (JMS or TIBCO Rendezvous®) as the interface to the adapter.
    There are three interaction patterns that can be used. The use of the adapter
    makes it possible to inform TIBCO BusinessEvents of changes to the database.


    Interactions with a database can also be delegated to ActiveMatrix BusinessWorks.
    This provides the ability to execute XA transactions and coordinate the database
    update with other activities.

