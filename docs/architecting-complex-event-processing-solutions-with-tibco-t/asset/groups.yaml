    # Using an Event for Information Sharing


    The most straightforward means of information sharing is to load the information
    into an event and send it to the party that requires the information (Figure 14-1).


    As simple as this approach is, it has its drawbacks. An event is transient: It
    lives in the memory of the agent that receives it. If the agent is restarted,
    the information is gone. The distribution of events is limited: An event delivered
    to a queue will only be delivered to a single agent.


    # Using the Cache for Information Sharing


    Another approach to information sharing is to use the cache. In this approach,
    one agent loads the information into a concept that is being managed in Cache
    Only mode. This results in the concept being placed in the cache, which optionally
    may have replication and backing store configured to ensure the survivability
    of the information.


    There are two variations on this approach depending on the type of agent consuming
    the information. Figure 14-2 shows the pattern when


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_222_0.png)


    Figure 14-1: Information Sharing via Event


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_222_1.png)


    Figure 14-2: Information Sharing with an Inference or Process Agent via Cache'
  - '[PAGE 223]


    the consuming agent is an inference or process agent. The consuming agent is not
    automatically aware of the cached information: It must explicitly load the concept
    from the cache. This requires that there be sufficient information in the event
    triggering the activity in this agent to identify the concept(s) that need to
    be loaded. This pattern also characterizes the behavior when the consuming agent
    is a query agent executing a snapshot query.


    One potential problem with this pattern arises if the producing agent makes subsequent
    changes to the concept while the consuming agent is in the process of using the
    concept. This problem gives rise to the need for locking, which is described later
    in this chapter.


    The pattern is a bit different when the consuming agent is a query agent running
    a continuous query or a dashboard agent (Figure 14-3). In this situation, the
    consuming agent is automatically notified when the cached object changes. In the
    case of the query agent, the object may be a cached event or a concept. In the
    case of a dashboard agent, the object is a metric. Locking is generally not an
    issue with this pattern.


    A variant on these patterns arises when there are multiple agents that can modify
    the same concept (Figure 14-4). Here locking is clearly needed to maintain the
    consistency of the information residing in the concept.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_223_0.png)


    Figure 14-3: Information Sharing with a Continuous Query or Dashboard Agent via
    Cache


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_223_1.png)


    Figure 14-4: Multiple Producers'
  - '[PAGE 224]


    This situation is one that is particularly difficult to manage in practice. Locking
    not only adds overhead, but also the potential for delays as agents wait for other
    agents to release their locks. Preferable is an approach in which no more than
    one agent instance ever updates a particular concept. The patterns described in
    the section on managing sequencing constraints later in this chapter can be used
    for this purpose.


    A best practice with all these variants is to keep producers distinct from consumers.
    Mixing both roles in a single agent unnecessarily complicates locking and can
