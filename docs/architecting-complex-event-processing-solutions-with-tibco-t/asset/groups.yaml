  - '[PAGE 179]


    Recognize that there is no magic one-size-fits-all approach to solving this problem.
    What you need to do in the design depends to a great extent on the nature of the
    activity that cannot be repeated. However, TIBCO BusinessEvents provides you with
    the ability to recognize that the message has been redelivered. The incoming JMS
    message property `JMSRedelivered` indicates that the message has been redelivered.
    However, if you want to have access to this value in your logic, you need to define
    a Boolean `JMSRedelivered` property on the event.


    The general strategy for handling message redelivery when there are non-idempotent
    activities is shown in Figure 10-11. When it appears as if a message has been
    redelivered, the first step is to investigate to determine how much of the normal
    processing was completed. With this information in hand, the required remaining
    activities can then be identified and performed.


    Of course, this is just a sketch of the approach—the devil is in the details.
    Depending upon your design, you may implement this logic in preprocessor functions,
    rule conditions, or process orchestration exclusive gateways—or a combination
    of these. Some judgment is required as well. A lot of time and effort can be devoted
    to handling these situations. Be sure you clearly understand the negative consequences
    of repeating activities and adjust your design effort to be commensurate with
    the consequences.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_179_0.png)


    **Figure 10-11:** *Handling Message Redelivery for Non-idempotent Activities*'
