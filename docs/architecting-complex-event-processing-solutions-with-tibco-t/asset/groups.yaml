    # Preprocessing Behavior


    The default preprocessing behavior is shown in Figure 5-21. An external event
    source generates a message, which is received by the channel and processed by
    the channel thread. The channel thread creates the event from the incoming message
    and places it on a shared queue.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_117_0.png)


