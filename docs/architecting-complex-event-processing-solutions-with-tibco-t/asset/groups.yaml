    \ Server. Thus the threshold values for identifying potential fraud with this\
    \ pattern can be changed at runtime.\n\n# Listing 10-1: ACEPSTRuleTemplate Example\n\
    \n```\n```\nruletemplate Rules.FraudRuleTemplate {\n attribute {priority = 5;forwardChain\
