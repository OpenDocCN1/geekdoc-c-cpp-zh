    ## 摘要


    TIBCO BusinessEvents 产品套件由 TIBCO BusinessEvents 产品和五个扩展产品组成：TIBCO BusinessEvents
    数据建模、TIBCO BusinessEvents 决策管理器、TIBCO BusinessEvents 事件流处理、TIBCO BusinessEvents
    流程编排和 TIBCO BusinessEvents 视图。TIBCO BusinessEvents 数据建模使数据库信息能够在内存中缓存以供 TIBCO
    BusinessEvents 使用，并增加了状态机建模功能。TIBCO BusinessEvents 决策管理器增加了用于定义规则的类似电子表格的界面以及在运行时更改这些规则的能力。TIBCO
    BusinessEvents 事件流处理增加了查询功能和识别事件模式的能力。TIBCO BusinessEvents 流程编排增加了管理活动性能的能力。TIBCO
    BusinessEvents 视图增加了实时显示表格和图形信息的能力。


    TIBCO BusinessEvents 解决方案部署在一台或多台逻辑上分组为集群的处理单元上。每个处理单元运行一个或多个代理，其中有五种类型：推理代理、缓存代理、查询代理、流程代理和仪表板代理。


    TIBCO BusinessEvents 解决方案在 TIBCO BusinessEvents Studio 中定义。这些设计及其附带的部署描述符由 TIBCO
    Administrator 拾取。TIBCO Administrator 用于配置设计的部署，并借助每台目标机器上的 TIBCO Runtime Agent（TRA）部署设计并启动引擎。TIBCO
    BusinessEvents 监控和管理（BEMM）和脚本提供了部署和监控的替代方法。


    ## 第 5 章：推理代理


    ### 目标


    推理代理是 TIBCO BusinessEvents® 的核心。它为复杂事件处理提供分析功能，将信息暂存在内存中并使用规则对该信息进行操作。它通过多种通道与其外部环境交互，可感知并响应环境中的活动。


    阅读本章后您将能够描述


    - TIBCO BusinessEvents 中推理代理的作用

    - 信息如何以事件、概念和记分卡数据结构的形式表示

    - 事件、概念和记分卡如何在推理代理中创建和消费

    - 规则如何结构化并对事件、概念和记分卡进行操作

    - 推理代理如何使用通道与外部环境交互

    - 推理代理的线程模型和可用的调优选项


    ### 推理代理概述


    推理代理的内容相当多，一次全部呈现会令人困惑。我们将从图 5-1 的简化概述开始，然后逐步添加组件直到图完整。


    推理代理的功能核心是执行规则的运行至完成函数（RTC）。它对工作内存中保存的事件、概念和记分卡进行操作。通道提供输入和输出功能，缓存接口提供代理间的信息共享。我们稍后会介绍通道和缓存，但现在让我们先看看工作内存中信息的表示方式以及
    RTC 函数执行规则时对其的分析。


    ### 事件、概念和记分卡


    推理代理使用的三种主要内存驻留数据结构是：事件、概念和记分卡（图 5-2）。事件是描述事件信息的静态表示，无论是源自其他地方的事件还是源自推理代理本身的事件。事件一旦放置在工作内存中，就不可编辑。


    概念是除事件之外规则所需的信息表示。这可能是从其他来源导入的信息，或由推理代理累积和维护的信息


