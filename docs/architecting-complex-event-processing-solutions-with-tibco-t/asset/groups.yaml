    will be required. Seventeen Claim Tracker Cache Agents will be required, each
    with its own backing store file. A single Obtain Claim Status IA agent is needed.


    ## Processing Units


    Processing units are the engines of a TIBCO BusinessEvents solution. Some decisions
    about how many types of processing units to have in a design are driven by technical
    constraints. A processing unit that hosts a cache agent, for example, cannot host
    more than one cache agent and may not host any other type of agent.


    Further partitioning of agents into processing units is generally driven by performance
    considerations. While there is a lot of tuning capability in each agent, there
    is a practical limitation as to how much can be done in a processing unit, which
    is just a JVM.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_269_0.png)


    Figure 17-4: Processing Unit Modularization Example


    Figure 17-4 shows the processing unit modularization for the Claim Tracker example.
    Note that each processing unit contains exactly one agent. In keeping with the
    earlier demand analysis, there must be seventeen Cache PU and fourteen Monitor
    Claim Processing PU processing units to support the anticipated volume of activity.


    ## Clusters


    Clusters are the highest level of organization for TIBCO BusinessEvents. To some
    extent your choice of which agents to use will determine the minimum number of
    clusters needed. For example, if you decide to use both process agents and inference
    agents, you have no choice other than to use at least two clusters since the two
    cannot be mixed in the same cluster (see Chapter 8).


    More commonly, however, your decision to use multiple clusters will be driven
    by performance considerations. By default, communications between cache agents
    and other agents within a cluster occur via the multicast address that defines
    the cluster. If your solution involves cache objects that are unrelated to one
    another and share no logic, there is a performance advantage to using a different
    cluster for each group of cache objects and their related logic. Channels can
    then be used for communications between the clusters. This is the rationale for


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_270_0.png)


    **Figure 17-5:** *Claim Tracker Processing Unit Modularization*


    separating monitoring solutions (BEMM, in particular) into separate clusters (Figure
    17-5). Similarly, if the Claim Tracker were monitoring processes that were also
    executing in TIBCO BusinessEvents, it would be good practice to deploy the Claim
    Tracker in its own cluster.


    ## Object Management Configuration


    Your choice of object management modes for the various objects in your design
    will impact the detailed design of rule functions and


    Objects marked as not being saved in the backing store. The configuration choices
    are


    - No backing store

    - Shared all (database) with cache-aside

    - Shared all (database) with write-behind

    - Shared nothing (file)


    Your choice of backing store approach determines the kind of potential inconsistencies
    that may arise when agents are terminated unexpectedly. Because this affects the
    detail of design, the backing store decisions should be made before any detailed
    design is done.


    ## Claim Tracker Object Management Configuration


    Table 17-1 shows the object management configuration for the Claim Tracker example.
    Since the Claim Tracker is not the system of record for status information (it
    exists to speed up the location of a claim and accelerate the identification of
    processing problems), fault tolerance is not a requirement and therefore there
    will be no replication. Due to the volume of activity, Shared-Nothing backing
    store is selected for efficiency. Inbound events serve only as triggers, and outbound
    events are not needed once sent, so all events are managed in Memory Only mode.
    The Claim Status and Status Report concepts are managed Cache Only.


    Table 17-1: Claim Tracker Object Management Configuration


    | Object | Management Mode | Replication | Backing Store |

    |---|---|---|---|

    | Claim Status concept | Cache Only | none | Shared Nothing |

    | Status Report concept | Cache Only | none | Shared Nothing |

    | Claim Status Notification event | Memory Only, ttl=0 | none | none |

    | Claim Processing Exception event | Memory Only, ttl=0 | none | none |

    | Claim Status Request event | Memory Only, ttl=0 | none | none |

    | Claim Status Response event | Memory Only, ttl=0 | none | none |


    ## Deployment Patterns


    The performance analysis you have performed and modularization decisions you have
    made are not, in themselves, sufficient to ensure that your solution, when deployed,
    will meet the performance goals. In order to ensure this, you need to indicate
    your intent with regard to the deployment of the solution components on machines,
    indicating which components can share machines and which should be on separate
    machines. You should also indicate the minimum class of machine required.


    While the deployment pattern may be trivial, it is important to clearly communicate
    your design intent in terms of how the application should be deployed. Figure
    17-6 shows the intended deployment for the Claim Tracker solution. This clearly
    shows that each processing unit should be deployed on a separate machine.


    Table 17-2 shows the intended configuration for each machine used in the Claim
    Tracker deployment pattern and the number of each that will be required.


    In addition to specifying the initial deployment, it is prudent to give guidelines
    on how capacity can be scaled. In the Claim Tracker example, each Cache Machine
    is holding the status information for 4.26 million claims. The initially deployed
    capacity is thus 76.7 million claims, and the initial demand is expected to be
    for 70.4 million claims. As the demand begins to approach the deployed capacity,
    additional Cache Machines can be deployed, each adding a capacity of 4.26 million
    claims.


    Similarly, each Monitoring Machine can process 425 events/second, giving a capacity
    of 5,950 events/second. Initial demand is expected to be 5,356 events/second (4,736
    normal events + 620 timeout events). As demand grows, Monitoring Machines can
    be added, each adding a capacity of 425 events/second.


    **Table 17-2: Claim Tracker Machine Configuration**


    | Machine | RAM | CPU | Number Required |

    |---|---|---|---:|

    | Monitoring Machine | 16GB | 8 core | 14 |

    | Cache Machine | 64GB | 8 core | 18 |

    | Claim Status Machine | 16GB | 8 core | 1 |

    | EMS Machine | 8GB | 4 core | 1 |

