    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_150_0.png)


    Figure 7-8: Continuous Query Life Cycle


    It is common practice to create the query in a start-up function that runs when
    the agent is started. If you want the query to always be active, the instance
    can be created and executed here as well. If you only want the query to be active
    some of the time, define events to trigger the starting and stopping of the query,
    and use preprocessor functions for these events to invoke the requisite functions.


    # ACEPSTContinuousQuery Example


    The ACEPSTContinuousQuery example (Figure 7-9) involves three agents. The TestDriverInference
    agent takes the test data and generates a Transaction event, which is sent to
    the ProductionInference agent. The ProductionInference agent screens these transactions
    and generates instances of TinyTransaction and GiantTransaction, which are sent
    to the queryAgent.


    Figure 7-10 shows the execution details for this example. The ProductionInference
    agent examines the incoming Transaction and generates a TinyTransaction if the
    amount is less than $5, and it generates a GiantTransaction if the amount is greater
    than $10,000. It then consumes the Transaction. The generated transactions are
    sent to the queryAgent.'
