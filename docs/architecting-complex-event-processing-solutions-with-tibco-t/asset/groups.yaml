    The following sections explore these data structures and their intended usage.


    # Events


    An event data structure (Figure 5-3) is intended to be a representation of an
    event: a snapshot of a situation at some point in time. Be sure to name your events
    so that they are descriptive of the situation whose occurrence they are intended
    to represent. Events can have a timeToLive, some properties, and a payload. Events
    can also be subclassed from other events.


    The timeToLive parameter indicates, as the name implies, how long the event data
    structure will persist. A positive value, expressed in a time unit, indicates
    the period of time during which the event data structure will remain available.
    A value of zero indicates that the event data structure will remain around only
    until the first RTC cycle'
  - '[PAGE 98]


    completes. A negative value indicates that the event data structure will remain
    until it is explicitly deleted. The implications of selecting values for the `timeToLive`
    parameter are explored in the Chapter 6 discussion of memory management modes.
    Of course, any event may be explicitly removed at any time by calling the `consumeEvent()`
    catalog function.


    Event properties are named values that have a simple data type: `String`, `int`,
    `long`, `double`, `boolean`, or `DateTime`. Optionally, the values can be restricted
    so that they can only be taken from an enumeration of values provided by the indicated
    domain. Event properties are efficiently accessed by conditional expressions in
    rules.


    The event payload is an optional data structure whose structure is specified by
    an XML schema definition (XSD). Elements of the payload can be referenced in rules
    using XPath expressions, but this access is not as efficient as accessing properties.
    For this reason, when elements of the payload need to be accessed in rules and
    performance is a significant consideration, it is common practice to copy those
    element values into properties at the time the event is created. This is done
    during preprocessing, which is discussed later in this chapter.


