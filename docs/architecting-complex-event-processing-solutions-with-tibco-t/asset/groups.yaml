    An alternative, rule-based approach is shown in Figure 2-5. New transactions that
    arrive are placed in memory, and only the last hour’s transactions are kept in
    memory. The arrival of a transaction then triggers a rule. The rule checks to
    see whether the new transaction exceeds the $10,000 threshold. It then checks
    to see whether there is another transaction in memory with the same account number,
    with an amount less than the $5 threshold, and that occurred before the new transaction.


    There is more going on here than just the use of a rule for the evaluation: Data
    is being held in memory, not on disk. The policy for retaining the data in memory
    is to only hold the past hour’s worth of data; the trigger for evaluating the
    rule is a change to the data in memory. Performing complex-event processing at
    high rates requires these kinds of specializations in the manner in which data
    is stored, shared, and analyzed. Complicating things even more, there is no single
    specialization that is suitable in all circumstances. A major focus of this book
    is the exploration of various types of computational specializations, with particular
    emphasis on how they are supported by TIBCO Business Events.'
