    # Summary


    Changes in situations can be recognized in many ways. Trivially, an event may
    itself announce the change. In more complex situations, you may need to compare
    the event’s representation of current status against reference data to determine
    whether a change has occurred.


    If the reference data is not static, the event that you are comparing against
    the reference data may also result in a reference-data update. Here, the coordination
    of the comparison and the reference data update must be considered, as well as
    the system-of-record for the reference data.


    When the situation being monitored is complex, the use of a state machine or continuous
    query may be warranted.


    Abrupt shutdowns when JMS messaging is being used for input events can lead to
    the duplicate delivery of messages. Duplicates can be detected by adding a JMSRedelivered
    property to the incoming event. This property can then be used to trigger additional
    logic to determine how much prior work had been completed and adjust activity
    performance accordingly.


