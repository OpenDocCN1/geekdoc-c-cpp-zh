    # Postprocessing Behavior


    Once the RTC cycle has completed, there are a number of postprocessing activities
    to perform. Depending upon the value of the Boolean Agent.<agentName>.enableParallelOps
    property in the CDD file, these activities may be single-threaded or occur in
    parallel.


    Figure 5-22 shows the behavior for the single-threaded option. If changes have
    been made to objects with the cache-aside object management option selected, the
    required database updates are performed first (this is further described in Chapter
    6). Next the cache updates are performed. This sequencing ensures that object
    changes are not exposed in the cache until after the database operations have
    been successfully completed. Outbound events are sent next, followed by pending
    message acknowledgments. Finally, object locks are released (object locking is
    discussed in Chapter 6).


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_119_0.png)


    Figure 5-22: Postprocessing Behavior—Single Threaded'
