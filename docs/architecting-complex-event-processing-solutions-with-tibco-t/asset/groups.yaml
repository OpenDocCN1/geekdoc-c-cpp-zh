    are, in fact, many types of analysis that could be performed, each appropriate
    for recognizing a different kind of situation. In fact, it is the variety of possible
    types of analysis that lead to the varied feature set of TIBCO BusinessEvents®.


    # Complex-Event Processing (CEP)


    Complex-event processing is a term used to describe the computational activity
    that is driven by events. The analysis leading up to the recognition of a complex
    event is one example of complex-event processing. The orchestration of actions
    taken subsequent to event recognition also falls into this category.


    Complex-event processing is challenging for several reasons. One is the rate at
    which events can occur. Twitter processes hundreds of millions of messages per
    day, which poses challenges for applications trying to track the nature of the
    dialogs on Twitter. During peak periods, Visa processes upwards of 20,000 transactions'
