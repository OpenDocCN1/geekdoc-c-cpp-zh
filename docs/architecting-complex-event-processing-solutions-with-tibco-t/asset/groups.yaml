  mdcn: "\n## 使用 TIBCO 设计复杂事件处理解决方案\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_0_0.png)\n\
    \nPaul C. Brown\n\n## 使用 TIBCO® 设计复杂事件处理解决方案\n\n## TIBCO® 出版社\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_2_0.png)\n\
    \n访问 informit.com/tibcopress 查看所有可用出版物的完整列表。\n\nTIBCO® Press 提供书籍，帮助 TIBCO 技术用户设计和构建现实世界的解决方案。首批书籍——架构系列——通过结合\
    \ TIBCO 多样化产品套件中的组件，为构建解决方案提供实用指导。架构系列中的每本书都从三个角度覆盖一个应用领域：概念概述、适用 TIBCO 产品的调查，以及常见设计挑战和用于解决这些挑战的\
    \ TIBCO 特定设计模式的探索。该系列的第一本书《TIBCO® Architecture Fundamentals》介绍了 SOA 和事件驱动架构的基础知识。系列中的高级书籍各自解决一种特定的架构风格，包括复合应用和服务、复杂事件处理、业务流程管理以及数据中心解决方案。\n\
    \n该系列强调在一种被称为总架构的方法中统一业务流程和系统设计。关于这种分布式系统架构方法的技术中立描述见于《Implementing SOA: Total\
    \ Architecture in Practice》。关于解决相关组织和管理问题的技术见于《Succeeding with SOA: Realizing\
    \ Business Value through Total Architecture》。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_2_1.png)\n\
