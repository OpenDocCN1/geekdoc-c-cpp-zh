    # Partitioning Advantages and Disadvantages


    Partitioning provides the following advantages:


    +   - Simplifies maintenance: Changes to one activity are independent of changes
    to the other.

    +   - Provides deployment flexibility: As long as the rule sets and functions
    for each activity are separate, changing deployment patterns is a straightforward
    exercise that can enhance the ability to tune and resource each activity independently.


    It should be noted that, in general, stateless activities are easier to partition
    than stateful activities. The disadvantages of partitioning are


    +   - Complexity: When activities are deployed in separate agents there is an
    extra component involved. This can complicate the deployment process and may make
    traceability a challenge.

    +   - Communications overhead: Deploying the activities in separate components
    adds communication overhead. This is minimal when both activities are deployed
    in the same agent, or when both agents are deployed in the same processing unit
    and a local channel is used for communications.


    # Partitioning Rules of Thumb


    +   - Always separate rules and rule functions for different activities at design
    time. Use separate folders. This will simplify maintenance, and it sets the stage
    for partitioning if required.

    +   - Partition only when a positive advantage can be identified. This advantage
    must outweigh the communications overhead. Typically, this advantage is found
    when the volume of activity exceeds the ability for one agent to handle the load
    gracefully. The advantage gained is the ability to tune and resource the activities
    independently.

    +   - Consolidate state management. Do not partition the logic required to maintain
    a concept or its subordinate state machine(s). Doing so will introduce significant
    locking and coordination problems. For an alternative, see the sequencing challenges
    discussion in Chapter 14.'
