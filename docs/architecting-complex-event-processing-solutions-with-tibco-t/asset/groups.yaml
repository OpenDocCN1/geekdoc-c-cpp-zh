    Figure 12-12: Database Query


    ### Database Update and Delete


    While an inference agent can make changes to a database concept, those changes
    are not automatically saved in the database. An explicit call to the RDBMS catalog
    function Database.update() is required (Figure 12-13).


    Conversely, changes in the database itself are not automatically reflected in
    the database concept, nor is there any automatic mechanism for knowing that the
    database has changed (see section on using TIBCO ActiveMatrix® Adapter for Database).
    In order to get updated database information into database concepts, another query
    is required.


    A database deletion can be performed with a call to the RDBMS function Database.delete().
    Deletions in the database itself are not automatically reflected in the database
    concept. Recognizing a database deletion requires removing the database concept
    from memory and then repeating the query.


    ## Database Interaction Using TIBCO ActiveMatrix® Adapter for Database


    The TIBCO ActiveMatrix® Adapter for Database can also be used for database interactions
    (Figure 12-14). The adapter communicates with the target database using the JDBC
    or ODBC protocols.


    There are three interaction patterns possible with the adapter:


    - 1. Inference Agent Publication

    - 2. Inference Agent Request-Reply

    - 3. Inference Agent Subscription


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_208_0.png)


    Figure 12-13: Database Update


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_209_0.png)


    Figure 12-14: Database Adapter Configuration


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_209_1.png)


    Figure 12-15: Inference Agent Publication


    ### Inference Agent Publication


    In this pattern, the inference agent publishes a request to the adapter (Figure
    12-15). The adapter, in turn, performs the requested database operation. This
    is an in-only operation: No reply is generated for the request. The adapter provides
    several SQL operations that can be invoked in this manner:


    - Insert

    - Update

    - Delete

    - Insert/Update (update if the row exists, otherwise insert)


    ### Inference Agent Request-Reply


    The adapter provides the capability of executing SQL statements and stored procedures
    via a request-reply interaction (Figure 12-16). In employing this capability,
    the inference agent would use one of the asynchronous consumer patterns described
    earlier in this chapter.


    ### Inference Agent Subscription


    This pattern is used to inform the inference agent of changes to the database
    (Figure 12-17). During adapter configuration to publish changes from a database
    table, a trigger is placed in the database. When a database change occurs, a snapshot
    of the affected database record is placed in a publishing table. The adapter periodically
    checks to see whether there are any entries in the publishing table and, if there
    are, publishes a message for each entry. If the inference agent is a subscriber
    to these messages, it will receive the notifications of database change and can
    take whatever actions are appropriate for the application.


