    # Continuous Query Change Recognition Pattern


    Continuous queries (Chapter 7) can also be used to recognize change (Figure 10-9).
    Cached object changes or events directed to the cache agent enter the buffer if
    they meet the query selection criteria. Changes to the contents of the buffer
    trigger the reevaluation of the query. The query’s callback function then examines
    the query results and determines whether a change notification is warranted.


    When investigating fraudulent activity on accounts it is sometimes necessary to
    be notified in real time when there is activity on the account. The notification
    serves to prompt an investigator to immediately examine the activity and perhaps
    gather sufficient information to apprehend a suspect. Figure 10-10 shows how the
    activity alert could be generated by a continuous query set up to monitor the
    account. Note that there can be a number of these queries in operation at any
    given time, each monitoring a different account.


    # Handling Duplicate Events


    When JMS is being used as the message transport, it is possible for a message
    to be delivered more than once even when a JMS queue is being used. The reason
    for this is that, by default, agents do not acknowledge message receipt until
    the work triggered by the message receipt is complete. This occurs at the end
    of the RTC cycle in an inference agent or when a checkpoint is taken in a process
    agent.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_177_0.png)


    Figure 10-9: Continuous Query Change Recognition Pattern'
