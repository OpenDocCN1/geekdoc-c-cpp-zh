    The basic behavior of the run-to-completion function is shown in Figure 5-10.
    Some entity asserts events and concepts into the working memory (how this occurs
    will be discussed later). Objects that appear in equivalent join conditions are
    indexed on the values used for the


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_105_0.png)


    Figure 5-10: Run-to-Completion (RTC) Behavior'
  - '[PAGE 106]


    join as they are added to working memory. This greatly increases the efficiency
    of the equivalent join operation when it is eventually performed. Next, all of
    the rules that are triggered because of changes to events, concepts, or scorecards
    in the rule''s declarations clause are identified. The triggered rules are then
    sorted by their priority and rank values, as described earlier. This sorted list
    is referred to as the rule agenda.


    Once the rule agenda has been sorted, one rule is selected for evaluation and
    is removed from the rule agenda. The rule itself is used to construct what is
    known as a modified Rete network (see Rete Networks sidebar), which provides an
    efficient approach for evaluating rules against a set of objects. For each valid
    combination of input objects, the actions clause of the rule is then executed.


    # Rete Networks


    A description of the original Rete concept can be found in Charles L. Forgy''s
    classic paper, "Rete: A Fast Algorithm for the Many Pattern/Many Object Pattern
    Match Problem."2


    However, the approach described in Forgy''s paper does not cover rules whose conditions
    include joins between objects, including the equivalent and nonequivalent joins
    found in TIBCO BusinessEvents rules.


    Networks that can process joins are referred to as modified Rete networks. Unfortunately,
    no publicly available papers describe the operations of such a network. Furthermore,
    a thorough discussion of such networks and the rationale behind them is well beyond
    the scope of this book.


    The good news is that a detailed understanding of modified RETE networks is not
    really necessary to effectively use TIBCO BusinessEvents inference agents. You
    just need a general understanding of how conditional clauses are processed. This
    is provided in the form of examples in the discussion of the inference agent RTC
    behavior.


    In the actions clause, any actions that require communications outside the scope
    of the inference agent are queued for later execution. Other actions may affect
    working memory: deleting events, modifying scorecards, and creating, updating,
    or deleting concepts.'
  - '[PAGE 107]


    Once all of the actions have been completed, the rule agenda is again evaluated
    and sorted. If `forwardChain = true`, changes to the working memory may cause
    rules to be added to or removed from the agenda. Since values of concept properties
    can be updated, and these values can be used in the computation of the rule’s
    rank, even the sorting of the rule agenda may be altered.


    This process continues until there are no more rules in the rule agenda. At this
    point any events whose time-to-live has expired (including all whose time-to-live
    is zero) are removed from the working memory. A signal is sent to the post-RTC
    threads to begin performing all of the pending communications resulting from executing
    the rule actions.


