    如果你在表达式中放置多个子句，系统将按指定顺序对其进行求值。但在构建复合表达式时务必小心：你可能会迫使系统采用效率较低的求值方式。清单 5-2 就展示了这种低效设计的一个示例。


    ## 组织决策表

    决策表会被编译成决策树，在运行时用于计算返回值。该树可以在 TIBCO BusinessEvents® Studio 中可视化。树会展示条件的求值顺序。与规则条件一样，你应当合理组织决策表，使筛选条件先于等价连接被求值，等价连接先于非等价连接被求值。具体考量因素与规则条件完全相同。


    有时你会遇到这样的情况：将决策表拆分为两个或多个表反而能获得更好的性能。一种常见的情况是，部分输入数据字段用于计算得分或排名，而该计算结果又作为决策表其余逻辑的一部分。在这种情况下，如果将评分逻辑独立为一个决策，再将评分结果输入另一个决策表以做出最终决策，执行效率通常会更高（图
    16-1）。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_254_0.png)


    ## 访问大型 XML 事件负载

    当在规则条件中访问 XML 事件负载中的某个值时，需要使用 XPath 表达式来标识该值。为获取该值，必须对该表达式进行求值，并且条件表达式中每出现一次该值，就要对其求值一次。此外，求值成本会随着
    XML 数据结构中嵌套深度的增加而增加。


    当某个特定值被频繁访问时，向事件添加一个属性以降低访问该值的成本可能会带来好处。可以使用预处理函数在事件创建时计算该属性的值。通过这种方法，访问 XML 结构中该值的成本只
    incur 一次，之后该值便位于一个可以以最低成本访问的位置。


    ## 锁定对象

    只要某个可变对象在多个规则或规则函数中使用，就必须采用锁来确保对象中信息的完整性和一致性。回想一下，锁可以是单个代理本地的锁，也可以是跨多个代理的全局锁，本地锁比全局锁更高效。


    规则和规则函数的放置位置将决定所需的锁定类型。如果你的设计确保某个给定对象只会被某个代理的单个实例访问，那么你可以安全地使用本地锁并由此获得更高的效率。另一方面，如果你无法保证该对象只会被一个代理实例访问，那么你别无选择，只能使用全局锁。


    全局锁定会带来性能损失。通常，当同一类型的多个代理被部署以分担负载时，就会产生全局锁定的需求。目标是提高容量，但全局锁定带来的额外开销可能会显著抵消预期收益。在这种情况下，可以采用内容感知负载均衡（在第
    14 章中讨论）将工作定向分配给各个代理，从而使本地锁能够提供足够的保护。


    ## 选择推理代理线程模型

    关于推理代理线程，你需要做三种选择：RTC 前（pre-RTC）、RTC 和 RTC 后（post-RTC）。每种选择都有各自的性能影响。


    ### RTC 前选择

    每个目标指定用于处理到达该目标的事件的线程。这些线程不仅执行预处理函数，还执行随后的 RTC 周期。有三种选择：


    - 1. 共享池线程（默认）

    - 2. 专用工作线程池

    - 3. 调用方线程


    共享池由所有选择此选项的目标共享。在高峰期，到达不同目标的事件可能会竞争这些线程。虽然此选项很方便，但它不能保证一定能获得线程来处理来自某个给定目标的输入。


    专用工作线程池是特定于某个目标的。创建专用池可以保证处理到达该目标的事件的线程可用。然而，这种方法并非万能。给定的 Java 虚拟机（JVM）能够有效支持的线程数量存在实际限制。该限制因所用硬件和
    JVM 制造商的不同而有所差异。在高性能场景下，有必要进行一些研究和/或实验，以了解这些实际限制。


    第三种选择，即调用方线程，使用实际接收到事件的线程来完成所有预处理和 RTC 执行活动。调用方线程的数量因所使用的通道传输方式而异。许多通道调用方（如 HTTP
    和 TCP）是多线程的。其他通道，特别是 JMS 通道，则是单线程的。对于 JMS 通道使用调用方线程，是确保相关预处理和 RTC 执行保持单线程的一种方式。当排序成为需求时，这一点可能非常重要。


    仅仅因为你选择的线程模型具有多个线程，并不一定意味着所有这些线程都会积极处理输入。线程可能会因多种原因而被阻塞：进行同步 I/O 调用、等待对象锁，或者如果
    RTC 配置为单线程，则等待执行 RTC 周期。在选择线程模型和确定线程池大小时，所有这些因素都需要考虑。


