    # Solution Modularization Patterns


    # Objectives


    While rule-based approaches are powerful and flexible, without some discipline
    in organizing your rule-based solution you are liable to end up with a spaghetti-code
    nightmare. This chapter covers a number of patterns you can use to organize your
    solution and avoid this problem. After reading this chapter you will be able to


    +   - Explain two major principles that can be used for partitioning (modularizing)
    a solution

    +   - Explain the design patterns that arise from partitioning

