    # Managing Sequencing


    Many applications present situations in which it is important to maintain the
    order in which things are done. If you are performing transactions on a bank account,
    for example, it is important that the deposits and withdrawals actually be executed
    in the same sequence in which they were initiated.


    Sequencing becomes a challenge when there are multiple parties doing the work
    in parallel (Figure 14-9). Despite the fact that the source sends request 1 before
    request 2, in the absence of any coordination there is no guarantee that result
    1 will be produced before result 2. So the question becomes how to preserve sequencing
    when taking advantage of parallel processing.


    This question breaks down into two sub-questions: how to preserve sequencing within
    a single worker when the worker internally uses parallel processing, and how to
    preserve sequencing when there are multiple workers. These questions are addressed
    in Architecting Composite Applications and Services with TIBCO® when TIBCO Active'
