  - '[PAGE 31]


    # Sense, Analyze, and Respond


    What provides the user of the iPhone with extreme value is the ability to innovate,
    particularly in how the user interacts with the world. Enterprises can benefit
    by innovating in similar ways—specifically, in how they sense, analyze, and respond
    to the needs of their customers and business partners.


    Enterprises deliver value to their customers through their business processes.
    If you think about how a business process does this, each process senses something
    that is going on, analyzes the situation to determine whether action is required
    and what action to take, and responds by executing those actions. The enterprise
    senses an order from a business, analyzes the order by validating it and checking
    the company''s credit, and responds by shipping the requested goods and invoicing
    the business. The enterprise senses a change in stock inventory, analyzes it to
    determine whether new inventory needs to be ordered, and orders replenishment
    stock if necessary. Everything the enterprise does is through business processes,
    and business processes are nothing more than an organized way of sensing, analyzing,
    and responding to the enterprise''s ecosystem.


    A significant way in which an enterprise can gain competitive advantage is by
    improving its business processes. Businesses respond faster, offering next-day
    or same-day delivery instead of asking customers to wait six to eight weeks. Businesses
    sense customer needs and provide value-added services. Auto dealerships locate
    suitable financing for their customers, saving their customers time and trouble.
    Businesses develop an understanding of customer preferences. Retailers leverage
    customer loyalty programs to make targeted offers that not only please the customer
    by only making offers for things they are truly interested in, but also increase
    the efficiency of the marketing process and thus lowering the cost of sales.


    Every business process improvement is a change to the way in which that process
    senses, analyzes, and responds to the world around it. Sometimes this means doing
    things faster—doing them now. Sometimes this means doing them better—having the
    right information at the right time. Sometimes this means doing it cheaper—using
    more cost-effective resources to get the job done. Gaining competitive advantage—the
    two-second advantage—requires improving business processes through innovation
    in sensing, analyzing, and responding.'
  - '[PAGE 32]


    # Innovation in Sensing, Analyzing, and Responding


    Pre-computer business processes were driven exclusively by human activity. Each
    process started when one person took an action: a customer placed an order; an
    associate recorded the results of an inventory check. Someone else sensed this
    initial activity: the salesman recorded the order; the store manager received
    the updated inventory. Someone analyzed what was sensed to determine the appropriate
    response: the salesman validated the order and the pricing; the store manager
    determined which items required reordering. Someone responded to this situation:
    the salesman submitted the order for fulfillment; the store manager ordered replacement
    inventory.


    This sense-analyze-respond pattern is pervasive. Every participant in every business
    process performs these three functions. The participants interact with each other,
    each sensing what other participants have done and responding accordingly. When
    you include information systems as participants in business processes, each system
    has to sense some activity, analyze what it has sensed, and respond accordingly.
    The collaboration of these participants, human and system alike, creates an overall
    business process that, viewed as a whole, defines how the enterprise senses, analyzes,
    and responds.


    When it comes to improving a business process, every improvement to every business
    process is an improvement in sensing, analyzing, and responding somewhere in that
    business process. Let’s take a look at the types of innovations that can be applied.


    # Innovation in Sensing


    The sensing functionality of many business processes is passive; the process waits
    for a person or a system to submit a request. The sales process waits for the
    customer to place an order; the stock replenishment process waits for an associate
    to update an inventory level.


    Active sensing—sensing business significant events—can speed up processes. Consider
    the case of the stock replenishment process. Instead of manually taking inventory,
    you might maintain a running inventory that is automatically updated each time
    an item is sold, and then use this inventory to automatically order replenishment
    stock. Implementing such an innovation requires changes to three business processes:
    the Sales Process, the Inventory Management Process, and the Replenishment Process.
    The Sales Process changes are'
  - '[PAGE 33]


    +   - Sensing which products are being sold (e.g., using bar-code scanning)

    +   - Responding by generating point-of-sale transaction records that identify
    the products and quantities sold


    The Inventory Management Process changes are


    +   - Sensing the point-of-sale transactions as they occur

    +   - Analyzing each transaction to determine which product inventories require
    updating

    +   - Responding by updating the inventory record


    The Replenishment Process changes are


    +   - Sensing the change in inventory level

    +   - Analyzing the change to determine whether new stock needs to be ordered

    +   - Responding by ordering new stock as required


    Active sensing—automation—requires the sensing of business significant events
    and the subsequent analysis of and response to those events. In the previous example,
    there are three significant events: identification of the item being sold, sale
    of the goods, and updating of the inventory.


    Often one of the challenges you will face in active sensing is the lack of an
    observable event. Prior to bar-code scanning, for example, there really was no
    identification of what was being sold at the cash register. Only high-value items
    such as cars and appliances had sales receipts that identified the specific items
    being sold. Active sensing often requires changes to the process that make the
    events of interest observable in an automated way.


    A key difference between active and passive sensing is timeliness. Passively,
    the point-of-sale transactions might accumulate in a file or database, and the
    sensing might be done on a periodic basis by reading those records. Actively,
    the point-of-sale transactions might be published—announced—as they occur. Subscribers—announcement
    listeners—are informed immediately when a transaction occurs.


    Another key difference is data quality. Passively, during the time between one
    periodic inventory update and the next, the inventory data is out of date. Actively,
    the inventory data is up to date within seconds of the actual transaction—before
    the goods have even left the store. Errors in data can result in faulty decisions
    that adversely impact the enterprise.'
  - '[PAGE 34]


    In summary, there are two possible innovations in sensing. One is automating the
    sensing of business-significant events and thus providing information about what
    has occurred. The other is propagating those events in real time, as they are
    happening, and thus facilitating timely responses and improving data quality.


    # Innovation in Analysis


    Once an event of business significance has been sensed, some evaluation may be
    required to determine what, if anything, needs to be done. Such analysis typically
    requires access to reference information, which raises two questions: How is the
    reference information accessed, and when does the analysis occur? Both provide
    opportunities for innovation.


    Reference information often needs to be retrieved. If the same reference information
    needs to be retrieved repeatedly, accessing it can be computationally expensive.
    One approach to dealing with this is to accumulate the sensed events and perform
    the analysis periodically on batches of events. Such batching leads to delays
    in analysis and the subsequent responses.


    An alternative approach is to stage the reference information in such a way that
    the analysis of the event can occur immediately without a significant computational
    penalty. This makes possible the immediate analysis of events as they occur, making
    possible immediate responses as well.


    If events are analyzed soon enough, it then becomes possible to recognize an emerging
    situation before it actually occurs. This is what Vivek Ranadivé refers to as
    the two-second advantage.^1^ This anticipation makes it possible to take action
    and either take advantage of the situation or alter the outcome. For example,
    a bank might observe one of its good customers using its web site mortgage calculator
    and proactively make an offer for a mortgage to that customer.


    In summary, there are two possible innovations in analysis. One is positioning
    reference information so that its retrieval does not present a computational barrier
    to analysis. The other is to perform the analysis in real time, as the events
    occur. Doing both of these makes it possible to anticipate situations before they
    occur and leverage that anticipation through appropriate actions.


    1. Vivek Ranadivé and Kevin Maney, _The Two-Second Advantage: How We Succeed by
    Anticipating the Future—Just Enough_, London: Hodder & Stoughton (2011).'
