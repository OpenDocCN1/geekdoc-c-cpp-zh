    ## 管理排序


    许多应用程序都存在需要保持操作顺序的情况。例如，如果您正在对银行账户执行交易，那么存款和取款实际上必须按照发起时的相同顺序执行。


    当有多个参与方并行执行工作时（图 14-9），排序就会成为挑战。尽管源先发送请求 1 再发送请求 2，但在没有协调的情况下，无法保证结果 1 会在结果 2
    之前产生。因此问题就变成了如何在利用并行处理的同时保持排序。


    这个问题可以分解为两个子问题：当工作者内部使用并行处理时，如何在单个工作者内保持排序，以及当存在多个工作者时如何保持排序。当 TIBCO ActiveMatrix®
    Service Grid 组件（包括 TIBCO ActiveMatrix BusinessWorks™）充当工作者时，这些问题在《使用 TIBCO® 构建复合应用程序和服务》中有所涉及。让我们看看当推断代理充当工作者时，这些问题是如何处理的。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_230_0.png)


    图 14-9：排序问题


    ### 在单个推断代理内保持排序


    默认情况下，推断代理中的预处理使用共享线程池。这种默认配置本质上是并行的，无法保持排序。为了在推断代理内保持排序，需要做到以下两点。


    1. 使用 JMS 队列（以及对应的 JMS 目标）来传递请求。JMS 保证在单个发布者和单个订阅者之间，消息将按发送顺序交付。

    2. 在 CDD 中 JMS 目标的配置中，选择调用者线程线程模型。对于 JMS 目标，有一个单一线程处理输入消息，此选择将该线程用于执行预处理和 RTC
    周期执行。


    这些选择共同确保推断代理在处理请求时能够保持排序。


    ### 跨多个推断代理保持排序


    为了确保顺序处理，您需要使用本章前面描述的内容感知负载均衡以及一些额外的配置要求。


    - 使用 JMS 队列（以及对应的 JMS 目标）来传递请求。JMS 保证在单个发布者和单个订阅者之间，消息将按发送顺序交付。

    - 使用配置为路由器的推断代理。在 CDD 中其 JMS 目标的配置中，选择调用者线程线程模型。对于 JMS 目标，有一个单一线程处理输入消息，此选择确保预处理（执行路由）为单线程。

    - 对于每个工作推断代理，在 CDD 中其 JMS 目标的配置中，选择调用者线程线程模型。对于 JMS 目标，有一个单一线程处理输入消息，此选择将该线程用于执行预处理和
    RTC 周期执行。


