    ## Claim Status Timeout Rate


    Nouveau expects that 1% of claims will experience an issue resulting in a timeout
    event. Under normal conditions, the peak rate of these timeouts will follow the
    same pattern as the notification events, yielding a peak rate of 6.2 claims per
    second.


    Outages, however, may result in significantly higher peak rates. If a communication
    outage prevents the delivery of notifications, the rate of timeouts may begin
    to approach the claim submission rate of 620 events/second.


    ## Claim Status Request Rate


    Nouveau is planning to make claim status information available to the members
    of its health care plans. It is anticipated that 1% of claims will result in claim
    status requests. This works out to 44,000 claim status requests per day. In lieu
    of better information, Nouveau is assuming that half of these requests will occur
    over four hours. This works out to about three requests per second.


    From a performance perspective, this rate is so low compared to the status notification
    events that we will ignore them from a demand analysis perspective.


    ## Analysis


    ### Claim Processing


    The component interaction pattern for monitoring claim processing is shown in
    Figure 15-13. Each step in the claim process results in a corresponding notification
    event. Six of the steps have associated SLAs:


    - The file system will write data at a worst-case peak rate of 9.3 MB/second.

    - The EMS message server will receive exception messages at the rate of 620/second.

    - The network load will be 5 Mb/second from messaging and 149 Mb/second from the
    cache, for a total of 154 Mb/second.


    ### Analysis Interpretation


    The cache must retain approximately 1TB of data. Worst case, keeping all the data
    memory resident and assuming each cache agent can manage 64GB of memory, this
    will require 17 cache agents. Shared-nothing backing store will be used. Further
    analysis exploring the performance impact of only holding part of the data in
    memory may indicate that a reduction in the number of cache agents is possible.


    The inference agents processing the change notifications need to process 4,736
    events/second. A preliminary performance test performed on a laptop (8-core) and
    simulating the full life cycle of notification events with corresponding state
    machine updates produced a throughput of 425 events/second. Based on this preliminary
    analysis, approximately 12 inference agents will be required, along with a load
    distribution mechanism.


    The inference agents processing timeout notifications must process events at a
    rate of 620 events/second. While no simulation was performed for this activity,
    using the previous performance test the initial estimate is that two inference
    agents will be required for this task.


    The EMS server will need to handle 5,356 1KB messages/second, which is plausible
    for a single EMS instance. Attention will need to be paid to the storage configuration
    to attain this throughput.


    The network will need to handle 798 Mb/second. Attention will have to be paid
    to the network design to ensure the availability of this bandwidth.


    These are just preliminary estimates. Performance tests on the actual hardware
    to be used will be required for more accurate sizing.


    ### Sizing Rules of Thumb


    Because of long lead times for acquiring hardware, you may be asked to provide
    sizing information for development environments without having any indication
    of the actual application. In such cases, the following rules of thumb can be
    used:


    - Inference agents: 1 to 2 GB RAM per agent

    - Query agents: 1 to 2 GB RAM per agent

    - Cache agents: 4 to 8 GB RAM per agent


    Actual sizing information for production agents will depend heavily on the actual
    solution being deployed. Query agent memory requirements will depend heavily on
    the size of the data sets being returned. Cache agent memory sizing will depend
    on the number of concurrently active objects in the cache and the size of the
    objects. The lifetime of objects will determine the total size of the cache.


    ### Summary


    Your solution must be able to perform in a satisfactory manner for it to be a
    success. Achieving a satisfactory result requires understanding both the performance
    requirements and the ability of your design to attain those performance goals.


    The profiler provided with TIBCO BusinessEvents is a useful tool for understanding
    how inference agent rules are being evaluated at runtime. When rules are complicated
    and there is significant interaction among rules, this tool is indispensable.
    The information it provides can be used to refine your design to attain better
    performance.


    There are other design decisions that you make that also impact performance. These
    include


    - The manner in which rule conditions are structured

    - The manner in which decision tables are structured

    - The manner in which large XML event payloads are accessed in rule conditions

    - Your choice of locking strategies

    - Your choice of threading models for pre-RTC, RTC, and post-RTC processing

    - The use of synchronous I/O in rule actions


    In order to evaluate your solution’s ability to support performance requirements,
    it is necessary to convert these requirements into an understanding of the demands
    that they place on individual components. This can be accomplished by


    1. Identifying the triggering events and the peak rate at which they occur,

    2. Evaluating the pattern of interaction that occurs for each triggering event
    and determining the resulting impact on each of the components involved, and

    3. Given this understanding of demand, determining how many agents of each type
    will be required to support the demand.


    ## Deployment Planning


    ### Objectives


    When planning the deployment of a complex-event processing solution based on TIBCO
    BusinessEvents®, there are a number of things that you, the architect, need to
    define. How should the functionality be modularized? How should objects be managed
    and persisted? What is your intent regarding the actual deployment of the solution?
    What are the deployment requirements for supporting run-time configurability?
    What do you need to consider in terms of monitoring your solution?


    This chapter focuses on these issues. After reading this chapter, you will be
    able to describe what the architect needs to say about the following:


    - Modularization

    - Object management configuration

    - Deployment patterns

    - Deployment requirements for run-time configurability

    - Monitoring


    ### Modularization


    When you modularize a design, you are defining a decomposition of your design
    into units that are more readily maintained, managed, and tuned. The modularization
    of your design can be as important as the functionality itself in determining
    the success of your solution.


    ### Modularization Units


    There are three levels of modularization in a TIBCO BusinessEvents® solution (Figure
    17-1). At the highest level is the cluster. Each cluster contains one or more
    processing units, and each processing unit contains one or more agents.


    Each solution requires at least one cluster, and some may involve more than one.
    For example, a solution using both inference agents and process agents must have
    at least two clusters, since inference agents and process agents cannot be deployed
    in the same cluster. For performance reasons, a solution in which dashboard agents
    are being used for visualization should have a separate cluster for the agents
    involved in managing the visualization (including inference, cache, and dashboard
    agents). These should be in a cluster separate from the cluster executing the
    functional part of the solution.


    Modularization is largely about the packaging of functionality. It reflects your
    decisions about where different blocks of functionality


