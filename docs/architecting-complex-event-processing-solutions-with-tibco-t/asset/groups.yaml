    ## BusinessEvents Solution Life Cycle


    A TIBCO BusinessEvents solution begins its life in the TIBCO BusinessEvents Studio
    (Figure 4-13). Here the solution design is created and saved in an EAR file, and
    the deployment description is captured in a CDD file. These files are then picked
    up by the TIBCO Administrator. During deployment, the administrator communicates
    using TIBCO Rendezvous® or TIBCO Enterprise Message Service™ (EMS) with the TIBCO
    Runtime Agent (TRA) on each machine on which a processing unit will be deployed.
    The TRA places the required configuration information on the local machine’s file
    system, executes command lines to start and stop engines, and communicates with
    the engines to obtain status information.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_91_0.png)


    Figure 4-13: TIBCO BusinessEvents® Administrative Architecture Pattern


    Figure 4-14 details the interactions between these components during the life
    cycle. The TIBCO BusinessEvents Studio is used to design the application, with
    the design being saved in an EAR file. It is also used to define the packaging
    of the application components for deployment, with this packaging being saved
    in a cluster deployment descriptor (CDD) file. From the TIBCO Administrator these
    files are uploaded. Once the EAR file has been loaded, its properties and global
    variables can be set in preparation for deployment. Similarly, once the CDD file
    has been uploaded, the deployment of the components on individual machines can
    be specified. Upon deployment, the administrator communicates with the TRA on
    each involved machine to place both configuration files and executables on the
    machine. When the administrator starts the application, it instructs each involved
    TRA to execute the command line for each processing unit to be started. Upon start-up,
    each processing unit reads its configuration files from the local machine and
    begins processing.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_92_0.png)


    Figure 4-14: Solution Deployment Process


    TIBCO BusinessEvents provides another deployment and management option: TIBCO
    BusinessEvents® Monitoring and Management (MM). Monitoring and Management is,
    itself, a TIBCO BusinessEvents-based application, comprising two processing units
    and a TIBCO Hawk® agent (Figure 4-15). To monitor an application, MM requires
    the same EAR and CDD files that would have been used by the TIBCO Administrator
    to manage the application. MM can then directly manage the application’s processing
    units in a cluster. It uses SSH to deploy the processing units. It uses SSH or
    Hawk to start and stop processing units, and JMX to start, stop, and pause individual
    agents and enable and disable rules within an agent. It uses Hawk to collect performance
    data and monitor the health of the application cluster.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_93_0.png)


    Figure 4-15: TIBCO BusinessEvents® Monitoring and Management (MM) Deployment


    Both the TIBCO Administrator and TIBCO BusinessEvents Monitoring and Management
    provide the ability for scripted deployments. Please consult the product manuals
    for more details on these options.


    ## Summary


    The TIBCO BusinessEvents product suite consists of the TIBCO BusinessEvents product
    and five extension products: TIBCO BusinessEvents Data Modeling, TIBCO BusinessEvents
    Decision Manager, TIBCO BusinessEvents Event Stream Processing, TIBCO BusinessEvents
    Process Orchestration, and TIBCO BusinessEvents Views. TIBCO BusinessEvents Data
    Modeling enables caching database information in memory for use by TIBCO BusinessEvents
    and adds state machine modeling capability. TIBCO BusinessEvents Decision Manager
    adds spreadsheet-style interfaces for defining rules and the ability to change
    those rules at runtime. TIBCO BusinessEvents Event Stream Processing adds query
    capabilities and the ability to recognize patterns of events. TIBCO BusinessEvents
    Process Orchestration adds the ability to manage the performance of activities.
    TIBCO BusinessEvents Views adds the ability to display tabular and graphical information
    in real time.


    TIBCO BusinessEvents solutions are deployed on one or more processing units that
    are logically grouped together into clusters. Each processing unit runs one or
    more agents, of which there are five types: inference agents, cache agents, query
    agents, process agents, and dashboard agents.


    TIBCO BusinessEvents solutions are defined in the TIBCO BusinessEvents Studio.
    These designs, and accompanying deployment descriptors, are picked up by the TIBCO
    Administrator. The TIBCO Administrator is used to configure the design for deployment
    and, with the aid of the TIBCO Runtime Agent (TRA) on each target machine, deploy
    the design and start the engines. TIBCO BusinessEvents Monitoring and Management
    (BEMM) and scripts provide alternative approaches for deployment and monitoring.


