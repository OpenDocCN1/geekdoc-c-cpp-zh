    has not occurred and results in the generation of an event marking this recognition.


    # Complex Events


    A complex event is one whose recognition requires analysis (Figure 2-3). The analysis
    itself is triggered by the arrival of an event that serves as the triggering event
    for the analysis. The expiration of a timer, for example, might serve as the triggering
    event for an analysis that determines whether an expected event has actually occurred.
    The triggering event, which could be either a technical or business event, is
    an indication that some state of the world has changed and consequently an analysis
    is warranted.'
