  mdcn: "\n\n## 后处理行为\n\n一旦 RTC 周期完成，还需要执行许多后处理活动。根据 CDD 文件中布尔属性 `Agent.<agentName>.enableParallelOps`\
    \ 的值，这些活动可以单线程执行，也可以并行执行。\n\n图 5-22 显示了单线程选项的行为。如果对选择了 cache-aside 对象管理选项的对象进行了更改，则首先执行所需的数据库更新（详见第\
    \ 6 章）。接下来执行缓存更新。这种顺序确保了在数据库操作成功完成之前，对象更改不会在缓存中暴露。接下来发送出站事件，然后是待处理的消息确认。最后，释放对象锁（对象锁定在第\
    \ 6 章中讨论）。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_119_0.png)\n\n图 5-22：后处理行为——单线程\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_120_0.png)\n\n图 5-23：后处理行为——多线程\n\n\
    图 5-23 显示了多线程处理的行为。所有活动并行运行，其中事件输出和缓存更新活动使用来自 `Agent.threadcount` 线程池的线程，数据库更新（如果需要）使用来自\
    \ `Agent.dbthreadcount` 线程池的线程。\n\n## ACEPSTLocalChannel 示例\n\nACEPSTLocalChannel\
    \ 示例说明了几个功能，包括：\n\n-   使用两个推理代理配置处理单元\n-   本地通道的使用\n-   规则操作发布事件\n-   预处理器函数创建和消费事件\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_121_0.png)\n\n### 图 5-24：ACEPSTLocalChannel\
    \ 示例配置\n\n图 5-24 显示了此示例的配置。它包含一个名为 inferenceProcUnit 的处理单元，其中包含两个推理代理：testDriverInference\
    \ 和 productionInference。这两个推理代理之间配置了一个本地通道。\n\n测试驱动推理代理的存在仅仅是为了向生产推理代理提供交易事件。当示例项目在调试器中运行时，测试数据被直接馈送到测试驱动推理代理的工作内存中。测试数据包含\
    \ SourceTransaction 事件，这些事件触发源交易规则（清单 5-3）。规则操作使用传入事件中的数据创建 Transaction 事件，并将该事件发送到其默认目的地，该目的地与本地通道关联。这导致新创建的事件被发送到生产推理代理。\n\
    \n### 清单 5-3：源交易规则\n\n```\nrule Rules.SourceTransaction {\n    attribute {\n \
    \       priority = 5;\n        forwardChain = true;\n    }\n    declare {\n  \
    \      Events.SourceTransaction sourceTransaction;\n    }\n    when {\n\n}\nthen\
    \ {\n        // Create the real transaction to drive\n            the test\n \
    \       Events.Transaction newTransaction =\n            Events.Transaction.Transaction(\n\
    \                null,\n                null,\n                sourceTransaction.accountNumber,\n\
    \                sourceTransaction.\n                    transactionAmount,\n\
    \                sourceTransaction.\n                    transactionDateTime);\n\
    \        Event.sendEvent(newTransaction);\n    }\n}\n```\n\nTransaction 事件到达生产推理代理。与本地通道关联的目的地配置了\
    \ newTransaction 规则函数（清单 5-4）作为此事件的预处理器函数。此函数接收传入的交易，并确定其金额是低于 5 美元阈值还是高于 10,000\
    \ 美元阈值。如果低于 5 美元阈值，则创建并断言 TinyTransaction；如果大于 10,000 美元，则创建并断言 GiantTransaction。在所有情况下，它都会消费原始交易。\n\
    \n### 清单 5-4：*newTransaction* 规则函数\n\n```\nvoid rulefunction RuleFunctions.newTransaction\
    \ {\n    attribute {validity = ACTION;}\n    scope {Events.Transaction transaction;\
    \ }\n    body {\n        if (transaction.transactionAmount <= 5.00) {\n      \
    \      TinyTransaction tinyTransaction =\n                Events.TinyTransaction.TinyTransaction(\n\
    \                    null,\n                    null,\n                    transaction.accountNumber,\n\
    \                    transaction.transactionAmount,\n                    transaction.transactionDateTime);\n\
    \            System.debugOut(\"Created tiny transaction:\n                \" +\
    \ tinyTransaction@id);\n            Event.assertEvent(tinyTransaction);\n    \
    \        System.debugOut(\"Asserted tiny transaction:\n                \" + tinyTransaction@id);\n\
