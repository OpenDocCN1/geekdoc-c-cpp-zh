    # TIBCO® Press


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_2_0.png)


    Visit informit.com/tibcopress for a complete list of available publications.


    TIBCO® Press provides books to help users of TIBCO technology design and build
    real-world solutions. The initial books – the architecture series – provide practical
    guidance for building solutions by combining components from TIBCO’s diverse product
    suite. Each book in the architecture series covers an application area from three
    perspectives: a conceptual overview, a survey of applicable TIBCO products, and
    an exploration of common design challenges and TIBCO-specific design patterns
    for addressing them. The first book in the series, TIBCO® Architecture Fundamentals,
    addresses the basics of SOA and event-driven architectures. Each of the advanced
    books addresses a particular architecture style, including composite applications
    and services, complex event processing, business process management, and data-centric
    solutions.


    The series emphasizes the unification of business process and system design in
    an approach known as total architecture. A technology-neutral description of this
    approach to distributed systems architecture is described in Implementing SOA:
    Total Architecture in Practice. Techniques for addressing the related organizational
    and management issues are described in Succeeding with SOA: Realizing Business
    Value through Total Architecture.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_2_1.png)


