    \ Typically the beginning of this time interval coincides with some previous event:\
    \ The clock marking the deadline for delivering a product starts when the order\
    \ is placed.\n\nSometimes the recognition is more complicated: An event is supposed\
    \ to occur at some regular intervals, and the observance is that the expected\
    \ events have been absent for some period of time. This is a common approach to\
    \ liveness testing: A component sends a heartbeat at regular intervals indicating\
    \ that it is operating properly. The absence of these heartbeats for some period\
    \ of time is an indication that there is a problem.\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_42_0.png)\n\
    \n**Figure 2-2:** *Possible Relationships between Two Intervals*\n\nNote that\
    \ the event marking the recognition of a missing event is always a complex event:\
    \ Its generation is the result of an analysis triggered by another event, namely\
    \ the expiration of a timer. The analysis indicates that the expected event has\
    \ not occurred and results in the generation of an event marking this recognition.\n\
    \n## Complex Events\n\nA complex event is one whose recognition requires analysis\
    \ (Figure 2-3). The analysis itself is triggered by the arrival of an event that\
    \ serves as the triggering event for the analysis. The expiration of a timer,\
    \ for example, might serve as the triggering event for an analysis that determines\
    \ whether an expected event has actually occurred. The triggering event, which\
    \ could be either a technical or business event, is an indication that some state\
    \ of the world has changed and consequently an analysis is warranted.\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_43_0.png)\n\
    \n**Figure 2-3:** *Complex Event*\n\nThe complexity and nature of the required\
    \ analysis varies greatly. Sometimes the analysis is simple: It just examines\
    \ the current event to determine its business significance. For example, the current\
    \ event might be a banking transaction, and the analysis determines whether the\
    \ transaction amount exceeds $10,000 and therefore requires the filing of a Currency\
    \ Transaction Report with the Internal Revenue Service.² Sometimes the analysis\
    \ is complex, determining whether a pattern indicating fraud has been recognized\
    \ or whether a process is executing as it should. There are, in fact, many types\
    \ of analysis that could be performed, each appropriate for recognizing a different\
    \ kind of situation. In fact, it is the variety of possible types of analysis\
    \ that lead to the varied feature set of TIBCO BusinessEvents®.\n\n## Complex-Event\
    \ Processing (CEP)\n\nComplex-event processing is a term used to describe the\
    \ computational activity that is driven by events. The analysis leading up to\
    \ the recognition of a complex event is one example of complex-event processing.\
    \ The orchestration of actions taken subsequent to event recognition also falls\
    \ into this category.\n\nComplex-event processing is challenging for several reasons.\
    \ One is the rate at which events can occur. Twitter processes hundreds of millions\
    \ of messages per day, which poses challenges for applications trying to track\
    \ the nature of the dialogs on Twitter. During peak periods, Visa processes upwards\
    \ of 20,000 transactions\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_45_0.png)\n\
    \n**Figure 2-4:** *Procedural Analysis*\n\nbe recorded and queried is a major\
    \ issue. This is particularly the case if conventional relational database technology\
    \ is used for the datastore.\n\nAn alternative, rule-based approach is shown in\
    \ Figure 2-5. New transactions that arrive are placed in memory, and only the\
    \ last hour’s transactions are kept in memory. The arrival of a transaction then\
    \ triggers a rule. The rule checks to see whether the new transaction exceeds\
    \ the $10,000 threshold. It then checks to see whether there is another transaction\
    \ in memory with the same account number, with an amount less than the $5 threshold,\
    \ and that occurred before the new transaction.\n\nThere is more going on here\
    \ than just the use of a rule for the evaluation: Data is being held in memory,\
    \ not on disk. The policy for retaining the data in memory is to only hold the\
    \ past hour’s worth of data; the trigger for evaluating the rule is a change to\
    \ the data in memory. Performing complex-event processing at high rates requires\
    \ these kinds of specializations in the manner in which data is stored, shared,\
    \ and analyzed. Complicating things even more, there is no single specialization\
    \ that is suitable in all circumstances. A major focus of this book is the exploration\
    \ of various types of computational specializations, with particular emphasis\
    \ on how they are supported by TIBCO Business Events.\n\nCorrelating events with\
    \ reference data can provide a broader analysis perspective. Using the account\
    \ number from an event to access other information about the account or using\
    \ the customer ID to access information about the customer permits this related\
    \ information to be used as part of the analysis.\n\nPerhaps the richest form\
    \ of correlation is between an event and a model of the behavior that is expected\
    \ to be observed. A model of the proper execution of a business process that identifies\
    \ the events that should be observed during its execution provides an excellent\
    \ reference for interpreting the events that actually occur. This perspective\
    \ makes it possible to determine whether the process is executing as planned.\n\
    \nAnalysis often combines multiple types of correlation. For example, you might\
    \ want to analyze the calls coming in to a customer support center to identify\
    \ customers that are having an unusually hard time getting a problem resolved.\
    \ Given an initial event indicating an incoming call, you might correlate the\
    \ telephone number in the event with customer records to identify the customer\
    \ who is calling. You might also correlate this event with other incoming call\
    \ events to see whether there were other calls from the same customer within the\
    \ past hour. If you find three or more events correlated in this way, you might\
    \ conclude that the customer is having a significant problem and take action by\
    \ escalating the call to a supervisor. Note that by correlating each call with\
    \ a customer, you set the stage for recognizing and correlating other calls from\
    \ that same customer that happen to have originated from different phones (for\
    \ example, home, mobile, work).\n\nCorrelation is fundamental to CEP analysis.\
    \ As such, when you undertake a CEP project it is prudent to focus your initial\
    \ attention on identifying the things that need to be correlated and the basis\
    \ upon which they will be correlated. This understanding will then guide the design\
    \ of your data structures and inform the rest of your design.\n\n## Context\n\n\
    The analysis of an event always requires some form of contextual information.\
    \ The previous examples involved context, such as reference data and expected-behavior\
    \ models. In general, context falls into three broad categories:\n\n1. Constants\
    \  \n2. Data  \n3. Metadata  \n"
  mdcn: "\n识别是分析的结果，它确定发生了具有业务意义的事件。需要此类分析的事件称为*复杂事件*。\n\n## *点事件和区间事件*\n\n通常，当您想到一个事件时，您会将事件的发生与某个时间点联系起来：提交订单的时间或断电的时间。通常，这是捕获技术事件的时间。此类事件称为*点事件*。\n\
    \n然而，有些事件会在一段时间内发生。例如，TIBCO用户大会（TUCON）是一场持续数天的事件。电视节目在30分钟或一小时内发生。在一段时间内发生的事件称为*区间事件*。\n\
    \n为什么这种区别很重要？当您需要比较两个事件之间的时间关系时，这一点很重要：比较区间事件比比较点事件更复杂。对于一对点事件，只有三种可能的关系：之前、同时或之后。对于区间事件，两个事件之间有十五种可能的关系（图2-2）。最后两种关系是特殊情况，其中一个事件退化为与剩余区间的开始或结束重合的点事件。\n\
    \n## 缺失事件\n\n有时，您正在寻找的业务相关事件是观察到某个其他事件未被观察到，至少在其预期发生时未被观察到。当存在关于事件应何时发生的服务级别协议，且预期事件在该时间间隔内未发生时，就会出现这些情况。通常，此时间间隔的开始与某个先前事件重合：标记产品交付截止日期的时钟从下订单时开始计时。\n\
    \n有时识别更复杂：一个事件应该按一定的时间间隔发生，而观察到的是预期事件在一段时间内没有出现。这是活性测试的常用方法：组件定期发送心跳，表明其运行正常。这些心跳在一段时间内的缺失表明存在问题。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_42_0.png)\n\n**图2-2：** *两个区间之间的可能关系*\n\
    \n请注意，标记缺失事件识别的事件始终是复杂事件：它的生成是由另一个事件（即计时器到期）触发的分析结果。该分析表明预期事件尚未发生，并导致生成一个标记此识别的事件。\n\
    \n## 复杂事件\n\n复杂事件是指其识别需要分析的事件（图2-3）。分析本身由作为分析触发事件的事件到达所触发。例如，计时器到期可以作为分析触发事件，用于确定预期事件是否确实发生。触发事件可以是技术事件或业务事件，它表明世界的某种状态已发生变化，因此有必要进行分析。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_43_0.png)\n\n**图2-3：** *复杂事件*\n\n所需分析的复杂性和性质差异很大。有时分析很简单：它只检查当前事件以确定其业务意义。例如，当前事件可能是一笔银行交易，分析确定交易金额是否超过10,000美元，因此需要向美国国税局提交货币交易报告。²有时分析很复杂，要确定是否已识别出表明欺诈的模式，或者流程是否正在按预期执行。事实上，可以执行多种类型的分析，每种分析都适合识别不同类型的情况。实际上，正是可能分析类型的多样性导致了TIBCO\
    \ BusinessEvents®的多样化功能集。\n\n## 复杂事件处理（CEP）\n\n复杂事件处理是一个术语，用于描述由事件驱动的计算活动。导致复杂事件识别的分析是复杂事件处理的一个例子。事件识别后采取的行动编排也属于这一类。\n\
    \n复杂事件处理之所以具有挑战性，有几个原因。一是事件发生的速率。Twitter每天处理数亿条消息，这对试图跟踪Twitter上对话性质的应用构成了挑战。在高峰期，Visa处理超过20,000笔交易\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_45_0.png)\n\n**图2-4：** *过程分析*\n\n这些交易被记录和查询是一个主要问题。如果数据存储使用传统的关系数据库技术，情况尤其如此。\n\
    \n另一种基于规则的替代方法如图2-5所示。到达的新交易被放入内存，并且只将最近一小时的事务保留在内存中。交易到达后触发一条规则。该规则检查新交易是否超过10,000美元的阈值。然后检查内存中是否有另一个交易具有相同的账号、金额低于5美元阈值，并且发生在新交易之前。\n\
    \n这里不仅仅是使用规则进行评估：数据保存在内存中，而不是磁盘上。将数据保留在内存中的策略是只保存过去一小时的数据；评估规则的触发器是内存中数据的更改。以高速率执行复杂事件处理需要在数据存储、共享和分析方式上进行此类专门化。更复杂的是，没有一种专门化适用于所有情况。本书的一个主要焦点是探索各种类型的计算专门化，特别强调TIBCO\
    \ Business Events如何支持这些专门化。\n\n将事件与参考数据相关联可以提供更广泛的分析视角。使用事件中的账号访问有关账户的其他信息，或使用客户ID访问有关客户的信息，可以将这些相关信息用作分析的一部分。\n\
    \n也许最丰富的关联形式是事件与预期观察到的行为模型之间的关联。业务流程正确执行的模型能够识别在执行过程中应该观察到的事件，为解释实际发生的事件提供了极好的参考。这种视角使得确定流程是否按计划执行成为可能。\n\
    \n分析通常组合多种类型的关联。例如，您可能希望分析拨打客户支持中心的电话，以识别那些在解决问题时遇到异常困难的客户。给定一个指示来电的初始事件，您可以将事件中的电话号码与客户记录相关联，以识别正在呼叫的客户。您还可以将此事件与其他来电事件相关联，查看在同一小时内是否有来自同一客户的其他电话。如果您发现三个或更多事件以这种方式关联，您可能会得出结论，该客户遇到了严重问题，并采取行动将电话升级给主管。请注意，通过将每个电话与客户相关联，您为识别和关联同一客户恰好从不同电话（例如家庭电话、手机、工作电话）发起的其他电话奠定了基础。\n\
    \n关联是CEP分析的基础。因此，当您开展CEP项目时，明智的做法是将初始注意力集中在识别需要关联的事物以及它们将基于什么进行关联上。这种理解将指导您设计数据结构，并为设计的其余部分提供信息。\n\
    \n## 上下文\n\n事件的分析总是需要某种形式的上下文信息。前面的示例涉及上下文，例如参考数据和预期行为模型。通常，上下文分为三大类：\n\n1. 常量\
    \  \n2. 数据  \n3. 元数据  \n"
