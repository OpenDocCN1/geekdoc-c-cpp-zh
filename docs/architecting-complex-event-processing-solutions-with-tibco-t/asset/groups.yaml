    will survive the loss of a cache agent.


    Objects in cache may be optionally persisted, either in a database (Shared-All
    option) or in files (Shared-Nothing option). With Shared-All, there are two sub-modes:
    Cache-Aside and Write-Behind. With Cache-Aside, the inference agent does the database
    update, while in Write-Behind the cache agent does the database update. In the
    Shared-Nothing option, each cache agent persists the objects in its memory to
    a separate file.'
