    \ 7-4 表示将接受（添加）新对象，并且对象将保留一小时。有三种可用的保留策略类型。\n\n1. 滑动：将保留满足指定条件的最近 n 个对象。\n2. 滚动：最多保留\
    \ n 个对象，达到上限后缓冲区将被清空以重新开始。\n3. 时间窗口：对象在指定的时间段内保留在缓冲区中。\n\n清单 7-4 中包含两个使用时间窗口的显式缓冲区管理示例。\n\
    \n### 隐式\n\n在隐式缓冲区管理中，查询中没有 policy 子句。满足指定条件的新对象会被添加到缓冲区，被删除的对象会被移除。更改的对象会首先从缓冲区中移除（不触发查询求值），然后被添加（这将触发查询求值）。\n\
    \n## 持续查询生命周期\n\n持续查询的生命周期如图 7-8 所示。该周期以调用 Query.create() 开始。此函数的参数之一是定义查询的字符串。请注意，如果查询定义中存在错误，此函数可能会抛出异常。\n\
    \n查询创建后，通过 Query.Statement.open() 创建查询的实例，并通过调用 Query.Statement.setVar() 设置变量的值。使用\
    \ Query.Statement.execute() 执行查询需要一个用户定义的回调函数。这是一个用户定义的规则函数，必须具有查询语句回调所需的类型签名。函数体包含指示如何处理查询结果的逻辑。每次查询被重新求值时都会调用该函数。\n\
    \n一旦执行，查询将保持活动状态，直到代理关闭或调用 Query.Statement.close()。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_150_0.png)\n\
    \n图 7-8：持续查询生命周期\n\n通常的做法是在代理启动时运行的启动函数中创建查询。如果您希望查询始终处于活动状态，也可以在此处创建并执行实例。如果您只希望查询在某些时候处于活动状态，请定义事件来触发查询的启动和停止，并为这些事件使用预处理器函数来调用所需的功能。\n\
    \n## ACEPSTContinuousQuery 示例\n\nACEPSTContinuousQuery 示例（图 7-9）涉及三个代理。TestDriverInference\
    \ 代理获取测试数据并生成 Transaction 事件，该事件被发送到 ProductionInference 代理。ProductionInference\
    \ 代理筛选这些事务并生成 TinyTransaction 和 GiantTransaction 实例，这些实例被发送到 queryAgent。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_151_0.png)\n\
    \n图 7-9：ACEPSTContinuousQuery 配置\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_151_1.png)\n\
    \n图 7-10：ACEPSTContinuousQuery 执行\n\nqueryAgent 中的预处理器将传入的事务添加到缓冲区，每次缓冲区被修改时都会重新求值查询。该查询是清单\
    \ 7-4 中显示的查询，它在来自线程池的某个线程上执行，线程池的大小可以通过 be.agent.query.continuous.threadpoolsize\
    \ 参数设置。\n\n## 总结\n\n查询代理执行两种类型的查询：快照查询和持续查询。快照查询在由事件接收触发的预处理器函数中执行。快照查询检查缓存的内容。运行查询的预处理器函数决定如何处理查询结果，要么以事件的形式发送结果，要么分析结果并采取适当的操作。\n\
    \n持续查询在对象缓冲区上运行。查询指定缓冲区中的对象类型以及添加和移除这些对象的条件。对象可以来自缓存或查询代理通道。当缓冲区内容发生变化时，查询会被重新求值。用户定义的回调函数会随查询结果一起被调用，并决定要采取的操作。\n\
    \n快照查询和持续查询都通过调用函数来定义、实例化和执行。通常，查询定义在查询代理的启动函数中执行。快照查询的实例化和执行通常在预处理器函数中完成。始终运行的持续查询的实例化通常在启动函数中完成。如果查询只运行部分时间，这些函数将在预处理器函数中被调用，以响应传入事件来启动和停止查询。\n\
    \n## 流程代理\n\n## 目标\n\n本章介绍流程代理的操作。读完本章后，您将能够描述流程代理的预期用途、流程的定义方式、可用的流程任务类型以及流程的执行方式。您还将能够解释流程检查点与恢复，以及流程代理部署的一些限制。\n\
    \n## 预期用途\n\n虽然规则为分析情况和得出结论提供了非常强大的范例，但有些事情实际上很难用规则来完成。其中之一是编排由其他组件执行的多个活动，特别是当某些活动涉及异步交互时。流程代理的目的是为实施此类流程编排提供一种便捷的方法。\n\
    \n流程代理的一个常见应用是为事件提供编排响应（图 8-1）。在此类应用中，某个其他组件（例如，推理代理）已宣布存在需要编排响应的情况。在此示例中，对潜在欺诈的识别导致了生成\n"
