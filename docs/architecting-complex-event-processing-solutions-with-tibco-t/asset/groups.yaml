    ## Solution Modularization Patterns


    ### Objectives


    While rule-based approaches are powerful and flexible, without some discipline
    in organizing your rule-based solution you are liable to end up with a spaghetti-code
    nightmare. This chapter covers a number of patterns you can use to organize your
    solution and avoid this problem. After reading this chapter you will be able to


    - Explain two major principles that can be used for partitioning (modularizing)
    a solution

    - Explain the design patterns that arise from partitioning

    - Explain the advantages and disadvantages of partitioning

    - Describe the rules of thumb for partitioning


    ### Partitioning Situation Recognition from Action


    The characteristic pattern of an event-driven process (Figure 2-11) is also a
    best practice for partitioning logic in a design (Figure 13-1). In this pattern,
    the logic of recognizing that a particular situation exists is separated from
    the logic of what to do now that the situation has been recognized. The recognition
    that the situation exists is announced by sending an event, and the subsequent
    action is triggered by the arrival of that event.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_214_0.png)


    Figure 13-1: Partitioning Situation Recognition from Taking Action


    When situation recognition and the execution of the action both involve complex
    logic, mixing the logic together makes it difficult to clearly understand the
    logic behind either. Partitioning the two not only adds clarity but simplifies
    logic maintenance as well. It also makes it trivially easy to add additional actions
    in response to the event.


    Partitioning in this manner does not necessarily require that the two roles are
    being played by different agents. The situation announcement event could be locally
    asserted by an inference agent, triggering separate rules in the same agent that
    manages the required action (Figure 13-2). In this case, the partitioning primarily
    provides a modularization of the rules for ease of understanding and maintenance.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_0.png)


    Figure 13-2: Partitioning with Single Agent Deployment


    A second alternative is to deploy the rules to two agents running in the same
    processing unit using a local channel for communications (Figure 13-3). Since
    each agent has its own working memory, the management of working memory can be
    simpler, provided different concepts are needed for recognition and action. Since
    each agent has its own RTC cycle, the operation of one will not have an adverse
    impact on the other provided the processing unit as a whole has sufficient resources.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_1.png)


    Figure 13-3: Partitioning with Single Processing Unit Deployment


    A third alternative is to deploy the two agents in different processing units
    (Figure 13-4). Although this incurs the overhead of inter-process communication,
    the two roles can now be tuned and scaled independently. Indeed, multiple instances
    of either or both processing units can be deployed as needed to handle the load.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_215_2.png)


    Figure 13-4: Partitioning with Multiple Processing Unit Deployment


    When this pattern is employed, the filtering and enrichment inference agent typically
    performs the filtering and/or enrichment in preprocessor functions and sends the
    resulting event directly to the output channel. This allows the agent to employ
    the shared thread pool for these activities. Very often there are no rules deployed
    to this agent.


    There is an additional consideration when using this pattern for enrichment: how
    the additional information is going to be conveyed to the rule execution inference
    agent. The best practice in this situation is to define a new type of event that
    contains both the information from the technical event and the additional information
    required for the processing. This new event becomes the type of the Business Event
    that is conveyed to the rule execution inference agent.


    ### Using TIBCO ActiveMatrix BusinessWorks™ for Filtering and Enrichment


    When filtering and enrichment activities require access to other components and
    systems, it may be advantageous to use TIBCO ActiveMatrix BusinessWorks™ for these
    activities (Figure 13-6). The integration capabilities of ActiveMatrix BusinessWorks
    can significantly reduce the design time required to implement these functions,
    and the resulting efficiency is comparable to performing these activities in TIBCO
    BusinessEvents®.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_217_0.png)


    *Figure 13-6:* *Using TIBCO ActiveMatrix BusinessWorks™ for Filtering and Enhancement*


    ### Partitioning Advantages and Disadvantages


    Partitioning provides the following advantages:


    - Simplifies maintenance: Changes to one activity are independent of changes to
    the other.

    - Provides deployment flexibility: As long as the rule sets and functions for
    each activity are separate, changing deployment patterns is a straightforward
    exercise that can enhance the ability to tune and resource each activity independently.


    It should be noted that, in general, stateless activities are easier to partition
    than stateful activities. The disadvantages of partitioning are


    - Complexity: When activities are deployed in separate agents there is an extra
    component involved. This can complicate the deployment process and may make traceability
    a challenge.

    - Communications overhead: Deploying the activities in separate components adds
    communication overhead. This is minimal when both activities are deployed in the
    same agent, or when both agents are deployed in the same processing unit and a
    local channel is used for communications.


    ### Partitioning Rules of Thumb


    - Always separate rules and rule functions for different activities at design
    time. Use separate folders. This will simplify maintenance, and it sets the stage
    for partitioning if required.

    - Partition only when a positive advantage can be identified. This advantage must
    outweigh the communications overhead. Typically, this advantage is found when
    the volume of activity exceeds the ability for one agent to handle the load gracefully.
    The advantage gained is the ability to tune and resource the activities independently.

    - Consolidate state management. Do not partition the logic required to maintain
    a concept or its subordinate state machine(s). Doing so will introduce significant
    locking and coordination problems. For an alternative, see the sequencing challenges
    discussion in Chapter 14.


    ### Summary


    Modularizing complex-event processing solutions is essential for both the comprehensibility
    and maintainability of the solution. One modularization approach is to separate
    the logic governing the recognition of a situation from the logic governing what
    to do once that situation is recognized. Another modularization approach is to
    separate the filtering and enhancement of events from the subsequent analysis
    of those events. In both cases an event is used to communicate between the modules.


    Modularization provides deployment choices. Both modules can be deployed in a
    single agent; in two agents running in the same processing unit; or in two agents,
    each running in separate processing units. This last alternative provides maximum
    flexibility in tuning and scalability, as additional instances of the processing
    units can be deployed to add capacity. When filtering and enhancement require
    integration with other components, there may be advantages to performing these
    functions in TIBCO ActiveMatrix BusinessWorks.


    The best practice is to always modularize the design. This opens the door for
    deployment flexibility. However, the deployment of the modules in separate agents
    should only be undertaken if there is a demonstrable benefit.


    ## Common Design Challenges


    ### Objectives


    Complex-event processing solutions often present some significant design challenges.
    This chapter covers the challenges you are most likely to encounter in your designs.
    After reading this chapter you will be able to


    - Describe how information can be shared

    - Describe how locking can be used to maintain data integrity

    - Describe the approaches for managing sequencing constraints

    - Describe the approaches for managing event duplication


    ### Information Sharing


    As soon as a solution is modularized and those modules are deployed in different
    agents, the problem of sharing information between the modules arises. There are
    two main approaches for information sharing. One is to use an event to convey
    the information directly from one module to another. The other is to use the cache
    as an intermediary.

