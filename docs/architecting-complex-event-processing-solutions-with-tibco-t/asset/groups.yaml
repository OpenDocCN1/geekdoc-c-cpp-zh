    \n图 5-5：概念数据结构\n\n1. TIBCO BusinessEvents® 中的所有对象实际上都有此属性，但在概念上尤其重要。\n\n概念有一组属性。每个属性都有一个名称，该名称在概念内必须是唯一的。属性可能与其关联多个值，如\
