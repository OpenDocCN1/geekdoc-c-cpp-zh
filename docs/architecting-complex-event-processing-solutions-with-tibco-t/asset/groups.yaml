    # Preserving Sequencing within One Inference Agent


    By default, preprocessing in an inference agent uses a shared pool of threads.
    This default configuration is inherently parallel and cannot preserve sequencing.
    In order to preserve sequencing within the inference agent, two things are necessary.


    +   1. Use a JMS queue (and corresponding JMS destination) for delivering requests.
    JMS guarantees that, between a single publisher and a single subscriber, messages
    will be delivered in the order sent.

    +   2. In the configuration of the JMS destination in the CDD, select the Caller’s
    Thread threading model. For JMS destinations, there is a single thread handling
    input messages, and this choice selects that thread for doing both the preprocessing
    and the RTC cycle execution.


    These choices, together, ensure that an inference agent will preserve sequencing
    while processing requests.'
