    # Preserving Sequencing across Multiple Inference Agents


    To ensure sequential processing, you need to use the content-aware load balancing
    described earlier in this chapter along with some additional configuration requirements.


    +   - Use a JMS queue (and corresponding JMS destination) for delivering requests.
    JMS guarantees that, between a single publisher and a single subscriber, messages
    will be delivered in the order sent.

    +   - Use an inference agent configured as a router. In the configuration of its
    JMS destination in the CDD, select the Caller’s Thread threading model. For JMS
    destinations, there is a single thread handling input messages, and this choice
    ensures that the preprocessing (which does the routing) will be single threaded.

    +   - For each worker inference configuration of the JMS destination in the CDD,
    select the Caller’s Thread threading model. For JMS destinations, there is a single
    thread handling input messages, and this choice selects that thread for doing
    both the preprocessing and the RTC cycle execution.


    # Recovering Temporal Sequencing (Reordering)


    This situation arises when you have events arriving at a destination out of sequence
    and you wish to restore the original sequence. Be aware that this is fundamentally
    a hard problem, one for which there is no generic solution.


    The hardest part of this problem lies in knowing when you have received all of
    the relevant events. Even if you have one distinguished event that is supposed
    to be last in the sequence, if it arrives out of sequence you will not realize
    that there are other events still in the pipeline. You can’t even begin to address
    the problem unless you have a working approach for this.


    If you are using timestamps in the events as the basis for establishing the sequencing,
    there is another challenge you may encounter: clock skew. This problem arises
    when the timestamps are generated by different machines. Keeping clocks synchronized
    on multiple machines is a notoriously difficult problem. The resulting error,
    known as clock skew, will produce errors in the timestamps which, in turn, will
    produce errors in the sequencing.


