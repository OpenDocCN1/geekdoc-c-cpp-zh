    ## Solution Fault Tolerance


    Fault tolerance in TIBCO BusinessEvents® solutions depends upon a number of things:


    - The cache''s backing store configuration

    - The use of appropriate coordination patterns

    - The use of JMS channels with persistence for interactions between agents

    - The use of appropriate fault-tolerance patterns for the JMS message service
    when it is being used as a transport

    - The use of a fault-tolerant database configuration when a database is being
    used as the backing store

    - The use of a fault-tolerant storage subsystem when files are being used as the
    backing store


    ### Backing Store Configuration for Fault Tolerance


    There are two backing store configurations that can support fault tolerance:


    1. Shared All Cache Aside

    2. Shared Nothing with SYNC persistence policy


    With both of these configurations, when an inference agent does a cache update
    prior to acknowledging the receipt of a request, the persistence of information
    in the backing store is confirmed as part of the operation. Thus the acknowledgment
    indicates successful persistence.


    ### Coordination Patterns


    Inference, query, and process agents are not fault tolerant. At best, depending
    upon their configuration, they are highly available. Because of this, the coordination
    patterns in which they participate are critical to achieving overall fault-tolerant
    behavior.


    There are two principal coordination patterns, depending upon the type of transport
    being used for the event. If the solution uses HTTP, TCP, or other type of transport
    that does not itself persist the event, the request-reply pattern of Figure 18-1
    must be used. In this pattern the requesting party sends a request and waits for
    a reply. The agent performing the work does the work, sends any required messages,
    updates the cache and backing store, and only then returns the reply.


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_281_0.png)


    *Figure 18-1: Request-Reply Pattern for Fault Tolerance*


    With this pattern, the reply indicates not only that the initial work has been
    accomplished but also that any cache updates and required messages have been performed
    in a manner that will survive the shutdown of any software components. This pattern
    places an obligation on the requesting party to confirm that the interaction was
    successful and take appropriate action if it was not. The most common action is
    to resend the request.


    The fact that the request might be resent must be considered in the design of
    the agent''s work performance. If there are non-idempotent activities (activities
    that cannot be repeated), the agent must have logic to determine whether these
    activities have already been performed and alternative logic to handle the case
    when they have.


    The other coordination pattern is used when the source of the event is a JMS message
    server (Figure 18-2). This pattern is similar to the previous one. The difference
    is that the message server already has logic to handle the case in which the message
    is not acknowledged: It will re-deliver the message. This pattern requires that
    the JMS destination

