    # Chapter 2


    # Concepts


    # Objectives


    The event-enabled enterprise concept is, itself, built upon a number of ideas.
    As a prerequisite to having a meaningful discussion about realizing the event-enabled
    enterprise, these underlying concepts must first be clearly understood. That is
    the purpose of this chapter.


    After reading this chapter you will understand the essential concepts underlying
    the event-enabled enterprise: events, complex events, complex-event processing,
    context, event responses, and event-driven processes.


    # Overview


    The event-enabled enterprise (Figure 2-1) innovates in the manner in which it
    senses, analyzes, and responds to the world around it. It senses events that are
    happening in the world. When it senses an event occurring outside the enterprise,
    it announces the fact within the enterprise. This announcement becomes an internal
    event within the enterprise. The announcement triggers an analysis of the event,
    determining its business significance and whether a business response is required.
    The announcement that a response is required is another event, one that triggers
    the actual response. The response is an action, and the'
  - '[PAGE 38]


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_38_0.png)


    Figure 2-1: Event-Enabled Enterprise


    completion of this action is, itself, an event—one that may be observable outside
