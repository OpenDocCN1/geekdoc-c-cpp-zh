    # Object Management Modes, Threading, and Locking


    There are three highly interdependent architectural choices that you have to make
    in every project: selecting the object management mode for each object, selecting
    a threading model for each destination, and establishing a locking policy for
    each object. Your choice of combination for each object type and destination will
    have a far-reaching impact on the implementation details for your solution. These
    choices should be made—and validated through analysis—early in the project. A
    significant portion of your testing should be devoted to ensuring that locking
    policies have been correctly implemented and that there are no problems related
    to race conditions. These kinds of problems are nearly impossible to troubleshoot
    in a deployed system. They warrant a solid testing investment.


    # Designing Rules


    Keep your rules simple.


    +   - Keep the number of concepts in a condition to a minimum for efficiency.
    Remember that multiple concepts require a join, and joins are expensive operations.

    +   - Avoid complex conditions.

    +   - Choose multiple simple rules with intermediate events rather than one complex
    rule.


    These guidelines extend to the application as a whole. In complicated situations,
    draw an intermediate conclusion and announce it as an event. Then use this event
    to trigger further analysis. If necessary, you can use a transient concept to
    convey information between rules. A transient concept is one that is defined with
    Memory Only management.


    Remember that the structure of your condition clauses impacts performance. Use
    filters whenever possible to narrow down the number of objects that will be tried
    in subsequent join clauses. Similarly, use equivalent joins to further reduce
    the number of objects that will be tried in nonequivalent joins. The more objects
    involved, the more important this becomes.'
  - '[PAGE 288]


    # Testing Best Practices


    Understanding the behavior of rule-based systems has always been a challenge.
    Because of this, it is good practice when writing rules to do the following:


    +   - Clearly define the behavior you are expecting for each block of functionality
    you implement (rule table, collection of rules and rule functions, process design,
    etc.).

    +   - Define how you are going to convince yourself that you have attained the
    expected behavior.

    +   - Implement test scenarios to verify the expected behavior.


    Remember that the behavior you are specifying consists of both cache updates and
    outbound events. Be sure to test the entire life cycle of objects: creation, modification,
    and deletion. If the behavior depends upon the current state of information, whether
    in cache or elsewhere, determine how you are going to create this state for the
    beginning of the test, and how you are going to examine the state at the end of
    the test.


    While this level of testing may seem to be a lot of work, it usually turns out
    to be less work than unraveling why your overall solution is not doing what you
    intended.


    # Summary


    Complex-event processing solutions are … complex! There’s a lot going on, usually
    in parallel, and many details to consider. It is very easy to get lost in the
    details. To avoid getting lost, it is imperative that you keep the big picture
    in focus. It is the architecture of your solution that defines this big picture.
    It must be clearly articulated and thoroughly understood before anyone dives into
    the details of writing rules and rule functions.


    First, make sure your problem is well defined and well understood. Uncertainty
    at this level is a recipe for chaos. Once the objectives and approach are defined,
    think data first: What information is in the events, and what reference data is
    required to analyze those events? How much of that reference data is dynamically
    updated by the event stream? What metadata (e.g., state models of processes) is
    required for analysis?'
  - '[PAGE 289]


    Once the data is understood, now consider how the processing of the data will
    be organized. Which processing streams will occur in parallel? What object locking
    will be required? What object management modes will be used?


    When designing rules, keep in mind that the rule condition structure can have
    a significant impact on performance. In general, simple is better.


    Finally, test, test, and then test again—(particularly exploring corner conditions).
    Rule-based approaches and parallel processing are both notorious for exhibiting
    unexpected behavior, particularly for the corner cases. Do your due diligence,
    and you will have an exemplary solution that provides your enterprise with valuable
    capabilities!'
