  mdcn: "\n- 调用外部服务\n- 调用规则函数、虚拟规则函数、目录函数和自定义函数\n\n## 运行至完成（RTC）行为\n\n运行至完成函数的基本行为如图\
    \ 5-10 所示。某些实体将事件和概念断言到工作内存中（此过程将在后面讨论）。出现在等价连接条件中的对象在被添加到工作内存时，会根据用于连接的值进行索引。这大大提高了等价连接操作最终执行时的效率。接下来，识别出由于规则声明子句中的事件、概念或记分卡发生变化而被触发的所有规则。然后按前面所述的优先级和等级值对触发的规则进行排序。此排序列表称为规则议程。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_105_0.png)\n\n图 5-10：运行至完成（RTC）行为\n\
    \n一旦规则议程排序完成，就会选择一条规则进行评估并从规则议程中移除。该规则本身用于构建所谓的修改版 Rete 网络（参见 Rete Networks 侧边栏），它提供了一种针对一组对象高效评估规则的方法。对于每种有效的输入对象组合，规则的动作子句随后会被执行。\n\
    \n## Rete 网络\n\n有关原始 Rete 概念的描述，可在 Charles L. Forgy 的经典论文《Rete：多模式/多对象模式匹配问题的快速算法》中找到。2\n\
    \n然而，Forgy 论文中描述的方法并未涵盖条件包含对象之间连接的规则，包括 TIBCO BusinessEvents 规则中发现的等价和非等价连接。\n\
    \n能够处理连接的网络被称为修改版 Rete 网络。不幸的是，没有公开的论文描述此类网络的操作。此外，对此类网络及其背后的原理的深入讨论已远远超出了本书的范围。\n\
    \n好消息是，要有效地使用 TIBCO BusinessEvents 推理代理，并不需要对修改版 RETE 网络有详细的理解。你只需要对条件子句如何处理有一个大致的了解。这在对推理代理\
    \ RTC 行为的讨论中以示例的形式提供。\n\n在动作子句中，任何需要超出推理代理范围进行通信的动作都会被排队以便稍后执行。其他动作可能会影响工作内存：删除事件、修改记分卡，以及创建、更新或删除概念。\n\
    \n一旦所有动作完成，规则议程会再次被评估和排序。如果 `forwardChain = true`，工作内存的变化可能会导致规则被添加到议程中或从议程中移除。由于概念属性的值可以被更新，而这些值可用于计算规则的等级，因此规则议程的排序也可能被改变。\n\
    \n此过程会一直持续，直到规则议程中不再有规则。此时，任何时间-生存期已过期的事件（包括所有时间-生存期为零的事件）都会从工作内存中移除。会向后 RTC 线程发送信号，开始执行执行规则动作所产生的全部待处理通信。\n\
    \n## ACEPSTConditionsSeparate³ 示例\n\n让我们看一个使用 ACEPSTConditionsSeparate 项目的示例。该项目实现了来自列表\
    \ 5-1 的欺诈规则。该项目在 TIBCO BusinessEvents® Studio 调试器中运行时的配置如图 5-11 所示。此配置包含一个处理单元，其中包含一个已部署欺诈规则的推理代理。然后调试器用于直接将测试数据插入到代理的工作内存中。\n\
    \n该项目的测试数据如图 5-12 所示。\n\n调试器将测试数据交易逐一插入工作内存进行处理。这些交易的断言会使欺诈规则（列表 5-1）进入规则议程。当规则被选中处理时，会构造一个\
    \ RETE 网络来执行规则的条件部分（图 5-13）。\n\nRete 网络中的第一个节点是源自规则声明子句的过滤器节点。子句中提到的每种类型在 Rete\
    \ 网络中都会产生相应的类型过滤器。类型过滤器的结果随后会馈送到过滤器 C1 和 C2，每个过滤器都查看金额但与不同的值进行比较。C1 和 C2 的结果集是\
    \ C3 等价连接节点的输入，其中两个输入被比较以查看它们是否具有相同的账户值。C3 的结果被馈送到 C4，这是一个非等价连接节点，用于比较两个交易的时间。出现在\
    \ C4 结果集中的任何内容都已满足所有条件，并且规则动作将被应用于它。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_108_0.png)\n\
    \n图 5-11：ACEPSTConditionsSeparate 配置\n\n| T1 : 交易 | T2 : 交易 |\n|---|---|\n| 账户\
    \ = \"123\" | 账户 = \"123\" |\n| 金额 = \"1.5\" | 金额 = \"10000\" |\n| 时间 = \"0\"\
    \ | 时间 = \"0.1\" |\n\n图 5-12：ACEPSTConditionsSeparate 测试数据\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_108_1.png)\n\
    \n图 5-13：ACEPSTConditionsSeparate 欺诈规则 RETE 网络\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_109_0.png)\n\
    \n图 5-14：ACEPSTConditionsSeparate 第一次交易处理\n\n图 5-14 显示了交易 T1 插入工作内存后 Rete 网络的状态。由于\
    \ T1 的类型为 Transaction，T1 最终出现在类型过滤器结果集中。由于 T1 的金额小于 5，它出现在 C1 结果集中，但未出现在 C2 结果集中。由于\
    \ C2 中没有结果，C3 无连接可执行，处理停止。\n\n图 5-15 显示了引入 T2 后的状态。请注意，处理 T1 的结果仍然存在。T2 通过类型过滤器并最终出现在类型过滤器结果集中。由于\
    \ Rete 处理完全由变化驱动，只有新出现的 T2 会被 C1 和 C2 过滤器处理，并且 T2 现在出现在 C2 结果集中。C3 等价连接有两个交易可供比较。由于它们具有相同的账户值，T1\
    \ 和 T2 的配对最终出现在 C3 结果集中。配对的出现现在触发了 C4 非等价连接的评估。由于满足了时间条件，该配对最终出现在 C4 结果集中。C4 结果集中出现结果现在触发了与欺诈规则相关联的动作的执行。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_110_0.png)\n\n图 5-15：ACEPSTConditionsSeparate\
