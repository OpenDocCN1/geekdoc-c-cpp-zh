    # Query Agents


    # Objectives


    Query agents are part of the TIBCO BusinessEvents® Event Stream Processing product,
    an add-on to the core TIBCO BusinessEvents® product (Chapter 4).


    After reading this chapter you will be able to describe the capabilities and appropriate
    uses for query agents and how snapshot and continuous queries work.


    # Snapshot Queries


    A snapshot query is a query of the cache contents that is executed on-demand.
    The demand comes in the form of an event sent to a channel on the query agent
    (Figure 7-1).


    # Snapshot Query Execution


    The processing associated with the query execution is split between the cache
    agent and the query agent (Figure 7-2). The cache agent performs filtering operations
    involving concepts in a manner similar to the inference agent’s Rete network filters.
