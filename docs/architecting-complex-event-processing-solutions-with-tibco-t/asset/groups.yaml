    When you modularize a design, you are defining a decomposition of your design
    into units that are more readily maintained, managed, and tuned. The modularization
    of your design can be as important as the functionality itself in determining
    the success of your solution.


    # Modularization Units


    There are three levels of modularization in a TIBCO BusinessEvents® solution (Figure
    17-1). At the highest level is the cluster. Each cluster contains one or more
    processing units, and each processing unit contains one or more agents.


