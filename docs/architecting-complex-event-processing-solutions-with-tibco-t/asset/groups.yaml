    information might be required. But the core question has yet to be addressed:
    What conclusions need to be drawn in the analysis, and what is the appropriate
    approach for drawing those conclusions? These are the central questions underlying
    every CEP-based solution.


    Some analyses are simple. If you want to know whether a service-level agreement
    has been violated, compare the time it took to actually perform the task to the
    SLA target for the task. This is simple threshold detection—compare a varying
    value against a benchmark to determine whether it exceeds the threshold.


    Other analyses require more data acquisition and computation. Recognizing that
    the person using the bank site’s mortgage calculator is a customer and has an
    excellent credit rating takes a bit more doing. Further correlating this recognition
    with the fact that the bank is actively promoting new mortgage loans and then
    acting on this correlation to present an offer to the customer while they happen
    to be present online requires still more design.


    CEP analyses can be far more complex than this, so much so that they sometimes
    even raise feasibility questions. If you can’t clearly state the conclusion you
    are trying to draw and articulate the approach to drawing the conclusion, you
    are treading on thin ice. For example, the general problem of detecting all possible
    types of fraud on bank accounts is impossible to solve: The problem itself is
    not even well defined. It’s not clear that you can even articulate all the forms
    of fraud, let alone identify all the ways in which fraud can be committed. It’s
    an open-ended problem: Criminals are always figuring out new ways to defeat the
    system and commit fraud. Detecting all possible forms of fraud on bank accounts
    is not a realistic goal for an IT project.


    However, this does not imply that fraud—some specific kinds of fraud—cannot be
    detected. Far from it. There are many patterns of activity that are significant
    indicators of possible fraud. Two have already been discussed: multiple failed
    login attempts in a short period of time and very small transactions followed
    by very large transactions in a short period of time.


    The point is that every project must clearly identify its analytical goals—the
    conclusions the CEP solution will be required to draw—and identify the techniques
    that will be used to draw those conclusions.

