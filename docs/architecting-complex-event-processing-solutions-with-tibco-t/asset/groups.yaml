    reside in working memory and never enter the cache. In Cache-Only mode, objects
    reside in the cache and must be explicitly brought into working memory when needed.
    In Cache + Memory mode, objects reside in both working memory and the cache. This
    mode must be used with caution, as any change to an object may trigger every rule
