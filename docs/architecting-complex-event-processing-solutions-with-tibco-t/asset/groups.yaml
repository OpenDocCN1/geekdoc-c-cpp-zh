    \n# Rule Templates\n\nA rule template is a variation of a rule that adds variables\
    \ whose values can be changed at runtime (Listing 10-1). These variables are declared\
    \ in the bindings section of the rule template. In this example, tinyThreshold\
    \ and giantThreshold have been declared as variables. Both variables have initial\
