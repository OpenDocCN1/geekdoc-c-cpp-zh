    图 5-17 显示了引入 T1 后 Rete 网络的情况。由于 T1 出现在类型过滤器结果集中，而该集合是 C1 的唯一输入，C1 的条件实际上在节点尝试将
    T1 与自身连接时被评估！当然连接失败了，但计算资源仍然被消耗了。


    图 5-18 显示了引入 T2 后网络的情况。T2 在类型过滤器结果集中的出现触发了 C1 的评估——三次！它会尝试将 T2 与自身连接，并会尝试 T1 和
    T2 的两种组合。只有其中一种组合会产生所寻求的结论。


    值得注意的是，随着更多交易被引入到该网络中会发生什么：C1 将尝试交易的所有可能组合。因此计算复杂度为 n²，其中 n 是工作内存中存在的交易数量。这并不是你在解决方案中想要的那种计算复杂度。


    正如这两个示例所说明的，你在规则中构造条件子句的方式对 Rete 网络评估规则条件时所做的工作量有显著影响。你越是思考规则条件如何被转换为用于执行的 Rete
    网络，你的解决方案就越高效。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_112_0.png)


    图 5-17：ACEPSTConditionsAnded 第一次交易处理


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_113_0.png)


    图 5-18：ACEPSTConditionsAnded 第二次交易处理


    ## 完成推理代理：预处理和后处理


    RTC 循环对工作内存中的对象进行操作，但我们尚未考虑这些对象是如何进入其中的。该功能在产品手册中称为 pre-RTC 处理，简称为预处理（图 5-19）。预处理处理传入通信。这些通信通常（但不总是）会导致工作内存发生变化，进而触发
    RTC 循环中规则的评估。RTC 处理会执行需要传出通信的操作。这些操作的执行称为 post-RTC 处理，简称为后处理。


    有三种类型的传出通信，仅在 RTC 处理完成后发生。一种是通过通道向其他组件和代理发送事件。第二种是更新缓存中的对象：被配置为在缓存中且由推理代理创建或修改的对象必须更新其缓存表示。第三种是更新缓存后端存储，如果其以特定方式配置（即共享全部缓存旁路）。缓存更新和后端存储操作在第
    6 章中详细介绍。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_114_0.png)


    **图 5-19：** *推理代理完整视图*


    ### 通道


    有多种类型的通道可用，包括：


    - Java 消息服务 (JMS)

    - TIBCO Rendezvous®

    - HTTP

    - TCP

    - TIBCO ActiveSpaces®

    - TIBCO Hawk®

    - 本地


    JMS 和 TIBCO Rendezvous 通道提供发送和接收消息的能力。HTTP 和 TCP 通道使代理能够在这两种协议中同时充当服务器和客户端。TIBCO
    ActiveSpaces 通道让代理充当外部空间的寄生者（不要与使用相同技术实现的 TIBCO BusinessEvents 缓存混淆）。TIBCO Hawk
    通道让代理与 Hawk 代理和 Hawk 启用的组件进行交互，提供组件状态和性能信息。最后，本地通道可用于同一处理单元中共置的代理之间的交互。该通道的特殊之处在于，使用该通道时交换的数据结构不会被编组和解编组（序列化与反序列化）：解析后的驻留内存数据结构的引用直接从一个代理传递到另一个代理。


    ### 目标


    每个通道都有一个或多个与其关联的逻辑目标（图 5-20）。非本地目标具有与其关联的默认事件类型和反序列化器。当发生传入通信时，反序列化器会创建默认事件类型的实例，并用来自传入通信的信息填充该实例。以这种方式创建的事件会自动断言到工作内存中。


    在传出方向上，每个事件类型都可以有一个与其关联的默认目标。当创建并发送该类型的事件时（Event.sendEvent()），它会被发送到默认目标，其序列化器会为传出通信创建适当的格式。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_115_0.png)


    图 5-20：通道和目标


    使用 `Standard.Event.replyEvent()` 的输入。事件可以通过调用 `Standard.Event.routeTo(<destination>)`
    发送到与其默认目标不同的目标。


    ### 预处理行为


    默认预处理行为如图 5-21 所示。外部事件源生成一条消息，该消息由通道接收并由通道线程处理。通道线程从传入消息创建事件并将其放置在共享队列上。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_117_0.png)


    断言事件和概念到工作内存的操作要等到该线程运行 RTC 时才会生效。


    如果 RTC 配置为单线程操作，则会发生锁定。


    图 5-21：默认预处理行为


    通道的类型决定了有多少个通道线程。对于 JMS，有一个。对于 HTTP，有一个通道线程池。你应查阅产品手册以了解与每种通道类型关联的线程的详细信息。


    每个目标指定用于预处理的线程池。有三种可能性：


    - 1. 共享队列：这是默认值。事件被放置在该代理中所有目标共享的队列中。有一个共享的线程池用于执行预处理器活动，事件在共享队列中等待，直到该池中的一个线程可用。

    - 2. 目标队列：事件被放置在特定于此目标的队列中。有专门用于此目标的线程池，事件在目标队列中等待，直到这些线程中的一个可用。

    - 3. 调用者线程：此替代方案没有队列。创建事件的通道线程（即）立即执行预处理器活动。


    当线程可用时，如果已为该目标的事件关联了预处理器函数，则执行该函数。


    如果推理代理配置中未选中“并发 RTC”框（这是默认值），则线程会被放置在等待轮到执行 RTC 活动的线程队列中。如果选中该框，线程会立即继续。


    一旦线程准备好执行，如果未选中“并发 RTC”框，线程将获取 Rete 锁。这会阻止其他线程执行 RTC 活动。从缓存中创建或检索的任何对象都会被断言到工作内存中。请注意，尽管可能已在预处理器函数中调用了
    Event.assertEvent()，但事件实际上要到达到此点时才会被放置到工作内存中。一旦工作内存已更新，就会执行 RTC 行为（前面已描述）。


    RTC 完成后，锁会被释放（允许其他线程执行其他 RTC），会发送信号以触发与刚刚完成的 RTC 相关的后处理，并且（如果需要）会确认初始 JMS 消息的接收。线程现在准备好处理另一个事件。

    '
