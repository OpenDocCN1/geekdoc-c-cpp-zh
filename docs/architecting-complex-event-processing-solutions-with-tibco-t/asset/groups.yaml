  mdcn: "\n一个更实际的例子是图 10-8 的销售订单生命周期。这里的挑战在于，当销售订单已完全交付时通知会计部门，以便从销售中确认收入。由于可能存在部分发货，识别订单是否已完全交付可能比较复杂，因此使用状态机来跟踪情况。注意\
    \ Shipping Notice 和 Delivery Notice 事件转换上的条件，这些条件用于检查订单是部分还是完全发货或交付。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_176_0.png)\n\
    \n图 10-8：销售订单生命周期\n\n## 连续查询变更识别模式\n\n连续查询（第7章）也可用于识别变化（图 10-9）。满足查询选择条件的缓存对象更改或定向到缓存代理的事件会进入缓冲区。缓冲区内容的更改会触发查询的重新评估。然后，查询的回调函数检查查询结果，并确定是否有必要发出变更通知。\n\
    \n在调查账户欺诈活动时，有时需要在账户有活动时实时收到通知。该通知用于提示调查人员立即检查该活动，并可能收集足够的信息来逮捕嫌疑人。图 10-10 显示了如何通过设置为监控该账户的连续查询生成活动警报。请注意，在任意给定时间可能会有多个此类查询在运行，每个查询监控不同的账户。\n\
    \n## 处理重复事件\n\n当使用 JMS 作为消息传输时，即使使用 JMS 队列，消息也可能被传递多次。原因是，默认情况下，代理在消息接收触发的工作完成之前不会确认消息接收。这种情况发生在推理代理的\
    \ RTC 周期结束时，或流程代理中取得检查点时。\n\n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_177_0.png)\n\
    \n图 10-9：连续查询变更识别模式\n\n要认识到，解决这个问题没有万能的灵丹妙药。在设计中所需要做的事情在很大程度上取决于不可重复活动的性质。不过，TIBCO\
    \ BusinessEvents 使您能够识别消息已被重新传递。传入的 JMS 消息属性 `JMSRedelivered` 表示消息已被重新传递。但是，如果您希望在逻辑中访问此值，则需要在事件上定义一个布尔类型的\
    \ `JMSRedelivered` 属性。\n\n当存在非幂等活动时，处理消息重新传递的一般策略如图 10-11 所示。当消息似乎已被重新传递时，第一步是调查以确定正常处理完成了多少。有了这些信息，就可以确定并执行所需剩余活动。\n\
    \n当然，这只是方法的一个概要——细节决定成败。根据您的设计，您可以在预处理器函数、规则条件或流程编排排他网关中实现此逻辑，或组合使用这些方式。还需要一些判断。处理这些情况可能会耗费大量时间和精力。请确保您清楚地了解重复活动的负面后果，并调整您的设计工作量，使其与后果相称。\n\
    \n![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_179_0.png)\n\n**图 10-11：** *处理非幂等活动的消息重新传递*\n\
    \n## 启用运行时规则更改\n\n有些业务需求的变化速度比正常的 IT 项目发布周期快。通常这些是控制决策的业务规则需求，频繁变化的原因是为了响应不断变化的市场条件。为了实现这一点，需要一种机制，允许在不要求\
    \ IT 变更和后续部署的情况下更改业务规则。理想情况下，这种类型的更改可以由业务用户直接完成，无需 IT 参与。\n\nTIBCO BusinessEvents®\
    \ Decision Manager 扩展提供了两种实现此能力的机制：规则模板和决策表，以及管理这些运行时修改的规则管理服务器。\n\n## 规则模板\n\n\
    规则模板是规则的一种变体，添加了可在运行时更改变量的变量（清单 10-1）。这些变量在规则模板的 bindings 部分声明。在本例中，tinyThreshold\
    \ 和 giantThreshold 已被声明为变量。两个变量都有初始值，但可以使用规则管理服务器在运行时更改这些值。因此，使用此模式识别潜在欺诈的阈值可以在运行时更改。\n\
    \n## 清单 10-1：ACEPSTRuleTemplate 示例\n\n```\nruletemplate Rules.FraudRuleTemplate\
    \ {\n attribute {priority = 5;forwardChain = true;}\n views{\n  bindings{\n  \
    \  double tinyThreshold = 5.0;\n    double giantThreshold = 10000.0;\n  }\n declare\
    \ {\n   Events.Transaction transactionA;\n   Events.Transaction transactionB;\n\
    \ }\n when {\n   transactionB.transactionAmount <= tinyThreshold;\n   transactionA.transactionAmount\
    \ >= giantThreshold;\n   transactionA.accountNumber == transactionB.accountNumber;\n\
    \   transactionA.transactionDateTime > transactionB.transactionDateTime;\n }\n\
    \ actionContext {\n    System.debug(\"Fraud!\");\n }\n}\n```\n\n规则模板的执行方式与普通规则完全相同。当变量值更改时，更改会在\
