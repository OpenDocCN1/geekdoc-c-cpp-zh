    ## 常量


    常量通常用作决策的阈值。之前使用的 $5 和 $10,000 美元值就是典型例子。用作决策阈值的值通常具有一定的随意性，并且可能随着条件变化和理解的演进而发生变化。因此，确定这些值是否实际上会随时间变化非常重要。


    你对值是否会发生变化的理解将改变你的设计思路。你可以将常量固化到设计中，但如果这样做，后续更改它们的唯一方法就是修改并重新部署设计。这就是一个 IT 项目。


    更灵活的做法是设计解决方案，使其值可以在运行时更改而无需修改设计。这可能涉及在值被使用时进行查找（并且可能缓存）的值。为了解决这类需求，TIBCO BusinessEvents
    提供了一种特殊构造，即规则模板，可在运行时修改引用值。无论你选择哪种方法，如果值可能发生变化，明智的做法是在设计中加入变更机制。


    ## 数据


    最常见的上下文类型是数据。企业中使用了大量可用于支持分析的数据。其中一些是相对静态的参考数据：客户数据、产品数据、合作伙伴数据等等。其他数据是动态变化的交易数据：订单、发货、库存等等。


    无论是参考数据还是交易数据，你都必须考虑数据的来源、如何访问它，以及如何为分析的高效使用而分层数据。效率通常要求将数据的副本缓存以便便捷访问，但当然，缓存的准确性和一致性随之成为关键。


    经常需要的另一种数据形式是事件的近期历史，无论是事件本身还是关于这些事件的信息摘要。例如，过去一小时内发生的交易数量或这些交易的美元交易量可能有助于解释当前事件。


    ## 元数据


    元数据是关于数据的信息。你可能熟悉的一种常见元数据形式是模式：关于数据结构的信息。在复杂事件处理中，其他形式的元数据也发挥作用。


    CEP 中一种有用的元数据形式是数据查询的结构。查询指定如何识别与当前分析相关的数据集。查询的元数据（即查询的定义）可以在设计时直接编码到分析逻辑中，但这要求你能够提前制定查询。有时查询无法提前制定：定义查询所需的信息要到运行时才可用，要么是因为业务逻辑的动态变化，要么是因为查询基于当前信息。TIBCO
    BusinessEvents 支持这两种方法，允许在设计时和运行时定义查询。这些方法在第 7 章中有讨论。


    另一种 CEP 元数据是预期行为的描述，以预期事件模式的形式表达。该模式描述随后为识别模式的发生或未发生提供上下文。与查询类似，一些模式可以在设计时定义，而其他模式要到运行时才能定义。第
    11 章展示了 TIBCO BusinessEvents 如何支持这两种方法。


    另一种 CEP 元数据形式是流程描述。TIBCO BusinessEvents 具有两种不同的元模型来描述流程。状态模型，在第 5 章中描述，非常适合监控非托管流程并确定其是否正确执行。业务流程建模符号（BPMN）模型，在第
    8 章中描述，非常适合编排（管理）流程执行。


    ## 分析需要上下文


    到现在应该很明显，没有适当的上下文信息就不会有分析。上下文信息类型可能各不相同，从常量到数据再到元数据，但上下文为分析提供了基础。确保所需的上下文信息能够随时用于高效分析，是每个
    CEP 解决方案架构的主要要求。


    对同一事件进行不同目的的分析并不罕见。例如，客户给杂志出版商的电话可能对客户服务部门感兴趣，但也可能对市场营销部门感兴趣。这些目的中的每一个可能都需要不同的上下文信息来支持相关的分析（图
    2-6）。虽然两个部门都需要了解客户是谁（假设是客户），但呼叫中心有兴趣知道该客户是否有之前的来电、由谁处理以及转给了谁。另一方面，市场营销部门有兴趣知道客户的任何订阅是否即将到期，以便利用这一机会提供订阅续订。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_50_0.png)


    图 2-6：杂志出版商来电事件的上下文信息


    ## 选择分析方法


    到目前为止的讨论已涉及分析的各个方面：分析是按过程式还是声明式定义，以及可能需要哪种上下文信息。但核心问题尚未解决：分析中需要得出什么结论，以及得出这些结论的适当方法是什么？这些是每个基于
    CEP 的解决方案的核心问题。


    一些分析很简单。如果你想知道服务水平协议是否被违反，将实际执行任务所需的时间与该任务的 SLA 目标进行比较。这就是简单的阈值检测——将变化的值与基准进行比较，以确定是否超过阈值。


    其他分析需要更多的数据获取和计算。识别出使用银行网站抵押贷款计算器的人是客户并且信用评级优秀，需要做更多的工作。进一步将这一识别与银行正在积极推广新抵押贷款的事实相关联，然后利用这一相关性在客户在线时向其提供优惠，还需要更多的设计。


    CEP 分析可能比这复杂得多，以至于有时甚至会引发可行性问题。如果你无法清楚地说明你试图得出的结论并阐述得出该结论的方法，你就是在薄冰上行走。例如，检测银行账户所有可能类型的欺诈的一般问题是不可能解决的：问题本身甚至没有得到很好的定义。甚至不清楚你能否表述出所有欺诈形式，更不用说识别所有可能实施欺诈的方式了。这是一个开放性问题：罪犯总是在想出新的方法来击败系统并实施欺诈。检测银行账户所有可能的欺诈形式对于
    IT 项目来说不是一个现实的目标。


    然而，这并不意味着欺诈——某些特定类型的欺诈——无法被检测。恰恰相反。有许多活动模式是可能欺诈的重要指标。其中两种已经讨论过：在短时间内多次登录失败，以及在短时间内出现非常小的交易后紧跟非常大的交易。


    关键在于，每个项目都必须明确其分析目标——CEP 解决方案将被要求得出的结论——并确定用于得出这些结论的技术。

