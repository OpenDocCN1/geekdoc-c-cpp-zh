    图12-11：自定义函数调用模式


    进程代理（第8章）。从性能角度来看，增加此池中的线程数可以弥补调用期间线程被阻塞的情况。


    ## 自定义函数调用


    TIBCO BusinessEvents 提供了定义自定义函数的能力。这些函数使用 Java 编写，可以使用 Java 库，从而利用所有 Java I/O
    功能。因此，您可以实现一个对服务提供者进行同步调用的自定义函数（图12-11）。与 HTTP 发送请求调用模式一样，应谨慎使用此模式：执行该函数的线程将被占用，等待服务提供者响应。如果该线程来自并发运行的线程池（例如，在预处理器函数中），则增加线程数可以弥补这一点。另一方面，如果该函数在规则的操作部分执行，并且
    RTC 配置为单线程，则在执行此函数期间，所有 RTC 处理都将被阻塞。


    ## 与数据库交互


    TIBCO BusinessEvents 可以使用三种模式与数据库交互。包括：


    - 1. 使用数据库概念进行数据库交互

    - 2. 使用 TIBCO ActiveMatrix® Adapter for Database 进行数据库交互

    - 3. 使用 TIBCO ActiveMatrix BusinessWorks™ 进行数据库交互


    ## 使用数据库概念进行数据库交互


    TIBCO BusinessEvents 数据建模扩展提供了自动定义与数据库表对应的概念的能力。数据库表中的行对应于数据库概念的实例。该扩展还提供了一组相关的
    RDBMS 目录函数。


    ### 数据库概念与内存管理


    数据库概念的操作方式与普通概念不同。数据库概念的默认内存管理模式为仅内存（Memory Only）——概念仅驻留在推理代理中。此外，作为 RDBMS 查询结果而创建或更新的数据库概念不会自动放入工作内存。必须使用
    Database.assertDBInstance() 目录函数显式断言。


    作为例外，数据库概念可以配置为仅缓存（Cache Only）或缓存+内存（Cache + Memory）。但是，后备存储（backing store）绝不是数据库概念的选项。即使集群配置了后备存储，这些设置对于数据库概念也会被忽略。


    ### 数据库查询


    数据库查询针对数据库运行，并返回数据库概念作为结果（图12-12）。随后，这些概念可用于代理中的后续处理。有多个 RDBMS 函数可用于查询。如果预期结果集较大，可以使用目录函数来处理数据库游标并遍历结果集。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_207_0.png)


    图12-12：数据库查询


    ### 数据库更新与删除


    虽然推理代理可以更改数据库概念，但这些更改不会自动保存到数据库中。需要显式调用 RDBMS 目录函数 Database.update()（图12-13）。


    相反，数据库本身的变化不会自动反映到数据库概念中，也没有任何自动机制来感知数据库是否已更改（参见使用 TIBCO ActiveMatrix® Adapter
    for Database 一节）。要将更新后的数据库信息放入数据库概念中，需要再次执行查询。


    可以通过调用 RDBMS 函数 Database.delete() 来执行数据库删除。数据库本身中的删除不会自动反映到数据库概念中。识别数据库删除需要先从内存中移除数据库概念，然后重新执行查询。


    ## 使用 TIBCO ActiveMatrix® Adapter for Database 进行数据库交互


    TIBCO ActiveMatrix® Adapter for Database 也可用于数据库交互（图12-14）。该适配器使用 JDBC 或 ODBC
    协议与目标数据库通信。


    该适配器支持三种交互模式：


    - 1. 推理代理发布

    - 2. 推理代理请求-应答

    - 3. 推理代理订阅


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_208_0.png)


    图12-13：数据库更新


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_209_0.png)


    图12-14：数据库适配器配置


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_209_1.png)


    图12-15：推理代理发布


    ### 推理代理发布


    在此模式中，推理代理向适配器发布请求（图12-15）。适配器随后执行所请求的数据库操作。这是一个仅入站（in-only）操作：不会为请求生成应答。适配器提供了多种可通过此方式调用的
    SQL 操作：


    - Insert

    - Update

    - Delete

    - Insert/Update（如果行存在则更新，否则插入）


    ### 推理代理请求-应答


    适配器支持通过请求-应答交互来执行 SQL 语句和存储过程（图12-16）。在使用此功能时，推理代理将使用本章前面描述的异步消费者模式之一。


    ### 推理代理订阅


    此模式用于将数据库的更改通知推理代理（图12-17）。在适配器配置为发布数据库表的更改时，会在数据库中放置一个触发器。当数据库发生更改时，受影响数据库记录的快照会被放入发布表。适配器定期检查发布表中是否有条目，如果有，则为每个条目发布一条消息。如果推理代理订阅了这些消息，它将收到数据库更改通知，并可以针对应用程序采取任何适当的操作。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_210_0.png)


    图12-16：推理代理请求-应答


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_210_1.png)


    图12-17：推理代理订阅


    ## 使用 TIBCO ActiveMatrix BusinessWorks™ 进行数据库交互


    使用 TIBCO ActiveMatrix BusinessWorks 执行数据库交互需要结合使用前面描述的两种或三种设计模式：


    - TIBCO BusinessEvents 作为异步服务消费者

    - ActiveMatrix BusinessWorks 接收事件

    - ActiveMatrix BusinessWorks 发送事件


    使用异步服务消费者模式，TIBCO BusinessEvents 将请求发送给 ActiveMatrix BusinessWorks，后者使用 ActiveMatrix
    BusinessWorks 接收事件模式启动一个进程，该进程将执行数据库更新以及可能进行的其他操作。可选地，该进程可以使用 ActiveMatrix BusinessWorks
    发送事件模式将结果报告回 TIBCO BusinessEvents。


    此模式的优势在于可以充分发挥 ActiveMatrix BusinessWorks 的完整集成能力。数据库更新可以作为 XA 事务的一部分执行，并且还可以与其他活动进行协调。


    ## 总结


    TIBCO BusinessEvents 处理单元可以部署在 TIBCO ActiveMatrix BusinessWorks 引擎中。ActiveMatrix
    BusinessWorks 活动面板使 ActiveMatrix BusinessWorks 能够与 TIBCO BusinessEvents 通道交互。ActiveMatrix
    BusinessWorks 可以使用这些活动发送事件、等待事件以及调用 TIBCO BusinessEvents 规则函数。还有一个进程启动器活动，可用于定义一个可由
    TIBCO BusinessEvents 通过发送消息来启动的进程。


    TIBCO BusinessEvents 可以使用通道作为服务接口来扮演服务提供者的角色。它也可以扮演服务消费者的角色，支持异步和同步交互。有许多设计模式可用于此目的。当
    TIBCO BusinessEvents 是同步服务消费者时，必须仔细考虑在何处执行操作，因为在等待操作完成期间会占用执行线程。


    TIBCO BusinessEvents 有多种与数据库交互的选项。TIBCO BusinessEvents 数据建模扩展提供了与数据库表对应的概念的自动定义，以及一组用于与数据库交互的
    RDBMS 目录函数。数据库概念的行为与普通概念不同。默认情况下，它们以仅内存方式管理，并且除非显式断言，否则不会出现在工作内存中。必须显式地从数据库加载数据库概念，并且对数据库概念的更改必须显式地应用到数据库。


    TIBCO ActiveMatrix Adapter for Database 也可用于数据库交互，使用消息通道（JMS 或 TIBCO Rendezvous®）作为与适配器之间的接口。可以使用三种交互模式。使用适配器可以通知
    TIBCO BusinessEvents 数据库的变化。


    与数据库的交互也可以委托给 ActiveMatrix BusinessWorks。这提供了执行 XA 事务并将数据库更新与其他活动进行协调的能力。


    '
