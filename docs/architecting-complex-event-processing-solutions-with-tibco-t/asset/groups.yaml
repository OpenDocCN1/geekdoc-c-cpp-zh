    ### 功能划分


    另一个可变性领域在于 CEP 功能可以被划分并分配给不同组件的多种方式。CEP 解决方案中的基本划分如图 3-3 所示。通常，驱动流程的事件是某个业务过程中参与者（人或系统）的可观察行为。这些参与者中的大多数不会宣布其活动，至少不会向未参与该业务过程的组件宣布。因此，CEP
    解决方案通常有一个或多个组件专门负责感知这些行为并宣布其观察结果。


    用于这些观察的技术与传统应用集成中使用的技术相同。这些技术及支持这些技术的产品在 TIBCO® Architecture *Fundamentals*¹ 中有详细说明。然而，这里相关的观察是，用于感知的产品在很大程度上并不是用于
    CEP 分析和响应的产品。因此，执行感知的参与者通常不是执行分析和响应的参与者。


    附带说明，事件驱动型企业的一个特征是，其架构既包含感知和宣布行为所需的组件类型，也包含分析和响应这些宣布所需的组件类型。


    在许多情况下，许多 CEP 解决方案处理的事件量使得由一个组件处理所有事件并执行所有分析和响应处理变得不切实际。一旦达到这一点，就有多种方法可以提高性能。一种方法是简单地部署多个执行分析和响应组件的实例。如果参考数据在事件发生时不被更新，这是一种直接的方法。但当参考数据被事件更新时，跨多个分析和响应组件实例共享历史记录需要额外的设计。相关设计模式在第
    14 章讨论。


    另一种可扩展性方法是将功能划分到更多组件上。图 3-4 显示了一种可能的划分，其中导致情况识别的分析由一个组件执行，而所需响应的确定由另一个组件执行。当分析和响应计算也更新参考数据时，划分模式也会变得更加复杂。第
    13 章将讨论这一点以及其他划分方式，以及需要考虑的权衡。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_64_0.png)


    *图 3-4：将情况识别与响应分离*


    1. Paul C. Brown, TIBCO® Architecture Fundamentals, Boston: Addison-Wesley (2011).


    到目前为止应该显而易见的是，CEP 解决方案有许多可能的功能划分。有些划分带来简单直接的实现。其他划分则需要清晰的架构思考，才能以稳健且高度可扩展的方式实现所需的行为。


    接下来的章节将讨论许多 CEP 解决方案设计模式，每种模式都专注于提供一种常见的业务能力。在大多数情况下，这些模式大致按照复杂度递增的顺序排列。本章最后简要讨论了一些可能没有成熟设计模式的问题。


    为简洁起见，这些设计模式中没有显示感知组件：假定它始终存在。


    ### 条件检测


    你在复杂事件处理中会遇到的最简单解决方案模式是阈值检测（图 3-5）。在此模式中，一个组件采取可观察的行动，并产生一个技术事件。条件检测器正在监听该事件，其到达即作为分析触发器。分析将事件传递的值与阈值进行比较，如果事件值超过阈值，则生成一个业务事件来宣布此情况。作为模式的收尾，另一个组件监听这些宣布并采取相应行动。


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_65_0.png)


    *图 3-5：阈值检测模式*


    在使用此模式时，必须考虑阈值的位置。一种选择是将阈值永久固定在分析逻辑中。另一种选择是将其作为上下文信息，由条件检测器在启动时或每次分析事件时查找。还有一种选择是使用基础设施，使其能够在运行时更改该值。TIBCO
    BusinessEvents® 规则模板提供了此功能，如第 10 章所述。


    此模式的更一般形式是条件检测模式（图 3-6）。在此模式中，被检测的条件由若干定义条件边界的值确定。分析中考虑的信息通常是事件数据与上下文数据的组合。如果检测到该条件，则生成一个业务事件来宣布该条件的存在。


    使用此模式时，必须考虑定义边界条件的参数来源以及检测条件所需的上下文数据，同时还需要考虑在运行时更改其中某些值的潜在需求。为访问源自其他系统的信息并使其高效可用所需的设计工作，通常是
    CEP 项目的重大组成部分。


    在条件检测模式中，所使用的参考数据不会被事件处理所修改：它不反映先前历史。所使用的唯一状态信息是由


    ![](img/c5f9307fa62d0af5b0c26b57bacdb1b3_66_0.png)


    *图 3-6：条件检测模式*


