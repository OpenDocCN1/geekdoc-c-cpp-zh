    # Innovation in Response


    Analyzing events results in an understanding that a particular situation exists
    and a determination of what type of response, if any, is required. Innovation
    in response lies in improving the interaction between the party performing the
    analysis and the party executing the action. In all cases, requests (which are
    simply another form of event) must be sent to the party doing the work. However,
    there are two choices that impact the timeliness of the work performance. One
    choice lies in the delivery of the requests: Requests may be sent immediately,
    or they may accumulate and be sent periodically. The other choice lies in the
    timeliness of work performance: Work may be performed immediately upon request,
    or it may be performed at some later time.


    Delays in work performance can negate any advantage gained in anticipating a situation.
    This is not to say that all work must be performed immediately, but rather that
    the timing of the work performance must be appropriate for the present situation.


    In summary, there are two possible innovations in response. One is sending work
    requests immediately as soon as the need for the work is recognized. The other
    is in performing the work either immediately or within a timeframe appropriate
    to take advantage of a recognized situation. Together, these innovations enable
    the enterprise to respond more appropriately.


    # The Event-Enabled Enterprise


    From a business perspective, innovations in sensing, analyzing, and responding
    enable the enterprise to not only react faster and more appropriately to situations,
    but also to be proactive, anticipating situations and taking advantage of that
    anticipation. Both enable the enterprise to increase the value they deliver to
    their customers and business partners and gain competitive advantage. Realizing
    this business value requires the automation of sense, analysis, and response activities
    along with the appropriate positioning of reference information for immediate
    and efficient use.


    So what is an event-enabled enterprise? It is simply an enterprise that has the
    infrastructure in place to sense, analyze, and respond to events as they occur
    and has positioned reference information to support this real-time activity. The
    event-enabled enterprise is thus in a position to efficiently innovate in how
    it senses, analyzes, and responds'
  - '[PAGE 36]


    to the world around it. Through continuous innovation in these areas, the event-enabled
    enterprise distinguishes itself from its competitors and builds competitive advantage.
    Done well, such innovations provide extreme value for its customers, turning them
    into loyal fans.


    # Summary


    Extreme value sets your enterprise apart from its peers and turns your customers
    into loyal fans. Business process improvements are one way of providing this extreme
    value. These improvements make your enterprise more responsive to its customer
    base by innovations in how the enterprise senses, analyzes, and responds to the
    world around it. The most significant innovation lies in performing these activities
    in real time. Proactively sensing events—recognizing that something has happened
    rather than passively waiting to be told—is a significant enabler for this type
    of process improvement. The event-enabled enterprise is one that recognizes such
    events and continuously innovates in its analysis and response. It delivers extreme
    value to its customers.'
