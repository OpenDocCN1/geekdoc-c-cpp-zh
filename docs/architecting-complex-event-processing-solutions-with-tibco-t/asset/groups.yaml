    # Chapter 1


    # The Event-Enabled Enterprise


    # Objectives


    The pragmatic question that arises when discussing complex-event processing in
    a business context is, “Why?” What is it about this approach that makes it interesting
    as a business investment?


    Answering this question is the focus of this chapter. After reading this chapter
    you will be able to explain the concept of an event-enabled enterprise and describe
    how such an enterprise gains competitive advantage through innovations in its
    ability to sense, analyze, and respond to its business environment.


    # Extreme Value


    Enterprises, whether they are commercial companies or governmental agencies, exist
    to provide value to their constituents. Enterprises that cease to deliver value
    soon cease to exist. Those that continue to deliver modest value survive. Enterprises
    that deliver what Vivek Ranadivé refers to as extreme value soon outstrip their
    competition and prosper.


    One example of extreme value is the iPhone. When the iPhone was introduced in
    2007 it cost substantially more than basic cell phones.'
  - '[PAGE 30]


    Yet people bought the iPhone—even people who had barely enough money for food.
    Why? What value did the iPhone offer that was so compelling that people who arguably
    couldn’t afford them still bought them?


    The answer is that the iPhone (and other types of smart phone) enables people
    to interact with the world around them in new and innovative ways. It enables
    people to sense what is going on, analyze the situation, and respond to the world—and
    to do so in real time, anywhere they happen to be. The user senses in new ways,
    no longer just by receiving phone calls but now by receiving text messages, e-mails,
    social media posts, and alerts from apps as well. The user analyzes what is going
    on in new ways, not only by using their address book and other personal reference
    information but also by using web browsers, social media, and apps. The user can
    respond not only with phone calls but also by using this new technology to communicate
    with others, purchase products, and make reservations. The iPhone makes it possible
    for the user to sense, analyze, and respond to the world around them anywhere
    and anytime they choose. This is the extreme value delivered by the iPhone.


    So what makes extreme value important to your enterprise? Extreme value turns
    customers into fans—fans who prefer the products and services of your enterprise
    to the exclusion of its competitors. Fans whose attitude is, as the 1960s commercial
    put it, “I’d rather fight than switch!” (Figure 1-1). Fans whose loyalty to your
    enterprise fosters its growth and profitability. So how can complex-event processing
    enable your enterprise to deliver extreme value?


