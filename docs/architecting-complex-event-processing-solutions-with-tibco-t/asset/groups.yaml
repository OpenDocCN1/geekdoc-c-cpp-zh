    they are processed one at a time. The assertion of these transactions causes the
    fraud rule (Listing 5-1) to be placed in the rule agenda. When the rule is selected
    for processing, a RETE network is constructed to execute the conditional portions
    of the rule (Figure 5-13).


    The first node in the Rete network is a filter node that is derived from the declarations
    clause of the rule. Each type mentioned in the clause results in a corresponding
