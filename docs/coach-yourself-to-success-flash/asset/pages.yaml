- pgno: 91
  md: '# ## Switching the balance


    When you are absolutely clear about what makes some relationships positive for
    you and others negative, it becomes easier to deal with the negatives. If you
    take the time to analyse the beliefs, values, needs and priorities of other people,
    you will understand their motivation for their behaviour. Whether you agree with
    their view of the world or not, the more you understand it and understand how
    it differs from your view of the world, the easier it will be for you to make
    a decision on whether you simply don''t want to associate with this person any
    longer, whether you''d like to seek out the things you do have in common and confine
    the relationship to these areas, or whether you''d like to embrace the differences
    and create a relationship in spite of them. In many cases, opposites attract and
    can lead to a lasting and close relationship. Being aware of what you have in
    common with others, or what you don''t have in common with them, at the earliest
    possible stage will ensure that your relationships are on the right footing from
    the outset.


    # ## Dealing with difficult people


    So, there are some relationships that require compromise and careful management
    of your expectations to allow them to run smoothly. Other relationships may be
    more complex, and there will be people in your life whom you simply don''t see
    eye to eye with. You might not share their beliefs or values or priorities or
    objectives but, for one reason or another, you need to get along with them. For
    these relationships, there is a coaching technique that you can employ to make
    sure **that you get** the best results for all concerned.


    In any given circumstances in your life, you look out at the world through your
    eyes and listen with your ears, and what you see and hear and what you feel in
    a situation will be filtered and judged by your experience and by your beliefs
    and values. The same is true of those you are dealing with and, if your respective
    views of'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'the world differ, you may disagree. If your views of the world differ drastically,
    then you may disagree dramatically.


    As you take up vantage points progressively further away from the present moment
    viewed through your own eyes, you will find that the emotion of the moment is
    reduced and you increase your perspective of how what you are doing in the moment
    fits into the wider world. Changing perspectives helps you to put things in context
    and make judgements with a slightly more objective mindset. This can be an invaluable
    skill when making important decisions and particularly when interacting with others.
    Employing this technique will help you to remove tension from heated discussions.
    Forget for a moment how you see the situation and consider how the other person
    is viewing it. Think about how a third party would observe what''s going on. What
    would someone who just entered the room to this scene think about what''s going
    on? Whether it be an argument with a loved one, a disagreement with a friend or
    a debate with a work colleague, altering the viewpoint from which you see the
    situation will enable you to see the bigger picture, assess what needs doing from
    a fresh angle, and steer the moment to a more positive conclusion.


    Changing the position from which you see a situation is a very effective way of
    putting yourself into the shoes of others and understanding where they may be
    coming from with their point of view. It''s a powerful negotiating technique and
    a great way for you to perfect your argument in any situation. It''s also a method
    of diffusing emotion. If you continually inhabit your own viewpoint – first position
    – you can become overly concerned with how each situation affects you, and not
    always in a good way. Imagining how others will see you, and how a third party
    would view the overall situation, will enable you to put yourself in context and
    consider whether the concerns that you have are in proportion to the situation
    and to your life as a whole. Experiment with this technique to rise above your
    immediate situation and get a new perspective on what is happening to you at any
    given time.'
  merge: -1
