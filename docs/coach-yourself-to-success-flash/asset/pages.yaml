- pgno: 82
  md: 'Do you have enough money? Do you know how much would be enough for you?


    Like most people, you probably think that you would like more money, and it’s
    probably true that a little extra income would ease the pressures of life and
    give you a few more options when it comes to deciding how you spend your time,
    but how much money would you really like to have? How much do you realistically
    need? How much do you want?


    This chapter will help you to work out how much you’d like to have, how you can
    get it, and what you’ll do with it when you have it. There are suggestions for
    new ways of approaching your financial situation, some simple strategies to save
    money and make the most of what you have, and suggestions on how to alter your
    mindset to end money worries for good.'
  merge: -1
  img_proc: true
- pgno: 83
