- pgno: 75
  md: '# Good health


    Thankfully, the majority of people in the Western world benefit from relatively
    good health and are not suffering from or limited by any major disease or illness.
    Usually, perceptions of health revolve around how you feel on a day-to-day basis.
    Generally, provided you are able to do everything you need to do, you are happy
    enough and prepared to put up with the stresses and strains of modern life. You
    keep busy each day working, looking after others, grabbing some food when you
    can, taking care of chores and ‘the stuff of life’, socializing, and looking after
    yourself if you can fit it in. Hopefully you arrive at the end of the day with
    a little bit of time to unwind and relax before getting off to bed to rest before
    starting the routine all over again the next day.


    In these circumstances, the fact that there are opportunities to live another
    way is often overlooked. These days, taking care of oneself is sometimes seen
    as an added extra in life – something that you can do if you have time, but really
    there are other more important things to be getting on with.


    Now is the time to look at this notion from a different perspective – a perspective
    that puts your health and well-being at the top of the list of priorities rather
    than at the bottom. After all, without your health, nothing else in life will
    be possible, and certainly much of what you do will be made more difficult.


    Taking care of yourself gives you energy, confidence and a positive outlook. You
    are better able to deal with the challenges of life and in a far better position
    to enjoy the things you do. Take this opportunity to say goodbye to thinking of
    healthy living as being in conflict with your current life and as something that
    will get in the way of your effectiveness, that is, just another thing to add
    to the list. Instead, see it as something in harmony with the rest of life, a
    way of nourishing yourself to be better at everything you do, a means of being
    able to put more into life and of getting more out of it – to be happier and more
    fulfilled on a daily basis.


    In a world obsessed with physical appearance, not a day will go by without a newspaper,
    magazine or television programme'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'advising you on what to eat or how to be more active. If you tried to pay attention
    to all the advice, you''d suffer information overload. You must be selective with
    what you take on board and implement into your life. The most straightforward
    way to make successful changes is to consider how what you read or see on television
    relates to your situation. Why and how does healthy living matter to you? Thinking
    about the personal applications of being healthier will be the key to your success.


    # ## *Healthy living and coaching*


    Some people love being healthy, others hate it. So what makes the difference between
    the two viewpoints? And how can everyone come to enjoy exercise and healthy food?


    Clearly there is more to healthy living than just taking exercise and eating well.
    Living a healthier life can change your perspective forever and, because the results
    of the exercise you do and the food you eat have such a crucial bearing on how
    you look and how you feel, it''s not an area you can afford to ignore or take
    lightly. This is why healthy living is so important to many people, and this is
    also why it is a useful process to work with your health and fitness objectives
    to practise the techniques you''ve been learning in this book.


    # ### Exercise and prioritizing


    Rate your satisfaction with how healthy your life is at the moment and decide
    how important it is that you do something to change the situation. Living a healthier
    life has to be a high priority for you in order to create the motivation to make
    the necessary changes.


    # ### Exercise and goal-setting/planning


    You must be clear and explicit about where you are now with your fitness in contrast
    to where you would like to be. Establish what changes in your approach and your
    behaviour would bridge the gap between where you are now and where you want to
    be.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Outline an initial approach for making these changes and build some flexibility
    into your plan. Set specific times to get going and outline clear milestones along
    the way when you can assess your progress so far against your desired progress,
    and you can update your approach as necessary.


    # ### Exercise and beliefs


    Think carefully about why you want to make changes with your health and fitness
    and what making these changes will actually give you. How will your life be better?
    You must be absolutely clear on how you will benefit from your new exercise routine
    or you may struggle to put it into action. Update your beliefs to ensure they
    are in line with what you want to achieve. Holding beliefs such as ‘I’m fat’,
    ‘I’m lazy’ or ‘I just don’t like exercise’ will slow your progress. New beliefs
    such as ‘I’m on the way to my new body’, ‘Exercising helps me feel energized’
    or ‘Exercise is an important part of my life’ will increase your chances of success.


    # ### Exercise and visualization


    Ultimately, you must believe that you will succeed with your objectives and you
    must plan and visualize every step of the way. Take the time to picture what the
    new you will look like. Imagine what you will wear, how you will feel, what you
    will think about your own success, what others will say about your achievements.
    Believe it, visualize it and commit to it 100 per cent. Picture yourself exercising
    and enjoying it. Anticipate how you will feel following each workout. Imagine
    telling others how good you feel about reaching your goals.


    # ### Exercise and modelling


    Recall examples of times in your life when you were active and felt good being
    so. It doesn’t matter how far back you need to go, what matters is that you remember
    positive associations with exercise or activity. Everyone has at least one positive
    experience, whether it be cycling around in the summer holidays or swimming'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'in the ocean on holiday. Remember how good this felt and then aim to recreate
    these feelings with the exercise in your current routine. Select some positive
    role models for your health and fitness. Who do you know who looks like you want
    to look? Who has that inner glow and positive demeanour that comes with regular
    activity? Quiz these people and find out how they do it. Model the aspects of
    their approach that are applicable to your particular situation.


    # Nutrition and prioritizing


    Rate your satisfaction with how healthy your food routine is at the moment and
    decide how important it is that you do something to change the situation. Refer
    back to your reasons why living a healthier life is important for you now, and
    make sure that eating healthily is a top priority for you before you attempt any
    lasting changes.


    # Nutrition and goal-setting/planning


    Be specific about the changes you are setting out to make with your eating plan.
    Keep your objectives simple, such as ‘By the end of the month I will eat breakfast
    every day’, ‘I will eat four pieces of fruit every day from now on’, ‘two mid-morning
    and two mid-afternoon’. Plan how you will support yourself in your objectives.
    If you want to eat breakfast every day, you need to shop for some breakfast options
    and have them in stock. If you want to eat more fruit, you will need to create
    a new routine of shopping regularly for fresh supplies so that you have plenty
    at home or at work when you need it. Review your objectives regularly so that
    you can quickly address and adjust your behaviour if necessary.


    # Nutrition and beliefs


    Investigate whether your beliefs around healthy eating will help or hinder you
    in your new objective. Beliefs such as ‘Food just isn’t a priority for me’ or
    ‘I’ve always been overweight’ will limit your success. New beliefs along the lines
    of ‘I’m interested in food as a means to reach my desired body shape’ or ‘I decide
    what weight I’d like to be and am in control of this’ will help you achieve great
    results quickly.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# **Nutrition and visualization**


    From the beginning of your healthy eating regime, you must create mental images
    of yourself shopping for healthy food, preparing interesting meals packed with
    energy and vitamins and nutrients, eating them and, above all, enjoying them.


    The more pictures you can create in your mind of the benefits you will gain from
    healthy eating, such as a new body shape, fat loss, new clothes and how you will
    feel shopping for them and wearing them, increased energy, better skin and a radiant
    glow from within, the easier it will be to make the necessary behaviour changes
    and the quicker you will begin living these positive images.


    # **Nutrition and modelling**


    Remember times in your life when you ate well and how you felt about this. Recall
    as many positive, personal associations with healthy eating as you can. These
    recollections could be times when you have made an effort to cook for yourself,
    healthy and enjoyable meals you have eaten in restaurants or times when someone
    else has cooked for you.


    Who do you know that eats well and lives with the benefits of doing so? Select
    a few people who have a successful approach to healthy eating and find out how
    they do it. Quiz them on what they find easy or where the pitfalls are. Learn
    from their experience and tailor an approach that suits you.


    # *Seven steps to success – beautiful body, endless energy*


    # **1 Immediate action**


    Get into the mindset of someone who lives a fantastically healthy lifestyle. Get
    yourself a glass of water and then prepare a fruit smoothie or some freshly squeezed
    juice. Check your posture, sit up straight and have a bit of a stretch. Think
    about how your body feels.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# ## 2 Ring the changes


    Your body and mind from now on are going to feel different. Make a list of everything
    that you want to eliminate or cut down on. Things like processed food, caffeine,
    alcohol, crisps or sweet snacks. Check the list and make sure that you are happy
    to live with less of these things in your life. For those you can''t completely
    get rid of, decide what will be an acceptable level for them to feature in your
    new routine.


    # ## 3 Plan of attack


    Devise your healthy living routine for the next seven to ten days. Consider what
    you want to eat and drink for these days. Plan when you will exercise and what
    you will do.


    # ## 4 Prioritize


    Select which measures for healthy living you can put into place the fastest. The
    sooner you start, the quicker you will feel great.


    # ## 5 Review


    Healthy living is addictive, so keep track of the changes you make so that you
    can make more of them. You don''t know how fantastic you could feel until you
    put as many positive strategies into place as possible.


    # ## 6 Make it fun


    Get others involved where you can. If you are living healthily with other people,
    not only will you be more likely to stick to your objectives but it will be more
    fun to share the experience and success with others.


    # ## 7 Enjoy it


    From the moment you begin to live a healthier life, you will feel better, so start
    enjoying it right away. Don''t wait until you achieve one of your milestones to
    celebrate your success. You can revel in these triumphs when they come as well,
    but for now take heart and motivation from the fact that you have begun the journey.'
  merge: -1
  img_proc: true
