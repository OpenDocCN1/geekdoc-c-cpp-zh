- pgno: 94
  md: 'As well as continuing your self-development, it is important to recognize and
    acknowledge how far you have come. This is crucial because it will ensure that
    you are always aware of your achievements, and will guarantee that you learn from
    them and use the successful strategies that you have created again and again when
    you meet future challenges. Maintaining an awareness of your own successes will
    keep your confidence high. When you examine the challenges that you''ve overcome,
    you will know that you can deal with anything that life sends your way.


    Chapter 9 presents you with the opportunity to acknowledge how far you have come
    with coaching yourself to success in only a short time. By affirming your confidence
    in your own abilities you will reinforce your foundations for all future achievements.'
