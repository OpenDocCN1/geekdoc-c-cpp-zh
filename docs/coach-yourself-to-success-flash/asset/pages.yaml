- pgno: 25
  md: 'useful as it calls into question the idea that ‘life’ isn’t working for you.
    With this process you can clearly see that much of life will be working for you
    and that, with a few changes in selected areas, you will rapidly feel more in
    control of your overall situation.


    What’s magical about the process is that, while it enables you to draw positives
    from the higher scores, you can also see the close relationship between some of
    the areas that you’ve scored low in. There will be common themes in these areas
    that can be addressed simultaneously with new thoughts, behaviours and actions
    – when you’re thinking about what changes you’d like to make to your life, focus
    on the areas in which you’ve scored lowest to begin with. Improving your rating
    from four to eight in a selection of areas will bring you a greater feeling of
    success than improving any single score from nine to ten.


    Take a look at where you’ve scored lowest and consider the following questions
    for each area in turn.


    # ### Instant progress questions


    +   1. What would have to happen in this area of my life for me to be able to
    score myself higher?

    +   2. What would I like my rating out of ten to be in this area?

    +   3. By what date could I improve my rating in this area?

    +   4. What’s the first action I need to take to begin raising my score in this
    area of my life?

    +   5. When can I take this first action?


    Once you have established the areas of life you most wish to improve in and have
    outlined what you need to do in order to'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'increase your satisfaction rating, you can consolidate your ideas on how to
    make fast, effective progress by drawing on the key factors for successful change
    as outlined in Chapter 1. Remember to put sufficient detail in each step of the
    process.


    # **Key factors for successful change**


    +   * A clear objective

    +   * Research

    +   * Action

    +   * Accountability

    +   * Structure

    +   * Feedback, flexibility and modification

    +   * The end point

    +   * A clear benefit


    # ## What''s the point of all this?


    You already know that your greatest power to succeed comes from the power of your
    unconscious mind. You have to decide how you are going to programme your mind
    so that it can focus on what you really want and come up with efficient solutions
    for you.


    The questions that you have answered so far are designed to raise your awareness
    of what''s really going on in your life and to help you to begin focusing your
    mind towards where you want to be and when you want to be there. With your conscious
    mind and your unconscious mind focused in the same direction, you will now see
    opportunities for success where you may have missed them in the past.


    # ## The power of pictures


    Taking time to thoroughly plan your objectives gives your mind an opportunity
    to create and visualize your success. What you focus on is what you will get,
    so make a decision now to focus on solutions and positive results. Planning your
    success means you can create it mentally before you begin to live it for real.
    The more often you visualize success and the more detail you can create in your
    mental pictures, the quicker your triumphs will come to fruition.'
