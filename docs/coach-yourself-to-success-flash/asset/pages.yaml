- pgno: 45
  md: 'As you know from the exercises you have already completed, the act of writing
    things down helps to formalize and refine your thought processes. Writing down
    your objectives in different areas of your life for different time frames will
    highlight the areas you want to work on most.


    Completing this exercise also shows whether or not you have plans for each area
    of life. If you find any area difficult to complete, chances are you''ll be feeling
    a little adrift in this area. Now is the opportunity to pin down what you want
    to happen in these areas and when you want to see progress. This planning tool
    will show you how the balance of your life stacks up - are you planning for every
    area that''s important to you and do you have plans for different time frames
    for each of these areas? It''s important that you see progressive stages of development
    in each area with a balance between the areas at each time frame. This ensures
    you move forward in a controlled fashion.


    > > You can have it all. You just can''t have it all at one time.


    Oprah Winfrey


    Your planner will show you very clearly whether or not you might have too much
    on the agenda at any given time in the future. If this is the case you can shift
    items in the plan to suit your schedule better. It will also show you if you have
    too little on the agenda. This may sound strange but it is often the case that
    too few challenges can be as dangerous as too many. The planner will show you
    if you have the correct level of challenge in different areas. You should aim
    to always feel challenged but never overwhelmed.


    The planner is an organic tool that must be reviewed regularly to monitor your
    progress - make sure you date it each time you review it and keep copies of previous
    planners. Your most successful strategies are also organic and you might not settle
    on the best solution for an issue straightaway. The planner will ensure that you
    stay on track with your overall objectives and will help you to modify your approaches
    accordingly.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Your planner will act in a similar way to your daily journal if reviewed regularly.
    You will see clearly how you are making progress and this will bring you a great
    sense of satisfaction and motivation for further success.


    # ## An important reminder


    You now have the self-knowledge and the skills to ensure that your planner looks
    exciting and contains ambitious plans for a great future. Don''t settle for aiming
    for things that are just nice to have, aim for the things you really want in life.


    # ## Creating unstoppable momentum


    Once you have your initial objectives on your planner, the next step is to find
    good reasons to guarantee that these objectives come to fruition. And this means
    really good reasons. Great reasons in fact. Reasons that turn your goals into
    something irresistible, something you absolutely have to make into a reality.
    The simplest way to achieve this is to visualise, in as much detail as possible,
    every aspect of achieving success.


    Working through the following exercise will ensure that you have total clarity
    for all the positive reasons why reaching your goal is worthwhile for you. You
    must create the most vivid and exciting picture of your future that you are capable
    of and work on it until it is irresistible. You''ll know your visualisation is
    working when you can feel all the physical symptoms of excitement that go with
    living in the way that you are imagining. Continue to ask more questions of yourself
    and work on the answers that lead you to feel almost overwhelmed by the desire
    to make this dream a reality. Picture yourself living your dream life in all its
    detail. Keep working on the vision until it feels like you are living your future
    already. You can now use the powerful feelings generated by your visualization
    to take instant action towards creating a world around you that matches up to
    the mental images and physical feelings you have just experienced.'
  merge: -1
  img_proc: true
- pgno: 47
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Commitment and motivation


    When you have created your objectives and visualized them in as much detail as
    you can, ask yourself how committed you are to making these objectives a reality.
    For every goal that you really want in life, you will need a ten out of ten commitment
    level. It''s true to say, and you will have noticed this with projects that you''ve
    taken on before, there is a direct correlation between your level of commitment
    and your level of results. If you approach a project with a five out of ten commitment
    level thinking, ''It''ll be good if this works out so let''s play it by ear and
    see how it goes'', chances are you will achieve a five out of ten result.


    If you really want to succeed, you need to approach your projects with complete
    commitment. If a job is worth doing, it is worth doing well, and if you really
    want to make a difference to how things will be in the future, you really need
    to focus your full attention on what you''re aiming to achieve. Commitment creates
    motivation, motivation generates energy and energy leads to results.


    If you rate your commitment for a project and find it to be less than ten out
    of ten, you must ask yourself what prevents you from feeling totally committed.
    What is it that is holding you up and blocking your progress? Pay attention to
    the answers here, as overcoming these issues can form mini objectives for your
    planner which, once achieved, will ensure success with your larger objectives.
    Treat your mini goals in the same way as you treat the larger goals. Set a deadline
    for achieving them, establish what you will gain by achieving these mini goals
    – what''s in it for you – and then visualize success in every detail.


    > > Losers live in the past. Winners learn from the past and enjoy working in
    the present toward the future.

    > >

    > > — Denis Waitley, American author, speaker and peak performance expert


    # # Learning from others


    When you have decided what you really want in life, you will begin to see the
    opportunities that move you closer to your'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'objectives and you will act upon these opportunities quickly and efficiently.
    As you gain momentum with your progress in life, you will continually look for
    ways to move yourself forward more and more swiftly. The feelings of success that
    you experience are addictive and you will want to experience them as often as
    possible.


    Learning your own lessons along the way is a crucial part of your development.
    There are also other techniques that you can employ to hasten your progress towards
    your ideal life.


    For most of the things that you are setting out to achieve, it is highly likely
    that someone else will have done some of the work and paved the way for you. That''s
    not to say that your objectives aren''t original, simply that your ideas on how
    you want to create your life will have evolved from one external source or another.
    It is likely that you became aware of what others had achieved in their lives
    and this spurred you on to desire similar results for yourself. Consequently,
    you may not be the first to strive after particular objectives, but they are certainly
    original to you and your life.


    The fact that someone else has paved the way for you is great news. You are now
    in a position where you can examine how they did what they did, model their success
    and quickly learn the lessons that may have taken them months or years to master.
    You don''t need to worry about whether or not you will achieve success, or how
    you''re going to achieve that success. All you need to concern yourself with is
    finding the correct person, or people, whose success you are going to copy, and
    then get down to work.


    # Choosing role models


    Take a moment to think about it now and you will call to mind someone, or perhaps
    a selection of people, who share your ideals and seek to live by them. They might
    be people who are close to you, perhaps family, friends or colleagues, or individuals
    that you don''t know so well, or maybe someone that you''ve only come'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'across a couple of times but who made an impression on you. Alternatively,
    perhaps you can think of someone in the public eye who you admire because they
    think and act as you do or as you would like to.


    By looking more closely at what it is you admire about these people and analysing
    how they behave, you can learn by their example and incorporate aspects of their
    positive behaviour into your own life.


    Having role models in life is crucial to your success. If you don''t have positive
    examples to follow, it can be hard to know precisely how to behave, particularly
    when moving out of your comfort zone. Following in the footsteps of someone you
    admire can really help to speed your progress towards your aims. You probably
    had role models and heroes when you were young but at some stage in your life
    you decided that you didn''t need them any longer and that you were fine on your
    own.


    Following in the footsteps of others is a simple way to fast-track success. It''s
    something everyone does instinctively from when they are very young: for example,
    when you were a baby and you saw adults walking, it looked like an interesting
    way of getting about, definitely more efficient than crawling, so you copied them,
    slowly but steadily, until you mastered the art.


    Beginning to walk is a great example of how people learn when they are young,
    and clearly illustrates another point made earlier that there is no failure, only
    feedback. A child learning to walk will fall over hundreds of times. Even though
    she may hurt herself, she will continue to practise until she has mastered the
    task at hand. If children learning to walk gave up and thought they had failed
    after the first fall, their lives would be very different. But they don''t. They
    persevere because they have a very clear objective to aim for – they know what
    it looks like to walk and they''re not giving up until they''ve achieved it –
    and they have no concept of not making this objective a reality. They know they''re
    going to be able to walk sooner or later so'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'they just keep at it until they can. There is no doubt in their minds that
    they will be successful. They are totally committed to achieving their goal.


    # Be your own role model


    If you could harness this type of single-minded focus and dedication for the rest
    of your life, you’d be unstoppable, wouldn’t you? Well, you had it once so chances
    are it will still be within you somewhere. Take a common moment now to list three
    examples of times in the recent past when you were completely focused on an objective
    and didn’t stop until you had achieved it. Choose anything from finishing a project
    at work to completing a sporting challenge – or even getting the shopping or housework
    done.


    # Three recent examples of when I was completely focused and effective


    +   1.

    +   2.

    +   3.


    Now that you have evidence that you can achieve this state of being, what are
    the circumstances necessary for this to happen?


    # The circumstances surrounding my recent examples of when I was completely focused
    and effective


    Circumstances may include things such as being well rested, having sufficient
    time, good preparation, clear objectives and the correct incentive.


    +   1.

    +   2.

    +   3.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Seek out the positive


    The knowledge that you gain from running through these exercises is invaluable
    in creating the correct environment for success. Listing particular examples of
    when you were successful helps you to build up a body of evidence to show that
    you are capable of great achievements when you turn your mind fully to a task.
    Gathering evidence of your own successful strategies and circumstances also means
    that you can pinpoint very effectively when circumstances are not completely in
    your favour. You can then act promptly to alter situations where necessary to
    ensure that you are fully supported in your objectives and at the best advantage
    for the most positive result.


    # Modelling your own success


    In the world there seems to be a tendency for people to judge themselves very
    harshly. If something in their life isn’t going according to plan, it can trigger
    a spiral of negative thoughts that leads them to conclude that they are incapable,
    ineffective, and not up to the job. If you ever find yourself falling into this
    trap, break the cycle of thought by thinking immediately about what you are good
    at. You are good at many things but will often overlook these things in your quest
    for complete perfection. Answer the questions in the previous activity and use
    your answers to plan a new approach in whatever area hasn’t yet worked for you.
    If you have strategies that you know work for you in particular areas of your
    life, use them. There’s no reason why they shouldn’t work in other areas too.


    # Modelling the success of others


    Modelling your own success is a clever way to jump-start progress in any part
    of your life and it can be a very productive technique. Moreover, there’s no need
    to stop there. Somewhere in the world there will be someone who has achieved everything'
  merge: -1
  img_proc: true
- pgno: 53
  md: "that you want to achieve. All you need to do is seek them out. If these people\
    \ are within your immediate circle of contact, talk to them and find out how they\
    \ did it. Do not hesitate to grill them on the secrets of their success. People\
    \ are generally flattered to be seen as an inspiration and are usually very happy\
    \ to answer questions on themselves and their achievements. Listen to what they\
    \ have to say and apply what’s relevant to your own situation.\n\nIf you choose\
    \ role models who are outside of your immediate circle, find ways of researching\
    \ their achievements. Establish whether there is any way you can get closer to\
    \ them to discover more. Read about them in magazines and newspapers or conduct\
    \ your own research into their character and their approach online.\n\nIt's a\
    \ good idea to have a number of role models for different areas of life and a\
    \ couple of people whom you perceive as already living the life you aspire to.\
    \ It could be their ambition, their lifestyle, their personality, their confidence\
    \ or their general demeanour that attracts you to these people. Consider carefully\
    \ what it is that they have that you would like more of in your life and pinpoint\
    \ how you can make it happen.\n\n+   List five people that you would like to use\
    \ as role models and note down what it is about their character or their life\
    \ that you admire and aspire to.\n+   \n+   **Role model 1**\n+   What is it about\
    \ this person that inspires me?\n+   \n+   **Role model 2**\n+   What is it about\
    \ this person that inspires me?\n+   \n+   **Role model 3**\n+   What is it about\
    \ this person that inspires me?"
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Role model 4


    What is it about this person that inspires me?


    # Role model 5


    What is it about this person that inspires me?


    Whatever it is about your role models that inspires you, you can create more of
    these character traits in your life by watching them closely. Study what it is
    that they do that creates the overall impression that attracts you towards them,
    and consider what elements you can add into your daily life. Select the best bits
    of each person''s success and use these to design your own master strategies.
    Create your own new behaviours made up of a combination of the most attractive
    parts of your role models’ success and an element of your own personality. You
    must be comfortable with these behaviours and you will be able to refine them
    using the feedback you get from trying them out. Select the situations where you
    try these behaviours and begin with changes that are a challenge but not too intimidating.
    As you become more comfortable with your new approaches, you will be able to apply
    them on a wider scale.


    # Act as if


    You already know how important it is to monitor your thoughts because they are
    crucial to determining your behaviour. Using your role models is a powerful way
    of developing your thought processes to support you in your aims through your
    behaviour. You might think that it''s all very well in theory to model the behaviour
    of others, but you just don''t think like they do so your behaviour may appear
    inconsistent. In coaching, there is a technique called ''act as if'' which will
    help you to overcome this hesitation. It enables you to bridge the gap'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'between theory and practice by acting as if you did think like these people.
    If you had the same mindset as your role models, how would you be able to act?
    Pretend that you have got the same mindset and act as if you are already in the
    place you want to be.


    > > *If you can''t make it good, at least make it look good.*

    > >

    > > — Bill Gates


    If you don''t think you are a confident person, act as if you were and consider
    how your behaviour and your thoughts would be different. If you don''t think you
    are the right person to be promoted, act as if you are and monitor the new way
    you view your career. If you don''t think you are someone who lives a healthy,
    fulfilled life, act as if you are this type of person. You will quickly highlight
    how you can behave differently and you can put this into action immediately.


    # ### *You and whose army?*


    In today''s chaotic world it''s easy to feel that you have too much to do and
    too many people to answer to, and it can all become overwhelming. Sometimes, you
    may feel that it''s you against the world and you''ve got no one on your side.


    On occasions like this it''s time to rally the troops. Instead of crumbling under
    the pressure, get instant help by calling up some positive thought patterns. Think
    about the examples of when you were completely focused and effective. What was
    it about those situations that was so successful for you? What can you draw from
    those situations and put into action immediately?


    Now quickly think about how your role models would react if they were in your
    situation. What would they think about the issues you face and how would they
    navigate their way through'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'them? Thinking about someone else dealing with a situation instantly takes
    the heat out of the moment for you and enables you to take a step back and see
    things with a little more clarity. By imagining what others would do, it allows
    you insight beyond what you might come up with by yourself. Use this insight in
    conjunction with your innermost feelings on what is right for you at the time
    and you will be in a great position to make the right decisions.


    You’re never on your own in any circumstances if you can generate an army of advisers
    in your head. Whether this advice comes from your own previous successes or your
    army of chosen role models, the route to success will be there for you whenever
    you need it.


    > > *Surround yourself with people most like the person you want to become. Stay
    away from anyone who can or will bring you down.*

    > >

    > > — Tom Hopkins, sales trainer'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 5


    # getting the most out of everything you do'
