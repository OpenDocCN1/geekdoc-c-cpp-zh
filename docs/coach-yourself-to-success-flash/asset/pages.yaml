- pgno: 7
  md: '# 1


    # what makes you happy?'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'For generations, individuals have been searching for the meaning of life and
    have gone to the most amazing lengths to try to understand what it’s all about
    and why we are here. Some travel to seek out new experiences and broaden the mind,
    and some crave isolation in the hope that introspection will lead them to the
    answers they are looking for.


    However you choose to explore your existence, what is most important is that you
    choose to explore at all. Life is short and the world goes on without you when
    you’re gone. What are you going to do to make a difference while you’re here?
    What can you contribute? What is your mission in life?


    Taking an overview of all the ideas that people perceive as crucial to their existence,
    the one common thread is that everyone wants to live as happily as they can. Chapter
    1 explores what happiness means to you.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Take a moment now to think about what makes you happy by asking yourself the
    following questions. Make a note of your answers.


    +   * When did I last feel truly happy?

    +   * Where was I?

    +   * What was I doing?

    +   * Who was I with?

    +   * What makes me happy on a regular basis?

    +   * What activities make time fly for me?


    Think of as many times when you felt happy as you can.


    Now highlight the top five things in your life that are guaranteed to make you
    happy:


    +   1

    +   2

    +   3

    +   4

    +   5


    Now that you know what makes you happy, you must make sure that you do more of
    these things regularly. For each of the top five things that make you happy, make
    a note of the next time you will do each one of them. Use your diary or scheduler
    to help you plan accurately and to make sure you commit to each of the five things
    within the next 14 days. Plan a specific time for each commitment.


    # Today''s date:


    Date for next occurrence of each activity:


    1

    2

    3

    4

    5


    For each of your happiness activities, write down the details surrounding when
    it will be happening next. Where will you be, what will you be doing and, crucially,
    what do you need to put in


    +   6. coach yourself to success'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'place right now to make sure that each event takes place? What can you do today
    to guarantee you are able to do the things you enjoy?


    # Plan each happiness activity in detail


    +   1

    +   2

    +   3

    +   4

    +   5


    # Taking charge – it’s all in the planning


    This may seem like a heavy-handed and somewhat deliberate process just to do a
    few things that you like doing, but when you try it you will understand how this
    approach works. Generally, the reason people don’t do enough of what they like
    is that they don’t plan these activities properly. They have their daily routine
    but these routines often don’t contain enough of what brings them pleasure. The
    problem is that these routines can become deeply embedded and, in many cases,
    are perpetuated unconsciously if people do much that makes them unhappy without
    properly engaging with what they are doing or working out how they could make
    things better. They simply follow their familiar routine and hope they might have
    time for something enjoyable along the way.


    Sometimes, people feel they can’t do more of what they enjoy due to the pressures
    of everyday life and circumstances being beyond their control. They can feel dissatisfied,
    but don’t spend the necessary time and effort focusing on what could be different.
    They tend to follow unconscious patterns of behaviour because these patterns don’t
    require much thought. Problems arise when these familiar patterns can eventually
    make people frustrated and miserable.


    To change the situation, you need to bring your patterns of behaviour into conscious
    thought. You need to examine and'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'analyse what you do, what isn''t working for you, and question what behaviour
    patterns might be more beneficial. Working through the above process does just
    that. It makes new strategies conscious, so that you know precisely what you must
    do in order to make life different and more fulfilling. The most exciting advantage
    of this process is that, by examining what''s not working, making a conscious
    effort to establish new approaches and behaviour patterns and then putting them
    into action, you practise what works until this becomes your unconscious behaviour.
    You can return to not having to think so deeply about everything you do because
    you are now following new and positive unconscious behaviour patterns that get
    you what you want.


    Doing more of the things that make you happy will instantly change your outlook
    on life. It will also leave you feeling more in control and positive, with the
    knowledge that you are running your life rather than feeling like the victim of
    circumstances. This will immediately reduce stress levels and increase your daily
    satisfaction.


    > > *Now and then it''s good to pause in our pursuit of happiness and just be
    happy.*

    > >

    > > Guillaume Apollinaire, French poet and writer


    # ## Your personal plan for success


    Whatever you want in life, there are simple strategies for ensuring that your
    dreams become a reality. One quick system you can follow is to keep a daily journal
    to monitor specifically what happens in your life each day. Life is busy, and
    it is quite easy for your judgement to be clouded and for you to misrepresent
    what happens on any given day as you rush around from project to project – you
    are so preoccupied by getting things done that you overlook the very things you
    are actually achieving.


    If you are looking to make changes in your life, you will want to make sure that
    you make the right changes. To make the most effective changes, you must know
    precisely what is going on with'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'your life at the moment. By keeping a journal, you can track your progress
    by monitoring your current behaviour and the results you are getting. Then, if
    you need to modify your approach, you can very clearly see where the most effective
    changes can be made. Keeping a short personal journal is a great way to monitor
    what''s working for you and what isn''t. Look at how life is currently treating
    you by completing a journal entry for today.


    # Daily journal


    | Day/date: |

    | --- |

    | What did I enjoy doing today? |

    | What would I like to do more of? |

    | What would I like to do less of? |

    | What did I learn today? |

    | What will I do differently tomorrow? |

    | Thought for the day |


    # Why keep a daily journal?


    To make the most effective changes in your life, you must know what''s going on
    right now. You need to be aware of your current thoughts and behaviours because
    it is precisely these thoughts and behaviours that bring you the current results
    you are experiencing. Once you make yourself consciously aware of the highs and
    lows of each day, you can decide specifically what changes you''d like to make
    so that you can increase the positive, decrease the negative, and enhance your
    enjoyment of each successive 24 hours. The questions in your daily journal will
    enable you to pinpoint what you need to do and to take action quickly.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# ### One change or many?


    Once you begin to make positive changes, life feels better and you may feel motivated
    to change as much as you can, as soon as you can. One question that often arises
    when people are overhauling their life is ''How many things should I try to change
    at once?'' The answer simply boils down to how quickly you want to progress towards
    your new life, and how comfortable you are with the pace of change. The sooner
    you can begin behaving in the way you want your life to be, the faster this behaviour
    will become a reality. Often people are capable of making as many changes simultaneously
    as they choose to, so don''t be afraid to set your sights high with the pace of
    change. Just make sure you keep track of your progress with your journal and then
    adjust your approach as necessary to incorporate more or less change depending
    on your current life circumstances.


    # ### How long does change take?


    Another frequently asked question is ''How long will it take me to change an area
    of my life?'' For many changes, the answer is similar to that for the question
    ''How long is a piece of string?'' Change can be immediate as you can usually
    take some form of action straightaway that will alter the results you experience.
    The sooner you take these actions, observe the results and modify your approach
    accordingly, the sooner a complete change can be effected.


    One way to guarantee that change is immediate is to make a change in the way you
    think about a particular issue or area of life. Even if you can''t take immediate
    action directed towards your desired change, altering the way you think and feel
    about a situation will always be the first step to ensuring that change happens.


    # ### Your greatest asset for change


    This is a good time to formally introduce you to your most valuable asset in your
    quest for fulfilment. The most powerful ally'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'you have is a source of inspiration that will never let you down – your unconscious
    or subconscious mind. This is the mysterious part of you that some people refer
    to as ‘intuition’, ‘gut feeling’ or a ‘sixth sense’.


    When you are busy with a task or a project, or even thinking about what to have
    for lunch, it is your unconscious mind that is focusing on the issue at hand.
    You make a decision on what to think about, and you concentrate on it. You may
    come up with a solution right there and then, or you may not.


    When you choose to focus on particular thoughts, your unconscious mind takes care
    of everything else that needs to be considered to keep you safe, healthy and happy.
    While you think of lunch, your unconscious mind controls your breathing, keeps
    you upright and prevents you from walking into walls on your way to the restaurant.
    Your unconscious mind is your own personal autopilot. It is the part of your brain
    that is processing information all the time, even though you may not be aware
    of it.


    You can train your unconscious mind to work in particular ways, and you must be
    careful about how you choose to programme this part of your mind. The power of
    the unconscious mind is clearly demonstrated by tasks such as driving or travelling
    a familiar journey like daily commute to work. When you learn to drive, you really
    have to concentrate on what you are doing as there are so many tasks to be remembered
    and a potentially high price to pay if you make a mistake. When you first start
    a job, you have to plan your journey to the office carefully making sure you use
    the most efficient route, get your timings right and are safe at all times. Both
    these tasks are carried out completely consciously when you begin them and require
    a high degree of concentration.


    As you repeat these tasks, they become more familiar and you can afford to focus
    less on what you are doing until eventually you can perform them while concentrating
    on something else completely. At this point, your unconscious mind has taken charge
    of these tasks, leaving your conscious mind free to focus on what might be more
    important at the time. Amazingly, the power of the'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'unconscious mind is so great that you can trust it with something as complex
    and as important as getting you safely from A to B. And if you come across something
    slightly amiss on one of your journeys – a road diversion or a station closure
    – you can be sure that your unconscious mind will raise the alarm and send a signal
    to engage your conscious mind to work out what you will do about this interruption
    to your regular routine.


    Your unconscious mind is a powerful resource and one not to be wasted. It runs
    your body while you are busy thinking of more interesting things to do, and it
    filters and files information while you sleep. It interprets the most important
    things learned each day and commits them to the part of your memory where you
    can access the information most easily. It is your unconscious mind that gives
    you those ''eureka'' moments when you are busy working on one topic and the answer
    to something completely different, maybe something that you''ve been struggling
    with for days, suddenly pops into your head as if from out of nowhere.


    # Using your assets


    If your unconscious mind is such a powerful tool, what can you do to get the best
    out of it? Put simply, you tune into how your unconscious mind is already working
    for you and then make it work harder. First of all, think about when your unconscious
    mind has worked for you in the past.


    +   - When was the last time you had a gut feeling on something or someone?

    +   - Did you act in accordance with your gut feeling or did you go against it?

    +   - How did the situation turn out?


    Your instincts can be strong, and are rooted in a very quick assessment of what''s
    going on in any situation in relation to your life experiences, what’s best for
    you right there and then, what keeps you safe and what helps you through each
    day. In each situation that you enter, your unconscious mind will assess what’s
    going on in relation to the information you have given it, which is based on what
    your conscious priorities in life are. Once you'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'point your unconscious mind in a given direction, it will pick up on opportunities
    to help you move in that direction and will filter out information that it deems
    to be irrelevant to your objectives. To act against your gut instinct can lead
    to frustration and often ends with those moments where you say ''I knew I shouldn''t
    have done that'' or ''I knew how this was going to turn out''. Well you probably
    did, and it was your unconscious mind that was telling you.


    To make the best use of your unconscious mind, give it something to work with.
    When you know what makes you happy, focus on these things regularly, and your
    unconscious mind will lead you to opportunities to do more of these things. If
    you''re struggling with a problem, give it to your unconscious mind to work out
    the answer. Do something other than dwell on the issue. Take your conscious mind
    elsewhere for a while and go for a walk, do some gardening or even sleep on it
    and you are more likely to come up with a successful solution than if you just
    sit there racking your brain and going around in circles.


    # ### Practice makes perfect


    Trusting your instincts can be a daunting prospect so practise regularly and begin
    with relatively low-risk decisions. Make the effort to go with your gut feeling
    on at least three decisions every day and monitor your results.


    # ### Effective decision making


    There''s nothing worse than feeling indecisive. In the worst cases, failing to
    make decisions can lead to complete paralysis and an inability to move forward
    with anything. Trust your gut instinct and you will avoid this situation completely.
    Go with what you feel is right at the time and take action accordingly. You''ll
    soon know if the action taken wasn''t completely the right thing to do, but you
    can easily make adjustments to your approach until you refine the perfect solution.
    The important thing is that making a decision, any decision, will overcome paralysis
    and move you forward immediately. You can then amend the direction you''re headed
    in according to the feedback you receive from your initial decision.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# A simple example of change


    Learning to drive is a great illustration of a change most people make to their
    lives and the thought processes they employ to make these changes. To begin with,
    you have the current situation and something in life you want to alter. You can''t
    drive and, for whatever reason, you know that your life would be better if you
    were able to drive. Consequently, you form an objective – to learn to drive –
    and research how you can make this happen. You ask others, probably your parents
    first, how they learned to drive, and then you find out who you can learn to drive
    with, probably through recommendations from friends or research from directories.
    Once you''ve done your research, you take action by calling an instructor and
    booking an appointment for your first lesson. You attend your lessons and practise
    new skills until you feel confident enough to take your driving test.


    Learning to drive illustrates four clear stages of change and highlights the changing
    roles of your conscious and unconscious mind as you develop new skills.


    +   1 Unconscious incompetence

    +   This is when you don''t know what you don''t know. You see cars around but
    you''re unaware that you could be driving one. At this point in your life, driving
    is something that other people do. You have no comprehension of what might be
    involved in learning to drive.


    +   2 Conscious incompetence

    +   This is when you know what you don''t know. You realize that driving is an
    option for you, and quite an attractive one at that. You have highlighted a new
    skill that you want to learn and you investigate the necessary steps to mastering
    that skill.


    +   3 Conscious competence

    +   This is when you are very aware of what you do know. Having established what
    you needed to learn in order to be'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'able to drive, you have learned the necessary skills and mastered the art,
    but you still really have to concentrate on every aspect of doing it.


    # **4 Unconscious competence**


    This is when you are capable of doing something but don''t have to consciously
    engage in doing it. At this point, driving becomes second nature and you don''t
    have to think about every gear change and every move you make.


    Mastering the art of driving also demonstrates key features of facilitating change.
    These are features that you need to be aware of if you want to change in your
    life to be fast and effective. The key features can be summarized as follows:


    # **Key factors for successful change**


    +   - A clear objective

    +   - Research

    +   - Action

    +   - Accountability

    +   - Structure

    +   - Feedback, flexibility and modification

    +   - The end point

    +   - A clear benefit


    # **A clear objective**


    For guaranteed success, you must be able to state your objective accurately and
    concisely: ''I''m going to learn to drive and I''d like to pass my test within
    the next six months.''


    # **Research**


    Knowing what you are setting out to achieve enables you to research the means
    to achieve your objective. Find out how one learns to drive – the method – and
    then find out how you are going to learn to drive – the practicalities. This will
    include whom you have lessons with, whose car you use, how many lessons you will
    aim to have and how much practice you can do between lessons.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# ## Action


    > > *If you want to conquer fear, don''t sit home and think about it. Go out and
    get busy.*

    > >

    > > Dale Carnegie, author of *How to Win Friends and Influence People*


    Successful change begins with action and continues with more action. Action makes
    you feel positive and in control. You begin with finding out the facts and putting
    your resources in place. You take your first driving lesson and then practise
    repeatedly. You plan a schedule for your theory study and then keep up to date
    with it.


    # ## Accountability


    Sharing your objective with others increases your accountability to making it
    work out for you. The more friends, family and colleagues that you tell what you''re
    up to, the greater incentive you have to make a good job of it. Getting others
    involved also provides you with a strong support network.


    # ## Structure


    There must always be a structured plan for how you will get from where you are
    now to where you want to be. In this case, the structure of the plan must include
    the number of lessons you anticipate, the time this will take out of your schedule,
    the content of the theory study and a time allocation for this, and any other
    preparation you need to do for your test.


    # ## Feedback, flexibility and modification


    > > *What separates the winners from the losers is how a person reacts to each
    new twist of fate.*

    > >

    > > Donald Trump


    Even the best-laid plans need an element of flexibility. You must continually
    monitor your progress and modify your approach where necessary. Your initial objective
    may be to take your test in June but, if you really need more practice with your
    parallel parking and reversing around a corner, you may need to modify your plan
    to allow yourself more time to practise and'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'then take your test in July. Being flexible should never be seen as compromising
    on your plan; rather, you are simply being realistic about how to achieve your
    desired result at the right time based on your current circumstances and rate
    of progress.


    # **The end point**


    Every objective must have an end point. You must know when you''ve been successful
    so that you can appreciate your achievement and begin forming new objectives.
    You''ll know you''ve succeeded when you hear someone say the words ''I''m pleased
    to say you have passed your driving test.''


    # **A clear benefit**


    To smooth the path through any change or challenge, there must be a clear benefit
    to the action. You must be absolutely clear on how what you will have achieved
    by making the change will improve your life and the life of others around you.
    The clear benefits of passing your driving test are freedom, flexibility and fun.
    Make sure that every positive change you set out to make has an element of reward
    built into it. Making a change is reward in itself. Creating as many benefits
    as possible from making the change will definitely increase your likelihood of
    quick success.


    # **The learning cycle**


    So now you can see and understand the simple processes that your mind goes through
    when you want to make changes. You begin at the point where you are living your
    life without really being aware that something might need to change. Then you
    see or experience an event that triggers a desire to make a change. You focus
    specifically on the change you need to make, how you can effect that change, and
    you practise new approaches and ways of behaving until you have achieved a new
    way of being. At this point, you allow your new behaviour to drift into the realm
    of unconscious living, leaving you free to focus your mind on new challenges.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # 2


    # # examining the bigger picture'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Already you will feel happier about your life and will have taken steps to
    make positive changes. Yet what do you do if you don’t yet know precisely what
    it is that you’d like to change? You may feel that something in your life isn’t
    quite right, but you’re not sure what. If you suspect that you don’t have quite
    the right balance in life, nagging doubts can gnaw away at the back of your mind
    and distract your focus. The best thing you can do in this situation is to isolate
    what’s bothering you and address these areas as soon as you can. If you are not
    currently satisfied with your life then something is missing. Find out what’s
    missing quickly and attend to it immediately.


    For those areas you’d like to change, success is dependent on doing things differently,
    whether this means thinking about a situation slightly differently or acting with
    new approaches. For speedy results, it is vital that you make the changes sooner
    rather than later. Chapter 2 helps you highlight priority areas for change.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Solving issues can be a gradual process, and you must take the first step in
    the process as soon as you can. Don''t be afraid to experiment with different
    approaches, simply make a start and if your first approach isn''t the best one
    for you, the feedback you get from taking the first step will help you to modify
    your behaviour for the next step and lead you gradually to a solution that works
    for you.


    Don''t be concerned if you are struggling with the first step to take in tackling
    any single problem or issue. If you find yourself in this position, be content
    with taking any action. Even if it doesn''t seem directly related to what you
    are trying to achieve, doing something proactive will make you feel better.


    Action of any description will also lead you somewhere. You will discover new
    information, find new ways of looking at issues and uncover new options as long
    as you keep an open mind and are willing to experiment. It''s vital that you are
    prepared to get busy in any area of life and see what you learn.


    > *There are no mistakes, no coincidences. All events are blessings given to us
    to learn from.*


    Elisabeth Kubler-Ross, author of On Death and Dying


    # What works and what doesn''t


    If you are experiencing dissatisfaction but you don''t really know why, an extremely
    useful exercise is to take a look at various aspects of your personality by examining
    your mindset and outlook in all areas of your life.


    Take a look at the questionnaire opposite and rate your satisfaction in each of
    the areas. Scoring zero means you are completely dissatisfied in this area. Scoring
    ten means you are completely satisfied with this part of your life. The numbers
    in between represent your current satisfaction level in each area.


    A helpful tip for completing the questionnaire is to rate yourself according to
    how happy you are with your current situation. Don''t compare yourself to your
    idea of the perfect fitness, relationship or career; simply choose a score that
    reflects your satisfaction right now in each area compared with your success in
    each area in the past, or the progress you feel you are capable of in each area
    in the future.'
  merge: -1
  img_proc: true
