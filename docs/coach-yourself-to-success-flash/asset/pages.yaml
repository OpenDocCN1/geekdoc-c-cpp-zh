- pgno: 58
  md: Time is a precious commodity and we're all striving to be as efficient as we
    possibly can be every single day. Achieving consistently great results requires
    an ongoing engagement with how you choose to allocate your time, how you prioritize,
    and how you set yourself up with the resources and assistance you require to run
    your life effectively. This chapter explores how to achieve the right mindset
    for success and examines how to develop a sense of purpose that will ensure you're
    in the best position to mobilize all the help at your disposal to keep your life
    moving forwards at a pace that suits you. The techniques outlined in Chapter 5
    ensure you never waste time on non-urgent activities that distract you from attending
    to what really matters in life. This chapter also describes how to get everything
    you need done without having to do it all yourself.
  merge: -1
  img_proc: true
- pgno: 59
  md: '# ## Do it, ditch it or delegate it


    The world is moving fast, and as you live through each day, new challenges, tasks
    and issues will crop up. These will include opportunities to increase the pace
    of your progress, and useful new information and knowledge that will support your
    aims and objectives. There will also be issues that merely take up your valuable
    time, time that would be more usefully spent elsewhere. Now that you are clear
    on your personal objectives, following the mantra of ''do it, ditch it or delegate
    it'' at all times will guarantee that you keep your focus where it needs to be.
    It will help you to decide quickly which opportunities are worth spending time
    and effort on. If something is relevant and supports you in your aims, do it.
    If something crops up that doesn''t help you in your aims or is not relevant to
    your situation, remove it from your world. Things that are relevant to your aims
    and that can be managed or organized by someone else should be delegated, leaving
    you free to focus on your most vital priorities that only you can achieve.


    # ## Do it


    There is a little flexibility here and this notion can be expanded slightly to
    ''either do it right now, or make a plan of when you will definitely do it later
    in the day or the week''. This can apply to every single task that comes your
    way: opening the post, replying to emails, screening or answering phone calls,
    planning meetings or booking holidays. You must also qualify the ''do it'', making
    it ''do it right and do it properly''. Attending to tasks half-heartedly only
    means you''ll have to spend more time on them later on, and if you don''t have
    time to do them properly now, what makes you think you''ll have time to redo them
    later? If you can''t do it properly right now, pick a time later on when you will
    be able to.


    This part of the process is great for helping you to clarify your priorities.
    If, for some reason, you don''t manage to attend to the task immediately or at
    the appointed time, you now have to consider how much of a priority the task really
    is. Initially it may have appeared important but if it isn''t enough of a priority
    to prompt you to action, perhaps it can be ditched or delegated.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Ditch it


    Here''s an opportunity for you to practise being a little bit ruthless. If you''re
    not going to take advantage of a ''once in a lifetime chance to save a fortune
    on your dream holiday'' offer when it comes through your door or into your email
    in-box, you''re probably not going to be interested in it later in the day or
    week, so throw it away right now. The same goes for all those ''interesting''
    emails that arrive on your computer every day, and incoming phone calls that you''re
    not really interested in. Extra reading and research is great and all very well
    if you have time and if the reading matter is relevant. You can quickly read emails
    as they arrive if they are important, or you can file them to be read at a time
    you allocate for this kind of work, but don''t get sidetracked reading about the
    latest developments in ball bearing technology or a brand new offer from a manufacturer
    of Wellington boots if you have more important things to think about. Remove these
    distractions immediately.


    With telephone call interruptions, don''t say you''ll call the person back or,
    worse, ask them to call you back later. If you have time to deal with telephone
    issues, answer the call and deal with it. If you don''t, manage your calls with
    your voicemail and either address each issue when you can focus on it properly
    or delete any unnecessarily distracting messages.


    # ## Delegate it


    When things crop up that are relevant to your aims, it doesn''t necessarily follow
    that you have to be the one who follows a task through to completion. Considering
    what you can delegate is a useful exercise as it will show you how effective your
    systems, surroundings and support network are for achieving your objectives.


    A common response to the notion of delegating is ''But I don''t have anyone to
    delegate any of my tasks to. There''s only me.'' Well, just because there may
    only be you right now doesn''t mean that it will always be this way. One thing
    is for sure though, if you insist on trying to do everything without any help
    down the way, you run the risk of limiting your growth and your potential. It
    will always be just'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'you, and you have only one pair of hands so there’s a chance you will always
    feel overstretched.


    In every area of life it is important to plan for future growth. If you have a
    support network or a team of helpers in place already, use them wisely and leave
    yourself free to do the things that you enjoy most or the things that are most
    effectively done by you or even the things that only you can do. Get into the
    habit of delegating wherever possible and ensure that your team is equipped and
    trained for the tasks at hand.


    # Choose your mission


    To do a totally professional job, you must have the correct mindset and the right
    attitude for heading up each department of your life. As the leader of each department,
    it’s up to you to write the mission statement for each area and choose what has
    to be achieved. Use what you have learned so far – your knowledge of your values
    and what really matters to you – to create a short mission statement for each
    department. The statements may run along the following lines:


    | Department | Mission |

    |---|---|

    | Health & well-being | To ensure I am physically fit and well and capable of
    achieving all the things I’d like to achieve. To look after and develop myself
    in order that I can be successful at what I do, live with a sense of purpose and
    fulfilment, and enjoy my life. |

    | Relationships | To have fun and grow with my partner and my family. To keep
    in touch with friends and family on a regular basis. |

    | Parenting | To make sure my children are safe, happy and prospering. |

    | Work | To be the best I can be at work and in my career, to keep learning and
    to help others to develop. |

    | Finance | To remain financially stable and strive towards increasing financial
    security. |'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Now you can clearly see the departments of your life and what each department
    needs to achieve. Whether you wish to grow each department or operate each one
    at the existing level but in a more efficient fashion, the next step is to create
    a tight structure for every area.


    Select one department and write out everything that needs to be done within this
    department, in order to achieve its given objective. This forms the basis of a
    ‘job description’ for each life area.


    # **Department: Health & well-being**


    **Tasks and objectives:**


    +   - Keep abreast of regular medical checks.

    +   - Seek specialist advice when necessary.

    +   - Plan and facilitate regular exercise.

    +   - Attend regular yoga classes.

    +   - Walk 10,000 steps each day.

    +   - Plan healthy menus, meals and snacks.

    +   - Shop for correct ingredients.

    +   - Prepare food in advance.

    +   - Eat regularly.

    +   - Drink two litres of water every day.


    # **Department: Relationships**


    **Tasks and objectives:**


    +   - Arrange and keep to regular dates with my partner.

    +   - Plan joint activities and quality time together.

    +   - Speak to parents regularly.

    +   - Visit parents regularly.

    +   - Speak to siblings regularly.

    +   - Visit siblings regularly.

    +   - Remember all birthdays and anniversaries and send cards/gifts.

    +   - Schedule calls with friends.

    +   - Plan lunches with friends.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - Plan drinks with friends.

    +   - Plan meals with friends.

    +   - Plan meetings with colleagues.

    +   - Plan social events with colleagues.

    +   - Attend networking events to widen circle of influence.


    Now repeat the process, writing out the full job description for each department
    of your life. You can clearly see everything that you need to keep on top of during
    the course of each day and week. How do you feel about your life and its structure?
    Are you on top of everything? Is it all under control? Are you set up in the way
    that you would like to be?


    As you will have observed as you were writing out the details of each area, each
    one requires a different approach and a different mindset. You will have felt
    different emotions when writing out the details of your relationships compared
    to when writing the details of work and career. The feelings you experience when
    addressing each area will help you determine where to focus your attentions first.
    If you feel that the structure of a particular area of your life needs to change
    and will require more than just your efforts to ensure that the progress you desire
    can take place, now is the time to begin thinking about who you might need to
    help you in this area and what form this help will take.


    # Creating a network of associates, contacts and resources


    In life it is crucial to have a support network in place. It is vital that jobs
    get done, and get done effectively. Even the most conservative of life plans can
    be difficult to achieve single-handed, and for those who wish to strive to reach
    their full potential, the need for assistance is even greater. For the best possible
    chance of success, you will need access to a team of experts and specialists to
    assist you with your objectives. From a reliable plumber to flexible child care
    and an efficient travel agent, you need people you can rely on to help ease your
    heavy workload.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Write out the details of specifically who will help you in each area and how
    they will be of assistance to you. Complete this exercise for each area of your
    life structure.


    # Your support network


    **Department: Health & well-being**


    | Members of support team | How these people help you |

    |---|---|

    | Doctor | Appointments and referrals |

    | Dentist | Regular appointments |

    | Gym supervisor | Guidance on exercise programme |

    | Yoga teacher | Teaching sessions |

    | Mother | Look after children while I exercise |

    | Partner | Look after children while I shop |

    | Assistant at work | Schedule my diary to allow shop time |


    Return to your guiding mantra, ‘do it, ditch it or delegate it’.


    You now have a clearer framework in which to allocate tasks as you can see which
    department they fit into; you can decide who needs to be responsible for each
    task and you can direct them on how to perform it. You are now in charge of all
    operations and for making sure all tasks are completed efficiently. You have responsibility
    for ensuring that things get done but you don’t have to do them all yourself.


    Managing and running your life in this way can be a revelation, and the more you
    can practise planning and strategic management, the easier it will become. Time
    spent in this area will save you time and energy elsewhere, so make sure you set
    aside specific slots for planning sessions regularly throughout your day. Formulate
    a fixed agenda for how your support network is running and how each person is
    progressing with their tasks. This will make it easier for you to manage and to
    update progress in all areas and ensure everyone is operating efficiently. Having
    your network in place'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'and using it efficiently enables you to stay focused on the new and exciting
    challenges that you set yourself each day.


    # *Effective ways of operating*


    The secret of getting the best results from yourself and everyone you work with
    is to be flexible in your approach. What works for you in one area might not be
    the best approach in another area. And what''s effective one day might not be
    so effective the next day if your mood or the circumstances around you have changed
    in any way. The key is to know which approach to employ at which time. Here are
    a few suggestions of approaches that are quick to employ and that work well. You
    can experiment with them and use them when appropriate.


    # **Prioritizing**


    Look carefully at the jobs on your schedule for the day or the week and give each
    a score out of ten for how important it is that you get it done. Which jobs are
    on a deadline and which would you really like to get out of the way? Which tasks
    have been hanging around for a while and which ones would make you feel fantastic
    if they were completed? Those tasks with the highest scores are the most urgent.


    Visualize yourself having completed these tasks. The very thought of this should
    make you feel excited and motivated into action. If it doesn''t, this may be a
    sign that some of the tasks aren''t really that much of a priority.


    For the tasks that are still priorities, score yourself out of ten for how much
    effort you are prepared to put into each task in order to complete it.


    | Task | Effort level |

    | --- | --- |

    | 1 |  |

    | 2 |  |

    | 3 |  |

    | 4 |  |

    | 5 |  |'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Establish what a ten out of ten effort would be and write down what needs to
    be done.


    | Task | What must be done for completion |

    |---|---|

    | 1 | |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |


    Are you prepared to do everything on this list to complete your tasks?


    When you have established what’s important, along with how much effort you are
    willing to give, you are ready to tackle your to-do list and get some results.
    Begin with the jobs that are most important and for which you are willing to invest
    the required effort. The results you obtain will be directly related to the effort
    you put in. Remember, a three out of ten for effort will lead you to a three out
    of ten result. A ten out of ten score for the effort you are prepared to put in
    will get a ten out of ten result. Decide what you are prepared to put maximum
    effort into and then get started on it. Tackling and completing your priority
    jobs will give you a great sense of satisfaction and make you feel in control
    of your day.


    # Jobs to avoid


    At all costs, avoid starting a number of things that you feel you have a low commitment
    to completing. You’ll only end up with unsatisfactory results or lots of jobs
    started but not finished.


    # Single-tasking


    If you have one job that is more important than everything else and that you are
    fully committed to completing, set aside some time to give it your full attention
    until it is done. Be realistic.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'with the time you think you need, and pick a time slot when you know you’ll
    be effective. Finish any small, quick tasks that you might find distracting and
    then mentally prepare yourself for completing the priority task. Make sure your
    physical environment supports your aims. Place yourself somewhere you won’t be
    disturbed, or explain to others around you that you need some peace and quiet
    to focus on something important for a while. Make sure you have all the resources
    you need for the task such as books, research, telephone numbers or contact details,
    reports or figures. As you reach the time appointed to begin the task, picture
    yourself carrying it out and finishing it. Imagine how you will feel when it’s
    done. Now you’re ready for the job at hand. Get started and enjoy the process
    of working through to the satisfaction of a job well done. And don’t worry about
    the things you’re not doing, you will catch up with your other tasks quickly once
    you’ve cleared your head of your most pressing priority.


    # Multi-tasking


    If you have a number of jobs that are priorities and that you want to get done
    in a given time, you need to multi-task. This is an exciting approach to employ
    and can lead to amazing results.


    Your brain does not like things to be left incomplete. This can sometimes be frustrating
    if you’re trying to relax and your unconscious mind keeps reminding you of all
    the things you have to do. In this situation, remember you have the choice of
    three different ways of attending to these matters: finish them now, appoint a
    time to attend to them later, or find another way to get them done – do them,
    ditch them or delegate them.


    The fact that your brain doesn’t like to leave issues unsettled can also be used
    to your advantage. Multi-tasking works by setting your unconscious mind a number
    of challenges. Because it doesn’t like to leave things unfinished, while you focus
    your mind on getting each job started, your unconscious mind is considering the
    best ways to complete each one.


    You can have a number of projects on the go at once and the order in which you
    return to each job will depend on the solutions that spring to mind once you begin
    the process.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Multi-tasking is a powerful way of working that some people do more naturally
    than others. The ability to work like this improves with practice and you will
    have had experience of operating in this way to one degree or another. Develop
    this skill and employ it when appropriate.


    # Multi-tasking


    Focus your mind on the number of tasks that you have to do, and the time you are
    allocating to do them. It might be that you have seven tasks to complete and a
    whole morning to complete them.


    Spend a few minutes thinking about where you want to get to with each task by
    the end of your allocated time.


    Now highlight the first step of the first task and get started on it. When the
    first step of the first task is complete, quickly move on to the first step of
    the second task. Get that one started and then move on to the first step of the
    next task. Continue in this vein until all tasks at hand are underway. Then return
    to step two of the first task.


    Once you are underway, you will find yourself flitting from task to task, perhaps
    completing more than one step at a time for some tasks or leaving some tasks for
    a little while before returning to them. This is fine. What really matters is
    that you end up exactly where you planned to end up with each task at the end
    of the allotted time.


    # Deadlining


    This is a similar approach to multi-tasking only you must allocate yourself strict
    time deadlines for the time you spend on each step of each task. It can be five,
    ten or fifteen minutes on every step but, whatever chunks of time you decide to
    operate in, you must stick to this and move on to the next task at the appointed
    time. Once you''ve spent the allotted time on each project, you return to the
    first and spend the same time again on each, in order, until they are all complete.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Deadlining works by focusing your mind on working fast. Often jobs will take
    up as much time as we give them and sometimes take longer than they really should.
    Deadlining gives you a limited time for each part of a process, and it is exciting
    to see what you can come up with in that time.


    Whether you are single-tasking, multi-tasking or deadlining, you will be using
    the combined power of your conscious and unconscious mind to achieve fantastic
    results.


    # Time management


    These are simple examples of ways in which you can manage time. Time is precious
    so be careful how you spend it and make sure you don’t let others rob you of it.


    Sticking to your guns when others are demanding your time and attention can be
    a challenge. If you feel your attention being drawn away from your main priorities,
    either by others distracting you or you distracting yourself, ask yourself the
    following questions for every request, challenge or diversion you encounter:


    +   * Does what I am about to attend to fit in with my master plan?

    +   * What are the benefits of me spending time on this issue?

    +   * What are the costs of me spending time on this issue?

    +   * Is this something I really want to spend my time on?


    If the benefits of dealing with a request, an interruption or a diversion outweigh
    the costs, then the request is worth spending time on. If, after analysing an
    opportunity, you decide that the costs outweigh the benefits, ignore it and get
    on with what you were doing.


    Your time is precious, and you need to be vigilant about where the hours in the
    day disappear to. Other people can only steal your time if you allow them to.
    Remember: ‘Have your own plan or you’ll end up being part of someone else’s plan’
    – this is very true when it comes to time management. If you don’t have a strategy
    for filling your time effectively, others will fill it for you, and probably not
    with anything that you think is particularly worthwhile or helpful to your objectives.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# ## Be flexible\n\nRemember the importance of the flexible approach. On occasions,\
    \ you will be presented with opportunities that you hadn't anticipated but that\
    \ will be beneficial to your overall plan for success. It is crucial to keep an\
    \ open mind when such opportunities arise in order that you don't discount anything\
    \ that could be useful for you. It's also crucial that a potential opportunity\
    \ doesn't turn into a hidden distraction. Here are a few questions that will help\
    \ you to decide between an opportunity and a distraction and to make a judgement\
    \ on each situation:\n\n+   - ***What are my current priorities?***  \n+     What\
    \ is currently most important to you? Are you spending enough time on these priorities?\
    \ What else are you currently spending your time on and why?\n+   - ***Do I have\
    \ room for another task or project?***  \n+     Once you have established what\
    \ your priorities are, do you have time to take on anything else and are you willing\
    \ to rearrange your priorities to accommodate new projects or requests from others?\n\
    +   - ***Precisely how much work is involved in each request?***  \n+     Don't\
    \ just say yes to someone's request without thinking about exactly what is entailed\
    \ in the request. It may sound simple enough but the situation could be quite\
    \ demanding. Agreeing to a simple request to attend a meeting could take up an\
    \ hour of your time or, if you need to prepare for the meeting, it could take\
    \ up five hours of your time. Think about the commitment involved before you say\
    \ yes or no.\n+   - ***What's in it for me?***  \n+     The situation of helping\
    \ someone else may bring its own opportunities. It's important not to dismiss\
    \ requests out of hand. There may be some exciting opportunities for you"
  merge: -1
  img_proc: true
- pgno: 71
  md: 'such as learning some new skills or getting exposure to people that can help
    your career. Always consider the true advantages of helping out – advantages for
    you as well as for the person requesting the help.


    +   * How much time do I want to spend on this project?


    If you decide you want to help out, and you''ve considered how much work could
    be involved, measure this against how much time you are willing to spend on the
    project. Think about clever solutions to achieve the advantages of the situation
    within the time you are willing to allocate.


    When you''ve addressed these issues, you can say yes or no to any request knowing
    that you are still in charge of your own time and still catering for your own
    needs.


    # Sense of purpose


    People who fail to take control of their lives often feel as though they are being
    pulled in many different directions and that their opportunities for progress
    are limited.


    # Disjointed life path


    ![](img/91cf9cd4bea9ca8a8bd8e9cf1a623cd5_71_0.png)


    Those who put themselves in the driving seat feel like they make the decisions
    on how everything in life moves forward, with a common purpose.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# A sense of purpose


    ![](img/91cf9cd4bea9ca8a8bd8e9cf1a623cd5_72_0.png)


    When you have achieved the desirable situation of being in full control of your
    life and your time, you will set about everything you do with a sense of purpose.
    You will experience renewed vigour and a new-found effectiveness. This purpose
    will be decided by your mission statement and what''s important for you to achieve.
    With it comes a liberating feeling that you are in charge, making the decisions
    that matter and pushing life along in the right direction.'
  merge: -1
