- pgno: 85
  md: '# Gathering the evidence


    If you are looking to save money, writing down everything you spend can be a dramatic
    way to see how much you can save and where you can save it.


    # What does the future hold?


    Now you have taken the first steps towards financial security, this is a great
    time to begin thinking in a more long-term way than you might be used to with
    your finances. With what you earn today, you need to consider how you want to
    live in the future, including considering how much money you''d like to save each
    month, what type of savings will suit you best. Are you saving cash for a rainy
    day in a savings account or in a tax-free saving product like an ISA (Individual
    Savings Account)? Do you have a pension plan in operation? Would you like to invest,
    perhaps in shares or property? Thinking about these things isn''t everyone''s
    cup of tea, but it''s more appealing to do it sooner when you have the options
    and the opportunity to do something about your situation, than later when your
    enthusiasm and your earning ability may be somewhat diminished.


    # Setting your financial expectations


    As you know all too well by now, what you aim for is what you will achieve. If
    you set out to simply cover your expenses, this is what you will achieve. Aim
    higher and you will achieve this and much more. As you become more affluent, you
    will need to continually raise the bar on what you want from your financial situation.
    Begin by aiming to spend less than you earn. Then start raising. Set clear objectives
    for your earnings and your savings. Create a financial buffer with an amount that
    would cover your expenses if you didn''t work for a month or two. Invest carefully
    with clear parameters on what returns you are looking for from these investments.
    Review your finances regularly and make sure that they are in the best shape possible.
    Continually update your expectations of yourself and your finances. Choose how
    much you want to keep to'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'hand, decide what level of balance you''d like to see regularly in your current
    account and by how much you want to see your savings grow each month.


    # *Put some life into money*


    Thinking about money and how you''d like to earn it, save it and spend it is an
    essential part of most people''s lives. Yet the concept of money and figures isn''t
    always enough to get you excited. This is why it is important to use your planning
    skills to see money in the context of the rest of your life and what you want
    to achieve. Your money objectives should reflect your career objectives, and you
    should be able to see clearly how achieving your money objectives will benefit
    you and enrich your life. Keeping the benefits clear in your mind will ensure
    that you are fully motivated to achieve your financial goals.


    # Put money in context


    Never view money in isolation. Always think about how it will affect and enrich
    your life and the lives of those close to you.


    # The law of positive attraction


    This law centres on your beliefs and your attitudes to money. What you believe
    here will have an impact on your prosperity, so be careful how you let your thoughts
    run. If you believe that money is out there to be had, you will have it. Update
    your financial beliefs so that they are in line with the life of wealth and abundance
    that you deserve.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # 8


    # # fantastic relationships'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'This chapter explores how you fit into the world, who you choose to have around
    you and how they affect your mood, your outlook on life, and your happiness. By
    the end of the chapter, you will understand how you can guarantee positive relationships
    whoever you are with, wherever you are, and whatever you are doing.


    We all have to deal with other people on a regular basis. This chapter will help
    you uncover the beliefs, values, mission statements and objectives of other people,
