- pgno: 84
  md: 'Your finances are no different from any other area of your life. With clear
    objectives and strong incentives, you will be in the best position to make your
    dreams a reality. Decide now how much disposable income you''d like to have each
    month.


    Current financial situation

    Income of ..... – expenditure of ..... = disposable income of .....

    Desired financial situation

    Income of ..... – expenditure of ..... = disposable income of .....


    Once you have analysed your spending with your financial diary, it''s time to
    implement some strategies that will help you keep control of it. Use the following
    version of the financial diary to highlight where you can save some money and
    how much you can save.


    Financial diary    Today''s date:


    | Time | Item | Amount spent | Economical alternative | Amount saved |

