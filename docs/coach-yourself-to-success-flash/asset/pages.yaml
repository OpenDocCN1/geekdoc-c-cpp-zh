- pgno: 95
  md: '# # Celebrating your success


    Congratulations on every single change you have made to your life so far. You
    now have a very different outlook than when you began this book and you will now
    be able to feel positivity and personal power flowing through you at all times.
    With your new skills and strategies, you will have the confidence to deal with
    every situation you come across and work towards the outcome that benefits you
    most.


    You now have the ability to take your life in any direction you want and it is
    your duty to do just that. Seek out opportunities to put the new you into action.
    Test yourself regularly to see what you are capable of. Challenge yourself to
    take some risks and never stop learning. There is no right or wrong in what you
    do as long as you continue to grow and develop every day. Be curious and take
    nothing for granted. Question everything until you understand what works for you.


    You must also celebrate your success. The efforts you make to instigate change
    will be reward in themselves as the quality of your day-to-day life continually
    improves. It is also important to formally reward yourself along the way because
    an added incentive here and there will see you through the toughest of times.
    Your rewards can be whatever you choose, ranging from giving yourself a day off
    or treating yourself to a massage to taking yourself off for a special day out
    or simply relaxing in the bath. All that matters is that you include plenty of
    rewards and incentives in your schedule, and frequently enough for you to say
    thank you to yourself for a job well done.


    > > *The moment of victory is much too short to live for that and nothing else.*

    > >

    > > — Martina Navratilova


    All that remains now is for you to look back to the objectives you set yourself
    in the introduction and see how you have performed in relation to what you wrote
    at that time.


    +   - What have you learned since the beginning of this book?

    +   - What has been your greatest achievement?'
  merge: -1
  img_proc: true
- pgno: 96
  md: '+   - What has changed?

    +   - What has been the greatest benefit to you of these changes?

    +   - What’s your next big exciting challenge?

    +   - What areas would you like to do more work on?

    +   - How will you celebrate your success so far?


    > > The biggest adventure you can ever take is to live the life of your dreams.

    > >

    > > — Oprah Winfrey


    The world and your role in it change continually. At times, you will feel ahead
    of the game. At other times you will feel discomfort and ready for further development.
    Embrace all parts of the process and enjoy them equally. Revel in your triumphs
    and acknowledge any discomfort as a sign that some work needs to be done. Your
    new skills will enable you to pinpoint where to focus your attentions and put
    in the effort to move forward. Life is full of ups and downs and is an ongoing
    process of growth and renewal. Sometimes you will be in complete control, and
    at other times you may need to minimize your risk and then take a leap of faith.
    Stay focused on what you want to achieve and maintain faith in yourself and you
    will be handsomely rewarded for your efforts.


    Use this book to help you through the challenges of life. Revisit the exercises
    whenever you feel you could benefit from new perspectives and insights with issues
    you are facing. The work you do will ensure you succeed, so remember to enjoy
    and appreciate your development along the way.


    All the very best for the future.


    > > Live all you can—It’s a mistake not to. It doesn’t so much matter what you
    do in particular, so long as you have your life. If you haven’t had that, what
    have you had?

    > >

    > > — Henry James'
