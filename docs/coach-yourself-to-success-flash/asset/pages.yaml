- pgno: 41
  md: '# # 4 planning your life'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'There is a phrase that says it is important to ‘have your own plan or you’ll
    end up as part of someone else’s plan’. Having taken the time and trouble to investigate
    your life and the way you operate, the next step is to use the information learned
    so far to create your long-term future. You now know the power of focusing on
    what you want in life and you have felt the benefits of taking active steps towards
    living the life you deserve. The fun really begins now as you decide how you are
    going to apply the new you for maximum results in the future.


    There is only one way to guarantee that you minimize any possible frustration
    in life, and that is to dictate your own plan for the way you want things to turn
    out. Creating your own agenda by setting goals or objectives will give you a sense
    of purpose and bring new meaning to everything you do. Chapter 4 will help you
    formulate your plan to guarantee quick, and consistently positive, results.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# ### Get excited


    Choose now not to be normal but to live a life that is extraordinary. Creating
    a future that excites you is of vital importance. If your future doesn''t excite
    you, then why go to all the time and trouble of making things happen? Life is
    always going to be busy and you will always be challenged so make sure that you
    choose your challenges and make them the most inspiring you can imagine. Don''t
    be satisfied with achieving the small stuff. Use all your achievements as a platform
    to let your mind wander and think big. The bigger the dream you create, the better
    the reality you will live.


    The sooner you decide on what the future holds for you, the sooner you can begin
    working on all the circumstances that will lead to this future. By deciding when
    you want to achieve specific objectives, you will speed your progress along the
    way. Knowing where you are headed enables you to tune into all the opportunities
    that you come across on a daily basis that will help you to get there quickly.
    A clear sense of purpose will act in conjunction with your mission statement,
    values and beliefs to form your strategic decision-making process.


    Focusing on the immediate future and the challenges of implementing change can
    create a sticking point to progress. Thinking of the results you will achieve
    and the benefits these will bring is an instant motivator and will overcome any
    inertia you may experience. Making changes to your life can be surprisingly simple
    when you establish the benefits these changes will bring you.


    A common objection to setting new objectives and implementing change is that people
    perceive that they are stuck in their comfort zone. If this is the case, you should
    consider setting objectives that lead you to a zone that''s even more comfortable
    than where you are now. Just because you are comfortable now doesn''t mean that
    you always will be. Don''t take chances, instead design your most comfortable
    future. Taking the time to outline how good things could be in the future often
    leads people to realize that their current comfort zone isn''t actually that comfortable
    after all compared to what they could create with a bit of planning.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # Setting your objectives


    Everyone has a different take on what constitutes short-, medium- and long-term
    planning, so for the following exercise you may want to adjust the time deadlines
    a little to suit the planning schedule that works best for you. Generally, short
    term should mean two to eight weeks, medium term six to twelve months and long
    term eighteen months and beyond.


    # ## Planner


    Setting your objectives - what do you most want to achieve in life?


    Today''s date:


    Work and career


    +   * 4-week objectives

    +   * 6-month objectives

    +   * 18-month objectives


    Health, fitness, food, well-being


    +   * 4-week objectives

    +   * 6-month objectives

    +   * 18-month objectives


    Hobbies, social, fun, relaxation


    +   * 4-week objectives

    +   * 6-month objectives

    +   * 18-month objectives


    Partner, family and friends


    +   * 4-week objectives

    +   * 6-month objectives

    +   * 18-month objectives


    Finances


    +   * 4-week objectives

    +   * 6-month objectives

    +   * 18-month objectives


    ![](img/91cf9cd4bea9ca8a8bd8e9cf1a623cd5_44_0.png)'
