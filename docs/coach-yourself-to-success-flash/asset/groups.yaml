    # Good health


    Thankfully, the majority of people in the Western world benefit from relatively
    good health and are not suffering from or limited by any major disease or illness.
    Usually, perceptions of health revolve around how you feel on a day-to-day basis.
    Generally, provided you are able to do everything you need to do, you are happy
    enough and prepared to put up with the stresses and strains of modern life. You
    keep busy each day working, looking after others, grabbing some food when you
    can, taking care of chores and ‘the stuff of life’, socializing, and looking after
    yourself if you can fit it in. Hopefully you arrive at the end of the day with
    a little bit of time to unwind and relax before getting off to bed to rest before
    starting the routine all over again the next day.


    In these circumstances, the fact that there are opportunities to live another
    way is often overlooked. These days, taking care of oneself is sometimes seen
    as an added extra in life – something that you can do if you have time, but really
    there are other more important things to be getting on with.


    Now is the time to look at this notion from a different perspective – a perspective
    that puts your health and well-being at the top of the list of priorities rather
    than at the bottom. After all, without your health, nothing else in life will
    be possible, and certainly much of what you do will be made more difficult.


    Taking care of yourself gives you energy, confidence and a positive outlook. You
    are better able to deal with the challenges of life and in a far better position
    to enjoy the things you do. Take this opportunity to say goodbye to thinking of
    healthy living as being in conflict with your current life and as something that
    will get in the way of your effectiveness, that is, just another thing to add
    to the list. Instead, see it as something in harmony with the rest of life, a
    way of nourishing yourself to be better at everything you do, a means of being
    able to put more into life and of getting more out of it – to be happier and more
    fulfilled on a daily basis.


    In a world obsessed with physical appearance, not a day will go by without a newspaper,
    magazine or television programme'
