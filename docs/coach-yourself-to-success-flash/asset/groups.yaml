    the world differ, you may disagree. If your views of the world differ drastically,
    then you may disagree dramatically.


    As you take up vantage points progressively further away from the present moment
    viewed through your own eyes, you will find that the emotion of the moment is
    reduced and you increase your perspective of how what you are doing in the moment
    fits into the wider world. Changing perspectives helps you to put things in context
    and make judgements with a slightly more objective mindset. This can be an invaluable
    skill when making important decisions and particularly when interacting with others.
    Employing this technique will help you to remove tension from heated discussions.
    Forget for a moment how you see the situation and consider how the other person
    is viewing it. Think about how a third party would observe what''s going on. What
    would someone who just entered the room to this scene think about what''s going
    on? Whether it be an argument with a loved one, a disagreement with a friend or
    a debate with a work colleague, altering the viewpoint from which you see the
    situation will enable you to see the bigger picture, assess what needs doing from
    a fresh angle, and steer the moment to a more positive conclusion.


    Changing the position from which you see a situation is a very effective way of
    putting yourself into the shoes of others and understanding where they may be
    coming from with their point of view. It''s a powerful negotiating technique and
    a great way for you to perfect your argument in any situation. It''s also a method
    of diffusing emotion. If you continually inhabit your own viewpoint – first position
    – you can become overly concerned with how each situation affects you, and not
    always in a good way. Imagining how others will see you, and how a third party
    would view the overall situation, will enable you to put yourself in context and
    consider whether the concerns that you have are in proportion to the situation
    and to your life as a whole. Experiment with this technique to rise above your
    immediate situation and get a new perspective on what is happening to you at any
    given time.'
