    # ### Get excited


    Choose now not to be normal but to live a life that is extraordinary. Creating
    a future that excites you is of vital importance. If your future doesn''t excite
    you, then why go to all the time and trouble of making things happen? Life is
    always going to be busy and you will always be challenged so make sure that you
    choose your challenges and make them the most inspiring you can imagine. Don''t
    be satisfied with achieving the small stuff. Use all your achievements as a platform
    to let your mind wander and think big. The bigger the dream you create, the better
    the reality you will live.


    The sooner you decide on what the future holds for you, the sooner you can begin
    working on all the circumstances that will lead to this future. By deciding when
    you want to achieve specific objectives, you will speed your progress along the
    way. Knowing where you are headed enables you to tune into all the opportunities
    that you come across on a daily basis that will help you to get there quickly.
    A clear sense of purpose will act in conjunction with your mission statement,
    values and beliefs to form your strategic decision-making process.


    Focusing on the immediate future and the challenges of implementing change can
    create a sticking point to progress. Thinking of the results you will achieve
    and the benefits these will bring is an instant motivator and will overcome any
    inertia you may experience. Making changes to your life can be surprisingly simple
    when you establish the benefits these changes will bring you.


    A common objection to setting new objectives and implementing change is that people
    perceive that they are stuck in their comfort zone. If this is the case, you should
