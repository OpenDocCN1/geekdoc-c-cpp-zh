    Welcome to the beginning of your new life! By picking up this book you already
    know that you want to take charge of your destiny, and you are now on the way
    to learning and understanding everything you need to live life to the full.


    # ## What is life coaching?


    Life coaching is a series of processes and a variety of techniques that can be
    applied to your current situation to create a happier and more fulfilling way
    of being. It is about looking at your life in a different way and it is a personal
    process that works in different ways for different people. The common theme in
    all coaching relationships is that by following the processes and applying the
    techniques, you will evolve and reach a better place than the one where you began.
    Whatever life is like for you now, you can use this book and the techniques within
    it to make it even better.


    Coaching is an ongoing process, and it would be a brave person who claimed to
    have ‘mastered’ the art of life. One thing you can always guarantee is that your
    life is ever-changing, and you must be alert to how you keep up with this change
    and, ideally, stay one step ahead of the game. You are learning all the time and
    constantly evolving from one task, situation or role in life to another. What
    matters is that you equip yourself properly to evolve in the way that suits you
    best and keeps you content. This book is designed to help you do just that.


