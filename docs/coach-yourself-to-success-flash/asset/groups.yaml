    # The law of positive attraction


    This law centres on your beliefs and your attitudes to money. What you believe
    here will have an impact on your prosperity, so be careful how you let your thoughts
    run. If you believe that money is out there to be had, you will have it. Update
    your financial beliefs so that they are in line with the life of wealth and abundance
