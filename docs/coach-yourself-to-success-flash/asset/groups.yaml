    # ## Switching the balance


    When you are absolutely clear about what makes some relationships positive for
    you and others negative, it becomes easier to deal with the negatives. If you
    take the time to analyse the beliefs, values, needs and priorities of other people,
    you will understand their motivation for their behaviour. Whether you agree with
    their view of the world or not, the more you understand it and understand how
    it differs from your view of the world, the easier it will be for you to make
    a decision on whether you simply don''t want to associate with this person any
    longer, whether you''d like to seek out the things you do have in common and confine
    the relationship to these areas, or whether you''d like to embrace the differences
    and create a relationship in spite of them. In many cases, opposites attract and
    can lead to a lasting and close relationship. Being aware of what you have in
    common with others, or what you don''t have in common with them, at the earliest
    possible stage will ensure that your relationships are on the right footing from
    the outset.


    # ## Dealing with difficult people


    So, there are some relationships that require compromise and careful management
    of your expectations to allow them to run smoothly. Other relationships may be
    more complex, and there will be people in your life whom you simply don''t see
    eye to eye with. You might not share their beliefs or values or priorities or
    objectives but, for one reason or another, you need to get along with them. For
    these relationships, there is a coaching technique that you can employ to make
    sure **that you get** the best results for all concerned.


    In any given circumstances in your life, you look out at the world through your
    eyes and listen with your ears, and what you see and hear and what you feel in
    a situation will be filtered and judged by your experience and by your beliefs
    and values. The same is true of those you are dealing with and, if your respective
    views of'
