    them? Thinking about someone else dealing with a situation instantly takes the
    heat out of the moment for you and enables you to take a step back and see things
    with a little more clarity. By imagining what others would do, it allows you insight
    beyond what you might come up with by yourself. Use this insight in conjunction
    with your innermost feelings on what is right for you at the time and you will
    be in a great position to make the right decisions.


    You’re never on your own in any circumstances if you can generate an army of advisers
    in your head. Whether this advice comes from your own previous successes or your
