    # ## *Healthy living and coaching*


    Some people love being healthy, others hate it. So what makes the difference between
    the two viewpoints? And how can everyone come to enjoy exercise and healthy food?


    Clearly there is more to healthy living than just taking exercise and eating well.
    Living a healthier life can change your perspective forever and, because the results
    of the exercise you do and the food you eat have such a crucial bearing on how
    you look and how you feel, it''s not an area you can afford to ignore or take
    lightly. This is why healthy living is so important to many people, and this is
    also why it is a useful process to work with your health and fitness objectives
    to practise the techniques you''ve been learning in this book.


    # ### Exercise and prioritizing


    Rate your satisfaction with how healthy your life is at the moment and decide
    how important it is that you do something to change the situation. Living a healthier
    life has to be a high priority for you in order to create the motivation to make
    the necessary changes.


    # ### Exercise and goal-setting/planning


    You must be clear and explicit about where you are now with your fitness in contrast
    to where you would like to be. Establish what changes in your approach and your
    behaviour would bridge the gap between where you are now and where you want to
    be.'
