  - '[PAGE 66]


    Establish what a ten out of ten effort would be and write down what needs to be
    done.


    | Task | What must be done for completion |

    |---|---|

    | 1 | |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |


    Are you prepared to do everything on this list to complete your tasks?


    When you have established what’s important, along with how much effort you are
    willing to give, you are ready to tackle your to-do list and get some results.
    Begin with the jobs that are most important and for which you are willing to invest
    the required effort. The results you obtain will be directly related to the effort
    you put in. Remember, a three out of ten for effort will lead you to a three out
    of ten result. A ten out of ten score for the effort you are prepared to put in
    will get a ten out of ten result. Decide what you are prepared to put maximum
    effort into and then get started on it. Tackling and completing your priority
    jobs will give you a great sense of satisfaction and make you feel in control
    of your day.


    # Jobs to avoid


    At all costs, avoid starting a number of things that you feel you have a low commitment
    to completing. You’ll only end up with unsatisfactory results or lots of jobs
    started but not finished.


    # Single-tasking


    If you have one job that is more important than everything else and that you are
    fully committed to completing, set aside some time to give it your full attention
    until it is done. Be realistic.'
  - '[PAGE 67]


    with the time you think you need, and pick a time slot when you know you’ll be
    effective. Finish any small, quick tasks that you might find distracting and then
    mentally prepare yourself for completing the priority task. Make sure your physical
    environment supports your aims. Place yourself somewhere you won’t be disturbed,
    or explain to others around you that you need some peace and quiet to focus on
    something important for a while. Make sure you have all the resources you need
    for the task such as books, research, telephone numbers or contact details, reports
    or figures. As you reach the time appointed to begin the task, picture yourself
    carrying it out and finishing it. Imagine how you will feel when it’s done. Now
    you’re ready for the job at hand. Get started and enjoy the process of working
    through to the satisfaction of a job well done. And don’t worry about the things
    you’re not doing, you will catch up with your other tasks quickly once you’ve
    cleared your head of your most pressing priority.


    # Multi-tasking


    If you have a number of jobs that are priorities and that you want to get done
    in a given time, you need to multi-task. This is an exciting approach to employ
    and can lead to amazing results.


    Your brain does not like things to be left incomplete. This can sometimes be frustrating
    if you’re trying to relax and your unconscious mind keeps reminding you of all
    the things you have to do. In this situation, remember you have the choice of
    three different ways of attending to these matters: finish them now, appoint a
    time to attend to them later, or find another way to get them done – do them,
    ditch them or delegate them.


    The fact that your brain doesn’t like to leave issues unsettled can also be used
    to your advantage. Multi-tasking works by setting your unconscious mind a number
    of challenges. Because it doesn’t like to leave things unfinished, while you focus
    your mind on getting each job started, your unconscious mind is considering the
    best ways to complete each one.


    You can have a number of projects on the go at once and the order in which you
    return to each job will depend on the solutions that spring to mind once you begin
    the process.'
  - '[PAGE 68]


    Multi-tasking is a powerful way of working that some people do more naturally
    than others. The ability to work like this improves with practice and you will
    have had experience of operating in this way to one degree or another. Develop
    this skill and employ it when appropriate.


    # Multi-tasking


    Focus your mind on the number of tasks that you have to do, and the time you are
    allocating to do them. It might be that you have seven tasks to complete and a
    whole morning to complete them.


    Spend a few minutes thinking about where you want to get to with each task by
    the end of your allocated time.


    Now highlight the first step of the first task and get started on it. When the
    first step of the first task is complete, quickly move on to the first step of
    the second task. Get that one started and then move on to the first step of the
    next task. Continue in this vein until all tasks at hand are underway. Then return
    to step two of the first task.


    Once you are underway, you will find yourself flitting from task to task, perhaps
    completing more than one step at a time for some tasks or leaving some tasks for
    a little while before returning to them. This is fine. What really matters is
    that you end up exactly where you planned to end up with each task at the end
    of the allotted time.


    # Deadlining


    This is a similar approach to multi-tasking only you must allocate yourself strict
    time deadlines for the time you spend on each step of each task. It can be five,
    ten or fifteen minutes on every step but, whatever chunks of time you decide to
    operate in, you must stick to this and move on to the next task at the appointed
    time. Once you''ve spent the allotted time on each project, you return to the
    first and spend the same time again on each, in order, until they are all complete.'
  - '[PAGE 69]


    Deadlining works by focusing your mind on working fast. Often jobs will take up
    as much time as we give them and sometimes take longer than they really should.
    Deadlining gives you a limited time for each part of a process, and it is exciting
    to see what you can come up with in that time.


    Whether you are single-tasking, multi-tasking or deadlining, you will be using
    the combined power of your conscious and unconscious mind to achieve fantastic
    results.


    # Time management


    These are simple examples of ways in which you can manage time. Time is precious
    so be careful how you spend it and make sure you don’t let others rob you of it.


    Sticking to your guns when others are demanding your time and attention can be
    a challenge. If you feel your attention being drawn away from your main priorities,
    either by others distracting you or you distracting yourself, ask yourself the
    following questions for every request, challenge or diversion you encounter:


    +   * Does what I am about to attend to fit in with my master plan?

    +   * What are the benefits of me spending time on this issue?

    +   * What are the costs of me spending time on this issue?

    +   * Is this something I really want to spend my time on?


    If the benefits of dealing with a request, an interruption or a diversion outweigh
    the costs, then the request is worth spending time on. If, after analysing an
    opportunity, you decide that the costs outweigh the benefits, ignore it and get
    on with what you were doing.


    Your time is precious, and you need to be vigilant about where the hours in the
    day disappear to. Other people can only steal your time if you allow them to.
    Remember: ‘Have your own plan or you’ll end up being part of someone else’s plan’
    – this is very true when it comes to time management. If you don’t have a strategy
    for filling your time effectively, others will fill it for you, and probably not
    with anything that you think is particularly worthwhile or helpful to your objectives.'
  - "[PAGE 70]\n\n# ## Be flexible\n\nRemember the importance of the flexible approach.\
    \ On occasions, you will be presented with opportunities that you hadn't anticipated\
    \ but that will be beneficial to your overall plan for success. It is crucial\
    \ to keep an open mind when such opportunities arise in order that you don't discount\
    \ anything that could be useful for you. It's also crucial that a potential opportunity\
    \ doesn't turn into a hidden distraction. Here are a few questions that will help\
    \ you to decide between an opportunity and a distraction and to make a judgement\
    \ on each situation:\n\n+   - ***What are my current priorities?***  \n+     What\
    \ is currently most important to you? Are you spending enough time on these priorities?\
    \ What else are you currently spending your time on and why?\n+   - ***Do I have\
    \ room for another task or project?***  \n+     Once you have established what\
    \ your priorities are, do you have time to take on anything else and are you willing\
    \ to rearrange your priorities to accommodate new projects or requests from others?\n\
    +   - ***Precisely how much work is involved in each request?***  \n+     Don't\
    \ just say yes to someone's request without thinking about exactly what is entailed\
    \ in the request. It may sound simple enough but the situation could be quite\
    \ demanding. Agreeing to a simple request to attend a meeting could take up an\
    \ hour of your time or, if you need to prepare for the meeting, it could take\
    \ up five hours of your time. Think about the commitment involved before you say\
    \ yes or no.\n+   - ***What's in it for me?***  \n+     The situation of helping\
    \ someone else may bring its own opportunities. It's important not to dismiss\
    \ requests out of hand. There may be some exciting opportunities for you"
