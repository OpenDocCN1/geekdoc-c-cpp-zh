    # ## Do it, ditch it or delegate it


    The world is moving fast, and as you live through each day, new challenges, tasks
    and issues will crop up. These will include opportunities to increase the pace
    of your progress, and useful new information and knowledge that will support your
    aims and objectives. There will also be issues that merely take up your valuable
    time, time that would be more usefully spent elsewhere. Now that you are clear
    on your personal objectives, following the mantra of ''do it, ditch it or delegate
    it'' at all times will guarantee that you keep your focus where it needs to be.
    It will help you to decide quickly which opportunities are worth spending time
    and effort on. If something is relevant and supports you in your aims, do it.
    If something crops up that doesn''t help you in your aims or is not relevant to
    your situation, remove it from your world. Things that are relevant to your aims
    and that can be managed or organized by someone else should be delegated, leaving
    you free to focus on your most vital priorities that only you can achieve.


    # ## Do it


    There is a little flexibility here and this notion can be expanded slightly to
    ''either do it right now, or make a plan of when you will definitely do it later
    in the day or the week''. This can apply to every single task that comes your
    way: opening the post, replying to emails, screening or answering phone calls,
    planning meetings or booking holidays. You must also qualify the ''do it'', making
    it ''do it right and do it properly''. Attending to tasks half-heartedly only
    means you''ll have to spend more time on them later on, and if you don''t have
    time to do them properly now, what makes you think you''ll have time to redo them
    later? If you can''t do it properly right now, pick a time later on when you will
    be able to.


    This part of the process is great for helping you to clarify your priorities.
    If, for some reason, you don''t manage to attend to the task immediately or at
    the appointed time, you now have to consider how much of a priority the task really
    is. Initially it may have appeared important but if it isn''t enough of a priority
    to prompt you to action, perhaps it can be ditched or delegated.'
