  - '[PAGE 29]


    The first part of the answer to the question “Why did I never do this before?”
    is that in many cases people simply don’t take the time to look closely enough
    at what needs to be done and what the first steps on the way to implementing change
    need to be.


    The second, and perhaps more crucial, part of the answer is that possibly there
    haven’t been compelling enough reasons to take the time to plan and make the necessary
    changes. If the idea of making changes to your life doesn’t excite you enough,
    chances are that the upside of making these changes isn’t yet big enough. Now
    that you know the areas to address and the actions to take, all you need is a
    good enough reason to put the changes into practice. Change for the sake of change
    is difficult to sustain, and making changes that someone else thinks would be
    good for you is an uphill struggle because your heart simply won’t be in the task.
    To make successful changes and guarantee great results, you need to know what
    matters to you and why these things really matter. To help you clarify your thoughts
    in this area, take a look at the following questions:


    # Uncovering personal motivation 1 – what do you really want?


    +   * If you could have anything in life, what would you have?

    +   * If you were living your ideal life, what would you be doing

    +     * every day?

    +     * every week?

    +     * every month?

    +     * every year?'
  - '[PAGE 30]


    +   - What does success mean to you? Not to society or to your friends, family
    or those around you, but what does it mean to you? What would be your greatest
    success in life?

    +   - What single thing would make you truly happy?

    +   - If you were to live your life again, knowing what you know now, what would
    you do differently?


    Too many times people get tied up doing what they think they ought to do or what
    their family or friends think they should be doing. They often get drawn into
    doing what they think society expects of them rather than focusing on what they
    would really like to be doing. The important thing for you to pay attention to
    right now is what you want and why you want these things.


    # What drives you?


    Now you have some ideas of what you really want in life, it is important to pinpoint
    why you want these things and how you can best motivate yourself to achieve them.
    To help you do this, you must establish what currently motivates you, what drives
    you to success, and what gets you out of bed each day. What are your guiding lights,
    your mantras, the thoughts and dreams that flow through your head creating your
    personal choices and sustaining your mission in life?


    > > The ones who want to achieve win championships motivate themselves.

    > >

    > > — Mike Ditka, American football player and coach'
  - '[PAGE 31]


    Everyone is motivated by different factors. Why do you do the things you do? What
    lies beneath your thoughts, your behaviour, your actions and your relationships?


    For the purpose of the next exercise, take a look back at your list of the things
    you enjoy doing from Chapter 1 (page 6) and answer the following questions:


    # ### Uncovering personal motivation 2 – why you want what you want?


    +   * Why do I enjoy doing these things?

    +   * What does doing these things do for me or get for me?

    +   * How does doing these things enhance my life?

    +   * What''s really important about doing these things in my life?

    +   * How would I feel if I couldn''t do these things in my life?


    When you''ve answered the questions, you will have the information you need to
    put together a clear statement of why you do what you do. This statement can then
    be used to make decisions on what is important to you, what you will choose to
    do, and what you will choose not to do. This is an important step in living in
    a way that is completely in line with what you value most in life.


    When you''ve identified the common themes in your answers, you are in a position
    to say yes to all the opportunities that are in keeping with these themes. Things
    that crop up in your life that are in conflict with what makes you happy should
    be treated with caution. Either you must seek to eliminate these incidents from
    your life or look to turn them to your advantage. Every time you'
  - '[PAGE 32]


    come across one of these situations you must ask yourself, ‘In this situation,
    where are the opportunities for me to live my life according to what matters most
    to me?’


    Your own mission statement will help you to stay on track with what matters to
    you in life. Look back through your answers to the questions on uncovering personal
    motivation in the previous section, and summarize the key points in the form of
    your mission statement.


    # ### My mission statement


    |  |

    |---|

    |  |


    # ## How to make sure you live by your mission statement every day


    Keep your mission statement close to hand at all times. Either commit it to memory
    and repeat it regularly, or write it down and make sure that you read it as often
    as you can. You can put as much detail as you like into your mission statement,
    and it will evolve over time. Keep it concise because living by a mission statement
    that is short and to the point will simplify every decision you make.


    # ## The values of a mission statement


    A mission statement works because it is a short summary of what you value in life
    and what matters to you. Examples of core values that you may hold dear are honesty,
    integrity, generosity and kindness. Everyone has a value system, and being aware
    of your core values is a sure-fire way to guarantee that you act in accordance
    with them at all times. Knowing your core values explains how you feel in certain
    situations. If what you do is in keeping with your value system, you will feel
    content. If something'
  - '[PAGE 33]


    goes against your values, you will feel uncomfortable. If one of your key values
    is honesty and someone lies to you or tries to persuade you to lie to someone
    else, it’s unlikely that you will go along with them. If you value being thorough
    and your boss asks you to send out a report you’ve been working on before you
    feel it is ready, you may resist this request.


    If you feel uncomfortable in any situation, it’s unlikely to be an irrational
    feeling and more likely to be a case of your values being challenged. Knowing
    this is what’s happening helps you to understand your discomfort.


    If someone challenges your core values to an extent that you feel is unacceptable,
    and you feel that to agree to a situation would lead you to too much compromise,
    then you have a decision to make. What can you do that will turn the situation
    around so that your values are uncompromised and you can live by your mission
    statement? Here, your mission statement comes into its own because only when you
    have ensured that each situation allows you to live by your mission statement
    will you be able to proceed without reservation. Being absolutely clear on your
    current mission statement will ensure that you never compromise your core values.


    The final question in the personal motivation 2 sequence, ‘How would I feel if
    I couldn’t do the things in my life?’ acts as a strong call to action. People
    often live without enough of what makes them happy for too long, but if you consider
    living without these things forever you will see the situation differently. If
    you’re not prepared to get more of the things you enjoy into your life right now,
    when will you be? Beware the consequences of waiting until tomorrow to get started
    as tomorrow may never arrive. Make the choice – the life you want to live begins
    today, not tomorrow.


    # The power of beliefs


    What you believe determines how you behave, what you say and how you judge other
    people. It also determines the results you get in everything you do. If you believe
    that life is'
  - '[PAGE 34]


    always going to be a struggle, it always will be. If you believe that relationships
    are hard work, chances are that every relationship you have will not be without
    problems.


    # Forming beliefs


    You will have heard the phrase ''Seeing is believing'', which suggests that as
    soon as you have experienced something, you can believe it to be true. For example,
    if you witness an elderly man merrily driving along at 30 miles (48 km) per hour
    in a 60 mile (96 km) per hour zone with his hat on in the car, this might lead
    you to the belief that all people of a certain age who wear hats while driving
    are slow or bad drivers and a nuisance on the roads.


    # What do you believe in?


    Make a list of things that you believe to be true in life. Examples of beliefs
    can be general: ''I believe the sun will rise in the morning'', ''I believe that
    travel broadens the mind''; or they can be more personal: ''I believe that it
    is important to be in control'', ''I believe it''s important to practise what
    you preach'', or ''I believe that one must always lead by example''.


    Highlight five of your own beliefs:


    +   1 I believe...

    +   2 I believe...

    +   3 I believe...

    +   4 I believe...

    +   5 I believe...


    > Seeing is not always believing.


    Martin Luther King, Jr'
