  mdcn: "\n目标，并且你会迅速高效地抓住这些机会。随着你在人生进程中不断积累势头，你会不断寻找方法，让自己前进得越来越快。你体验到的成功感会让人上瘾，你会想要尽可能频繁地体验它们。\n\
    \n一路走来，从自己的经历中吸取教训，是你成长中至关重要的一部分。你还可以运用其他技巧，来加速迈向理想生活的进程。\n\n对于你着手去实现的大多数事情，极有可能已经有别人完成了一部分工作，并为你铺好了路。这并不是说你的目标没有独创性，而只是说，你关于如何创造自己人生的想法，会从这样或那样的外部来源中演变而来。很可能，你了解到他人在自己人生中取得的成就，这激励你渴望为自己获得类似的结果。因此，你可能不是第一个追求某些特定目标的人，但这些目标对你和你的生活而言无疑是独创的。\n\
    \n别人已经为你铺好路，这是个好消息。现在你有条件去审视他们是如何做到他们所做的事情，效仿他们的成功，并迅速学会那些他们可能花了数月甚至数年才掌握的经验。你不需要担心自己是否会取得成功，或者将如何取得这种成功。你只需要关心找到正确的人（一个人或一些人），去复制他们的成功，然后开始行动。\n\
    \n## 选择榜样\n\n现在花点时间想一想，你就会想起某个人，或者也许是一群人，他们与你有共同的理想，并努力按照这些理想生活。他们可能是与你亲近的人，比如家人、朋友或同事，也可能是你不太了解的人，或者只是你见过几次、却给你留下印象的人。又或者，你能想到某个公众人物，你欣赏他们，因为他们的思考和行事方式与你相同，或者正是你希望拥有的方式。\n\
    \n通过更仔细地审视你欣赏这些人的究竟是什么，并分析他们的行为方式，你可以以他们为榜样学习，并将他们积极行为中的一些方面融入自己的生活。\n\n人生中有榜样对你的成功至关重要。如果你没有积极的榜样可以效仿，就很难确切知道该如何行动，尤其是在走出舒适区时。追随你欣赏之人的脚步，确实能帮助你更快地朝着目标前进。你年轻时可能有过榜样和英雄，但在人生的某个阶段，你认定自己不再需要他们，靠自己也没问题。\n\
    \n追随他人的脚步是快速通往成功的一种简单方法。这是每个人从很小的时候起就会本能去做的事：例如，当你还是个婴儿时，看到大人走路，那看起来是一种有趣的移动方式，肯定比爬行更高效，于是你模仿他们，缓慢而稳定地练习，直到掌握这门本领。\n\
    \n学走路是一个很好的例子，说明人在年幼时如何学习，也清楚地印证了前面提到的另一个观点：没有失败，只有反馈。学走路的孩子会摔倒数百次。即使她可能伤到自己，她也会继续练习，直到掌握眼前的任务。如果学走路的孩子在第一次摔倒后就放弃，并认为自己失败了，他们的人生将会截然不同。但他们不会这样。他们坚持下来，是因为有一个非常明确的目标——他们知道走路是什么样子，而且在实现之前绝不放弃——他们根本没有“无法让这个目标成为现实”的概念。他们知道自己迟早能学会走路，所以一直坚持练习，直到能走为止。他们心中毫不怀疑自己会成功。他们全心全意地致力于实现自己的目标。\n\
    \n## 做自己的榜样\n\n如果你能在余生中驾驭这种一心一意的专注和投入，你就会势不可挡，不是吗？好吧，你曾经拥有过它，所以它很可能仍然存在于你内心的某个地方。现在花点时间，列出最近你完全专注于一个目标、不达目的不罢休的三个例子。可以选择任何事，从完成一个工作任务到完成一项体育挑战——甚至是完成购物或家务。\n\
    \n### 我最近完全专注且高效的三个例子\n\n- 1.\n- 2.\n- 3.\n\n既然你有证据表明自己能够达到这种状态，那么需要什么条件才能让这种状态发生呢？\n\
    \n### 围绕我最近完全专注且高效例子的相关情况\n\n这些情况可能包括：休息充分、拥有足够时间、准备充分、目标明确以及正确的激励。\n\n- 1.\n\
    - 2.\n- 3.\n\n## 寻找积极面\n\n你通过完成这些练习所获得的认识，对于营造适合成功的正确环境非常宝贵。列出你成功时的具体例子，有助于你积累一系列证据，证明当你全身心投入一项任务时，你有能力取得巨大成就。收集关于你自己成功策略和情况条件的证据，也意味着你能非常有效地准确判断出何时情况并不完全有利于你。然后，你可以在必要时迅速采取行动改变局面，以确保你的目标得到充分支持，并处于最有利的位置以取得最积极的结果。\n\
    \n## 效仿自己的成功\n\n在这个世界上，人们似乎有一种非常严厉地评判自己的倾向。如果生活中的某件事没有按计划进行，就可能引发一连串负面想法，使他们得出结论：自己无能、低效、无法胜任。如果你发现自己陷入这个陷阱，就立刻想一想自己擅长什么，以此打破思维循环。你擅长很多事情，但在追求完美时常常会忽略这些。回答上一活动中的问题，并利用你的答案，在尚未奏效的领域规划新的方法。如果你有一些策略，你知道它们在你生活的特定领域对你有效，就使用它们。没有理由认为它们在其他领域也行不通。\n\
    \n## 效仿他人的成功\n\n效仿自己的成功是一种巧妙的方法，可以快速启动你生活中任何方面的进展，而且这可能是一种非常富有成效的技巧。此外，没有必要止步于此。世界上某个地方总会有人已经实现了你想实现的一切。你只需要找到他们。如果这些人就在你的直接交往圈子里，就和他们交谈，了解他们是如何做到的。不要犹豫，尽管盘问他们成功的秘诀。人们通常会因为被视为灵感来源而感到受宠若惊，并且通常很乐意回答关于自己和自身成就的问题。倾听他们所说的话，并将适用于你自己情况的内容付诸实践。\n\
    \n如果你选择的榜样不在你的直接圈子里，就设法研究他们的成就。弄清楚是否有任何方法能让你更接近他们，以了解更多。在杂志和报纸上阅读关于他们的内容，或者在网上自己研究他们的性格和做事方式。\n\
    \n为生活的不同领域准备若干榜样，并选定几个你认为已经过上你向往生活的人，这是个好主意。吸引你的可能是他们的雄心、生活方式、个性、自信或整体风度。仔细思考他们拥有什么、而你又希望在自己的生活中拥有更多，并准确找出如何让它实现。\n\
    \n- 列出五个你愿意作为榜样的人，并记下你欣赏并向往的他们的性格或生活之处。\n  - **榜样 1**\n    这个人的什么特质激励了我？\n  -\
