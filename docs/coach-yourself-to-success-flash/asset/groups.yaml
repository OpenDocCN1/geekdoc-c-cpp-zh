  mdcn: "\n## 3 明确你人生中真正想要什么\n\n对于“为什么我以前从未这样做过？”这个问题，答案的第一部分是：在许多情况下，人们根本没有花时间仔细审视需要做什么，以及实施改变道路上的第一步应该是什么。\n\
    \n答案的第二部分，或许也是更关键的部分是：可能一直都没有足够有说服力的理由，让你花时间去规划并做出必要的改变。如果改变生活的想法不能让你足够兴奋，那么这些改变带来的好处很可能还不够大。既然你已经知道要处理哪些领域、要采取哪些行动，你需要的只是一个足够好的理由，把改变付诸实践。为改变而改变很难持续，而去做别人认为对你有利的改变则是一场艰苦的斗争，因为你的心根本不在这件事上。要想成功改变并保证取得好结果，你需要知道什么对你重要，以及为什么这些事情真正重要。为了帮助你理清这方面的想法，请看以下问题：\n\
    \n### 揭示个人动机 1——你真正想要什么？\n\n- 如果你在人生中可以得到任何东西，你会想要什么？\n- 如果你过着理想的生活，你会做什么？\n \
    \   - 每天？\n    - 每周？\n    - 每月？\n    - 每年？\n- 成功对你意味着什么？不是对社会、你的朋友、家人或周围的人而言，而是对你意味着什么？你人生中最大的成功会是什么？\n\
    - 哪一件单一的事情会让你真正快乐？\n- 如果你能带着现在的认知重新过一生，你会有什么不同的做法？\n\n很多时候，人们被束缚在自己认为应该做的事情里，或者家人朋友认为他们应该做的事情里。他们常常被吸引去做自己认为社会期望他们做的事，而不是专注于自己真正想做的事。现在你要关注的重要事情是：你想要什么，以及你为什么想要这些。\n\
    \n### 什么在驱动你？\n\n现在你对自己人生中真正想要什么已有了一些想法，重要的是要准确找出你为什么想要这些，以及你如何最好地激励自己去实现它们。为了帮助你做到这一点，你必须确定当前是什么在激励你、什么驱动你走向成功，以及什么让你每天起床。你的指路明灯是什么？你的箴言是什么？那些流经你脑海、塑造你的个人选择并支撑你人生使命的思想和梦想又是什么？\n\
    \n> 想取得成就并赢得冠军的人，会自我激励。\n>\n> ——迈克·迪特卡，美式橄榄球运动员兼教练\n\n每个人都被不同的因素所激励。你为什么做你所做的事？你的思想、行为、行动和人际关系之下隐藏着什么？\n\
    \n为了完成下一项练习，请回顾你在第1章（第6页）中列出的你喜欢做的事情，并回答以下问题：\n\n### 揭示个人动机 2——你为什么想要你想要的东西？\n\
    \n- 我为什么喜欢做这些事情？\n- 做这些事情为我带来了什么，或让我得到了什么？\n- 做这些事情如何提升我的生活？\n- 在我的生活中，做这些事情真正重要的是什么？\n\
    - 如果我的生活中不能做这些事情，我会有什么感受？\n\n当你回答了这些问题，你就能获得所需信息，整理出一份清晰的陈述，说明你为什么做你所做的事。然后，你可以用这份陈述来决定什么对你重要、你会选择做什么，以及你会选择不做什么。这是以完全符合你人生中最看重之事的方式生活的重要一步。\n\
    \n当你找出答案中的共同主题后，你就能对所有与这些主题相符的机会说“是”。生活中突然出现的、与让你快乐的事物相冲突的事情，应谨慎对待。你要么设法从生活中消除这些事件，要么设法把它们转化为你的优势。每当你遇到这类情况之一，都必须问自己：“在这种情况下，我有哪些机会按照对我最重要的东西来生活？”\n\
    \n你自己的使命宣言将帮助你始终沿着人生中对你重要的事情前进。回顾你对上一节“揭示个人动机”问题的回答，并以使命宣言的形式总结关键要点。\n\n### 我的使命宣言\n\
    \n| |\n|---|\n| |\n\n### 如何确保你每天都遵循自己的使命宣言\n\n始终把使命宣言放在手边。要么把它记在心里并定期重复，要么写下来，并确保尽可能经常阅读。你可以在使命宣言中写入任意多的细节，它也会随着时间不断演变。要保持简洁，因为遵循一份简短而切中要害的使命宣言，会简化你做出的每一个决定。\n\
    \n### 使命宣言的价值\n\n使命宣言之所以有效，是因为它简短地概括了你在生活中看重什么、什么对你重要。你可能珍视的核心价值观包括诚实、正直、慷慨和善良。每个人都有价值体系，而了解自己的核心价值观，是确保你始终按照这些价值观行事的可靠方法。了解自己的核心价值观可以解释你在某些情境下的感受。如果你所做的事符合你的价值体系，你会感到满足。如果某件事违背你的价值观，你会感到不舒服。如果你的关键价值观之一是诚实，而有人对你撒谎，或试图说服你去对别人撒谎，你不太可能顺从他们。如果你看重做事周全，而老板要你发送一份你仍在处理、你觉得尚未准备好的报告，你可能会抗拒这个要求。\n\
    \n如果你在任何情境中感到不舒服，这不太可能是一种不理性的感觉，更可能是你的价值观受到挑战。知道正在发生的是这种情况，有助于你理解自己的不适。\n\n如果有人挑战你的核心价值观，到了你觉得不可接受的程度，并且你觉得同意某种情况会让你妥协太多，那么你就需要做决定。你能做什么来扭转局面，使你的价值观不受损害，并且你能按照自己的使命宣言生活？这时，你的使命宣言就派上了用场，因为只有当你确保每种情况都允许你按照使命宣言生活时，你才能毫无保留地继续前行。绝对清楚地了解你当前的使命宣言，将确保你永远不会妥协自己的核心价值观。\n\
    \n个人动机 2 系列中的最后一个问题——“如果我的生活中不能做这些事情，我会有什么感受？”——是一个强有力的行动号召。人们常常在缺少足够多让自己快乐之事的情况下生活太久，但如果你考虑永远不再拥有这些东西，你就会以不同的方式看待这种处境。如果你现在不准备把更多自己喜欢的事情带入生活，那要等到什么时候？要当心等到明天才开始所带来的后果，因为明天可能永远不会到来。做出选择吧——你想过的生活从今天开始，而不是从明天开始。\n\
    \n### 信念的力量\n\n你的信念决定你的行为方式、你说的话以及你如何评判他人。它也决定你在所做的一切事情中取得的结果。如果你相信生活永远会是一场挣扎，那它就永远会是。如果你相信人际关系需要辛苦经营，那么你拥有的每一段关系很可能都不会没有问题。\n\
    \n### 信念的形成\n\n你肯定听过“眼见为实”这句话，它意味着只要你经历过某件事，就可以相信它是真的。例如，如果你看到一位老年男子在限速60英里（96公里）每小时的区域里，戴着帽子坐在车里，以每小时30英里（48公里）的速度愉快地行驶，这可能会让你形成一种信念：所有在开车时戴帽子的某年龄段的人，都是开得慢或驾驶技术差的人，是道路上的麻烦。\n\
    \n### 你相信什么？\n\n列出你认为生活中真实的事情。信念的例子可以很笼统：“我相信太阳会在早晨升起”“我相信旅行能开阔心胸”；也可以更个人化：“我相信掌控局面很重要”“我相信以身作则很重要”，或者“我相信人必须始终以身作则”。\n\
    \n标出你自己的五个信念：\n\n1. 我相信……\n2. 我相信……\n3. 我相信……\n4. 我相信……\n5. 我相信……\n\n> 眼见并不总是为实。\n\
    >\n> 马丁·路德·金\n\n"
