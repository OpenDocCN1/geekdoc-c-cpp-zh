    # **Nutrition and visualization**


    From the beginning of your healthy eating regime, you must create mental images
    of yourself shopping for healthy food, preparing interesting meals packed with
    energy and vitamins and nutrients, eating them and, above all, enjoying them.


    The more pictures you can create in your mind of the benefits you will gain from
    healthy eating, such as a new body shape, fat loss, new clothes and how you will
    feel shopping for them and wearing them, increased energy, better skin and a radiant
    glow from within, the easier it will be to make the necessary behaviour changes
    and the quicker you will begin living these positive images.


    # **Nutrition and modelling**


    Remember times in your life when you ate well and how you felt about this. Recall
    as many positive, personal associations with healthy eating as you can. These
    recollections could be times when you have made an effort to cook for yourself,
    healthy and enjoyable meals you have eaten in restaurants or times when someone
    else has cooked for you.


    Who do you know that eats well and lives with the benefits of doing so? Select
    a few people who have a successful approach to healthy eating and find out how
    they do it. Quiz them on what they find easy or where the pitfalls are. Learn
    from their experience and tailor an approach that suits you.


    # *Seven steps to success – beautiful body, endless energy*


    # **1 Immediate action**


    Get into the mindset of someone who lives a fantastically healthy lifestyle. Get
    yourself a glass of water and then prepare a fruit smoothie or some freshly squeezed
    juice. Check your posture, sit up straight and have a bit of a stretch. Think
    about how your body feels.'
