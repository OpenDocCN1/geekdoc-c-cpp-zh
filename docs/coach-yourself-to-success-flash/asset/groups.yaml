    such as ‘I’m on the way to my new body’, ‘Exercising helps me feel energized’
    or ‘Exercise is an important part of my life’ will increase your chances of success.


    # ### Exercise and visualization


    Ultimately, you must believe that you will succeed with your objectives and you
