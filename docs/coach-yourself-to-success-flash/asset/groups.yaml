    # ## Creating unstoppable momentum


    Once you have your initial objectives on your planner, the next step is to find
    good reasons to guarantee that these objectives come to fruition. And this means
    really good reasons. Great reasons in fact. Reasons that turn your goals into
    something irresistible, something you absolutely have to make into a reality.
    The simplest way to achieve this is to visualise, in as much detail as possible,
    every aspect of achieving success.


    Working through the following exercise will ensure that you have total clarity
    for all the positive reasons why reaching your goal is worthwhile for you. You
    must create the most vivid and exciting picture of your future that you are capable
    of and work on it until it is irresistible. You''ll know your visualisation is
    working when you can feel all the physical symptoms of excitement that go with
    living in the way that you are imagining. Continue to ask more questions of yourself
    and work on the answers that lead you to feel almost overwhelmed by the desire
    to make this dream a reality. Picture yourself living your dream life in all its
    detail. Keep working on the vision until it feels like you are living your future
    already. You can now use the powerful feelings generated by your visualization
    to take instant action towards creating a world around you that matches up to
    the mental images and physical feelings you have just experienced.'
