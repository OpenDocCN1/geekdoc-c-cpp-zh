    you uncover the beliefs, values, mission statements and objectives of other people,
    so that you will be well placed to form good relationships with them. The chapter
    also shows you how to surround yourself with positive people that bring energy
    and inspiration to your journey through life, and how to ensure you are free of
    negative influences that may distract you from success.


    ### Relationships you choose


    Just as people look different in subtle ways or very dramatic ways, their view
    of the world and the way they behave can differ from you and your view of the
    world subtly or dramatically. Generally, you will be drawn towards those who are
    most similar to you in their beliefs, behaviours and views of what matters in
    life as you feel most comfortable when surrounded by like-minded individuals.
    These are the people you choose to have as friends, and these friendships may
    develop into something deeper and stronger with those with whom you have the most
