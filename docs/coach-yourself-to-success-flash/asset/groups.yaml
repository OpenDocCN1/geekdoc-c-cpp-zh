    # Seek out the positive


    The knowledge that you gain from running through these exercises is invaluable
    in creating the correct environment for success. Listing particular examples of
    when you were successful helps you to build up a body of evidence to show that
    you are capable of great achievements when you turn your mind fully to a task.
    Gathering evidence of your own successful strategies and circumstances also means
    that you can pinpoint very effectively when circumstances are not completely in
    your favour. You can then act promptly to alter situations where necessary to
    ensure that you are fully supported in your objectives and at the best advantage
    for the most positive result.


    # Modelling your own success


    In the world there seems to be a tendency for people to judge themselves very
    harshly. If something in their life isn’t going according to plan, it can trigger
    a spiral of negative thoughts that leads them to conclude that they are incapable,
    ineffective, and not up to the job. If you ever find yourself falling into this
    trap, break the cycle of thought by thinking immediately about what you are good
    at. You are good at many things but will often overlook these things in your quest
    for complete perfection. Answer the questions in the previous activity and use
    your answers to plan a new approach in whatever area hasn’t yet worked for you.
    If you have strategies that you know work for you in particular areas of your
    life, use them. There’s no reason why they shouldn’t work in other areas too.


    # Modelling the success of others


    Modelling your own success is a clever way to jump-start progress in any part
    of your life and it can be a very productive technique. Moreover, there’s no need
    to stop there. Somewhere in the world there will be someone who has achieved everything'
