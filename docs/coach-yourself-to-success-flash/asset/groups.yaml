    # # 4 planning your life'
  - '[PAGE 42]


    There is a phrase that says it is important to ‘have your own plan or you’ll end
    up as part of someone else’s plan’. Having taken the time and trouble to investigate
    your life and the way you operate, the next step is to use the information learned
    so far to create your long-term future. You now know the power of focusing on
    what you want in life and you have felt the benefits of taking active steps towards
    living the life you deserve. The fun really begins now as you decide how you are
    going to apply the new you for maximum results in the future.


    There is only one way to guarantee that you minimize any possible frustration
    in life, and that is to dictate your own plan for the way you want things to turn
    out. Creating your own agenda by setting goals or objectives will give you a sense
    of purpose and bring new meaning to everything you do. Chapter 4 will help you
    formulate your plan to guarantee quick, and consistently positive, results.'
