  - '[PAGE 16]


    point your unconscious mind in a given direction, it will pick up on opportunities
    to help you move in that direction and will filter out information that it deems
    to be irrelevant to your objectives. To act against your gut instinct can lead
    to frustration and often ends with those moments where you say ''I knew I shouldn''t
    have done that'' or ''I knew how this was going to turn out''. Well you probably
    did, and it was your unconscious mind that was telling you.


    To make the best use of your unconscious mind, give it something to work with.
    When you know what makes you happy, focus on these things regularly, and your
    unconscious mind will lead you to opportunities to do more of these things. If
    you''re struggling with a problem, give it to your unconscious mind to work out
    the answer. Do something other than dwell on the issue. Take your conscious mind
    elsewhere for a while and go for a walk, do some gardening or even sleep on it
    and you are more likely to come up with a successful solution than if you just
    sit there racking your brain and going around in circles.


    # ### Practice makes perfect


    Trusting your instincts can be a daunting prospect so practise regularly and begin
    with relatively low-risk decisions. Make the effort to go with your gut feeling
    on at least three decisions every day and monitor your results.


    # ### Effective decision making


    There''s nothing worse than feeling indecisive. In the worst cases, failing to
    make decisions can lead to complete paralysis and an inability to move forward
    with anything. Trust your gut instinct and you will avoid this situation completely.
    Go with what you feel is right at the time and take action accordingly. You''ll
    soon know if the action taken wasn''t completely the right thing to do, but you
    can easily make adjustments to your approach until you refine the perfect solution.
    The important thing is that making a decision, any decision, will overcome paralysis
    and move you forward immediately. You can then amend the direction you''re headed
    in according to the feedback you receive from your initial decision.'
  - '[PAGE 17]


    # A simple example of change


    Learning to drive is a great illustration of a change most people make to their
    lives and the thought processes they employ to make these changes. To begin with,
    you have the current situation and something in life you want to alter. You can''t
    drive and, for whatever reason, you know that your life would be better if you
    were able to drive. Consequently, you form an objective – to learn to drive –
    and research how you can make this happen. You ask others, probably your parents
    first, how they learned to drive, and then you find out who you can learn to drive
    with, probably through recommendations from friends or research from directories.
    Once you''ve done your research, you take action by calling an instructor and
    booking an appointment for your first lesson. You attend your lessons and practise
    new skills until you feel confident enough to take your driving test.


    Learning to drive illustrates four clear stages of change and highlights the changing
    roles of your conscious and unconscious mind as you develop new skills.


    +   1 Unconscious incompetence

    +   This is when you don''t know what you don''t know. You see cars around but
    you''re unaware that you could be driving one. At this point in your life, driving
    is something that other people do. You have no comprehension of what might be
    involved in learning to drive.


    +   2 Conscious incompetence

    +   This is when you know what you don''t know. You realize that driving is an
    option for you, and quite an attractive one at that. You have highlighted a new
    skill that you want to learn and you investigate the necessary steps to mastering
    that skill.


    +   3 Conscious competence

    +   This is when you are very aware of what you do know. Having established what
    you needed to learn in order to be'
  - '[PAGE 18]


    able to drive, you have learned the necessary skills and mastered the art, but
    you still really have to concentrate on every aspect of doing it.


    # **4 Unconscious competence**


    This is when you are capable of doing something but don''t have to consciously
    engage in doing it. At this point, driving becomes second nature and you don''t
    have to think about every gear change and every move you make.


    Mastering the art of driving also demonstrates key features of facilitating change.
    These are features that you need to be aware of if you want to change in your
    life to be fast and effective. The key features can be summarized as follows:


    # **Key factors for successful change**


    +   - A clear objective

    +   - Research

    +   - Action

    +   - Accountability

    +   - Structure

    +   - Feedback, flexibility and modification

    +   - The end point

    +   - A clear benefit


    # **A clear objective**


    For guaranteed success, you must be able to state your objective accurately and
    concisely: ''I''m going to learn to drive and I''d like to pass my test within
    the next six months.''


    # **Research**


    Knowing what you are setting out to achieve enables you to research the means
    to achieve your objective. Find out how one learns to drive – the method – and
    then find out how you are going to learn to drive – the practicalities. This will
    include whom you have lessons with, whose car you use, how many lessons you will
    aim to have and how much practice you can do between lessons.'
  - '[PAGE 19]


    # ## Action


    > > *If you want to conquer fear, don''t sit home and think about it. Go out and
    get busy.*

    > >

    > > Dale Carnegie, author of *How to Win Friends and Influence People*


    Successful change begins with action and continues with more action. Action makes
    you feel positive and in control. You begin with finding out the facts and putting
    your resources in place. You take your first driving lesson and then practise
    repeatedly. You plan a schedule for your theory study and then keep up to date
    with it.


    # ## Accountability


    Sharing your objective with others increases your accountability to making it
    work out for you. The more friends, family and colleagues that you tell what you''re
    up to, the greater incentive you have to make a good job of it. Getting others
    involved also provides you with a strong support network.


    # ## Structure


    There must always be a structured plan for how you will get from where you are
    now to where you want to be. In this case, the structure of the plan must include
    the number of lessons you anticipate, the time this will take out of your schedule,
    the content of the theory study and a time allocation for this, and any other
    preparation you need to do for your test.


    # ## Feedback, flexibility and modification


    > > *What separates the winners from the losers is how a person reacts to each
    new twist of fate.*

    > >

    > > Donald Trump


    Even the best-laid plans need an element of flexibility. You must continually
    monitor your progress and modify your approach where necessary. Your initial objective
    may be to take your test in June but, if you really need more practice with your
    parallel parking and reversing around a corner, you may need to modify your plan
    to allow yourself more time to practise and'
  - '[PAGE 20]


    then take your test in July. Being flexible should never be seen as compromising
    on your plan; rather, you are simply being realistic about how to achieve your
    desired result at the right time based on your current circumstances and rate
    of progress.


    # **The end point**


    Every objective must have an end point. You must know when you''ve been successful
    so that you can appreciate your achievement and begin forming new objectives.
    You''ll know you''ve succeeded when you hear someone say the words ''I''m pleased
    to say you have passed your driving test.''


    # **A clear benefit**


    To smooth the path through any change or challenge, there must be a clear benefit
    to the action. You must be absolutely clear on how what you will have achieved
    by making the change will improve your life and the life of others around you.
    The clear benefits of passing your driving test are freedom, flexibility and fun.
    Make sure that every positive change you set out to make has an element of reward
    built into it. Making a change is reward in itself. Creating as many benefits
    as possible from making the change will definitely increase your likelihood of
    quick success.


    # **The learning cycle**


    So now you can see and understand the simple processes that your mind goes through
    when you want to make changes. You begin at the point where you are living your
    life without really being aware that something might need to change. Then you
    see or experience an event that triggers a desire to make a change. You focus
    specifically on the change you need to make, how you can effect that change, and
    you practise new approaches and ways of behaving until you have achieved a new
    way of being. At this point, you allow your new behaviour to drift into the realm
    of unconscious living, leaving you free to focus your mind on new challenges.'
