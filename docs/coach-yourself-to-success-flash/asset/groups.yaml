    in the ocean on holiday. Remember how good this felt and then aim to recreate
    these feelings with the exercise in your current routine. Select some positive
    role models for your health and fitness. Who do you know who looks like you want
    to look? Who has that inner glow and positive demeanour that comes with regular
    activity? Quiz these people and find out how they do it. Model the aspects of
    their approach that are applicable to your particular situation.


    # Nutrition and prioritizing


    Rate your satisfaction with how healthy your food routine is at the moment and
    decide how important it is that you do something to change the situation. Refer
    back to your reasons why living a healthier life is important for you now, and
    make sure that eating healthily is a top priority for you before you attempt any
    lasting changes.


    # Nutrition and goal-setting/planning


    Be specific about the changes you are setting out to make with your eating plan.
    Keep your objectives simple, such as ‘By the end of the month I will eat breakfast
    every day’, ‘I will eat four pieces of fruit every day from now on’, ‘two mid-morning
    and two mid-afternoon’. Plan how you will support yourself in your objectives.
    If you want to eat breakfast every day, you need to shop for some breakfast options
    and have them in stock. If you want to eat more fruit, you will need to create
    a new routine of shopping regularly for fresh supplies so that you have plenty
    at home or at work when you need it. Review your objectives regularly so that
    you can quickly address and adjust your behaviour if necessary.


    # Nutrition and beliefs


    Investigate whether your beliefs around healthy eating will help or hinder you
    in your new objective. Beliefs such as ‘Food just isn’t a priority for me’ or
    ‘I’ve always been overweight’ will limit your success. New beliefs along the lines
    of ‘I’m interested in food as a means to reach my desired body shape’ or ‘I decide
    what weight I’d like to be and am in control of this’ will help you achieve great
    results quickly.'
