    # ## 2 Ring the changes


    Your body and mind from now on are going to feel different. Make a list of everything
    that you want to eliminate or cut down on. Things like processed food, caffeine,
    alcohol, crisps or sweet snacks. Check the list and make sure that you are happy
    to live with less of these things in your life. For those you can''t completely
    get rid of, decide what will be an acceptable level for them to feature in your
    new routine.


    # ## 3 Plan of attack


    Devise your healthy living routine for the next seven to ten days. Consider what
    you want to eat and drink for these days. Plan when you will exercise and what
    you will do.


    # ## 4 Prioritize


    Select which measures for healthy living you can put into place the fastest. The
    sooner you start, the quicker you will feel great.


    # ## 5 Review


    Healthy living is addictive, so keep track of the changes you make so that you
    can make more of them. You don''t know how fantastic you could feel until you
    put as many positive strategies into place as possible.


    # ## 6 Make it fun


    Get others involved where you can. If you are living healthily with other people,
    not only will you be more likely to stick to your objectives but it will be more
    fun to share the experience and success with others.


    # ## 7 Enjoy it


    From the moment you begin to live a healthier life, you will feel better, so start
    enjoying it right away. Don''t wait until you achieve one of your milestones to
    celebrate your success. You can revel in these triumphs when they come as well,
    but for now take heart and motivation from the fact that you have begun the journey.'
