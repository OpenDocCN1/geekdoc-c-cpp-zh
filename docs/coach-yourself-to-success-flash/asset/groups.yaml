    If you’d like to witness the power of beliefs in action, for one whole day keep
    a record of your interactions with other people and examine each in relation to
    your beliefs. Take note of everyone you come into contact with in person or on
    the telephone or email. Who do you engage with and why? What shared beliefs do
    you have with this group? Who did you give short shrift to? Why do you think you
    don’t have patience with this group? It may be that all those people with whom
    you get on well share the belief that it is important to be on time. Other people
    whom you don’t get on well with may all hold the belief that teamwork isn’t important,
    it’s what the individual does that counts. Think about how others fit into your
    belief system.


    +   - Whom did you get on well with today?

    +   - How does this interaction relate to your beliefs?

    +   - Whom did you not have so much time for?

    +   - What shared beliefs do you have with this group?


    The above questions are useful as they help to explain some of the decisions and
    judgements that you make about people and situations throughout the day. They
    also highlight which of your beliefs you hold as the strongest because these will
    be the ones that appear most frequently as part of your decision-making processes.


    As you familiarize yourself with your beliefs, you can see clearly how they shape
    your everyday life.


    # Limiting beliefs


    Understanding your beliefs in order to help guide you through life is a very useful
    process, but be aware that holding on to your beliefs too tightly could also lead
    to frustrations and limitations. If you believe that life is always going to be
    a struggle, this belief will loiter at the back of your mind and infiltrate everything
    you do. Getting up in the morning is difficult because your belief leads you to
    look for the parts of the day that will reinforce this thought process. Your brain
    will actively seek out the points at which each day'
  - '[PAGE 37]


    could potentially be a struggle, hone in on these, and satisfy itself that you''re
    right to hold this belief. You will see precisely the things that reinforce your
    belief and you will overlook any evidence to the contrary. If you believe that
    relationships are hard work, the mind has a tendency to highlight all the examples
    in any relationship that will confirm this. You see, and have confirmed, what
    you believe to be reality. But are these beliefs helpful to you? And how did they
    come to be formed in the first place?


    It is sensible to assume that there is a positive intention in every thought or
    behaviour that you demonstrate. You would never set out to deliberately make life
    hard for yourself so there must have been a reason for you to form what might
    now, on closer inspection, turn out to be limiting or negative beliefs. Perhaps
    you grew up surrounded by people for whom life was a struggle, and you adopted
    this belief as it helped you to fit in and make sense of the world around you.
    Maybe you had one difficult relationship and, rather than repeat any of the distress
    this caused you, it''s just easier to believe that relationships are hard work
    and that you''re better off steering clear of them.


    But what could you be missing out on? By living with a belief system that was
    formed for particular reasons, without ever questioning or updating it, you''ll
    never know if these beliefs might be doing you more harm than good. Compare the
    following beliefs and consider how life might be different for the people who
    hold them.


    # ### Examining beliefs and choosing your thought patterns


    +   - a Life is a struggle.

    +   - b Life is full of challenges that will help me to grow.

    +   - a Relationships are hard work.

    +   - b Relationships have their ups and downs but anything that''s worthwhile
    needs working at.

    +   - a I find my job difficult.

    +   - b I find my job challenging.'
