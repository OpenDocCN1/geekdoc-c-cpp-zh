    ## 引言


    欢迎来到你新生活的起点！当你拿起这本书时，你已经知道自己想要掌控命运，而你现在正走在学习和理解一切所需之物的道路上，以充分享受生活。


    ### 什么是人生教练？


    人生教练是一系列过程和多种技巧，可以应用于你当前的处境，创造出更快乐、更充实的生活方式。它关乎以不同的方式看待你的人生，是一个因人而异的个人过程。在所有教练关系中，共同的主题是：通过遵循过程并应用技巧，你将成长并到达一个比出发点更好的境地。无论你现在的生活如何，你都可以利用这本书及其中的技巧让它变得更好。


    教练是一个持续的过程，敢声称自己“精通”生活艺术的人是十分大胆的。有一件事你可以永远确定，那就是你的生活在不断变化，你必须警觉如何跟上这种变化，并理想地保持领先一步。你一直在学习，不断地从一个任务、情境或人生角色演变到另一个。重要的是，你要正确装备自己，以最适合自己的方式成长，并保持满足。这本书正是为了帮助你做到这一点。


    > *未经审视的人生不值得过。*

    >

    > —— 苏格拉底，《申辩篇》38a


    通过向自己提出这些问题并应用书中的技巧，你将踏上一段通往新存在的旅程，拥有新的方向和新的目标。你将掌控自己的行动和前进的方向。你永远不会再带着对一天可能发生之事的恐惧醒来。相反，你将能够以乐观的心态拥抱每一天，安全


    ## 1. 什么让你快乐？


    世世代代以来，人们一直在寻找生命的意义，竭尽所能试图理解这一切是怎么回事，以及我们为何在此。有些人旅行以寻求新的体验、开阔思维，有些人渴望独处，希望内省能引领他们找到所寻求的答案。


    无论你选择如何探索你的存在，最重要的是你确实选择了探索。生命短暂，当你离去后世界仍会继续运转。当你还在时，你打算做些什么来改变世界？你能贡献什么？你的人生使命是什么？


    纵览人们认为对其存在至关重要的所有观念，有一条共同的主线：每个人都想尽可能快乐地生活。第1章探讨快乐对你意味着什么。


    现在花点时间，通过问自己以下问题来思考什么让你快乐，并记下你的答案。


    - 我最后一次真正感到快乐是什么时候？

    - 我在哪里？

    - 我在做什么？

    - 我和谁在一起？

    - 哪些事情经常让我快乐？

    - 哪些活动让我觉得时间飞逝？


    尽可能多地回想你感到快乐的时刻。


    现在，标出你生活中最有可能让你快乐的前五件事：


