  - '[PAGE 39]


    Whatever you''ve chosen for your new beliefs, you must be certain that they serve
    a positive purpose for you. Your beliefs should be regularly investigated to ensure
    that they are up to date, based on current circumstances and relevant to your
    life as it is now. Beliefs should support you with your positive intentions for
    changing your life, and you must be able to state them with total confidence and
    certainty in order for you to achieve your greatest successes.


    There are some examples of positive and supportive beliefs below. Look at the
    statements and read them aloud. Feel the control and liberation that comes with
    being able to state such beliefs out loud with unswerving certainty. Even if these
    examples are not completely relevant to your situation, you can imagine their
    effectiveness. Make sure you are as certain of your own current belief system.


    # Sample supportive beliefs


    +   - I believe with total certainty and without any shadow of doubt that I am
    capable of the career I want and the finances I deserve.

    +   - I believe with total certainty and without any shadow of doubt that I will
    have a long and happy relationship.

    +   - I believe with total certainty and without any shadow of doubt that I will
    reach my target weight and body shape.

    +   - I believe with total certainty and without any shadow of doubt that I live
    a successful, happy and fulfilled life.


    When you update your beliefs, you instruct your unconscious mind on how things
    are going to be from now on. You give it the opportunity to seek out new avenues
    and explore new ways of living within your updated belief system. Your unconscious
    mind likes clear instructions, so be explicit and be consistent with the thoughts
    that you have. Check your belief system regularly to'
