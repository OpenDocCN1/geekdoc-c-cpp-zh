    \ editor, and naming it hangman.py.\nSave hangman.py on your desktop.\n\nThen\
    \ within the text editor, write this code:\n\n```\nName = input('Please enter\
    \ the name of the person who created this game: ')\nprint('This game was made\
    \ by the amazing ' + Name + '!')\nprint('Welcome to my guessing game!')\nprint('In\
    \ this program, you will try to guess a word that I chose.')\nprint('Good Luck!')\n\
    \ndf start():\n    Player_Name = input('What is the name of the player? ')\n \
    \   print('Greetings, ' + Player_Name + '! It is time to guess!')\n    Secret_Word\
    \ = 'ostrich'\n    Guesses = ''\n    Turns Left = 11\n    while Turns Left > 0:\n\
    \        WrongAnswers = 0\n        for Letter in Secret_Word:\n            if\
    \ Letter in Guesses:\n                print(Letter)\n            else:\n     \
    \           print('_')\n                WrongAnswers += 1\n        if WrongAnswers\
    \ == 0:\n            print('YOU WIN! You guessed my word: ' + Secret_Word + '!!!')\n\
    \            break\n        Guess = input('Guess a letter here: ').lower()\n \
    \       Guesses += Guess\n        if Guess not in Secret_Word:\n            Turns\
    \ Left -= 1\n            print('Oops! That letter is not in my word. Please try\
    \ again.')\n            print('You have ' + str(Turns Left) + ' guesses left.\
    \ You can do it!!')\n        if Turns Left == 0:\n            print('GAME OVER.')\n\
    \    print('Play Again?')\n\ndf Play_Again():\n    Again = input('Would you like\
    \ to play the game again? ').lower()\n    if Again == 'No'.lower():\n        quit()\n\
    \    if Again == 'Yes'.lower():\n        start()\n    else:\n        print('Please\
    \ enter Yes or No. Thank you!')\n    Play_Again()\n\nPlay_Again()\n\nstart()\n\
    ```"
