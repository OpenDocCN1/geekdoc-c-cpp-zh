  md: '# CHAPTER NINETEEN

    CONGRATULATIONS!!


    You have completed our book! Well done on your hard work and persistence!


    You should now have a basic understanding of Python and coding.


    As the next step, we recommend enrolling in a Tech Academy coding boot camp. Our
    coding boot camps were designed like this book: for beginners and assuming no
    prior knowledge or experience.


    Here are some of the reasons thousands of students have chosen to enroll in The
    Tech Academy:


    +   1) Our curriculum – it''s modern, robust (strong; holds up over time), and
    covers in-demand technologies. Our programs are thorough and cover more than just
    1-2 languages. Our comprehensive curriculum ensures students aren''t pigeon-holed
    (restricted to an exclusive category) within a small skillset. Understanding a
    large array of technologies not only prepares graduates for the workforce, it
    assists them greatly in picking up tech skills in the future.


    +   2) We price our boot camps affordably. In fact, our tuition is less than the
    national average weekly cost of coding boot camps.


    +   3) We require no technical background or experience. You don''t have to already
    know coding to learn to code. As long as students can read, write and perform
    basic math, they can succeed at The Tech Academy.


    +   4) We have a stellar online presence. Our average review rating across the
    top review sites ranges from 4.5-4.9 stars. We have received the Best Coding Boot
    Camp award several years in a row from SwitchUp.Org and CourseReport.Com (the
    top two boot camp review sites) and are included on several other top boot camp
    lists as well. We were also chosen as "The World''s Best Code School" by the television
    show "World''s Greatest." All of these awards and reviews are based on feedback
    from students and graduates of our programs.


    +   5) We are extremely flexible. Students choose their own study schedule. They
    can study from home, at one of our campuses or both. They have online access to
    their program 24 hours a day. This ensures that students can enroll regardless
    of their life circumstances. The fact that the programs are self-paced is aspect
    of our flexibility – students can blast through content they know already, and
    take their time with new concepts. An additional factor in our flexibility is
    that we offer open enrollment, which means students can start anytime.


    © Prosper Consulting Inc., The Tech Academy'
