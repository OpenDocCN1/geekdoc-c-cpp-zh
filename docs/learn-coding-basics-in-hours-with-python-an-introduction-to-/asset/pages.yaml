  md: '# DOUBLE EQUAL SIGNS


    == (double equal sign) is a symbol used to show that a comparison should be made.
    Specifically, this "==" symbol is an instruction to check whether the data on
    the left side of the symbol is equal to the data on the right side. The answer
    to this comparison is an answer of "true" or "false".


    When the "==" symbol is used to check for equality, usually it is used like this:
    [first item to be compared] == [second item to be compared]


    For example: (10 + 5) == 15


    In this example, we are asking the computer to check whether result of adding
    5 and 10 is equal to 15.


    When the "==" symbol is used in this manner, we are asking the computer to give
    a response after checking for equality. Usually, this result is given in a "true"
    or "false" manner. Here, the response would be "true," since (10 + 5) is equal
    to 15.


    Another example: (10 + 6) == 15


    Here, the computer would respond with "false," since (10 + 6) is not equal to
    15.


    Write this code in IDLE:


    ```

    >>> 10 == 10

    ```


    and press enter. We are stating that 10 is equal to 10, which is True.


    Now write this code in IDLE:


    ```

    >>> 25 == 10

    ```


    and press enter. We are stating that 25 is equal to 10, which is of course False.
    These last few lines of code we''ve written are all Boolean logic.


    # COMMENTING CODE


    Commenting code is the act of leaving notes in your code that explain various
    points for yourself and/or others. The comments are not run in the program but
    are read by people when viewing the code directly so they can understand the code
    better.'
