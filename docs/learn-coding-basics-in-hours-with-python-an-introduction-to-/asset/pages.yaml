  md: 'Here, the variable is named “color,” and the value of that variable has been
    set to “red.” In other words, the variable named “color” is now “equal” to the
    word “red.”


    Let’s look at the example of “a teacher grading a stack of papers.” Here, we could
    have a variable called “Paper Grade” that changed each time the teacher graded
    a paper. You could also have variables for the total number of questions on the
    paper (“Total Questions”) for both the number of questions answered correctly
    (“Correct Questions”) and for the grade of the paper.


    The written description from above:


    +   - Take the next student paper from the top of the “To Be Graded” stack.

    - Grade the paper.

    - Write the grade on the paper.

    - If the grade is 70% or higher, put the paper in a “Passed” stack.

    - If the grade is below 70%, put the paper in a “Failed” stack.


    In computer language, the procedure might look something like this:


    +   - Retrieve Next Paper

    - Set Total Questions = [total questions in current Paper]

    - Grade Paper

    - Set Correct Questions = [number of questions answered correctly]

    - Set Paper Grade = [Correct Questions/Total Questions]

    - If (Paper Grade >= 70%) then Paper Status = “passed"

    - (Paper Grade < 70%) then Paper Status = “failed”


    This is a simple computer program.


    As a note, the >= (greater-than sign followed by equal sign) is a symbol used
    to show that a comparison should be made. Specifically, this “greater-than or
    equal” symbol is an instruction to check whether the data on the left side of
    the symbol is than or equal in amount or quantity to the data on the right side.
    The answer to this comparison is an answer of “true” or “false.”


    For example: 5 >= 4


    This means “check whether 5 is greater than or equal to 4.” Since five is greater
    than four, the answer is “true.”


    Another example: 3 >= 6

    This means “check whether 3 is greater than or equal to 6.” The answer is “false.”'
