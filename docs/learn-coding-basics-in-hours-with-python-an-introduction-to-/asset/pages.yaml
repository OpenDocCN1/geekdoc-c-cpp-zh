  md: "numbers that you can then use in a for loop. The range() function has two different\
    \ sets of parameters that can be used as follows:\n\nrange(stop): The number of\
    \ numbers (integers) to generate, starting from zero.\n\nrange([start], stop,\
    \ step]) //notice how the optional parameters are enclosed in [ ]. start: The\
    \ starting number of the sequence. stop: The number of numbers (integers) to generate,\
    \ starting from the integer specified with the start parameter. step: The difference\
    \ between each number in the sequence. This is basically the 'count by' number.\n\
    \nNote that:\n\n+   - All parameters must be integers.\n- Parameters can be positive\
    \ or negative.\n\nNth is a mathematical term that refers to the last number in\
    \ a sequence of numbers. For example, 1st, 2nd, 3rd, Nth.\n\nThe stop parameter\
    \ is not the number which will stop on, but rather, the Nth number produced, where\
    \ stop is the Nth number.\n\nFor example, type and run this code in a New Window:\n\
    \n```\nmy_list = ['one', 'two', 'three', 'four', 'five']nmy_list_len = len(my_list)\n\
