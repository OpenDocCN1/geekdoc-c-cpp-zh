    # DICTIONARIES


    In computer programming, dictionaries are a specialized type of list. The first
    item is the key, and the second item is the value. Together, they are a "key-value
    pair."


    Key-value pair is abbreviated "KVP". A KVP is a set of two linked data items that
    consists of: a key (a unique identifier for some of data), and the value (the
    data that is identified by the key). The key is the unique name, and the value
    is the content.


    Collections of KVPs (i.e., dictionaries) are often used in computer programs.


    Below is an example of a collection of KVPs that might be used in a computer program
    for a school. Here, the KEY is used to store the name of a course at the school,
    and the VALUE is the description of the course – this is a dictionary:


    | KEY | VALUE |

    |---|---|

    | YEAR | 2030 |

    | SEASON | "Summer" |

    | WEATHER | "Stormy" |

    | DAY | "Saturday" |

    | MONTH | "August" |


    Note that in this list, you could not have a second Key-Value Pair that used the
    Key "SEASON" or "DAY" because the keys in a given collection of KVPs must be unique.'
