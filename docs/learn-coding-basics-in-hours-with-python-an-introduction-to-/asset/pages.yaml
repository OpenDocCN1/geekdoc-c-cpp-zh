  md: 'In computers, your algorithms must be unambiguous. You have to be extremely
    specific about each step/part of an algorithm or the algorithms cannot be processed
    by the computer.


    For example, if you have an algorithm that is processing a list of ten numbers,
    then step of your algorithm is "delete the number," the computer cannot process
    this because you did not clearly specify which number you wanted deleted.


    Now that you know the above terms and concepts, we have the full definition of
    "algorithm" as defined in the book Invitation to Computer Science by American
    authors Schneider and Gersting:


    > Algorithm: A well-ordered collection of unambiguous and effectively computable
    operations when executed produces a result and halts in a finite amount of time.


    Sorting means to put items in an exact sequence or order. Computers sort items
    often. On your computer, you can sort files by when they were created, their name,
    etc. Algorithms can be used by computers to organize data.


    For example, you can sort files on your computer by name or date. This is done
    by a sorting algorithm within the computer. There are several different ways algorithms
    can be written to sort data.


    In learning how to program, you would write algorithms to perform various functions.
    Computers have many algorithms programmed into them already that cause them to
    do a lot of the actions you use computers for. For example, your computer performs
    many complicated steps to save a document on your computer. These steps are taken
    care of because programmers entered in algorithms to handle it for you.


    Whether or not you ever learn to write code, it is helpful to know the elements
    that make up a program, which we will now cover.'
