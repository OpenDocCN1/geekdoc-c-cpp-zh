  md: '# CHAPTER THREE

    PROGRAMS


    As a noun (thing), code is the written instructions you type into a computer

    To make programs.


    Programs are series of written instructions, entered into a computer, which

    cause the computer to perform a specific task or tasks. For example, word Microsoft®

    Paint is a program that can be used to create basic illustrations on your computer.


    Hardware refers to the physical components of the computer – the parts

    that can be touched. “Hard” means “solid” or “tangible” (able to be seen and felt),

    and “ware” means “something created.


    The computer screen, mouse, printer and keyboard are all hardware.


    ![](img/29b742b0a03470e98200c43a70e549de_13_0.png)


    The opposite of hardware is software. Software is just another word for

    “computer program” – sets of instructions that tell a computer what to do.

    Computer games, like Solitaire, are examples of software.


    Another word for computer program or software is “application.” These

    terms are all interchangeable. Though “app” (abbreviation of application) is usually

    used to refer to programs (applications; software) on a mobile device (like a
    cell

    phone.


    The word software came about in the 1960s to emphasize the difference

    between it and computer hardware. Software (programs; applications) are the

    ructions, while hardware implements the instructions.


    Installing a program means to put it into a computer so that the program

    can execute.'
  merge: -1
