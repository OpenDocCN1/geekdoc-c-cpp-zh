  md: '# CHAPTER FIVE

    MACHINE LANGUAGE


    You may have heard the concept that computers operate on 1s and 0s. How this works
    exactly is beyond the scope of this book, but a simplified explanation is that
    computers are made of billions of tiny parts that can either be one or off. 1
    represents on and 0 represents off. You can instruct computers to turn these parts
    on and off by entering a 1 and 0 into the computer. These 1s and 0s are called
    machine language. Commands written in machine language are called machine instructions.


    As an example, "10010100 01101011 01010111 01010100" could instruct the computer
    to "Delete the file called Vacation.doc." The "10010100 01101011 01010111 01010110"
    is a machine instruction.


    It is difficult for people to read and write in machine language since the instructions
    are just unique patterns of ones and zeroes. That is why programming languages
    were created. The computer converts (translates) the code written by developers
    into machine instructions.


    It works like this:


    ![](img/29b742b0a03470e98200c43a70e549de_18_0.png)


    One of the main uses of computers is the internet. So, what is the internet?'
  merge: -1
