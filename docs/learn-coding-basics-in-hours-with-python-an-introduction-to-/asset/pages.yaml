    # MODULES


    A module is a pre-made collection of Python code for your use. Python has many
    modules that exist to assist developers. These modules have functions you can
    use to add functionality to your program.


    Some functions come built into the Python language (like .upper() and lower()
    – which can make string uppercase or lowercase respectively), but other functions
    require you to import a module before they can be used. Importing a module just
    means adding the code of that module to your Python program so that the program
    can use it.


