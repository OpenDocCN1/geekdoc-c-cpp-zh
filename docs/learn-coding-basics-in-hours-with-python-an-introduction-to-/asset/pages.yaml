  md: '# CHAPTER ONE

    WELCOME


    Welcome to our Learn Coding Basics in Hours with Python book!


    Now, we''re sure you want to dive right into coding but there''s some information
    we are going to cover first to ensure you are well prepared. In fact, we won''t
    write any code until the 13th day of this book.


    It may seem like a lot of reading before we get down to business but it''s worth
    it. Let''s compare this to another subject: how hard would it be to drive a car
    if you couldn''t define the important terms - such as steering wheel, gas pedal
    or brake pedal? So, please bear with us and take some time learning some fundamental
    data that will set you well for the adventure that lies ahead.


    We have attempted to define all technical terms used in this book if you come
    across any that you don''t understand, look these up in The Tech Academy''s Technology
    Basics Dictionary (available for purchase on Amazon).


    The Tech Academy is a technology school headquartered in Portland, Oregon, with
    multiple campuses around the world. We specialize in coding boot camps (intensive
    training programs aimed at preparing graduates for entry-level technology positions,
    that can be completed in a few months). We also offer custom training for companies,
    and have published several books.


    While we would love to tell you everything about computers and technology in this
    book, we are only going to cover the absolutely necessary data. If you are interested
    in learning how computers work exactly, we recommend reading our book You Are
    Not Stupid - Computers and Tech Simplified, which can be purchased on Amazon.


    Our educational philosophy is to assume no prior knowledge on the part of the
    student. What means is that our training content, including this book, is written
    for absolute beginners. We operate on the assumption that you''ve never written
    code before and that you don''t know basic technical terms - this ensures nothing
    is over your head and that you''re not lost while reading.


    You''re about to experience The Tech Academy''s approach to education first hand:
    we are going to start our book by defining the technical words used in the title
    of our book!


    # CODING


    Coding refers to the action of entering instructions into computers to make them
    perform specified actions. A computer is a special type of machine.'
  merge: -1
