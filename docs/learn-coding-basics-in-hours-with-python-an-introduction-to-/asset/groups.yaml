    ## CHAPTER EIGHT

    ALGORITHMS


    “Algorithm” is a mathematical term that means a plan for solving a problem. It
    consists of a sequence of steps to solve a problem or perform an action.


    Computers use algorithms. An algorithm is a set of instructions that is used to
    get something done.


    For example, an algorithm for selecting the right kind of shirt might have the
    following steps:


    - 1. Pick a shirt from your closet.

    - 2. Put the shirt on.

    - 3. Look at yourself in the mirror.

    - 4. If you like it, go to step 6.

    - 5. If you don''t like it, return to step 2.

    - 6. End of procedure.


    Computers perform functions by processing algorithms. You can create algorithms
    for computers to follow that other people can use in the future without having
    to write out the entire list of steps again.


    For example, when your computer prints, there are many massive algorithms it uses
    to figure out which type of printer you have, how to convey the document to the
    printer in a way it understands, etc. This is all taken care of in the background
    so that all you need to do is click “print.” These algorithms were written by
    others to get the computer and printer to comply with your wishes.


    Another example of an algorithm could be a simple recipe, such as:


    - 1. Crack three eggs and pour their contents into a small bowl - attempt to avoid
    getting eggshell in the bowl.

    - 2. In the case of eggshells, remove any eggshells from the bowl.

    - 3. Beat the 3 eggs for 90 seconds in the small bowl.

    - 4. Put a small frying pan on the stove and turn the burner on to medium temperature.

    - 5. Pour the eggs in a small frying pan and cook until very little to no wetness
    remains.

    - 6. Serve the eggs.


    While there are similarities, computers and people do not use algorithms in the
    same way; there are similar features between real life algorithms and computer
    algorithms, but they are not identical.


    Computers can''t think – they operate in a completely literal manner – so when
    writing an algorithm for computers, there are certain characteristics that must
    be present for a computer to use the algorithm. People can deduce things and extrapolate
    data; people have imagination. Computers can only do what they''ve been told to.


    To fully understand what an algorithm is for computers, some terms and concepts
    must be cleared up first. Algorithms are composed of five separate characteristics:


    - 1. Result: the outcome of something.

    - 2. Finite amount of time: an exact amount of time for something.

    - 3. Well-ordered: listed out in the correct sequence and in an organized fashion.

    - 4. Effectively computable operations: this refers to a command that can be processed
    successfully by a computer.

    - 5. Unambiguous: ambiguous means unclear, confusing, not specified. Un = not.
    Something that is unambiguous means that it is clear and defined.


    Let''s go over each of these points in detail.


    ## RESULT


    Result: the outcome of something.


    In computers, a response could be considered the result. You type in: "Jan 3,
    2022" "Jan 3, 2022" would be the result. Answers to problems are also considered
    a result.


    Algorithms always have a result. If there is no result, it cannot be considered
    a valid algorithm.


    For example: print the number “2,” Result: 2.


    ## FINITE AMOUNT OF TIME


    Finite amount of time: an exact amount of time for something.


    Algorithms should have a finite number of operations included in them and should
    execute these operations in a period of time. Algorithms should never be open-ended
    or infinite. Since each step of an algorithm takes a certain amount of time to
    be completed, this would mean the algorithm would be completed in a finite amount
    of time.


    An incorrect algorithm would be:


    - 1. Start at an amount of 1

    - 2. Add 1 to that amount

    - 3. Go to step 2


    The computer would then count 0, 1, 2, 3, 4, etc. forever.


    For example, “Count from 1 to 10, then print a message that says, ‘I counted from
    1-10,’” would be a correct algorithm because it contains a finite amount of steps.


    ## WELL-ORDERED


    Well-ordered: listed out in the correct sequence and in an organized fashion.
    Computers can only execute an algorithm if it is well-ordered. If it is not well-ordered,
    the computer cannot process it. For example:


    - 1. Close the program

    - 2. Print the program

    - 3. Save the program

    - 4. Exit


    ## EFFECTIVELY COMPUTABLE OPERATIONS


    Effectively computable operations: this refers to a command that can be processed
    successfully by a computer. In programs, many operations are effectively computable,
    which the computer can perform. For example, your computer performs operations
    that are effectively computable, such as: “2 + 2”


    ## UNAMBIGUOUS


    Unambiguous: ambiguous means unclear, confusing, not specified. Un = not. Something
    that is unambiguous means that it is clear and defined.


    In computers, algorithms must be unambiguous. If the instructions are not clear,
    the computer cannot process them.


    ## CHAPTER NINE

    ## FIVE ELEMENTS OF A PROGRAM


    There are five key elements to any program:


    - 1. Entrance

    - 2. Control/Branching (decision points within a program)

    - 3. Variables (data stored in program that can change)

    - 4. Subprograms (programs within programs)

    - 5. Exit


    Let''s go over each of these in detail.


    ## ENTRANCE


    A computer is a simple machine when you get down to it. It can only do one thing
    at a time, and it performs a computer program''s instructions in the exact order
    in which the computer programmer puts them. It can only execute (perform or run)
    an instruction if it is directed to.


    This means that any computer program has to have a clearly marked “first instruction.”
    This is the first task that the computer will perform when the computer program
    is started. From that point forward, each instruction in the program will direct
    the computer what instruction to perform after it performs the current instruction.


    There are different ways to specify the entrance point, depending on which computer
    programming language is being used, but every computer program has a defined entrance
    point.


    ## CONTROL/BRANCHING


    Computers are often used to automate actions that would otherwise be performed
    by people. One of the common things a person will be asked to do in performing
    a job is to assess the condition of a thing and, based on the condition of that
    thing, choose between two or more possible courses of action. In other words,
    they will have to make a decision. An example would be the activity of a “teacher
    grading a stack of papers”


    - 1. Take the next student paper from the top of the stack.

    - 2. Grade the paper.

    - 3. Write the grade on the paper.

    - 4. If the grade is 70% or higher, put the paper in a “Passed” stack.

    - 5. If the grade is below 70%, put the paper in a “Failed” stack.

