    # INTERPRETED


    A compiler is a special program that converts the code that looks nearly English
    into a form that the computer can understand and operate off of. The product of
    a compiler would be a set of instructions for the computer to execute that would
    end up doing what the "nearly English" code described.


    For example, if you typed this instruction within a computer program:


    ```

    if age > 18, print "You are an adult"

    (the symbol > means greater than)

    ```


    A compiler would take what you wrote, change it into a form the computer can understand
    and relay that command to the computer so it can be executed (i.e., machine language
    -a long series of Is and 0s).


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that do not involve converting the entire
    program before it is executed. Instead, each instruction is converted and executed
    one at a time. This is not how a compiler works.


    A compiled programming language uses a compiler.


    An interpreter is a special program that converts high-level language instructions
    into low-level language instructions. An interpreter converts code in this way
    one instruction at a time rather than converting the entire set of instructions
    in the program prior to execution.


    In other words, the interpreter will read an instruction, convert it to the language
    the computer can understand, have the computer execute that instruction, then
    go on to the next instruction in the program and repeat.


    Interpreted programming languages (like Python) use interpreters.


    Now let''s go over how to solve problems in coding.'
