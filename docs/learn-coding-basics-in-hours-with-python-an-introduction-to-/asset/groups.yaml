    常见的格式是“PDF”。它代表“便携式文档格式”（Portable Document Format）。这是由 Adobe 公司在 20 世纪 90 年代开发的文件。开发这种文件格式是为了确保文件在任何计算机上显示都能保持一致。


    文件格式通过其扩展名指示。扩展名是说明文件格式类型（文本、图像、视频等）的代码。扩展名附加在文件名的末尾。


