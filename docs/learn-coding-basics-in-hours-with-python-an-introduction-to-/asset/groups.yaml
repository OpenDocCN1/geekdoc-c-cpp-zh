    作为动词，编码意味着输入指令（使用特定的编程语言）来让计算机执行某些操作。它也指的是网站的创建。开发者通常在 IDE、代码编辑器或文本编辑器中编写代码。


    计算机中的一切都归结为 1 和 0。让我们看看以及为什么。


    ## 第五章

    ## 机器语言


    你可能听过计算机运行 1 和 0 的概念。具体原理超出了本书的范围，但一个简单的解释是，计算机由数十亿可以开启或关闭的小部件组成。1 代表开启，0 代表关闭。你可以通过向计算机输入
    1 和 0 来控制这些部分的开启关闭。这些 1 和 0 被称为机器语言。用机器语言编写的命令被称为机器指令。


    例如，“10010100 01101011 01010110”可以指示计算机“删除 Vacation.doc 文件”。10010100 01101011 01010110”是一条机器指令。


    对于人们来说，阅读和编写机器语言很困难，因为指令只是 1 和零的唯一模式。这就是创建编程语言的原因。计算机将开发者编写的代码转换为机器指令。


    它是这样工作的：


    ![](img/29b742b0a03470e98200c43a70e549de_18_0.png)


    计算机的主要用途之一是互联网。那么，互联网是什么？


    ## 第六章

    ## 互联网与万维网


    万维网（缩写为 www 或 web）是链接电子文档的集合，被组织成名为网站的组。


    网站由一个或多个独立的网页组成，其中“页面”是一个包含文本、图像、视频和其他元素的组织良好的独立文档。


    ![](img/29b742b0a03470e98200c43a70e549de_19_0.png)


    ## 互联网


    网络是两个或多个计算机相互连接的系统。计算机可以通过电缆连接（即有线连接）或无线连接（通过空气）。网络是描述共同工作的事物之间链接的词汇，并在计算机中以许多不同的方式使用。信息可以通过网络在计算机之间共享。


    ![](img/29b742b0a03470e98200c43a70e549de_19_1.png)


    Internet 是“interconnected”（互连）和“network”（网络）这两个词的组合。


