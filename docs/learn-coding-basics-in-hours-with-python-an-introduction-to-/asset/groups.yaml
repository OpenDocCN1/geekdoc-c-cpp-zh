    # THE TECH ACADEMY


    Python tops some lists as the most popular computer programming language in the
    world. This book is an introduction to coding, using Python, for individuals with
    no past technical knowledge or experience.


    Here are some questions for you:


    +   - Are you interested in seeing what coding is like?

    - Would you like to find out if computer programming is something you enjoy doing?

    - Are you considering working in the tech industry?


    If your answer is "yes" to any of these questions, then this book was written
    for you.


    You can complete this book in a matter of hours and at the end, you will not only
    have a fundamental knowledge of Python, you will have a better understanding of
    technology in general.


    We hope you enjoy this book and good luck on your coding journey!


    The Tech Academy is a technology school headquartered in Portland, Oregon, with
    multiple campuses around the world. We specialize in coding boot camps (intensive
    training programs aimed at preparing graduates for entry-level technology positions,
    that can be completed in a few months). We also offer custom training for companies,
    and have published several books.


    To find out more about The Tech Academy, visit: Learncodinganywhere.com


