    # # CHAPTER TWO

    COMPUTERS


    Computers were created to do a simple thing: they take in data (information),
    change the data in some way, and send out data. That''s all.


    ![](img/29b742b0a03470e98200c43a70e549de_11_0.png)


    There are certain truths regarding computers:


    +   1. They are only machines. They are not people.


    +   2. They were created by people and can only act if a person tells them to.
    Even then, they can only perform actions that a person thought ahead of time and
    built into them.


    Computers do not have a soul. They cannot think. Everything ever done by a computer
    was predetermined by humans. Even so-called "artificial intelligence" (computer
    systems that are able to perform actions that require human intelligence, like
    being able to recognize sounds and images), or computers can "learn," only these
    have these abilities because we designed them that way.


    As machines, some of the characteristics of computers include the following:


    +   - They handle data. Data is information – such as words, symbols (something
    written that represents an amount, idea or word), pictures, etc.


    +   - They obey instructions (commands entered into them that perform certain
    tasks).


    +   - They automate (perform actions without human interaction) tasks that would
    either take too long for a person to do or be too boring. Keep in mind that these
    automatic actions were designed by a person.


    +   - They process data. "Process" means to handle something through use of an
    established (and usually routine) set of procedures. When a computer displays
    the word "processing," it is saying, "Hold on while I perform some pre-established
    procedures." Processing refers to "taking actions with data." Searching through
    words to locate typos would be an example of "processing data".'
- md: '

    When data is being processed by a computer, you sometimes see a “progress bar”
    (a symbol that shows how far along something is) like this:


    # Processing...


    Or you may see this symbol when data is processed:


    # Processing


    ![](img/29b742b0a03470e98200c43a70e549de_12_0.png)


    This circular symbol is called a “throbber” due to the fact that they originally
    expanded and contracted in size – i.e., the symbol “throbbed”.


    The purpose of computers is to take in data, process it and send it out.


    When computers perform actions, it is referred to as “executing” or “running.”
    For example, you can run a search on the internet by clicking the search button
    or you could execute an instruction by pressing enter on your keyboard.


    It is important to understand that machines are not life forms. Even though they
    can perform seemingly miraculous operations, the true source of products is humankind.


    ![](img/29b742b0a03470e98200c43a70e549de_12_1.png)


    Computers aren''t very useful without programs – so let''s go over what programs
    are exactly.


    ## CHAPTER THREE

    ## PROGRAMS


    As a noun (thing), code is the written instructions you type into a computer to
    make programs.


    Programs are series of written instructions, entered into a computer, which cause
    the computer to perform a specific task or tasks. For example, word Microsoft®
    Paint is a program that can be used to create basic illustrations on your computer.


    Hardware refers to the physical components of the computer – the parts that can
    be touched. “Hard” means “solid” or “tangible” (able to be seen and felt), and
    “ware” means “something created.


    The computer screen, mouse, printer and keyboard are all hardware.


    ![](img/29b742b0a03470e98200c43a70e549de_13_0.png)


    The opposite of hardware is software. Software is just another word for “computer
    program” – sets of instructions that tell a computer what to do. Computer games,
    like Solitaire, are examples of software.


    Another word for computer program or software is “application.” These terms are
    all interchangeable. Though “app” (abbreviation of application) is usually used
    to refer to programs (applications; software) on a mobile device (like a cell
    phone.


    The word software came about in the 1960s to emphasize the difference between
    it and computer hardware. Software (programs; applications) are the instructions,
    while hardware implements the instructions.


    Installing a program means to put it into a computer so that the program can execute.


    For example, you could install a program by transferring the data from the internet
    to your computer. In the 1990s, most software was installed using a disk that
    came in a box and looked something like this:


    ![](img/29b742b0a03470e98200c43a70e549de_14_0.png)


    The people that create programs are called computer programmers. They''re also
    referred to as coders, software developers, software engineers and just developers.
    These position names all mean the same thing.


    ![](img/29b742b0a03470e98200c43a70e549de_14_1.png)


    Programs are created using programming languages, so let''s discuss what those
    are.


    ## CHAPTER FOUR

    ## PROGRAMMING LANGUAGES


    Languages are communication systems that allow you to transfer ideas in written
    and spoken words. Similar to people, there are different languages (like Spanish
    and English) that can be used to (create) computer programs – these are called
    programming languages or computer languages. Programming languages are organized
    systems of words, phrases and symbols that let you create programs.


    There are many different types of programming languages, each of which was created
    to fill a specific purpose. Usually a language is created in order to make the
    creation of certain types of computer programs easier.


    This is how you would tell a computer to display the words “Hello, world!” on
    the screen, using popular programming language Python:


    ```

    print("Hello, world!")

    ```


    This is the code. All software/applications/programs are made up of code. As a
    user (the person using something), you don’t see the code. The three most common
    types of programs that developers use to write their code in:


    - 1. Integrated development environment (IDE): An IDE is a set of programming
    tools for writing software programs. IDEs are a great aid to computer program
    creation. An IDE often combines many tools into one place. Essentially, an IDE
    is software that helps you make software.


    For example, Visual Studio, available from the technology company Microsoft, is
    one of the many IDEs available for software developers.


    ![](img/29b742b0a03470e98200c43a70e549de_15_0.png)


    IDEs are the most programs used by developers to write their code.


    - 2) Text editor is a program used to write and edit text. Text editors are very
    basic – meaning, the text is typically plain with no effects. This is technically
    different from a word processor, which is a program on a computer that allows
    you to create, format (design the style and layout), modify, and print documents.
    While text editors can be used to write code, word processors cannot. Instead,
    word processors have more functionality (ability to perform a wider array of actions)
    than text editors.


    As an example of, Microsoft Word (on the left) is a word processor, Notepad (on
    the right) is a text editor.


    ![](img/29b742b0a03470e98200c43a70e549de_16_0.png)


    Out of the three programs listed here used to write code within, text editors
    are the least popular and least recommended.


    - 3) Code editor: As the name states, this is a program that can be used to write/edit
    your code. Code editors are between IDEs and text editors in terms of features
    (functions built into an application) – they have fewer features than an IDE but
    more than a text editor. One of the most popular code editors is Notepad++ (plus
    plus).


    As an example, the popular IDE Visual Studio has a feature called “LiveShare,”
    which allows developers to share their code with others as it’s being written.
    Other developers can use LiveShare within Visual Studio to access and edit your
    code from a separate computer! This feature is not included in the code editor
    Notepad++.


    On the other hand, Notepad++ has a cool feature called “auto-completion” that
    suggests various options for completing the code you’re typing for you. For example,
    when you type pr, auto-completion may suggest print. This feature doesn''t exist
    in the text editor Notepad.


    ![](img/29b742b0a03470e98200c43a70e549de_17_0.png)


    As a verb (action), coding means typing out instructions (using a particular programming
    language) to make a program that will make the computer perform certain actions.
    It also refers to the creation of websites. Developers usually code in an IDE,
    code editor or text editor.


    Everything in computers comes down to 1s and 0s. Let''s see how and why that is.


    ## CHAPTER FIVE

    ## MACHINE LANGUAGE


    You may have heard the concept that computers operate on 1s and 0s. How this works
    exactly is beyond the scope of this book, but a simplified explanation is that
    computers are made of billions of tiny parts that can be one or off. 1 represents
    on and 0 represents off. You can instruct these parts on and off by entering a
    1 and 0 into the computer. These 1s and 0s are called machine language. Commands
    written in machine language are called machine instructions.


    As an example, "10010100 01101011 01010110" could instruct the computer to "Delete
    the file Vacation.doc." The "10010100 01101011 01010110" is a machine instruction.


    It is difficult for people to read and write machine language since the instructions
    are just unique patterns of ones and zeroes. That is why programming languages
    were created. The computer converts (translates) the code written by developers
    into machine instructions.


    It works like this:


    ![](img/29b742b0a03470e98200c43a70e549de_18_0.png)


    One of the main uses of computers is the internet. So, what is the internet?


    ## CHAPTER SIX

    ## THE INTERNET AND WORLD WIDE WEB


    The World Wide Web (abbreviated "www" or the "web") is a collection of linked
    electronic documents, organized into groups called websites.


    A website is composed of one or more individual webpages, where a "page" is an
    organized, separate document containing text, images, video and other elements.


    ![](img/29b742b0a03470e98200c43a70e549de_19_0.png)


    ## THE INTERNET


    A network is a system where two or more computers are connected to each other.
    The computers can be connected by a cable (i.e., a wired connection) or connected
    wirelessly (through the air). Network is the word used to describe the link between
    things that are working together and is used in many different ways with computers.
    Information can be shared from computer to computer through the use of a network.


    ![](img/29b742b0a03470e98200c43a70e549de_19_1.png)


    Internet is a combination of the words "interconnected" and "network".

