    互联网是全球范围内许多计算机互互连接的网络。它是目前存在最大的网络，允许计算机相互传递数据。


    在连接到互联网的计算机之间可以往返传输许多不同类型的数据——例如电子信息、电子健康记录等。


    ![](img/29b742b0a03470e98200c43a70e549de_20_0.png)


    除了指的是该网络上计算机之间的连接外，互联网还指一组用于在这些计算机之间传输不同类型数据的协议（agreements, or protocols）。


    “协议”（protocol）是一项正式的程序。在技术领域，它是对特定类型信息如何被格式化和处理的正式描述。基本上，它是一份所有处理该类型信息的各种人员都必须遵守的约定。协议通常以书面文档的形式描述，并且非常精确。它们通常由相关行业的专家创建。


    一种具有协议价值的数据类型示例是医疗保健信息。如果医疗保健行业的各个组织在工作过程中需要在计算机之间往返传输健康数据，那么他们对信息的确切格式、如何保护隐私数据安全等事项达成共识将至关重要。所有这些内容都会记录在书面协议中。医疗保健行业存在多种此类协议。


    对于可以在互联网上传输的每种类型的数据，都创建了一个或多个协议。违反这些协议会导致错误，数据将无法正常发送或无法发送。


    总结一下：互联网是全球范围内许多计算机互连接的网络，也是一组在这些计算机之间传输不同类型数据的约定或协议。


    # 互联网与全球网 (INTERNET VS. WORLD WIDE WEB)


    那么，互联网和全球网之间有什么区别呢？互联网是数据传输的硬件和协议，而网页是通过互联网访问的一种信息类型。网页是一组被称为网页的链接电子文档的集合。


    互联网是基础设施（物理框架），而网页是被传输和显示的代码。在某种意义上，互联网是硬件，网页是软件。


    ![](img/29b742b0a03470e98200c43a70e549de_21_0.png)


    动态（Dynamic）指的是在需要的一刻发生的动作，而不是预先进行。例如，如果一家餐厅在你点餐时按照你的要求准备食物，那么它就是动态的。动态的反面是“静态”（static），其字面意思是“不变的”。静态餐厅会在点餐前就有预先做好并等待的食物——食物不会随时间或情况而改变。


    在编码中，动态意味着当你提出请求时，计算机会处理你的请求——它不会预先有一个设定的结果。


    动态与互联网的关系在于，它描述了那些在查看时内容会发生变化的网站。


    这些是鼠标指针：


    作为一个示例，网站上的动态图片可能是那种当你用鼠标悬停在它上方时会产生效果（移动或变化）的图片（鼠标悬停是指将指针保持在特定对象上方）。


    # 编程 (PROGRAMMING)


    编程（通过编写代码创建计算机程序的行为；编码）是一件很不起的事情，因为它是少数几乎适用于所有行业的技能之一。


    是的，创建软件的公司确实最能利用编码——但如果你仔细考虑，绝大多数行业都会利用技术（软件、网站、数据库等）。因此，编码人员对于任何行业（建筑、餐饮服务、零售、运输等）的公司来说都是宝贵的资产。


    许多许多编程语言，而且技术在不断变化。整个过程可能让人感到无从从，但在广阔的技术领域存在一些通用的基础知识。


    现在，让我们讨论一下 Python 是什么。


    # 第章：Python


    Python 是由荷兰计算机程序员 Guido van Rossum 在 20 世纪 80 年代后期的一种编程语言。van Rossum 出于 1956 年，他在
    2005 年至 2012 年间曾在 Google 工作，在那里他花了一半的时间开发 Python 语言。


    ![](img/29b742b0a03470e98200c43a70e549de_23_0.png)


    在 Python 社区中，Van Rossum 被称为“终身仁慈的独裁者”（BDFL）。BDFL 指的是他继续监督 Python 的开发过程，并在需要时做出决策。


    由于 Python 类似于常见的英语单词和句子，许多人认为它是容易学习的语言之一。Python 可用于创建应用程序、网站、游戏和许多其他东西。它是一种用途非常广、多多的语言。


    Python 以著名的英国电视节目《蒙提派亚剧团》（Monty Python）命名，该节目于 1969 年至 1974 年间播出。


    Python 用于构建许多流行的网络应用程序，例如 Dropbox 和 BitTorrent。Python 甚至被用于开发 YouTube、Yahoo 和
    Google 等搜索引擎。(29b742b0a03470e98200c43a70e549de)


    # 脚本 (SCRIPTS)


    脚本是一种在不需要你参与的情况下，通过自动化任务的一组计算机指令。


    该术语的起源类似于“电影剧本告诉演员做什么”，即脚本告诉计算机做什么。


    Python 可用于创建脚本。例如，使用 Python 创建脚本可以每分钟检查并打印内容。


    脚本语言是一种用于执行任务的语言，而 Python 是一种脚本语言。


    # 高级 (HIGH-LEVEL)


    我们之前讨论的机器语言（0 和 1）被认为是“低级语言”。这是因为它非常接近硬件，直接表示开启或关闭状态。


    低级语言的反面是高级语言，它们以一种易于阅读和编写的方式编写，例如：


    Print Hello


    在这里，你告诉计算机在屏幕上写 Hello。


    所有流行的编程语言都是高级语言——意味着它们使用英语字母、符号和单词。


    Python 是一种高级编程语言。


    # 解释型 (INTERPRETED)


    编译器是一个特殊程序，将看起来类似于英语的代码转换为计算机可以理解和操作的形式。编译器的产物是让计算机执行“接近英语”代码的指令集。


    例如，如果你在计算机程序中输入了以下指令：


    ```

    if age > 18, print "You are an adult"

    ```

    （符号 > 意味着大于）


    编译器会将你写的内容转换为计算机可以理解的形式，并将该命令传递给计算机以便执行（即机器语言——一长串 0 和 1）。


    编译器工作的一个重要方面是它在实际执行程序之前，将程序中的所有指令转换为计算机可以理解的语言。其他将高级语言转换为计算机可读格式的方法不需要在执行之前转换整个程序。相反，每次转换并执行一条。这不是编译器的工作方式。


    编译型编程语言使用编译器。


    解释器是一个特殊程序，将高级语言指令转换为低级语言指令。解释器以这种方式一次转换代码，而不是在执行之前转换整个指令集。


    换句话说，解释器会读取指令，将其转换为计算机理解的语言，让计算机执行该指令，然后处理程序中的下一条指令并重复。


    解释型编程语言（如 Python）使用解释器。

