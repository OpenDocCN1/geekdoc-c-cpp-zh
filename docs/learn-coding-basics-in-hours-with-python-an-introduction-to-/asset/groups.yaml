    符号（Notation）是用于表示数字或数量的一个或多个符号——例如放在数字末尾的 E。这个符号表示“10 的给定指数”。“指数”是一个数字被相乘的幂。在上面出的
    $10^4$ 例子中，4 就是指数。


    ![](img/29b742b0a03470e98200c43a70e549de_54_1.png)


    浮点（Floating point）是表示大数字的一种特定方式。与其写出整个数字，你可以写它的第一部分，然后写一个乘以它的因子。这使得通过执行乘法，你本质上得到了与完全写出该数字完全相同的数字。当你这样做时，你移动了数字中的小数点；因此被称为“浮点”。


    例如，假设数字是三千四百二十五。正常书写是 3425 —— 如果用浮点计数法书写，可以是：3.425 x $10^3$。由于 $10^3$ 是 1000，这意味着“3425
    乘以 1000”，即 3425。


    “浮点数”（float）是计算机使用的一种数据类型。“float”类型用于存储具有极高精度的数字。它主要用于数学目的。


