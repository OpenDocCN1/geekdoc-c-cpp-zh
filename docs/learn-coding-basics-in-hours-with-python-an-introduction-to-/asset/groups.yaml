  mdcn: '


    当计算机正在处理数据时，你有时会看到这样的“进度条”（显示某项任务进度的符号）：


    # 正在处理...


    或者在数据处理时，你可能会看到这个符号：


    # 处理中


    ![](img/29b742b0a03470e98200c43a70e549de_12_0.png)


    这种圆形符号被称为“动画等待”（throbber），是因为它们最初会扩大和缩小——即符号在“跳动”。


    计算机的目的是接收数据、处理数据并发送出去。


    当计算机执行操作时，被称为“执行”或“运行”。例如，你可以点击搜索按钮在互联网上进行搜索，或者通过按下键盘上的回车键来执行指令。


    理解机器不是生命体至关重要。尽管它们可以执行看似奇迹般的操作，但产品的真正源头是人类。


    ![](img/29b742b0a03470e98200c43a70e549de_12_1.png)


    如果没有程序，计算机就毫无用处——所以让我们来过一下程序究竟是什么。


    ## 第三章

    ## 程序


    作为一个名词（事物），代码是你输入到计算机中的编写指令，用于创建程序。


    程序是一系列输入到计算机中的编写指令，这些指令使计算机执行特定的任务或多项任务。例如，微软® 画图是一个程序，可以用于在你的计算机上创建基础插图。


    硬件指的是计算机的物理组件——那些可以触碰的部分。“Hard”（硬）意味着“坚固的”或“有体的”（可见可感），而“ware”（软件）意味着“被创造的东西”。


    计算机屏幕、鼠标、打印机和键盘都是硬件。


    ![](img/29b742b0a03470e98200c43a70e549de_13_0.png)


    硬件的反面是软件。软件只是“计算机程序”的另一种说法——告诉计算机做什么的指令集。计算机游戏（如纸牌游戏）就是软件的例子。


    计算机程序或软件的另一个词是“应用程序”（application）。这些术语都是可以替的。尽管“app”（application 的缩写）通常指移动设备（如手机）上的程序（应用程序；软件）。


    软件一词出现于 20 世纪 60 代，是为了强调它与计算机硬件的区别。软件（程序；应用程序）是指令，而硬件实现这些指令。


    安装程序是指将其放入计算机中以便程序执行。


    例如，你可以通过将数据从互联网传输到你的计算机来安装程序。在 20 世纪 90 年，大多数软件是使用盒装磁盘安装的，看起来像这样：


    ![](img/29b742b0a03470e98200c43a70e549de_14_0.png)


    创建程序的人被称为计算机程序员。他们也被称为代码（coders）、软件开发人员、软件工程师或简单的开发者（developers）。这些职位名称的意思完全相同。


    ![](img/29b742b0a03470e98200c43a70e549de_14_1.png)


    程序是用编程语言创建的，所以让我们讨论一下它们。


    ## 第四章

    ## 编程语言


    语言是通信系统，允许你通过书面和口头语传输思想。与人一样，有不同的语言（如西班牙语和英语）可以用于（创建）计算机程序——这些被称为编程语言或计算机语言。编程语言是词汇、短语和符号的组织系统。


    有许多不同的编程语言，每种语言的创建都是为了特定的目的。通常，创建一种语言是为了让某些类型计算机程序的创建变得更容易。


    这是你如何让计算机在屏幕上显示“Hello, world!”使用流行的编程语言 Python：


    ```

    print("Hello, world!")

    ```


    代码。所有的软件/应用程序都是由代码组成的。作为用户（使用东西的人），你看不到代码。开发者用于编写代码的三种常见类型是：


    1. 集成开发环境（IDE）：IDE 是一套用于编写程序的编程工具。IDE 对程序的创建有很大帮助。IDE 经常将许多工具合并到一个地方。本质上，IDE 是帮助你制作软件的软件。例如，来自微软公司的
    Visual Studio 是许多 IDE 之一。


    ![](img/29b742b0a03470e98200c43a70e549de_15_0.png)


    IDE 是开发者用于编写代码的。


    2. 文本编辑器（Text editor）：用于编写和编辑文本的程序。文本编辑器非常基础——意味着文本通常是纯文本，没有效果。虽然文本编辑器可以编写代码，但处理器不能。相反，处理器具有更多功能（执行更广泛操作的能力）。例如，左侧的
    Microsoft Word 是处理器，右侧的 Notepad 是文本编辑器。


    ![](img/29b742b0a03470e98200c43a70e549de_16_0.png)


    在列出的三个用于编写代码的程序中，文本编辑器是最简单的。


    3. 代码编辑器（Code editor）：顾如名，这是一个可以编写/编辑你的代码的程序。在功能（内置到应用程序中）方面，代码编辑器介于 IDE 和文本编辑器之间。最流行的代码编辑器之一是
    Notepad++。


    作为示例，流行的 IDE Visual Studio 有一个名为“LiveShare”的功能，允许开发者在编写代码时与他人共享。其他开发者可以使用 Visual
    Studio 内部访问并编辑你的代码！此功能没有包含在代码编辑器 Notepad++ 中。


    另一方面，Notepad++ 有一个很酷的功能叫做“自动补全”（auto-completion），可以为你输入的代码提供各种选项。例如，当你输入 pr 时，自动补全可能会建议
    print。此功能在文本编辑器 Notepad 中不存在。


