    The internet is an interconnected network of many computers around the world.
    It is the largest network in existence and allows computers to pass data to one
    another.


    There are lots of different types of data that can be sent back and forth between
    computers connected to the internet – like electronic messages, electronic healthcare
    records, etc.


    ![](img/29b742b0a03470e98200c43a70e549de_20_0.png)


    In addition to referring to the connection between computers on this network,
    internet also means the set of agreements, or protocols, for how to transfer different
    types of data between these computers.


    A "protocol" is an official procedure. In technology, it is a formal description
    of how a certain type of information will be formatted and handled. Basically,
    it''s an agreement that the various people who work with that type of information
    all adhere to. Protocols are usually described in written documents, and are very
    precise. They are usually created by experts in the applicable industry.


    An example of a type of data where a protocol would be valuable healthcare information.
    If various organizations in the healthcare industry were to transfer healthcare
    data back and forth between computers as they perform their work, it would be
    important that they all agree about things like the exact format of the information,
    how to keep private data safe, etc. All of that would be laid down in a written
    protocol. Several such protocols exist in the healthcare industry.


    One or more protocols have been created for each type of data that can be transferred
    around the internet. Violation of these protocols results in an error and the
    data will not be sent properly or at all.


    To recap: the internet is an interconnected network of many computers around the
    world, and a set of agreements, or protocols, for transferring different types
    of data between these computers.


    # INTERNET VS. WORLD WIDE WEB


    So, what’s the difference between the internet and the World Wide Web? The internet
    is the hardware and protocols that data is sent across, whereas the web is one
    type of information that is accessed over the internet. The web is a collection
    of linked electronic documents called webpages.


    The internet is the infrastructure (physical framework) while the web is the code
    that is transmitted and displayed. In a way, the internet is the hardware and
    the web is the software.


    ![](img/29b742b0a03470e98200c43a70e549de_21_0.png)


    Dynamic refers to actions that take place the moment they are needed, rather than
    in advance. For example, a restaurant that prepares your food to your specifications
    when you order, will be dynamic. The opposite of dynamic is “static,” which literally
    means, “unchanging.” A static restaurant would have food pre-cooked and waiting
    before order – the food doesn’t change in regards to time or circumstance.


    In coding, dynamic means the computer processes your request when you ask it to
    – it does not have a predetermined result ahead of time.


    Dynamic relates to the internet by describing websites that have content that
    changes while the website is being viewed.


    These are mouse pointers:


    As an example, a dynamic picture on a website could be one that has an effect
    (movement or change) when you hover over it with a mouse (hovering with a mouse
    refers to holding the pointer over a particular object).


    # PROGRAMMING


    Programming (the action of creating computer programs by writing code; coding)
    is a spectacular thing because it is one of the few skills that apply to virtually
    all industries.


    Yes, companies that create software definitely utilize coding the most – but if
    you think about it, most industries utilize technology (software, websites, databases,
    etc.). And so, coders are valuable assets for companies in any industry – construction,
    food service, retail, transportation, etc.


    There are many, many programming languages, and technology is ever-changing. The
    whole thing can be quite overwhelming, but there are basics that apply across
    the vast landscape of technology.


    Now, let''s discuss what Python is.


    # CHAPTER SEVEN: PYTHON


    Python is a programming language created in the late 1980s by Dutch computer programmer
    Guido van Rossum. Born in 1956, van Rossum worked for Google from 2005 to 2012,
    where he spent half of his time developing the Python language.


    ![](img/29b742b0a03470e98200c43a70e549de_23_0.png)


    In the Python community, Van Rossum is known as the "Benevolent Dictator For Life"
    (BDFL). BDFL refers to the fact that he continues to oversee the Python development
    process, making decisions where necessary.


    Due to the fact that Python resembles common English words and speech, it is considered
    by many to be one of the easier languages to learn. Python can be used to create
    apps, websites, games, and many other things. It is a very versatile language
    with many uses.


    Python was named after the famous British TV show Monty Python, which aired from
    1969–1974.


    Python is used to build many popular web applications, e.g., Dropbox and BitTorrent.
    Python was even put to use in developing the search engines of YouTube, Yahoo,
    and Google.


    ![](img/29b742b0a03470e98200c43a70e549de_24_0.png)


    # SCRIPTS


    A script is a set of computer instructions that automates a task so that a multi-part
    task can occur without your involvement.


    The origin of the term is similar to its meaning in "movie script tells actors
    what to do," in that a script tells a computer what to do.


    Python can be used to create scripts. For example, using Python, a script could
    be created that checks for new orders created at a manufacturing company every
    ten minutes and prints them off on a printer.


    A scripting language is a computer language used to make scripts and Python is
    a scripting language.


    # HIGH-LEVEL


    Machine language that we discussed earlier (Is and Os) is considered a "low-level
    language." This is due to the fact that it is close to the hardware of the computer
    in that it directly represents the on or off states used in both the computer
    instructions and the data the computer operates on.


    The opposite of a low-level language is a high-level language – code written in
    a way that is easier to read and write because it somewhat resembles English,
    such as:


    Print "Hello";


    Here, you are telling the computer to write out the word Hello on the screen.


    All the most popular programming languages are high-level languages – meaning,
    they use English letters, symbols and words.


    Python is a high-level programming language.


    # INTERPRETED


    A compiler is a special program that converts the code that looks nearly English
    into a form that the computer can understand and operate off of. The product of
    a compiler would be a set of instructions for the computer to execute that would
    end up doing what the "nearly English" code described.


    For example, if you typed this instruction within a computer program:


    ```

    if age > 18, print "You are an adult"

    (the symbol > means greater than)

    ```


    A compiler would take what you wrote, change it into a form the computer can understand
    and relay that command to the computer so it can be executed (i.e., machine language
    -a long series of Is and 0s).


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that do not involve converting the entire
    program before it is executed. Instead, each instruction is converted and executed
    one at a time. This is not how a compiler works.


    A compiled programming language uses a compiler.


    An interpreter is a special program that converts high-level language instructions
    into low-level language instructions. An interpreter converts code in this way
    one instruction at a time rather than converting the entire set of instructions
    in the program prior to execution.


    In other words, the interpreter will read an instruction, convert it to the language
    the computer can understand, have the computer execute that instruction, then
    go on to the next instruction in the program and repeat.


    Interpreted programming languages (like Python) use interpreters.

