    你可以看到这里有两种可能的“路径”。一条路径是“根据决策而产生的可能行动方案”。把它想象成当你来到一个道路分叉口时所发生的情况。你必须决定一个行动方案——你走哪条路？这也被称为“分支”（branch）。


    除了最简单的计算机程序外，所有的程序都需要执行相同的操作。也就是说，它们必须检查某项数据的值条件，并根据该数据的值条件执行不同的计算机指令集。


    为了实现这一点，程序将使用称为“控制”（control）指令的特殊指令。这些指令只是告诉计算机在做决定时应该查看什么，然后告诉计算机对于每种可能的决策应该做什么。计算机最基础的控制语句是“if”（如果）。它的用法如下：


    ```

    IF [要检查的条件已检查] THEN [要执行的计算机指令分支]

    ```


    在这里，“IF”是控制语句；“THEN”是分支指令，如果控制语句为真（true），它指向要执行的程序路径。


    ## 变量 (VARIABLES)


    变量是计算机程序使用的一部分数据，用于跟踪随程序执行而可能变化的值。这可能是像“刚刚批完的学生试卷分数”或“流水线上下一辆汽车使用的油漆颜色”之类的。


    变量是任何计算机程序至关重要的部分，因为它们使得计算机程序能够用于单一的、预定义的值之外。你可以想象，如果“流水线上下一辆汽车使用的油漆”只能是“蓝色”，那么使用该数据的计算机程序将毫无用处。让计算机程序能够为每辆即将喷漆的汽车更改该值将要有意义得多。


    在计算机程序中编写变量时，它们通常以如下方式编写：


    ```

    [变量名] = [变量值]

    ```


    例如，你可能会有这样的代码：


    ```

    color = "red"

    ```


    在这里，变量名为“color”（颜色），该变量的值被设置为“red”（红色）。换句话说，名为“color”的变量现在“等于”单词“red”。


    让我们来看“老师批一叠试卷”的例子。在这里，我们可以有一个名为“Paper Grade”（试卷分数）的变量，它每当老师批一张试卷时就会改变一次。你还可以为试卷总题数（“Total
    Questions”，总题数）、正确回答的数量（“Correct Questions”，正确题数）以及试卷分数设置变量。


    上面的书面描述如下：


    - 从“待批改”堆的顶部取出下一张学生试卷。

    - 批改试卷。

    - 将分数写在试卷上。

    - 如果分数是 70% 或以上，将试卷放入“已通过”堆中。

    - 如果分数低于 70%，将试卷放入“未通过”堆中。


    在计算机语言中，该过程可能像这样：


    - 获取下一张卷 (Retrieve Next Paper)

    - 设置总题数 = [当前试卷中的总题数]

    - 批改卷 (Grade Paper)

    - 设置正确题数 = [正确回答的数量]

    - 设置试卷分数 = [正确题数/总题数]

    - 如果 (Paper Grade >= 70%) 则试卷状态 = “passed”（通过）

    - (Paper Grade < 70%) 则试卷状态 = “failed”（失败）


    这是一个简单的计算机程序。


    注意，>=（大于号后跟等号）是一个用于表示应该进行比较的符号。具体来说，这个“大于等于”符号是一个指令，用于检查符号左侧的数据在金额或数量上是否大于或等于右侧的数据。此项比较的答案是“true”（真）或“false”（假）。


    例如：5 >= 4


    这意味着“检查 5 是否大于或等于 4”。由于 5 大于 4，答案是“true”。


    另一个例子：3 >= 6

    这意味着“检查 3 是否大于或等于 6”。答案是“false”。


    最后一个例子：6 >= 6


    这意味着“检查 6 是否大于或等于 6”。答案是“true”。


    >= 的反向（相反）符号是 <=，它检查符号左侧的数据是否少于或等于右侧的数据。


    每当计算机运行之前列出的七步程序时，程序中的每个变量都可能有不同的值，这取决于正在改的试卷有多少道题，以及学生正确回答了其中多少道题。


    例如，假设试卷有 100 道题，学生正确回答了其中 82 道。程序运行后，结果如下：


    | 总题数: 100 |

    | 正确题数: 82 |

    | 试卷分数: 82% |

    | 试卷状态: 通过 (Passed) |


