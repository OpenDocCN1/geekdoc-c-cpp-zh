    ## ## SYNTAX


    Every spoken language has a general set of rules for how words and sentences should
    be structured. These rules are known as the syntax of that particular language.
    In the programming languages, syntax serves the same purpose. Syntax is the rules
    you must follow when talking to a computer and telling it what to do. There are
    many languages you can use to program a computer. Each language has its own syntax.
    Failing to use the syntax of a particular language correctly can mean whatever
    you are designing not work at all.


