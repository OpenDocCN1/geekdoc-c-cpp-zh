    Tar is a type of file format, as well as the name of a program used to handle
    such files. The name comes from the two words “tape archive.”


    Tar is now commonly used to collect many files into one larger file for distribution
    or archiving while preserving file system information such as user and group permissions,
    dates, and directory structures.'
  - '[PAGE 44]


    In order to reduce storage requirements, used tar files can be compressed. The
    most common program used to compress tar files is a compression program called
    gzip. Tar files that have been compressed by the gzip program have the file extension
    "tar.gz." In order to access the tar file, the gzip program must be used to decompress
    the tar file. There are other decompression programs available that are capable
    of decompressing .gz files as well.


    # OPERATORS


    In mathematics, an operator is a symbol used to carry out a computation (that
    act of figuring out the amount of something using math). There are several different
    kinds of operators. Arithmetic operators, such as:


    +   + (add),

    - (subtract),

    - (divide), and

    * (multiply)


    are used to perform math operations.


    # ARRAYS


    An array is a collection of data, arranged so that each piece of data in the collection
    can be individually identified. In computers, an array is a group of related things
    that are stored together in a sequence. It is a ways things can be organized in
    a computer in a logical way. Arrays can be quite simple, or quite complex.


    A simple array would be something like the numbers 7, 3 and 15. It would be written
    out like this:


    ```

    [7, 3, 15]

    ```


    These three pieces of data are called elements - they are the elements of the
    array.


    A system is needed for identifying each element of an array. This is done by labeling
    each position in the array. The simplest method for this is to start numbering
    them at zero, starting at the left position and counting up from there.


    It is important to understand that the index only tells the position of the element
    in the array, and not the value of the element at that position.


    In the above example, the element with a value of "7" would be at position 0,
    the element with a value of "3" would be at position 1, and the element with a
    value of "15" would be at position 2.'
  - '[PAGE 45]


    Another word for the position of an element is the "index" of the element - for
    the above example of an array, the element at index 0 has a value of "7," the
    element at index 1 has a value of "3," etc.


    Each element, therefore, has two properties: its index and its value.


    As another example, let''s say you have three pictures of your cat, and could
    save them in an array: CatPic1, CatPic 2, and CatPic 3. Here, the element at index
    1 has a value of "CatPic2."


    # MEMORY


    Memory is a physical device used to store information on a computer. It is recorded
    electronic data that can be accessed in the future. A memory device could be thought
    of as a collection of boxes called "memory locations." A memory location has two
    aspects: a unique identifier, called an "address," and the actual data stored
    in that location.


    # IDENTIFIERS


    The names of variables are called identifiers.


    A variable could have an identifier of "age," have a value of "27" and be stored
    at memory location 1000.


    When you create computer programs, you will often make use of variables. This
    involves two actions:


    +   1. Designating a particular memory location and an associated identifier.
    This is called "declaring" the variable.

    2. Setting the value of the data to be stored in the memory locations. This is
    called "assigning" the value to the variable.


    A data type is a distinct type of data used by a computer. There are several data
    types. A data type includes the type of information represented by the data as
    well as the behavior of the data. This information tells the computer what kind
    of information it is working with and what things it can do with information.


    An integer is a data type that represents whole numbers (numbers that don''t have
    any fractions). This could be like 5, -8, 1024, etc. The number 4.5 would not
    be an integer because it includes a fraction of a number in its value. The behavior
    of this data type includes mathematical operations like addition, subtraction,
    etc.'
  - '[PAGE 46]


    An integer variable would be declared and assigned like this:


    integer [variable name] = [whole number]


    For example, you could have a computer keep track of the number of students in
    a class using a variable called "classSize." You could set it to 25 like this:


    integer classSize = 25


    # STRINGS


    A string is a data type that represents text – that is, letters, numbers, and
    other symbols. The behavior of this data type includes things you would do with
    text – add on more symbols, convert the text to uppercase.


    A string variable would be declared and assigned like this:


    Alphanumeric means "made up of letters and numbers."


    As an example of a string, you could have a computer keep track of the name of
    a student using a string variable called "studentName." You could set it to "Jane
    Smith" like this:


    string studentName = "Jane Smith"


    # CONCATENATING A STRING


    Concatenate means to connect items together, like links in a chain. It means to
    take one piece of data and stick it on the end of another piece of data. For example,
    concatenating the string "dev" and the string "ices" makes the string "devices."


    # EXPRESSIONS


    Expressions are numbers and symbols and operators grouped together that show the
    amount of something. An expression is a written math problem.


    In coding, an expression is a combination of values that are computed by the computer.
    There are different ways to write out expressions, depending on which language
    you are programming in.'
