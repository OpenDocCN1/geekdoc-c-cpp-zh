    # TAR


    Tar is a type of file format, as well as the name of a program used to handle
    such files. The name comes from the two words “tape archive.”


    Tar is now commonly used to collect many files into one larger file for distribution
    or archiving while preserving file system information such as user and group permissions,
    dates, and directory structures.


    In order to reduce storage requirements, used tar files can be compressed. The
