    Tar 是一种文件格式，也是用于处理此类文件的程序名称。该名称来源于两个单词“tape archive”（磁带存档）。


    Tar 现在通常用于将许多文件收集到一个较大的文件中进行分发或归档，同时保留文件系统信息，如用户和组权限、日期和目录结构。


    为了减少存储需求，使用的 tar 文件可以被压缩。用于压缩 tar 文件最常用的程序是名为 gzip 的压缩程序。被 gzip 程序压缩后的 tar 文件具有文件扩展名
    "tar.gz"。要访问该 tar 文件，必须使用 gzip 程序解压该 tar 文件。还有其他解压程序也可以解压 .gz 文件。


