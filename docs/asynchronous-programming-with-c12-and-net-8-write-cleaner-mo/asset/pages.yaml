  md: '# Appendix


    Glossary of Asynchronous Programming Terminology


    Understanding the terminology used in asynchronous programming with C# 12 and
    .NET 8 is crucial for developers to effectively design, implement, and debug asynchronous
    code. Here''s a glossary of key terms and concepts related to asynchronous programming
    in C# 12 and .NET 8:


    # Asynchronous Programming Glossary:


    +   1. **Asynchronous Programming:** Asynchronous programming is a programming
    paradigm that allows tasks to execute independently and concurrently without blocking
    the main thread of execution.

    +   2. **Task:** A `Task` represents an asynchronous operation that can be started,
    awaited, and managed asynchronously. It encapsulates the execution of a method
    or operation that may complete asynchronously.

    +   3. **Async/Await:** `async` and `await` are keywords in C# that enables asynchronous
    programming. `async` marks a method as asynchronous, and `await` is used to asynchronously
    wait for the completion of an awaited task.

    +   4. **Task-Based Asynchronous Pattern (TAP):** TAP is a design pattern for
    asynchronous programming in .NET that emphasizes using `Task` and `Task<T>` types
    to represent asynchronous operations.

    +   5. **Concurrency:** Concurrency refers to the ability of a system to handle
    multiple tasks or operations simultaneously. Asynchronous programming facilitates
    concurrency by allowing tasks to run concurrently without blocking.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '+   6. **I/O-Bound vs. CPU-Bound**: I/O-bound operations involve waiting for
    input/output operations such as disk I/O, network requests, or database queries.
    CPU-bound operations, on the other hand, are computational tasks that consume
    CPU resources heavily.


    +   7. **ThreadPool**: The ThreadPool is a managed thread pool provided by .NET
    that manages a pool of worker threads to execute asynchronous and parallel tasks
    efficiently.


    +   8. **Task Scheduler**: The Task Scheduler is responsible for scheduling and
    managing the execution of tasks in .NET. It ensures that tasks are executed on
    appropriate threads and provides a mechanism for task prioritization.


    +   9. **Continuation**: A continuation is an operation that is scheduled to run
    after the completion of a task or asynchronous operation. Continuations are commonly
    used with async/await to specify follow-up actions.


    +   10. **Cancellation Token**: A `CancellationToken` is a mechanism for canceling
    asynchronous operations. It allows for cooperative cancellation by signaling to
    an asynchronous operation that it should be canceled.


    +   11. **Async Method**: An async method is a method marked with the `async`
    keyword, indicating that it contains asynchronous operations. Async methods can
    use `await` to asynchronously wait for the completion of other async operations.


    +   12. **Awaitable Types**: Awaitable types are types that can be used with the
    `await` keyword. This includes tasks (`Task`), value tasks (`ValueTask`), custom
    awaitable types implementing the `GetAwaiter` pattern, and asynchronous enumerables
    (`IAsyncEnumerable`).


    +   13. **Parallelism**: Parallelism refers to the simultaneous execution of multiple
    tasks or operations, typically on'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'multiple CPU cores. TPL (Task Parallel Library) in .NET facilitates parallelism
    through constructs like `Parallel.ForEach` and PLINQ.


    **14. Memory Management:** Memory management in asynchronous programming involves
    efficient allocation and deallocation of memory resources. Techniques such as
    memory pooling, using `Memory<T>` or `ArrayPool<T>`, and managing large object
    heap (LOH) allocations are essential for optimizing memory usage.


    **15. Resource Pooling:** Resource pooling involves reusing and managing pooled
    resources such as database connections, HTTP connections, and memory buffers to
    reduce overhead and improve scalability.


    **16. Cancellation and Timeout:** Cancellation allows for canceling long-running
    asynchronous operations using cancellation tokens. Timeout mechanisms can be used
    to specify a maximum duration for an operation, after which it is considered timed
    out.


    **17. Error Handling:** Error handling in asynchronous programming involves handling
    exceptions and errors that may occur during asynchronous operations. Techniques
    such as `try-catch` blocks, `Task` return values, and `Task.Exception` property
    are used for error handling.


    Understanding these terms and concepts is essential for mastering asynchronous
    programming in C# 12 and .NET 8, enabling developers to build high-performance,
    scalable, and responsive applications that leverage the power of asynchronous
    programming paradigms.'
