    and easier to read. Let''s explore how top-level statements can be used effectively
    in asynchronous code using C# 12 and .NET 8, along with code examples.


    # 1. Top-Level Statements Overview:


    Top-level statements were introduced in C# 9 as a way to simplify entry points
    and reduce ceremony in code files. They allow developers to write code without
    explicit namespaces, class declarations, or Main method signatures, making code
    files more focused on the actual logic rather than setup.


    # 2. Using Top-Level Statements in Asynchronous Code:


