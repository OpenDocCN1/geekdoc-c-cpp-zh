    ## 1. Tasks in the Task Parallel Library:\n\nA `Task` in the TPL represents an\
    \ asynchronous operation that can run concurrently with other tasks. It encapsulates\
    \ both the state and the result of an operation, making it easy to work with asynchronous\
    \ code.\n\n### Creating and Running Tasks:\n\n```csharp\nusing System;\nusing\
    \ System.Threading.Tasks;\npublic class Program\n{\n    public static async Task\
    \ Main()\n    {\n        // Create and start a new task\n        Task<int> task\
    \ = Task.Run(() =>\n        {\n            return CalculateSum(10, 20);\n    \
