    \n## C# 12 和 .NET 8 中的额外优势和功能：\n\n- 1. **资源消耗降低：** 与传统的同步编程相比，异步编程通过允许任务更高效地共享线程来减少资源消耗。这导致更好的资源利用率以及管理并发操作时更低的开销。\n\
