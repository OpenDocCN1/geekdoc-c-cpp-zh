    \n### Cancellation Example:\n\n```csharp\nusing System;\nusing System.Threading;\n\
    using System.Threading.Tasks;\npublic class Program\n{\n    public static async\
    \ Task Main()\n    {\n        // Create a cancellation token source\n        CancellationTokenSource\
    \ cts = new CancellationTokenSource();\n        CancellationToken token = cts.Token;\n\
    \n        // Start a task that can be cancelled\n        Task longRunningTask\
    \ = Task.Run(() =>\n        {\n            while (!token.IsCancellationRequested)\n\
    \            {\n                Console.WriteLine(\"Task running...\");\n    \
    \            Thread.Sleep(1000); // Simulate work\n            }\n           \
    \ Console.WriteLine(\"Task cancelled.\");\n        }, token);\n\n        // Wait\
    \ for user input to cancel the task\n        Console.WriteLine(\"Press Enter to\
    \ cancel the task.\");\n        Console.ReadLine();\n\n        // Cancel the task\
    \ using the cancellation token\n        cts.Cancel();\n        await longRunningTask;\
    \ // Wait for the task to complete (optional)\n    }\n}\n```\n\nIn this example,\
    \ we create a cancellation token source (`CancellationTokenSource`) and use it\
    \ to cancel a long-running task when the user presses Enter.\n\n## 4. Exception\
    \ Handling with Tasks:\n\nTasks in the TPL support exception handling to handle\
