    \n            if (message != null)\n            {\n                Console.WriteLine($\"\
    Received message: {message.Body}\");\n                await receiver.CompleteMessageAsync(message);\n\
    \            }\n            else\n            {\n                break; // No\
    \ more messages available\n            }\n        }\n    }\n}\n```\n"
