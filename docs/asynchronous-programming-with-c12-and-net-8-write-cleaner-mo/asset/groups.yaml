    \ 方法使用 `lock` 语句来确保递增 `_count` 字段时的线程安全。\n\n## 避免死锁：\n## 1. 避免嵌套锁：\n- 避免嵌套锁，因为这可能导致死锁，即线程互相无限期等待。\n\
    - 如果必须获取多个锁，请确保在所有代码路径中以一致的顺序获取它们。\n\n## 2. 超时与 Try/Catch：\n- 在获取锁时使用超时和 try/catch\
