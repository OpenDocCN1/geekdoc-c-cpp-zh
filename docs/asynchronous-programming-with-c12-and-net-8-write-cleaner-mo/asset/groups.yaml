    \    }\n    public static int CalculateSum(int a, int b)\n    {\n        return\
    \ a + b;\n    }\n}\n```\n\nIn this example, we create and run a task using `Task.Run`,\
    \ which executes the `CalculateSum` method asynchronously and returns the sum\
    \ of two numbers.\n\n## 2. Task Continuations:\n\nTask continuations allow you\
    \ to specify code that should execute after a task completes, either successfully\
    \ or with an exception. This enables chaining of asynchronous operations and handling\
    \ of results.\n\n### Using Task Continuations:\n\n```csharp\npublic class Program\n\
    {\n    public static async Task Main()\n    {\n        Task<int> initialTask =\
    \ Task.Run(() =>\n        {\n            return CalculateSum(10, 20);\n      \
    \  });\n\n        // Specify a continuation to execute when the initial task completes\n\
    \        Task continuationTask = initialTask.ContinueWith(task =>\n        {\n\
    \            int result = task.Result;\n            Console.WriteLine(\"Continuation\
    \ Result: \" + result);\n        });\n\n        await continuationTask; // Wait\
    \ for the continuation to complete\n    }\n}\n\npublic static int CalculateSum(int\
    \ a, int b)\n{\n    return a + b;\n}\n```\n\nIn this example, `ContinueWith` is\
    \ used to create a continuation task that executes after the initial task completes,\
