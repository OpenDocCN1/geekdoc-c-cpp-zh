  mdcn: "\n## 使用 C#12 和 .NET 8 进行异步编程\n\n编写更简洁、更高效的异步代码。构建响应式用户界面和可扩展的 Web 服务等！\n\n\
    作者\n\nKatie Millie\n\n## 版权声明\n\n版权所有 © 2024 Katie Millie。保留所有权利。\n\n本出版物受版权法保护，因此，未经出版商事先书面同意，不得以任何方式复制、分发或传播其任何部分，除法律允许的用于评论或其他非商业用途的简短引用外。未经授权复制或分发本作品的行为严格禁止，可能导致法律后果。作者\
    \ Katie Millie 声明其精神权利，包括被承认为创作者的权利以及反对可能损害其声誉的任何修改的权利。我们感谢您对 Katie Millie 奉献精神和创造力的尊重。\n\
    \n## 目录\n\n- 引言\n- 第 1 章\n  - 理解现代应用中同步编程的局限性\n  - 异步编程的好处：改善响应性、可扩展性和性能\n   \
    \ - 异步编程的关键概念：任务、异步方法、await 关键字\n      - 探索异步编程在各个领域（例如 Web 开发、UI 交互、云服务）的实际应用\n\
    - 第 2 章\n  - 利用顶层语句编写更简洁、更精炼的异步代码\n  - 利用异步流高效处理数据流（例如网络通信、大文件 I/O）\n    - 探索异步编程相关的其他\
    \ C#12 功能（例如静态异步方法、改进的模式匹配）\n- 第 3 章\n  - 深入探索任务并行库（TPL）及其组件（任务、延续、取消）\n  - 使用\
    \ TPL 构造有效创建和管理异步任务\n    - 利用高级 TPL 模式处理常见的异步操作（例如 WhenAll、WhenAny、WaitAll）\n\
    - 第 4 章\n  - 使用 async/await 实现异步 I/O 操作以提高响应性\n  - 使用 async/await 处理具有多个结果和异常的异步操作\n\
    \  - 使用 await 关键字链接异步操作并探索最佳实践\n- 第 5 章\n  - 利用异步编程进行网络通信（例如 HTTP 请求/响应）\n  -\
    \ 使用链接的异步方法构建复杂场景的异步工作流\n  - 实现并发异步操作以实现高效的资源利用\n  - 利用 .NET 库中的异步功能，如 HttpClient\
    \ 和 Entity Framework Core 8（如果适用）\n- 第 6 章\n  - 在 WPF 和 Windows Forms 中使用异步操作设计响应式用户界面（UI）\n\
    \  - 在异步上下文中处理 UI 更新和数据绑定\n  - 利用异步模式处理常见的 UI 交互（例如按钮点击、数据加载）\n- 第 7 章\n  - 使用\
    \ ASP.NET Core 8 构建响应式和可扩展的 Web 应用程序\n  - 高效处理异步 HTTP 请求和响应\n  - 利用异步中间件和服务实现更清晰的架构\n\
    \  - 探索 IAsyncEnumerable 等功能以处理 Web 应用程序中的大型数据流\n- 第 8 章\n  - 利用异步编程高效集成云服务（例如\
    \ Azure Functions、AWS Lambda）\n  - 为事件驱动架构构建异步无服务器函数\n  - 实现云消息传递和分布式系统的异步通信模式\n\
    - 第 9 章\n  - 异步代码的有效测试策略\n  - 利用单元测试框架（例如 xUnit、NUnit）进行异步场景\n  - 模拟异步依赖项并模拟异步行为\n\
    \  - 编写清晰且可维护的异步单元测试的最佳实践\n- 第 10 章\n  - 像专业人士一样调试异步应用程序\n  - 利用调试工具追踪异步执行流程\n\
    \  - 有效处理异步代码中的异常和错误场景\n- 第 11 章\n  - 设计结构良好的异步 API 和模式\n  - 利用常见的异步设计模式（例如生产者-消费者、事件驱动）实现清晰和可维护性\n\
    \  - 确保异步代码中的线程安全并避免竞争条件\n- 第 12 章\n  - 使用分析工具识别异步代码中的性能瓶颈\n  - 应用优化技术以提高效率（例如任务取消、内存管理）\n\
    \  - 平衡并发和资源利用以实现最佳\n\n## 引言\n\n### 征服响应性：释放 C#12 和 .NET 8 异步编程的强大力量\n\n在当今瞬息万变的数字世界中，用户要求即时满足。传统的同步编程虽然熟悉，但在某些情况下会成为瓶颈，导致应用程序迟缓且无响应。想象一下用户点击按钮，然后……什么都没有。就像看着油漆干燥一样。开发人员面临关键选择：接受卡顿的应用程序，或深入异步编程的世界，这是构建真正响应且面向未来的应用程序的秘密武器。\n\
    \n**使用 C#12 和 .NET 8 进行异步编程** 是您掌握这一突破性范式的全面指南。忘掉枯燥的理论；本书为您提供实践技能和知识，帮助您构建以下类型的应用程序：\n\
    \n- **即时响应：** 提供无缝的用户体验，单击、操作和数据检索不会出现令人沮丧的延迟。\n- **同时处理复杂任务：** 摆脱同步工作流的限制，利用并发高效地处理多个任务。\n\
    - **轻松扩展：** 设计能够优雅处理日益增长的工作负载的应用程序，确保在压力下保持一致的性能。\n\n**本书不仅仅是一系列代码示例的集合。它是您成为异步编程专家的路线图。**\
    \ 无论您是经验丰富的 C# 开发者，还是渴望提升编程技能的新手，您都将获得以下收获：\n\n- **掌握最新的 C#12 功能：** 利用前沿功能如顶层语句和异步流，使异步代码更简洁、高效且流畅。\n\
    - **发挥 .NET 8 的强大功能：** 释放 .NET 8 的性能和效率增强功能，让您的应用程序比以往任何时候都运行得更快、更顺畅。\n- **深入实际应用：**\
    \ 超越理论，探索跨不同领域的实践示例。学习如何在用户界面、云服务、网络通信等领域实现异步编程。\n- **征服高级技术：** 探索复杂的异步工作流、并发操作以及流等前沿异步功能，以应对任何编程挑战。\n\
    - **自信测试：** 了解测试异步代码的挑战，并通过确保代码质量和可靠性的有效策略来征服它们。\n- **为成功而设计：** 学习打造结构良好且高效的异步\
    \ API、模式和代码的艺术，避免常见陷阱并确保可维护性。\n\n### 以下是您将探索的精彩主题预览：\n\n- **转变 UI 交互：** 通过实施异步\
    \ UI 编程技术，使您的应用程序感觉响应迅速且流畅。用户不再需要等待屏幕！\n- **构建可扩展的 Web 应用程序：** 利用 ASP.NET Core\
    \ 8 和异步功能的强大功能，创建能够在不费力的情况下处理海量流量的 Web 应用程序。\n- **征服云服务：** 无缝集成 Azure 和 AWS 等云提供商，利用异步模式实现高效的无服务器函数和通信。\n\
    - **优化效率：** 识别性能瓶颈并应用优化技术，确保您的异步应用程序以峰值性能运行。\n\n**不要只构建应用程序；构建用户喜爱的应用程序。** 本书使您能够摆脱同步编程的限制，释放\
    \ C#12 和 .NET 8 的全部潜力。随着您掌握异步编程，您将能够提供卓越的用户体验，实现更大的可扩展性，并为您的开发技能提供未来保障。\n\n"
