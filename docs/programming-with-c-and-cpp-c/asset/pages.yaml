  md: "# Overloading « operator\n\nThe << operator can be overloaded as well. Below\
    \ is one example of overloading the << operator.\n\nThe prototype of << << is\
    \ fixed and must look like this,\n\n```\nstd::ostream &operator<<(std::ostream\
    \ &os, <class name>);\n```\n\nThe Os argument is the output stream, the cout takes\
    \ the os so the << operator return it back.\n\nThus the arguments must be filled\
    \ to the os from the class given in the other argument.\n\nOne of the ways to\
    \ do is as follows.\n\n```\nClass S {\n    int a;\n    public:\n    int get()\
    \ { return a; }\n}\n```\n\n```\nstd::ostream &operator<<(std::ostream &os, const\
