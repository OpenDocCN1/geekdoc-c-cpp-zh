  md: "# 1. add\n\nAdding an element can be as simple as adding an element at the\
    \ end.\n\nIf there are no elements in the list, add the element at the head. If\
    \ there are\\lements in the list, add the element after tail. When ever an element\
    \ is added\n the tail to the last element.\n\n```\nint add(void *data) {\n   \
    \ struct linked_list *node;\n\n    node = calloc(1, sizeof(struct linked_list));\n\
