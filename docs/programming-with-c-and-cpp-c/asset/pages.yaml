  md: "# Threads\n\nC++ implements abstraction of threads based upon the threads.\
    \ The class std::thread defines the thread interface. Threads defined in C++11\
    \ onwards.\n\nCreating a thread is a simple job of declaring a thread object and\
    \ passing the function that serves as a thread function.\n\nBelow is one example:\n\
    \n```\n#include <iostream>\n#include <thread>\n\nvoid thread_f() {\n    std::cout\
    \ << \"in thread\" << std::endl;\n}\n\nint main() {\n    std::thread t(thread_f);\n\
    \    std::cout << \"starting thread\" << std::endl;\n    t.join();\n    std::cout\
    \ << \"joined thread\" << std::endl;\n}\n```\n\nCompile the above program with\
    \ -pthread option. Some compilers may not require this option.\n\nBelow are few\
    \ methods presented in std::thread.\n\n| S.No | Method | Description |\n| 1 |\
    \ operator= | moves thread object |\n| 2 | joinable | check if the thread is joinable\
