  md: "# Linked Lists\n\nLinked list is a chain of elements terminated with a NULL\
    \ pointer.\n\nEach item in chain is called the node. Each node contains data and\
    \ a pointer to the next item in the list. The last node pointer will be NULL.\n\
    \nLinked list structure looks as follows:\n\n```\n|------|-------|-------|------|\n\
    | item 1 |----> item 2 |----> item 3 |-- . . -> NULL\n|------|       |       |------|\n\
    ```\n\nThe list always ends with a NULL pointer.\n\nThe linked list structure\
    \ looks as follows:\n\n```\nstruct linked_list {\n    void *elem;\n    struct\
    \ linked_list *next;\n}\n```\n\nthe data pointer holds the data and the next pointer\
    \ links to the next element in the list.\n\nBelow are some of the general operations\
    \ on the list.\n\n| S.No | Name | Description |\n| 1 | add | Add an element to\
    \ the list at the end |\n| 2 | add_head | Add an element to the list at the head\
    \ |\n| 3 | delete | delete an element from the list |\n| 4 | find | find an element\
    \ in the list |\n| 5 | count | count the number of elements in the list |\n| 6\
    \ | for_each | iterate through each element in the list |\n| 7 | print | print\
    \ all the elements of the list |\n| 8 | clean | clean all linked list and free\
    \ up the memory allocated |\n\nDefine two global variables head and tail.\n\n\
    ```\nstatic struct linked_list *head;\nstatic struct linked_list *tail;\n```\n\
    \nWe use two pointers head and tail. The head is used to iterate over each element\
    \ from the beginning and tail is used to add element at the end."
