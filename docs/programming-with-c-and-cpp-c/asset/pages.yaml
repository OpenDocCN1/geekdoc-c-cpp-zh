  md: '# Scope and Lifetime of the variables


    We have declared many variables over the examples. Each variable declared within
    the function has some certain scope and lifecycle.


    In the above function, the variables a and b are called local variables. This
    means that the scope of these variables are within the lifetime of the function.
    If the function returns the variables will be destroyed or removed from the memory.


    Each program has a determined memory set aside by default by the operating system.
    This memory is divied set aside into the following partitions.


    +   1. stack segment

    2. heap segment

    3. data segment

    4. text segment'
