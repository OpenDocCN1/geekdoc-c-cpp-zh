  md: 'Example.10 Scoped declaration statement


    GCC provides few compiler options to check the stack usage. See GCC compiler options.


    # 2. Heap segment


    This is the space where the dynamic memory can allocated. This is explicitly allocated
    by calls to allocation functions in programming languages. C, C++ exposes allocation
    routines such as the following:


    +   1. malloc

    2. calloc

    3. realloc

    4. free

    5. new

    6. delete


    The last two are in C++ standard library but it supports all of them. C library
    supports the first 4.


    Once allocated by any of these calls, only way to free is by a call to free routines.
    There is no automatic freeing. Without freeing any heap memory, the system will
    run out of memory space if run for long duration.


    Not freeing heap memory results in memory leaks. When a program stops running,
    in general operating system will clean the memory allocated to it returns back
    the memory to the free pool. However, if the program has been running for a long
    time and never frees memory, it results in increase of memory usage and most probably
    leads to memory pressure / exhaustion.


    Generally operating systems responds to the memory exhaustion by triggering spontaneous
    kills of programs that used high memory to restore the memory usage. Linux this
    is called out memory killer in the kernel space.


    The Lifetime of the heap section is entire program but the scope is limited to
    either, local, or file scope. The allocated memory is always part of the heap
    section.


    # 3. Data segment


    Data segment is initialized and uninitialized segments.


    Here are few cases the variables are part of data segment.


