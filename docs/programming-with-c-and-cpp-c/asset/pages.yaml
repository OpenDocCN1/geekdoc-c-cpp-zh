  md: "# # Singleton Design pattern\n\nThe singleton pattern is used when an object\
    \ is being used by many other classes. One way to do it is to instantiate it statically\
    \ and return that instance.\n\nSince it has been used by many other classes, the\
    \ instantiation happens statically within the class itself. This one generally\
    \ defines `instance` member function that returns the statically declared class\
    \ object. The constructor is hidden to prevent any instantiations by the class\
    \ declarations.\n\nAn example singleton class looks as follows.\n\n```\nclass\
    \ singleton {\npublic:\n    static singleton *instance() {\n        static singleton\
    \ s;\n        return &s;\n    }\n    -singleton() = default;\n    singleton(const\
    \ singleton& k) = delete;\n    const singleton operator=(const singleton& k) =\
    \ delete;\n    singleton(const singleton& kk) = delete;\n    const singleton&\
    \ operator=(const singleton& kk) = delete;\n\n    int member(...);\n\nprivate:\n\
    \    explicit singleton();\n}\n```\n\nWe delete the copy and move constructors\
    \ so that only one instance that is created during the call to the static member\
    \ function `instance` is the only instance that is available."
  merge: -1
