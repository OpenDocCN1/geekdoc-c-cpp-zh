  md: "# Function Overloading\n\nFunction overloading allows to have more than one\
    \ signature to a function. Below\nis one example,\n\n```\nint F(int a);\nint F(int\
    \ a, int b);\n```\n\nThe function F is here overloaded and the two signatures.\
    \ The compiler\ninds out which of F to be called based on the definition.\n\n\
    ```\n#include <iostream>\n```\n\n```\nint F(int a) { return a; }\nint F(int a,\
    \ int b) { return a + b; }\n```\n\n```\nint main(){\n    std::cout << \"F(3):\
    \ \" << F(3) << std::endl;\n    std::cout << \"F(3,3): \" << F(3,3) << std::endl;\n\
    \nreturn 0;\n}\n```\n\nIn the arguments to the functions are allowed to be overloaded.\
    \ However,\nthe return type of functions are not allowed to be overloaded. For\
    \ example,\n\n```\n#include <iostream>\n```\n\n```\nint F(int a) { return a; }\n\
    void F(int a) { }\n```\n\n```\nint main(){\n    F(3);\n}\n```\n\nResults in a\
    \ compiler error.\n\n```\ncpp/overload_f.cc:4:6: error: ambiguous new declaration\
    \ of 'void F(int)'\n4 | void F(int a) { }\nncpp/overload_f.cc:3:5: note: old declaration\
    \ 'int F(int)'\n3 | int F(int a) { return a; }\n|\n```\n\nFunction overloading\
    \ is really useful when a function wants to do different jobs\nkeeping the name\
    \ same but different signature."
