  md: "# 4. find\n\nThe find iterates over each element and compares the elem pointer\
    \ with the given pointer and returns true if both are same.\n\n```\nbool find(void\
    \ *elem)\n{\n  struct linked_list *node;\n\n  for (node = head; node != NULL;\
    \ node = node->next) {\n    if (node->elem == elem) {\n      return true;\n  \
    \  }\n  }\n  return false;\n}\n```\n\nThere is another way to perform find. This\
    \ is to call the custom callback that returns true if matched and false if not.\
    \ Below is an example:\n\n```\nbool find(bool (*callback)(void *elem))\n{\n  struct\
    \ linked_list *node;\n  bool found = false;\n\n  for (node = head; node != NULL;\
    \ node = node->next) {\n    found = callback(node->elem);\n    if (found == true)\
    \ {\n      break;\n    }\n  }\n  return found;\n}\n```"
