  md: "# 3. delete\n\nDeleting an element elem is at the node need be considered two\
    \ possibilities.\n\n+   1. If the given elem is at the head.\n   1. Save the head\
    \ pointer to the next node.\n   2. Move the head to the next element.\n   3. Free\
    \ up the saved node.\n2. If the given elem is somewhere in the middle.\n   1.\
    \ Set prev and node to head.\n   2. Iterate over each element in the link.\n \
    \  3. If the elem pointers are matched skip the node.\n   4. Point the prev->next\
    \ to node->next, moving the link.\n   5. Free up the node.\n\nThere is a special\
    \ case if elem to delete is in the middle, the node potentially be the tail pointer.\
    \ Correct the tail pointer to old element prev.\n\n```\nint delete(void *elem)\
    \ {\n    struct linked_list *node;\n    struct linked_list *prev;\n\n    node\
    \ = head;\n    prev = node;\n\n    if (head->elem == elem) {\n        head = head->next;\n\
    \        free(node);\n        return 0;\n    } else {\n        while (node !=\
    \ NULL) {\n            if (node->elem == elem) {\n                prev->next =\
    \ node->next;\n                if (node == tail) {\n                    tail =\
    \ prev;\n                }\n                free(node);\n                return\
    \ 0;\n            }\n            prev = node;\n            node = node->next;\n\
    \        }\n    }\n    return -1;\n}\n```"
