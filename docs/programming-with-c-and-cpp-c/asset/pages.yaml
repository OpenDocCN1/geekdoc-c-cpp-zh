  md: "# Structure padding and packing\n\n# Structure Padding\n\nSometimes data structures\
    \ need to be aligned to a multiple of byte boundary. This is because the hardware\
    \ or architecture alignment. Without an aligned buffer, the hardware access to\
    \ the buffer might result in a crash.\n\nGcc provides __attribute__((aligned()))\
    \ specifier.\n\n```\nstruct S {\n    int r;\n    int p;\n    __attribute__ ((aligned(16)));\n\
    }\n```\n\nThe sizeof operation on the structure results in 16. Although the actual\
    \ size could be 8, since the aligned tag is given, extra pad bytes are added to\
    \ make it 16 bytes.\n\nBelow is an example,\n\n```\n#include <stdio.h>\n```\n\n\
    ```\nstruct S {\n    int v;\n    int r;\n    __attribute__ ((aligned(16)));\n\
    }\nint main() {\n    printf(\"size %ld\\n\", sizeof(struct S));\n    return 0;\n\
    }\n```\n\n# Structure Packing\n\nThe compilers provide a mechanism to pack the\
    \ elements of the structure to close any holes created due to the padding / alignment.\n\
