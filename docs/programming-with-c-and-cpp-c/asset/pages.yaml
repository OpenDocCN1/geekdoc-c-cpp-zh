    **auto** The **auto** keyword provides an automatic type deduction when used.

    An example,


    ```

    auto i = 10;

    ```


    says its an integer but compiler automatically understands this when the value
    assigned to it is an **int**.


    ```

    auto i = 10; // an int

    auto p = 10.1; // a double

    auto t = "c++"; // a const string

    ```


    We use auto at times when writing a complex type becomes very hard. We will see
    in the below sections on more about **auto**. Remember that not all **auto** type
    deductions are as we expect.


    When variables of type **auto** are used, then the initialization must be followed.
    This generally instructs the compiler to derive the type based on the initialized
    value.'
