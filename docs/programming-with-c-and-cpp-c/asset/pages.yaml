  md: "# Doubly Linked Lists\n\nDoubly linked list is a chain of elements terminated\
    \ with a NULL pointer.\n\nEach item in chain is called the node. Each node contains\
    \ data and two pointers. One pointer points to the next elements and another pointers\
    \ backwards.\n\n```\n|----------|----------|\nNULL<---| item 1 |--->> item 2 |---|--->,\
    \ ... ---> NULL\n|----------| <---*prev|----------||<*next, ...\n```\n\nThe doubly\
    \ linked list structure looks as follows.\n\n```\nstruct DL {\n    void *data;\n\
    \    struct DL *prev;\n    struct DL *next;\n};\n```\n\nThe data pointer holds\
    \ the data and the prev pointer points to the previous node in the list and the\
    \ next pointer points to the next element in the list.\n\n| S.No | Name | Description\
    \ |\n| --- | --- | --- |\n| 1 | dl_add_head | Add an element to the list at the\
    \ head |\n| 2 | dl_delete_item | Delete an element from the list |\n| 3 | dl_find_fwd\
    \ | Find an element in the list with forward iteration |\n| 4 | dl_find_rv | Find\
    \ an element in the list with reverse iteration |\n| 5 | dl_for_each_fwd | Iterate\
    \ over all the element with forward iteration |\n| 6 | dl_for_each_rv | Iterate\
    \ over all elements with reverse iteration |\n| 7 | dl_count | Count the number\
    \ of elements in the list |\n| 8 | dl_free_fwd | Remove all the elements with\
    \ forward iteration |\n| 9 | dl_free_rv | Remove all the elements with reverse\
    \ iteration |\n\nSimilar to the linked list, we create two elements, head and\
    \ tail.\n\n```\nstruct DL *head;\nstruct DL *tail;\n```"
