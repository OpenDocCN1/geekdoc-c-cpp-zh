  md: '# type definition


    Any type can be type defined to another type. The keyword **typedef** is used
    for this purpose.


    **typedef int integer_t**;


    Now, `integer_t` can be used as a new type to declare variables. The **typedef**
    can be applied for many other data types such as structures and function pointers.


    Generally the **typedef** is used to give a meaningful name to the type or when
    the type used is too long, **typedef** provides an alternative way to represent
    it in the short form.


    For example,


    ```

    typedef unsigned int u_int32_t; // unsigned 32 bits integer

    typedef unsigned char u_int8_t; // unsigned 8 bits integer

    ```


    C allow extending new types with the use of **struct**, this is described in the
    Structures section.


    In the below sections, the **typedef** is used in many places and it is explained
    further.'
