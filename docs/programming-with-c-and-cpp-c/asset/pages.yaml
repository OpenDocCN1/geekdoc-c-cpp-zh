  md: "# Hash Tables\n\nHash tables are a list of arrays which can be accessed by\
    \ indexing into them with a given key.\n\nFor example, Consider we have the following\
    \ lists.\n\n| 1 | 2 | 3 | 4 |\n| 5 | |\n| 6 | 7 | 8 |\n\nIn this list of lists,\
    \ to access element 5 we should first search the first list, the second till 5\
    \ is reached.\n\nIn hash tables, each element in the list is assigned a key when\
    \ adding to the list. So when a query is made on that element, also the key is\
    \ given as input to directly find the particular element at that index.\n\nTo\
    \ do this we hash the key, and modulo it with the number of lists that are present.\
    \ The resulting number is the index of the hash table.\n\nA hash can simply be\
    \ a computation or a random number generator doing certain maths operations. Key\
    \ can be anything too.\n\nFor example,\n\n```\nconst char *key = \"first item\"\
    ;\n\nint hash(const char *k)\n{\n    int i;\n    int r = 0;\n    for (i = 0; k[i]\
    \ != '\\0'; i++) {\n        r += k[i];\n    }\n    return r % hash_size;\n}\n\
    ```\n\nIn general the hashes must look random, we explain more below."
