  md: "# std::pair\n\n**std::pair** defines a pair of values. The usecases are when\
    \ returning more than one variable from a function or passing to a function as\
    \ key-value pair.\n\n**std::pair** can be used to construct a pair or `std::`make_pair``\
    \ can be used as well.\n\n```\nauto p = std::pair<std::string, int>(\"test\",\
    \ 1); // constructs std::pair type in p\n p = std::make_pair<std::string, int>(\"\
    test\", 1); // makes a pair of type std::pair\n```\n\nBelow one example of the\
    \ usecase for `std::pair`:\n\n```\n#include <iostream>\n\nvoid f(const std::string&,\
    \ int p) {\n    std::cout << \"first: \" << p.first << \" second: \" << p.second\
    \ << std::endl;\n}\n\nint main() {\n    f(std::make_pair(\"test\", 1));\n    f(std::make_pair<std::string,\
    \ int>(\"test\", 2));\n    f(std::pair(\"test\", 1));\n}\n```\n\n**std::pair**\
    \ also exposes operators ==, !=, < and >. One can use certain operations for comparison.\
    \ Here's one example: Download it here\n\n```\n#include <iostream>\n```\n\n```\n\
    int main() {\n    auto r = std::pair<std::string, int>(\"test\", 1);\n    auto\
    \ r1 = std::pair<std::string, int>(\"test\", 1);\n\n    std::cout << \"r == r1:\
    \ \" << (r == r1) << std::endl;\n\n    return 0;\n}\n```\n\n**std::pair** can\
    \ be implemented with templates. See usecases section for the implementation of\
    \ `std::pair`."
