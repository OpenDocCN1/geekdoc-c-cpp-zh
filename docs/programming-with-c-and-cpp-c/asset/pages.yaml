  md: "shared_ptr, unique_ptr\n\nThe std::shared_ptr is a scoped allocator defined\
    \ in C++11. The idea of the scoped allocation is to free the allocated memory\
    \ automatically when a count of all its references to the allocated memory become\
    \ 0.\n\nBelow is one example of std::shared_ptr.\n\n```\n#include <iostream>\n\
    #include <memory>\n\nstruct S {\n    int s;\n};\n\nint main() {\n    std::shared_ptr<S>\
    \ s;\n\n    s = std::shared_ptr<S>(new S);\n\n    s->s = 1;\n\n    std::cout <<\
    \ \"s-s: \" << s->s << std::endl;\n\n    return 0;\n}\n```\n\nThe allocator std::make_shared\
    \ is used that can return a pointer of type std::shared_ptr.\n\nBelow is one example,\n\
    \n```\n#include <iostream>\n#include <memory>\n\nstruct P {\n    int val;\n};\n\
    \nvoid print(std::shared_ptr<P> p) {\n    P* p1 = p.get();\n    printf(\"p->val\
    \ %d deref->val %d\\n\", p->val, p1->val);\n    printf(\"p.val %d\\n\", (*p1).val);\n\
    \    printf(\"use_count %ld\\n\", p.use_count());\n}\n```"
