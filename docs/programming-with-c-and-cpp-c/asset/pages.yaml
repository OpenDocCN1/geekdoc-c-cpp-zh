  md: '# Derived Classes


    C++ allows a class to inherit one or more classes. This is called inheritance.


    ```

    struct B {

    };


    struct D : public B {

    };

    ```


    Here the class inherits the class B. The public member functions in B are inherited
    in D. This means they are callable without class object. They can also be overridden
    if needed.


    For example:


    ```

    struct B {

    B() { a_ = 3; }

    -B() {}

    int get() { return a_; }

    ```


    ```

    private:

    int a_;

    ```


    ```

    struct D : public B {

    D() { a_ = 6; }

    -D() {}

    int get() { return a_; }

    int get_B() { return B::get(); } // access B::get() directly

    ```


    ```

    private:

    int a_;

    ```


    we access the member of D the following way:


    D:


    ```

    std::cout << "d.get_b():" << d.get_b() << std::endl;

    ```


    D:


    ```

    std::cout << "d.get()"" << d.get() << std::endl;

    ```


    This results in accessing a_ within D.


    Following is another way of accessing B::get().'
