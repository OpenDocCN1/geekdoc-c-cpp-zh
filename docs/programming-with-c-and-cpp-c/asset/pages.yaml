  md: "# 1. strlen\n\nThe library function **strlen** is used to get the length of\
    \ a string.\n\nThe **strlen** prototype is as follows:\n\n```\nint strlen(const\
    \ char *str);\n```\n\nBelow is an example,\n\n```\n#include <stdio.h>\n```\n\n\
    ```\nint main() {\n    char str[] = \"hello world\";\n\n    printf(\"%s %d\\n\"\
    , strlen(str));\n\n    return 0;\n}\n```\n\nThe **strlen** function counts all\
    \ the characters in the string excluding the \\0 marker. It can be implemented\
    \ as follows.\n\n```\nint string_length(const char *str) {\n    int i = 0;\n \
    \   for (i = 0; str[i] != '\\0'; i ++);\n\n    return i;\n}\n```\n\nThe above\
    \ program iterates over each character in the string **str** until the character\
    \ is \\0. The content of the for loop does nothing. Sometimes open and closed\
    \ braces { and } can be used as well.\n\nNote that the behavior is that the last\
    \ character should always be null terminated. If there are characters present\
    \ beyond the null terminating character they will be ignored.\n\nIf there is no\
    \ null character in the string, the **strlen** function will keep on reading and\
    \ may even read the allocated buffer in some cases. This sometimes causes crashes\
    \ if lucky and sometimes executes code if not lucky leading to exploits.\n\nSo\
    \ caution must be taken when creating and using the strings. Always null terminate\
    \ the strings."
