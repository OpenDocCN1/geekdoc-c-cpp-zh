  md: '# Introduction


    This book tries to explain programming in C and C++. C and C++ although are the
    oldest programming languages they are still in use by most of the operating systems
    such as Linux, RTOSes such as FreeRTOS.


    Both languages are still used in firmware development. Sometimes with libc and
    libstdc++ and not using libc and libstdc++. When writing code for Linux systems,
    most of the time libraries are used when writing the software. Using the library
    simplifies the software development as it provides most of the interfaces. In
    cases where the libraries become costly are when we are programming smallscale
    devices such as microcontrollers with limited RAM and Flash memory. In such cases,
    the preference is to use the programming language''s constructs as much as possible
    than using any of the library functions.


    For example, the following are provided by the C and C++ libraries.


    +   1. string manipulation

    2. console operations (writing to and reading from console).

    3. file system interaction (FILE i/o)

    4. Operating system abstractions in case of C++ (such as creation and use of threads,
    interacting with file system)


    The compiler implements the C, C++ languages. It verifies the program is compliant
    to the language specification and generates a binary file.


    To install gcc and g++ on Ubuntu:


    ```

    sudo apt install gcc g++

    ```'
