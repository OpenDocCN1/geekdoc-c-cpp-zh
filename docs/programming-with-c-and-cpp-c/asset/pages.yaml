  md: '# Code organization for software development


    When writing software in C and C++ it is important to understand the following
    concepts. These are generally applicable for the Building Large software section
    as well.


    +   1. Splitting the functionality into many files


    Sometimes a core functionality may have many parts. For example consider writing
    a GUI application that shows packet data in realtime (such as wireshark). This
    require the continuous data input from a backend, there is a communication between
    backend to the GUI frontend, there is also display style.


    So each of this functionality can be split into many files.


    +   1. backend.c -> implements data read and pass to proxy

    2. proxy.c -> implements proxying between backend and GUI front end.

    3. display.c -> implements display of the data with selected style.


    So generally this technique allows the programmer to identify which place to look
    when there is an issue with something such as specifically backend.


    +   2. Write data structures always in a header file.


    +   3. Write function prototypes always in a header file.'
  merge: -1
