    \ segment with some defined business logic and logical implementation.\n\nA function\
    \ has none, one or more input arguments and returns or do not return anything.\
    \ A prototype is as follows,\n\n```\nvoid function(void)\n```\n\nor more generally,\n\
    \n```\nreturn-type function-name(arguments, ..)\n```\n\nFor example,\n\n```\n\
    #include <stdio.h>\n\nvoid print_hello()\n{\n    printf(\"Hello World\\n\");\n\
    }\n\nint main()\n{\n    print_hello();\n}\n```\n\nThe above example calls a function\
    \ called print_hello to print the \"Hello World\" on screen.\n\nThe call to the\
    \ function is simply by writing its name followed by the parmes with none, one\
    \ or more arguments and followed by a semicolon.\n\nThis function does not accept\
    \ any argument and does not return anything.\n\nThe statements,\n\n```\nvoid print_hello()\n\
    {\n    printf(\"Hello World\\n\");\n}\n```\n\ncomprise the body of the function.\
    \ It also referred as function definition. A program typically contains more than\
    \ one function.\n\nmain() is also a function which is the starting point of a\
    \ program.\n\nIf the main() is not defined, the compilation results in undefined\
    \ error. In the general linker expects main() to be defined as it is expected\
    \ by the sequence before calling main(). Who calls main()? For this, the short\
    \ answer is the call is defined somewhere in the libc."
