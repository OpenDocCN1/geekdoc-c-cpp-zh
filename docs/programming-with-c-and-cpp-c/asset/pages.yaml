  md: "If a base class contains any member functions with noexcept specifier then\
    \ the derived class must also contain the noexcept specification. Without it,\
    \ this results in compiler error.\n\n```\n#include <iostream>\n```\n\n```\nclass\
    \ F {\npublic:\n    virtual void f() noexcept = 0;\n};\n```\n\n```\nclass G :\
    \ public F {\npublic:\n    void f() { std::cout << \"in f()\" << std::endl; }\n\
    };\n```\n\n```\nint main() {\n    class G g;\n    g.f();\n}\n```\n\nResults in\
    \ compiler error:\n\n```\ncpp/noexcept_inh.cc:10:22: error: looser exception specification\
    \ on overriding virtual function\n10 | void f() { std::cout << \"in f()\" << std::endl;\
    \ }\ncpp/noexcept_inh.cc:5:30: note: overridden function is 'virtual void F::f()\
    \ noexcept'\n5 | virtual void f() noexcept = 0;\n```\n\nHowever, a derived class\
    \ can specify noexcept otherwise or the base class do not have it.\n\nFor example\
    \ the below program compiles.\n\n```\n#include <iostream>\n```\n\n```\nclass F\
    \ {\npublic:\n    virtual void f() = 0;\n};\n```\n\n```\nclass G : public F {\n\
    public:\n};\n```"
