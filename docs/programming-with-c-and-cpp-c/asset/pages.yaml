  md: "# # Stack\n\nStacks are another data structure where the data entered first\
    \ is data retrieved or data entered in last is the data retrieved first.\n\n```\n\
    |----------------------|\n| item n <-- Add and Retrieve |\n|----------------------|\n\
    | ...                    |\n|----------------------|\n| item 2               \
    \ |\n|----------------------|\n| item 1                |\n|----------------------|\n\
    ```\n\nBelow are some operations that can be done with the stack data structure.\n\
    \nS.No Name Description |\n|---|---||\n| 1 top | Get the top element of the stack\
    \ |\n| 2 push | Push an element into the stack |\n| 3 pop | Pop an element out\
    \ of the stack |\n| 4 empty | Clear elements in the stack |\n| 5 size | Get the\
    \ total size of elements in the stack |\n\nStacks can be implemented with Linked\
    \ lists as well.\n\n```\nstruct stack {\n    void *elem;\n    struct stack *next;\n\
    };\n```\n\n```\nstatic struct stack *head;\nstatic int count;\n```\n\nFor the\
    \ stack functionality, the elements are added at head and removed at head.\n\n\
    Stacks are generally useful to quickly access the latest element first. Such as\
    \ when you are using git stash functionality."
