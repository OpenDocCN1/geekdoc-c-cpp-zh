    \ to the end.\n\nBubblesort algorithm work like the following:\n\n+   1. compare\
    \ two elements (one and next) and swap them if the first is greater than the second.\n\
    2. keep going until the largest element reaches the end. Now we do not have to\
    \ compare the last element.\n3. Repeat the steps 1 and 2 till all the elements\
    \ are sorted.\n\nA pseudo implementation of this looks as.\n\n```\nfor sorted\
    \ = 0; j < max - 1; sorted ++ {\n  for j = 0; j < sorted - 1; j ++ {\n    if (a[j]\
    \ > a[j + 1]) {\n      swap(a[j], a[j + 1]);\n    }\n  }\n}\n```\n\nAs we see\
    \ we loop till array length -1 as we are checking the next element (+1) to avoid\
    \ the array out of bounds.\n\nBelow is an implementation of bubble sort.\n\n```\n\
    #include <iostream>\n```\n\n```\ntemplate <typename T>\nvoid bubble_sort(T *a,\
    \ int n) {\n  int i;\n  int j;\n  int iters = 0;\n\n  for (i = 0; i < n - 1; i++)\
    \ {\n    for (j = 0; j < n - i - 1; j++) {\n      if (a[j] > a[j + 1]) {\n   \
    \     T t = a[j];\n        a[j] = a[j + 1];\n        a[j + 1] = t;\n      }\n\
    \    }\n    iters++;\n  }\n}\n```\n\n```\nint main()\n```"
