    \    int debug(const char *msg, ...);\n    int warn(const char *msg, ...);\n \
    \   int error(const char *msg, ...);\n    int fatal(const char *msg, ...);\n \
    \ private:\n    explicit log() {}\n};\n\n```\n\nThe above class is a singleton\
