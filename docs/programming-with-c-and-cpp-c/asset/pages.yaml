  md: "# Function Pointers\n\nPointers to functions are similar to pointer to the\
    \ variables. Functions also have addresses.\n\n```\nint (*fptr)(void);\n```\n\n\
    Defines a function pointer, that accepts no arguments and returns an integer.\n\
    \n```\nint (*fptr)(char *fmt, ...);\n```\n\nDefines a variable argument function.\n\
    \nFunction pointers in software are useful to write abstractions.\n\nConsider\
    \ the following case,\n\n+   1. An Ethernet product A provides capability for\
    \ transmit, receive functionality for internet working.\n2. Another Ethernet product\
    \ B provides same capabilities for internet working.\n\nSo to the user does not\
    \ matter what hardware is being used downside. All he care is the internet.\n\n\
    An Operating system programmer must implement something that must abstract the\
    \ two interfaces to provide a uniform interface to the user. This generally is\
    \ where function pointers come in.\n\nLets convert that above feature into software.\n\
    \n```\nstruct ethernet_driver {\n    int (*transmit)(uint8_t *packet, int packet_size);\n\
    \    int (*receive)(uint8_t *packet);\n};\n```\n\nThe structure ethernet_driver\
    \ provides an interface to the upside user and the downward phy device.\n\n```\n\
    enum eth_driver_list {\n    A,\n    B;\n};\n```\n\n```\nstruct enum eth_driver_list\
    \ list[2] = { A, B };\n```\n\n```\ne = probe_for(&list, 2);\n```\n\nHere, the\
    \ function probe_for looks for hardware registers which hardware is inserted,\
    \ whether its A or B. If it would return the ethernet_driver pointer of the driver\
    \ A, otherwise it returns B."
