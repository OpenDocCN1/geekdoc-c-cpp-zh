  md: '# Compilation of C program


    The compiler gcc is used through out this book to compile C programs. The gcc
    is a compiler and it comes with other tooling to generate the binary file.


    Below are the compilation stages of a C program.


    +   1. Preprocessor

    2. Compiler

    3. Assembler

    4. Linker


    # Preprocessor


    During this stage the compiler parses the input file, replaces macros, performs
    syntax checking. This can be done with -E switch to the gcc.


    # Compiler


    During this stage, the compiler converts the program into the object code of the
    given platform.


    Architecture based compilation is done here, where if a compiler can generate
    code for a different target architecture, it can then creates the object code
    for the target architecture.


    This can be done with -c switch to the gcc.


    # Assembler


    During this stage, the generated target specific object code then converted into
    an assembler code representation.


    This can be done with -s switch to the gcc.


    # Linker


    During this stage, the linker converts the object representation into an executable.
    Generally in linux the ELF is the format of the executable file.


    This is another tool called ld1d. We tend not to use this directly unless we are
    writing software specifically for targeted embedded devices.'
