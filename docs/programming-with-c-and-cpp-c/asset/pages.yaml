  md: "# Thread Pool\n\nThe thread pool is a group of threads that work on specific\
    \ jobs that are queued to them.\n\nThe threads are created early in the startup.\
    \ All the threads could listen on a single queue or a multi queue. The main thread\
    \ assigns the tasks to the threads and each thread execute these tasks that are\
    \ queued to them.\n\nSo idea of separate queue for each thread generally makes\
    \ sense to avoid any possible starvation when each thread pulls the task from\
    \ the queue.\n\nThus we need to define a context for each thread. It may look\
    \ something like the below. \n\n```\nstruct thread_context {\n    uint32_t id;\
    \ // identifier for thread\n    std::shared_ptr<std::thread> t_; // actual thread\
    \ pointer\n    std::mutex lock_; // lock for the queue\n    std::condition_variable\
