  md: "# Searching\n\nSearching in computer programming refers to finding some text\
    \ string, number pattern a large group of text or numbers. Sometimes the search\
    \ yields efficient results if the data is sorted.\n\nA general searching on an\
    \ array look as as follows.\n\n```\nint search(int array[], int size, int item)\
    \ {\n    int i;\n    for (i = 0; i < size; i++) {\n        if (array[i] == item)\
    \ {\n            return i;\n        }\n    }\n    return -1;\n}\n```\n\nWhile\
    \ it looks easy, the time and compute complexity goes high if the number of items\
    \ to search grows. For example if the array contains elements from 1 to 1000,\
    \ the iterations it takes 1000 in above program is 1000.\n\nSo there are few searching\
    \ algorithms in place to efficiently search an item in a list of items."
