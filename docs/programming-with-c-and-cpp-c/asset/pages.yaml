  md: '# Significance of header files


    Header files can include structures, macro definitions, and function prototypes.
    Sometimes they even contain inline functions.


    Here are few advantages:


    +   1. They can be used to group related functionality. Provides structure to
    the program when separated well.

    2. They can be used to expose the prototypes, macro definitions and structures
    to other files. The other files can use these prototypes to avoid implicit calls.

    3. Best way to distribute the software in package of header files and library
    .so or .a files.'
