  md: "# 8. clean\n\nCleaning up of linked list is required to free up the memory\
    \ used by the linked list.\n\nHere's one way to cleanup a linked list.\n\n+  \
    \ 1. Take two pointers: node and prev.\n2. node points to head and prev points\
    \ to node.\n3. Move node forward. the prev pointer.\n4. Set prev pointer back\
    \ to node.\n5. Repeat until node reaches end.\n\n```\nvoid clean()\n{\n    struct\
    \ linked_list *node;\n    struct linked_list *prev;\n\n    node = head;\n    prev\
    \ = head;\n\n    while (node) {\n        node = node->next;\n        free(prev);\n\
    \        prev = node;\n    }\n}\n```\n\nA while loop can be used as well for iteration.\n\
    \nstruct linked_list *node = head;\n\n```\nwhile (node) {\n    node = node->next;\n\
    }\n```\n\nHowever, the for loop looks more complete as the assignment, condition\
    \ and increment are all in one place."
