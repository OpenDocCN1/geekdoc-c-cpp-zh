  md: "# 1. Stack segment\n\nIn locals stacks are of 8 kbytes in size by default.\
    \ But it varies on operating\nsystem, sometimes application wise. In RTOS based\
    \ systems, it is configured at\nthe linker script.\n\nStack grows downwards in\
    \ memory. Local variables and function arguments\npart of the stack.\n\nEverytime\
    \ a function is called, the function kept in the stack and a call\nis made and\
    \ grows down. After the return, the stack is freed up automatically.\n\nIn general,\
    \ the stack can exhaust quickly if allocation reaches maximum value,\nresulting\
    \ in stack overflow. In some operating systems, it will result in entire\nsystem\
    \ halt (such as in RTOS running on a Microcontroller) or a program halt\nwhile\
    \ the rest of the system executes normally.\n\nIn either cases, the result is\
    \ a program abort. To avoid this, we must carefully\nuse the stack memory. Sometimes\
    \ data section can be of use if there is no heap\nsection.\n\nLifetime of stack\
    \ variables is only local to the function. This is in general one of\nt right\
    \ approaches to programming by confining the scope to a function or to\ngroup.\n\
    \nBelow example the use of static variables confined to a function\n\n```\nint\
    \ F()\n{\n    int a = 3;\n\n    return a * 2;\n}\n```\n\nExample.9 Local variable\n\
    Here the variable a is a local variable and is part of the stack.\n\nBelow is\
    \ another example of scoped variable setting with stack.\n\n```\nint F()\n{\n\
    \    // variable a is scoped between { and }\n    {\n        int a = 3;\n\n  \
    \      a *= 3;\n    }\n\nreturn a; // returns error that a is undeclared\n}\n\
    ```"
