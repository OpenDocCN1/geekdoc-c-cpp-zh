  md: '# # Basic Data types


    Below are the following data types in C. All are applicable for C++ as well.


    Below are some of the data types for 32 bit systems.


    | S.No | type | description | ranges |

    |---|---|---|-|

    | 1 | char | 1 byte signed integer | -127 to 127 |

    | 2 | unsigned char | 1 byte unsigned integer | 0 to 255 |

    | 3 | short int | 2 byte signed integer | -32767 to 32767 |

    | 4 | unsigned short int | 2 byte unsigned integer | 0 to 65535 |

    | 5 | int | 4 byte signed integer | -2147483648 to 2147483647 |

    | 6 | unsigned | 4 byte unsigned integer | 0 to 4294967295 |

    | 7 | float | 4 byte floating point variable | - |

    | 8 | double | 4 / 8 byte double variable | - |


    A variable of the above type can be declared as follows.


    ```

    int a;

    a is a variable of type int.

    int a = 4;

    ```


    The above statement initializes a to 4.


    ```

    int a;

    a = 4;

    int a = 0x20;

    ```


    initializes a with a hexadecimal number. Hexadecimals are noted with the 0x.


    The above statement initializes a to 4.


    Sometimes in a program we initialize variables and assign the variables a v value
    sometime later.


    A variable that is not initialized is called uninitialized variable. Uninitialized
    variables are a bigger problem when using them. The reason being that they hold
    some unknown value when declared. When the variable is used without initialization,
    the behavior of the program when run will be unexpected. This generally results
    in incorrect execution and so provides incorrect results.


    The ideal solution is to always initialize a variable when declaring them to avoid
    unwanted problems that arise with uninitialized variables.


    Each declared variable is associated with a type. Read Recap section about the
    variables and their scope.


    Declaring doubles:'
