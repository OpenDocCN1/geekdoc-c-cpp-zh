  md: '# Format Specifier


    The prototypes printf and scanf and standard library functions when linked.

    The prototypes of these functions look as follows:


    ```

    int printf(const char *fmt, ...); // shown here for easy reading .. this is not
    as same as printf

    int scanf(const char *fmt, ...); // shown here for easy reading .. this is not
    as same as scanf

    ```


    The first argument requires a format specifier in a particular format.

    Below are some of the format specifiers for printf and scanf. They apply for

    printf, vprintf, vsprintf scanf and vsprintf as.


    The %d used to integers. The function printf recognizes the integer

    variables given as function arguments when end with specified as %d.


    The body start with "* and end with "* is called as string. More about

    t strings in the Strings section below.


    Below are some of the format specifiers.


    | S.No | Format specifier | Meaning |

    | 1 | %d | integer |

    | 2 | %c | character |

    | 3 | %s | string |

    | 4 | %u | float or double |

    | 5 | %X | unsigned integer |

    | 6 | %ld | long integer |

    | 7 | %lld | long integer |

    | 8 | %lu | long unsigned integer |

    | 9 | %llu | long unsigned integer |

    | 10 | %x | hexadecimal |


    Below are some more functions that use the format specifiers. Functions are

    described in detail below.


    | S.No | Function Name |

    | 1 | scanf |

    | 2 | printf |

    | 3 | scansf |

    | 4 | vprintf |

    | 5 | vsprintf |


    For example a to print an integer is as follows,


    ```

    printf("%d\n", 3); // prints integer

    ```


    If there are multiple variable to be printed, they can be printed as well.'
