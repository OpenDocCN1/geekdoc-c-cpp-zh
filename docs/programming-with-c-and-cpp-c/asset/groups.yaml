    \    int b = 1;\n    printf(\"%d %d\\n\", a & b, a | b);\n    return 0;\n}\n```\n\
    \n### Example.8 Logical AND operator\n\nThe output is :\n\n# Scope and Lifetime\
    \ of the variables\n\nWe have declared many variables over. Each variable declared\
    \ within the function has some certain scope. In the above function, the variables\
    \ a and b are called local variables. This means that the scope of these variables\
    \ are within the lifetime of the function. If the function returns the variables\
    \ will be destroyed or removed from the memory.\n\nEach program has a determined\
    \ memory set aside by default the operating system. This memory is divided aside\
    \ into the following partitions:\n\n1. stack segment\n2. heap segment\n3. data\
    \ segment\n4. text segment\n\nBelow is the diagrammatic representation.\n\n| |\
    \ |\n|---|---|\n| Stack segment | Stack grows downwards in memory |\n| Heap Segment\
    \ | Heap grows upwards in memory |\n| Uninitialized data | |\n| Initialized data\
    \ | |\n| text | |\n\n# 1. Stack segment\n\nIn locals stacks are of 8 kbytes in\
    \ size by default. But it varies on operating system, application wise. In RTOS\
    \ based systems, it is configured at the linker script. Stack grows downwards\
    \ in memory. Local variables and function arguments part of the stack.\n\nEverytime\
    \ a function is called, the function kept in the stack and a call is made and\
    \ grows down. After the return, the stack is freed up automatically. In general,\
    \ the stack can exhaust quickly if allocation reaches maximum value, resulting\
    \ in stack overflow. In some operating systems, it will result in entire system\
    \ halt (such as in RTOS running on a Microcontroller) or a program halt while\
    \ the rest of the system executes normally. In either cases, the result is a program\
    \ abort. To avoid this, we must carefully use the stack memory. Sometimes data\
    \ section can be of use if there is no heap section.\n\nLifetime of stack variables\
    \ is only local to the function. This is in general one of right approaches to\
    \ programming by confining the scope to a function or to group.\n\nBelow example\
    \ the use of static variables confined to a function\n\n```\nint F()\n{\n    int\
    \ a = 3;\n\n    return a * 2;\n}\n```\n\n### Example.9 Local variable\n\nHere\
    \ the variable a is a local variable and is part of the stack. Below is another\
    \ example of scoped variable setting with stack.\n\n```\nint F()\n{\n    // variable\
    \ a is scoped between { and }\n    {\n        int a = 3;\n\n        a *= 3;\n\
    \    }\n\n    return a; // returns error that a is undeclared\n}\n```\n\n### Example.10\
    \ Scoped declaration statement\n\nGCC provides few compiler options to check the\
    \ stack usage. See GCC compiler options.\n\n# 2. Heap segment\n\nThis is the space\
    \ where the dynamic memory can allocated. This is explicitly allocated by calls\
    \ to allocation functions in programming languages. C, C++ exposes allocation\
    \ routines such as the following:\n\n1. malloc\n2. calloc\n3. realloc\n4. free\n\
    5. new\n6. delete\n\nThe last two are in C++ standard library but it supports\
    \ all of them. C library supports the first 4.\n\nOnce allocated by any of these\
    \ calls, only way to free is by a call to free routines. There is no automatic\
    \ freeing. Without freeing any heap memory, the system will run out of memory\
    \ space if run for long duration.\n\nNot freeing heap memory results in memory\
    \ leaks. When a program stops running, in general operating system will clean\
    \ the memory allocated to it returns back the memory to the free pool. However,\
