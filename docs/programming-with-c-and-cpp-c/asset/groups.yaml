    \ lru_cache() {\n        index_ = 0;\n        seq_no_ = 0;\n\n        for (auto\
    \ i = 0; i < n; i++) {\n            items_[i].is_avail = false;\n            items_[i].seq_no\
    \ = 0;\n        }\n    }\n    ~lru_cache() {}\n\n    lru_cache& push(T &val) {\n\
