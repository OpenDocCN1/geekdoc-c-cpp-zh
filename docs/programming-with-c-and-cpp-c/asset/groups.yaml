    \ It also governs underlying rules when it is inherited classes.\n\nA noexcept\
    \ specifier can be attached to the end of the function:\n\n```\nint f(void) noexcept;\
    \ // says function does not throw an exception\nint g(void); // may throw an exception\n\
    ```\n\nA function declared with **noexcept** but throws, results in the library\
    \ calling `std::terminate`. This makes the exception uncatchable.\n\nAn overloaded\
    \ function can have a different exception specification. For example, below example\
    \ is valid.\n\n```\nint f(void) noexcept;\nint f(std::string arg);\n```\n\nBelow\
    \ program covers almost all the noexcept cases:\n\n```\n#include <iostream>\n\n\
    void f() noexcept { std::cout << \"f called\" << std::endl; }\nvoid f(std::string\
    \ arg) { std::cout << \"f called with arg: \" << arg << std::endl; }\n\nvoid g()\
    \ noexcept { throw std::runtime_error(\"an exception g()\"); }\n\nvoid p() { throw\
    \ std::runtime_error(\"an exception p()\"); }\n```\n\n```\nint main() {\n  f();\n\
    \  f(\"test\");\n\n  try {\n    p();\n  } catch (const std::exception& e) {\n\
