    \n在 Ubuntu 上安装 gcc 和 g++：\n\n```bash\nsudo apt install gcc g++\n```\n\n# 读者群体\n\
    \n本书的读者是初级和中级程序员。对于高级程序员，你可能已经了解了这些编程结构。\n\n# C 语言编程\n\n# 基础 Hello World 程序\n\n\
