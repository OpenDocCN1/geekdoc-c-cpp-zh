    \ f(int a, int b = 10)\n{\n    return a + b;\n}\n\nint main()\n{\n    int r =\
    \ f(10);\n    std::cout << \"r: \" << r << std::endl;\n    r = f(3, 3);\n    std::cout\
    \ << \"r: \" << r << std::endl;\n    return 0;\n}\n```\n\n# New keywords in C++\n\
    \n```cpp\nconstexpr\n```\n\n# explicit\n\n**auto** The **auto** keyword provides\
    \ an automatic type deduction when used.\nAn example,\n\n```cpp\nauto i = 10;\n\
    ```\n\nsays its an integer but compiler automatically understands this when the\
