    \n  printf(\"number of elements %lu, queue empty %d\\n\", q.size(), q.empty());\n\
    \  printf(\"front %d back %d\\n\", q.front(), q.back());\n\n  while (q) {\n  \
    \  size = q.size();\n    if (size <= 0) {\n        break;\n    }\n\n    int val\
    \ = q.front();\n    q.pop();\n    printf(\"val %d\\n\", val);\n  }\n}\n```\n\n\
    The general usecases of queues are the following:\n\n1. Producer and Consumer\
