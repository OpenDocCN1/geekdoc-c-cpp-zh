    \            items_[index_].val = val;\n            items_[index_].is_avail =\
    \ true;\n            items_[index_].seq_no = seq_no_;\n            index_++;\n\
    \        } else {\n            /**\n             * 如果项旧了则尝试淘汰\n             *\
    \ 如果特定缓存行的序列号是最旧的，将其淘汰并更新\n             */\n            /** 寻找最久未使用的项 */\n   \
    \         int i;\n            int index = -1;\n            uint32_t least_val\
    \ = seq_no_;\n\n            for (i = 0; i < n; i++) {\n                if (items_[i].seq_no\
    \ < least_val) {\n                    least_val = items_[i].seq_no;\n        \
    \            index = i;\n                }\n            }\n\n            if (index\
    \ != -1) {\n                seq_no_++;\n            }\n            items_[index].val\
    \ = val;\n            items_[index].is_avail = true;\n            items_[index].seq_no\
