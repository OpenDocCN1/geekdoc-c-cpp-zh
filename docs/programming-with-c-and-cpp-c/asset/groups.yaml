    \n```cpp\ntemplate<typename T, int n\nclass p {\n  T array[n]; // 定义一个大小为常量 n\
    \ 的数组\n  p<int, 10> a; // 在这里我们定义数组大小为 10\n};\n```\n\n这种方法可以作为实现 `std::array`\
    \ 的方法。\n数组理应具有以下功能：\n\n| 序号 | 名称 | 描述 |\n|---|---|---|\n| 1 | operator[] | 数组索引\
    \ |\n| 2 | at | 访问给定位置的元素 |\n| 3 | size | 获取数组的大小 |\n| 4 | clear | 使用清除值清空数组 |\n\
    \n以下是一个实现。\n#include <iostream>\n\n```cpp\ntemplate <typename T, int n\nclass\
    \ array {\n  public:\n    explicit array() = default;\n    ~array() = default;\n\
    \n  T operator[](int index) { return array_[index]; }\n  T at(int index) { return\
    \ array_[index]; }\n\n  int size() { return n; }\n\n  void clear(const T val)\
    \ {\n    for (auto i = 0; i < n; i++) {\n        array_[i] = val;\n    }\n  }\n\
    private:\n    T array_[n];\n};\n\nint main() {\n    array<int, 10> a;\n    a[1]\
    \ = 4;\n\n    std::cout << \"array \" << a[1] << std::endl;\n}\n```\n\n# 模板重载\n\
    \n模板重载是可能的，就像讨论过的函数重载一样。\n\n以下是模板重载的示例。\n\n```cpp\ntemplate <typename T>\nint\
    \ print(T &val);\n\ntemplate <typename T, typename R>\nint print(T &val, R &val2);\n\
    \nint print(int val);\n```\n\n以下是重载模板的使用示例。\n#include <iostream>\n\ntemplate <typename\
