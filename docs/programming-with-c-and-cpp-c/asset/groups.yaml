  mdcn: "\n\n# 8. clean\n\n需要清理链表以释放链表占用的内存。\n\n这里是清理链表的一种方法。\n\n- 1. 取两个指针：node 和\
    \ prev。\n- 2. node 指向头部，prev 指向 node。\n- 3. node 向前移动。prev 指针。\n- 4. 将 prev 指针指向\
    \ node。\n- 5. 重复此操作直到 node 到达末尾。\n\n```c\nvoid clean()\n{\n    struct linked_list\
    \ *node;\n    struct linked_list *prev;\n\n    node = head;\n    prev = head;\n\
    \n    while (node) {\n        node = node->next;\n        free(prev);\n      \
    \  prev = node;\n    }\n}\n```\n\n也可以使用 while 循环进行迭代。\n\n```c\nstruct linked_list\
    \ *node = head;\n\nwhile (node) {\n    node = node->next;\n}\n```\n\n然而，for 循环看起来更完整，因为赋值、条件和递增都都在同一个地方。\n\
    \n下面是一个完整的示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct linked_list\
    \ {\n    void *elem;\n    struct linked_list *next;\n};\n\nstatic struct linked_list\
    \ *head;\nstatic struct linked_list *tail;\n\nint add(void *data) {\n    struct\
    \ linked_list *node;\n    node = calloc(1, sizeof(struct linked_list));\n    if\
    \ (!node) {\n        return -1;\n    }\n    node->elem = data;\n\n    if (!head)\
    \ {\n        head = node;\n        tail = node;\n    } else {\n        tail->next\
    \ = node;\n        tail = node;\n    }\n\n    return 0;\n}\n\nint add_head(void\
