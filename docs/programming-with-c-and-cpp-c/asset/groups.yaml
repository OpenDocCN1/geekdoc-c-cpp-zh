    \ \"l size: \" << l.size()\n        << \" l max size: \" << l.max_size() << std::endl;\n\
    \n    return 0;\n}\n```\n\n## Queues\n\nstd::queue defines a queue type. The std::queue\
    \ can take any type. It is generally identified with templates as,\n\ntemplate\
    \ <typename T> std::queue<T>\n\nThe T argument a template type, the type is deduced\
