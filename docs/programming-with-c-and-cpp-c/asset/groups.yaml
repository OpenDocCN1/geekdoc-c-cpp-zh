  - "[PAGE 243]\n\n# Usecase 2: Implementing LRU cache\n\nLRU is called as Least Recently\
    \ Used. It is a cache mechanism that allows to remove the least used data members.\
    \ The below algorithm describes based on the assumption that the cache is finite.\n\
    \nFor example consider the following cache.\n\n| A | B | C | D | E |\n\nEach of\
    \ these elements are associated with a sequence number.\n\n| A | 1 | B | 2 | C\
    \ | 3 | D | 4 | E | 5 |\n\nThis can be represented in structural format as,\n\n\
    ```\ntemplate <typename>\nstruct lru_cache_item {\n  T item;\n  uint32_t seq_no;\n\
    };\n```\n\nThe elements are structured as,\n\n+   A,1\nB,2\nC,3\nD,4\nE,5\n\n\
    If F needs to be added to the above list, the element A will be evicted because\
    \ the sequence number following A is the least.\n\nSo the resulting list becomes,\n\
    \n+   F,6\nB,2\nC,3\nD,4\nE,5\n\nIf B wants to be updated (or more specifically\
    \ location where the element B is stored needs to be updated), the sequence number\
    \ belong to it it will also be updated. For example the resulting list becomes,\n\
    \n+   F,6\nB,7\nC,3\nD,4\nE,5\n\nNow, if any new element needs to be added to\
    \ the list the next element to be removed is C."
