    \ the id of the thread |\n| 4 | native_handle | return the native handle of the\
    \ thread |\n| 5 | hardware_concurrency | return the number of threads returned\
    \ by the implementation |\n| 6 | join | wait for the thread to finish |\n| 7 |\
    \ detach | detach the thread |\n| 8 | swap | swaps two objects |\n\nBelow is one\
    \ example that shows usages of the member functions.\n"
