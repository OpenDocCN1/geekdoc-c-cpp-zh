  - "[PAGE 280]\n\n# Linked Lists\n\nLinked list is a chain of elements terminated\
    \ with a NULL pointer.\n\nEach item in chain is called the node. Each node contains\
    \ data and a pointer to the next item in the list. The last node pointer will\
    \ be NULL.\n\nLinked list structure looks as follows:\n\n```\n|------|-------|-------|------|\n\
    | item 1 |----> item 2 |----> item 3 |-- . . -> NULL\n|------|       |       |------|\n\
    ```\n\nThe list always ends with a NULL pointer.\n\nThe linked list structure\
    \ looks as follows:\n\n```\nstruct linked_list {\n    void *elem;\n    struct\
    \ linked_list *next;\n}\n```\n\nthe data pointer holds the data and the next pointer\
    \ links to the next element in the list.\n\nBelow are some of the general operations\
    \ on the list.\n\n| S.No | Name | Description |\n| 1 | add | Add an element to\
    \ the list at the end |\n| 2 | add_head | Add an element to the list at the head\
    \ |\n| 3 | delete | delete an element from the list |\n| 4 | find | find an element\
    \ in the list |\n| 5 | count | count the number of elements in the list |\n| 6\
    \ | for_each | iterate through each element in the list |\n| 7 | print | print\
    \ all the elements of the list |\n| 8 | clean | clean all linked list and free\
    \ up the memory allocated |\n\nDefine two global variables head and tail.\n\n\
    ```\nstatic struct linked_list *head;\nstatic struct linked_list *tail;\n```\n\
    \nWe use two pointers head and tail. The head is used to iterate over each element\
    \ from the beginning and tail is used to add element at the end."
  - "[PAGE 281]\n\n# 1. add\n\nAdding an element can be as simple as adding an element\
    \ at the end.\n\nIf there are no elements in the list, add the element at the\
    \ head. If there are\\lements in the list, add the element after tail. When ever\
    \ an element is added\n the tail to the last element.\n\n```\nint add(void *data)\
    \ {\n    struct linked_list *node;\n\n    node = calloc(1, sizeof(struct linked_list));\n\
    \    if (!node) {\n        return -1;\n    }\n\n    /* Assign the element */\n\
    \    node->elem = data;\n\n    if (!head) {\n        head = node;\n        tail\
    \ = node;\n    } else {\n        tail->next = node;\n        tail = node;\n  \
    \  }\n\n    return 0;\n}\n```\n\nIterating over the elements is simple as using\
    \ a while or do..while or for loop."
  - "[PAGE 282]\n\n# 2. add_head\n\nAdding an element at the head is done as follows:\n\
    \n+   1. Set node->next to head.\n2. Make head head point to node.\n\n```\nint\
    \ add_head(void *data)\n{\n    struct linked_list *node;\n\n    node = calloc(1,\
    \ sizeof(struct linked_list));\n    if (!node) {\n        return -1;\n    }\n\n\
    \    node->elem = data;\n\n    if (!head) {\n        head = node;\n        tail\
    \ = node;\n    } else {\n        node->next = head;\n        head = node;\n  \
    \  }\n\n    return 0;\n}\n```"
  - "[PAGE 283]\n\n# 3. delete\n\nDeleting an element elem is at the node need be\
    \ considered two possibilities.\n\n+   1. If the given elem is at the head.\n\
    \   1. Save the head pointer to the next node.\n   2. Move the head to the next\
    \ element.\n   3. Free up the saved node.\n2. If the given elem is somewhere in\
    \ the middle.\n   1. Set prev and node to head.\n   2. Iterate over each element\
    \ in the link.\n   3. If the elem pointers are matched skip the node.\n   4. Point\
    \ the prev->next to node->next, moving the link.\n   5. Free up the node.\n\n\
    There is a special case if elem to delete is in the middle, the node potentially\
    \ be the tail pointer. Correct the tail pointer to old element prev.\n\n```\n\
    int delete(void *elem) {\n    struct linked_list *node;\n    struct linked_list\
    \ *prev;\n\n    node = head;\n    prev = node;\n\n    if (head->elem == elem)\
    \ {\n        head = head->next;\n        free(node);\n        return 0;\n    }\
    \ else {\n        while (node != NULL) {\n            if (node->elem == elem)\
    \ {\n                prev->next = node->next;\n                if (node == tail)\
    \ {\n                    tail = prev;\n                }\n                free(node);\n\
    \                return 0;\n            }\n            prev = node;\n        \
    \    node = node->next;\n        }\n    }\n    return -1;\n}\n```"
  - "[PAGE 284]\n\n# 4. find\n\nThe find iterates over each element and compares the\
    \ elem pointer with the given pointer and returns true if both are same.\n\n```\n\
    bool find(void *elem)\n{\n  struct linked_list *node;\n\n  for (node = head; node\
    \ != NULL; node = node->next) {\n    if (node->elem == elem) {\n      return true;\n\
    \    }\n  }\n  return false;\n}\n```\n\nThere is another way to perform find.\
    \ This is to call the custom callback that returns true if matched and false if\
    \ not. Below is an example:\n\n```\nbool find(bool (*callback)(void *elem))\n\
    {\n  struct linked_list *node;\n  bool found = false;\n\n  for (node = head; node\
    \ != NULL; node = node->next) {\n    found = callback(node->elem);\n    if (found\
    \ == true) {\n      break;\n    }\n  }\n  return found;\n}\n```"
  - "[PAGE 285]\n\n# 5. count\n\nThe count iterates over each link and increments\
    \ the counter.\n\n```\nint count()\n{\n  struct linked_list *node;\n  int n =\
    \ 0;\n\n  for (node = head; node != NULL; node = node->next) {\n    n++;\n  }\n\
    \  return n;\n}\n```\n\nThe count can be a local variable and incremented during\
    \ add and delete operations. It can then be returned directly in the count function."
  - "[PAGE 286]\n\n# 6. for__each\n\nThe for__each iterates over each link and calls\
