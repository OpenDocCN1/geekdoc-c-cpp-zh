    \ }\n    return 0;\n}\n```\n\nRange based for 循环具有以下优势：\n\n- 无需条件检查，消除了无限循环的可能性。\n\
    - 自动递增和初始化。\n\n# 5. Enum classes\n\nEnum classes允许对枚举分类。\n\n```cpp\nenum class\
    \ fruits {\n  Apples,\n  Oranges,\n  Banana,\n};\n```\n\n枚举可以声明为：\n\n```cpp\n\
    f = fruits::Apple; // Apple 的赋值\nfruits fi = fruits::Apple; // 枚举初始化\n```\n\n\
    两种声明在各自范围内都有帮助。\n\n```cpp\n#include <iostream>\n\nenum class fruits {\n  Apple,\n\
    \  Oranges,\n  Banana,\n};\nint main()\n{\n  fruits f = fruits::Apple;\n  std::cout\
    \ << (int)f << std::endl;\n  return 0;\n}\n```\n\n比较仍然有效。\n\n```cpp\n#include\
    \ <iostream>\n\nenum class Languages {\n  Telugu,\n  Tamil,\n  English,\n  Hindi,\n\
    };\n```\n\n枚举不能用 `std::cout` 打印，但像 C 一样，它们可以转换为整数。\n\n# 6. nullptr\n\n从 C++11\
    \ 开始，标准定义了可以分配任何指针的 `nullptr`。赋值时，编译器会处理空指针的分配。`nullptr` 不指向 0 或 `(void*)0`。\n\
    \n例如，以下语句在 C++ 中仍然有效：\n\n```cpp\nint *p = 0; // 0 的用法\nint *p = NULL; // C 中的\
    \ NULL 指针用法\n```\n\n通常，使用 `auto` 类型推导查找变量类型非常困难。\n\n```cpp\nauto res = get_data();\n\
    \nif (res == 0) // 假设这里 0 是空指针\n```\n\n但是，如果 `get_data` 实际上返回一个空指针，那么理解的类型可能是\
    \ `NULL`。\n\n```cpp\nif (res == nullptr) // 始终保证 res 是空指针\n```\n\n数据结构指针也可以分配为\
    \ `nullptr`。\n\n```cpp\nstruct S {\n    int a;\n};\n```\n\n```cpp\n*s1 = NULL;\
    \ // 仍然有效\n*s2 = nullptr; // 有效\n```\n\n在某些标准类型（如 `shared_ptr`、`unique_ptr`）中，赋值可能会导致模糊的结果。`shared_ptr`\
    \ 和 `unique_ptr` 是标准模板库的一部分。将在相应的章节中进一步讨论。\n\n```cpp\nstd::shared_ptr<S> s1 =\
    \ 0; // 可能有效\nstd::shared_ptr<S> s2 = nullptr;\n```\n\n"
