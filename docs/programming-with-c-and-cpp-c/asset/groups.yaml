- md: "\n# Macros\n\nMacros are compile time constants and do not allocate any space\
    \ in runtime.\nThis means that the preprocessor replaces the sections where Macros\
    \ are used,\nto their corresponding values.\n\nIn the above example we used #include\
    \ <stdio.h>, where #include is a directive. This informs the compiler to replace\
    \ this statement with the header file\nstdio.h.\n\n## #define macro\n\nThe preprocessor\
    \ stage, replaces the macros with the actual values present in\nmacro definition.\n\
    \nThe macro defines macro constants. An example is as follows.\n\n```\n#define\
    \ TWO 2\n```\n\nMacro statements are used as substitutes for constants or some\
    \ common operations.\n\nFor example using,\n\n```\n#define PI 3.1413\n```\n\n\
    ```\ndouble circumference(double radius)\n{\n    return 2 * PI * radius;\n}\n\
    ```\n\nis more meaningful using a constant value.\n\n```\n#define ADD(_a, _b)\
    \ ((_a) + (_b))\n```\n\nis an operation. We discuss about function like macros\
    \ in below sections.\n\nBelow is an example,\n\n```c\n#define ARRAY_SIZE 10\n\
    ```\n\n```c\nint main()\n{\n    int r[ARRAY_SIZE];\n}\n```\n\nExample.3: macro\
    \ conversion\n\nRunning gcc -E on the file gives,\n\n```c\n# 0 \"c/def.c\"\n#\
    \ 0 \"built-in\"\n# 0 \"<command-line\"\n# 1 \"/usr/include/std-predef.h\" 1 3\
    \ 4\n# 0 \"<command-line>\" 2\n# 1 \"c/def.c\"\n```\n\n```c\nint main()\n{\n \
    \   int r[10];\n}\n```\n\nExample 4: gcc -E output\nMacro replaced with an actual\
    \ value after the pre-processor stage.\n\n## #undef macro\n\nThe #undef macro\
    \ defines a macro (Note: removes a macro). For example,\n\n```c\n#define PI 3.1413\n\
    #undef PI\n\ndouble circumference(double radius)\n{\n    return 2 * PI * radius;\n\
    }\n```\n\nresults in compiler error as the preprocessor removes PI.\n\n## #ifdef\
    \ macro\n\nThe #ifdef macro checks if a certain macro is defined and if preprocessor\
    \ enables the portion of code that is between the #ifdef and #endif. The #ifdef\
    \ is always followed by #endif or #else statement.\n\nFor example,\n\n```c\nint\
    \ a = 10;\n#ifdef CONFIG_MACRO\na = 5;\n#else\na = 6;\n#endif\n```\n\nWill set\
    \ a to 5 if CONFIG_MACRO is defined or 6 otherwise.\nBellow example shows how\
    \ to define the macro.\n\n```c\n#include <stdio.h>\n#define CONFIG_MACRO\n\nint\
    \ main()\n{\n  int a = 10;\n  #ifdef CONFIG_MACRO\n    a = 5;\n  #else\n    a\
    \ = 6;\n  #endif\n\n  printf(\"%d\\n\", a);\n}\n```\n\n## Example 4.11 Macro definitions\n\
    \nDefining a simple #define CONFIG_MACRO is enough to enable the statements under\
    \ the #ifdef. In general these can be passed as command line arguments instead\
    \ of them by the compiler. For example,\n\n```bash\ngcc -DCONFIG_MACRO macro.c\n\
    ```\n\nThe argument -D to the gcc accepts the macros and many number of -Ds can\
    \ be given as arguments.\n\nThe #ifdef macro is a negation of #ifdef if the the\
    \ particular macro variable is not defined, preprocessor will enable that portion\
    \ of the code.\n\n# Functions\n\nFunction in a C program is a group of instructions.\
    \ Functions allow us to break a large program into pieces of understandable segments.\
    \ Each segment with some defined business logic and logical implementation.\n\n\
    A function has none, one or more input arguments and returns or do not return\
    \ anything. A prototype is as follows,\n\n```c\nvoid function(void)\n```\n\nor\
    \ more generally,\n\n```c\nreturn-type function-name(arguments, ..)\n```\n\nFor\
    \ example,\n\n```c\n#include <stdio.h>\n\nvoid print_hello()\n{\n    printf(\"\
    Hello World\\n\");\n}\n\nint main()\n{\n    print_hello();\n}\n```\n\nThe above\
    \ example calls a function called print_hello to print the \"Hello World\" on\
    \ screen.\n\nThe call to the function is simply by writing its name followed by\
    \ the parmes with none, one or more arguments and followed by a semicolon.\n\n\
    This function does not accept any argument and does not return anything.\n\nThe\
    \ statements,\n\n```c\nvoid print_hello()\n{\n    printf(\"Hello World\\n\");\n\
    }\n```\n\ncomprise the body of the function. It also referred as function definition.\
    \ A program typically contains more than one function.\n\nmain() is also a function\
    \ which is the starting point of a program.\n\nIf the main() is not defined, the\
    \ compilation results in undefined error. In the general linker expects main()\
    \ to be defined as it is expected by the sequence before calling main(). Who calls\
    \ main()? For this, the short answer is the call is defined somewhere in the libc.\n\
    \nA function can only have one signature in C (A function can have many signatures\
    \ in C++). main() prototypes are many unlike many other functions. Some of the\
    \ most used prototypes are as follows.\n\n```c\nint main(void)\n```\n\n```c\n\
    int main(int argc, char **argv)\n```\n\nhowever this is seldom used when writing\
    \ software. main() must return. This is to let the executing shell to know the\
