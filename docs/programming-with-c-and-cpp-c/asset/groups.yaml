  mdcn: "\n\n# 简介\n\n本书尝试解释 C 和 C++ 编程语言。虽然 C 和 C++ 是最古老的编程语言，但它们仍然被大多数操作系统使用，如 Linux，以及\
    \ FreeRTOS 等实时操作系统（RTOS）。这两种语言仍广泛用于固件开发。有时使用 libc 和 libstdc++，有时则不使用。在为 Linux\
