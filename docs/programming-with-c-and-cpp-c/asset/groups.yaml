- md: "\n# Introduction\n\nThis book tries to explain programming in C and C++. C\
    \ and C++ although are the oldest programming languages, they are still in use\
    \ by most of the operating systems such as Linux, RTOSes such as FreeRTOS.\n\n\
    Both languages are still used in firmware development. Sometimes with libc and\
    \ libstdc++ and not using libc and libstdc++. When writing code for Linux systems,\
    \ most of the time libraries are used when writing the software. Using the library\
    \ simplifies the software development as it provides most of the interfaces. In\
    \ cases where the libraries become costly are when we are programming small-scale\
    \ devices such as microcontrollers with limited RAM and Flash memory. In such\
    \ cases, the preference is to use the programming language's constructs as much\
    \ as possible than using any of the library functions.\n\nFor example, the following\
    \ are provided by the C and C++ libraries:\n\n- 1. string manipulation\n- 2. console\
    \ operations (writing to and reading from console).\n- 3. file system interaction\
    \ (FILE i/o)\n- 4. Operating system abstractions in case of C++ (such as creation\
    \ and use of threads, interacting with file system)\n\nThe compiler implements\
    \ the C, C++ languages. It verifies the program is compliant to the language specification\
    \ and generates a binary file.\n\nTo install gcc and g++ on Ubuntu:\n\n```bash\n\
    sudo apt install gcc g++\n```\n\n# Audience\n\nThe audience of this book are basic\
    \ and intermediate programmers. For advanced programmers, you may already know\
    \ about the programming constructs.\n\n# C programming\n\n# Basic Hello World\
    \ program\n\nBelow is a basic hello world program in C.\n\n```c\n#include <stdio.h>\n\
    \nint main() {\n    // prints Hello World on console\n    printf(\"Hello World\\\
    n\");\n    return 0;\n}\n```\n\nExample.1 : hello_world.c is a function and the\
    \ program always executes from main(). The function call printf, allows the program\
    \ to write to a console. The header file stdio.h contains the prototype of printf.\n\
