    \ can be assigned to any pointer. When assigned, the compiler implicitly takes\
    \ care of assigning the null pointer. The nullptr does not point to 0 or (void*)0.\n\
    \nFor example the following statements are still valid in C++.\n\n```\nint *p\
    \ = 0; // old use of O for null\nint *p = NULL; // NULL pointer use in C\n```\n\
    \nIn general it is extremely difficult to find the type of the variable when using\
    \ auto type deduction.\n\n```\nauto res = get_data();\n\nif (res == 0) // assuming\
    \ 0 here is a null pointer\n}\n```\n\nHowever, the type understood could be a\
    \ NULL if the get_data is actually returning a NULL pointer.\n\n```\nif (res ==\
    \ nullptr) // always guaranteed the res is a null pointer\n```\n\nData structure\
    \ pointers can be assigned to nullptr as well.\n\n```\nstruct S {\n    int a;\n\
    };\n```\n\n```\n*s1 = NULL; // still valid\n*s2 = nullptr; // valid\n```\n\nIn\
    \ some of the standard types such as shared_ptr, unique_ptr assigning could result\
    \ in ambiguous result. The shared_ptr and unique_ptr are part of the standard\
    \ template library. This will be discussed further in their corresponding sections.\n\
    \n```\nstd::shared_ptr<S> s1 = 0; // may work\nstd::shared_ptr<S> s2 = nullptr;\n\
    ```\n\n# 7. Functions with default arguments\n\nC++ allows functions with default\
    \ arguments. For example,\n\n```\nint f(int a, int b = 10)\n{\n    return a +\
