    ```\n\n`sizeof` 运算符用于确定数据类型的字节数。\n\n# 格式说明符\n\n格式说明符用于 `printf` 和 `scanf`，以格式化数据的输出或输入。\n\
    \n| 序号 | 格式说明符 | 含义 |\n|---|---|---|\n| 1 | %d | 整数 |\n| 2 | %c | 字符 |\n| 3 |\
