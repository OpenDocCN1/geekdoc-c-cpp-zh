  - "[PAGE 247]\n\n# Thread Pool\n\nThe thread pool is a group of threads that work\
    \ on specific jobs that are queued to them.\n\nThe threads are created early in\
    \ the startup. All the threads could listen on a single queue or a multi queue.\
    \ The main thread assigns the tasks to the threads and each thread execute these\
    \ tasks that are queued to them.\n\nSo idea of separate queue for each thread\
    \ generally makes sense to avoid any possible starvation when each thread pulls\
    \ the task from the queue.\n\nThus we need to define a context for each thread.\
    \ It may look something like the below. \n\n```\nstruct thread_context {\n   \
    \ uint32_t id; // identifier for thread\n    std::shared_ptr<std::thread> t_;\
    \ // actual thread pointer\n    std::mutex lock_; // lock for the queue\n    std::condition_variable\
    \ cond_; // condition variable for the queue\n    std::queue<work_fn> work_list_;\
    \ // list of function callbacks\n    int queue_length_; // length of the queue\n\
    \    bool queued_; // signals if work is queued\n    bool signaled_; // signal\
    \ to quit the thread\n\n```\n\n```\n// constructor\nexplicit thread_context(uint32_t\
    \ id);\n\n// queue the work\nvoid queue(work_fn fn);\n\n// get thread id\nuint32_t\
    \ get_id() { return id_; };\n\n// join the thread\nvoid join() { t_->join(); }\n\
    \n// get the queue size\nint get_queue_size() { return queue_size_; }\n\n// signal\
    \ the thread\nvoid signal();\n\n// destructor\nthread_context();\nvoid worker_thread();\
    \ // the thread function\n\n```\n\n};\nThe worker function callback would look\
    \ as follows,"
- md: "\n```cpp\ntypedef std::function<void(void)> work_fn;\n```\n\nThe `id` is a\
    \ thread identifier.\n\nWe took `std::thread as shared_ptr` so we can instantiate\
    \ it later during the allocation.\n\nThe `lock_` and `cond_` variables are used\
    \ to sequentialize access to the queue `work_list_`.\n\nThe queue holds the list\
    \ of function callbacks that are to be executed.\n\nWe use `queue_length_` to\
    \ determine the fairness and optimize the time it takes for a work callback to\
    \ execute on a thread.\n\nThe variable `signaled_` is used for synchronization\
    \ between the main thread and the worker threads.\n\nThe variable `signaled_`\
    \ is used to inform the thread when to quit.\n\nThe `worker_thread` is the thread\
    \ that executes the queued work functions.\n\nThe constructor `thread_context`\
    \ would create the thread as follows.:\n\n```cpp\nthread_context::thread_context(uint32_t\
    \ id)\n    t_ = std::make_shared<std::thread>(&thread_context::worker_thread,\
    \ this);\n```\n\nNow, the thread or the caller library functions would have to\
    \ store each thread context.\n\n```cpp\nclass thread_pool {\npublic:\n    // initialize\
    \ thread pool with n_threads\n    explicit thread_pool(int n_threads);\n    ~thread_pool();\n\
    \n    // queue work to the thread pool\n    void queue(work_fn fn);\n\n    //\
    \ run the thread pool wait for them to finish execution\n    void run();\n\n \
    \   // signal the threads to stop\n    void signal();\n\nprivate:\n    // store\
    \ number of threads\n    int n_threads_;\n\n    // vector of threads\n    std::vector<std::shared_ptr<thread_context>>\
    \ tc_list;\n};\n```\n\nThe users of the thread pool can then simply do,\n`thread_pool\
    \ t(4);`\n\n```cpp\nt.queue(&work_1);\nt.queue(&work_2);\n..\n```\n\nt.run();\n\
    \nThe method `thread_pool::run` is simply used to wait for all threads to finish.\
    \ This will return if the threads stop executing. So at some point in time such\
    \ program stops, we call `thread_pool::signal` to signal the threads to stop.\n\
    \nThe job queuing takes a very generic function that accepts and returns no parameter.\n\
    \nThis is of type `std::function` so one can use straight functions or use `std::bind`\
