    \ Multi-threading is described below.\n\n## Sets\n\n## Dequeue\n\n## Maps\n\n\
    std::map defines a map type.\n\n## shared_ptr, unique_ptr\n\nThe shared_ptr is\
    \ a scoped allocator defined in C11. The idea of scoped allocation is to free\
    \ the allocated memory when count of all its references to the allocated memory\
    \ become 0. Below is one example of shared_ptr.\n\n```cpp\n#include <iostream>\n\
    #include <memory>\n\nstruct S {\n    int s;\n};\n\nint main() {\n    std::shared_ptr<S>\
    \ s;\n\n    s = std::shared_ptr<S>(new S);\n\n    s->s = 1;\n\n    std::cout <<\
    \ \"s: \" << s->s << std::endl;\n\n    return 0;\n}\n```\n\nHere we write a deref\
    \ operator -> to return the actual underlying pointer. The caller still assumes\
    \ the shared_ptr is still a wrapper which is true. We have also written the operator\
    \ * if in case the type is a basic type such as an integer.\n\n```cpp\n#include\
    \ <iostream>\n#include <memory>\n\nstruct P {\n    int val;\n};\n\nvoid print(std::shared_ptr<P>\
    \ p) {\n    P* p1 = p.get();\n    printf(\"p->val %d\\n\", p1->val);\n    printf(\"\
    val %d\\n\", (*p1).val);\n    printf(\"use_count %ld\\n\", p.use_count());\n}\n\
    \nint main() {\n    std::shared_ptr<P> ptr;\n    ptr = std::make_shared<P>();\n\
    \    ptr->val = 4;\n    print(ptr);\n    return 0;\n}\n```\n\nAs you can see we\
    \ do not call free or delete. The reason being that the program goes out of scope\
    \ (in this case the main function) it is already freed. Running valgrind shows\
    \ 0 leaks.\n\n==20868== HEAP SUMMARY:\n==20868== in use: 0 bytes in 0 blocks\n\
    ==20868== total heap usage: 4 allocs, 4 frees, 7480 bytes allocated\n==20868==\
    \ All heap blocks were freed -- no leaks possible\n\n## Writing shared_ptr class:\n\
    \nTo write shared_ptr we need to consider the following:\n\n- Referencing counting.\n\
    - Allocation and freeing. The allocation part is not available in this example\
    \ and leave to the caller. The destructor will perform the freeing, this is exactly\
    \ one of the purposes of the shared_ptr feature.\n\n```cpp\n#include <iostream>\n\
    \ntemplate <typename T>\nclass shared_ptr {\npublic:\n    explicit shared_ptr()\
    \ : count_(0), memory_(nullptr) {\n}\n    explicit shared_ptr(T *t) : count_(0)\
    \ {\n        memory_ = t;\n        count_++;\n    }\n\n    shared_ptr operator=(const\
    \ shared_ptr &s) {\n        this->count++;\n        std::cout << \"called\" <<\
    \ std::endl;\n        return *this;\n    }\n\n    shared_ptr(const shared_ptr\
    \ &kt) {\n        count_ = 0;\n        memory_ = nullptr;\n        memory_ = t.memory;\n\
    \        count_ = t.count_ + 1;\n    }\n\n    ~shared_ptr() {\n        count--;\n\
    \        if (memory_ && (count_ == 0)) {\n            delete memory;\n       \
    \ }\n    }\n\n    void set(T *memory) {\n        memory_ = memory;\n        count_++;\n\
    \    }\n\n    T *get() { return memory_; }\n\n    bool unique() const { return\
    \ count_ == 1; }\n\n    T *operator() const { return memory_; }\n\n    T &operator->()\
    \ const { return memory_; }\n\nprivate:\n    int count_;\n    T *memory_;\n};\n\
    \nstruct S {\n    int s;\n};\n\nvoid K(shared_ptr<S> s) {\n    s->s = 6;\n}\n\n\
    int main() {\n    shared_ptr<S> s = shared_ptr<S>(new S);\n    shared_ptr<int>\
    \ s1 = shared_ptr<int>(new int);\n\n    s->s = 3;\n    *s1 = 3;\n\n    K(s);\n\
    \n    std::cout << \"s: \" << s->s << \" \" << \"s1: \" << *s1 << std::endl;\n\
    \n    return 0;\n}\n```\n\n## Threads\n\nC++ implements abstraction of threads\
    \ based upon the threads. The class std::thread defines the thread interface.\
    \ Threads defined in C11 onwards.\n\nCreating a thread is a simple job of declaring\
    \ a thread object and passing the function that serves as a thread function.\n\
    \nBelow is one example:\n\n```cpp\n#include <iostream>\n#include <thread>\n\n\
    void thread_f() {\n    std::cout << \"in thread\" << std::endl;\n}\n\nint main()\
    \ {\n    std::thread t(thread_f);\n    std::cout << \"starting thread\" << std::endl;\n\
    \    t.join();\n    std::cout << \"joined thread\" << std::endl;\n}\n```\n\nCompile\
    \ the above program with -pthread option. Some compilers may not require this\
    \ option.\n\nBelow are few methods presented in std::thread.\n\n| S.No | Method\
