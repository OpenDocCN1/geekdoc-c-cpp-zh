    \n# Search and Sorting\n\nSorting is a process through which elements are arranged,\
    \ more generally in ascending order. There are various ways to sort elements.\
    \ Below are a few mentioned here:\n\n- Bubble Sort\n- Insertion Sort\n- Merge\
    \ Sort\n- Quick Sort\n\n# Bubble Sort\n\nThe bubble sort algorithm works like\
    \ the following:\n\n1. Compare two elements (one and next) and swap them if the\
    \ first is greater than the second.\n2. Keep going until the largest element reaches\
    \ the end.\n3. Repeat steps 1 and 2 till all elements are sorted.\n\nA pseudo\
    \ implementation of this looks as:\n\n```c\nfor (int i = 0; i < n - 1; i++) {\n\
    \    for (int j = 0; j < n - i - 1; j++) {\n        if (a[j] > a[j + 1]) {\n \
    \           swap(a[j], a[j + 1]);\n        }\n    }\n}\n```\n\nAs we see, loop\
    \ till array length to avoid out of bounds. Below is an implementation of bubble\
    \ sort.\n\n```cpp\n#include <iostream>\n\ntemplate <typename T>\nvoid bubble_sort(T\
    \ *a, int n) {\n    int i;\n    int j;\n    int iters = 0;\n    bool sorted =\
    \ false;\n\n    for (i = 0; i < n - 1; i++) {\n        sorted = false;\n     \
    \   for (j = 0; j < n - i - 1; j++) {\n            if (a[j] > a[j + 1]) {\n  \
    \              T t = a[j];\n                a[j] = a[j + 1];\n               \
    \ a[j + 1] = t;\n                sorted = true;\n            }\n        }\n  \
    \      iters++;\n        if (!sorted) {\n            break;\n        }\n    }\n\
    \    std::cout << \"iters: \" << iters << std::endl;\n}\n\nint main() {\n    int\
    \ a[10] = {91, 19, 1, -1, 11, -18, 29, 7, 9, 10};\n\n    bubble_sort(a, sizeof(a)\
    \ / sizeof(a[0]));\n\n    for (int i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n\
    \        std::cout << a[i] << std::endl;\n    }\n\n    return 0;\n}\n```\n\n#\
    \ Using bubblesort to sort linked lists\n\nLinked lists are sorted with the bubblesort\
    \ technique. When we are sorting the same algorithm will be used but the lists\
    \ must be checked and swapped instead of arrays as above. To sort the lists we\
