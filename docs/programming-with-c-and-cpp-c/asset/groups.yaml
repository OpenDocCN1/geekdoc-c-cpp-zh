    \    }\n    return n;\n}\n```\n\n### 6. for_each\n\nfor_each 遍历每个链并调用回调。调用者必须传递回调，调用者将获得元素作为数据。\n\
    \n```c\nvoid for_each(void (*callback)(void *elem)) {\n    struct linked_list\
    \ *curr = head;\n    while (curr != NULL) {\n        if (callback) {\n       \
    \     callback(curr->elem);\n        }\n        curr = curr->next;\n    }\n}\n\
    ```\n\n### 7. print\n\n通过遍历列表中的每个元素打印列表的内容。\n\n```c\nvoid print() {\n    struct\
    \ linked_list *curr = head;\n    printf(\"elements:\\n\");\n    while (curr !=\
    \ NULL) {\n        int *data = (int*)curr->elem;\n        printf(\"%d\\n\", *data);\n\
