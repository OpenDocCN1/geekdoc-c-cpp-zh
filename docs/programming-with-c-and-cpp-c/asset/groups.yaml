    \ than one signature to a function. Below\nis one example,\n\n```\nint F(int a);\n\
    int F(int a, int b);\n```\n\nThe function F is here overloaded and the two signatures.\
    \ The compiler\ninds out which of F to be called based on the definition.\n\n\
    ```\n#include <iostream>\n```\n\n```\nint F(int a) { return a; }\nint F(int a,\
    \ int b) { return a + b; }\n```\n\n```\nint main(){\n    std::cout << \"F(3):\
    \ \" << F(3) << std::endl;\n    std::cout << \"F(3,3): \" << F(3,3) << std::endl;\n\
    \nreturn 0;\n}\n```\n\nIn the arguments to the functions are allowed to be overloaded.\
    \ However,\nthe return type of functions are not allowed to be overloaded. For\
    \ example,\n\n```\n#include <iostream>\n```\n\n```\nint F(int a) { return a; }\n\
    void F(int a) { }\n```\n\n```\nint main(){\n    F(3);\n}\n```\n\nResults in a\
    \ compiler error.\n\n```\ncpp/overload_f.cc:4:6: error: ambiguous new declaration\
    \ of 'void F(int)'\n4 | void F(int a) { }\nncpp/overload_f.cc:3:5: note: old declaration\
    \ 'int F(int)'\n3 | int F(int a) { return a; }\n|\n```\n\nFunction overloading\
    \ is really useful when a function wants to do different jobs\nkeeping the name\
    \ same but different signature."
- md: "\n# Exception Handling\n\n```cpp\n#include <iostream>\n\nstruct S {\n    S(int\
    \ r) {\n        if (r == 0) {\n            throw std::runtime_error(\"r is 0\"\
    );\n        }\n    }\n    int a;\n};\n\nint main() {\n    try {\n        S r1(0);\n\
    \    } catch (std::runtime_error &r) {\n        std::cout << \"exception: \" <<\
    \ r.what() << std::endl;\n    }\n\n    S r2(3);\n    return 0;\n}\n```\n\n```cpp\n\
    #include <iostream>\n#include <exception>\n```\n\n```cpp\nclass S : public std::out_of_range\
    \ {\npublic:\n    S(const char *err) : std::out_of_range(err) {}\n    S() {}\n\
    \n    void set(int v) {\n        if (v > 10) {\n            throw *this;\n   \
    \     }\n        a = v;\n    }\n\n    virtual const char *what() const noexcept\
    \ {\n        return \"a value out of range\";\n    }\n};\n```\n\n```cpp\nint main()\n\
    {\n    S r1(\"\");\n\n    try {\n        r1.set(11);\n    } catch (S &r) {\n \
    \       std::cout << r.what() << std::endl;\n    }\n    return 0;\n}\n```\n\n\
    # noexcept\n\nThe **noexcept** is an operator and also a specifier.\n\n# noexcept\
    \ specifier\n\nThe **noexcept** specifier informs the compiler that the particular\
    \ function / constructor / destructor does not produce an exception. It also governs\
    \ underlying rules when it is inherited classes.\n\nA noexcept specifier can be\
    \ attached to the end of the function:\n\n```cpp\nint f(void) noexcept; // says\
    \ function does not throw an exception\nint g(void); // may throw an exception\n\
    ```\n\nA function declared with **noexcept** but throws, results in the library\
    \ calling `std::terminate`. This makes the exception uncatchable.\n\nAn overloaded\
    \ function can have a different exception specification. For example, below example\
    \ is valid.\n\n```cpp\nint f(void) noexcept;\nint f(std::string arg);\n```\n\n\
    Below program covers almost all the noexcept cases:\n\n```cpp\n#include <iostream>\n\
    \nvoid f() noexcept { std::cout << \"f called\" << std::endl; }\nvoid f(std::string\
    \ arg) { std::cout << \"f called with arg: \" << arg << std::endl; }\n\nvoid g()\
    \ noexcept { throw std::runtime_error(\"an exception g()\"); }\n\nvoid p() { throw\
    \ std::runtime_error(\"an exception p()\"); }\n```\n\n```cpp\nint main() {\n \
    \ f();\n  f(\"test\");\n\n  try {\n    p();\n  } catch (const std::exception&\
    \ e) {\n    std::cout << \"caught the exception from function p():\" << e.what()\
    \ << std::endl;\n  }\n\n  try {\n    g();\n  } catch (...) {\n    std::cout <<\
    \ \"caught the exception from function g()\\n\";\n  }\n}\n```\n\nIf a base class\
    \ contains any member functions with noexcept specifier then the derived class\
    \ must also contain the noexcept specification. Without it, this results in compiler\
    \ error.\n\n```cpp\n#include <iostream>\n```\n\n```cpp\nclass F {\npublic:\n \
    \   virtual void f() noexcept = 0;\n};\n```\n\n```cpp\nclass G : public F {\n\
    public:\n    void f() { std::cout << \"in f()\" << std::endl; }\n};\n```\n\n```cpp\n\
    int main() {\n    G g;\n    g.f();\n}\n```\n\nResults in compiler error:\n\n```cpp\n\
    cpp/noexcept_inh.cc:10:22: error: looser exception specification on overriding\
    \ virtual function\n10 | void f() { std::cout << \"in f()\" << std::endl; }\n\
    cpp/noexcept_inh.cc:5:30: note: overridden function is 'virtual void F::f() noexcept'\n\
    5 | virtual void f() noexcept = 0;\n```\n\nHowever, a derived class can specify\
    \ noexcept otherwise or the base class do not have it.\n\nFor example the below\
    \ program compiles.\n\n```cpp\n#include <iostream>\n```\n\n```cpp\nclass F {\n\
    public:\n    virtual void f() = 0;\n};\n```\n\n```cpp\nclass G : public F {\n\
    public:\n};\n```\n\n```cpp\nvoid f() noexcept { std::cout << \"in f()\" << std::endl;\
    \ }\n\nint main()\n{\n    G g;\n    g.f();\n}\n```\n\n# Standard library\n\nStandard\
    \ library or STL in short is a group of helper function that ease up programming.\
    \ Nowadays, they are more focussed towards helping programmers write OS independent\
    \ software using C++.\n\n# std::pair\n\n**std::pair** defines a pair of values.\
    \ The usecases are when returning more than one variable from a function or passing\
    \ to a function as key-value pair.\n\n**std::pair** can be used to construct a\
    \ pair or `std::make_pair` can be used as well.\n\n```cpp\nauto p = std::pair<std::string,\
    \ int>(\"test\", 1); // constructs std::pair type in p\np = std::make_pair<std::string,\
    \ int>(\"test\", 1); // makes a pair of type std::pair\n```\n\nBelow one example\
    \ of usecase for `std::pair`:\n\n```cpp\n#include <iostream>\n\nvoid f(const std::pair<std::string,\
    \ int>& p) {\n    std::cout << \"first: \" << p.first << \" second: \" << p.second\
    \ << std::endl;\n}\n\nint main() {\n    f(std::make_pair(\"test\", 1));\n    f(std::make_pair<std::string,\
    \ int>(\"test\", 2));\n}\n```\n\n**std::pair** also exposes operators ==, !=,\
    \ <. One can use operations for comparison. Here's one example:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    auto r = std::pair<std::string, int>(\"test\"\
    , 1);\n    auto r1 = std::make_pair<std::string, int>(\"test\", 1);\n\n    std::cout\
    \ << \"r == r1: \" << (r == r1) << std::endl;\n\n    return 0;\n}\n```\n\n**std::pair**\
    \ can be implemented with templates. See usecases for implementation of `std::pair`.\n\
    \n# Arrays\n\nstd::array defines an array type. The std::array contains the following\
    \ methods:\n\n```cpp\ntemplate <typename T, size_t n>\nclass array<T, n>;\n```\n\
    \nMost usual of declaring an array of integers is, similar to declaring it a[10].\n\
    \n- 1. at Returns the index.\n- 2. operator[] Used to access the element stored\
    \ at the index.\n- 3. size Returns the size of array.\n\nBelow is an example of\
    \ std::array.\n\n```cpp\n#include <iostream>\n#include <array>\n\nint main() {\n\
    \    std::array<int, 10> a;\n    int i;\n    for (i = 0; i < a.size(); i++) {\n\
    \        a[i] = i + 1;\n    }\n    for (i = 0; i < a.size(); i++) {\n        std::cout\
    \ << \"i: \" << i << \" \" << a.at(i) << std::endl;\n    }\n    return 0;\n}\n\
    ```\n\n# Strings\n\nstd::string defines a string type. Requires <string> but it\
    \ seems to implicitly include it.\n\n| S. No | Method | Description |\n|---|---|---|\n\
    | 1 | c_str() | get the C string |\n| 2 | front() | access the front character\
    \ |\n| 3 | back() | access the last character |\n| 4 | size() | length of the\
    \ string |\n| 5 | clear() | clear the string |\n| 6 | operator[] | array to index\
