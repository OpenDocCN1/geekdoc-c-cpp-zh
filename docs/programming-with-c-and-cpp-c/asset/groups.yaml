    \ |\n| 7 | %lld | 长整数 |\n| 8 | %lu | 长无符号整数 |\n| 9 | %llu | 长无符号整数 |\n| 10 | %x\
    \ | 十六进制 |\n\n以下是一些使用格式说明符的更多函数：\n\n| 序号 | 函数名 |\n|---|---|\n| 1 | scanf |\n|\
    \ 2 | printf |\n| 3 | scansf |\n| 4 | vprintf |\n| 5 | vsprintf |\n\n"
