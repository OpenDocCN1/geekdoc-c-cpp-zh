    #include <stdio.h>\n\nint main() {\n    int a = 0;\n    int b = 1;\n    printf(\"\
    %d %d\\n\", a | b);\n    return 0;\n}\n```\n\n### 示例.8 逻辑与运算符\n\n输出是：\n\n# 作用域和变量的生命周期\n\
    \n函数内部声明的每个变量都有特定的作用域。当函数返回时，这些变量将被销毁或从内存中移除。通常情况下，每个程序由操作系统分配了一定的内存。该内存被划分为以下部分：\n\
    \n1. 栈段 (stack segment)\n2. 堆段 (heap segment)\n3. 数据段 (data segment)\n4. 代码段 (text\
    \ segment)\n\n下面是图示表示。\n\n| | |\n|---|---|\n| 栈段 | 栈在内存中向下增长 |\n| 堆段 | 堆在内存中向上增长\
    \ |\n| 未初始化数据 | |\n| 初始化数据 | |\n| 代码 | |\n\n# 1. 栈段\n\n局部栈默认大小为 8 字节。但这取决于操作系统。在基于\
    \ RTOS 的系统中，它是在链接器脚本中配置的。栈在内存中向下增长。局部变量和函数参数是栈的一部分。每当调用函数时，都会进行分配并向下。返回后，栈会自动释放。通常，如果分配达到最大值，栈会耗尽，导致栈溢出。在某些操作系统中，这将导致系统停止（例如在微控制器上的\
    \ RTOS），而系统其他部分正常执行。在任何情况下，结果都是程序中止。为了避免这种情况，必须仔细使用栈内存。如果没有堆段，可以使用数据段。栈变量的生命周期仅限于函数。这通常是通过将作用域限制在函数或组内的正确编程方法之一。下面的示例显示了限制在函数内的静态变量。\n\
    \n```\nint F()\n{\n    int a = 3;\n\n    return a * 2;\n}\n```\n\n### 示例.9 局部变量\n\
    \n在这里变量 a 是局部变量，是栈的一部分。下面是带栈的作用域变量设置另一个示例。\n\n```\nint F()\n{\n    // 变量 a 的范围位于\
    \ { } 之间\n    {\n        int a = 3;\n\n        a *= 3;\n    }\n\n    return a;\
    \ // 返回 a 未定义的错误\n}\n```\n\n### 示例.10 作用域声明语句\n\nGCC 提供了编译器选项来检查栈的使用。查看 GCC 编译器选项。\n\
    \n# 2. 堆段\n\n这是分配动态内存的空间。它是通过编程语言中的分配函数显式分配的。C 和 C++ 暴露以下分配程序：\n\n1. malloc\n\
    2. calloc\n3. realloc\n4. free\n5. new\n6. delete\n\n最后两个在 C++ 标准库中，但它支持所有这些。C\
    \ 库支持前 4 个。\n\n一旦通过这些调用进行分配，释放内存的方法只有调用 free 程序。它没有自动释放。如果不释放任何堆内存，长时间运行后，系统将耗尽内存空间。\n\
    \n不释放堆内存会导致内存泄漏。当程序停止运行时，通常操作系统会清理分配给它的内存，并将内存归给空闲池。然而，如果程序运行了很长时间且从未释放内存，会导致内存占用增加，并可能导致内存压力/耗尽。\n\
    \n通常操作系统通过触发自动杀死使用高内存的程序来响应内存耗尽，以恢复内存使用。在 Linux 中，这被称为内核空间中的 OOM  Killer。\n\n\
    堆段的生命周期是整个程序，但作用域限于局部或文件作用域。分配的内存始终是堆段的一部分。\n\n# 3. 数据段\n\n数据段包括初始化和未初始化段。\n\n\
    以下是变量属于数据段的一些情况：\n\n- 可由所有源文件中所有函数全局访问的变量。\n- 可由源文件本地所有函数访问的变量。通常我们使用 static 前缀将它们的作用域限制在单个文件中。\n\
    - 带有 static 前缀且可由函数局部访问的变量。\n\n"
