    | 2 | - | subtraction |\n| 3 | * | multiplication |\n| 4 | / | division |\n| 5\
    \ | % | modulo |\n| 6 | = | equals to |\n| 7 | == | comparison operator |\n| 8\
    \ | | | |\n| 9 | && | logical AND |\n| 10 | & | AND |\n| 11 | ^ | XOR |\n| 12\
    \ | ! | NOT |\n| 13 | !! | Logical NOT |\n| 14 | ++ | increment operator |\n|\
    \ 15 | -- | decrement operator |\n\nBelow example shows an example of the operators.\n\
