    \        count++;\n        q->add(count);\n    }\n}\n```\n\n# 情况 2：实现 LRU\n\n\
    LRU 代表最久未使用。它是一种允许移除最少数据的缓存机制。以下算法基于缓存有限的假设。例如考虑缓存每个元素关联一个序列号。\n\n```cpp\n#include\
    \ <iostream>\n\n/**\n * 定义缓存行\n */\ntemplate <typename T>\nstruct lru_cache_items\
