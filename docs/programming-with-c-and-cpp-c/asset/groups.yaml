  - '[PAGE 268]


    # Code organization for software development


    When writing software in C and C++ it is important to understand the following
    concepts. These are generally applicable for the Building Large software section
    as well.


    +   1. Splitting the functionality into many files


    Sometimes a core functionality may have many parts. For example consider writing
    a GUI application that shows packet data in realtime (such as wireshark). This
    require the continuous data input from a backend, there is a communication between
    backend to the GUI frontend, there is also display style.


    So each of this functionality can be split into many files.


    +   1. backend.c -> implements data read and pass to proxy

    2. proxy.c -> implements proxying between backend and GUI front end.

    3. display.c -> implements display of the data with selected style.


    So generally this technique allows the programmer to identify which place to look
    when there is an issue with something such as specifically backend.


    +   2. Write data structures always in a header file.


    +   3. Write function prototypes always in a header file.'
  - '[PAGE 269]


    # Building large software


    1. Write small functions that can be seen within 80 rows.


    Debugging it generally is the case when a large software is implemented, debugging
    and fixing the software becomes more complex. With the years to maintain it, it
    is always not possible to remember the way a particular feature is written in
    a way that solved the problem. Even the commenting does not solve in many cases
    over years.


    The importance is to write software in a better way avoiding the writing of complex
    functions. The reason of 80 rows being is that the function can be fit in 80 lines.


    +   2. Write meaningful function style and variable names.

    3. Follow programming style of the code base.

    4. Split functionality into many files (C and H).

    5. Reduce the usage of global and static variables.

    6. Reduce the usage of stack when not needed.

    7. Allocate and free - follow the sequence.

    8. Use scoped allocators where possible.

    9. Pre-Allocate everything if possible.

    10. Avoid complex use of double pointers.

    11. Try doing Context based programming.

    12. Use const where possible.

    13. Do not over overly long macros. Change them to functions.

    14. Do not inline every function, almost never inline unless required.


    # 15. Use indexing / Lookup table technique where possible.


    See structures-> Lookup table with structures section. The most common approach
    of accessing or finding an element in a list of elements is to index directly
    into the array.


    This is generally used in the hot path of a software program to avoid looping
    in a list and use indexing to directly access the element at the index. This is
    one of the optimization techniques.


    # 16. Not passing array size as arguments


    In general when passing an array to a function, size of the array must be passed
    as an argument.


    ```

    int f(int *array);

    ```'
  - '[PAGE 270]


    The caller wouldn''t know how long it has to iterate over the elements. Calling
    `sizeof(array)` would only result in calculating the size of a pointer. Even if
    the prototype is the following, the `sizeof` would result in calculating the size
    of a pointer.


    ```

    int f(int array[])

    ```


    So the correct prototype becomes,


    ```

    int f(int *array, int array_size);

    ```


    +   17. Every Pointer is not required to be validated'
  - '[PAGE 271]


    When writing software for a large scale project, sometimes some of the utility
    functions or common routines need to be called often. Sometimes, many application
    tend to replicate these and roll out their own implementation of these functions.
    This is generally has the following problems:


    +   1. Codeat with repeat of many functions doing same thing.

    2. If there is a problem in one function, the others called that are not using
    this function will not get a benefit when the function''s problem is solved.

    3. Increased program size.

    4. Increased development times.


    These are some of the reasons why libraries concept is introduced.


    The Compiler provides a way to generate libraries out of a group of C or C++ source
    files. They are group of object files and the functions they offer, contain prototypes
    in the respective .h files.


    These libraries can then be linked with the other object files during the linkage
    time to create the final binary / library.


    There are static and dynamic libraries.


    Static libraries are the ones that when linked, copies the function directly to
    the target binary. This increases the size of the binary considerably.


    Dynamic libraries on the other hand, keeps a reference of the function in the
    target binary. This may not increase the size of the binary. However, during the
    runtime, the loader sees the reference of the function and loads the function
    when it gets called. This adds additional runtime over head.


    Check cmake section about creating static and dynamic libraries.'
- md: "\ncreating binaries\n\n# cmake\n\ncmake is a scripting language that can be\
    \ used to create what are known as CMake Files. Each of these can be used to compile\
    \ the group of source files to generate target libraries or binaries.\n\n## 1.\
    \ Creating a basic CMakeLists.txt\n\n```cmake\ncmake_minimum_required(VERSION\
    \ 3.9)\nproject(Example)\n```\n\n```cmake\nset(SRC\n    ./file_1.c\n    ./file_2.c)\n\
    ```\n\n```cmake\nadd_executable(file_ops ${SRC})\n```\n\nThe above cmake file\
    \ is created to make an executable file called **file_ops**.\n\nThe source files\
    \ **file_1.c** and **file_2.c** are part of the SRC definition.\n\nThe items **project**\
    \ and **cmake_minimum_required** are not mandatory but cmake warns when we do\
    \ not keep them. They generally help you guide about what project you are building\
    \ to and the type of cmake features you are using.\n\nBelow is the command to\
    \ generate the target binary,\n\n```bash\nmkdir build/\ncd build/\ncmake ..\n\
    nmake\n```\n\n**cmake** build generates a lot of intermediate artifacts and dirties\
    \ the directory. So, better create a directory called **build** and run **cmake**\
    \ from there.\n\nIf you do not have **cmake** installed, on Ubuntu run the following\
    \ command:\n\n```bash\nsudo apt install make cmake\n```\n\n## 2. Creating library\n\
    \n```cmake\ncmake_minimum_required(VERSION 3.9)\nproject(Example_Lib)\n```\n\n\
    ```cmake\nset(LIB_SRC\n./file_1.c)\n```\n\n```cmake\nadd_library(file ${LIB_SRC})\n\
    ```\n\nThe add_library instructs the cmake to create a static library libfile.a.\n\
    Below example creates a shared library.\n\n```cmake\ncmake_minimum_required(VERSION\
    \ 3.9)\nproject(Example_Lib)\n```\n\n```cmake\nset(LIB_SRC\n./file_1.c)\n```\n\
    \n```cmake\nadd_library(file SHARED ${LIB_SRC})\n```\n\nThe SHARED specifier creates\
    \ a .so file called libfile.so. Without mentioning SHARED, the add_library generates\
    \ a .a file by default.\n\n## 3. Linking with libraries\n\nThe target_link_libraries\
    \ is used to link the library to the target binary.\nBelow is one example:\n\n\
    ```cmake\ncmake_minimum_required(VERSION 3.9)\nproject(Example_Bin)\n\nset(SRC\n\
    \    ./file.c)\n\nset(LIB_SRC\n    ./file_i.c)\n\nadd_library(file ${LIB_SRC})\n\
    add_executable(file_ops ${SRC})\ntarget_link_libraries(file_ops file)\n```\n\n\
    ## 4. Adding CFLAGS and CPPFLAGS\n\n```cmake\nset(CMAKE_C_FLAGS \"-Wall -Werror\"\
    )\nset(CMAKE_CXX_FLAGS \"-Wall -Werror\")\n```\n\nThe flag CMAKE_C_FLAGS and CMAKE_CXX_FLAGS\
    \ takes all the compiler option that can be passed to gcc/g++ or clang.\n\n##\
    \ 5. adding C++ standard\n\n```cmake\nset(CMAKE_CXX_STANDARD \"11\")\n```\n\n\
    The macro CMAKE_CXX_STANDARD sets the C++ standard when compiling.\n\n# Data Structures\n\
    \n## Linked Lists\n\nLinked list is a chain of elements terminated with a NULL\
    \ pointer.\n\nEach item in chain is called the node. Each node contains data and\
    \ a pointer to the next item in the list. The last node pointer will be NULL.\n\
    \nLinked list structure looks as follows:\n\n```\n|------|-------|-------|------|\n\
    | item 1 |----> item 2 |----> item 3 |-- . . -> NULL\n|------|       |       |------|\n\
    ```\n\nThe list always ends with a NULL pointer.\n\nThe linked list structure\
    \ looks as follows:\n\n```c\nstruct linked_list {\n    void *elem;\n    struct\
    \ linked_list *next;\n}\n```\n\nthe data pointer holds the data and the next pointer\
    \ links to the next element in the list.\n\nBelow are some of the general operations\
    \ on the list.\n\n| S.No | Name | Description |\n| :--- | :--- | :--- |\n| 1 |\
    \ add | Add an element to the list at the end |\n| 2 | add_head | Add an element\
    \ to the list at the head |\n| 3 | delete | delete an element from the list |\n\
    | 4 | find | find an element in the list |\n| 5 | count | count the number of\
    \ elements in the list |\n| 6 | for_each | iterate through each element in the\
    \ list |\n| 7 | print | print all the elements of the list |\n| 8 | clean | clean\
    \ all linked list and free up the memory allocated |\n\nDefine two global variables\
    \ head and tail.\n\n```c\nstatic struct linked_list *head;\nstatic struct linked_list\
    \ *tail;\n```\n\nWe use two pointers head and tail. The head is used to iterate\
    \ over each element from the beginning and tail is used to add element at the\
    \ end.\n\n### 1. add\n\nAdding an element can be as simple as adding an element\
    \ at the end.\n\nIf there are no elements in the list, add the element at the\
    \ head. If there are elements in the list, add the element after tail. Whenever\
    \ an element is added the tail to the last element.\n\n```c\nint add(void *data)\
    \ {\n    struct linked_list *node = malloc(sizeof(struct linked_list));\n    node->elem\
    \ = data;\n    node->next = NULL;\n    if (head == NULL) {\n        head = tail\
    \ = node;\n    } else {\n        tail->next = node;\n        tail = node;\n  \
    \  }\n}\n```\n*(Note: The OCR text for the implementation of add was fragmented/broken;\
    \ I have reconstructed the logic based on the context provided in the source text).*\n\
    \n### 2. add_head\n\nAdding an element at the head is simple:\n\n```c\nvoid add_head(void\
    \ *data) {\n    struct linked_list *node = malloc(sizeof(struct linked_list));\n\
    \    node->elem = data;\n    node->next = head;\n    if (head == NULL) {\n   \
    \     head = tail = node;\n    } else {\n        head = node;\n    }\n}\n```\n\
    \n### 3. delete\n\nDeleting an element from the list:\n\n```c\nvoid delete(void\
    \ *data) {\n    struct linked_list *curr = head;\n    struct linked_list *prev\
    \ = NULL;\n    while (curr != NULL) {\n        if (curr->elem == data) {\n   \
    \         if (prev == NULL) {\n                head = curr->next;\n          \
    \  } else {\n                prev->next = curr->next;\n            }\n       \
    \     if (curr == tail) {\n                tail = prev;\n            }\n     \
    \       free(curr);\n            return;\n        }\n        prev = curr;\n  \
    \      curr = curr->next;\n    }\n}\n```\n\n### 4. find\n\nThe find iterates over\
    \ each element and compares the pointer with the given pointer.\n\n```c\nbool\
    \ find(void *elem) {\n    struct linked_list *curr = head;\n    while (curr !=\
    \ NULL) {\n        if (curr->elem == elem) {\n            return true;\n     \
    \   }\n        curr = curr->next;\n    }\n    return false;\n}\n```\n\n### 5.\
    \ count\n\nThe count iterates over each link and increments the counter.\n\n```c\n\
    int count() {\n    struct linked_list *curr = head;\n    int n = 0;\n    while\
    \ (curr != NULL) {\n        n++;\n        curr = curr->next;\n    }\n    return\
    \ n;\n}\n```\n\n### 6. for_each\n\nThe for_each iterates over each link and calls\
    \ the callback. The caller must pass the callback and the caller will get the\
    \ element as the data.\n\n```c\nvoid for_each(void (*callback)(void *elem)) {\n\
    \    struct linked_list *curr = head;\n    while (curr != NULL) {\n        if\
    \ (callback) {\n            callback(curr->elem);\n        }\n        curr = curr->next;\n\
    \    }\n}\n```\n\n### 7. print\n\nPrint the contents of the list by iterating\
    \ over each element in the list.\n\n```c\nvoid print() {\n    struct linked_list\
    \ *curr = head;\n    printf(\"elements:\\n\");\n    while (curr != NULL) {\n \
    \       int *data = (int*)curr->elem;\n        printf(\"%d\\n\", *data);\n   \
    \     curr = curr->next;\n    }\n}\n```\n"
  mdcn: "\n\n创建二进制文件\n\n# cmake\n\ncmake 是一种脚本语言，可以用于创建所谓的 CMake 文件。每一个此类文件都可以用于编译一组源文件，以生成目标库或二进制文件。\n\
    \n## 1. 创建基础的 CMakeLists.txt\n\n```cmake\ncmake_minimum_required(VERSION 3.9)\n\
    project(Example)\n```\n\n```cmake\nset(SRC\n    ./file_1.c\n    ./file_2.c)\n\
    ```\n\n```cmake\nadd_executable(file_ops ${SRC})\n```\n\n上面的 cmake 文件用于创建一个名为\
    \ **file_ops** 的可执行文件。\n\n源文件 **file_1.c** 和 **file_2.c** 是 SRC 定义的一部分。\n\n**project**\
    \ 和 **cmake_minimum_required** 项不是强制性的，但当我们不保留它们时，cmake 会发出警告。它们通常可以帮助你引导你正在构建的是什么项目，以及你正在使用的何种\
    \ cmake 特性。\n\n以下是生成目标二进制文件的命令：\n\n```bash\nmkdir build/\ncd build/\ncmake ..\n\
    nmake\n```\n\n**cmake** 构建会产生大量的中间产物并弄乱目录。因此，最好创建一个名为 **build** 的目录并在其中运行 **cmake**。\n\
    \n如果你没有安装 **cmake**，在 Ubuntu 上运行以下命令：\n\n```bash\nsudo apt install make cmake\n\
    ```\n\n## 2. 创建库\n\n```cmake\ncmake_minimum_required(VERSION 3.9)\nproject(Example_Lib)\n\
    ```\n\n```cmake\nset(LIB_SRC\n./file_1.c)\n```\n\n```cmake\nadd_library(file ${LIB_SRC})\n\
    ```\n\nadd_library 指令 cmake 创建一个静态库 libfile.a。\n下面的示例创建了一个共享库。\n\n```cmake\ncmake_minimum_required(VERSION\
    \ 3.9)\nproject(Example_Lib)\n```\n\n```cmake\nset(LIB_SRC\n./file_1.c)\n```\n\
    \n```cmake\nadd_library(file SHARED ${LIB_SRC})\n```\n\nSHARED 指定符会创建一个名为 libfile.so\
    \ 的 .so 文件。如果不提到 SHARED，add_library 默认生成一个 .a 文件。\n\n## 3. 与库链接\n\ntarget_link_libraries\
    \ 用于将库链接到目标二进制文件。\n以下是一个示例：\n\n```cmake\ncmake_minimum_required(VERSION 3.9)\n\
    project(Example_Bin)\n\nset(SRC\n    ./file.c)\n\nset(LIB_SRC\n    ./file_i.c)\n\
    \nadd_library(file ${LIB_SRC})\nadd_executable(file_ops ${SRC})\ntarget_link_libraries(file_ops\
    \ file)\n```\n\n## 4. 添加 CFLAGS 和 CPPFLAGS\n\n```cmake\nset(CMAKE_C_FLAGS \"-Wall\
    \ -Werror\")\nset(CMAKE_CXX_FLAGS \"-Wall -Werror\")\n```\n\n标志 CMAKE_C_FLAGS\
    \ 和 CMAKE_CXX_FLAGS 接收可以传递给 gcc/g++ 或 clang 的所有编译器选项。\n\n## 5. 添加 C++ 标准\n\n```cmake\n\
    set(CMAKE_CXX_STANDARD \"11\")\n```\n\n宏 CMAKE_CXX_STANDARD 在编译时设置 C++ 标准。\n\n\
    # 数据结构\n\n## 链表\n\n链表是以 NULL 指针终止的元素链。\n\n链中的每个项被称为节点。每个节点包含数据以及指向指向列表中下一个元素的指针。最后一个节点的指针将是\
    \ NULL。\n\n链表的结构如下所示：\n\n```\n|------|-------|-------|------|\n| item 1 |---->\
    \ item 2 |----> item 3 |-- . . -> NULL\n|------|       |       |------|\n```\n\
    \n列表始终以 NULL 指针结束。\n\n链表的结构如下所示：\n\n```c\nstruct linked_list {\n    void *elem;\n\
    \    struct linked_list *next;\n}\n```\n\n数据指针持有数据，next 指针链接到列表中的下一个元素。\n\n下面是列表上的一些通用操作。\n\
    \n| 序号 | 名称 | 描述 |\n| :--- | :--- | :--- |\n| 1 | add | 在列表末尾添加一个元素 |\n| 2 | add_head\
    \ | 在列表头部添加一个元素 |\n| 3 | delete | 从列表中删除一个元素 |\n| 4 | find | 在列表中查找一个元素 |\n| 5\
    \ | count | 统计列表中元素的数量 |\n| 6 | for_each | 遍历列表中的每个元素 |\n| 7 | print | 打印列表的所有元素\
    \ |\n| 8 | clean | 清理所有链表并释放分配的内存 |\n\n定义两个全局变量 head 和 tail。\n\n```c\nstatic struct\
    \ linked_list *head;\nstatic struct linked_list *tail;\n```\n\n我们使用两个指针 head 和\
    \ tail。head 用于从头开始遍历每个元素，tail 用于在末尾添加元素。\n\n### 1. add\n\n添加元素可以像在末尾添加元素一样简单。\n\
    \n如果列表中没有元素，则在头部添加该元素。如果列表中已有元素，则在 tail 之后添加该元素。每当添加元素时，tail 都会指向最后一个元素。\n\n```c\n\
    int add(void *data) {\n    struct linked_list *node = malloc(sizeof(struct linked_list));\n\
    \    node->elem = data;\n    node->next = NULL;\n    if (head == NULL) {\n   \
    \     head = tail = node;\n    } else {\n        tail->next = node;\n        tail\
    \ = node;\n    }\n    return 0;\n}\n```\n*(注：原文中 add 的实现是不完整的，我根据上下文进行了重构)*\n\n\
    ### 2. add_head\n\n在头部添加元素非常简单：\n\n```c\nvoid add_head(void *data) {\n    struct\
    \ linked_list *node = malloc(sizeof(struct linked_list));\n    node->elem = data;\n\
    \    node->next = NULL;\n    if (head == NULL) {\n        head = tail = node;\n\
    \    } else {\n        node->next = head;\n        head = node;\n    }\n}\n```\n\
    \n### 3. delete\n\n从列表中删除一个元素：\n\n```c\nvoid delete(void *data) {\n    struct\
    \ linked_list *curr = head;\n    struct linked_list *prev = NULL;\n    while (curr\
    \ != NULL) {\n        if (curr->elem == data) {\n            if (prev == NULL)\
    \ {\n                head = curr->next;\n            } else {\n              \
    \  prev->next = curr->next;\n            }\n            if (curr == tail) {\n\
    \                tail = prev;\n            }\n            free(curr);\n      \
    \      return;\n        }\n        prev = curr;\n        curr = curr->next;\n\
    \    }\n}\n```\n\n### 4. find\n\nfind 遍历每个元素并与给定的指针进行比较。\n\n```c\nbool find(void\
    \ *elem) {\n    struct linked_list *curr = head;\n    while (curr != NULL) {\n\
