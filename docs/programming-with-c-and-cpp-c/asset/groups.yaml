    \ of one type can be typecasted to other variables. Typecasting is sometimes unavoidable.\
    \ More about this is described in void pointer section.\n\nThe below program gives\
    \ an example of typecast from integer to double. Down-load it here\n\n```\n#include\
    \ <stdio.h>\n\nint main() {\n    int d;\n    double v = 10.1;\n\n    d = (int)v;\n\
    \n    printf(\"%d d %f\\n\", d, v);\n    return 0;\n}\n```\n\n### Example.3 Typecasting\n\
    \nTypecasting double to int loses the precision and the number loses the decimal\
    \ points. Note that the number will not get rounded off to the nearest integer.\n\
    \nFor example,\n\n```\nint r;\ndouble p = 10.99;\n```\n\n```\nr = (int)p; // rounds\
    \ off to 10.\n```\n\nwill round off the value 10.99 to 10 and assigns to r.\n\n\
    # operators\n\nC has below operators that can be used on the variables of given\
