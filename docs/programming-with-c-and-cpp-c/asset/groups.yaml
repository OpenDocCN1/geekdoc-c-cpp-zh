  - "[PAGE 261]\n\n# usecase.1: Logging utility\n\nSingleton can be used when writing\
    \ a logging utility that logs the message / debug message to something like console\
    \ or to a file, but does not require instantiation everytime when we want to use\
    \ the object.\n\nAn example of it looks as follows:\n\n```\nclass log {\n  public:\n\
    \    static log *instance() {\n      static log l1;\n      return &l1;\n    }\n\
    \    log(const log &l) = delete;\n    const log &operator=(const log &l) = delete;\n\
    \    log(const log &l) = delete;\n    const log &operator=(const log &l) = delete;\n\
    \n    int info(const char *msg, ...);\n    int verbose(const char *msg, ...);\n\
    \    int debug(const char *msg, ...);\n    int warn(const char *msg, ...);\n \
    \   int error(const char *msg, ...);\n    int fatal(const char *msg, ...);\n \
    \ private:\n    explicit log() {}\n};\n\n```\n\nThe above class is a singleton\
    \ that has many member functions for logging such as,\n\n+   1. info\n2. verbose\n\
    3. debug\n4. warning\n5. error\n6. fatal\n\nThe member functions of this singleton\
    \ can be accessed from anywhere as long as they include the header file that this\
    \ class belongs.\n\nThe call can be simply made as :\n\n```\nlog *l1 = log::instance();\n\
    ```\n\n```\n1->info(\"info message\\n\");\n```\n\nor"
