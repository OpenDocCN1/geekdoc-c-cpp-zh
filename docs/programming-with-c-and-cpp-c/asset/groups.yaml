    # Strings


    The below statement is a base char type.


    ```

    char d;

    ```


    String is an array of characters ending with \0. For example, the below statement
    declares a base string type.


    ```

    char d[20];

    ```


    declares a string of 19 elements with the last element allocated to the \0. Strings
    must end with \0 always. Without it, the string manipulation functions in the
    C library would not work or any other operations that depend on the use of \0.


    For an example "Hello", the character setting in the array would look as follows.


    ```

    ''H'', ''e'', ''l'', ''l'', ''o'', ''\0''

    ```


    The termination \0 is a must to identify a string literal by any string manipulation
    functions to find out how far the string is.'
- md: "\n## String manipulation operations\n\nThe header file `string.h` contains\
    \ the functions that help to manipulate the string data.\n\n**String manipulation\
    \ functions** The standard library provides below or more of the functions to\
    \ manipulate the strings.\n\n| S.No | Function Name | Description |\n|---|---|---|\n\
    | 1 | strlen | Calculate the length of string |\n| 2 | strcpy | Copy one string\
    \ to another |\n| 3 | strcat | Concatenate string to another |\n| 4 | strcmp |\
    \ Compare two strings |\n| 5 | strchr | Find character in the string |\n| 6 |\
    \ strstr | Find all matches in string (GLIBC, non-C standard) |\n| 7 | memcmp\
    \ | Compare two arrays / strings |\n| 8 | memcpy | Copy one array / string to\
    \ another |\n| 9 | strdup | Duplicate strings |\n| 10 | memset | Set memory to\
    \ a value |\n\n## 1. strlen\n\nThe library function **strlen** is used to get\
    \ the length of a string.\n\nThe **strlen** prototype is as follows:\n\n```\n\
    int strlen(const char *str);\n```\n\nBelow is an example,\n\n```\n#include <stdio.h>\n\
    \nint main() {\n    char str[] = \"hello world\";\n\n    printf(\"%s %d\\n\",\
    \ strlen(str));\n\n    return 0;\n}\n```\n\nThe **strlen** function counts all\
    \ the characters in the string excluding the \\0 marker. It can be implemented\
    \ as follows.\n\n```\nint string_length(const char *str) {\n    int i = 0;\n \
    \   for (i = 0; str[i] != '\\0'; i ++);\n\n    return i;\n}\n```\n\nThe above\
    \ program iterates over each character in the string **str** until the character\
    \ is \\0. The content of the for loop does nothing. Sometimes open and closed\
    \ braces { and } can be used as well.\n\nNote that the behavior is that the last\
    \ character should always be null terminated. If there are characters present\
    \ beyond the null terminating character they will be ignored.\n\nIf there is no\
    \ null character in the string, the **strlen** function will keep on reading and\
    \ may even read the allocated buffer in some cases. This sometimes causes crashes\
    \ if lucky and sometimes executes code if not lucky leading to exploits.\n\nSo\
    \ caution must be taken when creating and using the strings. Always null terminate\
    \ the strings.\n\nNote that the strlen and string_length functions never check\
    \ if the input is a NULL. The callers must take care of the pointer validity before\
    \ calling strlen.\n\n## 2. strcpy\n\nThe strcpy function is used to copy the source\
    \ string into the destination.\n\nIts prototype is as follows.\n\n```\nchar *strcpy(char\
    \ *dst, const char *str);\n```\n\nThe example of strcpy is as follows.\n\n```\n\
    #include <stdio.h>\n#include <string.h>\n\nint main() {\n    char *str1 = \"Witcher\"\
    ;\n    char *str2[20];\n\n    strcpy(str2, str1);\n\n    printf(\"str1 [%s] str2\
    \ [%s]\\n\", str1, str2);\n\n    return 0;\n}\n```\n\nstrcpy can be implemented\
    \ as follows.\n\n```\nint string_copy(char *dst, unsigned int dst_len, const char\
    \ *src) {\n    uint32_t i = 0;\n    uint32_t len = 0;\n\n    for (i = 0; src[i]\
    \ != '\\0'; i++ ) {\n        if (i < dst_len) {\n            dst[i] = src[i];\n\
    \        } else {\n            break;\n        }\n    }\n\n    dst[i - 1] = '\\\
    0';\n\n    return 0;\n}\n```\n\n## 3. strcat\n\nString concatenation concatenates\
    \ two strings together.\n\nThe prototype is as follows.\n\n```\nchar *strcat(char\
    \ *dst, const char *src);\n```\n\nBelow is an example:\n\n```\n#include <stdio.h>\n\
    #include <string.h>\n\nint main() {\n    char *str = \"hello\";\n    char *ptr\
    \ = \"mangoes\";\n    char dst[20];\n\n    strcpy(dst, str);\n    strcat(dst,\
    \ \" \");\n    strcat(dst, ptr);\n\n    printf(\"%s\\n\", dst);\n\n    return\
    \ 0;\n}\n```\n\nBelow is an example of strcat. Since strcat appends the string\
    \ with a new string, one need to iterate to the end of the previous string.\n\n\
    ```\n#include <stdio.h>\nint string_cat(char *dst, const char *src) {\n    int\
    \ i = 0;\n    int j = 0;\n    while (dst[i] != '\\0') {\n        i++;\n    }\n\
    \    while (src[j] != '\\0') {\n        dst[i] = src[j];\n        i++;\n     \
    \   j++;\n    }\n    dst[i] = '\\0';\n    return j;\n}\n\nint main() {\n    char\
    \ *src = \"test\";\n    char dst[30] = \"dest\";\n\n    string_cat(dst, src);\n\
    \n    printf(\"%s\\n\", dst);\n\n    return 0;\n}\n```\n\n## 4. strcmp\n\nCompare\
    \ a string with another string.\n\n```\nint strcmp(const char *src, const char\
    \ *dst);\n```\n\nReturns 0 if both strings are equal. Returns non-zero difference\
    \ between the characters at the fixed index when strings are not equal.\n\nBelow\
    \ is an example of strcmp.\n\n```\n#include <stdio.h>\n#include <string.h>\n\n\
    int main() {\n    char *str = \"hello\";\n    char *str_1 = \"hello\";\n    char\
    \ *str_2 = \"Hello\";\n    int res_1 = strcmp(str, str_1);\n    int res_2 = strcmp(str,\
    \ str_2);\n\n    printf(\"res_1 %d res_2 %d\\n\", res_1, res_2);\n\n    return\
    \ 0;\n}\n```\n\nBelow is the full implementation of strcmp.\n\n```\nint string_len(const\
    \ char *str) {\n    int i = 0;\n    while (str[i] != '\\0') {\n        i++;\n\
    \    }\n    return i;\n}\n\nint string_cmp(const char *str1, const char *str2)\
    \ {\n    int i = 0;\n\n    if (string_len(str1) != string_len(str2)) {\n     \
    \   return -1;\n    }\n\n    while (str1[i] != '\\0') {\n        if (str1[i] !=\
    \ str2[i]) {\n            return str1[i] - str2[i];\n        }\n    }\n\n    return\
    \ 0;\n}\n```\n\n## 5. strchr\n\n```\n#include <stdio.h>\n#include <string.h>\n\
