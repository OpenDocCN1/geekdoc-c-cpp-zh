- md: "\nBelow is another example of accessing array elements with a pointer. The\
    \ elements of array are updated with the pointer.\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int a[10];\n    int i;\n    int *p;\n\n    for (i = 0; i\
    \ < sizeof(a) / sizeof(a[0]); i++) {\n        p = &a[i];\n        *p = i;\n  \
    \  }\n\n    for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"\
    %d\\n\", a[i]);\n    }\n\n    return 0;\n}\n```\n\nWhen passing an array to a\
    \ function, the caller takes it as a pointer input. This is called as array decaying\
    \ into a pointer. When such thing happens, sizeof on the pointer gives you 4 or\
    \ 8 bytes that is the size of the pointer on the architecture. In general it is\
    \ wise to pass the number of elements of the array as argument to the function\
    \ call.\n\nFor example:\n\n```c\nint f(*a, int a_len)\n{\n    int main()\n   \
    \ {\n        int a[10];\n        f(a, 10);\n    }\n}\n```\n\n# Dynamic Memory\
    \ Allocation\n\nDynamic memory is the runtime memory required by the program.\
    \ Some programs require dynamic memory and some do not. It depends on the usecase\
    \ as to why few programs require the dynamic memory to be allocated.\n\nDynamic\
    \ memory is always allocated in the heap section of the program.\n\nThe Operating\
    \ System provides a system call layer that allows the C library to make a call\
    \ to the operating system to get the memory allocated for the program. Generally\
    \ the memory returned is not contiguous but is sparse. This behavior will be different\
    \ for different operating systems.\n\nThough the memory specific system calls\
    \ return the memory, the C library functions keeps a note of memory asked for\
    \ book keeping or for efficiency.\n\n# malloc\n\nThe malloc function is a C function\
    \ that is used to allocate memory dynamically. It is declared in stdlib.h. The\
    \ memory allocated by malloc may contain the old data that is used by other programs.\n\
    \nThe prototype is as follows:\n\n```c\nvoid *malloc(int size);\n\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n    int *a;\n    a = malloc(sizeof(int));\n\
    \    *a = 4;\n    printf(\"%p %p %d\\n\", a, *a);\n\n    return 0;\n}\n```\n\n\
    The example code is as follows.\n\nmalloc makes a call to the underlying operating\
    \ system call to allocate the heap memory.\nOnce the memory is allocated, it can\
    \ only be freed with the **free**.\nThe call to the function **malloc** can fail\
    \ and it results in a NULL pointer. In the example above, we are directly dereferencing\
    \ a without checking if it can be a NULL pointer.\nDereferencing a NULL pointer\
    \ results in faults and the program will be aborted.\nThe reason of returning\
    \ NULL is that the operating system is under high memory pressure (that is most\
    \ of the memory is being used), in such cases the operating system cannot allocate\
    \ anymore memory available. This results in returning a NULL pointer.\nThe best\
    \ practices of using allocated pointers is to always check for NULL. Below is\
    \ another example of malloc:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main()\n{\n    int *a;\n    int i;\n\n    a = malloc(sizeof(int) * 10);\
    \ // allocate space for 10 integers\n    if (!a) {\n        return -1;\n    }\n\
    \n    for (i = 0; i < 10; i++) {\n        a[i] = i;\n    }\n\n    for (i = 0;\
    \ i < 10; i++) {\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n    }\n\n    return\
    \ 0;\n}\n```\n\nIn the above example, the pointer a is allocated with 10 elements\
    \ and is being accessed just like an array.\n\n## 2. calloc\n\nThe calloc function\
    \ is a C function that is used to allocate memory dynamically. It is declared\
    \ in stdlib.h. Once the memory is allocated, it is cleared and returned to the\
    \ caller.\n\nThe prototype is as follows:\n\n```c\nvoid *calloc(int n_elements,\
    \ int size);\n```\n\nThe example code is as follows:\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n    int *a;\n\n    a = calloc(1, sizeof(int));\n\
    \    *a = 4;\n\n    printf(\"a %p a %d\\n\", a, *a);\n\n    return 0;\n}\n```\n\
    \n## 3. realloc\n\nThe function realloc re-allocates memory on an already allocated\
    \ memory basically expanding it.\n\nIf the given memory is NULL, it works similar\
    \ to malloc.\n\n```c\nvoid *p;\np = realloc(p, sizeof(int) * 10); // might crash\
    \ -> address of p points to garbage\np = NULL;\np = realloc(p, sizeof(int) * 10);\
    \ // malloc\np = realloc(p, sizeof(int) * 20); // now memory is expanded to 20\
    \ elements\n```\n\nThe returned pointer address after realloc may not be same\
    \ but if there were old contents, they are preserved and so they are in the newly\
    \ returned address.\n\nThe call to free can be used only once if realloc is called\
    \ many times on the same memory. This is because an implementation of libc tracks\
    \ allocated memory for a given pointer. Below is an implementation of C code with\
    \ use of realloc.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main()\n\
    {\n    int *a;\n    int i;\n\n    a = calloc(4, sizeof(int));\n    if (!a) {\n\
    \        return -1;\n    }\n\n    for (i = 0; i < 4; i++) {\n        a[i] = i;\n\
    \    }\n\n    printf(\"calloced a %p\\n\", a);\n    a = realloc(a, sizeof(int)\
    \ * 10);\n    if (!a) {\n        return -1;\n    }\n\n    printf(\"reallocated\
    \ a %p\\n\", a);\n    for (i = 4; i < 10; i++) {\n        a[i] = i;\n    }\n\n\
    \    for (i = 0; i < 10; i++) {\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n\
    \    }\n\n    free(a);\n    return 0;\n}\n```\n\nThe usecases of realloc are generally\
    \ when allocated memory is not enough and more is required. In general linked\
    \ lists solve this problem by adding more elements. But could be some cases where\
    \ the array of pointers are used and the memory needs to expanded.\n\n## 4. free\n\
    \nEvery memory allocation must be freed, otherwise the system will run out of\
    \ memory. Below is one example of the free.\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main()\n{\n    int *a;\n\n    a = malloc(sizeof(int));\n \
    \   if (a) {\n        *a = 4;\n        printf(\"%p %d\\n\", a, *a);\n        free(a);\n\
    \    }\n\n    return 0;\n}\n```\n\n## 2. Allocating and freeing array\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int *a;\n    int\
    \ i;\n\n    a = malloc(10 * sizeof(int));\n    for (i = 0; i < 10; i++) {\n  \
    \      a[i] = i;\n    }\n\n    for (i = 0; i < 10; i++) {\n        printf(\"a[%d]\
    \ = %d\\n\", i, a[i]);\n    }\n\n    free(a);\n    return 0;\n}\n```\n\n## Double\
    \ pointers\n\nPointers can have pointers pointing to them. It can be as many pointers\
    \ as possible. But the double and triple pointers may rarely used.\n\n```c\nint\
    \ **p;\nint *r;\nint v;\n\nr = &v; // assign address of v to r\np = &r; // assign\
    \ address of r to p\n```\n\nBelow is an example:\n\n```c\n#include <stdio.h>\n\
    \nint main() {\n    int r;\n    int *p = &r;\n    int **s = &p;\n\n    *p = 3;\n\
    \    printf(\"r: %d *p: %d **s: %d\\n\", r, *p, **s);\n\n    return 0;\n}\n```\n\
    \nThe general usecase of the double pointers is return an allocated address and\
    \ pass it as return value in the function arguments.\n\nBelow is an example:\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint alloc(int **p) {\n    *p\
    \ = calloc(1, sizeof(int));\n    if (!*p) {\n        return -1;\n    }\n    **p\
    \ = 3;\n    return 0;\n}\n\nint main()\n{\n    int *p = NULL;\n    alloc(&p);\n\
    \    printf(\"%p\\n\", p);\n}\n```\n\nIn the Pass by Reference address of p is\
    \ passed and the double pointer captures it with the Pass by Reference. Once captured,\
    \ the pointer p is allocated in the function and assigned a value.\n\nTo test\
    \ the functionality we print the p value and since it is allocated, we free it.\n\
    \n# Allocating and freeing double pointers\n\nDouble pointers of type **ptr are\
    \ allocated in the following way:\n\n1. Allocate memory for the number of pointers\
    \ of type *ptr would need to be held.\n2. Allocate memory for each type **ptr.\n\
    \nFor example, we allocate memory for 4 integers each want to further hold 3 integers,\
    \ we need to do the following.\n\n```c\nint **p; // 4 rows x 3 elements in each\
    \ row\nint i;\n\np = calloc(1, sizeof(int *) * 4 * 3; // 12 pointers in total\n\
    for (i = 0; i < 4; i++) // for every pointer\np[i] = calloc(1, sizeof(int) * 3);\
    \ // allocate size for 3 elements\n```\n\nBelow is one example, Download it here.\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\nint main()\n{\n    int **p;\n\
    \    int i;\n    int j;\n\n    p = calloc(1, sizeof(int *) * 4 * 4);\n    for\
    \ (i = 0; i < 4; i++) {\n        for (j = 0; j < 4; j++) {\n            p[i][j]\
    \ = i + j;\n        }\n    }\n    for (i = 0; i < 4; i++) {\n        for (j =\
    \ 0; j < 4; j++) {\n            printf(\"p[%d][%d] = %d\\n\", i, j, p[i][j]);\n\
    \        }\n    }\n    for (i = 0; i < 4; i++) {\n        free(p[i]);\n    }\n\
    \    free(p);\n    return 0;\n}\n```\n"
  mdcn: "\n\n以下是使用指针访问数组元素的另一个示例。数组的元素通过指针进行更新。\n\n```c\n#include <stdio.h>\n\nint\
    \ main()\n{\n    int a[10];\n    int i;\n    int *p;\n\n    for (i = 0; i < sizeof(a)\
    \ / sizeof(a[0]); i++) {\n        p = &a[i];\n        *p = i;\n    }\n\n    for\
    \ (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"%d\\n\", a[i]);\n\
    \    }\n\n    return 0;\n}\n```\n\n将数组传递给函数时，调用者将其视为指针输入。这被称为数组退化为指针。当这种情况发生时，指针上的\
    \ `sizeof` 得到的是 4 或 8 字节，即该体系架构下指针的大小。通常，将数组的元素个数作为参数传递给函数调用是明智的。\n\n例如：\n\n```c\n\
    int f(*a, int a_len)\n{\n    int main()\n    {\n        int a[10];\n        f(a,\
    \ 10);\n    }\n}\n```\n\n# 动态内存分配\n\n动态内存是程序在运行时所需的内存。某些程序需要动态内存，而某些则不需要。这取决于用例，即为什么程序需要分配动态内存。\n\
    \n动态内存始终在程序的堆（heap）区域中分配。\n\n操作系统提供了一个系统调用层，允许 C 库调用操作系统来为程序分配内存。通常，返回的内存不是连续的，而是稀疏的。这种行为在不同的操作系统上会有不同。\n\
    \n尽管特定的内存系统调用返回了内存，但 C 库函数会记录请求的内存以便进行记账或提高效率。\n\n# malloc\n\n`malloc` 函数是一个用于动态分配内存的\
    \ C 函数。它在 `stdlib.h` 中声明。`malloc` 分配的内存可能包含其他程序使用的旧数据。\n\n其原型如下：\n\n```c\nvoid\
    \ *malloc(int size);\n\n#include <stdio.h>\n#include <stdlib.h>\n\nint main()\n\
    {\n    int *a;\n    a = malloc(sizeof(int));\n    *a = 4;\n    printf(\"%p %p\
    \ %d\\n\", a, *a);\n\n    return 0;\n}\n```\n\n示例代码如下。\n\n`malloc` 会调用底层的系统调用来分配堆内存。\n\
    一旦分配了内存，只能通过 **free** 释放。\n对函数 **malloc** 的调用可能会失败并导致返回 NULL 指针。在上面的示例中，我们在没有检查\
    \ `a` 是否可能为 NULL 指针的情况下直接对其进行了解引用。\n解引用 NULL 指针会导致故障，程序将终止。\n返回 NULL 的原因是操作系统正处于高内存压力下（即大部分内存已被占用），在这种情况下，操作系统无法分配更多可用内存。这导致了返回\
    \ NULL 指针。\n使用已分配指针的最佳实践是始终检查是否为 NULL。以下是 `malloc` 的另一个示例：\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n    int *a;\n    int i;\n\n    a = malloc(sizeof(int)\
    \ * 10); // 为 10 个整数分配空间\n    if (!a) {\n        return -1;\n    }\n\n    for\
    \ (i = 0; i < 10; i++) {\n        a[i] = i;\n    }\n\n    for (i = 0; i < 10;\
    \ i++) {\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n    }\n\n    return 0;\n\
    }\n```\n\n在上面的示例中，指针 `a` 被分配了 10 个元素，并像数组一样被访问。\n\n## 2. calloc\n\n`calloc` 函数是一个用于动态分配内存的\
    \ C 函数。它在 `stdlib.h` 中声明。一旦分配了内存，它会被清空并返回给调用者。\n\n其原型如下：\n\n```c\nvoid *calloc(int\
    \ n_elements, int size);\n```\n\n示例代码如下：\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main()\n{\n    int *a;\n\n    a = calloc(1, sizeof(int));\n\
    \    *a = 4;\n\n    printf(\"a %p a %d\\n\", a, *a);\n\n    return 0;\n}\n```\n\
    \n## 3. realloc\n\n`realloc` 函数在已分配的内存上重新分配内存，基本上是扩展它。\n\n如果给定的内存为 NULL，它的工作类似于\
    \ `malloc`。\n\n```c\nvoid *p;\np = realloc(p, sizeof(int) * 10); // 可能会崩溃 -> p\
    \ 的地址指向垃圾数据\np = NULL;\np = realloc(p, sizeof(int) * 10); // malloc\np = realloc(p,\
    \ sizeof(int) * 20); // 现在内存扩展到 20 个元素\n```\n\n`realloc` 返回的指针地址可能不相同，但如果原来有旧内容，它们会被保留并因此存在于新返回的地址中。\n\
    \n如果在同一块内存上多次调用 `realloc`，则 `free` 只能使用一次。这是因为 `libc` 的实现会跟踪已分配的内存。\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int *a;\n    int\
    \ i;\n\n    a = calloc(4, sizeof(int));\n    if (!a) {\n        return -1;\n \
    \   }\n\n    for (i = 0; i < 4; i++) {\n        a[i] = i;\n    }\n\n    for (i\
    \ = 0; i < 4; i++) {\n        printf(\"a[%d] = %d\\n\", i, a[i]);\n    }\n\n \
    \   return 0;\n}\n```\n\n`realloc` 的用例通常当分配的内存不足且需要更多时。链表通过增加元素来解决这个问题。但在某些情况下，使用的指针数组需要扩展。\n\
    \n## 4. free\n\n每个内存分配必须被释放，否则系统将耗尽内存。以下是 `free` 的示例。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n    int *a;\n\n    a = malloc(sizeof(int));\n\
    \    if (a) {\n        *a = 4;\n        printf(\"%p %d\\n\", a, *a);\n       \
    \ free(a);\n    }\n\n    return 0;\n}\n```\n\n## 2. 分配并释放数组\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint main()\n{\n    int *a;\n    int i;\n\n\
    \    a = malloc(10 * sizeof(int));\n    for (i = 0; i < 10; i++) {\n        a[i]\
    \ = i;\n    }\n\n    for (i = 0; i < 10; i++) {\n        printf(\"a[%d] = %d\\\
    n\", i, a[i]);\n    }\n\n    free(a);\n    return 0;\n}\n```\n\n## 双级指针\n\n指针可以指向指针。可以尽可能多。但双级和三级指针很少使用。\n\
    \n```c\nint **p;\nint *r;\nint v;\n\nr = &v; // 将 v 的地址赋值给 r\np = &r; // 将 r 的地址赋值给\
    \ p\n```\n\n以下是一个示例：\n\n```c\n#include <stdio.h>\n\nint main() {\n    int r;\n\
    \    int *p = &r;\n    int **s = &p;\n\n    *p = 3;\n    printf(\"r: %d *p: %d\
    \ **s: %d\\n\", r, *p, **s);\n\n    return 0;\n}\n```\n\n双级指针的通用用例是返回一个分配的地址并将其作为函数参数。\n\
    \n以下是一个示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint alloc(int **p)\
    \ {\n    *p = calloc(1, sizeof(int));\n    if (!*p) {\n        return -1;\n  \
    \  }\n    **p = 3;\n    return 0;\n}\n\nint main()\n{\n    int *p = NULL;\n  \
    \  alloc(&p);\n    printf(\"%p\\n\", p);\n}\n```\n\n在引用传递中，`p` 的地址被传递，双级指针通过引用传递捕获它。一旦捕获，指针\
    \ `p` 在函数内部被分配并赋值。\n为了测试功能，我们打印 `p` 的值，由于它是被分配的，我们释放它。\n\n# 分配和释放双级指针\n\n类型为 `**ptr`\
    \ 的双级指针按以下方式分配：\n\n1. 为需要持有的 `*ptr` 类型指针分配内存。\n2. 为每个 `**ptr` 类型分配内存。\n\n例如，为\
