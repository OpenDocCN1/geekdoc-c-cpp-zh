    \ *a = new int;\n    *a = 3;\n    printf(\"%d\\n\", *a);\n    delete a;\n    return\
    \ 0;\n}\n```\n\n分配和释放数组：`new[]` 和 `delete[]` 运算符用于分配和释放数组。\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int *a;\n    int i;\n    a = new int[10];\n\
    \    for (i = 0; i < 10; i++) {\n        a[i] = i;\n        std::cout << \"a[\"\
    \ << i << \"] = \" << a[i] << std::endl;\n    }\n    delete[] a;\n    return 0;\n\
    }\n```\n\n分配和释放结构体：\n\n```cpp\n#include <iostream>\n\nstruct S {\n  int a;\n};\n\
    \nint main() {\n  S *r = new S;\n  r->a = 3;\n  delete r;\n  return 0;\n}\n```\n\
    \n在使用 C 函数 `malloc`、`calloc` 和 `realloc` 时，返回类型必须转换为目标类型。查看下面类型转换的示例：\n\n```cpp\n\
    #include <iostream>\n\nstruct S {\n  int a;\n};\n\nint main() {\n  int *r1;\n\
    \  S *r2;\n  int *r3;\n\n  r1 = (int*)malloc(sizeof(int));\n  if (!r1) {\n   \
    \ return -1;\n  }\n  *r1 = 3;\n\n  r2 = (S*)calloc(1, sizeof(S));\n  if (!r2)\
    \ {\n    return -1;\n  }\n  r2->a = 9;\n\n  r3 = (int*)realloc(r3, sizeof(int));\n\
    \  if (!r3) {\n    return -1;\n  }\n  *r3 = 6;\n  std::cout << \"r1: \" << *r1\
    \ << \" r2: \" << r2->a << \" r3: \" << *r3 << std::endl;\n\n  free(r1);\n  free(r2);\n\
    \  free(r3);\n\n  return 0;\n}\n```\n\n# 4. Range based for\n\nRange based for\
    \ 循环是 C++11 引入的一个新特性。下面是 range based for 的使用：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    for (int a: {1, 2, 3, 4}) {\n        std::cout << \"a: \"\
