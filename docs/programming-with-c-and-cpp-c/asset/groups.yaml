    \ above array are 10 but the last index of the 10th element is 9, not. Accessing\
    \ the array beyond its maximum range is also called out of bounds. Out of bounds\
    \ accesses are major security problem as the element is assigning an address beyond\
    \ the allocated range.\n\nBelow program assigns the elements in the array.\n\n\
    ```\n#include <stdio.h>\n\nint main() {\n    int a[10];\n    int i = 0;\n\n  \
