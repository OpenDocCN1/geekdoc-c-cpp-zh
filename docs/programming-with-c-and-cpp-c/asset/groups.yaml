    \ 0;\n}\n```\n\n### Example.4 Operators example\n\nThe ++ and -- are increment\
    \ and decrement operators. Below example how to use them.\n\nThe boolean operations\
    \ such as |, &, ||, &&, ^ and ! never apply to the double float variables.\n\n\
    ```\n#include <stdio.h>\n\nint main()\n{\n    int i = 0;\n    printf(\"%i %d\\\
    n\", ++ i);\n    return 0;\n}\n```\n\n### Example.5 Pre increment operator\n\n\
    The above program prints the value 1.\n\nConsider another program.\n\n```\n#include\
    \ <stdio.h>\n\nint main()\n{\n    int i = 0;\n    printf(\"%i %d\\n\", ++ i);\n\
    \    return 0;\n}\n```\n\n### Example.6 Post increment operator\n\nThe above program\
    \ prints the value 0.\n\nThis is generally called the undefined behavior. The\
