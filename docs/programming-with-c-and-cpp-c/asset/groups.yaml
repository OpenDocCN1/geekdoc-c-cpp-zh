  - "[PAGE 34]\n\n# # Loops\n\n# 1. While loop\n\nThe while loop allows to loop over\
    \ a certain condition until it fails. An example of the while is as follows.\n\
    \n```\nwhile (condition) {\n    // statements\n}\n```\n\nExample.22 While condition\n\
    \nAn use of #include <stdio.h> is as follows.\n\n```\nint main() {\n    int i\
    \ = 0;\n    while (i < 10) {\n        printf(\"%d\\n\", i);\n        i++;\n  \
    \  }\n    return 0;\n}\n```\n\nExample.23 While loop example\n\nIn the above program\
    \ the loop repeats until i reaches 10. Upon reaching 10, the while condition fails\
    \ breaking the loop.\n\nThe break statement can be used in the while loop as well.\n\
    \n```\nint main() {\n    int i = 0;\n    while (i) {\n        if (i >= 10) {\n\
    \            break;\n            printf(\"%d\\n\", i);\n            i++;\n   \
    \     }\n    }\n    return 0;\n}\n```"
- md: "\nExample.24 while loop and break statement\n\nAbove program shows the use\
    \ of while (1). Generally this means that the condition in the while loop is never\
    \ false. It is an infinite loop.\n\nGenerally infinite loops are not preferable\
    \ in programming without any conditional checks in the while statement.\n\nThe\
    \ infinite loops generally do nothing but increase in CPU load on the process\
    \ the program runs and consumes the CPU cycles unnecessarily. However, some programs\
    \ written for the operating systems need to run infinitely (such as graphics,\
    \ display, editors etc). To do this, operating systems employ certain event-based\
    \ mechanisms supported by the hardware. This ensures that the program executes\
    \ only based on certain events.\n\n## 2. For loop\n\nThe for loop is similar to\
    \ the while loop. the syntax is as follows,\nfor (initialization; condition; increment\
    \ / decrement operation)\nBelow is an example of the use of for loop.\n\n#include\
    \ <stdio.h>\n\n```c\nint main()\n{\n    int i;\n    for (i = 0; i < 10; i++) {\n\
    \        printf(\"%i %d\\n\", i);\n    }\n    return 0;\n}\n```\n\nExample.25\
    \ For loop\nthe i = 0 statement in for executes only once. the i < 10 statement\
    \ executes everytime the loop repeats. the i ++ statement executes everytime the\
    \ statements in the for executes.\n\nAnother way to do is is is the following:\n\
    #include <stdio.h>\n\n```c\nint main()\n{\n    int i = 0;\n    for (; i < 10;\
    \ i++) {\n        printf(\"%i %d\\n\", i);\n    }\n    return 0;\n}\n```\n\nExample.26\
    \ For iteration\nThe initializer statement can be left aside.\nThe above while\
    \ (1) can be re-written with for as follows.\n\n#include <stdio.h>\n\n```c\nint\
    \ main()\n{\n    int i = 0;\n\n    for (;;) {\n        if (i >= 10) {\n      \
    \      break;\n        }\n        printf(\"i %d\\n\", i);\n        i++;\n    }\n\
    \n    return 0;\n}\n```\n\nExample.27 Infinite for loop\n\nThe for(;;) is also\
    \ an infinite for loop. As mentioned, the infinite loops must be used with caution.\n\
    \n## 3. do while loop\n\nThe do..while loop is similar to the while. Below is\
    \ an example.\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    int i = 0;\n \
    \   do {\n        printf(\"Hello World\\n\");\n    } while (i != 0);\n    return\
    \ 0;\n}\n```\n\nExample.28 do..while loop\n\nOnce run, it prints Hello World.\
    \ This means that the statements execute and the checks happen later.\n\n## Goto\
    \ statement\n\nThe statement goto is similar to a jump instruction in assembly.\
    \ The above loop can be rewritten with goto as follows.\n\n```c\n#include <stdio.h>\n\
    \nint main() {\n    int i = 0;\n\nbegin:\n    if (i < 10) {\n        printf(\"\
    %i %d\\n\", i);\n        i++;\n        goto begin;\n    }\n    return 0;\n}\n\
    ```\n\nExample.29 goto loop\n\nWe do not use goto in the programs for the following\
    \ reasons:\n\n- Readability reduces with many gotos in a function or within a\
    \ C file.\n- Incorrectly written gotos can cause loops in program.\n\nGotos are\
    \ not bad when used correctly in a program. For example in usecases when certain\
    \ conditions fail during a program initialization, the deinitialization sequence\
    \ must do the opposite. In such cases a jump required on the failure case.\n\n\
    Here's a pseudo code example,\n\n```c\nint init_1() {\n    return 0;\n}\n```\n\
    \n```c\nint init_2() {\n    ...\n    return 0;\n}\n```\n\n```c\nvoid deinit_1()\
    \ {\n}\n```\n\n```c\n...\n}\nint init_main()\n{\n    int ret;\n    ret = init_1();\n\
    \    if (ret != 0) {\n        return -1;\n    }\n    ret = init_2();\n    if (ret\
    \ != 0) {\n        goto deinit;\n    }\n}\n\ndeinit:\ndeinit_1();\nreturn -1;\n\
    ```\n\nExample.30 goto usecase\n\nMore about functions in the functions section.\n\
    \nIn areas such as Automotive and Aerospace software application, goto statement\
    \ is seldom used. It is treated as a bad practise. So avoiding this is a good\
    \ step when writing software for such applications.\n\n## Arrays\n\n## One Dimensional\
    \ Arrays\n\nOne dimensional array is the base type in arrays.\n\nAn array of integers\
    \ is defined as,\n\n```c\nint a[10];\n```\n\nAbove statement defines an array\
    \ a 10 integers. Each element in the array is an element of type integer.\n\n\
    Array index starts from 0. Each item in the array is indexed with regular numbers\
    \ from 0 to 9.\n\nMaximum elements in the above array are 10 but the last index\
    \ of the 10th element is 9, not. Accessing the array beyond its maximum range\
    \ is also called out of bounds. Out of bounds accesses are major security problem\
    \ as the element is assigning an address beyond the allocated range.\n\nBelow\
    \ program assigns the elements in the array.\n\n```c\n#include <stdio.h>\n\nint\
    \ main() {\n    int a[10];\n    int i = 0;\n\n    for (i = 0; i < sizeof(a) /\
    \ sizeof(a[0]); i++) {\n        a[i] = i;\n    }\n\n    printf(\"array elements:\\\
    n\");\n    for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"\
    [%d] = %d\\n\", i, a[i]);\n    }\n    printf(\"\\n\");\n}\n```\n\nExample.31 array\
    \ iteration\n\nThe size of an array is calculated the same way.\n\n```c\n#include\
    \ <stdio.h>\n\nint main() {\n    int a[10];\n    printf(\"size of array %lu\\\
    n\", sizeof(a));\n    return 0;\n}\n```\n\nExample.32 sizeof array\n\nWith the\
    \ sizeof, one can also find out the number of elements in the array as follows.\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    int a[10];\n    printf(\"number\
    \ of elements: %lu\\n\", sizeof(a) / sizeof(a[0]));\n    return 0;\n}\n```\n\n\
    Example.33 number of elements\n\n## Initializing array\n\nThe below statement\
    \ initializes the array. So if we have it, the first element is initialized to\
    \ 0 by default. This is shown in example:\n\n```c\n#include <stdio.h>\n\nint main()\
    \ {\n    int a[10] = {0};\n    int i;\n\n    for (i = 0; i < 10; i++) {\n    \
    \    printf(\"[%d] = %d\\n\", i, a[i]);\n    }\n    return 0;\n}\n```\n\nExample.34\
    \ Initializing array\n\nThe below statement initializes the array. But this means\
    \ that the first element is initialized to 0.\n\n```c\n#include <stdio.h>\n\n\
    int main() {\n    int a[10] = {0};\n    int i;\n\n    for (i = 0; i < 10; i++)\
    \ {\n        printf(\"[%d] = %d\\n\", i, a[i]);\n    }\n    return 0;\n}\n```\n\
    \nExample.35 iterating array\n\nCopying one to another is simple as follows. Another\
    \ way is `memcpy`.\n\n```c\n#include <stdio.h>\n\nint main() {\n    int a[10];\n\
    \    int a2[10];\n    int i;\n\n    for (i = 0; i < 10; i++) {\n        a2[i]\
    \ = a[i];\n    }\n\n    for (i = 0; i < 10; i++) {\n        printf(\"[%d] = %d\\\
    n\", i, a2[i]);\n    }\n    return 0;\n}\n```\n\nExample.36 copying array\n\n\
    ## 2. Two Dimensional Arrays\n\nTwo dimensional arrays are represented as follows.\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a[10][10];\n    int i;\n\
    \    int j;\n\n    for (i = 0; i < 10; i++) {\n        for (j = 0; j < 10; j++)\
    \ {\n            a[i][j] = j + i;\n        }\n    }\n\n    for (i = 0; i < 10;\
    \ i++) {\n        for (j = 0; j < 10; j++) {\n            printf(\"a[%d][%d] =\
    \ %d\\n\", i, j, a[i][j]);\n        }\n    }\n\n    return 0;\n}\n```\n\nExample.37\
    \ Setting two dimensional array\n\n## 3. Three Dimensional Arrays\n\nA 3 dimensional\
    \ array is a group of 2-D arrays. The are denoted as follows,\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    int array[10] [20] [40];\n    int i;\n    int\
    \ j;\n    int k;\n    for (i = 0; i < 10; i++) {\n        for (j = 0; j < 20;\
    \ j++) {\n            for (k = 0; k < 40; k++) {\n                array[i][j][k]\
    \ = 10 + i;\n            }\n        }\n    }\n    for (i = 0; i < 10; i++) {\n\
    \        for (j = 0; j < 20; j++) {\n            for (k = 0; k < 40; k++) {\n\
    \                printf(\"[%d][%d][%d] = %d\\n\", i, j, k, array[i][j][k]);\n\
    \            }\n        }\n    }\n    return 0;\n}\n```\n\nExample.38 Setting\
    \ Three Dimensional Array\n\nThe usecases of arrays range in many places, such\
    \ as grouping a set of characters together, or grouping of similar types to represent\
    \ a hardware device or group of similar hardware devices and so on. Also arrays\
    \ play a big role in search and sort techniques.\n"
  mdcn: "\n示例.24 while 循环和 break 语句\n\n上述程序展示了 `while (1)` 的用法。这通常意味着 `while` 循环中的条件永远为假。它是一个无限循环。\n\
    \n在编程中，如果没有在 `while` 语句中进行任何条件检查，无限循环通常不是首选。\n\n无限循环通常无所事，只会增加程序运行进程的 CPU 负载，并浪费\
    \ CPU 周期。然而，某些为操作系统编写的程序需要无限运行（例如图形、显示、编辑器等）。为了实现这一点，操作系统采用了硬件支持的某些事件驱动机制。这确保了程序仅根据特定事件执行。\n\
    \n## 2. for 循环\n\n`for` 循环类似于 `while` 循环。其语法如下：\nfor (初始化; 条件; 递增/递减操作)\n下面是 `for`\
    \ 循环使用的示例。\n\n#include <stdio.h>\n\n```c\nint main()\n{\n    int i;\n    for (i\
    \ = 0; i < 10; i++) {\n        printf(\"%i %d\\n\", i);\n    }\n    return 0;\n\
    }\n```\n\n示例.25 for 循环\n`for` 中的 `i = 0` 语句只执行一次。`i < 10` 语句在每次循环重复时执行。`i ++`\
    \ 语句在 `for` 中的语句每次执行后都会执行。\n\n另一种实现方法如下所示：\n#include <stdio.h>\n\n```c\nint main()\n\
    {\n    int i = 0;\n    for (; i < 10; i++) {\n        printf(\"%i %d\\n\", i);\n\
    \    }\n    return 0;\n}\n```\n\n示例.26 for 迭代\n初始化语句可以省略。\n上述的 `while (1)` 可以重写为\
    \ `for` 如下：\n\n#include <stdio.h>\n\n```c\nint main()\n{\n    int i = 0;\n\n \
    \   for (;;) {\n        if (i >= 10) {\n            break;\n        }\n      \
    \  printf(\"i %d\\n\", i);\n        i++;\n    }\n\n    return 0;\n}\n```\n\n示例.27\
    \ 无限 for 循环\n\n`for(;;)` 也是一个无限 for 循环。如所述，使用无限循环必须谨慎。\n\n## 3. do while 循环\n\n\
    `do..while` 循环与 `while` 相似。下面是一个示例。\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    int i = 0;\n    do {\n        printf(\"Hello World\\n\");\n    } while\
    \ (i != 0);\n    return 0;\n}\n```\n\n示例.28 do..while 循环\n\n一旦运行，它会打印 Hello World。这意味着语句先执行，稍后进行检查。\n\
    \n## Goto 语句\n\n`goto` 语句类似于汇编中的跳转指令。上述循环可以用 `goto` 重写如下：\n\n```c\n#include <stdio.h>\n\
    \nint main() {\n    int i = 0;\n\nbegin:\n    if (i < 10) {\n        printf(\"\
    %i %d\\n\", i);\n        i++;\n        goto begin;\n    }\n    return 0;\n}\n\
    ```\n\n示例.29 goto 循环\n\n我们不在程序中使用 `goto` 的原因如下：\n\n- 在函数或 C 文件中使用许多 `goto` 会降低代码的可读性。\n\
    - 编写错误的 `goto` 可能会导致程序出现循环。\n\n在程序中正确使用时，`goto` 并不是坏的。例如，当程序初始化期间某些条件失败时，反初始化序列必须执行相反的操作。在这种情况下，失败用例需要一个跳转。\n\
    \n这里有一个伪代码示例，\n\n```c\nint init_1() {\n    return 0;\n}\n```\n\n```c\nint init_2()\
    \ {\n    ...\n    return 0;\n}\n```\n\n```c\nvoid deinit_1() {\n}\n```\n\n```c\n\
    ...\n}\nint init_main()\n{\n    int ret;\n    ret = init_1();\n    if (ret !=\
    \ 0) {\n        return -1;\n    }\n    ret = init_2();\n    if (ret != 0) {\n\
    \        goto deinit;\n    }\n}\n\ndeinit:\ndeinit_1();\nreturn -1;\n```\n\n示例.30\
    \ goto 用例\n\n更多关于函数的信息请参阅函数章节。\n\n在汽车和航空航天软件应用领域，`goto` 语句很少被使用。它被认为是一种坏习惯。因此，在为此类应用编写软件时，避免这种情况是良好的一步。\n\
    \n## 数组\n\n## 一维数组\n\n一维数组是数组的基础类型。\n\n整数数组定义为：\n\n```c\nint a[10];\n```\n\n上述语句定义了一个包含\
    \ 10 个整数的数组 a。数组中的每个元素都是整数类型的元素。\n\n数组索引从 0 开始。数组中的每个项目都用 0 到 9 的普通数字索引。\n\n上述数组的最大元素数量为\
    \ 10，但第 10 个元素的最后一个索引是 9 而不是。访问超出其最大范围的数组被称为越界。越界访问是一个主要的安全问题，因为元素分配了分配范围之外的地址。\n\
    \n以下程序为数组元素赋值。\n\n```c\n#include <stdio.h>\n\nint main() {\n    int a[10];\n \
    \   int i = 0;\n\n    for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n     \
    \   a[i] = i; // 修正：原文此处逻辑缺失赋值，根据上下文推断\n    }\n\n    printf(\"array elements:\\\
    n\");\n    for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"\
    %d\\n\", a[i]);\n    }\n    return 0;\n}\n```\n示例.31 数组迭代（注：原文代码逻辑略有乱，已按意图对齐翻译）\n\
    初始化语句可以省略。\n上述 `while (1)` 可以重写为 `for` 如下。\n\n```c\n#include <stdio.h>\n\nint\
    \ main()\n{\n    int i = 0;\n\n    for (i = 0; i < 10; i++) {\n        printf(\"\
    %d\\n\", i);\n    }\n    return 0;\n}\n```\n示例.32 sizeof 数组\n\n通过 `sizeof` 方式计算数组。\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a[10];\n    int i;\n\n  \
    \  for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"%d\\n\"\
    , a[i]);\n    }\n    return 0;\n}\n```\n示例.33 数组数量\n\n通过 `sizeof` 也可以找到数组的数量。\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int a[10];\n    int i;\n\n  \
    \  for (i = 0; i < sizeof(a) / sizeof(a[0]); i++) {\n        printf(\"%d\\n\"\
    , a[i]);\n    }\n    return 0;\n}\n```\n示例.34 数组初始化\n\n下面的语句初始化数组。默认情况下如下：\n\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n    int a[10] = {0};\n    int i;\n\n\
    \    for (i = 0; i < 10; i++) {\n        printf(\"%d\\n\", a[i]);\n    }\n   \
    \ return 0;\n}\n```\n示例.35 数组初始化\n\n复制到另一个是简单的。另一种方法是 `memcpy`。\n\n```c\n#include\
    \ <stdio.h>\n#include <string.h>\n\nint main() {\n    int a[10];\n    int a2[10];\n\
    \    int i;\n\n    for (i = 0; i < 10; i++) {\n        a2[i] = a[i];\n    }\n\n\
    \    for (i = 0; i < 10; i++) {\n        printf(\"%d\\n\", a2[i]);\n    }\n  \
    \  return 0;\n}\n```\n示例.36 复制数组\n\n2. 二维数组表示如下。\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    int a[10][10];\n    int i;\n    int j;\n\n    for (i = 0;\
    \ i < 10; i++) {\n        for (j = 0; j < 10; j++) {\n            a[i][j] = j\
    \ + i;\n        }\n    }\n\n    for (i = 0; i < 10; i++) {\n        for (j = 0;\
    \ j < 10; j++) {\n            printf(\"a[%d][%d] = %d\\n\", i, j, a[i][j]);\n\
    \        }\n    }\n\n    return 0;\n}\n```\n示例.37 设置二维数组\n\n3. 三维数组\n\n三维数组是二维数组的组。其表示方式如下：\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n    int array[10][20][40];\n    int\
    \ i;\n    int j;\n    int k;\n    for (i = 0; i < 10; i++) {\n        for (j =\
    \ 0; j < 20; j++) {\n            for (k = 0; k < 40; k++) {\n                array[i][j][k]\
    \ = 10 + i;\n            }\n        }\n    }\n    for (i = 0; i < 10; i++) {\n\
    \        for (j = 0; j < 20; j++) {\n            for (k = 0; k < 40; k++) {\n\
    \                printf(\"[%d][%d][%d] = %d\\n\", i, j, k, array[i][j][k]);\n\
    \            }\n        }\n    }\n    return 0;\n}\n```\n\n示例.38 设置三维数组\n\n数组的用途范围涉及许多地方，例如将一组字符分组，或者通过相似类型的分组来表示硬件设备或一组类似的硬件设备等。此外，数组在搜索和排序技术中也起着重要作用。\n"
