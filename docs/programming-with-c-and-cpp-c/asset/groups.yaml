    for the target architecture.


    This can be done with -c switch to the gcc.


    # Assembler


    During this stage, the generated target specific object code then converted into
    an assembler code representation.


    This can be done with -s switch to the gcc.


    # Linker


    During this stage, the linker converts the object representation into an executable.
    Generally in linux the ELF is the format of the executable file.


    This is another tool called ld1d. We tend not to use this directly unless we are
    writing software specifically for targeted embedded devices.'
