  mdcn: "\n# 宏 (Macros)\n\n宏是编译时常量，在运行时不分配任何空间。\n这意味着预处理器会将使用宏的区域替换为它们对应的值。\n\n在上面的示例中，我们使用了\
    \ `#include <stdio.h>`，其中 `#include` 是一个处理指令。它通知编译器将此语句替换为头文件 `stdio.h`。\n\n##\
    \ #define 宏\n\n预处理阶段会将宏替换为宏定义中存在的实际值。\n\n宏定义了宏常量。例如所示：\n\n```\n#define TWO 2\n\
    ```\n\n宏语句被用作常量或某些常用操作的替代品。\n\n例如使用：\n\n```c\n#define PI 3.1413\n```\n\n```c\n\
    double circumference(double radius)\n{\n    return 2 * PI * radius;\n}\n```\n\n\
    使用常量值更有意义。\n\n```c\n#define ADD(_a, _b) ((_a) + (_b))\n```\n\n这是一个操作。我们将在接下来的章节中讨论函数类宏。\n\
    \n以下是一个示例：\n\n```c\n#define ARRAY_SIZE 10\n```\n\n```c\nint main()\n{\n    int\
    \ r[ARRAY_SIZE];\n}\n```\n\n示例 3：宏转换\n\n对该文件运行 `gcc -E` 得到结果：\n\n```c\n# 0 \"\
    c/def.c\"\n# 0 \"built-in\"\n# 0 \"<command-line\"\n# 1 \"/usr/include/std-predef.h\"\
    \ 1 3 4\n# 0 \"<command-line>\" 2\n# 1 \"c/def.c\"\n```\n\n```c\nint main()\n\
    {\n    int r[10];\n}\n```\n\n示例 4：gcc -E 输出\n宏在预处理阶段后被替换为实际值。\n\n## #undef 宏\n\
    \n`#undef` 宏定义一个宏（注意：移除宏）。例如：\n\n```c\n#define PI 3.1413\n#undef PI\n\ndouble\
    \ circumference(double radius)\n{\n    return 2 * PI * radius;\n}\n```\n\n结果会导致编译器错误，因为预处理器删除了\
    \ PI。\n\n## #ifdef 宏\n\n`#ifdef` 宏检查某个宏是否已定义，如果已定义，预处理器将启用 `#ifdef` 和 `#endif`\
    \ 之间的代码部分。`#ifdef` 后面总是跟着 `#endif` 或 `#else` 语句。\n\n例如：\n\n```c\nint a = 10;\n\
    #ifdef CONFIG_MACRO\na = 5;\n#else\na = 6;\n#endif\n```\n\n如果 `CONFIG_MACRO` 被定义，则\
    \ `a` 设置为 5，否则设置为 6。下面的示例展示了如何定义宏。\n\n```c\n#include <stdio.h>\n#define CONFIG_MACRO\n\
    \nint main()\n{\n  int a = 10;\n  #ifdef CONFIG_MACRO\n    a = 5;\n  #else\n \
    \   a = 6;\n  #endif\n\n  printf(\"%d\\n\", a);\n}\n```\n\n## 示例 4.11 宏定义\n\n\
    定义简单的 `#define CONFIG_MACRO` 就足以启用 `#ifdef` 下的语句。通常，这些可以作为命令行参数传递给编译器，而不是由编译器处理。例如：\n\
