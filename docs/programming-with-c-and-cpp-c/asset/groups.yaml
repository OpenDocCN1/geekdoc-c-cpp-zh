    \ - |\n\n上述类型的变量可以如下声明声明：\n\n```c\nint a;\na 是一个 int 类型的变量。\nint a = 4;\n```\n\
    \n上面的语句将 `a` 初始化为 4。\n\n```c\nint a;\na = 4;\nint a = 0x20;\n```\n\n用十六进制数初始化\
    \ `a`。十六进制用 `0x` 标记。\n\n有时在程序中，我们会初始化变量并在稍后给变量赋一个值。\n\n未初始化的变量被称为未初始化变量。使用未初始化变量时会产生更大的问题，原因是它们在声明时持有某些未知值。当在未初始化的情况下使用变量时，程序运行时的行为将出乎意料。这通常会导致执行错误并提供错误的结果。\n\
    \n理想的解决方案是在声明变量时始终初始化它们，以避免未初始化变量引起的问题。\n\n每个声明的变量都与一个类型相关。回顾变量及其作用域的章节。\n\n声明\
