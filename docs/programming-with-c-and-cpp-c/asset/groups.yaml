    - 2. Another Ethernet product B provides same capabilities for internet working.\n\
    \nSo to the user does not matter what hardware is being used downside. All he\
    \ care is the internet.\n\nAn Operating system programmer must implement something\
    \ that must abstract the two interfaces to provide a uniform interface to the\
    \ user. This generally is where function pointers come in.\n\nLets convert that\
    \ above feature into software.\n\n```c\nstruct ethernet_driver {\n    int (*transmit)(uint8_t\
    \ *packet, int packet_size);\n    int (*receive)(uint8_t *packet);\n};\n```\n\n\
    The structure ethernet_driver provides an interface to the upside user and the\
    \ downward phy device.\n\n```c\nenum eth_driver_list {\n    A,\n    B;\n};\n```\n\
    \n```c\nstruct enum eth_driver_list list[2] = { A, B };\n```\n\n```c\ne = probe_for(&list,\
    \ 2);\n```\n\nHere, the function probe_for looks for hardware registers which\
    \ hardware is inserted, whether its A or B. If it would return the ethernet_driver\
    \ pointer of the driver A, otherwise it returns B.\n\nin A_eth_Driver.c:\n\n```c\n\
    int a_transmit(uint8_t *packet, int packet_size);\nint a_receive(uint8_t *packet);\n\
    ```\n\n```c\nstatic struct ethernet_driver A_driver = {\n    .transmit = a_transmit,\n\
    \    .receive = a_receive,\n};\n```\n\n```c\nstruct ethernet_driver *get_A_functionality()\
    \ {\n    return &A_driver;\n}\n```\n\nin B_eth_Driver.c:\n\n```c\nint b_transmit(uint8_t\
    \ *packet, int packet_size);\nint b_receive(uint8_t *packet);\n```\n\n```c\nstatic\
    \ struct ethernet_driver B_driver = {\n    .transmit = b_transmit,\n    .receive\
    \ = b_receive,\n};\n```\n\n```c\nstruct ethernet_driver *get_B_functionality()\
    \ {\n    return &B_driver;\n}\n```\n\nin probe.c:\n\n```c\n#define A_REG 0xA0000\n\
    #define B_REG 0xB0000\n```\n\n```c\nstruct ethernet_driver *probe_for(enum eth_driver_list\
    \ list, int len) {\n    int i;\n\n    for (i = 0; i < len; i++) {\n        if\
    \ (list[i] == A) {\n            if (match_reg(A_REG)) {\n                return\
