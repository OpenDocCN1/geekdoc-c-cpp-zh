  - "[PAGE 164]\n\n# Filling in the blanks\n\nIt’s time to replace pass in the placeholder\
    \ functions with actual code. After adding the code for each function, run the\
    \ game to see what difference it makes.\n\n# Stay inside\n\nFill the outside_window()\
    \ function with this code. First it calculates the position of each wall. Then\
    \ it asks the caterpillar for its current position. By comparing the caterpillar’s\
    \ coordinates with the coordinates of the walls, it can tell whether the caterpillar\
    \ has left the window. Run the program to check the function works—the caterpillar\
    \ should stop when it reaches the edge.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_164_0.png)\n\
    \n```\n```python\nleft_wall = -t.window_width() / 2\nright_wall = t.window_width()\
    \ / 2\ntop_wall = t.window_height() / 2\nbottom_wall = -t.window_height() / 2\n\
    (x, y) = caterpillar.pos()\noutside = \\\n    x < left_wall or \\\n    x > right_wall\
    \ or \\\n    y < bottom_wall or \\\n    y > top_wall\nreturn outside\n```\n```\n\
    \nThis function returns two values (a tuple).\n\nIf any of the four conditions\
    \ above is True, then outside = True.\n\n# How it works\n\nThe center of the window\
    \ has the coordinates (0, 0). Since the window is 400 wide, the right wall is\
    \ half the width from the center, which is 200. The code gets the left wall's\
    \ position by subtracting half the width from 0. In other words, 0–200, which\
    \ is –200. It finds the position of the top and bottom walls by a similar method.\n\
    \n# GAME OVER!\n\nWhen the caterpillar has left the screen, display a message\
    \ to tell the player the game has ended. Fill in the game_over() function with\
    \ this code. When called, the function will hide the caterpillar and leaf, and\
    \ write “GAME OVER!” on the screen.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_164_1.png)\n\
    \n```\n```python\ndef game_over():\n    caterpillar.color('yellow')\n    leaf.color('yellow')\n\
    \    t.penup()\n    t.hideturtle()\n    t.write('GAME OVER!', align='center',\
    \ font=('Arial', 30, 'normal'))\n```\n```\n\nThe text should be centered."
  - "[PAGE 165]\n\n# 13. Show the score\n\nThe function `display_score()` instructs\
    \ the score turtle to rewrite the score, putting the latest total on the screen.\
    \ This function is called whenever the caterpillar reaches a leaf.\n\n```\n```python\n\
    def display_score(current_score):\n    score_turtle.clear()\n    score_turtle.penup()\n\
    \    x = (t.window_width() / 2) - 50\n    y = (t.window_height() / 2) - 50\n \
    \   score_turtle.setpos(x, y)\n    score_turtle.write(str(current_score), align='right',\
    \ \\\n        font=('Arial', 40, 'bold'))\n```\n```\n\n50 pixels from the right\n\
    \n50 pixels from the top\n\n# 14. A new leaf\n\nWhen a leaf is reached, the function\
    \ `place_leaf()` is called to move the leaf to a new, random location. It chooses\
    \ two random numbers between −200 and 200. These numbers become the x and y coordinates\
    \ for the next leaf.\n\n```\n```python\ndef place_leaf():\n    leaf.ht()\n   \
    \ leaf.setx(random.randint(-200, 200))\n    leaf.sety(random.randint(-200, 200))\n\
    \    leaf.st()\n```\n```\n\nht is short for hideturtle\n\nChooses random coordinates\
    \ to move the leaf.\n\nst is short for showturtle.\n\n# 15. Turning the caterpillar\n\
    \nNext, to connect the keyboard keys to the caterpillar, add four new direction\
    \ functions after the `start_game()` function. To make this game a little trickier,\
    \ the caterpillar can only make 90-degree turns. As a result, each function first\
    \ checks to see which way the caterpillar is moving before altering its course.\
    \ If the caterpillar’s going the wrong way, the function uses `setheading()` to\
    \ make it face the right direction.\n\n```\n```python\ngame_over()\n    break\n\
    \ndef move_up():\n    if caterpillar.heading() == 0 or caterpillar.heading() ==\
    \ 180:\n        caterpillar.setheading(90)\n\ndef move_down():\n    if caterpillar.heading()\
    \ == 0 or caterpillar.heading() == 180:\n        caterpillar.setheading(270)\n\
    \ndef move_left():\n    if caterpillar.heading() == 90 or caterpillar.heading()\
    \ == 270:\n        caterpillar.setheading(180)\n\ndef move_right():\n    if caterpillar.heading()\
    \ == 90 or caterpillar.heading() == 270:\n        caterpillar.setheading(0)\n\
    ```\n```\n\nCheck if the caterpillar is heading left or right.\n\nA heading of\
    \ 270 sends the caterpillar down the screen."
