  mdcn: "\n## max()\n\nmax() 函数会从你传给它的参数中选出最大值。按 Enter/Return 键，就能在屏幕上看到该值。这个函数接受多个参数，参数之间必须用逗号分隔。\n\
    \n```python\n>>> max(10, 16, 30, 21, 25, 28)\n30\n```\n\n最大值就是括号中最高的数字。\n\n多个参数之间始终要用逗号分隔。\n\
    \n## min()\n\nmin() 函数的作用与 max() 相反。它会从你放在括号里的参数中选出最小值。你可以自己动手试验 max() 和 min()\
    \ 函数。\n\n```python\n>>> min(10, 16, 30, 21, 25, 28)\n10\n```\n\n当你按 Enter/Return\
    \ 键时，代码会显示最低的数字。\n\n## 另一种调用方式\n\n到目前为止，我们遇到的一些不同类型的数据（例如整数、字符串和列表）都有自己的函数。这些函数必须以特殊方式调用。你先输入数据，或保存该数据的变量名，然后输入一个点、函数名，最后加上括号。请在\
    \ shell 中测试这些代码片段。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_46_0.png)\n\n不要忘记那个点。\n\
    \n```python\n>>> 'bang'.upper()\n'BANG'\n```\n\n这是新的字符串，全部为大写字母。\n\n空括号表示不需要参数。\n\
    \n## upper()\n\nupper() 函数接收一个现有字符串，并返回一个新字符串，其中所有小写字符都变成了大写（大写字母）。\n\n## replace()\n\
    \n这个函数有两个参数。该函数需要两个参数：第一个是你想替换的字符串部分，第二个是你想用来替换它的字符串。函数会返回完成替换后的新字符串。\n\n```python\n\
    >>> message = 'Python makes me happy'\n>>> message.replace('happy', ':D')\n'Python\
    \ makes me :D'\n```\n\n新字符串用 :D 替换了 happy。\n\n## reverse()\n\n当你想反转列表中各项的顺序时，可以使用这个函数。在这里，它用来反转存储在变量\
    \ countdown 中的数字列表。该函数不会把列表打印为 [1, 2, 3]，而是让它打印为 [3, 2, 1]。\n\n存储在变量 countdown\
    \ 中的数字列表：\n\n```python\n>>> countdown = [1, 2, 3]\n>>> countdown.reverse()\n>>>\
    \ print(countdown)\n[3, 2, 1]\n```\n\n现在列表已反转。\n\n## 创建函数\n\n最好的函数都有明确的目的，以及能说明其作用的好名字——想想你在\
    \ Animal Quiz 中使用过的 `check_guess()` 函数。按照以下说明创建（或“定义”）一个函数，用来计算一天有多少秒，然后把答案打印到屏幕上。\n\
    \n### 1 定义函数\n\n在 IDLE 中新建一个文件。将其保存为“functions.py”。在编辑器窗口中输入这些代码行。函数中每一行的开头都会添加一个缩进。再次保存文件，然后运行代码，看看会发生什么。\n\
    \n函数的名称\n\n目前还没有参数。\n\n```python\ndef print_seconds_per_day():\n    hours = 24\n\
    \    minutes = hours * 60\n    seconds = minutes * 60\n    print(seconds)\n\n\
    print_seconds_per_day()\n```\n\n变量\n\n这一行会打印变量 seconds 的值。\n\n关键字 `def` 告诉 Python，这个代码块是一个函数。\n\
    \n名称后面的各行必须缩进 4 个空格，以便向 Python 表明它们是函数的一部分。\n\n这条命令调用该函数。\n\n86400\n\n一天中的秒数会显示在\
    \ shell 中。\n\n### 2 添加参数\n\n如果你想让函数使用一些值，就把它们作为参数放在括号里。例如，要计算特定天数内总共有多少秒，请将代码改成下面这样。这个函数现在有一个参数\
    \ `days`。你可以在调用函数时指定天数。自己试一试吧。\n\n```python\ndef print_seconds_per_day(days):\n\
    \    hours = days * 24\n    minutes = hours * 60\n    seconds = minutes * 60\n\
    \    print(seconds)\n\nprint_seconds_per_day(7)\n```\n\n函数的参数\n\n这一行使用了参数 `days`。\n\
    \n给参数 days 一个值（7）\n\n已有代码行以灰色显示，新代码行以粗体显示。\n\n604800\n\n7 天中的秒数。\n\n### 专家提示\n\
    \n**重要建议**\n\n务必先在主代码中使用函数之前定义它们。当你学习用 Python 编程时，把函数放在文件顶部、所有 import 语句之后会很有帮助。这样做，你就不会犯在定义函数之前就尝试调用它的错误。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_47_0.png)\n\n### 3. 返回值\n\n一旦你有了一个能完成有用任务的函数，你就会想在代码的其他部分使用该函数的结果。你可以通过“返回”值来从函数中取出值。像这里所示那样修改代码，以获取函数的返回值。你应该重命名该函数，使其与新用途相匹配。暂时不要尝试运行这段代码。\n\
    \n```python\ndef convert_days_to_seconds(days):\n    hours = days * 24\n    minutes\
    \ = hours * 60\n    seconds = minutes * 60\n    return seconds\n```\n\n函数的新名称\n\
    \n关键字 `return` 会给出变量 `seconds` 的值。\n\n调用该函数的那一行已被删除，因为该函数现在有了新的名称和用途。\n\n### 4.\
    \ 存储并使用返回值\n\n你可以将函数的返回值存储在变量中，以便稍后在代码中使用。将这段代码添加到函数下方。它会存储返回值，并用它来计算毫秒数（千分之一秒）。试一试，并试验不同的天数。\n\
    \n```python\ndef convert_days_to_seconds(days):\n    hours = days * 24\n    minutes\
    \ = hours * 60\n    seconds = minutes * 60\n    return seconds\n\ntotal_seconds\
    \ = convert_days_to_seconds(7)\nmilliseconds = total_seconds * 1000\nprint(milliseconds)\n\
    ```\n\n这会调用函数，并给参数 `days` 一个值（7）。\n\n返回值存储在变量 `total_seconds` 中。\n\n604800000\n\
    \n这一行会打印 `milliseconds` 的值。\n\n总秒数被转换为毫秒，并存储在变量 `milliseconds` 中。\n\n这是 7 天中的毫秒数。\n\
    \n### 专家提示\n\n### 为函数命名\n\n在第 3 步中，你把函数名从 `print_seconds_per_day()` 改成了 `convert_days_to_seconds()`。就像变量一样，你使用的名称必须准确说明函数的作用，这一点很重要。这会让你的代码更容易理解。\n\
    \n函数命名规则与变量命名规则类似。函数名可以包含字母、数字和下划线，但应以字母开头。如果名称中有多个单词，单词之间应使用下划线分隔。\n\n## 修复错误\n\
    \n如果你的代码有问题，Python 会尝试通过显示错误消息来提供帮助。这些消息起初可能看起来有点令人困惑，但它们会给你线索，说明程序为什么无法运行以及如何修复。\n\
    \n### 错误消息\n\n如果检测到错误，IDLE 编辑器和 shell 窗口都能显示错误消息。错误消息会告诉你发生了什么类型的错误，以及应该在代码的哪里查找。\n\
    \n### shell 中的消息\n\nPython 会在 shell 窗口中以红色文本显示错误消息。出现错误消息时，程序会停止运行。该消息会告诉你哪一行代码导致了错误。\n\
    \n这个弹出框告诉你存在语法错误，这意味着有输入错误。\n\n### IDLE 编辑器中的消息\n\n弹出框会警告你有错误。单击“确定”返回程序。错误处或错误附近会有红色高亮显示。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_0.png)\n\n```text\n>>>\nTraceback\
    \ (most recent call last):\n    File \"Users/Craig/Developments/top-secret-python-book/age.py\"\
    , line 21, in <module>\n        print('I am'+ age + 'years old')\nTypeError: Can't\
    \ convert 'int' object to str implicitly\n```\n\n这一行告诉你这是一个类型错误（见第 50 页）。\n\n\
    错误位于第 21 行。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_1.png)\n\n### 专家提示——查找错误\n\
    \n当 shell 中出现错误消息时，右键单击它，然后在弹出菜单中选择“Go to file/line”。IDLE 编辑器会直接跳转到那一行代码，这样你就可以开始调试了。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_2.png)\n"
