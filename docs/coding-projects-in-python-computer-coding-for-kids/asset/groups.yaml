    \n虽然这些形状相同，但它们的颜色不同，所以不能抢拍。\n\n## 工作原理\n\n本项目使用 Tkinter 创建形状。Tkinter 的 mainloop()\
    \ 函数会调度一个由你创建的函数来显示下一个形状。random 模块的 shuffle() 函数确保形状以不同的顺序出现。“q”和“p”键被绑定（关联）到\
    \ snap() 函数，因此每次按下其中一个键时，它都会更新相应玩家的得分。\n\n### ▷ 抢拍流程图\n\n只要还有形状需要显示，程序就会持续运行。当玩家认为自己看到可以抢拍的组合时，程序会响应他们按下的键。当没有更多形状时，程序会宣布获胜者并结束游戏。\n\
