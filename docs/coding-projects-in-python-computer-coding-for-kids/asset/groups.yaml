    \ switches the eyes between being open and closed.\n\nFirst the code checks the\
    \ eyes’ current color; white is open, blue is closed.\n\nThis line sets the eyes’\
    \ new color to the opposite value.\n\nTo blink, the eyes fill with sky blue and\
    \ the pupils disappear.\n\n```\n```python\nfrom tkinter import HIDDEN, NORMAL,\
    \ Tk, Canvas\n\ndef toggle_eyes():\n    current_color = c.itemcget(eye_left, 'fill')\n\
    \    new_color = c.body_color if current_color == 'white' else 'white'\n    current_state\
