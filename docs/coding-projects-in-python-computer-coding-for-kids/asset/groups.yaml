    \ 1、2、3、4、5、6、7、8、9 和 10。\n\n### 专家提示：转义字符（\\\\\\\\）\n\n`Emma\\'s Room` 中的反斜杠告诉\
    \ Python 忽略撇号，这样就不会把它当作结束整个字符串的引号。这样使用的反斜杠称为转义字符。它告诉 Python 在判断该行是否有意义或是否包含错误时，不要计入下一个字符。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_34_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_34_1.png)\n\
    \n### while 循环\n\n如果你不知道想重复一段代码多少次，该怎么办？你需要水晶球或其他能预见未来的方法吗？不，没关系！你可以使用 **while**\
    \ 循环。\n\n### ▷ 循环条件\n\nwhile 循环没有设置为某个值范围的循环变量。相反，它有一个循环条件。这是一个布尔表达式，可以是 True\
    \ 或 False。这有点像迪斯科舞厅的保安问你是否持有门票。如果你有（True），就直接走向舞池；如果你没有（False），保安不会让你进去。在编程中，如果循环条件不为\
    \ True，你就进不了循环！\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_34_2.png)\n\n### ▽\
    \ 平衡表演\n\n在这个示例中，艾哈迈德编写了一个程序，用来记录他的杂技河马剧团中有多少只河马叠在一起保持平衡，搭成一座塔。通读代码，看看你能否弄明白它是如何工作的。\n\
    \n这个变量存储河马的数量。\n\n这个变量存储问题“Add another hippo?”的答案。\n\n循环条件\n\n这一行显示一条消息，给出保持平衡的河马总数。\n\
    \n艾哈迈德的回复会成为 answer 的新值。\n\n在保持平衡的数量上再加一只河马。\n\n```python\n>>> hippos = 0\n>>>\
    \ answer = 'y'\n>>> while answer == 'y':\n...     hippos = hippos + 1\n...   \
    \  print(str(hippos) + ' balancing hippos!')\n...     answer = input('Add another\
    \ hippo? (y/n) ')\n```\n\n### ▷ 工作原理\n\n艾哈迈德程序中的循环条件是 `answer == 'y'`。这意味着用户想添加一只河马。在循环体中，我们将现有河马数量加一，然后询问用户是否想再添加一只。如果他们输入“y”（表示是），循环条件为\
    \ True，所以我们再次绕循环执行。如果他们回答“n”（表示否），循环条件为 False，程序就离开循环。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_35_0.png)\n\
    \n### 无限循环\n\n有时你可能希望 `while` 循环在程序运行期间一直持续下去。这种循环称为无限循环。许多电子游戏程序使用一种称为主循环的无限循环。\n\
    \n```python\n>>> while True:\n    print('This is an infinite loop!')\n```\n\n\
    没有可退出循环的 False 选项。\n\n### △ 进入无限\n\n通过将循环条件设置为常量值 True，就可以创建无限循环。因为这个值永远不变，所以循环永远不会退出。在\
    \ shell 中试一试这个 `while` 循环。它没有 False 选项，因此循环会不停地打印“This is an infinite loop!”，直到你退出程序。\n\
    \n### ▽ 逃离无限\n\n你可以有意使用无限循环来获取用户输入。这个（烦人的）程序会询问用户是否感到无聊。只要用户输入“n”，它就会一直问这个问题。如果他们受够了并输入“y”，程序会说他们没礼貌，并使用\
    \ `break` 命令离开循环！\n\n```python\n>>> while True:\n    answer = input('Are you bored\
    \ yet? (y/n)')\n    if answer == 'y':\n        print('How rude!')\n        break\n\
    ```\n\nTrue 条件对应用户还没无聊（`'n'`）。\n\nFalse 条件（`'y'`）会触发 `break` 命令。\n\n### 专家提示：停止循环\n\
    \n如果你不想要无限循环，重要的是确保 `while` 循环的循环体做出可能使循环条件变为 False 的操作。但别担心——如果你不小心写出了无限循环，可以按住\
    \ Ctrl（control）键的同时按 C 键来退出。你可能需要按几次 Ctrl+C 才能退出循环。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_35_1.png)\n"
