    \ Python 中，程序中的不同路线通向不同的代码块。一个代码块可以是一条语句，也可以是多条语句，全部缩进四个空格。计算机使用一种称为条件的测试来判断接下来应该运行哪些代码块。\n\
    \n### ▷ 单分支\n\n最简单的分支命令是 **if** 语句。它只有一个分支，如果条件为 True，计算机就会走这个分支。这个程序要求用户说明外面是否天黑了。如果天黑了，程序就假装计算机要睡觉了！如果天不黑，`is_dark\
    \ == 'y'` 为 False，所以不会显示“晚安！”消息。\n\n这一行要求用户回复“y”（是）或“n”（否）。\n\n```python\nis_dark\
    \ = input('Is it dark outside? y/n')\nif is_dark == 'y':\n    print('Goodnight!\
    \ zzzzzzzzzzzzzz...')\n```\n\n条件\n\n如果条件为 True，就走这个分支。\n\n代码会在 shell 窗口中显示这条消息。\n\
    \n### ▷ 双分支\n\n你希望程序在条件为 True 时做一件事，在条件为 False 时做另一件事吗？如果是，就需要一个带两个分支的命令，称为 **if-else**\
    \ 语句。这个程序询问用户是否有触手。如果回答“Yes”，它就认定用户一定是章鱼！如果回答“No”，它就认定用户是人类。每种判断都会打印不同的消息。\n\n\
