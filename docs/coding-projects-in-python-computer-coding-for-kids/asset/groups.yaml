    \ in the shell window.\n\n### What happens\n\nThe program asks the player some\
    \ questions about animals. They get three chances to answer each question—you\
    \ don't want to make the quiz too difficult! Each correct answer will score one\
    \ point. At the end of the quiz, the program reveals the player's final score.\n\
    \n```text\nPython 3.5.2 Shell\n\nGuess the Animal!\nWhich bear lives at the North\
    \ Pole? polar bear\nCorrect answer\nWhich is the fastest land animal? cheetah\n\
    Correct answer\nWhich is the largest animal? giraffe\nSorry, wrong answer. Try\
    \ again. elephant\nSorry, wrong answer. Try again. rhinoceros\nThe correct answer\
