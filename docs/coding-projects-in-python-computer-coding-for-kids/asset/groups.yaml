    \ Did you include the brackets? Did you spell the word “print” correctly? Fix\
    \ any mistakes, then try running the code again.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_24_2.png)\n\
    \n# ### EXPERT TIPS\n## Keyboard shortcut\n\nA handy shortcut to run a program\
