    \n米娅可以乘坐过山车了！\n\n## 分支\n\n计算机经常需要决定运行程序的哪些部分。这是因为大多数程序被设计为在不同情况下做不同的事情。程序中的路线会分叉，就像一条小路分出多条支路，每条支路通向不同的地方。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_31_1.png)\n\n### 条件\n\n条件是一个布尔表达式（真或假的比较），帮助计算机在代码中到达分支时决定走哪条路线。\n\
