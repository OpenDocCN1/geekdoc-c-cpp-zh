    \ to see if the second one matches. The project stores the buttons in a dictionary\
    \ and the symbols in a list.\n\n## EXPERIMENTS\n### lambda functions\n\nLike `def`,\
    \ the keyword `lambda` is used to define functions. Lambda functions are written\
    \ all on one line and can be used anywhere you need a function. For example, the\
    \ number lambda `x: x*2` doubles a number. You can assign it to a variable, such\
    \ as `double = lambda x: x*2`. Then you can call it using `double(x)`, where x\
    \ is a number. So `double(2)` would return 4. Lambda functions are very useful\
    \ in GUI programming, where several buttons may need to call the same function\
    \ using different parameters. In Matchmaker, you would have to create a different\
    \ function for each button—that’s 24 functions!\n\n## Matchmaker flowchart\n\n\
    After shuffling the symbols and creating the grid, the program spends its time\
    \ listening for button presses. It ends when all the matching pairs have been\
    \ found.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_182_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_182_1.png)\n\
    \n## Getting started\n\nIn the first part of the project, you'll set up the graphical\
    \ user interface (GUI) and add the pairs of symbols that will be hidden by the\
    \ buttons.\n\n- **1. Create a new file**\n\nOpen IDLE. Create a new file and save\
    \ it as “matchmaker.py”.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_0.png)\n\
    \n- **2. Add modules**\n\nNow type this code at the top of your file to import\
    \ the modules you need for this project. You’ll use `random` to shuffle the symbols,\
    \ `time` to pause the program, and `Tkinter` to create the GUI.\n\n```python\n\
    import random\nimport time\nfrom tkinter import Tk, Button, DISABLED\n```\n\n\
    `DISABLED` stops a button from responding after its symbol has been matched.\n\
    \n`Button` creates the buttons in the Tkinter window.\n\n- **3. Set up the GUI**\n\
    \nUnder the import commands, add this code, which will set up the GUI. The `root.resizable()`\
    \ function prevents the player from resizing the window. This is important, since\
    \ changing the size of the window will mess up the button layout that you’ll create\
    \ later on.\n\n```python\nroot = Tk()\nroot.title('Matchmaker')\nroot.resizable(width=False,\
    \ height=False)\n```\n\nThese lines create a Tkinter window and give it a title.\n\
    \nThis line keeps the window at its original size.\n\n- **4. Test your code**\n\
    \nNow run the code. You should see an empty Tkinter window with the heading “Matchmaker”.\
    \ If you can’t see it, it’s probably hidden behind other windows.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_2.png)\n\nDon't forget to save\
    \ your work.\n\n### 5. Make some variables\n\nUnder the code for Step 3, add the\
    \ variables that the program needs, and create a dictionary to store the buttons\
    \ in. For each attempt at a match, you need to remember whether it’s the first\
    \ or second symbol in the match. You also need to keep track of the first button\
    \ press so you can compare it with the second button press.\n\n```python\nroot.resizable(width=False,\
    \ height=False)\n\nbuttons = {}\nfirst = True\npreviousX = 0\npreviousY = 0\n\
    ```\n\nThis is the dictionary.\n\nThis variable is used to check if the symbol\
    \ is the first in the match.\n\nThese two variables keep track of the last button\
    \ pressed.\n\n### 6. Add the symbols\n\nNext type the code below to add the symbols\
    \ the game will use. As in the Nine Lives project, the program uses Unicode characters.\
    \ There are 12 pairs, making 24 in total. Add this code under the variables added\
    \ in Step 5.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_184_0.png)\n\n```python\n\
    previousY = 0\n\nbutton_symbols = {}\nsymbols = [u'\\u2702', u'\\u2702', u'\\\
    u2705', u'\\u2705', u'\\u2708', u'\\u2708',\n           u'\\u2709', u'\\u2709',\
    \ u'\\u270A', u'\\u270A', u'\\u270B', u'\\u270B',\n           u'\\u270C', u'\\\
    u270C', u'\\u270F', u'\\u270F', u'\\u2712', u'\\u2712',\n           u'\\u2714',\
    \ u'\\u2714', u'\\u2716', u'\\u2716', u'\\u2728', u'\\u2728']\n```\n\nThe symbol\
    \ for each button is stored in this dictionary.\n\nThis list stores the 12 pairs\
    \ of symbols that will be used in the game.\n\n### 7. Shuffle the symbols\n\n\
    You don’t want the symbols to appear in the same place every time. After several\
    \ games, the player would remember their positions and would be able to match\
    \ them all at their first try, every time. To prevent this, you need to shuffle\
    \ the symbols before each game starts. Add this line after the list of symbols.\n\
    \n```python\nrandom.shuffle(symbols)\n```\n\nThe shuffle() function from the random\
    \ module mixes up the shapes.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_184_1.png)\n\
    \n## Nested loops\n\nYou may remember reading about nested loops on page 35. You\
    \ can put as many loops inside one another as you want. In this project, the outer\
    \ loop runs six times. Each time the outer loop runs, the inner loop runs four\
    \ times. So in total, the inner loop runs 6 x 4 = 24 times.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_0.png)\n\
    \n### 9. Start the main loop\n\nNow start Tkinter's mainloop. Once this loop starts,\
    \ the GUI will get displayed and it will start listening for button presses. Type\
    \ this line after the code you added in Step 8.\n\n```python\nroot.mainloop()\n\
    ```\n\n### 10. Test your code\n\nRun the program again. Your Tkinter window should\
    \ now be filled with 24 buttons arranged in a grid. If it doesn't look similar\
    \ to the picture shown here, check your code carefully for any errors.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_2.png)\n\n## Show the symbol\n\n\
    Finally, you need to create the function that handles the button presses. This\
    \ function will always display a symbol, but how it operates depends on whether\
    \ it’s the first or second turn in the matching attempt. If it’s the first turn,\
    \ the function just needs to remember which button was pressed. If it’s the second\
    \ turn, it needs to check if the symbols match. Symbols that don’t match are hidden.\
    \ Matching symbols are left showing and their buttons are disabled.\n\n```python\n\
    from tkinter import Tk, Button, DISABLED\n\n# The x and y values tell the function\
    \ which button has been pressed.\ndef show_symbol(x, y):\n    # These lines tell\
    \ the program that the variables are global\n    global first\n    global previousX,\
    \ previousY\n    # These lines show the symbol.\n    buttons[x, y]['text'] = button_symbols[x,\
    \ y]\n    buttons[x, y].update_idletasks()\n\n    if first:\n        # If it's\
    \ the first turn, the code remembers the button press by storing\n        # the\
    \ x and y coordinates.\n        previousX = x\n        previousY = y\n       \
    \ first = False\n    # Second turn. This line includes a check to stop the player\
    \ cheating by\n    # pressing every button twice!\n    elif previousX != x or\
    \ previousY != y:\n        # If the symbols don't match...\n        if buttons[previousX,\
    \ previousY]['text'] != buttons[x, y]['text']:\n            # Wait 0.5 seconds\
    \ to give the player time to see the symbols,\n            # then hide them.\n\
    \            time.sleep(0.5)\n            buttons[previousX, previousY]['text']\
    \ = ''\n            buttons[x, y]['text'] = ''\n        else:\n            # If\
    \ the symbols match...\n            # Disable the pair of matching buttons so\
    \ the player can't press them again.\n            buttons[previousX, previousY]['command']\
    \ = DISABLED\n            buttons[x, y]['command'] = DISABLED\n            # This\
    \ line gets the function ready for the first button press of the next attempt.\n\
    \            first = True\n```\n\n## How it works\n\nThe function shows a button’s\
    \ symbol by changing its text label to the Unicode character we randomly assigned\
    \ to it. We use update_idletasks() to tell Tkinter to show this symbol right now.\
    \ If it’s the first turn, we just store the button’s coordinates in variables.\
    \ If it’s the second turn, we need to check that the player isn’t trying to cheat\
    \ by hitting the same button twice. If they aren’t, we check if the symbols match.\
    \ If the symbols don’t match, we hide them by setting the text to empty strings;\
    \ if they do match, we leave them showing but disable the buttons.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_187_0.png)\n"
  mdcn: "\n## 工作原理\n\n本项目使用 Tkinter 模块来显示按钮网格。Tkinter 的 `mainloop()` 函数监听按钮按下，并用一种特殊类型的函数——称为\
    \ **lambda** 函数——来处理它们，该函数会显示一个符号。如果已经显示了一个未匹配的符号，程序会检查第二个符号是否匹配。项目将按钮存储在字典中，将符号存储在列表中。\n\
    \n## 实验\n### lambda 函数\n\n与 `def` 一样，关键字 `lambda` 用于定义函数。lambda 函数全部写在一行中，并且可以在任何需要函数的地方使用。例如，数字\
    \ lambda `x: x*2` 会将一个数字翻倍。你可以将它赋给一个变量，例如 `double = lambda x: x*2`。然后你可以使用 `double(x)`\
    \ 调用它，其中 x 是一个数字。因此 `double(2)` 会返回 4。lambda 函数在 GUI 编程中非常有用，其中多个按钮可能需要使用不同参数调用同一个函数。在\
    \ Matchmaker 中，你将不得不为每个按钮创建一个不同的函数——那就是 24 个函数！\n\n## Matchmaker 流程图\n\n在打乱符号并创建网格后，程序会花时间监听按钮按下。当所有匹配对都被找到时，程序结束。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_182_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_182_1.png)\n\
    \n## 开始\n\n在项目的第一部分，你将设置图形用户界面（GUI），并添加将被按钮隐藏的符号对。\n\n- **1. 创建一个新文件**\n\n打开 IDLE。创建一个新文件并将其保存为\
    \ “matchmaker.py”。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_0.png)\n\n\
    - **2. 添加模块**\n\n现在在文件顶部输入这段代码，以导入本项目所需的模块。你将使用 `random` 来打乱符号，使用 `time` 来暂停程序，并使用\
    \ `Tkinter` 来创建 GUI。\n\n```python\nimport random\nimport time\nfrom tkinter import\
    \ Tk, Button, DISABLED\n```\n\n`DISABLED` 会在按钮的符号匹配后阻止按钮响应。\n\n`Button` 在 Tkinter\
    \ 窗口中创建按钮。\n\n- **3. 设置 GUI**\n\n在导入命令下方添加这段代码，它将设置 GUI。`root.resizable()` 函数会阻止玩家调整窗口大小。这很重要，因为改变窗口大小会破坏你稍后创建的按钮布局。\n\
    \n```python\nroot = Tk()\nroot.title('Matchmaker')\nroot.resizable(width=False,\
    \ height=False)\n```\n\n这些行创建一个 Tkinter 窗口并给它一个标题。\n\n这一行使窗口保持其原始大小。\n\n- **4.\
    \ 测试你的代码**\n\n现在运行代码。你应该会看到一个标题为 “Matchmaker” 的空 Tkinter 窗口。如果你看不到它，它可能被其他窗口遮挡了。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_1.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_2.png)\n\
    \n别忘了保存你的工作。\n\n### 5. 创建一些变量\n\n在第 3 步的代码下方，添加程序所需的变量，并创建一个字典来存储按钮。对于每次匹配尝试，你需要记住它是匹配中的第一个还是第二个符号。你还需要跟踪第一次按钮按下，以便将其与第二次按钮按下进行比较。\n\
    \n```python\nroot.resizable(width=False, height=False)\n\nbuttons = {}\nfirst\
    \ = True\npreviousX = 0\npreviousY = 0\n```\n\n这是字典。\n\n此变量用于检查该符号是否为匹配中的第一个。\n\
    \n这两个变量跟踪最后按下的按钮。\n\n### 6. 添加符号\n\n接下来输入下面的代码，以添加游戏将使用的符号。与 Nine Lives 项目一样，程序使用\
    \ Unicode 字符。共有 12 对，总计 24 个。在第 5 步添加的变量下方添加这段代码。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_184_0.png)\n\
    \n```python\npreviousY = 0\n\nbutton_symbols = {}\nsymbols = [u'\\u2702', u'\\\
    u2702', u'\\u2705', u'\\u2705', u'\\u2708', u'\\u2708',\n           u'\\u2709',\
    \ u'\\u2709', u'\\u270A', u'\\u270A', u'\\u270B', u'\\u270B',\n           u'\\\
    u270C', u'\\u270C', u'\\u270F', u'\\u270F', u'\\u2712', u'\\u2712',\n        \
    \   u'\\u2714', u'\\u2714', u'\\u2716', u'\\u2716', u'\\u2728', u'\\u2728']\n\
    ```\n\n每个按钮的符号存储在这个字典中。\n\n此列表存储游戏中将使用的 12 对符号。\n\n### 7. 打乱符号\n\n你不希望符号每次都出现在相同的位置。玩过几次后，玩家会记住它们的位置，并且每次都能在第一次尝试时全部匹配。为防止这种情况，你需要在每局游戏开始前打乱符号。在符号列表之后添加这一行。\n\
    \n```python\nrandom.shuffle(symbols)\n```\n\n`random` 模块中的 `shuffle()` 函数会打乱这些图形。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_184_1.png)\n\n## 嵌套循环\n\n你可能记得在第 35\
    \ 页读到过嵌套循环。你可以按需要将任意多个循环彼此嵌套。在这个项目中，外层循环运行六次。每次外层循环运行时，内层循环运行四次。因此，内层循环总共运行 6\
    \ x 4 = 24 次。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_0.png)\n\n### 9.\
    \ 启动主循环\n\n现在启动 Tkinter 的 mainloop。一旦这个循环开始，GUI 将显示出来，并开始监听按钮按下。在第 8 步添加的代码之后输入这一行。\n\
    \n```python\nroot.mainloop()\n```\n\n### 10. 测试你的代码\n\n再次运行程序。你的 Tkinter 窗口现在应该填满\
    \ 24 个按网格排列的按钮。如果它看起来与这里显示的图片不相似，请仔细检查代码是否有任何错误。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_186_2.png)\n\n## 显示符号\n\n最后，你需要创建处理按钮按下的函数。这个函数将始终显示一个符号，但它的工作方式取决于它是匹配尝试中的第一轮还是第二轮。如果是第一轮，函数只需要记住按下了哪个按钮。如果是第二轮，它需要检查符号是否匹配。不匹配的符号会被隐藏。匹配的符号会保持显示，并且它们的按钮会被禁用。\n\
    \n```python\nfrom tkinter import Tk, Button, DISABLED\n\n# The x and y values\
    \ tell the function which button has been pressed.\ndef show_symbol(x, y):\n \
    \   # These lines tell the program that the variables are global\n    global first\n\
    \    global previousX, previousY\n    # These lines show the symbol.\n    buttons[x,\
    \ y]['text'] = button_symbols[x, y]\n    buttons[x, y].update_idletasks()\n\n\
    \    if first:\n        # If it's the first turn, the code remembers the button\
    \ press by storing\n        # the x and y coordinates.\n        previousX = x\n\
    \        previousY = y\n        first = False\n    # Second turn. This line includes\
    \ a check to stop the player cheating by\n    # pressing every button twice!\n\
    \    elif previousX != x or previousY != y:\n        # If the symbols don't match...\n\
    \        if buttons[previousX, previousY]['text'] != buttons[x, y]['text']:\n\
    \            # Wait 0.5 seconds to give the player time to see the symbols,\n\
    \            # then hide them.\n            time.sleep(0.5)\n            buttons[previousX,\
    \ previousY]['text'] = ''\n            buttons[x, y]['text'] = ''\n        else:\n\
    \            # If the symbols match...\n            # Disable the pair of matching\
    \ buttons so the player can't press them again.\n            buttons[previousX,\
    \ previousY]['command'] = DISABLED\n            buttons[x, y]['command'] = DISABLED\n\
    \            # This line gets the function ready for the first button press of\
    \ the next attempt.\n            first = True\n```\n\n## 工作原理\n\n该函数通过将按钮的文本标签更改为我们随机分配给它的\
    \ Unicode 字符来显示按钮的符号。我们使用 `update_idletasks()` 告诉 Tkinter 立即显示这个符号。如果是第一轮，我们只需将按钮的坐标存储在变量中。如果是第二轮，我们需要检查玩家是否没有试图通过两次按下同一个按钮来作弊。如果没有，我们检查符号是否匹配。如果符号不匹配，我们通过将文本设置为空字符串来隐藏它们；如果匹配，我们让它们保持显示但禁用按钮。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_187_0.png)\n\n"
