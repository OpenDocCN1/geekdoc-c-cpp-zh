    \ x 更改之后将新值赋给 y。如果你在自己的程序中更新了一个变量的值，一定要检查是否需要更新其他变量。\n\n```python\n>>> x = 10\n\
    >>> y = x * 7\n>>> print(y)\n70\n```\n\n- 更新 y 的值。\n\n## 处理字符串\n\n程序员用“字符串”一词来表示由一系列字母或其他字符组成的任何数据。单词和句子都以字符串形式存储。几乎所有程序都会在某个时候用到字符串。你在键盘上能输入的每个字符，甚至不能输入的字符，都可以存储在字符串中。\n\
