    ### 专家提示 — 无所谓（Nothing really matters）\n\n程序员经常需要将变量设置为初始值 0，比如这个游戏中的分数。但如果变量保存的是字符串而不是数字，该怎么做呢？答案是使用一对中间没有任何内容的引号。同样，有些变量没有明显的默认值（如\
    \ 0 或空字符串），在这种情况下，你可以使用单词 `None`，就像我们下面所做的那样。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_174_0.png)\n\
    \n### 11. 设置变量\n\n你需要变量来跟踪程序运行过程中的各种状态，包括当前形状、上一个和当前颜色，以及两位玩家的得分。\n\n```python\n\
    random.shuffle(shapes)\n\nshape = None\nprevious_color = ''\ncurrent_color = ''\n\
    player1_score = 0\nplayer2_score = 0\n```\n\n`shape` 变量暂时没有值。\n\n颜色变量保存的是一个空字符串。\n\
    \n游戏开始时两位玩家都没有分数，因此两者的值都设置为 0。\n\n### 12. 添加延时\n\n现在添加一行代码，在第一个形状出现之前创建 3 秒的延时。这给了玩家时间找到\
    \ Tkinter 窗口，以防它被桌面上的其他窗口遮挡。你将在第 16 和 17 步中创建 `next_shape()` 函数。\n\n```python\n\
    player2_score = 0\n\nroot.after(3000, next_shape)\n```\n\n程序在显示下一个形状之前会等待 3,000\
    \ 毫秒，也就是 3 秒。\n\n### 13. 响应拍击\n\n接下来在代码中添加这两行。`bind()` 函数告诉图形用户界面（GUI）监听 `q` 或\
    \ `p` 键的按下，并在每次发生时调用 `snap()` 函数。你将在后面创建 `snap()` 函数。\n\n```python\nroot.after(3000,\
    \ next_shape)\nc.bind('q', snap)\nc.bind('p', snap)\n```\n\n### 14. 将按键事件发送到 GUI\n\
    \n`focus_set()` 函数让按键事件发送到画布。如果不调用这个函数，GUI 将不会对按下 `q` 和 `p` 键做出反应。在 `bind()` 函数调用下方输入这行代码。\n\
    \n```python\nc.focus_set()\n```\n\n### 15. 启动主循环\n\n在文件的末尾添加这一行。一旦我们添加了 `next_shape()`\
    \ 和 `snap()` 函数，主循环就会用下一个形状更新 GUI，并监听按键事件。\n\n```python\nroot.mainloop()\n```\n\
    \n### 专家提示 — 局部变量与全局变量\n\n变量可以是局部的，也可以是全局的。局部变量只存在于特定函数内部，这意味着程序的其他部分无法使用它。在主程序中、函数外部创建的变量称为全局变量，可以在代码的任何部分使用。但是，如果你想在函数中给全局变量赋一个新值，需要在函数中键入变量名之前添加关键字\
    \ `global`。这就是我们在第 16 步中所做的。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_175_0.png)\n\
    \n## 编写函数\n\n最后一个阶段是创建两个函数：一个用于显示下一个形状，另一个用于处理拍击。将它们输入到程序顶部，就在 import 语句下方。\n\n\
    ### 16. 创建函数\n\n`next_shape()` 函数一个接一个地显示彩色形状，就像发牌一样。开始定义函数时，输入下面的代码。它将你的一些变量标记为全局变量（见左侧方框），并更新\
    \ `previous_color`。\n\n使用 `global` 关键字可以确保对变量的修改在整个程序中生效。\n\n```python\ndef next_shape():\n\
    \    global shape\n    global previous_color\n    global current_color\n\n   \
    \ previous_color = current_color\n```\n\n这一行在下一个形状获得下一种颜色之前，将 `previous_color`\
    \ 设置为 `current_color`。\n\n### 17. 完成函数\n\n现在输入函数的其余部分。要显示一个新形状，我们需要将其状态从 `HIDDEN`\
    \ 改为 `NORMAL`。下面的代码使用 Canvas 的 `itemconfigure()` 函数来实现这一点。它还使用了另一个 Canvas 函数 `itemcget()`\
    \ 来更新 `current_color` 变量，该变量将用于检查是否发生了拍击。\n\n```python\nc.delete(shape)\nif len(shapes)\
    \ > 0:\n    shape = shapes.pop()\n    c.itemconfigure(shape, state=NORMAL)\n \
    \   current_color = c.itemcget(shape, 'fill')\n    root.after(1000, next_shape)\n\
    else:\n    c.unbind('q')\n    c.unbind('p')\n    if player1_score > player2_score:\n\
    \        c.create_text(200, 200, text='Winner: Player 1')\n    elif player2_score\
    \ > player1_score:\n        c.create_text(200, 200, text='Winner: Player 2')\n\
    \    else:\n        c.create_text(200, 200, text='Draw')\n    c.pack()\n```\n\n\
    删除当前形状，这样下一个形状就不会显示在它上面，并且它也不会再次被显示。\n\n如果还有剩余的形状，就取出下一个形状。\n\n将 `current_color`\
    \ 赋值为新形状的颜色。\n\n等待 1 秒后再显示下一个形状。\n\n这些行让程序在游戏结束后不再响应拍击。\n\n这段代码显示谁是赢家，或者宣布比赛平局。\n\
    \n### 专家提示 — 配置 Canvas 项目\n\n你可以使用 Canvas 的 `itemconfigure()` 函数来更改 Canvas 上显示的内容。例如，在这个游戏中，你使用\
    \ `itemconfigure()` 将形状从隐藏改为可见，但你也可以用它来更改其他特征。要使用 `itemconfigure()`，请将想要更改的项目的名称放在括号中，后面跟一个逗号，然后是特征及其新值。\n\
    \n```python\nc.itemconfigure(shape, state=NORMAL)\n```\n\n- 被更改的特征\n- 你想要更改的 Canvas\
    \ 项目的名称\n- 新值\n\n"
