  mdcn: "\n\n## Glossary\n\n- **ASCII** — “美国信息交换标准码”——一种用于将文本字符存储为二进制代码的编码。\n- **布尔表达式**\
    \ — 一种真或假的陈述，产生两种可能的结果。\n- **分支** — 程序中存在两个不同选项可供选择的点。\n- **程序错误** — 程序代码中的错误，使其行为出现意外。\n\
    - **调用** — 在程序中使用函数。\n- **注释** — 添加到程序中的文本说明，使代码更易于理解，程序运行时会被忽略。\n- **条件** — 程序中用于决策的“真或假”语句。另见*布尔表达式*。\n\
    - **常量** — 不能更改的固定值。\n- **坐标** — 一对精确定位某个位置的数字。通常写成 (x, y)。\n- **数据** — 信息，如文本、符号和数值。\n\
    - **字典** — 以成对形式存储的数据项集合，例如国家和它们的首都。\n- **调试** — 查找并纠正程序中的错误。\n- **加密** — 对数据进行编码的一种方法，使只有特定的人才能访问或读取。\n\
    - **事件** — 计算机程序可以响应的内容，例如按键或鼠标点击。\n- **文件** — 以名称存储的数据集合。\n- **标志变量** — 可以有两种状态的变量，例如真和假。\n\
    - **浮点数** — 含有小数点的数字。\n- **流程图** — 以一系列步骤和决策的形式展示程序的图表。\n- **函数** — 执行特定任务的代码，就像程序中的程序。也称为过程、子程序或子例程。\n\
    - **全局变量** — 在程序每个部分中都起作用的变量。另见*局部变量*。\n- **图形** — 屏幕上非文本的可视元素，例如图片、图标和符号。\n-\
    \ **GUI** — GUI，即图形用户界面，是构成程序中你可以看到并与之交互的按钮和窗口的名称。\n- **技巧（hack）** — 对代码的巧妙修改，使其实现新功能或简化代码。（也指未经许可访问计算机。）\n\
    - **黑客** — 入侵计算机系统的人。“白帽”黑客为计算机安全公司工作，寻找问题以便修复它们。“黑帽”黑客入侵计算机系统以造成损害或从中牟利。\n- **缩进**\
    \ — 当一块代码比前一块代码放置得更靠右时。缩进通常是四个空格。特定代码块中的每一行都必须缩进相同的量。\n- **索引编号** — 列表中某个项目的编号。在Python中，第一项的索引编号为0，第二项为1，依此类推。\n\
    - **输入** — 输入计算机的数据。键盘、鼠标和麦克风可用于输入数据。\n- **整数** — 一个整数。整数不包含小数点，也不写成小数。\n- **界面**\
    \ — 用户与软件或硬件交互的方式。参见GUI。\n- **库** — 可在其他项目中重复使用的函数集合。\n- **列表** — 按编号顺序存储的项目集合。\n\
    - **局部变量** — 仅在程序的有限部分（如函数）内起作用的变量。另见*全局变量*。\n- **循环** — 程序中重复自身的一部分，无需多次输入同一段代码。\n\
    - **模块** — 一个已编写好的代码包，可以导入Python程序，从而提供许多有用的函数。\n- **嵌套循环** — 另一个循环内部的循环。\n- **操作系统（OS）**\
    \ — 控制计算机上所有内容的程序，例如Windows、macOS或Linux。\n- **运算符** — 执行特定功能的符号：例如“+”（加法）或“−”（减法）。\n\
    - **输出** — 由计算机程序产生并由用户查看的数据。\n- **参数** — 赋予函数的值。参数的值在调用函数的代码中赋值。\n- **像素** —\
    \ 构成数字图像的微小点。\n- **程序** — 计算机为完成任务而执行的一组指令。\n- **编程语言** — 用于向计算机发出指令的语言。\n- **Python**\
    \ — 由吉多·范罗苏姆创建的流行编程语言，非常适合初学者学习。\n- **随机（random）** — 计算机程序中的一种函数，可产生不可预测的结果。在创建游戏时很有用。\n\
    - **递归** — 通过让函数调用自身来创建循环。\n- **返回值** — 函数被调用（运行）后传回的变量或数据。\n- **运行** — 使程序启动的命令。\n\
    - **软件** — 在计算机上运行并控制其工作方式的程序。\n- **语句** — 编程语言可以分解成的最小完整指令。\n- **字符串** — 一系列字符。字符串可以包含数字、字母或符号，例如冒号。\n\
    - **语法** — 决定代码必须如何编写才能正常运行的一组规则。\n- **切换** — 在两种不同的设置之间切换。\n- **元组** — 由逗号分隔并用括号括起来的项目列表。元组类似于列表，不同之处在于创建后不能更改它们。\n\
    - **海龟绘图** — 一个Python模块，允许你通过在屏幕上移动一个机器海龟来绘制形状。\n- **Unicode** — 计算机用来表示成千上万符号和文本字符的通用编码。\n\
    - **变量** — 程序中用于存储可变数据（如玩家得分）的位置。变量有名称和值。\n- **控件（widget）** — 执行特定功能的Tkinter GUI（图形用户界面）的一部分，例如按钮或菜单。\n\
