    \ or \"license()\" for more information.\n>>>\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_18_3.png)\n"
  mdcn: "\n## 人人都能编程\n\n要成为程序员，你只需学习一些基本规则和命令，然后就可以开始编写适合自己技能和兴趣的程序。例如，如果你喜欢科学，可以制作一个应用，根据实验结果绘制图表。或者，你可以运用自己的艺术技能，为自己的电子游戏设计一个外星世界。\n\
    \n### 逻辑思考\n\n程序员需要逻辑清晰、细致谨慎，才能编写出优秀的代码。如果指令不完全正确，或者步骤顺序错误，程序就无法正常运行。仔细思考每一个步骤，确保事情按逻辑顺序进行——毕竟，你不会先穿外套再穿毛衣，对吧！\n\
    \n### 注重细节\n\n如果你擅长找不同谜题，你很可能成为一名出色的程序员。编程的一项重要技能是发现代码中的错误。这些错误被称为程序错误（bug），即使是微小的错误也可能引发大问题。目光敏锐的程序员能找出拼写错误，以及指令逻辑或顺序上的问题。调试程序可能很棘手，但从错误中学习是提升编程能力的好方法。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_14_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_14_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_14_2.png)\n\n### 术语\n\n**程序错误（Bugs）**\
    \ — 程序错误是代码中的错误，会让程序以意料之外的方式运行。它们之所以被称为“bugs”，是因为早期计算机有时会因昆虫卡在电路里而出故障！\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_14_3.png)\n\
    \n### 开始编程\n\n编程听起来可能令人生畏，但学习如何编程其实很简单。秘诀就是直接动手。本书旨在通过引导你完成简单项目来教你如何编程。只需按照编号步骤操作，你很快就能创作游戏、应用和数字艺术。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_14_4.png)\n\n## 认识 Python\n\nPython\
    \ 是世界上最受欢迎的计算机编程语言之一。它最初于 20 世纪 90 年代发布，如今被用于构建数以百万计的应用、游戏和网站。\n\n### 为什么选择 Python？\n\
    \nPython 是入门计算机编程的绝佳语言。许多学校和大学用它来教授编程。以下是 Python 如此有用的一些原因。\n\n### 术语 — 为什么选择\
    \ Python？\n\nPython 并非以那种蛇命名。它实际上是以英国喜剧团体“蒙提·派森的飞行马戏团”命名的。Python 的创造者吉多·范罗苏姆是该团体的忠实粉丝，也很喜欢他们古怪的幽默。Python\
    \ 程序员经常在代码中使用该团体的笑话和名言，以此致敬。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_15_0.png)\n\
    \n- **易于阅读和编写** — Python 是一种基于文本的计算机编程语言。你使用英语单词、标点符号、符号和数字的组合来发出指令。这使得 Python\
    \ 代码易于阅读、编写和理解。\n- **自带电池** — 程序员说 Python“自带电池”。这是因为它自带立即开始编程所需的一切。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_15_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_15_2.png)\n\n- **处处可用** — Python 是可移植的。这意味着你可以在许多不同的计算机上编写和运行\
    \ Python 代码。相同的 Python 代码可在 PC、Mac、Linux 机器和树莓派计算机上运行。程序在每台机器上的行为都相同。\n- **便捷工具**\
    \ — Python 内置了许多有用的工具和预编程代码，你可以在自己的程序中使用。这被称为标准库。使用这些工具可以让你更轻松、更快速地构建自己的程序。\n\
    - **出色的支持** — Python 拥有编写良好的文档。它包含入门指南、用于查询含义的参考部分，以及大量示例代码。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_15_3.png)\n\
    \n## Python 的实际应用\n\nPython 不仅仅是教学工具。它是一款如此强大的程序，被用于商业、医学、科学和媒体领域许多有趣而激动人心的任务。它甚至可以用来控制家中的灯光和供暖。\n\
    \n### 专家提示\n\n**解释器** — 有些编程语言使用解释器。解释器是一种可以将一种编程语言翻译成另一种编程语言的程序。每次运行 Python 程序时，解释器都会把每一行\
    \ Python 代码翻译成计算机能够理解的特殊代码，即机器码。\n\n- **网络爬取** — Python 在互联网上被广泛使用。Google 搜索引擎的很大一部分是用\
    \ Python 编写的。YouTube 的很大一部分也是使用 Python 代码构建的。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_16_0.png)\n\
    \n- **重要业务** — Python 帮助银行追踪账户中的资金，也帮助大型连锁商店为所售商品定价。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_16_1.png)\n\
    \n- **医学奇迹** — Python 可用于为机器人编程，以执行高难度手术。用 Python 编程的机器人外科医生可以比人类外科医生工作得更快、更准确，也更不容易出错。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_16_2.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_16_3.png)\n\
    \n- **超越地球** — 软件工程师使用 Python 为 NASA 任务控制中心创建工具。这些工具帮助机组人员为每次任务做准备，并监控任务进展。\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_4.png)\n\n- **电影中的应用** — 迪士尼使用 Python\
    \ 自动化动画过程中重复性的部分。动画师不必一遍又一遍地执行相同步骤，而是使用 Python 程序自动重复这些步骤。这节省了工作量，缩短了制作电影所需的时间。\n\
    \n## 安装 Python\n\n本书中的所有项目都使用 Python 3，因此请务必从网站下载正确的版本。请按照与你的计算机相匹配的说明操作。\n\n\
    ### 在 Windows 上安装 Python\n\n在 Windows PC 上安装 Python 3 之前，请先确认它使用的是 32 位还是 64 位版本的\
    \ Windows。单击“开始”，右键单击“计算机”，然后左键单击“属性”。如果出现“系统”选项，请选择它。\n\n### IDLE\n\nIDLE（集成开发环境的缩写）是安装\
    \ Python 时附带的一款免费应用。IDLE 专为初学者设计，包含一个基本的文本编辑器，可让你编写和编辑 Python 代码。\n\n1. **访问 Python\
    \ 网站**\n\n   在网页浏览器中输入下面的地址，前往 Python 网站。然后点击“Downloads”打开下载页面。\n\n   `https://www.python.org/`\n\
    \n2. **下载 Python**\n\n   点击适用于 Windows 的最新 Python 版本，版本号以数字 3 开头。安装程序文件会自动下载。在不同安装程序选项中，选择可执行安装程序。\n\
    \n   - Python 3.6.0a4 - 2016-08-15\n   - Windows x86 可执行安装程序\n   - Windows x86-64\
    \ 可执行安装程序\n\n3. **运行安装程序**\n\n   双击安装程序文件以安装 Python。选择“为所有用户安装”，并在每个提示处点击“下一步”，不要更改默认设置。\n\
    \n   ![](img/6b18a113f7aa9338e32f3ac1fa217987_17_0.png)\n\n   点击安装程序。\n\n   如果你的\
    \ Windows 是 32 位版本，请使用此安装程序。\n\n   如果你的 Windows 是 64 位版本，请使用此安装程序。\n\n4. **打开\
    \ IDLE**\n\n   安装完成后，打开 IDLE 程序以检查是否安装成功。转到“开始”菜单，选择“所有应用”，然后选择 IDLE。应会打开一个类似下图的窗口。\n\
    \n   ![](img/6b18a113f7aa9338e32f3ac1fa217987_17_1.png)\n\n```text\nPython 3.6.0a4\
    \ Shell\nIDLE    File    Edit    Shell    Debug    Window    Help\nPython 3.6.0a4\
    \ (v3.6.0a4:017f260936, Aug 15 2016, 00:45:10) [MSC v.1900 32 bit (Intel)] on\
    \ win32\nType \"copyright\", \"credits\" or \"license()\" for more information.\n\
    >>>\n```\n\n### 在 Mac 上安装 Python\n\n在 Mac 上安装 Python 3 之前，请检查计算机使用的操作系统。点击屏幕左上角的\
    \ Apple 图标，然后从下拉菜单中选择“关于本机”。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_18_0.png)\n\
    \n1. **访问 Python 网站**\n\n   在网页浏览器中输入下面的地址，前往 Python 网站。然后点击“Downloads”打开下载页面。\n\
    \n   `https://www.python.org/`\n\n2. **下载 Python**\n\n   在下载选项中，点击与你的操作系统匹配的最新\
    \ Python 3 版本。Python.pkg 文件会自动下载到你的 Mac。\n\n   - Python 3.6.0a4 - 2016-08-15\n\
    \   - 下载 macOS X 64 位/32 位安装程序。\n\n   版本号可能与此不完全相同——只需确保下载以 3 开头的版本即可。\n\n3. **安装\
    \ Python**\n\n   你会在“下载”文件夹中找到 .pkg 文件。它的图标看起来像一个打开的包裹。双击以开始安装。在提示处点击“继续”，然后点击“安装”，以接受默认设置。\n\
    \n   ![](img/6b18a113f7aa9338e32f3ac1fa217987_18_1.png)\n\n   点击软件包以运行安装程序。\n\n\
    \   > **请求许可**\n   > 除非获得计算机所有者的许可，否则绝不要安装 Python 或任何其他程序。安装过程中，你可能还需要请所有者提供管理员密码。\n\
    \n4. **打开 IDLE**\n\n   安装完成后，打开 IDLE 程序以检查是否安装成功。打开“应用程序”文件夹，然后打开“Python”文件夹。双击“IDLE”，应会出现类似下图的窗口。\n\
    \n   ![](img/6b18a113f7aa9338e32f3ac1fa217987_18_2.png)\n\n```text\nPython 3.6.0a4\
    \ (v3.6.0a4:017c?..., Aug 15 2016, 13:38:16)\n[GCC 4.2.1 (Apple Inc. build 5666)\
    \ (dot 3) on darwin]\nType \"copyright\", \"credits\" or \"license()\" for more\
    \ information.\n>>>\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_18_3.png)\n\
    \n"
