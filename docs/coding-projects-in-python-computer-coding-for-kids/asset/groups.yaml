    \n```python\nguess = input('Which one of these is a fish?\\n \\\\\\nA) Whale\\\
    n B) Dolphin\\n C) Shark\\n D) Squid.\\n \\\\\\nType A, B, C, or D ')\ncheck_guess(guess,\
    \ 'C')\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_43_2.png)\n\n```text\n\
    Which one of these is a fish?\nA) Whale\nB) Dolphin\nC) Shark\nD) Squid\nType\
    \ A, B, C, or D\n```\n\n问题在 shell 窗口中的显示效果如下。\n\n```python\nwhile still_guessing\
    \ and attempt < 3:\n    if guess.lower() == answer.lower():\n        print('Correct\
    \ Answer')\n        score = score + 3 - attempt\n        still_guessing = False\n\
    \    else:\n        if attempt < 2:\n            score = score + 1\n```\n\n###\
    \ 尝试次数越少得分越高\n\n奖励用更少猜测次数答对的玩家。如果一次答对得 3 分，需要两次尝试得 2 分，使用全部三次机会得 1 分。对更新得分的行进行如下修改。现在它将给予\
    \ 3 分减去未成功尝试的次数。如果玩家第一次就答对，则加上 3 − 0 = 3 分；第二次猜对，则加上 3 − 1 = 2 分；第三次猜对，则加上 3 −\
    \ 2 = 1 分。\n\n这一行替换了之前的得分计算。\n\n### 制作判断题测验\n\n这段代码展示了如何创建是非题问题，这类问题只有两个可能的答案。\n\
    \n```python\nguess = input('Mice are mammals. True or False?')\ncheck_guess(guess,\
    \ 'True')\n```\n\n### 调整难度\n\n要让测验更难，就给玩家更少的答对机会。如果是判断题测验，你可能希望每个问题只有一次猜测机会；如果是选择题测验，也许每个问题不超过两次猜测机会。你能想出对于判断题或选择题，需要将高亮的数字改成什么吗？\n\
    \n```python\ndef check_guess(guess, answer):\n    global score\n    still_guessing\
    \ = True\n    attempt = 0\n    while still_guessing and attempt < 3:\n       \
    \ if guess.lower() == answer.lower():\n            print('Correct Answer')\n \
    \           score = score + 1\n            still_guessing = False\n        else:\n\
    \            if attempt < 2:\n                guess = input('Sorry wrong answer.\
    \ Try again. ')\n                attempt = attempt + 1\n            if attempt\
    \ == 3:\n                print('The correct answer is ' + answer)\n```\n\n更改此数字。\n\
    \n更改此数字。\n\n更改此数字。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_44_0.png)\n\n###\
    \ 选择其他主题\n\n创建一个不同主题的测验，例如常识、体育、电影或音乐。你甚至可以制作一个关于家人或朋友的测验，并加入一些调皮的问题，比如“谁的笑声最烦人？”\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_44_1.png)\n\n## 函数\n\n程序员喜欢能让编写代码更简单的捷径。最常见的捷径之一是为具有特别有用功能的代码块命名。这样，每次需要时就不必键入整个代码块，只需键入它的名称即可。这些命名的代码块称为函数。\n\
    \n### 如何使用函数\n\n使用函数也称为“调用”函数。要调用函数，只需键入函数名，后跟一组括号，括号内包含你想要函数处理的任何参数。参数有点像属于函数的变量，它们允许你在程序的不同部分之间传递数据。当函数不需要任何参数时，括号留空。\n\
    \n### 行话\n\n### 函数术语\n\n- **调用** 使用函数。\n- **定义** 当你使用 `def` 关键字并编写函数代码时，程序员称之为“定义”函数。你首次设置变量值也是在定义变量。\n\
    - **参数** 你提供给函数使用的一条数据（信息）。\n- **返回值** 你从函数传递回主代码的数据。使用关键字 `return` 获得它。\n\n###\
    \ 内置函数\n\nPython 有许多可以在代码中使用的内置函数。这些是有用的工具，可以让你完成许多任务，从输入信息和在屏幕上显示消息，到将一种数据类型转换为另一种。你已经使用过一些\
    \ Python 的内置函数，例如 `print()` 和 `input()`。看看这些示例。为什么不在 shell 中试一试呢？\n\n```python\n\
    >>> name = input('What is your name?')\nWhat is your name? Sara\n>>> greeting\
    \ = 'Hello ' + name\n>>> print(greeting)\nHello Sara\n```\n\n这会让用户输入他们的姓名。\n\n\
    这会在屏幕上显示变量 greeting 的内容。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_45_0.png)\n\
    \n### ⚠ `input()` 和 `print()`\n\n这两个函数就像一对相反的操作。`input()` 函数允许用户通过输入向程序提供指令或数据。`print()`\
    \ 函数通过在屏幕上显示消息或结果来向用户发送输出。\n\n"
