    \ This code tells the function to use the player’s guess as the first parameter\
    \ and the phrase “polar bear” as the second parameter.\n\n```python\nguess1 =\
    \ input('Which bear lives at the North Pole? ')\ncheck_guess(guess1, 'polar bear')\n\
