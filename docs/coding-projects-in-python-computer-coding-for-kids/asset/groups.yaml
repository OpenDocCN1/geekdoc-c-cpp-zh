    # # Snap


    Challenge your friends to a game of digital snap. This fast-paced, two-player
    game requires a sharp eye and lightning-fast reactions. It works just like the
    card game but uses colored shapes that appear on the screen rather than cards
    that are dealt.


    # ## What happens


    Different shapes appear on the screen at random in either black, red, green, or
    blue. If a color appears twice in succession, hit the snap key. Player 1 presses
    the “q” key to snap and player 2 the “p” key. Each correct snap scores a point.
    Snap at the wrong time and you lose a point. The player with the highest score
