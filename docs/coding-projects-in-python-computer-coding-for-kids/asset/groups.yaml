  mdcn: "\n## 循环中的循环\n\n循环体内部还能再有一个循环吗？可以！这称为嵌套循环。它就像俄罗斯套娃，每个娃娃都装在更大的娃娃里面。在嵌套循环中，内层循环在外层循环内部运行。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_36_0.png)\n\n> 就像俄罗斯套娃——不过它们总是那么自命不凡！\n\
    \n### 专家提示\n\n**缩进循环体**\n\n循环体中的代码应缩进四个空格。如果没有缩进，Python 会显示错误信息，代码将无法运行。对于嵌套循环（一个循环套在另一个循环中），内层循环的循环体必须再额外缩进四个空格。Python\
    \ 会自动缩进循环中的新行，但你始终应检查每一行是否缩进了正确的空格数。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_36_1.png)\n\
    \n### 一个循环套另一个循环\n\n在这个示例中，Emma 把她的“Keep Out”程序改成了一个“Three Cheers”程序，会打印三次“Hip,\
    \ Hip Hooray!”。因为每次欢呼都包含两次“Hip”，所以她使用嵌套循环来打印它。\n\n```python\n>>> for hooray_counter\
    \ in range(1, 4):\n...     for hip_counter in range(1, 3):\n...         print('Hip')\n\
    ...         print('Hooray!')\n```\n\n外层循环的循环变量是 hooray_counter。\n\n内层循环的循环变量是\
    \ hip_counter。\n\n外层循环的循环体缩进了 4 个空格。\n\n内层循环的循环体又额外缩进了 4 个空格。\n\n```text\nhooray_counter\
    \ = 1\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhooray_counter\
    \ = 2\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhooray_counter\
    \ = 3\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n```\n\n### 工作原理\n\
    \n整个内层 for 循环都位于外层 for 循环的循环体内部。外层循环每重复一次，内层循环就要重复两次。这意味着外层循环的循环体总共运行三次，而内层循环的循环体运行六次。\n\
    \n## 动物问答\n\n你喜欢问答游戏吗？想自己做一个吗？在这个项目中，你将制作一个动物问答游戏。尽管问题都是关于动物的，但这个项目可以很容易地改成关于任何其他主题。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_37_0.png)\n\n我以为我是最大的动物。\n\n这是游戏的样子——一切都发生在\
