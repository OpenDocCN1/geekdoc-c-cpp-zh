    ```\n```\n\nCondition\n\nThis branch is taken if the condition is True.\n\nThe\
    \ code shows this message in the shell window.\n\n# ▷ **Two branches**\n\nDo you\
    \ want a program to do one thing if a condition’s True and another thing if it’s\
    \ False? If so, you need a command with two branches, called an **if-else** statement.\
    \ This program asks if the user has tentacles. If they answer “Yes”, it decides\
    \ they must be an octopus! If they answer “No”, it decides they’re human. Each\
    \ decision prints a different message.\n\n```\n```python\ntentacles = input('Do\
