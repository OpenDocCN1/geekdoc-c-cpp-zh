    # ## Type errors


    A type error isn’t a typing error—it means your code has mixed up one type of
    data with another, such as confusing numbers with strings. It’s like trying to
    bake a cake in your refrigerator—it won’t work, because the refrigerator isn’t
    meant for baking! If you ask Python to do something impossible, don’t be surprised
    if it won’t cooperate!


    ```

    ```python

    budget = ''Fifty'' * ''Five''

    ```

    ```


    You can multiply two numbers in Python, but you can’t do multiplication with strings.


    ```

    ```python

    hot_day = ''20 degrees'' > 15

    ```

    ```


    Python can’t check to see if a string is greater than a number, because they are
    different data types.


    ```

    ```python

    list = [''a'', ''b'', ''c'']

    find_biggest_number(list)

    ```

    ```


    This function is expecting you to give it a list of numbers, but you’ve given
    it a list of letters instead!


    # ### Examples of type errors


    Type errors occur when you ask Python to do something that doesn’t make sense
    to it, such as multiplying with strings, comparing two completely different types
    of data, or telling it to find a number in a list of letters.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_1.png)


    # ## Name errors


    A name error message appears if your code uses the name of a variable or function
    that hasn’t yet been created. To avoid this, always define your variables and
    functions before you write code to use them. It’s good practice to define all
    your functions at the top of your program.


    # ▷ Name errors


    A name error in this code stops Python from displaying the message “I live in
    Moscow”. You need to create the variable `hometown` first, before you use the
    `print()` function.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_2.png)


    The `print()` instruction needs to come after the variable.


    ```

    ```python

    print(''I live in '' + hometown)

    hometown = ''Moscow''

    ```

    ```'
