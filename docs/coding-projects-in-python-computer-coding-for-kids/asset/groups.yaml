    \ in the shell window.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_24_1.png)\n\
    \n```\n```text\n>>> \nHello, World!\n>>>\n```\n```\n\nThe message will appear\
    \ in the shell.\n\n# ### 6. Fix mistakes\n\nIf the code isn’t working, stay calm!\
    \ Every programmer makes mistakes, and finding these “bugs” is vital if you want\
