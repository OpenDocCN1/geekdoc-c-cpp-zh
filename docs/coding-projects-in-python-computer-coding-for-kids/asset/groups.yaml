    \n### △ 工作原理\n\nelif 语句必须始终位于 if 之后、else 之前。在这段代码中，只有当 if 语句设置的条件为 False 时，elif\
    \ 才会检查是否为雪天。你可以插入更多 elif 语句来检查更多天气类型。\n\n## 循环\n\n计算机非常擅长毫无怨言地完成枯燥任务。程序员可不擅长，但他们很擅长让计算机替自己完成重复性工作——通过使用循环。循环会一遍又一遍地运行同一个代码块。循环有几种不同类型。\n\
    \n### for 循环\n\n当你知道要运行某个代码块多少次时，可以使用 for 循环。在这个示例中，艾玛编写了一个程序，为她的房门制作标牌。它会将“Emma's\
    \ Room—Keep Out!!!”（艾玛的房间——请勿入内！！！）打印十次。在 shell 中亲自试一试你的代码。（输入代码并按回车/返回后，按退格键删除缩进，然后再次按回车/返回。）\n\
    \n这是循环变量。\n\n循环运行 10 次。\n\n```python\n>>> for counter in range(1, 11):\n    print('Emma\\\
