    \ incorrectly, you get another go.\n\nAfter three wrong guesses, the program shows\
    \ you the correct answer.\n\nThis is your score out of a possible 3 points.\n\n\
    ### How it works\n\nThis project makes use of a function—a block of code with\
    \ a name that performs a specific task. A function lets you use the same code\
    \ repeatedly, without having to type it all in every time. Python has lots of\
