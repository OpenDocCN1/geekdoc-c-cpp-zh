    \ software or hardware. See GUI.\n- **library** — A collection of functions that\
    \ can be reused in other projects.\n- **list** — A collection of items stored\
    \ in numbered order.\n- **local variable** — A variable that works only within\
    \ a limited part of a program, such as a function. See also *global variable*.\n\
    - **loop** — A part of a program that repeats itself, removing the need to type\
    \ out the same piece of code multiple times.\n- **module** — A package of already\
    \ written code that can be imported into a Python program, making lots of useful\
    \ functions available.\n- **nested loop** — A loop inside another loop.\n- **operating\
    \ system (OS)** — The program that controls everything on a computer, such as\
    \ Windows, macOS, or Linux.\n- **operator** — A symbol that performs a specific\
    \ function: for example, “+” (addition) or “−” (subtraction).\n- **output** —\
    \ Data that is produced by a computer program and viewed by the user.\n- **parameter**\
    \ — A value given to a function. The value of a parameter is assigned in the code\
    \ that calls the function.\n- **pixels** — Tiny dots that make up a digital image.\n\
    - **program** — A set of instructions that a computer follows in order to complete\
    \ a task.\n- **programming language** — A language that is used to give instructions\
    \ to a computer.\n- **Python** — A popular programming language created by Guido\
    \ van Rossum. It is a great language for beginners to learn.\n- **random** — A\
    \ function in a computer program that allows unpredictable outcomes. Useful when\
    \ creating games.\n- **recursion** — Creating a loop by telling a function to\
    \ call itself.\n- **return value** — The variable or data that is passed back\
    \ after a function has been called (run).\n- **run** — The command to make a program\
    \ start.\n- **software** — Programs that run on a computer and control how it\
    \ works.\n- **statement** — The smallest complete instruction a programming language\
    \ can be broken down into.\n- **string** — A series of characters. Strings can\
    \ contain numbers, letters, or symbols, such as a colon.\n- **syntax** — The rules\
    \ that determine how code must be written in order for it to work properly.\n\
    - **toggle** — To switch between two different settings.\n- **tuple** — A list\
    \ of items separated by commas and surrounded by brackets. Tuples are similar\
    \ to lists, except you can’t change them after they’ve been created.\n- **turtle\
    \ graphics** — A Python module that lets you draw shapes by moving a robotic turtle\
    \ across the screen.\n- **Unicode** — A universal code used by computers to represent\
    \ thousands of symbols and text characters.\n- **variable** — A place to store\
    \ data that can change in a program, such as the player’s score. A variable has\
    \ a name and a value.\n- **widget** — A part of a Tkinter GUI (graphical user\
    \ interface) that performs a specific function, such as a button or menu.\n\n\
