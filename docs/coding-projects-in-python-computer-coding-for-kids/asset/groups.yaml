  mdcn: "\n\n## 工作原理\n\n该程序会重新排列消息中字母的顺序，使其无法被理解。它通过判断哪些字母位于偶数位置或奇数位置来实现这一点。然后，它交换消息中每一对字母的位置，从开头两个字母开始，接着是接下来两个，依此类推。该程序还能通过把字母换回它们最初的位置，让加密后的消息重新变得可读。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_0.png)\n\n> 我把所有字母都弄乱了。\n\n在 Python\
    \ 中（它以一种奇怪的方式计数，从 0 开始），单词的第一个字母位于偶数位置。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_1.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_2.png)\n\n△ **加密**\n\n当你对消息运行代码时，程序会交换每一对字母，使含义变得混乱。\n\
    \n△ **解密**\n\n当你或朋友解密消息时，程序会把字母换回原来的位置。\n\n### 消息解密器\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_3.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_4.png)\n\n> 我会把这条消息交给解密器来还原它！\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_132_5.png)\n\n> 现在它完全说得通了。多么巧妙的机器！\n\
    \n## 秘密消息流程图\n\n该程序使用一个无限循环，询问用户是要加密还是解密。用户的选择决定程序随后走哪条路径。对话框从用户那里获取文本，而信息框向他们显示加密和解密后的消息。如果用户输入除“encrypt”或“decrypt”以外的任何内容，程序就会结束。\n\
    \n- 开始\n- 用户选择要做什么：“encrypt、decrypt，还是其他任何内容？”\n- 加密\n  - 获取要加密的秘密消息\n  - 加密消息\n\
    \  - 显示加密后的消息\n- 解密\n  - 获取要解密的秘密消息\n  - 解密消息\n  - 显示解密后的消息\n- 用户输入除“encrypt”或“decrypt”以外的任何内容\n\
    - 结束\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_133_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_133_1.png)\n\
    \n## 神秘 x\n\n程序需要消息具有偶数个字符。它会检查消息并统计字符数。如果字符数是奇数，它就在末尾添加一个 x，使其变为偶数。你和你的秘密特工同伴会知道忽略这个\
    \ x，所以你们不会上当！\n\n秘密消息的明文是：\n\n```\ncome to my party saturday afternoonx\n```\n\
    \n确定\n\n## 制作 GUI\n\n你将分两部分编写代码。首先设置一些从用户那里获取输入的函数，然后编写执行加密和解密的代码。现在开始吧——你永远不知道自己什么时候可能需要给某人发送秘密消息！\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_134_0.png)\n\n### 1. 创建一个新文件\n\n打开\
    \ IDLE 并创建一个新文件。\n将其保存为“secret_messages.py”。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_134_1.png)\n\
    \n### 2. 添加模块\n\n你需要从 Python 的 Tkinter 模块中导入一些控件。这样你就能使用它的一些 GUI 功能，例如用 messagebox\
    \ 向用户显示信息，用 simpledialog 向他们提问。在你的文件顶部输入这一行。\n\n```python\nfrom tkinter import\
    \ messagebox, simpledialog, Tk\n```\n\n### 3. 加密还是解密？\n\n现在创建一个函数 get_task()，打开一个对话框，询问用户是要加密还是解密消息。将函数添加到你在第\
    \ 2 步添加的代码下方。\n\n```python\ndef get_task():\n    task = simpledialog.askstring('Task',\
    \ 'Do you want to encrypt or decrypt?')\n    return task\n```\n\n这一行要求用户输入“encrypt”或“decrypt”，然后把他们的回答保存在变量\
    \ task 中。\n\n将 task 中的值返回给使用此函数的代码。\n\n这个词将作为标题显示在对话框中。\n\n### 4. 获取消息\n\n创建一个新函数\
    \ get_message()，打开一个对话框，要求用户输入他们想要加密或解密的消息。将函数添加到你在第 3 步添加的代码下方。\n\n```python\n\
    def get_message():\n    message = simpledialog.askstring('Message', 'Enter the\
    \ secret message: ')\n    return message\n```\n\n这一行要求用户输入消息，然后将其保存在变量 message\
    \ 中。\n\n将 message 中的值返回给使用此函数的代码。\n\n### 5. 启动 Tkinter\n\n这个命令会启动 Tkinter 并创建一个\
    \ Tkinter 窗口。将其输入到你在第 4 步创建的函数下方。\n\n```python\nroot = Tk()\n```\n\n如果你觉得 Tkinter\
    \ 窗口会分散注意力，请添加你在“请教专家”中用过的 root.withdraw 行。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_0.png)\n\
    \n### 6. 启动循环\n\n现在你已经创建了界面函数，添加这个无限 while 循环，以正确的顺序调用（运行）它们。将这段代码插入到你在第 5 步输入的命令下方。\n\
    \n```python\nwhile True:\n    task = get_task()\n    if task == 'encrypt':\n \
    \       message = get_message()\n        messagebox.showinfo('Message to encrypt\
    \ is:', message)\n    elif task == 'decrypt':\n        message = get_message()\n\
    \        messagebox.showinfo('Message to decrypt is:', message)\n    else:\n \
    \       break\nroot.mainloop()\n```\n\n- 查明用户想要做什么。\n- 获取要加密的秘密消息。\n- 在信息框中显示该消息。\n\
    - 获取要解密的秘密消息。\n- 在信息框中显示该消息。\n- 如果用户没有输入“encrypt”或“decrypt”，就停止循环。\n- 让 Tkinter\
    \ 保持运行。\n- 输入你想做的事情。\n\n### 7. 测试代码\n\n试着运行代码。它首先会显示一个输入框，询问你是要加密还是解密。然后会出现另一个输入框，供你输入秘密消息。最后，它会在信息框中显示加密或解密后的消息。如果有问题，请仔细检查你的代码。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_1.png)\n\n如果看不到输入框，请查看代码窗口和 shell\
    \ 窗口后面。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_2.png)\n\n输入秘密消息。\n\n\
    避免使用大写字母，这样更难猜出加密后的消息。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_3.png)\n\
    \n单击“确定”之前，请检查消息是否正确。\n\n## 打乱消息！\n\n现在你的界面已经能正常工作了，是时候编写代码来加密并随后解密你的秘密消息了。\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_136_0.png)\n\n### 8. 它是偶数吗？\n\n你需要创建一个函数，告诉程序你的消息中字符数是否为偶数。该函数将使用取模运算符（%）检查数字能否被\
    \ 2 整除且没有余数。如果可以（True），那么这个数字就是偶数。将函数添加到你在第 2 步输入的代码下方。\n\n```python\ndef is_even(number):\n\
    \    return number % 2 == 0\n```\n\n如果数字是偶数，这将为 True。\n\n将 True 或 False 值返回给代码。\n\
    \n### 专家提示\n\n#### 取模运算符（%）\n\n如果将取模运算符（%）放在两个数字之间，Python 会告诉你第一个数字除以第二个数字后的余数。所以\
    \ 4 % 2 是 0，但 5 % 2 是 1，因为 5 除以 2 会剩下 1。如果想试一试，可以在 shell 中输入这些例子。\n\n### 9. 获取偶数位置的字母\n\
    \n在这一步中，你将创建一个函数，它接收一条消息，并生成一个包含所有偶数位置字母的列表。该函数使用一个 for 循环，其范围从 0 到 len(message)，以便检查字符串中的所有字母。将函数添加到第\
    \ 8 步的代码下方。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_1.png)\n\n```python\n\
    def get_even_letters(message):\n    even_letters = []\n    for counter in range(0,\
    \ len(message)):\n        if is_even(counter):\n            even_letters.append(message[counter])\n\
    \    return even_letters\n```\n\n- 创建一个列表变量来存储偶数位置的字母。\n- 遍历消息中的每个字母。\n- 如果这是位于偶数位置的字母，Python\
    \ 会把它添加到字母列表中。\n- 将字母列表返回给调用此函数的代码。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_2.png)\n\
    \n别忘了保存你的工作。\n\n"
