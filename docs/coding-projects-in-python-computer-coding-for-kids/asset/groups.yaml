  md: "\n## Loops inside loops\n\nCan the body of a loop have another loop within\
    \ it? Yes! This is called a nested loop. It’s like Russian dolls, where each doll\
    \ fits inside a larger doll. In a nested loop, an inner loop runs inside an outer\
    \ loop.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_36_0.png)\n\n> Like Russian\
    \ dolls—but they’re always so full of themselves!\n\n### EXPERT TIPS\n\n**Indent\
    \ the body**\n\nThe code in the body of a loop should be indented four spaces.\
    \ If it isn’t, Python will show an error message and the code won’t run. With\
    \ nested loops (one loop inside another), the body of the inner loop must be indented\
    \ an extra four spaces. Python automatically indents new lines in loops, but you\
    \ should always check that each line is indented by the correct number of spaces.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_36_1.png)\n\n### One loop inside another\n\
    \nIn this example, Emma has changed her “Keep Out” program into a “Three Cheers”\
    \ program that prints “Hip, Hip Hooray!” three times. Because each cheer includes\
    \ the word “Hip” twice, she uses a nested loop to print it.\n\n```python\n>>>\
    \ for hooray_counter in range(1, 4):\n...     for hip_counter in range(1, 3):\n\
    ...         print('Hip')\n...         print('Hooray!')\n```\n\nThe loop variable\
    \ of the outer loop is hooray_counter.\n\nThe loop variable of the inner loop\
    \ is hip_counter.\n\nThe body of the outer loop is indented 4 spaces.\n\nThe body\
    \ of the inner loop is indented another 4 spaces.\n\n```text\nhooray_counter =\
    \ 1\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhooray_counter\
    \ = 2\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n\nhooray_counter\
    \ = 3\n\nHip\nHip\nHooray!\n\nhip_counter = 1\nhip_counter = 2\n```\n\n### How\
    \ it works\n\nThe whole of the inner for loop is inside the body of the outer\
    \ for loop. Each time we do one repeat of the outer loop, we have to do two repeats\
    \ of the inner loop. This means the body of the outer loop is run three times\
    \ in total, but the body of the inner loop is run six times.\n\n## Animal Quiz\n\
    \nAre you a fan of quizzes? Would you like to make one yourself? In this project,\
    \ you'll build an animal quiz. Even though the questions are about animals, this\
    \ project can be easily modified to be about any other topic.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_37_0.png)\n\
