    \n### 循环变量\n\n循环变量记录到目前为止我们已经绕循环了多少次。第一轮时，它等于 range(1, 11) 所指定列表中的第一个数字。第二轮时，它等于列表中的第二个数字，依此类推。当列表中的所有数字都用完后，我们就停止循环。\n\
    \n| 第一轮循环 | 第二轮循环 | 第三轮循环 |\n|---|---|---|\n| ![](img/6b18a113f7aa9338e32f3ac1fa217987_33_1.png)\
    \ |  |  |\n| 循环变量 = 1 | 循环变量 = 2 | 循环变量 = 3 |\n\n### 专家提示：Range\n\n在 Python 代码中，单词“range”后跟括号内的两个数字，表示“从第一个数字到比第二个数字小\
