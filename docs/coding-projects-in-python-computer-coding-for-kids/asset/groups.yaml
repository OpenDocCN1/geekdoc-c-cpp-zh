    # # How it works


    This project uses Tkinter to create the shapes. Tkinter''s mainloop() function
    schedules a function that you''ll create to show the next shape. The random module''s
    shuffle() function makes sure the shapes appear in a different order. The “q”
    and “p” keys are bound (linked) to a snap() function, so that each time one of
    these keys is pressed, it updates the relevant player''s score.


    # ▷ Snap flowchart


    The program runs for as long as there are still shapes left to be revealed. It
    reacts to the key presses of the players when they think they see a snap. When
    there are no more shapes left, the winner is declared and the game ends.


    # EXPERT TIPS

    ## Sleep


    Computers work a lot faster than you can. Sometimes this causes problems. If you
    tell a computer to show a shape to the user and then hide it again, without a
    break, the computer does it so quickly that the person won''t see the shape. To
    fix this, Snap uses the time module''s sleep() function, which pauses a program
    for a set number of seconds: time.sleep(1), for example, puts the program to sleep
    for 1 second before it runs the next line of code.


