    # Countdown Calendar


    When you’re looking forward to an exciting event, it helps to know how much longer
    you have to wait. In this project, you’ll use Python’s Tkinter module to build
    a handy program that counts down to the big day.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_111_0.png)


    > > Hooray! It''s 0 days until my birthday!


    # What happens


    When you run the program it shows a list of future events and tells you how many
    days there are until each one. Run it again the next day and you’ll see that it
    has subtracted one day from each of the “days until” figures. Fill it with the
    dates of your forthcoming adventures and you’ll never miss an important day—or
    a homework deadline—again!


    Give your calendar a personalized title.


    ```

    ```

    My Countdown Calendar


    It is 20 days until Halloween

    It is 51 days until Spanish Test

    It is 132 days until School Trip

    It is 92 days until My Birthday

    ```

    ```


    A small window pops up when you run the program, with each event on a separate
    line.'
