    # # Kaleido-spiral


    In the same way that simple lines of code can form a good program, simple shapes
    can form a complex picture. By combining shapes and colors through code, Kaleido-spiral
    will help you create a masterpiece of digital art that’s worthy of an art gallery!


    # ## What happens


    Python’s turtle draws circles on the screen, one after another. Each time a circle
    is drawn, the turtle changes the position, angle, color, and size of the next
    circle it draws. A pattern gradually emerges.


