  - "[PAGE 187]\n\n# ## Show the symbol\n\nFinally, you need to create the function\
    \ that handles the button presses. This function will always display a symbol,\
    \ but how it operates depends on whether it’s the first or second turn in the\
    \ matching attempt. If it’s the first turn, the function just needs to remember\
    \ which button was pressed. If it’s the second turn, it needs to check if the\
    \ symbols match. Symbols that don’t match are hidden. Matching symbols are left\
    \ showing and their buttons are disabled.\n\n```\n~~~python\nfrom tkinter import\
    \ Tk, Button, DISABLED\n\n# The x and y values tell the function which button\
    \ has been pressed.\ndef show_symbol(x, y):\n    # These lines tell the program\
    \ that the variables are global\n    global first\n    global previousX, previousY\n\
    \    # These lines show the symbol.\n    buttons[x, y]['text'] = button_symbols[x,\
    \ y]\n    buttons[x, y].update_idletasks()\n\n    if first:\n        # If it's\
    \ the first turn, the code remembers the button press by storing\n        # the\
    \ x and y coordinates.\n        previousX = x\n        previousY = y\n       \
    \ first = False\n    # Second turn. This line includes a check to stop the player\
    \ cheating by\n    # pressing every button twice!\n    elif previousX != x or\
    \ previousY != y:\n        # If the symbols don't match...\n        if buttons[previousX,\
    \ previousY]['text'] != buttons[x, y]['text']:\n            # Wait 0.5 seconds\
    \ to give the player time to see the symbols,\n            # then hide them.\n\
    \            time.sleep(0.5)\n            buttons[previousX, previousY]['text']\
    \ = ''\n            buttons[x, y]['text'] = ''\n        else:\n            # If\
    \ the symbols match...\n            # Disable the pair of matching buttons so\
    \ the player can't press them again.\n            buttons[previousX, previousY]['command']\
    \ = DISABLED\n            buttons[x, y]['command'] = DISABLED\n            # This\
    \ line gets the function ready for the first button press of the next attempt.\n\
    \            first = True\n~~~\n```\n\n# ## How it works\n\nThe function shows\
    \ a button’s symbol by changing its text label to the Unicode character we randomly\
    \ assigned to it. We use update_idletasks() to tell Tkinter to show this symbol\
    \ right now. If it’s the first turn, we just store the button’s coordinates in\
    \ variables. If it’s the second turn, we need to check that the player isn’t trying\
    \ to cheat by hitting the same button twice. If they aren’t, we check if the symbols\
    \ match. If the symbols don’t match, we hide them by setting the text to empty\
    \ strings; if they do match, we leave them showing but disable the buttons.\n\n\
