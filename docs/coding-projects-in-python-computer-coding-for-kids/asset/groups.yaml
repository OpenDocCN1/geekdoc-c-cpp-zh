    \n### 更改面部表情\n\n你可以通过重新排列机器人面部的各个特征来改变它的表情。要让它有歪歪扭扭的眼睛和嘴巴，请使用右侧的代码。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_80_2.png)\n\
    \n```python\n# eyes\nt.goto(-60, 160)\nrectangle(30, 10, 'white')\nt.goto(-60,\
