    ### What is coding?


    Computer programmers, or “coders,” are people who write step-by-step instructions
    that can make a computer perform a task. Coders can get computers to do addition,
    make music, move a robot across a room, or fly a rocket to Mars.


    ### Dumb boxes


    A computer can’t do anything of its own accord—it just sits there like a dumb
    box until it’s told exactly what to do. Because computers can’t think for themselves
    and can only do as they’re told, coders have to do the thinking for them and write
    their instructions carefully.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_0.png)


    ### △ Performing pet


    By learning how to code, you’ll be able to write your own programs and make the
    computer do what you want. It’s a bit like having an electronic pet that you can
    teach to perform tricks!


    ### Programming languages


    In order to tell a computer what to do, you need to learn a programming language.
    Visual languages are easy for beginners to learn, while professional coders use
    text-based languages. This book is based on the popular text-based language Python.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_1.png)


    ### ▽ Scratch


    Scratch is a visual programming language. It’s great for creating games, animations,
    and interactive stories. You write code in Scratch by snapping together blocks
    of instructions.


    ### ▽ Python


    Python is a text-based programming language. In Python, programmers write code
    using words, abbreviations, numbers, and symbols. Instructions are typed in using
    the computer’s keyboard.


