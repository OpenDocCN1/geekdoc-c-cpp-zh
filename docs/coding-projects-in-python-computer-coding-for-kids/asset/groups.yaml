    \ ▷ 多分支\n\n当可能的路径超过两条时，**elif** 语句（“else-if”的缩写）就派上用场了。这个程序要求用户输入天气预报：可以是“rain”（雨）、“snow”（雪）或“sun”（晴）。然后它会选择三个分支之一以及相应的天气条件。\n\
    \n```python\nweather = input('What is the forecast for today? (rain/snow/sun)')\n\
    \nif weather == 'rain':\n    print('Remember your umbrella!')\nelif weather ==\
