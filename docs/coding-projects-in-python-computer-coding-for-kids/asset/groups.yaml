    \ NORMAL 显示它——否则游戏一开始，所有形状都会出现在屏幕上。\n\n```python\nimport random\n\nimport time\n\
    \nfrom tkinter import Tk, Canvas, HIDDEN, NORMAL\n```\n\n你将使用 random 模块来打乱形状。\n\
    \n使用 Tkinter 创建 GUI。\n\n- **3. 设置 GUI**\n\n现在输入这里显示的代码，创建一个标题为“Snap”的 Tkinter\
