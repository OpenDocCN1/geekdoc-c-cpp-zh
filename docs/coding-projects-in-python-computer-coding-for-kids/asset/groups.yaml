    \ work. The editor window can be used to write and save programs, while the shell\
    \ window runs Python instructions immediately.\n\n# ## The shell window\n\nWhen\
    \ you open IDLE, the shell window pops up. This is the best place to get started\
    \ in Python because you don’t have to create a new file first. Just type the code\
    \ directly into the shell window.\n\n# ### Working in the shell\n\nThe code you\
    \ type can be run straight away, and any messages or “bugs” (errors) are displayed.\
    \ You can use the shell window like a notepad, to test out snippets of code before\
    \ you add them into a bigger program.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_19_0.png)\n\
    \nThis line shows which version of Python you have.\n\nYou type the code in at\
