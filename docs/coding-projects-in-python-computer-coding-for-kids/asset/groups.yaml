    \ will be turned into what looks like total gibberish. But if you choose to reveal\
    \ a message, nonsense will be turned into text you can read!\n\n### Cryptography\n\
    \nThe word cryptography comes from the ancient Greek words for \"hidden\" and\
    \ \"writing.\" People have been using this technique to send secret messages for\
    \ nearly 4,000 years. Here are some special terms used in cryptography—\n\n####\
    \ LINGO\n\n- **Cipher:** a set of instructions for altering a message to hide\
    \ its meaning.\n- **Encrypt:** to hide the secret message.\n- **Decrypt:** to\
