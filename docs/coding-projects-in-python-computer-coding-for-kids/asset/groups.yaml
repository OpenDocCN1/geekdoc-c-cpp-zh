  - "[PAGE 137]\n\n# 10  Get the odd letters\n\nNext you need to create a similar\
    \ function to produce a list of all the odd-numbered letters in your message.\
    \ Put this function under the code in Step 9.\n\n```\ndef get_odd_letters(message):\n\
    \    odd_letters = []\n    for counter in range(0, len(message)):\n        if\
    \ not is_even(counter):\n            odd_letters.append(message[counter])\n  \
    \  return odd_letters\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_137_0.png)\n\
    \n# Remember: Lists and length\n\nPython counts from 0 in lists and strings, and\
    \ uses the function len() to find the length of a string. For example, if you\
    \ type len('secret'), Python will tell you that the string 'secret' is six characters\
    \ long. But because the first letter is in position 0, the last letter is in position\
    \ 5, not 6.\n\n# 11  Swap the letters round\n\nNow that you've got even letters\
    \ in one list and odd in another, you can use them to encrypt your message. The\
    \ next function will take letters alternately from these lists and put them into\
    \ a new list. But rather than assembling them in the original order, starting\
    \ with an even letter, it'll start the message with an odd one. Type this function\
    \ under the code in Step 10.\n\n```\ndef swap_letters(message):\n    letter_list\
    \ = []\n    if not is_even(len(message)):\n        message = message + 'x'\n \
    \   even_letters = get_even_letters(message)\n    odd_letters = get_odd_letters(message)\n\
    \    for counter in range(0, int(len(message)/2)):\n        letter_list.append(odd_letters[counter])\n\
    \        letter_list.append(even_letters[counter])\n    new_message = ''.join(letter_list)\n\
    \    return new_message\n```\n\nAdd an extra x to any message with an odd number\
    \ of letters.\n\nLoop through the lists of odd and even letters.\n\nAdd the next\
    \ odd letter to the final message.\n\nAdd the next even letter to the final message.\n\
    \nThe join() function turns the list of letters into a string.\n\n# ▷ How it works\n\
    \nThe swap_letters() function puts all the odd and even numbers into a new list,\
    \ adding them alternately. It starts the list with the first letter in the word,\
    \ which Python counts as an odd number.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_137_1.png)"
