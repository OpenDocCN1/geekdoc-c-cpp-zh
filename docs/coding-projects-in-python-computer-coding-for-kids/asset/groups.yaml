    # ## How it works


    This project makes use of a function—a block of code with a name that performs
    a specific task. A function lets you use the same code repeatedly, without having
    to type it all in every time. Python has lots of built-in functions, but it also
    lets you create functions of your own.


    # ### Calling functions


    When you want to use a function, you “call it” by typing its name in your code.
    In Animal Quiz, you’ll make a function that compares the player’s guess to the
    true answer to see if it’s correct. You’ll call it for each question in the quiz.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_38_0.png)


    # ### LINGO

    #### Ignore the case!


    When comparing the player’s guess to the correct answer, it shouldn’t matter if
    the player types capital letters or lower-case letters—all that matters is that
    the words are the same. This isn’t true for all programs. For example, if a program
    that checks passwords ignores case, the passwords might become easier to guess,
    and less secure. However, in Animal Quiz, it doesn’t matter if the player answers
    “bear” or “Bear”—both will be recognized as correct.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_38_1.png)


