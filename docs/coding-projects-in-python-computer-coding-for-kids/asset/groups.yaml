    >>> len(message)\n28\n```\n\n统计出的字符数\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_27_1.png)\n\
    \n## 列表\n\n当你想存储大量数据，或者数据的顺序很重要时，你可能需要使用列表。列表可以将许多项目放在一起，并按顺序保存它们。Python 会为每个项目分配一个数字，以显示其在列表中的位置。你可以随时更改列表中的项目。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_28_0.png)\n\n### 1. 多个变量\n\n想象你正在编写一个多人游戏，并想存储每支队伍中玩家的名字。你可以为每位玩家创建一个变量，可能如下所示……\n\
    \n每队有三名玩家时，你需要六个变量。\n\n```python\n>>> rockets_player_1 = 'Rory'\n>>> rockets_player_2\
    \ = 'Rav'\n>>> rockets_player_3 = 'Rachel'\n>>> planets_player_1 = 'Peter'\n>>>\
    \ planets_player_2 = 'Pablo'\n>>> planets_player_3 = 'Polly'\n```\n\n### 2. 将列表存入变量\n\
    \n……但如果每队有六名玩家呢？管理和更新这么多变量会很困难。更好的做法是使用列表。要创建列表，请用方括号将要存储的项目括起来。在 shell 中试试这些列表。\n\
    \n```python\n>>> rockets_players = ['Rory', 'Rav',\n'Rachel', 'Renata', 'Ryan',\
    \ 'Ruby']\n>>> planets_players = ['Peter', 'Pablo',\n'Polly', 'Penny', 'Paula',\
    \ 'Patrick']\n```\n\n- 列表项必须用逗号分隔。\n- 这个列表存储在变量 planets_players 中。\n\n### 3. 从列表中获取项目\n\
    \n一旦数据进入列表，处理起来就很容易。要从列表中取出一个项目，首先输入列表的名称。然后加上该项目在列表中的位置，并将其放在方括号内。注意：Python 从\
    \ 0 而不是 1 开始计数列表项目。现在试着从你的队伍中获取不同玩家的名字。第一位玩家位于位置 0，而最后一位玩家位于位置 5。\n\n```python\n\
    >>> rockets_players[0]\n'Rory'\n>>> planets_players[5]\n'Patrick'\n```\n\n- 这一行从位置\
    \ 0 获取列表中的第一个项目。\n- 这一行从位置 5 获取列表中的最后一个项目。\n- 按回车键取回该项目。\n\n## 做出决策\n\n每天，你都会根据自己提出的问题的答案来决定接下来做什么。例如，“在下雨吗？”“我做完作业了吗？”“我是一匹马吗？”计算机也会通过提问来做出决策。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_0.png)\n\n> “我是一匹马吗？”\n> “呃……”\n\
    \n### 进行比较的问题\n\n计算机问自己的问题通常涉及将一件事物与另一件事物进行比较。例如，计算机可能会问一个数字是否比另一个数字大。如果是，计算机随后可能会决定运行一段原本会被跳过的代码。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_1.png)\n\n> “你确定要这样做吗？”\n\n### 布尔值\n\
    \n计算机所提问题的答案只有两种可能的值：True 或 False。Python 将这两个值称为布尔值，它们必须始终以大写字母开头。你可以将布尔值存储在变量中。\n\
    \n```python\n>>> answer_one = True\n>>> answer_two = False\n```\n\n变量\n\n布尔值\n\
    \n### 逻辑运算符\n\n这些符号告诉计算机进行比较。程序员称它们为逻辑运算符。你可能在数学中用过其中一些。单词 “and” 和 “or” 也可以在计算机代码中用作逻辑运算符。\n\
    \n| 符号 | 含义 |\n|---|---|\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `>` |\
    \ 大于 |\n\n**专家提示**\n\n### 等号\n\n在 Python 中，你可以使用单等号或双等号。它们的含义略有不同。当你想设置变量的值时，使用单等号。例如，输入\
    \ `age = 10` 会将变量 age 的值设为 10。当你想比较两个值时，使用双等号 `==`，如下例所示。\n\n```python\n>>> age\
    \ = 10\n>>> if age == 10:\n    print('You are ten years old.')\n```\n\n- 这一行设置变量的值。\n\
    - 这一行将你的年龄与该变量进行比较。\n- 如果两者匹配，代码会打印该消息。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_2.png)\n\
    \n> “我比你大！”\n\n## 菠萝与斑马\n\n让我们在 shell 中尝试一个示例。我们可以使用变量 `pineapples` 和 `zebras`\
    \ 来表示有五个菠萝和两只斑马。在 shell 中输入这些行。\n\n```text\n>>> pineapples = 5\n>>> zebras = 2\n\
    ```\n\n- 这个变量存储菠萝的数量。\n- 这个变量存储斑马的数量。\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_30_0.png)\n\
    \n### 进行比较\n\n现在试着输入以下代码行，比较这两个变量的值。输入每一行后，按回车键，Python 会告诉你这些语句是 True 还是 False。\n\
    \n```text\n>>> zebras < pineapples\nTrue\n```\n\n斑马的数量小于菠萝的数量。\n\n```text\n>>>\
    \ pineapples > zebras\nTrue\n```\n\n菠萝的数量大于斑马的数量。\n\n```text\n>>> pineapples ==\
    \ zebras\nFalse\n```\n\n菠萝的数量与斑马的数量不相等。\n\n**术语**\n\n### 布尔表达式\n\n使用逻辑运算符对变量和值进行陈述的语句总是会给出一个布尔值，例如\
    \ True 或 False。因此，这些语句被称为布尔表达式。我们所有关于菠萝和斑马的语句都是布尔表达式。\n\n变量\n\n逻辑运算符\n\n```text\n\
    >>> pineapples != zebras\nTrue\n```\n\n布尔值\n\n变量\n\n### 多重比较\n\n你可以使用 `and` 或\
    \ `or` 来组合多个比较。如果使用 `and`，比较的两个部分都必须正确，语句才为 True。如果使用 `or`，只需要其中一个部分正确。\n\n```text\n\
    >>> (pineapples == 3) and (zebras == 2)\nFalse\n```\n\n其中一个部分（pineapples == 3）不正确，因此该语句为\
    \ False。\n\n```text\n>>> (pineapples == 3) or (zebras == 2)\nTrue\n```\n\n其中一个部分正确（zebras\
    \ == 2），因此该语句为 True。\n\n"
