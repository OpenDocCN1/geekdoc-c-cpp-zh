  mdcn: "\n## 技巧与调整\n\n你可以通过多种方式调整这个游戏。你可以显示完成游戏所用的步数，这样玩家就可以尝试打破自己的成绩或挑战朋友。你也可以添加更多符号，让游戏更难。\n\
