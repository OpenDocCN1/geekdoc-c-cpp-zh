    \ to remind them what different parts of a program do or to explain a tricky part\
    \ of a project. A comment must start with a `#`. Python ignores anything you type\
    \ on the same line after the `#` and doesn’t treat it as part of the code. Writing\
    \ comments in your own projects (such as the line `# Main code` shown above) can\
    \ be really helpful when you go back to look at a program after leaving it for\
    \ a while.\n\n### 11. Add random numbers\n\nNow mix things up by adding some random\
    \ numbers to your code. Type this line under the line that imports Turtle. It\
    \ brings in the randint() and random() functions from Python’s random module.\n\
    \n```python\nimport turtle as t\nfrom random import randint, random\n\ndef draw_star(points,\
    \ size, col, x, y):\n```\n\n### 12. Create a loop\n\nMake this change to the #Main\
    \ code section. It adds a while loop that continually randomizes the parameters\
    \ used to set the stars’ size, shape, color, and position.\n\nThe ranPts line\
