    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_168_1.png)\n\n## 抢拍（Snap）\n\n向你的朋友们发起一场数字版抢拍游戏挑战吧。这款快节奏的双人游戏需要敏锐的眼力和闪电般的反应速度。它的玩法就像纸牌游戏一样，但使用的是屏幕上出现的彩色形状，而不是发到手中的纸牌。\n\
