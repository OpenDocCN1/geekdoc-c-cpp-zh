    # ## Pineapples and zebras


    Let''s try an example using the shell. We can represent having five pineapples
    and two zebras by using the variables `pineapples` and `zebras`. Type these lines
    into the shell.


    ```

    ```text

    >>> pineapples = 5

    >>> zebras = 2

    ```

    ```


    This variable stores the number of pineapples.


    This variable stores the number of zebras.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_30_0.png)


    # ### ▽▷ Make comparisons


    Now try typing the following lines of code to compare the values of the two variables.
    After you''ve typed each line, press the return key and Python will tell you if
    the statements are True or False.


    ```

    ```text

    >>> zebras < pineapples

    True

    ```

    ```


    The number of zebras is less than the number of pineapples.


    ```

    ```text

    >>> pineapples > zebras

    True

    ```

    ```


    The number of pineapples is greater than the number of zebras.


    ```

    ```text

    >>> pineapples == zebras

    False

    ```

    ```


    The number of pineapples and the number of zebras aren''t equal.


    # ### LINGO

    # Boolean expressions


    Statements about variables and values that use the logical operators always give
    us a Boolean value, such as True or False. Because of this, these statements are
    called Boolean expressions. All of our statements about pineapples and zebras
    are Boolean expressions.


    Variable


    Logical operator


    ```

    ```text

    >>> pineapples != zebras

    True

    ```

    ```


