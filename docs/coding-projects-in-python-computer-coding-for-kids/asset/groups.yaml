    \ 使用了 time 模块的 sleep() 函数，它会让程序暂停设定的秒数：例如，time.sleep(1) 会让程序休眠 1 秒，然后再运行下一行代码。\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_170_0.png)\n\n## 开始动手\n\n首先，你需要导入相关模块并创建图形用户界面（GUI）。然后，你需要创建一个画布，用来绘制形状。\n\
