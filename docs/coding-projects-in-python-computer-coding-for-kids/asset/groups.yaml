    # EXPERT TIPS


    # Escape character (\\)


    The backslash in `Emma\''s Room` tells Python to ignore the apostrophe so that
    it doesn’t treat it as the quotation mark that closes the whole string. A backslash
    used like this is called an escape character. It tells Python not to count the
    next character when working out if the line makes sense or contains errors.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_34_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_34_1.png)


    # While loops


    What happens if you don’t know how many times you want to repeat a code? Do you
    need a crystal ball or some other way of seeing into the future? No, it’s okay!
    You can use a **while** loop.


    # ▷ Loop condition


    A while loop doesn’t have a loop variable that’s set to a range of values. Instead
    it has a loop condition. This is a Boolean expression that can be either True
    or False. It’s a bit like a bouncer at a disco asking you if you’ve got a ticket.
    If you have one (True), head straight for the dance floor; if you don’t (False),
    the bouncer won’t let you in. In programming, if the loop condition isn’t True,
    you won’t get into the loop!


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_34_2.png)


    # ▽ Balancing act


    In this example, Ahmed has written a program to keep track of how many of his
    troupe of acrobatic hippopotamuses have balanced on top of each other to make
    a tower. Read through the code and see if you can figure out how it works.


    This variable stores the number of hippos.


    This variable stores the answer to the question “Add another hippo?”


    Loop condition


    This line displays a message showing the total number of balancing hippos.


    Ahmed’s reply becomes the new value of answer.


    Add another hippo to the number balanced.


    ```

    ```python

    >>> hippos = 0

    >>> answer = ''y''

    >>> while answer == ''y'':

    ...     hippos = hippos + 1

    ...     print(str(hippos) + '' balancing hippos!'')

    ...     answer = input(''Add another hippo? (y/n) '')

    ```

