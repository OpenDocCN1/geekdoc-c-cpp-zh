    \ to the user, and simpledialog to ask them questions. Type this line at the top\
    \ of your file.\n\n```python\nfrom tkinter import messagebox, simpledialog, Tk\n\
    ```\n\n### 3. Encrypt or decrypt?\n\nNow create a function, get_task(), to open\
    \ a dialogue box that asks the user whether they want to encrypt or decrypt a\
    \ message. Add the function under the code you added in Step 2.\n\n```python\n\
    def get_task():\n    task = simpledialog.askstring('Task', 'Do you want to encrypt\
    \ or decrypt?')\n    return task\n```\n\nThis line asks the user to type in “encrypt”\
    \ or “decrypt”, then saves their response in the variable task.\n\nPass the value\
    \ in task back to the code that used this function.\n\nThis word will appear as\
    \ a title in the dialogue box.\n\n### 4. Get the message\n\nCreate a new function,\
    \ get_message(), to open a dialogue box asking the user to type in the message\
    \ they want to encrypt or decrypt. Add this function under the code you added\
    \ in Step 3.\n\n```python\ndef get_message():\n    message = simpledialog.askstring('Message',\
    \ 'Enter the secret message: ')\n    return message\n```\n\nThis line asks the\
    \ user to type in the message, then saves it in the variable message.\n\nPass\
    \ the value in message back to the code that used this function.\n\n### 5. Start\
    \ Tkinter\n\nThis command starts Tkinter and creates a Tkinter window. Type it\
    \ below the function you made in Step 4.\n\n```python\nroot = Tk()\n```\n\nIf\
    \ you find the Tkinter window distracting, add the root.withdraw line you used\
    \ in Ask the Expert.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_0.png)\n\n\
    ### 6. Start the loop\n\nNow that you've created your interface functions, add\
    \ this infinite while loop to call (run) them in the correct order. Insert this\
    \ code under the command you typed in Step 5.\n\n```python\nwhile True:\n    task\
    \ = get_task()\n    if task == 'encrypt':\n        message = get_message()\n \
    \       messagebox.showinfo('Message to encrypt is:', message)\n    elif task\
    \ == 'decrypt':\n        message = get_message()\n        messagebox.showinfo('Message\
    \ to decrypt is:', message)\n    else:\n        break\nroot.mainloop()\n```\n\n\
    - Find out what the user wants to do.\n- Get the secret message for encryption.\n\
    - Show the message in an info box.\n- Get the secret message for decryption.\n\
    - Show the message in an info box.\n- Stop looping if the user doesn't type 'encrypt'\
    \ or 'decrypt'.\n- Keep Tkinter working.\n- Type in what you want to do.\n\n###\
    \ 7. Test the code\n\nTry running the code. It will first show an input box asking\
    \ if you want to encrypt or decrypt. Then another input box will appear so that\
    \ you can type in the secret message. Lastly, it will show the encrypted or decrypted\
    \ message in an info box. If there's a problem, check your code carefully.\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_135_1.png)\n\nIf you can't see the input\
    \ box, look behind the code and shell windows.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_2.png)\n\
    \nType the secret message.\n\nAvoid using capitals so it's tougher to guess the\
    \ encrypted message.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_135_3.png)\n\n\
    Check that the message is correct before clicking OK.\n\n## Scramble the message!\n\
    \nNow that you’ve got your interface working, it’s time to write the code that\
    \ will encrypt and then decrypt your secret message.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_0.png)\n\
    \n### 8. Is it even?\n\nYou need to create a function to tell the program whether\
    \ or not there’s an even number of characters in your message. The function will\
    \ use the modulo operator (%) to check if it can divide the number by 2 without\
    \ leaving a remainder. If it can (True), then the number’s even. Add this function\
    \ under the code you typed in Step 2.\n\n```python\ndef is_even(number):\n   \
    \ return number % 2 == 0\n```\n\nThis will be True if the number is even.\n\n\
    Pass the True or False value back to the code.\n\n### Expert Tips\n\n#### Modulo\
    \ operator (%)\n\nIf you put the modulo operator (%) between two numbers, Python\
    \ tells you the remainder when you divide the first number by the second. So 4\
    \ % 2 is 0, but 5 % 2 is 1, because there’s 1 left over if you divide 5 by 2.\
    \ Type these examples in the shell if you want to try them out.\n\n### 9. Get\
