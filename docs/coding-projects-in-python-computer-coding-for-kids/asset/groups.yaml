    \n# ### LINGO\n## .py files\n\nPython programs usually have a name ending with\
    \ “.py”, which makes them easy to recognize. When you save a program, Python automatically\
    \ adds “.py” at the end, so you don’t need to type it in.\n\n# ### 5. Check it\
    \ works\n\nNow run the first line of the program to see if it works. Open the\
