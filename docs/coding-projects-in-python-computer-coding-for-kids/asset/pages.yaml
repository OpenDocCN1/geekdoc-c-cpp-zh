  md: "# # Variables\n\nIf you want to write useful code, you’ll need to be able to\
    \ store and label pieces of information. That’s what variables do. Variables are\
    \ great for all sorts of things—from tracking your score in a game to performing\
    \ calculations and holding lists of items.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_25_0.png)\n\
    \n# ## How to create a variable\n\nA variable needs a name. Think of a name that\
    \ will remind you what’s inside the variable. Then decide what you want to store\
    \ in the variable. This is the variable’s value. Type the name, followed by an\
    \ equals sign, followed by the value. We call this “assigning a value” to the\
    \ variable.\n\n# ### Storage box\n\nA variable is like a box with a name label.\
    \ You can store data in the box and then use the name to find the data again when\
    \ you need to use it.\n\n+   1. **Assign a value**  \n+      In the shell window,\
    \ type this line of code to create the variable `age` and assign a value to it.\
    \ Use your own `age` if you want.\n\n```\n```python\n>>> age = 12\n```\n```\n\n\
    This value will be stored in the variable.\n\nThis is the variable’s name.\n\n\
    +   2. **Print the value**  \n+      Now type the line of code shown on the right\
    \ into the shell window. Hit the enter/return key to see what happens.\n\n```\n\
    ```python\n>>> print(age)\n12\n```\n```\n\nThe value of age\n\nThe `print()` function\
    \ prints the value of the variable to the screen.\n\n# ### EXPERT TIPS\n## Naming\
    \ variables\n\n| Naming variables | Dos and don’ts |\n|---|---|\n| Choosing good\
    \ names for your variables will make your program easier to understand. For example,\
    \ a variable tracking a player’s lives in a game could be called `lives_remaining`,\
    \ rather than just `lives` or `l r`. Variable names can contain letters, numbers,\
    \ underscores, but they should begin with a letter. Follow the rules shown here\
    \ and you won’t go wrong. | • Start the variable’s name with a letter.  \n• Any\
    \ letter or number can be used in the name.  \n• Symbols such as `-`, `%`, or\
    \ `@` aren’t allowed.  \n• Spaces can’t be used.  \n• An underscore (`_`) can\
    \ be used instead of a space.  \n• Uppercase (capitals) and lowercase letters\
    \ are different. Python will treat “Score” and “score” as two different variables.\
    \  \n• Avoid words Python uses as commands, such as `print`. |"
