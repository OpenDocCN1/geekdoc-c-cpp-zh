  md: "# Add “fake” letters\n\nAnother way to encrypt messages is to insert random\
    \ letters between each pair of letters. So the word “secret” might become “stegcarielta”\
    \ or “shcvcarieste”. Just as in the “Reverse after swapping” hack, you’ll need\
    \ two different functions—one to encrypt and one to decrypt.\n\n> shcvcarieste!\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_141_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_141_1.png)\n\
    \nAll the green letters are fake ones.\n\n+   1. Add another module\n\nImport\
    \ the `choice()` function from the `random` module. This will let you choose the\
    \ fake letters from a list of letters. Type this line near the top of your file,\
    \ under the command to import the Tkinter functions.\n\n```\n```python\nfrom tkinter\
    \ import messagebox, simpledialog, Tk\nfrom random import choice\n```\n```\n\n\
    +   2. Encrypt\n\nTo encrypt the message, you need to set up a list of fake letters\
    \ to insert between the real ones. The code shown below will loop through the\
    \ message, adding one real letter and one fake letter to the `encrypted_list`\
    \ each time round.\n\n> Is this a fake letter?\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_141_2.png)\n\
    \n```\n```python\ndef encrypt(message):\n    encrypted_list = []\n    fake_letters\
    \ = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'i', 'r', 's', 't', 'u', 'v']\n    for\
    \ counter in range(0, len(message)):\n        encrypted_list.append(message[counter])\n\
    \        encrypted_list.append(choice(fake_letters))\n    new_message = ''.join(encrypted_list)\n\
    \    return new_message\n```\n```\n\nAdd fake letters between real letters.\n\n\
    Add a letter from the message to `encrypted_list`.\n\nAdd a fake letter to the\
    \ `encrypted_list`.\n\nJoin the letters in `encrypted_list` into a string."
  merge: -1
