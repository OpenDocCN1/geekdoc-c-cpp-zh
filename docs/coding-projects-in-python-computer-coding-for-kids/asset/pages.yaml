  md: "```\n```python\nroot.after(3000, blink)\n\ndef toggle_pupils():\n    if not\
    \ c.eyes_crossed:\n        c.move(pupil_left, 10, -5)\n        c.move(pupil_right,\
    \ -10, -5)\n        c.eyes_crossed = True\n    else:\n        c.move(pupil_left,\
    \ -10, 5)\n        c.move(pupil_right, 10, 5)\n        c.eyes_crossed = False\n\
    ```\n```\n\nThe code checks to see if the eyes are crossed already.\n\nIf the\
    \ pupils aren’t crossed, this line moves them in.\n\nThis line sets a flag variable\
    \ saying the eyes are crossed.\n\nThe eyes are already crossed (else).\n\nThese\
    \ lines move the pupils back to normal.\n\nThis line sets a flag saying the eyes\
    \ aren’t crossed.\n\n# 18 Toggle the pupils\n\nFor the cross-eyed look, the pupils\
    \ need to point inwards. This `toggle_pupils()` function will switch Screen Pet’s\
    \ pupils between pointing inwards and looking normal. Type it below the `blink()`\
    \ function you added in Step 8.\n\n# 19 Coordinate the cheekiness\n\nNow create\
    \ a function to get Screen Pet to stick its tongue out and cross its eyes at the\
    \ same time. Type this code under the `toggle_tongue()` function you added in\
    \ Step 17. Use the `root.after()` function to make Screen Pet go back to normal\
    \ after 1 second (1,000 milliseconds), like you did in `blink()`.\n\n```\n```python\n\
    def cheeky(event):\n    toggle_tongue()\n    toggle_pupils()\n    hide_happy(event)\n\
    \    root.after(1000, toggle_tongue)\n    root.after(1000, toggle_pupils)\n  \
    \  return\n```\n```\n\nStick the tongue out.\n\nCross the pupils.\n\nHide the\
    \ happy face.\n\nPut the tongue back in after 1,000 milliseconds.\n\nUncross the\
    \ pupils after 1,000 milliseconds.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_152_0.png)\n\
    \nDon’t forget to save your work.\n\n# 20 Link double-clicks to cheekiness\n\n\
    To trigger Screen Pet’s cheeky expression, link any double-click event to the\
    \ `cheeky()` function. Put this new line just below the line you added in Step\
    \ 14 to hide Screen Pet’s happy face. Run the code and double-click to see the\
    \ cheekiness!\n\n```\n```python\nc.bind('<Motion>', show_happy)\nc.bind('<Leave>',\
    \ hide_happy)\nc.bind('<Double-1>', cheeky)\n```\n```\n\n`<Double-1>` is Tkinter’s\
    \ name for a double-click in the window with the mouse."
