    If an egg touches the bottom of the screen, you lose a life.


    # Arcade-style game


    This last project brings all your coding skills together to create an impressive
    arcade-style game. The code is quite complex, so check your code carefully for
    bugs at each stage and don''t be discouraged if you make a few mistakes along
    the way. Once you''ve cracked Egg Catcher, you''ll be all set to start making
    your own games.'
