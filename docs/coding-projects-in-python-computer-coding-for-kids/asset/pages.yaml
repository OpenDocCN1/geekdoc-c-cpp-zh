- pgno: 96
  md: "# Starry sky\n\nThe next steps will wrap your star as a Python function. You’ll\
    \ then be able to use that function to draw a sky that’s teeming with stars.\n\
    \nThe `draw_star()` function uses five parameters to define the shape, size, color,\
    \ and position of the star.\n\n# 9. Create the star function\n\nEdit the code\
    \ as shown here. It replaces nearly all of your existing code with a new version.\
    \ The large block wraps up all the star-drawing instructions and keeps them neatly\
    \ together as a function. You can now use this function to draw a star in your\
    \ main code without a single line of Python, `draw_star()`.\n\n```\n```python\n\
    import turtle as t\n\ndef draw_star(points, size, col, x, y):\n    t.penup()\n\
    \    t.goto(x, y)\n    t.pendown()\n    angle = 180 - (180 / points)\n    t.color(col)\n\
    \    t.begin_fill()\n    for i in range(points):\n        t.forward(size)\n  \
    \      t.right(angle)\n    t.end_fill()\n\n# Main code\nt.Screen().bgcolor('dark\
    \ blue')\ndraw_star(5, 50, 'yellow', 0, 0)\n```\n```\n\nThe x and y coordinates\
    \ set the position of the star on the screen.\n\nThis sets the background color\
    \ to dark blue.\n\nThe turtle draws a yellow, five-pointed star, size 50, in the\
    \ center of the window.\n\nThis “comment” line starting with a hash symbol (`#`)\
    \ isn’t part of the code run by Python. It’s like a label to help you understand\
    \ the program.\n\nThis line calls (runs) the function.\n\n# 10. Run the project\n\
    \nThe turtle should draw a single yellow star on a blue background.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_96_0.png)\n\
    \n# REMEMBER\n\n# Comments\n\nProgrammers often put comments in their code to\
    \ remind them what different parts of a program do or to explain a tricky part\
    \ of a project. A comment must start with a `#`. Python ignores anything you type\
    \ on the same line after the `#` and doesn’t treat it as part of the code. Writing\
    \ comments in your own projects (such as the line `# Main code` shown above) can\
    \ be really helpful when you go back to look at a program after leaving it for\
    \ a while."
  merge: -1
  img_proc: true
- pgno: 97
  md: "# 11. Add random numbers\n\nNow mix things up by adding some random numbers\
    \ to your code. Type this line under the line that imports Turtle. It brings in\
    \ the randint() and random() functions from Python’s random module.\n\n```\n```python\n\
    import turtle as t\nfrom random import randint, random\n\ndef draw_star(points,\
    \ size, col, x, y):\n```\n```\n\n# 12. Create a loop\n\nMake this change to the\
    \ #Main code section. It adds a while loop that continually randomizes the parameters\
    \ used to set the stars’ size, shape, color, and position.\n\nThe ranPts line\
    \ sets the limit for the number of points on a star to be an odd number between\
    \ 5 and 11.\n\nThis line also changes. When it calls the draw_star() function,\
    \ it will now use the random variables in the while loop.\n\n```\n```python\n\
    # Main code\nt.Screen().bgcolor('dark blue')\n\nwhile True:\n    ranPts = randint(2,\
    \ 5) * 2 + 1\n    ranSize = randint(10, 50)\n    ranCol = (random(), random(),\
    \ random())\n    ranX = randint(-350, 300)\n    ranY = randint(-250, 250)\n\n\
    \    draw_star(ranPts, ranSize, ranCol, ranX, ranY)\n```\n```\n\n# 13. Run the\
    \ project again\n\nThe window should slowly fill up as the turtle draws star after\
    \ star in a range of colors, shapes, and sizes.\n\n# REMEMBER!\n\nIf you’d rather\
    \ not see the turtle, remember there’s a command you can use to make it invisible.\
    \ Add this line to your program and your stars will appear magically, without\
    \ an unseen turtle!\n\n```\n```python\n# Main code\nt.hideturtle()\n```\n```\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_97_0.png)\n\nThe turtle draws stars\
    \ randomly.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_97_1.png)"
