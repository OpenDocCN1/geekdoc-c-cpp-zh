- pgno: 49
  md: "# # Fixing bugs\n\nIf something’s wrong with your code, Python will try to\
    \ help by showing an error message. These messages can seem a bit puzzling at\
    \ first, but they’ll give you clues about why your program isn’t working and how\
    \ to fix it.\n\n# ## Error messages\n\nBoth the IDLE editor and the shell window\
    \ can show error messages if mistakes are detected. An error message tells you\
    \ what type of error has occurred and where to look in your code.\n\n# ### Messages\
    \ in the shell\n\nPython displays error messages in red text in the shell window.\
    \ The program stops working when an error message appears. The message tells you\
    \ which line of code caused the error to happen.\n\nThis pop-up box tells you\
    \ there’s a syntax error, which means there’s a typing mistake.\n\n# ### Messages\
    \ in the IDLE editor\n\nA pop-up box warns you there’s an error. Click OK to return\
    \ to your program. There will be a red highlight on or near the error.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_0.png)\n\
    \n```\n```text\n>>>\nTraceback (most recent call last):\n    File \"Users/Craig/Developments/top-secret-python-book/age.py\"\
    , line 21, in <module>\n        print('I am'+ age + 'years old')\nTypeError: Can't\
    \ convert 'int' object to str implicitly\n```\n```\n\nThis line tells you it’s\
    \ a type error (see page 50).\n\nThe error is on line 21.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_1.png)\n\
    \n# ### EXPERT TIPS — Finding bugs\n\nWhen an error message appears in the shell,\
    \ right-click it and choose “Go to file/line” on the drop-down menu. The IDLE\
    \ editor jumps straight to that line of code so you can start debugging.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_49_2.png)"
  merge: -1
  img_proc: true
- pgno: 50
  md: "# Syntax errors\n\nWhen you get a syntax error message, it’s a hint that you’ve\
    \ typed something incorrectly. Perhaps your fingers slipped and hit a wrong letter?\
    \ Don’t worry—these are the easiest errors to fix. Check through your code carefully\
    \ and try to spot what went wrong.\n\nThe closing bracket is missing—it needs\
    \ another curved bracket here.\n\n```\ninput('What is your name?')\n```\n\nThe\
    \ first quotation mark is missing. It needs to be a single quote to match.\n\n\
    ```\nprint(It is your turn')\n```\n\nThis is a spelling mistake—it should be short_shots.\n\
    \n```\ntotal_score = (long_shots * 3) + (short_shots * 2)\n```\n\n# ▷ Things to\
    \ look out for\n\nAre you missing a bracket or quotation mark? Do your pairs of\
    \ brackets and quotation marks match? Have you made a spelling mistake? All these\
    \ things can cause syntax errors.\n\n# Indentation errors\n\nPython uses indentation\
    \ to understand where blocks of code start and stop. An indentation error means\
    \ something is wrong with the way you’ve structured the code. Remember: if a line\
    \ of code ends with a colon (:), the next line must be indented. Press the space\
    \ bar four times to manually indent a line.\n\n# ▽ Indent each new block\n\nIn\
    \ your Python programs, you’ll often have one block of code within another block,\
    \ such as a loop that sits inside a function. Every line in a particular block\
    \ must be indented by the same amount. Although Python helps by automatically\
    \ indenting after colons, you still need to check that each block is indented\
    \ correctly.\n\n```\nif weekday == True:\nprint('Go to school')\n```\n\nThis line\
    \ of code would trigger an indentation error message.\n\n```\nif weekday == True:\n\
    \    print('Go to school')\n```\n\nFour spaces\n\nYou need to indent the code\
    \ on the second line like this to fix the error.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_50_0.png)"
  merge: -1
  img_proc: true
- pgno: 51
  md: '# ## Type errors


    A type error isn’t a typing error—it means your code has mixed up one type of
    data with another, such as confusing numbers with strings. It’s like trying to
    bake a cake in your refrigerator—it won’t work, because the refrigerator isn’t
    meant for baking! If you ask Python to do something impossible, don’t be surprised
    if it won’t cooperate!


    ```

    ```python

    budget = ''Fifty'' * ''Five''

    ```

    ```


    You can multiply two numbers in Python, but you can’t do multiplication with strings.


    ```

    ```python

    hot_day = ''20 degrees'' > 15

    ```

    ```


    Python can’t check to see if a string is greater than a number, because they are
    different data types.


    ```

    ```python

    list = [''a'', ''b'', ''c'']

    find_biggest_number(list)

    ```

    ```


    This function is expecting you to give it a list of numbers, but you’ve given
    it a list of letters instead!


    # ### Examples of type errors


    Type errors occur when you ask Python to do something that doesn’t make sense
    to it, such as multiplying with strings, comparing two completely different types
    of data, or telling it to find a number in a list of letters.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_1.png)


    # ## Name errors


    A name error message appears if your code uses the name of a variable or function
    that hasn’t yet been created. To avoid this, always define your variables and
    functions before you write code to use them. It’s good practice to define all
    your functions at the top of your program.


    # ▷ Name errors


    A name error in this code stops Python from displaying the message “I live in
    Moscow”. You need to create the variable `hometown` first, before you use the
    `print()` function.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_51_2.png)


    The `print()` instruction needs to come after the variable.


    ```

    ```python

    print(''I live in '' + hometown)

    hometown = ''Moscow''

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# ## Logic errors


    Sometimes you can tell something has gone wrong even if Python hasn''t given you
    an error message, because your program isn''t doing what you expected. It could
    be that you''ve got a logic error. You may have typed in the code correctly, but
    if you missed an important line or put the instructions in the wrong order it
    won''t run properly.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_52_0.png)


    ```

    ```python

    print(''Oh no! You''ve lost a life!'')

    print(lives)

    lives = lives - 1

    ```

    ```


    All the lines of code are correct, but two are in the wrong order.


    # ### Can you spot the bug?


    This code will run with no error messages, but there''s a logic error in it. The
    value of `lives` is shown on screen before the number of lives is reduced by one.
    The player of this game will see the wrong number of lives displayed! To fix it,
    move the instruction `print(lives)` to the end.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_52_1.png)


    # ### Line by line


    Logic errors can be tricky to find, but as you get more experienced you''ll get
    good at tracking them down. Try to identify logic errors by checking your code
    slowly, line by line. Be patient and take your time—you''ll find the problem in
    the end.


    # ## EXPERT TIPS


    # ## Bug-busting checklist


    Sometimes you might think that you''ll never get a program to work, but don''t
    give up! If you follow the tips in this handy checklist, you''ll be able to identify
    most errors.


    # ### Ask yourself...


    +   - If you build one of the projects in this book and it doesn''t work, check
    that the code you''ve typed matches the book exactly.

    +   - Is everything spelled correctly?

    +   - Have you given unnecessary spaces at the start of a line?

    +   - Have you confused any numbers for letters, such as 0 and O?

    +   - Have you used upper-case and lower-case letters in the right places?

    +   - Do all open parentheses have a matching closing parenthesis? `( ) [ ] {
    }`

    +   - Do all single and double quotes have a matching closing quote? `'' "`

    +   - Have you asked someone else to check your code against the book?

    +   - Have you saved your code since you last made changes?


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_52_2.png)'
  merge: -1
  img_proc: true
