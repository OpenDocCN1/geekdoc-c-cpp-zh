- pgno: 47
  md: "# Making a function\n\nThe best functions have a clear purpose and a good name\
    \ that explains what they do—think of the `check_guess()` function you used in\
    \ Animal Quiz. Follow these instructions to create, or “define,” a function that\
    \ calculates the number of seconds in a day and then prints the answer on the\
    \ screen.\n\n# 1  Define the function\n\nCreate a new file in IDLE. Save it as\
    \ “functions.py”. Type these lines into the editor window. An indent is added\
    \ at the start of each line in the function. Save the file again, then run the\
    \ code to see what happens.\n\nThe name of the function\n\nThere are no parameters\
    \ yet.\n\n```\n```python\ndef print_seconds_per_day():\n    hours = 24\n    minutes\
    \ = hours * 60\n    seconds = minutes * 60\n    print(seconds)\n\nprint_seconds_per_day()\n\
    ```\n```\n\nVariables\n\nThe line prints the value of the variable seconds.\n\n\
    The keyword `def` tells Python that this block of code is a function.\n\nThe lines\
    \ after the name must be indented 4 spaces, to show Python that they are part\
    \ of the function.\n\nThis command calls the function.\n\n86400\n\nThe number\
    \ of seconds in a day appears in the shell.\n\n# 2  Add parameters\n\nIf you want\
    \ to give your function any values to work with, you put them inside the brackets\
    \ as parameters. For example, to find out the total number of seconds in a particular\
    \ number of days, change your code to look like this. The function now has a parameter\
    \ `days`. You can specify the number of days when you call the function. Try it\
    \ out yourself.\n\n```\n```python\ndef print_seconds_per_day(days):\n    hours\
    \ = days * 24\n    minutes = hours * 60\n    seconds = minutes * 60\n    print(seconds)\n\
    \nprint_seconds_per_day(7)\n```\n```\n\nThe function’s parameter\n\nThis line\
    \ uses the parameter `days`.\n\nGives a value (7) to the parameter days\n\nExisting\
    \ lines of code are shown in grey and new lines of code in bold.\n\n604800\n\n\
    The number of seconds in 7 days.\n\n# EXPERT TIPS\n\n# Top advice\n\nIt’s important\
    \ to define your functions before you use them in your main code. When you’re\
    \ learning to code with Python, it’s helpful to put your functions at the top\
    \ of your file, after any import statements. By doing this, you won’t make the\
    \ mistake of trying to call a function before you’ve defined it.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_47_0.png)"
  merge: -1
