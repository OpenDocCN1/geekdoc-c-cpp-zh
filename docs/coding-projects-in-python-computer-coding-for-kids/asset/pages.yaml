  md: "# How it works\n\nYou use an actor to represent the catcher. An arc is one\
    \ part of a whole circle. Tkinter draws circles inside an invisible box. The first\
    \ two `catcher_start` coordinates (x1 and y1) plot where one corner of the box\
    \ should be. The second two coordinates (x2 and y2) plot the position of the box’s\
    \ opposite corner. The `create_arc()` function has two parameters, both given\
    \ in degrees (°), that say where in the circle to draw the arc: `start` says where\
    \ to start drawing, while `extent` is how many degrees to draw before stopping.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_196_0.png)\n\nA whole circle is 360°.\
    \ The code starts drawing the arc just over half way around the circle, at 200°.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_196_1.png)\n\n# Score and lives counters\n\
    \nAdd this code under the lines that set up the catcher. It sets the starting\
    \ score to 0 and creates the text that shows the score on the screen. It also\
    \ sets the remaining lives to three and displays this number. To check the code\
    \ is working, add `root.mainloop()` right at the end and then run the code. Once\
    \ you’ve checked, remove this line—you’ll add it again later when it’s needed.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_196_2.png)\n\n```\n```python\ncatcher\
    \ = c.create_arc(catcher_start_x, catcher_start_y,\n                       catcher_start_x2,\
    \ catcher_start_y2, start=200, extent=140,\n                       style='arc',\
    \ outline=catcher_color, width=3)\n\ngame_font = font.nametofont('TkFixedFont')\n\
    game_font.config(size=18)\n\nscore = 0\nscore_text = c.create_text(10, 10, anchor='nw',\
    \ font=game_font, fill='darkblue',\n                           text='Score: '\
    \ + str(score))\n\nlives_remaining = 3\nlives_text = c.create_text(canvas_width\
    \ - 10, 10, anchor='ne', font=game_font,\n                           fill='darkblue',\
    \ text='Lives ' + str(lives_remaining))\n```\n```\n\nThis line selects a cool\
    \ computer-style font.\n\nYou can make the text larger or smaller by changing\
    \ this number.\n\nThe player gets three lives."
  merge: -1
