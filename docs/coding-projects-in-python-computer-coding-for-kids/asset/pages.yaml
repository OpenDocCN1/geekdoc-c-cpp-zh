  md: "# Add a new loop\n\nTo make the clue the correct length once the secret word\
    \ has been selected, use this simple loop. It counts how many letters are in the\
    \ word and adds a question mark for each letter.\n\n```\n```python\nclue = []\n\
    index = 0\n\nwhile index < len(secret_word):\n    clue.append('?')\n    index\
    \ = index + 1\n```\n\nThe append() function simply adds an item to the end of\
    \ the list.\n```\n\n# Make the ending smarter\n\nAt the moment, the game doesn’t\
    \ end until you type out the word in full. Let’s make the code smarter so the\
    \ game ends when you guess the last letter.\n\n# 1. Make another variable\n\n\
    First create a variable to keep count of how many letters are unknown. Add this\
    \ code above the update_clue function.\n\n```\n```python\nunknown_letters = len(secret_word)\n\
    ```\n```\n\n# 2. Edit function\n\nNext change the update_clue() function as shown\
    \ below. Each time the player guesses a letter, the program will now take away\
    \ the number of times that letter appears in the secret word from unknown_letters.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_69_0.png)\n\nAt first all the letters\
    \ are unknown.\n\n```\n```python\ndef update_clue(guessed_letter, secret_word,\
    \ clue, unknown_letters):\n    index = 0\n    while index < len(secret_word):\n\
    \        if guessed_letter == secret_word[index]:\n            clue[index] = guessed_letter\n\
    \            unknown_letters = unknown_letters - 1\n        index = index + 1\n\
    \n    return unknown_letters\n```\n```\n\nAdd this new parameter to the update_clue\
    \ function.\n\nThe code subtracts 1 from unknown_letters each time a guessed letter\
    \ appears in the word.\n\nThis line makes the function return the number of unknown\
    \ letters."
  merge: -1
  img_proc: true
- pgno: 70
  md: "![](img/6b18a113f7aa9338e32f3ac1fa217987_70_0.png)\n\n> > I guess the word\
    \ is “assist”.\n\n# How it works\n\nWhy do you have to update `unknown_letters`\
    \ in the `update_clue()` function? Why can’t you just subtract 1 when you know\
    \ that the guessed letter is in the secret word? This would work if each letter\
    \ only appeared once in the secret word. But if the letter appears multiple times,\
    \ it would make your count wrong. By updating the variable in the function, the\
    \ code will subtract 1 from `unknown_letters` every time the letter appears in\
    \ the secret word. This is because the function checks every letter in the secret\
    \ word to see if it matches the guessed letter.\n\n# 3. Calling the function\n\
    \nYou’ll also need to change the `update_clue()` function to pass the `unknown_letters`\
    \ variable and store the new value.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_70_1.png)\n\
    \n> > Hello, can you please connect me to the function?\n\n```\n```python\nunknown_letters\
    \ = update_clue(guess, secret_word, clue, unknown_letters)\n\nelse:\n    print(\"\
    Incorrect. You lose a life\")\n    lives = lives - 1\n```\n```\n\nThis passes\
    \ the `unknown_letters` variable.\n\nThis line assigns the new value to the `unknown_letters`\
    \ variable.\n\n# 4. Winning the game\n\nWhen `unknown_letters` reaches 0, the\
    \ user has guessed the word correctly. Add this code at the end of the main loop.\
    \ Now the game will automatically announce you as the winner when you’ve guessed\
    \ all the letters.\n\n```\n```python\nlives = lives - 1\n\nif unknown_letters\
    \ == 0:\n    guessed_word_correctly = True\n    break\n```\n```\n\nThe `break`\
    \ statement exits the loop when the player guesses the correct word.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_70_2.png)\n\
