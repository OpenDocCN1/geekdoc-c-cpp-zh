- pgno: 178
  md: '# # Hacks and tweaks


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_178_0.png)


    Tkinter can show lots of different colors and shapes besides circles, squares,
    and rectangles, so there''s plenty of scope to customize your game. Here are some
    ideas to try out—including making the game cheat-proof!


    # ## Colored outlines


    The program looks at the fill parameter, not the outline, when it''s judging whether
    a valid snap has been made. You can give different colored outlines to shapes
    and they will still make a snap so long as their fill colors match.


    # ## Speed up the game


    You can make the game a bit harder by reducing the time delay between each shape
    as the game progresses. Try storing the time in a variable, starting at 1000 and
    subtracting 25 from it each time a shape is shown. The numbers are just suggestions—experiment
    with them to see what you think works best.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_178_1.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_178_2.png)


    # ## Add more colors


    You may have noticed that Snap is quite a short game. To make it longer, add extra
    squares, rectangles, and circles using different colors.


    # ## Make new shapes


    You can change the parameters of create_oval() to produce an oval rather than
    a circle. Tkinter can also draw arcs, lines, and polygons. Try out the examples
    shown here, and play around with the parameters. Remember to keep the state as
    HIDDEN to hide the shape until it''s time to show it.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_178_3.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_178_4.png)


    # ## Draw arcs


    Use the create_arc() function to draw arcs. A solid arc is drawn unless you give
    your arc a style. To use Tkinter''s different arc styles, import CHORD and ARC
    by changing the third line of your program, as shown below. Then add some chords
    and arcs to your list of shapes, as shown overleaf.


    Try this to modify the arc style.


    ```

    ~~~

    from tkinter import Tk, Canvas, HIDDEN, NORMAL, CHORD, ARC

    ~~~

    ```'
