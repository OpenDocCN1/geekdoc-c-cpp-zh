- pgno: 169
  md: '# # Snap


    Challenge your friends to a game of digital snap. This fast-paced, two-player
    game requires a sharp eye and lightning-fast reactions. It works just like the
    card game but uses colored shapes that appear on the screen rather than cards
    that are dealt.


    # ## What happens


    Different shapes appear on the screen at random in either black, red, green, or
    blue. If a color appears twice in succession, hit the snap key. Player 1 presses
    the “q” key to snap and player 2 the “p” key. Each correct snap scores a point.
    Snap at the wrong time and you lose a point. The player with the highest score
    is the winner.


    # ### Starting the game


    This game works on a Tkinter window. When you start the program, the Tkinter window
    might be hidden behind IDLE windows on your desktop. Move them out of the way
    so you can see the game. Be quick though: the snap shapes start appearing 3 seconds
    after you run the program.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_169_0.png)


    This is a snap because the colors are the same, even though the shapes are different.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_169_1.png)


    Although these shapes match, their colors are different, so it’s not a snap.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # How it works


    This project uses Tkinter to create the shapes. Tkinter''s mainloop() function
    schedules a function that you''ll create to show the next shape. The random module''s
    shuffle() function makes sure the shapes appear in a different order. The “q”
    and “p” keys are bound (linked) to a snap() function, so that each time one of
    these keys is pressed, it updates the relevant player''s score.


    # ▷ Snap flowchart


    The program runs for as long as there are still shapes left to be revealed. It
    reacts to the key presses of the players when they think they see a snap. When
    there are no more shapes left, the winner is declared and the game ends.


    # EXPERT TIPS

    ## Sleep


    Computers work a lot faster than you can. Sometimes this causes problems. If you
    tell a computer to show a shape to the user and then hide it again, without a
    break, the computer does it so quickly that the person won''t see the shape. To
    fix this, Snap uses the time module''s sleep() function, which pauses a program
    for a set number of seconds: time.sleep(1), for example, puts the program to sleep
    for 1 second before it runs the next line of code.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_170_0.png)'
  merge: -1
  img_proc: true
