    \n```\n```python\nevents = get_events()\ntoday = date.today()\n```\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_118_0.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_118_1.png)\n\n# ### Display the results\n\
