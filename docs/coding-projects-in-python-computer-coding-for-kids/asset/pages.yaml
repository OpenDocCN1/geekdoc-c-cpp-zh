  md: "# ## 8. Run the project\n\nIf you run the code once more, a window will appear\
    \ after you've entered the line sizes in the shell window. You will now see the\
    \ turtle. Take a good look at it, because it won't be sitting still for too long!\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_104_0.png)\n\nThe turtle starts in\
    \ the middle of the window.\n\n# ## 9. Keep inside the limits!\n\nTo stop the\
    \ turtle from straying, let's set a boundary 100 steps in from the edges of the\
    \ window. Create this function to check whether or not the turtle is inside the\
    \ boundary. Type the code shown here under the code in Step 4 and above the code\
    \ in Step 5.\n\n```\n```python\nreturn (line_width)\n\ndef inside_window():\n\
    \    left_limit = (-t.window_width() / 2) + 100\n    right_limit = (t.window_width()\
    \ / 2) - 100\n    top_limit = (t.window_height() / 2) - 100\n    bottom_limit\
    \ = (-t.window_height() / 2) + 100\n\n    x, y = t.pos()\n    inside = left_limit\
    \ < x < right_limit and bottom_limit < y < top_limit\n    return inside\n\nline_length\
    \ = get_line_length()\n```\n```\n\nThis is 100 steps to the right of the left\
    \ edge.\n\n100 steps from the right edge.\n\n100 steps from the top.\n\n100 steps\
    \ from the bottom.\n\nThis sets `inside` to True if the turtle is inside the limits\
    \ and False if it isn't.\n\nWith this line, the program gets the turtle's current\
    \ x and y coordinates.\n\nThis command passes `inside` back to the code that used\
    \ this function.\n\n# ▷ How it works\n\nThe code checks if the turtle's x coordinate\
    \ is between the right and left limits, and if its y coordinate is between the\
    \ top and bottom limits.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_104_1.png)\n\
    \nThe blue square is shown here to tell you where the limits are—it won't be visible\
    \ on your screen.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_104_2.png)\n\nDon't\
