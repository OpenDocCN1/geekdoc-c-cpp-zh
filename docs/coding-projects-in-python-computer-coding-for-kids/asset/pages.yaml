  md: "# Getting started\n\nIn the first part of the project, you'll set up the graphical\
    \ user interface (GUI) and add the pairs of symbols that will be hidden by the\
    \ buttons.\n\n+   1. **Create a new file**\n+   \n+   Open IDLE. Create a new\
    \ file and save it as “matchmaker.py”.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_0.png)\n\
    \n+   2. **Add modules**\n+   \n+   Now type this code at the top of your file\
    \ to import the modules you need for this project. You’ll use `random` to shuffle\
    \ the symbols, `time` to pause the program, and `Tkinter` to create the GUI.\n\
    \n```\n```python\nimport random\nimport time\nfrom tkinter import Tk, Button,\
    \ DISABLED\n```\n```\n\n`DISABLED` stops a button from responding after its symbol\
    \ has been matched.\n\n`Button` creates the buttons in the Tkinter window.\n\n\
    +   3. **Set up the GUI**\n+   \n+   Under the import commands, add this code,\
    \ which will set up the GUI. The `root.resizable()` function prevents the player\
    \ from resizing the window. This is important, since changing the size of the\
    \ window will mess up the button layout that you’ll create later on.\n\n```\n\
    ```python\nroot = Tk()\nroot.title('Matchmaker')\nroot.resizable(width=False,\
    \ height=False)\n```\n```\n\nThese lines create a Tkinter window and give it a\
    \ title.\n\nThis line keeps the window at its original size.\n\n+   4. **Test\
    \ your code**\n+   \n+   Now run the code. You should see an empty Tkinter window\
    \ with the heading “Matchmaker”. If you can’t see it, it’s probably hidden behind\
    \ other windows.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_1.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_183_2.png)\n\
    \nDon't forget to save your work."
