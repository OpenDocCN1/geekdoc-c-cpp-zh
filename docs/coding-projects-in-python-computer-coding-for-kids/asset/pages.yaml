  md: "# # Reverse after swapping\n\nTo make it harder still for people to break your\
    \ encryption, reverse the message after encrypting it with `swap_letters()`. To\
    \ do this, you'll need to create two different functions—one to encrypt and one\
    \ to decrypt.\n\n# 1. Encrypt function\n\nThe `encrypt()` function swaps the letters\
    \ and then reverses the string. These lines use the `swap_letters()` function.\n\
    \n```\n```python\ndef encrypt(message):\n    swapped_message = swap_letters(message)\n\
    \    encrypted_message = ''.join(reversed(swapped_message))\n    return encrypted_message\n\
    ```\n```\n\nReverses the message once its letters have been swapped.\n\n# 2. Decrypt\
    \ function\n\nThe `decrypt()` function beneath the `encrypt()` function. It starts\
    \ by reversing the encrypted message, and then uses `swap_letters()` to put the\
    \ letters back in the right order.\n\n```\n```python\ndef decrypt(message):\n\
    \    unreversed_message = ''.join(reversed(message))\n    decrypted_message =\
    \ swap_letters(unreversed_message)\n    return decrypted_message\n```\n```\n\n\
    Undo the reversing action of the encrypt function by reversing the message again.\n\
    \nThis line puts the letters back in the right order.\n\n# 3. Use the new functions\n\
    \nNow you need to update the infinite loop section of your program to use these\
    \ functions instead of the `swap_letters()` function.\n\n```\n```python\nwhile\
    \ True:\n    task = get_task()\n    if task == 'encrypt':\n        message = get_message()\n\
    \        encrypted = encrypt(message)\n        messagebox.showinfo('Ciphertext\
    \ of the secret message is:', encrypted)\n    elif task == 'decrypt':\n      \
    \  message = get_message()\n        decrypted = decrypt(message)\n        messagebox.showinfo('Plaintext\
    \ of the secret message is:', decrypted)\n    else:\n        break\n```\n```\n\
    \nThe new `encrypt()` function replaces `swap_letters()`.\n\nThe new `decrypt()`\
    \ function replaces `swap_letters()`.\n\nDon't forget to save your work.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_140_0.png)"
