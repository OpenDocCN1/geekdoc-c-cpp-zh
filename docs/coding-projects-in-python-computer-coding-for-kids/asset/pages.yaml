  md: "# Sad pet\n\nFinally, make Screen Pet notice if you don't pay any attention\
    \ to it. After nearly a minute without being stroked, your poor, neglected pet\
    \ will show its sad face!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_153_0.png)\n\
    \nWhen Pet starts with a happiness level of 10, it looks like this.\n\n+   21.\
    \ **Set up a happiness level**\n\nPut this line of code just above the flap variables\
    \ you added to the main part of the program in Step 16. It creates a happiness\
    \ level for Screen Pet and sets the level at 10 when you run the program and draw\
    \ the pet.\n\n```\n~~~python\nc.happy_level = 10\n~~~\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_153_1.png)\n\
    \n+   22. **Create a new command**\n\nType this line below the command you added\
    \ in Step 9 that starts Screen Pet blinking. It tells mainloop() to call the function\
    \ sad() which you'll add in Step 23, after 5 seconds (5,000 milliseconds).\n\n\
    ```\n~~~python\nroot.after(5000, sad)\n~~~\n```\n\n+   23. **Write a sad function**\n\
    \nAdd this function sad() beneath hide_happy(). It checks to see if c.happy_level\
    \ is 0 yet. If it is, it changes Screen Pet's expression to a sad one. If it's\
    \ not, it subtracts 1 from c.happy_level. Like blink(), it reminds mainloop()\
    \ to call it again after 5 seconds.\n\n```\n~~~python\ndef sad():\n    if c.happy_level\
    \ == 0:\n        c.itemconfigure(mouth_happy, state=HIDDEN)\n        c.itemconfigure(mouth_normal,\
    \ state=HIDDEN)\n        c.itemconfigure(mouth_sad, state=NORMAL)\n    else:\n\
    \        c.happy_level -= 1\n        root.after(5000, sad)\n~~~\n```\n\nThis line\
    \ checks to see if the value of c.happy_level is 0.\n\nIf c.happy_level reaches\
    \ 0, the code hides the happy and neutral expressions.\n\nThese three lines set\
    \ Screen Pet's expression to sad.\n\nSubtract 1 from the value of c.happy_level.\n\
    \nCall sad() again after 5,000 milliseconds."
