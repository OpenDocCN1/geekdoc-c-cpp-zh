  md: '# Secret Messages flowchart


    The program uses an infinite loop that asks the user whether they want to encrypt
    or decrypt. The user''s choice determines which path the program then takes. Dialogue
    boxes get text from the user, while info boxes display the encrypted and decrypted
    messages to them. The program ends if the user types anything except "encrypt"
    or "decrypt".


    Start


    User chooses what to do


    "encrypt, decrypt, or anything else?"


    Encrypt


    Get the secret message to encrypt


    Encrypt the message


    Display the encrypted message


    Decrypt


    Get the secret message to decrypt


    Decrypt the message


    Display the decrypted message


    User types anything except "encrypt" or "decrypt"


    End


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_133_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_133_1.png)


    # Mystery x


    The program needs the message to have an even number of characters. It checks
    the message and counts the characters. If there''s an odd number of characters,
    it adds an x to the end to make it even. You and your fellow secret agents will
    know to ignore the x, so you won''t be fooled!


    Plaintext of the secret message is:


    come to my party saturday afternoonx


    OK'
