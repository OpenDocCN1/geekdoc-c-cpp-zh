  md: "# # Making decisions\n\nEvery day you make decisions about what to do next,\
    \ based on the answers to questions you ask yourself. For example, “Is it raining?”\
    \ “Have I done my homework?”, “Am I a horse?” Computers also make decisions by\
    \ asking questions.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_0.png)\n\n\
    > “Am I a horse?”\n\n> “Err...”\n\n# ## Questions that compare\n\nThe questions\
    \ that computers ask themselves usually involve comparing one thing with another.\
    \ For example, a computer might ask if one number is bigger than another. If it\
    \ is, the computer might then decide to run a block of code that would otherwise\
    \ be skipped.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_1.png)\n\n> “Are\
    \ you sure you want to do that?”\n\n# ### Boolean values\n\nThe answers to the\
    \ questions computers ask have only two possible values: True or False. Python\
    \ calls these two values Boolean values, and they must always start with a capital\
    \ letter. You can store a Boolean value in a variable.\n\n```\n```python\n>>>\
    \ answer_one = True\n>>> answer_two = False\n```\n```\n\nVariable\nBoolean value\n\
    \n# ### Logical operators\n\nThe symbols tell computers to make comparisons. Programmers\
    \ call them logical operators. You may have used some of them in math. The words\
    \ “and” and “or” can also be used as logical operators in computer code.\n\n|\
    \ Symbol | Meaning |\n|---|---|\n| `==` | equal to |\n| `!=` | not equal to |\n\
    | `<` | less than |\n| `>` | greater than |\n\n# ## EXPERT TIPS\n\n# ### Equals\
    \ signs\n\nIn Python you can use a single equals sign or a double equals sign.\
    \ They mean slightly different things. Use a single equals sign when you want\
    \ to set the value of a variable. Typing `age = 10`, for example, sets the value\
    \ of the variable age to 10. Use a double equals `==` sign when you want to compare\
    \ two values, as in the example below.\n\n```\n```python\n>>> age = 10\n>>> if\
    \ age == 10:\n    print('You are ten years old.')\n```\n```\n\nThis sets the value\
    \ of the variable.\n\nThis compares your age with the variable.\n\nThe code prints\
    \ the message if the two match.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_29_2.png)\n\
    \n> “I'm greater than you!”"
