- pgno: 193
  md: '# How it works


    Once the background is created, the eggs gradually move down the screen, which
    creates the illusion that they are falling. Using loops, the code continually
    checks the coordinates of the eggs to see if they have hit the bottom or been
    caught in the catcher. When an egg is caught or dropped, it is deleted and the
    program adjusts the score or the number of remaining lives.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_193_0.png)


    # Start


    Create a new egg at the top of the screen with a random horizontal position


    Wait 4 seconds


    Move all the eggs on the screen down a bit


    Have any of the eggs hit the bottom?


    N → Wait half a second

    Y → Remove the egg and subtract a life


    Has the player run out of lives?


    N → Continue checking

    Y → Display the “Game Over!” message


    Has the catcher caught an egg?


    N → Wait half a second

    Y → Remove the egg and add 10 to the score


    Increase the eggs’ speed and frequency


    Wait a tenth of a second


    # End


    # ⚠ Egg Catcher flowchart


    There are three different loops in this game: one to create new eggs, another
    to check if the catcher has caught an egg, and a third to move the eggs and check
    for eggs touching the bottom. Each of the three loops repeats at a different speed.'
  merge: -1
  img_proc: true
