- pgno: 187
  md: "# ## Show the symbol\n\nFinally, you need to create the function that handles\
    \ the button presses. This function will always display a symbol, but how it operates\
    \ depends on whether it’s the first or second turn in the matching attempt. If\
    \ it’s the first turn, the function just needs to remember which button was pressed.\
    \ If it’s the second turn, it needs to check if the symbols match. Symbols that\
    \ don’t match are hidden. Matching symbols are left showing and their buttons\
    \ are disabled.\n\n```\n~~~python\nfrom tkinter import Tk, Button, DISABLED\n\n\
    # The x and y values tell the function which button has been pressed.\ndef show_symbol(x,\
    \ y):\n    # These lines tell the program that the variables are global\n    global\
    \ first\n    global previousX, previousY\n    # These lines show the symbol.\n\
    \    buttons[x, y]['text'] = button_symbols[x, y]\n    buttons[x, y].update_idletasks()\n\
    \n    if first:\n        # If it's the first turn, the code remembers the button\
    \ press by storing\n        # the x and y coordinates.\n        previousX = x\n\
    \        previousY = y\n        first = False\n    # Second turn. This line includes\
    \ a check to stop the player cheating by\n    # pressing every button twice!\n\
    \    elif previousX != x or previousY != y:\n        # If the symbols don't match...\n\
    \        if buttons[previousX, previousY]['text'] != buttons[x, y]['text']:\n\
    \            # Wait 0.5 seconds to give the player time to see the symbols,\n\
    \            # then hide them.\n            time.sleep(0.5)\n            buttons[previousX,\
    \ previousY]['text'] = ''\n            buttons[x, y]['text'] = ''\n        else:\n\
    \            # If the symbols match...\n            # Disable the pair of matching\
    \ buttons so the player can't press them again.\n            buttons[previousX,\
    \ previousY]['command'] = DISABLED\n            buttons[x, y]['command'] = DISABLED\n\
    \            # This line gets the function ready for the first button press of\
    \ the next attempt.\n            first = True\n~~~\n```\n\n# ## How it works\n\
    \nThe function shows a button’s symbol by changing its text label to the Unicode\
    \ character we randomly assigned to it. We use update_idletasks() to tell Tkinter\
    \ to show this symbol right now. If it’s the first turn, we just store the button’s\
    \ coordinates in variables. If it’s the second turn, we need to check that the\
    \ player isn’t trying to cheat by hitting the same button twice. If they aren’t,\
    \ we check if the symbols match. If the symbols don’t match, we hide them by setting\
    \ the text to empty strings; if they do match, we leave them showing but disable\
    \ the buttons.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_187_0.png)"
  merge: -1
  img_proc: true
- pgno: 188
  md: "# # Hacks and tweaks\n\nYou could adapt this game in many ways. You can show\
    \ the number of moves taken to finish the game, so the player can try and beat\
    \ their own score or challenge their friends. You could also add more symbols\
    \ to make the game harder.\n\n# ## Show the number of moves\n\nAt the moment,\
    \ the player has no way of knowing how well they've done or if they've done any\
    \ better than their friends. How can we make the game more competitive? Let's\
    \ add a variable to count how many turns a player takes to finish the game. Then\
    \ players can compete to see who gets the lowest score.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_188_0.png)\n\
    \n> > Let's make the game more competitive!\n\n+   1. **Add a new module**\n+\
    \   \n+   *You need to import Tkinter's messagebox widget to display the number\
    \ of moves at the end of the game. In the import line, add the word messagebox\
    \ after DISABLED.*\n\n```\n~~~python\nfrom tkinter import Tk, Button, DISABLED,\
    \ messagebox\n~~~\n```\n\n+   2. **Make new variables**\n+   \n+   You'll have\
    \ to make two extra variables for this hack. One variable will keep track of the\
    \ number of moves the player makes, while the other will remember how many pairs\
    \ they've found. Give them both a starting value of 0. Put these lines below the\
    \ variable previousY.\n\n```\n~~~python\npreviousY = 0\nmoves = 0\npairs = 0\n\
    ~~~\n```\n\nThe player hasn't made any moves yet, or found any pairs, so the values\
    \ are 0.\n\n+   3. **Declare them global**\n+   \n+   The moves and pairs variables\
    \ are global variables, and they'll need to be changed by the show_symbol() function.\
    \ Let show_symbol() know this by putting these two lines near the top of the function.\n\
    \n```\n~~~python\nglobal first\nglobal previousX, previousY\nglobal moves\nglobal\
    \ pairs\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "# 4. Count the moves\n\nA move is two button presses (one matching attempt).\
    \ So you only need to add 1 to the moves value when the show_symbol() function\
    \ is called for the first or the second button press—not for both. Let’s do it\
    \ for the first button press. Change the show_symbol() function to look like this.\n\
    \n```\nif first:\n    previousX = x\n    previousY = y\n    first = False\n  \
    \  moves = moves + 1\n```\n\n# 5. Display a message\n\nNow add the following code\
    \ near the bottom of the show_symbol() function. It will track the number of pairs\
    \ found and show a message box at the end of the game telling the player how many\
    \ moves they took. When the player clicks the box’s OK button, the code calls\
    \ the close_window() function, which we’ll add next.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_189_0.png)\n\
    \n```\nbuttons[x, y]['command'] = DISABLED\npairs = pairs + 1\nif pairs == len(buttons)/2:\n\
    \    messagebox.showinfo('Matching', 'Number of moves: ' +\n                 \
    \       str(moves), command=close_window)\n```\n\nAdd 1 to the number of pairs\
    \ found.\n\nThis line displays a box showing the number of moves.\n\nIf all the\
