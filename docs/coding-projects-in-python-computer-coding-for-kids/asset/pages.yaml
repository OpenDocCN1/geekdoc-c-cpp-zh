- pgno: 111
  md: '# Countdown Calendar


    When you’re looking forward to an exciting event, it helps to know how much longer
    you have to wait. In this project, you’ll use Python’s Tkinter module to build
    a handy program that counts down to the big day.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_111_0.png)


    > > Hooray! It''s 0 days until my birthday!


    # What happens


    When you run the program it shows a list of future events and tells you how many
    days there are until each one. Run it again the next day and you’ll see that it
    has subtracted one day from each of the “days until” figures. Fill it with the
    dates of your forthcoming adventures and you’ll never miss an important day—or
    a homework deadline—again!


    Give your calendar a personalized title.


    ```

    ```

    My Countdown Calendar


    It is 20 days until Halloween

    It is 51 days until Spanish Test

    It is 132 days until School Trip

    It is 92 days until My Birthday

    ```

    ```


    A small window pops up when you run the program, with each event on a separate
    line.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# How it works


    The program learns about the important events by reading information from a text
    file—this is called “file input”. The text file contains the name and date of
    each event. The code calculates the number of days from today until each event
    using Python’s `datetime` module. It displays the results in a window created
    by Python’s `Tkinter` module.


    # ▽ Countdown Calendar flowchart


    In this project, the list of important events is created separately from the code
    as a text file. The program begins by reading in a list of all the events from
    this file. Once all the days have been calculated and displayed, the program ends.


    # ▷ Using Tkinter


    The `Tkinter` module is a set of tools that Python programmers use for displaying
    graphics and getting input from users. Instead of showing output in the shell,
    `Tkinter` can display results in a separate window that you’re able to design
    and style yourself.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_112_0.png)


    # Graphical user interface


    Tkinter is handy for creating what coders call a GUI (pronounced “gooey”). A GUI
    (graphical user interface) is the visible part of a program that a person interacts
    with, such as the system of icons and menus you use on a smartphone. Tkinter creates
    popup windows that you can add buttons, sliders, and menus to.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_112_1.png)


    A smartphone GUI uses icons to show how strong the WiFi signal is and how much
    power the battery has.


    Start


    Get today''s date


    Get the lists of important events from the text file


    Get an event


    Calculate the number of days until the event


    Display the result


    Calculated all events?


    N


    Y


    End'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Making and reading the text file


    All the information for your Countdown Calendar must be stored in a text file.
    You can create it using IDLE.


    # 1. Create a new file


    Open a new IDLE file, then type in a few upcoming events that are important to
    you. Put each event on a separate line and type a comma between the event and
    its date. Make sure there is no space between the comma and the event date.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_113_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_113_1.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_113_2.png)


    events.txt


    Halloween,31/10/17

    Spanish Test,01/12/17

    School Trip,20/02/18

    My Birthday,11/01/18


    The name of the event comes first.


    Type the date as day/month/year.


    # 2. Save it as a text file


    Next save the file as a text file. Click the File menu, choose Save As, and call
    the file ‘events.txt’. Now you’re ready to start coding the Python program.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_113_3.png)


    Close

    Save

    Save As...

    Save Copy As...


    # 3. Open a new Python file


    You now need to create a new file for the code. Save it as “countdown_calendar.py”
    and make sure it’s in the same folder as your ‘events.txt’ file.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_113_4.png)


    # 4. Set up the modules


    This project needs two modules: Tkinter and datetime. Tkinter will be used to
    build a simple GUI, while datetime will make it easy to do calculations using
    dates. Import them by typing these two lines at the top of your new program:


    ```

    ```python

    from tkinter import Tk, Canvas

    from datetime import date, datetime

    ```

    ```


    Import the Tkinter and datetime modules.'
