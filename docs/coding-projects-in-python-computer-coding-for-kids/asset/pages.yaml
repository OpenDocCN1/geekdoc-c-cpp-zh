- pgno: 115
  md: "# ### 8 Open the text file\n\nThis next bit of code will open the file called\
    \ events.txt so the program can read it. Type in this line underneath your code\
    \ from Step 7.\n\n```\n```python\ndef get_events():\n    list_events = []\n  \
    \  with open('events.txt') as file:\n```\n```\n\nThis line opens the text file.\n\
    \n# ### 9 Start a loop\n\nNow add a for loop to bring information from the text\
    \ file into your program. The loop will be run for every line in the events.txt\
    \ file.\n\n```\n```python\ndef get_events():\n    list_events = []\n    with open('events.txt')\
    \ as file:\n        for line in file:\n```\n```\n\nRun the loop for each line\
    \ in the text file.\n\n# ### 10 Remove the invisible character\n\nWhen you typed\
    \ your information into the text file in Step 1, you pressed enter/return key\
    \ at the end of each line. This added an invisible “new line” character at the\
    \ end of every line. Although you can’t see this character, Python can. Add this\
    \ line of code, which tells Python to ignore these invisible characters when it\
    \ reads the text file.\n\n```\n```python\nwith open('events.txt') as file:\n \
    \   for line in file:\n        line = line.rstrip('\\n')\n```\n```\n\nRemove the\
    \ newline character from each line.\n\nThe newline character is represented as\
    \ ('\\n') in Python.\n\n# ### 11 Store the event details\n\nAt this point, the\
    \ variable called line holds the information about each event as a string, such\
    \ as Halloween, 31/10/2017. Use the split() command to chop this string into two\
    \ parts. The parts before and after the comma will become separate items that\
    \ you can store in a list called current_event. Add this line after your code\
    \ in Step 10.\n\n```\n```python\nfor line in file:\n    line = line.rstrip('\\\
    n')\n    current_event = line.split(',')\n```\n```\n\nSplit each event into two\
    \ parts at the comma.\n\n# ## EXPERT TIPS\n### Datetime module\n\nPython’s datetime\
    \ module is very useful if you want to do calculations involving dates and time.\
    \ For example, do you know what day of the week you were born on? Try typing this\
    \ into the Python shell to find out.\n\nType your birthday in this format: year,\
    \ month, day.\n\n```\n```python\n>>> from datetime import date\n>>> print(date(2007,\
    \ 12, 4).weekday())\n1\n```\n```\n\nThis number represents the day of the week,\
    \ where Monday is 0 and Sunday is 6. So December 4, 2007, was a Tuesday."
  merge: -1
  img_proc: true
- pgno: 116
  md: "# ### REMEMBER — List positions\n\nWhen Python numbers the items in a list,\
    \ it starts from 0. So the first item in your current_event list, “Halloween”,\
    \ is in position 0, while the second item, “31/10/2017”, is in position 1. That’s\
    \ why the code turns current_event[1] into a date.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_116_0.png)\n\
    \n# ### 12 Using datetime\n\nThe event Halloween is stored in current_event as\
    \ a list containing two items: “Halloween” and “31/10/2017”. Use the datetime\
    \ module to convert the second item in the list (in position 1) from a string\
    \ into a form that Python can understand as a date. Add these lines of code at\
    \ the bottom of the function.\n\nTurns the second item in the list from a string\
    \ into a date.\n\n```\n```python\n        current_event = line.split(',')\n  \
    \      event_date = datetime.strptime(current_event[1], '%d/%m/%y').date()\n \
    \       current_event[1] = event_date\n```\n```\n\nSet the second item in the\
    \ list to be the date of the event.\n\n# ### 13 Add the event to the list\n\n\
    Now the current_event list holds two things: the name of the event (as a string)\
    \ and the date of the event. Add current_event to the list of events. Here’s the\
    \ whole code for the get_events() function.\n\n```\n```python\ndef get_events():\n\
    \    list_events = []\n    with open('events.txt') as file:\n        for line\
    \ in file:\n            line = line.rstrip('\\n')\n            current_event =\
    \ line.split(',')\n            event_date = datetime.strptime(current_event[1],\
    \ '%d/%m/%y').date()\n            current_event[1] = event_date\n            list_events.append(current_event)\n\
    \    return list_events\n```\n```\n\nAfter this line is run, the program loops\
    \ back to read the next line from the file.\n\nAfter all the lines have been read,\
    \ the function hands over the complete list of events to the program."
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Setting the countdown\n\nIn the next stage of building Countdown Calendar\
    \ you’ll create a function to count the number of days between today and your\
    \ important events. You’ll also write the code to display the events on the Tkinter\
    \ canvas.\n\n# 14  Count the days\n\nCreate a function to count the number of\
    \ days between two dates. The datetime module makes this easy, because it can\
    \ add dates together or subtract one from another. Type the code shown here below\
    \ your get_events() function. It will store the number of days as a string in\
    \ the variable time_between.\n\n```\n```python\ndef days_between_dates(date1,\
    \ date2):\n    time_between = str(date1-date2)\n```\n```\n\nThe function is given\
    \ two dates.\n\nThis variable stores the result as a string.\n\nThe dates are\
    \ subtracted to give the number of days between them.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_117_0.png)\n\
    \n# 15  Split the string\n\nIf Halloween is 27 days away, the string stored in\
    \ time_between would look like this: '27 days, 0:00:00' (the zeros refer to hours,\
    \ minutes, and seconds). Only the number at the beginning of the string is important,\
    \ so you can use the split() command again to get to the part you need. Type the\
    \ code highlighted below after the code in Step 14. It turns the string into a\
    \ list of three items: '27', 'days', '0:00:00'. The list is stored in number_of_days.\n\
    \n```\n```python\ndef days_between_dates(date1, date2):\n    time_between = str(date1-date2)\n\
    \    number_of_days = time_between.split(' ')\n```\n```\n\nThis time the string\
    \ is split at each blank space.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_117_1.png)\n\
    \n# 16  Return the number of days\n\nTo finish off this function, you just need\
    \ to return the value stored in position 0 of the list. In the case of Halloween,\
    \ that’s 27. Add this line of code to the end of the function.\n\n```\n```python\n\
    def days_between_dates(date1, date2):\n    time_between = str(date1-date2)\n \
    \   number_of_days = time_between.split(' ')\n    return number_of_days[0]\n```\n\
    ```\n\nThe number of days between the dates is held at position 0 in the list."
  merge: -1
  img_proc: true
