- pgno: 149
  md: "# Show the happy face\n\nNext, create a function called `show_happy()` to reveal\
    \ the happy expression when you move the mouse-pointer over Screen Pet as if you\
    \ were stroking it. Type this code beneath the `blink()` function you added in\
    \ Step 8.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_149_0.png)\n\n# Event handler\n\
    \nThe function `show_happy()` is an event handler. This means it’s only called\
    \ when a particular event happens, so that it can deal with it. In your code,\
    \ stroking your pet calls `show_happy()`. In real life, you might call a “mop\
    \ the floor” function to handle a “spill drink” event!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_149_1.png)\n\
    \nThe if line checks to see if the mouse-pointer is over the pet.\n\n```\n```python\n\
    root.after(3000, blink)\n\ndef show_happy(event):\n    if (20 <= event.x <= 350)\
    \ and (20 <= event.y <= 350):\n        c.itemconfigure(cheek_left, state=NORMAL)\n\
    \        c.itemconfigure(cheek_right, state=NORMAL)\n        c.itemconfigure(mouth_happy,\
    \ state=NORMAL)\n        c.itemconfigure(mouth_normal, state=HIDDEN)\n       \
    \ c.itemconfigure(mouth_sad, state=HIDDEN)\n    return\n```\n```\n\nevent.x and\
    \ event.y are the coordinates of the mouse-pointer.\n\nShow the pink cheeks.\n\
    \nShow the happy mouth.\n\nHide the normal mouth.\n\nHide the sad mouth.\n\n#\
    \ Expert tips — Focus\n\nTkinter won’t be able to see you moving the mouse-pointer\
    \ over the window to stroke Screen Pet unless the window is “in focus.” You can\
    \ get it in focus by clicking once anywhere in the window.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_149_2.png)\n\
    \n# 12 Happy moves\n\nWhen the program starts, Screen Pet blinks without you doing\
    \ anything. But to get it to look happy when it’s being stroked, you need to tell\
    \ it what event to look out for. Tkinter calls the mouse-pointer moving over its\
    \ window a `<Motion>` event. You need to link this to the handler function by\
    \ using Tkinter’s `bind()` command. Add this line to the main part of your program.\
    \ Then run the code and stroke the pet to try it out.\n\n```\n```python\nc.pack()\n\
    c.bind('<Motion>', show_happy)\nroot.after(1000, blink)\nroot.mainloop()\n```\n\
    ```\n\nThis command links the moving mouse-pointer to the happy face."
  merge: -1
  img_proc: true
- pgno: 150
  md: "# 13. Hide the happy face\n\nYou only want Screen Pet to look really happy\
    \ when you're actually stroking it. Add a new function, `hide_happy()`, below\
    \ the code for `show_happy()`. (This new code will set Screen Pet's expression\
    \ back to normal.)\n\n```\n```python\ndef hide_happy(event):\n    c.itemconfigure(cheek_left,\
    \ state=HIDDEN)\n    c.itemconfigure(cheek_right, state=HIDDEN)\n    c.itemconfigure(mouth_happy,\
    \ state=HIDDEN)\n    c.itemconfigure(mouth_normal, state=NORMAL)\n    c.itemconfigure(mouth_sad,\
    \ state=HIDDEN)\n    return\n```\n```\n\nHide the pink cheeks.\n\nHide the happy\
    \ mouth.\n\nShow the normal mouth.\n\nHide the sad mouth.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_150_0.png)\n\
    \nDon't forget to save your work.\n\n# 14. Call the function\n\nType this line\
    \ to call `hide_happy()` when the mouse pointer leaves the window. It links Tkinter's\
    \ `<Leave>` event to `hide_happy()`. Now test your code.\n\n```\n```python\nc.bind('<Motion>',\
    \ show_happy)\nc.bind('<Leave>', hide_happy)\n\nroot.after(1000, blink)\n```\n\
    ```\n\n# What cheek!\n\nSo far, your pet has been very well behaved. Let's give\
    \ it a cheeky personality! You can add some code that will make Screen Pet stick\
