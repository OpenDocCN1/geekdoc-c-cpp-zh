  md: "# # Installing Python\n\nAll the projects in this book use Python 3, so make\
    \ sure you download the correct version from the website. Follow the instructions\
    \ that match your computer.\n\n# ## Python on Windows\n\nBefore you install Python\
    \ 3 on a Windows PC, find out if it uses the 32-bit or 64-bit version of Windows.\
    \ Click “Start”, right-click “Computer”, and left-click “Properties”. Then choose\
    \ “System” if the option appears.\n\n# ### IDELE\n\nIDLE (short for Integrated\
    \ Development Environment) is a free app that you get when you install Python.\
    \ Designed for beginners, IDLE includes a basic text editor that allows you to\
    \ write and edit Python code.\n\n+   1. **Go to the Python website**\n+   \n+\
    \      Type the address below into your web browser to go to the Python website.\
    \ Then click on “Downloads” to open the download page.\n+   \n+      `https://www.python.org/`\n\
    \n+   2. **Download Python**\n+   \n+      Click on the latest version of Python\
    \ for Windows, beginning with the number 3. The installer file will download automatically.\
    \ Of the different installer options, select the executable installer.\n+   \n\
    +      - Python 3.6.0a4 - 2016-08-15\n+      - Windows x86 executable installer\n\
    +      - Windows x86-64 executable installer\n\n+   3. **Run the installer**\n\
    +   \n+      Double-click the installer file to install Python. Choose “install\
    \ for all users” and click “next” at each prompt, without changing the default\
    \ settings.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_17_0.png)\n\nClick the\
    \ installer.\n\nIf you have a 32-bit version of Windows, use this installer.\n\
    \nIf you have a 64-bit version of Windows, use this installer.\n\n+   4. **Open\
    \ IDLE**\n+   \n+      When the installation is finished, check that it was successful\
    \ by opening the IDLE program. Go to the “Start” menu, choose “All Apps”, then\
    \ select IDLE. A window like the one below should open up.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_17_1.png)\n\
    \n```\n```text\nPython 3.6.0a4 Shell\nIDLE    File    Edit    Shell    Debug \
    \   Window    Help\nPython 3.6.0a4 (v3.6.0a4:017f260936, Aug 15 2016, 00:45:10)\
    \ [MSC v.1900 32 bit (Intel)] on win32\nType \"copyright\", \"credits\" or \"\
    license()\" for more information.\n>>>\n```\n```"
