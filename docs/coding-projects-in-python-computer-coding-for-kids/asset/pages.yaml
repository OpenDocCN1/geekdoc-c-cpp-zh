  md: "# ▷ **How it works**\n\nThe loop condition in Ahmed’s program is `answer ==\
    \ 'y'`. This means that the user wants to add a hippo. In the body of the loop\
    \ we add one to the number of hippos already, and then ask the user if they want\
    \ to add another. If they answer by typing “y” (for yes), the loop condition is\
    \ True so we go around the loop again. If they answer “n” (no), the loop condition\
    \ is False and the program leaves the loop.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_35_0.png)\n\
    \n# ## Infinite loops\n\nSometimes you may want a `while` loop to keep going for\
    \ as long as the program is running. This kind of loop is called an infinite loop.\
    \ Lots of video-game programs use an infinite loop known as a main loop.\n\n```\n\
    ```python\n>>> while True:\n    print('This is an infinite loop!')\n```\n```\n\
    \nThere is no False option to escape the loop.\n\n# △ **Into infinity**\n\nYou\
    \ make an infinite loop by setting the loop condition to a constant value: True.\
    \ Because this value never changes, the loop will never exit. Try this `while`\
    \ loop in the shell. It has no False option, so the loop will print “This is an\
    \ infinite loop!” nonstop until you quit the program.\n\n# ▽ **Escaping infinity**\n\
    \nYou can deliberately use an infinite loop to get input from the user. This (annoying)\
    \ program asks if the user is bored. As long as they type “n”, it keeps asking\
    \ the question. If they get fed up and type “y”, it tells them they’re rude and\
    \ uses the `break` command to leave the loop!\n\n```\n```python\n>>> while True:\n\
    \    answer = input('Are you bored yet? (y/n)')\n    if answer == 'y':\n     \
    \   print('How rude!')\n        break\n```\n```\n\nThe True condition is that\
    \ the user is not bored yet (`'n'`).\n\nThe False condition (`'y'`) triggers the\
    \ `break` command.\n\n# ### EXPERT TIPS\n**Stopping the loop**\n\nIf you don’t\
    \ want an infinite loop, it’s important to make sure that the body of a `while`\
    \ loop does something that could make the loop condition False. But don’t worry—if\
    \ you accidentally code an infinite loop, you can escape from it by pressing the\
    \ C key while holding down the Ctrl (control) key. You may have to press Ctrl+C\
    \ several times before you quit the loop.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_35_1.png)"
