- pgno: 75
  md: "# Drawing rectangles\n\nLet’s begin by importing the Turtle module and using\
    \ it to create a function that draws rectangles.\n\n# 1  Create a new file\n\n\
    Open IDLE and create a new file. Save it as “robot_builder.py”.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_75_0.png)\n\
    \n# 2  Import the Turtle module\n\nType this line at the top of your program.\
    \ The command import turtle as t lets you use functions from the Turtle module\
    \ without having to type “turtle” in full each time. It’s like calling someone\
    \ whose name is Benjamin “Ben” for short.\n\n```\n```python\nimport turtle as\
    \ t\n```\n```\n\nThis gives the Turtle module the nickname “t”.\n\n# 3  Create\
    \ a rectangle function\n\nNow make the function to draw the blocks that you’re\
    \ going to use to build your robot. The function has three parameters: the length\
    \ of the horizontal side, the length of the vertical side, and color. You’ll use\
    \ a loop that draws one horizontal side and one vertical side each time it runs,\
    \ and you’ll make it run twice. Put this rectangle function under the code you\
    \ added in Step 2.\n\nLike all programming languages, Python uses the US spelling\
    \ “color”.\n\n```\n```python\ndef rectangle(horizontal, vertical, color):\n  \
    \  t.pendown()\n    t.pensize(1)\n    t.color(color)\n    t.begin_fill()\n   \
    \ for counter in range(1, 3):\n        t.forward(horizontal)\n        t.right(90)\n\
    \        t.forward(vertical)\n        t.right(90)\n    t.end_fill()\n    t.penup()\n\
    ```\n```\n\nPut the turtle’s pen down to start drawing.\n\nUsing range(1, 3) makes\
    \ the loop run twice.\n\nPull the turtle’s pen back up to stop drawing.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_75_1.png)\n\
    \nThis block draws the rectangle.\n\nThe turtle draws the sides in the order shown\
    \ here.\n\n# EXPERT TIPS\n\n# Turtle mode\n\nYou’ll be using the turtle in its\
    \ standard mode. This means the turtle starts off facing the right side of the\
    \ screen. If you set the heading (another word for direction) to 0, it will face\
    \ right. Setting the heading to 90 makes it point to the top of the screen, 180\
    \ points it to the left, and 270 makes it point to the bottom of the screen.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_75_2.png)\n\nThe turtle normally looks\
    \ like an arrowhead. This line changes it to a turtle shape.\n\n```\n```python\n\
    t.shape('turtle')\nt.setheading(0)\nt.forward(80)\n```\n```"
