- pgno: 159
  md: '# # Caterpillar


    If all this coding has worked up your appetite, you’re not alone—the star of this
    project is a hungry caterpillar. Using Python’s turtle module, you’ll find out
    how to animate game characters and control them on screen with the keyboard.


    # ## What happens


    You use the four arrow keys to steer a caterpillar around the screen and make
    it “eat” leaves. Each leaf gives you a point, but it also makes the caterpillar
    bigger and faster, making the game harder. Keep the caterpillar inside the game
    window, or the game’s over!


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_159_0.png)


    > > Maybe it’s time you turned over a new leaf!


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_159_1.png)


    Your score is displayed at the top of the game window.


    The leaf disappears when eaten, and a new leaf then appears elsewhere.


    To start the game, the player has to click on the screen first and then press
    the space bar.


    # ### Increasing difficulty


    The more leaves the caterpillar eats, the harder the game becomes. As the caterpillar
    gets longer and faster, your reactions have to speed up too; otherwise, your caterpillar
    will zoom off the screen.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "![](img/6b18a113f7aa9338e32f3ac1fa217987_160_0.png)\n\n# ## How it works\n\n\
    This project uses two main turtles: one to draw the caterpillar and one to draw\
    \ the leaves. The code places each new leaf at a random location. When the program\
    \ detects that a leaf has been eaten, the variables storing the score, the speed\
    \ of the caterpillar, and its length are increased. A function figures out if\
    \ the caterpillar has moved outside the window, which would signal the end of\
    \ the game.\n\n# ### ◁ Caterpillar flowchart\n\nTo make the caterpillar move across\
    \ the screen you’ll use an infinite loop. Each time the loop goes round, the caterpillar\
    \ moves forward slightly. When the loop repeats quickly, these small movements\
    \ create the illusion that your caterpillar is crawling.\n\n# ## First steps\n\
    \nFor such a fun game, the code is surprisingly straightforward. You’ll start\
    \ by setting up the turtles, before moving on to the main game loop and finally\
    \ the keyboard controls.\n\n+   1. **Getting started**  \n+      Open IDLE and\
    \ create a new file. Save it as “caterpillar.py”.\n\n+   2. **Import the modules**\
    \  \n+      Add these two import statements to tell Python that you need the turtle\
    \ and random modules. The third line sets the background color for the game window.\n\
    \nThis adds a yellow background.\n\n```\n```python\nimport random\nimport turtle\
    \ as t\n\nt.bgcolor('yellow')\n```\n```"
  merge: -1
  img_proc: true
- pgno: 161
  md: "# Create a caterpillar turtle\n\nNow create the turtle that will become your\
    \ caterpillar. Add the code shown here. It creates the turtle and sets its color,\
    \ shape, and speed. The function `caterpillar.penup()` disables the turtle’s pen,\
    \ allowing you to move the turtle around the screen without drawing a line along\
    \ the way.\n\n```\n```python\ncaterpillar = t.Turtle()\ncaterpillar.shape('square')\n\
    caterpillar.color('red')\ncaterpillar.speed(0)\ncaterpillar.penup()\ncaterpillar.hideturtle()\n\
    ```\n```\n\nCreate a new turtle for the caterpillar.\n\nWe don’t want the turtle\
    \ to move before the game starts.\n\nThis command hides the turtle.\n\n# Create\
    \ a leaf turtle\n\nBelow the code for Step 3, type these lines to set up the second\
    \ turtle, which will draw the leaves. The code uses a list of six coordinate pairs\
    \ to draw a leaf shape. Once you tell the turtle about this shape, it can reuse\
    \ the details to draw more leaves. A call to `hideturtle` here makes this turtle\
    \ invisible on the screen.\n\n```\n```python\nleaf = t.Turtle()\nleaf_shape =\
    \ ((0, 0), (14, 2), (18, 6), (20, 20), \\\n              (6, 18), (2, 14))\nt.register_shape('leaf',\
    \ leaf_shape)\nleaf.shape('leaf')\nleaf.color('green')\nleaf.penup()\nleaf.hideturtle()\n\
    leaf.speed(0)\n```\n```\n\nThis turtle will draw the leaves.\n\nThe coordinates\
    \ for leaf shape\n\nUse a backslash character if you need to split a long line\
    \ of code over two lines.\n\nThis line tells the turtle about the leaf shape.\n\
    \n# Add some text\n\nNow set up two more turtles to add text to the game. One\
    \ will display a message before the action starts, telling players to press the\
    \ space bar to begin. The other will write the score in the corner of the window.\
    \ Add these lines after the leaf turtle code.\n\n```\n```python\ngame_started\
    \ = False\ntext_turtle = t.Turtle()\ntext_turtle.write('Press SPACE to start',\
