  md: "# # Using IDLE\n\nIDLE has two different windows in which you can work. The\
    \ editor window can be used to write and save programs, while the shell window\
    \ runs Python instructions immediately.\n\n# ## The shell window\n\nWhen you open\
    \ IDLE, the shell window pops up. This is the best place to get started in Python\
    \ because you don’t have to create a new file first. Just type the code directly\
    \ into the shell window.\n\n# ### Working in the shell\n\nThe code you type can\
    \ be run straight away, and any messages or “bugs” (errors) are displayed. You\
    \ can use the shell window like a notepad, to test out snippets of code before\
    \ you add them into a bigger program.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_19_0.png)\n\
    \nThis line shows which version of Python you have.\n\nYou type the code in at\
    \ the >>> prompt.\n\nThe text here will depend on which operating system you have.\n\
    \nThese four lines of code are a simple drawing program; try it out for yourself!\n\
    \n```\n```python\n>>> from turtle import *\n>>> forward(200)\n>>> left(90)\n>>>\
    \ forward(300)\n>>> \n```\n```\n\n# ### Give the shell a test run\n\nType each\
    \ of these code snippets into the shell window and press enter/return after each\
    \ one. The first line displays a message and the second line does a calculation.\
    \ Can you work out what the third line does?\n\n```\n```python\n>>> print('I am\
    \ 10 years old')\n\n>>> 123 + 456 * 7 / 8\n\n>>> ''.join(reversed('Time to code'))\n\
    ```\n```\n\n# EXPERT TIPS\n\n# ### Different windows\n\nTo help you know which\
    \ window you should type your code in, we’ve given each window in IDLE a different\
    \ color.\n\n+   - Shell window\n+   - Editor window\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_19_1.png)"
  merge: -1
  img_proc: true
- pgno: 20
  md: "# The editor window\n\nThe shell can’t save your code, so when you close the\
    \ shell window the code you typed is lost forever. That’s why you should use IDLE’s\
    \ editor window when you work on a project. This window lets you save your code.\
    \ It also has built-in tools to help you write your programs and to trouble-shoot\
    \ any errors.\n\n# ▽ The editor window\n\nTo open the editor window in IDLE, click\
    \ on the File menu at the top, and choose New File. An empty editor window will\
    \ then appear. You’ll use the editor window to write and run programs for the\
    \ projects in this book.\n\nYou type the code in here. This program prints a list\
    \ that tells you which numbers are even and which ones are odd.\n\nThe name of\
    \ the file is shown here.\n\nYou can run your programs from this menu.\n\nThe\
    \ menu bar for the editor window is different to the one for the shell.\n\n```\n\
    ```python\nEvenOdd.py\nIDLE   File   Edit   Format   Run   Window   Help\n\nfor\
    \ counter in range(10):\n    if (counter % 2) == 0:\n        print(counter)\n\
    \        print('is even')\n    else:\n        print(counter)\n        print('is\
    \ odd')\n```\n```\n\nAnything you tell Python to print gets displayed in the shell\
    \ window.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_20_0.png)\n\n# EXPERT TIPS\n\
    \n# Colors in the code\n\nIDLE automatically colors the text to highlight different\
    \ parts of the code. The colors make it easier to understand the code, and they’re\
    \ useful when you’re trying to spot mistakes.\n\n+   - **Symbols and names** —\
    \ Most code text is colored black.\n+   - **Keywords** — Certain words, such as\
    \ “if” and “else”, are special words that Python uses. They are called keywords\
    \ and are shown in orange.\n+   - **Output** — Any text produced when a program\
    \ runs is blue.\n+   - **Text in quotes** — Text in quote marks is green. A green\
    \ bracket around text shows you’re missing a quote mark.\n+   - **Built-in commands**\
    \ — Python commands, such as “print”, are shown in purple.\n+   - **Errors** —\
    \ Python uses red to alert you to any errors in your code."
