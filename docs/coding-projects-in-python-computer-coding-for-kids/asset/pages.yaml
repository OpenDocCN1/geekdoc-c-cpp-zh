    \nDraw a green square for the main part of the hand.\n\nDraw a small rectangle\
    \ in the background color to give the grip shape.\n\n# All-in-one arms\n\nDrawing\
    \ the arms in several parts makes it awkward to reposition them or to add extra\
    \ arms. In this hack, you’ll write a function that draws an arm all in one go.\n\
    \n# Create an arm function\n\nFirst add this new function, which draws an arm\
    \ shape and gives it color.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_81_1.png)\n\
    \n```\n```python\nt.penup()\n\ndef arm(color):\n    t.pendown()\n    t.begin_fill()\n\
    \    t.color(color)\n    t.forward(60)\n    t.right(90)\n    t.forward(50)\n \
    \   t.right(90)\n    t.forward(10)\n    t.right(90)\n    t.forward(40)\n    t.left(90)\n\
    \    t.forward(50)\n    t.right(90)\n    t.forward(10)\n    t.end_fill()\n   \
    \ t.penup()\n    t.setheading(0)\n```\n```\n\nThis line colors in the shape formed\
    \ by the following moves.\n\nSet the color.\n\nThe turtle follows these commands\
