  md: "# Draw your Screen Pet\n\nLet’s get started. First you need to create the window\
    \ where your Screen Pet will live. Then you’ll write some code to draw the pet\
    \ on the screen.\n\n+   1. **Make a new file**  \n+      Open IDLE. Go to the\
    \ File menu and select New File, then save the file as “screen_pet.py”.\n\n+ \
    \  2. **Add the Tkinter module**  \n+      You need to import parts of Python’s\
    \ Tkinter module at the start of your program. Type this code to bring in Tkinter\
    \ and open a window where your Screen Pet will live.\n\n+   3. **Make a new canvas**\
    \  \n+      In the window, make a dark blue canvas called “c”, on which you’ll\
    \ draw your pet. After this code and after the line that opens the Tkinter window.\
    \ These four lines of new code are the start of the main part of your program.\n\
    \n+   4. **Run it**  \n+      Now try running the program. What do you notice?\
