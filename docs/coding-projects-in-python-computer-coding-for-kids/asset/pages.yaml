    \ - 100, canvas_width + 5, canvas_height + 5, \\\n                   fill='sea\
    \ green', width=0)\nc.create_oval(-80, -80, 120, 120, fill='orange', width=0)\n\
    c.pack()\n\ncolor_cycle = cycle(['light blue', 'light green', 'light pink', 'light\
    \ yellow', 'light cyan'])\negg_width = 45\negg_height = 55\negg_score = 10\negg_speed\
    \ = 500\negg_interval = 4000\ndifficulty_factor = 0.95\n\ncatcher_color = 'blue'\n\
    catcher_width = 100\ncatcher_height = 100\ncatcher_start_x = canvas_width / 2\
    \ - catcher_width / 2\ncatcher_start_y = canvas_height - catcher_height - 20\n\
