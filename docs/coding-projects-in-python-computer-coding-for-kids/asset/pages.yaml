- pgno: 60
  md: '# Using a module


    To use a module in your code, you have to tell Python that you would like to include
    it. You instruct Python which modules to include using import statements. There
    are a few different ways that you can do this, depending on what you need from
    the module.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_60_0.png)


    # ▷ import...


    Typing the keyword import allows you to use all the contents of a module. However,
    you need to put the module’s name before any function you use. This code imports
    all the webbrowser module and uses its open() function to open the Python website
    in the computer’s browser.


    ```

    >>> import webbrowser

    >>> webbrowser.open(''https://docs.python.org/3/library/'')

    ```


    This line imports the whole webbrowser module.


    The name of the module comes before the function.


    # ▷ from... import...


    If you only want to use a particular part of a module, you can import just that
    part by adding the from keyword. Now you can just use the function on its own.
    This code imports the random module’s choice() function. The function picks a
    random item from any list you give it.


    ```

    >>> from random import choice

    >>> direction = choice([''N'', ''S'', ''E'', ''W''])

    >>> print(direction)

    W

    ```


    Only the choice function is imported from the random module.


    No module name is needed.


    The code prints a random direction.


    # ▷ from... import... as...


    Sometimes you may want to change the name of an imported module or function, perhaps
    because you’ve already used that name or maybe it isn’t clear enough. To do this,
    use the keyword as followed by the new name. In the example shown here, the time()
    function, which we’ve renamed time_now(), gives us the current time. The time
    given is the exact number of seconds since 00:00 on January 1, 1970—a date used
    by most computers as the start of their clock.


    ```

    >>> from time import time as time_now

    >>> now = time_now()

    >>> print(now)

    1478092571.003539

    ```


    This line imports and renames the time() function.


    This variable uses the function’s new name.


    The number of seconds since 00:00 on January 1, 1970


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_60_1.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # Nine Lives


    In this nerve-shredding game, you have to guess the secret word one letter at
    a time. If your guess is wrong, you lose a life. Choose your letters carefully,
    because you only have nine lives. Lose all your lives, and it’s game over!


    # ## What happens


    The program shows you a mystery word with its letters replaced by question marks.
    If you guess a letter correctly, the program replaces the question mark with the
    correct letter. When you think you know what the word is, type it out in full.
    The game ends once you enter the correct word or have no lives left.


    The clue shows the mystery word as question marks.


    The number of lives you have left is shown by hearts.


    ```

    [''?'', ''?'', ''?'', ''?'', ''?'']

    Lives left: ♥♥♥♥♥♥♥♥♥

    Guess a letter or the whole word: a

    [''?'', ''?'', ''?'', ''?'', ''a'']

    Lives left: ♥♥♥♥♥♥♥♥♥

    Guess a letter or the whole word: y

    [''?'', ''?'', ''?'', ''?'', ''a'']

    Lives left: ♥♥♥♥♥♥♥♥♥

    Guess a letter or the whole word: p

    Incorrect. You lose a life

    [''?'', ''?'', ''?'', ''?'', ''a'']

    Lives left: ♥♥♥♥♥♥♥♥

    Guess a letter or the whole word: p

    [''p'', ''?'', ''?'', ''?'', ''a'']

    Lives left: ♥♥♥♥♥♥♥♥

    Guess a letter or the whole word: z

    Incorrect. You lose a life

    [''p'', ''?'', ''?'', ''?'', ''a'']

    Lives left: ♥♥♥♥♥♥♥

    Guess a letter or the whole word: pizza

    You won! The secret word was pizza

    ```


    Each correct letter guessed reveals one or more letters in the secret word.


    Each wrong guess makes a heart disappear.


    If you know the word, type it in to win the game.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_61_0.png)'
