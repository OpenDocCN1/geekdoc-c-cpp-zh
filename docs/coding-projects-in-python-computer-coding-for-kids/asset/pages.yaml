- pgno: 99
  md: '# # Mutant Rainbow


    You can program Python’s turtle to draw all sorts of patterns and designs. But
    watch out! Looks like the turtle in this project has gone a bit wild—you wouldn’t
    see rainbows like this in the sky!


    # ## What happens


    The program will ask you to choose the length and thickness of the line that the
    turtle paints. The turtle then scurries around the screen until you stop the program,
    painting colored lines as it goes. The type of pattern it makes will change, depending
    on the length and thickness of the lines.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_99_0.png)


    Python Turtle Graphics


    The turtle has a “pen” that paints lines as the turtle moves over the window.


    # ## EXPERT TIPS


    # ### Which color next?


    In Mutant Rainbow, you’ll use the `choice()` function from Python’s random library
    to pick a color when you tell the turtle to draw a line. This means that you can’t
    really predict which color the turtle will use each time.


    ```

    ```python

    t.pencolor(random.choice(pen_colors))

    ```

    ```


    The turtle chooses from the six colors you put in the list `pen_colors`.'
