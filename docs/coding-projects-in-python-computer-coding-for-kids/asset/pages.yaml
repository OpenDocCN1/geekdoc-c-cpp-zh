  md: "# # Screen Pet\n\nHave you ever wished you had a pet to keep you company while\
    \ doing your homework on your computer? In this project, you'll create a pet that\
    \ “lives” in a corner of your computer screen. It will keep you busy, because\
    \ you'll need to look after your pet to keep it happy.\n\n# ## What happens\n\n\
    When you start the program, Screen Pet will sit there, with a little smile on\
    \ its face, blinking at you. Your cute, sky-blue companion will change its expression\
    \ from normal (below) to happy, cheeky, or sad, depending on how you interact\
    \ with it on the screen. But don't worry, it's friendly—it won't bite if it gets\
    \ bored!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_143_0.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_143_1.png)\n\
    \n**Happy face**  \nIf you “stroke it” with the mouse-pointer, Screen Pet beams\
    \ and blushes.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_143_2.png)\n\n**Cheeky\
    \ face**  \nIf you double-click on it to “tickle” it, the cheeky pet sticks out\
    \ its tongue.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_143_3.png)\n\n**Sad\
    \ face**  \nIf you ignore it, Screen Pet will become sad. Stroking it will cheer\
    \ it up again.\n\nScreen Pet appears in a Tkinter window."
