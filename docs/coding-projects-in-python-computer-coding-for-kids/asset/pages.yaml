  md: "# Ride the rollercoaster\n\nA sign at the theme park says you must be over\
    \ 8 years old and taller than 4 feet 7 inches to ride the rollercoaster. Mia is\
    \ 10 years old and 5 feet tall. Let’s use the shell to check whether she can go\
    \ for a ride. Type the following lines of code to create variables for Mia’s age\
    \ and height and assign the correct values to them. Type the rules for going on\
    \ the rollercoaster as a Boolean expression, then hit the enter/return key.\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_31_0.png)\n\n> “You can’t ride—you’re\
    \ too small!”\n\n> “But I’m 100 years old!”\n\nThese two lines assign values to\
    \ these variables.\n\n```\n```python\n>>> age = 10\n>>> height = 1.5\n\n>>> (age\
    \ > 8) and (height > 53 inches)\n\nTrue\n```\n```\n\nThis is a Boolean expression\
    \ meaning older than 8 and more than 4 ft 7 in tall.\n\nMia can go on the rollercoaster!\n\
    \n# Branching\n\nComputers often need to make decisions about which parts of a\
    \ program to run. This is because most programs are designed to do different things\
    \ in different situations. The route through the program splits like a path branching\
    \ off into side paths, each leading to a different place.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_31_1.png)\n\
    \n# Condition\n\nA condition is a Boolean expression (a true-or-false comparison)\
    \ that helps a computer decide which route to take when it reaches a branch in\
    \ the code.\n\n+   - **School or park?**\n+   \n+   Imagine you have to decide\
    \ which route to walk each day based on the answer to the question “Is today a\
    \ weekday?” If it’s a weekday, you take the route to school; if it’s not, you\
    \ take the route to the park. In Python, the different routes through a program\
    \ lead to different blocks of code. A block can be one statement or several, all\
    \ indented by four spaces. The computer uses a test called a condition to figure\
    \ out which blocks it should run next."
