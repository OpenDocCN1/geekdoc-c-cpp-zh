  md: "# Set up the turtle\n\nThe code shown here calls functions in the turtle module\
    \ to set the background color, as well as the turtle's speed and size.\n\n```\n\
    ```python\nimport turtle\n\nturtle.bgcolor('black')\nturtle.speed('fast')\nturtle.pensize(4)\n\
    ```\n```\n\nBackground color\n\nThe turtle's speed\n\nThe thickness of the turtle's\
    \ trail\n\n# Choose the pen color, draw a circle\n\nNext set the color of the\
    \ turtle's trail and test the code by drawing a circle. Add these two lines to\
    \ the end of your code and run the program.\n\n```\n```python\nimport turtle\n\
    \nturtle.bgcolor('black')\nturtle.speed('fast')\nturtle.pensize(4)\n\nturtle.pencolor('red')\n\
    turtle.circle(30)\n```\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_86_0.png)\n\
    \nPen color\n\nThis tells the turtle to draw a circle.\n\n# Draw more circles\n\
    \nYou should now see a single circle, but we need lots more. Here comes the clever\
    \ bit. Put the commands to draw a red circle inside a function, but add a line\
    \ so that the function calls itself. This trick, known as recursion, makes the\
    \ function repeat. Remember, functions need to be defined before they're used,\
    \ so you'll need to move the turtle above the line where it's called.\n\n```\n\
    ```python\nimport turtle\n\ndef draw_circle(size):\n    turtle.pencolor('red')\n\
    \    turtle.circle(size)\n    draw_circle(size)\n\nturtle.bgcolor('black')\nturtle.speed('fast')\n\
    turtle.pensize(4)\ndraw_circle(30)\n```\n```\n\nThis line uses the size parameter.\n\
    \nThe function calls itself, which makes it repeat endlessly.\n\nThis line calls\
    \ the function for the first time.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_86_1.png)"
