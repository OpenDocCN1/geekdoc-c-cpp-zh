  md: '# 15. Start the game


    The three looping functions are started using timers. This ensures they aren’t
    run before the main loop starts. Finally, the `mainloop()` function starts the
    Tkinter loop that manages all your loops and timers. All finished—enjoy the game,
    and don’t let those eggs smash!


    ```

    root.after(1000, create_egg)

    root.after(1000, move_eggs)

    root.after(1000, check_catch)

    root.mainloop()

    ```


    The three game loops begin after a slight pause of 1,000 milliseconds (1 second).


    This line starts the main Tkinter loop.


    # Hacks and tweaks


    To make the game look even better, you can try adding some cool scenery of your
    own. Fun sounds and music are another great way to make the game more exciting.


    # EXPERT TIPS

    Installing modules


    Some of the most useful Python modules—such as Pygame—aren’t included as part
    of the standard Python library. If you would like to use any of these other modules,
    you’ll need to install them first. The best place to look for instructions on
    how to install a module is the module’s website. There are some useful tips at
    https://docs.python.org/3/installing/.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_200_0.png)


    # ▷ Set the scene


    Tkinter allows custom images to be used as backgrounds for a canvas. If your file
    is a GIF, you can use `tk.PhotoImage` to load the file. If your image is a different
    format, you might want to look into Pillow—a helpful image-handling module.


    # ▷ Make some noise


    To really bring the game to life, add background music or sound effects for catching
    an egg or losing a life. The module to use for adding sounds is `pygame.mixer`.
    Remember, pygame is not a standard Python module, so you’ll need to install it
    first. You’ll also need to have a copy of the sound file you want to play, which
    you should place in the same folder as your code file. Once that’s in place, playing
    a sound only takes a few lines of code.


    ```

    import time


    from pygame import mixer


    mixer.init()

    beep = mixer.Sound("beep.wav")

    beep.play()

    time.sleep(5)

    ```


    Get the mixer ready to play sounds.


    Tell the mixer which sound to play.


    Keep the program running long enough to hear it.


    Play the sound.'
