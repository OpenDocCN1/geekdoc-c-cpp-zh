    \n# 1. Create a new file\n\nOpen IDLE and create a new file.\nSave it as “secret_messages.py”.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_134_1.png)\n\n# 2. Add the modules\n\
    \nYou need to import some widgets from Python’s Tkinter module. This will let\
    \ you use some of its GUI features, such as messagebox to display information\
    \ to the user, and simpledialog to ask them questions. Type this line at the top\
    \ of your file.\n\n```\nfrom tkinter import messagebox, simpledialog, Tk\n```\n\
    \n# 3. Encrypt or decrypt?\n\nNow create a function, get_task(), to open a dialogue\
    \ box that asks the user whether they want to encrypt or decrypt a message. Add\
