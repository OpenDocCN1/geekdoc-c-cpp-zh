  md: '# Animal Quiz


    Are you a fan of quizzes? Would you like to make one yourself? In this project,
    you''ll build an animal quiz. Even though the questions are about animals, this
    project can be easily modified to be about any other topic.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_37_0.png)


    I thought I was the largest animal.


    This is how the game looks—it all happens in the shell window.


    # What happens


    The program asks the player some questions about animals. They get three chances
    to answer each question—you don''t want to make the quiz too difficult! Each correct
    answer will score one point. At the end of the quiz, the program reveals the player''s
    final score.


    ```

    ~~~

    Python 3.5.2 Shell


    Guess the Animal!

    Which bear lives at the North Pole? polar bear

    Correct answer

    Which is the fastest land animal? cheetah

    Correct answer

    Which is the largest animal? giraffe

    Sorry, wrong answer. Try again. elephant

    Sorry, wrong answer. Try again. rhinoceros

    The correct answer is blue whale

    Your score is 2

    ~~~

    ```


    Type in your answer here.


    If you guess incorrectly, you get another go.


    After three wrong guesses, the program shows you the correct answer.


    This is your score out of a possible 3 points.'
