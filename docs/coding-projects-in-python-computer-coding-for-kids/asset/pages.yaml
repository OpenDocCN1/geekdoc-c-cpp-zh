  md: "# 9. Line by line\n\nNow use a for loop to go through the file line by line.\
    \ Just as in Countdown Calendar, you must remove the invisible newline character.\
    \ Then you need to store the values of country and city in two variables. Using\
    \ the split command, the code will return the two values. You can store these\
    \ values in two variables using one line of code.\n\n```\n```python\ndef read_from_file():\n\
    \    with open('capital_data.txt') as file:\n        for line in file:\n     \
    \       line = line.rstrip('\\n')\n            country, city = line.split('/')\n\
    ```\n```\n\nThis removes the newline character.\n\nThis stores the word before\
    \ \"/\" in the variable country.\n\nThis stores the word after \"/\" in the variable\
    \ city.\n\nThe \"/\" character splits the line.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_126_0.png)\n\
    \n# 10. Add data to the dictionary\n\nAt this stage, the variables country and\
    \ city hold the information you need to add into the dictionary. For the first\
    \ line in your text file, country would hold \"India\" and city would hold \"\
    New Delhi\". This next line of code adds them into the dictionary.\n\n```\n```python\n\
    def read_from_file():\n    with open('capital_data.txt') as file:\n        for\
    \ line in file:\n            line = line.rstrip('\\n')\n            country, city\
    \ = line.split('/')\n            the_world[country] = city\n```\n```\n\nThis is\
