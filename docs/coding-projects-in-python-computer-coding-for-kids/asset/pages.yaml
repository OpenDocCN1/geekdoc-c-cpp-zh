    \ 250, smooth=1, width=2, state=HIDDEN)\ntongue_main = c.create_rectangle(170,\
    \ 250, 230, 290, outline='red', fill='red', state=HIDDEN)\ntongue_tip = c.create_oval(170,\
    \ 285, 230, 300, outline='red', fill='red', state=HIDDEN)\n\ncheek_left = c.create_oval(70,\
