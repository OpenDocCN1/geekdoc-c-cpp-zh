- pgno: 13
  md: '# What is coding?


    Computer programmers, or “coders,” are people who write step-by-step instructions
    that can make a computer perform a task. Coders can get computers to do addition,
    make music, move a robot across a room, or fly a rocket to Mars.


    # Dumb boxes


    A computer can’t do anything of its own accord—it just sits there like a dumb
    box until it’s told exactly what to do. Because computers can’t think for themselves
    and can only do as they’re told, coders have to do the thinking for them and write
    their instructions carefully.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_0.png)


    # △ Performing pet


    By learning how to code, you’ll be able to write your own programs and make the
    computer do what you want. It’s a bit like having an electronic pet that you can
    teach to perform tricks!


    # Programming languages


    In order to tell a computer what to do, you need to learn a programming language.
    Visual languages are easy for beginners to learn, while professional coders use
    text-based languages. This book is based on the popular text-based language Python.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_1.png)


    # ▽ Scratch


    Scratch is a visual programming language. It’s great for creating games, animations,
    and interactive stories. You write code in Scratch by snapping together blocks
    of instructions.


    # ▽ Python


    Python is a text-based programming language. In Python, programmers write code
    using words, abbreviations, numbers, and symbols. Instructions are typed in using
    the computer’s keyboard.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_2.png)


    ```

    when [flag] clicked

    think [3 + 3]

    ```


    Both these bits of code do the same thing.


    The answer to the sum is shown in the screen in a “thinks” bubble.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_3.png)


    ```

    >>> 3 + 3

    6

    ```


    You hit the enter/return key to see the result.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_13_4.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Anyone can code


    To be a coder you just need to learn a few basic rules and commands, and then
    you can start writing programs to suit your skills and interests. If you''re into
    science, for example, you could make an app that draws graphs from the results
    of your experiments. Or you could use your art skills to design an alien world
    for your own video game.


    # Think logically


    Coders need to think logically and carefully to write good code. If the instructions
    aren''t quite right or the steps are in the wrong order, a program won''t properly.
    Think through each step and make sure things happen in a logical order—after all,
    you wouldn''t put your coat on before your sweater, would you!


    # Pay attention to detail


    If you''re good at spot-the-difference puzzles, you''ll probably be a great coder.
    An important skill in coding is spotting mistakes in your code. These mistakes
    are called bugs, and even tiny bugs can cause big problems. E.g. eyed coders can
    pick out spelling mistakes and faults with the logic or order of the instructions.
    Debugging a program can be tricky, but learning from your mistakes is a great
    way to improve your coding powers.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_14_0.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_14_1.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_14_2.png)


    # Lingo


    # Bugs


    Bugs are errors in code that make programs behave in unexpected ways. They are
    so-called because early computers sometimes went wrong when insects got stuck
    in their circuits!


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_14_3.png)


    # Get coding


    Coding may sound daunting, but learning how to do it is easy. The secret is to
    just jump in. This book is designed to teach you how to code by guiding you through
    simple projects. Just follow the numbered steps and you''ll be creating games,
    apps, and digital art in no time.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_14_4.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Meet Python


    Python is one of the most popular computer programming languages in the world.
    It was first released in the 1990s and is now used to build millions of apps,
    games, and websites.


    # ## Why Python?


    Python is a great language for getting started with computer programming. Many
    schools and universities use it to teach coding. Here are some of the reasons
    that Python’s so useful.


    # ## LINGO — Why Python?


    Python isn’t named after the type of snake, It’s actually named after a British
    comedy group called “Monty Python’s Flying Circus.” The creator of Python, Guido
    van Rossum, was a big fan of the group and their quirky humor. Python programmers
    often use the group’s jokes and famous quotes in their code as a tribute.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_15_0.png)


    # △ Easy to read and write


    Python is a text-based computer programming language. You give the instructions
    using a mixture of English words, punctuation characters, symbols, and numbers.
    This makes Python code simple to read, write, and understand.


    # ▽ Batteries included


    Programmers say Python has “batteries included.” This is because it comes with
    everything you need to start coding right away.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_15_1.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_15_2.png)


    # △ Works everywhere


    Python is portable. This means you can write and run Python code on lots of different
    computers. The same Python code will work on PCs, Macs, Linux machines, and Raspberry
    Pi computers. The programs behave the same way on each machine.


    # △ Handy tools


    Python is packed with lots of useful tools and preprogrammed code that you can
    use in your programs. This is called the Standard Library. Using these tools makes
    it easier and quicker for you to build your own programs.


    # ▷ Great support


    Python has well-written documentation. It has a guide to getting started, a reference
    section for looking up what things mean, and a bunch of example code.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_15_3.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Python in action


    Python isn’t just an educational tool. It’s such a powerful program it’s used
    for many interesting and exciting tasks in business, medicine, science, and the
    media. It can even be used to control the lights and heating in your home.


    # EXPERT TIPS


    # The interpreter


    Some programming languages use an interpreter. The interpreter is a program that
    can translate from one programming language into another. Every time you run a
    Python program, an interpreter translates each line of Python code into a special
    code that the computer can understand, known as machine code.


    # ▽ Crawling the web


    Python is widely used on the Internet. Lots of Google’s search engine are written
    in Python. Much of YouTube is also built using Python code.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_0.png)


    # △ Serious business


    Python helps banks keep track of the money in their accounts, and big store chains
    to set the prices of the goods they sell.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_1.png)


    # △ Medical marvels


    Python can be used to program robots to perform tricky operations. A Python-programmed
    robot surgeon can work more quickly than a human one, and be more accurate and
    less likely to make errors.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_2.png)


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_3.png)


    # △ Out of this world


    Software engineers used Python to create tools for NASA’s Mission Control Center.
    These tools help the crew prepare for and monitor the progress of each mission.


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_16_4.png)


    # △ In the movies


    Disney uses Python to automate repetitive parts of the animation process. Rather
    than animators carrying out the same steps over and over, they use a Python program
    to repeat the steps automatically. This saves work, shortening the time it takes
    to make a film.'
  merge: -1
  img_proc: true
