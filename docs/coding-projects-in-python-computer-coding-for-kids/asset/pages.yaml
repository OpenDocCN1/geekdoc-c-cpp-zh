- pgno: 151
  md: "# 16 Set up flags\n\nAdd two flag variables to the code to keep track of whether\
    \ Screen Pet’s eyes are crossed or its tongue is out. Type them just above the\
    \ line that tells Screen Pet to start blinking, which you added to the main part\
    \ of the code in Step 9.\n\n```\n```python\nc.eyes_crossed = False\nc.tongue_out\
    \ = False\n\nroot.after(1000, blink)\n```\n```\n\nThese are the flag variables\
    \ for the pupils and the tongue.\n\n# 17 Toggle the tongue\n\nThis function toggles\
    \ Screen Pet’s tongue between being out and in. Put the code shown below above\
    \ the `show_happy()` function that you created in Step 11.\n\n```\n```python\n\
    def toggle_tongue():\n    if not c.tongue_out:\n        c.itemconfigure(tongue_tip,\
    \ state=NORMAL)\n        c.itemconfigure(tongue_main, state=NORMAL)\n        c.tongue_out\
    \ = True\n    else:\n        c.itemconfigure(tongue_tip, state=HIDDEN)\n     \
    \   c.itemconfigure(tongue_main, state=HIDDEN)\n        c.tongue_out = False\n\
    \ndef show_happy(event):\n```\n```\n\nThe code checks to see if the tongue is\
    \ already out.\n\nIf the tongue isn’t out, these lines make it visible.\n\nThis\
    \ line sets a flag variable saying the tongue is now out.\n\nThe tongue is already\
    \ out (else).\n\nThis line sets a flag variable saying the tongue isn’t out.\n\
    \nThese lines hide the tongue again.\n\n# EXPERT TIPS\n# Using flag variables\n\
    \nFlag variables help you keep track of something in your program that can be\
    \ in one of two states. When you change the state, you update the flag. The “Engaged\
    \ / Vacant” sign on a toilet door is a flag—you set it to “Engaged” when you lock\
    \ the door and back to “Vacant” when you unlock it.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_151_0.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_151_1.png)"
