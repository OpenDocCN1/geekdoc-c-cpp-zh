    They are all masterpieces!


    ![](img/6b18a113f7aa9338e32f3ac1fa217987_84_2.png)


    The turtle starts drawing in the center of the screen.


    ◁ Adaptable program


    The longer you leave Kaleido-spiral running, the more complicated the on-screen
    pattern becomes. By altering the parameters of the function that draws the circles,
    you can create patterns that are even more mind-boggling.'
