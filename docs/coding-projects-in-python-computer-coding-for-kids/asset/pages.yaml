  md: "# # Scramble the message!\n\nNow that you’ve got your interface working, it’s\
    \ time to write the code that will encrypt and then decrypt your secret message.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_0.png)\n\n# ## 8. Is it even?\n\
    \nYou need to create a function to tell the program whether or not there’s an\
    \ even number of characters in your message. The function will use the modulo\
    \ operator (%) to check if it can divide the number by 2 without leaving a remainder.\
    \ If it can (True), then the number’s even. Add this function under the code you\
    \ typed in Step 2.\n\n```\n```python\ndef is_even(number):\n    return number\
    \ % 2 == 0\n```\n```\n\nThis will be True if the number is even.\n\nPass the True\
    \ or False value back to the code.\n\n# ## Expert Tips\n### Modulo operator (%)\n\
    \nIf you put the modulo operator (%) between two numbers, Python tells you the\
    \ remainder when you divide the first number by the second. So 4 % 2 is 0, but\
    \ 5 % 2 is 1, because there’s 1 left over if you divide 5 by 2. Type these examples\
    \ in the shell if you want to try them out.\n\n# ## 9. Get the even letters\n\n\
    In this step, you’ll make a function that takes a message and produces a list\
    \ containing all the even-numbered letters. The function uses a for loop with\
    \ a range that goes from 0 to len(message), so that it checks all the letters\
    \ in the string. Add this function under the code in Step 8.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_1.png)\n\
    \n```\n```python\ndef get_even_letters(message):\n    even_letters = []\n    for\
    \ counter in range(0, len(message)):\n        if is_even(counter):\n         \
    \   even_letters.append(message[counter])\n    return even_letters\n```\n```\n\
    \nMake a list variable to store the even letters.\n\nLoop through every letter\
    \ in the message.\n\nIf this is a letter in an even position, Python adds it to\
    \ the list of letters.\n\nPass the list of letters back to the code called this\
    \ function.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_136_2.png)\n\nDon’t forget\
    \ to save your work."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# 10  Get the odd letters\n\nNext you need to create a similar function to\
    \ produce a list of all the odd-numbered letters in your message. Put this function\
    \ under the code in Step 9.\n\n```\ndef get_odd_letters(message):\n    odd_letters\
    \ = []\n    for counter in range(0, len(message)):\n        if not is_even(counter):\n\
    \            odd_letters.append(message[counter])\n    return odd_letters\n```\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_137_0.png)\n\n# Remember: Lists and\
    \ length\n\nPython counts from 0 in lists and strings, and uses the function len()\
    \ to find the length of a string. For example, if you type len('secret'), Python\
    \ will tell you that the string 'secret' is six characters long. But because the\
    \ first letter is in position 0, the last letter is in position 5, not 6.\n\n\
    # 11  Swap the letters round\n\nNow that you've got even letters in one list and\
    \ odd in another, you can use them to encrypt your message. The next function\
    \ will take letters alternately from these lists and put them into a new list.\
    \ But rather than assembling them in the original order, starting with an even\
    \ letter, it'll start the message with an odd one. Type this function under the\
    \ code in Step 10.\n\n```\ndef swap_letters(message):\n    letter_list = []\n\
    \    if not is_even(len(message)):\n        message = message + 'x'\n    even_letters\
    \ = get_even_letters(message)\n    odd_letters = get_odd_letters(message)\n  \
    \  for counter in range(0, int(len(message)/2)):\n        letter_list.append(odd_letters[counter])\n\
    \        letter_list.append(even_letters[counter])\n    new_message = ''.join(letter_list)\n\
    \    return new_message\n```\n\nAdd an extra x to any message with an odd number\
    \ of letters.\n\nLoop through the lists of odd and even letters.\n\nAdd the next\
    \ odd letter to the final message.\n\nAdd the next even letter to the final message.\n\
    \nThe join() function turns the list of letters into a string.\n\n# ▷ How it works\n\
    \nThe swap_letters() function puts all the odd and even numbers into a new list,\
    \ adding them alternately. It starts the list with the first letter in the word,\
    \ which Python counts as an odd number.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_137_1.png)"
  merge: -1
  img_proc: true
- pgno: 138
  md: "# EXPERT TIPS\n\n# Integer positions\n\nYou use the value len(message) / 2\
    \ in your loop range because the even and odd letter lists are both half the length\
    \ of the original message. You made sure the length of your message will always\
    \ be even by putting the program to add an x when necessary, so it can be divided\
    \ by 2. However, the result will be a float value (with a decimal point, such\
    \ as 3.0 or 4.0) rather than an integer (a whole number, such as 3 or 4). Python\
    \ gives an error if you try to use a float for the position of an item in a list,\
    \ so use the int() function to convert it to an integer.\n\n```\n```python\n>>>\
    \ mystring = 'secret'\n>>> mystring[3.0]\nTraceback (most recent call last):\n\
    \  File \"<pyshell#1>\", line 1, in <module>\n    mystring[3.0]\nTypeError: string\
    \ indices must be integers\n```\n```\n\nThis is the error message Python will\
    \ give you if you use a float, such as 3.0, instead of an integer, such as 3.\n\
    \n# 12 Update the loop\n\nThe swap_letters() function has a really useful feature:\
    \ if you run it on an encrypted message, it will decrypt it. So you can use this\
    \ function to encrypt or decrypt messages depending on what the user wants to\
    \ do. Make the following changes to the while loop you created in Step 6.\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_138_0.png)\n\n```\n```python\nwhile True:\n\
    \    task = get_task()\n    if task == 'encrypt':\n        message = get_message()\n\
    \        encrypted = swap_letters(message)\n        messagebox.showinfo('Ciphertext\
    \ of the secret message is:', encrypted)\n    elif task == 'decrypt':\n      \
    \  message = get_message()\n        decrypted = swap_letters(message)\n      \
    \  messagebox.showinfo('Plaintext of the secret message is:', decrypted)\n   \
    \ else:\n        break\nroot.mainloop()\n```\n```\n\nUse swap_letters() to encrypt\
    \ the message.\n\nDisplay the encrypted message.\n\nUses swap_letters() to decrypt\
    \ the message.\n\nDisplay the decrypted message."
  merge: -1
