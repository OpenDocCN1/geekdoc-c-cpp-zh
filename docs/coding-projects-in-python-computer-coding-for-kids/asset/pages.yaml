  md: "# ## 2 Block a multiple snap\n\nNext add the following line to the `snap()`\
    \ function to set the value of `previous_color` to the empty string (`''`) after\
    \ a correct snap. Now if a player presses their key again before the next shape\
    \ is shown, they will lose a point. This is because `''` will never be equal to\
    \ the current color, except before the first shape is shown.\n\n```\n```python\n\
    shape = c.create_text(200, 200, text='SNAP!')  # scored 1 point!\nprevious_color\
    \ = ''\n```\n```\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_180_0.png)\n\n> >\
    \ There's nothing I don't know about multiple snaps!\n\n# ## 3 Prevent early snaps\n\
    \nSince `previous_color` and `current_color` are equal at the beginning of the\
    \ game, players can still cheat by pressing their key before the first shape appears.\
    \ To solve this, set the two variables to different strings at the start. Change\
    \ their values to “a” and “b”.\n\n```\n```python\nprevious_color = 'a'\ncurrent_color\
    \ = 'b'\n```\n```\n\n> > Starting with different strings means that a snap can't\
    \ be made until the shapes appear on the screen.\n\n# ## 4 Change the messages\n\
    \nIf both players press their keys at almost the same time, it might be confusing\
    \ as to who has scored or lost a point. To fix this, you can change the messages\
    \ that are displayed when players attempt a snap.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_180_1.png)\n\
    \n> > Don’t forget to save your work.\n\n```\n```python\nif previous_color ==\
    \ current_color:\n    if event.char == 'a':\n        player1_score = player1_score\
    \ + 1\n        shape = c.create_text(200, 200, text='SNAP! Player 1 scores 1 point!')\n\
    \    else:\n        player2_score = player2_score + 1\n        shape = c.create_text(200,\
    \ 200, text='SNAP! Player 2 scores 1 point!')\n    previous_color = current_color\n\
    else:\n    if event.char == 'a':\n        player1_score = player1_score - 1\n\
