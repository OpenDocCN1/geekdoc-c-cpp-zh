  md: "# 3 Decrypt\n\nDecrypting the message is very easy. In the encrypted version\
    \ of your message, all the letters in even positions are letters from the original\
    \ message. So you can use the `get_even_letters()` function to get them.\n\n>\
    \ > Decrypting letters is easy.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_142_0.png)\n\
    \n```\n```python\ndef decrypt(message):\n    even_letters = get_even_letters(message)\n\
    \    new_message = ''.join(even_letters)\n    return new_message\n```\n```\n\n\
    Get the original message's letters.\n\nJoin the letters in `even_letters` into\
    \ a string.\n\n# 4 Use the new functions\n\nNow you need to update the infinite\
    \ loop section of your program to use the new `encrypt()` and `decrypt()` functions,\
    \ instead of `swap_letters()`. To do this, make these changes to your code.\n\n\
    > > I must update my infinite loop!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_142_1.png)\n\
    \n```\n```python\nwhile True:\n    task = get_task()\n    if task == 'encrypt':\n\
    \        message = get_message()\n        encrypted = encrypt(message)\n     \
    \   messagebox.showinfo('Ciphertext of the secret message is:', encrypted)\n \
    \   elif task == 'decrypt':\n        message = get_message()\n        decrypted\
    \ = decrypt(message)\n        messagebox.showinfo('Plaintext of the secret message\
    \ is:', decrypted)\n    else:\n        break\nroot.mainloop()\n```\n```\n\nThe\
    \ new `encrypt()` function replaces `swap_letters()`.\n\nThe new `decrypt()` function\
    \ replaces `swap_letters()`.\n\n# Multiencryption\n\nTo make things even more\
    \ complex, you can modify your code so that it combines all the different hacks\
    \ and tweaks from this section. For example, it could add fake letters, swap the\
    \ letters, and then reverse them!\n\n> > My secret codes are safer now!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_142_2.png)"
