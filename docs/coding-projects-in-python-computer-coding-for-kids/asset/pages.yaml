- pgno: 197
  md: "# # Falling, scoring, dropping\n\nYou've completed all the setup tasks, so\
    \ it's time to write the code that runs the game. You'll need functions to create\
    \ the eggs and make them fall, and some more functions to handle egg catches and\
    \ egg drops.\n\n# ## 8 Create the eggs\n\nAdd this code. A list keeps track of\
    \ all the eggs on the screen. The create_egg() function decides the coordinates\
    \ of each new egg (the x coordinate is always randomly selected). Then it creates\
    \ the egg as an oval and adds it to the list of eggs. Finally, it sets a timer\
    \ to call the function again after a pause.\n\n```\n    lives_text = c.create_text(canvas_width\
    \ - 10, 10, anchor='ne', font=game_font, fill='darkblue',\n        text='Lives:\
    \ ' + str(lives_remaining))\n\n    eggs = []\n\n    def create_egg():\n      \
    \  x = randrange(10, 740)\n        y = 40\n        new_egg = c.create_oval(x,\
    \ y, x + egg_width, y + egg_height, fill=next(color_cycle), width=0)\n       \
    \ eggs.append(new_egg)\n        root.after(egg_interval, create_egg)\n```\n\n\
    This is a list to keep track of the eggs.\n\nPick a random position along the\
    \ top of the canvas for the new egg.\n\nThis line of code creates the oval.\n\n\
    The shape is added to the list of eggs.\n\nCall this function again after the\
    \ number of milliseconds stored in egg_interval.\n\n# ## 9 Move the eggs\n\nAfter\
    \ creating the eggs, add the next function, move_eggs(), to set them in motion.\
    \ It loops through the list of all the eggs on screen. For each egg, the y coordinate\
    \ is increased, which moves the egg down the screen. Once the egg is moved, the\
    \ program checks whether it has hit the bottom of the screen. If it has, the egg\
    \ has been dropped and the egg_dropped() function is called. Finally, a timer\
    \ is set to call the move_eggs() function again after a short pause.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_197_0.png)\n\
    \n```\n    root.after(egg_interval, create_egg)\n\n    def move_eggs():\n    \
    \    for egg in eggs:\n            (egg_x, egg_y, egg_x2, egg_y2) = c.coords(egg)\n\
    \            c.move(egg, 0, 10)\n            if egg_y2 > canvas_height:\n    \
    \            egg_dropped(egg)\n        root.after(egg_speed, move_eggs)\n```\n\
    \nLoop through all the eggs.\n\nThis line gets each egg's coordinates.\n\nThe\
    \ egg drops down the screen 10 pixels at a time.\n\nIs the egg at the bottom of\
    \ the screen?\n\nIf so, call the function that deals with dropped eggs.\n\nCall\
    \ this function again after the number of milliseconds stored in egg_speed."
