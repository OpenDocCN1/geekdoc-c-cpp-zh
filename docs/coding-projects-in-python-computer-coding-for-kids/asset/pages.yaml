  md: "# Blinking pet\n\nYour Screen Pet looks cute, but it’s not doing anything!\
    \ Let’s write some code to get it blinking. You’ll need to create two functions:\
    \ one to open and shut the eyes, the other to tell them how long to stay open\
    \ and shut for.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_147_0.png)\n\n# Open\
    \ and close the eyes\n\nCreate this function, toggle_eyes(), at the top of your\
    \ file, under the first line of code. It makes the eyes look closed by hiding\
    \ the pupils and filling the eyes with the same color as the body. It also switches\
    \ the eyes between being open and closed.\n\nFirst the code checks the eyes’ current\
    \ color; white is open, blue is closed.\n\nThis line sets the eyes’ new color\
    \ to the opposite value.\n\nTo blink, the eyes fill with sky blue and the pupils\
    \ disappear.\n\n```\n```python\nfrom tkinter import HIDDEN, NORMAL, Tk, Canvas\n\
    \ndef toggle_eyes():\n    current_color = c.itemcget(eye_left, 'fill')\n    new_color\
    \ = c.body_color if current_color == 'white' else 'white'\n    current_state =\
    \ c.itemcget(pupil_left, 'state')\n    new_state = NORMAL if current_state ==\
    \ HIDDEN else HIDDEN\n    c.itemconfigure(pupil_left, state=new_state)\n    c.itemconfigure(pupil_right,\
    \ state=new_state)\n    c.itemconfigure(eye_left, fill=new_color)\n    c.itemconfigure(eye_right,\
    \ fill=new_color)\n```\n```\n\nNow the code checks if the current state of the\
    \ pupils is NORMAL (visible) or HIDDEN (not visible).\n\nThis line sets the pupils’\
    \ new state to the opposite value.\n\nThese lines change the visibility of the\
    \ pupils.\n\nThese lines change the eyes’ fill color.\n\n# Toggling\n\nSwitching\
    \ between two states is known as “toggling”. So you “toggle” the lights in your\
    \ house when you switch them on and off. Toggling could switch, or toggles, between\
    \ Screen Pet’s eyes being open and closed. If the eyes are closed when you run\
    \ it, they’ll change to being open. If they’re open, they’ll change to being closed.\n\
    \nToggle light on!\n\nJust you toggle that light back off!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_147_1.png)"
  merge: -1
