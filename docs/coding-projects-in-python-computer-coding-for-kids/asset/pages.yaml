  md: "# # Modules\n\nModules are bundles of code that help you deal with common coding\
    \ challenges. Modules provide the less exciting bits of code, letting you focus\
    \ on the fun stuff. Also, because modules are used by a lot of people, they are\
    \ likely to work well and be free of bugs.\n\n# ## Built-in modules\n\nThere are\
    \ lots of useful modules included with Python. This collection of modules is known\
    \ as the Standard Library. Here are some interesting modules from the library\
    \ that you might want to experiment with.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_59_0.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_59_1.png)\n\n+   ▷ **statistics**\n\
    +   \n+   Use `statistics` to calculate averages or find the most common value\
    \ in a list of numbers. It's handy if you need to work out an average score in\
    \ a game.\n\n+   ▷ **datetime**\n+   \n+   This module lets you work with dates.\
    \ You can get today’s date, or work out how long it is until a special day.\n\n\
    ![](img/6b18a113f7aa9338e32f3ac1fa217987_59_2.png)\n\n+   ▷ **random**\n+   \n\
    +   You used this module to make random selections in Password Picker. It's great\
    \ for adding an element of chance to a game or program.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_59_3.png)\n\
    \n+   ▷ **webbrowser**\n+   \n+   You can control the computer’s web browser with\
