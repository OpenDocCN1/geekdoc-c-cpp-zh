- pgno: 87
  md: "# EXPERT TIPS\n\n# Recursion\n\nWhen a function calls itself, this is known\
    \ as recursion. It’s another way of making a loop in your program. In most uses\
    \ of recursion, the parameters of the function change each time the function is\
    \ called. In Kaleido-spiral, for example, the size, angle, and position of the\
    \ circle change whenever the function is called.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_87_0.png)\n\
    \n# 6. Test your code\n\nRun the program. You would see the turtle drawing the\
    \ same circle over and over again. Don’t worry—you’ll fix that in the next step.\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_87_1.png)\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_87_2.png)\n\
    \n# 7. Change the color, increase the size\n\nTo create more exciting patterns,\
    \ make these changes to the code to increase the size of the circle and change\
    \ its color. This code uses the `cycle()` function, which takes a list of values\
    \ as its parameter and returns a special type of list that you can cycle through\
    \ endlessly in the `next()` function. Run the code again.\n\n```\n```python\n\
    import turtle\nfrom itertools import cycle\n\ncolors = cycle(['red', 'orange',\
    \ 'yellow', 'green', 'blue', 'purple'])\n\ndef draw_circle(size):\n    turtle.pencolor(next(colors))\n\
    \    turtle.circle(size)\n    draw_circle(size + 5)\n\nturtle.bgcolor('black')\n\
    turtle.speed('fast')\nturtle.pensize(4)\ndraw_circle(30)\n```\n```\n\nImport the\
    \ `cycle()` function.\n\nThis line creates a cycle of the colors in the list.\n\
    \nUse the next color in the cycle.\n\nAdd 5 to the previous circle size."
