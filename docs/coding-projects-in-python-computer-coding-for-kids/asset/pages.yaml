  md: "# 8. Realistic blinking\n\nThe eyes need to close only briefly and stay open\
    \ for a while between blinks. Add this function, `blink()`, under the code you\
    \ typed in Step 7. It blinks the eyes for a quarter of a second (250 milliseconds),\
    \ then finishes with a command that tells `mainloop()` to call it again after\
    \ 3 seconds (3,000 milliseconds).\n\n```\nc.itemconfigure(eye_right, fill=new_color)\n\
    \ndef blink():\n    toggle_eyes()\n    root.after(250, toggle_eyes)\n    root.after(3000,\
    \ blink)\n\nroot = Tk()\n```\n\nClose the eyes.\n\nWait 250 milliseconds, then\
    \ open the eyes.\n\nWait 3,000 milliseconds, then blink again.\n\n# 9. Animate!\n\
    \nPut this line in the main part of your program, just above the last line. Now\
    \ run the program. Your pet will come to life for 1 second (1,000 milliseconds)\
    \ and sit there blinking until you close the window.\n\n```\nroot.after(1000,\
    \ blink)\nroot.mainloop()\n```\n\nWait 1,000 milliseconds, then start blinking.\n\
    \n# Changing moods\n\nScreen Pet looks quite happy just now, with its little smile,\
    \ but let’s cheer it up even more. We’ll give it a bigger, beaming smile and bright,\
