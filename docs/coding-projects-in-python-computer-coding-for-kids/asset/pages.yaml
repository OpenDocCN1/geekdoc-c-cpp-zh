- pgno: 105
  md: "# Move that turtle!\n\nNow you're ready to write the function that gets your\
    \ turtle moving. The last bit of the code will be a while loop that sets the turtle\
    \ off drawing mutant rainbows!\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_105_0.png)\n\
    \n![](img/6b18a113f7aa9338e32f3ac1fa217987_105_1.png)\n\n# 10 Mutant line\n\n\
    Add this code below the code you typed in Step 9, and above the code you typed\
    \ in Step 5. This function makes the turtle turn and move forward in a new direction,\
    \ drawing a single line of random color as it goes. Your main program will use\
    \ it over and over again to draw mutant rainbows. If the turtle strays beyond\
    \ the limits you set in Step 9, this function will bring it back.\n\nThe different\
    \ colors the pen can use are stored in a list.\n\nUse a backslash character if\
    \ you need to split a long line of code over two lines.\n\n# How it works\n\n\
    The code calls the inside_window() function to see if the turtle is within the\
    \ window limits. If it is, the turtle turns right by a random amount between 0\
    \ degrees (doesn't turn at all) and 180 degrees (faces the opposite direction),\
    \ then moves off again. If it has gone too far from the limit, it moves backward.\n\
    \n```\n~~~python\nreturn inside\ndef move_turtle(line_length):\n    pen_colors\
    \ = ['red', 'orange', 'yellow', 'green',\n                  'blue', 'purple']\n\
    \    t.pencolor(random.choice(pen_colors))\n    if inside_window():\n        angle\
    \ = random.randint(0, 180)\n        t.right(angle)\n        t.forward(line_length)\n\
    \    else:\n        t.backward(line_length)\n~~~\n```\n\nThe pen chooses a color\
    \ at random.\n\nThis checks if the turtle is inside the set limits.\n\nThe turtle\
    \ turns right by the random angle.\n\nThis chooses a random angle between 0 and\
    \ 180 degrees.\n\nIf the turtle is outside the limits, it moves backward.\n\n\
    The turtle moves forward in line_length steps.\n\n```\n~~~python\nline_length\
    \ = get_line_length()\n\nt.speed('fastest')\nt.pensize(line_width)\n\nwhile True:\n\
    \    move_turtle(line_length)\n~~~\n```\n\nThis line starts an infinite loop to\
