  md: "# ### 13 Increase the score\n\nIf the score is increased by the value of the\
    \ points parameter. Next the new speed and interval of the eggs are calculated\
    \ by multiplying their values by the difficulty factor. Finally, the text on the\
    \ screen is updated with the new score. Add this new function beneath `check_catch()`.\n\
    \n```\n```python\ndef increase_score(points):\n    global score, egg_speed, egg_interval\n\
    \    score += points\n    egg_speed = int(egg_speed * difficulty_factor)\n   \
    \ egg_interval = int(egg_interval * difficulty_factor)\n    c.itemconfigure(score_text,\
    \ text='Score: ' + str(score))\n```\n```\n\nAdd to the player's score.\n\nThis\
    \ line updates the text that shows the score.\n\n![](img/6b18a113f7aa9338e32f3ac1fa217987_199_0.png)\n\
    \n# ## Catch those eggs!\n\nNow that you've got all the shapes and functions needed\
    \ for the game, all that's left to add are the controls for the egg catcher and\
    \ the commands that start the game.\n\n# ### 14 Set up the controls\n\nThe `move_left()`\
    \ and `move_right()` functions use the coordinates of the catcher to make sure\
    \ it isn't about to leave the screen. If there's still space to move to the left,\
    \ it shifts horizontally by 20 pixels. These two functions are linked to the left\
    \ and right arrow keys on the keyboard using the `bind()` function. The `focus_set()`\
    \ function allows the program to detect the key presses. Add the new functions\
    \ beneath the `increase_score()` function.\n\n```\n```python\ndef move_left(event):\n\
    \    (x1, y1, x2, y2) = c.coords(catcher)\n    if x1 > 0:\n        c.move(catcher,\
    \ -20, 0)\n\ndef move_right(event):\n    (x1, y1, x2, y2) = c.coords(catcher)\n\
    \    if x2 < canvas_width:\n        c.move(catcher, 20, 0)\n\nc.bind('<Left>',\
    \ move_left)\nc.bind('<Right>', move_right)\nc.focus_set()\n```\n```\n\nIf not,\
    \ move the catcher left.\n\nIf not, move the catcher right.\n\nHas the catcher\
    \ reached the right-hand wall?\n\nThese lines call the functions when the keys\
    \ are pressed."
