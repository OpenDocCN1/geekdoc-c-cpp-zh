  md: "You often want to see if 2 things have the same value or don't have the same\
    \ value. For this, you want the equality and inequality operators:\n\n+   >> To\
    \ check whether 2 things are equal, you use ==.\n>> To check for inequality, you\
    \ use !=.\n\n+   >> Remember that single equals sign is not saying \"equals\"\
    ; it's saying \"assign.\". And if you are working with comparisons, you need to\
    \ use 2 equal signs together.\n\n```\n// Program 3_9\n// Illustrating comparisons\
    \ to create Boolean value\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int age;\n    cout << \"Enter your age: \";\n    cin >> age;\n    bool\
    \ eligible_for_discount;\n    eligible_for_discount = ((age < 18) || (age >= 65));\n\
    \    cout << eligible_for_discount << endl;\n}\n```\n\nLet's say that you're operating\
    \ a business and want to give a discount to anyone under 18 or anyone who is 65\
    \ or older.\n\nAfter reading an age, you can set a Boolean variable, eligible_for_discount,\
    \ (11). You can be the result of a Boolean expression containing comparisons to\
    \ check if the age is 18 or if it is greater than or equal to 65 by using this:\
    \ eligible_for_discount = ((age < 18) || (age >= 65)).\n\nThis Boolean variable\
    \ eligible_for_discount will be true either if the age is less than 18 or the\
    \ age is greater than or equal to 65—otherwise, it will be false. For example,\
    \ for age 10, the program will output a 1 for true; however, for age 45, you get\
    \ a 0 for false.\n\n# # CONDITIONAL STATEMENTS\n\nThe real power of Boolean values\
    \ and expressions comes when you get them into conditional statements. A common\
    \ term for a conditional statement is an if-then-else statement. The simplest\
    \ form is the if-then statement. A conditional statement starts with the keyword\
    \ if.\n\nNext, in parentheses, is a single Boolean value. The Boolean value could\
    \ come in many forms. It could be a simple value, such as true or false, but the\
    \ value is more likely to be given by a Boolean variable—or even a Boolean expression,\
    \ made up of comparisons and Boolean operations.\n\n```\nif (true) // simple Boolean\
    \ value\nif (isFreezing) // Boolean variable\nif ((age < 18) || (age >= 65))\n\
    // Boolean expression\n```"
