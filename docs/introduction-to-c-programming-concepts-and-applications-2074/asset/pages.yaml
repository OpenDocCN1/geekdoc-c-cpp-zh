- pgno: 164
  md: "# // TYPES AND SOURCES OF ERRORS\n\nThe errors that you encounter tend to fall\
    \ into one of 3 types: syntax errors, logic errors, and runtime errors.\n\n+ \
    \  1 A syntax error occurs where you've written something that is not accurate\
    \ code. These are usually the easiest to find and fix, because the compiler will\
    \ identify that you have a mistake in your code and will usually give you a particular\
    \ line of code where it detected the error.\n2 A logic error occurs when there\
    \ was something wrong with the thought process that went into the code, and that\
    \ gets reflected in a mistake. These are some of the toughest errors to find.\n\
    3 A runtime error is due to unexpected circumstances. This is where adding exceptions\
    \ to your program can be a big help.\n\nOften, the source of the error could be\
    \ due to circumstances outside the programmer's direct control. Perhaps you asked\
    \ a user to enter a number and he or she typed a word instead of a number. The\
    \ program will either give a wrong answer or just crash.\n\nTo avoid this kind\
    \ of error, you could make a much more complicated process for reading in a string\
    \ and then checking to see if the string is a positive integer—and if so, convert\
    \ it to an integer, and so on. But doing all of this would be very painful!\n\n\
    Programming is full of situations, besides a user entering data of the wrong type,\
    \ where you might run into results that you don't expect.\n\nOne common situation\
    \ is with files: You might try to open a file for reading but the file just isn't\
    \ there. Maybe the name got mistyped or the file is in a different directory.\
    \ For whatever reason, it's not where you expected, and you can't open it.\n\n\
    For example, Program 14_4 asks a user for a file name, reads the first element\
    \ (an integer) from the file, and prints it out. If you run this program and type\
    \ in the name of a non-existent file, you'll probably get some sort of nonsense\
    \ printed out. Since the file did not exist, it could not be opened to read from,\
    \ and so whatever should have been read and then printed out will be junk.\n\n\
    Trying to access a vector is another situation where what you expect might not\
    \ be what you get. For example, maybe you read in a week's data but a user included\
    \ only the workweek and not the weekend. What should happen if you tried to access\
    \ the 6th element?\n\nProgram 14_5 is an example: The hours_worked vector has\
    \ 5 elements, giving the number of hours worked each day. The loop, however, tries\
    \ to access 7 elements.\n\n```\n// Program 14_4\n// Exception example - reading\
    \ a nonexistent file\n#include <iostream>\n#include <fstream>\n#include <string>\n\
    using namespace std;\n\nint main() {\n    fstream infile;\n    string filename;\n\
    \    cout << \"What is the file name? \";\n    cin >> filename;\n    infile.open(filename,\
    \ fstream::in);\n\n    int a;\n    infile >> a;\n    cout << \"Read in: \" <<\
    \ a << endl;\n}\n```\n\n```\n// Program 14_5\n// Exception example - vector past\
    \ end of range\n#include <iostream>\n#include <vector>\nusing namespace std;\n\
    \nint main() {\n    vector<float> hours_worked = { 7.5, 8.5, 10.0, 7.0, 7.0 };\n\
    \    for (int i = 0; i < 7; i++) {\n        cout << \"On day \" << i << \", \"\
    \ << hours_worked.at(i) << \" hours were worked.\" << endl;\n    }\n}\n```"
