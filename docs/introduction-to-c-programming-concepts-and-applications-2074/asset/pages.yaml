  md: "Imagine that you want to read in a series of daily temperatures, report the\
    \ average, and then list all the days that have a temperature greater than the\
    \ average.\n\nTo develop this program, you're going to need 3 parts, or your pseudocode\
    \ will be 3 lines.\n\n+   - First, you'll need to read in all of the temperature\
    \ data. Because you don't know how many temperatures you'll have, you won't know\
    \ the size of the array ahead. You'll have to pick a sentinel value that you think\
    \ is plenty. You'll also have to pick a program when you're done entering data.\
    \ In this case, that would be some temperature that nobody would ever enter. When\
    \ you read in temperatures, you can keep track of a count and a sum.\n- Then,\
    \ you use the count and sum to compute an average.\n- Once you've computed the\
    \ average, you can go through the elements again and print out those that are\
    \ larger than the average.\n\n```\n// Program 7_4\n// Reporting temperatures greater\
    \ than the average\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    // Read in temperature data, keeping sum\n    int temps[100];\n    int currenttemp\
    \ = 0;\n    int total = 0;\n    cout << \"Enter a temperature: \";\n    cin >>\
    \ currenttemp;\n    while (counttemps < 200) {\n        temps[counttemps] = currenttemp;\n\
    \        total += currenttemp;\n        counttemps++;\n    }\n    cout << \"Enter\
    \ a temperature. Enter 200 or greater when done: \";\n    cin >> currenttemp;\n\
    \n    // Determine and print out average\n    float average = (float)total / (float)counttemps;\n\
    \    cout << \"The average temperature was \" << average << endl;\n    for (int\
