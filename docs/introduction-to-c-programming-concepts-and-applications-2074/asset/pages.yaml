- pgno: 134
  md: '# // QUIZ ANSWERS


    +   a Set a breakpoint. In an IDE, this is often done by clicking at a point in
    front of the line of code.


    +   b Step Over. After executing, the debugger will go on to the next line of
    code in the same function or, if it was the last line of a function, leave the
    function and return to where it was called from.


    +   c Step Into. If the current line has a function call in it, then the debugger
    will go into the function, to the first line in the function body.


    +   d Use the Watch list. Most IDE debuggers will have a sub-window in which you
    can watch variables you care about. Some debuggers will have other options, such
    as letting you type a variable you want of.


    +   a Root. There is a single root node to the tree. This can be thought of as
    the top of the hierarchy, like the CEO in an organization.


    +   b Parent. In a tree, each node except the root has one parent. This is the
    element that is higher in the hierarchy, like a person''s manager in an organization.


    +   c Child/children. A node may have multiple children, one child, or none. Children
    are the next level down in the hierarchy, like the people directly supervised
    in an organization.


    +   d Leaf. Leaf nodes are those with no children, like the people in an organization
    who are not managing anyone else.


    Top-down design takes practice and experience, and there is never a single right
    answer. So, all approaches are just guidelines.


    +   a You stop when a task is at a level that implementing in code will be obvious.
    In other words, an experienced programmer should have no difficulty taking the
    lowest level of design and generating several lines of code to implement it.


    +   b A task should be broken into a set of simpler subtasks so that each subtask
    is still a single coherent idea and it is easy to understand the greater task
    as a combination of the few subtasks.'
