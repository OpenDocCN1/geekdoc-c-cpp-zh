  md: "The map is a way to associate one value, called a key, with another of any\
    \ type. Maps come in 2 varieties: the standard map and the unordered_map. The\
    \ difference between them is that a map can be iterated through in order from\
    \ least to greatest, while an unordered_map cannot. Generally, this means that\
    \ an unordered_map is faster to use.\n\nA map uses square brackets to index specific\
    \ values. This is similar to how a vector or an array uses square brackets to\
    \ access one element of the array. There, the index that you can put in that square\
    \ bracket runs from 0 to one less than the size of the vector or array.\n\nBut\
    \ with a map, you can use almost any value as the index—not just an integer from\
    \ 0 to some other integer. This index is just the key. So, if you wanted to store\
    \ the number of bills of different currency denominations, you could use 1, 5,\
    \ 10, 20, and 100 as your keys. Or you could use a string as the key so that the\
    \ indices are cat and dog, for example.\n\nSay you're running an animal shelter\
    \ and want to keep track of how many of each type of animal are in the shelter.\
    \ You'll use a map for that, so you #include map at the beginning (5).\n\nMaps\
    \ are templated with 2 types: first the type of the index and then the type of\
    \ value that the index maps to. In this case, you'll want to have an animal name\
    \ as your index, so the\n\n```\n// Program 23_6\n// Map example - animal shelter\n\
    #include<iostream>\n#include<string>\n#include<map>\nusing namespace std;\n\n\
    int main() {\n  map<string, int> numanimals;\n  numanimals[\"cat\"] = 12;\n  numanimals[\"\
    dog\"] = 23;\n  numanimals[\"rabbit\"] = 2;\n\n  string whichanimal;\n  cout <<\
    \ \"Which animal do you want a count of? \";\n  cin >> whichanimal;\n  if (numanimals.count(whichanimal)\
    \ > 0) {\n    cout << \"There are \" << numanimals[whichanimal] << \" in the shelter.\"\
    \ << endl;\n  } else {\n    cout << \"That animal is not in the shelter.\" <<\
    \ endl;\n  }\n}\n```\n\n> Sometimes you’ll hear a map referred to as a dictionary,\
    \ because it provides a way to associate an \"entry\"—that is, the key—with its\
    \ \"definition,\" or value.\n\nindex will be a string. And you’re keeping track\
    \ of how many of each animal there are, so you’ll have an integer value stored\
    \ for each of them. So, you declare your map variable, numanimals, by writing\
    \ map<string,int> numanimals (9).\n\nNow you can assign values to this map. For\
    \ example, if you want to note that there are 12 cats in the shelter, you can\
    \ write the map name, numanimals, followed by the string cat inside of square\
    \ brackets, and assign the value 12 to that. Likewise, you can assign values for\
    \ dog and rabbit (d).\n\nIn this program, you then ask a user which animal is\
    \ of interest (e). You first check the count for that animal (17). If the count\
    \ is not 0—that is, if it’s 1—then you will output the value stored in numanimals\
    \ by outputting numanimals[whichanimal], where whichanimal is the string the person\
    \ entered (18). If the count was 0, it means you have no record for that animal,\
    \ so you output a short message that the animal is not in the shelter (21).\n\n\
    If a user enters an animal that you have data for, such as dog, you’ll get an\
    \ output that there are 23 dogs in the shelter."
