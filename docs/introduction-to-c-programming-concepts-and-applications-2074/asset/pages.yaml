    After the array has been declared—that is, after that long stretch of boxes has
    been set aside in memory—you can refer to each individual box as a separate variable.
    To do this, you will again use square brackets, containing a number, after the
    name. The first box will be 0, the second one will be 1, etc. You refer to a box
    by the array name and then, in square brackets, the box number.


    Why do you start the numbering O instead of I? The short answer is it''s a little
    more efficient than starting with I.


    In Program 7_1, you are assigning values of 10, 20, and 25 to the first 3 boxes
    in the array. Notice that you can assign values to them, and you can refer to
    values inside them, just like with other variables.


    Generally, the whole array is referred to as the variable. In other words, even
    though the array is made up of many different "boxes", which you could think of
    as many different individual variables, you will generally be able to refer to
    the entire array—the entire collection of boxes—as one thing, so it makes sense
    to call it a variable.


    The individual boxes are called the elements, which are the component variables
    of the overall array variable.


    The number identifying an element is called the index.


    To refer to an element of an array, the common phrase used is sub (which can be
    thought of as short for subscript) and then the index number.'
