- pgno: 258
  md: 'There are several generic tasks and ideas—that are very widely applicable—that
    work well with templates.


    The most common of these generic concepts are available to programmers through
    the Standard Template Library (STL), which is a library—a collection of templates
    and functions that can be included in your program. It''s in the sense that there
    is a clearly defined set of what is expected to be provided in the library. And
    uses templates, meaning that provides generic container structures and algorithms.


    The STL is likely all you''ll need for generic programming; you will probably
    rarely find that you want to write your own templates classes or functions.


    The vector class is an example of a container, and it''s just one of several generic
    containers that are provided in the STL.


    Vectors are also great at letting you access an element at a specific point in
    the vector. This is referred to as random access because you can access any point
    at random; you do not have to access them in a particular order. A vector is not
    good at inserting a new element at the beginning, or somewhere in the middle,
    of an vector.


    Containers are classes that collect several instances of some type in a way that
    allows operations to be performed very efficiently.


    Here''s a short menu of the most useful containers that are in the STL.


    Different containers will have different operations—different member functions—that
    you support well.


    | Containers | Container Adaptors |

    | --- | --- |

    | vector | stack |

    | deque | queue |

    | list | priority queue |

    | forward list |


    The common theme is that they are templated classes, so they can work with many
    different data types; you specify the type when you declare a specific container.


    > A programmer who is not using the STL is missing a huge chunk of the advantages
    that C++ provides.


    The STL can save a lot of time by providing efficient implementations of data
    structures and algorithms you want to use. And the STL is simple to use; #include
    gets you access to a generic structure or the algorithms it provides.


    For example, vectors are very good for keeping elements in order; the order that
    elements of the vector are in the order that they got pushed onto the back of
    the vector. It is very easy to add or remove elements at the end:


    +   * push_back adds new element to the end of the vector.

    "* pop_back removes an element from the end of a vector."


    You can order from this menu in one of 2 ways:


    +   * You can call for a container that''s implemented in a fundamentally unique
    way. Such containers include vectors


    In practice, you use containers and container adapters in similar ways. Either
    way, all you do from the menu is #include, for example, stack.'
