- pgno: 241
  md: "# // PURE VIRTUAL FUNCTIONS\n\nIt’s possible for the base class to declare\
    \ a virtual function yet provide no definition. This is known as a pure virtual\
    \ function, and it has some major implications for the class itself.\n\nIn this\
    \ code, you are providing classes that can be used to calculate shipping costs\
    \ for a package. To keep things simple, the class will have no member variables\
    \ and just one member function, shipping_cost.\n\nYou have one base class, shipping_company\
    \ (6), which will be a class that the other classes inherit from. In the shipping_company\
    \ class, you declare one member function, shipping_cost (8). Notice that the shipping_cost\
    \ function is declared virtual, as expected, and it has a return value, float,\
    \ and takes in a single float parameter. Notice that the parameter does not have\
    \ to have a name declared, because you are not actually defining the function\
    \ here. Instead, this is going to be a pure virtual function, and to designate\
    \ that, instead of providing the function definition—that is, instead of the body\
    \ enclosed in curly braces—you write =0;\n\nA pure virtual function will have\
    \ to be defined in the derived classes. In this case, you have 3 different specific\
    \ shipping companies. Each of these will define its own version of the shipping_cost\
    \ function.\n\n```\n// Program 20_8\n// Pure virtual function\n#include<iostream>\n\
    using namespace std;\n\nclass shipping_company {\npublic:\n    virtual float shipping_cost(float)\
    \ = 0;\n};\n\nclass VQT : public shipping_company {\npublic:\n    float shipping_cost(float\
    \ weight) {\n        return 3.0 + 1.5*weight;\n    }\n};\n\nclass NatFast : public\
    \ shipping_company {\npublic:\n    float shipping_cost(float weight) {\n     \
    \   return 2.0*weight;\n    }\n};\n\nclass GovernmentPost : public shipping_company\
    \ {\npublic:\n    float shipping_cost(float weight) {\n        if (weight < 2.0)\
    \ {\n            return 4.0;\n        }\n        else if (weight < 4.0) {\n  \
    \          return 8.0;\n        }\n        else if (weight < 6.0) {\n        \
    \    return 11.0;\n        }\n        else {\n            return 2.0*weight;\n\
    \        }\n    }\n};\n\nshipping_company& select_company() {\n    int option;\n\
    \    cout << \"Which shipping company do you use? \" <<\n        \"Enter 1 for\
    \ VQT, 2 for NatFast, 3 for Government Post: \";\n    cin >> option;\n    if (option\
    \ == 1) {\n        return *new VQT();\n    }\n    else if (option == 2) {\n  \
    \      return *new NatFast();\n    }\n    else {\n        return *new GovernmentPost();\n\
    \    }\n}\n\nint main() {\n    float w;\n    cout << \"What is the package weight?\
    \ \";\n    cin >> w;\n    shipping_company& x = select_company();\n    cout <<\
    \ \"Your package will cost \" << x.shipping_cost(w) << \" to ship.\" << endl;\n\
    }\n```"
