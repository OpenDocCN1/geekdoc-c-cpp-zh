  md: '# 01 Compiling Your First C++ Program


    C++ is one of the most powerful, efficient, and flexible programming languages
    that exists. It allows you to program in a way that closely corresponds to machine
    instructions while also providing several higher-level features to make it easier
    for people to understand. C++ supports multiple programming styles, or paradigms,
    that have emerged over time, and it is particularly strong in allowing you to
    use a variety of different paradigms in your programs. As a result, C++ is used
    as the basis for a wide variety of applications across many domains.


    IN THIS LECTURE:


    +   - Introduction to Computer Programming

    - What Happens When You Program

    - Program 1_1

    - Program 1_9

    - Program 1_10


    +   - Quiz


    +   - Quiz Solutions


    # // INTRODUCTION TO COMPUTER PROGRAMMING


    Computers operate by following a set of instructions. But the instructions that
    a computer can understand are a bunch of Ins and—a long sequence of binary numbers


    that encodes the instructions and data for a computer to use. For people, this
    is nearly impossible to follow, and this is why programming languages have been
    developed.


    > C++ has been used to develop many of the programs you''ve probably experienced—from
    Microsoft Windows to the code underlying Google''s search and website to YouTube,
    Facebook, Amazon, and PayPal. It''s been used to control devices ranging from
    ship engines to Mars Rovers and in phone systems worldwide.


    What is sometimes considered the first program was written in the 1840s by Ada
    Lovelace, who wrote computational instructions that could run, in theory, on a
    machine that was designed but not built.


    The first modern programming languages were developed in the 1950s, with Fortran
    being the first widely used. In fact, Fortran is a procedural language, and **procedural
    programming** is still common approach used today, including as style of C++ programming.
    Since Fortran, hundreds of languages have been developed, and each one has its
    own strengths and weaknesses.'
