- pgno: 307
  md: '# if


    Identifies the start of a condition. The keyword is followed by parentheses containing
    a Boolean (the condition), and that are any commands to execute if the condition
    is true and, optionally, an else clause.


    # return


    Specifies the value to return from a function.


    # static


    Indicates a variable that should persist across multiple calls to a function.
    Static variables will maintain their value from the previous call to function
    on subsequent calls rather than allocating a new variable with each function call.


    # namespace


    Designates a namespace to be used when creating classes or functions or, when
    coupled with using, when referring to a class or function.


    # struct


    An alternative to a class. Traditionally used for grouping member variables, it
    now provides the same functionality as a class.


    # new


    Allocates new memory dynamically (on the heap).


    # operator


    Used to designate an operator that will be overloaded.


    # try


    Designates a section of code that should be executed but that might generate exceptions.
    Exceptions are handled by code in a catch block.


    # private


    Indicates subsequent class member variables and functions should be private (accessible
    within that class only).


    # typedef


    Defines a new name to be used for a type; allows a user to use more compact and
    meaningful type names.


    # protected


    Indicates subsequent class member variables and functions should be protected
    (accessible to a class and its derived classes).


    # using


    Indicates a namespace to be used by default so that namespaces do not need to
    be specified explicitly for every command.


    # public


    Indicates subsequent class member variables and functions should be public (accessible
    to anything).


    # virtual


    Indicates that a function in a class can be defined more specifically in derived
    (children) classes.'
