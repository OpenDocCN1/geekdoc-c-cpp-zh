  md: "replace you fill in the code for search_and_replace based on what you have?\n\
    \nHere's how that function might be written. You can use the pos_first function\
    \ to find the position of the string you are searching for (24). If it's not found,\
    \ you return false(i); otherwise, you identify where string would end in (28).\
    \ Finally, you can replace_string to replace the string and return true(j).\n\n\
    And you can build up there to create another level. You can combine the function\
    \ just with a loop, which will let you replace every occurrence of a word in the\
    \ string with a different one. You can create a new function, building up from\
    \ the function you created, that just repeats over the loop until it returns false–that\
    \ is, until it can't find the string for the longer string (k).\n\nBottom-up design\
    \ is a great way to add features to a piece of software. When you have a product\
    \ that can already do one thing and then have a new idea that integrates with\
    \ it, you can create a new software product that incorporates an additional feature.\n\
    \nBottom-up designs tend to focus on what is possible with what you have, rather\
    \ than the top-down philosophy of how a particular problem is solved. As a result,\
    \ bottom-up implementations tend to be useful in a wider range of applications.\
    \ This makes the bottom-up method a good way of developing a library of related\
    \ functions–branch of functions that you might use across a range of domains.\n\
    \n```\n// Program 18_2\n// Example of bottom-up program string processing (incomplete)\
    \ - Stage 3\n#include <iostream>\n#include <string>\nusing namespace std;\n\n\
    pos_first(string& string_to_find, string& string_to_search) {\n    // Returns\
