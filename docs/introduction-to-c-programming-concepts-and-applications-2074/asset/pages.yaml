- pgno: 165
  md: "# // USING EXCEPTIONS\n\nThe solution to dealing with unexpected, \"exceptional\"\
    \ cases is through the use of exceptions. Here's how they work.\n\nFirst, you\
    \ have a function called from somewhere within a program. This call should occur\
    \ within what's referred to as a try block.\n\nSomewhere within the function that\
    \ is called, you encounter an error. This is where you realize that some exceptional\
    \ situation has occurred—maybe you've tried to access past the end of a vector\
    \ or you had text entered instead of a number.\n\nThat function then generates\
    \ an exception, which is basically a special note that something has gone wrong.\
    \ In C++, the term for this idea is throwing an exception. In other programming\
    \ languages, you might hear this called raising an exception.\n\n![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_165_0.png)\n\
    \nWhen you throw an exception, the function immediately returns. The exception\
    \ is being \"thrown\" back to the function that called the routine.\n\nBack in\
    \ the calling function, the exception is then caught. There is separate code that\
    \ is executed to handle the exception that occurred.\n\nIf you're going to deal\
    \ with exceptions, you need 2 parts of code. First, you have a try block, which\
    \ consists of the keyword try followed by curly braces. Whatever code is inside\
    \ the curly braces is something that you will \"try\" to execute.\n\nIf the code\
    \ executes and no exception is thrown within that code, then you go on to whatever\
    \ additional code follows. On the other hand, there could have been an exception\
    \ raised.\n\nImmediately following the try block will be one or more catch blocks—used\
    \ to \"catch\" any exception thrown when trying to execute the code in the try\
    \ block, including in any functions that were called from there. The catch block\
    \ will take in a parameter, which is going to be the exception that is returned.\n\
    \n```\ntry {\n    // Code to try\n}\ncatch (exception& e) {\n    // Code to handle\
    \ exceptions\n}\n// Additional code\n```\n\nIn many cases, you're going to be\
    \ throwing your own exceptions. But there are a few places in standard C++ where\
    \ exceptions are already thrown.\n\nLet's see how to handle exceptions in 2 cases.\n\
    \nThe fstream library supports the ability to throw an exception in the case of\
    \ trying to read from a nonexistent file.\n\nThere is a special command that has\
    \ to be run for the fstream first: the member function exceptions, which basically\
    \ activates the ability for fstreams to throw exceptions. The exceptions function\
    \ takes in as input the exceptions that are being activated."
  merge: -1
  img_proc: true
- pgno: 166
  md: "In this case, the exception you would care about is a predefined exception\
    \ called failbit: If the file does not open correctly, then a failbit exception\
    \ is thrown. So, for this code, because the fstream is named infile, the command\
    \ you'll write is infile.exceptions(fstream::failbit) (9).\n\nThen, you have a\
    \ try block (d), where the code you want to try to run is put inside the curly\
    \ braces. In this case, the code you're trying is opening the file.\n\nFollowing\
    \ that is a catch block (e), which takes in one parameter—a reference to an exception,\
    \ given the name category in this case.\n\nInside the catch block is the code\
    \ you want to run if the exception is caught. In this case, you print out a message\
    \ that there was an error opening the file. Then, you return a nonzero value.\
    \ Because you're in the main function, return means that the program ends, and\
    \ because it ended with a nonzero value, it indicates that there was an error\
    \ along the way.\n\nIf you run this code and the file does not exist, then the\
    \ open function you tried to call will generate an exception. And when this exception\
    \ is caught, you print out Error opening file, and the program ends.\n\nIf there\
    \ was not an exception, then you would have just skipped over the catch block\
    \ and gone on to the remaining code in the main function.\n\n```\n// Program 14_6\n\
    // Exception example - reading a nonexistent file, now with try/catch\n#include\
    \ <iostream>\n#include <fstream>\nusing namespace std;\n\nint main() {\n    fstream\
    \ infile;\n    infile.exceptions(fstream::failbit);\n    try {\n        infile.open(\"\
    something.dat\", fstream::in);\n    }\n    catch (exception& category) {\n   \
    \     cout << \"Error opening file\" << endl;\n        return 1;\n    }\n    int\
    \ a;\n    infile >> a;\n    cout << \"Read in: \" << a << endl;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 167
  md: "```\n// Program 14_7\n// Throwing exceptions - throwing directly\n#include\
    \ <iostream>\n#include <stdexcept>\nusing namespace std;\n\nint process_boxes(int\
    \ num_boxes) {\n    if (num_boxes < 1) {\n        throw exception();\n    }\n\
    \    // Do other stuff here\n    return 1;\n}\n\nint main() {\n    try {\n   \
    \     process_boxes(-1);\n    }\n    catch (exception& e) {\n        cout << \"\
    Had an exception!\" << endl;\n    }\n}\n```\n\nWhen you’re writing your own programs,\
    \ you throw an exception simply by calling the throw command. You need to throw\
    \ exceptions, so the syntax will be throw exception(). That creates an exception\
    \ and throws it back to the original function.\n\n> If you approach debugging\
    \ steadily and systematically, you will find your errors.\n\nImagine you have\
    \ some function, named process_boxes (7), that takes in an integer parameter.\
    \ It makes no sense if that function is called with no boxes, so in that case,\
    \ you might want to throw an exception.\n\nEither way, you’re creating an exception\
    \ and then throwing it. In most circumstances, it’s easier to just throw the exception\
    \ in one line of code that both creates the exception and throws it.\n\nInside\
    \ the function, you perform a check: If the number of boxes is less than 1, then\
    \ you have an invalid input and you’ll throw an exception (8).\n\nIf you didn’t\
    \ throw an exception, then the function would continue to do whatever else it\
    \ needed to.\n\nTo throw the exception, you just have throw exception() (9). An\
    \ alternative is that you could create an exception variable, exception bad_input,\
    \ and then you could throw that exception, throw bad_input.\n\nBack in the calling\
    \ function, you can try calling the routine with an invalid parameter and catch\
    \ the exception being thrown back (f), which results in printing a message that\
    \ there was an exception.\n\n```\n9     throw exception();\n```\n\n```\n9    \
    \ exception bad_input;\n10    throw bad_input;\n```\n\nNote that you had to #include\
    \ stdexcept here. You didn’t do this in earlier examples because including vector\
    \ or fstream automatically included basic exceptions as well. But if you don’t\
    \ use another library that is using exceptions already, you need to #include it\
    \ yourself."
