- pgno: 250
  md: 'In the reversi_board class, just the one default constructor is all you need,
    because the board will always be 8 by 8 in size. Again, you need to store the
    board information with a vector of vectors. And you need concrete implementations
    of the virtual functions declared in the parent class.


    At this point, you basically have your entire set of classes designed. But you
    might—and, in fact, will—end up wanting more functions than just these. Some functions
    will be too large to do everything in one function, so you''ll want to divide
    those larger tasks into smaller ones using top-down design principles.


    For the connect4_board, you need to check for winners in various directions, so
    you''ll include functions to check for winners in the vertical, horizontal, and
    both diagonal directions. You''ll also have a check to see if the board is totally
    full and if a column is full.


    All of this is similar to the procedural, top-down design you did in a previous
    lecture, but now these are member functions of the connect4_board class.


    Likewise, for a reversi_board, you''re going to want some additional functions
    to help you change the board. In particular, when you place a piece, you might
    need to flip pieces in any of 8 directions: up, down, left, right, and along 4
    diagonals. So, you''ll create 8 additional functions to help mark the board in
    those 8 directions after placing a piece.


    > Realistically, when you''re designing a set of classes, you might not know every
    function that you''ll need right at the beginning. That''s OK. You might need
    to change your class design as you build, but hopefully you''ll have the major
    parts of the design in place.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_250_0.png)


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_250_1.png)


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_250_2.png)


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_250_3.png)'
