  md: "# // VECTOR RESIZING\n\nOne of the nice features of vectors is that they can\
    \ change in size. You've seen one way of doing that—by using the push_back member\
    \ function. When you use that, you add an element to the back of the vector, increasing\
    \ its size by 1.\n\nWhen you call resize, if the new size is larger than the old\
    \ one, new elements are created and they are initialized with the value 0. If\
    \ the new size is smaller than the old one, the last elements of the vector are\
    \ removed.\n\nAnother way you can resize a vector is with a member function resize.\
