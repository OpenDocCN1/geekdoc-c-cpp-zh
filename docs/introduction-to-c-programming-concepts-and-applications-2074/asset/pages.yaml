  md: 'If you run the program, it will run it until it indicates the breakpoint and
    then stop. There will be a visual indicator showing which line of code will be
    next to execute: a yellow arrow on top of a red line in Visual Studio (or a highlighted
    line in Xcode).


    After pressing the Continue button, the indicator shows you''re now at this new
    line.


    ```

    6 int main() {

    7     cout << "Line 1" << endl;

    8     cout << "Line 2" << endl;

    ```


    Also notice the output of the IDE that you''ve output 2 lines of code: The first
    2 **cout** statements were executed.


    In this case, you''re stopping before any line of code was executed.


    Next, set a second breakpoint at the third **cout** statement. If you hit the
    Continue button at this point, the program will continue executing until it hits
    next (In Xcode, the Continue button is a rightward-facing hollow arrow (▷) below
    the code).


    That''s one way to go through the program: set breakpoints and continue running
    between them. But once you''ve reached a point of interest, you often want to
    examine just one line at a time. Putting a breakpoint on every line would be one
    way to do this, but that''s overkill.


    One way to progress through the code line is by using a command called Step Over.
    In Visual Studio, there is a button next to the top Step Over. (In Xcode, the
    Step Over button is ( ) at the bottom, next to the Continue button).


    At this point, the next line to be executed is the third **cout** statement. If
    you hit the Step Over button, the marker showing which line you''re about to execute
    progresses to the next executable: the **for** statement. The third line will
    be output.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_130_0.png)


    Lesson 11 | Top-Down Design and Using a C++ Debugger


