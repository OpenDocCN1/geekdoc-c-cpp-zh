  md: "# /* FIND */\n\nOften, **find** is used to find all values in some container.\
    \ It works by searching through the container and examining every element one\
    \ by one to see if a value is present.\n\n**find** takes in 3 parameters: a starting\
    \ iterator, an ending iterator, and a value to search for. It returns an iterator:\
    \ either one pointing to the first occurrence that matches the value being searched\
    \ for, or, if the value is not in the container, then it returns the ending iterator.\n\
    \nSuppose you have a list of ages of participants in some study and want to allow\
    \ a user to check whether certain ages participated. Notice that **algorithm**\
    \ is #included (5).\n\nIn this case, you create a vector of integers, named **ages**,\
    \ with the ages of the participants. Notice that some ages, such as 21 and 22,\
    \ are repeated (9).\n\nThen, you have an infinite loop where you continually ask\
    \ the user what age to search for (f).\n\nIn the loop, you use the **find** function\
    \ to try to find the particular age the person entered. You pass in **ages.begin**,\
    \ which is an iterator pointing to the beginning of the **ages** vector, and **ages.end**,\
    \ which is an iterator pointing just past the end of the **ages** vector. The\
    \ third parameter is the value you're searching for—in this case, the integer\
    \ the user entered (17).\n\n**find** will return an iterator. If the value the\
    \ user entered is found, then the iterator will not be pointing to the end iterator\
    \ (18). So, you can just verify that the age was found, and for proof, you print\
    \ the value that the iterator is pointing to (19). If the value was not found,\
    \ then the iterator will point to the end iterator, so you output that the value\
    \ was not found (22).\n\n```\n// Program 23_8\n// Find example\n#include<iostream>\n\
    #include<vector>\n#include<algorithm>\nusing namespace std;\n\nint main() {\n\
    \    vector<int> ages = { 23, 21, 18, 22, 21, 19, 20, 19, 27, 22 };\n    vector<int>::iterator\
    \ findval;\n    int agetofind;\n\n    cout << \"I have a list of ages of participants.\"\
    \ << endl;\n    while (true) {\n        cout << \"What age do you want to find?\
    \ \";\n        cin >> agetofind;\n        findval = find(ages.begin(), ages.end(),\
    \ agetofind);\n        if (findval != ages.end()) {\n            cout << \"Found\
    \ : \" << *findval << endl;\n        }\n        else {\n            cout << agetofind\
    \ << \" not found\" << endl;\n        }\n    }\n}\n```"
