  md: "# // STACKS\n\nIf you want to keep track of a set of actions you took so that\
    \ you can undo back to any point, you can do this using a very basic container\
    \ adaptor that provides one of the most basic operations needed in computing.\
    \ This is the stack, which is what’s called a LIFO (last in, first out) structure.\
    \ It means that the last thing you put on the stack is the first thing that comes\
    \ out of the stack.\n\nIn C++, you can declare a stack of some particular type\
    \ and then perform one of a few operations. There are 4 main operations that you\
    \ need to do to get just about everything you need to with a stack:\n\n+   » push\
    \ adds a new element to the top of the stack.\n» top is used to see what element\
    \ is on top of the stack.\n» pop removes the top element from the stack (whatever\
    \ it is).\n» empty returns a Boolean value that tells you whether or not the stack\
    \ is empty.\n\nLike most classes in the STL, there are also a few other functions\
    \ defined, such as a size function giving the size of the stack, but these 4 are\
    \ the only ones you need on a regular basis.\n\nIn this Program 22_1, notice that\
    \ you #include stack at the beginning of the program (4).\n\nThen, in your main\
    \ program, you declare a stack, s. Because the stack is a generic container, you\
    \ have to give it a particular type—in this case, that’s the integer type. So,\
    \ you write stack and then int in angle brackets, and then you give the name of\
    \ the stack variable, which in this case is s (8).\n\n> Remember that the angle\
    \ brackets are the way of specifying a particular type—the type that will replace\
    \ the template in the class definition.\n\nYou start by pushing 3 values onto\
    \ the stack: 10, 15, and 20; that is, you use the member function push and pass\
    \ in the values 10, then 15, and then 20 as arguments. This will create a stack\
    \ that should have 10 first so that it’s on the bottom, then 15 on top of that,\
    \ and then 20 on top of that (a).\n\nNext is a loop that continues as long as\
    \ the stack is not empty. You use !s.empty() as the condition for the while loop\
    \ (12).\n\n```\n// Program 22_1\n// Stack example\n#include<iostream>\n#include<stack>\n\
    using namespace std;\n\nint main() {\n    stack<int> s;\n    s.push(10);\n   \
    \ s.push(15);\n    s.push(20);\n    while (!s.empty()) {\n        cout << s.top()\
    \ << endl;\n        s.pop();\n    }\n}\n```\n\nFor each iteration of the while\
    \ loop, you do 2 things. First, you print out whatever is on top, using the top\
    \ member function to have access to that top element (13). Then, you pop off the\
    \ top element, reducing the size of the stack by 1, using the pop command (14).\n\
    \nAnd if you run this code, you indeed see the numbers printed off in reverse\
    \ order."
