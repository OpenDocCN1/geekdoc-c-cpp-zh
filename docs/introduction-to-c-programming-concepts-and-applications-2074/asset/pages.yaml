  md: "# 23 C++ Associative Containers and Algorithms\n\nIN THIS LECTURE:\n\n+   -\
    \ Containers\n- Program 23_1\n- Program 23_2\n- Program 23_3\n- Program 23_4\n\
    - Program 23_5\n- Program 23_6\n\nThe Standard Template Library (STL) provides\
    \ a wide variety of data structures and algorithms that you can use to write powerful\
    \ and efficient code in C++. You've seen previously a set of unitary containers\
    \ and container adapters that you can use to hold individual elements by one.\
    \ But there are also containers—called associative containers—that bring, or associate,\
    \ 2 or more types of elements together. Also in the STL are algorithms, which\
    \ provide an even more powerful set of standard tools for processing data.\n\n\
    +   - Templated Functions\n- Program 23_8\n- Program 23_11\n- Program 23_12\n\n\
    +   - Quiz\n- Quiz Answers\n\n# # CONTAINERS\n\n# / PAIRS /\n\nThe simplest of\
    \ the associative containers is the pair. There are many times you want a very\
    \ simple structure that just joins 2 things together. For example, you might be\
    \ keeping track of people and want a person to have an age and a name. The pair\
    \ provides a quick and easy way of joining 2 items into structure.\n\nA pair takes\
    \ 2 templated types: the type of the first item and the second of the second item.\
    \ When there are 2 or more types needed for a template, they are separated by\
    \ commas within the angle brackets.\n\nTo declare a pair of age and name\n\n```\n\
    // Program 23_1\n// Pair example\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    pair<int, string> p;\n    p.first = 45;\n    p.second = \"John\"\
    ;\n    cout << p.second << \" years old.\" << endl;\n}\n```"
