  md: '# // INCREMENTING VARIABLES


    Any time you make an assignment, you want to first evaluate the code on the right
    side and then, once you know the value, assign the resulting value to the left
    side. In example, a line has been added that you might encounter if you were adding
    extra butter, or other fat, to the recipe (13). It''s still fat, so you don''t
    need a new variable. Instead, the line of code is `fat_grams = fat_grams +1`.


    The way to think about this is that you first evaluate the right side, substituting
    in the value of any variables. In this case, you start with the value of `fat_grams`
    at 15, so the right side of this statement evaluates to `15 + 1`, or 16. Then
    assign that value, 16, to the variable on the left. It turns out that the variable
    that the new value is again `fat_grams`, but that''s not a problem—you''ve already
    figured out the value to use on the right side.


    The result is the value stored in the variable `fat_grams` has been increased
    by 1.


    That operation—where you take a value of a variable, add something to it, and
    then assign the result back to the original—is fairly common. You often want to
    modify a value rather than assign a totally new value.


    In fact, modifying existing variables like this is such a common operation that
    C++ has a shorthand way of writing this operation.


    ```

    1 // Program 2_10

    2 // Using a variable name on both sides of the assignment statement

    3 #include<iostream>

    4 using namespace std;

    6 int main() {

    7 int carb_grams;

    8 int protein_grams;

    9 int fat_grams;

    10 carb_grams = 30;

    11 protein_grams = 5;

    12 fat_grams = 15; // First we assign a value of 15

    13 fat_grams = fat_grams + 1; // Evaluate right side first, then assign to left

    14 int calories;

    15 calories = 4 * carb_grams + 4 * protein_grams + 9 * fat_grams;

    16 cout << "There are " << calories << " calories in this dish" << endl;

    17 }

    ```'
