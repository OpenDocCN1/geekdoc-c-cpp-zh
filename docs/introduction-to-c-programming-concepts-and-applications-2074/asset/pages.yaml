- pgno: 225
  md: "# // CONSTRUCTORS WITH INHERITANCE\n\nWhen using inheritance, constructors\
    \ for the most part work much like all the constructors you've seen before, but\
    \ it can be tricky to handle constructors when you're inheriting some of your\
    \ properties and not have direct access to them.\n\n```\n// Program 19_5\n// Inheritance\
    \ Example: Constructors\n#include<iostream>\n#include<string>\nusing namespace\
    \ std;\n\nclass bank_account {\nprivate:\n    string owner_name;\n    string owner_address;\n\
    \    long long int account_number;\n\nprotected:\n    double balance;\n\n    void\
    \ set_account(long int acctnum, double startbalance) = 0.0) {\n        account_number\
    \ = acctnum;\n        balance = startbalance;\n    }\n\npublic:\n    bank_account()\
    \ {\n        owner_name = \"\";\n        owner_address = \"\";\n        account_number\
    \ = 0.0;\n    }\n\n    bank_account(string name, string address, long long int\
    \ num, double bal) {\n        owner_name = name;\n        owner_address = address;\n\
    \        account_number = num;\n        balance = bal;\n    }\n```\n\nThe way\
    \ of this is that when you call a constructor in a derived class, you need to\
    \ first have a constructor for the base class. After all, the derived class is\
    \ only adding additional stuff whatever was in the base class. So, first you need\
    \ to have the base class set up, and then you can add whatever additional things\
    \ are needed for the derived class.\n\nThis way is done is that when a constructor\
    \ is defined, you put a colon after the constructor declaration, giving the constructor\
    \ to use for the base class.\n\nFor example, lets define 2 constructors for the\
    \ base bank_account. First, you'll have a default constructor that basically sets\
    \ everything to strings or to . Then, you'll have a constructor that takes in\
    \ all the various parameters to initialize all the member variables to specific\
    \ values. In this case, there are 4 parameters: for the owner's name, owner's\
