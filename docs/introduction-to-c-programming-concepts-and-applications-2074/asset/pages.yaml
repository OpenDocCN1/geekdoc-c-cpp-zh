- pgno: 115
  md: 'Vectors and strings are objects, and they have functions, such as push_back
    and size that "belong" to them. So, variables of type fstream are called objects
    because they also include their functions.


    The longer version of the command also asks you to specify how you want to work
    with that particular file—to read or write. If you''re just reading, it''s straightforward
    to open the my_file object: my_file.open("Test"). Writing to a file that the computer
    can have a few interpretations:


    out with trunc or ate, any existing data in the file will be overwritten.


    app means that you''re going to write output to the file but only after whatever''s
    already there. Nothing gets erased or deleted.


    To create a fstream object, you just declare it like other variables. You can
    choose the type, fstream, along with the object name—in this case, my_file.


    trunc means that you should delete whatever is already in the file and start writing
    from scratch. You can only use trunc if out is specified, and they are combined
    with a vertical bar { }.


    To actually use the file, you need to link up the object name that''s in your
    program with some file that''s on your computer. You do this using an open command.
    A simple version of the open command, but in most cases, it''s better to use the
    longer version.


    +   You can leave everything in the file that''s ever one character at a time.

    You can leave everything in place and everything you added onto the end.

    You can delete everything that''s already there and start writing to an empty
    file.


    ate writes at the end of the file, using the same effect as app but with some
    freedom to move around the file you''ve written in one place. ate should also
    be enabled with out, | between.


    To open a file in the simple version, you write the fstream object name, a period,
    then open, a string giving the filename in parentheses:


    To specify how to use the file, use special syntax. When you open the file, it
    will give just you the file name as an argument, but you''ll also have a comma
    and a second argument, starting with fstream::, which describes how you want to
    use the file:


    binary can be combined with any of the previous options using |. binary means
    that you''ll be outputting 1s and 0; Binary is a more efficient way of storing
    data, but it means people won''t be able to open a file and look at it as text.


    ```

    my_file.open("Test.dat", fstream::2ndArgument);

    ```


    ```

    <fstream variable>.open(<string with filename>);

    ```


    There are 6 different options:


    +   1 Read as (in)

    2 Output overwrites one character at a time (out)

    3 Append (app)

    4 Truncate (trunc)

    5 The-at-end of output (ate)

    6 Binary (binary)


    The file name should be the name of the file in computer explorer; the one you
    would see if you opened a file. Unless the file is in the same directory as your
    program, be sure to include the path information as part of the file name. In
    the following example line of code, the fstream object is called my_file, and
    the filename on the computer is Test.dat.


    > For the fstream variable f, to use the binary file input.dat for reading, we
    could write:


    ```

    f.open("input.dat", fstream::|fstream::binary);

    ```


    my_file.open("Test.dat");


    Lecture 10 | Files and Stream Operators in C++'
