  md: "```\n// Program 17_11_a\n// ++ Operator example - prefix and postfix\n#include<iostream>\n\
    using namespace std;\n\nclass elephant {\npublic:\n    float height;\n    float\
    \ weight;\n\n    elephant() {\n        height = 10.0;\n        weight = 13000.0;\n\
    \    }\n\n    void operator ++() {\n        // Prefix operator - for ++elephant\n\
    \        cout << \"increasing height of elephant\" << endl;\n        height +=\
    \ 0.1;\n    }\n\n    void operator ++(int whatever) {\n        // Postfix operator\
    \ - for elephant++\n        cout << \"increasing weight of elephant\" << endl;\n\
    \        weight += 100.0;\n    }\n\n    void print_characteristics() {\n     \
    \   cout << \"Height is \" << height << \" and Weight is \" << weight << endl;\n\
    \    }\n};\n\nint main() {\n    elephant Dumbo;\n    Dumbo.print_characteristics();\n\
    \    Dumbo++;\n    Dumbo.print_characteristics();\n    ++Dumbo;\n    Dumbo.print_characteristics();\n\
    }\n```\n\nIn Program 17_11_a, you've created 2 versions of the ++ operator: one\
    \ for prefix and one for postfix. You have an elephant class with height and weight.\
    \ The prefix operator will increase the height of the elephant, while the postfix\
    \ operator will increase the weight.\n\nFor the prefix operator, you just have\
    \ the operator defined with no parameters (16). For the postfix\n\noperator, you\
    \ have an integer parameter included—but it never gets used (22).\n\nIf you were\
    \ to define the operator outside the class, then the prefix version would have\
    \ one parameter—of type elephant, in this case—and the postfix version would have\
    \ 2 parameters: the first one being an elephant and the second one being an integer.\n\
    \nThere are a few rules of thumb for when it’s best to define operators—inside\
    \ of the class or outside.\n\nIt usually makes sense to define an operation inside\
    \ the class if you’re defining\n\n+   1. any unary operator, or\n2. a binary operator\
    \ that operates on 2 of the same type, such as a comparison of 2 objects of the\
    \ same type.\n\nThis is because these are operations that are a part of only that\
    \ class and no other.\n\nOn the other hand, it can make sense to define outside\n\
    \n+   » if 2 different classes are involved, and\n» especially if you need to\
    \ provide an operation in both forms.\n\nStill, there’s no single right answer;\
    \ rather, it’s a judgment call. Think about whether an operator feels more like\
    \ it’s part of a class or external to a class."
