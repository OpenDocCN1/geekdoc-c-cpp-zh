- pgno: 260
  md: "# // QUEUES\n\nAn alternative container adaptor gives you a FIFO (first, first\
    \ out) data structure. This is called a queue, and it's much like the stack, but\
    \ instead of the last thing being the one you can access, it's the first thing\
    \ in. Queues used to represent any sort of process where the first thing into\
    \ the line is the first thing you want out.\n\nYou can push the numbers 10, 15,\
    \ and 20 into the queue (b), just like you pushed into the stack, and you can\
    \ have a loop that continues as long as the queue isn't empty (12).\n\nInside\
    \ the loop, you'll print the element at the front by using the front function\
    \ and outputting q.front() (13). Then, remove that front element by calling pop\
    \ (14).\n\n+   It has 4 operations, like the stack did:\n* push adds an element\
    \ to the end of the queue.\n* front tells you which element is in the front of\
    \ the line (analogous to top from the stack commands).\n* pop removes the element\
    \ at the front of the queue.\n* empty tells you if the queue is empty or not.\n\
    \nAnd you see that the elements came off in the same order you put them in.\n\n\
    In addition to the stack, and queue, another container is the deque (short for\
    \ double-ended queue).\n\nA deque works a lot like a vector. It's just instead\
    \ of having push_back and pop_back, it has push_front and pop_front, too. It has\
    \ basically all the operations that a vector has. You can get the size using size\
    \ or make it empty using clear. You can access elements using square brackets\
    \ with the element number or using the at command that you can guarantee you're\
    \ not reading or writing past the end of the allocated memory.\n\nIn Program 22_2,\
    \ notice that you now #include queue at the beginning (4).\n\nIn the main body\
    \ of the code, you declare a queue, where the type that you want the queue to\
    \ hold is an integer. So, you write queue<int> and then the name of the queue,\
    \ which in this case is q (8).\n\nBut it's less efficient than a vector, and there\
    \ is rarely an instance where you all the extra functionality that a deque provides.\n\
    \n```\n// Program 22_2\n// Queue example\n#include<iostream>\n#include<queue>\n\
    using namespace std;\nint main() {\n    queue<int> q;\n    q.push(10);\n    q.push(15);\n\
    \    q.push(20);\n    while (!q.empty()) {\n        cout << q.front() << endl;\n\
    \        q.pop();\n    }\n}\n```\n\n![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_260_0.png)"
