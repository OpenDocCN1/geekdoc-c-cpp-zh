  md: '# # Introduction to C++;

    Programming Concepts and Applications


    As computers become more and more part of our everyday lives, it is easy to imagine
    them as controlling our lives. Programming gives us a chance to truly be in charge
    of the computers. Programming lets us specify how a computer should operate at
    the lowest levels. And by using low-level commands we mastered, we can get the
    computer to do many interesting things.


    You explore how the flow through a computer program is managed, looking at the
    key concepts of conditionals—where choices can be made (lecture 3)—and loops,
    where commands can be repeated (lecture 5). You also learn how to make use of
    the numerous functions that C++ provides in standard libraries (lecture 6).


    full support OOP development. OOP typically involves 3 key ideas, of which is
    explored: encapsulation, where similar data and functions are grouped together
    (lecture 16); inheritance, where variables and functions are shared from one structure
    to another (lecture 19); and polymorphism, where different functions can be used
    interchangeably (lecture 20).


    OOP also brings the use of constructors, and operators are defined similarly.
    Finally, it is not an OOP-specific topic, the need to allocate and indicate how
    memory comes up in the context of C++.


    This course explores the process of programming—specifically using the C++. It
    is one of the most powerful programming languages available, giving programmers
    the power to control from the lowest levels—specifying individual elements of
    memory. C++ supports various paradigms, the traditional and procedural approach
    which have long been a part of many languages, the object-oriented approaches
    that began to dominate programming, and declarative approaches that let programmers
    specify behavior at an even greater general level.


    Next, the course turns to that C++ provides for handling amounts of data. You
    are introduced to arrays, a method carried over from the C language that forms
    the basis for storing data in a large block of memory (lecture 7); and the that
    the array structure to provide additional safety and functionality (lecture 8).
    The vectors that are treated in C++ is very similar to the ways it handles strings,
    collections of characters used to handle text (lecture 9). For large amounts of
    data, interactive input and output are less feasible, so you will also learn how
    C++ can handle files (lecture 10).


    The last major topic is generic programming, emphasizing the use of the Standard
    Template Library (STL) in C++. You discover key aspects of the STL and how it
    can simplify your programming (lecture 22 and 23).


    This course walks through the start of programming, providing a tour of all the
    key aspects of programming in C++. No prior programming knowledge is assumed,
    and instructions are provided to help novice programmers get everything up to
    begin their programming journey.


    With fundamental concepts programming, the course turns to the heart of procedural
    programming: the use of functions, allowing you to encapsulate, making it feasible
    to develop larger and more complex programs. You will learn to write your own
    functions (lecture 12) and the different ways you can handle parameters, including
    the introduction of the reference (lecture 13).


    Throughout the course, we are interspersed with the larger issues of how to move
    from simple lines of code to developing larger programs (lectures 4, 11, 15, 21
    and 24). The course covers topics including memory management, exception handling,
    top-down and bottom-up design, and object-oriented programming.


    The lectures start with the basics of programming, describing how variables work,
    how basic input and output is, and how computations can be performed (lectures
    1 and 2).


    Following this, the course turns to object-oriented programming (OOP). It is the
    most commonly used paradigm today, and C++ provides


    the power of OOP is to design a game engine that can play with different games
    (lecture 21). The course concludes with a final showing showing how C++ can be
    used to develop algorithms and in particular focuses on how an artificial intelligence
    can be the opponent in a game (lecture 24).


    Course Scope'
