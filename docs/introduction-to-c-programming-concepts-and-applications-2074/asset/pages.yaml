- pgno: 287
  md: "# // QUIZ ANSWER\n\n1 a For a board evaluation function, an easy method is\
    \ to just take the number of player 2's pieces and subtract the number of player\
    \ 1's pieces. When player 2 is doing better (has more pieces), the score will\
    \ be higher, and when player 2 is doing worse (has fewer pieces), the score will\
    \ be lower.\n\nNote that there are other ways you could improve board evaluation\
    \ if you know game strategy well. For example, corners are generally more valuable\
    \ than other squares, because they cannot be flipped. And edge squares, especially\
    \ those 2 away from a corner, are usually slightly more valuable to hold than\
    \ other squares.\n\nb Here is one possible implementation. Note that this would\
    \ be a public member of the reversi_board class. So, it will have access to the\
    \ board member variable.\n\n```\nint get_board_score() {\n    int i, j;\n    int\
    \ totalscore = 0;\n    for(i=0;i<8;i++) {\n        for(j=0;j<8;j++) {\n      \
    \      if (board[i][j] == 1) {\n                totalscore -= 1;\n           \
    \ } else if (board[i][j] == 2) {\n                totalscore += 1;\n         \
    \   }\n        }\n    }\n    return totalscore;\n}\n```\n\nThe function just loops\
    \ over all the squares of the board and keeps track of a counter that is decreased\
    \ for each occurrence of player 1's piece and increased for each occurrence of\
    \ player 2's piece."
  merge: -1
