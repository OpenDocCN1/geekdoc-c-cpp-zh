  md: "# The concept of classes is important enough when C++ was first being developed,\
    \ it was originally called C with Classes.\n\nAn object is just one particular\
    \ instance of a more general class. For a given class, you can have many actual\
    \ objects.\n\nThen, you can use that to define any specific type. Defining each\
    \ specific machine looks like you defined a variable; that is, just defining an\
    \ object as a variable of a type. You define a class, and then you can declare\
    \ variables\n\nEach vending machine object declared in a way that makes it look\
    \ like a single variable, in reality, each vending machine contains more variables.\
    \ For example, there are variables for money,\n\nUsing object-oriented programming,\
    \ you can put all of these variables and functions together into one package.\n\
    \nWhen writing code, you think of each class referring to a new type—that's defined\
    \ by the programmer.\n\n+   >> the amount of money has put into the machine toward\
    \ buying something, the credit that has been accumulated;\n\nYou can collect all\
    \ the stuff referred to a vending machine—all the variables and all functions\
    \ that it needs—into one vending machine. And you don't need to learn outside\
    \ the vending machine everything going on inside; the inventory data, for example,\
    \ can be hidden from the outside. That's all data and those functions are wrapped\
    \ up in one package—a process referred to as encapsulation.\n\nSo, when you define\
    \ the class vending_machine, you are defining a new type of variable.\n\n+   >>\
    \ the total amount of money collected by the machine;\n>> the prices for all of\
    \ the items;\n>> the inventory level of each.\n\nIn addition to the data that\
    \ you want to track for the vending machine, you also have actions—also known\
    \ as operations—that want a vending machine to be able to perform. These actions\
    \ include\n\n```\n// Program 16_\n// Very basic class example\n#include <iostream>\n\
    using namespace std;\nclass vending_machine {\n  // More stuff here\n};\nint main()\
    \ {\n  vending_machine lobby_soda_machine;\n}\n```\n\nThree classes you've already\
    \ been using vector, string, and fstream. These predefined classes that you accessed\
    \ from the vector library, the string library, or the fstream library using #include.\n\
    \n+   >> taking money,\n>> giving the customer an item,\n>> returning change,\n\
    >> reporting inventory levels so that it can be refilled the proper amount.\n\n\
    You keep track of the data with variables, and you handle the actions with functions."
