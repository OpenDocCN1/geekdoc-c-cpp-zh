  md: "# 07 Arrays for Quick and Easy Data Storage\n\n+   IN THIS LECTURE:\n- Storing\
    \ Variables in Memory\n Program 7_1\n- Indexing into an Array\n Program 7_3\n\
    \ Program 7_4\n- Initializing an Array\n Program 7_5\n Program 7_8\n Program 7_10\n\
    - Array Bounds\n Program 7_11\n- Quiz\n Quiz Answers\n\nSociety today generates\
    \ massive amounts of data, including records of digital transactions, social media\
    \ posts, and information from sensors and devices spread everywhere. In order\
    \ to handle that large amount of data, we need a way to store it. And we need\
    \ to be able to store not just a few variables, but dozens, or hundreds, or thousands.\
    \ Frankly, there’s a solution—in fact, more than one—for handling as much data\
    \ as you have. Two methods for storing data are arrays, which were part of C,\
    \ and vectors, which were an improvement of C++.\n\n# // STORING VARIABLES IN\
    \ MEMORY\n\nLet’s say you want to store one variable. You declare a variable,\
    \ and that creates a \"box\" with that name that stores in memory. If you want\
    \ to store a second variable, you declare a second variable, which gets a new\
    \ box in memory.\n\nAn array is a collection of some number of variables. All\
    \ the variables will have the same type, and all will be referred to using the\
    \ same name, with a separate way of identifying each individual variable.\n\n\
    After the array name, you have a pair of square brackets, which let you specify\
    \ the size of the array, or the number of elements in the array. In this case,\
    \ you’re using an array of size 20.\n\nIf you wanted to allocate many variables—say\
    \ 20 of them—it would be possible to declare 20 different variables. Instead,\
    \ it would be easier to say, \"I want a set of 20 variables\"—and that is what\
    \ an array does.\n\nTo declare an array of variables, you still start with the\
    \ type of variable you want. Program 7_1 on page 77, it’s an integer.\n\nIn mathematics,\
    \ vectors and matrices are described using square brackets. Because an array is\
    \ similar to a vector or in matrix, it makes sense square brackets are used for\
    \ them, too.\n\nYou then have the name of the array, which is test_array. It wouldn’t\
    \ be practical to name all the variables with names, so you would refer to the\
    \ entire group—the entire array—by one name."
