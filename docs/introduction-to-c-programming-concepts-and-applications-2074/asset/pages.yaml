- pgno: 231
  md: 'Finally, both Single-Family House and Multiplex have a Yard Size member variable,
    so these could both be grouped under a Standalone House class.


    Note it is not necessary to divide this thing, but it is one option.


    +   - Real Estate (a base class) - Appraised Value, Square Foot


    +   - Commercial: Derived from Real Estate - Rental Price by Square Foot


    +   - Residential: Derived from Real Estate - Number of people who live there


    +   - Shopping Center: Derived from Commercial - Length of street frontage


    +   - Restaurant: Derived from Commercial - Kitchen area, Dining area


    +   - Office Building: Derived from Commercial - Number of exterior entries


    +   - Industrial Facility: Derived from Commercial - Number of loading docks


    +   - Standalone House: Derived from Residential - Yard Size


    +   - Single-Family House: Derived from Standalone House - Number of bedrooms
    and bathrooms


    +   - Multiplex: Derived from Standalone House - Number of separate units


    +   - Apartment: Derived from Residential - Monthly Rent


    +   - Condo: Derived from Residential - Monthly Maintenance Fee


    To define this, you need to specify that jet is inheriting from airplane : public
    airplane when declaring jet. Then, inside the class, you must declare only the
    new variable, numengines.


    ```

    class jet : public airplane {

    public:

    int numengines;

    };

    ```


    These commands are valid:


    ```

    commercialplane.weight = 10000.0;

    commercialplane.numengines = 4;

    privateplane.weight = 3000.0;

    ```


    And this one is not:


    ```

    privateplane.numengines = 4;

    ```


    Because jet inherits from airplane, a jet has both numengines and weight variables,
    so all assignments to commercialplane are valid. However, an airplane does not
    have a numengines variable, so privateplane is an airplane object, and not a jet
    object, it is invalid to try to assign that variable.


    Also, note that all variables were public, they are accessible from outside the
    class. If any of the variables were private or protected, then the corresponding
    command would not have been allowed.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_231_0.png)'
