    vector\" of \"floats.\" And these can be thought of the type of the variable.\n\
    \nUnlike an array, you don't specify a size for vectors. One of the interesting\
    \ features of vectors is that they can grow in size as you need them. Initially,\
    \ when you declare a vector like this—it has no elements in it. In this example,\
