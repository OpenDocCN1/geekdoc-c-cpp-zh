  md: 'sentinel is a deliberately unusual value that you wouldn''t normally encounter,
    it''s a value you use to identify when you''re processing "regular" data. A negative
    balance in a bank account could be a sentinel, assuming you''re not allowed to
    have an overdrawn account. You can use sentinels to help identify when it''s time
    to break out of a loop. If a sentinel value causes, the loop will be skipped over.


    There''s a good chance that you''ll accidentally create an infinite loop at some
    point in your program. It''s a common pitfall that it''s easy to make if you''re
    writing a loop condition, so it''s better to figure out early on on how to break
    out of one when it happens.


