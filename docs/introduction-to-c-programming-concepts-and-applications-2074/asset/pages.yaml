  md: 'An easy way to program exactly what you want is with a while loop. It''s like
    an if statement that keeps getting repeated as long as the if condition is true—in
    other words, while the condition is true.


    When the program comes to the while statement, it first checks the condition,
    just like it did with the if statement. In this case, the condition is still that
    the balance is greater than. As long as that true, everything in the curly braces
    while executed—even something inside the braces the condition no longer true.


    The part of the while loop inside the curly braces is called the body of the loop.
    Every time you go through the body of the loop, it is called iteration of the
    loop.


    You need to make only one small change to program the functionality you want:
    Just change the if to while word. And if you run the program now, you''ll get
    the exact output you would have had repeating the if statement 15 times.


    For example, even though the balance on the last payment, becomes negative, you
    continue to execute the remaining lines. The balance becomes negative when you
    subtract the payment. But you still execute the remaining lines in the curly braces:
    numerpayments++ and the cout statement to print the payment.


    When the condition is no longer true, you skip the lines in the braces and go
    to the next line after the while statement. If there are no lines after the loop
    ends, the whole program ends at that point.


    ```

    11 if (balance > 0.0) {

    ```


    ```

    11 while (balance > 0.0) {

    ```


    After in the braces has been executed, you reevaluate the condition. After all,
    at the end of the loop, things have changed, so maybe''s no longer a positive
    balance. If the condition is still true, then you do everything in the braces
    again. This can continue indefinitely.


    > How might you create a while loop to print the numbers from 1 to 10?


    There is a less common variation of the while loop called the do while condition
    check at the end of the loop and with a semicolon. Overall, the only difference
    is that the program is now forced to go through the very first iteration. This
    can be helpful if you know that you need to go through the loop at least once.'
