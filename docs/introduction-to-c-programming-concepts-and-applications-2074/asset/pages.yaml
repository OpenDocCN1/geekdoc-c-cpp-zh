  md: 'C++, a string is basically a vector made up of chars, That''s different from
    the ways strings were handled in C, which basically used an array of chars with
    an extra null character—the ASCII 0—at the end to mark the end of the string.


    Even in C+, a string literal is still like a C-style string. Because you can''t
    add arrays, that''s why you can''t add strings.


    In both C and C++ strings, a particular character in a string can be accessed
    using square brackets. And because C++ strings operate like vectors, we have all
    the benefits that vectors have over arrays.


    For example, recall that the at member function allows you to access a particular
    character and check that you don''t go out of bounds in the array.


    You also have the ability to get the size of a string, just like you get the size
    of a vector. It''s easier to think in terms of length of a string rather than
    size, so a length command is also provided.


    Strings can be compared to each other well. You can check whether two strings
    are equal. This means every character has to be checked to see if it matches.
    And the same goes for checking whether two strings are not equal.


    # Comparing strings is the basis for sorting in alphabetical order. Because upper-case
    letters come before lower-case in ASCII, "Zebra" will come before "apple" when
    comparing strings.


    Comparing less than or greater is a little trickier. This really involves considering
    whether the ASCII characters come before or after. To compare whether one string
    comes before another string according to the ASCII table, the comparison will
    go through by character, to find the first character that doesn''t match. If the
    ASCII value of the first nonmatching character is greater in one string, then
    that string is "greater".


    Strings have other member functions that are useful:


    +   - The empty returns a Boolean that is true if, and only, the string is empty—that
    is, does not contain any characters.

    - The find takes another string as an argument. It returns the position where
    that first string occurs in the given string,

    - The substring function takes two arguments; the first being the starting position
    and the second being the length. It returns a new string that is a piece of the
    old one. It will be the part that starts at the starting position and is of whatever
    length is specified.

    - The replace function lets replace part of string with another string.


    > A full list of member functions available for strings can be found at http://www.cplus.com/reference/string/string/'
