    So, the code reads as though you''re trying to output not true on the first line,
    and if it encounters an or that doesn''t make sense. The same thing happens on
    the second line.


    And is represented in C++ with &&.


    In fact, you''ll notice even on the first line (7), there are parentheses around
    the whole expression.


    > Be careful to use 2 ampersands to indicate and you use only one, that''s known
    as a bitwise and, and that''s not what you want.


    The or operation takes 2 Boolean values, but it is true if either one of the 2
    is true. It''s also true if both are true.


    In C++, or is represented with ||.


    | 1 // Program 3_6 |

    2 // Boolean order of operations |

    3 #include <iostream |

    4 using namespace std;

    5 |

    6 int main() {

    7 cout << (!true || !false && true) << endl;

    8 cout << ((true) || ((false) && true)) << endl;

    9 }


    > Always enclose your Boolean expressions in parentheses so you don''t have any
    weird behavior due to order of operations.


    You''ll probably find the character | above the backslash key on the right of
    your keyboard above the return or enter key.


