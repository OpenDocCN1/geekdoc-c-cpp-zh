    \ expanding an existing meaning in some way. Here, let's say that! defines a \"\
    dead\" lightbulb—a \"not\" lightbulb. You will set the used and lumens to 0 and\
    \ you'll copy the color temperature from before so that you can remember what\
    \ type was originally.\n\nIf you define the unary operator inside the class, you\
    \ have an empty parameter list. You just write lightbulb operator!() (30).\n\n\
    The function just sets watts_used and lumens to 0 and copies the temperature variable\
    \ (h).\n\nIn the main route, then, you can create a lightnamed bulb and then print\
    \ out the values !bulb and see that you have the modified value (45).\n\n```\n\
    // Program 12_11\n// Operator example defining a unary operator\n#include<iostream>\n\
