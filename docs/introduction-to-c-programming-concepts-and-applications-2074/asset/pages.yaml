  md: "# /* LOWER_BOUND */\n\nSTL also provides a **binary search** function called\
    \ `lower_bound`, which repeatedly searches over some range by examining the middle\
    \ and determining whether the thing being looked for is in the upper or lower\
    \ half of the range.\n\nFor example, Program 23_12 works just like the code you\
    \ used for `find`, but you have to first sort the vector (15). Then, you call\
    \ `lower_bound` just like you called `find` (16).\n\nIf the search finds the element,\
    \ then you get back an iterator pointing to the first occurrence. If it doesn’t\
    \ find the element, then it points to the next-largest element it finds. In this\
    \ example, if you search for the value 25, it doesn’t find that but instead returns\
    \ that it found 27—the next-largest value in the list.\n\nFor a large list—say\
    \ one with a million elements—binary search with **lower_bound** will be much\
    \ faster than an **iterative** search with **find**. So, the up-front cost of\
    \ sorting the elements one time first can easily be outweighed by the time savings\
    \ on the later searches.\n\n```\n// Program 23_12\n// Lower_bound example - using\
    \ binary search\n#include<iostream>\n#include<vector>\n#include<algorithm>\nusing\
    \ namespace std;\n\nint main() {\n    vector<int> ages = { 23, 21, 18, 22, 21,\
    \ 19, 20, 19, 27, 22 };\n    vector<int>::iterator findval;\n    int agetofind;\n\
    \n    cout << \"What age do you want to find? \";\n    cin >> agetofind;\n   \
    \ sort(ages.begin(), ages.end());\n    findval = lower_bound(ages.begin(), ages.end(),\
    \ agetofind);\n    if (findval != ages.end()) {\n        cout << \"Found : \"\
    \ << *findval << endl;\n    }\n    else {\n        cout << agetofind << \" not\
    \ found\" << endl;\n    }\n}\n```\n\n# Exercise 2\n\nSuppose you want to read\
    \ in a bunch of peoples’ names and salaries and then print a list of the people\
    \ from lowest to highest salary. To read in the information, imagine that you\
    \ just prompt users to enter their name and salary on the console repeatedly.\
    \ Because people won’t have a negative salary, ask the user to indicate that he\
    \ or she is done by entering a sentinel value, such as a negative value for the\
    \ salary.\n\nHow might you write this code?\n\nClick here to see the solution."
