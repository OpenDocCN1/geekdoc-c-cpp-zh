  md: "# // FRIEND FUNCTIONS\n\nOne of the main advantages of defining a function\
    \ or operator inside a class is that you get access to member variables and functions.\n\
    \nEven if you define functions or operators outside a class--for example, because\
    \ the function or operator involves 2 different classes--there's actually a mechanism\
    \ to make a function or operator still get access to the member variables. And\
    \ this is by declaring the function or operator a friend.\n\nTo do this, you include\
    \ the function or operator signature in the class definition with the designation\
    \ friend. That way, you can define the function outside the class and still have\
    \ access to member variables. Program 17_12 is an example, using lightbox multiplication.\n\
    \nIn the class definition, you say: \"There is going to be a friend operator that\
    \ will multiply a lightbox integer. The way you do this is by writing friend operator\
    \ *(lightbulb, int); Notice that you don't need to define the parameter names,\
    \ just types\n\n```\n// Program 17_12\n// Friend Operator example\n#include<iostream>\n\
    using namespace std;\n\nclass lightbulb {\n    int watts_used;\n    int lumens;\n\
    \    int temperature;\n\npublic:\n    lightbulb() {\n        watts_used = 60;\n\
    \        lumens = 500;\n        temperature = 2700;\n    }\n```\n\n```\nfriend\
    \ lightbulb operator *(lightbulb, int);\n```\n\n```\nlightbulb operator *(lightbulb,\
    \ int, int increase_factor)\n```\n\nThen, outside of the class, you can define\
    \ the actual operator, this with named parameters (25). Because this is a function\
    \ of the lightbox class, it will have access to all the private members of the\
    \ lightbox class. So, if the lightbulb has the parameter name bulb, you can access\
    \ elements of the lightbulb by writing bulb.lumens, and so on.\n\nYou can also\
    \ assign values to the object of the type lightbox by writing, for example, ans.temperature,\
    \ where ans is a lightbulb object. \n\n```\nvoid print_vals() {\n    watts_used\
    \ = bulb.watts_used*increase_factor;\n    lumens = bulb.lumens*increase_factor;\n\
    \    temperature = bulb.temperature;\n    return ans;\n}\n```\n\n```\nint main()\
    \ {\n    lightbulb bulba;\n    bulba = bulba * 2;\n    bulba.print_vals();\n}\n\
    ```"
