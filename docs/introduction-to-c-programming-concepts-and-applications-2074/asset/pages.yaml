  md: 'In the 1980s, Bjarne Stroustrup wanted to retain the low-level efficiency advantages
    of C while adding some of the more modern programming approaches. Thus, C++ was
    born!


    One big advantage of C++ was that it added the ability to do **object-oriented
    programming**, which lets you group your data and operations in more useful ways.
    But C++ is not only an object-oriented language. New features have been added,
    too, to reflect the most recent advances in programming language design.


    at a much higher level, using cutting-edge programming constructs that let you
    write code once and apply that to a wide range of applications.


    C++ was developed as a sort of extension of the programming language C, which
    was a descendant of an earlier language called B. All of these came from Bell
    Labs, later known as AT&T Labs. While B never got much use, C—which was developed
    in the early 1970s—became widely used and still today.


    C++ is also a language that continues to be developed today. There''s a large
    and active international C++ standards committee that is continually working to
    determine ways to improve the language, including adding new features that integrate
    the best and most recent programming practices.


    This makes C++ incredibly powerful, letting you work across a full range of programming
    paradigms. Like C, you can work in just about as low a level of detail as you
    want, specifying individual bits, or you can work


    # # WHAT HAPPENS WHEN YOU PROGRAM


    Programmers generate a program written in a programming language, such as C++.
    The program is just a text file, and you''re free to write it in many different
    ways. You could use your own word processor if you want and save it as a text
    file. You could use Notepad or WordPad on a PC or TextEdit on a Mac. There are
    also editors specifically designed to write people code, such as Notepad++.


    or **executed**, by a machine. This compiled version of the program is called
    an executable program, and you can run it on your computer whenever you want.


    As you go through this course, you''ll find it much more rewarding and valuable
    experience if you''re able to practice writing your code. See lecture 0b—C++ QUICK
    START.


    that code, the compiler compiles it into machine language, and then run it—often
    with just one click of a button.


    Once you write a program, the compiler takes the instructions in C++ and translates
    them into machine instructions—instructions that the computer can understand.
    So, a compiled program is a program that''s ready to be,


    As people develop code, they''ll go through this many times to see if it''s working.
    To make it easier to develop this code, programmers use an **integrated development
    environment (IDE)**, which will have an editor that lets you write, usually with
    some special features to help you write code in language. The IDE will have an
    easy way to automatically save


    And there are other features built into the IDE, such as a **debugger**, which
    is a tool that helps you find and fix errors in your program. The IDE integrates
    all these things—and more—into one package so that you can edit and compile and
    debug your code all in one program.


