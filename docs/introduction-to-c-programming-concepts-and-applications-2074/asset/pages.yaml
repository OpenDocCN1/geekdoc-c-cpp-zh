- pgno: 150
  md: "you can create 2 new functions, each with the same name, but with different\
    \ numbers of parameters. This approach is called function overloading—creating\
    \ more than one implementation with the same name.\n\nYou'll create version of\
    \ average that has just 2 parameters: a and b. Everything is basically the same;\
    \ you just return the two parameters by 2.0 (a).\n\nYou'll also create a version\
    \ of average that has 4 parameters, a and d. Again, the function is basically\
    \ the same, with just one parameter and the average computing the sum of 4 parameters\
    \ by 4.0 (b).\n\nWhen you call average, you can call it with 2, 3, or 4 parameters.\
    \ The compiler will call the appropriate function, whether it's one of 2, 3, or\
    \ 4 parameters.\n\nNotice when you overload a function, it makes sense to use\
    \ the same name for all the variations; you don't want to overload functions when\
    \ the variations will have very different names.\n\nThe function's header defines\
    \ the function signature, which is the name of the function but also the number\
    \ and types of parameters the function defines by name\n\ntake in. When there\
    \ is a call to a function, the compiler will match the call to the function signature—one\
    \ that has the right name, number of parameters, and the right types of parameters.\
    \ The names don't matter in the signature; it's just their number and types.\n\
    \nIn the Program 13_2, you have a function named average that takes 2 floating-point\
    \ parameters, another function named average takes 3 floating-point parameters,\
    \ and another function named average takes 4 floating-point parameters. These\
    \ function implementations are all distinct from each other.\n\nWhile the signature\
    \ includes the function name and the number of parameters, it does not include\
    \ the return type. So, it's not possible to overload by having 2 functions of\
    \ the same name returning different types—for example, returning a string and\
    \ returning a float.\n\nHowever, you can convert one type to another when a function\
    \ is called. If you call a function with parameters that don't exactly match the\
    \ signature they can be automatically converted to one that match the signature—such\
    \ as converting integers to floats—that only works if there's one possible matching\
    \ signature.\n\n```\n// Program 13_2\n// Multiple parameter options\nwith different\
    \ function signatures\n#include <iostream>\nusing namespace std;\nfloat average(float\
    \ a, float b) {\n    return (a + b) / 2.0;\n}\nfloat average(float a, float b,\
    \ float c) {\n    return (a + b + c) / 3.0;\n}\nfloat average(float a, float b,\
    \ float c, float d) {\n    return (a + b + c + d) / 4.0;\n}\nint main() {\n  \
    \  cout << \"The average of 10, and 35: \" << average(10, 35) << endl;\n    cout\
    \ << \"The average of 10, 35, and 17: \" << average(10, 35, 17) << endl;\n   \
    \ cout << \"The average of 10, 35, 17, and 21: \" << average(10, 35, 17, 21) <<\
    \ endl;\n}\n```\n\nNo 2 functions are allowed to have the same signature, because\
    \ the compiler needs to be able to distinguish between functions."
