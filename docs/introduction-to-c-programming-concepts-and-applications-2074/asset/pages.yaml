    of 10, 20, 30, 40, and 50 to them. Then, you create an integer i that you initialize
    to 3, and you print out a[i].


    The ability to index into an array by using a variable that contains the index
    gives you the ability to easily address all the elements of the array looping
    through it.


    For example, you can set all of the elements to initial values. Suppose you were
    playing a 4-person game and wanted to have the same amount of money in the begin—$200
    (Program 7_3).


