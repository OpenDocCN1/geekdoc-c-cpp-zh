    \ is not there *\n    return -1;\n}\n\nvoid replace_string(string& string_to_modify,\
    \ int start_pos, int end_pos, string& string_to_insert) {\n    string_to_insert\n\
    \    // Inserts string_to_insert into string_to_modify, replacing anything\n \
    \   in positions start_pos to BEFORE end_pos *\n}\n\nbool search_and_replace(string&\
    \ string_to_modify, string& old_string, string& new_string) {\n    int start_pos\
    \ = pos_first(old_string, string_to_modify);\n    if (start_pos == -1) {\n   \
    \     return false;\n    }\n    int end_pos = start_pos + old_string.size();\n\
    \    replace_string(string_to_modify, start_pos, end_pos, new_string);\n    return\
    \ true;\n}\n\nvoid search_and_replace_all(string& string_to_modify, string& old_string,\
    \ string& new_string) {\n    // Replaces every occurrence of old_string with new_string\
    \ and returns\n    // or false if it did not find old_string *\n    while (search_and_replace(string_to_modify,\
    \ old_string, new_string));\n}\n\nint main() {\n    // Code Here\n}\n```\n\nLecture\
    \ 15 | Functions in Top-Down and Bottom-Up Design"
