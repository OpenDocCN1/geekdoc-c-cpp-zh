  md: "# Exercise 1\n\nLet’s say that in addition to cups, you wanted to sell plates.\
    \ Create a new type of product, a plate, that includes a diameter measure.\n\n\
    Click here to see the solution.\n\n# // THE PROTECTED CATEGORY\n\nUp until this\
    \ point, the examples have had all of the member variables be public. But, as\
    \ discussed when encapsulation was introduced, the idea of information hiding—of\
    \ not allowing outsiders access to more information than they need—is important\
    \ to creating good classes. It helps ensure that a class’s member variables are\
    \ only modified in approved ways, so you declare some member variables as private\
    \ and some as public.\n\nWhen it comes to inheritance, there’s a third category\
    \ that’s in between public and private: protected.\n\nAs before, things that are\
    \ public will get inherited by all of the descendants and be public members of\
    \ all those descendants. Any code can call those member functions or access those\
    \ member variables directly.\n\nThe private member properties are accessible only\
    \ to the class they are declared in, and no others. Not even the descendants of\
    \ a class can access those member properties\n\nthat are considered private. So,\
    \ although the descendants still inherit those variables and functions—that is,\
    \ they still allocate space for those member variables and can have values stored\
    \ there—they can’t actually call the private functions or read the private variables\
    \ defined in an ancestor.\n\nThis is the reason for the protected category. Protected\
    \ member properties are accessible to the class they’re declared in and to the\
    \ descendants, but nothing outside of the class. In effect, this is like a private\
    \ member property for everything following in the inheritance tree.\n\nLet’s say\
    \ you create a bank_account class that can be used to keep track of different\
    \ bank accounts. You’ll have a base class called bank_account and 2 derived classes,\
    \ checking_account and savings_account.\n\nThe bank_account class is declared\
    \ just like any other class (7). It’s not inheriting from anything.\n\nWithin\
    \ the bank_account class will be 3 groups of member properties. First, you have\
    \ private member properties (i), which in this case are the owner’s name, address,\
    \ and account number. Because these are private, that means that the derived classes,\
    \ which will be checking_account and savings_account, will have access to those\
    \ member variables but won’t be able to access them directly. The only way they’ll\
    \ be able to access these variables is indirectly, through a member function inherited\
    \ from bank_account. No other classes outside bank_account will be able to access\
    \ them directly, either.\n\n```\n// Program 19_4\n// Inheritance Example: Public/Protected/Private\n\
    #include<iostream>\n#include<string>\nusing namespace std;\n\nclass bank_account\
    \ {\nprivate:\n    string owner_name;\n    string owner_address;\n    long long\
    \ int account_number;\n...\n```"
