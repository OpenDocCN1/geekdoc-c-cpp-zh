  md: "Here's a situation in which you can extend existing class. Recall that exceptions\
    \ are used for getting out of functions when you have errors. There are different\
    \ types of exceptions: There is a base exception class, and then there are lot\
    \ of classes that derived from that. Some are derived directly from exception,\
    \ such as logic_error, and some are further derived from them, such as out_of_range\
    \ being derived from logic_error.\n\nthe empty string so that the constructor\
    \ could be called with just integer. The constructor uses the string to initialize\
    \ the logic_error base class, and it uses the integer parameter to set the bad\
    \ value variable (g). Finally, your new bad_value_exception has a public member\
    \ function, printval(), which prints the value (h). Basically, this class is your\
    \ own special exception that you can throw when you want to use and how you want.\n\
    \nHowever, the functionality of try-catch statements and throwing is designed\
    \ to work with the general exception class. All the various exceptions can be\
    \ used in any functions that take an exception as input, because they inherit\
    \ from exception.\n\nNext, you have a function defined, something_to_do, that\
    \ has one input parameter. for values less than 3, it will print a message, and\
    \ for others it will throw your bad_value_exception (i).\n\nYou can create your\
    \ own exceptions! Suppose you want to create a new version of a logic_error, that\
    \ you can use to report when there is a bad value. And say you want to keep track\
    \ of that value without exception itself.\n\nIn the main function, you have a\
    \ try block where you call the something_to_do with 3 different parameters (j).\
    \ The first call will be a good value, so it will just print an output statement;\
    \ no exception thrown. The second call, though, causes a bad_value_exception,\
    \ and in catch (K), you have a catch defined to take a bad_value_exception, and\
    \ for that you use the printval function to print the value.\n\nIn Program 20,\
    \ you've defined a new class (e), bad_value_exception, that inherits from logic_error.\
    \ The class does two things. First, it has a private integer value, which will\
    \ be used to store the bad value that was used (f). It has a constructor that\
    \ takes an integer and a string, with a string having a default value of\n\nWhen\
    \ this is run, you get one line of output from the something_to_do function and\
    \ another line printed from the printval as part of the exception catching.\n\n\
    ```\n// Program 20\n// Defining our own exception\n#include <iostream>\n#include\
    \ <exception>\n#include <stdexcept>\nusing namespace std;\n\nclass bad_value_exception\
    \ {\n    private:\n        int value;\npublic:\n    bad_value_exception(int n,\
    \ string s = \"\") : value(n) {}\n    void printval() {\n        cout << \"the\
    \ number \" << value << \" was used when it wasn't allowed.\" << endl;\n    }\n\
    };\n\nvoid something_to_do(int x) {\n    // If the value is less than 3, then\
    \ throw an exception otherwise\n    if (x < 3)\n        throw bad_value_exception(\"\
    Bad Value!\");\n    else\n        cout << x << \" is a good number.\" << endl;\n\
    }\n\nint main() {\n    try {\n        something_to_do_to_do(1);\n        something_to_do(5);\n\
    \        something_to_do(10);\n    } catch (bad_value_exception e) {\n       \
    \ e.printval();\n    }\n    return 0;\n}\n```\n\nLecture 20 | Object-Oriented\
    \ Programming with Polymorphism"
