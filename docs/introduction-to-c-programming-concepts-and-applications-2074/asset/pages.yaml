  md: "# STEP 5: RETEST\n\nOnce an error is fixed, you need to retest everything.\
    \ Your goal is not just to show that the fix you made fixed the one problem you\
    \ had isolated and identified. You want to make sure that you didn’t break anything\
    \ else in the meantime. If you’ve saved all your tests, now is the time to rerun\
    \ them and make sure you still get correct results for everything that was previously\
    \ correct—plus for the test you just fixed!\n\nWhen you test the palindrome program\
    \ on aaa now, it returns that it is a palindrome. You could check other tests:\
    \ abc is not a palindrome; bob is a palindrome. The program seems to be working\
    \ now.\n\n# STEP 6: CONSIDER\n\nBefore your debugging task is done, there’s one\
    \ final step: You should think about whether anywhere else in the code is likely\
    \ to have a similar error.\n\nErrors tend to multiply when there are different\
    \ versions of the same calculation. Sometimes, people copy and paste code from\
    \ one area to another and thereby duplicate any errors. Other times, if your thought\
    \ process was off, you might have made the same conceptual error in other parts\
    \ of the code.\n\nThe key is to spend time thinking about whether the fix you\
    \ made would apply somewhere else, too. If so, fix and test that other part of\
    \ your code as well.\n\nFor the palindrome program, you should think: \"Were there\
    \ any other places where I was assuming the string went all the way to size rather\
    \ than size minus 1?\" In this case, the answer is no, so you’re done debugging.\n\
    \n```\n// Program 14_2\n// Example program to debug - fixed!\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nstring remove_spaces(string s) {\n\
    \    string ret = \"\";\n    int i;\n    for (i = 0; i < s.size(); i++) {\n  \
    \      if (s[i] != ' ') {\n            ret += s[i];\n        }\n    }\n    return\
    \ ret;\n}\n\nbool is_palindrome(string s) {\n    string no_spaces = remove_spaces(s);\n\
    \    bool could_be_palindrome = true;\n    for (int i = 0; i < no_spaces.size()\
    \ / 2; i++) {\n        if (no_spaces[i] != no_spaces[no_spaces.size() - 1 - i])\
    \ {\n            could_be_palindrome = false;\n        }\n    }\n    return could_be_palindrome;\n\
    }\n\nint main()\n{\n    cout << \"This will tell you whether certain text is a\
    \ palindrome.  Enter some text:\" << endl;\n    string user_input;\n    getline(cin,\
    \ user_input);\n    if (is_palindrome(user_input)) {\n        cout << \"It is\
    \ a palindrome!\" << endl;\n    }\n    else {\n        cout << \"It's not a palindrome.\"\
    \ << endl;\n    }\n}\n```"
