  md: "# // OVERLOADING STREAM OPERATORS\n\nIt is very common that you’d want to stream\
    \ data from an object to output it to the console, a file, or a string. Likewise,\
    \ it’s common that you’d want to stream data into an object. It would be nice\
    \ to declare a lightbulb object and just be able to cout or cin it. But to do\
    \ this, you have to overload the stream operations.\n\nRemember that the syntax\
    \ of a stream operation is that you have the stream on the left, then the stream\
    \ operator (<< for output or >> for input), and then the thing you are wanting\
    \ to stream out of or into. And the stream should be able to continue afterward.\n\
    \nBecause the stream itself comes at the left of the list, that means that you\
    \ can’t write a stream operation for your new class as part of that class.\n\n\
    So, instead, you need to have the stream operation defined outside the class (21).\
    \ It’s a good idea to make this stream operator a friend operator (18), because\
    \ that way you’ll have access to the member variables.\n\nYou can think: \"If\
    \ I’m outputting to a stream, I’ll have an ostream, and if I’m inputting, I’ll\
    \ have an istream.\" Both are predefined stream types, where cin is an example\
    \ of an istream and cout is an example of an ostream.\n\nYou’ll also need to make\
    \ sure that your operator returns another stream, because that way you can stream\
    \ one thing after another; the result of the operation is a stream, which then\
    \ can have another operation applied, and so on ♦.\n\n```\n// Program 17_13\n\
    // Overloading Output Stream Example\n#include<iostream>\nusing namespace std;\n\
    \nclass lightbulb {\n    int watts_used;\n    int lumens;\n    int temperature;\n\
    \npublic:\n    lightbulb() {\n        watts_used = 60;\n        lumens = 500;\n\
    \        temperature = 2700;\n    }\n    friend ostream& operator <<(ostream&,\
    \ const lightbulb&);\n};\n\nostream& operator <<(ostream& s, const lightbulb&\
    \ b) {\n    s << b.watts_used << \" \" << b.lumens << \" \" << b.temperature;\n\
    \    return s;\n}\n\nint main() {\n    lightbulb bulb;\n    cout << bulb << endl;\n\
    }\n```\n\n# READINGS\n\na Stroustrup, Programming Principles and Practice Using\
    \ C++, sections 9.4, 9.6, and 9.7.\n\nb Lippman, Lajoie, and Moo, C++ Primer,\
    \ section 7.5, chap. 14, and section 15.7."
