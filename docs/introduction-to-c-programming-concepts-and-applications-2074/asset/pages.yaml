- pgno: 177
  md: 'When designing your program, using pseudocode to look out your functions, look
    at all of them and search for places where you want to reuse the code. Or a file
    might seem to have too many ideas in one place. Both are good times to consider
    breaking functions into separate files.


    +   Dividing functions across files helps ensure that no single file is too large
    and everything in one file is closely related.


    +   By separately compiling files, only the files that are recompiled. On large
    projects, that can greatly improve productivity.


    There are many reasons why separate compilation is useful, particularly for larger
    tasks.


    +   It makes it easier to reuse files in other programs; you write the code once
    and then just #include in it other programs.


    In fact, you could separately compile every function you write. But for beginners,
    this makes a code harder to handle, and you will not be able to execute code from
    the browser-based development environment. The rule of thumb is to consider separation
    when you might reuse code or to simplify files. 🔸


    # HOW TO CREATE SEPARATE SOURCE AND HEADER FILES IN YOUR IDE


    In Visual Studio, the separate files you create are not automatically put in your
    project, so you will have to add files to the project when you''re ready to compile
    them. To add your separate files to the project:


    +   Save the files.


    +   Go to the project window and select “add” and “existing item”.


    +   Add all 3 files to the project:


    +   the source file that contains main


    +   the header file that contains the function header


    +   the source file that contains the function definition


    +   Then, you can build the project: run it.


    # READINGS


    +   Stroustrup, Programming Principles and Practice Using C++, 8.7 for (namespaces).


    +   Lippman, Lajo, and Moo, C++ Primer, section 18.2 (for namespaces).


    +   Csterhouse, A Philosophy of Software Design, chap. 4 (describing design) and
    chap. 5 (describing information hiding).


    +   See references from lecture 11: Problem Solving and Program Design in C (8th
    ed.) by Jeri R. Hanly and Elliott B. Koffman and Problem Solving, Abstract, and
    Design Using C++ (6th ed.) by Frank Lied and Elliott B. Koffman.


    Xcode automates putting the files in the project.


    +   Start with the main.cpp file, with main automatically repeating.


    +   Go to the File menu and create a Header File.


    +   Save it as .h.


    +   Save it as a C++ file, .cpp.


    +   If you create the .cpp source file first, Xcode will give you the option of
    also creating the header file automatically.


    +   Build and Run the program.'
