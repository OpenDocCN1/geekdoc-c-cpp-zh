- pgno: 289
  md: '# binary tree


    A data tree where every node has at most 2 children. (L18)


    # call (aka function call)


    A command that causes a function to be executed using any arguments specified.
    Functions are called by writing their name followed by parentheses that contain
    any arguments to give to the function. (L6)


    # Boolean


    A true or false value used in conditions and logical expressions. A Boolean can
    be a specific true or false value, a Boolean variable can take on a true or false
    value; a Boolean logical operators. (L3)


    # casting a value


    See Type casting.


    # Boolean operator


    See logical operator.


    # class


    A programming structure that combines data with operations (member variables)
    (member functions). Each class is a new type of variable defined by the programmer.
    (L16)


    # bottom-up design


    Creating larger, more complex programs by combining simpler pieces. Often, new
    functions are created by combining calls to existing functions. (L15)


    # comparison operator


    An operator for comparing 2 different values, the result of which is a Boolean.
    Common comparisons are greater than (>), greater than equal to (>=), less than
    (<), less than equal to (<=), equal to (=), and not equal to (!). (L3)


    # breakpoint


    When debugging, a point at which execution of the program stops. (L11)


    # compile


    The process of turning code into machine instructions. Code is compiled into debug
    mode or release mode. (L4) See also preprocessor commands and separate compilation.


    # bug


    A mistake in a program that causes it to fail, crash when running, or produce
    incorrect output. Debugging a program is a common part of programming. (L4, L14)


    # C++ Standard Library


