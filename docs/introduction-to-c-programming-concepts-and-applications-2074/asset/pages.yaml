  md: '# 15 Functions in Top-Down and Bottom-Up Design


    IN THIS LECT:


    +   - Top-Down Design

    - Program 15_1_1

    - Program 15_1_2

    - Program 15_1_3


    Functions let you write much bigger and more complex programs than would otherwise
    be possible, and the power of functions is even greater when integrated with a
    deliberate approach to software design. Functions integrate equally well with
    top-down and bottom-up design approaches.


    +   - Bottom-Up Design

    - Program 15_2_1

    - Program 15_2_3


    +   - Building a Library

    - Program 15_3


    +   - Quiz

    - Quiz Answers


    # // TOP-DOWN DESIGN


    With top-down design, you take a larger problem and treat it as a set of smaller
    problems without worrying about how each of the smaller problems impacts. Your
    job with one task is to break it into even simpler subtasks or implement it directly.


    So, if you consider the tree structure you create in top-down design, each of
    the nodes can become, in effect, a function of its own. Instead of merely turning
    the hierarchical tree into a series of comments, you can turn it into a collection
    of functions.


    Let''s see what this might look like designing a program to play a game of Connect
    4, which is played by 2 players, each with a different color piece, usually red
    or black. Players take turning down columns of the board: When a piece is dropped,
    it travels as far as it can, until it is either at the bottom or on top of another
    piece. The goal is to get 4 pieces in a row vertically, horizontally, or diagonally.


    Remember that you must have a function declaration before you call it, this means
    that the functions listed earlier in the code will be far from the root of the
    tree. The main function will correspond to the root of the tree and will come
    last.


    With functions, you have a similar motivation. A function is a way of conceptually
    separating one set of functionality from everything else. This is very similar
    to the way you treat each of the subtasks in top-down design.'
