  md: "# // VIRTUAL FUNCTIONS\n\nVirtual functions get defined differently—that is,\
    \ take on a different shape—in all the child classes.\n\nThis is a modified version\
    \ that does, in fact, demonstrate polymorphism. Notice that this code is the same\
    \ as the previous code, except for a few changes:\n\n+   » In the base class,\
    \ car, you now have the word virtual in front of your 2 member functions that\
    \ you want to override in the base class (r). The virtual is needed to say that\
    \ \"this function will be a polymorphic function.\"\n» You have defined a new\
    \ function, called print_car. This function takes in a car parameter—as a reference—and\
    \ calls print_info for that car (s).\n» The main code is also modified so that\
    \ you are calling the print_car function, passing in a car and an SC300 rather\
    \ than calling the member functions for each (27, 63).\n\nWhen you run this code,\
    \ you indeed see that the specific versions of print_info are called. In other\
    \ words, when you call print_car with a car object, it will end up calling the\
    \ print_info command defined in the car class. And when you call print_car with\
    \ an SC300 object, it will end up calling the print_info command defined in the\
    \ SC300 class. This is exactly what you want from polymorphism: the ability to\
    \ define a different version of a function for different classes. This way, when\
    \ you call print_car, you get the most descriptive output you can.\n\n```\n//\
    \ Program 20_5\n// Polymorphism Example\n#include<iostream>\n#include<string>\n\
    using namespace std;\n\nclass car {\nprotected:\n    float base_price;\n    string\
    \ model_name;\npublic:\n    car() {\n        base_price = 20000.0;\n        model_name\
    \ = \"Generic1\";\n    }\n    car(float price, string name) {\n        base_price\
    \ = price;\n        model_name = name;\n    }\n    virtual void print_info() {\n\
    \        cout << \"The model \" << model_name << \" costs \" << base_price <<\
    \ endl;\n    }\n    virtual float price() {\n        return base_price;\n    }\n\
    };\n\nclass SC300 : public car {\nprotected:\n    bool performance_package;\n\
    \    bool entertainment_package;\n    bool safety_enhancements;\npublic:\n   \
    \ SC300(bool p, bool e, bool s) : car(35000.0, \"SC300\") {\n        performance_package\
    \ = p;\n        entertainment_package = e;\n        safety_enhancements = s;\n\
    \    }\n    void print_info() {\n        cout << \"The model \" << model_name;\n\
    \        float total_price = base_price;\n        if (performance_package) {\n\
    \            cout << \", with the performance package\";\n            total_price\
    \ += 3000.0;\n        }\n        if (entertainment_package) {\n            cout\
    \ << \", with the entertainment package\";\n            total_price += 1200.0;\n\
    \        }\n        if (safety_enhancements) {\n            cout << \", with safety\
    \ enhancements\";\n            total_price += 2100.0;\n        }\n        cout\
    \ << \" costs \" << total_price << endl;\n    }\n    float price() {\n       \
    \ float total_price = base_price;\n        if (performance_package) {\n      \
    \      total_price += 3000.0;\n        }\n        if (entertainment_package) {\n\
    \            total_price += 1200.0;\n        }\n        if (safety_enhancements)\
    \ {\n            total_price += 2100.0;\n        }\n        return total_price;\n\
    \    }\n};\n\nvoid print_car(car& c) {\n    c.print_info();\n}\n\nint main() {\n\
    \    car x;\n    print_car(x);\n    SC300 y(true, false, true);\n    print_car(y);\n\
    }\n```"
