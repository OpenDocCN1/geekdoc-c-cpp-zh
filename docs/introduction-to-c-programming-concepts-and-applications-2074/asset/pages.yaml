- pgno: 219
  md: "# TERMINOLOGY\n\nThere are different terminologies that are sometimes used\
    \ to describe the relationships between different classes in a class hierarchy.\n\
    \nFollowing the terminology used for trees, you may refer to a parent class and\
    \ child class. One parent can have several children, also known as offspring.\n\
    \nA superclass is the class above a point in the hierarchy, and a subclass is\
    \ a class below a point in the hierarchy. A superclass encompasses many different\
    \ classes, while a subclass is a narrower description of a class.\n\nThe base\
    \ class is effectively the parent, and the derived class is the child.\n\nFor\
    \ the most part, if you hear the terms parent class, superclass, or base class,\
    \ they probably mean the same thing. And if you hear the terms child class, subclass,\
    \ or derived class, they probably mean the same thing.\n\nYou've already seen\
    \ a few areas in which inheritance is used to define classes. One important area\
    \ involves streams. You've seen streaming to and from the console, to and from\
    \ files, and to and from strings. All of these are basically derived classes that\
    \ inherit from a more general stream base class.\n\nA second area of inheritance\
    \ you've already encountered is exceptions, which are used to cause a function\
    \ to exit when an exceptional case is encountered. There is a very general exception\
    \ class and then more specialized child classes, each of which has even more specific\
    \ classes.\n\nIn this example, you have a general class, the product. Products\
    \ contain floating-point member variables for both a wholesale cost and a retail\
    \ cost (a).\n\nThen, there is a separate class created for a more specific product:\
    \ the cup. The cup has 2 member variables of its own: a volume that the cup holds\
    \ and a color for the cup, represented as a float and a string, respectively (b).\n\
    \nThe key difference here from what you've seen before is that the cup is also\
    \ defined to be a child of the product. You see this by the : public product placed\
    \ right after the class name. Because this is the case, the cup inherits the member\
    \ variables from the product class.\n\n```\n// Program 19_1\n// Inheritance Example\n\
    #include<iostream>\n#include<string>\nusing namespace std;\n\nclass product {\n\
    public:\n    float wholesale_cost;\n    float retail_cost;\n};\n\nclass cup :\
    \ public product {\npublic:\n    float volume;\n    string color;\n};\n\nint main()\
    \ {\n    cup plastic_cup;\n    plastic_cup.wholesale_cost = 0.10;\n    plastic_cup.retail_cost\
    \ = 0.30;\n    plastic_cup.volume = 16.0;\n    plastic_cup.color = \"red\";\n\
    \    cout << \"The plastic cup costs \" << plastic_cup.wholesale_cost << \" to\
    \ purchase and sells for \" << plastic_cup.retail_cost << endl;\n}\n```\n\nThen,\
    \ in the main routine, you can define a cup object, named plastic_cup. This will\
    \ let you set not just the volume and color, but also the wholesale and retail\
    \ costs for the cup. You do this by assigning values to plastic_cup.wholesale_cost\
    \ and plastic_cup.retail_cost, the same as you would the other member variables,\
    \ plastic_cup.volume and plastic_cup.color (c)."
