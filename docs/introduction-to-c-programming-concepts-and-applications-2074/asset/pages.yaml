- pgno: 246
  md: '# 21 Using Classes to Build a Game Engine in C++


    What you’ve been learning about object-oriented program is all going to come together
    now as you are walked through a development process for designing a game engine
    that can be used for more than one game through the use of classes.


    IN THIS LECTURE:


    +   - Designing Classes

    - Coding Your Design

    - Quiz

    - Quiz Answer


    # // DESIGNING CLASSES


    You want to create a system that lets you play 2-person board games on a computer.
    In lecture 15, you developed a Connect 4 game; in this lecture, you want to build
    on your top-down design but use object-oriented principles. In fact, you’ll do
    this in a class that can handle all kinds of 2-person games—not just Connect 4,
    but checkers, chess, or Othello.


    For this implementation, the focus will be on 2 different games: Connect 4 and
    Othello, known more generally as Reversi.


    As is the case with any approach to software development, the first thing you
    should do when faced with a programming problem is stop and think.


    In Reversi, players take turns placing either black or white pieces on an 8-by-8
    board. The game starts with 2 white and 2 black pieces already placed in the middle
    4 squares.


    If a black piece is placed, it has to be placed next to some white piece—beside,
    above, below, or diagonally. If the new black piece causes any white pieces to
    be newly bracketed by a pair of black pieces—in a row, column, or diagonal—then
    that causes all those newly bracketed pieces to switch color to black.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_246_0.png)


    The winner is the one with the most of his or her color piece on the board after
    the board is filled up.'
