- pgno: 306
  md: '# // PREDEFINED KEYWORDS


    A keyword is a word defined in the C++ language itself. These are often automatically
    recognized by your IDE and presented to you in a color distinct from the surrounding
    code. The list here includes C++ keywords that are commonly used but not complete
    (see the Predefined Variable Types below, for example). For a more complete list,
    consult an online reference such as cppreference.com.


    # break


    When encountered inside of a loop, immediately stops the execution of the loop
    and jumps to the first statement following the loop.


    # catch


    Designates the commands to be executed in response to an exception generated in
    a preceding try block.


    # else


    Designates the commands to follow if an if condition evaluates to false.


    # class


    Used to define a class. The general format is class class_name {/** class description
    */;


    # extern


    Indicates that the definition for a function or class will be provided outside
    of the current file.


    # const


    Indicates that a variable will not change values; particularly useful for passing
    by const reference.


    # for


    Loop designator provides a compact way of specifying all loop control in one place.
    The keyword is followed by parentheses containing 3 clauses separated by semicolons;
    an initialization clause executed before the first iteration, a conditional check
    at the beginning of each possible iteration, and an update clause to indicate
    what should change with each iteration. Alternatively, the parentheses can contain
    variable and container to iterate over, separated by a colon; the variable will
    take on each value from the counter.


    # continue


    When encountered inside of a loop, immediately stops the execution of that iteration
    of the loop and begins the next iteration (if any).


    # delete


    Frees up dynamically allocated memory that was previously allocated with new.


    # friend


    Designates that a function defined outside a class should have access to a class''s
    members as though it were part of the class.'
