- pgno: 207
  md: "# 18 Dynamic Memory Allocation and Pointers\n\nYou usually think of the computer’s\
    \ main working memory (the memory stored in RAM) as one uniform block of memory.\
    \ Items you declare get space set aside for them ahead of time. This is known\
    \ as static memory allocation, and it’s how standard variables and parameters\
    \ are stored. But as you start developing more complex objects, sometimes you\
    \ want to allocate new memory during the program—memory you didn’t know you’d\
    \ need ahead of time. That’s what dynamic memory allocation is for.\n\n# IN THIS\
    \ LECTURE:\n\n+   - Dereferencing Pointers\n  - Program 18_1\n  - Program 18_2\n\
    - Dynamic Memory Allocation\n- A Game of 20 Questions\n  - Program 18_5\n- Destructor\
    \ Functions\n- Vectors: An Alternative to Dynamic Memory Allocation\n- Quiz\n\
    - Quiz Answers\n\n# // DEREFERENCING POINTERS\n\nMain working memory comes in\
    \ one of 2 varieties: the stack or the heap.\n\n+   - The stack is static memory\
    \ that you know and allocate as soon as you declare something. The stack stores\
    \ all the variables and parameters.\n- The heap is for dynamic memory allocation—for\
    \ anything that’s not known in advance and is instead allocated as needed. The\
    \ heap is sometimes referred to more formally as the free store.\n\nIt’s not uncommon\
    \ to be uncertain as to how much memory you’ll need. You use dynamic memory allocation\
    \ whenever you want to store an uncertain amount of information that will keep\
    \ coming in, and thus keep growing, over time. Often, classes hide this from you.\
    \ The vector class hides how and where it’s allocating new memory.\n\nBut vectors\
    \ don’t always fit the problem you have. Sometimes you need to allocate memory\
    \ for yourself.\n\nTo allocate memory on the heap in this more dynamic way, you\
    \ need a pointer, which is a variable that holds an address in memory. Usually,\
    \ but not necessarily, there is some data at that point in memory, but keep in\
    \ mind that the pointer variable does not store the data—just the location where\
    \ the data is."
  merge: -1
  img_proc: true
- pgno: 208
  md: "However, a pointer also defines the type of thing that the address it contains.\n\
    \nThere are a few ways to dereference pointers.\nThe most basic way is to use\
    \ * in front of the pointer name.\n\nWhen you write [0], you are getting the value\
    \ stored at the address the pointer is referring to. And, if you write [1], you\
    \ mean the thing stored in memory past the pointer is referring to.\n\nA pointer\
    \ is declared much like any other variable, but there is some syntax to use it.\n\
    \nIn Program 18_1, you create an integer, x, that gets assigned the value 3 (8).\
    \ This integer is a static variable.\n\nSo, Program 18_2 works identically to\
    \ Program 18_1. The only difference is instead of writing *y, you write y[0] (11,\
    \ 12).\n\n+   >> To create a pointer, you list the type of thing you're pointing\
    \ to but then include * (commonly read \"star\") to indicate that this variable\
    \ is to contain an address where there's some of that.\n\nThen, you create a new\
    \ variable, y, that is a pointer to integer (9). The pointer is not set to anything\
    \ initially.\n\n+   >> Once you've declared a pointer, you can assign it a particular\
    \ memory address. To get the memory address of variable, you put & in front of\
    \ the variable's name. Think of the address as being GPS coordinates.\n\nYou assign\
    \ the address of x (10). In other words, y points to x.\n\n+   >> Once you declare\
    \ and you assigned a memory address, you can get the thing that it is pointing\
    \ to—the thing that is at memory address—in a process known as dereferencing the\
    \ pointer.\n\nWhen you output *y, you are outputting the value that y is pointing\
    \ to. In this case, where it's pointing the value 3, you output 3 (11).\n\nIf\
    \ you have a pointer to an object—but only that—way to dereference pointers. You\
    \ can access member variables or public member functions using ->, which looks\
    \ like an arrow, so it's known as the arrow operation.\n\nIn the next line, you\
    \ are assigning a value, 5, to the integer pointed to y. So, the memory location\
    \ that y is pointing to will get the value 5. This is the same memory location\
    \ used by x (12).\n\nThis is the same as if you dereferenced the pointer and then\
    \ used a [] to access the member variable or function.\n\nSo, when you print out\
    \ the value of x, you see that x has the value 5 (13).\n\n```\n// Program 18_1\n\
    // Pointer example using *\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int x = 3;\n    int *y = &x;\n    cout << *y << endl;\n    *y = 5;\n\
    \    cout << x << endl;\n}\n```\n\n```\n// Program 18_2\n// Pointer example using\
    \ []\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int x = 3;\n\
    \    int *y = &x;\n    cout << y[0] << endl;\n    y[0] = 5;\n    cout << x <<\
    \ endl;\n}\n```\n\nAnother way you can dereference a pointer is use an array operator\
    \ and access element 0.\n\nThe reason this is because an array is actually a pointer!\
    \ The array holds the address where the first item of the array is stored."
  merge: -1
  img_proc: true
- pgno: 209
  md: '# POINTER ERRORS


    Pointers are notorious for how many errors they can cause in programs. Pointer
    errors can be easy to make and really difficult to find when debugging. Yet there
    are cases when you need to use pointers:


    +   - when you are reading in an unknown amount of data,

    - when you need a lot of memory but the operating system, as it often does, has
    limited the amount that can be used on the stack.


    Then, you need to allocate memory dynamically.


    # // DYNAMIC MEMORY ALLOCATION


    Now that you have pointers, you can start to perform dynamic memory allocation.


    The **new** command creates a new object on the heap and returns a pointer to
    that object. To use the **new** command, you must write followed by the type that
    you want to allocate. If there is a second constructor, in addition to the default
    constructor, you can invoke it by putting parentheses the arguments you want to
    pass to the constructor in parentheses.


    If you want to allocate some of an object, you allocate an array on the heap.
    When you allocate an array, then after the variable name, you put brackets with
    the size of the array you want inside.


    When the array form of **new** is used, the default constructor is called for
    each of the elements.


    Data stays on the heap until it is explicitly deallocated. Once you are done whatever
    memory you allocated, you need to explicitly free it. Unlike the stack memory
    is automatically freed when a function completes, heap memory stays allocated
    until the end of the program-unless you free it.


    To free memory on the heap, you use the **delete** command. You must use **delete**
    and give a pointer to what you want to delete. The allocated object will be deleted
    from memory.


    If you allocate an array, you have to instead use **delete[]** to delete the entire
    array that was allocated.


    One other thing that''s useful when setting up a default variable is a null pointer.


    Sometimes, you have a pointer but don''t want to point to anything in particular;
    you just have to use it later. In this case, you can set the pointer to be the
    value **NULL**. The null pointer does not point to any usable memory location,
    but it functions as a special value you can have the program check when no what
    is needed.'
