- pgno: 281
  md: 'An even more intelligent computer would look more than just 2 moves ahead—it
    would look 3 or 4 or more moves ahead! And the best game-playing AIs will do exactly
    that: They’ll look several moves ahead. But notice how quickly the number of possibilities
    increases. In Connect 4, for every one further move ahead a computer looks, there
    are 7 times as many possibilities to consider! Looking 6 moves ahead would be
    7⁶, or more than 100,000, possibilities!


    One of the advantages of C++ is that it tends to result in really efficient code,
    and the practical effect of this is that a C++ program


    might be able to look a little further ahead, in the same amount of time, compared
    with a program in some other language. And looking even one more level ahead can
    be all the difference in which AI is best.


    You can take this basic idea of looking ahead and turn it into an algorithm for
    an AI playing a computer game. The algorithm will be a generic, abstract description
    of what to do, and it will be turned into a function, or other code, that is an
    actual, concrete implementation of the algorithm. So, you’ll start by writing
    the algorithm in pseudocode and then turn it into actual C++ code.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_281_0.png)


    Notice that this outlined structure follows the definition of a tree—the same
    type used in top-down design. The root of the tree is the current gameboard, and
    each node’s children are the possible moves.


    # // DEVELOPING ALGORITHMS


    To develop the algorithm, you’ll follow an approach that is similar to the top-down
    design approach, but you want to try to keep the problem as narrow as possible.


    The purpose of the algorithm is to let a computer determine the best move it can
    make in a game. With that goal in mind, you start by considering what your input
    is: What is known at each point during the game? So, the input will be the current
    state of the game: the current gameboard and an indication of which player’s turn
    it is.


    Next, you consider the output you want from the algorithm. Clearly, you want to
    output a move, the best one the algorithm could determine.


    Specifying the input and output clearly is an important part of algorithm design—just
    as important as the steps of the algorithm itself. Algorithms are often implemented
    as functions; the steps of the algorithm become the code in the function. You
    can approach this algorithm design in a similar way that you would approach top-down
    program design, looking at the overall challenge and breaking it into simpler
    parts.


    If you’re faced with making a choice, you have 3 basic steps:


    +   1. Make a list of possible valid moves. For Connect 4, each player has at
    most 7 moves—any column that’s not full.

    2. Evaluate each of those moves to get some measure of how good or bad each one
    is.

    3. Determine which of those moves is best and return the result.


    The trickiest part will be the middle step of evaluating each move. That’ll have
    2 parts: first try a move (that is, update the gameboard to'
