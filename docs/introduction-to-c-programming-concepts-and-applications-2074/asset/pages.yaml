  md: 'Once the tests have been considered, it''s time to start thinking about how
    you can actually develop your program.


    The usual way to approach this is with pseudocode. Instead of writing code right
    away, you write out steps in general terms that describe what you want the program
    to do but aren''t actual code. You can write those steps of pseudocode as a series
    of comments; then, you can translate pseudocode to actual code.


    # PSEUDOCODE


    Blood Pressure Analyzer


    +   1 Input: Blood pressure (Systolic, Diastolic) entered from keyboard

    2 Compute: Determine what category that BP puts someone into

    3 Output: Print the category the person is in to the screen


    Suppose you want to create a program that tells you where your blood pressure
    falls in terms of healthy or not. What are the steps you''ll want the program
    to follow?


    Many programs follow a basic pattern: getting input, performing computations,
    and producing output.


    In this case, for input, you have to have a user type in blood pressure. For computation,
    you''ll use the blood pressure to classify someone''s level of hypertension. You''ll
    just output to the person what his or her category is.


    Elevated blood pressure:

    Diastolic < 80 and Systolic between 120 and 129


    Stage 1 Hypertension:

    Diastolic between 80 and 89, or Systolic between 130 and 139


    Stage 2 Hypertension:

    Diastolic 90 or greater, Systolic 140 or greater


    Danger Zone:

    Stage 2 Hypertension, but Diastolic 120 or greater, or Systolic 180 or greater


    Hypotension:

    Diastolic 60 or lower, Systolic 90 or lower


    In terms of categorizing blood pressure, you''ll use a set of conditions based
    on looking at the systolic and diastolic blood pressures. You''re going to want
    to implement these concepts in code.'
