- pgno: 153
  md: "# // SETTING DEFAULT PARAMETERS\n\nThere’s one more way that you can provide\
    \ functions with the same name but different parameter sets: You can specify a\
    \ default value for one or more of the parameters. If, when the function is called,\
    \ the corresponding argument is left out of the call, you use the default parameter\
    \ instead.\n\n```\n// Program 13_5\n// Using a Default Parameter\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nvoid printmultiple(string s, int times\
    \ = 1) {\n    for (int i = 0; i < times; i++) {\n        cout << s << endl;\n\
    \    }\n}\n\nint main() {\n    printmultiple(\"Hello\", 5);\n    printmultiple(\"\
    World\");\n}\n```\n\nTo do this, you just set an initializing value for the appropriate\
    \ parameter, assigning it some value inside the parentheses. When it is done this\
    \ way, that assignment is understood by the compiler as one to be used if the\
    \ corresponding parameter is not provided.\n\nSuppose you want to create a function,\
    \ called printmultiple, to print out a string multiple times. Let printmultiple\
    \ take in the string to print and the number of times to print it. There’s nothing\
    \ to return; that is, the function does not need to return a value to the place\
    \ it was called from, so you’ll have a void return type.\n\nIf someone doesn’t\
    \ specify how many times to print the string, you might choose to have a default\
    \ number, such as 1. If so, your header would look something like line 7. So,\
    \ there are 2 parameters: a string called s that you are taking in and an int\
    \ called times (the number of times to print, which has a default value of 1).\n\
    \nIf you call the function with both parameters—for example, Hello and 5—you’ll\
    \ get the string Hello printed out 5 times.\n\nOn the other hand, if you call\
    \ it with just a string parameter, such as World, then times has the default value,\
    \ so the string is printed out just once.\n\nIf there are multiple default parameters,\
    \ then arguments from the function call are assigned to parameters from left to\
    \ right (the first argument is assigned to the first parameter, the second to\
    \ the second parameter, etc.). You can’t have just some parameter in the middle\
    \ be assigned a default value; once one is assigned, everything after it must\
    \ also be default.\n\nDefault parameters are commonly used to control how a function\
    \ works when there’s a normal, or common, way to do something set as the default\
    \ but you want to let the programmer have the option of selecting some other behavior\
    \ if needed.\n\n> Setting default parameters is an alternative to overloading\
    \ a function by specifying different signatures."
  merge: -1
  img_proc: true
- pgno: 154
  md: "# // USING REFERENCES\n\nReferences allow you to share information without\
    \ making needless copies.\n\nA **reference** is a way of describing a particular\
    \ variable. Normally, when you define a variable, it gets its own box of memory.\
    \ If you do something to that box of memory, such as assign a value to it, it’s\
    \ not going to affect any other box.\n\nWith a reference, though, you don’t create\
    \ a new box of memory for the variable. Instead, you use an existing box of memory\
    \ and say that the variable *refers* to that box of memory. Basically, your variable\
    \ becomes another name for some box of memory that already exists; anything you\
    \ do to that new variable must affect the original box of memory, too!\n\nThe\
    \ way you specify a reference is by putting an ampersand (&) after the type when\
    \ you first declare it. You then have to initialize your new variable to refer\
    \ to some other variable. **Program 13_7** illustrates this.\n\nFirst, you create\
    \ a variable, **a**, that you initialize to a value of **1** (7).\n\nNext, you\
    \ create a variable, **b**, that is a reference to an integer. So, you write **int&\
    \ b**. You have to make this a reference to something; you can’t just leave it\
    \ there. So,\n\nyou initialize this to **a** (8). This means that **b** is going\
    \ to refer to the exact same box of memory that is **a**. When you print out the\
    \ values of **a** and **b**, both show up as **1**.\n\nYou can assign a new value,\
    \ **2**, to **a** (10). When you do so, this changes the value stored in that\
    \ box of memory. So, when you print out both **a** and **b** now, both show up\
    \ as **2**.\n\nThe same thing happens if you assign a new value, **3**, to **b**\
    \ (12). The box of memory that **b** refers to has its value changed to **3**.\
    \ So, printing out the values of **a** and **b** now indicates that both have\
    \ the value **3**.\n\nEssentially, **a** and **b** are referring to the exact\
    \ same thing.\n\nThe most common way that references are used is when calling\
    \ functions. That’s because you can declare any of the parameters in a function\
    \ to be a reference. This means that the parameter will not be a copy of the argument\
    \ that comes in; it’ll be a reference to the argument that comes in. So, any changes\
    \ to the reference parameter will be like a change to the original.\n\n```\n//\
    \ Program 13_7\n// Reference example\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    int a = 1;\n    int& b = a;\n    cout << a << \" \" << b <<\
    \ endl;\n    a = 2;\n    cout << a << \" \" << b << endl;\n    b = 3;\n    cout\
    \ << a << \" \" << b << endl;\n}\n```\n\nThe term used to describe this is *passing\
    \ by reference*. This is distinguished from what you did previously, which is\
    \ *passing by value*. When you pass by value, you’re copying the value of the\
    \ argument into the new box of memory set up for the parameter. When you pass\
    \ by reference, you don’t copy anything; you just let the parameter refer back\
    \ to a shared version of input."
  merge: -1
  img_proc: true
- pgno: 155
  md: "Suppose you have a savings account balance and you'd like to increase the balance\
    \ by some percentage to account for earning interest.\n\nYou can create a function\
    \ named increase_percentage that will take 2 parameters:\nthe value that you want\
    \ to increase and the percentage to increase by. The key thing here is that you\
    \ are going to modify the balance so that the first parameter will be a reference,\
    \ not just a basic parameter. So, you will write float& value for the first parameter.\n\
    \nSo, when the function is called, with arguments savings_balance and 10, the\
    \ first argument, savings_balance, is passed by reference. In the function's memory,\
    \ the parameter value just refers to the exact same block of memory as savings_balance\
    \ from the main function. The second argument, 10, is passed by value, so a new\
    \ box of memory named percentage is created in the function's memory area, and\
    \ 10 is copied into there.\n\nThus, when you modify the variable named value in\
    \ the function, you're actually modifying the same box of memory as savings_balance\
    \ in the main function. After the function returns, you'll find that the value\
    \ in savings_balance has in fact been changed.\n\nPassing by reference makes it\
    \ possible to modify a value. It also has the advantage of not having to go through\
    \ the process of copying the variable.\n\nCopying is not a big deal in most cases,\
    \ but if the variable is something really large, such as an entire video file,\
    \ you don't want to take the computational time and memory of going through and\
    \ copying it.\n\nThe ability to not have to copy information needlessly is an\
    \ advantage, so why wouldn't you always do that? Why wouldn't you always just\
    \ pass by reference?\n\nThere are 2 main reasons:\n\n+   1 One is if you know\
    \ you want to modify the parameter in your function but don't want it affected\
    \ back in the main program. You'd like the function to be as disconnected from\
    \ where it was called as possible, so you don't want to needlessly tie things\
    \ together that shouldn't be tied. Passing by value is the right solution when\
    \ you want your function to be as much of a black box as possible, because you\
    \ need to make a copy of that data regardless.\n\n+   2 The other reason for passing\
    \ by value is a little subtler: If you pass by reference, then the argument that\
    \ you call with needs to be a variable. It can't be a literal—because there's\
    \ no box of memory to refer to. If you try to pass in a string literal, you will\
    \ get a compiler error.\n\n```\n// Program 13_8\n// Passing by Reference\n#include<iostream>\n\
    using namespace std;\n\nvoid increase_percentage(float& value, float percentage)\
    \ {\n    value += value * (percentage / 100.0);\n}\n\nint main() {\n    float\
    \ savings_balance = 1000.0;\n    cout << savings_balance << endl;\n    increase_percentage(savings_balance,\
    \ 10);\n    cout << savings_balance << endl;\n}\n```\n\n# Exercise\n\nSuppose\
    \ you have a really long string and want to do a search-and-replace for some word\
    \ in the string, finding every occurrence of that word and replacing it with a\
    \ different word. Can you come up with a header for a function that will modify\
    \ the string in that way? (Don't worry about the body of the function.)\n\nClick\
    \ here to see the solution."
  merge: -1
