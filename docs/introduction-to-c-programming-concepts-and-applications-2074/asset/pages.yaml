  md: 'In a debugger, you can set a breakpoint at the beginning of the loop that will
    make sure you stop there. When you run the debugger to there, looking at variables,
    could_be_palindrome is true, as it should be.


    Stepping over the first line, you can check and see that i has the value 0, as
    expected. So, things seem good so far.


    Stepping over one more line, you have ended up inside the if statement and are
    about to set could_be_palindrome to false. But that''s not right! You should not
    be getting to this point for this input.


    This means that the error had to be on the previous line—the one where you are
    comparing no_spaces[i] with no_spaces[no_spaces.size()-i]. You can examine those
    values: i is 0, as expected, and no_spaces.size()-i is 3. But that''s not right.
    You want to be looking at the last element of the string, but that should be element
    2, not element 3.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_162_0.png)


    # STEP 3: IDENTIFY


    Now that you know where the error is occurring, the third step is to identify
    the source of the error. The source is not just the line of code where things
    went wrong; it''s what caused that line of code to be wrong. Was it a simple typo,
    or is it an error in the fundamental logic of the program?


    The key point is that you want to understand what caused this error before you
    try to fix it. If it was a basic error like mistyping, then it''ll be very simple
    to fix. But if it''s a logic error in the program, you''ll want to make sure you
    really understand what went wrong and why. There''s no shortcut around this part
    of the debugging process.


    In the palindrome program, for a string of 3 characters, you were trying to compare
    character 0 to character 3. The problem is that the last character would not start
    at the size of the string; it''s actually the size minus 1, so you need to compare
    character 0 to character 2. So, in this case, the error was in coming up with
    the wrong formula to use for comparison.


    # STEP 4: FIX


    Once you know the problem, the next step is to fix the bug. This could be simple—maybe
    just spelling a variable name correctly or changing a character.


    It could involve rewriting a line of code. Or it could be that you were so wrong
    in your approach that the best fix is to throw out the whole thing and start over
    again!


    Here, the fix for the bug is pretty simple: You just subtract 1 from the element
    number for the end of the string. So, when i is 0, you should be comparing to
    size()-1. When i is 1, you''ll be comparing to size()-2, etc.


