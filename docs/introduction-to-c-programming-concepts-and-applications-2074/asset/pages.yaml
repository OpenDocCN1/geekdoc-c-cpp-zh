    It would take whatever credit is currently in the machine, return it, and set
    the current credit to 0. You output the amount of money that you''re returning.


    +   - define a function in the class named vend that returns a Boolean

    - check to see if there is enough credit to purchase an item

    - check to see if you actually have any items in inventory

    - handle the transaction, adjusting credit, money collected, and inventory

    - return any change to the customer


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_186_0.png)


    # // PUBLIC VERSUS PRIVATE


    So far, you''ve always had public: at the top of your class definition—meaning
    everything you declared after that in the class is a public variable or function,
    available for anyone to call from anywhere.


    When a variable or function is private, it is accessible only to other parts within
    that class; that is, the functions within that same class can access the private
    variables and call private functions, but those outside the class cannot.


    But you can also have private variables and functions, which you do by writing
    private: beforehand.'
