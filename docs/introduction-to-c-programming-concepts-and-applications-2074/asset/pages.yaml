  md: "So, implementing the gameboard class itself is just a matter of\ndeclaring\
    \ a class and creating a few pure virtual functions. Because\nyou're not providing\
    \ any implementation of those functions in this\nclass, there's nothing more to\
    \ define.\n\nBut according to the definition of your virtual function, you are\n\
    sosed to be passing in a connect4_move pointer; it's supposed\nto a gamemove pointer!\
