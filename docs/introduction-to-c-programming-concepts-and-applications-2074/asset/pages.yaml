- pgno: 218
  md: '# 19 Object-Oriented Programming with Inheritance


    The most important idea of object-oriented programming is encapsulation, which
    is the wrapping of data and functions together in one tidy package. Another powerful
    idea is inheritance, which is the idea that you should be able to create classes
    that can inherit this encapsulation of member variables and functions from another
    class. In short, you can use an abstraction you already have to create one or
    more new abstractions. This creates a hierarchy: Objects can inherit from a "parent,"
    and the relationships among various inheriting objects can form a tree structure.


    # IN THIS LECTURE:


    +   - Inheritance

    - Program 19_1

    - Program 19_2_a

    - Program 19_3


    +   - The Protected Category

    - Program 19_4


    +   - Constructors with Inheritance

    - Program 19_5


    +   - Quiz

    - Quiz Answers


    # // INHERITANCE


    Inheritance offers several benefits.


    Inheritance plays a powerful role in object-oriented design. It lets you define
    something single time in one class and then use it in multiple other classes.
    It means that you can define a new class, and rather than writing every piece
    of it from scratch, you can start with everything already defined in another class.


    +   - It prevents having to rewrite the same code over and over. An ancestor can
    save on properties to all of its offspring. In terms of coding, this can save
    a lot of time and work.


    In practice, there are a few ways that inheritance works.


    +   - It reduces the number of places that bugs could be introduced to the program,
    so you reduce debugging time.


    From a top-down viewpoint, object-oriented inheritance can be thought of as a
    way of making a more general idea and dividing it into more specialized views.
    It can also work from a bottom-up viewpoint, where you start with the offspring
    and decide what sort of ancestor they have. Whether top-down or bottom-up, the
    result is a similar arrangement of classes.


    Inheritance also creates a hierarchy of classes—a relationship between ancestors
    and descendants.


    +   - It enables polymorphism, which you''ll learn about in the next lecture.'
  merge: -1
