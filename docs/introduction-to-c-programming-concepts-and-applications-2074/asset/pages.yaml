- pgno: 232
  md: "# 20 Object-Oriented Programming with Polymorphism\n\nIN THIS LIST:\n\n+  \
    \ - A Class Hierarchy\n  - Program 20_1\n  - Program 20_2\n  - Program 20_4\n\n\
    +   - Virtual Functions\n  - Program 20_5\n\n+   - Pure Virtual Functions\n  -\
    \ Program 20_8\n\n+   - Quiz\n\n+   - Quiz Answers\n\nOne of the key principles\
    \ of object-oriented design is polymorphism, which refers to the idea that a class\
    \ can take on many different shapes. To get at this concept, you need a class\
    \ hierarchy with inheritance—basically, a superclass that's specialized into multiple\
    \ subclasses. The idea is that the superclass, the one higher in the hierarchy,\
    \ can take on the particular form of any one of its subclasses; that is, the superclass\
    \ can have many different shapes, each of which is an example of the overall class.\n\
    \n# // A CLASS HIERARCHY\n\nThe important part of polymorphism is that you can\
    \ define operations at the highest level of the hierarchy where it makes sense—basically,\
    \ you define an operation on the top-level superclass as much as possible. Then,\
    \ the actual implementation of that operation can potentially be defined at any\
    \ point along the hierarchy. Each of the subclasses could potentially have a different\
    \ way of performing that operation, but they all perform it. When you refer to\
    \ some class, then anything that is of that class, including any descendant classes,\
    \ could meet the requirements.\n\nInheritance can save coding by inheriting features\
    \ from a base class rather than repeating them in all the derived classes. But\
    \ perhaps an even more important feature of inheritance is that it supports the\
    \ ability to let classes lower in the hierarchy meet the requirements defined\
    \ higher in the hierarchy.\n\nThe idea of a class hierarchy means that when you\
    \ use some class, that function can also use any of its descendant classes. However,\
    \ things don't work the other way around: You can't require a more specialized\
    \ class and pass in the more generalized superclass."
  merge: -1
  img_proc: true
- pgno: 233
  md: "In this code, which does the hierarchy from the previous lecture, you define\
    \ a base product class and derive cup and plate from (a). Then, from cup, you\
    \ derive measuring_cup and drinking_cup (b). In this case, every member is a product.\
    \ The cup has a wholesale price (8) and a retail price (9).\n\nLet's say you wanted\
    \ to create a function that puts items on sale by 10%. You might want a function\
    \ that gives you the sale price. So you can write a function called sale_price\
    \ that returns a floating-point number giving the price. It will have one parameter,\
    \ which will be a product. And it will return 90% of the product's retail price\
    \ (c).\n\nThen, you can create very specific objects in your code. In this case,\
    \ you have a plastic_cup that's an instance of measuring_cup and a coffee_cup\
    \ that's an instance of drinking_cup (d). Both the measuring_cup and the drinking_cup\
    \ are derived from the product class, you can call the sale_price function on\
    \ both of them (54, 55) without difficulty!\n\nThis is one of the straightforward\
    \ ways to achieve polymorphism. When you inherit from a base class, you automatically\
    \ have access to everything that base class has. In other words, the descendants\
    \ of a base class will have the member variables and functions from the base class,\
    \ so any descendant can be used in place of that base class.\n\nThis makes it\
    \ possible to extend an existing class to provide more functionality. You can\
    \ add some additional features that you might want and keep everything about the\
    \ class that you liked.\n\n```\n// Program 28_1\n// Inheritance Example - using\
    \ function on base class\n#include<iostream>\nusing namespace std;\n\nclass product\
    \ {\npublic:\n    float wholesale_cost;\n    float retail_cost;\n\n    float profit_per_item()\
    \ {\n    return retail_cost - wholesale_cost;\n};\n\n```\n\n```\nclass plate :\
    \ public product {\npublic:\n    float diameter;\n};\n\n```\n\n```\nclass cup\
    \ : public product {\npublic:\n    float volume;\n    string color;\n};\n\n```\n\
    \n```\nclass measuring_cup : public cup {\npublic:\n    bool has_merments;\n \
    \   int num_gradations;\n};\n\n```\n\n```\nclass drinking_cup : public cup {\n\
    public:\n    bool has_lid;\n\n    float sale_price(float p) {\n    return retail_cost\
    \ * 0.9;\n};\n\n```\n\n```\nint main() {\n    measuring_cup plastic_cup;\n   \
    \ plastic_cup.wholesale_cost = 10.0;\n    plastic_cup.retail_cost = 20.0;\n  \
    \  drinking_cup coffee_cup;\n    coffee_cup.wholesale_cost = 5.0;\n    coffee_cup.retail_cost\
    \ = 10.0;\n\n    cout << \"The plastic cup cost: \" << plastic_cup.profit_per_item()\
    \ << endl;\n    cout << \"to purchase the plastic cup for: \" << plastic_cup.wholesale_cost\
    \ << endl;\n    cout << \"to purchase the coffee cup for: \" << coffee_cup.wholesale_cost\
    \ << endl;\n    cout << \"The sale price will be: \" << sale_price(plastic_cup)\
    \ << endl;\n    cout << \" and \" << sale_price(coffee_cup) << \" respectively.\"\
    \ << endl;\n}\n\n```\n\nLecture 20 | Object-Oriented Programming with Polymorphism"
  merge: -1
