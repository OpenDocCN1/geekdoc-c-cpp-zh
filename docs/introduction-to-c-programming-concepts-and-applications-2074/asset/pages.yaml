  md: "# // STRING OPERATIONS\n\nIn Program 9_6, you have 3 strings-named s1, s2,\
    \ and s3—and assign the string Happy to s1 and the string Birthday to s2.\n\n\
    This means that the addition operation, + works differently for 2 strings than\
    \ it does for 2 numbers. The + operator is overloaded, which means it has more\
    \ than one meaning, depending on the types of the input.\n\nIn Program 9_8, you\
    \ have a string, s, that you initialize to the value Happy. You then have a line:\
    \ s += \"Birthday\";\n\nThen, you have a s3 = s1+s2. In other words, you are adding\
    \ 2 strings to get a third string.\n\nWhen you run this, you'll get a concatenated\
    \ string, HappyBirthday, with no space in between. The Birthday has been appended\
    \ to the original string, which was Happy. Basically, you took the value in the\
    \ string and performed a + operation on the right side, putting the result back\
    \ in the original variable. But + for strings is defined as concatenation, so\
    \ the 2 strings were concatenated and the result was placed in s.\n\nIf you run\
    \ this program, outputting s3 gives you a string HappyBirthday, with no space\
    \ between the words. Basically, the s3 was formed by the first string, Happy,\
    \ and sticking the next string, Birthday, onto the end. This is called concatenation.\
    \ You have concatenated the strings s1 and s2 to form s3.\n\nOperator overloading\
    \ is a common practice for defining behavior between different types.\n\n> A +\
    \ does not always mean addition.\nThe meaning of various operators changes depending\
    \ on the type of thing they are operating on.\n\nIn another variation of the previous\
    \ program, instead of the strings Happy and Birthday, you assign s1 the string\
    \ 3 and s2 the string 4.\n\n```\n// Program 9_6\n// Adding strings\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nint main() {\n    string s1, s2, s3;\n\
    \    s1 = \"Happy\";\n    s2 = \"Birthday\";\n    s3 = s1 + s2;\n    cout << s3\
    \ << endl;\n}\n```\n\nWhen you add 2 together, the output is 3. Why?\n\n| 10 |\
    \ s1 = \"3\"; |\n| 11 | s2 = \"4\"; |\n| 12 | s3 = s1 + s2; |\n\n```\n// Program\
    \ 9_8\n// Adding a string\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\n\nint main() {\n    string s = \"Happy\";\n    s += \"Birthday\";\n  \
    \  cout << s << endl;\n}\n```\n\nKeep in mind that s1 and s2 are strings. The\
    \ 3 that is assigned to s1 is not the number 3; it is a string that has just a\
    \ single character digit, 3, inside of it. Likewise, when you add the assigned\
    \ 4, you get concatenation, so the result of adding s1 and s2 is to concatenate\
    \ their strings. The result is not really the number 34; it's the string 34."
