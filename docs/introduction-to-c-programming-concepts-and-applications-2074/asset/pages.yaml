  md: "# /* SORT */\n\nSorting can be useful not only for ordering things in a neat\
    \ way, but also as a way of making subsequent computations faster. If you’ll be\
    \ doing several searches for elements, then having the elements in a sorted order\
    \ lets you use a binary search.\n\nThe STL provides a sort function that will\
    \ take a container like a vector or list and put it in sorted order. sort takes\
    \ in a starting iterator and an ending iterator and then sorts everything in between.\n\
    \nSay you have a vector, v, with several elements in basically random order (9).\
    \ For later comparison, you print out the elements of the original vector in order,\
    \ showing that they were in fact in some unsorted order (g).\n\nThen, you sort\
    \ the vector by calling the sort algorithm, passing in v.begin and v.end as your\
    \ starting and ending iterators (15).\n\nAfter that, if you print out the elements\
    \ of v, you see that they are indeed now in sorted order (h).\n\n```\n// Program\
    \ 23_11\n// Sorting example\n#include<iostream>\n#include<vector>\n#include<algorithm>\n\
    using namespace std;\n\nint main() {\n    vector<int> v = { 4, 5, 9, 1, 15, 12,\
    \ 3, 5, 7, 11, 14, 2, 9 };\n    cout << \"Before sorting: \";\n    for (auto&\
    \ iter : v) {\n        cout << iter << \" \";\n    }\n    cout << endl;\n    sort(v.begin(),\
    \ v.end());\n    cout << \"After sorting: \";\n    for (auto& iter : v) {\n  \
    \      cout << iter << \" \";\n    }\n    cout << endl;\n}\n```"
