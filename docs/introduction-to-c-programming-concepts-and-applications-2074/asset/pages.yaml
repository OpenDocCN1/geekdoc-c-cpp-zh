- pgno: 50
  md: 'The next line is the **using namespace** command. A namespace is a grouping
    of various functions together. By saying **using namespace**, you are indicating
    which group of functions you''re using. In this case, the `std` (short for *standard*)
    namespace. A way to think of a namespace is a special name that needs to be added
    to the beginning of commands.


    There are big projects that require this way of working. There might even multiple
    namespaces, because different groups on a project often create new namespaces
    to distinguish their code. But it can be a pain to keep `std::` before each command
    for a small project where the scope of the `using namespace` is clear. So, the
    line `using namespace std` lets you say, "Unless specify otherwise, I''m using
    the standard namespace." And because this is a C++ command, not a command to the
    preprocessor, and ends with a semicolon.


    The parentheses show that it''s a function, **int** means that it returns an integer,
    and **main** is a defined name.


    Note that **main** is a special function; it''s the one that the compiler will
    recognize as the function to start with. The commands inside the braces after
    **main** will be executed first when the code runs.


    Here is how the code would look if you had to include the namespaces directly
    when using each command. Notice `std::` in front of `cout` and `endl(7)`; this
    is the way to specify that those are defined in the `std` namespace.


    Notice that **main** starts out with the **int**. The way you can think of this
    is that the main program will have an integer value when it runs. This integer
    has a meaning: if the program completes without an error, it returns zero; if
    an error is encountered, it has some nonzero value can vary based on the particular
    error, for an experienced programmer, can give more information about the type
    of error encountered.


    In short, this is a line that saves typing and makes the rest of your code easier
    to read.


