- pgno: 261
  md: "# // LISTS AND ITERATORS\n\nWhile these 4 containers work for adding\nand removing\
    \ new elements at the ends,\n you want to insert or delete elements at\narrary\
    \ points, then a container called a list is\nparticularly useful.\n\nAn iterator\
    \ is a new type that you can use for\nvariables. When you declare an iterator,\n\
    you first get the container (such as a vector\nof integers or a list of floats)\
    \ that it will iterate\nover, then ::; and then the keyword iterator.\nThis defines\
    \ the type of variable you're\ndeclaring.\n\nBut to understand how to use lists,\
    \ you\nneed to understand iterators.\n\nYou've encountered the idea of iterating\n\
    through a vector. You usually have some index,\nso as i, that you put in a for\
    \ loop let\ntake from 0 to 1 less than the vector\nlength. So, you can access\
    \ element 0, then 1\nthen 2, and so on, until the end of the vector.\n\nFor example,\
    \ in Program 22_4, you declare\na vector of integers where you push 3 values\n\
    to the back: 10, 20, and 30 (c).\n\nAn iterator is a more general form of that\n\
    index. It works like a pointer to the element in\na container.\n\nNext, you can\
    \ create an iterator that can iterate\nover a vector of integers using my_iterator.\n\
    So, you write <int>::my_iterator my-\niterator (12). When, you can think of this\
    \ as\nbeing like a pointer to an element of a vector\nof integers.\n\nTo use an\
    \ iterator, you would start at the\nbeginning of the vector and then access\n\
    element element until you reached the\n. For a container, you can get a begin\n\
    iterator, which points to the first element.\nYou can increment the iterator so\
    \ that it goes\nthe next element, then the one after that, and\nso on, all the\
    \ way through. You can\nstop when you reach the end, which will be\nafter the\
    \ last element in the container.\n\nYou initialize this by assigning the iterator\n\
    to the beginning of the container. For your\nvector, and for many other containers,\
    \ the\nmember function begin return an iterator\nat the first element in the container.\
    \ In the code,\nyou write my_iterator = v.begin() (13).\n\nThere's also an end\
    \ function associated with\\most containers, and it indicates a value after\n\
    t last element in the container. In other\nwords, there's not an element at the\
    \ \"end\";\nis not pointing to the last element, but instead\nto some part of\
    \ memory that you don't care\n\nabout, other than to know you're no\nlonger in\
    \ the container. So, in your code, you'nngo going as long as you're not at the\
    \ end.\nSo, you write while (my_iterator) != v.end\n() (14).\n\n```\n1 // Program\
    \ 22_4\n2 // Iterator example\n3 #include<iostream>\n4 #include<vector>\n5 using\
    \ namespace std;\n6 \n7 int main() {\n8 vector<int> v;\n9 v.push_back(10);\n10\
    \ v.push_back(20);\n11 v.push_back(30);\n12 }\n```\n\n![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_261_0.png)"
