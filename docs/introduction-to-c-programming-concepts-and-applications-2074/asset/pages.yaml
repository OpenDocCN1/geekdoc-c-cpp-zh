    you have a chance.


    +   On a Mac, you''ll need to select it for your operating system (Mac OS X),
    that you want a command-line tool, and you want a C++ project.


    In both IDEs, you''ll need to pick a name for your project; make it something
    descriptive, such as "GreatCoursesLecture!


