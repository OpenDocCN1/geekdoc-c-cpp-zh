    \ |\n| #include <cdblib> |\n| using namespace std;|\n\nTo do this, you need a\
    \ function that lets you get a random number. Random number generation is actually\
    \ a tricky problem—it's nearly impossible to generate truly random numbers with\
    \ a deterministic computer—but the key is to use pseudorandom numbers, which seem\
    \ like random numbers and are just useful for most applications.\n\nIn this case,\
    \ C++ has 2 standard libraries that will generate numbers. One of them is called\
    \ random, but it's complicated to use. An easier-to-use library is the C Standard\
    \ Library, cdblib, which includes the widely used function rand, which does not\
    \ take any arguments and returns an integer. The integer will be some number between\
    \ O and maximum-possible random number.\n\n```\nint main() {\n    int x = rand();\n\
    \    cout << \"The random number is \" << x << endl;\nn}\n```\n\nYou can tell\
    \ others, people who understand pseudorandom number generation have implemented\
    \ ways of getting these numbers for you.\n\nTo generate a random number, you have\
    \ a simple program that you can generate by #including the cdblib header. Then,\
    \ you can use the function rand, with no arguments, in the code to give you an\
    \ integer.\n\n| // Program 6_8 |\n| Generating multiple random numbers |\n| #include\
    \ <iostream> |\n| #include <cdblib> |\n| using namespace std;|\n\nWhen you have\
    \ #includes, the library file you're including is in brackets < >. An alternative\
    \ to this is to use quotation marks. The code works exactly the same.\n\nIf you\
    \ run Program 6_7, you will see that a random number is generated.\n\nYou can\
    \ generate more random numbers by calling the rand function multiple times. Every\
    \ time you get a new integer. In Program 6_8, 3 random numbers are generated.\n\
    \nGenerally, the convention is to use brackets for things that are in the C++\
    \ Standard Library and quotation marks for other libraries or files you're using.\n\
    \n```\nint main() {\n    int x = rand();\n    cout << \"The random number is \"\
    \ << x << endl;\n    cout << \"Here is another random number: \" << rand() <<\
