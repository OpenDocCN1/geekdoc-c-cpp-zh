    \ = init_number;\n    cout << \"There are \" << lobby_machine.number_remaining()\
    \ << \" items.\" << endl;\n}\n```\n\n> Be aware that you should not try to declare\
    \ an object using the default constructor by just using parentheses with no arguments.\
    \ If you're using the default constructor, just leave off the parentheses entirely.\
    \ Only use parentheses when you want to use a non-default constructor or when\
    \ you're declaring the constructor within the class.\n\n# // OPERATOR OVERLOADING\n\
    \nYou have already frequently encountered function overloading, where you can\
    \ use the same function name but take different parameters to get different behavior.\
    \ **Operator overloading** is similar, but you take different operands to get\
    \ different behavior from **operator**.\n\nYou've already seen examples of operator\
    \ overloading. Youve see how + can be used for addition for numbers or concatenation\
    \ for string types. The operator has \"overloaded\" to take on more than one meaning;\
    \ it has different meanings depending on the implementation.\n\nWhen you have\
    \ the stream operator to output a floating-point number, it behaves one way: It\
    \ analyzes the number and displays the digits of the number with the decimal point\
    \ in the correct position. When you use the streaming operator to output a string,\
    \ it behaves a different way: It analyzes the array of characters kept in the\
    \ string and outputs each character in the string to the stream.\n\n> If you did\
    \ not have operator overloading, you would have to have different operators for\
    \ outputting integers, outputting floats, outputting strings, and so on."
