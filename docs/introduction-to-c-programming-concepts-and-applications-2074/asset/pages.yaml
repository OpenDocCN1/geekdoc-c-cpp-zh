  img_proc: true
- pgno: 220
  md: "To keep things simple, let’s assume that everything is public.\n\nWhen creating\
    \ a class, if you want to inherit from some other class, you declare the class\
    \ as usual, but you have a colon, an access statement like public or private,\
    \ and then the name of the parent class.\n\nIn Program 19_2a, because you wanted\
    \ to create a cup class that was derived from the product class, you would write\
    \ class cup : public product and then the class definition in curly braces (13).\n\
    \nYou can also inherit in a larger class hierarchy. For example, say you wanted\
    \ to further distinguish your cups so that some of them were specifically measuring\
    \ cups. You could make a new class, a measuring_cup class. It would inherit from\
    \ cup, so you’d write class measuring_cup : public cup in the declaration (19).\n\
    \nThat means that it inherits the features of the cup class, which therefore means\
    \ it also inherits the features of the product class. It can also define its own\
    \ member variables and functions. In this case, you can define 2 new variables\
    \ for the measuring_cup: a Boolean to note whether it is in metric or English\
    \ units and an integer number of gradations (d). Thus, a measuring_cup actually\
    \ has access to 6 different member variables: the 2 that it defined for measuring,\
    \ the 2 that were defined in the cup class, and the 2 that were defined in the\
    \ product class (e).\n\n```\n// Program 19_2_a\n// Inheritance Example - multiple\
    \ levels of inheritance\n#include<iostream>\n#include<string>\nusing namespace\
    \ std;\n\nclass product {\npublic:\n    float wholesale_cost;\n    float retail_cost;\n\
    };\n\nclass cup : public product {\npublic:\n    float volume;\n    string color;\n\
    };\n\nclass measuring_cup : public cup {\npublic:\n    bool metricunits;\n   \
    \ int num_gradations;\n};\n\nint main() {\n    measuring_cup plastic_cup;\n  \
    \  plastic_cup.wholesale_cost = 0.10;\n    plastic_cup.retail_cost = 0.30;\n \
    \   plastic_cup.volume = 1000.0;\n    plastic_cup.color = \"clear\";\n    plastic_cup.metricunits\
    \ = true;\n    plastic_cup.num_gradations = 10;\n\n    cout << \"The plastic cup\
    \ costs \" << plastic_cup.wholesale_cost << \" to purchase and sells for \" <<\
    \ plastic_cup.retail_cost << endl;\n    cout << \"It is \" << plastic_cup.color\
    \ << \" in color and has a volume of \" << plastic_cup.volume << endl;\n    if\
    \ (plastic_cup.metricunits) {\n        cout << \"It has a total of \" << plastic_cup.num_gradations\
    \ << \" markings in metric units.\" << endl;\n    }\n    else {\n        cout\
    \ << \"It has a total of \" << plastic_cup.num_gradations << \" markings, in English\
    \ units.\" << endl;\n    }\n}\n```"
