    Click here to see the solution.


    # // TEMPLATED FUNCTIONS


    In addition to containers, the STL also offers a set of standalone functions that
    can be called with a wide range of argument types. These are called **templated
    functions**, because they are not just defined for a single type or set of types
    but can take on a whole range of types.


    These templated functions are all contained in the STL **algorithm** library,
    so to use any of them, you just #include **algorithm**.


    An **algorithm** can be thought of as a set of steps to follow to handle data
    or accomplish some other task.


    The STL **algorithm** library contains more than 80 different templated functions,
    each implementing some algorithm. Templated functions can take a range of various
    types as input parameters. The STL **algorithm** library''s functions fall into
    categories ranging from simple minimum and maximum computation to modifying sequences.


    The point of the **algorithm** library is not to provide functions you couldn’t
    create on your own, but instead to provide reliable, efficient implementations
    of commonly used algorithms that can be applied across a wide variety of data
    types.


    Three of the most common templated functions in the STL are **find**, **sort**,
    and **lower_bound**.


    Algorithms describe the critical functionality of most major computer programs,
    from operating systems to search engines—all the types of programs that C++ tends
    to be used for.'
