  md: "# // BUILDING A LIBRARY\n\nIf you're going to have a library, you're going\
    \ to want a namespace—the name and double colon that you have to put in certain\
    \ commands—help you separate the functions in your library from others.\n\nIn\
    \ the main function, you can call the greeting function by writing english:greeting()\
    \ (14). That means you can call the function named greeting within the english\
    \ namespace. When that is called, Hello! is printed out.\n\nThe header file will\
    \ contain the namespace, any variables to be defined in that library or namespace,\
    \ and the function declarations—which are just part of the header file, not including\
    \ the braces.\n\nYou should be familiar with the using namespace std that you've\
    \ been putting at the beginning of every program, enabling you to use commands\
    \ in the standard namespace std:: in front of everything.\n\nJust like libraries\
    \ such iostream provide useful functions, you can create your own libraries in\
    \ a similar way. When you create your own library, you will want to put all of\
    \ the new functions in a separate namespace to prevent any overlap in the naming\
    \ of different functions.\n\nThe declaration is a way of saying \"there will be\
    \ a function with this signature\" not actually saying how function is implemented.\
    \ The actual implementation is the definition.\n\nNamespaces are a way of helping\
    \ distinguish one library's functions from another. That way, if you have a function\
    \ named get_data, then another library can also have a function get_data. They\
    \ can be in different namespaces, and the 2 functions remain distinct.\n\nWhen\
    \ you separate libraries and as wanting to write really large programs—the types\
    \ that are built by teams of people or one person working a long time—you can\
    \ begin to make use of a feature called separate compilation.\n\nUp until this,\
    \ you've been putting the definition with the declaration, as is common in one\
    \ file. But the header-like and the body-like definition can be split up. If you\
    \ want to try this, you'll probably need to use an IDE like Visual Studio or Xcode\
    \ rather than an online browser-based compiler. See page 172 for instructions\
    \ on how to separate source and header files in your.\n\nYou can also create your\
    \ own namespaces. To do this, you use the keyword namespace and then the name\
    \ you want to use for your namespace; then, in curly braces, you include all the\
    \ declarations that will be part of that namespace.\n\nSuppose you want to create\
    \ a library of functions. The common practice in C and C++ is to break the code\
    \ for these into two files: header file and source file. Header files have a .h\
    \ or sometimes a .hpp file extension, while source files have a\n\n```\n// Program\
    \ 15_3\n// Namespace example\n#include <iostream>\nusing namespace std;\nnamespace\
    \ english {\nvoid greeting() {\n    cout << \"Hello!\" << endl;\n}\n}\nint main()\
    \ {\n    english::greeting();\n}\n```\n\nFor example, in Program 15_3, you have\
    \ a namespace named english (1). Inside the curly braces, you define a function\
    \ that is of type named greeting (m). This function is defined as part of the\
    \ namespace.\n\nLecture 15 | Functions in Top-Down and Bottom-Up"
