  md: '# getline


    A function that takes 2 parameters: an input stream and a string variable. A line
    (until an end-of-line character, such as new line: \n) is read in from the input
    stream and stored in the string variable.


    # sort


    An algorithm (obtained by using `#include<algorithm>`) for sorting vectors, arrays,
    or other containers. It takes in a beginning and ending iterator and sorts the
    elements from the beginning one to just before the ending one.


    # lower_bound


    An algorithm (obtained by using `#include<algorithm>`) for performing a binary
    search on a sorted array or vector. It takes in a beginning and ending iterator
    and an element value to look for. It returns an iterator to the first item that
    is greater than or equal to the item being searched for.


    # string::npos


    A value used to compare to in order to find the end of a string. When searching
    in a string, if an item being searched for is not found, the location will be
    reported as `string::npos`, indicating that it was not within the string.


