- pgno: 284
  md: "Next, you need to implement the get_best_move function, using the algorithm\
    \ described previously.\n\nThe snippet at right shows one way to implement it.\
    \ Notice that it takes in all the algorithm input as parameters: the person whose\
    \ turn it is, the current board state, and the current depth of recursion.\n\n\
    Instead of the recursion levels increasing, you’ll instead be counting them down.\
    \ So, the initial call would set some level of recursion that’s wanted—5 or 6\
    \ is reasonable—and then each time a new move is generated, you decrease that\
    \ number by 1 until you’re at level 0.\n\nYour function follows the same form\
    \ you outlined in the algorithm pseudocode. You first make a list of all moves.\
    \ To do this, you create a vector of pairs: Each pair will have a score for the\
    \ move and then which column it is in. Initially, you just go through all 7 columns\
    \ on the board and check if each is full. If it’s not full, then you add that\
    \ column as a potential move, though you don’t have a score evaluation for that\
    \ move yet.\n\nThe next section of code evaluates the moves. You go through the\
    \ list of moves you just identified. Notice that you’re using an iterator to go\
    \ through the list; the value m will take on each of the moves. You can see it’s\
    \ a reference because of the &, and because it’s a reference, it’s referring to\
    \ the actual move.\n\nFor that move, you create a board, starting with the old\
    \ one, which was the parameter b, and then take a turn using that particular column.\n\
    \nThen, for each move, you have one of 2 cases:\n\n+   » If you've hit the limits\
    \ of your recursion—that is, if the depth parameter is now 0 or if you’ve reached\
    \ a winning condition for one player or the other—then you just set the board\
    \ score.\n\n```\npair<int, int> get_best_move(int player_to_move, connect4_board\
    \ b, int depthtogo) {\n    int i;\n    // Make list of moves\n    vector<pair<int,\
    \ int> > possible_moves;\n    for (i = 0; i < 7; i++) {\n        if (!b.isfullcol(i))\
    \ {\n            // This is a possible move\n            possible_moves.push_back(make_pair(0,\
    \ i));\n        }\n    }\n    // Evaluate each move\n    for (auto& m : possible_moves)\
    \ {\n        connect4_board newboard = b;\n        connect4_move nextmove;\n \
    \       pair<int, int> mv;\n        nextmove.set_move(player_to_move, m.second);\n\
    \        newboard.take_turn(nextmove);\n        if ((depthtogo == 0) || (newboard.check_winner()))\
    \ {\n            // Don't look ahead any more - just see how good this board is\
    \ by itself\n            m.first = newboard.get_board_score();\n        }\n  \
    \      else {\n            // Look ahead another level\n            mv = get_best_move(3-player_to_move,\
    \ newboard, depthtogo - 1);\n            m.first = mv.first;\n        }\n    }\n\
    }\n```\n\n+   » If you need to continue evaluating moves, you can make a recursive\
    \ call. To do this, you call the same function you’re in: get_best_move. The player\
    \ number needs to switch. Notice that the next player to move is just 3 minus\
    \ the current player_to_move, so if the current player is 1, the next player is\
    \ 2, and vice versa. So, you just pass in 3-player_to_move to get the next player\
    \ number.\n\nYou also pass in the new board that you generated after making this\
    \ move that you’re wanting to evaluate. Finally, you pass in a recursion depth\
    \ level, 1 less than whatever came in. Notice that what is returned is a pair\
    \ that includes the best score you could get from that next possible move, so\
    \ you associate that returned score with the current move. You don’t care about\
    \ the other part of the recursion—the actual move that would yield that score.\
    \ The only time that matters is at the very end, when you get your final move\
    \ out."
  merge: -1
  img_proc: true
- pgno: 285
  md: "The final part of your algorithm is to find the best move and return. To find\
    \ the best move, you'll use the sort algorithm from the STL to sort all of your\
    \ moves from smallest to largest. Because a move is a pair, the first part of\
    \ which is the score, that means the STL algorithm will sort all possible moves\
    \ from the lowest score to the highest.\n\nRemember that for player 1, a low board\
    \ score means that he or she is winning. So, if the current player is player 1,\
    \ then the player would like to choose the move that gives the lowest score. Thus,\
    \ after sorting, you just\n\nreturn the first element of the vector. On the other\
    \ hand, if it's player 2's turn, then you want the largest score, so you return\
    \ the last element of the vector.\n\nIf you run this, you'll find that the AI\
    \ is surprisingly competent. You'll almost certainly still be able to beat it,\
    \ but it'll make sure to try to block you from getting a Connect 4, and it'll\
    \ grab an opportunity to get one itself if the chance is available. And it looks\
    \ ahead several moves, so if it sees a combination of moves that could help it\
    \ win, or prevent you from winning, it'll make those moves.\n\n```\n// Select\
    \ best move\nsort(possible_moves.begin(), possible_moves.end());\nif (player_to_move\
    \ == 1) {\n    // Player 1's move, so want smallest value\n    return possible_moves[0];\n\
    }\nelse {\n    // Player 2's move, so largest score is best\n    return possible_moves[possible_moves.size()\
    \ - 1];\n}\n```\n\n# // IMPROVING YOUR ALGORITHMS\n\nYou could try to improve\
    \ on these algorithms. The board evaluation function is key to how well the AI\
    \ performs, so that's an obvious candidate for improvement, because all you've\
    \ done so far is identify whether there's a winner and otherwise make a random\
    \ move.\n\nOne option for improvement would be to look for all cases in the program\
    \ where one player or the other is getting close to a connect 4.\n\nFor example,\
    \ you might look at all lines of 4 in the board in every direction—vertical, horizontal,\
    \ and diagonal—similar to the routines to check for winners, but check whether\
    \ one player has 3 of the 4 pieces needed for that option and the fourth space\n\
    \nneeded is still open. That means that the player has a chance to get a connect\
    \ 4 if he or she can get that one space. So, give the player 100 points. In other\
    \ words, if it's player 1 who has 3 of 4, then subtract 100 points from the board\
    \ score, and if it's player 2, then add 100 points to the board score.\n\nAnd\
    \ you could do the same thing with even fewer pieces, looking for places where\
    \ a player has 2 spaces needed and the other 2 are empty. In this case, they're\
    \ a little farther away, so maybe just add or subtract 10 points.\n\nAdding this\
    \ gives you an AI that's now awfully hard to beat! ♦\n\n```\nint check_vertical_advantage()\
    \ {\n    /* Check the board to see if either player has 2 or 3 of 4 needed */\n\
    \    int i, j, k;\n    int advantage = 0;\n    for (i = 0; i < columns; i++) {\n\
    \        // Can loop over all but last 3 rows, comparing 4 at a time\n       \
    \ for (j = 0; j < rows - 3; j++) {\n            int count1 = 0;\n            int\
    \ count2 = 0;\n            for (k = 0; k < 4; k++) {\n                if (board[i][j\
    \ + k] == 1) {\n                    count1++;\n                }\n           \
    \     else if (board[i][j + k] == 2) {\n                    count2++;\n      \
    \          }\n            }\n            if ((count1 == 3) && (count2 == 0)) {\n\
    \                advantage -= 100;\n            }\n            else if ((count1\
    \ == 0) && (count2 == 3)) {\n                advantage += 100;\n            }\n\
    \            else if ((count1 == 2) && (count2 == 0)) {\n                advantage\
    \ -= 10;\n            }\n            else if ((count1 == 0) && (count2 == 2))\
    \ {\n                advantage += 10;\n            }\n        }\n    }\n    return\
    \ advantage;\n}\n```"
  merge: -1
  img_proc: true
