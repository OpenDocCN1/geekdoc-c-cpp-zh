  md: 'The only thing left is the **main** program that actually runs your game. You
    start the game by creating a node, with the default constructor, named **firstnode
    (75)**, which will create an answer node with the guess **rock**. So, the game
    will always start the first time with the computer guessing that the user is thinking
    of a rock.


    Then, you will repeatedly ask the user if he or she wants to play the game, and
    as long as the user keeps answering **Yes**, you play another round (**m**).


    Each time, to play the game, you just call **ask_question** on **firstnode (82)**.
    Depending on whether you get a **true** or a **false** returned, you either celebrate
    winning the game (**83**) or sulk that you''ve lost (**86**).


    Assuming the computer doesn''t win, the more you play the game, the bigger the
    tree will get—that is, the more your program will "learn." In principle, you could
    go on until the computer runs out of memory; in practice, the computer will eventually
    win or you''ll run out of time to play. Dynamic allocation of memory gives you
    the potential to expand without limit.


    ```

    73  int main()

    74  {

    75    node firstnode;

    76

    77    cout << "Would you like to play 20 questions? ";

    78    string answer;

    79    cin >> answer;

    80    while ((answer == "Yes") || (answer == "yes") || (answer == "y") ||

    81          (answer == "Y")) {

    82      if (firstnode.ask_question()) {

    83        cout << endl << "I won!!!" << endl;

    84      }

    85      else {

    86        cout << endl << "OK, I guess I lost..." << endl;

    87      }

    88      cout << "Would you like to play again? ";

    89      cin >> answer;

    90    }

    91  }

    ```


    Dynamic memory allocation is something you need to keep in mind if


    +   » you need to allocate an amount of memory that you cannot predict ahead of
    time, or

    » the memory you need has a special structure, such as the binary tree used in
    the 20 Questions game.'
