  md: '# // VARIABLE ASSIGNMENTS


    Let''s go back to the original program for counting calories (Program 2_1 on page
    18). After your declarations of type and name, you can see that there are 3 assignments
    (d). Each of these lines has the same name on the left, an equal sign, and value
    on the right.


    Assignment is written with a equal sign, but it does not mean that 2 things are
    set equal to each other. It means that the thing on the right is assigned to the
    variable on the left. That''s why it''s better to say "gets" or "assigned" instead
    of "equals" when you read a line of code out.


    When you first declare a variable, it''s a good idea to set an initial value to
    be in the variable. It turns out that this is easy to: You can combine the variable
    declaration with assignment.


    ```

    int carb_grams = 30;

    int protein_grams = 5;

    int fat_grams = 15;

    ```


    This is the general form for any assignment statement. When this code is executed,
    the variable on the left side–is placed into the box. It replaces any other value
    already in that box.


    Variables wouldn''t do much good if you ever use the value they hold. When you
    see a variable on the right side of the assignment operator, you can think of
    what''s there as meaning "this value holds."


    First, you have a variable declaration, declaring a box of memory for an integer
    variable named carb_grams.


