- pgno: 242
  md: "The key thing to realize is that the base class, **shipping_company**, declared\
    \ a pure virtual function with no implementation. Only in the derived classes\
    \ were actual definitions for that function given.\n\nWhen you have pure virtual\
    \ functions, it's important to realize that you can't have an instance of the\
    \ base class. In the example, it doesn't make any sense to have a shipping company;\
    \ there's no way to know what the shipping cost would be for some generic shipping\
    \ company. Instead, you need to have a specific shipping company.\n\nYou can't\
    \ create an object out of an abstract class, though you can have references to\
    \ an abstract class. Classes that do provide the implementation details—the lower-level\
    \ derived classes that create objects are—concrete classes.\n\nSo, if you take\
    \ the same prior definitions and change the **main** routine to create an instance\
    \ of a **shipping_company**, you end up with an error telling you that you can't\
    \ declare an abstract type. ◆\n\nA class that has pure functions is an **abstract\
    \ class**. It defines an interface, like **shipping_company**, that can't refer\
    \ to any specific instance of the class, but rather defines some more general,\
    \ abstract representation.\n\n```\n// Error when trying to instantiate an abstract\
    \ class\nint main() {\n  shipping_company;\n}\n```\n\n# Exercise\n\nCreate an\
    \ abstract **shape** class that has an **area** function. Then, create 2 specific,\
    \ concrete classes—**square** and **circle**—that inherit from the general **shape**\
    \ class.\n\nClick here to see the solution.\n\n# READINGS\n\n+   a Stroustrup,\
    \ *Programming Principles and Practice Using C++*, sections 14.2–14.3.\nb Lippman,\
    \ Lajoie, and Moo, *C++ Primer*, sections 15.3–15.4."
