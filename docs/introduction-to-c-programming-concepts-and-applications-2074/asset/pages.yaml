- pgno: 188
  md: 'Notice that you did not get a compiler error in any of the many places inside
    the member functions where you accessed member variables. Because you were accessing
    the private members from within the class, everything was OK. Only when you tried
    to access those members from the main function was there an issue.


    The public and private designations can be used multiple times in a class definition.
    However, it’s common practice to put the private members first and the public
    members after that. It’s also common practice to put all the member variables
    (attributes) first and the member functions (methods) after that.


    Besides public and private designations, there’s also protected, but for the cases
    you’ve seen, protected acts just like private.


    In a class definition, the default assumption is that the members are being defined
    as private. That’s why you previously had to have public: in your code; if you
    had left it off, everything would have been seen as private.


    It’s not uncommon for all of the member variables to be private, or protected.
    That makes sure that nothing will mess around with the internal structure of the
    class unless it does so through an approved channel—one of the public functions.


    But it’s still common to need to adjust those variables or find out what they
    are.


    Accessor functions let you read the value of a private member variable. Basically,
    they provide one of those approved channels through which information is allowed
    to leave the class.


    This is actually the main place where there’s a difference between the C++ class
    and the C++ struct: In a C++ class, the default is that everything is private,
    but in a struct, the default is that everything is public.


    Mutator functions let you modify the value of a private member variable.


    When you’re debugging, accessor and mutator functions give you a line of code
    that you can set a breakpoint at so that you know when a member is being accessed.
    Conversely, you have no way of automatically pausing when a public member is being
    changed.


    So, accessors and mutators help you ensure that the overall object maintains internal
    consistency whenever it is used.


    # READINGS


    a Stroustrup, Programming Principles and Practice Using C++, sections 9.1–9.4.


    b Lippman, Lajoie, and Moo, C++ Primer, sections 7.1 and 7.2.'
