- pgno: 288
  md: '# # Glossary


    # ### abstract class


    A class that contains a pure function. It defines a general category of classes
    from which other classes can be derived. Instances of an abstract class cannot
    be created. (L20)


    # ### array


    A contiguous block of memory containing several variables of the same type. The
    array is allocated at once, and individual variables (**elements**) are accessed
    by **index**. (L7) The more modern and C++ approach is to use a **vector**.


    # ### accessor function


    Provides an approved channel to read information from a class. Allows other functions
    to access member variables. Also provides a useful place to set breakpoint when
    debugging. (L16)


    # ### array out-of-bounds error


    A bug arising from attempting to access an element of an array that is outside
    of memory allocated. This happens when the array index is negative or larger than
    the maximum size of the array. (L7) This can be a major security flaw.


    # ### algorithm


    A precise set of rules and to follow to accomplish some task. Often described
    by pseudocode, which is converted into actual code. (L22, L23, L24)


    # ### artificial intelligence


    Programming a computer to act as though it is making intelligent choices and decisions.
    (L24)


    # ### append


    To add to the end of an existing item. Appending is commonly used when writing
    to files, to add additional data to the end of the file, or add one string to
    the end of another. (L9, L10)


    # ### associative container


    A container that associates 2 or more data types together. Examples include pairs,
    tuples, and maps. (L23)


    # ### attribute


    See **member variable**.


    # ### arguments


    Values given in a function call; each argument parallels a **parameter** inside
    the function itself, and the parameter takes on the value of the argument within
    the function. (L12)


    # ### binary search


    A process for searching through a sorted list of values by examining the halfway
    point and then searching one of the 2 remaining halves. (L23) Contrast with **iterative
    search.'
