  md: "```\n// Program 17_8\n// Operator example - multiplying lightbulb\n#include<iostream>\n\
    using namespace std;\n\nclass lightbulb {\npublic:\n    int watts_used;\n    int\
    \ lumens;\n    int temperature;\n\n    lightbulb() {\n        watts_used = 60;\n\
    \        lumens = 900;\n        temperature = 2700;\n    }\n};\n\nlightbulb operator\
    \ *(lightbulb bulb, int increase_factor) {\n    lightbulb ans;\n    ans.watts_used\
    \ = bulb.watts_used * increase_factor;\n    ans.lumens = bulb.lumens * increase_factor;\n\
    \    ans.temperature = bulb.temperature;\n    return ans;\n}\n\nint main() {\n\
    \    lightbulb bulba, bulb b;\n    bulb b = bulba * 2;\n    cout << bulb b.watts_used\
    \ << \" \" << bulb b.lumens << \" \" << bulb b.temperature << endl;\n}\n```\n\n\
    Suppose you have a class you are using to keep track of lightbulbs. Every bulb\
    \ will have 3 pieces of data: the number of watts used, the number of lumens (amount\
    \ of light) produced, and the equivalent color temperature of the bulb.\n\nYou\
    \ can define a class with those member variables, as you can see in the code.\
    \ Notice that all 3 member variables are public in this case and that a default\
    \ constructor is being used to set initial values for the 3 values (c).\n\nLet’s\
    \ say that you want the ability to create a new bulb that is some factor multiple\
    \ of an existing bulb. For example, if a bulb is 2 times another bulb, it should\
    \ use 2 times as many watts and produce 2 times as many lumens but have the same\
    \ color temperature.\n\nLet’s see how you could define a multiplication operator\
    \ for the lightbulb. Your multiplication operator should take in 2 operands: a\
    \ lightbulb and an integer that you are multiplying the lightbulb by. And the\
    \ result should be a new lightbulb, one using that factor more watts and producing\
    \ that factor more lumens. So, your operator definition should produce another\
    \ lightbulb as a result, so the definition has a return type\n\nof lightbulb.\
    \ You then would write operator * to show that you are defining the multiplication\
    \ operator. Then, the parameters for the operator should be a lightbulb (labeled\
    \ bulb in this case) and an integer (labeled increase_factor) (19).\n\nInside\
    \ of the function, notice that you create a new lightbulb, called ans, short for\
    \ answer, because it will be the answer you return from the operator. You set\
    \ the watts used and the lumens as a product of those elements of bulb multiplied\
    \ by increase_factor. The color temperature is just the same as bulb is. Then,\
    \ you return ans (d).\n\nIn your main routine, you can now create 2 bulbs named\
    \ bulba and bulb b, where bulba is initialized with the default constructor so\
    \ that it has 60 watts, 900 lumens, and a 2700 color temperature. You set bulb\
    \ b to be bulba times 2. This will call the multiplication operator on a lightbulb\
    \ times an integer, so bulb b should have twice the number of watts, or 120, and\
    \ twice the number of lumens, or 1800, while having the same color temperature,\
    \ 2700, as bulba. And that's indeed what you see as a result.\n\n> Note that operators\
    \ are not automatically commutative; in other words, you cannot switch around\
    \ the order of the 2 operands. So, you could not multiply an integer times a lightbulb;\
    \ you defined a lightbulb times an integer, but not the other way around."
