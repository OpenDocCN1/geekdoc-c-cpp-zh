  md: "# // BOTTOM-UP DESIGN\n\nThe idea of bottom-up design is to take existing things\
    \ you know how to do and combine them into something new. Then, you could use\
    \ that to do something you work up the hierarchy, using individual functions as\
    \ building blocks.\n\nIn this simple example you might use in a word processor,\
    \ you have a function, pos_first, that lets you find the first occurrence of some\
    \ word in a string (f). And you have another function, replace_string, that lets\
    \ you replace one section of a string with a different string (g). You can look\
    \ at these functions and realize that you can use them to replace the first occurrence\
    \ of one word with another. So, you would create a new function, search_and_replace,\
    \ that will replace larger string (h).\n\n```\n// Program 15_2_1\n// Example of\
    \ bottom-up program - string processing (incomplete) -\nStage 1\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nint pos_first(string& string_to_find,\
    \ string& string_to_search) {\n    /* Returns the first position of string_to_find\
    \ in string_to_search,\n    or -1 if it is not in there */\n    // Code Here\n\
    }\n\nvoid replace_string(string& string_to_modify, int start_pos, int end_pos,\
    \ string& string_to_insert) {\n    /* Inserts string_to_insert into string_to_modify,\
    \ replacing anything\n    in positions start_pos to just BEFORE end_pos */\n \
    \   // Code Here\n}\n\nb search_and_replace(string& string_to_modify, string&\
    \ old_string, string& new_string) {\n    /* Replace first occurrence of old_string\
    \ with new_string and returns\n    true, or returns false if it did not find old_string\
    \ */\n}\n\nint main() {\n    // Code Here\n}\n```"
