  md: "Here is a program; it may be helpful to compare the previous program to see\
    \ differences between files and stringstreams. You will read an entire line from\
    \ input (using the getline command in this case, ss). You will then read integers\
    \ until you have the last value from the stringstream. Note that the for loop\
    \ used for files should not be used here: the eof function is true only after\
    \ trying to read beyond the last element, while for stringstreams, eof is true\
    \ once the last element has been read. Thus, it is easier to use a while loop\
    \ for stringstreams, with each iteration reading a value and updating the sum\
    \ total and number of scores. The average is output just as with files.\n\n```\n\
    #include <sstream>\n#include <iostream>\n#include <string>\n\nusing namespace\
    \ std;\n\nint main() {\n    string input;\n    getline(cin, input);\n    stringstream\
    \ ss(input);\n    int total = 0;\n    int score;\n    int num_vals = 0;\n    while\
    \ (ss.eof()) {\n        ss >> score;\n        total += score;\n        num_vals++;\n\
    \    }\n    cout << \"The average was \" << total / (double)num_vals << endl;\n\
    }\n```"
