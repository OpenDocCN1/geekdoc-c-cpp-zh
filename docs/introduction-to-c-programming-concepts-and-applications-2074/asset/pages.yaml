- pgno: 283
  md: "# // FROM ALGORITHMS TO IMPLEMENTATION\n\nThe full program is available for\
    \ download at www.TheGreatCourses.com/CPlusPlus.\n\nTo go from algorithms to implementation,\
    \ you begin by modifying the Connect 4 classes that were developed in lecture\
    \ 21. A few changes were made to simplify things: There’s only one game—Connect\
    \ 4—and there’s no inheritance or virtual functions in this version.\n\nThere\
    \ are 3 main classes:\n\n+   » **game**, which has member functions to start a\
    \ game, take a turn, and declare a winner.\n\n+   » **connect4_board**, which\
    \ stores a Connect 4 board, including any pieces already in place. This class\
    \ can check for a winner, print the board to the screen, check whether columns\
    \ are filled, and update itself.\n\n+   » **connect4_move**, which is a basic\
    \ class that holds a move: the column to place a piece in and which player is\
    \ placing that piece. It has some basic accessor functions to set and read moves\
    \ or to ask a player to enter a move.\n\nAnd 2 small changes were made to make\
    \ this program an AI program:\n\n+   » You no longer ask which game to play, and\
    \ instead, when starting the game, you ask whether the computer should be player\
    \ 1 or player 2, keeping this information as a private variable.\n\n+   » Then,\
    \ when taking a turn, if it’s the player’s turn, you get the move from the player,\
    \ as usual. But if it’s the computer’s turn, then you will call the **get_best_move**\
    \ function, which will return a pair: the score for the best move and which column\
    \ the best move is in. So, you just take the second element of the pair and make\
    \ the move there.\n\nSo, there are 2 algorithms that need to be implemented: a\
    \ board evaluation algorithm and **get_best_move**. These are the core parts of\
    \ the AI algorithm in the code. Because the board evaluation algorithm will want\
    \ to make use of board information, it makes sense for it to be a member function\
    \ of the **connect4_board** class. Meanwhile, **get_best_move** doesn’t need any\
    \ information about the board—that’s what the board evaluation function does—so\
    \ it should be a standalone function.\n\nHere’s one way to implement a **get_board_score**\
    \ function. First, notice that your routine has access to the board state because\
    \ it’s a member function of the **connect4_board** class. Thus, it doesn’t have\
    \ to bring in the board as a parameter; it already has access to it. It will return\
    \ an integer, the score for the board. You already had a routine, **check_winner**,\
    \ that would indicate whether the game was won by player 1 or player 2, or was\
    \ a tie, or was none of those. So, you first call that function to see if the\
    \ board had a winner.\n\n```\n// Returns negative value for player 1 advantage,\n\
    positive for player 2 advantage\nint get_board_score() {\n    int winner = check_winner();\n\
    \    if (winner == 1) return -1000;\n    if (winner == 2) return 1000;\n    if\
    \ (winner == 3) return 0;\n    // No one has won yet, so see who is \"closer\"\
    \n    return rand()%11 - 5;\n}\n```\n\nIf the game was won by player 1 or player\
    \ 2 or was a tie, then you return either **-1000, 1000,** or **0**, respectively.\n\
    \nIf the game is not over, then you return a random value between -5 and 5, as\
    \ the algorithm described. To do this, you can generate a random number from 0\
    \ to 10 and subtract 5.\n\n> Remember that to generate a number from 0 to 10,\
    \ you use the **rand** function to generate a random integer and take it modulo\
    \ 11.\n\nThe random value you assign just means that boards where no one has won\
    \ are evaluated randomly. But the fact that the algorithm does identify winning\
    \ and losing positions means that it still provides value to the look-ahead process\
    \ of finding the best move.\n\nIn other words, even though you have a board evaluation\
    \ function that only evaluates whether someone has won or not, it will still be\
    \ enough to give you a decent AI. And it gives you something to improve later!"
