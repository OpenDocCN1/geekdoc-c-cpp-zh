- pgno: 51
  md: '# // DESIGNING AND TESTING YOUR PROGRAM


    How do you make your code organized logically? This is where design comes in.


    Usually, your program begins with some idea—what you want to be able to do. Often,
    this is just a vague idea at the beginning; from there, try to get specific. You
    need to determine exactly what you are doing—what you expect as input to the program,
    what you want to perform, and what you want to be able to output. These are often
    called the program requirements.


    At this point, you have two things you should do: determine test cases and design
    the itself. Following program design, you''ll code your program, and as you code,
    you''ll continually check that your code is on track. When you''ve written all
    code and passed all the tests, you''ll have achieved success—a working program.


    Because of the impact that errors can have, testing is often a major part of a
    software development project. On professional projects, the estimates vary from
    about a quarter to half the total time on a project being spent on testing!


    In many ways, being able to pass tests the most critical ability of a program.
    This is why some people believe that coming up with tests should be the first
    thing you do when developing a program. This approach is test-driven development.
    If you developed a sufficient set of tests, then having a program that passes
    the tests means your program works correctly. The only way something would be
    an error, or bug, is if it caused a test you did not


    Here are some general rules of thumb for what to test:


    +   * First, think of the boundary cases, also called edge cases or corner cases.
    In many programs, the edge cases are where there''s a break or boundary of sort.
    Suppose you have a test where you wanted to give a discount to people under 18
    years of age. In that case, would it be edge case and so 17? Those ages would
    be right on the boundary and would be some of the most likely places that an incorrect
    computation might occur.

    * Next, try to think of special cases and invalid options that users might enter.
    If you''re writing a program that handles people''s names, you might assume that
    everyone has a first, middle, and last name, each made up of letters with an initial
    capital and the rest lowercase. But you probably want to ensure you can handle
    names with apostrophes or hyphens, different


    Think early over your tests. Sometimes, thinking about tests will help you remember
    things to include in the software design itself.


    capitalization, and or fewer than 3 names. With edge cases, the idea is to think
    what assumptions you might have for the typical case and ensure you handle the
    other cases that come up, too.


    +   * Final, test all of the regular cases. Usually, just a few of these are sufficient.


    When you''ve thought of tests, it''s a good idea to write them down. Often, this
    is simply writing down an input and what the output should be.


    # Exercise


    Suppose you want to write a program that handles dates. What are some of the days
    of the year you want to include in your test cases?


