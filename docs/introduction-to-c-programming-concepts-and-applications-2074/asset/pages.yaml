  md: 'Once you have the program decomposed with a top-down design, then you can begin
    to code it. To get started, this is a great point to take the pseudocode you''ve
    been generating and convert each step into a comment, generating comments for
    each section. Comments will help guide your code, and provide an explanation for
    the purpose of each part of the code, both during and after writing the code itself.


    Considering the tree hierarchy, the root node becomes the overall comment for
    the program (2). The next level, the children of the root, each get their own
    comment. Because these are at the higher levels of the hierarchy and will be major
    sections, it can make sense to designate them in some way that makes them stand-out—for
    example, using asterisks (a).


    Then, you can divide this into the next level down. Again, you convert each node
    into a new comment. In this case you can use a few asterisks to show that these
    are not the most basic levels of the hierarchy (b).


    Then, you can go from there to even the next level down, converting nodes to comments
    (c).


    Each of these is still pretty self-explanatory. Once you''ve done this for your
    whole program, it''s time to start writing code.


    ```

