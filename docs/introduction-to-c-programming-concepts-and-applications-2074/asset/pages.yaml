  md: '# // INCREMENTAL DEVELOPMENT


    When you develop software, you want to construct the software piece by piece,
    and as each piece put into place, you want to ensure that you have a stable structure—something
    that is not complete but will operate just fine. You will be able to see that
    each piece works and is tested as you go along. And if you find that everything''s
    not working, you can take one step back and return to a stable piece of software.


    This is why you should use an incremental development approach, in which you code
    a little, until you are confident that everything up to that point is working,
    code a little more, and so on. Now you will be confident in what you have already.


    Unfortunately when programmers—even experienced ones—construct a larger piece
    of software, they will write lots of code, and only at the end, they think they
    have all the pieces in place, do try to test it. If everything actually works,
    it''s extremely rare to have it right. Instead, somewhere along the way, the made
    a mistake, and the entire program falls apart. Trying to find that one mistake
    is difficult, and sometimes even after fixing that, there''s some other mistake,
    and you can''t figure out if they fixed a problem or not.


    In this case, it''s OK to design your entire program top-down and write out the
    comments for each part ahead of. But when it comes to coming, you want to write
    a code that you want to implement a small chunk and test what you''ve verified.
    Generally, this means you''ll have to write code in a sequential order, once you
    start writing functions, and you''ll have exactly to be the case.


    In this example, the first section you encounter is part of reading past data,
    where you will read the past electricity data and where you went to open the file
    (d). That means you declare an ifstream (13) and then open it for input (14).
    Notice that you also write a line of code to close it (17).


