- pgno: 196
  md: 'Using stream operators to stream from input shows the same differences; the
    input is treated in a way that is specific to the type you are wanting to read
    in. So, you can use the same operator—the stream operator—but it is specialized
    to the type you need.


    In fact, the stream operator can also be used with an integer on the left, where
    it has a totally different operation from when there is a stream on the left.
    With integers, the stream operator actually means "shift the bits of the integer
    left or right a certain number of spaces." While those shifts can be useful in
    making really efficient code, that operation has nothing to do with streaming
    input or output!


    There is a wide variety of operators you can overload. Binary operators take 2
    elements per operator. Examples include arithmetic operators, stream operators,
    comparison operators, and Boolean operators.


    ```

    + - * / % <<

    >> > < >- <=

    == != && ||

    & | ^ [] ->

    ```


    There are also a few unary operators, which take just a single element.


    ```

    - + ++

    -- ! * &

    ```


    All of these operators, and even a few less common ones, are those you can overload;
    you can create your own version of how they should operate for a particular class
    or combination of classes.


    > Operator overloading is more than just a clever way to put familiar characters
    to a new use; it can be a fundamental part of making a class more widely useful.


    ```

    1  // Program 17_6

    2  // Example of shifting bits

    3  #include <iostream>

    4  using namespace std;

    5

    6  int main() {

    7      int i = 1;

    8      int j = i << 3; // Shifting bits 3 spaces left

    9      cout << j << endl;

    10 }

    ```


    # // OVERLOADING BINARY OPERATORS


    One way of overloading a binary operator involves defining an operator in a very
    similar way to how you define a function.


    Whenever a binary operator is used, there are going to be 2 operands: one just
    before the operator and one immediately after. Then, there will be a result of
    some type. For example, a comparison operator should probably give a Boolean result.


    The type of result is basically the return type of the operator function, which
    will take exactly 2 parameters: the object type of the first and second operands.
    The only "different" part is the function name, which will have the keyword operator,
    followed by the particular operation. And all of this gets defined just like any
    other function would—not as a part of any class.'
