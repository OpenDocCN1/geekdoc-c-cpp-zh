    \ Programming\nProgram 16_1\nCreating Classes\nSorting Data in Classes\nProgram\
    \ 16_3_a\nProgram 16_3_b\nProgram 16_4\nProgram 16_5\nProgram 16_6\nPublic versus\
    \ Private\nProgram 16_9_ERROR\nQuiz\n Answers\n\nUp until this point, the basic\
    \ style of programming you've been learning is one you could have been doing in\
    \ C, even though you've seen several C++-specific features that make things better.\
    \ Called procedural programming, this style relies on functions, or procedures,\
    \ to organize the computation. From now on, you'll need everything for you to\
    \ learn one of the key advances in C++: object-oriented programming.\n\n# // OBJECT-ORIENTED\
    \ PROGRAMMING\n\nThere \"pure\" object-oriented languages before C++, and there\
    \ have been languages developed after C++, such as Java, that only allow object-oriented\
    \ programming. By contrast, C++ lets use both procedural and an object-oriented\
    \ style. And compared to other languages that offer some of both, such as Python,\
    \ C++ has a very complete set of object-oriented features. It enables you to program\
    \ in a strict object-oriented style if you want to.\n\nWhen you object-oriented\
    \ programming, your development is centered around the creation of what are known\
    \ as classes, which presents an overall way of organizing the computations in\
    \ a program, where objects are particular instances of classes.\n\nThe feature\
    \ of classes that is perhaps the most useful part of object-oriented programming\
    \ is encapsulation.\n\nImagine that you want to write a program that would allow\
    \ you to track what happens with a vending machine—money taken in, the number\
    \ of items left inside, when it's time to reorder.\n\nThe focus in object-oriented\
    \ programming is to identify objects. In the case of vending machines, any particular\
    \ vending machine is an object. But you would like your program to handle vending\
    \ machines more generally. So, you could also have a vending machine class—a way\
    \ of referring to all vending machines."
