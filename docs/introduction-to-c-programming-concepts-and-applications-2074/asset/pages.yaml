- pgno: 169
  md: "# // QUIZ ANSWERS\n\n1 c Isolate a repeatable error. You first need to have\
    \ a definite error that you can reliably check.\n\nf Narrow in on the location\
    \ of failure. Find the line where you can identify that things go wrong. Remember\
    \ that the location of failure is where the bug manifests but is not necessarily\
    \ where the actual bug in the code occurs.\n\nb Identify the source of the failure.\
    \ Based on the location the error occurs, try to determine what the actual source\
    \ of the error is. This usually requires logic, deduction, and inference.\n\n\
    d Fix the error at its source. When you know the error, you can fix it at its\
    \ source.\n\na Retest. Once the error has been fixed, you need to test again to\
    \ make sure everything still works—to ensure you both fixed the bug and did not\
    \ create a new error.\n\ne Consider similar cases. Because an error in one location\
    \ in the program might have been repeated elsewhere, before moving on, consider\
    \ whether the error might have been made in other locations as well.\n\n2 The\
    \ code will need to use try-catch blocks. The function call should be inside of\
    \ the try block, and the catch block will be used to catch the exception, with\
    \ the output line inside that block.\n\n```\ntry {\n    draw_square();\n}\ncatch\
    \ (exception& e) {\n    cout << \"Can't draw square\" << endl;\n}\n```\n\n3 Here\
    \ is a function. You need to have a conditional to check whether either parameter\
    \ is negative and, if so, throw an exception. Otherwise, just return the sum.\n\
    \n```\nint tester(int a, int b) {\n    if ((a<0) || (b<0)) {\n        throw exception();\n\
    \    }\n    return a+b;\n}\n```"
