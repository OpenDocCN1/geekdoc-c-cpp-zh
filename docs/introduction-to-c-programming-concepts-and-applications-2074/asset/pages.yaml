- pgno: 159
  md: "# 14 Systematic Debugging, Writing Exceptions\n\nIN THIS LECTURE:\n\n+   -\
    \ A Systematic Approach to Debugging\n  - Program 14_1\n  - Program 14_2\n- Types\
    \ and Sources of Errors\n  - Program 14_4\n  - Program 14_5\n- Using Exceptions\n\
    \  - Program 14_6\n  - Program 14_7\n- Quiz\n- Quiz Answers\n\nAlthough everyone\
    \ would like their programs to run perfectly as soon as they’re written, that’s\
    \ never actually the case. So, every programmer needs to come to terms with the\
    \ fact that a lot of programming time will be spent dealing with errors.\n\n#\
    \ // A SYSTEMATIC APPROACH TO DEBUGGING\n\nTo avoid frustration and failure, you\
    \ should approach the process of debugging methodically, following 6 main steps:\n\
    \n+   1. isolate the error,\n2. narrow in on the failure point,\n3. identify the\
    \ problem,\n4. fix the problem,\n5. retest, and\n6. consider similar cases where\
    \ the error you’ve fixed might reappear elsewhere in your program.\n\n# STEP 1:\
    \ ISOLATE\n\nThe first step is to isolate an error. This involves writing good\
    \ test cases, which helps make sure that the code is running as expected. You\
    \ want to run tests until you either cannot come up with any tests that give problems\
    \ or find a test that gives a repeatable error. It’s important for the error to\
    \ be repeatable; you want to make sure that every time you run the program with\
    \ that test, you get the same incorrect result.\n\n> Debugging is a methodical\
    \ process. It’s not just a matter of randomly jumping through your code to find\
    \ errors and make bugs disappear."
  merge: -1
  img_proc: true
- pgno: 160
  md: "A common version of the test case idea is to set up a unit test, which is a\
    \ test case run for a particular function. Basically, you have some input to the\
    \ function and then some output you should expect to see. When you write a function,\
    \ it’s a good idea to run several unit tests to make sure the function is working\
    \ as expected.\n\nThis program is designed to let a user enter some text and then\
    \ it will check whether that text is a palindrome or not (a). It does this by\
    \ calling a function is_palindrome (b), which calls a function remove_spaces to\
    \ remove spaces from the text (c). Then, it goes over the first half of the characters\
    \ (21), comparing them to the corresponding character on the other side (22).\
    \ If they all match, then it’s a palindrome; otherwise, it’s not.\n\nBecause you’re\
    \ focused on the is_palindrome function, you can consider this a unit test of\
    \ the is_palindrome function itself. You want to give the is_palindrome function\
    \ an input and check that it’s giving the right output.\n\nFor your unit test,\
    \ you’ll check to see if your function works for a very simple text string: aaa.\
    \ That should be a palindrome, but when you run the program to check it, you get\
    \ the wrong answer!\n\n```\n// Program 14_1\n// Example program to debug - contains\
    \ an error!\n#include <iostream>\n#include <string>\nusing namespace std;\n\n\
    string remove_spaces(string s) {\n    string ret = \"\";\n    int i;\n    for\
    \ (i = 0; i < s.size(); i++) {\n        if (s[i] != ' ') {\n            ret +=\
    \ s[i];\n        }\n    }\n    return ret;\n}\n\nbool is_palindrome(string s)\
    \ {\n    string no_spaces = remove_spaces(s);\n    bool could_be_palindrome =\
    \ true;\n    for (int i = 0; i < no_spaces.size() / 2; i++) {\n        if (no_spaces[i]\
    \ != no_spaces[no_spaces.size() - i]) {\n            could_be_palindrome = false;\n\
    \        }\n    }\n    return could_be_palindrome;\n}\n\nint main()\n{\n    cout\
    \ << \"This will tell you whether certain text is a palindrome.  Enter some text:\"\
    \ << endl;\n    string user_input;\n    getline(cin, user_input);\n    if (is_palindrome(user_input))\
    \ {\n        cout << \"It is a palindrome!\" << endl;\n    }\n    else {\n   \
    \     cout << \"It's not a palindrome.\" << endl;\n    }\n}\n```"
  merge: -1
