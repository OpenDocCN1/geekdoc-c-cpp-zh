  md: '# C++ Templates, Containers, and the STL


    IN THIS LECTURE:


    +   - Templates and Containers


    +   - Program 22_1


    +   - Queues


    +   - Program 22_2


    +   - Lists and Iterators


    +   - Program 22_4


    +   - Program 22_7


    +   - Program 22_8


    +   - Program 22_9


    +   - Program 22_10


    When you have an idea that''s so general that it''s not really tied down by any
    single class hierarchy, that''s when you turn to generic programming. While procedural
    programming orients the program around functions and object-oriented programming
    orients the program around classes (and their objects), generic programming orients
    programs around very general concepts of data structures and **algorithms**. You
    can think of generic programming as a way of defining classes and functions that
    are not tied to any specific data type. Instead of using a data type, it uses
    a template.


    Quiz:


    Quiz Answers


    # // TEMPLATES AND CONTAINERS


    Basically templates are a way of saying that a class''s member variables, or a
    function''s parameters, are not of a specific type but instead of some generic
    type. So, rather than the class or function working only for one specific type,
    it can be used for any types that match some type. When you actually want to use
    a specific class or function, then the template will take on.


    For example, the vector is a templated class. It lets you store a list of any
    type of object, but to use it, you have to create a vector that stores some particular
    type. So, although vectors have been referred to as a class, are really a more
    general container capable of holding a variety of unrelated classes.


    In ordinary English, the term generic often means "not special" or even "not good,"
    but in programming, the generic means that you are "generalizing" some concept
    or idea.


    ```

    vector<int> v1;

    vector<float> v2;

    vector<string> v3;

    vector<my_class> v4;

    ```


    The angle brackets, as used when declaring vectors, are used to specify what particular
    instance of a class or function will take on. The type''s specified in the angle
    brackets is the type that replaces the template throughout the class or function.'
