  md: "# // Program 19_3\n// Inheritance member functions\n\n```\n#include<iostream>\n\
    #include<string>\nusing namespace std;\n\nint main() {\n    class product {\n\
    public:\n    float wholesale_cost;\n    float retail_cost;\n    float profit_per_unit()\
    \ {\n        return retail_cost - wholesale_cost;\n    }\n};\n\n    class plate\
    \ : public product {\npublic:\n    float diameter;\n};\n\n    class cup : public\
    \ product {\npublic:\n    float volume;\n    string color;\n};\n\n    class measuring_cup\
    \ : public cup {\npublic:\n    bool metricunits;\n    int num_gradations;\n};\n\
    \n    class measuring_cup_plastic_cup : public measuring_cup {\n    plastic_cup.wholesale_cost\
    \ = 0.10;\n    plastic_cup.retail_cost = 0.30;\n    plastic_cup.volume = 100.0;\n\
    \    plastic_cup.color = \"\";\n    plastic_cup.metricunits = true;\n    plastic_cup.num_gradations\
    \ = 10;\n\n    cout << \"The plastic cup costs \" << plastic_cup.wholesale_cost\
    \ << endl;\n    cout << \"to purchase and sells for \" << plastic_cup.retail_cost\
    \ << endl;\n    cout << \"We made a profit of \" << plastic_cup.profit_per_unit()\
    \ << endl;\n}\n    return 0;\n}\n```\n\nAnd, as you'd expect from a hierarchy,\
    \ can have more than one derived class from the same base class. For example,\
    \ in addition to a `measuring_cup`, in Program 19_3, it's been defined as a subclass\
    \ of `cup`, with one more member variable: Boolean whether it has a lid or not\
    \ (f).\n\nYou're not confined to inheriting member variables; you inherit member\
    \ functions.\n\nSay your product class had a member function named `profit_per_unit`.\
    \ It would be simple, returning the difference between the retail and wholesale\
    \ prices (g).\n\nThen, if you have an object of some derived type, like a `measuring_cup`,\
    \ you can call it just like you would for the base class. In this example, you\
    \ have a `measuring_cup` named `plastic_cup`, and you call `plastic_cup.profit_per_unit`\
    \ to get the profit (h).\n\nInheritance only goes one way—from the parent to the\
    \ child. A superclass does not have access to the member variables and functions\
    \ of the subclasses, and sibling classes don't have access to each other's variables."
