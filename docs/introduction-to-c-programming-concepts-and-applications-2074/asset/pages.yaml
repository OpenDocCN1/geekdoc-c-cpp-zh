  md: '# 24 Artificial Intelligence Algorithm for a Game


    A pinnacle achievement for any programmer is artificial intelligence (AI), which
    means making a computer act as though it’s making intelligent choices and decisions.
    Game playing has long been a fundamental area of research in AI. The idea is that
    if you can get a computer to play a game well, where the domain and options are
    more clearly defined and limited, then you might have a sturdy basis for extending
    those ideas to a more general context.


    # IN THIS LECTURE:


    +   - AI Game Playing

    - Developing Algorithms

    - From Algorithms to Implementation

    - Improving Your Algorithms

    - Quiz

    - Quiz Answer


    # // AI GAME PLAYING


    You can develop a basic approach to AI game playing to get a computer to play
    a game of Connect 4 with you intelligently. To do this, you create new algorithms—that
    is, steps to solve a problem—to increase the artificial intelligence of your program.


    Start by thinking about how you’d want a computer to make a choice for what a
    good move would be.


    At any one point in time, the computer can look at the board and see that it has
    a few possible moves. Each of those moves will lead


    to a new board, and then it’s the opponent’s turn. A not-very-intelligent computer
    would do something like choose the first open column, or pick a column at random,
    or even just pick the single move that looked best without considering what the
    opponent might do.


    But a slightly smarter computer would not only consider what move looked best
    for a solo player, but then what move the opponent could make after that. So,
    if the computer made possible move number 1, then the opponent would have some
    set of possible moves to make. If the computer assumes the


    opponent makes the best of those moves, then the computer can reasonably think:
    "If I make move number 1, then here is where I’ll be at the next point I can make
    a move." Similarly, the computer could evaluate what the opponent’s moves might
    be for every possible move along the way.


    For Connect 4, there are 7 columns, so there are typically 7 moves possible at
    each turn. So, if a computer had to evaluate each move it could make and each
    move an opponent could make, that would be 7 times 7, or 49, different moves.'
