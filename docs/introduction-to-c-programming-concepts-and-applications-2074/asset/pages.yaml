    \nThe ability to design appropriate classes may be the single most important skill\
    \ in object-oriented programming. Classes allow you to encapsulate data relationships\
    \ in ways that match up nicely with many real-world problems. But how well your\
    \ program works—indeed, whether it works at all—can depend crucially on how your\
    \ classes, and their operations, have been set up at the start of the program.\
    \ Two key tools for getting classes off to a strong start for any object-oriented\
    \ program are constructors and operator overloading.\n\n# // CONSTRUCTORS\n\n\
    Whenever you declare a new class or object, the computer sets aside a chunk of\
    \ memory. This memory will hold all of the member variables for that object. So,\
    \ you want to have some way of initializing the memory—that is, the member variables—and\
    \ where a **constructor** can run at the time a new object is created. Its purpose\
    \ is to initialize the object to some valid state so that the member variables\
    \ have reasonable values.\n\nOften, the constructor you'll want to define is the\
    \ **default constructor**. A default constructor that you create should be defined\
    \ as a public member function of the class. Make sure to write public: before\
    \ defining the constructor.\n\nThe constructor is a special function; there is\
    \ no return type, because the only thing it does is initializing an object.\n\n\
    The word default can have 2 meanings here:\n\n+   The default constructor is what's\
    \ called when you declare an object in the common way, where you just list the\
    \ type and then the variable name.\n\n+   But if a user doesn't specify any constructor\
    \ at all, then the compiler will automatically create its own default constructor\
    \ for the class."
