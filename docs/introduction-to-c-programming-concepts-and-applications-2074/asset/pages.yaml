  md: "# # SCOPE\n\nThe last thing to keep in mind when writing your own functions\
    \ is the idea of scope, which is actually relevant for almost all of programming.\
    \ Scope refers to the range in which a variable is defined. If a variable is defined\
    \ in part of a program, it's said to be \"in scope\"; if it's not defined in a\
    \ part of a program, it's said to be \"out of scope\".\n\nIn the way you've usually\
    \ thinking about programs so far, a variable is in scope as soon as it is declared,\
    \ and it stays that until the end of the program. You can't use it before you\
    \ declare it, and once it's declared, it can be used in the rest of the program.\n\
    \nBut that's not actually the case. In reality, scope works the way out: A variable\
    \ is in scope only within its own section (denoted by curly braces) of the program.\n\
    \nIn Program 12_ERROR_1, notice the variable a is declared inside the main body\
    \ of the main function, so it is scope throughout main. But by declaring a variable\
    \ b, the body of a loop is in scope only within that body of the loop. Each loop\
    \ generates a new variable, because the previous one's scope ends as soon as it\
    \ reaches the end of the loop. So, when you try to print b outside the loop, you'll\
    \ get a compiler error that tells you the variable is out of scope.\n\nNotice\
    \ that the variables that are defined in the main routine are not inside inside\
    \ the black box of another function you might create. For example, Program 12_ERROR_2\
    \ will give an error when compiling. The variable a is defined in the main function,\
    \ so a is in scope. But when you try to use a variable inside another function,\
    \ it will be out of scope (7).\n\n```\n// Program 12_ERROR_1\n// Scope Error:\
    \ b is only defined inside the\\while loop\n#include<iostream>\nusing namespace\
    \ std;\nint main() {\n    int a = 3;\n    while (a > 0) {\n        int b = 10;\n\
    \        a -= b;\n    }\n    cout << b << endl;\n}\n```\n\n```\n// Program 12_ERROR_2\n\
    // Scope Error: a is only defined inside another main\n#include<iostream>\nusing\
    \ namespace std;\nvoid demo_func() {\n    cout << a << endl;\n    return;\n}\n\
    int main() {\n    int a = 3;\n    demo_func();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 144
  md: "One of the nice things scoping is that you can reuse variable names in places\
    \ without causing conflicts.\n\nIn Program 12_10, notice that you have the variable\
    \ balance declared in the main function that is used to refer to an account balance\
    \ (13). You also have another named balance declared in the function calculate_loan(7),\
    \ this time referring to a remaining loan balance.\n\nWhat happens here is that\
    \ there are two sections of memory: the main function's section of memory and\
    \ a section of memory for calculate_loan, each of which has a named balance. When\
    \ you are in the main routine, anytime will refer to its variable balance, and\
    \ when you're in calculate_loan, you'd be referring to its variable balance.\n\
    \nSo, the output that the main routine always shows that the value of balance\
    \ is 75, both before and after the function call. Meanwhile, the output statement\
    \ in calculate_loan shows that the value of balance is 475.\n\n```\n// Program\
    \ 12_10\n// Same variable names in different scopes\n#include<iostream>\nusing\
    \ namespace std;\nfloat calculate_loan(float principal, float payment) {\n   \
    \ float balance = principal - payment; // Remaining balance of loan after payment\n\
    \    cout << \"Inside the function, the value of the loan balance is: \" << balance\
    \ << endl;\n    return balance;\n}\n\nint main() {\n    float balance = 100.0;\
    \ // Set up a variable to keep track of account balance\n    float loan_principal\
    \ = 500.0;\n    float loan_payment = 25.0;\n    Now use that to pay a loan\n \
    \   balance = loan_payment;\n    cout << \"Before the function call, the value\
    \ of the account balance is: \" << balance << endl;\n    loan_principal = calculate_loan(loan_principal,\
    \ loan_payment);\n    cout << \"After the function call, the value of the account\
    \ balance is: \" << balance << endl;\n}\n```"
