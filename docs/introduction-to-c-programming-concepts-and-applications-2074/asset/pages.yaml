- pgno: 168
  md: 'Using exceptions can help make your code much more robust; that is, your code
    is able to deal with a wider range of exceptional circumstances cleanly. Exactly
    how you deal with those circumstances can vary from case to case.


    +   » You could just close the program, maybe after printing some error messages.

    » You could prompt the user for another input, if the source of the problem was
    user error.

    » You could set a default value that gets used if a given value is invalid. ◆


    Rather than just **exception**, there are specific exception types named **logic_error**,
    **runtime_error**, **range_error**, and so on. You can have separate **catch**
    blocks for each of the different types of exceptions. To do that, you just define
    the parameter in the parentheses after **catch** as having the more specific type
    of exception, rather than just the general **exception**.


