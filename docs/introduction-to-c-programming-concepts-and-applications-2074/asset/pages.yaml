- pgno: 249
  md: 'Let’s look at another class, the gamemove class, which will be an abstract
    class. A move is associated with a player, so your gamemove class will have a
    member variable, player. You’ll make it a protected variable, so all classes that
    inherit from it will have access to this variable. It’ll also have a pure virtual
    function, ask_move, that will ask the player for a move. It’ll take in one integer
    parameter: the player whose turn it is to move. Because this is a virtual function,
    the UML convention is to write it in italics.


    You also have your 2 derived classes, connect4_move and reversi_move. These inherit
    from the gamemove class. Inheritance is designated by using arrows with an unfilled
    triangular arrowhead.


    Each specific move is a little different. A connect4_move will need to store a
    column—the column that a piece will be dropped into. A reversi_move will need
    to store both a row and a column.


    Each of the derived classes will also need to provide a concrete implementation
    of the ask_move function. Plus, you’ll need accessor functions for a move—functions
    to set a move or that will let some other class find out what the position of
    the move is and which player made it. You’ll use r for row, c for column, and
    p for player to provide this information.


    Likewise, you need to define the classes for the gameboard, as well as its derived
    classes, connect4_board and reversi_board. The gameboard will be an abstract class,
    and it needs to have a few public functions that will be pure virtual functions.
    It should be able to print a gameboard, so you’ll declare a print_board function.
    It should be able to check a board for a winner, returning an integer indicating
    who won or if it’s a tie. And it should be able to make a move if it receives
    a move of the appropriate type. All of these functions will vary depending on
    the particular game, so the abstract gameboard class can’t implement any of them.


    In the connect4_board class, you’ll need concrete implementations of each of


    the virtual functions that were declared in the gameboard class. You’ll also need
    to store information about the board itself. You’ll want to store the number of
    rows and columns in a gameboard, because it can potentially vary. You’ll use a
    vector of vectors to store the information at each point on the board.


    Finally, you’ll also have a few constructors: one for the default-size Connect
    4 board and one for a board where you specify the number of rows and columns specifically.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_249_0.png)


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_249_1.png)'
