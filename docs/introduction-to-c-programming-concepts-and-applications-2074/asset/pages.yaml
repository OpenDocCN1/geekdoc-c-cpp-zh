  md: 'A stringstream can also be initialized with a constructor, similar to how you
    initialize a file. In this case, you declare the stringstream, named **wordreader**,
    you just add parentheses with the string that you initialize inside the parentheses.


    You can also stream output to a string. You just declare a string variable and
    then use, like you could use **cout** to stream to the console, you can stream
    output to that variable.


    Inside the stringstream variable will be a string, which will get whatever text
    you stream into it.


    To actually get to that string, you again use the **str** command, but this time
    with no arguments. You just write `.str()`.


    As you did for files, you can also use the end-of-file function on a stringstream.


    When you''ve read the last character in the string, then **eof** will be true.
    Notice that it''s a little different than files, where you had to actually read
    the end of the file before **eof** would return **true**. But **eof** can still
    be used to go through all of a stringstream when you''re processing it.


    For simple programs, you could have created a string some way—by concatenating
    strings. But you''d have to manually convert your data to strings and use concatenation,
    rather than getting to use the stream operators, which handle a variety of types
    automatically. ◆


    # Exercise 4


    # Write a program that


    +   - first asks a user to enter a bunch of integers on one line, separated by
    spaces;

    - then reads that whole line into a string; and

    - then pulls each number from that string separately, outputting them one by one.


    Remember to use **eof** to find when you''ve reached the end of the stringstream.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_119_0.png)


    # READINGS


    a Stroustrup, *Programming Principles and Practice Using C++*, chap. 10 and sections
    11.3 and 11.4.


    b Lippman, Lajoie, and Moo, *C++ Primer*, chap. 8.


    By processing from a string, you can avoid the need to have sentinel values. There''s
    no need to make a user enter an artificial value to end input; the user just ends
    the line when he or she is done typing.'
