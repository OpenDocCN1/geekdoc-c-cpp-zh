- pgno: 139
  md: '# // THE FUNCTION BODY


    The body of the function is the set of instructions that you want to follow when
    the function is called. When you see a function call, you can think of it almost
    as if the commands in the body of the function definition are being stuck into
    the code right.


    Within the body of the function, you can declare variables, just like you would
    in the main program. And you can use this variable just like you would a variable
    in the main program.


    +   1 // Program 12_1

    2 // Demonstrating a function body

    3 #include<iostream>

    4 using namespace std;

    5 void print_help()


    Suppose you''re going to write a tic-tac-toe program and one thing you want to
    be able to print help for someone who doesn''t know the rules.


    Each of the parameters also becomes a variable of the function''s memory. The
    name in the function is the name that used for the parameter, and the variable
    is initialized with whatever value was given as an argument.


    In this case, you can define a function called print_help to print information.
    The function doesn''t need any parameters, and it doesn''t need to return anything.
    So, the function header will be void print_help(6).


    To return a value from a function, the command is return and then the value being
    returned.


    As soon as the function encounters the statement return, the function ends, and
    returns that value to the main program.


    Then, you can define the body of the function. Inside of the braces, you will
    have a set of cout statements to output the help information (f). You could put
    all them in one cout, or in even more cout statements, if you wanted to.


    The return command will run as soon as it''s encountered. So, if you have multiple
    lines of code and encounter a return statement before you''ve executed all of
    them, then you just miss some lines.


    Then, in the main program, you can make a call to the function by just writing
    print_help(18). When this happens, the text you had in the cout is printed.


    Also, if a function has a return type, then you just write return—no need for
    a value to be returned.


    Or you can just leave the return statement if the return type is void; the function
    automatically returns at the end.


    ```

    int main() {

    print_help();

    }

    ```


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_139_0.png)'
