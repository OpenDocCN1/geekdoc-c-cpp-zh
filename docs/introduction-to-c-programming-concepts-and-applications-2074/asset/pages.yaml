- pgno: 248
  md: 'In UML, you’ll write – board : gameboard* in the box designated for variables.
    The – notes that it’s a private member variable. The board is the name of the
    variable, and the gameboard* shows that the variable is going to be a pointer
    to a gameboard.


    Likewise, you’ll need to be able to take moves in the game. Like gameboard, a
    gamemove is going to be an abstract class. So, you will have a gamemove*, a pointer
    that is named turn for keeping track of moves.


    You’ll also need to keep track of which player moves next. So, you’ll have a private
    member variable named playerturn that’s an integer. Perhaps you also want to keep
    track of how many turns have occurred in the game. A more complex game class might
    keep other information.


    Notice that for each UML entry, you’ll have a corresponding line of code. The
    UML is not code itself, though, and the order of terms is different. For example:


    – board : gameboard* in UML becomes gameboard* board; in code


    – turn : gamemove* in UML becomes gamemove* turn; in code


    In UML, you were starting with what’s obvious for humans: board, turn, playerturn,
    numturn, etc. But in C++, you are starting with the type—the information that’s
    more important for computers.


    You also need to consider what functions a game class needs to provide.


    You can use your UML diagram to organize this. The functions you want the class
    to provide will go in the last box. For each of them, you’ll think about the function,
    what name you want it to have, and then what parameter types it takes in and returns.
    Finally, you’ll consider whether you want the function to be public, private,
    or protected.


    You’ll need a constructor, and it will take in 2 parameters: one for the gameboard
    and one for the gamemove. And constructors need to be public. So, in your UML
    diagram, you’ll write +, indicating that it’s public; then game, because it’s
    a constructor; and then 2 parameters in the parentheses: board, which is of type
    gameboard, and turn, which is of type gamemmove.


    The function to check for a winner won’t take any parameters, and it’ll return
    an integer, giving an indication of which player, if either, won. This is a function
    that you want to call from the game class itself, rather than from outside the
    class, so you’ll make it a protected function. Using UML notation, you’d write
    # check_winner () : int.


    You will likely also want other functions—for taking a turn or declaring a winner—that
    will also be protected. These would all be functions that take no parameters and
    don’t return anything, so you’d write # take_turn () and # declare_winner ().


    Finally, you’ll want a public function that actually starts the game and keeps
    it going until the game’s over. You’ll call that start_game and thus write + start_game
    () for it.


    Game

    - board : gameboard*

    - turn : gamemove*

    - playerturn : int

    - numturns : int

    + game(board : gameboard, turn : gamemove)

    # check_winner () : int

    # take_turn ()

    # declare_winner ()

    + start_game ()'
