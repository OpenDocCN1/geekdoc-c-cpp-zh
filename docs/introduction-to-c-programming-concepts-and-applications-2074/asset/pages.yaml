- pgno: 282
  md: 'see what it would look like if that move was made), and then determine how
    good or bad of a state that move puts you in.


    The idea here is that you want to think ahead as many moves as possible. You could
    generate all those possible moves at once, but that becomes really excessive in
    terms of memory you’d need. Instead, you’ll treat the board as one of 2 cases:
    Either you don’t want to look ahead any more moves and just want to see how good
    the current board position is, or you want to generate possible moves and choose
    what’s best among them.


    In the event that you’re willing to look forward a little more, then you need
    to start this whole process again but from the opponent’s point of view; that
    is, you want to go through this same algorithm but now starting from the opponent’s
    moves.


    This brings up the idea of recursion, which can be thought of as a function calling
    itself or an algorithm using itself to solve a problem. And that’s what you’re
    going to do here. You’re going to determine the best move by making a move and
    then determining the best move.


    Recursion needs to have a stopping point or it could go on forever, taking up
    too much time or computer memory. The ending condition you’ll use here is to keep
    track of how many levels of recursion you’ve had; that is, you


    want to think about how many moves ahead you want the computer to consider. So,
    you’re going to take a new input: the level of recursion you’re at. Every time
    you make a recursive call—that is, every time you consider the best move—you’ll
    do so for one more level of recursion than you were at previously. And if you
    reach your maximum, then you’ll stop making recursive calls. Once you’ve reached
    the maximum level of recursion, you want to just evaluate a board to get a score.


    When you are going to evaluate several different moves via recursion, it’s not
    enough to just know which move is the next one to take—you also want to know how
    good or not that move is. So, you’ll want to return not just the best move, but
    also the score for that move; in other words, your return information has increased.
    You use this score that you get from the recursive call to rank the moves and
    determine which one is best.


    Evaluating a board to get a score—that is, to determine whether player 1 or player
    2 is winning and by how much—can be a tricky problem that requires an algorithm
    of its own. What follows is a very simple algorithm, but it still turns out to
    perform OK!


    In Connect 4, players take alternate turns, and no player develops an advantage
    in number of pieces.


    Here’s your board evaluation:


    +   » If the game is tied, then the value should be 0.

    » If player 1 seems to be winning, then you’ll give a negative score—the more
    negative, the more that player 1 is winning.

    » If player 2 seems to be winning, you’ll give a positive score: The larger the
    score is, the more player 2 has an advantage.

    » If one player or the other actually wins, you should have a really negative
    or really positive score.


    The input to this algorithm is just the current board state. The output of the
    algorithm will be a score for that board state. If the board indicates that player
    1 has won—that is, if player 1 gets 4 of his or her pieces in a row, called a
    connect 4—then you return a very small number, like −1000. If the board indicates
    that player 2 has won, then you return a very large number, like 1000. If you
    know that the game has ended in a tie, then you evaluate the board as a 0.


    In your winner-or-loser evaluation function, if you don’t have a winning board,
    then you’ll just give a random value to the board. Let’s say that’s between a
    range of −5 to 5. This is basically just saying "make a random move." Notice that
    this is still an algorithm, but the only information it’s using from the board
    is whether or not the game is over. But it’s actually enough for your program
    to work.'
