  md: '# # 10 Files and Stream Operators in C++


    Data is stored in files, which are located and saved in a long-term storage area,
    such as on a hard drive or solid-state drive, in flash memory, or even over a
    network in the cloud. Files contain data that you want to either read in to your
    program or write from your program. Streaming is a very general and flexible way
    to handle a wide variety of input and output.


    +   IN THIS LECTURE:

    * File Streaming

    * Program 10_4

    * Program 10_5

    * String Streaming

    * Program 10_8

    * Quiz

    * Quiz Answers


    > If you''ve been using only a browser-based C++ editor to run programs so far,
    now is the time to download an integrated development environment (IDE). For more
    details, see the C++ QUICK START or consult the supplementary material available
    online.


    # // FILE STREAMING


    Whenever a program is reading or writing to a file, it always involves 3 steps:


    +   1 Opening the file.

    2 Reading from or writing to a file.

    3 Closing the file.


    You''re going to need to use a library called `fstream` (which is short for *streaming*)
    that gives you the tools to write to a file.


    Like you were able to use `stream` console input and output `iostream`, now you''ll
    stream and from files using `fstream`.


    Once you have the `fstream` library, you can create objects of the type `fstream`.


    An `object` can be thought of being like a variable, and you basically use the
    words `object` and `variable` interchangeably. You use terminology to "declare
    an object" or "initialize an object" just like you do for variables, such as integers.


    But using the term `object` actually implies a little more than you''ve learned
    about variables, because an object can store more than one piece of data and has
    functions that "belong" to it.


    Lecture 10 | Files and Stream Operators in C++'
