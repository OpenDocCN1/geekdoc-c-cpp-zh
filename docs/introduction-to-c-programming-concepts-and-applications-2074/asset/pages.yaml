  md: "# # Top-Down Design\nUsing a C++ Debugger\n\nBy this point in the course, you've\
    \ accumulated a lot of tools—a lot of individual ways to code various things.\
    \ But there's a difference between knowing how to use the individual programming\
    \ tools and knowing how to bring them together to create something larger. Some\
    \ useful methods for approaching bigger software programs are top-down design,\
    \ incremental development, and the debugger tool provided in your integrated development\
    \ environment (IDE).\n\nIN THIS LECTURE:\n\n+   - Top-Down Design\n  Program Fragment\
    \ 11_c\n- Incremental Development\n  Program Fragment 11_d\n  Program Fragment\
    \ 11_e\n- Debugger Tool\n  Quiz\n- Quiz Answers\n\n# // TOP-DOWN DESIGN\n\nThe\
    \ basic idea of top-down design is that you take a big task and break it into\
    \ a sequence of smaller tasks, and then you take that and break it into a sequence\
    \ of even smaller tasks, and so on.\n\nThe question programmers face when performing\
    \ top-down design is exactly how to break up the task.\n\n![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_124_0.png)\n\
    \nA pitfall for many beginners approaching a software program is jumping right\
    \ into writing individual lines of code—the smallest unit of code there is. Instead,\
    \ you need to consider the programming task as a whole and try to break it into\
    \ conceptually simpler parts. Eventually, you go down into individual lines of\
    \ code. But at first, you don't need to think about the details—just the overall\
    \ steps to follow.\n\nIn computer science, this hierarchical structure as a whole\
    \ is called a tree. The individual elements in the tree are called nodes. The\
    \ single node at the top of the tree is the root. If 2 nodes are connected, the\
    \ one closer to the root is called parent, and the ones farther away are child.\
    \ Every except the root has exactly one parent, but can have several. For a parent,\
    \ the children, as well as all of their children are branches. Nodes that don't\
    \ have children are leaf nodes.\n\nThe number of levels in the tree are referred\
    \ to the depth of the tree, and the average number of children in a non-leaf node\
    \ is called the branching factor.\n\nLecture 11 | Top-Down Design and Using a\
    \ C++ Debugger"
  merge: -1
  img_proc: true
- pgno: 125
  md: 'As you think of the design process—that is, how you decompose into a hierarchy—you’re
    often concerned with 2 questions: how do you want the tree to be and what branching
    ratio you


    Imagine you have been asked to create a program to predict electricity usage at
    someone''s house. You have files available as well as weather data and information
    about the person''s schedule, and you want to get a sense of what to expect regarding
    energy demand.


    Next, you break down each of these items. Reading the electricity usage will depend
    on how it''s stored, but suppose the data is stored in series of lines, each with
    a date and an electric meter reading. The basic process that you''ll want to open
    the file, read each line, and then store the data in parallel vectors: for the
    date and one for the meter reading.


    There isn''t a single answer to this question; instead, there are 2 rules of thumb:


    +   The branching ratio (the number of children per node) should not be so high
    that you cannot understand all the children of one node. In other words, one task
    should be broken up into a few subparts so that it''s easy to understand how the
    larger task is broken into smaller ones.


    +   The depth (number of levels in the tree) should be deep enough that the leaf
    nodes are obvious—meaning that a particular task should be something an experienced
    programmer could implement without having to understand the other parts of the
    program. Typically, this is just a few lines of code.


    Let''s use a top-down approach to attack this problem.


    First, think of the major steps that you''ll want to go through. You''ll want
    to read in information from the data files you have; get exactly what you want
    to predict, such as the range of dates; do your calculation to actually make the
    prediction; and output some results.


    You keep going until you reach a level that should be straightforward to code;
    each of your tasks should correspond to one or a few lines of code.


    You can continue to walk through the entire program at this level of detail for
    each part.


    Notice that any one step is simpler—that''s the point! For any one idea, breaking
    it down into simpler ideas shouldn''t be too difficult. Then, you can turn to
    each of those subtasks that you identified and expand them.


    For the first subtask, reading the data, you have information about electricity
    usage, past weather data, and past schedule, so you''ll want to read in the data
    from each of those files.


    | Predict Electricity Usage | | | |

    | :--- | :--- | :--- | :--- |

    | Read past data | Get detail to predict | Calculate predicted usage | Present
    prediction |

    | Read past electricity usage | Read past weather | Read past individual schedule
    |

    | Open file | Loop through all lines (one date) | Store data, electric meter reading
    in parallel vectors |


    In software development, there''s always more than one way to write a program.
    And while some ways of solving a programming problem are better or worse than
    others, there''s rarely any one way that is truly ideal in every regard.'
