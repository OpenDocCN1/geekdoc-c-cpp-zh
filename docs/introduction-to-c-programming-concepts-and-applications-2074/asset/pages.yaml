- pgno: 151
  md: "```\n// Program 12_3\n// Multiple parameter types\n#include <iostream>\nusing\
    \ namespace std;\n\nfloat average(float a, float b) {\n    return (a + b) / 2.0;\n\
    }\n\nint average(int a, int b) {\n    return (a + b) / 2;\n}\n\nint main() {\n\
    \    cout << \"The average of 10 and 35: \" << average(10, 35) << endl;\n}\n```\n\
    \nIn this variation, you have the original average function that takes 2 floats\
    \ (c). You also create another version that takes 2 integers. It returns an integer\
    \ instead of a float. In this case, you'll call integer division in the interior;\
    \ because the parameters are integers and you divide by 2, not 2.0, you'll have\
    \ an integer division (d).\n\nIf you call the function with 2 integers, the compiler\
    \ will match it with the function signature that has 2 integers. Because it is\
    \ an exact match, that is the function will use it. There won't be any ambiguity\
    \ because there's nothing left to be converted. So, in this case, with 2 integers,\
    \ 10 and 35, gives an integer result, rather than the floating-point result 22.5.\n\
    \n# VARIABLE TYPES IN C++\n\n![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_151_0.png)\n\
    \nFor a computer, each variable is a way to interpret bits in memory—a group of\
    \ 1s and 0s that get interpreted to mean an integer or a floating-point number,\
    \ for example. Each variable has some size of memory that it is taking.\n\n+ \
    \  INTEGERS\nchar\nshort int\nint\nlong int\nlong long int\n\nIn C++, you can\
    \ specify, to a degree, how many bits are used to represent numbers. The more\
    \ bits are used, the larger the number that can be represented. For integers,\
    \ that means that you can represent larger integers. For floating-point numbers,\
    \ that means that you can use more digits of precision and can represent both\
    \ larger and smaller numbers.\n\nFor integers, you have several options, ranging\
    \ from a char (a single character) all the way up to a long int. The exact sizes\
    \ of integers aren't specified, but you do know that a long int has at least many\
    \ as a long int, which has at least many as an int, and so on. Choosing larger\
    \ integers lets you represent larger numbers, but at the cost of more memory to\
    \ store values.\n\n+   FLOATS\nfloat\ndouble\nlong double\n\nSimilarly, floats\
    \ have a longer version, the double, and an even longer version, the long double."
  merge: -1
