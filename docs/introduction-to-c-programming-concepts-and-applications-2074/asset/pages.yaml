  md: '# CODING YOUR DESIGN


    With your design finished, you now want to start coding everything.


    A good place to begin is the implementation of your game class, because it''s
    the most fundamental of the classes.


    Start by comparing the class design that you come up in UML with what those steps
    look like in code. The member variables would be declared as a gameboard pointer,
    board; a gamove pointer, turn; an integer, playerturn; and an integer, numturms.


    ```

    private:

    gameboard* board;

    gamove* turn;

    int playerturn;

    int numturms;

    ```


    The next thing in your design were the member functions of the class, with your
    constructor, which is going to take input as gameboard and a gamove. These 2 classes
    are abstract and do not have a specific value, so they have to be passed by reference.
    You use gameboard b to get a reference to the gameboard and gamove m to get a
    reference to the gamove. Inside the constructor, you just get a reference to the
    gameboard—in other member variable. You do the same for the gameboard, assigning
    it to the turn member variable.


    ```

    game(gameboard& b, gamove& m) {

    board = &b;

    turn = &m;

    }

    ```


    > The full code is several hundred lines, so only some key parts of the program
    are highlighted here.


    > The full program is available for download at www.TheGreatCourses.com/CPlusPlus.


    The next function in your design was a check_winner function, which was protected.
    You''re implementing check_winner within the gameboard class, because the gameboard
    itself determines who the winner is. So, your code just call check_winner function
    in the gameboard you have stored.


    ```

    int check_winner() {

    return board->check_winner();

    }

    ```


    Your next routine to look at is the take_turn routine, which should take a turn
    in the game. This means that you want to have the gameboard printed out to the
    screen, so you call the print_board member function of your board. You want to
    get the move that the next player wants. layerturn, that should say whose turn
    it is, so you pass this as an argument to the ask_move function of your turn member
    variable. That will call ask_move in whatever gamove the turn is pointing to.
    Finally, you''ll need to update the board based on that, so you call_turn on the
    board, passing in the move you just got to the gameboard.


    ```

    void take_turn() {

    board->print_board();

    turn->ask_move(playturn);

    board->take_turn();

    }

    ```'
