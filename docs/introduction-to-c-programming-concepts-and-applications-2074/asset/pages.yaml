- pgno: 76
  md: "Now that you're able to generate random integers, let's say that we want to\
    \ limit your integers between 1 and 100. One way to do that is to use the modulus\
    \ operator (%), which gives you the remainder after dividing. If you take a modulus\
    \ 100, then you get the remainder, which will be something between 0 and 99. If\
    \ you had random numbers to begin with, then you'll have random remainders.\n\n\
    Program 6_13 is a modification of the previous code that will generate random\
    \ numbers in the 1 to 100 range. If you run this several times, you'll see that\
    \ you get random numbers, all in the range of 1 to 100.\n\n```\n // Program 6_11\n\
    \ // Random Number generation within range 0-99\n#include <iostream>\n#include\
    \ <cstdlib>\n#include <ctime>\nusing namespace std;\n\nint main() {\n s srand(time(0));\
    \ // Set the seed for the pseudorandom sequence\n int x = rand() % 100; // Modulus\
    \ 100 means between 0 and 99\n cout << \"The random number is \" << x << endl;\n\
    }\n```\n\n```\n // Program 6_13\n // Multiple random numbers in range of 1 to\
    \ 100\n#include <iostream>\n#include <cstdlib>\n#include <ctime>\nusing namespace\
    \ std;\n\nint main() {\n srand(time(0)); // Set the seed for the pseudorandom\
    \ sequence\n int x = rand() % 100 + 1;\n cout << \"The random number is \" <<\
    \ x << endl;\n cout << \"Here is another random number: \" << (rand() % 100) +\
    \ 1 << endl;\n cout << \"... and another: \" << (rand() % 100) + 1 << endl;\n\
    }\n```\n\nIf you want a random number to be from 1 to 100 instead of O to 99,\
    \ just add 1 onto the modulus.\n\n```\nint x = rand() % 100 + 1; // Adding 1 to\
    \ change [0-99] to [1-100]\n```"
