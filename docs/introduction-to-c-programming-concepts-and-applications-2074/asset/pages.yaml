  md: "# // A GAME OF 20 QUESTIONS\n\nLet's create a 20 Questions type of game, in\
    \ which you ask someone up to 20 true/false questions to guess what he or she\
    \ is, which might be you use to write it?, update the tree.\n\nIf the false_answer\
    \ pointer and the true_answer pointer will be set to NULL. This is an answer node,\
    \ so there are no children and therefore no pointing to.\n\nOne way to do this\
    \ is to generate a binary tree, where every node has at 2 children. Each of the\
    \ leaves in your game tree will be a guess--the thing you are thinking of.\n\n\
    You'll have a class named node, because each object you create will be one of\
    \ the nodes. The node is going to have 4 member variables (a).\n\nThe second constructor\
    \ (c) will take a string as a parameter. It'll again create an answer node such\
    \ that is_answer is true and both pointers are NULL.\n\nIf your program guesses\
    \ incorrectly, and loses them, the program will ask the player to volunteer a\
    \ question that teaches how to distinguish its guess from the person's item. That\
    \ will let your game \"learn\" so it can play better next time. You'll create\
    \ a new question node--which you'll allocate on the heap--and another new node\
    \ for the new guess. In other words, the previous guess will be one child and\
    \ the new node will be the other child of the question.\n\nThe first of these\
    \ is a Boolean, which will be true if the node is an answer node and if it's a\
    \ question node.\n\nNext, you'll have a named text. For an answer node, this will\
    \ be the thing you are going to. For a question node, it will be the question\
    \ to distinguish between the 2 items.\n\n```\n// Program_18\n// 20 Questions Game\n\
    #include <iostream>\n#include <string>\nusing namespace std;\n\nclass node {\n\
    \  bool is_answer; // True if\n  \"answer\" node, False if a\n  \"question\" node\n\
    \  string text; // The answer\n  answer node, otherwise\n};\n```\n\nFinally, you'll\
    \ have 2 pointers to nodes: a pointer to the false_answer and a pointer to the\
    \ true_answer. For a question node, one of these will be a pointer to the node\
    \ that should go to the answer to the question is Yes, and the other will be the\
    \ one to go to if the answer is No.\n\n```\nnode(string s) {\n  is_answer = true;\n\
    \  text = \"rock\";\n  false_answer = NULL;\n  true_answer = NULL;\n}\n```\n\n\
    During a game, the first thing might ask is it alive? If the answer is No, then\
    \ it can hold you in your hand? If the answer is Yes, the program might us: is\
    \ it a rock?\n\nYou'll create two constructors. The default constructor (b) will\
    \ create an answer node with the text value to rock. So, it'll set is_answer to\
    \ true and text to rock."
