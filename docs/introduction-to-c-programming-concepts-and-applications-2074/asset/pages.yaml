  md: "This initialize-compare-increment pattern is so common that it has its own\
    \ form of loop: the **for**. **Program 5_12** and **Program 5_13** have exactly\
    \ the same effect.\n\nNotice that you have taken the 3 parts from the **while**\
    \ loop structure—initialization of the variable, the condition, and the variable\
    \ update—and put them into the beginning of the **for** loop.\n\nNotice also that\
    \ you start your loop with the word **for** instead of **while**. The **for**\
    \ loop basically packs up several parts that would otherwise be spread across\
    \ a **while** loop.\n\nThe **for** loop always begins with the keyword **for**\
    \ and then, like the **while** loop, has parentheses and curly braces, guarding\
    \ the body of the loop. The difference is what it's patterns. Instead of just\
    \ a condition, like the **while** loop has, you actually have 3 different parts\
    \ separated by semicolons;\n\n+   - The initialization, which would come before\
    \ the loop in the **while** loop formulation, is where you set the initial value\
    \ for the variable you are using in the loop.\n- The condition works just like\
    \ the condition in the **while** statement.\n- The update occurs at the end of\
    \ each iteration of the loop.\n\n```\n// Program 5_13\n// For loop for computing\
    \ balance for set number of payments\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    float balance = 1000.0;\n    float payment = 100.0;\n    float\
    \ interest = 0.05;\n    int numpayments;\n    for (numpayments = 0; numpayments\
    \ < 5; numpayments++) {\n        cout << \"Balance after \" << numpayments <<\
    \ \" payments is: \" << balance << endl;\n        balance += balance * interest;\n\
    \        balance -= payment;\n    }\n}\n```\n\n# While loop\n\n```\nwhile (condition)\
    \ {\n    // Commands to do each iteration of loop\n    // (This is the body of\
    \ the loop)\n    // update\n}\n```\n\nSo, when you have a **for** statement, first\
    \ execute the initialization command, then check the condition on each iteration\
    \ of the loop, and finally run the update command at the end of each iteration\
    \ of the loop.\n\n# For loop\n\n```\nfor (initialization; condition; update) {\n\
    \    // Commands to do each iteration of loop\n    // (This is the body of the\
    \ loop)\n}\n```"
