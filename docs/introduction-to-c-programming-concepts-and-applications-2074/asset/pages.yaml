  md: "# 04 Program Design and Writing Test Cases in C++\n\n+   IN LECTURE:\n- The\
    \ Structure of a C++ Program\n- Program 4_1\n- Program 4_2\n- Designing and Testing\
    \ Your Program\n- Program 4_6_1\n- Program 4_6_9\n- Quiz\n- Quiz Answers\n\nAlthough\
    \ code writing is very important, there's more to making a program just writing\
    \ code. Considerations like design and testing are just as important.\n\n# //\
    \ THE STRUCTURE OF A C++ PROGRAM\n\nIt's often helpful to start a program with\
    \ some header comment—what might make give some information about the purpose\
    \ of the program (1, 2).\n\nThe **include** is by far the most commonly used,\
    \ but there are a few other preprocessor commands, all starting with #:\n\n+ \
    \  - `#include` statements can bring in new lines of code.\n- `#define` statements\
    \ can modify code.\n- `#ifdef` statements (short for if) can choose lines of code.\n\
    \nThe next line is pound-include **#include** line (3). The pound sign (#) is\
    \ used to designate special commands that are given to the **compiler**, which\
    \ is what will translate your program into machine instructions.\n\n```\n// Program\
    \ 4_1\n// Hello, World! program\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    cout << \"Hello, World!\" << endl;\n}\n```\n\nWhen a compiler\
    \ looks at a program that it needs to process, it first identifies any lines that\
    \ have #. These lines are processed as special instructions to the compiler; these\
    \ are called **preprocess commands**, because they take place before processing\
    \ the rest of the code.\n\nThe **include** is a way of saying, \"There is no other\
    \ file that contains any additional functions. Bringing file into this file gives\
    \ you access to any functions in that file.\n\nFor example, **#include <iostream>**\
    \ gets you access to input and output functionality, like **cin** and **cout**.\n\
    \nThe **includes** that you usually begin your program with import files to give\
    \ you additional functionality. These files are used from the C++ standard libraries,\
    \ which are installed with C++ and therefore are available whenever you need them.\n\
    \nLecture 04 | Program Design and Writing Test Cases in C++"
