- pgno: 129
  md: '# // DEBUGGER TOOL


    An IDE makes it easy to access and use the debugger tool. There are other debuggers,
    by far the easiest to use those included within an IDE. One in Visual Studio is
    used here.


    As you work to develop larger programs, having the use of an IDE can be critical
    to helping examine the state of the program as it progresses, making sure that
    the program is working as intended.


    Unfortunately, a debugger is not a tool that takes the bugs out of your program.
    In fact, a debugger that lets you step through a program''s instructions one at
    a time and examine the state of everything in the program at that point.


    A breakpoint is a point in the code where you want to stop the execution, so that
    you can examine the code more closely. When you run a program in the debugger,
    it''ll just like expect until you hit a breakpoint. The execution will pause just
    before the line where the breakpoint is. a "break", not a line that gets executed.
    If you don''t have a breakpoint set, the code will just run all the way through.
    That''s what you''ve seen until now.


    In Visual Studio, to set a breakpoint, you click on the area farthest to the left
    for the line where you want to set.


    If you set a breakpoint at the first count statement, this puts a red circle at
    that line.(In Xcode, you just click on the vertical area of line code and a blue
    marker appears to show the breakpoint).


    Debuggers have many tools within them that can help developers examine their code
    closely. But there just a few simple parts are enough to make a debugger really
    useful, and even if you need every feature of the debugger, these would still
    account for 90% of what you''ve ever done. These features are breakpoints, the
    Step Over and Step Into operations, and variable values.


    ![](img/bdf1aaea7e08f6cbf15b0a740771ecdc_129_0.png)


    In order to use a debugger, the code must be compiled in what''s called debugger
    mode, which adds some extra stuff in automatically that lets the debugger work.
    But this mode also makes the code less efficient than it will be when fully debugged
    and then compiled in more efficient release mode.


    Because most development is done in debug mode, that''s the default mode for compiling
    in both Visual Studio and Xcode.


    Lecture 11 | Top-Down Design and Using a C++ Debugger'
