  \ 2 = 20\n\n10 + 20 = 30\n\n按任意键继续 . . .\n\n这与表 13-1 中的预期结果相匹配。继续执行表中的测试用例，所有情况都匹配，直到我遇到\
  \ 10 / 0 的情况，此时我得到了图 13-2 所示的输出。`printErr()` 的输出显示输入被正确读取，但程序在第 68 行后不久崩溃了。\n\n\
  很明显，程序在执行除零操作时实际上在第 69 行崩溃。我需要添加一个测试来拦截这种情况，如果 `nOper2` 的值为零，则不执行除法。\n\n**图 13-2：**\
  \ 当我输入‘10 / 0’时，Calculator-Error 程序以一条神秘的错误信息终止。\n\n![617977-fg1302.tif](img/617977-fg1302_fmt.jpeg)\n\
  \n当然，这引出了问题：如果 `nOper2` 为 0，我应该从函数返回什么值？表 13-1 中的“预期结果”用例说，我们在除以零时并不关心返回的是什么。\n\n\
  \n\n\n并不是整数表达式不能产生小数值。只是 `int` 类型没有办法存储小数部分。处理器在存储结果之前，会丢弃小数点右侧的部分。（这种丢弃数字小数部分的行为被称为**截断**。）\n\
  \n考虑计算三个数字平均值的问题。给定三个 `int` 变量——`nValue1`、`nValue2` 和 `nValue3`——它们的平均由以下表达式给出：\n\
  \n```cpp\nint nAverage = (nValue1 + nValue2 + nValue3)/3;\n```\n\n假设 `nValue1` 等于\
  \ 1，`nValue2` 等于 2，`nValue3` 等于 2——该表达式的和为 5。这意味着平均值为 `5 /3`，或者是 `1 2/3` 或 `1.666`，取决于你的个人喜好。但这并没有使用整数算术。\n\
  \n由于三个变量都是整数，因此假设和也是整数。而且由于 `3` 也是一个整数，你猜得没错，整个表达式被视为整数。因此，在给定相同的 1、2 和 2 的值的情况下，C++\
  \ 计算出的 `nAverage` 的值是不合理但逻辑上正确的 `1`（3、4 和 5 除以 3 都是 1；6 除以 3 是 2）。\n\n在以下数学等价的公式中，问题变得糟糕得多：\n\
  \n```cpp\nint nAverage = nValue1/3 + nValue2/3 + nValue3/3;\n```\n\n代入相同的 1、2 和\
  \ 2 的值，`nAverage` 的结果现在是 0（这在逻辑上合理但不合理）。为了看到这是如何发生的，考虑 `1/2` 截断为 0，`2/3` 截断为 0，`2/3`\
  \ 截断为 0。0、0 和 0 的和是（惊讶吧！）0。\n\n你可以看到，有些时候整数截断是完全无法接受的。\n\n### 有限的范围\n\n`int` 变量类型的第二个问题是其范围有限。普通的\
  \ `int` 可以存储的最大值为 `2,147,483,647`，最小值为 `-2,147,483,648`——这大约是从正 20 亿到负 20 亿，总范围为\
  \ 40 亿。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 这是在现代 PC、Mac 或其他常见处理器上。如果你有一台老得多的机器，`int`\
  \ 的范围可能没有那么广。我将在本章稍后的部分对此进行详细说明。\n\n![remember.eps](img/remember_fmt.jpeg) 二十亿是一个很大的数字——对于大多数应用程序来说已经足够了。这就是为什么\
  \ `int` 很有用。但对于某些应用（包括计算机技术）来说它不够大。事实上，取决于你的电脑有多旧，你的电脑运行速度可能快于 2 GHz（吉赫，每秒十亿次）。单根光纤（那种横跨整个国家的线缆）每秒传输的比特远超\
  \ 20 亿。我甚至不想提到银河系中星星的数量。\n\n### 一种“兼”实数的类型\n\n`int` 变量的局限性在某些应用中是无法接受的。幸运的是，C++\
  \ 理解带有小数部分的数字。（数学家把这些称为实数。）在 C++ 中，小数被称为浮点数或简单称为 `floats`。这是因为小数点可以从左到右浮动以处理小数。\n\
  \n浮点变量在 C++ 中有两种基本类型。较小的一种使用关键字 `float` 如下：\n\n```cpp\nfloat fValue1; // 声明一个浮点数\n\
  float fValue2 = 1.5; // 在声明时初始化\n```\n\n奇怪的是，C++ 中的标准浮点变量是它较大的兄弟，双精度浮点数或简单称为 `double`。你如下所示声明双精度浮点数：\n\
  \n```cpp\ndouble dValue1;\ndouble dValue2 = 1.5;\n```\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 因为 C++ 的原生浮点类型是 `double`，我通常会避免使用 `float`。`float` 确实占用的内存较少，但对于大多数应用来说这不是问题。在本书的剩余部分我将坚持使用\
  \ `double`。此外，我说“浮点变量”时，你可以假设我指的是类型为 `double` 的变量。\n\n### 解决截断问题\n\n为了看到 `double`\
  \ 如何解决我们的截断问题，考虑三个浮点变量 `dValue1`、`dValue2` 和 `dValue3` 的平均值，公式如下：\n\n```cpp\ndouble\
  \ dAverage = dValue1/3.0 + dValue2/3.0 + dValue3/3.0;\n```\n\n再次假设初始值为 `1.0`、`2.0`\
  \ 和 `2.0`。这使得上面的表达式等价于\n\n```cpp\ndouble dAverage = 1.0/3.0 + 2.0/3.0 + 2.0/3.0;\n\
  ```\n\n它又等价于\n\n```cpp\ndouble dAverage = 0.333... + 0.666... + 0.666...;\n```\n\
  \n得到最终值为：\n\n```cpp\ndouble dAverage = 1.666...;\n```\n\n\n\n\n# 计算速度\n\n计算机执行整数运算的速度比执行浮点运算快。在历史上，这种差异是非常显著的。在\
  \ 20 世纪世纪 80 年代，一个没有浮点处理器辅助的 CPU 执行一次浮点除法的时间大约是执行一次整数除法的 1,000 倍。\n\n幸运的是，浮点处理器多年来已经集成到\
  \ CPU 中了，因此性能差异已经没有以前那么显著了。我写了下面这个循环作为一个简单的示例，首先使用整数运算：\n\n```cpp\nint nValue1 =\
  \ 1, nValue2 = 2, nValue3 = 2;\n\nfor (int i = 0; i < 1000000000; i++)\n{\n    int\
  \ nAverage = (nValue1 + nValue2 + nValue3) / 3;\n}\n```\n\n这个循环在我的笔记本电脑上执行大约需要 5\
  \ 秒。然后，我用浮点数执行了相同的循环：\n\n```cpp\ndouble dValue1 = 1, dValue2 = 2, dValue3 = 2;\n\
  \nfor (int i = 0; i < 1000000000; i++)\n{\n    double dAverage = (dValue1 + dValue2\
  \ + dValue3) / 3.0;\n}\n```\n\n这个循环在同一台笔记本电脑上执行大约需要 21 秒。在 20 多秒内计算 10 亿次平均值并不糟糕，但它仍然比对应的整数运算慢了四倍。\n\
  \n# 消耗更多内存\n\n表 14-2 显示了每种类型的单个变量消耗的内存。在 PC 或 Macintosh 上，`int` 占用 4 字节，而 `double`\
  \ 占用 8 字节。这听起来并不多少，事实上也确实；但如果你有几百万个需要保留在内存中的这些东西……嗯，那仍然是一个巨大的数字。但如果你有几亿个，那么差异就会非常大。\n\
  \n这句话是另一种说法：除非你需要存储大量的对象，否则不要担心一种类型与另一种类型之间的内存占用差异。相反，请根据你的需求选择变量类型。\n\n如果你恰好正在编写一个需要同时处理地球上每个人年龄的应用程序，那么根据其消耗的内存量，你可能倾向于使用较小的\
  \ `int`（或在本章中讨论的其他整数类型之一）。\n\n# 精度损失\n\n`double` 变量具有大约 16 位有效数字的精度。考虑一下数学家会将数字\
  \ 1/3 表示为 0.333...，其中省略号表示 3 无限持续下去。无限级数的概念在数学中是有意义的，但在计算中不是。计算机只有有限的内存和有限的精度。\n\
  \nC++ 可以在很多情况下修正舍入误差。例如，在输出时，如果一个变量是 0.99999999999999，C++ 会直接假设它实际上是 1.0 并据此显示。然而，C++\
  \ 无法修正所有的浮点舍入误差，因此你需要格外小心。例如，你无法确定 1/3 + 1/3 + 1/3 等于 1.0：\n\n```cpp\ndouble d1\
  \ = 23.0;\ndouble d2 = d1 / 7.0;\n\nif (d1 == (d2 * 7.0))\n{\n    cout << “Did we\
  \ get here?” << endl;\n}\n```\n\n你可能会认为这段代码总是会显示“Did we get here?” 字符串，但令人惊讶的是，它并没有。问题是\
  \ 23 / 7 无法用浮点数精确表示。某些信息丢失了。因此，`d2 * 7` 非常接近 23，但并不完全相等。\n\n与其寻找两个浮点数之间的精确相等，不如你应该问：“`d2\
  \ * 7` 的值在数值上无限接近 `d1` 吗？”你可以这样做：\n\n```cpp\ndouble d1 = 23.0;\ndouble d2 = d1 /\
  \ 7.0;\n// d2 * 7.0 是否在 d1 的容差范围之内？\ndouble difference = (d2 * 7.0) - d1;\ndouble\
  \ delta = 0.00001;\n\nif (difference < delta && difference > -delta)\n{\n    cout\
  \ << “Did we get here?” << endl;\n}\n```\n\n这段代码段计算了 `d1` 和 `d2 * 7.0` 之间的差。如果这个差小于某个很小的\
  \ `delta`，代码就会结束并认为 `d1` 和 `d2 * 7` 本质上是相等的。\n\n# 范围并不\n\n`double` 能存储的最大数字大约是 10\
  \ 的 38 次方。那是 1 后面跟着 38 个零；这完全可以把 `int` 那微小的 20 亿最大值吃消掉。这甚至比国债还要多（至少在写作时如此）。我几乎不好意思称之为局限，但我想在某些应用中，38\
  \ 个零是不够的。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 记住，只有前 16 位是有效的。剩下的\
  \ 22 位是已经服从的噪声。\n\n\n\n\n事实上，`int` 的标准大小在过去的几十年里发生了变化。在 2000 年之前，大多数个人电脑上的标准 `int`\
  \ 是 2 字节，范围为正负 64,000。大约在 2000 年左右，Intel 处理器的基本字长变为 32 位。大多数编译器也更改为如今的默认 `int`，即\
  \ 4 字节，范围为正负 20 亿。\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 表 14-2 提供了随附 CD 光盘提供的\
  \ `Code::Blocks/gcc` 编译器中每个变量类型的大小和范围（以及大多数运行在 32 位操作系统上的 Intel 处理器器的其他编译器）。\n\n\
  | 表 14-2 Code::Blocks/gcc 中的数值类型范围 |\n\n| 类型 | 大小 [字节] | 精度 | 范围 |\n| :--- | :---\
  \ | :--- | :--- |\n| short int | 2 | 精确 | −32,768 到 32,767 |\n| int | 4 | 精确 | −2,147,483,648\
  \ 到 2,147,483,647 |\n| long int | 4 | 精确 | −2,147,483,648 到 2,147,483,647 |\n| long\
  \ long int | 8 | 精确 | −9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n\
  | float | 4 | 7 位数字 | +/− 3.4028 * 10+/-38 |\n| double | 8 | 16 位数字 | +/− 1.7977\
  \ * 10+/-308 |\n| long double | 12 | 19 位数字 | +/−1.1897 * 10+/-4932 |\n\n尝试计算超出变量类型范围的数字被称为溢出。C++\
  \ 标准通常认为溢出的结果是未定义的。这是 C++ 发明者希望保持语言灵活性的另一种方式，以便生成的机器代码尽可能快速。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在 PC 上，浮点数溢出会产生一个异常，如果不进行处理，它将导致你的程序崩溃。（我在第 32 章才会讨论异常处理）。尽管这听起来很糟糕，但整数溢出更糟——C++\
  \ 会在不任何抱怨的情况下生成一个错误的结果。\n\n### 常量类型\n\n我在本章的开头提到了 `const` 声明，并在表 14-1 中再次提过，但现在我想花一点时间详细介绍一下常量。\n\
  \n常量值是一个显式的数字或字符，例如 `1` 或 `0.5` 或 ‘c’。常量值不能被更改，也就是说它们不能出现在赋值语句的左侧。每个常量值都有一种类型。`1`\
  \ 的类型是 `const int`。`0.5` 的类型是 `const double`。表 14-1 解释了如何声明不同类型的常量。例如，`1L` 的类型是\
  \ `const long`。\n\n可以使用 `const` 关键字将变量声明为常量：\n\n```cpp\nconst double PI = 3.14159;\
  \ // 声明常量变量\n```\n\n`const` 变量在声明时必须初始化，因为你以后不会再次获得机会——就像常量一样，`const` 变量不能出现在赋值语句的左侧。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 使用全大写 `const` 变量是一种常见做法。变量名中的多个单词用下划线分隔，例如 `TWO_PI`。一如既往，这只是习惯——C++\
  \ 并不在乎。\n\n声明一个变量然后说它不能被更改似乎很奇怪。为什么要费此精力？很大程度上是因为一个命名良好的常量可以使程序变得更容易理解。考虑以下等效表达式：\n\
  \n```cpp\ndouble dC = 6.28318 * dR; // 这是什么意思？\n\ndouble dCircumference = TWO_PI\
  \ * dRadius; // 这很多\n\n// 更容易理解\n```\n\n对于这段代码的读者来说，第二个表达式将半径乘以 2π 来计算周长应该要清晰得多。\n\
  \n噬 向函数传递不同类型\n\n浮点变量和不同大小的变量传递给函数的方式与 `int` 变量相同，如下代码段所示。此示例片段将变量 `dArg` 的值连同 `const\
  \ double 0.0` 传递给函数 `maximumFloat()`。\n\n```cpp\n// maximumFloat - 返回两个浮点\n// 参数中较大的一个\n\
  double maximumFloat(double d1, double d2)\n{\n    if (d1 > d2)\n    {\n        return\
  \ d1;\n    }\n    return d2;\n}\n\nvoid otherFunction()\n{\n    double dArg = 1.0;\n\
  \    double dNonNegative = maximumFloat(dArg, 0.0);\n    // ...函数继续...\n}\n```\n\
  \n我在第 11 章讨论函数。\n\n#### 函数名重载\n\n参数的类型是函数扩展名的一部分。因此，示例函数的完整名为 `maximumFloat(double,\
  \ double)`。在第 11 章中，你会看到如何通过参数的数量来区分两个函数。你也可以通过参数的类型来区分两个函数，如下所示：\n\n```cpp\ndouble\
  \ maximum(double d1, double d2);\n```\n\n```cpp\ndouble maximum(int d1, int d2);\n\
  ```\n\n等等，文本提供：\n\n```cpp\ndouble maximum(double d1, double d2);\n```\n实际上，重新检查：\n\
  \n```cpp\ndouble maximum(double d1, double d2);\n```\n（注：源码重复了两次 `maximum(double\
  \ d1, d2)`，我会保持其整洁）。\n\n```cpp\ndouble maximum(double d1, d2);\n```\n\n实际上，根据文本：\n\
  调用 `3.0` 指 `int, int`，而调用 `4.0` 指 `double, double`。\n\n#### 混合模式\n\n当参数不对齐时，规则会变得奇怪。考虑以下示例：\n\
  \n```cpp\ndouble maximum(double d1, double d2);\n```\n\n```cpp\ndouble maximum(int\
  \ d1, int d2);\n```\n\n```cpp\nvoid otherFunction()\n{\n    double dArg = 1.0;\n\
  \    double dNonNegative = maximum(dArg, 0.0);\n}\n```\n\n#### Const 参数\n\n你可以将参数声明为\
  \ `const`。这意味着你不能在函数内部更改参数。这在以下实现中演示：\n\n```cpp\ndouble maximum(const double d1,\
  \ const d2)\n{\n    double dResult = d1;\n    if (d2 > dResult)\n    {\n       \
  \ dResult = d2;\n    }\n    // 以下将是非法的\n    d1 = 0.0;\n    return dResult;\n}\n\
  ```\n\n以下内容是非法的：\n\n```cpp\ndouble maximum(double d1, double d2);\ndouble maximum(const\
  \ double d1, const d2);\n```\n\n```cpp\nvoid otherFunction()\n{\n    double dArg\
  \ = 2.0;\n    // C++ 不知道调用上面的哪一个\n    double dNonNegative = maximum(dArg, 0.0);\n\
  }\n```\n\n\n\n现在很清楚，我想调用 `maximum(double, double)`。\n\n# 第 15 章：数组\n\n## 本章节选\n\
  - 将简单变量扩展为数组\n- 将数组与租车停车场进行比较\n- 对数组进行索引\n- 初始化数组\n\n到目前为止，声明的变量具有不同的类型、不同的大小和不同的功能。尽管如此，每个变量一次只能存储一个值。如果我想存储三个数字，就必须声明三个不同的变量。问题是，有时我想要存储一组在某种程度上紧密相关的数字。将它们存储在名称拼写相似（如\
  \ `nArg1`、`nArg2` 等）的变量中，可能会在我的脑海中建立关联，但对于那个笨拙、无知的 C++ 来说却不会。\n\n还有另一类被称为“数组”的变量，它可以存储一系列值。数组是本章和下一章的主题。（在这里我将介绍普通数组。在下一章中，我将讨论字符数组这一特殊情况。）\n\
  \n## 什么是数组？\n\n![tip.eps](img/tip_fmt.jpeg) 如果你在数学方面有天赋，并且在高中或大学接触过数组的概念，你可能想快速略过本节。\n\
  \n你可以把变量想象成一辆卡车。有的的小卡车，比如 `short int`，只能存储较小的值；也有大卡车，比如 `long double`，能够存储惊人的巨大数字。然而，这些卡车每辆只能存储一个值。\n\
  \n每辆卡车都有一个唯一的标识符。也许你会给你的车辆命名，但即使你没有，每辆车也有一个车照，能够唯一描述你的每辆车辆，至少在给定的州内如此。\n\n这对于单一家庭运行良好。即使是最大的家庭，汽车也没有多到足以让这种安排变得困惑。但想象一下一家租车公司。如果他们仅通过车牌号或其他\
  \ ID 来指代汽车会怎样？（天哪，光是想一下赫赫租就头疼！）\n\n在填完无数表格——包括决定是否要全额保险，以及我是否懒得不想在还车前加满油——之后柜台后的男士说：“你的车是\
  \ QZX123。”离开大楼走向停车场，我看着一片如沃尔玛停车场般的车海。QZX123 到底在哪里？\n\n这就是为什么柜台后的男士实际上说的是完全不同的内容。他的大意是：“你的车在\
  \ B11 号位。”这意味着我应该跳过 A 行直接到 B 行，然后开始从末尾开始向下数第 11 辆车。数字通常画在路面上以帮助我，但即使没有，我可能也能猜出他指的是哪辆车。\n\
  \n为了让这个系统运行，必须满足以下几个条件：\n\n1. 车位必须按顺序编号（`B2` 紧随 `B1` 之后且在 `B3` 之前），理想序列中没有中断或跳跃。\n\
  2. 每个车位都设计用于停汽车（给定的停车位可能是空的，但重点是我永远不会在停车位里找到房子）。\n3. 车位之间的间距相等（间距相等意味着我可以向前跳跃，无需从\
  \ `B1` 走走到 `B49` 并检查每一个，来猜测 `B50` 在哪里）。\n\n数组基本上就是这样工作的。我可以给一组数字起一个统一的名字。我通过索引引用序列中的单个数字。因此，变量\
  \ `x` 可以引用整个整数序列，`x(1)` 是序列中的第一个数字，`x(2)` 是第二个，依此类推，就像租车公司的汽车一样。\n\n## 声明数组\n\n\
  在 C++ 中声明数组，必须提供数组的名称、类型和元素数量。语法如下：\n\n```cpp\nint nScores[100];\n```\n\n这声明了一个包含\
  \ 100 个整数的数组，并给它们命名为 `nScores`。\n\n![tip.eps](img/tip_fmt.jpeg) 数组的常见做法是与非数组相同的命名规范，但使用复数形式。这是合理的，因为\
  \ `nScores` 指的是 100 个整数值。\n\n## 对数组进行索引\n\n你必须提供一个索引来访问数组中的特定元素。索引必须是一个计数类型（如 `int`），如下所示：\n\
  \n```cpp\nnScores[11] = 10;\n```\n\n这类似于租车汽车的编号方式。然而，与人类不同，C++ 从 0 开始对数组进行编号。因此，数组\
  \ `nScores` 中的第一个分数是 `nScores[0]`。\n\n那么这到底是如何运作的？我将再次回到租车停车场（我保证这是最后一次）。图 15-1\
  \ 显示了租车公司通常如何对其停车场编号。B 行的第一辆车标识为 `B1`。要找到 `B11`，我只需将视线向右移动十辆车。\n\n**图 15-1：** 租车停车场中的汽车通常从\
  \ 1 开始顺序编号，以便于寻找。\n\n![617977-fg1501.eps](img/617977-fg1501_fmt.jpeg)\n\nC++ 做了类似的事情。为了执行语句\
  \ `nScores[11] = 10`，C++ 从 `nScores` 中第一个元素的地址开始。然后它向右移动 11 个空间并在该位置存储一个 10。这在图\
  \ 15-2 中以图形形式所示。（我在后续章节会有更多关于“获取第一个元素的地址”的内容。）\n\n**图 15-2：** C++ 通过移动 11 个位置计算\
  \ `nScores` 的位置。\n\n## 示例\n\n以下示例对一组分数取平均值并显示该平均值。与之前的演示不同，此程序将分数保留在数组中，随后可以连同平均值一起输出。\n\
  \n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\n// displayArray - 显示数组的内容\n// 长度为 nCount 的值\nvoid displayArray(int nValues[100],\
  \ int nCount)\n{\n    for(int i = 0; i < nCount; i++)\n    {\n        cout.width(3);\n\
  \        cout << i << “ - “ << nValues[i] << endl;\n    }\n}\n\n// averageArray\
  \ - 计算数组的平均值\n// 长度为 nCount 的值\nint averageArray(int nValues[100], int nCount)\n\
  {\n    int nSum = 0;\n    for(int i = 0; i < nCount; i++)\n    {\n        nSum +=\
  \ nValues[i];\n    }\n    return nSum / nCount;\n}\n\n// ArrayDemo - 演示使用数组\n//\
  \ 累积数字数字\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    int nScores[100];\n\
  \    int nCount;\n\n    // 提示用户输入\n    cout << “此程序对一组分数取平均值\\n”\n         << “输入要取平均值的数字\\\
  n”\n         << “(输入负值以终止输入”\n         << endl;\n\n    for(nCount = 0; nCount <\
  \ 100; nCount++)\n    {\n        cout << “Next: “;\n        cin >> nScores[nCount];\n\
  \        if (nScores[nCount] < 0)\n        {\n            break;\n        }\n  \
  \  }\n\n    // 现在输出结果\n    cout << “输入终止。” << endl;\n    cout << “输入数据:” << endl;\n\
  \    displayArray(nScores, nCount);\n    cout << “平均值是 “ << averageArray(nScores,\
  \ nCount) << endl;\n\n    // 在程序终止前等待用户准备好\n    // 允许用户看到程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n\n\n\n此程序从 `main()` 的开始运行，提示用户输入一系列整数值。程序在循环中将用户输入的每个数字保存到数组\
  \ `nScores` 中。一旦用户输入一个负数，程序就会退出循环。\n\n![tip.eps](img/tip_fmt.jpeg) 注意，此程序通过变量 `nCount`\
  \ 跟踪输入的数值个数。无论用户是否输入了负数，程序在输入 100 个值后都会退出循环 —— 因为程序存储数值的空间就只有那么大。你应该始终确保不会越界数组的末尾。\n\
  \n一旦用户输入了负值或连续输入了 100 个值，程序就会退出循环。此时，`nScores` 数组包含了所有输入的数字，而 `nCount` 包含了存储在数组中的数值计数。\n\
  \n然后，程序调用 `displayArray()` 函数向用户显示输入的值。最后，`averageArray()` 函数返回输入数字的整数平均值。\n\n`displayAverage()`\
  \ 函数遍历传递给它的数组中的值，逐个显示每个值。`averageArray()` 函数也通过遍历数组 `nValues`，并将每个元素的和累加到局部变量 `nSum`\
  \ 中来工作。该函数返回 `nSum / nCount`，即 `nValues` 中值的平均值。\n\n在实践中，程序的输出如下：\n\n```\n此程序计算一组分数的平均值\n\
  输入分数以计算平均值（输入负值以终止输入）\nNext: 10\nNext: 20\nNext: 30\nNext: 40\nNext: 50\nNext: -1\n\
  Input terminated.\n\nInput data:\n0 - 10\n1 - 20\n2 - 30\n3 - 40\n4 - 50\nThe average\
  \ is 30\n按任意键继续 . . .\n```\n\n# 数组数组\n\n与任何其他变量一样，如果你不初始化数组，数组的初始值将是不确定的。唯一的区别是，与只包含一个不确定值的简单变量不同，数组的初始状态包含大量的未知值：\n\
  \n```cpp\nint nScores[100]; // nScores 中的所有值\n// 直到你初始化它们之前都是未知的\n```\n\n你可以使用如下循环来初始化数组的元素：\n\
  \n```cpp\nint nScores[100]; // 声明数组，然后...\nfor (int i = 0; i < 100; i++) // ...初始化它\n\
  {\n    nScores[i] = 0;\n}\n```\n\n你也可以在声明数组时通过在声明后的括号中包含初始值来初始化。对于小型数组，这很容易：\n\n\
  ```cpp\nint nCount[5] = {0, 1, 2, 3, 4};\n```\n\n在这里，我将 `nCount[0]` 的值初始化为 0，`nCount[1]`\
  \ 为 1，`nCount[2]` 为 2，以此此类推。如果元素个数比列表中的数字多，C++ 会用零填充列表。因此，在以下情况下：\n\n```cpp\nint\
  \ nCount[5] = {1};\n```\n\n第一个元素（`nCount[0]`）被设置为 1。其他所有元素都将初始化为零。你可以利用此将一个大数组初始化为零：\n\
  \n```cpp\nint nScores[100] = {0};\n```\n\n这不仅声明了数组，还将数组中的每个元素都初始化为零。\n\n同样，如果你有一个初始化列表，就不需要提供数组大小\
  \ —— C++ 会自动计算列表中元素的个数，并使数组达到相应的大小：\n\n```cpp\nint nCount[] = {1, 2, 3, 4, 5};\n\
  ```\n\n这声明 `nCount` 长度为 5 个元素，因为初始化列表中有这么多个值。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 数组用于存储少量到中等量的数据。（实际上，大量数据需要某种数据库。）到目前，最常见的数组类型是字符数组，这是下一章的主题。\n\n# 第 16 章：字符数组\n\
  \n### 本章内容\n- 引入空字符终止字符数组\n- 创建 ASCIIZ 数组变量\n- 检查两个 ASCIIZ 操作的示例程序\n- 回顾一些最常用的内置\
  \ ASCIIZ 库函数\n\n第 15 章引入了数组的概念。示例程序将值收集到一个整数数组中，然后将其传递给一个函数进行显示，以及另一个独立的函数计算平均值。然而，尽管整数数组可能很有用，但最常见的数组类型无疑是字符数组。具体来说，就是被称为\
  \ ASCIIZ 的字符数组，这正是本章的主题。\n\n## ASCII-零字符数组\n\n数组有一个固有的问题：你永远无法仅通过观察数组知道其中实际存储了多少值。知道数组的大小是不够的。它只告诉你数组可以容纳多少值，而不是它实际上存储了多少值。这种区别就像汽车油箱的容量与实际剩余油量之间的区别。即使你的油箱能容纳\
  \ 20 加油，你仍然需要油表来告诉你里面有多少油。\n\n举一个具体的例子，第 15 章中的 `ArrayDemo` 程序在 `nScores` 中分配了足够\
  \ 100 个整数的空间，但并不意味着用户实际输入了那么多。他可能输入的少得多。\n\n跟踪数组中数据量的方法本质有两种：\n1. 在独立的 `int` 变量中维护数值计数。这是\
  \ `ArrayDemo` 程序使用的技术。读取输入的代码通过 `nCount` 跟踪输入次数。\n2. 使用数组中的一个特殊值作为结束指示。这是 C++ 中字符串使用的技术。\n\
  \n### 声明和初始化 ASCIIZ 数组\n\n我可以按照如下方式声明一个包含我名字的 ASCIIZ 字符数组：\n\n```cpp\nchar szMyName[8]\
  \ = {'S', 't', 'e', 'p', 'h', 'e', 'n', '\\0'};\n```\n\n实际上，这个 8 是多余的。C++ 足够智能，可以计算初始化字符串中的字符数量并创建同样大的数组。因此，以下与之前的示例完全等效：\n\
  \n```cpp\nchar szMyName[] = {'S', 't', 'e', 'p', 'h', 'e', 'n', '\\0'};\n```\n\n\
  这种方法的唯一问题是它太笨拙了。我输入的字符比构成我名字的七个字符多得多。（我名字的每个字符都要输入大约五次按键 —— 这开销很大。）ASCIIZ 字符串在 C++\
  \ 中非常常见，因此语言提供了一种简便选项：\n\n```cpp\nchar szMyName[] = \"Stephen\";\n```\n\n这两个初始化语句完全等效。事实上，包含在双引号中的字符串只不过是一个以空字符终止的常量字符数组。\n\
  \n\n\n\n\n![onthecd.eps](img/onthecd_fmt.jpeg)让我们来看显示字符串的简单案例。你现在已经知道 C++ 可以很好地理解显示\
  \ ASCIIZ 字符串，但假设它不会。那么一个设计用于显示字符串的函数会是什么样的呢？下面的 `DisplayASCIIZ` 程序就是一个示例：\n\n```cpp\n\
  //\n// DisplayASCIIZ - display an ASCIIZ string one character\n// at a time as an\
  \ example of ASCIIZ\n// manipulation\n//\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\nusing namespace std;\n\n// displayString - 逐字符显示一个 ASCIIZ 字符串\n\
  void displayString(char szString[])\n{\n    for(int index = 0; szString[index] !=\
  \ '\\0’; index++)\n    {\n        cout << szString[index];\n    }\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    char szName1[] = {'S’, ‘t’, ‘e’, ‘p’,\
  \ ‘h’, ‘e’, ‘n’, ‘0’};\n    char szName2[] = “Stephen”;\n    cout << “Output szName1:\
  \ “;\n    displayString(szName1);\n    cout << endl;\n    cout << “Output szName2:\
  \ “;\n    displayString(szName2);\n    cout << endl;\n    // 等待用户准备好后再终止程序\n   \
  \ // 以允许用户看到程序结果\n    system(“PAUSE”);\n    return 0;\n}\n```\n\n`displayString()`\
  \ 函数是这个演示程序的关键。该函数使用变量 `index` 遍历传递给它的字符数组。然而，该函数并没有依赖于包含数组字符数量的独立变量，而是会一直循环，直到\
  \ `szString[index]` 处的字符是空字符 `‘0’` 为止。只要当前字符不是空字符，循环就会输出到显示器。\n\n`main()` 函数创建了我名字两个版本：首先使用离散字符创建\
  \ `szName1`，然后第二次使用快捷方式“Stephen”创建 `szName2`。接着，该函数使用 `displayString()` 函数显示两个字符串，以证明该函数可以工作，并演示这两个字符串的等效性。\n\
  \n程序的输出结果如下：\n\nOutput szName1: Stephen\nOutput szName2: Stephen\nPress any key\
  \ to continue . . .\n\n注意 `szName1` 和 `szName2` 显示完全相同（因为它们是同一个）。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n### 常量字符问题\n\n从技术上讲，“Stephen” 并不是 `char[]` 类型，即“字符数组”——它是 `const char[]` 类型，即“常量字符数组”。其区别在于，你不能修改常量字符数组中的字符。因此，你可以执行以下操作：\n\
  \n```cpp\nchar cT = “Stephen”[1]; // 获取第二个字符，即 ‘t’\n```\n\n但你不能通过将它置于等号的左侧来修改它：\n\
  \n```cpp\n“Stephen”[1] = ‘x’; // 将 ‘t’ 替换为 ‘x’\n```\n\n这种对 `const` 的挑剔通常不会产生影响，但在声明函数参数时可能会引起\
  \ C++ 的困惑（consternation）。例如，在 `DisplayASCIIZ` 演示程序中，我不能说 `displayString(“Stephen”)`，因为\
  \ `displayString()` 被为接受字符数组 (`char[]`)，而“Stephen”是一个常量字符数组 (`const char[]`)。\n\n\
  我可以通过简单地声明 `displayString()` 来解决这个问题：\n\n```cpp\nvoid displayString(const char szString[]);\n\
  ```\n\n该函数之所以有效，是因为 `displayString()` 永远不会尝试修改传递它的 `szString` 数组。\n\n如果这段关于 `const`\
  \ 与非常量变量的讨论让你感到困惑，不要担心——你将在第 18 章再次有机会看到它的实际应用。\n\n### 查看更详细的示例\n\n显示一个字符字符串非常简单。那么稍微复杂一点的例子呢？下面的程序拼接了两个从键盘读取的字符串。\n\
  \n![remember.eps](img/remember_fmt.jpeg)拼接两个字符串意味着将一个附加到另一个的末尾。例如，将“abc”与“DEF”拼接的结果是“abcDEF”。\n\
  \n在检查程序之前，思考一下你如何将一个名为 `szSource` 的字符串拼接到另一个名为 `szTarget` 的字符串末尾。\n\n首先，你需要找到 `szTarget`\
  \ 字符串的末尾（见图 16-1 顶部）。完成后，你将字符从 `szSource` 逐个拷贝到 `szTarget` 直到到达 `szSource` 字符串的结尾（如图\
  \ 16-1 底部所示）。确保结果末尾有一个最终空字符，你就完成了。\n\n**图 16-1:** 为了进行拼接，函数必须执行以下操作：(a) 首先，找到目标字符串的终止空字符；(b)\
  \ 然后从源拷贝字符到目标，直到遇到源上的终止空字符。\n\n![617977-fg1601.eps](img/617977-fg1601_fmt.jpeg)\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg)这就是 `ConcatenateString` 示例程序中 `concatenateString()`\
  \ 函数的工作方式。\n\n```cpp\n//\n// ConcatenateString - 通过实现\n// 拼接函数来演示\n// ASCIIZ 字符串的操控\n\
  //\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\nusing namespace\
  \ std;\n\n// concatenateString - 将一个字符串拼接到\n// 另一个的末尾\nvoid concatenateString(char\
  \ szTarget[],\nconst char szSource[])\n{\n    // 首先找到目标字符串的结尾\n    int nT;\n   \
  \ for(nT = 0; szTarget[nT] != ‘0’; nT++)\n    {\n    }\n    // 现在将源的内容拷贝到\n    //\
  \ 目标，从 nT 开始\n    for(int nS = 0; szSource[nS] != ‘0’; nT++, nS++)\n    {\n    \
  \    szTarget[nT] = szSource[nS];\n    }\n    // 为 szTarget 添加终止符\n    szTarget[nT]\
  \ = ‘0’;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 提示用户\n  \
  \  cout << “此程序接受两个字符串\\n”\n    << “来自键盘并输出它们\\n”\n    << “拼接后的结果\\n” << endl;\n\
  \    // 输入字符串\n    cout << “输入第一个字符串: “;\n    char szString1[256];\n    cin.getline(szString1,\
  \ 256);\n    cout << “输入第二个字符串: “;\n    char szString2[256];\n    cin.getline(szString2,\
  \ 256);\n    // 现在将一个拼接到另一个上\n    cout << “将第一个字符串拼接到另一个\\n”\n    << endl;\n   \
  \ concatenateString(szString1, szString2);\n    // 并显示结果\n    cout << “结果: <”\n\
  \    << szString1\n    << “>” << endl;\n}\n```\n\n\n\n\n\n表达式 `cin >> string;` 会在第一个空白字符处停止输入。示例程序使用的\
  \ `getline()` 函数与 `cin >> string;` 一样，从键盘读取输入，但它会读取到结尾换行符为止的整行。它返回的字符字符串中不包含换行符。不用担心\
  \ `getline()` 调用时奇怪的语法——我会在第 23 章中介绍它。\n\n程序示例运行的结果如下：\n\n此程序接受两个来自\n键盘的字符串，并将它们\n\
  \n拼接后输出。\n\n输入第一个字符串：String 1\n\n输入第二个字符串：STRING 2\n\n将第一个字符串拼接到第二个字符串上\n\n结果：<String\
  \ 1STRING 2>\n\n按任意键继续 . . .\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)请注意，`concatenateString()`\
  \ 的第二个参数实际上被声明为 `const char[]`（读作“常量字符数组”）。这是因为该函数不会修改源字符串。将其声明为常量字符数组允许你像下面的调用一样，传递一个常量字符串来调用该函数：\n\
  \n```\nconcatenateString(szString, “The End”);\n```\n\n### 防御黑客\n\n前面的示例程序中的 `concatenateString()`\
  \ 函数是如何知道 `szTarget` 中是否有足够的空间来容纳拼接后的源字符串目标字符串的？答案是，它并不知道\n\n这是一个严重的 Bug。如果用户在按下回车键之前输入了足够的字符，他可能会覆盖大量数据甚至代码。事实上，这种固定缓冲区溢出\
  \ Bug 是黑客通过浏览器控制 PC 并植入病毒的方法之一。\n\n在随后的纠正版本中，`concatenateString()` 接受一个额外的参数：`szTarget`\
  \ 数组的大小。函数通过检查索引 `nT` 与该数字的关系，确保它不会写入目标数组的边界。\n\n![onthecd.eps](img/onthecd_fmt.jpeg)该程序在附带的\
  \ 盘上显示为 `ConcatenateNString`：\n\n```cpp\n// concatenateString - 将一个字符串拼接到\n// 另一个的结尾（不要超出\n\
  // nTargetSize）\n\nvoid concatenateString(char szTarget[],\nint nTargetSize,\nconst\
  \ char szSource[])\n{\n    // 首先找到目标字符串的结尾\n    int nT;\n    for(nT = 0; szTarget[nT]\
  \ != ‘\\0’; nT++)\n    {\n    }\n    // 现在将源字符串的内容拷贝到\n    // 目标字符串中，从 ‘nT’ 开始但不要\n\
  \    // 写入 nTargetSize 个元素之后（减 1\n    // 是为终止空字符留出空间）\n    for(int nS = 0;\n   \
  \      nT < (nTargetSize - 1) && szSource[nS] != ‘\\0’;\n         nT++, nS++)\n\
  \    {\n        szTarget[nT] = szSource[nS];\n    }\n    // 向 szTarget 添加终止符\n \
  \   szTarget[nT] = ‘\\0’;\n}\n```\n\n该函数的第一部分完全相同，通过遍历 `szTarget` 寻找终止空字符。区别在于第二个循环。这个\
  \ `for` 循环包含两个终止。如果满足以下任一条件，控制将退出循环：\n\n- `szSource[nS]` 是空字符，意味着你已经到达 `szSource`\
  \ 的最后一个字符。\n- `nT` 大于或等于 `nTargetSize - 1`，意味着你已经耗尽了 `szTarget` 中的可用空间（减 1 是因为必须这样做）。这个额外的检查是为了避免数组溢出并产生奇怪的结果。\n\
  \n### 我真的需要做所有工作吗？\n\nC++ 本身对字符串没有提供太多帮助。幸运的是，标准库包含了许多函数，可以省去编写这些函数的麻烦。表 16-1 显示了最常用的：\n\
  \n#### 表 16-1 常用字符串函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `isalpha(char c)` | 如果字符是字母（‘A’\
  \ 到‘Z’），则返回 true。 |\n| `isdigit(char c)` | 如果字符是数字（‘0’ 到‘9’），则返回 true。 |\n| `isupper(char\
  \ c)` | 如果字符是大写写，则返回 true。 |\n| `islower(char c)` | 如果字符是小写，则返回 true。 |\n| `isprint(char\
  \ c)` | 如果字符是可打印的，则返回 true。 |\n| `isspace(char c)` | 如果字符是空白字符（空格、制表符、换行符等），则返回\
  \ true。 |\n| `strlen(char s[])` | 返回字符串中字符的数量（不包括终止空字符）。 |\n| `strcmp(char s1[],\
  \ char s2[])` | 比较两个字符串。如果字符串相同，返回 0；如果第一个字符串出现在第二个字符串之后，返回 1；否则返回 -1。 |\n| `strncpy(char\
  \ target[], char source[], int size)` | 将源字符串拷贝到目标，最多不超过 `size` 个字符。 |\n| `strncat(char\
  \ target[], char source[], int size)` | 将源字符串拼接到目标字符串末尾，最多不超过 `size` 个字符。 |\n| `tolower(char\
  \ c)` | 返回传递的字符的小写版本，如果它已经是小写，则返回该字符。 |\n| `toupper(char c)` | 返回传递的字符的大写版本，如果它没有大写等效字符，则返回该字符。\
  \ |\n\n`toUpper()` 函数遵循了一个你很快就会熟悉的模式：它使用 `for` 循环遍历字符串中的每个元素。如果字符串大小耗尽或程序到达终止字符，循环终止。\n\
  \n该函数将字符串中的每个字符传递给标准库 `toupper()` 函数。并将函数返回的字符存回字符数组中。\n\n\n\n\n在本章中，你已经学习了如何将 `ASCIIZ`\
  \ 字符串作为字符数组的一种特殊情况来处理。在实践中，许多标准函数都依赖于一种被称为指针的东西。在接下来的两个章节中，你将看到指针是如何工作的。然后我将回到这些示例函数，并使用指针来实现它们，以展示指针解决方案的优雅性。\n\
  \n# 第 17 章：通往 C++ 指针之路\n\n## 本章内容\n- 引入指针变量的概念\n- 声明和初始化指针\n- 使用指针通过引用传递参数\n- 从堆上分配变长数组\n\
  \n本章引入了指针这一强大的概念。我所指的不是经过特殊训练指向鸟类的狗，而是指向内存中其他变量的变量。在进入声明和使用指针变量的细节之前，我将先从计算机寻址原理说起。本章将以对所谓的\
  \ `heap`（堆）的讨论作为结束，并介绍我们如何使用它来解决我在上一章中巧妙引入的一个问题。\n\n但不要认为这一章结束乐趣就结束了。下一章将指针概念进一步推了一步。事实上，以某种方式，指针将出现在此书中几乎剩下的每一个章节中。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)你可能需要一段时间才能适应指针变量的概念。不要气馁。你可能需要反复阅读本章和下一章几遍，才能掌握所有的所有的细微之处。\n\
  \n## 什么是指针？\n\n指针是一个变量，它包含计算机内部内存中另一个变量的地址。在理解这句话之前，你需要了解计算机如何对内存进行寻址。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)你的\
  \ PC 或 Macintosh 上使用的 Intel 处理器的计算机寻址细节非常复杂，而且比你在书书中需要关心的要复杂得多。我将在这些讨论中使用一个非常简单的内存模型。\n\
  \n每一块随机访问存储器（`RAM`）都有自己唯一的地址。对于包括 Mac 和 PC 在内的大多数计算机来说，最小的可寻址内存单元是 `byte`（字节）。\n\
  \n![remember.eps](img/remember_fmt.jpeg)一个 `byte` 是 8 位，对应于一个 `char` 类型的变量。\n\n\
  内存中的地址就像房屋地址完全一样，如果满足以下条件，它们就是完全一样的：\n1. 每栋房子都按顺序编号。\n2. 没有跳号或重复的数字。\n3. 整个城市由一条长街组成。\n\
  \n所以，例如，某个内存 `byte` 的地址可能是 `0x1000`。其后的下一个字节地址将是 `0x1001`。之前的字节则在 `0x0FFF`。\n\n\
  ![tip.eps](img/tip_fmt.jpeg)不知道为什么，但按照习惯，内存地址总是用十六进制表示。也许这是为了让非程序员认为计算机寻址真的非常复杂。\n\
  \n## 声明指针\n\n`char` 变量设计用于存储 ASCII 字符，`int` 设计用于存储整数，`double` 设计用于存储浮点数。同样，指针变量设计用于存储内存地址。你通过在指针指向的对象类型末尾添加星号（`*`）来声明指针变量，如下所示：\n\
  \n```cpp\nchar* pChar; // 指向字符的指针\nint* pInt; // 指向 int 的指针\n```\n\n一个没有初始化的指针变量包含一个未知值。你可以使用取地址运算符（`&`）用相同类型变量的地址来初始化指针变量：\n\
  \n```cpp\nchar cSomeChar = ‘a’;\nchar* pChar;\npChar = &cSomeChar;\n```\n\n在代码段中，变量\
  \ `cSomeChar` 有一个地址。为了 sake 起见，假设 C++ 为它分配了地址 `0x1000`。（C++ 还在该位置初始化了字符‘a’。）变量 `pChar`\
  \ 也有一个它自己的位置，可能是 `0x1004`。表达式 `&cSomeChar` 的值为 `0x1000`，其类型为 `char*`（读作“指向 char\
  \ 的指针”）。因此，代码段中第三行的赋值操作将值 `0x1000` 存储在变量 `pChar` 中。这如图 17-1 所示。\n\n**图 17-1：** 声明和初始化后，`cSomeChar`\
  \ 和 `pChar` 在内存中的布局，正如文中描述。\n\n![617977-fg1701.eps](img/617977-fg1701_fmt.jpeg)\n\
  \n花一点时间真正理解图示与代码段中三行 C++ 代码之间的关系。第一行声明说：“去内存中寻找一个 1 字节大小的位置，给它命名为 `cSomeChar`，并将其初始化为‘a’。”在例例中，C++\
  \ 选择了位置 `0x1000`。\n\n下一行说：“去寻找一个足够大以容纳 `char` 变量地址的位置，并将其命名为 `pChar`。”在例例中，C++ 将\
  \ `pChar` 分配到了位置 `0x1004`。\n\n![tip.eps](img/tip_fmt.jpeg)在 Code::Blocks 中，无论所指向的对象有多大，所有地址的长度都是\
  \ 4 字节——一个指向 `char` 的指针。指向 `char` 的指针与 `double` 指针的大小相同。\n\n第三行说：“将 `cSomeChar`\
  \ 的地址（0x1000）赋值给 `pChar`。”这展示了指向 `char` 的。\n\n“这有什么有趣的？”\n\n `*` 作为二元运算符时表示“乘”，但作为一元运算符时，`*`\
  \ 表示“找到指向的内容”。\n\n```cpp\n*pChar = ‘b’;\n```\n\n这一行说：“在指向 `char` 的位置存储‘b’。”为了执行这个表达式，C++\
  \ 首先获取 `pChar` 指向的内容，然后在该位置存储字符‘b’。\n\n**图 17-2：** 执行 `*pChar = ‘b’` 时涉及的步骤。\n\n\
  ![617977-fg1702.eps](img/tip_fmt.jpeg)\n\n## 向函数传递参数\n\n向函数传递参数有两种方式：按值传递或按引用传递。现在，逐一考虑这两种。\n\
  \n### 按值传递\n在第 11 章中，我写到参数是通过值传递函数的，这意味着传递的是变量的值而不是变量本身。\n\n![onthecd.eps](img/onthecd_fmt.jpeg)这种影响在下面的代码段中变得（取自光盘上的\
  \ PassByReference 示例程序）：\n\n```cpp\nvoid fn(int nArg1, int nArg2)\n{\n    // 修改参数的值\n\
  \    nArg1 = 10;\n    nArg2 = 20;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    // 初始化变量并显示它们的值\n    int nValue1 = 1;\n    int nValue2 = 2;\n    // 现在尝试通过调用函数来修改它们\n\
  \    fn(nValue1, nValue2);\n\n    // 现在 nValue1 和 nValue2 的值是多少？\n    cout << “nValue1\
  \ = “ << nValue1 << endl;\n    cout << “nValue2 = “ << nValue2 << endl;\n\n    return\
  \ 0;\n}\n```\n\n此程序声明了两个变量 `nValue1` 和 `nValue2`，将其初始化为已知值，然后将它们的值传递给函数 `fn()`。该函数修改了它的参数并直接返回。\n\
  \n问题：控制权从 `fn()` 返回后，`main()` 中 `nValue1` 和 `nValue2` 的值是多少？\n\n答案：`nValue1` 和 `nValue2`\
  \ 的值保持不变，分别为 1 和 2。\n\n\n\n要理解为什么，请仔细观察 C++ 在调用 `fn()` 时是如何处理内存的。C++ 将局部变量（如 `nValue1`\
  \ 和 `nValue2`）存储在名为栈（stack）的特殊内存区域。在进入函数时，C++ 会计算出函数需要多少栈内存，然后预留该数量。假设在这个示例中，为 `main()`\
  \ 分配的栈内存从位置 `0x1000` 开始，延伸到 `0x101F`。在这种情况下，`nValue1` 可能位于 `0x1000` 处，而 `nValue2`\
  \ 位于 `0x1004`。\n\n![remember.eps](img/remember_fmt.jpeg)\n在 Code::Blocks 中，一个 `int`\
  \ 占用 4 个字节。详情请参阅第 14 章。\n\n作为调用 `fn()` 的一部分，C++ 首先将每个参数的值存储在栈上，从最右侧的参数开始向左处理。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\nC++ 在调用过程中最后存储的内容是返回地址，这样函数在完成后就\
  \ own 返回到何处。\n\n由于与 CPU 内部工作原理有关，栈是“向下增长”的，这意味着 `fn()` 使用的内存地址将小于 `0x1000`。图 17-3\
  \ 显示了计算机处理器到达 `fn()` 中第一条语句时的内存状态。C++ 将函数的第二个参数存储在位置 `0x0FF4`，将第一个参数存储在 `0x0FF0`。\n\
  \n![remember.eps](img/remember_fmt.jpeg)\n请记住，这只是内存的一种可能布局。我并不知道（也不在乎）这些任何一个地址实际上是\
  \ C++ 在此或任何其他函数调用中使用的地址。\n\n**图 17-3：** 进入函数 `fn(int, int)` 之后可能的内存布局。\n\n![617977-fg1703.eps](img/617977-fg1703_fmt.jpeg)\n\
  \n函数 `fn(int, int)` 包含两个语句：\n\n```\nnArg1 = 10;\nnArg2 = 20;\n```\n\n图 17-4 显示了这两个语句执行执行后的内存内容。其实非常简单——`nArg1`\
  \ 的值已变为 10，`nArg2` 变为 20，正如你预期的那样。然而，这个演示的核心点在于，更改 `nArg1` 和 `nArg2` 的值对原始变量 `nValue1`\
  \ 和 `nValue2` 没有任何影响。\n\n**图 17-4：** 从 `fn(int, int)` 返回之前的相同内存位置。\n\n![617977-fg1704.eps](img/617977-fg1704_fmt.jpeg)\n\
  \n### 通过引用传递参数\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\n如果我想让 `fn()` 做的更改是永久的怎么办？我可以通过传递变量的地址而不是变量的值来实现。下面的代码段（同样取自\
  \ PassByReference 示例程序）演示了这一点：\n\n```\n// fn(int*, int*) - 此函数通过引用\n// 接收参数\nvoid\
  \ fn(int* pnArg1, int* pnArg2)\n{\n    // 修改参数的值\n    *pnArg1 = 10;\n    *pnArg2\
  \ = 20;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 初始化两个变量并显示它们的值\n\
  \    int nValue1 = 1;\n    int nValue2 = 2;\n    fn(&nValue1, &nValue2);\n    return\
  \ 0;\n}\n```\n\n首先注意，`fn()` 的参数现在声明不是整数，而是指向整数的指针。`fn(int*, int*)` 的调用传递不是变量 `nValue1`\
  \ 和 `nValue2` 的值，而是它们的地址。\n\n![remember.eps](img/remember_fmt.jpeg)\n在这个示例中，表达式\
  \ `&nValue1` 的值是 `0x1000`，类型是 `int*`（读作“指向 int 的指针”）。\n\n进入此函数时的内存状态如图 17-5 所示。\n\
  \n**图 17-5：** 调用 `fn()` 之后的内存内容。\n\n![617977-fg1703.eps](img/617977-fg1703_fmt.jpeg)\n\
  函数 `fn(int*, int*)` 现在将其值存储在参数所指向的位置。这恰好是变量 `nValue1`。这在图 17-6 中以图形形式所示。\n\n\n\n\
  \n```cpp\nchar* pArray = new char[256];\n```\n\n此示例从堆（heap）上开辟了一块足够容纳 256 个字符的内存。`new`\
  \ 关键字返回一个指向新创建数组的指针。与其他变量不同，堆内存是在运行时才分配的，这意味着数组的大小并不受限于编译时确定的常量——它们也可以是运行时计算的变量。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)`new` 的参数是一个数组，而返回的却是一个指针，这看起来可能很奇怪。我将在下一章中详细介绍指针与数组之间的关系。\n\
  \n因此，我本可以说类似如下的内容：\n\n```cpp\nint nSizeOfArray = someFunction();\n\nchar* pArray\
  \ = new char[nSizeOfArray];\n```\n\n在这里，数组的大小是由 `someFunction()` 计算的。显然，在程序实际执行之前，这种计算是无法发生的。`someFunction()`\
  \ 返回的任何值将用作下一条语句中要分配数组的大小。\n\n一个更实用的例子是下面的代码段，它复制了一个 ASCIIZ 字符串（假设你认为复制字符串是实用的操作）：\n\
  \n```cpp\nint nLength = strlen(pszString) + 1;\n\nchar* pszCopy = new char[nLength];\n\
  \nstrncpy(pszCopy, nLength, pszString);\n```\n\n第一条语句调用字符串函数 `strlen()`，它返回传递的字符串的长度，但不包括终止的\
  \ NULL 字符。`+ 1` 为终止的 NULL 留出了空间。下一条语句在堆上为复制品分配空间。最后，第三条语句使用字符串函数 `strncpy()` 将 `pszString`\
  \ 的内容复制到 `pszCopy` 中。通过计算存储副本所需的数组大小，你可以确保 `pszCopy` 足够大以容纳整个字符串。\n\n### 别忘记在使用完后进行清理\n\
  \n在堆上分配内存是一个很棒的功能，但在 C++ 中它有一个非常大的危险：如果你在堆上分配了内存，你必须记得返回它。\n\n你使用 `delete` 关键字将内存返回给堆，如下：\n\
  \n```cpp\nchar* pArray = new char[256];\n\n// ...随尽地使用这些内存...\n\n// 现在将内存块返回给堆\n\
  \ndelete[] pArray;\n\npArray = NULL;\n```\n\n`delete[]` 关键字接受由 `new` 关键字传递给你的指针并将并将内存还原到堆。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 使用 `delete[]` 返回数组。当向堆返回单个对象时，使用 `delete`（不带左括号和右括号）。\n\
  \n如果你在完成堆内存后没有返回它，你的程序将缓慢消耗内存，并随着操作系统试图满足其那似乎永无止境的贪婪需求，运行变得越来越慢。最终，当操作系统无法再满足其内存请求时，程序将停止。\n\
  \n两次向堆返回同一块内存并不那么糟糕。那会导致程序几乎立即崩溃。在删除了指针所指向的内存块后，将指针置零被认为是良好的编程习惯，这有两个非常充分的理由：\n\n\
  1. 删除一个包含 `NULL` 的指针没有任何影响。\n2. `NULL` 永远不是一个有效地址。尝试访问 `NULL` 位置的内存将始终导致你的程序立即崩溃，这会提示你存在问题并使其更容易找到。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果你的程序很快就会退出，则不需要删除内存——当程序终止时，所有堆内存都会恢复给操作系统。然而，返回你从堆上分配的内存是一个好习惯。\n\
  \n### 示例分析\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `ConcatenateHeap` 程序是 `concatenate()`\
  \ 函数的一个版本，它在堆上分配内存：\n\n```cpp\n// ConcatenateHeap - 与 ConcatenateString 类似\n// 此版本将合并后的\n\
  // 字符串存储在从堆分配的内存中\n// 这样我们可以保证\n// 目标数组总是\n// 大足够\n//\n\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing namespace std;\n\n\
  // concatenateString - 将两个字符串合并\n// 在堆上分配的数组中\nchar* concatenateString(const char\
  \ szSrc1[],\nconst char szSrc2[])\n{\n    // 分配一个足够长度的数组\n    int nTargetSize =\
  \ strlen(szSrc1) + strlen(szSrc2) + 1;\n    char* pszTarget = new char[nTargetSize];\n\
  \n    // 首先将第一个字符串复制到目标中\n    int nT;\n    for(nT = 0; szSrc1[nT] != '\\0'; nT++)\n\
  \    {\n        pszTarget[nT] = szSrc1[nT];\n    }\n    // 现在将第二个字符串的内容复制到\n   \
  \ // 第一个字符串的末\n    for(int nS = 0; szSrc2[nS] != '\\0'; nT++, nS++)\n    {\n   \
  \     pszTarget[nT] = szSrc2[nS];\n    }\n    // 为 szTarget 添加终止符\n    pszTarget[nT]\
  \ = '\\0';\n\n    // 将结果返回给调用者\n    return pszTarget;\n}\n\nint main(int nNumberArgs,\
  \ char* pszArgs[])\n{\n    // 提示用户\n    cout << \"此程序从键盘接收两个字符串\\n\"\n    << \"\
  并输出它们合并后的结果\\n\"\n    << endl;\n\n    // 输入两个字符串\n    cout << \"输入第一个字符串: \";\n\
  \    char szString1[256];\n    cin.getline(szString1, 256);\n\n    cout << \"输入第二个字符串:\
  \ \";\n    char szString2[256];\n    cin.getline(szString2, 256);\n\n    // 现在将一个合并到另一个上面\n\
  \    cout << \"将第二个字符串合并到第一个上面\"\n    << endl;\n    char* pszT = concatenateString(szString1,\
  \ szString2);\n\n    // 并显示结果\n    cout << \"结果: <\"\n    << pszT\n    << \">\"\
  \ << endl;\n\n    // 将内存返回给堆\n    delete[] pszT;\n    pszT = NULL;\n\n    // 等用户准备好后再终止\n\
  \    // 以允许用户查看程序结果\n    system(\"PAUSE\");\n\n    return 0;\n}\n```\n\n此程序包含了 `cstring`\
  \ 文件以访问 `strlen()` 函数。`concatenateString()` 函数与之前的版本类似，不同在于它返回包含合并字符串的内存块地址，而不是修改传递给它的任何字符串。这允许在代码片段中使用常量字符串调用函数：\n\
  \n```cpp\nchar* pFullName = concatenateString(\"Mr. \", pszName);\n```\n\n`\"Mr.\
  \ \"` 是一个常量字符数组，就像 `1` 是一个常量整数一样。\n\n\n\n\n\n# 比较指针加法与数组索引\n\n## 将算术扩展到不同类型的指针\n\
  ## 区分常量指针与指向常量的指针\n## 读取程序的参数\n\n第 17 章引入了指针变量的概念，它被设计用于包含另一个变量的地址。我甚至进一步建议了指针变量的几种用法。然而，你才刚刚开始看到指针变量可以执行一些非常酷操作的无数方式，而且这些方式有时也真的让你感到困惑。\n\
  \n本章将仔细研究指针与数组之间的关系，这个主题在上一章中我略带提过。\n\n## 指针与数组\n\n某些适用于整数的操作也适用于指针类型。本节将探讨这些操作对目前为止所学的指针类型和数组类型的影响。\n\
  \n### 指针上的操作\n\n表 18-1 列出了定义在指针上的三种基本操作。\n\n| 表 18-1 定义在指针类型变量上的三种操作 |\n\n| 操作 |\
  \ 结果 | 意义 |\n| :--- | :--- | :--- |\n| `pointer + offset` | `pointer` | 计算指针后偏移若干条目的对象地址\
  \ |\n| `pointer++` | `pointer` | 将指针移动一个条目 |\n| `pointer2 - pointer1` | `offset`\
  \ | 计算 `pointer2` 和 `ponter1` 之间的条目数 |\n\n虽然表 18-1 中没有列出，但与加法相关的操作（如 `pointer +=\
  \ offset`）也是定义的。减法也被定义了，因为它仅仅是加法的变体。\n\n第 17 章用于解释指针的简单内存模型在这里同样适用于解释这些操作是如何工作的。考虑一个名为\
  \ `cArray` 的 32 个字节字符数组。如果该数组第一个字节存储在地址 `0x1000`，那么最后一个位置将位于 `0x101F`。虽然 `cArray[0]`\
  \ 将位于 `0x1000`，但 `cArray[1]` 将位于 `0x1001`，`cArray[2]` 在 `0x1002`，依此类推。\n\n现在假设指针\
  \ `pArray` 位于位置 `0x1100`。执行表达式后\n\n```\npArray = &cArray[0];\n```\n\n指针 `pArray`\
  \ 将包含值 `0x1000`（参见图 18-1）。顺便说，你将其读作“pArray 获取 cArray 下标 0 的地址”。\n\n给 `pArray` 加上值\
  \ `n` 生成 `cArray[n]` 的地址。例如，考虑 `n` 等于 `2` 的情况。在这种情况下，`pArray + 2` 生成地址 `0x1002`，即\
  \ `cArray[2]` 的地址。这种对应关系在表 18-2 中所示。\n\n| 表 18-2 指针偏移与数组元素的对应关系 |\n\n| 偏移 | 结果 |\
  \ 对应于 |\n| :--- | :--- | :--- |\n| `+ 0` | `0x1000` | `cArray[0]` |\n| `+ 1` | `0x1001`\
  \ | `cArray[1]` |\n| `+ 2` | `0x1002` | `cArray[2]` |\n| `...` | `...` | `...` |\n\
  | `+ n` | `0x1000 + n` | `cArray[n]` |\n\n**图 18-1：** 在赋值 `pArray = &cArray[0]`\
  \ 后，指针 `pArray` 指向数组 `cArray` 的开头。\n\n![617977-fg1801.eps](img/617977-fg1801_fmt.jpeg)\n\
  \n### 指针加法对比数组索引\n\n以下主称\n\n```\npArray = &cArray[0];\n(pArray + 2) = ‘c’;\n```\n\
  \n等于\n\n```\ncArray[2] = ‘c’;\n```\n\n在你对这一主称做出回应之前，我需要解释如何读取第一个代码段。一步一步来。你已经知道如何读取第一个表达式：`pArray\
  \ = &cArray[0]` 意味着“pArray 获取 cArray 下标 0 的地址”。\n\n**图 18-2：** 如果 `pArray` 指向 `cArray`\
  \ 的开头，那么 `pArray + 2` 指向 `cArray [2]`。\n\n![617977-fg1802.eps](img/617977-fg1802_fmt.jpeg)\n\
  \n要解释第二个表达式，记住 `pArray + 2` 生成值 `0x1002`，且其类型为 `char*`。赋值运算符左侧的 `*(pArray + 2)`\
  \ 表示“将 `pArray + 2` 指向的字符存储一个 ‘c’”。这在图 18-3 中以图形形式所示。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ `*(pArray + 2)` 周边的括号是必要的，因为一元运算符 `*` 的优先级高于加法。表达式 `*pArray + 2` 会检索 `pArray`\
  \ 指向的字符并对其加 2。加上括号强制先进行加法，然后对结果应用一元运算符。\n\n事实上（重点来了），这两种表达式形式之间的对应关系如此强烈，以至于 C++\
  \ 认为 `cArray[n]` 仅仅是 `*(pArray + n)` 的简写，其中 `pArray` 指向 `cArray` 的第一个元素：\n\n```\n\
  cArray[n] 被解释为 *(&cArray[0] + n)\n```\n\n**图 18-3：** 表达式 `*(pArray + 2) = ‘c’` 将一个\
  \ ‘c’ 存储在 `cArray[2]` 中。\n\n![617977-fg1803.eps](img/617977-fg1803_fmt.jpeg) 为了完成这种关联，C++\
  \ 将数组名称视为如下：\n\n```\ncArray 被解释为 *(&cArray[0] + n)\n```\n\n\n\n\n此处显示的版本跳过了递增索引的中间步骤，直接对指针本身进行递增。首先，它检查\
  \ `pszSrc1` 是否已经指向源字符串结束的空字符。如果不是，则 `for` 循环内的赋值语句\n\n```\n*pszT = *pszSrc1;\n```\n\
  \n表示获取 `pszSrc1` 指向的字符，并将其存储在 `pszT` 指向的位置。图 18-4 以图表形式演示了这一点。\n\n`for` 循环的递增子句\n\
  \n```\npszT++, pszSrc1++\n```\n\n将源指针 `pszSrc1` 和目标指针 `pszT` 都指向源数组和目标数组中的下一个字符。图\
  \ 18-5 证明了这一点。\n\n**图 18-4：**表达式 `*pszT = *pszSrc1` 将 `pszSrc1` 指向的字符复制到 `pszT`\
  \ 指向的位置。\n\n![617977-fg1804.eps](img/617977-fg1804_fmt.jpeg)\n\n程序的其余部分与第 17 章中的版本相同，执行程序的结果也完全相同：\n\
  \n此程序接受来自键盘的两个字符串，并将它们拼接在一起输出。\n\n输入第一个字符串：this is a string\n输入第二个字符串：SO IS THIS\n\
  将第一个字符串连接到第二个后面\n结果：<this is a stringSO IS THIS>\n\n按任意键继续 . . .\n\n## 为什么要费心数组指针？\n\
  \n基于指针的字符字符串操作有时具有晦涩的性质，这可能会让读者产生为什么要这么做的疑问。也就是说，`char*` 指针版本的 `concatenateString()`\
  \ 相比于更易读的索引版本，其优势何在何？\n\n**图 18-5：**`for` 循环的递增子句将源指针和目标指针都指向数组中的下一个位置。\n\n![617977-fg1805.eps](img/617977-fg1805_fmt.jpeg)\n\
  \n注意：“更易读”取决于个人喜好。对于一个经验丰富的 C++ 程序员来说，指针版本和索引版本一样容易理解。\n\n答案部分源于历史，部分源于人性的。尽管对于人类读者来说它可能看起来很复杂，但像\
  \ `pszT = *pszSrc1` 这样的语句可以转换为极少量的机器指令。按照今天的标准，旧的计算机处理器并不快。当 C++ 的祖先 C 在 40 年前引入世界时，节省几条计算机指令是一项大工程。指针算术让\
  \ C 相比当时的其他语言具有巨大优势，特别是 Fortran，后者并不提供指针算术。比起其他任何单一特征，这一点对 C 及其后的 C++ 领先于竞争对手起到了更大的作用。\n\
  \n此外，程序员喜欢编写巧妙的程序语句来对抗那些重复且无聊的工作。一旦 C++ 程序员学会了如何编写紧凑、晦涩但高效的语句，他们就不会再想回到使用索引来扫描数组了。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)  不要掉入将尽可能多的内容挤进单个 C++ 语句的陷阱，误认为几条\
