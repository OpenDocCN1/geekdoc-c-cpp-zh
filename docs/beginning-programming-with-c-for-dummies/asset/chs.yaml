  \    case ‘/’:\n      printErr(__LINE__, cOperator, nOper1, nOper2);\n      nResult\
  \ = nOper1 / nOper2;\n      break;\n    case ‘%’:\n      printErr(__LINE__, cOperator,\
  \ nOper1, nOper2);\n      nResult = nOper1 % nOper2;\n      break;\n    default:\n\
  \      // 无法识别操作符\n      cout << “ is not understood\";\n  }\n  return nResult;\n\
  }\n```\n\n`printErr()` 函数显示操作符的值和两个操作数。它还显示了调用该函数的行号。行号是由 C++ 预处理器以 `__LINE__` 符号的形式提供的。在错误消息中打印行号可以帮助我将调试输出与程序的正常输出区分开。\n\
