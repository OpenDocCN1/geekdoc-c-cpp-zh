  \ 模块编译时间（不是当前时间） |\n| `__FUNCTION__` | `const char*` | 当前函数名称（仅限 GCC） |\n| `__PRETTY_FUNCTION__`\
  \ | `const char*` | 当前函数的扩展名称（仅限 GCC） |\n\n你还没有见过 `const char*` 类型。你将在第 16 章看到它。你现在必须相信我的，这是包含双引号如“Stephen\
