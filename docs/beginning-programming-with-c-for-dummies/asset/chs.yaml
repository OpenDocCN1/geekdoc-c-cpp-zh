  \ 的 `calculator()` 版本中使用的（以下代码段摘自程序 `CalculatorError2`，位于附带的 CD-ROM 上）：\n\n```cpp\n\
  void printErr(int nLN, char cOperator, int nOper1, int nOper2)\n{\n    cout << “On\
  \ line “ << nLN\n         << “: \\’” << cOperator\n         << “\\’ operand 1 =\
  \ “ << nOper1\n         << “ and operand 2 = “ << nOper2\n         << endl;\n}\n\
  ```\n\n\n\n\n// 对 nOper1 和 nOper2 执行的操作\n\n```cpp\nint calculator(char cOperator,\
  \ int nOper1, int nOper2)\n{\n  printErr(__LINE__, cOperator, nOper1, nOper2);\n\
  \  int nResult = 0;\n  switch (cOperator)\n  {\n    case ‘+’:\n      printErr(__LINE__,\
  \ cOperator, nOper1, nOper2);\n      nResult = nOper1 + nOper2;\n    case ‘-’:\n\
