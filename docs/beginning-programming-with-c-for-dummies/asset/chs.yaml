  \ 代表 Change Directory）导航到相应的窗口。\n\n使用图 18-7 提供的目录路径，我会输入以下内容：\n\n```cmd\nCD \\Beginning_Programming-CPP\\\
  PrintArgs\\bin\\Debug\nPrintArgs file1 file2 /w\n```\n\nLinux 和 Macintosh 的细节略有不同，但相似。\n\
  \n### 从 Code::Blocks 环境向你的程序传递参数\n\n你可以通过在 Code::Blocks 内部选择 `Project⇒Set Projects’\
  \ Arguments` 向你的程序传递参数。这会打开图 18-9 所示的对话框。在 `Program Arguments` 字段中输入参数。\n\n**图 18-9：**\
  \ 你可以设置程序 Code::Blocks。\n\n![617977-fg1809.eps](img/617977-fg1809_fmt.jpeg)执行 Code::Blocks\
  \ 会打开一个显示以下窗口：\n\n```text\nArgument 0 is <printargs>\nArgument 1 is <file1>\nArgument\
  \ 2 is <file2>\nArgument 3 is </w>\n```\n\n\n\n\n\n你可以将不同类型的关联数据存储在所谓的“并行数组”中。例如，我可能会使用一个名为\
  \ `pszFirstNames` 的字符串数组来存储人的名字，使用第二个数组 `pszLastNames` 存储姓氏，并使用第三个数组 `nSocialSecurities`\
  \ 存储对应的社会安全号。我存储数据的方式是使得任何给定的索引 `n` 都指向某个特定个人的数据。\n\n因此，我的个人数据可能位于偏移量 `3` 处。在这种情况下，`szFirstNames[3]`\
  \ 指向“Stephen”，`szLastNames[3]` 指向“Davis”，而 `nSocialSecurityNumbers[3]` 将包含 . . .\
  \ 额吧，你懂我意思。这在图 19-1 中所示。\n\n**图 19-1：** 在不支持类的语言中，并行数组有时被用于存储一组相关但不同类型的数据集合。\n\n\
  ![617977-fg1901.eps](img/617977-fg1901_fmt.jpeg)\n\n这种方法虽然可行，但很容易出错，因为除了索引之外，没有东西能直接将名字、姓氏和社会安全号关联起来。你可以很容易想象，如果这里或那里漏掉了一条指令，我就会变成“Stephen\
  \ Eddins”或任何其他姓氏的随机组合。\n\n对我们幸运的是，C++ 提供了一种更好的方法。\n\n## 类 (The Class)\n\n名字或社会安全号如果脱离了它们所属的人这一上下文，就没有意义了——这类数据必须通过与其它相关数据的关联来创建一个上下文。我们希望能够创建一个结构，例如\
  \ `Person`，它包含了构成一个人的所有相关属性（在本例中，为名字、姓氏和社会安全号）。\n\nC++ 使用了一种名为 `class`（类）的结构体类型，其格式如下：\n\
  \n```cpp\nclass Person\n{\npublic:\nchar szFirstName[128];\nchar szLastName[128];\n\
  int nSocialSecurityNumber;\n};\n```\n\n类的定义以 `class` 关键字开始，后面紧跟类名和一个左大括号。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 类名的命名规则与变量名相同：第一个字母必须是 ‘a’ 到 ‘z’ 或 ‘A’ 到 ‘Z’ 之间的字母之一，或者是下划线。名称中的后续每个字符必须是这些字符或数字\
  \ ‘0’ 到 ‘9’ 之一。按照惯例，类名始终以大写字母开头。类名通常由多个单词组合而成，每个单词都以大写字母开头。\n\n在早期示例中，左大括号内的第一个关键字始终是\
  \ `public`。我将在第 24 章中介绍 `public` 的替代方案，但现在只需先将其视为声明的一部分即可。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 你也可以使用关键字 `struct` 来代替 `class`。在任何方面，`struct` 都与 `class` 相同，唯一的区别在于 `struct` 默认是\
  \ `public`（公开的）。由于历史原因，`class` 术语在 C++ 中更流行，而 `struct` 在 C 程序中使用得更多。\n\n跟在 `public`\
  \ 关键字后面的是描述该类所需的条目的声明。`Person` 类包含两个用于名字和姓氏的数组，以及一个存储社会安全号的第三项。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 类内部的项被称为类的成员 (members) 或属性 (properties)。\n\n## 对象 (The Object)\n\n在 C++ 中声明一个\
  \ `class` 就像定义一个新的变量类型。你可以按照如下方式创建一个 `class` 的新实例：\n\n```cpp\nPerson me;\n```\n\n\
  类的实例被称为对象 (object)。\n\n![tip.eps](img/tip_fmt.jpeg) 人们经常混淆 `class` 和 `object` 之间的区别；有时甚至交替使用这两个术语。实际上，用例子很容易解释这种区别。`Dog`\
  \ 是一个 `class`。我的狗 Lollie 是一个 `dog` 的实例。我的另一只狗 Jack 是另一个独立的 `dog` 实例。`Dog` 是一个 `class`；`lollie`\
  \ 和 `jack` 是对象。\n\n你可以通过在对象名后加上点运算符 `.` 来访问对象的成员，如下所示：\n\n```cpp\nPerson me;\nme.nSocialSecurityNumber\
  \ = 456789012;\ncin >> me.szLastName;\n```\n\n在这里，`me` 是 `Person` 类的对象。元素 `me.nSocialSecurityNumber`\
  \ 是 `me` 对象的成员或属性。`me` 的类型是 `Person`。`me.nSocialSecurityNumber` 的类型是 `int`，其值设置为\
  \ `456-78-9012`。`me.szLastName` 的类型是 `char[]`（读作“char 数组”）。\n\n类对象可以在创建时按如下方式初始化：\n\
  \n```cpp\nPerson me = {\"Stephen”, “Davis”, 456789012};\n```\n\n赋值是用户定义类默认定义的操作。其用法所示：\n\
  \n```cpp\nPerson copyOfMe;\ncopyOfMe = me; // 将 me 的每个成员拷贝到 copyOfMe\n```\n\n默认赋值运算符将右侧对象的成员拷贝到左侧对象的成员中。赋值运算符两侧的对象必须具有完全相同的类型。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 对象的数组 (Arrays of Objects)\n\
  \n在 C++ 中声明一个 `class` 就像定义一个新的变量类型。你可以按照如下方式声明并初始化对象数组：\n\n```cpp\nPerson people[5]\
  \ = {{Adam”, “Laskowski”, 123456}, {Kinsey”, 67890}, {“Tiffany”, 0123}};\n```\n\n\
  这种方法可行，但很容易出错，因为除了索引之外，没有东西能直接将名字、姓氏和社会安全号关联起来。你可以很容易想象，如果这里或那里漏掉了一条指令，我就会变成“Stephen\
  \ Eddins”或任何其他姓氏的随机组合。\n\n因此，我的个人数据可能位于偏移量 `3` 处。在这种情况下，`szFirstNames[3]` 指向“Stephen”，`szLastNames[3]`\
  \ 指向“Davis”，而 `nSocialSecurityNumbers[3]` 将包含 . . . 额吧，你懂我意思。这在图 19-1 中所示。\n\n**图\
  \ 19-1：** 在不支持类的语言中，并行数组有时被用于存储一组相关但不同类型的数据集合。\n\n![617977-fg1901.eps](img/617977-fg1901_fmt.jpeg)\n\
  \n对我们幸运的是，C++ 提供了一种更好的方法。\n\n## 查看示例 (Looking at an Example)\n\n在没有示例程序的情况下，我解释得已经够深了。下面的\
  \ `InputPerson` 程序输入数组数据，然后按社会安全号对数组进行排序并输出列表。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 我使用的排序算法被称为冒泡排序。它并不高效，但代码非常简单。我将在侧边解释它的工作原理，但不要陷入细节中。重点关注程序如何将 `Person` 的关键元素输入到数组元素中，以便它可以作为一个整体对其进行操作。\n\
  \n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace\
  \ std;\n\n// Person - 存储名字和社会安全号\nclass Person\n{\npublic:\nchar szFirstName[128];\n\
  char szLastName[128];\nint nSocialSecurityNumber;\n};\n\n// getPerson - 从键盘读取 Person\
  \ 对象\n// 并将其返回给调用者\nPerson getPerson()\n{\nPerson person;\ncout << \"\\nEnter another\
  \ Person\\n”\n<< “First name: “;\ncin >> person.szFirstName;\ncout << “Last name:\
  \ “;\ncin >> person.szLastName;\ncout << “Social Security number: “;\ncin >> person.nSocialSecurityNumber;\n\
  return person;\n}\n\n// getPeople - 读取一个 Person 对象数组；\n// 返回读取的数量\nint getPeople(Person\
  \ people[], int nMaxSize)\n{\n// 一直运行直到操作符说完成\n// 直到空间用尽\nint index;\nfor(index\
  \ = 0; index < nMaxSize; index++)\n{\nchar cAnswer;\ncout << “Enter another name?\
  \ (Y or N):”;\ncin >> cAnswer;\nif (cAnswer != ‘Y’ && cAnswer != ‘y’)\n{\nbreak;\n\
  }\n}\nreturn index;\n}\n\nint main()\n{\nPerson people[10];\nint count = getPeople(people,\
  \ 10);\n// ... 排序和打印逻辑 ...\nreturn 0;\n}\n```\n\n\n\n\n\n```cpp\npeople[index] =\
  \ getPerson();\n\n}\n\nreturn index;\n\n}\n\n// displayPerson - display a person\
  \ on the default display\n\nvoid displayPerson(Person person)\n\n{\n\ncout << “First\
  \ name: “ << person.szFirstName << endl;\ncout << “Last name : “ << person.szLastName\
  \ << endl;\ncout << “Social Security number : “\n<< person.nSocialSecurityNumber\
  \ << endl;\n}\n\n// displayPeople - display an array of Person objects\n\nvoid displayPeople(Person\
  \ people[], int nCount)\n{\nfor(int index = 0; index < nCount; index++)\n{\ndisplayPerson(people[index]);\n\
  }\n}\n\n// sortPeople - sort an array of nCount Person objects\n// by Social Security\
  \ Number\n// (this uses a binary sort)\nvoid sortPeople(Person people[], int nCount)\n\
  {\n// keep going until the list is in order\nint nSwaps = 1;\nwhile(nSwaps != 0)\n\
  {\n// we can tell if the list is in order by\n// the number of records we have to\
  \ swap\nnSwaps = 0;\n// iterate through the list...\nfor(int n = 0; n < (nCount\
  \ - 1); n++)\n{\n// ...if the current entry is greater than\n// the following entry...\n\
  if (people[n].nSocialSecurityNumber >\npeople[n+1].nSocialSecurityNumber)\n{\n//\
  \ ...then swap them...\nPerson temp = people[n+1];\npeople[n+1] = people[n];\npeople[n]\
  \ = temp;\n// ...and count it.\nnSwaps++;\n}\n}\n}\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n// allocate room for some names\nPerson people[128];\n//\
  \ prompt the user for input\ncout << “Read name/social security information\\n”;\n\
  int nCount = getPeople(people, 128);\n// sort the list\nsortPeople(people, nCount);\n\
  // now display the results\ncout << “\\nHere is the list sorted by “\n<< “social\
  \ security number” << endl;\ndisplayPeople(people, nCount);\n// wait until user\
  \ is ready before terminating program\n// to allow the user to see the program results\n\
  system(“PAUSE”);\nreturn 0;\n}\n```\n\n程序首先声明了 `Person` 类，并包含了用于名、姓和社会安全号的数据成员。与良好的编程习惯相反，此程序使用固定长度的数组来处理名称字符串。（如果我是在为商业软件包编写这些代码，我会使用变长数组，或者包含一个测试以确保从键盘读取的输入不会溢出缓冲区。如果你不知道我在说什么，请参阅第\
  \ 17 章。）\n\n第一个函数 `getPerson()` 提示用户输入描述单个 `Person` 对象所需的数据。然后，它将该 `Person` 的拷贝返回给调用者。\n\
  \n第二个函数 `getPeople()` 重复调用 `getPerson()` 函数以获取多个个人的数据。它将获取到的 `Person` 对象存储在 `people`\
  \ 数组中。该函数接受 `people` 数组的最大尺寸作为参数，并向调用者返回存储在该处的实际元素数量。\n\n`displayPerson()` 和 `displayPeople()`\
  \ 函数是 `getPerson()` 和 `getPeople()` 函数的输出对类项。`displayPerson()` 输出单个个体的信息，而 `displayPeople()`\
  \ 则对 `people` 数组中定义的每个元素调用该函数。\n\n`sortPeople()` 函数按照社会安全号递的顺序对 `people` 数组的元素进行排序。该函数在“冒泡排序”侧边栏中描述。不要过于担心这个函数是如何工作的。如果你能跟上程序的其余部分，你已经领先很多了。\n\
  \n该程序测试运行的输出如下：\n\nRead name/social security information\nEnter another name? (Y\
  \ or N):y\nEnter another Person\nFirst name: Adam\nLast name: Laskowski\nSocial\
  \ Security number: 123456789\nEnter another name? (Y or N):y\nEnter another Person\n\
  First name: Stephen\nLast name: Davis\nSocial Security number: 456789012\nEnter\
  \ another name? (Y or N):y\nEnter another Person\nFirst name: Janet\nLast name:\
  \ Eddins\nSocial Security number: 345678901\nEnter another name? (Y or N):n\nHere\
  \ is the list sorted by social security number.\nFirst name: Adam\nLast name : Laskowski\n\
  Social Security number : 123456789\nFirst name: Janet\nLast name : Eddins\nSocial\
  \ Security number : 345678901\nFirst name: Stephen\nLast name : Davis\nSocial Security\
  \ number : 456789012\nPress any key to continue . . .\n\n你已经看到了 C++ 的大部分非面向对象特性。下一章将向你介绍\
  \ Code::Blocks 调试器，它总结了我所谓的“函数式编程”相关章节。之后，我将在第五部分开始介绍面向对象编程。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n## 冒泡排序\n\n本书的大部分内容都在 C++ 语法上。然而，除了语言细节之外，你还需要学习常见的编程算法才能成为一名精通的程序员。冒泡排序是每个程序员都应该掌握的算法之一。\n\
  \n字段排序有许多常见的算法。每种算法都有自己的优势。冒泡排序非常容易编写，但执行速度较慢，而真正的算法更难编写。对于小数据集，冒泡排序的简单性远大于其性能缺点。几千个条目的数组在现代处理器上可以在一秒内完成排序。\n\
  \n在冒泡排序中，程序对数据集进行多次遍历。在每次遍历中，它比较每个元素与下一个元素。如果元素 `N` 小于 `N+1`，则它们顺序正确，冒泡排序不采取行动。然而，如果元素\
  \ `N` 大于 `N+1`，冒泡排序就会交换它们，然后处理下一个元素。实际操作如下：\n\n```cpp\n// if the current entry is\
  \ greater than\n// the following entry...\nif (people[n].nSocialSecurityNumber >\n\
  people[n+1].nSocialSecurityNumber)\n{\n// ...then swap them...\nPerson temp = people[n+1];\n\
  people[n+1] = people[n];\npeople[n] = temp;\n// ...and count it.\nnSwaps++;\n}\n\
  ```\n\n第一次遍历结束后，最大的元素将移动到数组末尾，但数组的其他部分仍然没有顺序。然而，重复遍历数组会导致每个元素“泡”到它的位置。冒泡排序通过在遍历列表之前将计数器\
  \ `nSwaps` 清零来设置每次的交换次数。该算法并不真正关心执行了多少交换；如果执行了任何交换，说明数组还没有顺序。然而，一旦冒泡排序能够完整遍历列表而不执行任何交换，它就知道数组已经有序了。\n\
  \n该图演示了冒泡排序如何排序一个五个整数数组。在第一次遍历期间，执行了两次交换。在第二次遍历中，算法只执行了一次交换。结果列表已经排序，但算法只有在第三次遍历（如图所示）不进行任何交换时才知道这一点。此时，冒泡排序完成。\n\
  \n## 第 20 章：调试你的程序，部分 3\n\n### 本章内容\n- 使用内置调试器进行调试\n- 使用调试信息构建应用程序\n- 设置断点\n- 单步执行程序\n\
  - 解决示例问题\n\n我在第二部分（第 8 章）和第三部分（第 13 章）结束时介绍了一些寻找错误的方法。现在你正接近第四部分的结尾，我想最后提一下调试技术。在本章中，我向你介绍了\
  \ Code::Blocks 开发环境中内置的调试工具（大多数其他环境也有类似的工具）。学习使用调试器将让你清晰地了解你的程序在做什么（以及有时它没在做什么）。\n\
  \n\n\n\n\n# 一种新的调试方法\n\n第 8 章和第 13 章演示了如何在关键位置添加输出语句来查找问题。输出关键变量可以让你看到程序计算的中间值，以及它在你的\
  \ `C++` 代码中执行的路径。\n\n然而，输出技术有几个明显的缺点。第一个是很难知道应该显示什么。在小型程序中（如书中的大多数程序），你几乎可以显示所有内容——因为没有那么多变量需要去梳理。然而，在一个大型程序中，可能有成百上千个变量，特别是当你包含了数组中的所有元素时。知道要显示哪些变量可能是一个问题。\n\
  \n第二个问题是重新编译程序所需的时间。再次，这对于小型程序来说不是问题。`Code::Blocks` 只需几秒钟即可重新编译小型程序。在这种情况下，添加或更改输出语句花费不超过几分钟。然而，我曾参与过一些项目，编译整个程序需要好几个小时。在大型程序中，当你定位一个\
  \ bug 时，添加新的输出语句可能花费很长时间。\n\n最后，使用输出法调试指针问题是非常困难的。如果指针是无效的，任何使用它的尝试都会程序终止，而仅仅通过在\
  \ `cout` 上显示它的值来区分有效指针和无效指针几乎是不可能的。\n\n## 解决方案\n\n你需要的是一种在程序执行过程中停止程序并查询关键变量值的方法。这正是调试器的功能。\n\
  \n调试器实际上是内置在 `Code::Blocks` 环境中的一个工具。每个环境都有某种类型的调试器，它们提供相同的基础功能，尽管具体的命令可能不同。调试器允许程序员控制程序的执行。她可以一次执行程序中的一步，她可以在任何点停止程序，并可以检查变量的值。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 与标准化的 `C++` 语言不同，每个调试器都有自己的命令集。幸运的是，一旦你学会了如何使用 `Code::Blocks`\
  \ 调试器，学习使用你喜爱的 `C++` 环境自带的调试器就不会有困难。\n\n程序员通过在 `Code::Blocks` 环境中从键盘输入命令来控制调试器，就像她使用编辑命令修改\
  \ `C++` 源代码或使用构建命令创建可执行程序一样。调试命令既可以通过菜单也可以通过热键调用。\n\n学习如何使用 `Code::Blocks` 调试器的最佳方法是利用它在你见过的某个程序的带\
  \ bug 版本中找到几个棘手问题。\n\n## 菜鸟虫入门\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `Concatenate`\
  \ 程序（你可以在随附的 CD-ROM 上找到名为 `ConcatenateError1`）代表了我对第 18 章 `ConcatenateHeap` 程序的第一次尝试。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 这个版本至少有两个严重的 bug，它们都在 `concatenateString()` 函数中。\n\
  \n```cpp\n//\n\n// ConcatenateError1 - 与 ConcatenatePtr 类似，但\n\n// 这个版本有几个 bug\n\
  \n// 可以通过调试器\n// 很容易地找到\n\n//\n\n#include <cstdio>\n\n#include <cstdlib>\n\n#include\
  \ <iostream>\n\n#include <cstring>\n\nusing namespace std;\n\n// concatenateString\
  \ - 将两个字符串拼接\n\n// 存储在堆上分配的数组中\nchar* concatenateString(const char* pszSrc1,\n\n\
  const char* pszSrc2)\n{\n    // 分配一个长度足够的数组\n    int nTargetSize = strlen(pszSrc1)+strlen(pszSrc2)+1;\n\
  \    char* pszTarget = new char[nTargetSize];\n    // 首先将第一个字符串拷贝到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容拷贝到\n\
  \    // 第一个字符串的结尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n    // 将结果返回给调用者\n    return pszTarget;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 提示用户\n    cout << \"This program accepts two strings\\\
  n\"\n    << \"from the keyboard and outputs them\\n\"\n    << \"concatenated together.\\\
  n\" << endl;\n    // 输入两个字符串\n    cout << \"Enter first string: \";\n    char szString1[256];\n\
  \    cin.getline(szString1, 256);\n    cout << \"Enter the second string: \";\n\
  \    char szString2[256];\n    cin.getline(szString2, 256);\n    // 现在将一个拼接到另一个的后面\n\
  \    cout << \"Concatentate first string onto the second\"\n    << endl;\n    char*\
  \ pszT = concatenateString(szString1, szString2);\n    // 并显示结果\n    cout << \"\
  Result: <\"\n    << pszT\n    << \">\" << endl;\n    // 将内存还给堆\n    delete pszT;\n\
  \    pszT = NULL;\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n    system(\"PAUSE\"\
  );\n    return 0;\n}```\n\n以下是执行程序的运行结果\n\n```\nThis program accepts two strings\n\
  from the keyboard and outputs them\nconcatenated together.\n\nEnter first string:\
  \ this is a string\nEnter the second string: THIS ALSO A STRING\nConcatentate first\
  \ string onto the second\nResult: <this is a stringTHIS ALSO A STRING>\n``` 启动调试器\n\
  \n假设我已经告诉 `Code::Blocks` 在可执行文件中包含调试信息。\n\n我很确定问题出在 `concatenateString()` 函数本身。因此，我想在调用\
  \ `concatenateString()` 时停止程序执行。为了做到这一点，我需要执行所谓的设置断点。\n\n断点是调试器的一个命令，表示“如果到达此处，请停止程序执行”。至少有四种设置断点的方法，它们都是等价的：\n\
  \n在第 60 行行号右侧点击（见图 20-2）。\n\n在第 60 行上右键点击并从菜单中选择 ToggleBreakpoint（它是第一个选项）。\n\n\
  将光标放在第 60 行并按 F5（切换断点）。\n\n## 打开调试信息\n\n我可以随时通过选择 `Settings⇒Compiler and Debugger`\
  \ 来开启调试信息，并确保 `Compiler Settings` 窗口中 `Compiler Flags` 子窗口 `Produce Debugging Symbols\
  \ [-g]` 复选框被选中。我必须通过选择 `Build⇒Rebuild` 来重新编译可执行文件，更改才能生效。\n\n我在创建项目时决定了是否包含调试信息。图\
  \ 20-1 显示了项目向导的最后一个对话框，控制台应用程序对话框。默认是生成调试信息，如所示。（不对，不，默认是生成调试信息，如所示）。Release 配置是不包含额外调试信息的版本。如果不创建\
  \ Debug 版本，我就无法使用调试器。\n\n**图 20-1:** 控制台应用程序对话框允许你选择是否构建调试版本的的可执行文件。\n\n\n\n\n\n\
  将光标置于第 60 行并选择 `Debug⇒Toggle Breakpoint`。\n\n对于本章中描述的几乎每一个其他调试器命令，都有多种方法可以输入，但为了简洁起见，我只描述了一种。你可以通过实验来发现其他方法。\n\
  \n行号的右侧会出现一个小小的停止符号，如图 20-2 所示。\n\n**图 20-2：** 一个小小的红色停止符号表示在指定位置已设置了断点。\n\n![617977-fg2002.eps](img/617977-fg2002_fmt.jpeg)\n\
  \n要启动程序，我选择 `Debug⇒Start`。起初，程序的执行看起来很正常。它首先提示我输入第一个字符串，接着提示我输入第二个字符串。然而，当我输入该字符串后，程序似乎停止了，在源代码显示器的停止符号内部出现了一个小小的黄色箭头。如图\
  \ 20-3 所示。这个小小的黄色箭头是当前位置指示器。它指向下一个要执行的 C++ 行。\n\n**图 20-3：** 当程序遇到断点时，程序停止执行，并在下一行执行处出现一个小小的黄色箭头。\n\
  \n![617977-fg2003.eps](img/617977-fg2003_fmt.jpeg)\n\n你从图 20-3 中还会注意到另一个工具栏出现了。调试器工具栏包含了最常用的调试命令，包括在本章中演示的大部分命令。（我为本章稍后将描述的命令添加了注释。）\n\
  \n### 使用调试器在程序中导航\n\n好了，我已经成功使用调试器在程序中间停止了执行。现在我能做些什么呢？\n\n我将从逐语句执行 `concatenateString()`\
  \ 函数开始。我可以在函数的第一条指令处设置一个新的断点，但在每行上都设置新断点是繁琐的。幸运的是，`Code::Blocks` 调试器提供了一个更方便的选择：`Step\
  \ Into`（单入）命令。\n\n![tip.eps](img/tip_fmt.jpeg) 在 Debug 工具栏上，这是从左侧数的第五个命令。然而，如果你感到困惑，此菜单有工具提示（Tool\
  \ Tips）——只需将箭头指向工具栏上的命令并保持不动。几秒后，命令名称就会弹出。或者你也可以从主菜单选择 `Debug⇒Step Into`。\n\n`Step\
  \ Into` 命令执行单个 C++ 语句；在这种情况下，该命令会进入函数调用。执行在 `concatenateString()` 中的第一条可执行语句之前立即停止。接下来，我选择\
  \ `Debug⇒Debugging Windows⇒Watches`（监视）来显示图 20-4 所示的窗口。从这个窗口，可以看到函数的两个参数 `pszSrc1`\
  \ 和 `pszSrc2` 似乎是正确的。\n\n![remember.eps](img/remember_fmt.jpeg) 此时 `nTargetSize`\
  \ 和 `pszTarget` 的值没有意义，因为它们还没有初始化。\n\n**图 20-4：** Watches（监视）窗口显示了函数的参数以及任何局部定义的变量。\n\
  \n![617977-fg2004.eps](img/617977-fg2004_fmt.jpeg)\n\n我可以再次选择 `Step Into` 向前移动，这将让我进入\
  \ `strlen()` 函数。由于这些是 C++ 库例程，我乐意接受它们运行良好。\n\n另一个选项被称为 `Next Line`（下一行）。`Next Line`\
  \ 跳到当前函数中的下一行 C++ 代码，将函数调用视为与任何其他 C++ 命令一样。\n\n![tip.eps](img/tip_fmt.jpeg) `Step\
  \ Into` 和 `Next Line` 合称为单步执行命令。对于函数调用以外的命令，这两个命令是等价的。许多调试器使用 `Step Over`（单步跳）而不是\
  \ `Next Line` 来突出其与 `Step Into` 的区别。\n\n我从 Debug 工具栏中选择 `Next Line`。注意当前位置指针是如何从第\
  \ 21 行移动到第 22 行的，如图 20-5 所示。此外，`nTargetSize` 变量在 Watch 窗口中被红色高亮，表示其值已经发生了变化。`nTargetSize`\
  \ 的值现在是 38，这是两个字符串之和的正确长度。\n\n**图 20-5：** 选择 `Next Line` 将当前位置指针移动到第 22 行并初始化 `nTargetSize`。\n\
  \n![617977-fg2005.eps](img/617977-fg2005_fmt.jpeg)\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你必须绝对清楚刚刚发生了什么。你看到的只是屏幕闪烁，当前位置指针向下移动了一行。实际发生的情况是调试器在第 22 行设置了一个临时断点，然后从第 21 行重新启动程序。程序执行了两次对\
  \ `strlen()` 的调用，然后执行加法，并将结果存储在 `nTargetSize` 中。你可能只看到执行了一行代码，但实际上在 `strlen()` 函数内部执行了许多行\
  \ C++ 代码（实际上执行了两次）。\n\n到为止一切顺利，我多选择几次 `Next Line` 直到进入 while 循环。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 这个 while 循环的结构与你见过的略有不同。在这里我们在赋值语句中增加指针，而不是在循环的一部分，如下：\n\n```cpp\nwhile(*pszSrc1\
  \ != '\\0')\n{\n    *pszTarget++ = *pszSrc1++; // 27\n```\n\n程序的 27 行说，“将 pszSrc1\
  \ 的值存入 pszTarget”。图 20-6 显示了我在执行几次后在监视窗口中高亮的内容。\n\n**图 20-6：** while 循环增加了 `pszSrc1`。\n\
  \n![617977-fg2006.eps](img/617977-fg2006_fmt.jpeg)\n\n此外注意到指向 `pszSrc1` 的字符串似乎在缩短。这是因为随着\
  \ `pszSrc1` 的增加，它最终指向空字符。这就是控制将离开 while 循环的时候。\n\n但是！指向 `pszTarget` 的字符串并没有增长。思考片刻后，答案显而易见：我改变了\
  \ `pszTarget` 的值，并遗留了复制的内容。这就是我最初函数的问题所在。\n\n现在知道了问题（至少是一个问题），我通过点击 Debug 工具栏上的\
  \ `Stop Debugger` 来停止调试器。控制应用程序对话框立即消失，`Code::Blocks` 显示返回到编辑界面。\n\n### （第一个）bug\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 要解决我提到的问题，只需要保存 `new` 返回的值并返回它，而不是返回函数中修改后的\
  \ `pszTarget` 指针。我在这里包含了修改后的 `concatenateString()` 函数（整个程序位于随附的光盘上，名为 `ConcatenateError2`）：\n\
  \n```cpp\nchar* concatenateString(const char* pszSrc1, const char* pszSrc2)\n{\n\
  \    // 分配足够长度的数组\n    int nTargetSize = strlen(pszSrc1)+strlen(pszSrc2)+1;\n  \
  \  char* pszTarget = new char[nTargetSize];\n    char* pszT = pszTarget; // 保存返回的指针\n\
  \    // 首先将第一个字符串复制到目标\n    while(*pszSrc1 != '\\0')\n    {\n        *pszTarget++\
  \ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容复制到第一个的结尾\n    while(*pszSrc2 != '\\\
  0')\n    {\n        *pszTarget++ = *pszSrc2++;\n    }\n    // 返回原始指针给调用者\n    return\
  \ pszT;\n}\n```\n\n在这里，我将 `new` 返回的值同时保存到 `pszTarget`（我打算增加它）和 `pszT`（它将保持未修改）中。函数返回后者未修改的指针给调用者。\n\
  \n\n\n\n我重新构建了应用程序，然后重复早前的步骤，单步执行 `concatenateString()` 中的第一个循环。图 20-7 显示了执行七次循环后的显示。\n\
  \n**图 20-7：**更新后的 `concatenateString()` 函数的监视（Watches）窗口显示了正在 `pszT` 指向的数组中构建的字符串。\n\
  \n![617977-fg2007.eps](img/617977-fg2007_fmt.jpeg)\n\n注意 `pszT` 如何指向包含源字符串前七个字符的数组。同时也注意\
  \ `pszTarget` 的值比 `pszT` 大了 7。\n\n但也要注意 `pszT` 字符串中出现在 `this is` 之后的所有垃圾字符。`Code::Blocks`\
  \ 显示了额外的垃圾字符，是因为目标字符串没有终止空字符。它现在不需要空字符，因为我还没有完成它的构建。\n\n### 寻找并修复第二个错误\n\n这两个源字符串并不长，所以我使用“单步执行”（Next\
  \ Line）命令单步执行整个循环。图 20-8 显示了最后执行一次第二个循环后的调试（Debug）窗口。在这里，`pszT` 指向已完成的目标字符串，两个源字符串已拼接。然而，由于缺少空字符，字符串在最后一个字符之后仍然显示垃圾字符。\n\
  \n**图 20-8：**最后执行一次第二个循环后的调试窗口。\n\n![617977-fg2008.tif](img/617977-fg2008_fmt.jpeg)\n\
  \n因为我已经完成了该函数，我在 `Code::Blocks` 菜单中选择 `Debug⇒Continue`。这导致调试器从上次停止的地方恢复程序，并继续到下一个断点或程序结束，以先到者为准。\n\
  \n果其然，显示的合并数组包含了我在调试器中看到的相同垃圾字符：\n\n```\nThis program accepts two strings\nfrom\
  \ the keyboard and outputs them\nconcatenated together.\n\nEnter first string: this\
  \ is a string\nEnter the second string: THIS IS ALSO A STRING\n\nConcatentate first\
  \ string onto the second\nResult: <this is a stringTHIS IS ALSO A STRING![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)![smile.eps](img/smile.jpg)>\n\
  \nPress any key to continue . . .\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 如果我没有包含终止空字符，那么是什么导致 `concatenateString()` 返回的字符串终止了呢？为什么字符串没有持续显示好几页？简单的回答是是：“什么也没有”。可能是\
  \ C++ 必须显示成千上万个字符，最终才会遇到一个包含空字符的字符。在实践中，这种情况很少发生。零是内存中最常见的值。你通常不需要找得太远就能找到一个包含零的字节，从而终止字符串。\n\
  \n要解决这个问题，我所需要做的就是在最后一个 `while` 循环之后添加一个终止空字符：\n\n```cpp\nchar* concatenateString(const\
  \ char* pszSrc1,\nconst char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    char* pszT = pszTarget; // 保存一个指针以返回\n\n    // 首先将第一个字符串拷贝到目标中\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n\n    // 现在将第二个字符串的内容拷贝到\n\
  \    // 第一个的末尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n\n    // 添加终止 NULL\n    *pszTarget = '\\0';\n\n    // 将未修改的指针返回给调用者\n  \
  \  return pszT;\n}\n```\n\n在调试器中执行此版本会产生图 20-9 所示的显示。注意，一旦添加了终止空字符，`pszT` 指向的字符串就会神奇地“清理”，丢失掉所有在我放在那里的数据之后之后字符串上的垃圾字符。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 让我明确一下：那些垃圾字符仍然在那里。只是终止空字符导致 C++ 不显示它们。程序的输出是你们已经喜爱并钦仰的可预测字符串：\n\
  \n```\nThis program accepts two strings\nfrom the keyboard and outputs them\nconcatenated\
  \ together.\n\nEnter first string: this is a string\nEnter the second string: THIS\
  \ IS ALSO A STRING\n\nConcatentate first string onto the second\nResult: <this is\
  \ a stringTHIS IS ALSO A STRING>\n\nPress any key to continue . . .\n```\n\n**图\
  \ 20-9：**添加终止空字符移除了合并字符串末尾的所有垃圾字符。\n\n![617977-fg2009.eps](img/617977-fg2009_fmt.jpeg)\n\
  \n通过在关键位置添加输出语句可以在小型程序中发现问题。然而，调试器是一个优雅得多且强大的工具。单步执行程序可以让你对代码在做什么有真实的感受。`Code::Blocks`\
  \ 自带的调试器非常好用。\n\n# 第五部分面向对象编程\n\n![617977-fg2007.eps](img/617977-fg2007_fmt.jpeg)\n\
  \n在第 I 到 IV 部分中，我们将 C++ 描述为另一种函数语言，与其前身相比并不大。这一部分介绍了面向对象编程的概念。这些概念在 20 世纪 80 年代采用时彻底改变了编程界。这是让\
  \ C++ 成为真正语言的部分。\n\n# 第 21 章什么是面向对象编程？\n\n## 本章内容\n- 抽象细节\n- 将面向对象的方法与函数方法进行对比\n\
  - 分类\n\n生活中例子随处不在。我面前有一把椅子、一张桌子、一台电脑和一个红杯子。将这些物体分类并不困难。例如，杯子是一个容器，它还是一个绝缘体，所以可以用它盛装热物品；它还有质量，所以我可以把它当作镇纸或扔向狗。面向对象编程将这种世界观应用于编程。为了解释我的意思，让我从一个故事开始。\n\
  \n## 抽象与微波炉\n\n有时当我跟我儿子看足球赛时，我会做一些墨西哥饼。并不是什么复杂的菜——我把一些薯片、、豆泥、奶酪和一些辣椒放在盘子里，然后在微波炉里加热五分钟。使用微波炉时，我打开门，把饼放进去，在正面按下几个按钮，然后按开始。几分钟后，铃响了表示好了。如果我做错了，微波炉会对我发出警告声并不启动。有时它会在小显示屏上显示错误信息。\n\
  \n\n\n\n# 这些并不是什么深刻的洞察。人类在任何时候能思考的内容都是有限的。我们往往通过抽象掉所有微小的细节来减少需要处理的事物数量。这使我们能够在与尝试解决的问题相对应的细节水平上进行工作。\n\
  \n注意：在面向对象（OO）术语中，这种细节水平被称为抽象级别。\n\n当我在做墨西哥夹片（nachos）时，我把微波炉看作一个黑盒。除非它坏了，否则我并不关心那个盒内部发生了什么。那时，我可能会拆下顶盖，看看能不能弄清楚哪里出了问题；那时，我就是在另一个抽象级别上工作了。我仍然不会拆开电路板上芯片的顶部，也不会尝试拆解单个组件。（我没那么疯。）\n\
  \n只要微波炉在加热食物，我就将自己限制在它向外界暴露的接口上：键盘和 LCD 显示器。非常重要的一点是，从这个接口无法进行微波炉发生以下情况的操作：\n\n\
  - 进入不一致状态并崩溃（导致我必须重启微波炉）\n- 更糟糕的是，把我的墨西哥夹片变成一片焦黑、冒火的团块\n- 更糟糕的是，起火并烧掉房子\n- 生成功能正常的墨西哥夹片\n\
  \n## 功能正常的墨西哥夹片\n\n假设我让我儿子写一个算法，使用第 1 章中换轮胎的相同基本方法制作墨西哥夹片。他可能会写类似这样的话：“打开一罐豆子，磨一些奶士，切开墨西哥辣椒”，等等。对于加热墨西哥夹片的部分，他会写类似这样的：“放入烤箱中加热直到奶士融化。”\n\
  \n这种描述是直观且完整的，但它并不是函数式程序员编写制作墨西哥夹片程序的方式。函数式程序员生活在一个没有微波炉等对象的世界里。他们倾向于担心那些具有无数功能路径的流程图。在函数式解决方案中，控制流将从我的手指穿过微波炉的前面板，然后进入设备内部。很快，流就会在复杂的逻辑路径中穿行，关注给电容器充电多长时间，以及是否该响“来吃饭了”的提示音了。\n\
  \n在这样的世界里，很难以抽象级别来思考。没有对象，没有可以隐藏内在复杂性的抽象。\n\n## 面向对象的墨西哥夹片\n\n在制作墨西哥夹片的面向对象方法中，我将首先识别问题中的对象类型：芯片、豆子、奶士和烤箱。这些是我必须处理的名词。完成这些后，我将识别与每个对象相关的动词。接下来，我将仅使用之前识别的名词和动词解决问题。最后，然后，只有在那里，我才会在软件中实现这些对象。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 我在第 1 章中为你识别了与换轮胎相关的名词和动词。你剩下的工作就是使用我给你的名词和动词来实现解决方案。\n\
  \n当我编写对象层级代码时，可以说我正在基础对象的抽象级别上工作（并思考）。我需要考虑如何制作一个实用的烤箱，但我还不需要考虑制作墨西哥夹片的过程。毕竟，我微波炉的设计师并没有考虑过我制作零食的特定问题。相反，他们致力于解决设计和建造一台实用的微波炉的问题。\n\
  \n在我成功编码并测试了所需的对象后，我可以提升到下一个抽象级别。我可以开始在制作墨西哥夹片的层面进行思考，而不是在制作微波炉的层面。在这个点上，我几乎可以将我儿子的指令直接翻译成\
  \ `C++` 代码。\n\n## 分类与微波炉\n\n抽象概念的关键在于分类。如果我问我儿子：“什么是微波炉？”他可能会说：“它是一个……的烤箱。”……”如果我接着问：“什么是烤箱？”他可能会回答：“它是一个……的厨房电器。”……”我可以一直问这个问题，在抽象阶梯上不断攀升，直到我得出结论：“它是一个东西”，这是另一种表达方式，即“它是一个对象。”\n\
  \n我儿子理解，我们特定的这台微波炉是“微波炉”这种类型物品的一个实例（instance）。此外，他还认为微波炉仅仅是种特殊的烤箱，而烤箱反过来又是特殊的厨房电器，以此类推。\n\
  \n这种说的技术说法是：我们的烤箱是 `microwave` 类的实例。`microwave` 类是 `oven` 类的子类（subclass），而 `oven`\
  \ 类是 `microwave` 类的超类（superclass）。\n\n人类会分类。我们世界的一切物都被组织在分类法中。我们这样做是为了减少我们需要记忆的事物数量。例如，考虑你第一次看到混合动力汽车。广告称它为“一种革命性的汽车，与你见过的任何汽车都不同”，但和你都知道事实并非如此。当然，它的动力系统与传统汽车不同，但它仍然是一辆汽车，因此做着所有汽车都会做的事情：将你和亲属从一个地方送到另一个地方。它有方向盘、座椅、电机、刹车等等。我敢打赌我甚至可以在不需要帮助的情况下开一辆。\n\
  \n我不需要用我有限的存储空间填满混合动力汽车与其他汽车的所有共同点。我只需要记住“混合动力汽车是一辆……的汽车”，并加上那几项混合动力汽车特有的特征。汽车是轮式车辆的子类，而轮式车辆还有其他成员，如卡车和皮卡。也许轮式车辆是车辆的子类，包含了飞机。以此类推。\n\
  \n## 为什么要这样构建对象？\n\n似乎专门为这个问题设计和建造一台微波炉比构建一个通用的烤箱对象更容易。例如，假设我建造一个专门用于制作墨西哥夹片的微波炉。我不需要在上面放任何面板，除了一个\
  \ `START` 按钮。我总是加热相同时间的墨西哥夹片。我可以省掉 `DEFROST`（解冻）和 `TEMP COOK`（定时烹）之类的废话。微波炉可以做得很小。它只需要容纳一个大号盘子。立方空间将完全浪费在墨西哥夹片上。\n\
  \n就此而言，假设我完全抛弃“微波炉”的概念。我真正只需要烤箱的内部构造。在食谱中，我可以放入让它工作的指令：“把墨西哥夹片放入盒子里。将红线连接到黑线。听到轻微的嗡嗡声。如果你打算有孩子，不要站太近。”\n\
  \n尽管如此，函数式方法确实存在一些问题：\n\n- **过于复杂**：你不希望构建烤箱的细节与构建墨西哥夹片的细节混合。如果你无法定义对象并将它们从细节泥沼中提取出来单独处理，你就必须同时处理问题的所有复杂性。\n\
  - **缺乏活性**：如果你需要用其他类型的烤箱替换微波炉，只要新烤箱的接口与旧的相似，你就可以这样做。如果没有简单且清晰定义的接口，想要干净地移除一个对象类型并替换为另一个是不可能的。\n\
  - **不可复用性**：烤箱用于制作许多不同的菜肴。你不想每次遇到新食谱就创建一个新烤箱。解决过一次问题后，如果能在未来的程序中重用解决方案将是好的。\n\n\n\
  \n\n编写一个通用对象的成本确实更高。但制造一个专门为纳乔（nachos）制造的微波炉会更便宜。你可以省去制作纳乔不需要的昂贵计时器、按钮等。然而，一旦你在多个应用程序中使用通用对象，那么使用稍贵一点类所带来的成本，将远大于为每个新应用程序重复构建廉价且低灵活性类所产生的重复成本。\n\
  \n## 自包含类（Self-Contained Classes）\n\n现在，是时候思考你所学的内容了。在面向对象的编程方法中：\n\n- 程序员识别解决问题所需的类。（我很清楚，我需要一个烤箱来制作像像样的纳乔。）\n\
  - 程序员创建符合问题要求的自包含类，而无需担心应用程序的细节。\n- 程序员使用刚刚创建的类来编写应用程序，而无需考虑它们内部是如何工作的。\n\n这种编程模型不可或缺的一部分是：每个类都对自己负责。一个类在任何时候都应该处于定义的状态。不能通过使用非法数据或非法顺序正确数据调用类来导致程序崩溃。\n\
  \n后续章节中展示的 C++ 许多特性涉及到赋予类保护自身的能力，使其免受那些正等着出错的错误程序的侵害。\n\n## 第 22 章：结构化执行：让类动起来\n\
  \n### 本章内容\n\n- 为类添加成员函数\n- 定义成员函数\n- 调用成员函数\n- 从一个成员访问另一个成员\n- 重载成员函数\n\n类被引入 C\
  \ 语言中是作为一种将不同但相关的数据元素组合在一起的方便方式——例如，同一个人的社会安全号码和姓名。这就是我在第 19 章中介绍它们的方式。C++ 扩展了类的概念，赋予了它们模拟现实世界对象的能力。这就是\
  \ C 和 C++ 区别的本质。\n\n在上上一节中，我从高层次回顾了面向对象编程的概念。在本章中，我将通过检查类的激活特性来使其更加具体，这些特性允许类更好地模拟我们所处的面向对象的世界。\n\
  \n### 激活我们的对象\n\nC++ 使用类来模拟现实世界对象。然而，第 19 章中的类在这方面有所欠缺，因为类是会做事的。（第 19 章中的类没有与它们关联的动词——它们什么都不做。）例如考虑一个储蓄账户。`Savings`\
  \ 类需要保存所有者的姓名、可能是她的社会安全号码，肯定还有她的账号和余额。但这还不够。现实世界中的对象是会运行的。烤箱负责做饭。储蓄账户积累利息。定期存款提前取出会会收取巨额罚金。此类如此考虑在\
  \ `Savings` 账户类中处理存款的问题。函数式程序通过函数做事。因此，一个函数程序可能会创建一个单独的函数，将它想要更新的 `Savings` 账户对象的指针作为参数，随后跟上存款金额。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 现在先不用管具体如何传递指向储蓄账户账户对象的指针。你将在下一章看到更多相关内容。\n\
  \n但并不是现实世界中储蓄账户的工作方式。当我开车到银行窗口并告诉他们我想给我的储蓄账户存款时，柜台人员不会递给我一个账本让我在上面记录存款并写下新余额。她自己也不会亲手做。相反，她在某个终端上输入存款金额，然后将该金额放入收银机。机器吐出一张带有新余额的存款单并交给我，一切就完成了。我们中没有人都直接触碰银行的账本。\n\
  \n这看起来可能像是一个愚蠢的练习，但请考虑为什么银行不按“函数式方法”做事。暂时忽略我可能在汇总前在存款末尾多加几个零的诱惑。银行不这样做的原因，与我不通过连接和断开箱内部电线来给我的微波炉供电的原因相同——银行希望对其余额的变动保持严格控制。\n\
  \n如果出了什么差错，我的储蓄账户余额增加了大约一百美元（“天哪，那是怎么发生的？”），银行有强烈的利益去准确查明发生了什么，并确保它不再发生。我或柜台人员犯的简单算术错误不足以成为此类错误的理由。银行有维护其账户良好的法律责任和信托责任。如果每个来到柜台窗口的人都能直接访问账本，它就无法做到这一点。\n\
  \n这种谨慎也适用于程序员。你晚上可以安心睡觉，因为并不是每个程序员都能直接访问银行余额。只有最受信任的程序员才能编写增加和减少银行余额的代码。\n\n我在这里使用“信任”一词有两个含义。首先，银行信任这些个人不会蓄意偷窃。然而，银行也信任这些程序员会采取所有必要的流程步骤来充分审查和测试\
  \ `deposit()` 和 `withdraw()` 函数，以确保它们没有 Bug 并准确地实现了银行的规则。\n\n为了让 `Savings` 类模拟现实世界的储蓄账户，它需要自己的激活属性，如\
  \ `deposit()` 和 `withdrawal()`（以及为了谁知道为什么，在我的情况下是 `chargePenalty()`）。只有这样，`Savings`\
  \ 类才能对其状态负责。\n\n## 创建成员函数\n\n作为类定义一部分函数被称为成员函数。类内部的数据被称为数据成员。成员函数是类的动词，而数据成员是名词。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 成员函数也被方法（methods），因为它们在原始的面向对象语言\
  \ Smalltalk 中是这样称呼的。“方法”一词在 Smalltalk 中有意义，但在 C++ 中没有特殊含义，除了在对话中说起来更简单且听起来更有面子。我会尽量不让这些琐事让你感到无聊，但你会在面向对象的派对中听到这个词，所以最好习惯它。我会尽量坚持使用成员函数这个术语，但偶尔也会滑入技术术语。\n\
  \n注意：你目前为止看到的不是成员的函数没有特殊名称。当我需要将它们与成员亲戚区分开来时，我称它们为非成员函数。\n\n向类添加成员函数有三个方面：定义函数、命名函数和调用函数。这样说就很显而易见了。\n\
  \n### 定义成员函数\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下类演示如何在 `Savings` 账户类中定义两个关键成员函数\
  \ `deposit()` 和 `withdraw()`：\n\n```cpp\n// Savings - 一个简单的储蓄账户类\nclass Savings\n\
  {\npublic:\n  int nAccountNumber;\n  double dBalance;\n\n  // deposit - 将金额存入余额\n\
  \  // 存款必须是正数；返回\n  // 结果余额或出错返回零\n  double deposit(double dAmount)\n  {\n    //\
  \ 不允许负存款——那是取款\n    if (dAmount < 0)\n    {\n      return 0.0;\n    }\n    // 好的——加上余额并返回总额\n\
  \    dBalance += dAmount;\n    return dBalance;\n  }\n\n  // withdraw - 如果资金充足则执行取款\n\
  \  double withdraw(double dAmount)\n  {\n    if (dBalance < dAmount)\n    {\n  \
  \    return 0.0;\n    }\n    dBalance -= dAmount;\n    return dBalance;\n  }\n};\n\
  ```\n\n\n\n\n![remember.eps](img/remember_fmt.jpeg) 一个真实的储蓄账户类会包含许多其他信息，比如客户姓名。然而，添加这些额外内容有助于解释概念，因此为了保持代码示例尽可能短，我省略了它们。\n\
  \n你可以看到，`deposit()` 和 `withdraw()` 成员函数的定义看起来与其他任何函数完全一样，区别在于它们出现在类的定义内部。还有一些细微的区别，我将在本章的稍后部分进行介绍。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 你可以在类外部定义成员函数，正如你在本章稍后部分将看到的那样。\n\
  \n## 类成员的命名\n\n成员函数非常像家庭中的成员。`deposit` 函数的全名是 `Savings::deposit(double)`，就像我的全名是\
  \ Stephen Davis 一样。除非惹了麻烦，否则我母亲不会那样叫我。通常情况下，我的家人直接称呼我的名，Stephen。同样地，在 `Savings`\
  \ 类内部，`deposit` 函数简单地被称为 `deposit(double)`。\n\n开头的类名表示这是对 `Savings` 类成员函数 `deposit()`\
  \ 的引用。`::` 仅仅是类名和成员名之间的分隔符。类名是成员函数扩展名的一部分，就像 Stephen Davis 是我的扩展名一样。（如果你不记得扩展名是什么了，请参阅第\
  \ 11 章。）\n\n![tip.eps](img/tip_fmt.jpeg) 类通常使用描述概念的名词命名，如 `Savings` 或 `SavingsAccount`。成员函数通常使用相关的动词命名，如\
  \ `deposit()` 或 `withdraw()`。除此之外，成员函数遵循与其他函数相同的命名规范。数据成员通常使用描述特定属性的词词进行命名，如 `szName`\
  \ 或 `nSocialSecurityNumber`。\n\n你可以定义一个与 `Savings` 类无关的不同的 `deposit()` 函数——世界上有很多与我家人毫无关系的\
  \ Stephen（我的意思是是字面意思：我认识几个与我的家人互不相往的 Stephen）。例如，`Checking::deposit(double)` 或 `River::deposit()`\
  \ 很容易与 `Savings::deposit(double)` 区分开。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 非成员函数可以带有空类名出现。例如，如果存在一个不属于任何类的存款函数，它的名字将是 `::deposit()` 或简单的 `deposit()`。\n\n\
  ## 调用成员函数\n\n在我向你展示如何调用成员函数之前，让我快速复习如何访问对象的数据成员。根据之前 `Savings` 类的定义，你可以编写如下代码：\n\
  \n```\nvoid fn()\n{\n    Savings s;\n    s.nAccountNumber = 0;\n    s.dBalance =\
  \ 0.0;\n}\n```\n\n函数 `fn()` 创建了一个 `Savings` 对象 `s`，然后将该对象的数据成员 `nAccountNumber`\
  \ 和 `dBalance` 置零。\n\n注意，以下内容是不符合逻辑的：\n\n```\nvoid fn()\n{\n    Savings s1, s2;\n\
  \    nAccountNumber = 0; // 无效\n    dBalance = 0.0;\n}\n```\n\n你指的是哪个 `nAccountNumber`\
  \ 和 `dBalance`？是 `s1` 的还是 `s2` 的？或者是完全其他对象？数据成员的引用只有在对象的上下文中才有意义。\n\n调用成员函数：你必须先创建一个对象，然后调用它：\n\
  \n```\nvoid fn()\n{\n    // 创建并初始化对象\n    Savings s1 = {0, 0.0};\n    Savings s2\
  \ = {1, 0.0};\n\n    // 现在存入 100\n    s1.deposit(100.0);\n\n    // 然后是另一个\n    s2.deposit(50.0);\n\
  }\n```\n\n调用成员函数的语法看起来像点符号：`s1.deposit(100.0)` 和 `s2.deposit(50.0)`。当用 `s1` 调用 `deposit()`\
  \ 时，对 `dBalance` 的未限定引用指向 `s1.dBalance`。在调用 `s2.deposit(50.0)` 期间，`s2` 当前对象。\n\n\
  ## 在函数内部访问成员\n\n我不喜欢 C++ 的点之一是它提供了多种实现功能的方法。出于这种对灵活性的偏好，C++ 允许你在类内声明成员函数的同时，在类外部定义它们。\n\
  \n以下是在类外编写的 `withdraw()` 函数的示例（再次，为了使示例尽可能短，我省略了错误检查）：\n\n```cpp\n// 这部分通常位于 Savings.h\
  \ 包含文件中\nclass Savings\n{\npublic:\n    int nAccountNumber;\n    double dBalance;\n\
  \    double deposit(double dAmount);\n};\n\n// 这部分出现在独立的 Savings.cpp 文件中\ndouble\
  \ Savings::deposit(double dAmount)\n{\n    dBalance += dAmount;\n    return dBalance;\n\
  }\n```\n\n现在，`Savings` 的定义包含成员函数 `deposit()` 的原型声明。函数的实际定义稍后出现。但注意，当它出现时，它是带有完整的扩展名呈现的，包括类名——在类定义之外没有默认的类名。\n\
  \n\n\n\n你可以像重载任何其他函数一样重载成员函数。然而，请记住，类名是扩展限定名的一部分。这意味着以下代码是完全合法的：\n\n```cpp\nclass\
  \ Student\n{\npublic:\ndouble grade(); // 返回学生的成绩\ndouble grade(double dNewGPA);\
  \ // 设置学生的成绩\n};\n\nclass Hill\n{\npublic:\ndouble grade(double dSlope); // 设置坡度\n\
  };\n\nvoid grade(double);\n\nvoid fn()\n{\nStudent s;\nHill h;\n// 设置学生的成绩\ns.grade(3.0);\n\
  // 现在查询成绩\ndouble dGPA = s.grade();\n// 现在将山坡的坡度（grade）设置为 3 度\nh.grade(3.0);\n\
  // 调用非成员函数\ngrade(3.0);\n}\n```\n\n在调用成员函数时，对象的类型与参数的数量和类型同样重要。第一次调用 `grade()` 会调用函数\
  \ `Student::grade(double)` 来设置学生的平均点分。第二次调用是针对 `Student::grade()`，它会返回学生的平均点分而不改变它。\n\
  \n第三次调用的是一个完全无关的函数 `Hill::grade(double)`，它设置山坡的坡度。最后一次调用是非成员函数 `::grade(double)`。\n\
  \n# 第 23 章：对象指针\n\n## 本章内容\n- 向类中添加成员函数\n- 定义成员函数\n- 调用成员函数\n- 从一个成员访问另一个成员\n- 重载成员函数\n\
  \n第 17 章和第 18 章重点关注指针处理和喂养的各个方面。你可能认为，关于这个主题已经没有什么可以说的了。但在这些章节之前，我还没有介绍过“类”的概念。在本章中，我将描述指针变量与面向对象编程的交汇点。本将涉及指向类对象的指针的概念。我将描述如何创建一个指针，如何使用它，以及在完成后如何删除它。\n\
  \n## 对象指针\n\n指向程序员定义类型（如类）的指针其工作原理与指向内置类型的指针基本相同：\n\n```cpp\nint nInt;\nint* pInt\
  \ = &nInt;\n\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\n\
  };\n\nSavings s;\nSavings* pS = &s;\n```\n\n第一对声明定义了一个整数 `nInt` 和一个指向整数的指针 `pInt`。指针\
  \ `pInt` 初始化为指向整数 `nInt`。\n\n同样，第二对声明创建了一个 `Savings` 对象 `s`。然后它声明了一个指向 `Savings`\
  \ 对象的指针 `pS`，并将其初始化为 `s` 的地址。\n\n`pS` 的类型是“指向 Savings 的指针”，写作 `Savings*`。\n\n当我说“等一下！还有更多！”时，我觉得自己就像已故比利·麦斯（Billy\
  \ Mays）。相似性仍在继续。以下语句为 `pInt` 所指向的整数赋值为 1：\n\n```cpp\n*pInt = 1;\n```\n\n同样，接下来的语句为\
  \ `pS` 所指向的 `Savings` 对象的账号和余额进行赋值：\n\n```cpp\n(*pS).nAccountNumber = 1234;\n(*pS).dBalance\
  \ = 0.0;\n```\n\n![remember.eps](img/remember_fmt.jpeg) 必须使用括号，因为 `.` 的优先级高于 `*`。如果没有括号，`*pS.nAccountNumber\
  \ = 1234` 将被解释为 `*(pS.nAccountNumber) = 1234`，这意味着“在 `pS.nAccountNumber` 所指向的位置存储\
  \ 1234”。这会产生编译器错误，因为 `nAccountNumber` 不是指针（`pS` 也不是 `Savings` 类型）。\n\n### 箭头语法\n\
  \n我能想到的只有，C 语言的作者们字打得不太好。他们在寻找表达内容的简写方式方面毫不吝啬。这是另一个为了节省击键次数而发明简写的例子，发明了一个新运算符 `->`\
  \ 来代表 `*()`：\n\n```cpp\npS->dBalance = 0.0; // 等同于 (*pS).dBalance = 0.0\n```\n\n\
  尽管两者等价，但箭头运算符几乎被专门使用，因为它更容易阅读（以及输入）。然而，请不要忘记这两种形式是完全等价的。\n\n### 调用所有成员函数\n\n使用指针调用成员函数的语法与访问数据成员的相似：\n\
  \n```cpp\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\ndouble\
  \ withdraw(double dAmount);\ndouble deposit(double dAmount);\n};\n\nvoid fn()\n\
  {\nSavings s = {1234, 0.0};\nSavings* pS = &s;\n// 向 pS 所指向的账户存款\npS->deposit(100.0);\n\
  }\n```\n\n此代码段中的最后语句的意思是“调用 pS 所指向的对象的 `deposit()` 成员函数”。\n\n## 将对象传递给函数\n\n将指针传递给函数只是玩指针的许多方法之一。\n\
  \n### 使用对象值调用函数\n如你所知，C++ 默认通过值传递参数给函数。如果你不知道这一点，请参阅第 11 章。复杂的用户定义对象也是通过值传递的：\n\n\
  ```cpp\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble dBalance;\ndouble\
  \ withdraw(double dAmount);\ndouble deposit(double dAmount);\n};\n\nvoid someOtherFunction(Savings\
  \ s)\n{\ns.deposit(100.0);\n}\n\nvoid someFunction()\n{\nSavings s = {1234, 0.0};\n\
  someOtherFunction(s);\n}\n```\n\n在这里 `someFunction()` 创建并初始化了一个 `Savings` 对象 `s`。然后将其副本传递给\
  \ `someOtherFunction()`。它是副本很重要，有两个原因：复制大型对象可能非常低效，会导致程序运行变慢。对副本的修改对原始对象产生任何影响。\n\
  \n### 使用对象指针调用函数\n你可以传递对象的地址而不是对象本身，如下：\n\n```cpp\n// ... (Savings 类定义)\nvoid someOtherFunction(Savings*\
  \ pS)\n// ... 实现 ...\n```\n\n`someOtherFunction()` 参数的类型是“指向 Savings 的指针”。这体现在 `someFunction()`\
  \ 执行调用的方式，传递不是对象 `s` 而是对象的地址 `&s`。这在图 23-1 中所示。\n\n**图 23-1:** 默认情况下，C++ 将 Student\
  \ 对象 `s` 的副本传递给 `someOtherFunction()`。\n![617977-2301.eps](img/617977-2301_fmt.jpeg)\n\
  \n通过传递原始对象的地址，程序员可以避免创建副本。这在图 23-2 中所示。\n\n**图 23-2:** 通过传递原始 Savings 对象的地址，程序员可以避免创建对象的副本。\n\
  ![617977-2302.eps](img/617977-2302_fmt.jpeg)\n\n### 示例分析\n下面的程序演示了按值传递对象与传递对象地址之间的区别：\n\
  \n```cpp\n// PassObjects - 此程序演示了按值传递\n// 对象与传递对象地址的区别\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing namespace std;\n\
  \n// Savings - 一个简单的储蓄账户类\nclass Savings\n{\npublic:\nint nAccountNumber;\ndouble\
  \ dBalance;\n// deposit - 将金额存款到余额；\n// 必须是正数；返回\n// 结果余额或出错时返回零\ndouble deposit(double\
  \ dAmount)\n{\n// 不允许负存款 -那是提款\nif (dAmount < 0)\n{\nreturn 0.0;\n}\n// 好的 - 加到余额并返回总额\n\
  dBalance += dAmount;\nreturn dBalance;\n}\n\n// withdraw - 如果资金充足则执行提款\ndouble withdraw(double\
  \ dAmount)\n{\n```\n\n\n\n\n```cpp\nif (dBalance < dAmount)\n{\n    return 0.0;\n\
  }\n\ndBalance -= dAmount;\nreturn dBalance;\n}\n\n// balance - 返回当前对象的余额\ndouble\
  \ balance()\n{\n    return dBalance;\n}\n};\n\n// someFunction(Savings) - 按值传递对象\n\
  void someFunction(Savings s)\n{\n    cout << “In someFunction(Savings)” << endl;\n\
  \    cout << “Depositing $100” << endl;\n    s.deposit(100.0);\n    cout << “Balance\
  \ in someFunction(Savings) is “ << s.balance() << endl;\n}\n\n// someFunction(Savings*)\
  \ - 传递对象的地址\nvoid someFunction(Savings* pS)\n{\n    cout << “In someFunction(Savings*)”\
  \ << endl;\n    cout << “Depositing $100” << endl;\n    pS->deposit(100.0);\n  \
  \  cout << “Balance in someFunction(Savings) is “ << pS->balance() << endl;\n}\n\
  \nint main(int nNumberofArgs, char* pszArgs[])\n{\n    Savings s = {0, 0.0};\n \
  \   // 首先，按值传递\n    someFunction(s);\n    cout << “Balance back in main() is “ <<\
  \ s.balance() << endl;\n    // 现在传递地址\n    someFunction(&s);\n    cout << “Balance\
  \ back in main() is “ << s.balance() << endl;\n    // 等待用户准备好后再终止程序\n    // 以允许用户看到程序结果\n\
  \    system(“PAUSE”);\n    return 0;\n}\n```\n\n该程序首先定义了一个常规的 `Savings` 类，其中包含 `deposit()`、`withdrawal()`\
  \ 和 `balance()` 成员函数（最后一个仅返回当前余额）。\n\n随后，程序定义了两个重载函数 `someFunction()`，其中一个接受 `Savings`\
  \ 类型的对象作为参数，另一个接受一个指向 `Savings` 类型对象的指针（写为 `Savings*`）。这两个函数执行的是相同的操作：首先输出一条“我在这儿”的消息，然后向账户中存入\
  \ 100 美元。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\n### 按引用传递\n\n\
  为了尝试简化操作，C++ 增加了一层复杂度，允许程序员声明一个按引用接受参数的函数，如下：\n\n```cpp\n// 按引用传递\nvoid someFunction(Savings&\
  \ refS)\n{\n    refS.deposit(100.0); // 这存回了 fn() 中的原始\n    // 对象，尽管它看起来像\n    //\
  \ 拷贝语义\n}\n\nvoid fn()\n{\n    Savings s;\n    someFunction(s); // 传递的是引用，而不是拷贝\n\
  }\n```\n\n这导致 C++ 将 `s` 的地址传递给函数 `someFunction(Savings)`。在函数内部，C++ 会自动为你对该地址进行解引用。其效果与你自己传递地址完全相同，只是\
  \ C++ 处理了指针语法。你可能认为这这让事情变得更简单了（我怀疑 C++ 的作者们也是这么想的）。但在实践中，这让事情变得更加复杂，因为很难区分一个值和一个引用。\n\
  \n我提到按引用传递并不是为了鼓励使用它，而是因为你可能会看到其他人在使用指针操作时并不像你那样从容。我建议你在真正精通指针之前避免使用引用。\n\n`main()`\
  \ 程序创建了一个 `Savings` 对象 `s`，首先将其传递给 `someFunction(Savings)`。然后它将 `s` 对象的地址传递给 `someFunction(Savings*)`。\n\
  \n该程序的输出如下：\n\n```\nIn someFunction(Savings)\nDepositing $100\nBalance in someFunction(Savings)\
  \ is 100\nBalance back in main() is 0\n\nIn someFunction(Savings*)\nDepositing $100\n\
  Balance in someFunction(Savings) is 100\nBalance back in main() is 100\n\nPress\
  \ any key to continue . . .\n```\n\n注意这两个函数是如何向一个 `Savings` 账户对象存入 100 美元的。然而，由于\
  \ `someFunction(Savings)` 是在拷贝中进行存款，`main()` 中的原始 `s` 对象仍然保持不变，正如余额为零所所示的那样。\n\n\
  通过将 `s` 的地址传递给 `someFunction(Savings*)`，程序允许该函数修改原始对象，因此值在 `main()` 中“保持了修改状态”，正如控制权返回后余额为\
  \ 100 美元所示。\n\n### 在堆上分配对象\n\n你可以像示例所示使用 `new` 关键字在堆上分配对象：\n\n```cpp\nSavings* newSavings(int\
  \ nAccountNum)\n{\n    Savings* pS = new Savings;\n    pS->nAccountNumber = nAccountNum;\n\
  \    pS->dBalance = 0.0;\n    return pS;\n}\n```\n\n该函数分配了一个新的 `Savings` 类对象，并用作为参数传递的账号和零余额对其进行初始化。\n\
  \n当你不知道需要多少个对象时这非常有用，例如第 18 章中动态大小字符数组的情况。在那时，我首先计算需要多少空间的字符，然后在堆上分配一个相应大小的数组。\n\
  \n在这种情况下，我可以确定内存中同时需要多少 `Savings` 账户，并在堆上动态地分配它们。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\
  \n# 第 24 章 请勿打扰：保护成员\n\n## 本章内容\n- 类的保护成员\n- 为什么要这样做？\n- 类的友元\n\n从第 21 章开始，我的目标是使用\
  \ C++ 类结构对现实世界进行建模。在第 22 章中，我引入了成员函数以分配属性。回到第 21 章的微波炉示例，分配属性允许我的 `Oven` 类拥有 `cook()`\
  \ 和 `defrost()` 等属性。\n\n然而，那只是故事的一部分。我还没有为内部构造加上保护。只要内部暴露给任何想要弄它的人，我就无法很好地负责。\n\n\
  ### 保护成员\n\n类的成员可以使用 `protected` 关键字标记为类外部不可访问。这与 `public` 关键字相反，后者指定了所有函数可访问的成员。类的公共成员形成了类的接口（想象微波炉前面的键盘），而保护成员则成了内部机制。\n\
  \n还有第三种类型叫做 `private`。`private` 和 `protected` 成员之间的区别在于它们对继承的反应，我直到第 28 章才介绍。\n\n\
  ### 到底什么是 this？\n\n在第 22 章中，我提到成员函数内部对成员的限定引用总是指向“当前对象”。我甚至提到当前对象有一个名字：`this`。我本这样写\
  \ `Savings` 类：\n\n```cpp\nclass Savings\n{\npublic:\n    int nAccountNumber;\n \
  \   double dBalance;\n    double withdraw(double dAmount)\n    {\n        this->dBalance\
  \ -= dAmount;\n        return this->dBalance;\n    }\n\n    double deposit(double\
  \ dAmount)\n    {\n        this->dBalance += dAmount;\n        return this->dBalance;\n\
  \    }\n\n    double balance()\n    {\n        return this->dBalance;\n    }\n};\n\
  ```\n\n事实上，即使你没有显式引用它，你一直在使用 `this`。如果你在成员函数内部没有指定对象，C++ 会认为是一个对 `this` 的引用。因此，上述内容就是即使你没有提到，C++\
  \ 实际所“看到”的内容。\n\n\n\n\n将成员声明为 `protected` 允许类在其自身周围围起一个保护框。这使得类对自己的内部状态负责。如果类内部的某个地方出了问题，类本身（而不是类的作者）除了自己之外，无处可以追究责任。然而，如果任何函数都可以伸进去并弄乱它，那么要求程序员对类的状态负责是不公平的。\n\
  \n此外，对类对接口进行限制，可以让那些在程序中使用该接口的程序员更容易学习该类。通常情况下，我并不在乎微波炉内部是如何工作的，只要我知道如何使用控制面板即可。类似地，只要我理解公共成员函数的参数，我通常不会担心库类的内部工作机制。\n\
  \n最后，将类接口限制为某些精选的公共函数，可以减少类与应用程序代码之间的耦合水平。\n\n**注意：** 耦合指的是应用程序对类内部工作方式的了解程度，反之亦然。紧耦合的类对周围的应用程序有深入的了解并利用了这些知识。松耦合的类仅通过简单的、通用的公共接口工作。松耦合的类对其周围的环境了解很少，并且也隐藏了大部分自己的内部细节。松耦合的类更容易测试和调试，并且在应用程序更改时更容易被替换。\n\
  \n我知道你们那些函数式编程的人在说什么：“你们不需要某些花哨的功能来实现这一切。只需制定规则规定某些成员是公开访问的，而其他不是即可。”这在理论上是正确的，我甚至参与过采用此类规则的项目，但在实践中它行不通。人们初的意图良好，但只要语言没有至少阻止直接访问\
  \ `protected` 成员，这些良好的意图就会在交付产品的压力下被击碎。\n\n### 将成员设为保护\n\n在类中添加 `public:` 关键字会使后续成员变为公开可用。添加\
  \ `protected:` 关键字会使后续成员变为受保护的，这意味着它们只能由同类的其他成员或被专门声明为朋友（friend）的函数访问（本章稍后会详细介绍）。它们的作用就像开关——一个覆盖另一个。你可以随心所欲在\
  \ `protected` 和 `public` 之间来回。\n\n以 `Student` 类为例，它描述了大学生的显著特征。该类有以下公共成员函数：\n\n\
  - `addGrade(int nHours, double dGrade)` — 为学生添加成绩。\n- `grade()` — 返回学生的平均绩点 (GPA)。\n\
  - `hours()` — 返回为了毕业所需的学期学分。\n\n`Student` 的其余成员应该声明为 `protected`，以防止窥探性的表达式干扰其运行。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `SimpleStudent` 程序定义了这样一个 `Student` 类并包含一个执行这些函数的简单\
  \ `main()`：\n\n```cpp\n//\n// SimpleStudent - 此程序演示了如何使用\n// protected 关键字来保护\n\
  // 关键内部成员\n//\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Student\n{\nprotected:\n    double dGrade; // 学生的 GPA\n\
  \    int nSemesterHours;\n\npublic:\n    // init() - 将学生初始化为合法状态\n    void init()\n\
  \    {\n        dGrade = 0.0;\n        nSemesterHours = 0;\n    }\n    // getGrade()\
  \ - 返回当前成绩\n    double getGrade()\n    {\n        return dGrade;\n    }\n    //\
  \ getHours() - 获取毕业所需的学期学分\n    int getHours()\n    {\n        return nSemesterHours;\n\
  \    }\n    // addGrade - 将成绩添加到 GPA 和总学分中\n    double addGrade(double dNewGrade,\
  \ int nHours)\n    {\n        double dWtdHrs = dGrade * nSemesterHours;\n      \
  \  dWtdHrs += dNewGrade * nHours;\n        nSemesterHours += nHours;\n        dGrade\
  \ = dWtdHrs / nSemesterHours;\n        return dGrade;\n    }\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 创建一个学生并初始化\n    Student s;\n    s.init();\n\
  \    // 添加三门课程的成绩\n    s.addGrade(3.0, 3); // 一个 B\n    s.addGrade(4.0, 3); // 一个\
  \ A\n    s.addGrade(2.0, 3); // 一个 C (平均应该是 B)\n    // 现在打印结果\n    cout << \"Total\
  \ # hours = \" << s.getHours()\n         << \", GPA = \" << s.getGrade()\n     \
  \    << endl;\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序结果\n    system(\"PAUSE\");\n\
  \    return 0;\n}\n```\n\n此 `Student` 类保护了它的成员 `dGrade` 和 `nSemesterHours`。外部函数无法通过插入以下代码来偷偷地将自己的\
  \ GPA 设：\n\n```cpp\nvoid MyFunction(Student* pS)\n{\n    // 将我的成绩设为 A+\n    pS->dGrade\
  \ = 3.9; // 产生编译器错误\n}\n```\n\n此赋值会产生编译器错误。\n\n![tip.eps](img/tip_fmt.jpeg) 你可以从\
  \ `protected` 或 `public` 成员开始；这并不重要。事实上，你可以随心所欲地来回切换。\n\n任何函数都可以通过 `getGrade()`\
  \ 函数读取学生的 GPA。这被称为访问函数（access function）。然而，尽管外部函数可以读取一个值，但它们不能通过这个访问函数更改该值。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 访问函数也被称为 getter 函数（getter function，如“获取该值”）。设置值的函数也被称为\
  \ setter 函数（setter function）。\n\n此程序中的 `main()` 函数创建了一个 `Student` 对象 `s`。它不能将 `s`\
  \ 初始化为某些合法状态，因为数据成员是被保护的。坦率地说，`Student` 类提供了一个 `init()` 函数供 `main()` 调用，将数据成员初始化为起始状态。\n\
  \n在初始化 `s` 后，`main()` 调用 `addGrade()` 添加了三门课程并打印结果。结果如下：\n\nTotal # hours = 9, GPA\
  \ = 3\n\n按任意键继续 . .\n\n### 所以怎样？\n\n这有什么大大的？“好吧，”你说，“我明白不让其他函数将 GPA 设为任意值这一点，但就此此吗？”不。在这种松耦合的背后隐藏着一个更微妙的观点。我选择尽可能简单地实现计算\
  \ GPA 的算法。只需思考五分钟，我就可以想象出至少三种不同的内部存储成绩和学期学分的方法。\n\n例如，我可以将每个成绩连同学期学分保存在内部数组中。这将允许学生查看进入其\
  \ GPA 的成绩。点在于，应用程序程序员不应该关心。只要成员函数 `getGrade()` 和 `getHours()` 准确计算了 GPA 和总学分，没有任何应用程序会关心。\n\
  \n现在，假设学校更改了计算 GPA 的规则。例如，假设宣布某些课程为通过/不通过（Pass/Fail），这意味着你可以获得学分，但课程成绩不进入 GPA 计算。这可能需要完全重写\
  \ `Student` 类。反，这将对任何依赖于信息存储方式的函数进行修改——即任何访问 `protected` 成员的函数。然而，限制在 `public` 成员上的函数不受更改的影响。\n\
  \n这就是松耦合的真正优势：对变化的容忍性。\n\n### 谁需要朋友呢？\n\n偶尔，你需要让非成员函数访问类的 `protected` 成员。你可以通过将该函数声明为朋友（friend）来实现这一点。将一个函数声明为朋友意味着你不需要通过将其声明为\
  \ `public` 来向所有人暴露该保护成员。\n\n这就像给邻居留一把钥匙以便在你度假期间照看房子一样。给非家人留家里钥匙通常不是个好主意，但总比让房子门不锁要好。\n\
  \n\n\n友元声明出现在包含保护（protected）成员的类中。友元声明由关键字 `friend` 后后跟一个原型声明组成。在下面的示例中，`initialize()`\
  \ 函数被声明为非成员函数。然而，`initialize()` 显然需要访问类的所有数据成员，无论是否是受保护的：\n\n```cpp\nclass Student\n\
  {\n    friend void initialize(Student*);\n\n    protected:\n    double dGrade; //\
  \ 学生的 GPA\n    int nSemesterHours;\n\n    public:\n    double grade();\n    int\
  \ hours();\n    double addGrade(double dNewGrade, int nHours);\n};\n\nvoid initialize(Student*\
  \ pS)\n{\n    pS->dGrade = 0.0;\n    pS->nSemesterHours = 0;\n}\n```\n\n一个函数可以同时声明为两个不同类的友元。虽然这看起来很方便，但它倾向于将这两个类绑定在一起。然而，有时类由于其本质上就是绑定在一起的，如下所示的师生示例所示：\n\
  \n```cpp\nclass Student; // 前向声明\n\nclass Teacher\n{\n    friend void registration(Teacher*,\
  \ Student*);\n\n    protected:\n    int noStudents;\n    Student *pList[128];\n\n\
  \    public:\n    void assignGrades();\n};\n\nclass Student\n{\n    friend void\
  \ registration(Teacher*, Student*);\n\n    protected:\n    Teacher *pTeacher;\n\
  \    int nSemesterHours;\n    double dGrade;\n};\n```\n\n在这个示例中，`registration()`\
  \ 函数可以进入 `Student` 对象来设置 `pTeacher` 指针，也可以进入 `Teacher` 对象向老师的学生列表添加学生。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 注意 `Student` 类是如何在没有主体的情况下单独出现的。这被称为前向声明，声明了程序员的意图在模块的某处定义 `Student` 类。这有点类似于函数的原型声明。这通常只在两个或多个类相互引用时才是必要的；在这种情况下，`Teacher`\
  \ 包含了对 `Student` 的引用，而 `Student` 包含了对 `Teacher` 的引用。\n\n如果没有对 `Student` 的前向声明，`Teacher`\
  \ 内部 `Student *pList[100]` 的声明会导致编译错误，因为编译器还不知道 `Student` 是什么。交换定义的顺序，`Student`\
  \ 内部的 `Teacher *pTeacher` 声明会导致编译错误，因为 `Teacher` 尚未被定义。\n\n前向声明通过告诉编译器保持耐心来解决这个问题问题——这个新类的定义很快就会出现。\n\
  \n一个类的成员可以被声明为另一个类的友元：\n\n```cpp\nclass Student;\n\nclass Teacher\n{\n    // ...其他成员...\n\
  \    public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\n\
  class Student\n{\n    friend void Teacher::assignGrade(Student*, int, double);\n\
  \    // ...其他成员...\n};\n```\n\n整个类可以被声明为另一个类的友元。这样做的效果使得该类的每个成员函数都成为友元。例如：\n\n```cpp\n\
  class Student;\n\nclass Teacher\n{\n    protected:\n    int noStudents;\n    Student*\
  \ pList[128];\n\n    public:\n    void assignGrade(Student*, int nHours, double\
  \ dGrade);\n};\n\nclass Student\n{\n    friend class Teacher;\n    // ...其他成员...\n\
  };\n```\n\n现在 `Teacher` 的每个成员都可以访问 `Student` 的保护成员（但反之不行）。将一个类声明为另一个类的友元会将这些类不可分割地捆绑在一起。\n\
  \n# 第 25 章：让对象良好地开始\n\n## 本章内容\n- 创建构造函数\n- 检查构造函数如何被调用的限制\n- 回顾一个示例构造函数\n- 构造数据成员\n\
  - 引入“非构造函数”——析构函数\n\n通常情况下，对象在创建时会被初始化，如下所示：\n\n```cpp\ndouble PI = 3.14159;\n```\n\
  \n对于类对象也是如此：\n\n```cpp\nclass Student\n{\n    public:\n    int nHours;\n    double\
  \ dGrade;\n};\n\nStudent s = {0, 0.0};\n```\n\n然而，如果数据元素被声明为保护，且创建对象的函数不是该类的友元或成员（在大多数情况下它不是），那么这样做就不可能了。\n\
  \n需要其他机制在对象创建时对其初始化，这就是构造函数的用武场。\n\n### 构造函数\n初始化带有保护成员的对象的方法是创建一个 `init()` 成员函数，应用程序可以在对象创建时调用它。这个\
  \ `init()` 函数会将对象初始化为某个合法的起始点。事实上，这正我在第 24 章中所做的。\n\n这种方法可行，但它并不完全符合面向对象编程的“微波炉”规则，因为它类似于制造一个要求你在进行任何操作之前必须按下\
  \ `Reset`（重置）按钮的微波炉。这就像厂家在说明书中写了一份巨大的免责声明：“在首先按下重置按钮之前，切勿启动任何命令序列。这样做可能导致微波炉爆炸并杀死周围所有人，或者更糟。”（比这还有更糟的吗？）\n\
  \n我虽然不是律师，但我知道，如果你在说明书中加入这样的免责声明，当你因为有人被爆炸微波炉的碎片割伤而上法庭时，并救不了你的命，尽管事实是如此。\n\n现在我不是律师，但即使是我也知道……（此处原文似乎有逻辑重复）\n\
  \n一个类的成员可以被声明为另一个类的友元：\n\n```cpp\nclass Student;\n\nclass Teacher\n{\n    // ...其他成员...\n\
  \    public:\n    void assignGrade(Student*, int nHours, double dGrade);\n};\n\n\
  class Student\n{\n    friend void Teacher::assignGrade(Student*, int, double);\n\
  \    // ...其他成员...\n};\n```\n\n整个类可以被声明为另一个类的友元。这种效果是让该类的每个成员函数都成为友元。例如：\n\n```cpp\n\
  class Student;\n\nclass Teacher\n{\n    protected:\n    int noStudents;\n    Student*\
  \ pList[128];\n\n    public:\n    void assignGrade(Student*, int nHours, double\
  \ dGrade);\n};\n\nclass Student\n{\n    friend class Teacher;\n    // ...其他成员...\n\
  };\n```\n\n现在 `Teacher` 的每个成员都可以访问 `Student` 的保护成员（但反之不行）。将一个类声明为另一个类的友元会将这些类不可分割地捆绑在一起。\n\
