  \ pszArray;\nchar const pszArray;\nchar* const pszArray;\n```\n（注：此处根据常见逻辑补全，因原文文本在此处似乎截断）\n\
  \n\n\n\n如果指针可以指向一个数组，那么反过来似乎也是理所应当的。指针数组是一种特别关注的数组类型。\n\n以下代码声明了一个包含十个整数指针的数组：\n\
  \n```cpp\nint* pInt[10];\n```\n\n给定此声明，`pInt[0]` 是一个指向整数的指针。以下代码段声明了一个包含三个整数指针的数组并为它们分配了值：\n\
  \n```cpp\nvoid fn()\n{\n    int n1, n2, n3;\n    int* pInts[3] = {&n1, &n2, &n3};\n\
  \    for(int n = 0; n < 3; n++)\n    {\n        // 初始化整数\n        *pInts[n] = n\
  \ * 10;\n    }\n}\n```\n\n声明后，`pInts[0]` 指向变量 `n1`，`pInts[1]` 指向 `n2`，而 `pInts[2]`\
  \ 指向 `n3`。因此，像这样的表达式\n\n`*pInts[1] = 10;`\n\n会将由 `pInts[1]` 指向的整数（即 `n2`）设置为 10。上述代码段中\
  \ `for` 循环的作用是将 `n1`、`n2` 和 `n3` 分别初始化为 0、10 和 20。这在图 18-6 中形象所示。\n\n**图 18-6：**\
  \ 设置和使用三个整数指针数组的效果。\n\n![617977-fg1806.eps](img/617977-fg1806_fmt.jpeg)\n\n## 参数数组\n\
  \n回到 `main()` 示例，程序的参数是执行程序时传递给程序的字符串。因此，如果我通过以下方式执行 `MyProgram`：\n\n`MyProgram\
  \ file1 file2 /w`\n\n那么程序的参数就是 `file1`、`file2` 和 `/w`。\n\n虽然在技术上不是参数，但 C++ 将程序名称作为第一个“参数”。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 切换器（Switches）不会被解释，因此 `/w`\
  \ 作为参数传递给程序。然而，特殊符号 `<`、`>` 和 `|`会被命令行解释器解释，不会传递给程序。\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的简单 `PrintArgs` 程序显示了命令行解释器传递它的参数：\n\n```cpp\n// PrintArgs - 打印给程序的参数\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    for(int n = 0; n < nNumberofArgs;\
  \ n++)\n    {\n        cout << \"Argument \" << n\n        << \" is <\" << pszArgs[n]\n\
  \        << \">\" << endl;\n    }\n    // 等待用户准备好后再终止程序\n    // 以允许用户查看程序结果\n  \
  \  system(\"PAUSE\");\n    return 0;\n}\n```\n\n现在的技巧在于如何向程序传递参数。\n\n### 通过命令行向你的程序传递参数\n\
  \n最简单且最直接的方法是从命令行提示符执行程序时直接输入参数：\n\n`PrintArgs file1 file2 /w`\n\n这样做会产生以下输出：\n\n\
  ```text\nC:\\Beginning_Programming-CPP\\PrintArgs\\bin\\Debug>PrintArgs file1 file2\
  \ /w\nArgument 0 is <printargs>\nArgument 1 is <file1>\nArgument 2 is <file2>\n\
  Argument 3 is </w>\nPress any key to continue . . .\n```\n\n这种方法的困难之处在于不知道可执行文件存储的位置。Code::Blocks\
  \ 在 `Build` 步骤会在项目目录的子目录中创建可执行程序。无论你是否使用了前面代码显示的默认安装位置，都可以通过选择 `Project⇒Properties`\
  \ 找到项目目录。弹出对话框的默认 `Project Settings` 选项显示项目文件的路径，如图 18-7 所示。\n\n**图 18-7：** Project/Target\
  \ Options 对话框中的 Code::Blocks Project Settings 选项包含项目文件的路径。\n\n![617977-fg1807.eps](img/617977-fg1807_fmt.jpeg)\n\
  \n选择 `Build Targets` 选项以找到可执行文件的路径，如图 18-8 所示。\n\n**图 18-8：** Build Targets 选项指示了可执行文件的名称和位置。\n\
  \n![617977-fg1808.eps](img/617977-fg1808_fmt.jpeg)\n\n如果你使用的是 Windows，通过选择 `开始⇒程序⇒附件⇒命令提示符`\
