  \n\n\n\n\n## 引言\n欢迎阅读《傻呆指南：C++ 编程入门》。本书旨在为想要编程的读者提供帮助。\n\n多年来，编程不知为何与数学、逻辑、微积分和其他复杂事物联系在一起。我从未真正理解这一点。编程是一种技能，就像写广告、画画或摄影一样。它确实需要深入思考问题的能力，但我认识过一些数学能力为零的优秀程序员。有些人天生擅长这方面，学得很快；另一些人没那么好，学得慢。尽管如此，任何有足够的耐心和“韧性”的人都能学习计算机编程。甚至我也行。\n\
  \n## 关于《傻呆指南：C++ 编程入门》\n学习编程意味着意味着学习一种编程语言。本书基于 `C++` 编程语言。随书附赠的 CD-ROM 中包含了编译器的\
  \ Windows 版本。Macintosh 和 Linux 版本可以在 [www.codeblocks.org](http://www.codeblocks.org)\
  \ 下载。（别担心：我在书中包含了如何安装软件包以及构建你的第一个程序的逐步操作说明。）\n\n本书的目标是教你 `C++` 编程的基础知识，而不是让你沉溺于\
  \ `C++` 编程语言的每一个细节。读完本书后，你将能够编写出相当复杂的 `C++` 程序。你也将有能力快速掌握其他许多类似的语言，例如 `Java` 和 `C#.NET`。\n\
  \n在本书中，你将发现什么是程序，它是如何工作的，以及如何进行以下操作：\n- 安装 `CodeBlocks C++` 编译器并使用它来构建程序\n- 创建并评估表达式\n\
  - 导向程序的控制流\n- 创建更好地模拟现实世界的数据结构\n- 定义并使用 `C++` 指针\n- 操作字符字符串以生成你想看到的输出\n- 对文件进行写入和从文件读取\n\
  \n## 本书中的假设\n我在书中对读者做出了非常少的假设，但我假设了以下内容：\n- 你有一台电脑。大多数读者拥有运行 Windows 的电脑；然而，书中的程序在\
  \ Windows、Macintosh、Linux 和 Unix 上运行效果同样良好。事实上，由于 `C++` 是一种标准语言，这些程序应该运行在任何带有 `C++`\
  \ 编译器的电脑上。\n- 你了解如何使用电脑的基础知识。例如，我假设你知道如何运行程序、复制文件、创建文件夹等。\n- 你知道如何浏览菜单。我包含了许多指令，如“点击‘文件’然后点击‘打开’”。如果你能遵循该指令，你就可以了。\n\
  - 你是编程初学者。我不假设你了解任何关于编程的知识。嘿，我甚至不假设你知道什么是编程。\n\n## 本书使用的约定\n为了帮助你尽可能高效地阅读本书，我使用了一些约定：\n\
  - `C++` 术语使用等宽字体，如此所示所示。\n- 新术语用*斜体*强调（并给出定义）。\n- 你需要遵循的编号步骤和需要输入的字符用**粗体**表示。\n\
  \n## 你不需要阅读的内容\n我鼓励你阅读书的一个章节；然后把书收起来玩一会儿，再进入下一部分。本书的结构安排确保了，在每个部分结束时，你已经掌握了足够的新材料来去编写程序了。\n\
  \n我想增加以下建议：\n- 如果你已经知道什么是编程，但对 `C++` 一无所知，可以跳过第 1 章。\n- 我建议你使用随书附的 `CodeBlocks`\
  \ 编译器，即使你在读完书后想使用不同的 `C++` 编译器。然而，如果你坚持不想使用 `CodeBlocks`，可以跳过第 2 章。\n- 如果你已经做过一点计算机编程，请快速略读第\
  \ 3 章。\n- 即使你有 `BASIC` 等其他语言的经验，也请从第 4 章开始集中精力。\n- 如果你开始感到疲劳，可以在第 20 章后停止阅读。第 21\
  \ 章开启了对象对象编程这一新话题——在你觉得对目前所学内容感到非常从容之前，不要尝试学习它。\n- 你可以跳过任何 `TechnicalStuff` 图标。\n\
  \n## 本书的结构\n《傻呆指南：C++ 编程入门》分为七部分。你不需要按顺序阅读，甚至不需要阅读章节中的所有内容。你可以通过目录和索引快速找到你需要的信息。在本节中，我简要描述每个部分的内容。\n\
  \n### 第一部分：让我们上手\n这部分介绍了什么是程序以及它们如何工作。通过一个虚拟的换轮胎电脑，我带你完成了几个换轮胎的算法。在离开此部分之前，你还将让\
  \ `CodeBlocks` 运行起来。\n\n### 第二部分：编写程序：决策\n这部分为你介绍了 `C++` 编程的基础。你将发现如何声明整数变量以及编写简单的表达式。你甚至会发现如何在程序内做出决策，但在完成该部分之前，你还称不上专家。\n\
  \n### 第三部分：成为功能型程序员\n你学习如何导向程序内的控制流。你将发现如何循环、如何将代码拆分为模块（以及为什么），以及如何将这些独立模块构建回一个程序。在这一部分结束时，你将能够编写解决实际问题的程序。\n\
  \n### 第四部分：数据结构\n这部分扩展了你对数据类型的知识。本书之前的章节仅限于整数；在这一部分，你将处理字符、小数和数组；你甚至可以定义自己的类型。最后，这是攻克最令人畏惧的话题的部分——`C++`\
  \ 指针。\n\n### 第五部分：面向对象编程\n在这里是将知识扩展到面向对象的技术，这些让 `C++` 区别于前身语言（特别是 C）的特性。（如果你不知道面向对象编程，别担心——你现在还不懂。）在你跳入这一部分之前，你希望对第一部分到第四部分的内容感到熟悉，但在完成该部分时，你将成为一名更强大的程序员。\n\
  \n### 第六部分：高级技巧\n这是一系列重要但未放入前面部分的主题合集。例如，在这里我讨论了如何创建、读取和写入文件。\n\n### 第七部分：十全锦\n\n\
  \n\n\n\n此部分包含了在编程时应该做什么（不该做什么）的列表，以避免无谓地产生错误。此外，如果你决定扩展你的 `C++` 知识，此部分还包含关于下一步学习哪些主题的建议。\n\
