  \    // ...其他成员...\n};\n```\n\n整个类可以被声明为另一个类的友元。这样做的效果是让该类的每个成员函数都成为友元。例如：\n\n```cpp\n\
  class Student;\n\nclass Teacher\n{\n    protected:\n    int noStudents;\n    Student*\
  \ pList[128];\n\n    public:\n    void assignGrade(Student*, int nHours, double\
  \ dGrade);\n};\n\nclass Student\n{\n    friend class Teacher;\n    // ...其他成员...\n\
  };\n```\n\n现在 `Teacher` 的每个成员都可以访问 `Student` 的保护成员（但反之不行）。将一个类声明为另一个类的友元会将这些类不可分割地捆绑在一起。\n\
  \n# 第 25 章：让对象良好地开始\n\n## 本章内容\n- 创建构造函数\n- 检查构造函数如何被调用的限制\n- 回顾一个示例构造函数\n- 构造数据成员\n\
  - 引入“非构造函数”——析构函数\n\n通常情况下，对象在创建时会被初始化，如下所示：\n\n```cpp\ndouble PI = 3.14159;\n```\n\
  \n对于类对象也是如此：\n\n```cpp\nclass Student\n{\n    public:\n    int nHours;\n    double\
  \ dGrade;\n};\n\nStudent s = {0, 0.0};\n```\n\n然而，如果数据元素被声明为保护，且创建对象的函数不是该类的友元或成员（在大多数情况下它不是），那么这样做就不可能了。\n\
  \n需要其他机制在对象创建时对其初始化，这就是构造函数的用场。\n\n### 构造函数\n初始化带有保护成员的对象的方法是创建一个 `init()` 成员函数，应用程序可以在对象创建时调用它。这个\
  \ `init()` 函数会将对象初始化为某个合法的起始点。事实上，这正我在第 24 章中所做的。\n\n这种方法可行，但它并不完全符合面向对象编程的“微波炉”规则，因为它类似于制造一个要求你在进行任何操作之前必须按下\
  \ `Reset`（重置）按钮的微波炉。这就像厂家在说明书中写了一份巨大的免责声明：“在首先按下重置按钮之前，切勿启动任何命令序列。这样做可能导致微波炉爆炸并杀死周围所有人，或者更糟。”（比这还有更糟的吗？）\n\
  \n我虽然不是律师，但我也知道，如果你在说明书中加入这样的免责声明，当你因为有人被爆炸微波炉的碎片割伤而上法庭时，并救不了你的命，尽管事实是如此。\n\n（注：由于原文文本存在大量重复，此处翻译已剔除重复的逻辑段落。）\n\
  \n\n\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\nclass Student\n{\nprotected:\n    double dGrade; // 学生的 GPA\n\
  \    int nSemesterHours;\n\npublic:\n    // 构造函数 - 将学生初始化为合法的状态\n    Student()\n\
  \    {\n        cout << \"Constructing a Student object\" << endl;\n        dGrade\
  \ = 0.0;\n        nSemesterHours = 0;\n    }\n\n    // getGrade() - 返回当前成绩\n   \
  \ double getGrade()\n    {\n        return dGrade;\n    }\n\n    // getHours() -\
  \ 获取毕业所需的课程学时\n    int getHours()\n    {\n        return nSemesterHours;\n    }\n\
  \n    // addGrade - 将成绩加到 GPA 和总学分中\n    double addGrade(double dNewGrade, int nHours)\n\
  \    {\n        double dWtdHrs = dGrade * nSemesterHours;\n        dWtdHrs += dNewGrade\
  \ * nHours;\n        nSemesterHours += nHours;\n        dGrade = dWtdHrs / nSemesterHours;\n\
  \        return dGrade;\n    }\n};\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    // 创建一个学生并初始化\n    cout << \"Creating the Student s\" << endl;\n    Student\
  \ s;\n    // 添加三门课程的成绩\n    s.addGrade(3.0, 3); // 一个 B\n    s.addGrade(4.0, 3);\
  \ // 一个 A\n    s.addGrade(2.0, 3); // 一个 C（平均分应该是 B）\n\n    // 现在打印结果\n    cout\
  \ << \"Total # hours = \" << s.getHours()\n         << \", GPA = \" << s.getGrade()\n\
  \         << endl;\n\n    // 创建一个学生数组\n    cout << \"Create an array of 5 Students\"\
  \ << endl;\n    Student sArray[5];\n\n    // 现在在堆上分配一个对象\n    cout << \"Allocating\
  \ a Student from the heap\" << endl;\n    Student *pS = new Student;\n\n    // 在程序终止前等待用户准备好\n\
  \    // 以便用户查看程序结果\n    system(\"PAUSE\");\n    return 0;\n}\n```\n\n该程序的输出如下：\n\
  \n```\nCreating the Student s\nConstructing a Student object\nTotal # hours = 9,\
  \ GPA = 3\nCreate an array of 5 Students\nConstructing a Student object\nConstructing\
  \ a Student object\nConstructing a Student object\nConstructing a Student object\n\
  Constructing a Student object\nAllocating a Student from the heap\nConstructing\
  \ a Student object\nPress any key to continue . . .\n```\n\n`Student` 类配备了一个构造函数，该函数不仅初始化了学期学时和平均点数为零，还向控制台输出了一条消息，宣布正在创建一个\
  \ `Student` 对象。\n\n`main()` 程序随后以各种方式创建了 `Student` 对象：\n\n- 第一个声明创建了一个单个 `Student`\
  \ 对象 `s`，导致 C++ 调用构造函数。\n- 第二个声明创建了一个包含五个 `Student` 对象的数组。C++ 调用了五次构造函数，数组中的每个对象调用一次。\n\
  - 程序从堆上分配了一个 `Student` 对象。C++ 再次调用构造函数来初始化该对象。\n\n### 构造数据成员\n\n类的数据成员与对象本身同时创建。考虑以下简单的类\
  \ `TutorPair`，它包含一个 `Student` 和一个 `Teacher`：\n\n```cpp\nclass TutorPair\n{\nprotected:\n\
  \    Student s;\n    Teacher t;\n    int nNumberOfMeetings;\n\npublic:\n    TutorPair()\n\
  \    {\n        nNumberOfMeetings = 0;\n    }\n    // ...其他内容...\n};\n```\n\n初始化成员\
  \ `Student` 或成员 `Teacher` 并不是 `TutorPair` 类的职责；这些对象应该由它们各自类中的构造函数进行初始化。`TutorPair`\
  \ 的构造函数只负责初始化类的非类成员。\n\n因此，当创建一个 `TutorPair` 时，C++ 会执行以下操作（按所示顺序）：\n\n1. 它调用 `Student`\
  \ 对象 `s` 的构造函数。\n2. 它调用 `Teacher` 对象 `t` 的构造函数。\n3. 进入 `TutorPair` 自身的构造函数。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 数据成员的构造函数按照它们在类中出现的顺序被调用。\n\n\
  ![onthecd.eps](img/onthecd_fmt.jpeg) 以下的 `TutorPairConstructor` 程序演示了：\n\n```cpp\n\
  //\n// TutorPairConstructor - 此程序演示了\n// 数据成员是如何自动构造的\n//\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nclass Student\n{\nprotected:\n\
  \    double dGrade; // 学生的 GPA\n    int nSemesterHours;\n\npublic:\n    // 构造函数\
  \ - 将学生初始化为合法的状态\n    Student()\n    {\n        cout << \"Constructing a Student\
  \ object\" << endl;\n        dGrade = 0.0;\n        nSemesterHours = 0;\n    }\n\
  };\n\nclass Teacher\n{\npublic:\n    // 构造函数 - 将学生初始化为合法的状态\n    Teacher()\n   \
  \ {\n        cout << \"Constructing a Teacher object\" << endl;\n    }\n};\n\nclass\
  \ TutorPair\n{\nprotected:\n    Student s;\n    Teacher t;\n    int nNumberOfMeetings;\n\
  \npublic:\n    TutorPair()\n    {\n        cout << \"Constructing TutorPair members\"\
  \ << endl;\n        nNumberOfMeetings = 0;\n    }\n};\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 创建一个 TutorPair 并初始化\n    cout << \"Creating the TutorPair\"\
  \ << endl;\n    TutorPair tp;\n    // 在程序终止前等待用户准备好\n    // 以便用户查看程序结果\n    system(\"\
  PAUSE\");\n    return 0;\n}\n```\n\n`main()` 程序只是输出了一条消息并创建了 `TutorPair` 类对象 `tp`。这导致\
  \ C++ 了数据成员并输出：\n\n```\nCreating the TutorPair\nConstructing a Student object\n\
  Constructing a Teacher object\n```\n\n### 析构函数\n\n正如对象被创建一样，它们也会被销毁。（我有类似的经文记载）。如果一个类有一个构造函数来设置对象，那么它也应该有一个特殊的成员函数来拆解对象并释放构造函数可能分配的资源。这个函数被称为析构函数。\n\
  \n析构函数的类名前面有一个波浪号（`~`）。和构造函数一样，析构函数没有返回值（甚至没有 `void`），并且不能像普通函数一样被调用。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 技术上，你可以显式地调用析构函数：`s.~Student()`。然而，很少这样做，只有在高级编程技术中需要，例如在预定的内存地址上分配对象。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在逻辑中，波浪号有时表示“非”，所以析构函数就是“非构造函数”。懂了吗？\n\nC++ 在以下三种情况下会自动调用析构函数：\n\n- 局部对象在离开作用域时调用析构函数。\n\
  - 在堆上分配的对象在传递给 `delete` 时调用析构函数。\n- 全局对象在程序终止时调用析构函数。\n\n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 以下的 `StudentDestructor` 程序包含了一个构造函数在堆上分配内存的 `Student` 类。因此，该类需要一个析构函数将内存返回堆。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 任何构造函数分配资源的类，特别是在堆上分配内存的类，都需要一个析构函数来归还这些内存。\n\n程序在函数\
  \ `fn()` 中创建了几个对象，然后在函数返回时允许这些对象离开作用域并析构。该函数返回一个指向 `fn()` 在堆上分配的对象的指针。该对象在 `main()`\
  \ 中被返回堆。\n\n```cpp\n//\n// StudentDestructor - 此程序演示了\n// 使用析构函数返回构造函数分配的资源\n//\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Student\n{\nprotected:\n    double* pdGrades;\n    int* pnHours;\n\npublic:\n\
  \    Student(int n)\n    {\n        cout << \"Constructing a Student object\" <<\
  \ endl;\n        pdGrades = new double[n];\n        pnHours = new int[n];\n    }\n\
  \n    ~Student()\n    {\n        cout << \"Destructing a Student object\" << endl;\n\
  \        delete[] pdGrades;\n        delete[] pnHours;\n    }\n};\n\nStudent* fn()\n\
  {\n    Student s1(5);\n    Student s2(10);\n    return new Student(20);\n}\n\n int\
  \ main(int nNumberofArgs, char* pszArgs[])\n{\n    Student* pS = fn();\n    delete\
  \ pS;\n    return 0;\n}\n```\n\n输出如下：\n\n```\nConstructing a Student object\nConstructing\
  \ a Student object\nDestructing a Student object\nDestructing a Student object\n\
  Constructing a Student object\nDestructing a Student object\n```\n\n\n\n\n\n```cpp\n\
  // constructor - init the student to a legal state\n\nStudent()\n{\n    cout <<\
  \ “Constructing a Student object” << endl;\n    pdGrades = new double[128];\n  \
  \  pnHours = new int[128];\n}\n\n~Student()\n{\n    cout << “Destructing a Student\
  \ object” << endl;\n    delete[] pdGrades;\n    pdGrades = 0;\n    delete[] pnHours;\n\
  \    pnHours = 0;\n}\n};\n\nStudent* fn()\n{\n    cout << “Entering fn()” << endl;\n\
  \    // create a student and initialize it\n    cout << “Creating the Student s”\
  \ << endl;\n    Student s;\n    // create an array of Students\n    cout << “Create\
  \ an array of 5 Students” << endl;\n    Student sArray[5];\n    // now allocate\
  \ one off of the heap\n    cout << “Allocating a Student from the heap” << endl;\n\
  \    Student *pS = new Student;\n    cout << “Returning from fn()” << endl;\n  \
  \  return pS;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // now\
  \ allocate one off of the heap\n    Student *pS = fn();\n    // delete the pointer\
  \ returned by fn()\n    cout << “Deleting the pointer returned by fn()” << endl;\n\
  \    delete pS;\n    pS = 0;\n    // wait until user is ready before terminating\
  \ program\n    // to allow the user to see the program results\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n程序的输出结果如下：\n\n```\nEntering fn()\nCreating the Student\
  \ s\nConstructing a Student object\nCreate an array of 5 Students\nConstructing\
  \ a Student object\nConstructing a Student object\nConstructing a Student object\n\
  Constructing a Student object\nConstructing a Student object\nAllocating a Student\
  \ from the heap\nConstructing a Student object\nReturning from fn()\nDestructing\
  \ a Student object\nDestructing a Student object\nDestructing a Student object\n\
  Destructing a Student object\nDestructing a Student object\nDestructing a Student\
  \ object\nDeleting the pointer returned by fn()\nDestructing a Student object\n\
  Press any key to continue . . .\n```\n\n第一条消息来自 `fn()` 本身，它显示了一个启动横幅让我们知道控制权已进入该函数。`fn()`\
  \ 函数随后创建了一个对象 `s`，这导致构造函数输出了一条消息。接着它创建了一个包含五个 `Student` 对象的数组，导致 `Student` 构造函数又输出了五条消息。最后\
  \ `fn()` 使用 `new` 关键字从堆上又分配了一个 `Student` 对象。\n\n`fn()` 在返回之前做的最后一件事是输出退出消息。C++ 自动调用了六次析构函数：五次针对数组元素，一次针对函数开头创建的\
  \ `s` 对象。\n\n![tip.eps](img/tip_fmt.jpeg) 你无法从输出中看出，但对象的析构顺序与它们的构造顺序相反。\n\n在 `main()`\
  \ 函数删除由 `fn()` 返回的指针之前，为在堆上分配的对象不会被调用析构函数。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 当对象的指针超出作用域时，在堆上分配的内存块并不会超出作用域。程序员有责任使用 `delete` 命令确保对象返回到堆中。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 使用 `delete` 返回非数组指针。使用 `delete[]` 返回数组。\n\n## 析构数据成员\n\n数据成员也会自动析构。析构发生的顺序与构造顺序相反：析构函数的体首先被调用，然后按照数据成员构造顺序的逆序依次调用每个数据成员的析构函数。\n\
  \n![onthecd.eps](img/onthecd_fmt.jpeg) 为了演示这一点，我为 `TutorPairConstructor` 程序添加了一个析构函数。整个列表较长，不便包含在这里，但它包含随附的\
  \ CD-ROM 中，文件名为 `TutorPairDestructor`。我在这里仅包含了 `TutorPair` 类：\n\n```cpp\nclass TutorPair\n\
  {\nprotected:\n    Student s;\n    Teacher t;\n    int nNumberOfMeetings;\npublic:\n\
  \    TutorPair()\n    {\n        cout << “Constructing the TutorPair members” <<\
  \ endl;\n        nNumberOfMeetings = 0;\n    }\n    ~TutorPair()\n    {\n      \
  \  cout << “Destructing the TutorPair object” << endl;\n    }\n};\n\nvoid fn()\n\
  {\n    // create a TutorPair and initialize it\n    cout << “Creating the TutorPair\
  \ tp” << endl;\n    TutorPair tp;\n    cout << “Returning from fn()” << endl;\n\
  }\n```\n\n该程序的输出如下：\n\n```\nCreating the TutorPair tp\nConstructing a Student object\n\
  Constructing a Teacher object\nConstructing the TutorPair members\nReturning from\
  \ fn()\nDestructing the TutorPair object\nDestructing a Teacher object\nDestructing\
  \ a Student object\nPress any key to continue . . .\n```\n\n该程序在 `fn()` 函数内部创建了\
  \ `TutorPair` 对象。构造函数的消息与 `TutorPairConstructor` 程序完全相同。`TutorPair` 析构函数的消息在控制权返回\
  \ `main` 时出现，它们出现的顺序与构造函数消息的顺序完全相反，首先来自 `~TutorPair`，然后是 `~Teacher`，最后是 `~Student`。\n\
  \n![technicalstuff](img/technicalstuff.jpeg) 静态数据成员\n\n一种值得单独说明的特殊数据成员被称为类成员或静态成员，因为它被标记了\
  \ `static` 关键字：\n\n```cpp\nclass Student\n{\nprotected:\n    static int nNumberOfStudents;\n\
  \    int nSemesterHours;\n    double dGrade;\npublic:\n    Student()\n    {\n  \
  \      nSemesterHours = 0;\n        dGrade = 0.0;\n        nNumberOfStudents++;\n\
  \    }\n    ~Student()\n    {\n        nNumberOfStudents--;\n    }\n};\n\nint Student::nNumberOfStudents\
  \ = 0;\n```\n\n静态成员是类的属性而不是对象的属性。在这个示例中，`nNumberOfStudents` 维护了 `Student` 对象的计数。静态成员在程序启动时初始化。你可以在构造函数中操作它们并在析构函数中递减。\n\
  \n## 第 26 章：构造参数\n\n### 本章内容\n- 创建并调用带参数的构造函数\n- 重载构造函数\n- 带参数构造数据成员\n- 展望新的构造格式\n\
  \n25 章中的 `Student` 类非常简单——简单得不合理。毕竟，学生有姓名和 ID，以及平均绩分和杂项数据。我在 25 章选择 GPA 作为建模数据，因为我不需要别人告诉我就如何初始化它——我可以直接清空该字段。但我不能直接清空姓名和\
  \ ID 字段；没有姓名且 ID 为空的学生并不是有效的学生。我需要向构造函数传递参数，告诉它如何初始化这些不可预测字段。\n\n### 带参数的构造函数\n\n\
  C++ 允许如所示定义带参数的构造函数：\n\n```cpp\nclass Student\n{\npublic:\n    Student(const char*\
  \ pszName, int nNewID)\n    {\n        int nLength = strlen(pszNewName) + 1;\n \
  \       pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n   \
  \     nID = nNewID;\n    }\n    ~Student()\n    {\n        delete[] pszName;\n \
  \       pszName = 0;\n    }\nprotected:\n    char* pszName;\n    int nID;\n};\n\
  ```\n\n在这里，构造函数的参数是一个指向 ASCIIZ 字符串的指针，该字符串包含新学生的姓名和 ID。构造函数首先为姓名分配空间，然后将新姓名复制到 `pszName`\
  \ 数据成员中。最后复制学生 ID。\n\n\n\n\n记住，你不能像调用函数一样调用构造函数，因此你必须在声明对象时以某种方式将参数与对象关联。以下代码片段展示了如何实现：\n\
  \n```cpp\nvoid fn()\n{\n    // 正常情况下将参数放在对象旁边\n    Student s1(“Stephen Davis”, 1234);\n\
  \    // 或者在堆上分配对象时，将参数放在类名旁边\n    Student* pS2 = new Student(“Kinsey Davis”, 5678);\n\
  }\n```\n\n参数通常紧跟在对象后面，或者在堆上分配对象时紧跟在类名后面。\n\n### 查看示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `NamedStudent` 程序使用了与代码片段中所示类似的构造函数来创建一个 `Student` 对象，并显示我的——我的意思是他的——名字：\n\
  \n```cpp\n//\n// NamedStudent -此程序演示了\n// 带参数构造函数的用法\n//\n#include <cstdio>\n#include\
  \ <cstdlib>\n#include <iostream>\n#include <cstring>\n\nusing namespace std;\n\n\
  class Student\n{\nprotected:\n    char* pszName;\n    int nID;\n\npublic:\n    Student(const\
  \ char* pszNewName, int nNewID)\n    {\n        cout << “Constructing “ << pszNewName\
  \ << endl;\n        int nLength = strlen(pszNewName) + 1;\n        pszName = new\
  \ char[nLength];\n        strcpy(pszName, pszNewName);\n        nID = nNewID;\n\
  \    }\n    ~Student()\n    {\n        cout << “Destructing “ << pszName << endl;\n\
  \        delete[] pszName;\n        pszName = 0;\n    }\n    // getName() - 返回学生的名字\n\
  \    const char* getName()\n    {\n        return pszName;\n    }\n    // getID()\
  \ - 获取学生的 ID\n    int getID()\n    {\n        return nID;\n    }\n};\n\nStudent*\
  \ fn()\n{\n    // 创建一个学生并初始化它\n    cout << “Constructing a local student in fn()”\
  \ <<endl;\n    Student student(“Stephen Davis”, 1234);\n    // 显示学生的名字\n    cout\
  \ << “The student’s name is “\n    << student.getName() << endl;\n    // 现在在堆上分配一个\n\
  \    cout << “Allocating a Student from the heap” << endl;\n    Student *pS = new\
  \ Student(“Kinsey Davis”, 5678);\n    // 显示这个学生的名字\n    cout << “The second student’s\
  \ name is “\n    << pS->getName() << endl;\n    cout << “Returning from fn()” <<\
  \ endl;\n    return pS;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n\
  \    // 调用创建学生对象的函数\n    cout << “Calling fn()” << endl;\n    Student* pS = fn();\n\
  \    cout << “Back in main()” << endl;\n    // 删除由 fn() 返回的对象\n    delete pS;\n\
  \    pS = 0;\n    // 在终止程序前等待用户准备就绪\n    // 以允许用户查看程序结果\n    system(“PAUSE”);\n\
  \    return 0;\n}\n```\n\n`main()` 程序首先输出一条消息，然后调用函数 `fn()`。该函数创建了一个名字为“Stephen\
  \ Davis”且 ID 为 `1234` 的学生。该函数向对象请求其名字，以证明该名字已准确地记录在对象中。函数继续创建另一个 `Student` 对象（这次是在堆上创建），并同样地要求它显示名字。\n\
  \n`fn()` 函数随后将控制权交回 `main()`；这导致学生对象超出作用域，从而触发 C++ 调用析构函数。`main()` 使用 `delete` 关键字将\
  \ `fn()` 返回的内存释放。这将调用该对象的析构函数。\n\n`Student` 类的构造函数接受指向 ASCIIZ 字符串的指针和一个 `int` 学生\
  \ ID。构造函数在堆上分配一个新的字符数组，然后将传递的字符串拷贝到该数组中。随后它复制学生 ID 的值。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 如果你不记得什么是 ASCIIZ 字符串或 `strlen()` 的作用，请参考第 16 章。\n\n`Student` 类的析构函数通过将 `pszName`\
  \ 中的地址传递给 `delete[]`，将构造函数分配的内存释放到堆上。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 将数组释放到堆上时使用 `delete[]`，将单个对象释放时使用 `delete`。\n\n`getName()` 和 `getID()` 成员函数是访问名字和\
  \ ID 的函数。将 `getName()` 的返回类型声明为 `const char*`（读作“指向常量字符的指针”）而不是简单的 `char*`——意味着调用者无法通过\
  \ `getName()` 返回的地址更改名字。\n\n![remember.eps](img/remember_fmt.jpeg) 如果你不记得 `const\
  \ char*` 和 `char * const` 之间的区别（或者你完全不知道我在说什么），请参考第 18 章。\n\n该程序的输出结果所示：\n\n```\n\
  Calling fn()\nConstructing a local student in fn()\nConstructing Stephen Davis\n\
  The student’s name is Stephen Davis\nAllocating a Student from the heap\nConstructing\
  \ Kinsey Davis\nThe second student’s name is Kinsey Davis\nReturning from fn()\n\
  Destructing Stephen Davis\nBack in main()\nDestructing Kinsey Davis\nPress any key\
  \ to continue . . .\n```\n\n![remember.eps](img/remember_fmt.jpeg) 我以前说过（你你可能忽略了），但这次我真的必须强调：你需要定义具有不同参数的构造函数。这被称为重载。\n\
  \n\n\n\n从 `Student` 类开始，你可以看到 `Student` 内部第一个构造函数接受一个名称、一个学生 ID 以及以初始平均学点（GPA）和学期学时形式表示的转学分。第二个构造函数只接受名称和\
  \ ID；此构造函数为新学生设计，因为它会将 GPA 和学时初始化为零。目前还不清楚第三个构造函数是做什么的——这个默认构造函数将所有内容初始化为零。\n\n\
  `main()` 函数使用第二个构造函数创建了一个名为“Stephen Davis”的新学生；然后它使用第二个构造函数创建了一个名为“Kinsey Davis”的转学学生。程序为这两个学生都添加了\
  \ 3 个学时的学分（仅仅为了说明这仍然有效），并显示了生成的 GPA。\n\n该程序的输出结果所示：\n\n```\nConstructing Stephen\
  \ Davis as a new student.\nConstructing Kinsey Davis as a transfer student.\nStudent\
  \ Stephen Davis has a grade of 3\nStudent Kinsey Davis has a grade of 3.4\nPress\
  \ any key to continue . . .\n```\n\n注意前两个 `Student` 构造函数是非常相似的。这并不常见见。在这种情况下，你可以创建一个两个构造函数都会调用的\
  \ `init()` 函数（为了简洁，此示例中仅显示了构造函数）：\n\n```cpp\nclass Student\n{\nprotected:\n    void\
  \ init(const char* pszNewName, int nNewID, double dXferGrade, int nXferHours)\n\
  \    {\n        cout << “Constructing “ << pszNewName << “ as a transfer student.”\
  \ << endl;\n        int nLength = strlen(pszNewName) + 1;\n        pszName = new\
  \ char[nLength];\n        strcpy(pszName, pszNewName);\n        nID = nNewID;\n\
  \        dGrade = dXferGrade;\n        nSemesterHours = nXferHours;\n    }\npublic:\n\
  \    Student(const char* pszNewName, int nNewID, double dXferGrade, int nXferHours)\n\
  \    {\n        init(pszNewName, nNewID, dXferGrade, nXferHours);\n    }\n    Student(const\
  \ char* pszNewName, int nNewID)\n    {\n        init(pszNewName, nNewID, 0.0, 0);\n\
  \    }\n    // ...class continues as before...\n};\n```\n\n通常情况下，`init()` 函数看起来会像最复杂的构造函数。所有简单的构造函数都会调用\
  \ `init()`，并为某些参数传递默认值，例如为新学生传递转学分成绩和学分的 0。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 你也可以按照如下所示为构造函数（或任何函数）设置默认参数：\n\n```cpp\nclass Student\n{\npublic:\n    Student(const\
  \ char* pszNewName, int nNewID, double dXferGrade = 0.0, int nXferHours = 0);\n\
  \    // ...and so it goes...\n};\n```\n\n如果在声明中没有提供这些参数，C++ 将提供这些默认参数。然而，默认参数可能会产生奇怪的错误信息，并且超出了本书的讨论范围。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 从 C++ 2009 标准开始，你也可以从从一个构造函数中调用另一个构造函数。然而，截至本文写作时，我不知道哪个编译器支持这一功能。\n\
  \n## 默认默认构造函数\n\n对于 C++ 而言，每个类必须有一个构造函数；否则，你无法创建该类的任何对象。如果你没有为你的类提供构造函数，C++ 可能会直接生成错误，但它并没有。为了与无视构造函数的现有\
  \ C 代码兼容，C++ 会自动提供一个隐式定义的默认构造函数（某种默认的默认构造函数），它会调用任何数据成员的默认构造函数。有时我称之为米兰构造函数（Miranda\
  \ constructor）。你知道的，“如果你负担不起构造函数，将为你提供构造函数。”\n\n然而，如果你的类已经有了构造函数，C++ 就不会提供自动的默认构造函数。（既然已经暗示了这不是一个\
  \ C 程序，C++ 就不觉得有义务做任何额外工作来确保兼容性。）\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 结果是：如果你为类定义了一个构造函数，但又想要一个默认构造函数，你必须自己定义它。\n\n下面的代码段有助于演示这一原理。以下代码是合法的：\n\n```cpp\n\
  class Student\n{\n    // ...所有相同的内容，但没有构造函数...\n};\n\nvoid fn()\n{\n    Student\
  \ s; // 使用默认构造函数创建 Student\n}\n```\n\n在这里，对象 `s` 是使用默认构造函数构建的。因为程序员没有提供构造函数，所以 C++\
  \ 提供了一个在在这种情况下什么都不做的默认构造函数。\n\n然而，接下来的代码段无法正常编译：\n\n```cpp\nclass Student\n{\npublic:\n\
  \    Student(const char* pszName);\n    // ...所有相同的内容...\n};\n\nvoid fn()\n{\n \
  \   Student s; // 无法编译\n}\n```\n\n看似无害的添加 `Student(const char*)` 构造函数使得 C++ 无法自动提供用于构建\
  \ `s` 对象的 `Student()` 构造函数。现在编译器抱怨说它再找不到用于构建 `s` 的 `Student::Student()`。添加一个默认构造函数可以解决这个问题：\n\
  \n```cpp\nclass Student\n{\npublic:\n    Student(const char* pszName);\n    Student();\n\
  \    // ...所有相同的内容...\n};\n\nvoid fn()\n{\n    Student s;\n}\n```\n\n通常来说，`init()`\
  \ 函数看起来会像最复杂的构造函数。所有更简单的构造函数都会调用 `init()`，并为某些参数传递默认值，例如为新学生传递转学分成绩和学分的 0。\n\n##\
  \ 数据成员\n\n在之前的示例中，数据成员都是简单类型，如 `int` 和 `double`。对于这些类型，在构造函数内部赋值是足够的。但如果类包含 `char`\
  \ 类型的数据成员呢？\n\n### 使用默认构造函数初始化数据成员\n\n考虑以下示例：\n\n```cpp\nclass Student\n{\nprotected:\n\
  \    void init(const char* pszNewName, int nNewID, double dXferGrade, int nXferHours)\n\
  \    {\n        cout << “Constructing “ << pszNewName << “ as a transfer student.”\
  \ << endl;\n        int nLength = strlen(pszNewName) + 1;\n        pszName = new\
  \ char[nLength];\n        strcpy(pszName, pszNewName);\n        nID = nNewID;\n\
  \        dGrade = dXferGrade;\n        nSemesterHours = nXferHours;\n    }\npublic:\n\
  \    Student(const char* pszNewName, int nNewID, double dXferGrade, int nXferHours)\n\
  \    {\n        init(pszNewName, nNewID, dXferGrade, nXferHours);\n    }\n    Student(const\
  \ char* pszNewName, int nNewID)\n    {\n        init(pszNewName, nNewID, 0.0, 0);\n\
  \    }\n    // ...类继续如前...\n};\n```\n\n`StudentID` 类设计用于顺序分配 ID。该类在静态变量 `StudentID::baseValue`\
  \ 中保留了“下一个值”。\n\n![remember.eps](img/remember_fmt.jpeg) 静态数据成员（也称为类成员）在所有对象间共享。\n\
  \n每当创建一个 `StudentID` 时，构造函数为 `nValue` 分配“下一个值”，然后递增 `baseValue` 以为下一次构造调用做准备。\n\n\
  `Student` 类已经更新，使得 `sID` 字段现在是 `StudentID` 类型。构造函数现在接受名称，但依赖 `StudentID` 在每次创建新的\
  \ `Student` 对象时分配下一个顺序 ID。\n\n![remember.eps](img/remember_fmt.jpeg) 在传递到 `Student`\
  \ 构造函数体之前，每个数据成员（包括 `StudentID`）的构造函数都会调用。\n\n## 使用默认构造函数初始化数据成员\n\n考虑以下示例：\n\n\
  ```cpp\nclass StudentID\n{\nprotected:\n    static int nBaseValue;\n    int nValue;\n\
  public:\n    StudentID()\n    {\n        nValue = nBaseValue++;\n    }\n    int\
  \ getID()\n    {\n        return nValue;\n    }\n};\n\n// 为类属性分配空间\nint StudentID::nBaseValue\
  \ = 1000;\n\nclass Student\n{\nprotected:\n    char* pszName;\n    StudentID sID;\n\
  public:\n    Student(const char* pszNewName)\n    {\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \    }\n    ~Student()\n    {\n        delete[] pszName;\n    }\n    // getName()\
  \ - 返回名称\n    const char* getName()\n    {\n        return pszName;\n    }\n   \
  \ // getID() - 获取 ID\n    int getID()\n    {\n        return sID.getID();\n    }\n\
  };\n```\n\n### 使用不同的构造函数初始化数据成员\n\n现在老板来了并想要给程序添加功能。她想要更新程序，使其能够分配新的学生 ID，而不是总是接受\
  \ `StudentID` 类传递的默认值。因此，我进行了以下更改：\n\n```cpp\nclass StudentID\n{\nprotected:\n \
  \   static int nBaseValue;\n    int nValue;\npublic:\n    StudentID(int nNewID)\n\
  \    {\n        nValue = nNewID;\n    }\n    StudentID()\n    {\n        nValue\
  \ = nBaseValue++;\n    }\n    int getID()\n    {\n        return nValue;\n    }\n\
  };\n```\n\n\n\n```cpp\nstrcpy(pszName, pszNewName);\n\n}\n\npublic:\n\n  Student(const\
  \ char* pszNewName, int nNewID)\n  {\n    initName(pszNewName);\n    StudentID sID(nNewID);\n\
  \  }\n\n  Student(const char* pszNewName)\n  {\n    initName(pszNewName);\n  }\n\
  \n  ~Student()\n  {\n    delete[] pszName;\n    pszName = 0;\n  }\n\n  // getName()\
  \ - 返回学生的名字\n  const char* getName()\n  {\n    return pszName;\n  }\n\n  // getID()\
  \ - 获取学生的 ID\n  int getID()\n  {\n    return sID.getID();\n  }\n};\n```\n\n我为 `StudentID`\
  \ 添加了一个构造函数，允许调用者传递一个值作为学生 ID，而不是接受默认值。现在，如果程序没有提供 ID，学生将被分配下一个顺序的 ID。但是，如果程序确实提供了\
  \ ID，则会使用该 ID，并保持静态计数器不变。\n\n我还为 `Student` 添加了一个构造函数，允许程序在创建学生时提供 `studentID`。这个\
  \ `Student(const char*, int)` 构造函数首先初始化学生的名字，然后会在数据成员 `sID` 上调用 `StudentID(int)`\
  \ 构造函数。\n\n然而，当我执行程序时，令我失望的是这似乎没有产生任何明显的区别。无论是否传递了值进行替换，学生仍然被分配了顺序的学生 ID。\n\n我很快意识到，问题在于\
  \ `Student(const char*, int)` 构造函数并没有在数据成员 `sID` 上调用新的 `StudentID(int)` 构造函数。相反，它是在构造函数体内部创建了一个名为\
  \ `sID` 的新局部对象，然后立即将其丢弃，而对同名的数据成员没有产生任何影响。\n\n请记住，数据成员的构造函数是在控制权传递到构造函数体之前调用的。我需要的不是在局部创建一个新值，而是需要某种方法告诉\
  \ C++ 在创建数据成员 `sID` 时使用除默认构造函数以外的构造函数。C++ 使用以下语法使用特定构造函数初始化数据成员：\n\n```cpp\nclass\
  \ Student\n{\npublic:\n  Student(const char* pszNewName, int nNewID) : sID(nNewID)\n\
  \  {\n    initName(pszName);\n  }\n  // 类其余部分保持不变...\n};\n```\n\n该数据成员出现在冒号之后（冒号用于将此类声明与函数参数隔开），但在函数本身的大括号之前。这会导致\
  \ `StudentID(int)` 构造函数被调用，并将 `nNewID` 值传递过去作为新的学生 ID。\n\n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg)\
  \ 下面的 `CompoundStudent` 程序创建了一个具有默认顺序学生 ID 的 `Student` 对象，同时为第二个 `Student` 对象分配了特定的学生\
  \ ID：\n\n```cpp\n//\n// CompoundStudent - 这一版本的 Student 类\n// 包含一个也是\n// 用户定义类型的数据成员\n\
  //\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  \nusing namespace std;\n\nclass StudentID\n{\nprotected:\n  static int nBaseValue;\n\
  \  int nValue;\n\npublic:\n  StudentID()\n  {\n    nValue = nBaseValue++;\n  }\n\
  \n  StudentID(int nNewValue)\n  {\n    nValue = nNewValue;\n  }\n\n  int getID()\n\
  \  {\n    return nValue;\n  }\n};\n\n// 为类属性分配空间\nint StudentID::nBaseValue = 1000;\n\
  \nclass Student\n{\nprotected:\n  char* pszName;\n  StudentID sID;\n  void initName(const\
  \ char* pszNewName)\n  {\n    int nLength = strlen(pszNewName) + 1;\n    pszName\
  \ = new char[nLength];\n    strcpy(pszName, pszNewName);\n  }\n\npublic:\n  Student(const\
  \ char* pszNewName, int nNewID) : sID(nNewID)\n  {\n    initName(pszNewName);\n\
  \  }\n\n  Student(const char* pszNewName)\n  {\n    initName(pszNewName);\n  }\n\
  \n  ~Student()\n  {\n    delete[] pszName;\n    pszName = 0;\n  }\n\n  // getName()\
  \ - 返回学生的名字\n  const char* getName()\n  {\n    return pszName;\n  }\n\n  // getID()\
  \ - 获取学生的 ID\n  int getID()\n  {\n    return sID.getID();\n  }\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n  // 创建学生并初始化\n  Student student1(\"Stephen\
  \ Davis\");\n  // 显示学生的名字和 ID\n  cout << “第一个学生的名字是 ”\n    << student1.getName()\n\
  \    << “,ID 是 ”\n    << student1.getID()\n    << endl;\n  // 对第二个学生执行相同的操作\n  Student\
  \ student2(\"Janet Eddins\");\n  cout << “第二个学生的名字是 ”\n    << student2.getName()\n\
  \    << “,ID 是 ”\n    << student2.getID()\n    << endl;\n  // 现在创建一个具有唯一 ID 的学生\n\
  \  Student student3(\"Tiffanyrich\", 1234);\n  cout << “第三个学生的名字是 ”\n    << student3.getName()\n\
  \    << “,ID 是 ”\n    << student3.getID()\n    << endl;\n  // 等待用户准备好后终止程序以查看结果\n\
  \  system(“PAUSE”);\n  return 0;\n}\n```\n\n# 第 27 章：拷贝构造函数\n\n## 本章内容\n- 让 C++\
  \ 拷贝对象\n- 创建自己的拷贝构造函数\n- 拷贝数据成员\n- 完全避免拷贝\n\n### 拷贝对象\n\n拷贝构造函数是 C++ 用于创建对象拷贝的构造函数。它的名为\
  \ `X(const X&)`，其中 `X` 是类名。也就是说，它是类 `X` 的一个构造函数，接受一个 `X` 类对象的引用作为参数。我知道这听起来似乎没用，但让我解释一下为什么你的团队需要这样的构造函数。\n\
  \n![remember.eps](img/remember_fmt.jpeg)引用参数类型如 `fn(X&)` 表示“传递对象的引用”，而不是“传递对象的拷贝”。我在第\
  \ 23 章中讨论过引用参数。\n\n请思考一下下面的函数调用：\n\n```cpp\nvoid fn(Student s)\n{\n  // ...无论 fn()\
  \ 执行什么...\n}\n\nvoid someOtherFn()\n{\n  Student s;\n  fn(s);\n}\n```\n\n\n\n在这里，函数\
  \ `someOtherFn()` 创建了一个 `Student` 对象，并将该对象的拷贝传递给 `fn()`。\n\n![remember.eps](img/remember_fmt.jpeg)默认情况下，C++\
  \ 通过值传递对象，这意味着它必须对对象进行拷贝以传递给它所调用的函数（更多信息请参阅第 23 节）。\n\n考虑一下，创建一个对象的拷贝意味着创建一个新对象，并且根据定义，这意味着调用了构造函数。但是，该构造函数的参数会是什么呢？当然，是原始对象的引用。这根据定义，就是拷贝构造函数。\n\
  \n### 默认拷贝构造函数\n\nC++ 提供了一个在大多数情况下都能工作的默认拷贝构造函数。这个拷贝构造函数会对源对象到目标对象进行逐成员的拷贝。\n\n\
  ![tip.eps](img/tip_fmt.jpeg)由于某些很快就会变得清晰的原因，逐成员的拷贝也被称为浅拷贝（shallow copy）。\n\n然而，在某些时候一次拷贝一个成员并不是件好事。考虑一下第\
  \ 26 节中的 `Student` 类：\n\n```cpp\nclass Student\n{\nprotected:\n    char* pszName;\n\
  \    int nID;\n// ...other stuff...\n};\n```\n\n从一个对象到另一个对象拷贝 `int` 数据成员 `nID` 没有问题。然而，从源对象到目标对象拷贝指针\
  \ `pszName` 可能会导致问题。\n\n例如，如果 `pszName` 指向堆内存（它几乎总是这样的）怎么办？现在你有两个对象，它们都指向堆上的同一块内存。这在图\
  \ 27-1 中所示。\n\n**图 27-1：** 默认情况下，C++ 执行逐成员的“浅”拷贝来创建对象的拷贝，例如当将对象传递给函数时。\n\n![617977-fg2701.eps](img/617977-fg2701_fmt.jpeg)\n\
  \n当 `Student` 对象的拷贝离开作用域时，该类的析构函数可能会删除 `pszName` 指针，从而将该块内存返回堆，尽管原始对象仍在使用该块内存。当原始对象再次删除同一个指针时，堆就会被搞乱，程序将会带有诡异且在很大程度上误导性的错误信息而崩溃。\n\
  \n### 示例\n\n![onthecd.eps](img/onthecd_fmt.jpeg) 下面的 `ShallowStudent` 程序演示了浅拷贝如何导致严重的问题：\n\
  \n```cpp\n//\n// ShallowStudent - 这个程序演示了为什么\n// 默认浅拷贝构造函数\n// 并不总是正确的选择。\n//\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  \nusing namespace std;\n\nclass Student\n{\nprotected:\n    char* pszName;\n   \
  \ int nID;\n\npublic:\n    Student(const char* pszNewName, int nNewID)\n    {\n\
  \        cout << “Constructing “ << pszNewName << endl;\n        int nLength = strlen(pszNewName)\
  \ + 1;\n        pszName = new char[nLength];\n        strcpy(pszName, pszNewName);\n\
  \        nID = nNewID;\n    }\n    ~Student()\n    {\n        cout << “Destructing\
  \ “ << pszName << endl;\n        delete[] pszName;\n        pszName = 0;\n    }\n\
  \    // access functions\n    const char* getName()\n    {\n        return pszName;\n\
  \    }\n    int getID()\n    {\n        return nID;\n    }\n};\n\nvoid someOtherFn(Student\
  \ s)\n{\n    // we don’t need to do anything here\n}\n\nvoid someFn()\n{\n    Student\
  \ student(“Adam Laskowski”, 1234);\n    someOtherFn(student);\n    cout << “The\
  \ student’s name is now “\n    << student.getName() << endl;\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    someFn();\n    // wait until user is ready\
  \ before terminating program\n    // to allow the user to see the program results\n\
  \    system(“PAUSE”);\n    return 0;\n}\n```\n\n这个看似简单的程序包含一个严重的问题。`main()` 函数仅仅调用了\
  \ `someFn()` 函数。该函数创建了一个局部 `student` 对象并以值传递传递给函数 `someOtherFn()`。这第二个函数除了返回给调用者之外什么都没做。然后\
  \ `someFn()` 函数显示了学生的姓名并返回到 `main()`。\n\n程序的输出显示了一些有趣的结果：\n\n```\nConstructing Adam\
  \ Laskowski\nDestructing Adam Laskowski\nThe student’s name is now X$±\nDestructing\
  \ X$±\nPress any key to continue . . .\n```\n\n第一条消息来自 `Student` 构造函数，因为学生对象在 `someFn()`\
  \ 开始时被创建。为 `someOtherFn()` 创建 `Student` 拷贝时调用的默认拷贝构造函数没有生成任何消息。析构消息在 `someOtherFn()`\
  \ 结束、局部对象 `s` 离开作用域时触发。\n\n`someFn()` 中的输出消息显示对象现在已经乱了，因为 `Student` 构造函数分配的用于存储姓名的内存已返回到堆。随后在\
  \ `someFn()` 结束时调用的析构函数证实了情况不对。\n\n![warning_bomb.eps](img/warning_bomb.jpeg)这种类型的错误通常是致命的（对程序员而言）。这个程序之所以没有崩溃，是因为它本就要停止了。\n\
