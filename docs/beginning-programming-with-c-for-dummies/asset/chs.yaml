  \n```\n*pszT++ = ‘\\0’;\n```\n\n生成的机器指令并不一定与下面的表达式不同，而后者更易读也更易调试：\n\n```\n*pszT\
  \ = ‘\\0’;\npszT++;\n```\n\n今天的优化编译器会生成极少量的代码。\n\n## 对不同指针类型的操作\n\n当数组中的每个元素长度为\
