  \ `0x14` 等于十进制的 20。\n\n幸运的是，在 C++ 中，无论数组的单个元素有多大，`array + n` 都指向 `array[n]`。C++\
  \ 会进行必要的转换以确保这种关系的真实性。\n\n## 常量\n\n第 14 章引入了 `const` 变量的概念。例如，以下\n\n```\nconst double\
