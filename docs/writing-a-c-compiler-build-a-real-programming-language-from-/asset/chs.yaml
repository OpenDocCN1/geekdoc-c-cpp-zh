- "# 编写 C 编译器：从零构建真实的编程语言指南\n\n献 Brian\n\n## 关于作者\n\nNora Sandler 是一位住在西雅图的软件工程师。她拥有芝加哥大学计算机科学学学位，在那里研究过并行编程语言的实现。在担任多年渗透测试员后，她回到了编译器领域。最近，她在一家终端安全公司从事领域特定语言（DSL）工作。你可以在\
  \ [`norasandler.com`](https://norasandler.com) 阅读她关于恶作剧、编译器和其他计算机主题的博客。\n\n## 关于技术审查员\n\
  \nStephen Kell 是一位编程语言和系统设计与实现的研究员、教育者和顾问。在过去的十二年里，他在各种环境中教授过编译器和 C 语言编程，担任过 C 语言规范演变的\
  \ ISO 研究小组成员，并就 C 的规范、设计、实现及其链接和调试工具发表了大量研究论文。这些领域继续是他作为伦敦国王学院学者所领导的研究重点。\n\n# 致谢\n\
  \n我在 2017 年秋季参加 Recurse Center 学习时，开始写了一系列博客文章，这些文章最终变成了这本书。我非常感谢 Recurse Center\
  \ 给了我时间和空间，在这个充满友且才华的人的社区中追求自己的好奇心，而没有产生任何产出的压力。没有他们，我永远不会尝试这个项目。\n\n我也感谢 Recurse\
  \ Center 社区的每一个人，他们的建议、鼓励和结对编程课程塑造了最初的博客文章。我特别感谢 Julian Squires，向我推荐了 Abdulaziz\
  \ Ghuloum 的《编译器构建的增进方法》，这篇文章是项目的起点。还要感谢 Raph Levien 教我了用于表达式解析的优先级爬升法（precedence\
  \ climbing method）。\n\n感谢本书的技术审查员 Stephen Kell，他周全的评论让书更加清晰、准确。我特别感谢 Stephen 承担了审查随附测试套件和参考实现的艰巨任务。感谢\
  \ Alex Freed，他第一个联系我并提议写一本书，并提供了宝贵的指导和鼓励；Jill Franklin 和 Eva Morrow 护送本书完成了最后阶段。James\
  \ L. Barry 提供了封面设计。感谢 No Starch Press 的整个团队，为这本书的实现付出了巨大努力。\n\n感谢所有向我发送邮件并针对早期版本提交\
  \ GitHub issue 的读者，包括最初的博客文章和抢先体验版本。他们的建议让书变得更好，他们对编译器的热情提醒了我写这本书的原因。\n\n感谢我的朋友\
  \ Haney Maxwell 对第 13 章提供的详细反馈。\n\n最后，感谢我的伙伴 Brian，我经常依靠他可靠的建议和语言直觉，当我请求时他总是乐意“读读这一段并告诉我是否通顺”，并且一直支持并信任我。\n\
  \n\n\n\n当一位朋友向我推荐了由 Abdulaziz Ghuloum 编写的名为《编译器构造的增量方法》的短论文（[`scheme2006.cs.uchicago.edu/11-ghuloum.pdf`](http://scheme2006.cs.uchicago.edu/11-ghuloum.pdf)）时，我终于解决了难题。它解释了如何从最简单的程序开始，每次添加一种新的语言结构，将\
  \ Scheme 编译为 x86 汇编。我并没有特别为 Scheme 写编译器，所以我将其改为我更感兴趣的语言：`C`。随着项目的进行，我从 x86 切换到了它的现代对应版本\
  \ `x64 汇编`。我还扩展了对更大范围 `C` 子集的支持，并添加了一些优化阶段。到此时，我早已远超 Ghuloum 原始的方案（这里是个双关语，抱歉），但他的基本策略仍然非常有效：一次专注于语言的一个微小部分，让你很容易保持正轨并看到自己正在取得进展。在书中，你将挑战同一个项目。在此过程中，你将对你编写的代码以及它运行的系统有更深入的理解。\n\
  \n## 本书的读者\n\n我写这本书是为了那些对编译器工作原理感到好奇的程序员。关于编译器构造的许多书籍是作为大学或研究生课程的教材编写的，但这一本旨在让那些自主探索该主题的人也能理解。要完成这个项目，你不需要任何关于编译器、解释器或汇编代码的先验知识。对计算机体系的基本了解会有帮助但并非必不可；我会在重要概念出现时讨论它们，并偶尔引导你参考带有更多背景信息的资源。尽管如此，这并不是一本写给初级程序员的书。你应该能够熟练地独立编写实质性程序，并熟悉二进制数、正则表达式以及图和树等基础数据结构。你需要足够熟悉\
  \ `C` 语言以便阅读和理解短小的 `C` 程序，但你不需要成为 `C` 编程专家。我们将在学习过程中探索这种语言的方方面。\n\n尽管这本书面向该领域的新手，但它对于已经具有某些编译器经验的人来说也同样值得读。也许你曾为大学课程或个人项目实现过一种玩具语言，现在想尝试一些更真实的东西。或者你过去接触过解释器，现在想尝试将程序编译为机器码。如果你属于这一类，这本书将涵盖一些你已经熟悉的内容，但也会提供许多新挑战。至少，我保证你会学到一些关于\
  \ `C` 的新知识。\n\n## 为什么要写 C 编译器？\n\n我假设你已经认同了编写编译器的想法——毕竟你确实拿起了这本书。我想稍微聊聊为什么我们特别要为\
  \ `C` 编写一个编译器。简短的回答是，`C` 是一种（相对）简单的语言，但并不是一种玩具语言。从核心角度来看，`C` 简单到即使你以前从未写过编译器，也能实现它。但它也是一个特别清晰的例子，展示了编程语言是如何被其运行的系统和使用者所塑造的。`C`\
  \ 的某些方面根据你的目标硬件而异；另一些在操作系统之间有所不同；还有一些被留未规定，以给编译器编写者更大的灵活性。语言的某些部分是历史遗留，为了支持旧代码而存在，而另一些则是为了让\
  \ `C` 更安全、更可靠的近期尝试。\n\n`C` 中这些杂乱的部分值得处理，原因有两个。首先，你将建立一个稳固的心理模型，了解你的编译器是如何与系统中所有其他部分配合的。其次，你将感知到不同群体为这种语言带来的不同视角，从试图消除歧义和不一致性的规范制定者，到寻求性能改进的编译器实现者，再到只想让代码运行起来的普通程序员。\n\
  \n我希望这个项目能让你以不同的方式思考*所有*编程语言：它们不是被载入语言标准的、固定的规则集，而是设计者、实现者和使用者之间持续的谈判博弈。一旦你开始这样看待编程语言，它们就会变得更丰富、更有趣，而且处理起来也不那么令人沮丧。\n\
  \n## 10,000 英尺俯视编译\n\n在我们继续之前，让我们从高层视角看看源代码是如何变成可执行文件的，以及编译器在过程处于什么位置。我们将顺便澄清一些术语，并回顾一点点计算机体系结构。*编译器*是一个将代码从一种编程语言翻译成另一种语言的程序。它只是负责让你的代码运行起来的整个系统中的一部分（尽管通常是最复杂的一部分）。我们将构建一个编译器，将\
  \ `C` 程序翻译成*汇编代码*，即我们希望处理器运行的指令的文本表示。\n\n不同的处理器理解不同的指令；我们将关注 `x64` 指令集，也称为 `x86-64`\
  \ 或 `AMD64`。这是大多数人计算机运行的指令。（你可能遇到的另一个指令集是 `ARM`。大多数智能手机和平板电脑都拥有 `ARM` 处理器，它们也开始出现在笔记本电脑中了。）\n\
  \n处理器不理解文本，所以它不能直接运行我们的汇编代码。我们需要将其转换为*目标代码*，或者说处理器可以解码和执行的二进制指令。例如，汇编指令 `ret` 对应字节\
  \ `0xc3`。*汇编器*处理这种转换，输入汇编程序并输出目标文件。最后，*链接器*将我们最终程序所需的所有目标文件合并，解决对其他文件中变量或函数的引用，并添加一些关于如何实际启动程序的信息。最终结果是一个可以运行的可执行文件。这是对所发生过程的极其简化的视图，但对于我们开始工作来说已经足够了。\n\
  \n除了编译器、汇编器和链接器之外，编译 `C` 程序还需要另一个工具：*预处理器*，它在编译器之前运行。预处理器会剔除注释、执行诸如 `#include` 之类的预处理指令并展开宏，产生准备好编译的预处理代码。整个过程如图\
  \ 1 所示。\n\n当你使用类似 `gcc` 或 `clang` 的命令编译程序时，你实际上是在调用*编译器驱动程序*，这是一个负责轮调用预处理器、编译器、汇编器和链接器的小封装器。你将编写自己的编译器和编译器驱动程序，但你不会编写自己的预处理器、汇编器或链接器。相反，你将使用系统中已经安装的这些工具的版本。\n\
  \n\n\n\n\n在本书中，你将为 C 语言的一个大型子集构建编译器。你可以使用任何喜欢的编程语言来编写编译器；我将用伪代码展示实现的关键部分。本书分为三个部分。在第一部分，基础中，你将实现\
  \ C 的核心功能：表达式、变量、控制流语句和函数调用。\n\n## 如何使用本书\n\n每一章都是实现特定特性的详细指南。在章节开头，我将讨论你即将构建的特性以及你开始之前需要理解的任何重要概念。然后，我们将介绍如何更新编译器的每个阶段以支持这个新特性。对于任何特别棘手或重要的步骤，我将包含伪代码。不要觉得你需要完全遵循伪代码；它的作用是阐明你想实现的目标，而不是规定你执行该目标的所有细节。\n\
  \n每一章都建立在上一章的基础上，因此你需要按顺序完成它们，唯一的例外是你可以在不先完成第二部分的情况下，直接跳到第三部分。\n\n### 测试套件\n\n每一章都包含几个检查点，你可以在那里停下，并使用本书的测试套件测试你的编译器，该测试套件位于\
  \ `https://github.com/nlsandler/writing-a-compiler-tests`。对于每一章，测试套件都包含一组无效的测试程序（你的编译器应该带错误消息拒绝这些程序）和一组有效的测试程序（它应该成功编译这些程序）。使用提供的\
  \ `test_compiler` 脚本运行测试。\n\n### 额外奖励特性\n\n某些章节提到了你可以独立实现的额外语言特性；我称这些为“额外加分”特性。额外加分特性与章节涵盖的主特性相关。你可以使用已经学习的技术来实现它，但你必须自己想出细节。你可能需要查看几个测试程序的汇编输出来弄清楚如何处理它们。你还需要咨询外部引用，如\
  \ C 标准和 x64 指令集文档（你可以在 xxxvi 页的“额外资源”中找到这些和其他资源的链接）。额外加分特性是完全可选的；尝试你认为有趣的，并跳过你不感兴趣的。\n\
  \n这些特性的测试包含在测试套件中，但默认不会运行。你可以通过向 `test_compiler` 传递适当的命令行选项来运行它们。\n\n## 关于选择实现语言的建议\n\
  \n虽然可以使用任何编程语言编写编译器，但某些语言比其他语言更适合这项任务。我们将为 C 编写一个编译器，但不建议用 C 来编写它。尽管 C 作为一种编程语言有其优势，但这个项目并没有发挥它的任何优势。选择一个内存管理更简单、标准库更丰富的语言会更好。\n\
  \n\n\n\n\n你还应该考虑使用具有`pattern matching`（模式匹配）语言。你可以将其想象为一种增强版的 `switch` 语句，允许你为具有不同结构和包含不同数据的值定义不同的分支。（注意，这与正则表达式匹配不同，后者偶尔也被称为“模式匹配”。）我们最的一段伪代码展示了模式匹配的实际应用：\n\
  \n```\ngreet(someone):\n    match someone with\n    | ImportantPerson(title, last_name)\
  \ ->\n        say(\"Good day to you, {title} {last_name}!\")\n    | Friend(first_name)\
  \ -> say(\"Hello, {first_name}!\")\n    | Stranger -> say(\"Howdy, stranger!\")\n\
  \    | Animal(name, species) ->\n        say(\"Hi, {name}! Who's a good {species}?\
  \ It's you!\")\n```\n\n事实证明，这在分析和转换程序时非常有用，程序通常包含多种类型的表达式、语句等，如下所示：\n\n```\ndo_something(expr):\n\
  \    match expr with\n    | Constant(int) -> do_something_for_int(int)\n    | BinaryExpr(op,\
  \ left, right) ->\n        do_something(left)\n        do_something(right)\n   \
  \ // handle more kinds of expressions\n```\n\n本书中的伪代码随处使用了模式匹配，因此如果你使用支持它的语言，跟上进度的将会更加轻松。\n\
  \n长期以来，模式匹配一直是 ML 和 Haskell 等函数式语言的领域。（这些语言在编程语言学术界非常流行并非巧合。）最近，几乎所有人也都注意到模式匹配非常棒，而且它正在进入更多主流语言。Rust\
  \ 和 Swift 都支持模式匹配，Python 在 `3.10` 版本中添加了该功能，而 `Java` 从 `16` 版本开始已逐步构建对其的支持。在你最喜欢的语言中开始编写编译器之前，请做一些研究，了解它对模式匹配有何种支持。根据你的发现，你可能会决定使用该语言的最新版本、使用模式匹配库（例如\
  \ C++ 就有几个），或者改用你第二喜爱的语言。你也可能决定忽略我的建议；模式匹配很有帮助，但没有它也可以运行。\n\n## 系统要求\n\n为了完成这个项目，你需要一个带有\
  \ x64 处理器的 macOS 或 Linux 系统（或者带有 Apple Silicon 处理器的 Mac，它可以不加费力地模拟 x64）。如果你使用的是\
  \ Windows 机器，你需要使用适用于 Linux 的 Windows 子系统 (`WSL`) 来设置 Linux 环境。你可以在 `[`docs.microsoft.com/en-us/windows/wsl/install`](https://docs.microsoft.com/en-us/windows/wsl/install)`\
  \ 找到 `WSL` 的安装说明。\n\n该项目有两个依赖。要运行 `test_compiler`，你需要 Python `3.8` 或更高版本。你可能已经安装了较版本的\
  \ `Python`；如果没有，你可以从 `[`www.python.org/downloads`](https://www.python.org/downloads)`\
  \ 下载，或者使用系统的包管理器进行安装。（有关详细的安装说明，请参本书的网页：`[`norasandler.com/book/#setup`](https://norasandler.com/book/#setup)`。）要检查是否安装了合适的\
  \ `Python` 版本，请运行：\n\n```\n$ python3 --version\n```\n\n你还需要一个真正的 C 编译器（或者严格来说，一个真实的\
  \ C 编译器驱动程序）来调用预处理器、汇编器和链接器。测试脚本也依赖于编译器驱动程序。如果你在 Linux 上，使用 `GCC` 作为编译器驱动程序。如果你在\
  \ macOS 上，使用 Xcode 自带的 `Clang` 版本。（测试脚本使用 `gcc` 命令调用编译器驱动程序；Xcode 的 `Clang` 以 `clang`\
  \ 和别名 `gcc` 的名称安装。）安装一个可以单步执行汇编代码的调试器也是好意，可以帮助你调试编译器生成的代码。我建议在 Linux 上使用 `GDB`，在\
  \ macOS 上使用 `LLDB`。\n\n### 在 Linux 上安装 GCC 和 GDB\n\n如果你正在运行 Linux，应该使用 `GCC` 作为编译器驱动程序并将\
  \ `GDB` 作为调试器。要检查它们是否已经安装，请运行：\n\n```\n$ gcc -v\n$ gdb -v\n```\n\n如果缺少其中一个命令，你可以通过系统的包管理器安装它们。例如，在\
  \ Ubuntu 上安装这两个工具，请运行：\n\n```\n$ sudo apt-get install gcc gdb\n```\n\n### 在 macOS\
  \ 上安装命令行开发者工具\n\nmacOS 上最简单的选项是安装命令行开发者工具，其中包含 `Clang`。要检查它们是否已经安装，请运行：\n\n```\n\
  $ clang -v\n```\n\n如果工具未安装，系统将提示你安装。本书中的示例是用 `GCC` 编译的，所以如果你用 `Clang` 编译它们，生成的汇编看起来会有所不同。\n\
  \n### 在 Apple Silicon 上运行\n\n如果你的电脑是 Apple Silicon 处理器（Apple 芯片），你需要使用 Rosetta 2\
  \ 来运行程序。最简单的解决方案是在 Rosetta 2 下将所有内容（包括你的编译器和测试脚本）作为 x64 运行。打开 x64 shell，运行：\n\n\
  ```\n$ arch -x86_64 zsh\n```\n\n如果 `arch` 命令不起作用，可能没有安装 Rosetta 2。要安装它，请运行：\n\n\
  ```\n$ softwareupdate --install-rosetta --agree-license\n```\n\n### 验证你的设置\n\n测试脚本包含一个\
  \ `--check-setup` 选项，你可以它确保设置到位。运行以下命令下载测试套件并验证你的设置：\n\n```\n$ git clone https://github.com/nlsandler/writing-a-compiler-tests.git\n\
  $ cd writing-a-compiler-tests\n$ ./test_compiler --check-setup\n所有系统要求已满足！\n```\n\
  \n如果测试脚本没有报告任何问题，你就可以开始工作了！\n\n## 额外资源\n\n你可以在本书的网页找到错误列表、更新、链接和其他资源：`[`norasandler.com/book/`](https://norasandler.com/book/)`。如果你在使用项目或测试脚本遇到遇到问题，请先查看此页面。`GCC`、Xcode\
  \ 命令行工具以及此项目依赖的其他工具会定期发布；书籍网页包含了为了配合这些工具最新版本而对项目进行的任何更新。\n\n如果你卡住了并想查看完整的、可运行的项目实现，请参考本书的参考实现：`NQCC2`，一个“不完全是\
  \ C”的编译器，位于 `[`github.com/nlsandler/nqcc2`](https://github.com/nlsandler/nqcc2)`。它是用\
  \ OCaml 编写的，但即使你不是 OCaml 程序员，它留有大量的注释来帮助你理解。\n\n最后，这里有一些对你可能会有帮助的外部资源。如果你决定实现任何额外的加分功能，或者在本书涵盖范围之外进一步扩展你的编译器，这些资源将特别有用。\n\
  \n\n\n\n\n*   `C standard` 规定了 C 程序应该如何行为。我们将使用 `C17` (ISO/IEC 9899:2018)，这是本书编写时该标准的最新版本。你可以从国际标准组织\
  \ (ISO) 网站 [https://www.iso.org/standard/74528.html] 购买副本。或者，如果你对花 200 美元买一份 PDF\
  \ 不感兴趣，你可以使用一个类似的标准草案版本，该版本可以在 [https://www.open-std.org/JTC1/SC22/WG14/www/docs/n2310.pdf]\
  \ 免费获取。这是 `C23` 的早期草案——即 `C17` 之后的下一个标准版本——带有指示更改内容的差异标记。它不是官方的 ISO 标准，因此我不建议用它来构建生产环境的\
  \ C 编译器，但对于本项目来说，它已经足够了。\n\n*   `System V Application Binary Interface (ABI)` 定义了可执行文件在\
  \ Unix 类操作系统上遵循的一 set 约定。当我们从 第 9 章 开始实现函数调用时，这将非常重要。你可以在 [https://gitlab.com/x86-psABIs/x86-64-ABI]\
  \ 找到 x64 系统的最新 System V ABI。\n\n*   `Intel 64 Software Developer’s Manual` ([https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html])\
  \ 是 Intel 关于 x64 指令集的官方文档。我们关注的是第 2 卷，指令集参考。在 [https://www.felixcloutier.com/x86/\
  \ 还有一个非官方版本，更便于浏览。\n\n*   `Compiler Explorer` ([https://godbolt.org]) 是一个非常有用的网站，你可以在那里看到各种广泛使用的编译器如何将你的代码翻译成汇编。它让你易于比较不同编译器的输出，并查看各种优化级别和编译器标志的影响。\n\
  \n> 注意\n\n`C23` 定于 2024 年发布，取代 `C17`。对于我们的目的而言，`C17` 和 `C23` 之间的差异并不显著。我们不会实现 `C23`\
  \ 中引入的新语言特性，但我们也没有实现所有的 `C17`。我们实现的 C 子集在两个版本的标准中看起来几乎完全相同。如果你对 `C23` 中的不同之处感兴趣，可以在\
  \ [https://open-std.org/JTC1/SC22/WG14/www/docs/n3096.pdf] 找到免费的几近最终的草案，并在 [https://en.cppreference.com/w/c/23]\
  \ 找到非正式的变更列表。\n\n## 我们开始吧！\n\n我们已经涵盖了所有的准备工作，准备好开始了。在 第 1 章 中，我们将编译我们的第一个 C 程序。\n\
  \n# 第一部分 基础\n\n![](img/pg2.jpg)\n\n描述\n\n## 1 一个极简编译器\n\n![](img/opener-img.jpg)\n\
  \n在本章中，你将编写一个只能处理最简单 C 程序的极简编译器。你将学习如何读取简单的汇编程序，并实现四个基本的编译阶段，你将在书的其余部分在此基础上进行构建。让我们先来看这些编译阶段。\n\
  \n### 四个编译阶段\n\n你在本章中编写的编译器将分四个处理源代码：\n\n1.  `lexer`（词法分析器）将源代码拆分为 `tokens` 列表。Tokens\
  \ 是程序中最小的语法单元；它们包括分隔符、算术符号、关键字和标识符。如果一个程序像一本书，那么 tokens 就像单个单词。\n2.  `parser`（解析器）将\
  \ tokens 列表转换为 `abstract syntax tree (AST)`，它以一种我们易于遍历和分析的形式表示程序。\n3.  `assembly\
  \ generation`（汇编生成）阶段将 `AST` 转换为汇编代码。在这个阶段，我们仍然用编译器可以理解的数据结构来表示汇编指令。\n4.  `code\
  \ emission`（代码发射）阶段将汇编代码写入可执行文件。\n\n你在本章中编写的编译器将分四个处理源代码：\n\n1.  `lexer`（词法分析器）将源代码拆分为\
  \ `tokens` 列表。Tokens 是程序中最小的语法单元；它们包括分隔符、算术符号、关键字和标识符。如果一个程序像一本书，那么 tokens 就像单个单词。\n\
  2.  `parser`（解析器）将 tokens 列表转换为 `abstract syntax tree (AST)`，它以一种我们易于遍历和分析的形式表示程序。\n\
  3.  `assembly generation`（汇编生成）阶段将 `AST` 转换为汇编代码。在这个阶段，我们仍然用编译器可以理解的数据结构来表示汇编指令。\n\
  4.  `code emission`（代码发射）阶段将汇编代码写入可执行文件。\n\n### 你好，汇编！\n\n最简单的 C 程序如 列表 1-1。\n\n\
  ```c\nint main(void) {\n    return 2;\n}\n```\n\n列表 1-1：一个返回数字 2 的简单程序\n\n该程序包含单个函数\
  \ `main`，包含单个 `return` 语句，该语句返回一个整数（在此情况下为 `2`）。将此程序保存为 `return_2.c`，然后使用 `gcc`\
  \ 命令将其翻译为汇编：\n\n```bash\n$ gcc -S -O -fno-asynchronous-unwind-tables -fcf-protection=none\
  \ return_2.c\n```\n\n如果你使用的是 macOS，此命令可能会调用 Clang 而不是 GCC，但命令行选项的效果相同。这些选项产生了相当易读的汇编：\n\
  \n- `-S`：不运行汇编器或链接器。这让编译器输出汇编而不是二进制文件。\n- `-O`：优化代码。这消除了我们现在感兴趣的一些指令。\n- `-fno-asynchronous-unwind-tables`：不生成用于调试的回溯表。我们不需要。\n\
  - `-fcf-protection=none`：禁用控制流保护。\n\n结果存储在 *return_2.s* 中，应该与 列表 1-2 相似。\n\n```assembly\n\
  \ .globl main\nmain:\n    movl    $2, %eax\n    ret\n```\n\n\n\n\n\n## 列表 1-2：将列表\
  \ 1-1 翻译成汇编程序\n\n你的 `*.s` 文件可能包含其他几行，但你现在可以安全地忽略它们。列表 1-2 中的四行是一个完整的汇编程序。汇编程序有几种类型的语句。第一行\
  \ `.globl main` 是一个*汇编器指令*（assembler directive），是一种为汇编器提供指示的语句。汇编器指令始终以点开头。在这里，`main`\
  \ 是一个*符号*（symbol），它是内存地址的名称。符号出现在汇编指令和汇编器指令中；例如，指令 `jmp main` 会跳转到 `main` 符号所指代的任何地址。\n\
  \n`.globl main` 指令告诉汇编器 `main` 是一个*全局*（global）符号。默认情况下，你只能在定义该符号的同一个汇编文件（因此是同一个对象文件）中使用它。但由于\
  \ `main` 是全局的，其他对象文件也可以引用它。汇编器会将这一事实记录在对象文件的一个名为*符号表*（symbol table）的区域，链接器在连接对象文件时会使用该表。符号表包含了对象文件或可执行文件中所有符号的信息。\n\
  \n在第二行，我们使用 `main` 作为其后续代码的*标签*（label）。标签由字符串或数字后跟冒号组成。标签标记了符号所指的位置。这个特定的标签将 `main`\
  \ 定义为下一行 `movl` 指令的地址。汇编器并该指令的最终内存地址，但它知道指令位于对象文件的哪个*段*（section），以及它相对于该段起始位置的偏移量。（对象文件由多个段组成，每个段存储各种数据；机器指令、全局变量、调试信息等都有单独的段。在运行时，不同的段会被加载到程序地址空间的不同部分中。）`main`\
  \ 的地址将位于*文本段*（text section），该段包含机器指令。由于 `main` 指向该汇编文件中第一条机器指令，它在文本段内的偏移量为 0。汇编器会将此偏移量记录在符号表中。\n\
  \n下一行的 `movl` 指令是一个*机器指令*（machine instruction），它出现在最终的可执行文件中。列表 1-2 中的 `movl` 指令将值\
  \ `2` 移动到一个*寄存器*（register）中，寄存器是一个非常小且快速的存储槽，直接位于 CPU 上。在这里，我们将 `2` 移动到名为 `EAX`\
  \ 的寄存器，它可以容 32 位。根据我们平台的调用约定，返回值通过 `EAX`（或取决于返回类型的 64 位 `RAX`）传递给调用者。由于调用者也知道这一约定，它可以在函数返回后从\
  \ `EAX` 中获取返回值。`movl` 中的 `l` 后缀表示该指令的操作数是*长字*（longwords），即 32 位整数（在 x64 汇编中，与大多数现代\
  \ C 实现不同，*long* 表示 32 位）。`movq` 指令对*双字*（quadwords）或 64 位整数进行操作。当引用此指令而不指定其大小时，只需写\
  \ `mov`。\n\n最后，我们还有另一个机器指令 `ret`，它将控制权返回给调用者。你可能会看到 `retq` 代替 `ret`，因为 `ret` 隐式地对\
  \ 64 位地址操作。我跳了很多细节，包括什么是调用约定以及 `ret` 如何知道调用者在哪里。我将在添加函数调用时重新回到这些内容。*本书中的所有汇编代码都使用\
  \ AT&T 语法。在其他地方你可能会看到 Intel 语法；最大的区别在于它们的操作数顺序不同。*\n\n此时，询问调用者是谁是合理的，因为 `main` 是该程序中唯一的函数。答案是链接器添加了一段名为\
  \ `crt` 的封装代码（`crt` 代表*C 运行时*，C Runtime），用于在 `main` 运行之前处理设置，并在退出后处理清理。这段封装代码执行以下操作：\n\
  \n1. 对 `main` 进行函数调用。这就是为什么 `main` 需要全局可见；如果不是全局的，`crt0` 就无法调用它。\n2. 从 `main` 获取返回值。\n\
  3. 调用 `exit` 系统调用，并将来自 `main` 的返回值传递给它。然后，`exit` 处理操作系统内部终止进程所需的工作，并将返回值转换为退出状态。\n\
  \n结论是，你不需要担心进程的启动或清理；你可以将 `main` 视为一个普通函数。\n\n要验证 *return_2.s* 中的汇编代码工作正常，请对其汇编并链接，运行它，并使用\
  \ Shell 运算符 `$?` 检查退出码：\n\n```\n$ gcc return_2.s -o return_2\n$ ./return_2\n$ echo\
  \ $?\n2\n```\n\n\n\n\n\n注意，你可以像传递普通源文件一样向 `gcc` 命令传递汇编文件。它假设任何带有 `.s` 扩展的文件都包含汇编，因此它会汇编并链接这些文件，而不会尝试先编译它们。\n\
  \n### 编译器驱动程序\n\n正如你在介绍中所学的，编译器本身并没有用。你还需要一个*编译器驱动程序*来调用预处理器、编译器、汇编器和链接器。因此，在开始编写编译器之前，你会先编写一个编译器驱动程序。它应该通过三个步骤将源代码转换为可执行文件：\n\
  \n1. 运行此命令对源文件进行预处理：\n\n```\ngcc -E -P INPUT_FILE -o PREPROCESSED_FILE\n```\n\n\
  该命令预处理 `INPUT_FILE` 并将结果写入 `PREPROCESSED_FILE`。`-E` 选项告诉 GCC 只运行预处理器，而不运行编译过程的后续步骤。默认情况下，预处理器会为预处理输出的每个部分生成行标记符，指示原始源文件以及该源文件中的起始行号。（由于\
  \ `#include` 指令，预处理后的文件可能包含来自多个源文件的代码。）`-P` 选项告诉预处理器不要生成行标记；我们的词法器和解析器无法处理它们。按照惯，`PREPROCESSED_FILE`\
  \ 应该具有 `.i` 文件扩展名。\n\n2. 编译预处理后的源文件并输出带有 `.s` 扩展名的汇编文件。由于你还没有编写编译器，必须为这一步编写一个存根代码（stub）。完成后删除预处理后的文件。\n\
  \n3. 使用此命令汇编并链接汇编文件以生成可执行文件：\n\n```\ngcc ASSEMBLY_FILE -o OUTPUT_FILE\n```\n\n完成后删除汇编文件。\n\
  \n你的编译器驱动程序必须具有特定的命令行界面，以便本书的测试脚本 *test_compiler* 能够运行它。它必须是一个命令行程序，接受 C 源文件的路径作为唯一参数。如果该命令执行成功，它必须在输入文件相同的目录下生成一个同名的可执行文件（去掉扩展名）。换句话说，如果你运行\
  \ `./YOUR_COMPILER /path/to/program.c`，它应该在 `/path/to/program` 生成可执行文件并以退出代码 0 退出。如果你的编译器失败，编译器驱动程序应该返回非零退出代码，并且不写入任何汇编或可执行文件；这就是\
  \ *test_compiler* 验证你的编译器是否捕获无效程序错误的方法。最后，你的编译器驱动程序应该支持以下选项，*test_compiler* 使用这些选项来测试中间阶段：\n\
  \n| `--lex` | 指导运行词法器，但在解析之前停止 |\n| `--parse` | 指导运行词法器和解析器，但在生成汇编代码之前停止 |\n| `--codegen`\
  \ | 指导执行词法分析、解析和汇编生成，但在代码发射之前停止 |\n\n这些选项都不应产生任何输出文件，并且在没有遇到任何错误的情况下，它们都应该以退出代码\
  \ 0 退出。你可能还想添加 `-S` 选项，引导你的编译器输出汇编文件，但不进行汇编或链接。你将在第三部分中运行测试需要此选项；它对于第一部分中的所有令牌：\n\
  \n| `int` | 关键字 |\n| `main` | 标识符，其值为“main” |\n| `(` | 左括号 |\n| `void` | 关键字 |\n\
  | `)` | 右括号 |\n| `{` | 左大括号 |\n| `return` | 关键字 |\n| `2` | 常量，其值为“2” |\n| `;` |\
  \ 分号 |\n| `}` | 右大括号 |\n\n在这里使用了两个词法器特定的术语。*标识符*是一个 ASCII 字母或下划线，后面跟随着字母、下划线和数字的混合体。标识符区分大小写。整数*常量*由一个或多个数字组成。注意，列表中的标识符和常量有值，但其他类型的令牌没有。有许多标识符（例如\
  \ `foo`、`variable1` 和 `my_cool_function`），因此词法器产生的每个标识符令牌必须保留其特定名称。同样，每个常量都需要持有一个整数值。相比之下，只有一个可能的\
  \ `return` 关键字，因此 `return` 关键字令牌不需要存储任何额外信息。尽管目前 `main` 是唯一的标识符，但你以后应该构建词法器以支持任意标识符。还要注意，没有空白令牌。如果我们编译的是像\
  \ Python 这样空白具有意义的语言，我们需要包含空白令牌。\n\n你可以用正则表达式（或正则）来识别每种令牌类型。表 1-1 给出了每个令牌在 Perl\
  \ 兼容正则表达式（PCRE）语法下对应的正则表达式。\n\n**表 1-1：令牌及其正则表达式**\n\n| 令牌 (Token) | 正则表达式 |\n|\
  \ --- | --- |\n| Identifier (标识符) | `[a-zA-Z_]\\w*\\b` |\n| Constant (常量) | `[0-9]+\\\
  b` |\n\n\n\n\n\n| keyword | token |\n| :--- | :--- |\n| `int` | `int\\b` |\n| `void`\
  \ | `void\\b` |\n| `return` | `return\\b` |\n| 左括号 | `\\(` |\n| 右括号 | `\\)` |\n\
  | 左大括号 | `{` |\n| 右大括号 | `}` |\n| 分号 | `;` |\n\n程序的分词过程大致如列表 1-3 所示。\n\n```python\n\
  while input isn't empty:\n    if input starts with whitespace:\n        trim whitespace\
  \ from start of input\n    else:\n        find longest match at start of input for\
  \ any regex in Table 1-1\n        if no match is found, raise an error\n       \
  \ convert matching substring into a token\n        remove matching substring from\
  \ start of input\n```\n\n*列表 1-3: 将字符串转换为序列*\n\n注意，标识符、关键字和常量必须在单词边界处结束，由 `\\b`\
  \ 标识。例如，`123;bar` 的前三个数字匹配常量的正则表达式，你应该将它们转换为常量 `123`。这是因为 `;` 不在 `\\w` 字符类中，所以 `3`\
  \ 和 `;` 之间的边界是一个单词边界。然而，`123bar` 的前三个数字并不匹配常量的正则表达式，因为这些数字后面跟着更多 `\\w` 类类字符，而不是单词边界。如果你的分词器看到像\
  \ `123bar` 这样的字符串，它应该报错，因为字符串的开头不匹配任何标记的正则表达式。\n\n现在你已经准备好编写分词器了。这里有几个需要记住的提示：\n\
  \n**将关键字视为其他标识符。**\n\n标识符的正则表达式也会匹配关键字。不要试图同时寻找下一个标记的结束并判断它是否为关键字。首先，找到标记的结束。然后，如果它看起来像一个标识符，再检查它是否匹配任何关键字。\n\
  \n**不要按空格拆分。**\n\n一开始按空格拆分字符串并不是好主意，因为空格不是标记之间唯一的边界。例如，`main(void)` 包含四个标记且没有空格。\n\
  \n**你只需要支持 ASCII 字符。**\n\n本书的测试程序仅包含 ASCII 字符。C 标准提供了一种名为*通用字符名称*的机制来在标识符中包含非 ASCII\
  \ 字符，但我们不会实现它们。许多 C 实现允许你直接使用 Unicode 字符，但你也不需要支持。\n\n一旦写好了分词器，下一步就是测试它。\n\n###\
  \ 解析器\n\n现在你已经有了一个标记列表，你将弄清楚它们是如何分组成结构的。在包括 C 在内的大多数语言中，这种分组是自然的。分词器创建 AST 后，解析器将遍历它以确定要输出什么。解析有两种方法：你可以手动编写，也可以使用像\
  \ `Bison` 或 `ANTLR` 这样的生成器。无论选择哪种，都需要设计语法树。\n\n#### 示例\n\n让我们先来看一个例子。考虑列表 1-4 中的\
  \ `if` 语句。\n\n```c\nif (a < b) {\n    return 2 + 2;\n}\n```\n\n*列表 1-4: 一个简单的 if\
  \ 语句*\n\n对应 AST 的根节点代表整个 `if` 语句。该节点有两个子节点：\n\n1. 条件，`a < b`\n2. 语句体，`return 2 +\
  \ 2;`\n\n这些构造中的每一个都可以进一步拆分。例如，条件是一个带有三个节点的二元操作：\n\n1. 左操作数，变量 `a`\n2. 运算符，`<`\n\
  3. 右操作数，变量 `b`\n\n图 1-1 显示了此代码段的完整 AST，其中 `If` AST 节点代表 `if` 语句的根节点，`Binary` 节点代表条件，类等。\n\
  \n\n\n\n\n![](img/fig1-1.jpg)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >图 1-1: 一个简单 if 语句的 AST</samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >描述</samp>\n\n图 1-1 中的 AST 包含与列表 1-4 相同的信息：它展示了程序将采取的动作以及执行顺序。但与列表 1-4 不同，该 AST\
  \ 以你的编译器易于处理的方式呈现了这些信息。在后续阶段，编译器将遍历这棵树，并在遇到每种类型的节点时执行不同的不同的操作。你的编译器将使用这种通用策略来完成一系列不同的任务，从解析变量名到生成汇编代码。\n\
  \n现在让我们来看列表 1-1 中 C 程序的 AST。图 1-2 展示了这个更简单的 AST。\n\n![](img/fig1-2.jpg)\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 1-2: </samp> <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 1-1</samp> 的 AST <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"></samp> <samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">描述</samp>\n\n接下来，你将在代码中定义必要的数据结构来构建如图\
  \ 1-2*。我在这里使用 ASDL 是为了这种方便且与编程语言无关的表示法。你不会在编译器中直接使用 ASDL；相反，你将在所选的实现语言中定义等的数据结构。接下来的几段包含了对\
  \ ASDL 的简要概述。你可以在第 21 页的“额外资源”中找到描述整个语言的原始论文链接。\n\n列表 1-5 包含了你在本章实现的 C 语言极子集的 ASDL\
  \ 定义（类似于列表 1-1 那样的程序）。\n\n```\nprogram = Program(function_definition)\nfunction_definition\
  \ = Function(identifier name, statement body)\nstatement = Return(exp)\nexp = Constant(int)\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 1-5: 本章的抽象语法树定义</samp>\n\
  \n列表 1-5 中的每一行描述了如何构建一种类型的 AST 节点。请注意，图 1-2 中的每个 AST 节点在 ASDL 中都有对应的定义。该 AST 的根节点是`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">program</samp>` 节点。目前，该节点恰好有一个子节点，类型为`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">function_definition</samp>`。函数定义有两个子节点：一个类型为`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">identifier</samp>`的函数名，和一个类型为`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">statement</samp>`的函数体。目前，一个函数由单个语句组成且没有参数。以后你将添加对函数参数和更复杂函数体的支持。注意，定义中的`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">name</samp>` 和`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\"\
  >body</samp>` 是`字段名`（field names），是人类友好的标签，不会改变 AST 的结构。字段名在 ASDL 中可选的。当字段名存在时，它紧跟在字段类型之后，就像`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">identifier name</samp>`中一样。\n\n在 ASDL\
  \ 中，`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">identifier</samp>`是一个表示函数名和变量名的内置类型；它们本质上是字符串，但我们想将它们与`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">\"Hello, World!\"</samp>`这样的字符串字面量区分开，因为它们出现在\
  \ AST 的不同部分。由于`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">identifier</samp>`是内置类型，它没有子节点。`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">function_definition</samp>`的另一个子节点是`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">statement</samp>`。目前，唯一的语句类型`<samp class=\"\
  SANS_TheSansMonoCd_W5Regular_11\">return</samp>`语句。该语句有一个子节点：类型为`<samp class=\"\
  SANS_TheSansMonoCd_W5Regular_11\">exp</samp>`。目前，唯一的`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\"\
  >exp</samp>`是一个常量；`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">int</samp>`是另一个内置的\
  \ ASDL 类型，因此 AST 就完成了了。\n\n当然，`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">return</samp>`语句并不是\
  \ C 语言唯一的语句，常量也不是唯一的表达式。在后面的章节中，我们将添加新的构造器来表示其他类型的语句。例如，我们将向`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\"\
  >statement</samp>`添加一个`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">If</samp>`构造器来表示\
  \ `if` 语句：\n\n```\nstatement = Return(exp) | If(exp, statement, statement?)\n```\n\
  \n`<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">statement?</samp>`类型表示可选的语句，因为\
  \ `if` 语句并不总是有 `else` 子句。`<samp class=\"SANS_TheSansMonoCd_W5Regular_11|</samp>`符号分隔了构造器。在这里，它告诉我们`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">statement</samp>`可以是一个`return` 语句（由`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">Return</samp>`构造器定义），也可以是一个`if`语句（由`<samp\
  \ class=\"SANS_TheSansMonoCd_W5Regular_11\">If</samp>`构造器定义）。\n\n\n\n\n\nAST 包含了编译器后续阶段所需的所有信息。然而，它并没有告诉你究竟是哪些标记（tokens）构成了每个语言构造结构。例如，在列表\
  \ 1-5 的 AST 描述中，没有任何地方说明 `return` 语句必须以分号结尾，或者函数体需要被包含在大括号内。（这也就是为什么它被称为*抽象*语法树——相比之下，*具体*语法树包含了来自原始输入的每一个标记。））一旦你拥有了\
  \ AST，这些具体的细节就不再重要了，因此省略它们是很方便的。但是，当你通过解析一系列标记序列来构建你的 AST 时，这些细节就非常重要，因为它们指示了每个语言构造结构的开始和结束位置。\n\
  \n因此，除了 AST 描述外，你还需要一组规则来定义如何从标记列表中构建语言构造结构。这组规则被称为*形式化文法*（formal grammar），它与 AST\
  \ 描述紧密对应。列表 1-6 定义了像列表 1-1 这样的 C 程序的形式化文法。\n\n```\n<program> ::= <function>\n<function>\
  \ ::= \"int\" <identifier> \"(\" \"void\" \")\" \"{\" <statement> \"}\"\n<statement>\
  \ ::= \"return\" <exp> \";\"\n<exp> ::= <int>\n<identifier> ::= ? An identifier\
  \ token ?\n<int> ::= ? A constant token ?\n```\n\n列表 1-6：本章的形式化文法（使用 `SANS_Futura_Std_Book_Oblique_I_11`\
  \ 字体）\n\n列表 1-6 中的文法采用*扩展巴科斯-纳尔范式 (EBNF)* 记法。该文法的每一行都是一条*产生式规则*（production rule），定义了如何从其他语言构造结构和标记的序列形成语言构造。出现在产生式规则左侧的所有符号（例如\
  \ `<function>`）都是*非终结符号*（non-terminal symbol）。单个标记（如关键字、标识符和标点符号）是*终结符号*（terminal\
  \ symbols）。所有非终结符号都包裹在角括号中，而特定的标记（如 `;`）则包裹在引号中。`<identifier>` 和 `<int>` 符号分别代表标识符标记和常量标记。由于这些标记不像其他终结符号那样是固定字符串，我们使用*特殊序列*来描述它们中的每一个：包裹在问号中的对该符号的纯英文描述。\n\
  \n列表 1-6 看起来与列表 1-5 中的 AST 定义非常相似。事实上，它们具有相同的结构；列表 1-5 中的每一个 AST 节点都对应于列表 1-6 中的一个非终结符号。唯一的区别在于，列表\
  \ 1-6 明确规定了我们在树的每个节点上会找到哪些标记，这有助于我们确定何时需要开始在 AST 的下一层处理新节点，以及何时我们已经处理完一个节点并可以返回其上一层的父节点。\n\
  \n正如后面的章节将为某些 AST 节点引入多个构造函数一样，它们也会为相应的符号引入多个产生式规则。例如，这里是如何为 `<statement>` 添加一条产生式规则以支持\
  \ `if` 语句：\n\n```\n<statement> ::= \"return\" <exp> \";\" | \"if\" \"(\" <exp> \"\
  )\" <statement> [\"else\" <statement>]\n```\n\n注意，EBNF 中的方括号表示某些内容是可选的，就像 ASDL 中的问号一样。\n\
  \n你在编写解析器时会引用这种形式化文法，但你不会在编译器的任何地方显式地定义这些文法规则。\n\n### 递归下降解析\n\n现在你有了 AST 定义和形式化文法，让我们来讨论如何实际编写解析器。我们将使用一种名为*递归下降*（recursive\
  \ descent）的简单技术，它通过不同的函数来解析非终结符号并返回相应的 AST 节点。例如，当解析器期望遇到列表 1-6 中定义的 `<statement>`\
  \ 符号时，它会调用函数来解析该符号。之所以被称为递归下降是因为文法通常是递归的，在这种情况下函数也是递归的。让我们来看这些函数中的之一。列表 1-7 中的伪代码演示了如何解析\
  \ `<statement>`。\n\n```\nparse_statement(tokens):\n    expect(\"return\", tokens)\n\
  \    return_val = parse_exp(tokens)\n    expect(\";\", tokens)\n    return Return(return_val)\n\
  \nexpect(expected, tokens):\n    actual = take_token(tokens)\n    if actual != expected:\n\
  \        fail(\"Syntax error\")\n```\n\n列表 1-7：解析语句（使用 `SANS_Futura_Std_Bold_Condensed_Oblique_BI_11`\
  \ 字体）\n\n注意 `parse_statement` 会从 `tokens` 列表中移除该语句的所有标记。在 `parse_statement` 返回后，其调用者将继续处理\
  \ `tokens` 中剩余的标记。如果在解析完整个程序后还有任何标记，那就是语法错误。\n\n\n\n\n\n现在，形式化语法中的每个符号都只有一个产生规则。在随后的章节中，当某些符号具有多个产生规则时，解析器需要确定应该使用哪条产生规则。它将通过查看列表中的前几个\
  \ token 而不移除它们来实现。这种通过向前查看几个 token 来确定使用哪条产生规则的递归下降解析器被称为`预测解析器`（predictive parsers）。预测解析的替代方案是`带回溯的递归下降`（recursive\
  \ descent with backtracking），它涉及按顺序尝试每条产生规则，直到找到有效的一条为止。\n\n现在你可以编写自己的递归下降解析器了。记住，你需要为列表\
  \ 1-6 中的每个非终结符号编写一个函数。这里是一些让过程变得更容易的小技巧：\n\n#### 编写一个打印器（pretty-printer）。\n\n打印器是一个以人类可读的方式打印你的\
  \ AST（抽象语法树）的函数。这将使调试你的解析器变得简单得多。列表 1-1 中程序的格式化 AST 看起来可能如下所示：\n\n```\nProgram(\n\
  \    Function(\n        name=\"main\",\n        body=Return(\n          Constant(2)\n\
  \        )\n    )\n)\n```\n\n#### 提供信息丰富的错误信息。\n\n这也有助于你调试解析器，并会让你的编译器更加用户友好。一个像\
  \ `Expected \";\" but found \"return\"` 这样的错误信息比 `Fail` 要有帮助得多。\n\n#### 汇编生成\n\n\
  汇编生成阶段应该将 AST 转换为 x64 汇编，大致按照程序执行的顺序遍历 AST，从而为每个节点生成相应的汇编指令。首先，定义一个合适的数据结构来表示汇编程序，就像你在编写解析器时定义一个表示\
  \ AST 的结构一样。你正在添加另一个数据结构，而不是直接将汇编写入文件，这样你就可以在生成之后修改汇编代码。在本章中不需要重写任何汇编，但在后面的章节中你需要。\n\
  \n我将再次使用 ASDL 来描述我们将用于表示汇编的结构。列表 1-8 是该定义。\n\n```\nprogram = Program(function_definition)\n\
  function_definition = Function(identifier name, instruction* instructions)\ninstruction\
  \ = Mov(operand src, operand dst) | Ret\noperand = Imm(int) | Register\n```\n\n\
  `列表 1-8: 汇编程序的 ASDL 定义`\n\n这看起来与上一节的 AST 定义非常相似！事实上，这*确实*是一个 AST 定义，但是是针对汇编程序的，而不是\
  \ C 程序的。每个节点都对应汇编中的一种构造（例如单条指令），而不是 C 语言中的构造（例如语句）。我将列表 1-8 中定义的数据结构称为`assembly\
  \ AST`，以区别于列表 1-5 中定义的 AST。\n\n让我们来看一下列表 1-8。`program` 类型代表整个汇编程序，它由单一的 `function_definition`\
  \ 组成。`function_definition` 有两个字段：函数名和指令列表。`instruction*` 中的 `*` 表示该字段是一个列表。`instruction`\
  \ 类型有两个构造函数，分别表示出现在我们汇编程序中的两种指令：`mov` 和 `ret`。`mov` 指令有两个操作数：它将第一个操作数（源）复制到第二个操作数（目的）。`ret`\
  \ 指令没有任何操作数。`operand` 类型定义了指令的两种可能操作数：寄存器和`立即数`（immediate value）或常量。目前，你不需要指定要操作哪个寄存器，因为你生成的代码将只使用\
  \ EAX。你将在后面的章节中引用其他寄存器。这一阶段的结构与解析器相似：你需要一个函数来处理每个类型的 AST 节点，并调用其他函数来处理该节点的子节点。表\
  \ 1-2 描述了你应该为每个 AST 节点生成的汇编。\n\n`表 1-2: 将节点转换为汇编`\n\n| AST 节点 | 汇编构造 |\n| :--- |\
  \ :--- |\n| `Program(function_definition)` | `Program(function_definition)` |\n\
  | `Function(name, body)` | `Function(name, instructions)` |\n| `Return(exp)` | `Mov(exp,\
  \ Register) Ret` |\n| `Constant(int)` | `Imm(int)` |\n\n这种翻译非常直观，但有几点需要注意。首先，单条语句会产生多条汇编指令。其次，这种翻译只有当表达式可以表示为单个汇编操作数时才有效。目前这是真的，因为唯一的表达式是常量整数，但一旦我们在下一章添加单元运算符，情况就不如此了。届那时，你的编译器需要生成多条指令来计算表达式，然后确定该表达式存储的位置，以便将其复制到\
  \ EAX 中。\n\n#### 代码发射（Code Emission）\n\n现在你的编译器可以生成汇编指令了，最后一步是将这些指令写入文件。该文件看起来与列表\
  \ 1-2 中的汇编程序非常相似，但某些细节随平台而异。首先，如果你在 macOS 上，你应该始终在函数名前加一个下划线。例如，将 `main` 函数的标签发射为\
  \ `_main`。（在 Linux 上不要添加此下划线。）\n\n其次，如果你在 Linux 上，你需要在文件末尾添加这一行：\n\n```\n .section\
  \ .note.GNU-stack,\"\",@progbits\n```\n\n\n\n\n这一行启用了一项重要的安全加固措施：它表明你的代码不需要 `executable\
  \ stack`（可执行栈）。如果处理器允许执行存储在该处的机器指令，则该内存区域是 `executable`（可执行的）。`stack`（你将在下一章学习更多内容）是一个存储局部变量和临时值的内存区域。在正常情况下，它不存储机器指令。将\
  \ `stack` 设为不可执行是针对某些安全漏洞的基础防御措施，但这种防御无法为每个程序启用，因为少数使用某些非标准语言扩展的程序实际上需要可执行栈。在汇编文件中包含此行表示该文件*不*需要可执行栈，从而允许启用此安全措施。我们在本书中生成的任何代码都不需要可执行栈，因此我们始终会输出这一行。（有关可执行栈的更多信息，请参阅第\
  \ 21 页 上的“附加资源”。）\n\n代码发射阶段应该遍历汇编 AST 并打印它遇到的每个构造体，这就像汇编生成阶段从代码列表 1-5 遍历 AST 一样。因为汇编\
  \ AST 与最终汇编程序对应非常密切，所以代码发射阶段将非常简单，即使你在后面的章节中为编译器添加了更多功能。\n\n表 1-3、1-4 和 1-5 展示了如何打印每个汇编构造体。\n\
  \n#### 表 1-3：顶层汇编构造体的格式化\n\n| 汇编顶层构造体 | 输出 |\n| --- | --- |\n| `Program(function_definition)`\
  \ | 打印函数定义。在 Linux 上在文件末尾添加： |\n\n```\n .section .note.GNU-stack,\",\"@progbits\n\
  ``` |\n| `Function(name, instructions)` | |```\n .globl <name>\n<name>:\n    <instructions>\n\
  ``` |\n\n#### 表 1-4：汇编指令的格式化\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `Mov(src, dst)`\
  \ | `movl <src>, <dst>` |\n| `Ret` | `ret` |\n\n#### 表 1-5：汇编操作数的格式化\n\n| 汇编操作数\
  \ | 输出 |\n| --- | --- |\n| `Register` | `%eax` |\n| `Imm(int)` | `$<int>` |\n\n\
  确保指令之间包含换行符。你还应该输出可读的、格式良好的汇编代码，因为在调试编译器时你会花费大量时间阅读这些汇编。你可以通过对标签以外的每行进行缩进（如[代码列表\
  \ 1-2](#chapter1.xhtml_list1-2）所示），让你的汇编更具读性。也考虑在汇编程序中包含注释。汇编中使用 `#` 符号。\n\n一旦实现了代码发射，你就能生成可以运行的程序。\n\
  \n### 总结\n\n在本章中，你学习了如何遍历 AST 并发射汇编代码。你还学习了如何格式化不同的汇编构造体、指令和操作数。完成这些后，你就拥有了一个可以生成可执行程序的编译器。在下一章中，你将学习如何生成机器码。\n\
  \n\n\n\n\n# Description\n\n## 2 个一元运算符\n\nC 语言有几种一元运算符，它们对单个值进行操作。在这一章中，你将扩展你的编译器来处理两个一元运算符：否定和位取反。你将把复杂的、嵌套的一元表达式转换为可以用汇编语言表示的简单操作。你不会在单次编译扫描中执行此转换，而是在解析器产生的\
  \ AST 和汇编生成阶段产生的汇编 AST 之间引入一种中间表示。你还将将汇编生成拆分为几个更小的阶段。新阶段在本章开始的图图中已**加粗**显示。\n\n\
  首先，让我们来看一个使用新一元运算符的 C 程序以及我们将生成的相应汇编。\n\n### 汇编中的否定和位取反\n\n在本章中，你将学习编译像列表 2-1 这样的程序。\n\
  \n```\nint main(void) {\n    return ~(-2);\n}\n```\n\n列表 2-1：一个包含否定和位取反的 C 程序\n\n\
  该程序包含一个使用了两个新一元运算符的嵌套表达式。第一个运算符否定（`-`）对整数进行取反——这并不意外。位取反（`~`）运算符翻转整数中的每一位，其效果是将整数取反然后减\
  \ 1。（具有这种效果是因为计算机使用一种名为补码的系统来表示符号整数。如果你不熟悉补码，请参阅第 45 页的“附加资源”，查看有关其工作原理的解释链接。）\n\
  \n你的编译器将把列表 2-1 转换为列表 2-2 中的汇编代码。\n\n```\n .globl main\nmain:\n    pushq   %rbp\n\
  \    movq     %rsp, %rbp\n    subq     $8, %rsp\n  ❶ movl     $2, ❷ -4(%rbp)\n \
  \ ❸ negl     -4(%rbp)\n  ❹ movl     -4(%rbp), %r10d\n  ❺ movl     %r10d, -8(%rbp)\n\
  \  ❻ notl     -8(%rbp)\n  ❼ movl     -8(%rbp), %ax\n    movq     %rbp, %rsp\n  \
  \  popq     %rbp\n    ret\n```\n\n列表 2-2：列表 2-1 的汇编代码\n\n`main` 之后的前三条指令形成函数序言（function\
  \ prologue），它设置了当前的栈帧；我将在下一节讨论栈时介绍它们。在函数序言之后，我们计算出中间结果 -2，然后是最终结果 1，并将它们每一个存储在唯一的内存地址上。这并不高效，因为我们浪费了大量的指令将值从一个地址复制到另一个地址。我们将在第三部分实现的优化将清理大部分这些复制操作。\n\
  \n第一条 `mov` 指令 ❶ 将 `2` 存储在内存中的一个地址。操作数 `-4(%rbp)` ❷ 意味着“RBP 寄存器存储的值减 4”。RBP 中的值是栈上的一个内存地址（更多信息见后），因此\
  \ `-4(%rbp)` 指低 4 字节的另一个内存地址。接下来，我们用 `neg` 指令 ❸ 对该地址的值取否定，因此 `-4(%rbp)` 包含值 `-2`。（与\
  \ `mov` 一样，`neg` 有一个 `l` 后缀，表示它正在对 32 位的值进行操作。）\n\n然后我们处理外层的位取反表达式。我们首先将存储在 `-4(%rbp)`\
  \ 的源值复制到目标地址 `-8(%rbp)`。我们无法通过单条指令完成，因为 `mov` 不能将内存地址同时作为源操作数目标操作数。`mov` 的至少一个操作数需要寄存器或立即数。我们通过将\
  \ `-2` 从内存复制到临时寄存器 `R10D` ❹，然后从那里复制到目标内存地址 ❺ 来绕过这个问题。然后，我们用 `not` 指令 ❻ 对 `-2` 取位取反，因此内存地址\
  \ `-8(%rbp)` 现在包含了我们要返回的值：`~(-2)`，它的结果为 1。为了返回这个值，我们将其移动到 EAX ❼。最后三条指令是函数尾声（function\
  \ epilogue），它销毁栈帧并从函数返回。\n\n> 注意：如果你使用 GCC、Clang 或任何其他生产 C 编译器将列表 2-1 编译为汇编，它看起来完全不像列表\
  \ 2-2。这是因为这些编译器会在编译时求值常量表达式，即使你禁用了优化！我猜它们之所以这样做是因为某些常量表达式（如静态变量初始化器）必须在编译时求值，而在编译时求值所有常量表达式比只求值一部分要简单。\n\
  \n### 栈\n\n关于列表 2-2 还有两个未解决的问题：函数序言和尾声的作用是什么，以及为什么我们相对于 RBP 寄存器中的值来引用栈地址。为了回答这些问题，我们需要讨论被称为栈的程序内存段。RSP\
  \ 寄存器（也称为栈指针）始终持有栈栈顶的地址。（RSP 指向最后一个使用的栈槽，而不是第一个空槽。）与任何栈数据结构一样，你可以将值推入栈中并从栈中弹出；`push`\
  \ 和 `pop` 汇编指令正是这样做的。\n\n\n\n\n\n像 `push $3` 这样的指令会执行两件事：\n\n1. 将被推入的值（在本例中为 `3`）写入栈的下一个空位置。`push`\
  \ 和 `pop` 指令以 8 字节为增量调整栈指针，而栈顶当前的值位于存储在 `RSP` 中的地址处，因此下一个空位置是 `RSP – 8`。\n2. 将 `RSP`\
  \ 减 8 字节。`RSP` 中的新地址现在是栈顶，该地址的值为 `3`。\n\n图 2-1 展示了 `push` 指令对栈和 `RSP` 寄存器的影响。\n\n\
  ![](img/fig2-1.jpg)\n\n`图 2-1: push $3 对内存和 RSP 的影响` `描述`\n\n`pop` 指令执行相反的操作。例如，`pop\
  \ %rax` 将栈顶的值复制到 `RAX` 寄存器中，然后给 `RSP` 增加 8 字节。\n\n由于 `push` 指令将栈指针减少 8 字节，因此必须推入一个\
  \ 8 字节的值。同样，`pop` 指令总是从栈中弹出一个 8 字节的值。`int` 类型的值——例如列表 2-1 中的返回值——只有 4 字节。你不能只向栈推入\
  \ 4 字节，但你可以使用 `movl` 将 4 字节的值复制到你已经分配的栈空间中。几条指令在列表 2-2 中实现了此操作，包括 `movl $2, -4(%rbp)`。（在\
  \ 32 位系统上，情况反之；你可以推入弹出 4 字节的值，但不能推入 8 字节的值。在两种系统中，虽然非常罕见，但也可以使用 `pushw` 和 `popw`\
  \ 指令推入弹出 2 字节的值；`w` 后缀表示 *word*（字），指示该指令取一个 2 字节的操作数。我们在这书中不会使用 `pushw`、`popw` 或任何其他\
  \ 2 字节指令。）x64 系统上的内存地址是 8 字节，因此你可以使用 `push` 和 `pop` 将它们放入和从栈中取出。这稍后会很有用。\n\n栈不仅仅是一块无差的内存；它被分为称为*栈帧*（stack\
  \ frames）的区域。每当函数被调用时，它都会通过减少栈指针在栈顶分配一些内存。这段内存就是函数的栈帧，它在此存储局部变量和临时值。在函数返回之前，它会释放其栈帧，将栈指针恢复到之前的值。按照约定，`RBP`\
  \ 寄存器指向当前栈帧的基地址；由于这个原因，它有时被称为*基指针*（base pointer）。我们相对于存储在 `RBP` 中的地址来引用当前栈帧中的数据。这意味着我们不需要无法预先获知的绝对地址。由于栈向较低的内存地址增长，因此当前栈帧中的每个地址都比存储在\
  \ `RBP` 中的地址低；这就是为什么局部变量的地址（如 `-4(%rbp)`）相对于 `RBP` 都具有负偏移量。在随后的章节中，我们也会相对于 `RBP`\
  \ 引用调用者栈帧中的数据（例如函数参数）。（也可以相对于 `RSP` 进行引用，而不必使用 `RBP`。）\n\n现在你已经理解了栈是如何运作的，让我们详细查看函数的序言（prologue）和尾声（epilogue）。函数序言设置栈：\n\
  \n1. `pushq %rbp` 将 `RBP` 的当前值（栈帧基基）保存到栈中。\n2. `movq %rsp, %rbp` 将栈顶变为新的栈帧。此时，`RSP`\
  \ 和 `RBP` 都指向同一个地址。\n3. `subq $n, %rsp` 将栈减少 *n* 字节。现在栈有 *n* 字节可用的空间来存储局部变量。\n\n\
  图 2-2 显示了函数序言中的每条指令如何影响栈。在图中，`subq` 指令分配了 24 字节，足够存储六个 4 字节整数。\n\n![](img/fig2-2.jpg)\n\
  \n`图 2-2: 函数序言中每个点的栈状态`\n\n尾声通过将 `RSP` 和 `RBP` 设置回执行序言之前的值来恢复调用者的栈帧。这需要两条条指令：\n\n\
  1. `movq %rbp, %rsp` 将我们回到序言第二条指令执行之后的位置。\n2. `popq %rbp` 逆转函数序言的第一条指令，并恢复调用者对应的\
  \ `RSP` 和 `RBP` 的值。它恢复 `RBP` 是因为栈顶的值我们在序言开始时保存的调用者栈帧基地址。它通过从栈中移除该栈帧的最后一个值来恢复 `RSP`，使\
  \ `RSP` 指向调用者栈帧的顶部。\n\n图 2-3 显示了函数尾声中每条指令的影响。\n\n![](img/fig2-3.jpg)\n\n`图 2-3:\
  \ 函数尾声中每个点的栈状态`\n\n既然你知道了编译器应该产生什么输出，让我们继续编码。我们将从扩展词法分析和解析器开始。\n\n### 词法分析\n\n在本章中，你将扩展词法分析以识别三个新标记：\n\
  \n- `~`：波浪号，按位取反操作符\n- `-`：连字符，否定操作符\n- `--`：双连字符，递减操作符\n\n\n\n\n虽然在本章中你不会实现递减运算符，但你仍然需要为其添加一个\
  \ token。否则，你的编译器将接受本应该拒绝的程序，例如 Listing 2-3 中的程序。\n\n```\nint main(void) {\n    return\
  \ --2;\n}\n```\n\nListing 2-3：使用递减运算符的无效 C 程序\n\n这不应该是可以通过编译的，因为你不能对常量进行递减。但如果你的编译器不知道\
  \ `--` 是一个独立的 token，它会认为 Listing 2-3 等同于 Listing 2-4，而后者是一个完全有效的程序。\n\n```\nint\
  \ main(void) {\n    return -(-2);\n}\n```\n\nListing 2-4：带有两个连续取反运算符的有效 C 程序\n\n\
  你的编译器应该拒绝你尚未实现的语言特性；而不应该错误地通过了它们。这就是为什么你的词法分析器需要知道 `--` 是一个 token，而不仅仅是两个连续取反运算符。（另一方面，词法分析器应该将\
  \ `~~` 识别为两个连续的位取反运算符。像 `~~2` 这样的表达式是有效的。）\n\n你可以像处理第 1 章中 `;` 和 `(` 等标点符号一样处理这些新\
  \ token。首先，你需要为每个新 token 定义正则表达式。这里的正则表达式是字符串 `~`、`-` 和 `--`。接下来，让你的词法分析器在每次尝试产生\
  \ token 时，都将输入与这些新正则以及上一章的正则表达式进行比对。当输入流的开头匹配到多个可能的 token 时，选择最长的一个。例如，如果输入流以 `--`\
  \ 开头，则将其解析为递减运算符，而不是两个取反运算符。\n\n### 解析器\n\n为了解析本章中的新运算符，我们首先需要扩展在第 1 章中定义的 AST 和形式化文法。让我们先看\
  \ AST。由于一元操作是表达式，我们用 `exp` AST 节点的一个新构造函数来表示它们。Listing 2-5 显示了更新后的 AST 定义，新部分已加粗。\n\
  \n```\nprogram = Program(function_definition)\nfunction_definition = Function(identifier\
  \ name, statement body)\nstatement = Return(exp)\nexp = Constant(int) | Unary(unary_operator,\
  \ exp)\nunary_operator = Complement | Negate\n```\n\nListing 2-5：带有一元操作的抽象语法树\n\n\
  `exp` 的更新规则表明，表达式可以是一个常量整数，也可以是一个一元操作。一元操作由两个一元运算符 `Complement` 或 `Negate` 之一组成，并作用于一个内部表达式。注意，`exp`\
  \ 的定义是递归的：`exp` 节点的 `Unary` 构造函数包含了另一个 `exp` 节点。这允许我们构建任意深度嵌套的表达式，例如 `-(~(-~-(-4)))`。\n\
  \n我们还需要对文法进行相应的更改，如 Listing 2-6 所示。\n\n```\n<program> ::= <function>\n<function>\
  \ ::= \"int\" <identifier> \"(\" \"void\" \")\" \"{\" <statement> \"}\"\n<statement>\
  \ ::= \"return\" <exp> \";\"\n<exp> ::= <int> | <unop> <exp> | \"(\" <exp> \")\"\
  \n<unop> ::= \"-\" | \"~\"\n<identifier> ::= ? An identifier token ?\n<int> ::=\
  \ ? A constant token ?\n```\n\nListing 2-6：带有一元操作的形式化文法\n\nListing 2-6 包含一个用于一元表达式的新产生式规则和一个表示两个一元运算符的\
  \ `<unop>` 符号。这些更改对应于 Listing 2-5 中 AST 的新增。我们还为 `exp` 符号添加了第三产生式规则，描述带括号的表达式。它在\
  \ AST 中没有对应的构造函数，因为编译器的其他部分不需要区分带括号包裹的表达式和不带括号的相同表达式。表达式 `1`、`(1)` 和 `((1))` 由同一个\
  \ AST 节点表示：`Constant(1)`。\n\n递减运算符 `--` 没有出现在此文法的任何地方，因此如果你的解析器遇到 `--` token，它应该报错。\n\
  \n要更新解析阶段，请修改你的编译器数据结构以匹配 Listing 2-5。然后，更新你的递归下降解析代码以反映 Listing 2-6 中的更改。在本章中，解析表达式变得复杂了一些，因为你需要确定应用\
  \ `<exp>` 符号的三种不同产生式规则中的哪一个。Listing 2-7 中的伪代码演示了如何解析表达式。\n\n```\nparse_exp(tokens):\n\
  \    next_token = peek(tokens)\n  ❶ if next_token is an int:\n        --snip--\n\
  \  ❷ else if next_token is \"~\" or \"-\":\n        operator = parse_unop(tokens)\n\
  \        inner_exp = parse_exp(tokens)\n      ❸ return Unary(operator, inner_exp)\n\
  \  ❹ else if next_token == \"(\":\n        take_token(tokens)\n        inner_exp\
  \ = parse_exp(tokens)\n        expect(\")\", tokens)\n      ❺ return inner_exp\n\
  \  ❻ else:\n        fail(\"Malformed expression\")\n```\n\nListing 2-7：解析表达式\n\n\
  首先，我们查看输入中的下一个 token，以确定应用哪种产生式规则。我们调用 `peek(tokens)` 查看该 token 而不将其从输入流中移除。一旦确定了使用哪种产生式规则，我们希望使用该规则处理整个输入，包括第一个\
  \ token。因此，我们现在不想从输入中消耗这个 token。\n\n\n\n\n如果我们即将解析的表达式是有效的，`next_token` 应该是一个整数、一元运算符或左括号。如果它是一个整数\
  \ ❶，我们按照上一章相同的方式进行解析。如果它是一元运算符 ❷，我们应用代码列表 2-6 中 `<exp>` 的第二个产生式规则来构造一元表达式。该规则是 `<unop>\
  \ <exp>`，因此我们解析一元运算符，然后解析内部表达式。`<unop>` 符号是一个标记 `next_token`，我们已经检查过它。在代码列表 2-7\
  \ 中，我们在单独的函数（`parse_unop`，我省略了定义）中处理 `<unop>`。在实践中，你可能不需要一个单独的函数来解析单个标记。无论如何，我们最终都会得到一个表示相应一元运算符的\
  \ AST 节点。产生式规则中的下一个符号是 `<exp>`，我们通过递归调用 `parse_exp` 来解析。（这就是“递归下降”中的递归部分）。该调用应该返回一个表示一元表达式操作数的\
  \ `<exp>` AST 节点。现在我们同时有了运算符和操作数的 AST 节点，因此我们返回整个一元表达式的 AST 节点 ❸。\n\n如果 `next_token`\
  \ 是左括号 ❹，我们应用 `<exp>` 的第三个产生式规则，即 `\"(\" <exp> \")\"`。我们从输入流中移除左括号，然后递归调用 `parse_exp`\
  \ 来处理后续表达式。接下来，我们调用 `expect` 来移除右括号，如果它缺失则抛出语法错误。由于 AST 不需要指示存在括号，因此我们原样返回内部表达式\
  \ ❺。\n\n最后，如果 `next_token` 既不是整数、一元运算符也不是左括号 ❻，则该表达式是格式错误的，因此我们抛出语法错误。\n\n### TACKY：一种新的中间表示\n\
  \n将 AST 转换为汇编并不像上一章那样简单。C 表达式可以有嵌套的子表达式，而汇编指令不能。像 `-(~2)` 这样的单一表达式需要被拆分为两条汇编指令：一个用于应用内部的取反操作，另一个用于应用外部的否定操作。\n\
  \n我们将使用一种新的中间表示（IR）——三地址代码（TAC）来弥合 C 和汇编之间的差距。在 TAC 中，每条指令的操作数都是常量或变量，而不是嵌套表达式。它之所以被称为三地址代码，是因为大多数指令最多使用三个值：两个源操作数和一个目标地。（本章中的指令仅使用一个或两个值；当我们在第\
  \ 3 章 中实现二运算符时，我们将引入使用三个值的指令。）为了在 TAC 中重写嵌套表达式，我们通常需要引入新的临时变量。例如，代码列表 2-8 显示了 `return\
  \ 1 + 2 * 3;` 的三地址代码。\n\n```\ntmp0 = 2 * 3\ntmp1 = 1 + tmp0\nreturn tmp1\n```\n\n\
  *代码列表 2-8：`return 1 + 2 * 3;` 的三地址代码*\n\n使用三地址代码而不是将 AST 直接转换为汇编有两个主要原因。首先，它允许我们将主要的结构转换（如移除嵌套表达式）与汇编语言细节（例如确定哪些操作数是有效的）分开处理。这意味着我们可以编写更小、更简单的编译器通道。其次，三地址代码非常适合优化。它的结构简单，易于回答诸如“这个的结果是什么？”或“这个变量的值会相同吗？”的问题。我决定将这种中间表示命名为\
  \ TACKY。\n\n#### 定义 TACKY\n\n现在你已经看到了 TACKY 的 ASDL 定义，你需要在你自己的编译器中实现这个定义，就像定义 AST\
  \ 和汇编 AST 一样。\n\n```\nprogram = Program(function_definition)\nfunction_definition\
  \ = Function(identifier, body)\ninstruction = Return(val) | Unary(unary_operator,\
  \ src, dst)\nval = Constant(int) | Var(identifier)\nunary_operator = Complement\
  \ | Negate\n```\n\n*代码列表 2-9：TACKY 中间表示*\n\n在 TACKY 中，函数体由指令列表组成，而不是单个语句。在这方面，它与我们在上一章定义的汇编相似。目前，TACKY\
  \ 有两个指令：`Return` 和 `Unary`。`Return` 返回一个值；`Unary` 对表达式的源值 `src` 执行某些一元操作，并将结果存储在\
  \ `dst`（目标）中。两条指令都作用于 `val`，它可以是常量整数（`Constant`）或临时变量（`Var`）。我们生成的 TACKY 必须满足一个代码列表\
  \ 2-9 中没有显式说明的要求：一元操作的 `dst` 必须是一个临时 `Var`，而不是 `Constant`。尝试给常量赋值是毫无意义的。\n\n一旦你有了\
  \ TACKY 数据结构，就可以准备编写 IR 生成阶段了，该阶段将 AST 转换为 TACKY。\n\n\n\n\n你的 TACKY 生成阶段应该遍历一个如\
  \ Listing 2-5 中定义的格式 AST，并返回一个如 Listing 2-9 中定义的格式 TACKY AST。困难之处在于将一个 `exp` 节点转换为指令列表；一旦你解决了这个问题，处理其他\
  \ AST 节点就很简单了。Table 2-1 列出了了一些 AST 示例及其生成的 TACKY 示例。\n\n**表 2-1：** 一元表达式的 TACKY\
  \ 表示\n\n| AST | TACKY |\n| --- | --- |\n| `Return(Constant(3))` | `Return(Constant(3))`\
  \ |\n| `Return(Unary(Complement, Constant(2)))` | `Unary(Complement, Constant(2),\
  \ Var(\"tmp.0\")) Return(Var(\"tmp.0\"))` |\n| | |\n```\nReturn(Unary(Negate,\n\t\
  \     Unary(Complement,\n\t\t  Unary(Negate, Constant(8)))))\n```\n| | `Unary(Negate,\
  \ Constant(8), Var(\"tmp.0\")) Unary(Complement, Var(\"tmp.0\"), Var(\"tmp.1\"))\
  \ Unary(Negate, Var(\"tmp.1\"), Var(\"tmp.2\")) Return(Var(\"tmp.2\"))` |\n\n在这些示例中，我们将每个一元操作转换为一个\
  \ `Unary` TACKY 指令，从最内层的表达式开始向外处理。我们将每个 `Unary` 指令的结果存储在一个临时变量中，然后在外部表达式或 `return`\
  \ 语句中使用该变量。Listing 2-10 描述了如何将一个 `exp` AST 节点转换为 TACKY。\n\n```\nemit_tacky(e, instructions):\n\
  \    match e with\n  ❶ | Constant(c) ->\n        return ❷ Constant(c)\n    | Unary(op,\
  \ inner) ->\n        src = emit_tacky(inner, instructions)\n        dst_name = make_temporary()\n\
  \        dst = Var(dst_name)\n        tacky_op = convert_unop(op)\n        instructions.append(Unary(tacky_op,\
  \ src, dst))\n        return dst\n```\nListing 2-10：将表达式转换为 TACKY 指令列表\n\n此伪代码通过将指令追加到\
  \ `instructions` 参数中，生成计算表达式所需的指令。它还返回一个表示表达式结果的 TACKY `val`，我们将在翻译外部表达式或语句时使用它。\n\
  \n在 Listing 2-10 中的 `match` 语句检查我们正在翻译哪种类型的表达式，然后运行处理该表达式的子句。如果表达式是常量，我们返回等效的 TACKY\
  \ `Constant`，而不生成任何新指令。注意，这段代码包含了两个不同的 `Constant` 构造体；我们匹配的是原始 AST 中的节点 ❶，而我们返回的是\
  \ TACKY AST 中的节点 ❷。接下来的子句中出现的两个 `Unary` 构造体也是如此。\n\n如果 `e` 是一个一元表达式，我们为源操作和目标构建\
  \ TACKY 值。首先，我们对源操作调用 `emit_tacky` 以获取相应的 TACKY 值。然后，我们为目标操作创建一个临时变量。`make_temporary`\
  \ 函数为该变量生成一个唯一名称。我们使用另一个辅助函数 `convert_unop` 将一元操作转换为其对应的 TACKY 等效物。一旦获取了源、目标和一元操作，我们就构建\
  \ `Unary` TACKY 指令并将其追加到 `instructions` 列表中。最后，我们返回 `dst` 作为表达式的结果。请记住，`emit_tacky`\
  \ 处理的是表达式而不是 `return` 语句。你需要一个单独的函数（我不提供）来将 `return` 语句转换为 TACKY。该函数应该调用 `emit_tacky`\
  \ 来处理值，然后发射一个 TACKY `Return` 指令。\n\n#### 为临时变量生成名称\n\n显而易见的是，每个临时变量都需要一个独特的名称。在随后的章节中，我们还需要确保这些自动生成的名称不会与用户定义的函数和变量名称冲突，也不会与不同函数的自动生成名称冲突。这些标识符必须是唯一的，因为我们将所有这些（包括自动生成的名称和用户定义的名称）都存储在同一个表中。\n\
  \n一个简单的解决方案是维护一个全局整数计数器；要生成唯一名称，递计数器并使用其新值作为临时变量的名称。该名称不会与其他临时名称冲突，因为计数器每次递增时都会产生新值。它不会与用户定义的标识符冲突，因为整数在\
  \ C 语言中不是有效的标识符。在 Table 2-1 中，我使用了这种方法的变体，通过连接一个描述性字符串、句号和全局计数器的值来生成如 `tmp.0` 类的唯一标识符。这些不会与用户定义的标识符冲突，因为\
  \ C 标识符不能包含点。使用这种命名方案，你可以在自动生成的名称中编码有用信息，例如它们使用的函数名称。（如果像我在这里这样把每个变量命名为 `tmp`，用处就没那么。）\n\
  \n#### 更新编译器驱动程序\n\n为了测试 TACKY 生成器，你需要添加一个新的 `--tacky` 命令行选项，以便让编译器通过 TACKY 生成阶段，并在汇编生成之前停止。与现有的\
  \ `--lex`、`--parse` 和 `--codegen` 一样，这个新选项不应该产生任何输出。\n\n### 汇编生成\n\n\n\n\n\nTACKY\
  \ 更接近汇编，但它仍然没有具体指明我们需要哪些哪些汇编指令。下一步是将程序从 TACKY 转换为我们在上一章中定义的汇编抽象语法树（AST）。我们将通过三个小的编译器阶段来完成工作。首先，我们将生成一个汇编\
  \ AST，但仍然直接引用临时变量。接下来，我们将这些变量替换为栈上的具体地址。这一步会导致一些无效指令，因为许多 x64 汇编指令不能让两个操作数都使用内存地址。因此，在最后一个编译器阶段中，我们将重写汇编\
  \ AST 以修复任何无效指令。\n\n### 将 TACKY 转换为汇编\n\n我们将从扩展上一章中定义的汇编 AST 开始。我们需要一些新的构造结构来表示列表\
  \ 2-2 中的 `neg` 和 `not` 指令。我们还需要决定如何在汇编 AST 中表示函数的序言（prologue）和结尾（epilogue）。\n\n\
  处理序言和结尾有几种不同的方法。我们可以向汇编 AST 中添加 `push`、`pop` 和 `sub` 指令。我们可以添加对应于整个序言和结尾的高级指令，而不是维护汇编\
  \ AST 构造与汇编指令之间的一一对应关系。或者，我们可以完全省略函数序言和结尾，在代码发射期间再添加它们。我将结合第一和最后两种方案。本章的汇编 AST 所示列表\
  \ 2-11，包含一个对应于 `sub` 指令（函数序言中的第三条指令）的构造。该构造指定了我们需要从栈指针中减去多少字节。汇编 AST 不包含序言和结尾的其他指令；这些指令始终是相同的，因此我们可以在代码发射期间添加它们。尽管如此，表示函数序言和结尾的其他方法同样有效，所以选择你最喜欢的方法即可。\n\
  \n我们还将引入伪寄存器（pseudoregisters）来表示临时变量。我们将伪寄存器作为汇编指令的操作数，就像真实的寄存器一样；唯一的区别是我们的供应无限无限。由于它们不是真实的寄存器，不能出现在最终的汇编程序中；它们需要在后续编译器阶段被替换为真实的寄存器或内存地址。现在，我们将每个伪寄存器分配到内存中一个不同的地址。在第三部分中，我们将编写一个“寄存器分配器”，它尽可能将伪寄存器分配给硬件寄存器而不是内存地址。\n\
  \n列表 2-11 显示了更新后的汇编 AST，新部分已加粗。\n\n```\nprogram = Program(function_definition)\n\
  function_definition = Function(identifier name, instruction* instructions)\ninstruction\
  \ = Mov(operand src, operand dst)\n            | Unary(unary_operator, operand)\n\
  \            | AllocateStack(int)\n            | Ret\nunary_operator = Neg | Not\n\
  operand = Imm(int) | Reg(reg) | Pseudo(identifier) | Stack(int)\nreg = AX | R10\n\
  ```\n\n*列表 2-11: 带有一元操作数的汇编 AST*\n\n`instruction` 节点有两个新的构造函数来表示我们的新汇编指令。`Unary`\
  \ 构造表示单个的 `not` 或 `neg` 指令。它接受一个操作数，该操作数同时用作源和目的。`AllocateStack` 构造表示函数序言中的第三条指令\
  \ `subq $n, %rsp`。它的一个子节点是一个整数，表示我们从 RSP 中减去的字节数。\n\n我们还有几个新的指令操作数。`Reg` 构造表示硬件寄存器。它可以指定我们目前见过的任何一个硬件寄存器：`EAX`\
  \ 或 `R10D`。`Pseudo` 操作数允许我们使用任意标识符作为伪寄存器。我们用它来引用临时变量。最终，我们需要将每个伪寄存器替换为栈上的位置。例如，我们将用\
  \ `Stack` 操作数来表示伪寄存器。\n\n每个硬件寄存器都有多个别名，取决于你需要的字节数。`EAX` 指 64 位寄存器的低 32 位，而 `R10D`\
  \ 指 `R10` 的低 32 位。`AL` 和 `R1` 分别指低 8 位。AST 中的寄存器名称与大小无关，因此 `AX` 可以指代 `EAX` 或 `AL`，取决于上下文。\n\
  \n现在我们可以编写一个从 TACKY 到汇编的直接转换，所示在表 2-2 到 表 2-5。如表 2-2 所示，我们将 TACKY `Program` 和 `Function`\
  \ 节点转换为对应的汇编构造。\n\n#### 表 2-2: 顶层 TACKY 构造转换\n\n| TACKY 顶层构造 | 汇编顶层构造 |\n| :---\
  \ | :--- |\n| `Program(function_definition)` | `Program(function_definition)` |\n\
  | `Function(name, instructions)` | `Function(name, instructions)` |\n\n我们将每个 TACKY\
  \ 指令转换为一系列汇编指令，所示在表 2-3。由于我们新的汇编指令对源和目的操作地使用相同的操作数，因此在发射一元 `neg` 或 `not` 指令之前，我们将源值复制到目的地中。\n\
  \n#### 表 2-3: TACKY 指令转换为汇编\n\n| TACKY 指令 | 汇编指令 |\n| :--- | :--- |\n| `Return(val)`\
  \ | `Mov(val, Reg(AX)) Ret` |\n\n\n\n\n\n| `Unary(unary_operator, src, dst)` | `Mov(src,\
  \ dst) Unary(unary_operator, dst)` |\n\n表 2-4 显示了每个 TACKY `unary_operator` 对应的汇编\
  \ `unary_operator`，表 2-5 显示了从 TACKY 操作数到汇编操作数的转换。\n\n**表 2-4:** 将 TACKY 算术运算符转换为汇编\n\
  \n| TACKY 运算符 | 汇编运算符 |\n| --- | --- |\n| `Complement` | `Not` |\n| `Negate` | `Neg`\
  \ |\n\n**表 2-5:** 将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n| --- | --- |\n| `Constant(int)`\
  \ | `Imm(int)` |\n| `Var(identifier)` | `Pseudo(identifier)` |\n\n注意我们还没有使用 `AllocateStack`\
  \ 指令；我们将在代码生成的最后一次遍历中添加它，那时我们已经知道需要分配多少字节。我们还没有使用任何 `Stack` 操作数；我们将在下一次编译传递中将每个\
  \ `Pseudo` 操作数替换为 `Stack` 操作数。而且我们还没有使用 R10D 寄存器；我们将在重写无效指令时引入它。\n\n### 替换伪寄存器\n\
  \n接下来，我们编写一个编译器传递，将每个 `Pseudo` 操作数替换为 `Stack` 操作数，同时保持其他汇编 AST 不变。在列表 2-2 中，我们使用了两个栈位置：`-4(%rbp)`\
  \ 和 `-8(%rbp)`。这次传递遵循相同的模式：我们将看到的第一个临时变量替换为 `Stack(-4)`，下一个替换为 `Stack(-8)`，依此类推。每个新变量减去\
  \ 4，因为每个临时变量都是 4 字节整数。你在此过程中需要维护一个从标识符到偏移量的映射，以便在每次伪寄存器出现时，都能将其替换为栈上的相同地址。例如，如果你处理以下指令：\n\
  \n```\nMov(Imm(2), Pseudo(\"a\"))\nUnary(Neg, Pseudo(\"a\"))\n```\n\n你应该在两条指令中将\
  \ `Pseudo(\"a\")` 替换为相同的 `Stack` 操作数。\n\n这个编译器传递还应该返回最后一个临时变量的栈偏移，因为这告诉我们在下一次传递中需要在栈上分配多少字节。\n\
  \n### 修复指令\n\n现在我们需要再次遍历汇编并进行两处微小的修复。首先，我们将在 `function_definition` 的最开始插入 `AllocateStack`。`AllocateStack`\
  \ 应该是我们分配的最后一个临时变量的栈偏移。这样，我们就在栈上分配了足够的空间。例如，如果我们替换了三个变量，我们将在指令列表中插入 `Stack(12)`。\n\
  \n第二个修复是重写无效的 `Mov` 指令。当我们将伪寄存器替换为栈时，可能会产生源操作和目的地都是内存地址的 `Mov` 指令。但 `mov` 与许多其他指令一样，源操作和目的地不能都是内存地址。汇编器会拒绝它。例如，指令：\n\
  \n```\nmovl -4(%rbp), -8(%rbp)\n```\n\n变为：\n\n```\nmovl -4(%rbp), %r10d\nmovl %r10d,\
  \ -8(%rbp)\n```\n\n我选择 R10D 作为临时寄存器，因为它没有特殊用途。某些寄存器是特定指令所要求的；例如，执行除法的 `idiv` 指令要求被除数存储在\
  \ EAX 中。其他寄存器用于在函数调用期间传递参数。在此阶段使用任何这些寄存器作为临时使用可能会导致冲突。例如，你可能会将函数参数拷贝到正确的寄存器中，但在使用该寄存器在不同地址之间传输另一个值时覆盖了它。\n\
  \n### 代码生成\n\n最后，我们将扩展代码生成阶段以处理我们的新结构，并打印函数序言（prologue）和结尾（epilogue）。表 2-6 到 2-9\
  \ 显示了如何打印每个汇编结构。新结构以及现有生成方式的更改已加粗。\n\n表 2-6 显示了在生成汇编 `Function` 时如何包含序言。\n\n| 汇编顶层结构\
  \ | 输出 |\n| --- | --- |\n| `Program(function_definition)` | 打印函数定义。在 Linux 上，文件末尾添加：`.section\
  \ .note.GNU-stack,\"\",@progbits` |\n| `Function(name, instructions)` | ```assembly\n\
  \ .globl <name>\n<name>: \n    pushq    %rbp\n    movq    {@}%rsp, %rbp \n    <instructions>\n\
  \ ```\n\n\n\n\n\n[Table 2-7] 展示了如何在 `Ret` 指令之前包含函数 `epilogue`，以及如何发射新的 `Unary` 和\
  \ `AllocateStack` 指令。\n\n表 2-7: 汇编指令的格式化\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `Mov(src,\
  \ dst)` | |\n```\nmovl      <src>, <dst>\n``` |\n| `Ret` | |\n```\nmovq    %rbp,\
  \ %rsp\npopq    %rbp  \nret\n``` |\n| `Unary(unary_operator, operand)` | |\n```\n\
  <unary_operator>    <operand>\n``` |\n| `AllocateStack(int)` | |\n```\nsubq    $<int>,\
  \ %rsp\n``` |\n\n如该表所示，你应该将 `AllocateStack` 射为 `subq` 指令。根据其 `unary_operator` 参数，将\
  \ `Unary` 射为 `negl` 或 `notl` 指令。[Table 2-8] 显示了每个 `unary_operator` 对应这些指令中的哪一个。\n\
  \n表 2-8: 汇编操作符指令名称\n\n| 汇编操作符 | 指令名称 |\n| --- | --- |\n| `Neg` | `negl` |\n| `Not`\
  \ | `notl` |\n\n最后，Table 2-9] 显示了如何打印新的 `Reg` 和 `Stack` 操作数。\n\n表 2-9: 汇编操作数的格式化\n\
  \n| 汇编操作数 | 输出 |\n| --- | --- |\n| `Reg(AX)` | `%eax` |\n| `Reg(R10)` | `%r10d`\
  \ |\n| `Stack(int)` | `<int>(%rbp)` |\n| `Imm(int)` | `$<int>` |\n\n由于 `RBP` 和 `RSP`\
  \ 包含 8 字节的内存地址，我们始终使用带有 `q` 后缀的四字节字指令对它们进行操作。[Table 2-7] 中的 `movl` 指令与 prologue\
  \ 和 epilogue 中的 `movq` 指令除大小外外是完全相同的。\n\n### 总结\n在本章中，你扩展了编译器以实现取反和位按位取反。你还实现了一种新的中间表示，编写了两个转换汇编的新编译阶段，并学习了栈帧的结构。接下来，你将实现加法和减法等二进制运算。后端的更改非常简单；难点在于如何让解析器遵守操作符的优先级和结合律。\n\
  \n### 其他资源\n本章涉及了补码，这是所有现代计算机表示有符号整数的方法。补码将贯穿本书，因此花时间理解它是值得的。以下是其工作原理的概述：\n* Thomas\
  \ Finley 写的“Two’s Complement”涵盖了补码表示的方法和原因（`https://www.cs.cornell.edu/~tomf/notes/cps104/twoscomp.html`）。\n\
  * Noam Nisan 和 Shimon Schocken 出的 *The Elements of Computing Systems*（MIT Press,\
  \ 2005）[第 2 章] 从更侧重硬件的视角涵盖了类似的材料。这是 Nand Tetris 项目的配套书籍。本章可以在 `https://www.nand2tetris.org/course`\
  \ 免费获取；点击“Project 2: Boolean Arithmetic”下方的书籍图标。\n\n## 3 二进制操作符\n\n在本章中，你将实现五个新的操作符：加法、减法、乘法、除法和取模运算符。这些都是二进制操作符，接受两个操作数。本章不需要任何新的编译器阶段；你只需要扩展已经编写的每个阶段。在解析阶段，你将看到为什么递归下降解析对于二进制表达式效果不好。相反，你将使用一种不同的技术——优先级爬越（precedence\
  \ climbing），这在随后的章节中更容易在其基础上进行构建。优先级爬越是你需要的最后一种主要的解析技术。一旦到位，在书的其余部分，你可以以较少的精力添加新语法。在汇编生成阶段，你将引入几个执行二进制运算的汇编指令。像往一样，我们将从词法分析器开始。\n\
  \n### 词法分析器\n词法分析器需要识别四个新的标记：\n`+` 加号，加法操作符\n`*` 星号，乘法操作符\n`/` 斜杠，除法操作符\n`%` 百分号，取模运算符\n\
  \n此列表不包含 `-` 标记，因为你在上一章中添加了它。词法分析阶段不区分取反和减法；无论哪种情况都产生相同的标记。你应该像处理前几章中的单字符标记一样来处理这些标记。\n\
  \n### 解析器\n现在你将向 AST（抽象语法树）中添加另一种表达式：二进制运算。[Listing 3-1] 显示了更新后的 AST 定义。\n\n\n\n\
  \n\n```\nprogram = Program(function_definition)\nfunction_definition = Function(identifier\
  \ name, statement body)\nstatement = Return(exp)\nexp = Constant(int)\n    | Unary(unary_operator,\
  \ exp)\n    | Binary(binary_operator, exp, exp)\nunary_operator = Complement | Negate\n\
  binary_operator = Add | Subtract | Multiply | Divide | Remainder\n```\n\n**列表 3-1:\
  \ 带有二元操作的抽象语法树**\n\n注意，解析器与词法分析器不同，它能够区分否定和减法。`-` 标记被解析为 `Negate` 或 `Subtract`，取决于它出现在表达式的什么位置。\n\
  \n同样注意，AST 的结构决定了嵌套表达式的求值顺序。让我们几个例子，看看 AST 的结构如何控制操作顺序。图 3-1 中的 AST 表示表达式 `1 + (2\
  \ * 3)`，其求值结果为 7。\n\n![](img/fig3-1.jpg)\n\n**图 3-1: 1 + (2 * 3) 的 AST** 描述\n\n\
  `+` 操作有两个操作数：`1` 和 `(2 * 3)`。要评估这个表达式，你首先计算 `2 * 3`，然后将 `1` 加到结果上。相反，图 3-2](#chapter3.xhtml_fig3-2)\
  \ 中的 AST 表示表达式 `(1 + 2) * 3`，其求值结果为 9。\n\n![](img/fig3-2.jpg)\n\n**图 3-2: (1 + 2)\
  \ * 3 的 AST** 描述\n\n在这种情况下，你先求值 `1 + 2`，然后乘以 `3`。作为一个一般规则，在求值 AST 节点之前，你需要求值它的两个子节点。这种在处理节点本身之前先处理其子节点的模式被称为*后序遍历*。注意，任何树数据结构都可以以后序进行遍历，而不是\
  \ AST。\n\n你的编译器遍历 AST 是为了生成代码，而不是求值表达式，但思路是相同的。当你将二元表达式的 AST 转换为 TACKY 时，你首先生成计算两个操作数的指令，然后为操作本身生成指令。（你也在第\
  \ 2 章 中使用了后序遍历来处理一元操作。）\n\n你的解析器正确分组嵌套表达式至关重要。如果你尝试解析 `1 + (2 * 3)` 但最终得到了来自图 3-2](#chapter3.xhtml_fig3-2)\
  \ 的 AST，你最终将错误地编译程序。\n\n我们刚刚看到的示例使用了括号来显式地分组嵌套表达式。某些表达式（如 `1 + 2 * 3`）并没有对每个嵌套表达式加括号。在这种情况下，我们根据运算符的*优先级*和*结合性*对表达式进行分组。优先级高的运算符先求值；由于\
  \ `*` 的优先级高于 `+`，你会将 `1 + 2 * 3` 解析为 `1 + (2 * 3)`。结合性告诉你如何处理具有相同优先级的运算符。如果一个操作是*左结合*的，你先应用左侧的操作；如果是*右结合*的，你先应用右侧的操作。例如，由于加法和减法是左结合的，`1\
  \ + 2 - 3` 将被解析为 `(1 + 2) - 3`。本章中的所有新运算符都是左结合的，并且有两个优先级级别：`*` 和 `/` 优先级较高，而 `+`\
  \ 和 `-` 优先级较低。\n\n\n\n\n\n其次，新的产生规则是`左递归的`：对于 `exp` 而言，该产生规则中最左侧的符号本身就是 `exp`。你不能在递归下降解析器中使用左递归规则；如果你尝试这样做，就会导致无限递归。想象一下在\
  \ `parse_exp` 中尝试实现这一产生规则。该规则中的第一个符号是 `exp`，因此 `parse_exp` 必须通过递归地调用自己来处理该符号。但 `parse_exp`\
  \ 在递归调用之前不会消耗任何标记（tokens）。它将以完全相同的输入再次调用自己，因此永远不会结束。\n\n我们可以通过几种方式来解决这些问题。如果我们想要得到一个纯粹的递归下降解析器，可以重构文法以消除歧义和左递归。由于这种方法存在一些缺点，我们将使用优先级提升法（precedence\
  \ climbing），这是递归下降解析的替代方案。不过，先看一眼纯粹的递归下降解决方案是有帮助的。\n\n### 充分的解决方案：重构文法\n\n如果我们重构文法，将为每个优先级级别得到一个文法规则，如\
  \ Listing 3-3 所示。\n\n```\n<exp> ::= <term> {(\"+\" | \"-\") <term>}\n<term> ::=\
  \ <factor> {(\"*\" | \"/\" | \"%\") <factor>}\n<factor> ::= <int> | <unop> <factor>\
  \ | \"(\" <exp> \")\"\n```\n\n*Listing 3-3: 适用于递归下降的二元运算文法*\n\n使用 Listing 3-3 中的文法，解析\
  \ `1` `+` `2 * 3` 只有一种方法，且没有左递归。括号表示重复，例如，单个 `exp` 可以包含任意数量的 `term`。它可以是一个 `term`，或者是\
  \ `term` `+` `term`，或者 `term` - `term` `+` `term` 等以此此类推。然后解析器将该长项字符串组合成一个左结合树，以构建一个\
  \ `exp` AST 节点。（注意，我们不能使用像 `exp ::= term \"+\" exp` 这样的规则，因为它会导致右结合树。另一方面，Listing\
  \ 3-3 中的文法并没有指定结合性，这允许解析器构建左结合树或右结合树。）\n\n这种方法虽然可行，但随着你添加更多层级的优先级，它会变得越来越臃肿。如果加上\
  \ `factor`，我们现在有三个优先级级别；当我们第 4 章中引入逻辑和关系运算符时，还将再增加四个。如果我们采用这种方法，每增加一个优先级级别，就需要为文法添加一个新符号——并为我们的解析器添加一个相应的函数。这将大量的模板代码，因为解析不同优先级级别表达式的函数几乎是相同的。\n\
  \n### 更好的解决方案：优先级提升\n\n优先级提升法是解析二元表达式的一种更简单的方法。它可以处理如 `exp <binop> <exp>` 的产生规则，同时遵循每个二元运算符的优先级。在优先级提升法中，每个运算符都有一个数字级别，`parse_exp`\
  \ 将最小优先级级别作为参数。这允许你为正在解析的任何子表达式指定相应的优先级级别。例如，假设你刚刚看到一个 `+` 标记，现在你想将接下来的内容解析为加法表达式的右侧：你会指定它应该包含优先级高于\
  \ `+` 的操作。这种解决方案使得添加新运算符变得非常容易；你必须为每个新运算符分配一个优先级级别，但不需要对解析代码做任何其他更改。\n\n#### 将优先级提升法与递归下降结合\n\
  \n我们可以使用优先级提升法来解析二元表达式，并继续使用递归下降解析其他结构。记住，递归下降解析器使用不同的函数来解析每个符号。这使得使用不同技术解析不同符号变得非常容易：我们在\
  \ `parse_exp` 函数中使用优先级提升法，在解析所有其他符号的函数中使用递归下降。`parse_exp` 函数将从输入流中移除标记并返回一个 AST\
  \ 节点，就像基于递归下降的解析函数一样，但它将使用不同的策略来获取该结果。\n\n由于我们已经使用递归下降来解析一元表达式和括号表达式，让我们用一个与二元运算分离的符号来表示它们。Listing\
  \ 3-4 显示了结果性文法，其中相对于第 2 章的更改已加粗。\n\n```\n<program> ::= <function>\n<function> ::=\
  \ \"int\" <identifier> \"(\" \"void\" \")\" \"{\" <statement> \"}\"\n<statement>\
  \ ::= \"return\" <exp> \";\"\n<exp> ::= <factor> | <exp> <binop> <exp>\n<factor>\
  \ ::= <int> | <unop> <factor> | \"(\" <exp> \")\"\n<unop> ::= \"-\" | \"~\"\n<binop>\
  \ ::= \"-\" | \"+\" | \"*\" | \"/\" | \"%\"\n<identifier> ::= ? 一个标识符标记 ?\n<int>\
  \ ::= ? 一个常量标记 ?\n```\n\n*Listing 3-4: 处理二元运算的最终文法*\n\n\n\n\n我们在 Listing 2-6 中称为\
  \ `exp` 的符号现在被称为 `factor`；它代表一个常量、一个一元表达式或一个带括号的表达式。（我们将保留 Listing 3-3 中的 `factor`\
  \ 名称，因为这个符号可以作为因子出现在乘法表达式中。）我们使用通常的递归下降法来解析一个 `factor`。它的定义与第 2 章中 `exp` 的定义几乎相同，不同在于我们现在允许括号内包含二元表达式以及因子。这意味着\
  \ `(1 + 2)`是一个 `factor`，因为 `\"(\" <exp> \")\"` 是 `factor` 的一个产生式。然而，`-1 + 2` 不是，因为\
  \ `<unop> <exp>` 不是 `factor` 的产生式。一个 `exp` 要么是一个二元运算（定义方式显而易见），要么是一个 `factor`。由于\
  \ `exp` 和 `factor` 的规则相互引用，解析这些符号的函数是互递归的。这两个函数都会产生 `exp` AST 节点；`factor` 和 `exp`\
  \ 是语法中不同的符号，但在 AST 中并不是不同的类型。\n\n解析 `factor` 的伪代码在 Listing 3-5 中所示。\n\n```\nparse_factor(tokens):\n\
  \    next_token = peek(tokens)\n    if next_token is an int:\n        --snip--\n\
  \    else if next_token is \"~\" or \"-\":\n        operator = parse_unop(tokens)\n\
  \      ❶ inner_exp = parse_factor(tokens)\n        return Unary(operator, inner_exp)\n\
  else if next_token == \"(\":\n        take_token(tokens)\n      ❷ inner_exp = parse_exp(tokens)\n\
  \        expect(\")\", tokens)\n        return inner_exp\n    else:\n        fail(\"\
  Malformed factor\")\n```\n\nListing 3-5: 解析 factor\n\n这看起来与上一章的表达式解析代码（见 Listing\
  \ 2-7）非常相似。唯一的区别是，我们在需要 `factor` 的 ❶ 处调用 `parse_factor`，在需要 `exp` 的 ❷ 处调用 `parse_exp`；而之前，我们在两个地方都调用的是\
  \ `parse_exp`。\n\n##### 使运算符具有左结合\n\n接下来，让我们编写 `parse_exp` 的新版本。我们将从一个简单的函数版本开始，只处理\
  \ `+` 和 `-` 运算符，这两个运算符处于相同的优先级。这个简化的 `parse_exp` 需要以左结合的方式对表达式分组，但目前不需要处理多个优先级级别。\n\
  \n在这个简单的 `parse_exp` 中，我们会遇到像 `1 + 2 - 3` 这样的输入。它们应该以左结合的方式解析，产生类似 `(1 + 2) - 3`\
  \ 的表达式。\n\n```\nparse_exp(tokens):\n  ❶ left = parse_factor(tokens)\n    next_token\
  \ = peek(tokens)\n  ❷ while next_token is \"+\" or \"-\":\n        operator = parse_binop(tokens)\n\
  \      ❸ right = parse_factor(tokens)\n      ❹ left = Binary(operator, left, right)\n\
  \        next_token = peek(tokens)\n    return left\n```\n\nListing 3-6: 在不考虑优先级的情况下解析左结合表达式\n\
  \n\n\n\n\n现在让我们扩展代码列表 3-6 来处理 `*`、`/` 和 `%`。这些运算符也是左结合的，但它们的优先级级别高于 `+` 和 `-`。\n\
  \n一旦我们添加了这些运算符，每个表达式的右操作数就可以是一个单个因子（factor），也可以是一个仅包含这些新的高优先级运算符的子表达式。例如，`1 + 2\
  \ * 3 + 4` 将被解析为 `(1 + (2 * 3)) + 4`。整个表达式的右操作数是一个单个因子 `4`。内部子表达式 `1 + (2 * 3)`\
  \ 的右操作数是一个乘积 `2 * 3`。\n\n换句话说，如果最外层的表达式是 `+` 或 `-` 操作，那么它的右操作数只包含因子以及 `*`、`/` 和\
  \ `%` 操作。但如果最外层的表达式本身是 `*`、`/` 或 `%` 操作，那么它的右操作数必须是单个因子。\n\n推广来说：当我们解析形式为 `e1 <op>\
  \ e2` 的表达式时，`e2` 中的所有运算符的优先级都应该高于 `<op>`。我们可以通过调整代码列表 3-6 中的代码来实现，从而得到代码列表 3-7。\n\
  \n```\nparse_exp(tokens, min_prec):\n    left = parse_factor(tokens)\n    next_token\
  \ = peek(tokens)\n    while next_token is a binary operator and precedence(next_token)\
  \ >= min_prec:\n        operator = parse_binop(tokens)\n        right = parse_exp(tokens,\
  \ precedence(next_token) + 1)\n        left = Binary(operator, left, right)\n  \
  \      next_token = peek(tokens)\n    return left\n```*代码列表 3-7：使用优先级提升算法解析左结合表达式*\n\
  \n这段伪代码就是我们完整的优先级提升算法。`min_prec` 参数允许我们声明，当前正在解析的子表达式中的所有运算符都需要超过某个优先级级别。例如，我们可以只包含优先级高于\
  \ `+` 的运算符。我们通过在 `while` 循环的每次迭代中比较当前运算符的优先级与 `min_prec` 来强制执行这一点；如果该运算符的优先级较低，则排除该运算符及其后的任何内容。\n\
  \n#### 优先级提升的实例\n\n让我们通过一个示例来解析以下表达式：\n\n```\n1 * 2 - 3 * (4)\n```\n\n下面的代码片段追踪了代码列表\
  \ 3-7 中的优先级提升代码在解析该表达式时的执行过程。我们首先对整个表达式调用 `parse_exp`并将 `0` 作为最小优先级参数：\n\n```\n\
  parse_exp(\"1 * 2 - 3 * (4)\", 0):\n```\n\n接下来，在 `parse_exp` 内部，我们解析第一个因子：\n\n```\n\
  \ left = parse_factor(\"1 * 2 - 3 * (4)\")\n         = Constant(1)\n    next_token\
  \ = \"*\"\n```\n\n第一次调用 `parse_factor` 解析了标记 `1`，返回 `Constant(1)`。接下来，我们查看随后的标记\
  \ `*`。该标记是一个优先级大于零的二元运算符，因此我们进入 `while` 循环。\n\n循环的第一次迭代如下：\n\n```\n // loop iteration\
  \ #1\n    operator = parse_binop(\"* 2 - 3 * (4)\")\n             = Multiply\n \
  \   right = parse_exp(\"2 - 3 * (4)\", 51)\n                left = parse_factor(\"\
  2 - 3 * (4)\")\n                     = Constant(2)\n                next_token =\
  \ \"-\"\n                // precedence(next_token) < 51\n         = Constant(2)\n\
  \    left = Binary(Multiply, Constant(1), Constant(2))\n    next_token = \"-\"\n\
  ```\n\n\n\n\n在循环内部，`parse_binop` 从输入中消耗 `next_token` 并将其转换为 AST 节点 `Multiply`，留下了\
  \ `2 - 3 * (4 + 5)`。接下来，我们递归地调用 `parse_exp` 来获取该乘法表达式右侧的部分。由于 `*` 的优先级为 50，`parse_exp`\
  \ 的第二个参数是 `51`。在递归调用中，我们再次获取下一个因子（`2`）以及紧随其后的令牌（`-`）。`-` 令牌是一个二元运算符，但它的优先级仅为 45；它不满足\
  \ 51 的最小优先级，因此我们没有进入 `while` 循环。相反，我们返回 `Constant(2)`。\n\n回到外层的 `parse_exp` 调用中，我们根据目前已解析的值为\
  \ `1 * 2` 构建一个 `Binary` AST 节点。然后，我们检查下一个令牌，看我们是否有更多的子表达式需要处理。下一个令牌是 `-`；在 `parse_exp`\
  \ 的递归调用内部，我们查看了它，但没有将其从输入中移除。因为 `-` 是二元运算符，且超过了我们零的最小优先级，我们跳回 `while` 循环的开头来解析下一个子表达式：\n\
  \n```\n // 循环迭代 #2\n    operator = parse_binop(\"- 3 * (4 + 5)\")\n            \
  \ = Subtract\n    right = parse_exp(\"3 * (4 + 5)\", 46)\n                left =\
  \ parse_factor(\"3 * (4 + 5)\")\n                     = Constant(3)\n          \
  \      next_token = \"*\"\n                // 循环迭代 #1\n                operator\
  \ = parse_binop(\"* (4 + 5)\")\n                         = Multiply\n          \
  \      right = parse_exp(\"(4 + 5)\", 51)\n                            left = parse_factor(\"\
  (4 + 5)\")\n                                        parse_exp(\"4 + 5)\", 0)\n \
  \                                       --snip--\n                             \
  \   = Binary(Add, Constant(4), Constant(5))\n                      = Binary(Add,\
  \ Constant(4), Constant(5))\n                left = Binary(\n                  \
  \         Multiply,\n                           Constant(3),\n                 \
  \          Binary(Add, Constant(4), Constant(5))\n                        )\n  \
  \        = Binary(\n                Multiply,\n                Constant(3),\n  \
  \              Binary(Add, Constant(4), Constant(5))\n            )\n    left =\
  \ Binary(\n               Subtract,\n               Binary(Multiply, Constant(1),\
  \ Constant(2)),\n               Binary(\n                   Multiply,\n        \
  \           Constant(3),\n                   Binary(Add, Constant(4), Constant(5))\n\
  \                )\n            )\n```\n\n在循环的第二次执行中，我们从输入中消耗 `-` 并对 `parse_exp`\
  \ 进行递归调用。这次，因为 `-` 的优先级是 45，`parse_exp` 的第二个参数是 `46`。\n\n按照通常惯例，我们获取下一个因子（`3`）和下一个令牌（`*`）。由于\
  \ `*` 的优先级超过了最小优先级，我们需要解析另一个子表达式。我们消耗 `*`，留下了 `(4 + 5)`，然后再次对 `parse_exp` 进行递归调用。\n\
  \n在这次 `parse_exp` 调用中，我们首先调用 `parse_factor`。为了处理那个括号表达式，`parse_factor` 需要递归调用 `parse_exp`，并将最小优先级重置为\
  \ `0`。假设这是一个有效的 C 程序，且下一个令牌是 `;`。由于表达式中没有剩余令牌，我们退出循环并返回从 `parse_factor` 获取的表达式。\n\
  \n在上一层级中，我们根据在本次调用中处理的子表达式为 `3 * (4 + 5)` 构建 AST 节点。再次查看下一个令牌，发现它不是二元运算符，然后返回。\n\
  \n最后，回到原始的 `parse_exp` 调用中，我们根据在第一次循环迭代中构建的左操作数（`1 * 2`）、`operator` 的当前值（`-`）以及刚刚从递归调用返回的右操作数（`3\
  \ * (4 + 5)`）构建最终表达式。最后一次，我们检查下一个令牌，发现它不是二元运算符，然后返回。\n\n现在你已经了解如何使用优先级爬升（precedence\
  \ climbing）解析二元表达式，准备好扩展你的解析器了。记住使用优先级爬升来解析二元表达式，并使用递归下降来解析语法中的所有其他符号，包括因子。\n\n\
  ### TACKY 生成\n\n接下来，让我们更新将 AST 转换为 TACKY 的阶段。我们将从向 TACKY 中添加二元运算开始。列表 3-8 定义了更新后的\
  \ TACKY IR，其中本章添加的内容已加粗。\n\n```\nprogram = Program(function_definition)\nfunction_definition\
  \ = Function(identifier, instruction* body)\ninstruction = Return(val)\n       \
  \     | Unary(unary_operator, val src, val dst)\n            | Binary(binary_operator,\
  \ val src1, val src2, val dst)\nval = Constant(int) | Var(identifier)\nunary_operator\
  \ = Complement | Negate\nbinary_operator = Add | Subtract | Multiply | Divide |\
  \ Remainder\n```\n\n**列表 3-8: 向 TACKY 添加二元运算**\n\n\n\n\n我们添加了 `Binary` 指令来表示二元操作，并定义了所有可能的运算符。与单元操作一样，TACKY\
  \ 中的二元操作作用于常量和变量，而不是嵌套的子表达式。如列表 3-9 所示，我们可以基本上按照处理单元表达式的方式，将二元表达式转换为一系列 TACKY 指令。\n\
  \n```\nemit_tacky(e, instructions):\n    match e with\n    | --snip--\n    | Binary(op,\
  \ e1, e2) ->\n        v1 = emit_tacky(e1, instructions)\n        v2 = emit_tacky(e2,\
  \ instructions)\n        dst_name = make_temporary()\n        dst = Var(dst_name)\n\
  \        tacky_op = convert_binop(op)\n        instructions.append(Binary(tacky_op,\
  \ v1, v2, dst))\n        return dst\n```\n\n**列表 3-9: 将二元表达式转换为 TACKY**\n\n我们生成\
  \ TACKY 指令来求值每个操作数，然后生成使用这些源值的 `Binary` 指令。与我们处理单元表达式的唯一区别在于，我们处理的是两个操作数而不是一个。\n\
  \n在继续进行汇编生成之前，我想谈一个稍微偏题的点。我们在列表 3-9 中生成的 TACKY 在求值第二个操作数之前先求值第一个操作数，但先求值第二个操作数同样正确。根据\
  \ C 标准，相同操作的子表达式通常是`无序的`（unsequenced）；也就是说，它们可以以任何顺序进行求值。如果两个子表达式是无序，但其中一个或两个都是函数调用，则它们是`不确定顺序的`（indeterminately\
  \ sequenced），这意味着其中一个可以先执行，但它们不能交替执行。在许多情况下，无序和不确定顺序的求值会导致不可预测的结果。考虑以下程序，它包含了两个对不确定顺序的\
  \ `printf` 调用：\n\n```\n#include <stdio.h>\n\nint main(void) {\n    return printf(\"\
  Hello, \") + printf(\"World!\");\n}\n```\n\n你可以使用符合 C 标准的编译器编译此程序并运行它，然后得到以下输出之一：\n\
  \n```\nHello, World!\nWorld!Hello,\n```\n\n有少数例外情况我们必须先求值第一个操作数：逻辑 `&&` 和 `||` 运算符，我们将在第\
  \ 4 章介绍；条件 `?:` 运算符，我们将在第 6 章介绍；以及我们不会实现的逗号运算符。关于表达式求值顺序的更深入讨论，请参见 cpp.com 上的“求值顺序”页面（https://en.cpp.com/w/language/eval_order）。如果你对\
  \ C 标准中所有的安排感兴趣，请参见第 5.1.2 节（涵盖求值顺序的通用规则并定义了 `unsequenced` 和 `indeterminately sequenced`\
  \ 术语）和第 6.5 节第 1–3 段（操作数的求值顺序）。\n\n无序操作是更广泛模式的一个例子：在许多情况下，C 标准并没有规定程序应该如何行为。我们将在全范围内看到更多例子。通过对某些行为细节不作明确规定，C\
  \ 标准将大量权力交给了编译器编写者，允许他们编写复杂的优化。但存在一个显然的权衡：程序员很容易写出行为可能不符合其预期的代码。\n\n### 汇编生成\n\n\
  下一步是将 TACKY 转换为汇编。我们需要几个新的汇编指令来处理加法、减法、乘法和取余操作。让我们讨论如何使用这些指令；然后对每个阶段进行必要的更新。\n\n\
  #### 在汇编中进行算术运算\n\n加法、减法和法的指令均采用 `op src, dst` 的形式，其中：\n\n- `op` 是指令。\n- `src` 是立即值、寄存器或内存地址。\n\
  - `dst` 是寄存器或内存地址。\n\n这些指令每一个会将 `op` 应用于 `dst` 和 `src`，并将结果存储在 `dst` 中。加法、减法和法的指令分别为\
  \ `add`、`sub` 和 `imul`。按照惯例，如果操作数是 32 位，这些指令带有 `l` 后缀；如果是 64 位，则带有 `q` 后缀。表 3-2\
  \ 显示了每条指令的示例。\n\n**表 3-2: 加法、减法和乘法的汇编指令**\n\n| 指令 | 含义 |\n| :--- | :--- |\n| `addl\
  \ $2, %eax` | `eax = eax + 2` |\n| `subl $2, %eax` | `eax = eax - 2` |\n| `imull\
  \ $2, %eax` | `eax = eax * 2` |\n\n注意，`dst` 是对应数学表达式中的第一个操作数，因此 `subl a, b` 计算的是\
  \ `b - a`，而不是 `a - b`。\n\n这些指令很容易使用和理解。如果我们生活在一个完美的世界里，我们可以以完全相同的方式进行除法。但事实并非如此，所以我们只能使用\
  \ `idiv` 指令。\n\n\n\n\n]\n\n我们使用 `idiv` 指令来实现除法和取模操作。虽然执行除法需要两个数字，但它只需要一个操作数：除数。（在\
  \ `a / b` 中，`a` 是被除数，`b` 是除数。）该操作数不能是立即数。在 32 位格式下，`idiv` 从 `EDX` 和 `EAX` 寄存器获取所需的另一个数值——被除数，并将其视为单一的\
  \ 64 位值。它从 `EDX` 获取高 32 位，从 `EAX` 获取低 32 位。与其他算术指令不同，`idiv` 会产生两个结果：商和余数。它将商存储在\
  \ `EAX` 中，将余数存储在 `EDX` 中。（64 位版本的 `idiv` 写作 `idivq` 使用 `RDX` 和 `RAX` 作为被除数，而不是 `EDX`\
  \ 和 `EAX`）。\n\n要用 `idiv` 计算 `a / b`，我们需要获取 `a`——它可能是 32 位立即数，也可能是存储在内存中的 32 位值——并将其转换为跨越\
  \ `EDX` 和 `EAX` 的 64 位值。每我们需要将有符号整数转换为更宽的格式时，都会使用一种名为“符号扩展”（sign extension）的操作。该操作会将新\
  \ 64 位值的高 32 位用原始 32 位值的符号位填充。\n\n对正数进行符号扩展仅仅是在高 32 位（4 字节）中填充零。例如，对 3 的二进制表示进行符号扩展将把\n\
  \n```\n00000000000000000000000000000011\n```\n转换为：\n\n```\n00000000000000000000000000000011\n\
  ```\n这两种表示的值都是 3；只是后者的前导零更多。要符号扩展负数，我们在高 4 字节中填充 1。例如，对 -3 的二进制表示进行符号扩展将把\n\n```\n\
  11111111111111111111111111111101\n```\n转换为：\n\n```\n11111111111111111111111111111101\n\
  ```\n得益于补码的魔法，这两个数字的值都是 -3。（如果你清楚它是如何工作的，请查看第 2 章 的“额外资源”部分。）\n\n`cdq` 指令完全符合我们的要求：它将\
  \ `EAX` 中的值符号扩展到 `EDX`。如果 `EAX` 中的数字为正，该指令将 `EDX` 设置为全零。如果 `EAX` 为负，它将 `EDX` 设置为全\
  \ 1。结合起来，以下汇编代码计算了 `9 / 2` 和 `9 % 2`：\n\n```\nmovl $2, -4(%rbp)\nmovl $9, %eax\n\
  cdq\nidivl -4(%rbp)\n```\n这会将 `9 / 2` 的商存储在 `EAX` 中。它会将 `9 % 2` 的余数存储在 `EDX` 中。\n\
  \n我们涵盖了本章所需的所有指令：`add`、`sub`、`imul`、`idiv` 和 `cdq`。接下来，我们将这些指令添加到 AST 并更新转换为汇编。\n\
  \n### 将二进制操作转换为汇编\n\n`Listing 3-10` 定义了更新后的 AST，本章的内容已加粗。\n\n```\nprogram = Program(function_definition)\n\
  function_definition = Function(name, instructions)\ninstruction = Mov(src, dst)\n\
  \            | Unary(unary_operator, operand)\n            | Binary(binary_operator,\
  \ operand, operand)\n            | Idiv(operand)\n            | Cdq\n          \
  \  | Allocate(int)\n            | Ret\nunary_operator = Neg | Not\nbinary_operator\
  \ = Add | Sub | Mult\noperand = Imm(int) | Reg(reg) | Pseudo(identifier) | Stack(int)\n\
  reg = AX | DX | R\n```\n\n由于加法、减法和乘法指令的形式相同，我们将使用 `Binary` 构造函数表示它们所有。我们还会为新的 `idiv`\
  \ 和 `cdq` 指令添加构造函数。最后，我们将 `EDX` 和 `R1` 寄存器添加到 AST 中；我们需要 `EDX` 用于除法，`R1` 用于指令修复。\n\
  \n现在我们需要将新的二进制操作转换为汇编。对于加法、减法和乘法，我们将单条指令转换为两条汇编指令。也就是说，我们将\n\n```\nBinary(op, src1,\
  \ src2, dst)\n```\n转换为：\n\n```\nMov(src1, dst)\nBinary(op, src2, dst)\n```\n\n除法复杂一些；我们将第一个操作数移动到\
  \ `EAX`，用 `cdq` 进行符号扩展，发射 `idiv` 指令，然后将结果从 `EAX` 移动到目标。因此，我们将\n\n```\nBinary(Divide,\
  \ src1, src2, dst)\n```\n转换为：\n\n```\nMov(src1, Reg(AX))\nCdq\nIdiv(src2)\nMov(Reg(AX),\
  \ dst)\n```\n\n取模操作看起来完全一样，只是我们最终想要从 `EDX` 获取余数，而不是从 `EAX` 获取商。因此，我们将\n\n```\nBinary(Remainder,\
  \ src1, src2, dst)\n```\n转换为：\n\n```\nMov(src1, Reg(AX))\nCdq\nIdiv(src2)\nMov(Reg(DX),\
  \ dst)\n```\n\n`idiv` 指令不能对立即数操作，因此如果 `src2` 是常量，除法和取模的汇编指令将无效。这没关系；我们将在指令修复阶段解决这个问题。`表\
  \ 3-3` 到 `3-6` 总结了从 TACKY 到汇编的转换，新增和修改的结构已加粗。\n\n#### 表 3-3：将顶层 TACKY 结构转换为汇编\n\n\
  | TACKY 顶层结构 | 汇编顶层结构 |\n| --- | :--- |\n| `Program(function_definition)` | `Program(function_definition)`\
  \ |\n| `Function(name, instructions)` | `Function(name, instructions)` |\n\n####\
  \ 表 3-4：将 TACKY 指令转换为汇编\n\n| TACKY 指令 | 汇编指令 |\n| :--- | :--- |\n| `Return(val)`\
  \ | `Mov(val, Reg(AX))` `Ret` |\n\n\n\n\n| `Unary(unary_operator, src, dst)` | `Mov(src,\
  \ dst)` `Unary(unary_operator, dst)` |\n| `Binary(Divide, src1, src2, dst)` | `Mov(src1,\
  \ Reg(AX))` `Cdq` `Idiv(src2)` `Mov(Reg(AX), dst)` |\n| `Binary(Remainder, src1,\
  \ src2, dst)` | `Mov(src1, Reg(AX))` `Cdq` `Idiv(src2)` `Mov(Reg(DX), dst)` |\n\
  | `Binary(binary_operator, src1, src2, dst)` | `Mov(src1, dst)` `Binary(binary_operator,\
  \ src2, dst)` |\n\n**表 3-5:** 将 TACKY 算术运算符转换为汇编\n\n| TACKY  | 汇编运算符 |\n| --- |\
  \ --- |\n| Complement | Not |\n| Negate | Neg |\n| Add | Add |\n| Subtract | Sub\
  \ |\n| Multiply | Mult |\n\n**表 3-6:** 将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n\
  | --- | --- |\n| Constant(int) | Imm(int) |\n| Var(identifier) | Pseudo(identifier)\
  \ |\n\n注意表 3-4 为 `Binary` TACKY 指令包含了三行：一行用于除法，一行用于取模操作，另一行用于其他所有情况。\n\n### 替换伪寄存器\n\
  \n更新此传递以替换新的 `Binary` 和 `Idiv` 指令中的伪寄存器。你应该像处理现有的 `Mov` 和 `Unary` 指令一样处理它们。当你在 `Mov`、`Unary`、`Binary`\
  \ 或 `Idiv` 指令中看到伪寄存器时，将其替换为对应的栈地址。如果尚未分配栈地址，为其分配下一个 4 字节。\n\n### 修复 idiv、add 和 imul\
  \ 指令\n\n在生成最终程序的最后一个编译器传递中，重写早期阶段生成的任何无效指令。我们需要添加几条规则。首先，我们需要修复带有常数操作数的 `idiv` 指令。每当\
  \ `idiv` 需要对常数操作时，我们将该常数拷贝到临时寄存器中。例如，我们将重写：\n\n```\nidl $3\n```\n\n为：\n\n```\nmovl\
  \ $3, %r10d\nidiv %r10d\n```\n\n`add` 和 `sub` 指令像 `mov` 一样，不能同时使用内存地址作为源目的操作数。我们像处理\
  \ `mov` 一样重写它们，使得：\n\n```\naddl -4(%rbp), -8(%rbp)\n```\n\n变为：\n\n```\nmovl -4(%rbp),\
  \ %r10d\naddl %r10d, -8(%rbp)\n```\n\n`imul` 指令无论源操作数是什么，都不能内存地址作为目标。为了修复指令的目标操作数，我们使用\
  \ `R11` 寄存器代替 `R10`。因此，为了修复 `imul`，我们将目标加载到 `R11`，乘以源操作数，然后将结果存回目标地址。换句话说，指令\n\n\
  ```\nimull $3, -4(%rbp)\n```\n\n变为：\n\n```\nmovl -4(%rbp), %r11d\nimull $3, %r11d\n\
  movl %r11d, -4(%rbp)\n```\n\n使用不同的寄存器来修复源和目标操作数将在第二部分 中变得有用，届时我们将重写同一指令的源和目标。我们需要两个寄存器，以确保不同操作数的修复指令不会相互覆盖。\n\
  \n一旦你更新了汇编生成、伪寄存器替换和指令修复编译器传递，你的编译器就应该能够生成执行基本算术的完整、正确的汇编程序。剩下的就是以正确的格式输出这些汇编程序。\n\
  \n### 代码发射\n\n最后一步是扩展代码发射阶段以处理我们新的汇编指令。表 3-7 到 3-10 显示了如何打印每个构造，新构造已加粗显示。\n\n**表\
  \ 3-7:** 顶层汇编构造的格式化\n\n| 汇编顶层构造 | 输出 |\n| --- | --- |\n| `Program(function_definition)`\
  \ | \n```\n打印函数定义。\n在 Linux 上，在文件末尾添加：\n    .section .note.GNU-stack,\"\",@progbits\n\
  ``` |\n| `Function(name, instructions)` | \n```\n .globl <name>\n<name>:\n```\n\
  ```\n pushq    %rbp\n    movq     %rsp, %rbp     \n    <instructions>\n``` |\n\n\
  **表 3-8:** 汇编指令的格式化\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `Mov(src, dst)` | \n```\n\
  movl     <src>, <dst>\n``` |\n| `Ret` | \n```\nmovq    %rbp, %rsp\npopq    %rbp\n\
  ret\n``` |\n| `Unary(unary_operator, operand)` | \n```\n<unary_operator>     <operand>\n\
  ``` |\n| `Binary(binary_operator, src, dst)` | \n```\n<binary_operator>    <src>,\
  \ <dst>\n``` |\n\n\n\n\n\n| `Idiv(operand)` | |\n\n```\nidivl <operand>\n```\n\n\
  | `Cdq` | |\n\n```\ncdq\n```\n\n| `AllocateStack(int)` | |\n\n```\nsubq $<int>,\
  \ %rsp\n```\n\n**表 3-9: 汇编操作符的指令名称**\n\n| 汇编操作符 | 指令名称 |\n| --- | --- |\n| `Neg`\
  \ | `negl` |\n| `Not` | `notl` |\n| `Add` | `addl` |\n| `Sub` | `subl` |\n| `Mult`\
  \ | `imull` |\n\n**表 3-10: 汇编操作数的格式化**\n\n| 汇编操作数 | 输出 |\n| --- | --- |\n| `Reg(AX)`\
  \ | `%eax` |\n| `Reg(DX)` | `%edx` |\n| `Reg(R10)` | `%r10d` |\n| `Reg(R11)` | `%r11d`\
  \ |\n| `Stack(int)` | `<int>(%rbp)` |\n| `Imm(int)` | `$<int>` |\n\n新指令对 32 位值操作，因此它们带有\
  \ `l` 后缀（`cdq` 除外，它不遵循通常的命名约定）。请注意，我们用于减整数的 `subl` 指令和用于分配栈空间的 `subq` 指令是同一条指令的\
  \ 32 位和 64 位版本。\n\n### 额外奖励：位运算运算符\n\n现在你已经学习了如何编译二进制运算符，可以自己实现位运算二进制运算符了。这些运算符包括位与\
  \ (`&`)、位或 (`|`)、位异异 (`^`)、左移 (`<<`) 和右移 (`>>`)。你的编译器可以像处理之前添加的操作符一样处理它们。你需要查找这些运算符的相对优先级，并检查\
  \ x64 指令集文档查看如何使用相关的汇编指令。位运算是可选的；随后的测试用例并不依赖于它们。如果你确实实现了位运算，请使用 `--bitwise` 标志来包含这些的测试用例：\n\
  \n```\n./test_compiler --chapter 3 --bitwise\n```\n在后续章节中运行测试脚本时，请包含此标志，以便包含任何使用位运算运算符的测试用例。\n\
  \n### 总结\n\n在本章中，你在编译器中实现了几个二进制操作。你使用了一种新技术——优先级爬（precedence climbing），来解析递归下降解析器无法良好处理的表达式。在下一章中，你将实现更多单元和二进制操作：逻辑运算符\
  \ `!`、`&&` 和 `||` 以及关系运算符如 `==`、`<` 和 `>`。其中某些运算符与汇编指令没有直接对应，因此我们将它们拆解为低级指令。我们还将引入条件汇编，这在我们以后实现\
  \ `if` 语句和循环等控制流语句时将特别重要。\n\n### 额外资源\n\n这些博客文章帮助我理解了优先级爬以及它与解决相同问题的算法的关系；你可能也会发现它们很有帮助：\n\
  \n* Eli Bendersky 写的《通过优先级爬解析表达式》是对优先级爬算法的坚实的概述（https://eli.greenplace.net/2012/08/02/parsing-expressions-by-precedence-climbing）。列表\
  \ 3-7 中的优先级爬代码是根据此博客文章大致改编的；它也启发了第 55 页“行动中的优先级爬”中示例的呈现。\n* 同样由 Eli Bendersky 写的《递归下降解析器的问题》讨论了如何用纯递归下降解析器处理二进制表达式（https://eli.greenplace.net/2009/03/14/some-problems-of-recursive-descent-parsers）。\n\
  * Andy Chu 写了关于优先级爬的两篇有用博客。第一篇《Pratt 解析与优先级爬是同一种算法》探索了优先级爬与 Pratt 解析算法之间的基本相似性（https://www.oilshell.org/blog/2016/11/01.html）。第二篇《优先级爬被广泛使用》讨论了它们区别（https://www.oilshell.org/blog/2017/03/30.html）。这些文章澄清了围绕不同解析算法的一些混淆的术语。\n\
  \n![](img/pg70.jpg)\n\n描述\n\n## 4 逻辑与关系运算符\n\n![](img/opener-img.jpg)\n\n\n\n\n\n\
  现在你已经了解了如何编译二元运算符，接下来你将添加大量的运算符（外加一个一元运算符）。在本章中，你将添加三个逻辑运算符：`!`、AND `&&` 和 OR `||`。你还将添加关系运算符：`<`、`>>`、`==`\
  \ 等。这些运算符中的每一个都会测试某些条件，如果该条件为真，结果为 1，如果为假则为 0。\n\n`&&` 和 `||` 运算符与我们之前看到的二元运算符不同，因为它们具有**短路**特性：如果你根据第一个操作数就能确定结果，就不再求值第二个操作数。为了支持短路逻辑，我们将在\
  \ `TACKY` 中添加新指令，允许我们跳过代码块。我们还将在汇编生成阶段引入几个新指令，包括条件汇编指令，允许我们仅在满足某些条件时执行特定操作。\n\n\
  在进入编译器阶段之前，让我们先简要讨论一下短路运算符。\n\n### 短路运算符\n\nC 标准保证了当你不需要第二个操作数时，`&&` 和 `||` 会执行短路操作。例如，考虑表达式\
  \ `(1 - 1) && foo()`。由于第一个操作数的值为 0，无论 `foo` 返回什么，整个表达式都将求值为 0，因此我们根本不会调用 `foo`。同样，如果\
  \ `||` 的第一个操作数非零，我们就不求值第二个操作数。\n\n这不仅仅是一种性能优化；第二个操作数可能不会改变表达式的结果，但求值它可能会产生可见的副作用。例如，`foo`\
  \ 函数可能会执行 I/O 操作或更新全局变量。如果你的编译器没有将 `&&` 和 `||` 实现为短路运算符，某些编译后的程序将会运行异常。（标准在第 6.5.13\
  \ 节第 4 段定义了 `&&` 运算符的行为，在第 6.5.14 节第 4 段定义了 `||` 运算符的行为。）\n\n现在我们已经明确了这些运算符的工作原理，你可以继续编写代码了。\n\
  \n### 词法分析器\n\n在本章中，你将添加九个新的标记（token）：\n\n| `!` | 感叹号，逻辑非 运算符 |\n| :--- | --- |\n\
  | `&&` | 两个和符号，逻辑与 运算符 |\n| `||` | 两个竖线，逻辑或 运算符 |\n| `==` | 两个等号，“等于”运算符 |\n| `!=`\
  \ | 感叹号后跟一个等号，“不等于”运算符 |\n| `<` | “小于”运算符 |\n| `>` | “大于”运算符 |\n| `<=` | “小于或等于”运算符\
  \ |\n| `>=` | “大于或等于”运算符 |\n\n你的词法分析器应该以处理目前为止添加的其他运算符相同的方式处理这些标记。记住，词法分析器应该始终为下一个标记选择最长匹配项。例如，如果输入是\
  \ `<=something`，词法分析器发射的下一个标记应该是 `<=` 而不是 `<`。\n\n### 解析器\n\n接下来，我们将把新操作添加到 AST（抽象语法树）的定义中。代码列表\
  \ 4-1 显示了更新后的定义，其中新增部分已加粗显示。\n\n```\nprogram = Program(function_definition)\nfunction_definition\
  \ = Function(identifier, body)\nstatement = Return(exp)\nexp = Unary(unary_operator)\
  \ | Binary(binary_operator, exp)\nunary_operator = Complement | Negate\nbinary_operator\
  \ = Add | Subtract | Remainder | And | Or\n                | Equal | LessThan |\
  \ GreaterThan\n```\n代码列表 4-1：带有比较和逻辑运算符的抽象语法树\n\n我们还需要对语法进行相应的更改，如代码列表 4-2 所示。\n\
  \n```\nprogram ::= function\nfunction ::= int identifier \"()\" \"{\" statement\
  \ \"}\"\nstatement ::= return exp \";\"\nexp ::= factor | unaryop factor\nint ::=\
  \ constant\n```\n代码列表 4-2：带有比较和逻辑的语法\n\n在代码列表 4-1 和 4-2 中，我们添加了一些运算符，但没有做任何其他更改。现在我们准备好更新解析逻辑。首先，更新\
  \ `parse_factor` 以处理新的 `!` 运算符。它应该像解析一元运算符 `~` 和 `-` 一样解析 `!`。\n\n接下来，更新 `parse_exp`\
  \ 以处理新的二元运算符。在第 3 章中，我们将每个二元运算符关联到一个优先级值。现在我们将赋予新运算符优先级值。这些运算符的优先级低于第 3 章中的运算符，且它们都是左结合的。在新运算符中，`<`、`<=`、`>`\
  \ 和 `>=` 的优先级最高，其次是相等运算符 `==` 和 `!=`。`&&` 运算符的优先级低于相等运算符，而 `||` 的优先级最低。我选择的优先级值列在表\
  \ 4-1 中，其中新运算符已加粗。\n\n表 4-1：旧旧二元运算符的优先级值\n\n\n\n\n\n| 运算符 | 优先级 |\n| --- | --- |\n\
  | `*` | 50 |\n| `/` | 50 |\n| `%` | 50 |\n| `+` | 45 |\n| `-` | 45 |\n| `<` | 35\
  \ |\n| `<=` | 35 |\n| `>` | 35 |\n| `=` | 35 |\n| `==` | 30 |\n| `!=` | 30 |\n|\
  \ `&&` | 10 |\n| `||` | 5 |\n\n这些值之间的间隔足够大，为来自第 3 章的可选按位运算符留出了空间。在表的底部也为我们将在接下来两个章节中添加的\
  \ `=` 和 `?:` 运算符留出了空间。只要所有运算符之间的优先级是正确的，你就不需要使用表中的精确数值。\n\n你还需要扩展将标记（tokens）转换为\
  \ `unary _operator` 和 `binary_operator` AST 节点的代码。例如，将 `+` 标记转换为 `Add` 节点的函数也应该将\
  \ `==` 标记转换为 `Equal` 节点。（最后两章中的伪代码调用了单独函数 `parse_unop` 和 `parse_binop` 来处理这些转换。）\n\
  \n一旦更新了解析器的优先级值表、`parse _binop` 和 `parse_unop`，你就大任务！我们在上一章中实现的优先级爬升算法可以在不更改的情况下处理新运算符。\n\
  \n### 生成 TACKY 代码\n\n现在词法分析器和解析器都在正常工作，我们可以进入一个不太熟悉的领域：在 TACKY 中处理新运算符。你可以像处理已实现的二进制运算符相同的方法，将关系运算符转换为\
  \ TACKY。例如，给定表达式 `e1 < e2`，生成的 TACKY 看起来类似于列表 4-3。\n\n```\ninstructions for e1\n\
  v1 = result of e1\ninstructions for e2\nv2 = result of e2\nBinary(LessThan, v1,\
  \ v2)\n```\n列表 4-3：在 TACKY 中实现 `<` 运算符\n\n你不能通过这种方式生成 `&&` 和 `||` 运算符，因为它们具有短路特性。列表\
  \ 4-3 中的代码始终评估 `e1` 和 `e2`，但我们需要生成有时跳过 `e2` 的代码。为了支持短路，我们将添加一个无条件跳转，允许我们跳转到程序的不同位置。我们还将添加两个条件跳转，它们只在满足特定条件时才跳转。\n\
  \n#### 向 TACKY IR 中添加跳转、拷贝和比较\n\n列表 4-4 显示了最新的 TACKY 定义，包含了新的跳转指令。\n\n```\nprogram\
  \ = Program(function_definition)\nfunction_definition = Function(identifier, body)\n\
  instruction = Return(val)\n            | Unary(unary_operator, src, dst)\n     \
  \       | Binary(binary_operator, src1, src2, dst)\n            | Copy(src, dst)\n\
  \            | Jump(identifier)\n            | JumpIfZero(val, identifier)\n   \
  \         | JumpIfNotZero(val, identifier)\n            | Label(identifier)\nval\
  \ = Constant(int) | Var(identifier)\nunary_operator = Complement | Negate\nbinary_operator\
  \ = Add | Subtract | Divide | Remainder | Equal | NotEqual\n                | LessThan\
  \ | LessOrEqual | GreaterThan | GreaterOrEqual\n```\n列表 4-4：向 TACKY 添加比较操作、跳转和标签\n\
  \n`Jump` 指令的作用类似于 C 语言中的 `goto`：它让程序跳转到由标识符 `target` 标记的位置。`Label` 指令将标识符与程序中的某个位置关联。列表\
  \ 4-5 中的 TACKY 代码片段了 `Jump` 和 `Label` 指令是如何协同工作的。\n\n```\nUnary(Negate, Constant(1),\
  \ Var(\"tmp\"))\nJump(\"there\")\n❶ Unary(Negate, Constant(2), Var(\"tmp\"))\nLabel(\"\
  there\")\nReturn(Var(\"tmp\"))\n```\n列表 4-5：带有 Jump 指令的 TACKY 代码片段\n\n该程序将 `-1`\
  \ 存储在 `tmp` 中，然后执行 `Jump` 指令跳转到 `Label` 指令。接下来，执行 `Return` 指令返回 `-1`。第二个 `Unary`\
  \ 指令 ❶ 根本不会执行，因为我们跳过了它。\n\n\n\n\n\nTACKY IR 中的第一个条件跳转 `JumpIfZero` 在 `condition`\
  \ 的值为 0 时跳转到 `target` 所指示的指令。如果 `condition` 不是 0，我们不跳转到 `target`；而是像通常一样执行下一条指令。第二个条件跳转\
  \ `JumpIfNotZero` 的操作相反：只有当 `condition` 不为 0 时，我们才跳转到 `target`。我们实际上并不需要这两条指令，因为任何用其中一条指令表达的行为，都可以通过另一个指令加上一个\
  \ `Not` 指令来实现。但同时添加这两者可以让我们为 `&&` 和 `||` 操作生成更简单的 TACKY，最终将转化为更简单、更短的汇编代码。\n\n另一个新指令是\
  \ `Copy`。由于 `&&` 和 `||` 最终返回 1 或 0，我们使用这条指令将 1 或 0 拷贝到存储表达式结果的临时变量中。除了这五个额外的指令外，最新的\
  \ TACKY IR 还包含了新的关系和逻辑二元运算符，以及一元 `Not` 运算符。\n\n#### 将短路运算符转换为 TACKY\n\n让我们使用新的 TACKY\
  \ 指令来实现 `&&` 和 `||` 运算符。表达式 `e1 && e2` 的 TACKY 应该类似于列表 4-6 。\n\n```\n<instructions\
  \ for e1>\nv1 = <result of e1>\nJumpIfZero(v1, false_label)\n<instructions for e2>\n\
  v2 = <result of e2>\nJumpIfZero(v2, false_label)\nresult = 1\nJump(end)\nLabel(false_label)\n\
  result = 0\nLabel(end)\n```\n\n列表 4-6：在 TACKY 中实现 `&& 运算符`\n\n我们首先评估 `e1`。如果它是 0，我们就进行短路并将\
  \ `result` 设置为 0，而不评估 `e2`。我们通过 `JumpIfZero` 指令来实现：如果 `v1` 为 0，我们直接跳转到 `false_label`，然后使用\
  \ `Copy` 指令将 `result` 设置为 0。（为了可读性，我将其写成 `result = 0` 而不是 `Copy(0)`。在后的内容中我也会对 TACKY\
  \ 采取类似的处理。）如果 `v1` 不是 0，我们仍然需要评估 `e2`。我们处理 `v2` 为 0 的情况与处理 `v1` 为 0 的情况完全，通过 `JumpIfZero`\
  \ 跳转到 `false_label`。只有当 `e1` 和 `e2` 都不零时，我们才会到达 `Copy` 指令 `result = 1`，因此我们将 `result\
  \ = 0` 设置到 `end` 标签。\n\n留给你自己将 `||` 操作转换为 TACKY。生成的 TACKY 将类似于列表 4-6，但它将使用 `JumpIfNotZero`\
  \ 指令而不是 `JumpIfZero`。剩下的就是 `!` 和所有的关系运算；你可以按照在前面的章节中添加一元和二元运算的方法，将它们转换为 TACKY。\n\
  \n#### 生成标签\n\n标签和临时变量一样，必须全局唯一：如果标签 `foo` 出现在多个处，那么像 `Jump(\"foo\")` 这样的指令就是没用的。你可以通过在标签中引入全局计数器来确保它们的唯一性，就像你在第\
  \ 2 章 中处理变量名那样。\n\n与临时变量不同，标签将出现在最终汇汇程序中，因此它们必须是汇编器认为语法上有效的标识符。它们应该只包含字母、数字、点和下划线。选择描述性的标签可以使你的汇编程序更易阅读和调试。例如，你可以使用字符串\
  \ `and_falseN` 作为列表 4-6 中的 `false_label`，其中 `N` 是全局计数器的当前值。\n\n\n\n\n\n在开始汇编生成阶段之前，让我们先讨论一下需要的新汇编指令。首先，我们将讨论\
  \ `cmp` 指令，它用于比较两个值；以及 `conditional set`（条件设置）指令，它根据比较结果将一个字节设置为 1 或 0。我们将使用这些指令来实现像\
  \ `<` 这样的关系运算符。接下来，我们将讨论条件跳转和无条件跳转指令。\n\n## 比较与状态标志\n\n所有条件跳转指令所依赖的“条件”是 `RFLAGS`\
  \ 寄存器的状态。与我们目前看到的 `EAX`、`RSP` 以及其他寄存器不同，我们通常无法直接设置 `RFLAGS`。相反，CPU 在每次发出指令时都会自动更新\
  \ `RFLAGS`。正如其名所示，该寄存器中的每一位都是一个标志，用于报告有关最后一条指令的某些或 CPU 的状态。不同的指令更新不同的标志：`add`、`sub`\
  \ 和 `cmp` 指令会更新我们在本节中将提到的所有标志，而 `mov` 指令不会更新其中任何一个。我们现在可以忽略其他指令的影响。在讨论 `RFLAGS`\
  \ 时，每当我提到“最后一条指令”或“最后结果”，指的就是影响我正在讨论的特定标志的最后一条指令。\n\n目前，我们关注其中的三个标志：\n\n### 零标志\
  \ (ZF)\n\n如果最后一条指令的结果为 0，则 `ZF` 被设置为 1。如果最后一条指令的结果为非 0，则 `ZF` 被设置为 0。\n\n### 符号标志\
  \ (SF)\n\n如果最后一条结果的最高位为 1，则 `SF` 被设置为 1。如果该结果的最高位为 0，则 `SF` 被设置为 0。记住，在补码中，负数的最高位始终是\
  \ 1，正数的最高位始终是 0。因此，符号标志告诉我们最后一条指令的结果是正还是负。（如果最后一条结果应该被解释为无符号整数，那么它就不可能是负的，因此符号标志是没有意义的。）\n\
  \n### 溢出标志 (OF)\n\n如果最后一条指令导致符号整数溢出，则 `OF` 被设置为 1，否则设置为 0。当符号整数操作的结果无法在可用的位数中表示时，就会发生`整数溢出`。当正结果大于该类型所能容纳的最大值时，就会发生溢出。假设我们正在处理\
  \ 4 位整数。我们能表示的最大符号数是 7，即二进制的 `0111`。如果我们用 `add` 指令对它加 1，结果是 `1000`。如果我们将其解释为无符号整数，它的值是\
  \ 8；但如果我们将其解释为补码符号整数，它的值就是 –8。该计算结果本应该是正数，但由于发生了溢出，它看起来是负数。此次计算将溢出标志设置为 1。\n\n我们在相反的情况下也会遇到整数溢出：当结果本应该是负的，但它低于最小可能的值。例如，在普通数学中，–8\
  \ – 1 = –9。但如果我们使用 `sub` 指令从 –8 的 4 位补码表示（即 `1000`）中减 1，得到 `0111`，即 7。在这种情况下，溢出标志也被设置为\
  \ 1。\n\n无符号结果也可能太大或太小，以至于其类型无法表示，但我不会在书中将其称为整数溢出。相反，我会说结果发生了`wrapped around`（回绕），这与\
  \ C 标准以及大多数 x64 汇编讨论中无符号操作的术语更为一致。我做出区分是因为在 C 标准中，无符号回绕的规则与符号整数溢出不同，CPU 检测它的方式也不同。你将在第二部分学习如何处理无符号回绕。与\
  \ `SF`一样，如果结果是无符号的，`OF` 没有意义。\n\n表 4-2 和 4-3 总结了各种整数溢出可能的情况。表 4-2 描述了加法的结果。\n\n\
  表 4-2：加法的溢出与下溢\n| a + b | b > 0 | b < 0 |\n| :--- | :--- | :--- |\n| --- | --- |\
  \ --- |\n| a > 0 | 负数溢出 | 无 |\n| a < 0 | 无 | 负数溢出 |\n\n表 4-3 描述了减法的结果；由于 `a - b`\
  \ 和 `b - a` 等效，它只是交换了列的表 4-2。\n\n表 4-3：减法的溢出与下溢\n| a - b | b > 0 | b < 0 |\n| :---\
  \ | :--- | :--- |\n| --- | --- | --- |\n| a > 0 | 无 | 正数溢出 |\n| a < 0 | 正数溢出 | 无\
  \ |\n\n指令 `cmp b, a` 计算 `a - b`，与 `sub` 指令完全相同，对 `RFLAGS` 的影响也相同，但它丢弃结果而不是将其存储在\
  \ `a` 中。当你只想通过减去两个数来比较而不想覆盖 `a` 时，这更加方便。\n\n让我们看看指令 `cmp b, a` 执行之后 `ZF` 和 `SF`\
  \ 的值：\n\n*   如果 `a == b`，则 `a - b` 为 0，因此 `ZF` 为 1，`SF` 为 0。\n*   如果 `a > b`，则 `a\
  \ - b` 为正数，因此 `SF` 和 `ZF` 均为 0。\n*   如果 `a < b`，则 `a - b` 为负数，因此 `SF` 为 1，`ZF` 为\
  \ 0。\n\n\n\n\n\n通过执行 `cmp` 指令并检查 `ZF` 和 `SF`，你可以处理本章中实现的每种比较。但等等！事实并非完全如此，因为 `a\
  \ - b` 可能会溢出，从而翻转 `SF`。让我们考虑这如何影响每种情况：\n\n* 如果 `a == b`，则 `a - b` 不溢出，因为结果为 0。\n\
  * 如果 `a > b`，当 `a` 为正数且 `b` 为负数时，`a - b` 可能会溢出。在这种情况下，正确的结果正数，但如果溢出，结果将变为负数。在这种情况下，`SF`\
  \ 将为 1，`OF` 也是如此。\n* 如果 `a < b`，当 `a` 为负数且 `b` 为正数时，`a - b` 可能会溢出。在这种情况下，正确的结果负数，但实际结果将是正数。这意味着\
  \ `SF` 将为 0，但 `OF` 为 1。\n\n表 4-4 给出了我们考虑的每种情况下的这些标志位的值。\n\n**表 4-4：** `cmp` 指令对状态标志的影响\n\
  \n| | `ZF` | `OF` | `SF` |\n| --- | --- | --- | --- |\n| `a == b` | 1 | 0 | 0 |\n\
  | `a > b, no overflow` | 0 | 0 | 0 |\n| `a > b, overflow` | 0 | 1 | 1 |\n| `a <\
  \ b, no overflow` | 0 | 0 | 1 |\n| `a < b, overflow` | 0 | 1 | 0 |\n\n你可以通过检查 `SF`\
  \ 和 `OF` 是否相同来判断 `a` 或 `b` 较大。如果它们相同，我们知道 `a >= b`。它们可能都是 0，因为我们得到了一个正数（或 0）结果且没有溢出；或者都是\
  \ 1，因为我们得到了一个很大的正数结果并溢出直到变成负数。如果 `SF` 和 `OF` 不同，我们知道 `a < b`。要么我们得到了没有溢出的负数结果，要么我们得到了溢出变成正数的负数结果。\n\
  \n现在你已经理解了如何设置 `ZF`、`OF` 和 `SF`，让我们来看一些依赖于这些标志的指令。\n\n### 条件设置指令\n\n为了实现关系运算符，我们首先使用\
  \ `cmp` 指令设置一些标志，然后根据这些标志设置表达式的结果。我们通过条件设置指令执行这第二步。每条条件设置指令都接受一个单寄存器或内存地址作为操作数，并根据\
  \ `RFLAGS` 的状态将其设置为 0 或 1。所有的条件设置指令都是完全相同的，只是它们测试的条件不同。表 4-5 列出了我们在本章中需要的条件设置指令。\n\
  \n**表 4-5：** 条件设置指令\n\n| 指令 | 含义 | 标志 |\n| --- | --- | --- |\n| `sete` | 如果 `a ==\
  \ b` 则设置字节 | `ZF` |\n| `setne` | 如果 `a != b` 则设置字节 | `ZF` 未设置 |\n| `setg` | 如果 `a\
  \ > b` 则设置字节 | `ZF` 未设置且 `SF == OF` |\n| `setge` | 如果 `a >= b` 则设置字节 | `SF == OF`\
  \ |\n| `setl` | 如果 `a < b` 则设置字节 | `SF != OF` |\n| `setle` | 如果 `a <= b` 则设置字节 |\
  \ `ZF` 设置或 `SF != OF` |\n\n与我们目前看到的其他指令不同，条件设置指令仅接受 1 字节的操作数。例如，`sete %eax` 不是一个有效指令，因为\
  \ `EAX` 是一个 4 字节寄存器。然而，指令 `sete %al` 是有效的；它设置 `AL` 寄存器，即 `EAX` 的最低字节。要条件地将整个 `EAX`\
  \ 寄存器设置为 0 或 1，你需要在设置 `AL` 之前清零 `EAX`，因为条件设置指令不会清除它的高字节。例如，如果 `EAX` 为\n\n```\n11111111111111111111111111111011\n\
  ```\n\n并且运行\n\n```\nmovl $2, %edx\ncmpl $1, %edx\nsete %al\n```\n\n那么 `EAX` 中的新值为\n\
  \n```\n11111111111111111111111100000000\n```\n\n\n\n\n当然，它不是 0。`sete` 指令清零了 `EAX`\
  \ 的最后一个字节，但没有清零其余部分。\n\n如果它的操作数是一个内存地址，条件设置指令将更新该地址处的单个字节。注意，取决于上下文，内存地址可以是 1 字节、4\
  \ 字节或 8 字节的操作数。在 `sete -4(%rbp)` 中，操作数 `-4(%rbp)` 表示 `RBP – 4` 处的单字节内存；在 `addl $1,\
  \ -4(%rbp)` 中，它表示从 `RBP – 4` 开始的 4 字节内存。\n\n### 跳转指令\n\n`jmp` 汇编指令接受标签（label）作为参数并执行到该标签的无条件跳转。跳转指令操作另一个特殊寄存器\
  \ `RIP`，它始终持有要执行的下一条指令的地址（IP 代表 *instruction pointer*，即指令指针）。为了执行一系列指令，CPU 会执行*取指-执行周期*：\n\
  \n1. 从 `RIP` 中的内存地址取一条指令并将其存储在一个特殊的*指令寄存器*中。（这个寄存器没有名称，因为你无法在汇编中引用它。）\n2. 增加 `RIP`\
  \ 以指向下一条指令。由于 x64 中的指令长度并不完全相同，因此 CPU 必须检查刚刚取出的指令长度，并按相应的字节数增加 `RIP`。\n3. 运行指令寄存器中的指令。\n\
  4. 重复。\n\n通常，遵循这些步骤会按照指令在内存中出现的顺序执行。但 `jmp` 会在 `RIP` 中放入一个新值，从而改变 CPU 下一条执行的指令。汇编器和链接器会将跳转指令中的标签转换为*相对偏移量*，告诉程序需要增加或减少\
  \ `RIP` 多少。考虑列表 4-7 中的汇编代码片段。\n\n```\n addl    $1, %eax\n    jmp     foo\n    movl\
  \    $0, %eax\nfoo:\n    ret\n```\n\n列表 4-7：带有 `jmp` 指令的汇编代码片段\n\n`movl $0, %eax`\
  \ 的机器指令长度为 5 字节。为了跳过它并执行 `ret` 指令，`jmp` 需要额外增加 5 字节的 `RIP`。因此，汇编器和链接器将 `jmp foo`\
  \ 转换为 `jmp 5` 的机器指令。然后当 CPU 执行这条指令时，它：\n\n1. 取指令 `jmp 5` 并将其存储在指令寄存器中。\n2. 增加 `RIP`\
  \ 以指向下一条指令 `movl $0, %eax`。\n3. 执行 `jmp 5`。这为 `RIP` 增加了 5 字节，使其指向 `ret`。\n4. 取 `RIP`\
  \ 指向的指令 `ret`，并从那里继续取指-执行周期。\n\n注意，标签不是指令：CPU 不执行它们，它们也不会出现在最终可执行文件的文本段中（包含机器指令的段）。\n\
  \n*条件跳转*接受标签作为参数，但只有在条件成立时才跳转到该标签。条件跳转与条件设置指令非常相似；它们依赖于相同的条件，使用 `RFLAGS` 中相同的标志。例如，列表\
  \ 4-8 中的汇编代码在 `EAX` 和 `EDX` 寄存器相等时返回 3，否则返回 0。\n\n```\n cmpl    %eax, %edx\n   \
  \ je\n    movl    $0, %eax\n    ret\nret:\n    movl    $3, %eax\n    ret\n```\n\n\
  列表 4-8：带有条件跳转的汇编片段\n\n如果 EAX 和 EDX 中的值相等，`cmpl` 将 `ZF` 设置为 1，因此 `je` 跳转到 `ret`。然后执行\
  \ `je` 之后的指令，因此函数返回 3。如果 `EAX` 和 `EDX` 不相等，`je` 不执行跳转，因此函数返回 0。还有检查其他条件的跳转指令，但我们不需要它们。\n\
  \n### 汇编生成\n\n现在你已经理解了这些新指令，让我们扩展汇编 AST 并更新每个生成阶段。列表 4-9 定义了最新的 AST，其中包含了比较操作。\n\
  \n```\nprogram = Program(function_definition)\nfunction_definition = Function(name,\
  \ instruction)\ninstruction = Mov(operand, operand)\n            | Unary(operator,\
  \ operand)\n            | Binary(operator, operand, operand)\n            | Cmp(operand,\
  \ operand)\n            | Idiv(operand)\n            | Jmp(identifier)\n       \
  \     | JmpCC(cond_code, identifier)\n            | SetCC(cond_code, operand)\n\
  \            | Label(identifier)\n            | Ret\nunary_operator = Neg | Not\n\
  binary_operator = Add | Sub | Mult\noperand = Imm(int) | Reg(reg) | Pseudo(identifier)\
  \ | Stack(int)\ncond_code = E | NE | G | LE\n```\n\n由于条件跳转指令具有相同的的形式，我们使用单个 `JmpCC`\
  \ 指令来表示它们，并使用不同的条件代码进行区分。我们对条件设置指令也是这样做。在此阶段，我们将标签视为指令，尽管 `Label` 实际上并不是指令，因为标签不被\
  \ CPU 执行。\n\n为了实现 TACKY 的 `JumpIfZero` 和 `JumpIfNotZero` 指令，我们使用新的 `JmpCC` 汇编指令。我们将\n\
  \n```\nJumpIfZero(val, target)\n```\n\n转换为\n\n```\nCmp(Imm(0), val)\nJmpCC(E, target)\n\
  ```\n\n我们以相同的方式实现 `JumpIfNotZero`，但条件代码使用 `NE` 代替 `E`。\n\n同样，我们使用条件设置指令来实现所有的关系运算符。例如，TACKY\
  \ 指令\n\n```\nBinary(GreaterThan, src1, src2, dst)\n```\n\n变为：\n\n```\nCmp(src2,\
  \ src1)\nMov(Imm(0), dst)\nSetCC(G, dst)\n```\n\n\n\n\n\n对于所有其他关系运算符，请将 `G` 替换为相应的条件代码。记住在执行条件设置指令之前将目标操作数零，因为它只设置最低字节。在\
  \ `cmp` 指令之后直接执行 `mov` 是安全的，因为 `mov` 不会改变 `RFLAGS`。一个潜在的问题是 `SetCC` 需要一个 1 字节的操作数，而\
  \ `dst` 是 4 字节；幸运的是，我们可以在代码发射阶段的处理中考虑到这一点。如果 `dst` 是内存中的一个位置，`SetCC` 会设置该位置的第一个字节，这正是我们想要的行为。（因为\
  \ x64 处理器是小端序的，第一个字节是最低位，因此将该字节设为 1 就会将整个 32 位的值设置为 1。）如果 `dst` 是一个寄存器，我们在代码发射期间发射\
  \ `SetCC` 时，将使用对应的 1 字节寄存器名称。汇编 AST 中的寄存器与大小无关，因此目前无论我们是将 `dst` 用作 4 字节还是 1 字节的操作数，其表示方式都是相同的。\n\
  \n由于 `!x` 等同于 `x == 0`，我们还用条件设置指令实现了一元运算符 `!`。我们将 TACKY 指令\n\n```\nUnary(Not, src,\
  \ dst)\n```\n\n转换为：\n\n```\nCmp(Imm(0), src)\nMov(Imm(0), dst)\nSetCC(E, dst)\n\
  ```\n\n剩余的 TACKY 指令——`Jump`、`Label` 和 `Copy` 很容易处理。TACKY `Jump` 变成汇编 `Jmp`，`Label`\
  \ 变成 `Label`，而 `Copy` 变成 `Mov`。表 4-6 和表 4-7 总结了如何将每个新的 TACKY 结构转换为汇编。注意，这些表格仅包含新结构，与第\
  \ 2 章和第 3 章中的对应表格不同。\n\n表 4-6 显示了如何将新的 `Copy`、`Label` 以及条件和无条件跳转指令转换为汇编，以及带有新 `Not`\
  \ 运算符的 `Unary` 指令和带有新关系运算符的 `Binary` 指令。\n\n**表 4-6：** 将 TACKY 指令转换为汇编\n\n| TACKY\
  \ 指令 | 汇编指令 |\n| --- | --- |\n| `Unary(Not, src, dst)` | `Cmp(Imm(0), src)` `Mov(Imm(0),\
  \ dst)` `SetCC(E, dst)` |\n| `Binary(relational_operator, src1, src2, dst)` | `Cmp(src2,\
  \ src1)` `Mov(Imm(0), dst)` `SetCC(relational_operator, dst)` |\n| `Jump(target)`\
  \ | `Jmp(target)` |\n| `JumpZero(condition, target)` | `Cmp(Imm(0), condition)`\
  \ `JmpCC(E, target)` |\n| `JumpIfNotZero(condition, target)` | `Cmp(Imm(0), condition)`\
  \ `JmpCC(NE, target)` |\n| `Copy(src, dst)` | `Mov(src, dst)` |\n| `Label(identifier)`\
  \ | `Label(identifier)` |\n\n表 4-7 给出了 TACKY 中每个关系运算符对应的条件代码。\n\n**表 4-7：** 将 TACKY\
  \ 比较转换为汇编\n\n| TACKY 比较 | 汇编条件代码 |\n| --- | --- |\n| `Equal` | `E` |\n| `NotEqual`\
  \ | `NE` |\n| `LessThan` | `L` |\n| `LessOrEqual` | `LE` |\n| `GreaterThan` | `G`\
  \ |\n| `GreaterOrEqual` | `GE` |\n\n从现在起，描述每章从 TACKY 到汇编转换的表格将只与上一章相比的变化。附录 B 包含了两组表格，提供了从\
  \ TACKY 到汇编的完整转换：一组显示了第一部分 结束时的转换，另一组显示了第二部分 结束时的转换。\n\n### 替换伪寄存器\n\n更新此阶段，将新的\
  \ `Cmp` 和 `SetCC` 指令使用的任何伪寄存器替换为栈地址，就像你对所有其他指令执行的那样。\n\n### 修复 cmp 指令\n\n`cmp` 指令与\
  \ `mov`、`add` 和 `sub` 一样，不能两个操作数都使用内存地址。我们以通常的方式重写它，将\n\n```\ncmpl -4(%rbp), -8(%rbp)\n\
  ```\n\n转换为\n\n```\nmovl -4(%rbp), %r10d\ncmpl %r10d, -8(%rbp)\n```\n\n\n\n\n`cmp`\
  \ 指令的第二个操作数不能是常数。如果你记得 `cmp` 的形式与 `sub` 相同，这种设计就很合理了：`sub`、`add` 或 `imul` 指令的第二个操作数也不能是常数，因为该操作数用于存储结果。尽管\
  \ `cmp` 不产生结果，相同的规则仍然适用。我们将重写写：\n\n```\ncmpl    %eax, $5\n```\n\n改为：\n\n```\nmovl\
  \    $5, %r11d\ncmpl    %eax, %r11d\n```\n\n遵循上一章的约定，我们使用 `R10` 来固定 `cmp` 指令的第一个操作数，使用\
  \ `R11` 来固定它的第二个操作数。\n\n### 代码发射\n\n我们已经生成了一个有效的汇编程序，并准备好发射它了。在本章中，代码发射要稍微复杂一些，原因有两个。首先，我们正在同时处理\
  \ 1 字节和 4 字节寄存器。我们将根据寄存器是出现在取 1 字节操作数的条件设置指令，还是出现在我们为止遇到的其他任何 4 字节操作数指令中，打印不同的寄存器名称。\n\
  \n第二个问题是发射标签。某些汇编标签是由编译器自动生成的，而另一些——函数名——是用户定义的标识符。目前，唯一的函数名是 `main`，但最终我们将编译具有任意函数名的程序。由于标签必须是唯一的，自动生成的标签不能与程序中可能出现的任何函数名冲突。\n\
  \n我们将通过为自动生成的标签添加特殊的*本地标签*前缀来避免冲突。本地标签前缀在 Linux 上是 `.L`，在 macOS 上是 `L`。在 Linux 上，这些标签不会与用户定义的标识符冲突，因为\
  \ C 语言中的标识符不能包含点。在 macOS 上，它们也不会冲突，因为我们在所有用户定义的名称前都加上了下划线（例如 `main` 变成 `_main`）。\n\
  \n本地标签还有另一个用处：当你需要调试这段代码时，它们不会误导 GDB 或 LLDB。汇编器将大多数标签放在目标文件的符号表中，但会忽略任何以本地标签前缀开头的标签。如果你的自动生成标签在符号表中，GDB\
  \ 和 LLDB 会将它们误认为是函数名，这会导致在你尝试反汇编函数或查看堆栈跟踪时出现问题。\n\n除了这两个问题外，代码发射是非常直接的。表 4-8 到表\
  \ 4-10 总结了此阶段的变化。从现在起，代码发射表将只显示与上一章相比的变化，类似于描述从 TACKY 到汇编转换的表格。请参附录 B 获取代码发射阶段的完整概述；它包含了三组表格，展示了该阶段在第一部分、第二部分和第三部分结束时的样子。表\
  \ 4-8 显示了如何打印本章的新指令。它本地标签使用 `.L` 前缀；如果你在 macOS 上，请使用不带点的 `L` 前缀。\n\n#### 表 4-8：指令格式化\n\
  \n| 汇编指令 | 输出 |\n| :--- | :--- |\n| `Cmp(operand, operand)` | `cmpl %operand, %operand`\
  \ |\n| `Jmp(label)` | `jmp .L<label>` |\n| `JmpCC(cond_code, label)` | `jmp<cond_code>\
  \ .L<label>` |\n| `SetCC(cond_code, operand)` | `set<cond_code> %operand` |\n| `Label(label)`\
  \ | `.L<label>:` |\n\n`cmp` 指令带有 `l` 后缀，表示它操作的是 4 字节值。条件设置指令不带指示操作数大小的后缀，因为它们支持\
  \ 1 字节操作数。跳转和标签也不使用操作数后缀，因为它们不接受操作数。然而，条件跳转和设置指令确实需要后缀来指示它们测试的内容。表 4-9 给出了每个条件代码对应的后缀。\n\
  \n#### 表 4-9：条件代码的指令后缀\n\n| 条件代码 | 指令后缀 |\n| :--- | :--- |\n| `E` | `e` |\n| `NE`\
  \ | `ne` |\n| `L` | `l` |\n| `LE` | `le` |\n| `G` | `g` |\n| `GE` | `ge` |\n\n最后，表\
  \ 4-10 给出了每个寄存器的 1 字节和 4 字节别名。4 字节别名与上一章相同；新的 1 字节别名已加粗。\n\n#### 表 4-10：汇编操作数格式化\n\
  \n| 汇编操作数 | 输出 |\n| :--- | :--- |\n| `Reg(AX)` | 4-字节 `%eax` |\n| | 1-字节 `%al` |\n\
  | `Reg(DX)` | 4-字节 `%edx` |\n| | 1-字节 `%dl` |\n| `Reg(R10)` | 4-字节 `%r10d` |\n|\
  \ | 1-字节 `%r10b` |\n| `Reg(R11)` | 4-字节 `%r11d` |\n\n\n\n\n\n| 1-byte | `%r11b`\
  \ |\n\n当寄存器出现在 `SetCC` 中时输出其 1 字节名称，在其他任何地方输出 4 字节名称。\n\n### 总结\n\n你的编译器现在可以处理关系运算符和逻辑运算符了。在本章中，你为\
  \ TACKY 添加了条件跳转以支持短路运算符，并学习了若干条新的汇编指令。你还学习了 CPU 如何跟踪当前指令并记录比较结果。你在本章中引入的新 TACKY\
  \ 和汇编指令最终将帮助你实现如 `if` 语句和循环等复杂的控制结构。首先，你将实现 C 语言最核心的功能之一：变量！\n\n### 额外资源\n\n关于未定义行为（undefined\
  \ behavior）的更多深入讨论，请参考这些博客文章：\n\n*   John Regehr 写的《C 和 C++ 未定义行为指南，第 1 部分》对 C 标准中未定义行为的含义以及它如何影响编译器设计提供了很好的概述\
  \ ([https://blog.regehr.org/archives/213])。\n\n*   Raph Levien 写的《有了未定义行为，一切皆皆可能》探讨了\
  \ C 语言未定义行为的一些来源以及它们最初进入标准的历史 ([https://raphlinus.github.io/programming/rust/2018/08/17/undefined-behavior.html])。\n\
  \n![](img/pg92.jpg)\n\n## 描述\n\n## 5 局部变量\n\n![](img/opener-img.jpg)\n\n目前，你只能编译返回常量表达式的程序。在本章中，你将实现局部变量，这将让你能够编译更有趣的程序。你的编译器需要支持更具表达能力的语法，以便解析声明、赋值和引用变量的\
  \ C 程序。它还需要处理变量被错误声明和错误使用的情况。为了捕获这些潜在错误，你将添加一个*语义分析*阶段，该阶段在本章开始的图中被加粗显示。此阶段会验证变量是否在同一作用域内被多次声明，或在声明之前被使用。它还会为每个变量分配一个唯一的标识符，允许你在\
  \ TACKY 中安全地引用它。\n\n幸运的是，你编译器中的 TACKY 和汇编 IR 已经支持变量，因为它们使用临时变量来存储中间结果。这意味着在生成 TACKY\
  \ 之后，你不需要对编译器进行任何更改。在跳转到编译遍历之前，让我们先定义我们需要支持的语言特性。\n\n### 变量、声明与赋值\n\n为了让变量产生起实际作用，我们需要实现一些新的语言特性。首先，我们需要支持变量*声明*。C\
  \ 语言中的每个局部变量在使用之前都必须声明。变量声明由变量的类型、名称以及一个可选的表达式（称为*初始化器*）组成，用于指定初始值。这是一个带有初始化器的声明：\n\
  \n```\nint a = 2 * 3;\n```\n\n这是一个不带初始化器的声明：\n\n```\nint b;\n```\n\n其次，我们必须支持在表达式中使用变量的值，例如\
  \ `b + 1`。就像整数常量一样，变量本身是一个完整的表达式，也可以出现在更复杂的逻辑和算术表达式中。\n\n最后，我们需要支持变量*赋值*。在 C 语言中，你使用赋值运算符（=`）来更新变量。C\
  \ 中的变量赋值是一个表达式，类似于加法、减法等。这意味着它会求出一个结果，你可以将该结果用于 `return` 语句或较大表达式的一部分。赋值的结果是目标变量更新后的值。例如，表达式\
  \ `a = 2 * 5` 的结果为 10。首先，你将 `5` 赋值给变量 `a`，然后将 `a` 的新值乘以 2。由于赋值是一个表达式，你可以在像 `a =\
  \ b = c` 这样的表达式中同时进行多次赋值。与目前看到的二元操作不同，赋值是右结合的，因此 `a = b = c` 等同于 `a = (b = c)`。要计算这个表达式，你首先执行赋值\
  \ `b = c`。然后将该表达式的结果（即 `b` 的新值）赋值给 `a`。\n\n变量赋值是我们遇到的第一个具有*副作用*的表达式。这意味着它不仅仅是归约为一个值，还会对执行环境产生某些影响。在\
  \ `2 * (a = 5)` 中，子表达式 `a = 5` 有一个值（`5`），同时还有一个副作用（更新 `a`）。\n\n\n\n\n\n一个操作只有在它所属的语言结构之外可见时，才被视为副作用。例如，更新局部变量是赋值表达式的副作用，因为该变量的新值在赋值表达式之外是可见的。但它*不是*包含该赋值表达式的函数的副作用，因为该效果在函数之外是不可可见的。相反，更新全局变量既是该表达式的副作用，也是该函数的副作用。\n\
  \n由于我们正在实现带有副作用的表达式，因此增加对*表达式语句*（expression statements）的支持也是合理的，这种语句求值表达式但不使用其结果。给变量赋值的语句，例如：\n\
  \n```\nfoo = 3 * 3;\n```\n\n都属于表达式语句。这个表达式的副作用是将值 `9` 赋值给 `foo`。整个表达式的结果也是值 `9`，但这个结果没有被在任何地方使用；只有更新\
  \ `foo` 的副作用会影响程序。\n\n你也可以拥有完全没有副作用的表达式语句：\n\n```\n1 + a * 2;\n```\n\n你通常看不到没有副作用的表达式语句，因为它们完全没有用处，但它们在语法上是完全有效的。\n\
  \n任何表达式都可以出现在 `=` 运算符的右侧，但只有某些表达式可以出现在左侧。给变量、数组元素和结构体成员赋值是有意义的：\n\n```\nx = 3;\n\
  array[2] = 100;\nmy_struct.member = x * 2;\n```\n\n但给常量或逻辑或算术表达式的结果赋值是没有意义的：\n\n\
  ```\n4 = 5;\nfoo && bar = 6;\na - 5 = b;\n```\n\n出现在赋值左侧的表达式被称为*左值*（lvalues）。在本章中，我们处理的唯一左值是变量。你将在第二部分中学习更复杂的左值。\n\
  \n现在你已经理解在本章中将添加的语言特性，让我们扩展编译器吧。\n\n### 词法分析器 (Lexer)\n\n你将在本章添加一个新的标记：\n\n`=` 等号，赋值运算符\n\
  \n你不需要新的标记来表示变量名。词法分析器已经识别标识符，例如函数名 `main`，而变量名只是标识符。在解析阶段之前，我们不会区分函数名和变量名。\n\n\
  ### 解析器 (Parser)\n\n一如往常，我们将更新 AST 和语法法以支持本章的新语言结构。我们还将更新优先级提升代码，以正确解析赋值表达式。\n\n\
  #### 更新后的 AST 和语法法\n\n让我们从扩展 AST 定义开始，以支持变量的使用、声明和赋值。为了支持在表达式中使用变量，我们将为 `exp` AST\
  \ 节点添加一个 `Var` 构造函数。由于变量赋值也是一种表达式，我们也要为 `exp` 添加一个 `Assignment` 构造函数。列表 5-1 显示了\
  \ `exp` 的更新定义。\n\n```\nexp = Constant(int)\n    | Var(identifier)\n    | Unary(unary_operator,\
  \ exp)\n    | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n```\n\
  \n*列表 5-1：`exp` AST 节点的定义，包括 `Var` 和 `Assignment`*\n\n`Var` 节点持有名称。`Assignment`\
  \ 节点由两部分组成：被更新的左值和它被赋值的表达式。在语义分析期间，我们将确保该表达式是一个有效的左值。接下来，我们将扩展 `statement` AST 节点以支持空语句。我们将添加一个\
  \ `Expression(exp)` 构造函数，它接受一个 `exp` 节点作为参数。我们还会添加一个 `Null` 构造函数来表示*空语句*，即：\n\n\
  ```\nstatement = Return(exp) | Expression(exp) | Null\n```\n\n*列表 5-2：C 标准中的空语句示例*\n\
  \n在这个示例中，`while` 循环通过遍历每个字符来寻找空字符串的结尾。循环体不需要执行任何操作，因为所有工作都发生在控制表达式中；完全省略循环体语法上是无效的。\n\
  \n```\nchar *s;\n/* ... */\nwhile (*s++ != '\\0')\n  ;\n```\n\n我们还需要一个 AST 节点来表示变量声明：\n\
  \n```\ndeclaration = Declaration(identifier name, exp? init)\n```\n\n声明由一个名称和一个可选的初始化器组成。（`exp?`\
  \ 中的问号意味着该字段是可选的。）我们将在第二部分中为声明包含类型信息，但目前不需要，因为 `int` 是唯一的类型。\n\n声明是一个独立的 AST 节点，而不是另一种`statement`，因为声明不是语句！从概念上说，区别在于语句在程序运行时执行，而声明仅仅是告诉编译器某个标识符存在并在稍后可以使用。\n\
  \n\n\n\n\n听到 `if` 体是一个单一语句可能会让你感到惊讶，因为 `if` 体看起来像是一系列语句和声明，如式所示：\n\n```\nif (a ==\
  \ 2) {\n    int x = 0;\n    return x;\n}\n```\n\n但包裹在括号中的语句和声明列表实际上是一个单一语句，被称为*复合语句*（compound\
  \ statement）。我们将在第 7 章中实现复合语句；目前，关键点是我们需要在 AST 中区分语句和声明。\n\n最后，我们需要改变定义函数体的方式，以便能够解析包含多个声明和语句的函数，例如列表\
  \ 5-3。\n\n```\nint main(void) {\n    int a;\n    a = 2;\n    return a * 2;\n}\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 5-3：一个包含一个声明和多个语句的程序</samp>\n\
  \n到目前为止，我们将函数体定义为单个语句：\n\n```\nfunction_definition = Function(identifier name, statement\
  \ body)\n```\n\n但现在，我们需要将其定义为语句和声明的列表，它们统称为*块项*（block items）。我们将添加一个新的 AST 节点来表示块项：\n\
  \n```\nblock_item = S(statement) | D(declaration)\n```\n\n然后我们就可以将函数体表示为块项的列表：\n\
  \n```\nfunction_definition = Function(identifier name, block_item* body)\n```\n\n\
  这里的星号表示 `body` 是列表。综合来看，列表 5-4 显示了新的 AST 定义，其中本章添加的内容已用粗体标记。\n\n```\nprogram = Program(function_definition)\n\
  function_definition = Function(identifier name, block_item* body)\nblock_item =\
  \ S(statement) | D(declaration)\ndeclaration = Declaration(identifier name, exp?\
  \ init)\nstatement = Return(exp) | Expression(exp) | Null\nexp = Constant(int)\n\
  \    | Var(identifier)\n    | Unary(unary_operator, exp)\n    | Binary(binary_operator,\
  \ exp, exp)\n    | Assignment(exp, exp)\nunary_operator = Complement | Negate |\
  \ Not\nbinary_operator = Add | Subtract | Multiply | Divide | Remainder | And |\
  \ Or\n                | Equal | NotEqual | LessThan | LessOrEqual\n            \
  \    | GreaterThan | GreaterOrEqual\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 5-4：带有变量、赋值表达式和表达式语句的抽象语法树</samp>\n\n列表 5-5 显示了更新后的语法。\n\n```\n<program> ::=\
  \ <function>\n<function> ::= \"int\" <identifier> \"(\" \"void\" \")\" \"{\" {<block-item>}\
  \ \"}\"\n<block-item> ::= <statement> | <declaration>\n<declaration> ::= \"int\"\
  \ <identifier> [\"=\" <exp>] \";\"\n<statement> ::= \"return\" <exp> \";\" | <exp>\
  \ \";\" | \";\"\n<exp> ::= <factor> | <exp> <binop> <exp>\n<factor> ::= <int> |\
  \ <identifier> | <unop> <factor> | \"(\" <exp> \")\"\n<unop> ::= \"-\" | \"~\" |\
  \ \"!\"\n<binop> ::= \"-\" | \"+\" | \"*\" | \"/\" | \"%\" | \"&&\" | \"||\"\n \
  \         | \"==\" | \"!=\" | \"<\" | \"<=\" | \">\" | \">=\" | \"=\"\n<identifier>\
  \ ::= ? An identifier token ?\n<int> ::= ? A constant token ?\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 5-5：带有变量、赋值表达式和表达式语句的语法</samp>\n\n列表 5-5\
  \ 引入了两个新的 EBNF 符号表示。将符号序列包裹在花括号中表示它可以被重复零次或多次，因此 `{<block-item}` 表示 `<block-item>`\
  \ 符号列表。请注意未引号花括号（表示重复）与带引号花括号（表示字面量 `{` 和 `}` 标记）之间的区别。在 `<function>` 的规则中，表达式 `\"\
  {\" {<block-item>} \"}\"` 表示一个 `{` 标记，然后是一个 `<block-item>` 符号列表，最后是一个 `}` 标记。列表\
  \ 5-6 中的伪代码展示了如何解析函数定义中的块项列表。\n\n```\nparse_function_definition(tokens):\n    //\
  \ 像以前一样解析左括号之前的所有内容...\n    --snip--\n    function_body = []\n    while peek(tokens)\
  \ != \"}\":\n        next_block_item = parse_block_item(tokens)\n        function_body.append(next_block_item)\n\
  \    take_token(tokens)\n    return Function(name, function_body)\n```\n\n<samp\
  \ class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 5-6：解析块项列表</samp>\n\n你继续解析块项，直到看到右括号，右括号表示函数体的结束。然后你可以从从输入流中移除该括号并完成对函数定义的处理。\n\
  \n正如花括号在 EBNF 表示中表示重复一样，将符号序列包裹在方括号中表示它是可选的。我们用 `[\" <exp>]` 表示声明中的可选初始化。为了处理这种可选结构，你的解析器应该检查标识符后面跟着的是\
  \ `=` 标记（表示初始化存在）还是 `;` 标记（表示初始化不存在）。\n\n在解析 `<block-item>` 时，你需要一种方法判断当前块项是语句还是声明。为了做到，查看第一个标记；如果是\
  \ `int` 关键字，它就是声明，否则它是语句。\n\n列表 5-5 还包含一个 `<factor>` 符号的新产生式，对应于新的 `Var` 构造函数，以及一个新的二元运算符。尽管我们没有使用\
  \ `Binary` AST 节点来表示变量赋值，但它与语法中的任何其他二运算符相同。这让我们可以使用已经实现的优先级提升算法来解析变量赋值，尽管这需要一些微调。\n\
  \n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\">优先级提升算法</samp>\n\
  \n使用当前的优先级提升代码解析赋值表达式只有一个问题：赋值运算符是右关联的，但我们的代码只能处理左关联运算符。为了忘记原因，让我们再次查看优先级提升伪代码。我们在列表\
  \ 3-7 中见过该算法的完整版本；此处复现为 列表 5-7。\n\n```\nparse_exp(tokens, min_prec):\n    left =\
  \ parse_factor(tokens)\n    next_token = peek(tokens)\n    while next_token is a\
  \ binary operator and precedence(next_token) >= min_prec:\n        operator = parse_binop(tokens)\n\
  \        right = parse_exp(tokens, ❶ precedence(next_token) + 1)\n        left =\
  \ Binary(operator, left, right)\n        next_token = peek(tokens)\n    return left\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 5-7：使用优先级提升解析左关联运算符</samp>\n\
  \n\n\n\n\n当我们对 `parse_exp` 进行递归调用时，我们将最小优先级设置为比当前运算符的优先级更高 ❶。因此，如果 `next_token`\
  \ 是 `+` 且 `tokens` 为 `b + 4`，那么对 `parse_exp` 的递归调用将只返回 `b`，因为 `+` 不满足最小优先级。这就是我们如何获得左结合表达式如\
  \ `(left + b) + 4` 的的。\n\n然而，如果 `next_token` 是右结合的，那么当我们在 `parse_exp` 的递归调用中遇到相同的标记时，不应该停止而应该将其包含在右侧表达式中。为了做到这一点，我们需要将右侧的最小优先级设置为当前标记的优先级相等。换句话说，在处理像\
  \ `=` 这样的右结合标记时，递归调用应该是：\n\n```\nright = parse_exp(tokens, precedence(next_token))\n\
  ```\n\n假设你正在解析 `a = b = c`。你将把左侧解析为因子 `a`，然后递归调用 `parse_exp` 来处理 `b = c`。如果此递归调用中的最小优先级是\
  \ `precedence(\"=\") + 1`，它将只会解析下一个因子 `b`。但如果最小优先级是 `precedence(\"=\")`，它将解析整个赋值语句，返回\
  \ `b = c` 作为表达式的右侧。最终结果将是 `a = (b = c)`，这正是我们想要的结果。\n\n解析变量赋值与其他二元表达式之间的唯一区别是，我们需要构建一个\
  \ `Assignment` AST 节点而不是 `Binary` 节点。列表 5-8 给出了带有这些调整的优先级提升算法伪代码。\n\n```\nparse_exp(tokens,\
  \ min_prec):\n    left = parse_factor(tokens)\n    next_token = peek(tokens)\n \
  \   while next_token is binary operator and precedence(next_token) >= min_prec:\n\
  \        if next_token is \"=\":\n            take_token(tokens) // remove \"=\"\
  \ from tokens\n            right = parse_exp(tokens, precedence(next_token))\n \
  \           left = Assignment(left, right)\n        else:\n            operator\
  \ = parse_binop(tokens)\n            right = parse_exp(tokens, precedence(next_token)\
  \ + 1)\n            left = Binary(left, operator, right)\n        next_token = peek(tokens)\n\
  \    return left\n```\n\n### 扩展的提升算法\n\n最后，我们需要将 `=` 添加到我们的优先级表中。表 5-1 列出了我用于所有运算符的优先级值，其中新运算符已加粗。它的优先级比我们目前为止实现的任何运算符都低。\n\
  \n表 5-1：二元运算符的优先级\n\n| 运算符 | 优先级 |\n| --- | --- |\n| `*` | 50 |\n| `/` | 50 |\n\
  | `%` | 50 |\n| `+` | 45 |\n| `-` | 45 |\n| `<` | 35 |\n| `<=` | 35 |\n| `>` | 35\
  \ |\n| `=` | 35 |\n| `==` | 30 |\n| `!=` | 30 |\n| `&&` | 10 |\n| `||` | 5 |\n|\
  \ `=` | 1 |\n\n到此时，你已经知道如何为本章中遇到的每个程序构建有效的 AST；你已经准备好更新解析器并对其测试了。\n\n## 语义分析\n\n\
  到目前为止，我们唯一关注的错误是语法错误。如果我们能解析程序，我们就知道剩下的编译阶段将会成功。现在，一个程序在语法上可能是正确的，但在*语义*上是无效的；换句话说，它可能根本不通。例如，程序可能会给一个不可赋值的表达式赋值值：\n\
  \n```\n2 = a * 3; // ERROR: 不能给常量赋值\n```\n\n或者，它可能会在同一个作用域内重复声明同一个变量：\n\n```\nint\
  \ a = 3;\nint a; // ERROR: a 已经声明过了！\n```\n\n或者它可能会在变量声明之前尝试使用它：\n\n```\nint main(void)\
  \ {\n    a = 4; // ERROR: a 尚未声明！\n    return a;\n}\n```\n\n所有这些示例都使用了有效的语法，但如果你尝试编译它们，应该会得到一个错误。语义分析阶段会检测此类错误。该阶段最终将包含几个不同的阶段，用于验证程序的不同方面。在本章中，我们将添加第一个语义分析阶段，*变量解析*。\n\
  \n\n\n\n变量解析阶段（variable resolution pass）将跟踪程序范围内哪些变量在作用范围内，并通过查找对应的声明来解析每个变量引用。如果程序多次声明同一个变量，或使用了未声明的变量，它将报告错误。它还将每个局部变量重命名为一个全局唯一的标识符。例如，它可能会将程序：\n\
  \n```\nint main(void) {\n    int a = 4;\n    int b = a + 1;\n    a = b - 5;\n  \
  \  return a + b;\n}\n```\n\n转换为类似这样的：\n\n```\nint main(void) {\n    int a0 = 4;\n\
  \    int b1 = a0 + 1;\n    a0 = b1 - 5;\n    return a0 + b1;\n}\n```\n\n（当然，此阶段实际上转换的是\
  \ AST 而不是源文件，但我将这些示例作为 C 源代码呈现，是为了提高它们的可读性。）\n\n这种转换看起来可能没帮助——变量名 `a` 和 `b` 已经是唯一的——但一旦我们引入多个变量作用域，它将是至关重要的，因为不同作用域中的不同变量可以具有相同的名称。例如，我们可能会转换程序：\n\
  \n```\nint main(void) {\n    int a = 2;\n    if (a < 5) {\n        int a = 7;\n\
  \        return a;\n    }\n    return a;\n}\n```\n\n转换为：\n\n```\nint main(void)\
  \ {\n    int a0 = 2;\n    if (a0 < 5) {\n        int a1 = 7;\n        return a1;\n\
  \    }\n    return a0;\n}\n```\n\n这清楚地表明 `a0` 和 `a1` 是两个不同的变量，这将简化后续的编译器阶段。\n\n\
  ### 变量解析\n\n现在我们将编写变量解析阶段。在此阶段中，我们将构建一个从用户定义的变量名到我们在后续阶段将使用的唯一名称的映射。我们将按顺序处理块项，在处理过程中检查错误并替换变量名。当我们遇到变量声明时，我们将添加新条目，将该变量名映射到我们生成的唯一名称。然后，当我们看到使用变量的表达式时，我们将变量名替换为映射中的对应唯一名称。Listing\
  \ 5-9 中的伪代码演示了如何解析变量声明。\n\n```\nresolve_declaration(Declaration(name, init), variable_map):\n\
  \  ❶ if name is in variable_map:\n        fail(\"Duplicate variable declaration!\"\
  )\n    unique_name = make_temporary()\n  ❷ variable_map.add(name, unique_name)\n\
  \  ❸ if init is not null:\n        init = resolve_exp(init, variable_map)\n  ❹ return\
  \ Declaration(unique_name, init)\n```\n\nListing 5-9: 解析变量声明*\n\n首先，我们检查正在声明的变量是否已经存在于变量映射中\
  \ ❶。如果是，意味着它在函数早些时候声明过了，因此这是一个重复声明。在这种情况下，我们抛出一个错误。接下来，我们在变量映射中将用户定义的变量名与自动生成的唯一名称关联起来\
  \ ❷。\n\n在更新变量映射后，我们处理声明初始化器（如果有的话 ❸）。对 `resolve_exp` 的调用返回一个初始化器的新副本，其中任何变量都已重命名，如果初始化器使用了未声明的变量，则抛出错误。最后，我们返回\
  \ `Declaration` 节点的副本 ❹，它使用新的自动生成名称而不是旧的用户定义名称，以及我们从 `resolve_exp` 获得的新初始化器。\n\n\
  你在 `resolve_declaration` 中生成的标识符不能与临时 TACKY 变量的名称冲突。如果你使用全局计数器来生成唯一标识符，请在语义分析和 TACKY\
  \ 生成阶段使用同一个计数器。\n\n这些标识符也可能与函数或全局变量的名称冲突。（在第 10 章 中，你会看到全局变量像函数一样保留原始名称，而不是像局部变量那样被重命名。）你可以依靠通常的技巧，生成在\
  \ C 语法上无效的标识符。我建议在自动生成的名称中包含变量的原始名称以帮助调试；例如，你可能会将 `a` 重命名为 `a.0`。\n\n> **注意**：你可能注意到上一节中的示例使用了如\
  \ `a` 和 `b` 这样语法上有效的标识符。在实践中它们可能会与函数名冲突。\n\n解析 `return` 语句或表达式，我们只需要处理内部表达式，如 Listing\
  \ 5-10 所示。\n\n```\nresolve_statement(statement, variable_map):\n    match statement\
  \ with\n    | Return(e) -> return Return(resolve_exp(e))\n    | Expression(e) ->\
  \ return Expression(resolve_exp(e))\n    | Null -> return Null\n```\n\nListing 5-10:\
  \ 解析语句*\n\n当我们解析表达式时，我们检查所有的变量使用和赋值都是有效的。Listing 5-11 演示了如何这样做。\n\n```\nresolve_exp(e,\
  \ variable_map):\n    match e with\n    | Assignment(left, right) ->\n        if\
  \ left is not Var:\n            fail(\"Invalid lvalue!\")\n        return Assignment(❶\
  \ resolve_exp(left, variable_map), ❷ resolve_exp(right, variable_map))\n    | Var(v)\
  \ ->\n        if v is in variable_map:\n            return Var(❸ variable_map.get(v))\n\
  \        else:\n            fail(\"Undeclared variable!\")\n    | --snip--\n```\n\
  \nListing 5-11: 解析表达式*\n\n\n\n\n\n为了测试新的编译通过（pass），你将为编译器驱动程序添加一个 `--validate` 命令行选项。该选项应该让你的编译器运行语义分析阶段，并在生成\
  \ TACKY 之前停止。在随后的章节中，在你更新了语义分析阶段以包含多个阶段后，此选项将引导你的编译器运行所有阶段。\n\n与现有的运行编译器到特定阶段的选项一样，这个新选项不应该产生任何输出文件。按照惯例，如果编译成功，它应该返回退出代码\
  \ 0；如果失败，则返回非零退出代码。\n\n### TACKY 生成\n\n在本章中，我们完全不需要修改 TACKY IR。我们已经可以使用 TACKY 的\
  \ `Var` 构造函数来引用变量，并使用 `Copy` 指令为它们赋值。TACKY IR 不包含变量声明，因为它不需要。我们已经在语义分析期间从变量声明中获取了所需的所有信息，现在可以丢弃它们了。\n\
  \n尽管 TACKY 本身不需要改变，但 TACKY 生成阶段需要改变：我们需要扩展这个阶段以处理 AST 中最新添加的内容。首先，我们将处理在本章中添加的两种新表达式。接下来，我们将处理\
  \ AST 的其他添加内容，包括表达式语句和声明。\n\n### 变量和赋值表达式\n\n我们将 AST 中的每个 `Var` 转换为 TACKY 中的 `Var`，并保持相同的标识符。由于标识符是自动生成的，我们可以保证它不会与\
  \ TACKY 程序中的任何其他标识符发生标识符冲突。为了处理 `Assignment` AST 节点，我们将发出用于评估右侧的指令，然后发出一个 `Copy`\
  \ 指令将结果复制到左侧。列表 5-12 显示了如何处理这两种表达式。\n\n```\nemit_tacky(e, instructions):\n    match\
  \ e with\n    | --snip--\n    | Var(v) -> return Var(v)\n    | Assignment(Var(v),\
  \ rhs) ->\n        result = emit_tacky(rhs, instructions)\n        instructions.append(Copy(result,\
  \ Var(v)))\n        return Var(v)\n```\n\n*代码列表 5-12：将变量和赋值表达式转换为 TACKY*\n\n这是处理变量赋值的一种低效方法；我们通常最终会评估右侧，将结果存储在临时变量中，然后将其复制到变量\
  \ `v`，而不是直接将结果存储在 `v` 中并避免临时变量。我们在第三部分 中实现的优化将移除其中一些多余的复制。\n\n### 声明、语句和函数体\n\n\
  现在我们将处理声明。正如我之前提到的，我们可以在此阶段放弃变量声明；在 TACKY 中，你不需要在使用变量之前对其进行声明。但我们确实需要生成 TACKY 来*初始化*变量。如果声明包含初始化器，我们将像处理普通变量赋值一样处理它。如果声明没有初始化器，我们根本不会生成任何\
  \ TACKY。\n\n我们还需要处理表达式语句和空语句。要将表达式语句转换为 TACKY，我们只需处理内部表达式。这将返回一个持有表达式结果的新临时变量，但我们在生成\
  \ TACKY 期间不会再次使用该变量。对于空语句，我们不会发出任何 TACKY 指令。\n\n最后，我们将处理函数包含多个块项而不是单个语句的情况。我们将按顺序处理函数体中的块项，为每个项生成\
  \ TACKY。假设我们正在编译列表 5-13 中的 C 函数。\n\n```\nint main(void) {\n    int b;\n    int a\
  \ = 10 + 1;\n    b = a * 2;\n    return b;\n}\n```\n\n*代码列表 5-13：带有变量声明和赋值表达式的 C\
  \ 函数*\n\n假设在变量解析期间，将 `a` 和 `b` 重命名为 `a.1` 和 `b.0`，并且我们使用 `tmp.n` 方案作为临时变量，其中 `n`\
  \ 是计数器的值。然后，我们将为体生成 TACKY。此列表与上一章中的列表 4-6 一样，使用 `dst = src` 表示 `Copy(src, dst)`。同样，它使用\
  \ `dst = src1 + src2` 表示 `Binary(src1, src2)`。\n\n```\ntmp.2 = 10 + 1\na.1 = tmp.2\n\
  tmp.3 = a.1 * 2\nb.0 = tmp.3\nReturn(b.0)\n```\n\n*代码列表 5-14：在 TACKY 中实现列表 5-13\
  \ (#chapter5.xhtml_list5-13)*\n\n我们不会为列表 5-13 中 `b` 的声明生成任何 TACKY，因为它不包含初始化器。我们将\
  \ `a` 的声明转换为列表 5-14 中的前两条指令，它们计算 `10 + 1` 并将结果复制到 `a`。我们将表达式语句 `b = a * 2;` 转换为接两条指令，并将\
  \ `return` 语句转换为最后的 `Return` 指令。\n\n到此时，你已经知道如何将整个 AST 转换为 TACKY。但我们还没有完全结束；还有一个最后一个需要考虑的边界情况。\n\
  \n#### 无返回语句的函数\n\n\n\n\n\n由于我们的 AST 现在支持多种类型的语句，我们可能会遇到没有 `return` 语句的函数，例如列表 5-15。\n\
  \n```\nint main(void) {\n    int a = 4;\n    a = 0;\n}\n```\n列表 5-15: 一个没有 `return`\
  \ 语句的 `main` 函数\n\n如果调用这个函数会发生什么？C 标准对 `main` 给出了一个答案，而对任何其他函数给出了不同的答案。（我忽略了返回类型为\
  \ `void` 的函数，因为它们不返回值，而且我们还没有实现它们。）第 5.1.2.2.3 节规定，“到达终止 `main` 函数的 } 返回值 0”，因此列表\
  \ 5-15 中的代码等价于列表 5-16。\n\n```\nint main(void) {\n    int a = 4;\n    a = 0;\n  \
  \  return 0;\n}\n```\n列表 5-16: 一个返回 `0` 的 `main` 函数\n\n其他函数的情况要复杂得多。根据第 6.9.1 节第\
  \ 12 段，“除非另有规定，如果到达终止函数的 } 并且调用者使用了函数调的值，则其行为是未定义的。”这隐式地涵盖了两种可能。在第一种情况下（如列表 5-17\
  \ {\n    printf(\"I'm living on the edge, baby!\");\n    // no return statement\n\
  }\n\nint main(void) {\n    return foo(); // 尝试使用 foo 的返回值\n}\n```\n列表 5-17: 在函数没有返回任何内容时尝试使用其返回值\n\
  \n这将导致未定义行为，意味着一切皆不可预测；标准不保证会发生什么情况。在第二种情况下（如列表 5-18 {\n    printf(\"I'm living\
  \ on the edge, baby!\");\n    // no return statement\n}\n\nint main(void) {\n  \
  \  foo();\n    return 0;\n}\n```\n列表 5-18: 调用函数但不使用其返回值\n\n这个程序中没有未定义行为；它保证会打印 `I'm\
  \ living on the edge, baby!` 然后以状态码 0 退出。当我们编译一个像 `foo` 这样的函数时，我们不知道它的任何调用者是否使用了它的返回值，因此我们必须假设它是像列表\
  \ 5-18 这样的程序的一部分。特别是，我们需要在 `foo` 结束时恢复调用者的栈帧并将控制交回调用者。因为我们没有返回任何特定的值，可以将 `EAX` 设置为我们喜欢的任何值，或者根本不设置。\n\
  \n处理这两种情况最简单的方法是在每个函数体末尾添加一条额外的 TACKY 指令 `Return(Constant(0))`。这为 `main` 函数以及像列表\
  \ 5-18 这样的程序提供了正确的行为。如果一个函数已经以 `return` 语句结束，这条额外的指令将永远不会执行，因此它不会改变。一旦你扩展了 TACKY，你将学会如何在不需要时消除这个额外的\
  \ `Return`。\n\n\n\n\n这一章在几个方面都具有里程碑意义：你添加了一种新的语句类型，并实现了你的第一个具有副作用的语言结构。你还实现了一个语义分析阶段，以捕获你编译的程序中新类型的错误。在随后的章节中，你将继续扩展语义分析阶段，以检测更多错误，并收集后续编译所需的额外信息。接下来，你将实现你的第一个控制流结构：`if`\
  \ 语句和条件表达式。\n\n![](img/pg117.jpg)\n\n描述\n\n## 6 IF 语句和条件表达式\n\n![](img/opener-img.jpg)\n\
  \n在上一章中，你学习了如何编译执行语句列表的程序。但大多数 C 程序具有更复杂的执行路径；它们通常需要根据程序的当前状态在运行时决定执行哪些语句。程序执行语句的顺序就是其控制流，而允许你改变程序控制流的语言结构被称为控制结构。\n\
  \n在本章中，你将实现你的第一个控制结构：`if` 语句。你还将实现条件表达式。像 `if` 语句一样，条件表达式允许你控制运行哪些代码。例如，条件表达式 `(a\
  \ == 0) ? 3 : 4` 在 `a` 等于 `0` 时求值为 3，否则求值为 4。我们在第 4 章中实现短路运算符 `&&` 和 `||` 时，已经为\
  \ `if` 语句和条件表达式奠定了大量基础。我们已经有了可以让我们条件运行或跳过代码的 TACKY 结构，因此不需要更改 TACKY 生成后的任何阶段。让我们开始吧！\n\
  \n### 词法分析器\n\n你将在本章中添加四个标记（tokens）：\n\n| `if` | 表示 `if` 语句开始的关键字 |\n| --- | ---\
  \ |\n| `else` | 表示 `if` 语句中 `else` 子句开始的关键字 |\n| `?` | 问号，条件表达式中第一个和第二个操作数之间的分隔符\
  \ |\n| `:` | 冒号，条件表达式中第二个和第三个操作数之间的分隔符 |\n\n一旦词法分析器支持了这四个标记，你就可以对其进行测试了。\n\n###\
  \ 解析器\n\n现在我们将更新解析器以支持 `if` 语句和条件表达式。由于这是两种截然不同的语言结构，我们将逐一处理它们，从 `if` 语句开始。\n\n\
  ### 解析 if 语句\n\n我们将从扩展 `statement` AST 节点开始支持 `if` 语句。列表 6-1 给出了该节点的更新定义。\n\n```\n\
  statement = Return(exp)\n          | Expression(exp)\n          | If(exp condition,\
  \ statement? else)\n          | Null\n```\n列表 6-1：`statement` AST 节点的定义，包含 `if`\
  \ 语句\n\n新的 `If` 构造函数接受三个参数。`condition` 表达式（有时称为控制表达式）决定了语句体是否执行。`then` 语句是 `if`\
  \ 语句的第一个子句，当 `condition` 的结果非零时执行。第二个子句 `else` 语句是可选的。如果存在，则在 `condition` 的结果为 0\
  \ 时执行。\n\n正如我在上一章中提到的，`if` 语句中的每个子句本身都是一个单一的语句。尽管它看起来像是多条语句，但像[列表 6-2] 这样的 `if`\
  \ 语句体实际上是一个单一的语句。\n\n```\nif (a == 3) {\n    a = a + 1;\n    int b = a * 4;\n  \
  \  return a && b;\n}\n```\n列表 6-2：一个体为复合语句的 `if` 语句\n\n我们还没有实现复合语句，因此此时还无法编译像[列表\
  \ 6-2]那样的代码。列表 6-3 出了一个我们可以编译的 `if` 语句示例。\n\n```\nif (a == 3)\n    return a;\nelse\n\
  \    b = 8;\n```\n列表 6-3：不包含任何复合语句的 `if` 语句\n\n我们还可以编译嵌套在其他 `if` 语句中的 `if` 语句，如[列表\
  \ 6-4]。\n\n```\nif (a)\n    if (a > 10)\n        return a;\n    else\n        return\
  \ 10 - a;\n```\n列表 6-4：嵌套在另一个 `if` 语句中的 `if` 语句\n\n注意，列表 6-1 中的 AST 定义没有 `else if`\
  \ 结构，因为一个 `if` 语句最多有一个 `else` 子句。`else if` 子句实际上只是包含另一个 `if` 语句的 `else` 子句。以列表 6-5\
  \ 为例。\n\n\n\n\n```c\nif (a > 100)\n    return 0;\nelse if (a > 50)\n    return 1;\n\
  else\n    return 2;\n```\n\n列表 6-5：嵌套在 else 子句中的 if 语句\n\n让我们重新格式化代码，以更好地反映它如何被解析：\n\
  \n```\nif (a > 100)\n    return 0;\nelse\n    if (a > 50)\n        return 1;\n \
  \   else\n        return 2;\n```\n\n列表 6-5 的 AST 如下：\n\n```\nIf(\n    condition=Binary(GreaterThan,\
  \ Var(\"a\"), Constant(100)),\n    then=Return(Constant(0)),\n    else=If(\n   \
  \     condition=Binary(GreaterThan, Var(\"a\"), Constant(50)),\n        then=Return(Constant(1)),\n\
  \        else=Return(Constant(2))\n    )\n)\n```\n\n列表 6-6 显示了语法的变化，这些变化与 AST 的变化完全对应。\n\
  \n```\n<statement> ::= \"return\" <exp> \";\"\n              | <exp> \";\"\n   \
  \           | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n    \
  \          | \";\"\n```\n\n列表 6-6：语句的语法规则，包括 if 语句\n\n我们可以使用简单的递归下降解析来处理这个新的产生式规则。有趣的是，这条规则是有歧义的，但这种歧义不会为我们的解析器带来任何问题。让我们再次查看列表\
  \ 6-4：\n\n```\nif (a)\n    if (a > 10)\n        return a;\n    else\n        return\
  \ 10 - a;\n```\n\n解析此列表有两种方法，且它们都遵循我们新的语法规则：我们可以将 `else` 子句与第一个或第二个 `if` 语句成组。换句话说，我们可以这样解析这个列表：\n\
  \n```\nif (a) {\n    if (a > 10)\n        return a;\n    else\n        return 10\
  \ - a;\n}\n```\n\n或者我们可以这样解析：\n\n```\nif (a) {\n    if (a > 10)\n        return\
  \ a;\n}\nelse\n    return 10 - a;\n```\n\nC 标准明确了这些选项中的第一个是正确的；`else` 子句应该始终与最近的\
  \ `if` 语句成组。然而，语法本身并没有告诉我们应该选择哪一个选项。这种语法的特性被称为*悬空 else*（dangling else）冲突，它可能会为自动将形式语法转换为解析代码的解析器生成带来麻烦。\n\
  \n幸运的是，悬空 else 歧义对于像我们这样手写的递归下降解析器来说并不是问题。每当我们解析一个 `if` 语句时，我们会在语句体之后寻找 `else` 关键字；如果找到了，我们就继续解析\
  \ `else` 子句。在像列表 6-4 这样的情况下，这意味着我们会将 `else` 子句解析为内部 `if` 语句的一部分，这是正确的行为。\n\n现在去实现这个产生式规则吧；然后我们将移动到条件表达式。\n\
  \n### 解析条件表达式\n\n条件运算符 `?:` 是一个*三元*运算符，它接受三个操作数。在列表 6-7 中，我们将此运算符添加到 `exp` AST 节点中。\n\
  \n```\nexp = Constant(int)\n    | Var(identifier)\n    | Unary(unary_operator, exp)\n\
  \    | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp,\
  \ exp, exp)\n```\n\n列表 6-7：`exp` AST 节点的定义，包括条件表达式\n\n在列表 6-8 中，我们将其添加到 `exp` 语法规则中。\n\
  \n```\n<exp> ::= <factor> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n\
  ```\n\n列表 6-8 现在我们需要确定它的优先级和结合性。三元表达式的优先级和结合性如何运作并不直而易见。秘诀在于将其视为二元表达式，其中中间的运算符是\
  \ `?:`。这个“运算符”很容易解析，因为它被 `?` 和 `:` 标记隔开；它只是恰好包含了一个整个子表达式。（在解析过程中你应该这样考虑，而不是在后续阶段。我们可以像解析二元表达式一样*解析*它，但我们会对其进行完全*求值*！）这允许我们定义条件运算符相对于其他二元运算符的优先级：它的优先级高于赋值运算符，低于其他所有运算符。例如，表达式\
  \ `a = 1 ? 2 : 3` 解析为：\n\n```\na = (1 ? 2 : 3)\n```\n\n但 `a || b ? 2 : 3` 解析为：\n\
  \n```\n(a || b) ? 2 : 3\n```\n\n相同的逻辑适用于第三个操作数。我们将 `1 ? 2 : 3 || 4` 解析为：\n\n```\n\
  1 ? 2 : (3 || 4)\n```\n\n但我们将 `1 ? 2 : a = 5` 解析为：\n\n```\n(1 ? 2 : a) = 5\n```\n\
  \n语义分析阶段将拒绝最后一个表达式，因为 `1 ? 2 : a` 不是一个有效的左值（lvalue）。然而，在 `?` 和 `:` 标记之间可以出现任何表达式，甚至是赋值表达式。这些标记的作用就像括号一样，界定了表达式的开始和结束。因此，条件表达式\
  \ `x ? x = 1 : 2` 等同于：\n\n```\nx ? (x = 1) : 2\n```\n\n当一个条件表达式嵌套在另一个条件表达式中时，逻辑同样适用，这意味着\
  \ `a ? b ? 1 : 2 : 3` 解析为：\n\n```\na ? (b ? 1 : 2) : 3\n```\n\n接下来，让我们看看结合性。条件运算符是右结合的，所以\
  \ `a ? 1 : b ? 2 : 3` 解析为：\n\n```\na ? 1 : (b ? 2 : 3)\n```\n\n由于条件表达式可以像奇怪的二元表达式一样被解析，我们（几乎）可以使用有的优先级爬升代码来处理它们。首先，我们将\
  \ `?` 添加到优先级表中；表 6-1 列出了我们所有的优先级值。\n\n表 6-1：二元和三元运算符的优先级值\n\n| 运算符 | 优先级 |\n| ---\
  \ | --- |\n| `*` | 50 |\n| `/` | 50 |\n| `%` | 50 |\n| `+` | 45 |\n\n\n\n\n\n|运算符\
  \ | 优先级 |\n| :--- | :--- |\n| `-` | 45 |\n| `<` | 35 |\n| `<=` | 35 |\n| `>` | 35\
  \ |\n| `=` | 35 |\n| `==` | 30 |\n| `!=` | 30 |\n| `&&` | 10 |\n| `||` | 5 |\n|\
  \ `?` | 3 |\n| `=` | 1 |\n\n在优先级提升（precedence climbing）期间，我们只查看 `? <exp> :` “运算符”的第一个标记，因此\
  \ `?` 进入了表格而 `:` 则没有。\n\n接下来，我们将再次更新优先级提升的代码。在上一章中，我们将赋值处理为一种特殊情况，以便对它使用 `Assignment`\
  \ AST 节点。现在，我们也将把条件表达式也视为一种特殊情况。列表 6-9 显示了更新后的优先级提升伪代码。与该算法的上一个版本（见列表 5-8）相比，更改部分已**加粗**。\n\
  \n```\nparse_exp(tokens, min_prec):\n    left = parse_factor(tokens)\n    next_token\
  \ = peek(tokens)\n    while next_token is a binary operator and precedence(next_token)\
  \ >= min_prec:\n        if next_token is \"=\":\n            take_token(tokens)\
  \ // remove \"=\" from list of tokens\n            right = parse_exp(tokens, precedence(next_token))\n\
  \            left = Assignment(left, right)\n        else if next_token is \"?\"\
  :\n            middle = parse_conditional_middle(tokens)\n            right = parse_exp(tokens,\
  \ precedence(next_token))\n            left = Conditional(left, middle, right)\n\
  \        else:\n            operator = parse_binop(tokens)\n            right =\
  \ parse_exp(tokens, precedence(next_token) + 1)\n            left = Binary(operator,\
  \ left, right)\n        next_token = peek(tokens)\n    return left\n```\n\n列表 6-9：支持条件表达式的优先级提升\n\
  \n`parse_conditional_middle` 函数（我在这里没有包含它的代码）应该只消耗 `?` 标记，然后解析一个表达式（将最小优先级重置为 0），然后消耗\
  \ `:` 标记。接下来，我们按照解析任何其他表达式的右侧的方式解析第三个操作数：通过递归调用 `parse_exp`。由于条件运算符像赋值一样是右结合，我们将递归调用中的最小优先级设置为\
  \ `precedence(next_token)`，而不是 `precedence(next_token) + 1`。最后，我们根据三个操作数构建 `Conditional`\
  \ AST 节点。\n\n列表 6-10 提供了完整的 AST，其中对 `if` 语句的更改已**加粗**。这些与我们之前引入的更改相同。\n\n```\nprogram\
  \ = function\nfunction = int \"void\" {block_item}\nblock_item = statement | declaration\n\
  declaration = int identifier =\nstatement = return exp | exp | if (exp) statement\
  \ [else statement]\nexp = factor | exp binaryop exp | exp ? exp : exp\nfactor =\
  \ int | identifier | unary (exp)\nunary = ~ | !\nbinaryop = - | * | / | % | && |\
  \ || | == | != | < | <= | > | >=\n```\n\n列表 6-11：包含条件表达式和 `if` 语句的语法\n\n\n\n\n\n\
  形如 `if (condition) then `statement` 的语句应翻译为 Listing 6-12 中的 TACKY。\n\n```\n<instructions\
  \ for condition>\nc = <result of condition>\nJumpIfZero(c, end)\n<instructions for\
  \ statement>\nLabel(end)\n```\n\n#### Listing 6-12：`if` 语句的 TACKY\n\n就是这样！首先，我们评估控制表达式\
  \ `condition`。如果结果为 0，我们跳转到整个 `if` 语句的末尾。否则，我们执行 `statement` 的指令。如果该语句还包含 `else`\
  \ 子句，生成的 TACKY 只会稍微复杂一点点。语句 `if (condition) then `statement1` else `statement2`\
  \ 翻译为 Listing 6-13 中的 TACKY。\n\n``````\n<instructions for condition>\nc = <result\
  \ of condition>\nJumpIfZero(c, else_label)\n<instructions for statement1>\nJump(end)\n\
  Label(else_label)\n<instructions for statement2>\nLabel(end)\n```\n\n#### Listing\
  \ 6-13：带有 `else` 子句的 `if` 语句的 TACKY\n\n与 Listing 6-12 一样，我们评估控制表达式，如果结果为 0 则执行条件跳转。在这种情况下，我们不是跳转到\
  \ `if` 语句的末尾，而是跳转到 `else_label`，然后执行 `statement2`。如果控制表达式评估为非零值，我们执行 `statement1`，然后跳转到整个语句的末尾。我们可以以类似的方式处理条件表达式；我们接下来将查看这些。\n\
  \n#### 将条件表达式转换为 TACKY\n\n对于条件表达式（例如短路表达式），C 标准对哪些子表达式被执行以及何时执行提供了保证。要评估表达式 `condition\
  \ ? clause1 : clause2`，你必须先评估 `condition`，然后根据 `condition` 的结果评估 `clause1` 或 `clause2`。例如，你不能同时评估两个子句，然后再评估\
  \ `condition` 来决定使用哪个结果，因为这可能会产生意想不到的副作用。结果是，我们处理条件表达式的方式与 `if` 语句非常相似。唯一的区别是表达式与语句不同，它会产生一个我们需要存储在正确目标位置的结果。表达式\
  \ `condition ? clause1 : clause2` 将产生以下 TACKY：\n\n```\n<instructions for condition>\n\
  c = <result of condition>\nJumpIfZero(c, else_label)\n<instructions for statement1>\n\
  Jump(end)\nLabel(else_label)\n<instructions for statement2>\nLabel(end)\n```\n\n\
  #### 额外加分：标签语句与 goto\n\n现在你已经有了一些添加新类型语句的练习，你可以选择实现 `goto` —— 这个每个人都爱又恨的语句。你还需要添加对标签语句的支持，以便\
  \ `goto` 有地方可以去。你可以在不改变 TACKY 生成阶段之后的任何内容的情况下实现这两个者点；但是，你需要检测少数错误情况，例如在两个标签语句中使用相同的标签。我建议编写一个新的语义分析器来捕获这些错误，而不是尝试在变量解析阶段捕获它们。\n\
  \n要测试此功能，请运行带有 `--goto` 标志的测试脚本：\n\n```\n$ ./test_compiler /path/to/your_compiler\
  \ --chapter 6 --goto\n```\n\n如果你在之前的章节中也实现了额外加分功能，你可以通过使用 `--extra-credit` 标志一次性测试所有功能。\n\
  \n#### 总结\n\n你刚刚实现了你的第一个控制结构！你在早期章节中的所有工作都开始产生回报了。你为了支持 `&&` 和 `||` 而添加的基础 TACKY\
  \ 指令让你能够轻松实现本章中更复杂的功能。你还基于之前学到的解析技术，扩展了你的优先级提升（precedence climbing）代码以处理三元运算符。但你能编译的\
  \ `if` 语句种类仍然有限；你不能在 `if` 语句体中声明变量或执行更长的代码块。在下一章中，你将通过添加对复合语句的支持消除这些限制。最令人兴奋的变化将出现在语义分析阶段，你将学习如何处理嵌套作用域。\n\
  \n![](img/pg130.jpg)\n\n\n\n\n\n## 7 复合语句\n\n在本章中，你将实现复合语句。复合语句有两个重要的用途。正如你在前两个章节中所看到的，它们将其他语句和声明组合分组为一个单一单元，该单元可以出现在更大的结构中，例如\
  \ `if` 语句。更有趣的是，它们还划定了函数内部不同的*作用域*（scopes）。变量的作用域是程序中可以使用该变量的部分；当你在复合语句内部声明一个变量时，它的作用域仅会延伸到该语句的结束。\n\
  \n我们将在本章花一点时间扩展解析器，以便我们可以将块项组合在一起，但我们的主要任务是扩展变量解析传递，以跟踪每个变量的作用域。我们几乎不会改变 TACKY 生成阶段，完全不会触碰词法分析器或汇编生成阶段。在开始编写解析器之前，我将快速概述\
  \ C 语言作用域的工作原理，并定义一些在本章后面用到的术语。\n\n### 作用域的秘密\n\n包含声明并决定这些声明作用域的语言结构被称为`块`（block）。复合语句和函数体都是块。循环也是，我们将在第\
  \ 8 章实现循环。（从技术上讲，`if` 语句也是，但这对我们的实现来说并不重要。）局部变量的作用域从该变量声明的地方开始。这意味着变量的作用域可以从块的中间开始。它的作用域一直延伸到它所声明的块的结束。例如，在程序中\n\
  \n```c\nint main(void) {\n    int a ❶ = 5;\n    return a; ❷\n}\n```\n\n变量 `a` 的作用域从它的初始化器\
  \ ❶ 之前开始，并一直延伸到函数的末尾 ❷。\n\n复合语句可以单独出现，也可以出现在另一个语句内部。在列表 7-1 中，我们使用复合语句作为 `if` 语句的体。\n\
  \n```c\nint main(void) {\n    if (1) {\n        int a ❶ = 2;\n        return a +\
  \ 1;\n  ❷}\n    return 0;\n}\n```\n列表 7-1：使用复合语句作为 if 语句体\n\n在这个示例中，变量 `a` 的作用域从\
  \ ❶ 运行到复合语句的结束 ❷。\n\n当你进入一个新的新块时，你仍然可以使用来自层作用域的变量，正如这段代码片段所示：\n\n```c\nint a = 2;\n\
  {\n    int b = a + 2;\n}\n```\n\n尽管 `a` 在外层作用域中声明，但我们可以在内层作用域中初始化 `b` 时引用它。因此，我们将\
  \ `b` 初始化为 `4`。但让我们看看列表 7-2 中发生了什么，我们在内部块中声明了另一个名为 `a` 的变量。\n\n```c\n❶ int a = 2;\n\
  {\n  ❷ int a = 3;\n    int b = a + 2;\n}\n```\n列表 7-2：声明两个同名但作用域不同的变量\n\n这一次，当我们初始化\
  \ `b` 时，有两个名为 `a` 的不同变量在作用域内：在外层作用域中声明的 ❶ 和在内层作用域中声明的 ❷。在这种情况下，我们总是使用在最内层作用域中声明的变量。结果是将\
  \ `b` 初始化为 `5`。即使外层的 `a` 仍在作用域内，我们也无法访问它；它被内层的变量*隐藏*（hidden）或*遮蔽*（shadowed）了。\n\n\
  隐藏与超出作用域不同，因为隐藏的变量在程序的稍后可能会再次变得可见。列表 7-3 与列表 7-2 几乎相同，它说明了这种区别。\n\n```c\n❶ int a\
  \ = 2;\n{\n  ❷ int a = 3;\n    int b = a + 2;\n}\n❸ return a;\n```\n列表 7-3：一个隐藏的变量\n\
  \n正如我们在上一个示例所示，`a` 的第一个声明 ❶ 被第二个 ❷ 隐藏了。但 `return` 语句 ❸ 位于复合语句之后。在那个点，第二个 `a` 不再在作用域内，因此第一个是可见的。我们将在\
  \ `return` 语句中使用第一个 `a`，返回 `2`。\n\n如果如果我们交换列表 7-2 中两个语句的顺序呢？我们将得到：\n\n```c\nint\
  \ a = 2;\n{\n    int b = a + 2;\n    int a = 3;\n}\n```\n现在当我们声明 `b` 时，内层的 `a` 还没有在作用域内，所以它不会隐藏外层的\
  \ `a`。表达式 `a + 2` 将引用 `a` 的第一个声明，因此我们将 `b` 初始化为 `4`。\n\n你可以拥有许多层嵌套的作用域，正如列表 7-4\
  \ 所示。\n\n```c\nint main(void) {\n  ❶ int x = 1;\n    {\n      ❷ int x = 2;\n   \
  \     if (x > 1) {\n          ❸ x = 3;\n          ❹ int x = 4;\n        }\n    \
  \  ❺ return x;\n    }\n  ❻ return x;\n}\n```\n列表 7-4：多个嵌套作用域\n\n在这些列表中，我们声明了三个名为\
  \ `x` 的变量，具有三个不同的作用域。我们在 ❶ 处声明了第一个 `x`，在 ❷ 处声明了第二个。我们在 ❸ 将值 `3` 赋值给第二个 `x` 并在 ❺\
  \ 返回它，所以整个程序返回 `3`。在 ❹ 处声明的第三个变量 `x` 从未被使用过。我们没有到达 ❻ 处的最后的 `return` 语句，但如果我们到达了，它将返回\
  \ `1`，即最开始 ❶ 处声明的最第一个变量 `x` 的值。\n\n\n\n\n我们需要处理两种与变量作用域相关的错误情况。（我们在第 5 章中简要介绍过这两点，但在具有多个作用域的程序中，检测它们要复杂得多。）首先，如果作用范围内没有同名的变量，则使用该变量名是非法的。列表\
  \ 7-5 说明了这种错误。\n\n```\nint main(void) {\n    {\n        int x ❶ = 4;\n  ❷}\n   \
  \ return ❸ x;\n    int x ❹ = 3;\n❺}\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 7-5：使用未定义的变量</samp>\n\n在这个列表中，我们声明了两个名为 `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\"\
  >x</samp>` 的不同变量。第一个声明的作用域从 ❶ 开始到 ❷ 。第二个声明的作用域从 ❹ 开始，延伸到函数的结尾 ❺。在 ❸ 处，这两个声明都不在作用范围内。在该处使用变量名\
  \ `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">x</samp>` 是错误的，因为该名称没有指向任何内容。\n\
  \n其次，你不能在相同的作用域内对同一个变量名进行多次声明。如果两个变量的作用域结束于完全相同的点，我们就说它们具有相同的作用域；也就是说，它们是在同一个块中声明的。例如，这段代码片段是无效的：\n\
  \n```\nint a = 3;\n{\n    int b = a;\n    int b = 1;\n}\n```\n\n对 `<samp class=\"\
  SANS_TheSansMonoCd_W5Regular_11\">b</samp>` 的第二次声明是非法的，因为它与第一个声明的作用域相同。\n\n现在你已经理解了需要实现的作用域规则，让我们开始编写解析器。\n\
  \n### <samp class=\"SANS_Futura_Std_Bold_B_11\">解析器</samp>\n\n用大括号括起来的语句和声明列表可以是函数体，也可以是复合语句。让我们定义一个\
  \ `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">block</samp>` AST 节点来表示这两种结构：\n\
  \n```\nblock = Block(block_item*)\n```\n\n注意，这个 AST 节点并不代表 `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\"\
  >if</samp>` 语句，一旦我们在第 8 章 中实现了循环，它们也不会被代表，尽管它们在技术上也是块。\n\n接下来，我们将扩展 `<samp class=\"\
  SANS_TheSansMonoCd_W5Regular_11\">statement</samp>` 节点来表示复合语句：\n\n```\nstatement\
  \ = Return(exp)\n          | Expression(exp)\n          | If(exp condition, statement\
  \ then, statement? else)\n          | Compound(block)\n          | Null\n```\n\n\
  并且我们将修改 `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">function_definition</samp>`\
  \ 节点，使其也使用 `<samp class=\"SANS_TheSansMonoCd_W5Regular_11\">block</samp>`：\n\n```\n\
  function_definition = Function(identifier name, block body)\n```\n\n列表 7-6 提供了带有这些更改的新\
  \ AST 定义，更改部分已**加粗**。\n\n```\nprogram = Program(function_definition)\nfunction_definition\
  \ = Function(identifier name, block body)\nblock_item = S(statement) | D(declaration)\n\
  block = Block(block_item*)\ndeclaration = Declaration(identifier name, exp? init)\n\
  statement = Return(exp)\n          | Expression(exp)\n          | If(exp condition,\
  \ statement then, statement? else)\n          | Compound(block)\n          | Null\n\
  exp = Constant(int)\n    | Var(identifier)\n    | Unary(unary_operator, exp)\n \
  \   | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp\
  \ condition, exp, exp)\nunary_operator = Complement | Negate | Not\nbinary_operator\
  \ = Add | Subtract | Multiply | Divide | Remainder | And | Or\n                |\
  \ Equal | NotEqual | LessThan | LessOrEqual\n                | GreaterThan | GreaterOrEqual\n\
  ```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表 7-6：带有复合语句的抽象语法树</samp>\n\
  \n列表 7-7 显示了相应的相应的更改。\n\n```\n<program> ::= <function>\n<function> ::= \"int\" <identifier>\
  \ \"(\" \"void\" \")\" <block>\n<block> ::= \"{\" {<block-item>} \"}\"\n<block-item>\
  \ ::= <statement> | <declaration>\n<declaration> ::= \"int\" <identifier> [\"=\"\
  \ <exp>] \";\"\n<statement> ::= \"return\" <exp> \";\"\n              | <exp> \"\
  ;\"\n              | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n\
  \              | <block>\n              | \";\"\n<exp> ::= <factor> | <exp> <binop>\
  \ <exp> | <exp> \"?\" <exp> \":\" <exp>\n<factor> ::= <int> | <identifier> | <unop>\
  \ <factor>\n<unop> ::= ~ | !\n<binop> ::= - | + | * | / | Remainder | And | Or\n\
  \                | Equal | NotEqual | LessThan | LessOrEqual\n                |\
  \ GreaterThan | GreaterOrEqual\n```\n\n\n\n\n表 7-1：整个列表 7-4 中的变量变量映射\n\n| `int main(void)\
  \ {` | (空映射) |\n| --- | --- |\n| | |\n```\n int x = 1;\n    {\n``` | `x` → `x0`\
  \ |\n| | |\n```\n int x = 2;\n        if (x > 1) {\n            x = 3;\n``` | `x`\
  \ → `x1` |\n| | |\n```\n int x = 4;\n         }\n``` | `x` → `x2` |\n| | |\n```\n\
  \ return x;\n     }\n``` | `x` → `x1` |\n| | |\n```\n return x;\n}\n``` | `x` →\
  \ `x0` |\n\n变量映射的状态在两种情况下发生变化。首先，当声明新变量时，我们将其添加到映射中，覆盖任何同名的现有变量。其次，当我们退出一个块时，我们会恢复到进入该块之前所拥有的变量映射。\n\
  \n第一种情况已经很熟悉：每当我们遇到变量声明时，我们都会添加一个映射条目。为了处理第二种情况，每当我们进入一个新块时，都会创建一个变量映射的副本。当我们处理该块时，我们会向该映射副本中添加新条目，而保持外部作用域的变量映射不变。\n\
  \n现在你已经对这个处理阶段将如何工作有了基本的了解，让我们过一遍伪代码吧。\n\n### 更新变量解析的伪代码\n\n首先，让我们处理声明。在较早的章节中，如果编译器看到两个同名变量声明，它将会报错：\n\
  \n```\nresolve_declaration(Declaration(name, init), variable_map):\n    if name\
  \ is in variable_map:\n        fail(\"Duplicate variable declaration!\")\n    --snip--\n\
  ```\n\n但现在情况变得复杂了一些。在多个声明中重用相同的变量名是合法的。然而，在同一个块中多次声明相同的变量名是不合法的。为了强制这条规则，我们将跟踪变量映射中每个条目的两个事实：它新自动生成的名称，以及它是否在当前块中声明的。列表\
  \ 7-9 提供了处理声明的更新后的伪代码。与之前的伪代码版本（列表 5-9）相比的更改已加粗。\n\n```\nresolve_declaration(Declaration(name,\
  \ init), variable_map):\n    if name is in variable_map and variable_map.get(name).from_current_block:\n\
  \        fail(\"Duplicate variable declaration!\")\n    unique_name = make_temporary()\n\
  \    variable_map.add(name, MapEntry(new_name=unique_name, from_current_block=True))\n\
  \    if init is not null:\n        init = resolve_exp(init, variable_map)\n    return\
  \ Declaration(unique_name, init)\n```\n\n列表 7-9：解析变量声明\n\n接下来，我们需要一个按顺序处理块项的函数（我在稍后的伪代码列表中将其命名为\
  \ `resolve_block`）。你已经写了处理函数体的这段代码；现在你只需要对其进行重构，以便复用它来处理复合语句。记住，你在处理一个块项时做的更改（特别是声明）在处理后续块项时必须是可见的。\n\
  \n我们还会更新 `resolve_statement` 来处理复合语句。列表 7-10 提供了 `resolve_statement` 的更新后的伪代码。这里的关键细节是，当我们遍历复合语句时会传递变量映射的副本。\n\
  \n```\nresolve_statement(statement, variable_map):\n    match statement with\n \
  \   Return(e) -> return Return(e, variable_map)\n    Expression(e) -> return Expression(e,\
  \ variable_map)\n    Compound(block) ->\n        new_variable_map = copy_variable_map(variable_map)\n\
  \        return Compound(resolve_block(block))\n```\n列表 7-10：解析复合语句\n\n最后，我们将实现\
  \ `copy_variable_map`。这应该创建一个变量映射的副本，并将每个条目的 `from_current_block` 标志都设置为 `False`。这样，当我们处理内部作用域中的声明并隐藏了外部作用域的声明时，我们就不会报错。一旦你完成了这些更改，你的变量解析处理阶段就能处理嵌套作用域了！\n\
  \n### TACKY 生成\n\n最后一步是扩展 TACKY 阶段以处理复合语句。这非常直接：要将复合语句转换为 TACKY，只需转换其内部的每个块即可。基本上，你应该像处理函数体一样处理复合语句。你完全不需要触碰后续的阶段；一旦你让\
  \ TACKY 正常工作，你就完成了。\n\n### 总结\n\n在本章中，你通过扩展编译器中的几个阶段实现了一种新的语句。你写了一个更复杂的变量解析处理阶段，它可以正确解析多个作用域中的变量，极大地扩展了你可以编译的程序范围。接下来，你将实现循环、`break`\
  \ 语句和 `continue` 语句。你在本章中的工作在添加对 `for` 循环的支持时特别重要，因为一个 `for` 循环包含两个不同的作用域。\n\n(images/pg142.jpg)\n\
  \n描述\n\n## 8 循环\n\n(images/opener-img.jpg)\n\n在本章中，你将添加所有与循环相关的特性。这包括 `for`、`while`\
  \ 和 `do` 循环，以及用于跳过循环部分的 `break` 和 `continue` 语句。这些是你在书中实现的语句。当你完成本章后，如果你实现了所有的额外奖励功能，你的编译器将能够处理每种\
  \ C 语句。\n\n\n\n\n但你首先有工作要做！你将更新词法分析器和解析器，以支持所有五个新语句。然后，你将添加一个新的语义分析阶段，我们称之为 `loop\
  \ labeling`（循环标记）。这个新阶段在章节开头的图中以**粗体**显示，它将对 `AST` 进行标注，将每个 `break` 或 `continue`\
  \ 语句与包含它的循环关联起来。最后，你将每个新语句翻译成一系列的 `TACKY` 指令。你可以使用已经定义的 `TACKY` 指令来实现所有新语句，因此你将不需要更改\
  \ `TACKY` 生成之后的任何阶段。\n\n本章中的新语句引入了一些我们需要处理的边界情况和错误。在开始编写词法分析器之前，我们将简要讨论这些语句。\n\n\
  ### 循环以及如何跳出循环\n\n让我们先三种循环语句，然后考虑 `break` 和 `continue` 语句。代码列表 8-1 显示了一个 `while`\
  \ 循环的示例。\n\n```\nwhile ( ❶ a > 0)\n    a = a / 2;\n```\n\n代码列表 8-1：一个 `while` 循环\n\
  \n首先，我们评估语句的*控制表达式* ❶。如果它是 0（即为假），循环结束，我们移动到下一个语句。如果它非零，我们就执行 `while` 循环体，然后回到控制表达式，重复此过程。\n\
  \n`do` 循环（如 代码列表 8-2 所示）几乎完全一样。\n\n```\ndo\n    a = a + 1;\nwhile (a < 100);\n```\n\
  \n代码列表 8-2：一个 `do` 循环\n\n唯一的区别在于我们先执行循环体，*然后*检查控制表达式。这意味着循环体至少会被执行一次。与 `if` 语句体一样，循环体是一个单一语句，它可以是包含声明的复合语句。你在循环体中声明的任何变量在控制表达式中都不在范围内。例如，代码列表\
  \ 8-3](#chapter8.xhtml_list8-3) 是无效的。\n\n```\ndo {\n    int a = a + 1;\n} while\
  \ (a < 100);\n```\n\n代码列表 8-3：控制表达式使用了超出范围变量的 `do` 循环\n\n`for` 循环让事情变得更加复杂。它们有两种不同的类型。在第一种中（如\
  \ 代码列表 8-4\n    b = b * 2;\n```\n\n代码列表 8-4：初始句为表达式的 `for` 循环\n\n初始表达式 ❶ 在第一次循环迭代之前评估一次。然后，每次迭代时，我们：\n\
  \n1. 评估控制表达式 ❷。如果为假，循环终止。否则，我们……\n2. 执行语句体。\n3. 评估结束表达式 ❸。\n\n你可以省略循环头的任何或所有表达式。如果你省略了初始表达式或结束表达式，什么都不会发生。如果你省略了控制表达式，循环的行为就像其控制表达式始终为真（即非零）。这意味着除非它包含一个\
  \ `break`、`goto` 或 `return` 语句将控制权转移到循环之外，否则它永不会终止。代码列表 8-5 显示了第二种 `for`，其初始句是一个声明而不是表达式。\n\
  \n```\nfor (int a = 0; a < 5; a++)\n    b = b * 2;\n```\n\n代码列表 8-5：初始句带有声明的 `for`\
  \ 循环\n\n循环头部引入了一个新的作用域，所以你可以像 代码列表 8-6 那样编写代码。\n\n```\nint a = 5;\nfor (int a =\
  \ 0; a < 5; a++)\n    b = b + a;\n```\n\n代码列表 8-6：在头部之前和内部声明两个同名变量\n\n在此列表中，在头部中声明的变量\
  \ `a` 隐藏了上一行声明的变量 `a`。由于复合语句总是引入一个新的新的作用域，代码列表 8-7](#chapter8.xhtml_list8-7) 也是有效的。\n\
  \n```\nint a = 5;\nfor (int a = 0; a < 5; a++) {\n    int a = 1;\n    b = b + a;\n\
  }\n```\n\n代码列表 8-7：在循环之前、头部和体体中声明三个同名变量\n\n\n\n现在我们来谈谈 `break` 和 `continue` 语句。它们都只能出现在循环内部。（实际上，这并不完全正确；`break`\
  \ 语句也可以出现在 `switch` 语句内部，你可以将其作为本章的一个额外加分题特性来实现。）`break` 语句，如列表 8-9 所示，会跳转到循环结束后的后续位置。\n\
  \n```c\nwhile (1) {\n    a = a - 1;\n    if (a < 0)\n        break;\n}\nreturn a;\n\
  ```\n\n列表 8-9：一个 `break` 语句\n\n当我们遇到这个 `break` 语句时，将跳转到 `while` 循环之后的 `return` 语句。\n\
  \n`break` 语句只终止最内层的循环。例如，考虑列表 8-10 中的代码片段。\n\n```c\nwhile (b > 0) {\n    do {\n\
  \        a = a - 1;\n        if (a < 0)\n            break;\n    } while (1);\n\
  \    b = b * a;\n}\nreturn b;\n```\n\n列表 8-10：使用 `break` 语句跳出两个嵌套循环中的内层\n\n当我们到达此列表中的\
  \ `break` 语句时，我们将跳出内层循环而不是外层循环，因此我们将跳转到 `b = b * a;`。在整个章中，我将包含 `break` 或 `continue`\
  \ 语句的最内层循环称为*包围循环*（enclosing loop）（将其称为“最小包围循环”更符合 C 标准的术语，但那个说法有点绕口。）\n\n`continue`\
  \ 语句跳转到包围循环体中最后一个语句之后的点。考虑列表 8-11 中的示例。\n\n```c\nwhile (a > 0) {\n    a = a * b;\n\
  \    if (b > 0)\n        continue;\n    b = b + 1;\n    return b;\n}\n```\n\n列表\
  \ 8-11：一个 `continue` 语句\n\n当我们遇到 `continue` 语句时，将跳过其之后的所有语句，并跳转到循环体的结束 ❶。从那里，`while`\
  \ 循环像往常一样执行，这意味着跳转回到控制表达式。`for` 循环中的 `continue` 语句（如列表 8-12 所示）工作原理相同。\n\n```c\n\
  for (int i = 0; i < 5; ❶ i = i + 1) {\n    a = a * i;\n    if (b > 0)\n        continue;\n\
  \    b = b + 1; ❷\n}\n```\n\n列表 8-12：`for` 循环内部的 `continue` 语句\n\n在此列表中，我们仍然从 `continue`\
  \ 语句跳转到循环体的结束 ❷。然后，按照惯例跳转到最终表达式❶。\n\n如果 `break` 或 `continue` 语句循环循环（如列表 8-13 所示），编译应该失败。\n\
  \n```c\nint main(void) {\n    break;\n}\n```\n\n列表 8-13：无效的 `break` 语句\n\n然而，这些语句之一出现在循环深处是完全没问题的，就像列表\
  \ 8-14 中的 `break` 语句一样。\n\n```c\nwhile (1) {\n    if (a > 4) {\n        return b;\n\
  \    } else {\n        int c = 5;\n        break;\n    }\n}\n```\n\n列表 8-14：出现在循环几层之内的语句\n\
  \n这个 `break` 语句跳转到 `return 1;`，因为那是循环结束后的那个点。在一个循环中拥有多个 `break` 和 `continue` 语句是合法的，如[列表\
  \ 8-15] 所示。\n\n```c\nfor (int i = 0; i < 10; i = i + 1) {\n    if (i % 2 == 0)\n\
  \        continue;\n    if (x > y)\n        continue;\n    break;\n}\n```\n\n列表\
  \ 8-15：循环内部的多个 `break` 和 `continue` 语句\n\n现在我们涵盖了本章将添加的语句所需要的关键知识，我们可以开始实现它们了。第一步如既往，是更新词法分析器。\n\
  \n### 词法分析器\n\n你将在本章中添加五个关键字：\n\n* `do`\n* `while`\n* `for`\n* `break`\n* `continue`\n\
  \n你不需要任何其他新的标记。\n\n### 解析器\n\n接下来，我们将更新 AST。我们将添加五个新语句：\n\n```text\nstatement =\
  \ Return(exp)\n          | Expression(exp)\n          | If(exp condition, statement\
  \ then, statement? else)\n          | Compound(block)\n          | Break\n     \
  \     | Continue\n          | While(exp condition, statement body)\n          |\
  \ DoWhile(statement body, exp condition)\n          | For(for_init init, exp? condition,\
  \ exp? post, statement body)\n          | Null\n```\n\n\n\n\n### 循环语句\n`break` 和\
  \ `continue` 语句是最简单的语句了。`while` 和 `do` 语句也相对简单；它们都包含一个语句体和一个控制表达式。`for` 语句是最复杂的：它包含一个初始化句、一个可选的控制表达式、一个可选的后续表达式和一个语句体。初始化句可以是一个声明、一个表达式，也可以为空，因此我们需要一个新的\
  \ AST 节点来描述它：\n\n```\nfor_init = InitDecl(declaration) | InitExp(exp?)\n```\n\n\
  将所有内容整合在一起，我们得到了最新的 AST 定义，如列表 8-16 所示。\n\n```\nprogram = Program(function_definition)\n\
  function_definition = Function(identifier name, block body)\nblock_item = S(statement)\
  \ | D(declaration)\nblock = Block(block_item*)\ndeclaration = Declaration(identifier\
  \ name, exp? init)\nfor_init = InitDecl(declaration) | InitExp(exp?)\nstatement\
  \ = Return(exp)\n          | Expression(exp)\n          | If(exp condition, statement\
  \ then, statement? else)\n          | Compound(block)\n          | Break\n     \
  \     | Continue\n          | While(exp condition, statement body)\n          |\
  \ DoWhile(statement body, exp condition)\n          | For(for_init init, exp? condition,\
  \ exp? post, statement body)\n          | Null\nexp = Constant(int)\n    | Var(identifier)\n\
  \    | Unary(unary_operator, exp)\n    | Binary(binary_operator, exp, exp)\n   \
  \ | Assignment(exp, exp)\n    | Conditional(exp condition, exp, exp)\nunary_operator\
  \ = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply | Divide\
  \ | Remainder | And | Or\n                | Equal | NotEqual | LessThan | LessOrEqual\n\
  \                | GreaterThan | GreaterOrEqual\n```\n\n*列表 8-16: 带有循环以及 break 和\
  \ continue 语句的抽象语法树*\n\n在本章更新 AST 涉及到一个复杂度。循环标记将为程序中的每个 `break`、`continue` 和循环语句标记一个标签（我们将使用这些标签将每个\
  \ `break` 和 `continue` 语句与其所属的循环关联起来）。这意味着你需要某种方法将这些标签附加到 AST 中的新语句上。有几种选择。一种是为每个新构造函数包含一个\
  \ `label` 参数，如下：\n\n```\nstatement = --snip--\n          | Break(identifier label)\n\
  \          | Continue(identifier label)\n          | While(exp condition, statement\
  \ body, identifier label)\n          | DoWhile(statement body, exp condition, identifier\
  \ label)\n          | For(for_init init, exp? condition, exp? post, statement body,\
  \ identifier label)\n```\n\n如果你选择这种方案，可能需要在解析期间使用占位符标签，然后在循环标记阶段将它们替换为真实标签。另一个选项是定义两个\
  \ AST 数据结构：一个是不带标记的用于循环标记之前，另一个带有标记的用于之后。正确的方法取决于你用什么语言编写编译器（以及你的个人喜好）。\n\n更新 AST\
  \ 后，我们将对文法进行相应的更改，如列表 8-17 所示。\n\n```\n<program> ::= <function>\n<function> ::=\
  \ \"int\" <identifier> \"(\" \"void\" \")\" <block>\n<block> ::= \"{\" {<block-item>}\
  \ \"}\"\n<block-item> ::= <statement> | <declaration>\n<declaration> ::= \"int\"\
  \ <identifier> [\"=\" <exp>] \";\"\n<for-init> ::= <declaration> | [<exp>] \";\"\
  \n<statement> ::= \"return\" <exp> \";\"\n              | <exp> \";\"\n        \
  \      | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n         \
  \     | <block>\n              | \"break\" \";\"\n              | \"continue\" \"\
  ;\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n              | \"\
  do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\" \"(\"\
  \ <for_init> [<exp>] \")\"\n              | \";\"\n<exp> ::= <factor> | <factor>\
  \ <binary_operator> <exp> | <conditional> | assignment\n<factor> ::= <int> | <identifier>\
  \ | <unary_operator> <factor>\nunary_operator = Complement | Negate | Not\nbinary_operator\
  \ = Add | Subtract | Multiply | Divide | Remainder | And | Or\n                |\
  \ Equal | NotEqual | LessThan | LessOrEqual\n                | GreaterThan | GreaterOrEqual\n\
  ```\n*列表 8-17: 带有循环的文法*\n\n`break` 和 `continue` 语句是最简单的语句了。`while` 和 `do` 语句也相对简单；它们都包含一个语句体和一个控制表达式。`for`\
  \ 语句是最复杂的：它包含一个初始化句、一个可选的控制表达式、一个可选的后续表达式和一个语句体。初始化句可以是一个声明、一个表达式，也可以为空，因此我们需要一个新的\
  \ AST 节点来描述它：\n\n```\nfor_init = InitDecl(declaration) | InitExp(exp?)\n```\n\n\
  我建议编写一个辅助函数来解析可选表达式。你可以使用这个辅助函数来指定哪个标记标记了可选表达式的结束；大多数可选表达式后面都跟着分号，但 `for` 头部中的第三个句后面跟着的是右括号。\n\
  \n## 语义分析\n你的编译器的语义分析阶段目前执行一个任务：解析变量名。在本章中，它将承担一个全新的任务：循环标记。循环标记将为每个循环语句分配一个唯一的\
  \ ID，并为每个 `break` 和 `continue` 语句标记其所属循环的 ID。如果在循环之外找到 `break` 或 `continue` 语句，它将抛出错误。\n\
  \n我们将通过两个独立的传递来解析变量名和标记循环，每次遍历整个程序。让我们从扩展变量解析传递开始，以处理本章的新语句；然后实现循环标记传递。\n\n\n\n\n\
  \n你需要扩展 `resolve_statement` 来遍历在本章中添加的五种新语句。你可以像处理 `if` 语句一样处理 `while` 和 `do` 循环，递归处理每一个子语句和子表达式。解析\
  \ `break` 和 `continue` 语句更为简单；因为它们没有任何子语句或子表达式，所以你不需要做什么。\n\n解析 `for` 循环稍微复杂一点，因为循环头引入了新的变量作用域。列表\
  \ 8-18 展示了如何在 `resolve_statement` 中处理 `for` 循环。\n\n```\nresolve_statement(statement,\
  \ variable_map):\n    match statement with\n    | --snip--\n    | For(init, condition,\
  \ post, body) ->\n        new_variable_map = copy_variable_map(variable_map)\n \
  \       init = resolve_for_init(init, new_variable_map)\n        condition = resolve_optional_exp(condition,\
  \ new_variable_map)\n        post = resolve_optional_exp(post, new_variable_map)\n\
  \        body = resolve_statement(body, new_variable_map)\n        return For(init,\
  \ condition, post, body)\n```\n\n列表 8-18：解析 `for` 循环\n\n我们首先创建一个变量映射的新副本，就像我们在复合语句开头所做的那样。复制映射确保了在循环头中声明的变量在循环外部不可见，而且即使它隐藏了外部作用域的变量，也不会触发编译器错误。\n\
  \n接下来，我们使用 `resolve_for_init` 处理初始化语句（我们稍后会查看）。然后我们使用新的变量映射遍历 `for` 循环的控制表达式、结束表达式和体。我不会提供\
  \ `resolve_optional_exp` 的伪代码，它处理可选的控制表达式和结束表达式；它只是在表达式存在时调用 `resolve_exp`，如果不存在则什么都不做。\n\
  \n列表 8-19 显示了 `resolve_for_init` 的伪代码。\n\n```\nresolve_for_init(init, variable_map):\n\
  \    match init with\n    | InitExp(e) -> return InitExp(resolve_optional_exp(e,\
  \ variable_map))\n    | InitDecl(d) -> return InitDecl(resolve_declaration(d, variable_map))\n\
  ```\n\n列表 8-19：解析 `for` 循环的初始化语句\n\n我们在初始化语句中解析表达式或声明的方式，与它们出现在程序其他任何地方时的解析方式完全相同。如果该语句是一个声明，调用\
  \ `resolve_declaration` 将将新声明的变量添加到变量映射中，使其在循环的剩余部分中均可见。\n\n### 循环标记\n\n在解析变量之后，我们将再次遍历程序，为每个循环、`break`\
  \ 和 `continue` 语句标记一个 ID。每当我们遇到循环语句时，都会为它生成一个唯一的 ID。然后，当我们遍历循环体时，会将该 ID 附加到遇到的任何\
  \ `break` 和 `continue` 语句上。让我们来看几个例子。在接下来的三个列表中，标记 ❶ 和 ❷ 代表附加到 AST 上的 ID。虽然循环标记标注了\
  \ AST，但为了可读性，这些列表以源代码的形式呈现。列表 8-20 说明了我们将如何标记包含两个连续循环的代码片段。\n\n```\n❶ while (1)\
  \ {\n    a = a - 1;\n    if (a < 0)\n      ❶ break;\n}\n\n❷ for (int b = 0; b <\
  \ 100; b = b + 1) {\n    if (b % 2 == 0)\n      ❷ continue;\n    a = a * b;\n}\n\
  ```\n\n列表 8-20：标注 `break` 和 `continue` 语句及其所属的循环\n\n列表中的两个循环都拥有自己的 ID。我们为 `while`\
  \ 循环标记 ID ❶，为 `for` 循环标记 ID ❷。每个 `break` 或 `continue` 语句都标记为其所属循环的 ID，因此我们为 `break`\
  \ 语句标记了 ID ❶，为 `continue` 语句标记了 ID ❷。如果同一个所属循环中有多个 `break` 或 `continue` 语句，它们都被标记为同一个\
  \ ID，如 列表 8-21 所示。\n\n```\n❶ for (int i = 0; i < 10; i = i + 1) {\n    if (i % 2\
  \ == 0)\n      ❶ continue;\n    if (x > y)\n      ❶ continue;\n  ❶ break;\n}\n```\n\
  \n列表 8-21：在同一循环中标注多个 `break` 和 `continue` 语句\n\n由于标记为 ❶ 的 `for` 循环是两个 `continue`\
  \ 语句和一个 `break` 语句的所属循环，我们为这三个语句都标记了 ID ❶。如果 `break` 或 `continue` 语句出现在嵌套循环内部，我们将其标记为其所属循环的\
  \ ID，即最内层的循环。列表 8-22 说明了如何标注嵌套循环。\n\n```\n❶ while (a > 0) {\n  ❷ for (int i = 0;\
  \ i < 10; i = i + 1) {\n        if (i % 2 == 0)\n          ❷ continue;\n       \
  \ a = a / 2;\n    }\n    if (a == b)\n      ❶ break;\n}\n```\n\n列表 8-22：标注嵌套循环\n\
  \n外部 `while` 循环和内部 `for` 循环分别标记为 ❶ 和 ❷。由于 `continue` 语句出现在内部循环中，我们将其标记为 ID ❷。`break`\
  \ 语句在外部循环中，因此我们将其标记为 ID ❶。\n\n\n\n\n为了实现此编译器遍历，我们在遍历 AST 时会将当前的循环 ID 作为参数传递，这就像在变量解析遍历期间，我们将变量映射表作为参数传递给\
  \ `resolve_statement()`、`resolve_exp()` 等函数一样。当我们处于循环外部时，当前 ID 为 `null`、`None` 或你所使用的实现语言中表示缺失值的任何值。当我们遇到循环语句时，我们会生成一个新的\
  \ ID 并用该 ID 对语句进行标注。然后，在遍历循环体时，我们会将其作为当前 ID 继续传递。当我们遇到 `break` 或 `continue` 语句时，我们用传递给我们的\
  \ ID 对其进行标注。列表 8-23 中的伪代码说明了如何用循环 ID 标注语句。\n\n```\nlabel_statement(statement, current_label):\n\
  \    match statement with\n    | Break ->\n        if current_label is null:\n \
  \           fail(\"break statement outside of loop\")\n        return ❶ annotate(Break,\
  \ current_label)\n    | Continue ->\n        if current_label is null:\n       \
  \     fail(\"continue statement outside of loop\")\n        return ❷ annotate(Continue,\
  \ current_label)\n    | While(condition, body) ->\n        new_label = ❸ make_label()\n\
  \        labeled_body = label_statement(body, new_label)\n        labeled_statement\
  \ = While(condition, labeled_body)\n        return ❹ annotate(labeled_statement,\
  \ new_label)\n    | --snip--\n```\n\n*列表 8-23: 循环标注算法*\n\n辅助函数 `make_label()` ❸\
  \ 生成唯一的循环 ID；你在此可以使用与在 TACKY 中生成唯一标签时相同的相同辅助函数。`annotate()` 辅助函数接收一个 `statement`\
  \ AST 节点和一个标签，并返回一个标注了该标签的该 AST 节点的副本。在这里，我们使用它来标注 `Break` ❶、`Continue` ❷ 和 `While`\
  \ ❹ 语句。我没有提供 `annotate()` 的定义，因为它将取决于你如何在 AST 中确切表示循环标注。我也省略了处理 `DoWhile`、`For`\
  \ 以及我们在前面章节中添加的所有语句的伪代码。你本质上可以以与 `While` 相同的方式处理 `DoWhile` 和 `For`。要处理任何其他类型的语句，对每个子语句递归调用\
  \ `label_statement()`，并传递相同的 `current_label` 值。\n\n一旦你更新了循环标注遍历，就可以测试整个语义分析阶段了。\n\
  \n### TACKY 生成\n\n接下来，我们将每个新语句转换为 TACKY。在本章中，我们不会更改 TACKY IR，因为我们可以使用现有的 TACKY 指令来实现这些语句。\n\
  \n#### break 和 continue 语句\n\n`break` 语句无条件地跳转到程序中的某个其他点，因此我们用单个 `Jump` 指令来实现它。`continue`\
  \ 语句也是如此。唯一的问题是跳转到哪里。我们在上一节中添加的循环标注帮助我们回答这个问题。\n\n每当我们将循环语句转换为 TACKY 时，我们会在循环体指令之后立即发射一个\
  \ `Label`。该循环中的任何 `continue` 语句都可以实现为跳转到该标签，我称之为*continue 标签*（continue label）。我们还会发射另一个\
  \ `Label` 作为整个循环的最后指令；我将其称为*break 标签*（break label）。\n\n我们将从循环标注遍历期间添加的 ID 推导出这些标签。例如，如果一个循环被标记为\
  \ `loop0`，它的 break 和 continue 标签可能是 `break_loop0` 和 `continue_loop0`。使用这种命名方案，我们将一个标注有\
  \ ID `loop0` 的 `Break` AST 节点转换为以下 TACKY 指令：\n\n```\nJump(\"break_loop0\")\n```\n\
  \n我们将具有相同标注的 `Continue` 节点转换为：\n\n```\nJump(\"continue_loop0\")\n```\n\n你不需要使用这种特定的命名方案（尽管你的命名方案必须保证这些标签不会与\
  \ TACKY 程序中的其他标签冲突）。重要点是，当你将 `break` 或 `continue` 语句转换为 TACKY 时，你可以在转换其闭包循环到 TACKY\
  \ 的同时推导出该标签，因为该语句及其闭包循环被标注了相同的 ID。\n\n#### do 循环\n\n我们可以通过三个步骤执行语句 `do body (condition);`\
  \ 语句。首先，我们执行循环体。然后，我们评估条件并将结果与零进行比较。最后，如果结果不为零，则跳转回循环开头。列表 8-24 展示了如何在 TACKY 中实现这些步骤。\n\
  \n```\nLabel(start)\n<instructions for body>\n<instructions for condition>\nv =\
  \ <result of condition>\nJumpIfNotZero(v, start)\n```\n\n*列表 8-24: do 循环的 TACKY\
  \ 指令*\n\n我们还需要 break 和 continue 标签。continue 标签位于循环体和条件之间，break 标签位于 `JumpIfNotZero`\
  \ 之后的末尾。添加这两个标签就让我们得到了 `do` 循环的完整 TACKY，如 列表 8-25 所示。\n\n```\nLabel(start)\n<instructions\
  \ for body>\nLabel(continue_label)\n<instructions for condition>\nv = <result of\
  \ condition>\nJumpIfNotZero(v, start)\nLabel(break_label)\n```\n\n*列表 8-25: 带有 break\
  \ 和 continue 标签的 do 循环的 TACKY 指令*\n\n\n\n\n现在，循环体内的任何 `continue` 语句将跳转到 continue\
  \ 标签，而任何 `break` 语句将跳转到 break 标签。只有当循环体中某处出现 `break` 或 `continue` 语句时，这些标签才是必要的——否则它们将不会被使用——但为了简单起见，我们将始终生成它们。这样，我们就不需要判断循环是否包含\
  \ `break` 或 `continue` 语句了。\n\n### while 循环\n\n我们将类似于处理 `do` 循环的方式处理 `while` 循环，在这种情况下，我们在执行循环体之前执行条件，然后使用\
  \ `JumpIfZero` 在条件为假时退出循环。我们可以将语句 `while (condition) body` 转换为列表 8-26 中的 TACKY 代码。\n\
  \n```\nLabel(start)\n<instructions for condition>\nv = <result of condition>\nJumpIfZero(v,\
  \ end)\n<instructions for body>\n❶ Jump(start)\nLabel(end)\n```\n\n**列表 8-26：while\
  \ 循环的 TACKY 指令**\n\n现在让我们确定把 break 和 continue 标签放在哪里。这一次，我们不需要额外的 `Label` 指令；我们可以重用列表\
  \ 8-26 中已经存在的 `Label` 指令。我们将 break 标签放在此列表末尾的 `Label` 指令中。它将作为 `JumpIfZero` 指令和循环体中任何\
  \ `break` 语句的目标。\n\n同样，我们将 continue 标签放在此列表开头的 `Label` 指令中。这与将 continue 标签放在循环体末尾\
  \ ❶ 之后的效果相同，因为循环体之后的指令是一条无条件跳转指令，它会立即带我们回到循环开始。让 `continue` 语句直接跳转到循环开始，可以让它们跳过该\
  \ `Jump` 指令，从而提高一点执行效率。\n\n列表 8-27 显示了在将 `while` 循环转换为 TACKY 时何时使用 break 和 continue\
  \ 标签。\n\n```\nLabel(continue_label)\n<instructions for condition>\nv = <result of\
  \ condition>\nJumpIfZero(v, break_label)\n<instructions for body>\nJump(continue_label)\n\
  Label(break_label)\n```\n\n**列表 8-27：带有 break 和 continue 标签的 while 循环 TACKY 指令**\n\
  \n这段 TACKY 与列表 8-26 相同，只是它使用了 `continue_label` 和 `break_label` 代替了 `start` 和 `end`。\n\
  \n### for 循环\n\n我们的最后一个任务是将 `for` 循环转换为 TACKY。我们将语句 `for (init; condition; post)\
  \ body` 转换为列表 8-28 中的 TACKY 代码，其中包含了 break 和 continue 标签。\n\n```\n<instructions\
  \ for init>\nLabel(start)\n<instructions for condition>\nv = <result of condition>\n\
  JumpIfZero(v, break_label)\n<instructions for body>\nLabel(continue_label)\n<instructions\
  \ for post>\nJump(start)\nLabel(break_label)\n```\n\n**列表 8-28：for 循环的 TACKY 指令**\n\
  \n首先，我们执行 `init`。然后，我们执行控制表达式 `condition` 并检查结果是否为零。如果是，我们就跳转到最末尾的 `Label(break_label)`，而不执行循环体或最后的表达式。否则，我们执行循环体，接着执行最后的表达式\
  \ `post`，然后跳转回 `Label(start)` 并开始下一次迭代。我们不会再次执行 `init`，因为 `Label(start)` 位于 `init`\
  \ 之后。注意，continue 标签出现在循环体的末尾，即 `post` 之前，而 break 标签出现在循环的最末尾，它同时兼任 `JumpIfZero`\
  \ 指令和任何 `break` 语句的目标。\n\n接下来，让我们详细说明如何处理循环头中的三个子句。第一个子句可以是表达式、声明或为空。如果是声明或表达式，我们将像处理\
  \ `for` 循环之外的声明或表达式一样处理它。如果缺失，我们不生成任何指令。\n\n第二个子句是控制表达式。如果该表达式存在，将其转换为 TACKY 的方式与\
  \ `while` 和 `do` 循环中的控制表达式完全相同。如果缺失，C 标准规定该表达式将“被替换为一个非零常量”（第 6.8.5.3 节，第 2 段）。我们也可以在条件跳转中使用一个非零常量：\n\
  \n```\nJumpIfZero(Const(1), break_label)\n```\n\n但这条指令不起作用；`Const(1)` 永远不会为零，所以永远不会跳转。相反，我们将完全省略\
  \ `JumpIfZero` 指令，因为这是产生相同行为更高效的方法。\n\n\n\n最后，我们需要处理第三个子句 `<post>`。如果它存在，我们将将其转换为\
  \ `TACKY`；如果不存在，我们就不产生任何指令。\n\n### 额外加分：switch 语句\n\n你可以选择在本章中实现 `switch`、`case`\
  \ 和 `default` 语句。为了支持这些语句，你将对语义分析阶段进行重大修改。首先，你需要修改循环注解遍历（pass），因为 `break` 语句可以跳出\
  \ `switch` 语句，也可以跳出循环。然而，你不能在 `switch` 语句中使用 `continue` 语句，因此这一遍历需要对 `continue`\
  \ 语句和 `break` 语句进行不同的处理。\n\n你需要额外的分析（可能在单独的编译器遍历中）来收集每个 `switch` 语句内部出现的 `case`。为了为\
  \ `switch` 语句生成 `TACKY`，你需要该语句中所有 `case` 的列表。然而，这些信息在 AST 中无法直接获取。`switch` 语句中的\
  \ `case` 可能会嵌套几层，或者 `switch` 语句体可能完全不包含任何 `case`。你需要以更易于使用的形式将这些信息附加到 AST 上。\n\n\
  使用 `--switch` 标志启用 `switch` 语句的测试：\n\n```\n$ ./test_compiler /path/to/your_compiler\
  \ --chapter 8 --switch\n```\n\n或者像 usual 一样使用 `--extra-credit` 标志启用所有额外加分测试。\n\n\
  ### 总结\n\n在本章中，你实现了最后一组控制流语句。你添加了对三种不同循环语句的支持，以及 `break` 和 `continue` 语句。你实现了一个新的语义分析遍历，将\
  \ `break` 和 `continue` 语句与其所属的循环关联起来，并了解了如何将这些复杂结构中的每一个转换为 TACKY 指令列表。\n\n尽管我们已经完成了控制流语句，但你将在下一章中添加对另一种控制流表达式的支持：函数调用。你将学习决定函数调用在汇编中如何运作的调用约定，并编写一个简单的类型检查器。最棒的是，你将在本章结束时编译一个“Hello,\
  \ World!”。\n\n![](img/pg160.jpg)\n\n描述\n\n## 9 函数\n\n![](img/opener-img.jpg)\n\n\
  函数——可以在一处定义并在别处调用的代码块——是每个主流编程语言中的基本概念。事实上，它们如此基础，以至于有专门的处理器指令用于函数调用。在本章中，你将根据类\
