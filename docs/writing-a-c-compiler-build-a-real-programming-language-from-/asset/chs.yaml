  \n\n\n\n\n*   你可以在 Phillip Gibbons 在其卡内基梅隆大学编译器优化课程的讲灯幻片中找到别名分析算法的快速概述（[`www.cs.cmu.edu/afs/cs/academic/class/15745-s16/www/lectures/L16-Pointer-Analysis.pdf`](https://www.cs.cmu.edu/afs/cs/academic/class/15745-s16/www/lectures/L16-Pointer-Analysis.pdf)）。\n\
  \n![](img/pg612.jpg)\n\nDescription\n\n## 20 寄存器分配\n\n![](img/opener-img.jpg)\n\n\
  为止，你一直在栈上为每个伪寄存器分配空间。这种策略简单但效率低得痛苦。因为指令并不总是直接操作内存中的值，你有时需要生成额外的指令在这些栈位置和寄存器之间拷贝值。更糟糕的是，生成的汇编代码不断访问内存，尽管寄存器的速度快得多。现在你将解决这些问题。你将通过添加一个`寄存器分配`阶段（在章节开头的图中加粗显示）来完成你的编译器，将伪寄存器分配给硬件寄存器而不是内存位置。你将使用`图着色`——一种经典的寄存器分配技术——来实现这种分配。\n\
  \n一旦初始版本的寄存器分配器运行起来，你将给它增加一个任务：清理汇编生成过程中产生的一些不必要的 `mov` 指令。你分配器的最终版本将在将伪寄存器分配给硬件寄存器之前执行`寄存器合并`。寄存器合并步骤将寻找源和目的可以合并成单个操作数的\
  \ `mov` 指令，这允许你删除该指令。\n\n寄存器分配包含了各方面的元素：高层理论、低层细节、全新的概念以及早期章节中熟悉的技术。而回报是非常令人满意的：在章节结束时，你将生成效率高得多的代码。我认为这是一个结束书籍的良好句号。\n\
  \n为了开始，让我们来看一个示例，来说明为什么寄存器分配是如此强大的优化手段。\n\n## 实例中的寄存器分配\n\n考虑 Listing 20-1 中的微型\
  \ C 函数。\n\n```\nint f(int x, int y) {\n    return 10 - (3 * y + x);\n}\n```\n\n\
  Listing 20-1: 一个微型 C 函数\n\n首先，我们的编译器会将此转换为 Listing 20-2 中的微型 TACKY 函数。\n\n```\n\
  f(x, y):\n    tmp0 = 3 * y\n    tmp1 = tmp0 + x\n    tmp2 = 10 - tmp1\n    Return(tmp2)\n\
  ```\n\nListing 20-2: Listing 20-1 的 TACKY 代码\n\n该列表给出了优化阶段后 `f` 的定义。（特别是，我们优化掉了添加在每个\
  \ TACKY 函数末尾的额外 `Return(0)`，它是作为防止缺少 `return` 语句的后备措施。）\n\n接下来，我们将 Listing 20-2\
  \ 转换为 Listing 20-3 中的汇编代码。\n\n```\nf:\n  ❶ movl    %edi, %x\n    movl    %esi, %y\n\
  \  ❷ movl    $3, %tmp0\n    imull   %y, %tmp0\n    movl    %tmp0, %tmp1\n    addl\
  \    %x, %tmp1\n    movl    $10, %tmp2\n    subl    %tmp1, %tmp2\n  ❸ movl    %tmp2,\
  \ %eax\n    ret\n```\n\nListing 20-3: Listing 20-2 的汇编代码\n\n我们设置了函数的 ❶，然后计算 `tmp0`\
  \ ❷、`tmp1` 和 `tmp2` ❸。此列表中的 `x`、`y`、`tmp0`、`tmp1` 和 `tmp2` 指伪寄存器。现在我们将介绍三种替换这些伪寄存器的方法。首先，我们的编译器将根据\
  \ Table 20-1 将每个伪寄存器替换为栈槽。在下一次尝试中，我们将它们替换为硬件寄存器而不预先进行合并；这就是初始分配器将执行的操作。第三次，我们在替换伪寄存器之前执行合并。我将在整个章节中使用这种术语。\n\
  \n### 第一次尝试：将所有内容放在栈上\n\nTable 20-1: 用栈替换伪寄存器\n\n| 伪寄存器 | 实际位置 |\n| :--- | :---\
  \ |\n| `x` | `-4(rbp)` |\n| `y` | `-8(rbp)` |\n| `tmp0` | `-12(rbp)` |\n| `tmp1`\
  \ | `-16(rbp)` |\n| `tmp2` | `-20(rbp)` |\n\n这将为我们提供 Listing 20-4 中的对应汇编代码。\n\n\
  ```\nf:\n    movl    %edi, -4(%rbp)\n    movl    %esi, -8(%rbp)\n    movl    $3,\
  \ -12(%rbp)\n  ❶ imull   -8(%rbp), -12(%rbp)\n  ❷ movl    -12(%rbp), -16(%rbp)\n\
  \  ❸ addl    -4(%rbp), -16(%rbp)\n    movl    $10, -20(%rbp)\n  ❹ subl    -16(%rbp),\
  \ -20(%rbp)\n    movl    -20(%rbp), %eax\n    ret\n```\n\nListing 20-4: 替换伪寄存器为栈地址后的\
  \ Listing 20-3\n\n\n\n\n一旦我们把每个伪寄存器替换为内存地址，指令 ❶、❷、❸ 和 ❹ 就会失效，因此指令修复阶段（instruction\
  \ fix-up pass）需要修复它们。它会在 ❶ 之前插入一条额外的指令，将其目标地址加载到一个硬寄存器中，并在之后添加另一条指令将结果存回 `-12(%rbp)`。它还会插入指令，将\
  \ ❷、❸ 和 ❹ 的源操作数加载到硬寄存器中。在寄存器分配的上下，如果我们把伪寄存器的内容存储在栈上而不是硬寄存器，就称该伪寄存器`溢出`（spilled）到了内存。我们为了在寄存器和内存之间移动溢出值而插入的额外指令被称为`溢出代码`（spill\
  \ code）。\n\n我们最终将得到列表 20-5 中的汇编代码。我加粗了溢出代码以便于识别。（我也去掉了设置和销毁栈帧的指令，它们与此处无关。这些指令在章节后面的汇编程序中也被去掉了。）\n\
  \n```\nf:\n    --snip--\n    movl    %edi, -4(%rbp)\n    movl    %esi, -8(%rbp)\n\
  \    movl    $3, -12(%rbp)\n    movl    -12(%rbp), %r11d\n    imull   -8(%rbp),\
  \ %r11d\n    movl    %r11d, -12(%rbp)\n    movl    -12(%rbp), %r10d\n    movl  \
  \  %r10d, -16(%rbp)\n    movl    -4(%rbp), %r10d\n    addl    %r10d, -16(%rbp)\n\
  \    movl    $10, -20(%rbp)\n    movl    -16(%rbp), %r10d\n    subl    %r10d, -20(%rbp)\n\
  \    movl    -20(%rbp), %eax\n    --snip--\n    ret\n```\n\n列表 20-5: 带有溢出代码的列表 20-4\n\
  \n这段代码效率极低。几乎每条指令都会访问内存，我们浪费了大量时间将数据从一个地方复制到另一个。举一个特别糟糕的例子，我们将 `3 * y` 的结果存储在 `-12(%rbp)`，然后立即将其复制到\
  \ `-16(%rbp)`——这需要两条 `mov` 指令——而且再也没有使用过 `-12(%rbp)`。\n\n#### 第二尝试：寄存器分配\n\n让我们尝试一种更合理的策略。这次，我们将每个伪寄存器替换为硬寄存器，而不是栈地址，如表\
  \ 20-2 所示。\n\n表 20-2: 用硬寄存器替换伪寄存器\n\n| 伪寄存器 | 实际位置 |\n| :--- | :--- |\n| | --- |\n\
  | `x` | `%edx` |\n| `y` | `%ecx` |\n| `tmp0` | `%r8d` |\n| `tmp1` | `%r9d` |\n|\
  \ `tmp2` | `%edi` |\n\n我们将 `x`、`y`、`tmp0` 和 `tmp1` 替换为原始汇编程序中完全没有出现的寄存器。我们将 `tmp2`\
  \ 替换为 `EDI`，它在原始程序是被使用的。这是可以的，因为只有在我们用完 `EDI` 完成其他操作后，才会使用 `tmp2`。在章节后面的部分，我们将看到如何系统地推导哪些伪寄存器到硬寄存器的映射是安全的，哪些可能会导致冲突。\n\
  \n这次没有溢出代码，因此我不会包含指令修复阶段之前和之后的单独列表。相反，我们将直接跳到最终的汇编代码，如列表 20-6 所示。\n\n```\nf:\n \
  \   --snip--\n    movl    %edi, %edx\n    movl    %esi, %ecx\n    movl    $3, %r8d\n\
  \    imull   %ecx, %r8d\n    movl    %r8d, %r9d\n    addl    %edx, %r9d\n    movl\
  \    $10, %edi\n    subl    %r9d, %edi\n    movl    %edi, %eax\n    --snip--\n \
  \   ret\n```\n\n列表 20-6: 寄存器分配后列表 20-3 的最终汇编代码\n\n这是一个巨大的改进；我们不再访问内存，而且整体指令数量也减少了。如果我们愿意的话，甚至可以省略设置和销毁栈帧的指令，因为我们从没有使用栈。但我们移动数据仍然比需要的多。例如，我们将函数参数从\
  \ `EDI` 和 `ESI` 复制到新位置，而不是让它们留在原地。我们还将 `tmp0`（现在在 `%r8d` 中）复制到 `tmp1`（现在在 `%r9d`\
  \ 中），而我们完全可以连续两次使用 `tmp0` 进行计算。这并不是寄存器分配器的错；只是因为我们在之前的阶段生成了低效的汇编代码。但如果我们对如何分配寄存器进行深思，就可以对之前的阶段进行清理。这就是为什么我们的寄存器分配器将多包含一个步骤：寄存器合并（register\
  \ coalescing）。\n\n#### 第三尝试：带有合并的寄存器分配\n\n我们最后的方法有两个步骤。首先，我们将合并寄存器：查看函数中的每条 `mov`\
  \ 指令，并判断其操作数是否可以合并。然后，我们将剩余的伪寄存器替换为硬寄存器，就像我们之前尝试的那样。\n\n\n\n\n有时，将值从一个寄存器复制到另一个寄存器是绝对必要的。例如，如果我们稍后要在\
  \ EDI 中传递另一个函数参数，我们可能需要从 EDI 中复制 `x`。在这种情况下，将 `x` 合并到 EDI 是安全的，因为在执行第一条 `mov` 指令后，我们不再需要对\
  \ EDI 进行其他操作。同样的逻辑适用于其他三个 `mov` 指令。我们不需要同时在源操作数和目标操作数中存储不同的值，因此将它们合并是安全的。我们将 `x`\
  \ 合并到 EDI，将 `y` 合并到 ESI，将 `tmp1` 合并到 `tmp0`，并将 `tmp2` 合并到 EAX。\n\n表 20-3 总结了我们将合并哪些寄存器对，并显示了每对中的哪个成员将保留在程序中。\n\
  \n**表 20-3：寄存器合并**\n\n| 合并的对 | 保留的寄存器 |\n| --- | --- |\n| `%edi, %x` | `%edi` |\n\
  | `%esi, %y` | `%esi` |\n| `%tmp0, %tmp1` | `%tmp0` |\n| `%tmp2, %eax` | `%eax`\
  \ |\n\n我们还会删除所有的四个 `mov` 指令，因为它们不再具有任何作用。代码列表 20-7 给出了生成的汇编代码，其中更新后的操作数已加粗。\n\n\
  ```\nf:\n    movl    $3, %tmp0\n    imull   %esi, %tmp0\n    addl    $edi, %tmp0\n\
  \    movl    $10, %eax\n    subl    %tmp0, %eax\n    ret\n```\n\n代码列表 20-7：寄存器合并后的代码列表\
  \ 20-3\n\n这看起来要合理得多！我们让 `x` 和 `y` 留在它们最初被传递的 EDI 和 ESI 中，而不是将它们复制到新位置。当我们计算返回值时，我们直接将结果存储在\
  \ EAX 中，而不是在计算完成后再将其复制到 EAX。我们不再使用两个独立的临时寄存器来计算 `3 * y` + `x` 的中间和最终结果；整个过程中一直使用\
  \ `tmp0`。\n\n我们还没有完全完成；还需要将 `tmp0` 替换为硬寄存器。除了 ESI、EDI 或 EAX 之外的任何寄存器都可以——让我们选择 ECX\
  \ 吧。代码列表 20-8 显示了我们最终汇编代码。\n\n```\nf:\n    --snip--\n    movl    $3, %tmp0\n   \
  \ imull   %esi, %tmp0\n    addl    $edi, %tmp0\n    movl    $10, %eax\n    subl\
  \    %tmp0, %eax\n    --snip--\n    ret\n```\n\n代码列表 20-8：最终汇编代码\n\n没有合并的寄存器分配从两个方面改进了我们的代码：减少了内存访问次数以及早期阶段生成的\
  \ `mov` 指令数量。通过合并，我们进一步优化了代码。\n\n现在我们对想要实现的目标有了了解，让我们来看看寄存器分配是如何融入到整个编译器中的。\n\n\
  ### 更新编译器流水线\n\n寄存器分配器在可用大量寄存器时效果最好，因此我们要做的第一件事是将每个剩余的硬寄存器添加到汇编 AST 中，包括调用者保存寄存器。我们对从\
  \ TY 到汇编的转换做一个微小的更改：接下来，我们将实现寄存器分配器本身。就像我们在第 19 章中实现的优化一样，这一步将独立处理每个函数。\n\n即使在寄存器分配之后，程序中可能仍存在伪寄存器。这可能是由于两个原因。首先，如果一个函数同时使用许多伪寄存器，可能没有足够的硬寄存器来容纳它们。当发生这种情况时，我们必须将一些伪寄存器溢存在内存中。我们的寄存器分配器不会替换溢出的伪寄存器只需将其留在程序中供下一个阶段处理。其次，某些伪寄存器表示具有静态生存期的变量。它们必须存在内存中。如果你完成了第二部分，你会遇到其他一些必须存在内存中的对象，包括别名变量、结构体数组。寄存器分配器也不会触碰这些。\n\
  \n为了处理所有这些遗留，我们将在寄存器分配器之后立即运行旧的伪操作数替换阶段。我们不会对此阶段做任何更改。它将以以前相同的方式处理它找到的任何伪操作数；只是数量会少得多。\n\
  \n接下来，我们将更新指令修复阶段以处理保存和恢复调用者保存寄存器。我们所有现有规则——包括生成溢存代码的规则——将保持不变。由于我们仍然将伪寄存器替换为内存中的位置，有时仍然需要生成溢存代码。\n\
  \n最后，我们将扩展代码发射阶段以支持在本章中引入的新硬寄存器。你可能想在此阶段对新的寄存器分配阶段留空。然后我们将最后更新一次汇编 AST。\n\n### 扩展汇编\
  \ AST\n\n到目前，汇编 AST 只包含了我们用于特定目的的寄存器，例如传递参数或重写指令。它不包含任何调用者保存寄存器：RBX、R12、R13、R14\
  \ 和 R15。现在我们将添加这五个寄存器，以便寄存器分配器可以使用它们。我们还将添加 `pop` 指令，我们将用它在函数结束时恢复调用者保存寄存器。\n\n\n\
  \n\n\nListing 20-9 显示了完整的汇编抽象语法树（AST），包含了我们在第一部分、第二部分和第三部分中涵盖的所有内容，本章新增的内容已加粗粗。\n\
  \n```\nprogram = Program(top_level*)\nassembly_type = Byte | Longword | Quadword\
  \ | Double | ByteArray(int size, int alignment)\ntop_level = Function(identifier\
  \ name, bool global, instruction* instructions)\n          | StaticVariable(identifier\
  \ name, bool global, int alignment, static_init* init_list)\n          | StaticConstant(identifier\
  \ name, int alignment, static_init init)\ninstruction = Mov(assembly_type, operand\
  \ src, operand dst)\n            | Movsx(assembly_type src_type, assembly_type dst_type,\
  \ operand src, operand dst)\n            | MovZeroExtend(assembly_type src_type,\
  \ assembly_type dst_type,\n                            operand src, operand dst)\n\
  \            | Lea(operand src, operand dst)\n            | Cvttsd2si(assembly_type\
  \ dst_type, operand src, operand dst)\n            | Cvtsi2sd(assembly_type src_type,\
  \ operand src, operand dst)\n            | Unary(unary_operator, assembly_type,\
  \ operand)\n            | Binary(binary_operator, assembly_type, operand, operand)\n\
  \            | Cmp(assembly_type, operand, operand)\n            | Idiv(assembly_type,\
  \ operand)\n            | Div(assembly_type, operand)\n            | Cdq(assembly_type)\n\
  \            | Jmp(identifier)\n            | JmpCC(cond_code, identifier)\n   \
  \         | SetCC(cond_code, operand)\n            | Label(identifier)\n       \
  \     | Push(operand)\n            | Pop(reg)\n            | Call(identifier)\n\
  \            | Ret\nunary_operator = Neg | Not | Shr\nbinary_operator = Add | Sub\
  \ | Mult | DivDouble | And | Or | Xor | Shl | ShrTwoOp\noperand = Imm(int) | Reg(reg)\
  \ | Pseudo(identifier) | Memory(reg, int) | Data(identifier, int)\n        | PseudoMem(identifier,\
  \ int) | Indexed(reg base, reg index, int scale)\ncond_code = E | NE | G | GE |\
  \ L | LE | A | AE | B | BE\nreg = AX | BX | CX | DX | DI | SI | R8 | R9 | R10 |\
  \ R11 | R12 | R13 | R14 | R15 | SP | BP\n    | XMM0 | XMM1 | XMM2 | XMM3 | XMM4\
  \ | XMM5 | XMM6 | XMM7\n    | XMM8 | XMM9 | XMM10 | XMM11 | XMM12 | XMM13 | XMM14\
  \ | XMM15\n```\n\nListing 20-9：包含 `pop` 指令和额外寄存器的完整汇编 AST（注意：此处提供的原文经过截断/格式化）。\n\
  \n注意 `pop` 仅接受寄存器，不接受其他操作数。现在我们已经更新了 AST，让我们继续从 TACKY 转换为汇编。\n\n### 将 TACKY 转换为汇编\n\
  \n我们对这一阶段（pass）只做一个更改。我们并没有改变生成的汇编代码；我们是在后端符号表中记录额外的信息。具体来说，我们将记录使用哪些寄存器来传递每个函数的参数。正如你在下一节中看到的，寄存器分配器需要这些信息来确定哪些硬寄存器和伪寄存器存在冲突。\n\
  \n假设我们有以下函数声明：\n\n```\nint foo(int i, int j);\n```\n\n我们将记录 `foo` 的参数……（注意：源文本在此部分包含大量重复/乱码句子；此处保持核心逻辑不变）。\n\
  \n### 基于图着色的寄存器分配\n\n我们的编译器将寄存器分配建模为*图着色*问题。为图着色意味着为每个节点分配一个标签（传统称为“颜色”），使得每个节点的颜色与其邻居节点不同。如果可以用\
  \ *k* 或更少的颜色对图进行着色，则该图是*k-可着色的*。图 20-1 展示了一个 3 色的图。\n\n![](img/fig20-1.jpg)\n\n\
  图 20-1：一个 3 色的图\n\n\n\n\n\n此函数接收两个参数，并将它们复制到伪寄存器 `a` 和 `b` 中。它计算 `a / b - b`并将结果存储在\
  \ `tmp` 中。最后，它将 `tmp` 的值返回在 `EAX` 中。我们需要找出该中哪些寄存器发生了冲突（干扰），以便构建冲突图。\n\n首先，很容易看出\
  \ `a` 和 `b` 是冲突的。如果我们它们映射到同一个物理寄存器，那么在定义 `b` 时就会破坏 `a` ❷。这是一个问题，因为此时 `a` 仍然是活的（live）。你在学中学过，如果一个变量当前的值在程序后续可能被使用，那么它就是活的，否则它就是死的。这个定义也适用于寄存器。当一个寄存器是活的时，我们需要保留它的值，因此不能在同一位置存储不同的值。当它是死的时，我们可以自由用其他值覆盖它的值。这为我们提供了一个检测冲突的简单规则：当一个寄存器存活时更新另一个，则这两个寄存器发生冲突。\n\
  \n该规则还告诉我们 `b` 与 `tmp` 冲突，因为我们在定义 `tmp` 时 `b` 是活的 ❹。但 `a` 和 `tmp` 并不冲突；在我们定义 `tmp`\
  \ 时 `a` 已经死了，所以将它们映射到同一个物理寄存器是没有好的。\n\n现在让我们思考哪些物理寄存器与伪寄存器冲突。`ESI` 与 `a` 冲突，因为我们在定义\
  \ `a` 时 `ESI` 是活的 ❶。如果我们将 `a` 映射到 `ESI`，在有机会将其复制到 `b` 之前就会破坏函数的第二个参数。`EAX` 与 `b`\
  \ 冲突，因为我们将 `a` 复制到 `EAX` 准备除法时，`b` 是活的。最后一个冲突源并不那么明显。请记住 `cdq` 指令会将 `EAX` 中的值符号扩展到\
  \ `EDX` ❸。由于 `cdq` 在 `b` 存的同时隐式地更新 `EDX`，它使得 `EDX` 与 `b` 冲突；如果我们将 `b` 映射到 `EDX`，这条指令就会破坏它。（同样，`idiv`\
  \ 指令会隐式地更新 `EAX` 和 `EDX`，如果它们还没有冲突的话，那么这两个寄存器都会与 `b` 冲突。）\n\n最后，所有物理寄存器彼此相互冲突。这有点是循环定义的；因为它们本身就代表不同的物理位置，不能占用同一个物理位置。尽管如此，我们仍然需要在冲突图中这一点，以确保每个物理寄存器都有自己的颜色。\n\
  \n现在我们已经确定了哪些寄存器冲突，并将构建该图。为了保持该图较小，我们将假设物理寄存器只有 `ESI`、`EAX` 和 `EDX`。图 20-2 中的冲突图说明了我们刚刚识别出的冲突：\n\
  \n- `a` 与 `b` 冲突\n- `b` 与 `tmp` 冲突\n- `ESI` 与 `a` 冲突\n- `EAX` 与 `b` 冲突\n- `EDX`\
  \ 与 `b` 冲突\n\n图 20-2 显示了 `divide_and_subtract` 的冲突图。\n\n现在我们将对图进行 `k` 着色，其中 `k`\
  \ 是物理寄存器的数量。在这个小例子中，`k` 是 4。有几种可能的 4 着色方案。图 20-3 显示了其中几种。\n\n图 20-3 显示了 `divide_and_subtract`\
  \ 冲突图的三种有效 4 着色方案。（描述见下文）\n\n这些方案中的任何一种或我们想出的任何其他 4 着色都会为我们提供一个有效的分配。每个寄存器将获得与其邻居不同的颜色。由于\
  \ `k` 个物理寄存器彼此相互冲突，我们将每种颜色精确分配到一个物理寄存器，从而创建颜色到物理寄存器的 1:1 映射。\n\n着色完成后，我们将每个伪寄存器替换为接收相同颜色的物理寄存器。如果我们使用图\
  \ 20-3 中的第一种方案，我们将 `a` 替换为 `EDX`，`b` 替换为 `EDI`，并将 `tmp` 替换为 `EAX`，这便得到了列表 20-11\
  \ 中的汇编代码。\n\n```\ndivide_and_subtract:\n    movl %edi, %edx\n    movl %esi, %edi\n\
  \    movl %edx, %eax\n    cdq\n    idivl %edi\n    movl %eax, %eax\n    subl %edi,\
  \ %eax\n    movl %eax, %eax\n    ret\n```\n\n[列表 20-11] 根据图 20-3 中的第一种着色替换 `divide_and_subtract`\
  \ 中的寄存器。\n\n如果你愿意，可以运行此列表并确认它产生的结果与列表 20-10 中 `divide_and_subtract` 的原始代码相同。你也可以尝试使用图\
  \ 20-3 中的其他着色进行实验。\n\n\n\n\n\n注意，图染色会产生两种不同的映射：一个是从所有寄存器到颜色的映射，另一个是从颜色到硬寄存器的映射。从概念上讲，每个颜色代表一个硬寄存器，但在染色完成之前，我们并不知道\
  \ `which` 是哪一个硬寄存器。如果我们直接使用硬寄存器的名称本身作为颜色，或者提前将每个硬寄存器与某种颜色关联，那么在尝试对图的剩余部分染色之前，我们必须用相应的颜色`precolor`预着色）每个硬寄存器。预着色为图染色问题增加了更多约束，这使得找到有效的染色变得更加困难。某些图染色实现需要预着色节点；幸运的是，我们并不是其中之一。\n\
  \n### 检测冲突\n\n之前我提到过，如果在更新一个寄存器时另一个处于活跃状态（live），那么这两个寄存器就会冲突。我们使用这条规则来确定 `divide_and_subtract`\
  \ 中哪些寄存器发生了冲突；它帮助我们识别了伪寄存器之间的冲突，以及伪寄存器与硬寄存器之间的冲突。但关于这条规则，还有几个重要的点我们需要介绍。\n\n第一点是，只有当更新另一个寄存器的`immediately\
  \ after`（紧接着之后）它处于活跃状态时，两个寄存器才会冲突。这里有一个短的示例：\n\n```\nmovl    4(%rdi), %x\nmovl \
  \   %x, %eax\nret\n```\n\n在这个代码段中，`RDI` 保存了一个内存地址——可能是一个结构体或数组的地址。该段中的第一条指令获取内存\
  \ `RDI + 4` 处的值并将其复制到 `x`。在此指令之前，`RDI` 是活跃的；之后，它是死去的。`RDI` 和 `x` 并不冲突。如果我们将 `x`\
  \ 映射到 `RDI`，第一条 `mov` 指令将覆盖 `RDI` 中的地址。但没关系，因为我们不会再次使用该地址。\n\n第二点是，只有当两个寄存器具有不同的值时，它们才会冲突。具体来说，指令\
  \ `mov src, dst` 不会让 `src` 和 `dst` 冲突，即使 `src` 在之后仍然活跃活跃。例如，在 Listing 20-12 中，`x`\
  \ 和 `y` 并不冲突。\n\n```\nmovl    $1, %y\nmovl    %y, %x\naddl    %x, %ecx\naddl   \
  \ %y, %eax\n```\n\nListing 20-12：一段汇编代码，其中 `mov` 指令的源操作数在该指令后仍然活跃\n\n如果我们将 `x` 和\
  \ `y` 分配到同一个硬寄存器，第二条 `mov` 指令不会用新值覆盖 `x`。相反，它将完全没有任何影响。当我们执行寄存合并（register coalescing）时，我们甚至会特意将\
  \ `x` 和 `y` 放在同一个寄存器中，这样我们完全删除这条指令。\n\n`mov` 指令连接的两个寄存器可能由于其他原因仍然冲突，如 Listing 20-13\
  \ 所示。\n\n```\nmovl    $1, %y\nmovl    %y, %x\naddl    $1, %y\naddl    %x, %y\n```\n\
  \nListing 20-13：一段汇编代码，其中后来的指令使 `mov` 指令的操作数发生冲突\n\n在这个代码段中，第二条 `mov` 指令没有让 `x`\
  \ 和 `y` 冲突，但随后的 `add` 指令导致了，因为它在 `x` 活跃时更新了 `y`。在这种情况下，将 `x` 和 `y` 放在同一个寄存器是不安全的。\n\
  \n### 寄存器溢出（Spilling）\n\n我们不能总是对图进行染色。考虑 Listing 20-14 中的汇编，它计算了 `10 / arg1`。\n\n\
  ```\nuncolorable:\n    movl    %edi, %edi\n    movl    %esi, %esi\n    movl    $10,\
  \ %eax\n    cdq\n    idivl   %edi\n    movl    %eax, %tmp\n    movl    %edi, %eax\n\
  \    cdq\n    idivl   %esi\n    addl    %tmp, %eax\n```\n\n为了这个示例，我们假设有四个硬件寄存器：`ESI`、`EDX`\
  \ 和 `EAX`。Figure 20-4 显示了冲突图。我不会详细介绍如何构建这个图，但你可以自己验证。\n\nFigure 20-4：Listing 20-14\
  \ 的冲突图\n\n不可能对这个图进行四色染色。注意 `EAX`、`EDX`、`arg1`、`arg2` 和 `tmp` 彼此相互冲突。这意味着它们每一个必须接收一个与其他不同的颜色，这需要五种不同的颜色。我们将通过溢出一个寄存器来解决这个问题——换句话说，将其从图中移除而不是对其进行染色。溢出\
  \ `arg1`、`arg2` 或 `tmp` 中的任何一个都会使图变得可染色。例如，如果我们溢出 `tmp`，就可以使用 Figure 20-5 所示的染色方案。\n\
  \nFigure 20-5：溢出 tmp 后冲突图的染色\n\n现在我们可以替换已染色的两个伪寄存器，但不是 `tmp`。Listing 20-15 给出了结果汇编代码，其中相对于\
  \ Listing 20-14 的更改已**加粗**显示。\n\n```\nuncolorable:\n    movl    %edi, %edi\n   \
  \ movl    %esi, %esi\n    movl    $10, %eax\n    cdq\n    idivl   %edi\n    movl\
  \    %eax, %tmp\n    movl    %edi, %eax\n    cdq\n    idivl   %esi\n    addl   \
  \ %tmp, %eax\n    ret\n```\n\n\n\n\n\n#### 列表 20-15：寄存器分配后不可着色的函数\n\n注意，我们使此列表中的两个指令变得冗余了。我们可以通过删除它们来进一步优化代码，但目前暂不考虑这种优化。\n\
  \n在寄存器分配器将 `arg1` 和 `arg2` 分配给硬寄存器后，伪操作数替换传递会将 `tmp` 放入栈上。列表 20-16 提供了该函数的最终汇编代码，其中相较列表\
  \ 20-15 的更改已加粗。\n\n```\nuncolorable:\n    --snip--\n    movl    %edi, %edi\n   \
  \ movl    %esi, %esi\n    movl    $10, %eax\n    cdq\n    idivl   %edi\n    movl\
  \    %eax, -4(%rbp)\n    movl    %edi, %eax\n    cdq\n    idivl   %esi\n    addl\
  \    -4(%rbp), %eax\n    --snip--\n    ret\n```\n\n#### 列表 20-16：uncolorable 的最终汇编代码\n\
  \n溢出一个伪寄存器使得将所有其他寄存器替换为硬寄存器成为可能。但我们决定溢出*哪些*寄存器非常重要！通常，伪寄存器被访问的频率越高，溢出该寄存器对性能的损害就越大。我们的分配器将为干扰图中的每个寄存器计算“溢出成本”（spill\
  \ cost）。这是对该寄存器溢出影响性能的估计。然后，当我们对图染色时，将利用这些信息来最小化溢出操作对整体性能的影响。\n\n### 基础寄存器分配器\n\n\
  现在我们对寄存器分配器将如何工作有了初步了解，让我们来实现它吧！列表 20-17](#chapter20.xhtml_list20-17)描述了如何为单个函数分配寄存器。\n\
  \n```\nallocate_registers(instructions):\n    interference_graph = build_graph(instructions)\n\
  \    add_spill_costs(interference_graph, instructions)\n    color_graph(interference_graph)\n\
  \    register_map = create_register_map(interference_graph)\n    transformed_instructions\
  \ = replace_pseudoregs(instructions, register_map)\n    return transformed_instructions\n\
  ```\n\n#### 列表 20-17：顶层寄存器分配算法\n\n我们首先构建干扰图。然后，我们根据寄存器被使用的频率为每个寄存器计算溢出成本，并用该信息标记图。接下来，我们对图进行染色，为每个节点标记颜色。如果我们无法为每个节点染色，我们将使用在上一步中计算的溢出成本来决定溢出哪些内容。要溢出一个节点，我们只需让保持未着色状态。\n\
  \n最后一步是替换所有已着色的伪寄存器。在 `create_register_map` 中，我们构建一个从已着色伪寄存器到相同颜色硬寄存器的映射。最后，我们重写函数体，将每个伪寄存器替换为映射中对应的硬寄存器。\n\
  \n先为 `allocate_registers` 写一个存根代码（stub）。然后，我们将逐步介绍如何实现这些步骤。\n\n### 在寄存器分配期间处理多种类型\n\
  \n如果你完成了第二部分，那么你需要运行两次列表 20-17](#chapter20.xhtml_list20-17)中的整个算法：一次分配通用寄存器，一次分配\
  \ XMM 寄存器。在每次运行中，你只在干扰图中包含适当类型的寄存器。我们在第二部分中添加的新功能也会改变关于我们构建干扰图的其他细节。我们将在实现 `build_graph`\
  \ 时详细查看这些更改。\n\n构建干扰图之后的各个步骤——包括计算溢出成本、为图染色和替换伪寄存器——无论我们处理的是浮点寄存器还是通用寄存器，看起来都完全相同。我们在第二部分中添加的其他功能不会影响这些步骤。\n\
  \n### 定义干扰图\n\n为了开始工作，我们将定义图的结构。列表 20-18](#chapter20.xhtml_list20-18)提供了一种可能的表示方法。\n\
  \n```\nnode = Node(id, neighbors, spill_cost, color, pruned)\ngraph = Graph(node*)\n\
  ```\n\n#### 列表 20-18：节点的定义\n\n图中的每个节点对应于汇编中的一个 `Pseudoregister`（伪寄存器）或 `Register`（寄存器）操作数。我们将跟踪每个节点的`neighbors`（邻居）、`spill_cost`（溢出成本）和`color`（颜色）。`color`字段是可选的，因为我们可能无法为每个节点染色。我们在染色时会使用`pruned`标记；当你创建一个节点时，应该将`spill_cost`\
  \ 初始化为 `0.0`，将`color` 初始化为 `null`，并将`pruned` 初始化为 `False`。\n\n这个`node`的定义比需要的要宽松一点；`operand`类型包含了常量和内存位置，我们永远不会将它们添加到干扰图中。或者，你也可以将`operand`替换为仅能表示寄存器的专用\
  \ `node_id` 类型。我使用了一个更宽松的定义，以便我们不需要在整个分配器过程中在 `operand` 和 `node_id` 之间反复转换。\n\n\
  ### 构建干扰图\n\n我们终于准备好构建干扰图了！首先，我们将实现支持第一部分汇编 AST 的 `build_graph`。然后，我们将讨论如何修改它以支持第二部分的汇编\
  \ AST。\n\n由于构建图是一个相当复杂的过程，我们将将其分为几个步骤。列表 20-19](#chapter20.xhtml_list20-19)用伪代码说明了这些步骤。\n\
  \n```\nbuild_graph(instructions):\n  ❶ interference_graph = base_graph\n  ❷ add_pseudoregisters(interference_graph,\
  \ instructions)\n    cfg = make_control_flow_graph(instructions)\n  ❸ analyze_liveness(cfg)\n\
  \  ❹ add_edges(cfg, interference_graph)\n    return interference_graph\n```\n\n\
  #### 列表 20-19：构建干扰图\n\n\n\n\n\n我们将从一个包含所有硬寄存器❶的图开始。（据我所知，这种图没有标准术语，所以我将其称为 `base\
  \ graph`（基础图）。）。接下来，我们将为函数中出现的每个伪寄存器（pseudoregister）插入一个节点❷。最后，我们将确定哪些寄存器之间相互干扰。由于这取决于每个点哪些寄存器是活跃的，因此我们需要对汇编代码运行活跃性分析。就像在第\
  \ 19 章中一样，这种分析将获取一个控制流图（这与干扰图不同！）并为其标注活跃性信息❸。最后，我们将利用这些信息来确定向干扰图中添加哪些边❹。让我们详细查看这些步骤中的每一个。\n\
  \n### 基础图\n\n如图 20-6 所示，基础图包含了 12 个寄存器：RAX, RBX, RCX, RDX, RDI, RSI, R8, R9, R12,\
  \ R13, R14 和 R15。\n\n![](img/fig20-6.jpg)\n\n图 20-6：基础寄存器干扰图 描述\n\n我们不会在图中包含 RSP\
  \ 或 RBP，因为我们已经在使用它们来管理栈帧；我们也不会包含 R10 或 R11，因为我们将在指令修复阶段（instruction fix-up pass）中需要它们。由于所有硬寄存器相互干扰，因此基础图中每对节点之间都有一条边。在图论术语中，这使得基础图成为一个\
  \ `complete graph`（完全图）。\n\n> **注意**\n\n由于本章示例程序处理的是 4 字节伪寄存器，因此大多数干扰图使用 4 字节别名作为硬寄存器。我在图\
  \ 20-6 中使用了 8 字节别名，因为它代表的是你用于所有程序的基础图，而不是针对某个特定程序的干扰图。我们实际构建的干扰图将使用 reg 汇编 AST 节点来表示硬寄存器，这些节点不指定大小。\n\
  \n### 向图中添加伪寄存器\n\n这部分非常简单：我们只需要遍历每条指令中的每个操作数，并决定是否将其添加到图中。汇编函数中出现的每个伪寄存器都应该图中，除非它具有静态存储\
  \ Duration（static storage duration）。我将跳过 `add_pseudoregisters` 的伪代码，因为它并不复杂。\n\n\
  ### 活跃性分析\n\n我们已经知道活跃性分析是如何工作的，因为我们在第 19 章中已经实现过它。现在，我们需要一个新的实现，用于分析汇编而不是 TACKY，并跟踪寄存器而不是变量。幸运的是，基本逻辑是相同的。我们甚至可以重用一些现有代码。\n\
  \n首先，我们将构建一个控制流图。这与从 TACKY 函数构建控制流图的过程相同，只是基本块边界处的特定指令不同。我们不再寻找 TACKY 控制流指令（如 `Label`、`Return`、`Jump`、`JumpIfZero`\
  \ 和 `JumpIfNotZero`），而是寻找它们的汇编对应指令：汇编 `Label` 指令、`Ret`、`Jmp` 和 `JmpCC`。你已经写过将 TACKY\
  \ 转换为控制流图的代码；理想情况下，你能够重构它来处理汇编。\n\n接下来，我们将查看活跃性分析本身的三个组成部分：迭代算法、合并操作（meet operator）和传递函数（transfer\
  \ function）。迭代算法与第 19 章中的完全相同，所以你应该可以使用你已经编写的该算法实现。\n\n我们将使用集合并集作为合并操作，就像我们之前做的那样。然而，我们将不同的处理\
  \ `EXIT`。我们在第 19 章中定义的合并操作假设变量是活跃的。现在我们不关心变量；相反，我们关注硬寄存器：特别是 `AX`。\n\n```python\n\
  meet(block):\n    live_registers = {}\n    for succ_id in block.successors:\n  \
  \      match succ_id with\n        | EXIT -> live_registers.add(Reg(AX))\n     \
  \   | _\n    return live_registers\n```\n\n传递函数是活跃性分析中与上一章有显著区别的部分。基本思想相同：当寄存器被使用时，将其加入活跃集；当它们被更新时将其移除。但细节有所不同，因为我们处理的是不同的指令集。\n\
  \n首先，让我们写一个辅助函数 `find_used_and_updated`，告诉我们每条指令使用了和更新了哪些操作数。传递函数和我们即将实现的 `add_edges`\
  \ 函数都使用这个辅助函数。列表 20-21 提供了 `find_used_and_updated` 的伪代码。\n\n```python\nfind_used_and_updated(instruction):\n\
  \    match instruction with\n    | Mov(src, dst) -> ❶\n        used = [src]\n  \
  \      updated = [dst]\n    | Binary(op, src, dst) -> ❷\n        used = [src, dst]\n\
  \        updated = [dst]\n    | Unary(op, dst) ->\n        used = [dst]\n      \
  \  updated = [dst]\n    | Cmp(v1, v2) ->\n        used = [v1, v2]\n        updated\
  \ = []\n    | SetCC(cond, dst) ->\n        used = []\n        updated = [dst]\n\
  \    | Push(v) ->\n        used = [v]\n        updated = []\n    | Idiv(divisor)\
  \ ->\n        used = [divisor, Reg(AX), Reg(DX)]\n        updated = [Reg(AX), Reg(DX)]\n\
  \    | Cdq ->\n        used = [Reg(AX)]\n        updated = [Reg(DX)]\n    | Call(f)\
  \ -> ❸\n        used = <在后端符号表中查找参数传递寄存器>\n        updated = [Reg(DI), Reg(SI),\
  \ Reg(DX), Reg(CX), Reg(R8), Reg(R9), Reg(AX)]\n    | _ ->\n        used = []\n\
  \        updated = []\n    return (used, updated)\n```\n\n\n\n\n\n#### 列表 20-21：识别每条指令使用和更新的操作数\n\
  \n请记住，此列表仅涵盖第一部分中的汇编指令。`Mov` 是最简单的情况：它使用其源操作数并更新目的操作数❶。像 `add src, dst` 这样的二进制指令使用其源和目的并更新其目的❷。也很看出\
  \ `Unary`、`Cmp`、`SetCC` 和 `Push` 指令读取并更新了哪些操作数。\n\n某些指令使用了未显式提到的寄存器。`Idiv` 将存储在\
  \ `EAX` 和 `EDX` 寄存器值除以其源操作数，因此使用了三个值。它将结果存储在 `EAX` 和 `EDX` 中，因此它更新了这两个寄存器。`Cdq`\
  \ 将 `EAX` 符号扩展到 `EDX`，这意味着它使用了 `EAX` 并更新了 `EDX`。\n\n`Call` 使用持有被调用者参数的寄存器；我们可以在后端符号表中查找这些参数，我们是在汇编生成阶段记录下它们的\
  \ ❸。它更新了所有调用者保存的寄存器——无论我们是否通过它们传递被调用者的参数——因为这些寄存器可能会被被调用者覆盖。这导致所有调用者保存的寄存器与调用此函数时活跃的任何伪寄存器冲突，因此我们的图着色算法会将这些伪寄存器分配给被调用者保存的寄存器。\n\
  \n如果一条指令既使用又更新同一个寄存器——例如，一个 `Binary` 指令既使用又更新它的目的——那么将该寄存器同时包含在 `used` 和 `updated`\
  \ 列表中是有关重要的。在传递函数中，我们只关心寄存器是否被使用，因为这会使其处于活跃状态。但当我们再次在 `add_edges` 中使用这个辅助函数时，我们只关心寄存器是否被更新，因为这会导致它与同时活跃的任何其他寄存器产生冲突。\n\
  \n现在我们可以编写传递函数了，它定义在列表 20-22 中。\n\n```\ntransfer(block, end_live_registers):\n \
  \   current_live_registers = end_live_registers\n\n    for instruction in reverse(block.instructions):\n\
  \      ❶ annotate_instruction(instruction, current_live_registers)\n      ❷ used,\
  \ updated = find_used_and_updated(instruction)\n        for v in updated:\n    \
  \        if v is a register:\n                current_live_registers.remove(v)\n\
  \n        for v in used:\n            if v is a register:\n                current_live_registers.add(v)\n\
  \n  ❸ annotate_block(block.id, current_live_registers)\n```\n\n#### 列表 20-22：汇编活跃性分析的传递函数\n\
  \n由于这是反向分析，我们按逆序分析汇编指令。处理指令时，我们首先记录哪些寄存器在它之后立即活跃的❶。然后，我们计算在它之前哪些寄存器是活跃的。我们调用刚刚编写的辅助函数来确定它使用和更新了哪些操作数❷。然后，我们从当前活跃寄存集中移除它更新的任何寄存器，并添加它使用的任何寄存器。（如果指令既使用又更新同一个寄存器，我们将从活跃寄存器集中移除该寄存器，然后立即再次添加。）一旦处理完每条指令，我们就记录在代码块开始时哪些寄存器是活跃的❸。\n\
  \n我们不会追踪常数和内存操作数，但我们的活跃寄存器集可能包含某些我们不关心的操作数（具体来说是具有静态存储期的伪寄存器）。将它们包含在活跃性结果中并无害；我们在下一步使用这些结果时只需忽略它们即可。\n\
  \n### 添加边\n\n有了活跃性信息，我们终于可以确定要向图中添加哪些边。列表 20-23 提供了该步骤的伪代码。\n\n```\nadd_edges(liveness_cfg,\
  \ interference_graph):\n    for node in liveness_cfg:\n        if node is EntryNode\
  \ or ExitNode:\n            continue\n\n        for instr in node.instructions:\n\
  \            used, updated = find_used_and_updated(instr)\n\n          ❶ live_registers\
  \ = get_annotation(instr)\n\n            for l in live_registers:\n            \
  \  ❷ if (instr is Mov) and (l == src):\n                    continue\n\n       \
  \         for u in updated:\n                  ❸ if (l in interference_graph) and\
  \ (l != u):\n                        add_edge(interference_graph, l, u)\n```\n\n\
  #### 列表 20-23：向干扰图添加边\n\n我们之前学过，如果一个寄存器被更新而另一个是活跃的，它们就会冲突。现在我们查看每个指令并确定它创建了哪些冲突。处理单个指令时，我们首先调用\
  \ `find_used_and_updated` 查看它更新的内容。（我们将忽略该函数返回的第一个列表 `used`，因为我们不在乎它使用了哪些。）接下来，我们查询指令之后立即活跃哪些寄存器❶。我们在\
  \ `live_registers` 中的每个寄存器与 `updated` 中的每个寄存器之间添加一条边。`Mov` 指令是一个特殊情况。如果当前指令是 `Mov`，我们在遍历活跃寄存器集时将跳过源操作数❷。在两个节点之间添加边之前，我们会确保两个节点都在图中。我们还会确保它们是不同的，因为我们不想从节点到自身添加边❸。\n\
  \n\n\n\n\n除了浮点寄存器外，我们还需要更改其他几个细节。我们将从图中排除别名伪寄存器（aliased pseudoregisters），因为它们不应该分配给寄存器。你可以在这里复用上一章的地址分析（address-taken\
  \ analysis）；只需在程序从 TACKY 转换为汇编之前立即运行该分析即可。如果变量在 TACKY 程序中是别名，它在汇编代码中仍然是别名。\n\n活跃性分析（Liveness\
  \ analysis）应该反映我们在第二部分中实现的新调用约定。`meet` 函数不能假设在函数退出时 `EAX` 是活跃的；它应该检查后端符号表，确定函数使用哪些寄存器传递返回值。这些寄存器在\
  \ `EXIT` 处都是活跃的。\n\n我们还会更新 `find_used_and_updated` 辅助函数。首先，该函数需要正确处理 `Memory` 和\
  \ `Indexed` 操作数。这些操作数指定内存中的位置，但在计算地址时使用了寄存器。当我们使用这些操作数之一时，我们会 `read` 它所引用的任何寄存器，即使我们正在\
  \ `write` 它所指定的内存位置。例如，指令 `movl $1, 4(%rax)` 使用了 `RAX` 而不是更新它，而指令 `leaq (%rax, %rcx,\
  \ 4), %rdi` 使用了 `RAX` 和 `RCX` 但更新了 `RDI`。其次，`find_used_and_updated` 必须识别所有的 `XMM`\
  \ 寄存器都是调用保存（caller-saved），因此会被 `Call` 指令更新。最后，此函数需要处理我们在第二部分中添加的所有新汇编指令，但这些指令并没有特别复杂。\n\
  \n### 计算溢出成本（Spill Costs）\n\n构建图之后，我们为每个寄存器标记一个溢出成本。如果我们无法为图中的每个节点着色，这些成本将帮助我们决定哪个节点（或哪些节点）溢出。我们将尝试以最小化所有溢出节点总成本的方式图着色。\n\
  \n由于我们无法溢出硬寄存器，因此我们为每个硬寄存器分配无限大的溢出成本。为了估计每个伪寄存器的溢出成本，我们只需要统计它在汇编代码中出现的次数。例如，如果我们遇到指令\
  \ `movl $1, %x`，我们将 `x` 的溢出成本增加一。如果我们看到指令 `addl %x, %x`，我们将 `x` 的溢出成本增加二。这里的原理是：伪寄存器使用得越频繁，如果我们溢出它，引入的内存访问和新指令就越多。\n\
  \n坦率地说，这种计算溢出成本的方法非常糟糕。它忽略了一个基本事实：某些指令的执行频率高于其他指令。显然，在一个执行百万次的循环中使用伪寄存器，其溢出成本的增加应该远大于在仅运行一次的指令中使用它。很难精确预测某特定指令会执行多少次，但一种方法是使用循环嵌套深度作为执行频率的粗略指标。采用这种方法的编译器计算溢出成本时，会给深层嵌套循环中的指令更大的权重。\n\
  \n遗憾的是，我们不知道程序中的循环在哪里。发现循环需要我们实现一种全新类型的分析，而这一章已经足够长了。我在第 669 页的“附加资源”中包含了一些关于识别循环的参考文献，以防你想自己实现这种分析。\n\
  \n### 为干扰图着色（Coloring the Interference Graph）\n\n是时候给图着色了！我们的目标是最小化未着色节点的总溢出成本（理想情况下是为每个节点着色，使总溢出成本为零）。但寻找最佳着色的精确图着色算法在实践中太慢，无法使用。相反，我们将使用近似算法。这种算法可能找不到最好的着色，但它通常能找到一个不错的。\n\
  \n我们的图着色算法基于一个简单的观察：你总是可以给邻居少于 `k` 的节点着色，因为至少有一种颜色是它的邻居都没有使用的。这种观察被称为 `degree <\
  \ k` 规则（节点拥有的邻居数量称为其度；如果有 `k` 个或更多，我们称节点具有 `significant degree`）。`degree < k` 规则为我们提供了一种分解问题的方法。首先，我们将临时移除任何邻居少于\
  \ `k` 的节点。这被称为修剪（pruning）。然后，我们为图的剩余部分着色（我们先不担心如何做到）。最后，我们一个一个放回修剪的节点。当我们放回一个节点时，为它分配一个与已着色邻居不冲突的颜色。由于每个节点的邻居少于\
  \ `k`，将至少有一种可用颜色。让我们尝试用这种方法对图 20-7 所示的图进行三色渲染，看看能进行哪一步。\n\n图 20-7\n该图有四个三个邻居的节点：`B`、`C`、`F`\
  \ 和 `H`。我们将从图中修剪这些节点。我们还将定义一个栈来跟踪最终需要放回图中的修剪节点。\n\n图 20-8\n显示了修剪后的图和栈。\n\n图 20-8\n\
  图 20-7 经过两轮修剪后的图。\n\n图 20-9\n显示了修剪 `A` 和 `G` 后的图和栈。\n\n图 20-10\n显示了在我们修剪所有节点后的样子。\n\
  \n\n\n\n\n![](img/fig20-10.jpg)\n\n图 20-10：在剪枝每个节点后图 20-7 中的描述\n\n我们最初的计划是剪枝图，对剩余节点进行染色，然后将剪掉的节点放回。现在我们已经完成了剪枝，不需要对第二步执行任何操作了：因为没有剩下的节点需要染色了！我们不会每张图都这么幸运；有时我们会遇到无法剪枝的节点。稍后我们将会讨论如何处理这种情况。现在，让我们完成这张图的染色。\n\
  \n作为计划的最后一步，我们将取出之前剪枝的每个节点，为其分配一种颜色，并将其放回图中。我们将从最后一个移除的节点开始（即位于栈顶的节点），然后重复此过程直到栈为空。图\
  \ 20-11 中的图表序列说明了我们将在本示例中如何重建图。\n\n![](img/fig20-11.jpg)\n\n图 20-11：将节点加回图中并分配颜色\
  \ 描述\n\n当我们将 `E` 加回图时，它没有邻居，因此我们可以为其分配任何颜色。让我们把它涂成白色。然后，当我们添加 `D` 时，它唯一的邻居是 `E`，因此我们可以为它分配黑色或灰色。当我们添加\
  \ `G` 时，我们发现它有一个白色邻居和一个灰色邻居，所以我们必须将其涂成黑色。我们继续操作，直到栈为空且图中的每个节点都分配了颜色。\n\n### 处理溢出（Spills）\n\
  \n对于许多干扰图，我们可以使用上一节采用的方法剪枝每个节点。我们可以在不产生任何溢出的情况下对这些图进行染色。但对于其他图我们会陷入困境：我们会遇到一个每个节点都有\
  \ `k` 个或更多邻居的节点。假设我们想对图 20-12 所示的图进行 3 色染色。\n\n![](img/fig20-12.jpg)\n\n图 20-12：每个节点都有三个或更多邻居的图\
  \ 描述\n\n如果我们尝试剪枝这张图，我们会立即陷入困境：每个节点至少有三个邻居！为了摆脱困境，我们仍然选择一个节点进行剪枝。我们将此节点放入栈中，然后按照常例继续算法。这个节点是一个\
  \ `spill candidate`（溢出候选者），因为当我们把它放回图时，我们可能无法为它染色。如果我们运气好，它的邻居不会用尽所有颜色，这样我们就能为它染色。如果我们运气不佳，它的邻居将用掉所有的\
  \ `k` 种颜色，那么我们就必须对其进行溢出。\n\n我们希望选择一个溢出成本的溢出候选者。但我们也希望选择具有许多尚未剪枝邻居的溢出候选者，因为剪枝溢出候选者会降低其邻居的度，帮助我们避免以后对它们进行溢出。为了平衡这两个优先级，我们将选择\
  \ `spill cost / degree` 值最小节点，其中 `degree` 是尚未剪枝的邻居数量。\n\n注意，我们永远不会选择硬寄存器（hard register）作为溢出候选者，因为这些寄存器的每个\
  \ `spill cost / degree` 总是无穷大。如果图中还有任何伪寄存器（pseudoregisters），我们始终会选择其中一个作为溢出候选者，而不是选择硬寄存器。如果没有剩余的伪寄存器，寄存器的总数必须是\
  \ `k` 或更少，因此我们将能够剪枝每个寄存器。\n\n某些图没有有效的 `k` 色染色，这使得溢出变得不可避免。对于其他图，虽然存在有效的染色，但我们能否找到它取决于运气；这取决于我们从图中移除节点的精确顺序，以及在将它们放回时如何给它们上色。\n\
  \n为了说明这种方法中的运气成分，我们将尝试对图 20-12 中的图进行几次染色。这张图是可以 3 色染色的，但我们的尝试中只有一次能找到无溢出的染色。在两种情况下，我们都会选择\
  \ `C` 作为溢出候选者，然后剪掉 `A` 和 `B`，留下 `D`、`E` 和 `F`。在两种情况下，我们在将节点加回图时都会使用相同的策略进行染色：我们将从列表\
  \ `[white, gray, black]` 中选择第一个可用的颜色。唯一的区别在于剪枝剩余三个节点的顺序。在第一种情况下，我们将剪掉 `D`，然后是 `E`，最后是\
  \ `F`。图 20-13 显示了当我们尝试将节点加回时会发生什么。\n\n![](img/fig20-13.jpg)\n\n图 20-13：对图 20-12\
  \ 染色的第一次尝试 描述\n\n当我们到达 `C` 时，我们会发现它的邻居已经在使用三种颜色，所以我们被迫对其进行溢出。\n\n现在重复这个过程；在这次尝试中，我们将剪掉\
  \ `F`，然后是 `E`，最后是 `D`。图 20-14 显示了这一次我们我们放回节点时会发生什么。\n\n![](img/fig20-14.jpg)\n\n\
  图 20-14：对图 20-12 染色的更成功的尝试 描述\n\n这一次，我们为 `A` 和 `E` 分配了相同的颜色，这允许我们为 `C` 分配颜色而不是溢出。在像这样的小示例中，很容易看出给这些节点分配相同的颜色是更好的选择。但并没有通用的规则可以让我们避免像图\
  \ 20-13 那样的不必要的溢出；这就是该算法是近似算法的原因。\n\n### 实现图染色算法\n\n现在我们已经使用该算法运行了几个示例，让我们来看看伪代码，它在列表\
  \ 20-24 中所示。\n\n\n\n\n\n```python\ncolor_graph(g):\n    remaining = <unpruned nodes\
  \ in g>\n  ❶ if remaining is empty:\n        return\n\n    // choose next node to\
  \ prune\n    chosen_node = null\n\n    for node in remaining:\n        degree =\
  \ length(<unpruned neighbors of node>)\n        if degree < k:\n          ❷ chosen_node\
  \ = node\n            break\n\n    if chosen_node is null:\n        // choose a\
  \ spill candidate\n        best_spill_metric = infinity\n        for node in remaining:\n\
  \            degree = length(<unpruned neighbors of node>)\n            spill_metric\
  \ = node.spill_cost / degree\n            if spill_metric < best_spill_metric:\n\
  \              ❸ chosen_node = node\n                best_spill_metric = spill_metric\n\
  \n    chosen_node.pruned = True\n\n    // color the rest of the graph\n  ❹ color_graph(g)\n\
  \n    // color this node\n    colors = [1, 2, . . ., k]\n    for neighbor_id in\
  \ chosen_node.neighbors:\n        neighbor = get_node_by_id(g, neighbor_id)\n  \
  \      if neighbor.color is not null:\n            colors.remove(neighbor.color)\n\
  \n  ❺ if colors is not empty:\n        if chosen_node is a callee-saved hard register:\n\
  \            chosen_node.color = max(colors)\n        else:\n            chosen_node.color\
  \ = min(colors)\n        chosen_node.pruned = False\n\n    return\n```\n\nListing\
  \ 20-24：图着色算法\n\n我们将递归地对图着色。在每一步中，我们会修剪一个节点，然后递归调用着色图剩余部分，最后将该节点放回并分配颜色。在基础情况下，我们已经修剪了每个节点，所以无事可做\
  \ ❶。\n\n在递归情况下，我们首先选择一个要修剪的节点，在列表中将其记为 `chosen_node`。我们会选择找到的具有少于 `k` 个未修剪邻居的节点\
  \ ❷。（如果你正在分配通用寄存器，`k` 为 12；如果你正在分配 XMM 寄存器，则为 14。）如果该搜索没有结果，我们将选择 `spill cost /\
  \ degree` 值最小的节点 ❸。要修剪一个节点，我们只需将其 `pruned` 属性设置为 `True`。然后，我们递归调用 `color_graph`\
  \ 为图中的剩余节点着色 ❹。\n\n从该递归调用返回后，我们将尝试为 `chosen_node` 分配颜色。我们将获取从 `1` 到 `k` 的整数列表（这代表每种可能的颜色），并移除任何分配给\
  \ `chosen_node` 邻居的颜色。`chosen_node` 的某些邻居可能还没有颜色，要么是因为我们对它们进行了溢出（spill），要么是因为我们在处理\
  \ `chosen_node` 之前修剪了它们，因此稍后会对它们着色。我们可以简单地忽略这些节点。\n\n如果列表中还有剩余颜色，我们将选择其中一种分配给 `chosen_node`\
  \ ❺。 如果有多个可用颜色，算法对选择哪一个并不挑剔。尽管我们在这里选择的颜色可能会影响我们最终溢出的节点数量，但这种影响是不可预测的；没有一种颜色选择策略能从全局范围内最小化溢出。因此，我们带着另一个目标来选择颜色：将伪寄存器分配给调用者保存（caller-saved）而非调用者保存（callee-saved）硬件寄存器。（我们希望尽可能少地使用调用者保存寄存器，以避免保存和恢复它们的。）当\
  \ `chosen_node` 代表调用者保存的硬件寄存器时，我们将为其分配可用颜色中编号最大的；否则，我们为其分配编号最低的可用颜色。使用这种策略，着色算法倾向于为调用者保存寄存器分配高编号颜色，为调用者保存寄存器和伪寄存器分配低编号颜色。只有当没有低编号颜色可用时，伪寄存器才会获得高编号颜色（例如，因为它与每个调用者保存寄存器都冲突）。一旦选定颜色，我们将\
  \ `pruned` 属性设回 `False`。这并非严格必要，因为我们不会再次使用该属性，但它标记了我们已将节点放回图中。\n\n如果列表中没有剩余颜色，我们必须溢出\
  \ `chosen_node`。具体来说，这意味着我们不会为它分配颜色。我们也不会更新它的 `pruned` 属性，因为我们没有将此节点放回图中。注意，我们没有显式地将节点推入栈或在之后弹出。我们的递归算法自然地以正确的顺序着色节点，从我们修剪的最后一个节点开始。\n\
  \n### 构建寄存器映射并重写函数体\n\n一旦我们完成了图着色，寄存器分配器的其余部分就简单了。我们将构建一个从伪寄存器到硬件寄存器的映射，并用它替换汇编代码中的伪寄存器。在构建此映射的同时，我们还会跟踪已分配的调用者保存寄存器，以便在指令修复中对其进行保存和恢复。列表\
  \ 20-25 展示了如何构建该映射。\n\n```python\ncreate_register_map(colored_graph):\n\n    //\
  \ 构建从颜色到硬件寄存器的映射\n    color_map = <empty map>\n    for node in colored_graph.nodes:\n\
  \        match node.id with\n        | Reg(r) ->\n            color_map.add(node.color,\
  \ r)\n        | Pseudo(p) -> continue\n\n    // 构建从伪寄存器到硬件寄存器的映射\n    register_map\
  \ = <empty map>\n    callee_saved_regs = {}\n    for node in colored_graph.nodes:\n\
  \        match node.id with\n        | Pseudo(p) ->\n            if node.color is\
  \ not null:\n              ❶ hardreg = color_map.get(node.color)\n             \
  \   register_map.add(p, hardreg)\n                if hardreg is callee saved:\n\
  \                  ❷ callee_saved_regs.add(hardreg)\n        | Reg(r) -> continue\n\
  \n  ❸ record_callee_saved_regs(current function name>, callee_saved_regs)\n\n  \
  \  return register_map\n```\n\nListing 20-25：从伪寄存器到硬件寄存器的映射\n\n\n\n\n当我们构建 `register_map`\
  \ 时，还会追踪该函数将使用的调用者保存寄存器（callee-saved registers）集合。每当我们添加从伪寄存器（pseudoregister）到调用者保存的硬件寄存器的映射时，我们会将该硬件寄存器添加到此集合\
  \ ❷。我们会记录每个函数的 `callee_saved_regs` 集合，以便将该信息传递给指令修补（instruction fix-up）阶段 ❸。（此列表并未指定在*哪里*记录这些信息；你可以根据方便程度，将其添加到函数定义本身、后端符号表或其他数据结构中。）当我们在分配\
  \ XMM 寄存器时，可以跳过这一步，因为没有任何 XMM 寄存器是调用者保存的。\n\n最后，我们将重写汇编代码。我们将把每条指令中的每个伪寄存器替换为寄存器映射中相应的硬件寄存器。如果映射表中缺少某个伪寄存器，我们就不对其进行替换。顺便说，我们会删除任何源操作数和目的操作数指向同一个硬件寄存器的\
  \ `mov` 指令。例如，如果我们将 `tmp1` 和 `tmp2` 都映射到 EAX，我们可以重写：\n\n```\nmy_fun:\n    movl \
  \   %edi, %tmp1\n    addl    $5, %tmp1\n  ❶ movl    %tmp1, %tmp2\n  ❷ movl    %tmp2,\
  \ %eax\n    ret\n```\n\n为：\n\n```\nmy_fun:\n    movl    %edi, %eax\n    addl   \
  \ $5, %eax\n    ret\n```\n\n❶ 和 ❷ 都会被重写为 `movl %eax, %eax`，这没有任何实际作用，因此我们可以从最终的汇编程序中删掉它们。\n\
  \n这种删除必要的 `mov` 指令的清理工作与寄存器合并（register coalescing）有关，我们将在本章后面实现它。但它们之间有一些重要的区别。寄存器合并步骤会故意合并由\
  \ `mov` 连接的寄存器（如 `tmp1` 和 `tmp2`），然后删除它们之间的 `mov` 指令。整个过程将发生在为图的其他部分着色之前。我们在这里做的简单得多；我们并不是试图合并寄存器，但如果我们恰好为\
  \ `mov` 指令的两个操作数分配了相同的颜色，我们就会利用这一点。\n\n即使我们以后实现了寄存器合并，这种着色后的清理仍然是有用的。正如我们将看到的，寄存器合并遍历并不是完美的；有时它会漏掉一对本该合并有帮助的寄存器。如果我们运气好，为那对寄存器分配了相同的颜色，这最后一步仍然能够删除它们之间的\
  \ `mov` 指令。\n\n到此时，我们已经了一个可以工作的寄存器分配器！我们只需要在测试之前更新指令修补和代码发射（code emission）遍历即可。\n\
  \n### 使用调用者保存寄存器的指令修补\n\n如果函数使用了任何调用者保存寄存器，我们需要在函数开始时保存它们的值，并在结束时恢复它们。我们通过将它们推入当前栈帧的顶部来保存它们。例如，如果一个函数需要\
  \ 16 字节的栈空间用于局部变量，并使用了 R12 和 R13，我们会在函数体的最开始插入以下三条指令：\n\n```\nBinary(Sub, Quadword,\
  \ Imm(16), Reg(SP))\nPush(Reg(R12))\nPush(Reg(R13))\n```\n\n初始的 `Sub` 指令分配了当前的栈帧，就像前面的章节中一样。新的\
  \ `Push` 指令紧随其后。（如果你跳过了第二部分，第一条指令将是 `AllocateStack` 而不是 `Sub`。）\n\n在返回之前，我们将通过从栈中弹出它们来恢复这些寄存器的值。也就是说我们将重写每个\
  \ `Ret` 指令：\n\n```\nPop(Reg(R13))\nPop(Reg(R12))\nRet\n```\n\n我们可以按照任何顺序将调用者保存寄存器推入栈中，但始终以相反顺序弹出它们，以确保每个寄存器获得其原始值。\n\
  \n```\npopq    %r13\npopq    %r12\nmovq    %rbp, %rsp\nret\n```\n\n我们还需要确保整个栈是对\
  \ 16 字节对齐的。假设伪操作数遍历分配了 20 字节的栈空间。我们通常从 RSP 减去 32 字节以保持对齐。但如果函数使用一个调用者保存寄存器，我们应该减去\
  \ 24 字节：\n\n```\nBinary(Sub, Quadword, Imm(24), Reg(SP))\nPush(Reg(BX))\n```\n\n\
  列表 20-26 展示了执行此操作的方法：\n\n```\ncalculate_stack_adjustment(bytes_for_locals, callee_saved_count):\n\
  \    callee_saved_bytes = 8 * callee_saved_count\n    total_stack_bytes = callee_saved_bytes\
  \ + bytes_for_locals\n  ❶ adjusted_stack_bytes = round_up(total_stack_bytes, 16)\n\
  \  ❷ stack_adjustment = adjusted_stack_bytes - callee_saved_bytes\n    return stack_adjustment\n\
  ```\n\n### 代码发射\n\n最后，我们将更新代码发射遍历以处理 `pop` 指令以及在本章中添加的所有新寄存器。像 `push` 一样，`pop` 总是使用寄存器的\
  \ 8 位名称。表 20-4 和 20-5 描述了如何打印这些结构。（我没有像之前章节中的大多数代码发射表中那样加粗新和更改的结构，因为这些结构都是新的。）\n\
  \n\n\n\n表 20-4: 汇编指令格式化\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `Pop(reg)` | `popq` `<reg>`\
  \ |\n\n表 20-5: 汇编操作数格式化\n\n| 汇编操作数 | | 输出 |\n| --- | --- | --- |\n| `Reg(BX)` |\
  \ 8-byte | `%rbx` |\n| | 4-byte | `%ebx` |\n| | 1-byte | `%bl` |\n| `Reg(R12)` |\
  \ 8-byte | `%r12` |\n| | 4-byte | `%r12d` |\n| | 1-byte | `%r12b` |\n| `Reg(R13)`\
  \ | 8-byte | `%r13` |\n| | 4-byte | `%r13d` |\n| | 1-byte | `%r13b` |\n| `Reg(R14)`\
  \ | 8-byte | `%r14` |\n| | 4-byte | `%r14d` |\n| | 1-byte | `%r14b` |\n| `Reg(R15)`\
  \ | 8-byte | `%r15` |\n| | 4-byte | `%r15d` |\n| | 1-byte | `%r15b` |\n| `Reg(XMM8)`\
  \ | | `%xmm8` |\n| `Reg(XMM9)` | | `%xmm9` |\n| `Reg(XMM10)` | | `%xmm10` |\n| `Reg(XMM1)`\
  \ | | `%xmm1` |\n| `Reg(XMM12)` | | `%xmm2` |\n| `Reg(XMM13)` | | `%xmm13` |\n\n\
  现在你准备好在一些真实程序上尝试你的寄存分配器了！\n\n### 寄存合并（Register Coalescing）\n\n我们的寄存分配器已经可以正常工作。但正如我们在章节开头的示例所示，如果我们包含一个合并步骤，生成的代码将更加高效。早期的示例也让我们对它的工作原理有了直观的认识：我们查看每个将值从一个寄存器复制到另一个寄存器的\
  \ `mov` 指令，并决定是否合并它的源操作目的数。一旦做了这些决定，我们就会重写汇编代码，替换我们合并的寄存器并删除任何不再需要的 `mov` 指令。\n\n\
  为了决定合并哪些寄存器，我们将咨询冲突图（interference graph）。当两个两个同时同时我们会合并一对寄存器。第一个条件是显而易见的：这些寄存器之间不能相互冲突。此处复制的列表\
  \ 20-13 示例说明了为什么这个条件是必要的：\n\n```\nmovl $1, %y\nmovl %y, %x\naddl $1, %y\naddl %x,\
  \ %y\n```\n\n由于我们在 `x` 活跃期间更新了 `y`，这两个寄存器之间存在冲突。如果我们合并了它们，第一个 `add` 指令将破坏 `x`，导致最终结果是\
  \ 2 + 2 而不是 1 + 2。\n\n第二个条件更为微妙：只有当合并不会迫使我们溢出（spill）更多寄存器时，我们才会合并寄存器。为了理解为什么合并会导致溢出，让我们来看列表\
  \ 20-27。\n\n```\nf:\n    movl %edi, %arg\n    movl %arg, %tmp\n    addl $1, %tmp\n\
  \    imull %arg, %tmp\n    movl $10, %eax\n    subl %tmp, %eax\n    ret\n```\n\n\
  列表 20-27：一个合并会导致溢出的汇编函数\n\n该汇编函数计算 `10 - (arg + 1) * arg`。在这个示例中，我们假设 EDI 和 EAX\
  \ 是唯一可硬寄存器，因此 *k* 为 2。图 20-15 显示了该列表的冲突图，它显然是 2 可色的。\n\n![](img/fig20-15.jpg)\n\n\
  图 20-15: 列表 20-27 的冲突图 [描述]\n\n列表 20-27 中的第一个 `mov` 指令看起来像是合并的可能候选对象。（第二个不是，因为 `arg`\
  \ 和 `tmp` 之间存在冲突。）但如果我们尝试将 `arg` 合并到 EDI，就会遇到麻烦。我们将得到列表 20-28 中的汇编代码。\n\n```\nf:\n\
  \    movl %edi, %tmp\n    addl $1, %tmp\n    imull %edi, %tmp\n    movl $10, %eax\n\
  \    subl %tmp, %eax\n    ret\n```\n\n列表 20-28：将 `arg` 合并到 EDI 后的列表 20-27\n\n图 20-16\
  \ 显示了这段合并代码的冲突图。\n\n![](img/fig20-16.jpg)\n\n\n\n\n\n图 20-16：列表 20-28 的干扰图 描述\n\n\
  现在我们无法再对该图进行 2 色染色了。由于 `tmp` 与两个硬件寄存器都冲突，我们不得不将其溢出（spill）。这不仅没有提高性能，反而使其变糟了！将 `tmp`\
  \ 溢出到内存的代价超过了移除单个 `mov` 指令带来的收益。为了避免这种情况，我们将使用一种名为**保守合并**（`conservative coalescing`）的策略：只有当我们预先判断出合并不会让干扰图更难着色时，我们才会合并两个寄存器。但在深入研究保守合并之前，我们需要学习如何保持图的实时更新。\n\
  \n### 更新干扰图\n\n每当我们决定合并一对寄存器时，都需要更新干扰图。否则，我们将根据错误信息做出随后的合并决策。执行这种更新有两种种方法。第一种是立即重写汇编代码并从头构建图。这种方法的问题是构建干扰图的速度很慢。我们可能在一个函数中合并几十甚至几百个\
  \ `mov` 指令，但我们无法承受重建数百次干扰图的代价。\n\n一种快得的方法是在现有的干扰图中将两个节点合并，而无需引用汇编代码。在图 20-17 中，我们使用这种方法将伪寄存器\
  \ `tmp2` 合并到 EAX。\n\n![](img/fig20-17.jpg)\n\n图 20-17：更新干扰图以反映合并决策 描述\n\n我们假设任何原本与\
  \ `tmp2` 冲突的寄存器现在都与 EAX 冲突。为了让干扰图反映这一变化，我们只需要从 `tmp2` 的每个邻节点向 EAX 添加一条边，然后删除 `tmp2`。\n\
  \n但这种更新图的方法也有问题：它并不总是准确的！它可能会包含某些并不真正冲突的寄存器之间的额外边。列表 20-29 提供了一个略显刻意的例子。\n\n```\n\
  f:\n    movl    %edi, %tmp1\n    movl    %edi, %tmp2\n    addl    %tmp1, %tmp2\n\
  \    movl    %tmp2, %eax\n    ret\n```\n\n列表 20-29：一个将其第一个参数拷贝到两个不同伪寄存器的函数\n\n注意\
  \ `tmp1` 和 `tmp2` 存在冲突：第二个 `mov` 指令在更新 `tmp2` 时，`tmp1` 仍然活跃（live）。让我们尝试将 `tmp1`\
  \ 合并到 EDI，并使用我们快速简单的方法相应地更新图。图 20-18 显示了图将如何变化。\n\n![](img/fig20-18.jpg)\n\n图 20-18：为列表\
  \ 20-29 更新干扰图 描述\n\n当我们实际上用 EDI 替换 `tmp1` 时，我们会发现冲突消失了。列表 20-30 显示了更新后的代码。\n\n```\n\
  f:\n    movl    %edi, %tmp2\n    addl    %tmp1, %tmp2\n    movl    %tmp2, %eax\n\
  \    ret\n```\n\n列表 20-30：列表 20-29 [合并后]\n\n### 保守合并\n\n现在我们已经理解了合并如何改变图，就可以推导出合并何时可能导致溢出。基本问题是，当我们合并两个节点时，合并后的节点度（degree）会比原来的任何一个节点都高，这可能会使其剪枝（prune）变得困难。由于它被使用的频率更高，溢出成本也可能比原始节点中的任何一个都要高。\n\
  \n\n\n\n我们将使用两种保守合并测试（conservative coalescing tests）来确保合并节点在图染色时不会引发问题。`Briggs test`\
  \ 保证我们不会溢出（spill）合并后的节点。`George test` 则保证不会溢出任何其他节点，除非它们在原始图中已经是潜在的溢出候选节点。只有当两个伪寄存器通过\
  \ `Briggs test` 时，我们才会合并它们。如果这两个寄存器通过了任一测试，我们就会将一个伪寄存器合并到一个硬寄存器中；在这种情况下我们可以表现得宽松一些，因为我们已经知道硬寄存器不会溢出。这两项测试都以发明者的名字命名；你可以在第\
  \ 669 页的“附加资源”中找到首次提出这些测试的论文链接。\n\n有必要准确说明保守合并测试究竟保证了什么，因为这听起来有点不直直觉。如果你可以在完全不选择选择溢出候选节点的情况下完全修剪原始图，那么这些测试就能保证合并后的图也将是如此。在这种情况下，我们可以肯定定地说，合并不会导致任何溢出。\n\
  \n但如果你无法完全修剪原始图，那么预测合并的影响就会变得困难，因为在选定溢出候选节点后发生的很多事情取决于运气。我们在本章前面的部分看到过这样一个例子，当我们尝试对图\
  \ 20-12 中的图进行染色时，以不同的顺序修剪节点会导致“能够染色一个溢出候选节点”与“实际上将其溢出”之间的区别。合并寄存器可能会产生类似的连锁反应。如果我们运气不好，这些影响可能会导致我们本可以避免的溢出。\n\
  \n换句话说，如果对原始图进行染色需要我们选择溢出候选节点，那么对合并后的图进行染色也可能需要——在那个节点，无法确定地判断会发生什么。在这种情况下，保守合并测试仍然为我们提供了两个有价值的保证：首先，合并后的节点本身不会溢出。其次，在我们陷入僵局并必须选择第一个溢出候选节点时，每个节点的度（degree）将等于或低于未合并前陷入僵局时的度数。这意味着，从均衡来看，我们可能比不合并时成功修剪更多的节点，且溢出更少。\n\
  \n现在我们将仔细观察 Briggs 和 George 测试。我们将定义这两项测试，并通过一些示例来演示它们为什么有效。\n\n### Briggs 测试\n\n\
  记住，如果一个节点拥有 `k` 个或更多邻居，它就具有显著度。`Briggs test` 允许我们合并两个节点，前提是合并后的节点具有显著度的邻居少于 `k`。当我们对图染色时，我们可以修剪每一个非显著度的邻居。合并后的节点本身也将不具有显著度——它将剩下少于\
  \ `k` 个邻居——因此我们也能修剪该节点。\n\n让我们来看一个例子。考虑图 20-19 中的干扰图。\n\n![](img/fig20-19.jpg)\n\
  \n图 20-19：合并前的干扰图 description-82.xhtml)\n\n我们的染色算法可以修剪这整张图。现在让我们应用 `Briggs test`\
  \ 看看是否可以将 `x` 合并到 `y` 中。[图 20-20 展示了一旦合并这两个节点后图的样子。\n\n![](img/fig20-20.jpg)\n\n\
  图 20-20：将 x 合并到 y 后图 20-19 中的图 description-83.xhtml)\n\n合并后，`y` 将有四个邻居：`a`、`z`、`ESI`\
  \ 和 `EDI`。这些节点中只有 `ESI` 和 `EDI` 具有显著。由于 `k` 为 3，这个例子通过了 `Briggs test`。事实上，我们在修剪\
  \ `a` 和 `z` 后就能修剪 `y`，然后像之前一样完成图中其余部分。\n\n接下来，让我们来看一个失败 `Briggs test` 的情况。[图 20-21\
  \ 中的图与图 20-19 几乎完全相同，只是多了一条从 `a` 到 `EDI` 的边。\n\n![](img/fig20-21.jpg)\n\n图 20-21：图\
  \ 20-19 的变体，其中 x 和 y 不再可以合并 description-84.xhtml)\n\n即使有了这条额外的边，我们的染色算法仍然可以修剪整个图。但[图\
  \ 20-22 展示了这次我们将 `x` 合并到 `y` 时发生了什么。\n\n![](img/fig20-22.jpg)\n\n图 20-22：将 x 合并到\
  \ y 后图 20-21 中的图 description-85.xhtml)\n\n现在 `y` 有三个具有显著度的邻居：`ESI`、`EDI` 和 `a`。这个例子失败了\
  \ `Briggs test`，`y` 确实无法修剪。在我们修剪 `z` 和 `EAX` 后我们将陷入僵局，被迫选择 `y` 或 `a` 作为溢出候选节点。\n\
  \n正如这些示例所示，`Briggs test` 防止了我们将一个可染色的图转变为不可染色的图。它还给了我们另一个保证：如果合并后的节点可能会溢出，我们永远不会合并这两个节点。看看[图\
  \ 20-23。\n\n![](img/fig20-23.jpg)\n\n图 20-23：无法合并 tmp1 和 tmp2 的干扰图 [description-86.xhtml)\n\
  \n假设我们要把 `tmp2` 合并到 `tmp1`。这显然不会让图更难染色；它对干扰图的影响与完全移除 `tmp2` 相同。但由于另一个原因，合并这些节点是一个坏主意。无论是否将其与\
  \ `tmp2` 合并，我们都能染色 `tmp1`，因此合并只会因为增加 `tmp1` 的溢出成本而使情况变得糟糕。\n\n\n\n此示例未能通过 Briggs\
  \ 测试，因为 `tmp1` 在合并后仍有三个具有显著度数的邻居（与合并前的情况一样）。如果我们可能无法对其进行着色，Briggs 测试将不允许我们进行合并。\n\
  \n最后，让我们稍微修改这个示例，以说明 Briggs 测试的局限性。假设我们想将 `tmp2` 合并到 `EDI` 而不是 `tmp1`。与之前的示例一样，这不会增加图着色的难度。这未能通过\
  \ Briggs 测试，因为 `EDI` 将会有三个显著度数的邻居。但有一个重要的区别：作为一个硬寄存器，`EDI` 无法溢出（spill）。这意味着将 `tmp2`\
  \ 合并到 `EDI` 没有任何坏处；它不会迫使我们溢出 `EDI`，也不会让其他节点的着色变得困难。在这种情况下，我们将使用 George 测试来寻找 Briggs\
  \ 测试所错过的合并机会。\n\n### George 测试\n\n当我们将一个伪寄存器（pseudoregister）与一个硬寄存器合并时，我们知道合并后的寄存器无法溢出。相反，我们担心的是稍微不同的结果：如果硬寄存器变得更难被剪枝（prune），它的邻居也可能变得更难剪枝。最终，这种变化可能会迫使我们溢出那些原本可以着色的节点。在涉及硬寄存器的情况下，我们将同时使用\
  \ Briggs 测试和 George 测试来尽可能地识别合并机会。Briggs 测试证明了我们可以剪枝合并后的节点，因此它不会干扰其他节点的着色尝试。George\
  \ 测试证明了即使我们无法剪枝合并后的节点本身，也不会让合并节点的邻居变得更难剪枝（因此不会让这些节点或图其余部分的着色变得更困难）。我们可以合并通过这两个任一测试的节点对。\n\
  \nGeorge 测试指出，如果 `p` 的每个邻居满足以下两个条件之一，你就可以将伪寄存器 `p` 合并到硬寄存器 `h`：\n\n1. 它的邻居少于 `k`。\n\
  2. 它已经与 `h` 冲突（interfere）。\n\n如果一个邻居满足第一个条件，我们在着色图时一定能够剪枝它。如果它满足第二个条件，在合并后它的邻居与之前完全相同（除了\
  \ `p` 之外），因此我们不会让它的剪枝变得更困难；甚至，我们可能让它变得更容易。\n\n合并 `h` 和 `p` 也不会让 `h` 的任何邻居更难剪枝。唯一可能的方法是阻止我们剪枝\
  \ `h` 本身，但 `h` 通过合并获得的任何新邻居度数都是不的，因此它们不会影响我们剪枝它的能力。\n\n让我们再次查看图 20-23 中的图，看看为什么这样做有效：\n\
  \n![](img/pg660-1.jpg)\n\n之前，我们决定将 `tmp2` 合并到 `EDI` 是安全的，因为 `EDI` 无法溢出，且这种变化不会让其他任何节点的着色变得困难。但我们也看到这种情况未能通过\
  \ Briggs 测试，因为 `EDI` 这将会有三个显著度数的邻居。现在我们将尝试 George 测试。这个测试将会通过，因为 `tmp2` 的两个邻居都已与\
  \ `EDI` 冲突。我们的分配器会将 `tmp2` 合并到 `EDI`，因为它会合并通过我们两个测试中任一的移动操作。\n\n对于最后一个示例，让我们重新查看图\
  \ 20-15 中的图：\n\n![](img/pg660-2.jpg)\n\n上次我们看这张图时，正在考虑是否将 `arg` 合并到 `EDI`。现在我们知道不应该合并它们，因为这种情况没有通过我们两个测试中的任一。它未能通过\
  \ Briggs 测试，因为合并后的节点将有两个显著度数的邻居，`tmp` 和 `EAX`。它未能通过 George 测试；`arg` 的唯一邻居 `tmp`\
  \ 具有显著度数且与 `EDI` 不冲突。George 测试告诉我们，如果我们做出这种变化，`tmp` *可能会*变得更难着色；我们将让它与额外的寄存器冲突，而我们不知道这会产生什么影响。在这个小示例中，我们可以通过观察\
  \ `tmp` 就能看出，如果我们做出这种变化，它实际上会变得更难着色；我们将让它与额外的寄存器冲突，而我们不知道这会产生什么影响。\n\n\n\n\n在这个循环中，我们构建干扰图，然后寻找可以合并的寄存器。如果我们发现了任何此类寄存器，就会重写汇编代码并重新开始整个过程。否则，我们将退出循环并像往常运行分配器的其余部分。\n\
  \n我们在 `coalesced_regs` 中记录哪些寄存器被合并了一起，这是一个 `disjoint-set`（并集）数据结构。让我们为这个数据结构编写一个简单的实现；然后我们将定义\
  \ `coalesce` 和 `rewrite_coalesced` 函数。\n\n### 并集 (Disjoint Sets)\n\n正如名称所示，并集数据结构表示多个互不相交的值集合。每个集合由一个代表性成员标识。并集支持两个操作：`union`\
  \ 合并两个集合，`find` 查找集合的代表性成员。在我们的情况下，每个集合中的值是 `Reg` 和 `Pseudo` 操作数。初始时，每个寄存器都在一个自己的集合中。当我们合并寄存器时，将使用\
  \ `union` 操作将这些集合合并在一起。当我们重写汇编代码时，将使用 `find` 将每个寄存器替换为其所在集合的代表性成员。\n\n实现并集有几种不同的方法。我们将使用一种易于理解的简单实现。列表\
  \ 20-32 定义了我们的实现。\n\n```python\ninit_disjoint_sets():\n  ❶ return <empty map>\n\n\
  union(x, y, reg_map):\n  ❷ reg_map.add(x, y)\n\nfind(r, reg_map):\n  ❸ if r is in\
  \ reg_map:\n        result = reg_map.get(r)\n      ❹ return find(result, reg_map)\n\
  \    return r\n\nnothing_was_coalesced(reg_map):\n  ❺ if reg_map is empty:\n   \
  \     return True\n    return False\n```\n\n列表 20-32：集合的基本实现\n\n我们使用 map 来跟踪哪些集合已经合并在一起。起初，这个\
  \ map 是空的 ❶。要合并两个代表性成员分别为 `x` 和 `y` 的集合，`union` 操作会插入从 `x` 到 `y` 的映射 ❷。这使得 `y` 成为新集合的代表性成员。当我们把一个伪寄存器合并到一个硬寄存器时，让硬寄存器成为集合的代表性成员至关重要；我们不想在稍后重写代码时用伪寄存器替换硬寄存器。\n\
  \n要查找包含寄存器 `r` 的集合的代表性成员，`find` 操作首先检查 `r` 是否映射到其他寄存器 ❸。如果没有，则 `r` 本身就是其集合的代表性成员，因此我们返回它。否则，在\
  \ map 中查找将得到 `result`，即我们之前将 `r` 合并到的那个寄存器。然后我们递归地调用 `find` ❹，这将引导我们沿着从 `r` 到其代表性成员的映射链向上移动。例如，如果我们将\
  \ `a` 合并到 `b`，然后将 `b` 合并到 `c`，我们将遵循从 `a` 到 `b` 再到 `c` 的映射确定 `c` 是 `a` 的代表。\n\n我们在列表中定义的最后一个操作是\
  \ `nothing_was_coalesced`，它只是检查 map 是否为空 ❺。\n\n### coalesce 函数\n\n`coalesce` 函数将查看汇编中的每个\
  \ `mov` 指令，决定合并哪些寄存器，并在我们刚刚定义的并集中跟踪这些决策。让我们来看 列表 20-33，它提供了该函数的伪代码。\n\n```python\n\
  coalesce(graph, instructions):\n    coalesced_regs = init_disjoint_sets()\n\n  \
  \  for i in instructions:\n        match i with\n        | Mov(src, dst) ->\n  \
  \        ❶ src = find(src, coalesced_regs)\n            dst = find(dst, coalesced_regs)\n\
  \n          ❷ if (src in graph\n                and dst in graph\n             \
  \   and src != dst\n              ❸ and (not are_neighbors(graph, src, dst))\n \
  \             ❹ and conservative_coalesable(graph, src, dst)):\n\n             \
  \   if src is a hard register:\n                    to_keep = src\n            \
  \        to_merge = dst\n                else:\n                    to_keep = dst\n\
  \                    to_merge = src\n\n              ❺ union(to_merge, to_keep,\
  \ coalesced_regs)\n                update_graph(graph, to_merge, to_keep)\n\n  \
  \      | _ -> continue\n\n    return coalesced_regs\n```\n\n列表 20-33：决定合并哪些寄存器\n\
  \n\n\n\n接下来，我们决定是否合并指令的源和目的操作 ❷。首先，我们检查它们是否都在干扰图中。（这防止了我们尝试合并常数或内存操作数。）然后，我们确保它们是不同的寄存器，因为没有理由将寄存器与其自身合并。如果这些检查通过了，我们就测试之前学过的两个条件：`src`\
  \ 和 `dst` 必须不能相互干扰 ❸，并且合并它们不会让图更难着色 ❹。我们通过 `conservative_coalesceable` 函数检查这第二个条件，我们稍后会回到这里。\n\
  \n如果 `src` 和 `dst` 满足所有这些条件，我们就合并它们！现在我们必须确定在汇编代码中保留哪一个，替换哪一个。如果其中一个操作数是硬寄存器，我们将保留它并替换另一个。如果它们都是伪寄存器，我们将随机选择保留\
  \ `dst`。我们调用 `union` 来实际合并这些寄存器 ❺，然后更新干扰图。代码列表 20-34 定义了执行此更新的函数。\n\n```\nupdate_graph(graph,\
  \ x, y):\n\n    node_to_remove = get_node_by_id(graph, x)\n    for neighbor in node_to_remove.neighbors:\n\
  \        add_edge(graph, y, neighbor)\n        remove_edge(graph, x, neighbor)\n\
  \n    remove_node_by_id(graph, x)\n```\n\n代码列表 20-34: 更新干扰图\n\n该函数获取 `x` 的每个相邻节点，移除它到\
  \ `x` 的边，并转而添加一条到 `y` 的边。然后，它从图中移除 `x`。\n\n### `conservative_coalesceable` 函数\n\n\
  现在 `coalesce` 的其余已经就绪，让我们来看代码列表 20-35，它定义了保守合并测试。\n\n```\nconservative_coalesceable(graph,\
  \ src, dst):\n  ❶ if briggs_test(graph, src, dst):\n        return True\n  ❷ if\
  \ src is a hard register:\n        return george_test(graph, src, dst)\n    if dst\
  \ is a hard register:\n        return george_test(graph, dst, src)\n    return False\n\
  \nbriggs_test(graph, x, y):\n    significant_neighbors = 0\n\n    x_node = get_node_by_id(graph,\
  \ x)\n    y_node = get_node_by_id(graph, y)\n\n    combined_neighbors = set(x_node.neighbors)\n\
  \    combined_neighbors.add_all(y_node.neighbors)\n    for n in combined_neighbors:\n\
  \        neighbor_node = get_node_by_id(graph, n)\n      ❸ degree = length(neighbor_node.neighbors)\n\
  \        if are_neighbors(graph, n, x) and are_neighbors(graph, n, y):\n       \
  \   ❹ degree -= 1\n        if degree >= k:\n            significant_neighbors +=\
  \ 1\n\n  ❺ return (significant_neighbors < k)\n\ngeorge_test(graph, hardreg, pseudoreg):\n\
  \    pseudo_node = get_node_by_id(graph, pseudoreg)\n    for n in pseudo_node.neighbors:\n\
  \      ❻ if are_neighbors(graph, n, hardreg):\n            continue\n\n        neighbor_node\
  \ = get_node_by_id(graph, n)\n      ❼ if length(neighbor_node.neighbors) < k:\n\
  \            continue\n\n        return False\n    return True\n```\n\n代码列表 20-35:\
  \ 保守合并测试\n\n在 `conservative_coalesceable` 中，我们首先尝试 Briggs 测试 ❶。然后，如果 Briggs 测试失败且\
  \ `src` 或 `dst` 中任一是硬寄存器，我们就尝试 George 测试。当我们使用 George 测试时，会将硬寄存器作为第一个参数传递，将伪寄存器作为第二个参数。要应用\
  \ Briggs 测试，我们首先构建 `combined_neighbors`，它是与 `src` 或 `dst` 干扰的节点集合。然后我们遍历这个集合，将其度数调整减\
  \ 1，因此如果少于 *k* 个 `combined_neighbors` 具有显著度数 ❺，我们将返回 `True`。要应用 George 测试，我们遍历伪寄存器的相邻节点，确保每个节点要么与硬寄存器产生干扰\
  \ ❻，要么度数不显著 ❼。如果我们发现一个不满足上述任一条件的节点，我们将返回 `False`。\n\n### `rewrite_coalesced` 函数\n\
  \n我们将通过重写汇编代码来结束。代码列表 20-36 给出了这一步的伪代码。\n\n```\nrewrite_coalesced(instructions,\
  \ coalesced_regs):\n    new_instructions = []\n    for i in instructions:\n    \
  \    match i with\n        | Mov(src, dst) ->\n            src = find(src, coalesced_regs)\n\
  \            dst = find(dst, coalesced_regs)\n          ❶ if src != dst:\n     \
  \           new_instructions.append(Mov(src, dst))\n        | Binary(op, src, dst)\
  \ ->\n            src = find(src, coalesced_regs)\n            dst = find(dst, coalesced_regs)\n\
  \            new_instructions.append(Binary(op, src, dst))\n        | --snip--\n\
  \n    return new_instructions\n```\n\n代码列表 20-36: 在决定合并哪些寄存器后重写指令\n\n我们使用 `find`\
  \ 操作来替换每条指令中的每个操作数（在这里，就像在 `coalesce` 中一样，我们依赖 `find` 来正确处理非寄存器）。如果 `Mov` 指令更新后的源和目的相同，我们将在重写后的代码中省略该指令\
  \ ❶。作为一个额外收益，这还将移除任何在合并寄存器之前冗余的 `Mov` 指令。\n\n到此，你的寄存器分配器就完成了！我们不需要更改其他阶段，所以你可以去测试了。\n\
  \n### 总结\n\n在本章中，你构建了一个寄存器分配器。你利用了已经学过的关于存活分析的所有知识来构建干扰图，然后实现了一个经典的图着色算法对其着色。你引入了调用者保存寄存器并学习了如何保存和恢复它们。然后，你使用寄存器合并来清理编译器早期阶段留下的混乱。你写了最后一次优化并完成了整个项目！\n\
  \n\n\n\n\n在本书的学习过程中，你构建了一个令人印象深刻的软件：一个针对 C 语言大部分部分的优化编译器。你已经涵盖了许多领域，从 C 标准的复杂性到\
  \ System V 调用规范的琐碎细节，再到数据流分析的基础知识。但如果你想进一步提升你的编译器，你还有很多选择。我将用几个关于后续工作的建议来作为本书这部分的结束。\n\
  \n### <samp class=\"SANS_Futura_Std_Bold_B_11\">`Additional`-````-`Resources`</samp>\n\
  \n你在本章中构建的寄存分配器使用了经典 `Chaitin-Briggs algorithm` 的简化版本。本节将告诉你在哪里可以找到该算法的原始论文、几本以更易理解的方式介绍它们的教材章节，以及关于更特定主题的其他有用参考文献。\n\
  \n**核心论文**\n\n*   “Register Allocation via Coloring”，由 Gregory Chaitin 等于 1981 年发表的论文，描述了原始的图着色寄存分配器（[https://doi.org/10.1016/0096-0551(81)90048-5]）。它引入了本章中大部分基础概念，包括如何构建和着色冲突图。\n\
  \n*   Chaitin 在 1982 年发表了关于该同一分配器的更新描述“Register Allocation & Spilling via Graph\
  \ Coloring”（[https://doi.org/10.1145/872726.806984]）。\n\n*   “Improvements to Graph\
  \ Coloring Register Allocation”，由 Preston Briggs、Keith Cooper 和 Linda Torczon 于\
  \ 1994 年发表的论文，描述了 Chaitin 设计的改进版本（[https://doi.org/10.1145/177492.177575]）。`Chaitin-Briggs`\
  \ 的名称指的就是这种改进后的算法。这篇论文提出了将溢出候选节点放在栈上并稍后尝试着色它们，而不是立即溢出的技巧。（Briggs 等人将这种技术称为 `optimistic\
  \ coloring`）。它还引入了 `Briggs test` 和保守合并（conservative coalescing）的通用概念；Chaitin 的原始设计是激进合并的，即使这会使图更难着色。这篇论文还描述了一些我们在本章中没有涵盖的技巧，如重实例化（rematerialization）。\n\
  \n**教材章节**\n\n*   Steven Muchnick 著《Advanced Compiler Design and Implementation》（Morgan\
  \ Kaufmann, 1997）的第 16 章介绍了一个使用与 `Chaitin-Briggs` 类似算法的寄存分配器。最显著的区别是它没有使用保守合并；与\
  \ Chaitin 的原始分配器一样，它采用的是激进合并。我发现 Muchnick 关于如何将硬寄存器纳入冲突图、如何检测冲突以及分配器整体结构的解释特别有用。\n\
  \n*   Keith Cooper 和 Linda Torczon 著《Engineering a Compiler》第 2 版（Morgan Kaufmann,\
  \ 2011）的第 13 章对寄存分配的各种方法提供了极佳的概述，包括 `Chaitin-Briggs algorithm` 以及我们在此未讨论过的其他方法。我参考了他们对冲突的定义以及对在合并时如何更新冲突图的讨论；他们对为什么既需要快速不精确的更新，也需要缓慢完整的更新提供了非常有帮助的解释。（你也可以参考\
  \ 2022 年出版的本书第三版。）\n\n> <samp class=\"SANS_Dogma_OT_Bold_B_39\">`NOTE`</samp>\n\n\
  *如果你想实现我们跳过的那些 `Chaitin-Briggs` 的部分，这两本书都是很好的资源。如果你想将溢出代码生成集成到你的寄存分配器中，Muchnick\
  \ 的那个章节尤为有用。两本书都讨论了如何使用生存范围（Muchnick 称之为 `webs*`）而不是伪寄存器作为冲突图中的节点，并且都提供了比我们使用的更好的溢出成本指标。*\n\
  \n**保守合并**\n\n*   `George test` 来源于 Lal George 和 Andrew Appel 的“Iterated Register\
  \ Coalescing”（[https://doi.org/10.1145/229542.229546]）。该论文的核心观点是，如果你在合并和修剪之间交替进行，就可以合并更多的寄存器；`George\
  \ test` 被作为一个次要的实现细节。\n\n*   关于 `George` 和 `Briggs` 测试带有大量示例的非正式讨论，请参阅 Phillip Gibbons\
  \ 在卡内基基梅隆大学的编译器优化课程的幻灯片（[https://www.cs.cmu.edu/afs/cs/academic/class/15745-s19/lectures/L23-Register-Coalescing.pdf]）。\n\
  \n*   Max Halperin 的“Comparing Conservative coalescing”严谨地定义了 `Briggs` 和 `George`\
  \ 测试实际上证明了什么（[https://doi.org/10.1145/872726.806984]）。注意，他在第 656 页开头的某些断并不适用于我们的实现。\n\
  \n**识别循环**\n\n为了计算更准确的溢出成本，你需要检测程序中的循环。这些资源讨论了如何识别循环：\n\n*   Aho 等人著《Compilers:\
  \ Principles, Techniques, and Tools》第 2 版（Addison-Wesley, 2006）的第 9 章*）。这是一个很好的起点，但幻灯片的细节不足以作为循环分析的独立指南。你可能需要结合之前的参考文献或教材一起使用。\n\
  \n### <samp class=\"SANS_Futura_Std_Bold_B_11\">`Add`-`Some`-`Missing`-`Features`</samp>\n\
  \n\n\n\n\n我们已经看到 C 编译器可以随心所欲地处理未定义行为。但仅仅因为你*可以*做某事，并不意味着你*应该*这样做。以一种整洁、可预测的方式处理未定义行为具有巨大的好处：它能让\
  \ C 程序更安全、更易调试，而且总的来说不那么可怕。例如，你可以保证有符号整数溢出总是回绕（这就是编译器选项 `-fwrapv` 的作用）。或者，你可以让程序在遇到未定义行为时抛出错误并退出；Clang\
  \ 和 GCC 都有一个名为 `UndefinedBehaviorSanitizer` 的功能来支持这种错误处理（[https://clang.llvm.org/docs/UndefinedBehaviorSanitizer.html]）。\n\
  \n回想一下我们在书中讨论过的几个未定义行为示例。你认为你的编译器应该如何处理它们？这会对你所实现的优化产生什么影响？某些未定义行为很难检测，但另一些处理起来并不困难；选择一个看起来可以应对的，看看你是否能干净地处理它。\n\
  \n## 编写更多 TACKY 优化\n\n[第 19 章] 涵盖了你在生产级编译器中会发现的少数 IR 优化。如果你喜欢，可以自己实现更多。对常见的编译器优化进行一些研究，并挑选你听起来最有趣的。如果你走这条路线，你可能想要将你的\
  \ TACKY 代码转换为`静态单赋值 (SSA) 形式`，在这种形式中，每个变量只被定义一次。SSA 形式在真实世界的编译器（包括 Clang 和 GCC）中广泛使用，因为它让许多优化更容易实现。\n\
  \n## 支持另一个目标架构\n\n大多数生产级编译器都有几个不同的后端来支持不同的目标架构。\n\n你可以使用相同的策略，根据你针对的系统将 TACKY 转换为不同的汇编代码。如果你使用的是\
  \ Windows 或 ARM 系统，并且需要虚拟化或仿真层来完成这个项目，那么一个新的后端将让你能够编译在你的机器上原生运行的代码。\n\n如果你添加了对 Windows\
  \ 的支持，将能够复用大部分现有的代码生成阶段。只有 `ABI` 会所不同。添加 ARM 后端是一个更具野心的项目；你将学习一套完全全新的指令集。\n\n##\
  \ 为开源编程语言项目做贡献\n\n改进自己的编译器是学习的一种极佳方法，但也请考虑扩展范围参与其他项目。许多广泛使用的编译器都是开源的，并欢迎新贡献者。一系列相关项目也是如此，如解释器、linter\
  \ 和静态分析工具。挑选一个你喜欢的，并找出如何加入。这是让你新技能派上用场的好方法，甚至可能让你最喜欢的编程语言运行得更快、更安全、更易用或更易学习。\n\n\
  ## 圆满完工！\n\n我希望这本书已经为你继续构建编译器和编程语言奠定了基础。我也希望它改变了你对每天使用的编程语言的看法。现在，你将能够更好地欣赏创造这些语言时所付出的心血、努力和巧思，而且当出现问题时，你将不再害怕深入研究语言内部以弄清楚到底发生了什么。编译器将不再看起来像魔法，而开始看起来像更有趣的东西：普通的软件。\n\
  \n## 使用 GDB 或 LLDB 调试汇编代码\n\n![](img/opener-img.jpg)\n\n在编译器的开发过程中的某某个时刻，你的编译器会生成运行不正确的汇编代码，你需要弄清楚原因。当这种情况发生时，命令行调试器对于理解出了什么问题是必不可缺的。调试器允许你暂停运行中的程序、逐条指令地执行程序，并在不同点检查程序状态。你可以使用\
  \ `GDB`（GNU 调试器）或 `LLDB`（LLVM 项目的调试器）来调试你的编译器生成的汇编代码。如果你在 Linux 上，我建议使用 `GDB`；如果你在\
  \ macOS 上，建议使用 `LLDB`（我认为 `GDB` 在处理汇编时的 UI 稍微好一点，但在 macOS 上运行它可能是一个挑战）。\n\n本附录是关于使用\
  \ `GDB` 或 `LLDB` 调试汇编程序的简要指南。它介绍了如果你以前从未使用过调试器，需要了解的基础知识。它还涵盖了你在处理汇编代码时特别需要使用的最重要的命令和选项，即使你已经擅长使用这些工具调试源代码，这些内容对你来说也可能是新的。我为这两个调试器分别包含了单独的操作演示；尽管它们的功能非常相似，但许多命令的细节是不同的。请按照你正在使用的调试器的演示说明进行操作。\n\
  \n在开始之前，你应该熟悉[第 1 章]和[第 2 章]中涵盖的汇编代码基础。\n\n## 程序\n\n我们将使用[列表 A-1]中的汇编程序作为运行示例。\n\
  \n```\n.data\n    .align 4\ninteger:\n    .long 100\n    .align 8\ndbl:\n    .double\
  \ 3.5\n.text\n    .globl main\nmain:\n    pushq   %rbp\n    movq    %rsp, %rbp\n\
  \    subq    $16, %rsp\n    # 调用一个函数\n    call    f\n    # 将一些内容放入寄存器\n    movl\
  \    $0x7654321, %eax\n    # 将一些内容放入寄存器\n    movsd   dbl(%rip), %xmm0\n    # 将一些内容放入栈中\n\
  \    movl    0xdeadbeef, -4(%rbp)\n    movl    $0, -8(%rbp)\n    movl    $-1, -12(%rbp)\n\
  \    movl    $xfeedface, -16(%rbp)\n    # 初始化计数器\n    movl    $25, %ecx\n.L_loop_start:\n\
  \    # 递减计数\n    subl    $1, %ecx\n    cmpl    $0, %ecx\n    # 跳回循环\n    jne   \
  \  .L_loop_start\n    # 返回 0\n    movl    $0, %eax\n    movq    %rbp, %rsp\n   \
  \ popq    %rbp\n    ret\n    .globl f\nf:\n    movl    $1, %eax\n    ret\n.section\
  \ .note.GNU-stack,\"@progbits\n```\n\n### 列表 A-1: 一个无效程序\n\n这个程序什么都不做；它只是为我们提供了尝试调试器大多数功能的机会。它包含了我们可以检查的静态变量：`integer`\
  \ ❶ 和 `dbl` ❷。在 `main` ❸ 中，它首先调用了一个非常小的函数 `f`，我们可以练习进入和退出函数调用 ❹，然后将一些数据移动到寄存器和栈中，以便检查程序状态\
  \ ❺。它以一个每次迭代减少 ECX 的循环结束，直到达到 0 为止 ❻。我们将使用这个循环练习设置条件断点。\n\n从 [https://norasandler.com/book/#appendix-a]\
  \ 下载此程序，然后将其保存为 *hello_debugger.s*。针对 Linux 和 macOS 有两个不同版本的文件，请确保你根据自己的操作系统选择了正确的版本。\n\
  \n一旦保存了文件，对其进行汇编和链接，并确认其运行正常：\n\n```\n$ gcc hello_debugger.s -o hello_debugger\n\
  $ ./hello_debugger\n```\n\n\n\n\n\n在 macOS 上，汇编和链接文件时包含 `-g` 选项：\n\n```\n$ gcc -g\
  \ hello_debugger.s -o hello_debugger\n```\n\n`-g` 选项生成额外的调试信息。在汇编和链接你自己编译器的汇编输出进行调试时，也请确保包含它。\n\
  \n现在你可以开始演示了。如果你正在使用 GDB，请遵循下一节的演示。如果你正在使用 LLDB，请跳转到第 687 页的使用 LLDB 调试。\n\n## 使用\
  \ GDB 调试\n\n运行此命令来启动 GDB：\n\n```\n$ gdb hello_debugger\n--snip--\n(gdb)\n```\n\n\
  这会将 `hello_debugger` 设置为要调试的可执行文件，但并没有实际执行它。在我们运行此可执行文件之前，让我们配置 UI 以更容易处理汇编代码。\n\
  \n### 配置 GDB UI\n\n在 GDB 会话期间，你可以打开不同的文本窗口，显示关于运行程序的不同信息。对于我们的目的，其中最重要的是*汇编窗口*（assembly\
  \ window），它会在我们单步执行时显示汇编代码。*寄存器窗口*（register window）也有用；默认情况下，它显示每个通用寄存器的当前内容。\n\n\
  `layout` 命令控制哪些窗口可见。让我们打开汇编和寄存器窗口：\n\n```\n(gdb) layout asm\n(gdb) layout reg\n\
  ```\n\n你现在应该在终端中看到三个窗口：寄存器窗口、汇编窗口以及带有 `(gdb)` 提示符的命令窗口。看起来类似于图 A-1。\n\n![](img/figA-1.jpg)\n\
  \n*图 A-1：打开了汇编和寄存器窗口的 GDB 会话* 描述\n\n在启动程序之前，寄存器窗口将不会显示任何信息。\n\n你可以在当前聚焦的窗口中进行滚动。使用\
  \ `focus` 命令来更改聚焦窗口：\n\n```\n(gdb) focus cmd\n(gdb) focus asm\n(gdb) focus regs\n\
  ```\n\n### 启动和停止程序\n\n接下来，我们将设置一个*断点*（breakpoint）——调试器暂停程序的位置——并运行程序到该断点。如果我们不先设置断点就启动程序，它将一直运行直到结束而不停止，这没什么处。\n\
  \n`break <function name>` 命令在函数开始设置断点。让我们在 `main` 的入口处设置一个断点：\n\n```\n(gdb) break\
  \ main\nBreakpoint 1 at 0x112d\n```\n\n现在让我们启动程序：\n\n```\n(gdb) run\nStarting program:\
  \ /home/ubuntu/hello_debugger\n\n❶ Breakpoint 1, 0x000055555555512d in main ()\n\
  ```\n\n此命令的输出告诉我们程序已经遇到了我们刚刚设置的断点 ❶。注意，当前指令在汇编窗口中被高亮，通用寄存器的当前值显示在寄存器窗口中，如图 A-2 所示。\n\
  \n![](img/figA-2.jpg)\n\n*图 A-2：程序停止在断点时的 GDB 会话* 描述\n\n一旦程序暂停，可以使用几个命令让它继续运行：\n\
  \n`continue` 恢复程序并一直运行，直到我们遇到另一个断点或退出。\n\n`finish` 恢复程序并在我们从当前函数返回时再次暂停。\n\n`stepi`\
  \ 执行下一条指令，然后暂停。它会进入 `call` 指令，在调用者的第一条指令处暂停。`stepi <n>` 命令将执行 *n* 条指令。\n\n`nexti`\
  \ 执行下一条指令，然后暂停。它会跳过 `call` 指令，在当前函数中 `call` 之后的下一个指令处暂停。`nexti <n>` 命令将执行 *n* 条指令。\n\
  \n大多数 GDB 指令可以缩写为一个或两个字母：你可以输入 `c` 代替 `continue`，用 `b` 代替 `break`，用 `si` 代替 `stepi`\
  \ 等以此类推。第 687 页的表 A-1 提供了我们讨论的所有命令的完整版本和简写版本。\n\n> *当 nexti 和 stepi 命令单步执行汇编时，next\
  \ 和 step 命令单步执行源文件。由于我们没有关于源文件的任何信息，输入其中一个命令都将运行到当前函数的结束。让我们尝试一下新命令。首先，我们将执行两条指令，这应该带我们进入\
  \ ❶：*\n\n```\n(gdb) stepi 2\n0x0000555555555176 in f ()\n```\n\n我们可以从命令输出 ❶ 以及汇编窗口中高亮的指令看到，我们停在\
  \ `f` 中而不是 `main` 中。接下来，我们将从 `f` 返回：1 次 `f`：\n\n```\n(gdb) finish\nRun till exit\
  \ from #0  0x0000555555555176 in f ()\n0x0000555555555136 in main ()\n```\n\n我们现在回到了\
  \ `main`，位于 `call` 之后的指令处。让我们继续：\n\n```\n(gdb) continue\nContinuing.\n[Inferior\
  \ 1 (process 82326) exited normally]\n```\n\n由于我们没有再遇到更多断点，程序一直运行到退出。为了继续调试它，我们必须重新启动它：\n\
  \n```\n(gdb) run\nStarting program: /home/ubuntu/hello_debugger\n\nBreakpoint 1,\
  \ 0x000055555555512d in main ()\n```\n\n现在我们再次停在 `main` 的开头。我们将再次向前执行两条指令，但这次我们使用\
  \ `nexti` 来跳过 `f` 而不是进入它：\n\n```\n(gdb) nexti 2\n0x0000555555555136 in main ()\n\
  ```\n\n这回到了 `call` 之后的指令处。\n\n#### 通过地址设置断点\n\n\n\n\n\n除了在函数上设置断点外，你可以在特定的机器指令上设置断点。让我们在指令\
  \ `movl 0xdeadbeef, -4(%rbp)` 上设置断点。首先，我们在汇编窗口中找到这条指令。它看起来应该是这样：\n\n```\n ❶ 0x555555555143\
  \ ❷ <main+26>        movl    0xdeadbeef, -4(%rbp)\n```\n\n该指令在内存中的地址位于行首 ❶，随后是该地址相对于函数起始位置的字节偏移量\
  \ ❷。具体的地址在你的机器上可能不同，但偏移量应该是相同的。要设置此断点，你可以输入：\n\n```\n(gdb) break *main+26\n```\n\
  \n或者\n\n```\n(gdb) break *MEMORY_ADDRESS\n```\n\n其中 `MEMORY_ADDRESS` 是你在汇编窗口中找到的地址。`*`\
  \ 符号告诉 GDB 我们指定的是一个精确地址，而不是函数名。\n\n## 管理断点\n\n让我们列出所有已的断点：\n\n```\n(gdb) info break\n\
  Num     Type           Disp Enb Address            What\n1       breakpoint    \
  \ keep y   0x000055555555512d <main+4>\n        breakpoint already hit 1 time\n\
  2       breakpoint     keep y   0x0000555555555143 <main+26>\n```\n\n每个断点都有一个唯一的编号，当你需要删除、禁用或修改它时，可以引用该编号。让我们删除断点\
  \ 1：\n\n```\n(gdb) delete 1\n```\n\n接下来，我们将查看检查程序状态的几种方法。\n\n### 打印表达式\n\n你可以使用\
  \ `print/<format><expr>` 命令打印表达式，其中：\n\n`<format>` 是一个单字母的格式指定符。你可以使用大多数与 `printf`\
  \ 相同的格式指定符：`x` 以十六进制整数形式显示值，`d` 将其显示为有符号整数，以此此类推。\n\n`<expr>` 是任意表达式。该表达式可以引用运行程序中的寄存器、内存地址和符号。它还可以包含\
  \ C 语言操作，如算术运算、指针解引用和转换表达式。\n\n让我们尝试一些示例。现在，程序应该停在指令 `movl 0x87654321, %eax` 上。我们将执行这条指令，然后以几种不同的格式打印\
  \ EAX 的值：\n\n```\n(gdb) stepi\n--snip--\n(gdb) print $eax\n$1 = ❶ -2023406815\n\
  (gdb) print/x $eax\n$2 = ❷ 0x87654321\n(gdb) print/u $eax\n$3 = ❸ 2271560481\n```\n\
  \n默认情况下，GDB 将通用寄存器中的值格式化为有符号整数 ❶。在这里，我们还以十六进制 ❷ 和无符号整数 ❸ 显示了 EAX 中的值。符号 `$1`、`$2`\
  \ 等是*方便变量*，GDB 自动生成这些变量以用于存储每个表达式的结果。\n\n你可以在 `x` 命令的文档中找到格式指定符的完整列表，我们稍后会详细讨论：\n\
  \n```\n(gdb) help x\n--snip--\nFormat letters are o(octal), x(hex), d(decimal),\
  \ u(unsigned decimal),\n  t(binary), f(float), a(address), i(instruction), c(char),\
  \ s(string)\n  and z(hex, zero padded on the left).\n--snip--\n```\n\n第 13 章引入了\
  \ XMM 寄存器，它们存储浮点值。我们程序中的下一条指令 `movsd dbl(%rip), %xmm0` 将静态变量 `dbl` 的值 `3.5` 复制到\
  \ XMM0。让我们执行这条指令，然后检查 XMM0：\n\n```\n(gdb) stepi\n--snip--\n(gdb) print $xmm0\n$4\
  \ = {v4_float = {0, 2.1875, 0, 0}, v2_double = {3.5, 0}, v16_int8 = {0, 0, 0, 0,\
  \ 0, 0, 64, 0, 0, 0, 0, 0, 0, 0}, v8_int16 = {0, 0, 0, 16396, 0, 0, 0}, v4_int32\
  \ = {0, 1074528256, 0, 0}, v2_int64 = {4615063718147915776, 0}, uint128 = 3.5}\n\
  ```\n\nGDB 向我们展示了相同数据的许多不同视图：`v4_float` 将寄存器内容显示为 32 位浮点数数组，`v2_double` 将其显示为 64\
  \ 位双精度浮数组，以此此类推。由于我们只使用 XMM 寄存器存储单个双精度浮，你可以始终使用如下命令来检查它们：\n\n```\n(gdb) print $xmm0.v2_double[0]\n\
  $5 = 3.5\n```\n\n这以双精度数解释打印寄存器的低 64 位值。\n\n除了寄存器，我们还可以打印符号表中对象的值。让我们检查程序中的两个静态变量\
  \ `integer` 和 `dbl`：\n\n```\n(gdb) print (long) integer\n$6 = 100\n(gdb) print (double)\
  \ dbl\n$7 = 3.5\n```\n\n由于 GDB 没有关于这些对象的类型信息，我们必须显式地转换类型。让我们看一些复杂表达式的示例。除了直接引用硬件寄存器外，这些表达式使用了普通的\
  \ C 语法。我们可以进行基础算术运算：\n\n```\n(gdb) print/x $eax + 0x10\n$8 = 0x87654331\n```\n\n\
  我们可以调用定义在当前程序或标准库中的函数。在这里我们调用 `f()`，它返回 `1`：\n\n```\n(gdb) print (int) f()\n$9 =\
  \ 1\n```\n\n我们还可以解引用指针。让我们执行下一条指令 `movl 0xdeadbeef, -4(%rbp)`，然后检查 `-4(%rbp)` 的的值：\n\
  \n```\n(gdb) stepi\n--snip--\n(gdb) print/x *(int *)($rbp - 4)\n$10 = 0xdeadbeef\n\
  ```\n\n首先，我们计算想要检查的内存地址 `$rbp - 4`。然后，我们将该地址转换为正确的指针类型 `(int *)`。最后，我们使用解引用运算符 `*`\
  \ 进行解引用。这产生了一个整数，我们使用 `/x` 指定符以十六进制格式打印。\n\n接下来，我们将查看一种更灵活的检查内存的方法。\n\n### 内存\n\n\
  我们可以使用 `x/<n><format><unit> <expr>` 命令检查内存，其中：\n\n`<n>` 是要显示的内存单元数量（根据 `<unit>`\
  \ 指定单元大小）。\n\n`<format>` 指定如何格式化每个单元。这些与我们在 `print` 命令中使用的格式指定符相同。\n\n\n\n\n\n`<unit>`\
  \ 是单位大小的单字母指定符：`b` 表示字节（byte），`h` 表示 2 字节半字（halfword），`w` 表示 4 字节字（word），或 `g` 表示\
  \ 8 字节“巨字”（giant word）。\n\n`<expr>` 是一个任意表达式，求值后为有效的内存地址。这些与我们在 `print` 命令中使用的表达式类型相同。\n\
  \n让我们使用 `x` 命令来检查 `-4(%rbp)` 处的整数：\n\n```\n(gdb) x/1xw ($rbp - 4)\n❶ 0x7fffffffe2ac:\
  \ ❷ 0xdeadbeef\n```\n\n此命令告诉 GDB 以十六进制形式打印一个 4 字节字。输出包括内存地址 ❶ 和该地址处的值 ❷。\n\n在 [Listing\
  \ A-1] 中，接下来的三条指令在栈上又存储了另外三个整数：\n\n```\n movl    $0, -8(%rbp)\n    movl    $-1,\
  \ -12(%rbp)\n    movl    $0xfeedface, -16(%rbp)\n```\n\n我们将使用 [Listing A-2] 中的命令来单步执行这些指令，然后打印整个栈帧。\n\
  \n```\n(gdb) stepi 3\n(gdb) x/6xw $rsp\n0x7fffffffe2a0: ❶ 0xfeedface      0xffffffff\
  \     0x00000000     ❷ 0xdeadbeef\n0x7fffffffe2b0: ❸ 0x00000000      0x00000000\n\
  ```\n\nListing A-2: 向前执行三条指令，然后打印当前栈帧\n\n命令 `x/6xw $rsp` 告诉 GDB 从 RSP 地址开始打印六个 4\
  \ 字节字。我们打印六个字是因为该特定函数的栈帧为 24 字节。在 `main` 开始时，我们将 RBP 的旧值保存到了栈上。那是 8 字节。然后，我们通过命令\
  \ `subq $16, %rsp` 分配了另外 16 字节。请记住，RSP 始终持有栈顶的地址，即最低的栈地址。\n\n此命令显示了我们保存到栈上的四个整数，`0xfeedface`\
  \ 在顶部 ❶，`0xdeadbeef` 在底部 ❷，随后是 RBP 的旧值 ❸。在某些系统上，此值将为 0，因为我们处于最外栈帧；在其他系统上，它是一个有效的内存地址。\n\
  \n保存的 RBP 值位于当前栈帧的底部。紧随其后（调用者栈帧之上），我们将找到调用者的返回地址——即我们从 `main` 返回时将跳转到的地址。（我们在之前的章节讨论过这一点。）\n\
  \n\n\n\n\n[Table A-1] 总结了我们涵盖的命令和选项，包括每个命令的完整形式和缩写形式（`x` 除外，无法无法缩写）。两种形式接受相同的参数。\n\
  \n表 A-1：GDB 命令摘要\n\n| 命令 | 描述 |\n| --- | --- |\n| `run` | 启动程序。 |\n| `r` | |\n|\
  \ `continue` | 恢复程序。 |\n| `c` | |\n| `finish` | 恢复程序并继续执行直到当前函数退出。 |\n| `fin` |\
  \ |\n| `stepi [n]` | 执行一条指令（或 `n` 条指令），并进入函数调用。 |\n| `si` | |\n| `nexti [n]` | 执行一条指令（或\
  \ `n` 条指令），并跳过函数调用。 |\n| `ni` | |\n| `break <loc>[if <cond>]` | 在 `<loc>` 处设置断点（如果提供了\
  \ `<cond>`，则取决于该条件）。 |\n| `b` | |\n| `info break` | 列出所有断点。（其他 `info` 子命令显示其他信息。）\
  \ |\n| `i b` | |\n| `delete [id]` | 删除所有断点（或由 `id` 指定的断点）。 |\n| `d` | |\n| `print/<format>\
  \ <expr>` | 评估 `<expr>` 并根据格式 `<format>` 显示结果。 |\n| `p` | |\n| `x/<n><unit> <addr>`\
  \ | 输出从 `<addr>` 开始的 `n` 个大小为 `<unit>` 的内存块，根据 `<format>` 格式化。 |\n| `layout <window>`\
  \ | 打开 `<window>`。 |\n| `la` | |\n| `focus <window>` | 将焦点切换到 `<window>`。 |\n| `help\
  \ <cmd>` | 显示关于 `<cmd>` 的帮助文本。 |\n| `h` | |\n\n现在你准备好使用 GDB 开始调试了！\n\n## 使用 LLDB\
  \ 调试\n\n运行此命令来启动 LLDB：\n\n```\n$ lldb hello_debugger\n(lldb) target create \"hello_debugger\"\
  \nCurrent executable set to 'hello_debugger' (x86_64).\n(lldb)\n```\n\n这会将 `hello_debugger`\
  \ 设置为调试的可执行文件，但尚未执行它。如果提示，请输入你的用户名和密码以赋予 LLDB 控制 `hello_debugger` 的权限。\n\n### 启动和停止程序\n\
  \n接下来，我们将设置一个*断点*——调试器暂停程序的位置——并运行程序到该断点。如果我们在不设置断点的情况下启动程序，它将一直运行到底而不停止，这不会很有用。\n\
  \n让我们在 `main` 的入口处设置一个断点：\n\n```\n(lldb) break set -n main\nBreakpoint 1: where\
  \ = hello_debugger`main, address = 0x0000000100003f65\n```\n\n注意，`main` 在你的机器上可能位于内存地址。`break\
  \ set` 命令创建一个新断点；`-n` 选项指定我们想要中断的函数名称。稍后我们将查看设置断点的其他方法。\n\n现在让我们运行程序：\n\n\n\n\n\n\
  ```\n(lldb) run\nProcess 6750 launched: '/Users/me/hello_debugger' (x86_64)\nProcess\
  \ 6750 stopped\n* thread #1, queue = 'com.apple.main-thread', ❶ stop reason = breakpoint\
  \ 1.1\n    frame #0: 0x0000000100003f65 hello_debugger`main\n❷ hello_debugger`main:\n\
  ❸ ->  0x100003f65 <+0>: pushq  %rbp\n    0x100003f66 <+1>: movq   %rsp, %rbp\n \
  \   0x100003f69 <+4>: subq   $0x10, %rsp\n    0x100003f6d <+8>: callq  0x100003fb2\
  \               ; f\nTarget 0: (hello_debugger) stopped.\n(lldb)\n```\n\n`stop reason`\
  \ ❶ 告诉我们程序已经了我们刚刚设置的断点。LLDB 还贴心地告诉我们，停在了 `hello_debugger` ❷ 中的 `main` 函数中，并打印了接下来的几条汇编指令\
  \ ❸。\n\n一旦程序暂停，我们可以使用几个命令来继续执行它：\n\n- `continue` 恢复程序并运行，直到我们遇到另一个断点或程序退出。\n- `finish`\
  \ 恢复程序，并在从当前函数返回时再次暂停。\n- `stepi` 执行下一条指令，然后暂停。它会进入 `call` 指令，在被调用函数的第一条指令处暂停。命令\
  \ `stepi -c <n>` 会执行 *n* 条指令。\n- `nexti` 执行下一条指令，然后暂停。它会跳过 `call` 指令，在当前函数 `call`\
  \ 之后的下一条指令处暂停。命令 `nexti -c <n>` 会执行 *n* 条指令。\n\n大多数 LLDB 命令都有几个别名。例如，`continue`\
  \ 是 `process continue` 的快捷方式，它还可以进一步缩短为单字母命令 `c`。请参阅第 697 页 的表格 A-2，获取我们所涵盖的所有命令的完整版本和简称。\n\
  \n让我们尝试一下这些新命令。首先，我们将执行四条指令，这应该带我们进入对 `f` 的调用：\n\n```\n(lldb) stepi -c 4\n--snip--\n\
  ❶ hello_debugger`f:\n->  0x100003fb2 <+0>: movl   $0x1, %eax\n--snip--\n```\n\n\
  我们可以从命令输出中看到，我们停在了 `f` 中而不是 `main` 中 ❶。现在我们将从 `f` 返回：\n\n```\n(lldb) finish\n--snip--\n\
  hello_debugger`main:\n->  0x100003f72 <+13>: movl   $0x87654321, %eax         ;\
  \ imm = 0x87654321\n--snip--\n```\n\n这让我们回到了 `main`，位于 `callq` 之后的的一条指令。让我们继续：\n\
  \n```\n(lldb) continue\nProcess 6750 resuming\nProcess 6750 exited with status =\
  \ 0 (0x0000000)\n```\n\n由于我们没有遇到任何断点，程序一直运行到退出。为了继续调试，我们必须重启它：\n\n```\n(lldb) run\n\
  ```\n\n现在我们再次停在 `main` 的开头。同样，我们将向前移动指令，但这次我们将使用 `nexti` 来跳过 `f` 而不是进入它：\n\n```\n\
  (lldb) nexti -c 4\n--snip--\nhello_debugger`main:\n->  0x100003f72 <+13>: movl \
  \  $0x87654321, %eax         ; imm = 0x87654321\n--snip--\n```\n\n这让我们回到了 `callq`\
  \ 之后的一条指令。\n\n#### 通过地址设置断点\n\n除了在函数上设置断点外，你还可以在特定的机器指令上设置断点。让我们在指令 `movl 0xdeadbeef,\
  \ -4(%rbp)` 上设置断点。首先，我们需要找到这条指令的地址。幸运的是，LLDB 已经给了我们这些信息。上一个命令的输出看起来如下：\n\n```\n\
  hello_debugger`main:\n->  0x100003f72 <+13>: movl   $0x87654321, %eax         ;\
  \ imm = 0x87654321\n    0x100003f77 <+18>: movsd  0x18(%rip), %xmm0        ; dbl,\
  \ xmm0 = mem[0],zero\n  ❶ 0x100003f7f ❷ <+26>: movl   $0xdeadbeef, -4(%rbp)   ;\
  \ imm = 0xDEADEEF\n    0x100003f86 <+33>: movl   $0x0, -8(%rbp)\n```\n\n这显示了接下来的几条指令，包括我们想要中断的那条。我们可以看到指令的内存地址\
  \ ❶ 以及它相对于函数的偏移量 ❷。具体的地址在你的机器上可能会不同，但偏移量应该是相同的。要设置这个断点，输入：\n\n```\n(lldb) break\
  \ set -a MEMORY_ADDRESS\n```\n\n其中 `MEMORY_ADDRESS` 是你机器上的地址。`-a` 表示我们指定的是地址而不是函数名。我们也可以使用更复杂的表达式来指定指令。这里是设置该断点的另一种方法：\n\
  \n```\n(lldb) break set -a '(void()) main + 26\n```\n\n首先，我们将 `main` 转换为函数类型以便进行计算（将其转换为哪种函数类型都所谓）。然后，我们加上\
  \ 26 字节的偏移量以获取我们要中断的指令地址。由于此地址表达式包含空格，我们必须将其封装在引号中。\n\n稍后我们将查看如何反汇整个函数并查看每条指令的地址。首先，让我们几个管理断点的有用命令。\n\
  \n#### 管理断点\n\n列出我们设置的所有断点：\n\n```\n(lldb) break list\nCurrent breakpoints:\n1:\
  \ name = 'main', locations = 1, resolved = 1, hit count = 1\n  1.1: where = hello_debugger`main,\
  \ address = 0x0000000100003f65, resolved, hit count = 1\n\n2: address = hello_debugger[0x0000000100003f7f],\
  \ locations = 1, resolved = 1, hit count = 0\n  2.1: where = hello_debugger`main\
  \ + 26, address = 0x0000000100003f7f, resolved, hit count = 0\n\n3: address = hello_debugger[0x0000000100003f7f],\
  \ locations = 1, resolved = 1, hit count = 0\n  3.1: where = hello_debugger`main\
  \ + 26, address = 0x0000000100003f7f, resolved, hit count = 0\n```\n\n每个断点都有一个唯一的编号，当你需要删除、禁用或修改它时可以引用该编号。在上一节中，我们在同一位置设置了断点\
  \ 2 和 3。让我们删除其中一个：\n\n```\n(lldb) break delete 3\n```\n\n接下来，我们将查看如何反汇编整个函数并查看每条指令的地址。\n\
  \n\n\n\n\n命令 `disassemble -n function()` 告诉 LLDB 打印出函数中所有的汇编指令。让我们在 `main` 上尝试一下：\n\
  \n```\n(lldb) disassemble -n main\nhello_debugger`main:\n    0x100003f65 <+0>: \
  \ pushq  %rbp\n    0x100003f66 <+1>:movq   %rsp, %rbp\n    0x100003f69 <+4>:  subq\
  \   $0x10, %rsp\n    0x100003f6d <+8>:  callq  0x100003fb2               ; f\n->\
  \  0x100003f72 <+13>: movl   $0x87654321, %eax         ; imm = 0x87654321\n    0x100003f77\
  \ <+18>: movsd  0x181(%rip), %xmm0        ; dbl, xmm0 = mem[0],zero\n    0x100003f7f\
  \ <+26>: movl   $0xdeadbeef, -0x4(%rbp)   ; imm = 0xDEADBEEF\n    0x100003f86 <+33>:\
  \ movl   $0x0, -0x8(%rbp)\n    0x100003f8d <+40>: movl   $0xffffffff, -0xc(%rbp)\
  \   ; imm = 0xFFFFFFFF\n    0x100003f94 <+47>: movl   $0xfeedface, -0x10(%rbp) \
  \ ; imm = 0xFEEDFACE\n    0x100003f9b <+54>: movl   $0x19, %ecx\n    0x100003fa0\
  \ <+59>: subl   $0x1, %ecx\n    0x100003fa3 <+62>: cmpl   $0x0, %ecx\n    0x100003fa6\
  \ <+65>: jne    0x100003fa0               ; <+59>\n    0x100003fa8 <+67>: movl \
  \  $0x0, %eax\n    0x100003fad <+72>: movq   %rbp, %rsp\n    0x100003fb0 <+75>:\
  \ popq   %rbp\n    0x100003fb1 <+76>: retq\n(lldb)\n```\n\n`->` 符号指向当前指令。我们也可以从特定地址开始，打印固定数量的指令。让我们从\
  \ `main` 中的第三条指令开始，反汇编五条指令。在此显示的反汇编代码中，该指令的地址是 `0x100003f69`；它在你的机器上地址可能会不同。`-s`\
  \ 选项指定 LLDB 开始反汇编的地址，而 `-c` 指定要显示的指令数量，因此我们将使用以下命令反汇编这五条指令：\n\n```\n(lldb) disassemble\
  \ -s 0x100003f69 -c 5\nhello_debug`main:\n    0x100003f69 <+4>:  subq   $0x10, %rsp\n\
  \    0x100003f6d <+8>:  callq  0x100003fb2               ; f\n->  0x100003f72 <+13>:\
  \ movl   $0x87654321, %eax         ; imm = 0x87654321\n    0x100003f77 <+18>: movsd\
  \  0x181(%rip), %xmm0        ; dbl, xmm0 = mem[0],zero\n    0x100003f7f <+26>: movl\
  \   $0xdeadbeef, -0x4(%rbp)   ; imm = 0xDEADBEEF\n```\n\n最后，我们可以使用 `--pc` 选项从当前指令开始反汇编：\n\
  \n```\n(lldb) disassemble --pc -c 3\n->  0x100003f72 <+13>: movl   $0x87654321,\
  \ %eax         ; imm = 0x87654321\n    0x100003f77 <+18>: movsd  0x181(%rip), %xmm0\
  \        ; dbl, xmm0 = mem[0],zero\n    0x100003f7f <+26>: movl   $0xdeadbeef, -0x4(%rbp)\
  \   ; imm = 0xDEADBEE\n```\n\n该命令显示从当前指令开始的三条指令。当我们使用 `-s` 或 `--pc` 指定起始地址时，可以使用\
  \ `-c` 选项，但在使用 `-n` 反汇编整个函数时则不需要。\n\n### 打印表达式\n\n你可以使用 `exp -f <format>` 命令评估表达式。\n\
  \n\n\n\n首先，我们计算想要检查的内存地址 `$rbp - 4`。然后，我们将该地址强制转换为正确的指针类型 `(int *)`。最后，我们使用解引用运算符\
  \ `*` 对其进行解引用。这将产生一个整数，我们使用 `-f x` 选项以十六进制格式打印它。\n\n接下来，我们将查看一种检查内存值更灵活的方法。\n\n\
  ### 检查内存\n\n我们可以使用 `memory read` 命令来检查内存。像 `exp` 一样，它接受一个任意表达式，该表达式必须求值为有效的内存地址。这为我们检查\
  \ `-4(%rbp)` 处的整数提供了另一种方法：\n\n```\n(lldb) memory read -f x -s 4 -c 1 '$rbp - 4'\n\
  0x3040bb93c: 0xdeadbeef\n```\n\n`-f x` 选项表示以十六进制输出结果；`-s 4` 表示将内存内容解释为 4 字节值的序列；`-c\
  \ 1` 表示只打印这些值中的一个。换句话说，该命令以十六进制格式打印 `$rbp - 4` 处的单个 4 字节整数。我们必须将表达式 `$rbp - 4` 包在引号中，因为它包含空格。\n\
  \n列表 A-1 中的接三条指令在栈上又存储了三个整数：\n\n```\n movl    $0, -8(%rbp)\n    movl    $-1, -12(%rbp)\n\
  \    movl    $0xfeedface, -16(%rbp)\n```\n\n让我们逐步执行这些指令，然后打印整个栈帧。我们将告诉 LLDB 从 RSP\
  \ 中的地址开始打印 6 个 4 字节的字。我们将使用 `-l 1` 选项将每个字单独打印一行：\n\n```\n(lldb) stepi -c 3\n--snip--\n\
  hello_debugger`main:\n->  0x100003f9b <+54>: movl   $0x19, %ecx\n--snip--\n(lldb)\
  \ memory read -f x -s 4 -c 6 $rsp\n0x3040bb930: 0xfeedface\n0x3040bb934: 0xffffffff\n\
  0x3040bb938: 0x00000000\n0x3040bb93c: 0xdeadbeef\n0x3040bb940: 0x040b50\n0x3040bb944:\
  \ 0x00000003\n```\n\n我们打印了六个字是因为在这个函数中栈占 24 字节。在 `main` 的开始处，我们将 RBP 的旧值保存到栈上。那是\
  \ 8 字节。然后，我们通过命令 `subq $16, %rsp` 分配了另外 16 字节。记住，RSP 始终持有栈顶的地址，即最低地址。\n\n此命令向我们展示了保存到栈四个整数，其中\
  \ `0xfeedface` 位于顶部 ❶，RBP 的旧值位于底部 ❷。由于 ❷ 处的值实际上是一个 8 字节的地址，如果我们将栈分组为 8 字节的值，就可以更容易地读取它：\n\
  \n```\n(lldb) memory read -f x -s 8 -c 3 $rsp\n0x3040bb930: 0xfffffffffeedface\n\
  0x3040bb938: 0xdeadbeef00000000\n0x3040bb940: 0x00000003040b50\n```\n\n现在很清楚了，栈底部的\
  \ 8 字节持有一个单一内存地址 ❶。\n\n在保存的 RBP 值正下方，即调用者栈帧的顶部，我们期望找到调用者的返回地址——即我们从 `main` 返回时将跳转到的地址。（我们将在第\
  \ 9 章实现函数调用时详细介绍这一点。）让我们检查这个地址：\n\n```\n(lldb) memory read -f A -s 8 -c 4 -l 1 $rsp\n\
  0x3040bb930: 0xfffffffffeedface\n0x3040bb938: 0xdeadbeef00000000\n0x3040bb940: 0x00000003040b50\n\
  0x3040bb948: 0x0000000200012310 dyld`start + 2432\n```\n\n此命令与上一个几乎相同，不同在于我们使用 `-c\
  \ 4` 选项打印四个值而不是三个，并使用 `-f A` 选项将每个值格式化为内存地址。`A` 格式说明符告诉 LLDB 以十六进制格式打印每个地址，并在可能的情况下打印其相对于程序中最近符号的偏移量。由于函数名和静态变量名定义在符号表中，LLDB\
  \ 可以显示汇编指令和静态数据的相对偏移量。它不会显示栈地址、堆地址或无效地址的相对偏移量，因为那些将完全没有意义。\n\n输出的前三行与之前相同。前两个值不是有效的内存地址，第三个是栈地址，因此\
  \ LLDB 无法显示它们相对于符号的偏移。栈上的下一个值是返回地址 ❶。标签 `dyld`start` 告诉我们这是 `dyld` 库中的函数。（`start`\
  \ 函数负责调用 `main` 并在退出后进行清理。）\n\n`-f A` 选项可以轻松识别返回地址和指向静态变量的指针。如果程序的栈帧损坏，这非常有用；找到栈帧的返回地址可以帮助你定位。\n\
  \n### 设置条件断点\n\n为了结束这次演示，我们将查看如何设置条件断点。程序只有在条件为真时会在条件断点处暂停。该条件可以是任意表达式；LLDB 在其求值为\
  \ 0 时视为假，否则视为真。\n\n让我们在 `main` 最后一次迭代的 `jne` 指令处设置断点。首先，我们在反汇编的 `main` 函数找到该指令的地址：\n\
  \n```\n(lldb) disassemble -n main\nhello_debugger`main:\n    --snip--\n  ❶ 0x100003fa6\
  \ <+65>:  jne    0x10003fa0               ; <+59>\n    --snip--\n```\n\n在这里，`jne`\
  \ 的地址是 `0x100003fa6` ❶。现在我们将设置条件断点，当 ECX 为 0 时在 `jne` 指令处暂停。我们可以使用 `-c` 选项来指定条件：\n\
  \n```\n(lldb) break set -a MEMORY_ADDRESS -c '$ecx == 0'\n```\n\n由于此循环一直持续到 ECX\
  \ 为 0，条件 `$ecx == 0` 只在最后一次迭代为真。让我们继续到断点，然后验证该条件是否为真：\n\n```\n(lldb) continue\n\
  --snip--\nhello_debugger`main:\n->  0x100003fa6 <+65>:  jne    0x10003fa0      \
  \         ; <+59>\n--snip--\n(lldb) exp -- $ecx\n(unsigned int) $9 = 0\n```\n\n\
  如果你得到的 ECX 值不同，请检查你是否正确设置了断点：\n\n\n\n\n```\n(lldb) break list\n--snip--\n4: address\
  \ = hello_debugger[0x0000000100003fa6], locations = 1, resolved = 1, hit count =\
  \ 0\nCondition: $ecx == 0 ❶\n\n  4.1: where = ❷ hello_debugger`main + 65, address\
  \ = 0x0000000100003fa6, resolved, hit count\n = 0\n```\n\n请确保你的断点包含了条件 `$ecx ==\
  \ 0` ❶，并且它位于位置 `hello_debugger`main + 65` ❷。如果你的断点看起来与此不同，你可能拼写了某些内容；请将其删除并重试。\n\
  \n我们应该处于最后一次循环迭代，所以让我们向前执行一条指令，并确保跳转没有发生：\n\n```\n(lldb) stepi\n--snip--\nhello_debugger`main:\n\
  ->  0x100003fa8 <+67>:  movl   $0x0, %eax\n--snip--\n```\n\n通常，`jne` 会跳回循环开始，但在最后一次迭代中，它会移动到下一条指令。\n\
  \n### 获取帮助\n\n要了解更多关于此处未涵盖的命令和选项，请参阅 LLDB 文档 [https://lld.llvm.org/index.html]。你也可以在提示符处输入\
  \ `help` 来进一步了解任何 LLDB 命令。例如，要查看 `run` 命令的文档，请输入：\n\n```\n(lldb) help run\n    \
  \ 在调试器中启动执行文件\n--snip--\n```\n\n表 A-2 总结了我们涵盖的命令和选项。我们在演示使用的每个命令的版本列在前，后面是较短的缩写（`exp`\
  \ 通常不进一步缩写），如果与我们使用的版本不同，则列出完整形式。每个命令的所有版本接受相同的参数。\n\n**表 A-2：LLDB 命令摘要**\n\n| 命令\
  \ | 描述 |\n| --- | --- |\n| `run` | 启动程序。 |\n| `r` | |\n| `process launch --` | |\n\
  | `continue` | 继续运行程序。 |\n| `c` | |\n| `process continue` | |\n| `finish` | 继续运行程序并持续到当前函数退出。\
  \ |\n| `fin` | |\n| `thread step-out` | |\n| `stepi [-c [n]]` | 执行一条指令（或 `n` 条指令），并进入函数调用。\
  \ |\n| `si` | thread step-inst |\n| `next [-c [n]]` | 执行一条指令（或 `n` 条指令），跳过函数调用。\
  \ |\n| `ni` | thread step-inst-over |\n| `break set [-n [fun]; -a [addr]] [-c [cond]]`\
  \ | 在函数 `fun` 开始处或地址 `addr` 处设置断点（如果提供了 `cond`，取决于条件）。 |\n| `br s` | breakpoint\
  \ set |\n| `break list` | 列出所有断点。 |\n| `br l` | breakpoint list |\n| `break delete\
  \ [id]` | 删除所有断点（或由 `id`指定的断点）。 |\n| `br del` | breakpoint delete |\n| `exp -f [format]\
  \ -- [expr]` | 评估 `expr` 并以格式 `format` 显示结果。 |\n| `expression` | |\n\n\n\n\n\n|\
  \ `memory read -f <format> -s <size> -c <count> -l <num-per-line> <addr>` | 从地址\
  \ `<addr>` 开始，以 `<size>` 字节为块打印 `<count>` 块内存内容。每行以 `<format>` 格式显示 `<num-per-line>`\
  \ 块。 |\n| `me read` | |\n| `disassemble [-n <fun> | -s <addr>-c <count> | --pc -c\
  \ <count>]` | 反汇编函数 `<fun>` 中的所有指令，或从地址 `<addr>` 开始的 `<count>` 条指令，亦或从当前指令开始的 `<count>`\
  \ 条指令。 |\n| `di` | |\n| `help <cmd>` | 显示关于 `<cmd>` 的帮助文本。 |\n| `h` | |\n\n现在，你已经准备好使用\
  \ LLDB 开始调试了！\n\n## 汇编生成与代码发射表\n\nopener-img.jpg\n\n在每个更新了从汇编转换或代码发射阶段的章节中，我都包含了表格。从第\
  \ 4 章开始，这些表格仅显示该章节中所做的更改，而不是整个阶段。本附录提供了汇总第一部分、第二部分和第三部分末尾这些阶段的完整表格。\n\n## 第一部分\n\
  \n本节的第一组表格说明了你的编译器在第一部分结束时应如何将每个结构转换为汇编。第二组表格说明了你的编译器在第一部分结束时应如何发射每个汇编结构。\n\n###\
  \ 转换为汇编\n\n表格 B-1 到 B-5 显示了第一部分结束时从汇编到汇编的完整转换。\n\n#### 表格 B-1：将顶层结构转换为汇编\n\n| 顶层结构\
  \ | 汇编顶层结构 |\n| :--- | :--- |\n| `Program(top_level_defs)` | `Program(top_level_defs)`\
  \ |\n| `Function(name, global, params)` | `Function(name, global, Mov(DI), param1),\
  \ Mov(SI), param2), <从寄存器拷贝四个参数>, Mov(Stack(16), param7), Mov(Stack(24), param8),\
  \ <从栈中拷贝剩余参数>` |\n| `StaticVariable(name, global, init)` | `StaticVariable(name,\
  \ global, init)` |\n\n#### 表格 B-2：将指令转换为汇编\n\n| TACK 指令 | 汇编指令 |\n| :--- | :---\
  \ |\n| `Return(val)` | `Mov(val, Reg(AX)), Ret` |\n| `Unary(Not, src, dst)` | `Cmp(Imm(0),\
  \ src), Mov(Imm(0), dst), SetCC(E, dst)` |\n| `Unary(unary_operator, src, dst)`\
  \ | `Mov(src, dst), Unary(unary_operator, dst)` |\n| `Binary(Divide, src1, src2,\
  \ dst)` | `Mov(src1, Reg(AX)), Cdq, Idiv(src2), Mov(Reg(AX), dst)` |\n| `Binary(Remainder,\
  \ src1, src2, dst)` | `Mov(src1, Reg(AX)), Cdq, Idiv(src2), Mov(Reg(DX), dst)` |\n\
  | `Binary(arithmetic_operator, src1, src2, dst)` | `Mov(src1, dst), Binary(arithmetic_operator,\
  \ src2, dst)` |\n| `Binary(relational_operator, src1, src2, dst)` | `Cmp(src2, src1),\
  \ Mov(Imm(0), dst), SetCC(relational_operator, dst)` |\n| `Jump(target)` | `Jmp(target)`\
  \ |\n| `JumpIfZero(condition, target)` | `Cmp(Imm(0), condition), JmpCC(E, target)`\
  \ |\n\n\n\n\n\n| `JumpIfNotZero(condition, target)` | `Cmp(Imm(0),)`) `JmpCC(NE,\
  \ target)` |\n| `Copy(src, dst)` | `Mov(src, dst)` |\n| `Label(identifier)` | `Label(identifier)`\
  \ |\n| `FunCall(fun_name, args, dst)` | `<fix stack alignment>` `<set up arguments>`\
  \ `Call(fun_name)` `<deallocate arguments/padding>` `Mov(Reg(AX), dst)` |\n\n**表\
  \ B-3:** 将 TACKY 算术运算符转换为汇编\n\n| TACKY 运算符 | 汇编操作符 |\n| --- | --- |\n| `Complement`\
  \ | `Not` |\n| `Negate` | `Neg` |\n| `Add` | `Add` |\n| `Subtract` | `Sub` |\n|\
  \ `Multiply` | `Mult` |\n\n**表 B-4:** 将 TACKY 比较操作转换为汇编\n\n| TACKY 比较 | 汇编条件码 |\n\
  | --- | --- |\n| `Equal` | `E` |\n| `NotEqual` | `NE` |\n| `LessThan` | `L` |\n\
  | `LessOrEqual` | `LE` |\n| `GreaterThan` | `G` |\n| `GreaterOrEqual` | `GE` |\n\
  \n**表 B-5:** 将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n| --- | --- |\n| `Constant(int)`\
  \ | `Imm(int)` |\n| `Var(identifier)` | `Pseudo(identifier)` |\n\n### 代码发射\n\n表\
