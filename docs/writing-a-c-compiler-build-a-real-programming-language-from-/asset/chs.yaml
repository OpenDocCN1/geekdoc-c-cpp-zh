  \ |\n| | 无符号或双精度 | BE |\n| `GreaterThan` | 有符号 | G |\n| | 无符号或双精度 | A |\n| `GreaterOrEqual`\
  \ | 有符号 | GE |\n\n\n\n\n\n## 表 13-6：将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n\
  | --- | --- |\n| `Constant(ConstDouble(double))` | |\n\n```\nData(<ident>) \nAnd\
  \ add top-level constant: \nStaticConstant(<ident>, 8, DoubleInit(double))\n```\
  \ |\n\n## 表 13-7：将类型转换为汇编\n\n| 源类型 | 汇编类型 | 对齐 |\n| --- | --- | --- |\n| `Double`\
  \ | `Double` | `8` |\n\n如表 13-2 中对应顶层 `Program` 构造的行所示，你需要将在此次遍历中定义的每个 `StaticConstant`\
  \ 都添加到顶层定义列表中。从这一点开始，更新后端的其余部分将非常顺畅。\n\n### 伪寄存器替换\n\n你应当为每个 `double` 伪寄存器在栈上分配\
  \ 8 字节空间，并确保它是 8 字节对齐的。如果后端符号表显示 `double` 具有静态存储持续时间，你应当将对它的任何引用替换为 `Data` 操作数，就像处理其他静态变量那样。简而言之，这次遍历可以相同对待\
  \ `Double` 和 `Quadword` 伪寄存器，因为它们具有相同的大小和对齐。\n\n如往常，你还应该扩展这次遍历以处理本章中的新汇编指令。\n\n\
  ### 指令修复\n\n接下来，我们将重写无效的 SSE 指令。我们还需要重写操作整数的新位运算指令。让我们先处理 SSE 指令。你应该分配一个 XMM 寄存器用于修复指令源操作数，另一个用于修复目标。我将使用\
  \ `XMM14` 用于前者，使用 `XMM15` 用于后者。\n\n`cvttsd2si` 的目标必须是一个寄存器。例如，我们将重写：\n\n```\nCvttsd2si(Quadword,\
  \ Stack(-8), Stack(-16))\n```\n\n为：\n\n```\nCvttsd2si(Quadword, Stack(-8), Reg(R11))\n\
  Mov(Quadword, Reg(R11), Stack(-16))\n```\n\n`cvtsi2sd` 指令有两个限制：源不能是常数，且目标必须是寄存器。因此，我们将重写：\n\
  \n```\nCvtsi2sd(Longword, Imm(10), Stack(-8))\n```\n\n为：\n\n```\nMov(Longword, Imm(10),\
  \ Reg(R10))\nCvtsi2sd(Longword, Reg(R10), Reg(XMM15))\nMov(Double, Reg(XMM15), Stack(-8))\n\
  ```\n\n`comisd` 指令的限制与 `cmp` 不同。它的位于“目标”位置的第二个操作数必须是寄存器。所以，我们将重写：\n\n```\nCmp(Double,\
  \ Stack(-8), Stack(-16))\n```\n\n为：\n\n```\nMov(Double, Stack(-16), Reg(XMM15))\n\
  Cmp(Double, Stack(-8), Reg(XMM15))\n```\n\n`addsd`、`subsd`、`mulsd`、`divsd` 或 `xorpd`\
  \ 的目标必须是寄存器。`xorpd` 指令还需要 16 字节对齐的内存地址作为其源，但我们不需要为此重写，因为我们生成的 `xorpd` 已经满足了这一点。我们将使用之前为通用\
  \ `mov` 引入的 `movsd`。`and`、`or`、`shr` 指令受到 `add` 和 `sub` 相同的限制：操作数不能是内存，且不能接受 `int`\
  \ 范围之外的立即操作数。我们还有一个目前可以忽略的限制：`push` 指令不能压入 XMM 寄存器。我们将等到下一章再为 `push` 添加重写规则，因为它将使用一种新的操作数。\n\
  \n### 代码发射\n\n如既往，最后一步是打印 AST 中新添加的内容。这次遍历中最繁琐的部分是发射浮点常数和变量。让我们来看看如何格式化浮点数、如何标记浮点常数，以及如何将浮点变量存储在正确的区域。\n\
  \n#### 格式化浮点数\n\n在汇编中格式化浮点数有几种不同的方法。一种是将这些数字打印为*十六进制浮点*常数，其中尾数是十六进制数，指数是 2 的幂。这种表示法可以精确表示\
  \ `double`，而无需任何舍入。十六进制浮点常数的尾数带有 `0x` 前缀，指数带有 `p` 或 `P` 前缀。例如，十六进制浮点中的 `20.0` 是\
  \ `0x2.8p+3`。十六进制数 `0x2.8` 在十进制中是 2.5，而 2.5 × 2³ = 20。我们可以在 `.double` 指令中使用这种表示法，如下：\n\
  \n```\n.L_twenty:\n    .double 0x2.8p+3\n```\n\n\n\n\n当你使用这种符号发射一个 `double` 时，你最多需要\
  \ 14 个十六进制数字来精确表示它。不幸的是，并不是所有的汇编器都理解这种格式。macOS 上的默认汇编器支持它，但 GNU 汇编器（GAS）则不支持。\n\n\
  如果你的汇编器不支持十六进制浮点常数，你可以发射一个与所需的 `double` 二进制表示相同的四字 word（quadword）。通过这种方法打印 `20.0`\
  \ 的结果如下：\n\n```\n.L_twenty:\n    .quad 4626322717216342016\n```\n\n这不是可读性最高的汇编代码，但只要你的实现语言提供了一种获取浮点数二进制表示法的方法，它就能完美工作。你的备选方案是使用十进制浮点常数，我们在之前的汇编示例中使用过它们：\n\
  \n```\n.L_twenty:\n    .double 20.0\n```\n\n十进制可能没有十六进制浮点数紧凑。例如，考虑 `0x1.999999999999ap-4`，它是离十进制数字\
  \ 0.1 最近的 `double`。该值的精确十进制表示为：\n\n```\n1.000000000000000055511151231257827021181583404541015625e-1\n\
  ```\n\n你不需要发射整个整个值；17 位数字总是足够保证转换回原始的 `double`。换句话说，你可以打印出 `0x1.999999999999ap-4`\
  \ 的 17 位十进制近似值，如下：\n\n```\n1.0000000000000001e-1\n```\n\n这并不是完全准确的值，但它足够接近，以至于当汇编器将其转换回\
  \ `double` 时，你将获得 `0x1.999999999999ap-4` 的原始值。\n\n### 浮点常数的标记\n\n如果你对顶层常数使用本地标签（local\
  \ labels），那么在每次发射这些常数的标识符时，都应该包含本地标签前缀（macOS 上为 `L`，Linux 上为 `.L`）。你需要检查后端符号表，以区分代表静态变量的\
  \ `Data` 操作数和代表常数的操作数。如果一个对象的 `is_constant` 属性为真，则它带带有本地标签前缀；否则它是一个变量，因此不带有。\n\n\
  如果你不使用本地标签，你需要统一地发射所有 `Data` 操作数。在 macOS 上，这意味着常数和静态变量的标签都要加上下划线前缀。\n\n### 在只读数据段中存储常数\n\
  \n存放常数的段名称取决于特定平台。在 Linux 上，你应该使用 `.section .rodata` 指令指定此段。在 macOS 上，8 字节对齐和 16\
  \ 字节对齐的常数存储在不同的段中。如果常数是 8 字节对齐，使用 `.literal8` 指令将其存储在正确的段中。对于我们唯一的 16 字节对齐常数（`-0.0`，我们用它来实现取反），使用\
  \ `.literal16` 指令。\n\nmacOS 链接器期望 16 字节对齐的常数长度为 16 字节，但 `-0.0` 只有 8 字节。在 `-0.0`\
  \ 指令之后发射一个 `.quad 0` 指令，将段的总大小增加到 16 字节，以满足链接器的要求。\n\n### 将静态变量初始化为 0.0 或 -0.0\n\
  \n我们不会将 `double` 静态变量存储在 BSS 段中或使用 `.zero` 指令对其初始化，即使它们被初始化为零。这避免了关于 `double` 是真的初始化为\
  \ `0.0` 还是 `-0.0` 的任何困惑。（这两个值通常相等，但我们不能在 BSS 段中存储 `-0.0` 或使用 `.zero` 指令初始化它，因为它的二进制表示并非全零。）\n\
  \n### 总结\n\n除了浮点常数和静态变量外，代码发射阶段还需要处理新的 XMM 寄存器、新指令以及现有指令的浮点版本上的 `sd` 后缀。这些变化非常广泛，但不需要过多讨论。表\
  \ 13-8 到 13-13 总结了本章对代码发射的更新。新的构造以及对现有构造发射方式的更改已加粗显示。\n\n#### 表 13-8：顶层构造的格式化\n\n\
  | 汇编顶层构造 | 输出 |\n| :--- | :--- |\n| `StaticVariable(name, global, alignment, init)`\
