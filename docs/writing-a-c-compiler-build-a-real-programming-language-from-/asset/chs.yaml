  \   int f(int a, int b);\n        return f(0, 1);\n    }\n    return 0;\n}\n```\n\
  \n列表 9-14：冲突的函数声明\n\n`f` 的两个声明应该指向同一个函数，因为它们都具有外部链接。但没有任何函数定义可以同时满足这两个声明，因为参数的数量不同。由于这两个声明发生冲突，这段代码将无法编译。\n\
  \n现在我们已经涵盖了一些关于函数的背景信息，可以开始编写编译器了。但我们不会立即开始词法分析。首先，我们需要更新编译器驱动程序。\n\n### 编译库\n\n\
  在之前的章节中，我们只能编译独立的执行文件。我们编译的每个源文件都定义了一个 `main` 函数，这是程序的入口点。现在我们能够处理其他函数了，我们也应该能够编译没有入口点的库。当你的编译器将源代码翻译成汇编代码时，它并不关心处理的是库还是执行文件。然而，你的编译器驱动程序是关心的，因为链接器期望包含一个带有\
  \ `main` 的完整程序。如果你尝试使用当前的编译器驱动程序编译没有 `main` 函数的源文件，你将得到链接错误，错误看起来可能如下：\n\n```\n\
  /usr/bin/ld: . . ./x86_64-linux-gnu/Scrt1.o: in function `_start':\n(.text+0x24):\
  \ undefined reference to `main'\ncollect2: error: ld returned 1 exit status\n```\n\
  \n此错误意味着链接器正尝试将你的代码链接到 `crt0`（调用 `main` 的封装代码），但失败了。\n\n`gcc` 命令接受一个 `-c` 命令行标志，它不要调用链接器；当该标志存在时，它生成目标文件而不是执行文件。为了配合测试套件，你的编译器驱动程序也应该识别\
  \ `-c` 标志。当传递此标志时，编译器驱动程序应该首先按照常例将源程序转换为汇编程序，然后运行以下命令将汇编程序转换为目标文件：\n\n```\ngcc -c\
  \ ASSEMBLY_FILE -o OUTPUT_FILE\n```\n\n输出文件名应该是带有 `.o` 后缀的原始文件名。换句话说，`./YOUR_COMPILER\
  \ -c /path/to/program.c` 应该产生一个目标文件。\n\n> **注意**\n\n> *如果你想编译并分发真实的库，你不仅仅是生成一个目标文件；而是创建一个共享库（Linux\
  \ 上的 .so 文件或 macOS 上的 .dylib 文件）。如果你愿意，可以为你的编译器驱动程序添加另一个选项来生成共享库；你的驱动程序可以通过调用带有适当标志的\
  \ GCC 或 Clang 来将汇编程序转换为共享库。但你的编译器生成共享库的能力有一个很大的局限，特别是在 Linux 上；我们将在第 10 章详细讨论这一点。*\n\
  \n此时，你可能还想扩展你的编译器驱动程序以接受多个输入源文件。测试套件不需要此功能，但如果你想编译多文件程序，你就需要它。为了处理多个源文件，你的编译器驱动程序应该分别将每个文件转换为汇编，然后使用\
  \ `gcc` 命令将它们汇编并链接在一起。\n\n### 词法分析器\n\n你将在本章添加一个 token：\n\n函数参数或参数列表由逗号分隔。\n\n###\
  \ 解析器\n\n我们需要在 AST 的几处进行扩展以支持函数调用、声明和定义。让我们从函数调用开始，它属于一种表达式：\n\n```\nexp = Constant(int)\n\
  \    | Var(identifier)\n    | Unary(unary_operator, exp)\n    | Binary(binary_operator,\
  \ exp, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp condition, exp, exp)\n\
  \    | FunctionCall(identifier, exp* args)\n```\n\n函数调用的 AST 节点包含函数名和参数列表。每个参数都是一个表达式。\n\
  \n接下来，我们将重构 `declaration` 节点，使其表示函数声明或变量声明：\n\n```\ndeclaration = FunDecl(function_declaration)\
  \ | VarDecl(variable_declaration)\nvariable_declaration = (identifier name, exp?\
  \ init)\n```\n\n\n\n\n我们将 `function_definition` 节点重命名为 `function_declaration`。（稍后我们将详细介绍该节点的其他更改。）`variable_declaration`\
  \ 节点包含了与早些章节中 `declaration` 节点相同的信息：变量名和一个可选的初始化器。但它看起来与我们目前为止见过的其他 AST 节点略有不同；它不包含像\
  \ `FunDecl` 或 `VarDecl` 那样具命名的构造函数。\n\n当 ASDL 中的一个节点具有多个构造函数时（如 `declaration` 节点以及大多数其他\
  \ AST 节点都是如此），每个构造函数都需要一个独特的名称以便我们区分它们。但由于 `variable_declaration` 节点只有一个构造函数，我们并不要求为该构造函数命名。在\
  \ ASDL 术语中，恰好包含一个未命名构造函数的节点定义称为 `product type`（积类型）。我们在此之前使用的其他节点都是 `sum types`（和类型），因为它们都有命名的构造函数。积类型仅仅是为了语法上的方便，让我们不必强制使用笨拙且冗余的构造函数名称。\n\
  \n### 更新 function_declaration\n\n现在让我们更新 `function_declaration`。这里是现有的 `function\
  \ _definition` 节点：\n\n```\nfunction_definition = Function(identifier name, block\
  \ body)\n```\n\n我们需要在这里做几处更改。首先，正如我提到的，我们将将其重命名为更准确的 `function_declaration`。我们还将添加函数参数，并将函数体变为可选，这样该节点就可以同时表示函数声明和函数定义。最后，为了与\
  \ `variable_declaration` 保持一致，我们将移除 `Function` 构造函数名称，将其转换为一个积类型。我们用于表示函数声明和定义的修订\
  \ AST 节点如下：\n\n```\nfunction_declaration = (identifier name, identifier* params,\
  \ block? body)\n```\n\n### 更新程序定义\n\n最后，我们需要更改程序的顶层定义。现在，程序不再是单一的 `main` 函数，而是函数定义和声明的列表：\n\
  \n```\nprogram = Program(function_declaration*)\n```\n\n列表 9-15 显示了完整的更新 AST。\n\n\
  ```\nprogram = Program(function_declaration*)\ndeclaration = FunDecl(function_declaration)\
  \ | VarDecl(variable_declaration)\nvariable_declaration = (identifier name, exp?\
  \ init)\nfunction_declaration = (identifier name, identifier* params, block? body)\n\
  block_item = S(statement) | D(declaration)\nblock = Block(block_item*)\nfor_init\
  \ = InitDecl(variable_declaration) | InitExp(exp?)\nstatement = Return(exp)\n  \
  \        | Expression(exp)\n          | If(exp condition, statement then, statement\
  \ else)\n          | Compound(block)\n          | Break\n          | Continue\n\
  \          | While(exp condition, statement)\n          | DoWhile(statement body,\
  \ exp)\n          | For(for_init init, exp? post, statement)\n          | Null\n\
  exp = Constant(int)\n    | Var(identifier)\n    | Unary(unary_operator, exp)\n \
  \   | Binary(binary_operator, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp\
  \ condition, exp)\n    | FunctionCall(identifier, args*)\nunary_operator = Complement\
  \ | Negate\nbinary_operator = Add | Subtract | Multiply | Remainder | And | Or\n\
  \                | Equal | NotEqual | LessThan | LessEqual\n                | GreaterThan\
  \ | GreaterEqual\n```\n列表 9-15：带有函数调用、声明和定义的抽象语法树\n\n一个 `declaration` 可以作为块项出现，但只有\
  \ `variable_declaration` 可以出现在 `for` 循环头部中。注意，此 AST 可以表示嵌套的函数定义，例如列表 9-5 中的那个，尽管我们并不支持它们。我们将在语义分析阶段检查嵌套函数定义并报错。\n\
  \n列表 9-16 显示了更新后的语法规则。\n\n```\n<program> ::= <function-declaration>}\n<declaration>\
  \ ::= <variable-declaration> | <function-declaration>\n<variable-declaration> ::=\
  \ \"int\" <identifier> [\"=\" <exp>] \";\"\n<function-declaration> ::= \"int\" <identifier>\
  \ \"(\" <param-list> \")\" (<block> | \";\")\n<param-list> ::= \"void\" | \"int\"\
  \ <identifier> {\",\" \"int\" <identifier>}\n<block> ::= \"{\"<block-item>} \"}\"\
  \n<block-item> ::= <statement> | <declaration>\n<for-init> ::= <variable-declaration>\
  \ | [<exp>] \";\"\n<statement> ::= \"return\" <exp> \";\"\n              | <exp>\
  \ \";\"\n              | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n\
  \              | <block>\n              | \"break\" \";\"\n              | \"continue\"\
  \ \";\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n             \
  \ | \"do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\"\
  \ \"(\" <for-init> [<exp>] \";\" [<exp>] \")\" <statement>\n              | \";\"\
  \n<exp> ::= <factor> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n<factor>\
  \ ::= <int> | <identifier> | <unop> <factor> | \"(\" <exp> \")\"\n           | <identifier>\
  \ \"(\" [<argument-list>] \")\"\n<argument-list> ::= <exp> {\",\" <exp>}\n<unop>\
  \ ::= \"-\" | \"~\" | \"!\"\n<binop> ::= \"-\" | \"+\" | \"*\" | \"/\" | \"%\" |\
  \ \"&&\" | \"||\"\n          | \"==\" | \"!=\" | \"<\" | \"<=\" | \">\" | \">=\"\
  \ | \"=\"\n<identifier> ::= ? 标识符标记 ?\n<int> ::= ? 常量标记 ?\n```\n列表 9-16：带有函数调用、声明和定义的语法\n\
  \n\n\n\n函数调用的优先级高于任何二元运算符或三元运算符，因此你应该在解析 `factor` 符号时处理它们。如果一个 `factor` 以标识符开头，请向前查看一个标记（token），以确定该表达式是变量还是函数调用。如果下一个标记是\
  \ `(`，你就可以认为它是一个函数调用。同样，你还需要检查 `(` 标记以区分函数声明和变量声明。\n\n## 语义分析\n\n在变量解析阶段，我们为每个局部变量都分配了一个新的、唯一的名称。然而，我们不应该重命名具有外部链接（external\
  \ linkage）的实体。两个命名为 `var` 的局部变量声明指向不同的内存地址，因此我们为它们分配了不同的名称。但两个命名为 `fun` 的函数声明指向同一段代码，因此这些声明在整个编译过程中应保持相同的名称。此外，具有外部链接的对象必须保留原始源代码中的名称，因为链接器在符号解析期间将依赖于该名称。除非在编译每个对象文件时都保留了\
  \ `fun` 这个名称，否则链接器将将调用 `fun` 的对象文件与定义 `fun` 的对象文件链接起来。\n\n因此，我们需要更新变量解析阶段，重命名没有链接的标识符，但保持具有外部链接的标识符不变。（由于此阶段将同时处理函数和变量，从现在起我将将其称为\
  \ `标识符解析` 而不是变量解析。）我们将检查所有常见的错误情况，如重复声明和未声明的标识符；我们还会验证没有嵌套函数定义。捕获重复声明的逻辑会发生变化，因为在同一作用域内多次声明具有外部链接的名称是合法的。例如，[Listing\
  \ 9-17] 是完全合法的。\n\n```\nint main(void) {\n    int foo(void);\n    int foo(void);\n\
  \    return foo();\n}\n```\nListing 9-17：同一作用域内的多个函数声明\n\n由于 `foo` 的两个声明都具有外部链接，它们指向同一个函数，所以它们不会产生冲突。标识符的重复声明只有在它们指向不同实体时才会发生冲突；当你稍后在同一作用域中使用该标识符时，无法判断它应该指向哪个实体。\n\
  \n我们还有几个其他需要检查的错误情况。我们必须验证每个函数声明的参数数量是否相同，并且没有函数被定义了一次。此外，我们必须验证变量没有被用作函数，并且调用函数时使用的参数数量正确。这些错误与我们已经检查的错误情况并不相似，因为它们并不是真正关乎标识符是否在作用域内。它们是\
  \ `type errors`，当对象的不同声明具有冲突的类型，或者使用对象的方式其类型不支持时就会发生。\n\n我们将定义一个独立的类型检查阶段来捕获这些错误。该阶段还将构建一个符号表，以存储程序中每个标识符的类型，以及我们需要跟踪的标识符的其他几个属性。我们将在后续编译阶段重新引用符号表。这与对象文件中的符号表不同，链接器在符号解析期间使用后者。我们在类型检查器中构建的符号表是编译器内部的。\n\
  \n在本章结束时，语义分析阶段将包含三个阶段：标识符解析、类型检查和循环标记。循环标记阶段可以在其他两个阶段的任何时候发生。\n\n#### 扩展标识符解析\n\
  \n让我们更新标识符解析阶段，以处理函数调用、函数声明和函数定义。我们需要为标识符映射中的每个条目跟踪一个新信息：它是否具有外部链接。在构建标识符映射时，不要假设函数总是具有外部链接而变量永远不会。这个假设目前是成立的，但在下一章就不会了。\n\
  \n我们还会更新伪代码中的几个名称：我们将 `variable_map` 改为 `identifier_map`，并将标识符映射中的 `from_current_block`\
  \ 字段重命名为 `from_current_scope`，因为函数声明可以出现在块之外的顶层。\n\n##### 函数调用\n\n函数名和变量名一样，在使用它之前必须存在于标识符映射中。[Listing\
  \ 9-18] 展示了 `resolve_exp` 应该如何处理函数调用。\n\n```\nresolve_exp(e, identifier_map):\n\
  \    match e with\n    | --snip--\n    | FunctionCall(fun_name, args) ->\n     \
  \   if fun_name in identifier_map:\n            new_fun_name = identifier_map.get(fun_name).new_name\n\
  \            new_args = []\n            for arg in args:\n                new_args.append(resolve_exp(arg,\
  \ identifier_map))\n            return FunctionCall(new_fun_name, new_args)\n  \
  \      else:\n            fail(\"Undeclared function!\")\n```\nListing 9-18：解析函数调用\n\
  \n首先，我们在标识符映射中查找函数名，以确认它在程序的此时是处于作用域内的。然后，我们用标识符映射中的新名称替换该名称。在有效程序中，这个新名称将与原始名称相同，因为我们没有重命名具有外部链接的标识符。但我们还需要考虑无效程序。也许\
  \ `fun_name` 实际上是一个局部变量的名称而不是函数；在这种情况下，尝试像调用函数一样调用它将是一个类型错误。在此处解析 `fun_name` 将允许我们在类型检查期间捕获到这个类型错误。我们还将等待到类型检查阶段，以确保此函数调用的参数数量是正确的。\n\
  \n在替换函数名称后，我们对每个函数参数递归调用 `resolve_exp`，就像我们递归解析一元、二元和三元表达式中的每个子表达式一样。\n\n##### 函数声明\n\
  \n现在让我们考虑函数声明。无论出现在块中还是顶层，我们处理函数声明的方式几乎完全相同。首先，我们将函数名添加到当前作用域中。然后，我们处理它的参数，并将它们添加到新的内部作用域中。最后，如果有函数体，我们也会处理它。[Listing\
  \ 9-19] 演示了如何解析函数声明。\n\n\n\n\n\n```python\nresolve_function_declaration(decl, identifier_map):\n\
  \    if decl.name is in identifier_map:\n        prev_entry = identifier_map.get(decl.name)\n\
  \      ❶ if prev_entry.from_current_scope and (not prev_entry.has_linkage):\n  \
  \          fail(\"Duplicate declaration\")\n\n  ❷ identifier_map.add(decl.name,\
  \ MapEntry(\n        new_name=decl.name, from_current_scope=True, has_linkage=True\n\
  \    ))\n\n  ❸ inner_map = copy_identifier_map(identifier_map)\n    new_params =\
  \ []\n    for param in decl.params:\n        new_params.append(resolve_param(param,\
  \ inner_map))\n\n    new_body = null\n    if decl.body is not null:\n        new_body\
  \ = resolve_block(decl.body, inner_map)\n    return (decl.name, new_params, new_body)\n\
  ```\n\n列表 9-19: 解析函数声明\n\n在更新标识符映射之前，我们需要确保没有非法地重新声明标识符 ❶。如果标识符尚不在作用域内，则没有冲突。如果标识符已经在外层作用域中声明，那也可以；新声明会遮蔽现有声明。到目前为止，这与我们处理变量声明的方式完全相同。然而，我们还需要考虑链接（linkage）。多个具有外部链接的标识符声明可以出现在同一个作用域内。我们已经知道新声明具有外部链接，因为它是一个函数声明，所以只要旧声明也有外部链接，它就是合法的。但如果旧声明没有链接（因为它声明的是局部变量），我们将抛出一个错误。标识符映射中的\
  \ `has_linkage` 属性告诉我们标识符是否具有外部链接。（在下一章中，它将跟踪标识符是否具有任何链接，无论是内部还是外部的。）\n\n如果没有冲突的声明，我们就把此名称添加到\
  \ `identifier_map` 中 ❷。我们不会为函数生成新名称；此映射条目的的 `new_name` 属性应直接为原始名称。因为此声明具有外部链接，所以\
  \ `has_linkage` 属性应该是 `True`。\n\n接下来，我们解析参数名称。声明中的函数参数列表开启了一个新的作用域，因此我们对标识符映射进行复制以跟踪它们\
  \ ❸。参数名称可以遮蔽外层作用域的名称，但同一个函数声明中的两个参数不能共享同一个名称。所以，这种是合法的：\n\n```c\nint a;\nint foo(int\
  \ a);\n```\n\n但这种是不合法的：\n\n```c\nint foo(int a, int a);\n```\n\n我省略了 `resolve_param`\
  \ 的伪代码，但它应该与你现有的解析变量的代码相同：它应该确保参数名称没有在当前作用域中被声明，为它生成一个唯一名称，将其添加到标识符映射中，并返回新名称。你可能想写一个辅助函数来同时解析参数和局部变量声明，因为这两种情况的逻辑是相同的。\n\
  \n解析函数参数有两个原因。首先，我们需要验证没有重复的参数名称。其次，我们需要确保在处理函数体时，参数在作用域内。当我们处理没有函数体的函数声明时，第二个点并不重要；我们只通过检查重复参数而不对其进行重命名或更新内部作用域就能过关。然而，我认为无论函数是否有函数体，都以统一的方式处理函数声明是最简单的。\n\
  \n列表 9-19 的最后一步是处理函数体（如果存在的话）。我们像通常一样用 `resolve_block` 来处理它；我们只需要确保传入 `inner_map`，这样函数参数就在作用域内。函数名本身也在作用域内，因为我们在复制之前已经将其添加到外层映射中；因此，我们将能够处理递归调用自己的函数。\n\
  \n函数参数和函数体处于同一个作用域内，因此在处理函数体时，你应该传入 `inner_map` 而不是它的拷贝。例如，这种是非法的：\n\n```c\nint\
  \ foo(int a) {\n    int a = 3;\n    return a;\n}\n```\n\n变量声明 `int a = 3;` 是一个非法的重复声明，因为它与参数\
  \ `a` 在同一个作用域内。\n\n此时，我们可以返回更新后的 `function_declaration`节点。虽然函数名本身没有改变，但参数列表以及函数体中声明的任何变量已经在此新节点中被重命名了。\n\
  \n### 局部声明\n\n你可以完全按照之前章节的方法处理局部变量声明；只需确保在标识符映射中记录这些声明没有链接即可。要处理局部函数声明，首先检查它是否具有函数体。如果有，则抛出错误；否则，调用我们在列表\
  \ 9-19 中定义的 `resolve_function_declaration`。\n\n### 层级处理\n\n最后，我们需要将所有这些整合起来以处理函数声明列表。只需顺序处理它们，并在过程中构建标识符映射。你添加的每个函数名将保留在作用域内。\n\
  \n### 编写类型检查器\n\n剩下的验证工作全是类型检查。每个标识符（无论是函数还是变量）都有类型。变量可以具有如 `int`、`long` 和 `double`\
  \ 等类型，但在项目的此阶段，每个变量的类型都是 `int`。函数的类型取决于它的返回类型和参数的类型。例如，一个函数的类型可以是“接受三个 `int` 参数并返回\
  \ `int` 的函数”。目前，我们只支持接受 `int` 参数并返回 `int` 结果的函数，所以只有参数的数量不同。\n\n类型检查验证标识符的所有声明和使用具有兼容的类型。例如，如果你声明\
  \ `x` 是一个变量，你就不能像调用函数一样调用它：\n\n```c\nint x = 3;\nreturn x();\n```\n\n你不能在多个处声明不同类型的函数：\n\
  \n```c\nint foo(int a, int b);\nint foo(int a);\n```\n\n你不能用错误数量的参数调用函数：\n\n```c\n\
  int foo(int a, int b);\n\nint main(void) {\n    return foo(1);\n}\n```\n\n而且你不能定义同一个函数多次：\n\
  \n```c\nint foo(void) {\n    return 1;\n}\n\nint foo(void) {\n    return 2;\n}\n\
  ```\n\n最后这个错误本身并不是类型错误，但在这里检查是最简单的。\n\n\n\n\n为了对程序进行类型检查，我们将在符号表中记录每个标识符的类型。我们还会记录遇到的每个函数是已经定义的还是仅声明的；即，它是否具有函数体。符号表将是我们关于程序中每个标识符的中心信息源。在本章中，我们主要使用符号表来捕获类型错误。在后续的章节中，我们将向此表中添加更多信息，并发现它的更多用途。\n\
  \n为了构建符号表，我们需要一种在编译器中表示类型的方法，就像我们需要一种表示 AST 的方法一样。现在，你的类型定义应该像这样：\n\n```\ntype =\
  \ Int | FunType(int param_count)\n```\n\n每个变量的类型都是 `int`，而关于函数类型，我们需要的信息是它有多少个参数。我们将在第二部分中添加更多类型。\n\
  \n我们将通过通常的方式遍历程序来构建符号表。当我们遇到函数或变量声明时，我们会在符号表中记录其类型。类型检查器不会像标识符解析阶段那样转换 AST，因此单独的类型检查方法不会返回转换后的\
  \ AST 节点；它们将只是添加符号表条目并报告错误。（类型检查器在第二部分中*会*转换 AST。）\n\n列表 9-20) 显示了如何类型检查变量：\n\n\
