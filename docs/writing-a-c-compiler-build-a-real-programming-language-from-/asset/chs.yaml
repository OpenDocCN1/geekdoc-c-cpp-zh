  ```\n\nListing 9-23：为 TACKY 添加函数调用\n\n这些更改与 Listing 9-15 中 AST 的更改密切对应。然而，TACKY\
  \ IR 所需更改更少，因为我们没有在 TACKY 中表示函数声明。就像没有初始化器的变量声明一样，没有函数体的函数声明在 IR 生成期间会被丢弃。只有函数定义会被转换为\
  \ TACKY。\n\n新的 `FunCall` 指令需要一个函数名、参数列表和一个返回值的目的地。与其他 TACKY 指令的操作数一样，函数参数必须是常量或变量，而不能是表达式。\n\
  \n将整个程序转换为 TACKY，请逐个处理顶层函数声明，将每个函数定义转换为 TACKY `function_definition` 并丢弃任何没有函数体的声明。要将函数调用转换为\
  \ TACKY，请生成指令来评估每个参数，并构建一个生成的 TACKY 值列表。函数调用 `fun(e1, e2, …)` 的 TACKY 形式将如 Listing\
  \ 9-24 所示。\n\n```\n<instructions for e1>\nv1 = <result of e1>\n<instructions for\
  \ e2>\nv2 = <result of e2>\n--snip--\nresult = FunCall(fun, [v1, v2, . . .])\n```\n\
  \nListing 9-24：将函数调用转换为 TACKY\n\n这是我们处理其他带有嵌套子表达式的表达式（如单元和二进制操作）的方法。现在我们将其推广到任意数量的嵌套表达式，因为函数可以有任意数量的参数。\n\
  \n记得在每个函数体的末尾添加 `Return(0)` 指令，以确保即使某些执行路径缺少 `return` 语句，也能返回到调用者。接下来，我们将处理本章中最困难的部分：在汇编中实现函数调用。\n\
  \n### 汇编生成\n\n在本章中，我们将对 TACKY 到汇编的转换阶段进行大更改：将函数参数放在栈上以便在函数体中访问，并将新的 `FunCall` 指令转换为汇编。我们还对伪寄存器替换阶段和指令修复阶段进行几处较小的更改。但在进行这些更改之前，我们需要理解将要使用的调用约定。\n\
  \n### 理解调用约定\n\n*调用约定*（calling convention）是调用者和被调用者之间关于函数如何被调用的约。它回答了诸如下问题：\n\n\
  * 参数是如何传递给被调用者的？是通过寄存器还是通过栈传递？\n* 函数的返回值是如何传回调用者的？\n* 在函数结束时，是被调用者还是调用者负责从栈中移除参数？\n\
  * 被调用者允许覆盖哪些寄存器，又需要保留哪些寄存器？\n\n共享的调用约定允许调用者和被调用者协作。调用者知道将参数放在哪里，被调用者知道去哪里寻找它们。被调用者知道在哪里存储返回值，调用者知道在被调用者返回后在哪里找到它。被调用者和调用者都知道需要保存哪些寄存器，以确保被调用者不会破坏调用者在函数调用后使用的任何值。这确保了两个函数都能访问它们需要的信息。\n\
  \n调用约定是一个更大规范的一部分，称为*应用二进制接口 (ABI)*（application binary interface），它使得链接由不同编译器构建的对象文件成为可能。只要对象文件共享相同的\
  \ ABI，它们就能相互操作。此外，ABI 还规定了不同类型在内存中的表示方式，这在 Part II 中将非常重要。大多数其他细节（如可执行文件格式）都由汇编器、链接器和操作系统处理，因此我们不需要担心它们。\n\
  \n如果你的编译器遵循调用约定，你就可以使用标准库。每个 Unix 类系统都使用 *System V*。由于我们的目标是 macOS，我们将使用 System\
  \ V。不同的处理器架构有不同的版本；我们将使用 x64。Windows 有自己的 ABI，我们不必担心它。如果你在 Linux 上进行此项目，仍然可以使用该调用约定。接下来，我们将此调用约定是如何工作的。\n\
  \n#### 使用 System V ABI 调用函数\n\n在上一节中，我列出了调用约定必须回答的问题。让我们看看 System V 调用约定是如何回答这些问题以及它所施加的其他要求的：\n\
  \n**参数传递**\n\n函数的前六个整数参数通过 `EDI`、`ESI`、`EDX`、`ECX`、`R8D` 和 `R9D` 寄存器传递（64 位整数使用这些寄存器的\
  \ 64 位名称：`RDI`、`RSI`、`RDX`、`RCX`、`R8` 和 `R9`）。剩余参数按逆序压栈。例如，为了实现函数调用 `foo(a, b, c,\
  \ d, e, f, g, h)`，你首先将变量 `a` 复制到 `EDI`，然后将 `b` 复制到 `ESI`，以此此类推，直到 `f`。然后，你将最后一个参数\
  \ `h` 压栈。最后，你将 `g` 压栈。\n\n**返回值**\n\n正如我们所知的，函数的返回值通过 `EAX` 传递（如果你返回 64 位整数，则通过\
  \ `RAX`）。当执行 `ret` 指令时，返回值必须在 `EAX` 中。\n\n**参数清理**\n\n在被调用者返回后，调用者从栈中移除任何参数。被调用者不负责清理参数。\n\
  \n\n\n\n\n#### 调用者保存与被调用者保存寄存器\n\n如果一个寄存器是`调用者保存（caller-saved）`，则允许被调用者覆盖它。因此，如果调用者在执行\
  \ `call` 指令后还需要该寄存器的值，则必须在此之前将其值保存到栈中。在函数返回后，它可以从栈中弹出该值。（如果寄存器中的值在函数调用后不再被使用，则调用者不需要保存它。）如果一个寄存器是`被调用者保存（callee-saved）`，它在函数返回时的内容必须与函数开始时相同。如果被调用者需要使用该寄存器，通常会在函数序（prologue）期间将寄存器值推入栈，然后在函数尾（epilogue）期间将其弹出栈。寄存器\
  \ `RAX`、`R10`、`R11` 以及所有的参数传递寄存器都是调用者保存的；其余寄存器都是被调用者保存的。\n\n#### 栈对齐\n\nSystem V\
  \ ABI 要求栈是 16 字节对齐。也就是说，当我们执行 `call` 指令时，存储在 `RSP`（栈指针）中的地址必须是 16 的倍数。ABI 实施这一要求是因为某些指令需要\
  \ 16 字节对齐的操作数。如果栈本身就是 16 字节对齐的，那么维护这些操作数的正确对齐就会更容易。\n\n你可以在 `https://gitlab.com/x86-psABIs/x86-64-ABI`\
  \ 完整的 System V x64 ABI。然而，查看示例可能比阅读规范更有用。请参考列表 9-25。\n\n```c\nint fun(int a, int\
  \ b, int c, int d, int e, int f, int g, int h) {\n    return a + h;\n}\n\nint caller(int\
  \ arg) {\n    return arg + fun(1, 2, 3, 4, 5, 6, 7, 8);\n}\n```\n\n列表 9-25：一个包含函数调用的\
  \ C 程序\n\n列表 9-26 提供了 `fun` 的汇编代码。为了更清晰地阐述 System V 调用约定，这段代码比编译器生成的代码经过了优化。\n\n\
  ```assembly\n .globl fun\nfun:\n    pushq   %rbp\n    movq    %rsp, %rbp\n    #\
  \ 将第一个参数拷贝到 EAX\n    movl    %edi, %eax\n    # 将最后一个参数加到 EAX\n    addl    24(%rbp),\
  \ %eax\n    # 尾\n    movq    %rbp, %rsp\n    popq    %rbp\n    ret\n```\n\n列表 9-26：列表\
  \ 9-25 中 `fun` 的汇编代码\n\n列表 9-27 提供了从 `caller` 调用 `fun` 的汇编代码。\n\n```assembly\n #\
  \ 在函数调用前保存 RDI \n    pushq   %rdi\n    # 修复栈对齐\n    subq    $8, %rsp\n    # 通过寄存器传递前六个参数\n\
  \    movl    $1, %edi\n    movl    $2, %esi\n    movl    $3, %edx\n    movl    $4,\
  \ %ecx\n    movl    $5, %r8d\n    movl    $6, %r9d\n    # 通过栈传递最后两个参数\n    pushq\
  \   $8\n    pushq   $7\n    # 将控制权转移给 fun\n    call    fun\n    # 恢复栈和 RDI\n   \
  \ addq    $24, %rsp\n    popq    %rdi\n```\n\n列表 9-27：列表 9-25 中调用 `fun` 的汇编代码\n\n\
  让我们走一遍调用过程，看看状态是如何变化的。在下面的图表中，左列显示栈和通用寄存器，右列显示持有下一条指令的 `RIP`。（注意，这些图中的地址是变异的！）\n\
  \n图 9-1 显示了 `fun` 的初始状态。\n\n列表 9-25 显示了调用之前 `caller` 的状态。然而，参数都是 32 位整数，因此我们在这里将使用\
  \ 32 位寄存器名称：\n\n图 9-1 显示了调用之前 `fun` 的状态。\n\n列表 9-25 显示了调用之前 `caller` 的状态。\n\n\n\n\
  \n\n```\n # 通过寄存器传递前六个参数\n    movl    $1, %edi\n    movl    $2, %esi\n    movl \
  \   $3, %edx\n    movl    $4, %ecx\n    movl    $5, %r8d\n    movl    $6, %r9d\n\
  ```\n\n接下来，我们将剩余的两个参数推入栈中，顺序反反：\n\n```\n # 在栈上传递最后两个参数\n    pushq   $8\n    pushq\
  \   $7\n```\n\n这些指令中的每一条都会将一个 64 位的常数推入栈中，因为 `push` 指令只能推入 64 位的值。图 9-2 显示了在我们保存\
  \ `RDI`、调整栈空间并设置函数参数后的程序状态。\n\n![](img/fig9-2.jpg)\n\n*图 9-2：执行 call 指令前的程序状态* *描述\n\
  \n你可以看出栈确实是 16 字节对齐的，因为栈指针可以被 16 整除（或十六进制的 `0x10`）。一旦设置好参数，我们就使用 `call` 汇编指令调用 `fun`：\n\
  \n```\n # 将控制转移到 fun\n    call    fun\n```\n\n`call` 指令做了两件事。首先，它将紧随其后的指令地址（即返回地址）推入栈中。然后，它通过将该指令的地址复制到\
  \ `RIP`，将控制转移到标记为 `fun` 的指令。图 9-3 显示了执行 `call` 指令后的程序状态。\n\n![](img/fig9-3.jpg)\n\
  \n*图 9-3：执行 call 指令后的程序状态* *描述\n\n我们已经熟悉的函数序言（prologue）为 `fun` 设置了栈帧，这使得程序处于图 9-4\
  \ 所示的状态。\n\n![](img/fig9-4.jpg)\n\n*图 9-4：fun 函数序言后的程序状态* *描述\n\n在此图中，白色背景的栈部分是\
  \ `fun` 的栈帧。浅灰色背景的部分是 `caller` 的栈帧。在 `fun` 中，我们需要计算 `a + h`。这要求我们访问一个通过寄存器传递的参数（`a`）和一个通过栈传递的参数（`h`）。`fun`\
  \ 中的下一条指令将 `a` 的值复制到 `EAX`：\n\n```\n # 将第一个参数复制到 EAX\n    movl    %edi, %eax\n```\n\
  \n接下来，我们想将通过栈传递的 `h` 加到 `EAX` 中的值。栈参数和局部变量一样，可以相对于 `RBP` 进行址。我们知道 `RBP` 指向包含调用者栈帧基地址的栈槽。上面的栈槽\
  \ `RBP+8` 包含返回地址。下方的栈槽 `RBP+16` 包含第一个栈参数。注意我们是反序推入参数，因此第一个参数在 `RBP+16`，第二个在 `RBP+24`。\n\
  \n为了将 `h` 加到 `EAX`，我们使用：\n\n```\n # 将 h 加到 EAX\n    addl    16(%rbp), %eax\n```\n\
  \n现在我们将返回值移动到 `RAX` 并执行尾声（epilogue）：\n\n```\n # 将返回值移动到 RAX 并执行尾声\n    movl    %eax,\
  \ %eax\n    movq    %rbp, %rsp\n    popq    %rbp\n    ret\n```\n\n\n\n\n\n此时，你应该已经清楚地了如何在汇编中调用函数以及访问函数参数。我们准备好更新汇编生成阶段了。\n\
  \n## 将函数调用和定义转换为汇编\n\n我们现在要扩展汇编 AST，这是自第 4 章 以来来的首次扩展。列表 9-28 定义了新的 AST，更改的部分已**加粗**。\n\
  \n```\nprogram = Program(function_definition*)\nfunction_definition = Function(identifier\
  \ name, instruction* instructions)\ninstruction = Mov(operand src, operand dst)\n\
  \            | Unary(unary_operator, operand)\n            | Binary(binary_operator,\
  \ operand, operand)\n            | Cmp(operand, operand)\n            | Idiv(operand)\n\
  \            | Cdq\n            | Jmp(identifier)\n            | JmpCC(cond_code,\
  \ identifier)\n            | SetCC(cond_code, operand)\n            | Label(identifier)\n\
  \            | AllocateStack(int)\n            | DeallocateStack(int)\n        \
  \    | Push(operand)\n            | Call(identifier)\n            | Ret\n\nunary_operator\
  \ = Neg | Not\nbinary_operator = Add | Sub | Mult\noperand = Imm(int) | Reg(reg)\
  \ | Pseudo(identifier) | Stack(int)\ncond_code = E | NE | G | GE | L | LE\nreg =\
  \ AX | CX | DX | DI | SI | R8 | R9 | R10 | R11\n```\n\n*列表 9-28: 支持函数调用的汇编 AST*\n\
  \n首先，我们更改了 `Program` 的顶层定义以支持多个函数定义。我们还引入了三个新指令。为了在函数调用之前调整栈对齐，可以使用已有的 `AllocateStack`\
  \ 指令，它最终会被发射为 `subq` 指令。为了在函数调用后移除参数和填充，我们添加了相应的 `DeallocateStack` 指令，它会被发射为 `addq`。我们还需要\
  \ `Push` 指令将参数推入栈中。我们已经在函数序言中用过 `push`，但那种方式非常有限，我们只是在代码发射期间机械地添加它。现在我们要更广泛地使用它了，因此需要将其添加到汇编\
  \ AST 中。当然，我们还需要 `Call` 指令来实际调用函数。最后，我们需要几个用于参数传递的新寄存器：`CX`、`DI`、`SI`、`R8` 和 `R9`。参数也会通过\
  \ `DX` 寄存器传递，它已经在我们的 AST 中了。与之前的章节一样，AST 不区分每个寄存器的不同别名：例如，`DI` 被发射为 `%rdi`、`%edi`\
  \ 或 `%dil`，取决于我们想要使用整个寄存器、低 4 字节还是最低字节。\n\n完成汇编 AST 的这些添加后，我们可以更新 TACKY 到汇编的转换。记得我们对\
  \ TACKY IR 做了三个更改：我们将程序定义为函数列表而不是单个函数，在每个函数定义中添加了参数，并添加了 `FunCall` 指令。处理第一个更改是直接的：我们将\
  \ TACKY 中的函数列表转换为汇编中的函数列表。接下来，我们将使函数参数在汇编中可用。然后，我们将看到如何将新的 `FunCall` 指令转换为汇编。\n\n\
  ### 在汇编中访问函数参数\n\n在函数开始时，每个参数都存储在寄存器或栈中。我们可以通过引用这些位置在汇编中访问函数参数。列表 9-26 中 `fun` 的汇编代码就采用了这种方法：在函数开始时，每个参数存储在调用约定定义的寄存器中。这种方法可行，但它有几个缺点：它要求我们在调用函数之前将传递寄存器推入栈，然后再次将其弹出，就像我们在列表\
  \ 9-27 中做的那样。它还会导致与其他使用传递寄存器的指令冲突。例如，`idiv` 会写入 `EDX` 寄存器，可能会覆盖存储在该处的函数参数。最后，它使得伪寄存器分配阶段变得复杂，因为参数必须以于局部变量的方式处理。\n\
  \n我们将采取不同的方法：在函数体开始时，我们将每个参数从其调用约定定义的寄存器拷贝到当前帧的一个槽位中。让我们来看一个简单的例子。列表 9-29 定义了一个带有一个参数的函数。\n\
  \n```\nint simple(int param) {\n    return param;\n}\n```\n\n*列表 9-29: 带单参数函数*\n\
  \n当我们为此函数生成汇编时，会在函数体开始处包含一个额外的 `Mov` 指令：\n\n```\nMov(Reg(DI), Pseudo(\"param\"))\n\
  ```\n\n该指令将函数参数拷贝到 `param` 伪寄存器中。请记住，TACKY 中对 `Var(\"param\")` 的任何使用将被转换为汇编中对 `Pseudo(\"\
  param\")` 的使用。整个函数生成的汇编如下：\n\n```\nMov(Reg(DI), Pseudo(\"param\"))\nMov(Pseudo(\"\
  param\"), Reg(AX))\nRet\n```\n\n（实际上，`param` 在标识符解析期间会被重命名，并且我们会在 TACKY 生成期间发射一个额外的\
  \ `Return(0)` 指令，但这些细节对于本例子并不重要。）\n\n我们将按照通常的方式将伪寄存器替换为栈位置。由于 `param` 是我们唯一的伪寄存器，将其分配给\
  \ `Stack(-4)`。我们最终将发射如列表 9-30 所示的汇编程序。\n\n```\n .globl simple\nsimple:\n    pushq\
  \   %rbp\n    movq    %rsp, %rbp\n    subq    $16, %rsp\n    movl    %edi, -4(%rbp)\n\
  \    movl    -4(%rbp), %eax\n    movq    %rbp, %rsp\n    popq    %rbp\n    ret\n\
  ```\n\n\n\n\n\n#### 列表 9-30: 列表 9-29 的汇编程序\n\n将参数拷贝到栈中可以使代码生成保持简单。我们不需要在函数调用之前保存调用者保存寄存器（caller-saved\
  \ registers），也不需要在调用后恢复它们，因为我们对这些寄存器的使用是非常短暂的。当我们通过寄存器传递函数参数时，我们会立即将它们保存到栈中，而不是长期留在这些寄存器里。除了函数参数外，我们存储在调用者保存寄存器中的唯一值是返回值、`idiv`\
  \ 指令的结果，以及在指令重写阶段临时复制到 `R10D` 或 `R11D` 中的值。与参数一样，这些值要么被立即使用，要么被拷贝到栈中。结果是，调用者保存寄存器中的值永远不需要跨越函数调用持久存在；这就是为什么我们不需要保存或恢复它们。（与此同时，调用者不需要保存或恢复大多数调用者保存寄存器（callee-saved\
  \ registers），因为我们根本没有使用它们。唯一的例外是 `RBP` 和 `RSP` 寄存器，我们会在函数的序言（prologue）和结尾（epilogue）中保存并恢复它们。）\n\
  \n同样，我们不需要担心 `idiv` 指令破坏 `EDX` 中的参数。在伪寄存器分配期间，我们也不需要额外的逻辑来处理函数参数：我们可以像处理局部变量一样将它们分配到栈位置。\n\
  \n另一方面，将参数拷贝到栈是低效的。首先，我们生成了额外的 `mov` 指令。其次，每当读取或写入参数时，我们强制程序访问内存（内存通常比寄存器慢）。幸运的是，当我们在第三部分实现寄存器分配时，我们将能够大部分额外的指令和内存访问。\n\
  \n当你生成这些参数拷贝指令时，首先将第一个参数从 `Reg(DI)` 移动到伪寄存器，第二个从 `Reg(SI)`，以此类推，直到第六个参数（如果函数参数少于六个，则直到参数用完）。然后，从\
  \ `Stack(16)` 拷贝第七个参数，从 `Stack(24)` 拷贝第八个，以此类推，直到处理每一个参数。正如我们之前看到的，调用者栈帧的顶部 `8(%rbp)`\
  \ 是返回地址，而第七个参数——在栈上传递的第一个参数——始终就在它下方，位于 `16(%rbp)`。从那里开始，每增加一个参数偏移量增加 8 字节，因为调用者将它们作为\
  \ 8 字节值推入栈中（尽管调用者将其解释为 4 字节值）。\n\n## 实现 FunCall\n\n早时候我们逐步分析了函数调用的汇编代码。现在让我们来看如何生成这些汇编代码。列表\
  \ 9-31 提供了将 `FunCall` TACKY 指令转换为汇编的伪代码。\n\n```python\nconvert_function_call(FunCall(fun_name,\
  \ args, dst)):\n    arg_registers = [DI, SI, DX, CX, R8, R9]\n\n    // 调整栈对齐\n \
  \   register_args, stack_args = first 6 args, remaining args\n    if length(stack_args)\
  \ is odd:\n        stack_padding = 8\n    else:\n        stack_padding = 0\n\n \
  \   if stack_padding != 0:\n        emit(AllocateStack(stack_padding))\n\n    #\
  \ 通过寄存器传递参数\n    reg_index = 0\n    for tacky_arg in register_args:\n        r =\
  \ arg_registers[reg_index]\n        assembly_arg = convert_val(tacky_arg)\n    \
  \    emit(Mov(assembly_arg, Reg(r)))\n        reg_index += 1\n\n    # 在栈上传递参数\n\
  \    for tacky_arg in reverse(stack_args):\n        assembly_arg = convert_val(tacky_arg)\n\
  \        if assembly_arg is a Reg or Imm operand:\n          ❶ emit(Push(assembly_arg))\n\
  \        else:\n          ❷ emit(Mov(assembly_arg, Reg(AX)))\n            emit(Push(Reg(AX)))\n\
  \n    # 生成 call 指令\n    emit(Call(fun_name))\n\n    # 调整栈指针\n    bytes_to_remove\
  \ = 8 * length(stack_args) + stack_padding\n    if bytes_to_remove != 0:\n     \
  \   emit(DeallocateStack(bytes_to_remove))\n\n    # 获取返回值\n    assembly_dst = convert_val(dst)\n\
  \    emit(Mov(Reg(AX), assembly_dst))\n```\n\n### 列表 9-31: 为函数生成汇编代码\n\n第一步是确保栈正确对齐。我们必须在栈上传递参数之前这样做；当我们在列表\
  \ 9-27 中分析函数调用时，我们看到如果推入偶数个参数，它仍然是 16 字节对齐的。现在，得益于上一节的拷贝操作，我们只需要检查将推入栈的参数数量，如果是奇数，就生成\
  \ `AllocateStack` 指令。\n\n接下来，我们传递参数。当我们处理每个参数时，使用辅助函数 `convert_val` 将其转换为汇编操作数（我省略了\
  \ `convert_val` 的伪代码，因为你已经知道如何执行操作）。前六个参数被拷贝到相应的寄存器中。当然，函数的参数少于六个；在这种情况下，我们将每个参数都拷贝到寄存器中。\n\
  \n\n\n\n\n如果我们直接在 `pushq -4(%rbp)` 等指令中使用 4 字节的内存操作数，我们将推入操作数的 4 个字节，紧接着是内存中紧随其后的任意\
  \ 4 个字节。这通常没有问题，虽然显得有些笨拙。但如果紧随操作数后的 4 个字节不是可读内存，尝试访问这些字节将触发段错误（segmentation fault）并导致程序崩溃。当我们从栈推入操作数时，不会出现这个问题；紧随其后的字节要么是当前函数的其他临时值，要么是调用者栈帧的基地址。但当我们推入静态变量时可能会出现这个问题，我们将在第\
  \ 10 章中实现这一点。静态变量可能出现在有效内存区域的末尾；在这种情况下，该变量之后的内存地址可能是无效的。（你可以在 Randall Hyde 的著作 *The\
  \ Art of 64-Bit Assembly, Volume 1* [No Starch Press, 2021] 中阅读更多关于这种边缘情况的内容；参见第\
  \ 5.5.3.3 节，“在栈上传递参数”。）在推入操作数之前，将其从内存复制到寄存器中可以避免这个问题。注意，`AX` 是我们唯一用来帮助内存操作数推入栈的寄存器，因为我们必须保留调用者保存寄存器，我们已经将参数放入参数传递寄存器，并且为指令修复阶段预留了\
  \ `R10` 和 `R11`。\n\n一旦每个参数都就绪，我们就发出 `call` 指令将控制权转移给调用者。调用返回后，我们不再需要传递在栈上的参数，显然也不需要填充字节。我们使用\
  \ `DeallocateStack` 指令将这些参数和填充的总大小加到栈指针上。释放此空间后，栈指针将回到我们开始准备函数调用之前的位置。\n\n最后，我们获取函数的返回值。该值将位于\
  \ `EAX` 中，我们使用 `mov` 指令将其拷贝到目标位置。\n\n表 9-1 和 9-2 总结了本章从 TACKY 到汇编转换的更改。新的构造和对现有构造的更改已加粗显示。\n\
  \n**表 9-1：将顶层 TACKY 构造转换为汇编**\n\n| TACKY 顶层构造 | 汇编顶层构造 |\n| --- | --- |\n| `Program(function_definitions)`\
  \ | `Program(function_definitions)` |\n| `Function(name, params, instructions)`\
  \ | |\n\n```\nFunction(name, \n         [Mov(Reg(DI), param1),\n            Mov(Reg(SI),\
  \ param2),            \n             <从寄存器拷贝接下来的四个参数>, \n            Mov(Stack(16),\
  \ param7),\n            Mov(Stack(24), param8),\n            <从栈拷贝剩余参数>] + \n  \
  \       instructions)\n```\n\n**表 9-2：将 TACKY 指令转换为汇编**\n\n| TACKY 指令 | 汇编指令 |\n\
  | --- | --- |\n| `FunCall(fun_name, args, dst)` | |\n\n```\n<修复栈对齐>\n<设置参数> \nCall(fun_name)\
  \ \n<释放参数/填充字节> \nMov(Reg(AX), dst)\n```\n\n一个函数的汇编代码太复杂，无法用表格表示。\n\n#### 替换伪寄存器\n\
  \n接下来，我们将更新伪寄存器的替换。这里的大部分逻辑将保持不变：我们将与之前的章节完全相同的方式替换每个函数的伪寄存器。\n\n然而，我们确实需要进行一些更新。首先，我们将扩展此处理阶段（pass），以替换新\
  \ `push` 指令中的伪寄存器。（我们现在不直接推入，但我们将在第二部分中这样做）。其次，我们将更改跟踪栈空间的方式。之前，此处理阶段返回一个数字，因为程序只包含一个函数。现在我们需要为函数返回栈大小。\n\
  \n#### 在指令修复期间分配栈空间\n\n我们需要对指令修复阶段进行一处微小的调整：我们将更改 `AllocateStack` 每个函数定义的方式。首先，我们会在伪寄存器替换期间记录函数栈空间的地方查找函数所需的栈空间。接下来，我们将该栈大小向上取整到\
  \ 16 的倍数。向上取整栈帧的大小有助于在函数调用期间更容易维护正确的对齐。\n\n### 代码发射\n\n现在，我们需要确保代码发射阶段能够处理我们所有的新指令和操作数。这大部分内容都是直观的，但有几个与平台相关的细节需要考虑。正如我们已经看到的，在\
  \ macOS 上函数名前带有带下划线，但在 Linux 上没有。这同样适用于 `call` 指令，因此在 macOS 上你将发射：\n\n```\ncall\
  \ _foo\n```\n\n在 Linux 上你将发射：\n\n```\ncall foo\n```\n\n在 Linux 上，你通过不同方式调用外部库函数和同一文件中定义的函数。如果\
  \ `foo` 未在当前编译单元定义，你将发射：\n\n```\ncall foo@PLT\n```\n\n\n\n\n\n共享库则是另一情况了。当程序使用共享库时，链接器不会将整个库拷贝到可执行文件中。相反，该库会在运行时单独加载到内存中。链接器并不确切知道库在内存中的具体位置，因此它无法解析共享库函数的名称。必须由另一个名为*动态链接器*（dynamic\
  \ linker）的软件在运行时解析这些名称。动态链接器可以通过几种不同的方式解析符号，但最常见的方法是*懒绑定*（lazy binding）。使用懒绑定，我们在程序尝试调用某个函数之前并不会确定该函数的地址。这就是\
  \ PLT 发挥作用的地方。操作数 `foo@PLT` 指的并不是函数 `foo`，而是 PLT 中的一小段代码，如果我们还不知道 `foo` 的地址，这段代码会确定其地址，然后调用\
  \ `foo`。链接器负责生成这段代码，它被称为*PLT 条目*（PLT entry）。\n\n如果 `foo` 没有定义在当前单元中，它可能定义在共享库或其他链接器将包含在最终可执行文件中的对象文件中。在后的情况下，我们不需要\
  \ PLT：链接器将能够确定 `foo` 的地址（更准确地说，是相对于引用它的 `call` 指令的偏移量）。代码发射阶段无法区分这两种情况，因此无论如何都应该包含\
  \ `@PLT` 后缀；即使在不需要时包含此后缀也没有坏处。\n\n> **注意**\n\n*关于 PLT 如何工作以及我们为什么需要它的更深入的解释，请参见第\
  \ 1 章“附加资源”中第 21 页列出的两篇关于位置无关代码的博客。*\n\n在 Linux 上，要检查函数是否定义在当前单元中——因此检查是否需要 `@PLT`\
  \ 修饰符——你需要在符号表中查找它。在 macOS 上，处理懒绑定的方式略有不同，你完全不需要 `@PLT` 修饰符。\n\n表格 9-3 到 9-5 显示了章代码发射阶段的变化，其中新结构和对现有结构的更新已加粗显示。\n\
  \n**表 9-3：格式化顶层汇编结构**\n\n| 汇编顶层结构 | 输出 |\n| --- | --- |\n| `Program(function_definitions)`\
  \ | |\n```\n打印每个函数定义。 \n在 Linux 上，在文件末尾添加： \n    .section .note.GNU-stack,\"\",@progbits\n\
  ``` |\n\n**表 9-4：格式化汇编指令**\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `DeallocateStack(int)`\
  \ | |\n```\naddq    $<int>, %rsp\n``` |\n| `Push(operand)` | |\n```\npushq   <operand>\n\
  ``` |\n| `Call(label)` | |\n```\ncall    <label> \nor\ncall       <label>@PLT\n\
  ``` |\n\n**表 9-5：格式化操作数**\n\n| 汇编操作数 | 输出 |\n| --- | --- |\n| `Reg(AX)` | 8-byte\
  \ `%rax` |\n| | 4-byte `%ax` |\n| | 1-byte `%al` |\n| `Reg(DX)` | 8-byte `%rdx`\
  \ |\n| | 4-byte `%edx` |\n| | 1-byte `%dl` |\n| `Reg(CX)` | 8-byte `%rcx` |\n| |\
  \ 4-byte `%ecx` |\n| | 1-byte `%cl` |\n| `Reg(DI)` | 8-byte `%rdi` |\n| | 4-byte\
  \ `%edi` |\n| | 1-byte `%dil` |\n| `Reg(SI)` | 8-byte `%rsi` |\n| | 4-byte `%esi`\
  \ |\n| | 1-byte `%sil` |\n| `Reg(R8)` | 8-byte `%r8` |\n| | 4-byte `%r8d` |\n| |\
  \ 1-byte `%r8b` |\n| `Reg(R9)` | 8-byte `%r9` |\n| | 4-byte `%r9d` |\n| | 1-byte\
  \ `%r9b` |\n| `Reg(R10)` | 8-byte `%r10` |\n| | 4-byte `%r10d` |\n| | 1-byte `%r10b`\
  \ |\n| `Reg(R11)` | 8-byte `%r11` |\n| | 4-byte `%r11d` |\n\n\n\n\n\n|  | `1-byte`\
  \ | `%r11b` |\n\n现在我们为每个寄存器都有 8 字节、4 字节和 1 字节的名称。我们将在 `push` 指令中使用 8 字节名称，在条件设置指令中使用\
  \ 1 字节名称，在其他所有地方使用 4 字节名称。\n\n### 调用库函数\n\n一旦你更新了编译器的后端，你就能编译调用标准库函数的程序了。你将无法使用\
  \ `#include` 指令，因为任何标准库头文件都会使用你的编译器不支持的语言特性。相反，你需要显式地声明任何想要使用的库函数。\n\n在目前阶段，我们可以调用的库函数并不多。由于我们实现的唯一类型是\
  \ `int`，所以我们无法调用任何使用非 `int` 类型作为返回类型或参数类型的函数。但我们可以调用 `putchar`，它接受一个 `int` 参数并将相应的\
  \ ASCII 字符打印到 `stdout`。这足够我们编译 列表 9-32 了，这是一个略显不寻常的“Hello, World!”实现。\n\n```\nint\
  \ putchar(int c);\n\nint main(void) {\n    putchar(72);\n    putchar(101);\n   \
  \ putchar(108);\n    putchar(108);\n    putchar(111);\n    putchar(44);\n    putchar(32);\n\
  \    putchar(87);\n    putchar(111);\n    putchar(114);\n    putchar(108);\n   \
  \ putchar(100);\n    putchar(33);\n    putchar(10);\n}\n```\n\n列表 9-32: Hello, World!\n\
  \n尝试用你的编译器编译 列表 9-32 并运行它。如果你正确实现了一切，它将写入 `stdout`：\n\n```\n$ ./hello_world\nHello,\
  \ World!\n```\n\n这是一个巨大的里程碑！在运行剩余的测试用例之前，花点时间享受一下成就感吧。\n\n### 总结\n\n函数调用是我们目前为止看到的最强大且最复杂的功能。为了实现它们，你扩展了语义分析阶段以理解不同类型的标识符，并学习了\
  \ System V 调用约定的方方面面。所有的工作都得到了回报：你终于可以编译与外部世界交互的程序了！\n\n你为其他语言特性奠定了基础。在下一章实现文件作用域变量和存储类限定符时（第一部分的最后一章！），你将扩展标识符链接的概念并基于标识符解析传递的最新更改进行构建。在整个第二部分中添加更多类型时，你将继续扩展类型检查器。\n\
  \n![](img/pg206.jpg)\n\n描述\n\n## 10 文件作用域变量声明和存储类限定符\n\n![](img/opener-img.jpg)\n\
  \n我们将通过实现一些与函数和变量声明相关的重要功能来结束第一部分。我们将添加对文件作用域变量声明的支持——即在源文件的顶层声明——并引入 `static` 和\
  \ `extern` 关键字。这些关键字是存储类限定符，用于控制声明的链接属性和声明对象的存储生存期（该对象在内存中存在多久）。\n\n我们将在本章的大部分时间花在语义分析阶段，以确定每个声明的链接属性和存储生存期。我们还需要一些新的汇编指令来定义和初始化不同类型的变量，但对编译器后端的更改将是简单的。让我们从回顾\
  \ C 标准对声明和存储类限定符的说明开始。即使你对 C 非常熟悉，我也建议阅读以下章节。对于编译器开发者来说，语言这部分与 C 程序员看起来完全不同，很大程度上是因为你的编译器需要支持任何理智的\
  \ C 程序员都不会使用的行为。\n\n### 关于声明的一切\n\n源文件中的每个声明都有几个我们需要跟踪的属性，我们将在本节中检查每一个属性。这些包括声明的作用域、它的链接属性，以及它是仅声明还是定义。（它的类型也很重要，但我们在本章中对它没有新新意要说的了。）我们还需要跟踪程序中每个变量的存储生存期。\n\
  \n确定这些属性的规则非常复杂。它们取决于标识符是指向函数还是变量，取决于它是在文件作用域还是块作用域（函数体内部）声明的，以及应用了它的它的哪种存储类限定符。`static`\
  \ 限定符有两个不同的含义，分别适用于不同的语境。`extern` 限定符有多个看似无关的影响；这些也取决于语境。（其他的存储类限定符——`auto`、`register`、`_Thread_local`\
  \ 和 `typedef`——具有多种不同的用途，我不会深入探讨。基本上，C 标准的这部分是一团糟，但我们会尽力理清它。）\n\nC 语言中关于声明的术语可能不一致，所以在开始之前我会详细说明我对几个术语的使用：\n\
  \n*   *文件*（file）或*源文件*（source file）是一个预处理过的源文件，在 C 标准（以及上一章）中被称为“翻译单元”。\n*   *静态变量*（static\
  \ variable）是具有静态存储生存期的变量（在第 212 页的“存储生存期”中讨论），而不只是用 `static` 存储类限定符声明的变量。带有 `static`\
  \ 限定符的变量都是静态变量，但并非所有静态都是用该限定符声明的。\n*   *自动变量*（automatic variable）是具有自动存储生存期的变量，相对于静态存储生存期。之前的章节中遇到的所有变量都是自动变量。\n\
  *   *外部变量*（external variable）是任何具有内部或外部链接的变量，而不只是用 `extern` 存储类限定符声明的变量。正如我们所看到的，所有的外部变量都是静态变量，但并非所有静态变量都是外部。\n\
  \n#### 作用域\n\n函数和变量遵循相同的作用域规则。变量可以在文件作用域或块作用域声明，就像函数一样。文件作用域变量像函数和块作用域变量一样，在使用之前必须声明，并可能被块作用域标识符遮蔽。由于你已经知道了确定标识符作用域的规则，这里没有更多可说的。\n\
  \n\n\n\n\n#### 链接\n\n到目前为止，函数声明始终具有外部链接（external linkage）：对特定函数名的每一个声明都指向同一个函数定义。我们目前为止见过的局部变量声明没有链接：相同变量名的不同声明始终指向不同的对象。默认情况下，文件作用域的变量声明具有外部链接，就像函数声明一样。当存在同一标识符的多个文件作用域声明时，编译器需要对它们进行协调，以便它们都能指向同一个实体，或者报错。\n\
  \n通过使用 `static` 限定符，我们还可以声明具有*内部链接*（internal linkage）的函数和变量。内部链接的工作方式与外部链接相似，但具有内部链接的声明永远不会引用其他文件的实体。为了说明这种区别，让我们考虑由两个源文件组成的程序。列表\
  \ 10-1 显示了第一个文件。\n\n```c\n❶ int foo(void) {\n    return 1;\n}\n\n❷ int bar(void)\
  \ {\n    return 2;\n}\n```\n*列表 10-1：定义两个外部链接函数的源文件*\n\n列表 10-2 显示了第二个文件。\n\n```c\n\
  ❸ int foo(void);\n❹ static int bar(void);\n\nint main(void) {\n    return foo()\
  \ + bar();\n}\n\n❺ static int bar(void) {\n    return 4;\n}\n```\n*列表 10-2：声明一个内部链接函数\
  \ (bar) 和两个外部链接函数 (foo 和 main) 的源文件*\n\n在列表 10-1 中，我们定义了两个具有外部链接的函数：`foo` ❶ 和 `bar`\
  \ ❷。列表 10-2 也包含了标识符 `foo` ❸ 和 `bar` ❹❺ 的声明。首先，让我们弄清楚列表 10-2 中的 `foo` 代表什么。因为 ❸ 处的声明没有包含\
  \ `static` 限定符，它具有外部链接。因此，声明 ❶ 和 ❸ 指向同一个函数，该函数定义在 ❶ 处。\n\n接下来，让我们考虑 `bar`。因为 ❹ 处的声明包含了\
  \ `static` 限定符，它具有内部链接。这意味着它不指向 ❷ 处的定义。相反，它声明了一个全新的函数。该函数的定义出现在后面，即 ❺ 处。由于声明 ❹ 和\
  \ ❺ 都具有内部链接且出现在同一个文件中，它们指向同一个函数。因此，`main` 将使用 ❺ 处的 `bar` 的定义来计算 `1 + 4` 并返回 `5`。\n\
  \n请注意，具有内部链接的标识符不会遮蔽（shadow）具有外部链接的标识符，反之亦然。列表 10-2 中 `bar` 的声明并没有遮蔽列表 10-1 中 ❷\
  \ 处的定义；相反，它声明了一个全新的函数。\n\n\n\n\n\n你可以使用 `extern` 将一个具有外部链接的变量带回作用域，如果它被局部变量遮蔽了。Listing\
  \ 10-5 显示了这是如何工作的。\n\n```\nint a = 4;\nint main(void) {\n    int a = 3;\n    {\n\
  \      ❶ extern int a;\n        return a;\n    }\n}\n```\n\n### Listing 10-5: 使用\
  \ `extern` 将被遮蔽的外部链接变量带回作用域\n\n当我们在 `main` ❶ 中使用 `extern` 限定符声明 `a` 时，之前任何具有内部或外部链接的声明都是不可见的。（`a`\
  \ 的初始文件作用域声明具有外部链接，但它被第二个块作用域声明所隐藏了。该块作用域声明是可见的，但它没有链接。）因此，此此 `extern` 声明具有外部链接。由于早先的文件作用域的\
  \ `a` 声明也具有外部链接，这两个声明都指向同一个变量。然后，我们在下一行的 `return` 语句中使用该变量。结果是，`main` 返回了 `4`。\n\
  \n早些时候我提到过没有存储类限定符的函数声明总是被处理为包含 `extern` 限定符。考虑此规则如何影响 Listing 10-6 中函数定义的链接性。\n\
  \n```\nstatic int my_fun(void);\nint my_fun(void) {\n    return 0;\n}\n```\n\n###\
  \ Listing 10-6: 带有 `static` 限定符的函数声明，后跟一个没有存储类限定符的该函数定义\n\n正如我们在 Listing 10-3 中所示，带有\
  \ `extern` 限定符的声明将与该标识符之前的声明具有相同的链接（如果之前的声明是可见的）。由于我们将 `my_fun` 的定义处理为带有 `extern`\
  \ 限定符，它将具有与上一行声明相同的链接；即内部链接。这条规则意味着，在函数声明中包含 `extern` 总是冗余的（内联函数除外，我们没有实现那部分）。接下来，我们将考虑一个本章的新概念：存储生存期。\n\
  \n#### 存储生存期\n\n存储生存期是变量的一个属性；函数没有存储生存期。C 标准第 6.2.4 节第 1-2 段提供了如下内容：“对象具有存储生存期，这决定了它的生存期……对象的生存期是程序执行期间保证为其预留存储空间。对象在整个生存期内存在、具有常量地址，并在整个生存期内保留其最后存储的值。”换句话说，在对象的生存期内，你可以像往常一样操作它：你可以向它写入、从它读取，并取回你写入的值。在此期间，对象不会被释放空间或重新初始化。\n\
  \n在本章中，我们将考虑两种存储生存期：自动和静态。我们在前面的章节中看到的所有变量都具有自动存储生存期。具有自动生存期变量的生存期从你进入声明它的块开始，到你离开该块时结束。这意味着例如，你不能使用自动变量来跟踪函数被调用的次数。为了理解为什么，请看\
  \ Listing 10-7，它正尝试这样做。\n\n```c\n#include <stdio.h>\n\nint recursive_call(int count_was_initialized)\
  \ {\n    int count;\n    if(!count_was_initialized) {\n        count = 0;\n    \
  \    count_was_initialized = 1;\n    }\n    count = count + 1;\n    printf(\"This\
  \ function has been called %d times\\n\", count);\n    if (count < 20) {\n     \
  \   recursive_call(count_was_initialized);\n    }\n    return 0;\n}\n```\n\n###\
  \ Listing 10-7: 在多次函数调用之间共享自动变量值的错误尝试\n\nListing 10-7 中的 `recursive_call` 函数尝试在第一次调用它时初始化局部变量\
  \ `count`，然后在每次调用时对其进行递增。这行不通，因为 `count` 具有自动存储生存期；每次调用 `recursive_call` 都会分配一个全新的、未定义的\
  \ `count` 副本，该副本在调用返回时会被释放。\n\n另一方面，如果变量具有静态存储生存期，则它的生存期持续整个程序期间。具有静态存储生存期的变量在程序启动前初始化一次，它们的生存期在程序退出时结束。\n\
  \n确定存储生存期的规则很简单：所有在文件作用域声明的变量都具有静态存储生存期，在块作用域使用 `static` 或 `extern` 关键字声明的变量也是如此。在块作用域声明但没有存储类限定符的变量具有自动存储生存期。标准还定义了分配存储生存期（我们将在\
  \ Part II 中添加 `malloc` 支持时讨论它）以及线程存储生存期（我们将在书中不会实现）。\n\n我们可以使用静态计数器来修复 Listing 10-7。Listing\
  \ 10-8 显示了 `recursive_call` 的正确实现。\n\n```c\n#include <stdio.h>\n\nint recursive_call(void)\
  \ {\n  ❶ static int count = 0;\n    count = count + 1;\n    printf(\"This function\
  \ has been called %d times\\n\", count);\n    if (count < 20) {\n        recursive_call();\n\
  \    }\n    return 0;\n}\n```\n\n### Listing 10-8: 在多次函数调用之间正确共享静态变量的值\n\n现在，因为\
  \ `count` 是使用 `static` 关键字 ❶ 的，它具有静态存储生存期。我们在程序启动前仅分配一次 `count` 并将其初始化为 `0`。然后，我们在每次调用\
  \ `recursive_call` 时对同一个 `count` 变量进行递增。\n\n\n\n\n\n当我们进入 `recursive_call` 内部的声明处时，我们不会再次初始化\
  \ `count`。声明标记了程序中变量进入作用域的点，而不是执行过程中初始化的点。重要的一点是理解：静态变量的作用域和它的生命周期是相互无关的。在第 7 章中，我将变量的作用域描述为程序中使用该变量的部分。现在我们需要完善这个定义，并明确指出它是程序*源代码*中可以使用该变量的部分。另一方面，变量的生命周期是指在*程序执行*过程中变量拥有地址和值的阶段。对于自动变量，作用域和生命周期的联系如此紧密以至于这种区别几乎无关紧要：变量的生命周期从你执行其所在作用域的块开始，并在执行完该块时结束。但静态变量的生命周期独立于其作用域。例如，在代码列表\
  \ 10-8 中，`count` 的生命周期持续整个程序运行期间，但它的作用域仅从 `recursive_call` 中的声明处开始延伸到函数结束。\n\n由于静态变量在启动前就会初始化，它们的初始化器必须是常量。代码列表\
  \ 10-9 展示了两个文件作用域声明，其中一个有一个无效的初始化器。\n\n```\nint first_var = 3;\nint second_var =\
  \ first_var + 1;\n```\n\n*代码列表 10-9：具有有效和无效初始化器的文件作用域变量声明*\n\n`first_var` 和 `second_var`\
  \ 都具有静态存储生存期，因为它们是在文件作用域声明的。`first_var` 的初始化器是有效的，因为它是一个常量。然而，`second_var` 的初始化器是无效的，因为你不能在程序启动之前计算\
  \ `first_var + 1` 这样的表达式。\n\n> **注意**\n\n> *C 标准允许使用常量表达式（如 1 + 1）来初始化静态变量，因为这些表达式可以在编译时计算。为了方便我们的工作，我们的编译器在初始化器中仅支持常量值，而不支持常量表达式。*\n\
  \n### 定义 vs 声明\n\n在上一章中，我们必须区分函数定义和函数声明。在本章中，我们将这种区别扩展到变量。如果一个变量被定义了，我们的汇编程序需要为它分配存储并可能对其进行初始化。如果它被声明但未被定义，我们不会为它分配存储；我们将依靠链接器在另一个对象文件中找到定义。与函数一样，变量可以声明多次，但只能定义一次。\n\
  \n识别函数定义很容易，因为它们有函数体。要确定什么算作变量定义要稍微复杂一点。让我们过一遍规则，以便你知道哪些变量声明也是定义，哪些不是。我们还将讨论如何（以及何时）初始化那些在没有显式初始化器的情况下定义的变量。\n\
  \n首先，每个带有初始化器的变量声明都是定义。这并不意外，因为如果你没有为变量分配存储，就无法初始化它。其次，每个没有链接（linkage）的变量声明都是定义。没有链接且不是定义的变量声明将完全没有用：没有链接的变量不能声明多次，因此你无法在程序的其他地方定义该变量。\n\
  \n我们如何初始化没有链接的变量取决于它的存储生存期。记住之前章节中的局部变量分配在栈上空间，但不一定会被初始化。正如我们即将看到的，局部静态变量分配在不同的内存段中，并且它们总是被初始化的。如果没有提供显式初始化器，它们会被初始化为零。\n\
  \n如果一个变量声明带有 `extern` 限定符且没有初始化器，则它不是定义。注意，块作用域内的 `extern` 变量声明不能有初始化器。因此，它们永远不是定义。（这类似于可以在块作用域内声明函数，但不能定义它们）。我们可以使用\
  \ `extern` 限定符来声明在同一个文件中定义的变量，如代码列表 10-10 所示。\n\n```\nextern int three;\n\nint main(void)\
  \ {\n    return three;\n}\n\nint three = 3;\n```\n*代码列表 10-10：在文件开头声明外部变量并在结尾定义*\n\
  \n列表开头的声明将 `three` 引入作用域，列表末尾的定义决定了它的初始值 `3`。`extern` 限定符允许我们声明在其他文件中定义的变量，如代码列表\
  \ 10-11 所示。\n\n```\nextern int external_var;\n\nint main(void) {\n    return 1 +\
  \ external_var;\n}\n```\n*代码列表 10-11：声明变量但不定义它*\n\n由于 `external_var` 在此文件中没有定义，编译器不会为其分配或初始化它。链接器要么在另一个文件中找到它的定义，要么抛出错误。\n\
  \n具有内部或外部链接、没有 `extern` 限定符且没有初始化器的变量声明是*尝试性定义*（tentative definition）。代码列表 10-12\
  \ 展示了一个示例。\n\n```\nint x;\n\nint main(void) {\n    return x;\n}\n```\n*代码列表 10-12：尝试性定义*\n\
  \n此文件中 `x` 的唯一定义是第一行的尝试性定义。如果变量被尝试性定义，我们将将其初始化为零。因此，代码列表 10-12 的第一行处理方式与以下非尝试性定义完全相同：\n\
  \n```\nint x = 0;\n```\n\n如果一个文件包含同一个变量的尝试性定义和显式初始化的定义，如代码列表 10-13 所示，则显式定义优先级更高。\n\
  \n```\nint x;\n\nint main(void) {\n    return x;\n}\n\nint x = 3;\n```\n*代码列表 10-13：尝试性定义后的显式定义*\n\
  \n\n\n\n声明之间存在多种冲突的情况。我们的编译器已经可以检测其中某些冲突。例如，当同一个标识符在同一个局部作用域内出现两次声明，且至少有一个没有链接（linkage）时，编译器会检测到该错误。这是一个错误，因为你无法将对该标识符的后续使用解析到单一实体。\n\
  \n正如我之前提到的，同时使用内部链接（internal linkage）和外部链接（external linkage）来声明同一个标识符也是一个错误。即使这两个声明位于源文件中完全不同的部分也会有问题。例如，[列表\
  \ 10-15](#chapter10.xhtml_list10-15）包含了冲突的声明。\n\n\n\n\n```\nint main(void) {\n \
  \   extern int foo;\n    return foo;\n}\n\nstatic int foo = 3;\n```\n\n列表 10-15：具有冲突链接属性的变量声明\n\
  \n在 `main` 中声明 `foo` 的地方，没有其他声明是可见的。（变量何时变得可见取决于它在程序源代码中声明的位置，而不是取决于它在程序执行期间初始化的时间。）根据我们之前讨论的规则，这意味着\
  \ `foo` 具有外部链接（external linkage）。然而，在列表后面，`foo` 在文件作用域内被声明为具有内部链接（internal linkage）。你不能定义一个同时具有内部链接和外部链接的对象，因此这是非法的。\n\
  \n最后，如果同一个实体的两个声明具有不同的类型，就会发生冲突。声明一个同名的外部变量和函数是非合法的。同样，即使在诸如列表 10-16 这样的程序中也是如此，其中冲突的声明位于程序完全不同的部分。\n\
  \n```\nint foo = 3;\n\nint main(void) {\n    int foo(void);\n    return foo();\n\
  }\n```\n\n列表 10-16：具有冲突类型的声明\n\n由于 `foo` 的两个声明都具有外部链接，它们理应该引用同一个实体，但这是可能的，因为一个是函数声明，另一个是变量声明。因此，该程序是无效的。\n\
  \n### 多重定义\n\n我们已经看到在同一个程序中多次定义函数是非法的。对外部变量进行多次定义也是非法的。如果一个外部变量在同一个文件中被定义多次，你的编译器应该产生错误。如果一个函数或变量在多个文件中被定义，你的编译器无法捕获该错误，但链接器（linker）可以做到。\n\
  \n### 无定义\n\n这种错误同时适用于函数和变量。如果你使用了一个声明了但从未定义的标识符，你将在链接时得到错误，此时链接器会尝试寻找定义但失败。由于这是链接时错误，你的编译器不需要检测它。\n\
  \n### 无效初始化器\n\n正如我们所看到的，静态变量的初始化器必须是一个常量。块作用域内的 `extern` 声明不能有任何初始化器，即使是常量也不行。\n\
  \n### 存储限定符的限制\n\n你不能将 `extern` 或 `static` 限定符应用于函数参数或在 `for` 循环头中声明的变量。你不能将 `static`\
  \ 应用于块作用域内的函数声明。（你可以对它们应用 `extern`，但它没有任何作用。）\n\n### 汇编中的链接与存储持续期\n\n当我们扩展编译器的每个阶段——特别是语义分析阶段时，理解我们在上一节中涵盖的概念如何转换为汇编将很有帮助。我将先讨论链接，然后讨论存储持续期。链接非常直观：如果一个标识符具有外部链接，我们将为相应的汇编标签发射\
  \ `.globl` 指令。如果一个标识符没有外部链接，我们不会发射 `.globl` 指令。`.globl` 指令对函数名和变量名的作用相同。\n\n现在我们来谈存储持续期。我们在前面的章节中处理的具有自动持续期（automatic\
  \ storage duration）的变量都存储在栈上。静态变量存储在内存的不同部分，即*数据段*。（有些静态变量存储在与之密切相关的 BSS 段，我稍后会讨论。）像栈一样，数据段是程序可以读取和写入的内存区域。然而，栈被分为帧（frames），而数据段是一个大块。这使得数据段成为存储具有静态持续期变量的理想位置：当我们调用时，它们不会被释放。我们不需要像\
  \ `RSP` 或 `RBP` 这样的寄存器指向数据段中的位置。默认情况下，汇编器写入到文本段（text section）。`.data` 指令告诉汇编器开始写入数据段。列表\
  \ 10-17 初始化了数据段中的一个变量。\n\n```\n .data\n    .align 4\nvar:\n    .long 3\n```\n\n\
  列表 10-17：初始化变量\n\n\n\n\n\n我之前提到过某些静态变量存储在 `BSS section` 中。（由于某些模糊的历史原因，`BSS` 代表\
  \ `Block Started by Symbol`，即由符号启动的块）。该区域的工作方式与数据段几乎相同，只是它只包含初始化为零的变量。这是一种节省磁盘空间的技巧；可执行文件或对象文件只需要记录\
  \ `BSS section` 的大小，而不是其内容，因为它的内容全零。\n\nListing 10-18 在 `BSS section` 中初始化了一个变量。\n\
  \n```\n .bss\n    .align 4\nvar:\n    .zero 4\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >Listing 10-18: 在 BSS section 中初始化变量</samp>\n\n这段代码与 Listing 10-17 有两处不同。首先，我们使用\
  \ `.bss` 指令写入 `BSS section` 而不是数据段。其次，我们使用 `.zero` `n` 指令写入 `n` 个字节的零。例如，`.zero\
  \ 4` 将一个 4 字节的整数初始化为零。无论处理数据段还是 `BSS section`，我们使用 `.align` 指令、声明标签以及包含或省略 `.globl`\
  \ 指令的方式完全相同。\n\n如果你在正在编译的文件声明了一个变量但没有定义它，你将不会向数据段或 `BSS section` 写入任何内容。\n\n最后，让我们看看如何在汇编指令中引用数据段中的标签。这一行代码将立即值\
  \ `4` 写入标记为 `var` 的内存地址：\n\n```\nmovl    $4, var(%rip)\n```\n\n如 `var(%rip)` 这样的操作数使用了\
  \ `RIP-relative addressing`（RIP 相对寻址），它引用相对于指令指针的内存地址。显然，我们不能像引用栈变量那样，相对于 `RBP`\
  \ 和 `RSP` 来引用数据段中的符号。我们同样无法在链接时将它们替换为绝对地址，因为我们正在编译的是位置无关的代码，这种代码可以加载到程序内存中的任何位置。相反，我们使用\
  \ `RIP` 寄存器（它持有程序文本段中当前指令的地址）来计算程序数据段中 `var` 等变量的地址。\n\n`RIP-relative addressing`\
  \ 的细节非常复杂，我在这里就不详细介绍了。相反，我再次推荐 Eli Bendersky 关于位置无关代码的优秀博客文章，我已经在第 1 章 的“额外资源”部分（位于第\
  \ 21 页）提供了这些链接。\n\n现在你已经理解了存储生存期、链接和变量初始化在 C 语言汇编中是如何工作的，你准备好扩展你的编译器了。\n\n### 词法分析器\n\
  \n你将在章添加两个新关键字：\n\n`static`\n\n`extern`\n\n### 解析器\n\n在本章中，我们将对 `AST` 进行两处更改：我们将变量声明作为一种顶层结构添加，并对函数和变量声明都添加可选的存储类限定符。Listing\
  \ 10-19 显示了更新后的 `AST` 定义。\n\n```\nprogram = Program(declaration*)\ndeclaration =\
  \ FunDecl(function_declaration) | VarDecl(variable_declaration)\nvariable_declaration\
  \ = (identifier name, exp? init, storage_class?)\nfunction_declaration = (identifier\
  \ name, identifier* params,\n                        block? body, storage_class?)\n\
  storage_class = Static | Extern\nblock_item = S(statement) | D(declaration)\nblock\
  \ = Block(block_item*)\nfor_init = InitDecl(variable_declaration) | InitExp(exp?)\n\
  statement = Return(exp)\n          | Expression(exp)\n          | If(exp condition,\
  \ statement then, statement? else)\n          | Compound(block)\n          | Break\n\
  \          | Continue\n          | While(exp condition, statement body)\n      \
  \    | DoWhile(statement body, exp condition)\n          | For(for_init init, exp?\
  \ condition, exp)\n          exp = Constant(int)\n            | Identifier\n   \
  \         | Unary(exp)\n            | Binary(exp)\n            | Assignment(exp)\n\
  \            | Conditional(exp,\n                exp,\n                exp)\n  \
  \          | FunctionCall(identifier,\n                args)\nunary_operator = Complement\
  \ | Negate | Not\nbinary_operator = Add | Subtract | Multiply | Divide | Remainder\
  \ | And | Or\n                | Equal | NotEqual | LessThan | LessEqual | GreaterThan\
  \ | GreaterEqual\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">Listing\
  \ 10-19: 抽象语法树</samp>\n\n\n\n我们已经定义了一个包含函数和变量声明的 `AST` 节点。现在我们支持文件作用域的变量声明，将在顶层使用\
  \ `AST` 节点。\n\nListing 10-20 显示了语法的相应变化。\n\n```\n<program> ::= {<declaration>}\n\
  <declaration> ::= <variable-declaration> | <function-declaration>\n<variable-declaration>\
  \ ::= {<specifier}+ <identifier> [\"=\" <exp>] \";\"\n<function-declaration> ::=\
  \ {<specifier}+ <identifier> \"(\" <param-list> \")\" (<block> | \";\")\n<param-list>\
  \ ::= \"void\" | \"int\" <identifier> {\",\" \"int\" <identifier>}\n<specifier>\
  \ ::= \"int\" | \"static\" | \"extern\"\n<block> ::= \"{\" {<block-item>} \"}\"\n\
  <block-item> ::= <statement> | <declaration>\n<for-init> ::= <variable-declaration>\
  \ | [<exp>] \";\"\n<statement> ::= \"return\" <exp> \";\"\n              | <exp>\
  \ \";\"\n              | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n\
  \              | <block>\n              | \"break\" \";\"\n              | \"continue\"\
  \ \";\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n             \
  \ | \"do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\"\
  \ \"(\" <for-init> [<exp>] \";\" [<exp>] \")\" <statement>\n              | \";\"\
  \n<exp> ::= <factor> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n<factor>\
  \ ::= <int> | <identifier> | <unop> <factor> | \"(\" <exp> \")\"\n           | <identifier>\
  \ \"(\" [<argument-list>] \")\"\n<argument-list> ::= <exp> {\",\" <exp>}\n<unop>\
  \ ::= \"-\" | \"~\" | \"!\"\n<binop> ::= \"-\" | \"+\" | \"*\" | \"/\" | \"%\" |\
  \ \"&&\" | \"||\"\n          | \"==\" | \"!=\" | \"<\" | \"<=\" | \">\" | \">=\"\
  \ | \"=\"\n<identifier> ::= ? An identifier token ?\n<int> ::= ? A constant token\
  \ ?\n```\n\n\n\n\n我们将 `program` 定义为 `declaration` 符号的列表，就像我们在 Listing 10-19 中做的那样。我们还引入了一个新的\
  \ `specifier` 符号，它同时代表类型限定符和存储类限定符，并且要求每个声明都以限定符列表开头。我们在这里添加了一处新的 EBNF 表示法：用大括号包裹内容并在后面跟\
  \ `+` 符号表示该内容必须至少重复一次。因此，`{specifier}+` 表示一个非空的限定符列表。请注意 `param-list` 规则没有变化；我们仍然期望每个参数都用单个\
  \ `int` 关键字进行声明，而不是限定符列表。如果解析器遇到 `static` 或 `extern` 参数，它应该抛出错误。\n\n### 解析类型和存储类限定符\n\
  \n我们将类型限定符和存储类限定符合并为一个符号，因为它们在声明中可以以任何顺序出现。换句话说，声明\n\n```\nstatic int a = 3;\n```\n\
  \n等同于：\n\n```\nint static a = 3;\n```\n\n当我们在 Part II 中添加更多类型限定符时，情况会变得更加复杂。一个声明可能包含多个类型限定符（如\
  \ `long` 和 `unsigned`），它们相对于存储类限定符以及彼此之间可以以任何顺序出现。\n\n为了构建 AST，解析器需要消耗声明开头的限定符列表，然后将它们转换为恰好一个类型和一个最多一个存储类限定符。Listing\
  \ 10-21 中的伪代码概述了如何处理该限定符列表。\n\n```\nparse_type_and_storage_class(specifier_list):\n\
  \    types = []\n    storage_classes = []\n  ❶ for specifier in specifier_list:\n\
  \        if specifier is \"int\":\n            types.append(specifier)\n       \
  \ else:\n            storage_classes.append(specifier)\n\n    if length(types) !=\
  \ 1:\n        fail(\"Invalid type specifier\")\n    if length(storage_classes) >\
  \ 1:\n        fail(\"Invalid storage class\")\n\n  ❷ type = Int\n\n    if length(storage_classes)\
  \ == 1:\n      ❸ storage_class = parse_storage_class(storage_classes[0])\n    else:\n\
  \        storage_class = null\n\n    return (type, storage_class)\n```\n\nListing\
  \ 10-21: 确定声明的类型和存储类\n\n我们首先将列表划分为类型限定符和存储类限定符 ❶。然后，我们验证每个列表。类型限定符列表必须恰好有一个值。存储类限定符列表可以为空，也可以包含恰好一个值。最后，我们返回结果。目前，`Int`\
  \ 是唯一可能的类型 ❷。如果存储类限定符列表不为空，我们将将其中的唯一元素转换为对应的 `storage_class` AST 节点 ❸。（我省略了 `parse_storage_class`\
  \ 的伪代码，因为它没什么好写的。）如果存储类限定符列表为空，则该声明没有存储类。\n\nListing 10-21 比我们现在需要的稍微复杂一点，但当我们稍后章节中添加更多类型限定符时，它将很容易扩展。\n\
  \n### 区分函数声明和变量声明\n\n我们剩下的最后一个挑战是，如果不解析整个类型和存储类限定符列表，我们就无法区分 `function-declaration`\
  \ 和 `variable-declaration` 符号。一旦我们在后面的章节中支持更复杂的声明，这意味着编写单独的函数来解析这两者是不现实的；相反，你应该编写一个函数来同时解析两者并返回一个\
  \ `declaration` AST 节点。现在你已经有了扩展 `for` 循环所需的一切。\n\n## 语义分析\n\n接下来，我们需要扩展标识符解析和类型检查阶段。在标识符解析阶段，我们将处理顶层声明并检查重复声明。在类型检查阶段，我们将为符号表添加存储类和链接信息，因为我们在生成汇编时需要这些信息。我们还类型检查器中处理错误情况。\n\
  \n#### 标识符解析：解析外部变量\n\n像函数一样，外部变量在标识符解析阶段不会重命名。我们的标识符映射将跟踪每个标识符是否有链接（内部或外部）。在类型检查阶段之前，我们不需要区分内部或外部链接。\n\
  \n我们需要单独的代码来处理块作用域和文件作用域变量声明，因为在这些作用域下确定链接的规则不同。Listing 10-22 演示了如何解析文件作用域下的变量声明。\n\
  \n```\nresolve_file_scope_variable_declaration(decl, identifier_map):\n    identifier_map.add(decl.name,\
  \ MapEntry(new_name=decl.name,\n                                           from_current_scope=True,\n\
  \                                           has_linkage=True))\n    return decl\n\
  ```\n\nListing 10-22: 解析文件作用域变量声明\n\n你很快就会看到，这比处理块作用域变量声明的代码简单得多。我们不需要生成唯一名称，因为外部变量在整个阶段都保留它们的原始名称。我们不需要担心该变量的之前的声明；任何之前的声明也必须具有内部或外部链接，因此它们将指向同一个对象并在标识符映射中具有相同的条目。（文件作用域声明可能会以其他方式冲突，但我们将在类型检查器中处理这些冲突。）无论是否为\
  \ `static`，我们都可以统一处理声明。由于我们不需要区分内部或外部链接，我们将继续使用上一章的 `has_linkage` 属性。对于文件作用域标识符，该属性始终为\
  \ `True`。\n\n\n\n现在我们来考虑块作用域的变量。如果使用 `extern` 关键字声明变量，我们在标识符映射中记录它具有链接（linkage），并保留其原始名称。否则，我们像以前处理局部变量一样处理它。如果一个标识符在同一个作用域内既被声明为有链接又没有链接，我们无法维护一致的标识符映射，因此会抛出一个错误。Listing\
  \ 10-23 显示了如何用伪代码实现这一点。\n\n```\nresolve_local_variable_declaration(decl, identifier_map):\n\
  \    if decl.name is in identifier_map:\n        prev_entry = identifier_map.get(decl.name)\n\
  \      ❶ if prev_entry.from_current_scope:\n            if not (prev_entry.has_linkage\
  \ and decl.storage_class == Extern):\n                fail(\"Conflicting local declarations\"\
  )\n\n    if decl.storage_class == Extern:\n      ❷ identifier_map.add(decl.name,\
  \ MapEntry(new_name=decl.name,\n                                               from_current_scope=True,\n\
  \                                               has_linkage=True))\n        return\
  \ decl\n    else:\n        unique_name = make_temporary()\n      ❸ identifier_map.add(decl.name,\
  \ MapEntry(new_name=unique_name,\n                                             \
  \  from_current_scope=True,\n                                               has_linkage=False))\n\
  \        --snip--\n```\n\n**Listing 10-23: 解析块作用域变量声明**\n\n首先，我们检查是否存在冲突声明 ❶。如果该标识符在当前作用域中已经声明，我们检查上一个声明的链接情况。如果它具有链接，且当前声明也是如此（如\
  \ `extern` 关键字所示），那么它们指向同一个对象。在这种情况下，声明是一致的，至少从标识符解析的角度来看是这样的。如果标识符中的一个（或两个）没有链接，则它们指向两个不同的对象，因此我们抛出一个错误。\n\
  \n假设没有冲突，我们更新标识符映射。如果此声明具有链接，它将保留当前名称 ❷；否则，我们将其重命名 ❸。注意，对于没有链接的变量，它们是 `static` 还是否，在这里的处理方式都是相同的。此外请注意，我们不需要递归处理\
  \ `extern` 变量的初始化器，因为它们根本不应该初始化器。（我删除了解析无链接变量初始化器的代码，因为这与之前的章节保持相同。）\n\n你不需要更改此轮次（pass）处理函数声明的方式，但有一个小例外：如果块作用域函数声明包含了\
  \ `static` 限定符，你应该抛出一个错误。在标识符解析期间完成这一点很容易，只需在验证块作用域函数声明没有体的相同位置即可。然而，在类型检查器甚至解析器中抛出此错误同样有效。\n\
  \n### 类型检查：跟踪静态函数和变量\n\n接下来，我们将更新符号表并处理剩余的错误情况。我们将向符号表添加几条新信息。首先，我们将记录每个变量的存储生存期（storage\
  \ duration）。其次，我们将记录具有静态存储期的变量的初始值。最后，我们将记录具有静态存储期的函数和变量是否全局可见。这些信息中的每项都将影响我们之后生成的汇编。\n\
  \n我们添加到类型检查器的大部分逻辑本身并不是类型检查，因为标识符的存储类和链接与其类型是分开的。但类型检查器是处理这些逻辑的自然位置，因为我们会在符号表中跟踪每个标识符的类型、链接和存储类。\n\
  \n#### 符号表中的标识符属性\n\n我们需要在符号表中跟踪每种类型标识符的不同信息：函数、具有静态存储期的变量以及具有自动存储期的变量。Listing 10-24\
  \ 提供了表示所有这些信息的一种方法。\n\n```\nidentifier_attrs = FunAttr(bool defined, bool global)\n\
  \                 | StaticAttr(initial_value init, bool global)\n              \
  \   | LocalAttr\n\ninitial_value = Tentative | Initial(int) | NoInitializer\n```\n\
  \n**Listing 10-24: 不同类型标识符的符号表属性**\n\n`StaticAttr` 代表我们为具有静态存储期的变量需要跟踪的属性。`initial_value`\
  \ 类型允许我们区分带有初始化器的变量定义、没有初始化器的尝试性定义（tentative definitions）以及 `extern` 变量声明。`FunAttr`\
  \ 代表函数，`LocalAttr` 代表函数参数和自动存储期的变量。每个符号表项都应该包含类型（如上一章中定义）和 `identifier_attrs`。\n\
  \n现在我们可以在符号表中表示我们需要的信息了，让我们来看看我们需要进行类型检查的三类声明：函数声明、文件作用域变量声明和块作用域变量声明。\n\n#####\
  \ 函数声明\n\n这里的大部分逻辑将保持不变。我们将检查当前声明与任何之前的声明类型是否相同，并确保函数没有被定义多次。唯一的区别是，我们还会记录函数是否全局可见。Listing\
  \ 10-25 中的伪代码捕捉了我们将如何对函数声明进行类型检查，其中相对于 Listing 9-21 的变化已加粗，并省略了部分未更改的代码。我还对代码做了一些更改以适应符号表的变化，尽管逻辑在本质上是相同的。这些没有加粗。）\n\
  \n```\ntypecheck_function_declaration(decl, symbols):\n    fun_type = FunType(length(decl.params))\n\
  \    has_body = decl.body is not null\n    already_defined = False\n  ❶ global =\
  \ decl.storage_class != Static\n\n  ❷ if decl.name is in symbols:\n        old_decl\
  \ = symbols.get(decl.name)\n        if old_decl.type != fun_type:\n            fail(\"\
  Incompatible function declarations\")\n        already_defined = old_decl.attrs.defined\n\
  \        if already_defined and has_body:\n            fail(\"Function is defined\
  \ more than once\")\n\n        if old_decl.attrs.global and decl.storage_class ==\
  \ Static:\n            fail(\"Static function declaration follows non-static\")\n\
  \      ❸ global = old_decl.attrs.global\n\n    attrs = FunAttr(defined=(already_defined\
  \ or has_body), global=global)\n    symbols.add(decl.name, fun_type, attrs=attrs)\n\
  \    --snip--\n```\n\n**Listing 10-25: 函数声明的类型检查**\n\n\n\n\n\n首先，我们查看函数的存储类 ❶。如果是\
  \ `static`，则该函数将不是全局可见的，因为它的链接是内部的。如果它是 `extern`（或完全缺失，效果等同），我们暂且认为该函数是全局可见的，因为它的链接是外部的。然而，这取决于作用域内还有其他声明。\n\
  \n接下来，我们查看这些其他声明，如果有的话 ❷。我们像在上一章中一样，检查是否存在类型不匹配和重复定义。然后，我们考虑链接。如果当前声明包含显式或隐式的 `extern`\
  \ 关键字，我们将保留上一个声明的链接（从而保留其 `global` 属性）。如果当前声明和之前的声明都具有内部链接，则没有冲突。无论何种情况，来自上一个声明的链接都保持不变\
  \ ❸。但如果该函数之前被声明为外部链接，而现在用 `static` 关键字声明，则声明发生冲突，因此我们抛出错误。\n\n我删减了函数的其余部分，因为它与上一章相同。\n\
  \n### 文件作用域变量声明\n\n当我们遇到文件作用域内的变量声明时，我们需要确定变量的初始值以及它是否全局可见。这些属性取决于当前声明以及对同一变量的任何之前的声明。列表\
  \ 10-26 显示了如何对文件作用域变量声明进行类型检查。\n\n```\ntypecheck_file_scope_variable_declaration(decl,\
  \ symbols):\n    if decl.init is constant i: ❶\n        initial_value = Initial(i)\n\
  \    else if decl.init is null: ❷\n        if decl.storage_class == Extern:\n  \
  \          initial_value = NoInitializer\n        else:\n            initial_value\
  \ = Tentative\n    else:\n        fail(\"Non-constant initializer!\")\n\n    global\
  \ = (decl.storage_class != Static) ❹\n\n    if decl.name is in symbols: ❺\n    \
  \    old_decl = symbols.get(decl.name)\n        if old_decl.type != Int:\n     \
  \       fail(\"Function redeclared as variable\")\n        if decl.storage_class\
  \ == Extern:\n            global = old_decl.attrs.global\n        else if old_decl.attrs.global\
  \ != global:\n            fail(\"Conflicting variable\")\n\n        if old_decl.attrs.init\
  \ is a constant:\n            if initial_value is a constant:\n                fail(\"\
  Conflicting file variable definitions\") ❻\n            else:\n                initial_value\
  \ = old_decl.attrs.init\n        else if initial_value is not a constant and old_decl.attrs.init\
  \ == Tentative:\n            initial_value = Tentative\n\n    attrs = StaticAttr(init=initial_value,\
  \ global=global)\n    symbols.add(decl.name, Int, attrs=attrs) ❼\n```\n列表 10-26：文件作用域变量声明的类型检查\n\
  \n首先，我们确定变量的初始值。这取决于声明的初始化器及其存储类说明符。如果初始化器是常量，我们将使用它❶。如果缺失 ❷，我们将记录该变量是已定义还是完全未定义，取决于这是否是一个\
  \ `extern` 声明。如果初始化器是常量以外的任何表达式，我们将抛出错误 ❸。\n\n接下来，我们确定变量是否全局可见 ❹。除非存储类说明符是 `static`，否则我们暂认为它是可见的。\n\
  \n然后，如果在符号表中记录了该标识符之前的声明，我们会将其考虑在内 ❺。我们验证之前的声明类型为 `Int` 而不是函数类型，然后尝试将 `global` 属性与之前的声明协调。如果这是一个\
  \ `extern` 声明，我们直接采用之前声明的 `global` 属性。否则，如果新旧的 `global` 属性不一致，我们将抛出错误。\n\n考虑之前声明的初始化器更为复杂。如果当前声明或之前的声明中有一个具有显式初始化器，我们将使用它。否则，如果新声明或之前的声明中有一个尝试性定义（tentative\
  \ definition），我们将使用 `Tentative` 初始化器。如果我们到为止还没有看到任何显式或尝试性定义，我们将坚持使用 `NoInitializer`。如果新旧声明都有显式初始化器，我们将抛出错误\
  \ ❻。\n\n最后，我们在符号表中添加（或更新）该变量的条目 ❼。\n\n### 块作用域变量声明\n\n我们将使用 列表 10-27 中的伪代码对块作用域内的变量声明进行类型检查。\n\
  \n```\ntypecheck_local_variable_declaration(decl, symbols):\n    if decl.storage_class\
  \ == Extern:\n        if decl.init is not null: ❶\n            fail(\"Initializer\
  \ on local extern declaration\")\n        if decl.name is in symbols:\n        \
  \    old_decl = symbols.get(decl.name)\n            if old_decl.type != Int: ❷\n\
  \                fail(\"Function redeclared as variable\")\n        else:\n    \
  \        symbols.add(decl.name, Int, attrs=StaticAttr(init=NoInitializer, global=True))\
  \ ❸\n\n    else if decl.storage_class == Static:\n        if decl.init is constant\
  \ integer i: ❹\n            initial_value = Initial(i)\n        else if decl.init\
  \ is null: ❺\n            initial_value = Initial(0)\n        else:\n          \
  \  fail(\"Non-constant initializer on local static variable\")\n        symbols.add(decl.name,\
  \ Int, attrs=StaticAttr(init=initial_value, global=False)) ❻\n\n    else:\n    \
  \    symbols.add(decl.name, Int, attrs=LocalAttr) ❼\n        if decl.init is not\
  \ null:\n            typecheck_exp(decl.init, symbols)\n```\n列表 10-27：块作用域变量声明的类型检查\n\
  \n为了处理 `extern` 变量，我们首先确保它没有初始化器❶ 且它之前没有被声明为函数❷。然后，如果该变量之前没有被声明过，我们在符号表中记录它是全局可见且未初始化的\
  \ ❸。如果它已经声明过了，我们什么都不做：局部的 `extern` 声明永远不会改变我们已经记录的初始值或链接。\n\n静态局部变量没有链接，因此我们不需要考虑之前的声明。我们只需检查变量的初始化器：如果是常量，我们就使用它\
  \ ❹；如果缺失，我们将变量初始化为零 ❺；如果不是常量，我们就抛出错误。然后，我们将变量添加到符号表中，记录它不是全局可见的 ❻。\n\n我们会在自动变量的符号表条目中包含\
  \ `LocalAttr` 属性❼。除了这个细节外，我们像在上一章一样对这些变量进行类型检查。\n\n\n\n\n\n当你在 `for` 循环头中处理声明时，在调用\
  \ Listing 10-27 中的代码之前，请验证其不包含存储类说明符。（或者，你也可以在标识符解析阶段处理这种错误情况，甚至可以在解析期间处理。）\n\n\
  类型检查阶段就此结束！为了实现 C 标准中关于定义、声明、链接和存储生存期的那些复杂的规则花费了大量工作。幸运的是，现在符号表已经包含了我们所需的所有信息，本章剩下的部分应该非常简单。\n\
  \n### TACKY 生成\n\n我们需要对 TACKY IR 进行两处添加。首先，我们将在函数定义中添加一个新的 `global` 字段，它对应最终汇编输出中的\
  \ `.globl` 指令：\n\n```\nFunction(identifier, bool global, identifier* params, instruction*\
  \ body)\n```\n\n其次，我们将添加一个顶层构造体来表示静态变量：\n\n```\nStaticVariable(identifier, bool\
  \ global, int init)\n```\n\n我们将使用这个构造体来表示外部和局部静态变量。最终，我们将每个 `StaticVariable` 构造体翻译一组汇编指令，以便在数据段或\
  \ BSS 段中初始化对象。Listing 10-28 展示了整个 TACKY IR，其中与上一章相比的更改已**加粗**。\n\n```\nprogram =\
  \ Program(top_level*)\ntop_level = Function(identifier, bool global, identifier*\
  \ params, instruction* body)\n          | StaticVariable(identifier, bool global,\
  \ int init)\ninstruction = Return(val)\n            | Unary(unary_operator, val\
  \ src, val dst)\n            | Binary(binary_operator, val src1, val src2, val dst)\n\
  \            | Copy(val src, val dst)\n            | Jump(identifier target)\n \
  \           | JumpIfZero(val condition, identifier target)\n            | JumpIfNotZero(val\
  \ condition, identifier target)\n            | Label(identifier)\n            |\
  \ FunCall(identifier fun_name, val* args, val dst)\nval = Constant(int) | Var(identifier)\n\
  unary_operator = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply\
  \ | Divide | Remainder | Equal | NotEqual\n                | LessThan | LessOrEqual\
  \ | GreaterThan | GreaterOrEqual\n```\n\nListing 10-28: 为 TACKY 添加静态变量和全局属性\n\n\
  我们将 `function_definition` 节点重命名为 `top_level`，因为它再仅仅仅仅代表函数。请注意，当我们将程序翻译为 TACKY 时，会将局部静态变量定义移动到顶层；它们变成了\
  \ `StaticVariable` 构造体，而不是函数体中的指令。\n\n当我们遍历 AST 并将其转换为 TACKY 时，将为每个顶层 `Function`\
  \ 设置新的 `global` 属性。我们可以在符号表中查找此属性。我们不会为文件作用域的变量声明或带有 `static` 或 `extern` 说明符的局部变量声明生成任何\
  \ TACKY。相反，在遍历完 AST *之后*，我们将执行一个额外的步骤，检查符号表中的每个条目，并为某些条目生成 `StaticVariable` 构造体。我们最终的\
  \ TACKY 程序将包含从原始 AST 转换来的函数定义以及从符号表生成的变量定义。\n\nListing 10-29 展示了如何将符号表条目转换为 TACKY\
  \ 变量定义。\n\n```\nconvert_symbols_to_tacky(symbols):\n    tacky_defs = []\n    for\
  \ (name, entry) in symbols:\n        match entry.attrs with\n        | StaticAttr(init,\
  \ global) ->\n            match init with\n            | Initial(i) -> tacky_defs.append(StaticVariable(name,\
  \ global, i))\n            | Tentative -> tacky_defs.append(StaticVariable(name,\
  \ global, 0))\n            | NoInitializer -> continue\n        | _ -> continue\n\
  ```\n\nListing 10-29: 将符号表转换为 TACKY\n\n我们查看每个符号表条目以确定它是否应该是 `StaticVariable`。如果它没有\
  \ `StaticAttr` 属性，我们就跳过它。如果它的初始值为 `NoInitializer`，我们也跳过它。任何未跳过的符号都会转换为 `StaticVariable`\
  \ 并添加到 TACKY 程序中。现在，先处理 AST 还是符号表并不重要。从第 16 章 开始，先处理 AST 后处理符号表将变得非常重要。在该章中，我们将根据需要向\
  \ TACKY 添加新的静态对象。\n\n### 汇编生成\n\n我们将对汇编 AST 进行一些细微更改。这些更改在 Listing 10-30 中已加粗显示。\n\
  \n```\nprogram = Program(top_level*)\ntop_level = Function(identifier, bool global,\
  \ instruction* instructions)\n          | StaticVariable(identifier, bool global,\
  \ int init)\ninstruction = Mov(operand src, operand dst)\n            | Unary(unary_operator,\
  \ operand)\n            | Binary(binary_operator, operand, operand)\n          \
  \  | Cmp(operand, operand)\n            | Idiv(operand)\n            | Cdq\n   \
  \         | Jmp(identifier)\n            | JmpCC(cond_code, identifier)\n      \
  \      | SetCC(cond_code, operand)\n            | Label(identifier)\n          \
  \  | AllocateStack(int)\n            | DeallocateStack(int)\n            | Push(operand)\n\
  \            | Call(identifier)\n            | Ret\n\nunary_operator = Neg | Not\n\
  binary_operator = Add | Sub | Mult\noperand = Imm(int) | Reg(reg) | Pseudo(identifier)\
  \ | Stack(int) | Data(identifier)\ncond_code = E | NE | G | GE | L | LE\nreg = AX\
  \ | CX | DX | DI | SI | R8 | R9 | R10 | R11\n```\n\nListing 10-30: 带静态变量的汇编 AST\n\
  \n#### 为变量定义生成汇编\n\n\n\n\n\n将我们新的 TACKY 构造转换为汇编非常简单，因为我们只是将 TACKY 的几个字段传递给等效汇编构造。表\
  \ 10-3 总结了此类转换的最新更新，其中新构造和现有构造的变化已**加粗**显示。附录 B 包含了本章节完整的 TACKY 到汇编的转换遍历，这也是第一部分\
  \ 该遍历的最终版本。\n\n**表 10-3：将顶层 TACKY 构造转换为汇编**\n\n| TACKY 顶层构造 | 汇编顶层构造 |\n| --- |\
  \ --- |\n| `Program(top_level_defs)` | `Program(top_level_defs)` |\n| `Function(name,\
  \ global, params, instructions)` | |\n```\nFunction(name, global, \n         [Mov(Reg(DI),\
  \ param1),\n          Mov(Reg(SI), param2),            \n           <copy next four\
  \ parameters from registers>, \n          Mov(Stack(16), param7),\n          Mov(Stack(24),\
  \ param8),            \n           <copy remaining parameters from stack>] +\n \
  \       instructions)\n``` | |\n| `StaticVariable(name, global, init)` | `StaticVariable(name,\
  \ global, init)` |\n\n我们将所有其他 TACKY 构造转换为汇编的方法不会改变。特别是，我们会把每个 TACKY `Var` 操作数转换为汇编\
  \ `Pseudo` 操作数，无论它具有静态存储期还是自动存储期。这意味着 `Pseudo` 这个名称已不再完全合适了；`pseudoregister`（伪寄存器）一词通常指理论上可以存在寄存器中的操作数，而静态变量无法做到。我们不会费力重命名这个操作数，但你应该记住，我们使用\
  \ `pseudoregister` 一词的方式略为寻常。\n\n### 根据存储期替换伪寄存器\n\n接下来，我们将调整用具体位置替换伪寄存器的方法。在之前的章节中，每个伪寄存器都被分配到栈上的一个位置。而这一次，并不是每个变量都属于栈；其中一些存储在数据段（data）或\
  \ BSS 段。我们将检查符号表来区分它们。回想一下，在整个伪寄存器替换遍历过程中，我们建立了一个从伪寄存器到具体地址的映射。当我们遇到一个不在该映射中的伪寄存器时，会在符号表中查找它。如果我们发现它具有静态存储期，我们将将其映射到具有相同名的\
  \ `Data` 操作数。否则，我们将像往常在栈上为它分配一个新的槽位。（如果它不在符号表中，意味着它是一个 TACKY 临时变量，因此它具有自动存储期。）例如，如果\
  \ `foo` 是静态变量，则汇编指令\n\n```\nMov(Imm(0), Pseudo(\"foo\"))\n```\n应该被重写为：\n\n```\n\
  Mov(Imm(0), Data(\"foo\"))\n```\n\n由于静态变量不在栈上，因此它们不会计入我们需要为每个函数跟踪的栈总大小。\n\n### 修复指令\n\
  \n你已经写了若干条重写规则，当一个或两个操作数是内存地址时这些规则将适用。请记住，`Data` 操作数也是内存地址！例如，如果你遇到指令\n\n```\nMov(Data(\"\
  x\"), Stack(-4))\n```\n你应该对 `Mov` 指令应用常规重写规则，此时源操作数和目标操作数都在内存中。重写后的汇编将是：\n\n```\n\
  Mov(Data(\"x\"), Stack(-4))\n```\n否则，此遍历不会改变。\n\n### 代码发射\n\n为了结束本章，你将扩展代码发射遍历以处理[列表\
  \ 10-30]中的更改。你应该根据汇编中的 `global` 属性包含或省略 `.globl` 指令。你还应该在每个函数的开头包含 `.text` 指令。这告诉汇编器写入文本段；你还需要使用\
  \ RIP 相对寻来处理 `Data` 操作数。例如，`Data(\"foo\")` 在 Linux 上是 `foo(%rip)`，在 macOS 上是 `_foo(%rip)`。将每个\
  \ `StaticVariable` 作为列表发射。在 Linux 上，如果你有 `StaticVariable(name, global, init)`，且\
  \ `global` 为真且 `init` 不为零，你应该按照[列表 10-31] 所示发射汇编。\n\n```\n .globl <name>\n    .data\n\
  \    <name>:\n    .long <init>\n```\n**列表 10-31：全局静态变量的汇编**\n\n如果 `global` 为真且 `init`\
  \ 为零，你应该按照[列表 10-32] 所示发射汇编。\n\n```\n .globl <name>\n    .bss\n    <name>:\n   \
  \ .zero 4\n```\n**列表 10-32：初始化为零的全局静态变量的汇编**\n\n如果 `global` 为假，发射不带 `.globl` 指令的列表\
  \ 10-31 或列表 10-32。在 macOS 上，你为 `StaticVariable` 发射几乎相同的汇编，只有几处微小差异。首先，符号应该像常一样以下划线开头。其次，你应该使用\
  \ `.balign` 指令代替 `.align`。我之前提到 `.align` 指令的行为取决于平台，因此在 macOS 上 `.align 4` 会产生 16\
  \ 字节对齐的值。`.balign` 指令的作用与 `.align` ，但它的行为跨平台一致：`.balign n` 始终将值对齐到 *n* 字节，而不是 2^n*\
  \ 字节。（在 Linux 上，`.balign` 和 `.align` 是可以交换的，所以使用其中任何一个都可以。）\n\n\n\n\n\n表 10-4 和\
