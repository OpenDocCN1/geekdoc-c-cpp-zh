  \n### <samp class=\"SANS_Futura_Std_Bold_B_11\">总结</samp>\n\n你刚刚完成了本书的第一部分！你的编译器可以处理具有各种链接类型的标识符，以及具有静态和自动存储周期的标识符。你还学习了如何编写汇编程序，在目标文件的数据段和\
  \ BSS 段定义并使用值。\n\n你现在已经实现了 C 的所有基本机制，从局部和文件作用域变量到控制流语句以及函数调用。你通过区分函数类型和 <samp class=\"\
  SANS_TheSansMonoCd_W5Regular_11\">int</samp> 向类型系统迈出了第一步。在第二部分中，你将实现更多类型，包括各种大小的有符号和无符号整数、浮点数、指针、数组和结构体。或者，如果你愿意，可以直接跳到第三部分，在那个部分你将实现若干优化。\n\
  \n# <samp class=\"SANS_Futura_Std_Bold_B_11\">第二部分</samp> <samp class=\"SANS_Futura_Std_Bold_B_11\"\
  >超越 INT</samp>\n\n## <samp class=\"SANS_Futura_Std_Heavy_B_11\">描述</samp>\n\n在本章中，你将添加一种新类型：<samp\
  \ class=\"SANS_Futura_Std_Heavy_B_11\">long</samp>。这是一个有符号整数，就像 <samp class=\"SANS_Futura_Std_Heavy_B_11\"\
  >int</samp> 一样。因为 <samp class=\"SANS_Futura_Std_Heavy_B_11\">long</samp> 与我们已经支持\
  \ int 非常相似，我们不需要添加许多新指令或实现复杂的转换逻辑。在开始之前，让我们看看 `long` 在汇编中是什么样的。\n\n### <samp class=\"\
  SANS_Futura_Std_Bold_B_11\">长整数</samp>\n\nC 标准没有规定整数类型的大小，但 System V x64 ABI 规定\
  \ `int` 是 4 字节而 `long` 是 8 字节。大多数双字指令只接受 8 字节的操作数并产生 8 字节的结果。例如，以下汇编指令操作双字以计算 `2`\
  \ 并产生一个双字结果：\n\n```\nmovq $2, %rax\naddq $2, %rax\n```\n\n这看起来与使用长字（4 字节）的对应代码几乎相同：\n\
  \n```\nmovl $2, %eax\naddl $2, %eax\n```\n\n> <samp class=\"SANS_Dogma_OT_Bold_B_39\"\
  >注意</samp>\n\n*word*、*longword* 和 *quadword* 等术语可以追溯到 16 位处理器的时代，当时 int 是 2 字节而\
  \ long 是 4 字节。更糟糕的是，4 字节的值通常被称为 *doubleword* 而不是 longword。我使用 *longword* 一词是为了对应\
  \ AT&T 汇编语法，但英特尔文档使用的是 *doubleword*。\n\n#### <samp class=\"SANS_Futura_Std_Bold_Condensed_Oblique_BI_11\"\
  >类型转换</samp>\n\n\n\n\n\nC 标准第 6.3.1.3 节第 1 段定义了整数类型之间的转换方法：“如果该值可以用新类型表示，则它保持不变。”换句话说，如果某个表达式求值结果为\
  \ 3，然后你将其强制转换为不同的整数类型，该强制转换表达式的结果仍应为 3。\n\n由于 `long` 比 `int` 大，我们可以安全地将任何 `int`\
  \ 强制转换为 `long` 而不改变其值。我们使用的是有符号整数的补码表示，因此我们将使用符号位扩展从 `int` 转换为 `long`，这是你在第 3 章中学习过的内容。具体来说，我们将使用\
  \ `movsx`（或“带符号位扩展的移动”）汇编指令。该指令将 4 字节的源移动到 8 字节的目标中，并将符号位扩展到目标操作的高 4 字节中。\n\n将 `long`\
  \ 转换为 `int` 则更为复杂，因为其可能太大或太小而无法用 `int` 表示。6.3.1.3 节的第 3 段继续告诉我们，当“新类型是有符号的且该值无法在其中表示时，结果由实现定义，或者抛出一个实现定义的信号”。换句话说，这取决于我们决定如何处理。我们的实现将按照\
  \ GCC 相同的方式处理这种转换，正如其文档所述：“转换为宽度为 *N* 的类型时，该值对 $2*^N$ 取模以处于该类型的范围内；不会抛出信号”([[https://gcc.gnu.org/onlinedocs/gcc/Integers-implementation.html]）。\n\
  \n对一个值对 $2^{(32)}$ 取模意味着加上或减去 $2^{(32)}$ 的倍数，使其进入 `int` 的范围。这里有一个简单的示例。你可以用 `int`\
  \ 表示的最大值是 $2^{(31)} – 1$，即 2,147,483,647。假设你需要将下一个较大的整数值（$2^{(31)}$，或 2,147,483,648）从\
  \ `long` 转换为 `int`。从该值中减去 $2^{(32)}$ 得到 $-2^{(31)}$，即 –2,147,483,648，这是 `int` 能表示的最小值。\n\
  \n在实践中，我们通过丢弃 `long` 的高 4 字节将其转换为 `int`。如果一个 `long` 可以表示为 `int`，丢弃这些字节就不会改变其值。例如，这里是\
  \ –3 的 8 字节二进制表示：\n\n```\n11111111 11111111 11111111 11111111 11111111 11111111\
  \ 11111111 11111101\n```\n\n这里是相同值的 4 字节表示：\n\n```\n11111111 11111111 11111111 11111101\n\
  ```\n\n如果 `long` 无法表示为 `int`，丢弃其高 4 字节的效果相当于对该值对 $2^{(32)}$ 取模。回到之前的示例，`long` 类型\
  \ 2,147,483,648 具有以下二进制表示：\n\n```\n00000000 00000000 00000000 00000000 10000000\
  \ 00000000 00000000 00000000\n```\n\n在我们将其转换为 `int` 后，值 –2,147,483,648 具有以下二进制表示：\n\
  \n```\n10000000 00000000 00000000 00000000\n```\n\n为了丢弃 `long` 的高 4 字节，我们只需要使用 `movl`\
  \ 指令复制其低 4 字节。例如，以下指令会截断一个值：\n\n```\nmovl %ecx, %eax\n```\n\n## 静态变量\n\n具有静态存储期的变量在汇编中的定义方式无论其类型都基本相同，但静态双字（quadwords）和长字（longwords）之间存在一些差异。考虑以下作用域变量：\n\
  \n```c\nstatic long var = 100;\n```\n\n我们将此声明转换为列表 11-1 中的汇编。\n\n```\n.data\n  \
  \  .align 8\nvar:\n    .quad 100\n```\n\n### 列表 11-1：在数据段中初始化 8 字节值\n\n这与我们为静态 `int`\
  \ 生成的汇编有处不同：对齐方式是 8 而不是 4，我们使用 `.quad` 指令来初始化 8 字节值而不是 `.long`。\n\nSystem V x64\
  \ ABI 规定 `long` 和 `int` 分别按 8 字节和 4 字节对齐。C 标准对它们的对齐方式（如同大小）未规定。\n\n现在我们对想要生成的汇编有了一些了解，让我们开始编写编译器吧！\n\
  \n### 词法分析器\n\n你将在本章中添加以下两个标记：\n\n`long` 关键字。\n\n长整数常量： 它们与我们目前的整数常量不同，因为它们有一个 `l`\
  \ 或 `L` 后缀。长常量标记匹配正则 `[0-9]+[lL]\\b`。\n\n### 解析器\n\n我们将在本章向 AST 中添加长常量、强制转换表达式和类型信息。列表\
  \ 11-2 显示了更新后的 AST 定义。\n\n\n\n\n\n```\nprogram = Program(declaration*)\ndeclaration\
  \ = FunDecl(function_declaration) | VarDecl(variable_declaration)\nvariable_declaration\
  \ = (identifier name, exp? init,\n                      ❶ type var_type, storage_class?)\n\
  function_declaration = (identifier name, identifier* params, block? body,\n    \
  \                  ❷ type fun_type, storage_class?)\n\n❸ type = Int | Long | FunType(type*\
  \ params, type ret)\nstorage_class = Static | Extern\nblock_item = S(statement)\
  \ | D(declaration)\nblock = Block(block_item*)\nfor_init = InitDecl(variable_declaration)\
  \ | InitExp(exp?)\nstatement = Return(exp)\n          | Expression(exp)\n      \
  \    | If(exp condition, statement then, statement? else)\n          | Compound(block)\n\
  \          | Break\n          | Continue\n          | While(exp condition, statement\
  \ body)\n          | DoWhile(statement body, exp condition)\n          | For(for_init\
  \ init, exp? condition, exp? post, statement body)\n          | Null\nexp = Constant(const)\n\
  \    | Var(identifier)\n  ❹ | Cast(type target_type, exp)\n    | Unary(unary_operator,\
  \ exp)\n    | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n  \
  \  | Conditional(exp condition, exp, exp)\n    | FunctionCall(identifier, exp* args)\n\
  unary_operator = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply\
  \ | Divide | Remainder | And | Or\n                | Equal | NotEqual | LessThan\
  \ | LessOrEqual\n                | GreaterThan | GreaterOrEqual\n❺ const = ConstInt(int)\
  \ | ConstLong(int)\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表\
  \ 11-2: 带有长常量、类型信息和转换表达式的抽象语法树</samp>\n\n`type` AST 节点可以表示 `int`、`long` 和函数类型 ❸。我们不需要在这里定义一个全新的数据结构，而是扩展我们在第\
  \ 9 章符号表条目中开始使用的 `type` 结构。从现在起，我们将在符号表和 AST 中都使用该数据结构。\n\n在第 9 章中，我们对 `type` 的定义如下：\n\
  \n```\ntype = Int | FunType(int param_count)\n```\n\n在列表 11-2 中，我们通过添加 `Long` 并跟踪关于函数类型的额外信息（包括返回类型和参数类型列表）修改了这个定义。我们之前不需要这些信息，因为每个参数的类型和返回类型必须是\
  \ `int`。请注意，我们对 `type` 的新递归定义可以表示某些无效类型（例如返回函数的函数），但解析器永远不会产生这些无效类型。\n\n一旦更新了对 `type`\
  \ 的表示方式，我们就把类型信息附加到变量 ❶ 和函数声明 ❷ 中。我们没有在函数声明的 `params` 中添加类型信息，因为函数的类型已经包含了其参数的类型。我们还扩展了\
  \ `exp` AST 节点来表示转换表达式 ❹，并定义了一个新的 `const` AST 节点，为 `long` 和 `int` 常量具有不同的构造函数 ❺。在类型检查期间，我们需要区分不同类型的常量。\n\
  \n如果你的实现语言具有带符号的 64 位和 32 位整数类型，并支持这些类型之间的转换，且语义与我们 C 实现中 `long` 和 `int` 之间的转换相同，我建议使用这些类型来表示\
  \ AST 中的 `ConstLong` 和 `ConstInt`。（大多数语言默认或通过库提供具有这些语义的固定宽度整数类型。）这将有助于在编译时将静态初始化转换为正确的类型；它还将简化常量折叠，这是我们在第\
  \ 9 章中实现的一种优化。如果你的实现语言没有具有正确语义的整数类型，你至少应该确保 `ConstLong` 使用整数类型。\n\n更新 AST 后，我们将对句法进行相应的更改，如[列表\
  \ 11-3]所示。\n\n```\nprogram = Program(declaration*)\ndeclaration = FunDecl(function_declaration)\
  \ | VarDecl(variable_declaration)\nvariable_declaration = (identifier name, exp?\
  \ init,\n                      ❶ type var_type, storage_class?)\nfunction_declaration\
  \ = (identifier name, identifier* params, block? body,\n                      ❷\
  \ type fun_type, storage_class?)\n\n❸ type = Int | Long | FunType(type* params,\
  \ type ret)\nstorage_class = Static | Extern\nblock_item = S(statement) | D(declaration)\n\
  block = Block(block_item*)\nfor_init = InitDecl(variable_declaration) | InitExp(exp?)\n\
  statement = Return(exp)\n          | Expression(exp)\n          | If(exp condition,\
  \ statement then, statement? else)\n          | Compound(block)\n          | Break\n\
  \          | Continue\n          | While(exp condition, statement body)\n      \
  \    | DoWhile(statement body, exp condition)\n          | For(for_init init, exp?\
  \ condition, exp? post, statement body)\n          | Null\nexp = Constant(const)\n\
  \    | Var(identifier)\n  ❹ | Cast(type target_type, exp)\n    | Unary(unary_operator,\
  \ exp)\n    | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n  \
  \  | Conditional(exp condition, exp, exp)\n    | FunctionCall(identifier, exp* args)\n\
  unary_operator = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply\
  \ | Divide | Remainder | And | Or\n                | Equal | NotEqual | LessThan\
  \ | LessOrEqual\n                | GreaterThan | GreaterOrEqual\n❺ const = ConstInt(int)\
  \ | ConstLong(int)\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">列表\
  \ 11-3: 带有长常量、<long>类型限定符</samp> 和转换表达式的语法</samp>\n\n我们需要在这里处理两个稍微复杂的细节。首先，每当我们解析一个类型限定符列表时，我们需要将其转换为单个\
  \ `type` AST 节点。长整数可以使用 `long` 限定符声明，也可以同时使用 `long` 和 `int` 声明（顺序均可）。列表 11-4 展示了如何将类型限定符列表转换为类型。\n\
  \n```\nparse_type(specifier_list):\n    if specifier_list == [\"int\"]:\n      \
  \  return Int\n    if (specifier_list == [\"int\", \"long\"]\n        or specifier_list\
  \ == [\"long\", \"int\"]\n        or specifier_list == [\"long\"]):\n        return\
  \ Long\n    fail(\"Invalid type specifier\")\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 11-4: 从类型限定符列表确定类型</samp>\n\n\n\n\n\n这适用于没有存储类的类型，我们将在参数列表或转换表达式中遇到这些类型。对于函数和变量声明，我们将基于\
  \ Listing 10-21 中的限定符解析代码进行构建。Listing 11-5 重现了该代码，并对更改部分进行了加粗。\n\n```\nparse_type_and_storage_class(specifier_list):\n\
  \    types = []\n    storage_classes = []\n    for specifier in specifier_list:\n\
  \        if specifier is \"int\" or \"long\":\n            types.append(specifier)\n\
  \        else:\n            storage_classes.append(specifier)\n\n    type = parse_type(types)\n\
  \n    if length(storage_classes) > 1:\n        fail(\"Invalid storage class\")\n\
  \    if length(storage_classes) == 1:\n        storage_class = parse_storage_class(storage_classes[0])\n\
  \    else:\n        storage_class = null\n\n    return (type, storage_class)\n```\n\
  \nListing 11-5: 从限定符列表确定类型和存储类\n\n我们仍然将类型限定符与存储类限定符分开，并像在 Listing 10-21 中做的那样确定存储类，但我们在这里做了一些细小的更改。首先，我们将\
  \ `long` 识别为类型限定符。其次，我们不再期望类型限定符列表恰好包含一个元素（此更改没有加粗，因为我们只是删了一些现有的代码）。第三，我们不再总是将 `type`\
  \ 设置为 `Int`，而是使用新的 `parse_type` 函数来确定类型。\n\n第二个棘手的细节是解析常量标记。Listing 11-6 显示了如何将这些标记转换为\
  \ `const` AST 节点。\n\n```\nparse_constant(token):\n    v = integer value of token\n\
  \    if v > 2⁶³ - 1:\n        fail(\"Constant is too large to represent as an int\
  \ or long\")\n\n    if token is an int token and v <= 2³¹ - 1:\n        return ConstInt(v)\n\
  \n    return ConstLong(v)\n```\n\nListing 11-6: 将常量标记转换为 AST 节点\n\n我们将一个整数常量标记（不带\
  \ `l` 或 `L` 后缀）解析为 `ConstInt` 节点，除非其值超出 `int` 类型的范围。同样，我们将一个长型常量标记（带有 `l` 或 `L`\
  \ 后缀）解析为 `ConstLong` 节点，除非其值超出 `long` 的范围。如果一个整数常量标记在 `int` 范围之外但在 `long` 范围内，将其解析为\
  \ `ConstLong` 节点。如果整数或长型常量标记大到 `long` 无法表示，我们将抛出一个错误。\n\n`int` 是 32 位的，因此它可以包含 –2³¹\
  \ 到 2³¹ – 1 之间的任何值（包含边界）。按照同样的逻辑，`long` 可以包含 –2⁶³ 到 2⁶³ – 1 之间的任何值。你的解析器应该检查每个常量标记是否符合对应类型的最大值。它不需要检查最小值，因为这些标记无法表示负数；负号是一个单独的标记。\n\
  \n## 语义分析\n\n接下来，我们将扩展执行语义分析的编译传递。我们将做一个极其微小的更改：我们将扩展 `resolve_exp`，使其以与遍历其他表达式相同进行遍历。我不会在随后的章节中显式提到这一点；从现在起，每当我们添加包含排序的类型表达式时，请直接扩展类型检查器。\n\
  \n例如，对两个 `int` 操作数执行任何二元操作都会得到一个 `int`，对两个 `long` 操作数执行相同的操作会得到一个 `long`，而调用具有特定类型的函数会产生该类型的结果。\n\
  \n在类型检查期间，我们将为每个表达式标注其类型。我们将利用此信息来确定生成的临时变量的类型。在标注表达式的同时，我们还将识别程序中的任何隐式转换，并通过在 AST\
  \ 中插入 `Cast` 表达式将它们显式化。\n\n####向 AST 中添加类型信息\n\n在更新类型检查器之前，我们需要一种方法将类型信息附加到 `exp`\
  \ AST 节点上。显而易见的解决方案（如 Listing 11-7 所示）是机械地为每个 `exp` 构造函数添加一个 `type` 字段。\n\n```\n\
  exp = Constant(const, type)\n    | Var(identifier, type)\n    | Cast(type target_type,\
  \ exp, type)\n    | Unary(unary_operator, exp, type)\n    | Binary(binary_operator,\
  \ exp, exp, type)\n    | Assignment(exp, exp, type)\n    | Conditional(exp condition,\
  \ exp, type)\n    | FunctionCall(identifier, exp* args, type)\n```\n\nListing 11-7:\
  \ 为 exp 节点添加类型信息\n\n如果你使用的是面向对象的实现语言并且对于每个 `exp` 有一个公共基类，那么这就非常简单。你只需要在基类中添加一个 `type`\
  \ 字段，如 Listing 11-8 所示。\n\n```\nclass BaseExp {\n    --snip--\n    type expType;\n\
  }\n```\n\nListing 11-8: 为 exp 的基类添加类型\n\n\n\n\n另一方面，如果你使用代数数据类型（algebraic data types）实现了\
  \ AST，那么这种方法会非常令人讨厌。你不仅需要更新每一个 `exp` 构造函数，而且每你想获取表达式的类型时，都要对每个构造函数进行模式匹配。一种稍微不那么麻烦的方法（如列表\
  \ 11-9\nexp = Constant(const)\n    | Var(identifier)\n    | Cast(type target_type,\
  \ typed_exp)\n    | Unary(unary_operator, typed_exp)\n    | Binary(binary_operator,\
  \ typed_exp, typed_exp)\n    | Assignment(typed_exp, typed_exp)\n    | Conditional(typed_exp\
  \ condition, typed_exp, typed_exp)\n    | FunctionCall(identifier, typed_exp* args)\n\
  ```\n\n列表 11-9：为 `exp` 节点添加类型信息的另一种方法\n\n无论你选择哪种方案，你都需要定义两个独立的 AST 数据结构——一个带类型信息，一个不带——或者在解析器中构建\
  \ AST 时，为每个 `exp` 初始化一个空类型或占位类型。这里没有标准答案；这取决于你的实现语言和个人喜好。与其强加某种特定方法，书中其余部分的伪代码将使用两个函数来处理\
  \ AST 中的类型信息：`set_type(e, t)` 返回一个带有类型 `t` 注释的 `e` 副本，而 `get_type(e)` 返回 `e` 的类型注解。\n\
  \n### 表达式类型检查\n\n一旦扩展了 AST 定义，我们将重写在第 9 章 展示了如何检查变量的类型。\n\n```\ntypecheck_exp(e,\
  \ symbols):\n    match e with\n    | Var(v) ->\n        v_type = symbols.get(v).type\n\
  \        if v_type is a function type:\n            fail(\"Function name used as\
  \ variable\")\n        return set_type(e, v_type)\n```\n\n列表 11-10：变量的类型检查\n\n首先，我们在符号表中查找变量的类型。然后，我们验证没有将函数名用作变量，就像我们在前面的章节中做的那样。最后，我们为表达式加上变量的类型并返回它。\n\
  \n列表 11-11 展示了如何检查常量的类型。这很容易，因为不同类型的常量在 AST 中有不同的构造函数。\n\n```\n | Constant(c) ->\n\
  \        match c with\n        | ConstInt(i) -> return set_type(e, Int)\n      \
  \  | ConstLong(l) -> return set_type(e, Long)\n```\n\n列表 11-11：常量的类型检查\n\n对于剩余表达式，我们需要遍历任何子表达式并对它们也进行注解。转换表达式的结果类型是我们将其转换到的任何类型。我们在列表\
  \ 11-12 中检查这些表达式的类型。\n\n```\n | Cast(t, inner) ->\n        typed_inner = typecheck_exp(inner,\
  \ symbols)\n        cast_exp = Cast(t, typed_inner)\n        return set_type(cast_exp,\
  \ t)\n```\n\n列表 11-12：转换表达式的类型检查\n\n求值为 1 或 0 以表示真或假的表达式结果（包括比较和逻辑运算），其类型与其操作数的类型相同。对于一元表达式来说，这是直接的，我们在列表\
  \ 11-13 中检查它们的类型。\n\n```\n | Unary(op, inner) ->\n        typed_inner = typecheck_exp(inner,\
  \ symbols)\n        unary_exp = Unary(op, typed_inner)\n        match op with\n\
  \        | Not -> set_type(unary_exp, Int)\n        | _   -> set_type(unary_exp)\n\
  ```\n\n列表 11-13：一元表达式的类型检查\n\n二元表达式更复杂，因为两个操作数可能有不同的类型。对于逻辑 `&&` 和 `||` 运算来说并不重要，因为它们会计算每个操作数的真值。但对于算术运算来说很重要，因为这些运算同时需要两个操作数。C\
  \ 标准定义了一组规则，称为*常规转换*（usual conversions），用于将算术表达式的两个操作数隐式转换为相同的类型，称为*公共类型*（common\
  \ type）。\n\n给定两个操作数的类型，列表 11-14 展示了如何找到它们的公共类型。目前这很简单，因为只有两种类型。\n\n```\nget_common_type(type1,\
  \ type2):\n    if type1 == type2:\n        return type1\n    else:\n        return\
  \ Long\n```\n\n列表 11-14：寻找公共类型\n\n如果两个类型已经相同，则不需要转换。如果它们不同，我们将较小类型（必须是 `Int`）转换为较大的类型（必须是\
  \ `Long`），因此公共类型即为 `Long`。一旦我们添加了更多类型，寻找公共类型将不再那么简单。\n\n一旦我们知道了两个操作数将转换到的公共类型，我们可以使用列表\
  \ 11-15 所示的 `convert_to` 辅助函数将这些类型转换显式化。\n\n```\nconvert_to(e, t):\n    if get_type(e)\
  \ == t:\n        return e\n    cast_exp = Cast(t, e)\n    return set_type(cast_exp,\
  \ t)\n```\n\n列表 11-15：将隐式类型转换显式化\n\n如果表达式已经有了正确的类型，`convert_to` 将将其返回。否则，它将表达式封装在\
  \ `Cast` AST 节点中，然后对结果进行类型注解。\n\n有了这两个辅助函数，我们就可以检查二元表达式的类型。列表 11-16 展示了 `typecheck_exp`\
  \ 的相关子句。\n\n\n\n\n\n```\n | Binary(op, e1, e2) ->\n      ❶ typed_e1 = typecheck_exp(e1,\
  \ symbols)\n        typed_e2 = typecheck_exp(e2, symbols)\n        if op is And\
  \ or Or:\n            binary_exp = Binary(op, typed_e1, typed_e2)\n            return\
  \ set_type(binary_exp, Int)\n      ❷ t1 = get_type(typed_e1)\n        t2 = get_type(typed_e2)\n\
  \        common_type = get_common_type(t1, t2)\n        converted_e1 = convert_to(typed_e1,\
  \ common_type)\n        converted_e2 = convert_to(typed_e2, common_type)\n     \
  \   binary_exp = Binary(op, converted_e1, converted_e2)\n      ❸ if op is Add, Subtract,\
  \ Multiply, Divide, or Remainder:\n            return set_type(binary_exp, common_type)\n\
  \        else:\n            return set_type(binary_exp, Int)\n```\n\nListing 11-16:\
  \ 二元表达式的类型检查\n\n我们首先对两个操作数进行类型检查 ❶。如果运算符是 `And` 或 `Or`，我们不进行类型转换。否则，我们进行常规的算术转换\
  \ ❷。我们首先获取公共类型，然后将两个操作数都转换为该类型。（在实践中，至少有一个操作数已经是正确的类型，因此 `convert_to` 将原样返回它。）接下来，我们使用这些转换后的操作数构建新的\
  \ `Binary` AST 节点。最后，用正确的类型类型对新的 AST 节点进行标注 ❸。如果这是一个算术操作，结果将与其操作数的类型相同，即我们之前找到的公共类型。否则，它是一个比较操作，结果是真或否的整数表示，因此结果类型为\
  \ `Int`。\n\n在赋值表达式中，我们将被赋值的值转换为其所赋值对象的类型。[Listing 11-17] 提供了这种情况的伪代码。\n\n```\n |\
  \ Assignment(left, right) ->\n        typed_left = typecheck_exp(left, symbols)\n\
  \        typed_right = typecheck_exp(right, symbols)\n        left_type = get_type(typed_left)\n\
  \        converted_right = convert_to(typed_right, left_type)\n        assign_exp\
  \ = Assignment(typed_left, converted_right)\n        return set_type(assign_exp,\
  \ left_type)\n```\n\nListing 11-17: 赋值表达式的类型检查\n\n记住，赋值表达式的结果是赋值后左侧的值；意料之中，结果的类型也是左侧类型。\n\
  \n条件表达式的工作方式与二元算术表达式非常：我们找到两个分支的公共类型，将两个分支都转换为该公共类型，并用该类型标注结果。我们会对控制条件进行类型检查，但不需要将其转换为其他类型。我不会提供这种情况的伪代码。\n\
  \n最后但同样重要的，[Listing 11-18] 显示了如何对函数调用进行类型检查。\n\n```\n | FunctionCall(f, args) ->\n\
  \        f_type = symbols.get(f).type\n        match f_type with\n        | FunType(param_types,\
  \ ret_type) ->\n            if length(param_types) != length(args):\n          \
  \      fail(\"Function called with the wrong number of arguments\")\n          \
  \  converted_args = []\n          ❶ for (arg, param_type) in zip(args, param_types):\n\
  \                typed_arg = typecheck_exp(arg, symbols)\n                converted_args.append(convert_to(typed_arg,\
  \ param_type))\n            call_exp = FunctionCall(f, converted_args)\n       \
  \   ❷ return set_type(call_exp, ret_type)\n        | _ -> fail(\"Variable used as\
  \ function name\")\n```\n\nListing 11-18: 函数调用的类型检查\n\n我们首先在符号表中查找函数类型。与之前的章节一样，我们需要确保正在尝试调用的标识符确实是一个函数，并且我们传递了正确数量的参数。然后，我们同时遍历函数的参数和参数\
  \ ❶。我们对每个参数进行类型检查，然后将其转换为对应的参数类型。最后，用函数的返回类型对整个表达式进行标注 ❷。\n\n### 返回语句的类型检查\n\n当函数返回一个值时，它会被隐式地转换为函数的返回类型。类型检查器需要使这一点显式。我将省略类型检查\
  \ `return` 的伪代码，因为它是直观的。\n\n### 声明的类型检查与符号表的更新\n\n接下来，我们将更新类型检查声明的方式以及在符号表中存储的信息。首先，我们需要为符号表中的每个条目记录正确的类型；我们不能假设每个变量都是\
  \ `int`。其次，每当我们检查冲突声明时，我们需要验证当前声明和之前的声明具有相同类型。例如，如果一个变量被声明为 `int` 然后又被重新声明为 `long`，类型检查器应该抛出错误。第三，当我们检查自动变量时，我们需要将其初始化器转换为该类型，就像我们转换赋值表达式的右侧一样。\n\
  \n最后，我们将改变表示初始化器的方式。静态初始化器（如常量表达式）现在可以是 `int` 也可以是 `long`。[Listing 11-19] 提供了静态初始化器的更新定义。\n\
  \n```\ninitial_value = Tentative | Initial(static_init) | NoInitializer\nstatic_init\
  \ = IntInit(int) | LongInit(int)\n```\n\nListing 11-19: 符号表中的静态初始化器\n\n这个对 `static_init`\
  \ 的定义似乎是多余的，因为它基本上与 [Listing 11-2] 中定义的 `const` AST 节点相同，但它们将在后面的章节中产生分歧。与 `ConstInt`\
  \ 和 `ConstLong` AST 节点一样，你应该在你的实现语言中仔细选择使用哪种整数类型来表示这两种初始化器。确保 `LongInit` 能够容纳任何符号\
  \ 64 位整数尤为重要。\n\n在将表达式转换为静态初始化器时，你可能需要执行类型转换。例如，假设一个程序包含以下声明：\n\n```\nstatic int\
  \ i = 100L;\n```\n\n\n\n\n\n常量 `100L` 会在我们的 AST 中被解析为 `ConstLong`。由于它被赋值给一个静态 `int`，我们需要在编译时将其从\
  \ `long` 强制转换为 `int`，并在符号表中将其存储为 `IntInit(100)`。当类型为 `int` 的变量被初始化为一个超出 32 位可表示范围的\
  \ `long` 常量时，这种转换会变得尤为棘手，如下例声明所示：\n\n```\nstatic int i = 2147483650L;\n```\n\n根据我们之前指定的实现定义行为（implementation-defined\
  \ behavior），我们需要从该值中减去 `2³²`，直到它足够小而能够放入 `int` 中为止。得到的结果是 –2,147,483,646，因此我们在符号表中记录的初始值应为\
  \ `IntInit(-2147483646)`。理想情况下，你可以使用已经具有正确类型转换语义的符号整数类型，这样你就不需要自己处理这些常量的二进制表示了。\n\
  \n这里有一些可以帮助你处理静态初始化器的提示：\n\n**让你的常量类型转换代码可重用。**\n\n类型检查并不是唯一将常量转换为不同类型的地方。在第三部分\
  \ 中，你将在 TACKY 中实现常量折叠。常量折叠遍历将评估常量表达式，包括类型转换。你可能希望将类型转换代码结构化为一个独立的模块，以便以后在常量折叠时重用。\n\
  \n**不要在静态初始化器上调用 `typecheck_exp`。**\n\n直接将每个静态初始化器转换为 `static_init`，而不要先调用 `typecheck_exp`。这将简化后续章节的工作，因为在那些章节中，`typecheck_exp`\
  \ 将以更复杂的方式转换表达式。\n\n### TACKY 生成\n\n在本章中，我们将对 TACKY AST 进行一些更改。首先，我们将为每个顶层 `StaticVariable`\
  \ 添加类型，并使用我们新定义的 `static_init` 结构表示每个静态变量的初始值：\n\n```\nStaticVariable(identifier,\
  \ bool global, type t, static_init init)\n```\n\n我们还将复用 Listing 11-2 中 AST 中的 `const`\
  \ 结构来表示常量：\n\n```\nval = Constant(const) | Var(identifier)\n```\n\n最后，我们将引入两个新指令来在类型之间转换值：\n\
  \n```\nSignExtend(val src, val dst)\nTruncate(val src, val dst)\n```\n\n`SignExtend`\
  \ 和 `Truncate` 指令分别将 `int` 转换为 `long` 以及从 `long` 转换为 `int`。Listing 11-20 提供了完整的更新\
  \ TACKY IR。此列表使用了 `type`、`static_init` 和 `const` 但没有定义它们，因为我们已经定义了这三个结构。\n\n```\n\
  program = Program(top_level*)\ntop_level = Function(identifier, bool global, identifier*\
  \ params, instruction* body)\n          | StaticVariable(identifier, bool global,\
  \ type t, static_init init)\ninstruction = Return(val)\n            | SignExtend(val\
  \ src, val dst)\n            | Truncate(val src, val dst)\n            | Unary(unary_operator,\
  \ val src)\n            | Binary(binary_operator, val src1, val src2)\n        \
  \    | Copy(val src, val dst)\n            | Jump(identifier)\n            | JumpZero(val\
  \ condition, target)\n            | JumpIfNotZero(val condition, target)\n     \
  \       | Label(identifier)\n            | FunCall(fun_name, val* args)\nval = Constant(const)\
  \ | Var(identifier)\nunary_operator = Complement | Negate | Not\nbinary_operator\
  \ = Add | Subtract | Multiply | Remainder | Equal | NotEqual\n                |\
  \ LessThan | LessEqual | GreaterThan | GreaterEqual\n```\n\n####我们将通过在符号表中查找类型信息来处理\
  \ `StaticVariable` 的更改。如果静态变量有一个尝试性定义（tentative definition），我们将根据其类型将其初始化为 `IntInit`\
  \ 或 `LongInit`。\n\n处理常量更加简单；逻辑在本质上与之前没有区别。我们将直接将 `Constant` AST 节点转换为 TACKY `Constant`，因为它们都使用了相同的\
  \ `const` 定义。\n\n回一下，当我们把逻辑 `&&` 或 `||` 表达式转换为 TACKY 时，我们显式地为持有结果的变量赋值 1 或 0。由于这些逻辑表达式的类型为\
  \ `int`，我们将结果表示为 `ConstInt(1)` 和 `ConstInt(0)`。\n\nListing 11-21 显示了如何将转换表达式转换为\
  \ TACKY。我们将使用在上一个遍历中添加的类型来确定我们从什么种类型进行转换。\n\n```\nemit_tacky(e, instructions, symbols):\n\
  \    match e with\n    | --snip--\n    | Cast(t, inner) ->\n        result = emit_tacky(inner,\
  \ instructions, symbols)\n        if t == get_type(inner):\n          ❶ return result\n\
  \        dst_name = make_temporary()\n        symbols.add(dst_name, t, attrs=LocalAttr)\n\
  \        dst = Var(dst_name)\n        if t == Long:\n          ❷ instructions.append(SignExtend(result,\
  \ dst))\n        else:\n          ❸ instructions.append(Truncate(result, dst))\n\
  \        return dst\n```\n\nListing 11-21: 将转换表达式转换为 TACKY\n\n如果内部表达式已经具有我们想要转换的类型，则转换没有影响；我们发射\
  \ TACKY 来评估内部表达式，但不进行其他操作 ❶。否则，我们将发射一个 `SignExtend` 指令将 `int` 转换为 `long` ❷，或者发射一个\
  \ `Truncate` 指令将 `long` 转换为 `int` ❸。\n\n#### 跟踪临时变量的类型\n\n\n\n\n\n当我们在 Listing 11-21\
  \ 中创建临时变量 `dst` 时，将其带有相应的类型添加到符号表中。我们需要为创建的每个临时变量执行此操作，以便在生成汇编代码期间查找它们的类型。汇编生成阶段将以两种方式使用这些类型信息：确定每条汇编指令的操作数大小，以及确定为每个变量分配多少栈空间。\n\
  \n我们添加的每个临时变量都持有表达式的结果，因此我们可以通过检查表达式的类型注解来确定其类型。让我们再次查看 Listing 3-9，它演示了如何将二元算术表达式转换为\
  \ TACKY。Listing 11-22 展示了相同的转换，并对相比于 Listing 3-9 的更改部分进行了加粗处理。\n\n```\nemit_tacky(e,\
  \ instructions, symbols):\n    match e with\n    | --snip--\n    | Binary(op, e1,\
  \ e2) ->\n        v1 = emit_tacky(e1, instructions, symbols)\n        v2 = emit_tacky(e2,\
  \ instructions, symbols)\n        dst_name = make_temporary()\n        symbols.add(dst_name,\
  \ get_type(e), attrs=LocalAttr)\n        dst = Var(dst_name)\n        tacky_op =\
  \ convert_binop(op)\n        instructions.append(Binary(tacky_op, v1, v2, dst))\n\
  \        return dst\n    | --snip--\n```\n\n**Listing 11-22: 在将二元表达式转换为 TACKY 时跟踪临时变量类型**\n\
  \n这里的主要更改是将 `dst` 添加到符号表中。由于 `dst` 持有表达式 `e` 的结果，我们查找 `e` 的类型注解来确定 `dst` 的类型。和每个临时变量一样，`dst`\
  \ 是一个局部自动变量，因此我们将在符号表中赋予它 `LocalAttr` 属性。\n\n让我们将其重构为一个辅助函数，如 Listing 11-23 所示。\n\
  \n```\n\n_tacky_variable(var_type, symbols):\n    var_name = make_temporary()\n\
  \    symbols.add(var_name, var_type, attrs=LocalAttr)\n    return Var(var_name)\n\
  ```\n\n**Listing 11-23: 用于生成 TACKY 变量的辅助函数**\n\n从现在起，每我们在 TACKY 中生成新的临时变量时，都会使用\
  \ `make_tacky_variable`。\n\n### 生成额外的返回指令\n\n在第 5 章中，我提到我们在每个 TACKY 函数的末尾添加了一个额外的\
  \ `Return` 指令，以防原始 C 函数中的并非执行路径都能到达 `return` 语句。即使函数的返回类型不是 `int`，这条额外指令也可以始终返回\
  \ `ConstInt(0)`。当我们从 `main` 返回时，这是正确的返回类型。当我们从任何其他缺少显式 `return` 语句的函数返回时，返回值是未定义的。我们仍然需要将控制权交还给调用者，但我们没有义务返回任何特定值，因此类型写错了也没关系。\n\
  \n### 汇编生成\n\n在本章中，我们将对汇编 AST 进行几处更改。Listing 11-24 提供了完整的定义，并对更改部分进行了加粗。\n\n```\n\
  program = Program(top_level*)\nassembly_type = Longword | Quadword\ntop_level =\
  \ Function(identifier, bool, static_init)\ninstruction = StaticVariable(identifier,\
  \ bool)\n          | Mov(assembly_type, dst)\n            | Movsx(operand dst)\n\
  \            | Unary(unary_operator, operand)\n            | Binary(binary_operator,\
  \ operand)\n            | Cmp(assembly_type, operand)\n            | Idiv(assembly_type)\n\
  \            | Jmp(identifier)\n            | Jmp(cond_code)\n            | SetCC(cond_code,\
  \ operand)\n            | Label(identifier)\n            | Push(operand)\n     \
  \       | Call(identifier)\n            | Ret\n\nunary_operator = Neg | Not\nbinary_operator\
  \ = Add | Sub\noperand = Imm(int) | Reg(identifier) | Stack(int) | Data(identifier)\n\
  cond_code = E | G | L\nreg = AX | DX | DI | SI | R8 | R9 | R10 | SP\n```\n\n**Listing\
  \ 11-24: 支持 quadword 操作数和 8 字节变量的汇编 AST**\n\n最大的更改是为大多数指令标记了其操作数的类型。这允许我们为每条指令选择正确的后缀。我们还为\
  \ `Cdq` 添加了类型，因为 32 位版本扩展 EAX，而 64 位版本扩展 RAX。只有三条指令需要操作数但不需要类型：`SetCC` 接收字节大小的操作数；`Push`\
  \ 始终推入 quadword；以及我们稍后将介绍的新的 `Movsx` 指令。\n\n我们不再复用之前定义的源码级类型，而是将定义一个新的 `assembly_type`\
  \ 构造结构。当我们在后续章节中引入更多 C 类型时，这将简化汇编类型处理工作。例如，我们将在第 12 章中添加无符号整数，但汇编不区分符号和无符号整数。\n\n\
  在汇编生成期间，我们将根据操作数的类型来确定每条指令的类型。例如，我们将 TACKY 指令\n\n```\nBinary(Add, Constant(ConstInt(3)),\
  \ Var(\"src\"), Var(\"dst\"))\n```\n\n转换为这些汇编指令：\n\n```\nMov(Longword, Imm(3), Pseudo(\"\
  dst\"))\nBinary(Add, Longword, Pseudo(\"src\"), Pseudo(\"dst\"))\n```\n\n由于第一个操作数是\
  \ `ConstInt`，我们知道生成的 `mov` 和 `add` 指令应该使用 longword 操作数。我们可以假设第二个操作数和目标与第一个操作数的类型相同，因为我们在\
  \ TACKY 生成期间插入了相应的类型转换指令。如果操作数是变量而非常量，我们将在符号表中查找其类型。\n\n我们还将根据类型确定如何传递栈参数。Listing\
  \ 11-25 重现了 `convert_function_call` 的相关部分，该函数我们在之前的 Listing 9-31 中定义，并对此更改进行了加粗处理。\n\
  \n\n\n\n\n```\nconvert_function_call(FunCall(fun_name, args, dst)):\n    --snip--\n\
  \    // pass args on stack\n    for tacky_arg in reverse(stack_args):\n        assembly_arg\
  \ = convert_val(tacky_arg)\n        if assembly_arg is a Reg or Imm operand or has\
  \ type Quadword:\n            emit(Push(assembly_arg))\n        else:\n        \
  \    emit(Mov(Longword, assembly_arg, Reg(AX)))\n            emit(Push(Reg(AX)))\n\
  \    --snip--\n```\n\n列表 11-25：在 `convert_function_call` 中在栈上传递 quadwords\n\n在 第\
  \ 9 章 中，我们学习了如果使用 8 字节的 `pushq` 指令将内存中的 4 字节操作数推入栈中，我们可能会遇到麻烦。为了解决这个问题，我们生成两条指令将一个\
  \ 4 字节的 `Pseudo` 推入栈中：我们先将其复制到 `EAX`，然后推入 `RAX`。8 字节的 `Pseudo` 不需要这种变通方法；我们通过单个\
  \ `Push` 指令将其在栈上传递，这与传递立即数的方式相同。\n\n为了处理从 `int` 到 `long` 的转换，我们将使用符号扩展指令 `movsx`。目前，该指令不需要类型信息，因为它的源必须是\
  \ `int` 且目标必须是 `long`。我们将\n\n```\nSignExtend(src, dst)\n```\n\n转换为：\n\n```\nMovsx(src,\
  \ dst)\n```\n\n要截断一个值，我们只需要使用一个 4 字节的 `movl` 指令将其低位 4 字节移动到目标位置即可。我们将\n\n```\nTruncate(src,\
  \ dst)\n```\n\n转换为：\n\n```\nMov(Longword, src, dst)\n```\n\n我们还调整了 `StaticVariable`\
  \ 结构：\n\n```\nStaticVariable(identifier name, bool global, int alignment, static_init\
  \ init)\n```\n\n我们保留了 TACKY 的 `static_init` 结构，因此我们知道何时为每个静态变量初始化 4 或 8 字节。我们还添加了\
  \ `alignment` 字段，因为我们需要在汇编中指定每个静态变量的对齐方式。\n\n最后，我们从汇编 AST 中移除了 `DeallocateStack`\
  \ 和 `AllocateStack` 指令。这些指令只是 quadword 加减法的占位符，现在我们可以使用普通的 `addq` 和 `subq` 指令表示它们。由于\
  \ `DeallocateStack` 和 `AllocateStack` 代表对 `RSP` 进行加减，我们还将 `RSP` 寄存器添加到了汇编 AST 中，以便在普通指令中使用它。在早的章节中，我们通过以下指令在函数调用之前保持栈对齐：\n\
  \n```\nAllocateStack(bytes)\n```\n\n现在我们将使用这条指令：\n\n```\nBinary(Sub, Quadword, Imm(bytes),\
  \ Reg(SP))\n```\n\n同样地，我们不再使用\n\n```\nDeallocateStack(bytes)\n```\n\n而是使用\n\n```\n\
  Binary(Add, Quadword, Imm(bytes), Reg(SP))\n```\n\n来在函数调用后恢复栈指针。\n\n表 11-1 到 11-4\
  \ 总结了本章从 TACKY 到汇编转换的更新。新的结构以及对现有结构转换的更改已加粗显示。\n\n**表 11-1：将顶层 TACKY 结构转换为汇编**\n\
  \n| TACKY 顶层结构 | 汇编顶层结构 |\n| --- | --- |\n| `Function(name, global, params, instructions)`\
  \ | \n```assembly\nFunction(name, global,\n          [Mov(<param1 type>, Reg(DI),\
  \ param1),\n           Mov(<param2 type>, Reg(SI), param2), \n           <copy next\
  \ four parameters from registers>, \n           Mov(<param7 type>, Stack(16), param7),\n\
  \           Mov(<param8 type>, Stack(24), param8), \n           <copy remaining\
  \ parameters from stack>] +\n        instructions)\n``` |\n| `StaticVariable(name,\
  \ global, t, init)` | `StaticVariable(name, global, alignment, init)` |\n\n**表 11-2：将\
  \ TACKY 指令转换为汇编**\n\n| TACKY 指令 | 汇编指令 |\n| --- | --- |\n| `Return(val)` | `Mov(val,\
  \ Reg(AX)); Ret` |\n| `Unary(Not, src, dst)` | `Cmp(src, Imm(0)); Mov(Imm(0), dst);\
  \ SetCC(E, dst)` |\n| `Unary(unary_operator, src, dst)` | `Mov(src, dst); Unary(unary_operator,\
  \ src, dst)` |\n| `Binary(Divide, src1, src2, dst)` | `Mov(src1, Reg(AX)); Cdq();\
  \ Idiv(src2)` |\n\n\n\n\n\n`Mov(src1 type, Reg(AX), dst)` |\n\n| `Binary(Remainder,\
  \ src1, src2, dst)` | `Mov(src1 type, src1, Reg(AX))` `Cdq(src1 type)` |\n| `Idiv(src1\
  \ type, src2)` |\n| `Mov(src1 type, Reg(DX), dst)` |\n| `Binary(arithmetic_operator,\
  \ src1, src2, dst)` | `Mov(src1 type, src1, dst)` `Binary(arithmetic_operator, src1\
  \ type, src2, dst)` |\n| `Binary(relational_operator, src1, src2, dst)` | `Cmp(src1\
  \ type, src2, src1)` `Mov(dst type, Imm(0), dst)` `SetCC(relational_operator, dst)`\
  \ |\n| `JumpIfZero(condition, target)` | `Cmp(condition type, Imm(0), condition)`\
  \ `JmpCC(E, target)` |\n| `JumpIfNotZero(condition, target)` | `Cmp(condition type,\
  \ Imm(0), condition)` `JmpCC(NE, target)` |\n| `Copy(src, dst)` | `Mov(src type,\
  \ src, dst)` |\n| `Call(fun_name, args, dst)` | `stack alignment` `set arguments`\
  \ `Call(fun_name)` `deallocate padding` `Mov(dst type, Reg(AX), dst)` |\n| `SignExtend(src,\
  \ dst)` | `Movsx(src, dst)` |\n| `Truncate(src, dst)` | `Mov(Longword, src, dst)`\
  \ |\n\n**表 11-3：TACKY 操作数转换为汇编操作数**\n\n| TACKY 操作数 | 汇编操作数 |\n| :--- | :--- |\n\
  | `Constant(ConstInt(int))` | `Imm(int)` |\n| `Constant(ConstLong(int))` | `Imm(int)`\
  \ |\n\n**表 11-4：类型转换为汇编**\n\n| 源类型 | 汇编类型 | 对齐 |\n| :--- | :--- | :--- |\n| `Int`\
  \ | `Longword` | 4 |\n| `Long` | `Quadword` | 8 |\n\n在表 11-3 中，我们将两种类型的 TACKY 常数都转换为\
  \ `Imm` 操作数。在汇编中，4 字节和 8 字节的立即数没有区别。汇编器会根据立即数出现的位置指令的操作数大小来推断其应该是多大。\n\n表 11-4 给出了从源类型到汇编类型的转换，以及每个类型的对齐方式。注意，这种转换在整个编译过程中的方式与表\
  \ 11-1 到 11-3 中的转换略有不同，因为我们在遍历 TACKY 程序时，不会遇到可以直接转换为汇编程序中 `assembly_type` 节点的 `type`\
  \ AST 节点。\n\n\n\n\n\n```\nasm_symtab_entry = ObjEntry(assembly_type, bool is_static)\n\
  \                 | FunEntry(bool defined)\n```\n\nListing 11-26: 后端符号表中的条目定义\n\n\
  我们将使用 `ObjEntry` 来表示变量（在后面的章节中也包括常量）。我们将跟踪每个对象的汇编类型以及它是否具有静态存储持续时间。`FunEntry` 表示函数。我们不需要跟踪函数的类型——这反而是好事，因为\
  \ `assembly_type` 无法表示函数类型——但我们确实跟踪它们是否在当前翻译单元中被定义。如果你在符号表中跟踪每个函数的堆栈帧大小，请在 `FunEntry`\
  \ 构造函数中添加一个额外余的 `stack_frame_size` 字段。我建议将后端符号表设为全局变量或单例，就像现有的前端符号表一样。\n\n在 TACKY\
  \ 到汇编转换阶段的最后最后，你应该遍历前端符号表，并将每个条目转换为后端符号表中的一个条目。这个过程足够简单，我不会为你提供它的伪代码。你还需要更新伪寄存器替换、指令修复和代码发射阶段中任何引用前端符号表的地方，让它们使用后端符号表。\n\
  \n### 替换 Longword 和 Quadword 伪寄存器\n\n伪寄存器替换阶段需要一些更改。首先，我们将扩展它以替换新 `movsx` 指令中的伪寄存器。其次，每当我们把栈地址分配给伪寄存器时，我们会在后端符号表中查找该伪寄存器的类型，以确定分配多少空间。如果是\
  \ `Quadword`，我们将分配 8 字节；如果是 `Longword`，我们将像以前一样分配 4 字节。最后，我们将确保每个 `Quadword` 伪寄存器的地址在堆栈上是\
  \ 8 字节对齐的。考虑以下汇编代码片段：\n\n```\nMov(Longword, Imm(0), Pseudo(\"foo\"))\nMov(Quadword,\
  \ Imm(1), Pseudo(\"bar\"))\n```\n\n假设我们在后端符号表中查找 `foo` 的类型并看到它是 4 字节。我们将像往常一样将其分配给\
  \ `-4(%rbp)`。接下来，我们查找 `bar` 并看到它是 8 字节。我们可以将其分配给 `-12(%rbp)`，这在 `foo` 下方 8 字节处。但这样\
  \ `bar` 就会错对齐，因为它的地址不是 8 字节的倍数。（记住 `RBP` 中的地址始终是 16 字节对齐的。）为了保持正确的对齐，我们将向下舍入到下一个\
  \ 8 的倍数，并将 `bar` 存储在 `-16(%rbp)`。对齐要求是 System V ABI 的；如果你忽略它们，你的代码可能无法与其他翻译单元中的代码正确交互。\n\
  \n### 修复指令\n\n我们将对本章中的指令修复阶段进行多次更新。首先，我们需要为现有重写规则中的所有指令指定操作数大小。这些操作数的大小始终与被重写的原始指令的操作数相同。\n\
  \n接下来，我们将重写 `movsx` 指令。它不能使用内存地址作为目标，或使用立即数作为源操作。如果 `movsx` 的两个操作数都无效，我们需要同时使用 `R10`\
  \ 和 `R11` 来修复它们。例如，我们将重写\n\n```\nMovsx(Imm(10), Stack(-16))\n```\n\n为：\n\n```\n\
  Mov(Imm(10), R10)\nMovsx(R10, Stack(-16))\n```\n\n为每个 `mov` 指令使用正确的操作数大小非常重要。由于\
  \ `movsx` 的源是 4 字节，当将其移动到寄存器时，指定 longword 大。由于 `movsx` 的结果是 8 字节，当我们移动到它的内存位置时，指定\
  \ quadword 大。我们的三个算术指令（`addq`、`imulq`、`subq`）的 quadword 版本无法处理无法放入 `int` 中的立即数，而`cmpq`\
  \ 或 `pushq` 也是。如果这些指令任一的源是 `int` 范围之外的常量，我们需要在使用它之前将其复制到 `R10`。`movq` 指令可以将这些大立即数移动到寄存器，但不能直接移动到内存，所以\n\
  \n```\nMov(Quadword, Imm(4294967295), Stack(-16))\n```\n\n应该重写为：\n\n```\nMov(Quadword,\
  \ Imm(4294967295), R10)\nMov(Quadword, R10, Stack(-16))\n```\n\n> **注意**：汇编器仅当立即数可以表示为带符号\
  \ 32 位整数时，才允许在 `addq`、`imulq`、`subq`、`cmpq` 或 `pushq` 中使用立即数。这是因为这些指令都会将立即操作数符号扩展\
  \ 3 符号 位。如果一个立即数只能在 32 位中作为无符号整数表示（这意味着它的高位被置位），符号扩展它将改变它的值。有关更多细节，请参见此 Stack Overflow\
  \ 问题：[`stackoverflow.com/questions/6428590/integer-overflow-in-gas`](https://stackoverflow.com/questions/6428590/integer-overflow-in-gas)。\n\
  \n我们还将修复在每个函数开始时分配栈空间的方式。不再在每个函数中添加 `AllocateStack(bytes)` 来在堆栈上分配空间，而是添加以下指令，它具有相同的功能：\n\
  \n```\nBinary(Sub, Quadword, Imm(bytes), Reg(SP))\n```\n\n我们最后还将添加一条重写规则来安抚汇编器，尽管这并不是严格必要的。记住我们将\
  \ `Truncate` TACKY 指令转换为 4 字节的 `movl`，这意味着我们可以生成 `movl` 指令，将 8 字节的立即值移动到 4 字节目标：\n\
  \n```\nMov(Longword, Imm(4294967299), Reg(R10))\n```\n\n\n\n\n\n由于 `movl` 无法使用 8\
  \ 字节立即数，汇编器会自动将这些值截断为 32 位。例如，当处理指令 `movl $4294967299, %r10d` 时，它会将立即数 `4294967299`\
  \ 转换为 `3`。GNU 汇编器在执行此类转换时发出警告，但 LLVM 汇编器不会。为了避免这些警告，我们将手动截断 `movl` 指令中的 8 字节立即数。这意味着我们将之前的指令重写为：\n\
  \n```\nMov(Longword, Imm(3), Reg(R10))\n```\n\n抛开汇编警告不，即使你不包含这个重写规则，汇编程序仍然可以运行。\n\
  \n### 代码发射\n\n我们的最后一个任务是扩展代码发射阶段。我们将为每条指令添加相应的后缀，为静态变量发射正确的对齐和初始值，并处理新的 `Movsx`\
  \ 指令。当指令使用寄存器时，我们将根据该指令的操作数大小发射相应的寄存器名称。\n\n具有 4 字节操作数的指令具有 `l` 后缀（代表 longword），具有\
  \ 8 字节操作数的指令具有 `q` 后缀（代表 quadword），但有一个例外：`cdq` 的 8 字节版本有一个完全不同的助记符 `cqo`。`Movsx`\
  \ 指令对其源操作数目的操作数的大小都需要后缀。例如，`movslq` 将 longword 符号扩展为 quadword。目前，我们始终以带有 `lq` 后缀的形式发射这条指令；随着我们在后续章节中添加更多汇编类型，我们需要更多的后缀。（你也可能看到当汇编器能够推断两个操作数的大小时，该指令被写为\
  \ `movsx`。例如，汇编器将接受指令 `movsx %r10d, %r11`，因为它可以从寄存器名称中推断出源和目的的大小。）\n\n表 11-5 到 11-10\
