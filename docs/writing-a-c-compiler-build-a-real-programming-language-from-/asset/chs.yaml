  \ PseudoMem(dst, 0))\nMov(<next chunk type>, PseudoMem(src, offset + <first chunk\
  \ size>), PseudoMem(dst, <first chunk size))\n<拷贝剩余的 chunks\n```\n | |\n| FunCall(fun_name,\
  \ args, dst) | dst 将在内存中返回 |\n```\nLea(dst, Reg(DI))\n<修复栈对>\n<将参数移动到通用寄存器，从 RSI\
  \ 开始>\n<将参数移动到 XMM 寄存器>\n<将参数压栈>\nCall(fun_name)\n<释放参数/填充>\n```\n | |\n| | dst\
  \ 将在\n\n\n\n\n通过寄存器返回 |\n\n```\n<fix stack alignment>\n<move arguments to general-purpose\
  \ registers>\n<move arguments to XMM registers>\n<push arguments onto the stack>\n\
  Call(fun_name)\n<deallocate arguments/padding>\n<move integer parts of return value\
  \ from RAX, RDX into dst>\n<move double parts of return value from XMM0, XMM1 into\
  \ dst>\n```\n\n | dst 不存在 |\n\n```\n<fix stack alignment>\n<move arguments to general-purpose\
  \ registers>\n<move arguments to XMM registers>\n<push arguments onto the stack>\n\
  Call(fun_name)\n<deallocate arguments/padding>\n```\n\n |\n\n```\nDoubleToUInt(src,\
  \ dst)\n``` |\n\n```\nunsigned char\n``` |\n\n```\nCvttsd2si(Longword, src, Reg(<R>))\n\
  Mov(Byte, Reg(<R>), dst)\n``` |\n\n```\nunsigned int\n``` |\n\n```\nCvttsd2si(Quadword,\
  \ src, Reg(<R>))\nMov(Longword, Reg(<R>), dst)\n``` | |\n\n```\nunsigned long\n\
  ``` |\n\n```\nCmp(Double, Data(<upper-bound>, 0), src)\nJmpCC(AE, <label1>)\nCvttsd2si(Quadword,\
  \ src, dst)\nJmp(<label2>)\nLabel(<label1>)\nMov(Double, src, Reg(<X>))\nBinary(Sub,\
  \ Double, Data(<upper-bound>, 0), Reg(<X>))\nCvttsd2si(Quadword, Reg(<X>), dst)\n\
  Mov(Quadword, Imm(9223372036854775808), Reg(<R>))\nBinary(Add, Quadword, Reg(<R>),\
  \ dst)\nLabel(<label2>)\n添加一个顶层常量:\nStaticConstant(<upper-bound>, 8,\nDoubleInit(9223372036854775808.0))\n\
  ``` |\n\n**表 18-3:** 将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n| --- | --- |\n\
  | |\n```\nConstant(ConstDouble(double))\n``` | |\n```\nData(<ident>, 0)\n添加一个顶层常量:\n\
  StaticConstant(<ident>, 8,\n               DoubleInit(double))\n``` |\n\n**表 18-4:**\
  \ 将类型转换为汇编\n\n| 源类型 | 汇编类型 | 对齐方式 |\n| --- | --- | --- |\n| Structure(tag) | |\n\
  ```\nByteArray(<size from type table>,\n          <alignment from type table>)\n\
  ``` | 来自类型表的对齐 |\n\n注意，我们现在在生成的每个 `Data` 操作数中都包含了偏移量。在此阶段，所有的 `Data` 操作数都代表浮点数；这些常量包括我们在\
  \ 表 18-2 中为浮点数 `Negate` 和 `DoubleToUInt` 转换时使用的常量，以及在 表 18-3 中的普通浮点数 TACKY 常数。这些操作数的偏移量均为零。\n\
  \n#### 替换伪操作数\n\n我们将对此传递进行两个微小的修改。首先，我们将为 `Data` 操作数提供偏移量。例如，如果 `v` 是一个静态变量，我们将\n\
  ```\nPseudoMem(\"v\", 0)\n```\n转换为\n```\nData(\"v\", 0)\n```\n并将\n```\nPseudoMem(\"\
  v\", 10)\n```\n转换为：\n```\nData(\"v\", 10)\n```\n其次，我们需要避免破坏 `-8(%rbp)` 中的返回值。在开始分配空间之前，我们将检查后端表，以查看函数的返回值是否将通过内存传递。如果是，我们将为\
  \ `-8(%rbp)` 留出一个双字（quadword）作为返回值，并在比 `-8(%rbp)` 更低的地址为伪寄存分配空间。例如，如果第一个寄存器是 `Longword`，我们将将其映射到\
  \ `-12(%rbp)`。\n\n指令修复在本章中不会改变。我们在代码生成期间发射 `shl` 和 `shr` 指令已经是有效的，不需要修复，因为目标操作数始终是寄存器，而源操作数始终是立即值\
  \ `8`。\n\n### 代码发射\n\n代码发射需要两个微小的修改。首先，我们将在 `Data` 操作数中包含偏移量。例如，我们将 `Data(\"x\"\
  , 4)` 发射为：\n```\nx+4(%rip)\n```\n如果偏移量为零，你可以包含它也可以省略它。\n\n其次，我们将新的 `Shl` 和 `ShrTwoOp`\
  \ 汇编指令分别发射为 `shl` 和 `shr`。它们接受通常的操作数。\n\n表 18-5 和 18-6 显示了代码发射传递的这些更改。附录 B 包含了本章完整的代码发射传递，因为这是\
  \ 第二部分 的最后一章。\n\n**表 18-5:** 汇编操作的指令名称\n\n| 汇编操作符 | 指令名称 |\n| --- | --- |\n| Shl\
  \ | shl |\n| ShrTwoOp | shr |\n\n**表 18-6:** 汇编操作数的格式化\n\n| 汇编操作数 | 输出 |\n| ---\
  \ | --- |\n| Data(identifier, int) | `identifier`+`int`(%rip) |\n\n至此，你就完成了本章的学习；你的编译器现在支持结构体了！\n\
  \n### 额外奖励：联合体 (Unions)\n\n\n\n\n结构体（structure）和联合体（union）有许多共同点。它们的类型声明共享相同的语法并在相同的命名空间中声明标签。它们遵循相同的类型规则并支持相同的操作，包括\
  \ `->` 和 `.` 运算符。区别在于，结构体的成员在内存中是顺序布局的，而联合体的所有成员都从同一个地址开始，因此写入其中一个成员会覆盖其他成员。从编译器的角度来看，联合体基本上是一个每个成员偏移量为零的结构体。这使得将你在本章完成的工作扩展到支持联合体变得相对简单。尽管如此，这仍然比之前的加分特性更具挑战性。这是一个让你亲手添加新语言功能的机会。\n\
  \n如果你实现了联合体类型，有几点是你需要记住的。首先，记住为了方便编译，我们限制了结构体声明的位置。联合体的测试用例也遵循相同的限制；这意味着你不需要支持匿名联合体声明，或作为其他类型或变量声明一部分的联合体声明。\n\
  \n在类型检查器中，你将把联合体定义添加到类型表中。结构体和联合体标签共享命名空间，因此在相同的作用域内定义相同标签的结构体和联合体类型是一个错误。你需要跟踪每个联合体的大小和对齐方式（你可以在\
  \ System V ABI 中查找这些计算方法）。你还需要对联合体的复合初始化器进行类型检查。联合体初始化器应该有一个元素，用于初始化联合体的第一个成员。（C\
  \ 提供了指定要初始化哪个联合体成员的语法，但你不需要实现它。）\n\n在后端，System V 调用约定处理联合体的方式类似于结构体；联合体将根据内存、两个寄存器或一个寄存器进行传递，具体取决于它的大小及其成员的类型。有关所有细节，请参阅“附加资源”（Additional\
  \ Resources）中的链接。祝你好运！\n\n你可以使用 `--union` 标志来测试你的编译器对联合体类型的支持：\n\n```\n$ ./test_compiler\
  \ /path/to/your_compiler --chapter 18 --union\n```\n\n或者，你可以使用 `--extra-credit`\
  \ 标志来测试每一个加分特性。\n\n### 总结\n\n你已经完成了第二部分！在本章中，你学习了如何分析结构体类型声明、在 TACKY 中操作聚合对象，并根据\
  \ System V 调用约定传输结构体。你的编译器现在支持这本书涵盖的所有语言特性，包括 C 语言中的大部分语句、表达式和类型。你可以正式地告诉别人你写了一个\
  \ C 编译器了。\n\n如果你愿意，可以在这里停止。或者，你可以进入第三部分，在那里将实现几种编译器优化以生成更高效的汇编代码。在第 19 章中，你将通过消除无用指令和在编译时评估常量表达式来优化\
  \ TACKY 程序。在第 20 章中，你将编写一个寄存器分配器，将伪寄存器映射到硬件寄存器而不是栈位置。这些优化并不是于 C 或 x64 汇编的；你会在具有许多不同源语言和目标语言的编译器中发现它们。\n\
  \n### 附加资源\n\n如果你想学习完整的 System V x64 调用约定，包括传递结构体和联合体的所有规则，你有几种选择：\n\n*   官方的 System\
  \ V x86-64 ABI 可以在 [https://gitlab.com/x86-psABIs/x86-64-ABI] 获得。（我已经链接过几次了。）第 3.2.3\
  \ 节讨论了参数传递。\n\n*   Agner Fog 编写了一本描述不同 C++ 编译器调用约定的有用手册([https://www.agner.org/optimize/calling_conventions.pdf]）。第\
  \ 7.1 节的表 6 和表 7 了了结构如何传递和返回。文档涵盖了 C++，所以部分内容无关，但传递普通结构体和联合体的描述适用于 C 以及 C++。\n\n\
  我觉得 Fog 对调用约定的总结比官方 ABI 更容易理解。如果你决定为了加分实现联合体，你可能需要参考这两份文档。\n\n# 第三部分 优化\n\n![](img/pg556.jpg)\n\
  \n## 19 优化 TACKY 程序\n\n![](img/opener-img.jpg)\n\n在本书的前两个部分中，你编写了一个支持大部分 C 语言的编译器。你确保了你编写的可执行程序是正确的——也就是说，它们的行为符合\
  \ C 标准——但你并没有担心它们的性能。你没有尝试让它们运行更快、占用更少的存储或消耗更少的内存。在第三部分中，你将专注于*优化*这些程序——即让它们更小、更快。\n\
  \n某些编译器优化是*机器无关的*。这意味着它们不受目标架构细节的影响。编译器通常在将 TACKY 转换为汇编之前，在这样的中间表示上执行这些优化。另一方面，*机器相关*的优化需要考虑目标架构，因此这些优化通常在程序转换为汇编之后执行。本章涵盖了四种被广泛使用的机器无关优化：常量折叠、不可达代码消除、拷贝传播和死存储消除。你将添加一个新阶段（在章节开始的图中加粗显示），来将这些优化应用于\
  \ TACKY。下一章将介绍寄存器分配，这是一种机器相关的优化。\n\n你不需要在开始学习第三部分之前完成第二部分。对于每种优化，我们都将从一个不考虑第二部分语言特性的实现开始。然后，如果需要，我们将进行扩展以支持这些特性；如果你没有做第二部分，你将跳过此步骤。除了不可达代码消除外，每种优化都需要这个额外步骤，因为该优化不受第二部分特性的影响。\n\
  \n这两个章节仅包含了你在生产环境编译器中会发现的部分优化，但我们涵盖的基本概念适用于许多其他优化。在开始之前，让我们考虑一个对每个编译器优化都至关的问题：我们如何知道优化后的代码是正确的？\n\
  \n\n\n\n首先，编译器优化必须是 `safe`（安全的），这意味着它们不能改变程序的语义。（如果程序运行得不正确，无论它运行得有多快都没用！）。特别是，优化不能改变程序的\
  \ `observable behavior`（可观测行为），即对其执行环境可见的行为。返回退出状态、向 `stdout` 打印消息以及向文件写入都是可观测行为的示例。程序采取的大部分操作——例如计算值、更新局部变量以及从一条语句转移控制到另一条语句——对执行环境是不可见的，因此它们只间接影响程序的可观测行为。这为我们转换程序提供了很大的灵活性。只要可观测行为不变，我们就可以重排序、替换甚至删除代码。\n\
  \n让我们来看看 GCC 如何优化一个简单的 C 程序。`Listing 19-1` 初始化三个变量并赋值为 `1`、`2` 和 `3`，然后将它们相加并返回结果。\n\
  \n```\nint main(void) {\n    int x = 1;\n    int y = 2;\n    int z = 3;\n    return\
  \ x + y + z;\n}\n```\n\n`Listing 19-1: 相加三个变量的 C 程序`\n\n该程序每次运行时都会具有相同的可观测行为：它将以退出状态\
  \ `6` 退出。你可以运行以下命令在不进行优化的情况下编译程序：\n\n```\n$ gcc -S -fno-asynchronous-unwind-tables\
  \ -fcf-protection=none listing_19_1.c\n```\n\n这将产生 `Listing 19-2` 中的汇编代码，或类似的内容。\n\
  \n```\n .text\n    .globl main\nmain:\n    pushq   %rbp\n    movq    %rsp, %rbp\n\
  \    movl    $1, -4(%rbp)\n    movl    $2, -8(%rbp)\n    movl    $3, -12(%rbp)\n\
  \    movl    -4(%rbp), %edx\n    movl    -8(%rbp), %eax\n    addl    %eax, %edx\n\
  \    movl    -12(%rbp), %eax\n    addl    %edx, %eax\n    popq    %rbp\n    ret\n\
  ```\n\n`Listing 19-2: Listing 19-1 的未优化汇编`\n\n这段汇编程序忠实地实现了 `Listing 19-1` 的源码：它在栈上的三个位置初始化了值\
  \ `1`、`2` 和 `3`；将它们相加；然后通过 `EAX` 返回结果。现在，让我们使用 `-O` 选项编译相同的源码以启用优化：\n\n```\n$ gcc\
  \ -S -O -fno-asynchronous-unwind-tables -fcf-protection=none listing_19_1.c\n```\n\
  \n这将会生成 `Listing 19-3` 中的汇编代码。\n\n```\n .text\n    .globl main\nmain:\n    movl\
  \    $6, %eax\n    ret\n```\n\n`Listing 19-3: Listing 19-1 的优化后汇编`\n\n这段汇编程序并没有初始化三个变量然后相加，而是直接返回常量\
  \ `6`。`Listing 19-2` 和 `19-3` 看起来完全不同，但它们都产生了正确的可观测行为。\n\n### 四种 TACKY 优化\n\n本节介绍了我们将在本章中实现的优化：常量折叠（constant\
  \ folding）、不可达代码消除（unreachable code elimination）、拷贝传播（copy propagation）和死存消除（dead\
  \ store elimination）。这些优化旨在加速我们的代码并减少其占用的空间。单独来看，某些优化可以进一步促进这两个目标，而另一些优化单独来说并没有特别帮助。真正的收益来自于它们协同工作的方式，因为运行其中任何一种优化都会为应用其他优化创造新的机会。我们将顺序查看这四种优化，然后讨论每种优化如何让其他优化生效。\n\
  \n在开始之前，请注意，在本章的大部分 TACKY 示例中，我将使用极简的表示法。我会将拷贝写为 `x = y` 而不是 `Copy(Var(\"x\"), Var(\"\
  y\"))`（正如我在前面的章节中偶尔做的那样），并且对其他指令采取类似的简写方式。例如，我会将二元操作写为 `x = a + b` 而不是 `Binary(Add,\
  \ Var(\"a\"), Var(\"b\"), Var(\"x\"))`，将标签写为 `Target:` 而不是 `Label(Target)`。这种表示法让我们能够关注\
  \ TACKY 程序的高层逻辑，而不是每条 TACKY 指令的细节。\n\n#### 常量折叠\n\n`constant folding` 遍历会在编译时评估常量表达式。例如，常量折叠会将\
  \ `Binary` TACKY 指令\n\n```\na = 6 / 2\n```\n\n替换为 `Copy` 指令：\n\n```\na = 3\n```\n\
  \n常量折叠还可以将条件跳转转换为无条件跳转，或完全消除它们。它会将：\n\n```\nJumpIfZero(0, Target)\n```\n\n转换为\n\n\
  ```\nJump(Target)\n```\n\n因为程序总是会执行这次跳转。它还会删除指令：\n\n```\nJumpIfZero(1, Target)\n\
  ```\n\n因为程序永远不会执行这次跳转。（删除无用的跳转通常被视为死代码消除的一种类型，而不是常量折叠，但既然我们在这一阶段确实在转换条件跳转，那么我们不妨把这些无用的也删掉。）\n\
  \n常量折叠有助于提高速度和缩小代码大小。单个算术运算或比较可能需要几条汇编指令。其中某些指令（如 `idiv`）运行非常慢。常量折叠最终会将该汇编代码替换为单一的\
  \ `mov` 指令。\n\n#### 不可达代码消除\n\n`unreachable code elimination` 删除我们知道永远不会执行的指令。考虑\
  \ `Listing 19-4` 中的 TACKY 代码：\n\n```\nx = 5\nJump(Target)\nx = my_function()\nTarget:\n\
  Return(x)\n```\n\n`Listing 19-4: 包含不可达指令的 TACKY 代码`\n\n由于我们将跳过对 `my_function()`\
  \ 的调用，我们可以将其删除：\n\n```\nx = 5\nJump(Target)\nTarget:\nReturn(x)\n```\n\n现在 `Jump`\
  \ 指令是无用的，因为它跳转到的是即将执行的指令。我们也删除这条指令：\n\n```\nx = 5\nTarget:\nReturn(x)\n```\n\n最后，我们也可以消除\
  \ `Target` 标签，假设没有其他指令跳转到它：\n\n```\nx = 5\nReturn(x)\n```\n\n严格来说，我们刚刚删除的 `Jump`\
  \ 和 `Label` 指令并不是不可达代码；运行中的程序会到达它们，尽管它们不会产生任何影响。但移除不可达代码通常会让跳转和标签变得毫无用，因此这一阶段是移除它们的逻辑位置。\n\
  \n\n\n\n消除不可达代码可以显著减小代码体积。显而易见，移除无用的跳转可以节省时间；即使是无用的指令执行也需要时间。事实证明，移除真正不可达的指令（例如列表\
  \ 19-4 中的 `FunCall`）也可以通过减少内存压力和释放处理器指令缓存中的空间来加速程序运行。\n\n另一方面，移除未使用的标签不会影响速度或代码大小，因为标签在最终的可执行文件中不会变成机器指令。无论如何，我们都会移除这些标签，因为这会让我们的\
  \ TACKY 程序更易读、易调试，而且所需的额外工作极少。\n\n这一遍历对于清理我们在每个 TACKY 函数末尾添加的额外 `Return` 指令特别有用。回想一下，添加这条指令是为了作为兜底，以防源代码缺少\
  \ `return` 语句。当我们将程序转换为 TACKY 时，我们无法判断这个额外的 `Return` 是否必要，因此最终会将其添加到不需要的函数中。不可达代码消除遍历会移除所有我们不必要添加的\
  \ `Return` 指令，同时保留任何我们真正需要的指令。这是一个更广泛的原则的示例：生成低效代码稍后进行优化通常比从一开始就生成高效代码更容易。\n\n###\
  \ 复制传播（Copy Propagation）\n\n当程序包含 `Copy` 指令 `dst = src` 时，*复制传播*遍历会尝试在后续指令中将 `dst`\
  \ 替换为 `src`。看以下 TACKY 代码段：\n\n```\nx = 3\nReturn(x)\n```\n\n我们可以在 `Return` 指令中将\
  \ `x` 替换为它的当前值 `3`：\n\n```\nx = 3\nReturn(3)\n```\n\n将变量替换为常量是复制传播的一种特例，称为*常量传播*。在其他情况下，我们将一个变量替换为另一个变量。例如，我们可以将\n\
  \n```\nx = y\nReturn(x)\n```\n\n重写为：\n\n```\nx = y\nReturn(y)\n```\n\n有时，确定执行复制传播是否安全是困难的。看下面的例子：\n\
  \n```\nx = 4\nJumpIfZero(flag, Target)\nx = 3\nTarget:\nReturn(x)\n```\n\n取决于我们走哪条路径，当我们到达\
  \ `Return` 指令时，`x` 的值将是 `3` 或 `4`。由于我们不知道将通过哪条路径到达该指令，因此无法安全地将 `x` 替换为替换。为了处理这种情况，我们需要分析指向重写指令的所有可能路径。我们将使用名为*数据流分析*的技术来查看函数的所有路径，并找到可以安全执行复制传播的地方。数据流分析不仅用于复制传播；它还用于许多不同的编译器优化，包括我们将要讨论的死存储消除（dead\
  \ store elimination）。\n\n我们分析的某些复制将涉及具有静态存储周期的变量，这些变量可以被多个函数访问（在局部静态变量的情况下，只需访问同一个函数的多次调用）。我们并不总是能准确判断这些变量何时更新，因此我们的数据流分析需要以与自动存储周期变量略不同的方式处理它们。如果你完成了第二部分，你需要考虑对使用\
  \ `&` 操作符获取地址的变量所产生的类似不确定性，因为它们可以通过指针进行更新。\n\n复制传播本身并不用，但它能让我们的其他优化更有效。当我们传播常量时，我们为常量折叠（constant\
  \ folding）创造了新的机会。有时，我们将 `Copy` 指令目的地的每次使用都替换为源，这使得 `Copy` 本身变得毫无用处。我们会移除这些。\n\n\
  ### 死存储消除（Dead Store Elimination）\n\n当一条指令更新了变量但我们从未使用过该值时，该指令被称为*死存储*（dead store）。（这里的\
  \ *store* 一词指的是任何存储值的指令，而不是我们在第二部分中引入的 TACKY `Store` 指令。）因为死存储不影响程序的行为，所以移除它们是安全的。来看一个简单的例子：\n\
  \n```\nx = 10\nReturn(y)\n```\n\n假设 `x` 具有自动存储周期，指令 `x = 10` 就是一个死存储。在这条指令到函数结束之间，我们没有使用\
  \ `x`，而函数结束也是 `x` 生命期的结束。\n\n这是另一种类型的死存储：\n\n```\nx = a + b\nx = 2\nReturn(x)\n\
  ```\n\n在这个例子中，我们永远不会使用 `a + b` 的结果，因为我们会先覆盖它；这意味着 `x = a + b` 是一个死存储。死存储消除遍历会识别并移除此类指令。挑战在于证明一条指令确实是死存储；为了做到这一点，我们需要分析函数的每条路径，并确保它赋值给目的地的值被使用了。再次，我们将使用数据流分析来确定何时应用这种优化。\n\
  \n与复制传播类似，当你考虑到可以被多个函数或通过指针访问的对象时，死存储消除变得更加复杂。例如，如果 `x` 是全局变量，那么我们第一个例子中的指令 `x =\
  \ 10` 就*不是*死存储；`x` 可能在函数返回后被使用。我们的数据流分析必须考虑到这种可能性。\n\n### 合力齐力……\n\n现在让我们来看看在本章中将实现的四种优化是如何协同工作的。我们将使用列表\
  \ 19-5 中的 TACKY 程序作为运行示例。\n\n```\nmy_function(flag):\n    x = 4\n    y = 4 - x\n\
  \    JumpIfZero(y, Target)\n    x = 3\n    Target:\n    JumpIfNotZero(flag, End)\n\
  \    z = 10\n    End:\n    z = x + 5\n    Return(z)\n```\n\n列表 19-5：一个未经优化的 TACKY\
  \ 程序\n\n\n\n\n\n通过使用四种优化，我们可以将此函数简化为单一的 `Return` 指令。我将展示每轮优化的结果，突出显示任何更改的指令。由于每次优化都可能为应用其他三种优化创造更多机会，我们需要运行大部分优化几次才能完全优化此函数。目前，我们将通过观察代码并判断哪种优化最有用，以一种权宜的方法来决定每一步运行哪种优化。在实际实现优化流水线时，我们将使用更系统化的方法。\n\
  \n让我们从复制传播（copy propagation）遍历开始，在 `y = 4 - x` 中将 `x` 替换为 `4`：\n\n```\nmy_function(flag):\n\
  \    x = 4\n    y = 4 - 4\n    JumpIfZero(y, Target)\n    x = 3\n    Target:\n \
  \   JumpIfNotZero(flag, End)\n    z = 10\n    End:\n    z = x + 5\n    Return(z)\n\
  ```\n\n我们不能替换 `z = x + 5` 中第二次使用的 `x`，因为在那个点 `x` 有多个可能的值：取决于我们是否执行了条件跳转，它可能是 `3`\
  \ 也可能是 `4`。接下来，我们将应用常量折叠（constant folding）来计算 `y = 4 - 4`：\n\n```\nmy_function(flag):\n\
  \    x = 4\n    y = 0\n    JumpIfZero(y, Target)\n    x = 3\n    Target:\n    JumpIfNotZero(flag,\
  \ End)\n    z = 10\n    End:\n    z = x + 5\n    Return(z)\n```\n\n通过将二元操作替换为 `Copy`\
  \ 指令，我们为复制传播了另一个机会。我们可以在 `JumpIfZero` 指令中将 `y` 替换为它的值 `0`：\n\n```\nmy_function(flag):\n\
  \    x = 4\n    y = 0\n    JumpIfZero(0, Target)\n    x = 3\n    Target:\n    JumpIfNotZero(flag,\
  \ End)\n    z = 10\n    End:\n    z = x + 5\n    Return(z)\n```\n\n现在 `JumpIfZero`\
  \ 依赖于常量条件，我们可以再次运行常量折叠，将其转换为无条件的 `Jump`：\n\n```\nmy_function(flag):\n    x = 4\n\
  \    y = 0\n    Jump(Target)\n    x = 3\n    Target:\n    JumpIfNotZero(flag, End)\n\
  \    z = 10\n    End:\n    z = x + 5\n    Return(z)\n```\n\n这一更改使得 `x = 3` 不可达，因此我们将运行不可代码消除（unreachable\
  \ code elimination）来删除它。此遍历还会移除 `Jump` 指令和 `Target` 标签，因为在我们删除 `x = 3` 之后，它们已经没有作用了：\n\
  \n```\nmy_function(flag):\n    x = 4\n    y = 0\n    JumpIfNotZero(flag, End)\n\
  \    z = 10\n    End:\n    z = x + 5\n    Return(z)\n```\n\n我们之前无法重写 `z = x + 5`，是因为\
  \ `x` 在通往该指令的不同路径上有两个不同的值。我们刚刚通过消除通过 `x = 3` 的路径解决了这个问题。现在我们可以再次运行复制传播：\n\n```\n\
  my_function(flag):\n    x = 4\n    y = 0\n    JumpIfNotZero(flag, End)\n    z =\
  \ 10\n    End:\n    z = 4 + 5\n    Return(z)\n```\n\n然后我们运行另一轮常量折叠：\n\n```\nmy_function(flag):\n\
  \    x = 4\n    y = 0\n    JumpIfNotZero(flag, End)\n    z = 10\n    End:\n    z\
  \ = 9\n    Return(z)\n```\n\n最后我们最后最后一次复制传播：\n\n```\nmy_function(flag):\n    x =\
  \ 4\n    y = 0\n    JumpIfNotZero(flag, End)\n    z = 10\n    End:\n    z = 9\n\
  \    Return(9)\n```\n\n我们成功在编译时计算出了此函数的返回值，消除了对 `x`、`y` 和 `z` 的所有使用。现在我们将运行死存储消除（dead\
  \ store elimination）来清理这些变量：\n\n```\nmy_function(flag):\n    x = 4\n    y = 0\n\
  \    JumpIfNotZero(flag, End)\n    z = 10\n    End:\n    z = 9\n    Return(9)\n\
  ```\n\n最后，我们将运行不可代码消除来移除 `JumpIfNot` 指令和 `End` 标签。这两者都是多余的，因为我们刚刚将函数简化为了单一指令：\n\n\
  ```\nmy_function(flag):\n    Return(9)\n```\n\n\n\n\n\n`--eliminate-dead-stores`\
  \ 启用死存储消除（dead store elimination）。\n\n`--optimize` 启用所有四个优化。\n\n启用优化的选项应该传递给优化阶段，我们将在接下来实现该阶段。允许启用多个单独的优化；例如，`./YOUR_COMPILER\
  \ --fold-constants --propagate-copies` 应该同时启用常量折叠和拷贝传播，但不启用另外两种优化。\n\n如果你的编译器生成的汇编代码与我在书中列出的方式不完全，测试脚本仍然能够验证你用于本章测试的汇编输出，但有几点需要注意。首先，测试脚本只识别\
  \ AT&T 汇编语法，这也是我们在整本书中一直使用的语法。其次，脚本并不识别每一条汇编指令；它只认识我们在书中使用过的指令，以及少数几个在现实汇编代码中特别常见的指令。如果你发出了测试脚本无法理解指令，某些测试可能会失败。\n\
  \n接下来，我们将接通新的优化阶段，该阶段将控制我们何时调用每项具体的优化。\n\n### 接通优化阶段\n\n优化阶段将在程序转换为 TACKY 之后立即运行。该阶段将独立地优化每个\
  \ TACKY 函数，而不感知程序中定义的其他函数。例如，它不会在常量折叠传递期间尝试评估函数调用，也不会在死存储消除期间将其删除。（我们无法在死存储消除期间删除函数调用，因为我们并不知道它们是否具有副作用。尽管，我们*可以在*不可达代码消除期间删除它们——如果一个函数调用永远不会执行，那么该函数有什么副作用都无紧要。）这种一次转换一个函数的优化被称为*过程内优化*（intraprocedural\
  \ optimizations）。绝大多数生产级编译器还会执行*过程间优化*（interprocedural optimizations），它们转换的是整个编译单元而不是单个函数。\n\
  \n每项单独的优化将 TACKY 函数的体作为输入，并返回一个语义等价的函数体作为输出。在常量折叠传递中，我们将像通常做的那样将函数体表示为 TACKY 指令列表。但在其他三个优化传递中，我们将每个函数表示为*控制流图*（control-flow\
  \ graph）。这是一种中间表示，显式地模拟了通过代码的不同执行路径。我们将在本章节稍后详细讨论如何构建控制流图以及它们为什么有用。\n\n优化阶段通过反复运行所有已启用的优化来处理每个函数。一旦达到一个*固定点*（fixed\
  \ point），即再次运行它们不再进一步更改函数，它就会停止。代码列表 19-6 展示了这一优化流水线。\n\n```python\noptimize(function_body,\
  \ enabled_optimizations):\n    if function_body is empty:\n        return function_body\n\
  \n    while True:\n        if enabled_optimizations contains \"CONSTANT_FOLDING\"\
  :\n          ❶ post_constant_folding = constant_folding(function_body)\n       \
  \ else:\n            post_constant_folding = function_body\n\n      ❷ cfg = make_control_flow_graph(post_constant_folding)\n\
  \n        if enabled_optimizations contains \"UNREACHABLE_CODE_ELIM\":\n       \
  \     cfg = unreachable_code_elimination(cfg)\n\n        if enabled_optimizations\
  \ contains \"COPY_PROP\":\n            cfg = copy_propagation(cfg)\n\n        if\
  \ enabled_optimizations contains \"DEAD_STORE_ELIM\":\n            cfg = dead_store_elimination(cfg)\n\
  \n      ❸ optimized_function_body = cfg_to_instructions(cfg)\n\n      ❹ if (optimized_function_body\
  \ == function_body\n            or optimized_function_body is empty):\n        \
  \    return optimized_function_body\n\n        function_body = optimized_function_body\n\
  ```\n\n列表 19-6：TACKY 优化流水线\n\n在此列表中，`function_body` 是 TACKY 函数体中的指令列表，`enabled_optimizations`\
  \ 是一个表示我们在命令行上启用优化的字符串列表。（在实际程序中，这种存储命令行选项的方式会非常拙劣；你可以在你自己的代码中用不同的方式表示这些选项。）如果 `function_body`\
  \ 为空，我们将直接返回它，因为没有可以优化的内容。否则，如果启用了常量折叠，我们将执行该操作❶❶\n\n接下来，我们将函数体从指令列表转换为控制流图 ❷。我们将对该表示应用所有其他已启用的优化。然后，我们将优化后的控制流图转换回指令列表\
  \ ❸，并将其与原始列表进行比较 ❹。如果它们不同，且我们没有优化掉整个函数，我们将再次进入循环以利用新的优化机会。如果相同，则我们无法对其进一步优化，工作就完成了。\n\
  \n使用代码列表 19-6 中的优化流水线，我们不会错过任何优化机会。每当某项优化更改程序时，重新运行其他优化以利用这些变化。这是可能的，因为我们只实现了四种优化，而且我们所有的测试程序都足够小，可以快速优化。实现数十种优化并编译大大程序的生产级编译器并不采用这种方法；如果这样做，编译耗时将过长。相反，它们只应用一次固定顺序的优化，在可能产生最大影响的地方运行每项具体的优化。结果是它们可能会错过优化机会。（对于任何给定程序找到最佳优化顺序是一个开放的研究问题，被称为*阶段排序问题*（phase\
  \ ordering problem）。）\n\n继续为你的编译器添加优化流水线。现在，将每项单独的优化定义为接收指令列表并返回不变内容的存根函数。你可以同样的方式\
  \ stub 出与控制流图之间的转换。现在编写这些水水代码，以便在实现各个优化传递时对其进行测试。\n\n一旦一切接通，你就可以开始你的第一个优化：常量折叠！\n\
  \n### 常量折叠\n\n常量折叠是本章中最简单的优化。该传递遍历 TACKY 函数中的所有指令，并评估任何带有常量操作数的指令。首先，我们将简要讨论如何在你在第一部分中实现的编译器版本上添加常量折叠。然后，我们将讨论如何处理你在第二部分中添加的类型和\
  \ TACKY 指令。如果你还没有学习第二部分，可以跳过后面的讨论。\n\n#### 针对第一部分 TACKY 程序的常量折叠\n\n\n\n\n\n常量折叠（constant\
  \ folding）阶段应该评估来自第一部分的四种 TACKY 指令：`Unary`、`Binary`、`JumpIfZero` 和 `JumpIfNotZero`。当你发现一个带有常量源操作数的\
  \ `Unary` 指令，或者带有两个常量源操作数的 `Binary` 指令时，将其替换为 `Copy`。例如，你应该将\n\n```\nBinary(binary_operator=Add,\
  \ src1=Constant(1), src2=Constant(2), dst=Var(\"b\"))\n```\n\n替换为：\n\n```\nCopy(src=Constant(3),\
  \ dst=Var(\"b\"))\n```\n\n你的常量折叠阶段可能会遇到两种无效表达式：除以零和导致整数溢出的操作。这些都是未定义行为，因此你如何评估它们并不重要。但是，你的编译器在遇到这些无效表达式时不能直接失败，因为只有在运行时实际到达无效表达式时，程序的行为才是未定义的。例如，如果程序在一个永远不会执行的分支中包含除以零，你仍然应该能够编译它。\n\
  \n你还应该评估带有常量条件的 `JumpIfZero` 和 `JumpIfNotZero` 指令。如果条件满足，则将指令替换为无条件的 `Jump`。如果条件不满足，则从程序中删除该指令。仅此而已！如果你只完成了第一部分，在实现这四种指令的常量折叠后，你可以跳转到测试套件。如果你完成了第二部分，还有几个额外的指令你需要处理。\n\
  \n### 支持第二部分的 TACKY 程序\n\n当我们在第二部分中添加新的算术类型时，我们也添加了类型转换指令：`Truncate`、`SignExtend`、`ZeroExtend`、`DoubleToInt`、`DoubleToUInt`、`IntToDouble`\
  \ 和 `UIntToDouble`。当这些指令的源操作数为常量时，常量折叠阶段应该评估它们。\n\n`Copy` 指令也可以执行类型转换；我们用它在相同符号符号和无符号整数之间转换。当\
  \ `Copy` 指令将无符号常量复制到符号变量（或反之）时，此阶段应将常量转换为类型。例如，如果 `a` 是一个 `signed char`，你应该将\n\n\
  ```\nCopy(src=Constant(ConstUChar(255)), dst=Var(\"a\"))\n```\n\n替换为：\n\n```\nCopy(src=Constant(ConstChar(-1)),\
  \ dst=Var(\"a\"))\n```\n\n在执行每种类型转换时，要确保语义与程序在运行时使用的语义完全一致。例如，当将 `double` 转换为整数类型时，向零截断其值；当将整数转换为\
  \ `double` 时，则舍入到最近的可表示值。好消息是，你已经知道如何在编译时执行所有这些类型转换了，因为在整个第二部分中，你都必须将静态初始化器转换为正确的类型。理想情况下，你将能够重用已经写的代码来执行这些类型转换。\n\
  \n在评估无符号算术操作时，你还需要遵循 C 语义。特别是，你应该确保无符号算术会回绕（wraps around），就像在运行时那样。你如何实现这一点完全取决于你用什么语言编写编译器。某些语言的标准库支持回绕的无符号算术。例如，在\
  \ Rust 中，`wrapping_add` 和 `wrapping_sub` 等方法提供了与 C 相同的语义。在其他语言中，你可能需要使用第三方库。例如，Python\
  \ 不提供无符号类型，但 NumPy 提供。如果你不想使用外部库，自己实现回绕并不是非常困难。\n\n最后，在评估浮点操作时，你需要使用“舍入五入偶”（round-to-nearest,\
  \ ties-even）舍入法，并正确处理负零和无穷。如果你在第 13 章中加入了对 NaN 的支持，也需要评估它。\n\n### 控制流图\n\n在本章的剩余部分，我们将用控制流图（control-flow\
  \ graphs）表示 TACKY 函数。图表示适合我们剩余的优化，这些优化必须考虑到我们在函数中可能经过的不同路径。控制流图节点代表被称为*基本块*（basic\
  \ blocks）的直线代码序列，除了代表函数入口和出口的两个特殊节点。每个节点都有指向其后可以立即执行的节点的出边。\n\n例如，让我们来看列表 19-7 的控制流图。\n\
  \n```\nprocessing_loop():\n    LoopStart:\n    input = get_input()\n    JumpIfNotZero(input,\
  \ ProcessIt)\n    Return(-1)\n    ProcessIt:\n    done = process_input(input)\n\
  \    JumpIfNotZero(done, LoopStart)\n    Return(0)\n```\n\n列表 19-7：具有多个执行路径的 TACKY\
  \ 函数\n\n该函数执行一个循环，通过调用 `get_input()` 重复获取值，然后通过调用 `process_input()` 处理该值。如果 `get_input()`\
  \ 返回 `0`，该函数将立即返回 `-1`。如果 `process_input()` 返回 `0`，该函数立即返回 `0`。图 19-1 显示了相应的控制流图。\n\
  \n![images/fig19-1.jpg)\n\n\n\n\n\n图 19-1：列表 19-7 的控制流图 描述\n\n从特殊的 `ENTRY` 节点有一条指向块\
  \ `B0` 的出边，因为我们总会在函数开始时执行 `B0`。（在每个控制流图中，`ENTRY` 恰好有一个出边，因为 C 函数只有一个入口。）执行完 `B0`\
  \ 后，有两种可能：我们可以执行程序中的下一个块 `B1`，或者跳转到块 `B2`。因此，`B0` 有指向这两个块的出边。按照同样的逻辑，`B2` 有指向 `B0`\
  \ 和 `B3` 的出边。`Return` 指令会退出函数，因此 `B1` 和 `B3` 各有一条指向 `EXIT` 的出边。\n\n#### 定义控制流图\n\
  \n现在你已经知道控制流图是什么样的了，让我们来看看如何构建它。首先，我们将定义图的数据结构。列表 19-8 概述了一种种可能的表示方法。\n\n```\nnode_id\
  \ = ENTRY | EXIT | BlockId(int num)\nnode = BasicBlock(node_id id, instruction*\
  \ instructions,\n                  node_id* predecessors, node_id* successors)\n\
  \     | EntryNode(node_id* successors)\n     | ExitNode(node_id* predecessors)\n\
  graph = Graph(node* nodes)\n```\n\n列表 19-8：表示控制流图的一种方法\n\n图中的每个节点都有一个唯一的 `node_id`，用于标识其为\
  \ `ENTRY`、`EXIT` 或编号的基本块。我们将根据基本块在原始 TACKY 函数中的顺序为基本块分配数字 ID。每个基本块包含一个 TACKY 指令列表、一个\
  \ `successors` 列表（紧随其后可能执行的块）以及另一个 `predecessors` 列表（在它之前可能执行的块）。入口节点和退出节点不包含任何指令。`ENTRY`\
  \ 作为函数的起点，有后继节点但没有前驱。相反，`EXIT` 有前驱但没有后继节点。\n\n我们需要一种方法将基本块与额外信息关联起来，以便你跟踪数据流分析。你可以将其直接附加到节点上，也可以存储在单独的数据结构中。列表\
  \ 19-8 中的伪代码包含了这一点。\n\n> **注意**：你的图结构可能与[列表 19-8]非常不同。例如，你可能希望将图表示为从 node_id 到节点的映射（map），而不是节点列表。你可以以任何符合逻辑且适合你实现的方式来定义控制流图。\n\
  \n#### 创建基本块\n\n接下来，让我们如何将 TACKY 函数的主体划分为基本块。你不能跳转到基本块中间或从中间离开。这意味着 `Label` 只能作为块的第一条指令出现，而\
  \ `Return` 或跳转指令只能出现在最后。列表 19-9 展示了如何沿着这些边界拆分指令列表。\n\n```\npartition_into_basic_blocks(instructions):\n\
  \    finished_blocks = []\n    current_block = []\n    for instruction in instructions:\n\
  \      if instruction is Label:\n            if current_block is not empty:\n  \
  \              finished_blocks.append(current_block)\n            current_block\
  \ = [instruction]\n\n      else if instruction is Jump, JumpIfZero, JumpIfNotZero,\
  \ or Return:\n            current_block.append(instruction)\n            finished_blocks.append(current_block)\n\
  \            current_block = []\n\n        else:\n          current_block.append(instruction)\n\
  \n    if current_block is not empty:\n        finished_blocks.append(current_block)\n\
  \n    return finished_blocks\n```\n\n列表 19-9：将指令列表划分为基本块\n\n当我们遇到 `Label` 指令时，我们开始一个以该\
  \ `Label` ❶ 开始的新基本块。当我们遇到 `Return` 指令或条件跳转/无条件跳转时，我们将其添加到当前块中，然后开始一个新的空块 ❷。当我们遇到任何其他指令时，我们将其添加到当前块而不启动新块\
  \ ❸。\n\n[列表 19-9] 仅仅是将函数体划分为一个指令列表（列表的列表）。下一步（我将不会提供该部分的伪代码）是将这些指令列表转换为具有递增块 ID\
  \ 的 `BasicBlock` 节点。然后，我们将这些节点连同入口和退出节点一起添加到图中。\n\n\n\n\n\n在将每个节点添加到图中后，我们将从每个节点向其后继节点添加边边，如\
  \ Listing 19-10 所示。\n\n```\nadd_all_edges( ❶ graph):\n\n  ❷ add_edge(ENTRY, BlockId(0))\n\
  \n    for node in graph.nodes:\n        if node is EntryNode or ExitNode:\n    \
  \        continue\n\n        if node.id == max_block_id(graph.nodes):\n        \
  \    next_id = EXIT\n        else:\n          ❸ next_id = BlockId(node.id.num +\
  \ 1)\n\n        instr = get_last(node.instructions)\n        match instr with\n\
  \        | Return(maybe_val) -> add_edge(node.id, EXIT)\n        | Jump(target)\
  \ ->\n            target_id = get_block_by_label(target)\n            add_edge(node.id,\
  \ target_id)\n        | JumpIfZero(condition, target) ->\n            target_id\
  \ = get_block_by_label(target)\n          ❹ add_edge(node.id, target_id)\n     \
  \     ❺ add_edge(node.id, next_id)\n        | JumpIfNotZero(condition, target) ->\n\
  \            // same as JumpIfZero\n            --snip--\n        | _ -> add_edge(node.id,\
  \ next_id)\n```\n\nListing 19-10: 为控制流图添加边\n\n`add_all_edges` 的参数 `graph` ❶ 是我们尚未完成的控制流图，它包含节点但没有边。我们将首先添加从\
  \ `ENTRY` 到第一个基本块的 ❷ 边。（我们可以假设该函数至少包含一个基本块，因为我们不会优化空函数。）在整个列表代码中，我们将使用 `add_edge`\
  \ 函数（它接收两个节点 ID）来向图中添加边。请记住，每当我们从 `node1` 向 `node2` 添加一条边时，我们都必须同时更新 `node1` 的所有后继节点和\
  \ `node2` 的所有前驱节点。我省略了 `add_edge` 的伪代码，因为它取决于你如何定义控制流图。\n\n接下来，我们将从对应于基本块的节点向外添加边。为了处理其中某一个节点，我们首先要确定如果不在块末尾进行跳转或返回，默认情况下哪一个节点将紧随其后。如果我们处理的是最后一个块，则下一个节点将是\
  \ `EXIT`。否则，它将是原始 TACKY 函数中接下来的任何基本块 ❸。\n\n我们将通过检查当前基本块中的最后指令来确定需要添加哪些边。如果它是一个 `Return`\
  \ 指令，我们将向 `EXIT` 添加一条出向边。如果它是一个无条件的 `Jump`，我们将向以相应 `Label` 开始的块添加一条边。我们使用辅助函数 `get_block_by_label`（我将不会展示其伪代码）来查找哪个块是以特定标签开始的。我建议提前构建一个从标签到块\
  \ ID（block IDs）的映射（map），这样该函数只需执行映射查找即可。\n\n如果一个块以条件跳转结束，我们将添加两条出向边。第一条边代表执行跳转，将指向以相应\
  \ `Label` ❹ 始的块。另一条边代表不跳转 ❺，将指向由 `next_id` 确定的默认下一个节点。如果一个块以任何其他指令结束，我们将向默认下一个节点添加单条的出向边。\n\
  \n### 将控制流图转换为指令列表\n\n此时，你应该已经有了可以运行的代码，可以将 TACKY 函数转换为控制流图。你还需要代码来执行反向操作，即将控制流图转换回列表。这种操作要简单得多：只需对所有块进行排序，然后连接它们的指令即可。\n\
  \n### 使你的控制流图具有可重用性\n\n在下一章中，我们将为汇编构建控制流图。我们将使用相同的算法来构建这些图，但我们会寻找不同的指令。例如，`jmp`、`ret`、`jne`\
  \ 和 `je` 都标志着块的结束。\n\n一旦你有了构建控制流图的运行代码，你可能想对其进行重构，使其也能用于汇编。这完全是可选的，但它将在你在下一章中节省一些精力。\n\
  \n首先，你需要泛化 `graph` 数据类型，使其能够包含 TACKY 指令或汇编指令。接下来，你需要泛化 Listing 19-9 和 19-10 中的逻辑。例如，你可以定义一个一次性的数据类型来表示两者：\n\
  \n```\ngeneric_instruction = Return\n                    | Jump\n              \
  \      | ConditionalJump(identifier)\n                    | Label(identifier)\n\
  \                    | Other\n```\n\n与其通过检查 TACKY 指令来确定块在何结束或其后继节点是什么，你可以将每条指令转换为\
  \ `generic_instruction` 并对其进行检查。然后，当你需要为汇编构建控制流图时，你将使用不同的辅助函数将汇编指令转换为 `generic_instruction`，但保持其他部分不变。\n\
  \n到此，我们对控制流图的讨论结束结束。我们现在准备进入第二个优化阶段：不可达代码消除。\n\n### 不可达代码消除\n\n我们将此轮优化分为三个步骤：首先移除永远不会执行的基本块，然后移除无用的跳转，最后移除无用的标签。最后两个步骤可能会留下一些不包含指令的空块。可选情况下，我们可以在优化后通过从控制流图中移除这些空块来完成清理。\n\
  \n#### 消除不可达块\n\n为了找到所有可能执行的块，我们将从 `ENTRY` 开始遍历控制流图。我们将访问 `ENTRY` 的后继节点，然后是该节点的所有后继节点，以此类推，直到没有可以探索的节点为止。如果这次遍历从未到达某个特定块，我们就知道该块是可以删除的。让我们在\
  \ Listing 19-4 中的示例上尝试这种方法，这是我们在首次介绍不可达代码消除时看过的例子：\n\n```\nx = 5\nJump(Target)\n\
  x = my_function()\nTarget:\nReturn(x)\n```\n\n\n\n\n我们之前已经确定 `x = my_function()`\
  \ 是不可达的。假设该列表是整个 TACKY 函数的体，它将具有如图 19-2 所示的控制流图。\n\n![](img/fig19-2.jpg)\n\n图 19-2：列表\
  \ 19-4 的控制流图 描述\n\n注意，从 `ENTRY` 到 `B1` 没有路径。如果我们从 `ENTRY` 开始遍历此图，我们将访问 `B0`、`B2`\
  \ 和 `EXIT`。在此过程中，我们将跟踪到目前为止访问过的哪些节点。一旦完成，我们会发现从未访问过 `B1`，因此将将其删除。我不会提供遍历图的伪代码，因为这只是一个普通的广度优先或深度优先图遍历。\n\
  \n当你从图中删除一个节点时，请记住也要删除它的出向边。例如，当我们从图 19-2 中的图中删除 `B1` 时，我们应该也将其从 `B2` 的前驱节点列表中删除。\n\
  \n#### 无用跳转\n\n接下来，我们将删除任何无用的跳转指令。请记住，默认情况下，如果一个块不是以跳转或 `Return` 指令结束，控制将按照原始程序的顺序贯穿到下一个块。如果跳转指令的目标是这个默认的下一个块，我们就可以删除该跳转指令。\n\
  \n我们将查看每个以条件跳转或无条件跳转结束的基块，并确定如果不执行跳转，默认情况下哪个块将跟随其。如果这个默认的下一个块是它的唯一后继，则该跳转指令是冗余的。列表\
  \ 19-11 演示了这种方法。\n\n```\nremove_redundant_jumps(graph):\n  ❶ sorted_blocks = sort_basic_blocks(graph)\n\
  \    i = 0\n  ❷ while i < length(sorted_blocks) - 1:\n        block = sorted_blocks[i]\n\
  \        if block.instructions ends with Jump, JumpIfZero, or JumpIfNotZero:\n \
  \           keep_jump = False\n            default_succ = sorted_blocks[i + 1]\n\
  \            for succ_id in block.successors:\n                if succ_id != default_succ.id:\n\
  \                    keep_jump = True\n                    break\n            if\
  \ not keep_jump:\n              ❸ remove_last(block.instructions)\n        i +=\
  \ 1\n```\n\n列表 19-11：删除冗余跳转\n\n首先，我们根据基块在原始 TACKY 函数中的位置对其进行排序 ❶；这就是我们在最初构建图时对块进行编号的原因之一。接下来，我们将遍历这个排序后的基块列表（除了最后一个，因为函数最末尾的跳转永远不会冗余的）\
  \ ❷。如果一个块以跳转结束，我们将搜索列表中下一个块之外的其它后继节点。如果我们找到了，就保留该跳转指令。否则，我们将其删除 ❸。\n\n注意，下一个块并不一定具有下一个\
  \ ID，因为我们可能已经删除了某些块。例如，`2` 后面可能跟着 `4`。这就是为什么我们不能简单地递增块的 ID。\n\n#### 删除无用标签\n\n删除标签与删除跳转类似。按\
  \ ID 排序后，如果是因为是从上一个块贯穿进入而非通过跳转进入，我们就可以删除块开头的 `Label` 指令。具体来说，如果 `sorted_blocks[i]`\
  \ 的唯一前驱是 `sorted_blocks[i-1]`，我们就可以删除 `sorted_blocks[i]` 开头的 `Label`。如果 `sorted_blocks[0]`\
  \ 的唯一前驱是 `ENTRY`，我们也可以删除 `sorted_blocks[0]` 开头的 `Label`。这种转换是安全的，因为我们刚刚删除了跳转指令；我们知道\
  \ `sorted_blocks[i-1]` 不会以跳转到 `sorted_blocks[i]` 结束。我不会提供这一步的伪代码，因为它看起来与 [19-11]\
  \ 基本相同。\n\n#### 删除空块\n\n消除不可达的跳转和标签可能会导致没有指令的块。如果你愿意，可以删除它们；这将缩小图并稍微加快后续的遍历。当你删除块时，确保更新图中的边。例如，如果图中从\
  \ `B0` 到 `B1` 以及从 `B1` 到 `B2` 有边，而你删除了 `B1`，则你需要添加一条从 `B0` 到 `B2` 的边。\n\n### 数据流分析简介\n\
  \n本节将简要概述数据流分析，我们将在接两次遍历中依赖它。你将学习它是什么、它什么时候有用，以及所有数据流分析的共同特征。这并不是对数据流分析的完整解释；我的目标在这里只是介绍几个核心思想并描述它们是如何结合在一起的，以便后续章节中的特定分析更容易理解。\n\
  \n\n\n\n\n数据流分析回答了关于值在函数范围内如何定义和使用的问题。不同的数据流分析回答不同的问题。例如，在复制传播（copy propagation）阶段中，我们将实现`复制到达分析（reaching\
  \ copies analysis）`。回答这样一个问题：给定 TACKY 函数中的指令 `i` 以及该函数中的两个操作数 `u` 和 `v`，我们能否保证在执行\
  \ `i` 之前的这一点，`u` 和 `v` 是相等的？\n\n我们可以将所有数据流分析分为大类：正向分析和反向分析。在`正向分析`中，信息沿着控制流图向前传递。复制到达分析就是一种正向分析。当我们看到\
  \ `Copy` 指令 `x = y` 时，它告诉我们 `x` 和 `y` 在同一个基本块的后续或该块的某个后继中可能具有相同的值。在`反向分析`中，情况相反。在死存储消除（dead\
  \ store elimination）阶段中，我们将实现一种名为`活跃性分析（liveness analysis）`的反向分析。这种分析告诉我们变量的当前值是否会被再次使用。如果我们看到一个使用\
  \ `x` 的指令，它告诉我们 `x` 在同一个基本块或该块的某个前驱中之前可能是活跃的。\n\n每个数据流分析都有其自己的传递函数（transfer function）和汇合运算符（meet\
  \ operator）。`传递函数`计算单个基本块内的分析结果。该函数分析单个指令如何影响结果，但不需要处理多个执行路径。`汇合运算符`结合来自多条路径的信息，计算每个基本块如何受到其邻块的影响。我们将使用`迭代算法（iterative\
  \ algorithm）`来驱动整个分析。该算法在每个基本块上调用传递函数和汇合运算符，并跟踪哪些块仍需要分析。它是迭代的，是因为当我们沿着不同的执行路径传播信息时，可能需要多次访问某些块。该算法将遍历控制流图，分析它所访问的每个基本块，直到达到分析结果不再改变的固定点。在某一点，我们就知道所有可能的执行路径都已考虑在内。迭代算法不是解决数据流分析问题的唯一方法，但它是书中讨论的唯一方法。\n\
  \n虽然不同的分析使用不同的传递函数和汇合运算符，但它们本质上都使用相同的迭代算法。正向和反向分析使用该算法的不同版本，因为它们以相反的方向传播数据。我们将在接两个章节中实现这两个版本。\n\
  \n### 复制传播\n\n如果指令 `x = y` 出现在函数中，我们有时可以在该函数的后续部分将 `x` 替换为 `y`。让我们想要进行此类替换的指令称为\
  \ `i`。当满足两个条件时，这种替换是安全的。首先，`x = y` 必须出现在从程序入口点到 `i` 的所有路径上。考虑图 19-3 中的控制流图，它并没有满足这一条件。\n\
  \n![Figure 19-3: 一个无法执行复制传播的函数控制流图](img/fig19-3.jpg)\n>\n>\n> *图 19-3: 一个无法执行复制传播的函数控制流图*\
  \ (描述)\n\n在这个控制流图中，从函数开始到 `Return(x)` 有两条路径。因为只有这些路径中的一条经过了 `x = 2`，因此在该 `Return`\
  \ 指令中将 `2` 替换为 `x` 是安全的。相反，在图 19-4 中，通往 `Return(x)` 的条路径都经过了 `x = 2`。\n\n![Figure\
  \ 19-4: 一个可以执行复制传播的函数控制流图](img/fig19-4.jpg)\n>\n>\n> *图 19-4: 一个可以执行复制传播的函数控制流图*\
  \ (描述)\n\n无论我们通过图 19-4 中的哪条路径，在到达 `Return` 指令之前都会执行 `x = 2`，因此我们可以安全地将其重写为 `Return(2)`。\n\
  \n![Figure 19-5: 另一个复制传播安全的控制流图](img/fig19-5.jpg)\n>\n>\n> *图 19-5: 另一个复制传播安全的控制流图*\
  \ (描述)\n\n再次，通往 `Return(x)` 有两条路径。两条路径都经过了 `x = y`，但它们经过的是出现在不同块中的该指令的不同实例。在 `B1`\
  \ 中，`y` 的值为 `20`；在 `B2` 中，它是 `100`。但无论哪种情况，到达 `Return` 指令时，`x` 和 `y` 将具有相同的值。这意味着将\
  \ `Return(x)` 重写为 `Return(y)` 仍然是安全的。\n\n在我们重写指令 `i` 之前，每条通往 `i` 的路径必须满足第二个条件：在指令\
  \ `x = y` 和 `i` 之间，`x` 或 `y` 再次更新。考虑这段 TACKY 代码片段：\n\n```\nx = 10\nx = foo()\nReturn(x)\n\
  ```\n\n我们不能在 `Return(x)` 中将 `x` 替换为 `10`，因为在该点 `x` 的值不再是 `10`。更新 `Copy` 指令右侧的变量会导致相同的问题：\n\
  \n```\nx = y\ny = 0\nReturn(x)\n```\n\n\n\n在 `y = 0` 之前，我们知道 `x` 和 `y` 的值相同。但在该指令之后，它们的值将变得不同，因此我们不能重写\
  \ `Return(x)`。当一个 `Copy` 指令的源或目的地被更新时，我们称该拷贝操作被*杀死*（killed）。一旦拷贝操作被杀死，我们就无法将其传播到程序的后续点。\n\
  \n在通往 *i* 的某些路径上，`x = y` 可能会出现多次。如果仅在*最后一次*出现后才被杀死，那么对其进行传播是不安全的。在下面的示例中，将 `Return(x)`\
  \ 重写为 `Return(2)` 是安全的：\n\n```\nx = 2\nx = foo()\nx = 2\nReturn(x)\n```\n\n如果存在通往\
  \ *i* 的多路径，我们感兴趣的 `Copy` 指令在这些任何路径上都不能被杀死。请看图 19-6，其中 `x = y` 在一条路径上被杀死，但在另一条路径上没有。\n\
  \n![](img/fig19-6.jpg)\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">图 19-6：一个到达拷贝沿一条路径被杀死的控制流图</samp>\
  \ <samp class=\"SANS_Futura_Std_Book_Oblique_I_11\">描述</samp\n\n如果我们跳过 `B1`，当我们到达\
  \ `B2` 中的 `Return` 指令时，`x` 和 `y` 将具有相同的值。但如果我们通过 `B1` 路径，它们的值就会不同。由于我们无法提前知道程序将走哪条路径，因此无法重写\
  \ `Return(x)`。\n\n让我们考虑最后一个边界情况。假设 `x = y` 之后是 `y = x`，且中间没有杀死：\n\n```\nx = y\n\
  --snip--\ny = x\nz = x + y\n```\n\n通常，更新 `y` 会杀死早的 `Copy` 指令。但在 `y = x` 之后，`x` 和\
  \ `y` 仍然具有相同的值。处理这种情况有多种正确的方法。一种方案是说 `y = x` 杀死 `x = y`，因此只有 `y = x` 到达了 `z = x\
  \ + y`。在这种情况下，我们将最后指令重写为 `z = x + x`。这可能允许我们在稍后的死存储消除阶段根据 `y = x` 移除 `y = x`。另一种方案是直接忽略\
  \ `y = x`，因为它没有影响；我们将采用第二种方案并消除该 `Copy`。第三种方案是在最终指令中传播*两个*拷贝，用 `x` 替换 `y`。这种替换是安全的，但并没有特别帮助，因为它无法帮助我们消掉其中任何一个。\n\
  \n如果一个 `Copy` 指令出现在通往 *i* 的每条路径上，并且它在这些任何路径上都未被杀死，我们就称它*到达*（reaches）了 *i*。在拷贝遍历开始时，我们将执行到达拷贝分析（reaching\
  \ copies analysis），以确定哪些拷贝到达了每条指令。然后，我们将使用该分析的结果来识别我们可以重写的指令。\n\n我们将在第一部分中定义的 TACKY\
  \ 子集上实现整个优化，然后将其扩展到处理第二部分中的新语言特性。\n\n#### 到达拷贝分析\n\n为了实现到达拷贝分析，我们将定义之前讨论的数据流分析的每个元素：传递函数（transfer\
  \ function）、汇操作符（meet operator）和迭代算法。本节中讨论的传递函数和汇操作符特定到达拷贝分析，而迭代算法适用于所有的正向数据流分析。\n\
  \n##### 传递函数\n\n传递函数接收到达基本块起始的所有拷贝指令，并计算哪些拷贝到达了块内的每条指令。它还计算哪些拷贝到达了最后指令之后的块末尾。这里的规则非常简单。首先，如果\
  \ *i* 是一个 `Copy` 指令，它到达紧随其后的指令。其次，如果某个 `Copy` 指令到达了 *i*，它也会到达 *i* 之后的指令，除非 *i* 杀死它。让我们来看一个例子。假设一个基本块包含列表\
  \ 19-12 中的指令：\n\n```\nx = a\ny = 10\nx = y * 3\nReturn(x)\n```\n\n\n\n\n假设有一条 `Copy`\
  \ 指令 `a = y` 到达了此基本块的开头。这条 `Copy` 将到达第一条指令 `x = a`。当我们遇到 `x = a` 时，我们将其添加到当前的到达拷贝（reaching\
  \ copies）集合中，因此 `a = y` 和 `x = a` 都到达了下一条指令 `y = 10`。因为下一条指令更新了 `y`，它杀死了（kills）了\
  \ `a = y`。因此，我们从到达拷贝集合中移除 `a = y`，但添加 `y = 10`。最后，`x = y * 3` 杀死 `x = a`。我们不会将 `x\
  \ = y * 3` 作为到达拷贝添加，因为它不是一条 `Copy` 指令。最后的 `Return` 指令既不添加也不删除任何到达拷贝。表 19-1 列出了该基本块中哪些拷贝到达了每条指令。\n\
  \n**表 19-1：到达列表 19-12 中每个指令的拷贝**\n\n| 指令 | 到达拷贝 |\n| :--- | :--- |\n| `x = a` |\
  \ `{a = y}` |\n| `y = 10` | `{a = y, x = a}` |\n| `x = y * 3` | `{x = a, y = 10}`\
  \ |\n| `Return(x)` | `{y = 10}` |\n| 块结束 | `{y = 10}` |\n\n当我们考虑具有静态存储周期的变量时，情况会变得复杂一些。如列表\
  \ 19-13 所示，这些变量可以在其他函数中更新。\n\n```c\nint static_var = 0;\n\nint update_var(void)\
  \ {\n    static_var = 4;\n    return 0;\n}\n\nint main(void) {\n    static_var =\
  \ 5;\n    update_var();\n    return static_var;\n}\n```\n*列表 19-13：多个函数访问同一个具有静态存储周期的\
  \ C 程序*\n\n我们的到达拷贝分析应该识别出 `main` 函数中对 `update_var` 的调用杀死了 `static_var = 5`。初看起来，这似乎只适用于局部变量，但如列表\
  \ 19-14 所示，它也会影响静态变量。\n\n```c\nint static_var = 0;\n\nint update_var(void) {\n \
  \   static_var = 4;\n    return 0;\n}\n\nint main(void) {\n    static_var = 5;\n\
  \    update_var();\n    return static_var;\n}\n```\n*列表 19-14：函数调用间接更新变量的 C 程序*\n\
  \n当我们分析 `f` 时，我们需要知道对 `update_var` 的调用可以更新 `total`。解决这个问题有两种方法。一种方案是确定哪些函数调用更新了哪些静态变量。这将到达拷贝分析变为过程间分析（interprocedural\
  \ analysis），即收集关于多个函数的信息。这种方法会迅速变得复杂。我们的另一种方案是假设每个函数调用都会更新每个静态变量。我们选择这个方案，因为它要简单得多。每当我们遇到函数调用时，都会杀死任何来自静态变量的拷贝。这种方法是保守的；它保证我们永远不会执行不安全的优化，但可能导致我们不必要的杀死某些到达拷贝并错过一些优化。相比之下，使用过程间分析是一种更激进的方法，因为它错过的优化更少。更激进的优化技术并不总是更好；它们通常以复杂性增加和编译时间变长为代价。列表\
  \ 19-15 提供了传递函数的伪代码。\n\n```python\ntransfer(block, initial_reaching_copies):\n \
  \   current_reaching_copies = initial_reaching_copies\n\n    for instruction in\
  \ block.instructions:\n      annotate_instruction(instruction, current_reaching_copies)\n\
  \        match instruction with\n        | Copy(src, dst) ->\n          if Copy(dst,\
  \ src) is in current_reaching_copies:\n                continue\n\n          for\
  \ copy in current_reaching_copies:\n            if copy.src == dst or copy.dst ==\
  \ dst:\n                current_reaching_copies.remove(copy)\n\n          current_reaching_copies.add(instruction)\n\
  \        | FunCall(fun_name, args, dst) ->\n            for copy in current_reaching_copies:\n\
  \              if (copy.src is static\n                    or copy.dst is static\n\
  \                    or copy.src == dst\n                    or copy.dst == dst):\n\
  \                    current_reaching_copies.remove(copy)\n        | Unary(operator,\
  \ src, dst) ->\n          for copy in current_reaching_copies:\n            if copy.src\
  \ == dst or copy.dst == dst:\n                current_reaching_copies.remove(copy)\n\
  \        | Binary(operator, src1, src2, dst) ->\n            // same as Unary\n\
  \            --snip--\n        | _ -> continue\n\n  annotate_block(block.id, current_reaching_copies)\n\
  ```\n*列表 19-15：到达拷贝分析的传递函数*\n\n\n\n\n为了处理一条指令，我们首先会记录到达该指令执行前一个点的副本集合 ❶。（我们稍后会在实际重写指令时引用这些信息。）然后，我们将检查指令本身，以计算哪些副本到达了该指令执行后的一个点。在\
  \ `x = y` 到达 `y = x` 的特殊情况下，我们不会添加或移除任何到达的副本 ❷。正如我们之前看到的，`y = x` 不产生任何影响，因为 `x`\
  \ 和 `y` 已经具有相同的值。否则，我们将处理 `Copy` 指令 `x = y`，即杀死任何指向 `x` 或源自 `x` 的副本 ❸，然后将 `x = y`\
  \ 添加到到达副本集中 ❹。\n\n当我们遇到 `FunCall` 指令时，我们将杀死任何指向或源自具有静态存储持续变量的副本，以及指向或源自 `dst`（将保存函数调用结果的变量）的副本\
  \ ❺。来自第一部分中用于更新变量的另外两个指令是 `Unary` 和 `Binary`。为了处理其中任何一种，我们将杀死任何指向或源自其目的地的副本 ❻。来自第一部分的其余\
  \ TACKY 指令（如 `Jump`、`Return` 和 `Label`）不会添加或杀死任何到达的副本。在处理每条指令后，我们将记录哪些副本到达了块的末尾\
  \ ❼。\n\n### Meet 运算符\n\n接下来，我们将实现 meet 操作符，它将到达副本的信息从一个块传播到另一个块。该操作符计算传递给函数的初始到达副本集合。回，只有当一个副本在到达该点的*所有*路径上出现且未被杀死时，它才到达该点。因此，一个副本到达块的开头，仅当当它到达了所有前驱块的末尾。换句话说，我们只需取每个前驱块结果的交集。列表\
  \ 19-16 提供了 meet 操作的伪代码。\n\n```\nmeet(block, all_copies):\n  ❶ incoming_copies =\
  \ all_copies\n  for pred_id in block.predecessors:\n      match pred_id with\n \
  \     ❷ ENTRY -> return {}\n      | BlockId(id) ->\n          ❸ pred_out_copies\
  \ = get_block_annotation(pred_id)\n          incoming_copies = intersection(incoming_copies,\
  \ pred_out_copies)\n      | EXIT -> fail(\"Malformed control-flow graph\")\n\nreturn\
  \ incoming_copies\n```\n\n#### 列表 19-16：用于到达副本的 meet 运算符\n\nmeet 操作接收两个参数。第一个是我们要计算其到达副本的块。第二个参数\
  \ `all_copies` 是函数中出现 `Copy` 指令的集合。我们将到达副本集初始化为该值 ❶，因为它是集合交运算的*单位元*。也就是说，对于任何到达副本集合\
  \ *S*，*S* 与 `all_copies` 的交集就是 *S*。\n\n接下来，我们遍历块的前驱，这些前驱可能包括其他基础块、`ENTRY` 节点或两者兼有。没有副本能到达函数的正起点，因此如果我们在前驱列表中找到\
  \ `ENTRY`，则直接返回空集 ❷。（空集与任何内容的交集仍然是空集，因此无需查看该块的其他前驱。）否则，我们查找到达每个前驱块末尾的副本集 ❸（这是我们在列表\
  \ 19-15 末尾记录的），并取 `incoming_copies` 与这些集合中的每一个的交集。\n\n有一个边界情况需要考虑。如果禁用了不可达代码消除，我们正在分析的块可能没有任何前驱。对没有前驱的块调用\
  \ `meet` 将返回 `all_copies`，因此我们假设每个可能的 `Copy` 指令都到达了块的开头。我们不在乎这最终如何影响该块本身（因为它永远不会执行）。我们*确实*关心这如何影响该块的后继，因为后继可能是可达的。例如，如果可达块\
  \ `A` 和不可达块 `B` 都跳转到块 `C`，那么块 `C` 就是可达的。\n\n幸运的是，我们的分析仍然是安全的。`A` 的真实结果与来自 `B` 的垃圾结果的交集，始终是从\
  \ `A` 达 `C` 的副本子集；这是对启用不可达代码消除并完全删除 `B` 所得结果的保守近似。\n\n### 迭代算法\n\n一旦我们知道了前驱块的结果，就可以使用\
  \ meet 操作符和传递函数来分析基础块。现在，我们将所有内容整合起来并分析整个函数。只有一个问题：控制流图可能包含循环！在分析完所有前驱之前，我们无法分析某个块，这要求我们分析它们的所有前驱，以此此类推。一旦遇到循环，我们似乎被困住了；我们无法分析循环中的任何块，因为每个块都直接或间接地先于它自身。\n\
  \n\n\n这就是基本思想；现在让我们付诸实践。首先，我们将为每个基本块（basic block）标注函数中所有 `Copy` 指令集合。正如我们之前学到的，这个集合是我们的汇合操作（meet\
  \ operator）的恒等元。用恒等元初始化每个块，可以确保我们尚未分析的块不会改变汇合操作的结果。让我们在图 19-7 中的控制流图上尝试这种方法。\n\n\
  ![](img/fig19-7.jpg)\n\n图 19-7：一个带有循环的控制流图 描述\n\n该控制流图包含两个 `Copy` 指令：`y = 3` 和 `y\
  \ = 4`。我们最初将为每个块标注包含这两个拷贝操作的集合。然后，我们将按顺序分析这些块。由于 `B0` 的唯一前驱是 `ENTRY`，我们只需通过一次遍历即可出\
  \ `B0` 的最终结果。图 19-8 展示了我们在处理 `B0` 后每个块的标注情况。\n\n![](img/fig19-8.jpg)\n\n图 19-8：对图\
  \ 19-7 进行到达拷贝分析的临时结果，在处理 B0 后 描述\n\n此时，`B0` 上的标注是正确的：只有 `y = 3` 到达了该块的末尾。另外两个块仍然标注了所有拷贝。接下来，我们将应用汇合操作来查看哪些拷贝到达了\
  \ `B1` 的起始。该块有两个前驱：`B0` 和自身。因此，我们将 `{y = 3}` 和 `{y = 3, y = 4}` 取交集，结果为 `{y = 3}`。这与\
  \ `B0` 是 `B1` 唯一前驱时得到的结果相同。这正是我们想要的行为：因为我们还没有分析 `B1`，它不应该对汇合操作的结果产生贡献。一旦对 `B1` 应用传递函数（transfer\
  \ function），我们将发现只有 `y = 4` 到达了该块的末尾。随后，我们就拥有处理 `B2` 需要的所有信息。图 19-9 展示了在分析 `B1`\
  \ 和 `B2` 后每个块的标注。\n\n![](img/fig19-9.jpg)\n\n图 19-9：分析每个基本块后到达拷贝分析的临时结果 描述\n\n现在每个块都拥有正确的到达拷贝集合。但我们还没有得到\
  \ `B1` 中每条指令的正确答案。（图 19-8 和 19-9](#chapter19.xhtml_fig19-9) 未显示单个指令的标注）。当我们上次分析\
  \ `B1` 时，我们假设 `y = 3` 到达了块的起始，这意味着它也到达了 `x = process(y)`。现在我们有了更准确的信息，需要再次分析 `B1`。这次，汇合操作将对\
  \ `{y = 3}` 和 `{y = 4}` 取交集，结果为空集。我们将此结果传递给传递函数，以重新计算 `B1` 中单个指令的结果。这一次，我们将正确地得出没有\
  \ `Copy` 指令到达 `x = process(y)`（或者说没有到达块中 `y = 4` 之前的任何点）。\n\n现在我们已经看到了迭代算法的运行过程，让我们来实现它。列表\
  \ 19-17 给出了该算法的伪代码。\n\n```\nfind_reaching_copies(graph):\n\n    all_copies = find_all_copy_instructions(graph)\n\
  \    worklist = []\n\n    for node in graph.nodes:\n        if node is EntryNode\
  \ or ExitNode:\n            continue\n      ❶ worklist.append(node)\n        annotate_block(node.id,\
  \ all_copies)\n\n    while worklist is not empty:\n      ❷ block = take_first(worklist)\n\
  \        old_annotation = get_block_annotation(block.id)\n        incoming_copies\
  \ = meet(block, all_copies)\n        transfer(block, incoming_copies)\n      ❸ if\
  \ old_annotation != get_block_annotation(block.id):\n            for successor_id\
  \ in block.successors:\n                match successor_id with\n              \
  \  | EXIT -> continue\n                | ENTRY -> fail(\"Malformed control-flow\
  \ graph\")\n                | BlockId(id) ->\n                    successor = get_block_by_id(successor_id)\n\
  \                    if successor is not in worklist:\n                        worklist.append(successor)\n\
  ```\n\n列表 19-17：到达拷贝分析的迭代算法\n\n我们将维护一个需要处理的基本块工作列表（worklist），包括在更新了其中一个前驱后需要重新访问的块。在该算法的初始设置中，我们将每个基本块添加到工作列表中\
  \ ❶，因为我们至少需要分析每个块一次。我们还将用函数中出现的所有 `Copy` 指令集合来初始化每个块。\n\n\n\n\n接下来，我们进入主处理循环，我们将从工作列表头部移除一个块\
  \ ❷，然后使用汇并运算符（meet operator）和传递函数（transfer function）对其进行分析。如果此分析更改了该块导出的到达拷贝（reaching\
  \ copies），我们将它的所有后继节点添加到工作列表中，以便我们使用这些新结果重新分析它们 ❸。如果某个后继节点已经在工作列表中，我们就不需要再次添加它。我们将重复这一过程，直到工作列表为空。\n\
  \nListing 19-17 适用于任何正向数据流分析。只有传递函数、汇并运算符以及用于初始化每个基本块的单位元素会有不同。\n\n### 重写 TACKY\
  \ 指令\n\n在运行到达拷贝分析后，我们将寻找 `TACKY` 函数中每条指令的重写机会，甚至是删除机会。要重写一条指令，我们将检查到达该指令的拷贝是否定义了它的任何操作数。如果是这样，我们将这些操作数替换为它们的值。如果我们遇到一个形式为\
  \ `x = y` 的 `Copy` 指令，且其到达拷贝包含 `x = y` 或 `y = x`，我们将直接删除它而不是尝试重写；如果 `x` 和 `y` 已经具有相同的值，则该指令没有影响。Listing\
  \ 19-18 展示了如何处理每条指令。\n\n```\nreplace_operand(op, reaching_copies):\n    if op is\
  \ a constant:\n        return op\n\n    for copy in reaching_copies:\n        if\
  \ copy.dst == op:\n            return copy.src\n    return op\n\nrewrite_instruction(instr):\n\
  \  ❶ reaching_copies = get_instruction_annotation(instr)\n    match instr with\n\
  \    | Copy(src, dst) ->\n        for copy in reaching_copies:\n          ❷ if (copy\
  \ == instr) or (copy.src == dst and copy.dst == src):\n                return null\n\
  \      ❸ new_src = replace_operand(src, reaching_copies)\n        return Copy(new_src,\
  \ dst)\n    | Unary(operator, src, dst) ->\n        new_src = replace_operand(src,\
  \ reaching_copies)\n        return Unary(operator, new_src, dst)\n    | Binary(operator,\
  \ src1, src2, dst) ->\n        new_src1 = replace_operand(src1, reaching_copies)\n\
  \        new_src2 = replace_operand(src2, reaching_copies)\n        return Binary(operator,\
  \ new_src1, new_src2, dst)\n    | --snip--\n```\n\nListing 19-18: 基于到达拷贝分析结果重写指令\n\
  \n给定到达当前指令的拷贝集，`replace_operand` 将单个 TACKY 操作数替换为其值。如果该操作数是常量，或者我们无法找到赋值给它的到达拷贝，我们只需返回原始值。\n\
  \n在 `rewrite_instruction` 中，我们首先查找到达当前指令 `instr` 的拷贝集 ❶。如果 `instr` 是一个 `Copy` 指令，我们将在该集合（我们称之为\
  \ `reaching_copies`）中搜索从其源到目的地或反之的拷贝 ❷。如果我们找到了，则 `instr` 的操作数已经具有相同的值，因此我们可以将其删除。（Listing\
  \ 19-18 返回 `null` 以表示我们应该删除该指令；你的代码可能会以不同的方式表示这一点。）否则，我们尝试使用 `replace_operand` ❸\
  \ 替换指令的源操作数。我们将尝试相同的方法替换其他 TACKY 指令的源操作数。Listing 19-18 展示了如何重写 `instr` 中的源操作数。\n\
  \n此时，你已经有了一个使用到达拷贝分析进行优化的完整传播遍历。如果你跳过了 Part II，你可以直接进入这一节。但如果你已经完成了 Part II，你仍然有一些工作要完成。\n\
  \n### 支持 Part II 的 TACKY 程序\n\n为了让拷贝传播适用于我们生成的 TACKY 代码，我们需要解决几个问题。第一个问题是，我们有时使用\
  \ `Copy` 指令执行类型转换。我们不希望在符号类型和无符号类型之间传播拷贝，因为我们有时会对符号值和无符号值的操作生成不同的汇编代码。如果在比较中将符号值替换为无符号值，我们最终会为其生成错误的条件码。我们的到达拷贝分析将认为符号和无符号之间的任何\
  \ `Copy` 都是类型转换，而不是普通的拷贝操作。我们不会在传递函数将其作为到达拷贝添加，也不会在迭代开始开始将其包含在初始到达拷贝集中。\n\n> 另一种解决方案是为比较、取余和除法引入独立的符号和无符号\
  \ TACKY 运算符，这样在代码生成期间我们就不需要检查操作数的类型来区分这些情况了。LLVM IR 使用这种方法。\n\n第二个问题是变量可以通过指针进行更新。这些更新很难分析。如果我们看到指令\
  \ `Store(v, ptr)`，我们不知道 `ptr` 指向哪个对象，因此不知道要杀掉（kill）哪些拷贝。这与我们在静态变量上遇到的问题类似，静态变量可以在其他函数中更新。为了解决这个问题，我们将找到所有可以通过指针访问的变量（这些被称为*别名变量*，aliased\
  \ variables）。我们假设每条 `Store` 指令都会更新这些变量中的每一个。我们假设函数调用也会更新这些变量，因为可以在一个函数中声明变量，然后在另一个函数中通过指针对其更新。让我们使用这种方法分析\
  \ Listing 19-19。\n\n```\nfunction_with_pointers():\n    x = 1\n    y = 2\n    z\
  \ = 3\n    ptr1 = GetAddress(x)\n    Store(10, ptr1)\n    ptr2 = GetAddress(y)\n\
  \    z = x + y\n    Return(z)\n```\n\nListing 19-19: 一个通过指针更新变量的 TACKY 函数\n\n\n\n\
  \n\n首先，我们将识别 `function_with_pointers` 中的别名变量。`x` 和 `y` 都是别名变量，因为它们都被使用在 `GetAddress`\
  \ 指令中。（假设此列表中的没有任何变量是静态的，因此我们不需要担心其他函数是否获取了它们的地址。）接下来，我们将运行到达拷贝分析（reaching copies\
  \ analysis）。由于整个函数体是一个基本块，我们可以直接将传递函数应用到整个块体上。我们将像往常一样，向到达拷贝集中添加 `x = 1`、`y = 2`\
  \ 和 `z = 3`。然后，当我们到达 `Store` 指令时，我们会杀死（kill）两个别名变量 `x` 和 `y` 的拷贝。表 19-2 描述了函数中哪些拷贝会到达每条指令。\n\
  \n**表 19-2：** 列表 19-19 中到达每条指令的拷贝\n\n| 指令 | 到达的拷贝 |\n| --- | --- |\n| `x = 1` |\
  \ {} |\n| `y = 2` | {x = 1} |\n| `z = 3` | {x = 1, y = 2} |\n| `ptr1 = GetAddress(x)`\
  \ | {x = 1, y = 2, z = 3} |\n| `Store(10, ptr1)` | {x = 1, y = 2, z = 3} |\n| `ptr2\
  \ = GetAddress(y)` | {z = 3} |\n| `z = x + y` | {z = 3} |\n| `Return(z)` | {} |\n\
  | 块结束 | {} |\n\n我们正确地识别出 `Store` 指令可能会覆盖 `x`，这意味着我们不能在 `z = x + y` 中将 `x` 替换为 `1`。我们同样假设\
  \ `Store` 指令可能会覆盖 `y`，这意味着我们不能在 `z = x + y` 中将 `y` 替换为 `2`。\n\n### 实现取地址分析\n\n我们刚刚使用的用于识别别名变量的方法被称为*取地址分析*（address-taken\
  \ analysis）。为了执行此分析，我们将检查每条指令，并识别每个具有静态生存期或地址被 `GetAddress` 指令获取的变量。（假设此列表中的没有任何变量是静态的，因此我们不需要担心其他函数是否获取了它们的地址。）列表\
  \ 19-20 展示了它是如何融入列表 19-6 的。\n\n```\noptimize(block, initial_reaching_copies, aliased_vars):\n\
  \    current_reaching_copies = initial_reaching_copies\n\n    for instruction in\
  \ block.instructions:\n        annotate_instruction(instruction, current_reaching_copies)\n\
  \        match instruction with\n        | Copy(src, dst) ->\n            --snip--\n\
  \            if (get_type(src) == get_type(dst)) or (signedness(src) == signedness(dst)):\n\
  \                current_reaching_copies.add(instruction)\n        | FunCall(fun_name,\
  \ args, dst) ->\n            for copy in current_reaching_copies:\n            \
  \    if (copy.src is in aliased_vars\n                    or copy.dst is in aliased_vars\n\
  \                    or (dst is not null and (copy.src == dst or copy.dst == dst))):\n\
  \                    current_reaching_copies.remove(copy)\n        | Store(src,\
  \ dst_ptr) ->\n            for copy in current_reaching_copies:\n              \
  \  if (copy.src is in aliased_vars) or (copy.dst is in aliased_vars):\n        \
  \            current_reaching_copies.remove(copy)\n        | Unary(operator, src,\
  \ dst) or any other instruction with dst field ->\n            --snip--\n      \
  \  | _ -> continue\n\n    annotate_block(block.id, current_reaching_copies)\n```\n\
  \n取地址分析只是*别名分析*（alias analysis）的一种，也称为*指针分析*（pointer analysis），它试图确定两个指针或变量是否指向同一个对象。例如，它们可以确定在列表\
  \ 19-19 中 `ptr1` 永远不会指向 `y`。大多数指针分析算法都比取地址分析更强大。\n\n### 更新传递函数\n\n接下来，我们将扩展传递函数，以支持我们在第二部分中添加的新类型和新指令。列表\
  \ 19-21 展示了我们新且改进的传递函数。它重现了列表 19-15，并对更改部分进行了加粗处理。\n\n```python\n# (上述描述逻辑的示例表示)\n\
  x = 1\ny = 2\nz = 3\nptr1 = GetAddress(x)\nStore(10, ptr1) # 杀死 x 的拷贝\nptr2 = GetAddress(y)\n\
  z = x + y\nReturn(z)\n```\n\n\n\n\n我们已经触及了列表中的大多数更改。在向 `current_reaching_copies`\
  \ 添加 `Copy` 指令之前，我们将确保它的源操作数和目标操作具有相同的类型，或者至少具有相同符号性（signedness）的类型。`signedness`\
  \ 辅助函数应该将 `char` 视为有符号类型，将所有指针类型视为无符号类型，这样我们就可以在 `char` 和 `signed char` 之间、不同指针类型之间、以及指针与\
  \ `unsigned long` 之间传播拷贝。（（符号性的概念不适用于 `double` 或非标量类型。这没关系，因为我们不使用 `Copy` 指令在这些类型之间进行转换。如果\
  \ `Copy` 使用 `double` 或非标量操作数，则两个操作数将具有相同的类型，因此我们不需要检查它们的符号性。）\n\n当我们遇到函数调用或 `Store`\
  \ 指令时，我们将杀死任何指向别名变量（aliased variables）或来自变量的拷贝。我们还会考虑到函数调用可能没有目标操作数的情况。请注意，我们不会杀死\
  \ `Store` 指令的 `dst_ptr` 操作数。`Store` 不改变目标指针本身的值，只改变它所指向的对象的值。最后，当我们遇到在 [Part II]\
  \ 中添加的任何其他指令（包括类型转换、`CopyToOffset` 和 `CopyFromOffset`）时——我们将杀死指向其目标或来自其目标的拷贝。我们不会跟踪指向结构或数组内部单个子对象的拷贝，因此\
  \ `CopyToOffset` 和 `CopyFromOffset` 将杀死到达的拷贝而不产生任何新拷贝。\n\n### 更新 rewrite_instruction\n\
  \n我们将以与第一部分指令相同的方式重写第二部分中的大多数新 TACKY 指令，替换任何由到达拷贝所定义的源操作数。唯一的例外是 `GetAddress`，我们永远不会重写它。对\
  \ `GetAddress` 应用拷贝传播是没有意义的，因为它使用的是其源操作数的地址而不是其值。\n\n### 死存储消除 (Dead Store Elimination)\n\
  \n我们的最后一次优化是死存储消除。我们将使用活跃性分析（liveness analysis），这是一种反向数据流分析，来计算正在优化的函数中每个点哪些变量是活跃的（live）。然后，我们将利用该分析的结果来识别并消除死存储。\n\
  \n如果一个变量在特定点的值在程序之后可能被读取，则它在该点是*活跃的*（live）。否则，它是*死的*（dead）。更准确地说，当满足以下两个条件时，变量 `x`\
  \ 在任意点 `p` 是活跃的：首先，必须存在从 `p` 到某个使用 `x` 的后续指令的路径。我们说任何使用 `x` 的指令都生成（generate）了 `x`。其次，从\
  \ `p` 到该后续指令的路径上 `x` 不能被更新。我们说任何更新 `x` 的指令都杀死（kill）了 `x`，就像到达拷贝在更新时会被杀死一样。（在大多数数据流分析中你都会看到\
  \ *generate* 和 *kill* 这两个术语。考虑图 19-10 中的控制流。）\n\n#### 图 19-10：x 在定义后立即变为活跃的控制流图\n\
  \n从 `x = 10` 到 `EXIT` 有两条路径。通过 `B` 的路径上，`x` 从未被使用。在通过 `B` 的路径上，`x` 在 `Return` 指令中使用。我们知道\
  \ `x` 在 `x = 10` 之后点是活跃的，因为在其中一条路径上生成了它。同样的逻辑，`x` 在 `B` 的结束处、`B` 的开头以及 `B` 中 `Return`\
  \ 指令之前也是活跃的。另一方面，`x` 在 `B` 的结束处以及 `B` 中的每个点都是死的，因为从这些点没有通往使用 `x` 的指令的路径。注意，`x` 在\
  \ `B` 的最开始也是死的，因为在 `x = 10` 为其分配新值之前，我们没有使用过它的（未初始）值。\n\n现在让我们来看图 19-11 中的控制流图。\n\
  \n#### 图 19-11：一个对 x 有死存储的控制流图\n\n```\n![](images/fig19-11.jpg\n```\n\n\n\n再次，我们从\
  \ `x = 10` 到 `EXIT` 有两条路径。这两条路径都通过使用 `x` 的 `Return` 指令，但在两条路径上，`x` 在 `x = 10` 和生成它的\
  \ `Return` 指令之间被杀死了。这意味着 `x` 在 `x = 10` 之后立即是死的。在这个控制流图中，它只在两个点是活的：`B1` 中 `x = f()`\
  \ 之后以及 `B2` 中 `x = g()` 之后。\n\n如果一条指令给一个死变量赋值且没有其他副作用，那么该指令就是一个“死赋值”（dead store）。因此，`x\
  \ = 10` 在图 19-11 中是一个死赋值，但在图 19-10 中不是。注意，我们关心的是变量在指令*之后*是否是死的，而不是在指令之前。在代码片段中：\n\
  \n```\nx = x + 1\nReturn(0)\n```\n\n`x` 在 `x = x + 1` 之前是活的，但在之后是死的。`x` 在我们更新它之后立即死的这一事实意味着这条指令是一个死赋值，因此我们可以将其消除。\n\
  \n### 活跃性分析 (Liveness Analysis)\n\n像所有的数据流分析一样，活跃性分析需要一个传递函数、一个汇合运算符（meet operator）和一个迭代算法。由于这是一个反向流问题，传递函数将从基本块的结束开始直到开头，而不是像我们在到达复制分析中那样从开始到结束。同样，汇合运算符将从块的后继节点收集信息，而不是前驱节点。我们还将使用一种略有不同的迭代算法通过控制流图反向传递数据。让我们仔细观察这些每一个部分。\n\
  \n### 传递函数\n\n传递函数获取基本块结束时的活变量集合，并计算出每条指令之前哪些变量是活的。正如我们在图 19-10 和 19-11 中所示，指令会生成它读取的任何变量，并杀死它更新的任何变量。例如，为了计算指令\
  \ `x = y * z` 之前的活变量，我们将取指令之后的活变量集合，加上 `y` 和 `z`，并移除 `x`。如果一条指令读取并写入同一个变量，它会生成该变量而不是杀死它。例如，`x\
  \ = x + 1` 生成 `x`。\n\n让我们将传递函数应用于列表 19-22 中的基本块。\n\n```\nx = 4\nx = x + 1\ny = 3\
  \ * x\nReturn(y)\n```\n\n*列表 19-22: 一个基本块*\n\n传递函数将从该块的底部开始并向上移动。假设在块的结束、`Return`\
  \ 指令之后没有活变量（如果函数处理静态变量，这个假设可能不成立，我们稍后考虑）。当我们处理 `Return` 指令时，我们将 `y` 添加到活变量集合中。然后，`y\
  \ = 3 * x` 会杀死 `y` 并生成 `x`。下一条指令 `x = x + 1` 生成 `x`，因为 `x` 已经是活的。最后，`x = 4` 会杀死\
  \ `x`，使得块开头开头没有活变量。[表 19-3] 总结了列表 19-22 中指令之后哪些变量是活的。\n\n*表 19-3: 列表 19-22 中指令后的活变量*\n\
  \n| 指令 | 活变量 |\n| :--- | :--- |\n| 块开始 | {} |\n| x = 4 | x |\n| x = x + 1 | x |\n\
  | y = 3 * x | y |\n| Return(y) | {} |\n\n静态变量增加了情况的复杂性，就像在到达复制分析期间一样。我们不知道其他函数将如何与我们遇到的任何静态变量交互；它们可能读取它们、更新它们或两者兼有。我们将假设每个函数都读取每个静态变量。这个假设是保守的，因为它防止了我们消除对这些变量的早期写入。列表\
  \ 19-23 提供了传递函数的伪代码。\n\n```\ntransfer(block, end_live_variables, all_static_variables):\n\
  \  ❶ current_live_variables = end_live_variables\n\n  ❷ for instruction in reverse(block.instructions):\n\
  \      ❸ annotate_instruction(instruction, current_live_variables)\n\n        match\
  \ instruction with\n        | Binary(operator, src1, src2, dst) ->\n           \
  \ current_live_variables.remove(dst)\n            if src1 is a variable:\n     \
  \           current_live_variables.add(src1)\n            if src2 is a variable:\n\
  \                current_live_variables.add(src2)\n        | JumpIfZero(condition,\
  \ target) ->\n            if condition is a variable:\n                current_live_variables.add(condition)\n\
  \        | --snip--\n        | FunCall(fun_name, args, dst) ->\n            current_live_variables.remove(dst)\n\
  \            for arg in args:\n                if arg is a variable:\n         \
  \           current_live_variables.add(arg)\n          ❹ current_live_variables.add_all(all_static_variables)\n\
  \n  ❺ annotate_block(block.id, current_live_variables)\n```\n\n*列表 19-23: 活跃性分析的传递函数*\n\
  \n\n\n\n我们将从在块 ❶ 结束时活跃（live）的变量集开始，然后反序处理指令列表 ❷。我们为每条指令标注在其执行后恰刻活跃的变量集 ❸；稍后我们用使用此标注来确定该指令是否为死存赋值（dead\
  \ store）。然后，我们计算在指令执行之前哪些变量是活跃的。如果指令有目标操作（destination），则将其杀死（kill），然后添加它读取的每个变量。Listing\
  \ 19-23 包含了处理 `Binary` 指令的伪代码，该指令更新一个操作数并读取另外两个操作数；以及 `JumpIfZero` 指令，它读取一个操作数但不更新任何内容。我们省略了处理大多数其他指令的伪代码，因为它们遵循相同的模式。`FunCall`\
  \ 是一个特殊情况；我们将像往常一样杀死它的目标操作并添加它的参数，但我们还会添加每一个静态变量 ❹。最后，我们将使用第一条指令执行前活跃的变量对整个块进行标注\
  \ ❺。合并运算符（meet operator）稍后将使用这些信息。\n\n计算 `all_static_variables` 有几种方法。一种方案是在开始死存赋值消除之前扫描此\
  \ TACKY 函数并寻找静态变量。另一种方案是扫描整个符号表以寻找静态变量，而无需担心哪些变量出现在哪些函数中。在这里添加多余的静态变量并无害，因为它们不会改变我们最终删除的指令。\n\
  \n### 合并运算符（The Meet Operator）\n\n合并运算符计算基本块结束时哪些变量是活跃的。为了找到某个块 `B` 结束时的活跃变量，我们将查看所有的后继节点。如果一个变量在至少一个后继节点的开始处是活跃的，那么它在\
  \ `B` 结束时也一定是活跃的，因为存在至少一条路径从 `B` 的结束通过该后继节点到达生成该变量的指令。基本上，我们将所有后继节点起始活跃变量取并。\n\n\
  我们假设每个静态变量在 `EXIT` 节点都是活跃的。其他函数或当前函数的其他调用可能会读取这些变量。具有自动存储期的变量在 `EXIT` 处都是死的，因为在我们离开函数后就无法访问它们了。Listing\
  \ 19-24 中的伪代码定义了合并运算符。\n\n```\nmeet(block, all_static_variables):\n    live_vars\
  \ = {}\n    for succ_id in block.successors:\n        match succ_id with\n     \
  \   | EXIT -> live_vars.add_all(all_static_variables)\n        | ENTRY -> fail(\"\
  Malformed control-flow graph\")\n        | BlockId(id) ->\n            succ_live_vars\
  \ = get_block_annotation(succ_id)\n            live_vars.add_all(succ_live_vars)\n\
  \n    return live_vars\n```\n\n*Listing 19-24: 活跃性分析的合并运算符*\n\n在到达复制分析（reaching\
  \ copies analysis）中，我们寻找在通往某点的每条路径上都出现的复制，因此我们使用集合交集作为合并运算符。在活跃性分析中，我们想知道一个变量是否在从某点的*任何*路径上被使用，因此我们使用集合并集。这与一个分析是正向的而另一个是反向的无关。某些正向分析使用并集是因为它们关心是否至少有一条到达某点的路径具有某些属性。某些反向分析使用交集是因为它们关心从某点的每条路径是否具有某些属性。其他更复杂的分析不使用并集或交集，而是使用完全不同的合并运算符。\n\
  \n### 迭代算法（The Iterative Algorithm）\n\n最后，我们将实现活跃性分析的迭代算法。它与 Listing 19-17 中的迭代算法有几处不同。首先，当块上的标注发生变化时，我们将前驱节点而非后继节点添加到工作列表（worklist）中。其次，我们将使用不同的初始块标注。记得每个块的初始标注应该是合并运算符的单位元。由于我们的合并运算符是集合并集，因此初始标注是空集。随着我们分析从块到程序中后续地点的更多路径，我们将向该集合中添加更多活跃变量。\n\
  \n我不会提供反向算法的伪代码，因为它与正向算法非常相似。但我会给你一些关于如何实现它的建议。首先，你可能想以后序（postorder）初始化工作列表。（记住，你通过执行深度优先遍历并在访问每个节点的后继节点后访问该节点来按后序对图的节点排序。）这使得反向算法终止得更快，就像在反后序中初始化工作列表有助于正向算法一样。我的第二个建议是让你的代码可复用。在下一章中，我们将再次实现活跃性分析，这次针对汇编。合并运算符和传递函数的细节会改变，但迭代算法不会。\n\
  \n#### 死存赋值（Removing Dead Stores）\n\n在运行活跃性分析之后，我们将找到 TACKY 函数中的任何死存赋值并删除它们。如果一条指令的目标在我们执行它后立即变为死的，那么它就是一个死存赋值，如下例：\n\
  \n```\nx = 1\nx = 2\n```\n\n活跃性分析将告诉我们 `x` 在 `x = 1` 之后是死的，使得该指令可以删除。我们永远不会删除函数调用，即使它们更新了死的变量，因为它们可能有其他的副作用。我们也不会删除没有目标的指令，例如\
  \ `Jump` 和 `Label`。Listing 19-25 展示了如何识别死存赋值。\n\n```\nis_dead_store(instr):\n  \
  \  if instr is FunCall:\n        return False\n\n    if instr has a dst field:\n\
  \        live_variables = get_instruction_annotation(instr)\n        if instr.dst\
  \ is not in live_variables:\n            return True\n\n    return False\n```\n\n\
  *Listing 19-25: 识别死存赋值*\n\n\n\n为了更新转移函数，我们需要思考每条新指令可能会生成或杀死（kill）哪些存活变量。类型转换指令（如\
  \ `Truncate` 和 `SignExtend`）是直接的。每个指令都会生成其源操作数并杀死其目标，这与我们已经处理的 `Copy` 和 `Unary`\
  \ 指令类似。`AddPtr` 也遵循通常模式：它同时生成两个源操作数并杀死其目标。\n\n对指针和聚合类型的操作要复杂得多。指针引起与它们在可达拷贝分析（reaching\
  \ copies analysis）中产生的问题相同：当我们通过指针读取或写入时，我们无法确定访问的是哪个底层对象。当不确定时，我们应该采取保守态度，假设变量是存活的。因此，通过指针读取应该生成每一个别名变量，但通过指针写入不应杀死其中任何一个。我们对聚合变量也采用类似的方法：读取聚合变量的一部分会生成该变量，但更新它的部分则不会杀死它。我将不再提供更新后的转移函数伪代码；既然我们已经涵盖了关键点，将让你们自己处理剩下的细节。汇操作符（meet\
  \ operator）不会改变；特别是，静态变量在 `EXIT` 处仍然是存活，但其他别名变量不是，因为它们的生命周期在函数返回时就结束了。\n\n最后，让我们更新此优化的最后一步，即使用活跃性分析的结果来寻找并消除死代码存储（dead\
  \ stores）。我们永远不会消除 `Store` 指令，因为我们不知道它的目标是否是死代码。即使当前函数中的每一个变量都是死代码，一个 `Store` 可能仍然具有可见的副作用。例如，它可能会更新定义在另一个函数中的对象，如下例：\n\
  \n```\nupdate_through_pointer(param):\n    Store(10, param)\n    Return(0)\n```\n\
  \n在 `Store` 指令之后，`update_through_pointer` 中没有存活变量。但该指令显然不是死代码存储；它更新了一个我们的分析没有追踪但随后可能在程序中被读取的对象。\n\
  \n识别死代码存储的通常逻辑适用于来自第二部分 的所有其他指令，包括 `Load`、`GetAddress`、`CopyToOffset` 和 `CopyFromOffset`。\n\
  \n### 总结\n\n在本章中，你实现了四种重要的编译器优化：常量折叠、不可达代码消除、拷贝传播和死存储消除。你学习了这些优化如何协同工作以转换程序的 TACKY\
  \ 表示，从而产生比你的编译器之前产生的更小、更快、更简单的汇编代码。你还学习了如何构建控制流图并执行数据流分析。这些技术是许多不同优化的基础，而不仅仅是本章涵盖的这些。如果你想自己实现更多\
  \ TACKY 优化，你已经有了充分准备。\n\n在下一章中，你将编写一个寄存器分配器。你将使用图染色算法将伪寄存器映射到硬件寄存器，并在图染色失败且寄存器用尽时学习如何溢出（spill）寄存器。你还将使用一种名为寄存器合并（register\
  \ coalescing）的技术来清理汇编代码中许多不必要的 `mov` 指令。在章节结束时，你的汇编程序看起来仍然不像生产级编译器生成的，但会接近得多。\n\n\
  ### 额外资源\n\n本节列出了我在编写本章时参考的资源，并按主题分类。\n\n#### 编译器优化的安全性影响\n\n- Zhaomo Yang 等人的论文《Dead\
