  \ Assignment(exp, exp)\n    | Conditional(exp condition, exp, exp)\n    | FunctionCall(identifier,\
  \ exp* args)\n```\n\n函数调用的 AST 节点包含函数名和参数列表。每个参数都是一个表达式。\n\n接下来，我们将重构 `declaration`\
  \ 节点，使其表示函数声明或变量声明：\n\n```\ndeclaration = FunDecl(function_declaration) | VarDecl(variable_declaration)\n\
