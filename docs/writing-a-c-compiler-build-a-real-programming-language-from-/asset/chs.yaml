  ``` |\n| 带有非零初始化器的整数，或任何 `double` | ```assembly\n<global>\n   .data\n    <alignment-directive>\n\
  <name>:\n    <init>\n``` |\n| `StaticConstant(name, alignment, init)` Linux | ```assembly\n\
  .section .rodata\n    <alignment-directive> \n<name>:\n    <init>\n``` |\n| macOS\
  \ (8 字节对齐常数) | ```assembly\n.literal8\n    .balign 8 \n<name>:\n    <init>\n```\
  \ |\n| macOS (16 字节对齐常数) | ```assembly\n.literal16\n    .balign 16 \n<name>:\n \
  \   <init> \n    .quad 0\n``` |\n\n#### 表 13-9：静态初始化器的格式化\n\n| 静态初始化器 | 输出 |\n|\
  \ :--- | :--- |\n| `DoubleInit(d)` | `.double <d>` 或 `.quad <d-interpreted-as-long>`\
  \ |\n\n#### 表 13-10：汇编指令的格式化\n\n\n\n\n\n| 汇编指令 | 输出 |\n| --- | --- |\n| `Cvtsi2sd(t,\
  \ src, dst)` | |\n```\ncvtsi2sd<t>    <src>, <dst>\n```\n| `Cvttsd2si(t, src, dst)`\
  \ | |\n```\ncvttsd2si<t>   <src>, <dst>\n```\n| `Binary(Xor, Double, src, dst)`\
  \ | |\n```\nxorpd    <src>, <dst>\n```\n| `Binary(Mult, Double, src, dst)` | |\n\
  ```\nmulsd    <src>, <dst>\n```\n| `Cmp(Double, operand, operand)` | |\n```\ncomisd\
  \   <operand>, <operand>\n```\n\n#### 表 13-11: 汇编操作符的对应指令名称\n\n| 汇编操作符 | 指令名称 |\n\
  | --- | --- |\n| Shr | shr |\n| DivDouble | div |\n| And | and |\n| Or | or |\n\n\
  #### 表 13-12: 汇编类型的指令后缀\n\n| 汇编类型 | 指令后缀 |\n| --- | --- |\n| Double | sd |\n\n####\
  \ 表 13-13: 汇编操作数格式化\n\n| 汇编操作数 | 输出 |\n| --- | --- |\n| Reg(XMM0) | %xmm0 |\n| Reg(XMM1)\
  \ | %xmm1 |\n| Reg(XMM2) | %xmm2 |\n| Reg(XMM3) | %xmm3 |\n| Reg(XMM4) | %xmm4 |\n\
  | Reg(XMM5) | %xmm5 |\n| Reg(XMM6) | %xmm6 |\n| Reg(XMM7) | %xmm7 |\n| Reg(XMM14)\
  \ | %xmm14 |\n| Reg(XMM15) | %xmm15 |\n\n请注意表 13-8 并不包含常数的本地前缀，尽管正如我们讨论过的，你有选择包含它们。同样请注意，表\
  \ 13-10 中的 `xorpd`、`comisd` 和 `mulsd` 指令需要特殊处理。作为一种打包指令，`xorpd` 不使用标准的 `sd` 后缀，且\
  \ `comisd` 和 `mulsd` 指令的名称与其整数版本不同。\n\n一旦你完成了所有这些更改，就可以测试整个编译器了。\n\n### 加分项：NaN\n\
  \n你可以将对静默 NaN（quiet NaNs）的支持作为一项加分功能。算术运算可以直接工作，不需要你付出额外努力，因为 SSE 指令会传播 NaN。你不需要处理转换，因为从\
  \ NaN 到整数的转换是未定义的。你唯一需要担心的是比较操作。\n\n当你将任何值与 NaN 比较时，结果是无序的（unordered）。如果 `x` 是 NaN，那么\
  \ `x > y`、`x < y` 和 `x == y` 均为假。NaN 甚至与自身比较也不相等。`comisd` 指令通过将三个标志位置为 1 来指示无序结果：ZF、CF\
  \ 和 PF（奇偶标志位）。正如依赖于 ZF、CF 以及我们已经遇到的其他状态位的状态码一样，`P` 码依赖于奇偶标志位。例如，`jp` 指令仅在 PF 为 1\
  \ 时才会跳转。你需要使用此状态码来在浮点比较中正确地考虑 NaN。\n\n在运行测试套件时，使用 `--nan` 标志包含包含 NaN 的测试用例：\n\n\
  ```\n$ ./test_compiler /path/to/your_compiler --chapter 13 --nan\n```\n\n或者像往常一样使用\
  \ `--extra-credit` 标志来启用所有加分测试。\n\n### 总结\n\n你的编译器现在支持浮点数了！在本章中，你学习了如何在汇编中定义浮点常数、如何使用\
  \ SSE 指令，以及如何根据 System V 调用约定传递浮点参数。你在整个编译器中（从解析器到代码生成）都处理了舍入误差。最重要的是，你已经看到了正确实现浮点算术有多困难。许多程序员大致知道浮点算术是不精确的；但编写编译器迫使你确切地理解它是如何出错的。在下一章中，你将添加一种完全不同的类型：指针。你将处理棘手的解析问题，扩展类型检查器，并在\
  \ TACKY 和汇编 AST 中添加一些极其有用的结构。\n\n### 额外资源\n\n这些是我编写本章时依赖的资源，大致根据它们最相关的章节进行了组织。我还包含了一些我发现特别有的在线浮点数可视化工具。\n\
  \n#### IEEE 754\n\n*   IEEE 754 标准可以在 IEEE 网站上购买，价格为 100 美元（*[`<wbr>ieeexplore<wbr>.ieee<wbr>.org<wbr>/document<wbr>/8766229`](https://ieeexplore.ieee.org/document/8766229)*）。但你可能从以下免费资源中获得所需的任何答案：\n\
  \n\n\n\n\n*   维基百科上的“双精度浮点数格式”文章对 IEEE 754 双精度值的二进制编码进行了详尽描述（[https://en.wikipedia.org/wiki/Double-precision_floating-point_format]）。\n\
  \n*   David Goldberg 写的《每个计算机科学家应该了解的浮点算术》是最著名的浮点数学入门介绍之一，如果不是可读性最高的话（[https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html]）。我发现“IEEE\
  \ 标准”章节中对 IEEE 754 格式的讨论特别有用。文章还涵盖我完全忽略掉的一些重要主题，如异常和错误处理。\n\n*   《浮点指南》是由 Michael\
  \ Borgwardt 创建的网站，它以浅于懂的方式涵盖了处理 IEEE 754 浮点数的基础知识（[https://floating-point-gui.de]）。如果其他两篇文章太晦涩，请从这里开始看。\n\
  \n*   要了解更多关于 GCC 和 Clang 对 IEEE 754 标准的支持，请参考以下资源：\n\n    *   GCC wiki 上的“GCC 中浮点数学的语义”总结了\
  \ GCC 浮点支持的状态，描述了默认的浮点行为，并讨论了完全符合 IEEE 754 的一些挑战（[https://gcc.gnu.org/wiki/FloatingPointMath]）。\n\
  \n    *   Clang 编译器用户手册中的“控制浮点行为”章节讨论了 Clang 对 IEEE 754 的兼容性（[https://clang.llvm.org/docs/UsersManual.html#controlling-floating-point-behavior]）。\n\
  \n## 第 299 页“舍入行为”的参考\n\n*   Rick Regan 的博客文章“二进制浮点数的间隔”讨论了连续浮点数之间的间隙（`www.exploringbinary.com/the-spacing-of-binary-floating-point-numbers/）。我发现关注数轴上的间隙是理解浮点舍入误差的关键。读完这篇博客后，关于这个主题的其他讨论突然变得有意义多了。\n\
  \n## [第 310 页`“汇编中的浮点操作”的参考\n\n*   关于 System V 调用约定的细节，请参见 System V x64 ABI（[https://gitlab.com/x86-psABIs/x86-64-ABI]）。\n\
  \n*   关于单个 SSE 指令的细节，包括它们如何处理溢出和舍入，请参见 Intel 64 软件开发者手册（[https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html]）。\n\
  \n*   Bruce Dawson 的博客文章“有时浮点数学是完美的”概述了浮点计算*不会*产生舍入误差的情况（[https://randomascii.wordpress.com/2017/06/19/sometimes-floating-point-math-is-perfect/）。它帮助我理清了为什么我们从\
  \ `double` 转换为 `unsigned long` 的汇编不会产生舍入误差。\n\n*   Pascal Cuoq 对 Stack Overflow\
  \ 上关于 `unsigned long` 到 `double` 的汇编级转换的问题写了一个非常好的回答（[https://stackoverflow.com/a/26799227]）。这是我能找到关于这种转换的最佳解释。\n\
  \n*   Rick Regan 的另一篇帖子“GCC 通过舍入到奇数避免双重舍入误差”提供了更多双重舍入误差的背景信息（`www.exploringbinary.com/gcc-avoids-double-rounding-errors-with-round-to-odd/）。\n\
  \n## [第 338 页`“代码发射”的参考\n\n我借鉴了 Rick Regan 在 Exploring Binary 上的两个博客文章，在代码发射期间处理浮点常数：\n\
  \n*   “十六进制浮点常数”讨论了如何用十六进制表示浮点数以避免舍入误差（[https://www.exploringbinary.com/hexadecimal-floating-point-constants/）。\n\
  \n*   “往返转换所需的位数”解释了为什么 17 位十进制数字就足够表示一个浮点常数（[https://www.exploringbinary.com/number-of-digits-required-for-round-trip-conversions/）。\n\
  \n## 浮点数可视化工具\n\n这些工具让你能够实验小数的 IEEE 754 表示法：\n\n*   由 Rick Regan 创建的“十进制转浮点数转换器”允许将小数转换为最近的可表示\
  \ `double`，并以多种格式显示，包括原始二进制、十六进制点数和二进制科学计数法（[https://www.exploringbinary.com/floating-point-converter/）。\n\
  \n*   由 Bartosz Ciechanowski 创建的 Float Exposed 让你查看并编辑 `double` 的符号位、指数位和尾数字段，以及其原始二进制表示（[https://float.exposed）。\n\
  \n\n\n\n在本章中，你将实现指针类型（pointer types），它表示的是内存地址。你还将添加两个用于处理指针的新运算符：地址操作符 `&` 和解引用运算符\
  \ `*`。你将学习如何解析复杂的类型说明符，以及如何检测几种新类型的类型错误。在 TACKY 和汇编代码生成期间，你将添加一些新的结构来从内存位置读取和写入数据。随着后续章节中添加更多非算术类型，你将继续基于这些更改进行构建。\n\
  \n首先，让我们讨论在本章中反复提到的几个关键概念：对象（objects）、值（values）以及左值转换（lvalue conversion）。\n\n###\
  \ 对象和值\n\n对象和值在前面的章节中已经出现过，但我从未精确地定义过这两个术语，也没有解释过它们之间的区别。你可以将`value`（值）认为是一个具有类型的位序列。例如，这些位\n\
  \n```\n11111111111111111111111111111111\n```\n\n类型为 `int` 的位值为 `-1`。到为止，我们只遇到过整数和浮点值。\n\
  \n一个`object`（对象）是包含一个值的内存位置。变量是我们目前为止看到的唯一对象。从程序员的角度来看，每个对象都有一个内存地址（该地址在其整个生命周期内是固定的）以及一个可以通过赋值表达式来更新的值。（在实践中，某些对象可能存储在寄存器而非内存中，你无法更新每个对象的值，但我们现在可以忽略这些异常。）\n\
  \n在第 5 章中，我将左值（lvalue）描述为出现在赋值表达式左侧的表达式。现在我们可以使用 C 标准第 6.3.2.1 节第 1 段中更精确的定义：“左值是一个表达式……它可能指向一个对象。”（注意，尽管名字如此，但左值*不是*一个值；它是一个表达式。）求非左值表达式产生一个值。另一方面，根据标准第\
  \ 5.1.2.3 节第 2 段，求左值则“确定了所指对象的身份”。如果一个表达式指向一个对象，你就可以对其进行赋值。否则，你不能。\n\n当你在 `x + 1`\
  \ 这样的表达式中使用对象时，你实际上在使用它的当前值。但当你对一个对象进行赋值时，你并不关心它即将被覆盖的当前值；你关心的是它的位置，即你试图写入的位置。换句话说，如果\
  \ `x` 是一个 `int` 类型的变量，你有时将其看作一个 `int` 类型的值，有时将其看作一个可以存储 `int` 类型值的容器。C 标准将第一这种情况（即在表达式中使用对象的值）称为\
  \ `lvalue conversion`（左值转换）。这种“转换”的意义在于，你正将一个指向对象的左值转换成普通值。如果左值作为赋值表达式的左操作数或作为 `&`\
  \ 运算符的操作数出现，它就不会经历左值转换。如果它出现在表达式的任何其他地方，就会发生转换。例如，在表达式 `x = 3` 和 `y = &x` 中，`x`\
  \ 是一个左值，但在表达式 `foo(x)`、`x == y` 和 `a = x` 中，它不是左值。\n\n### 指针操作\n\n在这一节中，我将介绍地址操作符\
  \ `&`（它用于获取指向对象的指针）和解引用运算符 `*`（用于通过指针访问对象）。我还将讨论指针的强制转换和比较，以及一个涉及 `&` 运算符的特殊情况。我不会讨论加法或减法；我们将在下一章实现这些操作。\n\
  \n#### 地址和解引用操作\n\n为了观察 `&` 和 `*` 操作是如何运作的，让我们走一遍列表 14-1 中的程序。我们将特别注意程序中的哪些表达式指向对象，哪些表达式产生值。\n\
  \n```c\nint main(void) {\n    int x = 0;\n    int *ptr = &x;\n    *ptr = 4;\n  \
  \  return *ptr;\n}\n```\n\n列表 14-1：使用 `&` 和 `*` 操作的简单程序\n\n我们首先声明一个变量 `x`。由于 `x`\
  \ 是一个对象，它有一个地址，尽管该地址在每次运行程序时可能不同。假设在一次运行列表 14-1 时，`x` 位于内存地址 `0x7ffeee67b938`。它还有一个值，即\
  \ `0`。由于 `x` 的类型是 `int`，我们将该值解释为 `int`。\n\n\n\n\n\n接下来，我们声明变量 `ptr`，它也是一个对象。`ptr`\
  \ 的类型是 `int *`，或者说是指向 `int` 的指针”，表示类型为 `int` 的对象的地址。与 `x` 一样，`ptr` 有一个地址；假设它是 `0x7ffeee67b940`。它还有一个值：表达式\
  \ `&x` 的结果。`&` 运算符获取其操作数的地址，这意味着它的操作数必须指定一个具有地址的对象。换句话说，该操作数必须是一个左值（lvalue）。然而，`&`\
  \ 运算符的结果不是对象，而是一个指针类型的值。\n\n在表达式 `&x` 中，操作数是左值 `x`。求值 `&x` 得到值 `0x7ffeee67b938`，这是\
  \ `x` 的地址。我们将此值赋值变量 `ptr`，就像我们可以将任何值赋值给兼容类型的变量一样。为了帮助我们理清思路，图 14-1 显示了程序执行此时栈的内容。\n\
  \n![](img/fig14-1.jpg)\n\n*图 14-1: 在列表 14-1 中声明对象的地址和初始值 描述*\n\n如如图所示，`0x7ffeee67b938`\
  \ 既是 `x` 的地址，也是 `ptr` 的值。我之前提到过，值是一个带有类型的位序列；值 `0x7ffeee67b938` 的类型是 `int *`，因为它是一个\
  \ `int` 类型对象的地址。\n\n在列表 14-1 的下一行，有一个赋值表达式 `*ptr = 4`，它由多个子表达式组成。右侧是常量 `4`；左侧是变量\
  \ `ptr`，它本身是解引用表达式 `*ptr` 的一部分。常量并不特别有趣，但另外两个子表达式很有意思。这些表达式中最内层的 `ptr` 指定了一个类型为\
  \ `int *` 的对象。我们没有对其进行赋值，也没有获取它的地址，只是读取它的值。因此，我们隐式地将其转换为左值，得到类型为 `int *` 的值，`0x7ffeee67b938`。我们在解引用表达式\
  \ `*ptr` 中使用这个值。解引用表达式是一个左值，所以它的结果是一个对象。在这种情况下，它是地址为 `0x7ffeee67b938` 的对象，因为这是被解引用的值。由于我们是在赋值对象\
  \ `*ptr` 而不是使用它的值，因此它不需要左值转换。图 14-2 显示了该语句之后栈的内容。\n\n![](img/fig14-2.jpg)\n\n*图\
  \ 14-2: 通过解引用指针赋值后栈的内容 描述*\n\n我们在最后的 `return` 语句中再次对 `ptr` 进行解引用。再次，`*ptr` 的结果是地址为\
  \ `0x7ffeee67b938` 的对象。然而，这次我们没有对该对象进行赋值，也没有对其应用 `&` 运算符。因此，我们执行了左值转换，得到了对象的当前值\
  \ `4`。\n\n现在你已经理解了 `*` 和 `&` 如何作用于对象和值，让我们来谈谈与指针类型之间及相互转换。\n\n### 空指针与类型转换\n\n值为\
  \ 0 的整数常量表达式被称为空指针常量，它可以转换为任何指针类型。该转换的结果是一个空指针：\n\n```\nint *null = 0;\n```\n\n\
  由于空指针不是有效的内存地址，对其进行解用的结果是未定义的。在实践中，解引用空指针可能会导致你的程序崩溃。C 标准允许像 `(long) 0` 和 `10 -\
  \ 10` 这样的常量表达式作为空指针常量，但我们支持 `0` 和 `0ul` 等常量字面量。（这与我们在[第 10 章](#chapter10.xhtml）中对静态初始化器的限制相同。）\n\
  \n除了空指针常量外，将整数隐式转换为指针或反之都是非法的。考虑这段代码：\n\n```\nint x = 0;\nint *ptr = x;\n```\n\n\
  由于 `x` 的类型为 `int`，将其赋值给类型为 `int *` 的 `ptr` 是非法的。出于相同的原因，将非零常量赋值给指针也是非法的：\n\n```\n\
  int *ptr1 = 3;\nint *ptr2 = 0x7ffeee67b938;\n```\n\n`ptr1` 和 `ptr2` 的这些声明都是非法的，因为\
  \ `3` 和 `0x7ffeee67b938` 是整数，而不是指针。注意，表达式的类型与其值是否为有效内存地址无关。即使 `0x7ffeee67b938` 恰好是一个有效地址，常量表达式\
  \ `0x7ffeee67b938` 仍然是一个 `long` 而不是指针。\n\n\n\n\n\n从一种指针类型隐式转换为另一种指针类型也是非法的（与 `void\
  \ *` 之间的双向转换除外，我将在第 17 章中介绍）。例如，你不能隐式地将 `double *` 转换为 `long *`：\n\n```\ndouble\
  \ *d = 0;\nlong *l = d;\n```\n\nGCC 会对上述三个代码段中的隐式转换发出警告，但仍然会编译它们。我们将采取更严格的方法，将这些隐式转换视为错误。\n\
  \n另一方面，指针类型之间以及指针与整数类型之间的*显式*强制转换是合法的。列表 14-2 展示了从 `double *` 到 `unsigned long *`\
  \ 的显式转换示例。\n\n```\ndouble negative_zero = -0.0;\ndouble *d = &negative_zero;\n❶\
  \ unsigned long *l = (unsigned long *) d;\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-2: 显式指针类型转换</samp>\n\n在显式转换和赋值 ❶ 之后，`d` 和 `l` 相同的内存地址，被解释为两种不同的指针类型。\n\n\
  一个重要的注意事项是，在转换后对 `l` 进行解引用会导致未定义行为。在少数例外情况下，如果我们用某种类型声明一个对象（称为其*有效类型*），然后使用不同类型的表达式来访问它，其结果是未定义的。换句话说，从一种指针类型转换为另一种指针类型总是合法的，但使用该转换表达式的结果可能是不合法的。在列表\
  \ 14-2 中，`negative_zero` 的有效类型是 `double`，因此我们不能用类型为 `unsigned long` 的表达式 `*l` 来访问它。关于可以使用什么类型的表达式来访问对象的完整规则（非正式称为*严格别名规则*）在\
  \ C 标准的第 6.5 节第 6–7 段中已详细列出。幸运的是，由于我们不需要检测未定义行为或优雅地处理它，我们可以忽略这些规则；我们的实现会乐意地编译违反这些规则的程序。\n\
  \n最后，你可以在指针类型和整数类型之间进行显式强制转换。当你将空指针常量转换为指针类型时，结果是一个空指针。当你将任何其他整数转换为指针类型，或将任何指针转换为整数类型时，结果由实现定义。在\
  \ x64 系统上，内存地址是无符号 64 位整数，例如 `0x7ffeee67b938`。因此，如果你将 `unsigned long` 转换为指针（或反之），其值不会改变。将任何其他整数类型转换为或从指针类型转换与转换为或从\
  \ `unsigned long` 的效果相同。例如，如果你将值为 `-1` 的有符号 `int` 或 `long` 转换为指针类型，它将导致最大的可表示内存地址\
  \ `0xffffffffffffffff`。该地址不太可能包含有效对象，因此对其进行解引用可能会导致未定义行为。\n\n将指针类型强制转换为 `double`\
  \ 或将 `double` 转换为指针类型是非法的。\n\n### 指针比较\n\n你可以使用 `==` 和 `!=` 运算符比较相同类型的指针。如果指针指向相同地址，`==`\
  \ 返回真；如果它们指向不同地址，`!=` 返回真。你还可以使用 `!`、`&&` 和 `||` 表达式将指针与零比较；在这些情况下，空指针被视为零，任何非空指针都是非零。你也可以使用\
  \ `<` 等关系运算符比较指针，但这仅在你处理数组时有用，我们将在下一章中实现数组。\n\n### 对解引用指针进行的操作\n\n我们之前看到，`&` 运算符的操作数必须是一个左值（lvalue）。由于解引用指针是一个左值，你可以获取它的地址，就像我们在列表\
  \ 14-3 中做的那样。\n\n```\nint *ptr = &var;\nint *ptr2 = &*ptr;\n```\n\n<samp class=\"\
  SANS_Futura_Std_Book_Oblique_I_11\">列表 14-3: 获取解引用指针的地址</samp>\n\n表达式 `&*ptr` 是有效的，但它并不好用。内部表达式指定了某个地址的对象，而外部表达式获取该地址。你最终得到的只是\
  \ `ptr`，即你最初开始解引用的地址。\n\n事实上，C 标准将 `&*` 视为一种特殊情况：第 6.5.3 节第 3 段规定，“`*` 运算符和 `&`\
  \ 运算符都不会被求值，结果就像两者都被省略了一样，但运算符的限制仍然适用，且结果不是一个左值。”换句话说，`&*` 的结果总是指针本身。通常情况下，就像在列表\
  \ 14-3 中，是否计算 `*` 和 `&` 运算符并不重要；无论如何我们得到的都是指针。唯一的例外是内部表达式不是有效的内存地址，就像在列表 14-4 中。\n\
  \n```\nint *null_ptr = 0;\nint *ptr2 = &*null_ptr;\n```\n\n<samp class=\"SANS_Futura_Std_Book_Oblique_I_11\"\
  >列表 14-4: 获取解引用空指针的地址</samp>\n\n\n\n\n解引用 `null_ptr` 通常会导致运行时错误。然而，由于 Listing 14-4\
  \ 中的 `&` 和 `*` 表达式没有被求值，这段代码等于：\n\n```\nint *null_ptr = 0;\nint *ptr2 = null_ptr;\n\
  ```\n\n因此，Listing 14-4 运行没有错误；它将 `null_ptr` 和 `ptr2` 都初始化为空指针。\n\n既然我们已经是指针语义的专家了，让我们开始词法分析器吧！\n\
  \n### 词法分析器\n\n在本章中，你将添加一个标记：\n\n`&` — 取地址符，即地址运算符\n\n你已经添加了用于乘法法的 `*` 标记。如果你在第\
  \ 3 章中为了额外加分实现了位运算符，那么你可能已经添加了 `&` 标记，所以你完全不需要修改词法分析器。\n\n### 解析器\n\n接下，我们将把指针类型和两个新的指针运算符添加到\
  \ AST 中。指针类型是由其所指向对象的类型递归构造的；`int *`、`double *` 和 `unsigned long *` 都是有效类型。你也可以声明指向指针的指针，因此\
  \ `int **`、`long ***` 等也是有效类型。因此，AST 递归地定义指针类型：\n\n```\ntype = Int | Long | UInt\
  \ | ULong | Double\n     | FunType(type* params, type ret)\n     | Pointer(type\
  \ referenced)\n```\n\n在 C 中中，从简单类型构建的类型被称为*派生类型*（derived types）。指针类型和函数类型都是派生类型。我们在后续章节中实现的数组和结构体类型也是派生类型。指针指向的类型是它的*引用类型*（referenced\
  \ type）。例如，`int *` 的引用类型是 `int`。\n\n我们将扩展 `exp` AST 节点来表示解引用和地址运算符：\n\n```\nexp\
  \ = --snip--\n    | Dereference(exp)\n    | AddrOf(exp)\n```\n\n在语法上，这些者都是一元运算符，所以如果你愿意，可以扩展\
  \ `unary_operator` 而不是 `exp`。但认为将它们设为独立的表达式更容易简单，因为在类型检查和 TACKY 生成期间，我们处理这些运算符的方式与其他一元运算符完全不同。Listing\
  \ 14-5 显示了更新后的 AST，本章添加的内容已加粗显示。\n\n```\nprogram = Program(declaration*)\ndeclaration\
  \ = FunDecl(function_declaration) | VarDecl(variable_declaration)\nvariable_declaration\
  \ = (identifier name, exp? init, type var_type, storage_class?)\nfunction_declaration\
  \ = (identifier name, identifier* params, block? body,\n                       \
  \ type fun_type, storage_class?)\ntype = Int | Long | UInt | ULong | Double\n  \
  \   | FunType(type* params, type ret)\n     | Pointer(type referenced)\nstorage_class\
  \ = Static | Extern\nblock_item = S(statement) | D(declaration)\nblock = Block(block_item*)\n\
  for_init = InitDecl(variable_declaration) | InitExp(exp?)\nstatement = Return(exp)\n\
  \          | Expression(exp)\n          | If(exp condition, statement then, statement?\
  \ else)\n          | Compound(block)\n          | Break\n          | Continue\n\
  \          | While(exp condition, statement body)\n          | DoWhile(statement\
  \ body, exp condition)\n          | For(for_init init, exp? condition, exp? post,\
  \ statement body)\n          | Null\nexp = Constant(const)\n    | Var(identifier)\n\
  \    | Cast(type, exp)\n    | Unary(unary_operator, exp)\n    | Binary(binary_operator,\
  \ exp)\n    | Assignment(exp)\n    | Conditional(exp)\n    | FunctionCall(exp)\n\
  \    | Dereference(exp)\nunary_operator = \"~\" | \"!\" | \"*\" | \"&\"\nbinary_operator\
  \ = Add | Subtract | Multiply | Divide | Remainder | And | Or | Equal | NotEqual\
  \ | LessThan | LessEqual | GreaterThan | GreaterEqual\nConstInt | ConstLong | ConstUInt\
  \ | ConstDouble\n```\n\n#### 带有指针类型和地址运算符的抽象语法树\n\n接下来，我们将更新语法并确定如何解析它。我们需要一种可以扩展以处理派生类型的方法；否则，我们在下一章中必须完全重写它来处理数组。我们将从更新解析器以支持声明中的派生类型开始。然后，我们将处理类型转换表达式中的派生类型。\n\
  \n`unop ::= \"~\" | \"!\" | \"*\" | \"&\"`\n\n#### 解析声明\n\n一个函数或变量声明由三部分组成：限定符列表、声明符（declarator）以及初始化器或函数体。你已经知道初始化器和函数体什么样了，所以我不再谈论它们。限定符在之前也已经熟悉：它们包括如\
  \ `static` 这样的存储类限定符，它们决定了标识符的存储类和链接，以及如 `int` 这样的类型限定符，它们决定了我所说的基本类型。基本类型可以是标识符的类型，也可以推导出其类型的起始点。（这个特定术语没有出现在\
  \ C 标准中，但在其他关于 C 的讨论中时会显示）。*声明符*是其他所有内容：它指示了被声明的标识符，以及我们应用于基本类型上的一系列推导过程。例如，`var`、`*var`、`foo(int\
  \ a)` 和 `foo[3]` 都是声明符。\n\n最简单的声明符是标识符：\n\n```\nint var;\n```\n\n在这里，基本类型是 `int`，声明符是\
  \ `var`，因此它声明了一个名为 `var` 的 `int` 类型变量。这个声明不包含任何类型推导。\n\n为了推导出新类型，我们将像 `var` 这样的声明符嵌套另一个声明符内部：\n\
  \n```\nint *(var);\n```\n\n\n\n\n这里，我们有一个指针声明符 `*(var)`，它包含了嵌套的声明符 `var`。指针声明符获取某种类型\
  \ `t` 并导出类型“指向 `t` 的指针”，因此此声明将 `var` 声明为“指向 `int` 的指针”。注意，C 语法允许我们将任何声明符包裹在括号中。我将\
  \ `var` 包裹在括号中是为了让这里的嵌套更加显式，但如果我们省略它们，声明的含义是相同的：\n\n```\nint *var;\n```\n\n我们使用多层嵌套声明符来指定多个类型推导；这些推导从外向内应用，以确定最终类型。最内层的声明符始终是一个简单的标识符。这里有一个三个嵌套声明符的示例：\n\
  \n```\nint *(*(var));\n```\n\n完整的声明符是 `*(*(var))`，它包含了 `*(var)`，后者又包含了 `var`。与上一个示例一样，这个声明符中的括号没有作用；我只是为了清晰而包含了它们。\n\
  \n让我们来看一下这里的类型推导。从外向内看，我们从基本类型 `int` 开始。接下来，我们看到一个指针声明符，因此我们导出类型“指向 `int` 的指针”。然后，我们又看到一个指针声明符，因此我们导出“指向指向\
  \ `int` 的指针指针”。最后，我们遇到了标识符，它完成了声明但没有添加任何类型信息。我们最终得到了变量 `var`，其类型为“指向指向 `int` 的指针指针”。\n\
  \n另外两种类的声明符是*函数声明符*（我们已经支持了这种）和*数组声明符*（我们将在下一章添加）。函数声明符获取一个类型 `t` 并导出类型“返回 `t` 的函数”。让我们来拆解一个函数声明：\n\
  \n```\nint foo(void);\n```\n\n这里的完整声明符是 `foo(void)`，它包含了嵌套的声明符 `foo`。为每个声明符加上括号，我们得到了以下等效声明：\n\
  \n```\nint ((foo)(void));\n```\n\n我们从基本类型 `int` 开始。外层声明符告诉我们导出类型“返回 `int` 的函数”，而内层声明符指示我们正在声明标识符\
  \ `foo`。当然，函数声明符还声明了函数的参数。每个参数都像声明一样，包含一个基本类型和一个声明符：\n\n```\nint foo(int a, int\
  \ *b);\n```\n\n正如我们所知，形式为 `(void)` 的参数列表是一个特殊情况：它声明该函数没有参数。\n\n最后，数组声明符以类型 `t` 开始并导出类型“包含\
  \ `n` 个 `t` 类型元素的数组”。例如，下面的代码包含了声明符 `arr[3]`，它包含一个嵌套声明符 `arr`：\n\n```\nint arr[3];\n\
  ```\n\n这声明 `arr` 是一个包含三个 `int` 类型元素的数组。\n\n更复杂的声明可以包含指针、数组和函数声明符的混合。用后置表达式表示的函数声明符和数组声明符的优先级高于指针声明符，所以：\n\
  \n```\nint *arr[3];\n```\n\n等同于：\n\n```\nint *(arr[3]);\n```\n\n为了解释这个声明，我们从 `int`\
  \ 开始，应用外层指针声明符导出“指向 `int` 的指针”，应用内层数组声明符导出“包含三个指向 `int` 指针的数组”，并以最内层的声明符 `arr` 结束。要声明指向数组的指针，我们用括号覆盖了这种优先级：\n\
  \n```\nint (*arr)[3];\n```\n\n遵循此理，这个声明声明了一个带有单个参数的函数指针：\n\n```\nint (*fptr)(int\
  \ a);\n```\n\n函数指针在 C 语言中是合法的，但我们不会在书中实现它们。你也可以嵌套声明符来指定完全非法的类型。例如，`int foo(void)(void);`\
  \ 声明了一个返回函数，而该函数返回一个 `int`。这个声明在语法上是正确的，但在语义上是无效的；函数不能返回另一个函数。\n\n现在你已经理解了声明符的基本语法，我们准备好为它们编写语法规则了。关于声明符的完整描述，请参见标准的第\
  \ 6.7 节。\n\n由于声明符有多个优先级级别，我们需要几条语法规则来定义它们的语法。在最高优先级级别，简单声明符（simple-declarator）是一个单个标识符或带括号的声明符：\n\
  \n```\n<simple-declarator ::= <identifier> | \"(\" <declarator> \")\"\n```\n\n在下一个优先级级别，我们有语法中所谓的*直接声明符*（direct\
  \ declarators），包括函数声明符和数组声明符。在本章中只支持函数声明符：\n\n```\n<direct-declarator ::= <simple-declarator>\
  \ [<param-list>]\n<param-list ::= \"(\" \"void\" \")\" | \"(\" <param> {\",\" <param>}\
  \ \")\"\n<param ::= {type-specifier}+ <declarator>\n```\n\n在 `direct-declarator`\
  \ 的定义中，直接声明符可以是简单声明符，也可以是函数声明符，通过参数列表的存在来指示。注意，我们与之前的章节相比微调了 `param-list`，重构了该符号以包含参数列表周围括号，并将单个参数的定义移动到单独的\
  \ `param` 符号中。重要的是，`param` 的定义现在包含一个声明符而不是简单的标识符。这让我们允许参数具有复杂的类型。最后，我们将定义一个包含指针声明符的顶层\
  \ `declarator`（声明符）：\n\n```\n<declarator> ::= \"*\" <declarator> | <direct-declarator>\n\
  ```\n\n遗憾的是，这个语法与我们的 AST 定义并不真正对应。一个小问题是它允许我们指定我们不支持的类型，包括函数指针、返回函数的函数以及接受其他函数作为参数的函数。一个更严重的问题是，在我们的语法中，类型推导是从外向内应用的，但在\
  \ AST 定义中，它们是从内向外应用的。让我们重新回顾之前看过的一个声明：\n\n```\nint (*arr)[3];\n```\n\n\n\n我们想要解析这个声明并构造类型“指向包含三个\
  \ `int` 类型元素的数组的指针”。如果我们尝试使用递归下降解析法来构造这个类型，，会发生什么呢？首先，我们会遇到基本类型 `int`。然后，我们会看到一个左括号，这表示直接声明符（direct\
  \ declarator）的开始。在那个直接声明符内部，我们会找到指针声明符——然后我们就卡住了。我们本应该推导出指针类型，但是指向什么的指针呢？我们目前为止看到的基本类型是\
  \ `int`，但“指向 `int` 的指针”是错误的。因为类型推导是从外向内应用的，我们应该先推导出数组类型。但我们做不到，因为解析器必须先处理括号内的声明符，才能到达指定数组类型的\
  \ `[3]`。\n\n我们在这里卡住了，是因为我们识别语法符号的顺序与我们应用类型推导的顺序不匹配。当我们解析声明时，不能边解析边推导出它的类型。相反，我们会首先将每个声明符解析为一种一次性的表示，这种表示更接近语法结构，如\
  \ [Listing 14-6] 所示。\n\n```\ndeclarator = Ident(identifier)\n           | PointerDeclarator(declarator)\n\
  \           | FunDeclarator(param_info* params, declarator)\nparam_info = Param(type,\
  \ declarator)\n```\n\n*Listing 14-6: 声明符的语法表示*\n\n我们可以使用标准的递归下降解析，遵循我们刚刚引入的语法规则，产生一个\
  \ `declarator` 结构。\n\n下一步是遍历该 `declarator` 并推导出所有用于构造 AST 节点所需的信息：声明的类型、它的标识符以及任何参数的标识符。在每一层，我们都会应用相应的类型推导，然后递归地处理内部声明符。[Listing\
  \ 14-7] 展示了这一步的伪代码。\n\n```\nprocess_declarator(declarator, base_type):\n    match\
  \ declarator with\n    | Ident(name) -> return (name, base_type, []) ❶\n    | PointerDeclarator(d)\
  \ -> ❷\n        derived_type = Pointer(base_type)\n        return process_declarator(d,\
  \ derived_type)\n    | FunDeclarator(params, d) -> ❸\n        match d with\n   \
  \     | Ident(name) -> ❹\n            param_names = []\n            param_types\
  \ = []\n            for Param(p_base_type, p_declarator) in params: ❺\n        \
  \        param_name, param_t, _ = process_declarator(p_declarator, p_base_type)\n\
  \                if param_t is a function type:\n                    fail(\"Function\
  \ pointers in parameters aren't supported\")\n                param_names.append(param_name)\n\
  \                param_types.append(param_t)\n\n            derived_type = FunType(param_types,\
  \ base_type)\n            return (name, derived_type, param_names)\n        | _\
  \ -> fail(\"Can't apply additional type derivations to a function type\")\n```\n\
  \n*Listing 14-7: 从声明符中推导出类型和标识符信息*\n\n`process_declarator` 函数接受两个参数。第一个是声明符本身。第二个\
  \ `base_type` 是我们目前为止推出的类型。初始情况下，这将声明开头修饰符列表所指示的基本类型。例如，如果我们正在处理声明 `double **fun(int\
  \ x)`，我们将从 `double` 作为 `base_type` 开始。`process_declarator` 的结果是一个包含三个值的元组：声明的标识符、其推出的类型以及任何参数的名称。如果声明的是一个变量，或者声明一个没有参数的函数，参数名称列表将为空。使用这三个值，我们能够构造一个\
  \ `declaration` AST 节点。\n\n让我们遍历一下如何从 `declarator` 结构中提取这些值。在最简单的情况下，声明符是一个标识符❶。我们不需要应用任何类型推导或引入任何参数，因此返回标识符、未更改的\
  \ `base_type` 和空的参数名称列表。例如，在处理声明 `int x;` 时，我们会立即进入此情况并返回 `(\"x\", Int, [])`。\n\n\
  在第二种情况下，我们处理指针声明符 ❷。在这种情况下，我们从 `base_type` 推导出指针类型。然后我们对刚刚推导出的类型递归调用 `process_declarator`。\n\
  \n在最后一种情况下，我们处理函数声明符 ❸。这种情况略有不同，因为内部声明符必须是一个标识符。因此，我们验证内部声明符是一个普通的标识符 ❹。\n\n假设内部声明符是有效的，下一步是确定函数类型和参数名称。我们将遍历声明符中的参数，递归调用\
  \ `process_declarator` 来获取每个参数的类型和名称 ❺。在此，我们还会验证这些函数参数中没有一个是函数。（C 标准实际上允许你声明函数类型的参数，但它要求编译器隐式地将其调整为函数类型。由于我们不支持函数指针，我们将拒绝它们）。一旦处理完每个参数，我们就构造整个函数类型并返回关于此声明的所有信息。\n\
  \n[Listing 14-8] 展示了如何将所有部分结合起来解析整个声明。\n\n```\nparse_declaration(tokens):\n    specifiers\
  \ = parse_specifier_list(tokens)\n    base_type, storage_class = parse_type_and_storage_class(specifiers)\n\
  \    declarator = parse_declarator(tokens)\n    name, decl_type, params = process_declarator(declarator,\
  \ base_type)\n    if decl_type is a function type:\n        <construct function_declaration>\n\
  \    else:\n        <construct variable_declaration>\n```\n\n*Listing 14-8: 解析整个声明*\n\
  \n\n\n指针类型也可以出现在类型转换表达式中：\n\n```\nint *result_of_cast = (int *) exp;\n```\n\n但你不能在转换表达式中使用声明符（declarator），因为声明符必须包含一个标识符。C\
  \ 语言通过`抽象声明符`（abstract declarators）解决了这个问题，即不包含标识符的声明符。我们现在会添加抽象指针声明符，并在下一章添加抽象数组声明符。（我们不需要抽象函数声明符，因为它们只用于指定函数指针。）\n\
  \n抽象声明符可以是一个或多个 `*` 令牌的序列，表示指针类型推导的序列：\n\n```\n(int ***) exp;\n```\n\n抽象声明符可以像它们的非抽象对应物一样加括号：\n\
  \n```\n(int (*)) exp;\n```\n\n并且一个外层的抽象声明符可以包含一个内层的括号声明符：\n\n```\n(int *(*)) exp;\n\
  ```\n\n这些括号目前是没有意义的。当我们在下一章添加数组时，它们将变得更有用。例如，表达式\n\n```\n(int *[3]) exp;\n```\n\n\
  将 `exp` 转换为一个包含三个指向 `int` 指针的数组，因为抽象数组声明符 `[3]` 的解析优先级更高。这个转换表达式是非法的，因为你不能将表达式转换为数组类型。另一方面，这个表达式是合法的：\n\
  \n```\n(int (*)[3]) exp;\n```\n\n这将 `exp` 转换为一个指向包含三个 `int` 元素的数组的指针；带括号的指针声明符优先级更高，所以数组声明符应用于\
  \ `int`。\n\n我们使用两个语法规则来定义抽象声明符：\n\n```\n<abstract-declarator> ::= \"*\" [<abstract-declarator>]\n\
  \                        | <direct-abstract-declarator>\n<direct-abstract-declarator>\
  \ ::= \"(\" <abstract-declarator> \")\"\n```\n\n一个 `abstract-declarator` 与普通的 `declarator`\
  \ 一样由指针声明符或直接声明符组成。两者之间的区别在于，在抽象指针声明符中内部声明符是可选的。换句话说，`*` 本身是一个有效的抽象声明符，但不是有效的普通声明符。\n\
  \n`direct-abstract-declarator` 是被括号括起来的 `abstract-declarator`。在下一章中，这个符号将也涵盖抽象数组声明符。我们将抽象声明符解析为一个一次性的\
  \ `abstract_declarator` 结构，就像我们处理普通声明符那样的。[Listing 14-9] 定义了该结构。\n\n```\nabstract_declarator\
  \ = AbstractPointer(abstract_declarator)\n                    | AbstractBase\n```\n\
  \n*Listing 14-9：表示抽象声明符的语法*\n\n`AbstractBase` 代表基础情况，即 `*` 令牌后面没有跟随内部声明符。例如，我们将抽象声明符\
  \ `*(*)` 解析为 `AbstractPointer(AbstractPointer(AbstractBase))`。目前，`abstract_declarator`\
  \ 只是告诉我们发现了多少层指针间接（在本例中为两层）。虽然这是一种传达单个数字的相当复杂的方法，但它为下一章的数组声明符奠定了基础。\n\n转换表达式中的类型名是一系列类型说明符，后面紧跟一个可选的抽象声明符，且全部封装在括号内：\n\
  \n```\n<factor> ::= --snip--\n           | \"(\" {<type-specifier>}+ [<abstract-declarator>]\
  \ \")\" <factor>\n           | --snip--\n```\n\n为了处理转换表达式，你需要一个类似于 [Listing 14-7]\
  \ 中的 `process_declarator` 的 `process_abstract_declarator` 函数，将基本类型和一个 `abstract-declarator`\
  \ 转换为类型。这个函数会简单一些；它不会处理声明符，只返回类型。\n\n### 总结\n\n我们涵盖了所有的变化。Listing 14-10 显示了完整的语法，其中变化已加粗。\n\
  \n```\n<program> ::= <declaration>\n<declaration> ::= <variable-declaration> | <function-declaration>\n\
  <variable-declaration> ::= <specifier}+ <declarator>\n<function-declaration> ::=\
  \ <specifier}+ \"(\" <argument-list>\n<argument-list> ::= \"void\" | \"(\" <param>\
  \ {<param>}\n<declarator> ::= <identifier> | <direct-declarator>\n<direct-declarator>\
  \ ::= <declarator>\n<direct-declarator> ::= <identifier> | <simple-declarator>\n\
  <simple-declarator> ::= <identifier>>simple-declarator>\n<simple-declarator> ::=\
  \ <identifier> | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n\
  <simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator> ::= <identifier>\
  \ | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator>\
  \ ::= <identifier> | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n\
  <simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator> ::= <identifier>\
  \ | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator>\
  \ ::= <identifier> | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n\
  <simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator> ::= <identifier>\
  \ | <declarator>\n<simple-declarator> ::= <identifier> | <declarator>\n<simple-declarator>\
  \ ::= <identifier> | <declarator>\n<abstract-declarator> ::= \"*\" [<abstract-declarator>]\
  \ | <direct-abstract-declarator>\n<direct-abstract-declarator> ::= \"(\" <abstract-declarator>\
  \ \")\"\n<unop> ::= \"-\" | \"~\" | \"!\" | \"*\" | \"&\"\n<binop> ::= \"-\" | \"\
  +\" | \"*\" | \"/\" | \"%\" | \"&&\" | \"||\" | \"==\" | \"!=\" | \"<\" | \"<=\"\
  \ | \">\" | \">=\" | \"=\"\n<const ::= <int> | <long> | <uint> | <ulong> | <double>\n\
  <identifier> ::= ? 标识符 ?\n<int> ::= ? 整数令牌 ?\n<long> ::= ? 整数或长整数令牌 ?\n<uint> ::=\
  \ ? 无符号整数令牌 ?\n<ulong> ::= ? 无符号整数或无符号长整数令牌 ?\n<double> ::= ? 浮点常量令牌 ?\n<factor>\
  \ ::= <const> | <identifier> | \"(\" {<type-specifier>}+ [<abstract-declarator>]\
  \ \")\" <factor> | <unop> <factor> | \"(\" <exp> \")\" | <identifier> \"(\" [<argument-list>\
  \ \")\"\n<exp> ::= <factor> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n\
  <param> ::= <exp> {\",\" <param>}\n<type-specifier> ::= \"int\" | \"long\" | \"\
  unsigned\" | \"signed\" | \"double\" | \"static\" | \"extern\"\n<specifier> ::=\
  \ <type-specifier> | \"static\" | \"extern\"\n```\n\n*Listing 14-10：带有指针类型以及解引用和地址运算符的语法*\n\
  \n\n\n\n\n## 语义分析\n\n现在进入语义分析！我们将扩展类型检查器以验证涉及指针的表达式，并推断这些表达式的类型。标识符解析阶段也会发生一些变化；我们将把部分验证逻辑从该阶段移动到类型检查器中。\n\
  \n我们需要检测三种类型的类型错误：\n\n1. 对其不支持的类型应用操作符。例如，你不能对指针进行乘法或除法，也不能对算术值进行解引用。\n2. 对两个不兼容类型的值进行操作。这包括尝试将指针与\
  \ `double` 进行比较等错误。我们遇到这种错误是因为 C 语言通常不允许在指针类型之间进行隐式转换，就像对算术类型那样。\n3. 在需要的地方未使用左值（lvalue）。我们已经要求赋值表达式的左侧必须是左值。现在我们将要求\
  \ `AddrOf` 表达式的操作数也必须是左值。我们还将扩展左值的定义，将解引用指针和变量都包含在内。\n\n第三种错误是我们目前在标识符解析期间处理的。现在从标识符解析阶段中移除此验证；稍后你会将其添加到类型检查器中。（顺便确保标识符解析阶段会遍历新的\
  \ `Dereference` 和 `AddrOf` 表达式。）接下来，我们将更新类型检查表达式的逻辑。\n\n### 指针表达式的类型检查\n\n我们需要调整对几乎所有支持表达式的类型检查方式。让我们从新的\
  \ `Dereference` 和 `AddrOf` 表达式开始。然后，我们将更新现有结构的类型检查逻辑。\n\n### Dereference 和 AddrOf\
  \ 表达式\n\n`Dereference` 表达式必须接受一个指针类型的操作数。它产生的结果类型是操作数所引用的类型（它所指向的类型）。[Listing14-11]\
  \ 展示了如何类型检查 `Dereference` 表达式并为其标注正确的结果类型。\n\n```\ntypecheck_exp(e, symbols):\n\
  \    match e with\n    | --snip--\n    | Dereference(inner) ->\n        typed_inner\
  \ = typecheck_exp(inner, symbols)\n        match get_type(typed_inner) with\n  \
  \      | Pointer(referenced_t) ->\n            deref_exp = Dereference(typed_inner)\n\
  \            return set_type(deref_exp, referenced_t)\n        | _ -> fail(\"Cannot\
  \ dereference non-pointer\")\n```\n\nListing 14-11: 类型检查 Dereference 表达式\n\n我们首先像常一样对表达式的操作数进行类型检查。然后我们查找操作数的类型。如果它是指向某种类型\
  \ `referenced_t` 的指针，我们将 `referenced_t` 设置为整个表达式的结果类型。否则，我们将抛出错误。\n\n要类型检查 `AddrOf`\
  \ 表达式，我们首先检查其操作数是否为左值（即 `Var` 或 `Dereference` 表达式）。然后，我们记录它的结果类型，即指向其操作数类型的指针。[Listing\
  \ 14-12] 展示了如何类型检查 `AddrOf`。\n\n```\n | AddrOf(inner) ->\n        if inner is an\
  \ lvalue:\n            typed_inner = typecheck_exp(inner, symbols)\n           \
  \ referenced_t = get_type(typed_inner)\n            addr_exp = AddrOf(typed_inner)\n\
  \            return set_type(addr_exp, Pointer(referenced_t))\n        else:\n \
  \           fail(\"Can't take address of non-\")\n```\n\nListing 14-12: 类型检查 AddrOf\
  \ 表达式\n\n接下来，我们将更新逻辑以检查 `Equal`、`NotEqual` 以及其他关系操作符（`GreaterThan`、`LessThan`）的表达式。我们处理条件表达式，它们遵循类似的规则。\n\
  \n### 比较和条件表达式\n\n正如你在前面的章节中学到的，比较中的两个操作数必须具有相同的类型，或者至少隐式转换为相同的类型。然而，指针常量是该规则的例外；它们是我们唯一可以隐式转换为指针的表达式。例如，这段代码片段将指针与空常量进行比较：\n\
  \n```\ndouble *d = get_pointer();\nreturn d == 0;\n```\n\n当在这个示例中类型检查 `d` `==` `0`\
  \ 时，我们隐式将 `0` 转换为类型为 `double *` 的空指针。[Listing 14-13] 定义了一个辅助函数来识别空指针常量。\n\n```\n\
  is_null_pointer_constant(e):\n    match e with\n    | Constant(c) ->\n        match\
  \ c with\n        | ConstInt(0) -> True\n        | ConstUInt(0) -> True\n      \
  \  | ConstLong(0) -> True\n        | ConstULong(0) -> True\n        | _ -> False\n\
  \    | _ -> False\n```\n\nListing 14-13: 检查表达式是否为空指针常量\n\n该函数捕获了对空指针常量的三个要求：它必须是一个常量字面量，必须是一个整数，且其值必须为\
  \ 0。（记住，我们对空指针常量的定义比 C 标准更窄；标准允许更复杂的常量表达式以及常量字面量。）\n\n[Listing 14-14] 定义了另一个辅助函数，判断两个表达式（至少一个结果为指针）是否具有兼容的类型。\n\
  \n```\nget_common_pointer_type(e1, e2):\n    e1_t = get_type(e1)\n    e2_t = get_type(e2)\n\
  \    if e1_t == e2_t:\n        return e1_t\n    else if is_null_pointer_constant(e1):\n\
  \        return e2_t\n    else if is_null_pointer_constant(e2):\n        return\
  \ e1_t\n    else:\n        fail(\"Expressions have incompatible types\")\n```\n\n\
  \n\n\n\n#### 列表 14-14：获取两个表达式的公共类型，其中至少一个为指针类型\n\n当操作指针的表达式期望两个操作数都具有相同类型时，`get_common_pointer_type`\
  \ 将决定该类型应该是什么。如果它的参数类型不同，且其中任何一个都不是空指针常量，则它们是不兼容的，因此我们抛出一个错误。\n\n现在我们已经定义了 `get_common_pointer_type`，终于可以对\
  \ `Equal` 和 `NotEqual` 表达式进行类型检查了。列表 14-15 展示了如何对 `Equal` 表达式进行类型检查；我们将以相同的方式处理\
  \ `NotEqual`。\n\n```python\ntypecheck_exp(e, symbols):\n    match e with\n    |\
  \ --snip--\n    | Binary(Equal, e1, e2) ->\n        typed_e1 = typecheck_exp(e1,\
  \ symbols)\n        typed_e2 = typecheck_exp(e2, symbols)\n        t1 = get_type(typed_e1)\n\
  \        t2 = get_type(typed_e2)\n        if t1 or t2 is a pointer type:\n     \
  \     ❶ common_type = get_common_pointer_type(typed_e1, typed_e2)\n        else:\n\
  \          ❷ common_type = get_common_type(t1, t2)\n        converted_e1 = convert_to(typed_e1,\
  \ common_type)\n        converted_e2 = convert_to(typed_e2, common_type)\n     \
  \   equality_exp = Binary(Equal, converted_e1, converted_e2)\n        return set_type(equality_exp,\
  \ Int)\n```\n\n#### 列表 14-15：对 Equal 表达式进行类型检查\n\n这遵循类型检查比较的常规模式：检查两个操作数，找到它们的公共类型，将它们都转换为该类型，然后将结果的类型设置为\
  \ `Int`。与之前章节的区别在于我们如何寻找公共类型。如果任一操作数是指针，我们使用刚刚定义的辅助函数 ❶。否则，我们将坚持 `get_common_type`\
  \ ❷。\n\n当我们将两个操作数转换为公共指针类型时，将看到三种可能的结果之一：\n\n1. 两个操作数已经具有相同类型，因此任何 `convert_to`\
  \ 调用都不会产生影响。\n2. 一个操作数是空指针常量，我们隐式将其转换为另一个操作数的类型。\n3. 操作数的类型不兼容，因此 `get_common_pointer_type`\
  \ 抛出一个错误。\n\n我们将使用类似的逻辑来检查条件表达式。表达式 `cond ? clause1 : clause2` 中的第二个和第三个操作数与 `Equal`\
  \ 或 `NotEqual` 表达式中的操作数受到相同的类型约束。如果其中一个是指针，我们将验证两个操作数并使用 `get_common_pointer_type`\
  \ 找到它们的公共类型，然后将它们转换为该类型。`cond` 表达式可以是指针也可以算术值，因为我们可以以任种方式将其与零进行比较。\n\n### 仿佛通过赋值的转换\n\
  \n接下来，我们将处理赋值。首先，验证赋值的左侧是一个左值（lvalue）。然后，我们将右侧转换为左侧的类型，如果转换非法则失败。“仿佛通过赋值”出现在几个地方，而不是在赋值表达式中，因此我们将再写另一个辅助函数。\n\
  \n```python\nconvert_by_assignment(e, target_type):\n    if get_type(e) == target_type:\n\
  \        return e\n    if get_type(e) is arithmetic and target_type is arithmetic:\n\
  \        return convert_to(e, target_type)\n    if is_null_constant(e) and target_type\
  \ is pointer:\n        return e\n    fail(\"Cannot convert\")\n\n#### 列表 14-16：按赋值方式转换表达式\n\
  \n这里的规则并不出乎意料：我们可以为相同类型的对象赋值，可以隐式地将任何算术类型转换为任何指针类型。否则，我们将抛出一个错误。我们将使用这个辅助函数来转换赋值的右侧，以及其他几个地方。为了检查函数调用的类型，我们将使用\
  \ `convert_by_assignment` 将每个参数转换为对应参数的类型。我们还将其用于变量初始化器，以检测具有无效类型的初始化器，例如：\n\n```python\n\
  int *d = 2.0;\n```\n\n最后，我们将使用 `convert_by_assignment` 将 `return` 语句中的值转换为函数的返回类型，并检测返回错误类型的函数，如\
  \ [14-17]。\n\n```python\nint *bad_pointer(void) {\n    return 2.0;\n}\n```\n\n####\
  \ 列表 14-17：返回不兼容类型值的函数\n\n以后当我们实现 `void` 时，我们将扩展 `get_common_pointer_type` 和 `convert_by_assignment`\
  \ 以接受向从 `void` 的隐式转换。\n\n### 其他表达式\n\n除了 `Equal` 和 `NotEqual` 之外，我们还需要处理转换表达式、一元运算符和二进制运算符。让我们从转换开始。正如你之前学到的，将指针转换为\
  \ `double` 或将 `double` 转换为指针都是非法的。如果你的类型检查遇到这种转换，它应该抛出一个错误。\n\n\n\n\n二元运算符以多种不同的方式处理指针。首先，我们有布尔\
  \ `And` 和 `Or` 运算符。这些运算符的类型检查逻辑不会改变。与 `Not` 一样，它们都接受指针。由于它们不会将操作数转换为公共类型，因此可以在指针和算术操作数的任何组合上运行。\n\
  \n另一方面，算术运算符 `Multiply`、`Divide` 和 `Remainder` 不接受指针。对指针类型的操作数应用其中任何一个都会产生错误。指针的加法和减法是合法的，与\
  \ `GreaterThan`、`LessThan`、`GreaterOrEqual` 和 `LessOrEqual` 进行比较也是，但我们将在下一章再实现它们。它们不会出现在本章的测试中。目前，你的编译器可以假设它永远不会看到这些表达式，也可以显式地拒绝它们。\n\
  \n### 在符号表中跟踪静态指针初始化器\n\n现在我们来谈谈静态初始化器。指针类型的静态变量和非静态变量一样，可以初始化为空指针：\n\n```\nstatic\
  \ int *ptr = 0;\n```\n\n因此，我们需要一种方法在符号表中将空指针表示为 `static_init`。我们不会为空指针定义专门的结构，而是将使用\
  \ `ULongInit(0)` 初始化器，因为指针是无符号 64 位整数。\n\n用其他静态变量的地址来初始化指针类型的静态变量也是合法的：\n\n```\n\
  static int a;\nstatic int *a_ptr = &a;\n```\n\n然而，我们的实现不支持这种静态初始化器；我们已经决定常量字面量是我们将接受的唯一静态初始化器。\n\
  \n### TACKY 生成\n\n我们将在本章中引入三个处理指针的新 TACKY 指令。第一个 `GetAddress` 对应于 AST 中的 `AddrOf`\
  \ 运算符：\n\n```\nGetAddress(val src, val dst)\n```\n\n该指令将 `src` 的地址（它必须是一个变量，而不是常量）复制到\
  \ `dst`。我们还会添加两条指令来解引用指针：\n\n```\nLoad(val src_ptr, val dst)\nStore(val src, val\
  \ dst_ptr)\n```\n\n`Load` 指令接受内存地址 `src_ptr` 作为其源操作数。它获取该内存地址处的当前值并将其拷贝到 `dst`。`Store`\
  \ 指令接受内存地址 `dst_ptr` 作为其目标操作数，并将 `src` 的值写入该地址。列表 14-18 定义了完整的 TACKY IR，其中三个新指令已加粗显示。\n\
  \n```\nprogram = Program(top_level*)\ntop_level = Function(identifier, bool global,\
  \ identifier* params, instruction* body)\n          | StaticVariable(identifier,\
  \ bool global, type t, static_init init)\ninstruction = Return(val)\n          \
  \  | SignExtend(val src, val dst)\n            | Truncate(val src, val dst)\n  \
  \          | ZeroExtend(val src, val dst)\n            | DoubleToInt(val src, val\
  \ dst)\n            | DoubleToUInt(val src, val dst)\n            | IntToDouble(val\
  \ src, val dst)\n            | UIntToDouble(val src, val dst)\n            | Unary(unary_operator,\
  \ val src, val dst)\n            | Binary(binary_operator, val src, val dst)\n \
  \           | Copy(val src, val dst)\n            | GetAddress(val src, val dst)\n\
  \            | Load(val src_ptr, val dst)\n            | Store(val src, val dst_ptr)\n\
  \            | Jump(target)\n            | JumpIf(val condition, target)\n     \
  \       | JumpIfNot(val condition, target)\n            | Label(target)\n      \
  \      | FunCall(identifier_name, val args, val dst)\n            | Constant(val)\
  \ | Var(identifier)\nunary_operator = Complement | Negate\nbinary_operator = Add\
  \ | Subtract | Multiply | Divide | Remainder | Equal | NotEqual | LessThan | LessOrEqual\
  \ | GreaterThan | GreaterOrEqual\n```\n\n\n\n最后，让我们考虑 `AddrOf` 表达式。如果它的操作数是一个变量，我们将通过\
  \ `GetAddress` 获取指向它的指针。因此，我们将 `&var` 翻译为：\n\n```\nresult = GetAddress(var)\n```\n\
  \n但如果操作数是一个被解引的指针，那么外层的 `AddrOf` 还是内部的 `Dereference` 表达式都不会被求值。当我们看到形式为 `&*<exp>`\
  \ 的表达式时，我们只将内部的 `<exp>` 翻译为 TACKY。\n\n### TACKY 转换策略\n\n为了管理所有这些不同的情况，我们将使用两个不同的函数将表达式转换为\
  \ TACKY。第一个是我们现有的 `emit_tacky` 函数。该函数将不再返回 TACKY 操作数，而是返回一个新构造体 `exp_result`，它表示一个尚未经过左值转换（lvalue\
  \ converted）的表达式结果。第二个函数 `emit_tacky_and_convert` 将调用 `emit_tacky`，对结果进行左值转换（如果它是左值而非常量），并将其作为\
  \ TACKY 操作数返回。在大多数语文中，我们将使用 `emit_tacky_and_convert` 处理表达式。但对于不应进行左值转换的表达式——例如赋值表达式的左侧——我们将直接调用\
  \ `emit_tacky`。\n\n首先，让我们定义 `exp_result`：\n\n```\nexp_result = PlainOperand(val)\
  \ | DereferencedPointer(val)\n```\n\n正如名称所示，`DereferencedPointer` 代表由解引指针所指示的对象。它接受一个参数：一个指针类型的\
  \ TACKY 操作数。`PlainOperand` 代表一个普通的常量或变量。它的参数是任意类型的 TACKY 操作数。`exp_result` 构造体本身并不是一个\
  \ TACKY 操作数，因此它不会出现在 TACKY 指令中。它只是只是帮助我们处理 `AddrOf` 和赋值表达式，这些表达式操作的是对象而非值。对于这些表达式中的每一个，我们都会根据其操作数是解引指针还是普通变量来生成不同的指令。在随后的章节中，我们还会添加更多解引指针的运算符，例如数组下标和用于访问结构体成员的\
  \ `->` 运算符。到那时，`DereferencedPointer` 构造函数将特别有用，因为它能让我们以统一的方式表示所有这些不同运算符的结果。\n\n\
  现在，让我们更新 `emit_tacky`。我们将对该函数进行几处更改。首先，在目前所有对子表达式递归调用 `emit_tacky` 的地方（赋值表达式的左侧除外），我们将改为调用\
  \ `emit_tacky_and_convert`。该函数将子表达式转换为 TACKY，然后对结果进行左值转换。其次，在每处目前返回 TACKY 操作数的地方，我们将该操作数封装在\
  \ `PlainOperand` 构造函数中。列表 14-21 显示了如何处理一元表达式，其中本章的更改已加粗。\n\n```\nemit_tacky(e, instructions,\
  \ symbols):\n    match e with\n    | Unary(op, inner) ->\n        src = emit_tacky_and_convert(inner,\
  \ instructions, symbols)\n        dst = emit_tacky_and_convert(e, instructions)\n\
  \        tacky_op = op\n        instructions.append(Unary(tacky_op, dst))\n    \
  \    return PlainOperand(dst)\n```\n[列表 14-21: 将一元表达式翻译为 TACKY] 我们对 `emit_tacky`\
  \ 目前处理的所有类型的表达式进行相同的更改。接下来，让我们处理 `Dereference` 表达式。列表 14-22 展示了如何在 `emit_tacky`\
  \ 中处理这些表达式。\n\n```\n | Dereference(inner) ->\n    result = emit_tacky_and_convert(inner,\
  \ instructions, symbols)\n    return DereferencedPointer(result)\n```\n[列表 14-22:\
  \ 将 Dereference 表达式翻译为 TACKY] 为了处理这个表达式，我们首先处理并对其操作数进行左值转换。这产生一个指针类型的 TACKY 操作数，我们返回一个\
  \ `DereferencedPointer` 来表示 `result` 指向的对象。在 `emit_tacky` 返回一个 `exp_result` 后，我们对其进行赋值、获取其地址，或者对其进行左值转换。列表\
  \ 14-23 说明了如何处理赋值。\n\n```\n | Assignment(left, right) ->\n    ❶ lval = emit_tacky(left,\
  \ instructions, symbols)\n    ❷ rval = emit_tacky_and_convert(right, instructions,\
  \ symbols)\n    match lval with\n    | PlainOperand(obj) ->\n        ❸ instructions.append(Copy(rval,\
  \ obj))\n        return lval\n    | DereferencedPointer(ptr) ->\n        ❹ instructions.append(Store(rval,\
  \ ptr))\n        return PlainOperand(rval)\n```\n[列表 14-23: 将赋值表达式翻译为 TACKY] 我们没有对赋值表达式的左侧进行左值转换\
  \ ❶，但对右侧进行了左值转换 ❷。如果左侧是 `PlainOperand`，我们像前面的章节一样发布一个 `Copy` 指令 ❸。如果它是 `DereferencedPointer`，我们发布一个\
  \ `Store` 指令写入内部指针指示的位置 ❹。请注意，即使我们通过指针进行赋值，我们也返回一个 `PlainOperand` 作为结果。这是因为赋值表达式的结果是左侧存储的值，而不是对象本身。\n\
  \n我们使用类似的模式来处理 `AddrOf`。列表 14-24 出了伪代码。\n\n```\n | AddrOf(inner) ->\n    ❶ v = emit_tacky(inner,\
  \ instructions, symbols)\n    match v with\n    | PlainOperand(obj) ->\n       \
  \ dst = make_tacky_variable(get_type(e), symbols)\n        ❷ instructions.append(GetAddress(obj,\
  \ dst))\n        return PlainOperand(dst)\n    | DereferencedPointer(ptr) ->\n \
  \       ❸ return PlainOperand(ptr)\n```\n\n\n\n#### 列表 14-24：将 AddrOf 表达式翻译为 TACKY\n\
  \n我们处理表达式的操作数时不对其进行左值转换 ❶，然后对结果进行模式匹配以决定如何继续。如果是一个普通值，我们发射一条 `GetAddress` 指令 ❷。如果它是一个解引用指针，我们去掉解引用并返回指针\
  \ ❸。\n\n最后，在 [Listing 14-25] 中，我们定义了 `emit_tacky_and_convert`，它执行左值转换。\n\n```\n\
  emit_tacky_and_convert(e, instructions, symbols):\n    result = emit_tacky(e, instructions,\
  \ symbols)\n    match result with\n    | PlainOperand(val) -> return val\n    |\
  \ DereferencedPointer(ptr) ->\n        dst = make_tacky_variable(get_type(e), symbols)\n\
  \        instructions.append(Load(ptr, dst))\n        return dst\n```\n\n#### 列表\
  \ 14-25：将表达式翻译为 TACKY 并执行左值转换\n\n为了对解引用指针进行左值转换，我们将使用 `Load` 指令获取其值。其他操作数可以原样返回，无需发射任何额外的指令。一个*完整表达式*（不属于另一个表达式的部分）始终会经过左值转换。这意味着你应该使用\
  \ `emit_tacky_and_convert` 而不是 `emit_tacky` 来处理完整表达式并获取其结果。例如，你将使用 `emit_tacky_and_convert`\
  \ 来处理循环和 `if` 语句中的控制表达式。\n\n某些完整表达式的结果——特别是表达式语句以及 `for` 循环头中的第一句和第三句——是不会被使用的。作为一种优化，你可以使用\
  \ `emit_tacky` 处理这些表达式，这将为你节省一条不必要的 `Load` 指令。\n\n在结束本节之前，我们将实现到指针类型和从指针类型到类型转换。为了转换的目的，我们将指针类型处理得完全等于\
  \ `unsigned long`。例如，我们使用 `SignExtend` 指令从 `int` 转换为任何指针类型，并使用 `Truncate` 从指针类型转换为\
  \ `int`。其他表达式（如逻辑操作和比较）的 TACKY 实现保持不变。\n\n### 汇编代码生成\n\n在上一节中，我们添加了 `Load` 和 `Store`\
  \ 指令，允许我们读内存和写内存。这意味着 TACKY 终于跟上了汇编语言，我们自 [Chapter 2] 以来一直在使用它来读写内存。例如，操作数 `-4(%rbp)`\
  \ 标识内存中的一个位置，我们可以通过 `mov` 指令对其进行读写。\n\n不过，RBP 并没有什么特殊；我们可以通过存储在任何寄存器中的地址访问内存。以下是从存储在\
  \ RAX 寄存器中的地址读取值并复制到 RCX 的方法：\n\n```\nmovq    (%rax), %rcx\n```\n\n注意 `(%rax)` 等于\
  \ `0(%rax)`。\n\n汇编 AST 将稍微改变以处理类似 `-4(%rbp)` 的操作数。\n\n\n\n\n```\nprogram = Program(top_level*)\n\
  assembly_type = Longword | Quadword | Double\ntop_level = Function(identifier name,\
  \ bool global, instruction* instructions)\n          | StaticVariable(identifier\
  \ name, bool global, int alignment, static_init init)\n          | StaticConstant(identifier\
  \ name, int alignment, static_init init)\ninstruction = Mov(assembly_type, operand\
  \ src, operand dst)\n            | Movsx(operand src, operand dst)\n           \
  \ | MovZeroExtend(operand src, operand dst)\n            | Lea(operand src, operand\
  \ dst)\n            | Cvttsd2si(assembly_type dst_type, operand src, operand dst)\n\
  \            | Cvtsi2sd(assembly_type src_type, operand src, operand dst)\n    \
  \        | Unary(unary_operator, assembly_type, operand)\n            | Binary(binary_operator,\
  \ assembly_type, operand, operand)\n            | Cmp(assembly_type, operand, operand)\n\
  \            | Idiv(assembly_type, operand)\n            | Div(assembly_type, operand)\n\
  \            | Cdq(assembly_type)\n            | Jmp(identifier)\n            |\
  \ JmpCC(cond_code, identifier)\n            | SetCC(cond_code, operand)\n      \
  \      | Label(identifier)\n            | Push(operand)\n            | Call(identifier)\n\
  \            | Ret\n\nunary_operator = Neg | Not | Shr\nbinary_operator = Add |\
  \ Sub | Mult | DivDouble | And | Or | Xor\noperand = Imm(int) | Reg(reg) | Pseudo(identifier)\
  \ | Memory(reg, int) | Data(identifier)\ncond_code = E | NE | G | GE | L | LE |\
  \ A | AE | B | BE\nreg = AX | CX | DX | DI | SI | R8 | R9 | R10 | R11 | SP | BP\n\
  \    | XMM0 | XMM1 | XMM2 | XMM3 | XMM4 | XMM5 | XMM6 | XMM7 | XMM14 | XMM15\n```\n\
  \n列表 14-26：带有 `Memory` 操作数、`BP` 寄存器和 `Lea` 指令的汇编 AST\n\n当我们将其他 TACKY 指令翻译为汇编时，会将指针类型完全等同于\
  \ `unsigned long`。我们将指针类型转换为 `Quadword` 汇编类型，使用 `cmp` 指令比较指针，在 `RAX` 寄存器中传递指针类型的返回值，并与整数参数使用相同的通用寄存器传递指针类型的参数。\n\
  \n我们还将进行一个完全机械的变化：在之前所有使用 `Stack()` 操作数的地方，我们将改用 `Memory(BP, )`。表 14-1 到 14-3 总结了本章对\
  \ TACKY 到汇编转换的更新；按照惯例，新的构造和对现有构造转换的更改均已**加粗**显示。\n\n表 14-1：将顶层 TACKY 构造转换为汇编\n\n\
  | TACKY 顶层构造 | 汇编顶层构造 |\n| --- | --- |\n| | |\n\n```\nFunction(name, global, params,\n\
  \          instructions)\n```\n\n |\n\n```\nFunction(name, global, \n          [Mov(<first\
  \ int param type>, Reg(DI), \n               <first int param>),\n          Mov(<second\
  \ int param type>, Reg(SI), \n               <second int param>),\n           <copy\
  \ next four integer parameters from registers>,\n           Mov(Double, Reg(XMM0)),\n\
  \           Mov(Double, Reg(XMM1)),\n           <copy next four integer parameters>,\n\
  \           Mov(type, Memory(BP)),\n           Mov(type, Memory(BP)),\n        \
  \   <copy remaining stack)\n```\n\n表 14-2：将 TACKY 指令转换为汇编\n\n| TACKY 指令 | 汇编指令 |\n\
  | --- | --- |\n| | |\n\n```\nLoad(ptr, dst)\n```\n\n | |\n\n```\nMov(Quadword, Reg(R))\n\
  Mov(dst, Memory(BP))\n```\n\n | |\n\n```\nMov(Quadword, Reg(R))\nMov(src, Memory(BP))\n\
  ```\n\n | |\n\n```\nLea(src, dst)\n```\n\n表 14-3：类型转换\n\n| 源类型 | 汇编类型 | 对齐 |\n|\
  \ --- | --- | --- |\n| | | |\n\n| Pointer(t) | Quadword | 8 |\n\n接下来，我们将更新伪寄存器替换和指令修复。\n\
  \n### 用内存替换伪寄存器\n\n在这一趟处理过程中，我们将使用新的 `Memory` 操作数代替旧的 `Stack` 操作数。我们还将扩展此阶段，以替换\
  \ `lea` 指令中的伪寄存器。我们不会进行任何其他更改。当我们将 TACKY 变量转换为伪寄存器时，为它们分配了 `Quadword` 类型；现在我们将像往常一样分配栈空间。\n\
  \n### 修复 lea 和 push 指令\n\n`lea` 指令的目标必须是寄存器；我们将按照通常的方式对其进行重写。我们还将为 `push` 指令添加一个新的重写规则。正如我在上一章中提到的，`push`\
  \ XMM 寄存器是不合法的，因此我们将重写如下指令：\n\n```\npushq %xmm0\n```\n\n为：\n\n```\nsubq $8, %rsp\n\
  movsd %xmm0, (%rsp)\n```\n\n\n\n\n由于我们没有生成任何操作 XMM 寄存器的 `push` 指令，这条重写规则目前还没有严格的。一旦我们在第三部分中实现寄存器分配，它就会变得必要；届时，目前存储在内存中的值可能会被分配到\
  \ XMM 寄存器。\n\n### 代码发射\n\n最后一个任务是更新代码发射阶段，以处理新的 `Lea` 指令、`Memory` 操作数和 `BP` 寄存器。表\
  \ 14-4 和 14-5 总结了如何打印这些新结构。（我没有在这些表格中对新结构和更改加粗，因为这三个结构完全是全新的。）\n\n**表 14-4：格式化汇编指令**\n\
  \n| 汇编指令 | 输出 |\n| --- | --- |\n| `Lea(src, dst)` | |\n```\nleaq    <src>, <dst>\n\
  ```\n| | |\n\n**表 14-5：格式化汇编操作数**\n\n| 汇编操作数 | 输出 |\n| --- | --- |\n| `Reg(BP)`\
  \ | `%rbp` |\n| `Memory(reg, int)` | `<int>(<reg>)` |\n\n在 `Memory` 操作数的基寄存器和 `Lea`\
  \ 指令的目标寄存器中，我们将始终使用 8 字节别名，因为内存地址是 8 字节整数。\n\n当 `Memory` 操作数中的偏移为零时，你可以打印它或省略它；`(%rax)`\
  \ 和 `0(%rax)` 是同样有效的的。\n\n### 总结\n\n在本章中，你为编译器添加了对指针的支持。你学习了如何将复杂的声明符解析为派生类型，以及如何对指针操作进行类型检查。在生成\
  \ TACKY 时，你建立了一种统一的方法来处理指针解引用表达式，无论它们如何被使用。在后端，你对现有的、相对于 RBP 地址访问内存的 `Stack` 操作数进行了微调，使其能够与存储在任何寄存器中的地址工作。\n\
  \n在下一章中，你体将实现数组，这是你的第一个非标量类型。你还将实现数组下标和指针算术，并探索它们等价的方式。由于指针和数组关系紧密，本章介绍的概念、技术和指令在下一章中也将至关重要。\n\
  \n![](img/pg382.jpg)\n\n描述\n\n## 15 数组与指针算术\n\n![](img/opener-img.jpg)\n\n在本章中，你将实现数组类型。你还将添加程序员处理数组时使用的语言特性：复合初始化器、下标运算符和指针算术。数组和指针是不同但密切密切的类型。许多数组类型的表达式会隐式转换为指针，许多指针操作（如下标访问）旨在对数组元素的指针进行操作。因此，为了支持数组，你将在上一章中添加的指针支持的基础上进行构建。\n\
  \n类型检查器在这里起着至关重要的作用。它将处理从数组到指针的隐式转换，并在 AST 上标注你执行指针算术时将依赖的类型信息。一旦类型检查器完成了所有艰苦的工作，在生成\
  \ TACKY 期间将下标运算符和复合初始化器分解为简单的指针操作将变得容易。你不会在本章中添加任何新的汇编指令，但你将引入新的操作数来表示内存中的对象以及这些对象中的元素。\n\
  \n和往常一样，我们将概述将添加的语言结构。我们将特别关注指针和数组之间的关系，以及这种关系如何在指针算术中体现。这是 C 语言中一个特别令人困惑的方面，也是我们在此工作的关键。\n\
  \n### 数组与指针算术\n\n让我们先定义几个术语。在上一章中，我们将知道的每个对象类型分为两类：算术类型和非算术类型。现在我们将引入另一种区分。*标量类型*表示单一值。我们实现的指针和算术类型都是标量类型。*聚合类型*表示值的集合。数组是聚合类型；结构也是如此，我们将在[18]\
  \ 中实现结构。*数组中的所有值都具有相同的类型，即数组的元素类型*。\n\n#### 数组声明与初始化\n\n当我们声明一个数组时，需要指定它的元素类型和包含的元素数量。例如，我们可以声明一个包含三个\
  \ `int` 对象的数组：\n\n```\nint int_array[3];\n```\n\n或者我们可以声明一个包含五个指向 `double` 指针的数组：\n\
  \n```\ndouble *(ptr_array[5]);\n```\n\n（记住，我们在解释声明时从基本类型开始——在本例中为 `double`——然后从外向内应用类型推导。）\n\
  \n这两个示例都使用了标量元素类型，但我们也可以使用聚合元素类型。下面的示例声明了一个包含三个元素的数组，其中每个元素本身是一个包含两个 `long` 对象的数组：\n\
  \n```\nlong nested_array[3][2];\n```\n\n这种数组的数组被称为*多维数组*。注意，我们仍然从外向内应用类型推导来确定该数组的类型。我们从基本类型\
  \ `long` 开始，应用由 `[2]` 指定的推导得到“两个 `long` 对象的数组”类型，然后应用由 `[3]` 指定推导得到“三个两个 `long`\
  \ 对象的数组的数组”类型。\n\n你可以使用*复合初始化器*来初始化数组，该初始化器为每个元素指定一个初始值：\n\n```c\nint int_array[3]\
  \ = {1, foo(), a * 4};\n```\n\n你可以使用嵌套的复合初始化器来初始化多维数组：\n\n```c\nlong nested_array[3][2]\
  \ = {{a, a + 1}, {3l, -4}, {foo(), 6}};\n```\n\n\n\n\n在这里，三个嵌套复合初始化器初始化了外部数组的三个元素。这三个元素中的每一个本身都是包含两个\
  \ `long` 对象的数组。这些元素中的每一个嵌套初始化器指定了两个算术值（可以隐式转换为 `long`）。\n\n你也可以让数组不初始化。如果它具有自动存储期，则其初始值是未定义的；如果它具有静态存储期，它将被初始化为全零。换句话说，我们处理未初始化数组的方式与处理未初始化标量对象完全一样。\n\
  \n### 数组的内存布局\n\n此时，讨论一下平面数组和多维数组的内存布局会有帮助。如果你声明了一个包含 `n` 个对象的数组，这 `n` 个对象将顺序排列在内存中。考虑列表\
  \ 15-1 中的数组，它具有标量元素类型。\n\n```\nint six_ints[6] = {1, 2, 3, 4, 5, 6};\n```\n\n列表\
  \ 15-1：标量值数组\n\n图 15-1 展示了 `six_ints` 在初始化后在内存中可能的样子（图中的内存地址仅用于说明；它们在真实系统上是无效的）。\n\
  \n![](img/fig15-1.jpg)\n\n图 15-1：`six_ints 在内存中的布局` 描述\n\n将此声明与列表 15-2 进行比较，后者声明了一个与\
  \ `six_ints` 具有相同数量和类型标量元素的多维数组。\n\n```\nint three_arrays[3][2] = {{1, 2}, {3, 4},\
  \ {5, 6}};\n```\n\n列表 15-2：嵌套数组\n\n存储 `three_arrays` 的内存看起来也像图 15-1。在内存中，没有迹象表明一个元素何时结束、另一个元素何时开始，因此这两个数组是无法区分的。尽管\
  \ `three_arrays` 的嵌套结构不影响它在内存中的布局，但它会影响你访问单个数组元素的方式，正如我们很快将看到的。\n\n### 数组到指针的退化（Array-to-Pointer\
  \ Decay）\n\n一旦我们定义并初始化了一个数组，能对它做什么呢？事实证明，没多少。事实上，数组类型对象只有两种有效操作。首先，我们可以使用 `sizeof`\
  \ 运算符获取数组的大小，我们将在第 17 章中实现它。其次，我们可以使用 `&` 运算符获取它的地址：\n\n```\nint my_array[3] = {1,\
  \ 2, 3};\nint (*my_pointer)[3] = &my_array;\n```\n\n就此而已！数组上没有其他有效操作。这听起来可能很荒谬，因为\
  \ C 程序一直在读写数组元素。这里到底发生了什么？C 标准（第 6.3.2.1 节，第 3 段）为这个谜团提供了解决方案：“除了 `sizeof` 运算符的操作数或单元运算符\
  \ `&` 外……类型为‘*类型* 数组’的表达式被转换为类型为‘指向*类型* 的指针’的表达式，该指针指向数组对象的初始元素且不是一个左值（lvalue）。”\n\
  \n这种从数组到指针的隐式转换被称为数组到指针的退化（array-to-pointer decay）（我有时会说数组退化为指针，有时说它被隐式转换为指针。两者的意思相同）。虽然我们对数组做不了什么，但我们可以对指针执行所有各种有用的操作。我们已经实现了一些这些操作，并在本章中将增加几个。列表\
  \ 15-3 中的代码展示了数组退化的示例。\n\n```\nint my_array[3] = {1, 2, 3};\nint *my_pointer = my_array;\n\
  return *my_pointer;\n```\n\n列表 15-3：将数组隐式转换为指针\n\n假设 `my_array` 从地址 `0` 开始。当 `my_array`\
  \ 出现在赋值语句右侧时，它会被隐式转换为一个类型为 `int *` 且值为 `0` 的指针。我们可以将此指针的值赋值给 `my_pointer`。赋值操作将覆盖该对象当前的值\
  \ `1`。注意，地址 `0` 可以根据其类型解释为几种不同的方式。作为 `int *`，它指向数组，我们可以通过指针解引用来读取或写入它。表达式 `my_array`\
  \ 具有相同的值 `0`，但它的类型是 `int (*3]`。\n\n在处理多维数组时，跟踪指针的类型特别为重要。考虑列表 15-4，它尝试向两个数组元素赋值。\n\
  \n```\nint nested_array[2][2] = {{1, 2}, {3, 4}};\n**nested_array = 10;\n*nested_array\
  \ = 0;\n```\n\n列表 15-4：对数组元素的合法与非法的赋值\n\n第一个赋值表达式（向 `*nested_array` 赋值）是有效的。首先，我们隐式地将变量\
  \ `nested_array` 转换为数组初始元素的指针。该元素类型为 `int[2]`，因此指针的类型是 `int(*)[2]`。对该指针进行第一次解引用操作得到一个类型为\
  \ `int[2]` 的数组对象。我们隐式地将*这个*数组转换为类型为 `int *` 的指针。因此，第二次指针解引用产生一个 `int` 对象，我们可以对其赋值。赋值表达式覆盖了该对象当前的值\
  \ `1`，赋予新值 `10`。该表达式中的 `int(*)[2]` 和 `int *` 指针都指向 `nested_array` 的起始位置；仅类型不同。\n\
  \n\n\n\n\n下一个赋值给 `nested_array` 的赋值表达式是非法的。它的起始过程与之前相同：我们隐式地将 `nested_array` 转换为类型为\
  \ `int(*)[2]` 的指针，对其进行解引用，并将结果隐式地转换为类型为 `int *` 的指针。然后我们尝试直接给此指针赋值，但 C 标准规定这种隐式转换的结果“不是一个左值（lvalue）”，因此我们无法对其进行赋值。即使允许这种赋值，也不清楚这种赋值会发生什么；它就像是给\
  \ `&` 操作的结果赋值一样。\n\n现在我们已经知道如何访问任何维度下数组的初始元素。我们甚至可以读写数组中的初始标量对象。然而，我们通常也想访问数组的其他元素。为此，我们需要使用指针算术。\n\
  \n### 使用指针算术访问数组元素\n\n一旦我们拥有数组初始元素的指针，我们就可以使用指针加法来生成指向其其他元素的指针。让我们来看 Listing 15-5\
  \ 中的示例。\n\n```\nint array[3] = {1, 2, 3};\nint *ptr = array + 1;\n```\n\n`Listing\
  \ 15-5: 使用指针算术访问数组后续元素`\n\n我们将再次使用 `0x10` 作为数组的起始地址。在表达式 `array + 1` 中，变量 `array`\
  \ 如常退化为指向数组初始元素的指针。当我们将此指针加上 `1` 时，结果是指向数组中下一个 `int` 元素的指针。由于每个 `int` 占用 4 字节，我们需要将\
  \ `1` 乘以比例 4，以计算出为 `array` 地址增加多少字节。得到的指针值为 `0x14`。如果我们对此指针进行解引用，将得到地址 `0x14` 处的\
  \ `int` 对象，其当前值为 `2`。数组元素索引从 0 开始，因此我们说 `array` 的初始元素位于索引 0，下一个元素位于索引 1。\n\n更通用地说，当给指针加上整数\
  \ `n` 时，结果是向数组中向后 `n` 个位置另一个数组元素的指针。同样，我们可以通过减去一个整数（或加上一个负整数）在数组向后移动。如果结果在任何方向上超出了数组边界，其行为是未定义的。\n\
  \n> **注意**\n\n> 如果 `x` 是一个包含 `n` 个元素的数组，`x + n` 指向 `x` 结束之后的位置。这个指针是一个特殊情况。它不被认为越界，你可以在指针算术中使用它。例如，你可以将其与同一数组中其他元素的指针进行比较。（在遍历数组元素时，这是测试是否已到达末尾的一种有用方法。）但对其进行解引用是未定义行为，因为它并不指向数组的元素。\n\
  \n当我们执行指针算术时，我们指向的数组的嵌套结构至关重要，因为它决定了什么被视为单个元素。让我们来看 Listing 15-6，看看这在 Listings 15-1\
  \ 和 15-2 中定义的两个数组上是如何运作。\n\n```\nint six_ints[6] = {1, 2, 3, 4, 5, 6};\nint three_arrays[3][2]\
  \ = {{1, 2}, {3, 4}, {5, 6}};\nint *ptr = six_ints + 1;\nint (*ptr)[2] = three_arrays\
  \ + 1;\n```\n\n`Listing 15-6: 嵌套数组的指针算术`\n\n表达式 `six_ints + 1` 的结果是指向 `six_ints`\
  \ 中索引为 1 的元素的指针。该元素是一个值为 `2` 的 `int`。同样，当我们计算 `three_arrays + 1` 时，我们得到一个指向 `three_arrays`\
  \ 中索引为 1 的元素的指针。在这种情况下，该元素是一个包含两个 `int` 对象的数组`{3, 4`。尽管 `six_ints` 和 `three_arrays`\
  \ 的内容可能相同，但对两者执行相同的操作会产生截然不同的结果。\n\n那么，我们该如何访问 `three_arrays` 中的标量对象呢？例如，我们该如何读取该数组中的最后一个\
  \ `int`（其值为 `6`）？首先，我们将获取一个指向 `three_arrays` 最后一个元素的指针：\n\n```\nint (*outer_ptr)[2]\
  \ = three_arrays + 2;\n```\n\n这指向包含两个元素的数组 `{5, 6}`。我们将对其进行解引用，以获取指向单个元素的指针：\n\n\
  ```\nint *inner_ptr = *outer_ptr;\n```\n\n此解引用表达式产生一个类型为 `int[2]` 的数组，它会退化为类型为 `int\
  \ *` 的指针。现在 `inner_ptr` 指向该嵌套数组中的第一个 `int`，其值为 `5`。我们将将其递增，以指向下一个 `int`，其值为 `6`：\n\
  \n```\ninner_ptr = inner_ptr + 1;\n```\n\n此时，我们就可以通过普通的指针解引用来访问它的值：\n\n```\nint\
  \ result = *inner_ptr;\n```\n\n我们可以将这些语句合并为 Listing 15-7 中的单个表达式。\n\n```\nint result\
  \ = *(*(three_arrays + 2) + 1);\n```\n\n`Listing 15-7: 访问 three_arrays 中的最后一个 int`\n\
  \n\n\n\n\n通过重复的指针加、解引用以及从数组到指针的隐式转换，我们可以访问多维数组中的任何元素。这显然是一个巨大的痛苦点。下标运算符 `[]` 提供了更方便的语法来完成相同的操作。表达式\
  \ `a[i]` 等价于 `*(a + i)`，因此我们可以将 [Listing 15-7] 重写为 [Listing 15-8]。\n\n```\nint result\
  \ = three_arrays[2][1];\n```\n\nListing 15-8: 访问 `three_arrays` 中最后一个 `int` 的更方便方法\n\
  \n我想要强调的最后一点是，下标寻址和指针算术适用于所有指针，而不仅仅是从数组退化而来的指针。如果所指向的对象不在数组中，我们将将其视为单元素数组中的唯一元素。例如，[Listing\
  \ 15-9] 是完全合法的。\n\n```\nint a = 5;\nint *ptr = &a;\nreturn ptr[0] == 5;\n```\n\n\
  Listing 15-9: 对标量对象的指针进行下标操作\n\n当我们对 `ptr` 加上 `0` 并对结果进行解引用时，我们得到了对象 `a`。因此，表达式\
  \ `ptr[0] == 5` 的求值为 1（即真）。\n\n### 进阶指针算术\n\n我们将支持对指针的其他两种操作。第一个是减法；[Listing 15-10]\
  \ 给了一个示例。\n\n```\nint arr[3] = {1, 2, 3};\nint *ptr = arr + 2;\nreturn ptr - arr;\n\
  ```\n\nListing 15-10: 两个指针相减\n\n当相减指向同一个数组中两个元素的指针时，结果是它们索引之间的差。在这个例子中，意乎意料的是，我们返回了\
  \ `2`。\n\n我们也可以比较指向数组元素的指针，如 [Listing 15-11] 所示。\n\n```\nint arr[3] = {1, 2, 3};\n\
  int *ptr = arr + 2;\nreturn ptr > arr;\n```\n\nListing 15-11: 比较指针\n\n指向数组索引较大的元素的指针比指向索引小的指针大。在这个例子中，`ptr`\
  \ 指向索引为 2 的元素，而 `arr` 退化为指向索引 0 元素的指针，因此比较 `ptr > arr` 的求值为 1。如果两个指针没有指向同一个数组，则它们相减或比较的结果是未定义的。\n\
  \n### 函数声明中的数组类型\n\n函数返回数组是非合法的，如下面的声明所示：\n\n```\nint foo(void)[3];\n```\n\n函数同样不能接受数组作为参数。奇怪的是，C\
  \ 标准允许你*声明*带有数组参数的函数，但它要求编译器调整你的函数签名以采用指针代替。例如，声明\n\n```\nint foo(int array[3]);\n\
  ```\n\n将会被转换为：\n\n```\nint foo(int *array);\n```\n\n### 我们将不会实现的功能\n\n我们将不会实现的功能足够重要，因此我会提一下它们。我们不会支持变长数组（其长度在运行时确定），如下式所示：\n\
  \n```\nint variable_array[x];\n```\n\n我们还不允许不完整的数组类型：C 标准要求你在定义它时指定维度。\n\n```\n\
  int array[];\n```\n\n我们不会支持复合字面量，它允许你在初始化器之外构造数组对象：\n\n```\nint *p = (int[]){2};\n\
  ```\n\n我们不会支持指示符，它允许你无序初始化元素：\n\n```\nint arr[3] = [2] = 1;\n```\n\n然而，我们*会*允许没有初始化每个元素的初始化器，如下式：\n\
  \n```\nint arr[3] = {1, 2};\n```\n\n在这种情况下，我们将用零填充任何剩余元素；这是标准要求的行为。\n\n### 词法分析器\n\
  \n你将在本章中添加两个标记：\n\n- `[`\n- `]`\n\n添加这些标记后，你就可以测试你的词法分析器了。\n\n### 解析器\n\n接下来，我们将\
  \ AST 中添加数组类型、下标表达式和复合初始化。数组的类型表示数组中元素的数量以及这些元素的类型：\n\n```\ntype = --snip | Array(type\
  \ element, int size)\n```\n\n我们可以嵌套 `Array` 构造函数来指定多维数组。例如，我们将声明的类型\n\n```\nint\
  \ x[3][4];\n```\n\n表示为 `Array(Array(Int, 4), 3)`。由于我们不支持变长数组，每个数组类型都必须有一个常量的大小。\n\
  \n下标表达式包含两个子表达式：一个指针和一个索引：\n\n```\nexp = --snip | Subscript(exp, exp)\n```\n\n令人惊讶的是，这两个子表达式出现的顺序并不重要；表达式\
  \ `x[1]` 和 `1[x]` 是等价的。\n\n最后，我们将添加一个 `initializer` 结构来同时支持标量和复合变量初始化：\n\n```\n\
  initializer = SingleInit(exp) | CompoundInit(initializer*)\n```\n\n\n\n\n\n我们将使用\
  \ `CompoundInit` 来初始化数组，并使用 `SingleInit` 来初始化标量对象（包括单个数组元素）。对于多维数组的每一行，我们将使用嵌套的\
  \ `CompoundInit` 结构。列表 15-12 展示了如何表示初始化器 `{{1, 2}, {3, 4}, {5, 6}}`。\n\n```python\n\
  CompoundInit([\n    CompoundInit([SingleInit(Constant(ConstInt(1))),\n         \
  \         SingleInit(Constant(ConstInt(2)))]),\n    CompoundInit([SingleInit(Constant(ConstInt(3))),\n\
  \                  SingleInit(Constant(ConstInt(4)))]),\n    CompoundInit([SingleInit(Constant(ConstInt(5))),\n\
  \                  SingleInit(Constant(ConstInt(6)))])\n])\n```\n\n*列表 15-12: 将来自列表\
  \ 15-2 的 three_arrays 的初始化器表示为 AST 节点*\n\n类型检查器会为初始化器标注类型，就像它处理 `exp` 节点一样。无论你如何支持\
  \ `exp` 节点上的类型注解，都应该对 `initializer` 执行相同的操作。\n\n列表 15-13 提供了完整的 AST 定义，其中本章新增的内容已加粗显示。\n\
  \n```python\nprogram = Program(declaration*)\ndeclaration = FunDecl(function_declaration)\
  \ | VarDecl(variable_declaration)\nvariable_declaration = (identifier name, initializer?\
  \ init,\n                        type var_type, storage_class?)\nfunction_declaration\
  \ = (identifier name, identifier* params, block? body,\n                       \
  \ type fun_type, storage_class?)\ninitializer = SingleInit(exp) | CompoundInit(initializer*)\n\
  type = Int | Long | UInt | ULong | Double\n     | FunType(type* params, type ret)\n\
  \     | Pointer(type referenced)\n     | Array(type element, int size)\nstorage_class\
  \ = Static | Extern\nblock_item = S(statement) | D(declaration)\nblock = Block(block_item*)\n\
  for_init = InitDecl(variable_declaration) | InitExp(exp?)\nstatement = Return(exp)\n\
  \          | Expression(exp)\n          | If(exp condition, statement then, statement?\
  \ else)\n          | Compound(block)\n          | Break\n          | Continue\n\
  \          | While(exp condition, statement body)\n          | DoWhile(statement\
  \ body, exp condition)\n          | For(for_init init, exp? condition, exp? post,\
  \ statement body)\n          | Null\nexp = Constant(const)\n    | Var(identifier)\n\
  \    | Cast(type target_type, exp)\n    | Unary(unary_operator, exp)\n    | Binary(binary_operator,\
  \ exp, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp condition, exp, exp)\n\
  \    | FunctionCall(identifier, exp* args)\n    | Dereference(exp)\n    | AddrOf(exp)\n\
  \    | Subscript(exp, exp)\nunary_operator = Complement | Negate | Not\nbinary_operator\
  \ = Add | Subtract | Multiply | Divide | Remainder | And | Or\n                |\
  \ Equal | NotEqual | LessThan | LessOrEqual\n                | GreaterThan | GreaterOrEqual\n\
  const = ConstInt(int) | ConstLong(int) \n      | ConstUInt(int) | ConstULong(int)\n\
  \      | ConstDouble(double)\n```\n\n*列表 15-13: 带有数组类型、复合初始化器和下标表达式的抽象语法树*\n\n让我们逐步了解如何解析\
  \ AST 中的这些每项新增。\n\n### 解析数组声明符\n\n在上一章中，你学习了如何解析指针和函数声明符；现在我们将扩展该代码来处理数组声明符。列表 15-14\
  \ 展示了如何扩展我们在列表 14-6 中定义的 `declarator` 结构。\n\n```python\ndeclarator = Ident(identifier)\n\
  \           | Pointer(declarator)\n           | ArrayDeclarator(declarator, int)\n\
  \           | FunDeclarator(identifier, params)\n```\n\n*列表 15-14: 声明声明符*\n\n接下来，我们将把数组声明符添加到语法规则中。由于它们的优先级高于指针声明符，因此它们属于\
  \ `declarator` 规则：\n\n```python\ndeclarator = Ident(identifier)\n           | Pointer(declarator)\n\
  \           | ArrayDeclarator(declarator, int)\n           | FunDeclarator(identifier,\
  \ params)\n```\n\n直接声明符是一个带有可选后缀的简单声明符：可以是括号列表或一组常量维度的序列。\n\n```python\n<direct-declarator>\
  \ = <simple-declarator> <suffix>\n<suffix> = \"[\" <const> \"\")+\n```\n\n每个 `ArrayDeclarator`\
  \ 仅指定一个维度，因此我们将多个维度解析为嵌套的 `ArrayDeclarator` 节点序列。例如，我们将声明符 `array[1][2]` 解析为：\n\n\
  ```python\nArrayDeclarator(ArrayDeclarator(Ident(\"array\")), 1), 2\n```\n\n`suffix`\
  \ 的语法规则允许将浮点数常量作为数组维度，但 C 标准要求使用整数。当你解析 `suffix` 时，应该拒绝浮点数常量并接受整数类型的常量。C 标准还要求数组维度大于零，但\
  \ Clang 和 GCC 支持零长度数组。是接受零长度数组还是拒绝取决于你的决定；测试套件尚未覆盖此种情况。\n\n最后，我们将更新 `process_declarator`，该函数将\
  \ `declarator` 结构转换为 AST 节点。列表 15-15 说明了如何在 `process_declarator` 中处理数组声明符。\n\n```python\n\
  process_declarator(declarator, base_type):\n    match declarator with\n    | --snip--\n\
  \    | ArrayDeclarator(inner, size) ->\n        derived_type = Array(base_type,\
  \ size)\n        return process_declarator(inner, derived_type)\n```\n\n*列表 15-15:\
  \ 应用数组类型推导*\n\n此列表遵循我们在第 14 章中引入的推导类型的模式。\n\n### 解析抽象数组声明符\n\n接下来，让我们处理抽象声明符，它们在不声明标识符指定类型。我们将根据列表\
  \ 15-16 中的语法规则解析抽象数组声明符。\n\n```python\n<direct-abstract-declarator> = \"(\" <abstract-declarator>\
  \ \")\" {\"[\" <const> \"]\"}\n                               | \"[\" <const> \"\
  }+\n```\n\n*列表 15-16: 抽象数组声明符的语法规则*\n\n\n\n\n\n直接抽象声明符要么是一个带括号的声明符，可选地后跟一个数组维度序列，或者仅仅是一个数组维度序列。（请记住，EBNF\
  \ 语法中的 `{}` 表示零次或多次重复，而 `{}+` 表示一次或多次重复。）我们在这里采取与支持普通声明符时相同的步骤。列表 15-17 展示了如何扩展\
  \ `abstract_declarator` 构造结构。\n\n```\nabstract_declarator = AbstractPointer(abstract_declarator)\n\
  \                    | AbstractArray(abstract_declarator, int size)\n          \
  \          | AbstractBase\n```\n\n*列表 15-17：表示抽象数组声明符*\n\n在更新 `abstract_declarator`\
  \ 后，我们将更改解析代码以处理 列表 15-16 中的语法规则。（此代码应该接受整数常数作为数组维度，并拒绝浮点数常数，这与解析普通声明符的代码一致。）最后，我们将更新\
  \ `process_abstract_declarator`。\n\n### 解析复合初始化器\n\n现在让我们定义初始化器的语法规则：\n\n```\n<initializer>\
  \ ::= <exp> | \"{\" <initializer> {\",\" <initializer>} [\",\"] \"}\"\n```\n\n这条规则非常直观：初始化器要么是一个表达式，要么是一个花括号包含的一个或多个嵌套初始化器的列表。注意，初始化器列表的最后一个元素之后可以有一个尾逗号：`{1,\
  \ 2, 3}` 和 `{1, 2, 3,}` 都是有效的复合初始化器。\n\n### 解析下标表达式\n\n我们需要解析的最后一个新语言特性是下标运算符。下标是一个*后缀*运算符，跟随它修改的表达式之后。后缀运算符的优先级高于\
  \ `&`、`-` 或 `~` 等前缀运算符。我们将拆分 `<factor>` 语法规则以反映这种优先级差异。在最高优先级级别，我们将包含常量、变量、带括号表达式和函数调用：\n\
  \n```\n<primary-exp> ::= <const> | <identifier> | \"(\" <exp> \")\"\n          \
  \      | <identifier> \"(\" [<argument-list>] \")\"\n```\n\n然后，我们将后缀表达式定义为主主表达式，可选地后跟一个下标运算符序列：\n\
  \n```\n<postfix-exp> ::= <primary-exp> {\"[\" <exp> \"]\"}\n```\n\n每个下标运算符都是封装在方括号中的表达式。最后，我们将定义一元表达式，它包含了前缀运算符和转换运算符：\n\
  \n```\n<unary-exp> ::= <unop> <unary-exp>\n              | \"(\" {<type-specifier>}+\
  \ [<abstract-declarator>] \")\" <unary-exp>\n              | <postfix-exp>\n```\n\
  \n列表 15-18 展示了完整的语法，其中本章的更改已加粗显示。\n\n```\n<program> ::= {<declaration>}\n<declaration>\
  \ ::= <variable-declaration> | <function-declaration>\n<variable-declaration> ::=\
  \ {<specifier>}+ <declarator> [\"=\" <initializer>] \";\"\n<function-declaration>\
  \ ::= {<specifier>}+ <declarator> (<block> | \";\")\n<declarator> ::= \"*\" <declarator>\
  \ | <direct-declarator>\n<direct-declarator> ::= <simple-declarator> [<declarator-suffix>]\n\
  <declarator-suffix> ::= <param-list> | {\"[\" <const> \"]\"}+\n<param-list> ::=\
  \ \"(\" \"void\" \")\" | \"(\" <param> {\",\" <param>} \")\"\n<param> ::= {<type-specifier>}+\
  \ <declarator>\n<simple-declarator> ::= <identifier> | \"(\" <declarator> \")\"\n\
  <type-specifier> ::= \"int\" | \"long\" | \"unsigned\" | \"signed\" | \"double\"\
  \n<specifier> ::= <type-specifier> | \"static\" | \"extern\"\n<block> ::= \"{\"\
  \ {<block-item>} \"}\"\n<block-item> ::= <statement> | <declaration>\n<initializer>\
  \ ::= <exp> | \"{\" <initializer> {\",\" <initializer>} [\",\"] \"}\"\n```\n\n\n\
  \n\n\nListing 15-19: 将数组隐式转换为指针\n\n如果一个表达式具有数组类型，我们会插入一个 `AddrOf` 操作来获取其地址。然后，我们记录其结果类型，该类型是指向数组元素类型的指针。这与我们通过显式\
  \ `&` 运算符得到的结果类型不同，`&` 运算符总是产生其操作数类型的指针。考虑以下声明：\n\n```\nint arr[3];\n```\n\n表达式\
  \ `&arr` 的类型为 `int (*)[3]`。相反，表达式 `arr` 的类型为 `int *`。在类型后的 AST（抽象语法树）中，我们使用 `AddrOf`\
  \ 来表示获取对象对象的两种方式，它们产生不同的结果类型：通过隐式转换或显式 `&` 运算符。\n\n一旦我们引入了 `typecheck_and_convert`，我们将用它来替代\
  \ `typecheck_exp`，以检查子表达式和完整表达式。唯一的例外是对 `AddrOf` 操作数的类型检查。该操作数不应从数组转换为指针，因此我们将继续通过直接调用\
  \ `typecheck_exp` 来处理它。\n\n### 验证左值（lvalues）\n\n我们将更改验证左值的一些细节。首先，除了 `Var` 和 `Dereference`\
  \ 之外，我们还应该将 `Subscript`（下标）表达式视为左值。\n\n其次，我们需要拒绝尝试给数组赋值的赋值。一旦数组退化为指针，它不再是左值，且无法赋值。为了捕获这些无效的赋值表达式，我们将在检查其是否为左值之前，用\
  \ `typecheck_and_convert` 处理左操作数。Listing 15-20 显示了类型检查赋值表达式的最新逻辑。\n\n```\ntypecheck_exp(e,\
  \ symbols):\n    match e with\n    | --snip--\n    | Assignment(left, right) ->\n\
  \        typed_left = typecheck_and_convert(left, symbols)\n        if typed_left\
  \ is not an lvalue:\n            fail(\"Tried to assign to non-lvalue\")\n     \
  \   typed_right = typecheck_and_convert(right, symbols)\n        --snip--\n```\n\
  \nListing 15-20: 赋值表达式的类型检查\n\n如果左操作数是数组，`typecheck_and_convert` 将将其封装在 `AddrOf`\
  \ 操作中。然后，由于 `AddrOf` 不是左值，类型检查器将抛出错误。\n\n### 指针运算的类型检查\n\n接下来，我们将扩展加法、减法和关系运算符以处理指针。给指针加上任何整数类型都是合法的。Listing\
  \ 15-21 展示了如何对加法进行类型检查。\n\n```\n | Binary(Add, e1, e2) ->\n        typed_e1 = typecheck_and_convert(e1,\
  \ symbols)\n        typed_e2 = typecheck_and_convert(e2, symbols)\n        t1 =\
  \ get_type(typed_e1)\n        t2 = get_type(typed_e2)\n        if t1 and t2 are\
  \ arithmetic:\n            --snip--\n        else if t1 is a pointer type and t2\
  \ is an integer type:\n          ❶ converted_e2 = convert_to(typed_e2, Long)\n \
  \         add_exp = Binary(Add, typed_e1, converted_e2)\n          return set_type(add_exp,\
  \ t1)\n      ❸ else if t2 is a pointer type and t1 is an integer type:\n       \
  \     --snip--\n        else:\n            fail(\"Invalid operands for addition\"\
  )\n```\n\nListing 15-21: 加法的类型检查\n\n对于涉及指针和整数的加法类型检查，我们首先将操作数转换为 `long`。无论第一个还是第二个操作数是指针，加法的结果类型都是相同的。我们省略了后者的伪代码。\n\
  \n加法的结果与指针具有相同的类型。我们使用 `long` 作为结果类型，这是常规规范。为了对给指针加上整数进行类型检查，我们将整数操作数转换为 `long`。这种转换不会改变它的类型。（如果一个整数大到无法用\
  \ `long` 表示，我们可以安全地假设它不是数组。）\n\n最后，除了加指针或加算术操作数以外的任何情况，我们都会抛出错误。\n\n从指针减去整数的方法相同：我们将整数转换为\
  \ `long`。唯一的区别是操作数的顺序很重要。你可以从指针中减去一个整数，但不能从整数中减去一个指针。\n\n当我们从一个指针减去另一个指针时，两个操作数必须具有相同的类型，且结果是一个由实现定义的符号整数类型。该类型在\
  \ `stddef.h` 头文件中应该别命名为 `ptrdiff_t`，以帮助用户编写更可移植的代码。由于我们不支持 `typedef`，因此无法编译 `stddef.h`，我们将忽略这一要求。\n\
  \nListing 15-22 展示了如何对指针减法的两种情况进行类型检查。\n\n```\n | Binary(Subtract, e1, e2) ->\n\
  \        typed_e1 = typecheck_and_convert(e1, symbols)\n        typed_e2 = typecheck_and_convert(e2,\
  \ symbols)\n        t1 = get_type(typed_e1)\n        t2 = get_type(typed_e2)\n \
  \       if t1 and t2 are arithmetic:\n            --snip--\n      ❶ else if t1 is\
  \ a pointer type and t2 is an integer type:\n            converted_e2 = convert_to(typed_e2,\
  \ Long)\n            sub_exp = Binary(Subtract, typed_e1, converted_e2)\n      \
  \      return set_type(sub_exp, t1)\n      ❷ else if t1 is a pointer type and t1\
  \ == t2:\n            sub_exp = Binary(Subtract, typed_e1, typed_e2)\n         \
  \   return set_type(sub_exp, Long)\n        else:\n            fail(\"Invalid operands\
  \ for subtraction\")\n```\n\n\n\n\n如果一个表达式是从指针中减去一个整数，我们将像处理指针加一样处理它 ❶。如果它减去两个相同类型的指针，我们将\
  \ `long` 记录为结果类型 ❷。在任何其他情况下——如果一个表达式减去两个不同类型的指针、从指针减去一个 `double`，或者从一个算术值减去一个指针——我们将抛出错误。\n\
  \n最后，让我们处理 `<`、`<=`、`>` 和 `=` 操作。这些运算符都接受两个相同类型的指针操作数并返回一个 `int`。这些运算符的类型检查非常简单，因此我不会提供这种情况的伪代码。\n\
  \n注意，这些运算符中都不接受空指针常量；它们比较的是同一个数组中元素的指针，但根据定义，空指针并不指向数组元素。出于同样的逻辑，你不能从空指针常量减去一个指针。如果\
  \ `x` 是一个指针，表达式 `x == 0` 和 `x != 0` 是合法的，但 `0 - x`、`0 < x` 和 `x >= 0` 是不合法的。（Clang\
  \ 和 GCC 在方面比标准更宽松；作为一种语言扩展，它们都允许在任何关系运算符上使用空指针常量。有了这个扩展，任何非空指针比较都会大于空指针常量。）\n\n\
  ### 下标表达式的类型检查\n\n下标表达式的一个操作数必须是指针，另一个必须是整数。指针所引用的类型就是结果类型。记住，这两个操作数可以以任何顺序出现；我们不能假设指针一定是第一个操作数。Listing\
  \ 15-23 显示了如何对下标表达式进行类型检查。\n\n```\n | Subscript(e1, e2) ->\n        typed_e1 = typecheck_and_convert(e1,\
  \ symbols)\n        typed_e2 = typecheck_and_convert(e2, symbols)\n        t1 =\
  \ get_type(typed_e1)\n        t2 = get_type(typed_e2)\n      ❶ if t1 is a pointer\
  \ type and t2 is an integer type:\n            ptr_type = t1\n          ❷ typed_e2\
  \ = convert_to(typed_e2, Long)\n        else if t1 is an integer type and t2 is\
  \ a pointer type:\n            ptr_type = t2\n            typed_e1 = convert_to(typed_e1,\
  \ Long)\n        else:\n            fail(\"Subscript must have integer and pointer\
  \ operands\")\n        subscript_exp = Subscript(typed_e1, typed_e2)\n      ❸ return\
  \ set_type(subscript_exp, ptr_type.referenced)\n```\n\n*Listing 15-23: 下标表达式的类型检查\n\
  \n首先，我们验证一个操作数是指针而另一个是整数 ❶。然后我们将整数操作数转换为 `long` ❷。最后，我们用指针引用的类型对整个表达式进行标注 ❸。\n\n\
  ### 强制转换表达式的类型检查\n\n这个很简单：你不能将一个表达式转换为数组类型。例如，表达式\n\n```\n(int[3]) foo;\n```\n\n\
  是无效的并且应该产生类型错误。\n\n### 函数声明的类型检查\n\n当我们处理函数声明时，我们会同时考虑它的返回类型和参数类型。如果函数返回数组类型，我们就会抛出错误。如果它的任何参数是数组类型，我们将其调整为指针类型。Listing\
  \ 15-24 描述了如何验证并隐式调整函数类型。\n\n```\ntypecheck_function_declaration(decl, symbols):\n\
  \    if decl.fun_type.ret is an array type:\n        fail(\"A function cannot return\
  \ an array!\")\n    adjusted_params = []\n    for t in decl.fun_type.params:\n \
  \       match t with\n        | Array(elem_t, size) ->\n            adjusted_type\
  \ = Pointer(elem_t)\n            adjusted_params.append(adjusted_type)\n       \
  \ | _ -> adjusted_params.append(t)\n    decl.fun_type.params = adjusted_params\n\
  \    --snip--\n```\n\n*Listing 15-24: 函数声明中数组类型的调整*\n\n你应该将此逻辑添加到 `typecheck_function_declaration`\
  \ 的最开始，以便在检查函数参数类型是否与标识符之前的定义冲突之前，对其进行调整。你还应该确保符号表和 AST 节点都使用调整后的类型。\n\n### 复合初始化器的类型检查\n\
  \n我们需要为每个初始化器标注其类型，如果初始化器与它应该初始化的类型不兼容，则抛出错误。要对复合初始化器进行类型检查，我们首先验证它初始化的对象是一个数组。然后，我们递归地检查每个嵌套初始化器的类型，验证它与数组的元素类型兼容。Listing\
  \ 15-25 插了这种方法。\n\n```\ntypecheck_init(target_type, init, symbols):\n    match target_type,\
  \ init with\n    | _, SingleInit(e) -> ❶\n        typechecked_exp = typecheck_and_convert(e,\
  \ symbols)\n        cast_exp = convert_by_assignment(typechecked_exp, target_type)\n\
  \        return set_type(SingleInit(cast_exp), target_type)\n    | Array(elem_t,\
  \ size), CompoundInit(init_list) -> ❷\n        if length(init_list) > size:\n  \
  \          fail(\"wrong number of values in initializer\") ❸\n        typechecked_list\
  \ = []\n        for init_elem in init_list:\n            typechecked_elem = typecheck_init(elem_t,\
  \ init_elem, symbols) ❹\n            typechecked_list.append(typechecked_elem)\n\
  \        while length(typechecked_list) < size:\n            typechecked_list.append(zero_initializer(elem_t))\
  \ ❺\n        return set_type(CompoundInit(typechecked_list), target_type) ❻\n  \
  \  | _ -> fail(\"can't initialize a scalar object with a compound initializer\"\
  ) ❼\n```\n\n*Listing 15-25: 初始化器的类型检查*\n\n在基础情况下，初始化器是一个单个表达式 ❶。我们将对该表达式进行类型检查，然后调用我们在第\
  \ 14 章 中定义的 `convert_by_assignment` 将其转换为目标类型。如果它与目标类型兼容，`convert_by_assignment`\
  \ 将抛出错误（这包括目标类型为数组类型的情况）。\n\n\n\n\n在递归情况中，我们将使用复合初始化器 ❷ 来初始化数组。列表中的每个项目将初始化数组中的一个元素。首先，我们将检查列表包含的元素是否过多\
  \ ❸。然后，我们将递归地对每个列表项进行类型检查，使用数组的元素类型作为目标类型 ❹。如果初始化列表包含的元素太少，我们将用零对其进行填充 ❺。我们将使用 `zero_initializer`\
  \ 辅助函数（我没有提供它的伪代码）来生成可以添加到初始化列表中的零值初始化器。给定一个标量类型，`zero_initializer` 应该返回一个该类型的、值为\
  \ 0 的 `SingleInit`。给定一个数组类型，它应该返回一个 `CompoundInit`，其标量元素（可能嵌套了若干层）的值为 0。例如，对类型 `UInt`\
  \ 调用 `zero_initializer` 应该返回：\n\n```\nSingleInit(Constant(ConstUInt(0)))\n```\n\n\
  而对类型 `Array(Array(Int, 2), 2)` 调用它应该返回：\n\n```\nCompoundInit([\n    CompoundInit([SingleInit(Constant(ConstInt(0))),\n\
  \                  SingleInit(Constant(ConstInt(0)))]),\n    CompoundInit([SingleInit(Constant(ConstInt(0))),\n\
  \                  SingleInit(Constant(ConstInt(0)))])\n])\n```\n\n一旦我们构建了经过类型检查的初始化器列表，我们将其封装成一个\
  \ `CompoundInit`，并用目标类型对其进行标注 ❻。如果初始化器不是单个表达式且目标类型不是数组类型，说明我们正尝试用复合初始化器来初始化一个标量对象，此时我们将抛出一个错误\
  \ ❼。\n\n### 初始化静态数组\n\n与其他静态变量一样，我们将静态数组的初始值存储在符号表中。我们需要更新用于表示这些初始值的数据结构。我们将每个对象的初始化器表示为一列表标量值的列表：\n\
  \n```\ninitial_value = Tentative | Initial(static_init* init_list) | NoInitializer\n\
  ```\n\n对于标量对象，`init_list` 将只有一个元素。如下声明：\n\n```\nstatic int a = 3;\n```\n\n将具有此初始化器：\n\
  \n```\nInitial([IntInit(3)])\n```\n\n对于多维数组，我们将展平任何嵌套结构。因此，声明：\n\n```\nstatic int\
  \ nested[3][2] = {{1, 2}, {3, 4}, {5, 6}};\n```\n\n将具有此初始化器：\n\n```\nInitial([IntInit(1),\n\
  \         IntInit(2),\n         IntInit(3),\n         IntInit(4),\n         IntInit(5),\n\
  \         IntInit(6)])\n```\n\n接下来，我们将添加一个 `static_init` 构造函数来表示任何大小的零对象：\n\n```\n\
  static_init = IntInit(int) | LongInit(int) | UIntInit(int) | ULongInit(int)\n  \
  \          | DoubleInit(double) | ZeroInit(int bytes)\n```\n\n`ZeroInit` 的 `bytes`\
  \ 参数指定了初始化多少字节为零。如果静态数组只被部分初始化，我们将使用 `ZeroInit` 来填充任何未初始化的元素。例如，声明：\n\n```\nstatic\
  \ int nested[3][2] = {{100}, {200, 300}};\n```\n\n将具有此初始化器：\n\n```\nInitial([IntInit(100),\n\
  \         ZeroInit(4),\n         IntInit(200),\n         IntInit(300),\n       \
  \  ZeroInit(8)])\n```\n\n此初始化列表的第二个元素 `ZeroInit(4)` 初始化了 `nested[0][1]` 处的 `int`；最后一个元素\
  \ `ZeroInit(8)` 则初始化了嵌套数组 `nested[2]` 的两个元素。\n\n一旦你更新了 `initial_value` 和 `static_init`\
  \ 数据结构，请编写一个函数来将复合初始化器转换为 `static_init` 列表。你需要验证静态数组的初始化器具有正确的大小和结构，就像非静态数组的初始化器一样；我不会提供此转换的伪代码，因为它与我们类型检查非静态初始化器的方法相似。\n\
  \n### 使用 ZeroInit 初始化标量变量\n\n你也可以使用 `ZeroInit` 将标量变量初始化为零。例如，给定声明：\n\n```\nstatic\
  \ long x = 0;\n```\n\n你可以使用此初始化器：\n\n```\nInitial([ZeroInit(8)])\n```\n\n在这里使用 `ZeroInit`\
  \ 是可选的，但它让代码生成变得更简单，因为你可以轻松判断哪些初始化器属于 `.data`，哪些属于 `.bss`。在使用 `ZeroInit` 初始化 `double`\
  \ 时要小心，只有当你确定 `double` 的初始值为 `0.0` 而不是 `-0.0` 时才使用它。\n\n### TACKY 生成\n\n为了适应指针运算和复合初始化器，我们将对\
  \ TACKY IR 进行一些更改。首先，由于我们更改了在符号表中表示初始化器的方式，将在 TACKY 中进行相应的更改：\n\n```\ntop_level\
  \ = Function(identifier, bool global, identifier* params, instruction* body)\n \
  \         | StaticVariable(identifier, bool global, type t, static_init* init_list)\n\
  ```\n\n我们还将引入一条新指令来支持指针运算：\n\n```\nAddPtr(val ptr, val index, int scale, val dst)\n\
  ```\n\n\n\n我们将使用这条指令来对指针增加或减少一个整数，但不是从一个指针中减去另一个指针。`scale` 操作数是 `ptr` 所指向的数组中每个元素的大小（字节为单位）。例如，如果\
  \ `ptr` 是一个 `int *`，则 `scale` 操作数将为 `4`，因为一个 `int` 是 4 个字节。如果 `ptr` 是 `int (*)[3]`（一个指向包含三个\
  \ `int` 对象的数组的指针），那么 `scale` 将是 `12`。`index` 操作数告诉我们从基指针向前或向后移动多少个元素。在运行时，程序将 `index`\
  \ 乘以 `scale`，以确定要为基指针增加多少字节。虽然可以利用现有的 TACKY 乘法和加法指令来实现指针算术，但在此处引入一个专门的 `AddPtr`\
  \ 指令将帮助我们利用 x64 架构对指针算术的内置支持。\n\n我们将再引入一条指令来支持复合初始化器：\n\n```\nCopyToOffset(val src,\
  \ identifier dst, int offset)\n```\n\n在这条指令中，`src` 是一个标量值，`dst` 是聚合类型变量的名称，`offset`\
  \ 指定 `dst` 的起始位置与我们应该拷贝 `src` 的位置之间的字节数。需要注意的是，`dst` 指定的是数组，*而不是*指向数组元素的指针。换句话说，`CopyToOffset`\
  \ 不使用 `dst` 的值；它使用 `dst` 来识别内存中固定位置的对象。由于这条指令直接操作数组而非指针，因此它对于数组初始化很有用，但对于下标索引。在第\
  \ 18 章中，我们还将用它来初始化和更新结构。\n\nListing 15-26 显示了更新后的 TACKY IR，本章的更改已加粗。\n\n```\nprogram\
  \ = Program(top_level*)\ntop_level = Function(identifier, bool global, identifier*\
  \ params, instruction* body)\n          | StaticVariable(identifier, bool global,\
  \ type t, static_init* init_list)\ninstruction = Return(val)\n            | SignExtend(val\
  \ src, val dst)\n            | Truncate(val src, val dst)\n            | ZeroExtend(val\
  \ src, val dst)\n            | DoubleToInt(val src, val dst)\n            | DoubleToUInt(val\
  \ src, val dst)\n            | IntToDouble(val src, val dst)\n            | UIntToDouble(val\
  \ src, val dst)\n            | Unary(unary_operator, val src, val dst)\n       \
  \     | Binary(binary_operator, val src1, val src2, val dst)\n            | Copy(val\
  \ src, val dst)\n            | GetAddress(val src, val dst)\n            | Load(val\
  \ src_ptr, val dst)\n            | Store(val src, val dst_ptr)\n            | AddPtr(val\
  \ ptr, val index, int scale, val dst)\n            | CopyToOffset(val src, identifier\
  \ dst, int offset)\n            | Jump(identifier target)\n            | JumpIfZero(val\
  \ condition, identifier target)\n            | JumpIfNotZero(val condition, identifier\
  \ target)\n            | Label(identifier)\n            | FunCall(identifier, val*\
  \ args, val dst)\n            | Constant(val)\n            | Var(identifier)\n \
  \           | Unary(unary_operator)\n            | Binary(binary_operator)\n   \
  \         | Literal(val)\n```\n\n有了这些添加，我们可以实现本章中的每一个新运算符。\n\n### 指针算术\n\n如 Listing\
  \ 15-27 所示，我们将使用 `AddPtr` 指令来实现指针算术 `ptr`。\n\n```\ninstructions for ptr\np = <result\
  \ of ptr\ninstructions for int\ni = <result of int\nresult = AddPtr(p, i, size of\
  \ type)\n```\n\n### 给指针增加整数\n\n关于此列表有几点注意。首先，指针始终是 `AddPtr` 指令的操作数，整数始终是第二个。其次，你需要在编译时计算引用类型的大小，因为\
  \ `scale` 操作数是一个常量而不是变量。从指针中减去整数几乎相同；我们只需要在将其包含在 `AddPtr` 之前对索引进行取反。\n\n```\ninstructions\
  \ for ptr\np = <result of ptr\ninstructions for int\ni = <result of int\nj = Unary(Negate,\
  \ i)\nresult = AddPtr(p, j, size of type)\n```\n\n### 两个指针相减\n\n从一个指针减去另一个的方法稍有不同。首先，我们使用普通的\
  \ `Subtract` 指令计算字节差异。然后，我们将此结果除以一个元素的字节数，以计算两个指针之间的数组索引差异。换句话说，我们将在 Listing 15-29\
  \ 中将 `ptr1` - `ptr2` 转换为 TACKY。\n\n```\ninstructions for ptr1\np1 = <result of ptr1\n\
  instructions for ptr2\np2 = <result of ptr2\ndiff = Binary(Subtract, p1, p2)\nresult\
  \ = Binary(Divide, diff, size of referenced type of ptr1)\n```\n\n\n\n我们将像处理算术值一样处理指针，使用\
  \ `LessThan`、`LessOrEqual`、`GreaterThan` 和 `GreaterOrEqual` 运算符。\n\n### 下标运算\n\n\
  根据 C 标准，下标表达式 `ptr[int]` 等于 `*(ptr + int)`。因此，为了实现下标表达式，我们将从列表 15-27 中生成用于指针加法的\
  \ TACKY，但向调用者返回 `DereferencedPointer(result)` 而不是 `PlainOperand(result)`。在这里生成正确的\
  \ TACKY 很简单，但理解它为什么有效（特别是对于多维数组）会稍微复杂一些。为了进一步探索这一点，让我们来看一下列表 15-30 中的示例。\n\n```\n\
  int arr[3][4];\n--snip--\nreturn arr[i][j];\n```\n\n**列表 15-30：返回下标运算符的结果**\n\n\
  列表 15-31 显示了此示例中 `return` 语句的 TACKY 实现。\n\n```\n❶ tmp0 = GetAddress(arr)\ntmp1 =\
  \ AddPtr(tmp0, i, 16)\ntmp2 = AddPtr(tmp1, j, 4)\n❷ tmp3 = Load(tmp2)\nReturn(tmp3)\n\
  ```\n\n**列表 15-31：在 TACKY 中实现列表 15-30**\n\n首先，我们发布一个 `GetAddress` 指令来获取 `arr` 中第一个元素的指针。然后，我们发布两个\
  \ `AddPtr` 指令来计算指向 `arr[i][j]` 数组元素的指针。最后，我们使用 `Load` 指令将该数组元素的当前值读入临时变量并将其返回。列表\
  \ 15-31 是高效的，没有任何多余的指令。我们之前看到，数组下标需要我们反复获取数组元素的地址、执行指针算术并对结果进行引用。但在列表中，我们只在开始 ❶\
  \ 获取了一次数组的地址，并且在结束 ❷ 只使用一次 `Load` 指令对指针进行解引用。我们的 TACKY 生成策略是如何产生这个结果的？\n\n列表 15-32\
  \ 提供了列表 15-30 中 `return` 语句的 AST。让我们弄清楚此 AST 中的每个子表达式是如何转换为 TACKY 的。\n\n```\n❶ Return(\n\
  \  ❷ Subscript(\n      ❸ AddrOf(\n          ❹ Subscript(\n              ❺ AddrOf(Var(\"\
  arr\")),\n                Var(\"i\")\n            )\n        ),\n        Var(\"\
  j\")\n    )\n```\n\n**列表 15-32：列表 15-30](#chapter15.xhtml_list15-30)的 AST**\n\n\
  该 AST 包含了我们在类型检查期间插入的两个 `AddrOf` 表达式。内部的 ❺ 获取 `arr` 的地址，外部的 ❸ 获取 `arr[i]` 的地址。当然，`arr`、`i`\
  \ 和 `j` 会在标识符解析期间被重命名，但我们在这个示例中忽略这一点。\n\n一如既往，我们以后序将此 AST 转换为 TACKY，在处理表达式本身之前处理每个表达式的操作数。我们处理的第一个非叶子\
  \ AST 是内部的 `AddrOf` 表达式，它获取 `arr` 的地址 ❺。将其转换为 `GetAddress` 指令：\n\n```\ntmp0 = GetAddress(arr)\n\
  ```\n\n接下来，为了实现内部的 `Subscript` 表达式 ❹，我们发布一个 `AddPtr` 指令：\n\n```\ntmp1 = AddPtr(tmp0,\
  \ i, 16)\n```\n\n这里的比例为 `16` 是因为 `tmp0` 指向一个四个 `int` 的数组。下标运算的第二部分是对结果进行引用，因此我们将向调用者返回\
  \ `DereferencedPointer(tmp1)`。\n\n在调用者中，我们处理外部的 `AddrOf` 表达式 ❸。当我们获取解引用指针的地址时，这些操作会相互抵消。因此，返回\
  \ `PlainOperand(tmp1)` 作为该表达式的结果，而不发布任何进一步的指令。\n\n现在我们处理外部的 `Subscript` 表达式 ❷。再次，我们发布一个\
  \ `AddPtr` 指令：\n\n```\ntmp2 = AddPtr(tmp1, j, 4)\n```\n\n然后我们向调用者返回 `DereferencedPointer(tmp2)`。因为这个\
  \ `Subscript` 表达式出现在 `Return` 语句 ❶ 中，而不是 `AddrOf` 或赋值表达式中，我们对该结果进行左值转换。这意味着我们发布了一个\
  \ `Load` 指令：\n\n```\ntmp3 = Load(tmp2)\n```\n\n现在 `tmp3` 包含了整个表达式的左值转换结果，因此我们返回它：\n\
  \n```\nReturn(tmp3)\n```\n\n正如示例所示，当我们对多维数组进行索引时，解引用操作和隐式地址加载会相互抵消，不会产生任何额外的指令。因此，在到达标量数组元素之前，任何下标和引用运算符在\
  \ TACKY 中都转化为纯粹的指针算术，而不产生 `Load` 或 `Store` 指令。\n\n### 复合初始化\n\n为了处理复合初始化，我们计算初始化器中的每个标量表达式，并使用\
  \ `CopyToOffset` 指令将其拷贝到内存中相应的位置。例如，我们将初始化器\n\n```\nlong arr[3] = {1l, 2l, 3l};\n\
  ```\n\n转换为以下指令序列：\n\n```\nCopyToOffset(1l, \"arr\", 0)\nCopyToOffset(2l, \"arr\"\
  , 8)\nCopyToOffset(3l, \"arr\", 16)\n```\n\n\n\n\n由于 `long` 是 8 字节，因此每个元素的偏移量增加\
  \ 8。即使在处理嵌套初始化器时，我们也只需要将叶子节点的标量值拷贝到正确的内存位置。例如，我们将：\n\n```\nlong nested[2][3] = {{1l,\
  \ 2l, 3l}, {4l, 5l, 6l}};\n```\n\n转换为：\n\n```\nCopyToOffset(1l, \"nested\", 0)\n\
  CopyToOffset(2l, \"nested\", 8)\nCopyToOffset(3l, \"nested\", 16)\nCopyToOffset(4l,\
  \ \"nested\", 24)\nCopyToOffset(5l, \"nested\", 32)\nCopyToOffset(6l, \"nested\"\
  , 40)\n```\n\n这种转换非常直观，因此我将省略它的伪代码。不过，我要指出的是，你应该使用类型检查器添加到每个复合初始化器中的类型信息来计算每个元素的偏移量。\n\
  \n### 临时数组定义\n\n回想，当我们把符号表项转换为 `StaticVariable` 结构时，我们将临时定义的变量初始化为零。对于临时定义的数组也是如此。你应该使用我们在上一节中添加的新型初始化器\
  \ `ZeroInit(n)` 来将一个 *n*-字节的数组初始化为零。\n\n你也可以使用 `ZeroInit` 来初始化临时定义的标量变量。为了保持一致，只有当你在类型检查器中使用\
  \ `ZeroInit` 将显式定义的标量变量初始化为零时，才在此处使用它。\n\n### 汇编生成\n\n我们在本章中不会引入任何新的汇编指令。然而，我们将引入一种内存寻址模式，有时称为*索引寻址*（indexed\
  \ addressing）。现在，我们可以通过寄存器中的基地址和常量偏移量来指定内存操作数，例如 `4(%rax)`。使用索引寻址，我们可以将基地址存储在一个寄存器中，将索引存在另一个寄存器中。我们还可以指定一个比例，该比例必须是常量\
  \ `1`、`2`、`4` 或 `8`之一。以下是索引寻址的示例：\n\n```\nmovl$5, (%rax, %rbx, 4)\n```\n\n为了找到这条\
  \ `movl` 指令的目标地址，CPU 将计算 `RAX + RBX × 4`。然后，它会将 4 字节常量 `5` 存储在该地址。这种寻址模式对于数组访问非常方便。如果\
  \ `RAX` 持有 `int` 对象数组的地址，`RBX` 持有该数组的索引 `i`，操作数 `(%rax, %rbx, 4)` 指定了索引为 `i` 的元素。\n\
  \n我们将添加一个新的操作数来支持索引寻址：\n\n```\nIndexed(reg base, reg index, int scale)\n```\n\n\
  我们还对汇编 AST 了一些其他更改，以帮助后续阶段的账目工作。首先，我们将添加另一个操作数来表示尚未赋值的聚合对象：\n\n```\nPseudoMem(identifier,\
  \ int)\n```\n\n`PseudoMem` 操作数与现有的 `Pseudo` 操作数的作用相似；它允许我们在分配寄存器或内存位置之前在汇编中表示变量。区别在于，`PseudoMem`\
  \ 代表聚合对象，我们始终将其存储在内存中（一旦我们实现了寄存器分配）。相反，`Pseudo` 代表可能存储在寄存器中的标量对象。`PseudoMem` 操作数还允许我们指定进入对象的字节偏移量。注意，该操作数中的\
  \ `identifier` 指的是一个聚合对象，而不是指向聚合对象的指针。\n\n接下来，我们将添加一种新的汇编类型来表示数组。在汇编中，我们将数组视为一段无差的内存块。我们不再需要跟踪该内存块中将存储多少个对象，或者这些对象是什么。然而，我们确实关心它的对齐情况和占用的空间，以便我们为它分配栈空间。因此，我们将数组类型转换为新的\
  \ `ByteArray` 类型：\n\n```\nassembly_type = Longword | Quadword | Double | ByteArray(int\
  \ size, int alignment)\n```\n\n最后，我们将调整表示静态变量的方式。与早期的编译器阶段一样，我们现在使用一组 `static_init`\
  \ 值列表来初始化静态变量，而不是仅仅一个值：\n\n```\nStaticVariable(identifier name, bool global, int\
  \ alignment, static_init* init_list)\n```\n\n列表 15-33 列出了本章中对汇编 AST 的所有更改。\n\n```\n\
  program = Program(top_level*)\nassembly_type = Longword | Quadword | Double | ByteArray(int\
  \ size, int alignment)\ntop_level = Function(identifier name, bool global, instruction*\
  \ instructions)\n          | StaticVariable(identifier name, bool global, int alignment,\
  \ static_init* init_list)\n          | StaticConstant(identifier name, int alignment,\
  \ static_init init)\ninstruction = Mov(assembly_type, operand src, operand dst)\n\
  \            | Movsx(operand src, operand dst)\n            | MovZeroExtend(operand\
  \ src, operand dst)\n            | Lea(operand src, operand dst)\n            |\
  \ Cvttsd2si(assembly_type dst_type, operand src, operand dst)\n            | Cvtsi2sd(assembly_type\
  \ src_type, operand src, operand dst)\n            | Unary(unary_operator, assembly_type,\
  \ operand)\n            | Binary(binary_operator, assembly_type, operand, operand)\n\
  \            | Cmp(assembly_type, operand, operand)\n            | Idiv(assembly_type,\
  \ operand)\n            | Div(assembly_type, operand)\n            | Cdq(assembly_type)\n\
  \            | Jmp(identifier)\n            | JmpCC(cond_code, identifier)\n   \
  \         | SetCC(cond_code, operand)\n            | Label(identifier)\n       \
  \     | Push(operand)\n            | Call(identifier)\n            | Ret\nunary_operator\
  \ = Neg | Not | Shr\nbinary_operator = Add | Sub | Mult | DivDouble | And | Or |\
  \ Xor\noperand = Imm(int) | Reg(reg) | Pseudo(identifier) | Memory(reg, int) | Data(identifier)\n\
  \        | PseudoMem(identifier, int) | Indexed(reg base, reg index, int scale)\n\
  cond_code = E | NE | G | GE | L | LE | A | AE | B | BE\nreg = AX | CX | DX | DI\
  \ | SI | R8 | R9 | R10 | R11 | SP | BP\n    | XMM0 | XMM1 | XMM2 | XMM3 | XMM4 |\
  \ XMM5 | XMM6 | XMM7 | XMM14 | XMM15\n```\n\n\n\n\n每当我们将一个聚合（aggregate）TACKY `Var`\
  \ 转换为汇编时，我们将使用零偏移量来指定整个对象。\n\n接下来，让我们处理新的 `CopyToOffset` 和 `AddPtr` 指令。我们将使用一个带有适当偏移量的\
  \ `PseudoMem` 操作数来表示 `CopyToOffset` 指令的目标地址。因此，我们将\n\n```\nCopyToOffset(src, dst,\
  \ offset)\n```\n\n转换为：\n\n```\nMov(<src type>, src, PseudoMem(dst, offset))\n```\n\
  \n我们将使用带有新的 `Indexed` 操作数的 `Lea` 指令来实现 `AddPtr`。具体细节取决于比例（scale）和索引。首先，考虑比例为 `1`、`2`、`4`\
  \ 或 `8` 的情况。我们将\n\n```\nAddPtr(ptr, index, scale, dst)\n```\n\n转换为 列表 15-34。\n\n\
  ```\nMov(Quadword, ptr, Reg(AX))\nMov(Quadword, index, Reg(DX))\nLea(Indexed(AX,\
  \ DX, scale), dst)\n```\n\n**列表 15-34：在汇编中实现 `AddPtr`**\n\n首先，我们将 `ptr` 和 `index`\
  \ 拷贝到寄存器；我在这里使用了 RAX 和 RDX，但除了调用者保存寄存器或我们的临时寄存器之外，任何寄存器都可以。然后，发射一条 `Lea` 指令来计算 `ptr\
  \ + index * scale` 并结果存储在 `dst` 中。\n\n`AddPtr` 的比例可能不是 `Indexed` 支持的四个值之一，特别是当我们正在索引一个多维数组而不是标量对象数组时。在这种情况下，我们将使用单独的指令将比例乘以索引，如\
  \ 列表 15-35 所示。\n\n```\nMov(Quadword, ptr, Reg(AX))\nMov(Quadword, index, Reg(DX))\n\
  Binary(Mult, Quadword, Imm(scale), Reg(DX))\nLea(Indexed(AX, DX, 1), dst)\n```\n\
  \n**列表 15-35：在汇编中用非标准比例实现 `AddPtr`**\n\n如果 `index` 操作数是一个常量，我们可以在编译时计算 `index *\
  \ scale` 来节省一条指令。然后，我们只需生成 列表 15-36 中的两条指令即可。\n\n```\nMov(Quadword, ptr, Reg(AX))\n\
  Lea(Memory(AX, index * scale), dst)\n```\n\n**列表 15-36：用常量索引实现 `AddPtr`**\n\n接下来，我们将处理指针比较。我们将完全像整数比较一样实现这些操作，使用无符号代码：`A`、`AE`、`B`\
  \ 和 `BE`。\n\n最后，让我们谈谈数组的对齐。在两种情况下我们需要计算数组的对齐齐：当我们将数组类型的 `StaticVariable` 从 TACKY\
  \ 转换为汇编时（汇编中的 `StaticVariable` 包含一个 `alignment` 字段），以及当我们将数组类型的前端符号表条目转换为后端符号表中的对应条目时。后端符号表中每个数组的汇编类型将是具有适当大小和对齐方式的\
  \ `ByteArray`。大小将是数组元素类型的字节数乘以元素数量。计算对齐的规则稍微没那么直观。如果数组小于 16 字节，它的对齐方式与其标量元素相同。例如，类型为\
  \ `int[2]` 的数组和类型为 `int[2][1]` 的数组对齐方式均为 4。如果数组类型变量为 16 字节或更大，其对齐方式始终为 16，无论元素是什么类型。此要求使得可以使用\
  \ SSE 指令同时操作多个数组元素。我们没有这样使用 SSE 指令，但我们需要与可能这样操作的对象文件保持 ABI 兼容性。\n\n请注意，这种对齐要求仅适用于变量，而不适用于嵌套数组。例如，如果我们声明变量\n\
  \n```\nint nested[3][5];\n```\n\n那么 `nested` 需要从 16 字节对齐的地址开始，因为它的总大小为 60 字节。但它的第一个和第二个元素分别从\
  \ `nested` 开始 20 字节和 40 字节处，所以它们并不是 16 字节对齐的，尽管这些元素每个都大于 16 字节。\n\n表 15-1 到 15-5\
  \ 汇总了本章对此编译通过的更新；按照惯例，新的构造和对现有构造转换的更改已加粗显示。\n\n**表 15-1：将顶层 TACKY 构造转换为汇编**\n\n\
  | TACKY 顶层构造 | 汇编顶层构造 |\n| :--- | :--- |\n| `StaticVariable(name, global, t, init_list)`\
  \ | `StaticVariable(name, global, <alignment of t>, init_list)` |\n\n**表 15-2：将\
  \ TACKY 指令转换为汇编**\n\n| TACKY 指令 | 汇编指令 |\n| :--- | :--- |\n| `AddPtr(ptr, index,\
  \ scale, dst)` | `Constant index` | `Mov(Quadword, ptr, Reg(<R>)) Lea(Memory(<R>,\
  \ index * scale), dst)` |\n| `Variable index and scale of 1, 2, 4, or 8` | `Mov(Quadword,\
  \ ptr, Reg(<R1>)) Mov(Quadword, index, Reg(<R2>)) Lea(Indexed(<R1>, <R2>, scale),\
  \ dst)` |\n| `Variable index and other scale` | `Mov(Quadword, ptr, Reg(<R1>)) Mov(Quadword,\
  \ index, Reg(<R2>)) Binary(Mult, Quadword, Imm(scale), Reg(<R2>)) Lea(Indexed(<R1>,\
  \ <R2>, 1), dst)` |\n\n\n\n\n\n表 15-3：将 TACKY 比较转换为汇编\n\n| TACKY 比较 | | 汇编条件码 |\n\
  | --- | --- | --- |\n| `LessThan` | 有符号 | `L` |\n| | 无符号、指针或 `double` | `B` |\n\
  | `LessOrEqual` | 有符号 | `LE` |\n| | 无符号、指针或 `double` | `BE` |\n| `GreaterThan` |\
  \ 有符号 | `G` |\n| | 无符号、指针或 `double` | `A` |\n| `GreaterOrEqual` | 有符号 | `GE` |\n\
  | | 无符号、指针或 `double` | `AE` |\n\n表 15-4：将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | | 汇编操作数\
  \ |\n| --- | --- | --- |\n| `Var(identifier)` | 标量值 | `Pseudo(identifier)` |\n|\
  \ | 聚合值 | `PseudoMem(identifier, 0)` |\n\n表 15-5：将类型转换为汇编\n\n| 源类型 | 汇编类型 | 对齐 |\n\
  | --- | --- | --- |\n| `Array(element, size)` | 16 字节或更大的变量 `ByteArray(element *\
  \ size, 16)` | 16 |\n| 其他所有 `ByteArray(element * size, alignment of element)` |\
  \ 与元素相同的对齐 |\n\n接下来，我们将用具体的地址替换 `PseudoMem` 操作数。\n\n#### 替换 PseudoMem 操作数\n\n我们不能再将此遍历称为“寄存器替换”了，因为我们正在替换聚合值。就像为\
  \ `Longword` 分配 4 字节、为 `Quadword` 分配 8 字节一样，我们将为类型为 `ByteArray(size, alignment)`\
  \ 的对象分配 `size` 字节。按照惯，我们将数组地址向下对齐到适当的边界。\n\n一旦数组被分配了内存地址，我们将替换任何引用它的 `PseudoMem`\
  \ 操作数。`PseudoMem` 操作数包括相对于数组起始位置偏移量，而数组的实际地址包括相对于 RBP 地址的偏移量。我们将这两个偏移量相加以构造一个新的内存地址。例如，假设我们遇到以下内容：\n\
  \n```\nMov(Longword, Imm(3), PseudoMem(\"arr\", 4))\n```\n\n假设我们之前为 `arr` 分配了栈地址\
  \ `-12(%rbp)`。我们计算 `-12 + 4`，确定新的具体操作数是 `-8(%rbp)`。然后我们相应地重写指令：\n\n```\nMov(Longword,\
  \ Imm(3), Memory(BP, -8))\n```\n\n要访问具有静态存储期的数组，我们使用现有的 `Data` 操作数。如果 `arr` 是一个静态数组，我们将\n\
  \n```\nPseudoMem(\"arr\", 0)\n```\n\n转换为：\n\n```\nData(\"arr\")\n```\n\n如果我们遇到任何任何非零\
  \ `n` 的 `PseudoMem(\"arr\", n)`，我们就有麻烦了，因为 `Data` 操作数不包含偏移量。幸运的是，这种情况不会发生。目前，我们仅使用非零偏移量的\
  \ `PseudoMem` 操作数来初始化具有自动存储期的数组，而不是用于访问具有静态存储期的数组。\n\nRIP 相对寻址*确实*支持常量偏移量——例如，`foo+4(%rip)`\
  \ 代表符号 `foo` 之后 4 字节的地址——但我们还无法在汇编 AST 中表示这些偏移量。我们将在第 18 章中添加它们，以支持对结构的操作。\n\n####\
  \ 修复指令\n\n我们没有引入任何新指令，因此不需要任何新的指令修复规则。此遍历必须识别出新的 `Indexed` 操作数指定内存地址，因此不能在需要寄存器或立即数的地方使用。否则，我们不需要做任何更改。\n\
  \n### 代码发射\n\n我们在此阶段进行四个微小的补充。首先，我们将发射新的 `Indexed` 操作数。其次，我们将静态的 `ZeroInit` 初始化器作为\
  \ `.zero` 汇编指令输出。例如，我们将 `ZeroInit(32)` 输出为：\n\n```\n .zero 32\n```\n\n\n\n\n第三，如果变量的唯一初始化器是\
  \ `ZeroInit`，我们将将其写入 BSS 段而不是数据段。\n\n最后，当我们定义静态变量时，我们将输出关联初始化列表中的每个项。文件作用域声明\n\n\
  ```cpp\nint arr[4] = {1, 2, 3};\n```\n\n最终将被翻译为列表 15-37 中的汇编代码。\n\n```assembly\n\
  \ .globl arr\n    .data\n    .align 16\narr:\n    .long 1\n    .long 2\n    .long\
  \ 3\n    .zero 4\n```\n\n列表 15-37：在汇编语言中初始化静态数组\n\n注意，我们将此数组的最后一个元素初始化为零，因为它没有被显式初始化。\n\
  \n表 15-6 到 15-8 总结了这些对代码生成阶段的补充，其中新的构造以及对现有构造输出方式的更改已**加粗**。\n\n表 15-6：顶层汇编构造的格式\n\
  \n| 汇编顶层构造 | | 输出 |\n| --- | --- | --- |\n| | | ```assembly\nStaticVariable(name,\
  \ global,\n               alignment,\n                          init_list)\n```\
  \ | | ```assembly\n初始化为零的整数，或任何仅用 ZeroInit 化的变量\n``` | | ```assembly\n <global-directive>\
  \ \n     .bss \n     <alignment-directive>\n<name>: \n     <init_list>\n``` | |\
  \ |\n| 所有其他变量 | | ```assembly\n <global-directive> \n     .data \n     <alignment-directive>\n\
  <name>: \n     <init_list>\n``` | | |\n\n表 15-7：静态初始化器的格式\n\n| 静态初始化器 | 输出 |\n|\
  \ --- | --- |\n| `ZeroInit(n)` | `.zero` `n` |\n\n表 15-8：汇编操作数的格式\n\n| 汇编操作数 | 输出\
  \ |\n| --- | --- |\n| `Indexed(reg1, reg2, int)` | ```assembly\n(<reg1>, <reg2>,\
  \ <int>)\n``` | | |\n\n完成这些更改后，你可以测试你的编译器了。\n\n### 总结\n\n你刚刚实现了你的第一个聚合类型！在本章中，你学习了如何解析数组声明符和复合初始化器。在类型检查器中，你将数组到指针的隐式转换变为显式，并分析了指针算术表达式的类型。在生成\
  \ TACKY 时，你依赖这些转换和类型信息来清晰地处理指针操作，无论它们指向的是数组还是标量值。在后端，你添加了新的、更灵活的方法访问内存的方法。\n\n在下一章中，你将实现另外三种整数类型：`char`、`signed\
  \ char` 和 `unsigned char`。你还将实现字符串字面量，根据上下文，可以是复合初始化器，也可以退化为指针的 `char` 数组。由于你已经实现了整数类型、指针和数组，因此那里工作的大部分基础已经就绪。\n\
  \n![](img/pg422.jpg)\n\n## 16 字符与字符串\n\n![](img/opener.jpg)\n\n在本章中，你将实现另外三种整数类型：`char`、`signed\
  \ char` 和 `unsigned char`。这些是字符类型，大小为 1 字节。你还将实现字符串字面量。字符串字面量扮演着奇怪的角色：它们有时表现得像复合初始化器，而有时代表\
  \ `char` 数组。为了支持后者，你将在常量字符串存储在符号表旁边。在第 9 章中，我们编译了一个一次打印一个字符的程序版本。这次，我们将编译一个更合理的版本，可以打印整个字符串。\n\
  \n### 字符特性\n\n字符类型最令人惊讶的地方是它们竟然有三种。`int` 和 `signed int` 之间或 `long` 和 `signed long`\
  \ 之间没有区别，但指定符 `char` 和 `signed char` 指的是两种不同的类型。“普通” `char` 是有符号还是无符号是由实现决定的。我们将遵循\
  \ System V ABI，该标准规定 `char` 是有符号的。\n\n尽管 `char` 和 `signed char` 在我们的实现中行为相同，但它们是不同类型这一事实产生了实际后果。例如，列表\
  \ 16-1 是非法的，因为它将同一个全局变量同时声明为 `char` 和 `signed char`。\n\n```c\nchar c;\nsigned char\
  \ c;\n```\n\n另一方面，将全局变量同时声明为 `int` 和 `signed int` 是完全合法的，因为这两个声明指定了相同的类型。\n\n\n\n\
  \n字符类型的类型转换规则也与其他整数类型略有不同。当字符被用于一元 `+`、`-` 或 `~` 操作；位二元运算；或常规算术转换时，它首先会被转换为 `int`。这些转换被称为`整数提升`（integer\
  \ promotions）。（如果 `int` 无法容纳特定字符类型的所有值，则字符将转换为 `unsigned int`。在我们的实现中，`int` 可以容纳每个字符类型的所有值，因此这个问题并不实际存在。当然，我们也可以忽略尚未实现的操作的类型规则，例如一元\
  \ `+` 和位二元运算；我在这里提到它们仅仅是为了完整性。）\n\n字符与其他整数之间还有一个值得注意的区别：在 C17 中，没有字符类型的标量常量。像 `'a'`\
  \ 这样的标记（Tokens）尽管被称为“字符常量”，但它们的类型都是 `int`。存在具有*宽字符类型*的常量，如 `char16_t`、`char32_t`\
  \ 和 `wchar_t`，用于表示多字节字符，但我们不会实现它们。\n\n> **注意**\n\n> *C23 引入了类型为 unsigned char 的\
  \ u8 字符常量。这些表示 1 字节的 UTF-8 字符*\n\n### 字符串字面量\n\n在本章中，我会区分字符串字面量（string literals）和字符串（strings）。*字符串字面量*是源代码中出现的表达式，例如\
  \ `\"abc\"`。*字符串*是内存中的对象——具体来说是以空字符结尾的 `char` 数组。某些字符串在运行时是不可的；我将这些称为*常量字符串*，尽管这不是标准术语。\n\
  \n你可以用不同的方式使用字符串字面量。首先，它可以初始化任何字符类型的数组：\n\n```\nsigned char array[4] = \"abc\";\n\
  ```\n\n如果有空间，我们会包含一个终止空字节，如果没有空间，则省略它。这与我们通常的数组初始化规则一致：如果初始化器比目标对象短，我们用零填充剩余部分。因此，之前的声明等同于：\n\
  \n```\nsigned char array[4] = {'a', 'b', 'c', 0};\n```\n\n另一方面，在 Listing 16-2 中，我们在\
  \ `array1` 中省略了空字节，因为数组的大小不足以包含它。因此，`array1` 和 `array2` 具有相同的内容。\n\n```\nchar array1[3]\
  \ = \"abc\";\nchar array2[3] = {'a', 'b', 'c'};\n```\n\n*Listing 16-2: 使用字符串字面量作为数组初始化且不带空字节*\n\
  \n当字符串字面量出现在数组初始化以外的任何地方时，它指定一个常量字符串。在这种背景下，字符串字面量的行为非常像其他数组类型的表达式。它们像其他数组表达式一样退化为指针，因此你可以对它们进行下标操作或将其赋值给\
  \ `char *` 对象。接下来的声明将变量 `str_ptr` 初始化为常量字符串 `\"abc\"` 中第一个字符的地址：\n\n```\nchar *str_ptr\
  \ = \"abc\";\n```\n\n字符串字面量也是左值（lvalues），因此它们支持 `&` 运算符。在这里我们使用该运算符获取常量字符串 `\"abc\"\
  ` 的地址，然后将其赋值给 `char *array_ptr`。\n\n```\nchar *array_ptr = &\"abc\";\n```\n\n与上一个示例唯一的区别在于，字符串字面量没有经历退化。我们最终得到的是指向整个字符串的指针\
  \ `char (*)[4]`，而不是指向其第一个元素的指针 `char *`。在两个示例中，我们都把 `\"abc\"` 视为任何其他表达式。与数组不同，常量字符串是常量的。尝试修改它们（如\
  \ Listing 16-3 所示）会导致未定义行为。\n\n```\nchar *ptr = \"abc\";\nptr[0] = 'x';\n```\n\n\
  *Listing 16-3: 非法修改常量*\n\n尽管这段代码可以编译，但它可能会抛出运行时错误，因为大多数实现（包括我们的实现）将常量字符串存储在只读内存中。`const`\
  \ 限定符，我们不会实现它（如果 Listing 16-3 是真实的 C 程序的一部分，那么为 `ptr` 加上 `const` 是个好主意。）\n\n让我们来看另一个示例，如\
  \ Listing 16-4 所示，以澄清指定常量字符串的字符串字面量与初始化数组的字符串字面量之间的区别。\n\n```\nchar arr[3] = \"\
  abc\";\narr[0] = 'x';\n```\n\n*Listing 16-4: 合法修改从字面量初始数组*\n\n与 Listing 16-3 不同，这段代码是完全合法的。在\
  \ Listing 16-3 中，`ptr` 指向常量字符串 `\"abc\"` 的开头。而在 Listing 16-4 中，我们使用字符串字面量 `\"abc\"\
  ` 的每个字符来初始化 `arr` 的一个元素，这是一个普通的非常量 `char` 数组。一旦我们看到它们如何转换为汇编，两种情况都更容易理解。\n\n###\
  \ 在汇编中处理字符串\n\n我们将使用两个不同的汇编指令在汇编中初始化字符串。`.ascii` 和 `.asciz` 指令都告诉汇编器向目标文件写入 ASCII\
  \ 字符串，就像 `.quad` 告诉它写入一个双字（quadword）一样。区别在于 `.asciz` 会包含一个终止空字节，而 `.ascii` 则不会。这三个声明\n\
  \n```\nstatic char null_terminated[4] = \"abc\";\nstatic char not_null_terminated[3]\
  \ = \"abc\";\nstatic char extra_padding[5] = \"abc\";\n```\n\n对应于 Listing 16-5 中的汇编代码。\n\
  \n\n\n\n\n```\n .data\nnull_terminated:\n    .asciz \"abc\"\nnot_null_terminated:\n\
  \    .ascii \"abc\"\nextra_padding:\n    .asciz \"abc\"\n    .zero 1\n```\n\n列表\
  \ 16-5：在汇编中使用字符串字面量初始化三个静态字符数组\n\n由于 `null_terminated` 的长度足够容纳一个空字节，因此我们使用 `.asciz`\
  \ 指令对其进行初始化。我们使用 `.ascii` 初始化 `not_null_terminated`，以防超出数组边界。由于 `extra_padding`\
  \ 需要两个零字节来达到正确长度，我们写入一个空字节终止的字符串，然后使用 `.zero` 指令写入一个额外的零字节。注意，这些变量都不需要 `.align`\
  \ 指令。字符类型都是 1 字节对齐的，字符数组也是如此。（包含 16 或更多字符的数组变量是个例外；它们是 16 字节对齐的，就像所有 16 字节或更大的数组变量一样。）\n\
  \n`.ascii` 和 `.asciz` 指令初始化具有静态存储持续期的对象。接下来，让我们考虑列表 16-6，它初始化了一个非静态数组。\n\n```\n\
  int main(void) {\n    char letters[6] = \"abcde\";\n    return 0;\n}\n```\n\n列表\
  \ 16-6：使用字符串字面量初始化非静态数组\n\n列表 16-7 展示了在汇编中初始化 `letters` 的一种方法，通过通过字节逐地将 `\"abcde\"\
  ` 拷贝到栈上。\n\n```\nmovb    $97,  -8(%rbp)\nmovb    $98,  -7(%rbp)\nmovb    $99,  -6(%rbp)\n\
  movb    $100, -5(%rbp)\nmovb    $101, -4(%rbp)\nmovb    $0,   -3(%rbp)\n```\n\n\
  列表 16-7：在汇编中初始化非静态字符数组\n\n字符 `'a'`、`'b'`、`'c'`、`'d'` 和 `'e'` 的 ASCII 值分别为 `97`、`98`、`99`、`100`\
  \ 和 `101`。假设 `letters` 起于栈地址 `-8(%rbp)`，列表 16-7 中的指令将每个字符拷贝到数组中相应的位置。每个 `movb` 指令中的\
  \ `b` 后缀表示它操作的是单个字节。\n\n列表 16-8 展示了一种更高效的方法。我们使用单个 `movl` 指令初始化该字符串的前 4 个字节，然后使用\
  \ `movb` 指令初始化剩余的 2 个字节。\n\n```\nmovl    $168423489, -8(%rbp)\nmovb    $101, -4(%rbp)\n\
  movb    $0, -3(%rbp)\n```\n\n列表 16-8：在汇编中初始化非静态字符数组的更高效方法\n\n当我们把字符串的前 4 个字节解释为整数时，就得到了得到\
  \ `168423489`。（我将在本章节稍后的部分讨论如何获得这个整数。）此列表的效果与列表 16-7 相同，但为我们节省了几条指令。\n\n接下来，让我们看看常量字符串。我们将它们写入目标文件的只读段，就像浮点数常量一样。在\
  \ Linux 上，我们将常量字符串存储在 `.rodata` 中；在 macOS 上，我们将它们存储在 `.cstring` 段。考虑列表 16-9 中的代码片段，它返回一个指向常量起始位置指针。\n\
  \n```\nreturn \"A profound statement.\";\n```\n\n列表 16-9：返回指向字符串起始位置指针\n\n我们将为此字符串生成一个唯一的标签，然后在相应的段中定义它。列表\
  \ 16-10 给出了生成的汇编代码。\n\n```\n .section .rodata\n.Lstring.0:\n    .asciz \"A profound\
  \ statement.\"\n```\n\n列表 16-10：在汇编中定义常量字符串\n\n常量字符串总是空字节终止的，因为它们不需要适应任何数组维度。一旦我们定义了常量字符串，就可以像访问其他静态对象一样通过\
  \ RIP 相对寻址访问它。在这个特定的示例中，我们想要返回字符串的地址，因此使用此指令将其加载到 `RAX`：\n\n```\nleaq    .Lstring.0(%rip),\
  \ %rax\n```\n\n最后，让我们看看如何像列表 16-11 那样用字符串字面量初始化静态指针。\n\n```\nstatic char *ptr =\
  \ \"A profound statement.\";\n```\n\n列表 16-11：从字符串字面量初始化静态 char *\n\n我们将以与列表 16-10\
  \ 相同的方式定义字符串。然而我们不能用 `lea` 指令将其加载到 `ptr`。因为 `ptr` 是静态的，它必须在程序启动之前初始化。幸运的是，`.quad`\
  \ 指令接受标签和常量。列表 16-12 展示了如何使用此指令初始化 `ptr`。\n\n```\n .data\n    .align 8\nptr:\n \
  \   .quad .Lstring.0\n```\n\n列表 16-12：使用静态常量的地址初始化静态变量\n\n`.quad .Lstring.0` 指令告诉汇编器和链接器写入\
  \ `.Lstring.0` 的地址。\n\n此外，可以使用这种方法初始化任何静态指针，而不只是指向字符串的指针。虽然我们的实现不接受像 `&x` 这样的表达式作为静态初始化器，但更完整的编译器可能会将\n\
  \n```\nstatic int x = 10;\nstatic int *ptr = &x;\n```\n\n翻译为：\n\n```\n .data\n \
  \   .align 4\nx:\n    .long 10\n    .align 8\nptr:\n    .quad x\n```\n\n\n\n\n\n\
  此时，你已经掌握了足够的如何在 C 语言和汇编中使用字符串的知识，可以开始了。第一步是扩展词法器以识别字符串字面量和字符常量。\n\n### 词法器\n\n你将在本章中添加三个新的标记（tokens）：\n\
  \n- `char`：一个关键字，用于指定字符类型\n- `Character constants`（字符常量）：单个字符，例如 `'a'` 和 `'\\n'`\n\
  - `String literals`（字符串字面量）：字符序列，例如 `\"Hello, World!\"`\n\n字符常量由单引号包裹的单个字符（如 `a`）或转义序列（如\
  \ `\\n`）组成。C 标准第 6.4.4.4 节定义了一组特殊字符的转义序列。表 16-1 列出了这些转义序列及其 ASCII 码。\n\n#### 表 16-1：特殊字符的转义序列\n\
  \n| 转义序列 | 描述 | ASCII 码 |\n| --- | --- | --- |\n| `\\'` | 单引号 | 39 |\n| `\\\"` |\
  \ 双引号 | 34 |\n| `\\?` | 问号 | 63 |\n| `\\\\` | 反斜杠 | 92 |\n| `\\a` | 听觉警报 | 7 |\n\
  | `\\b` | 退格 | 8 |\n| `\\f` | 换页 | 12 |\n| `\\n` | 新行 | 10 |\n| `\\r` | 回车 | 13\
  \ |\n| `\\t` | 水平制表符 | 9 |\n| `\\v` | 垂直制表符 | 11 |\n\n\n\n\n\n标准定义了其他几种字符串字面量和字符常量，但我们将不会实现它们。特别是，我们不支持十六进制转义序列（如\
  \ `\\xff`）、八进制转义序列（如 `\\012`）或多字符常量（如 `'ab'`）。我们不支持任何用于非 ASCII 编码的类型或常量，例如宽字符类型、宽字符串字面量或\
  \ UTF-8 字符串字面量。\n\n### 解析器\n\n我们将从三个方面扩展 AST 的定义。首先，我们将添加 `char`、`signed char` 和\
  \ `unsigned char` 类型。其次，我们将添加一种新的表达式来表示字符串字面量。第三，我们将扩展 `const` AST 节点以表示具有字符类型的常量：\n\
  \n```\nconst = ConstInt(int) | ConstLong(int) | ConstUInt(int) | ConstULong(int)\n\
  \      | ConstDouble(double) | ConstChar(int) | ConstUChar(int)\n```\n\n这些新的常量构造函数有些特殊，因为它们并不对应\
  \ C 程序中实际出现的常量字面量。像 `'a'` 这样的字符常量类型为 `int`，因此解析器会将它们转换为 `ConstInt` 节点；完全不会使用新的 `ConstChar`\
  \ 和 `ConstUChar` 构造函数。但在稍后，我们需要这些构造函数，即在类型检查期间填充部分初始化的字符数组，以及在 TACKY 中初始化字符数组时。\n\
  \nListing 16-15 提供了完整的 AST 定义，其中本章的更改已加粗显示。\n\n```\nprogram = Program(declaration*)\n\
  declaration = FunDecl(function_declaration) | VarDecl(variable_declaration)\nvariable_declaration\
  \ = (identifier name, initializer? init,\n                        type var_type,\
  \ storage_class?)\nfunction_declaration = (identifier name, identifier* params,\
  \ block? body,\n                        type fun_type, storage_class?)\ninitializer\
  \ = SingleInit(exp) | CompoundInit(initializer*)\ntype = Char | SChar | UChar |\
  \ Int | Long | UInt | ULong | Double\n     | FunType(type* params, type ret)\n \
  \    | Pointer(type referenced)\n     | Array(type element, int size)\nstorage_class\
  \ = Static | Extern\nblock_item = S(statement) | D(declaration)\nblock = Block(block_item*)\n\
  for_init = InitDecl(variable_declaration) | InitExp(exp?)\nstatement = Return(exp)\n\
  \          | Expression(exp)\n          | If(exp condition, statement then, statement?\
  \ else)\n          | Compound(block)\n          | Break\n          | Continue\n\
  \          | While(exp condition, statement body)\n          | DoWhile(statement\
  \ body, exp condition)\n          | For(for_init init, exp? condition, exp? post,\
  \ statement body)\n          | Null\nexp = Constant(const)\n    | String(string)\n\
  \    | Var(identifier)\n    | Cast(type target_type, exp)\n    | Unary(unary_operator,\
  \ exp)\n    | Binary(binary_operator, exp, exp)\n    | Assignment(exp, exp)\n  \
  \  | Conditional(exp condition, exp, exp)\n    | FunctionCall(identifier, exp* args)\n\
  \    | Dereference(exp)\n    | AddrOf(exp)\n    | Subscript(exp, exp)\nunary_operator\
  \ = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply | Divide\
  \ | Remainder | And | Or\n                | Equal | NotEqual | LessThan | LessOrEqual\n\
  \                | GreaterThan | GreaterOrEqual\nconst = ConstInt(int) | ConstLong(int)\
  \ | ConstUInt(int) | ConstULong(int)\n      | ConstDouble(double) | ConstChar(int)\
  \ | ConstUChar(int)\n```\n\nListing 16-15: 带有字符类型、字符常量和字符串字面量的抽象语法树\n\n\n\n\n\n\
  ```\n<program> ::= {<declaration>}\n<declaration> ::= <variable-declaration> | <function-declaration>\n\
  <variable-declaration> ::= {<specifier>}+ <declarator> [\"=\" <initializer>] \"\
  ;\"\n<function-declaration> ::= {<specifier>}+ <declarator> (<block> | \";\")\n\
  <declarator> ::= \"*\" <declarator> | <direct-declarator>\n<direct-declarator> ::=\
  \ <simple-declarator> [<declarator-suffix>]\n<declarator-suffix> ::= <param-list>\
  \ | {\"[\" <const> \"]\"}+\n<param-list> ::= \"(\" \"void\" \")\" | \"(\" <param>\
  \ {\",\" <param>} \")\"\n<param> ::= {<type-specifier>}+ <declarator>\n<simple-declarator>\
  \ ::= <identifier> | \"(\" <declarator> \")\"\n<type-specifier> ::= \"int\" | \"\
  long\" | \"unsigned\" | \"signed\" | \"double\" | ❶ \"char\"\n<specifier> ::= <type-specifier>\
  \ | \"static\" | \"extern\"\n<block> ::= \"{\" {<block-item>} \"}\"\n<block-item>\
  \ ::= <statement> | <declaration>\n<initializer> ::= <exp> | \"{\" <initializer>\
  \ {\",\" <initializer>} [\",\"] \"}\"\n<for-init> ::= <variable-declaration> | [<exp>]\
  \ \";\"\n<statement> ::= \"return\" <exp> \";\"\n              | <exp> \";\"\n \
  \             | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n  \
  \            | <block>\n              | \"break\" \";\"\n              | \"continue\"\
  \ \";\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n             \
  \ | \"do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\"\
  \ \"(\" <for-init> [<exp>] \";\" [<exp>] \")\" <statement>\n              | \";\"\
  \n<exp> ::= <unary-exp> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n\
  <unary-exp> ::= <unop> <unary-exp>\n              | \"(\" {<type-specifier>}+ [<abstract-declarator>]\
  \ \")\" <unary-exp>\n              | <postfix-exp>\n<postfix-exp> ::= <primary-exp>\
  \ {\"[\" <exp> \"]\"}\n<primary-exp> ::= <const> | <identifier> | \"(\" <exp> \"\
  )\" | ❷ {<string>}+\n                | <identifier> \"(\" [<argument-list>] \")\"\
  \n<argument-list> ::= <exp> {\",\" <exp>}\n<abstract-declarator> ::= \"*\" [<abstract-declarator>]\n\
  \                        | <direct-abstract-declarator>\n<direct-abstract-declarator>\
  \ ::= \"(\" <abstract-declarator> \")\" {\"[\" <const> \"]\"}\n                \
  \               | {\"[\" <const> \"]\"}+\n<unop> ::= \"-\" | \"~\" | \"!\" | \"\
  *\" | \"&\"\n<binop> ::= \"-\" | \"+\" | \"*\" | \"/\" | \"%\" | \"&&\" | \"||\"\
  \n          | \"==\" | \"!=\" | \"<\" | \"<=\" | \">\" | \">=\" | \"=\"\n<const>\
  \ ::= <int> | <long> | <uint> | <ulong> | <double> | ❸ <char>\n<identifier> ::=\
  \ ? 一个标识符标记 ?\n<string> ::= ? 一个字符串标记 ? ❹\n<int> ::= ? 一个整数标记 ?\n<char> ::= ? 一个字符标记\
  \ ? ❺\n<long> ::= ? 一个整数或长整数标记 ?\n<uint> ::= ? 一个无符号整数标记 ?\n<ulong> ::= ? 一个无符号整数或无符号长整数标记\
  \ ?\n<double> ::= ? 一个浮点数常量标记 ?\n```\n\n列表 16-16：包含字符类型、字符常量和字符串字面量的文法\n\n文法中**粗体**新增的部分对应我们刚刚讨论的对解析器的三个更改。文法现在包含了一个\
  \ `\"char\"` 类型说明符 ❶ 以及 `<string>` ❹ 和 `<char>` 标记 ❺。我们将一个或多个字符串字面量的序列识别为初级表达式 ❷，并将字符标记识别为常量\
  \ ❸。\n\n### 类型检查器\n\n在大多数情况下，类型检查器可以像处理其他整数类型一样处理字符。遵循相同的类型规则并支持相同的操作。整数提升是这一模式的唯一例外，因此我们将在本节中实现它们。我们还将为字符类型引入静态初始化器。\n\
  \n字符串字面量的类型检查更具挑战性，特别是当它们出现在初始化列表中时。我们需要跟踪每个字符串是应该直接使用还是转换为指针，以及哪些字符串应该以空字节终止。我们将在符号表中添加一些新构造结构来表示这些每种情况。\n\
  \n#### 字符\n\n作为常规算术转换的一部分，我们将字符类型提升为 `int`。[列表 16-17] 显示了如何在 `get_common_type` 中执行此操作。\n\
  \n```\nget_common_type(type1, type2):\n    if type1 is character type:\n       \
  \ type1 = Int\n    if type2 is character type:\n        type2 = Int\n```\n\n###\
  \ 列表 16-17：在常规过程中应用整数提升\n\n在提升两个操作数的类型后，我们将找到它们的共同类型。我们还将提升 `~` 和 `%` 操作。[列表 16-18]\
  \ 展示了如何处理取反的操作数。\n\n```\ntypecheck_exp(e, symbols):\n    match e with\n    | Unary(inner)\
  \ ->\n        typed_inner = typecheck(inner, symbols)\n        if typed_inner is\
  \ pointer type:\n            fail(\"Can't negate pointer\")\n        if typed_inner\
  \ is character type:\n            typed_inner = convert_to(typed_inner, Int)\n \
  \       unary_exp = Unary(typed_inner)\n      return set_type(unary_exp)\n```\n\n\
  在类型检查期间，我们将始终识别字符为整数类型。例如，我们将接受字符作为 `~` 和 `%` 表达式的操作数，以及指针算术中的索引。由于所有整数类型也是算术类型，我们将在\
  \ `convert_by_assignment` 中允许字符类型与任何算术类型之间的隐式转换。\n\n我们将为字符类型添加两个静态初始化器。[列表 16-19]\
  \ 给出了 `static_init` 的更新定义。\n\n```\nstatic_init = IntInit(int) | LongInit(int) |\
  \ UIntInit(int) | ULongInit(int)\n            | CharInit(int) | UCharInit(int)\n\
  \            | DoubleInit(double) | ZeroInit(int)\n```\n\n列表 16-19：为字符类型添加静态初始化器\n\
  \n由于 `signed char` 和 `char` 都是符号类型，我们将使用 `CharInit` 来初始化它们。根据我们在第 11 章和第 12 章介绍的类型转换规则，我们将每个初始化器转换为它初始化的类型。例如，如果一个\
  \ `unsigned char` 的初始化值大于 255，我们将该值对 256 取模。\n\n\n\n\n最后，我们将对非静态数组的复合初始化器的类型检查方式进行一次微小而直接的更新。（我们将在下一节中将初始化数组的字符串字面量作为一个单独的情况处理。）在前上一章节中，我们通过用零填充剩余元素来处理部分初始化的数组。我曾建议编写一个\
  \ `zero_initializer` 辅助函数来生成这些经过置零的初始化器。现在，我们可以扩展该函数，通过输出 `ConstChar` 和 `ConstUChar`\
  \ 来将字符类型的元素置零。\n\n### 表达式中的字符串字面量\n\n当我们在表达式中遇到字符串字面量（而不是数组初始化器中）时，我们将将其标记为相应大小的\
  \ `char` 数组。列表 16-20 显示了如何在 `typecheck_exp` 中处理字符串字面量。\n\n```\ntypecheck_exp(e,\
  \ symbols):\n    match e with\n    | --snip--\n    | String(s) -> return set_type(e,\
  \ Array(Char, length(s) + 1))\n```\n\n*列表 16-20: 字符串字面量的类型检查*\n\n注意，数组的大小考虑了一个终止空字节。类型检查器已经在\
  \ `typecheck_and_convert` 中处理了从数组到指针的隐式转换。现在 `typecheck_and_convert` 也会将字符串字面量转换为指针，因为它们具有数组类型。\n\
  \n接下来，我们将更新类型检查器，将 `String` 表达式识别为左值，类似于变量、下标运算符和解引用表达式。这允许程序使用 `&` 运算符获取它们的地址。\n\
  \n普通表达式中的字符串字面量已经处理完毕；现在我们将检查初始化器中的字符串字面量。\n\n### 初始化非静态变量的字符串字面量\n\n通常，我们使用 `typecheck_and_convert`\
  \ 来检查 `SingleInit` 构建，它会将数组类型的值转换为指针。这种方法正确处理了初始化指针的字符串字面量。但当使用字符串字面量初始化数组时，我们将以不同的方式进行类型检查。列表\
  \ 16-21 显示了如何处理这种情况。\n\n```\ntypecheck_init(target_type, init, symbols):\n    match\
  \ target_type, init with\n    | Array(elem_t, size), SingleInit(String(s)) ->\n\
  \      ❶ if elem_t is not a character type:\n            fail(\"Can't initialize\
  \ a non-character type with a string literal\")\n      ❷ if length(s) > size:\n\
  \            fail(\"Too many characters in string literal\")\n      ❸ return set_type(init,\
  \ target_type)\n    | --snip--\n```\n\n*列表 16-21: 初始化数组的字符串字面量的类型检查*\n\n首先，我们确保目标类型是字符数组，因为字符串字面量不能初始化其他类型的数组\
  \ ❶。然后，我们验证字符串长度是否长到无法初始化数组 ❷。最后，用目标类型标记初始化器 ❸。我们稍后将使用此标记来确定向字符串追加多少个空字节。\n\n###\
  \ 初始化静态变量的字符串字面量\n\n我们的最后一个任务是处理初始化静态变量的字符串字面量。我们需要在符号表中表示两种新的初始化值：ASCII 字符串（对应于\
  \ `.ascii` 和 `.asciz` 指令）和静态对象的地址（对应于 `.quad .Lstring.0` 等指令）。我们将再次更新 `static_init`\
  \ 以包含这两类初始化器。列表 16-22 提供了包含这些添加的新定义。\n\n```\nstatic_init = IntInit(int) | LongInit(int)\n\
  \            | UIntInit(int) | CharInit(int)\n            | DoubleInit(double) |\
  \ ZeroInit(int)\n            | StringInit(string, bool)\n            | PointerInit(string)\n\
  ```\n\n*列表 16-22: 为字符串和指针添加静态初始化器*\n\n`StringInit` 定义了一个 ASCII 字符串。`null_terminated`\
  \ 参数指定末尾是否包含空字节；我们将利用它在代码生成期间在 `.ascii` 和 `.asciz` 指令之间选择。`PointerInit` 用另一个对象的地址初始化指针。\n\
  \n我们还开始在符号表中跟踪常量。列表 16-23 提供了更新后的 `identifier_attrs`，其中包含了常量。\n\n```\nidentifier_attrs\
  \ = FunAttr(bool, bool global)\n                 | StaticAttr(init, bool global)\n\
  \                 | ConstantAttr(init)\n                 | LocalAttr\n```\n\n*列表\
  \ 16-23: 在符号表中跟踪常量*\n\n与变量（可能未初始化、尝试性初始化或使用值列表初始化）不同，常量是用单个值初始化的。它也不需要 `global`\
  \ 标记，因为我们永远不会定义全局常量。现在我们已经扩展了 `static_init` 和 `identifier_attrs`，让我们讨论如何处理针对字符数组和\
  \ `char` 指针的字符串初始化器。\n\n#### 使用字符串字面量初始化静态数组\n\n如果字符串字面量初始化静态数组，我们首先验证数组的类型：我们确保数组元素具有字符类型，并且数组足够长以包含字符串。（这与我们在列表\
  \ 16-21 中对非静态数组执行的验证相同）。然后，我们将字符串字面量转换为 `StringInit` 初始化器，如果数组有足够的空间终止空字节，则设置 `null_terminated`\
  \ 标记。如果我们需要用额外的空字节填充，则会在初始化器列表中添加 `ZeroInit`。例如，我们将声明\n\n```\nstatic char letters[10]\
  \ = \"abc\";\n```\n\n转换为符号表条目：\n\n```\nname=\"letters\"\ntype=Array(Char, 10)\n\
  attrs=StaticAttr(init=Initial([StringInit(\"abc\", True), ZeroInit(6)]),\n     \
  \            global=False)\n```\n\n\n\n\n\n列表 16-24：由字符串字面量初始化的数组符号表条目\n\n该条目将 `letters`\
  \ 初始化为空终止的字符串 `\"abc\"`，随后是 6 个字节的零。\n\n### 使用字符串字面量初始化静态指针\n\n如果字符串字面量初始化了一个类型为\
  \ `char *` 的静态变量，我们在符号表中创建两个条目。第一个定义字符串本身，第二个定义指向该字符串的变量。让我们来看一个例子：\n\n```\nstatic\
  \ char *message = \"Hello!\";\n```\n\n首先，我们为常量字符串 `\"Hello!\"` 生成一个标识符；假设这个标识符为\
  \ `\"string.0\"`。然后，我们将列表 16-25 所示所示的条目添加到符号表中。\n\n```\nname=\"string.0\"\ntype=Array(Char,\
  \ 7)\nattrs=ConstantAttr(StringInit(\"Hello!\", True))\n```\n\n列表 16-25：在符号表中定义常量字符串\n\
  \n该标识符必须是全局唯一的，并且必须是汇编中语法有效的标签。换句话说，它应该遵循与我们为浮点数常量生成的标识符相同的约束。因为[列表 16-25]定义了一个常量字符串，我们使用新的\
  \ `ConstantAttr` 结构，并用空终止的字符串 `\"Hello!\"` 进行初始化。\n\n然后，当我们将 `message` 本身添加到符号表时，使用指向刚刚添加的符号的指针对其进行初始化。列表\
  \ 16-26 显示了 `message` 的符号表条目。\n\n```\nname=\"message\"\ntype=Pointer(Char)\nattrs=StaticAttr(init=Initial([PointerInit(\"\
  string.0\")]), global=False)\n```\n\n列表 16-26：在符号表中定义指向字符串的静态指针\n\n如果字符串字面量初始化 `char`\
  \ 其他类型的指针，我们将抛出一个错误。（注意 `typecheck_init` 已经在非静态情况下捕获了此错误）。即使使用字符串字面量来初始化 `signed\
  \ char *` 或 `unsigned char *` 也是非法的。这符合普通的类型转换规则：字符串字面量的类型为 `char *`，我们无法从一种指针类型隐式转换为另一种。相比之下，字符串字面量可以初始化任何字符类型的*数组*，因为隐式将每个单独字符从一种字符类型转换为另一种字符类型是合法的。\n\
  \n此时，我们已经有了所有出现在静态初始化器中的字符串的符号表条目。在生成 TACKY 期间，我们将程序中所有其他常量字符串也添加到符号表中。\n\n### TACKY\
  \ 生成\n\n当我们将程序转换为 TACKY 时，可以将字符视为与其他所有整数完全相同。特别是，我们将使用现有的类型转换指令实现字符类型之间的强制转换。例如，我们将使用\
  \ `DoubleToUInt` 指令实现从 `double` 到 `unsigned char` 的转换，并使用 `SignExtend` 实现从 `char`\
  \ 到 `int` 的转换。然而，处理字符串字面量需要更多的工作。\n\n#### 作为数组初始化器的字符串字面量\n\n在类型检查中，我们处理了字符串字面量。现在我们对具有自动存储的数组执行相同的操作。正如在本章前面看到的，这里有两种选择。更简单的方法是逐字符初始化数组。更高效的方法是初始化四字节块。无论哪种方式，我们都使用\
  \ `CopyToOffset` 指令将字符串拷贝到数组中。让我们过一遍这两种方案。我们将使用列表 16 中的初始化器作为示例示例：\n\n```\nint main(void)\
  \ {\n    char letters[] = \"abcde\";\n    return;\n}\n```\n\n当我们第一次看这个时，我们知道 `a`、`b`、`c`、`d`\
  \ 和 `e` 的 ASCII 值为 `97`、`98`、`99`、`100` 和 `101`。使用一次一个字节的方法，我们将使用[列表 16-27]中的 TACKY\
  \ 指令初始化 `letters`：\n\n```\nCopyToOffset(Constant(Char(97)), \"letters\", 0)\nCopyToOffset(Constant(Char(98)),\
  \ \"letters\", 1)\nCopyToOffset(Constant(Char(99)), \"letters\", 2)\nCopyToOffset(Constant(Char(100)),\
  \ \"letters\", 3)\nCopyToOffset(Constant(Char(101)), \"letters\", 4)\nCopyToOffset(Constant(Char(0)),\
  \ \"letters\", 5)\n```\n\n列表 16-27：在 TACKY 中逐字节初始化非静态数组\n\n使用更高效的方法，我们将使用一个 4 字节整数后跟\
  \ 2 个独立字节来初始化 `letters`：\n\n```\nCopyToOffset(Constant(Int(1684234849)), \"letters\"\
  , 0)\nCopyToOffset(Constant(Char(101)), \"letters\", 4)\nCopyToOffset(Constant(Char(0)),\
  \ \"letters\", 5)\n```\n\n为了得到整数 `1684234849`，我们取 4 个字节 `97`、`98`、`99` 和 `100`，并将其解释为单个小端序整数。在十六进制中，这些字节为\
  \ `0x61`、`0x62`、`0x63` 和 `0x64`。小端整数中的第一个字节是最低位，因此将此字节序列解释为整数得到 `0x64636261`，即十进制的\
  \ `1684234849`。\n\n\n\n\n为了一次初始化八个字符，我们将使用 `ConstLong` 而不是 `ConstInt`。我们需要小心，不要超出正在初始化的数组边界；在本例中，用两个\
  \ 4 字节的整数来初始化 `letters` 是错误的，因为这会破坏相邻的值。\n\n使用这些方法中的哪一种取决于你；它们都是同样正确的。无论采用哪种方法，请确保在字符串末尾初始化正确数量的空字节（null\
  \ bytes）。在类型检查器中，你为每个初始化器（包括字符串字面量）都标注了类型信息。现在，你将使用这些类型信息来确定包含多少个空字节。如果字符串字面量比它初始化的数组长，则只拷贝数组能够容纳的字符。换句话说，省略空字节。如果字符串字面量太短，则将零拷贝到数组剩余部分。\n\
  \n### 表达式中的字符串字面量\n\n当我们在数组初始化器之外遇到字符串字面量时，将其作为常量字符串添加到符号表中。然后，我们使用它的标识符作为 TACKY\
  \ `Var`。让我们重新回顾列表 16-9，它返回字符串中第一个字符的指针：\n\n```\nreturn \"A profound statement.\"\
  ;\n```\n\n解析器和类型检查器将其转换为以下 AST 节点：\n\n```\nReturn(AddrOf(String(\"A profound statement.\"\
  )))\n```\n\n要将此 AST 节点转换为 TACKY，我们首先在符号表中定义 `\"A profound statement.\"`：\n\n```\n\
  name=\"string.1\"\ntype=Array(Char, 22)\nattrs=ConstantAttr(StringInit(\"A profound\
  \ statement.\", True))\n```\n\n该项目与我们在类型检查器中定义的常量字符串没有区别。它具有全局唯一且自动生成的标签。它是一个 `char`\
  \ 数组，大小恰好足够容纳整个字符串，包括终止的空字节。它使用新的 `ConstantAttr` 结构进行初始化，因为我们最终将其存储在只读内存中。\n\n现在我们可以引用刚刚定义的标识符（在本例中为\
  \ `string.1`）来加载字符串的地址：\n\n```\nGetAddress(Var(\"string.1\"), Var(\"tmp2\"))\nReturn(Var(\"\
  tmp2\"))\n```\n\n简而言之，我们使用 `string.1` 就就像任何其他数组类型的符号一样。\n\n### TACKY 中的顶层常量\n\n\
  当我们把符号表中的项目转换为顶层 TACKY 定义时，需要考虑所有这些新的常量字符串。汇编 AST 已经有一个顶层常量结构。现在，我们为 TACKY 添加相应的结构：\n\
  \n```\ntop_level = --snip-- | StaticConstant(identifier, type t, static_init init)\n\
  ```\n\n当从符号表生成顶层 TACKY 定义时，我们将为符号表中的每个常量生成一个 `StaticConstant`，就像为每个静态变量生成一个 `StaticVariable`\
  \ 一样。确保在遍历符号表之前将函数定义转换为 TACKY；否则，你将错过在这一遍历过程中添加到符号表中的常量字符串。\n\n列表 16-28 总结了 TACKY\
  \ IR，其中本章添加的内容已用**加粗**显示。\n\n```\nprogram = Program(top_level*)\ntop_level = Function(identifier,\
  \ bool global, identifier* params, instruction* body)\n          | StaticVariable(identifier,\
  \ bool global, type t, static_init* init_list)\n          | StaticConstant(identifier,\
  \ type t, static_init init)\ninstruction = Return(val)\n            | SignExtend(val\
  \ src, val dst)\n            | Truncate(val src, val dst)\n            | ZeroExtend(val\
  \ src, val dst)\n            | DoubleToInt(val src, val dst)\n            | DoubleToUInt(val\
  \ src, val dst)\n            | IntToDouble(val src, val dst)\n            | UIntToDouble(val\
  \ src, val dst)\n            | Unary(unary_operator, val src, val dst)\n       \
  \     | Binary(binary_operator, val src1, val src2, val dst)\n            | Copy(val\
  \ src, val dst)\n            | GetAddress(val src, val dst)\n            | Load(val\
  \ src_ptr, val dst)\n            | Store(val src, val dst_ptr)\n            | AddPtr(val\
  \ ptr, int scale, val dst)\n            | CopyToOffset(val src, int offset)\n  \
  \          | Jump(identifier target)\n            | JumpIf(val condition, identifier\
  \ target)\n            | JumpIfNotZero(val condition, identifier target)\n     \
  \       | Label(identifier)\n            | FunCall(identifier fun_name, val* args,\
  \ val dst)\nval = Constant(const) | Var(identifier)\nunary_operator = Complement\
  \ | Negate\nbinary_operator = Add | Subtract | Multiply | Divide | Remainder | Equal\
  \ | NotEqual\n                | LessThan | LessEqual | GreaterThan | GreaterEqual\n\
  ```\n\n列表 16-28：为 TACKY 添加静态常量\n\n到此时，你的 TACKY 生成阶段应该已经就绪了：它可以处理单个字符、隐式转换为指针的字符串字面量，以及初始化数组的字符串字面量。\n\
  \n### 汇编生成\n\n在这个阶段我们不会做太复杂的处理。首先，我们将对字符的操作转换为汇编。这需要对汇编 AST 进行一些更改。然后，我们将处理 TACKY\
  \ `StaticConstant` 结构并将常量字符串添加到后端符号表中。\n\n#### 字符操作\n\n大多数指令支持 1 字节操作数，支持长字（longwords）和双字（quadwords）。`b`\
  \ 后缀（如指令 `movb` 和 `andb` 中的所示）表示指令操作于单个字节。我们将引入一个新的 `Byte` 汇编类型来表示这种新的操作数大小：\n\n\
  ```\nassembly_type = Byte | --snip--\n```\n\n我们将 `char`、`signed char` 和 `unsigned\
  \ char` 类型转换为 `Byte`。通用寄存器也有 1 字节的别名；例如，`%al` 是 RAX 的 1 字节别名。幸运的是我们的我们的发射阶段已经支持这些别名了。\n\
  \n\n\n\n除了添加 `Byte` 类型外，我们还需要正确地在字符类型之间进行转换。你可以使用 `movz` 指令将 1 字节值零扩展到更宽的类型。该指令接受两个字母的后缀，表示源操作数和目的数的类型。`movzbl`\
  \ 指令将字节扩展到长字（longword），而 `movzbq` 将字节扩展到四字节字（quadword）。（你也可以使用 `movzwl` 或 `movzwq`\
  \ 将 2 字节的字（word）扩展到更大的类型，但我们不使用 2 字节的操作数。）我们将在汇编 AST 中用现有的 `MovZeroExtend` 指令表示\
  \ `movz`，但我们会添加两个操作数的类型：\n\n```\nMovZeroExtend(assembly_type src_type, assembly_type\
  \ dst_type, operand src, operand dst)\n```\n\n如果 `src_type` 是 `Byte`，我们最终将生成带有正确后缀的\
  \ `movz` 指令。如果 `src_type` 是 `Longword`，我们将在修复阶段（fix-up pass）将其重写为普通的 `mov` 指令，就像前面的章节中一样。\n\
  \n要将字节符号扩展到更大的类型，我们将使用现有的 `Movsx` 指令。该指令也接受一个后缀来指定源操作数和目的数的类型：`movsbl` 将字节扩展到长字，`movsbq`\
  \ 将字节扩展到四字节字，而 `movslq` 将长字扩展到四字节字。我们同样将在汇编 AST 中为此指令添加类型信息：\n\n```\nMovsx(assembly_type\
  \ src_type, assembly_type dst_type, operand src, operand dst)\n```\n\n你可以使用 `movb`\
  \ 指令将较大的整数截断为单个字节，就像可以使用 `movl` 将四字节字截断为长字一样。请注意，当使用 `movb` 指令将值拷贝到寄存器时，寄存器的高位字节不会清零。这不是问题；无论我们操作的是单个字节还是长字，只使用寄存器中存储值本身的部分，并忽略寄存器的高位字节。\n\
  \n最后，让我们考虑如何在 `double` 和字符类型之间进行转换。没有汇编指令可以直接将 `double` 转换为 1 字节整数或反之。相反，我们将通过 `int`\
  \ 作为中间步骤进行转换。要将 `double` 转换为任何字符类型，我们首先将其转换为 `int` 然后对其进行截断，如[Listing 16-29] 所示。\n\
  \n```\nCvttsd2si(Longword, src, Reg(AX))\nMov(Byte, Reg(AX), dst)\n```\nListing\
  \ 16-29：将 double 转换为字符类型\n\nListing 16-30 给出了将 `unsigned char` 转换为 `double` 的汇编代码。我们将将其零扩展为\
  \ `int`，然后将其转换为 `double`。\n\n```\nMovZeroExtend(Byte, Longword, src)\nCvtsi2d(Longword,\
  \ dst)\n```\nListing 16-30：将 unsigned char 转换为 double\n\n要将符号字符类型转换为 `double`，我们首先将其符号扩展为\
  \ `int`，如[Listing 16-31] 所示。\n\n```\nMovsx(Byte, Longword, src)\nCvtsi2d(Longword,\
  \ dst)\n```\nListing 16-31：将符号 char 转换为 double\n\n接下来，我们将处理第二个任务：转换 TACKY 中的顶层常量。\n\
  \n### 顶层常量\n\n处理 TACKY 的 `StaticConstant` 非常简单：我们只需要将其转换为汇编的 `StaticConstant`。你还需要将符号表中的每个常量字符串转换为后端符号表中的对应条目，就像处理变量那样。当你将常量字符串添加到后端符号表时，将它的\
  \ `is_static` 属性设置为 `True`。如果你的后端符号表包含 `is_constant` 属性，也将其设置为 `True`。（记住 `is_constant`\
  \ 是第 13 节中可选的添加；它告诉我们何时在代码生成期间何时使用本地标签。）\n\n### 从 TACKY 到汇编的完整转换\n\nListing 16-32\
  \ 显示了本章对汇编 AST 的新增内容。\n\n\n\n\n\n```\nprogram = Program(top_level*)\nassembly_type\
  \ = Byte | Longword | Quadword | Double | ByteArray(int size, int alignment)\ntop_level\
  \ = Function(identifier name, bool global, instruction* instructions)\n        \
  \  | StaticVariable(identifier name, bool global, int alignment, static_init* init_list)\n\
  \          | StaticConstant(identifier name, int alignment, static_init init)\n\
  instruction = Mov(assembly_type, operand src, operand dst)\n            | Movsx(assembly_type\
  \ src_type, assembly_type dst_type, operand src, operand dst)\n            | MovZeroExtend(assembly_type\
  \ src_type, assembly_type dst_type, operand src, \n                            operand\
  \ dst)\n            | Lea(operand src, operand dst)\n            | Cvttsd2si(assembly_type\
  \ dst_type, operand src, operand dst)\n            | Cvtsi2sd(assembly_type src_type,\
  \ operand src, operand dst)\n            | Unary(unary_operator, assembly_type,\
  \ operand)\n            | Binary(binary_operator, assembly_type, operand, operand)\n\
  \            | Cmp(assembly_type, operand, operand)\n            | Idiv(assembly_type,\
  \ operand)\n            | Div(assembly_type, operand)\n            | Cdq(assembly_type)\n\
  \            | Jmp(identifier)\n            | JmpCC(cond_code, identifier)\n   \
  \         | SetCC(cond_code, operand)\n            | Label(identifier)\n       \
  \     | Push(operand)\n            | Call(identifier)\n            | Ret\nunary_operator\
  \ = Neg | Not | Shr\nbinary_operator = Add | Sub | Mult | DivDouble | And | Or |\
  \ Xor\noperand = Imm(int) | Reg(reg) | Pseudo(identifier) | Memory(reg, int)\n \
  \       | PseudoMem(identifier, int) | Indexed(reg base, reg index, int scale)\n\
  cond_code = E | NE | G | GE | L | LE | A | AE | B | BE\nreg = AX | CX | DX | DI\
  \ | SI | R8 | R9 | R10 | R11 | SP | BP\n    | XMM0 | XMM1 | XMM2 | XMM3 | XMM4 |\
  \ XMM5 | XMM6 | XMM7 | XMM14 | XMM15\n```\n\n列表 16-32：带有字节操作数的汇编 AST\n\n从表 16-2\
  \ 到 16-5 总结了从 TACKY 汇编的最新更新，其中新构造以及现有构造转换的更改已加粗显示。\n\n**表 16-2：将顶层 TACKY 构造转换为汇编**\n\
  \n| TACKY 顶层构造 | 汇编顶层构造 |\n| --- | --- |\n| `StaticConstant(name, t, init)` | `StaticConstant(name,\
  \ `alignment of t`, init)` |\n\n**表 16-3：将 TACKY 指令转换为汇编**\n\n| TACKY 指令 | | 汇编指令\
  \ |\n| --- | --- | --- |\n| `ZeroExtend(src, dst)` | | `MovZeroExtend(`src type`,\
  \ `dst type`, `src, dst)` |\n| `SignExtend(src, dst)` | | `Movsx(`src type`, `dst\
  \ type`, `src, dst)` |\n| `Truncate(src, dst)` | | `Mov(`dst type`, `src, dst)`\
  \ |\n| `IntToDouble(src, dst)` | char 或 signed char | `Movsx(Byte, Longword, src,\
  \ Reg(R)))Cvtsi2sd(Longword, Reg(R), dst)` |\n| `int` 或 long | | `Cvtsi2sd(`src\
  \ type`, `src, dst)` |\n| `DoubleToInt(src, dst)` | char 或 signed char | `Cvttsd2si(Longword,\
  \ src, Reg(R)))Mov(Byte, Reg(R), dst)` |\n| `int` 或 long | | `Cvttsd2si(`dst type`,\
  \ `src, dst)` |\n| `UIntToDouble(src, dst)` | unsigned char | `MovZeroExtend(Byte,\
  \ Longword, src, Reg(R)))Cvtsi2sd(Longword, Reg(R), dst)` |\n\n\n\n\n\n| `unsigned\
  \ int` | `MovZeroExtend(Longword, Quadword, src, Reg(R))` `Cvtsi2sd(Quadword, Reg(R),\
  \ dst)` |\n| `unsigned long` | `Cmp(Quadword, Imm(0), src)` `JmpCC(L, label1)` `Cvtsi2sd(Quadword,\
  \ src, dst)` `Jmp(label2)` `Label(label1)` `Mov(Quadword, src, Reg(R1))` `Mov(Quadword,\
  \ Reg(R1), Reg(R2))` `Unary(Shr, Quadword, Reg(R2))` `Binary(And, Quadword, Imm(1),\
  \ Reg(R1))` `Binary(Or, Quadword, Reg(R1), Reg(R2))` `Cvtsi2sd(Quadword, Reg(R2),\
  \ dst)` `Binary(Add, Double, dst, dst)` `Label(label2)` |\n| `DoubleToUInt(src,\
  \ dst)` | `unsigned char` | `Cvttsd2si(Longword, src, Reg(R))` `Mov(Byte, Reg(R),\
  \ dst)` |\n| `unsigned int` | `Cvttsd2si(Quadword, src, Reg(R))` `Mov(Longword,\
  \ Reg(R), dst)` |\n| `unsigned long` | `Cmp(Double, Data(upper-bound), src)` `JmpCC(AE,\
  \ label1)` `Cvttsd2si(Quadword, dst)` `Jmp(label2)` `Label(label1)` `Mov(Double,\
  \ src, Reg(X))` `Binary(Sub, Double, Data(upper-bound), Reg(X))` `Cvttsd2si(Quadword,\
  \ Reg(X), dst)` `Mov(Quadword, Imm(922337203685475808), Reg(R))` `Binary(Add, Quadword,\
  \ Reg(R), dst)` `Label(label2)` 并添加一个顶层常量：`StaticConstant(upper-bound, 8, DoubleInit(922337203685475808.0))`\
  \ |\n\n### 表 16-4: 将 TACKY 操作数转换为汇编\n\n| TACKY 操作数 | 汇编操作数 |\n| --- | --- |\n| `Constant(ConstChar(int))`\
  \ | `Imm(int)` |\n| `Constant(ConstUChar(int))` | `Imm(int)` |\n\n### 表 16-5: 将类型转换为汇编\n\
  \n| 源类型 | 汇编类型 | 对齐方式 |\n| --- | --- | --- |\n\n\n\n\n\n| Char | Byte | 1 |\n| SChar\
  \ | Byte | 1 |\n| UChar | Byte | 1 |\n\n接下来，让我们来看伪操作数替换（pseudo-operand replacement）和指令修复（instruction\
  \ fix-up）。这两个阶段的更新都非常直观。\n\n### 伪操作数替换\n\n我们将为每个 `Byte` 对象在栈上分配 1 字节。我们不需要担心将这些字节向下取整以实现正确的对齐，因为它们都是\
  \ 1 字节对齐的。\n\n此阶段可能不需要任何处理常量字符串的专用逻辑。我们已经在后端符号表中记录了它们具有静态存储生存期。现在，我们将像处理其他静态对象一样，使用\
  \ `Data` 操作数来访问它们。\n\n### 指令修复\n\n`movz` 指令的目标必须是一个寄存器，且其源操作不能是立即值。如果 `MovZeroExtend`\
  \ 指令的源操作数的大小为 1 字节，且其源操作或目标无效，我们将按照通常模式对其进行重写。例如，我们将\n\n```\nmovzbl  $10, -4(%rbp)\n\
  ```\n\n重写为：\n\n```\nmovb    $10, %r10b\nmovzbl  %r10b, %r11d\nmovl    %r11d, -4(%rbp)\n\
  ```\n\n如果它的源操作数是一个长字（longword），我们将像前面的章节一样，用一个或多个 `mov` 指令来替换它。\n\n如果 `movb` 指令的源是一个无法放入单个字节的立即值，我们将对其对\
  \ 256 取模运算。例如，我们将\n\n```\nmovb    $258, %al\n```\n\n重写为：\n\n```\nmovb    $2, %al\n\
  ```\n\n这是我们在第 11 章中引入的相同模式，用于处理源操作数为 8 字节立即值的 `movl` 指令。\n\n### 代码发射\n\n代码发射阶段需要支持字符串常量、指针初始化器以及其他一些变化。我们将每个\
  \ `StringInit` 输出为 `.ascii` 或 `.asciz` 指令，取决于它是否应该包含空字节。ASCII 字符串中的双引号、反斜杠和换行符必须转义。为了转义这些字符，你可以使用\
  \ `\\\"`、`\\\\` 和 `\\n` 转义序列，或者使用指定其 ASCII 值的三位八进制转义序列。例如，反斜杠字符的 ASCII 代码是 `92`，八进制为\
  \ `134`，因此你可以用转义序列 `\\134` 来表示它。你也可以转义其他特殊字符，但没有必要。某些转义序列（如 `\\a`）在 C 中有效但在汇编中无效，因此八进制转义序列是转义任意字符的安全方法。\n\
  \n我们将每个 `PointerInit` 输出为 `.quad` 指令，后跟我们想要指向的标签。我们将 `CharInit` 和 `UCharInit` 转换为\
  \ `.byte` 指令，它的工作方式与 `.long` 和 `.quad` 完全相同。当你发射一个 1 字节对齐的对象时，可以包含 `.align` 指令，也可以省略它。根据定义，每个对象至少是\
  \ 1 字节对齐的，因此指定 1 字节对齐没有影响。\n\n在 Linux 上，字符串常量将与浮点数一起存放在 `.rodata` 段中。在 macOS 上，它们将存在于\
  \ `.cstring` 段中。如果你对浮点数使用本地标签（以 `.L` 或 `L` 前缀开头），你也应该对字符串常量使用它们。为 `Data` 操作数添加此前缀的逻辑不会改变；将在后端符号表中查找每个\
  \ `Data` 操作数，如果其 `is_constant` 属性为真，则添加此前缀。\n\n`movz` 和 `movsx` 指令应该包含后缀以指示源和目标类型。其他指令在操作字节时应包含\
  \ `b` 后缀。表 16-6 到 16-9 总结了代码发射阶段的最新更新；新的新的构造以及发射构造方式的变化已加粗显示。\n\n### 表 16-6：顶层汇编构造的格式化\n\
  \n| 汇编顶层构造 | 输出 |\n| :--- | :--- |\n| `StaticConstant(name, alignment, init)` |\
  \ Linux |\n```\n .section .rodata\n    <alignment-directive> \n<name>:\n     <init>\n\
  ``` |\n| macOS (8 字节对齐的数值常量) | |\n```\n .literal8\n    .balign 8\n <name>:\n   \
  \  <init>\n``` |\n| macOS (16 字节对齐的数值常量) | |\n```\n .literal16\n    .balign 16\n\
  \ <name>:\n     <init>\n     .quad 0\n``` |\n| macOS (字符串常量) | |\n```\n .cstring\n\
  \ <name>:\n     <init>\n``` |\n\n### 表 16-7：静态初始化器的格式化\n\n| 静态初始化器 | 输出 |\n| :---\
  \ | :--- |\n| `CharInit(0)` | `.zero 1` |\n| `CharInit(i)` | `.byte` `*` |\n| `UCharInit(0)`\
  \ | `.zero 1` |\n| `UCharInit(i)` | `.byte` `*` |\n\n\n\n\n\n| `StringInit(s, True)`\
  \ | `.asciz \"s\"` |\n| `StringInit(s, False)` | `.ascii \"s\"` |\n| `PointerInit(label)`\
  \ | `.quad <label>` |\n\n**表 16-8:** 汇编指令格式化\n\n| 汇编指令 | 输出 |\n| --- | --- |\n|\
  \ `Movsx(src_t, dst_t, src, dst)` | |\n```\nmovs<src_t><dst_t>    <src>, <dst>\n\
  ```\n| `MovZeroExtend(src_t, dst_t, src, dst)` | |\n```\nmovz<src_t><dst_t>   <src>,\
  \ <dst>\n``` |\n\n**表 16-9:** 汇编类型的指令后缀\n\n| 汇编类型 | 指令后缀 |\n| --- | --- |\n| 字节\
  \ (Byte) | b |\n\n你的编译器现在支持字符串和字符了！你仍然需要运行本章的测试来确保你正确实现了这些功能，但首先，我们将尝试几个示例。\n\n\
  ### 再次你好，世界！\n\n在第 9 章中，我们逐个字符地打印“Hello, World!”。现在我们可以使用 `puts` 标准库函数编写一个更传统的“Hello,\
  \ World!”程序了，它的函数签名如下：\n\n```\nint puts(const char *s);\n```\n\n由于我们不支持 `const`，我们将在声明\
  \ `puts` 时不使用它。列表 16-33 显示了我们新的“Hello, World!”程序。\n\n``````int puts(char *c);\n\
  int main(void) {\n    puts(\"Hello, World!\");\n    return 0;\n}\n`````````\n\n\
  列表 16-33：使用 `puts` 打印字符串\n\n这段代码并不完全合法，因为 `puts` 的声明与标准库中的定义不兼容。尽管违反了这一条微小的规则，程序仍然应该可以正常工作。编译它，然后运行它向\
  \ stdout 打印消息：\n\n```\n$ ./hello_world\nHello, World!\n```\n\n如果你想尝试些疯狂的，甚至可以编译列表\
  \ 16-34，它可以从 `stdin` 读取输入。\n\n```c\nint puts(char *c);\nint main(void) {\n    puts(\"\
  Hello, World!\");\n    return 0;\n}\n```\n\n```c\nint puts(char *c);\nint main(void)\
  \ {\n    char name[30];\n    char message[40] = \"Hello, \";\n    int idx = 0;\n\
  \    puts(\"Enter your name: \");\n    while (idx < 29) {\n        int c = getchar();\n\
  \        if (c <= 0 || c == '\\n') {\n            break;\n        }\n        name[idx]\
  \ = c;\n        idx++;\n    }\n    name[idx] = 0;\n    strncat(message, name, 40\
  \ - strlen(message));\n    strcat(message, \"!\");\n    puts(message);\n    return\
  \ 0;\n}\n```\n\n列表 16-34：从 stdin 读取\n\n\n\n\n\n![](img/pg456.jpg)\n\n## 17 支持动态内存分配\n\
  \n![](img/opener-img.jpg)\n\n在第二部分 期间，你已经编译了调用日益广泛的标准库函数的程序。在 第一部分 结束时，你的编译器仅支持参数和返回值类型\
  \ `int` 的函数，例如 `putchar`。现在，你可以编译调用如 `fmax` 等浮点数学函数以及如 `puts` 等字符串处理函数的程序了。在本章中，你将实现调用标准库中一个特殊部分所需的剩余功能：内存管理函数。这些包括\
  \ `malloc`、`calloc` 和 `aligned_alloc`（它们用于动态分配内存）；`free`（用于释放动态分配的内存）；以及 `realloc`（用于释放一块内存并重新分配一块具有相同内容的内存）。\n\
  \n为了编译声明并调用这些函数的程序，你需要实现 `void` 类型。到目前为止，我们仅使用 `void` 关键字指定空参数列表；现在我们将将其视为一个正式的类型说明符。在\
  \ C 中，`void *` 表示没有特定类型的内存块的地址；所有分配内存的标准库函数都返回这种类型。`void` 类型本身也是用的。例如，你可以用它来声明不返回值的函数，如\
  \ `free`。除了 `void` 之外，我们还将实现 `sizeof` 运算符，它可以获取类型或对象的大小。C 程序经常使用 `sizeof` 来确定需要分配多少字节的内存。\n\
  \n本章并不秘密的目的是为你在第 18 章 中实现结构体类型做好准备。现实中的 C 程序经常在动态分配的内存中存储结构体，该章的许多测试也是如此。我们对类型检查器做的更改在第\
  \ 18 章 中也会有用，因为适用于 `void` 的某些类型规则也适用于结构体类型。\n\n## void 类型\n\nC 标准（第 6.2.5 节第 19\
  \ 段）对 `void` 有如下相当神秘的定义：“`void` 类型包含空值集；它是一个无法完成的不完整对象类型。”稍后我们将详细讨论“不完整对象类型”的意思。目前，核心思想是\
  \ `void` 是一个没有值的类型。你无法对这种类型做很多事情，但它确实有一些用途。\n\n如果函数不返回任何内容，你可以给它一个 `void` 返回类型。要让一个函数具有\
  \ `void` 返回类型，你可以使用 `return` 语句。\n\n```c\nvoid return_nothing() {\n    return;\n\
  }\n```\n\n如列表 17-2 所示，你也可以省略 `return` 语句。在这种情况下，当你到达体末尾时，函数将返回。\n\n```c\nvoid perform_side_effect()\
  \ {\n    extern int some_variable;\n    some_variable = 100;\n}\n```\n\n*void 表达式*是指类型为\
  \ `void` 的表达式；它没有值，但你可以为了副作用而对其求值。产生 void 表达式有三种方法。首先，你可以调用 `void` 函数：\n\n```c\n\
  flag ? perform_side_effect() : return_nothing();\n```\n\n其次，你可以将一个值转换为 `void`：\n\
  \n```c\n(void) (1 + 1);\n```\n\n在这里，转换为 `void` 对执行没有影响；其唯一目的是告诉编译器和人类读者，该值应该被丢弃。这是静默编译器关于未使用值警告的常用方法。如果你特别热衷遵循\
  \ C 的规则，可能也会像列表 17-3 中的代码那样转换为 `void`，以使两个分支的类型一致。\n\n```c\nint i = 0;\nflag ? perform_side_effect()\
  \ : (void) (i = 3);\n```\n**列表 17-3：类型为 void 的条件表达式**\n\n如果我们在这个条件表达式中省略到 `void`\
  \ 的转换，其中一个分支的类型为 `void`，另一个的类型为 `int`。这是非法的，尽管除非使用 `-pedantic` 标志启用额外警告，否则大多数编译器不会对此抱怨。我们的编译器将拒绝带有一个\
  \ `void` 分支的条件表达式，因为它始终是严谨（pedantic）的。\n\n你可以在四个地方使用 void 表达式。首先，它可以作为条件表达式中的子句，如列表\
  \ 17-3 所示。其次，你可以将其作为独立表达式使用：\n\n```c\nperform_side_effect();\n```\n\n第三，它可以作为 `for`\
  \ 循环头部的第一个或第三个子句，如列表 17-4 所示。\n\n```c\nfor (perform_side_effect(); i < 10; perform_side_effect())\n\
  \    --snip--\n```\n\n\n\n\n\n列表 17-4: 在 `for` 循环头部中使用 void 表达式\n\n第四，你可以将 void\
  \ 表达式强制转换为 `void` 类型：\n\n```\n(void) perform_side_effect();\n```\n\n最后这种方法并不特别有用，但它是合法的。\n\
  \n如你所知的，你还可以使用 `void` 关键字在函数声明中指定空参数列表。这是一个特殊情况，因为实际上并没有指定一个类型为 `void` 的表达式、对象或返回值。即使我们扩展了编译器以完全支持\
  \ `void` 类型，我们将按照之前相同的方式处理这个特殊情况。\n\n### 使用 `void *` 进行内存管理\n\n现在，让我们来看内存管理函数如何使用\
  \ `void *` 来表示分配的内存。`malloc` 函数具有以下签名：\n\n```\nvoid *malloc(size_t size);\n```\n\
  \n`size` 参数指定了要分配的字节数。它的类型 `size_t` 是一个由实现定义的无符号整数。在 System V x64 ABI 下，`size_t`\
  \ 是 `unsigned long` 的别名。由于我们不支持类型别名，我们的测试程序和示例使用了这种声明：\n\n```\nvoid *malloc(unsigned\
  \ long size);\n```\n\n`malloc` 函数分配一块内存并返回其地址。由于 `malloc` 不知道这块内存中将存储什么类型的对象，因此返回一个指向\
  \ `int`、`char` 或我们目前见过的任何其他类型的指针将具有误导性。相反，它返回 `void *`。尽管如此，你不能通过 `void *` 指针读取或写入内存。因此，在你访问通过\
  \ `malloc` 分配的内存之前，你需要通过将地址从 `void *` 转换为不同的指针类型，来指定它应该包含什么类型的对象。\n\n你可以在不需要显式转换的情况下将其他指针类型与\
  \ `void *` 进行转换。例如，你可能使用 `malloc` 分配一个包含 100 个 `int` 元素的数组：\n\n```\nint *many_ints\
  \ = malloc(100 * sizeof (int));\n```\n\n当你将 `malloc` 的结果赋值给 `many_ints` 时，它会隐式地从\
  \ `void *` 转换为 `int *`。然后你可以像对待其他 `int` 数组指针一样对 `many_ints` 使用下标操作：\n\n```\nmany_ints[10]\
  \ = 10;\n```\n\n`free` 函数接受一个 `void *` 参数，用于指定要释放的内存块：\n\n```\nvoid free(void *ptr);\n\
  ```\n\n该指针必须与 `malloc` 返回的值相同。以下是你可以使用 `free` 释放内存的方法：\n\n```\nfree(many_ints);\n\
  ```\n\n此函数调用将 `many_ints` 的值转换回 `void *`。`calloc`、`aligned_alloc` 和 `realloc` 函数提供了稍微不同的分配方式；它们都返回\
  \ `void *`。`realloc` 函数接收一个大小和一个指向之前分配内存的 `void *` 指针。对于我们的目的，这些函数的细节并不重要；关键点是它们都使用了\
  \ `void *`。\n\n这些内存块就像变量，但它们的生命周期管理方式不同。变量具有自动存储期（它们的生命周期持续整个代码块的执行）或静态存储期（它们的生命周期持续整个程序）。分配的内存块具有*分配存储期*：它的生命周期从被分配时开始，在释放时结束。\n\
  \n编译器必须跟踪所有具有静态或自动存储周期的变量，在符号表中记录有关它们的大小和生命期的细节，并在数据段或栈上为它们留留空间。但编译器不需要了解任何关于分配存储期对象的信息，因为程序员和内存管理库负责跟踪它们。\n\
  \n#### 完全类型与不完全类型\n\n如果知道一个对象类型的大小，则该类型是*完全的*；如果未知，则是*不完全的*。`void` 类型是我们见过的第一个不完全类型。我们不知道它的大小，因为它根本*没有*大小。在下一章中，我们将遇到不完全类型，它们的大小和成员对编译器是不可见的。如果编译器获取了关于它们的更多信息，不完全结构类型可以在程序的后期被完全。相反，`void`\
  \ 类型是无法完全的。\n\nC 标准规定，“不完全类型只有在不需要该类型对象的大小时才能使用”（第 6.7.2.3 节，脚注 132）。例如，你不能用不完全类型定义变量，因为你不知道为它分配多大的空间。你不能给不完全类型的对象赋值或使用它的值，因为你需要知道读取或写入多少字节。除少数例外外，其他不完全类型受到与\
  \ `void` 相同的限制，类型检查器将以相同的方式处理它们。\n\n\n\n\n\n所有的指针都是完整类型，即使它们所指向的类型是不完全类型如此；我们知道指针的大小始终是\
  \ 8 字节。这就是为什么你可以声明 `void *` 类型的变量和参数，从函数返回 `void *` 值，将它们转换为其他指针类型等。正如你将在下一章中看到的，你可以以相同的方式使用指向不完全结构类型的指针。\n\
  \n### sizeof 运算符\n\n`sizeof` 运算符接受一个表达式或一个类型名称。当它接收类型名称时，它返回该类型以字节为单位的大小。当它接收一个表达式时，它返回该表达式类型的大小。[列表\
  \ 17-5] 展示了这两种情况。\n\n```\nsizeof (long);\nsizeof 10.0;\n```\n\n列表 17-5：sizeof 的两种用法\n\
  \n这两个 `sizeof` 表达式的求值都是 8，因为 `long` 和 `double` 类型都是 8 字节。注意，`sizeof` 表达式中的类型名称必须加括号，但表达式不需要。\n\
  \n当你在 `sizeof` 表达式中使用数组时，它不会退化为指针。考虑[列表 17-6] 中的 `sizeof` 表达式。\n\n```\nint array[3];\n\
  return sizeof array;\n```\n\n列表 17-6：获取数组的大小\n\n此代码返回 `12`，这是一个三 `int` 数组的大小，而不是指针的大小\
  \ `8`。\n\n你始终可以在不求值表达式的情况下确定其类型——并因此确定其大小。事实上，C 标准要求我们*不*求值 `sizeof` 表达式的操作数。相反，我们推断操作数的类型并在编译时求值\
  \ `sizeof`。这意味着 `sizeof` 表达式不会产生副作用。例如，语句\n\n```\nreturn sizeof puts(\"Shouting\
  \ into the void\");\n```\n\n不会调用 `puts`。它只会返回 `4`，因为 `puts` 函数的返回类型是 `int`。\n\n\
  你也可以将 `sizeof` 应用于通常会产生运行时错误的表达式，如[列表 17-7] 所示。\n\n```\ndouble *null_ptr = 0;\n\
  return sizeof *null_ptr;\n```\n\n列表 17-7：在不求值表达式的情况下获取表达式的大小\n\n通常，解引用 `null_ptr`\
  \ 会导致未定义行为。但这个示例是定义良好的，因为它永远不会求值 `*null_ptr`。相反，它将返回 `8`，因为编译器可以确定 `*null_ptr` 的类型是\
  \ `double`。\n\n变长数组是一个例外。变长数组的大小在编译时是不可知的，因此它必须在运行时求值。现在我们知道了 C 如何使用 `sizeof`，让我们从词分析器开始。\n\
  \n### 词分析器\n\n你将在本章中添加新关键字：`sizeof`。你不需要添加 `void`；词分析器已经识别了它。\n\n### 解析器\n\n[列表\
  \ 17-8] 显示了 AST 的变化。\n\n```\nprogram = Program(declaration*)\ndeclaration = Function(declaration)\
  \ | Var(declaration)\nvariable_declaration = identifier name, initializer?, storage_class\n\
  function_declaration = identifier name, params?, type, body\ninitializer = Constant(initializer)\
  \ | Var(initializer)\ntype = Char | UChar | Int | Long | ULong | Double | Void |\
  \ Pointer | Array\nstorage_class = Static | Extern\nblock_item = declaration | statement\n\
  block = Block(block_item)\nfor_init = Init(variable_declaration)\nstatement = Return(exp?)\
  \ | Expression(exp) | If(exp, statement, statement?) | Compound(block) | Break |\
  \ Continue | While(exp, statement) | DoWhile(statement, exp) | For(for_init, exp?,\
  \ exp?, body) | Null\nexp = Constant(const) | String(string) | Var(identifier) |\
  \ Cast(target_type, exp) | Unary(unary_operator, exp) | Binary(binary_operator,\
  \ exp, exp) | Assignment(exp, exp) | Conditional(exp, exp, exp) | FunctionCall(identifier,\
  \ args) | Dereference(exp) | AddrOf(exp) | Subscript(exp, exp) |Of(exp) | SizeOf(type)\n\
  unary_operator = Complement | Negate | Not\nbinary_operator = Add | Subtract | Multiply\
  \ | Divide | Remainder | And | Or | Equal | NotEqual | LessThan | LessOrEqual |\
  \ GreaterThan | GreaterOrEqual\nconst = ConstInt(int) | ConstLong(int) | ConstUInt(int)\
  \ | ConstULong(int) | ConstDouble(double) | ConstChar(int) | ConstUChar(int)\n```\n\
  \n列表 17-8：带有 void, sizeof 和带返回值的 return 语句的抽象语法树\n\n我们在这里做了四处小改。首先，我们添加了 `void`\
  \ 类型。其次，`Return` 语句中的表达式现在是可选的，这样它就可以表示带和不带返回值的 `return` 语句。最后，有两个新的表达式来表示你使用 `sizeof`\
  \ 运算符的两种方式。\n\n\n\n\n接下来，我们将对语法进行相应的修改。这里的一个小问题是，除非转换表达式被括起来，否则我们无法对它应用 `sizeof`。例如，下面这种情况是语法错误：\n\
  \n```\nsizeof (int) a;\n```\n\n将转换表达式包裹在括号中可以修复该错误：\n\n```\nsizeof ((int) a);\n\
  ```\n\n这一限制使得解析器更容易区分针对类型名的 `sizeof` 操作和针对表达式的 `sizeof` 操作。为了在语法中体现这一限制，我们需要将转换表达式拆分为一个与其他一元表达式不同的符号。\n\
  \n让我们首先将类型名重构为一个可以在转换表达式和 `sizeof` 表达式中都使用的符号：\n\n```\n<type-name> ::= {<type-specifier>}+\
  \ [<abstract-declarator>]\n```\n\n接下来，我们将定义新的 `<cast-exp>` 符号，它包含一条转换表达式的规则和另一条所有其他一元表达式的规则：\n\
  \n```\n<cast-exp> ::= \"(\" <type-name> \")\" <cast-exp>\n             | <unary-exp>\n\
  ```\n\n然后，我们将更新 `<unary-exp>` 以包含除转换之外的所有一元表达式：\n\n```\n<unary-exp> ::= <unop> ❶\
  \ <cast-exp>\n              | \"sizeof\" ❷ <unary-exp>\n              | \"sizeof\"\
  \ \"(\" <type-name> \")\"\n              | <postfix-exp>\n```\n\n对于 `-`、`~`、`!`\
  \ 和 `&` 等一元操作的规则允许转换表达式作为操作数 ❶，而 `sizeof` 的规则则 own ❷。最后，我们将使用新的 `<cast-exp>` 符号代替限制更大的\
  \ `<unary-exp>`，来表示二元或三元表达式中的单项：\n\n```\n<exp> ::= <cast-exp> | <exp> <binop> <exp>\
  \ | <exp> \"?\" <exp> \":\" <exp>\n```\n\n列表 17-9 给出了本章的完整语法。\n\n```\n<program>\
  \ ::= {<declaration>}\n<declaration> ::= <variable-declaration> | <function-declaration>\n\
  <variable-declaration> ::= {<specifier>}+ <declarator> [\"=\" <initializer>] \"\
  ;\"\n<function-declaration> ::= {<specifier>}+ <declarator> (<block> | \";\")\n\
  <declarator> ::= \"*\" <declarator> | <direct-declarator>\n<direct-declarator> ::=\
  \ <simple-declarator> [<declarator-suffix>]\n<declarator-suffix> ::= <param-list>\
  \ | {\"[\" <const> \"]\"}+\n<param-list> ::= \"(\" \"void\" \")\" | \"(\" <param>\
  \ {\",\" <param>} \")\"\n<param> ::= {<type-specifier>}+ <declarator>\n<simple-declarator>\
  \ ::= <identifier> | \"(\" <declarator> \")\"\n<type-specifier> ::= \"int\" | \"\
  long\" | \"unsigned\" | \"signed\" | \"double\" | \"char\" | \"void\"\n<specifier>\
  \ ::= <type-specifier> | \"static\" | \"extern\"\n<block> ::= \"{\" {<block-item>}\
  \ \"}\"\n<block-item> ::= <statement> | <declaration>\n<initializer> ::= <exp> |\
  \ \"{\" <initializer> {\",\" <initializer>} [\",\"] \"}\"\n<for-init> ::= <variable-declaration>\
  \ | [<exp>] \";\"\n<statement> ::= \"return\" [<exp>] \";\"\n              | <exp>\
  \ \";\"\n              | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n\
  \              | <block>\n              | \"break\" \";\"\n              | \"continue\"\
  \ \";\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n             \
  \ | \"do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\"\
  \ \"(\" <for-init> [<exp>] \";\" [<exp>] \")\" <statement>\n              | \";\"\
  \n<exp> ::= <cast-exp> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n<cast-exp>\
  \ ::= \"(\" <type-name> \")\" <cast-exp>\n             | <unary-exp>\n<unary-exp>\
  \ ::= <unop> <cast-exp>\n              | \"sizeof\" <unary-exp>\n              |\
  \ \"sizeof\" \"(\" <type-name> \")\"\n              | <postfix-exp>\n<type-name>\
  \ ::= {<type-specifier>}+\n<postfix-exp> ::= <postfix-exp>\n<simple-declarator>\
  \ ::= <identifier> | \"(\" <declarator> \")\"\n```\n\n\n\n现在让我们来看看如何类型检查 `void`、`void\
  \ *` 和 `sizeof`。我们将首先从 `void *` 与其他指针类型之间的隐式转换开始。尽管大多数指针类型之间的隐式转换是不允许的，但在少数情况下这是允许的。接下来，我们将检测\
  \ `void` 可能触发的所有新颖且令人兴奋的类型错误。我们最后处理 `sizeof` 运算符。\n\n#### 与 `void *` 的转换\n\n`void\
  \ *` 与其他指针类型之间的隐式转换在三种情况下是合。首先，你可以使用 `==` 或 `!=` 将 `void *` 类型的值与另一种指针类型比较：\n\n\
  ```\nint *a;\nvoid *b;\n--snip--\nreturn a == b;\n```\n\n其次，在形式为 `<cond> ? <clause1>\
  \ : <clause2>` 的条件表达式中，一个子句的类型可以是 `void *`，而另一个子句可以是另一种指针类型：\n\n```\nint *a;\nvoid\
  \ *b;\n--snip--\nreturn flag ? a : b;\n```\n\n在这两种情况下，非 `void` 指针都会转换为 `void *`。\n\
  \n第三，你可以在赋值过程中隐式地转换为或从 `void *` 。你可以将任何指针类型的值赋值给 `void *` 类型的对象：\n\n```\nint *a\
  \ = 0;\nvoid *b = a;\n```\n\n同样，你也可以将类型为 `void *` 的值赋值给另一种指针类型的对象。\n\n最后一种情况不仅包括简单的赋值；它还涵盖了我们在第\
  \ 14 章中讨论过的所有“仿佛通过赋值”的转换。例如，将 `void *` 参数传递给期望其他指针类型参数的函数是合法的：\n\n```\nint use_int_pointer(int\
  \ *a);\nvoid *ptr = 0;\nuse_int_pointer(ptr);\n```\n\n并非巧合，这正是你可以将空指针常量隐式转换为某些其他指针类型的三个相同情况。为了支持与\
  \ `void *` 的双向隐式转换，我们将扩展之前在第 14 章中定义的两个辅助函数：`get_common_pointer_type` 和 `convert_by_assignment`。\n\
  \n让我们重新回顾列表 14-14，它定义了 `get_common_pointer_type`。这里将其重现为列表 17-10，并将本章的更改进行了**加粗**。\n\
  \n```\nget_common_pointer_type(e1, e2):\n    e1_t = get_type(e1)\n    e2_t = get_type(e2)\n\
  \    if e1_t == e2_t:\n        return e1_t\n    else if is_null_pointer_constant(e1):\n\
  \        return e2_t\n    else if is_null_pointer_constant(e2):\n        return\
  \ e2_t\n    else if e1_t == Pointer(void):\n        return e2_t\n    else if e2_t\
  \ == Pointer(void):\n        return e1_t\n    else:\n        fail(\"incompatible\
  \ types\")\n```\n\n\n\n若干 C 语言结构需要标量表达式，包括 `&&`、`||` 和 `!` 表达式的操作数；条件表达式的第一个操作数；以及循环和\
  \ `if` 语句中的控制条件。它们的共同点是，所有这些语言结构都会将表达式的值与零进行比较。将指针或算术值与零比较是有意义的；但将非标量值与零比较则没有意义。\n\
  \n在前面的章节中，还没有办法编写出违反这些类型约束的程序。数组是我们唯一的非标量类型，在任何需要标量表达式的地方它们都会退化为指针。但一旦我们引入了 `void`，就需要显式地强制执行这些约束。（尽管\
  \ `void` 不是聚合类型，但它也不是标量。标量表达式有一个值，而 `void` 表达式*没有*值。）代码列表 17-12 定义了一个小的辅助函数，用来告诉我们某个类型是否为标量。\n\
  \n```\nis_scalar(t):\n    match t with\n    | Void -> return False\n    | Array(elem_t,\
  \ size) -> return False\n    | FunType(param_ts, ret_t) -> return False\n    | _\
  \ -> return True\n```\n**代码列表 17-12：检查一个类型是否为标量**\n\n我们可以使用这个辅助函数来验证控制条件和逻辑操作数。例如，代码列表\
  \ 17-13 展示了如何验证逻辑 `!` 表达式的操作数。\n\n```\ntypecheck_exp(e, symbols):\n    match e with\n\
  \    | --snip--\n    | Unary(Not, inner) ->\n        typed_inner = typecheck_and_convert(inner,\
  \ symbols)\n        if not is_scalar(get_type(typed_inner)):\n            fail(\"\
  Logical operators only apply to scalar expressions\")\n        --snip--\n```\n**代码列表\
  \ 17-13：验证逻辑操作数是否为标量**\n\n强制转换表达式略有不同。除了我们已经禁止的 `double` 和指针之间的强制转换外，你可以将标量表达式转换为任何标量类型。你也可以将任何类型转换为\
  \ `void`。代码列表 17-14 展示了如何类型检查强制转换表达式。\n\n```\n | Cast(t, inner) ->\n        typed_inner\
  \ = typecheck_and_convert(inner, symbols)\n        --snip--\n      ❶ if t == Void:\n\
  \            return set_type(Cast(t, typed_inner), Void)\n      ❷ if not is_scalar(t):\n\
  \            fail(\"Can only cast to scalar type or void\")\n      ❸ if not is_scalar(get_type(typed_inner)):\n\
  \            fail(\"Cannot cast non-scalar expression to scalar type\")\n      \
  \  else:\n            return set_type(Cast(t, typed_inner), t)\n```\n**代码列表 17-14：类型检查强制转换表达式**\n\
  \n首先，我们显式地拒绝了 `double` 和指针之间的强制转换。该检查在代码列表 17-14 中被省略了，因为它与之前的章节相同。然后，我们检查目标类型是否为\
  \ `void` ❶。如果是，我们记录整个表达式的类型为 `void`。否则，我们验证目标类型 ❷ 和内部表达式 ❸ 都是标量。这拒绝了从 `void` 到任何非\
  \ `void` 类型的强制转换。它还禁止了到数组和函数类型的强制转换，我们已经知道这些是非合法的。\n\n代码列表 17-13 和 17-14 中的类型检查逻辑也适用于结构体，我们将在下一章实现它们。结构体是聚合类型，但它们不会像数组那样退化为指针。\n\
  \n### 不完全类型的限制\n\n程序如果使用不完全类型会导致类型错误。首先，你不能对指针进行加、减或下标操作，因为无法确定它们的大小。其次，你不能对不完全类型使用\
  \ `sizeof`，因为它的大小未知。第三，当你指定数组类型时，其元素必须是完整的。\n\n> **注意**：作为一种语言扩展，Clang 和 GCC 允许对\
  \ `void` 进行带有 `sizeof` 操作的指针算术。\n\n代码列表 17-15 定义了两个辅助函数来支持这一点：\n\n```\nis_complete(t):\n\
  \    return t != Void\nis_pointer_to_complete(t):\n    match t with\n    | Pointer(t)\
  \ -> is_complete(t)\n    | _ -> return False\n```\n**代码列表 17-15：检查不完全类型和指针**\n\n\
  每当我们需要检查完整类型时，都会使用 `is_complete`。当我们需要检查指针时，我们会使用 `is_pointer_to_complete`——特别是当我们类型检查指针加、减和下标操作时。例如，代码列表\
  \ 17-16 展示了如何类型检查加法。它重现了代码列表 15-21，并将本章的更改加粗，同时省略了部分代码。\n\n```\n | Binary(Add, e1,\
  \ e2) ->\n        typed_e1 = typecheck_and_convert(e1, symbols)\n        typed_e2\
  \ = typecheck_and_convert(e2, symbols)\n        t1 = get_type(typed_e1)\n      \
  \  t2 = get_type(typed_e2)\n        if t1 and t2 are arithmetic:\n            --snip--\n\
  \        else if is_pointer_to_complete(t1) and t2 is an integer type:\n       \
  \     --snip--\n        else if is_pointer_to_complete(t2) and t1 is an integer\
  \ type:\n            --snip--\n        else:\n            fail(\"Invalid operands\
  \ for addition\")\n```\n**代码列表 17-16：类型检查指针加，额外验证指针引用的类型是否完整**\n\n在下一章中，我们将扩展 `is_complete`\
  \ 以区分完整和不完全的结构类型。我们现在不需要担心 `sizeof`；稍后我们会对其进行类型检查，在第 477 页的“sizeof 表达式。这意味着我们只需要处理第三种情况，确保每个数组元素类型都是完整的。这也适用于嵌套在更大类型中的数组。例如，以下声明是无效的：\n\
  \n```\nvoid (*ptr_to_void_array)[3];\n```\n\n即使每个指针都是完整类型，但声明一个指向 `void` 元素数组指针是非法的。在代码列表\
  \ 17-17 中，我们定义了另一个辅助函数来捕获这些无效的类型限定符。\n\n\n\n\n```python\nvalidate_type_specifier(t):\n\
  \    match t with\n    | Array(elem_t, size) ->\n      ❶ if not is_complete(elem_t):\n\
  \            fail(\"Illegal array of incomplete type\")\n        validate_type_specifier(elem_t)\n\
  \    | Pointer(referenced_t) -> ❷ validate_type_specifier(referenced_t)\n    | FunType(param_ts,\
  \ ret_t) ->\n        for param_t in param_ts:\n            validate_type_specifier(param_t)\n\
  \        validate_type_specifier(ret_t)\n  ❸ | _ -> return\n```\n\n代码列表 17-17: 验证类型限定符\n\
  \n当我们看到一个数组类型时，我们会确保其元素类型是完整的 ❶，然后递归地验证该元素类型。这确保我们会拒绝包含 `void` 元素的嵌套数组、指向 `void`\
  \ 元素数组的指针数组等。为了处理另一种派生类型，我们会递归地验证它所引用的任何类型 ❷。非派生类型（包括 `void` 本身）都是有效的 ❸。我们会在类型限定符出现的任何地方调用\
  \ `validate_type_specifier` 来验证它们：在变量声明、函数声明、`sizeof` 表达式和强制转换表达式中。\n\n我们将在下一章对不完整类型引入更多限制。例如，在条件表达式的分支中使用除\
  \ `void` 以外的不完整类型是不允许的。给具有不完整类型的左值（lvalue）赋值也是不允许的，但我们现在可以忽略这条规则，因为得益于我们将实现的规则，不存在\
  \ `void` 类型的左值。\n\n### 对 void 的额外限制\n\n在我们刚刚实现的对所有不完整类型的限制之上，我们还将对 `void` 特别实施两个额外限制：你不能声明\
  \ `void` 类型的变量或参数，并且不能对指向 `void` 的指针进行解引用。（这两种对 `void` 的用法都是法律灰色地带；详细细节请参见框 “void\
  \ 何时有效：一个极其详尽的讨论”。）\n\n这些对 `void` 的限制不适用于其他不完整类型。在下一章中，你会发现你可以声明但不能定义一个具有不完整结构类型的变量。一旦类型完成，你就可以在程序的其他位置定义该变量。同样，你可以声明一个使用不完整结构类型作为参数或返回类型的函数，只要在调用或定义该函数之前完成该类型即可。最后，对指向不完整结构类型的指针进行解引用是合法的，尽管这并没有什么用；你允许对解引用结果做的唯一事情是取它的地址，这只是返回了你开始时的那个指针。\n\
  \n我们在这里处理了一个边缘情况。严格来说，获取*任何*被解引用指针的地址都是合法的，无论它是指向完整类型的指针、不完整结构类型还是 `void`。正如我们在第\
  \ 14 章中所看到的，获取解引用指针的地址是一个特殊情况；这两个操作相互抵消，结果是定义良好的，即使解引用表达式本身是未定义的。这意味着这段代码片段是合法的：\n\
  \n```c\nvoid *void_ptr = malloc(4);\nvoid *another_ptr = &*void_ptr;\n```\n\n我们的编译器将拒绝所有对\
  \ `void *` 操作数进行解引用操作，即使在这个边缘情况下也是如此。但我们并不孤单：GCC 对这段代码片段发出警告，而 MSVC 则完全拒绝了它。（当然，如果你愿意，可以正确处理这个边缘情况；我们的测试套件还没有涵盖它。）\n\
  \n### 使用 void 操作数的条件表达式\n\n我们将显式允许在条件表达式中使用 `void` 操作数，如代码列表 17-18:\n    match e\
  \ with\n    | --snip--\n    | Conditional(condition, e1, e2) ->\n        typed_cond\
  \ = typecheck_and_convert(condition, symbols)\n        typed_e1 = typecheck_and_convert(e1,\
  \ symbols)\n        typed_e2 = typecheck_and_convert(e2, symbols)\n      ❶ if not\
  \ is_scalar(get_type(typed_cond)):\n            fail(\"条件中的条件必须是标量\")\n        t1\
  \ = get_type(typed_e1)\n        t2 = get_type(typed_e2)\n      ❷ if t1 == Void and\
  \ t2 == Void:\n            result_type = Void\n        else if t1 and t2 are arithmetic\
  \ types:\n            result_type = get_common_type(t1, t2)\n        else if t1\
  \ or t2 is a pointer type:\n            result_type = pointer_type\n        --snip--\n\
  ```\n\n代码列表 17-18: 条件的类型检查\n\n为了对条件进行类型检查，我们首先验证其控制条件是标量 ❶。然后，我们考虑两个语句的类型。如果它们都是\
  \ `void`，结果也是 `void` ❷。否则，像之前一样寻找结果类型：如果两个操作数都是算术类型，则应用通常的算术转换；如果其中一个是指针，则找到它们的共同指针类型。如果这些情况都不适用——例如，一个操作数是\
  \ `void` 而另一个是算术值——我们就抛出一个错误。\n\n### 算术表达式和比较的现有验证\n\n接下来，我们将确保检查算术运算和比较的现有即使混合了\
  \ `void` 也能正常工作。之前，我们可以假设每个表达式都有算术或指针类型。现在我们不能依赖这个假设了。例如，让我们重新回顾代码列表 14-15](#chapter14.xhtml_list14-15)，它演示了如何类型检查\
  \ `Equal` 表达式。代码列表 17-19](#chapter17.xhtml_list17-19) 重现了这些代码，并包含了我们需要添加的额外验证。\n\
  \n```python\ntypecheck_exp(e, symbols):\n    match e with\n    | --snip--\n    |\
  \ Binary(Equal, e1, e2) ->\n        typed_e1 = typecheck_and_convert(e1, symbols)\n\
  \        typed_e2 = typecheck_and_convert(e2, symbols)\n        t1 = get_type(typed_e1)\n\
  \        t2 = get_type(typed_e2)\n        if t1 or t2 is a pointer type:\n     \
  \       common_type = get_common_pointer_type(typed_e1, typed_e2)\n        else\
  \ if t1 and t2 are arithmetic types:\n            common_type = get_common_type(t1,\
  \ t2)\n        else:\n            fail(\"等性表达式的操作数无效\")\n        --snip--\n```\n\
  \n代码列表 17-19: 等性表达式的类型检查，带有额外验证\n\n\n\n\n\n*如果你将这段代码与列表 14-15 进行比较，你会注意到我们已经将对 `typecheck_exp`\
  \ 的递归调用替换为 `typecheck_and_convert`。我们在第 15 章中已经进行了这一更改，因此这里没有加粗。*\n\n在第 14 章中，如果\
  \ `t1` 和 `t2` 都不是指针类型，我们就知道它们都是算术类型，因此可以直接进行通常的算术转换。现在我们将显式地检查它们是否为指针类型或算术类型；如果是其他任何类型，我们将失败。\n\
  \n更广泛地说，我们应该通过接受有效类型而不是拒绝无效类型来对每个表达式的操作数进行类型检查。例如，我们应该验证 `Multiply` 和 `Divide` 的操作数*是*算术值，而不是确保它们*不是*指针。花点时间检查你所有关系和算术操作的类型检查逻辑，收紧任何过于宽松的验证。\n\
  \n### sizeof 表达式\n\n`sizeof` 表达式的类型为 `size_t`；在我们的实现中，它就是 `unsigned long`。为了检查 `sizeof`\
  \ 的类型，我们首先验证其操作数，然后记录 `unsigned long` 为结果类型，如列表 17-20 所示。\n\n```\ntypecheck_exp(e,\
  \ symbols):\n    match e with\n    | --snip--\n    | SizeOfT(t) ->\n      ❶ validate_type_specifier(t)\n\
  \      ❷ if not is_complete(t):\n            fail(\"Can't get the size of an incomplete\
  \ type\")\n        return set_type(e, ULong)\n    | SizeOf(inner) ->\n      ❸ typed_inner\
  \ = typecheck_exp(inner, symbols)\n      ❹ if not is_complete(get_type(typed_inner)):\n\
  \            fail(\"Can't get the size of an incomplete type\")\n        return\
  \ set_type(SizeOf(typed_inner), ULong)\n```\n\n*列表 17-20：sizeof 的类型检查*\n\n如果 `sizeof`\
  \ 作用于类型，我们对不完整类型强制执行我们在第 471 页“不完整类型的限制”中讨论过的两个规则：你不能指定具有不完整元素类型的数组 ❶，而且你不能将 `sizeof`\
  \ 应用于不完整类型 ❷。（你不能将 `sizeof` 应用于函数类型，但我们已经在解析器中捕获了该错误。）\n\n如果操作数是一个表达式，我们首先推断该表达式的类型\
  \ ❸。为了避免将数组转换为指针，我们使用 `typecheck_exp` 而不是 `typecheck_and_convert`。一旦确定了表达式的类型，我们就确保该类型是完整的\
  \ ❹。\n\n#### 生成 TACKY\n\n接下来，我们将把 `sizeof` 和 `void` 表达式转换为 TACKY。我们需要更新 `Return`\
  \ 和 `FunCall` 指令，以处理具有 `void` 返回类型的函数。我们处理 `void` 类型的强制转换和条件表达式的方式将与它们的非 `void`\
  \ 对应项略有不同；特别是，我们不会创建任何 `void` 变量。在此过程中，我们还会评估 `sizeof` 表达式，将其替换为整数常量。我们不需要更改任何内容来支持\
  \ `void`。\n\n#### 返回 void 类型的函数\n\n我们将对 TACKY 进行两处更改，以便调用具有 `void` 返回类型的函数并从中返回。首先，我们将\
  \ `FunCall` 指令的目标地变为可选的：\n\n```\nFunCall(fun_name, val, dst)\n```\n\n对于对 `void`\
  \ 函数的调用，我们将 `dst` 置空。对于对任何其他函数的调用，`dst` 将是持有返回临时变量。我们将对 `Return` 指令进行类似的更改：\n\n\
  ```\nReturn(val?)\n```\n\n然后，我们将每个没有表达式的 `return` 语句翻译为不带值的 TACKY `Return`。`void`\
  \ 函数可能不会使用显式的 `return` 语句；在这种情况下，当控制到达函数末尾时，它会返回。我们已经通过在 TACKY 函数末尾添加 `Return` 指令来处理了这种情况。\n\
  \n#### 向 void 的强制转换\n\n列表 17-21 显示了如何处理到 `void` 的强制转换：只需处理内部表达式而不产生任何其他指令。\n\n```\n\
  emit_tacky(e, symbols):\n    match e with\n    | --snip--\n    | Cast(Void, inner)\
  \ ->\n        emit_tacky_and_convert(inner, symbols)\n        return PlainOperand(Var(\"\
  DUMMY\"))\n```\n\n*列表 17-21：将到 void 的强制转换转换为 TACKY*\n\n你可以在这里返回任何操作数；调用者不会使用它。\n\
  \n#### 带有 void 操作数的条件表达式\n\n列表 17-22 演示了我们如何将条件表达式转换为 TACKY。\n\n```\n Conditional(condition,\
  \ e1, e2) ->\n        --snip--\n        cond = emit_tacky_and_convert(condition,\
  \ symbols)\n        instructions.append(JumpIfZero(cond, e2_label))\n        dst\
  \ = make_tacky_variable(get_type(e), symbols)\n        v1 = emit_tacky_and_convert(e1,\
  \ instructions, symbols)\n        instructions.append_all(\n          ❶ [Copy(v1,\
  \ dst),\n              Jump(end),\n              Label(e2_label)])\n        v2 =\
  \ emit_tacky_and_convert(e2, instructions, symbols)\n        instructions.append_all(\n\
  \          ❷ [Copy(v2, dst),\n              Label(end)])\n        return PlainOperand(dst)\n\
  ```\n\n*列表 17-22：将非 void 条件表达式转换为 TACKY*\n\n\n\n\n\n如果 `e1` 和 `e2` 是 void 表达式，那么\
  \ `Copy` 指令❶❷就会出现问题。我们不应该创建一个类型为 `void` 的 `dst` 临时变量，而且绝对不应该向其拷贝任何内容。为了处理条件中的 void\
  \ 表达式，我们将坚持使用 Listing 17-22 中的基本方法，但不生成 `dst` 或发发任何 `Copy` 指令。Listing 17-23 显示了处理\
  \ void 条件表达式的更新伪代码。\n\n```\n | Conditional(condition, e1, e2) ->\n        --snip--\n\
  \        cond = emit_tacky_and_convert(condition, instructions, symbols)\n     \
  \   instructions.append(JumpIfZero(cond, e2_label))\n        if get_type(e) == Void:\n\
  \            emit_tacky_and_convert(e1, instructions, symbols)\n            instructions.append_all(\n\
  \            [Jump(end),\n              Label(e2_label)])\n            emit_tacky_and_convert(e2,\
  \ instructions, symbols)\n            instructions.append(Label(end))\n        \
  \  ❶ return PlainOperand(Var(\"DUMMY\"))\n        else:\n            --snip--\n\
  ```\n\nListing 17-23: 将带有 `void` 结果条件表达式转换为 TACKY\n\n由于我们没有创建临时变量 `dst`，我们需要向调用者返回另一个操作数。我们可以返回一个哑值\
  \ ❶，因为我们知道调用者不会使用它。为了处理非 void 表达式，我们将像之前一样生成指令，因此我省略了该情况的伪代码。\n\n### sizeof 表达式\n\
  \n我们在生成 TACKY 时求值 `sizeof` 表达式，并将结果表示为 `unsigned long` 常量，如 Listing 17-24 所示。\n\n\
  ```\n | SizeOf(inner) ->\n        t = get_type(inner)\n        result = size(t)\n\
  \        return PlainOperand(Constant(ConstULong(result)))\n    | SizeOfT(t) ->\n\
  \        result = size(t)\n        return PlainOperand(Constant(ConstULong(result)))\n\
  ```\n\nListing 17-24: 在生成 TACKY 时求值 `sizeof`\n\n由于我们没有将 `sizeof` 的操作数转换为 TACKY，它不会在运行时求值。\n\
  \n#### 最新且强大的 TACKY IR\n\nListing 17-25 定义了当前的 TACKY IR，本章的更改已加粗显示。\n\n```\nprogram\
  \ = Program(top_level)\ntop_level = Function(identifier, bool, identifier* params,\
  \ body)\n          | StaticVariable(identifier, bool, t, static_init)\n        \
  \  | StaticConstant(identifier, t, static_init)\ninstruction = Return(val?)\n  \
  \          | SignExtend(src, dst)\n            | Truncate(src, dst)\n          \
  \  | ZeroExtend(src, dst)\n            | DoubleToInt(src, dst)\n            | DoubleToUInt(src,\
  \ dst)\n            | IntToDouble(src, dst)\n            | UIntToDouble(src, dst)\n\
  \            | Unary(unary_operator, src, dst)\n            | Binary(binary_operator,\
  \ src1, src2, dst)\n            | Copy(src, dst)\n            | GetAddress(src,\
  \ dst)\n            | Load(src_ptr, dst)\n            | Store(src, dst_ptr)\n  \
  \          | AddPtr(ptr, index, scale, dst)\n            | CopyToOffset(src, dst,\
  \ offset)\n            | Jump(target)\n            | JumpIfZero(condition, target)\n\
  \            | JumpIfNotZero(condition, target)\n            | Label(identifier)\n\
  \            | FunCall(fun_name, val* args, dst)\nval = Constant(const) | Var(identifier)\n\
  unary_operator = Complement | Negate\nbinary_operator = Add | Subtract | Multiply\
  \ | Divide | Remainder | Equal | NotEqual\n                | LessThan | LessEqual\
  \ | GreaterThan | GreaterEqual\n```\n\nListing 17-25: 在 TACKY IR 中添加对 `void` 返回类型的支持\n\
  \n本节大部分更改——为了支持 void 转换、void 表达式和 `sizeof`——并没有影响 TACKY IR。我们将处理影响了它的两条指令。\n\n###\
  \ 汇编生成\n\n为了完成本章，我们将为无值的 `Return` 指令和无目的地的 `FunCall` 指令生成汇编。我们可以通过对汇编通过进行细微修改来处理这两者。\n\
  \n通常，形式为 `Return(val)` 的指令被转换为如下：\n\n```\nMov(val type, val)\nRet\n```\n\n如果缺少返回值，我们将跳过\
  \ `Mov` 指令，仅生成 `Ret` 指令。同样，Listing 17-26 总结了我们通常如何将 `FunCall` 指令转换为汇编。\n\n```\n\
  <fix stack alignment>\n<move arguments to general-purpose registers>\n<move arguments\
  \ to XMM registers>\n<push arguments onto the stack>\nCall(fun_name)\n<deallocate\
  \ arguments/padding>\n❶ Mov(dst type, dst register), dst\n```\n\nListing 17-26:\
  \ 当函数返回值时将 `FunCall` 转换为汇编\n\n如果 `dst` 不存在，我们将不会生成最后的 `Mov` 指令 ❶，但其他部分将保持不变。Table\
  \ 17-1 总结了从 TACKY 到汇编转换的最新更新，这两个细微更改已加粗。\n\nTable 17-1: 将 TACKY 指令转换为汇编\n\n| TACKY\
  \ 指令 | 汇编指令 |\n| --- | --- | --- |\n| `Return(val)` | 整数 | `Mov(val type, val, Reg(AX))\
  \ Ret` |\n| `double` | | `Mov(Double, val, Reg(XMM0)) Ret` |\n\n\n\n\n\n| `void`\
  \ | `Ret` |\n| :--- | :--- |\n| ```\nFunCall(fun_name, args,\n        dst)\n```\
  \ | `dst` 存在 |\n| ```\n<fix stack alignment>\n<move arguments to general-purpose\
  \ registers>\n<move arguments to XMM registers>\n<push arguments onto the stack>\n\
  Call(fun_name)\n<deallocate arguments/padding>\nMov(<dst type>, <dst register>,\
  \ dst)\n``` | `dst` 不存在 |\n| || ```\n<fix stack alignment>\n<move arguments to general-purpose\
  \ registers>\n<move arguments to XMM registers>\n<push arguments onto the stack>\n\
  Call(fun_name)\n<deallocate arguments/padding>\n``` | |\n\n由于汇编 AST 没有发生变化，我们不会触动后端的其他部分。\n\
  \n### 总结\n\n在本章中，你实现了 `void` 类型和 `sizeof` 运算符。你学习了完整类型与不完全类型之间的区别，以及 C 程序使用 void\
  \ 表达式的方法。然后，你扩展了类型检查器以检测对不完全类型和非标量类型的非法使用，修改了 TACKY 生成阶段以便在不求值操作数的情况下评估 `sizeof`\
  \ 运算符，并调整了后端以支持不返回值的函数。接下来，我们将通过添加结构类型来完成第二部分。结构体是你在书中实现的最后一个语言特性，也可能可能是最具挑战性的一个。幸运的是，得益于你学到的技能和在之前几个章节中打下的基础，你已经准备好迎接这一挑战。\n\
  \n![](img/pg484.jpg)\n\n描述\n\n## 18 结构体\n\n![](img/opener-img.jpg)\n\n在本章中，你将添加最后一个语言特性：结构体。你还将实现\
  \ `.` 和 `->` 运算符来访问结构体成员。作为对第二部分 完美的收尾，你将运用在前面的章节中学到的许多技能、概念和技术。在标识符解析阶段，你将同函数和变量标识符一起解析结构体标签（tags）。在类型检查器中，你将在类型表中记录结构体定义，这就像你已经在符号表中记录函数和变量声明一样。在\
  \ TACKY 生成期间，你将建立在第 14 章中用于处理解引用指针和其他对象的策略基础上。在后端，你将实现 System V 调用约定中的一部分，即规定如何将结构体作为函数参数和返回值。由于联合体（unions）是结构体的近亲，你可能也想实现它们。我们不会详细介绍它们，但你可以将它们作为额外的加分功能添加。\n\
  \n### 声明结构体类型\n\n在使用结构体类型之前，必须对其进行声明。结构体类型声明有两种。第一种如列表 18-1 所示，它指定了结构体的成员。\n\n```\n\
  struct complete_struct {\n    long member1;\n    double member2;\n};\n```\n\n列表\
  \ 18-1：完整结构体类型声明\n\n该列表声明了一个包含两个成员的完整结构类型：一个 `long` 和一个 `double`。标识符 `complete_struct`\
  \ 是该类型的*标签*（tag），我们可以用它在程序的后续部分指定该类型。完整结构体类型至少要有一个成员，因此声明一个成员列表为空的结构体类型是非法的：\n\n\
  ```\nstruct empty {};\n```\n\n第二种结构体类型声明如列表 18-2 所示，它指定了结构体的标签但没有指定成员。\n\n```\n\
  struct incomplete_struct;\n```\n\n列表 18-2：不完全结构体\n\n`struct incomplete_struct` 声明了一个不完全类型。正如你在上一章中学到的，你只能在有限的情况下使用不完全类型。例如，你不能在程序的这些点之间定义一个\
  \ `struct incomplete_struct` 变量，但定义 `ptr`（一个指向 `struct incomplete_struct` 的指针）是合法的。（这是因为我们知道指针需要多少内存，但不知道这个类型需要多少内存。）我们说，没有成员列表的结构体声明是*声明*了一个类型，而带有成员列表的结构体声明既*声明*又*定义*了一个类型。这与你将在标准中看到的术语不同；特别是当人们谈论“类型定义”时，通常指的是通过\
  \ `typedef` 引入的别名。\n\n结构体标签仅在声明的作用域内可见，就像函数名和变量名一样。如果结构体标签在文件作用域内声明，它从声明处开始一直可见到文件结束。如果它在块作用域内声明，则可见到块结束。如果两个相同标签的结构声明出现在同一个作用域内，它们总是声明同一个类型；如果它们出现在不同的作用域内，则声明不同的类型。（类型声明没有链接，所以你不能对它们应用\
  \ `static` 或 `extern` 关键字。）你可以多次声明同一个结构体，但不能定义超过一次。\n\n一旦其定义在作用域内，结构体类型就是完整的了，如列表\
  \ 18-3 所示。\n\n```\n❶ struct s;\n\nstruct s *ptr = 0;\n\nstruct s {\n    int a;\n\
  \    int b;\n}; ❷\n\n❸ struct x = {0,0};\n```\n\n列表 18-3：声明不完全类型\n\n在 ❶ 和 ❷ 之间，`struct\
  \ s` 是一个不完全类型。在程序的这两个点之间定义 `struct s` 变量是非法的，但定义 `ptr`（一个指向 `struct s` 的指针）是合法的。在指定成员列表的类型声明\
  \ ❷ 之后，`struct s` 是一个完整类型，因此定义该类型的变量 ❸ 是合法的。\n\n当相同的结构体标签在不同的作用域内声明时，一个可以遮蔽另一个，如列表\
  \ 18-4 所示。\n\n```\n#include <stdio.h>\n\n❶ struct s {\n    int a;\n};\n\nint main(void)\
  \ {\n    printf(\"Outer struct size: %lu\\n\", ❷ sizeof (struct s));\n\n  ❸ struct\
  \ s {\n        long l;\n    };\n\n    printf(\"Inner struct size: %lu\\n\", ❹ sizeof\
  \ (struct s));\n    return 0;\n}\n```\n\n列表 18-4：一个结构体遮蔽另一个\n\n\n\n\n\n首先，我们在文件作用域内定义了一个\
  \ `struct s` 类型 ❶。它的大小为 4 字节，因为它包含一个单一的 `int`。`main` 中的第一个 `sizeof(s)` 表达式引用该类型❷。然后，我们在块作用域内定义了另一个\
  \ `struct s` 类型 ❸，它遮蔽了第一个类型。该类型包含一个 `long`，所以它的大小是 8 字节。`struct s` 的两个定义并不冲突，因为它们出现在不同的作用域中。在第二个\
  \ `sizeof(s)` 表达式 ❹ 中，限定符 `struct s` 指的是内部作用域中定义的 8 字节结构类型。运行此程序将得到以下输出：\n\n```\n\
  $ ./listing_18_4\nOuter struct size: 4\nInner struct size: 8\n```\n\n即使结构的标签被遮蔽，它的成员仍然是可见的。请参考\
  \ Listing 18-5。\n\n```\nint main(void) {\n\n  ❶ struct shadow {\n        int x;\n\
  \    };\n    struct shadow outer;\n    outer.x = 2;\n    {\n      ❷ struct shadow\
  \ {\n            int y;\n        };\n        struct shadow inner;\n        inner.y\
  \ = 3;\n      ❸ return outer.x + inner.y;\n    }\n}\n```\n\n*Listing 18-5: 使用带有遮蔽结构类型的变量*\n\
  \n在这些列表中，我们首先声明了一个结构类型 `struct shadow` ❶。然后，我们定义了一个该类型的变量 `outer`。在内部作用域中，我们声明了具有相同标签的另一个结构类型\
  \ ❷，它遮蔽了外部声明。然后我们声明了一个具有此新类型的变量 `inner`。在 `return` 语句中，我们仍然可以访问这两个变量的成员 ❸。即使在内部作用域中，编译器也知道原始的\
  \ `struct shadow` 类型，并且仍然知道 `outer` 属于该类型；我们只是无法通过 `shadow` 标签来指定该类型。\n\n为了保持所有结构类型井井不紊，我们将结构标签处理得类似于变量名：在标识符解析阶段，我们会把每个用户定义的标签替换为唯一标识符。\n\
  \n### 结构成员声明\n\n结构的成员可以是任何完整类型，包括基本类型（如 `int`）和衍生类型（如数组、指针或其他结构）。然而，使用不完整类型声明结构成员是非允许的，因为这无法确定整个结构的大小。这正如\
  \ C 标准第 6.7.2.1 节第 3 段所说，“结构不应包含自身的实例。”也就是说，`struct s` 不能包含类型为 `struct s` 的成员。另一方面，结构可以包含指向自身的指针，因为指针类型总是完整的。典型的示例如\
  \ Listing 18-6 所示，是链表中的一个节点，它持有一个值和一个指向下一个列表条目的指针。\n\n```\nstruct linked_list_node\
  \ ❶ {\n    int val;\n    struct linked_list_node *next;\n}; ❷\n```\n\n*Listing 18-6:\
  \ 包含指向自身指针的结构类型定义*\n\n在 ❶ 之后，`struct linked_list_node` 作为不类型可见，因此可以将成员 `next` 声明为该类型的指针。在\
  \ ❷ 之后，`struct linked_list_node` 是完整的。\n\n### 标签与成员命名空间\n\n结构标签与函数和变量处于不同的命名空间。这意味着同一个标识符可以同时用作标签和变量，它们之间互不冲突。例如，在同一个作用域内声明\
  \ `struct s` 和变量 `s` 是完全合法的。同样，不同的结构具有相同的名称也是允许：\n\n```\nstruct s1 {\n    int x;\n\
  };\n\nstruct s2 {\n    int x;\n};\n```\n\n当标识符 `x` 出现在表达式中时，编译器可以根据上下文判断它是 `s1`\
  \ 中的成员、`s2` 中的成员，还是函数或变量。意料之中，同一个结构的两个成员共享同一个名称是不允许的。\n\n### 我们未实现的类型声明\n\nC 语法不区分结构限定符和类型声明，因此你可以同时声明一个新的结构类型并在较大的构造中使用该结构类型。例如，在\
  \ Listing 18-7 中，单个声明定义了一个新的结构类型 `struct s` 和一个类型为 `struct s` 的变量 `x`。\n\n```\n\
  struct s {\n    int member;\n} x;\n```\n\n*Listing 18-7: 在同一声明中定义并指定结构类型*\n\n为了简化解析和语义分析，我们要求每个声明必须恰好声明一个函数、变量或类型。我们不会支持像[Listing\
  \ 18-7]那样的同时声明新类型和其他其他实体的声明。这对于不完整类型也是如此。C 标准允许你通过仅指定来隐式声明一个不完整的结构类型：\n\n```\nstruct\
  \ s *f(void);\n```\n\n即使 `struct s` 尚未声明，此声明也是合法的：它同时声明了 `struct s` 为不完整类型，并声明了一个返回\
  \ `struct s` 指针的函数。然而，我们的实现不允许这样做。相反，我们要求先对 `struct s` 进行单独声明：\n\n```\nstruct s;\n\
  struct s *f(void);\n```\n\n\n\n\n\n要求类型在使用之前必须声明，意味着你不能将一个结构声明嵌套在另一个结构内部，就像列表 18-8\
  \ 所示。\n\n```\nstruct outer {\n    struct inner {\n        int a;\n        long l;\n\
  \    } i;\n    double d;\n};\n```\n\n列表 18-8：在同一声明中声明内部结构类型并使用该类型声明成员 i。\n\n我们还将施加一些其他限制。我们将拒绝没有标签的结构声明和没有名称的结构成员，尽管\
  \ C 标准允许这样做。我们还不会支持`bit-field members`（位域成员），这种成员允许访问结构体中的单个位。\n\n### 结构体的操作\n\n\
  你可以使用 `.` 运算符访问结构的成员：\n\n```\nstruct s var;\n--snip--\nlong l = var.member1;\n```\n\
  \n如果你有一个指向结构的指针，可以使用 `->` 运算符访问结构的成员。继续使用上例示例：\n\n```\nstruct s *ptr = &var;\nlong\
  \ l2 = ptr->member1;\n```\n\n你只能对完整的结构类型应用 `.` 和 `->` 运算符。你无法访问不结构类型的成员，因为这些成员还没有被定义。\n\
  \n结构是聚合类型，类似于数组。但结构不会像数组那样退化为指针，因此你可以使用几种数组无法使用的方法。例如，你可以将它们作为函数参数和返回值。你也可以对它们进行赋值，就像列表\
  \ 18-9 所示。\n\n```\nstruct s foo;\nstruct s bar;\n--snip--\nfoo = bar;\n```\n\n列表\
  \ 18-9：给结构赋值。\n\n也可以给结构的单个成员赋值，只要它们是左值（lvalues）。使用 `->` 运算符指定的结构成员始终是一个左值：\n\n```\n\
  ptr->member2 = 2.0;\n```\n\n记住，所有解引用指针都是左值。`->` 运算符产生一个解引用指针，就像 `*` 和 `[]` 运算符一样，因此适用相同的规则。\n\
  \n如果结构是一个左值，那么你通过 `.` 运算符访问的任何成员也是左值。如果结构不是左值，它的成员也不是左值。因此，这个赋值表达式是合法的：\n\n```\n\
  var.member2 = 2.0;\n```\n\n但是，由于函数调的结果不是左值，这是不合法的：\n\n```\nreturn_struct().member2\
  \ = 2.0;\n```\n\n结构可以出现在其他几个表达式中，基本上就在你预期的位置。它们可以出现在条件表达式的分支中，只要两个分支具有相同的结构类型。你可以使用\
  \ `sizeof` 获取它们的大小并将它们转换为 `void`，但在其他情况下不能在结构类型之间进行强制转换。如果结构或结构成员是左值，你可以获取它的地址。\n\
  \n初始化结构有两种方法。你可以使用具有相同结构类型的表达式来初始化它：\n\n```\nstruct s return_struct(void);\nstruct\
  \ s var = return_struct();\n```\n\n或者，你可以使用复合初始化器（compound initializer）单独初始化每个成员，就像列表\
  \ 18-10 所示。\n\n```\nstruct example {\n    int member1;\n    double member2;\n  \
  \  char array[3];\n};\n\nstruct example var = {1, 2.0, ❶ {'a', 'b', 'c'}};\n```\n\
  \n列表 18-10：使用复合初始化器初始化结构。\n\n复合初始化器初始化结构的成员。列表 18-10 中的初始化器将 `member1` 初始化为 `1`，将\
  \ `member2` 初始化为 `2.0`。请注意，指定初始化器（designated initializers，与数组不同）允许你初始化特定的成员。结构的指定初始化器也允许你初始化嵌套结构，依此类推。\n\
  \n### 结构在内存中的布局\n\n此时，我们对结构的工作原理已经有了很好的理解。现在让我们看看它们在内存中是如何布局的。这部分由标准规定，部分由 ABI 规定。严格按照\
  \ ABI 指定的结构布局代码才能与其他代码相互操作。结构的成员出现顺序与源码声明中的顺序相同。让我们使用列表 18-10 中的 `struct example`\
  \ 类型作为示例。\n\n```\nstruct example {\n    int member1;\n    double member2;\n    char\
  \ array[3];\n};\n```\n\n列表 18-11：具有多个带有对齐要求的结构类型\n\n第一个成员必须从结构的最开始。由于 `member1`\
  \ 是一个 `int`，它占据了结构的前 4 个字节。结构中的字节通常从 0 开始索引，因此我们说 `member1` 占据字节 0 到 3。因此，下一个未使用的空间在字节\
  \ 4 处。但 `member2` 是一个 `double`，它是 8 字节对齐的；它的起始地址必须是 8 的倍数。因此，`member2` 将存储在字节 8\
  \ 到 15 之间。我们说 `member2` 距离结构开始位置偏移量为 8 字节。在 `member1` 和 `member2` 之间（即字节 4 到 7），我们有\
  \ 4 字节的填充。\n\n最后一个成员 `array` 占用 3 个字节且对齐要求为 1 字节。由于我们不需要任何填充来正确对齐它，我们将直接存储在 `member2`\
  \ 之后，即字节 16 到 18 之间。\n\n\n\n\n\n我们还需要在 `array` 之后的结尾添加填充（padding）。根据 System V ABI，类型的大小必须是其对齐方式的倍数。ABI\
  \ 还规定，结构的对齐方式与其对齐要求严格的成员相同。`struct example` 中对齐要求严格的成员是 `double`  `member2`。因此，整个结构必须是\
  \ 8 字节对齐，其大小必须是 8 的倍数。`struct example` 的三个成员以及它们之间的填充占据了 19 字节。我们在结构末尾添加 5 字节的填充，使其总大小增加到\
  \ 24 字节。图 18-1 展示了整个结构的布局。\n\n![](img/fig18-1.jpg)\n\n**图 18-1: 内存中的结构布局** 描述\n\n\
  成员之间的填充确保了每个成员最终位于对齐的内存地址上。如果整个结构的起始地址是 8 的倍数，且 `member2` 相对于起始的偏移量也是 8 的倍数，那么我们就知道\
  \ `member2` 的运行时内存地址也将是 8 的倍数。结构末尾的填充确保了结构数组中的每个元素都有正确的对齐；如果 `struct example` 对象数组中的初始元素是\
  \ 8 字节对齐的，且其总大小为 24 字节，那么后续每个元素也将是 8 字节对齐。\n\n现在你已经理解了如何在 C 中处理结构以及它们在内存中的布局，让我们开始着实现它们吧。\n\
  \n### 词法分析器\n\n你将在本章中添加三个新的标记（tokens）：\n\n| Token | 描述 |\n| :--- | :--- |\n| `struct`\
  \ | 表示结构类型说明符的关键字 |\n| `.` | 点号，结构成员访问运算符 |\n| `->` | 箭头，通过指针访问结构成员的运算符 |\n\n请记住，点号既可以是结构成员访问运算符，也可以是浮点常数的一部分。只有当点号后面紧跟着非数字字符时，我们才将其识别为\
  \ `.` 标记。如果点号后面是数字，那么它要么是浮点常数的开头，要么是非法的。例如，如果词法分析器看到输入 `.100u`，它应该尝试将其解析为常量。然后它会报错，因为这不匹配任何类型常数的正则表达式。它*不应该*将其词法为\
  \ `.` 标记后接常量 `100u`。\n\n### 语法解析器\n\n我们将在本章向 AST 中添加几个新结构：结构声明、结构类型说明符以及两个新的结构运算符。代码列表\
  \ 18-12 提供了结构声明的 AST 定义。\n\n```\nstruct_declaration = (identifier tag, member_declaration*\
  \ members)\nmember_declaration = (identifier member_name, type member_type)\n```\n\
  \n**列表 18-12: 在 AST 中表示结构声明**\n\n`struct_declaration` 由一个标签（tag）和一个成员列表组成。为了表示一个不完整的结构类型声明，我们将成员列表留空。（记住，完整的结构类型必须至少有一个成员）。我们将用\
  \ `member_declaration` 来表示每个成员，其中包含成员名称和类型。\n\n接下来，我们将扩展 `member_declaration` AST\
  \ 以支持结构声明。\n\n```\nmember_declaration = (identifier member_name, type member_type)\n\
  ```\n\n我们还将扩展 `struct_declaration` AST 以包含类型说明符，例如：\n\n```\nstruct_declaration =\
  \ (identifier tag, member_declaration* members)\n```\n\n最后，我们将添加两个表达式：`.` 和 `->`\
  \ 运算符，它们有时分别称为 `Dot` 和 `Arrow`。\n\n```\nDot(exp, identifier member)\nArrow(exp pointer,\
  \ identifier member)\n```\n\n这些运算符中的每一个都接受表达式作为第一个操作数，并将结构的名称作为第二个操作数。代码列表 18-13\
  \ 定义了完整的 AST，本章的更改已加粗显示。\n\n```\nprogram = Program(declaration*)\ndeclaration =\
  \ FunDecl(function_declaration) | VarDecl(variable_declaration)\n            | StructDecl(struct_declaration)\n\
  ```\n\n\n\n\n\n列表 18-13：包含结构类型以及 `.` 和 `->` 运算符的抽象语法树。\n\n列表 18-14 显示了对应的语法法变化。\n\
  \n```\n<program> ::= {<declaration>}\n<declaration> ::= <variable-declaration> |\
  \ <function-declaration> | <struct-declaration>\n<variable-declaration> ::= {<specifier>}+\
  \ <declarator> [\"=\" <initializer>] \";\"\n<function-declaration> ::= {<specifier>}+\
  \ <declarator> (<block> | \";\")\n<struct-declaration> ::= \"struct\" <identifier>\
  \ ❶ [\"{\" {<member-declaration>}+ \"}\"] \";\"\n<member-declaration> ::= {<type-specifier>}+\
  \ <declarator> \";\"\n<declarator> ::= \"*\" <declarator> | <direct-declarator>\n\
  <direct-declarator> ::= <simple-declarator> [<declarator-suffix>]\n<declarator-suffix>\
  \ ::= <param-list> | {\"[\" <const> \"]\"}+\n<param-list> ::= \"(\" \"void\" \"\
  )\" | \"(\" <param> {\",\" <param>} \")\"\n<param> ::= {<type-specifier>}+ <declarator>\n\
  <simple-declarator> ::= <identifier> | \"(\" <declarator> \")\"\n<type-specifier>\
  \ ::= \"int\" | \"long\" | \"unsigned\" | \"signed\" | \"double\" | \"char\" | \"\
  void\"\n                   | \"struct\" <identifier>\n<specifier> ::= <type-specifier>\
  \ | \"static\" | \"extern\"\n<block> ::= \"{\" {<block-item>} \"}\"\n<block-item>\
  \ ::= <statement> | <declaration>\n<initializer> ::= <exp> | \"{\" <initializer>\
  \ {\",\" <initializer>} [\",\"] \"}\"\n<for-init> ::= <variable-declaration> | [<exp>]\
  \ \";\"\n<statement> ::= \"return\" [<exp>] \";\"\n              | <exp> \";\"\n\
  \              | \"if\" \"(\" <exp> \")\" <statement> [\"else\" <statement>]\n \
  \             | <block>\n              | \"break\" \";\"\n              | \"continue\"\
  \ \";\"\n              | \"while\" \"(\" <exp> \")\" <statement>\n             \
  \ | \"do\" <statement> \"while\" \"(\" <exp> \")\" \";\"\n              | \"for\"\
  \ \"(\" <for-init> [<exp>] \";\" [<exp>] \")\" <statement>\n              | \";\"\
  \n<exp> ::= <cast-exp> | <exp> <binop> <exp> | <exp> \"?\" <exp> \":\" <exp>\n<cast-exp>\
  \ ::= \"(\" <type-name> \")\" <cast-exp>\n             | <unary-exp>\n<unary-exp>\
  \ ::= <unop> <cast-exp>\n              | \"sizeof\" <unary-exp>\n              |\
  \ \"sizeof\" \"(\" <type-name> \")\"\n              | <postfix-exp>\n<type-name>\
  \ ::= {<type-specifier>}+ [<abstract-declarator>]\n<postfix-exp> ::= <primary-exp>\
  \ {<postfix-op>}\n<postfix-op> ::= \"[\" <exp> \"]\"\n               | \".\" <identifier>\n\
  \               | \"->\" <identifier>\n<primary-exp> ::= <const> | <identifier>\
  \ | \"(\" <exp> \")\" | {<string>}+\n                | <identifier> \"(\" [<argument-list>]\
  \ \")\"\n<argument-list> ::= <exp> {\",\" <exp>}\n<abstract-declarator> ::= \"*\"\
  \ [<abstract-declarator>]\n                        | <direct-abstract-declarator>\n\
  <direct-abstract-declarator> ::= \"(\" <abstract-declarator> \")\" {\"[\" <const>\
  \ \"]\"}\n                               | {\"[\" <const> \"]\"}+\n<unop> ::= \"\
  -\" | \"~\" | \"!\" | \"*\" | \"&\"\n<binop> ::= \"-\" | \"+\" | \"*\" | \"/\" |\
  \ \"%\" | \"&&\" | \"||\"\n          | \"==\" | \"!=\" | \"<\" | \"<=\" | \">\"\
  \ | \">=\" | \"=\"\n<const> ::= <int> | <long> | <uint> | <ulong> | <double> | <char>\n\
  <identifier> ::= ? 一个标识符 token ?\n<string> ::= ? 一个字符串 token ?\n<int> ::= ? 一个整数\
  \ token ?\n<char> ::= ? 一个字符 token ?\n<long> ::= ? 一个整数或长整 token ?\n<uint> ::= ?\
  \ 一个无符号整数 token ?\n<ulong> ::= ? 一个无符号整数或无符号长整 token ?\n<double> ::= ? 一个浮点数常量 token\
  \ ?\n```\n\n列表 18-14：包含结构类型以及 `.` 和 `->` 运算符的语法\n\n\n\n\n```python\nresolve_type(type_specifier,\
  \ structure_map):\n    match type_specifier with\n    | Structure(tag) ->\n    \
  \    if tag is in structure_map:\n            unique_tag = structure_map.get(tag).new_tag\n\
  \          ❶ return Structure(unique_tag)\n        else:\n          ❷ fail(\"Specified\
  \ an undeclared structure type\")\n    | Pointer(referenced_t) ->\n        resolved_t\
  \ = resolve_type(referenced_t, structure_map)\n        return Pointer(resolved_t)\n\
  \    | Array(elem_t, size) -> \n        --snip--\n    | FunType(param_ts, ret_t)\
  \ -> \n        --snip--\n    | t -> return t\n```\n\nListing 18-15: 替换类型限定符中的结构体标签\n\
  \n`resolve_type` 函数接受一个类型限定符并返回该限定符的副本，其中任何结构体标签都已替换为唯一 ID。当 `resolve_type` 遇到结构类型时，它会将标签替换为来自\
  \ `structure_map` 对应的标识符 ❶。如果标签不在 `structure_map` 中，说明该结构体尚未声明，因此它会抛出一个错误 ❷。为了解析派生类型（如\
  \ `Pointer`），我们递归地解析其组成类型。我省略了 `Array` 和 `FunType` 的伪代码，我们将以处理 `Pointer` 相同的方式处理它们。我们原样返回任何其他类型。我们将使用\
  \ `resolve_type` 处理 AST 中的每个类型限定符，包括函数和变量声明中的限定符、强制转换和 `sizeof` 表达式以及结构体成员声明中的限定符。\n\
  \n### 解析结构类型声明\n\n接下来，让我们来看列表 18-16 中的伪代码，它说明了如何解析结构类型声明。\n\n```python\nresolve_structure_declaration(decl,\
  \ structure_map):\n    prev_entry = structure_map.get(decl.tag) ❶\n    if (prev_entry\
  \ is null) or (not prev_entry.from_current_scope):\n        unique_tag = make_temporary()\n\
  \        structure_map.add(decl.tag, MapEntry(new_tag=unique_tag, from_current_scope=True))\
  \ ❷\n    else:\n        unique_tag = prev_entry.new_tag ❸\n    processed_members\
  \ = []\n    for member in decl.members:\n        processed_type = resolve_type(member.member_type,\
  \ structure_map) ❹\n        processed_member = (member_name=member.member_name,\
  \ member_type=processed_type)\n        processed_members.append(processed_member)\n\
  \    resolved_decl = (tag=unique_tag, members=processed_members)\n    return resolved_decl\
  \ ❺\n```\n\nListing 18-16: 向结构体标签表中添加结构类型声明\n\n首先，我们在结构体标签表中查找该声明的标签 ❶。如果该标签尚未声明，或者它是在外部作用域中声明的，则此声明引入了一个新类型。因此，我们生成一个新的标识符并将其添加到结构体标签表中\
  \ ❷。如果结构体的标签已经在当前作用域中声明，则当前声明只是重新声明了相同类型。在这种情况下，我们不生成新的唯一 ID；而是使用映射表中已有的那个 ❸。\n\n\
  此时，结构体标签表已是最新的。现在我们转换结构类型声明本身。如果此声明指定了结构体的成员，我们通过对每个成员调用 `resolve_type` 来解析其成员类型\
  \ ❹。我们将声明中用户定义的标签替换为 `unique_tag`，即我们在函数早些时候生成或查找到的 ID。最后，我们返回转换后的声明 ❺。\n\n注意，我们在处理任何结构体成员之前就将新标签添加到了\
  \ `structure_map`。这使得我们能够接受自引用结构体，例如列表 18-6 中的链表节点：\n\n```c\nstruct linked_list_node\
  \ {\n    int val;\n    struct linked_list_node *next;\n};\n```\n\n同样注意，我们没有为成员生成唯一名称。变量和函数需要唯一性，因为它们都存储在符号表中；结构体标签需要唯一性，因为它们都存储在同一个表中。我们将对标识符再进行两次更新。首先，在每个新作用域的开始，我们将创建一个结构体表的副本，并将\
  \ `from_current_scope` 设置为 `False`，就像我们处理标识符时所做的那样。第二个更改纯是机械性的：我们将以处理所有其他类型的方式扩展\
  \ `Dot` 和 `Arrow` 表达式。\n\n#### 结构体的类型检查\n\n就像类型检查器在符号表中记录每个函数和变量的信息一样，它也将在类型表中记录每个完整结构的信息。让我们从定义类型表开始；然后，我们将查看如何将结构声明转换为类型表条目。最后，我们将使用类型表中的信息对声明和初始化器进行类型检查。\n\
  \n### 定义类型表\n\n类型表将我们在上阶段生成的结构体标签映射到 `struct_entry` 构造。列表 18-17 定义了 `struct_entry`。\n\
  \n```python\nstruct_entry = StructEntry(int alignment, int size, member_entry* members)\n\
  member_entry = MemberEntry(identifier member_name, type member_type, int offset)\n\
  ```\n\nListing 18-17: 类型表中的条目\n\n`struct_entry` 描述了结构类型的对齐、大小和成员。我们使用 `member_entry`\
  \ 构造来描述每个成员，它指定了成员的名称、其类型以及从结构开始的偏移量。`struct_entry` 应该支持两种不同的 `members` 方式：通过名称查找特定成员以及按顺序获取整个成员列表。\n\
  \n\n\n\n当类型检查器遇到一个完整结构类型的定义时，它应该对该定义进行验证，然后将其转换为 `struct_entry` 并添加到类型表中。类型检查器可以忽略任何不带成员列表的结构类型声明；没有成员列表的声明要么声明了一个不完整类型，要么重新声明了一个已经定义的类型。\n\
  \n为了验证结构类型定义，我们首先检查该结构是否已经存在于类型表中。如果是，说明在同一作用域内存在相同标签（tag）的另一个定义，我们将抛出一个错误。然后，我们要确保结构中的没有成员具有相同的名称，没有成员是不完整类型，且没有成员类型指定了具有不完整元素类型的数组。（记住，不完整类型的数组在任何地方都是非法的，而不仅仅是在结构定义中。）你可能还想验证没有结构成员是函数类型，但这并不是严格必要的，因为我们已经在解析过程中验证过了这一点。\n\
  \n在验证结构类型满足所有这些要求后，我们将计算每个成员的偏移量以及整个结构的大小和对齐方式。在本章前面的部分，我们已经见过如何进行这些计算并演示了一个示例。现在让我们来看\
  \ Listing 18-18，它用伪代码演示了整个过程。\n\n```\ntypecheck_struct_declaration(struct_decl,\
  \ type_table):\n  ❶ if struct_decl.members is empty:\n        return\n  ❷ validate_struct_definition(struct_decl,\
  \ type_table)\n\n    // 为每个成员定义一个 member_entry\n  ❸ member_entries = []\n    struct_size\
  \ = 0\n    struct_alignment = 1\n    for member in struct_decl.members:\n      \
  \  member_alignment = alignment(member.member_type, type_table)\n      ❹ member_offset\
  \ = round_up(struct_size, member_alignment)\n      ❺ m = MemberEntry(member.member_name,\
  \ member.member_type,\n                        member_offset)\n        member_entries.append(m)\n\
  \        struct_alignment = max(struct_alignment, member_alignment)\n        struct_size\
  \ = member_offset + size(member.member_type, type_table)\n\n    // 为整个结构定义一个 struct_entry\n\
  \  ❻ struct_size = round_up(struct_size, struct_alignment)\n    struct_def = StructEntry(struct_alignment,\
  \ struct_size, member_entries)\n  ❼ type_table.add(struct_decl.tag, struct_def)\n\
  ```\n\n#### Listing 18-18: 计算结构定义\n\n我们首先检查此声明是否包含成员列表 ❶。如果不包含，我们立即返回，不对类型表做任何任何更改。如果它包含成员列表，我们就会验证它是否符合本节之前描述的\
  \ own ❷。我不会给你们 `validate_struct_definition` 的伪代码，因为它并不复杂。\n\n然后，我们进入了有趣的部分：确定每个成员在内存中的布局。在这里，我们将为每个结构成员定义一个\
  \ `member_entry` ❸。在处理过程中，我们将维护一个结构大小（字节）的运行总和 `struct_size`。我们还将跟踪目前为止看到的最严格的成员对齐方式，即\
  \ `struct_alignment`。\n\n要计算结构成员的偏移量，我们获取下一个可用偏移量（由 `struct_size`给出），并将其向上取整到该成员的对齐倍数\
  \ ❹。（稍后我们将演示如何查找每个类型的大小和对齐方式。）我们构造它的 `member_entry` ❺，然后更新 `struct_alignment` 和\
  \ `struct_size`。\n\n一旦处理完每个成员，我们通过将 `struct_size` 向上取整到其对齐齐倍数 ❻ 来计算结构的总大小。这个取整后的大小将考虑到结构末部的任何填充。最后，我们将整个\
  \ `struct_entry` 添加到类型表中 ❼。\n\n##### 在辅助函数中处理结构\n\n我们将大量的类型检查逻辑集中在了几个辅助函数中，包括 `is_scalar`\
  \ 和 `is_complete`。你也写了一些辅助函数来查找每个类型的大小和其他属性，尽管我还没有提供。现在我们将把这些函数扩展到结构类型。我们在 Listing\
  \ 17-12 中定义了 `is_scalar`。Listing 18-19 提供了更新后的定义。\n\n```\nis_scalar(t):\n    match\
  \ t\n    | Void -> False\n    | Array(elem, size) -> False\n    | FunType(param,\
  \ ret) -> False\n    | Structure(tag) -> False\n```\n\n#### Listing 18-19: 检查类型是否为标量\n\
  \n结构类型不是标量，所以这非常直接。\n\n更新 `is_complete` 稍微复杂一些；我们需要咨询类型表。Listing 18-20 提供了新函数。\n\
  \n```\nis_complete(t, type_table):\n    match t\n    | Void -> False\n    | Structure(tag)\
  \ ->\n        if tag in type_table:\n            return True\n        else:\n  \
  \          return False\n    | _ -> True\n```\n\n##### Listing 18-20: 检查类型是否完整\n\
  \n如果结构类型在类型表中，它就是完整的；否则，它是不完整的。正如我们之前看到的，结构类型在程序的某处可能是不完整的，但在之后是完整的。在类型检查期间，类型表告诉我们结构类型在当前点是否完整。考虑\
  \ Listing 18-21 中的代码片段。\n\n```\n❶ struct s;\n❷ struct t {\n    struct s member;\n\
  };\n❸ struct s {\n    int a;\n    int b;\n};\n```\n\n##### Listing 18-21: 使用不完整结构声明变量\n\
  \n由于 `struct s` 的第一个声明 ❶ 没有指定任何成员，因此我们不会将其添加到类型表中。然后，当我们验证 `struct t` 的定义 ❷ 时，将在类型表中查找\
  \ `s`。（严格来说，我们将查找在标识符解析阶段替换 `s` 的唯一标识符。）当我们找不到它时，将正确地判断出 `struct s` 是不完整的并抛出错误。如果\
  \ `struct t` 的声明出现在 `struct s` 的定义 ❸ 之后，我们将在处理 `struct t` 之前将 `struct s` 添加到类型表中，因此就不会抛出错误。\n\
  \n\n\n\n\n我们还需要辅助函数来查找类型的尺寸和对齐方式。列表 18-22 显示了 `alignment` 函数的伪代码。\n\n```\nalignment(t,\
  \ type_table):\n    match t with\n    | Structure(tag) ->\n        struct_def =\
  \ type_table.get(tag)\n        return struct_def.alignment\n    | Array(elem_t,\
  \ size) ->\n        return alignment(elem_t, type_table)\n    | --snip--\n```\n\n\
  列表 18-22：计算类型的对齐方式\n\n为了找到结构体的对齐方式，我们将在类型表中查找它。为了找到数组的对齐方式，我们将递归地计算其元素类型的对齐。我们将硬编码其他类型的对齐方式，这些由\
  \ ABI 决定。我不会提供 `size` 的伪代码，它看起来会和 `alignment` 相似。\n\n> **注意**\n\n> 我们之前学过，如果一个数组类型的变量是\
  \ 16 字节或更大，则它必须是 16 字节对齐的。列表 18-22 没有反映这一要求，因为它计算的是类型的对齐，而不是变量。如果你还没有写，你可能需要编写一个不同的辅助函数来计算变量的对齐。\n\
  \n我们在前面的章节中定义的其他辅助函数应该可以正确处理结构体，无需任何更改。考虑 `convert_by_assignment`，我们用它来检查赋值表达式以及其他将值“通过赋值”转换为特定类型的地方。列表\
  \ 18-23 重现了列表 17-11 中该代码的最新版本。\n\n```\nconvert_by_assignment(e, target_type):\n\
  \    if get_type(e) == target_type:\n        return e\n    if get_type(e) is arithmetic\
  \ and target_type is arithmetic:\n        return convert_to(e, target_type)\n  \
  \  if is_null_pointer_constant(e) and target_type is a pointer type:\n        return\
  \ convert_to(e, target_type)\n    if target_type == Pointer(Void) and get_type(e)\
  \ is a pointer type:\n        return convert_to(e, target_type)\n    if target_type\
  \ is a pointer type and get_type(e) == Pointer(Void):\n        return convert_to(e,\
  \ target_type)\n    else:\n        fail(\"Cannot convert type for assignment\")\n\
  ```\n\n列表 18-23：将表达式转换为目标类型\n\n如果我们向 `convert_by_assignment` 传递一个已经具有正确结构类型的表达式，它将原样返回该表达式。在任何其他涉及源结构或目标结构类型的情况下，它都会失败。这是正确的行为，因为没有办法转换到结构类型或从结构体类型进行转换。\n\
  \n### 处理不完全结构体类型\n\n我们需要对不完全结构体类型实施几项限制。首先，我们将验证这些类型在声明中的用法；然后，我们将验证它们在表达式中的用法。\n\
  \n声明一个带有不完全结构类型参数或返回值的函数是合法的，但不能定义它。（记住，函数定义是带有体的函数声明。）如果 `struct s` 是一个不完全类型，类型检查器应该接受此声明：\n\
  \n```\nvoid take_a_struct(struct s incomplete);\n```\n\n但它应该拒绝这个定义：\n\n```\nvoid\
  \ take_a_struct(struct s incomplete) {\n    return;\n}\n```\n\n同样，我们将接受带有不完全结构类型的变量声明，但拒绝这些变量的任何定义，包括尝试性定义。（这比\
  \ C 标准更严格，C 标准在某些限制情况下允许不完全类型变量的尝试性定义。）具体来说，只有当变量声明具有 `extern` 存储类且没有初始化器时，我们才接受不完全结构类型的变量声明。\n\
  \n声明处理完毕；现在让我们考虑表达式。在表达式中使用不完全类型变量只有一种方法。你可以获取它的地址，如下例所示：\n\n```\nextern struct\
  \ s my_incomplete_struct;\nstruct s *ptr = &my_incomplete_struct;\n```\n\n然后你可以像使用任何其他指针一样使用\
  \ `ptr`。同样，合法（尽管并不特别有用）对指向不完全结构的指针进行解引用然后获取其地址，结果如下：\n\n```\nstruct s *another_ptr\
  \ = &ptr;\n```\n\n对不完全结构的任何其他使用都是无效的。你甚至不能将其转换为 `void` 或将其用作表达式，因此类型检查器应该拒绝以下两个：\n\
  \n```\n(void) my_incomplete_struct;\n*ptr;\n```\n\n我们将扩展 `convert_by_assignment`\
  \ 来捕获这些情况。列表 18-24 给出了该函数的更新定义，其中相对于列表 15-19 原始定义的更改部分已加粗。\n\n```\ntypecheck_and_convert(e,\
  \ symbols, type_table):\n    typed_e = typecheck_exp(e, symbols, type_table)\n \
  \   match get_type(typed_e) with\n    | Array(elem_t, size) ->\n        --snip--\n\
  \    | Structure(tag) ->\n        if tag is not in type_table:\n            fail(\"\
  Invalid use of incomplete structure\")\n        return typed_e\n    | _ -> return_e\n\
  ```\n\n列表 18-24：在 `typecheck_and_convert` 中拒绝不完全类型\n\n记住 `convert_by_assignment`\
  \ 处理 AST 中的每个表达式，但静态初始化器（必须是常量）以及 `SizeOf` 和 `AddrOf` 操作的操作数（它们不会发生数组退化）。这使得 `convert_by_assignment`\
  \ 成为放置验证的最方便的地方，尽管这与函数的原始目的（即将数组转换为指针）无关。有了这种新验证，将在每种表达式中正确处理不完全类型：我们将在 `AddrOf`\
  \ 表达式中允许不完全类型，现有的验证将在 `SizeOf` 表达式中拒绝所有不完全类型（包括 `void`），而 `convert_by_assignment`\
  \ 将其他所有地方拒绝不完全类型。注意 `convert_by_assignment` 仍然接受 void 表达式，而这些表达式在不完全结构类型不允许的某些地方是合法的。\n\
  \n我们已经实现了对不完全类型所需的所有其他验证。例如，我们已经要求指针算术表达式中的指针操作数指向完整类型，并且已经要求数组类型说明符中的元素类型是完整的。\n\
  \n### 成员访问运算符的类型检查\n\n\n\n\n\n接下来，让我们对 `.` 和 `->` 运算符进行类型检查。在两种情况下，我们都会验证表达式，确定成员类型，并将其记录为整个表达式的类型。代码列表\
  \ 18-25 演示了如何对 `.` 运算符进行类型检查。\n\n```\ntypecheck_exp(e, symbols, type_table):\n \
  \   match e with\n    | --snip--\n    | Dot(structure, member) ->\n        typed_structure\
  \ = typecheck_and_convert(structure, symbols, type_table)\n      ❶ match get_type(typed_structure)\
  \ with\n        | Structure(tag) ->\n          ❷ struct_def = type_table.get(tag)\n\
  \          ❸ member_def = <find member in struct_def.members>\n            if member_def\
  \ is not found:\n                fail(\"Structure has no member with this name\"\
  )\n            member_exp = Dot(typed_structure, member)\n          ❹ return set_type(member_exp,\
  \ member_def.member_type)\n        | _ -> fail(\"Tried to get member of non-structure\"\
  )\n    | Arrow(pointer, member) ->\n        --snip--\n```\n\n代码列表 18-25: 检查 `.`\
  \ 运算符的类型\n\n我们首先通过调用 `typecheck_and_convert` 对第一个操作数 `structure` 进行类型检查（如果 `structure`\
  \ 是不完整的类型，则会抛出错误）。然后，我们验证 `structure` 确实是一个结构体 ❶。如果是的话，我们在类型表中查找其类型 ❷，然后在结果的类型表条目中查找\
  \ `member` ❸。最后，我们用成员类型对表达式进行标注 ❹。如果 `structure` 不是结构体，或者没有具有此名称的成员，我们就会抛出错误。\n\n\
  我不会提供用于 `->` 运算符类型检查的伪代码，因为它们几乎相同；唯一的区别在于我们需要验证第一个操作数是（结构体的指针，而不是结构体本身。\n\n### 验证左值（Lvalues）\n\
  \n`->` 表达式始终是一个左值。为了确定 `.` 表达式是否为左值，类型检查器必须递归检查其第一个操作数是否为左值。例如，类型检查器应该拒绝表达式 `f().member\
  \ = 3`。因为 `f()` 不是左值，所以 `f().member` 也不是左值。\n\n这意味着我们可能会遇到不是左值的数组！显式地获取此类数组的地址是错误的，如代码列表\
  \ 18-26 所示。\n\n```\nstruct s {\n    int arr[3];\n};\n\nstruct s f(void);\n\nint\
  \ main(void) {\n    int *pointer_to_array[3] = &(f().arr);\n    --snip--\n}\n```\n\
  \n代码列表 18-26: 非法获取非左值的地址\n\n然而，这些数组仍然退化为指针，因此它们的地址仍然会被隐式加载。例如，代码列表 18-27 中的程序是完全合法的。\n\
  \n```\nstruct s {\n    int arr[3];\n};\n\nstruct s f(void);\n\nint main(void) {\n\
  \    return f().arr[0];\n}\n```\n\n代码列表 18-27: 隐式将非左值数组转换为指针\n\n当我们对该程序进行类型检查时，我们将插入\
  \ `Addr` 来获取 `f().arr` 的地址，就像检查数组时一样。\n\n### 检查条件表达式的类型\n\n类型检查器应该接受两个分支都具有相同结构的条件表达式。它应该拒绝只有一个分支具有结构，或两个分支类型不同的条件表达式。\n\
  \n### 检查初始化器的类型\n\n最后，我们将处理结构体初始化器。正如你在在本章前面学到的，你可以使用单个表达式或复合初始化器来初始化结构体。为了处理初始化器，我们将如代码列表\
  \ 18-28 所示，根据成员类型对初始化器中的每一项进行类型检查。\n\n```\ntypecheck_init(target_type, symbols,\
  \ type_table):\n    match target_type, init with\n    | Structure(tag), CompoundInit(init)\
  \ ->\n        struct_def = type_table.get(tag) ❶\n        if length(init) > length(struct_def):\
  \ ❷\n            fail(\"Too many elements in structure initializer\")\n        i\
  \ = 0\n        typechecked_list = []\n        for init_elem in init: ❸\n       \
  \     t = struct_def.members[i].member_type\n            typechecked_elem = typecheck_init(t,\
  \ symbols, type_table)\n            typechecked_list.append(typechecked_elem)\n\
  \            i += 1\n        while i < length(struct_def): ❹\n            t = struct_def.members[i].member_type\n\
  \            typechecked_list.append(zero_initializer(t))\n            i += 1\n\
  \        return set_type(CompoundInit(typechecked_list), target_type)\n    | --snip--\n\
  ```\n\n代码列表 18-28: 检查复合初始化器的类型\n\n我们首先在类型表中查找该结构体 ❶。在调用 `typecheck_init` 之前，我们应该已经验证过\
  \ `target_type` 是完整的，因此此时可以安全地假设结构体已经定义。接下来，我们将确保初始化器列表不会过长❷❷就像处理数组初始化器一样，我们会拒绝元素过多的初始化器列表，但接受元素过少而无法初始化整个对象的列表。\n\
  \n在执行此检查后，我们将遍历初始化器列表 ❸。为了对每个初始化器进行类型检查，将在结构体的成员列表中查找成员类型，然后递归调用 `typecheck_` 以确保初始化器与该类型兼容。最后，我们将用零填充任何未初始化的结构体成员\
  \ ❹。\n\n\n\n\n\n```\nstruct example {\n    int member1;\n    double member2;\n \
  \   char array[3];\n};\n\nstruct example var = {1, 2.0, {'a', 'b', 'c'}};\n```\n\
  \n我们发现该结构体在 `member1` 和 `member2` 之间包含了 4 字节的填充，在 `array` 之后包含了 5 字节的填充。如果 `var`\
  \ 是一个静态变量，我们将使用列表 18-29 中的构造来表示它的初始值。\n\n```\nInitial([IntInit(1),\n       ❶ ZeroInit(4),\n\
  \         DoubleInit(2.0),\n         CharInit(97),\n         CharInit(98),\n   \
  \      CharInit(99),\n       ❷ ZeroInit(5)])\n```\n\n列表 18-29：将列表 18-10 中的初始化器表示为\
  \ `static_init` `list`\n\n我们使用 `ZeroInit` 构造 ❶❷ 来初始化填充，因为 C 标准要求静态结构体中的填充必须初始化为零。列表\
  \ 18-30 演示了如何生成像列表 18-29 那样的静态初始化列表。\n\n```\ncreate_static_init_list(init_type,\
  \ initializer, type_table):\n    match init_type, initializer with\n    | Structure(tag),\
  \ CompoundInit(init_list) ->\n      ❶ struct_def = type_table.get(tag)\n       \
  \ if length(init_list) > length(struct_def.members):\n            fail(\"Too many\
  \ elements in structure initializer\")\n        current_offset = 0\n        static_inits\
  \ = []\n        i = 0\n        for init_elem in init_list:\n            member =\
  \ struct_def.members[i]\n            if member.offset != current_offset:\n     \
  \         ❷ static_inits.append(ZeroInit(member.offset - current_offset))\n    \
  \      ❸ more_static_inits = create_static_init_list(member.member_type,\n     \
  \                                                   init_elem,\n               \
  \                                         type_table)\n            static_inits.append_all(more_static_inits)\n\
  \            current_offset = member.offset + size(member.member_type,\n       \
  \                                           type_table)\n            i += 1\n  \
  \      if struct_def.size != current_offset:\n          ❹ static_inits.append(ZeroInit(struct_def.size\
  \ - current_offset))\n        return static_inits\n    | Structure(tag), SingleInit(e)\
  \ ->\n      ❺ fail(\"Cannot initialize static structure with scalar expression\"\
  )\n    | --snip--\n```\n\n列表 18-30：为结构体生成静态初始化器\n\n为了处理静态结构体的复合初始化器，我们首先在类型表中查找该结构体\
  \ ❶。我们确保初始化列表不会太长，就就像我们在 `typecheck_init` 中处理非静态初始化器所做的那样。然后，我们遍历初始化列表，为结构体成员列表中的每个元素查找对应的成员定义。在此过程中，我们更新\
  \ `current_offset` 变量，以跟踪目前为止我们初始化了多少字节。\n\n每当处理结构体成员的初始化器时，我们首先检查是否初始化了足够的字节以达到预期的偏移量。如果没有，我们就使用\
  \ `ZeroInit` 初始化器 ❷ 添加必要的填充。然后，我们通过递归调用 `create_static_init_list` ❸ 为该结构体成员本身创建初始化列表。接下来，我们根据刚刚初始化的成员的偏移量和大小来更新\
  \ `current_offset`。\n\n一旦我们初始化了每个结构体成员，就会再添加另一个 `ZeroInit` ❹，将结构体填充到正确的大小。由于没有对应类型的常量，使用\
  \ `SingleInit` 表达式初始化静态结构体是一个错误 ❺。\n\n### TACKY 生成\n\n在本节中，我们将引入最后一个 TACKY 指令：\n\
  \n```\nCopyFromOffset(identifier src, int offset, val dst)\n```\n\n该指令镜像了我们在第 15\
  \ 章中添加的 `CopyToOffset` 指令。`CopyFromOffset` 中的 `src` 标识符是聚合变量的名字，`offset` 是该变量内部子对象的字节偏移量，而\
  \ `dst` 是我们将该子对象拷贝到的变量。列表 18-31 定义了完整的 TACKY IR，包括新的 `CopyFromOffset` 指令。\n\n```\n\
  program = Program(top_level*)\ntop_level = Function(identifier, global, identifier*\
  \ params, instruction* body)\n          | StaticVariable(identifier, global, type\
  \ t, static_init*)\n          | StaticConstant(identifier, type t, static_init)\n\
  instruction = Return(val?)\n            | SignExtend(val src, val dst)\n       \
  \     | Truncate(val src, val dst)\n            | ZeroExtend(val src, val dst)\n\
  \            | DoubleToInt(val src, val dst)\n            | DoubleToUInt(val src,\
  \ val dst)\n            | IntToDouble(val src, val dst)\n            | UIntToDouble(val\
  \ src, val dst)\n            | Unary(unary_operator, val src, val dst)\n       \
  \     | Binary(binary_operator, val src1, val src2, val dst)\n            | Copy(val\
  \ src, val dst)\n            | GetAddress(val src, val dst)\n            | Load(val\
  \ src_ptr, val dst)\n            | Store(val src, val dst_ptr)\n            | AddPtr(val\
  \ ptr, val index, int scale, val dst)\n            | CopyToOffset(val src, identifier\
  \ dst, int offset)\n            | CopyFromOffset(identifier src, int offset, val\
  \ dst)\n            | Jump(identifier target)\n            | JumpIfZero(val condition,\
  \ identifier target)\n            | JumpIfNotZero(val condition, identifier target)\n\
  \            | Label(identifier)\n            | FunCall(identifier fun_name, val*\
  \ args, val? dst)\nval = Constant(const) | Var(identifier)\nunary_operator = Complement\
  \ | Negate | Not\nbinary_operator = Add | Subtract | Multiply | Divide | Remainder\
  \ | Equal | NotEqual\n                | LessThan | LessOrEqual | GreaterThan | GreaterOrEqual\n\
  ```\n\n\n\n\n\n你不仅可以使用 `CopyToOffset` 和 `CopyFromOffset` 指令访问结构中的子对象，还可以使用 `Copy`、`Load`\
  \ 和 `Store` 将整个结构从一个位置拷贝到另一个位置，或者通过 `Return` 和 `FunCall` 在函数之间传递它们，就像处理标量变量一样。我们将结构类型的变量表示为普通的\
  \ TACKY `Var`。\n\n接下来，我们将成员访问运算符转换为 TACKY。然后，我们将处理复合结构初始化器。我们不会改变处理大多数可以使用结构构造体的方式，例如函数调用、`return`\
  \ 语句和条件表达式。我们还不需要对新的顶层 `StructDecl` 构造体进行任何操作；我们将在此阶段丢弃结构声明，就像我们丢弃没有函数体的函数声明和没有初始化器的变量声明一样。\n\
  \n### 实现成员访问运算符\n\n在较早的章节中，你学习了了以下三种方式之一使用对象：你可以对其进行左值转换（lvalue convert）、对其赋值，或者获取它的地址。现在有了第四种选择方案：如果该对象是一个结构，你可以访问它的其中一个成员。由于该结构成员本身也是一个对象，你可以对其进行左值转换、赋值、获取地址，或访问*它的*其中一个成员。让我们看看在这些情况下我们应该生成的\
  \ TACKY。然后，基于我们在第 14 章中处理解引用指针的方法，我们将引入一种新类型的 `exp_result` 来指定结构成员。\n\n#### 在 TACKY\
  \ 中访问结构成员\n\n要对结构成员执行任何类型的操作，我们将首先在类型表中查找该成员的偏移量。首先，考虑结构本身是 TACKY 变量而非解引用指针或某些较大结构中的子对象的情况。为了对结构成员进行左值转换，我们将使用\
  \ `CopyFromOffset` 指令。我们将 `struct.member` 转换为：\n\n```\n<instructions for struct>\n\
  s = <result of struct>\nresult = CopyFromOffset(s, <member offset>)\n```\n\n我们将使用\
  \ `CopyToOffset` 给结构成员赋值，将 `struct.member = <right>` 转换为：\n\n```\n<instructions\
  \ for struct>\ndst = <result of struct>\n<instructions for right>\nsrc = <result\
  \ of right>\nCopyToOffset(src, dst, <member offset>)\n```\n\n为了获取结构成员的地址，我们将首先加载包含它的对象的地址，然后加上成员的偏移量。我们将\
  \ `&struct.member` 转换为：\n\n```\n<instructions for struct>\ns = <result of struct>\n\
  result = GetAddress(s)\nresult = AddPtr(ptr=result, index=<member offset>, scale=1)\n\
  ```\n\n为了处理一系列嵌套的成员访问，我们将它们的所有偏移量相加，然后根据序列中最后一个成员的使用方式发布一条指令。考虑列表 18-32 中的结构声明。\n\
  \n```\nstruct inner {\n    char c;\n    int i;\n};\n\nstruct outer {\n    int member1;\n\
  \    struct inner member2;\n};\n```\n\n*列表 18-32：声明一个包含嵌套结构的结构*\n\n如果 `my_struct`\
  \ 是一个 `struct outer` 且我们需要对 `my_struct.member2.i` 进行左值转换，我们将发射：\n\n```\nresult =\
  \ CopyFromOffset(\"my_struct\", 8)\n```\n\n因为 `member2` 在 `struct outer` 中的偏移量为\
  \ 4 字节，而 `i` 在 `struct inner` 中的偏移量为 4 字节，所以 `my_struct.member2.i` 距离 `my_struct`\
  \ 起点的总偏移量为 8 字节。最后，考虑如何通过解引用指针访问结构成员。最符合习惯的方法是使用箭头运算符，形式为 `exp->member`。这等同于表达式\
  \ `(*exp).member`。要实现其中任何一种，你将成员偏移量加上指针，然后解引用结果。与任何解引用指针一样，发布 `Load` 或 `Store` 指令或直接使用指针的值将取决于它的如何使用。假设\
  \ `inner_struct_pointer` 的类型为 `struct inner *`。我们将表达式\n\n```\ninner_struct_pointer->i\
  \ = 1\n```\n\n转换为：\n\n```\nptr = AddPtr(ptr=inner_struct_pointer, index=4, scale=1)\n\
  Store(1, ptr)\n```\n\n我们可以用完全相同的指令来实现等效的表达式：\n\n```\n(*inner_struct_pointer).i =\
  \ 1\n```\n\n现在我们已经知道了想要生成的指令，将更新 TACKY 生成遍历。\n\n#### 使用 SubObject 指定结构成员\n\n让我们扩展\
  \ `exp_result` 构造体以指定聚合对象的成员。列表 18-33 提供了 `exp_result` 的更新定义。\n\n```\nexp_result\
  \ = PlainOperand(val)\n           | DereferencedPointer(val)\n           | SubObject(identifier\
  \ base, int offset)\n```\n\n*列表 18-33：扩展 exp_result 以表示子对象*\n\n\n\n\n`SubObject`\
  \ 的 `base` 参数是一个聚合对象，而不是指针。第二个参数 `offset` 是指向该对象的字节偏移量。`SubObject` 所指代的对象可以是标量的，也可以本身是一个聚合对象。在\
  \ Listing 18-34 中，我们使用这种构造结构来表示 `Dot` 操作符的结果。\n\n```\nemit_tacky(e, instructions,\
  \ symbols, type_table):\n    match e with\n    | --snip--\n    | Dot(structure,\
  \ member) ->\n        struct_def = <look up structure's type in the type table>\n\
  \        member_offset = <look up member offset in struct_def>\n        inner_object\
  \ = emit_tacky(structure, instructions, symbols, type_table)\n        match inner_object\
  \ with\n        | PlainOperand(Var(v)) -> return SubObject(v, member_offset) ❶\n\
  \        | SubObject(base, offset) -> return SubObject(base, offset + member_offset)\
  \ ❷\n        | DereferencedPointer(ptr) -> ❸\n            dst_ptr = make_tacky_variable(Pointer(get_type(e)),\
  \ symbols)\n            instr = AddPtr(ptr=ptr, index=Constant(ConstLong(member_offset)),\n\
  \                           scale=1, dst=dst_ptr)\n            instructions.append(instr)\n\
  \            return DereferencedPointer(dst_ptr)\n```\n\n**Listing 18-34: 将 Dot\
  \ 操作符转换为 TACKY** \n\n首先，我们在结构中查找 `member` 的偏移量。然后，我们处理该表达式的第一个操作数，而不对其进行左值（lvalue）转换。得到的对象是一个普通的\
  \ TACKY 变量、TACKY 变量的子对象，或者是一个解引用指针。（我们知道结果不是常量，因为 TACKY 没有结构类型的常量。）\n\n如果 `inner_object`\
  \ 仅仅是一个变量，我们返回一个 `SubObject`，它指代该变量内部 `member_offset` 处的对象 ❶。如果 `inner_object` 本身是某个较大变量中的子对象，我们将它的偏移量加到\
  \ `member_offset` 上 ❷。这处理了嵌套的成员操作符，例如我们在在本节早期考虑过的表达式 `my_struct .member2.i`。\n\n\
  最后，如果内部结构是一个解引用指针，我们使用指针算术访问结构成员 ❸。由于 `DereferencedPointer(ptr)` 指代整个结构，`ptr` 必须指向结构的起始位置。我们将\
  \ `member_offset` 加到 `ptr` 上，以获得指向指定结构成员的指针。然后，我们解引用该指针以指代结构成员本身。\n\n### 处理 SubObject\n\
  \n接下来，我们将在左值转换、赋值表达式和 `AddrOf` 表达式中处理 `SubObject` 构造。为了对 `SubObject` 进行左值转换，如 Listing\
  \ 18-35 所示，我们使用 `CopyFromOffset` 指令将其拷贝到一个新变量中。\n\n```\nemit_tacky_and_convert(e,\
  \ instructions, symbols, type_table):\n    result = emit_tacky(e, instructions,\
  \ symbols, type_table)\n    match result with\n    | SubObject(base, offset) ->\n\
  \        dst = make_tacky_variable(get_type(e), symbols)\n        instructions.append(CopyFromOffset(base,\
  \ offset, dst))\n        return dst\n    return result\n```\n\n**Listing 18-35:\
  \ SubObject 的左值转换**\n\n相反，当 `SubObject` 出现在赋值表达式的左侧时，我们使用 `CopyToOffset` 指令向其写入，如\
  \ Listing 18-36 所示。\n\n```\nemit_tacky(e, instructions, symbols, type_table):\n\
  \    match e with\n    | --snip--\n    | Assignment(left, right) ->\n        lval\
  \ = emit_tacky(left, instructions, symbols, type_table)\n        rval = emit_tacky(right,\
  \ instructions, symbols, type_table)\n        match lval with\n        | SubObject(base,\
  \ offset) ->\n            instructions.append(CopyToOffset(base, offset, rval))\n\
  ```\n\n**Listing 18-36: 给 SubObject 赋值**\n\n最后，Listing 18-37 展示了如何计算 `SubObject`\
  \ 的地址。我们加载基的地址，然后加上偏移量。\n\n```\n | AddrOf(inner) ->\n    v = emit_tacky(inner, instructions,\
  \ symbols, type_table)\n    match v with\n    | SubObject(base, offset) ->\n   \
  \     dst = make_tacky_variable(get_type(e), symbols)\n        instructions.append(GetAddress(base))\n\
  \        instructions.append(AddPtr(ptr=dst, index=Constant(ConstLong(offset)),\
  \ scale=1, dst=dst))\n        return dst\n```\n\n**Listing 18-37: 获取 SubObject 的地址**\n\
  \n我们复用同一个临时变量 `dst` 来同时指向基对象及其成员。我们也可以生成两个临时变量，但没有必要。因为 `SubObject` 构造中的偏移量是以字节为单位的，所以此\
  \ `AddPtr` 指令的比例因子（scale）为 `1` ❶。\n\n\n\n\n\n我们不需要任何额外的逻辑来处理 `Arrow` 表达式的结果。该表达式始终产生一个\
  \ `DereferencedPointer` 结构，而我们已经知道如何处理它。\n\n### 省略多用的 AddPtr 指令\n\n结构中的第一个成员的偏移量始终为零。作为一种可选的优化，可以在计算该成员的地址时跳过\
  \ `AddPtr` 指令。这会影响代码列表 18-34 和 18-37，以及 `Arrow` 的实现（我没有提供它的伪代码）。在所有三种情况下，如果 `member_offset`\
  \ 为 `0`，那么你就不需要生成 `AddPtr` 指令。\n\n### 将复合初始化器转换为 TACKY\n\n为了完成本节，我们将复合结构初始化器转换为\
  \ TACKY。基本方法与之前的章节相同：我们将顺序求值初始化列表中的每个表达式，并使用 `CopyToOffset` 指令将每个表达式的结果拷贝到目标位置正确的偏移量处。但现在我们需要检查类型表，以找到每个表达式找到正确的偏移量。我们还需要计算嵌套结构内部、结构数组、包含数组的结构等的子对象的偏移量。\n\
  \n代码列表 18-38 展示了在遍历结构或数组的复合初始化器时如何跟踪这些偏移量并发射 `CopyToOffset` 指令。\n\n```python\ncompound_initializer_to_tacky(var_name,\
  \ offset, init, instructions, symbols, type_table):\n    match init, get_type(init)\
  \ with\n    | SingleInit(String(s)), Array(elem_t, size) ->     --snip--\n    |\
  \ SingleInit(e), t ->\n        v = emit_tacky_and_convert(e, instructions, symbols,\
  \ type_table)\n        instructions.append(CopyToOffset(v, var_name, offset)) ❶\n\
  \    | CompoundInit(init_list), Structure(tag) ->\n        members = type_table.get(tag).members\n\
  \        for mem_init, member in zip(init_list, members):\n            mem_offset\
  \ = offset + member.offset ❷\n            compound_initializer_to_tacky(var_name,\
  \ mem_offset, mem_init, instructions,\n                                        \
  \  symbols, type_table)\n    | CompoundInit(init_list), Array(elem_t, size) -> \n\
  \        --snip--\n```\n\n**代码列表 18-38: 将复合初始化器转换为 TACKY**\n\n`compound_initializer_to_tacky`\
  \ 的参数包括 `var_name`（正在初始化的数组或结构变量名）、`offset`（当前子对象在该变量内部的字节偏移量）以及 `init`（初始化器本身）。在初始化整个变量的顶层调用中，`offset`\
  \ 参数将为 `0`。\n\n在基础情况下，我们使用单个表达式的值初始化一个子对象。该表达式可能是初始化数组的字符串字面量；我省略了该情况的伪代码，我们在之前的第\
  \ 16 章 中讨论过。否则，我们求值表达式并使用 `CopyToOffset` 指令将结果拷贝到位置 ❶。即使结果具有结构类型，我们也可以通过单条指令将其拷贝到目标。\n\
  \n当我们遇到结构的复合初始化器时，我们在类型表中查找该结构的成员列表。我们通过将相应的成员偏移量加上起始 `offset` 参数，来计算初始化列表中每个项的偏移量。\n\
  \n### System V 约定中的结构\n\n汇编生成中最困难的部分是处理函数调用。\n\n#### 结构分类\n\n在 System V x64 ABI\
  \ 中，每个参数和返回值都有一个类，它决定了数据如何传输。我们已经遇到过两个类，尽管我没有使用“类”一词来描述它们。整数、字符和指针类型的值属于 `INTEGER`\
  \ 类；它们通过通用寄存器传输。类型为 `double` 的值属于 `SSE` 类。18-38 没有使用填充。\n\nABI 为结构提供了一个相当复杂的算法。我们可以使用该算法的简化版本，因为有很多我们不处理的类型，比如\
  \ `float` 和联合体（unions）。在本节中我们将介绍分类结构的简化规则。有关完整算法，请参阅第 553 页“附加资源”中列出的文档。\n\n###\
  \ 将结构拆分为八字节\n\n我们将结构中的每个 8 字节块分配一个独立的类。ABI 将这些块称为 *eightbytes*。如果结构的大小不能被 8 整除，最后一个八字节可能短于\
  \ 8 字节（这使得该术语有点误导性）。考虑代码列表 18-39，它定义了一个 12 字节的结构。\n\n```c\nstruct twelve_bytes {\n\
  \    int i;\n    char arr[8];\n};\n```\n\n**代码列表 18-39: 具有两个八字节的结构**\n\n该结构的第一个八字节包含\
  \ `i` 和 `arr` 的前四个元素。第二个八字节长度为 4 字节，包含 `arr` 的后四个元素。图 18-2 显示了该结构在内存中的布局。\n\n\n\n\
  \n\n图 18-2: `struct twelve_bytes` 在内存中的布局 [描述]\n\n图 18-2 展示了像 `arr` 这样的嵌套数组可以跨越多个八字节（eightbytes）。嵌套结构体也是如此。考虑列表\
  \ 18-40 中的结构声明。\n\n```c\nstruct inner {\n    int i;\n    char ch2;\n};\n\nstruct\
  \ nested_ints {\n    char ch1;\n    struct inner nested;\n};\n```\n\n列表 18-40: 包含跨越两个八字节的嵌套结构的结构类型\n\
  \n图 18-3 显示了 `struct nested_ints` 如何在内存中布局。\n\n![](img/fig18-3.jpg)\n\n图 18-3: `struct\
  \ nested_ints` 在内存中的布局 [描述]\n\n该结构体的第一个八字节包含两个标量值：`ch1` 和嵌套成员 `nested.i`。第二个八字节包含\
  \ `nested.ch2`。当我们对结构体进行分类时，我们关心每个八字节包含什么标量值，但我们并不关心这些值是如何分组成嵌套结构体或数组的。对于我们的分类算法而言，`struct\
  \ nested _ints` 等于在列表 18-41 中定义的 `struct flattened_ints` 类型。\n\n```c\nstruct flattened_ints\
  \ {\n    char c;\n    int i;\n    char a;\n};\n```\n\n列表 18-41: 内存中布局与 `struct nested_ints`\
  \ 相同的结构\n\n该结构体在内存中看起来与 `struct nested_ints` 完全相同：它的第一个八字节包含一个 `char` 和一个 `int`，第二个八字节包含另一个\
  \ `char`。\n\n### 分类八字节\n\n如果一个结构体大于 16 字节——也就是说，如果它由三个或更多八字节组成——我们将每个八字节分配给 MEMORY\
  \ 类。例如，`struct large` 包含四个八字节，它们都被归类为 MEMORY：\n\n```c\nstruct large {\n    int i;\n\
  \    double d;\n    char arr[10];\n};\n```\n\n如果结构体为 16 字节或更小，我们将根据其内容将每个八字节分配到\
  \ INTEGER 或 SSE 类。如果一个八字节包含 `double`，则它属于 SSE 类；如果包含任何其他内容，则属于 INTEGER 类。例如，来自列表\
  \ 18-39 的 `struct twelve_bytes` 的两个八字节都属于 INTEGER 类。我们将来自列表 18-40 的 `struct nested_ints`\
  \ 的两个八字节以及来自列表 18-41 的 `struct flattened_ints` 的两个八字节都分配给 INTEGER 类。我们将来自[列表 18-42]的\
  \ `struct nested_ints` 的两个八字节也分配给 INTEGER 类……因为它们中没有一个包含 `double`。\n\n定义更多类型。\n\n\
  ```c\nstruct nested_ints {\n    int i;\n    int i2;\n};\n\nstruct nested_double\
  \ {\n    double i;\n};\n\nstruct twelve_bytes {\n    double d;\n    char c;\n};\n\
  ```\n\n列表 18-42: 更多类型\n\n`struct nested_ints` 包含一个八字节。`struct nested_double` 包含一个八字节。`struct\
  \ twelve_bytes` 包含两个八字节：第一个是 `double`，第二个是 `char`。\n\n#### 传递参数\n\n一旦我们对结构体进行了分类，就可以确定如何传递它。如果结构体由一个或两个八字节组成，我们将结构体的每个八字节传递到下一个寄存器中。如果结构体由单个\
  \ INTEGER 类的八字节组成，我们将通过下一个通用寄存器传递它。如果它由单个 SSE 类的八字节组成，我们将通过下一个参数传递寄存器传递它。如果它由一个\
  \ INTEGER 八字节和一个 SSE 八字节组成，我们将第一个八字节放在通用寄存器中，将下一个八字节放在 XMM 寄存器中，依此类推。如果没有足够的寄存器来传递整个结构体，我们将整个结构推入栈中。\n\
  \n让我们来看几个例子。首先，在列表 18-43 中，我们重现了在列表 18-42 中定义的 `struct twelve_bytes` 类型，并声明了一个带参数的函数。\n\
  \n```c\nstruct twelve_bytes {\n    double d;\n    char c;\n};\n\nvoid pass_struct(struct\
  \ twelve_bytes param);\n```\n\n列表 18-43: 带有 struct twelve_bytes 参数的函数\n\n假设 `x`\
  \ 是 `struct twelve_bytes` 变量，存储在栈地址 `-16(rbp)` 。我们可能将函数调用 `pass _struct(x)` 转换为列表\
  \ 18-44 中的汇编。\n\n```assembly\nmovsd   -16(%rbp), %xmm0\nmovq    -8(%rbp), %rdi\n\
  call    pass_struct\n```\n\n列表 18-44: 用两个寄存器传递结构体参数\n\n由于该结构的第一个八字节属于 SSE 类，我们通过第一个参数传递\
  \ XMM 寄存器（XMM0）传递它。结构的第二个八字节属于 INTEGER 类，因此我们通过第一个通用参数传递寄存器（RDI）传递它。\n\n```c\nstruct\
  \ two_longs {\n    long a;\n    long b;\n};\n\nvoid a_bunch_of_arguments(int i0,\
  \ int i1, int i2, int i3, int i4,\n                          struct two_longs param,\
  \ int i5);\n```\n\n列表 18-45: 必须在内存中传递的结构体参数的函数声明\n\n\n\n\n当我们调用 `a_bunch_of_arguments()`\
  \ 时，我们将参数 `i0` 到 `i4` 分别通过寄存器 `EDI`、`ESI`、`EDX`、`ECX` 和 `R8D` 传递。这没有留下足够的寄存器来传递\
  \ `param` 参数；这两个八字节（eightbytes）都属于 `INTEGER` 类，但只有一个通用目的参数传递寄存器 `R9` 可用。因此，我们将整个结构体推入堆栈中。然后，由于\
  \ `R9D` 仍然可用，我们将使用它来传输 `i5`。如果 `arg` 是一个具有静态存储持续时间的 `struct two_longs`，我们可以将函数调用：\n\
  \n```\na_bunch_of_arguments(0, 1, 2, 3, 4, arg, 5);\n```\n\n转换为列表 18-46 所示的汇编代码。\n\
  \n```\nmovl    $0, %edi\nmovl    $1, %esi\nmovl    $2, %edx\nmovl    $3, %ecx\n\
  movl    $4, %r8d\nmovl    $5, %r9d\n❶ pushq   arg+8(%rip)\npushq   arg(%rip)\ncall\
  \    a_bunch_of_arguments\n```\n\n列表 18-46：在堆栈上传递结构体\n\n由于 `arg` 存在于数据段，我们使用 RIP\
  \ 相对寻址来访问它。在这里我们使用了一种新的汇编语法：`arg+8(%rip)` 表示标签 `arg` 之后 8 字节处的地址。因此，我们的第一个 `push`\
  \ 指令将把结构体的第二个八字节（包含成员 `b`）推入堆栈 ❶。这保留了结构体在内存中的布局，如图 18-4 所示。\n\n![](img/fig18-4.jpg)\n\
  \n图 18-4：将结构体推入堆栈 描述\n\n列表 18-46 中的两个 `pushq` 指令将 `arg` 的拷贝以正确的布局推入堆栈。在调用者设置好其堆栈帧后，它可以在\
  \ `16(%rbp)` 访问 `arg`，这正是我们一直期望找到函数第一个堆栈参数的地方。\n\n如果结构体属于 `MEMORY` 类，我们总是会将将其推入堆栈。考虑列表\
  \ 18-47 中的结构体类型声明和函数声明。\n\n```c\nstruct pass_in_memory {\n    double w;\n    double\
  \ x;\n    int y;\n    long z;\n};\n\nvoid accept_struct(struct pass_in_memory arg);\n\
  ```\n\n列表 18-47：带有属于 MEMORY 类结构体参数的函数声明\n\n列表 18-48 展示了如何将存储在 `-32(%rbp)` 的结构体作为参数传递给\
  \ `accept_struct`。\n\n```\npushq   -8(%rbp)\npushq   -16(%rbp)\npushq   -24(%rbp)\n\
  pushq   -32 (%rbp)\ncall    accept_struct\n```\n\n列表 18-48：传递属于 MEMORY 类的结构体\n\n\
  在这种情况下，与列表 18-46 一样，我们通过从后到向前将其推入堆栈来维护结构体在内存中的布局。\n\n### 返回结构体\n\n如果结构体能够放入单个寄存器中，返回它是非常简单的。我们将属于\
  \ `INTEGER` 类的结构体返回 `RAX`，并将属于 `SSE` 类的结构体返回 `XMM0`。如果结构体大小在 8 到 16 字节之间，我们将用两个寄存器返回它。为了适应这些结构体，我们将指定另外两个寄存器：`RDX`\
  \ 和 `XMM1`。我们将在相应类的下一个寄存器中传输结构体的每个八字节。例如，如果结构体的第一部分属于 `SSE` 类而第二部分属于 `INTEGER` 类，我们将在\
  \ `XMM0` 中传输第一部分，在 `RAX` 中传输第二部分。如果两部分都属于 `SSE` 类，我们将在 `XMM0` 和 `XMM1` 中传输结构体；如果两部分都属于\
  \ `INTEGER` 类，我们将在 `RAX` 和 `RDX` 中传输它。\n\n如果结构体属于 `MEMORY` 类，情况会变得复杂。在这种情况下，调用者为返回值分配空间，并将该空间的地址通过\
  \ `RDI` 寄存器传递给调用者，就像第一个整数参数一样。这意味着实际的整数参数必须通过 `RSI` 传递，第二个通过 `RDX`，以此类推。要返回一个值，调用者将其复制到\
  \ `RDI` 指向的空间，并将指针复制到 `RAX`。让我们看看列表 18-49 中的示例。\n\n```c\nstruct large_struct {\n\
  \    long array[3];\n};\n\nstruct large_struct return_a_struct(long i) {\n    struct\
  \ large_struct callee_result = {0, 1, i};\n    return callee_result;\n}\n\nint main(void)\
  \ {\n  struct large_struct caller_result = return_a_struct(10);\n    --snip--\n\
  }\n```\n\n列表 18-49：调用在内存返回结构体的函数\n\n由于 `struct large_struct` 为 24 字节，我们将通过内存返回 `return_a_struct`\
  \ 函数的结果。在 `main` 中，我们调用 `return_a_struct`并将结果赋值给 `caller_result` ❶。假设 `main` 在 `-24(%rbp)`\
  \ 为 `caller_result` 留出了堆栈空间，列表 18-50 显示了如何实现此函数调用。\n\n```\nleaq    -24(%rbp), %rdi\n\
  movq    $10, %rsi\ncall    return_a_struct\n```\n\n列表 18-50：用汇编调用 return_a_struct\n\
  \n首先，我们通过 `RDI` 传递 `caller_result` 的地址（这将存储 `return_a_struct` 的结果）。然后通过下一个可用的参数传递寄存器\
  \ `RSI` 传递参数 `10`。最后，我们发出 `call` 指令。图 18-5 描述了执行 `call` 指令之前的程序状态。\n\n![](img/fig18-5.jpg)\n\
  \n图 18-5：调用 return_a_struct 之前的堆栈和寄存器状态\n\nRSP 和 RBP 像常一样指向当前堆栈帧的顶部和底部。RDI 指向 `caller_result`，它尚未初始化。RSI\
  \ 持有 `return_a_struct` 的第一个参数 `10`。\n\n\n\n\n\n注意，列表 18-50 并没有分配额外的栈空间来存储 `return_a_struct`\
  \ 的结果，它只是加载了 `caller_result` 变量的地址。这通常是可以的，但有一个例外：根据 ABI，存储返回值的内存“不能与通过此参数以外的任何名称对调用者可见的任何数据重叠”。例如，如果你需要实现函数调用\
  \ `var = foo(1, 2, &var)`，那么将 `var` 的地址在 `RDI` 中作为返回值的存储空间，同时在 `RCX` 中作为普通参数传递，将违反\
  \ ABI。相反，你需要分配额外的栈空间来存储 `foo` 的结果，并在函数返回后将结果拷贝到 `var` 中。我们不需要担心这种情况，因为在生成 TACKY\
  \ 代码期间，我们会为每个函数调用都生成一个新变量来存储结果。\n\n现在让我们来看列表 18-51，它用汇编实现了 `return_a_struct`。\n\n\
  ```\nreturn_a_struct:\n    pushq   %rbp\n    movq    %rsp, %rbp\n    subq    $32,\
  \ %rsp\n    movq    $0, -24(%rbp)\n    movq    $1, -16(%rbp)\n    movq    %rsi,\
  \ -8(%rbp)\n  ❶ movq    -24(%rbp), %r10\n    movq    %r10, (%rdi)\n    movq    -16(%rbp),\
  \ %r10\n    movq    %r10, 8(%rdi)\n    movq    -8(%rbp), %r10\n    movq    %r10,\
  \ 16(%rdi)\n  ❷ movq    %rdi, %rax\n    --snip--\n```\n\n*列表 18-51: 在内存中返回结构*\n\n\
  在函数开始处，我们设置了栈帧，为局部变量 `callee_result` 在 `-24(%rbp)` 处分配了栈空间并对其进行了初始化。返回 `result`\
  \ 的汇编代码从 ❶ 开始。首先，我们将 `result` 拷贝到 `RDI` 指向的内存位置，每次 8 字节；我们将前 8 字节拷贝到 `(%rdi)`，接下来的\
  \ 8 字节拷贝到 `8(%rdi)`，最后 8 字节拷贝到 `16(%rdi)`。然后，我们将 `RDI` 中的返回值指针拷贝到 `RAX` ❷。最后，我们执行函数尾部代码（此列表中省略了）。图\
  \ 18-6\n\n*图 18-6: 从 return_a_struct 返回之前的栈和寄存器状态* 描述\n\n调用者栈帧中的 `caller_result`\
  \ 变量现在持有函数的返回值，而 `RAX` 持有 `caller_result` 的地址。在这个示例中，`RDI` 寄存器也持有该地址，但 ABI 并不要求这样做。\n\
  \n我们已经涵盖了关于结构体调用约定所需的所有知识。现在我们准备好处理汇编生成阶段了！\n\n### 汇编生成\n\n此阶段将在两个方面发生变化。首先，我们需要生成汇编将整个结构从一个位置拷贝到另一个位置。`Copy`、`Load`、`Store`、`CopyTo`\
  \ 和 `FromOffset` 指令都可以传输结构。其次，我们将实现刚刚学的 System V 调用约定。我们将从对汇编进行一些修改开始。\n\n#### 扩展汇编\n\
  \n在列表 18-46 中，我们使用 `arg(%rip)` 来访问常量。汇编已经可以指定静态偏移，但不支持 RIP 相对偏移。我们将通过向 `Data` 添加偏移量来消除这一限制：\n\
  \n```\noperand = --snip | Data\n```\n\n我们还将引入两个新指令。首先，我们将添加左移指令 `shl`。该指令取立即值作为源，将内存地址或寄存器作为目的。它将目标向左移动源所指定的位数。例如：\n\
  \n```\nshl $8, %rax\n```\n\n如果执行此指令之前 `RAX` 中的值为 `0x8`，那么执行后它将变为 `0x800`。`shl` 指令将帮助我们将不规则的结构拷贝到寄存器中作为参数传递。由于我们无法直接访问寄存器内的每个字节，我们将使用\
  \ `shl` 将每个字节移动到到位。\n\n其次，我们将添加逻辑右移指令 `shr` 的双操作数形式。（我们在 13 中添加过单操作数形式，将其操作数向右移动\
  \ 1 位）。与 `shl` 类似，它将目标向右移动源指定的位数。它的作用与 `shl` 相似，帮助我们将大小不规则的结构从寄存器传输到内存中。\n\n*shl\
  \ 指令也有一个单操作数形式，我们不会使用它；它是我们已经熟悉的 shr 单操作数形式的对应项。这两个指令还有另一种我们不会使用的形式，即使用 CL 寄存器作为源操作数。*\n\
  \n我们将扩展 `binary_operator` 来表示 `shl` 和 `shr`：\n\n```\nbinary_operator = --snip |\
  \ Shl | ShrTwoOp\n```\n\n新的二进制 `shr` 指令获得了一个相当笨拙的名字 `ShrTwoOp`，以区分汇编 AST 中现有的 `Shr`\
  \ 指令。\n\n列表 18-52 定义了更新后的汇编 AST，其中这些更改已加粗显示。\n\n\n\n\n\n```\nprogram = Program(top_level*)\n\
  assembly_type = Byte | Longword | Quadword | Double | ByteArray(int size, int alignment)\n\
  top_level = Function(identifier name, bool global, instruction* instructions)\n\
  \          | StaticVariable(identifier name, bool global, int alignment, static_init*\
  \ init_list)\n          | StaticConstant(identifier name, int alignment, static_init\
  \ init)\ninstruction = Mov(assembly_type, operand src, operand dst)\n          \
  \  | Movsx(assembly_type src_type, assembly_type dst_type, operand src, operand\
  \ dst)\n            | MovZeroExtend(assembly_type src_type, assembly_type dst_type,\n\
  \                            operand src, operand dst)\n            | Lea(operand\
  \ src, operand dst)\n            | Cvttsd2si(assembly_type dst_type, operand src,\
  \ operand dst)\n            | Cvtsi2sd(assembly_type src_type, operand src, operand\
  \ dst)\n            | Unary(unary_operator, assembly_type, operand)\n          \
  \  | Binary(binary_operator, assembly_type, operand, operand)\n            | Cmp(assembly_type,\
  \ operand, operand)\n            | Idiv(assembly_type, operand)\n            | Div(assembly_type,\
  \ operand)\n            | Cdq(assembly_type)\n            | Jmp(identifier)\n  \
  \          | JmpCC(cond_code, identifier)\n            | SetCC(cond_code, operand)\n\
  \            | Label(identifier)\n            | Push(operand)\n            | Call(identifier)\n\
  \            | Ret\nunary_operator = Neg | Not | Shr\nbinary_operator = Add | Sub\
  \ | Mult | DivDouble | And | Or | Xor | Shl | ShrTwoOp\noperand = Imm(int) | Reg(reg)\
  \ | Pseudo(identifier) | Memory(reg, int) | Data(identifier, int)\n        | PseudoMem(identifier,\
  \ int) | Indexed(reg base, reg index, int scale)\ncond_code = E | NE | G | GE |\
  \ L | LE | A | AE | B | BE\nreg = AX | CX | DX | DI | SI | R8 | R9 | R10 | R11 |\
  \ SP | BP\n    | XMM0 | XMM1 | XMM2 | XMM3 | XMM4 | XMM5 | XMM6 | XMM7 | XMM14 |\
  \ XMM15\n```\n\n列表 18-52：带有静态操作数偏移量和位移指令指令的汇编 AST\n\n将类型和 TACKY 操作数转换为汇编非常简单。结构类型（如数组类型）会被转换为\
  \ `ByteArray` 汇编类型。要将结构类型转换为汇编，你需要在类型表中查找其大小和对齐方式。我们将像处理数组一样，将结构体类型的 TACKY 变量转换为\
  \ `PseudoMem` 汇编操作数。我们始终将数组和结构体存储在内存中，而不是寄存器中，即使在我们在 第三部分 中实现了寄存器分配也是如此。\n\n你遇到的一些\
  \ TACKY 变量可能具有不完整的结构类型。（记住，声明一个不完全类型的 `extern` 变量并获取其地址是合法的，但定义它或以任何其他方式使用它是非法的。）将这些变量转换为\
  \ `PseudoMem` 操作数，就像处理其他结构类型变量一样。在将它们添加到后端符号表时，你可以给这些变量分配一个虚拟汇编类型；该虚拟类型永远不会被使用。\n\
  \n接下来，让我们处理 `Copy`、`Load`、`Store`、`CopyToOffset` 和 `CopyFromOffset` 指令。然后，我们将处理函数调用。\n\
  \n### 复制结构体\n\n将结构体复制到新位置不需要考虑其成员的类型或偏移量；你只需要复制正确数量的字节。为了减少所需的 `mov` 指令数量，每次复制 8\
  \ 字节，直到剩余字节少于 8 字节。然后每次复制 4 字节。最后，当剩余字节少于 4 字节时，每次复制 1 字节。（x64 汇编中也有 2 字节的 `mov`\
  \ 指令，但我们的汇编 AST 不支持它）。例如，如果 `a` 和 `b` 是 20 字节的结构体，你应该将\n\n翻译为列表 18-53 中的汇编代码：\n\n\
  ```\nMov(\"a\"), Var(\"b\")\n```\n\n```\nMov(Quadword, PseudoMem(\"a\", 0), PseudoMem(\"\
  b\", 0))\nMov(Quadword, PseudoMem(\"a\", 8), PseudoMem(\"b\", 8))\nMov(Longword,\
  \ PseudoMem(\"a\", 16), PseudoMem(\"b\", 16))\n```\n\n列表 18-53：为非标量值实现 `Copy`\n\n\
  第一条 `mov` 指令将 `a` 的前 8 字节复制到 `b`；第二条 `mov` 指令将 `a` 的后续 8 字节复制到 `b` 对应的偏移处，最后一条指令复制剩余字节。这些\
  \ `mov` 指令是有效的。\n\n你可以使用相同的方法来翻译 `Load` 和 `Store` 指令。例如，如果 `y` 是一个 6 字节的结构体，你将其翻译为列表\
  \ 18-54：\n\n```\nLoad(\"ptr\"), Var(\"y\")\n```\n\n```\nMov(Quadword, Reg(\"AX\"\
  ))\nMov(Longword, Memory(\"AX\", 0), PseudoMem(\"y\", 0))\nMov(Byte, Memory(\"AX\"\
  , 4), PseudoMem(\"y\", 4))\nMov(Byte, Memory(\"AX\", 5), PseudoMem(\"y\", 5))\n\
  ```\n\n列表 18-54：为非标量值实现 `Load`\n\n第一条指令将指针复制到 `AX` 寄存器。随后的每条 `mov` 指令将从偏移处存储的数据块到\
  \ `y` 对应的偏移处。\n\n你也可以用一系列 `mov` 指令为非标量值实现 `CopyToOffset`；唯一的区别是你会为每个目标地址加上指定的偏移量。再次用\
  \ 6 字节结构体 `y` 举例，你将其翻译为列表 18-55：\n\n```\nCopyToOffset(src=\"y\"), dst=\"z\", offset=8)\n\
  ```\n\n```\nMov(Longword, PseudoMem(\"y\", 0), PseudoMem(\"z\", 8))\nMov(Byte, PseudoMem(\"\
  y\", 4), PseudoMem(\"z\", 12))\nMov(Byte, PseudoMem(\"y\", 5), PseudoMem(\"z\",\
  \ 13))\n```\n\n列表 18-55：为非标量值实现 `CopyToOffset`\n\n最后，你将需要实现新的 `CopyFromOffset` 指令。与其它复制数据的\
  \ TACKY 指令一样，它接受标量和非标量操作数。我不会详细讲解这条指令；你应该基本上以处理 `CopyToOffset` 相同的方式处理它。\n\n\n\n\
  \n\n我建议编写一个辅助函数，我将其命名为 `copy_bytes`，它可以生成汇编指令，将任意数量的字节从一个 `Memory` 或 `PseudoMem`\
  \ 操作数拷贝到另一个。你可以使用这个辅助函数来实现所有五个 TACKY 拷贝指令。当你需要将内存中的结构体作为参数和返回值时，它将再次派上用场。\n\n一旦你实现了\
  \ `CopyFromOffset` 并扩展了其他拷贝指令以支持非标量值，就可以开始处理函数调用了。\n\n### 在函数调用中使用结构体\n\n由于传递和返回结构的规则非常复杂，在深入伪代码之前，让我们先谈谈我们的整体策略。首先，我们将编写一个函数来对结构类型的每个八字节进行分类。然后，我们将扩展\
  \ `classify_parameters` 辅助函数（该函数我们在第 13 章中引入，用于帮助调用者和被调用者处理参数传递）。记住，该函数返回三个列表：通过通用寄存器传递的操作数、通过\
  \ XMM 寄存器传递的操作数，以及通过堆栈传递的操作数。一旦我们更新了这个函数，这些列表可能同时包含标量值和结构值的八字节。\n\n接下来，我们将引入另一个辅助函数\
  \ `classify_return_value`，以类似的方式分解返回值。它将返回一个通过通用寄存器返回的操作数列表、一个通过 XMM 寄存器返回的操作数列表，以及一个指示返回值是否在内存中传递的布尔标志。只有当这两个列表都为空时，该标志才为\
  \ `True`。\n\n当 `classify_return_value` 处理标量值时，它将返回一个空列表、一个包含单个元素的列表以及一个 `False`\
  \ 标志。当它处理结构体时，它可能会产生更有趣的结果。它的主要目的是将标量和结构体返回值“格式化”成相同的形状，以便我们以统一的方式处理它们。\n\n一旦这些辅助函数就绪，我们将更新将\
  \ `FunCall` TACKY 指令转换为汇编的方法。在大多数情况下，我们可以像前面的章节中那样传递参数。我们将从 `classify_parameters`\
  \ 获取的每个操作数拷贝到适当的寄存器中，或将其推入堆栈，而无需担心它是标量值还是结构体的一部分。只有少数细节会发生。首先，我们需要考虑到如果 `RDI` 持有预留给返回值的空间地址，则它可能不可用。我们还需要传递无法通过单个\
  \ `mov` 指令传输的不规则大小的八字节。我们将编写一个新的辅助函数将这些八字节移动到寄存器中。\n\n获取函数的返回值将需要较大的更改。我们将使用 `classify_return_value`\
  \ 来确定可以在哪里找到返回值的每个部分，然后从适当的寄存器或内存将每个部分拷贝到最终目的地。这需要另一个辅助函数来拷贝不规则大小的八字节。\n\n最后，我们将处理被调用者侧的问题。在这里，与调用者侧一样，我们处理参数的方式略有变化，但处理返回值的方式会发生一些变化。我们将再次使用\
  \ `classify_return_value` 来确定将返回值的每个部分放在哪里。\n\n### 结构类型的分类\n\n我们将从一个对结构类型分类的辅助函数开始。我们将使用列表\
  \ 18-56 定义的 `class` 结构来表示我们讨论的三个类别。\n\n```\nclass = MEMORY | SSE\n```\n\n分类函数将返回一个\
  \ `class` 元素列表，被分类结构中的每个八字节对应一个元素。为了对结构体进行分类，我们首先考虑它的大小，然后查看其成员的类型。列表 18-57 给出了该过程的伪代码。\n\
  \n```\nclassify_structure(StructEntry(alignment, size, members)):\n    if size >\
  \ 16:\n        result = []\n        while size > 0:\n            result.append(MEMORY)\n\
  \            size -= 8\n        return result\n  ❶ scalar_types = <flatten list\
  \ of member types>\n  ❷ if size > 8:\n        if first and last type in scalar_types\
  \ are Double:\n            return [SSE, SSE]\n        if first type in scalar_types\
  \ is Double:\n            return [SSE, INTEGER]\n        if last type in scalar_types\
  \ is Double:\n            return [INTEGER, SSE]\n        return [INTEGER, INTEGER]\n\
  \    else if first type in scalar_types is Double:\n      ❸ return [SSE]\n    else:\n\
  \      ❹ return [INTEGER]\n```\n\n**列表 18-57：结构体类型的分类**\n\n`classify_structure`\
  \ 函数从类型表获取结构体定义。如果结构体大于 16 字节，它必须在内存中传递，因此我们返回一个足够的 `MEMORY` 元素列表以覆盖整个结构体。例如，如果结构体的大小为\
  \ 17 字节，`classify_structure` 应该返回 `[MEMORY, MEMORY, MEMORY]`。\n\n否则，结构的分类取决于其成员类型。我们构建一个包含结构包含的每个标量类型的列表，包括嵌套值的类型\
  \ ❶。假设结构体包含两个成员：一个 `int *` 和一个 `char[3]`。生成的 `scalar_types` 列表将是 `[Pointer(Int),\
  \ Char, Char, Char]`。\n\n如果结构体的大小在 8 到 16 字节之间，我们返回一个包含两个类别的列表 ❷。由于 `double`的大小和对齐方式均为\
  \ 8 字节，任何出现在此类大小结构体中的 `double` 都必须完全占据第一个或第二个八字节。利用这一事实，我们只检查 `scalar_types` 的第一个和最后一个元素。如果第一个元素是\
  \ `Double`，则第一个八字节必须属于 SSE 类；否则，它必须属于 INTEGER 类。同样，只有当 `scalar_types` 的最后一个元素是 `Double`\
  \ 时，第二个八字节才属于 SSE 类。\n\n\n\n\n最后，我们对 8 字节或更小的结构进行分类。如果一个这种尺寸结构包含的第一个（也是唯一的）标量类型是\
  \ `Double` ❸，那么它属于 `SSE` 类。否则，它属于 `INTEGER` 类 ❹。\n\n如果你愿意，可以通过缓存结果来优化列表 18-57 中的代码。你需要维护一个从结构标签到其分类的映射。当你第一次对特定结构类型进行分类时，将结果添加到此映射中。然后，如果你需要再次对该结构类型进行分类，只需检索结果，而无需重新计算。\n\
  \n### 分类参数\n\n接下来，我们将扩展 `classify_parameters` 函数。该函数根据每个参数是通过通用的通用寄存器、`XMM` 寄存器还是栈来传递的，将参数或参数列表分为三类。现在，当它处理结构类型的值时，它将该值拆分为多个\
  \ 8 字节的字节块，并将每个块添加到正确的列表中。列表 18-58 重现了来自列表 13-29 的 `classify_parameters` 定义，并加粗了更改部分。\n\
  \n```python\nclassify_parameters(values, return_in_memory):\n    int_reg_args =\
  \ []\n    double_reg_args = []\n    stack_args = []\n\n    if return_in_memory:\n\
  \        int_regs_available = 5\n    else:\n        int_regs_available = 6\n\n \
  \   for v in values:\n        operand = convert_val(v)\n        t = assembly_type_of(v)\n\
  \        typed_operand = (t, operand)\n\n        if t == Double:\n            --snip--\n\
  \        else if t is scalar:\n            if length(int_reg_args) < int_regs_available:\n\
  \                int_reg_args.append(typed_operand)\n            else:\n       \
  \         stack_args.append(typed_operand)\n\n        else:\n            // v 是一个结构\n\
  \            // 按类将其拆分为 8 字节块\n            classes = classify_structure(<struct\
  \ definition for v>) ❶\n            use_stack = True\n            struct_size =\
  \ t.size\n            if classes[0] != MEMORY: ❷\n\n                // 尝试分配寄存器\n\
  \                tentative_ints = []\n                tentative_doubles = []\n \
  \               offset = 0\n                for class in classes:\n            \
  \        operand = PseudoMem(<name of v>, offset) ❸\n                    if class\
  \ == SSE:\n                        tentative_doubles.append(operand)\n         \
  \           else:\n                        eightbyte_type = get_eightbyte_type(offset,\
  \ struct_size) ❹\n                        tentative_ints.append((eightbyte_type,\
  \ operand))\n                    offset += 8\n\n                // 如果有足够的空闲寄存器，则完成分配\n\
  \                if ((length(tentative_doubles) + length(double_reg_args)) <= 8\
  \ and\n                    (length(tentative_ints) + length(int_reg_args)) <= int_regs_available):\
  \ ❺\n                    double_reg_args.append_all(tentative_doubles)\n       \
  \             int_reg_args.append_all(tentative_ints)\n                    use_stack\
  \ = False\n\n            if use_stack:\n                // 将结构的每个 8 字节块添加到 stack_args\n\
  \                offset = 0\n                for class in classes:\n           \
  \         operand = PseudoMem(<name of v>, offset)\n                    eightbyte_type\
  \ = get_eightbyte_type(offset, struct_size)\n                    stack_args.append((eightbyte_type,\
  \ operand)) ❻\n                    offset += 8\n\n    return (int_reg_args, double_reg_args,\
  \ stack_args)\n```\n\n*列表 18-58: 扩展 `classify_parameters` 以支持结构*\n\n该函数的第一个更改是新增的布尔参数\
  \ `return_in_memory`。正如其名称所示，它表示函数的返回值是否在内存中传递。如果是，则该内存地址将通过 `RDI` 寄存器传递，导致用于其他参数的通用寄存器少一个。我们将相应地设置\
  \ `int_regs_available`。然后，当我们处理整数或指针类型的参数时，我们将使用 `int_regs_available` 而不是常量 `6`\
  \ 作为可用通用寄存器的数量。（我们处理 `double` 的方式与在第 13 章中完全相同。）\n\n现在我们到了最有趣的部分：结构处理。我们将从调用 `classify_structure`\
  \ 开始 ❶。然后，我们将检查结构的前 8 字节块是否在 `MEMORY` 中 ❷。如果是，结构的其余部分也必须是。如果不是，我们将尝试根据其类将每个 8 字节块分配到寄存器\
  \ ❸，进入两个列表之一：`tentative_doubles` 或 `tentative_ints`。我们知道 `v` 是一个变量而不是常量，因为存在聚合常量；该变量的名称将是\
  \ `PseudoMem`。\n\n当我们将一个 8 字节块添加到 `tentative_ints` 时，我们需要确定将其与之关联的汇编类型。大多数 8 字节块恰好是\
  \ 8 字节长，因此我们将它们与 `Quadword` 类型关联。但结构中的最后一个 8 字节块可能更短。我们将使用辅助函数 `get_eightbyte_type`\
  \ ❹ 来查找每个 8 字节块的类型，稍后会介绍该函数。该函数接受两个参数：8 字节块的 `offset` 和结构的总大小。\n\n当我们将一个 8 字节块添加到\
  \ `tentative_ints` 时...（此处为翻译逻辑重复，已衔接）\n\n一旦我们将整个结构划分为两个临时列表后，我们将检查是否有足够的寄存器来容纳这两个列表\
  \ ❺。如果有，我们将两个列表添加到相应的非临时列表中。如果我们没有足够的寄存器，或者结构属于 `MEMORY` 类，则将每个 8 字节块添加到 `stack_args`\
  \ ❻。我们使用 `get_eightbyte_type` 来确定在栈上传递的每个 8 字节块的类型。\n\n现在来看 `get_eightbyte_type`，它定义在列表\
  \ 18-59 中。\n\n```python\nget_eightbyte_type(offset, struct_size):\n  ❶ bytes_from_end\
  \ = struct_size - offset\n    if bytes_from_end >= 8:\n        return Quadword\n\
  \    if bytes_from_end == 4:\n        return Longword\n    if bytes_from_end ==\
  \ 1:\n        return Byte\n  ❷ return ByteArray(bytes_from_end, 8)\n```\n\n*列表 18-59:\
  \ 将 8 字节块与 `assembly_type` 关联*\n\n\n\n\n这里的目标是确定在将此八字节（eightbyte）移动到寄存器或栈上时使用何种操作数大小。首先，我们计算从该八字节起始位置到整个结构结束之间的字节数\
  \ ❶。如果结构中剩余字节数超过 8 个，则说明这不是最后一个八字节，因此我们使用 `Quadword` 类型。如果这个八字节的长度恰好是 8 字节、4 字节或\
  \ 1 字节，我们则分别使用 `Quadword`、`Longword` 或 `Byte` 类型。\n\n否则，该八字节的大小是不规则的；它不是适用于汇编指令的有效操作数大小。在这种情况下，我们使用\
  \ `ByteArray` 类型来记录该八字节的精确字节数 ❷。（此 `ByteArray` 中的对齐值是一个占位值；我们稍后不需要它。）我们无法通过单个 `Mov`\
  \ 指令安全地传输大小不规则的八字节。正如您在第 9 章中所学到的，读取内存中值的结尾之外——例如，通过 8 字节的 `pushq` 指令推送 4 字节的值——可能会触发内存访问违规。基于同样的原理，使用\
  \ 8 字节的 `movq` 指令传输 5、6 或 7 字节的操作数，或使用 4 字节的 `movl` 指令传输 3 字节的操作数是不安全的。稍后我们将查看如何传输大小不规则的八字节。\n\
  \n注意，`get_eightbyte_type` 不考虑八字节的类别；对于任何全长的八字节，它都会返回 `Quadword`，即使它属于 SSE 类。这是正确的，因为我们使用\
  \ `get_eightbyte_type` 仅是为了找到我们要在通用寄存器或栈上传输的值类型。当我们将结构的 8 字节推入栈中时，我们并不关心这些字节包含的是浮点值还是整数。\n\
  \n### 分类返回值\n\n接下来，我们将编写一个类似的辅助函数来对返回值进行分类。这个函数比 `classify_parameters` 更简单。我们只需要处理一个值，而不是整个列表，因此不需要担心寄存器用尽。如果值在内存中返回，我们也不需要像在\
  \ `classify_parameters` 中那样将该值拆分为八字节。列表 18-60 显示了 `classify_return_value` 辅助函数的伪代码。\n\
  \n```\nclassify_return_value(retval):\n\n    t = assembly_type_of(retval)\n\n  \
  \  if t == Double:\n        operand = convert_val(retval)\n      ❶ return ([], [operand],\
  \ False)\n    else if t is scalar:\n        typed_operand = (t, convert_val(retval))\n\
  \      ❷ return ([typed_operand], [], False)\n    else:\n        classes = classify_structure(<struct\
  \ definition for retval>)\n        struct_size = t.size\n        if classes[0] ==\
  \ MEMORY:\n            // 整个结构在内存中返回，\n            // 不在寄存器中\n          ❸ return\
  \ ([], [], True)\n        else:\n            // 结构在寄存器中返回；\n            // 按类别将其分为八字节\n\
  \            int_retvals = []\n            double_retvals = []\n            offset\
  \ = 0\n            for class in classes:\n                operand = PseudoMem(<name\
  \ of retval>, offset)\n              ❹ match class with\n                | SSE ->\n\
  \                    double_retvals.append(operand)\n                | INTEGER ->\n\
  \                    eightbyte_type = get_eightbyte_type(offset, struct_size)\n\
  \                    int_retvals.append((eightbyte_type, operand))\n           \
  \     | MEMORY -> fail(\"Internal error\")\n                offset += 8\n      \
  \      return (int_retvals, double_retvals, False)\n```\n\n*列表 18-60: 分类返回值*\n\n\
  如果返回值是 `double`，我们两个列表中的第一个（包含在通用寄存器返回的操作数）将为空。第二个（存放在 XMM 寄存器返回的操作数）将包含该返回值。表示值在内存中返回的标志位将为\
  \ `False` ❶。如果返回值是其他标量类型，我们将其添加到在通用寄存器返回的操作数列表中，并带上其类型。XMM 寄存器中的操作数列表将为空，且标志位仍为\
  \ `False` ❷。\n\n否则，返回值必须是一个结构。我们将使用 `classify_structure` 查找它的类别，然后检查它是否属于 `MEMORY`\
  \ 类。如果是，我们将返回两个空列表（表示寄存器中不会返回任何内容）以及一个 `True` 标志位（表示返回值将在内存中传递 ❸）。\n\n如果该结构不在 `MEMORY`\
  \ 类中，它将在寄存器中返回。我们将每个八字节转换为 `PseudoMem` 操作数，并根据其类别 ❹ 将添加到 `double_retvals` 或 `int_retvals`\
  \ 中。在这里，与 `classify_parameters` 中一样，我们将使用 `get_eightbyte_type` 来查找 `int_retvals`\
  \ 中每个操作数的汇编类型。最后，我们将返回这两个列表以及一个 `False` 标志位。\n\n### 实现 FunCall\n\n接下来，让我们更新在汇编中实现函数调用的方式。列表\
  \ 18-61 重现了来自列表 13-31 的 `convert_function_call` 的定义，并对更改部分进行了加粗，省略了部分未更改的代码。\n\n\
  \n\n\n```python\nconvert_function_call(FunCall(fun_name, args, dst)):\n    int_registers\
  \ = [DI, SI, DX, CX, R8, R9]\n    double_registers = [XMM0, XMM1, XMM2, XMM3, XMM4,\
  \ XMM5, XMM6, XMM7]\n\n    return_in_memory = False\n    int_dests = []\n    double_dests\
  \ = []\n    reg_index = 0\n\n    // classify return value\n    if dst is not null:\n\
  \        int_dests, double_dests, return_in_memory = classify_return_value(dst)\
  \ ❶\n\n    if return_in_memory:\n        dst_operand = convert_val(dst)\n      \
  \  emit(Lea(dst_operand, Reg(DI))) ❷\n        reg_index = 1\n\n    // classify arguments\n\
  \    int_args, double_args, stack_args = classify_parameters(args, return_in_memory)\n\
  \n    --snip--\n\n    // pass args in registers\n    for (assembly_type, assembly_arg)\
  \ in int_args:\n        r = int_registers[reg_index]\n        if assembly_type is\
  \ ByteArray(size, alignment):\n            copy_bytes_to_reg(assembly_arg, r, size)\
  \ ❸\n        else:\n            emit(Mov(assembly_type, assembly_arg, Reg(r)))\n\
  \        reg_index += 1\n\n    --snip--\n\n    // pass args on stack\n    for (assembly_type,\
  \ assembly_arg) in reverse(stack_args):\n        if assembly_type is ByteArray(size,\
  \ alignment):\n            emit(Binary(Sub, Quadword, Imm(8), Reg(SP))) ❹\n    \
  \        copy_bytes(from=assembly_arg, to=Memory(SP, 0), count=size)\n        else\
  \ if (assembly_arg is a Reg or Imm operand\n                 or assembly_type ==\
  \ Quadword\n                 or assembly_type == Double):\n            emit(Push(assembly_arg))\n\
  \        else:\n            emit(Mov(assembly_type, assembly_arg, Reg(AX)))\n  \
  \          emit(Push(Reg(AX)))\n\n    --snip--\n\n    // retrieve return value\n\
  \    if (dst is not null) and (not return_in_memory):\n        int_return_registers\
  \ = [AX, DX]\n        double_return_registers = [XMM0, XMM1]\n\n        // retrieve\
  \ values returned in general-purpose registers\n        reg_index = 0\n        for\
  \ (t, op) in int_dests:\n           r = int_return_registers[reg_index]\n      \
  \     if t is ByteArray(size, alignment):\n               copy_bytes_from_reg(r,\
  \ op, size) ❺\n           else:\n               emit(Mov(t, Reg(r), op)) ❻\n   \
  \        reg_index += 1\n\n        // retrieve values returned in XMM registers\n\
  \        reg_index = 0\n        for op in double_dests:\n            r = double_return_registers[reg_index]\n\
  \            emit(Mov(Double, Reg(r), op)) ❼\n            reg_index += 1\n```\n\n\
  列表 18-61: 函数调用中的支持结构\n\n我们首先调用 `classify_return_value`（除非函数调用没有返回值，因为其返回类型为 `void`）❶。如果我们发现返回值将在内存中传递，则会将\
  \ `dst` 转换为汇编操作数，然后发射一条指令将其地址加载到 `RDI` 中❷。我们还增了 `reg_index`，以便我们把第一个整数参数放在 `RSI`\
  \ 而不是 `RDI` 中。\n\n接下来，我们调用 `classify_parameters`，并传入了新的 `return_in_memory` 标志。然后，我们调整堆栈指针（我省略了这一步，因为它与之前的章节相同）。\n\
  \n随后，我们在通用寄存器中传递参数。如果一个参数具有 `ByteArray` 类型，它的长度并不恰好是 1、4 或 8 字节，因此将其传输到寄存器将需要多条指令。我们使用\
  \ `copy_bytes_to_reg` 辅助函数发射这些指令 ❸，我们稍后会查看它。如果参数具有任何其他类型，我们像在之前的章节一样使用单条 `Mov` 指令进行传输。在\
  \ XMM 寄存器中传递参数的方式不会改变，因此我删除了那一步。\n\n下一步是在栈上传递参数。传递类型为 `Byte`、`Longword`、`Quadword`\
  \ 或 `Double` 操作数的方式不会改变。要传递 `ByteArray` 类型的不规则操作数，我们首先需要从 `RSP` 减去 8 字节，为该操作数分配栈槽\
  \ ❹。（注意，ABI 为结构体参数的每个 8 字节预留了整个 8 字节栈槽，即使实际的 8 字节小于该值。）为了将操作数复制到该栈槽，我们使用已经编写的 `copy_bytes`\
  \ 辅助函数。假设 `x` 是全局变量且其大小为 3。我们将通过这些指令将其作为参数传递：\n\n```\nsubq $8, %rsp\nmovb x(%rip),\
  \ %rsp\nmovb x+1(%rip), %rsp\n```\n这些指令是无效的，因为两个操作数都在内存中；我们将重写它们。接下来，发射 `call` 指令并将栈指针恢复到原始位置。我删除了这些步骤，因为它们与之前的章节相同。\n\
  \n最后，我们将返回值拷贝到目标。如果返回值是在内存中传输，我们什么都不做；否则，我们遍历 `classify_return_value` 返回的两个列表——首先是\
  \ `int_dests`，然后是 `double_dests`——从相应的寄存器检索每个操作数。从通用寄存器检索不规则大小的八字节，我们使用 `copy_bytes_from_reg`\
  \ 辅助函数 ❺，我们稍后会定义它。它是我们传递参数时使用的 `copy_bytes_to_reg` 的对应项。我们发射一条 `Mov` 指令从通用寄存器检索\
  \ `Byte`、`Longword` 或 `Quadword` 值 ❻，或从 XMM 寄存器检索 `Double` 值 ❼。\n\n将返回值拷贝到 `dst`\
  \ 的代码适用于 `dst` 为结构体或标量对象。如果是结构，`int_dests` 和 `double_dests` 中的每项都是 `dst` 的一个八字节，我们将从相应的返回寄存器填充它。如果\
  \ `dst` 是标量，`int_dests` 或 `double_dests` 将只有一个元素，而另一个列表为空。在这种情况下，此代码将发射单条 `Mov`\
  \ 指令将返回值从 `RAX` 或 `XMM0` 传输到其目标。\n\n##### 在寄存器中传输不规则结构\n\n\n\n\n\n我们仍然实现 `copy_bytes_to_reg`\
  \ 和 `copy_bytes_from_reg`，这两个函数用于将不规则大小的字节在通用寄存器与其之间进行拷贝。这比在内存两个位置之间拷贝（正如我们在 `copy_bytes`\
  \ 中做的那样）要复杂，因为我们无法直接访问通用寄存器中的每一个字节。我们可以通过适当的 1 字节别名（如 `AL` 或 `DIL`）访问通用寄存器的最低位字节，但无法单独访问它的其他字节。（每个寄存器的次低字节也有它自己的别名——例如，`AH`\
  \ 是 `RAX` 的次低字节——但我们的汇编 AST 不支持这些别名。即使支持，我们仍然无法访问其他 6 个字节。）\n\n我们将使用新的位移指令来绕过这个限制。让我们重新回顾上一个例子中的\
  \ 3 字节全局变量 `x`。如果我们需要将 `x` 拷贝到 `RDI`，将发出以下指令：\n\n```\nmovb    x+2(%rip), %dil\n\
  shlq    $8, %rdi\nmovb    x+1(%rip), %dil\nshlq    $8, %rdi\nmovb    x(%rip), %dil\n\
  ```\n\n我们首先将 `x` 的*最后一个*字节拷贝到 `RDI` 的最低位字节（其别名为 `DIL`）。然后，我们发出一个 `shl` 指令将 `RDI`\
  \ 向左移动 1 字节。这会将刚刚拷贝的字节移动到 `RDI` 的次低字节，并清空 `DIL`。接下来，我们将 `x` 的中间字节拷贝到 `DIL` 并再次另一个\
  \ `shl` 指令。此时，`x` 的最后 2 个字节已经处于寄存器中的正确位置，因此我们只需将 `x` 的第一个字节移动到 `DIL` 即可完成。图 18-7\
  \ 显示了如果 `x` 包含字节 `0x1`、`0x2` 和 `0x3`，且 `RDI` 的初始值为 0，每条指令执行后 `RDI` 的内容（十六进制形式）。\n\
  \n![](img/fig18-7.jpg)\n\n图 18-7: 逐字节将结构传输到寄存器 描述\n\n不要被这里的字节顺序搞乱了：因为我们的系统是小端序，当我们从\
  \ `RDI` 将值拷贝到内存时，`RDI` 中的最低有效（右侧）字节对应最低内存地址，反之亦然。这意味着——虽然有点违反直觉——将值向*左*移动会将每个字节移动到对应于*较高*内存地址的位置。如果在将此结构拷贝到\
  \ `RDI` 后，我们发出指令：\n\n```\nmovl    %edi, -4(%rbp)\n```\n\n那么内存的内容将如图 18-8 所示。\n\n\
  ![](img/fig18-8.jpg)\n\n图 18-8: 从寄存器拷贝结构后内存的内容 描述\n\n现在结构在内存中已按正确的顺序排列好。（这条 `movl`\
  \ 指令还会写入结构末尾之后的 1 字节内存，如果你没有将该字节用于其他地方，那是没问题的。我们将一次 1 字节地在寄存器进传输不规则大小的结构，但我们与之交互的其他编译单元中的代码在安全时以\
  \ 4 字节和 8 字节为块进行传输。）\n\n这就是 `copy_bytes_to_reg` 的基本思想；现在让我们来实现它。列表 18-62 提供了伪代码。\n\
  \n```\ncopy_bytes_to_reg(src_op, dst_reg, byte_count):\n    offset = byte_count\
  \ - 1\n    while offset >= 0:\n        src_byte = add_offset(src_op, offset)\n \
  \       emit(Mov(src_byte, dst_reg))\n        if offset > 0:\n            emit(Binary(Shl,\
  \ Quadword, Imm(8), Reg(dst_reg)))\n        offset -= 1\n```\n\n列表 18-62: 生成拷贝字节到寄存器的指令\n\
  \n`copy_bytes_from_reg(src_reg, dst_op, byte_count)` 将 `byte_count` 个字节从 `src_reg`\
  \ 拷贝。因为 `dst_op` 是内存，我们反向遍历字节：从它的最后一个字节开始，到零结束。我们使用一个简单的辅助函数 `add_offset` 来构建汇编操作数。我不会给你这个函数的伪代码，因为它只是加上指定的偏移量。例如，如果\
  \ `src_op` 是 `x`，`add_offset(src_op, 2)` 应该返回结果。\n\n一旦我们有了当前字节的汇编操作数，我们就发射一个 `Mov`\
  \ 指令将该字节拷贝到目标寄存器。接下来，在除最后一次迭代外的所有中，发射一个 `Shl` 指令将整个寄存器右移 8 位。然后我们减小偏移量并处理下一个字节。\n\
  \n要从寄存器拷贝字节，我们反向执行整个过程。以下是我们如何将 3 个字节从 `RDI` 拷贝到栈上的 `-4(%rbp)`：\n\n```\nmovb   \
  \ %dil, -4(%rbp)\nshrq    $8, %rdi\nmovb    %dil, -3(%rbp)\nshrq    $8, %rdi\nmovb\
  \    %dil, -2(%rbp)\n```\n\n首先，我们将 `RDI` 的最低字节拷贝到内存。然后，我们将 `RDI` 向右移动 1 字节，使得 `DIL`\
  \ 现在包含结构的次低字节。我们重复这个过程直到传输完所有字节。列表 18-63 提供了伪代码。\n\n```\ncopy_bytes_from_reg(src_reg,\
  \ dst_op, byte_count):\n    offset = 0\n    while offset < byte_count:\n       \
  \ dst_byte = add_offset(dst_op, offset)\n        emit(Mov(Byte, Reg(src_reg), dst_byte))\n\
  \        if offset < byte_count - 1:\n            emit(Binary(ShrTwoOp, Quadword,\
  \ Imm(8), Reg(src_reg)))\n        offset += 1\n```\n\n列表 18-63: 生成从寄存器拷贝字节到内存的指令\n\
  \n\n\n\n\n正如 Listing 18-62 所示，我们可以假设 `dst_op` 是一个带有偏移量的内存操作数。我们从字节 0 开始顺序遍历 `dst_op`\
  \ 的字节。在每次迭代中，我们将 `src_reg` 的最低位字节拷贝到 `dst_op` 的当前字节中。然后，在除最后一次之外，我们将 `src_reg` 向右移位\
  \ 8 位。\n\n有了这两个辅助函数，我们就完成了对函数调用的实现。接下来，我们将处理调用者（callee）端。\n\n### 设置函数参数\n\n在函数开始时，我们将每个参数拷贝到该函数的栈帧中。现在我们也将拷贝结构体类型的参数。主要的之处在于\
  \ `RDI` 可能持有一个指向返回值目的地的指针，而不是普通的参数。让我们重新回到 Listing 13-30 中的 `set_up_parameters`，看看发生了什么变化。Listing\
  \ 18-64 给出了 `set_up_parameters` 的新定义，并将本章的更改进行了**加粗**处理。\n\n```\nset_up_parameters(parameters,\
  \ return_in_memory):\n\n    // 分类\n    int_reg_params, double_reg_params, stack_params\
  \ = classify_parameters(parameters,\n                                          \
  \     return_in_memory)\n\n    // 从通用寄存器拷贝参数\n    int_regs = [DI, SI, CX, R8, R9]\n\
  \    reg_index = 0\n\n    if return_in_memory:\n        emit(Mov(Quadword, Reg(DI),\
  \ Memory(BP, -8)))\n        reg_index = 1\n\n    for (param_type, param) in int_reg_params:\n\
  \        r = int_regs[reg_index]\n        if param_type is ByteArray(size, alignment):\n\
  \            copy_bytes_from_reg(r, param)\n        else:\n            emit(Mov(param_type,\
  \ Reg(r)))\n        reg_index += 1\n\n    --snip--\n\n    // 从栈拷贝参数\n    offset\
  \ = 16\n    for (param_type, param) in stack_params:\n        if param_type is ByteArray(size,\
  \ alignment):\n            copy_bytes(from=Memory(BP, offset), to=param, count=size)\n\
  \        else:\n            emit(Mov(param_type, Memory(BP, offset)))\n        offset\
  \ += 8\n```\n\nListing 18-64: 将函数参数拷贝到栈\n\n我们添加了一个 `return_in_memory` 标志，我们将通过 `classify_parameters`\
  \ 传递它。该标志还决定了我们如何处理 `RDI` 中的值。如果 `RDI` 指向返回值的目的地，我们将将其拷贝到栈上的第一个空槽位 `-8(%rbp)`；当我们需要返回值时，将从该槽位中检索它。（在下一节中，我们将更新伪操作数替换逻辑，以便通过将局部变量分配到相同位置来避免覆盖此指针。）在这种情况下，我们还会增加\
  \ `reg_index`，就像我们在 Listing 18-61 中传递参数时所做的那样，这样我们从 `RSI` 而不是 `RDI` 开始寻找普通参数。\n\n\
  为了从寄存器中拷贝大小不规则的操作数，我们将使用 Listing 18-63 中的 `copy_bytes_from_reg` 辅助函数。为了拷贝通过栈传递的大小不规则的操作数，我们将使用\
  \ `copy_bytes` 辅助函数。如果操作数的类型为 `Byte`、`Longword`、`Quadword` 或 `Double`，我们将使用单个 `Mov`\
  \ 指令将其拷贝到位，无论它代表标量值还是结构体块。\n\n### 实现返回\n\nListing 18-65 阐了如何将 `Return` 指令转换为汇编。\n\
  \n```\nconvert_return_instruction(Return(retval)):\n    if retval is null:\n   \
  \     emit(Ret)\n        return\n\n    int_retvals, double_retvals, return_in_memory\
  \ = classify_return_value(retval)\n\n    if return_in_memory:\n        emit(Mov(Quadword,\
  \ Memory(BP, -8), Reg(AX))) ❶\n        return\n        return_storage = Memory(AX,\
  \ 0)\n        ret_operand = convert_val(retval)\n        t = assembly_type_of(retval)\n\
  \        copy_bytes(from=ret_operand, to=return_storage, count=t.size) ❷\n    else:\n\
  \        int_return_registers = [AX, DX]\n        double_return_registers = [XMM0,\
  \ XMM1]\n\n        reg_index = 0\n        for (t, op) in int_retvals: ❸\n      \
  \      r = int_return_registers[reg_index]\n            if t is ByteArray(size,\
  \ alignment):\n                copy_bytes_to_reg(op, r)\n            else:\n   \
  \             emit(Mov(t, Reg(r)))\n            reg_index += 1\n\n        reg_index\
  \ = 0\n        for op in double_retvals: ❹\n            r = double_return_registers[reg_index]\n\
  \            emit(Mov(Double, op, Reg(r)))\n            reg_index += 1\n\n    emit(Ret)\n\
  ```\n\nListing 18-65: 实现 Return 指令\n\n假设函数返回一个值而不是 `void`，我们首先对该值进行分类。然后，我们检查是否需要在内存中或寄存器中返回它。要在内存中返回它，我们首先从\
  \ `-8(%rbp)` 获取目的地的指针。我们将该指针拷贝到 `RAX`，因为 System V 调用约定如此如此❶。然后，我们将返回值拷贝到 `RAX` 指向的内存块中。我们使用\
  \ `copy_bytes` 辅助函数执行此拷贝 ❷。\n\n如果返回值通过一个或多个寄存器传递，我们遍历 `int_retvals` 中的操作数，将每个操作数拷贝到对应的通用寄存器中❸。然后我们遍历\
  \ `double_retvals`，将这些值拷贝到 `XMM0` 和 `XMM1` ❹。一旦我们将返回值的每个部分都拷贝到正确的位置，就会发射一条 `Ret`\
  \ 指令。\n\n### 跟踪哪些函数在内存中传递返回值\n\n最后，我们将扩展后端符号表，以跟踪哪些函数在内存中返回值。Listing 18-66 显示了如何更新我们后端符号表条目的定义。\n\
  \n```\nasm_symtab_entry = ObjEntry(assembly_type, bool is_static, bool is_constant)\n\
  \                 | FunEntry(bool defined, bool return_on_stack)\n```\n\nListing\
  \ 18-66: 后端符号表条目的更新后的定义\n\n\n\n\n正如你所预期的，如果函数通过栈传递其返回值，我们将 `return_on_stack` 设置为\
  \ `True`；如果它通过寄存器传递返回值或返回 `void`，则将其设置为 `False`。伪操作数替换传递将使用此标记来判断从 `-8(%rbp)` 开始的四字节字是否可用，或者它是否持有传递返回值的内存指针。如果一个函数具有\
  \ `void` 以外的不完全返回类型（这在已声明但从未定义或调用时可能会发生），`return_on_stack` 标记将永远不会使用，因此我们可以直接将其设置为\
  \ `False`。\n\n### 总结\n\n我们现在已经涵盖了汇编生成的所有部分！表 18-1 到 18-4 总结了从 TACKY 转换为汇编的最新更新；按照惯例，新的结构以及现有结构转换的更改已用**粗体标记。附录\
