  \n在本章中，你将根据类 Unix 系统的标准调用约定实现函数调用和定义，该约定精确定义了函数调用在汇编层应如何工作。调用约定使得单独编译（甚至可能用不同的源语言编写）的二进制文件能够相互操作。通过遵循你系统的调用约定，你将能够编译调用外部库（包括标准库）函数的程序。\n\
  \n\n\n你可以在两个地方声明函数：顶层以及另一个函数的体内部。代码列表 9-4 包含了这两种声明。\n\n```\nint foo(int a, int b);\n\
  \nint main(void) {\n    int foo(int a, int b);\n    return foo(1, 2);\n}\n```\n\
  Listing 9-4：嵌套函数和顶层函数声明\n\n然而，你不能在另一个函数的体内定义函数。C 标准仅支持在顶层定义函数，因此它不允许像 代码列表 9-5 这样的程序。\n\
  \n```\nint main(void) {\n    int foo(int a, int b) {return a + b;};\n    return\
  \ foo(1, 2);\n}\n```\n\nListing 9-5：嵌套函数定义（不支持）\n\n某些编译器将嵌套函数定义作为语言扩展支持，并可以正常编译\
  \ 代码列表 9-5。我们不会实现这一语言扩展；我们将坚持使用 C 标准中的特性。\n\n### 函数调用\n\n函数调用由一个函数名后跟一系列用逗号分隔的参数组成，并封装在括号中：\n\
  \n```\nfoo(1, 2, 3);\n```\n\n虽然函数声明中的标识符被称为函数*参数*，但传入函数调用的表达式被称为函数*实参数*。例如，在 代码列表\
  \ 9-6 中，`a`、`b` 和 `c` 是 `foo` 的参数，而 `a + b` 和 `2 * c` 是 `bar` 的实参数。\n\n```\nint\
  \ foo(int a, int b, int c) {\n    return bar(a + b, 2 * c);\n}\n```\n\nListing 9-6：函数参数和实参数\n\
  \n如 代码列表 9-7 所示，函数调用之前必须声明，但不一定需要定义。\n\n```\nint foo(int arg1, int arg2, int arg3);\n\
  \nint main(void) {\n    return foo(1, 2, 3);\n}\n```\n\nListing 9-7：声明并调用函数\n\n\
  `foo` 的定义可能出现在同一文件的后面，也可能出现在单独的库中。由链接器而不是你的编译器来找到你程序中调用的每个函数的定义。如果它找不到定义，链接将会失败。\n\
  \n在函数声明之前调用该函数是非法的，因此 代码列表 9-8 是无效的。\n\n```\nint main(void) {\n    return foo(1,\
  \ 2, 3);\n}\n\nint foo(int arg1, int arg2, int arg3);\n```\n\nListing 9-8：在声明之前调用函数\n\
  \n在实践中，许多编译器会对调用未声明函数的程序发出警告，但不会拒绝它们。我们的实现更为严格，会在语义分析期间拒绝像 代码列表 9-8 这样的程序。\n\n此外，调用实参数数量错误的函数，或者将变量当作函数来调用，都是非法的。（如果我们实现了函数指针，那么这第二点将是一个例外。）\n\
  \n### 标识符链接\n\n函数名和变量名都是标识符。它们存在于相同的命名空间中，并遵循相同的作用域规则。函数名像变量名一样，可以被内部作用域中的其他声明遮蔽。考虑\
  \ 代码列表 9-9，其中变量名 `foo` 遮蔽了函数名 `foo`。\n\n```c\nint foo(int a, int b);\nint foo =\
  \ 3;\n```\nListing 9-9：变量名遮蔽函数名\n\n\n\n\n尽管 `library_fun` 在两个不同的文件中进行了声明，链接器也会识别出这两个声明都指向同一个实体：即列表\
  \ 9-12 中 `library_fun` 的定义。随后，它将更新二进制代码中所有列表 9-13 处对 `library_fun` 的使用，使其指向列表 9-12\
  \ 中的定义。\n\n在本章中，所有函数标识符都具有外部链接。相反，局部变量没有链接。C 标准第 6.2.2 节第 2 段规定：“每个无链接的标识符的声明都表示一个唯一的实体。”局部变量不能与局部变量引用同一个对象，也不能与具有外部链接的标识符（如函数名）引用同一个实体。\n\
  \n> **注意**\n\n> *标识符的链接似乎仅取决于它是函数还是变量，但在下一章你将发现事实并非如此。我们将实现具有外部链接的全局变量声明，并使用第三种链接——内部链接来实现函数和变量的声明。具有内部链接的声明可以链接到同一编译单元中的其他声明，但不能链接到其他编译单元。*\n\
  \n由于对给定函数名的所有声明必须指向同一个函数定义，因此即使它们出现在不同的作用域中，也必须是兼容的。列表 9-14 包含了两个不兼容的函数声明。\n\n```\n\
  int main(void) {\n    int f(int x);\n    int ret = f(1);\n    if (ret) {\n     \
  \   int f(int a, int b);\n        return f(0, 1);\n    }\n    return 0;\n}\n```\n\
  \n列表 9-14：冲突的函数声明\n\n`f` 的两个声明应该指向同一个函数，因为它们都具有外部链接。但没有任何函数定义可以同时满足这两个声明，因为参数的数量不同。由于这两个声明发生冲突，这段代码将无法编译。\n\
  \n现在我们已经涵盖了一些关于函数的背景信息，可以开始编写编译器了。但我们不会立即开始词法分析。首先，我们需要更新编译器驱动程序。\n\n### 编译库\n\n\
  在之前的章节中，我们只能编译独立的执行文件。我们编译的每个源文件都定义了一个 `main` 函数，这是程序的入口点。现在我们能够处理其他函数了，我们也应该能够编译没有入口点的库。当你的编译器将源代码翻译成汇编代码时，它并不关心处理的是库还是执行文件。然而，你的编译器驱动程序是关心的，因为链接器期望包含一个带有\
  \ `main` 的完整程序。如果你尝试使用当前的编译器驱动程序编译没有 `main` 函数的源文件，你将得到链接错误，错误看起来可能如下：\n\n```\n\
  /usr/bin/ld: . . ./x86_64-linux-gnu/Scrt1.o: in function `_start':\n(.text+0x24):\
  \ undefined reference to `main'\ncollect2: error: ld returned 1 exit status\n```\n\
  \n此错误意味着链接器正尝试将你的代码链接到 `crt0`（调用 `main` 的封装代码），但失败了。\n\n`gcc` 命令接受 `-c` 命令行标志，告诉不要调用链接器；当该标志存在时，它生成目标文件而不是执行文件。为了配合测试套件，你的编译器驱动程序也应该识别\
  \ `-c` 标志。当传递此标志时，编译器驱动程序应该首先按照常例将源程序转换为汇编程序，然后运行以下命令将汇编程序转换为目标文件：\n\n```\ngcc -c\
  \ ASSEMBLY_FILE -o OUTPUT_FILE\n```\n\n输出文件名应该是带有 `.o` 后缀的原始文件名。换句话说，`./YOUR_COMPILER\
  \ -c /path/to/program.c` 应该产生一个目标文件。\n\n> **注意**\n\n> *如果你想编译并分发真实的库，你不仅仅是生成一个目标文件；而是创建一个共享库（Linux\
  \ 上的 .so 文件或 macOS 上的 .dylib 文件）。如果你愿意，可以为你的编译器驱动程序添加另一个选项来生成共享库；你的驱动程序可以通过调用带有适当标志的\
  \ GCC 或 Clang 来将汇编程序转换为共享库。但你的编译器生成共享库的能力有一个很大的局限，特别是在 Linux 上；我们将在第 10 章详细讨论这一点。*\n\
  \n此时，你可能还想扩展你的编译器驱动程序以接受多个输入源文件。测试套件不需要此功能，但如果你想编译多文件程序，你就需要它。为了处理多个源文件，你的编译器驱动程序应该分别将每个文件转换为汇编，然后使用\
  \ `gcc` 命令将它们汇编并链接在一起。\n\n### 词法分析器\n\n你将在本章添加一个 token：\n\n函数参数或参数列表由逗号分隔。\n\n###\
  \ 解析器\n\n我们需要在 AST 的几处进行扩展以支持函数调用、声明和定义。让我们从函数调用开始，它属于一种表达式：\n\n```\nexp = Constant(int)\n\
  \    | Var(identifier)\n    | Unary(unary_operator, exp)\n    | Binary(binary_operator,\
  \ exp, exp)\n    | Assignment(exp, exp)\n    | Conditional(exp condition, exp, exp)\n\
  \    | FunctionCall(identifier, exp* args)\n```\n\n函数调用的 AST 节点包含函数名和参数列表。每个参数都是一个表达式。\n\
  \n接下来，我们将重构 `declaration` 节点，使其表示函数声明或变量声明：\n\n```\ndeclaration = FunDecl(function_declaration)\
  \ | VarDecl(variable_declaration)\nvariable_declaration = (identifier name, exp?\
  \ init)\n```\n\n[/content] (抱歉，在最后部分的翻译中，我似乎不小心保留了未翻译的英文块，以下是修正后的最后部分)\n\n[content]\n\
