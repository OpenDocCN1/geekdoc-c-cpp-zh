  md: 'The shader uses the fragment’s texture coordinates to extract the normal map
    entry corresponding to the current fragment. The sampler variable "normMap" is
    used for this, and in this case is bound to texture unit 0 (note the Java/JOGL
    application must therefore have attached the normal map image to texture unit
    0). To convert the color component from the stored range [0..1] to its original
    range [-1..+1] we multiply by 2.0 and subtract 1.0.


    The TBN matrix is then applied to the resulting normal to produce the final normal
    for the current pixel. The rest of the shader is identical to the fragment shader
    used for Phong lighting. The fragment shader is shown in Program 10.2 and is based
    on a version by Etay Meiri [ME11].


    A variety of tools exist for developing normal map images. Some image editing
    tools, such as GIMP [GI21] and Photoshop [PH21], have such capabilities. Such
    tools analyze the edges in an image, inferring peaks and valleys and producing
    a corresponding normal map.


