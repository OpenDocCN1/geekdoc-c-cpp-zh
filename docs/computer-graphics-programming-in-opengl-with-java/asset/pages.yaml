    # ### 4.8 MATRIX STACKS


    So far, the models we have rendered have each been constructed of a single set
    of vertices. It is often desired, however, to build complex models by assembling
    smaller simple models. For example, a model of a “robot” could be created by separately
    drawing the head, body, legs, and arms, where each is a separate model. An object
    built in this manner is often called a *hierarchical model*. The tricky part of
    building hierarchical models is keeping track of all the model-view matrices,
    and making sure they stay perfectly coordinated—otherwise the robot might fly
    apart into pieces!


    Hierarchical models are useful not only for building complex objects—they can
    also be used to generate complex scenes. For example, consider how our planet
    earth revolves around the sun, and in turn how the moon revolves around the earth.
    Such a scene is shown in Figure 4.11.⁵ Computing the moon’s actual path through
    space could be complex. However, if we can *combine* the transforms representing
    the two simple circular paths—the moon’s path around the earth and the earth’s
    path around the sun—we avoid having to explicitly compute the moon trajectory.


    ⁵ Yes, we know that the moon doesn’t revolve in this “vertical” trajectory around
    the earth, but rather in one that is more coplanar with the earth’s revolution
    around the sun. We chose this orbit to make our program’s execution clearer.'
