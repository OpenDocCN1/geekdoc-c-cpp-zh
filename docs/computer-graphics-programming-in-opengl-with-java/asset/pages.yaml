    # 14.4 3D TEXTURES


    Whereas 2D textures contain image data indexed by two variables, 3D textures contain
    the same type of image data, but in a 3D structure that is indexed by three variables.
    The first two dimensions still represent *width* and *height* in the texture map;
    the third dimension represents *depth*.


    Because the data in a 3D texture is stored in a similar manner as for 2D textures,
    it is tempting to think of a 3D texture as a sort of 3D “image.” However, we generally
    don’t refer to 3D texture source data as a 3D image, because there are no commonly
    used image file formats for this sort of structure (i.e., there is nothing akin
    to a 3D JPEG, at least not one that is truly three-dimensional). Instead, we suggest
    thinking of a 3D texture as a sort of substance into which we will submerge (or
    “dip”) the object being textured, resulting in the object’s surface points obtaining
    their colors from the corresponding locations in the texture. Alternatively, it
    can be useful to imagine that the object is being “carved” out of the 3D texture
    “cube,” much like a sculptor carves a figure out of a single solid block of marble.


    OpenGL has support for 3D texture objects. In order to use them, we need to learn
    how to build the 3D texture and how to use it to texture an object.'
