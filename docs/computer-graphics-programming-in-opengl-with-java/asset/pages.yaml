  md: '# ### 3.1 3D COORDINATE SYSTEMS


    3D space is generally represented with three axes: X, Y, and Z. The three axes
    can be arranged into two configurations, *right-handed* or *left-handed*. (The
    name derives from the orientation of the axes as if constructed by pointing the
    thumb and first two fingers of the right versus the left hand, at right angles.)


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_58_0.png)


    It is important to know which coordinate system your graphics programming environment
    uses. For example, the majority of coordinate systems in OpenGL are right-handed,
    whereas in Direct3D the majority are left-handed. Throughout this book, we will
    assume a right-handed configuration unless otherwise stated.


    # ### 3.2 POINTS


    Points in 3D space can be specified by listing the X, Y, Z values, using a notation
    such as (2, 8, -3). However, it turns out to be much more useful to specify points
    using *homogeneous* notation, a representation first described in the early 1800s.
    Points in homogeneous notation contain four values, the first three corresponding
    to X, Y, and Z, and the fourth, W, is always a fixed nonzero value, usually 1.
    Thus, we represent this point as (2, 8, -3, 1). As we will see shortly, homogeneous
    notation will make many of our graphics computations more efficient.


    The appropriate GLSL data type for storing points in homogeneous 3D notation is
    vec4 (“vec” refers to *vector*, but it can also be used for a point). The JOML
    library includes classes appropriate for creating and storing three-element and
    four-element (homogeneous) points in the Java application, called Vector3f and'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Vector4f, respectively. In some cases (as we will see), JOML adds the fourth
    element (set to 1.0) to a Vector3f when needed to carry out a homogeneous operation.


    # 3.3 MATRICES


    A matrix is a rectangular array of values, and its elements are typically accessed
    by means of subscripts. The first subscript refers to the row number, and the
    second subscript refers to the column number, with the subscripts starting at
    0. Most of the matrices that we will use for 3D graphics computations are of size
    4x4, as shown in Figure 3.2.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_59_0.png)


    The GLSL language includes a data type called mat4 that can be used for storing
    4x4 matrices. Similarly, JOML includes a class called Matrix4f for instantiating
    and storing 4x4 matrices.


    The identity matrix contains all zeros, with ones along the diagonal:


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_59_1.png)


    Any point or matrix multiplied by the identity matrix is unchanged. In JOML, the
    identity matrix is available through the function Matrix4f.identity().


    The transpose of a matrix is computed by interchanging its rows and columns. For
    example:


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_59_2.png)'
