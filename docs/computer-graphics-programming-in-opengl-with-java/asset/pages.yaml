  md: 'for convenience) for us to discuss. First, note that init() is no longer empty—it
    now calls another function named “createShaderProgram()” (that we wrote). This
    function starts by declaring two shaders as arrays of strings called vshaderSource
    and fshaderSource. It then calls glCreateShader(), which generates the desired
    type of shader (note the predefined value GL_VERTEX_SHADER, and then later GL_FRAGMENT_SHADER).
    OpenGL creates the shader object (initially empty), and returns an integer ID
    that is an index for referencing it later—the code stores this ID in the variable
    vShader (and fShader). It then calls glShaderSource(), which loads the GLSL code
    from the string array into the empty shader object. glShaderSource() has five
    parameters: (a) the shader object in which to store the shader, (b) the number
    of strings in the shader source code, (c) the array of strings containing the
    source code, and two additional parameters we aren’t using (they will be explained
    later, in the supplementary chapter notes). Note also that the two commented lines
    of code in the blue section, highlighting the parameter values 3 and 4, refer
    to the number of lines of code in each shader (the \n’s delineate each line in
    the shader source code). The shaders are then each compiled using glCompileShader().


    The application then creates a *program* object named vfprogram and saves the
    integer ID that points to it. An OpenGL “program” object contains a series of
    compiled shaders, and here we see the commands glCreateProgram() to create the
    program object, glAttachShader() to attach each of the shaders to it, and then
    glLinkProgram() to request that the GLSL compiler ensure that they are compatible.


    After init() finishes, display() is called automatically (recall this is also
    a JOGL callback). One of the first things that display() does is call glUseProgram(),
    which loads the program containing the two compiled shaders into the OpenGL pipeline
    stages (onto the GPU!). Note that glUseProgram() *doesn’t run the shaders*; it
    just loads them onto the hardware.


