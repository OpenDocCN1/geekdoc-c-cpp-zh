    \ surface would require a huge number of vertices), or (b) we could apply a texture\
    \ map image of the irregular surface to a smooth version of the object. The second\
    \ option is often effective. However, if the scene includes lights and the lights\
    \ (or camera angle) move, it becomes quickly obvious that the object is statically\
    \ textured (and smooth) because the light and dark areas on the texture wouldn’t\
    \ change, as they would if the object was actually bumpy.\n\nIn this chapter we\
    \ are going to explore several related methods for using lighting effects to make\
    \ objects *appear* to have realistic surface texture, even if the underlying object\
    \ model is smooth. We will start by examining *bump mapping* and *normal mapping*,\
    \ which can add considerable realism to the objects in our scenes when it would\
    \ be too computationally expensive to include tiny surface details in the object\
    \ models. We will also look at ways of actually perturbing the vertices in a smooth\
    \ surface through *height mapping*, which is useful for generating *terrain* (and\
    \ other uses).\n\n# 10.1 BUMP MAPPING\n\nIn Chapter 7, we saw how surface normals\
    \ are critical to creating convincing lighting effects. Light intensity at a pixel\
