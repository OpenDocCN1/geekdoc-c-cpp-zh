- pgno: 115
  md: 'it in the depth buffer. The greater the range between near and far clipping
    planes used to build the perspective matrix, the more likely two objects'' points
    with similar (but not equal) actual depths will be represented by the same numeric
    value in the depth buffer. Therefore, it is up to the programmer to select near
    and far clipping plane values to minimize the distance between the two planes,
    while still ensuring that all objects essential to the scene lie within the viewing
    frustum.


    It is also important to understand that, due to the effect of the perspective
    transform, changing the near clipping plane value can have a greater impact on
    the likelihood of Z-fighting artifacts than making an equivalent change in the
    far clipping plane. Therefore, it is advisable to avoid selecting a near clipping
    plane that is too close to the eye.


    Previous examples in this book have simply used values of 0.1 and 1000 (in our
    calls to perspective()) for the near and far clipping planes. These may need to
    be adjusted for your scene.


    # ## ■ 4.10 OTHER OPTIONS FOR PRIMITIVES


    OpenGL supports a number of primitive types—so far we have seen two: GL_TRIANGLES
    and GL_POINTS. In fact, there are several others. All of the available primitive
    types supported in OpenGL fall into the categories of triangles, lines, points,
    and patches. Here is a complete list:


