  md: 'Finally, there is the issue of how the *vertex* that came out of the vertex
    shader became a *pixel* in the fragment shader. Recall from Figure 2.2 that between
    vertex processing and pixel processing is the *rasterization* stage. It is there
    that primitives (such as points or triangles) are converted into sets of pixels.
    The default size of an OpenGL “point” is one pixel, so that is why our single
    point was rendered as a single pixel.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_35_0.png)


    **Figure 2.5**

    Changing glPointSize.


    Let’s add the following command in `display()`, right before the `glDrawArrays()`
    call:


    ```

    ```java

    gl.glPointSize(30.0f);

    ```

    ```


    Now, when the rasterizer receives the vertex from the vertex shader, it will set
    pixel color values that form a point having a size of 30 pixels. The resulting
    output is shown in Figure 2.5.


    Let’s now continue examining the remainder of the OpenGL pipeline.


    # ### 2.1.5 Tessellation


    We cover tessellation in Chapter 12. The programmable tessellation stage is one
    of the most recent additions to OpenGL (in version 4.0). It provides a tessellator
    that can generate a large number of triangles, typically as a grid, and also some
    tools to manipulate those triangles in a variety of ways. For example, the programmer
    might manipulate a tessellated grid of triangles as shown in Figure 2.6.


    Tessellation is useful when a lot of vertices are needed on what is otherwise
    a simple shape, such as on a square area or curved surface. It is also very useful
    for generating complex terrain, as we will see later. In such instances, it is
    sometimes much more efficient to have the tessellator in the GPU generate the
    triangle mesh in hardware, rather than doing it in Java.'
