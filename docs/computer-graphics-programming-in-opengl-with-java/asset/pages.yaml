    \ * vec4(vertNormal,1.0)).xyz;\n    varyingHalfVec = (varyingLightDir - varyingVertPos).xyz;\n\
    \    shadow_coord = shadowMVP2 * vec4(vertPos,1.0);\n    gl_Position = p_matrix\
    \ * v_matrix * m_matrix * vec4(vertPos,1.0);\n}\n```\n```\n\n**Figure 8.6**  \n\
