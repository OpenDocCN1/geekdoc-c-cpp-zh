  md: 'Therefore, if \(\vec{V}\) and \(\vec{W}\) are normalized (i.e., of unit length—we
    use the "^" notation for normalization as shown earlier), then:


    \[\cos(\theta) = \hat{V} \bullet \hat{W}\]


    \[\theta = \arccos(\hat{V} \bullet \hat{W})\]


    Interestingly, we will later see that often it is \(cos(\theta)\) that we need,
    rather than \(\theta\) itself. So both of the above derivations will be directly
    useful.


    The dot product also has a variety of other uses:


    +   - Finding a vector''s magnitude: \(\sqrt{\vec{V} \bullet \vec{V}}\)

    +   - Finding whether two vectors are perpendicular if \(\vec{V} \bullet \vec{W}
    = 0\)

    +   - Finding whether two vectors are parallel if \(\vec{V} \bullet \vec{W} =
    |\vec{V}| \bullet |\vec{W}|\)

    +   - Finding whether two vectors are parallel but pointing in opposite directions:
    \(\vec{V} \bullet \vec{W} = -|\vec{V}| \bullet |\vec{W}|\)

    +   - Finding whether an angle between vectors lies in the range [-90°..+90°]:
    \(\vec{V} \bullet \vec{W} > 0\)

    +   - Finding the minimum signed distance from point \(P = (x,y,z)\) to plane
    \(S = (a,b,c,d)\) (first, find unit vector normal to \(S\), \(\hat{n} = (\frac{a}{\sqrt{a^2+b^2+c^2}},
    \frac{b}{\sqrt{a^2+b^2+c^2}}, \frac{c}{\sqrt{a^2+b^2+c^2}})\), and shortest distance
    \(D = \frac{d}{\sqrt{a^2+b^2+c^2}}\) from the origin to the plane; then the minimum
    signed distance from \(P\) to \(S\) is \((\hat{n} \bullet \vec{P}) + D\) and the
    sign of this distance determines on which side of the plane S point P lies)


    # ### 3.5.2 Uses for Cross Product


    An important property of the cross product of two vectors, which we will use extensively
    throughout this book, is that it produces a vector that is normal (perpendicular)
    to the plane defined by the original two vectors.


