  md: 'A related structure in OpenGL is called a *Vertex Array Object*, or *VAO*.
    VAOs were introduced in version 3.0 of OpenGL and are provided as a way of organizing
    buffers and making them easier to manipulate in complex scenes. OpenGL requires
    at least one VAO to be created, and for our purposes one will be sufficient.


    For example, suppose that we wish to display two objects. On the Java/JOGL side,
    we could do this by declaring a single VAO and an associated set of two VBOs (one
    per object), as follows:


    ```

    ```java

    private int vao[] = new int[1];    // OpenGL requires these values be specified
    in arrays

    private int vbo[] = new int[2];

    ...

    gl.glGenVertexArrays(1, vao, 0);

    gl.glBindVertexArray(vao[0]);

    gl.glGenBuffers(2, vbo, 0);

    ```

    ```


    The two OpenGL commands glGenVertexArrays() and glGenBuffers() create VAOs and
    VBOs, respectively, and produce integer IDs for these items that are stored in
    the arrays vao and vbo. The purpose of glBindVertexArrays() is to make the specified
    VAO “active” so that the generated buffers¹ will be associated with that VAO.


    A buffer needs to have a corresponding *vertex attribute* variable declared in
    the vertex shader. Vertex attributes are generally the first variables declared
    in a


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_85_0.png)


    ¹ Throughout this example, two buffers are declared, to emphasize that *usually*
    we will use several buffers. Later we will use the additional buffer(s) to store
    other information associated with the vertex, such as color. In the current case
    we are using only one of the declared buffers, so it would have been sufficient
    to declare just one VBO.'
