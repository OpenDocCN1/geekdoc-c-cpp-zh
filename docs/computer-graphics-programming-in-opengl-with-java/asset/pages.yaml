- pgno: 336
  md: '# 14.2 COMPOSITING/BLENDING/TRANSPARENCY


    We have already seen a few examples of blending—in the supplementary notes for
    Chapter 7 and just above in our implementation of fog. However, we haven’t yet
    seen how to utilize the blending (or *compositing*) capabilities that follow after
    the fragment shader, during pixel operations (recall the pipeline sequence shown
    in Figure 2.2). It is there that *transparency* is handled, which we look at now.


    Throughout this book we have made frequent use of the vec4 data type, to represent
    3D points and vectors in a homogenous coordinate system. You may have noticed
    that we also frequently use a vec4 to store *color* information, where the first
    three values consist of red, green, and blue, and the fourth element is—what?


    The fourth element in a color is called the *alpha channel* and specifies the
    *opacity* of the color. Opacity is a measure of how *non*-transparent the pixel
    color is. An alpha value of 0 means “no opacity,” or completely transparent. An
    alpha value of 1 means “fully opaque,” not at all transparent. In a sense, the
    “transparency” of a color is 1-α, where α is the value of the alpha channel.


    Recall from Chapter 2 that pixel operations utilize the *Z-buffer*, which achieves
    hidden surface removal by replacing an existing pixel color when another object’s
    location at that pixel is found to be closer. We actually have more control over
    this process—we may choose to *blend* the two pixels.


    When a pixel is being rendered, it is called the “source” pixel. The pixel already
    in the frame buffer (presumably rendered from a previous object) is called the
    “destination” pixel. OpenGL provides many options for deciding which of the two
    pixels, or what sort of combination of them, ultimately is placed in the frame
    buffer. Note that the pixel operations step is not a programmable stage—so the
    OpenGL tools for configuring the desired compositing are found in the Java/JOGL
    application rather than in a shader.


    The two OpenGL functions for controlling compositing are glBlendEquation(mode)
    and glBlendFunc(srcFactor, destFactor). Figure 14.3 shows an overview of the compositing
    process.


    The compositing process works as follows:


    +   1. The *source* and *destination* pixels are multiplied by *source factor*
    and *destination factor*, respectively. The source and destination factors are
    specified in the glBlendFunc() function call.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_337_0.png)


    **Figure 14.3**

    OpenGL compositing overview.


    +   2. The specified *blendEquation* is then used to combine the modified source
    and destination pixels to produce a new destination color. The blend equation
    is specified in the glBlendEquation() call.


    The most common options for glBlendFunc() parameters (i.e., *srcFactor* and *destFactor*)
    are shown in the following table:


    | glBlendFunc() parameter | resulting srcFactor or destFactor |

    | --- | --- |

    | GL_ZERO | (0,0,0,0) |

    | GL_ONE | (1,1,1,1) |

    | GL_SRC_COLOR | (R_Src,G_Src,B_Src,A_Src) |

    | GL_ONE_MINUS_SRC_COLOR | (1,1,1,1) − (R_Src,G_Src,B_Src,A_Src) |

    | GL_DST_COLOR | (R_Dst,G_Dst,B_Dst,A_Dst) |

    | GL_ONE_MINUS_DST_COLOR | (1,1,1,1) − (R_Dst,G_Dst,B_Dst,A_Dst) |

    | GL_SRC_ALPHA | (A_Src,A_Src,A_Src,A_Src) |

    | GL_ONE_MINUS_SRC_ALPHA | (1,1,1,1) − (A_Src,A_Src,A_Src,A_Src) |

    | GL_DST_ALPHA | (A_Dst,A_Dst,A_Dst,A_Dst) |

    | GL_ONE_MINUS_DST_ALPHA | (1,1,1,1) − (A_Dst,A_Dst,A_Dst,A_Dst) |

    | GL_CONSTANT_COLOR | (R_ConstantColor,G_ConstantColor,B_ConstantColor,A_ConstantColor)
    |

    | GL_ONE_MINUS_CONSTANT_COLOR | (1,1,1,1) − (R_ConstantColor,G_ConstantColor,B_ConstantColor,A_ConstantColor)
    |'
