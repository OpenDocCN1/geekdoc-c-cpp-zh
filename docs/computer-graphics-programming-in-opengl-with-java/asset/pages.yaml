    \ # 9.4 ENVIRONMENT MAPPING\n\nWhen we looked at lighting and materials, we considered\
    \ the “shininess” of objects. However, we never modeled *very* shiny objects,\
    \ such as a mirror or something made out of chrome. Such objects don’t just have\
    \ small specular highlights; they actually reflect their surroundings. When we\
    \ look at them, we see things in the room, or sometimes even our own reflection.\
    \ The ADS lighting model doesn’t provide a way of simulating this effect.\n\n\
    Texture cube maps, however, offer a relatively simple way to simulate reflective\
    \ surfaces—at least partially. The trick is to *use the cube map to texture the\
    \ reflective object itself*! Doing this so that it appears realistic requires\
    \ finding texture coordinates that correspond to the part of the surrounding environment\
    \ we should see reflected in the object from our vantage point.\n\nFigure 9.9\
    \ illustrates the strategy of using a combination of the view vector and the normal\
    \ vector to calculate a *reflection vector* which is then used to look up a texel\
    \ from the cube map. The reflection vector can thus be used to access the texture\
    \ cube map directly. When the cube map performs this function, it is referred\
    \ to as an *environment map*.\n\n1 This same trick is also possible in those cases\
