    (phase 2) Render the resulting image


    Phase 2 will be extremely easy, as we already know how to render an image as a
    texture. All of the hard work is done in phase 1, and so to help achieve reasonable
    performance, we will use a *compute shader* for this step.


    # 16.1 COMPUTE SHADERS


    GPUs offer extraordinary parallel computing power. Whereas modern CPUs may have
    4 or 8 cores, GPUs can have thousands. Therefore, they are often used for computationally-intensive
    non-graphics tasks. One way of doing this is to use a special-purpose language
    such as CUDA [NV20], or OpenCL [KR20]. Another way is to use a *compute shader*,
    which is a variant of the graphics pipeline shaders that we already know. OpenGL
    compute shaders are programmed in GLSL, so most of the same programming techniques
    that we have learned so far in the preceding chapters are immediately applicable.


    There are many uses for compute shaders. The *OpenGL SuperBible* describes a few,
    including parallelizing matrix computations, building special-purpose image filters
    (such as adding depth-of-field), and simulating flocks or particle systems [SW15].
    The topic of compute shaders is vast, and we focus only on using them for ray
    tracing. So, this chapter serves both as an introduction to ray tracing, and to
    compute shaders.


    # 16.1.1 Compiling and Using Compute Shaders


    Compute shaders are just like the other shaders we’ve seen, except that they are
    *not* a part of the graphics pipeline. They run independently; that is, they do
    not interact with, say, vertex or fragment shaders, and have no predefined inputs
    or outputs. However, they can accept data passed to them, such as in uniform variables,
    and can generate or modify data in memory. Compute shaders are compiled with glCompileShader(),
    linked with glLinkProgram(), and made active with glUseProgram() just like any
    other shader, except that the predefined constant GL_COMPUTE_SHADER is used to
    specify the shader type. We extend the Utils.java file to include a function for
    compiling a compute shader and building a rendering'
