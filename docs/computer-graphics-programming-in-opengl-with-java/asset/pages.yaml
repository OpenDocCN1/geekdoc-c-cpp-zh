    \    aspect = (float) width / (float) height;    // new window width & height\
    \ are provided by the callback\n    gl.glViewport(0, 0, width, height);      \
    \   // sets region of screen associated with the frame buffer\n    pMat.setPerspective((float)\
    \ Math.toRadians(60.0f), aspect, 0.1f, 1000.0f);\n}\n```\n\n# 4.11.3 Back-Face\
    \ Culling\n\nAnother way of improving rendering efficiency is to take advantage\
    \ of OpenGL’s ability to do *back-face culling*. When a 3D model is entirely “closed,”\
    \ meaning the interior is never visible (such as for the cube and for the pyramid),\
    \ then it turns out that those portions of the outer surface that are angled away\
    \ from the viewer will always be obscured by some other portion of the same model.\
    \ That is, those triangles that face away from the viewer cannot possibly be seen\
    \ (they would be overwritten by hidden surface removal anyway), and thus there\
    \ is no reason to rasterize or render them.\n\nWe can ask OpenGL to identify and\
    \ “cull” (not render) back-facing triangles with the command glEnable(GL_CULL_FACE).\
    \ We can also disable face culling with glDisable(GL_CULL_FACE). By default, face\
    \ culling is disabled, so if you want OpenGL to cull back-facing triangles, you\
    \ must enable it."
