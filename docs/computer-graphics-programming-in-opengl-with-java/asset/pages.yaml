    \ it to easily illustrate how to: (1) pass data to a compute shader, (2) perform\
    \ a simple parallel computation, and (3) pass the result back to the Java/JOGL\
    \ application. Details of the code follow the listing.\n\nThere are multiple ways\
    \ of passing data to a compute shader, including many of the normal methods we\
    \ have already learned such as uniforms, buffers, etc. However, there are only\
    \ two ways of getting computed data *out* of a compute shader. The first way is\
    \ to use a special kind of buffer called a *Shader Storage Buffer Object* (SSBO),\
    \ which was introduced at OpenGL version 4.3 and is convenient for mathematical\
    \ applications, such as matrix operations. The second way is to use an *image\
    \ load/store*, which is more convenient for image processing or graphics applications.\
    \ For this simple application of summing two matrices, we will use SSBOs. Later,\
    \ we will use the second method (image load/store) in section 16.2 when we study\
    \ ray tracing.\n\n# Program 16.1 Simple Compute Shader Example\n\nJava/JOGL Application\n\
