    # 4.11 CODING FOR PERFORMANCE


    As the complexity of our 3D scenes grows, we will become increasingly concerned
    with performance. We have already seen a few instances where coding decisions
    were made in the interest of speed, such as when we used instancing and when we
    moved expensive computations into the shaders.


    Actually, the code we have presented has already also included some additional
    optimizations that we haven’t yet discussed, some of which are facilitated by
    the JOML math library. We now explore these and other important techniques.


    # 4.11.1 Minimizing Dynamic Memory Allocation


    The critical module in our Java/JOGL applications, with respect to performance,
    is clearly the display() function. This is the function that is called repeatedly
    during any animation or real-time rendering, and it is thus in this function (or
    in any function that it calls) where we must strive for maximum efficiency.


    One important way of keeping overhead in the display() function to a minimum is
    by avoiding any steps that require memory allocation. Obvious examples of things
    to avoid thus would include the following:


    +   - instantiating objects

    +   - declaring variables

    +   - allocating buffers


    The reader is encouraged to review each of the programs that we have developed
    so far and note that every variable used in the display() function (with the exception
    of the GL4 variable gl) was declared, and its space allocated, before the display()
    function was ever actually called. Another example is Matrix4fStack, in which
    JOML requires allocation of the maximum stack size up front, so that the'
