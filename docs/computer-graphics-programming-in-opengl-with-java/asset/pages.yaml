    # ## 17.6 CORRECTING LENS DISTORTION IN HEADSETS


    Headsets for viewing side-by-side images utilize high field-of-view lenses that
    often suffer from lens distortion. Two important types of distortion in lenses
    are *barrel distortion*, where straight lines bulge outward, and *pincushion distortion*,
    where straight lines pinch inward. Figure 17.7 shows a simple grid, and then the
    same grid having been distorted with both pincushion and barrel distortions.'
