- pgno: 340
  md: 'Actually, the reason that the back faces of the pyramid did not appear is because
    we enabled back-face culling. A reasonable idea might be to disable back-face
    culling while drawing the pyramid. However, this often produces other artifacts,
    as shown in Figure 14.5 (on the left). The problem with simply disabling back-face
    culling is that the effects of blending depend on the order that surfaces are
    rendered (because that determines the source and destination pixels) and we don''t
    always have control over the rendering order. It is generally advantageous to
    render opaque objects first, as well as objects that are in the back (such as
    the torus), before any transparent objects. This also holds true for the surfaces
    of the pyramid, and in this case the reason that the two triangles comprising
    the base of the pyramid appear different is that one of them was rendered before
    the front of the pyramid and one was rendered after. Artifacts such as this are
    sometimes called “ordering” artifacts and can manifest in transparent models,
    because we cannot always predict the order that its triangles will be rendered.


    We can solve the problem in our pyramid example by rendering the front and back
    faces separately, ourselves, starting with the back faces. Program 14.2 shows
    the code for doing this. We specify the alpha value for the pyramid by passing
    it to the shader program in a uniform variable, and then apply it in the fragment
    shader by substituting the specified alpha into the computed output color.


    Note also that for lighting to work properly, we must flip the normal vector when
    rendering the back faces. We accomplish this by sending a flag to the vertex shader,
    where we then flip the normal vector.


    # *Program 14.2 Two-Pass Blending for Transparency*


    *JOGL/Java application - in display() for rendering pyramid:*


    ```

    ```java

    ...

    gl.glEnable(GL_CULL_FACE);

    ...

    gl.glEnable(GL_BLEND);             // configure blend settings

    gl.glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

    gl.glBlendEquation(GL_FUNC_ADD);


    gl.glCullFace(GL_FRONT);

    gl.glProgramUniform1f(renderingProgram, alphaLoc, 0.3f); // back faces very transparent

    gl.glProgramUniform1f(renderingProgram, flipLoc, -1.0f); // flip normals on back
    faces

    gl.glDrawArrays(GL_TRIANGLES, 0, numPyramidVertices);

    ```

    ```'
