- pgno: 459
  md: "# 16.3.4 Increasing the Number of Rays\n\nWhat if we have a transparent object\
    \ and behind it is another transparent object? Ideally, the ray tracer should\
    \ generate a series rays for the first and second transparent objects. Then, whichever\
    \ surface is encountered behind the 2ⁿᵈ object is what we would see. If the transparent\
    \ objects were boxes (or spheres), how many rays would be required for the final\
    \ object to appear? An example is shown in Figure 16.17, in which a green star\
    \ is viewed through two transparent boxes. Since each transparent object would\
    \ generally require two secondary rays (one entering the object and one leaving\
    \ the object), we would need a total of five rays.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_459_0.png)\n\
    \n**Figure 16.17**  \nReturning an object's color through a sequence of transparent\
    \ objects.\n\nHowever, that is not what the code we have built so far will do.\
    \ Rather, we have hard-coded functions raytrace(), raytrace2(), and raytrace3()\
    \ that result in a maximum sequence of three rays (ignoring the shadow ray). So,\
    \ in the example shown in Figure 16.17, the sequence of rays would stop at the\
    \ second transparent object, and we wouldn’t see the star at all. As the need\
    \ for longer and longer sequences of rays increases, we cannot keep making more\
    \ copies of the raytrace() function, as such a solution would not be scalable.\n\
    \nAnother similar situation occurs if we have two highly reflective objects facing\
    \ each other. Anyone who has done this with two mirrors knows the effect as they\
    \ reflect back and forth between each other. Figure 16.18 shows such an example\
    \ generated by one of the authors at his home. Our code could only do two reflections,\
    \ but no subsequent reflections. A much longer sequence of rays is needed to achieve\
    \ this effect.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_459_1.png)\n\n**Figure\
    \ 16.18**  \nTwo mirrors facing each other"
  merge: -1
  img_proc: true
- pgno: 460
  md: "We actually faced this situation in the previous example from Program 16.11\
    \ (Figure 16.16) because both the box and the sphere were reflective. The effects\
    \ of any additional rays in that particular example would be negligible, and in\
    \ such cases, a depth of one or two rays is sufficient. However, in those cases\
    \ where the additional rays are needed to achieve realistic results, we need a\
    \ way of generating more rays.\n\nThe general solution to this problem is to recursively\
    \ call raytrace(), with the condition that terminates the recursion (the so-called\
    \ “base case”) being whenever a ray encounters a non-reflective or non-transparent\
    \ surface (or whenever a pre-determined maximum depth has been reached) or if\
    \ the ray collides with no object. Unfortunately, GLSL does not support recursion.\
    \ So, to achieve any reasonable simulation of the above effects, we need to keep\
    \ track of the recursion ourselves.\n\nBuilding a recursive version of raytrace()\
    \ in the absence of native support for recursion is not trivial. Our solution\
    \ requires a stack, defining a structure for items to be pushed onto the stack,\
    \ building the appropriate push and pop operations, a driver that contains the\
    \ main loop for processing the rays (using stack operations), and a function to\
    \ process a stack element (which contains the information for an individual ray).\n\
    \nProgram 16.12 shows these as additions (and replacements) to elements of the\
    \ previous Program 16.11. There is a struct called Stack_Element that defines\
    \ the items stored in the stack and functions for raytrace() (which is the driver),\
    \ push(), pop(), and process_stack_element(). The stack itself is stored as an\
    \ array of Stack_Elements. After presenting the code, more detailed explanations\
    \ follow.\n\n# Program 16.12 Recursive Ray Generation\n\nCompute Shader\n\n```\n\
    ...\nstruct Stack_Element\n{\n    int type;                 // type of ray (1\
    \ = reflected, 2 = refracted. Shadow rays are never pushed on stack)\n    int\
    \ depth;                // depth of the recursive raytrace\n    int phase;   \
    \             // which of the five phases of a recursive call is currently being\
    \ processed\n    vec3 phong_color;         // holds the computed ADS color\n \
    \   vec3 reflected_color;     // holds the reflected color\n\n```"
  merge: -1
  img_proc: true
