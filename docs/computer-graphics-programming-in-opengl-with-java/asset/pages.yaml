    \ mode, GLint first, GLsizei count);\n```\n\nThe mode is the type of primitive—for\
    \ triangles we use GL_TRIANGLES. The parameter “first” indicates which vertex\
    \ to start with (generally vertex number 0, the first one), and count specifies\
    \ the total number of vertices to be drawn.\n\nWhen glDrawArrays() is called,\
    \ the GLSL code in the pipeline starts executing. Let’s now add some GLSL code\
    \ to that pipeline.\n\nRegardless of where they originate, all of the vertices\
    \ pass through the vertex shader. They do so *one-by-one*; that is, the shader\
    \ is executed *once per vertex*. For a large and complex model with a lot of vertices,\
    \ the vertex shader may execute hundreds, thousands, or even millions of times,\
    \ often in parallel.\n\nLet’s write a simple program with only one vertex, hardcoded\
    \ in the vertex shader. That’s not enough to draw a triangle, but it is enough\
