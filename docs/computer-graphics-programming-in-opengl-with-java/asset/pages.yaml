  md: 'For simple models like cubes or pyramids, selecting texture coordinates is
    relatively easy. But for more complex curved models with lots of triangles, it
    isn’t practical to determine them by hand. In the case of curved geometric shapes,
    such as a sphere or torus, texture coordinates can be computed algorithmically
    or mathematically. In the case of a model built with a modeling tool such as Maya
    [MA21] or Blender [BL21], such tools offer “UV-mapping” (which is outside the
    scope of this book) to make this task easier.


    Let us return to rendering our pyramid, only this time texturing it with an image
    of bricks. We will need to specify (a) an OpenGL texture object to hold the texture
    image, (b) texture coordinates for the model vertices, (c) a buffer for holding
    the texture coordinates, (d) vertex attributes so that the vertex shader can receive
    and forward the texture coordinates through the pipeline, (e) a texture unit on
    the graphics card for holding the texture object, and (f) a *uniform sampler*
    variable for accessing the texture unit in GLSL, which we will see shortly. These
    are each described in the next sections.


