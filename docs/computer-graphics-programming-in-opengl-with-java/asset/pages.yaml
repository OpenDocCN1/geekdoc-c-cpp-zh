- pgno: 212
  md: 'The reason we cannot answer this question is due to the lack of *shadows* in
    the scene. We expect to see shadows, and our brain uses shadows to help build
    a more complete mental model of the objects we see and where they are located.


    Consider the same scene, shown in Figure 8.2, with shadows incorporated. It is
    now obvious that the torus is resting on the ground plane in the left example
    and floating above it in the right example.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_212_0.png)


    # ### 3.7 PROJECTIVE SHADOWS


    A variety of interesting methods have been devised for adding shadows to 3D scenes.
    One method that is well suited to drawing shadows on a ground plane (such as our
    image in Figure 8.1) and relatively computationally inexpensive is called *projective
    shadows*. Given a point light source position (X_L, Y_L, Z_L), an object to render,
    and a plane on which the object''s shadow is to be cast, it is possible to derive
    a transformation matrix that will convert points (X_W, Y_W, Z_W) on the object
    to corresponding shadow points (X_S, 0, Z_S) on the plane. The resulting "shadow
    polygon" is then drawn, typically as a dark object blended with the texture on
    the ground plane, as illustrated in Figure 8.3.


    The advantages of projective shadow casting are its efficiency and simplicity
    of implementation. However, it only works on a flat plane—the method can''t be
    used to cast shadows on a curved surface or on other objects. It is still useful
    for performance-intensive applications involving outdoor scenes, such as in many
    video games.


    Development of projective shadow transformation matrices is discussed in [AS14],
    [BL88], and [KS16].'
