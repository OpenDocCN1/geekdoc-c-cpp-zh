- pgno: 146
  md: 'Specifying that values less than 0 and greater than 1 result in a “border”
    color can be done as follows:


    ```

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_BORDER);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_BORDER);

    float[] redColor = new float[] { 1.0f, 0.0f, 0.0f, 1.0f };

    gl.glTexParameterfv(GL_TEXTURE_2D, GL_TEXTURE_BORDER_COLOR, redColor, 0);

    ```


    The effect of each of these options (mirrored repeat, clamp to edge, and clamp
    to border), with texture coordinates ranging from −2 to +3, are shown, respectively
    (left to right), in Figure 5.15.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_146_0.png)


    In the center example (clamp to edge), the pixels along the edges of the texture
    image are replicated outward. Note that as a side effect, the lower-left and lower-right
    regions of the pyramid faces obtain their color from the lower-left and lower-right
    pixels of the texture image, respectively.


    # 5.5.1 PERSPECTIVE DISTORTION


    We have seen that as texture coordinates are passed from the vertex shader to
    the fragment shader, they are interpolated as they pass through the rasterizer.
    We have also seen that this is the result of the automatic linear interpolation
    that is always performed on vertex attributes.


    However, in the case of texture coordinates, linear interpolation can lead to
    noticeable distortion in a 3D scene with perspective projection.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "Consider a rectangle made of two triangles and textured with a checkerboard\
    \ image, facing the camera. As the rectangle is rotated around the *X* axis, the\
    \ top part of the rectangle tilts away from the camera, while the lower part of\
    \ the rectangle swings closer to the camera. Thus, we would expect the squares\
    \ at the top to become smaller and the squares at the bottom to become larger.\
    \ However, linear interpolation of the texture coordinates will instead cause\
    \ the height of *all* squares to be equal. The distortion is exacerbated along\
    \ the diagonal defining the two triangles that make up the rectangle. The resulting\
    \ distortion is shown in Figure 5.16.\n\nFortunately, there are algorithms for\
    \ correcting perspective distortion, and by default, OpenGL applies a *perspective\
    \ correction* algorithm [OP14, SP16] during rasterization. Figure 5.17 shows the\
    \ same rotating checkerboard, properly rendered by OpenGL.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_147_0.png)\n\
    \n**Figure 5.16**\ntexture perspective distortion.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_147_1.png)\n\
    \n**Figure 5.17**\nOpenGL perspective correction.\n\nAlthough not common, it is\
    \ possible to disable OpenGL's perspective correction by adding the keyword “noperspective”\
    \ in the declaration of the vertex attribute containing the texture coordinates.\
    \ This has to be done in both the vertex and fragment shaders. For example, the\
    \ vertex attribute in the vertex shader of Program 5.1 would be declared as follows:\n\
    \n```\n    noperspective out vec2 tc;\n```\n\nThe corresponding attribute in the\
    \ fragment shader would be declared\n\n```\n    noperspective in vec2 tc;\n```\n\
    \nThis second syntax was in fact used to produce the distorted checkerboard in\
    \ Figure 5.16."
  merge: -1
