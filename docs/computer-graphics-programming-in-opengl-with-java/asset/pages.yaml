  md: "The wood rings in Figure 14.18 are a good start, but they don't look very realistic—they\
    \ are too perfect. To improve this, we use the noise map (more specifically, turbulence)\
    \ to perturb the distanceFromZ variable so that the rings have slight variations.\
    \ The computation is modified as follows:\n\n```\n~~~c\nmaxZoom = 32.0;\ndouble\
    \ distanceFromZ = Math.sqrt(xValue * xValue + yValue * yValue)\n    + turbPower\
    \ * turbulence(i, j, k, maxZoom) / 256.0;\n~~~\n```\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_361_0.png)\n\
    \n**Figure 14.18**\nCreating rings for 3D wood texture.\n\nAgain, the variable\
    \ turbPower adjusts how much turbulence is applied (setting it to 0.0 results\
    \ in the unperturbed version shown in Figure 14.18), and maxZoom specifies the\
    \ zoom value (32, in this example). Figure 14.19 shows the resulting wood textures\
    \ for turbPower values 0.05, 1.0, and 2.0 (left to right).\n\nWe can now apply\
    \ the 3D wood texture map to a model. The realism of the texture can be further\
    \ enhanced by applying a rotation to the originalPosition vertex locations used\
    \ for texture coordinates; this is because most items carved out of wood don't\
    \ perfectly align with the orientation of the rings. To accomplish this, we add\
    \ an additional rotation matrix to the shaders for rotating the texture coordinates.\
    \ We also add Phong shading, with appropriate wood-color ADS values, and a modest\
    \ level of shininess. The complete additions and changes for creating a \"wood\
    \ dolphin\" are shown in Program 14.6.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_361_1.png)\n\
    \n**Figure 14.19**\n\"Wood\" 3D texture maps with rings perturbed by noise map."
