    vectors \(\vec{V}\) and \(\vec{W}\). Since vectors can be moved without changing
    their meaning, they can be moved so that their origins coincide. Figure 3.7 shows
    a plane defined by \(\vec{V}\) and \(\vec{W}\), and the normal vector resulting
    from their cross product. The direction of the resulting normal obeys the right-hand
    rule, wherein'
