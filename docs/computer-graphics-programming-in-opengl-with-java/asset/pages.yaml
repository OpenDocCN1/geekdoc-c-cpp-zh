    reflection off of the water.


    # SUPPLEMENTAL NOTES


    Throughout this chapter, we avoided JOGL’s texturing tools when building our cube
    map. However, using JOGL’s TextureIO and TextureData classes for this purpose
    can dramatically shorten the code in the loadCubeMap() function. This is done
    by first creating the texture cube map:


    ```

    Texture tex = new Texture(GL_TEXTURE_CUBE_MAP);

