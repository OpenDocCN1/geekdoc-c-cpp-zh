    Torus model.


    **Figure 2.8**

    Torus modified in geometry shader.


    It might seem redundant to provide a per-primitive shader stage, when the tessellation
    stage(s) give the programmer access to *all* of the vertices in an entire model
    simultaneously. The difference is that tessellation only offers this capability
    in very limited circumstances—specifically when the model is a grid of triangles
    generated by the tessellator. It does not provide such simultaneous access to
    all the vertices of, say, an arbitrary model being sent in from Java through a
    buffer.


    # ### 2.1.5 Rasterization


    Ultimately, our 3D world of vertices, triangles, colors, and so on needs to be
    displayed on a 2D monitor. That 2D monitor screen is made up of a *raster*—a rectangular
    array of pixels.


    When a 3D object is *rasterized*, OpenGL converts the primitives in the object
    (usually triangles) into *fragments*. A fragment holds the information associated
    with a pixel. Rasterization determines the locations of pixels that need to be
    drawn in order to produce the triangle specified by its three vertices.


    Rasterization starts by interpolating, pairwise, between the three vertices of
    the triangle. There are some options for doing this interpolation; for now it
    is sufficient to consider simple linear interpolation as shown in Figure 2.9.
    The original three vertices are shown in red.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_37_2.png)


    **Figure 2.9**

    Rasterization (step 1).'
