  md: '$\begin{bmatrix} Aa+Be+Ci+Dm & Ab+Bf+Cj+Dn & Ac+Bg+Ck+Do & Ad+Bh+Cl+Dp \\ Ea+Fe+Gi+Hm
    & Eb+Ff+Gj+Hn & Ec+Fg+Gk+Ho & Ed+Fh+Gl+Hp \\ Ia+Je+Ki+Lm & Ib+Jf+Kj+Ln & Ic+Jg+Kk+Lo
    & Id+Jh+Kl+Lp \\ Ma+Ne+Oi+Pm & Mb+Nf+Oj+Pn & Mc+Ng+Ok+Po & Md+Nh+Ol+Pp \end{bmatrix}$


    Matrix multiplication is frequently referred to as **concatenation**, because
    as will be seen, it is used to combine a set of matrix transforms into a single
    matrix. This ability to combine matrix transforms is made possible because of
    the **associative** property of matrix multiplication. Consider the following
    sequence of operations:


    New Point = Matrix₁ * (Matrix₂ * (Matrix₃ * Point))


    Here, we multiply a point by Matrix₃, then multiply that result by Matrix₂, and
    that result finally by Matrix₁. The result is a new point. The associative property
    ensures that the above computation is equivalent to


    New Point = (Matrix₁ * Matrix₂ * Matrix₃) * Point


    Here we first multiply the three matrices together, forming the *concatenation*
    of Matrix₁, Matrix₂, and Matrix₃ (which itself is also a 4x4 matrix). If we refer
    to this concatenation as Matrix₍c₎, we can rewrite the above operation as


    New Point = Matrix₍c₎ * Point


    The advantage here, as we will see in Chapter 4, is that we will frequently need
    to apply the same sequence of matrix transformations to every point in our scene.
    By pre-computing the concatenation of all of those matrices once, we can reduce
    the total number of matrix operations needed manyfold.


    GSL and JOML both support matrix multiplication, in GLSL with the overloaded *
    operator, and in JOML with the function Matrix4f.mul(Matrix4f).


    The *inverse* of a 4x4 matrix M is another 4x4 matrix, denoted M⁻¹, that has the
    following property under matrix multiplication:


    M*(M⁻¹) = (M⁻¹)*M = *identity matrix*


    We won’t present the details of computing the inverse here. However, it is worth
    knowing that determining the inverse of a matrix can be computationally'
