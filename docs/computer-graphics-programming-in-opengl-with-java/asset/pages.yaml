- pgno: 498
  md: 'dates back more than 100 years, by Conrady [C19], further refined by Brown
    [B66]. A simplified model (from [W20]) commonly used in VR systems is as follows:


    $$x_u = x_d / (1 + K_1 r^2 + K_2 r^4)$$


    $$y_u = y_d / (1 + K_1 r^2 + K_2 r^4)$$


    where $(x_d, y_d)$ is the original (distorted) texture coordinate location, $(x_u,
    y_u)$ is the corresponding texture coordinate in an undistorted (corrected) version
    of the scene, $r$ is the straight-line distance from $(x_d, y_d)$ to the center
    of the image, and $K_1$ and $K_2$ are tunable constants. Even in this simple model,
    the values for $r$, $K_1$, and $K_2$ require tuning depending on the viewing device,
    and sometimes even for the person doing the viewing. Commonly-used values for
    Google Cardboard are -0.55 for $K_1$, and 0.34 for $K_2$. For $r$, we simply use
    the Pythagorean Theorem to compute a distance, and then scale that distance by
    trial-and-error to come up with a reasonably effective result. From here on, we
    refer to this barrel distortion as *lens distortion correction*.


    Program 17.3 shows the changes made to Program 17.2 to render each half screen
    with lens distortion correction, roughly tuned for Google Cardboard. Note that
    the existing shaders (unchanged) now render to framebuffer textures, and a new
    second set of shaders is added to do the final lens distortion correction of these
    framebuffer textures to their respective half screens. Additional discussion follows
    the code. The resulting output is shown in Figure 17.9.


    # Program 17.3 Side-by-Side Rendering with Lens Distortion Correction


    Java/JOGL Application


