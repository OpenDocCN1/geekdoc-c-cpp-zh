- pgno: 108
  md: "![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_108_0.png)\n\n**Figure 4.11**  \n\
    Animated planetary system.  \n*Source:* Sun and earth textures are from [HT12];\
    \ the moon texture is from [NA21].\n\nIt turns out that we can do this fairly\
    \ easily with a *matrix stack*. A matrix stack is, as its name implies, a stack\
    \ of transformation matrices. As we will see, matrix stacks make it easy to create\
    \ and manage complex hierarchical objects and scenes, where transforms can be\
    \ built upon (and removed from) other transforms.\n\nOpenGL has a built-in matrix\
    \ stack, but as part of the older fixed-function (nonprogrammable) pipeline it\
    \ has long been deprecated. It was nicely devised and convenient to use, and happily\
    \ a similar Java class is available in JOML, called Matrix4fStack, patterned after\
    \ the one that became popular in older versions of OpenGL [OL16]. As we will see,\
    \ many of the model, view, and model-view matrices that would normally be needed\
    \ in a complex scene can be replaced by a single instance of Matrix4fStack.\n\n\
    We will first examine the basic commands for instantiating and utilizing a matrix\
    \ stack, then use Matrix4fStack to build a complex animated scene. Some important\
    \ Matrix4fStack functions include the following:\n\n+   - `pushMatrix()`—makes\
    \ a copy of the top matrix and pushes the copy onto the stack\n+   - `popMatrix()`—removes\
    \ and returns the top matrix\n+   - `get(v)`—copies values in the topmost matrix\
    \ to buffer v and returns a reference to the buffer (the topmost matrix is not\
    \ removed from the stack)\n+   - `rotate(x,y,z)`\n+   - `scale(x,y,z)`\n+   -\
    \ `translate(x,y,z)` — apply directly to the top matrix in the stack"
