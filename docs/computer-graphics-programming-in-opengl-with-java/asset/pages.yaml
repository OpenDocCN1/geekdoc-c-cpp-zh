- pgno: 143
  md: 'Mipmapping is richly supported in OpenGL. There are mechanisms provided for
    building your own mipmap levels or having OpenGL build them for you. In most cases,
    the mipmaps built automatically by OpenGL are sufficient. This is done by adding
    the following lines of code to the Utils.loadTexture() function (described earlier
    in Section 5.1), immediately after the getTextureObject() function call:


    ```

    gl.glBindTexture(GL_TEXTURE_2D, textureID);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);

    gl.glGenerateMipmap(GL_TEXTURE_2D);

    ```


    This tells OpenGL to generate the mipmaps. The brick texture is made active with
    the glBindTexture() call, and then the glTexParameteri() function call enables
    one of the minification factors listed above, such as GL_LINEAR_MIPMAP_LINEAR
    shown in the above call, which enables trilinear filtering.


    Once the mipmap is built, the filtering option can be changed (although this is
    rarely necessary) by calling glTexParameteri() again, such as in the display function.
    Mipmapping can even be disabled by selecting GL_NEAREST or GL_LINEAR.


    For critical applications, it is possible to build the mipmaps yourself, using
    whatever is your preferred image editing software. They can then be added as mipmap
    levels when creating the texture object by repeatedly calling OpenGL''s glTexImage2D()
    function, or JOGL''s updateSubImage() function, for each mipmap level. Further
    discussion of this approach is outside the scope of this book.


    # ## 5.9 ANISOTROPIC FILTERING


    Mipmapped textures can sometimes appear more blurry than non-mipmapped textures,
    especially when the textured object is rendered at a heavily tilted viewing angle.
    We saw an example of this back in Figure 5.9, where reducing artifacts with mipmapping
    led to reduced detail (compared with Figure 5.8).


    This loss of detail occurs because when an object is tilted, its primitives appear
    smaller along one axis (i.e., width vs. height) than along the other. When OpenGL
    textures a primitive, it selects the mipmap appropriate for the smaller of the
    two axes (to avoid “sparkling” artifacts). In Figure 5.9 the surface is tilted
    heavily away from the viewer, so each rendered primitive will utilize the mipmap
    appropriate for its reduced height, which is likely to have a resolution lower
    than appropriate for its width.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "One way of restoring some of this lost detail is to use *anisotropic filtering*\
    \ (AF). Whereas standard mipmapping samples a texture image at a variety of square\
    \ resolutions (e.g., 256x256, 128x128, etc.), AF samples the textures at a number\
    \ of rectangular resolutions as well, such as 256x128, 64x128, and so on. This\
    \ enables viewing at various angles while retaining as much detail in the texture\
    \ as possible.\n\nAnisotropic filtering is more computationally expensive than\
    \ standard mipmapping, and is not a required part of OpenGL. However, most graphics\
    \ cards support AF (this is referred to as an *OpenGL extension*), and OpenGL\
    \ does provide both a way of querying the card to see if it supports AF and a\
    \ way of accessing AF if it does. The code is added immediately after generating\
    \ the mipmap:\n\n```\n...\n// if mipmapping\ngl.glBindTexture(GL_TEXTURE_2D, textureID);\n\
    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);\n\
    gl.glGenerateMipmap(GL_TEXTURE_2D);\n\n// if also anisotropic filtering\nif (gl.isExtensionAvailable(\"\
    GL_EXT_texture_filter_anisotropic\"))\n{\n    float anisotSetting[] = new float[1];\n\
    \    gl.glGetFloatv(GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT, anisoSetting, 0);\n   \
    \ gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAX_ANISOTROPY_EXT, anisoSetting[0]);\n\
    }\n```\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_144_0.png)\n\nThe call to gl.isExtensionAvailable()\
    \ tests whether the graphics card supports AF. If it does, we set it to the maximum\
    \ degree of mipmapping supported, a value retrieved using glGetFloatv() as shown.\
    \ It is then applied to the active texture object using glTexParameterf(). The\
    \ result is shown in Figure 5.13. Note that much of the lost detail from Figure\
    \ 5.8 has been restored, while still removing the sparkling artifacts.\n\n**Figure\
    \ 5.13**\nAnisotropic filtering.\n\n# 5.10 WRAPPING AND TILING\n\nSo far we have\
    \ assumed that texture coordinates all fall in the range (0,1). However, OpenGL\
    \ actually supports texture coordinates of any value. There are"
  merge: -1
  img_proc: true
- pgno: 145
  md: 'several options for specifying what happens when texture coordinates fall outside

    the range (0,1). The desired behavior is set using glTexParameteri(), and some
    of the

    options are as follows:


    +   - **GL_REPEAT**: The integer portion of the texture coordinates are ignored,

    +     generating a repeating or “tiling” pattern. This is the default behavior.

    +   - **GL_MIRRORED_REPEAT**: The integer portion is ignored, except that the

    +     coordinates are reversed when the integer portion is odd, so the repeating

    +     pattern alternates between normal and mirrored.

    +   - **GL_CLAMP_TO_EDGE**: Coordinates less than 0 and greater than 1 are set

    +     to 0 and 1, respectively.

    +   - **GL_CLAMP_TO_BORDER**: Texels outside of (0,1) will be assigned some

    +     specified border color.


    For example, consider a pyramid in which the texture coordinates have

    been defined in the range (0,5) rather than the range (0,1). The default behavior

    (GL_REPEAT), using the texture image shown previously in Figure 5.2, would

    result in the texture repeating five times across the surface (sometimes called

    “tiling”), as shown in Figure 5.14.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_145_0.png)


    **Figure 5.14**

    Texture coordinate wrapping with GL_REPEAT.


    To make the tiles’ appearance alternate between normal and mirrored, we can

    specify the following:


    ```

    ```

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_MIRRORED_REPEAT);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_MIRRORED_REPEAT);

    ```

    ```


    Specifying that values less than 0 and greater than 1 be set to 0 and 1, respectively,

    can be done by replacing **GL_MIRRORED_REPEAT** with **GL_CLAMP_TO_EDGE**.'
  merge: -1
