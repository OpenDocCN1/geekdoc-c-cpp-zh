  md: '# ## 5.12 LOADING TEXTURE IMAGE FILES USING JAVA AWT CLASSES


    Throughout the rest of this textbook we use the JOGL Texture, TextureIO, and TextureData
    classes as described earlier in this chapter to load texture image data into OpenGL
    texture objects. However, it is possible to load texture image file data into
    OpenGL textures directly, using Java AWT classes and some additional OpenGL commands.
    The process is quite a bit more complicated, so for simplicity and clarity we
    will use the JOGL classes in this book whenever possible. However, it is useful
    to understand the process (and the particular commands) one could use in lieu
    of the JOGL texture classes. For example, the JOGL texture classes don''t support
    3D textures, so as we will see later, building an OpenGL 3D texture object will
    require doing many of the steps ourselves in Java. We will also use some of these
    steps when building skyboxes, as described in Chapter 9.


    Building a texture-loading function analogous to the one in Program 5.1 without
    using JOGL classes is shown in Program 5.2. To avoid confusion, we will call it
    loadTextureAWT().² It starts by calling two utility functions (also shown). The
    first one is getBufferedImage(), which reads the specified image file, assumed
    to be in a recognized format such as .jpg or .png, and returns a Java BufferedImage
    containing the image file data. The second utility function, getRGBAPixelData(),
    extracts the RGBA pixel colors from the specified BufferedImage and returns them
    in a byte array organized in the form expected by OpenGL. It is in this function
    that we may or may not flip the image vertically (specified by a boolean parameter)
    as described earlier, depending on the application.


    The loadTextureAWT() function then continues by copying the byte array returned
    from getRGBAPixelData() into a Java ByteBuffer, using the JOGL Buffers.newDirectByteBuffer()
    method described in Chapter 4. It then creates the texture object, in a manner
    similar to the steps we used for creating VBOs. Textures, like buffers, are given
    integer IDs by calling glGenTextures(). Here, the variable textureID is used to
    hold the ID of a generated texture object. Next, the texture object is made active
    by calling glBindTexture(), and then we load the previously read-in image data
    into the active texture object by using the glTexImage2D() command. Note the first
    parameter on this call specifies the type of texture object—in this case GL_TEXTURE_2D
    (later we will use this command to create other types of'
