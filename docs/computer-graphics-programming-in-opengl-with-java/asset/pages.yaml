  md: 'arrays of strings. This is a clumsy way to code, but it is sufficient in this
    very simple case. The vertex shader is:


    ```

    ```

    #version 430

    void main(void)

    {  gl_Position = vec4(0.0, 0.0, 0.0, 1.0);  }

    ```

    ```


    The first line indicates the OpenGL version, in this case 4.30. There follows
    a "main" function (as we will see, GLSL is somewhat Java-like in syntax). The
    primary purpose of any vertex shader is to send a vertex down the pipeline (which,
    as mentioned before, it does for every vertex). The built-in variable gl_Position
    is used to set a vertex''s coordinate position in 3D space and is sent to the
    next stage in the pipeline. The GLSL datatype vec4 is used to hold a 4-tuple,
    suitable for such coordinates, with the associated four values representing X,
    Y, Z, and a fourth value set here to 1.0 (we will learn the purpose of this fourth
    value in Chapter 3). In this case, the vertex is hardcoded to the origin location
    (0,0,0).


    The vertices move through the pipeline to the rasterizer, where they are transformed
    into pixel locations (or more accurately, fragments—described later). Eventually,
    these pixels (fragments) reach the fragment shader:


    ```

    ```

    #version 430

    out vec4 color;

    void main(void)

    {  color = vec4(0.0, 0.0, 1.0, 1.0);  }

    ```

    ```


    The purpose of any fragment shader is to set the RGB color of a pixel to be displayed.
    In this case the specified output color (0, 0, 1) is blue (the fourth value 1.0
    specifies the level of opacity). Note the "out" tag indicating that the variable
    color is an output. (It wasn''t necessary to specify an "out" tag for gl_Position
    in the vertex shader, because gl_Position is a predefined output variable.)


    There is one detail in the code that we haven''t discussed, in the last two lines
    in the init() function (shown in red). They probably appear a bit cryptic. As
    we will see in Chapter 4, when sets of data are prepared for sending down the
    pipeline, they are organized into buffers. Those buffers are in turn organized
    into Vertex Array Objects (VAOs). In our example, we hardcoded a single point
    in the vertex shader, so we didn''t need any buffers. However, OpenGL still requires
    at least one VAO to be created whenever shaders are being used, even if the application
    isn''t using any buffers. So the two lines create the required VAO.'
