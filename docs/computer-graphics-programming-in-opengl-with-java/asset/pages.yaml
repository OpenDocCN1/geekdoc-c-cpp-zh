    Building a torus class in Java/JOGL could be done in a virtually identical manner
    as for the Sphere class. However, we have the opportunity to take advantage of
    the indices that we created while building the torus by using OpenGL’s support
    for vertex indexing (we could have also done this for the sphere, but we didn’t).
    For very large models with thousands of vertices, using OpenGL indexing can result
    in improved performance, and so we will describe how to do that next.


    # ### 6.2.2 Indexing in OpenGL


    In both our sphere and torus models, we generate an array of integer indexes referencing
    into the vertex array. In the case of the sphere, we used the list of indices
    to build a complete set of individual vertices and loaded them into a VBO just
    as we did for examples in earlier chapters. Instantiating the torus and loading
    its vertices, normals, etc. into buffers could be done in a similar manner as
    was done in Program 6.1, but instead we will use OpenGL’s indexing.


    When using OpenGL indexing, we also load the indices themselves into a VBO. We
    generate one additional VBO for holding the indices. Since each index value is
    simply an integer reference, we first copy the index array into a Java IntBuffer,
    and then use glBufferData() to load the IntBuffer into the added VBO, specifying
    that the VBO is of type GL_ELEMENT_ARRAY_BUFFER (this tells OpenGL that the VBO
    contains indices). The code that does this can be added to setupVertices():


