  md: 'computed as the sum of the ambient contribution at that pixel, plus six-ninths
    of the diffuse and specular contributions, resulting in a fairly (but not completely)
    brightened pixel. Repeating this process throughout the grid would produce pixel
    colors approximately as shown in Figure 8.20. Note that for those pixels whose
    neighborhoods are entirely in (or out of) shadow, the resulting color is the same
    as for standard shadow mapping.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_233_0.png)


    Unlike the example just shown, implementations of PCF do not sample every pixel
    within a certain vicinity of the pixel being rendered. There are two reasons for
    this: (a) we’d like to perform this computation in the fragment shader, but the
    fragment shader does not have access to other pixels, and (b) obtaining a sufficiently
    broad penumbra effect (say, 10 to 20 pixels wide) would require sampling hundreds
    of nearby pixels for each pixel being rendered.


    PCF addresses these two issues as follows. First, rather than attempting to access
    nearby pixels, we instead sample nearby texels in the shadow map. The fragment
    shader can do this because even though it doesn’t have access to nearby pixel
    values, it does have access to the entire shadow map. Second, to achieve a sufficiently
    broad penumbra effect, a moderate number of nearby shadow map texels are sampled,
    each at some modest distance from the texel corresponding to the pixel being rendered.


    The width of the penumbra and the number of points sampled can be tuned depending
    on the scene and performance requirements. For example, the image shown in Figure
    8.21 was generated using PCF, with each pixel’s brightness determined by sampling
    64 nearby shadow map texels at various distances from the pixel’s texel.


    The accuracy or smoothness of our soft shadows depends on the number of nearby
    texels sampled. Thus, there is a tradeoff between performance and quality—the
    more points sampled, the better the results, but the more computational overhead
    is incurred. Depending on the complexity of the scene and the frame rate required
    for a given application, there is often a corresponding practical limit to the
    quality that


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_233_1.png)'
