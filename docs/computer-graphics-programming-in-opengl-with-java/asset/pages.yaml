    ]\n```\n\n# ### 3.3.3 Rotation\n\nRotation is a bit more complex, because rotating\
    \ an item in 3D space requires specifying (a) an axis of rotation and (b) a rotation\
    \ amount in degrees or radians.\n\nIn the mid-1700s, the mathematician Leonhard\
    \ Euler showed that a rotation around any desired axis could be specified instead\
    \ as a combination of rotations around the X, Y, and Z axes [EU76]. These three\
    \ rotation angles, around the respective axes, have come to be known as *Euler\
    \ angles*. The discovery, known as *Euler's Theorem*, is very useful to us, because\
    \ rotations around each of the three axes can be specified using matrix transforms.\n\
    \nThe three rotation transforms, around the X, Y, and Z axes, respectively, are\
    \ shown in Figure 3.5. There are several functions in JOML for building and using\
    \ rotation matrices as well:\n\n+   * Matrix4f.rotateX(radians)\n+   * Matrix4f.rotateY(radians)\n\
    +   * Matrix4f.rotateZ(radians)\n+   * Matrix4f.rotateXYZ(θx, θy, θz)\n+   * Vector4f.mul(Matrix4f)\
    \ or Vector3f.mulPosition(Matrix4f)\n\nIn practice, using Euler angles to rotate\
    \ an item around an arbitrary line in 3D space takes a couple of additional steps\
    \ if the line doesn't pass through the origin. In general:\n\n+   1. Translate\
    \ the axis of rotation so that it goes through the origin.\n+   2. Rotate by appropriate\
    \ Euler angles around X, Y, and Z.\n+   3. Undo the translation of Step 1."
