  md: 'As mentioned in this chapter, when using Java buffers it is advisable to ensure
    that only direct buffers are used. For example, it is tempting to use the Java
    FloatBuffer.wrap() function to put vertex data stored in an array into a buffer.
    However, wrap() produces a *non-direct* buffer, in which the resulting buffer
    is a wrapper for data that is still stored in an array.⁶ One approach for copying
    the data into a *direct* buffer is to allocate a direct ByteBuffer, use ByteBuffer.asFloatBuffer()
    to view it as a FloatBuffer, and then use a loop with the put() command to copy
    the data one at a time. As described earlier, the JOGL com.jogamp.common.nio.Buffers
    class makes it easier to populate direct buffers by providing convenience methods
    for loading array data into a variety of buffer types:


    +   - `newDirectByteBuffer(byte[ ])`

    +   - `newDirectCharBuffer(char[ ])`

    +   - `newDirectDoubleBuffer(double[ ])`

    +   - `newDirectFloatBuffer(float[ ])`

    +   - `newDirectIntBuffer(int[ ])`

    +   - `newDirectLongBuffer(long[ ])`

    +   - `newDirectShortBuffer(short[ ])`


    Using the above JOGL methods for populating buffers with vertex data (that is,
    data intended to be used by JOGL applications) also insures correct native byte
    ordering. It also ensures correct size allocation and makes an explicit allocation
    unnecessary.


    There is a myriad of other capabilities and structures available for managing
    and utilizing data in OpenGL/JOGL/GLSL, and we have only scratched the surface
    in this chapter. We haven’t, for example, described a *uniform block*, which is
    a mechanism for organizing uniform variables similar to a *struct* in C. Uniform
    blocks can even be set up to receive data from buffers. Another powerful mechanism
    is a *shader storage block*, which is essentially a buffer into which a shader
    can write.


    An excellent reference on the many options for managing data (albeit in C++) is
    the *OpenGL SuperBible* [SW15], particularly the chapter entitled “Data” (Chapter
    5 in the seventh edition). It also describes many of the details and options


    ⁶ Using non-direct buffers is actually allowable in JOGL. However, when a non-direct
    buffer is passed to a JOGL method, JOGL will convert it to a direct buffer, and
    this conversion incurs a performance penalty.'
