    \ 1.0);\n   float fogStart = 10.0;\n   float fogEnd = 300.0;\n   float dist =\
    \ length(varyingVertPos.xyz);\n   float fogFactor = clamp((fogEnd-dist) / (fogEnd-fogStart),\
    \ 0.0, 1.0);\n\n   ...\n   // angle between normal vector and view vector (for\
    \ Fresnel effect)\n   vec3 Nfres = normalize(varyingNormal);\n   float cosFres\
