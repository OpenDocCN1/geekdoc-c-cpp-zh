  md: "```\n```cpp\nfloat refraction_ratio = 0.66667;\nif (c.inside) refraction_ratio\
    \ = 1.5; // 1.0 / refraction_ratio, when ray exits the sphere\n    refracted_ray.dir\
    \ = refract(r.dir, c.n, refraction_ratio);\n    // Add a raytrace for that ray\
    \ to the stack\n    pushRefracted_ray(stack[index].depth+1, RAY_TYPE_REFRACTION);\n\
    }\nbreak;\n// ========== PHASE 5 - mixing\ncase 5:\n    if (c.object_index ==\
    \ 1) // for the sphere, blend refraction, refraction, and lighting\n    { stack[index].final_color\
    \ = stack[index].phong_color *\n        (0.3 * stack[index].reflected_color) +\
    \ (2.0 * (stack[index].refracted_color));\n    }\n    if (c.object_index == 2)\
    \ // for the box, blend reflection, lighting, and texture\n    { stack[index].final_color\
    \ = stack[index].phong_color *\n        ((0.5 * stack[index].reflected_color)\
    \ + (1.0 * (texture(sampMarble, c.tc).xyz));\n    }\n    if (c.object_index ==\
    \ 3) stack[index].final_color = stack[index].phong_color * rbox_color;\n    if\
    \ (c.object_index == 4) stack[index].final_color = stack[index].phong_color *\n\
    \        (checkerboard(c.tc).xyz);\n    break;\n// ========== when all five phases\
    \ are complete, end the recursion\ncase 6:\n    popped_stack_element = pop();\n\
    \    return;\n}\nstack[index].phase++;\nreturn; // only process one phase per\
    \ process_stack_element() invocation\n}\n\n// This is the \"driver\" function\
    \ that sends out the first ray,\n// and then processes secondary rays until all\
    \ have completed\nvec3 traceRay(Ray r)\n{ push(r, 0, RAY_TYPE_REFLECTION);\n \
    \   while (stack_pointer >= 0)\n    { int element_index = stack_pointer; // process\
    \ the stack until it is empty\n        process_stack_element(element_index); //\
    \ peek at the topmost stack element\n    } // process next phase of the current\
    \ stack element\n    return popped_stack_element.final_color; // final color of\
    \ the last-popped stack element\n}\n```\n```"
