- pgno: 49
  md: 'That is, the GLCanvas has its own display() function. If we call it, the GLCanvas
    will then in turn call back the display() function in our Java/JOGL application.
    Technically, the two display()s are completely different functions, but they are
    intertwined.


    One approach is to call display() whenever a change in the scene occurs. In a
    complex scene, this can become unwieldy. A better approach is to make this call
    repeatedly, without regard to whether or not anything in the scene has changed,
    and have our display() function alter what it draws over time. While this may
    at first seem inefficient, it actually leads to a more efficient and responsive
    program. Each rendering of our scene is then called a *frame*, and the frequency
    of calls to display() is the *frame rate*.


    There are many ways to organize the code for animating a scene. One way is to
    create an “animator” class in Java, using either Timer, or Thread.sleep(), or
    better yet, a ScheduledThreadPoolExecutor.


    An even simpler way to build the animator is to use one of the JOGL-specific animator
    classes:


    +   - Animator

    +   - FPSAnimator


    These classes are designed specifically for animating 3D scenes. An FPSAnimator
    (“FPS” stands for “frames per second”), when instantiated, calls the display()
    function on a drawable object repeatedly, at a specified frame rate. An Animator
    (without the “FPS”), when instantiated, calls the display() function repeatedly,
    but not at any particular frame rate. The developers of JOGL recommend using Animator
    (instead of FPSAnimator), and handling the rate of movement within the application
    logic based on the elapsed time since the previous frame. Hence, that is how we
    will write our programs that are animated.


    An example is shown in Program 2.6. We have taken the triangle from Program 2.5
    and animated it so that it moves to the right, then moves to the left, back and
    forth. The Animator is instantiated by the Java/JOGL application in its constructor;
    the parameter on the Animator constructor call specifies the drawable object.
    After that, the application is free to make changes to the scene within the display()
    function. In this example, we don’t consider the elapsed time, so the triangle
    may move more or less quickly depending on the speed of the computer (in future
    examples, we will use the elapsed time to ensure that they run at the same speed
    regardless of the computer).'
