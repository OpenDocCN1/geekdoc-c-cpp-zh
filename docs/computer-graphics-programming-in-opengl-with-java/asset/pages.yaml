- pgno: 477
  md: 'The result is shown in Figure 16.24.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_477_0.png)


    **Figure 16.24** A scene with three overlapping colored light sources, colors
    added together.


    To most people new to color models, Figure 16.24 looks very strange (it looks
    even stranger with red/yellow/blue panes – try it!). The red and blue planes combine
    to form a sort of light purple called *magenta*, which probably seems fairly reasonable
    – but few people expect red and green would combine to make yellow. And yet, if
    these panes were *light sources*, believe it or not, this is much closer to what
    would actually happen in the real world. Note, for example, that at the very center,
    all three red/green/blue primary light colors have been added together, resulting
    in full spectrum white light. So the RGB additive color model, when used to blend
    colors by adding them, is accurate when we use it to blend colored light sources.


    But what if we want to model colored objects that aren’t light sources, but are
    instead passive colored objects responding to white light sources, such as a colored
    window pane or a pair of orange sunglasses? It turns out that the additive RGB
    model is quite clumsy for this task.


    If colored transparent objects are desired, rather than light sources, one option
    is to switch to a *subtractive* color model, such as CMY (cyan/magenta/yellow).
    Whereas RGB is designed for computer monitors composed of tiny red, blue, and
    green light emitters, CMY is commonly used for printers that mix ink to build'
  merge: -1
  img_proc: true
- pgno: 478
  md: 'colors. In RGB, [0,0,0] is black and [1,1,1] is white, whereas in CMY, [0,0,0]
    is white and [1,1,1] is black. Thus adding colors together in CMY makes them darker.
    This models the real-world observation that when two pigments (such as paint)
    are mixed together, the resulting substance subtracts out more of the surrounding
    light and becomes darker. That’s why the model is called subtractive: the values
    indicate the amount of light removed from surrounding light sources, even though
    we still combine colors by adding them together.


    It is easy to convert back and forth between RGB and CMY by *inverting* the colors
    (subtracting them from [1,1,1] or white). One way of blending colors using CMY
    is to invert the RGB colors to generate CMY versions, add them, and then convert
    back to RGB:


    color1_CMY = vec3(1,1,1) − color1_RGB

    color2_CMY = vec3(1,1,1) − color2_RGB

    blend_CMY = color1_CMY + color2_CMY

    result_RGB = vec3(1,1,1) − blend_CMY


    This works quite well if the colors of our panes are magenta (RGB=[1,0,1]), yellow
    (RGB=[1,1,0]), and cyan (RGB=[0,1,1]). Note that it is often necessary to scale
    the results down so that the final RGB color values don’t exceed 1.0. Figure 16.25
    shows the resulting blends of colors produced by adding their CMY values.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_478_0.png)


    **Figure 16.25**

    Adding cyan, magenta, and yellow panes in CMY color space.'
  merge: -1
  img_proc: true
