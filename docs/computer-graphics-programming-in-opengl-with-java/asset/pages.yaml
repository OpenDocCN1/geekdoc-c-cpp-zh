  md: "Finding the boundaries of the projection plane in the asymmetric case can be\
    \ accomplished using a bit of geometry, given the field of view, aspect ratio,\
    \ and near and far clipping planes that we have already been using. Figure 17.4\
    \ defines Java/JOGL function `computePerspectiveMatrix()` that does this. The\
    \ parameter `leftRight` is set to -1 for the left eye and +1 for the right eye.\
    \ All other variables are allocated globally (as before), for reasons of efficiency.\
    \ The result is placed in the variable `pMat`.\n\n```\n```java\nprivate void computePerspectiveMatrix(float\
    \ leftRight)\n{\n    float top = (float)Math.tan(fov/2.0f) * (float)near;\n  \
    \  float bottom = -top;\n    float frustumShift = (IOD / 2.0f) * near / far;\n\
    \    float left = -aspect * top - frustumShift * leftRight;\n    float right =\
    \ aspect * top - frustumShift * leftRight;\n    pMat.setFrustum(left, right, bottom,\
    \ top, near, far);\n}\n```\n```\n\n**Figure 17.4**  \nJava/JOGL function for computing\
    \ an asymmetric perspective matrix.\n\n# 17.2 ANAGLYPH RENDERING\n\nRendering\
    \ an anaglyph 3D version of a scene for viewing with red-blue or red-cyan glasses\
    \ is basically the same as we have been doing, except that we need to render the\
    \ scene *twice*, once for the left eye and once for the right eye. One of these\
    \ renderings uses only the red portion of RGB color palette (the *red channel*),\
    \ and the other renders the green and blue channels (combining green and blue\
    \ in RGB color space produces cyan). The two renderings also each employ their\
    \ own view and perspective matrices. When viewed through red-cyan glasses, the\
    \ brain fuses the two images into a single 3D scene. An overview of the steps\
    \ in display() is as follows:\n\n+   1. Clear the depth and color buffers.\n+\
    \   2. Set the OpenGL color mask to enable only the red channel.\n+   3. Render\
    \ the scene using the view and perspective matrices for the left eye.\n+   4.\
    \ Clear the depth buffer (but not the color buffer).\n+   5. Set the OpenGL color\
    \ mask to enable only the green and blue channels.\n+   6. Render the scene using\
    \ the view and perspective matrices for the right eye."
