  md: '# # PARAMETRIC SURFACES


    +   - 11.1 *Quadratic Bézier Curves* ...... 261

    +   - 11.2 *Cubic Bézier Curves* ...... 263

    +   - 11.3 *Quadratic Bézier Surfaces* ...... 266

    +   - 11.4 *Cubic Bézier Surfaces* ...... 268

    +   - *Supplemental Notes* ...... 270


    While working at the Renault corporation in the 1950s and 1960s, Pierre Bézier
    developed software systems for designing automobile bodies. His programs utilized
    mathematical systems of equations developed earlier by Paul de Casteljau, who
    was working for the competing Citroën automobile manufacturer [BE72, DC63]. The
    de Casteljau equations describe curves using just a few scalar parameters and
    are accompanied by a clever recursive algorithm dubbed “de Casteljau’s algorithm”
    for generating the curves to arbitrary precision. Now known as “Bézier curves”
    and “Bézier surfaces,” these methods are commonly used to efficiently model many
    kinds of curved 3D objects.


    # ## 11.1 QUADRATIC BÉZIER CURVES


    A *Quadratic Bézier curve* is defined by a set of parametric equations that specify
    a particular curved shape using three *control points*, each of which is a point
    in 2D space.¹ Consider, for example, the set of three points [p₀,p₁,p₂] shown
    in Figure 11.1.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_281_0.png)


    ¹ Of course, a curve can exist in 3D space. However, a quadratic curve lies entirely
    within a 2D plane.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_282_0.png)


    Figure 11.2

    Points at parametric position t = 0.75.


    By introducing a parameter t, we can build a system of parametric equations that
    define a curve. The t represents a fraction of the distance along the line segment
    connecting one control point to the next control point. Values for t are within
    the range [0,1] for points along the segment. Figure 11.2 shows one such value,
    t = 0.75, applied to the lines connecting p0-p1 and p1-p2, respectively. Doing
    this defines two new points p01(t) and p12(t) along the two original lines. We
    repeat this process for the line segment connecting the two new points p01(t)
    and p12(t) producing point P(t) where t = 0.75, along the line p01(t)-p12(t).
    P(t) is one of the points on the resulting curve, and for this reason is denoted
    with a capital P.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_282_1.png)


    Figure 11.3

    Building a quadratic Bézier curve.


    Collecting many points P(t) for various values of t generates a curve, as shown
    in Figure 11.3. The more parameter values for t that are sampled, the more points
    P(t) are generated, and the smoother the resulting curve.


    The analytic definition for a quadratic Bézier curve can now be derived. First,
    we note that an arbitrary point p on the line segment p_a p_b connecting two points
    p_a and p_b can be represented in terms of the parameter t as follows:


    $$p_{ab}(t) = t p_b + (1 - t) p_a$$


    Using this, we find the points p01 and p12 (points on p0-p1 and p1-p2, respectively)
    as follows:


    $$p_{01}(t) = t p_1 + (1 - t) p_0$$

    $$p_{12}(t) = t p_2 + (1 - t) p_1$$


    Similarly, a point on the connecting line segment between these points would be


    $$P(t) = t p_{12}(t) + (1 - t) p_{01}(t)$$'
