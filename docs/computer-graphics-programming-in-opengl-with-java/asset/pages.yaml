  md: 'Sending data from a Java/JOGL application to a uniform variable requires the
    following steps: (a) acquire a pointer to the uniform variable, and (b) associate
    a Java float buffer containing the desired values with the acquired uniform pointer.
    Assuming that the linked rendering program is saved in a variable called “renderingProgram”
    the following lines of code would specify that we will be sending model-view and
    projection matrices to the two uniforms mv_matrix and p_matrix in our cube example:


    ```

    mvLoc = gl.glGetUniformLocation(renderingProgram,"mv_matrix");  // get the locations
    of uniforms

    pLoc = gl.glGetUniformLocation(renderingProgram,"p_matrix");    // in the shader
    program

    gl.glUniformMatrix4fv(mvLoc, 1, false, mvMat.get(vals));         // send matrix
    data to the

    gl.glUniformMatrix4fv(pLoc, 1, false, pMat.get(vals));           // uniform variables

    ```


    The above example assumes that we have utilized the JOML utilities to build model-view
    and projection matrix transforms mvMat and pMat, as will be discussed in greater
    detail shortly. They are of type Matrix4f (a JOML class). The JOML function call
    get() copies those matrix values into the float buffer specified in the parameter
    (in this case, “vals”), and returns a reference to that float buffer, which is
    needed by glUniformMatrix4fv() to transfer those matrix values to the uniform
    variable.


    # 4.3 INTERPOLATION OF VERTEX ATTRIBUTES


    It is important to understand how *vertex attributes* are processed in the OpenGL
    pipeline versus how *uniform variables* are processed. Recall that immediately
    before the fragment shader is *rasterization*, where primitives (e.g., triangles)
    defined by vertices are converted to fragments. Rasterization *linearly interpolates
    vertex attribute values* so that the displayed pixels seamlessly connect the modeled
    surfaces.


    By contrast, *uniform* variables behave like initialized constants and remain
    unchanged across each vertex shader invocation (i.e., for each vertex sent from
    the buffer). A uniform variable is not interpolated; it always contains the same
    value regardless of the number of vertices.


    The interpolation done on vertex attributes by the rasterizer is useful in many
    ways. Later, we will use rasterization to interpolate colors, texture coordinates,
    and surface normals. It is important to understand that *all values sent through
    a buffer to a vertex attribute will be interpolated* further down the pipeline.


    We have seen vertex attributes in a vertex shader declared as “in” to indicate
    that they receive values from a buffer. Vertex attributes may instead be declared'
