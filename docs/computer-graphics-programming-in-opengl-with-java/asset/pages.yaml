  md: '# ## 13.2 ALTERING PRIMITIVES


    Geometry shaders are convenient for changing the shape of an object when that
    change can be effected through isolated changes to the primitives (typically triangles).


    Consider, for example, the torus we rendered previously in Figure 7.12. Suppose
    that torus represented an inner tube (such as for a tire), and we want to “inflate”
    it. Simply applying a scale factor in the Java/JOGL code won''t accomplish this,
    because its fundamental shape wouldn''t change. Giving it the appearance of being
    “inflated” requires also making the inner hole smaller as the torus stretches
    into the empty center space.


    One way of doing this would be to add the surface normal vector to each vertex.
