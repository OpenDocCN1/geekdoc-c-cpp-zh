  md: "```\n```cpp\nprivate void fillDataArray(byte data[])\n{\n    double zoom =\
    \ 32.0;\n    for (int i=0; i<noiseWidth; i++)\n    {\n        for (int j=0; j<noiseHeight;\
    \ j++)\n        {\n            for (int k=0; k<noiseDepth; k++)\n            {\n\
    \                data[(i*noiseWidth*noiseHeight*4) + j*(noiseHeight*4) + k*4 +\
    \ 0] =\n                    (byte) (smoothNoise(zoom, i/zoom, j/zoom, k/zoom)\
    \ * 255);\n                data[(i*noiseWidth*noiseHeight*4) + j*(noiseHeight*4)\
    \ + k*4 + 1] =\n                    (byte) (smoothNoise(zoom, i/zoom, j/zoom,\
    \ k/zoom) * 255);\n                data[(i*noiseWidth*noiseHeight*4) + j*(noiseHeight*4)\
    \ + k*4 + 2] =\n                    (byte) (smoothNoise(zoom, i/zoom, j/zoom,\
    \ k/zoom) * 255);\n                data[(i*noiseWidth*noiseHeight*4) + j*(noiseHeight*4)\
    \ + k*4 + 3] = (byte) 255;\n            }\n        }\n    }\n}\n\ndouble smoothNoise(double\
    \ zoom, double x1, double y1, double z1)\n{\n    // fraction of x1, y1, and z1\
    \ (percentage from current block to next block, for this texel)\n    double fracX\
    \ = x1 - (int) x1;\n    double fracY = y1 - (int) y1;\n    double fracZ = z1 -\
    \ (int) z1;\n\n    // indices for neighboring values with wrapping at the ends\n\
    \    double x2 = x1 - 1; if (x2<0) x2 = (Math.round(noiseWidth / zoom)) - 1.0;\n\
    \    double y2 = y1 - 1; if (y2<0) y2 = (Math.round(noiseHeight / zoom)) - 1.0;\n\
    \    double z2 = z1 - 1; if (z2<0) z2 = (Math.round(noiseDepth / zoom)) - 1.0;\n\
    \n    // smooth the noise by interpolating the grayscale intensity along all three\
    \ axes\n    double value = 0.0;\n    value += fracX        * fracY        * fracZ\
    \        * noise[(int)x1][(int)y1][(int)z1];\n    value += (1-fracX)    * fracY\
    \        * fracZ        * noise[(int)x2][(int)y1][(int)z1];\n    value += fracX\
    \        * (1-fracY)    * fracZ        * noise[(int)x1][(int)y2][(int)z1];\n \
    \   value += (1-fracX)    * (1-fracY)    * fracZ        * noise[(int)x2][(int)y2][(int)z1];\n\
    \n    value += fracX        * fracY        * (1-fracZ)    * noise[(int)x1][(int)y1][(int)z2];\n\
    \    value += (1-fracX)    * fracY        * (1-fracZ)    * noise[(int)x2][(int)y1][(int)z2];\n\
    \    value += fracX        * (1-fracY)    * (1-fracZ)    * noise[(int)x1][(int)y2][(int)z2];\n\
    \    value += (1-fracX)    * (1-fracY)    * (1-fracZ)    * noise[(int)x2][(int)y2][(int)z2];\n\
    \    return value;\n}\n```\n```\n\nThe smoothNoise() function computes a grayscale\
    \ value for each texel in the smoothed version of a given noise map by computing\
    \ a weighted average of the eight grayscale values surrounding the texel in the\
    \ corresponding original “blocky” noise map. That is, it averages the color values\
    \ at the eight vertices of the small “block” the texel is in. The weights for\
    \ each of these “neighbor” colors are based on the texel’s distance to each of\
    \ its neighbors, normalized to the range [0..1]. Values at the ends wrap smoothly\
    \ to facilitate tiling."
