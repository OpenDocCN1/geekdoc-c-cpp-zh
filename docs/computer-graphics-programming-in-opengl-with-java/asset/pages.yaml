  md: "# # 6.1 PROCEDURAL MODELS—BUILDING A SPHERE\n\nSome types of objects, such\
    \ as spheres, cones, and so forth, have mathematical definitions that lend themselves\
    \ to algorithmic generation. Consider for example a circle of radius R; coordinates\
    \ of points around its perimeter are well-defined (Figure 6.1).\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_154_0.png)\n\
    \n**Figure 6.1**  \nPoints on a circle.\n\nWe can systematically use our knowledge\
    \ of the geometry of a circle to algorithmically build a sphere model. Our strategy\
    \ is as follows:\n\n+   1. Select a *precision* representing a number of circular\
    \ regions the sphere is divided into. In the left side Figure 6.2, the sphere\
    \ is sliced into four regions.\n+   2. Subdivide the circumference of each circular\
    \ slice into some number of points. See the right side of Figure 6.2. More points\
    \ and horizontal slices produces a more accurate and smoother model of the sphere.\
    \ In our model, *each slice will have the same number of points, including at\
    \ the very top and bottom (where those points are coincident).*\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_154_1.png)\n\
    \n**Figure 6.2**  \nBuilding vertices for a sphere."
  merge: -1
  img_proc: true
