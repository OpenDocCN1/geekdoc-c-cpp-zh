- pgno: 464
  md: 'In Program 16.12, the stack is an array of structs of type StackElement, where
    an instance of StackElement contains all of the information necessary to process
    any given ray. The functions that do the stack pushing and popping – push() and
    pop() – should be straightforward. The size of the stack must be chosen carefully;
    if there are many objects that are both reflective and refractive, the number
    of rays can grow exponentially. However, in practice, many rays terminate due
    to colliding with the skybox before the maximum recursion depth is reached.


    Ray tracing begins in raytrace(). Although all rays require their type to be set
    (reflection or refraction), the type of the initial ray isn''t used – we set it
    to reflection arbitrarily. We then start processing all of the rays in the stack
    (by repeatedly calling process_stack_element()), and in so doing, secondary (and
    subsequent) rays may be generated and added to the stack as well. When all processing
    for a ray has been completed, its final computed color is then made available
    to its “parent” ray, which in turn may utilize it to compute its own color.


    All of this - the “meat” of the raytrace processing - is done in process_stack_element(),
    which is organized as a five-phase series of operations. Each of the phases is
    basically identical to the steps we saw in earlier programs in this chapter. Some
    of the phases don''t require the generation of additional rays (collision detection,
    lighting/shadows, and texturing). However, the reflection and refraction phases
    both require generating a new ray and running process_stack_element() on the new
    ray(s). Since there is no way in GLSL to make such a call recursively, we adjust
    the contents of the current stack element to keep track of where we left off,
    push a new stack element containing the new ray to be processed, and then exit
    process_stack_element(). The driver function – the new version of raytrace() –
    then continues iteratively calling process_stack_element() until every stack element
    (every ray) has had a chance to complete all five phases. The end result is the
    same as if recursion had been available.


    The code in Program 16.12 (the declarations, and the push(), pop(), process_stack_element(),
    and raytrace() functions) replaces the previous raytrace() function (and its “children”
    raytrace2() and raytrace3()) from Program 16.11. The remainder of Program 16.12
    is unchanged from Program 16.11.


    The output of Program 16.12 depends on the max_depth setting. The larger the value,
    the longer the sequence of rays that can be generated. Figure 16.19 shows the
    outputs for max_depth values of 0, 1, 2, 3, and 4.'
  merge: -1
  img_proc: true
