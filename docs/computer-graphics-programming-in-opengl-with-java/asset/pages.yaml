    # SUPPLEMENTAL NOTES


    Even the simple examples given in this chapter require significant computing cycles,
    and the later ones (Programs 16.13, 16.14, and 16.15) run very slowly. On a standard
    laptop, the reader can expect them to take several seconds or more to render,
    especially for large depth of recursion settings. On some machines, the default
    settings for the graphics card may cause OpenGL to time out, crashing the program
    before it has a chance to complete. On a Windows machine, the time limit is typically
    set to 2 seconds, but can be increased by increasing the TdrDelay registry setting.
    Instructions for doing this are widely available on the Web [A19]. The author
    set his timeout to 8 seconds. An appropriate value depends on the machine and
    the application. Be warned that making this change can also make it a bit more
    difficult to stop a runaway graphics process.


    We have tried to write our compute shader code for readability rather than performance;
    e.g., our heavy use of conditionals (“if” statements) can slow execution. Tricks
    for removing conditionals can be found elsewhere [H13].


    There are a few rather obvious things that we have not implemented in our ray
    tracer. One is the ability to rotate the sphere. Of course, if the sphere is a
    solid color or transparent, this is not an issue. However, if it is textured,
    such as in the examples utilizing the earth texture, it would be desirable to
    be able to rotate it to different orientations. Such a rotation can be incorporated
    in the same manner as was done for the box and the plane.'
  merge: -1
  img_proc: true
- pgno: 484
  md: 'Another deficiency is that we have only implemented hard shadows. Soft shadows
    for ray tracing are widely used, we just didn’t cover them here. Many resources
    are available for those interested ([K16], for example).


    Probably the most significant technique that we didn’t cover in this chapter is
    how to perform ray tracing on 3D models constructed as a triangle mesh. Computing
    intersections on triangles is similar to plane intersection, and can be performed
    on all of the triangles that comprise a model. This requires some setup that goes
    beyond what we have covered here, so that the triangles from, say, an .obj file,
    can be sent to the compute shader and then iterated as objects in the scene. This
    topic is beyond the scope of our introductory chapter. Scratchapixel [S16] is
    a nice place to start for those who wish to explore this topic.


    Ray tracing is a very rich topic, and there is a wealth of techniques for enhancing
    realism that we didn’t describe in this brief introduction. The reader is encouraged
    to explore the myriad of textbooks and online resources on ray tracing ([S16]
    is a particularly nice online overview).


    As we saw in Section 16.2, OpenGL has support for blending, including a wide variety
    of ways to blend colors. However, in this chapter, we didn’t utilize the rendering
    pipeline, so we had to blend the colors ourselves.


    Much of the code in this chapter was developed by Luis Gutierrez as part of a
    special project when he was a student at California State University, Sacramento.
    His contributions greatly facilitated our explanations and we appreciate the excellent
    work that he did distilling these topics into manageable-sized code, especially
    his code organization for managing the recursion in the non-recursive language
    of GLSL.


