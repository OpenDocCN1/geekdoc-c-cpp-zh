  md: "# **2.1.7 Pixel Operations**\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_40_0.png)\n\
    \n**Figure 2.13**  \nFragment shader color variation.\n\nAs objects in our scene\
    \ are drawn in the display() function using the glDrawArrays() command, we usually\
    \ expect objects in front to block our view of objects behind them. This also\
    \ extends to the objects themselves, wherein we expect to see the front of an\
    \ object, but generally not the back.\n\nTo achieve this, we need *hidden surface\
    \ removal*, or HSR. OpenGL can perform a variety of HSR operations, depending\
    \ on the effect we want in our scene. And even though this phase is not programmable,\
    \ it is extremely important that we understand how it works. Not only will we\
    \ need to configure it properly; we will later need to carefully manipulate it\
    \ when we add shadows to our scene.\n\nHidden surface removal is accomplished\
    \ by OpenGL through the cleverly coordinated use of two buffers: the *color buffer*\
    \ (which we have discussed previously) and the *depth buffer* (sometimes called\
    \ the *Z-buffer*). Both of these buffers are the same size as the raster—that\
    \ is, there is an entry in each buffer for every pixel on the screen.\n\nAs various\
    \ objects are drawn in a scene, pixel colors are generated by the fragment shader.\
    \ The pixel colors are placed in the color buffer—it is the color buffer that\
    \ is ultimately written to the screen. When multiple objects occupy some of the\
    \ same pixels in the color buffer, a determination must be made as to which pixel\
    \ color(s) are retained, based on which object is nearest the viewer.\n\nHidden\
    \ surface removal is done as follows:\n\n+   - Before a scene is rendered, the\
    \ depth buffer is filled with values representing maximum depth.\n+   - As a pixel\
    \ color is output by the fragment shader, its distance from the viewer is calculated.\n\
    +   - If the computed distance is *less than* the distance stored in the depth\
    \ buffer (for that pixel), then (a) the pixel color replaces the color in the"
