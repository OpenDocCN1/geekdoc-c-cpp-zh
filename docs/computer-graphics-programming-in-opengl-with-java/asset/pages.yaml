  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_244_0.png)


    **Figure 9.4**

    Viewing a scene from inside a skybox.


    It is instructive to carefully examine Figure 9.4 in relation to the previous
    Figures 9.2 and 9.3. Note that the portion of the skybox that is visible in the
    scene is the rightmost section of the cube map. This is because the camera has
    been placed in the default orientation, facing in the negative Z direction, and
    is therefore looking at the *back* of the skybox cube (and so labeled in Figure
    9.3). Also note that this back portion of the cube map appears horizontally reversed
    when rendered in the scene, because the cube map is being viewed from the inside
    of the cube. For example, see how the “back” (-Z) portion of the cube map has
    been folded around the camera and thus appears flipped sideways, as shown in Figure
    9.2.


    +   - How do we construct the texture cube map?


    Building a texture cube map image, from artwork or photos, requires care to avoid
    “seams” at the cube face junctions and to create proper perspective so that the
    skybox will appear realistic and undistorted. Many tools exist for assisting in
    this regard: Terragen, Autodesk 3ds Max, Blender, and Adobe Photoshop have tools
    for building or working with cube maps. There are also many websites offering
    a variety of off-the-shelf cube maps—some for a price, some for free.


    # ### 9.2.2 SKYDOMES


    Another way of building a horizon effect is to use a *skydome*. The basic idea
    is the same as for a skybox, except that instead of using a textured cube, we
    use a textured *sphere* (or half a sphere). As was done for the skybox, we render
    the skydome first (with depth testing disabled) and keep the camera positioned
    at'
