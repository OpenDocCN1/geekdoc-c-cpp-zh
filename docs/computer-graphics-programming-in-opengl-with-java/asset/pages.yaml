    # ### 15.5 ADDING SURFACE WAVES


    So far, our simulated water has been perfectly still. We now add movement to the
    water''s surface. There are many ways to do this, depending on whether we wish
    to simulate tiny ripples, random effects from wind, current flow, or ocean waves.
    In our example, we simulate modest waves such as might appear if there were a
    slight breeze, by combining the *normal mapping* technique previously covered
    in Chapter 10, with a *noise map*. Since waves are not entirely random, the noise
    map we build for our water''s surface will be a combination of the noise that
    we generated previously in Chapter 14, with the regularity of a sine wave. The
    noise map will then serve as a sort of height map, but note that we are *not*
    going to actually modify the water surface geometry as is typically done in height
    mapping; rather, we will modify the normal vectors (in a manner similar to normal
    mapping) to make it appear that way. (Techniques exist for actually modifying
    surface geometry; for example, a geometry shader could be used, as we studied
    previously in Chapter 13.)'
