- pgno: 356
  md: "We start by generating a striped pattern somewhat similar to the “stripes”\
    \ example from earlier in this chapter—the new stripes differ from the previous\
    \ ones, first because they are diagonal, and also because they are produced by\
    \ a sine wave and therefore have blurry edges. We then use the noise map to perturb\
    \ those lines, storing them as grayscale values. The changes to the fillDataArray()\
    \ function are as follows:\n\n```\n~~~java\nprivate void fillDataArray(byte data[])\n\
    {\n  double veinFrequency = 2.0;\n  double turbPower = 1.5;\n  double maxZoom\
    \ = 64;\n  for (int i=0; i<noiseWidth; i++)\n  {\n    for (int j=0; j<noiseHeight;\
    \ j++)\n    {\n      for (int k=0; k<noiseDepth; k++)\n      {\n        double\
    \ xyzValue = (float) i / noiseWidth + (float) j / noiseHeight + (float)k / noiseDepth\n\
    \            * turbPower * turbulence(j,k,maxZoom) / 256.0;\n        double sineValue\
    \ = Math.abs(Math.sin(xyzValue * 3.14159 * veinFrequency));\n        Color c =\
    \ new Color(sineValue, sineValue, sineValue);\n        data[(noiseWidth*noiseHeight*4*i)+(noiseHeight*4*j)+4*k+0]\
    \ = (byte) c.getRed();\n        data[(noiseWidth*noiseHeight*4*i)+(noiseHeight*4*j)+4*k+1]\
    \ = (byte) c.getGreen();\n        data[(noiseWidth*noiseHeight*4*i)+(noiseHeight*4*j)+4*k+2]\
    \ = (byte) c.getBlue();\n        data[(noiseWidth*noiseHeight*4*i)+(noiseHeight*4*j)+4*k+3]\
    \ = (byte) 255;\n      } } }\n~~~\n```\n\nThe variable veinFrequency is used to\
    \ adjust the number of stripes, maxZoom adjusts the zoom factor used when generating\
    \ the turbulence, and turbPower adjusts the amount of perturbation in the stripes\
    \ (setting it to zero leaves the stripes unperturbed). Since the same sine wave\
    \ value is used for all three (RGB) color components, the final color stored in\
    \ the image data array is grayscale: Figure 14.16\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_356_0.png)\n\
    \n**Figure 14.16**\nBuilding 3D \"marble\" noise maps."
