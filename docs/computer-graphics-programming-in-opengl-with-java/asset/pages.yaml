  md: '# ## 2.6 ORGANIZING THE JAVA CODE FILES


    So far, we have been placing all of the Java/JOGL application code in a single
    class file called “Code.java” and the GLSL shaders into files called “vertShader.glsl”
    and “fragShader.glsl.” While we freely admit that naming any code module “Code”
    is almost laughably bad practice, we have adopted this naming convention in this
    book so that it is absolutely clear in every example which file contains the main
    block of Java/JOGL code relevant to the example being discussed. Throughout this
    textbook, it will always be called “Code.java.” In practice, a name should of
    course be chosen that appropriately describes the task performed by the application.


    However, as we proceed, there will be circumstances in which we create modules
    that will be useful in many different applications. Wherever appropriate, we will
    move those modules into separate files to facilitate reuse. For example, later
    we will define a Sphere class that will be useful in many different examples,
    and so it will be separated into its own file.


    Similarly, as we encounter *functions* that we wish to reuse, we will place them
    in a class file called “Utils.java.” We have already seen several functions that
    are appropriate to move into “Utils.java”: the error-detecting modules described
    in Section 2.2 and the functions for reading in GLSL shader programs described
    in Section 2.3. The latter is particularly well suited to overloading, such that
    a “createShaderProgram()” function can be defined for each possible combination
    of pipeline shaders assembled in a given application:


    +   - public int createShaderProgram(String vS, String fS)

    +   - public int createShaderProgram(String vS, String gS, String fS)

    +   - public int createShaderProgram(String vS, String tCS, String tES, String
    gS)

    +   - public int createShaderProgram(String vS, String tCS, String tES, String
    gS,

    +     String fS)


    The first case (above) supports shader programs which utilize only a vertex and
    fragment shader. The second supports those utilizing vertex, geometry, and fragment
    shaders. The third supports those using vertex, tessellation, and fragment shaders.
    And the fourth supports those using vertex, tessellation, geometry, and fragment
    shaders. The parameters accepted in each case are pathnames for the GLSL files
    containing the shader code. For example, the following call uses one of the overloaded
    functions to compile and link a shader pipeline program that'
