  md: 'properties (such as wavelength) than it actually does when it is reconstructed.
    An example is shown in Figure 5.6. The original waveform is shown in red. The
    yellow dots along the waveform represent the samples. If they are used to reconstruct
    the wave, and if there aren''t enough of them, they can define a different wave
    (shown in blue).


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_139_0.png)


    Similarly, in texture-mapping, when a high-resolution (and highly detailed) image
    is sparsely sampled (such as when using a uniform sampler variable), the colors
    retrieved will be inadequate to reflect the actual detail in the image, and may
    instead seem random. If the texture image has a repeated pattern, aliasing can
    result in a *different* pattern being produced than the one in the original image.
    If the object being textured is moving, rounding errors in texel lookup can result
    in constant changes in the sampled pixel at a given texture coordinate, producing
    an unwanted sparkling effect across the surface of the object being drawn.


    Figure 5.7 shows a tilted close-up rendering of the top of a cube which has been
    textured by a large, high-resolution image of a checkerboard.


    Aliasing is evident near the top of the image, where the undersampling of the
    checkerboard has produced a "striped" effect. Although we can''t show it here
    in a still image, if this


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_139_1.png)'
