  md: '# APPENDIX C


    # Using the Nsight Graphics Debugger


    +   - **C.1** About NVIDIA Nsight .....................................................
    497

    +   - **C.2** Setting Up Nsight for JOGL .............................................
    498

    +   - **C.3** Running a Java/JOGL Application in Nsight ........................
    498


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_517_0.png)


    Debugging GLSL shader code is notoriously difficult. Unlike programming in typical
    languages such as Java or C++, it is often unclear exactly where a shader program
    failed. Often, a shader error manifests as a blank screen, offering no clues as
    to the nature of the error. Even more frustrating is that there is no way to print
    out the values of shader variables during run time, as one would commonly do when
    tracking down an elusive bug.


    We listed some techniques for detecting OpenGL and GLSL errors in Section 2.2.
    Despite the help that these techniques provide, the lack of a simple ability to
    display shader variables is a serious handicap.


    For this reason, graphics card manufacturers have sometimes provided capabilities
    in hardware for extracting information from shaders at run time, and then built
    tools for accessing the information in the form of a graphics debugger. Each manufacturer’s
    debugging tool(s) work only in the presence of that manufacturer’s graphics card.
    NVIDIA’s graphics debugger is part of a larger suite of tools called Nsight, and
    AMD has a similar suite of tools called CodeXL. This appendix describes how to
    get started using Nsight with Java/JOGL on a PC (Windows) machine.


    # C.1 ABOUT NVIDIA NSIGHT


    Nsight is an NVIDIA suite of tools that includes a graphics debugger, which makes
    it possible to look inside the shader stages of the OpenGL graphics pipeline while
    a program is running. It isn’t necessary to change the code at all, or to add'
  merge: -1
  img_proc: true
- pgno: 518
  md: 'any code. Simply run an existing program using the Nsight application. Nsight
    allows examining shaders at runtime, such as seeing the current contents of a
    shader’s uniform variables. It also enables seeing the C calls being made by a
    JOGL-wrapped program.


    There are versions of Nsight for Windows and for Linux, including versions that
    run under Microsoft’s Visual Studio and under the Eclipse IDE. We restrict our
    discussion to the standalone Nsight Graphics application for Windows.


    Nsight works only with compatible NVIDIA graphics cards; it won’t work with Intel
    or AMD graphics cards. A complete list of supported cards is available on the
    NVIDIA Website [NS21].


    Nsight is changing quickly, and the description in our previous (second) edition
    of this textbook is already outdated. The reader should consider this brief introduction
    just a starting point, as there are likely to be many more exciting changes and
    developments in Nsight in the near future.


    # C.2 SETTING UP NSIGHT FOR JOGL


    Using Nsight with Java/JOGL has become much easier than it was when we wrote the
    first two editions of this book. In previous editions we described incorporating
    Nsight into Visual Studio and running our Java/JOGL program as an “external program.”
    This is no longer necessary, as there is now a standalone Nsight graphics debugging
    tool called **Nsight Graphics**, which eliminates the need for using Visual Studio
    entirely.


    Start by installing Nsight Graphics, available at *https://developer.nvidia.com/nsight-graphics*.
    There are many versions throughout Nsight Graphics’ history available there. We
    installed version 2020.4 and it has worked well for us.


    # C.3 RUNNING A JAVA/JOGL APPLICATION IN NSIGHT


    +   1. Run Nsight Graphics. A menu comes up, as shown below. Choose either “Quick
    Launch” or “New Project.” Both will work fine – creating a new project will allow
    you to save your settings. For this example, we chose “Quick Launch.”'
