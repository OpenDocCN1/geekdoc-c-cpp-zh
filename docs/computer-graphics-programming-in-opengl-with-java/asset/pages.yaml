    \ particularly in Chapter 8 when we generate shadows.\n\n# ### 3.10 GLSL FUNCTIONS\
    \ FOR BUILDING MATRIX TRANSFORMS\n\nAlthough JOML includes predefined functions\
    \ for performing many of the 3D transformations covered in this chapter, such\
    \ as translation, rotation, and scale, GLSL only includes basic matrix operations\
    \ such as addition, concatenation, and so on. It is therefore sometimes necessary\
    \ to write our own GLSL utility functions for building 3D transformation matrices\
    \ when we need them to perform certain 3D computations in a shader. The appropriate\
    \ datatype to hold such a matrix in GLSL is mat4.\n\nThe syntax for initializing\
    \ mat4 matrices in GLSL loads values by columns. The first four values are put\
    \ into the first column, the next four into the next column, and so forth, as\
