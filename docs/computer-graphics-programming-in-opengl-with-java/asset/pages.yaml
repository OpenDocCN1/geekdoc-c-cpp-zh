  md: 'used to identify a particular work group is not a single integer, but a *tuple*
    of three values. Furthermore, the invocations *within* a work group (i.e., in
    those cases where the work group size is specified to be greater than one) are
    also organized in a 3D grid. Thus, the programmer must specify (1) the size and
    dimensionality of the grid of work groups and (2) the size and dimensionality
    of each work group (also organized as a grid). This gives the programmer a huge
    degree of flexibility in organizing a potentially large set of parallel computations.
    The entire set of invocations are then initiated in the Java/JOGL application
    by calling


    ```

    gl.glDispatchCompute(x,y,z)

    ```


    where the x, y, and z parameters specify the size and dimensionality of the abstract
    grid of the set of work groups. The number of compute shader invocations then
    executed *within* each work group (and the dimensionality in which they are organized)
    is specified in the compute shader with the GLSL command


    ```

    layout (local_size_x = X, local_size_y = Y, local_size_z = Z)

    ```


    where X, Y, and Z are the dimensions of each work group. The dimensionalities
    of the set of work groups, and the work groups themselves, need not be the same,
    and may be 1D, 2D, or 3D. The resulting compute shader invocations can then run
    in parallel on the GPU.


    During execution, a compute shader can determine how many work groups had been
    dispatched, and in which work group and invocation it is running by querying one
    or more of the following built-in GLSL variables:


    | Variable | Description |

    |---|---|

    | gl_NumWorkGroups | the number of work groups dispatched by the Java/JOGL program
    |

    | gl_WorkGroupID | which work group the current invocation belongs to |

    | gl_LocalInvocationID | which invocation within the current work group this execution
    represents |

    | gl_GlobalInvocationID | which invocation within the total invocations this execution
    represents |


    Let’s walk through an example. Suppose the Java/JOGL program made the call gl.glDispatchCompute(16,16,4).
    This would cause the compute shader to be executed with a total of 16 × 16 × 4
    = 1024 work groups. If the compute shader specified the work group size as layout
    (local_size_x=5, local_size_y=5, local_size_z=1), then'
