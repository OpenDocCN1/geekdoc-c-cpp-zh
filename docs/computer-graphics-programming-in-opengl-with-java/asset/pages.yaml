- pgno: 298
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_298_0.png)


    Now let’s work our way through the four shaders. As indicated earlier, the vertex
    shader has little to do, since the Java/JOGL application is not providing any
    vertices. It all contains is a uniform declaration, to match the other shaders,
    and an empty `main()`. In any case, it is a requirement that all shader programs
    include a vertex shader.


    The Tessellation Control Shader specifies the topology of the triangle mesh that
    the tessellator is to produce. Six “level” parameters are set—two “inner” and
    four “outer” levels—by assigning values to the reserved words named `gl_TessLevelxx`.
    This is for tessellating a large *rectangular* grid of triangles, called a *quad*.³
    The levels tell the tessellator how to subdivide the grid when forming triangles,
    and are arranged as shown in Figure 12.3.


    Note the line in the control shader that says


    ```

    ```

    layout (vertices=1) out;

    ```

    ```


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_298_1.png)


    This is related to the prior `GL_PATCHES` discussion and specifies the number
    of vertices per “patch” being passed from the vertex shader to the control shader
    (and “out” to the evaluation shader). In this particular program there are none,
    but we still must specify at least one, because it also affects how many times
    the control shader executes. Later this value will reflect the number of control
    points and must match the value in the `glPatchParameteri()` call in the Java/JOGL
    application.


    ³ The tessellator is also capable of building a *triangular* grid of triangles,
    but that isn’t covered in this textbook.'
