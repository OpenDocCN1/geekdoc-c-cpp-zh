- pgno: 250
  md: 'OpenGL texture cube maps are similar to 3D textures that we will study later,
    in that they are accessed using three texture coordinates—often labeled (s,t,r)—rather
    than two as we have been doing thus far. Another unique characteristic of OpenGL
    texture cube maps is that the images in them are oriented with texture coordinate
    (0,0,0) at the upper left (rather than the usual lower left) of the texture image;
    this is often a source of confusion.


    Whereas the method shown in Program 9.1 reads in a single image for texturing
    the cube map, the loadCubeMap() function shown in Program 9.2 reads in six separate
    cube face image files. There are two approaches we could use to read in the six
    image files and then build the cube map. We could use the JOGL TextureIO and TextureData
    classes as we did throughout Chapter 5 or we could use the AWT tools described
    at the end of Chapter 5. In this chapter, we choose the latter approach as it
    affords more flexibility with respect to whether or not we vertically flip the
    textures to accommodate the aforementioned difference in texture coordinate orientation.


    In the loadCubeMap() function, the six texture image files are read in using the
    getRGBApixelData() function described back in Section 5.12. We set its second
    parameter to false, so that it doesn''t flip the textures vertically—this is because
    OpenGL automatically does a vertical flip for texture cube maps.


    After reading in the textures and converting them to ByteBuffers, we then generate
    a single texture of type GL_TEXTURE_CUBE_MAP. OpenGL requires that we specify
    the size of the texture images using the glTexStorage2D() function—in this case
    they are 1024×1024 (they must be square). Finally, the loadCubeMap() function
    uses glTexSubImage2D() to assign each texture to a cube face.


    The init() function now includes a call to enable GL_TEXTURE_CUBE_MAP_SEAMLESS,
    which tells OpenGL to attempt to blend adjoining edges of the cube to reduce or
    eliminate seams. In display(), the cube''s vertices are sent down the pipeline
    as before, but this time it is unnecessary to send the cube''s texture coordinates.
    As we will see, this is because an OpenGL texture cube map usually uses the cube''s
    vertex positions as its texture coordinates. After disabling depth testing, the
    cube is drawn. Depth testing is then re-enabled for the rest of the scene.


    The completed OpenGL texture cube map is referenced by an int identifier. As was
    the case for shadow mapping, artifacts along a border can be reduced by setting
    the texture wrap mode to “clamp to edge.” In this case it can help further reduce
    seams. Note that this is set for all three texture coordinates (s, t, and r).'
