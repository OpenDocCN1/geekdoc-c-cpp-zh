    # 5.2 TEXTURE COORDINATES


    Now that we have a means for loading a texture image into OpenGL, we need to specify
    how we want the texture to be applied to the rendered surface of an object. We
    do this by specifying *texture coordinates* for each vertex in our model.


    Texture coordinates are references to the pixels in a (usually 2D) texture image.
    Pixels in a texture image are referred to as *texels*, in order to differentiate
    them from the pixels being rendered on the screen. Texture coordinates are used
    to map points on a 3D model to locations in a texture. Each point on the surface
    of the model has, in addition to (x,y,z) coordinates that place it in 3D space,
    texture coordinates (s,t) that specify which texel in the texture image provides
    its color. Thus, the surface of the object is “painted” by the texture image.
    The orientation of a texture across the surface of an object is determined by
    the assignment of texture coordinates to object vertices.


    In order to use texture mapping, *it is necessary to provide texture coordinates
    for every vertex* in the object to be textured. OpenGL will use these texture
    coordinates to determine the color of each rasterized pixel in the model, by looking
    up the color stored at the referenced texel in the image. In order to ensure that
    every pixel in your rendered model is painted with an appropriate texel from the
    texture image, *the texture coordinates are put into a vertex attribute so that
    they are also interpolated by the rasterizer.* In that way the texture image is
    interpolated, or filled in, along with the model vertices.


    For each set of vertex coordinates (x,y,z) passing through the vertex shader,
    there will be an accompanying set of texture coordinates (s,t). We will thus set
    up two buffers, one for the vertices (with three components x, y, and z in each
    entry) and one for the corresponding texture coordinates (with two components
    s and t in each entry). Each vertex shader invocation thus receives one vertex,
    now comprising both its spatial coordinates and its corresponding texture coordinates.'
