  md: "In Program 2.6, the application’s display() method maintains a variable “x”\
    \ used to offset the triangle’s X coordinate position. Its value changes each\
    \ time display() is called (and thus is different for each frame), and it reverses\
    \ direction each time it reaches 1.0 or -1.0. The value in x is copied to a corresponding\
    \ variable called “offset” in the vertex shader. The mechanism that performs this\
    \ copy uses something called a *uniform variable*, which we will study later in\
    \ Chapter 4. It isn’t necessary to understand the details of uniform variables\
    \ yet. For now, just note that the Java/JOGL application first calls glGetUniformLocation()\
    \ to get a pointer to the “offset” variable, and then calls glProgramUniform1f()\
    \ to copy the value of x into offset. The vertex shader then adds the offset to\
    \ the X coordinate of the triangle being drawn. Note also that the background\
    \ is cleared at each call to display(), to avoid the triangle leaving a trail\
    \ as it moves. Figure 2.16 illustrates the display at three time instances (of\
    \ course, the movement can’t be shown in a still figure).\n\n# **Program 2.6 Simple\
    \ Animation Example**\n\n*Java/JOGL application:*\n\n```\n    // same imports\
    \ and declarations as before, plus the following:\n    import com.jogamp.opengl.util.*;\n\
    \n    public class Code extends JFrame implements GLEventListener\n    {  // same\
    \ declarations as before, plus:\n       private float x = 0.0f;        // location\
    \ of triangle\n       private float inc = 0.01f;     // offset for moving the\
    \ triangle\n\n       public Code()\n       {  // same constructor as before, plus\
    \ this at the end, after the call to setVisible(true).\n          Animator animr\
    \ = new Animator(myCanvas);\n          animr.start();\n       }\n\n       public\
    \ void display(GLAutoDrawable drawable)\n       {  GL4 gl = (GL4) GLContext.getCurrentGL();\n\
    \          gl.glClear(GL_DEPTH_BUFFER_BIT);\n          gl.glClear(GL_COLOR_BUFFER_BIT);\
    \  // clear the background to black, each time\n          gl.glUseProgram(renderingProgram);\n\
    \n          x += inc;                         // move the triangle along x axis\n\
    \          if (x > 1.0f) inc = -0.01f;       // switch to moving the triangle\
    \ to the left\n          if (x < -1.0f) inc = 0.01f;       // switch to moving\
    \ the triangle to the right\n          int offsetLoc = gl.glGetUniformLocation(renderingProgram,\
    \ \"offset\");  // retrieve pointer to \"offset\"\n```"
