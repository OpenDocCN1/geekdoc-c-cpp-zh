  md: '# 8.6 SHADOW MAPPING ARTIFACTS


    Although we have implemented all of the basic requirements for adding shadows
    to our scene, running Program 8.1 produces mixed results, as shown in Figure 8.11.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_228_0.png)


    The good news is that our pyramid is now casting a shadow on the torus! Unfortunately,
    this success is accompanied by a severe artifact. There are wavy lines covering
    many of the surfaces in the scene. This is a common by-product of shadow mapping
    and is called *shadow acne*, or *erroneous self-shadowing*.


    Shadow acne is caused by rounding errors during depth testing. The texture coordinates
    computed when looking up the depth information in a shadow texture often don’t
    exactly match the actual coordinates. Thus, the lookup may return the depth for
    a neighboring pixel, rather than the one being rendered. If the distance to the
    neighboring pixel is further, then our pixel will appear to be in shadow even
    if it isn’t.


    Shadow acne can also be caused by differences in precision between the texture
    map and the depth computation. This too can lead to rounding errors and subsequent
    incorrect assessment of whether or not a pixel is in shadow.


    Fortunately, fixing shadow acne is fairly easy. Since shadow acne typically occurs
    on surfaces that are *not* in shadow, a simple trick is to move every pixel slightly
    closer to the light during pass one, and then move them back to their normal positions
    for pass two. This is usually sufficient to compensate for either type of rounding
    error. An easy way is to call glPolygonOffset() in the display() function, as
    shown in Figure 8.12 (highlighted).


    Adding these few lines of code to our display() function improves the output of
    our program considerably, as shown in Figure 8.13. Note also that with the artifacts
    gone, we can now see that the inner circle of the torus displays a small correctly
    cast shadow on itself.


    Although fixing shadow acne is easy, sometimes the repair causes new artifacts.
    The “trick” of moving the object before pass one can sometimes cause a gap to
    appear inside an object’s shadow. An example of this is shown in Figure 8.14.
    This'
