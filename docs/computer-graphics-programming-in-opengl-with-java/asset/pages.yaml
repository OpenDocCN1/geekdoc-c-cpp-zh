    # 3.1 TRANSFORMATION MATRICES


    In graphics, matrices are typically used for performing *transformations* on objects.
    For example, a matrix can be used to move a point from one location to another.
    In this chapter we will learn several useful transformation matrices:


    +   - *Translation*

    +   - *Rotation*

    +   - *Scale*

    +   - *Projection*

    +   - *Look-At*


    An important property of our transformation matrices is that they are all of size
    4x4. This is made possible by our decision to use the *homogeneous* notation.
    Otherwise, some of the transforms would be of diverse and incompatible dimensions.
    As we have seen, ensuring they are the same size is not just for convenience;
    it also makes it possible to combine them arbitrarily and pre-compute groups of
    transforms for improved performance.


    # 3.4.1 Translation


    A *translation* matrix is used to move items from one location to another. It
    consists of an identity matrix, with the X, Y, and Z movement(s) given in locations
    A_{03}, A_{13}, A_{23}. Figure 3.3 shows the form of a translation matrix, and
    its effect when multiplied by a *homogeneous* point; the result is a new point
    “moved” by the *translate values*.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_62_0.png)'
