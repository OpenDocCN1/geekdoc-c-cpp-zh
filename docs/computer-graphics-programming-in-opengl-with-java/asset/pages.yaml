- pgno: 230
  md: 'There are many other artifacts that can happen during shadow mapping. For example,
    shadows can *repeat* as a result of the region of the scene being rendered in
    pass one (into the shadow buffer) being different from the region of the scene
    rendered in pass two (they are from different vantage points). Because of this
    difference, those portions of the scene rendered in pass two that fall outside
    the region rendered in pass one will attempt to access the shadow texture using
    texture coordinates outside of the range [0..1]. Recall that the default behavior
    in this case is GL_REPEAT, which can result in incorrectly duplicated shadows.


    One possible solution is to add the following lines of code to setupShadowBuffers(),
    to set the texture wrap mode to “clamp to edge”:


    ```

    ```

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);

    gl.glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);

    ```

    ```


    This causes values outside of a texture edge to be clamped to the value at edge
    (instead of repeating). Note that this approach can introduce its own artifacts;
    namely, when a shadow exists at the edge of the shadow texture, clamping to the
    edge can produce a “shadow bar” extending to the edge of the scene.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_230_0.png)


    Another common error is *jagged shadow edges*. This can happen when the shadow
    being cast is significantly larger than the shadow buffer can accurately represent.
    This usually depends on the location of the objects and light(s) in the scene.
    In particular, it commonly occurs when the light source is relatively distant
    from the objects involved. An example is shown in Figure 8.15.


    Eliminating jagged shadow edges is not as simple as for the previous artifacts.
    One technique is to move the light position closer to the scene during pass one,
    and then return it to the correct position in pass two. Another approach that
    is often effective is to employ one of the “soft shadow” methods that we will
    discuss next.


    # ### 3.7 SOFT SHADOWS


    The methods presented thus far are limited to producing *hard shadows*. These
    are shadows with sharp edges. However, most shadows that occur in the real world'
