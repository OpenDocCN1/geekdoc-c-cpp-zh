    We next call `textureProj()` on each of these four points, which in each case
    returns either 0.0 or 1.0 depending on whether or not that sampled point is in
    shadow. We sum the four results and divide by 4.0 to determine the percentage
    of sampled points which are in shadow. This percentage is then used as a multiplier
    to determine the amount of diffuse and specular lighting to be applied when rendering
    the current pixel.


    Despite the small sampling size—only 4 samples per pixel—this dithered approach
    can often produce surprisingly good soft shadows. Figure 8.24 was generated using
    4-point dithered PCF. While not


