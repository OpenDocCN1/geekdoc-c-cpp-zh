- pgno: 402
  md: "We can generate a sort of caustic pattern in the fragment shader, directly\
    \ from the noise map, as follows. We start by computing the sine of the noise\
    \ value; the noise value (which ranges between 0 and 1) is first multiplied by\
    \ 2π so that the sine values cycle smoothly. This results in a value that cycles\
    \ between -1.0 and 1.0. The absolute value of this cycles between 0.0 and 1.0,\
    \ but with steep slopes around 0.0 and shallower slopes around 1.0. Subtracting\
    \ this absolute value from 1.0 then inverts this, resulting in long flat regions\
    \ around 0.0 and sharp peaks around 1.0. This can be amplified by raising it to\
    \ an adjustable exponent, using a tunable variable named strength. The result\
    \ is a function that usually outputs values near 0, but has occasional small regions\
    \ of output values near 1.0. When applied to the top surface color value at a\
    \ given world coordinate, it generates periodic patterns that follow the top surface\
    \ waves, which we can then incorporate into the bottom surface color. Program\
    \ 15.8 shows this code added to the fragment shader and the resulting computed\
    \ values added to the color rendered to the floor. The output is shown in Figure\
    \ 15.10.\n\nNote that the floor color elements after adding the caustic are clamped\
    \ to the range [0..1] to ensure that they are within the valid range for RGB values.\n\
    \n# Program 15.8 Adding Underwater Caustics\n\nFragment Shader (for floor)\n\n\
    ```\n...\n\nfloat getCausticValue(float x, float y, float z)\n{\n    float w =\
    \ 8;             // frequency of caustic curved bands\n    float strength = 4.0;\n\
    \    float PI = 3.14159;\n    float noise = texture(noiseTex, vec3(x*w, y, z*w)).r;\n\
    \    return pow((1.0-abs(sin(noise*2*PI))), strength);\n}\n\nvoid main(void)\n\
    {\n    { ...\n        color = vec4((mixColor * (ambient + diffuse) + specular),\
    \ 1.0);\n\n        // add caustics\n        if (isAbove != 1)\n        {\n   \
    \         float causticColor = getCausticValue(tc.s, depthOffset, tc.t);\n   \
    \         float colorR = clamp(color.x + causticColor, 0.0, 1.0);\n          \
    \  float colorG = clamp(color.y + causticColor, 0.0, 1.0);\n```"
