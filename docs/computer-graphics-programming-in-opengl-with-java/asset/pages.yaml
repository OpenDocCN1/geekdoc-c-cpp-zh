  md: 'The mechanism by which these functions are deployed is as follows: When a GLCanvas
    is made “visible” (by our calling “setVisible(true)” on the JFrame that contains
    it), it initializes OpenGL, which in turn creates a “GL4” object that our application
    can use for making OpenGL function calls. OpenGL then does a “callback,” calling
    init(), and passes it a “drawable” object (in this case the drawable object is
    the GLCanvas, although that isn''t obvious from the code). In this particular
    example, init() doesn''t do anything—in most applications it is where we would
    read in GLSL code, load 3D models, and so on. OpenGL (actually, JOGL) next calls
    display(), also sending it the drawable object. It is typical to immediately obtain
    the GL4 object and put it in a variable called “gl” (actually, GL4 is an interface—in
    practice we don''t need to know the actual GL object class).


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_29_0.png)


    Figure 2.3

    Output of Program 2.1.


    Later we will see that if we want our scene to be animated, our Java/JOGL application
    will need to tell JOGL to make additional calls to display().


    Now is an appropriate time to take a closer look at JOGL calls in Program 2.1.
    Consider this one:


    ```

    ```

    gl.glClear(GL_COLOR_BUFFER_BIT);

    ```

    ```


    Since JOGL is a Java binding for OpenGL, that means that calls to JOGL in turn
    generate calls to OpenGL''s library of C functions. In this case, the C function
    being called, as described in the OpenGL reference documentation (available on
    the web at https://www.khronos.org/registry/OpenGL-Refpages/gl4/) is:


    ```

    ```

    void glClear(GLbitfield mask);

    ```

    ```


    The first thing to notice is that the name of the JOGL function is the same as
    that of the original OpenGL C function, except it is preceded by “gl”—which is
    the name of the GL4 object. The period “.” after the “gl” is significant because
    “gl” is the object on which we are invoking the OpenGL function.


    To reiterate, GL4 is a Java interface to the OpenGL functions. We can obtain it
    in one of two ways: (a) by calling drawable.getGL(), utilizing the “GLAutoDrawable”'
