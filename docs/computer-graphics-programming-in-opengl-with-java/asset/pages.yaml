    \ are sufficiently simple that we omit building such a class hierarchy for lighting\
    \ in this edition.\n\n# 7.3 MATERIALS\n\nThe “look” of the objects in our scene\
    \ has so far been handled exclusively by color and texture. The addition of lighting\
    \ allows us to also consider the reflectance characteristics of the surfaces.\
    \ By that, we mean how the object interacts with our ADS lighting model. This\
    \ can be modeled by considering each object to be “made of” a certain material.\n\
    \nMaterials can be simulated in an ADS lighting model by specifying four values,\
    \ three of which we are already familiar with—ambient, diffuse, and specular RGB\
    \ colors. The fourth is called shininess, which, as we will see, is used to build\
    \ an appropriate specular highlight for the intended material. ADS and shininess\
    \ values have been developed for many different types of common materials. For\
    \ example, “pewter” can be specified as follows:\n\n```\nfloat[] pewterMatAmbient\
    \ = new float[] { .11f, .06f, .11f, 1.0f }; \nfloat[] pewterMatDiffuse = new float[]\
