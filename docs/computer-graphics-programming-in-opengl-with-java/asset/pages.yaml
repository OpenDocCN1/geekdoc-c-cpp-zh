  md: "shows the resulting texture map for various values of turbPower (0.0, 0.5,\
    \ 1.0, and 1.5, left to right).\n\nWe can further control the definition and thickness\
    \ of the marble veins by modifying the turbulence() function so that it uses a\
    \ *logistic* function. A logistic (or “sigmoid”) function has an S-shaped curve\
    \ with asymptotes on both ends. Common examples are hyperbolic tangent and f(x)\
    \ = 1/(1+e^-x). They are also sometimes called “squashing” functions. Many noise\
    \ applications utilize a logistic function to push the values in the noise map\
    \ more towards 0.0 or 255.0, rather than values in between. Program 14.5 includes\
    \ a logistic() function which implements 1/(1+e^-kx), where k is used to tune\
    \ the degree to which the output is pushed towards 0.0 or 255.0 — in this case\
    \ tuning the sharpness of the marble vein edges.\n\nSince we expect marble to\
