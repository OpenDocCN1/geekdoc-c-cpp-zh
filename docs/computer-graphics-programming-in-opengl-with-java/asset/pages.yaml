- pgno: 430
  md: '$$t_{mins} = (box_{mins} - r_s) / r_d$$

    $$t_{maxs} = (box_{maxs} - r_s) / r_d$$


    The resulting $t_{mins}$ and $t_{maxs}$ vectors contain minimum and maximum distances
    to planes defined by the X, Y, and Z-aligned box sides. The smaller and larger
    of each of those can then be found efficiently as follows:


    $$tminDist = \min(t_{mins}, t_{maxs})$$

    $$tmaxDist = \max(t_{mins}, t_{maxs})$$


    (In GLSL, the “min” of two vec3s is a vec3 containing the smaller of each pair
    of X, Y, and Z elements.)


    The vector $t_{minDist}$ then contains (distance $r_s$ to $x_{min}$, distance
    $r_s$ to $y_{min}$, distance $r_s$ to $z_{min}$).


    The vector $t_{maxDist}$ then contains (distance $r_s$ to $x_{max}$, distance
    $r_s$ to $y_{max}$, distance $r_s$ to $z_{max}$).


    Some of the plane collision points are actually outside of the box. The distance
    from the ray origin to the nearest collision point that is actually on a box surface
    is the *largest* of the $t_{minDist}$ values, and the distance from the ray origin
    to the furthest collision point that is on a box surface is the *smallest* of
    the $t_{maxDist}$ values:


    $$t_{near} = \max(tminDist_x, tminDist_y, tminDist_z)$$

    $$t_{far} = \min(tmaxDist_x, tmaxDist_y, tmaxDist_z)$$


    There are then three cases:


    +   - The ray doesn’t intersect the box at all, which is the case when $t_{near}
    > t_{far}$ or if $t_{far} \leq 0$.

    +   - There is one collision point when the ray starts inside the box and exits
    the box, which is the case when $t_{near} < 0$ and $t_{far} > 0$.

    +   - Otherwise, there are two collision points which occur at distances $t_{near}$
    and $t_{far}$.'
