- pgno: 70
  md: 'When building a 3D model of an object, we generally orient the model in the
    most convenient manner for describing it. For example, when modeling a sphere,
    we might orient the model with the sphere''s center at the origin (0,0,0) and
    give it a convenient radius, such as 1. The space in which a model is defined
    is called its *local space*, or *model space*. OpenGL documentation uses the term
    *object space*.


    The sphere might then be used as a piece of a larger model, such as becoming the
    head on a robot. The robot would, of course, be defined in its own local/model
    space. Positioning the sphere model into the robot model space can be done using
    the matrix transforms for scale, rotation, and translation, as illustrated in
    Figure 3.9. In this manner, complex models can be built hierarchically (this is
    developed further in Section 4.8 of Chapter 4, using a stack of matrices).


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_70_0.png)


    In the same manner, modeled objects are placed in a simulated world by deciding
    on the orientation and dimensions of that world, called *world space*. The matrix
    that positions and orients an object into world space is called a *model matrix*,
    or **M**.


    # ## 3.7 EYE SPACE AND THE SYNTHETIC CAMERA


    So far, the transform matrices we have seen all operate in 3D space. Ultimately,
    however, we will want to display our 3D space—or a portion of it—on a 2D monitor.
    In order to do this, we need to decide on a vantage point. Just as we see our
    real world through our eyes from a particular point, in a particular direction,
    so too must we establish a position and orientation as the window into our virtual
    world. This vantage point is called “view” or “eye” space, or the “synthetic camera.”'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_71_0.png)


    As shown in Figures 3.10 and 3.12, viewing involves (a) placing the camera at
    some world location; (b) orienting the camera, which usually requires maintaining
    its own set of orthogonal axes U/V/N; (c) defining a *view volume*; and (d) projecting
    objects within the volume onto a *projection plane*.


    OpenGL includes a camera that is permanently fixed at the origin (0,0,0) and faces
    down the negative Z-axis, as shown in Figure 3.11.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_71_1.png)


    In order to use the OpenGL camera, one of the things we need to do is *simulate*
    moving it to some desired location and orientation. This is done by figuring out
    where our objects in the world are located relative to the desired camera position
    (i.e., where they are located in “camera space,” as defined by the U, V, and N
    axes of the camera as illustrated in Figure 3.12). Given a point at world space
    location P_w, we need a transform to convert it to the equivalent point in camera
    space, making it *appear* as though we are viewing it from the desired camera
    location C_w. We do this by computing its camera space position P_c. Knowing that
    the OpenGL camera location is always at the fixed position (0,0,0), what transform
    would achieve this?'
