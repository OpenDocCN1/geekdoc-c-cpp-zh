- pgno: 392
  md: "The noise map is built using the code from Section 14.5, with a slight modification\
    \ to the turbulence() function. Specifically, we add a sine wave that runs diagonally\
    \ across the XZ plane:\n\n```\n```java\nprivate double turbulence(double x, double\
    \ y, double z, double maxZoom)\n{  double sum = 0.0, zoom = maxZoom;\n   sum =\
    \ Math.sin(1/512.0*PI*(x+z) + 1) * 8.0;\n   while(zoom >= 0.9)\n   {  sum = sum\
    \ + smooth(zoom, x/zoom, y/zoom, z/zoom) * zoom;\n      zoom = zoom / 2.0;\n \
    \  }\n   sum = 128.0 * sum/maxZoom;\n   return sum;\n}\n```\n```\n\nThe diagonal\
    \ sine wave is accomplished via sin(x+z), with additional factors for scaling\
    \ (1/512 assuming that the size of the noise map is 256 along the X and Z dimensions),\
    \ ensuring that the range of values for x+y span a multiple of PI so that the\
    \ sine wave wraps smoothly at edge boundaries, adding 1 to convert the sine wave\
    \ from -1..+1 to 0..2, and then scaling the height to the desired amount (in this\
    \ case, by a factor of 8). Note that since we have been making heavy use of tiling,\
    \ it is especially important in this application to use a noise map dimension\
    \ that is a power of 2, so that the noise also wraps smoothly at edge boundaries.\n\
    \nWe then pass the noise map to the fragment shader, where we use it to alter\
    \ the normals by a very small offset. The additions to the code are shown in Program\
    \ 15.4. The resulting output is shown in Figure 15.6.\n\n# Program 15.4 Adding\
    \ Surface Waves\n\n*Java/JOGL Application*\n\n```\n```java\n...\nprivate int noiseTexture;\n\
    private int noiseHeight = 256;\nprivate int noiseWidth = 256;\nprivate int noiseDepth\
    \ = 256;\nprivate double[][][] noise = new double[noiseWidth][noiseHeight][noiseDepth];\n\
    ...\n// buildNoiseTexture(), fillDataArray(), smoothNoise() same as in Chapter\
    \ 14\n// turbulence() function as described above\n...\n```\n```"
