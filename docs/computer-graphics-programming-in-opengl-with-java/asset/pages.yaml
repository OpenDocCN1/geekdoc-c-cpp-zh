  md: 'We can animate the cube using the Animator class as in Program 2.6, by building
    the model matrix using a varying translation and rotation based on the elapsed
    time. For example, the code in the display() function in Program 4.1 could be
    modified as follows (changes are highlighted):


    ```

    gl.glClear(GL_DEPTH_BUFFER_BIT);

    gl.glClear(GL_COLOR_BUFFER_BIT);


    // use system time to generate slowly-increasing sequence of floating-point values

    elapsedTime = System.currentTimeMillis() - startTime;  // elapsedTime, startTime,
    and tf

    if (tf = elapsedTime / 1000.0;  // would all be declared of type double.

    ...

    // use tf (time factor) to compute different translations in x, y, and z

    mMat.identity();

    mMat.translate((float)Math.sin(.35f*tf)*2.0f, (float)Math.sin(.52f*tf)*2.0f, (float)Math.sin(.7f*tf)*2.0f);

    mMat.rotateXYZ(1.75f*(float)tf, 1.75f*(float)tf, 1.75f*(float)tf);  // the 1.75
    adjusts the rotation speed

    ```


    The use of elapsed time (and a variety of trigonometric functions) in the model
    matrix causes the cube to appear to tumble around in space. Note that adding this
    animation illustrates the importance of clearing the depth buffer each time through
    display() to ensure correct hidden surface removal. It also necessitates clearing
    the color buffer as shown; otherwise, the cube will leave a trail as it moves.


    The translate() and rotateXYZ() functions are part of the JOML library. Note that
    in the code, translate() is called before rotate(). This results in a concatenation
    of the two transforms, with translation on the left and rotation on the right.
    When a vertex is subsequently multiplied by this matrix, the computation is right-to-left,
    meaning that the rotation is done first, followed by the translation. The order
    of application of transforms is significant and changing the order would result
    in different behavior. Figure 4.7 shows some of the frames that are displayed
    after animating the cube.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_99_0.png)


    **Figure 4.7**

    Animated (“tumbling”) 3D cube.'
