- pgno: 90
  md: 'The *Model* matrix positions and orients the object in the world coordinate
    space. Each model has its own model matrix, and that matrix would need to be continuously
    rebuilt if the model moves.


    The *View* matrix moves and rotates the models in the world to simulate the effect
    of a camera at a desired location. Recall from Chapter 2 that the OpenGL camera
    exists at location (0,0,0) and faces down the negative Z axis. To simulate the
    appearance of that camera being moved a certain way, we will need to move the
    objects themselves in the opposite way. For example, moving a camera to the right
    would cause the objects in the scene to appear to move to the left; although the
    OpenGL camera is fixed, we can make it appear as though we have moved it to the
    right by moving the objects to the left.


    The *Perspective* matrix is a transform that provides the 3D effect according
    to the desired frustum, as described earlier in Chapter 3.


    It is also important to understand when to compute each type of matrix. Matrices
    that never change can be built in *init()*, but those that change would need to
    be built in *display()* so that they are rebuilt for each frame. Let’s assume
    that the models are animated and the camera is movable. Then:


    +   - A model matrix needs to be created *for each model*, and *at each frame*.

    +   - The view matrix needs to be created *once per frame* (because the camera
    can be moved), but is the same for all objects rendered during that frame.

    +   - The perspective matrix is created once (in *init()*), using the screen window’s
    width and height (and desired frustum parameters), and usually remains unchanged
    unless the window is resized.


    Generating model and view transformation matrices then happens in the *display()*
    function, as follows:


    +   1. Build the view matrix based on the desired camera location and orientation.

    +   2. For each model, do the following:

    +      i. Build a model matrix based on the model’s location and orientation.

    +      ii. Concatenate the model and view matrices into a single “MV” matrix.

    +      iii. Send the MV and projection matrices to the corresponding shader uniforms.


    Technically, it isn’t necessary to combine the model and view matrices into a
    single matrix. That is, they could be sent to the vertex shader in individual,
    separate matrices. However, there are certain advantages to combining them, while
    keeping'
  merge: -1
  img_proc: true
