  md: '8.5 (RESEARCH) More sophisticated implementations of percentage closer filtering
    (PCF) take into account the relative distance between the light and the shadow
    versus the light and the occluder. Doing this can make soft shadows more realistic,
    by allowing their penumbra to change in size as the light moves closer or further
    from the occluder (or as the occluder moves closer or further from the shadow).
    Study existing methods for incorporating this capability, and add it to Program
    8.2.


