- pgno: 514
  md: '# B.2.2 Modifying the GLSL Code


    Some changes will need to be made at various locations in our GLSL shader code
    (and some of the associated Java/OpenGL code) because of the slightly earlier
    version of OpenGL (specifically, 4.1) present in Macs:


    +   - The specified version number in the shaders must be changed. Presuming that
    your Mac supports version 4.1, at the top of each shader locate the line that
    says


    ```

    `#version 430`

    ```


    and change it to


    ```

    `#version 410`

    ```


    +   - Version 4.1 doesn’t support layout binding qualifiers for texture sampler
    variables. This affects material starting from Chapter 5. You’ll need to remove
    the layout binding qualifiers and replace them with another command that accomplishes
    the same thing. Specifically, look for lines in the shaders that have the following
    format:


    ```

    `layout (binding=0) uniform sampler2D samp;`

    ```


    The texture unit number specified in the binding clause might be different (it
    is “0” here), and the name of the sampler variable might be different (it is “samp”
    here). In any case, you’ll need to remove the layout clause and simplify the command
    so that it just says


    ```

    `uniform sampler2D samp;`

    ```


    Then you’ll need to add the following command to the Java program, for each texture
    enabled:


    ```

    `glUniform1i(glGetUniformLocation(renderingProgram, “samp”), 0);`

    ```


    immediately after the glBindTexture() command in the Java display() function,
    where samp is the name of the uniform sampler variable and the 0 in the above
    example is the texture unit specified in the binding command that was removed
    earlier.'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# ### B.2.3 Compiling and Running a Program


    To compile a program, open a terminal window, navigate to the parent folder of
    the java files (if using the code on the accompanying DVD, you can recognize this
    parent folder because it contains the compile.bat and run.bat files intended for
    use with a PC) and type


    ```

    `javac code/*.java`

    ```


    To run your compiled program, type


    ```

    `java code.Code`

    ```


    # ### B.2.4 Additional Notes


    +   - The ray tracing programs shown in Chapter 16 won''t run on the Macintosh,
    because they utilize compute shaders, which weren''t introduced until version
    4.3 of OpenGL.


    +   - On some Macs that utilize a *Retina Display*, the pixel count can be inconsistent.
    For example, in the code described in Section 2.1.6 (with result shown in Figure
    2.13), `gl_FragCoord.x` returns a value twice as big as would be expected based
    on the window dimensions specified in `main()`. In that example, change the test
    value 295 to 590, to produce the desired result.


