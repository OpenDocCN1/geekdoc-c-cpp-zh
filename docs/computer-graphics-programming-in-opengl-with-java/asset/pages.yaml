- pgno: 266
  md: 'bytes and are usually interpreted as values in the range [0,1], whereas vectors
    can have positive or negative component values. If we restrict normal vector components
    to the range [-1,+1], a simple conversion to enable storing a normal vector N
    as a pixel in an image file is


    R = (N_x + 1) / 2

    G = (N_y + 1) / 2

    B = (N_z + 1) / 2


    Normal mapping utilizes an image file (called a *normal map*) that contains normals
    corresponding to a desired surface appearance in the presence of lighting. In
    a normal map, the vectors are represented relative to an arbitrary plane X-Y,
    with their X and Y components representing deviations from “vertical” and their
    Z component set to 1. A vector strictly perpendicular to the X-Y plane (i.e.,
    with no deviation) would be represented (0,0,1), whereas non-perpendicular vectors
    would have non-zero X and/or Y components. We use the above formulae to convert
    to RGB space; for example, (0,0,1) would be stored as (.5,.5,1), since actual
    offsets range [-1,+1], but RGB values range [0,1].


    We can make use of such a normal map through yet another clever application of
    texture units: Instead of storing colors in the texture unit, we store the desired
    normal vectors. We can then use a sampler to look up the value in the normal map
    for a given fragment, and then rather than applying the returned value to the
    output pixel color (as we did in texture mapping), we instead use it as the normal
    vector.


    One example of such a normal map image file is shown in Figure 10.3. It was generated
    by applying the GIMP normal mapping plugin [GI21] to a texture from Luna [LU16].
    Normal mapping image files are not intended for viewing; we show this one to point
    out that such images end up being largely blue. This is because every entry in
    the image file has a B value of 1 (maximum blue), making the image appear “bluish”
    if viewed.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_266_0.png)


    **Figure 10.3**

    Normal mapping image file example [LU16].


