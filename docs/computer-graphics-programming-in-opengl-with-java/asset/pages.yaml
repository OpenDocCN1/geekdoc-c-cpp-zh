  md: "# Program 10.2 Normal Mapping Fragment Shader\n\n```\n```glsl\n#version 430\n\
    in vec3 varyingLightDir;\nin vec3 varyingVertPos;\nin vec3 varyingNormal;\nin\
    \ vec3 varyingTangent;\nin vec3 originalVertex;\nin vec2 tc;\nout vec4 fragColor;\n\
    \nlayout (binding=0) uniform sampler2D normMap;\n// remaining uniforms same as\
    \ before\n...\nvec3 calcNewNormal()\n{\n    vec3 normal = normalize(varyingNormal);\n\
    \    vec3 tangent = normalize(varyingTangent);\n    tangent = normalize(tangent\
    \ - dot(tangent, normal) * normal);  // tangent is perpendicular to normal\n \
    \   vec3 bitangent = cross(tangent, normal);\n    mat3 tbn = mat3(tangent, bitangent,\
    \ normal);                  // TBN matrix to convert to camera space\n    vec3\
    \ retrievedNormal = texture(normMap,tc).xyz;\n    retrievedNormal = retrievedNormal\
    \ * 2.0 - 1.0;                // convert from RGB space\n    vec3 newNormal =\
    \ tbn * retrievedNormal;\n    newNormal = normalize(newNormal);\n    return newNormal;\n\
    }\n\nvoid main(void)\n{\n    // normalize the light, normal, and view vectors:\n\
    \    vec3 L = normalize(varyingLightDir);\n    vec3 V = normalize(-v_matrix[3].xyz\
    \ - varyingVertPos);\n    vec3 N = calcNewNormal();\n\n    // get the angle between\
    \ the light and surface normal:\n    float cosTheta = dot(L,N);\n\n    // compute\
    \ light reflection vector with respect to N:\n    vec3 R = normalize(reflect(-L,\
    \ N));\n\n    // angle between the view vector and reflected light:\n    float\
    \ cosPhi = dot(V,R);\n\n    // compute ADS contributions (per pixel):\n    fragColor\
    \ = globalAmbient * material.ambient\n    + light.ambient * material.ambient\n\
    \    + light.diffuse * material.diffuse * max(cosTheta,0.0)\n    + light.specular\
    \ * material.specular * pow(max(cosPhi,0.0), material.shininess);\n}\n```\n```"
