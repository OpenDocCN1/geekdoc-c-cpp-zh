- pgno: 450
  md: '# ## 16.5 RAY TRACING


    So far, all of the results we have seen from Programs 16.2 through 16.8 could
    have been accomplished with the methods described earlier in the book using models
    and buffers (and probably more efficiently). We now extend our ray casting program
    to do full ray tracing, which extends the capabilities for lighting and reflection
    beyond what we have been able to perform up to now.


    The ray casting algorithm described in Section 16.2 involved sending out a single
    ray per pixel, identifying whether (and where) it first encounters an object in
    the scene, and then painting the pixel accordingly. However, we have the option
    of generating a new ray from the intersection point (such as a ray that simulates
    a reflection off of the surface, which we can use the surface normal to generate)
    and then seeing where that new ray leads. These bounced rays are called *secondary
    rays*, and these can be used to generate reflections, refractions, and other effects.
    We have actually already seen one example of a secondary ray: in Program 16.4,
    when we tested to see if an object was in shadow, we did so by generating a secondary
    ray from the collision point to the light source and checked to see if that secondary
    ray collided with an intervening object.


    # ### 16.5.1 Reflection


    Perhaps the most obvious use for secondary rays is to generate reflections of
    objects off of each other. If we color an object based solely on a secondary reflected
    ray, it will behave like a pure mirror. Or, we might choose to blend an object''s
    color with the color obtained by a reflected ray, depending on the material qualities
    we are trying to simulate. We have already seen GLSL''s reflect() function, which
    is useful here. Recall that the reflect() function takes an incident vector and
    a surface normal and returns the direction of a reflection vector.


    In Program 16.9, we extend Program 16.8 so as to generate a single secondary reflection
    ray when the initial ray collides with the sphere. The sphere color is then set
    to the color encountered by the secondary ray (also incorporating ADS lighting).
    The result is shown in Figure 16.11.'
  merge: -1
  img_proc: true
