    # 15.6 UNDERWATER CAUSTICS


    It is common to observe curved bands of light on an underwater floor, as light
    from above the water is transmitted to the floor from the various undulations
    on the wavy surface. These bands are sometimes called *water caustics* [W19],
    and adding them can make an underwater scene more clearly appear underwater. In
    this section, we only add them to our scene whenever the camera is below the water
    surface (see Exercise 15.4 for the case where the camera is above the water surface).


    Simulating water caustics can be done in a variety of ways. They can be done fairly
    accurately using ray tracing, although this can be complex and computationally
    expensive [G07]. However, in most cases, it isn’t necessary for the caustics to
    be perfectly accurate, and even a rough simulation is adequate to convey an underwater
    effect. In most cases, generating white lines that bend in a manner consistent
    with the waves on the water surface is sufficient.'
