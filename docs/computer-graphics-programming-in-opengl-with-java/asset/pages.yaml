- pgno: 475
  md: '# ### 16.3.7 Blending Colors for Transparent Objects


    So far, all of our transparent objects (which we have been modeling with refracted
    secondary rays) have had no color (or have been colored white). It is natural
    to want to make colored transparent objects, such as a tinted window. Even though
    we have the tools for doing this, there are some rather surprising difficulties
    that can occur in many cases.


    It is a simple matter to declare an object to be transparent, and also having
    a color, by simply assigning an RGB value for whatever color we want (such as
    [1,0,0] for red), and then combining this color with the incoming refracted color
    as we did in previous examples. However, the results are not always as one would
    expect! For example, suppose that we declare three planes colored red, yellow,
    and blue, and stack them in our scene so that we can see the result of mixing
    the colors as we have been doing, with equal weights where they overlap. The result
    is shown in Figure 16.23. Is this what you would expect to see if these were real
    colored panes of glass?


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_475_0.png)


    **Figure 16.23**

    A scene with three overlapping colored panes, colors mixed equally.'
