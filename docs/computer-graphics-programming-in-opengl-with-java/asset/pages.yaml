- pgno: 13
  md: 'is based on OpenGL ES, which in turn is based on standard OpenGL, much of what
    *is* covered in this book can be transferred directly to learning about these
    OpenGL variants.


    The very topic of 3D graphics lends itself to impressive, even beautiful images.
    Indeed, many popular textbooks on the topic are filled with breathtaking scenes,
    and it is enticing to leaf through their galleries. While we acknowledge the motivational
    utility of such examples, our aim is to teach, not to impress. The images in this
    book are simply the outputs of the example programs, and because this is an introductory
    text, the resulting scenes are unlikely to impress an expert. However, the techniques
    presented do constitute the foundational elements for producing today''s stunning
    3D effects.


    We also haven''t tried to create an OpenGL or JOGL “reference.” Our coverage of
    OpenGL and JOGL represents only a tiny fraction of their capabilities. Rather,
    our aim is to use OpenGL and JOGL as vehicles for teaching the fundamentals of
    modern shader-based 3D graphics programming, and provide the reader with a sufficiently
    deep understanding for further study. If along the way this text helps to expand
    awareness of JOGL and other JogAmp technologies, that would be nice, too.


    # ## *What''s New in This Edition*


    We have added three new chapters in this 3^rd^ edition of *Computer Graphics Programming
    in OpenGL with Java*:


    +   - Chapter 15 – *Simulating Water*

    +   - Chapter 16 – *Ray Tracing*

    +   - Chapter 17 – *Stereoscopy*


    Ray tracing in particular has become “hot” recently, so we are especially excited
    that it is now included in our book. It is also a huge topic, so even though our
    coverage is just a basic introduction, Chapter 16 is now the longest chapter in
    the book. Chapter 16 also includes an introduction to *compute shaders*, which
    were introduced in OpenGL 4.3, and an introduction to additive and subtractive
    color blending, which expands on a topic that was introduced in Section 14.2.


    For years our own students have repeatedly expressed an interest in simulating
    water. However, water takes so many forms that writing an introductory section
    on the topic is challenging. Ultimately, we decided to present water in a way
    that would complement related topics in the book such as terrain, sky, etc., and
    so in Chapter 15 we focus on utilizing our noise maps from Chapter 14 to generate
    water surfaces such as are seen in lakes and oceans.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'The new chapter on stereoscopy is motivated by the increased popularity of
    virtual reality. However, it is also applicable to the development of animation
    for “3D movies,” and we have tried to provide introductory coverage of both uses
    equally.


    As a result of these additions, this 3<sup>rd</sup> edition is larger than the
    previous edition.


    Besides the new material, there are important revisions throughout the book. For
    example, we fixed bugs in our *Torus* class in Chapter 6, and made significant
    improvements to our noise map functions in Chapter 14. Another small, but important,
    modification was to change all of our lighting computations so that they are done
    in world space rather than in camera space – this makes it easier to develop applications
    that require being able to move the camera around. We also expanded our `Utils.java`
    utility class to handle the loading of compute shaders.


    There are dozens of small changes in every chapter that the reader might not even
    notice: fixing typos, cleaning up code inconsistencies, updating the installation
    instructions, making slight wording changes, sprucing up figures, updating references,
    etc. Completely eliminating typos is virtually impossible in a book that covers
    an ever-changing technology-rich topic, but we have attempted it.


    # ## Intended Audience


    This book is targeted at students of computer science. This could mean undergraduates
    pursuing a BS degree, but it could also mean anyone who studies computer science.
    As such, we are assuming that the reader has at least a solid background in object-oriented
    programming, at the level of someone who is, say, a computer science major at
    the junior or senior level.


    There are also some specific things that we use in this book, but that we don’t
    cover, because we assume the reader already has sufficient background. In particular:


    +   - Java and its Abstract Window Toolkit (AWT) or Swing library, especially
    for GUI-building

    +   - Java configuration details, such as manipulating the CLASSPATH

    +   - basic data structures and algorithms, such as linked lists, stacks and queues,
    etc.

    +   - recursion

    +   - event-driven programming concepts

    +   - basic matrix algebra and trigonometry

    +   - basic analytic geometry, such as for defining points, lines, vectors, planes,
    and circles'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - awareness of color models, such as RGB, RGBA, etc.

    +   - basic familiarity with C or C++ (some shader syntax is based on C)


    The audience for this new 3rd edition is also hoped to be expanded by the similar
    updates made for the 2nd edition of its “sister” textbook, *Computer Graphics
    Programming in OpenGL with C++*. In particular, we envision a learning environment
    where students are free to utilize either Java or C++ in the same classroom, selecting
    one or the other book. The two texts cover the material sufficiently in lockstep
    that we have been conducting our graphics programming course successfully in this
    manner.


    # How to Use This Book


    This book is designed to be read from front to back. That is, material in later
    chapters frequently relies on information learned in earlier chapters. So, it
    probably won’t work to jump back and forth in the chapters; rather, work your
    way forward through the material.


    This is also intended mostly as a practical, hands-on guide. While there is plenty
    of theoretical material included, the reader should treat this text as a sort
    of “workbook,” in which you learn basic concepts by actually programming them
    yourself. We have provided code for all of the examples, but to really learn the
    concepts you will want to “play” with those examples—extend them to build your
    own 3D scenes.


    At the end of each chapter are a few exercises to solve. Some are very simple,
    involving merely making simple modifications to the provided code. The problems
    that are marked “(PROJECT),” however, are expected to take some time to solve,
    and require writing a significant amount of code, or combining techniques from
    various examples. There are also a few marked “(RESEARCH)”—those are problems
    that encourage independent study because this textbook doesn’t provide sufficient
    detail to solve them.


    OpenGL calls, whether made in C or in Java through JOGL, often involve long lists
    of parameters. While writing this book, the authors debated whether or not to,
    in each case, describe all of the parameters. We decided that in the early chapters
    we would describe every detail. But as the topics progress, we decided to avoid
    getting bogged down in every piece of minutiae in the OpenGL calls (and there
    are many), for fear of the reader losing sight of the big picture. For this reason,
    it is essential when working through the examples to have ready access to reference
    material for Java, OpenGL, and JOGL.


    For this, there are a number of excellent reference sources that we recommend
    using in conjunction with this book. The *javadocs* for Java and JOGL are absolutely
    essential, and can be accessed online or downloaded. The reader should bookmark
    them for easy'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'access in a browser, and *expect to access them continuously* for looking up
    items such as parameter and constructor details. The URLs for the Java and JOGL
    javadocs are:


    https://docs.oracle.com/en/java/javase/11/docs/api

    https://jogamp.org/deployment/jogamp-next/javadoc/jogl/javadoc


    Many of the entries in the JOGL javadoc are simply pointers to the corresponding
    entry in the OpenGL documentation, available here:


    https://www.khronos.org/registry/OpenGL-Refpages/gl4/


    Our examples utilize a mathematics library called JOML. This is a Java library
    that also has its own set of javadocs. After installing JOML (described in the
    appendices), the reader should locate the accompanying javadoc link and bookmark
    it. At press time, the current link is:


    https://joml-ci.github.io/JOML/apidocs


    There are many other books on 3D graphics programming that we recommend reading
    in parallel with this book (such as for solving the “research” problems). Here
    are five that we often refer to:


    +   - (Sellers et al.) *OpenGL SuperBible* [SW15]

    +   - (Kessenich et al.) *OpenGL Programming Guide* [KS16] (the “red book”)

    +   - (Wolff) *OpenGL 4 Shading Language Cookbook* [WO18]

    +   - (Angel and Shreiner) *Interactive Computer Graphics* [AS20]

    +   - (Luna) *Introduction to 3D Game Programming with DirectX 12* [LU16]


    # ## *Companion Files*


    This book is accompanied by a companion disc that contains the following items:


    +   - All of the Java/OpenGL programs and related utility class files and GLSL
    shader code presented in the book

    +   - The models and texture files used in the various programs and examples

    +   - The cubemap and skydome image files used to make the skies and horizons

    +   - Normal maps and height maps for lighting and surface detail effects

    +   - All of the figures in the book, as image files


    Readers who have purchased the electronic version of this book may obtain these
    files by contacting the publisher at info@merclearning.com.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# ## Instructor Ancillaries


    Instructors in a college or university setting are encouraged to obtain the *instructor
    ancillary package* that is available for this book, which contains the following
    additional items:


    +   - A complete set of PowerPoint slides covering all topics in the book

    +   - Solutions to most of the exercises at the ends of the chapters, including
    code where applicable

    +   - Sample syllabus for a course based on the book

    +   - Additional hints for presenting the material, chapter-by-chapter


    This instructor ancillary package is available by contacting the publisher at
    info@merclearning.com.


    # ## Acknowledgments


    Early drafts of this book (prior to the 1st edition) were developed in 2016 for
    the CSc-155 (Advanced Computer Graphics Programming) course at CSU Sacramento.
    Many CSc-155 students actively contributed suggestions and bug fixes during that
    year, including Mitchell Brannan, Tiffany Chiapuzio-Wong, Samson Chua, Anthony
    Doan, Kian Faroughi, Cody Jackson, John Johnston, Zeeshan Khalid, Raymond Rivera,
    Oscar Solorzano, Darren Takemoto, Jon Tinney, James Womack, and Victor Zepeda.
    The following year our colleague Dr. Pinar Muyan-Özçelik used the book while teaching
    CSc-155 for her first time, and kept a running log of questions and corrections
    for each chapter, which led to many improvements for subsequent editions.


    In Spring 2020 we tested our idea of allowing students (in our CSc-155 course)
    to select either Java or C++, using the respective edition of this textbook. It
    was a sort of acid test of our “sister” textbook idea, and we were pleased with
    how things went. We have been teaching the course in this manner ever since.


    Much of the code in Chapters 15 and 16 was developed by two of our best students,
    Chris Swenson and Luis Gutierrez, respectively. Both did an excellent job of distilling
    these complex topics into nicely coherent solutions, and their contributions helped
    to make these two new chapters possible.


    We continue to receive a steady stream of great feedback from instructors around
    the world who adopt our books for their courses, and from professionals and enthusiasts
    – Dr. Mauricio Papa (University of Tulsa), Dan Asimov (NASA Ames), Sean McCrory,
    Michael Hiatt, Scott Anderson, Reynaldo Hernandez, and Bill Crupi, just to name
    a few.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Dr. Alan Mills, over the course of several months starting in early 2020, sent
    us over two hundred suggestions and corrections from his notes as he worked through
    our 2nd edition. Among his many finds was a significant correction to the texture
    coordinates in the torus model. Alan''s attention to detail is amazing and we
    greatly appreciate the positive impact of his efforts on our books (many of his
    suggestions were also applicable to the C++ edition).


    Jay Turberville of Studio 522 Productions in Scottsdale (Arizona) built the dolphin
    model shown on the cover and used throughout all of our books. Our students love
    it. Studio 522 Productions does incredibly high-quality 3D animation and video
    production, as well as custom 3D modeling. We are thrilled that Mr. Turberville
    kindly offered to build such a wonderful model just for these books.


    We are extremely grateful for the ongoing assistance provided to us by Julien
    Gouesse, engine support maintainer at JogAmp. Mr. Gouesse has provided technical
    information on JOGL textures, cube maps, buffer handling, animation, proper loading
    of shader source files, and a variety of other topics. His help has led to significant
    improvements in each edition.


    Kai Burjack, lead developer of the JOML math library, has been extraordinarily
    generous with his time and assistance since we migrated to using JOML in our 2nd
    edition. He reviewed key segments of our book and has helped guide us to (hopefully!)
    using JOML correctly.


    We wish to thank a few other artists and researchers who were gracious enough
    to allow us to utilize their models and textures. James Hastings-Trew of Planet
    Pixel Emporium provided many of the planetary surface textures. We thank Jochum
    Skoglund of Crackershell for permitting us to use his beautiful “MIRAMAR” skybox,
    and for allowing us to include it in the accompanying ancillary files. Paul Bourke
    allowed us to use his wonderful star field. Dr. Marc Levoy of Stanford University
    granted us permission to use the famous “Stanford Dragon” model. Paul Baker''s
    bump-mapping tutorial formed the basis of the “torus” model we used in many examples.
    We also thank Mercury Learning for allowing us to use some of the textures from
    [L16].


    The late Dr. Danny Kopec connected us with Mercury Learning and introduced us
    to its publisher, David Pallai. Being a chess enthusiast, Dr. Gordon (one of the
    authors) was originally familiar with Dr. Kopec as a well-known international
    chess master and prolific chess book author. He was also a computer science professor,
    and his textbook, *Artificial Intelligence in the 21st Century*, inspired us to
    consider Mercury Learning for our book project. We had several telephone conversations
    with Dr. Kopec which were extremely informative. We were deeply saddened by Dr.
    Kopec''s untimely passing in 2016, and'
