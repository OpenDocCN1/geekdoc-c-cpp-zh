- pgno: 522
  md: '+   5. The Frame debugger screen should appear, along with a HUD toolbar and
    a horizontal selection tool called a “scrubber.” Your program will likely freeze
    at this point. In the center of the debugger screen is left bar with buttons for
    each shader stage. For example, you can highlight “VS” for “Vertex Shader,” and
    in the larger center box to its right, you can scroll down and look at the contents
    of the uniform variables (presuming you have “API inspector” selected above it).
    In the following screenshot, the small box to the right of “proj_matrix” has been
    opened, revealing the contents of the 4×4 projection matrix.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_522_0.png)


    +   6. Another interesting window that appears is one that looks similar to your
    running program. This window has a timeline along the bottom, which allows you
    to click and see the sequence of items drawn on the frame. Here is an example—note
    the cursor has been clicked on the left area of the timeline and it shows those
    items that have been drawn up to that point:


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_522_1.png)'
