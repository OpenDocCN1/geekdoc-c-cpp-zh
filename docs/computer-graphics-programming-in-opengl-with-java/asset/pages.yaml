    All of our shader files will be named with a “.glsl” extension.


    # SUPPLEMENTAL NOTES


    There are many details of the OpenGL pipeline that we have not discussed in this
    introductory chapter. We have skipped a number of internal stages and have completely
    omitted how textures are processed. Our goal was to map out, as simply as possible,
    the framework in which we will be writing our code. As we proceed we will continue
    to learn additional details.


    We have also deferred presenting code examples for tessellation and geometry.
    In later chapters we will build complete systems that show how to write practical
    shaders for each of the stages.


    There are more sophisticated ways to organize the code for animating a scene,
    especially with respect to managing threads. Readers interested in designing a
    render loop (or “game loop”) appropriate for a particular application are encouraged
    to consult some of the more specialized books on game engine design (e.g., [NY14]),
    and to peruse the related discussions on gamedev.net [GD21].'
