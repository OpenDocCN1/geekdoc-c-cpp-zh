    \nFigure 14.20\nDolphin textured with 'wood' 3D noise map.\n\nThe resulting 3D\
    \ textured wood dolphin is shown in Figure 14.20. There is one additional detail\
    \ in the fragment shader worth noting. Since we are rotating the model within\
    \ a 3D texture, it is sometimes possible for this to cause the vertex positions\
    \ to move beyond the typical [0..1] range of texture coordinates as a result of\
    \ the rotation. If this were to happen, we could adjust for this possibility by\
    \ dividing the original vertex positions by a larger number (such as 4.0 rather\
