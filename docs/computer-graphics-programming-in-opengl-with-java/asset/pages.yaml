- pgno: 462
  md: "```\n```c\n// Five-phase processing of a given ray: (1) collision, (2) lighting,\
    \ (3) reflection, (4) refraction, (5) mixing\nvoid process_stack_element(int index)\n\
    {\n    // If there is a popped_stack_element that was previously processed, it\
    \ holds reflection/refraction\n    // information for the current stack element.\
    \ Store that info, then clear the popped element reference.\n    if (popped_stack_element\
    \ != null_stack_element) // GLSL element-wise comparison of structs\n    {\n \
    \       if (popped_stack_element.type == RAY_TYPE_REFLECTION)\n            stack[index].reflected_color\
    \ = popped_stack_element.final_color;\n        else if (popped_stack_element.type\
    \ == RAY_TYPE_REFRACTION)\n            stack[index].refracted_color = popped_stack_element.final_color;\n\
    \        popped_stack_element = null_stack_element;\n    }\n    Ray r = stack[index].ray;\
    \                 // initialized by the initial call\n    Collision c = stack[index].collision;\
    \    // starts null, gets set in phase 1\n\n    switch (stack[index].phase)\n\
    \    {\n        // ========== PHASE 1 - raytrace collision detection\n       \
    \ case 1:\n            c = get_closest_collision(r);                    // Cast\
    \ ray into the scene, store collision result\n            if (c.object_index !=\
    \ -1)                         // If the ray didn't hit anything, stop.\n     \
    \           stack[index].collision = c;                    // otherwise, store\
    \ the collision result\n            break;\n        // ========== PHASE 2 - Phong\
    \ ADS lighting computation\n        case 2:\n            stack[index].phong_color\
    \ = ads_phong_lighting(r, c);\n            break;\n        // ========== PHASE\
    \ 3 - generate a reflection ray\n        case 3:\n            if (stack[index].depth\
    \ < max_depth)               // stop if at max depth\n            {   if ((c.object_index\
    \ == 1) || ((c.object_index == 2)) // only sphere and box are reflective\n   \
    \             {\n                    Ray reflected_ray;\n                    reflected_ray.start\
    \ = c.p + c.n * 0.001;\n                    reflected_ray.dir = reflect(r.dir,\
    \ c.n);\n                    // add a raytrace for that ray to the stack, and\
    \ set its type to reflection\n                    push(reflected_ray, stack[index].depth+1,\
    \ RAY_TYPE_REFLECTION);\n                }\n            }\n            break;\n\
    \        // ========== PHASE 4 - generate a refraction ray\n        case 4:\n\
    \            if (stack[index].depth < max_depth)               // stop if at max\
    \ depth\n            {   if (c.object_index == 1)                      // only\
    \ the sphere is transparent\n                {\n                    Ray refracted_ray;\n\
    \                    refracted_ray.start = c.p - c.n * 0.001;\n```\n```"
