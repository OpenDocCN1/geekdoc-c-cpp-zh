    In this chapter, we study a method for creating highly realistic lighting effects
    called *ray tracing*. We studied lighting previously in Chapter 7, and then in
    Chapter 9 we saw a simple method for simulating reflection called environment
    mapping. However, all of these methods only partially simulate lighting effects.
    For example, the ADS lighting model only considers the effect that a light source
    has on a surface, without regard to the effects of light reflected between objects
    in the scene. Similarly, environment mapping is limited to modeling the reflection
    of a cube map, but not neighboring objects. By contrast, ray tracing more closely
    models the actual paths of light through a scene, considering reflections between
    objects, shadows, and even refraction through transparent objects. Ray tracing
    is capable of generating highly detailed and photo-realistic effects, although
    it requires significant computing resources and cannot always be done in real
    time.


    Ray tracing is motivated by a simple idea: if we can follow the paths of light
    rays from their source to our eyes, we can faithfully reproduce what we would
    see. However, in practice this would be infeasible – there are simply too many
    light rays, most of which don’t even end up reaching our eyes (or have only a
    marginal effect on what we perceive).


    A very clever alternative is to reverse this idea. Instead of tracing rays from
    their source to our eye, we instead trace rays starting from the eye, “bouncing”
    them some number of times off of the objects in the scene, accumulating and combining'
