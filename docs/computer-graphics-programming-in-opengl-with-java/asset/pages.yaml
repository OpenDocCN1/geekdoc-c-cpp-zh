  md: '# ## CHAPTER 6


    # # 3D Models


    +   - **6.1** *Procedural Models—Building a Sphere* ... 134

    +   - **6.2** *OpenGL Indexing—Building a Torus* ... 142

    +   - **6.3** *Loading Externally Produced Models* ... 148

    +   - *Supplemental Notes* ... 158


    So far we have dealt only with very simple 3D objects, such as cubes and pyramids.
    These objects are so simple that we have been able to explicitly list all of the
    vertex information in our source code and place it directly into buffers.


    However, most interesting 3D scenes include objects that are too complex to continue
    building them as we have, by hand. In this chapter, we will explore more complex
    object models, how to build them, and how to load them into our scenes.


    3D modeling is itself an extensive field, and our coverage here will necessarily
    be very limited. We will focus on the following two topics:


    +   - *building models procedurally*

    +   - *loading models produced externally*


    While this only scratches the surface of the rich field of 3D modeling, it will
    give us the capability to include a wide variety of complex and realistically
    detailed objects in our scenes.'
