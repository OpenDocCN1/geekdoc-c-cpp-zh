  md: 'enable subsequent OpenGL calls to determine the shader’s *vertex attribute*
    and *uniform* locations. The `display()` function next gets the uniform variable
    locations; builds the perspective, view, and model matrices;^3 concatenates the
    view and model matrices into a single MV matrix; and assigns the perspective and
    MV matrices to their corresponding uniforms.


    Next, `display()` enables the buffer containing the cube vertices and attaches
    it to 0th vertex attribute to prepare for sending the vertices to the shader.


    The last thing `display()` does is draw the model by calling `glDrawArrays()`,
    specifying that the model is composed of triangles and has 36 total vertices.
    The call to `glDrawArrays()` is typically preceded by additional commands that
    adjust rendering settings for this model.^4 In this example, there are two such
    commands, both of which are related to depth testing. Recall from Chapter 2 that
    depth testing is used by OpenGL to perform hidden surface removal. Here we enable
    depth testing, and specify the particular depth test we wish OpenGL to use. The
    settings shown correspond to the description in Chapter 2; later in the book we
    will see other uses for these commands.


    Finally, consider the shaders. First, note that they both include the same block
    of uniform variable declarations. Although this is not always required, it is
    often a good practice to include the same block of uniform variable declarations
    in all of the shaders within a particular rendering program.


    Note also in the vertex shader the presence of the layout qualifier on the incoming
    vertex attribute position. Since the location is specified as “0” the `display()`
    function can reference this variable simply by using 0 in the first parameter
    of the `glVertexAttribPointer()` function call, and in the `glEnableVertexAttribArray()`
    function call. Note also that the position vertex attribute is declared as a `vec3`,
    and so it needs to be converted to a `vec4` in order to be compatible with the
    4x4 matrices with which it will be multiplied. This conversion is done with `vec4(position,1.0)`,
    which builds a `vec4` out of the variable named “position” and puts a value of
    1.0 in the newly added fourth spot.


    ^3 An astute reader may notice that it shouldn’t be necessary to build the perspective
    matrix every time `display()` is called, because its value doesn’t change. This
    is partially true—the perspective matrix *would* need to be recomputed if the
