  md: 'Start by examining the function near the end of the Java/JOGL listing, `setupVertices()`,
    called by `init()`. At the start of this function, an array is declared called
    `vertexPositions` that contains the 36 vertices comprising the cube. At first
    you might wonder why this cube has 36 vertices, when logically a cube should only
    require eight. The answer is that we need to build our cube out of triangles,
    and so each of the six cube faces needs to be built of two triangles, for a total
    of 6x2=12 triangles (see Figure 4.4). Since each triangle is specified by three
    vertices, this totals 36 vertices. Since each vertex has three values (x,y,z),
    there are a total of 36x3=108 values in the array. It is true that each vertex
    participates in multiple triangles, but we still specify each vertex separately
    because for now we are sending each triangle’s vertices down the pipeline separately.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_95_0.png)


    The cube is defined in its own coordinate system, with (0,0,0) at its center,
    and with its corners ranging from -1.0 to +1.0 along the x, y, and z axes. The
    rest of the `setupVertices()` function sets up the VAO, two VBOs (although only
    one is used), and loads the cube vertices into the 0th VBO buffer.


    Note that the `init()` function performs tasks that only need to be done once:
    reading in the shader code and building the rendering program, and loading the
    cube vertices into the buffer (by calling “`setupVertices()`”). Note that it also
    positions the cube and the camera in the world; later we will animate the cube
    and also see how to move the camera around, at which point we may need to remove
    this hardcoded positioning.


    Now let’s look at the `display()` function. Recall that `display()` may be called
    repeatedly and the rate at which it is called is referred to as the *frame rate*.
    That is, animation works by continually drawing and redrawing the scene, or *frame*,
    very quickly. It is usually necessary to clear the depth buffer before rendering
    a frame, so that hidden surface removal occurs properly (not clearing the depth
    buffer can sometimes result in every surface being removed, resulting in a completely
    black screen). By default, depth values in OpenGL range from 0.0 to 1.0. Clearing
    the depth buffer is done by calling `glClear(GL_DEPTH_BUFFER_BIT)`, which fills
    the depth buffer with the default value (usually 1.0).


    Next, `display()` enables the shaders by calling `glUseProgram()`, installing
    the GLSL code on the GPU. Recall this doesn’t run the shader program, but it does'
