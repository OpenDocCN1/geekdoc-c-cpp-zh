    \ implementation, virtually all of the computations can be performed in the fragment\
    \ shader.\n\nProgram 14.1 shows the relevant code for a very simple fog algorithm\
    \ that uses a linear blend from object color to fog color based on the distance\
    \ from the camera to the pixel. Specifically, this example adds fog to the height\
    \ mapping example from Program 10.4.\n\n# Program 14.1 Simple Fog Generation\n\
    \nVertex (or Tessellation Control) shader\n\n```\n…\nout vec3 vertEyeSpacePos;\n\
    …\n// Compute vertex position in eye space, without perspective, and send it to\
    \ the fragment shader.\n// The variable “p” is the height-mapped vertex, as described\
    \ earlier in Program 10-4.\nvertEyeSpacePos = (mv_matrix * p).xyz;\n```"
