    | **GL_TRIANGLE_STRIP**<br>![GL_TRIANGLE_STRIP diagram](gl_triangle_strip.png)
    | Each vertex that passes through the pipeline efficiently forms a triangle with
    the previous two vertices:<br>`vertices:` 0 1 2 3 4 etc.<br>`triangles:` ✓ ✓ ✓
    |'
