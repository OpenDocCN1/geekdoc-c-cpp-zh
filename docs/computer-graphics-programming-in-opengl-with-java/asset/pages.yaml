- pgno: 283
  md: 'Substituting the definitions of \(p_{02}\) and \(p_{01}\) gives


    $$P(t)=t[\mathbf{p}_2+(1-t)\mathbf{p}_1]+(1-t)[t\mathbf{p}_1+(1-t)\mathbf{p}_0]$$


    Factoring and combining terms then gives


    $$P(t)=(1-t)^2\mathbf{p}_0+(-2t^2+2t)\mathbf{p}_1+t^2\mathbf{p}_2$$


    or


    $$P(t)=\sum_{i=0}^{2}\mathbf{p}_i B_i(t)$$


    where


    $$B_0(t)=(1-t)^2,\quad B_1(t)=-2t^2+2t,\quad B_2(t)=t^2$$


    Thus, we find any point on the curve by a weighted sum of the control points.
    The weighting function *B* is often called a “blending function” (although the
    name *B* actually derives from Sergei Bernstein [BE21] who first characterized
    this family of polynomials). Note that the blending functions are all quadratic
    in form, which is why the resulting curve is called a quadratic Bézier curve.


    # ## 11.2 CUBIC BÉZIER CURVES


    We now extend our model to *four* control points, resulting in a *cubic* Bézier
    curve as shown in Figure 11.4. Cubic Bézier curves are capable of defining a much
    richer set of shapes than quadratic curves, which are limited to concave shapes.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_283_0.png)


    **Figure 11.4** Building a cubic Bézier curve.


    As for the quadratic case, we can derive an analytic definition for cubic Bézier
    curves:


    $$\mathbf{p}_{01}(t)=t\mathbf{p}_1+(1-t)\mathbf{p}_0,\quad \mathbf{p}_{12}(t)=t\mathbf{p}_2+(1-t)\mathbf{p}_1$$'
