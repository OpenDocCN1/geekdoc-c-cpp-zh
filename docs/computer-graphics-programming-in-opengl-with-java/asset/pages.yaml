  md: "# Fragment shader\n\n```\n```glsl\n...\nin vec3 vertEyeSpacePos;\nout vec4\
    \ fragColor;\n...\nvoid main(void)\n{\n    vec4 fogColor = vec4(0.7, 0.8, 0.9,\
    \ 1.0);        // bluish gray\n    float fogStart = 0.2;\n    float fogEnd = 0.8;\n\
    \n    // the distance from the camera to the vertex in eye space is simply the\
    \ length of a\n    // vector to that vertex, because the camera is at (0,0,0)\
    \ in eye space.\n    float dist = length(vertEyeSpace.xyz);\n    float fogFactor\
    \ = clamp(((fogEnd - dist) / (fogEnd - fogStart)), 0.0, 1.0);\n    fragColor =\
    \ mix(fogColor, (texture(t,tc), fogFactor);\n}\n```\n```\n\nThe variable fogColor\
    \ specifies a color for the fog. The variables fogStart and fogEnd specify the\
    \ range (in eye space) over which the output color transitions from object color\
    \ to fog color, and can be tuned to meet the needs of the scene. The percentage\
    \ of fog mixed with the object color is calculated in the variable fogFactor,\
    \ which is the ratio of how close the vertex is to fogEnd to the total length\
    \ of the transition region. The GLSL clamp() function is used to restrict this\
    \ ratio to being between the values 0.0 and 1.0. The GLSL mix() function then\
    \ returns a weighted average of fog color and object color, based on the value\
    \ of fogFactor. Figure 14.2 shows the addition of fog to a scene with height-mapped\
    \ terrain. (A rocky texture from [LU16] has also been applied.)\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_335_0.png)"
