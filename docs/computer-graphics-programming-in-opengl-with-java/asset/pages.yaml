- pgno: 488
  md: 'were the inspiration for the widely popular View-Master® toys that emerged
    in the mid-1900s, and more recently for virtual reality headsets (see Figure 17.1).
    Devices of this sort are often called “side-by-side” viewers.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_488_0.png)


    **Figure 17.1**

    Side-by-side viewers, from left to right: 1800''s stereoscope, 1960''s View-Master®,
    and 2016 Oculus Quest® VR headset.

    Photo of 1800''s Holmes stereoscope image by Dave Pape.

    https://commons.wikimedia.org/wiki/File:Holmes_stereoscope.jpg

    Photo of Oculus Quest by Bryan Cloverger, used with permission.


    Side-by-side viewing produces excellent results, however, it has one primary disadvantage:
    it is only feasible for small images, such as on a personal headset.


    Achieving stereoscopy on a larger scale, such as on a cinema movie screen, requires
    a different approach. The usual method is to project an image that contains both
    left and right images simultaneously, and then provide a special pair of glasses
    that only allows the left and right eyes to see their respective images. There
    are several technologies for achieving this; three currently popular ones are:


    +   - *Anaglyph* – the glasses'' lenses are two different colors, typically red
    and cyan; the left eye sees the red component of the image, and the right eye
    sees the cyan component. The image is projected such that the left eye''s view
    is rendered in red, and the right eye''s view is rendered in cyan.

    +   - *Polarized* – the glasses are split such that one side is polarized vertically
    and the other side is polarized horizontally. The image is projected such that
    each eye''s view is polarized in one or the other manner.

    +   - *Shutter* – the projected image alternates displaying the left and right
    images. The glasses alternate allowing the left and right sides to allow the image
    to pass through.


    Each of these technologies has its advantages and disadvantages. *Anaglyph* is
    the simplest and least expensive; early 3D movies used this method. However, the
    resulting color is often compromised. *Polarized* doesn''t suffer from color issues,'
