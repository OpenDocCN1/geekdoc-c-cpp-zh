    # ### 4.6.1 Instancing


    Instancing provides a mechanism for telling the graphics card to render multiple
    copies of an object using only a single Java call. This can result in a significant
    performance benefit, particularly when there are thousands or millions of copies
    of the object being drawn—such as when rendering many flowers in a field, or many
    zombies in an army.


    We start by changing the glDrawArrays() call in our Java/JOGL application to glDrawArraysInstanced().
    Now we can ask OpenGL to draw as many copies as we want. We can specify drawing
    24 cubes as follows:


    ```

    ```

    glDrawArraysInstanced(GL_TRIANGLES, 0, 36, 24);

    ```

    ```


    When using instancing, the vertex shader has access to a built-in variable, gl_InstanceID,
    an integer that refers to which numeric instance of the object is currently being
    processed.


    To replicate our previous tumbling cubes example using instancing, we will need
    to move the computations that build the different model matrices (previously inside
    a loop in display()) into the vertex shader. Since GLSL does not provide translate
    or rotate functions and we cannot make calls to JOML from inside a shader, we
    will need to use the utility functions from Program 3.1. We will also need to
    pass the “time factor” variable from the Java/JOGL application to the'
