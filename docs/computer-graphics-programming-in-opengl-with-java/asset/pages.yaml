    \ algorithm.\n\n# ## 2.2 DETECTING OPENGL AND GLSL ERRORS\n\nThe workflow for\
    \ compiling and running GLSL code differs from standard coding, in that *GLSL\
    \ compilation happens at Java runtime*. Another complication is that GLSL code\
    \ doesn't run on the CPU (it runs on the GPU), so *the operating system cannot\
    \ always catch OpenGL runtime errors*. This makes debugging difficult, because\
    \ it is often hard to detect if a shader failed, and why.\n\nProgram 2.3 (which\
    \ follows) presents some modules for catching and displaying GLSL errors. They\
    \ make use of the error string lookup tool gluErrorString() from the “GLU” library\
    \ [GL21], as well as OpenGL functions glGetShaderiv() and glGetProgramiv(), which\
    \ are used to provide information about compiled GLSL shaders and programs. Accompanying\
    \ them is the createShaderProgram() function from the previous Program 2.2, but\
    \ with the error-detecting calls added."
