    +   Supplemental Notes . . . . . . . . . . . . . . . . . . . . . . . . . . . .
    . . . . . . . . . . . 33


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_25_0.png)


    OpenGL (Open Graphics Library) is a multiplatform 2D and 3D graphics API that
    incorporates both hardware and software. Using OpenGL requires a graphics card
    (GPU) that supports a sufficiently up-to-date version of OpenGL (as described
    in Chapter 1).


    On the hardware side, OpenGL provides a multistage *graphics pipeline* that is
    partially programmable using a language called *GLSL* (OpenGL Shading Language).


    On the software side, OpenGL’s API is written in C, and thus the calls are directly
    compatible with C and C++. However, stable language *bindings* (or “wrappers”)
    are available for more than a dozen other popular languages (Java, Perl, Python,
    Visual Basic, Delphi, Haskell, Lisp, Ruby, etc.) with virtually equivalent performance.
    This textbook uses the popular Java wrapper **JOGL** (Java OpenGL). When using
    JOGL, the programmer writes a Java program that runs on the CPU (more specifically,
    on the Java Virtual Machine, or JVM) and includes JOGL (and thus, OpenGL) calls.
    We will refer to a Java program that contains JOGL calls as a *Java/JOGL application*.
    One important task of a Java/JOGL application is to install the programmer’s GLSL
    code onto the GPU.


    An overview of a JOGL-based graphics application is shown in Figure 2.1, with
    the software components highlighted in pink.'
