- pgno: 182
  md: 'Lighting models are sometimes called *shading models*, although in the presence
    of shader programming, that can be a bit confusing. Sometimes the term *reflection
    model* is used, complicating the terminology further. We will try to stick to
    whichever terminology is simplest and most practical.


    The most common lighting models today are called “ADS” models, because they are
    based on three types of reflection labeled A, D, and S:


    +   - Ambient reflection simulates a low-level illumination that equally affects
    everything in the scene.

    +   - Diffuse reflection brightens objects to various degrees depending on the
    light’s angle of incidence.

    +   - Specular reflection conveys the shininess of an object by strategically
    placing a highlight of appropriate size on the object’s surface where light is
    reflected most directly toward our eyes.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_182_0.png)


    Figure 7.1

    ADS Lighting contributions.


    ADS models can be used to simulate different lighting effects and a variety of
    materials.


    Figure 7.1 illustrates the ambient, diffuse, and specular contributions of a positional
    light on a shiny gold torus.


    Recall that a scene is ultimately drawn by having the fragment shader output a
    color for each pixel on the screen. Using an ADS lighting model requires specifying
    contributions due to lighting on a pixel’s RGBA output value. Factors include
    the following:


    +   - the type of light source and its ambient, diffuse, and specular characteristics

    +   - the object material’s ambient, diffuse, and specular characteristics

    +   - the object material’s specified “shininess”

    +   - the angle at which the light hits the object

    +   - the angle from which the scene is being viewed'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# ### 5.2.2 LIGHTS


    There are many types of lights, each with different characteristics and requiring
    different steps to simulate their effects. Some types include:


    +   - Global (usually called “global ambient”) because it includes only an ambient
    component)

    +   - Directional (or “distant”)

    +   - Positional (or “point source”)

    +   - Spotlight


    *Global ambient* light is the simplest type of light to model. Global ambient
    light has no source position—the light is equal everywhere, at each pixel on every
    object in the scene, regardless of where the objects are. Global ambient lighting
    simulates the real-world phenomenon of light that has bounced around so many times
    that its source and direction are undeterminable. Global ambient light has only
    an ambient component, specified as an RGBA value; it has no diffuse or specular
    components. For example, global ambient light can be defined as follows:


    ```

    ```

    float[] globalAmbient = new float[] { 0.6f, 0.6f, 0.6f, 1.0f };

    ```

    ```


    RGBA values range from 0 to 1, so global ambient light is usually modeled as dim
    white light, where each of the RGB values is set to the same fractional value
    between 0 and 1, with the alpha set to 1.


    *Directional*, or *distant* light also doesn’t have a source location, but it
    does have a *direction*. It is useful for situations where the source of the light
    is so far away that the light rays are effectively parallel, such as light coming
    from the sun. In many such situations we may only be interested in modeling the
    light, and not the object that produces the light. The effect of directional light
    on an object depends on the light’s angle of impact; objects are brighter on the
    side facing a directional light than on a tangential or opposite side. Modeling
    directional light requires specifying its direction (as a vector) and its ambient,
    diffuse, and specular characteristics (as RGBA values). A red directional light
    pointing down the negative Z axis might be specified as follows:


    ```

    ```

    float[] dirLightAmbient = new float[] { 0.1f, 0.0f, 0.0f, 1.0f };

    float[] dirLightDiffuse = new float[] { 1.0f, 0.0f, 0.0f, 1.0f };

    float[] dirLightSpecular = new float[] { 1.0f, 0.0f, 0.0f, 1.0f };

    float[] dirLightDirection = new float[] { 0.0f, 0.0f, -1.0f };

    ```

    ```'
