    The English language term *tessellation* refers to a large class of design activities
    in which tiles of various geometric shapes are arranged adjacently to form patterns,
    generally on a flat surface. The purpose can be artistic or practical, with examples
    dating back thousands of years [TS21].


    In 3D graphics, *tessellation* refers to something a little bit different, but
    no doubt inspired by its classical counterpart. Here tessellation refers to the
    generation and manipulation of large numbers of triangles for rendering complex
    shapes and surfaces, preferably in hardware. Tessellation is a rather recent addition
    to the OpenGL core, not appearing until 2010 with version 4.0.^1


    # ## 12.1 TESSELLATION IN OPENGL


    OpenGL support for hardware tessellation is made available through three pipeline
    stages:


    +   1. the *tessellation control shader*

    +   2. the *tessellator*

    +   3. the *tessellation evaluation shader*


    1 The OpenGL Utility library (GLU) had previously included a utility for tessellation
    much earlier called gluTess. In 2001, Radion released the first commercial graphics
    card with tessellation support, but there were few tools able to take advantage
    of it.'
