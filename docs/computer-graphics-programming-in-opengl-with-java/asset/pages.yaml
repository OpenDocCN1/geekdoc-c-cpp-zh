  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_73_0.png)


    More commonly, the V matrix is concatenated with the model matrix M to form a
    single *model-view* (MV) matrix:


    MV = V * M


    Then, a point P_M in its own model space is transformed directly to camera space
    in one step as follows:


    P_C = MV * P_M


    The advantage of this approach becomes clear when one considers that, in a complex
    scene, we will need to perform this transformation not on just one point, but
    on *every vertex in the scene*. By pre-computing MV, transforming each point into
    view space will require us to do just *one* matrix multiplication per vertex,
    rather than two. Later, we will see that we can extend this process to pre-computing
    several matrix concatenations, reducing the per-vertex computations considerably.


    # 3.8 PROJECTION MATRICES


    Now that we have established the camera, we can examine *projection matrices*.
    Two important projection matrices that we will now examine are (a) *perspective*
    and (b) *orthographic*.


    # 3.8.1 The Perspective Projection Matrix


    Perspective projection attempts to make a 2D picture appear 3D, by utilizing the
    concept of perspective to mimic what we see when we look at the real world. Objects
    that are close appear larger than objects that are far away, and in some'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'cases, lines that are parallel in 3D space are no longer parallel when drawn
    with perspective.


    Perspective was one of the great discoveries of the Renaissance era in the 1400–1500s,
    when artists started painting with more realism than did their predecessors.


    An excellent example can be seen in Figure 3.14, the *Annunciation, with St. Emidius*
    by Carlo Crivelli, painted in 1486 (currently held at the National Gallery in
    London [CR86]). The intense use of perspective is clear—the receding lines of
    the left-facing wall of the building on the right are slanted toward each other
    dramatically. This creates the illusion of depth and 3D space, and in the process
    lines that are parallel in reality are not parallel in the picture. Also, the
    people in the foreground are larger than the people in the background. While today
    we take these devices for granted, finding a transformation matrix to accomplish
    this requires some mathematical analysis.


    We achieve this effect by using a matrix transform that converts parallel lines
    into appropriate non-parallel lines. Such a matrix is called a *perspective matrix*
    or *perspective transform*, and is built by defining the four parameters of a
    *view volume*. Those parameters are (a) *aspect ratio*, (b) *field of view*, (c)
    *projection plane* or *near clipping plane*, and (d) *far clipping plane*.


    Only objects between the *near* and *far* clipping planes are rendered. The near
    clipping plane also serves as the plane on which objects are *projected*, and
    is generally positioned close to the eye or camera (shown on the left in Figure
    3.15). Selection of an appropriate value for the far clipping plane is discussed
    in Chapter 4. The *field of view* is the vertical angle of viewable space. The
    *aspect ratio* is the ratio width/height of the near and far clipping planes.
    The shape formed by these elements and shown in Figure 3.15 is called a *frustum*.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_74_0.png)


    **Figure 3.14**

    Crivelli''s *Annunciation, with Saint Emidius* (1486).'
  merge: -1
  img_proc: true
- pgno: 75
  md: "![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_75_0.png)\n\n**Figure 3.15**  \nPerspective\
    \ view volume or frustum.\n\nThe perspective matrix is used to transform points\
    \ in 3D space to their appropriate position on the near clipping plane, and is\
    \ built by first computing values q, A, B, and C, and then using those values\
    \ to construct the matrix, as shown in Figure 3.16 (and derived in [WB15]).\n\n\
    ```\nq = \\frac{1}{\\tan\\left(\\frac{FieldOfView}{2}\\right)}\n\nA = \\frac{q}{aspectRatio}\n\
    \nB = \\frac{Z_{near} + Z_{far}}{Z_{near} - Z_{far}}\n\nC = \\frac{2 * (Z_{near}\
    \ * Z_{far})}{Z_{near} - Z_{far}}\n\n\\begin{bmatrix}\nA & 0 & 0 & 0 \\\\\n0 &\
    \ q & 0 & 0 \\\\\n0 & 0 & B & C \\\\\n0 & 0 & -1 & 0\n\\end{bmatrix}\n```\n\n\
    **Figure 3.16**  \nBuilding a perspective matrix."
