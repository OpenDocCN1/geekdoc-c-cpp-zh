- pgno: 131
  md: 'Texture coordinates are most often 2D (OpenGL does support some other dimensionalities
    but we won’t cover them in this chapter). It is assumed that the image is rectangular,
    with location (0,0) at the lower left and (1,1) at the upper right.¹ Texture coordinates,
    then, should ideally have values in the range (0,1).


    Consider the example shown in Figure 5.2. The cube model, recall, is constructed
    of triangles. The four corners of one side of the cube are highlighted, but remember
    that it takes two triangles to specify each square side. The texture coordinates
    for each of the six vertices that specify this one cube side are listed alongside
    the four corners, with the corners at the upper left and lower right each comprising
    a pair of vertices. A texture image is also shown. The texture coordinates (indexed
    by s and t) have mapped portions of the image (the texels) onto the rasterized
    pixels of the front face of the model. Note that all of the intervening pixels
    in between the vertices have been painted with the intervening texels in the image.
    This is achieved because the texture coordinates are sent to the fragment shader
    in a *vertex attribute*, and thus are *also interpolated* just like the vertices
    themselves.


    In this example, we purposely specified texture coordinates that result in an
    oddly painted surface, for purposes of illustration. If you look closely, you
    can also see that the image appears slightly stretched—that is because the aspect
    ratio of the texture image doesn’t match the aspect ratio of the cube face relative
    to the given texture coordinates.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_131_0.png)


