  img_proc: true
- pgno: 189
  md: 'Keeping in mind that light and material intensities are specified via RGB values,
    the computation is more precisely


    $$

    I_{\text{ambient}}^{\text{red}} = Light_{\text{ambient}}^{\text{red}} * Material_{\text{ambient}}^{\text{red}}

    $$


    $$

    I_{\text{ambient}}^{\text{green}} = Light_{\text{ambient}}^{\text{green}} * Material_{\text{ambient}}^{\text{green}}

    $$


    $$

    I_{\text{ambient}}^{\text{blue}} = Light_{\text{ambient}}^{\text{blue}} * Material_{\text{ambient}}^{\text{blue}}

    $$


    Diffuse contribution is more complex because it depends on the angle of incidence
    between the light and the surface. Lambert’s Cosine Law (published in 1760) specifies
    that the amount of light that reflects from a surface is proportional to the cosine
    of the light’s angle of incidence. This can be modeled as follows:


    $$

    I_{\text{diffuse}} = Light_{\text{diffuse}} * Material_{\text{diffuse}} * \cos(\theta)

    $$


    As before, the actual computations involve red, green, and blue components.


    Determining the angle of incidence $\theta$ requires us to (a) find a vector from
    the pixel being drawn to the light source (or, similarly, a vector opposite the
    light direction) and (b) find a vector that is normal (perpendicular) to the surface
    of the object being rendered. Let’s denote these vectors $\vec{L}$ and $\vec{N}$,
    respectively, as shown in Figure 7.4.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_189_0.png)


    Depending on the nature of the lights in the scene, $\vec{L}$ could be computed
    by negating the light direction vector or by computing a vector from the location
    of the pixel to the location of the light source. Determining vector $\vec{N}$
    may be trickier—normal vectors may be available for the vertices in the model
    being rendered, but if the model doesn’t include normals, $\vec{N}$ would need
    to be estimated geometrically'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'based on the locations of neighboring vertices. For the rest of the chapter,
    we will assume that the model being rendered includes normal vectors for each
    vertex (this is common in models constructed with modeling tools such as Maya
    or Blender).


    It turns out that, in this case, it isn’t necessary to compute θ itself. What
    we really desire is cos(θ), and recall from Chapter 3 that this can be found using
    the *dot product*. Thus, the diffuse contribution can be computed as follows:


    $I_{diffuse} = Light_{diffuse} * Material_{diffuse} * (\hat{N} \cdot \hat{L})$


    The diffuse contribution is only relevant when the surface is exposed to the light,
    which occurs when -90 ≤ θ ≤ 90—that is, when cos(θ) ≥ 0. Thus we must replace
    the rightmost term above with


    $\max((\hat{N} \cdot \hat{L}), 0)$


    *Specular* contribution determines whether the pixel being rendered should be
    brightened because it is part of a “specular highlight.” It involves not only
    the angle of incidence of the light source but also the angle between the reflection
    of the light on the surface and the viewing angle of the “eye” relative to the
    object’s surface.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_190_0.png)


    In Figure 7.5, $\vec{R}$ represents the direction of reflection of the light,
    and $\vec{V}$ (called the *view vector*) is a vector from the pixel to the eye.
    Note that $\vec{V}$ is the negative of the vector from the eye to the pixel (in
    world space, the negative of the translation component of the view vector minus
    the pixel location). The smaller the angle φ between $\vec{R}$ and $\vec{V}$,
    the more the eye is on-axis, or “looking into” the reflection, and the more this
    pixel contributes to the specular highlight (and thus the brighter it should appear).'
  merge: -1
  img_proc: true
- pgno: 191
  md: "The manner in which φ is used to compute the specular contribution depends\
    \ on the desired “shininess” of the object being rendered. Objects that are extremely\
    \ shiny, such as a mirror, have very small specular highlights—that is, they reflect\
    \ the incoming light to the eye exactly. Materials that are less shiny have specular\
    \ highlights that are more “spread out,” and thus more pixels are a part of the\
    \ highlight.\n\nShininess is generally modeled with a *falloff* function that\
    \ expresses how quickly the specular contribution reduces to zero as the angle\
    \ φ grows. We can use *cos(φ)* to model falloff, and increase or decrease the\
    \ shininess by using powers of the cosine function, such as cos(φ), cos²(φ), cos³(φ),\
    \ cos¹⁰(φ), cos⁵⁰(φ), and so on, as illustrated in Figure 7.6.\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_191_0.png)\n\
    \n**Figure 7.6**  \nShiniess modeled as cosine exponent.\n\nNote that the higher\
    \ the value of the exponent, the faster the falloff, and thus the smaller the\
    \ specular contribution of pixels with light reflections that are off-axis from\
    \ the viewing angle.\n\nWe call the exponent *n*, as used in the *cosⁿ(φ)* falloff\
    \ function, the *shininess factor* for a specified material. Note back in Figure\
    \ 7.3 that shininess factors for each of the materials listed are specified in\
    \ the rightmost column.\n\nWe can now specify the full specular calculation:\n\
    \n$I_{specular} = Light_{specular} * Material_{specular} * \\max(0, (\\hat{R}\
    \ \\cdot \\hat{V})^n)$\n\nNote that we use the max() function in a similar manner\
    \ as we did for the diffuse computation. In this case, we need to ensure that\
    \ the specular contribution does not ever utilize negative values for cos(φ),\
    \ which could produce strange artifacts such as “darkened” specular highlights.\n\
    \nAnd of course as before, the actual computations involve red, green, and blue\
    \ components.\n\n# ## 7.5 IMPLEMENTING ADS LIGHTING\n\nThe computations described\
    \ in Section 7.4 have so far been mostly theoretical, as they have assumed that\
    \ we can perform them for every pixel. This is"
  merge: -1
  img_proc: true
- pgno: 192
  md: 'complicated by the fact that normal ($\vec{N}$) vectors are typically available
    to us only for the vertices that define the models, not for each pixel. Thus we
    need to either compute normals for each pixel, which could be time-consuming,
    or find some way of estimating the values that we need to achieve a sufficient
    effect.


    One approach is called “faceted shading” or “flat shading.” Here we assume that
    every pixel in each rendered primitive (i.e., polygon or triangle) has the same
    lighting value. Thus we need only do the lighting computations for one vertex
    in each polygon in the model, and then copy those lighting values across the nearby
    rendered pixels on a per-polygon or per-triangle basis.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_192_0.png)


    **Figure 7.7**

    Torus with faceted shading.


    Faceted shading is rarely used today, because the resulting images tend to not
    look very realistic and because modern hardware makes more accurate computations
    feasible. An example of a faceted-shaded torus, in which each triangle behaves
    as a flat reflective surface, is shown in Figure 7.7.


    Although faceted shading can be adequate in some circumstances (or used as a deliberate
    effect), usually a better approach is “smooth shading,” in which the lighting
    intensity is computed for each pixel. Smooth shading is feasible because of the
    parallel processing done on modern graphics cards and because of the interpolated
    rendering that takes place in the OpenGL graphics pipeline.


    We will examine two popular methods for smooth shading: *Gouraud shading* and
    *Phong shading*.


    # 7.5.1 Gouraud Shading


    The French computer scientist Henri Gouraud published a smooth shading algorithm
    in 1971 that has come to be known as *Gouraud shading* [GO71]. It is particularly
    well suited to modern graphics cards, because it takes advantage of the automatic
    interpolated rendering that is available in 3D graphics pipelines such as in OpenGL.
    The process for Gouraud shading is as follows:


    +   1. Determine the color of each *vertex*, incorporating the lighting computations.'
