- pgno: 387
  md: 'Finally, in part three, we complete Program 15.3 by incorporating the reflection
    and refraction textures (that were built in part two) into the top surface of
    the water. However, we have a slight problem...


    When we rendered the reflection and refraction textures, we did so in the standard
    manner with 3D perspective, as though they were going to be displayed to a viewer.
    For example, the checkerboard pattern is rendered in a horizontal plane, making
    squares nearer the camera larger and those in the distance smaller. But we are
    used to applying texture images that are “flat” 2D images (i.e., that don’t have
    perspective). So we can’t use these reflection and refraction textures in the
    standard manner using the texture coordinates for the top surface.


    Fortunately, correcting for this is surprisingly easy. Consider the case of the
    camera above the water’s surface. Figure 15.4 shows the scene rendered into the
    refraction buffer (on the left), which contains only the objects below the water’s
    surface (and which is black everywhere else), the reflection buffer (on the right)
    which contains only the objects above the water’s surface (and black everywhere
    else), and the original scene from Figure 15.2 (repeated in the center of Figure
    15.4), which contains the untextured top surface on which we wish to assemble
    the final rendered scene.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_387_0.png)


    **Figure 15.4** Refraction and reflection buffers (left / right) and render scene
    (center).


    Figure 15.4 illustrates that the textures in the reflection and refraction buffers
    are already in the desired screen position. Therefore, all we need to do is use
    the *screen coordinates of the object being textured* (in this case, the top water
    surface), as the coordinates which are used to access the textures in the reflection
    and refraction buffers. The screen coordinates have already been computed in'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'the vertex shader and are found in the (x,y) portion of the variable gl_Position.
    We merely need to pass a copy of gl_Position from the vertex shader to the fragment
    shader (as a varying vertex attribute) and use the xy portion of that as the texture
    coordinates.


    This technique is a simple case of *projective texture mapping* [E01], which can
    be used in cases where some portion of the scene appears on an object. A common
    example is building a mirror (which, in a sense, we are doing here in the case
    of the reflection buffer). It is called “projective” because it is similar to
    projecting a scene onto an object like a projection screen.


    We are now ready to complete Program 15.3. In part three, the reflection and refraction
    textures are incorporated onto the water’s top surface. To do this, the Java/JOGL
    application needs to make the reflection and refraction buffers available to the
    shaders for rendering the top surface. The fragment shader for the top surface
    of the water is where the reflection and refraction textures are applied. The
    vertex shader copies gl_Position into the new vertex attribute named glp and passes
    it to the fragment shader, which then uses it as texture coordinates for applying
    the reflection and refraction textures. Note that the coordinates are converted
    from the range of screen coordinates to the appropriate [0..1] range for texture
    coordinates. Notice also that in the case of reflection, the Y texture coordinate
    is subtracted from 1, because in this case, the reflection off the surface of
    the water needs to be flipped vertically.


    Part three also includes the code that handles the case of the main camera being
    positioned *below* the surface of the water (i.e., the scene being viewed underwater),
    and we can now discuss that case. It turns out to only require a few minor additions
    and modifications:


    +   * If the camera is below the water surface, we can ignore the reflection.

    +   * When the camera is below the surface looking up through the top surface,
    the refraction buffer (and texture) should include the skybox (as well as objects
    such as birds and airplanes).

    +   * Code is added to the prepForTopSurfaceRender() and prepForFloorRender()
    functions that informs the shaders whether the camera is above or below the surface.
    This is necessary because the fragment shader needs to know whether to include
    the reflection texture in the top surface.


    Thus, in part three, we only compute the reflection if the camera is above the
    water’s surface.'
