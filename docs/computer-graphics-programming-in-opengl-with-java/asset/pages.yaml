  md: '# ### 3.7.2 Generating Soft Shadows—Percentage Closer Filtering (PCF)


    There are various ways of simulating the penumbra effect to generate soft shadows
    in software. One of the simplest and most common is called *percentage closer
    filtering* (PCF). In PCF (proposed in 1987 by Reeves et al. [RS87]), we sample
    the shadow texture at several surrounding locations to estimate what percentage
    of nearby locations are in shadow. Depending on how many of the nearby locations
    are in shadow, we increase or decrease the degree of lighting contribution for
    the pixel being rendered. The entire computation can be done in the fragment shader,
    and that is the only place where we have to change any of the code. PCF also can
    be used to reduce jagged line artifacts.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_232_0.png)


    **Figure 8.18**

    Hard shadow rendering.


    Before we study the actual PCF algorithm, let''s first look at a simple similar
    motivating example to illustrate the goal of PCF. Consider the set of output fragments
    (pixels) shown in Figure 8.18, whose colors are being computed by the fragment
    shader.


    Suppose that the darkened pixels are in shadow, as computed using shadow mapping.
    Instead of simply rendering the pixels as shown (i.e., with or without the diffuse
    and specular components included), suppose that we had access to neighboring pixel
    information, so that we could see how many of the neighboring pixels are in shadow.
    For example, consider the particular pixel highlighted in yellow in Figure 8.19,
    which according to Figure 8.18 is not in shadow.


    In the nine-pixel neighborhood of the highlighted pixel, three of the pixels are
    in shadow and six are not. Thus, the color of the rendered pixel could be


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_232_1.png)


    **Figure 8.19**

    PCF sampling for a particular pixel.'
