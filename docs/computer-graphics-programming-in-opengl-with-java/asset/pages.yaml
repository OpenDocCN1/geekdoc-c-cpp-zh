    ```


    This causes the secondary ray to start at a very small distance away, in the direction
    of the surface normal at the collision point, from the object that was just collided.
    The purpose of this adjustment is to avoid an artifact very similar to shadow
    acne (which we saw in Chapter 8). If we were to actually start the reflection
    ray exactly at c.p, then when the reflection ray is built, rounding errors will
    sometimes cause it to immediately collide again with the same object (at nearly
    the exact same point). Figure 16.13 shows the same scene as previously shown in
    Figure 16.12, except without the correction. Surface acne is now evident on the
    reflective box object.


