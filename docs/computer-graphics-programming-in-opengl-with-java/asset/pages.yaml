- pgno: 174
  md: 'The ModelImporter class includes a parseOBJ() function that reads in each line
    of an OBJ file one-by-one, handling separately the four cases v, vt, vn, and f.
    In each case, the subsequent numbers on the line are extracted, first by using
    substring() to skip the initial v, vt, vn, or f character(s) and then using the
    iterator returned by the split() function to extract each subsequent parameter
    value, storing them in an ArrayList. As the face (f) entries are processed, the
    vertices are built, with corresponding entries in parallel arrays for vertex positions,
    texture coordinates, and normal vectors.


    The ModelImporter class is embedded in the ImportedModel class, which simplifies
    loading and accessing the vertices of an OBJ file by putting the imported vertices
    into arrays of Vector3f and Vector2f objects. Recall these are JOML classes; we
    use them here to store vertex positions, texture coordinates, and normal vectors.
    The accessors in the ImportedModel class then make them available to the Java/JOGL
    application in much the same manner as was done in the Sphere and Torus classes.


    Following the ModelImporter and ImportedModel classes is an example sequence of
    calls for loading an OBJ file and then transferring the vertex information into
    a set of VBOs for subsequent rendering.


    Figure 6.16 shows a rendered model of the space shuttle, downloaded as an OBJ
    file from the NASA website [NA21], imported using the code from Program 6.3 and
    textured using the code from Program 5.1 with the associated NASA texture image
    file, with anisotropic filtering. This texture image is an example of the use
    of *UV-mapping*, where texture coordinates in the model are carefully mapped to
    particular regions of the texture image. (As mentioned in *Chapter 5*, the details
    of *UV-mapping* are outside the scope of this book.)


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_174_0.png)


    **Figure 6.16**

    NASA space shuttle model with texture.'
