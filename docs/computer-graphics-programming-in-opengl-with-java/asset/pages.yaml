- pgno: 109
  md: 'Matrix4fStack is designed as a subclass of Matrix4f, and thus inherits all
    of the functions defined in Matrix4f. If one of those functions is called on a
    Matrix4fStack, it is applied to the matrix at the top of the stack (in fact, the
    functions get(), rotate(), scale(), and translate() listed above are examples
    of this mechanism, as are many of the other JOML matrix functions, such as matrix
    concatenation).


    Now, rather than building transforms by creating instances of Matrix4f, we instead
    use the pushMatrix() command to create new matrices at the top of the stack. Desired
    transforms are then applied as needed to the newly created matrix on the top of
    the stack.


    The first matrix pushed on the stack is frequently the VIEW matrix. The matrices
    above it are model-view matrices of increasing complexity; that is, they have
    an increasing number of model transforms applied to them. These transforms can
    either be applied directly or by first concatenating other matrices.


    In our planetary system example, the matrix positioned immediately above the VIEW
    matrix would be the sun’s MV matrix. The matrix on top of that matrix would be
    the earth’s MV matrix, *which consists of a copy of the sun’s MV matrix with the
    earth’s model matrix transforms applied to it.* That is, the earth’s MV matrix
    is built by incorporating the planet’s transforms into the sun’s transforms. Similarly,
    the moon’s MV matrix sits on top of the planet’s MV matrix and is constructed
    by applying the moon’s model matrix transforms to the planet’s MV matrix immediately
    below it.


    After rendering the moon, a second “moon” could be rendered by “popping” the first
    moon’s matrix off of the stack (restoring the top of the stack to the planet’s
    model-view matrix) and then repeating the process for the second moon.


    The basic approach is as follows:


    +   1. When a new object is introduced relative to a parent object, do a “push-Matrix()”
    call.

    +   2. Apply the new object’s transforms; i.e., multiply a transform to the matrix
    at the top of the stack.

    +   3. When an object or subobject has finished being drawn, call “popMatrix()”
    to remove its model-view matrix from atop the matrix stack.


    In later chapters we will learn how to create spheres and make them look like
    planets and moons. For now, to keep things simple, we will build a “planetary
    system” using our pyramid and a couple of cubes.'
