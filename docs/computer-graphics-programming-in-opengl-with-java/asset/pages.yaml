  md: "# *Program 12.3 Simple Tessellated Terrain*\n\n# *Vertex Shader*\n\n```\n```glsl\n\
    #version 430\nuniform mat4 mvp;\nlayout (binding = 0) uniform sampler2D tex_color;\n\
    void main(void) { }\n```\n```\n\n# *Tessellation Control Shader*\n\n```\n```glsl\n\
    ...\nlayout (vertices = 1) out;    // no control points are necessary for this\
    \ application\n\nvoid main(void)\n{ int TL=32;\n  if (gl_InvocationID == 0)\n\
    \  { gl_TessLevelOuter[0] = TL; gl_TessLevelOuter[2] = TL;\n    gl_TessLevelOuter[1]\
    \ = TL; gl_TessLevelOuter[3] = TL;\n    gl_TessLevelInner[0] = TL; gl_TessLevelInner[1]\
    \ = TL;\n  }\n}\n```\n```\n\n# *Tessellation Evaluation Shader*\n\n```\n```glsl\n\
    ...\nout vec2 tes_out;\nuniform mat4 mvp;\nlayout (binding = 0) uniform sampler2D\
    \ tex_color;\nvoid main (void)\n{ // map the tessellated grid vertices from [0..1]\
    \ onto the desired vertices [-0.5,+0.5]\n  vec4 tessellatedPoint = vec4(gl_TessCoord.x\
    \ - 0.5, 0.0, gl_TessCoord.y - 0.5, 1.0);\n\n  // map the tessellated grid vertices\
    \ as texture coordinates by \"flipping\" the Y values vertically.\n  // Vertex\
    \ coordinates have (0,0) at upper left, texture coordinates have (0,0) at the\
    \ lower left.\n  vec2 tc = vec2(gl_TessCoord.x, 1.0 - gl_TessCoord.y);\n\n  //\
    \ The image is grayscale, so either component (R, G, or B) can serve as height\
    \ offset.\n  tessellatedPoint.y += (texture(tex_color, tc).r) / 40.0;    // Scale\
    \ down color values.\n\n  // convert the height-map raised point to eye space\n\
    \  gl_Position = mvp * tessellatedPoint;\n  tes_out = tc;\n}\n```\n```"
