  md: 'Then the JOGL application can refer to the two samplers by their binding values.


    When a scene utilizes multiple lights, multiple shadow textures are necessary—one
    for each light source. And a *pass one* will need to be performed for each one,
    with the results blended in pass two.


    Although we have used perspective projection at each phase of shadow mapping,
    it is worth noting that *orthographic* projection is often preferred when the
    light source is distant and directional, rather than the positional light we utilized.


    Generating realistic shadows is a rich and complex area of computer graphics,
    and many of the available techniques are outside the scope of this text. Readers
    interested in more detail are encouraged to investigate more specialized resources
    such as [ES12], [GP10], and [MI18].


    The second fragment shader of Program 8.2 contains an example of a GLSL *function*,
    `lookup()`. As in the C language, functions must be defined before (or “above”)
    where they are called, or else a forward declaration must be provided. In the
    example, a forward declaration isn’t required because the function has been defined
    above the call to it.


