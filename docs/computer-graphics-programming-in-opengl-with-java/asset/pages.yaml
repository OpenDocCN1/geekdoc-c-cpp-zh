    \ 5.8 MIPMAPPING\n\nTexture mapping commonly produces a variety of undesirable\
    \ artifacts in the rendered image. This is because the resolution or aspect ratio\
    \ of the texture image rarely matches that of the region in the scene being textured.\n\
    \nA very common artifact occurs when the image resolution is *less than* that\
    \ of the region being drawn. In this case, the image would need to be stretched\
    \ to cover the region, becoming blurry (and possibly distorted). This can sometimes\
    \ be combated, depending on the nature of the texture, by assigning the texture\
    \ coordinates differently so that applying the texture requires less stretching.\
    \ Another solution is to use a higher resolution texture image.\n\nThe reverse\
    \ situation is when the resolution of the image texture is *greater than* that\
    \ of the region being drawn. It is probably not at all obvious why this would\
    \ pose a problem, but it does! In this case, noticeable *aliasing* artifacts can\
    \ occur, giving rise to strange-looking false patterns, or “shimmering” effects\
    \ in moving objects.\n\nAliasing is caused by *sampling errors*. It is most often\
    \ associated with signal processing, where an inadequately sampled signal appears\
    \ to have different"
