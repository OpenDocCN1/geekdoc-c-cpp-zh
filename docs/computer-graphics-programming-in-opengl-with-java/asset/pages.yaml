    \ *sampler objects* (sometimes called “*sampler states*”—not to be confused with\
    \ sampler variables) that can be used to hold a set of texture settings independent\
    \ of the actual texture object. Sampler objects are attached to texture units\
    \ and allow for conveniently and efficiently changing texture settings. The examples\
