  md: "![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_352_0.png)\n\n**Figure 14.13**  \n\
    “Blocky” 3D noise maps with various “zooming-in” factors.\n\nthe result of zooming\
    \ in by dividing the indices by zoom factors 8, 16, and 32 (left to right, respectively).\n\
    \n```\nprivate void fillDataArray(byte data[ ])\n{\n    int zoom = 8;        //\
    \ zoom factor\n    for (int i=0; i<noiseWidth; i++)\n    {\n        for (int j=0;\
    \ j<noiseHeight; j++)\n        {\n            for (int k=0; k<noiseDepth; k++)\n\
    \            {\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+0]\
    \ =\n                    (byte)(noise[i/zoom][j/zoom][k/zoom] * 255);\n      \
    \          data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+1] =\n    \
    \                (byte)(noise[i/zoom][j/zoom][k/zoom] * 255);\n              \
    \  data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+2] =\n            \
    \        (byte)(noise[i/zoom][j/zoom][k/zoom] * 255);\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+3]\
    \ = (byte) 255;\n            }\n        }\n    }\n}\n```\n\nThe “blockiness” within\
    \ a given noise map can be *smoothed* by interpolating from each discrete grayscale\
    \ color value to the next one. That is, for each small “block” within a given\
    \ 3D texture, we set each texel color within the block by interpolating from its\
    \ color to its neighboring blocks’ colors. The interpolation code is shown below\
    \ in the function smoothNoise(), along with the modified fillDataArray() function.\
    \ The resulting “smoothed” textures (for zooming factors 2, 4, 8, 16, 32, and\
    \ 64—left to right, top to bottom) then follow in Figure 14.14. Note that the\
    \ zoom factor is now a double, because we need the fractional component to determine\
    \ the interpolated grayscale values for each texel."
