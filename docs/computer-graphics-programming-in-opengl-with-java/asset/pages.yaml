  md: '# Chapter 15

    # Simulating Water


    +   15.1 Pool Surface and Floor Geometry Setup — 355

    +   15.2 Adding Surface Reflection and Refraction — 360

    +   15.3 Adding Surface Waves — 371

    +   15.4 Additional Corrections — 374

    +   15.5 Animating the Water Movement — 379

    +   15.6 Underwater Caustics — 381

    +   Supplemental Notes — 383


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_375_0.png)


    Simulating water is a complex topic, because water is found in so many different
    settings and takes so many different forms. The technique used depends on the
    application. The water could be coming out of a kitchen faucet, or out of a lawn
    sprinkler, or it could be flowing in a river, or in large dark blue ocean waves,
    or swirling around in a drinking glass. There are too many possibilities to cover
    all of them here, so in this chapter, we focus on one common scenario: a swimming
    pool. Our setup will enable viewing the water downwards from above the surface,
    or upwards from below the surface, and we will tilt the camera accordingly. With
    minor modifications, it could be modified to instead simulate a lake surface (or
    an ocean with small waves).


    # 15.1 Pool Surface and Floor Geometry Setup


    We start by setting up a very simple scene that includes a flat (horizontal) plane
    segment and a skybox. The plane is made of two triangles comprising a rectangle,
    and is textured with a checkerboard procedural texture function similar to (but
    simpler than) the 3D checkerboard texture described in Chapter 14. (Later, in
    Program 15.2, we will change the appearance of this plane to instead look like
    water, and we will move the checkerboard pattern to a second plane at the bottom
    of the swimming pool. The checkerboard pattern will be used to simulate tiles
    – if we were instead modeling a lake, then we would of course use a different
    texture for the bottom.)'
