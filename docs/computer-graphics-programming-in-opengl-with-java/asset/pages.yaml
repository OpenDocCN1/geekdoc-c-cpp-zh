  md: "The *tessellation* stage of the OpenGL pipeline offers an attractive alternative\
    \ approach for rendering Bézier surfaces based on the iterative algorithm in Figure\
    \ 11.5 for Bézier curves. The strategy is to have the tessellator generate a large\
    \ grid of vertices, and then use the blending functions to reposition those vertices\
    \ onto the Bézier surface as specified by the cubic Bézier control points. We\
    \ implement this in Chapter 12.\n\n# SUPPLEMENTAL NOTES\n\nThis chapter focused\
    \ on the mathematical fundamentals of parametric Bézier curves and surfaces. We\
    \ have deferred presenting an implementation of any of them in OpenGL, because\
    \ an appropriate vehicle for this is the tessellation stage, covered in the next\
    \ chapter. We also skipped some of the derivations, such as for the recursive\
    \ subdivision algorithm.\n\nIn 3D graphics, there are many advantages to using\
    \ Bézier curves for modeling objects. First, those objects can, in theory, be\
    \ scaled arbitrarily and still retain smooth surfaces without “pixelating.” Second,\
    \ many objects made up of complex curves can be stored much more efficiently as\
    \ sets of Bézier control points rather than storing thousands of vertices.\n\n\
    Bézier curves have many real-world applications besides computer graphics and\
    \ automobiles. They can also be found in the design of bridges, such as in the\
    \ Chords Bridge in Jerusalem [RG12]. Similar techniques are used for building\
    \ TrueType fonts, which as a result can be scaled to any arbitrary size, or zoomed\
    \ in to any degree of closeness, while always retaining smooth edges.\n\n# Exercises\n\
