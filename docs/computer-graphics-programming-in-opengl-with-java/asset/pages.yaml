  md: 'It might seem redundant to include an ambient contribution for a light when
    we already have global ambient light. The separation of the two, however, is intentional
    and noticeable when the light is “on” or “off” When “On,” the total ambient contribution
    would be increased, as expected. In the above example, we have included only a
    small ambient contribution for the light. It is important to balance the two contributions,
    depending on the needs of your scene.


    A *positional* light has a specific location in the 3D scene. Light sources that
    are near the scene, such as lamps, candles, and so forth, are examples. Like directional
    lights, the effect of a positional light depends on angle of impact; however,
    its direction is not specified, as it is different for each vertex in our scene.
    Positional lights may also incorporate *attenuation factors*, in order to model
    how their intensity diminishes with distance. As with the other types of lights
    we have seen, positional lights have ambient, diffuse, and specular properties
    specified as RGBA values. A red positional light at location (5,2,-3) could for
    example be specified as follows:


    ```

    ```

    float[] posLightAmbient = new float[] { 0.1f, 0.0f, 0.0f, 1.0f };

    float[] posLightDiffuse = new float[] { 1.0f, 0.0f, 0.0f, 1.0f };

    float[] posLightSpecular = new float[] { 1.0f, 0.0f, 0.0f, 1.0f };

    float[] posLightLocation = new float[] { 5.0f, 2.0f, -3.0f };

    ```

    ```


    Attenuation factors can be modeled in a variety of ways. One way is to include
    tunable non-negative parameters for *constant*, *linear*, and *quadratic* attenuation
    (k_c, k_l, and k_q, respectively). These parameters are then combined, taking
    into account the distance (*d*) from the light source:


    $$\text{attenuationFactor} = \frac{1}{k_c + k_l d + k_q d^2}$$


    Multiplying this factor by the light intensity causes the intensity to be decreased
    the greater the distance is to the light source. Note that k_c should always be
    set greater than or equal to 1.0, and at least one of the other parameters greater
    than 0.0, so that the attenuation factor will always be in the range [0..1] and
    approach 0 as the distance *d* increases.


    *Spotlights* have both a position and a direction. The effect of the spotlight’s
    “cone” can be simulated using a *cutoff angle* between 0° and 90°, specifying
    the half-width of the light beam, and a *falloff exponent* to model the variation
    of intensity across the angle of the beam. As shown in Figure 7.2, we determine
    the angle'
