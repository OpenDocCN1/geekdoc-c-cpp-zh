- pgno: 213
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_213_0.png)


    # ### 8.3.1 SHADOW VOLUMES


    Another important method, proposed by Crow in 1977, is to identify the spatial
    volume shadowed by an object, and reduce the color intensity of polygons inside
    the intersection of the shadow volume with the view volume [CR77]. Figure 8.4
    shows a cube in a shadow volume, so the cube would be drawn darker.


    Shadow volumes have the advantage of being highly accurate, with fewer artifacts
    than other methods. However, finding the shadow volume, and then computing whether
    each polygon is inside of it, is computationally expensive even on modern GPU
    hardware. Geometry shaders can be used to generate shadow volumes, and the *stencil
    buffer*<sup>1</sup> can be used to determine whether a pixel is within the volume.
    Some graphics cards include hardware support for optimizing certain shadow volume
    operations.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_213_1.png)


    <sup>1</sup> The *stencil buffer* is a third buffer—along with the color buffer
    and the z-buffer—accessible through OpenGL. The stencil buffer is not described
    in this textbook.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# ## 8.4 SHADOW MAPPING


    One of the most practical and popular methods for casting shadows is called *shadow
    mapping*. Although it is not always as accurate as shadow volumes (and is often
    accompanied by pesky artifacts), shadow mapping is easier to implement, can be
    used in a wide variety of situations, and enjoys powerful hardware support.


    We would be remiss if we failed to clarify our use of the word *easier* in the
    previous paragraph. Although shadow mapping is simpler than shadow volumes (both
    conceptually and in practice), it is by no means “easy.” Students often find shadow
    mapping among the most difficult techniques to implement in a 3D graphics course.
    Shader programs are by nature difficult to debug, and shadow mapping requires
    the perfect coordination of several components and shader modules. *Be advised
    that successful implementation of shadow mapping will be greatly facilitated by
    liberal use of the debugging tools described earlier in Section 2.2.*


    Shadow mapping is based on a very simple and clever idea—namely, anything that
    cannot be seen by the *light* is in shadow. That is, if object #1 blocks the light
    from reaching object #2, it is the same as the light not being able to “see” object
    #2.


    The reason this idea is so powerful is that we already have a method for determining
    if something can be “seen”—the hidden surface removal algorithm (HSR) using the
    Z-buffer, as described in Section 2.1.7. So a strategy for finding shadows is
    to temporarily move the camera to the location of the light, apply the Z-buffer
    HSR algorithm, and then use the resulting depth information to find shadows.


    Rendering our scene will require two passes: one to render the scene from the
    point of view of the light (but not actually drawing it to the screen) and a second
    pass to render it from the point of view of the camera. The purpose of pass one
    is to generate a Z-buffer from the light’s point of view. After completing pass
    one, we need to retain the Z-buffer and use it to help us generate shadows in
    pass two. Pass two actually draws the scene.


    Our strategy is now becoming more refined:


    +   - *(Pass 1) Render the scene from the light’s position. The depth buffer then
    contains, for each pixel, the distance between the light and the nearest object
    to it.*

    +   - *Copy the depth buffer to a separate “shadow buffer.”*'
  merge: -1
  img_proc: true
- pgno: 215
  md: '+   * (Pass 2) Render the scene normally. For each pixel, look up the corresponding
    position in the shadow buffer. If the distance to the point being rendered is
    greater than the value retrieved from the shadow buffer, then the object being
    drawn at this pixel is further from the light than the object nearest the light,
    and therefore this pixel is in shadow.


    When a pixel is found to be in shadow, we need to make it darker. One simple and
    effective way of doing this is to render only its ambient lighting, ignoring its
    diffuse and specular components.


    The method described above is often called "shadow buffering." The term "shadow
    mapping" arises when, in the second step, we instead copy the depth buffer into
    a *texture*. When a texture object is used in this way, we will refer to it as
    a *shadow texture*, and OpenGL has support for shadow textures in the form of
    a sampler2DShadow type (discussed below). This allows us to leverage the power
    of hardware support for texture units and sampler variables (i.e., "texture mapping")
    in the fragment shader to quickly perform the depth lookup in pass 2. Our strategy
    now is revised:


    +   * (Pass 1) as before.

    +   * Copy the depth buffer into a *texture*.

    +   * (Pass 2) as before, except that the shadow buffer is now a *shadow texture*.


    Let''s now implement these steps.


    # 8.8.1 Shadow Mapping (Pass One)—"Draw" Objects from Light Position


    In step one, we first move our camera to the light''s position, and then render
    the scene. Our goal here is *not* to actually draw the scene on the display, but
    to complete just enough of the rendering process that the depth buffer is properly
    filled. Thus it will not be necessary to generate colors for the pixels, and so
    our first pass will utilize a vertex shader, but the fragment shader does nothing.


    Of course, moving the camera involves constructing an appropriate *view matrix*.
    Depending on the contents of the scene, we will need to decide on an appropriate
    *direction* to view the scene from the light. Typically, we would want this direction
    to be toward the region that would ultimately be rendered in'
