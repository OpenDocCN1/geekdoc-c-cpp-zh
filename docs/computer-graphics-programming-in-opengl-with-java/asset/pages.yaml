    # ### 9.3.2 Using OpenGL Cube Maps


    Another way to build a skybox is to use an OpenGL *texture cube map*. OpenGL cube
    maps are a bit more complex than the simple approach we saw in the previous section.
    There are advantages, however, to using OpenGL cube maps, such as seam reduction
    and support for environment mapping.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_249_1.png)


    **Figure 9.8**

    Skybox “seam” artifact.'
