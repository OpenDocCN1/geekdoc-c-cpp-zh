- pgno: 231
  md: 'are *soft shadows*. That is, their edges are blurred to various degrees. In
    this section, we will explore the appearance of soft shadows as they occur in
    the real world, and then describe a commonly used algorithm for simulating them
    in OpenGL.


    # ### 3.7.1 Soft Shadows in the Real World


    There are many causes of soft shadows, and there are many types of soft shadows.
    One thing that commonly causes soft shadows in nature is that real-world light
    sources are rarely points—more often they occupy some area. Another cause is the
    accumulation of imperfections in materials and surfaces, and the role that the
    objects themselves play in generating ambient light through their own reflective
    properties.


    Figure 8.16 shows a photograph of an object casting a soft shadow on a table top.
    Note that this is *not* a 3D computer rendering, but an actual photograph of an
    object, taken in the home of one of the authors.


    There are two aspects to note about the shadow in Figure 8.16:


    +   * The shadow is “softer” the further it is from the object and “harder” the
    closer it is to the object. This is apparent when comparing the shadow near the
    legs of the object versus the wider portion of the shadow at the right region
    of the image.

    +   * The shadow appears slightly darker the closer it is to the object.


    The dimensionality of the light source itself can lead to soft shadows. As shown
    in Figure 8.17, the various regions across the light source cast slightly different
    shadows. The lighter areas at the edges of the shadow — where only a portion of
    the light is blocked by the object — are collectively called the *penumbra*.


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_231_0.png)


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_231_1.png)'
