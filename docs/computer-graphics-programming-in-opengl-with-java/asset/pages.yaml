    \        * pow(max(dot(H,N),0.0),material.shininess*3.0);\n    }\n}\n```\n```\n\
    \n**Figure 8.7**  \nShadow mapping pass 2 fragment shader.\n\nfragment shader\
    \ as follows. The z component represents the distance from the light to the pixel.\
    \ The (x,y) components are used to retrieve the depth information stored in the\
    \ (2D) shadow texture. This retrieved value (the distance to the object nearest\
    \ the light) is compared with Z. This comparison produces a “binary” result that\
    \ tells us whether the pixel we are rendering is further from the light than the\
    \ object nearest the light (i.e., whether the pixel is in shadow).\n\nIf in OpenGL\
    \ we use glFramebufferTexture() as described earlier and we enable *depth testing*,\
    \ then using a `sampler2DShadow` and `textureProj()` as shown in the fragment\
    \ shader (Figure 8.7) will do exactly what we need. That is, `textureProj()` will\
    \ output either 0.0 or 1.0 depending on the depth comparison. Based on this value,\
    \ we can then in the fragment shader omit the diffuse and specular contributions\
    \ when the pixel is further from the light than the object nearest the light,\
    \ effectively creating the shadow when appropriate. An overview is shown in Figure\
    \ 8.8.\n\nWe are now ready to build our JOGL application to work with the previously\
