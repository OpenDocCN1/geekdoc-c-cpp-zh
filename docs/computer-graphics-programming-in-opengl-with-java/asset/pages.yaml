- pgno: 508
  md: 'what version of OpenGL your machine supports, you can use one of the various
    free applications (such as GLView [GV21]) to find out.


    # A.1.3 Installing JOGL


    To install JOGL, visit the JogAmp Website [JO16], *http://jogamp.org*. There,
    as of this writing (April 2021), the current version 2.4 of JOGL is found in the
    Builds/Downloads section—look under Archives and click on [releases]. The archive
    of JOGL versions are then displayed in a folder named /deployment/archive/rc.
    Scroll down and open version 2.4. Then open the folder named Archive and download
    the following:


    +   jogamp-all-platforms.7z

    +   jogl-javadoc.7z


    Unzip these files into the folder on your machine where you would like to store
    the JOGL system. A typical location in Windows could be, for example, in a folder
    named “JOGL” at the root of the C: drive.


    The unzipped jogamp-all-platforms file contains a folder named jar which contains
    two important files that will be used by your applications:


    +   jogl-all.jar

    +   gluegen-rt.jar


    Add the full path name of each of these two files to your CLASSPATH environment
    variable.


    After you have copied the above files onto your machine, go into the jogl-javadoc
    folder and double-click the file named index.html. This opens the JOGL javadocs
    in a browser, which you should then bookmark for future reference.


    # A.1.4 Installing JOML


    To install JOML, visit the JOML GitHub page and click on “Releases,” or navigate
    directly to the Releases page [JR21]. You will probably want to download the latest
    version (1.10.0 at the time of this writing), specifically the .jar file named
    joml-1.10.0.jar (found under “assets”). This file is also available on the companion
    DVD distributed with this book.'
