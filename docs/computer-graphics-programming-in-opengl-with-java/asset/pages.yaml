    \ effect can dramatically enhance realism when the camera is above the top surface,\
    \ and can be implemented in the fragment shader by computing the angle between\
    \ the water’s surface normal and the view direction, and then mixing the reflection\
    \ and refraction components based on the magnitude of the angle. We experimented\
    \ with various offsets and scaling factors and found that, for this scene, shifting\
    \ the Fresnel factor to smaller values (to increase the refractive contribution),\
    \ clamping the range to [0..1] (for subsequent use in the mix() function) and\
    \ raising it to a power of 3 (making the effect nonlinear and sharpening the transition\
    \ between refractive and reflective dominance) produced a pleasing result. Other\
    \ scenes may require different adjustments We also observed that the effect is\
    \ clearest if the original surface normal is used, i.e., without the normals having\
