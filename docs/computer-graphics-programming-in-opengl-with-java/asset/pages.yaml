- pgno: 255
  md: '![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_255_0.png)


    We computed reflection vectors earlier when we studied Blinn-Phong lighting. The
    concept here is similar, except that now we are using the reflection vector to
    look up a value from a texture map. This technique is called *environment mapping*,
    or *reflection mapping*. If the cube map is implemented using the second method
    we described (in Section 9.3.2—that is, as an OpenGL `GL_TEXTURE_CUBE_MAP`), then
    OpenGL can perform the environment mapping lookup in the same manner as was done
