- pgno: 42
  md: "Program 2.3 contains the following three utilities:\n\n+   - **checkOpenGLError**—checks\
    \ the OpenGL error flag for the occurrence of an OpenGL error\n+   - **printShaderLog**—displays\
    \ the contents of OpenGL's log when GLSL compilation has failed\n+   - **printProgramLog**—displays\
    \ the contents of OpenGL's log when GLSL linking has failed\n\nThe first, checkOpenGLError(),\
    \ is useful for detecting both GLSL compilation errors and OpenGL runtime errors,\
    \ so it is highly recommended for use throughout a Java/JOGL application during\
    \ development. For example, in the prior example (Program 2.2), the calls to glCompileShader()\
    \ and glLinkProgram() could easily be augmented with the code shown in Program\
    \ 2.3 to ensure that any typos or other compile errors would be caught and their\
    \ cause reported. Calls to checkOpenGLError() could be added after runtime OpenGL\
    \ calls, such as immediately after the call to glDrawArrays().\n\nAnother reason\
    \ that it is important to use these tools is that *a GLSL error does not cause\
    \ the JOGL program to stop.* So unless the programmer takes steps to catch errors\
    \ at the point that they happen, debugging will be very difficult.\n\n# *Program\
    \ 2.3 Modules to Catch GLSL Errors*\n\n```\n~~~java\n...\nimport com.jogamp.opengl.GL4;\n\
    ...\nprivate void printShaderLog(int shader)\n{\n   GL4 gl = (GL4) GLContext.getCurrentGL();\n\
    \   int[] len = new int[1];\n   int[] chWrittn = new int[1];\n   byte[] log =\
    \ null;\n   // determine the length of the shader compilation log\n   gl.glGetShaderiv(shader,\
    \ GL_INFO_LOG_LENGTH, len, 0);\n   if (len[0] > 0)\n   {\n      log = new byte[len[0]];\n\
    \      gl.glGetShaderInfoLog(shader, len[0], chWrittn, 0, log, 0);\n      System.out.println(\"\
    Shader Info Log: \");\n      for (int i = 0; i < log.length; i++)\n      {  System.out.print((char)\
    \ log[i]);\n      }\n   }\n}\n~~~\n```"
