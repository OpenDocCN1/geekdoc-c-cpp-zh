    # 4.9 COMBATING “Z-FIGHTING” ARTIFACTS


    Recall that when rendering multiple objects, OpenGL uses the *Z-buffer algorithm*
    (shown earlier in Figure 2.14) for performing hidden surface removal. Ordinarily,
    this resolves which object surfaces are visible and rendered to the screen versus
    which surfaces lie behind other objects and thus should not be rendered, by choosing
    a pixel’s color to be that of the corresponding fragment closest to the camera.


    However, there can be occasions when two object surfaces in a scene overlap and
    lie in coincident planes, making it problematic for the Z-buffer algorithm to
    determine which of the two surfaces should be rendered (since neither is “closest”
    to the camera). When this happens, floating point rounding errors can lead to
    some portions of the rendered surface using the color of one of the objects and
    other portions using the color of the other object. This artifact is known as
    *Z-fighting* or *depth-fighting*, because the effect is the result of rendered
    fragments “fighting” over mutually corresponding pixel entries in the Z-buffer.
    Figure 4.12 shows an example of Z-fighting between two boxes with overlapping
    coincident (top) faces.


    Situations like this often occur when creating terrain or shadows. It is often
    possible to predict Z-fighting in such instances, and a common way of correcting
    it in these cases is to move one object slightly, so that the surfaces are no
    longer coplanar. We will see an example of this in Chapter 8.


    Z-fighting can also occur due to limited precision of the values in the depth
    buffer. For each pixel processed by the Z-buffer algorithm, the accuracy of its
    depth information is limited by the number of bits available for storing


    ![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_114_0.png)'
