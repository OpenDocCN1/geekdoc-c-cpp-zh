    \ the result of applying them to a sphere in the presence of Blinn-Phong lighting.\n\
    \nNormal vectors retrieved from a normal map cannot be utilized directly, because\
    \ they are defined relative to an arbitrary *X-Y* plane as described above, without\
    \ taking into account their position on the object and their orientation in world\
    \ space. Our strategy for addressing this will be to build a transformation matrix\
    \ for converting the normals into world space, as follows.\n\nAt each vertex on\
    \ an object, we consider a plane that is tangent to the object. The object normal\
    \ at that vertex is perpendicular to this plane. We define two mutually perpendicular\
    \ vectors in that plane, also perpendicular to the normal, called the *tangent*\
    \ and *bitangent* (sometimes called the *binormal*). Constructing our desired\
    \ transformation matrix requires that our models include a tangent vector for\
    \ each vertex (the bitangent can be built by computing the cross product of the\
    \ tangent and the normal). If the model does not already have tangent vectors\
    \ defined, they could be computed. In the case of a sphere they can be computed\
    \ exactly, as shown in the following modifications to Program 6.1:\n\n```\n~~~\n\
    ...\nfor (int i=0; i<=prec; i++)\n{\n  for (int j=0; j<=prec; j++)\n  {\n    float\
    \ y = (float)cos(toRadians(180-i*180/prec));\n    float x = -(float)cos(toRadians(i*360/prec))\
    \ * (float)abs(cos(asin(y)));\n    float z = (float)sin(toRadians(i*360/prec))\
    \ * (float)abs(cos(asin(y)));\n    vertices[i*(prec+1)+j].set(x,y,z);\n  }\n}\n\
    ~~~\n```"
