    \ Control Shader\n\n```\n...\nvoid main(void)\n{\n    float subdivisions = 16.0;\
    \    // tunable constant based on density of detail in height map\n    if (gl_InvocationID\
    \ == 0)\n    {\n        vec4 p0 = mvp * gl_in[0].gl_Position;    // control pt.\
    \ positions in screen space\n        vec4 p1 = mvp * gl_in[1].gl_Position;\n \
    \       vec4 p2 = mvp * gl_in[2].gl_Position;\n        p0 = p0 / p0.w;\n     \
    \   p1 = p1 / p1.w;\n        p2 = p2 / p2.w;\n        float width = length(p2.xy\
    \ - p0.xy) * subdivisions + 1.0;    // perceived \"width\" of tess grid\n    \
    \    float height = length(p1.xy - p0.xy) * subdivisions + 1.0;   // perceived\
    \ \"height\" of tess grid\n        gl_TessLevelOuter[0] = height;    // set tess\
    \ levels based on perceived side lengths\n        gl_TessLevelOuter[1] = width;\n\
    \        gl_TessLevelOuter[2] = height;\n        gl_TessLevelOuter[3] = width;\n\
    \        gl_TessLevelInner[0] = width;\n        gl_TessLevelInner[1] = height;\n\
    \    }\n    // forward texture coordinates and control points to TES as before\n\
    \    tcs_out[gl_InvocationID] = tcs[gl_InvocationID];\n    gl_out[gl_InvocationID].gl_Position\
    \ = gl_in[gl_InvocationID].gl_Position;\n}\n```\n\nApplying these control shader\
