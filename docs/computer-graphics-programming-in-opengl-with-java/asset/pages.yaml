  md: "# 14.8 NOISE APPLICATION – *CLOUDS*\n\nThe “turbulence” noise map built earlier\
    \ in Figure 14.15 already looks a bit like clouds. Of course, it isn’t the right\
    \ color, so we start by changing it from grayscale to an appropriate mix of light\
    \ blue and white. A straightforward way of doing this is to assign a color with\
    \ a maximum value of 1.0 for the blue component and varying (but equal) values\
    \ between 0.0 and 1.0 for the red and green components, depending on the values\
    \ in the noise map. The new fillDataArray() function follows:\n\n```\n```java\n\
    private void fillDataArray(byte data[])\n{\n    double maxZoom = 32.0;\n    for\
    \ (int i=0; i<noiseWidth; i++)\n    {\n        for (int j=0; j<noiseHeight; j++)\n\
    \        {\n            for (int k=0; k<noiseDepth; k++)\n            {\n    \
    \            float brightness = 1.0f - (float)(turbulence[i, j, k, maxZoom]) /\
    \ 256.0f;\n                Color c = new Color(brightness, brightness, 1.0f, 1.0f);\n\
    \                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+0] =\
    \ (byte) c.getRed();\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+1]\
    \ = (byte) c.getGreen();\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+2]\
    \ = (byte) c.getBlue();\n                data[i*(noiseWidth*noiseHeight*4)+j*(noiseHeight*4)+k*4+3]\
    \ = (byte) 255;\n            }\n        }\n    }\n}\n```\n```\n\n![](img/70923e8fd7afb5b4f7fd45b2d2275dfd_364_0.png)\n\
