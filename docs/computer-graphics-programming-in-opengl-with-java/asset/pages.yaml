  md: 'can be achieved. Sampling 64 points per pixel, such as in Figure 8.21, is usually
    impractical.


    A commonly used algorithm for implementing PCF is to sample four nearby texels
    per pixel, with the samples selected at specified offset distances from the texel
    which corresponds to the pixel. As we process each pixel, we alter the offsets
    used to determine which four texels are sampled. Altering the offsets in a staggered
    manner is sometimes called *dithering*, and aims to make the soft shadow boundary
    appear less “blocky” than it ordinarily would given the small number of sample
    points.


    A common approach is to assume one of four different offset patterns—we can choose
    which pattern to use for a given pixel by computing the pixel’s glFragCoord mod
    2. Recall that glFragCoord is of type vec2, containing the x and y coordinates
    of the pixel location; the result of the mod computation is then one of four values:
    (0,0), (0,1), (1,0), or (1,1). We use this result to select one of our four different
    offset patterns in texel space (i.e., in the shadow map).


    The offset patterns are typically specified in the x and y directions with different
    combinations of −1.5, −0.5, +0.5, and +1.5 (these can also be scaled as desired).
    More specifically, the four usual offset patterns for each of the cases resulting
    from the glFragCoord mod 2 computation are


    | case (0,0) | case (0,1) | case (1,0) | case (1,1) |

    |---|---|---|---|

    | *sample points:*<br>(sₓ − 1.5, sᵧ + 1.5)<br>(sₓ − 1.5, sᵧ − 0.5)<br>(sₓ + 0.5,
    sᵧ + 1.5)<br>(sₓ + 0.5, sᵧ − 0.5) | *sample points:*<br>(sₓ − 1.5, sᵧ + 0.5)<br>(sₓ
    − 1.5, sᵧ − 1.5)<br>(sₓ + 0.5, sᵧ + 0.5)<br>(sₓ + 0.5, sᵧ − 1.5) | *sample points:*<br>(sₓ
    − 0.5, sᵧ + 1.5)<br>(sₓ − 0.5, sᵧ − 0.5)<br>(sₓ + 1.5, sᵧ + 1.5)<br>(sₓ + 1.5,
    sᵧ − 0.5) | *sample points:*<br>(sₓ − 0.5, sᵧ + 0.5)<br>(sₓ − 0.5, sᵧ − 1.5)<br>(sₓ
    + 1.5, sᵧ + 0.5)<br>(sₓ + 1.5, sᵧ − 1.5) |


    Sₓ and Sᵧ refer to the location (Sₓ, Sᵧ) in the shadow map corresponding to the
    pixel being rendered, identified as shadow_coord in the code examples throughout
