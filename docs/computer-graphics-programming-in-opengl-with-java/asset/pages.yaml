- pgno: 22
  md: 'Using OpenGL with Java requires configuring several libraries. In this section,
    we describe which libraries are needed, some common options for each, and the
    option(s) that we will use throughout the book. Details on how to install and
    configure these libraries for your specific platform can be found in the appendices.


    Running the programs in this book requires the following languages and libraries:


    +   - Java

    +   - OpenGL / GLSL

    +   - JOGL

    +   - JOML


    It is likely that the reader will need to do a few preparatory steps to ensure
    that each of these are installed and properly accessible on his or her system.
    In the following subsections we briefly describe each of them; see the appendices
    for details on how to install and/or configure them for use.


    # 1.1.1 Java


    Java was developed at Sun Microsystems in the early 1990s, and the first stable
    release of a development kit (JDK) occurred in 1995. In 2010, Oracle Corporation
    acquired Sun and has maintained Java since that time [OR21]. This book assumes
    Java version 11, which was released in 2018.


    # 1.1.2 OpenGL / GLSL


    Version 1.0 of OpenGL appeared in 1992 as an “open” alternative to vendor-specific
    application programming interfaces (APIs) for computer graphics. Its specification
    and development was managed and controlled by the OpenGL Architecture Review Board
    (ARB), a then newly formed group of industry participants. In 2006 the ARB transferred
    control of the OpenGL specification to the Khronos Group, a nonprofit consortium
    which manages not only the OpenGL specification but a wide variety of other open
    industry standards.


    Since its beginning OpenGL has been revised and extended regularly. In 2004, version
    2.0 introduced the OpenGL Shading Language (GLSL), allowing “shader programs”
    to be installed and run directly in graphics pipeline stages.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'In 2009, version 3.1 removed a large number of features that had been deprecated,
    to enforce the use of shader programming as opposed to earlier approaches (referred
    to as “immediate mode”)¹. Among the more recent features, version 4.0 (in 2010)
    added a *tessellation* stage to the programmable pipeline.


    This textbook assumes that the user is using a machine with a graphics card that
    supports at least version 4.3 of OpenGL. If you are not sure which version of
    OpenGL your GPU supports, there are free applications available on the web that
    can be used to find out. One such application is GLView, by a company named “realtech
    VR” [GV21].


    # ### 1.1.3 JOGL


    JOGL (and the associated tool GlueGen) is a set of OpenGL *bindings* (sometimes
    called a “wrapper”) which provides a mechanism for invoking C-based OpenGL functions
    from Java code. JOGL first appeared in 2003, published on the website java.net.
    Since 2010 it has been an independent open source project, part of a suite of
    Java bindings maintained by *JogAmp* [JO21], an online community of developers.
    As new versions of OpenGL and/or Java are released, new versions of JOGL are developed
    to support continued compatibility. This book assumes at least version 2.4 of
    JOGL.


    # ### 1.1.4 JOML


    3D graphics programming makes heavy use of vector and matrix algebra. For this
    reason, use of OpenGL is greatly facilitated by an accompanying function library
    or class package to support common mathematical tasks. For example, the popular
    *OpenGL SuperBible* [SW15] utilizes a C library called “math”; in this book, we
    use a Java library called Java OpenGL Math Library, or JOML.


    JOML provides classes and basic math functions related to graphics concepts, such
    as *vector*, *matrix*, and *quaternion*. It also contains a variety of utility
    classes for creating and using common 3D graphics structures, such as a stack
    for building hierarchical structures, perspective and look-at matrices, and a
    few basic shapes such as a rectangle and a sphere.


    ¹ Despite this, many graphics card manufacturers (notably NVIDIA) continue to
    support deprecated functionality.'
