- pgno: 119
  md: 'the JOML library has provided a get() function for retrieving the matrix values.
    We might ordinarily expect such a “get” function to return those values in an
    object such as an array (as is done in other math libraries such as glm or graphicslib3D).
    However, JOML instead requires that a parameter be included on the call to get(),
    and then uses this parameter as the destination where it will place the retrieved
    matrix values. What makes this so clever is that the JOML get() function also
    returns a reference to the user-supplied destination object, so that the call
    to get() can be placed directly into the glUniformMatrix4fv() call (which is expecting
    such a reference). Note also that we have declared and allocated this destination
    variable “vals” in the declaration block outside of display() (along with all
    of the other variables used in display()). In a sense, the get() is actually doing
    a sort of “put,” but when implemented in this manner clearly fulfills the needs
    of a “get” function in this OpenGL setting, albeit much more efficiently.


    In keeping with the recommendations of JOML developers, we have used the form
    of get() that expects a FloatBuffer as the destination parameter. JOGL allows
    for transferring either a buffer or an array to a structured uniform variable
    (such as mat4 or vec4). But performance is slightly better when using buffers,
    particularly here because JOML forces the use of only direct NIO buffers, as opposed
    to buffers that are wrappers for Java primitive types.


    # ### 4.5.2 Pre-Computing the Perspective Matrix


    Another optimization that can be done to reduce overhead in the display() function
    is to move the computation of the perspective matrix into the init() function.
    We mentioned this possibility earlier in Section 4.5 (well, in a footnote). While
    this is certainly easy to do, there is one slight complication. Although it is
    not normally necessary to recompute the perspective matrix, it *would* be necessary
    if the user running the application *resizes* the window (such as by dragging
    the window corner resize handle).


    Fortunately, JOGL automatically makes a call to reshape() whenever the window
    is resized. So far, we have left the reshape() function empty—now we have a use
    for it. We simply move the code that computes the perspective matrix into init(),
    and also copy it into reshape().'
