  \n`Tuples` 是一种以一致方式处理一组变量的方便方法。以下代码打印了不同类型 `tuple` 的元素，无论其类型是整型、浮点型还是字符串类型。`fusion.for_each`\
  \ 算法将 `print` 元函数应用于 `tuple` 的每个元素上。\n\n**main.cpp**\n```cpp\n#include <boost/fusion/tuple.hpp>\n\
  #include <boost/fusion/algorithm.hpp>\n#include <iostream>\n#include <string>\n\
  struct print{\n  template <typename T>\n  void operator()(const T &t) const { std::cout\
  \ << t << std::endl; }\n};\nint main(){\n  typedef boost::fusion::tuple<int,float,std::string>\
  \ tuple_type;\n  tuple_type t(2, 3.3, \"Chris\");\n  boost::fusion::for_each(t,print());\n\
  }\n```\n\n# 持久化数据\n\n对于包括多核在内的大多数计算机，加速程序最快的方法是使用线程。不改变其值的持久化数据结构自动是线程安全的，而大多数常见的（非持久化）`C++`\
  \ 数据结构则需要使用 `mutex` 来仔细管理值的添加、更新和删除。以下单链表在向列表中添加项时会创建一个新列表，同时复用列表尾部的项。[5] \n\n**main.cpp**\n\
  ```cpp\n#include <cassert>\n#include <functional>\n#include <iostream>\n#include\
  \ <initializer_list>\ntemplate<class T>\nclass List{\n  struct Item { \n    Item(T\
  \ v, std::shared_ptr<const Item> const & tail) : _val(v), _next(tail) {} \n    T\
  \ _val; \n    std::shared_ptr<const Item> _next; \n  };\n  friend Item;\n  explicit\
  \ List (std::shared_ptr<const Item> const & items) : _head(items) {}\npublic:\n\
  \  // 空列表\n  List() : _head() {}\n  // Cons List\n  List(T v, List tail) : _head(std::make_shared<Item>(v,\
  \ tail._head)) {}\n  // 从初始化列表\n  List(std::initializer_list<T> init) : _head()\
  \ {\n    for (auto it = std::rbegin(init); it != std::rend(init); ++it) { \n   \
  \   _head = std::make_shared(*it, _head); \n    } \n  } \n  bool isEmpty() const\
  \ { return !_head; } \n  T front() const { assert(!isEmpty()); return _head->_val;\
  \ } \n  List popped_front() const { \n    assert(!isEmpty());\n    return List(_head->_next);\
  \  \n  }\n  // 辅助工具\n  List pushed_front(T v) const {\n    return List(v, *this);\
  \ \n  } \n  List insertedAt(int i, T v) const {\n    if (i == 0)\n      return pushed_front(v);\n\
  \    else { \n      assert(!isEmpty());\n      return List(front(), popped_front().insertedAt(i\
  \ - 1, v)); \n    } \n  }\nprivate:\n  // 编码一个 Maybe 值 (nullptr 为空列表)\n  std::shared_ptr<const\
  \ Item> _head;\n};\n```\n\n## 列表函数\n\n第一个函数从一对迭代器递归地生成 `List`，并很好地处理标准容器中的数据。\n\n\
  **fromIterator.hpp**\n```cpp\ntemplate<class Beg, class End>\nauto fromIterator(Beg\
  \ it, End end) -> List<typename Beg::value_type>{ \n  typedef typename Beg::value_type\
  \ T; \n  if (it == end) return List<T>(); \n  return List<T>(*it, fromIt(std::next(it),\
  \ end));\n}\n```\n\n这种像 `LISP` 语言中的典型列表数据结构可以被许多经典的 `LISP` 函数处理。任何学习过 `LISP` 的人都能识别这些函数。`concat`\
  \ 函数按照如下方式连接两个列表：\n\n**concat.hpp**\n```cpp\ntemplate<class T>\nList<T>concat(List<T>\
  \ a, List<T> b){\n  if (a.isEmpty()) return b;\n  return List<T>(a.front(), concat(a.popped_front(),\
  \ b));\n}\n```\n\n以下函数式列表函数对于处理列表元素非常有用。`fmap` 返回一个列表，其元素是把输入函数应用于列表每个元素后得到的结果。`fmap`\
  \ 将 `f` 应用于第一个元素，并递归地调用 `fmap` 处理剩余。\n\n**fmap.hpp**\n```cpp\ntemplate<class U,\
  \ class T, class F>\nList<U> fmap(F f, List<T> lst){\n  if (lst.isEmpty()) return\
  \ List<U>();\n  else\n  return List<U>(f(lst.front()), fmap<U>(f, lst.popped_front()));\n\
  }\n```\n\n接的 `filter` 函数将一个函数应用于列表的每个元素，并返回一个所有函数返回 true 的元素的列表。\n\n**filter.hpp**\n\
  ```cpp\ntemplate<class T, class P>\nList<T>filter(P p, List<T> lst){ \n  if (lst.isEmpty())\
  \ return List<T>(); \n  if (p(lst.front())) return List<T>( lst.front(), filter(p,\
  \ lst.popped_front())); \n  else return filter(p, lst.popped_front());\n}\n```\n\
  \nSTL 函数 `accumulate` 是一个函数式的“折叠”（fold）操作，用于累加列表中的值。`foldr` 对于“右”折叠或“左”折叠返回相同的结果。`forEach`\
  \ 函数将一个函数应用于列表的每个元素。`print` 函数将打印如下 `forEach` 函数（将一个函数应用于列表的每个元素）：\n\n**forEach.hpp**\n\
  ```cpp\ntemplate<class T, class F>\nvoid forEach(List<T> lst, f){\n  if (lst.isEmpty())\
  \ return;\n  // ... implementation\n}\n```\n\n**print.hpp**\n```cpp\ntemplate<class\
  \ T>\nvoid print(List<T> lst){\n  forEach(lst, [](const T& v) { std::cout << v <<\
  \ \" \"; });\n  std::cout << std::endl;\n}\n```\n\n\n\n\n\n`operator=` 函数被省略了，因为元素和\
  \ `vector` 之间的赋值在典型的 STL `vector` 类型中是一个被禁止的操作。相反，我们实现了一个 `set` 函数来支持设置特定元素。这种操作是非常开销的，因为仅为了设置一个元素就需要复制整个\
  \ vector。\n\n所有成员函数都被声明为 `const`，因此持久化 vector 对象需要被构造为 `const vector`。这个示例展示了一个包含\
  \ 5 个初始化为 0 的元素的 vector `v`，以及一个通过向 `v` 尾部添加 1 创建的 vector `v1`。\n\n### main.cpp\n\
  ```cpp\n#include <iostream>\n#include \"vector.hpp\"\nint main(){\n  const vector<int>\
  \ v(5,0);\n  const auto v1 = v.push_back(1);\n  for(size_t i = 0; i < v1.size();\
  \ ++i) std::cout << v1[i] << std::endl;\n  return 0;\n}\n```\n\n由于 vector 是持久化的，`push_back`\
  \ 函数在添加额外元素之前必须复制 vector。`set` 函数为 vector 的元素分配新值，并且在更新特定元素之前也必须复制 vector。在 `push_back`\
  \ 和 `set` 函数中的这种 vector 复制开销很大，应该慎用，因为它是一个 `O(n)` 操作。虽然这种复制开销可能看起来过高，但对于只在程序初始化期间执行此类复制的程序来说可能是致命的，因此不会影响长期的运行性能。\n\
  \n### main.cpp\n```cpp\n#include <iostream>\n#include <numeric>\n#include \"vector.hpp\"\
  \nint main(){\n  const vector<int> v(5,0);\n  const auto v2 = v.set(1,9); \n  for(size_t\
  \ i = 0;i < v2.size();++i) std::cout << v2[i] << std::endl;\n  return 0;\n}\n```\n\
  \n`begin` 和 `end` 函数返回的 `const_iterators` 可以与标准的 STL 算法（如 `accumulate` 函数）一起使用。\n\
  \n### main.cpp\n```cpp\n#include <iostream>\n#include <numeric>\n#include \"vector.hpp\"\
  \nint main(){\n  const vector<int> v(5,0);\n  const auto v1 = v.set(1,9); \n  std::cout\
  \ << std::accumulate(v1.begin(),v1.end(),0) << std::endl;\n  return 0;\n}\n```\n\
  \nSTL `vector` 包含了许多更多函数，包括 `assign`、`insert`、`erase` 等。这些函数可以为持久化 vector 实现，这里将其留给读者练习。\n\
  \n## 更多持久化数据结构\n\n其他的 STL 数据结构，如 `map`、`unordered_map`、`list` 等，也可以像之前的 vector 数据结构一样以持久化的方式实现。它们在数据结构更新时需要复制数据。\n\
  \n# 附录\n\n## Tuple 哈希\n\n为了在以 tuple 为键的 unordered_map 中存储和检索值，需要通过 `hash` 函数对值进行组合。\n\
  \n### main.cpp\n```cpp\n#include <tuple>\n#include <functional>\n#include <iostream>\n\
  size_t hash_combiner(size_t left, size_t right) //replaceable{ return left^right;}\n\
  template<int index, class...types>\nstruct hash_impl {\n  size_t operator()(size_t\
  \ a, const std::tuple<types...>& t) const{\n    typedef typename std::tuple_element<\
  \ index, std::tuple<types...>>::type nexttype;\n    hash_impl<index-1, types...>\
  \ next;\n    size_t b = std::hash<nexttype>()(std::get<index>(t));\n    return next(hash_combiner(a,\
  \ b), t);\n  }\n};\ntemplate<class...types>\nstruct hash_impl<0, types...>{\n  size_t\
  \ operator()(size_t a, const std::tuple<types...>& t) const{\n    typedef typename\
  \ std::tuple_element<0, std::tuple<types...>>::type nexttype;\n    size_t b = std::hash<nexttype>()(std::get<0>(t));\n\
  \    return hash_combiner(a, b);\n  }\n};\nnamespace std {\n  template<class...types>\n\
  \  struct hash<std::tuple<types...>> {\n    size_t operator()(const std::tuple<types...>&\
  \ t) const {\n      const size_t begin = std::tuple_size<std::tuple<types...>>::value-1;\n\
  \      return hash_impl<begin, types...>()(1, t);\n    }\n  };\n}\n```\n\n# 参考文献\n\
