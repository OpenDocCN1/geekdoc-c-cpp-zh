- "# C++ 函数式编程\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n## 函数式 C++\n\nChris Weed 是一位居住在马萨诸塞州的软件工程师。他自\
  \ 1995 年起就开始编写 C++。他的兴趣包括函数式编程、视频处理和递归。\n\n# 引言\n\n## 概述\n\n随着 Python、Haskell 和\
  \ Scala 等语言的兴起，函数式编程正经历着复兴。C++ 也增加了一些函数式特性，例如 lambdas 和 futures。本书探索了 C++ 中的函数式技术及其优势。\n\
  \n### 副作用\n\n函数式编程最重要的特征之一是程序几乎完全在没有副作用的情况下编写。根据维基百科介绍，如果一个函数在返回值之外还修改了某些状态或与外部产生可观察的交互，那么它就具有副作用。例如，函数可能会修改全局或静态变量、抛出异常、向显示器或文件写入数据、读取数据或调用其他具有副作用的函数。\n\
  \n没有副作用的函数通常被称为纯函数，它们函数式语言的标准。这些函数仅根据输入参数产生输出。然而，C++ 代码通常包含带有可变参数、引用全局/静态或成员变量、或调用其他纯函数的函数。纯函数的一个有用属性是，当使用相同的参数调用时始终得到相同的输出。由于这一点，函数式语言可以使用名为“记忆化”（memoization）的过程来缓存可重复的结果。\n\
  \n### 序列\n\nSTL 算法通常基于遍历在 `begin` 和 `end` 迭代器之间访问的值或对象序列。函数式语言中列表的典型分段是在头部对象（head\
  \ object）和尾部列表（tail list）之间。STL 容器通过引用 `begin` 迭代器提供头部对象，而尾部列表可以在通过 `std::next(begin)`\
  \ 访问的 `next` 迭代器与 `end` 迭代器之间获取。此外，当 `begin` 和 `end` 迭代器相等时列表为空，它们之间没有对象。算法章节广泛使用了这种序列模型。\n\
  \n### 编译器\n\n本书示例使用了 Apple LLVM 6.1.0 编译器，并使用 `-O3` 选项编译，该选项包含了尾调用优化。在具有深度递归的发布和调试模式构建中，此优化设置是必要的，因为如果没有它，程序将超出栈大小并导致段错误。所有代码示例均使用了\
  \ `-std=c++11` 选项。对于与 C++14 代码示例，则使用了 `-std=c++14` 选项。\n\n\n\n\n函数式编程通常涉及抽象开销，这会导致代码无法达到绝对的最优性能，然而对于整个程序来说这并不常见。通常只需要对程序的一小部分性能关键区域进行优化以获得良好的性能。将副作用限制在这些区域，可以在保持其余部分代码可读且无错误的同时，获得接近最优的性能。\n\
  \n# 算法\n\n## 递归函数\n\n递归函数是函数式语言的核心，许多算法比严格的迭代形式更易实现。递归算法的一个难点是计算机的栈限制，过多的递归调用会违反该限制。现代\
  \ C++ 编译器实现了尾递归优化，结构适当的尾递归函数不受栈大小的限制。编译器生成的代码不会添加栈帧，并且在大量次数的递归调用时不会超出栈限制。\n\n本章涵盖了\
  \ STL 算法的递归实现，大多数是使用尾递归实现的。某些算法为了解释说明，或者当发现其编译后的代码不会超出栈限制时，也包含了非尾递归的实现。本章中的所有函数都经过了极大递归深度的测试，没有一个导致段错误。\n\
  \n本章涵盖的大多数算法是非修改算法，它们不会修改算法处理的数据。这些算法可以处理由 `const` 迭代器访问的数据，这些迭代器会转换数据而不改变它。可以在网站\
  \ [`cplusplus.com`](http://cplusplus.com) 查看这些算法的迭代实现以便对比：\n\n`<algorithm>` [`www.cplusplus.com/reference/algorithm/`](http://www.cplusplus.com/reference/algorithm/)\n\
  \n`<numeric>`\n\n[`www.cplusplus.com/reference/numeric/`](http://www.cplusplus.com/reference/numeric/)\n\
  \n## all_of\n\n`all_of` 算法如果序列中的所有元素单独传递给一元谓词时都返回真，则它返回真。该算法检查每个元素，直到谓词返回假或到达序列末尾。由于\
  \ AND 运算符（`&&`）在左侧参数为假时会短路评估，右侧的 `all_of` 函数将不会被调用，递归也会停止。\n\n| `recursive::all_of`\
  \ |\n| `template<class InputIterator,class UnaryPredicate>bool all_of (InputIterator\
  \ first,InputIterator last, UnaryPredicate pred) {if (first == last) return true;return\
  \ pred(*first)) && all_of(std::next(first), last, pred);}` ` |\n\n本章中的大多数算法都以一个条件语句开头，检查是否到达序列末尾以及第一个和最后一个迭代器是否相等。随后是算法实现的逻辑。接下来的尾递归版本使用了一个额外的\
  \ `if` 条件来检查应用于第一个元素的谓词。\n\n| `recursive::all_of` |\n| `template<class InputIterator,class\
  \ UnaryPredicate>bool all_of (InputIterator first,InputIterator last, UnaryPredicate\
  \ pred) {if (first == last) return true;if (!pred(*first)) return false;return all_of(std::next(first),\
  \ last, pred);}` ` |\n\n这两种实现都没有因为超出栈而导致段错误，但第一种更加简洁。使用 OR 运算符（`||`）可以实现仅包含单个返回语句的实现。\n\
  \n| `recursive::all_of` |\n| `template<class InputIterator,class UnaryPredicate>bool\
  \ all_of (InputIterator first,InputIterator last, UnaryPredicate pred) {return (first\
  \ == last) || pred(*first)) && all_of(std::next(first), last, pred);}` ` |\n\n这个单语句捕获了算法计算中的递归尾条件。\n\
  \n## any_of\n\n`any_of` 算法将一元谓词应用于序列的元素，如果谓词对任何一个元素返回真，则它返回真。对于包含零元素的序列，它返回假。\n\n\
  | `recursive::any_of` |\n| ```\ntemplate<class InputIterator,\n         class UnaryPredicate>\n\
  bool any_of (InputIterator first,\n             InputIterator last,\n          \
  \   UnaryPredicate pred)\n{\nif (first == last) return false;return pred(*first))\
  \ ||\n     any_of(std::next(first), last, pred);\n}\n``` ` |\n\n由于短路评估，如果谓词返回真，则\
  \ OR 运算符右侧的 `any_of` 递归调用将不会执行。接下来的尾递归版本重现了短路评估，并在谓词为真时在递归调用前返回。\n\n| `recursive::any_of`\
  \ |\n| ```\ntemplate<class InputIterator,\n         class UnaryPredicate>\nbool\
  \ any_of (InputIterator first,\n             InputIterator last,\n             UnaryPredicate\
  \ pred)\n{\nif (first == last) return false;\nif (pred(*first)) return true;\nreturn\
  \ any_of(std::next(first), last, pred);\n}\n``` ` |\n\n## none_of\n\n`none_of` 算法如果谓词对所有元素都返回假或序列为空，则返回真。否则，算法返回假。该算法几乎与\
  \ `all_of` 相同，但取谓词的反反。\n\n| `recursive::none_of` |\n| `template<class InputIterator,class\
  \ UnaryPredicate>bool none_of(InputIterator first,InputIterator last, UnaryPredicate\
  \ pred) {if (first == last) return true;return pred(*first)) && none_of(std::next(first),\
  \ last, pred);}` ` |\n\n`none_of` 可以用 `all_of` 算法和一个否定谓词的 lambda 实现。Lambda 将在后的章节中详细讨论，在本例中它用于创建\
  \ lambda。\n\n| `recursive::none_of` |\n| ```\ntemplate<class InputIterator,\n  \
  \       class UnaryPredicate>\nbool none_of (InputIterator first,\n            \
  \ InputIterator last,\n             UnaryPredicate pred)\n{\n return all_of(std::next(first),\
  \ last, &{ return !pred(x); });\n}\n``` ` |\n\n该 lambda 是带有 `auto` 参数类型的 C++14 风格泛\
  \ lambda，也可以使用 C++11 风格的 lambda，其参数类型为 `typename std::iterator_traits<InputIterator>::value_type`。\n\
  \n## for_each\n\n`for_each` 算法将函数对象序列的每个元素，并将函数对象作为结果返回。\n\n| `recursive::for_each`\
  \ |\n| ```\ntemplate<class InputIterator,\n         class Function>\nFunction\n\
  for_each(InputIterator first,\n             InputIterator last,\n             Function\
  \ fn)\n{\nif (first == last) return fn;\nfn(*first);\nreturn for_each(std::next(first),\
  \ last, fn);\n}\n``` ` |\n\n从 `for_each` 返回函数对象可能在函数对象改变状态的情况下有用，因为常量对象仅仅与传入的函数对象相同。\n\
  \n## find\n\n`find` 算法返回一个指向与传入值相第一个元素的迭代器。如果没有找到元素，则返回最后一个迭代器。\n\n| `recursive::find`\
  \ |\n\n\n\n\n\n```cpptemplate<class InputIterator,class T>\nInputIterator find (InputIterator\
  \ first, InputIterator last, const T& val) {\n    if (first == last) return first;\n\
  \    if (*first == val) return first;\n    return find(std::next(first), last, val);\n\
  }\n```\n\n算法的最后两行在下面的列表中使用三元运算符在单行内实现。这使得算法更加简洁。\n\n### recursive::find\n\n```cpp\n\
  template<class InputIterator,class T>\nInputIterator find (InputIterator first,\
  \ InputIterator last, const T& val) {\n    if (first == last) return first;\n  \
  \  return (*first == val) ? first : find(std::next(first), last, val);\n}\n```\n\
  \n三元运算符 `? :` 简化了算法递归之前的条件检查，并对于简化本章中的更多算法非常有用。第一行也可以使用三元运算符与接下去的一行合并，形成单行实现。\n\n\
  ### recursive::find\n\n```cpp\ntemplate<class InputIterator,class T>\nInputIterator\
  \ find(InputIterator first, InputIterator last, const T& val) {\n    return (first\
  \ == last) ? first : (*first == val) ? first : find(std::next(first), last, val);\n\
  }\n```\n\n## find_if\n\n`find_if` 算法对序列中的每个元素应用一元谓词，并返回指向第一个谓词返回 `true` 的元素的迭代器。如果没有找到谓词为\
  \ `true` 的元素，算法返回最后一个迭代器。\n\n### recursive::find_if\n\n```cpp\ntemplate<class InputIterator,class\
  \ UnaryPredicate>\nInputIterator find_if(InputIterator first, InputIterator last,\
  \ UnaryPredicate pred) {\n    if (first == last) return first;\n    if (pred(*first))\
  \ return first;\n    return find_if(std::next(first), last, pred);\n}\n```\n\n该算法也可以通过三元运算符用更少的行来实现。\n\
  \n## find_if_not\n\n`find_if_not` 算法对序列中的每个元素应用一元谓词，并返回指向第一个谓词返回 `false` 的元素的迭代器。\n\
  \n### recursive::find_if_not\n\n```cpp\ntemplate<class InputIterator,class UnaryPredicate>\n\
  InputIterator find_if(InputIterator first, InputIterator last, UnaryPredicate pred)\
  \ {\n    if (first == last) return first;\n    if (!pred(*first)) return first;\n\
  \    return find_if_not(std::next(first), last, pred);\n}\n```\n\n`find_if_not`\
  \ 也可以通过调用 `find_if` 算法并对传入的谓词应用取反 lambda 来来实现。\n\n### recursive::find_if_not\n\n\
  ```cpp\ntemplate<class InputIterator,class UnaryPredicate>\nInputIterator find_if_not(InputIterator\
  \ first, InputIterator last, UnaryPredicate pred) {\n    find_if(first, last, &{\
  \ return !pred(x); });\n}\n```\n\n该 lambda 是一个带有 `auto` 参数类型的 C++14 风格泛型 lambda，也可以使用\
  \ C++11 风格的 lambda，其参数类型为 `typename std::iterator_traits<InputIterator>::value_type`。\n\
  \n## find_end\n\n`find_end` 算法在序列中查找子序列的最后一次出现。该算法调用了一个辅助版本的 `find_end` 函数，并带有一个额外参数，用于传递目前找到的子序列最后出现位置。它首先使用\
  \ `last` 迭代器作为初始可能的结果调用辅助函数。当它使用 `starts_with` 函数找到子序列的新出现位置时，它会更新可能的结果。\n\n###\
  \ recursive::find_end\n\n```cpp\ntemplate<class ForwardIterator1,class ForwardIterator2>\n\
  bool starts_with(ForwardIterator1 first1, ForwardIterator1 last1, ForwardIterator2\
  \ first2, ForwardIterator2 last2) {\n    if (first2==last2) return true;\n    if\
  \ (first1==last1) return false;\n    return (*first1 == *first2) && starts_with(std::next(first1),\
  \ last1, std::next(first2), last2);\n}\n\ntemplate<class ForwardIterator1, class\
  \ ForwardIterator2>\nForwardIterator1 find_end (ForwardIterator1 first1, ForwardIterator1\
  \ last1, ForwardIterator2 first2, ForwardIterator2 last2, ForwardIterator1 curr)\
  \ {\n    if (first1==last1) return curr;\n    if (starts_with(first1,last1,first2,last2))\
  \ return find_end(std::next(first1), last1, first2, last2, first1);\n    return\
  \ find_end(std::next(first1), last1, first2, last2, curr);\n}\n\ntemplate<class\
  \ ForwardIterator1, class ForwardIterator2>\nForwardIterator1 find_end(ForwardIterator1\
  \ first1, ForwardIterator1 last1, ForwardIterator2 first2, ForwardIterator2 last2)\
  \ {\n    if (first2==last2) return last1;\n    return find_end(first1, last1, first2,\
  \ last2);\n}\n```\n\n`starts_with` 函数在之后也会被用到。\n\n## find_of\n\n`find_of` 算法在序列中找到匹配另一个序列中元素的第一个元素。\n\
  \n### recursive::find_of\n\n```cpp\ntemplate<class InputIterator,class ForwardIterator>\n\
  InputIterator find_of(InputIterator first1, InputIterator last1, ForwardIterator\
  \ first2, ForwardIterator last2) {\n    if (first1 == last1) return last1;\n   \
  \ if (starts_with(first2, last2, first1, last1)) return first1;\n    return find_of(std::next(first1),\
  \ last1, first2, last2);\n}\n\ntemplate<class InputIterator,class ForwardIterator>\n\
  InputIterator find_of(InputIterator first1, InputIterator last1, ForwardIterator\
  \ first2, ForwardIterator last2) {\n    if (first2 == last2) return last1;\n   \
  \ return find_of(first1, last1, first2);\n}\n```\n\n## adjacent_find\n\n`adjacent_find`\
  \ 算法返回序列中两个连续元素相等的第一个位置的迭代器。迭代器指向这两个元素中的第一个。如果序列少于两个元素，则返回结束迭代器。\n\n递归实现在主函数中使用辅助函数来检查空序列。使用\
  \ `first` 和 `next` 迭代器进行比较。\n\n### recursive::adjacent_find\n\n```cpp\ntemplate<class\
  \ ForwardIterator>\nForwardIterator adjacent_find1 (ForwardIterator first, ForwardIterator\
  \ last) {\n    ForwardIterator next = std::next(first);\n    if (next == last) return\
  \ last;\n    if (*first == *next) return first;\n    return adjacent_find1(next,\
  \ last);\n}\n\ntemplate<class ForwardIterator>\nForwardIterator adjacent_find (ForwardIterator\
  \ first, ForwardIterator last) {\n    if (first==last) return last;\n    return\
  \ adjacent_find1(first, last);\n}\n```\n\n## count\n\n`count` 算法计算序列中匹配特定值的数量。这个简单的算法在实现中只需要两行。\n\
  \n### recursive::count\n\n```cpp\ntemplate<class InputIterator,class T>\ntypename\
  \ std::iterator_traits<InputIterator>::difference_type\ncount (InputIterator first,\
  \ InputIterator last, const T& val) {\n    if (first==last) return 0;\n    return\
  \ (*first==val) + count(std::next(first), last, val);\n}\n```\n\n将当前计数传递给下一次调用的尾递归版本稍微复杂一些。它需要调用一个单独的\
  \ `count1` 函数并带上额外参数。\n\n\n\n\n\n```cpp\ntypename std::iterator_traits<InputIterator>::difference_type\
  \ c = 0)\n```\n\n```cpp\nif (first==last) return 0;\nreturn count1(std::next(first),\
  \ last, val, c + (*first==val));\n}\n```\n\n```cpp\ntemplate <class InputIterator,\
  \ class T>\ntypename std::iterator_traits<InputIterator>::difference_type\ncount\
  \ (InputIterator first, InputIterator last, const T& val) {return count1(first,last,val);}\n\
  ``` | \n\n`count` 算法可以通过 `accumulate` 算法和自定义 lambda 表达式来实现。`accumulate` 算法在后续节中描述。\n\
  \n### recursive::count\n\n```cpp\n#include <numeric>\ntemplate <class InputIterator,\
  \ class T>\ntypename std::iterator_traits<InputIterator>::difference_type\ncount\
  \ (InputIterator first, InputIterator last, const T& val) {return accumulate(first,last,0,&{\
  \ return x+(y==val); });}\n``` |\n\n## accumulate\n\n`accumulate` 算法位于 `numeric`\
  \ 头文件中，它对传入函数的“init”值和序列的“first”元素应用二元运算符。该运算符的结果将作为序列剩余部分的“init”值进行传递。`accumulate`\
  \ 算法最常见的用途之一是累加序列中的元素并返回数学总和。\n\n### recursive::accumulate\n\n```cpp\ntemplate <class\
  \ InputIterator, class T, class BinaryOperation>T accumulate (InputIterator first,\
  \ InputIterator last, T init, BinaryOperation op) {if (first == last) return init;return\
  \ accumulate(std::next(first),last,op(init,*first),op);}\n```\n\n## count_if\n\n\
  `count_if` 算法计算谓词应用于序列中元素时为真（true）的次数。该算法使用 `iterator_traits` 的 `difference_type`\
  \ 来确定结果值的类型。\n\n### recursive::count_if\n\n```cpp\ntemplate <class InputIterator,\
  \ class UnaryPredicate>\ntypename std::iterator_traits<InputIterator>::difference_type\n\
  count_if (InputIterator first, InputIterator last, UnaryPredicate pred) {if (first==last)\
  \ return 0;return pred(*first) + count_if(std::next(first), last, pred);}\n```\n\
  \n## mismatch\n\n`mismatch` 算法找到两个序列中第一个不匹配的元素，并返回一对指向不匹配项的迭代器。如果所有元素都匹配，则第一个序列的迭代器等于最后一个迭代器。\n\
  \n### recursive::mismatch\n\n```cpp\ntemplate <class InputIterator1, class InputIterator2>\n\
  std::pair<InputIterator1,InputIterator2>\nmismatch (InputIterator1 first1, InputIterator1\
  \ last1, InputIterator2 first2) {if (first1==last1) return std::make_pair(first1,first2);if\
  \ (*first1!=*first2) return std::make_pair(first1,first2);return mismatch(std::next(first1),last1,std::next(first2))}\n\
  ```\n\n第二个序列的长度不比第一个序列短，否则可能会导致未定义行为。\n\n## equal\n\n`equal` 算法比较两个序列，如果两个序列的元素相等，则返回\
  \ true。该算法非常简单，可以使用逻辑与运算符 (`&&`) 实现。\n\n### recursive::equal\n\n```cpp\ntemplate\
  \ <class InputIterator1, class InputIterator2>\nbool equal(InputIterator1 first1,\
  \ InputIterator1 last1, InputIterator2 first2) {if (first1==last1) return true;return\
  \ (*first1 == *first2) && equal(std::next(first1),last1,std::next(first2))}\n```\n\
  \n## advance\n\n`advance` 算法将迭代器推进 `n` 次，以下版本返回生成的迭代器。与 STL 版本不同，它不会更新传入的迭代器。\n\n\
  ### recursive::advance\n\n```cpp\ntemplate<class InputIterator, class Distance>\n\
  InputIterator advance(InputIterator it, Distance n) {return n ? it : advance(std::next(it),n-1);}\n\
  ```\n\n这个简单的函数用于后续的 `is_permutation` 算法。\n\n## distance\n\n`distance` 算法计算传入两个迭代器之间的元素数量。\n\
  \n### recursive::distance\n\n```cpp\ntemplate <class InputIterator>\ntypename std::iterator_traits<InputIterator>::difference_type\n\
  distance(InputIterator first, InputIterator last) {if (first==last) return 0; return\
  \ 1+distance(std::next(first),last);}\n```\n\n这个简单的函数也被用于 `is_permutation` 算法。\n\
  \n## is_permutation\n\n`is_permutation` 算法判断两个序列是否为彼此的排列。两个序列包含相同的元素，但顺序可能不同。该算法使用\
  \ `mismatch` 在匹配的序列之后开始算法。之后，它调用 `is_permutation1` 函数，该函数遍历第一个序列的元素。它使用 `find` 算法检查该元素是否已经遇到过，如果没有遇到，则比较它们在两个序列中出现的次数以查看它们是否匹配。该比较与对\
  \ `is_permutation1` 的递归调用进行了逻辑与操作。\n\n### recursive::is_permutation\n\n```cpp\n\
  template <class InputIterator1, class InputIterator2>\nbool is_permutation1 (InputIterator1\
  \ first1, InputIterator1 curr, InputIterator1 last1, InputIterator2 first2, InputIterator2\
  \ last2) {if (curr==last1) return true; if (find(first1,curr,*curr)==curr) return\
  \ ((1+count(std::next(curr),last1,*curr)) == count(first2,last2,*curr)) && is_permutation1(first1,\
  \ std::next(curr), last1, first2, last2); else return is_permutation1(first1, std::next(curr),\
  \ last1, first2, last2);}\n\ntemplate <class InputIterator1, class InputIterator2>\n\
  bool is_permutation(InputIterator1 first1, InputIterator1 last1, InputIterator2\
  \ first2, InputIterator2 last2) {auto start = mismatch(first1,last1,first2);if (start.first==last1)\
  \ return true;return is_permutation1(start.first,start.first,last1,start.second,advance(start.second,distance(start.first,last1));}\n\
  ```\n\n可以实现一种优化版本，在计算第一个序列中的元素之前，检查第二个序列中的元素计数是否大于 1。这留给读者作为练习。\n\n## search\n\n\
  `search` 算法在序列中查找子序列的首次出现。它首先检查子序列是否包含零元素，如果是，则返回序列的迭代器。否则，它调用 `search1` 辅助函数，该函数遍历序列并检查每个元素是否为子序列的开头。子序列的检查使用之前在\
  \ `find_end` 算法中使用的 `starts with` 函数进行。\n\n### recursive::search\n\n```cpp\ntemplate<class\
  \ ForwardIterator1,\n```\n\n\n\n\n\n```cpp\nclass ForwardIterator2>\nbool starts_with(ForwardIterator1\
  \ first1, ForwardIterator1 last1, ForwardIterator2 first2, ForwardIterator2 last2)\
  \ {\n    if (first2==last2) return true;\n    if (first1==last1) return false;\n\
  \    return (*first1 == *first2) && starts_with(std::next(first1), last1, std::next(first2),\
  \ last2);\n}\n```\n\n```cpp\ntemplate<class ForwardIterator1, class ForwardIterator2>\n\
  ForwardIterator1 search1(ForwardIterator1 first1, ForwardIterator1 last1, ForwardIterator2\
  \ first2, ForwardIterator2 last2) {\n    if (first1==last1) return last1;\n    if\
  \ (starts_with(first1,last1,first2,last2)) return first1;\n    return search1(std::next(first1),\
  \ last1, first2, last2);\n}\n```\n\n```cpp\ntemplate<class ForwardIterator1, class\
  \ ForwardIterator2>\nForwardIterator1 search (ForwardIterator1 first1, ForwardIterator1\
  \ last1, ForwardIterator2 first2, ForwardIterator2 last2) {\n    if (first2==last2)\
  \ return first1;\n    return search1(first1,last1,first2,last2);\n}\n```\n\n## search_n\n\
  \n`search_n` 算法在序列中查找一个与传递的值相等且重复“n” 次的项。返回的结果是指向重复序列第一个实例的迭代器。`search_n` 函数调用了辅助函数\
  \ `search_n1`，该函数对序列进行递归，并在项与传递的值匹配时将计数器减 1。当计数器归零时返回 `true`；当匹配失败时返回 `false`。当它返回\
  \ `false` 时，它还会返回可以重新搜索的下一个位置，以查找匹配字符串，因此搜索不会对元素进行多次迭代。返回 `true` 值时返回的迭代器没有意义且未被使用。\n\
  \n| **recursive::search_n** |\n\n```cpp\ntemplate<class ForwardIterator, class Size,\
  \ class T>\nstd::pair<bool,ForwardIterator> search_n1(ForwardIterator first, ForwardIterator\
  \ last, Size count, const T& val) {\n    if (!count) return std::make_pair(true,first);\n\
  \    if (first==last) return std::make_pair(false,last);\n    if (*first != val)\
  \ return std::make_pair(false,std::next(first));\n    return search_n1(std::next(first),\
  \ last, count-1, val);\n}\n```\n\n```cpp\ntemplate<class ForwardIterator, class\
  \ Size, class T>\nForwardIterator search_n (ForwardIterator first, ForwardIterator\
  \ last, Size count, const T& val) {\n    const auto pair = search_n1(first,last,count,val);\n\
  \    if (pair.first) return first;\n    if (pair.second==last) return last;\n  \
  \  return search_n(pair.second, last, count, val);\n}\n```\n\n## min_element\n\n\
  `min_element` 算法返回指向项序列中最小元素的迭代器。通过对返回的迭代器进行解引用获取最小值。该算法使用辅助函数在递归时传递最小元素。\n\n| **recursive::min_element**\
  \ |\n\n```cpp\ntemplate<class InputIterator, class T>\nInputIterator min_element1(InputIterator\
  \ first, InputIterator last, InputIterator min) {\n    if (first == last) return\
  \ min;\n    return min_element1(std::next(first), last, (*min < *first) ? min :\
  \ first);\n}\ntemplate<class InputIterator>\nInputIterator min_element (InputIterator\
  \ first, InputIterator last) {\n    if (first == last) return last;\n    return\
  \ min_element1(std::next(first), last, first);\n}\n```\n\n`max_element` 或 `min_element`\
  \ 的实现同样会在算法递归时传递迭代器。\n\n## adjacent_difference\n\n`numeric` 头文件中的 `adjacent_difference`\
  \ 算法将每个元素与前一个元素的差值赋值给输出序列。该算法并非严格无副作用。实现部分留给读者练习。\n\n| **recursive::adjacent_difference**\
  \ |\n\n```cpp\ntemplate<class InputIterator, class OutputIterator>\nadjacent_difference(InputIterator\
  \ first, InputIterator last, OutputIterator result) {\n    if (first==last) return\
  \ result; // 注意：原始文本片段在此处断断了\n}\n```\n（注：根据提供的片段文本修正逻辑）\n\n```cpp\ntemplate<class\
  \ InputIterator, class OutputIterator>\nadjacent_difference(InputIterator first,\
  \ InputIterator last, OutputIterator result) {\n    if (first==last) return result;\n\
  \    *result = *first;\n    return adjacent_difference(std::next(first), last);\n\
  }\n```\n\n## inner_product\n\n`numeric` 头文件中的 `inner_product` 算法累加两个序列的内积。\n\n|\
  \ **recursive::inner_product** |\n\n```cpp\ntemplate<class InputIterator1, class\
  \ InputIterator2, class T>\nT inner_product(InputIterator1 first1, InputIterator1\
  \ last1, InputIterator2 first2, T init) {\n    if (first1 == last) return init;\n\
  \    return inner_product(std::next(first1), last1, std::next(first2), init+(*first1));\n\
  }\n```\n\n## partial_sum\n\n`numeric` 头文件中的 `partial_sum` 算法计算序列的部分和。输出序列中的第“n”个元素被赋值输入序列中前“n”个元素的和。`partial_sum`\
  \ 算法使用赋值来设置输出值，因此并非严格无副作用。该实现通过递归定义维护了典型的 STL 接口，并使用了辅助函数 `partial_sum1`。\n\n| **recursive::partial_sum**\
  \ |\n\n```cpp\ntemplate<class InputIterator, class OutputIterator>\nOutputIterator\
  \ partial_sum1(InputIterator first, InputIterator last, OutputIterator result, typename\
  \ std::iterator_traits<OutputIterator>::value_type val) {\n    if (first==last)\
  \ return result;\n    return partial_sum1(std::next(first), last, std::next(result),\
  \ *first + val);\n}\ntemplate<class InputIterator, class OutputIterator>\nOutputIterator\
  \ partial_sum(InputIterator first, InputIterator last, OutputIterator result) {\n\
  \    return partial_sum1(first, last, result, 0);\n}\n```\n\n`partial_sum` 算法的另一个版本返回输出数据序列而不是将数据赋值给输出迭代器，它封装在一个调用\
  \ `partial_sum1` 和之前定义的距离函数的函数接口中。在函数内部构造了一个与输入序列大小相同的 vector，并将序列的起始迭代器作为输出迭代器传递。\n\
  \n| **recursive::partial_sum** |\n\n```cpp\ntemplate<class InputIterator, class\
  \ OutputIterator>\nstd::vector<typename std::iterator_traits<InputIterator>::value_type>\
  \ partial_sum(InputIterator first, InputIterator last) {\n    std::vector<typename\
  \ std::iterator_traits<InputIterator>::value_type> v(distance(first,last));\n  \
  \  return partial_sum1(first, last, std::begin(v), 0);\n}\n```\n\n## iota\n\n`iota`\
  \ 算法为迭代器分配从输入值开始的递增序列。算法将值赋值给输入迭代器，因此函数具有副作用。然而，可以通过标准的 STL 接口以递归方式实现。\n\n| **recursive::iota**\
  \ |\n\n\n\n\n\n```cpp\ntemplate <class ForwardIterator, class T>\nvoid iota(ForwardIterator\
  \ first, ForwardIterator last, T val) {\n    if (first == last) return;\n    *first\
  \ = val;\n    iota(std::next(first), last, val+1);\n}\n```\n\n该算法的一个函数式版本需要传入要创建元素数量，该数量在上一个实现中隐式地通过第一个和最后一个迭代器之间的距离找到。可以通过调用\
  \ STL `distance` 函数配合 `begin` 和 `end` 迭代器来获取此值。以下实现调用了之前的版本，并返回一个包含递增元素的 vector。\n\
  \n### `recursive::iota`\n\n```cpp\ntemplate <class T, class Size>\nstd::vector<T>\
  \ iota(T val, Size n) {\n    std::vector<T> v(n);\n    iota(std::begin(v),std::end(v),val);\n\
  \    return v;\n}\n```\n\n## 运行结果\n\n每个递归算法都与 `vector`、`list` 和 `set` 的长序列上与 STL\
  \ 实现进行了对比。下表显示了在大数量迭代运行时，哪种算法更快。\n\n| Algorithm | vector | list | set |\n| :---\
  \ | :--- | :--- | :--- |\n| all_of | recursive | same | recursive |\n| any_of |\
  \ same | same | recursive |\n| none_of | recursive | same | same |\n| for_each |\
  \ recursive | recursive | recursive |\n| find | recursive | recursive | recursive\
  \ |\n| find_if | same | STL | recursive |\n| find_if_not | STL | same | STL |\n\
  | find_end | same | STL | recursive |\n| find_first_of | same | STL | recursive\
  \ |\n| adjacent_find | STL | recursive | N/A |\n| count | STL | same | recursive\
  \ |\n| count_if | STL | same | recursive |\n| accumulate | STL | recursive | STL\
  \ |\n| mismatch | STL | recursive | STL |\n| equal | STL | STL | recursive |\n|\
  \ is_permutation | STL | recursive | N/A |\n| search | STL | STL | STL |\n| search_n\
  \ | STL | recursive | N/A |\n| adjacent_difference | STL | recursive | STL |\n|\
  \ inner_product | STL | recursive | recursive |\n\n当某种实现胜出时，速度差异通常是忽略不微。此分析的重点并不是说应该根据速度选择某种实现而非另一种，而是说递归实现并不一定会对运行时性能产生不利。\n\
  \n## constexpr\n\nC++11 中的 `constexpr` 关键字允许定义在运行时进行求值的函数。`constexpr` 函数的所有输入也必须是\
  \ `constexpr` 的。在 C++11 中，这些函数应该是单行函数，并且可以是递归的。许多之前的函数在用三元运算符处理递归基准情况时都支持这一点。请参阅本章的进阶算法以获取示例。数组序列可以使用该算法，因为它的迭代器可以通过\
  \ `constexpr` `begin/end` 函数返回。以下 `sum` 函数在编译时执行，因此在运行时仅产生 `cout` 打印输出。\n\n### main.cpp\
  \ (C++11 and C++14)\n\n```cpp\n#include <iostream>\n#include <array>\ntemplate<typename\
  \ T>\nconstexpr int sum(T b, T e){\n  return (b==e) ? 0 : *b + sum(std::next(b),e);\n\
  }\nint main(){ \n  std::array<int,3> a = { 1,2,3 }; \n  std::cout << sum(a.begin(),a.end())\
  \ << std::endl;\n  return 0;\n}\n```\n\nC++14 允许带有条件判断和循环的 `constexpr` 函数，并支持之前所有的算法。为了简单起见，之前的算法都没有被定义为\
  \ `constexpr`。以下带有 `for` 循环的 `sum` 函数在编译时执行。\n\n### main.cpp (C++14 only)\n\n```cpp\n\
  #include <iostream>\n#include <array>\ntemplate<typename T>\nconstexpr int sum(T\
  \ b, T e){ \n  int result = 0; \n  for(;b!=e;++b) { \n    result += *b; \n  }  \n\
  \  return result;\n}\nint main(){ \n  std::array<int,3> a = { 1,2,3 }; \n  std::cout\
  \ << sum(a.begin(),a.end()) << std::endl; \n  return 0;\n}\n```\n\n# Lambdas\n\n\
  C++11 引入了 lambda 函数（或 lambdas）作为一种语言结构，支持在函数使用的地方定义函数。该函数在定义处是无名的，被称为匿名函数。然而，为了方便起见，可以将\
  \ lambda 赋值给命名变量。持有 lambda 的变量必须用 `auto` 类型声明，或者可以将 lambda 赋值给 STL 函数对象 `std::function`。作为函数对象传递给函数的\
  \ lambda 必须使用模板参数，以便编译器推导出 lambda 函数的类型。\n\n一个典型的 lambda 由捕获列表 `[]`、参数列表 `()`、返回类型\
  \ `-> T` 和 lambda 函数体 `{}` 组成。这些都是普通函数的典型特征，只是使用了新的返回类型箭头符号 `->`，以及添加了捕获列表来描述变量如何被捕获并在\
  \ lambda 体中使用。以下示例舍入 lambda 将浮点数舍入到最近的整数：\n\n### `lambda`\n\n```cpp\n[](float x)\
  \ -> int{}\n```\n\n以下代码使用该函数对象将浮点值向量转换为整数值。在这种情况下不需要指定返回类型。\n\n### main.cpp\n\n\
  ```cpp\n#include <iostream>\n#include <array>\n#include <vector>\n// ... transformation\
  \ logic ...\n```\n\n## Recursive Lambda\n\n递归函数通常为算法提供了简洁高效的实现。因此，递归 lambda 是 lambda\
  \ 的一种有趣用法。lambda 必须先声明一个名称以便递归引用。以下代码展示了斐波那契函数 `fib`，它被定义并在 lambda 内部调用自己。\n\n###\
  \ main.cpp\n\n```cpp\nint main(){ \n  std::vector<int> v = {0,1,2,3,4,5};\n  std::vector<int>\
  \ y(v.size());\n  func_wrapper<int(int)> fib;\n  std::transform(v.begin(),v.end(),y.begin(),\
  \ fib=fib {\n    return (n <= 2)?1 : fib(n-1) + fib(n-2);\n  });\n  for(int i=0;\
  \ i<y.size(); ++i) std::cout << y[i];\n  return 0;\n}\n```\n\n递归调用 `fib` 通过以下维护函数对象共享指针的\
  \ `func_wrapper` 实现。\n\n```cpp\ntemplate <class T>\nclass func_wrapper\n{\n  std::shared_ptr<std::function<T>>\
  \ func;\n  func_wrapper *captured;\npublic:\n  func_wrapper()\n    : captured(nullptr)\n\
  \  {}\n\n  func_wrapper(const func_wrapper &) = default;\n  func_wrapper(func_wrapper\
  \ &&) = default;\n\n  // 非 const 拷贝构造函数\n  func_wrapper(func_wrapper & f)\n    :\
  \ func(f.func),\n      captured(nullptr)\n  {\n    f.captured = this;\n  }\n\n \
  \ template <class U>\n  const func_wrapper & operator = (U&& closure)\n  {\n   \
  \ func = std::make_shared<std::function<T>>();\n    if (captured)\n      captured->func\
  \ = func;\n    (*func) = std::forward<U>(closure);\n    return *this;\n  }\n\n \
  \ template <class... Args>\n  auto operator () (Args&&... args) const\n    -> decltype((*func)(std::forward<Args>(args)...))\n\
  \  {\n    return (*func)(std::forward<Args>(args)...);\n  }\n};\n```\n\n\n\n\n纯函数（无副作用的函数）在用相同参数调用时，总是返回相同的结果。将函数第一次调用的结果存储起来以备后后检索，可以实现通过之前传入的相同参数集获取缓存值。对于运行耗时较长的函数，这种缓存和检索可以节省运行时间。函数式编程中的这种技术被称为\
  \ `memoization`（记忆化）。可以使用 `hash_map` 实现一个能够存储和检索函数对象参数及结果的通用记忆化器。以下实现使用了附录中的哈希函数，在第一次使用一组参数时存储函数对象的参数和结果。之后，它将在名为\
  \ `cache` 的哈希表中查找由这些参数生成的结果。该缓存被设置为可变的，以便在期望函数为 `const` 的地方使用函数。\n\n### memoizer.hpp\n\
  \n```cpp\ntemplate<class Sig, class F,  template<class...> class Hash=std::hash>struct\
  \ memoizer;template<class R, class...Args,  class F, template<class...> class Hash>struct\
  \ memoizer<R(Args...), F, Hash> {  using base_type = F;private: F base;  mutable\
  \ std::unordered_map< std::tuple<std::decay_t<Args>...>, R, Hash<std::tuple<std::decay_t<Args>...>>>\
  \ cache;public:  template<class... Ts> R operator()(Ts&&... ts) const {  auto args\
  \ = std::make_tuple(ts...);  auto it = cache.find( args );  if (it != cache.end())\
  \  return it->second;  auto&& retval = base(std::forward<Ts>(ts)...); cache.emplace(\
  \ std::move(args), retval );  return  decltype(retval)(retval); }  template<class...\
  \ Ts> R operator()(Ts&&... ts) {  auto args = std::tie(ts...);  auto it = cache.find(\
  \ args );  if (it != cache.end())  return it->second;  auto&& retval = base(std::forward<Ts>(ts)...);\
  \ cache.emplace( std::move(args), retval );  return  decltype(retval)(retval); }\
  \ memoizer(memoizer const&)=default; memoizer(memoizer&&)=default; memoizer& operator=(memoizer\
  \ const&)=default; memoizer& operator=(memoizer&&)=default; memoizer() = delete;\
  \  template<typename L> memoizer( wrap, L&& f ): base( std::forward<L>(f) ) {}};template<class\
  \ Sig, class F> \n```\n\n```cpp\nmemoizer<Sig, std::decay_t<F>> memoize( F&& f )\n\
  ```\n\n```cpp\n{ return {wrap{}, std::forward<F>(f)}; }\n```\n\n### main.cpp\n\n\
  下面的 `main` 函数展示了如何配合函数对象（`sqrt_double_num`）使用记忆化器。\n\n```cpp\nclass sqrt_double_num{public:\
  \ double operator()(double x) const { // Long calculation for(int i=0;i<100000000;++i)\
  \ x = sqrt(x*x);  return x; }};int main(){  const auto f = memoize< double(double)>(sqrt_double_num());\
  \ std::cout << f(2.) << std::endl; std::cout << f(2.) << std::endl;  return 0;}\n\
  ```\n\n`memoize` 函数创建带有 `sqrt_double_num` 函数对象的记忆化对象。该函数缓存了 `f` 第一次调用的结果，第二次调用则在\
  \ `cache` 中查找结果。记忆化器不支持递归，但对记忆化器和函数对象进行微调即可修复此。\n\n### 递归记忆化器\n\n将 `auto&& retval\
  \ = base(std::forward<Ts>(ts)...);`\n改为 `auto&& retval = base(*this,std::forward<Ts>(ts)...);`\n\
  \n将记忆化器传递给函数对象，允许函数对象对记忆化器进行递归调用。`()` 运算符的签名要求将记忆化对象作为第一个参数传递给函数对象。调用记忆化器以检索使用不同参数调用函数对象的结果如下所示。\n\
  \n### main.cpp\n\n```cpp\nclass factorial{public: double operator()(  const memoizer<double(double),factorial>&\
  \ m, double x) const { // Long calculation  if(x==1) return 1;  return x*m(x-1);\
  \ }};int main(){  const auto f = memoize< double(double)>(factorial()); std::cout\
  \ << f(10.) << std::endl; std::cout << f(10.) << std::endl;  return 0;}\n```\n\n\
  # 懒求值\n\nC++ 的典型求值模式是急求值（eager evaluation），例如传递参数的函数会立即执行该函数。下面的示例在调用“急求”函数时，会同时计算偶数向量和奇数向量的和。\n\
  \n### main.cpp\n\n```cpp\n#include <iostream>\n#include <numeric>\n#include <vector>\n\
  enum numbers { EVEN, ODD };\ntemplate<typename T>\nint eager(numbers n, T even,\
  \ T odd){  if(n == EVEN) return even;  return odd;}int add(const std::vector<int>&\
  \ v){  return std::accumulate(v.begin(),v.end(),0);}int main(){ std::vector<int>\
  \ even = { 0,2,4,6,8 }; std::vector<int> odd = { 1,3,5,7,9 }; numbers n = EVEN;\
  \ std::cout << eager(n,add(even),add(odd)) << std::endl;  return 0;}\n```\n\n传递给\
  \ `async` 的函数的求值结果通过 future 的 `get` 函数进行访问。或者，C++11 的 `async` 支持在访问值时才延迟求值。\n\n\
  ### main.cpp\n\n```cpp\n#include <future>\n#include <iostream>\n#include <numeric>\n\
  #include <vector>\nenum numbers { EVEN, ODD };\ntemplate<typename T>\nint eager(numbers\
  \ n, T even, T odd){  if(n == EVEN) return even;  return odd;}int add(const std::vector<int>&\
  \ v){  return std::accumulate(v.begin(),v.end(),0);}int main(){ std::vector<int>\
  \ even = { 0,2,4,6,8 }; std::vector<int> odd = { 1,3,5,7,9 }; numbers n = EVEN;\
  \ std::cout << eager(n,add(even),add(odd)) << std::endl;  return 0;}\n```\n\n当第二次或多次访问\
  \ future 的值时，不会重新计算，而是使用记忆化返回。记忆化在上一节讨论过。\n\n上一个示例没有使用记忆化，可以通过下面的示例所示使用标准函数对象来实现。对象使用函数的参数构造，并在调用\
  \ `()` 运算符时对函数进行求值。\n\n### main.cpp\n\n```cpp\n#include <future>\n#include <iostream>\n\
  #include <numeric>\n#include <vector>\nenum numbers { EVEN, ODD };\ntemplate<typename\
  \ T,typename U>\nint lazy(numbers n, T even, U odd){  if(n == EVEN) return even();\
  \  return odd();}\nclass functor{public: functor(const std::vector<int>& v) : v_(v)\
