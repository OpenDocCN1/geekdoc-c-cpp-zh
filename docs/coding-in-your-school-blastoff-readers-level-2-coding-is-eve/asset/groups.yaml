    # Coding in Your School


    ![](img/dfb10eed46fb633bd6657052ec449221_7_0.png)


    tablets


    Where are the computers in your school? Do you have a media center? Do you use
    a tablet?


    # Computers are everywhere!


    ![](img/dfb10eed46fb633bd6657052ec449221_8_0.png)


    # How do computers work? They follow instructions called code.


    ![](img/dfb10eed46fb633bd6657052ec449221_9_0.png)


    Code directs everything on computers. People write code with special programming
    languages.


    In school, computers and web sites use code. Calculators use code, too.


    ![](img/dfb10eed46fb633bd6657052ec449221_10_0.png)


    # Even punching in your lunch number uses code!


    In the 1960s, computers took up a whole room. Code was written on paper cards.
    Some schools had these. Others had computer terminals.


    ![](img/dfb10eed46fb633bd6657052ec449221_12_0.png)


    # The History of Coding in Schools


    By the 1970s and 1980s, computers were smaller and more powerful. Many schools
    had computer labs. Students started to learn programming. Today, most schools
    have computers. Media centers have laptops or tablets. Teachers use smart boards.
    Students do research and homework.


    ![](img/dfb10eed46fb633bd6657052ec449221_13_0.png)


    # How Does Coding Work in Your School?


    Many classroom activities depend on coding. Code tells the computer where to send
    your online report. It creates the web sites that you use for biography. Code
    even helps you check out library books! Each book has a barcode. The code in the
    scanner reads these. It connects each barcode to the right book title.


    ![](img/dfb10eed46fb633bd6657052ec449221_14_0.png)


    # Check Out a Library Book


    look up book and get it from a shelf

    spell the title wrong, cannot find the book

    give librarian your library card

    forget library card, cannot check out

    scan book

    check out!


    ![](img/dfb10eed46fb633bd6657052ec449221_15_0.png)


    # New technologies make school easier for kids who learn in different ways.


    Code helps students practice reading, math, and more! What code can you create?


    ![](img/dfb10eed46fb633bd6657052ec449221_16_0.png)


    # Glossary


    biography-a history of a person''s life

    code-instructions for a computer

    programming-writing code for computers

    programming languages-special languages that humans use to talk to computers

    smart boards-interactive white boards that are computers

    tablet-a handheld computer with a touch screen instead of a keyboard

    technologies-tools created by using science

    terminals-machines with keyboards and monitors that connect to a larger computer
    somewhere else


