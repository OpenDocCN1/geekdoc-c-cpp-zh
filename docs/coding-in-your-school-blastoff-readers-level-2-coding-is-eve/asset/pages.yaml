- img_proc: true
  md: '# How Does Coding Work in Your School?


    ![](img/dfb10eed46fb633bd6657052ec449221_19_0.png)


    Many classroom activities depend on coding. Code tells the computer where to send
    your online homework.'
  merge: -1
  pgno: 19
