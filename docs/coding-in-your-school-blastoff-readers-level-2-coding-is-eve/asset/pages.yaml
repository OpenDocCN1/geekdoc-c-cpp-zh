  md: '# The History of Coding in Schools


    ![](img/dfb10eed46fb633bd6657052ec449221_13_0.png)


    In the 1960s, computers took up a whole room. Code was written on paper cards.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Some schools had these. Others had computer terminals.


    ![](img/dfb10eed46fb633bd6657052ec449221_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'By the 1970s and 1980s,

    computers were smaller

    and more powerful.


    ![](img/dfb10eed46fb633bd6657052ec449221_15_0.png)'
  merge: -1
