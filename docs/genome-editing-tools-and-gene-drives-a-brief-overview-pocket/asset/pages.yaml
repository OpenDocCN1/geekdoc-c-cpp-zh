    by environmental factors.


    **Polygenic** A polygenic trait is one whose phenotype is influenced by more than
    one gene.


    **Offspring** Offspring of animals or plants.


    **Prokaryote** Also known as an organism that lacks a nucleus and organelles to
    the absence of internal membranes. Bacteria are among the best-known prokaryotes.


    **Recombinant adeno-associated virus (rAAV)** Recombinant adeno-associated AAV
    that allows insertion, deletion, or substitution of DNA sequences into mammalian
    cells


    **Recombinant DNA technology** Recombinant DNA technology is the joining of DNA
    molecules from different species. The recombinant DNA molecule is inserted into
    a host to produce new genetic combinations that are of value to science, medicine,
    agriculture and industry.


    **Removability** The ability to completely remove a gene drive system from a population.


    **Repeat variable desirable** This is a highly repeated sequence 33–34 amino acid
    sequence with divergent 12 and 13 amino acids contained in the DNA binding domain.
    These have two positions, referred to as the repeat variable residue (RVD); They
    are highly variable and show strong consensus for specific nucleotide recognition.


    **Resistance** Alleles that are resistant preventing it from spreading. They can
    originate from mutations or errors in replication or DNA repair resulting or exist
    in a population to prevent the release of the gene drive.


    **Reversibility** The ability to replace an existing gene drive system with another
    system.


    **RGENs** They include CRISPR-RNA guided nucleases (RGENs) also programmable genome
    engineering tools developed from bacterial adaptive immunity.


    **Ribonucleic acid (RNA)** is an important biological molecule that is present
    in all biological cells. It is composed of ribose and phosphate groups. The base
    uracil is not found in DNA.


    **RNA-guided** Any engineered drive system that uses an RNA-guided endonuclease
    to bias its inheritance and increase in frequency in a population.


    **SaCas** SaCas9 is compact and can be packed in the payload-loaded-adeno-associated
    viral (AAV) vector that is commonly used for in vivo editing.


    **SDN** Site-directed technology produces a double-stranded break in the genome
    of a plant without the addition of foreign DNA. The template contains one or several
    small sequence changes in the genomic code that the repair mechanism copies into
    the plant''s genetic material, resulting in a mutation of the target gene.'
