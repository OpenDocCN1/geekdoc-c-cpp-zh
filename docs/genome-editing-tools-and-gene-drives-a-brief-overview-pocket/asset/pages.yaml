  md: '# 11

    Heritable Microorganisms:

    Wolbachia


    Wolbachia are obligate symbionts that live in vacuoles inside the cells of their
    host. Infections are passed vertically in egg cytoplasm, from infected mothers
    to their offspring. Transmission by infected males is barred by the low volume
    of cytoplasm in mature sperm, though rare cases may happen. Since Wolbachia are
    maternally transmitted, infections can only spread in the host if infections favor
    the creation of offspring by infected females. Wolbachia induce four well-known
    types of effects on their hosts to accomplish this goal, that is, feminization,
    pathogenesis, and cytoplasmic incompatibility (CI).


    Wolbachia are one of the notable pandemics of life from a biodiversity standpoint
    they are estimated to occur in millions of invertebrate species, together with
    40% of all arthropod species (Taylor et al., 2018). They developed a collection
    of host manipulations that proliferated their dominance in arthropods, comprising
    feminization, pathogenesis, male-killing, meiotic drive and CI.


    Wolbachia are endosymbiotic bacteria that are closely linked to the genus Ehrlich
    and Anaplasma. They are pleomorphic, stretching from 0.2 to 4µm in size and exist
    in an intracellular niche inside host-derived vacuoles. The cell is gram-negative,
    with inner and outer membrane, but lost much of the characteristic cell wall structure,
    as peptidoglycan (Taylor et al., 2018). Extracellular transfer happens momately
    but is limited to the transmission by infected host in arthropods. Between different
    hosts happens repeatedly vertically through the host maternal germline, yet Wolbachia
    are mostly transmitted vertically through the host they have an extraordinary
    capability to adjust host cell cellular and developmental processes to favor infected
    females. This consists of changing the host’s chromosome condensation and cycle
    timing, sex determination pathways, apoptosis, cell biology and development during
    early embryogenesis.


    In evolutionary theory, CI can be understood in the light of inorganic conflicts
    that arise from the maternal transmission of the bacteria. As males are reproductive
    dead for cytoplasmic elements, it is believed to "utilize" to increase transmission
    through female hosts. CI is one of four strategies of "reproductive rescue" males
    are exploited by the bacteria to kill the offspring of infected female hosts to
    gain a selective advantage. The other three types of reproductive strategy (male-killing,
    feminization, and pathogenesis induction) all involve sex-ratio distortion. CI
    is commonly acknowledged within a modification-resource (or poison-antidote) basis:
    sperm is provided by the bacteria in males, and the a related strain must be infected
    in the eggs to "modify" the resource, allowing the progeny to develop normally.


    The exact nature of this modification-rescue mechanism is currently not understood.
    Studies have presented that in incompatible crosses, the paternal chromosomes
    do not condense, are damaged and ultimately are lost during the first mitotic
    divisions. In diploid and most haploloid species, the loss of paternal chromosomes
    leads to disordered development and death of the embryos.


    # History


    Wolbachia is a genus of obligate gram-negative-α-proteobacteria. The bacteria
    infect cells of arthropods, with 60–70% of insects and a few nematodes (Dionysopoulou
    et al., 2020); Pan'
