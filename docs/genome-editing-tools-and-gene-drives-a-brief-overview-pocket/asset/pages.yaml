    # Versions


    There are two kinds of gene drives that commonly use the CRISPR platform. The
    first one is the modification drive, which is used to alter wild-type alleles.
    Modification of the genome is done in early zygote stage so that it can perpetuate
    to future generations. Modification drive may also lead to loss-of-function, affecting
    the behavior of an organism. The second kind is the suppression gene drive, which
    is used to reduce the population density or eradicate the organism. Gene drives
    can be deleterious to an organism and result in death, reduce fecundity, cause
    sterility (Borsenger et al., 2018, Del Amo et al., 2019; Nestor and Wilson, 2020).


    # Advantages


    Generally, CRISPR-Cas systems provide a uniquely powerful gene-editing tool that
    is readily adaptable to newly encountered genomes. Hence, there is no need for
    prior species-specific study. This has in the widespread use of CRISPR (Davidson
    et al., 2020); CRISPR is characterized by high on-target mutation (targeting efficiency),
    flexibility, less cost, simplicity, and high-efficiency multiplexing loci editing
    and is highly versatile for a variety of applications (Chen, 2019; Hajahmidi et
    al., 2019; Oberhofer et al., 2018).


    # Disadvantages


    CRISPR gene editing is known to have off-target effects that produce unintended
    negative effects. These off-target effects may arise from the gene-editing mechanism
    targeting a homologous sequence at a different location in the genome. The effects
    may lead to genetic diseases causing abnormality or even death (Borsenger et al.,
    2018; Jiang and Douina, 2017; Lin and Lu, 2019). There is also substantial risk
    with this invasive method. If there is a spontaneous change of the gene drive
    cassette, it may be difficult to control a rapid spread of the unintended mutation
    in the population which leads to disastrous ecosystems.


    There are also potential risks of synthetic or mutated gene drives invading unintended
    species or populations (Wedell et al., 2019). The HGE drive is sensitive to genomic
    variation. Species are usually characterized by sequence polymorphisms. This polymorphism
    may also arise from mutation and as a result of DSB repair through NHEJ, which
    is error-prone. Sequence variants are a source of resistance to homing and block
    the spread of HDR for population suppression (Oberhol et al., 2018).


    # Causes of Failure of CRISPR Gene Drives


    Failure of CRISPR-Cas9 gene technology could be a result of the following:


    +   1. Reduced fitness of laboratory-ready GM insects because of inbreeding (Frieß
    et al., 2019).

    2. DNA repair via HDR and MMEJ independent of HDR.

    3. On-target mis-insertions, sometimes gRNAs are inserted (Li et al., 2020).'
