    protein. Chicken ovomcoid, also known as Gal d1, is a known allergen. It is the
    protein most causing egg allergy. At least four epitopes have been identified.


    **PAM** The protospacer adjacent motif (PAM) is a DNA sequence (usually 2–6 base
