    # Concerns with Gene Drives


    There are concerns that population suppression gene drives might result in the
    population or species becoming extinct (Esvelt, 2019). Gene drives can change
    a population''s gene pool. Some genetic information will prevail within an entire
    population. Nontarget populations could be unintentionally affected or eradicated
    in cases where the genetic information affects a lethal factor (Eidenschafts et
    al., 2018).


    Additionally, the safety of the environment can be compromised when synthetic
    gene drives are unintentionally released into the environment (Rode et al., 2019).
    The results of releasing gene drives or using them to eliminate some species from
    the environment are unknown. Some organisms can become resistant to the gene drives.
    The organisms can cross national borders into territories where they might be
    illegal. This makes control difficult and disrupts their effects (Heitman et al.,
    2016). As a result, conflicts could erupt between neighboring jurisdictions. There
    are also concerns that risk assessment frameworks in place are inadequate. This
    puts wildlife and other life forms at high risk (Simon et al., 2018). This is
    especially because some gene drives can spread to all target species and be connected
    by the potential of the gene drive to become invasive (Esvelt, 2019). Another
    concern is the potential of the gene drive to affect nontarget species. This might
    happen where there is a possibility of interspecies reproduction. The hybridization
    of plant species that are closely related (Norwegian Biotechnology Advisory Board,
    2017). The effects of unsuccessful suppression gene drives can reduce genetic
    diversity in the population of the target species, affecting their fitness and
    their traits (Long et al., 2018). The gene drives and off-target effects are also
    concerning. Their effects are not predictable and there are biosecurity issues
    concerning the use of gene drives. Some people think they can be used to deliberately
    transmit harmful pathogens to humans and animals. They can also be used to damage
    food sources. Thus, there is a need for strict control and monitoring of applications
    of gene drives.


    # Regulatory Systems


    Gene drives are regulated as a way of controlling or governing them. This includes
    regulating their use, safety and spread (Lidcott, 2006). Some countries do not
    have sufficient regulations for gene drives and end up just treating them as any
    other technology. This is because synthetic gene drives (GMOs) are products of
    genetic modification and are therefore subject to GMD national and international
    regulations. However, regulations for gene drives should deal with the maximum
    implications and potential impacts of gene drives (Esvelt, 2019). The New Policy
    for Africa''s Development (NEPAD) agency was formed to promote the safe and effective
    use of agricultural innovations, including modern biotechnology. NEPAD then established
    the African Biosafety Network of Expertise (ABNE), and the African Biosafety Network
    of Expertise (ABNE) (Glover et al., 2018). ABNE helps African Union member states
