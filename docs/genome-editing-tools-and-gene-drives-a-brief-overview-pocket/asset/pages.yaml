  md: '# Genome Editing Tools and Gene Drives


    larger numbers of functionally validated gene-specific ZFNs become available,
    a gene knockout will become the standard for determining gene function.


    # Homology-Based Gene Editing


    HDR can be invoked by a ZFN induced DSB as alluded to earlier. Whether impromptu
    or prompted by the I-Scl endonuclease or a ZFN, a DSB is recombinogenic in cells
    of higher eukaryotes. Homology-based genome editing requires the endogenous repair
    DNA molecule along with the locus-specific ZFNs. This enables two related modes
    of genome editing that are a function of DNA design and the type of allele being
    generated.


    # Gene Correction (Allele Editing)


    This approach allows the transmission of single-nucleotide changes and short heterologous
    expands from an episomal donor to the chromosome, succeeding in a ZFN-induced
    DSB. The latest experiments support the view that the extrachosomal-investigator-provided
    donor as a template for repairing the DSB via the synthesis-dependent strand annealing
    process. This technique enables the study of gene function and or the modeling
    of disease-causing mutations through the creation of a point mutation that is
    characteristic, for example, of a known gene-predisposing allele or that possesses
    a motif that is thought to be crucial for function. Such mutations can be efficiently
    created at a specific position in the target gene.


    # Gene Addition in Human ES and i Cells


    The application of this method in human mesenchymal cells generated 50% targeted
    genome accumulation during selection. ZFNs delivered as plasmid DNA have been
    used in human ES and i cells to create a drug resistance marker to a precise gene
    and to generate novel allelic forms of three endogenous loci. In all of these
    studies, efficient, specific, and stable gene addition was achieved, and the cells
    retained characteristics of pluripotency.


    # Gene Addition in Plants


    ZFN-driven gene addition to native loci of late has also been accomplished in
    plants. This is a taxonomic group that has historically proven resistant to targeted
    modification. ZFNs or cell leaf protoplasts along with donor DNA co-delivered
    to tobacco cells carrying short homology arms and a herbicide resistance marker.
    According to Urnov et al. (2010), the correction of two loci in Zea mays (mouse).
    This report describes the editing of two loci, the transgene was transmitted to
    the next generation in normal Median fashion, and the segregation of the herbicide-resistant
    and low-phyto-content phenotype was observed. Sitespecific gene addition in a
    major crop species could be used for "trait stacking", an important goal that
    involves the creation of plants in which several independent traits are physically
    linked, ensuring their co-segregation throughout the breeding process (Urnov et
    al., 2010).


    ZFNs can be used to create gene functions/target validation. They can be used
    to create knockouts in multiple cell lines and completely knockout genes that
    are not amenable to RNAi. They can also be used in cell-based screening. They
    can also be used to create knock-in cell-lines that have the promoters, or fusion
    tags integrated into the endogenous genes. ZFNs can create cell lines that can
    produce higher yields of proteins or antibodies.


