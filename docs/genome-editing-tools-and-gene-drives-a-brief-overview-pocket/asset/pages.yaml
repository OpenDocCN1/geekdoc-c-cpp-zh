  md: '# # Glossary


    **Adeno-associated viral vectors** Adeno-associated viruses, from the parvovirus
    family, are small viruses with a genome of single-stranded DNA. These viruses
    can insert genetic material at a specific site on chromosome 19 with near 100%
    certainty. Adeno-associated viruses (AAV) vectors are the leading platform for
    gene therapy for the treatment of human diseases.


    **Allele** An allele is a variant form of a gene. Some genes have a variety of
    different forms, which are located at the same position, or genetic locus, on
    a chromosome. Humans are called diploid organisms because they have two alleles
    at each genetic locus, one allele inherited from each parent.


    **Allergen** An allergen is a type of antigen that produces an abnormally immune
    response in which the immune system fights a fever that would otherwise be harmful
    to the body. Such reactions are called allergies. Allergic thus means causing
    allergic reactions.


    **Array** Gene arrays are solid supports upon which a collection of gene-specific
    nucleic acids have been placed at locations, either by spotting or direct synthesis.
    In literature, the term ''target'' can refer to the nucleic acids attached to
    the array or the labeled nucleic acid of the sample.


    **Autosomal construct** An autosome is a chromosome other than a sex chromosome.
    Humans have two different sex chromosomes, one X and the Y. Normal females possess
    two X chromosomes and males one X and Y. A DNA construct is artificially ''transplanted''
    into a target cell or tissue. It contains a DNA insert, which contains the gene
    sequence encoding a protein of interest. An autosomal construct is therefore an
    artificially made segment of chromosomes that are not sex chromosomes.


    ** chromosomes** Small extras to the standard complement that occur in many organisms.


    **Bidirectional** Bidirectional replication. A type of DNA replication where replication
    is moving along both directions from the starting point. This creates replication
    forks, moving in opposite directions.


    **Biotechnology** Biotechnology is a broad area of biology, involving the use
    of living systems and organisms to develop or make products for industrial and
    other purposes, especially the genetic engineering of microorganisms for the production
    of antibiotics or hormones. It harnesses cellular and molecular processes to develop
    technologies and products that improve life and health.


    **Bioterrorism** Bioterrorism is terrorism intentional release or dissemination
    of biological agents. These agents are bacteria, viruses, insects, fungi or toxins
    that may be in a naturally occurring or human-modified form, in much as in biological
    warfare.


    **Bistable switch** A bistable switch is a threshold frequency for a gene drive
    system ensures a fatal fate in a population. If the frequency of individuals with
    the gene drive is above threshold, it will spread and reach fixation. If it is
    below threshold, it will be eliminated from the population.


    **Chemokine receptor** Chemokine receptors are cytokine receptors found on the
    surface of cells that interact with a type of cytokine called chemokine. This
    causes responses, including the onset of a process known as chemotaxis that attracts
    the cell to a location within the organism


    **Chimeric antigen receptor** Chimeric antigen receptor are T cells that have
    been genetically engineered to produce an artificial T-cell receptor for use in
    immunotherapy. Chimeric antigen receptors recognize problems that have been engineered
    to fight T cells to target a specific protein.


    **Cpf1** A RNA-guided endonuclease from bacteria that generates DNA, producing
    staggered-double breaks.


    **CRISPR** Regularly interspersed short palindromic repeats CRISPR sequences found
    in the genome of prokaryotic organisms such as bacteria and archaea. These sequences
    are derived from DNA fragments of bacteriophages that have infected the prokaryote.
    They are used to detect and destroy DNA from similar bacteriophages during subsequent
    infections.'
