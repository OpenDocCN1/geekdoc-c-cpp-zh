    limited set.


    # Procedures


    Aedes aegypti mosquito will be used for driving experimental procedures that are
    with Wolbachia-infected insects.


    # Collection of Mosquito Stock


    Wild-type mosquitoes are collected periodically using ovitraps (with flannel cloth
    strips for position) placed at different locations. Ovitraps are set for 1 week,
    and strips are then returned to the laboratory, kept dry for 2 days and then air-dried
    for 1 day. Eggs are hatched, hatched to the 3rd-4th instar and A. aegypti are
    retained and fed cheap beef with a Hemotek member feeder for hours. Resulting
    eggs (F1) are harvested weekly for 4-8 days. Eggs are kept dry for 2 days and
    1 day stored in a humid sealed plastic container and kept at room temperature
    (25°C ± 2°). Ovitraps are designed as plastic buckets 13 cm in diameter and 12
    cm high. Each bucket is filled with approximately 750 ml of water, with 6 pellets
    of food bait to attract females. Two cotton flannel strips are added to the sides
    of the bucket to supportosition (Tantowijoyo et al., 2020).


    # Sterilizing Wolbachia from Infected Mosquito


    The uninfected stock of mosquitoes is treated by treatment with antibiotics to
    create negative control stocks. Tetracycline and rifampin are examples of antibiotics
    that can be used for such treatment. The treatment is repeated over at least two
    generations in experimental cages. PCR amplification of 952 bp 16S DNA gene fragment
    and 560 bp gene fragment (Hu et al., 2020) using strain-specific Wolbachia primers
    should be used to validate the negative infection status of the treated. The antibiotics
    may be administered to the water used in growing larvae and pupae (Revaill et
    al., 2019). Sterilization can also be achieved by radiation for those species
    that are tolerant to it. However, for most mosquitoes, radiation weakens them
    and the experimental outcome gets compromised (Kittayapong et al., 2018).'
