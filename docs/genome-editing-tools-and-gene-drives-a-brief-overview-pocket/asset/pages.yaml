  md: '# Preface


    This book was motivated by the realization that genome editing and gene drives
    can be used to solve many problems befitting Africa and the world at large. Genome
    editing tools and gene drives are revolutionizing science. However, not many African
    scientists have written on them. Mandela''s words,


    Education is the great engine of personal development. It is through education
    that the daughter of a peasant can become a doctor, that the son of a miner can
    become the head of the mine, that a child of farm workers can become the president
    of a nation. It is what we make of what we have, not what we are, and that separates
    one person from another.


    Martin Luther Jr. also observed "It is not beyond our power to create a world
    in which all children have access to a good education. Those who do not believe
    this have imaginations" One good act by Oklahoma State University of giving books
    to take back to Africa at the end of the Mandela Washington Fellowship motivated
    the writing of this book. Accordingly, a team of African lecturers and students
    from various backgrounds and universities in Zimbabwe but experience in biotechnology
    were able to write this book. The goals are to motivate the adoption of genome
    editing and gene drives and the writing of biotechnology books by providing a
    clear structure that readers can identify with, that is easy to follow and is
    usable in teaching. Additionally, the book is intended to alleviate some fears
    associated with genome editing and gene drives by creating a more informed audience
    and shedding light on the processes. Consequently, the writing of this book commenced
    during the last quarter of 2019 right through 2021. The book talks about the genome
    editing tools, methods, TALENs, ZFNs and CRISPR. It discusses the principles behind
    their applications and consequences. It also covers the use of gene drives and
    gene drive systems. The book includes examples of the use of genome editing and
    gene drives in African settings. Provisions under the Creative Commons greatly
    aided the composition of this book were the only ones we could use in the absence
    of a budget for the book. Many initially selected images had to be removed from
    the book due to copyright issues. New cases of genome editing and gene drives
    are likely to come out in the near future. This book will help scientists understand
    genome editing and gene drives, make informed decisions and participate in the
    patenting race, realizing economic gains for self and helping humanity. The patenting
    being in favor of developed countries, such as many in Africa can easily take
    the lead due to large biodiversity. Through difficult deadlines and obstacles,
    the authors remained committed, and now their contribution to society through
    this book is out. This is part of our contribution to the development of Africa
    and the world based on the use of genome editing and gene drives."


    Mandela said this is part of our contribution to the development of Africa and
    the world based on the use of genome editing and gene drives.'
