  md: '# 12


    # CRISPR Gene Drives


    History The CRISPR (clustered regularly spaced palindromic repeats)-Cas (CRISPR-associated
    protein) system is a gene-editing tool that mimics an adaptive immunity in prokaryotes
    to defend against invasive genetic elements in genome (Davidson et al., 2020;
    Faure et al., 2019; Han and She, 2017). This bacterial immunity mechanism was
    revealed in the 1990s and 2000s during genome sequencing efforts of archaeal and
    bacterial genomes. Comparative genomics on bacteria showed that the system comprises
    foreign origin spacers, Cas proteins with conserved DNA binding and helicase/or
    nuclease domains. The findings were experimentally tested and revealed the system''s
    nature as providing an RNA-guided immunity. The immunity is gained upon exposure
    to invading genetic elements (Barrarang and Horvath, 2017; Ishino et al., 2018;
    Murugan et al., 2017).


    Peculiar CRISPR repeats were first identified in 1987 when Escherichia coli was
    sequenced for a gene coding for an alkaline phosphatase. The repeat sequence contained
    twenty-nine nucleotides of identical sequence that interrupted by thirty-nucleotide
    unique sequences, which was part of the 12 repeat loops clustered with the CRISPR-Cas
    system in E. coli, as shown in a paper published by Ishino, Han and She, 2017;
    Ishino et al., 2018). This study became the cornerstone on which other studies
    were built. Table 12 shows which results enhanced the understanding and use of
    CRISPR-Cas9 as gene editing tool. After the discovery of repeated repeats in 1993,
    various names were used for the phenomenon, multiple direct repeats (DR), short
    regularly spaced repeats (SRS), and large clusters of repeat (LTR). The name was
    coined by Jansen and Mojica in 2000 In study, the CRISPR-associated (Cas) genes
    were identified and it was found that four genes (Cas1–4) are located in clusters
    in the proximity of CRISPR loci (Han and She, 2017). Makarov et al. found out
    that genes code for nucleases and helicases. These proteins were named repeat-associated
    mysterious proteins (RAMPs). In 2006, more than 50 families of Cas proteins had
    been discovered to be part of the CRISPR system variants (Brandt and Bucking,
    2019; Barrarang and Horvath, 2017; Ishino et al., 2018; Murugan et al., 2017).


    Target Cells The CRISPR-Cas9 system is inherently present in 90% of archaea and
    40% of prokaryotic cells, where it provides immunity against previously encountered
    nucleotides (Davidson et al., 2020; Faure et al., 2019). However, it also works
    in the eukaryotic cell, provided the machinery and gRNA have been inserted into
    the cell. The CRISPR-Cas9 system is intrinsically adapted to prokaryotic cells
    that lack compartmentalization. Challenge with delivering CRISPR in eukaryotic
    cells is that the Cas9 enzyme cannot easily enter the nucleus past the nuclear
    membrane (Barrarang and Horvath, 2017). Cas9 cannot enter the eukaryotic cell
    if it remains in the cytoplasm. Adding Hg localization signal (NLS) gene to the
    Cas9-gRNA cassette facilitates its movement into the eukaryotic nucleus of Cas9
    protein to perform genome editing (Lin and Liu, 2019; Roggenkamp et al., 2018).


