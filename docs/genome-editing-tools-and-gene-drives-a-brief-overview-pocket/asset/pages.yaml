  md: 'et al., 2018; Sicard et al., 2019). The intratacheal endosymbion is the most
    common parasitic microbe is also the most common reproductive parasite in the
    biosphere (Caragata and Moreira, 2017; Kajnoch and Kotasková, 2018; Secheckck
    et al., 2019).


    The bacteria genus was first identified in 1924 through collaborative work between
    Marshall Hertig, an entomologist and Simeon Burt Wolbach, a pathologist, in their
    study of the common house mosquito *Culex pipiens* (Caragata and Moreira, 2017).
    The study was to be published later by Hertig in 1936 and described the species
    as Wolbachia patients.


    Marshall (1930) was first to notice that certain strains of the mosquito *Culex
    pipiens* were incompatible in one direction (that males from strain A and females
    from strain B), whereas the opposite direction (males x females) produced progeny.
    This was further investigated in the 1940s and 1950s. They early investigations
    showed that the incompatibility was inherited maternally, giving rise to the "cytoplasmic
    incompatibility" (CI). In addition to unidirectional CI, bidirectional CI was
    also observed. During the early 1970s, a link was drawn between CI and the intracellular
    $\alpha$-proteobacterium Wolbachia that had long been noted to infect C. pipiens
    (Beckmann, Shahre et al., 2019). Unidirectional CI occurs when infection is found
    in crosses infected individuals with different strains of CI. In bidirectional
    CI, both directions of cross are incompatible due to different strains of CI-inducing
    microorganisms. In some cases, offspring from incompatible crosses go through
    mortality at the early stages of their development. Unni- and bidirectional CI
    are illustrated in Figure 11.1.


    The two graphs in Figure 11.1 display success (tick marks) or failure (crosses)
    of progeny production between parents with different infection states. Blank symbols
    in the parent generation mean that these parents are unaffected, although the
    two shades of grey signify infection with two different strains of bacteria. With
    unidirectional CI, only crosses between infected males and unaffected females
    with different strains of CI-inducing bacteria are incompatible. Unidirectional
    CI is also detected between hosts infected with different strains of bacteria.


    The Wolbachia bacteria species are taxonomically classified within the domain
    Bacteria, phylum Proteobacteria, class Alphaproteobacteria, order Rickettsiales,
    family Anaplasmataceae, tribe Wolbachiae (Wolchost and Gerth, 2019; Leggewie et
    al., 2018; Taylor et al., 2018). The bacteria species are generally referred to
    by their genus without identifying species. They are found in nematode hosts (Bridgeman
    et al., 2018; Carvaj et al., 2019; Kajnoch and Kotasková, 2018). Wolbachia strains
    of each group are named after their host species (e.g., wP in *Culex pipiens*,
    wM in *Drosophila melanogaster*, wAlb in *Aedes albopictus*, wDi in *D. Similians*,
    wAn in *D. anomolata*, and wPan in *D. panda* (Chouin-Carneiro et al., 2020; Fraser
    et al., 2017; Zhang et al., 2016). If significant genetic polymorphism is revealed
    by studies then information, including sampling location or phylogenetic position,
    can be added to name the new strains to uniquely separate them (Sicard et al.,
    2019).


