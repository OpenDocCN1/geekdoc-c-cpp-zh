    # Transposable Elements


    Transposable elements (TES) are also referred to as transposons or jumping genes.
    Small DNA segments that can move from one part of the genome to another by excising
    themselves and randomly inserting into the genome. In the context of a gene drive,
    TESify an over-replication mechanism. Multiple copies of the same TE often amass
    in the genome (i.e., in copy number) due to DNA repair or gene replication mechanisms
    that operate in eukaryotic cells. Thus, the copy number of TEs typically exceeds
    what would be expected under Mendelian inheritance.


    In 1952, Barbara McClintock discovered TES, she observed that some DNA sequences
    might occasionally change their location in the genome and suggested these "controlling
    elements" could potentially turn on and off (McCLOCK, 1956). Since then, scientists
    have found that TES are ubiquitous across eukaryotes and constitute a major part
    of the genome (Wicker et al., 2007).


    The P-element transposon has been used to create genetically modified Drosophila
    in the laboratory (Rubin and Spain, 1982). Mister and Griggati (1993) first showed
    that a P-element transposon could rapidly spread a specific gene into an experimental
    Drosophila melanogaster population. Although P-elements are specific to Drosophila
    melanogaster, the piggyBac and TEs have been used for transformation in mosquitoes
    with varying degrees of success. One of the most prominent is the use of transposons
    linked to a genetic payload, which would increase the frequency of the transposable
    element and genetic payload in the genome. However, a gene drive has several disadvantages.
    This insertion into random locations, relatively low transforming frequency, loaded
    cargo gene size, and stability of the integrated sequence (Freaser, 2012). Smith
    and Atkinson (2011) also indicated that transposable elements often have transposition
    rates that are too low to be usable, unpredictable owing to lack of control over
    their integration sites, and have proven to be difficult to mitigate after integration.


    # Semele System


    The Semele system, conversely, is a single-locus system consisting of a toxin
    gene expressed in the males and a maternally delivered antidote that kills or
    reduces wild-type females and an antidote gene expressed in females that protects
