    ![](img/9ddf1817422063a3cd8adc0232e1e687_56_1.png)


    Figure 5.4 Mechanism of the CRISPR system in prokaryotes (Payne et al., 2018)


    +   (A) *Acquisition*: When a cell gets infected by a phage, a protospacer of
    the invading phage DNA is recognized by Cas1 and Cas2. The protospacer is cleaved
    and ligated to the leader end (proximal to the genes of Cas9) as a newly acquired
    spacer (diamond).


    +   (B) *Processing*: The CRISPR array is transcribed as a pre-crRNA and processed
    by Cas9 (assisted by Hasegawa and trans-activating RNA) into mature crRNAs.


    +   (C) *Interference*: Mature crRNAs associate with Cas9 proteins to perform
    interference mechanisms that are guided by sequence complementarity between the
    crRNAs and protospacers to cleave the DNA of phages whose spacers have been previously
    incorporated into the CRISPR array.


    +   (D) A truncated version of the CRISPR system on a low copy plasmid may lack
    Cas1 and Cas2 genes: It can be engineered to target the T7 phage chromosome to
    provide bacteria coli with immunity to the phage. The susceptible strain will
    still contain the plasmid, except the spacer will not target the T7 phage ribosome
    (Makarov et al., 2011).


    # Genome Editing Using CRISPR


    The requirements for CRISPR-Cas9 editing are: nuclease, gRNA, and template for
    HDR-based repair. In practice, active Cas9 complexes can be generated in the cell.


    The first step to achieving the desired mutation is designing the gRNA. Most importantly,
    the 20-nucleotide target of the gRNA must be adjacent to a PAM site, NGG-NGG in
    the case of SpCas9 (Doech et al., 2016; Hasegawa et al., 2016); therefore, one
    must identify the genomic region where the desired mutation is to be generated
    and select a 20-nucleotide target in the DNA that is adjacent to a PAM site. If
    sequences are not optimal, Cas9 may not bind and cut in a different place than
    intended, and this may result in background mutations that could confound experimental
    results. Optimal gRNAs have been designed, Cas9 and sgRNA can be introduced using
    three different strategies: the sgRNA or crRNA and tracRNA expressed as DNA, RNA,
    or RNA/protein complexes using a variety of methods. It can be introduced through
    microinjection in worms, fruit flies and zebrafish. Alternatively, it can be introduced
    through electroporation or transfection in mammalian cell culture (Hautleler et
    al., 2016; Keller, 2017). This is illustrated in Figure 5:5.'
