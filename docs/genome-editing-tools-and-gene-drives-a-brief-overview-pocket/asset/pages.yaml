  md: '# CRISPR Gene Drives 93


    removing a chromosome that determines sex, leading to all offspring male (Target-Malaria,
    2020).


    The Oxitec mosquito project in Brazil aims at suppressing the mosquito population
    using a "lethal" gene. The self-limiting gene is inserted into male Aedes aegypti
    mosquitoes using CRISPR. When the males are released, they mate with females to
    produce offspring that are heterozygous. As heterozygotes, the gene is expressed
    and self-regulates, since the tAV protein sets up a feedback loop by triggering
    overproduction of itself. The over-expression of this gene leads to overproduction
    of a protein at the expense of other essential cellular processes. As a result,
    the heterozygous mosquitoes cannot reach the stage that gives them a chance to
    reproduce. Tetracycline is added to the diet of the released male mosquitoes to
    block the regulatory activity of tAV protein; hence, they can survive and reproduce
    (Jones et al., 2019; Romeis et al., 2020).


    # Examples of How CRISPR Gene Drives Can Be Used


    # Construct


    Chamer et al. (2017) designed two CRISPR-Cas9-based gene drive constructs targeting
    the X-linked gene in D. melanogaster to reveal insights into mechanisms of resistance
    allele formation. Disruption of this gene causes a recessive phenotype, specified
    by a lack of dark pigment in adult flies.


    The first construct contains a Cas9 endonuclease driven by the nans promoter,
    with a gRNA targeting the coding sequence of the gene. In this case, they expect
    that may resistance alleles caused by a mutated target site should disrupt the
    gene (r2 resistance alleles), whereas resistance alleles that preserve the function
    of r1 resistance alleles occur frequently.


    Their second construct contains a gRNA targeting the promoter of the yellow gene
    and a copy of Cas9 driven by the Vasa promoter. In this situation, resistance
    alleles have to be primary of type r1. The precise insertion site of the promoter
    was selected to induce a yellow phenotype in the wings and body when interrupted
    by a large construct but to maintain male mating success, which is reduced when
    the coding site or downstream regions of the promoter are interrupted by a large
    construct.


    Both constructs also encode a dsRed protein, driven by a 3xP3 promoter, which
    produces a simple recognizable eye phenotype (R) that is dominant and permits
    us to identify the existence of drive alleles in individuals.'
