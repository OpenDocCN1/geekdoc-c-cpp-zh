  md: '# Versions


    The gene drives that are currently in development or have already been applied
    in suppressing-populations include meiotic devrives (autosomal- or Y-linked X-shredder),
    maternal-effect dominant embryo (Medea) systems, underdominance-based systems,
    homing endonuclease genes (HEG)-based systems, specifically CRISPR-Cas. Others,
    such as killer-race, are currently only theoretically explored (Friej et al.,
    2019; Hoffman et al., 2017; van de Vlugt et al., 2018).


    CRISPR gene drives have been widely proposed as a promising technology for pest
    control or even eradication (John and Kevin, 2020). This technology provides an
    ability to disperse engineered or altered genes throughout pest populations with
    much higher efficiency and prevalence than possible via normal genetic inheritance,
    even with genetic modifications that are deleterious for individuals and populations
    (McFarlane et al., 2018; Drunjetal, 2017).


    # A Synthetic CRISPR-Cas9 Gene Drive


    sgRNA is the guide RNA; Cas9 is an endonuclease that cuts the DNA and Cargo is
    the desired genetic material. When all three materials are present in the gene
    cassette, this ensures that each chromosome will have the desired cargo and will
    be inherited by the next generation, spreading the gene drive.


    # Construct


    CRISPR-Cas9 gene drives fall into the category of HEG drives, first proposed by
    Burt (2003). They consist of a genetic construct (driver allele) an endonuclease
    that can cleavage a genomic target site and insert itself into it. CG uses a Cas9
    endonuclease for cleavage can be engineered to target virtually any 20 bp-long
    nucleotide sequence in a genome, using a target-specific guide RNA (gRNA). The
    driver construct is flanked by two homology arms to facilitate its incorporation
    at the cleavage site using homology-directed repair (Ukless et al., 2017).


    # Applications


    The fact that gene drive can lead to the spread of fitness-reducing traits (including
    lethality and sterility) makes it an attractive process to consider exploiting
    developing methods to control disease vectors such as malaria-transmitting mosquitoes,
    ecosystem management and eradicating invasive species and agricultural pests (Burt
    and Crisanti, 2018; The Society, 2016; Steinbrecher et al., 2018). Suppression
    gene drives have been proposed to eliminate A. gambiae species in Africa (Teem
    et al., 2019).


    Considerable suppression of population numbers can be achieved within a few years
    of a female sterility gene drive; although the impact is likely to be heterogeneous
    in space and time, a driving endonuclease targeting female could lead to substantial
    reductions in malaria vector populations on a regional scale (Yiring et al., 2018;
    Marshall et al., 2017; Eckhoff et al., 2021). The transgene, such as the somatic
    expression of Cas9, and its insertion in sperm or eggs leading to damage to the
    zygote (Mercier et al., 2019; Godfrey et al., 2017). The suppression potential
    of a allele with high fitness costs can be enhanced by engineering where it can
    also bias male in the progeny of transgenic wasps (Beaghton et al., 2019; North
    et al., 2019; Eckhoff et al., 2017).


    Gene drives are also being considered as a way of controlling invasive species,
    including wasps in New Zealand (Eswelt and Generic, 2017). Vespula wasps are haploid,
    as any of the other insects listed in the list of 100 of the world''s most invasive
    insect species.'
