  md: '# Segregation and transmission distorters


    normal segregation in their own favor. Sex chromosomal distorters lead to biased
    sex ratios and the presence of such distorters may induce selection for a change
    in the mechanism of sex segregation.


    **Selfish genetic elements** Selfish genetic elements are segments that can enhance
    their own transmission at the expense of other genes in the genome, if this has
    no positive or a negative effect on organism fitness.


    **Self-limiting drive.** The drives that are limited in time and space. This occurs
    regardless of physical or ecological barriers or migration level.


    **Semele system** Semele consists of two components: a toxin in transgenic males
    that either kills or removes wild-type female recipients and an antidote in females
    that prevent them from the effects of the toxin.


    **Sequencing** is the process of determining the nucleic sequence characters For
    example—the order of nucleotides in DNA. It includes any method or technology
    used to determine the order of the four bases: adenine, guanine, cytosine and
    thymine.


    **Sex-linked meiosis** These are sex-ratio distorters. They function by biasing
    the driver of offspring. This can be such that the larger fraction of offspring
    is a particular gender for 90% males and 10% females.


    **Spermatozoa** The mobile male sex cell of an animal which is fertilized, having
    a compact head and flagella for swimming.


    **Stem cells** A stem cell is a cell with the unique ability to divide into specialized
    cells in the body. In the future, they may be used to replace cells and tissues
    that have been damaged or lost due to disease.


    **Sterile insect technique** A method used for temporarily suppressing populations,
    whereby overwhelming numbers of mass-sterile insects are released to mate with
    wild-type insects.


    **Supermajority** is a gene drive designed to reduce or eliminate the population
    of the target organism.


    **Switching off** Each cell expresses, or turns on, only a fraction of the it.
    The rest of the genes are repressed, or turned off. The process of making not
    to be expressed is called switching off.


    **TAL effector** TAL effectors are secreted by bacterial pathogens into plant
    cells, where they enter the nucleus and activate expression of individual genes.


    **TALENs** Transcription activator-like nucleases are enzymes that can be engineered
    to cut specific sequences of DNA. They are made by a TAL effector-binding domain
    to a DNA cleavage site.


    **T-complex** A T-complex protein 1 subunit is a protein that in humans is encoded
    by the TCP1 gene.


    **T-haplotype** A haplotype (haploid genotype) is a set of alleles in an organism
    that are inherited from a single parent. The T-haplotype is a male meiosis driver
    in the house mouse, Mus musculus.


    **Threshold-dependent drives** Threshold-dependent drives are which only spread
    when released in a population above a critical frequency. However, certain conditions
    in gene drive lead to divergent in spreading behavior.


    **tracrRNA** Trans-activating CRISPR RNA


    **Trait tracking** Gene tracking refers to the insertion of two or more transgenes
    of agricultural interest in the same plant. Trait tracking for genetically modified
    (GM) or biotech crops refers to the integration of multiple genetic modifications,
    or traits, in a variety of crop.


    **Trans-acting** Trans-acting (trans-regulatory'
