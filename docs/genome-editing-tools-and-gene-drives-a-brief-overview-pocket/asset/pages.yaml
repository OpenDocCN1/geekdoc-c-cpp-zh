  md: '# # 13

    The Killer-Rescue System


    # History


    Killer-rescue (K-R) systems were first identified in bacteria (Ogura and Hiraga,
    1983). The K-R system was first proposed by Gould et al. (2008), and it consists
    of two linked loci, one encoding a toxin (killer allele) and the other an antidote
    (rescue allele). This is a system of killing and rescuing that is used by the
    K-R to act antagonistically and bias their co-inheritance. The toxin and antidote
    could consist of miRNAs or a recoded gene or a toxic protein and toxin-inhibiting
    enzyme. A cargo gene can be fused to the antidote gene. K-R is a gene drive system.
    Self-limiting gene drives have been developed and include the daisy chain gene
    drive, one- or two-locus dominance and toxin antidote systems including Medea,
    CleaR and killer-rescue systems.


    The K-rescue gene drive, also known as K-R gene drive, is a gene drive system
    that does not drive toward non-Mendelian inheritance like Cas9-based. However,
    K-R drives through the mortality of individuals with specific alleles and results
    in population replacement. A killer-rescue system gene drive involves the genetically
    engineered containing genes on one chromosome with a lethal pathogen gene on separate
    segregating chromosome. These will be double homozygous for rescue and killer,
    meaning that all the offspring of the wild-type population will be double heterozygous
    for killer and rescue. Generations that will contain different combinations of
    killer and rescue will survive, but any insects that inherit only the killer will
    not survive to adulthood. Therefore, only insects contributing to the next generation
    are those that have inherited the rescue with the linked-pathogen.


    # Mechanism


    Homozygous carriers for both genes are mass-released into wild populations. Offspring
    the killer but not rescue will be viable. Since both alleles are not linked in
    their inheritance, the killer allele will be quickly selected from the population,
    while the rescue allele confers a fitness gain and increase in its prevalence.
    As soon as the killer allele completely disappears from the population, the rescue
    allele''s fitness will also disappear. As a consequence, the rescue allele will
    again decline in its prevalence, as the cargo gene confers a fitness. In the K-R
    system is highly dependent on the fitness of the rescue gene, which determines
    the time the cargo genes are eliminated from a population (Marshall et al., 2017).


    # Mechanism


    The K-rescue system utilizes the well-characterized Gal4/UAS binary expression
    system and the Gal4 inhibitor Gal80. Death is due to overexpression of Gal4, which
    is rescued by Gal4 activation of the Gal80 inhibitor in flies that have UAS-Gal4
    (K) and UAS-Gal80 (R) transgenes.


    A killer-rescue construct is placed in the pest genome containing a maternally
    deposited toxin, a zygotically expressed and an effector (the cargo). Female pests
    deposit a toxin into their entire progeny. However, those that inherit the Medea
    construct are protected by a neutralizing antidote in the early embryo. Wild-type
    progeny of Medea females are killed and therefore the viable offspring of Medea
    females will always contain the Medea element. The offspring of Medea males to
    wild-type females are unaffected because the toxin is not expressed in flies.
    If the killer-rescue constructs are introduced at a sufficiently high frequency
    in a population, they will replace the wild-type genotype and bring with them
    the effector.


    DOI: 10.1021/9781003156316-13


