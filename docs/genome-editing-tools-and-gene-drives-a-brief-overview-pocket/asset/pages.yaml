    conserved among bacteria and archaea (Jansen et al., 2002). The function of these
    loci was uncovered in 2005. The unique spacer sequences found in CRISPR arrays
    were found to be mapped to phage genomes (Bolotin et al., 2005; Pourcel et al.,
    2005). This proved that CRISPR is an adaptive immune response to phage infection
