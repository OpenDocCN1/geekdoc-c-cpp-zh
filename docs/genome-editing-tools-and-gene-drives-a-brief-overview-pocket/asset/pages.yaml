    a DSB. When Cas9 performs endonuclease activity at a targeted location in the
    genome, the cell machinery may repair the DSB in two ways:


    +   1. Nonhomologous end joining (NHEJ)

    2. Homology-directed repair (HDR)


    The NHEJ repair mechanism may lead to indels of nucleotides at the blunt ends
    of the DSB. Indels are a source of unintended mutations at the location targeted
    by gRNA in the genome, resulting in low efficiency of system. On the other hand,
    HDR uses a template with complementarity to the flanking regions of location targeted
    genome editing. The template details the sequence of nucleotides to be added to
    the DSB (Lin and Luo, 2019; Oberhof et al., 2018). The transgenes or orthogonal
    sequences can be added for other species (Friedel et al., 2019).


