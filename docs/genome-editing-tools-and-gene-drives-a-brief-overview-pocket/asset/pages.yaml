  md: '# 7


    # Gene Drives


    # Introduction


    In 1950, Hermann Muller received the Nobel Prize for radiation-induced genetic
    mutations, Edward Kiptling, an optimist, wrote to Hermann Muller. He was asking
    whether pests that become genetically sterilized when mutated by exposure to radiation
    could be used to eradicate destructive species. This steered the development of
    the sterile insect procedure, which was used to eradicate a major cattle pest
    from nearly all of North and Central America. This saved billions of US dollars
    and lessened the use of insecticides.


    Using this technique, hundreds of millions of irradiated insects were reared and
    released (Brossard et al., 2019). This method only worked on a few pests. This
    led researchers to reflect on how it could be developed to its reach. The strategy
    approached to developing a means by which genetically manipulated insects could
    spread genetic traits that spread over a population, although they conferred no
    value to the insect.


    Fast-forward to the era of genomics, and we seem to be on the verge of genetic
    methods that will allow us to spread pests that disrupt the capacity of pests
    to transmit pathogens or bias their sex ratio so that essentially all offspring
    are male. Naturally, a population with female elements is destined for extinction.
    There are naturally two constituents to these manipulations (Brossard et al.,
    2019). First, there must be a way to modify or delete a gene to change individual
    pest''s biology. Then there needs to be a technique to link it to a gene or genetic
    systems to drive it into the population (Fears and Meulen, 2018).


    Some genes persist and spread down generations and through a population (Idgenossenschaft
    et al., 2018). This is because they have a useful function for the organism. This
    includes reproduction and survival. They thus spread in the population by Darwinian
    selection. The genes are maintained by purifying selection in the face of recent
    mutation. Some genes persist by distorting their generation to generation transmission.
    They can be transmitted to more than 50% of the gametes of an individual. This
    can occur even though the individual has inherited the recessive gene from just
    one of the two parents (AAS, 2017).


    Gene transmission thereby increases the frequency between generations, giving
    the inheritance an advantage. Zygotic and genetic meiosis (HEGs), transposable
    elements, and B chromosomes are some of the gene or genetic elements that show
    distortion of the transmission rate or "drive" (Brid and Crisanti, Thompson, 2018;
