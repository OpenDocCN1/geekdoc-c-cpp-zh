    can only manifest in a homozygous state, the system must generate autocatalytic
    mutations to produce homozygous mutations. MCR mutations efficiently spread from
    their chromosome of origin to the homologous chromosome, converting heterozygous
    mutations to homozygosity in the vast majority of somatic and germ cells (Amo
    et al., 2019; Schaap, 2018; Unckless et al., 2017).


