    # Advantages of TALENS


    TALENS are precise, readily available, and easy to design. They have high-affinity
    rates of around 96% (Role et al., 2019). TALENS take a short time to design (about
    two days) and can be produced in large numbers, ranging in hundreds at a time.
    This creation of TALENS libraries easy (Bloom et al., 2015).


    TALE-based DNA-binding modules are more efficient than other gene-editing tools
    because they are specific and exhibit low off-target activity. TALENS are less
    cytotoxic and have a wide targeting range including small DNA sequences as sequences
    coding microRNA and enhancers, which may lack in target sites for ZFs or CRISPR-Cas
    (Bartlett and Root, 2015).


    # Disadvantages of TALENS


    TALENS are large, making them difficult to deliver to many different cell types
    (AAS, 2017). The cDNA encoding a TALEN is around 3 kb in size (Carter, 2016).
    This makes them less attractive for therapeutic applications in viral vectors
    such as AAV that have a cargo limit of 5 kb using viral vectors. The repetitive
    nature of TALENS impairs their ability to be packaged and delivered. Diversifying
    the TALE repeats coding sequences helps overcome this hurdle (Kruminis-Kasziel
    et al., 2018).


    TALENS are available, but they need experience to make the final TALENS efficient.
    Purchasing them is expensive, although they can be made in-house (Prowse et al.,
    2017; Congressional Research Service, 2018). However, TALENS can produce off-target
    mutations (Goold et al., 2018; Congressional Research Service, 2018; Pu et al.,
    2015).


    Due to undesirable off-target sites, various computational algorithms have been
    developed for identifying potential off-target sites spanning a wide range of
    approaches and techniques. The search parameters can be fixed by the user to work
    with any TAL effector or TAL architecture. These algorithms include TALE-NT, DIGITAL,
    E-TALEN, and TALENgetter. To reduce off-targets, approaches like Fok variants
    and nickases have been developed. The assembly cost of TALENS is very high and
    laborious making them unavailable to many. Additionally, multiplex editing of
    TALENS is very difficult (Gaj et al., 2013).'
