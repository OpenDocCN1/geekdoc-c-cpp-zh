  md: 'suppress the population by disrupting a gene and reducing the average fitness
    of the population (such as reducing the lifespan) was assayed.


    The agricultural pest D. suzuki is a well-known invasive fruit fly that has a
    negative economic impact on soft-bodied fruit production worldwide. The closely
    related species, D. melanogaster, was used to test the K-R system before transferring
    it into D. suzuki (Shiu et al., 2013). A-R system in D. suzuki could be used to
    drive a cargo gene such as one that carries susceptibility to a certain chemical,
    increases susceptibility to parasitism, or decreases the overall fitness of the
    population and slowly causes population suppression.


    # Pros and Cons


    The advantages of the K-R gene drive include:


    +   1. Communities’dwill initially feel more comfortable with initial field tests
    and applications.

    2. It is simpler to build.

    3. It is considered to have a lower risk than other gene drives.

    4. Gene drives have the potential to be permanent and long-lasting, compared to
    population suppression methods.

    5. These gene drive systems are economically feasible,

    6. The gene drive system is less time consuming and should be considered as a
    long-term solution in an integrated pest management (IPM) program.


    Disadvantages of this K-R gene drive system compared to Cas9-based gene drive
    include:


    +   1. It could take longer for the desirable gene to spread on a relevant timescale.

    2. The cost is higher as a higher engineered-to-wild-type ratio is required for
    the drive at an acceptable timescale.

    3. Lowered fitness of laboratory-ready GM insects due to inbreeding (colony effect).

    4. The selection against the fitness burden (resistance formation or toxin inactivation).

    5. Linkage loss between the rescue and cargo gene.

    6. The natural evolution of an antidote or inactivation of the killer allele.


    # Reversibility of the K-R Gene Drive System


    Gene drive systems are designed and expected to permanently spread through the
    target species population. These systems are often the most complex to build and
    deploy (Sinks and Gould, 2006). The K-R gene drive system can be self-limiting
    over time and space as the system drives through the suppression of the organisms
    that do not inherit the rescue and linked effect. This type of gene drive is also
    known as a self-limiting gene drive system. Rescue genes will be lost over time,
    if there are any fitness costs associated with the rescue or the release ratio
    is low (Gould et al., 2008). An example is where the overexpression of tetO-tTA
    in Diptera is lethal.


    # Comparison of K-R Gene Systems


    A comparison of the K-R systems is shown in Table 13.1.


    We encourage more research into genome editing and gene drive technology to ensure
    the safety and protection of our resources and environment. More advocacy and
    awareness activities should be conducted globally.'
