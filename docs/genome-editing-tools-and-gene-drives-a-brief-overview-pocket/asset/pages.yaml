    released into a wild population, the population size when released in large numbers.
    This happens because all of the wild females that mate with the Semele allele
    are susceptible to their toxic sex. If both males and females carrying the Semele
    allele are released, the system displays selfish dynamics with a threshold frequency
    of about 36% in the absence of fitness costs (Marshall, 2011).


    # Merea System


    The Medea system functions similarly to Medea, but the antidote to the maternal
    toxin is recessive.'
