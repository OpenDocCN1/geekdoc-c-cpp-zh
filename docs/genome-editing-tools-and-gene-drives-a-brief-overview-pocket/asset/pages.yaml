  md: '# Genome Editing Tools and Drives


    Wolbachia strains evolve in different hosts, resulting in CI systems that are
    bidirectional incompatible. Such evolutionary developments may be attributed to
    wPip from C. pipiens have two related operations. The second pair of paralogous
    genes named cinA (WPA0294) and cinB (WPA0295). Characteristics of CidB and Cib
    show that they are potentially homologous, cidB lacks the polynucleotide nuclease
    system (Beckmann et al., 2017).


    # Wolbachia Genes Inducing CI


    Cytological studies of mature C. pipiens cells show a toxin deposited in sperm
    by Wolbachia is behind. This hypothesis led to the discovery of a protein coded
    by the Wolbachia gene, WPA0282. The gene is part of a two-gene polycistronic operon,
    where the second gene was identified as WPA0283 for CI-inducing deubiquitinating
    enzyme (DUB). The two genes named cidA (wpA_028) and cidB (wpA_023). The function
    of cidA was suggested to be an antidote to rescue the viability of modified sperm
    from infected males, its expression during early oogenesis restores sperm viability.
    Further studies show cidB could also act as a toxin (Beckmann et al., 2017; Beckmann
    et al., 2019).


    # Mechanism of CI


    Although mechanisms are still vague, the molecular mechanism behind CI is modeled
    as a modification-rescue system wherein by sperm-mediated modification can be
    rescued in the egg by a Wolbachia-encoded factor. After fertilization, the nuclear
    envelope of the sperm breaks and exchanges proteins with maternal hormones. Protamines
    are basic proteins used to package DNA at high density in the spermatozoa. During
    the first zygotic mitosis, paternal and maternal nuclei condense at the same time,
    at metaphase and during anaphase. In cases of CI, the paternal chromosomes fail
    because of incomplete maternal histone deposition on paternal DNA. This results
    in abnormal segregation and bridging of paternal DNA at anaphase. This phenotype
    occurs during the first mitosis of CI.


    Toxicity place if cells can no longer silence the proteins because the antidote
    protein degrades more rapidly than the toxin, releasing active toxin. It is assumed
    that CidA and Cib proteins behave similarly. The toxicity of cidB may be attributed
    to its deubiquitinating and loss of function of histones C2 and H2, which are
    both essential for the formation of nucleosomes (Beckmann et al., 2017; Beckmann,
    Sharma et al., 2019).


    Two biochemical models have suggested: either (a) Wolbachia in the male produces
    a product that inhibits sperm processing in the egg (except rescue) or (b) bacteria
    in the male act as a "sink" to bind a product required for normal processing of
    sperm in the egg (Asselin et al., 2019). The biochemical models of CI continue
    to be undefined, and this is undoubtedly a area for research. Recent times, with
    the "sink" hypothesis, however chromatin-binding proteins (such as H1 histone-like
    protein) have been noted to bind to Wolbachia inside host cells. Wolbachia can
    now be kept in insect cells, which would enable biochemical and genetic studies.


    Cytogenetic mechanisms of CI have been linked to C. pipiens, D. simulans, and
    Nasonia vitripens. In all cases, CI is linked with early mitotic failures in the
    fertilized egg. In the parasitic wasp N. vitripens, it has been shown by a combination
    of cytogenetic and genetic studies that the paternal chromosomes form a diffuse
    mass in the first mitosis, fail to go through segregation, and lost in later divisions.
    Paternal genome loss results in the development of haploid (male) progeny in haploploid
    sex determination, whereas a comparable mechanism in diploid species would end
    in embryonic death.


    Fragmentation of the chromatin mass can also happen, with paternal chromatin segregating
    to some daughter nuclei. Paternal chromosomes with large terminal deletions survive'
