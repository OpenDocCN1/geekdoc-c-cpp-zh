    # Toxin-Antidote Based Drives


    In this mechanism, the toxin and antidote work together to achieve an inheritance
    skewing. Simply speaking, the gene is introduced as a toxin and antidote gene
    is made available as a counter-gene and acts as the antidote (Brandt and Bucking,
    2019). This antidote gene will, however, never be silenced by the mechanism in
    play. Alternatively, the construct can be designed such that a toxin protein''s
    effects are undone by an enzyme or RNA-based silencing mechanism. However, if
    such effects must occur, it can be remedied by the antidote, and if the antidote
    is absent, the organism will die. For this to be successful, the toxin and the
    antidote gene must be separated so that their inheritance is not obvious, or they
    can be separated using a time frame between expression and also developing a viability
    product. A gene of interest can be bound to the antidote ensuring its expression
    and inheritance, or simply drive.


    # Maternal-Dominant Embryonic Arrest (MEDEA)


    The engineered Medea systems behave as modification drives using an RNA interference
    (RNAI)-based toxin-antidote combination. As identified by Ward et al. (2011),
    the toxin consists of a microRNA (miRNA) that is expressed during ovulation in
    Medea-bearing, disrupting an embryonic state in all embryos, regardless of whether
    those embryos inherit a Medea or wild-type allele from the mother. A tightly linked
    antidote consisting of a recorded version of the target that is immune to the
    effect of the miRNA is expressed at the zygotic stage early in embryogenesis,
    only in embryos that inherit the Medea element. This results in 50% of the offspring
    originating from a Medea-bearing heterozygote female to inherit the Medea element
    perish. If the female is mated with a Medea heterozygous male, the male will also
    take effect in the embryo, resulting in 75% of the offspring surviving. Medea
    possesses a frequency-dependent fitness advantage compared to chromosomes making
    Medea, allowing it to rapidly drive a linked gene through a population, and it
    can be used for population suppression (Ward et al., 2011).


    Synthetic Medea consists of a miRNA that silences a maternal gene necessary for
    embryonic development (maternal toxin) linked to a zygotic antidote gene that
    rescues function, which has been inserted into the Drosophila genome using the
    P-element insertion (Akbari et al., 2014; Chen et al., 2007). They are predicted
    to spread from low frequencies (Ward et al., 2010), an encouragement for population
    replacement strategy. However, they raise the possibility that Medea-linked transfers
    spread into countries without their consent (Marshall, 2010). Consequently, there
    is interest in gene drives that are strong enough to bring about population replacement
    at an isolated release site, yet unable to establish in neighboring populations.
    A new gene drive system was proposed, Medea, which displays these properties.


    One major limiting factor that has impeded their drive is the lack of a basic
    understanding of how to achieve effective RNAi-mediated silencing in the germline
    of species other than D. melanogaster.


