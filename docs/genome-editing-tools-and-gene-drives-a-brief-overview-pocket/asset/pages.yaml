    # Applications of CRISPR Gene Drives


    CRISPR gene drives have been used for the eradication of vector-borne diseases
    in humans, crops, and livestock. Common diseases that have attracted scientists
    to research the use of CRISPR drives include malaria, dengue, chikaungunya, Zika,
    and many others. Significant research efforts have been channeled toward the eradication
    of malaria, a disease caused by a plasmodium parasite that thrives in Anopheles
    mosquitoes. Strategies for malaria eradication include a modification drive that
    spreads a malaria-resistance and suppression gene drive that causes sterility
    in female Anopheles that are homozygous for a recessive allele (Emerson et al.,
    2017; Hammond and Galizi, 2018).


    Gene drives are also used for population control of invasive species and livestock
    pests. This is achieved by population suppression drives. Drives seek to minimize
    the impact on these ecosystems where they exist. Examples of study that to eradicate
    invasive species include organisms such as mice, rats and rabbits. Loss-of-function
    gene drives have also been implemented as a strategy to reduce harmful invasive
    organisms (Emerson et al., 2017; Noble et al., 2017; Prowse et al., 2017). Gene
    drives have also been used to reduce the population size of agricultural pests.
    The CRISPR-based drive has been shown to reverse resistance of insect and weed
    by sensitizing pests to toxins (Neve, 2018).


    Special gene drives are also being designed to protect endangered species through
    modification so that they can resist disease to wipe out the entire population.
    An example is to protect frogs and other amphibians that are in dramatic decline
