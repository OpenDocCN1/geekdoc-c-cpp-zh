  md: '# 10 Maternal-Effect Dominant Embryonic Arrest (Medea) System


    Medea systems are selfish genetic elements that can bias their inheritance by
    selectively killing non-drive offspring using a toxin-antidote rescue system.
    They are single-construct designs, meaning all genetic elements are tightly linked
    and transfer as a unit. They were first discovered because of their spread through
    natural populations of the beetle Tribolium castaneum and the toxin-antidote system
    was eventually used to create the first synthetic drive system in the fly (Hamm
    and Galizzi, 2017; Buchman et al., 2018). It derives its name from Greek mythology,
    where Medea is said to have killed her children, although it is unknown if it
    was by accident or intent (Esvelt, 2019).


    In 2007, researchers from the California Institute of Technology genetically engineered
    the first drive system based on the principles of Medea in the model fly Drosophila
    melanogaster using miRNA, to the toxin to eliminate an embryonic embryo. The antidote
    modified with an altered sequence could not be spread by the microRNA (Hammond
    Galizzi, 2017; Burt and Crisanti, Esvelt, 2019).


    According to the models, Medea is regarded as a strong drive that could spread
    rapidly if it is released at high frequencies and the fitness cost is low. Laboratory
    experiments carried out with the spotted Drosophila (D. suzuki), an agricultural
    pest in soft fruit production in California, confirmed for high release frequencies.
    They also showed in long-term cage trials that resistance to the mRNA-based toxin
    being used is a concern (Min et al., 2018; Buchman et al., 2018).


    Since then, several strategies have been proposed to vary the arrangement and
    mechanism of killer-rescue components, as well as the fitness threshold predicted
    for drive population replacement or population suppression. The female makes a
    toxin during oogenesis that will lead to the death of embryos unless she has inherited
    a copy of the Medea element from the mother or father, as she also holds the antidote
    within the same (Backus and Delborne, 2019).


    There is a multitude of theoretical systems implied by such Medea principles,
    the closest of which are Medea, inverse Medea, and Semele; for modeling of engineered
    drives in order to see, whether gene drives would be invasive or suppression could
    lead to population collapse if payload genes would easily fixation in a population
    (Esvelt, 2019). The long-term dynamics of a threshold-dependent Medea drive in
    a twopopulation system are shown in Figure 10.1.


    The goal is to drive the Medea drive to fix in a population without spreading
    to a neighboring population. In Figure 10.1: (a) there are two populations, consisting
