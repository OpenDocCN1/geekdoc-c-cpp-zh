    # Over-Replicators


    Over-replicators shift orders in their favor by creating extra copies of themselves
    in the genome. They may be disruptors. They ensure an inheritance bias in their
    favor by creating extra copies of themselves in the genome. There are two members
    in this group, the transposable elements and HEGs.


    # HEGs (Homing Endonuclease Genes)


    These are genes coding for an endonuclease enzyme that can cleave DNA at specific
    sites, ideally below 40 base pairs, and successfully copy themselves in the middle
    of sequence through homology repair. This process is known as homing. This means
    that the homing gene becomes present within the recognition sequence that the
    endonuclease has to cleave. HEGs are present in many bacteria, fungi and plant
    cells. When the HEG is present in a single chromosome and absent in the homologous
    counterpart, the endonuclease detects the region site on chromosome and introduces
    a site-specific DSB, ensuring that the HEG is copied via a homology-directed mechanism.


    # Segregation and Transmission Distortors


    # Sex-Ratio Distortors


    Sex-ratio distortors are also known as sex-linked meiotic divisors. They function
    mainly by biasing the gender ratio in such a way that the larger fraction of offspring
    is inevitably a particular gender, for example 90% males and 10% females (Champer
    et al., 2016). They seem to have the spotlight in the development of synthetic
    genes. They are highly applicable in population control, where the increase in
    population size may be determined by how many males or females are present. Skewing
    the sex ratio by increasing the number of males reducing females can reduce population
    size. This is because males are incapable of carrying progeny on their own, and
    female offspring will be gradually declining with each generation. Eventually,
    that population will cease to exist. Such a drive may be introduced into the male
    chromosome or any other chromosome that is not sex-linked. The highest and fastest
    suppression rate can'
