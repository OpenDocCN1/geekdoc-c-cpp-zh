    # Applications of ZFNs


    The applications of genome editing involve the introduction of a site-specific
    DNA DSB into the locus of concern (Urnov et al., 2010). All eukaryotic cells efficiently
    repair DSBs via the homology-directed HDR also referred to as HR or nonhomologous
    joining (NHEJ) pathways. These highly conserved pathways can be capitalized to
    generate distinct genetic ends across an extensive range of cell types and species.
    NHEJ repair, for example, rapidly and efficiently ligates the two broken ends,
    with the occasional gain or loss of genetic material. It can then be used to insert
    small insertions and/or deletions at the sites of the break, an outcome that can
    be exploited to interrupt a target gene. Some of the applications of ZFNs are
    discussed in the following sections.


