    # Advances in Using ZFNs


    Due to its relative simplicity, ZFN-mediated gene disruption (achieved by transient
    delivery of the ZFNs alone) is the first ZFN-based method that has been taken
    to the clinic, specifically for the treatment of glblastoma (NCT01082926) and
    HIV76 (NCT00842634 and NCT01044654). In the first case, theocencer receptor is
    shown to be disrupted by ZFNs as part of a T-cell cancer immunotherapy (autologous
    cell therapy for the treatment of prostate cancer recently approved by the US
    Food and Drug Administration). The AIDS trials are based on the fact that HIV
    infection requires the co-receptor chemokine (C-C motif) receptor type 5 (CCR5)
    or chemokine receptor type 4 (CCR4). A naturally occurring mutation in the CCR5
    gene (CCR5A32) was shown to confer resistance to the virus without causing detectable
    pathophysiological effects beyond an increased susceptibility to Nile virus infection,
    and reducing blocking CCR5–HIV interaction is a validated drug target for small
    molecule inhibitors, small interfering RNA knockdown approaches, antibodies, and
    intrabodies (Urnov et al., 2010).


    # Advantages of ZFNs


    ZFN-stimulated gene targeting preserves temporal and tissue-specific gene expression
    beyond conventional. Gene knockout through NHEJ-mediated repair of ZFN-induced
    DSBs is another promising application of this technology. Gene disruption may
    also allow the treatment of hereditary disorders with dominant inheritance if
    the mutated allele can be disrupted by ZFN-induced DSBs (Cathen and Young, 2008).


    ZFNs achieve rapid disruption and integration of DNA sequences into any genomic
    loci. The mutations they make are permanent and can be heritable. They work in
    many different somatic cell types. The genome edits can be induced through one
    transfection experiment. They knock out or knock in cell lines in a short time
    of two months. The single or bi-allelic edits can occur in 1–20% of the clone
    population, and there is no need for antibiotic selection when screening transforms.


    # Disadvantages of ZFNs


    Off-target mutations are common when ZFNs are used. This modality may be somewhat
    unpredictable. ZFNs have complex requirements in designing and constructing them,
    resulting in high failure rate. High throughput screening.


    The other disadvantage is the necessity for co-delivery to the target cell of
    the donor DNA construct alongside with the ZFNs can often be restrictive and require
    optimization. The other issue is repaired pathway choice or competition, that
    is, the propensity of a cell to preferentially repair a ZFN-induced DSB by NHEJ
    rather than HDR, disabling the ligase gene in D. melanogaster (the product which
    is required for NHEJ) strongly prejudices the resolution of a ZFN-induced break
    in the direction of HDR (Urnov et al., 2010).'
