  md: '**Zinc-binding** The binding of zinc finger. It is found to be distinct from
    many DNA-binding proteins that bind DNA through the twofold symmetry of the double
    helix; instead, zinc fingers are linked linearly in tandem to bind nucleic acid
    sequences of varying lengths.


    **Zinc finger** A zinc finger is a small protein structural motif that is characterized
    by the coordination of one or more zinc ions (Zn2+) in order to stabilize the
    fold.


    **Zinc finger nucleases** These are synthetic proteins used for gene targeting.
    They consist of a DNA-cutting endonuclease domain fused to zinc finger domains
    engineered to bind a specific DNA sequence. ZFNs are used to introduce insertions
    or deletions at cut sites in the genomes of living cells.'
