  md: '# Infecting Experimental Mosquitoes with Wolbachia


    Wolbachia can be experimentally transferred between species by microinjection
    into eggs, for instance, from Aedes albopictus to Aedes aegypti (O''Neill et al.,
    2018).


    # Sexing


    Wolbachia-infected mosquito studies rely on the effectiveness of separating males
    and females. Many insect species are characterized by sexual dimorphism. In mosquitoes,
    female pupae are usually larger than their male counterparts. This trait can be
    efficiently used for sexing mosquitoes using mechanical means such as standard
    wires, the Fay-Morlan glass plate (Kitayakaop et al., 2018) and the McCray adjustable
    opening system. These tools have proved reliable in sexing Aedes aegypti, Aedes
    albopictus, and Culex quinquefasciatus. However, there is insignificant sexual
    dimorphism in Anopheles albimanus and Anopheles arabiensis; these sex separation
    tools are ineffective. For species with significant sexual dimorphism, male mosquitoes
    may be selected by the addition of toxicants to blood meal to eliminate females.
    Another method involves genetically modified mosquitoes with a sex-linked marker
    (Mashatola et al., 2016, Ross et al., 2019).


    # Harvesting Sperm


    Wolbachia CI- inducing factors in the spermatozoa. For experiments to analyze
    the nature of these proteins, sperm is conveniently harvested from the spermatheca
    of the female mosquito. The sperm may present in any one of two storage organs:
    the paired spermatheca or a single seminal receptacle. The spermatheca stores
    sperm in the female after mating and releases it to fertilize mature eggs. The
    insect is dissected and the reproductive organs are removed with the help of a
    microscope (Avanesyan et al., 2017).


    # Analysis of Limiting Factor


    The limiting factor in the sperm should be coded in the genome of Wolbachia and
    not the host. The protein should be separated and analyzed by either liquid chromatography,
    mass spectrometry, SDS-PAGE, or their combination. Further bioinformatics are
    carried out using protein sequence data by BLAST-related tools to identify homologous
    gene sequences in Wolbachia (Beckmann et al., 2017).


    # Applications


    The ability of Wolbachia to induce CI is pivotal in implementing the two major
    Wolbachia-based control strategies: to reduce the population size of Wolbachia
    host vectors or decrease population density in a locality by killing individuals
    and arresting reproduction processes and to change the population with undesirable
    characteristics such as spreading diseases by greatly reducing individuals. These
    two strategies are categorized in the following sections.


    # Sterile Insect Technique


    The first method, called the "incompatible insect technique" (IIT), is related
    to the classical sterile insect techniques (S) and aims decreasing population
    size by releasing Wolbachia infected males that are incompatible with local females.
    In this strategy, the local females produce viable embryos, resulting locally
    and temporally in the vector population crash-down (Beckmann, Sharma et al., 2019;
    Sicard et al., 2019).'
