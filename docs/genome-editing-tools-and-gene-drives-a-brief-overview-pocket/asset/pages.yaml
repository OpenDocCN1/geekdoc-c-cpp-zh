  md: 'Gene drive is this natural process and technology of genetic engineering that
    propagates a particular allele throughout a population by altering the probability
    that a specific allele will be transmitted to offspring (instead of the Mendelian
    50% probability). The term was initially coined to describe the process of stimulating
    biased inheritance of particular genes to alter populations. However, the term
    is now used to describe the synthetic genetic element designed to increase in
    frequency over time in a population, interchangeably with ''selfish genetic element''.


    Gene loci is this specific, fixed position on a chromosome where a particular
    gene or genetic marker is located.


    Gene promoter is a sequence of DNA to which proteins initiate transcription of
    DNA downstream of it. The gene promoter enhances expression of the sequences to
    which it is a promoter.


    Genome editing Also known as genome editing, or gene editing, this is a type of
    genetic engineering in which DNA is inserted, modified or replaced in the genome
    of a living organism.


    gRNAs (also known as gRNA, sgRNA) are the RNAs that guide the insertion or deletion
    of foreign DNA during genome editing.


    Guided nucleases are engineered nucleases to induce double-strand DNA break (DSB)
    at a specific locus of the gene of interest (GOI). DSBs are repaired by either
    nonhomologous end joining (NHEJ) or homologous recombination (HR).


    Heteromerization is the formation of a heteromer, which is a protein composed
    of two polypeptide chains differing in the order, number or kind of amino acid
    residues.


    Heterogam species containing different chromosomes between males and females.
    Humans are an example of a heterogam species; heterogamics are found only in males.


    Homing is the process by which an endonuclease cleaves a specific DNA target sequence
    and copies itself, "into this target." Homing utilizes the cell''s homology-directed
    repair (HDR) machinery.


    Homing efficiency is the rate at which a homing-driven gene successfully copies
    itself onto the opposite chromosome via homology-directed repair.


    H endonuclease occurs naturally when drive genes are composed of an endonuclease
    creating a freestanding strand within introns, with a fusion protein or a splice
    splint with the ability to enter the opposite chromosome, resulting in more than
    half of offspring inheriting the gene.


    Homology-directed repair is a mechanism in cells to repair double-strand DNA lesions.
    The most common form of HR is homologous recombination. The HDR mechanism can
    be used by the cell when there is a piece of DNA present in the nucleus, in G2
    and S phase of the cell cycle.


    Immunodeficiency Also known as immunocompromise, is a state in which the immune
    system''s ability to fight infection and other diseases may be compromised or
    entirely absent. Most cases are caused by "secondary" disease due to factors that
    affect the body''s immune system.


    I-Sel is a rare cutting double-strand break endonuclease in intron homing. It
    introduces a break in the DNA of the RNA gene and then induces the insertion of
    its own coding sequence into an intron gene. It specifically recognizes and cleaves
    the 5''-TGGAGATCAAAGT-3''.


    Killer-rescue system is a mechanism that uses genes for toxicity (killer) and
    a second that confers immunity to the toxic effects (rescue).


    Knock-in in molecular biology and biology, a knock-in (or knock-in) refers to
    a genetic engineering method that involves the one-for-one substitution of DNA
    sequence in a genetic locus or the insertion of a sequence not found within the
    locus.


    Knockout is a gene knockout, abbreviation: KO, a genetic technique in which one
    of an organism''s genes is made inoperative, "knocked out" of the organism. Knockout
    organisms, or knockouts, are used to study gene function, by investigating the
    effect of gene loss.


    Lab-grown Propagated in laboratory.'
