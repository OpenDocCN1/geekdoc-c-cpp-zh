  md: '# 9 Suppression Drives


    # ## Mechanism of Suppression Drives


    In suppression drives, a genetic modification that induces a decrease in population
    size is spread. To accomplish this, an altered allele is spread that is harmful
    to the organism (e.g., causes death or sterility) when two copies are available
    (homozygous recessive). By replication of the drive in the germline, each offspring
    remains a heterozygote and as a result is slightly affected by the genetic alteration.
    This allows genetic modification to spread rapidly through the population initially.
    Nevertheless, if the modification becomes more common, homozygous offspring will
    be produced and the population will crash.


    Suppression drives rely on the introduction of strongly or mildly deleterious
    mutations. They are introduced to reduce or eliminate a population. The introduced
    DNA can drive, reducing the average fitness of populations (Rode et al., 2019;
    Johnson, 2018; Sarkar, 2018). When combined with a threshold-independent drive,
    suppression drives can spread to a global scale and result in the eradication
    of an entire species. This may particularly become the case if the drive system
    itself has a intrinsic fitness cost and no resistance develops to the drive. A
    population suppression, gene drive can be designed to exert a considerable reproductive
    load on the population. It increases in frequency until females are produced,
    limiting reproduction (Harvey-Samuel, et al., 2019). Gene drives can be used to
    suppress vectored diseases through thereby depressing vector numbers, possibly
    to extinction, or suppressing the disease agent during its interaction with the
    vector (Bull, 2019). The effect of using gene drives in population suppression
    is shown in Figure 9.1.


    ![](img/9ddf1817422063a3cd8adc0232e1e687_87_0.png)


    Figure 9.1 An Illustration of population suppression by a suppression gene drive.
    Releasing sterile males in the population can cause transient or permanent population
    suppression.


    DOI: 10.1021/9781003165316-9


