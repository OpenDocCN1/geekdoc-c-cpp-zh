  md: '# 48 Genome Editing Tools and Gene Drives


    MegaTALS combine the easy-to-design DNA-binding domains of TALENs with the high
    cleavage efficiency of Meganuclease. The Meganuclease cause less toxicity compared
    to ZFNs and TALENs. ZFNs, TALENs, megaTALS, and CRISPR have programmable site-specific
    nucleotides. These can induce DSB, somewhat the NHEJ or the HDR repair pathways
    at the targeted genomic locus.


    TALENs can be designed to bind any target sequence as long as there is a thymine
    at the 5'' end of the targeted sequence. MegaTALs are unique in that their DNA-binding
    and cleavage activities are integrated. The DNA target in megaTALs can be viewed
    as two distinct half-sites that are directly connected through antipallel β-sheets
    belonging to each of the pseudo dimer.


    ZFNs, TALENs, and CRISPR are modular proteins. They interact with the major groove
    of the double helix structure of DNA to recognize specific base pairs. Unlike
    ZFN and TALEN platforms, the DNA cleavage site in megaTALs is directly integrated
    into the DNA-binding interface. Thus, they do not need to be appended to a separate
    DNA cleavage domain in order to be used for targeted DNA-break genome editing.


    # Nucleases


    ZFNs and TALENs use Fok as the nuclease, while CRISPR uses Cas proteins. MegaTALs
    use a combination of TAL effector proteins and Meganuclease. Meganucleases (hom
    endonucleases) are single peptide chains. They both DNA recognition and nuclease
    functions in the same domain. Transcription activator-like (TAL) effectors are
    DNA recognizing proteins. They are linked to separate endonuclease domains for
    them to achieve a targeted DNA DSB.


    # DNA Target Recognition


    The DNA target recognition of the nuclease platforms is governed by protein-DNA
    binding, except for CRISPR-Cas recognition, which is primarily mediated by Watson-Crick
    base pairing. DNA target recognition is governed by base-specific contacts at
    the interface of the enzyme and DNA. MegaTALs, ZFNs, and TALENs contacts are made
    by amino acid chains. CRISPR DNA recognition is accomplished through RNA to DNA
    base pairing in the guide sequence and base-specific amino acid contacts in the
    PAM region.


    # Recognition Site


    The recognition site for ZFNs is 9–10 bp per ZFN monomer and 18–36 bp per ZFN
    pair. In TALENs, it is 14–20 bp per TALEN pair. For CRISPR, the recognition site
    is 22 bp. That is a 20 bp guide sequence plus 2 bp PAM for Cas9 and up to 44 bp
    for double nick. The recognition site for meganases is 14–45 bp.


    # Specificity and Simplicity


    MegaTALs are highly specific although they are complex to reprogram for the recognition
    of novel DNA targets. However, they are characterized by a lower on-target cleavage
    efficiency compared to other genome editing tools. ZFNs, TALENs, and megaTALs
    tolerate small number mismatches. CRISPR is more susceptible to off-target mutations.
    TALENs are highly specific because their cleavage activity requires dimerization
    of a TAL pair before the Fok nuclease creates a DSB. However, CRISPR requires
    only one gRNA to make a DSB. CRISPR-Cas is the simplest of the genome editing
    tools. CRISPR, therefore, has a significant disadvantage relative to TALENs.


    TALEN DNA-binding domains have 33–35 amino acids each. Each of these contains
    two amino acids at fixed positions. This confers specificity for a single nucleotide.'
