  md: '# 1


    # # Genome Editing


    # ## History


    The interaction of the environment and the genotype of an organism determine its
    characteristics. A complete set of organisms genetic material is called its genome.
    The genome is composed of RNA and DNA (Ahmed et al., 2019). Microbes, animals,
    and plants also have either RNA or DNA or both as their genome. All the genetic
    information for the growth and development of the organism is contained in the
    genome (The Royal Society, 2016). A long time before the field of genetics was
    established, humans genetically modified plants through breeding and selection.
    Without knowledge of genes, mutagenesis, or gene editing, people influenced the
    genetic makeup of plants and animals by selecting for traits that are conducive
    to food production and killing those that had unfavorable traits (Wang et al.,
    1999).


    Genome editing tools are tools that can be used to edit the genome of an organism
    by manipulation of the specific gene to gain genetic modifications, deletions,
    or point mutations (Baker, 2012). Conventional methods that have been used to
    alter genes or genetic material have been largely based on the use of chemicals
    and radiation. imprecise changes to the genetic material are made using these
    methods, making it difficult to predict results from the methods. Recombinant
    DNA technology in the 1970s gave the ability to make more precise changes to genetic
    material by inserting or deleting genes. Nevertheless, the process was still relatively
    imprecise and quite inaccurate changes to the genetic material.


    In the old days, genetic studies relied on the discovery and analysis of spontaneous
    mutations. In the mid-twentieth century, Muller (Muller, 1927) and Auerbach (Auerbach,
    1947) demonstrated that the rate of mutagenesis could be achieved with radiation
    or chemical treatment. Later, methods that relied on transposons that could be
    inserted into some organisms were used, but procedures, like radiation and chemical
    mutagenesis, for example, produced changes at random spots in the genomes of organisms.
    The first targeted changes were produced in mice and plants (Smith et al., 1989)
    depending on the process of homologous recombination, which was relatively precise
