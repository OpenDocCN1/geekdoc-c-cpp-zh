  md: '# Glossary


    **Linkers** Also known as spacers, linkers are short amino acid sequences created
    in nature to separate domains in a single protein. Often, independent proteins
    may not exist as stable or structured proteins until they interact with their
    binding partner, following their stability and the essential structural elements.


    **Malnutrition** Lack of proper nutrition, caused by not having enough to eat,
    not eating enough of the right foods affects the local development that one does
