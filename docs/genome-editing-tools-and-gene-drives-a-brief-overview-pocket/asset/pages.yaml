  md: '# 52 Genome Editing Tools and Gene Drives


    Driving genes can spread although they do not have a useful function for organisms
    that carry them. Additionally, some driving genes can harm the organisms carrying
    them. These scenarios when the transmission distortion is greater than the effect
    of reduced survival and reproduction. Since the genetic elements are harsh selfish
    genetic elements or selfish genes that can be harmful to the organisms carrying
    them, the genes that can spread via natural selection. The selfish genetic elements
    are selected to avoid the spread of genes that supports parasites. In reality,
    at times, some features of selfish genetic elements are co-opted to perform a
    function useful for the host organism. This includes antibody diversification
    in vertebrates (Burtates), type switching in wasps, and female-maintainance in
    Drosophila (Burtet and Crisanti, 2018).


    # History and Principle Behind Gene Drives


    The utilization of gene drives in spreading genetic variants in a population was
    first conceptualized 50 years ago. To date, some technical difficulties are still
    being encountered in working systems based on these mechanisms (Norwegian Biotechnology
    Advisory Board, 2017). Consequently, selfish genetic elements inspired the development
    of synthetic genes. The natural genetic elements are found in some-cell organisms,
    and an example is homing endonuclease genes (HEGS) (Hamilton et al., 2016).


    Synthetic genes have wide applicability, although their development has been very
    modest in the past decades (Champer et al., 2016). The development of CRISPR,
    a genome editing tool, sparked more interest in gene drives (Spak, 2019; Norwegian
    Biotechnology Advisory Board, 2017). This is because CRISPR can be used to engineer
    gene drives with relative ease. Genetic drives had remained largely theoretical
    before the first research field-use CRISPR-Cas9 gene drives emerged in 2015. This
    work showed that using such tools to completely wipe out caged mosquitoes after
    between 7 and 11 generations provided more evidence of their capabilities.


    Gene drives have two classes of application, which have implications of different
    significance. These include:


    +   1. Introducing a genetic modification in laboratory populations. Once a gene
    drive has been produced, the gene can be passed to any other line by mating. The
    gene drive is used to achieve much more easily a task that could be accomplished
    with other techniques.

    2. Introducing a genetic modification in wild populations. Gene drives constitute
    a major development that makes possible previously unattainable changes.


    # Classifications of Gene Drives


    Gene drives can also be referred to as active elements (Grunwald et al., 2019).
    Drive mechanisms can be categorized into two main types, which attempt to achieve
    inheritance bias through:


    +   1. Over-replication of the genetic element, also referred to as a replication
    distorter.

    2. Preferential segregation or transmission of the genetic element, also referred
    to as a "transmission distorter".


    CRISPR makes use of both the over-replication and preferential segregation mechanisms.
    This makes it possible to come with tail-made drives for the distinct mode of
    action. However,'
