  md: '# Genome Editing and Gene Drives


    # Medusa System


    Medusa is a two-construct design within the toxin-antidote system. It is simply
    a theoretical intended for population suppression, in which a population crash
    might be kept to geographical limits (Marshall and Hay, 2014). Medusa is made
    up of four components, two toxins and the two respective antidotes. One toxin
    and the antidote to the first will be located on the X-chromosome; the second
    toxin with the antidote to the first will be located on the Y-chromosome. One
    without the presence of the other could not survive. This system will select for
    individuals with both the transgenic X and Y chromosome, selecting against females
    (XX), and if released at a sufficiently high frequency, could bring the population
    to collapse.


    # T-Complex or T-Haplotype


    The t-haplotype or t-complex is a meiotic drive and sex-ratio distorted on chromosome
    17 naturally occurs in mice. Its discovery goes back to 1927, when Nadine Dobrovskaia-Zavadskaya,
    evaluating X-ray experiments in mice, first thought this to be the gene for short
    tails or taillessness. However, further evaluations with crosses showed that “tailess
    mice produced only tailless litters upon intercrossing, but shorter-tailed normal-tailed
    pups. Inspection of the embryos from these crosses showed that about half of the
    embryos in utero (Hermann and Bauer, 2012).


    It was much later that it became evident that this region of chromosome 17 was
    what would be called a selfish genetic element, containing not only genes for
    transmission drive but also for male infertility and embryonic lethality. Mice
    that are homozygous for the t-complex will pass this on to nearly 90% of offspring
    (Lindholm et al., 2013). This lethality is based on a toxin-antidote system, where
    a toxin will be released in the cells during spermatogenesis, and only one will
    survive or be able to fertilize an egg that carries the gene for the antidote,
    which is located on the t-complex.


    This meiotic drive system is specific to mice. The idea here is to create “daughterless”
    mice by modifying the t-complex with a mouse gene called Sry24. This gene will
    act during embryo development and trigger the development of male characteristics
    irrespective of the actual gender of the mouse. Released into the wild, every
    offspring should have male characteristics, with no females to breed, to collapse
    the population.


    # Translocations


    Translocations result from the mutual exchange of chromosomal segments between
    nonhomologous chromosomes. Translocation heterozygotes are usually sterile, while
    translocation homozygotes are usually fertile. This is manifest during meiosis,
    when nearly half of the gametes from a translocation heterozygote have a duplication
    of one chromosome segment and a deficiency of one. The haploid genomes are functional,
    but when they fuse with native gametes for fertilization, the resulting zygotes
    are inviable. This produces the bistable dynamics described for under dominant
    systems.


    # Application of Gene Drives


    Gene drives can be applied in fields such as agriculture, ecosystem conservation,
    public health, and basic research. They can be used to control or alter organisms
    causing infectious diseases such as malaria, Chagas (American trypanosomiasis),
    and Lyme disease. Gene drives can also be used to control or eliminate disease
    vectors and other organisms that act as reservoirs of disease, such as rodents
    and bats (Heitman et al., 2016; Champer et al., 2016).


    In ecosystem conservation, gene drives can be used to control or alter disease-carrying
    organisms threatening other species'' survival. These include sickness necrosis
    and malaria vectors.'
