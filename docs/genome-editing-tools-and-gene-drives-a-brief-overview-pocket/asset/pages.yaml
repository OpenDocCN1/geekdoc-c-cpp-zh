  md: '# CRISPR Drives


    drive efficiency can be measured at different levels including sequence targeting,
    endonuclease fidelity, expression of the protein, and rate of spread in a population
    (Champer et al., 2017; Jiang and Doudna, 2017; Khan et al., 2018). In some cases,
    the rate of genetic modification in the population is very low. This may be explained
    by the reduced fitness of transgenesis by the metabolic cost related to the expression
    of the inserted Cas9 and gRNA (Nash et al., 2019).


    The resistance to CRISPR drives can be attributed to the high prevalence of the
    NHEJ repair mechanism over HDR (Unckless et al., 2017). With HDR, the Cas9-gRNA
    cassette is inserted into the genome, leading to successful genetic editing. However,
    NHEJ causes the two of DSB to be joined together and with high chances of leading
    to mutations at the locus. Such mutations prevent successful HDR of the RNP at
    the locus; hence, the spread of insertions limits this process. Cas9 drives catalyze
    themselves due to their susceptibility to NHEJ-induced mutations, a phenomenon
    also linked to drive "breaking". Populations are inherently characterized by a
    genetic variation that may lead to a reduction in the efficiency of CRISPR drives
    as the ribonucleoprotein complex fails to target the intended locus for editing
    (Champer et al., 2017; Parment et al., 2009; Unckless et al., 2017).


    # Specificity


    The platform can be used in different organisms with little modification, involving
    the design of a specific gRNA that matches the sequence in the genome. CRISPR
    has been experimentally proven to work in bacteria, fungi, vertebrates, and mammals,
    including humans. The specificity of each gene drive experiment is determined
    by the hybridization between the target sequence and gRNA, the system-specific
    PAM sequence (Chen, 2019; Jiang and Doudna, 2017). CRISPR is considered very specific
    in many different organisms.


    # Error Rate


    CRISPR is prone to off-target errors. This occurs in gene-editing endeavors as
    much as it may happen in gene drives. The CRISPR platform is prone to the NHEJ
    repair mechanism, with inherently high rates of mutations originating from indels
    (Jiang and Doudna, 2017; Li and Luo, 2023; Maaraj and Masod). Strategies to reduce
    CRISPR error rate include the use of double checkpoints for multiplex targeting
    of the locus; use of truncated gRNA with less than 20 nucleotides to destabilize
    binding at off-target sites; use of high fidelity Cas9 mutants such as SpCas9-HF1,
    eCas9, or HypcaCas; via bioinformatics tools to predict potential off-target activity
    where sequence homology is in the genome; use of paired Cas9 nicks with one of
    the cutting domains inactivated; and use of a dCas9-Fok nuclease (Chapman et al.,
    2017; Chen, 2019; Fieming et al., 2018; Hajhajimi et al., 2019).


    # Principle


    In bacteria, the CRISPR system consists of two elements:


    +   1. An array copying variable spacers that are primarily derived from foreign
    genetic elements separated by a palindrome that is repeated throughout the array,
    referred to as CRISPR drives.

    2. Operons of Cas genes that encode endonuclease and helicase properties.


    Transcription of CRISPR loci yields a long transcript referred as CRISPR RNA (pre-crRNA)
    that is processed into small crRNAs of the single spacer-repeat unit (crRNA) by
    RNase III, whereas expression of the Cas genes produces Cas proteins. Then, CRISPR
    and Cas proteins form ribonucleoprotein (RNP) complexes that achieve immunity
    by specifically recognizing genetic elements via sequence complementarity between
    the crRNA and its corresponding DNA sequence (protospacer) on genetic elements
    and targeting it for destruction. The protospacer region targeted by crRNA is
    usually flanked by a protospacer adjacent motif (PAM), usually composed of two
    to four nucleotides. The PAM sequence is for'
