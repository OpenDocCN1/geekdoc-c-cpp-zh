    the cells caused by intracellular parasites such as Wolbachia, which infect a
    wide range of species.


    Daisy gene drive A gene drive system consists of a series of genetic elements
    arranged such that each element drives the next in the chain. The final element
    in the chain, which carries the ''cargo,'' is driven to higher and higher frequencies
    in the population. The bottom element from the population ceases to drive, causing
    the next element to cease driving and be lost. This process continues along the
    chain until, eventually, the population returns to its wild-type state.


