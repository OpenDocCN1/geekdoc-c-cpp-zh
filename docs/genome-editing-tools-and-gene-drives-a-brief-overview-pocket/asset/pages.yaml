    Underdomin, also known as heterozygote inferiority, occurs when heterozygotes
    (or their progeny) lower lower fitness than homozygotes. Underdominant systems
    function as a bistable switch: when two confer equal effect in the homozygous
    state, the one with the lower frequency will be lost in a large interbreeding
    population, whereas the others will spread to fixation (Davis et al., 2001). This
    occurs because'
