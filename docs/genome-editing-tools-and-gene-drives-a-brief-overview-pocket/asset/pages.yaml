  md: '# # Zinc Finger Nucleases


    ### History of Zinc Finger Nucleases



    The capability to modify the complex human genome efficiently and with such adaptability
    remains the greatest breakthrough that transformed biology and revolutionized
    the gene therapy arena (Cathome and Jung, 2008). The main fundamental technology
    is based on the cellular homologous recombination (HR) pathway. According to Cathome
    and Jung (2008), this method is known as gene targeting. This pathway was invented
    to stimulate genetic recombination in the case of meiosis. It is also expedient
    in the repair process of DNA double-strand breaks before mitosis.


    ZFNS are defined by Rémy et al. (2010) as hybrid molecules composed of a designed
    polymeric zinc finger domain for a DNA target sequence and a Fok nuclei cleavage
    domain. Fok has a requirement for the dimerization to enucleate DNA. The binding
    of two homodimers to sequences in each DNA strand displaced by a six-pair base
    cleavage results in Fok dimerization and enhancing DNA cleavage (Rémy et al.,
    2010). ZFNS are the first generation of artificial restriction enzymes that were
    generated in vitro (Gantz, 2011; Greiner et al., 2017; Ran et al., 2018). In the
    1980s, the first ZFNS were identified (Caspar et al., 2017). They have been modified
    to fuse the heterod domain domain, which recognizes specific DNA. These ZFNS can
    be designed to induce a DSB into a preferred locus, and as a result, encourage
    targeting 100-10,000-fold by initiating cellular DNA repair pathways (Cathome
    and Jung, 2009). Transcription factor III (Tilla) from *Xenopus laevis* was the
    first ZFN. They are among the most abundant groups of proteins. They can interact
    with RNA, DNA, PAR (poly-ADPose), and thus have a very wide range of molecular
    functions (Cassandri et al., 2017).


    Urnov et al. (2010) others were adapted for beneficial genome engineering, an
    endonuclease must have precise recognition of target extended sequences with enough
    adaptability for retargeting user-defined sequences. The ZFN architecture is said
    to meet these specifications by joining the DNA-binding domain of a versatile
    class of eukaryotic transcription factors called zinc finger proteins (ZFPs) with
    the cleavage domain of the Fok restriction enzyme. The ZFN''s enable them to combine
    the favorable merits of both components of the DNA binding, specificity and the
    flexibility of ZFNs along with a class activity that is restricted in the case
    of a specific binding event, while maintaining modularity. As such, both the DNA
    and catalytic domains can be augmented in insertion, which simplifies retargeting
    and platform efforts.


    It was stated earlier that ZFNS are hybrid molecules composed of a polymeric zinc
    finger domain and a Fok nuclease domain. These domains determine the specificity
    of ZFNs. Two namely the patented platform developed by Sangamos Biosciences and
    the OPEN platform developed by the Zinc Finger Consortium (Ran et al., 2010).
    Both are now available for transgenic animal investigation purposes. Sangamos
    has partnered with Sigma to preassemble ZFNs using the Compozr program (www.compzfn.com/),
    where the OPEN platform developed (www.addgene.org/zfc; www.zincfingers.org/software-tools.html)
    makes their modular assembly zinc fingers and reagents readily accessible.


