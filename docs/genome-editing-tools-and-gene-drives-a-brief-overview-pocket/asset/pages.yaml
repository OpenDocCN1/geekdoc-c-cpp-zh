  md: 'inhibits embryogenesis in the fertilized egg, the female partner is infected
    with a similar Wolbachia strain to permit the sperm “rescue”. Unidirectional CI
    is most common and frequently happens between males with a single strain of Wolbachia
    and uninfected females. CI makes Wolbachia-infected males unable to reproduce
    with uninfected females or females infected with a different and incompatible
    Wolbachia strain (Beckmann, Bonneau et 2010; Kuttayapov et al., 2018; Shorpride
    and Bendenstein, 2019). On CI causes varying results depending upon whether the
    host is haploid or hapodiploid in diploid species, particular some CI occurs in
    hapodiploid species, theoretically, if all of the eggs mature into males, that
    is, male-development (MD) type CI. Then, in hapodiploid species may be categorized
    by the degree of embryos to become females, that is, female-mortality (FM) type
    CI. Both MD-type and FM-type CI produce male-based offspring. Nevertheless, they
    can be distinguished because the latter also results in fewer reproductive relative
    to the amount produced in compatible crosses. Whereas MD-type CI may most likely
    mirrors due to incomplete loss, initiating lethality (Beckmann et al., 2017).


    # Cytoplasmic Incompatibility


    CI in this form occurs when eggs are an outcome of fertilization between an uninfected
    female and male are rendered nonviable. However, Wolbachia-infected females lay
    viable eggs irrespective of the infection status of the male and transfer Wolbachia
    to their offspring (Mishra et al., 2018). CI is expressed as cytoplasmic lethality
    in crosses between infected males and uninfected females. This lethality is completely
    rescued by females infected with the same or similar Wolbachia strain (toxin-antotoxin
    system). It is also regarded as a form of conditional inheritance, where fertilization
    does not successfully result in embryo development when sperm from a Wolbachia-infected
    male fuses with eggs of a female that is not infected or one that is infected
    with a different and incompatible Wolbachia strain (Beckmann, Sharma et al., 2019;
    Chen et al., 2019).


    Two events lead to CI. These are modification of sperm by Wolbachia and rescue
    of the modified sperm upon fertilization. Following fertilization, the modified
    sperm successfully develops an embryo if the rescue factor is present in the egg,
    or embryogenesis will be unsuccessful if the egg lacks a rescue factor that is
    Wolbachia-specific (Beckmann et al., 2017; Fredrick et al., 2019). Studies have
    shown that this factor is absent in females but is found in the testes, spermatocytes,
    and spermatids. It is also shown that Wolbachia is required in spermatocytes and
    spermatids for modification of sperm. During maturation of spermatogenesis, the
    change happens so that they can easily swim through the removal of cytoplasm,
    development of tail and concentration of mitochondria. Each fetus from the cytoplasm
    containing Wolbachia squeezed into the process. This process ensures mature spermatozoa
    are free of Wolbachia.


    Since CI occurs in males with each successive fertilization of eggs, it means
    that Wolbachia stockpiles a limiting factor that induces CI in the male spermatozoa.
    The strength of CI, in this case, is evaluated by the percentage of embryos that
    become nonviable. With continued spermatogenesis, the limiting factor gets depleted.
    The strength of CI in males is proportional to the quantity of Wolbachia cysts
    in spermatocytes (Beckmann et al., 2017).


    # Unidirectional and Bidirectional CI


    When a modified sperm from an infected male fertilizes an uninfected female, CI
    manifests as unidirectional CI. However, with an infected female, the CI is bidirectional.
    Bidirectional incompatibility occurs when the Wolbachia strain in the male is
    incompatible with the strain in the female. This form of CI has revealed the mosquito
    species harbor a large diversity of cross-incompatible Wolbachia strains (Ant
    et al., 2020; Beckmann, Sharma et al., 2019; Moretti et al., 2018b).'
