  md: '# 4 MegaTALs


    # ### Introduction and History


    Meganucleases were discovered in the late 1980s. They are enzymes in the endonuclease
    family. Meganucleases are characterized by their capacity to recognize and cut
    large DNA sequences ranging from 14 to 40 base pairs, making them specific. They
    are found more commonly in microbial species. However, it is rare to find the
    exact meganuclease that is required to act on a chosen DNA sequence. Mutagenesis
    and high throughput screening methods are used to create meganuclease variants
    with the ability to recognize unique sequences. Various meganucleases can be fused
    to hybrid enzymes that recognize new sequences. A method known as rationally designed
    meganuclease can also be used to alter DNA-interacting amino acids of the meganuclease
    to design sequence-specific meganucleases. Computer models can be used to accurately
    predict the activity of modified meganucleases as well as the specificity of the
    recognized nucleic sequence (O2019).


    MegaTALs comprise a rare endonuclease platform that contains a TALE DNA-binding
    domain with a high endonuclease (HE) cleavage domain (Guha et al., 2017). They
    induce highly specific gene modifications. Incorporation of the DNA-binding domain
    from TAL effectors into nucleases producing “MegaTALs” results in a combination
    of the ease of engineering and high DNA-binding specificity of a TALE effector
    with the high cleavage of meganucleases. In addition, meganucleases have been
    fused to DNA end-ending enzymes to promote error-free NHEJ and to given loci (Takeuchi
    et al., 2014). Meganucleases are endonucleases naturally found in two forms, dimers
    or single-chain monomers, with five families of meganucleases, the family LAGLAD6
    being the best characterized and Porteous, 2019). They owe these to a conserved
    amino acid sequence. They contain the most specific, which include FceI of yeast
    *S. cerevisiae.*


    MegaTALs typically have an 18–22 TAL array anchored to the N terminus, making
    them2.5 kb per monomer. The relatively small size and monomeric structure of meganuclease-based
    platforms make them attractive as a delivery standpoint and afford them the ability
    to be packed into a variety of gene transfer vectors (Townson, 2017). Meganucleases
    have a large recognition site of double-stranded DNA sequences of 12 to 40 base
    pairs, and their recognition sequences generally occur once in the genome, making
    them rare. They are the 18-base pair sequence that is recognized by the I-Sce
    meganuclease, which would require a genome that is about 20 times the size of
    the human genome to be found once. However, that sequences that have a single
    mismatch can occur three times per human-sized genome and meganucleases are thus
    classified as the first class of nucleases that are sequence specific and which
    created targeted DS (Dabbossi et al., 2015).


    # ### Ease of Use


    Meganucleases can be used to target any plant or animal genome, which have not
    been used extensively in many organisms, including goats and sheep (Bevaqua et
    al., 2013; Wang et al., 2014). The low usage of meganucleases in genome engineering
    is attributed to complexities in engineering and protein design to direct them
    to new or novel DNA sequences (Petersen, 2017). In practice, meganucleases are
    easier to engineer because the DNA-binding and endonuclease activities have stalled
    compared other programmable nucleases (Townson, 2017). Less complicated editing
    tools that include TALENS, ZFNs, and CRISPR are at times preferred over meganucleases.
    Strategies have been developed to engineer meganucleases with new properties and
    DNAbinding specificities to their applications (Galetto et al., 2009).'
