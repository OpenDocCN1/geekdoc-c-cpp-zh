  md: 'Transgenic This means that one or more DNA sequences from other species have
    been introduced by artificial means. Transgenic plants can be made by introducing
    DNA into a variety of different tissues.


    **Translocations** Translocations generate novel chromosomes. In a translocation,
    a segment from one chromosome is transferred to a nonhomologous chromosome or
    to a new site on the same chromosome. Translocations places in new linkage relationships
    and generate chromosomes without normal pairing partners.


    **Transposable element** A transposable element (TE, jumping gene) is a DNA sequence
    that can change its position within a genome, sometimes creating or reversing
    mutations and altering the cell''s genetic identity and size. Transposition often
    results in disruption of the same genetic material.


    **Transposons** A class of genetic elements that can insert into different locations
    in a genome.


    **Undermominance** Unidirectional means in one direction. This is the opposite
    of dominance. It is the selection in the heterozygote, causing disruptive selection
    and divergent genotypes. Undermominance exists in situations where the heterozygote
    is inferior to either the dominant or recessive genotype.


    **Unidirectional** In unidirectional replication, growth proceeds along both strands
    in the same direction leading from one of the template strands, by the continuous
    synthesis of nucleotides of the complementary strand.


    **Viral genome** Viral genome means the genetic material of a virus. Viruses consist
    of DNA or RNA never both. DNA and RNA molecules can be double-stranded or single-stranded,
    linear or circular (composed of multiple particles of nucleotides). The main function
    of virus is to deliver its DNA or RNA into the host so that it can be expressed
    (translated and translated) by the host cell. Viral genome, often associated with
    proteins, is packaged inside a synthetic protein capsid.


    **Wild type** A strain, gene, or characteristic which prevails over individuals
    in natural conditions, differs from the mutant. Wild type refers to the phenotype
    of the typical form of a species as it occurs in nature. Originally, the wild
    type was conceptual as a product of the standard "mutant" allele at a locus, in
    contrast to that produced by a nonstandard,"mutant" allele.


    **Wolbachia** Wolbachia is a genus of intracellular bacteria that infect many
    insects, with a high proportion of insects and some nematodes. It is one of the
    most common parasites and is possibly the most reproductive parasite in the biosphere.


    **X chromosome** The X chromosome is one of two chromosomes. Males and females
    both have two X chromosomes, but females carry XX in theirs, while males carry
    X and Y chromosomes in theirs. All cells in an X chromosome, while sperm carry
    an X or a Y chromosome.


    **Xenografting** A tissue graft or organ transplant from a different species from
    the recipient. Xenotransplantation is the transplantation of living tissues or
    organs from one species to another


    **X-linked** X-linked recessive inheritance relates traits to genes on the X chromosome.
    A male with a mutation will be affected, because he carries only one chromosome.
    A female carrying a mutation in one gene, with a normal gene on the other chromosome,
    is unaffected.


    **Y-chromosome** Y is a normal chromosome in many species, since it is the presence
    or absence of Y that determine the male sex of offspring produced in sexual reproduction.
    In mammals, the Y chromosome carries the SRY gene, which triggers male development.


    **X-shredder** An X-Y heterozygous state, is a type of gene that cleaves the X
    chromosome at multiple places during meiosis in males, destroying it. Because
    of this, most or all of viable sperm carry Y resulting in biased ratios in favor
    of males and, over time, suppression of the population, owing lack of females.


    **Y-linked** These are traits whose inheritance is linked to the Y chromosome.
    Y-linked traits never occur in females and in all male descendants of an affected
    male. The concepts of dominant and recessive do not apply to Y-linked traits,
    as only one allele (the Y) is ever present in any one (male) individual.'
