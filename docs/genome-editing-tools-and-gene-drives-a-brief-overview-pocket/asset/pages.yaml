    CRISPR


    # History


    A clustered regularly interspersed short palindromic repeats (CRISPR) system was
    discovered in 1987 as a defense system in E. coli. It acts against viruses. The
    CRISPR system is found only in bacteria and archaea but not in eukaryotes and
    viruses (Jansen et al., 2002). The variations of CRISPR-associated proteins include
    Cas3, Cas6, Cas8, and Cas9 (Kruminis-Kaziskiel et al., Mudzwipasi et al., 2013;
    Sorek et al., 2007). CRISPR Cas9 is based on a bacterial Cas9 from Streptococcus
    pyogenes. Cas stands for CRISPR-associated system.


    CRISPR loci are short sequences of the viral or plasmid genomes that are integrated
    into the CRISPR locus of the bacterial or archaeal genome. They were first identified
    by scientists working in the fermentation industry, where prokaryotes were essential
    to the production of fermented products (Kinin et al., 2007). Through comparative
    genomic analysis of S. thermophilus (a microbe used in producing yogurt), scientists
    identified a highly variable in the genome of these bacteria (Sorek et al., 2013,
    Kinin et al., 2007, Zhang et al., 2013). This highly variable region has two features:
    that noncontiguous repeats are separated by variable sequences, and as researchers
    found out that the spacer sequences matched those found in bacteriophages (viruses
    that infect bacteria) (Mohanty et al., 2019). When the researchers compared phage
    sequence and sensitive S. thermophilus, the phage resistance matched that of bacteriophages
    (Hovarth and Barrangou, 2010). These sequences were discovered in 1980 and confirmed
    in 2007 by Barrangou and colleagues. They demonstrated that S. thermophilus could
    acquire resistance against a bacteriophage by integrating a genome fragment of
