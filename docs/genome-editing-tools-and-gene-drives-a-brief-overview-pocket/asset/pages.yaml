  md: 'Type systems associate with Cas proteins, forming a complex that recognizes
    DNA, triggering its degradation. Type II is the most commonly used system for
    engineering purposes, and they are defined by the Cas genes. These systems have
    been first classified into three subtypes, which are II-A systems, II-B systems,
    and II-C systems. Among these, type II-A and type II-C are the most abundant and
    common. Type II systems are characterized by the csn2 gene, while II-B systems
    have a Cas4 gene in place. Subtype III has a protein-coding gene. Type II systems
    process the crRNA through a trans-encoded crRNA that is complementary to the repeat
    sequence of the pre-crRNA, leading to cleavage by RNA-specific ribonuclease III
    in the presence of Cas9 (Deltachev et al., 2011).


    Type II systems rely on both crRNA and tracrRNA with Cas9 as a multifunctional
    protein to recognize and degrade foreign DNA. Type III is defined by the Cas10
    gene; its protein forms the largest subunit of the effector complex, and it contains
    the HD domain. Type III systems have been divided into type III-A, III-B, and
    III-D. Both III-A and III-B type target RNA and DNA. Type III systems require
    association with many Cas proteins. However, type III systems target foreign RNA,
    not foreign DNA. This enables bacteria and archaea to target RNA viruses. Type
    IV systems are found in some bacteria, l. ferox. Type V systems contain the cpl
    gene. This gene is homologous to Cas9 and has a RuvC-like domain, though it lacks
    the HNH domain.


    # Mechanism of the CRISPR System


    The CRISPR mechanism has three stages. The first stage is the acquisition (adaptation),
    where a direct DNA (foreign DNA) is incorporated into the bacterial genome at
    the CRISPR locus on the leaders'' side (Barrang et al., 2007). The integrated
    sequences function as a genetic memory and will help the cell quickly fight off
    a future infection by the same virus as before. DNA nuclease to PAM sequence (3
    prime of the crRNA complementary sequence) is 2-nucleotides left out of the invading
    DNA (Mali et al., 2013; Mojica et al., 2019). It is then incorporated into a CRISPR
    locus amid a series of repeats, approximately 20 base pairs (Linek et al., 2012).
    The second stage is the CRISPR biogenesis (expression). CRISPR loci are transcribed
    and processed into crRNA (Marafnin, 2015; Makovara et al., 2011). In the leader-flanking
    primary transcript of CRISPR loci are processed by Cas6, a noncoding primary transcript
    of the CRISPR loci (Brouns et al., 2008; Pol et al., 2010). The transcript is
    called p-CRISPR RNA (pre-crRNA)(Deltachev et al., 2011). With tracrRNA that is
    complementary to the pre-crRNA and with its repeat sequence cleaves the crRNA
    into mature crRNAs by the activity of endonuclease RNase III in the presence of
    Cas protein. The CRISPR guide recruits endonucleases to target DNA based on sequence
    complementarity (Shaky and Stern, 2014; Stern et al., 2015). The interference
    stage (maturation) is the final stage. The endonuclease complex with crRNA and
    tracrRNA targets foreign DNA containing 20 nucleotide crRNA complementary sequence
    that is adjacent to a PAM sequence. The cleavage process starts with the activation
    through base-pairing between crRNA and the DNA target repeat (Linek et al., 2012;
    Zouri et al., 2017). The DSB in the target DNA recruits the cell''s repair machinery.
    The protein is guided by crRNA to target DNA. In the absence of an adjacent PAM
    sequence the Cas protein may not cut the foreign DNA even though they are fully
    complementary to the crRNA (Makarova et al., 2018; Mali et al., 2013; Mojica et
    al., 2019).


    Cutting of foreign DNA is done by two domains on the Cas protein. These are RuvC
    and HNH domains. Mutations in these domains abolish the ability of Cas proteins
    to interfere with foreign DNA (Sapranaukas et al., 2011). The HNH domain cleaves
    the complementary three base pairs upstream of the PAM sequence of the invading
    nucleic acid. The RuvC domain cleaves the noncomplementary strand (Jinek et al.,
    2012).


    The CRISPR-Cas system provides immunity to phages in prokaryotes, and its main
    features can be described by three distinct stages as shown in Figure 5.4.'
