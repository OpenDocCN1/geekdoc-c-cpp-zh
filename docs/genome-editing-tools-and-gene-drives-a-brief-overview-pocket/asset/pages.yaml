  md: '# # 6 Comparison of ZFNs, TALENS, CRISPR, and MegaTALs


    This chapter compares the genome editing tools covered in this book, beginning
    with Figure 6.1 and Table 6.1.


    Figure 6.1 is a diagrammatic representation of the four genome editing tools and
    how they assemble to effect cutting of DNA.


    Table 6.1 shows a detailed comparison of the four genome editing tools.


    # ## Mechanism of Action


    During genome editing, both ZFNs and TALENS utilize a nuclease (Folk) to cut.
    Since the Fok cleave domain used in ZFNs and TALENS is activated via dimerization,
    ZFNs and TALENS require the construction and delivery of two protein halves. Each
    of the protein halves has a distinct DNA-binding domain that is fused to Fok,
    for a single target site. This architectural requirement limits the potential
    for ZFNs and TALENS delivery into their simultaneous (multiplexed) delivery of
    two or more molecules to modify one gene at a time (Edgell and Stellard, 2001).
    Unlike ZFNs and CRISPR-Cas systems can be multiplexed. This is achieved by adding
    multiple gRNAs to the same cell (Zhuyl et al., 2013). CRISPR-Cas system can be
    tweaked with activator and repressor domains to control expression rather than
    editing DNA. ZFNs, TALENS, and megaTALs are more expensive than CRISPR. Each zinc
    finger module binds with a nucleotide triplet. TALEN subunits interact with single
    base pairs.


    ![](img/9ddf1817422063a3cd8adc0232e1e687_65_0.png)


    Figure 6.1 Examples of the different genome-editing tools.


