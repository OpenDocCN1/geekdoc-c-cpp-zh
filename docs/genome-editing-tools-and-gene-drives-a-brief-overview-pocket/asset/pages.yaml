    # Practical Applications of Wolbachia


    Various projects have been deployed, including the World Mosquito Program (WMP),
    in various countries over the world, such as in Australia, Vietnam, Colombia,
    and Brazil, to take advantage of Wolbachia in combating vector-borne diseases
    through population modification and suppression (Carrington et al., 2017; Macias
    et al., 2017).


    Evidence suggests Wolbachia could be an effective means to limit transmission
    of the Zika virus, as the bacteria confer resistance in vectors. Some of such
    evidence has been gathered from Australia in the case of dengue and for Brazil
    (Caragata and Moreira, 2017). Verily announced a plan to release about 20 million
    Wolbachia-infected Aedes aegypti mosquitoes in California to combat the Zika virus.
    Release Wolbachia to suppress the urban Aedes aegypti population and fight dengue
    (Caputo et al., 2018; Caragata et al., 2019; Tan et al., 2017). MosquitoMate is
    another American project that has embraced Wolbachia to release infected males
    that exhibit CI with wild-type females (Macias et al., 2017).


    # Wolbachia Used to Prevent Disease


    Naturally strains of Wolbachia have been revealed to be means for vector control
    strategies because of their occurrence in arthropod populations, such as mosquitoes.
    Owing to the distinct traits of Wolbachia that cause CI, some strains are harmful
    to humans as a much of genetic diversity within an insect population. Wolbachia-infected
    females are capable of producing offspring with unaffected and infected males;
    yet infected females are only able to produce viable offspring with unaffected
    males. These infected females have a reproductive advantage that is superior to
    higher frequency of Wolbachia in population. Computational models indicate that
    introducing Wolbachia into populations will decrease pathogen transmission and
    overall disease problems. An example consists of a life-threatening Wolbachia
    strain used to prevent dengue and malaria by eradicating the older insects that
    have mastered. Encouraging the survival and reproduction of younger insects reduces
    selection for the evolution of resistance.


    Wolbachia has also been recognized to prevent the transmission of the chikungunya
    virus (CHIKV) in A. aegypti. The Wol strain of Wolbachia pipiens significantly
    reduced infection and spreading rates of CHIKV in mosquitoes that possess Wolbachia
    uncontrolled controls and a similar phenomenon was witnessed in fever virus infection,
    transforming this into an exceptional promise for YFV and CHIKV suppression.


    Wolbachia may induce reactive oxygen species-dependent activation of the Toll
    (gene family) pathway, which helps inhibit West Nile virus (WNV) replication in
    cell line Aa2 derived from A. aegypti cells. The mechanism is to some extent,
    as the bacteria in reality improves the production of viral RNA in the cell Wolbachia.
    Also, the outcome in intrathorically infected mosquitoes rests on the strain of
    Wolbachia and the replication of the virus in orally mosquitoes was entirely inhibited
    by the WMelPop strain.


    Wolbachia may induce the production of antimicrobial peptides, defensins and cecprins
    that help inhibit virus multiplication. Certainly, certain strains damage the
    pathway, leading to higher replication of viruses. One example is strain Wolbachia
    wAlbB in Culex saltarius, where infected mosquitoes essentially carried the West
    Nile virus (WNV) more. This is because wAlb obstructs REL1, an activator of the
    Toll immune pathway. Consequently, studies of the Wolbachia strain and ecological
    concerns must be done before releasing artificially infected mosquitoes in the
    environment.'
