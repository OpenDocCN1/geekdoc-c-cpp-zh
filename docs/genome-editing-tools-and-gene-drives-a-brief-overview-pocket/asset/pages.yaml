  md: 'Since the 1970s, many scientists have developed enough effort and time to use
    this group of bacteria. These studies have been motivated by the need to deal
    with vector transmission of diseases that affect human and animal health, its
    ubiquitous distribution, many different evolutionary interactions and its potential
    use as a biocontrol agent. Wolbachia species have been shown to manipulate many
    aspects of the biology of their hosts in different ways (Kodamaraiah, 2008; Ross
    et al., 2019; Sicard et al., 2019).


    # Target Cells


    The work of Hertig and Wolbach on Culex pipiens revealed granular bacterium in
    mosquito eggs, larvae and adults, with the greatest bacterial density observed
    in the gonads (Bi and Wang, 2019; Caragata and Moreira, 2017).


    Subsequent research has revealed that Wolbachia infect reproductive tissues, especially
    the ovaries, where the bacteria are ubiquitous in oocytes and near nurse cells.
    This is the basis of vertical transmission from mother to progeny through the
    cytoplasm of eggs (Caragata and Moreira, 2017; Flores and O''Neill, 2018; Sicard
    et al., 2019). In males, Wolbachia is found in the germline cells of testes, but
    spermatozoa lack Wolbachia (sey et al., 2018). Some of the vector insects which
    can be infected by Wolbachia include major mosquito species of Aedes, Anopheles,
    and Culex genus (Macier-Freitas et al., 2012; Moyes et al., 2019; Sicard et al.,
    2019). Other vectors that have been shown to have Wolbachia include biting flies,
    tsetse, blue flies and others. There is evidence of the presence of Wolbachia
    in somatic cells of different tissues in some insect species. Its presence has
    been attributed to causing effects on behavior and immunity against pathogens
    (Bi and Wang, 2019; Lei et al., 2020a; Pan et al., 2018).


    # Ease of Use


    The use of Wolbachia for sterile insect technique (SIT) and gene drives is firstly
    simple for producing transgenic vectors and nonviable populations. The SIT and
    gene drive strategies take advantage of CI to suppress or eliminate vector populations
    or replace them with ones showing reduced fitness or decreased vector competence
    without the use of complex genetic engineering and irradiation (Moretti et al.,
    2018).


    # Specificity


    While different insect species are naturally infected with strains of Wolbachia,
    other species are naturally uninfected. For Culex pipiens and Aedes albopictus,
    almost all species have Wolbachia; Anopheles and Aedes aegypti have generally
    been found to be uninfected (Sicard et al., 2019). Anopheles mosquitoes, the major
    vectors of Plasmodium, were considered to be exempt from Wolbachia because classic
    PCR testing were always never found. However, deep sequencing of Wolbachia-specific
    16S RNA suggested putative native infections of Anopheles coluzii and Anopheles
    gambiae in Burkina Faso. The Wolbachia 16S sequences were attributed to a new
    strain named “wonga” (Sicard et al., 2019).


    CI studies have shown that the artificial transmission of heterologous Wolbachia
    strains into different insect species still causes CI. The phenotypic consistency
    across species suggests that Wolbachia-induced CI targets conserved cellular machinery
    required for cell and nuclear division and is not specific (Caragata and Moreira,
    2017; Jeffery et al., 2018).


    # Error Rate and CI Efficiency


    The error rate and efficiency of Wolbachia gene drives depend on whether we always
    get the intended outcome of CI. In other words, the error rate is a measure of
    the predictability of the CI'
