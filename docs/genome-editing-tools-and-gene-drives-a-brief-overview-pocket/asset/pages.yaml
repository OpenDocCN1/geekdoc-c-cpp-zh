    This shows that there are two separate protein domains in Folk. One is for sequence-specific
    DNA recognition. The other is for endonuclease activity. A signal is sent to the
    endonuclease domain through allosteric interactions. This occurs after DNA-binding
    domain reaches the recognition site. The cleavage of DNA occurs oppositely. It
    is binding proteins with longer-DNA recognition sequences with the recognition
    domain to produce chromeric nucleases (Durai et al., 2005). The release of the
    endonuclease domain allows it to swing over the DNA cut. DNA cleavage occurs only
    when Folk is bound to its cognate site. This occurs only when magnesium ions (Mg2+)
    are present. The dimerization of the endonuclease domain is essential for Folk
