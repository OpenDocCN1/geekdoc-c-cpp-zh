    # Versions of CRISPR


    CRISPR systems can be classified into class 1 and class 2. Class 1 has three types,
    which are type I, III, and type IV, while class 2 has type II and type V. Class
    1 system is characterized by their use of a multi-subunit crRNA effector complex
    while the other hand, the class 2 systems use a single effector molecule (Hauerorth
    et al., 2010).


    There are three types CRISPR based on gene expression for Cas protein with Cas1
    and Cas3, Cas5 to and Cas10. The type II CRISPR nuclease has three components,
    Cas9, crRNA, and tRNA. This makes it useful for genome editing (Mohanty et al.,
    2019; Joudna and Charpentier, 2014). RNP is an RNA-guided endonuclease (ribonucleoprotein)
    that binds and cleaves DNA at sequences that bind to the crRNA of the Cas9 (Mohanty
    et al., 2019; Doudna and Jinek, 2017).


    Three variants of Cas9 have been adopted for genome editing. These include the
    wild-type Cas9. It can site-specifically cleave double-stranded DNA. Cas searches
    the invading DNA for sequences complementary to crRNA and then binds to sequences
    in the invading plasmid or genome as protospacer adjacent motifs or PAMs (Charpentier,
    2016; Crowther et al., 2020; Doudna and Jinek, 2017). Cas9 proteins from different
    species of bacteria or archaea recognize different PAM sites. S. pyogenes (SpCas9)
    recognizes a 5-NGG-3 PAM. It is the most commonly used for genome editing processes
    (Mohanty et al., 2019). Two critical residues in SpCas9, Arg1333, and Arg135,
    interact with the nucleobases of the PAM on the noncomplementary strand (Rodriguez,
    2017; Crowther et al., 2020). This interaction between the guan of PAM'
