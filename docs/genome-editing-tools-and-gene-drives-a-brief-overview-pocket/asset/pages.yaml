  md: 'When a Medea heterozygote mates with a wild-type male, half of the offspring
    will die and the other inherit the element, whereas she is homozygous, all of
    her offspring survive and inherit the element. Males can transmit the Medea element
    without any progeny selection. As such, the *Medea* element will increase its
    frequency relative to wild-type and drive through a population if it is seeded
    above a critical threshold. The reciprocal version, "inverse Medea," relies upon
    maternal destruction of the embryo followed by zygotic killing (Marsh & Hay, 2011).
    This is less likely to drive through a population and act to stabilize the heterozygous
    offspring of wild-type mothers. It has been proposed, with synthetic endonuclease
    (Gould et al., 2008), a gene drive used to be geographically limited suppression
    of wild vector populations, requiring a high release threshold to spread. Medea
    killer-rescue system is not suitable for suppression of a population because the
    load exerted on it will quickly dissipate the drive to fixation. Instead, these
    systems have been proposed as a mean to drive anti-pathogen effects through a
    population.


    To make an effective killer-rescue system, the Medea must be expressed in at least
    all of the same tissues as the killer and at the same stages of development. Further,
    the expression of the rescue needs to be at sufficiently high levels to negate
    the lethal effects of the killer. Other considerations influence the choice of
    gene promoters used to drive the killer and rescue genes.


    # Efficiency


    These systems have the potential to reduce the impact of human disease vectors
    or agricultural pests at the individual, community and global scale. However,
    systems pose challenges such as introgression into nontarget populations or movement
    across political borders.


    # Reliability of the Technology


    The reliability of the technology focuses on the probability of failure of the
    technology with regard to its intended use. Important reliability issues are linkage-loss
    of the cargo gene and its driver system. The generation of resistance in the target
    population, coevolution of a pathogen and system decay (Alpheus, 2014).


    # Development


    2007, Chen et al. demonstrated the first proof-of-principle Medea in which miRNA-mediated
    silencing of an essential deposited gene was toxic to embryos that did not express
    the rescue. Since then, two new elements have been generated along similar lines,
    targeting maternally deposited signaling pathways and rescue by embryonic expression
    of a source of the target gene (Akbari et al., 2014). As of yet, no reports have
    demonstrated K-R in the mosquito; a novel system has been proposed which may be
    simpler to execute—maternal deposition of CRISPR RNase targeting an embryo zygotic
    expression of a sequence variant, obviating the requirement for an understanding
    of signaling pathways (Champer et al., 2016). This has the added advantage that
    reversal constructs can be used to halt the gene drive.


    # Application


    The novel K-R gene drive system has been tested in Drosophila melanogaster. In
    this system, traits or genes that will either modify the pest population to get
    rid of its pestilent behaviors or'
