    # Target Prokaryotic Cells and Eukaryotic Cells


    The ZFN technique has been used to disrupt native loci in model organisms such
    as rats and Arabidopsis thaliana, to drive trait tracking in a crop species, to
    engineer HIV-resistant human T cells and hematopoietic stem cells (HSCs), and
    to target integration in ES cells, iP cells, and mesenchymal cells (Urnov et al.,
    2010). Chang and Young (2008) assert that Cys-ZFs have also been used to induce
    ancestral DNA-binding in eukaryotes.


    Also, ZFNs can be used to edit genomes of numerous cell types and organizations.
    They induce target-specific DSB in DNA. Zinc finger recognition is dependent on
    the DNA sequence and mechanisms of DNA repair. This includes NHEJ and HR, which
    are shared by all species (Carroll, 2011). NHEJ-mediated targeting using ZFNs
    have been reported in mammalian tissue culture cells and Arabidopsis. In Arabidopsis,
    it has been reported with a lower frequency. In somatic cells, the primary mechanism
    of DSB repair is NHEJ. The use of NHEJ for targeting expands the range of plants
    and tissues that are available for genome editing using ZFNs (Bonawitt et al.,
    2019).


    # Efficiency


    ZFNs have gone gene modification efficiencies of around 20% (Wang et al., 2017;
    Handel et al., 2009). These can be controlled using the DSB repair pathway. Repair
    following HDR is less active than NHEJ in the cell cycle. This makes genome correction
    and insertion more challenging. delivering a homologous donor DNA with ZFNs increases
    the rate of HDR at the target site. ZFN-donor combination has been used to improve
    the efficiency of gene modification using ZFNs in mammalian cells and disease
    treatment. Additionally, co-delivery of ZFNs with homology donor DNA enables user-designed
    gene editing following the HDR repair pathway.


    ZFNs can be used in clinical applications to achieve therapeutic effect. They
    are delivered to target cells. This can be done vivo or ex vivo. This has the
    potential to treat some diseases that affect multiple organ systems. The barriers
    for this therapy include poor choices of vectors for therapy, immune responses,
    and off-target mutations. During ex vivo therapy, target cells have to be removed
    from the body, modified with ZFNs, and transplanted into the host (Huang et al.,
    2018).


