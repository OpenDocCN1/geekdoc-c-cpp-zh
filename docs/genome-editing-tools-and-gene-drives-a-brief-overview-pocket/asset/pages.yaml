  pgno: 100
- img_proc: true
  md: '# Gene Drive


    The second method uses CI induction by Wolbachia not to reduce the density of
    a focal population but to sustainably replace its uninfected individuals by Wolbachia
    infected ones. Indeed, it has been shown that Wolbachia can interfere negatively
    with the transmission of disease pathogens, including the major arboviruses chikungunya,
    Rift Valley, West Nile, Zika, and so on. In this strategy, CI allows the progressive
    invasion of the local vector population with individuals harboring Wolbachia,
    which mediates the blocking of arboviruses transmission (Beckmann, Sharma et al.,
    2019; Sicard et al., 2019). CI can be used to spread desirable genes in the Wolbachia-infected
    strain by reducing the survival rate of individuals with deleterious genes that
    are in the wild-type host population (Macias et al., 2017).


    # Wolbachia Causing Disease


    Besides insects, Wolbachia infect a range of isopod species, spiders, mites and
    numerous species of filarial nematodes (a kind of parasitic worm), as well as
    those causing onchocerciasis (river blindness) and elephantiasis in dogs. Not
    only are these disease-causing filarial worms infected with Wolbachia but also
    appears to play an excessive role in these species. A huge part of the pathogenicity
    of filarial nematodes is owed to host immune reaction to Wolbachia. Eradication
    of Wolbachia from filarial nematodes usually results in either death or sterility
    of the nematode. As a result, current approaches for control of filarial nematode
    diseases consist of elimination of their symbiotic Wolbachia using the doxycycline
    antibiotic instead of directly killing the nematode with more toxic anthelmintic
    medications.


    # Advantages


    Knowledge of vector microbiota helps to develop vector control strategies to control
    insect pests and diseases by avoiding the use of polluting insecticides (Lei et
    al., 2020b; Mishra et al., 2018; Sicard et al., 2019). Wolbachia-driven CI provides
    an alternative in set populations that have developed pesticide resistance. The
    technology also provides organic, safe and less risky solutions to problems compared
    to the use of genetic engineering. Wolbachia gene drives have very little effect
    on ecosystems, as there is no release of any substance that might affect other
    unintended species. Wolbachia gene drives are fairly easy to design and implement,
    as they can rely on naturally infected hosts (Neve, 2018; Sicard et al., 2019).
    Wolbachia-mediated control initiatives require infected individuals to be released
    and spread at high frequency before genes can self-sustainably spread. This makes
    safe drive mechanisms to solving vector and pest population problems that are
    localized and may need to be reversed (Leftwich et al., 2018).


    # Disadvantages


    In some cases, Wolbachia enhance the development of diseases caused by its hosts.
    It has been shown that there is a significant contribution by Wolbachia to the
    pathogenicity of host filarial nematodes, as elimination of Wolbachia from the
    nematodes makes them sterile and may be fatal. However, control of filarial nematode
    diseases involves disruption of the symbiotic relationship by administering symbiotic
    antibiotics rather than medication that directly kills nematodes (Chegeni and
    Fakhar, 2019; Newton and Statko, 2020).


    Regardless of these issues, there are limitations of Wolbachia infections that
    may disturb their efficacy as disease control agents. The bulk of Wolbachia infections
    in A. aegypti decrease and these costs tend to be worsened in stressful environments
    such as when larvae are starved or confined in eggs. These costs have huge effects
    on invasion establishment. For instance, the wMelPop infection failed to persist
    in release zones in Australia'
