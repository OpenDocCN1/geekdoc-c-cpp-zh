  md: 'overlapping can also occur among the different mechanisms, as diverse as are.
    There are several gene drive classes, described in the following sections.


    # Standard Drive Systems


    Standard drives can spread to populations connected by gene flow. They affect
    large populations and cost less to deploy. They include transposons that duplicate
    themselves.


    # Local Drive Systems


    Local drives can spread through regional populations. However, they cannot spread
    to all populations that are connected by gene flow. Subtypes of local drives are
    the self-exhausting drives. Local drives are suitable where geographic and temporarily
    limited field tests are required. These can be for the determination of the ecological
    effects of more powerful drive systems. They include killer-rescue systems. These
    use independent toxin and antitoxin genes that are associated with the antitoxin.


    # Daisy Drive Systems


    Daisy drives separate components of an endonuclease drive system into daisy elements.
    These are arranged in a linear daisy or parallel drive field structure. They rely
    on progressive loss of the non-driving elements to limit the total spread of the
    cargo element.


    # Threshold Drive Systems


    Threshold drives cannot be used where there is a large wild population. However,
    they are well suited to small islands or subpopulations that have a minimal gene
    set. These can include chromosomal transmissions and Medea drives that are native
    to the Tribolium beetle.


    # Combination Drive Systems


    Combination drives include the daisy quorum system. The quorum system combines
    a self-exhausting drive with a threshold dependence. This makes it to efficiently
    alter a whole population without invading neighboring populations. Combination
    drives vary in their degree of reversibility. They also vary in their ability
    to maintain costly alterations and their capacity to suppress and alter populations.


    # Natural and Synthetic Gene Drives


    There are natural and synthetic gene drives. Natural gene drives occur naturally,
    while synthetic gene drives are created by genetic modification (Vlug et al.,
    2018). Natural gene drives are typically selfish genetic elements. They have a
    biased inheritance leading to their super-Mendelian inheritance. This gives them
    a higher chance of being passed to the offspring (Simon et al., 2018). This can
    be as high as 100%. Natural gene drives include transposable elements, meiotic
    drives, and horizontal endonuclease genes (HEGs). Synthetic gene drives typically
    influence target populations via alteration or population suppression. Population
    suppression drives reduce the total number of individuals in a population over
    generations following their introduction. The number of individuals can end up
    at zero. A population alteration gene drive alters some characteristics of a population
    following its introduction. The alteration can confer immunity or resistance to
    diseases or parasites. The current genome'
