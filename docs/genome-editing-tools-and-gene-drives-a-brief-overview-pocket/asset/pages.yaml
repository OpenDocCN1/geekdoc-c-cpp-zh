  md: 'and the arginines in SpCas9 positions the phosphate of the DNA backbone 5''
    to the PAM to interact with a phosphate-loop loop in Cas9 and facilitate DNA strand
    unwinding. If the DNA is complementary to the guide RNA, an RNA:DNA hybrid forms,
    called an R loop, and cleavage then follows (Lander, 2016; Gherardin, 2017; Horvath
    and Barrangou, 2010).


    DNA cleavage occurs, and it results from the activity of two different Cas9 domains.
    The HNH domain binds the DNA strand that is complementary to the crRNA, and the
    RuvC-like domain binds the strand that is not complementary to the crRNA. Cas9
    cleaves the DNA 3 base pairs upstream of the PAM, resulting in a blunt-end cleavage
    of DNA. If the DNA is deleted from the invading plasmid or virus, this results
    in the degradation of and subsequent protection against these invaders (Crowther
    et al., 2020).


    When DNA is cut, the cell repair mechanism is activated. The repair will proceed
    via the NHEJ pathway or the HDR (Gherardin, 2017). NHEJ can occur through canonical
    NHEJ (C-NHEJ), which ligates or elates the broken ends back together. NHEJ can
    result in indels, which can cause mutations (Martinez-Lage et al., 2018; Rodriguez,
    2017). Additionally, there is an alternative nonhomologous end joining pathway
    (alt-NHEJ), in which one strand of the DNA on either side of the break is rescued
    to repair the lesion. Both of these repair methods are error-prone, meaning ultimately
    the lesion is repaired with potential errors (Horvath and Barrangou, 2017; Martinez-Lage
    et al., 2018).


    Alternatively, the HDR pathway is used. The HDR pathway requires a piece of DNA
    that is homologous to the cut position with the DS be available (Mohanty et al.,
    2015; Frank and Chantier, 2016). The homologous DNA can be used as a template
    for the repair in the HDR pathway (Martinez-Lage et al., 2018; Rodriguez, 2017;
    Crowther et al., 2020). Typically before cell division, so the break can be repaired
    by the newly replicated sister chromatid without any mutations occurring. This
    form of repair can, however, be exploited to introduce precise edits by introducing
    a donor template for repair (Lemay et al., 2017; Malinois et al., 2015; Woo; Gherardin,
    2017). Furthermore, by making a cut at a specific locus and taking advantage of
    the cellular DNA repair pathways, there is the potential to generate targeted
    mutations and insert sequences of interest imperfectly, resulting in indels (Deborah
    et., 2018; Crowther et al., 2020). Pathways for genome editing using CRISPR-Cas9
