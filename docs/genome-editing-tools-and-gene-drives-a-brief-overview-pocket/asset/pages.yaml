  md: 'ZFNs, TALENS, CRISPR, and MetaTALs 49


    This is a one-to-one relationship between these guiding amino acid pairs and the
    four DNA bases. This makes the design of new TALENS simpler than ZFNs. MetaTALs
    have higher rates of specificity than other available nucleic platforms. This
    is due to large recognition sites, which make them useful in gene therapy, where
    minimal off-target cuts are acceptable.


    # Targeting Constraints


    In ZFNs, targeting a G-rich sequence is very difficult. TALENs require a 5'' targeted
    base to be preceded by a T for each TALEN monomer. They also require a 13–18 bp
    space between FOK1 reverse pairs. In CRISPR, target sequences must be preceded
    by a PAM sequence. Engineering used in metaTALs to target novel sequences usually
    results in low efficiency.


    # Ease of Engineering


    Engineering in ZFNs and metaTALs is difficult, with TALENS engineering being moderately
    complex (Carroll, 2017; Beumer et al., 2013). CRISPR is easy to engineer. The
    gRNA base is designed on complementarity with the target DNA. ZFNs assembled in
    arrays affect the specificity of neighboring ZFNs. This makes their design challenging
    (Marshall and Akbari, 2016). Their cloning varies; ZFNs require linking between
    finger motifs, while TALENs do not require links. Unlike TALENs, CRISPR, and metaTALs
    cannot be used for gene inhibition. TALENS, CRISPR, and ZFNs block transcription
    elongation by chromatin repression. TALENs are not used frequently because they
    have single-site targeting, nonspecific mutations, and low efficiency. HDR can
    also be implemented to repair DSBs. However, it requires a homologous DNA template.
    This mechanism (HDR) cannot be used to implement a gene knocking into nondividing
    cells.


    # Immunogenicity


    ZFNs have low immunogenicity because they are based on a human scaffold. However,
    Fl is derived from bacteria; it may be immunogenic. Immunogenicity in CRISPR,
    TALENS, and metaTALs is not well known.


    # Ease of Ex Vivo Delivery


    Ex vivo delivery of all genome editing tools is easy. It uses simple methods such
    as virus-mediated delivery and electroporation. gRNA used in CRISPR can be delivered
    to cells as a DNA expression vector, directly as an RNA molecule, and as a pre-loaded
    Cas9-RNA complex.


    # Ease of In Vivo Delivery


    In vivo delivery is easy in ZFNs and metaTALs due to the small size of expression
    cassettes. This allows them to be used in a variety of vectors. MetaTALs have
    an 8–12 bp TAL array that is appended to the N terminus. This makes ~2.5 kb per
    monomer. TALENs are the largest of genome editing tools, at ~3 kb/monomer (~6
    kb pair). Their highly repetitive sequences lead to unintended recombination events
    when they are packaged into lentiviral vectors. CRISPR is moderately easy. The
    large size packaging problems in viral vectors. The originally adapted CRISPR-Cas9
    from S. pyogenes is too large to fit into an AAV with a promoter and a gRNA. However,
    new Cas9 orthologs smaller in size have been discovered. These include the 3.2
    kb from Staphylococcus aureus (Sebastiano et al., 2011).'
