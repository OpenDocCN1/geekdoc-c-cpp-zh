  md: '# Applications of CRISPR


    CRISPR technology be used to target prokaryotic cells and eukaryotic cells. CRISPR
    can be utilized for gene editing in multiple organisms such as bacteria, yeast,
    plants, animals, and human cell lines (Lemay et al., 2017; Maloney et al., 2016;
    Woo et al., 2015; Cho et al., 2013). CRISPR systems can be used to investigate
    gene function, gene development, and the development and pathology of disease
    (Shao et al., 2016). The gene drive system can also be used to edit specific tissues
    such as the brain and liver tissues. CRISPR technology can be used to generate
    multiple genetic diseases (Li et al., 2013). CRISPR is gaining acceptance in CHO
    cell line engineering, synthetic biology, and gene engineering (Pennisi, 2013).
    It has many laboratory applications, including the rapid generation of animal
    models, live imaging of the cellular genome (Gherardin, 2016; Maloney et al.,
    2017; Lemay et al., 2017).


    This technology has a great potential to be used to cure animal diseases by disrupting
    causing genes, correcting mutations, or inserting new genes with protective functions
    (Rozov et al., 2019; Ray and Felix, 2015). CRISPR-Cas9 has the potential to treat
    genetic disorders by single-gene mutations. Examples of such cases include cystic
    fibrosis (CF), DMD, and hemoglobinopathies (Muziwafi et al., 2018; Gherardin,
    2016). CRISPR technology also has the potential to treat and cure diseases by
    editing the DNA associated with a particular disease before a baby is born (Foss
    et al., 2018; Pennisi, 2013; Rozov et al., 2019). CRISPR-Cas9 can be used to edit
    the genome of embryonic implantation and cells, such as eggs, sperm, and oocytes,
    used in vitro experimental settings (Wang and Yang, 2019; Ray and Felix, 2015;
    John et al., 2013). These improved technologies may provide solutions for the
    future of genetic diseases but only when consensus and a regulatory framework
    are in place for treating specific medical applications (Egli et al., 2018; Yusuf,
    2018). There is also interest in CRISPR-Cas9-mediated gene editing in pluripotent
    stem cells or somatic stem cells to treat various genetic disorders. Research
    shows that in the future such an approach could provide a source of cells for
    bone marrow transplantation to treat β-thalassemia and other similar genetic diseases
    (Foss et al., 2018; Pennisi, 2013; Lepore, 2017). CRISPR can also be used to treat
    poly diseases.


    Other potential applications of using CRISPR in humans include gene therapy, treating
    infectious diseases such as HIV, and autologous patient material to treat cancer
    and other diseases (Gherardin, 2016; Egli et al., 2018; Bryson et al., 2019).
    Any retrieval therapy provides an effective treatment for HIV, no cure currently
    exists due to the permanent integration of the virus into the host genome and
    its high mutation rates. The CRISPR-Cas9 system can be used to target HIV-1 genome
    and activate the virus (Lepore, 2017; Nelson et al., 2016). CRISPR can in HIV
    gene expression and replication in a variety of cells, without off-target effects
    (Mazzola et al., 2017). This is a potential advantage in overcoming the current
    problem of how to eliminate HIV from infected individuals. It may be possible
    to use gene therapies or transplantation of genetically edited bone marrow stem
    cells or pluripotent stem cells to eradicate HIV infection. During the second
    World Summit of Human Genome Editing, Jianku He performed the gene-editing procedure
    that led to the birth of two babies girls with genetic mutations. The researchers
    edited cells to prevent HIV infection in the babies. The father is an HIV carrier,
    and gene editing in embryos is completely necessary to prevent transmission to
    HIV (Wang and Yang, 2019). However, there is still debate, and more clarity is
    needed from these findings (Nelson et al., 2016; Lepore, 2017).


    It can be used to cure animal diseases by disrupting endogenous disease-causing
    genes, correcting or inserting new genes with protective functions. CRISPR can
    be used to spread synthetic alleles that inhibit female reproduction in unwanted
    populations, invasive species, and disease-carrying organisms. Synthetic alleles
    that prevent insects from migrating pathogens can be caused, thereby reducing
    vector-borne diseases (Yusuf, 2018; Foss et al., 2018; Pennisi, 2013). Editing
    systems such as CRISPR-Cas9 can carry genes with to immunize an endangered species
    against diseases and protect it from environmental changes. It is, therefore,
    useful for protecting endangered species. It can be used to introduce single-point
    mutations in a particular target gene via unique gRNA. A pair of gRNA-directed
    Cas9 nucleases instead, it is possible to introduce deletion or with'
