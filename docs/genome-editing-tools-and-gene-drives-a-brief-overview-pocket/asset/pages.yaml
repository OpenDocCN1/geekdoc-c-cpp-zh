  md: '# Genome Editing Tools and Gene Drives


    editing tools such as CRISPR can be used to create synthetic gene drives in a
    short time and in a targeted way (Liddicoat, 2016).


    # Suppression Drives


    Drives can be engineered or modifying. Suppression drives aim to reduce or eliminate
    a population. In combination with an independent threshold surge, they can spread
    globally and lead to the eradication of a whole species. This can be the case
    in particular if the training system has low intrinsic fitness costs and no resistance
    develops during the training (Champer et al., 2016).


    # Modification Drives


    In a modification drive, the changed allele is transmitted by “hitchhiking” with
    the drive to wild-chromosomes (Hammond et al., 2017). The replication of the drive
    allele may affect offspring in the initial zygote stage. If this occurs, all of
    the offspring''s cells will be homozygous for the changed gene (Enzmann, 2018).
    Again, the drive might only be active in the offspring-germline. In this situation,
    all will have the drive allele, but cells that make up other tissues will stay
    heterozygous.


    Modifications are intended to spread certain characteristics in a population,
    for example, using payload genes to merely alter and cause a change that aims
    to be proliferated to the subsequent generations. If this type of drive overcomes
    the problems of resistance, it can turn genetically change a whole species. Modification
    drives may be described as replacement drives, although this term can give an
    off-context impression implying that an entire species can be removed and another
    species takes over its place.


    # Threshold Dependent Drive


    Fixation is the major goal of this drive, and it only proliferates within a population.
    However, it is worth noting that the proliferation is controlled by a threshold
    frequency below which the drive will be eliminated (Min, 2018). It is argued whether
    or not the predictions of simple models are valid in the wild population and also
    whether or not the dispersal methods and organism in question have any implications
    (Marshall and Akbari, 2018).


    # Threshold-Independent Drive Systems


    This drive is not limited by threshold, as the name implies. It can successfully
    proliferate and establish itself with a minimal frequency to adhere to. This makes
    it very much able to spread quickly in a population group as well as if its high
    invasiveness. Due to its nature, it can greatly impact the environment and biodiversity
    at large.


    # Temporarily Self-Limiting Drives


    This is the category under which the famous chain drive falls. It is deemed-limiting
    in from the way it is designed, the drive will automatically stop after a certain
    number of generations. This can be achieved by incorporating elements that obey
    Mendel''s segregation laws.


    # Selfish Genetic Elements


    Genes within a genome are commonly seen as working together collaboratively to
    produce a viable organism (Runge and Lindholm, 2018). In this collaboration, all
    the genes have the same'
