  md: '# Deployments of Wolbachia


    In 2016 it was suggested to fight the spread of the Zika virus by breeding and
    releasing mosquitoes that have purposely been infected with an appropriate strain
    of Wolbachia. A present day shown that Wolbachia have the capacity to block the
    spread of Zika virus in mosquitoes in Brazil. In October 2016, it was broadcast
    that US$18 million in funding was being assigned for the use of Wolbachia-infected
    mosquitoes to fight Zika and dengue viruses. Deployment was scheduled for early
    2017 in Colombia and Brazil (Schinirring, 2016).


    In Brazil, these mosquitoes have been released in two suburbs of Rio de Janeiro
    since late 2014, as part of the preliminary description of the appropriateness
