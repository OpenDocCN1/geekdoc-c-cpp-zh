    **Maternal-driven embryonic arrest** Maternal-effect driven embryonic arrest Medea
    is a selfish gene complex produces a toxin and an antidote. Medea expresses the
    toxin in the female, killing her progeny. If the children carry *Mea*, they produce
    copies of the antidote, saving their lives.


    **Medea** A novel, threshold-driven system capable of inducing a local and reversible
    population collapse. Medea consists of four components—two on the X chromosomes
    and two on the Y—X-linked and zygotically expressed Y-linked allele in suppression
    of the female population and selection for the trans-gene Y because only male
    offspring of Medea females are protected from the effects of the toxin. At the
    same time, the combination of a zygotically expressed X-linked allele selects
    for the trans-gene Y-linked X and a zygotically expressed Y-linked allele. Together,
    these chromosomes create a lethal system that works against females when present
    above a certain threshold.


    **Meganucleases** A class of engineered nucleases that can be used to replace,
    eliminate or modify sequences in a highly targeted manner. Meganucleases are DNA
    cutting enzymes. By modifying their recognition sequence through protein engineering,
    the targeted sequence can be changed.


    **Mendelian** Mendelian inheritance refers to patterns of inheritance that are
    after Mendel and are characteristic of organisms that reproduce sexually. The
    Austrian monk Gregor Mendel performed experiments with crossed peas at his monastery
    during the middle of the nineteenth century.


    **Modified drive** A drive gene designed to spread genetic changes and/or genetic
    loads through a population, thereby modifying the population.


    **Mutogenic** Involving or caused by a single gene.


    **Mutagenesis** Mutagenesis is a process by which the genetic information of an
    organism is changed, resulting in a mutation. It may occur naturally in nature
    or as a result of exposure to mutagens. It can also be experimentally achieved
    using laboratory techniques.


    **Mutagenic reaction** An approach that employs the CRISPR system to drive a mutation
    to high frequency at the population level, making genetic practical for any species
    that can be made to accept a transgene in the laboratory, which is based on CRISPR
    genome editing for generating autatalytic mutations to create homozygous loss-of-function
    mutations.


    **NHEJ** Nonhomologous end joining is a pathway that repairs double-strand breaks
    because the ends are ligated without a template, in contrast to homology-directed
    repair, which requires a homologous sequence to guide repair.


    **Nuclease** A nuclease is an enzyme capable of cleaving the phosphodiester bonds
    between nucleotides of nucleic acids. Nucleases variety include single and double-stranded
    molecules. In living organisms, they are essential machinery for many aspects
    of DNA repair.


    **Off target** Off-target editing refers to unintended and unintended genetic
    modifications that arise from the use of engineered nuclease technologies such
    as CRISPR, TALENs and meganucleases. These use different methods to target a predicted
    sequence of DNA target, which they cleave or create a double-strand break, triggers
    the cell''s DNA repair mechanisms (nonhomologous end joining [NHEJ] and homologous
    recombination [HR]) and leads to site-specific modifications. If these complexes
    do not bind at the target, often as of homologous sequences and/ mismatch tolerance,
    they will cleave off-target and cause nonspecific genetic modifications. Specifically,
    off-target effects consist of unintended point mutations, deletions, insertions,
    inversions and translocations.'
