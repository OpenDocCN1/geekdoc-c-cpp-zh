    In prokaryotes, CRISPR systems are used by host to remove the DNA of invading
    viruses. The bacteria use pieces of DNA from invading viruses and use it to create
    spacers. CRISPR arrays allow the bacteria to identify the virus upon the second
    attack. When the viruses attack again, the Cas protein cleaves the RNA segments
    from the CRISPR arrays to target the virus DNA. The bacteria uses Cas9 to cut
    the DNA, destroying the virus. It degrades free foreign nucleic acids in the cell,
    preventing bacteriophage infection, conjugation, and natural transformation (Sampson
    et al., 2014; Cong et al., 2013; Zhang et al., 2013). It repeats with viral insertions
    as a method of the immune system to combat infection.


