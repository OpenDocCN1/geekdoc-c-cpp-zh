    ordinary LS solutions, but the uncertainty associated with the solution (second
    number in the brackets) have been reduced compared to solutions from fuzzy LS
    regression with the minimum fuzziness criterion. Furthermore, the associated fuzziness
    increases with increasing confidence levels, as expected. Therefore, more uncertainty
    must be accepted in order to have larger confidence.


