  md: '# The Hubness Phenomenon:

    Fact or Artifact?


    Thomas Low$^1$, Christian Borgelt$^2$, Sebastian Stober$^1$, and

    Andreas Nürberger$^1$


    **Abstract** The hubness phenomenon, as it was recently described, consists in
    the observation that for increasing dimensionality of a data set the distribution
    of the number of times a data point occurs among the $k$ neighbors of other data
    points becomes increasingly skewed to the right. As a consequence, so-called *hubs*
    emerge, that data points appear much more often than others. In this paper we
    challenge the hypothesis that the hubness phenomenon is an effect of the dimensionality
    of the data set and provide evidence that it is either a boundary effect, or more
    generally, an effect of a density gradient. As such, it may seen as an artifact
    that results from the process in which the data is generated that is used to demonstrate
    this phenomenon. We report experiments showing that the hubness phenomenon need
    not occur in high-dimensional data and can be made to occur in low-dimensional
    data.


    # # 1 Introduction


    Working with high-dimensional data is difficult has been known for quite some
    time now, although not all the effects of a large number of dimensions are completely
    understood. In 1961, R.E. Bellman was among the first who recognized the variations
    that arise in high-dimensional spaces, for which he coined the term *curse of
    dimensionality* [1]. One property of this "curse" is the fact that with increasing
    number of dimensions the volume of a unit hyperball grows considerably less than
    the volume of a unit hypercube. As a consequence, distance metrics, like the Euclidean


