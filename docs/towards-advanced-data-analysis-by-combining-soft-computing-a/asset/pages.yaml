  md: '# # Dynamic Data-Driven Fuzzy Modeling of Software Reliability Growth


    Olga Georgieva$^1$


    **Abstract** The paper deals with a new model description of software reliability
    growth dynamics. The model is applicable to multi-stage reliability growth that
    covers the complex defect detection rate and is based on Takagi-Sugeno fuzzy inference
    engine. The identification procedure determines model structure in real time based
    on evolving clustering algorithm. The clusters are discovered according Gustafson-Kessel
    distance metric that copies with clusters of different shape and orientation.
    The developed model is validated through a case-study data set.


    # ## 1 Introduction


    Continuous availability of designed functionalities is a crucial qualitative characteristic
    of the software product. This quality is expressed by software reliability. The
    complexity of the contemporary software systems often does not guarantee full
    reliability at least for the reasonable period of development and testing. Usually,
    the product is shipped if an acceptable number of software failures could be discovered
    during the system operation. The effective assessment of the failure number is
    provided by a software reliability growth model. The model is built on detecting
    defects during the software testing process and enables to predict the number
    of defects remaining in the software. The goal is to reach an acceptably low defect
    discovery rate, which will guarantee software suitability for delivery.


    The standard solution of this task statistically interpolates defect data to a
    mathematical function. The phenomenon presents exponential character, different
    variations of the exponential function have been extensively explored [14], [6].
    In order to account certain uncertainties this


