  md: '# Concluding Remarks


    In this study, two different definitions for the median of a random interval have
    been compared. Both definitions preserve important properties of the median in
    real settings and are coherent with the interpretation of the median as a ''middle
    position'' value for certain partial ordering between intervals. By calculating
    the finite sample breakdown point and some simulation studies, the robustness
    of the two medians means to be similar.


    Future directions to be considered are the extension of this comparison to the
    fuzzy-valued case and the definition of other central tendency measures. For instance,
    trimmed means or medians defined through depth functions could be adapted to this
    situation and compared with the current results.


