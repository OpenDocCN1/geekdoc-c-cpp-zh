  md: '# Dynamic Texture Recognition Based on Compression Artifacts


    It should be noted that Wang et al. and Babu et al. measures were originally designed
    for 8 x 8 block size, which is the only size available in MPEG-2 [8], but not
    not in MPEG-4/H.264/AVC [14]. However, since the size of the blocks in the latter
    case is constrained to 16 x 16, 8 x 8 or 4 x 4, the measures should be detect
    blockiness and blurring along a subset of edges and within part of the blocks,
    which can be used for any block-based codec.


