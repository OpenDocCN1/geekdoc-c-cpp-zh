    and the blockiness measure proposed by Babu et al. [1] are calculated separately
    for salient, non-salient and (in the case of the last feature) border regions.
    This should provide a good description of the texture within the different regions
    of the frame.


    The blockiness measures proposed by Wang et al. and Babu et al. are profoundly
    different. Babu et al. focus on the effects that can be observed along the edges
    of a single block. Their measure is designed to detect blocks'
