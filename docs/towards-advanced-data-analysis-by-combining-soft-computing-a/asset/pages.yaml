  md: '# 4 Real Time Model Identification


    The structure identification of software reliability growth description needs
    clustering that deals with streams of data and recognizes the system structure
    in real time. Evolving clustering intends to do with this task. Let us underline
    the evolving clustering algorithms with the currently available data x_k.


    The introduced evolving clustering algorithm [7] assumes that the boundary of
    each cluster is defined by a cluster radius. The radius $r_i$ of the i-th cluster
    is equal to the maximal distance between the cluster centre $v_i$ and the points
    belonging to this cluster with a membership degree larger or equal to a given
    threshold membership $\mu_i$.


    ```

    $r_i = \max ||v_i - x_j||_A \text{ for } x_j \in i\text{-}th\ cluster \text{ and
    } \mu_{ij} \geq \mu_i,$

    ```


    where $||.||_A$ is the GK distance norm determined by equation (8) for which the
    data $x_k$ belongs to the i-th cluster with membership degree $\mu_{ij}$ such
    that $\mu_{ij} \geq \mu_i$.


    Three possibilities should be evaluated if a new data $x_k$ has been currently
    measured. First, the data belongs to an existing cluster if it is within the cluster
    boundary. Update. If the data point is not within the boundary of any existing
    cluster a new cluster is a subject of assessment. Alternatively, $x_k$ is an outlier,
    which does not affect neither the data structure neighbours'' parameters. In order
    to assess a new cluster we serve the following considerations:


    ```

    $d_{pk} = \min_{w\in w...c} (d_{wk}),

    ```


    The data $x_k$ is assigned to the cluster $p$ if the distance $d_{pk}$ is less
    or equal to the radius $r_p$.


    ```

    $d_{pk} \leq r_p$,

    ```


    The Kohonen rule [11] used to update the p-th cluster parameters'' values are
    applicable:


    ```

    $v_{new} = v_{old} + \alpha(x_k - v_{old}),$

    ```


    ```

    $F_{new} = F_{old} + \alpha((x_k - v_{old})^T(x_k - v_{old}) - F_{old}).

    ```


    If condition (15) fails a new potential cluster is assessed. For this number of
    clusters is incremented


    ```

    $c = c + 1$

    ```


    and the incoming data $x_k$ is accepted as a center of the new cluster $v_{new}$
    with a covariance matrix $F_{new}$ initialized by the closest cluster:


    ```

    $v_{new} = x_k, F_{new} = F_p$.

    ```'
