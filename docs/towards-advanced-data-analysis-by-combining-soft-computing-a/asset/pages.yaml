  md: '# 4.2 Classification


    Once the video signatures have been extracted, we used the Wakaito Environment
    for Knowledge Discovery (WEKA) tool [22] to train and test our classifiers. WEKA
    is an open source data mining and machine learning environment, which allows for
    different machine learning algorithms to be tested on a data set.


    In the first phase we experimented with various algorithms, including the MLP
    by Culiibrk et al., various decisions and AdaBoost on different algorithms. To
    find the best suitable classifier, they were tested using the 10 stratified cross-validation
    methodology, i.c. 10% of the data was withheld during training and used for testing.
    The data was selected randomly, but care was taken to preserve the distribution
    of the classes that exists in the original data set, not with the same number
    of sequences


    In the second phase the best algorithm identified during the first stage was tested
    by withholding the VS of a single sequence for testing. The rest of the data was
    used for training. Once the classification for each part of the test VS was done,
    the mode of the VS was used to assign a class label to the sequence itself


    In our experiments, AdaBoost achieved the best 96.4% correct classification of
    each video signature part when tested on the training set and 95.87% accuracy
    when cross-validated. The confusion matrix obtained for VS-part classification
    is shown in Figure 4 In our experiment we used AdaBoost methods, with 10 iterations.
    The MLPs used 100 neurons, were trained using backpropagation with the learning
    rate of 0.3 moment 0.2 and 500 epochs.


    In the second phase, since we used the mode of 10 classification values obtained
    per VS as the final label of the data, the cross-validation performance was nearly
    perfect (99.5%) at the video-sequence level. The classifier failed to classify
    a single sequence accurately, out of 202 sequences in the data set. It should
    be noted that the sequence that the classifier failed to classify was one of 15
    sequences in the database that are missing class information and is therefore
    quite possible that the training set contained no information that would enable
    the classifier to learn that particular case.


    # 5 Conclusion


    Although content-based video retrieval and indexing are usually stated as important
    applications of dynamic texture classification and recognition methodologies,
    there so far has been no attempt to address the problem of classifying dynamic
    textures based on compression artifacts.'
