  md: '# # Stochastic Convergence Analysis of Metaheuristic Optimisation Techniques


    *Nikos S. Thomaidis¹ and Vassilios Vassiliadis¹


    **Abstract** Commonly used metaheuristic optimisation techniques imbed stochastic
    elements into the selection of the initial population or/or into the solution-search
    strategy. Introducing randomness is often a means of escaping from local optima
    when searching for the global solution. However, depending on the ruggedness of
    the landscape and the complexity of the problem at hand, this practice leads to
    a dispersion of the reported solutions. Instead of relying on the best found in
    a set of runs, as is typical in many optimisation tasks, it is essential to get
    an indication of the expected dispersion of results by estimating the probability
    of converging to a “good” solution after a certain number of generations. We apply
    a range of statistical techniques for estimating the success probability and the
    convergence rate of popular evolutionary optimisation heuristics in the context
    of portfolio management. We show how this information can be utilised by a researcher
    to obtain a deeper understanding of algorithmic behaviour and to evaluate the
    relative performance of competitiveisation schemes.


    # ## 1 Introduction


    Metaheuristic optimisation techniques, such as genetic algorithms, particle swarms
    and colonies, are constantly gaining attention in a variety of application fields.
    Nowadays, they are considered by many researchers as a promising alternative to
    traditional gradient-search methods that is better suited to the complexities
    of real-life applications (combinatorial explosion, non-differentiable functions,
    multiple local optima) [4, 12, 17].


    ¹ Management and Decision Engineering Laboratory, Department of Financial and
    Management Engineering, University of the Aegean, 41 Kountouriotou Str., 82100
    Chios, Greece, {nthomaid,v.vassiliadis}@fme.aegean.gr


    C. Borget et al. (Eds.): Towards Advanced Data Analysis, STDUFUZZ 285, pp. 343–357.
    springerlink.com


    © Springer-Verlag Berlin Heidelberg 2013'
