  md: '# Linear Regression Analysis for Intervals: A Review


    # 4.2 Simulation Studies


    The empirical behaviour of the estimation methods presented in Section 3 is checked
    by means of the Monte Carlo method. Let $X$, mid $\varepsilon \sim N(0,1)$, spr
    $X$, spr $\varepsilon \sim \chi^2$ be independent random variables. Two theoretical
    models will be estimated in order to cover all the linear structures being estimated.
    Firstly, we define $Y_1$ by means of a linear model in terms of $X$ with the structure
    based on interval arithmetic:


    ```

    $Y_1 = X + \varepsilon, \quad (16)$

    ```


    where $a=1$ and $B=E(\varepsilon|X)=[-1,1]$. The regression programs developed
    in [5] (see Section 3.1) and [7] (see Section 3.2) solve the LS estimation of
    (16) by means of different techniques. Let us denote estimation methods by $M_{(3,1)}$
    and $M_{(3,2)}$, respectively. In order to compare both approaches, $k=100000$
    samples of sample sizes were simulated from the theoretical situation; in each
    iteration the models were estimated and, finally, the mean value and mean square
    error for each estimator (denoted in general by 2) were gathered. The results
    are gathered. It is shown that the regression estimate of $a$ obtained with method
    $M_{(3,1)}$ seems to be unbiased, whereas the estimate from $M_{(3,2)}$ is asymptotically
    unbiased. However, the mean square error of the regression estimator is greater
    for $M_{(3,1)}$ in all the cases. The estimation of $B$ is similar in both methods,
    although depends on the results for $a$.


    Table 3 Comparison between the estimation methods $M_{(3,1)}$ and $M_{(3,2)}$

    | Parameter | $n$ | $E(a)$ $M_{(3,1)}$ | $E(a)$ $M_{(3,2)}$ | $MSE(M_{(3,1)})/MSE(M_{(3,2)})$
    |

    | --- | --- | --- | --- | --- |

    | $a=1$ | 10 | 0.9913 | 0.9417 | 1.6698 |

    | | 50 | 0.9935 | 0.9875 | 1.0061 |

    | | 100 | 0.9998 | 0.9710 | 2.0599 |

    | $B=[-1,1]$ | 10 | [-0.0913, 0.1017] | [-0.1416, 0.1824] | 1.0657 |

    | | 50 | [-0.0352, 0.0365] | [-0.0468, 0.0524] | 1.1333 |

    | | 100 | [-0.0097, 0.0098] | [-0.0274, 0.0285] | 1.0476 |


    It is easy to check that (16) is equivalently expressed as $Y_1 = X^M + X^S +
    \varepsilon$, so the estimation of Model M proposed in [3] and revised in Section
    3.3. Since this case different regression parameters are estimated, they cannot
    be directly compared with coefficient $a$ estimated in $M_{(3,1)}$ and $M_{(3,2)}$.
