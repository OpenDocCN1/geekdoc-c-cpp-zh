    $BIC = -\frac{2}{2}L + n \log T$


    where $n$ represents the number of model parameters, $L$ the LLF value and $T$
    the sample size.


    The implementation also has to be modified to the new optimization problem, which
    consists not only in parameter estimation, but also in structure identification.
    Model selection deals both with finding the number of necessary lags and identifying
    the hinges in the structure. The modification consists mainly in adapting the
    heuristic for a new data structure representing a solution in the search space:


    $\Psi = \{\psi_1, ..., \psi_{max(p)}\}, \{q_1, ..., q_{max(q)}\}, \psi_0, \psi_{2,1},
    ..., \psi_{2,max(p)}\}, \{\psi_{3,1}, ..., \psi_{3,max(q)}\}$


    where $max(p)$ and $max(q)$ represent the maximum number of AR and GARCH lags,
    the $\psi_1, ..., \psi_{max(p)}$ and $\{q_1, ..., q_{max(q)}\}$ are boolean and
    allow the management of structure hinges, $\psi_0$ is the conditional mean parameter,
    $\psi$ is the constant GARCH parameter, and finally $\psi_{2,i}$ and $\psi_{3,j}$
    are the ARCH ($\alpha_i$) and respectively the GARCH ($\beta_j$) lag parameters.


