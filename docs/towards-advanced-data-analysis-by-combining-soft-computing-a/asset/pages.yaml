    Abstract A methodology for analyzing the variability of the tidal fluctuation
    in a specific area is proposed in this work. The idea is to consider intervals
    determined by the minimum and maximum height reached by the tides in a day. Thus,
    the theoretical aim is to develop hypothesis tests about the variance of one or
    more interval-valued random elements (i.e., random intervals). Some simulations
    carrying out the empirical behavior and consistency of the proposed tests are
    carried out by considering different models. Finally, the procedure is applied
    to a real-life study concerning the fluctuation of tides in the port of Gijón
    (Asturias).


    # Introduction


    Tides refer to the vertical motion of water caused by the gravitational effects
    of the sun and moon. They vary on timescales ranging from hours to years due to
    numerous effects, called tidal constituents, such as rotation of the Earth, the
    position of the moon and sun relative to Earth, moon altitude (elevation) above
    the Earth equator, bathymetry, etc. From ancient times, tidal observation and
    discussion have increased in sophistication, marking the daily recurrence, the
    relationship with the sun and moon. Some studies concerning the tidal fluctuation
    have been developed in the literature along the last few years (see, for instance,
    [4, 8, 21]).


    One of the most applications of tidal fluctuation is tidal power, which is a form
    of hydropower that converts the energy of tides into useful forms of power (mainly
    electricity). Thus, the energy of tidal flows is converted into electricity by
    using a generator. Some studies about this topic can be found in [3, 9, 7]. In
    this context, it is interesting to analyze, for


