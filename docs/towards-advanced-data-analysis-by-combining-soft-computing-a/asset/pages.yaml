  md: '# Statistical Analysis of Imprecely Valued Data


    # 7 Concluding Remarks


    A summary of recent statistical developments for imprecise data from the ontic
    point of view has been done. Imprecise data are here formalized through intervals
    and fuzzy sets. The common points of the different approaches are that they are
    based on the (fuzzy) set-arithmetic and scalar distances, the aim is to handle
    each case as an entity. Many of the statistics are connected with estimation and
    testing purposes about parameters and can be applied using a freely available
    R package. Further details and discussions can be found in the references section.


    From a technical point of view, it should be underlined that in this paper concerning
    fuzzy-valued data have been presented (for the sake of simplicity) $F_A^*(R)$,
    although they are valid for a wider space allowing us to identify each fuzzy value
    with a function within a Hilbert space (as pointed out in [5] and [6]).


    SMIRE references have also been in research directions that do not fit the scope
    of this review, however, are strongly related to the COST Action IC0702. The webpage
    of the RG references these works (see http://bellman.ciencias.unovi.es/SMIRE/Publications.html).


