    # 6 Concluding Remarks


    In the theoretical part of this paper, a new approach to the problem of fuzzy
    pattern recognition was revealed. First of all the rule-based fuzzy inference,
    concerning the measure of patterns'' similarity, was connected with the idea of
    hyperinference. Secondly a description of the main pattern recognition process
    was based on Takagi-Sugeno (T-S) reasoning procedure, enhanced by specific decision
    making recommendations. Weights in (T-S) procedure are defined, solving linear
    or piece-wise linear programming problem (LPP or PWPPP), constructed according
    to the certain fuzzy experts'' information gathered or guessed. The practical
    significance of the proposed approach was experimentally confirmed by using the
    instrument for recognition and diagnostics of healthy people and those who suffer
    from an atherosclerosis. The classification was performed according to persons''
    clinical investigations and authors knowledge such an approach was used for the
    first time in the clinical practice, and it opens a new chapter for further research
    in this field.


