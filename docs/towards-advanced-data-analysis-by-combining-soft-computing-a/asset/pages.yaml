    To the best of our knowledge no one has considered the problem of classifying
    dynamic texture in compressed videos not the use of features used to measure different
    artifacts introduced by coding, as basis for dynamic texture classification/recognition.


    # 2.2 Video Quality Assessment


    The quality of coded video sequences depends on the video codec, hit-rates required
    and the content of video material [5]. If the bit-rate and the codec are the same
    over the range of sequences the quality of compressed videos is dependent only
    on the content, allowing for the use of features related to quality to discern
    content. This is not an unrealistic constraint, e.g. a quick calculation reveals
    that environ 290 million videos have been uploaded to YouTube in 2010 [24], all
    using the same codec and a significant subset with default parameter settings.'
