  md: 'K. Loewe, M. Grueschow, and C. Borgelt


    stimulus-related activity was most often occasioned by increased functional connectivity,
    we also detected functionally connected clusters that exhibited no considerable
    task-related activity. These clusters may have been affected by locally coherent
    noise patterns or they may have been engaged in neuronal activity unrelated (or
    at least not related) to the stimulus. In the latter case no fMRI regressors exist
    on which analysis is possible and these clusters might give rise to new hypotheses,
    subsequently tested in a conventional fashion.


    Beyond the initial proof of concept, the proposed approach may be utilized in
    future neuroscientific studies as well as possible theoretical implementations.
    The method is entirely-driven, it is applicable to any fMRI data (task- or stimulus,
    resting-state, etc.). As such, LCM-based analyses may be especially suited to
    the analysis of resting-state fMRI data, as in this case no experimental task
    or stimulus exists on which would be based.


    With a properly adjusted implementation, the LCM-versions based on dichotomous
    time series allow for time-efficient analysis of very large and many data sets.
    This aspect might be exploitable for real-time fMRI (rtMRI). The rtMRI methodology
    allows analysis in online fashion (that, concurrently with the data acquired by
    the scanner), the results of which may govern the adaptation of experimental stimulation
    and the interaction with the subject. The feasibility of online analysis of emotional
    and cognitive states in neurobiological research training after traumatic brain
    injury, cognitive stress or neurological pathology will potentially culminate
    in brain machine connectivity. In this application domain, local functional connectivity
    could serve as an indicator of changing activity patterns, as suggested by the
    comparison of GLM/SPM, LCM results.


    In addition, LCM may serve as a filter in order to constrain the brain voxels
    to be analyzed in functional images or in addition to a T-based gray matter segmentation.
    In favor of this idea is that the LCM maps and the GM probability maps seem to
    be highly conform (which is not surprising, since no neural activity is to be
    expected in non-GM scans). In fact an initial and general reduction to informative
    parts of the fMRI data during the analysis (whether assumption free or not) may
    constitute an interesting field of potential applications.


    Future work includes finding a better way of mapping the intensity signal given
    the shortcomings of a soft approach which not allow us to fully exploit the advantages
    of rich information when needed to maintain all relevant information. Secondly,
    we are working on perturbation schemes to generate surrogate data that can be
    used to derive p-values for the detected local connectivity. Finally, we are in
    the process of extending our approach to a time-efficient analysis of spatially
    unconstrained connectivity, which is made possible by bit-vector representations
    of a binary notion of activity.'
