    where $\varepsilon$ is an random error such that $E(\varepsilon|X) = B \in K_o(\mathbb{R})$.
    Given a simple sample $(X_i, Y_i)_{i=1}^n$ from $(X, Y)$, any pair of intervals
    $(X_i, Y_i)$ fulfils the linear model (6), with $Y_i = \alpha X_i + \varepsilon_i$
    for a certain $\varepsilon_i$. Thus, $\varepsilon_i = Y_i - \alpha X$ for $i=1,
    \dots, n$.


    **Remark 2.** The interval linear model (6) tries to mimic the simple linear model
    between two-valued random variables, with some particularities in order to keep
    the coherency with the interval arithmetic. The (interval-valued) independent
    term $B$ is included as the expectation of the error in order to allow the error
    to be an interval-valued random set. It is straightforward to show that the interval
    linear model $Y = \alpha X+B$ can represent such random variable. Thus, in order
    to deal with interval-valued errors, the independent term is included in the formalization
    of the possible errors.


    Analogously to in [5], the estimation of the regression parameters $(a, B)$ is
    addressed by means of a least squares criterion with respect to Bertolu metric
    metric, i.e. minimizing the function $\phi(b, C)$ in (5) for $b \in \mathbb{R}$
    and $C \in K_o(\mathbb{R})$. Moreover, the optimum values are expected to satisfy
    the linear model (6) for the sample intervals. Thus, the minimization problem
    associated with the estimation of (6) is formulated as follows:


    ```

    \begin{aligned} &\min_{b\in\mathbb{R},C\in K_o(\mathbb{R})}\sum_{i=1}^n d_W(Y_i,
    b_i+C) \ \text{subject to} \ Y_i-bX_i, \text{exists, for all } i=1, \dots,n \end{aligned}
    \quad (7)

    ```


    In [7] this constrained minimization problem has been solved, and the following
    analytical expressions for the estimates of the regression parameters $(a, B)$
    have been obtained:


    ```

    \begin{aligned} a^* &= \min \left\{ \begin{array}{ll}\hat{s}_0, & \text{if } \tilde{s}_{X,Y}
    \le 0 \\hat{s}_0, \frac{\hat{s}_{X,Y}}{\hat{s}_X}, & \text{if } \hat{s}_{X,Y}
    \ge 0 \text{ and } \tilde{s}_{X,Y} \le \hat{s}_{X,Y} \end{array} \right\, \ &-\min
    \left\{ \begin{array}{ll}\frac{\tilde{s}_{X,Y}}{\hat{s}_X}, & \text{if } \hat{s}_{X,Y}
    \ge 0 \text{ and } \tilde{s}_{X,Y} \le \hat{s}_{X,Y} \end{array} \right\, \end{aligned}
    \ B^* &= \bar{Y}-\alpha a^* \end{aligned} \quad (8)

    ```


    where


    ```

    \hat{s}_0 = \min \left\{ \frac{\hat{s}_{X,Y}}{\hat{s}_X} : \text{if } \hat{s}_X
    \ne 0 \, \text{otherwise} \right\,

    ```'
