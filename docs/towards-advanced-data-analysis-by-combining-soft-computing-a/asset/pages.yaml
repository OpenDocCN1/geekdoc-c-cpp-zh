  md: '# Linear Regression Analysis

    for Interval-valued Data

    Based on Set Arithmetic: A Review


    Angela Blanco-Fernández¹, Ana Colubi¹, and Gil González-Rodríguez¹


    **Abstract** When working with real-valued data regression analysis allows to
    model and forecast the values of a random variable in terms of the values of either
    another one or several random variables defined on the same probability space.
    When data are not real-valued, regression techniques should be extended and adapted
    to model simple relationships in an effective way Different kinds of imprecision
    may appear in experimental data: uncertainty in the quantification of subjective
    measurements, perceptions, but not a few. Compact intervals can be effectively
    used to represent these imprecise data. Set- and fuzzy-valued elements are also
    employed for representing different kinds of imprecise data. In this paper several
    linear regression estimation techniques for interval-valued data are revised.
    Both the practical applicability and the empirical behaviour of the estimation
    methods is studied by comparing the performance of the techniques under different
    population conditions.


    # 1 Introduction


    Over the years, the consideration of different sources of imprecision in generating
    and modeling experimental data have implied the development of advanced statistical
    and soft computing techniques capable of dealing with these kinds of data. Interval-valued
    data are considered as a first attempt to extend the trend of characteristics
    for which values are real numbers to more flexible scenarios. For instance, when
    the characteristic has a great uncertainty in the quantification of its values,
    it may be suitable to formalize these values as intervals instead of real numbers,
    in order to take into account this uncertainty in the statistical process (see,
    for instance, [11]). Grouped or


