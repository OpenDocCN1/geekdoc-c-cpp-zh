    S. Gerani, M. Keikh, and F. Crestani


    # # 3.1 Query Type Identification


    As a first step in our model we need to identify the query-entity type(s). We
    propose a feedback-based method, to rank pronoun sets based on the probability
    of being feasible for the query-entity. We calculate the average probability of
    each pronoun set in the top $M$ relevant documents as follows:


    ```

    $$f_k(Q) = \frac{1}{F(Q)} \sum_{d \in F(Q)} \frac{atf_Q(A_k;d)}{len(d)}$

    ```


    $F(Q)$ is the set of top $M$ relevant documents to the query $Q$ and $k$ indicates
    the frequency of pronoun set $A_k$, which can be one of: $mp, fp, np$. The frequency
    of pronoun set $A_k$, when coreferenced with $Q$, can be estimated using Equation
    2. The probability that the anaphoric set $A_k$ is feasible for query $Q$ can
    then be calculated as follows:


    ```

    $$P(A_k) = \frac{f_k(Q)}{\sum_{k \in \{mp, fp, np\}} f_k(Q)}$ (4)

    ```


    # # 3.2 Anaphoric Frequency of Query Terms


    The anaphoric frequency of a query term can be estimated as follows:


    ```

    $$f_{anaphoric}(w;d) = \sum_{A_k \in A} P(A_k)atf_w(A_k;d)$ (5)

    ```


    where $A$ is the set of pronoun categories that are feasible for the query, that
    $A = \{A_{mp}, A_{fp}, A_{np}\}$, $P(A_k)$ is the probability that $A_k$ is a
    feasible pronoun set for the entity queries. Some queries may contain more than
    one entity type. For instance, $Q_{1000}$ from BLOG0 collection, "Frank Gehry
    architecture", contains Frank Gehry as a person entity. Ideally we want to consider
