    # 3 Streaming-Data Selection


    In real-world systems the system''s model is, due to its complexity, split into
    less complex models that are different according to the operating conditions at
    that moment. Such local models need to be updated on-line, based on incoming information,
    i.e., streaming data from signal measurements. A possible method for Streaming-Data
    Selection for GP modelling (SDS-GP) is proposed as follows.


    The GP models depend on the training data and the covariance function. In other
    words, the training data is defined with various regressors and basis functions,
    while the covariance function is defined with the type and the hyperparameter
    values. As is described in Section 2, GP model''s training for a large amount
    of data is very time consuming. To overcome this greed, only a subset of the most
    important information is proposed to be used. Such a subset is, in the literature,
    called the active set or the basis vectors set [4] [9]. With a type or combination
    of various types of covariance function, a particular of the system is included
    in the model. Nevertheless, with optimisation of the hyperparameters the proposed
    model is even better adapted to the real system. However, in dynamic, non-linear,
    system identification the squared exponential function is frequently used, preserving
    the smoothness and stationarity of the system.


    The approach we processes each new piece of streaming data sequentially. The main
    idea of the proposed algorithm is to sequentially gain the bulk of the information
    contained in the streaming data and to adjust to the dynamic system''s characteristic
    changes. To keep the active set small enough to process the data before new data
    arrives, the maximum length of the active set should be set with the parameter
    max. Therefore, the max parameter is an important parameter. In addition, two
    more design parameters should be set that determine the "sensitivity" of the algorithm.
    That means they determine whether new data will be processed or not. The incoming,
    data is only processed if the error or the variance of the prediction for new
    data is higher than the pre-set thresholds, thMu and thVar, for the error of the
    mean value and the variance, respectively.'
