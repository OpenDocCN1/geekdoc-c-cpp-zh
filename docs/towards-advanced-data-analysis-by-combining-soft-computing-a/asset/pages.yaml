  md: 'O. Georgieva


    approach supposes normal distribution of the model parameters'' values. However,
    statistics does not cover implicit information due to the subjectivity of the
    human behavior, which has large impact on the processes of software development,
    testing and system operation. We should take into account that software failures
    are result of designers, developers and/or testers.


    Seeking effective modeling techniques investigations have been directed to approach
    grasp the uncertainty of fuzzy type [5], [10], [15]. Recently, fuzzy logic approach
    explored as a powerful framework for software reliability growth decision [11].
    In order to account for the existing deterministic information Takagi-Sugeno (TS)
    fuzzy rule base scheme [13] was successfully applied. This modeling approach tries
    to decompose the input-output data space into subspaces having vague boundaries
    and to approximate the system behavior by a linear model. The proposed model of
    software growth consists of a collection of linear models that represent the expected
    results as a function of historical measured data [1], [8].


    Improvement of the reliability growth model could be searched in a search that
    accepts fuzzy clustering as an efficient approach for recognition of the TS model
    structure. Examples of clustering algorithms that have been explored in its modification
    - Subtractive clustering algorithm and its Subtractive clustering algorithm as
    well as objective function clustering [3].


    On the other hand the reliability has to be predicted by the data collected at
    the current moment. Thus, the proper task is to model software reliability in
    real time. In order to solve this problem on-line version of TS modeling algorithm
    should be identified. Some authors solve this task by applying on-line extension
    of the Mountain/Subtractive clustering. They utilize recursive and normative technique
    calculating the potential of the new data point in order to update the existing
    clusters or discover new ones [2]. However, this solution reduces the model accuracy
    as it does not consider the shapes.


    In this paper we propose new modeling for software reliability description based
    on TS model. The identification algorithm is realized through evolving clustering
    procedure that exposes the advantages of the objective function for identifying
    clusters with a generic shape and orientation. We use Gustaf-Kessel (GK) distance
    measure [9] to find elliptic clusters with different shape and orientation adapted
    to cover the individual character of the clustered data.


    The fuzzy rule base system of software reliability growth model is introduced
    in the second section. Identification procedure is revealed in the third section.
    Real time identification algorithm is described in detail in the fourth section.
    The model efficiency is evaluated using a case study data set (fifth section).
    Concluding remarks are given in the sixth section.'
