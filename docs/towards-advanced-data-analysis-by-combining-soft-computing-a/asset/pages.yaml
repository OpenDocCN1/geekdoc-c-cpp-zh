  md: '# 8 Conclusions and Further Research


    This chapter performed an empirical analysis of the convergence properties of
    two hybrid computational schemes, based on genetic algorithms and colonies, in
    the framework of cardinality-constrained portfolio optimisation. We report several
    indicators of algorithmic performance picturing different aspects of the variability
    of outcomes. The information conveyed by these performance metrics can be further
    utilised to derive the optimal trade-off between the number of generations and
    restarts. This figure is very important when it comes to deallocate the available
    computational resources we proposed a technique for defining intervals on various
    samples, showing how the value of each performance metric is expected to be on
    unseen data. Both metaheuristics examined in this study have proven quite effective
    in handling the complexities of the optimization problem at hand. The subgraphs
    of stocks reported by GA vs ACO consistently deliver higher Sortino ratios than
    those reported by a Monte-Carlo search over the space of feasible asset combinations.


    The techniques presented in this study are general-purpose and can be applied
    to a wider range of metaheuristics or optimization problems (e.g. [6] for a wider
    decision). However, at the current stage of development, they mainly serve as
    an ex-post evaluation tool for measuring the convergence rate of a metaheuristic
    or performing pairwise comparisons on a particular problem. The extent to which
    the results from such an analysis provide useful information on how to operate
    each algorithm on a similar problem setting is still an issue of interest.


    # References


    +   1. Barrero F, Casado B, R-Moreno DM, Camacho D (2011) Statistical Distribution
    of Generation-to-Success in GP: Application to Model Accumulated Success Probability.
    Proc. 11th European Conf. on Genetic Programming (EuroGP 2011), 154-165

