    = \sigma_i^2 > 0$, and $\{\sigma}^2 = (\sigma_{a_1}^2, \sigma_{a_2}^2, \dots,
    \sigma_{a_p}^2, \sigma_{b_1}^2, \sigma_{b_2}^2, \dots, \sigma_{b_p}^2)$ are the
    row-vectors of length $3p$ of the parameters to $X$. The generic coefficient $\gamma_j''$
    is the regression coefficient of the component $j \in \{m,l,r\}$ of $\hat{Y}$
    (where $m,l,r$ refer to the center, left and right respectively) and the transformations
    of $g(Y)^l$ and $h(Y)^r$, respectively) and the component $j''$ refers to the
    corresponding center, left and right center of the explanatory variables $X^t,
    t=1,\dots,p$ (where $m,l,r$ refer to the center, left and right). For example,
    $\sigma_{mt}$ represents the relationship between the center of the response,
    $Y^m$, and the spread of the explanatory variable $X^t$ ($m,t$ denote the indices).
    By means of (2), we study the relationship between the response and the explanatory
    variables taking into account not only the randomness due to data generation process,
    but also the information provided by the spreads of the explanatory variables
    (the injection of data), which is arbitrarily inferred.


    The covariance matrix of $X$ is denoted by $\Sigma = E((X-E[X])(X-E[X])^T)$ and
    $\Sigma$ stands for the covariance matrix of $\{\varepsilon_m, \varepsilon_l,
    \varepsilon_r\}$, with variances $\sigma_m^2, \sigma_l^2, \sigma_r^2$, strictly
    positive and finite.


    # 3.1 Estimation Problem


    The estimation problem of the regression parameters is faced by means of the Least
    Squares (LS) criterion. Accordingly, parameters of model (2) are estimated by
    minimizing the sum of squared distances between the observed and theoretical values
    of the response variable. However, as already noted, suitable transformations
    of the spreads are considered in (2). This allows us to use the generalized metric
    $D_{\gamma}^2$ in the objective function of the problem. Therefore, the LS problem
    consists in looking for $\hat{a}_m, \hat{a}_l, \hat{a}_r, \hat{b}_m, \hat{b}_l$
    and $\hat{b}_r$ which minimize


    ```

    $D_{\gamma}^2 = \sum_{t=1}^p D_{\gamma}^2((Y^{mt*}, g(Y)^{lt*}, h(Y)^{rt*}), (\hat{Y}^{mt*},
    g(\hat{Y})^{lt*}, h(\hat{Y})^{rt*}))\quad (3)

    ```


    where $Y^{m*}$ and $h(Y)^{r*}$}$ are the $n \times 1$ vectors of the observed
    values and $(\hat{Y})^{m*} = Xa_m + b_m, g(Y)^{l*} = Xa_l + b_l$ and $h(Y)^{r*}
    = Xa_r + b_r$.'
