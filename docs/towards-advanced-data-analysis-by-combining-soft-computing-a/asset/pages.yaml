    # 5.2 Protocol of Physical Experiments


    Fifteen healthy (HL) and fifteen suffering from multiple sclerosis disability
    (MSD) subjects (all females) age 32±2 years (average standard deviation) took
    part in physical experiments. Subjects who suffer from multiple sclerosis were
    chosen to take part in experiments since this disease affects central nervous
    system (CNS) of an individual and causes difficulties to maintain the stable bipedal
    platform [12]. The advantage of each participant was known for each subject. Participants
    were asked to stand on a base of support in a bipedal comfortable position. The
    duration of the experiment was 60 sec with a sampling rate of 100 Hz. Stabilograms
    were recorded using Kistler 9287B platform (Fig. 7). All signals were centralized
    in space and in magnitude, the average position of COP signal has coordinates
    (0, 0). The planar (2D) histograms of stabilograms were calculated. Typical histograms
    of HL and MSD subjects crossing 2D bins in Medio-Lateral multiplied by 5 Anterior-Posterior
    direction are presented in Fig. 8. Bins are numbered as shown in Fig. 8. The darker
    box represents more time of COP signal spent in the bin, the higher intensity
    of a feature.'
