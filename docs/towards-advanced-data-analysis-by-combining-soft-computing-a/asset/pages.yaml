    (Asturias), Spain, `christian.borgelt@softcomputing.es


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUDFUZZ 285, pp. 267–278.

    springerlink.com

    © Springer-Verlag Berlin Heidelberg 2013'
