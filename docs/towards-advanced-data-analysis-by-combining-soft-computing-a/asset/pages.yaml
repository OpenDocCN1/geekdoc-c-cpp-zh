  md: '# # Advanced Analysis of Dynamic Graphs in Social and Neural Networks


    Pascal Held$^1$, Christian Moewes$^1$, Christian Braune$^1$, Rudolf Kruse$^1$,
    and Bernhard A. Sabel$^2$


    **Abstract** Dynamic graphs are ubiquitous in real world applications. They can
    be found, e.g. in biology, neuroscience, computer science, medicine, social networks,
    the World Wide Web. There is a great necessity and interest in analyzing these
    dynamic graphs efficiently. Typically, analysis methods from classical data mining
    and network theory have been studied separately in different fields of research.
    Dealing with complex networks in real world applications, there is a need to interdisciplinary
    research by combining techniques of different fields. In this paper we analyze
    dynamic graphs from two different applications, i.e. social science and neuroscience.
    We exploit the edge weights in both types of networks to answer distinct questions
    in the respective fields of science. First, for the representation of edge weights
    in a social network we propose a method to efficiently represent the strength
    of a relation between two entities on events involving both entities. Second,
    we curate graph measures of electroencephalographic activity with clinical variables
    to find good predictors for patients with visual damage.


