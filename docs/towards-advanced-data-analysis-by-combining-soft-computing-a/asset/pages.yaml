    # 2 The Space of Intervals $K_e(\mathbb R)$: Preliminaries


    First of all, some notation is established, starting with $K_c(\mathbb{R})$, the
    class of nonempty compact intervals. Each one of the intervals $K \in K_c(\mathbb{R})$
    can be characterized in terms of its infimum and supremum, $K = [\inf K, \sup
    K]$ or in terms of its mid-point and spread or radius, $K = [\mid\mid K\mid -
    spr K, \mid\mid K\mid + spr K]$ where,


    ```

    $mid K = \frac{\inf K + \sup K}{2}, \quad spr K = \frac{\sup K - \inf K}{2}$

    ```


    To analyze this kind of data, the two most relevant operations from a statistical
    view are the addition and the product by a scalar. In this paper, we use the interval
    arithmetic (the particular case of set arithmetic). That is:


    +   * The sum of two nonempty compact intervals, $K, K'' \in K_e(\mathbb{R})$,
    is defined as the Minkowski sum of $K$ and $K''$, as the follows


    ```

    $K + K'' = [\mid\mid K + \mid\mid K'', \sup K + \sup K'']=$

    ```


    ```

    $[(\mid\mid K + \mid\mid K'' - (spr K + spr K''), (\mid\mid K + \mid\mid K'')
    + (spr K + spr K''))].$

    ```


    +   * The product of an interval $K \in K_e(\mathbb{R})$ by a scalar $\gamma \in
    \mathbb R$ is defined as the element of $K_e(\mathbb{R})$ such that


    ```

    $$\gamma \cdot K = \begin{cases} \gamma \cdot \mid\mid K - \gamma \cdot spr K,
    \gamma \cdot \mid\mid K + \gamma \cdot spr K & \text{if } \gamma \geq 0 \ \gamma
    \cdot \mid\mid K + \gamma \cdot spr K, \gamma \cdot \mid\mid K - \gamma \cdot
    spr K & \text{otherwise} \end{cases}$

    ```


    ```

    $=[\gamma| \cdot \mid\mid K - |\gamma| \cdot spr K, |\gamma| \cdot \mid\mid K
    + |\gamma| \cdot spr K]$.$

    ```


    A important remark is that with these two operations the space is not linear,
    but only semisimple (with a conical structure) because of the lack of an opposite
    for the Minkowski addition. Therefore, there is no generally applicable definition
    for the difference of intervals that preserves the connection with the real case.
    Hence distances play a crucial role in statistical developments. Although $L^\infty$
    metrics are very convenient in many statistical developments like least squares
    approaches, an $L^1$ distance is now needed to define the median. In this paper,
    the two following metrics will be used:


    +   * The generalized Hausdorff metric introduced by Chavez et al. [5], which
