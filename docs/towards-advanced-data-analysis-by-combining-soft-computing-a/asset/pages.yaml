  md: '# SAFD — An R Package for Statistical Analysis of Fuzzy Data


    Wolfgang Trutschnick$^1$, María Asunción Lubiano$^2$, and Julia Lastra$^1$


    **Abstract** The package SAFD (Statistical Analysis of Fuzzy Data) provides basic
    tools for elementary statistics with one dimensional Fuzzy Data in the form of
    polygonal fuzzy numbers. In particular, the package contains functions for the
    standard operations on the class of fuzzy numbers (sum, scalar product, Hukuhara
    difference, quanta) as well as for calculating distance, sample variance, sample
    correlation, and the Histogram. Moreover SAFD facilitates functions for the simulation
    of fuzzy random variables, for bootstrap tests for the quality of means as well
    as a function for linear regression given trapezoidal fuzzy data. The aim of this
    paper is to explain the functionality of the package and to illustrate its usage
    by various examples.


    # # 1 Introduction


    During the last decade the concept of fuzzy sets has become more and more popular,
    particularly in order to model imperfection [13] that typically arises in the
    context of collecting or processing different kinds of realistic data. Firstly,
    as a matter of fact, all measurements of continuous physical quantities are imprecise
    — the imprecision, for instance, is caused by the measurement device rounds to
    a certain number of digits or by physical conditions (Heisenberg uncertainty in
    the microscopic level, etc.). And secondly, humans typically quantify and classify
    using linguistic labels, which only in very rare cases can properly be measured
    by exact (crisp) real values. It is therefore not


    $1$ European Centre for Soft Computing, Edificio de Investigación, Calle González
    Quirós s/n, 33600 Mineiros (Asturias), Spain, wolfgang.trutschnick@softcomputing.es


    $2$ Departamento de Estadística e I.O. y D.M., Universidad de Oviedo, 33007 Oviedo
    (Asturias), Spain, lubiano@univmi.es


    C. Borgt et al. (Eds.): Towards Advanced Data Analysis, STDUFUZZ 285, pp. 107–118.

    springlink.com


    © Springer-Verlag Berlin Heidelberg 2013'
