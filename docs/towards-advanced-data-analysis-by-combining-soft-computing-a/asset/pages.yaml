    # ## 4 Experimental Results


    With the first experiments we describe in the following we try to clarify the

    inherent properties of the hubness phenomenon. In the first experiment we

    show hubness need not occur in high-dimensional spaces by sampling

    from a finite, boundary-less space. We demonstrate that it is rather directly

