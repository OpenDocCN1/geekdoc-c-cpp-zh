    # 3.3 DMS for Multi-objective Feature Selection


    Direct MultiSearch (DMS) is a novel derivative-free method for multi-objective
    optimization, which does not aggregate any of the objective functions [9] to MOO
    all types of direct-search methods that are of a directional type such as pattern
    search and generalized pattern search, generating search, and mesh adaptive direct
    search [7]. This approach is called direct since it naturally generalizes direct
    search (of directional type) from single to multi-objective optimization.


    The principles of DMS are as follows: instead of updating a single point per iteration,
    it updates a list of feasible nondominated points. For a more detailed description
    of the algorithm see [9]. The original DMS was developed for real-valued variables
    in the search space. This algorithm was adapted to cope with the discrete feature
    selection optimization problem. Each DMS solution, $\mathbf{x}_{DMS} = (x_1, \dots,
    x_N) \in \mathbb{R}^N$ is converted into a binary solution, $\mathbf{x} = (x_1,
    \dots, x_N)$, where $x_i \in \{0, 1\}$, using the threshold


