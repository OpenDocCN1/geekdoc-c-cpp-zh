  md: '# Statistical Analysis of Imprecisely Valued Data


    An approach to the ''region'' estimation of the fuzzy-valued mean of a multidimensional
    RFS has been stated in González-Rodríguez et al. [39]. Given a probability space
    $(\Omega, \mathcal{A}, P)$, if $X : \Omega \rightarrow K_\alpha(\mathbb{R}^p)$
    if $X$ is an RS, the Aumann mean of $X$ is defined by [1] as $E^A(X)_\alpha$ such
    that


    ```

    $E^A(X)_\alpha = \int_{\Omega} f(\omega) dP(\omega) : f : \Omega \rightarrow \mathbb{R}^p,
    f \in L^1(\\Omega, \mathcal{A}, P), f \in X\text{ a.s.}[P]$

    ```


    If $X : F_\alpha(\mathbb{R}^p)$ is an RS, the Aumann mean of $X$ is defined [51]
    to be given as the fuzzy set $\hat{E}(X)_\alpha \in F_\alpha(\mathbb{R}^p)$ such
    that for all $\alpha \in [0, 1]$,


    ```

    $(\\hat{E}(X))_\alpha = E^A(X)_\alpha$

    ```


    In case $p=1$, $(\hat{E}(X))_n$, a ''confidence region'' is suggested on the basis
    of the sample mean of a random sample from the simulation ideas $\mathcal{X}_1,
    \dots, \mathcal{X}_n$ (i.e., $\hat{\mathcal{X}}_1, \dots, \hat{\mathcal{X}}_n$
    are independent and identically distributed as $\hat{\mathcal{X}}$), which is
    given by


    ```

    $\hat{\mathcal{X}}_n = \frac{1}{n}(\mathcal{X}_1 + \dots + \mathcal{X}_n)$

    ```


    by looking a value $\delta > 0$ such that for an arbitrarily fixed confidence
    level $\tau \in (0, 1)$


    ```

    $P(D_n^\delta(\\hat{\mathcal{X}}_n, \mathcal{X}_n) \leq \delta) = \tau$

    ```


    where $\delta$ is chosen to be the $\tau$-quantile of the distribution of $D_n^\delta(\\hat{\mathcal{X}}_n,
    \mathcal{X}_n)$ which could be approximated by the corresponding bootstrap quantile.
    The confidence region (fuzzy ball) for $\hat{E}(X)$ will then be given by


    ```

    ${\hat{U} \in F_\alpha(\mathbb{R}^p) : D_n^\delta(\\hat{\mathcal{X}}_n, \mathcal{X}_n)
    \leq \delta\}$

    ```


    González-Rodríguez et al. [39] the approach is illustrated in the multidimensional
    case by means of empirical studies on the simulation ideas from Section 2.

    In connection with two-sided hypothesis testing, the k-sample case procedure in
    [34] has been improved and generalized to test the equality of Aumann-type means
    of k independent RFSs (González-Rodríguez et al. [37]). A technique has also been
    sketched for k dependent RFSs (Montenegro et al. [47]), and a deeper study is
    forthcoming. The generalized one-way ANOVA (Analysis Of, Variance) for independent
    samples in [39] has been formalized on the basis of the isometric identification
    of fuzzy and functional data. Actually, the improved-generalized method is applicable
    to one-way ANOVA for functional data.'
