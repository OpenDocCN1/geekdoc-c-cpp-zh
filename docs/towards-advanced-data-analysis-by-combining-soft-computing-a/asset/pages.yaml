    $$\tilde{N}_t = \sum_{i=1} U_i, t \in [0,T]$\$


    As $N_t$ is a Poisson process with an intensity $\kappa > 0$.


    For each $t \in [0,T^*]$ the integer $N_t$ is equal to the number of catastrophic
    events to till the moment $t$. Moments of process $(N_t)_{t\in[0,T^*]}$ are interpreted
    as moments of catastrophic events.


    For each $t \in [0,T^*]$ $N_t$ describes the aggregated catastrophic losses till
    the moment $t$. $(\tilde{N}_t)_{t\in[0,T^*]}$ is a nondecreasing stochastic process,
    with right-continuous trajectories of a step form. The heights of its jumps are
    equal to values of losses during catastrophic events.


    All the processes and random variables are defined on a filtered probability space
    $(\Omega, \mathcal{F}, (F_t), P)$. The filtration $(F_t)_{t\in[0,T^*]}$ is formula


    $F_t = \sigma(F_0 \cup (W_s, s \le t)), F_t^* = \sigma(W_s, s \le t), t \in [0,T^*]$\$


    We assume $F_0 = \sigma(A : P(A)=0)$ and that $(W_t)_{t\in[0,T^*]}, (N_t)_{t\in[0,T^*]}$
    are independent. The probability space with filtration satisfies standard assumptions,
    i.e. $\sigma$-algebra $P$-complete, filtration $(F_t)_{t\in[0,T^*]}$ is right-continuous
    and $F_t$ contains all the sets from $P$-probability zero. Moreover, we assume
    that the random variables $U_i, i=1, 2, \dots$ have bounded moment.


    We denote by $(B_t)_{t\in[0,T^*]}$ the bond satisfying equation $dB_t = r_t B_t
    dt$, where $r=r(t)$ is a risk-free interest rate.


    Zero-coupon bonds are traded in the market. We denote by $B(t,T)$ the price of
    a zero-coupon bond with maturity $T$ at time $t$ and with the face value (principal)
    equal to 1.


    We price catastrophic bonds under the assumption of no possibility of arbitrage
    in the market. Let first assume that investors are neutral toward nature jump
    risk. This assumption has practical confirmations in the market (see.g. [1, 22]).
    Secondly, we assume that changes in interest rate $r$ can be replicated by existing
    financial instruments (especially zero-coupon bonds).


    # 3 Catastrophe Bonds


    As it mentioned before, there are many problems with classical insurance mechanisms
    and alternative financial or instrument instruments may be useful by insurers.
    One of the most popular catastrophic-linked security is the catastrophic bond,
    also known as cat bond or Act-of-God bond (see [7, 9, 17]).'
