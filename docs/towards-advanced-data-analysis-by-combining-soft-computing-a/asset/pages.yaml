  md: "# Bootstrap ClIs for a Linear Regression Model with FRVs\n\nThe work is organized\
    \ as follows. In Section 2 some preliminary notions concerning fuzzy sets, LR\
    \ fuzzy numbers and their distance, the definition of FRVs and their properties\
    \ are briefly recalled. In Section 3 the linear regression model for LR fuzzy\
    \ variables is introduced along with the procedure for estimating its parameters.\
    \ The construction of bootstrap confidence intervals is illustrated in Section\
    \ 4. A simulation study and a real-case analysis are described in Section 5, while\
    \ concluding remarks are made in Section 6.\n\n# 2 Preliminaries\n\nGiven a universe\
    \ $U$, a fuzzy set $\tilde{A}$ is defined through the so-called membership function\
    \ $\\mu_{\tilde{A}}: U \to [0,1]$. For a generic $x \\in U$, the membership function\
    \ extends to express which $x$ belongs to $\tilde{A}$. Such a degree ranges from\
    \ 0 (complete non-membership) to 1 (complete membership).\n\nA particular class\
    \ of fuzzy sets is the LR family, whose members are the-called LR fuzzy numbers.\
    \ The space of the LR fuzzy numbers is denoted by $F_{LR}$. A nice property of\
    \ the LR family is that its elements can be determined by means of the mapping\
    \ $x: \\mathbb{R}^+ \to \\mathbb{R}^+$, i.e., $s(\tilde{A}) = s_A = (A^m, A^r)$.\
    \ This implies that $\tilde{A}$ can be expressed by three real-valued parameters,\
    \ the center $(A^m)$ and the (non-negative) left and right spreads use $\tilde{A}\
    \ \\in F_{LR}$ or $(A^m, A^l, A^r)$. The membership function of $\tilde{A} \\\
    in F_{LR}$ can be written as\n\n```\n$$\\mu_{\tilde{A}}(x) = \\begin{cases} L(A^m-x)\
    \ & x \\le A^m, A^l > 0 \\ 1(A^m-x) & x \\le A^m, A^l = 0 \\ R(x-A^m) & x > A^m,\
    \ A^r > 0 \\ 0 & x > A^m, A^r = 0 \\end{cases}$ $$\n```\n\nwhere the functions\
    \ $L$ and $R$ are particular decreasing functions from $\\mathbb{R}^+$ to $[0,1]$,\
    \ such that $L(0)=R(0)=1$ and $L(x)=R(x)=0, \\forall x$, and $I$ is the indicator\
    \ function of a set $I$. If $\tilde{A}$ is a triangular fuzzy number $L(z)=1-z$,\
    \ for $0 \\le z \\le 1$.\n\nThe operations considered in $F_{LR}$ are the natural\
    \ extensions of the Minkowski sum and the product by a positive scalar in intervals.\
    \ In detail, the sum of $\tilde{A}$ and $\tilde{B}$ in $F_{LR}$ is the LR fuzzy\
    \ number $\tilde{A} + \tilde{B}$ so that\n\n```\n$(A^m, A^l, A^r) + (B^m, B^l,\
    \ B^r) = (A^m+B^m, A^l+B^l, A^r+B^r)$,\n```\n\nand the product of $\tilde{A} \\\
    in F_{LR}$ by a positive scalar $\\gamma$\n\n```\n$\\gamma(A^m, A^l, A^r) = (\\\
    gamma A^m, \\gamma A^l, \\gamma A^r)$. $$\n```"
