    \ = 2.15, \\rho_1(\\tilde{U}_1, \\tilde{U}_{(3)}) = 1.15,$\n```\n\n```\n\\rho_1(\\\
    tilde{U}_1, \\tilde{U}_{(4)}) = 0.35, \\rho_1(\\tilde{U}_1, \\tilde{U}_{(5)})\
    \ = 0.85,$\n```\n\nwhen $\\tilde{U}=4$.\n\nThe comparative analysis is based on\
    \ examining the representativeness of the median in the encoded Likert and fuzzy\
    \ scales. The mean absolute error (MAE) is considered to quantify this representativeness,\
    \ where in the fuzzy metric $\rho_1$ is used to measure absolute errors.\n\nThe\
    \ study has been performed for 4 different distributions for each of the 4 analyzed\
    \ values. In each of these 4x4 1000 samples of trapezoidal fuzzy numbers have\
    \ been simulated for each considered sample of size $n$. For each sample we have\
    \ computed:\n\n+   - the FMAE(sample). If $\\tilde{x}_1, \\dots, \\tilde{x}_n$\
    \ are the values of $\\mathcal{X}$ in the sample, then\n\n```\nFMAE(sample) =\
    \ \\frac{1}{n} \\sum_{i=1}^n \\rho_1(\\tilde{x}_i, \\text{Me}(\\tilde{x}_1, \\\
    dots, \\tilde{x}_n)),\n```\n\nwhere $\text{Me}(\\tilde{x}_1, \\dots, \\tilde{x}_n)$\
    \ is the 1-norm median of $\\tilde{x}_1, \\dots, \\tilde{x}_n$ (or, equivalently,\
    \ the 1-norm median of a RFN taking values $\\tilde{x}_1, \\dots, \\tilde{x}_n$\
    \ with probabilities $1/n$),\n\n+   - the LMAE(Lsample) (with Likertized sample),\
    \ that is,\n\n```\nLMAE(Lsample) = \\frac{1}{n} \\sum_{i=1}^n ((\\tilde{x}_i -\
    \ \\text{Me}(\\tilde{x}_1, \\dots, \\tilde{x}_n))).\n```\n\nMoreover, along the\
    \ 1000 samples we computed the percentage of samples for which the FMAE(sample)\
    \ was lower than the LMAE(Lsample). Simulation results have been gathered in the\
    \ following tables:"
