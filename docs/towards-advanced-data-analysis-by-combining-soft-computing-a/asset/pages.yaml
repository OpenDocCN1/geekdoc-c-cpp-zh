  md: '# Derivation of Linguistic Summaries is Inherently Difficult


    **Table A** taxonomy of linguistic summaries


    | Type | Given | Sought | Remarks |

    |---|---|---||

    | 1 | $S$ | $Q$ | Simple summaries through ad-hoc queries |

    | 2 | $S$ | $Q$ | Conditional summaries through ad-hoc queries |

    | 3 | $S_{structure}$ | $S_{value}$ | Value oriented summaries |

    | 4 | $Q_{structure}$ | $B_{value}$ | Conditional value oriented summaries |

    | 5 | Nothing | $S$ $K$ $Q$ | General fuzzy rules |


    abstract: in protoform to the right, the particular $K$ is instantiated to “age
    IS young”; in the one to the left, summarizer $S$ is first instantiated to $S_{value}$,
    i.e., the attribute of the summarizer is selected to be “salary” but value is
    not determined; then this protoform is further instantiated to fully specify the
    summarizer using “low” as the value of “salary”. Thus, the more abstract forms
    of protoform correspond to cases in which we assume about the extreme, we (1)
    assume a totally abstract topform, or (2) that all elements of a protoform are
    given, i.e., all attributes and linguistic terms expressing their values. In case
    1 data summarization by a “brute force” search would be extremely time-consuming,
    but might produce interesting, unexpected views on the data. The user is in fact
    guessing a good summary by answering a (fuzzy) query; this is related to ad hoc
    queries.


    This classification may be easily obtained as in Table 1 in 5 base types of linguistic
    summaries are shown, corresponding to protoforms of more or less abstract form,
    $S_{structure}$ denotes attributes and their connection in a summary, $S_{value}$
    denotes the values of the attributes sought.


    Type 1 summaries may be obtained by a simple extension of fuzzy querying. The
    user has to construct a query, a candidate summary, and it has to be determined
    what the fraction of rows matching this query and what linguistic quantifier best
