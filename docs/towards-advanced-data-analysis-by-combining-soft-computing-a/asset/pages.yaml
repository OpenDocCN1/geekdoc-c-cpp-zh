    # 4 Linear and Piece-wise Linear Programming Problems\for T-S Procedure Rule Weights


    To avoid a comparatively unpredictable and very clumpy neural-type training procedures
    for determination of $K_{pi}$ values $\wp_{pi,i}$ in the Takagi-Sugeno (T-S) reasoning
    procedure for pattern recognition, we formulate an objective function maximization
    problem subjected to a set of constraints, constructed according to a certain
    fuzzy experts'' information. The structure of (9) and (10) implies a very simple
    (linear) form of a function to be maximized as well as linearity of constraints.


    According to the pattern recognition description described in the sections 2 and
    3 of this paper, whatever information about the patterns is hidden in the set
    of $\wp$, where $p=1,2,...,r$, and $l=1,2,...,k$. In spite of its fuzziness, a
    enough formulation of the problem for the determination of degrees $K_{pi}$ in
    the Takagi-Sugeno (T-S) reasoning for recognition of objects belonging to the
    pattern can be constructed. Let in select random one representative of the class
    $p$, for example $\alpha_p^N$ (and call it "central" for a simplicity of understanding),
    and to find such $K_{pi}$, $\forall$ that the measure of degree of a certainty
    $\Phi_{pi}(\alpha_p^N)$ of belonging to the selected object $k$ to the pattern
    $p$ would be:


    ```

    $\Phi_{pi}(\alpha_p^N) = \sum_{i=1}^N \alpha_{pi}^N K_{pi} \rightarrow max$

    ```


    and it must be required under following constraints:


    ```

    $\sum_{i=1}^N \alpha_{pi}^V K_{pi} \geq \gamma \sum_{i=1}^N \alpha_{pi}^N K_{pi}
    \quad \forall l$

    ```


    and


    ```

    $\sum_{i=1}^N \alpha_{pi}^U K_{pi} \leq \kappa \sum_{i=1}^N \alpha_{pi}^V K_{pi}
    \quad r \neq p, \quad \forall l$

    ```


    Optimal values of $\gamma$ and $\kappa$ are recommended from the interval $[0,
    1]$, where $\gamma > \kappa$ [8]. Concrete values of those depend on the experts''
    knowledge or guessing the patterns (or classes) (structural) internal connections
    and dispersion of patterns'' features). Physical meaning of the (13) is tightly
    connected with the understanding of "positive-similar" inside the class, and extracting
    of those similarities using the set of "positive rules", as it was mentioned in
    the section 2. Physical meaning of (14) corresponds to the concept of dissimilarities
    between certain pattern (in our case pattern of a class $p$) and all other classes
    $r \neq p$ (or "negative similarities"), and to the process of extracting those
    dissimilar by the set of "negative rules".'
