    # ## 7 Concluding Remarks


    The use of our fuzzy query interface has made possible to operationalize the process
    of definition, updating and processing of fuzzy terms which are meant to exist
    in linguistic data summaries (fuzzy fuzzy, relations, fuzzy quantifiers, etc.),
    and if we limit our attention to linguistic summaries following a special, very
    general longterm, which are meant to be in fuzzy association rules which correspond
    to these special linguistic summaries, then we have developed a mining algorithm
    based on ApriorTID. This is clearly a step towards an effective and efficient
    method for the generation of linguistic data summaries which is badly needed for
    their proliferation in research. Both the use of association rule mining, in which
    much software and experience exists, and our practical experience clearly indicate
    that this approach to the derivation of linguistic summaries may be effective
    and efficient.


