  md: '# Convergence of Heuristic-based Estimators of the GARCH Model


    # 3.1 Asymmetric GARCH


    One of the limitations of the GARCH model described in the equations (1)-(2) is
    the enforcement of a symmetric response to negative and positive market shocks,
    with the magnitude of the shock as the only input. In practice, it has been noticed
    that for equities and equity indexes a negative return has a bigger impact on
    volatility than a positive return of the same size. This asymmetry was explained
    by the *leverage* effect based on the debt-equity ratio. The opposite asymmetry
    are also common for commodity markets. Financial frequency data which are sensitive
    to the current state of the market: Various GARCH extensions have been presented
    previously: A-GARCH (1990), exponential GARCH (1991) (Nelson), GJ-GARCH (1993)
    (Gosten, Jagannathan, Rumble) and Threshold GARCH (1993) (Zaikov). A review of
    these extensions can be found in [1].


    Here, GARCH is considered one of the most complex alternatives. It captures the
    asymmetry through an extra parameter $\lambda$ that depends on an indicator function:
    $I_t=1$ if $\epsilon_t<0$, and 0 otherwise. The conditional equation (2) is rewritten
    as


    ```

    $$\sigma_t^2 = \omega + \alpha\epsilon_{t-1}^2 + \lambda\epsilon_{t-1}^- + \beta\sigma_{t-1}^2$$

    ```


    Parameter estimation is based on the normal GARCH likelihood function (3), but
    $\sigma$ now depends on the additional parameter $\lambda$. The TA solution is
    competitive with the results obtained with commercial software packages such as
    Matlab and Eviews¹. A comparison of the results obtained on the Bollvers and Gyesha
    data is reported in Table 1.


    The convergence of the estimator is empirically established using the framework
    described in section 4. The simulation is based on 50 artificial time series,
    with the TA solution for Bollvers and Gyesha time series in (8) as DGP step, different
    values for sample size $T$, four values for the number of iterations $I$, and
    10 restarts for each of the 1,200 combination settings. The true parameter vector
    is given:


    ```

    $$\psi_{TR} = [\psi_{TR},..,psi_{TR}] = [0.007564, 0.011786, 0.029426, 0.144650,
    0.079492]$ (8)

    ```


    Figure 1 illustrates the convergence of the maximum towards the true values when
    the sample size increases. For evaluation purposes, the regression parameters
    in equation (6) have been estimated.


    The results are summarized in Table (a), where the individual impact of the sample
    size $T$ is identified by fixing the number of iterations $I$ at different values,
    as described in the first column. The results imply there an


