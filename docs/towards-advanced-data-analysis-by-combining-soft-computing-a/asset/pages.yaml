  md: '# 3.2 Basic Features for Video Classification


    The set of features related to video quality was adopted from the work of Culibrk
    et. al. [5].


    The approach proposed in [5] attempts to estimate salient motion in frame of the
    sequence by performing background subtraction at several scales. The scaled frames
    are obtained from a frame of the sequence by performing spatial Gaussian filtering
    and decimation to get the next scale. This yields a representation of each frame
    of the sequence in the form of a Gaussian pyramid. The process is applied to background
    frames to eliminate small changes and summed up to form a single saliency map.
    Outlier detection is used to determine which parts of the map are salient and
    which are not. Even with a small number of scales (3-5), the approach is moving
    objects in the sequence case of Dyvoks database, which corresponds to the dynamic-texture
    regions of the frame. The process is illustrated in Figure 3.


    Once the salient parts of the frame have been determined several basic features
    are used to describe the salient motion in a frame: number of salient regions,
    their average size, and first moments (mean and standard deviation) of the difference
    between the current frame and background frames, calculated separately for salient
    and non-salient regions.


    ![](img/8a465c42e0c636291262a00bcc7a9b11_261_0.png)


    Fig. 3. Salient-motion region segmentation.


