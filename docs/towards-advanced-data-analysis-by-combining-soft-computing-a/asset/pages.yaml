  md: '# Bootstrap Confidence Intervals for the Parameters of a Linear Regression
    Model with Fuzzy Random Variables


    Maria Brigida Ferraro¹, Renato Coppi¹, and Gil González-Rodríguez²


    **Abstract** Confidence intervals for the parameters of a linear regression model
    with a fuzzy response variable and a set of real and/or fuzzy explanatory variables
    are investigated. The family of LR random variables is considered and an appropriate
    metric is suggested for coping with this type of variables. A class of linear
    regression models is proposed for the center and for suitable transformations
    of the spreads in order to satisfy the non-negativity conditions for the regression
    parameters are introduced and discussed. Since there are no suitable parametric
    sampling methods for imprecise variables, a bootstrap approach has been used.
    The empirical behavior of the procedure is analyzed by means of simulated data
    and a real-case study.


    # 1 Introduction


    The study of relationships between variables is a crucial issue in the investigation
    of natural and social phenomena. In particular relevance, here is the analysis
    of the link between a “response” variable, $Y$, and a set of “explanatory” variables,
    $X_1, ..., X_p$.$\nWhen approaching this problem from a statistical viewpoint,
    we realize that several sources of uncertainty arise after the analysis. These
    concern:

    a) sampling variability; b) partial or total ignorance about the kind of relationship
    between $Y$ and $(X_1, ..., X_p)$; c) imprecision/vagueness in the statistical
    data concerning these variables are measured (see, [2] for a detailed examination
    of the various sources of uncertainty in Regression Analysis).


    ¹ Dipartimento di Scienze Statistiche SABIENZA Università di Roma, Italy,\ {maribrigida.ferraro,renato.coppi}@uniroma.it\n²
    Departamento de Statistica e I.O. y D.M., Universidad de Oviedo, Spain, gil@uniovi.es


    C. Borget et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 33-42.\n©
    Springer-Verlag Berlin Heidelberg 2013\nspringerlink.com'
