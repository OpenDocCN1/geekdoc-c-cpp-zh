    \ \text{cl}\\{x \\in \\mathbb{R} \\mid \\tilde{U}(x) > 0\\}$, is a nonempty compact\
    \ interval. Each $x \\in \\mathbb{R}$, $\tilde{U}(x)$ can be interpreted as the\
    \ degree of compatibility of $x$ with $\tilde{U}$. The space of bounded fuzzy\
    \ numbers is denoted by $\\mathcal{F}_n^*(\\mathbb{R})$.\n\nIn ‘measuring’ opinion,\
    \ valuation, rating, etc., some strengths of the scale $\\mathcal{F}_n^*(\\mathbb{R})$\
    \ should be stressed, namely:\n\n+   - it is much more than an (ordinal) categorical\
    \ scale and more than integer encoding;\n- the transition from one value to another\
    \ is more gradual than abrupt;\n- numerical/interval-valued data are special instances\
    \ of fuzzy data: the usual arithmetic and changes between values in this scale\
    \ pay attention explicitly or implicitly to the ‘location’ and ‘shape/precision’\
    \ of values (which are crucial for their meaning and application).\n\nFurthermore,\
