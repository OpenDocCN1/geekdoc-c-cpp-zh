  md: '246 O. Georgieva


    ```

    $J = \sum_{i=1}^N \sum_{k=1}^N \mu_{ik}^n d_{ik}^2, \quad (7)$

    ```


    Here $\mu_{ik}$ is the membership degree of $k$-th data to the $i$-th cluster.
    The clustering obtains a vector $\mathbf{v} =v_1, v_2, \dots, v_c]$ of cluster
    centers. The scalar parameter $m$ determines the fuzziness of the results. Usually
    $m=2$ [3], [4].


    Oblong clusters with different orientation in the space typically character-ize
    the phases of the reliability growth. Most appropriate distance norm in this case
    is Gustaf-Kessel [9]:


    ```

    $d_{ik}^2 =(\mathbf{z}_k - \mathbf{v}_i)^T A_i (\mathbf{z}_k - \mathbf{v}_i),
    \quad (8)$

    ```


    where the norm inducing matrix $A_i$ is symmetric and positive:


    ```

    $A_i = [det(F_i)]^{1/n} F_i^{-1}. \quad (9)$

    ```


    Main feature of the obtained partition is the local adaptation of the distance
    metric to the cluster under the covariance matrix $F_i$:


    ```

    $F_i = \sum_{k=1}^N \mu_{ik}^n (\mathbf{z}_k - \mathbf{v}_i)^T (\mathbf{z}_k -
    \mathbf{v}_i) / \sum_{k=1}^N \mu_{ik}^n. \quad (10)$

    ```


    Batch application of the clustering procedure i.e. when data are off-line avail--able,
    alternately iterates to determine the membership degree


    ```

    $\mu_{ik} = \frac{\sum_{j=1}^c \mu_{ij}^n \mathbf{z}_j}{\sum_{j=1}^c \mu_{ij}^n}
    \quad (11)$

    ```


    and the cluster center


    ```

    $\mathbf{v}_i = \frac{\sum_{k=1}^N \mu_{ik}^n \mathbf{z}_k}{\sum_{k=1}^N \mu_{ik}^n}
    \quad (12)$

    ```


    # 3.2 Parameter Estimation


    As model structure is recognized the model coefficients have to be estimated interdependently
    on the clustering parameters (11) and (12). The vector of consequent coefficients
    $Q=(Q_1, \dots, Q_c)$ appears linearly in the matrix model output description.
    Its value could be easily defined by applying the linear least square method (LLSM).
    For instance, the authors of [3] accepted LLSM to solve the off-line modeling
    task. Recursive version of LLSM is accepted in case of adaptive model implementation
    [2].'
