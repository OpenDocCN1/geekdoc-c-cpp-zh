  md: "# SAFD — An R Package for Statistical Analysis of Fuzzy Data\n\n![](img/8a465c42e0c636291262a00bcc7a9b11_116_0.png)\n\
    \n**Fig. 2** The two fuzzy numbers (gray), their mean (black), and their Bertoluzza\
    \ distance $d_{1/3}(X, Y)$ in Example 1\n\napproach described in [4] which essentially\
    \ imitates the Fourier series representation of every element in a Hilbert space\
    \ w.r.t. an orthonormal basis. More precisely, given an input dataframe $V$ in\
    \ the correct format (which will be the expectation of the simulated FRV) first\
    \ **decomposer($V$)** is called and the resulting dataframe contains the ‘coordinates’\
    \ of $V$ with respect to a basis (see [4]). These ‘coordinates’ are perturbed\
    \ stochastically in order to generate a new fuzzy number. The distributions used\
    \ for these perturbations can be selected in the call of the function, however,\
    \ in the current version 0.3 only a few choices are possible: (1) The perturbation\
    \ of the centre of the left part follows the form $N(a, \\sigma)$ or $U(-a, a)$\
    \ with $\\sigma > 0$. (2) The perturbation of the left part of the fuzzy set **pertL**\
    \ has (3) The perturbation of the right part of the fuzzy set **pertR** has to\
    \ be of the same form as that for the left part. A precise description of the\
    \ procedure can be found in [4].\n\nThe code in the following example generates\
    \ samples $X_1, X_2, \\dots, X_n$ ($n=10, 100, 10000$) of a fuzzy random variable\
    \ $X$ with expectation $V$=translator(\\{33\\}, 101) using the default perturbations\
    \ in the **generator** function, calculates $d_{1/3}(V, X_n)$ and plots the first\
    \ ten sample elements and $\\hat{\\Lambda}_n$.\n\n**Example 2:**\n\n```\nn <-\
    \ length(matrix(c(1,2,3,4), 2, 2, byrow=TRUE), respect=TRUE)\nV<-translator({33},\
