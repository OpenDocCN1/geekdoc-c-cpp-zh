  md: '# Lasso-Type and Heuristic Strategies in Model Selection and Forecasting


    ![](img/8a465c42e0c636291262a00bcc7a9b11_177_0.png)


    **Fig. 2** Forecast accuracy in relation to AR(2) (RMSFE in relation to AR(2))


    Based on these findings, several questions emerge naturally that we will consider
    in future. In particular, we will test whether larger sample sizes improve the
    relative performance of information criteria based selection as these criteria
    are asymptotically constant. Furthermore, we will study a situation with a larger
    number of relevant regressors in the model. Finally, further real applications
    will be studied to learn about performance gains to be expected when moving away
    from simplistic univariate time series models.


