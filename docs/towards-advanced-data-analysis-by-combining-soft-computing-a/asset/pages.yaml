  md: 'instruments of this type is known as catastrophe bond (Act-of-God bond, cat
    bond, see e.g. [7]).


    Pricing of catastrophic bonds is not a widely discussed subject in mathematical
    finance. However, many authors emphasize advantages of cat bonds. In financial
    literature one can find simplified pricing methods (see [1, 8]) or other approaches,
    which also have their limits (see [8]) or are not strictly mathematically (see
    [23]). There are several advanced stochastic pricing methods in discrete and continuous
    times. In some of them the utility function is inappropriate for the risk model
    (see [5, 21]). However, choosing a well-suited utility function can be an additional
    problem in practice. An interesting approach was proposed by Vaugierd in [22].
    The author applied the martingale method for cat bonds pricing. He overcame the
    problem of incompleteness of Merton''s market and non-traded insurance-linked
    underlyings in [13].


    This paper is dedicated to the problem of catastrophe bond pricing with a stepwise
    payoff. We continue and extend the Vaugierd''s approach. Analogously to the author,
    we used the martingale method. We find interest pricing formulas, considering
    the Vasiceck and the Merton risk-free spot rate dynamics. We assume no independence
    between catastrophe occurrence and behaviour of the financial market. There is
    a need to take into account possible errors and uncertainties which arise from
    estimation of the financial market parameters. In order to price catastrophe bond
    in case of precise data we apply fuzzy parameters of the interest rate processes.
    Then the Monte Carlo simulations based on the obtained fuzzy pricing formulas
    are carried out. In the Vasiceck interest rate model, we continue our considerations
    from [16]. However, in this paper, we reveal world data describing catastrophic
    events are.


    This paper is organized as follows. In Section 2 we present some preliminaries.
    In Section 3 we define aspects of catastrophe bonds, especially with a stepwise
    payoff function. In Section 4 we present the general cat bond pricing and we price
    the considered type of catastrophe bond. In Section 5 we conduct simulations in
    order to find appropriate prices for the fuzzy approach. We conclude the paper
    in Section 6.


    # 2 Preliminaries


    # 2.1 Fuzzy and Interval Arithmetic


    In this section we recall some basic facts about fuzzy sets and numbers.'
