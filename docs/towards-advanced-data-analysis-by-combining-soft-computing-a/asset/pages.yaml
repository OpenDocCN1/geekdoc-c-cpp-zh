    # 4 When the Meaning of the Model Affects Results


    The reader may consider that the three above interpretations of random sets are
    just a philosophical issue, but do not impact on computations that can be carried
    out with this model. For instance the mean interval of a random interval has the
    same definition (interval arithmetic or Aumann integral) independently of the
    approach. This is not true for other concepts. Two examples are: conditioning
    and variance.


    # 4.1 Conditioning Random Sets


    Given a random set in the form of a probability distribution on the power set
    $S$, and an event $A \subseteq S$, the proper method for conditioning the random
    set $A$ depends on the adopted scenario.


    Conditioning a conjunctive random set In this problem comes down to restricting
    the set-valued realizations $X(\omega)$ so as to account for the information that
    the set-valued outcome lies inside $A$. Then the obtained conjunctive random set
    is defined by the standard of Bayes rule in the form of its distribution $p_X(-A)$
    such that:


    ```

    $p_X(C|A) = \begin{cases} \sum_{\omega \in C} p_X(\\omega)/P(A) & C \subseteq
    A; \ 0 & \text{otherwise.} \end{cases}$

    ```


    Conditioning an ill-known random variable Suppose the epistemic random set $X$
    relies on a probability $\Omega$, and is represented by the convex set of probabilities
    $P_X$ on $S$, one of which is the frequentist distribution of the underlying random
    variable $x$. Suppose we study a case for which all we know that $x \in A$. The
    problem is to predict the values of $x$. Each probability $p_X(E)$ should be reused
    in order to restrict to the subset $\Omega_A = \{\omega : x(\omega) \in A\}$ of
    population $\Omega$. However, because $x(\omega)$ is only known to lie in $X(\omega)$,
    the set $\Omega_A$ is itself ill-known. There are three situations:'
