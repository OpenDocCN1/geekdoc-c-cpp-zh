  md: '# Mining Local Connectivity Patterns in fMRI Data


    cuboid of a voxed $v$ is detected by $C_{27}(v) = \{v \cup N_{20}(v)\}$ and we
    only consider voxels with a complete cuboid neighborhood.


    A natural approach would be to calculate the average of Pearson''s correlation
    coefficient of all $\alpha_{27}=351$ voxels pairs within an enclosing cuboid.
    However, each individual correlation—and thus their mean—might be considered prone
    to noise. Especially if there are some voxels that do not participate in the joint
    activity and thus have low correlations with the other voxels, an existing co-activity
    pattern may not be discernible.


    Therefore, instead of counting correlations by averaging, we try to obtain a more
    robust measure by integrating the values of $\alpha$ 27 voxels at each point in
    time. To be more precise, our idea is to find for each voxel''s enclosing cuboid
    $C_{27}(v)$ those points in time that exhibit synchronous activity of at least
    certain (user-specified) number of voxels. Formally, we have


    ```

    $LCM_{\alpha}^B(v) = \frac{1}{T} \sum_{w \in C_{27}(v)} H((d_{w,t} - \alpha))$

    ```


    where H is the Heaviside step function, ''LCM'' stands for ''local connectivity
    measure'' and the upper index B indicates that it is based on binary time series
    $d$. The measure is normalized by $x, t, T$ the length of the time series, in
    order to facilitate comparison between data sets of different length. The parameter
    $\alpha \in \{1, \dots, 27\}$ captures the fault-tolerant aspect of this measure:
    Given a cuboid and a point in time, a active voxels for the corresponding density
    add become equal to one (and thus contribute positivity to the co-activity measure).


    For functionally independent voxels we expect to see 13-14 active voxels at each
    point in time, because with our discretization scheme (active above and inactive
    below the median) each voxel is active at half of the voxels in a cuboid in time
    and therefore half of the average. As a consequence, $\alpha$ should be chosen
    greater than 14. However, the choice of $\alpha$ depends on the level of noise
    present in the data and the contrast between functionally connected and functionally
    independent 27-cuboids.


    Clearly, the number of active voxels can be expected to be significantly higher
    than 14 in points in time showing co-activity at a lower average number of co-active
    voxels. In addition, it is plausible to assume that functionally connected voxels
    also exhibit co-inactivity, that is, points in time at which only a relatively
    low number of voxels are active. This can be exploited to enhance the contrast
    of the measure by defining


    ```

    $LCM_{\alpha}^B(v) = LCM_{\alpha}^B(v) + (1 - LCM_{28-\alpha}^B(v))$

    ```'
