    # 3.2 GARCH(p,q)


    GARCH(p,q) allows for additional lags both for the ARCH(p) and for the GARCH(q)
    factor. The ARCH factor measures the reaction to market shocks, while the GARCH
    factor measures the persistence of volatility. Engle (2001) recommends this extended
    version for very long time series, tens of daily data or years of intra-day data.
    In this case, the standard conditional volatility equation (2) becomes:'
  merge: -1
