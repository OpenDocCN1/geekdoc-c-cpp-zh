    \ data makes this not always convenient when summarizing the information given\
    \ by interval-valued data sets.\n\n# 3 The Median of a Random Interval Defined\
    \ Through $L^1$ Metric\n\nThe Aumann expectation of a random interval is not robust\
    \ enough which is the motivation for extending the concept of median. Nevertheless,\
    \ the non-existence of a universally accepted total order in the space $K_c(\\\
    mathbb{R})$ does not allow us to define it as a ‘middle’ position. In real settings\
    \ another approach is to define the median as the value with the smallest mean\
    \ Euclidean distance to the values of the real-valued random variable. Then, an\
    \ $L^1$ metric between intervals which expected distance is required in order\
    \ to define the median as the interval with the smallest mean distance to the\
    \ values of the random interval. The two $L^1$ metrics between intervals introduced\
    \ before this condition, the definition of the median through both is now formalized.\n\
    \n**Definition 1.** The $d_{H,\theta}$-median (or median) of a random interval\
    \ $X:\\Omega \to K_c(\\mathbb{R})$ is (are) defined as the interval $Me[X] \\\
    in K_c(\\mathbb{R})$ such that:\n\n```\n$d_{H,\\theta}(X,Me[X]) = \\min_{K \\\
    in K_c(\\mathbb{R})} d_{H,\\theta}(X,K), \\quad (1)$\n```\n\nif these expected\
    \ values exist.\nA very practical result that guarantees the existence of the\
    \ median and allows to compute it is the following. Given a probability space\
    \ $(\\Omega, \\mathcal{A}, P)$ and an associated random interval $X$, the minimization\
    \ problem (1) has at least one solution, given by any nonempty compact interval\
    \ that:\n\n```\n$mid[X]=me(mid(X)), \\quad spr Me[X]=me(spr(X)).$\n```\n\nIt can\
    \ immediately see that the $d_{H,\\theta}$-median is not unique if either mid(X)\
    \ or spr(X) (which are medians of real-valued random variables) are not unique.\
    \ It should be pointed out that the chosen solution does not depend on the value\
    \ chosen though the mean error.\nAnalogously, the median can be defined by the\
    \ means of the 1-norm metric:\n\n**Definition 2.** The $\rho_1$-median (or medians)\
    \ of a random interval $X:\\Omega \\to K_c(\\mathbb{R})$ is (are) defined as the\
    \ interval(s) $Med[X] \\in K_c(\\mathbb{R})$ such that:\n\n```\n$$\\rho_1(X,Med[X])\
    \ = \\min_{K \\in K_c(\\mathbb{R})} \\rho_1(X,K), \\quad (2)$\n```\n\nif these\
    \ expected values exist."
