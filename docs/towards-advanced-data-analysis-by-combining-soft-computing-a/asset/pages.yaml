    \ a clustering method has been suggested by González-Rodríguez et al. [36]. The\
    \ goal has to cluster k independent means by RFS focusing on fuzzy means. The\
    \ procedure is iterative and it uses the multi-sample (ANOVA) bootstrap tests\
    \ in [34] and [37]. For an arbitrarily sized data the method determines groups\
    \ as follows: for any two clusters there exist elements in them for the fuzzy\
    \ means are significantly different; and for all RFS in the same cluster fuzzy\
    \ means could be considered to coincide (i.e., there is not enough sampling evidence\
    \ to consider rejection of the null hypothesis of equality of the means at the\
    \ given level). An objective criterion leading to statistically equal groups different\
    \ from each other has also been presented, and simulations have been carried out\
    \ (following ideas at the Section 2) to show the performance of the suggested\
