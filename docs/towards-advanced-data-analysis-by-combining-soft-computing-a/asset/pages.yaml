    The rest of the paper is organized as follows: Section 2 deals with the relevant
    work. Section 3 describes the methodology proposed. Section 4 diseases experiments
    performed and results achieved. Section 5 is dedicated to our conclusions.


    # 2 Related Work


    # 2.1 Dynamic Texture Classification


    The research into classification and recognition of dynamic textures continues
    been proposed over the last ten years. [26]. A large number of approaches in their
    2006 survey Chevetkovov and Péteri [4] divided the existing approaches into five
    classes: methods based on optical flow, methods computing geometric properties
    in the spatiotemporal domain, methods based on local spatiotemporal transforms
    and methods estimated model parameters as features. Regardless of the approach,
    they attempt to extract features of the dynamic texture and classify them by either
    defining a suitable distance measure and creating a simple distance-based algorithm
    for comparison or training a machine learning algorithm to achieve the task.


    In their 2007 paper [26], Zhao and Pietinen proposed volume local binary patterns
    (VLBP) as features to describe dynamic textures. The VLBPs are an extension of
    the LBP operator widely used in ordinary texture analysis, that combine motion
    and appearance. They tested their approach using videos'
