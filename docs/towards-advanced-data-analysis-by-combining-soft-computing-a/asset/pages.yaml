    The computation of such integrals can be difficult due to the intractable nature
    of the non-linear functions. A solution to the problem of intractable integrals
    is to adopt numerical integration methods such as the Monte-Carlo approach. Unfortunately,
    significant computational efforts may be required to achieve a sufficiently accurate
    approximation.


    In addition to the Monte-Carlo approach, another standard and general practice
    for estimating hyperparameters is the maximum-likelihood estimation, i.e., to
    minimise the negative log-likelihood function:


    ```

    $$\mathcal{L}(\Theta) = -\frac{1}{2}\log(|K|) - \frac{1}{2}y^T K^{-1}y - \frac{N}{2}\log(2\pi)$

    ```


    As the likelihood is, in non-linear and multi-modal, efficient optimisation usually
    entail the gradient information. The derivative of L with respect to each of the
    parameters is as follows


    ```

    $$\frac{\partial\mathcal{L}}{\partial\theta_i} = \frac{1}{2}\text{trace}(K^{-1}\frac{\partial
    K}{\partial\theta_i}) + \frac{1}{2}y^T K^{-1}\frac{\partial K}{\partial\theta_i}K^{-1}y$.

    ```


