  md: '# Dynamic Graphs in Social and Neural Networks


    # 2.1 Butterworth Filtering


    Representing the structure of a social network not only by the friendship relation
    (nodes represent persons, even if they friended each other), which results in
    a more or less static description of the graph, but also by adding weights to
    edges such where between two corresponding nodes, the weight reflects the amount
    of activity between this activity. Event-based weighting of edges in a social
    graph could be accomplished by storing all the timestamps at which events between
    two nodes occurred. Obviously this approach proved unfavorable very soon due to
    the amount of memory required for such procedure. An additional disadvantage of
    such approach would be that, while we can make statements about the point in time
    when an event occurred. If possible at all, we can roughly estimate the current
    weight that should be assigned to an edge at a given point in time. Operational
    would be able to adapt to a problem with this major drawback, that only a small
    time frame can be used to determine the current average no further information
    about the past is available only if such a value is restricted


    From electronic processing the Butterworth filter is a well-known variant of an
    impulse response filter that produces an output signal as response to its input
    without causing the ripping effects which other filters suffer. In general a filter
    is defined by two sets of coefficients $B$ and $A$ and the filter''s response
    $y$ for a signal $x$ at an edge $n$ can be obtained by


    ```

    $y_n = \sum_{i=1}^{n_b} b_i \cdot x_{n-(i-1)} - \sum_{j=2}^{n_a} a_j \cdot y_{n-(j-1)},

    {b_1, \dots, b_{n_b}} = B \text{ and } {a_1, a_2, \dots, a_{n_a}\} = A.$

    ```


    This recursive representation makes it possible to avoid accumulating all signal
    values from negative to positive infinity.


    Other parameters that influence the shape of the resulting curve are considered
    are:


    +   * Step width: Amount of milliseconds falling into one time bin

    * Grade: The grade of the filter determining the two $B, A$ of coefficients for
    the shape of the resulting filter response. The number of coefficients depends
    directly on the grade and describes how many past signal (and response) values
    are considered for the calculation.

    * Messages: During preprocessing of the data only certain edges were included
    in the graph depending on how many messages were sent in total.'
