    ods also have to cope with other problems connected to overfitting. First of all,
    as long as there are not too many attributes, larger subsets of attributes tend
    to give a better performance than smaller ones, although this might be an effect
    of overfitting – for instance the performance of the derived data mining model
    on a test set – should differ from the overall performance measure for the final
    model. Otherwise, overfitting with respect the test data set might happen.


    One could apply feature selection techniques to granularity level selection. This
    concept is illustrated in Figure 1 which would, however, lead to the same problems
    mentioned above as for filter and wrapper methods. Even worse, there is, of course,
    although a high correlation between different levels of granularity of the attribute.


    ![](img/8a465c42e0c636291262a00bcc7a9b11_332_0.png)


    Some data mining techniques carry out – least partially – their own feature selection
    strategies while constructing the model. Decision and regression trees are examples
    for such methods. Their online selection of the attributes is based on the greedy
    strategy which the tree is constructed. At each node of the tree during the construction,
    the attribute is chosen that leads to the best result with the suitable performance
    measure.


    In this paper, we focus on decision and regression trees to carry out granularity
    level selection during the construction of the tree. This integrated approach
    to granularity level selection is illustrated in Figure 2.


    However, if we would simply allow the tree to choose in each of its nodes the
