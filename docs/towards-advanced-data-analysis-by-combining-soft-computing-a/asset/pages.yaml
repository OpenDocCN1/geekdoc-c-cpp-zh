  md: '# Decision and Regression Trees and Different Attribute Granularity Levels


    The minimum description length principle (MDL) (for an overview [4]) is an alternative
    approach to avoid overfitting. MDL is based on the fundamental idea that any regularity
    in a data set can be used to compress the data. Compression means to describe
    the data with fewer symbols than the number of symbols which are needed to describe
    the data literally. The description of the regularity is given by the model. The
    more regularities in the data set exist, the more the data can be compressed.
    In this sense, MDL relates to "finding regularities" in the data.


    Therefore, the MDL principle is used in different ways of inductive inference
    such to choose a model with a good trades-off between the observed data set and
    the complexity of the model.


    In this paper, we focus on supervised learning where the value of a target attribute
    is to be predicted on the basis of other predictor attributes. The compression
    of the data consists in this case of two parts.


    +   The coding of the model (here: the regression or decision tree) and the corrections
    for deviations of the value predicted by the model and the target value.


    A complex model – a complex regression or decision tree – will need a longer coding
    for the model itself, but with little or no corrections for the predictions whereas
    a simple model has short coding which requires a larger number or larger corrections
    for wrong predictions. MDL favours the model with the shortest coding of the model
    together with the corrections, so that a compromise between an extremely simple
    model with little precision and an overfitted complex model will be chosen.


    # 3.2 Regression and Decision Trees


    Regression and decision trees [2] are tree-based models for the prediction of
    numerical and categorical attributes. Each node in the tree corresponds to an
    attribute. Depending on the value of the attribute, the path is followed along
    the corresponding successor node which either corresponds to another attribute
    or to leave node which contains the predicted value.


    Regression and decision trees are usually constructed by a greedy strategy. The
    root of the tree is the attribute that gives the improvement in terms of prediction.
    For decision trees, very often remaining after entropy splitting the data with
    respect to the attribute in the node is used as a measure for the predictive power
    of the attribute with the smallest remaining entropy being chosen as a root node.
    Successor nodes are treated in the same way until a unique prediction can be made,
    no attributes left, not enough data end up in the corresponding node or some stop
    criterion like the maximum depth of the tree is reached. Regression trees are
    built in the same way, except that not entropy, but the sum of the absolute or
    squared'
