  md: 'even if it can be ill-known. On the other hand the daily rainfall in a specific
    place is a stochastic variable, since it can be modelled by a probability distribution.
    An epistemic set then captures in a rough way information about a population via
    observations. For instance, there is a sample $\Omega$, and $x$ can be a random
    variable taking values on $S$, the probability distribution on $\Omega$ is unknown.
    All that is known is $x(\omega) \in E$, that $P_x(E) = 1$ where $P_x$ is the probability
    measure of $x$. In case, $E$ defines the family $P_E$ of objective probability
    measures on $\Omega$ such that $P(\omega: x(\omega) \in E) = 1$. In this case,
    the object $E$ refers to no precise value of $x$, but a probability measure $P_E$
    describing the variability of $x$.


    Note that in the probabilistic literature, an epistemic set is more often than
    not subjective probability. Laplace in the early 19th century proposed to use
    a uniform probability on $E$, based on the insufficient reason principle, through
    which whatever is possible is equiprobable. This is a default in $P_E$ that coincides
    with the probability distribution having maximal entropy. However, this approach
    makes sense if $x$ is a random variable. In case $x$ is an ill-known deterministic
    value, Bayesians [35] propose to use a subjective probability over set $E$. In
    that case, the occurrence of $x$ is not a matter of repetitions, $P_x^*(A)$ is
    the price of a lottery ticket by an agent who agrees to pay $1 if $A$ turns out
    to be true, in an uncertain scenario where the bookmaker exchanges rules to propose
    prices $p^*$ that sum exactly to 1 over $E$. Then $P_x^*(A)$ measures the degree
    of belief of the (non-representable) $x \in E$, and this degree is agent-dependent.


    However clear this view is debatable let us summary of critiques. Specifically,
    this representation is unstable if $P_x^*$ is uniform on $E$, may fail to be out
    of $E$ and the image $f(E)$ does not contain the same number of elements as $E$,
    or if $f$ is not a linear transformation. Moreover, the use of unique probability
    distributions to represent itself is challenged by experimental results (like
    Ellsberg paradox [4]), which shows that individuals do not make decisions based
    on expected utility in partial of ignorance.


