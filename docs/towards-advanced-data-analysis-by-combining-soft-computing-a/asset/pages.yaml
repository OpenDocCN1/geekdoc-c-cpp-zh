  md: '# Dynamic Data-Driven Fuzzy Modeling of Software Reliability Growth


    # Simulation of Single Release Models


    TS type models in the form of the rule system (5)-(6) have been identified separately
    for respective release data sets. Simulation curves present concave behavior (Fig.
    1). Due to the specificity of the task the overestimation of the data is preferred
    than underestimation. It can be noticed that the model accuracy is acceptable
    in the beginning of the process when high detecting rate occur. In the phase of
    asymptotic behavior of each model the performance is better than in the first
    stage. It is explained by the increased number of data, that benefit the accuracy
    of the identified model. We are interested in the number of release follows after
    certain test time.


    The model performance was evaluated through model absolute error (Max error) and
    root mean square error (RMSE) presented in Table 1. Cluster values defined off-line
    as as their final values at real simulation are better.


