    features and (ii) the best features to be selected [28]. An effective selection
    method can minimize the classification error, improve the prediction accuracy,
    and also discover the relevant features. From this point of view, it is possible
    to say that feature subset selection is a multi-objective optimization problem.
    Recently, the multi-objective feature selection (MOFS) problem was addressed in
    many studies. [14], the feature selection problem is seen as a multi-objective
    problem and the Niched Pareto Genetic Algorithm (NPGA), which uses a community-based
    crossover operator, is applied to solve the MOFS problem. A variant of NPGA with
    a nearest neighbor classifier is applied to solve MOFS in [13], the application
    of the Multi-Objective Genetic Algorithm (MOGA) is proposed for feature subset
    selection on a number of neural and fuzzy models together with fast evaluation
    techniques. MOGA was used with different classifiers, namely fuzzy classification
    [8], backpropagation networks [19], and support vector machines [5], to solve
    the MOFS problem. There are some studies on the use of the nondominated sorting
    algorithm (NSGA), first proposed in [26], for MOFS with different wrappers, such
    as neural networks [23] and decision trees [3], different data sets in [22, 10,
    18], the nondominated genetic algorithm II (NSGA-II), of the most efficient multi-objective
    algorithms, was used to solve the MOFS problem using different classification
    methods.


    Archived multi-objective simulated annealing (AMOSA), which was proposed in [3],
    is an efficient multi-objective version of the simulated annealing algorithm,
    based on Pareto dominance. AMOSA incorporates a novel concept of the amount of
    dominance, in order to determine the acceptance of a new solution, as in NSGA-II.
    AMOSA was mainly used for continuous multi-objective problems, except in [3] where
    it was applied to gene selection. In this chapter, AMOSA was adapted for the feature
    selection problem, and it is called Modified AMOSA.


    Direct search (DMS) is a novel MOO algorithm proposed in [9]. This method is inspired
    by the search/poll paradigm of direct-search methods of the directional type and
    uses the concept of Pareto dominance to maintain a list of non-dominated points
    (from which the new iterates or points are chosen). The aim of this method is
    to generate as many points in the Pareto front as possible from the polling process
    itself, while keeping the whole framework general enough to accommodate other
    discriminating strategies. This chapter presents a comparison of derivative-free
    multi-objective algorithms, which are NSGA-II, Modified AMOSA and DMS, for the
    feature selection problem with two objectives: minimizing the number of features
    and minimizing the misclassification rate. The chapter is organized as follows:
    the next section presents a multi-objective formulation of the feature selection
    problem and a brief description of fuzzy modeling for classification. The derivative-free
    multi-objective algorithms for MOFS, namely NSGA-II, Modified AMOSA and DMS, are
    presented in Section 3. In Section 4, the'
