- img_proc: true
  md: '# Data Detection Based on the Distribution of p-Values


    data distributions at different time points – in the case of the $\chi^2$-test
    – or comparison of the mean values – in the case of the $t$-test – would indicate
    a change in the data stream.


    +   * Time window techniques: by this approach the data stream is divided into
    time windows. A sliding window can be used as well as non-overlapping windows.
    In order to detect potential changes, we need either to compare data from an earlier
    window with data from newer one or to test only the new data (for instance, whether
    the data follow a known or assumed distribution).


    However, the problem of multiple testing should be taken into account when more
    than one hypothesis is tested simultaneously. The more hypotheses are tested,
    the more likely the null hypothesis of no change will be erroneously rejected,
    even if the underlying distribution does not change over time. In this work we
    present different approaches to solve this problem. One is the application methods
    for multiple testing using the known Bonferroni correction or Holm-Sidak method.
    Furthermore, we propose a new approach based on the distribution of p-values.


    This paper is organised as follows. The problem of multiple testing is explained
    in Section 2. Classical methods to handle the problem of multiple testing are
    also described in this section. In Section 3 the theoretical background-on p-values
    is given and a new approach based on the distribution of p-values under the null
    hypothesis is introduced. Examples are discussed in the experimental section 4.


    # 2 Multiple Testing


    Multiple testing refers to the application of a number of tests simultaneously.
    Instead of a single null hypothesis, tests for a set of all hypotheses $H_0, H_1,\dotsH_n$
    are used. These null hypotheses do not have to exclude each other.


    An example for testing is whether we test $m$ random variables $X_1,\dotsX_m$
    are pairwise independent. This means the null hypotheses are $H_{1,2},\dotsH_{m-1}$,
    which states that $X_i$ and $X_j$ are independent. Multiple testing leads to the
    undesired error of accumulating the $\alpha$-error.


    > **Definition 1.** The $\alpha$-error is the probability to reject the null hypothesis
    erroneously, given it is true.


    Choosing $\alpha = 0.05$ means that in $5\%$ of the cases the null hypothesis
    would be rejected, although it is true. When $k$ tests are applied to the same
    sample, the error probability for each test is $\alpha$. Under the assumption
    that the null hypotheses are all true and the tests are independent, the probability
    that at least one test will reject its null hypothesis erroneously is'
