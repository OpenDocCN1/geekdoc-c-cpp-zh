  md: '# Stochastic Convergence Analysis of Metaheuristic Optimisation Techniques


    Therefore, it would be advisable to advise our point estimate with a confidence
    interval showing how the success rate is expected to vary beyond our experimental
    data. Generally, an analytical formula for the confidence interval is hard to
    derive, the exact distribution of the rate is unknown in finite samples. One could
    rest on asymptotic theory and assume that the hit rate is normally distributed.
    Despite the fact the hit rate is a non-negative quantity, extensive simulation
    experiments show that this normality assumption is rather poor some algorithmic
    restarts


    In this chapter, we apply bootstrapping to estimate the finite-sample distribution
    of the hit rate. Bootstrapping is a relatively simple method for deriving measures
    of variability for sample estimates. It relies on resampling (see [2] for more
    information). The bootstrapping procedure applied in this study for calculating
    confidence intervals is analytically described in the sequel.


    Let $d_m$ be a real-valued variable showing the percentage deviation from the
    GO of the best solution in the $m$th run, where $m=1, ..., M$ and $M=100$ in our
    case. The empirical rate $f(x)$ is defined as $f(x) = (1/M)\sum_{m=1}^M 1_{\{d_m
    \le x\}}$ where $x$ is the threshold and $1_{\{\}}$ is the indicator function.
    We draw $B-1=499$ sets of hypothetically observed deviations $d_m^b, m=1,...,B;
    b=1,...,B$ by randomly sampling with replacement from the original set of $d_m$.
    For each bootstrapped sample $b$, we compute the empirical success rate


    ```

    $f^b(x) = (1/M)\sum_{m=1}^M 1_{\{d_m^b \le x\}}$

    ```


    and thus form a new sample of success rate points $\{f^b(x), b=1,...,B\}$. A two-sided
    confidence interval on the hit rate with overall level of confidence $(1-\alpha)$
    is obtained by calculating the $\alpha/2$ and $(1-\alpha/2)$-cutoffs from the
    empirical distribution of $f^b(x)$.


