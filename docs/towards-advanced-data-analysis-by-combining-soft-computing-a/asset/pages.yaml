  md: '52


    B. Sinova and S. Van Aelast


    with grouped data (instance) are involved. Many examples can be found in real
    life, such as the intervals describing the age range covered by each class when
    individuals in surveys are split into age groups, the fluctuation of quotations
    on the stock exchange or the temperature range for daily forecast in a certain
    location. Similarly, many interval data sets are obtained in research studies
    in fields such as Medicine, Engineering, Empirical and Social Sciences in which
    the information about the range of values takes a period is even more relevant
    than the deix records.


    Random intervals are not necessarily independent elements, that is, they formalize
    the random mechanism of producing interval data associated with a random experiment.
    To analyze this type of data, central tendency measures based on the inner arithmetic
    (globally considering intervals as means and not as sets of elements) have been
    proposed. The most often used meantype expected value it has very good probabilistic
    and statistical properties from the mean of a realvalued random variable, but
    that is also the reason why it can be influenced by the existence of great magnitude
    data or data changes.


    In real settings, the solution is to consider more robust central tendency measures,
    like the median. Some measures define the median of a random interval. Taking
    into account that there is no universally accepted total order in the space of
    non-empty compact intervals (so the median cannot be defined as a ‘middle’ position
    value), an $L^p$ metric, generalization of the Euclidean metric in $R$, is required
    to define the median as the element of the space minimizing the mean distance
    to all values in the random interval. The first choice for the $L^1$ metric means
    the generalized Hausdorff metric (see Sinova et al. [5]; a new definition based
    on the well-known Hausdorff metric expressed in terms of mid/spec characterization
    of intervals (that are, their mid-point and spread or radius). However, there
    are others to generalize the median defined by mean and the generalized Hausdorff
    metric to random fuzzy numbers (see Tuchnik et al. [77]) characterize a fuzzy
    number, the sufficient and necessary conditions a function must fulfill to be
    a generalized mid or spread are not known yet and it is not possible to guarantee
    that the median defined in that way is indeed a fuzzy number. These difficulties
    prompt the use of another definition, as shown in Sinova et al. [6], based on
    the 1-norm, as introduced by Vitale [8], and which considers the characterization
    of interval in terms of infimum and supremum. Of course, a second definition of
    median of random fuzzy numbers is obtained as a particular case of the median
    of random fuzzy numbers. The means and their immediate properties are studied
    in Section 3, after recalling in Section 2 the notation and basic operations and
    concepts in the space of interval data. In Section 4, the two proposed definitions
    of median of random interval are compared by means of the finite sample breakdown
    point and some simulation studies. Finally, Section 5 presents some conclusions
    and open problems.'
