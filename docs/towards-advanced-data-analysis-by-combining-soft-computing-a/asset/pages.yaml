  md: 'ulation of “high-quality” solutions by applying the mechanisms of selection,
    crossover and mutation. In our case, each member of the population corresponds
    to a unique combination of K assets (see also [16] for a similar approach). The
    initial solution is chosen randomly, and in each generation, the top-n members
    of the population are selected for reproduction. The quality of an individual
    solution is measured by the Sortino ratio. Previous experiments have indicated
    that this elitist method of selection yields quite good results. After the selection
    process is completed, a percentage of elite members undergoes a process of crossover,
    in which pairs of “parent–offspring” exchange constituents, and then the process
    of mutation, in which certain parts of a portfolio are substituted by other candidate
    assets.


    The second algorithm, implemented in this study, is an ant colony algorithm, inspired
    by the foraging behavior of ant colonies [3]. In nature, ants explore their surrounding
    environment for food sources. When an ant finds a potential food source, it carries
    a certain amount of a substance, called pheromone, which helps communicating with
    the rest of the colony. Higher quality food sources are continuously visited by
    ants, and in our setting, each ant represents a “financial” agent whose aim is
    to select assets for the portfolio. The food sources correspond to available assets
    and a complete solution consists of a combination of K assets. First, ants pick
    their solutions randomly. Then, for a number of generations, each ant updates
    the solution, based on the pheromone values of each asset (food source). Suppose
    that in some iteration of the algorithm, a portfolio $P_i$ of the existing solution
    is given by $\mu_{i,j} = e^{pheromone_{i,j}} / (\sum_{h \in P_i} e^{pheromone_{i,h}})$,
    where $pheromone_{i,j}$ is the pheromone value for the “path” connecting asset
    $i$ with $j$. This ratio relatively compares the total pheromone for the connections
    between each member of the portfolio and the candidate asset with the sum of pheromone
    values for connection each selected asset with any asset not included in the portfolio.
    At the last step of the algorithm, the pheromone update process takes place, consisting
    of two parts: firstly, all pheromone values decrease (evaporate) by a certain
    amount and, and secondly, pheromone values of the n-best solutions are reinforced.


