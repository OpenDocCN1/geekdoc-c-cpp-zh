  md: '# Comparing the Representativeness of the 1-norm Median for Likert and Free-response
    Fuzzy Scales


    Sara de la Rosa de Sáa¹ and Stefan Van Aelst²


    **Abstract** Many questionnaires related to Social Sciences, Medical Diagnosis,
    Control Engineering, etc. are based on the well-known Likert scales. For its statistical
    data analysis each categorical response is usually encoded by an integer number.
    In this paper the convenience of allowing respondents to reply by using a free-response
    format based on the scale of fuzzy numbers is discussed by developing a comparative
    study through the mean 1-norm error on the representativeness of the corresponding
    median for the fuzzy and the integer-encoded Likert scales cases.


    # 1 Introduction


    Likert scales are widely employed in opinion/valuation/rating/... questionnaires
    which are widely associated with Social Sciences, Medical Diagnosis, Control Engineering.
    They are often used for questionnaires with a pre-specified format, and the scale
    is easy to explain and understand. Likert scale-based questionnaires present items
    on a topic and respondents should express their agreement/satisfaction/etc. by
    choosing one of k possible answers; k is usually in the range 3 to 10, as argued
    by Lozano [14] the most common choices from the psychometric and statistical viewpoint
    are in the range 4 to 7.


    For the statistical analysis of the data, each of the responses is usually encoded
    by means of an integer number.


    Several drawbacks of the statistical analysis of Likert responses have been pointed
    out in the literature. Among them we can outline the following:


    > ¹ Departamento de Estadistica I.O. y D.M., Universidad de Oviedo, E-3307 Oviedo,
    Spain, sara16388@hotmail.com

    ² Department of Applied Mathematics and Computer Science, Ghent University, B-9000
    Grant, Belgium, Stefan.Vanaelst@ugent.be


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 87–98.

    springerlink.com © Springer-Verlag Heidelberg 2013'
