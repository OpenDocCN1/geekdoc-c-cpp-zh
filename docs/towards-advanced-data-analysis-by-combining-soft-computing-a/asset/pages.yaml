  md: 'prising that fuzzy set theory has been applied in data analysis problems in
    various areas like forestry, structural analysis, hydrology and economics (see
    [2, 3, 5, 7]). Combining probabilistic uncertainty with (one-dimensional) precision
    naturally leads to the concept of so-called fuzzy random variables, where random
    elements $X$ on a probability space $(\Omega,\mathcal{A}, \mathcal{P})$ with values
    in the fuzzy family $\mathcal{F}_c(\mathbb{R})$ of all fuzzy numbers ([8]). From
    the purely descriptive view of one needs some software to analyze and plot samples
    of fuzzy numbers (wheresoever they may come). From the inferential point of view
    one certainly should also be able to generate fuzzy random variables, i.e. to
    simulate fuzzy random variables.


    Since it seemed most natural to write this software not as a stand-alone product
    but as add-on to an already existing, world wide, state-of-the-art and sufficiently
    broad software environment we decided to write an R package SAFD (Statistical
    Analysis of Fuzzy Data). It is a free software environment for statistical computing
    and graphics. It compiles and runs alike under http://www.r-project.org/. Currently,
    SAFD is one of more than 3,000 packages on CRAN, see http://cran.r-project.org/web/packages/


    In its current version 0.3 SAFD contains functions that allow to execute standard
    operations on the fuzzy $\mathcal{F}_c(\mathbb{R})$ (sum, scalar product, mean,
    Hukuhara distance, quantiles) as well as functions calculating (Bertoluzza) distance,
    sample variance, sample covariance, sample correlation, and the Dempster-Shafer
    (leverage) histogram. Moreover SAFD facilitates to simulate fuzzy random variables
    hypothesis tests as well as a function for linear regression trapezoidal fuzzy
    data.


    The aim of this contribution is to explain the functionality of the package and
    to illustrate it as follows: By various examples: Firstly some preliminaries and
    notations concerning fuzzy numbers and fuzzy random variables are gathered in
    Section 2. Section 3 explains the most important functions with the help of various
    examples. Finally, Section 4 presents some future extensions for SAFD.


    **Remark:** In its current version 0.3 SAFD is still a quite small package that
    should be extended in the near future. Any recommendations, comments and complaints
    are welcome.


    # 2 Notation and Preliminaries


    Throughout the whole paper $\mathcal{F}_c(\mathbb{R})$ denotes the family of all
    non-empty-compact intervals. The family of all fuzzy numbers $\mathcal{F}_c(\mathbb{R})$
    considered this paper is defined by


    ```

    $\mathcal{F}_c(\mathbb{R}) = \{A : \mathbb{R} \rightarrow [0,1] \mid A_{\alpha
    \in \mathcal{K}_c(\mathbb{R})} \text{ for every } \alpha \in [0,1]\}$

    ```'
