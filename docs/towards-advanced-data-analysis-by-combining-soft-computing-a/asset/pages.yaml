    # 6 Conclusion


    The paper introduces a new model description of the software reliability growth
    dynamics. It is based on fuzzy logic mathematical frame realized by Takagi-Sugeno
    fuzzy inference engine. The model combines both vague and deterministic information.


    The model is able to cover complex growth dynamics of repairing process when significant
    amount of code is added during the test period. The proposed modeling scheme implements
    evolving clustering technique that recognizes the model structure in a real time
    mode. The model accuracy is reached for GK distance norm that was applied for
    cluster identification.


