    of the distance between the spreads relative to the distance between the mid-points
    (allocating the same weight to the deviation to the deviation in imprecision is
    often viewed as a concern in the Hausdorff metric). Given two intervals $K, K''
    \in K_e(\mathbb{R})$ and any'
