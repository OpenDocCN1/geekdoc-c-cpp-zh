    # # 5 Conclusion


    Change detection is a crucial aspect for non-stationary data streams or "evolving
    ecosystem". It has been demonstrated in [11] that naive adaptation without any
    effort to distinguish between noise and true changes of the underlying sample
    distribution can lead to very undesired results. Statistical measures and tests
    can help to discover true changes in the distribution and distinguish them from
    random noise. However, the problem arises: when change is carried out over and
    over again, the probability to erroneously rejecting the null hypothesis increases
    with the amount of applied tests. In this, we have discussed the problem of multiple
    testing during change detection and proposed methods as well as a new approach
    to cope with the multiple testing issue.


    Bonferroni correction and the Bonferroni-Holm method adjust the significance level
    l in order to correct the correctness of incorrect rejects of $H_0$ leading to
    a very conservative approach that would indicate change in the data stream. One
    approach is based on the uniformity of the p-values under the null hypothesis.
    In fact, not only the p-values also the meta p-values are taken into account by
    the change detection. This approach shows good results even in cases where Bonferroni
    correction and the Bonferroni Holm method could not achieve any improvement. Although
    we have only considered the distribution of the p-values under the null hypothesis,
    it could be useful to study the distribution of p-values under the alternative
    hypothesis, too.'
