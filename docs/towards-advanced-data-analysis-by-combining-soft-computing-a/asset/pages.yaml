    Takagi-Sugeno (T-S) hyperinference reasoning procedure for pattern recognition
    problems based on MOM (mean of maximum) defuzzification mentioning that in some
    cases the general PWLPP can be divided into several simple LPP according to the
    information about the pattern in advance. It is clear that a maximal number of
    simple LPPs is $v = \sum_{i=1}^{S} u_i$. All intermediate cases between PWLPP
    and LPP correspond to different fuzzy logic operations in Takagi-Sugeno (T-S)
    hyperinference procedures. Some of them are demonstrated in the next section of
    this paper. As it was delivered earlier, the Takagi-Sugeno (T-S) hyperinference
    reasoning procedure supplies as with degrees of certainty, that the description
    of an unknown object belongs to the pattern $p$ for $v_p$, as depicted in Fig.
    3. If we want to use this information as a recommendation for decision maker,
    the value


    $u_p = \frac{\Phi_p(x^*)}{\max \Phi_p(x^*)}$


    must be determined. In an interval, for $u_p$ is $[0 - 1]$, where the of accuracy
    is as shown in Fig. 4, the degree of truth $\mu_p(x^*)$ is presented.

    In case $u_p$ is in this zone, special additional investigations of the object''s
    properties are strongly recommended before the final decision is taken. In Fig.
    5 an extended block diagram is shown where both stages for pattern recognition
    process are represented. The first stage of this process corresponds to the (T-S)
    hyperinference reasoning procedure, and the second one - to the procedure of decision
    making recommendations.'
