  md: '# Bootstrap ClIs for a Linear Regression Model with FRVs


    equal to $\hat{\alpha}_{ml}^{(\alpha/2)}$, that is, the $100\cdot(\alpha/2)$th
    percentile of the bootstrap distribution. In details, $\hat{\alpha}_{ml}^{(\alpha/2)}$
    is the $B\cdot(\alpha/2)$th value in the ordered list of the $B$ bootstrap estimators
    $\{\hat{\alpha}_{ml}^{*1}, \hat{\alpha}_{ml}^{*2}, \dots, \hat{\alpha}_{ml}^{*B}\}$.
    The bootstrap percentile interval for $\alpha_{ml}^*$ is defined as:


    ```

    $CI_P(\hat{\alpha}_{ml}^*) = \left[ \hat{F}^{-1}(\alpha/2), \hat{F}^{-1}(1-\alpha/2)
    \right] = \left[ \hat{\alpha}_{ml}^{*(\alpha/2)}, \hat{\alpha}_{ml}^{*(1-\alpha/2)}
    \right]$

    ```


    The bootstrap confidence interval for $\alpha_{ml}^*$ is obtained by means of


    +   Step 1: Draw a sample of size $n$ with replacement


    ```

    ${\{X_i^*, Y_m^*, Y_i^*, Y_{im}^*\}_{i=1,\dots,n}^*$

    ```


    from the original sample $\{X_i, Y_m, Y_i, Y_{im}\}_{i=1,\dots,n}^*$.


    +   Step 2: Repeat Step 1 and $B$ times to get different sets of estimators for
    the regression parameter.


    +   Step 3: Approximate the lower and upper limits of the interval by the quantiles
    of the empirical distribution obtained at Step 3. That is, the values in position
    $[(\alpha/2)B+1, (1-(\alpha/2)B]$ of the ordered empirical distribution. We indicate
    those values as $\hat{\alpha}_{ml}^{**}$ and $\hat{\alpha}_{ml}^{*}$. Thus the
    percentile confidence interval for $\alpha_{ml}^*$, at the confidence level $1-\alpha$
    is


    ```

    $CI_P(\hat{\alpha}_{ml}^*) = \left[ \hat{\alpha}_{ml}^{**}, \hat{\alpha}_{ml}^{**}
    \right]$

    ```


    An analogous algorithm could be used to construct the bootstrap confidence intervals
    for all the regression parameters.


    # Empirical Results


    In order to check the empirical behaviour of the bootstrap approach to construct
    confidence intervals for the regression parameters, some simulation studies and
    a real-case example have been developed.'
