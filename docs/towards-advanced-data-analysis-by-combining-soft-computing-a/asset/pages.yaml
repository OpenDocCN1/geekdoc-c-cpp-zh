    | Avg. reg. size | A salient |

    | Mean change non-salient | B salient |

    | Change Std.Dev. non-salient | Z salient |

    | Mean Change salient | Z_salient |

    | Change Std.Dev. salient | BB non-salient |

    | A non-salient | BB salient |

    | Z non-salient | BB border |


    # 4 Experiments and Results


    # 4.1 Data Set


    Videos from DynTex data set [12] were used to evaluate the approach. The DynTex
    data set contains more than 650 varied dynamic texture videos, but the information
    about the type of textures in the sequences is not provided for all the videos
    in the set. Figure 1 shows example textures from this data set. The image size
    is 352×228 and the compressed videos provided were coded using DivX codec, i.e.
    an MPEG-4 Part 2 codec.


    A subset of 202 sequences, spanning 23 classes of varied dynamic textures have
    been selected to evaluate the proposed approach. The subset is comprised of those
    DynTex sequences that were labelled as containing a single class of dynamic texture
    including labelled NA for which the class information is not available. We treat
    the NA sequences as an additional class, increasing the diversity of the test
    set. The texture classes contained in our data set are: textile, vegetation, grass,
    streaks, water, steam, fire, smoke, branch, cloud, leaf, car, flower, fur, needle,
    insects, tentacle, CD, foam, light and paper. Sample frames from some of the sequences
    are shown in Figure 1.'
