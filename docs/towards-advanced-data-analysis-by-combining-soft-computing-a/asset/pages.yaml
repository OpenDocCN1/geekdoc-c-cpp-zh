  md: '# 4 Summary of Recent Results on Regression Analysis with Imprecely-valued
    Data


    The SMIRE RG has developed several studies related to regression analysis involving
    imprecely-valued data. Some of the most recent research developments of the Group
    have also addressed this problem.


    On one hand, studies have been carried out to analyze a flexible linear model
    in which both output (response) and input (explanatory) data are assumed to be
    interval-valued. This flexible model (referred to as Model M) is formalized by
    means of the linear relationship


    ```

    $Y = a \cdot X + b = [-spr X, spr X] + c + \varepsilon.$

    ```


    where $Y$ is the interval-valued dependent (the response) $X$ is the interval-valued
    independent (i.e., the explanatory or regressor) $a$ and $b$ are the real-valued
    regression coefficients associated with $X$, $c$ is the real-valued intercept
    and $\varepsilon$ is an interval-valued random error satisfying $E^{\varepsilon}(X)
    = [-\delta, \delta]$ with $\delta \geq 0$. The definition of the model implies
    that the errors can be measured as the Huhara distance between the responses and
    the regression function.


    In Blanco-Fernández et al. [8], arguments supporting the practical interest of
    model M have been given. Furthermore, Model M has been estimated using the least
    squares (LS) approach involving the metric $d_{\mu}$, for which a simple random
    sample $\{(X_1, Y_1), \dots, (X_n, Y_n)\}$ from $\{X, Y\}$ can be stated as follows:


    ```

    $$\min_{a,b} \sum_{i=1}^{n} d_{\mu}(Y_i - Y_i^{\circ}(a,b), \widehat{Y_i^{\circ}}(a,b)})^2$

    ```


    subject to $Y_i - Y_i^{\circ}(a,b)$ existing for $i = 1, \dots, n$ with $Y_i^{\circ}(a,b)
    = a \mid X_i + b[-spr X_i, spr X_i]$, whereas $\widehat{Y_i^{\circ}}(a,b) = a
    \mid X_n + b[-spr X_n, spr X_n]$. The constraints in the LS problem are related
    to the existence of the residuals which, from the definition of the model, should
    be the Huhara distances between the responses and the estimated values from the
    regression function.


    The solutions can be expressed in terms of the model for the real-valued random
    variables $mid$ and $spr$ of the dependent and independent RSs as:


    ```

    $$\widehat{a} = \frac{\sigma_{mid X, mid Y}}{\sigma_{mid X}^2}, \quad \widehat{b}
    = \min \left\{s_0, \max \left(0, \frac{\sigma_{spr X, spr Y}}{\sigma_{spr X}^2}\right)\right\}$

    ```'
