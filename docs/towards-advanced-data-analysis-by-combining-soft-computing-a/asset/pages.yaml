    # 3.2 Brain Graphs


    A brain graph is created when computing functional connectivity, e.g. using SL,
    for each pair of variables at a given point in time. Such a network serves as
    graphical representation of pairwise statistical dependencies among all variables.
    For simplicity we demand that brain graphs are simple, i.e. do not have any loops
    or multiple edges. Furthermore, since dealing with SL, we know that SL graphs
    must be simple.


    Fig. 4 shows such a brain graph: averaged functional EEG connectivity from one
    subject has been computed by pairwise evaluation of SL. On the left hand side,
    the lower half of the adjacency matrix is shown which is due to SL''s symmetry.
    This matrix has been thresholded to construct the graph on the right hand side.
    The threshold of 0.15 has been chosen to diminish very weak connections while
    preserving many of them. The size of each vertex corresponds to its weighted degree
    σ. With regard to reproducibility, the brain graphs can look completely different
    from patient to patient. This unfortunate fact is due to corrupted EEG that has
    been drastically filtered and patients'' differences in resting-state EEG.


    # 3.2.1 The Meaning of Edges


    An edge represents some kind of statistical dependency between two brains, i.e.
