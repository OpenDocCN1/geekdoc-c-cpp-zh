  md: '# Convergence of Heuristic-based Estimators of the GARCH Model


    introduced [15]. TA has been applied to the ML estimates of a GARCH(1,1) model,
    and the joint convergence property of the optimization algorithm and the theoretical
    estimator — when setting the number of iterations of the heuristic as a function
    of the sample size — has proven.


    The aim of this contribution is to adapt and investigate this previous research
    to various GARCH extensions. The first, GJR-GARCH, is able to capture market asymmetries
    by the introduction of an extra parameter which depends on the sign of the previous
    return. The second one, GARCH(p,q), enables multiple lags for the ARCH factors
    and also allows for holes in the model structure. In the latter case, the optimization
    problem consists not only in the estimation of the parameters, but also in model
    selection [11].


    # 2 Convergence of Heuristic-based Estimators


    There are two aspects that need to be addressed when analyzing the convergence
    of the heuristic-estimators towards the true values of the data generating process
    (DGP). First, the convergence in probability of the ML estimators, represented
    by the vector $\Psi^{ML,T} \in \mathbb{R}^n$, towards their true values $\Psi^T
    \in \mathbb{R}^n$, in the relation with the sample size $T$, should be established.
    A consistent estimator it holds: for any $\delta > 0, \epsilon > 0$ fixed, there
    is a sample size $T(\\delta, \epsilon)$ such that for any $T > T(\\delta, \epsilon)$,


    > $P(||\Psi^{ML,T} - \Psi^T| < \epsilon\) > 1 - \delta$.


    Second, the heuristic can be interpreted as a stochastic mapping of the search
    space on a random domain. Thus, based on the distribution of approximations $\Psi^{T,r}$
    recorded after a number of $R$ restarts ($1 \le r \le R$) with I iterations, the
    asymptotic convergence of the heuristic towards the true theoretical estimator
    has to be. This means that the heuristic can be tuned to approximate the global
    optimum with an arbitrary accuracy $\epsilon$ and a fixed probability $1 - \delta$
    by the number of iterations $I(\\delta, \epsilon)$. In other words, for any $\epsilon
    > 0$ and $\delta > 0$, there exists a number of iterations $I_{min} = I(\\delta,
    \epsilon)$ such that for $I \ge I_{min}$ we find


    Finally, the two partial results can be combine the heuristic-based estimators
    to obtain the expression of joint convergence when $T$ goes to infinity and $I$
    goes to infinity as a function of $T$. That is,


    > $P(|\Psi^{T,R} - \Psi^T| < \epsilon\) > 1 - \delta$.


    where $\Psi^{T,R}$ represents the best result out of the $R$ restarts'
