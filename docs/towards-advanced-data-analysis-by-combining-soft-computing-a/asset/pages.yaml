    # 3.4 Correlation Analysis


    In order to test the strength of the above mentioned measures applied to the computed
    graphs, we correlated each clinical variable by computing the linear correlation
    coefficient. Two-sided p-values have been computed for hypothesis tests. The null
    hypothesis is that the slope of the linear regression line is zero. This correlation
    analysis was applied to the coefficient of weighted graphs and for the set of
    binary graphs by thresholding edge weights. Due to weak edge weights near zero,
    thresholds of 0.1 and 0.2 were applied.


    In the following assuming that a correlation is significant if its coefficient
    is equal to or higher than the that we marked correlations with an asterisk whenever
    the probability to reject the null hypothesis less than 5 percent.


    For the weighted networks we have found only few significant correlations. Some
    of them are situated in the $\delta$-band when looking at the proportion of absolutely
    defective sectors using theical Magnification Factor (CMF) [6] (see Fig. 7). Especially
    the density-based measures (i.e. number of motifs of size 4, number of edges,
    local efficiency, number of motifs of size 3, global efficiency, connectivity)
    correlate negatively with this clinical variable. This meets the intuition that
    a bigger deficit should have a negative effect on functional activity (SR, 28).


    All other significant correlations from the weighted networks have been found
    in the $\gamma$ band for the reaction time. This is shown in Fig. 8. The basic
    hypothesis is that a higher reaction time corresponds to a less efficient network
    due to higher path length.


    For the simple graphs (i.e., without weights), we could find only some weak correlations
    for both thresholds in the $\gamma$ band. Fig. 9 states that the higher of relatively
    defective sectors, the smaller the clustering coefficient. So, these networks
    show more random connectivity than the ones from subjects with smaller proportion
    of relatively defective sectors.'
