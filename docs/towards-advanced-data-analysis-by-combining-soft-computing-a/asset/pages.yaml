    178


    is a Bayesian model, its output is a normal distribution, expressed in terms of
    the mean and the variance. The mean value represents the most likely output, and
    the variance can be viewed as a measure of its confidence. The obtained variance,
    which depends on the amount of available identification data, is important information
    that distinguishes the GP models from other Bayesian methods. GP models can be
    used for model identification when the data is noisy and when there are outliers
    or gaps in the input data. Another useful attribute of GP models is the possibility
    to include various kinds of prior knowledge into the models, static characteristics,
    et c.


    A noticeable drawback of any system identification with GP models is the computation
    time for the modelling. Regression based on GP models involves several matrix
    computations in which the third power of the input data, such as the matrix inversion
    and the calculation of the number of used covariance matrices, this computational
    greed restricts the amount of training data to a few thousand cases. To overcome
    the computational-limiting issues and also make use of the method for large-scale
    dataset applications, numerous authors have suggested sparse approximations [2,
    3]. A property of sparse approximations is that they try to retain the bulk of
    the information contained in the full training dataset, but reduce the size of
    the sparse covariance matrix so to facilitate a less demanding implementation
    of the GP model. Special kinds of sparse approximation are the on-line modelling
    methods, e.g., Sparse On-line Gaussian Processes [4], Forward Selection to Speed
    Up Sparse Gaussian Process Regression [12] and Online Sparse Gaussian Process
    Regression and Vision Applications [10]. All these on-line methods to incorporate
    all the information about the data by projecting to a reduced covariance matrix.


    The problem we focus on in this chapter is the on-line selection of particular
    data with rich information from streaming data to be used afterwards for the modelling
    of a dynamic system. This kind of modelling is of interest, for example, in the
    case of changing a system''s operating conditions. For this purpose the current
    sparse methods for GP models are not appropriate as they need to learn all the
    hyperparameter values in online mode. Therefore, we propose a streaming-data selection
    method for GP modelling that sequentially gains the bulk of information contained
    in the streaming data and adjusts with the incoming data. To keep the subset of
    the most informative data small enough to process the current data before new
    arrive, the maximum length of the subset is fixed. The information each piece
    of data in the subset contains regarding the other data in the subset is estimated
    with the log-marginal likelihood. To test the variability of the proposed method
    it is compared to the full GP model trained on the entire dataset and the Sparse
    On Gaussian Processes methods (OGP) [4].


