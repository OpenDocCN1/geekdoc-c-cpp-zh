    # 2.6 Summary


    Applying a Butterworth filter can be used to describe event frequencies in event-based
    graphs as continuous signal as opposed to the inherent discrete nature of the
    signal. The resulting curve is continuous, smooth and without overfitting it gives
    a generally good approximation of the original signal. The filter itself can be
    described only by its coefficients and a few historical entries for each edge
    based on the grade of the filter, leading to an overall efficient memory usage.
    This approach leaves enough space for adjustments, e.g. by weighting the extrema
    or the MSE in the objective functions and thus leading to curves being more aligned
    or closer to the discrete signal. When changing the grade of the filter an even
    better approximation of the original curve is possible, decreasing the overall
    error at the cost of memory efficiency.


    # 3 Analysis of Functional Connectivity Networks


    In the last decade, a new trend in neuroscience emerged which focuses on the analysis
    of brain networks (e.g. [31, 28]). These networks are commonly obtained from neuroimaging
    data coming from, e.g. electroencephalography (EEG), electrocardiography (ECG),
    magnetoencephalography (MEG), functional magnetic resonance imaging (fMRI). They
    measure some kind of brain activity of a certain region (e.g. on the skull, on
    the brain mening, of the brain). We will call the brain regions that are to be
    measured variables.


    Whenever two brain regions are co-active in some sense, we say that these regions
    are connected with each other. These connections induce a complex brain network
    that serves as some high-level representation of the underlying neural connectivity
    patterns. Certainly, it seems natural to analyze the functional brain connectivity
    using graph-based approaches. However, there are'
