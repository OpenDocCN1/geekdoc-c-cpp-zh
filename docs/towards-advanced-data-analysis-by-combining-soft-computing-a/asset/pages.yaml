  md: '# # Mining Local Connectivity Patterns in fMRI Data


    Kristian Loewe$^1$, Marcus Grueschow$^2$, and Christian Borgelt^3$


    **Abstract** A core task in the analysis of functional magnetic resonance imaging
    (MRI) data is to detect voxels that exhibit synchronous activity while the subject
    is performing a certain task. Synchronous activity is typically interpreted as
    functional connectivity between brain regions. We compare classical approaches
    like statistical parametric mapping (SPM) and some new approaches that are largely
    based on frequent pattern mining principles, but restricted to the local neighborhood
    of a voxel. In particular, we examine how soft notion of activity (rather than
    a binary one) can be modeled and exploited in the analysis process. In addition,
    we explore a fault-tolerant notion of synchronous activity groups of voxels in
    both the binary and the soft/fuzzy activity setting. We apply the methods to fMRI
    data from a visual stimulus to demonstrate their usefulness.


    # ## 1 Introduction


    The localization and analysis of brain activity is a major objective in cognitive
    science. Functional magnetic resonance imaging (fMRI) provides an indirect, but
    non-invasive means to measure brain activity in vivo. Each time series of three-dimensional
    (3D) brain-images are acquired, in which each volumetric pixel (voxel for short)
    represents a cuboid of tissue. Inference about brain activity rests on the following
    principle neural activity entails the consumption of oxygen and thus the supply
    of the


