    In all of the aforementioned metaheuristic paradigms, the exploration of the solution
    space is guided by random elements. Introducing randomness is a strategy to avoid
    premature convergence and local optima. Still, even though some of the runs might
    get stuck in suboptimal regions, increasing the number of repetitions will boost
    a better exploration of the solution space and, eventually, lead to the global
    optimum. A downside of this practice is that unavoidably leads to a higher dispersion
    of the reported results. Even when the algorithm is initialised from exactly the
    same population, it will find different convergence paths and the reported optimal
    may change from run to run. The degree of divergence algorithmic behaviour depends,
    on the morphology of the optimisation landscape and the complexity of the problem
    at hand. Still, the bottom-line is that we need a different approach to the evaluation
    and exection of metaheuristics we are dealing with randomness, statistical tools
    can play an important role in this.


    Statistical techniques are becoming increasingly popular in the area of metaheuristic
    optimisation. In the early years, researchers would routinely judge the relative
    superiority of algorithm by comparing averages over a set of runs on a single
    instance. However, nowadays, many recommend the use of statistical techniques
    for pairs or multi-wise comparisons of algorithmic behaviour (see e.g. [5] for
    an overview of parametric/nonparametric techniques). Still, on the application
    side, little has been done in the direction of using statistical techniques for
    fine-tuning algorithmic parameters or determining the tradeoff. Gill and Winkler
    [6] set first range of probabilistic tools for analysing the convergence properties
    of heuristic techniques and the empirical distribution of algorithmic outcomes
    in each generation. They also show how this stochastic analysis can set the ground
    for determining an optimal allocation of CPU power between exploration and exploitation.
    Barrero [1] investigate the convergence rate of genetic programming through the
    control of generation-to-success (generation to optimum). They propose various
    techniques for estimating the statistical distribution of this random variable
    in a given optimisation. [13] investigate the success rates of three stochastic
