  md: '# Statistical Reasoning with Set-Valued Information: Ontic vs. Epistemic Views


    Didier Dubois¹


    **Abstract** Sets, hence fuzzy sets, may have a conjunctive or a disjunctive reading.
    In the conjunctive reading a (fuzzy) set represents an object of interest for
    which a (gradual rather than Boolean) composite description makes sense. In contrast
    disjunctive (fuzzy) sets refer to the use of sets as a representation of incomplete
    knowledge. They do not model objects or quantities, but partial information about
    an underlying object or a precise quantity. In this case the fuzzy set captures
    uncertainty, and its membership function is a possibility distribution. We call
    such fuzzy sets slices, since they represent states of incomplete knowledge. Distinguished
    between ontic and epistemic fuzzy sets is important in information-processing
    tasks because there is a risk of missing basic notions and tools, as distance
    between fuzzy sets, variance of a fuzzy random variable, fuzzy regression, etc.
    We discuss several examples where the ontic and epistemic points of view yield
    different approaches to these concepts.


    # # 1 Introduction


    Traditional views of engineering sciences aim at building a mathematical model
    of a real phenomenon via a data set containing observations of the concerned phenomenon.
    This mathematical model is approximate in the sense that it is an imperfect copy
    of the reality it intends to account for, but it is often precise, namely it typically
    takes the form of a real-valued function that represents, for instance, the evolution
    of a quantity over time. Approaches vary according to the class of functions used.
    The oldest and most common class is the one of linear functions, but a lot of
    works dealing with non-linear models have appeared, for instance and prominently,
    using neural networks


    ¹ IRIT, CNRS and Université de Toulouse, dubois@irit.fr


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STDUFF 285, pp. 119–136.

    springerlink.com

    © Springer-Verlag Berlin Heidelberg 2013'
