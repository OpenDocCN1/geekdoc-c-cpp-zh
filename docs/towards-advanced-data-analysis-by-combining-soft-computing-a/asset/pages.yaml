  md: 'A. Mendes, C. Gatu, and P. Winker


    tokurtosis, heteroskedasticity, volatility clustering and leverage effects. Under
    these conditions, classical volatility indicators have been substituted by more
    complex econometric models, such as Generalized Autoregressive Conditional Heteroskedasticity
    (GARCH) or Stochastic Volatility Models.


    The GARCH model was introduced by Engle (1982) and generalized by Bollers. The
    model captures the dynamics of returns under the form of an AR process, assuming
    the possibility of autocorrelation between returns. The second expresses the current
    variance based on past information; long-term medium value, unexpected return
    (ARCH factor) and previous value of the variance (GARCH factor). The symmetric
    normal GARCH(1,1) is the plain vanilla version of the GARCH and is given by:


    ```

    $r_t = \iota + \epsilon_t, \quad \epsilon_{t-1} \sim N(0, \sigma_t^2),$

    ```


    ```

    $$\sigma_t^2 = \omega + \alpha\epsilon_{t-1}^2 + \beta\sigma_{t-1}^2.$

    ```


    The GARCH parameters are estimated by means of Maximum Likelihood Estimation (MLE).
    The MLE process is based on the construction of a Log-Likelihood Function (LLF)
    which depends on the parametric model that is assumed, and on the sample data.
    It has the following analytical expression:


    ```

    $L(\psi) = -\frac{T}{2}\log(2\pi) - \frac{1}{2}\sum_{t=1}^{T}(\log(\sigma_t^2)
    + (\frac{\epsilon_t}{\sigma_t})^2),$

    ```


    where $\psi$ represents the set of parameters. In the case of the symmetric GARCH(1,1),
    $\psi = (c, \omega, \alpha, \beta)$. The MLE is maximized through numerical procedures,
    as there is no analytical solution for the parameters in equation (2) in a heteroskedastic
    context. In practice, when the assumed model is complex and the data is "unfriendly",
    these iterative search methods are prone to difficulties in identifying the global
    optimum.


    The optimization of maximizing (3) can be naturally tackled with heuristic methods,
    which are designed to avoid the attraction basins of the local optimum in a multi-modal
    hyperspace. Threshold Accepting (TA), introduced by Duches and Percbeck (2000),
    implements a stochastic search in the neighborhood space, represented by vectors
    of decision variables. The current solution is gradually improved with a decreasing
    accepted tolerance for worse solutions, which regulates the transition from the
    exploring to the exploitation phase. Details and the TA pseudocode can be found
    in [13, 15]. A potential drawback of their stochastic component products is a
    new source of uncertainty, besides the deviation of the theoretical estimators
    due to the finiteness of the observation samples. In order to analyze this additional
    uncertainty, a formal framework for convergence analysis of the estimators and
    the heuristics has been'
