  md: '# Convergence of Heuristic-based Estimators of the GARCH Model


    Alexandru Mandes¹, Cristian Gatu¹, and Peter Winker²


    **Abstract** The GARCH econometric model is able to describe the volatility of
    financial data under realistic assumptions and the convergence of its theoretical
    estimators has been proven. However, when data is "unfriendly" maximum likelihood
    estimators need to be computed by stochastic optimization algorithms in order
    to avoid local attraction basins, and thus, a new source of uncertainty is introduced.
    A formal framework for joint convergence analysis of both, the heuristic, has
    been previously described within the context of the GARCH(1) model. The aim of
    this contribution is to adapt and extend this research to asymmetric and lagged
    GARCH models. Aspects of subset model selection are also investigated.


    # # 1 Introduction


    Volatility is a way of measuring, and therefore it represents a fundamental concept
    of the financial theory with various applications (e.g., value-at-risk simulations,
    portfolio risk and management, option pricing models). Volatility is an unobservable
    phenomenon which can be measured and forecast only within the context of a defined
    statistical model. Specifically, standard volatility estimation is based on variance
    or standard deviation. These statistics are sufficient risk measures when returns
    are normal, identically and independently distributed. Unfortunately, these assumptions
    are not realistic for most of the financial data, which usually exhibit features
    such as: lep


    > ¹ Alexandru Ioan Cuza University, General Berthelot 16, Iasi, Romania,\alex.mandes@gmail.com,
    cgatu@uic.ro

    ² Justus University Giesen, Licher Strasse 64, D-35394 Giesen, and Centre for
    European Economic Research, Mannheim, Germany,

    Peter.Winker@Wirtschaft.uni-giesen.de


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STFUZZ 285, pp. 151–163.

    springerlink.com

    © Springer-Verlag Berlin Heidelberg 2013'
