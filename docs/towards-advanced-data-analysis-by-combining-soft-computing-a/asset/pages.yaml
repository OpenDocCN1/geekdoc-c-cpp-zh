    In case of fuzzy lifetimes there are two possibilities to generalize $\hat{R}_m(\cdot)$.

    A smoothed version of the ERF is obtained by


    ```

    $\hat{R}_n^*(t) := \frac{1}{n} \sum_{i=1}^n \frac{\int_t^{\infty} \xi_i(x)dx}{\int_{-\infty}^{\infty
    \xi_i(x)dx} \quad \forall t \geq 0. \quad (6)$

    ```


    The characterizing functions of four fuzzy lifetimes and the corresponding

    functions are depicted in Figure 1. Alternatively a fuzzy generalization

    of the ERF, called fuzzy empirical reliability function (FERF), is

    obtained in the following way. Let the following functions $\hat{R}_{\delta,L}(\cdot)$
    and $\hat{R}_{\delta,U}(\cdot)$nbe defined for all $\delta \in (0;1]$ and


    ```

    $\begin{cases} \hat{R}_{\delta,U}(t) := \frac{\#\{t; C_U(t;infty)\neq \delta\}}{n}
    \ \hat{R}_{\delta,L}(t) := \frac{\#\{t; C_L(t;infty)<\delta\}}{n} \end{cases}
    \quad \forall t \geq 0. \quad (7)$

    ```


    From this definition the above functions are step functions fulfilling


    ```

    $\hat{R}_{\delta,L}(t) \leq \hat{R}_{\delta,U}(t) \quad \forall t \geq 0. \quad
