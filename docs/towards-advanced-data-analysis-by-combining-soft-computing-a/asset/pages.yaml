  md: "# Lasso-Type and Heuristic Strategies in Model Selection and Forecasting\n\n\
    of this technique can be found in medicine, economics and other scientific fields\
    \ [7] including also time series forecasting (see, among others, [1]).\nConsider\
    \ the model selection problem for the following regression:\n\n```\n$y = \\alpha\
    \ + X^{opt}\\beta + \\varepsilon$$\n```\n\nwhere $\\alpha$ is an $n$-vector with\
    \ all elements equal. $X$ is an $n \times k$ matrix of $k$ regressors and their\
    \ values for $n$ observations, $\\beta$ is a $k \times 1$ vector of coefficients\
    \ and $\\varepsilon$ is an $n \times 1$ vector of residuals. $X^{opt}$ refers\
    \ to the ‘true’ model in a Monte-Carlo simulation set or to an optimal approximation\
    \ to the unknown real data generating process. Standardizing the predictors so\
    \ that they have mean 0 and standard deviation equating 1, and the response having\
    \ mean 0, one can omit $\\alpha$ without loss of generality.\n\n# 2.1 Lasso-type\
    \ objective function\n\nFor (1) the Lasso can be presented as follows:\n\n```\n\
    $$\\hat{\\beta}_{Lasso} = \\arg\\min_{\\beta} ||y - X\\beta||_2^2 + \\lambda ||\\\
    beta||_1$$\n```\n\nWhile the first part in the right part of equation (2) measures\
    \ the fit of the model by the residual sum of squares (RSS), the second one with\
    \ $\\lambda > 0$ is the shrinkage applied to the sum of absolute values of the\
    \ coefficients. Hence, the Lasso can be referred to as a special case of the Bridge\
    \ regression approach [4] imposing an upper bound on the $L^q$-norm of the parameters\
    \ ($0 < q < \\infty$) with $q = 1$:\n\n```\n$|\\hat{\\beta}||_q = (\\sum |\\beta_i|^q)^{1/q}$$\n\
    ```\n\nThere are different approaches to solve (1) including quadratic programming,\
    \ coordinate optimization and gradient projection (see, e.g., [5]). For the sake\
    \ of brevity we do not discuss any of these methods, so that the interested reader\
    \ is advised to consult the literature. In this study we use a modification of\
    \ the LARS algorithm suggested by Efron et al. [3] and popularized among practitioners.\
    \ The algorithm provides a piecewise-linear solution path in the tuning parameter\
    \ $\\lambda \\in [0, \\infty)$ with all $\\beta$ set to zero at $\\lambda = \\\
    infty$ and equal to the OLS estimate at $\\lambda = 0$. To select a single solution,\
    \ $\\lambda$ is chosen by tenfold cross-validation minimizing the prediction error\
    \ (PE) of the model.\n\n> 2 Related code is available at http://www.stanford.edu/~hastie/Papers/LARS\
    \ for R and http://www2.imtu.dk/pubdb/views/publication_details.php?7id=3897 for\
    \ Matlab."
  merge: -1
