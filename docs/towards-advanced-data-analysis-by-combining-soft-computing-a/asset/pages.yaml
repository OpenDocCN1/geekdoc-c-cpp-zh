    from standard Bayesian inference.


    # # Conclusion


    Fuzzy lifetimes make it necessary to generalize the methods of reliability analysis
    to this kind of data. In Bayesian reliability analysis, the corresponding a-posteriori
    probability distributions become fuzzy. Therefore the consideration of fuzzy probability
    distributions is necessary. Based on that generalization of the concept of highest
    a-posteriori density regions for parameters is given in this paper as well as
    a generalization of predictive densities for lifetimes based on fuzzy data.


    # # References


    +   1. Möller B and Boer M (2004) *Fuzzy Randomness — Uncertainty in Civil Engineering
    and Computational Mechanics*. Springer, Berlin

