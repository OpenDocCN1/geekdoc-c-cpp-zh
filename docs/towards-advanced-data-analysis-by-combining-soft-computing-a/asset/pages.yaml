    ```

    $p = \begin{cases} 2 \cdot \text{Pr}(T \leq t|H_0), & \text{if } t \leq q_{\alpha/2}^0
    \ 2 \cdot \text{Pr}(T \geq t|H_0), & \text{otherwise.} \end{cases} (7)

    ```


    As the Equations (5), (6) and (7), the p-value is a function of a random variable
    and hence a random variable itself. An obvious question is: are the p-values distributed
    under the null hypothesis and how under the alternative hypothesis? First, the
    distribution of p-values is analysed when $H_0$ is true (see [4, 8]).


    **Theorem 1.** *Given the null hypothesis is true, the p-values of a continuous
    test statistic $T$ follow a uniform distribution over the interval [0,1].*


    *Proof.* Let $p$ be the achieved p-value and $t$ the calculated test statistic
    $F_p(p|H_0)$ and $F_T(t)$ being the cumulative distribution functions under $H_0$.
    Also, let $F_T^{-1}(\gamma) = \gamma$ be the inverse function of $F_T(t)$, so
    that $F_T(F_T^{-1}(\gamma)) = \gamma$ for all $\gamma \in [0,1]$. For a right
    tailed test the following holds


    ```

    $F_p(p|H_0) = \text{Pr}(P \leq p|H_0) \n= \text{Pr}(1-T \leq p|H_0) \n= \text{Pr}(T
    \geq 1-p|H_0) \n= 1-\text{Pr}(T \leq (1-p)|H_0) \n= 1-F_T(F_T^{-1}(1-p)) \n= 1-(1-p)=p$
    (8)

    ```


    For a left tailed test corresponding to Equation (6) the distribution function
    of the p-value is as follows


    ```

    $F_p(p|H_0) = \text{Pr}(P \leq p|H_0) \n= \text{Pr}(T \leq p|H_0) \n= F_T(p) \n=
    p$ (9)

    ```


    for all $p \in [0,1]$.\nAccording to Equations (7), (8) and (9), we obtain for
    the distribution of $P$ in a case of two tailed test: $F_p(p|H_0)=\frac{1}{2}=p$.
    Note that we the probability $p$ equals both tails. Therefore, the random variable
    $P$ is uniformly distributed on the interval [0,1] when $H_0$ is true.


