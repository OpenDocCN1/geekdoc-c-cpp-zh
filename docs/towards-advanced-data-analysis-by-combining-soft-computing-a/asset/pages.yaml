    In feature selection it is common to encode a feature subset as a binary vector
    $x \in \{0,1\}^N$, where $N$ is the number of available features. This vector
    stores for each feature whether it is selected $(x_i=1)$ or not $(x_i=0)$. The
    MOO algorithm for the feature selection problem consists of finding the set of
    features that simultaneously minimize two objectives: $f_1(x) = \sum_{i=1}^N x_i$
    which is the number of selected features and $f_2(x) = (1 - \text{accuracy}(x))$
    which is equivalent to maximize the accuracy.


    # 2.2 Fuzzy Modeling for Feature Selection


    Fuzzy models are suitable to deal with vague, imprecise and uncertain knowledge
    using logical connectives to establish relations between features defined to derive
    the model. Three general methods for fuzzy classifier design can be distinguished
    [4, 25]: the regression method, the discriminant method and the maximum compatibility
    method. In the discriminant method the classification is based on the largest
    class, regardless of the values or definitions of other discriminant functions.
    Hence, the classification decision does not change if the discriminant functions
    are transformed monotonically. This is a useful property, the discriminant method
    is used in this work for classification. The discriminant functions can be implemented
    as fuzzy inference systems, which can be Takagi-Sugeno (TS) fuzzy models [27].
    When TS systems are used, each discriminant function consists of rules of the
    type


    ```

    Rule $R_i^c$: If $x_i = A''_i$ and $x_n$ is $A^c_n$

    d d_i^c(x) = f_i^c(x), i=1, 2, \dots, K$

    ```


    where $c$ is the number of classes, $K$ is the number of fuzzy rules, and $f_i^c$
    is the consequent function for rule $R_i^c$. Please note the fact that antecedent
    parts of the rules can be different for different discriminants, as well as the
    consequents. Therefore, the output of each discriminant function $d_i(x)$ can
    be interpreted as a score (or evidence) for the associated class, given the input
    feature vector $x_n$. The discriminant function for class $c$, with $c=1, \dots,
    C$ is computed by aggregating the contributions of the individual rules.


