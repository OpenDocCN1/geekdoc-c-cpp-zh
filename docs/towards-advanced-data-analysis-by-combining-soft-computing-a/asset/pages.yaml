    In addition, it is easy to show that $\hat{\sigma}_d^2(X,X_n) \xrightarrow{*}
    \sigma_d^2(X,E(X))$ by considering Proposition 3 provided in [23]. Therefore,


    ```

    $T_n \xrightarrow{d} N(0,1).$

    ```


    Given $\alpha \in [0,1]$, the following asymptotic test procedure is provided:


    +   - Let $z_{1-\alpha/2}$ be the $(1-\alpha/2)$-quantile of the distribution
    $N(0,1)$. If $H_0$ in Problem 1 is true, then $\limsup_{n\to\infty} P(T_n > z_{1-\alpha/2})
    \le \alpha$. Thus, the test that rejecting $H_0$ in Problem 1 when $T_n > z_{1-\alpha/2}$
    is asymptotically correct.


    +   - Let $z_{\alpha}$ be the $\alpha$-quantile of the distribution $N(0,1)$.
    If $H_0$ in Problem 2 is true, then $\limsup_{n\to\infty} P(T_n > z_{\alpha})
    \le \alpha$, and the equality is reached for $\hat{\sigma}_d^2 = \sigma_d^2$.
    Thus, the test that rejecting $H_0$ in Problem 2 when $T_n > z_{\alpha}$ is asymptotically
    correct.


    +   - Let $z_{\alpha}$ be the $\alpha$-quantile of the distribution $N(0,1)$.
    If $H_0$ in Problem 3 is true, then $\limsup_{n\to\infty} P(T_n < z_{\alpha})
    \le \alpha$, and the equality is reached for $\hat{\sigma}_d^2 = \sigma_d^2$.
    Thus, the test that rejecting $H_0$ in Problem 3 when $T_n < z_{\alpha}$ is asymptotically
    correct.


    On the other hand, the application of bootstrap techniques to solve hypotheses
    has provide better results than the asymptotic ones when imprecise data are involved
    (see, for instance, [19, 13, 14]).


    Suppose that $X$ is a random variable and $\{X_i\}_{i=1}^n$ is a simple sample
    drawn from $X$. Let $\{X_i^*\}_{i=1}^n$ be a bootstrap sample from $\{X_i\}_{i=1}^n$.
    Then, by analogous developments than the ones in [23], the following bootstrap
    statistic is:


    ```

    $T_n^* = \frac{\sqrt{n}(\hat{\sigma}_d^{*2} - \sigma_d^2)}{\sqrt{\frac{1}{n}\sum_{i=1}^n
    (d_d^2(X_i^*, \hat{X}_n^*) - \sigma_d^2)^2}} \quad (5)$

    ```


    The previous status is an approximation of the distribution of $T_n$ in the worst
    situation under $H_0$. Finally, the Monte Carlo method is used in order to approximate
    the unknown distribution of $T_n^*$.


