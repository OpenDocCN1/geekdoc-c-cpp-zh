  md: '$B_h = \frac{1}{M([N/8]-1)} \sum_{i=1}^{M} \sum_{j=1}^{N} d_h(i,j) \quad (6)$


    Thus, the Wang *et al.* provides a more wider-range measure of blockness, compared
    to the base Babu *et al.* metric.

    Wang proposed two measures in order to characterize the spatial activity of the
    signal. Their motivation lies in the fact that activity is reduced by blurring.
    The activity is related to how pronounced the texture is in a particular region
    of the frame. The first measure is the average absolute difference in block-image
    samples:


    ```

    $A_h = \frac{1}{\frac{8}{M}(N-1)} \sum_{i=1}^{M} \sum_{j=1}^{N} |d_h(i,j) - B_h|
    \quad (7)$

    ```


    The second measure is the zero-crossing (ZC) rate. They define for $n \in [1,
    N-2]$:


    ```

    $z_h(m,n) = \begin{cases} 1, & ZC \text{ at } d_h(m,n) \ 0, & \text{otherwise}
    \end{cases} \quad (8)$

    ```


    the horizontal ZC rate can be estimated as:


    ```

    $Z_h = \frac{1}{M(N-2)} \sum_{i=1}^{M} \sum_{j=1}^{N-2} z_h(m,n) \quad (9)$

    ```


    The vertical features ($B_v, A_v$, and $Z_v$) are then calculated in a similar
    fashion. The overall block, activity and ZC rate are calculated as:


    ```

    $B = \frac{B_h + B_v}{2}, \quad A = \frac{A_h + A_v}{2}, \quad Z = \frac{Z_h +
    Z_v}{2} \quad (10)$

    ```


    Finally formulate an empirical model for the quality score:


    ```

    $Z_{score} = \alpha + \beta B^{\gamma} A^{\delta} Z^{\epsilon} \quad (11)$

    ```


    They used the non-linear regression available in the Matlab statistics toolbox
    to find the best value of parameters $(\alpha,\beta,\gamma_1,\gamma_2,\gamma_3)$
    for Eq. 11.

    The values calculated are used in the study presented here: $\alpha = -245.9,
    \beta = 261.9, \gamma_1 = -0.0024, \gamma_2=0.064$.


    Blockness is masked by the texture (spatial activity) in the region for which
    it is calculated. Activity measures are directly related to texture properties
    within blocks. The final Z-score is a nonlinear combination of these measures,
    which emulates the properties of the human visual system.


    All the related features are listed in Table 1. In the scope of the study presented
    here, they are good features to describe two regions of interest in test videos.
    Dynamic texture, which forms the salient part of the frame and the background
    which is non-salient.'
