    # 3 Empirical Comparative Study between Likert and Fuzzy Numbers Scales: The Mean\
    \ (Absolute) Error Associated with the Median\n\nTo compare Likert and fuzzy scales\
    \ from a statistical point of view, we examine the situation in which a person\
    \ is simultaneously allowed to give a free response in the fuzzy scale, and to\
    \ choose one of the possible responses in a Likert scale. Actually, we use a simulation\
    \ design that mimics the human behavior. To generate the two types of responses\
    \ we therefore by considering a plausible criterion. Once data are simulated we\
    \ think about what we want to compare. Many features can be chosen as suitable\
    \ tools for statistical comparison. In this paper we consider the representativeness\
    \ of the involved element through the corresponding mean absolute error.\n\nThe\
    \ general simulation process is structured as follows: 1000 iterations of samples\
    \ containing $n \\in \\{30, 50, 100, 300\\}$; a trapezoidal fuzzy number $\\tilde{U}$\
    \ can be characterized as $\\text{Tra}(\\tilde{U}_0, \\tilde{U}_0, \\tilde{U}_1,\
    \ \\tilde{U}_0)$. To generate each trapezoidal fuzzy response, we have followed\
    \ the steps in Sinova et al. [18].\n\n+   - A value $k \\in \\{4, 5, 6, 7\\}$\n\
    \n+   - One of the standard (i.e., re-scaled and translated) beta distribution\
    \ $(k-1) = \\beta(p, q)+1$ is generated at random, with $(p, q)$ varying to cover\
    \ four different situations of distributions with values in $\\{1, k\\}$, uniform,\
    \ symmetrical weighting extreme values, and an asymmetric one. The generated value\
    \ is the mid-point of the 1-level, $\\tilde{U}_{mid} = (\\tilde{U}_0+\\tilde{U}_1)/2$.\n\
    - To avoid \"wide\" (and unrealistic) fuzzy responses, some constraints on the\
    \ values for the deviations $\\tilde{U}_1-\\tilde{U}_{mid}$, $\\tilde{U}_{mid}-\\\
    tilde{U}_0$, and $\\tilde{U}_{\\text{sup}}-\\tilde{U}_{\\text{sup}}$ have been\
    \ imposed, so that they have been generated from uniform distributions on the\
    \ intervals $[0, \\min((k-1)/10, \\tilde{U}_1-1, k-\\tilde{U}_1)]$, $[0, \\min(k/5,\
    \ \\tilde{U}_1-1)]$, and $[0, \\min(k/5, k-\\\tilde{U}_{\\text{sup}})]$, respectively;\
    \ the trapezoidal fuzzy number is fully built from the generated mid-point and\
    \ deviations."
