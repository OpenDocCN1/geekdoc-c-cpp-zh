  md: '# Proximity-Based Reference Resolution to Improve Text Retrieval


    Shima Gerani¹, Mostafa Keikha¹, and Fabio Crestani¹


    **Abstract** Queries that contain named entities are very common especially in
    the blog retrieval. Current approaches for document retrieval are based on the
    frequency of query terms in documents. These methods usually estimate the query
    frequency due to the fact that named entities are usually referenced using anaphoric
    expressions. In this paper we propose a method for finding query-entity types
    including *female*, *male* and *person* which help to identify the proper set
    of pronouns that can refer to each query. We also propose a proximity-based method
    for estimating the frequency of the anaphoric expressions which are referring
    to a query-entity in a document. Experimental results on a standard blog collection
    show that the proposed method is effective and provides significant improvement
    over the term-frequency-based baseline.


    # # 1 Introduction


    Queries that contain named entities are very popular in search applications, especially
    in the context of Blog retrieval. One of the drawbacks of current approaches for
    entity retrieval is the underestimation of query-entity (i. e. the entity referred
    by the query). Frequency in the documents. This is due to the fact that named
    entities are usually referenced using anaphoric expressions, such as pronouns.
    For instance, if a document contains a person entity, pronouns such as *he*, *him*,
    *his*, etc., may be used instead of repeating the person''s name. Considering
    anaphoric expressions that refer to the query-entity can help to better estimate
    the query occurrence in the documents and improve retrieval performance. The key
    problems are: 1) identifying a feasible set of anaphoric expressions for the query-entity
    since different pronouns are used


