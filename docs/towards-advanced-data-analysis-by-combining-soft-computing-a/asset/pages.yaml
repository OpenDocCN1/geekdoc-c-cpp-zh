  md: '# Decision and Regression Trees

    in the Context of Attributes

    with Different Granularity Levels


    Kemal Ince$^1$ and Frank Klawonn$^{2,3}$


    Abstract Most data mining algorithms assume that their input data are defined
    by a fixed number of attributes and each attribute has a pre-defined domain of
    values. However, the latter assumption is often not realistic in the case of categorical
    attributes. Such attributes are often available in different levels of granularity.
    The coarsest level just has two possible values that are split into refined levels
    of granularity. Before applying a data mining algorithm, it is thus assumed that
    the domain expert for the data must choose the appropriate level of granularity
    or in tedious trial and error procedure the appropriate granularity levels are
    adapted. The problem of choosing suitable granularity is related, but not identical
    to feature selection, since the more refined granularity levels increase the risk
    of overfitting. In this paper, we propose methods for decision and regression
    trees to handle the problem of different granularity levels during the construction
    of the corresponding tree.


    # 1 Introduction


    Data mining algorithms usually assume that the data to be analysed are encoded
    in a flat data table. Rows in the table correspond to data instances and columns
    to attributes. It is assumed that categorical attributes have a fixed range of
    possible values in such a table. This is, however, in many real applications not
    the case. One has a choice of picking the level


