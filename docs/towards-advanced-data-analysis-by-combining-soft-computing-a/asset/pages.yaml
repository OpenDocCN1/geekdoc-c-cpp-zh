    Sofia University, Bulgaria, o.georgieva@fmi.uni-sofia.bg


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, p. 241–252.
    springerlink.com © Springer-Verlag Berlin Heidelberg 2013'
