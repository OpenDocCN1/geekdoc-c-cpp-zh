  md: 'Asymptotic properties of the estimators have been analyzed, and confidence
    regions and tests about the regression parameters and for the linearity have also
    been established.


    In Ferraro et al. [28] a determination coefficient, and an associated test for
    linear independence based on the preceding model, have also been extended to cover
    fuzzy-valued explanatory data by Ferraro and Giordani [30]. In Ferraro et al.
    [27] a linearity test between an LI fuzzy-valued response and a real-valued predictor
    is stated.


    A recent approach to regression-valued analysis has been developed by D''Urso
    et al. [26]. The study considers an extension of a previous model by Coppi et
    al. [17] consisting of the (classical) linear relations


    ```

    $Y^m = a_1 f_1(X_1) + \dots + a_k f_k(X_k) + \varepsilon$

    $$\inf Y^m = b_1 f_1(X_1) + \dots + b_k f_k(X_k) + c + \inf$

    \sup Y^m = d_1 f_1(X_1) + \dots + d_k f_k(X_k) + c + \sup$

    ```


    $\mathcal{Y}^m$ is a fuzzy-valued random variable, $f_i$ is a real-valued function
    representing the ''profile'' of the observation in terms of a suitably chosen
    function of $X_i$, $(a_1, \dots, a_k)$ are the vector of coefficients of the regression
    model for $Y^m$, $(b_1, \dots, d)$ are are real-valued coefficients, and the $\varepsilon$
    are the residuals of the models. It should be noted that the linear models for
    the inf and sup of the level RFS are based on the basis of the model for $\mathcal{Y}^m$,
    allowing for possible (classical) linear relations between the magnitude of the
    estimated left and right deviations, $Y^l$ and $Y^u$, and of the estimated $\hat{Y}^m$.
    To estimate a model robust procedure (avoiding the concerns related to possible
    outliers) has been suggested by replacing the least squares criterion by either
    the least squares (i.o., the median of the squared residuals) or the weighted
    least squares (assigning weights to data as outliers) on the basis of the $D_{it}$
    metric. After explaining how to estimate the parameters in the model with each
    of the two approaches, a determination coefficient is introduced, and simulations
    show empirically that in the presence of outliers the robust method outperforms
    the least squares approach.


    In D''Urso et al. [25] a method has been suggested to cluster data into rather
    homogeneous groups to subsequently fit separate least squares regression analysis
    (i.e., a different model) within each cluster.


