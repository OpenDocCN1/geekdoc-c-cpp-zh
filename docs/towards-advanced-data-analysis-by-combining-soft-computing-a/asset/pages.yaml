    of Statistical Planning and Inference* 139:750-755

    3. Viertl R (2011) *Statistical Methods for Fuzzy Data*. Wiley, Chichester

    4. Viertl R (2011) On predictive densities in fuzzy Bayesian inference. In: Faber
    M et al. (eds.). *Applications of Statistics and Probability in Civil Engineering*.
    Taylor & Francis, London'
