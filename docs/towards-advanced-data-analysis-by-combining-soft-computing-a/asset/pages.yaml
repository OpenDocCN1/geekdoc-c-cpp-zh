  md: 'Floor and ceiling constraint. A portfolio has to be well-balanced i.e. no single
    asset (or group of assets) must absorb a large proportion of the initial investment.
    This requirement is fulfilled by imposing a lower and upper limit on each asset
    weight in the final capital allocation.


    Most fund managers select their holdings from a universe of assets belonging to
    a popular market benchmark, such the S&P 500 or the Russell 3000 stock indices.
    This is because their skill is often benchmarked against the index. However, constituents
    change from time to time and some of the assets taken into account in the calculation
    of the index are held in very small quantities. A fund manager may stray from
    investing in all member stocks and instead focus on holding small and manageable
    bundles of assets, with which/she might achieve an investment goal. This practical
    necessity entails an upper limit on the number of assets included in the portfolio,
    the so-called cardinality constraint.


    A formulation of the portfolio optimisation problem encapsulating all the requirements
