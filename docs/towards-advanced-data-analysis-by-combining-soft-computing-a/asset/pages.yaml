    # 3 GARCH Extensions


    Although simple and restrictive, the symmetric GARCH(1,1) is widely used in the
    economic literature. Brooks (2008) admits that GARCH(1,1) is strong enough to
    model the volatility bursts in financial data, without the need of additional
    parameters. Thus, from a parsimonious point of view, is not always wise to increase
    the complexity of the model. Even so, theorists have suggested over time many
    variations of the GARCH model with the purpose of including additional features.
    Two such extensions considered here are asymmetric GARCH and generalized GARCH(p,q).'
