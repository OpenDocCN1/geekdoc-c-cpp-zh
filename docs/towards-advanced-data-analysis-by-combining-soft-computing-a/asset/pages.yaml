    # 5 Decision Trees


    For decision, there is another option than MDL to incorporate the selection of
    the most suitable attribute and its level of granularity the same time. If we
    only focus on the information gain, i.e. the reduction of the entropy is achieved
    by splitting with respect to a certain attribute, we would also prefer the most
    refined level of that attribute, since the entropy, will always decrease with
    splitting. However, for the construction of ordinary decision trees, there is
    already a technique that we can exploit. The gain ratio [6] was originally introduced
    to avoid the effect that predictor attributes having different values tend to
    be preferred over attributes with few values by the simple information gain as
    a measure for deciding which attribute to use for a split in a node. Although
    the gain ratio was originally introduced to compare different attributes with
    a different number of values, it can also be applied directly to a single attribute
    with different levels of granularity.


    # 6 Conclusions


    In this paper we have addressed the problem of attributes in the context of data
    mining which is often neglected although is a common challenge in real applications.
    This problem is often tackled in a way as illustrated in Figure 1, leading to
    high computational costs when all combinations of granularity levels of different
    attributes are considered. At least for decision and regression trees, the computational
    costs can be reduced drastically by incorporating the selection of the granularity
    levels in the construction of the model as it is done by the methods described
    in this paper.


    Further work is needed to extend these ideas to other data mining methods than
    decision and regression trees.'
