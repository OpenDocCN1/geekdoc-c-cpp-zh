  md: '# Dynamic Texture Recognition Based on Compression Artifacts


    Overall degradation in the quality of the sequence, due to encoder/decoder implementations
    as part of transport stream at various bit rates, is a compound of different coding
    artifacts [21]. Three types of artifacts are typically considered pointless to
    block coded data: blocking, ringing and blurring. Blocking appears in all block-based
    compression techniques, which include all contemporary codes [14] [8], due to
    quantization of frequency components [19] [20]. It can be observed as periodic
    surface discontinuity (edge) at block boundaries. These edges are perceived as
    abnormal high frequency components caused by the presence of strong texture in
    the background and blockness measures are designed to estimate what part of the
    discontinuity on the edges is due to the blocking effect vs. the texture in the
    content. In the setup proposed in this paper the blockness measures are related
    to the texture as original edges [11]. It is due to improper truncation of high
    frequency components. In the worst case, the edges can be shifted far away from
    the original edge location, observed as false edge. Blurring, which appears as
    edge smoothness or texture blur, is due to the loss of high frequency components
    when compared with the original image causing the edges to be smoother than the
    original [7] and the measures of blurring try to estimate the difference in activity
    of the original content with respect to coded version. They are profoundly influenced
    by the video content.


    A large number of published papers propose different measures of prominent artifacts
    which appear in coded images and video sequences [19]. In this study we limit
    to non-reference approaches, where only compressed video is used. This is a harder
    problem, but more realistic in applications such as video-retrieval.


    Several proposed approaches are deat in the following sections. Wang et al. [19]
    proposed a reference approach to quality assessment in JPEG coded images. Their
    final measure is derived as a non-linear combination of the blockness, local activity
    and a so-called zero-crossing measure. The combination is proposed to provide
    information regarding both blockness and blurring (via the latter measures) in
    JPEG coded images. More recently, Babu et al. [1] proposed a block measure for
    use QA, which takes effects along each edge of the block into account.


    Measures related to artifacts are usually evaluated for each frame of the sequence
    and collapsed temporally to arrive at a quality measure for the sequence [23]
    [18] [10]. Callikat et al. [5] proposed a VQA approach that improves quality estimation
    by separately considering the regions of the frame in which salient-motion is
    present and the rest of the frame. Using a simple multiscale-foreground-background
    segmentation approach, they detect the salient regions and calculate a number
    of features related to the observed temporal changes. In addition, they calculate
    the blockness and blurring measures pro'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'posed by Babu et al. [1] and Wang et al. [19] for the salient and non-sient
    parts of the frame. Using these features they train a neural-network and a decision
    tree classifier that are able to achieve state-of-the-art quality estimation on
    a per-frame basis. The final estimate of the quality is the median value obtained
    for the frames of the sequence.


    The approach of Culírk et al. has been selected as a state-of-the-art approach
    for measuring video quality that is used in the studied presented here. Since
    dynamic textures are by their very nature salient to motion, this approach enables
    us to capture the features related to the dynamic-texture part of the sequence
    frames and filter out the rest of the sequence.


    # 2.3 Classification


    Once descriptive features are extracted the preferred approaches to classification
    of dynamic textures seems to the Nearest Neighbor (NN) classifier and Support
    Vector Machines (SVM) [26] [33] [6].


    Culibrk et al. [5], in the other hand, proposed using a decision tree classifier
    or a Multi Layer Perceptron (MLP) [9] neural network to estimate the quality of
    video based on their features. In addition, they performed automatic feature selection
    to evaluate the impact of saliency and showed that an MLP classifier can achieve
    good results using a set of just 5 features.


    Here we propose using an MLP based classifier to discern different texture classes.
    Neural networks represent a class of machine learning algorithms designed to follow
    the basic principles of biological neural cells and as such the interconnected
    nodes that receive input connections, do simple processing and pass the signal
    out to other neurons. The connections between the neurons emulate the synapses
    between the neurons in biological systems and are assigned weights that code the
    relative influence between the connected nodes. In artificial neural networks
    the weights are learned from data in order to create classifiers or estimators
    with the desired behavior.


    To enhance the performance we propose using Adaptive Boosting [16]. The effect
    of such an approach is analogous to creating a cascade of neural network classifiers,
    each trained on the set of examples that are incorrectly classified by the preceding
    stages.


    Schwenk and Bengio [17] discuss the merits of such an approach in detail.'
