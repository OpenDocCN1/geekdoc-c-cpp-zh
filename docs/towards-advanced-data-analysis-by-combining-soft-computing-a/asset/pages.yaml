    mathbb{R})$\n$(X_\\alpha(\\omega) = (X(\\omega))_\\alpha)$ is a random interval.\
    \ Equivalently,\nRFN can be formalized as a Borel measurable mapping w.r.t. the\
    \ Borel\nsassociated with $\\rho$. The Borel\nmeasurability implies that one can\
