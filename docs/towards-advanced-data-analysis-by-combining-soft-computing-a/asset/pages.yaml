    # ## Social Network Analysis


    Social network analysis has already become popular before websites like Facebook,
    XING and Google++ — now understood/known as social networks were launched. In
    [33] a comprehensive approach of modeling social data as (un)directed graphs has
    been proposed and has been widely accepted. Over the years, much research has
    been performed on the cohesiveness of members in social graphs [36] or segmentation
    of social networks [16]. All these methods have in common that they use a static
    representation of the social graph underlying the respective network.


    Attempts have been made to inform from dynamic graphs (e.g. in [1]) but they either
    restrict themselves to fairly simple questions or to cope with the changing structure
    of the graph. These approaches suffer from discretized images of an originally
    continuously changing structure. Such discretization results from some kind of
    binning operation performed on the data, thus leading to a loss of information,
    namely the exact time when an event has happened. Such an approach does not handle
    the frequency with which events occur but lists their absolute number.


    The Butterworth filter [3] is one of the best-known infinite response filters.
    One of its most interesting features is its flat frequency response, i.e. it does
    not generate ripple effects, when the signal strength changes. Interpreting the
    binned events of a social graph as a time- and strength-discretized signal the
    filter response of such a Butterworth filter should have the desired properties
    that events (dirac pulses) can be binned while keeping some information on the
    frequency.'
