    It is well-known that two high tides and two low tides are usually observed each
    day. Experimental data regarding tidal fluctuations is usually given by the heights
    reached in the high tides as well as the heights reached in the two low tides.
    To sum up these observations in an unique value would entail a loss of information
    that can be avoided by using compact intervals between the minimum and maximum
    heights the tides reach in a day at a specific place. For instance, in [6, 11,
    22].


    Random elements have been shown to be useful in handling this kind of random elements
    for, for instance, [17, 12, 15], when the interest is focused on the associated
    random element for which values are intervals instead of the real-valued variables
    determining either the extremes of the intervals or inner points within them.
    They were introduced to formalize imprecise experimental data which can be described
    by means of intervals. Then, random elements associate compact intervals with
    experimental outcomes.


    The aim of this paper is not a random interval is equal to, greater or less than
    a given value. One-sample tests for a Frechet-type variance in the fuzzy context
    have been previously developed by taking into account different situations in
    Lubiano et al. [18] and in Ramos-Guajardo et al. [23]. Here, the idea is to derive
    from the studies considering the results for the interval case by considering
    a generalized metric introduced in [24], in order to apply to the proposed real-life
    situation.


    Some preliminaries are first in Section 2. A brief review of statistical hypothesis
    tests about the variance of a random interval is then presented in Section 3.
    In Section 4 some simulations of the proposed tests are reported. Section 5 shows
    an application to a real-life study about the variability of tidal fluctuations
    in the port of Gijón (Ast). Finally, some conclusions and lines of research are
    gathered in Section 6.


    # 2 Preliminaries


    Let $K_c(\mathbb{R})$ be the class of the nonempty convex subsets of $\mathbb{R}$.
    An interval $A \in K_c(\mathbb{R})$ can be expressed in two different ways. The
    first one is based on the infimum and the supremum of $A=[inf A, \sup A]$ satisfying
    the order constraint $inf A \leq \sup A$. Due to the difficulties arising with
    order restrictions, it is often more convenient to work with the $mid/spread$
    parametrization of $A$, $(mid, spr) \in \mathbb{R} \times \mathbb{R}^+$, which
    is defined as


    ```

    mid A = (sup A + inf A)/2 \quad \text{and} \quad spr A = (sup A - inf A)/2).

    ```'
