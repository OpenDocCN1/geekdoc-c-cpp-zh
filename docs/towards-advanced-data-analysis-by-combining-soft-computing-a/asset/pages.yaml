  md: "Pricing of Catastrophic Bond in Fuzzy Framework\n\nThere is one important difference\
    \ between cat bonds and more classical types of bonds. The payment function of\
    \ a cat bond depends on some additional random variable, i.e.c occurrence of some\
    \ natural catastrophe in the specified region and the fixed time interval. Such\
    \ an event is called triggering point. Catastrophic bonds may be related to various\
    \ kinds of triggering points — e.g. to magnitudes of earthquakes, the losses from\
    \ flood, the insurance industry index of losses, some parameters of catastrophic\
    \ events, etc. The structure of payments for cat bonds also depends on some primary\
    \ underlying asset, like LIBOR (London Interbank Offered Rate).\n\n# 3.1 Catastrophic\
    \ Bond with Stepwise Payoff Function\n\nLet $0 < K_1 < ... < K_n > 1$, be a sequence\
    \ of constants and $\tau_i : \\Omega \rightarrow [0,T]$, $1 \\le i \\le n$ be\
    \ a sequence of stopping times defined as follows\n\n$\\tau_i(\\omega) = \\inf_{t\
    \ \\in [0,T]} \\{\\tilde{N}(\\omega) > K_i \\}, 1 \\le i \\le n.$\n\nLet $w_1\
    \ < w_2 < ... < w_n$ be a sequence of nonnegative constants, for which $\\sum_{i=1}^n\
    \ w_i\\Phi_i = \\Phi = \\sum_{i=1}^n w_i\\Phi_i$, where $\\Phi_i$ are cumulative\
    \ distribution functions of $\\tau_i$.\n\n**Definition 1.** We define $IB_s(T,\
    \ FV)$ a catastrophic bond satisfying the following:\n\n+   a) If the bond does\
    \ not occur in the period $[0,T]$, i.c. $\\tau_1 > T$,\n\n+   b) If $\\tau_n \\\
    le T$, the bondholder receives the face value minus the sum of write-coefficients\
    \ in percentage $\\sum_{i=1}^n w_i$.\n\n+   c) If $\\tau_{k-1} \\le T < \\tau_k$,\
    \ $1 \\le k \\le n$, the bondholder receives the face value minus the sum of write-coefficients\
    \ in percentage $\\sum_{i=1}^k w_i$.\n\n+   d) Cash payments are at date of maturity\
    \ $T$.\n\n# 4 Pricing of Catastrophic Bonds\n\n# 4.1 General Formula\n\nThe first\
    \ step in our considerations is to obtain the valuation formula for $IB_s(T, FV)$.\
    \ We denote by $\\nu_{IB_s(T,FV)}$ a general payoff function which depends on\
    \ $T$, $FV$ and the Compound Poisson process $\\tilde{N}$. The following theorem\
    \ from [18] for a general form of catastrophic bond $IB_{cat}(T, FV)$ with a payoff\
    \ function $\\nu_{IB_{cat}(T,FV)}$ is applied."
