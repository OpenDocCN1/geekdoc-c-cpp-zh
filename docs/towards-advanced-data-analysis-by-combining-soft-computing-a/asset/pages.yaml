  md: '# Mining Local Connectivity Patterns in fMRI Data


    In order to simplify the processing, the voxel coordinates $(x, y, z)$ are mapped
    (in an essentially arbitrary, but fixed fashion) to a linear index $v$ with $1
    \le v \le V = X \cdot Y \cdot Z$. In this way a data set can be represented by
    a data matrix $SV^T$. By $s_v = (s_{v,1}, s_{v,2}, \dots, s_{v,T})^T$, that is,
    the $v$-th row of $S$, we denote the time series of voxel $v$.


    As the data are artificially scaled, a meaningful and comparable notion of activity
    (magnitude) arises from a relative interpretation. In the following, we derive
    a binary and a soft notion of voxel activity by considering at any given time
    division by local average intensity. The binary notion can be a limiting case
    of the soft notion.


    **Binary Notion of Activity.** We use a simple discretization in order to assign
    each value in a time series one of the two qualitative states active. Formally,
    the dichotomized time series $d_v$ of voxel $v$ is given by $d_v = (d_{v,1}, d_{v,2},
    \dots, d_{v,T}) \in \{0,1\}^T$ induced by the function $d(s_v) = H(s_v - s_v)$,
    where $s_v$ denotes the median of the time series $v$, and $H$ is the Heaviside
    function, defined as $H(x) = 1$ if $x > 0$ and $0$ otherwise. In other words,
    a voxel is regarded as active at a point in time if the corresponding signal intensity
    value amounts to at least the mean of the respective time series. The median was
    chosen because the mean is less sensitive to outliers.


    Note that this very simple approach naturally opens to many points of criticism.
    For example, it enforces that a voxel is active half of the time, which is clearly
    detailed. However, it already leads to useful results and we thus defer better
    discretization schemes to future work.


    Note also that the concise binary time series $d_v$ can be exploited in order
    to speed up subsequent analysis through a highly efficient implementation using
    bit vectors, but this advantage comes at the expense of the inevitable loss of
    information due to the discretization.


    **Soft Notion of Activity.** The above discretization implies an extreme sharpening
    of the signal: whereas the actual signal rises gradually over time, the discretization
    enforces a sharp instantaneous change once the median is reached. Effectively,
    the signal is transformed into a square-wave signal, increasing the contrast at
