- img_proc: true
  md: 'T. Low et al.


    distance, suffer from a loss of relative contrast. This effect is also known as
    distance concentration [2] and causes the relative difference in the distance
    of a given query point to its nearest and farthest neighbor to vanish.


    Another (called) hubs, which was first described as a general problem in [10].
    Here hubs are defined as data points that appear unusually often as the k neighbors
    of other data points. Described in statistical terms, the distribution of the
    number of times a data point occurs in the nearest lists of other data points
    is skewed right. This phenomenon has been examined and demonstrated to be present
    in many real-world data sets in [11], where it was also analyzed how it affects
    a broad spectrum of machine learning tasks and dimensionality reduction techniques.
    The core claim of both papers,[10] and [11], is that the emergence of hubs is
    an intrinsic effect of the dimensionality of the space—a claim we dare to challenge
    here.


    Our claim in this paper is that the hubness phenomenon is an effect of a density
    gradient, not an effect of the dimensionality of the data space. However, if the
    data points are sampled from a region that is bounded, there is nearly a density
    gradient at the boundary of the region. Since the ratio of the area of the surface
    (i.e. the boundary) of the region to its (hyper-)volume increases exponentially
    with the dimensionality of the data space (the density data points), the density
    gradient at the boundary is emphasized (and thus makes the hubness phenomenon
    more than not). This explains the observations of [11]. However, high dimensionality
    is not the only cause; by sampling from a boundary-less high-dimensional space,
    for which the hubness phenomenon is essentially nonexistent. We also show that
    the strength of the hubness phenomenon depends on the relative size of the boundary
    of the sampling region. In addition, we show that introducing many boundaries
    (and thus many places with a density gradient) in a low-dimensional samples limits
    the hubness phenomenon.


    The remainder of this paper is organized as follows: In Section 2 we define the
    hubness phenomenon and several measures by which we capture its strength, obtaining
    proper means to quantify and compare this phenomenon over different data sets.
    In Section 3 we describe our data generator, that is, the procedures we use to
    generate high-dimensional data sets as well as the structure of these data sets.
    In Section 4 we describe the experiments (on artificial data) we conducted and
    interpret our results. Finally, in Section 5 we draw conclusions from our discussion.


    # Measuring Hubness


    Before we define measures for the strength of the hubness phenomenon, we have
    to introduce the notions on which it is based. Let X = {x_1, ..., x_n}'
