  md: 'P. Held et al.


    For the purpose of storing event information in a coherent way across multiple
    edges in the interaction graph it is useful to use only global frequency to apply
    the same filter on all edges. This removes the need to store the individual filter
    parameters, and results in only storing the last few signal and filter response
    values to be able to calculate the new filter response with the given, global
    parameter set.


    Such a multi signal optimization can be performed if not only the MSE of an individual
    signal is calculated for each frequency but the MSE over all edges of the graph.
    The number of local extrema $k_{avg}$ is equally easy to obtain as the average
    number of extrema contained over all edges. With this the multi signal objective
    functions are


    ```

    $AIC(f) = 2k_{avg} + n \cdot (MSE_{global})$$\nBIC(f) = k_{avg} \cdot \ln(n) +
    n \cdot (MSE_{global}),$

    ```


    respectively, where


    ```

    $MSE_{global}(f, X) = \frac{1}{\|X\|} \sum_{x \in X} \sum_{i=1}^{\|} (x_i - y(i))^2$

    ```


    can be considered a MSE over all considered bins.


