  md: '# Fuzzy Hyperinference-Based Pattern Recognition


    Mario Rosario Guarracino^1, Raimundas Jasinevicius^2, Radvile Krusinskiene^2,
    and Vytautas Petrauskas^2


    **Abstract** The paper presents a new approach to the problem of pattern recognition.
    First of all, here is emphasized that the problem itself is fuzzy recognition.
    Later three following novelty of the approach are disclosed: 1) the rule-based
    fuzzy inference, concerning the measure of patterns'' similarity, is enriched
    by an idea of hyperinference; 2) the description of the main pattern recognition
    process is based on Takagi-Sugeno reasoning procedure and 3) rule weights in T-S
    procedure are defined, solving linear or piecewise linear programming problem
    (LPP or PWLPP), constructed according to the fuzzy experts'' information. The
    proposed approach was used successfully for recognition of healthy people and
    those who suffer from illness (for example, an atherosclerosis). The classification
    was performed according to person''s clinical posturograms (stabilograms). At
    the end of this paper experimental results are presented as well as acknowledgement
    to anonymous participants of the experiments.


