  md: "# # Fuzzy Probability Distributions in Reliability Analysis,\nfuzzy HPD-regions,\
    \ and\nfuzzy Predictive Distributions\n\nReinhard Viertl¹ and Shohreh Mirzai Yeganeh¹\n\
    \n**Abstract** In reliability analysis there are different kinds of uncertainty\
    \ present: variability, imprecision of lifetimes, model uncertainty concerning\
    \ probability distributions, and uncertainty of a-priori information in Bayesian\
    \ analysis. For the description of imprecise lifetimes fuzzy numbers are suitable.\
    \ In order to model the uncertainty of a-priori information fuzzy probability\
    \ distributions are the most-up-to-date mathematical structure.\n\n# ## Introduction\n\
    \nThe variability of lifetimes of similar units is usually described by random\
    \ variables $T$ and related probability distributions. More recently imprecise\
    \ lifetime data, like trees in environmental statistics, recreation times after\
    \ dices, but also data like amounts of toxic materials released to the environment,\
    \ are modeled by so-called fuzzy numbers [1, 2]. These fuzzy numbers are fuzzy\
    \ subsets of the set of real numbers $\\mathbb{R}$\n\n+   1. $\\xi : \\mathbb{R}\
    \ \rightarrow [0;1]$;\n2. $\\delta \\in (0;1]$ the so-$\\delta$-cut $C_\\delta(\\\
    xi)$ defined by $C_\\delta(\\xi) := \\{x \\in \\mathbb{R} \\mid \\xi(x) \\geq\
    \ \\delta\\} \neq \\emptyset$, and all $\\delta$-cuts are finite unions of compact\
    \ intervals;\n3. $supp(\\xi)$ is contained in a compact interval.\n\nFunctions\
    \ $(\\xi)$ 1 - 3 are called *characterizing functions*. If all $\\delta$-cuts\
    \ of a fuzzy number are compact intervals, then this number is called *fuzzy uncertainty*.\
    \ The set of all fuzzy intervals is denoted by $\\mathcal{F}(\\mathbb{R})$. A\
    \ generalization of probability densities which is necessary in connection with\n\
    \n¹ Department of Statistics and Probability Theory, Vienna University of Technology,\
    \ A-1040 Vienna, Austria, r.viertl@tuw.ac.at · shohreh.mir@gmail.com\n\nC. Borgelt\
    \ et al. (Eds.): Towards Advanced Data Analysis, STFUZZ 285, pp. 99-106. springerlink.com\n\
    © Springer-Verlag Berlin Heidelberg"
