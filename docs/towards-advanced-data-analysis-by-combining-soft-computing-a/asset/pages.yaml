    In other words, the incoming data is only processed if the current model cannot
    predict the incoming input well enough; otherwise the new data does not contain
    any new information regarding the current model. Both thresholds can be set heuristically.


    # Algorithm 1. processData(x*, y*)


    ```

    data: X, Y

    1 init: max, thMu, thVar\ // get prediction for new data

    2 if abs(mu - y*) > thMu or var > thVar then // if prediction is not good

    3 enough of mean value and variance

    4 X = X x* // add new input to the active set

    5 Y = Y y* // add target to the active set

    6 Q = update(Q, x*)

    7 len = length(X)

    8 if len > max then // if the active exceeded maximum size

    9 for i = 1 to do // foreach basis function in the active set

    10 Qt = downdate(Q, Xji) // downdate inversion

    11 Xt = X \ Xi // remove i-th basis input

    12 Yt = Y \ Yi // remove i-th basis target

    13 s(i) = min(Qt, Xt, Yt) // temporary calc. log-marginal likelihood

    14 end

    15 im = argmin(s) // get index of the worst basis function

    16 X = X \ Xim // remove the worst basis input

    17 Y = Y \im // remove the worst basis target

    18 Q = downdate(Q, Xim) // downdate inversion

    19 end

    20 hyp = minimize(X, Y, hyp) // optimize hyperparameter values

    21 Q = inv(X, Y, hyp) // calculate inversion for new hyperparameter values

    ```


    In the case of "unknown" data regarding the current model, it is added to the
    active set. This actually consists of two sets: the active set of X and the set
    of Y. Furthermore, the inversion of the covariance matrix Q is constructed using
    a rank-1 update.

    If the maximum size of the active set is exceeded, the less informative basis
    function is removed. The less informative basis in the active set is found by
    temporarily eliminating basis function from the set and calculating the negative
    log-marginal likelihood for the rest of the basis functions. The rank-1 downdate
    of the covariance matrix inversion Q is used, as it is needed to calculate the
    log-marginal likelihood. The subset with the lowest negative-likelihood is retained,
    the corresponding eliminated basis function is removed from the active set and
    the covariance matrix inversion Q is properly downdated.'
