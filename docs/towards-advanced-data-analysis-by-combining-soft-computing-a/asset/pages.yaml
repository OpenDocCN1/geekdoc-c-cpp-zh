    # # 6 Worst Expected Outcome


    Recognizing the statistical variability of final outcomes, many researchers applying
    metaheuristic optimisation techniques tend to report deviations from average algorithmic
    performance. In practical applications it might be more useful to focus on the
    worst algorithmic outcome that is likely to be observed with a certain probability.
    This *safety-first approach to evaluating algorithmic performance can be implemented
    by calculating partial moments and critical points associated with the tails of
    the distribution of the performance metric of interest.


