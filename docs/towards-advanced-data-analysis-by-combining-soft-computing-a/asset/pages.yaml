    # 5 Complexity


    The main difficulty with the presented approach to fuzzy clustering based on coverings
    is finding all the maximal cliques of a graph is an NP-complete problem, that
    cannot be approximated in polynomial time [8]. Here, this procedure is feasible
    if the size of the set O allows to compute the maximal cliques in reasonable time
    for the desired application.


    There are number of algorithms in the literature that try to compute maximal cliques
    as efficiently as possible [11, 14, 3]. The fact that for these algorithms have
    to be applied to every-cut of the relation may be alleviated since each maximal
    clique at one level includes maximal cliques in the previous level, and each clique
    at the later level is included in at least our clique at the former level, hence
    allowing for bounding the subsequent search. Existing algorithms may be adapted
    in this sense. The time efficiency of the algorithms described in [11, 14, 3]
    can be found in the papers for a number of experiments. For instance, in [11],
    for a graph with $10^4$ objects and different edge probabilities, finding all
    maximal cliques (up)'
