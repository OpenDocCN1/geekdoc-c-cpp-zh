  md: "Fuzzy Probability Distributions in Reliability Analysis\n\n# 3.3 Generalized\
    \ Fuzzy HPD-regions\n\nFrom the a-posteriori density a generalization of confidence\
    \ regions, especially highest-a-posteriori density regions (HPD-regions) can be\
    \ constructed.\nLet $\\pi^*(t_1^*, \\dots, t_n^*)$ be the fuzzy a-posteriori density\
    \ of $\theta$, and $\\Theta \\subseteq \\mathbb{R}^k, \\delta \\in (0,1], \\alpha\
    \ \\in (0,1]$ and $1-\\alpha$ the coverage probability. Moreover, defining $D_\\\
    delta$ to be the set of classical probability densities $g$ on $\theta$ for which\
    \ $\\pi_\\delta(\theta) \\le g(\theta)$ $\\forall \theta$, we define the generating\
    \ system of subsets of $\\Theta$ from which the generalized HPD-region, is obtained.\n\
    For $g \\in D_\\delta$ let $HPD_{1-\\alpha}$ be the standard HPD-region for $\t\
    heta$ with coverage probability $1-\\alpha$. Then the family of generalized subsets\
    \ of $\\Theta$, denoted by $(A_\\alpha,\\delta)$, is defined by\n\n```\n$A_\\\
    alpha := \\bigcup_{g \\in D_\\delta} HPD_{1-\\alpha}(g) \\quad \\forall \\delta\
    \ \\in (0,1]. \\quad (17)\n```\n\nThe membership function $\\varphi(\\cdot)$ of\
    \ the HPD-region is given by the so-called construction lemma, i.e.,\n\n```\n\
    $\\varphi(\\theta) := \\mathbf{1}_{A_\\alpha}(\\theta : \\delta \\in [0;1]) \\\
    quad \\forall \\theta \\in \\Theta. \\quad (18)\n```\n\n> Remark 2. In the case\
    \ of classical a posteriori density $\\pi(t_1,\\dots,t_n)$, the membership function\
    \ $\\varphi(\\cdot)$ coincides with the indicator function $\\mathbf{1}_{HPD_{1-\\\
    alpha}}(\\cdot)$ of the classical HPD-region. This is seen by $D_\\delta = {\\\
    pi([\\cdot)]}$ $\\forall \\delta \\in (0,1]$ and therefore $HPD_{1-\\alpha} =\
    \ HPD_{1-\\alpha}$ $\\forall \\delta \\in (0;1]$ which yields\n\n```\n$$\\bigcup_{g\
    \ \\in D_\\delta} HPD_{1-\\alpha}(g) = HPD_{1-\\alpha} \\quad \\forall \\delta\
    \ \\in (0;1]. \\quad (19)\n```\n\nTherefore $A_\\alpha = HPD_{1-\\alpha}$ $\\\
    forall \\delta \\in (0;1]$, and $\\varphi(\\cdot) = \\mathbf{1}_{HPD_{1-\\alpha}}(\\\
    cdot)$.\n\n# 3.4 Fuzzy Predictive Densities\n\nAnother application of fuzzy a-posteriori\
    \ densities is the construction of generalized predictive densities $p(t_1^*,\\\
    dots,t_n^*)$ for lifetimes. In the classical case the predictive density is defined\
