  md: '# # Comparing the Medians

    of a Random Interval Defined

    by Means of Two Different $L^1$ Metrics


    Beatriz Sinova$^1$ and Stefan Van Aelst$^2$


    **Abstract** The standard central tendency measure for interval-valued data is
    the Aumann-type expected value, but as in real settings it is not always convenient
    because of the big influence that small changes in the data as have on its estimate.
    The aim of this paper is to explore other summary measures with a more robust
    behavior. The real-valued case has served as inspiration to define the median
    of a random interval. The definition of the median as a ‘middle position’ value
    is not possible here because of the lack of a total order in the space of interval
    data, so the median is defined as the element that minimizes the mean distance,
    in terms of an $L^1$ metric (extension of the Euclidean distance in $\mathbb{R}$),
    to the values the random interval can take. The two metrics that we consider are
    the generalized Hausdorff metric (like the well-known Hausdorff metric, but includes
    a parameter which determines the relative importance of imprecision with respect
    to the difference in location) and the 1-norm metric introduced by Vitale. The
    aim of this paper is to compare these two approaches for the median of a random
    interval, both theoretically based on concepts commonly used in robustness and
    empirically by simulation.


    # # Introduction and Motivation


    Statistical data obtained from random experiments can be of a very different nature.
    Data frequently appears when intrinsically imprecise measurements (like fluctuations,
    ranges, censoring times, etc.) or values associated with some knowledge on numerical
    values when dealing


