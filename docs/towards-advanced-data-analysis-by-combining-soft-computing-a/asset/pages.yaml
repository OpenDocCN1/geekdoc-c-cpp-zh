    Another statistical problem for which an approach has been proposed in the one-dimensional
    imprecisely-valued case is that of defining a robust measure of the central tendency
    of an RE by extending the notion of median. Because of the lack of a universally
    acceptable ranking between (fuzzy set) sets, one to extend this notion is to define
    the median as a (fuzzy set) value minimizing a certain $L^1$-distance w.r.t. the
    RE. In the interval-valued case, two convenient choices have been given by considering
    the Harmonic mean (a generalized version), leading to the interval value $Me(X)=[Me(X)-spr(X),
    Me(X)+spr(X)]$ (see Sinova et al. [55]), or the one-norm (introduced in Sinova
    et al. [57] for RFs with $p=1$ ) leading to the interval values(s) $Me(X)=[Me(X),
    sup(X)]$. An empirical comparison between the medians is included in this book
    [58]. As we have just mentioned, the second approach has been recently extended
    to a fuzzy number coinciding levelwise with $(Me(X))_x=\{Me(X), sup(X)\}$. However,
    the first approach cannot be trivially extended because one could trivially state
    sufficient and necessary conditions for the mid and spr to determine an interval
    value, one cannot state separately and necessary conditions for the mid and spr
    to allow constructing a fuzzy number (see Sinova et al. [56]).'
