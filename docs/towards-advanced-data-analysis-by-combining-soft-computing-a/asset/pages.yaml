  md: 'In the present paper we focus attention on sources a) and c. To this purpose,
    the notion of Fuzzy Random Variable (FRV) is utilized [11]. By means of it, we
    simultaneously take into account the uncertainty due to the randomness and to
    the precision/vagueness of the observed data. A regression model, in this context,
    aims at establishing a link between a random fuzzy response variable, $Y$, and
    a set of random fuzzy explanatory variables, $X_1, \dots, X_p$. When this is expressed
    in functional terms, the model may be written in the following way:


    $$\tilde{Y} = \tilde{f}(X_1, \dots, X_p),$$


    where both $\tilde{E}(\cdot)$ and $\tilde{f}(\cdot)$ of the above model in the
    framework of parametric inference would require the explicitation of the family
    of joint densities


    $$\tilde{Y}/\tilde{X}_1, \dots, \tilde{X}_p/\theta,$$


    where $\theta$ is a vector of parameters, or at least of the conditional densities


    $$\tilde{Y}/\tilde{X}_1, \dots, \tilde{X}_p/\theta.$


    An attempt in this direction has been made by Näther and co-authors [9, 10, 12].
    Unfortunately, several limitations have been found when trying to extend a complete
    inferential parametric theory of linear models to the case of fuzzy variables.
    One of these limitations consists in the lack of an appropriate family of sampling
    models for FRVs supporting the development of a complex inference framework (consider,
    for example, the difficulty in defining a suitable Normal of FRVs).


    In the present paper a different approach is adopted. First, the membership-functions
    of the involved variables are formalized in terms of $LR$ numbers (in particular
    triangular numbers characterized by three parameters: center, left spread, right
    spread). Then an appropriate distance between triangular numbers is introduced
    and an isometry is found between the space of triangular fuzzy numbers and $\mathbb{R}^3$.
    This allows the construction of a parametric regression model linking respectively
    the center, left spread and right spread of the response variable to the centers
    and spreads of the explanatory variables. Sublatable transformations of the spreads
    of the response are utilized to ensure the non-negativity of the estimated spreads.


    While the point estimation problem concerning this model has been dealt with in
    previous works ([6, 7, 8], the main objective of the present paper consists in
    the evaluation of the sampling variation of the estimated regression parameters.
    This is achieved by mean of confidence intervals, which are constructed by applying
    an appropriate bootstrap procedure.'
