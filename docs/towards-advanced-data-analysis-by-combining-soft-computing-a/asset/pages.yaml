  md: '# Derivation of Linguistic Summaries is Inherently Difficult:

    Can Association Rule Mining Help?


    Janusz Kacprzyk¹ and Slawomir Zadrożny¹,²


    **Abstract** We present first the essence of fuzzy linguistic summaries, indicate
    their relation to fuzzy queries with linguistic quantifiers, and show a taxonomy
    of protoforms of linguistic summaries indicating that a general protoform, which
    corresponds to some type of an IF-THEN rule, parallels the structure and process
    of an association rule. We show that the use of our fuzzy querying interface makes
    it possible to operationalize the process of definition, updating and processing
    of linguistic summaries (fuzzy values, fuzzy relations, linguistic quantifiers,
    etc.) and their corresponding fuzzy association rules of a special type. We develop
    them for a mining algorithm based on AprioriID. This is clearly a step towards
    an effective and efficient method for the generation of linguistic data summaries
    which is badly needed for their proliferation in practice.


    # # 1 Introduction


    We deal with *linguistic data(base) summaries* which try to grasp the very meaning
    of a (usually huge) set of (numeric, in our case) data via a simple and short
    statement in natural language. For instance, a (possibly huge) noticed database
    yet informative linguistic summary may be “most young and highly qualified people
    have high salaries.” The need for data summarization, one of the best candidates
    to be possessed by any intelligent system, is a direct result of an abundance
    of data that is beyond human cognition and comprehension, and that for a human
    being the only fully natural means of communication is natural language.


