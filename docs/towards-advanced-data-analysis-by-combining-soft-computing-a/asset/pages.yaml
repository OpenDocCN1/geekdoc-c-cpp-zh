  md: '# # Lasso-type and Heuristic Strategies

    in in Model Selection and Forecasting


    Ivan Savin¹ and Peter Winker²


    **Abstract** Several approaches for subset recovery and improved forecasting accuracy
    have been proposed and studied. One way is to apply a regularization strategy
    and solve the model selection task as a continuous optimization problem. One of
    the most popular approaches in this research field is given by Lasso-type methods.
    An alternative approach is based on information criteria. In contrast to the Lasso,
    these methods also work well in the case of highly correlated predictors. However,
    this performance can be impaired by the only asymptotic consistency of information
    criteria. The resulting discrete optimization problems exhibit a high computational
    complexity. Therefore, a heuristic approach (Genetic Algorithm) is applied. The
    two strategies are compared by means of a Monte-Carlo simulation study together
    with an empirical application to leading business cycle indicators in Russia and
    Germany.


    # # 1 Introduction


    The model selection process is crucial for the further analysis of any multiple
    regression model and its forecasting performance. Picking up too many regressors
    increases the variance of the constructed model, and taking fewer regressors than
    needed might result in biased and inconsistent estimates. Both of problems can
    also have negative effects on the quality of forecasts based on the models application
    of these methods.


    +   ¹ DFG Research Training Program “The Economics of Innovative Change”, Friedrich
    Schiller University Jena and Max Planck Institute of Economics, Bachstrasse 18k
    Room 216, D-07743 Jena, Germany, `Ivan.Savin@jena.de`


    +   ² Justus Liebig Giesen, Licher Strasse 64, D-35394 Giesen, and Centre for
    European Economic Research, Mannheim, `Peter.Winkler@wirtschaft.uni-giessen.de`


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STFUZZ 285, pp. 165–176.
    springerlink.com


    © Springer-Verlag Berlin Heidelberg 2013'
