    # 3.2 Modified AMOSA for Multi-objective Feature Selection


    AMOSA is a generalized version of simulated annealing for multi-objective optimization
    problems, which was proposed in [3]. AMOSA, a Pareto based simulated annealing
    method, incorporates the concept of an Archive where the nondominated solutions
    are kept so far. In contrast to the original suggestion [3], we use a fixed-size
    Archive, AL, instead of a soft and a hard limit. Similarly to the original AMOSA,
    initially a random Archive is generated with $\beta$ solutions, where $\beta$
    is a constant, $0<\beta\leq3$. In NSGA-II, the solutions are encoded as a binary
    vector. The fitness evaluation is done for each Archive solution by using relation.
    Only the obtained nondominated solutions are used to utilize the Archive. Here,
    the fast nondominated sorting mechanism is used to rank the solutions [11]. During
    the search, if the number of solutions in the Archive is higher than AL, the first
    AL solutions in the rank order are chosen from the Archive. Eventually, the ranked
    “1” solutions will constitute the Archive. Table 1 describes the parameters that
    need to be set as priori.


