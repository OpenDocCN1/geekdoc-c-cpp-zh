    \ these two medians of real-valued random variables are not unique, the usual\
    \ criterion of choosing the mid-point of the interval of possible medians is used\
    \ to guarantee that Med[X] is nonempty.\n\nBoth medians preserve most of the elementary\
    \ operational properties of the median in real settings. Namely,\n\n# **Proposition\
    \ 1.** Suppose that $X$ is a random interval associated with a probability space.\n\
    \n+   * if the distribution of $X$ is degenerate at an interval value $K \\in\
    \ K_c(\\mathbb{R}),\n\n$$Me[X] = K,\\nMed[X] = K.$$\n\n+   * for any $K \\in K_c(\\\
    mathbb{R})$ and $\\gamma \\in \\mathbb{R}$,\n\n$$Med[\\gamma \\cdot X + K] = \\\
    gamma \\cdot Med[X] + K,\\nMed[\\gamma \\cdot X] = \\gamma \\cdot Med[X] + K.$$\n\
    \nOne remark about a distinctive feature in contrast to the real-valued case is\
    \ that neither the $d_{hu}$-median nor the $\rho_1$-median of a random interval\
