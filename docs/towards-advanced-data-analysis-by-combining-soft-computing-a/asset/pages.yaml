  md: '# Data Sets


    For the analysis and validation of our method we used the well-known Enuron data
    set. We removed all external contacts from the data (Enuron employees sending
    mails to non-Enuron employees) and all mail contacts with mailing lists. Duplicates
    (firstname.lastname vs. lastname) have been reduced to one single node and were
    sent to several users at once were treated as separate events (that a mail sent
    from A to B was considered as two identical mails that were sent from A to B and
    from A to C).


    # Applying the Filter to the Data


    As the Butterworth filter produces a continuous signal we want the filter response
    to be $1/l$ for a time step of length $l$ to give a better generalization. This
    restriction and the fact that it produces an equal sum of values over continuous
    time span directly lead to two adverse goals in finding an optimal filter to describe
    the difference:


    +   1. Minimize the difference between the discretely binned signal and the filter
    response

    2. Find a frequency $f \in (0,1)$ that produces a continuous, smooth and nearly
    linear approximation of the signal (i.e. has only a few extrema).


    While the number of extrema can be reduced by lowering the passband frequency
    (the error can be reduced by increasing it). This interrelation is illustrated
    by Fig. 1, which shows the filter response for three different passband frequencies
    when applied to event data from the Enuron data set (for simplicity, the data
    were treated as if belonging to the same day). Of course the data should be split
    into up real edges for any further analysis.

    To evaluate the total complexity of the resulting model depending on the frequency
    we adapted Akaike and Bayesian Information Criterion (AIC / BIC) we want to optimize
    on. For any given frequency $f$ we can compute the squared error (MSE) for the
    resulting signal and count the number of extrema. The number $n_e$ of extrema
    can be used as a measure for the complexity of the resulting curve by assuming
    we have

    $$AIC(f) = 2k - 2 \cdot \ln(L) \quad \text{and} \quad BIC(f) = k \cdot \ln(n_e)
    - 2 \cdot \ln(L),$$

    Thus, the objective functions we need to minimize are


    ```

    $AIC(f) = 2k - 2 \cdot \ln(L) \quad \text{and} \quad BIC(f) = k \cdot \ln(n_e)
    - 2 \cdot \ln(L),$

    ```


    > 1 Obtained from http://www.cs.cmu.edu/~enuron.'
