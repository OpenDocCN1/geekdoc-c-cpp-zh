    # 6 SADF (Statistical Analysis of Fuzzy Data) R Package


    Recently, an R package has been designed (for instance, Lubiano and Trutschuis
    [43] and Trutschin in this book [61]) to provide some basic functions for doing
    statistics with one-dimensional fuzzy data. The package contains functions for
    the basic operations on the class of fuzzy numbers (mean, scalar product, median,
    Hukara distance, Aummean), for calculating distances, sample Frechet variance,
    sample covariance, sample correlation, and so on. Moreover a function to simulate
    fuzzy random variables, bootstrap tests for the equality of means, and a function
    to linear regression given trapezoidal fuzzy data is included. The package is
    being almost permanently updated by incorporating the most of the newly developed
    methods, and essentially substantial the computing process in the applications
    of these methods and in the empirical studies.'
