  md: '+   Likert discretize the variable associated with the response to a question
    into a small number of potential values;


    +   available techniques for the analysis of Likert scale data are rather limited
    and not informative;


    +   integer encoding usually does not reflect the real differences between distinct
    ''values'' (for instance, most of people consider the ''difference'' between the
    responses encoded by 1 and 2 to be not the same as the responses encoded by 2
    and 3).


    To overcome these drawbacks some alternatives for the use of Likert scales have
    been suggested.


    One of them, often referred to as the visual analogue scale, consists of choosing
    the single point within a bounded interval/bar that ''best'' expresses the response
    to the given question (cf. [1], [10], [15], [21]). This alternative involves a
    continuous scale that captures properly the diversity and relative variability
    in the response, and fits well the statistical analysis. However, the choice of
    each response is not easy to make and does not seem realistic to demand such a
    level of accuracy in response to questions which are intrinsically imprecise.


    Another alternative is that of performing a fuzzification of the pre-specified
    Likert responses (cf. [9], [11], [12], [13], [20], [3]). This alternative allows
    a continuous scale where support of the image is concerned, and a discrete one
    as far as the number of different values/responses is concerned. Although available
    data does not directly fit the best known statistical techniques, the last decade
    a methodology for the statistical analysis of fuzzy data is being developed and
    many techniques have already been proposed and can be employed. Although the scale
    allows to reflect the intrinsic impression of the responses, the diversity and
    relative variability of the responses are not well-captured.


    A third alternative is that of considering a tandem questionnaire format integrating
    the features of the first two. In this respect, the scale of fuzzy numbers can
    be used in opinion, valuation, rating, questionnaires to ''express'' the responses,
    and these questionnaires could be designed with a free fuzzy response format.
    Advantages of this tandem are the following:


    +   the scale of fuzzy numbers is continuous as far as the support of the image
    and the space of potential values are concerned;


    +   it is friendly-to-use and friendly-to-understand, and handling the scale does
    not require a very high expertise;


    +   it captures well the diversity, relative variability and subjectivity in the
    response;


    +   it expresses very well inherent imprecision of the categorical data;


    +   there are several well-developed techniques to analyze the responses from
    a statistical perspective.'
