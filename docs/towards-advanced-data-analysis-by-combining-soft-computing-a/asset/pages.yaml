  md: '# Pricing of Catastrophe Bond

    in Fuzzy Framework


    Piotr Nowak^1 and Maciej Romaniuk^1


    **Abstract** In the paper we consider catastrophe bonds with a stepwise payoff
    structure. We use the martingale method to price it under the condition of no
    arbitrage. We assume a stochastic form of the spot interest rate, replicability
    of interest rate changes by financial instruments existing in the market as well
    as independence between a catastrophe occurrence and behaviour of the financial
    market. The fuzzy sets approach, presented in the paper, may incorporate corporate
    expertise knowledge to overcome lack of precise data in the discussed case.


    # ## 1 Introduction


    During years, the insurance industry faced overwhelming risks caused by natural
    catastrophes. Losses from a single catastrophic event could reach terms of billions
    (see e.g. [14]). The classical insurance mechanisms are not adequate to deal with
    losses caused by natural catastrophes, because the sources of such losses are
    strongly depend on terms of time and localization. Additionally, losses from such
    events are extremely huge. In contrast, classical insurance approach assumes that
    losses are modelled by independent and identically distributed (iid) random variables.
    Additionally, it is commonly assumed that the value of each claim is small compared
    to the whole portfolio of instruments. Therefore it may be useful to use new kinds
    of insurance instruments.


    Because fluctuations on worldwide financial markets reach also the same scale
    as losses from natural catastrophes, securitization of losses (i.e. "packaging"
    into form of tradable assets) may be helpful for dealing with extreme results
    of natural catastrophes (see e.g. [4, 10]). One possible


    > ^1 Systems Research Institute PAS, u. Nowelska 6, 01-447 Warsaw, Poland, pnowak@ibepan.was.pl
    · nroman@ibepan.was.pl


    > C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 137-150.
    springerlink.com © Springer-Verlag Berlin Heidelberg 2013'
