    Archived multi-objective simulated annealing was adapted to cope with the feature
    selection problem. The modified AMOSA is compared with two multjective optimization
    algorithms: NSGA-II and DMS. In evaluate the feature subsets, many models were
    used.

    Both NSGA-II and DMS outperformed the modified AMOSA. NSGA-II is a population-based
    evolutionary algorithm, which showed to be more efficient in approximating the
    Pareto front. DMS also progresses with the evolution of a set of nondinated solutions,
    and the greedy properties of the search mechanism granted a better performance
    for approximating the Pareto front. One of the key mechanisms in modified AMOSA
    is the creation of a new solution by using the neighborhood of the current solution,
    which is called perturbation. The results showed that this search mechanism is
    not effective. The, the perturbation mechanism should be improved.'
