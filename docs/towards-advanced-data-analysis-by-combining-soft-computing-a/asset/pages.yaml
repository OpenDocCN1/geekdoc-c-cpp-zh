    \ series.\n\n**Real Data.** The usefulness of the proposed methods as applied\
    \ to real data was assessed using task-related fMRI data, acquired using a 7 Tesla\
    \ MR-scanner (Siemens, Erlangen) in the context of a study of the visual pathway.\
    \ Subjects were instructed to focus on a central fixation point, while being exposed\
    \ to alternating left and right visual hemifield stimulation of different luminance\
    \ contrasts. Meanwhile, functional data were acquired in volumes of $192 \times\
    \ 192 \times 27$ voxels at isotropic resolution of 1.1mm edge length using a time\
    \ resolution of 0.2s. Details can be found in [12].\n\nThe analysis of fMRI data\
    \ involves artifacts arising from both physiological and hardware-related sources.\
    \ It was therefore to account for them prior to the analysis. Using an online-reconstruction\
    \ procedure based on a reference measurement of the local point spread function\
    \ [14]. As interpolation causes artifacts originally present in the data, we refrained\
    \ from spatial smoothing and normalization to a standard brain.\n\nFrequencies\
    \ below 0.1Hz were measured from the individual voxel series accounting for low\
    \ frequency signal intensity drifts caused by scanner instabilities [10] and physiological\
    \ artifacts. Non-brain voxels were excluded from further analysis by defining\
    \ a brain mask using a thresholding procedure based on the means of the voxel\
    \ times. For comparative purposes the remaining brain voxels were partitioned\
    \ into gray matter and non-gray matter voxels by thresholding of a gray matter\
    \ map generated using SPM segmentation routines.\n\n**GLM Analysis.** For comparisons,\
    \ a conventional GLM of the task-related fMRI data was carried out using SPM.\
    \ We applied a statistical model containing box waveforms convoluted with a HRF,\
    \ representing the left and right visual hemisphere stimuli, respectively. Multiple\
    \ linear regression was used to generate parameter estimates for each regressor\
    \ at every voxel. Visual field biased regions in each subject were identified\
    \ using a contrast of contralateral deactivation versus ipsilateral visual stimulation\
    \ resulting in a statistical parametric map of f-statistics (SPM$_1$).\n\n# 5\
    \ Results for Test Data\n\nThree variants of LCM and LCMd were calculated for\
    \ the four test data sets (see Section 4): LCM$^{0.1}$, LCMd$^{0.1}$, LCM$^{0.05}$,\
    \ LCMd$^{0.05}$, LCM$^{0.01}$, and LCMd$^{0.01}$ (Figure 2). As anticipated, the\
    \ LCM is higher for the co-active voxels than for the noise voxels for $\\alpha\
    \ > 14$ which is true for $\\alpha \\le 14$. LCMd employs both complementary contrasts\
    \ and exhibits an increased sensitivity to LCM."
