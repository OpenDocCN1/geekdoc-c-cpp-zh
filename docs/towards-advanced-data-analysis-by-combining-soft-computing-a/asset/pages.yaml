    \ SNR. Unavoidably, however, the higher the strength of the additive WGN, the\
    \ more the LCM/LCMd of the co-active samples represents those of the WGN samples.\n\
    \nAs illustrated by Figure 3, the variance (and range) of LCMd—and its sensitivity—is\
    \ lower for the most extreme values of $\\alpha$. Accordingly, the difference\
    \ between the co-active and the WGN voxels is minimal for $\\alpha = 14$ and $\\\
    alpha = 27$ (Figure 2, right). As explained in Section 3, the best choice of $\\\
    alpha$ depends on the level of noise present in the data and the desired contrast\
    \ between functionally connected and functionally independent 27-cubels. While\
    \ a smaller $\\alpha$ gives higher noise robustness (fault tolerance), a too large\
    \ choice will impair the contrast between co-active and WGN voxels, as the expected\
    \ value under the assumption of independent voxels comes closer. Then, some fault\
    \ tolerance needs to be ensured, as due to a large $\\alpha$ *will* result in\
    \ a low range and similar LCMd for both co-active and WGN voxels, all the same.\n\
    \nThe attainable robustness of LCM seems to increase with the sharpening effect,\
    \ that is, with decreasing $\beta$. The larger $\beta$ is, the further each value\
    \ in a time series gets shifted towards minimum or maximum, that is, towards 0\
    \ or 1. Thus, with decreasing $\beta$, LCM values tend to increase for $\\alpha\
    \ > 14$ and to decrease for $\\alpha \\le 14$. In other words, the soft approach\
    \ seems to keep more noise than actual information. However, this behavior may\
    \ be due to our scheme of transforming the time series (using a median and quantile\
    \ normalization) and further investigations are needed to clarify this."
