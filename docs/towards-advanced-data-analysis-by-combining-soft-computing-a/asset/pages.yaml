    # ## Application of Hyperinference-based Pattern Recognition Procedures for Classification
    of Human Posture


    The proposed approach was successfully used for recognition of strong (healthy)
    and those who suffer from certain illness (for example, arthroscclerosis). The
    classification was performed according to person''s clinical posturograms (stabilograms).
    In this case, a data acquisition, pattern feature extraction from data and a dimensionality
    reduction were performed as described in the following.


    # ### 5.1 Visualization of Human Posture Stability


    One of the most popular ways to visualize standing stability is to register movements
    of centre of pressure (COP) of a human body on the base of the support [10, 11].
    The resulting digitized trajectory of the COP is referred to as a stabilogram.
    In general, the stabilogram is a collective outcome or result of activities of
    all systems that are responsible for maintaining the body in upright position.
    The typical stabilogram of a healthy subject on the base of support is presented
    in Fig. 6. All stabilograms were recorded during physical experiments.'
