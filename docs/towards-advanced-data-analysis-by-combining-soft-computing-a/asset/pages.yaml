  md: 'Comparing the Median for Likert and Fuzzy Scales


    # # 4 Concluding Remarks


    The study in this paper is just an introductory one. The first empirical developments
    allow us to conclude that the use of the fuzzy versus Likert scales captures more
    diversity (this could be trivially and generally proved by using any diversity/entropy
    measure) and relative variability (which can be empirically proved by using some
    inequality indices). The simulations in the paper show that the median is in many,
    and often in some of the situations, free-format then than in the Likert scale
    questionnaire. This representativeness has implications in terms of the error
    associated with ''estimating'' each data by means of all available ones. However,
    conclusions are not general enough in the last respect.


    To enlace and complete the study in the paper, immediate developments would be
    those formalizing means that diversity and relative variability are much higher
    with fuzzy number-format responses than with Likert ones. Also a deeper study
    should be performed for the representativeness of the Aumann-type mean value of
    RFN, and also to discuss measures concerning the difference between the errors
    in both cases.


    Furthermore, a sensitivity analysis should be carried out in connection with the
    choice of $k$, which is also a key in psychometric studies on the use of Likert
    scales.


