    levels of confidence and also provides a transparent way for uncertainty evaluation.


    If $H_s$ is greater than the standard deviation of measured values of response
    variable $S_y$, the regression analysis cannot be accepted as successful. Because
    the $S_g$ is the constant and independent from the method, the ratio $H_s/S_g$
    is a normalized measure of the goodness of fit [4]. $H_{ci}$, $H_s/S_g$ and $HR$
    are measures used in performance evaluations.


    As be seen in Table 2 and 3, $H_{ci}^2$ of hybrid model is better than conventional
    regression for both models. The confidence-based analysis leads to be confirmed
    for the second case using $H_{ci}$. $H_s/S_g$ ratios have been obtained as 0.888,
    0.791 and 1.0 for ordinary regression of each trace element, respectively. The
    values for confidence-based regression approach have been recorded as 0.880, 0.782
    and 0.975, respectively. A small ratio is preferred in modern works, and most
    of the applications satisfy this condition. In the second study, the ratio has
    been 0.951 and 0.956 for regression and hybrid regression, respectively. Due to
    the close values recorded in the application, no meaningful difference between
    the methods based on $H_{ci}/S_g$ can be mentioned.


    Two drawbacks of the study should be mentioned. First, the experiments have been
    conducted using crisp input and outputs. Therefore, the performance on the fuzzy
    inputs and outputs have not been evaluated. Second, the data was limited and very
    heterogeneous (natural field data), because of which there was no consistent performance
    improvement owing to the. However, the approach given on this study and the former
    works in literature may provide some possibilities for future investigations on
    large and connected data sets.


    # 5 Conclusions


    Hybrid fuzzy least squares regression problem was handled using confidence bound,
    which is a well-known statistical procedure. Instead of the errors provided by
    some formulations, the error based confidence-intervals have been suggested in
    hybrid least squares regression formulation. The experimental works with real
    data sets have been performed, both with regression coefficients and predicted
    results. The results showed that the confidence interval-based approach can provide
    successful results and also possibilities for future works in depth.'
