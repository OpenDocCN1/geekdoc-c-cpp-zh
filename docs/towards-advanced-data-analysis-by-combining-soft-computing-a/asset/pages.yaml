  md: '# Fuzzy Clustering based on Coverings


    Didier Dubois¹ and Daniel Sánchez²,³


    **Abstract** In this paper we propose fuzzy coverings as a way to perform fuzzy
    clustering of data on the basis of a fuzzy proximity relation. Remarkably, the
    proposal does not require any kind of fuzzy transitivity.


    # 1 Introduction


    Clustering consists in finding a partition of a set of objects comprised of a
    collection of subsets of objects called clusters. It is expected that i) all elements
    in a cluster are similar; ii) every object belongs to a cluster, and iii) objects
    are in one cluster only, or equivalently, objects in different clusters are not
    similar.


    The starting point for a clustering process is a similarity relation verifying
    the reflexivity, symmetry, and transitivity properties. If such a relation is
    available, clustering is just a matter of calculating the quotient set of the
    relation. however, several authors have pointed out that binary relations built
    in terms of natural concepts are most transitive of the time, but reflexive and
    symmetric indistinguishability relations, also called resemblance relations. The
    situation is even worse in the case of fuzzy similarity relations [15, 12, 13],
    since any kind of transitivity consists of transitivity at level 1 plus some additional
    requirements on the pairs of objects related to degrees in (0,1).


    A natural consequence for the problem of clustering is that, in the crisp case,
    it is not always possible to obtain a partition of data according to the binary
    relation that represents the natural indistinguishability between objects. When
    indistinguishability is represented by a reflexive and symmetric,


    +   ¹IRIT, CNRS & Université de Toulouse, France, dubois@irit.fr

    ²European Centre for Soft Computing, Mieres, Spain, daniel.sanchezz@dcsai.computing.com

    ³Dept. Computer Science and AI, Universidad de Granada, Spain, daniel@dcsai.ugr.es


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 319-330.

    springerlink.com

    © Springer-Verlag Berlin Heidelberg 2013'
