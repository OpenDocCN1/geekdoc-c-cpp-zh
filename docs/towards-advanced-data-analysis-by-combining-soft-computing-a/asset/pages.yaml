  md: '# 2.1 TS Model Description of Software Reliability Growth


    Software reliability growth has been grouped into two classes of models — concave
    (exponential type) and S-shaped. Both types of models have the same asymptotic
    behavior as the total number of defects detected asymptotically approaches a finite
    value [14]. Theoretical considerations in the present section are provided for
    both model types. However, on further investigations are found the concave model
    is of real interest as most data sets accumulate defects in processes that exhibit
    this behavior.


    Concave behavior of the reliability growth expresses exponential growth which
    passes through two phases. In the beginning process operation detects failures
    frequently, which forms the phase of growth. In the second process the rate of
    failure decreases and the dynamics appears to be (or close to) the steady-state.
    Within each phase the reliability growth could be linearly approximated. According
    to this preliminary information we construct dynamic fuzzy-it rule base in the
    following regression form


    ```

    $If\ X_k = [x_k, x_{k-1}]$ belongs to cluster $Cl_i$$

    $$x_{k+1} = a_ix_k + a_{i}x_{k-1} + b_i,\quad(5)$

    ```


    where $x_k$ is the number of failures in the $k$-th moment, $i=1, 2$ and cluster
    vector is $Cl=[Cl_1, Cl_2]=[Exponential, SteadyState].

    In case of S-shaped growth the model has three rules that correspond to the respective
    phases of the reliability growth dynamics namely lag, exponential and steady-state
    phases. In this case cluster term is set $Cl=[Cl_1, Cl_2, Cl_3]=[Lag, Exponential,
    SteadyState].


    The global model predicts the failure number:


    ```

    $x_{k+1} = \frac{\sum_{i=1}^{c} w_i(x_k)x_{k+1}}{\sum_{i=1}^{c} w_i(x_k)},\quad(6)$

    ```


    where $c=2$ for the concave model and $c=3$ for the S-shaped model, $w_i(x_k)$,
    $i=1,c$ is the DOF of the $i$-th rule output.

    The model predicts the failure amount that would be accumulated in the next time
    instant. The obtained value is a non integer value. In order to get a usable result
    we suggest to assume the closest integer value.'
