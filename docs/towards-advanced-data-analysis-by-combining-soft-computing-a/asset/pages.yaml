    # 3 Background on MDL, Regression Trees and Granularity Levels


    # 3.1 The Minimum Description Length Principle (MDL)


    Overfitting is a general problem in the context of fitting models¹ to data. Complex
    models tend to overfitting whereas too simple models will not be able to reflect
    the structure inherent in the data. What makes the situation complicated is that
    goodness of fit for model complexity are two different notions and they are measured
    in different "units". One way to minimise overfitting is to use different data
    for training the model and evaluating ("testing") the models. A very common technique
    for model evaluation in cross-validation models are trained and repeatedly with
    training and test sets.


    ¹ We use the term model in a very broad sense as in [1]. Any structure that describes
    some structure in the data is considered as a model: a single value like the mean,
    a linear model, a Gaussian mixture, a neural network or a decision tree are all
    considered models.'
