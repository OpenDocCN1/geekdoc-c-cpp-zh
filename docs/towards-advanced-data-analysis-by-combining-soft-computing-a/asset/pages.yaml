    \ 3.1, the generalization of Bayes' theorem is possible. The construction is based\
    \ on $\\delta$-level functions.\n\nBased on a fuzzy a-priori density $\\pi^*(\\\
    cdot)$ on $\\Theta$ with $\\delta$-level functions $\\pi_\\delta$ and $T_\\delta$,\
