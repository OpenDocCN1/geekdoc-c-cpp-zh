    As mentioned before, the problem of clustering by coverings from crisp relations
    has been considered previously in the literature, and there are several proposals
    to try to find a covering by relaxing the requirement that clusters correspond
    to maximal cliques [1]. Applying these techniques to each level in order to obtain
    crisp coverings is a possibility in order to have an efficient algorithm, though
    not one-to-one relationship between the fuzzy relation and the final clustering,
    and the idea of considering all clusters put forward by the fuzzy relation. A
    possibly better solution may not be cover all maximal cliques, but a collection
    of maximal cliques that form a covering of the relation on each same level. We
    may lose some information in the fuzzy clusters in the final solution, but we
    can obtain a subset of clusters that guarantee the set of objects, from which
    the original relation can be recovered (though there is a one-to-one correspondence
    between the relation and clusterings in general). We will explore the feasibility
    of the different possibilities discussed in this section for future work.


    # 6 Conclusions and Future Work


    When transparency does not hold for a similarity relation, one cannot expect a
    clustering of objects in the form of a partition, but a covering is also true
    in the case of fuzzy relations. We have proposed a way to obtain an optimum covering
    from a crisp reflexive and symmetric relation, which is unique and in one-to-one
    correspondence with the original relation, based on the calculus of all maximal
    cliques of the relation. We have extended this procedure to the case of fuzzy
    relations, without requiring any kind of fuzzy transparency. Representation by
    levels of a fuzzy covering, and a fuzzy clustering consisting in a fuzzy covering
    with fuzzy clusters, are proposed which are again in one-to-one correspondence
    to the original fuzzy relation. We have also studied the relevance of the proposal
    to the study on fuzzy transparency and convex decompositions


    Calculating maximal cliques is complete. Future work will be to study the situations
    in which current algorithms can be applied, as well as algorithms to obtain good
    approximations to the optimum solution in reasonable time when the problem is
    too large. We shall also study the relation to clustering with missing information,
    which has been studied previously by using coverings for representing ill-known
    partitions [4].'
