    # 5.3 Hyperinference-based Pattern Recognition Problem Formulation for Classification
    of Histograms of Human Posture


    According to the hyperinference-based pattern recognition formula presented in
    section 2, two classes of objects $\alpha$ - histograms of HL individuals and
    histograms of MSD individuals are investigated. It means that $S = 2$. Each object
    $\alpha$ to be classified has $N = 25$ features - histogram bars. Order of placing
    each object''s description vector $\alpha$ is shown in Fig. 8 (right histogram).
    Every object is centered on co (4). For experiments "positive similarity" objects
    was evaluated by constant $\gamma = 0.8$, and a degree of "negative similarity"
    was evaluated by constant $\kappa = 0.3$. The difference $(\gamma-\kappa)$ determines
    experts'' fuzzy assumption considering a possible structure of classes under investigation
    and was selected on the base of experience [8].


    All calculations of degrees of certainties, $K_{\mu v} v_{\mu i}$ using experimental
    data were conducted with Matlab software, and and LPPs (or PWLPP) were solved
    using its `linprog` function. Three experimental cases are delivered here.


    +   A. All histograms were assigned to the HL or MSD class to experiment according
    to medical diagnosis and results of physical experiments. The aim of these calculations
    and experiment is to show that it is possible to identify hyperplane as a hypersurface
    distinguishing HL and MSD objects.


    +   B. Several representatives were selected arbitrary to represent HL and MSD
    classes. Calculations of degrees of certainties $K_{\mu po}$ for were conducted
    using LPP method.


    +   C. The same experiment as B., but calculations were performed by means of
    PWLPP solving method.


    In a numerical experiments'' performance the procedure "arbitrary selected" was
    implemented by means of Matlab function **rand**.'
