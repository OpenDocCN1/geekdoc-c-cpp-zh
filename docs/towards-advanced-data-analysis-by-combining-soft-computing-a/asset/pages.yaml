    including, turbulent flow/motion, motion textures, time-varying textures, dynamic
    textures, and textured motion [6]; the term dynamic texture will be used herein.
    Hainao and Pietikinen consider such phenomena extensions of the static texture
    to the temporal domain [2]; since the effect is that of a textured object undergoing
    transformations. Derpanis and Wildes [6], however, point out that the text can
    apply well to simpler phenomena when analyzed in terms of aggregate regional properties
    (e.g., orderly pedestrian crowds and vehicle traffic).


    The ability to recognize dynamic textures based on visual processing is of significance
    to a number of applications, including video/retrieval, surveillance and environmental
    monitoring where video can serve as, isolate background clutter (e.g., flickering
    vegetation) from activities of interest and detect various critical conditions
    (e.g., fires), respectively. It is no surprise that significant effort has been
    directed toward solving this problem [4] [26] [12]. However, to the best of our
    knowledge, no one has dealt with the possibility of recognizing dynamic textures
    in compressed (coded) videos, although this is the ‘natural’ state of the material
    in applications such as content-based video retrieval and the preferred way of
    storing and transmitting video.


    The quality of video sequences depends on the code quality, bit-rates and the
    required content of video material [5]. Clearly, if the bit-rate and the content
    are the same a reasonable assumption for multimedia databases - the quality of
    compressed videos depends only on the content. We propose a video classification
    approach that exploits this relationship. With the compressed videos available
    in a standard database used for dynamic texture recognition [12], we show that
    the measures of the artifacts introduced by the coding algorithm can be used for
    efficient dynamic texture recognition.


    Based on video quality metrics content-dependent features are extracted for the
    frames of the video. They are then aggregated so that each video sequence is represented
    by a fixed-length signature derived from the feature-values obtained for single
    frames. Video Signatures (VS) are subsequently used to train a soft computing
    (neural network) classifier [2]. Experimental results obtained through cross-validation
    show that the classifier can achieve perfect (100%) classification for the data
    set.


    The paper makes several contributions. Dynamic texture classification from compressed
