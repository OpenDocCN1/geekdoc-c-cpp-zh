    We also consider the performance of the two strategies over a set of forecasting
    methods shifting by one month (rolling windows). The results are shown in Figure
    2 (upper panel for 12 - and lower for 24-month forecasts).


    # # 5 Conclusions


    Since the correct dynamic specification of time series models is often unknown,
    the use of model selection strategies is required. We consider two classes of
    model selection approaches, one based on shrinkage estimators such as Lasso and
    the other one — a subset method using of optimization heuristics, to solve the
    corresponding complex discrete optimization problem.

    A Monte-Carlo simulation is used to assess the merits of the different methods
    in the context of univariate autoregressive distributed lag models.'
