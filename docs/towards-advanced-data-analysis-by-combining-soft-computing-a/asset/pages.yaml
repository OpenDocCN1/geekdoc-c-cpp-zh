    On the other hand, when we consider random experiments in which the attribute
    to be ''measured'' is intrinsically imprecise but gradual (se Dubois and Prade
    [20]), as often happens with ratings, valuations, et then instead of using a qualitative
    scale we can employ the expressive and flexible scale of fuzzy numbers or values.


    Although set- and fuzzy set-valued cannot be statistically analyzed, as easily
    as real/vector valued data, many methods for this purpose have been developed
    in the last years. In general, these methods exploit all the information available
    in the analyzed data, so that the diversity and variability (due to the randomness
    associated with the generating data mechanisms) is not lost, and the impression
    (due to data''s nature) is well-captured.


    Two tools in formalizing and developing the problems, models and techniques to
    analyze/fuzzy set-valued experimental data are: the choice of suitable metrics
    between them and the choice of an appropriate model for the random mechanism generating.


    The latter will be that of fuzzy set-valued random elements (REs, for short),
    i.e., Borel-measurable mappings w.r.t. associated with suitable metrics on the
    spaces of fuzzy set values, leading to the concepts of random composition (RSs,
    for short) and random fuzzy set (RFSs, for short). It should be emphasized and
    clarified that the choice of these notions were intended to model random mechanisms
    generating ''existing'' fuzzy set-valued data. Coherently, the statistical methods
    handling data obtained from REs aim to draw conclusions on these elements.


    In this paper RSs and RFSs are treated from an ''ontic'' perspective (se Dubois
    and Prade). From a theoretical point of view the related techniques could be part
    of the ''epistemic'' perspective, in accordance with data which are imprecise
    cannot be measured exactly. However, RSs and RFSs as considered in this paper,
    although formally applied, would not really capture the essence of the situation
    to be modeled and the corresponding statistical techniques would not allow practitioners
    to draw conclusions on the relevant random element: the underlying observable
    random variable (and "imprecise-valued") ''ontic'' perspective exception "imprecise
    data" (and "precisely-valued") vector. From the ''ontic'' perspective the random
    elements) is in opposition to "precise data", to express that the experimental
    values can be described by a single (precise) number or vector.


    In previous papers (those published before the COST IC0702, the SMIRE RG presented
    statistical developments concerning the ''point'' estimation of some parameters
    of the distribution of an RE (like the population mean, for which the variance
    should be understood, as set/fuzzy set-valued one; the population Frechet-type
    variance, the population inequality, and so on); the one and two-sample cases
    of testing hypotheses about means of REs; some rather introductory studies on
    other problems.


    This paper aims to present a summary of several recent developments (in fact,
    initiated after the COST IC0702) the SMIRE RG on'
