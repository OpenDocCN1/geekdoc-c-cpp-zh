    the topic of the Statistical Analysis of Imprecisely set/fuzzy-valued experimental
    data. Details and discussions concerning the particular approaches can be found
    in the referred works. Although other, more or less related, problems have been
    investigated along the last years by the RG, we will focus on the following: In
    Section 2, we will recall some basics clustering metrics between imprecisely-valued
    data and simulations of these data; In Section 3, the developments on statistical
    methods to analyze the means (multi-sample case), and Frechet-type variants for
    general REs will be mentioned, and a recent present to define a robust center
    for an RE will be described for the one-dimensional case; In Section 4, some approaches
    will be discussed in connection with the regression analysis between data by assuming
    either all of them are imprecisely-valued; in Section 5, an overview on clustering/classification
    methods to classify imprecisely-valued data is given. Finally, in Section 6 comments
    will be given on SAFD (Statistical Analysis of Fuzzy Data), an R package for statistical
    analysis of one dimensional fuzzy data.


    # 2 Summary of Recent Results on Metrics and Simulations Concerning Imprecisely-valued
    Data


    Metrics between imprecise (either set or fuzzy set)-valued data play a crucial
    role in their statistical analysis, along with the elementary arithmetic operations
    between these data. To properly recall some recent metrics, we will present some
    preliminary concepts, notations.


    Let $K_{\alpha}(\mathbb{R}^p)$ ( $p \in \mathbb{N}$) be the space of nonempty
    convex subsets of $\mathbb{R}^p$. $K_{\alpha}(\mathbb{R})$ denotes the space of
    closed and bounded nonempty intervals.

    The most usual and natural arithmetic on $K_{\alpha}(\mathbb{R}^p)$ is the one
    extending (through the image) the classical operations. Thus, the two elementary
    operations, sum and product by a scalar, are defined so for $K, K'' \in K_{\alpha}(\mathbb{R}^p)$
    and


    ```

    $K + K'' = \{k+k'' : k \in K

    ```


    It is well-known that $K+K''$ does not have a linear but only a semi-linear structure,
    since $K+(-1)$ = $K$ (neutral element for +) unless $K$ is ''degenerated'' (in
    other words, $K$ is ''real/virtual value).


    Let $F_{\alpha}^*(\mathbb{R}^p)$ ($p \in \mathbb{N}$) be the space of fuzzy sets
    in $\mathbb{R}^p$ such that each $\tilde{U} \in F_{\alpha}^*(\mathbb{R}^p)$ satisfies
    for each $\alpha \in [0,1]$ the $\alpha$-level set $\tilde{U}_{\alpha} \in K_{\alpha}(\mathbb{R}^p)$
    (where $\tilde{U}_{\alpha} = \{x \in \mathbb{R}^p : \tilde{U}(x) \geq \\alpha\}$
    if $\tilde{U}_0 = \{x \in \mathbb{R}^p : \tilde{U}(x) > 0\}$). $F_{\alpha}^*$
    denotes the space of the so-called (bounded) fuzzy numbers.


    The most usual arithmetic on $F_{\alpha}^*(\mathbb{R}^p)$ is the one based on
    Zadeh''s extension principle [64], which is lengthwise equivalent to the usual
    set-valued arithmetic,'
