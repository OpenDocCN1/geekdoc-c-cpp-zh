    Since the performance of coding algorithms depends on the content of video, a
    novel approach to dynamic texture classification, which exploits this link is
    proposed in the paper. Specifically we show that features commonly used for video
    quality assessment can be used, efficiently, to discern between different textures.
    The assumption made is that the videos are coded using the same codec and bit-rates,
    which is unreasonable in case of large multi-media databases.


    An MLP-based approach has been trained and evaluated using video quality features
    obtained through a state-of-the-art video quality assessment approach. We used
    this to test the approach. The approach achieves nearly perfect classification
    (99.5%) when cross-validated.


    Several venues should be explored for further studies. The approach should be
    tested using other available databases, such as the UCLA database [15]. More importantly,
    the approach should be tested for different codecs. The blockiness and blurring
    measures designed may have to be adapted to handle the variable block-size of
    state-of-the-art codecs explicitly.


