  md: 'A. Blanco-Fernández et al.


    Given a random experiment which is modeled by means of a probability space $(\Omega,
    A, P)$, by a random convex set we mean (see, for instance, Puri and Ralesco [50],
    or Molchanov [46]) a mapping $X: \Omega \to K_c(\mathbb{R}^d)$ which is Borel-measurable
    w.r.t. $A$ and the Borel $\sigma$-field generated by the topology induced by the
    well-known Hausdorff metric on $K_c(\mathbb{R}^d)$.


    Given a random experiment which is modeled by means of a probability space $(\Omega,
    A, P)$ by a random fuzzy set we mean (see, Puri and Ralesco [51] mapping $X: \Omega
    \to F(\\mathbb{R}^d)$ or more general spaces) which for the $\alpha$-level mappings
    $X_\alpha: \Omega \to K(\mathbb{R}^d)$ are random convex sets, where $\alpha \in
    [0,1]$ may be. The original definition by Puri et al. [10],[11]. González-Rodríguez
    et al. [37] has been proved to be equivalent to (or, at least, to) Borel-measurability
    of the independence of RFS, which guarantees (improved) distribution of RFS were
    first coined by Puri and Ralesco as random fuzzy variables. Nevertheless, and
    to avoid misunderstanding with other concepts using the same name and to capture
    the interpretability of the notion we are using the random fuzzy sets previously
    employed by some authors.


    One of the main drawbacks of RFSs is caused by the lack of realistic models for
    their distributions. In Colubi et al. [12] some ideas considering RFS with values
    in some restrictive classes (like the class of trapezoidal fuzzy numbers in some
    classical real distributions have been outlined (say, normal, square, etc.). Recently,
    González-Rodríguez et al. have suggested two approaches following the usual ideas
    in Hilbert spaces. In this way, one of the suggested methods is based on the embedding
    to identify fuzzy values with functional ones (see González-Rodríguez et al. [37]),
    the use of simulation techniques for Hilbert spaces and the posterior projection;
    some practical constraints are outlined. Another useful and easy-to-handle suggested
    method is the one making use of an extended orthonormal basis such that every
    fuzzy value can be approximated in terms of elements of the basis.


    # 3 Summary of Recent Results on Inferences about Means and Fréchet’s Variances,
    and on a More Robust Tendency Measure for Imprecisely-valued Data


    Most of the statistical methods to analyze imprecision-valued data generated from
    REs concern ''point'' estimation or testing ''two-sided'' hypotheses (i.e., null
    hypotheses consisting of equalities involving population characteristics of the
    distribution of the REs).'
