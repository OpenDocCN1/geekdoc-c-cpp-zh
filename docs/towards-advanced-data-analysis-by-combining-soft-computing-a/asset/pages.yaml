    is different for all the approaches excepting the exact and the RKT-based methods.


    # 5 Conclusions


    Some approaches to estimate the regression coefficients have been proposed and
    the comparison between them have been made by means of examples. According to
    the empirical results, estimator $b_{sep}$ does not provide good results, which
    is natural, as they do not account for the specific features of the unified model
    that has been considered. $b_{sep}$ will often divert from the $b_{exact}$.


    The performance of the empirical estimator depends on the data which has been
    used. If the data satisfies the constraint to ensure the existence of the residuals,
    then the estimator is similar to the exact one. Otherwise, it is an erroneous
    estimator, as it provides wrong estimates for $\alpha_2$, the coefficient accompanying
    the spreads. In any case, the estimator could be used for large samples, as it
    approaches to the populational parameter consistently.


    Finally, the numerical estimator $b_{kk}$ is an adequate as it reaches values
    which are really close to the exact ones.'
