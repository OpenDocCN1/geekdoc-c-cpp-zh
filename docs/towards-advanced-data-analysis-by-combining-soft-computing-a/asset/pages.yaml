  md: 'The Hubness Phenomenon: Fact or Artifact? 277


    from a (hyper)-cube is much stronger than for data sampled uniformly from a (hyper)-ball.
    This led to the idea to "jolt" a (hyper)-cube into a (hyper)-ball in order to
    check whether this operation reduces the hubness phenomenon. Given our view of
    the causes of the hubness phenomenon, we certainly expected it to be reduced (because
    this operation significantly reduces the surface of the sampling region), but
    that it was even reduced below the level of data that was sampled uniformly from
    a (hyper)-ball was surprising seeing Figure 6, curve labeled ''jolted''. We rather
    expected it to lie between a (hyper)-cube and a ball based on the argument that
    the jolting introduces density gradients inside the (hyper)-ball.

    However, on second thought, the effect becomes understandable. The jolting operation,
    even though it causes density gradients inside the (hyper)-ball, also reduces
    the effect of the (remaining) (hyper)-surface, because it pushes more data points
    into the interior of the (hyper)-ball, thus leaving less at the surface that causes
    the hubness effect (cf. Experiment 2).


    # 5 Conclusions


    In this paper we demonstrated that the hubness phenomenon is not an effect of
    the (high) dimensionality of a data set, but an effect of a density gradient.
    However, a density gradient may be intrinsic to the data set (if the data is not
    uniformly distributed) or it may be a boundary effect. Since a boundary necessarily
    introduces a density gradient and the ratio of the size of the boundary to the
    size of the enclosed space grows exponentially with the dimensionality of the
    data space, high-dimensional bounded data is prone to exhibit the hubness phenomenon.
    It is important to note that this phenomenon can also be produced, though much
    weaker, in a low-dimensional space by artificially increasing the size of the
    boundary. Another factor is the shape of the boundary: ''convex'' internally enhances
    the effect, as can be seen from the pronounced hubness phenomenon exhibited by
    (hyper)-cubes.


