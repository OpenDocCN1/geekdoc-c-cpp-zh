    # ## 3 Pattern Recognition based on Takagi-Sugeno (T-S) Reasoning Procedure


    If a pattern of a class is considered as a physical or abstract class of objects,
    described by a set of distinct features [1, 2], then a simplified pattern recognition
    problem can be formulated in the following way. Let imagine our world under investigation
    as a set $S$ of objects, $r$ classes, where each class is denoted as $p=1,2,\dots,r$.
    Each object is described by $N$ features, denoted as $n=1,2,\dots,N$. In a case
    where feature extraction, measurement and normalization procedures are performed
    [6], the $i$-th feature of an object, belonging to the $p$-th class (corresponding
    to the $p$-th pattern) can be represented by a real number $\alpha_{pi}$ which
    expresses a degree of intensity of this particular feature. It is convenient to
    use a vector-row rotation to describe the whole object $\alpha_p = (\alpha_{p1},\dots,\alpha_{p2},\dots,\alpha_{pN})$.
