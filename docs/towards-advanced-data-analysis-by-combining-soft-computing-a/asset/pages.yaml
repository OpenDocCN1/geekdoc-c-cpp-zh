    The experimental studies were conducted for both regression coefficients and prediction
    values. The studies performed by real data sets derived from geo-environmental
    science and reliability measures of the developed models have been conducted.


    # ##4.1 Experiments on Regression Coefficients


    The methodology proposed for evaluating the regression coefficients is close to
    the fuzzy least-squares approach by minimum fuzziness criterion. Two stages in
    the first stage, the fuzzy centers have been provided from the ordinary least-squares
    regression. After that, by using (15), the widths of memberships (coefficients)
    have been obtained.


