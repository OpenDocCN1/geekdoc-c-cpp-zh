  md: 'In order to quantify the credibility of the estimated cluster $P_i$ is introduced
    to assess the number of points belonging to the $i$-th cluster. Its lower bound
    could be estimated from the minimal number of data points necessary to learn the
    parameters of the covariance matrix:


    ```

    $P_{min} = \alpha(\mu_{min} + 1)/2.$

    ```


    Alternatively, it could be defined but the value should not be less than $P_{min}$.

    Appropriate choice of the membership threshold $\mu_{h}$, coefficient $\alpha$
    and credibility parameter $P_{min}$ depends on the density of the data set and
    level of cluster overlapping. Their value is a real concern for the model identification.
    We assume default value of the membership threshold $\mu_{h}=0.5$ that balances
    between cluster separation and more tolerant fuzzy cluster separation. For a stricter
    identification of proper clusters the defined threshold degree should be larger.
    The learning rate $\alpha$ determines the step of searching. A large value guarantees
    sparsely selected clusters, which could ignore a valuable cluster and the recognized
    rules may not cover accurately the data space.


    # # 5 Benchmark Model Development


    The developed software reliability growth model was evaluated on a bench data
    set provided by a case study investigation of TANDEM Computers company [14]. The
    data base consists of data of four software releases which for every week the
    number of failures was counted.

    Release 2 and Release 3 present certain overlapping. Release 2 was a preliminary
    release used by very few customers. It was tested for nineteen months.

    Release 3 was similar to Release 2 with some functionality and performance enhancements
    due to a new functionality being added in the test week 17 of Release 2. This,
    in order to improve predicting abilities of the model, Release 2 was treated separately.
    Then of both releases were merged in one release set named Release 23. This data
    sets for multi-stage reliability growth dynamics that passes through two consecutive
    process.


    In order to initialize the identification algorithm first cluster was defined
    off-line over data of the fast growth phase of each release. Default value $\mu_{h}=0.5$
    was accepted. The learning rate was fixed at $\alpha=0.05$ and minimal cluster
    credibility was set to $P_{min}=5$. In order to increase the algorithm sensitivity
    in some of the simulations the parameter value was decreased to the minimal acceptable
    value $P_{min}=3$.'
