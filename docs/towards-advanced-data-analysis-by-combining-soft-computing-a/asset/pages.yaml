    # 5 Conclusion and Future Work


    In this paper we proposed a proximity-based method for estimating the count of
    pronouns that can coreference with the query terms. We incorporated an anic count
    in the frequency of query terms and used it for retrieval. The proposed model
    was effective even over the large and standard BLOG6 collection. For future work
