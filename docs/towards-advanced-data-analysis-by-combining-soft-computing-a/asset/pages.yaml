  md: '# Hybrid Least-Squares Regression Modelling Using Confidence Bounds


    Bülent Tütmez¹ and Uzay Kaymak²


    **Abstract** One of the questions regarding bridging of soft computing and statistical
    methods is the (re-)use of information between the two approaches. In this context,
    we consider in this paper whether statistical confidence bounds can be used in
    the hybrid fuzzy squares regression problem. By using the confidence limits as
    the spreads of the fuzzy numbers, uncertainty estimates for the fuzzy model can
    be provided. Experiments have been conducted in the paper, both on regression
    coefficients and the predicted responses of regression models. The findings show
    that the use of the confidence intervals as the width of memberships gives successful
    results and opens new possibilities in system modelling and analysis.


    # #1 Introduction


    Regression is a wide-range statistical methodology used in data analysis. There
    are many regression methodologies in the literature, such as conventional (ordinary)
    regression, fuzzy regression and hybrid regression [7, 17]. One of these methods,
    the hybrid fuzzy regression, is a novel procedure which combines randomness and
    robustness into a regression model, and can be used in data analysis and system
    modelling.


    The hybrid (fuzzy) regression models proposed in literature are developed based
    on minimizing functions or the sum-of-squares of errors as the fitting criterion
    [15, 14]. In addition, some models employ interval analysis [10, 2]. The error
    in the regression structures is the main source of the difference between conventional
    regression and fuzzy regression. In contrast to


