  md: '# 3 Functionality of the SAFD Package


    The SAFD package works with polygonal fuzzy numbers in the form of dataframes
    having two columns, x and alpha, and arbitrary many $\alpha$-levels.

    nThe following is an example with only three equidistant levels:


    +   > A x alpha

    1 -1.2000 0.0

    2 -1.2000 0.5

    3 -0.2000 1.0

    4 0.2000 1.0

    5 1.1375 0.5


    The x-values of the dataframe have to be increasing and the alpha-values have
    to increase from 0 to 1 and then decrease from 1 to 0 in the same manner (not
    necessarily equidistant). The package contains two functions called checking and
    checking to check if the data is in the correct format. Furthermore it contains
    a function called translator to convert input data fulfilling the above conditions
    into a dataframe in the correct format and with a chosen number n1 of equidistant
    alpha levels, see Figure 1.


    ![](img/8a465c42e0c636291262a00bcc7a9b11_114_0.png)


    Fig. 1 Illustration of the functionality of the translator function via the following
    commands (the XX data set is included in the package)

    data(XX); E3<-translator(XX[[3]],3); E6<-translator(XX[[3]],6)'
