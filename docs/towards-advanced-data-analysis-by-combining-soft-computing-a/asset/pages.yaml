    Warsaw, Poland, {kacprzyk, zadrozny}@itspan.waw.pl.

    ² Technical University of Radom, ul. Malczewskiego 29, 26-600 Radom, Poland


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 291–303.

    springerlink.com

    © Springer-Verlag Berlin Heidelberg 2013'
