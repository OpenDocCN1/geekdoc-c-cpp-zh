    hypotheses $H_{[3]}, \dots, H_{[j]}$ are not rejected. If $p_{[j]} \le \alpha$
    holds, $H_{[2]}$ is rejected and the procedure continues with $H_{[j]}$ in the
    same way.


    The Bonferroni-Holm method tests the hypotheses in the order of their p-values,
    starting with $H_{[1]}$. The corrected $\alpha_i$ values, $\alpha_1, \dots, \alpha_j,
    \dots$ are increasing. Therefore, the Bonferroni-Holm method rejects at least
    those hypotheses that are also rejected by simple Bonferroni correction, but in
    general may be rejected.


    During change detection instead of the significance level $\alpha$, the Bonferroni
    correction or Bonferroni-Holm method should be used in order to avoid the multiple
    testing problem. However, the streaming nature of the data should be taken into
    account and it is therefore impossible to have all the obtained p-values in the
    memory. Furthermore, the number of tests to be carried out is not known in advance.
    Thus, a time window technique-based approach should be used, for instance a sliding
    window or non-overlapping windows.


    # 3 Meta p-values


    Another possibility to solve the problem of multiple testing under change detection
    is to solve the behaviour of the obtained p-values. Several authors have analysed
    properties of p-values. For instance, Gibson and Pratt (see [5]) provided an interpretation
    and methodology for p-values. Sackrowitz and Samuel-Cahn [8] analysed the distribution
    of p-values. Donahue in [2], the authors focus on the median of the p-value under
    the alternative hypothesis.


    **Definition 2.** The p-value is the probability to obtain a value of the test
    statistic as extreme, or more extreme (depending on the alternative hypothesis)
    the observed value of the test statistic given the null hypothesis is true.


    Hence, in the case of continuous test statistics for a right tailed test the p-value
    is calculated as


    ```

    $p = Pr(T \ge t|H_0) = 1 - F_T(t)$

    ```


    and for a left tailed test as


    ```

    $p = Pr(T \le t|H_0) = F_T(t)$

    ```


    where $F_T(t)$ is the cumulative distribution function for the test statistic
    $T$ under the assumption that the null hypothesis $H_0$ is true.


    In the case of a two tailed test, the p-value is the total area under both tails
    with an area of $\frac{\alpha}{2}$ in each tail. Therefore, if the observed value
    falls into'
