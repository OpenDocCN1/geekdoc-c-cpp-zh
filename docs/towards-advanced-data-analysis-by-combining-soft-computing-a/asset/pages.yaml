  md: '# # Comparison of Multi-objective Algorithms Applied to Feature Selection


    Özlem Türkşen¹, Susana M. Vieira², José F.A. Madeira^{2,3},


    Ayşen Apaydın¹, and Joio M.C. Sousa²


    **Abstract** The feature selection problem can be formulated as a multi-objective
    optimization (MOO) problem, as it involves the minimization of the feature subset
    cardinality and the misclassification error. In this chapter, a comparison of
    MOO algorithms applied to feature selection is presented. The used MOO methods
    are: Nondominated Sorting Genetic Algorithm (NSGA-II), Archived Multi-Objective
    Simulated Annealing (AMOSA), and Direct Multi-Search (DMS). Takagi-Sugeno fuzzy
    models are used as classifiers. To solve the feature selection problem, AMOSA
    was adapted to deal with discrete optimization. The multi-objective methods are
    applied to four benchmark datasets used in the literature and the obtained results
    are compared and discussed.


    # ## 1 Introduction


    Generally, real-world data sets to be complex, large, and normally contain many
    irrelevant features. One of the most important steps in data analysis for feature
    selection, which has been an active research area on many fields, such as data
    mining, pattern recognition, machine learning or statistics. The main idea of
    feature selection is to choose a subset of the available features, by eliminating
    redundant features with little or no problem. There are two key decisions involved
    in the feature subset selection: (i) the number selected


