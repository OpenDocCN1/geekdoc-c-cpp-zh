    The second example is concerned with the relationship between the family income
    and the percentage of people with higher education $(x)$ in 2006 (http://fact?census.gov).
    The difference between this example and the previous is that not all the values
    of the full constraint $b_k \leq y$. Table 3 displays the data of the sample of
