    Table 4. The estimates seem to be asymptotically unbiased, and MSE values tend
    to 0 as $n$ increases.


    Let $Y_2$ now be defined in terms of $X$ by means of the flexible model


    ```

    $Y_2 = 3X^M + X^S + \varepsilon. \quad (17)$

    ```'
