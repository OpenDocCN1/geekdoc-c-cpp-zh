  md: "# 2 Takagi-Sugeno Fuzzy Rule Base of Software Reliability Growth\n\nGeneral\
    \ description of TS fuzzy model consists in a rule base that has a fuzzy antecedent\
    \ part and a functional-type consequent of the following form:\n\nIf $\\mathbf{x}_k$\
    \ belongs to cluster $C_l$\n\n```\n$y_k = a_{l1}x_{k1} + a_{l2}x_{k2} + \\dots\
    \ + a_{ln}x_{kn} + b_l$,\n```\n\nwhere $\\mathbf{x}_k = [x_{k1}, x_{k2}, \\dots,\
    \ x_{kn}]$ is the value of the input vector at the time instant $k$, $y_{ik}$\
    \ is the output of the $i$-th linear system function that has coefficient vector\
    \ $\\mathbf{q}_i = [a_{i1}, a_{i2}, \\dots, a_{in}, b_i]$ and $c$ is the number\
    \ of rules of the model rule base. By $C_i, i=1, \\dots, c$ we define the $i$-th\
    \ cluster defined in the data space. Each cluster defines a rule and every rule\
    \ corresponds to a certain subsystem.\n\nThe global output $y_{ik}$ is obtained\
    \ by the following sum:\n\n```\n$y_{k} = \\sum_{i=1}^c \beta_i(\\mathbf{x}_k)y_{ik}$\n\
    ```\n\nThe parameter $\beta_i(\\mathbf{x}_k)$ is estimated as\n\n```\n$\beta_i(\\\
    mathbf{x}_k) = \\frac{w_i(\\mathbf{x}_k)}{\\sum_{i=1}^c w_i(\\mathbf{x}_k)}$\n\
    ```\n\nunder constraints\n\n```\n$\\sum_{i=1}^c \beta_i(\\mathbf{x}_k) = 1$ and\
    \ $\beta_i(\\mathbf{x}_k) \\ge 0$,\n```\n\nwhere $w_i(\\mathbf{x}_k)$ is the degree\
    \ of fulfilment (DOF) of the $i$-th rule to the whole rule system calculated for\
    \ the input vector $\\mathbf{x}_k$. The estimation of $w_i(\\mathbf{x}_k)$ is\
    \ accomplished by multidimensional membership function method without decomposition.\
    \ The distance between the antecedent vector and cluster centers is defined by\
    \ recalling the cluster covariance matrix that includes all but the last column\
    \ of the cluster covariance matrix i.e. using only the antecedent vector covariance\
    \ matrix.\n\nThe description given by the equations (1)-(4) provides gradual and\
    \ smooth switching between distinct subsystems, which suits well to the real transition\
    \ between different regions of the whole behaviour."
