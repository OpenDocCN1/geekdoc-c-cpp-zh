    # 7 Execution Design


    An issue in metaheuristic optimisation is the choice of values for algorithmic
    parameters, especially the optimal trade-off between the exploration and exploitation
    of the solution space. The one extreme, the researcher may fix a relatively small
    number of parallel agents and spend more computational resources on locating the
    optimum region with higher accuracy. On the other edge, he/she might choose to
    increase the number of generations and population size and performing a more consistent
    exploration of the solution space. In this section, we show how the statistical
    results presented in previous sections could some guidance in a dilemma.


    Assuming that independent runs can be executed for each algorithm, one might ask
    for the minimal number of restarts such that at least one outcome is successful
    with high confidence. Based on the theory of Binomial distributions we provide
    a procedure for calculating the required algorithmic repetitions [6] (see also
    [14] for a detailed discussion). The idea is to see each run of the optimisation
    technique as a Bernoulli trial with probability of success equal to $f(t)$. Extending
    our previous notation, the relative frequency by which the algorithm has detected
    in $t=1,...,200$ iterations a solution that is at most (100-y)% inferior to the
    global optimum portfolio. Fixing the value of $t$, we can estimate the minimal
    number of trials such that the probability of observing at least one successful
    outcome is no less than a certain threshold. The desired quantity can be computed
    by inverting the Binomial cumulative probability function.'
