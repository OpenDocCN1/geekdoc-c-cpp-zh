  md: "The chosen Likertication criterion is based on the metric $\rho_1$. If $U$\
    \ is the generated fuzzy number, the criterion operates with the integer number\n\
    \n```\n\\rho_1(\\tilde{U}) = \\arg \\min_{k=1\\dots n} \\rho_k(\\tilde{U}, \\\
    tilde{U}_{(k)}).\n```\n\nAs an illustration for this Likertization, we consider\
    \ the fuzzy number in Figure 2 generated and re-scaled to interval [1,5] (i.e.,\
