    **Abstract** Most of the research developed in the last years by the SMIRE Research
    Group concerns the statistical analysis of imprecisely (set- and fuzzy)-valued
    experimental data. This analysis has been based on an approach considering the
    we between them. The research perfectly fits the usual arithmetic for these data
    as well as suitable metrics into the research directions of the COST Action IC0702,
    which has been particularly helpful for scientific activities, discussions and
    exchanges associated with group members. The main objective of this paper is to
    summarize some of the main recent advances of the SMIRE Research Group.


    # # 1 Introduction


    Traditionally, Statistical Data Analysis assumes that experimental data are either
    quantitative or qualitative. Most of the statistical techniques have been developed
    to deal with quantitative data. They allow us to exploit the wealth of information
    concerning the diversity and variability of these data.


    Nevertheless, qualitative experimental data are also present in real-life situations,
    and there is a rather limited class of statistical procedures to analyze these
    data. Furthermore most of these procedures do not exploit all the information
    contained in the data.


    In this respect, when we consider random experiments in which the attribute to
    be ''measured'' is a range, a fluctuation, a grouping, instead of using a qualitative
    scale we can employ the scales of interval or set val


