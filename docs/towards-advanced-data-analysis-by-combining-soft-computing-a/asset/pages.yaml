    $at(A_i, d)$ is an estimation of the number of times a pronoun from $A_i$ is coreferential
    with query $w$ in document $d$ and can be estimated using Equation 2 where $X
    = \{w\}$.


    Once we obtain the new query term frequency, using Equation (1), estimated on
    observed and anaphoric frequencies, we can apply any retrieval method to rank
    documents according to their relevance to the query.


    # 4 Experiments


    In this section we first explain the experimental setup for evaluating our methods.
    We then evaluate our proposed method for identifying the query type such as male,
    female or other. We report and discuss the result of evaluating our method on
    test queries in Section 4.3.


    # 4.1 Experimental Setup


    Our experiments are based on the BLOG6 collection [3] which contains more than
    3 million blog posts. We used the set of 150 topics in TREC 2006 through 2008
    and their corresponding relevance assessments.


    Each permalink was processed by removing boiler templates (i. e. non-relevant
    parts using DiffPost algorithm [5] and then indexed as a retrieval unit. The preprocessing
    of nouns removed from the stop list. We then only stopword removal with the model
    and set the parameters of the model (i.e., $\sigma_q$, $Q_{601}-Q_{650}$) topics
    and the number of feedback documents), we used TREC07 ($Q_{901}-Q_{950}$) and
    TREC08 ($Q_{1001}-Q_{1050}$) topics for our test set.


    We used the topical relevance judgements for evaluation. We report the MAP as
    R-Precision (R-Prec), binary Preference (bPref), and Precision at 10 documents
    (P@10). Throughout our experiments we used the paired-test with a significance
    of 0.001 to test the significance of our method. The symbols - and + show statistical
    decreases and increases compared to the standard term frequency (STF) baseline.


    In this paper we use BM25 [6]. The BM25 method is explained as:


    ```

    $BM25 = \sum_{w\in Q} \frac{idf(w)}{k_1((1-b) + b(l_d/L_{avg})) + tf(w; d)}$

    ```


    Here, $k_1$ and $b$ are normalization parameters. $L_{avg}$ indicates the average
    document length in the collection and $idf(w)$ is the inverse document frequency'
