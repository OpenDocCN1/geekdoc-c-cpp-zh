  md: '# 4 Application to Leading Business Cycle Indicators in Germany and Russia


    Being particularly interested in the usefulness of the strategies from the forecasting-point
    of view, we also show their application to real economic data.


    Leading indicators (LI) are nowadays a standard tool for the analysis and forecasting
    of business cycles due to the publication delay of real production. While for
    Germany (as for other industrial countries) there a large body of empirical evidence
    that models industrial production (IP), which include LI, outperform forecasts
    of univariate time series models [7, 11], there is less structural break for developing
    countries.


    For the empirical application we use LI (business expectations and business climate)
    and IP for Germany and Russia for the period 02/99-09/2009. More information on
    the properties of the data can be found in [14]. Important is that the German
    LI are seasonally adjusted, while for Russia they are not. Furthermore, a structural
    break in Russian data must be accounted for. Hence, we consider the IP indices
    for both countries as unadjusted and introduce seasonal shift dummies, and their
    terms (for details see [14]) to account for these properties.


    Similar to Section 3, ADL models (augmented with seasonal and shift dummies) are
    our models to identify predictors and construct forecasts, while an AR(2) process
    serves as benchmark. The latter is found to be a competitor in business cycle
    forecasting for small data sets [14].


    We employ 1-step ahead of IP growth rates (log differences) for periods of one
    and two years length between 11/2006 and 09/2009 (this allows us to consider the
    forecasting performance both prior and during the crisis) and increasing winter
    effects (IEW). Furthermore, in contrast to [14], we allow for lags both LI and
    both countries to be included in (9) for each IP, so that a selection out of 65
    predictors (5 variables and 13 lags) has been made. As a result, two data sets
    with highly correlated potential predictors are generated (see figure 1)


    Results for the two model strategies are exhibited in Table 2. As one can see,
    the first for performing the shrinkage strategies mostly dominate the benchmark
    for 12- and 24-month period forecasts, while heuristics fail do so. The main reason
    for this performance is seen to be the small estimation sample available: there
    are merely 128 observations for estimation and most comparable with the upper
    panel in Table 1. Furthermore, since the IP growth rates can be to a large extent
    (R² ≈ 70–80%) explained by the set of lags selected (together with the seasonal
    and shift dummies), which corresponds to the low noise setting, EN and Lasso outperform
    aLasso. Finally, since particularly for small noise and high correlation among
    predictors in small samples Lasso-type methods


