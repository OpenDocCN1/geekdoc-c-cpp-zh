    \ problem does not depend on the values of these parameters.\n\n# 4 Bootstrap\
    \ Confidence Intervals\n\nAs in classical Statistics, in this case it is useful\
    \ to estimate the regression parameters not only by a single value but by a confidence\
    \ interval too. These intervals represent the reliability of the estimates. How\
    \ likely the interval is to contain the parameter is determined by the confidence\
    \ level $1-\\alpha$. Since there are no realistic models in the context of PRVs,\
    \ we introduce a bootstrap approach. In general, there are different bootstrap\
    \ approaches to construct confidence intervals in a real-valued context. In this\
    \ work, we consider confidence intervals based on bootstrap percentiles(for more\
