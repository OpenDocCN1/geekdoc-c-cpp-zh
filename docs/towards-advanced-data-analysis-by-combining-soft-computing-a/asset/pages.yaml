  md: '# #4 Conclusions


    We investigated two complex network problems demanding hybrid analysis methods
    from both intelligent data analysis and network theory. We dealt with the analysis
    of dynamic graphs from social science and neuroscience. Edge weights have been
    used in both types of networks to answer questions. Firstly, we proposed a method
    to efficiently represent the strength of a relation between two entities based
    on both entities. Using the Butterworth filter we were able to establish a continuous
    series of edge weights and analyzed EEG data of patients suffering from optic
    damage. We showed how functional brain networks can be obtained and the measures
    were correlated with clinical variables describing the vision lost by EEG. These
    features will be used in future work to guide the way to a clinical decision support
    system.


