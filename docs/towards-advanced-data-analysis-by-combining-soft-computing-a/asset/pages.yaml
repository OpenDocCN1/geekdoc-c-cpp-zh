  md: "# On the Estimation of the\nRegression Model $M$ for Interval Data\n\nMarta\
    \ García-Bárzama1, Ana Colubi1, and Erricos J. Kontoghiorghes2\n\n**Abstract**\
    \ A linear regression model for interval data based on the natural interval-arithmetic\
    \ has recently been proposed. Interval data can be identified with 2-dimensional\
    \ points in $\\mathbb{R} \times \\mathbb{R}^+$, since they can be parametrized\
    \ by their mid-point and its semi-amplitude or spread, which is non-negative.\
    \ The model accounts separately for the contribution of the mid-points and spreads\
    \ through a single equation. The least squares estimator becomes a quadratic optimization\
    \ problem under linear constraints, which guarantee the consistency of the residuals.\
    \ Several estimators are discussed. Namely, a closed-form estimator, the restricted\
    \ least-squares estimator, an empirical estimator and an estimator based on separate\
    \ models for mids and spreads have been investigated. Real-life examples are considered.\
    \ Simulations are performed in order to assess the consistency and the bias of\
    \ the estimators. Results indicate that the numerical and the closed-form estimator\
    \ are appropriate in most of cases, while the empirical estimator and the one\
    \ based on separate models are not always suitable.\n\n# 1 Introduction\n\nOften\
    \ experimental researches involves non-perfect data, as missing data, or censored\
    \ data. In particular, closed and bounded real-valued sets in $\\mathbb{R}^n$\
    \ are useful to model information which also representing linguistic descriptions,\
    \ fluctuations, grouped data, but to name a few. Interval data is a specific case\
    \ of this kind. The study of linear regression models working with interval-valued\
    \ variables has been addressed *mainly* by two ways:\n\n1 Department of Statistics\
    \ and Operational Research, University of Oviedo, Spain, garciabarnarta.uniovio.es\
    \ - colubi@uniovio.es\n2 Department of Commerce, Finance and Shipping, Cyprus\
    \ University of Technology, Cyprus, erricos@cut.ac.cy\n\nC. Borgeolt et al. (Eds.):\
    \ Towards Advanced Data Analysis, STUFUZZ 285, pp. 43-52.\nspringlink.com © Springer-Verlag\
    \ Berlin Heidelberg 2013"
  merge: -1
  pgno: 47
- img_proc: true
  md: "(a) in terms of the separate models involving some components (as\nt midpoint\
    \ and the range or the minimum or the maximus) (see Billard\n Diday, 2003; Lima\
    \ Neto et al., 2005 and references therein) which most\nof the works with symbolic\
    \ interval variables; and (b) in terms of arithmetic-\nset-based unified models\
    \ (as Diamond 1990, Gil et al. 2001, 2002,\nGonzález-Rodríguez et al. 2007, Blanco-Fernández\
    \ et al., 2011, among\nothers). The main difference between both views is that\
    \ the first approach\nually fits the separate models by numerical or classical\
    \ tools, but without\nt usual probabilistic assessment the regression model provides\n\
    good fittings but easy ways of making inferences. On the other\nhand, the second\
    \ approach provides a natural framework to develop inferences,\\ although the\
    \ least squares approach becomes a minimization problem\nwith strong constraints.\n\
    \nThe rest of the paper is organized as follows: In Section 2 preliminary\nabout\
    \ the Model M will be introduced. In Section 3 four estimation\napproaches of\
    \ Model M will be described. In Section 4 a real-life example\nis analyzed to\
    \ compare the behaviour of the estimators. Finally, Section 5\ncontains some conclusions.\n\
    \n# 2 The Model M for Random Intervals\n\nHereafter, the intervals will be considered\
    \ elements in the space\n$\\mathcal{K}_o(\\mathbb{R}) = \\{[a_1, a_2] : a_1 \\\
    leq a_2 \\leq a_2\\}$. An interval $A \\in \\mathcal{K}_o(\\mathbb{R})$ can be\n\
    expressed in terms of its minimum and maximum or in terms of its mid\\point (mid)\
    \ and the radius (spr). The second characterization is more usual\nin regression\
    \ studies, as it involves non-negativity constraints which are easier\nto handle\
    \ the order constraints involved in the first characterization.\nThere is another\
