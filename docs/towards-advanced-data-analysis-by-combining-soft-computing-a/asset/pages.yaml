    # 4 Linguistic Summaries and Association Rules: An Intrinsic Relationship


    In this section, we will follow another path by investigating the similarity of
    our Type 5 summaries to association rules [1]. Originally, the association rules
    were defined for transactional data and binary valued attributes in the following
    way:


    ```

    $A_1 \wedge A_2 \wedge ... \wedge A_n \rightarrow A_{n+1}$

    ```


    An association row (table) is said to support a set of attributes $\{A_i\}_{i\in
    C}$ if all attributes take the set on value 1. There are two main measures for
    the association rule: the *support* is the fraction of rows supporting the attributes
    $\{A_i\}$, $i \in \{1, \dots, n+1\}$, in a database (table), and the *confidence*
    is the fraction of the rows supporting $\{A_i\}$, $i \in \{1, \dots, n\}$. While
    the support determines its measure. Usually, we are interested in rules having
    values of the support above some minimum threshold and a high value of the confidence.
    Many algorithms for finding all association rules possessing a required support
    measure were devised, see, e.g. Agrawal and Srikant [3].


    As most obvious extensions of the initial form of the association rule, one can
    mention the following ones: (1) the right-hand side, like the left-hand side,
    may contain a junction of attributes instead of just one attribute, (2) many-valued
    attributes and their hierarchies may be used, (3), real valued attributes may
    be used leading to the *quantitative association rules*, and (4) some constraint
    may be imposed on combination of attributes in rules. It is easy to see that (1)
    and (2) the initial scheme of an association rule may be rewritten:


    ```

    $A_1 = a_1 \wedge A_2 = a_2 \wedge ... \wedge A_n = a_n \rightarrow A_{n+1} \wedge
    ... \wedge A_{n+m} = a_{n+m}$

    ```


    Clearly, the association rules may be interpreted as a special case of the linguistic
    summaries. Namely, the antecedent and consequent of (5) correspond to qualifier
