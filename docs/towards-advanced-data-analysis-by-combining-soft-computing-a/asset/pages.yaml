  md: 'of granularity for categorical attributes and only with the chosen level of
    granularity the range of possible values for a categorical attribute becomes fixed.
    An example for different levels of granularity is an attribute describing the
    type of a product that has been produced or bought. A very coarse level of granularity
    could be simply the binary attribute *food* or *non-food*. On a refined level,
    *food* could be further divided into alcoholic and non-alcoholic drinks. Dealing
    with attributes having different levels of granularity is a routine in data warehousing
    where OLAP (Online analytical processing) technologies are extensively used [3].
    But in other fields, the problem of handling different levels of granularity of
    attributes [5] seems to have been neglected for quite a, especially in the area
    of data mining.


    In this paper, we describe an approach how different levels of granularity can
    be directly incorporated into the construction of regression trees based on the
    minimum description length principle (MDL). Section 2 explains the problem of
    different levels of granularity in the context of data mining and its relation
    to feature selection in more detail. Section 3 provides the necessary background
    on MDL, regression trees and granularity levels. Our regression algorithm incorporating
    the selection of granularity levels is described in Section 4. Section 5 briefly
    explains how granularity levels can be incorporated in the construction decision
    trees.


    # # 2 Brute Force vs. an Integrated Approach to Granularity Level Selection


    As already mentioned in the introduction, choosing a suitable granularity level
    for an attribute is related to feature selection. Feature selection refers to
    choosing a subset of attributes which - in the ideal case - contains only the
    relevant and redundant attributes. Feature selection is usually classified into
    two categories (see for instance [11])


    +   * Filter methods that carry out feature selection before the actual data mining
    algorithm is run. Filter methods try to remove irrelevant and redundant attributes
    without taking into account the specific data mining model to applied in a later
    step

    * Wrapper methods select the attribute in connection with the data mining algorithm.
    The result of the data mining algorithm with different subsets of attributes is
    evaluated and the subset that yields the best result is chosen. Often a greedy
    strategy like starting with one attribute and adding more attributes by step is
    applied to find a suitable subset of attributes.


    Wrapper methods usually require a higher computational complexity, since the data
    mining algorithm must be carried out multiple times. Wrapper meth-'
