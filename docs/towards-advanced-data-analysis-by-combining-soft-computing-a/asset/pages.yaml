  md: '# 2.2 Multi-stage Model Description of Software Reliability Growth


    The model described by equations (5)-(6) assumes that the defect detection rate
    decreases as the testing prolongs. In fact if each defect is fixed as it has been
    discovered the defect amount in the code would decrease and revealed dependence
    will follow asymptotic dynamic of concave or S-shape form. However, more realistic
    of the testing process should take into account the repairing effects. For instance,
    if a significant amount of new code is added in order to fix failure, the number
    of defects increases. In this case we can accept the defect detection rate. We
    also suggest that the defect rate has the same nature and the new model has the
    same structure as the current one. In this assumption is how to define appropriate
    model switching. Real practical concern is to decide which new dynamics (model)
    is applied and to identify the coefficients of the new model.


    The idea we are realizing here is to identify the repairing phenomenon by increasing
    the number of rules of the basic growth description model (5) in real time. It
    is accomplished by on-line identification procedure that automatically detects
    the new phases in the software reliability growth occurred if a certain amount
    of new code is added.


    # 3 Model Identification


    Identification of the model (5)-(6) needs interdependent structures of structure
    and parameter identification that are revealed in the next subsections 3.1 and
    3.2, respectively.


    # 3.1 Structure Identification


    The structure identification of the model aims to determine the number and types
    of the fuzzy subsystems. A widely applied method is based on fuzzy clustering
    procedure [3].


    Let raw data are provided in a matrix form $\mathbf{Z}_{N\times(n+1)} = [\mathbf{z}_k],
    k=1, \dots, N$ with $\mathbf{z}_k = [x_{k1}, x_{k2}, \dots, x_{kn}] = [\mathbf{x}_k,
    y_k]$ being $n+1$ dimensional vector and $N$ the number of data points. The dimensionality
    of the introduced basic model of software reliability growth is $n=3$, where the
    output vector equals to the predicted number of failures $y_k = x_{k+1}$.


    Fuzzy clustering is based on iterative optimization of the objective functional
    [4]:'
