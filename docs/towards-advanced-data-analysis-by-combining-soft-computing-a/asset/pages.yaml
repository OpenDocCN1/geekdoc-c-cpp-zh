  md: '# Change Detection Based on the Distribution of p-Values


    Katharina Tschumitschchew1 and Frank Klawonnn1,2


    **Abstract** Non-stationarity is an important aspect of data stream mining. Change
    detection and on-line adaptation of statistical estimators is required for non-stationary
    data streams. Statistical hypothesis tests may also be used for change detection.
    The advantage of using statistical tests compared to heuristic adaptation strategies
    is that we can distinguish between fluctuations to the randomness inherent in
    the distribution while it remains stationary or real changes of the distribution
    from which we sample. However, the problem of multiple testing should be taken
    into account when a test is carried out more than once. Even if the underlying
    distribution does not change over time, any test will erroneously reject the null
    hypothesis of no change in the long run if we carry out the test enough. In this
    work, we propose methods which account for the multiple testing and consequently
    improve reliability of change detection. A new method based on the information
    about the distribution of p-values is presented and discussed in this article
    as well as classical methods such as Bonferroni correction and the Bonferroni-Holm
    method


    # # 1 Introduction


    One of the most important aspects in data stream analysis is that in most applications
    the underlying data generating process does not remain static, i.e. the underlying
    probabilistic model cannot be assumed to be stationary. The changes in the data
    stream may occur over time. Dealing with non-


    > 1 Department of Computer Science, Ostfalia University of Applied Sciences, Salzdholmer
    Str. 46/48, D-38302 Wolfenbüttel, Germany, katharina.tschumitsch,f.klawonn@ostfalia.de


    > 2 Bioinformatics and Statistics, Helmholtz Centre for Infection Research, Hohenferstr.
    7, D-38124 Braunschweig, Germany, frank.klawonn@helmholtz-hzi.de


    C. Börgelt et al. (Eds.): Towards Advanced Data Analysis, STDUZZ 285, pp. 191-203.
    springerlink.com © Springer-Verlag Berlin Heidelberg 2013'
  merge: -1
