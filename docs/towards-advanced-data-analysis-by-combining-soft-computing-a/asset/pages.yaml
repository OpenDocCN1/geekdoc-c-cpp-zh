    The first conclusion is that LLF in (3) does not allow for an effective model
    selection algorithm. As the complexity of the model grows, the goodness-of-fit
    expressed by the value of LLF gets better, on the expense of the fitted model''s
    power to generalize. We suggest the replacement of LLF with an objective function
    that satisfies the *Law of Parsimony* and penalizes additional lags, such as *Bayesian
    Information Criterion* (BIC):'
