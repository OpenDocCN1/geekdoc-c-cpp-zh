  md: 'relevant area with oxygenated blood. The different magnetic properties of oxygenated
    blood in comparison to deoxygenated blood result in observable changes in the
    time series of the relevant voxels, which are exploited as an indirect indicator
    of neuronal activity. This is known as the blood oxygen level dependent (BOLD)
    effect [9]. For an excellent review of neurovascular coupling and its effect on
    the BOLD signal see [8].


    Typical task-related fMRI experiments are designed and conducted on certain hypotheses
    of important brain functions which are subsequently tested using regression-based
    statistics. At the end, often general linear models (GLM) based on hemodynamic
    response functions (HRF) are fitted to each individual voxel time series in order
    to obtain statistical maps highlighting brain activity related to experimental
    conditions. In regard, several priori assumptions are accepted by the neurovascular
    community. For connection between voxels, GLMs are generated and fitted using
    the same HRF for all time series, even though hemodynamic responses differ across
    the brain [1]. As a consequence, such an analysis is limited to the testing of
    a priori hypotheses and frequently makes use of a priori assumptions, which—if
    they are not met—may constrain the results.


    In contrast, data-driven approaches might reveal unexpected patterns that turn
    could give rise to new hypotheses, while at the same time priori assumptions are
    avoided as far as possible. For example, recent studies use graph-theory to derive
    network characteristics of the brain from connectivity matrices, where functional
    connectivity measures the temporal dependence between brain regions [4]. In both,
    task-related and resting-state settings (where in a resting state no task and
    external stimulus is present) studies indicate that the brain network is organized
    in a highly clustered way [3, 13]. Recently, this was exploited to compute functional
    correlations (based on spatial proximity) in order to rapidly identify hub regions
    in the brain [11].


    Building in a similar fashion on the strongly clustered brain organization, we
    present a new, noise-robust, and purely data-driven method targeting local functional
    connectivity patterns. The proposed approach is applicable to any type of fMRI
    data (task-related, resting-state etc.) and allows for time-efficient and model-free
    generation of meaningful brain maps (without making a priori assumptions or presuming
    hypotheses to test).


    # # Notices of Attention


    fMRI data are series of periodically acquired 3D intensity images. We denote one
    series by $\mathbf{i} = (i_1, i_2, \dots, i_T)$, where $T$ is the number of points
    in time at which the intensity images $i_k, k \in \{1, \dots, T\}$, are recorded.
    The individual images are organized in a regular 3D voxel grid of size $X \times
    Y \times Z$.'
