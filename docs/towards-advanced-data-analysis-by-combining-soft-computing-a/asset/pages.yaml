    $E[|X|^2] < \infty$, the variance of a random interval $X$ is defined in a Fréchet
    sense (sec [10, 16]) as

    $$\sigma_X^2 = E(d_H^2(X, E(X)))$$


    The corresponding sample moments are defined as in the classical case. Consider
    a random sample of size $n$ from the random interval $X, \{X_1, \dots, X_n\}$
    (i.e., $X_1, \dots, X_n$ are independent random intervals and identically distributed
    as $X$).


    +   - The real-valued mean of $\{X_i\}_{i=1}^n$ is given by $\hat{X}_n = (X_1
    + \dots + X_n)/n$.

    - The real-valued Fréchet sample variance of $\{X_i\}_{i=1}^n$ is given by $\hat{\sigma}_n^2
    = \sum_{i=1}^n d_H^2(X_i, \hat{X}_n)/n$, although considering the real-valued
    sample quasi-variance of $\{X_i\}_{i=1}^n$, $\hat{S}_n^2 = \sum_{i=1}^n d_H^2(X_i,
    \hat{X}_n)/(n-1)$, would be even preferable as it is unbiased and consistent estimator
    of the population variance (see [20]).


    # 3 One-sample Tests for the Variance of a Random Interval


    Let $X_1, \dots, X_n$ be $n$ independent and identically distributed random intervals.
    Given $\sigma_0^2 \in \mathbb{R}^+$, the aim of this test is to solve the following
    tests:


    +   $H_0^A : \sigma_X^2 = \sigma_0^2$ vs. $H_1^A : \sigma_X^2 \neq \sigma_0^2$
    (Problem 1)

    $H_0^B : \sigma_X^2 \le \sigma_0^2$ vs. $H_1^B : \sigma_X^2 \ge \sigma_0^2$ (Problem
    2)

    $H_0^C : \sigma_X^2 \ge \sigma_0^2$ vs. $H_1^C : \sigma_X^2 < \sigma_0^2$ (Problem
    3)


    To design tests for these problems, the following statistic can be considered
    by taking into account the results provided in [23].


    $T_n = \frac{\sqrt{\hat{S}_n^2 - \sigma_0^2}}{\hat{d}_H^2(X, \hat{X}_n)}$


    It is straightforward to prove that $\hat{S}_n^2 = \hat{S}_{mid, n}^2 + \theta
    \hat{S}_{spr, n}^2$ and $\sigma^2 = \sigma_{mid}^2 + \theta \sigma_{spr}^2$. Thus,
    the Central Limit Theorem for real-valued variables shows that


    $T_n^1 = \sqrt{n} (\hat{S}_{mid, n}^2 - \sigma_{mid}^2) = \sqrt{n} ((\hat{S}_{mid,
    n}^2 - \sigma_{mid}^2) + \theta (\hat{S}_{spr, n}^2 - \sigma_{spr}^2 ))'
