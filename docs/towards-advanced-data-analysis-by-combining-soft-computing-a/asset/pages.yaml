  md: 'Statistical Reasoning with Set-Valued Information


    # 2 Ontic vs. Epistemic Sets


    A set defined in extension, is often denoted by listing its elements, say, in
    the finite case ($s_1, s_2, \dots, s_n$). As pointed out in a recent paper [21]
    this representation, when it is used in applications, it is ambiguous. In some
    cases, a set represents a complex lumped entity. It is a conjunction of disjunction
    of itself. It is a precisely described entity made of subparts. For instance,
    a region in a digital image is a conjunction of adjacent pixels; a time interval
    spanned by an activity is the collection of instances where this activity takes
    place. In other cases, sets are used to represent incomplete information about
    an object or a quantity. In this case, a set is used as a disjunction of items,
    or of values of this uncertainty, one of which is the right one. For instance
    I may only have a rough idea of the birth date of the present of some country,
    and provide an interval containing this birth date. Such elements. It is clear
    that the interval itself is subjective (it is my knowledge), which has no intrinsic
    existence, even if it refers to a real fact. The use of sets representing imprecise
    values can be found in interval analysis [39]. Another example is the model of
    propositional knowledge base: one of them reflects the real situation. Moreover
    this set is likely to change by acquiring more information.


    Sets collections of elements forming composite objects will be called conjunctive;
    sets $E$ representing information states while elements outside are excluded.
    The conjunctive set is the precise representation of an objective entity (philosophically
    it is a *de re* notion), while a disjunctive set represents incomplete information.
    We also speak of ontic sets, versus epistemic sets, in analogy with ontic vs.
    epistemic actions in cognitive robotics [30]. An ontic set $C$ is the value of
    a set-valued variable $X$ of a value-valued quantity $x$ and we write $X = C$.
    A disjunctive set $E$ represents the unknown, however, does not exist per se.
    In fact, when representing an epistemic set it is better to handle a pair $(x,
    E)$ as a quantity and the value we know about it.


    A value inside a disjunctive set $E$ is a possible candidate value for $x$, while
    elements outside $E$ are considered outside. Its characteristic function can be
    interpreted as a membership function [50]. This distinction between conjunctive
    and disjunctive sets was made by Zadeh himself [57] distinguishing between set-valued
    attributes (like the sister of some person) from the unknown sister of some person.
    This issue has been extensively discussed by Yager [53] and Dubois and Prade [17]
    for the study of incomplete conjunctive information (whose representation requires
    a disjunctive set of conjunctive sets).


    An epistemic set $(x, E)$ does not necessarily account for an unknown deterministic
    value. An unknown quantity may be deterministic or stochastic. For instance, the
    birth date of a specific individual is not a random variable'
