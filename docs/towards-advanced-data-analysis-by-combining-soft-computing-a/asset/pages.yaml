    # 5 Conclusion


    We introduced the Streaming-Data Selection method for GP modelling so that the
    size of the active set remains constrained. Furthermore, for better model adjustment
    to the system hyperparameter values are optimised as well. To test the viability
    of the proposed method it is tested on two datasets from nonlinear dynamic systems:
    *pumdynyn-8* and *elevators*.


    The results from the experimental work indicate that the proposed SDS-GP is viable.
    It converges towards the error of the full GP, even though the initial parameter
    values are not optimal. The error of SDS-GP converges, as expected, more slowly,
    as it contains information only from selected data samples, while the OPG incorporates
    information from all the samples. On the other hand, SDS-GP is not over-confident
    in the case of a large active set, as is the case for the OGP.


    In the performed experiments over the projection is used for the comparison of
    the validated models. A more thorough validation of the obtained dynamic systems''
    models with simulation tests in addition to the prediction tasks are envisaged
    as the future tasks to confirm the usefulness of the proposed SDS-GP method.'
