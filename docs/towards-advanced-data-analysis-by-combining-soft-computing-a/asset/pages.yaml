    for all Lasso-type methods used to alleviate a potential bias that results from\
    \ the regularized estimation $(\\lambda > 0)$.\n\n# 2.2 Heuristic Optimization\
    \ Methods\n\nAlternatively, inconsistent criteria (IC) can be used to identify\
    \ $X^{opt}$ in (1). IC rank different models according to their fitness, while\
    \ penalizing model complexity. Hence, they can be interpreted as an $L^0$-constraint,\
    \ penalizing the coefficients' values, only their number:\n\n```\n$$\\hat{\beta}_IC\
    \ = \\arg\\min ||y - X\\beta||_2^2 + \\lambda ||\\beta||_0.$\n```\n\nIC have a\
    \ standard instrument in model selection from lag order selection in multivariate\
    \ and nonlinear autoregressive models between selection and rival nonested models\
    \ [18]. In this study, the Bayesian IC (BIC) and the Hann-Quinn IC (HQIC) are\
    \ employed. For infinitely large sizes IC can take advantage model selection instruments\
    \ and as noted by Hastie et al. ([19], p. 253), the solution of (7) remains consistent\
    \ even for data sets with correlated regressors.\n\nGiven that the space of candidate\
    \ models (7) is discrete, standard gradient methods cannot be applied. Also the\
    \ full enumeration of all possible solutions is only feasible for a moderate k.\
    \ Consequently, in the last decade many studies have been developed to solve the\
    \ problem in (1): sequential bottom-up (top-down) inclusion (deletion) of individual\
    \ regressors [12, 8]; usage of certain prior probabilities shrinking the search\
    \ space and resulting in model averaging [9]. However, these methods investigate\
    \ only a specific fraction of submodels, whereas there is no guarantee to find\
    \ the 'true' model in this way.\n\nTo tackle the highly integer optimization problem,\
    \ one can take advantage of optimization heuristics that mimic natural evolution\
    \ processes. These methods are called 'heuristic' or 'meta-heuristics' because\
    \ of their stochastic nature they help to converge to a model which represents\
    \ a good approximation of IC optimum. For an overview of these optimization techniques\
    \ see [6]. In [15] a similar subset problem was handled by two algorithms: Threshold\
    \ Accepting and Genetic Algorithms (GA). Since GA provide slightly better results\
    \ in terms of CPU time and solution quality, only GA are considered in the following.\n\
    \nGA are population-based heuristics that investigate the search space in many\
    \ direct simultaneous performing jumps in the search space by means of crossover\
    \ and mutation mechanisms. Thereby, the probability of getting stuck in a local\
    \ optimum is reduced. The members in the population are represented as bit strings\
    \ of ones and zeros representing the predictor variables included and not included\
    \ in the candidate model. In each"
