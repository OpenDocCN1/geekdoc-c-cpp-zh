  md: 'A. Blanco-Fernández, A. Colubi, and G. González-Rodríguez


    censored data are also usually represented by means of intervals (see [10]). Furthermore,
    intervals can also correspond to the values of attributes which are essentially
    interval-valued; this is the case when considering measurements of the fluctuation
    of a certain characteristic during a period of time, ranges of a certain variable,
    and so on; for instance, [4], [5].


    Regression analysis problems with interval-valued data have been deeply investigated.
    In particular, several linear models for relating two or more experimental measurements
    with interval-valued data have been proposed in the literature over the years.
    Some work develop interval techniques on the basis of the so-called Symbolic Data
    Analysis (see [2]). Symbolic variables are used for modelling aggregated data
    or interval descriptions of technical specifications. The Symbolic regression
    problems are usually solved separately for real-valued variables associated with
    the intervals, such as the lower and upper limits and ranges (see [3]). The resolution
    of the regression estimation by means of classical techniques does forbid the
    possibility of anomalous results such as forecasts whose bounds are larger than
    their ones. In [12] non-negativity conditions for the regression parameters that
    forbid such anomalies are included in the process. However, in the case the estimation
    is solved by means of numerical optimization methods, and no analytical expressions
    for the regression estimators are obtained. Since no probabilistic assumptions
    for the regression model are considered, and numerical techniques are employed,
    the process is just a fitting problem, so the study of statistical properties
    of the estimators and inferential studies about the model makes little sense.
    An alternative approach for interval regression is based on the formalization
    of a linear relationship between interval-valued variables, a natural generalization
    of the classical linear models based on real-valued variables. Some works in this
    domain are [3], [4], [5], [6], [7] among others. In this case, regression models
    between two or more interval-valued variables are formulated in terms of interval
    arithmetic. This is what we focus on hereafter. The extension of this interval
    regression models to other kinds of imprecise-valued variables, working with set
    or fuzzy-valued data, can be formalized in a direct way by considering set (see
    [8]).


    In this paper, the main goal is to review interval linear models based on the
    set arithmetic which have been introduced recently; among them are also examined.
    In Section 2 preliminary concepts about the interval framework are presented.
    In Section 3 three different linear models based on interval-valued data based
    on set arithmetic are reviewed. Their theoretical features and the estimation
    of their parameters are shown. Results comparing the empirical performance and
    the practical applicability of the considered models by means of some simulation
    studies and several practical data sets are gathered in Section 4. Finally, Section
    5 states some conclusions and future research.'
