  md: '# 6 Results for Real Data


    The model-driven approach using a GLM yielded robust activation in cortical and
    subcortical visual regions mostly confined to gray matter. As expected, high activity
    differences were found in the left and right calcarine nucleus respectively, the
    location of retinotopically organized primary visual cortex (V1). Additional regions
    representing the left and right visual field, respectively, could be localized
    as the secondary and mid-level visual regions V2 adjacent to the dorsal and ventral
    parts of V1 as well as MT+, located bilaterally in the temporal cortex. Subcortical
    regions such as the lateral geniculate nucleus (LGN) as well as the superior colliculus
    showed statistically significant differences between their left and right visual
    representation, albeit lower than V1 (see Section 4).


    We set out to address the question whether it is possible to generate meaningful
    brain maps with few assumptions with respect to experimental design or hydrodynamic
    properties across the brain. The LCM analysis yielded higher values for gray matter
    than non gray matter regions. For SPM, the highest values were found in left and
    right V1 and adjacent visual regions. Inspection of the results indicates that
    high SPM values were not accompanied by high LCM values (3rd and 4th row of Figure
    4). The histograms of SPM, and LCM confirmed this observation (5th row of Figure
    4). Conversely, many voxels exhibited no considerable activation associated with
    the visual experiment, while at the same time showing a high LCM. For both hemispheres,
    regions of interest (ROI) each were centered in the temporal lobe, where no coherentdriven-activity
    was to be expected. Highly active voxels in both V1 ROIs, identified with GLM
    and indicated by high SPM, deviations from zero, were also identified by LCM,
    while both approaches identified the WM regions as non-responsive. Voxels identified
    as highly active by SPM2 also show high LCM values, suggesting local connectivity
    increases across the cortex is active (5th row of Figure 4).


    # 7 Discussion, Conclusions and Future Work


    We presented noise-robust and data-driven measures that characterize local functional
    connectivity in fMRI data. Specifically, the proposed LCMs are designed in order
    to capture the proportion of synchronous activity (LCM, α > H), synchronous inactivity
    (1−LCM, α < H) or both (LCMd) as exhibited by adjacent voxels during a fixed period
    of time.


