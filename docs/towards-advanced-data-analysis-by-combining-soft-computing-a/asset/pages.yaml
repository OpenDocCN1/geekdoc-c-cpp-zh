  md: '128 L. Savin and P. Winker


    Setting $\lambda > 0$ by cross-validation insures the Lasso solution to have a
    parsimony property, i.e. only a subset of resulting predictors in (2) has non-zero
    coefficients. This feature of the Lasso might increase the total accuracy of the
    model forecast and improves the interpretability of the selected model.


    However, the Lasso has substantial limitations. It cannot identify all ''true''
    predictors in a data set with pairwise highly correlated regressors [21], the
    latter can be referred to as the ''irrepresentable condition'' [19, p. 254]. Thus,
    Lasso is consistent in only settings, when


    ```

    $$\max ||cov(X_{true}, X^{true})||\infty < 1,\quad (4)$

    ```


    while in presence of high correlations between ''true'' and irrelevant variables,
    the Lasso cannot recover the correct sparsity pattern ($\beta_{Lasso}\rightarrow
    \beta^{true}$). However, as Meinshaus and Yu ([11]) show, even failing to recover
    the correct sparsity pattern (when does not hold), the Lasso can provide good
    approximations of the ''true'' model for large sample sizes ($|\beta - \beta_{Lasso}||_2\rightarrow
    0$ as $n\rightarrow \infty$). In other words, Lasso selects ''true'' variables
    with high probability and irrelevant ones have only marginal coefficients ($L^{2}$-norm
    consistency).


    Second, Lasso is inconsistent for $k \gg n$ (underdetermined linear system), where
    (2) can identify more than $n-1$ (standardized) predictors [3].


    # Lasso Modifications


    Many proposals have been made on how to improve the Lasso concept. Due to space
    restrictions, we concentrate only on two such modifications. For a more complete
    overview, the interested reader is referred, e.g., to [7] and [5]. We consider
    two extensions of the Lasso: the elastic net (EN) using a combination of the Lasso
    ($\lambda_1$) and the ridge regression ($\lambda_2$) penalty [21]:


    ```

    $$\hat{\beta} = argmin_{\beta} ||y - X\beta||_2^2 + \lambda_1|\beta||_1 + \lambda_2|\beta||_2,\quad
    (5)$

    ```


    and the adaptive (Lasso) others applying different amounts of shrinkage for each
    regression coefficient [20]:


    ```

    $$\hat{\beta}_{uLasso} = argmin_{\beta} ||y - X\beta||_2^2 + \lambda\sum_{j=1}^k
    \omega_j|\beta_j|,\quad (6)$

    ```


    Thus, the selected extensions are particularly designed to deal with the limitations
    stated and operate in a continuous space remaining computationally efficient.
    Furthermore, in line with [2] we also perform unregularized restricted estimation
    (i.e. OLS estimation on the selected set of regressors)


    ^3 For more details the reader is referred to the literature. See also [13].'
