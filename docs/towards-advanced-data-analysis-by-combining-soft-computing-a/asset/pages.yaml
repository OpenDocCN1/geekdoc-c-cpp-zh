  md: 'Streaming-Data Selection for Gaussian-Process Modelling


    For a better adjustment of the model to the real system the hyperparameters are
    optimised by maximising the marginal log-likelihood. This can be done with any
    suitable optimisation method. In our case it is done with the conjugate gradients
    optimisation method proposed in [11]. If the hyperparameter values are changed,
    the covariance matrix has to be updated. In this case the inversion Q cannot just
    be updated, but a calculation from scratch is necessary.


    It is advisable that the optimisation of the hyperparameter values starts after
    the first incoming data when the active set contain enough information. Furthermore,
    the optimisation of the hyperparameter values could be limited to execute only
    when the difference between the negative-marginal likelihood of the current and
    previous step is large enough. In this way some computational load can be preserved.


    It should be noted that the scoring of the incoming data and for the calculating
    of the hyperparameter values other methods can be used as well.


