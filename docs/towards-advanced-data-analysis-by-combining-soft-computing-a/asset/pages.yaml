  md: 'and perfectly described in scientific literature. The [1–3] may be named as
    the highly recommended texts concerning this topic and including an extremely
    good list of references. In general, a formulation of this problem itself implies
    a pretty good amount of fuzziness. According to [2], pattern recognition is defined
    as a search for structure in data, which is performed in three steps: data acquisition,
    feature extraction from data and mapping of extracted features to pattern classes.
    The [4] represents the newest approach and technique to the same problem based
    on the regularization. The mapping process can be realized using two types of
    paradigms. The first one (a paradigm of determinism) is based on an existence
    of a set of crisp and standardized patterns. It means that a decision maker (human
    or machine) knows in advance presence (or absence) of features under consideration
    to a certain pattern. The second paradigm (a paradigm of uncertainty) is based
    on a fact that decision maker knows in advance for only several sets of features
    (examples) belonging to this or that pattern. So, say, these sets are labeled
    by patterns names, and it is supposed that some fuzzy descriptions of each (generated
    pattern) are generated using different teaching or training procedure. This paper
    is constructed under the paradigm of uncertainty using the fuzzy inference approach.
    The approach is reached by mechanism of inference [5, 6], which is included in
    widely spread Takagi-Sugano (T-S) reasoning procedure [2]. The main training process
    for parameters and weight determination in the T-S scheme is substituted by solving
    an adequate mathematical programming problem formulated according the fuzzy expert
    requirements [7, 8]. The paper consists of four main sections. Section 1 presents
    an idea of fuzzy-based inference in pattern recognition. Section 2 describes the
    main pattern recognition process based on Takagi-Sugano (T-S) reasoning procedure.
    Section 3 is dedicated to solving the piecewise linear programming problems (LPP
    or PWLPP), constructed according to fuzzy experts'' information to define all
    necessary rule weights in T-S procedure. Section 4 contains results of real experiments
    on the use of the proposed approach for recognition of healthy people and those
    who suffer from certain illness (in our case – atherosclerosis). The paper ends
    with special thanks and acknowledges to all anonymous participants of these experiments
    as well as to all supporters of this research.


