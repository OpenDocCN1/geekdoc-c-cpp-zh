    # 7 Epistemic vs. Ontic Interval Data Processing


    Consider a set of bidimensional data $D = \{(x_i, Y_i) = [y_i, y_i^*], i=1..n\}$
    or its fuzzy counterpart (if the $Y_i$ are fuzzy sets). The issue of devising
    an extension of data processing methods to such a situation has been studied in
    many papers in the last 20 years or so. But it seems the question regarding how
    the set-valued data has impact on the chosen method is discussed. We provide some
    hints on this issue, restricting outliers to linear regression and some of its
    extensions.


    A first approach that is widely known is Diamond''s fuzzy least squares method
    [12]. It is based on set-valued data. The problem is to find a best fit interval
    model of the form $y = A^*x + B^*$, where intervals $A^*, B^*$ minimize $\sum_{i=1}^n
    d(Ax_i + B, Y_i)^2$, typically a sum of squares of differences between upper and
    lower bounds of intervals. The fuzzy least squares regression is similar but it
    presupposes that the $Y_i$ are triangular intervals $[y_i^*; y_i^*; y_i^*]$, with
    modal value $y_i^*$ and support $[y_i, y_i^*]$.'
