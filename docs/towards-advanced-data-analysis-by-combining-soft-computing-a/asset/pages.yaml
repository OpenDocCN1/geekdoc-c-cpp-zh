  md: 'Dynamic Texture Recognition Based on Compression Artifacts 259


    # 3 Proposed Approach


    A block diagram of the proposed dynamic texture classification approach is shown
    in Fig. 2. The input data are compressed videos of dynamic textures. If the video
    is not compressed it can easily be processed with any compression algorithm. Each
    video in the data set is initially processed to extract measures related to motion,
    salient changes, blurring and blockiness. A total of 17 measures is extracted
    for half of the frames, distributed uniformly - once the measures have been calculated
    for a frame, the next frame is skipped. This increases the number of frames and
    thus the impact on the effectiveness. The values of measures for all frames of
    a single video are clustered into 10 clusters using k-means clustering [25]. The
    set of centroids is a fixed-size representation of a video, regardless of the
    number of frames it has. This is referred to as a Video Signature (VS).


    Once the signatures for all the videos are computed they are used to train and
    test a neural-network-based mean classifier. Each centroid is used as a separate
    input the classifier and each video is represented by 10 centroids comprising
    the signature. This is done to make the approach less sensitive to the measurement
    error introduced by the saliency-detection module, which takes approximately 50
    frames to adapt to scene changes and learn the background model when presented
    with a new sequence.


    The classifier is used to discern the semantic class for each of the 10 centroids
    comprising a VS. The mode (most common value) of the 10 class labels obtained
    in this manner is used the final classification of the video.


    # 3.1 Extracting Features


