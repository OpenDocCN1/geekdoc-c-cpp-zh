- img_proc: true
  md: 'and fuzzy systems. These two techniques for constructing precise models have
    been merged to some extent due to the great similarity between the mathematical
    account of fuzzy rules and neurons, and their possible synergy due to the joint
    use of linguistic interpretability of fuzzy rules and learning capabilities of
    neural nets. While innovative with respect to order modeling, these methods remain
    in the traditional school of producing a simplified and imperfect substitute of
    reality as observed via precise data.


    Besides, there exists a strong tradition of accounting for the non-deterministic
    aspect of phenomena subject to randomness in repeated experiments, including the
    noisy environment of measurement processes. Stochastic models enable to capture
    the general trends of populations of observed events through the use of probability
    distributions having a frequentist flavor. The probability measure attached to
    a quantity then reflects its variability through observed statistical data. Again
    in this approach, a stochastic model is able to capture variability in physical
    planes.


    More recently, with the emergence of Artificial Intelligence, but also in connection
    with more human-centered research areas like Economics, Decision Analysis and
    Cognitive Psychology, the concern of reasoning about knowledge has emerged as
    a major paradigm [29]. While this topic has been mainly developed in the framework
    of classical or modal logic, due to the long philosophical tradition in this area,
    it has strongly affected the development of uncertainty theories [20], and has
    led to a critique of probability theory as a unique framework of variation and
    belief. These developments question traditional views of modeling as representing
    reality independently of perception. They suggest that different approach should
    also account for the cognitive limits of our observations of reality. In other
    words, we call ontic model a representation of reality (however inaccurate it
    may be), and epistemic model a mathematical representation of both reality and
    knowledge of reality, which explicitly accounts for the limited precision of our
    measurement capabilities. Typically, while the ontic model is precise (but possibly
    wrong), an epistemic model delivers imprecise output (hopefully with the reality
    it accounts for). An epistemic model should be as precise as possible, given the
    available incomplete information, but it should also be as plausible as possible,
    avoiding unsupported precision.


    This paper discusses epistemic modeling in the context of set-based representations,
    and the mixing of variability and incomplete knowledge as present in recent works
    in fuzzy-set statistics.'
