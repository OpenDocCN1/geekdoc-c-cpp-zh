    # 8 Conclusion


    This position paper argued that the use of set-valued and fuzzy mathematics in
    information processing tasks gives the opportunity to reason about\knowledge,
    an issue not so popular in data-driven studies. However, one

    should distinguish between genuine set-valued problems where sets stand for

    existing entities and epistemic problems where sets represent

    incomcomplete information. This distinction implies the very new problems

    can be posed so as to be meaningful in practice. Adding knowledge

    and reasoning to the modeling paradigm could be a good way to

    reconcile Artificial Intelligence and numerical engineering methods.


    Strongly enough fuzzy set information processing techniques gathered

    under the soft computing flag are set-valued methods, as they aim

    most of the time at computing standard numerical functions using fuzzy rules\and
    neural networks, exploiting stochastic metaheuristics to optimise the fit.

    A fuzzy system is then seldom viewed as an epistemic fuzzy set of systems.

    Adopting the latter view could could lead to fruitful developments of fuzzy sets

    methods in a direction not yet much considered in the engineering sciences,

    beheading using old fuzzy rule-based systems further.


