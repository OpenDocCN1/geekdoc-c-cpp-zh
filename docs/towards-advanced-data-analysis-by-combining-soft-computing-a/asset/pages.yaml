  md: "A. Blanco-Fernández, A. Colubi, and G. González-Rodríguez\n\nThe basic interval\
    \ linear model (6) has been criticized in some respects due to its lack of flexibility.\
    \ It is straightforward to show that from (6) the following linear relationships\
    \ of the *mid* and *spr* components of the intervals $X$ and $Y$ are transferred:\n\
    \n```\n$mid Y = a\\,mid X + mid\\varepsilon \\text{ and } spr Y = |a|spr X + spr\\\
    varepsilon \\quad (9)$\n```\n\nSince both equations involve the same (in absolute\
    \ value) regression coefficient, the model is restrictive for many real-life applications.\
    \ With the aim of allowing more versatility in the relationship between $X$ and\
    \ $Y$, a new linear regression model for random intervals based on set arithmetic\
    \ has been introduced in [3].\n\n# 3.3 Simple Flexible Linear Model: Blanco-Fernández\
    \ et al. (2011)\n\nThe interval model introduced in [3] is based on the so-called\
    \ *canonical-decomposition* of intervals. Each $A \\in K_c(\\mathbb{R})$ can be\
    \ written as $A = mid[1\\pm0] + spr[0\\pm1]$. This expression allows us to work\
    \ with the $mid$ and $spr$ components of $A$, keeping the interval arithmetic\
    \ convenient. Notably, the $(inf, sup)$-representation of the intervals $[1\\\
    pm 0]$ and $[0\\pm 1] = [-1, 1]$, respectively.\n\nThe so-called Model M between\
    \ two random intervals $X$ and $Y$ is formalized as follows:\n\n```\n$Y = \\alpha\\\
    ,mid X[1\\pm 0] + \\beta\\,spr X[1\\pm 0] + \\gamma[1\\pm 0] + \\varepsilon \\\
    quad (10)$\n```\n\nwhere $\\alpha$ and $\beta$ are the regression coefficients,\
    \ $\\gamma$ is an intercept term affecting the $mid$ component of $Y$, and $\\\
    varepsilon$ is a random interval-valued error such that $E([{\\varepsilon]) =\
    \ [-\\delta, \\delta] \\in K_c(\\mathbb{R})$ (with $\\delta \\geq 0$). To simplify\
    \ we define $B = [\\gamma - \\delta, \\gamma + \\delta] \\in K_c(\\mathbb{R})$\
    \ and express the regression function associated with Model (10)\n\n```\n$E(Y|X)\
    \ = \\alpha\\,X^M + \\beta\\,X^S + B \\quad (11)$\n```\n\nwhere $X^M = mid[1\\\
    pm0]$ and $X^S = spr[0\\pm1]$. It is easy to show that from (10) the subsequent\
    \ linear relationships for\n\n```\n$mid Y = \\alpha\\,mid X + mid\\varepsilon\
    \ \\text{ and } spr Y = |\\beta|spr X + spr\\varepsilon$.\n```\n\nSince $\\alpha$\
    \ and $\beta$ are different in general, Model M is more flexible than the linear\
    \ basic model in (6)."
