    # 2.5 Improvements


    The problems arising from drastically changing user behavior were already discussed
    before and led to the offset incorporated into the objective function. Another
    approach could be an adaptive filter, that changes its passband frequency according
    to the history of latest events to lower the overall error even further. The problem
    arising from this approach occurs when using a high resolution for the time scale.
    Ultimately all bins will be empty with only a few containing a single event. If
    a filter were to adapt to only a short history (e.g. five bins) it would result
    in a constant filter response, namely a constant signal, which reduces the MSE
    to almost zero.'
