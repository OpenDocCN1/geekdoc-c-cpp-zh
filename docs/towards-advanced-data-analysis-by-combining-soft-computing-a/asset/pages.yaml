  md: '# Statistical Analysis of Imprecisely Valued Data


    expression stated in the interval-valued case [33]. Let $\theta \in \{0, +\infty)$
    (often $\theta$ is supposed to be in $[0,1)$ and let $\varphi$ be an absolutely
    continuous probability measure on $[0,1]$ with the mass function being positive
    in $(0,1)$. Then, the metric by Trutschnik assigns $\tilde{U}, \tilde{U}'' \in
    \mathcal{F}^*(\mathcal{R}^p)$ the value


    ```

    D_{\mathcal{G}}^\varphi(\tilde{U}, \tilde{U}'') = \sqrt{\int_{[0,1]} [d_{\varphi}(\tilde{U}_u,
    \tilde{U}''_u)]^2 d\varphi(u)}

    = \sqrt{\int_{[0,1]} \int_{\mathcal{S}^{p-1}} |\text{mid}\tilde{U}(u) - \text{mid}\tilde{U}''(u)|^2
    d\lambda(u) + \theta \int_{\mathcal{S}^{p-1}} |\text{spr}\tilde{U}(u) - \text{spr}\tilde{U}''(u)|^2
    d\lambda(u) } d\varphi(u)}$$

    ```


    where $\mathcal{S}^{p-1}$ is unit sphere in $\mathbb{R}^p$, $\lambda$ is normalized
    Lebesgue measure on $\mathcal{S}^{p-1}}$, and $\Pi\tilde{U}(u)$ is projection
    of $\tilde{U}$, in the direction $u$ in $\mathcal{S}^{p-1}$.nThe choice of $\theta$
    allows us to weigh the effect of the deviation in ''location'', and $\varphi$
    ''imprecision'' to control the deviation enables the treatment of different $\alpha$-levels.
    The metric above is intuitive, versatile and easy-to-handle and has been the most
    frequently used in the statistical development of the SMRE RG.


    The metric by Trutschnik [59] has been defined by considering certain distances
    between the fuzzy values. Several convergence and characterization results are
    based on the basis of this metric, although it has not yet been employed for statistical
    purposes.


    Metrics between imprecisely valued data will be relevant in quantifying errors
    in approximating imprecise data by other ones, or to classify imprecise data in
    groups on the basis of their ''closeness''. They will also be useful to translate
    equalities between imprecise values into equalities of real numbers (some concrete,
    equalities of the distances between imprecise values to zero), which overcomes
    one of the drawbacks associated with the above-mentioned lack of linearity of
    the spaces ($K_*(\mathcal{R}^p), +$).


    The metrics above exhibit interesting properties, topological equivalences, and
    allow us to establish different Radstrom-type is embedding the spaces $K_{\alpha}(\mathcal{R}^p)$
    and $\mathcal{F}^*(\mathcal{R}^p)$ (actually, wider ones) into cones of Hilbert
    space by random vectors (see Blanco-Fernández [5], Ferraro et al. [29], and González-Rodríguez
    et al. [37], etc.).


    The methodological developments to develop imprecisely-valued data have been based
    on the model for random mechanisms generating imprecise data, namely, random sets
    and random fuzzy sets. The empirical developments have been based on the simulation
    of values from them.'
