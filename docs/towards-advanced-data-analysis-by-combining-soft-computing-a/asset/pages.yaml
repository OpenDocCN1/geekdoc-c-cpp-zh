    # 3.5 Summary


    Until now, it is still unknown whether EEG can properly describe damages of the
    human visual system. The goal of this study was to find both suitable network
    measures and useful clinical features that can be used for further analyses.


    We studied dynamic functional networks from patients with visual fields. Based
    on typical frequency bands, the networks have been created by applying synchronization
    likelihood to several EEG time series from the subjects. We averaged the resulting
    series of graphs. Every averaged graph was described by graph measures. The measures
    have been correlated to variables describing each patient. In only some frequency
    bands we have found significant correlations for a couple of variables and network
    measures. The correlations show that most prominently the $\gamma$ band seems
    to be a fair marker for the effects of optic nerve damage. Also, the proportion
    of relatively defective sectors turned out to be the most informative clinical
    variable in this analysis.'
