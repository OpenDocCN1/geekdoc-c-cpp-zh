  md: '# Comparing the Median for Likert and Fuzzy Scales


    Actually, the only critical point for this third alternative is shared with the
    two previous ones. This drawback concerns the practical conduction of these questionnaires
    in situations requiring a quick response (say on the street, at the door, by telephone,
    online, ...) without the required little time to explain respondents the ‘fuzzy’
    way to reply.


    This paper aims to discuss the interest of using the scale of fuzzy numbers-based
    questionnaires with a free response format versus the Likert questionnaires. In
    this paper this discussion is performed by developing a comparative study of the
    representatives of the recently introduced 1-norm median (see Sinatra et al. [17])
    for the fuzzy data with the median of the integer-encoded Likert data.


    *Remark 1.* It should be pointed out that the motivation for the study in this
    paper can be mostly found in the work by Hesketh and Hesketh along collaborators
    ([5, 6, 7, 8]). By combining the expertise in computing with psychometric, they
    have introduced the fuzzy rating scale (and its computerized graphical version)
    as an extension of the semantic differential. This scale is a common method of
    rating a variety of stimuli and analyzing/comparing responses meaningfully across
    the stimuli. To see the posterior analysis, Hesketh and Hesketh have asked the
    respondents to elicit their ratings using triangular numbers for the ‘v’ (pointer
    vertex) which means the preferred point and the left and right쪽에 indicate whether
    a particular rating can be possible/compatible (or, as Hesketh and referred to,
    they determine the tolerable range of preferences). Fuzzy rating scales have been
    applied or considered to potentially applicable to many areas such as job analysis,
    rating of selection interviews, performance ratings in customer services, and
    so on.


    Hesketh and Hesketh outlined reasons for the interest of the statistical analysis
    of the collected responses. In fact, they have already performed some descriptive
    statistics with them, by analyzing the real-valued random variables with the three
    values characterizing fuzzy numbers. Nowadays, the concept of random fuzzy set
    and the developed statistical methodology are useful to draw much conclusions
    from these responses and treat each datum as a whole. This methodology involves
    an added value: the possibility of drawing not only descriptive but also inferential
    conclusions. For this methodology needs not to be triangular, so that the preferred
    point in the fuzzy rating scale can be extended to any values which are considered
    to be fully compatible with the respondent rating. The apparent computational
    complexity to develop statistics with the fuzzy responses can be substantially
    reduced by considering the R package SAFD (see [19] in this book and http://cran.r-project.org/web/packages/SAFD/index.html).


    *Remark 2.* We would also like to remark that there is an essential difference
    between the approach for the fuzzy rating in this paper and the approaches'
