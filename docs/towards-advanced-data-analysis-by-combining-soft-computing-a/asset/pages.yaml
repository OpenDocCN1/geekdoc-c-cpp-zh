  md: '# # Preface


    This book is the Final Action Publication of COST Action IC0702: “Combining Soft
    Computing Techniques and Statistical Methods to Improve Data Analysis Solutions”
    (SoftStat).


    The main objective of this Action was to strengthen the dialog between the statistics
    and soft computing communities in order to cross-pollinate both fields and generate
    mutual improvement activities.


    Soft computing, as an engineering science, and statistics, as a branch of mathematics,
    emphasize different aspects of data analysis. Soft computing focuses on obtaining
    solutions quickly, accepting approximations and unconventional approaches. Its
    strength lies in its flexibility to create models that suit the needs asking (the
    context of discovery, model generation). In addition, it emphasizes the need for
    intuitive and interpretable models, which are tolerant to imprecision and uncertainty.


    Statistics is more rigorous and focuses on establishing objective conclusions
    based on experimental data by analyzing the possible situations and their (relative)
    likelihood (context of justification, model validation). It emphasizes the need
    for mathematical methods and tools to assess and guarantee performance.


    Bringing the two fields close together enhances the robustness and generalizability
    of data analysis methods, while preserving the flexibility to solve real-world
    problems efficiently and intuitively.


    This book contains 28 contributions from various members of COST Action IC0702,
    many of which are the outcome of short-term scientific missions (STSMS), that
    is, of visits that a (preferably early-stage) researcher paid in another country.
    In this way it is demonstrated that the Action made good use of this tool and
    nourished scientific collaborations that can be expected to continue beyond the
    end of the Action.


    The financial support provided by the COST Office and the European Science Foundation
    (ESF) for both the Action and as whole this Final Action Publication is gratefully
    acknowledged.


    March 2012


    Christian Borgiet (Mieres, Spain)

    María Ángeles Gil (Oviedo, Spain)

    Joao M.C. Sousa (Lisbon, Portugal)

    Michel Verleysen (Louvain, Belgium)'
