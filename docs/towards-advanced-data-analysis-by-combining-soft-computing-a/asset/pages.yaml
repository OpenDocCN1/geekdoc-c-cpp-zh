  md: "operations are based on Zadeh's extension principle [22] which is equivalent\n\
    level-wise interval arithmetic. Thus, for $U, \\tilde{V} \\in \\mathcal{F}_u^+(\\\
    mathbb{R})$ and $\\gamma \\in \\mathbb{R}, \\gamma U + \\tilde{V}\nis the fuzzy\
    \ number such that for each $\\alpha \\in [0,1]$\n\n```\n$(\\tilde{U} + \\tilde{V})_\\\
    alpha = [\\inf \\tilde{U}_\\alpha + \\inf \\tilde{V}_\\alpha, \\sup \\tilde{U}_\\\
    alpha + \\sup \\tilde{V}_\\alpha]$\n```\n\nwhereas $\\gamma \\cdot \\tilde{U}$\
    \ is the fuzzy number such that for each $\\alpha \\in [0,1]$\n\n+   $(\\gamma\
    \ \\cdot \\tilde{U})_\\alpha = \\begin{cases} \\gamma \\inf \\tilde{U}_\\alpha,\
    \ \\gamma \\sup \\tilde{U}_\\alpha & \\text{if } \\gamma \\geq 0 \\\\ngamma \\\
    sup \\tilde{U}_\\alpha, \\gamma \\inf \\tilde{U}_\\alpha & \\text{if } \\gamma\
    \ < 0 \\end{cases}$\n\nA first distinctive feature of the real-valued case lies\
    \ in the fact\nthat $(\\mathcal{F}_u^+(\\mathbb{R}), +, \\cdot)$ does not have\
    \ a linear structure (actually, it has a\nconical semilinear structure); since\
    \ the neutral element for the\nfuzzy sum is not $\tilde{0}$, one cannot establish\
    \ a definition for\nthe difference between fuzzy numbers that is well-defined\
    \ and simultaneously\npreserves the properties of the difference between real\
    \ numbers (the only way\nfor these properties to be preserved is to consider the\
    \ Hausdorff difference,\nwhich is not well-defined for most of the fuzzy numbers)\n\
    \nThis inconvenience can be overcome by using *metrics between fuzzy*\nnumbers\
    \ which are versatile and easy-to-use. Since the comparative analysis\nwe present\
    \ in this paper is based on the representativeness of the median,\nwe consider\
    \ the 1-norm metric by Diamond and Kloeden [4] which is an $L^1$\\nmetric extending\
    \ the Euclidean metric. For $U, \\tilde{V} \\in \\mathcal{F}_u^+(\\mathbb{R})$\
    \ the 1-norm metric\nis defined as\n\n```\n$\\rho(\\tilde{U}, \\tilde{V}) = \\\
    frac{1}{2} \\int_{[0,1]} (|\\inf \\tilde{U}_\\alpha - \\inf \\tilde{V}_\\alpha|\
    \ + |\\sup \\tilde{U}_\\alpha - \\sup \\tilde{V}_\\alpha|\\ d\\alpha.$\n```\n\n\
    The probabilistic model we consider to randomize the mechanism\ngenerating the\
    \ fuzzy responses is that of *fuzzy numbers*\n(RFNs, Puri and Ralescu [16]). Given\
    \ a\nprobabilistic space $(\\Omega, \\mathcal{A}, P)$, a mapping $X : \\Omega\
    \ \\to \\mathcal{F}_u^+(\\mathbb{R})$ is said to be\na fuzzy number (RFN) if for\
