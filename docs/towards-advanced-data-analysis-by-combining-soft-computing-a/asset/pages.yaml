  md: 'randomness in conventional regression, the error term is considered as fuzzy
    variables in fuzzy regression. Recently, fuzzy arithmetic based least-squares
    solutions have also been considered [9]. A novel approach of hybrid least-squares
    regression, which uses the definition of weighted fuzzy arithmetic and the well-accepted
    squares fitting criterion, has been proposed [4].


    Both fuzzy set and statistical models have their specific set of parameters that
    must be identified given a data set. The spreads of fuzzy sets must be determined
    when applying hybrid regression modeling. An interesting question in this regard
    is whether information defined in the context of statistical methods could be
    useful for developing fuzzy models and vice versa. In this paper, we address such
    question, whether the hybrid regression problem can be handled beneficially by
    using (statistical) confidence intervals. The model allows the hybrid fuzzy least-squares
    procedure and provides the spread (width) of memberships from confidence bounds.
    In this manner, integration of statistics and fuzzy analysis is provided in a
    very specific way. The applicability of confidence interval-based analysis is
    presented both on linear regression coefficients and predicted values by numerical
    examples.


    The rest of the paper is organized as follows. Section 2 states the basics of
    weighted fuzzy arithmetic and the hybrid fuzzy least-squares regression. Confidence
    interval-based approach for coefficients and predictions is described in Section
    3. Section 4 presents the applications of the proposed approach. Finally, Section
    5 gives the conclusions.


    # 2 A Review on Hybrid Fuzzy Linear Least-squares Regression


    The hybrid fuzzy regression has been developed based on fuzzy arithmetic and least-squares
    fitting approach. In this section, we give an overview of hybrid regression modeling
    as formulated in [5, 4].


    # 2.1 Weighted Fuzzy Arithmetic


    The approach for hybrid fuzzy linear least-squares regression (LS) is based on
    the concept of weighted fuzzy arithmetic [4]. Fuzzy arithmetic is a well-known
    tool for determining levels of uncertainty [1, 11]. Due to some drawbacks of conventional
    fuzzy arithmetic, new approaches such as weighted fuzzy arithmetic have been proposed.
    The weighted fuzzy arithmetic combines each weighted operation via the membership
    level for the entire fuzzy set, and divides the weighted combination using the
    total integral of the membership function [12]. The method employs the theory
    of defuzzification'
