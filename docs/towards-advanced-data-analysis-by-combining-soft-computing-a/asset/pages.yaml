    For sampling an $m$-dimensional (hyper-)$j$ ball (also called distribution is
    spherically symmetric) we exploit the insight that a multivariate standard normal
    distribution is spherical: if $x_1, \dots, x_m$ are independently distributed
    from a standard normal distribution then the vector $\mathbf{x}'' = \mathbf{x}/\sqrt{\sum
    x_i^2}$ is uniformly distributed on an $m$-sphere [12]. To obtain points that
    are uniformly distributed over a vector $\mathbf{x}^*$ uniformly an $m$-sphere
    (see above) we start by sampling a pseudo-random number $u$ which is uniformly
    distributed in $[0,1]$. Since the radius $r$ of a random vector that is uniformly
    distributed over an $m$-ball satisfies $P(r\leq z)=z^m$, we can write $r=u^{1/m}$.
    The vector $\mathbf{x}^*=r\mathbf{x}''$ is uniformly distributed over an $m$-ball
    [12].


    In addition to basic data generation our implementation supports sampling a regular
    grid of (hyper)-cubes with a user-specified size. With this method we try to obtain
    a low-dimensional space with a large boundary to show that hubness phenomenon
    can be produced in this way. The procedure is essentially the same as sampling
    from a hypercube, where the hypercube is cut by the requested number of samples
    and the cuts are introduced by an appropriate transformation of the coordinates.
    To be precise: given a number $\eta$ of (hyper)-dimensions and a fraction $\alpha$,
    which specifies how much (dimension) of a cell is covered by the small (hyper)-cube,
    we sample $x_1, \dots, x_m$, from $[0,1]$ and transform them to $x''_i=2(\eta
    x_i-\lfloor\eta x_i\rfloor)/(\eta-1+\alpha)$ for $i=1,\dots,m$. An example of
    such a 2-dimensional data set, generated with 2000 points, which was generated
    with $\eta=5$ and $\alpha=0.5$, is shown in Figure 1.


