    Coefficients $\gamma$ and $\kappa$ permit us to control the fuzzy level of similarities
    and dissimilarities, and the solution of (12)-(14) implements the concept of fuzzy
    hyperinference. By the way, even fast investigation of the problem described shows
    that the problem belongs to the class of linear programming problem (LPP) where
    inequalities (13) and (14) need additional constraints:


    $0 \le \mathbf{K}_p \le A,$


    where $A$ is any practically convenient real number. Naturally, a solution of
    the LPP (12)-(15) for the pattern (class) $p$ consists of the obtained value for


    $max\Phi_p(\alpha_p) = \Phi_{max} \text{ and } \mathbf{K}_p = (K_{p1}, K_{p2},
    \dots, K_{p1}, \dots, K_{pN}).$


    The procedure is repeated for all patterns $p$. In this way, the set of $S$ solutions
    will be obtained, and the recognition procedure must be performed according to
    Fig. 3, taking into account the need of fulfilling proportionality


    $c_1\Phi_{1 max} = \dots = c_p\Phi_{p max} = \dots = c_S\Phi_{S max} = B,$


    where $B$ and $c$ are real numbers. This condition plays a role in the normalization
    procedure, and it means that the fuzzy term "VERY SIMILAR" must be evaluated by
    the same number $B$, whichever we are taking into consideration. Sometimes decision
    makers may have in advance an additional information concerning the initial structure
    of classes under consideration (for example, they guess an existence of certain
    subclasses under subclasses numbered as $w = w_1, w_2, \dots, w_p$). Then we assume
    that the pattern $p$ consists of $wp$ subclasses the classical linear programming
    problem (LPP) for determination of weights in the Takagi-Sugeno (T-S) reasoning
    procedure for pattern recognition can be substituted by a piece-wise linear programming
    problem (PWLPP) similar to the (12)-(15). The requirement is to maximize


    $max\Phi_p(\alpha_p)^w = max\sum_{i=1}^N \alpha_{pi}^w K_{pi}^w \to max,$


    where $w = w_1, w_2, \dots, w_p$, under the constraints:


    $max\sum_{i=1}^N \alpha_{wi}^w K_{pi}^w \ge \gamma max\sum_{i=1}^N \alpha_{pi}^w
    K_{pi}^w \\forall l,$


    $max\sum_{i=1}^N \alpha_{ri}^w K_{pi}^w \le \kappa max\sum_{i=1}^N \alpha_{pi}^w
    K_{pi}^w \\forall r \neq p, \\forall w,$


    $0 \le \mathbf{K}_p^w \le A \\forall w,$


