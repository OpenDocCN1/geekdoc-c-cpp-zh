    # #4 Conclusions


    Threshold Accepting has been successfully implemented for the parameter estimation
    of GARCH family models: GARCH(1,1), GJR-GARCH(1,1) and GARCH(p,q) with fixed number
    of lags. Furthermore, the convergence of the heuristic-based estimators towards
    their true values is proven when the number of heuristic iterations is proportional
    to the sample size. In the case of generalized GARCH models holds in lag the standard
    log-likelihood function does not allow for an effective model selection algorithm
    and has been substituted with a Bayesian Information Criterion, replacing thus
    overfitting tendency with a bias towards parsimonious solutions. It is proven
    that the standard or standardized BIC are appropriate within a heteroskedastic
    environment. Even so, Monte Carlo simulations and the evaluating the relations
    between the mean square deviations of the estimators from their true values and
    from their maximum likelihood values, on one side, and the size of observations
    and the number of heuristic iterations, on the other side, show the complexity
    of the search space, as well as the convergence difficulties. The main reason
    is that the heuristic is to find better fitted solutions (with fewer lags) than
    the original DGP seeds,'
  merge: -1
