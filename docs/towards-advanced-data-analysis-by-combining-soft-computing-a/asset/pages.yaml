- img_proc: true
  md: 'stationary data requires change detection and on-line adaptation. Different
    kinds of non-stationarity have been classified in [1]:


    +   - Changes in the data distribution: the change occurs in the data distribution
    in general. For instance, the mean or the variance of the data distribution may
    change over time.


    +   - Changes in concept: here concept change refers to changes of a target variable.
    A target is a variable whose values we try to predict based on the model estimated
    from the data, for instance, for linear regression concept drift refers to the
    change of the coefficients of the linear model which is used to predict the target
    variable. Concept change can be further distinguished in the following:


    +   Concept drift describes gradual changes of the concept. In statistics, this
    is usually called drift.

    Concept shift refers to an abrupt change which is also referred to as structural
    break.


    In the following, we do not differentiate between concept drift and shift for
    two reasons. First of all, in both cases the relation between predictor attributes
    and the target variable will be changed. Secondly, we can only observe or sample
    the data at discrete points, so it does not matter whether we interpret the change
    between two points as a continuous jump of concept shift or as a smooth transition
    between two points which we can observe or describe in detail, because we have
    data between two discrete points.


    Real world applications for non-stationary data can be found for instance in stock
    market or weather prediction, change of structures through imitation or the buying
    behaviour of customers of an online-store. Since nonstationary data models significantly
    affect the accuracy of prediction, the fact of concept drift should be taken into
    account by on-line learning. Therefore the effective treatment of non-stationarity
    is an important problem in machine learning. Thorough detection and on-line adaptation
    for data mining techniques are required for non-stationary data streams. Various
    strategies to handle non-stationarity are proposed, for instance [6] for a detailed
    survey of change detection methods. Statistical hypothesis tests may also be used
    for change detection. We are working with data streams, which can be carried out
    in an incremental way or window based techniques should be used. Hypothesis tests
    could be applied to change detection in two different ways (for detailed survey
    [12]).


    +   - Change detection through incremental computation of the tests: by this approach
    the test is computed in an incremental fashion. For instance, the $\chi^2$-test
    and the $t$-test (for precise definitions see example [10]) render themselves
    easily to incremental computations (on-line adaptation of these tests is described
    in [12]). A low p-value for the comparison of the'
