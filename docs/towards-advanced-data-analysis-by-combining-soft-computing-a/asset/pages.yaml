    +   2 University of Mons, Belgium, matei.mancas@umons.ac.be


    C. Borgelt et al. (Eds.): Towards Advanced Data Analysis, STUFUZZ 285, pp. 253-266.

    springlinker.com


    © Springer-Verlag Berlin Heidelberg 2013'
