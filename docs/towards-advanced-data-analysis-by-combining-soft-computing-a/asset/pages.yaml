    # 2 Feature Selection


    Feature selection is the process of selecting a subset of the available features
    to use in empirical modeling. A fundamental problem of feature selection is to
    determine a minimal subset of $n$ features from the complete set of features $x
    = \{f_1, f_2, \dots, f_n\}$, with $n < N$, without sacrificing accuracy. This
    means that there are $2^n$ possible subsets, which makes a brute-force approach
    infeasible in most cases. It can be said that the main goal of feature selection
    is to reduce the number of features used in classification while maintaining an
    acceptable classification accuracy. From this perspective, a feature selection
    problem can be seen as a multi-objective problem with two objectives: minimization
    of the number of features and the error rate of the classifier. In this chapter,
    a fuzzy classifier is built for each subset to evaluate the classification error.
    The solutions are evaluated using fuzzy models, as they are universal approximators
    and can be interpretable under certain conditions.


    # 2.1 Feature Selection as a Multi-objective Optimization Problem


    A multi-objective optimization problem can be mathematically formulated as (see
    [21] for a more complete treatment):


    ```

    $$\min F(x) \equiv (f_1(x), f_2(x), \dots, f_m(x))^T$\n\text{subject to} \quad
    x \in \Omega$$

    ```


    where $x$ is the vector of designs or design variables belonging to the feasible
    region $\Omega \subset \mathbb{R}^n$ and $F(x) \in \mathbb{R}^m$ is a vector of
    $m$ objective functions. The word "min" in (1) means that we want to minimize
    all objective functions simultaneously. Note that this is a general formulation,
    which exploits that maximizing an objective function $f_j$ is equivalent to minimizing
    $-f_j$.


    The solution of the problem given in (1) is a set of solutions that are called
    Pareto optimal in the general framework of multi-objective optimization. A solution
    is said to be Pareto optimal if it is not dominated by any other solution available
    in the search space $\Omega$ (see [21] for a more complete treatment).'
