  md: 'D. Dubois and D. Sánchez


    but not transitive relation, what can be reasonably expected is to obtain not
    a partition, but a covering of the set of objects, in which an object may appear
    in more than one cluster. This is also the case in the fuzzy clustering, though
    objects may appear in different clusters to a certain degree, and the result of
    the clustering process is fuzzy partition and not fuzzy covering.


    It is not the objective of this paper to discuss the notion of fuzzy partition,
    for which there is no unique definition, and how it might be different from the
    notion of fuzzy covering existing in the literature [5]. Our objective is to propose
    a new fuzzy clustering algorithm based on obtaining crisp coverings from crisp
    relations with binary and symmetry properties.


    The paper is organized as follows, we propose crisp coverings for clustering with
    crisp relations in Section 2. The procedure is extended to obtain fuzzy clusters
    as coverings in Section 3, and we study the relationship to the work by Bezdek
    and Harris [2] in Section 4. Section 5 is devoted to briefly putting forward complexity
    issues of the proposal. Finally, Section 6 contains our conclusions and ideas
    for future work.


    # 2 Coverings for Non-transitive Crisp Relations


    When the indistinguishability relation between objects is not transitive, we can
    only expect to obtain a collection of clusters that form a covering of the data.
    However, this does not mean that any covering is a good clustering of the objects
