    declaration to initialize the g_val. If one evaluation is sequenced before another
    evaluation, the first evaluation must complete before the second evaluation can
    begin. You can use sequence points to guarantee, for example, an object will be
    written before it is read as part of a separate evaluation. The execution of f
    is guaranteed to be sequenced before the execution of g because a sequence point
    exists between the evaluation of one full expression and the next full expression.
    Sequence points are discussed in detail in the following sections.


    # Unsequenced and Indeterminately Sequenced Evaluations


    The executions of unsequenced evaluations can interleave, meaning that the instructions
    can be executed in any order, provided that the execution is sequentially consistent—that
    reads and writes are performed in the order specified by the program (Lamport
    1979).


    Some evaluations are accurately sequenced, which means they cannot interleave
    but can still be executed in any order. For example, the following statement contains
    value computations and side effects:


    ```

    printf("%d\n", ++i +++ j * --k);

    ```


    The values of i, j, and k must be read before their values are incremented or
    decremented. This means the reading of i must be sequenced before the increment
    side effect, for example. Similarly, all effects for the operands of the multiplication
    operation need to complete before the multiplication can occur. Finally, the multiplication
    has to complete before the addition because of operator precedence rules, and
    all side effects must complete for the operands of the addition before it occur.
    These constraints provide a partial ordering among these operations, because they
    don''t require that j is incremented before k is decremented, for example. Unsequenced
    evaluations in this expression can be performed in any order. This allows the
    compiler to reorder operations and cache values in registers, allowing for faster
    overall execution. Function executions, on the other hand, are much sequenced
    and do not interleave with each other.'
