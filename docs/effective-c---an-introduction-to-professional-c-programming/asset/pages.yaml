    # Strings


    C doesn''t support a primitive string type and probably never will. Instead, it
    implements strings as arrays of characters. C has two types of strings: narrow
    and wide.


    A narrow string has the type array of char. It consists of a continuous sequence
    of characters that include a terminating null character. A pointer to a string
    points to its initial character. The size of a string is the number of bytes allocated
    to the backing array storage. The length of a string is the number of code units
    (bytes) preceding the first null character. In Figure 7-1, the size of the string
    is 7, and the length of the string is 5. The sizing of the backing array beyond
    the last element must not be accessed. Elements of the array that haven''t been
    initialized must not be read.'
