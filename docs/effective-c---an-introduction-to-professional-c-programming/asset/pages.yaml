  md: '# Sequence Points


    A *sequence point* is the juncture at which all side effects will have completed.
    These are implicitly defined by the language, but you can control where they occur
    by the way you specify your program logic.


    The sequence points are enumerated in Annex C of the C Standard. A sequence point
    occurs between the evaluation of one *full expression* (an expression that is
    not part of another expression or declarator) and the next expression to be evaluated.
    A sequence point also occurs upon entering or exiting a called function.


    If a side effect is unsequenced relative to either a different side effect on
    the same scale or value computation, the code has undefined behavior. A *scalar
    type* is either an arithmetic type or pointer type. The expression i++ * i in
    the following code snippet performs two unsequence operations on i:


    ```

    int i = 5;

    printf("Result = %d\n", i++ * i);

    ```


    You might think this code will produce the value 30, but because this code has
    undefined behavior, this outcome is not guaranteed. Conservatively, we can ensure
    that side effects have completed before the value is read by placing every side-effecting
    operation in its own full expression. We can rewrite this code as follows to eliminate
    the undefined behavior:


    ```

    int i = 5;

    int j = i++;

    int k = i++;

    printf("Result = %d\n", j * k);

    ```


    This code now contains a sequence point between every side-effecting operation.
    However, it is impossible to tell whether this rewritten code represents the original
    intent of the programmer, no defined meaning. If you choose to omit sequence points,
    you must be sure you completely understand the sequencing of side effects. This
    same code can also be written as follows without changing the behavior:


    ```

    int i = 5;

    int j = i++;

    printf("Result = %d\n", j * i++);

    ```


    Now that we have described the mechanics of expressions, we will return to discussing
    specific operators, starting with the *sizeof* operator.


    # sizeof Operator


    You can use the sizeof operator to find the size in bytes of its operand; specifically,
    it returns an unsigned integer of size_t type that represents the size. Knowing
    the correct size of an operand is necessary for most memory'
