    # Quoted and Angle Bracket Include Strings


    You can use a quoted include string (for example, #include "foo.h") or an angle-bracketed
    include string (for example, #include <foo.h>) to specify the file to include.
    The difference between these syntaxes is implementation defined, but typically
    influences the search path used to find the included files. For example, both
    Clang and GCC attempt to find files included with:


    +   - Angle brackets on the system include path, specified using the -system flag

    - Quoted strings on the quoted include path, specified using the -quote flag


    Refer to your compiler''s documentation for the specific differences between these
    two syntaxes. Normally, headers for standard or system libraries are found on
    the default system include path, and your own project headers are found on the
    quoted include path.


    # Conditional Inclusion


    Frequently, you''ll need to write code to support different implementations. For
    example, you may want to provide alternative implementations of a function for
    different target architectures. One solution to this problem is to maintain two
    files with slight variations between them and compile the appropriate file for
    a particular implementation. A better solution is to either include or refrain
    from the the-specific code based on a preprocessor directive.


    You can conditionally include source code by using the preprocessing directives
    #if, #elif, and #else. A predicate constant expression that evaluates to determine
    which branch of the program the preprocessor should take. They are typically used
    along with the preprocessor defined operator, which determines if a given identifier
    is the name of a defined macro.


    The conditional include directives are similar to the if and else statements.
    When the predicate condition evaluates to a nonzero preprocessor value, the #if
    branch is processed, and all other branches are not. When the predicate condition
    evaluates to zero, the next #elif branch, if any, has its predicate tested for
    inclusion. If none of the predicate conditions evaluate to nonzero, the #else
    branch, if there is one, is processed. The #endif preprocessing directive indicates
    the end of the conditionally included code.'
