  md: 'Static analysis has practical limitations, as the correctness of software is
    computationally undecidable. For example, the halting theorem states there are
    programs whose exact control flow cannot be determined statically. As a result,
    any property on control flow—such as halting—may not decidable for some programs.
    As a consequence, static analysis may fail to report flows or report flows where
    they don''t exist.


    A failure to report a false flaw in code is known as a false negative. False negatives
    are serious analysis errors, as may leave you with a false sense of security.
    Most tools err on the side of caution and, as a result, generate false positives.
    A false positive is a test that incorrectly indicates that a flaw is present.
    Tools might report high-risk flows and miss others as an unintended consequence
    of trying not to overwhelm the user with false positives. False positives can
    also occur when the code is too complex to perform a complete analysis. The use
    of function pointers and libraries can make false positives more likely.


    Ideally, tools are both complete and sound in their analysis. An analyzer is considered
    sound if it cannot issue a false-negative result. An analyzer is considered complete
    if it cannot issue false positives. The possibilities for a given rule are outlined
    in Figure 11-1.


    | False Positive | |

    |---|---|

    | Yes Incomplete and unsound | Complete and unsound |

    | False Negative No | Incomplete and sound | Complete and sound |


    Figure 11-1: Completeness and soundness


    The compilation process performs a limited amount of static analysis, providing
    diagnostics about highly localized issues in code that don''t require much reasoning.
    For example, when comparing a signed value to an unsigned value the compiler may
    issue a diagnostic about a type mismatch because it doesn''t require additional
    information to identify the error. The flags we discussed earlier, such as -W
    for C++ and -Wall for GCC and Clang, control the compiler output.


    Compilers generally provide high-quality diagnostics, and you shouldn''t ignore
    them. Always try to understand the reason for the warning and rewrite the code
    to eliminate the error, rather than simply quieting warnings by adding type casts
    or making arbitrary changes until the warning goes away. See the CERT rule MSC000-C
    (Compile all with high warning levels) for information on this topic.


    Once you''ve addressed warnings in code, you can use a separate static analyzer
    to identify additional flaws. Static analyzers will diagnose more-complex defects
    by evaluating the expressions in your program, performing in-depth control and
    data analysis, and reasoning about the possible ranges of values and control flow
    paths.'
