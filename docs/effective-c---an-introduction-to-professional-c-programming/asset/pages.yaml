    the generic components of a program so you can focus on developing logic that
    is unique to your program. For example, when writing a video game, using existing
    libraries would allow you to focus on developing the game logic, not worrying
    about the details of retrieving user input, network communications, or graphics
    rendering. Libraries can often allow a program written with one compiler to use
