  md: 'According to the TIOBE index, C has been either the most popular-programming
    language or second most popular since 2001.¹¹ C is TIOBE''s programming language
    of the year for 2019. The popularity of the pro-programming language can most
    likely be attributed to several tenets of the language referred to as the spirit
    of C:


    +   - Trust the programmer. Generally speaking, the C language assumes you know
    you''re doing and lets you. This isn''t always good thing (for example, if you
    don''t know what you''re doing).

    - Don''t prevent the programmer from doing what needs to be done. Because C is
    a system programming language, it has to be able to handle a variety of low-level
    tasks.

    - Keep the language small and simple. The language is designed to be fairly close
    to the hardware and have a small footprint.

    - Provide only one way to do an operation. Also known as conservation of mechanism,
    the C language tries to limit the introduction of duplicate mechanisms.

    - Make it, even if it isn''t guaranteed to be portable. Allowing you to write
    optimally efficient code is the top priority. The responsibility of ensuring that
    code is portable, safe, and secure is delegated to you,


    # # A Brief History of C


    The C programming language was developed in 1972 by Dennis Ritchie and Ken Thompson
    at Bell Laboratories. Brian Kernigh authored C Programming Language (K&R 1988)
    with Dennis Ritchie. In 1983, the American National Standards Institute (ANSI)
    formed the XJ committee to establish a standard C specification, and in 1989,
    the C Standard was ratified as ANSI X3.159-1989, “Programming Language C.” This
    1989 version of the language is referred to as ANSI C or C89.

    In 1990, the ANSI Standard was adopted (unchanged) by a joint committee of the
    International Organization for Standardization (ISO) and the International Electrotechnical
    Commission (IEC) and published as the first edition of the C Standard, C90 (ISO/IEC
    9889:1990). The second edition of the C Standard, C99, was published in 1999 (ISO/IEC
    9889:1999), and a third edition, C11, in 2011 (ISO/IEC 9889:2011). The latest
    version of the C Standard (as of this writing) is the fourth version, published
    in 2018 as C17 (ISO/IEC 9889:2018). A new major revision referred to C2x


