- img_proc: true
  md: 'Fragmentation occurs when memory is allocated and deallocated, resulting in
    many small blocks of memory but no remaining large blocks. As a result, larger
    allocations can fail even though the total amount of free memory is sufficient
    for the allocation. Memory allocated for the client process and memory allocated
    for internal use within the memory manager is all within the addressable memory
    space of the client process.


    # When to Use Dynamically Allocated Memory


    Dynamically allocated memory is used when the exact storage requirements for a
    program are unknown before runtime. Dynamically allocated memory is less efficient
    than statically allocated memory, because the memory manager needs to find appropriately
    sized blocks of memory in the runtime heap, and then the caller must explicitly
    free these blocks when no longer needed, all of which requires additional processing.
    By default, you should declare objects with either automatic or static storage
    for durations whose sizes are known at compilation time.


    Memory leaks occur when dynamically allocated memory''s no longer returned to
    the memory manager. If these memory leaks are severe, the memory manager will
    eventually be unable to satisfy new requests for storage. Dynamically allocated
    memory also requires processing for housekeeping operations such as defragmentation
    (the consolidation of adjacent free blocks), and the memory manager often uses
    extra storage for control structures to facilitate these processes.


    You would typically use dynamically allocated memory when the size of the storage
    isn''t known at compile time or until runtime. For example, you might use dynamically
    allocated memory to read a table from a file at runtime, especially if you don''t
    know the number of rows in the table at compile time. Similarly, you might use
    dynamically allocated memory to create linked lists, hash tables, binary trees,
    or other data structures for which the number of data elements held in each container
    is unknown at compile time.


    # Memory Management Functions


    The C Standard Library defines memory management functions for allocating and
    deallocating dynamic memory. These functions include malloc, aligned_alloc, calloc,
    and realloc. You can call the free function toallocate memory. The OpenBSD realloc
    function isn''t defined by the C Standard Library but can be reused for memory
    allocation.'
