    # Argument Checking\n\nArgument checking can be performed by either the calling\
    \ function or the called function. Redundant argument testing by both the caller\
    \ and the called is a largely discredited style of defensive programming. The\
    \ usual discipline is to provide validation only on one side of each interface.\n\
    \nThe most time-efficient approach is for the caller to perform the check, because\
    \ the caller should have a better understanding of the program state. In Listing\
    \ 7-3, we see that the arguments to strcpy are valid without introducing further\
    \ redundant tests: the variable str references a statically allocated array that\
    \ was initially initialized in the declaration, and the dest parameter is a non-null\
    \ pointer referencing dynamically allocated storage of sufficient size to hold\
    \ a copy of str, including the null character. Therefore, to call strcpy is safe,\
    \ and the copy can be performed in a time-efficient manner. This approach to argument\
    \ checking is commonly used by C Standard Library functions because it adheres\
    \ to the \"spirit of C,\" in that it's optimally efficient and trusts the programmer\
    \ to pass valid arguments."
