  md: 'You should select build flags based on what you''re trying to accomplish. Distinct
    phases of software development call for different sets of build flags:


    **Analysis** During analysis, you''re trying to get your code compiled. Dealing
    with numerous diagnostics at this stage can seem bothersome, but is much better
    than having to find these problems through debugging and testing, or not finding
    them until after the code has shipped. During the analysis phase, you should use
    compiler options to maximize diagnostics to help you eliminate as many defects
    as


    **Debugging** During debugging, you''re typically trying to figure out why your
    code isn''t working, so you should use a set of compiler flags that includes debug
    information, allows assertions to be useful, runtime instrumentation to detect
    errors, and enables a quick turnaround time for the inevitable de-compile-debug
    cycle.


    **Testing** During testing, you will want to disable debug information except
    for symbol names so that you can get good stack traces for crashes and leave assertions
    enabled. You may also want to start testing optimized builds. These settings may
    also be used in the beta version of a product to help isolate defects discovered
    during beta testing.


    **Acceptance testing/deployment** The final phase is to build the code for deployment
    to its operational environment. Before deploying the system, make sure you adequately
    test your build configuration, because using a different set of compilation flags
    can trigger new defects—for example, as the result of timing effects from running
    optimized code.


    I''ll now recommend some specific flags you want to use for your compiler and
    software development phase.


    # GCC and Clang


    Table 11-1 lists recommended compiler and linker flags for GCC and Clang


    Table 11-1: Recommended Compiler and Linker Flags for GCC and Clang

    | Flag | Purpose |

    |---|---|

    | -D_FORTIFY_SOURCE=2 | Detect runtime buffer overflows |

    | -fpie -Wl,-fpie | Needed to enable full ASLR for executables |

    | -fpic -shared | Disable text relocations for shared libraries |

    | -g3 | Generate abundant debugging information |

    | -02 | Optimize your code for speed/space efficiency |

    | -Wall | Turn on recommended compiler warnings |

    | -Error | Turn warnings into errors |'
