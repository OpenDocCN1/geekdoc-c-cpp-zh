  md: '# The Compilation Process


    Let''s first see where the preprocessor sits in the compilation process. Conceptually,
    the compilation process consists of a pipeline of eight phases, as shown in Figure
    9-1. We call these translation phases because each phase translates the code for
    the preprocessor by the next phase.


    | Character mapping | Line splicing | Tokenization | Preprocessing | Character-set
    mapping | String concatenation | Translation | Linkage |


    Figure 9-1: Translation phases


    The preprocessor runs before the source code is translated into object code by
    the translator. This allows the preprocessor to modify the source code written
    by the user before it is operated on by the translator. Consequently, the preprocessor
    has a limited amount of semantic information about the program being compiled.
    It doesn''t know about functions, variables, or types. Instead, only basic elements,
    such as header names, identifiers, literals, and punctuation characters like +,
    -, and are meaningless to the preprocessor. These basic elements, called tokens,
    are the smallest elements of a computer program that have meaning to a compiler.


    The preprocessor operates on preprocessing directives that you include in the
    source code to govern the behavior of the preprocessor. You spell preprocessing
    directives with a leading # token followed by a directive name, such as #include,
    #define, or #if. You can include whitespace between the beginning of the line
    and the # or between the # and the directive name. Terminate each preprocessing
    directive with a newline.


    A preprocessing directive causes the preprocessor to take an action that might
    alter the resulting translation unit, meaning the code you write is often not
    the code consumed by the translator. Compiler implementations provide a way to
    view the preprocessor output, called a translation unit, passed to the translator.
    Viewing the preprocessor output is unnecessary, but you may find it informative
    to see the actual code generated for the translator. Table 9-1 lists flags used
    by compilers to output a translation unit. Preprocessed output files are commonly
    given a .i extension.


    # Table 9-1: Outputting a Translation Unit


    | Compiler | Example command line |

    | Clang | clang other-options -E -o output_file.i source.c |

    | GCC | gcc other-options -E -o output_file.i source.c |

    | C++ | cl other-options /P /Fiout_file.i source.c |'
