  md: 'Generally, C programmers need not concern themselves with alignment requirements,
    because the compiler chooses suitable alignments for its types. Dynamically allocated
    memory from malloc is required to be sufficiently aligned for all standard types,
    including arrays and structures. However, on occasions, you might need to override
    the compiler''s default choices; for example, to align data on the boundaries
    of the memory cache lines that start at power-of-two boundaries, or to meet other
    system-specific requirements. Traditionally, these were met by linker commands,
    or by overallocating memory with malloc by rounding the user address upward, or
    similar operations involving other nonstandard facilities.


    C11 introduced a simple, forward-compatible mechanism for specifying alignments.
    Alignments are represented as values of the type size_t. Every valid alignment
    value is a nonnegative integral power of two. An alignment imposes a default alignment
    requirement on every object of that type: a stricter alignment (a larger power
    of two) can be requested using the alignment specifier (_Alignas). You can include
    an alignment specifier in the declaration specifiers of a declaration. Listing
    2-7 uses the alignment specifier to ensure that good_buf is properly aligned (bad_buf
    may have incorrect alignment for member-access expressions).


    ```

    struct S {

    int i; double d; char c;

    };


    void main(void) {

    unsigned char bad_buf[sizeof(struct S)];

    _Alignas(struct S) unsigned char good_buf[sizeof(struct S)];


    struct S *bad_s_ptr = (struct S *)bad_buf; // wrong pointer alignment

    struct S *good_s_ptr = (struct S*)good_buf; // correct pointer alignment

    }

    ```


    Listing 2-7: Use of the _Alignas keyword


    Alignments are ordered from weaker to stronger (also called stricter) alignments.
    Stricter alignments have larger alignment values. An address that satisfies an
    alignment requirement also satisfies any valid, weaker alignment requirement.


