  md: 'To mitigate these risks, C++ defines its own casts, which are less powerful.


    # Conditional Operator


    The conditional (?: operator is the only C operator that takes three operands.
    It returns a result based on the condition. You can use the conditional operator
    like this:


    ```

    result = condition ? valueReturnedIfTrue : valueReturnedIfFalse;

    ```


    The conditional operator evaluates the first operand, called the conditional.
    It evaluates either the second operand (valueReturnedIfTrue) if the condition
    is true, or the third operand (valueReturnedIfFalse) if the condition is false.
    The result is the value of the second or third operand (depending on which operand
    was evaluated).


    This result is converted to a common type based on third operands. It is a sequence
    point between the evaluation of the first operand and the evaluation of the second
    or third operand (whichever is evaluated) so that the compiler will ensure all
    side effects have completed before the second or third operand is evaluated.


    The conditional operator is similar to an if-else control flow block, which returns
    a value as a function does. Unlike an if-else control flow block, you can use
    the conditional operator to initialize a const-qualified object:


    ```

    int x = (a < b) ? b : a;

    ```


    The first operand to the conditional operator must have scalar type. The second
    and third operands must have compatible types (roughly speaking). For more details
    on the constraints for this operator and the specifics of determining the return
    type, refer to Section 6.5.15 of the C Standard (ISO/IEC 9899:2018).


    # _Alignof Operator


    _Alignof yields an integer constant representing the alignment requirement of
