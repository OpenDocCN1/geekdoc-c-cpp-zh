    # Instrumenting the Code


    You can instrument your code by using AddressSanitizer to compile and link your
    program with the -fsitize=address to get informative stack traces in error messages,
    add the -fno-omit-frame-pointer flag, and for symbolic debugging information,
    add the -g flag. Using cmake, you can add these flags by including the following
    line in your CMakeLists.txt file:


    ```

    $ (CMAKE_C_FLAGS "$CMAKE_C_FLAGS -g3 -fno-omit-frame-pointer -fsanitize=address")

    ```


    As previously mentioned, AddressSanitizer works with Clang, GCC, and Visual C++.
    Depending on which version of compiler you are using, you may need to define the
    following environment variables:


    ```

    ASAN_OPTIONS=-symbolize=1

    ASAN_SYMBOLIZER_PATH=/path/to/llvm_build/bin/llvm-symbolizer

    ```


