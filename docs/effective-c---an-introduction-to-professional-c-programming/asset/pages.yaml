    Libraries are linked into your application and can be either static or dynamic.
    A static library, also known as an archive, incorporates its machine or object
    code directly into the resulting executable, which means that a static library
    is often tied to a specific release of the program. Because a static library is
    incorporated at link time, the contents of the static library code can be further
    optimized for your program''s use of the library. Library code used by the program
    is available for link-time optimizations, while unused library code can be stripped
    from the final executable.


    A dynamic library, also referred to as a shared library or a dynamic shared object,
    is executable without the startup routines. It can be packaged with the executable
    or installed separately but must be available when the executable calls a function
    provided by the dynamic library. Many modern operating systems will load the dynamic
    library into memory once and share it across all the applications that need it.
    You can replace a dynamic library with different versions as necessary after your
    application has deployed. Letting the library evolve separately from the program
    comes with its own set of benefits and risks. A developer can catch bugs in the
    library after an application has shipped without requiring the application to
    be recompiled. However, dynamic libraries provide a potential opportunity for
