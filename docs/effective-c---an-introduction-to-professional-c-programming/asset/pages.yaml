    # Integer to Floating-Point Conversions


    If the value of the integer type being converted to a floating-point type can
    be represented exactly in the new type, it is unchanged. If the value being converted
    is in the range of values that can be represented but not exactly, the result
    is rounded to either the nearest higher or nearest lower representable value,
    depending on the implementation. If the value converted is outside the range of
    values that can be represented, the behavior is undefined. CERT C rule FLP36-C
    (Preserve precision when converting integral values to floating-point type) provides
    more information and examples of these conversions.


    # Floating-Point to Integer Conversions


    When a value of a floating type is converted to an integer type (other than bool),
    the fractional part is discarded. If the value of the integral part cannot be
    represented by the integer type, the behavior is undefined.


    # Floating-Point Demotions


    Converting a floating-point value to a larger floating-point type is always safe.
    Demoting a floating-point value (that is, converting to a smaller floating-point
    type) is similar to converting an integer value to a floating-point type.


    Floating-point types that conform to Annex F support infinity. Demoting values
    of floating-point types for these implementations will always succeed because
    all values are within range. See CERT C rule FLP34-C (Ensure that floating-point
    conversions are within range of the new type) for more information on floating-point
    conversions.


