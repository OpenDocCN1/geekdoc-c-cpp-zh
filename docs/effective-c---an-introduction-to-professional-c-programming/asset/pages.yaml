    # Stream Orientation


    Each stream has an orientation that indicates whether the stream contains narrow
    or wide characters. After a stream is associated with an external file, before
    any operations are performed on it, the stream doesn''t have an orientation. Once
    a wide character I/O function has been applied to a stream without orientation,
    the stream becomes a wide-oriented stream. Similarly, a byte I/O function has
    been applied to a stream without orientation, the stream becomes a byte-oriented
    stream. Multibyte character sequences or represented as an object of type char
    (that are required by the C Standard to be 1 byte) can be written to a byte-oriented
    stream.


    You can reset the orientation of a stream using the wide function by closing and
    reopening the file. Applying a byte-oriented function to a wide-oriented stream,
    or a wide-character I/O function to a byte-oriented stream, results in undefined
    behavior. You should never mix character data, wide character data, and binary
    data in the same file.


    All three predefined streams (stderr, stdin, and stdout) are unordered at program
    startup.


