    # ## Overflow


    Overflow occurs when a signed integer operation results in a value that cannot
    be represented in the resulting type. For example, the following implementation
    of a function-like macro that returns the absolute value of an integer can overflow:


    ```

    // undefined or wrong for most negative value

    #define Abs(i) ((i) < 0 ? -(i) : (i))


    ```


    We examine macros in detail in Chapter 9. For now, you can think of function-like
    macros as functions that operate on generic types. On the surface, this macro
    appears to correctly implement the absolute value function by returning the nonnegative
    value of $i$ without regard to its sign. We use the conditional $(?:)$ operator
    (which I’ll cover in more detail in the next chapter) to test whether the value
    of $i$ is negative. If so, $i$ is negated to $-(i)$; otherwise, it returns the
    unmodified value $(i)$.


    Because we implemented Abs as a function-like macro, it can take any argument
    of type. Of course, invoking this macro with an unsigned integer is pointless,
    because unsigned integers can never be negative, the macro’s output would just
    reproduce the argument. However we can invoke the function with a variety of signed
    integer and floating-point types, as in the following invocation:


    ```

    signed int si = -25;

    signed int abs_si = Abs(si);

    printf("%d\n", abs_si); // prints 25

    ```'
