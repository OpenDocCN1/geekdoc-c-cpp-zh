  md: '# GETTING STARTED WITH C


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_30_0.png)


    In this chapter, you''ll develop your first C program: the traditional “Hello,
    world!” program. I''ll take you through the various aspects of this simple program,
    as well as compiling and running a C program. Then I''ll discuss some editor and
    compiler options, and lay out common portability issues you''ll quickly become
    familiar with as you code in C.


    # Developing Your First C Program


    The best way to learn C programming is to start writing C programs, and the traditional
    program to start with is “Hello, world!”

    To write this program, you need a text editor or integrated development environment
    (IDE). There are many to choose from, but for now, open your favorite editor,
    and we''ll survey other options later in this chapter.'
