    Unlike with the if and else keywords, preprocessor conditional inclusion cannot
    use braces to denote the block of statements controlled by the predicate. Instance,
    preprocessor conditional inclusion will include all the tokens from the #if, #elif,
    or #else (following the predicate) to the next #elif, #else, or #endif found,
    while skipping any tokens in a conditional inclusion branch not taken. Conditional
    inclusion can be nested.


    You can write #if identifier as shorthand for #if defined identifier or, equivalently,
    #if defined(identifier). The parentheses around the identifier are optional. Similarly,
    you can write #ifndef identifier as shorthand for #if !defined identifier. There
    is no shorthand for #elif defined identifier or #elif !defined identifier.


