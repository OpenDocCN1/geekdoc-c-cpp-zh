    # The C Standard


    The C Standard (ISO/IEC 9899:2018) defines the language and authority on behavior.
    While the standard can be obscure to impenetrable, you need to understand it if
    you intend to write code that is portable, safe, and secure. The C Standard provides
    a substantial degree of latitude to implementations to allow them to be efficiently
    executed on various hardware platforms. Implementations is the term used by the
    C Standard to refer to compilers and is defined as follows:


    +   * A particular set of software, running in a particular translation environment
    under particular control, that performs translation of programs for, and supports
    execution of functions in, a particular execution environment.


    Because implementations have a range of behaviors, and because some of these behaviors
    are undefined, you cannot understand the language by just writing simple tests
    to examine the behavior. The behavior of the code may vary when using a different
    implementation on different platforms or the same implementation using a different
    set of flags or a different C Standard Library implementation. Code can vary between
    versions of a compiler. The C Standard is the only document that specifies which
    behaviors are guaranteed for all implementations, and where you need to plan for
    variability. This is mostly a concern when developing portable code, but can also
    affect the security and safety of your code.


