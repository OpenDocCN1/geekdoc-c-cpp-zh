- img_proc: true
  md: '# Implementation-Defined Behavior


    Implementation-defined behavior is program behavior that''s not specified by the
    C Standard and may offer different results among implementations, but has consistent,
    documented behavior within an implementation. An example of implementation-defined
    behavior is the number of bits in a byte.


    Implementation-defined behaviors are mostly harmless but can cause defects when
    porting to different implementations. Whenever possible, avoid writing code that
    depends on implementation-defined behaviors that vary among the C implementations
    you might use to compile your code. A complete list of implementation-defined
    behaviors is enumerated in Annex J.3 of the C Standard. You can document your
    dependencies on these implementation-defined behaviors by using a static_assert
    declaration, as discussed in Chapter 11. Throughout this book, I note when code
    has implementation-defined behavior.


    # Unspecified Behavior


    Unspecified behavior is program behavior for which the Standard provides two or
    more options. The Standard imposes no requirements on which option is chosen in
    any instance. Each execution of a given expression may have different results
    or produce a different value than a execution of the same expression. An example
    of unspecified behavior is function parameter storage layout, which can vary among
    function invocations within the same program. Avoid writing code that depends
    on the unspecified behaviors enumerated in Annex J.1 of the C Standard.


    # Undefined Behavior


    Undefined behavior is behavior that isn''t defined by the C Standard, or less
    circularly, "behavior, upon use of a nonportable or erroneous program construct
    or erroneous data, for which the Standard imposes no requirements.\ Examples of
