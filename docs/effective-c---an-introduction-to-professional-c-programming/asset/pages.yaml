    #define assert(ignore) ((void)0)

    ```


    The reason the macro does not expand empty is because if it did, then the code
    such as


    ```

    assert(thing1) // missing semi-colon

    assert(thing2);

    ```


    would compile in release mode but not in debug mode. The reason it expands to
    ((void)0) rather than just 0 is to prevent warnings about statements with no effect.
    The assert macro is redefined according to the current state of NDEBUG when <assert.h>
    is included.


    Use assertions to check assumptions that can be checked at compile time and runtime
    assertions to detect invalid assumptions during testing. Because assertions are
    typically disabled before deployment, using them to check for conditions that
    can come up during normal operations, is as the following:


    +   * Invalid input

    * Errors opening, reading, or writing streams

    * Out-of-memory conditions from dynamic allocation failures

    * System call errors

    * Invalid permissions


    You should instead implement these checks as normal error-checking code that''s
    always included in the executable. Assertions should only be used to validate
    preconditions, post-conditions, and invariants designed into the code (programming
    errors).


