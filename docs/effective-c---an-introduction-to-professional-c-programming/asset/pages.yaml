    listing 6-2: Initialization error


    This program allocates 16 bytes of memory by calling malloc, and then uses strncpy
    to copy the first 15 bytes of a string into the allocated memory. The programmer
    attempts to create a properly null-terminated string by copying one less than
    the size of the allocated memory. In doing, the programmer assumes that the allocated
    storage already contains a 0 value as the null byte. However, the storage could
    easily contain nonzero values, in which case the string wouldn''t be properly
    null-terminated, and the call to printf would result in undefined behavior.


    A common solution is to write a null character into the last byte of the allocated
    storage:


    ```

    strncpy(str, "123456789abcdef", 15);

    *str[15] = ''\0'';

    ```


    If the source string is less than 15 bytes, the null termination character will
    be copied, and the assignment at ❶ is unnecessary. If the source string is 15
    bytes or longer, adding this assignment will ensure that the string is properly
    null-terminated.


    # The aligned_alloc Function


    The aligned_alloc function is similar to the malloc function, except that it requires
    you to define an alignment as well as a size for the allocated object. The function
    has the following signature, where size specifies the object''s size, alignment
    specifies its alignment:


    ```

    void *aligned_alloc(size_t alignment, size_t size);

    ```


    C11 introduced the aligned_alloc function because some hardware has stricter-normal
    memory alignment requirements. Although C requires the dynamically allocated memory
    from malloc to be sufficiently aligned for all standard types, including arrays
    and structures, you might occasionally need to override the compiler''s default
    choices.


    Typically, we use the aligned_alloc function to request stricter alignment than
    the default (in other words, a larger power of two). If the value of alignment
    is not a valid alignment supported by the implementation, the function fails by
    returning a null pointer. See Chapter 2 for more information on alignment.


