    a floating-point exception and is typically tested after a selected sequence of
    operations. A signaling NaN generally raises a floating-point exception immediately
    when occurring as an arithmetic operation. Floating point exceptions are an advanced
    topic not covered here. For more information, refer to Annex F of the C Standard.


