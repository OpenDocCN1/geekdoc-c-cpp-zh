    # Microsoft


    Microsoft implements most of the C Standard Library functions, as well as parts
    of the POSIX standard. However, sometimes the Microsoft implementation of these
    APIs differs from the requirements of a given standard or has a function name
    that conflicts with an identifier reservation in another standard. In these circumstances,
    Microsoft will often prefix the function name with an underscore. For instance,
    the POSIX function strdup isn''t available on Windows, but the function _strdup
    is available and behaves the same way.


    The Visual C++ library includes the prototype implementation of the bounds-checking
    interfaces. Unfortunately, Visual C++ does not conform to C11 or TR24731-1, because
    Microsoft chose not to update its implementation based on the APIs that occurred
    during the standardization process. For example, Visual C++ does not use the _const_handler_s
    function but instead retains an older function with similar behavior but an incompatible
    signature:


    ```

    _invalid_parameter_handler_set_invalid_parameter_handler(_invalid_parameter_handler)

    ```


    Microsoft also does not define the abort_handler_s and ignore_handler_s functions
    (which was not defined by TR24731-1), or the RSIZE_MAX macro. Visual C++ also
    does not overlap source and destination sequences as runtime-constraint violations
    and instead has undefined behavior in such cases. My NCC Group "Bounds-Checking
    Interfaces: Field Experience and Future Directions" provides additional information
    on all aspects of the bounds-checked interfaces, including Microsoft''s implementation
    (Seacord 2019).


    # Summary


    In this chapter, you learned about character encodings, such as ASCII and Unicode.
    You also learned about the various data types used to represent characters in
    C language programs, such as char, int, wchar_t, and so forth. We then covered
    character conversion libraries, including C Standard Library functions, libicon,
    and Windows APIs.


    In addition to characters, you also learned about strings and the legacy functions
    and bounds-checked interfaces defined in the C Standard Library for handling strings,
    as well as some POSIX- and Microsoft-specific functions.


    In the next chapter, you''ll learn about input/output.'
