    # Character Types


    The C language defines three character types: char, signed char, and unsigned
    char. Each compiler implementation will define char to have the same alignment,
    size, representation, and behavior as either signed char or unsigned char. Regardless
    of the choice made, char is a separate type from the other two and is incompatible
    with both.


    The char type is commonly used to represent data in C language programs. In particular,
    objects of type char must be able to represent the minimum set of characters required
    in the execution environment (known as the basic execution character set), including
    upper- and lowercase letters, the ten digits, the space character, and various
    punctuation and control characters. The char type is inappropriate for integer
    data; it is safer to use signed char to represent small integer values, and unsigned
    char to represent small unsigned values.


    The basic execution character set suits the needs of many conventional data processing
    applications, but its lack of non-English letters is an obstacle to acceptance
    by international users. To address this, the C Standards specified a new, wide
    type to allow large character sets. You can represent the characters of a large
    character set as wide char_t type, which generally takes more space than a basic
    character. Typically, implementations choose 16 or 32 bits to represent a wide
    character. The C Standard Library provides functions that support both narrow
    and wide character types.


