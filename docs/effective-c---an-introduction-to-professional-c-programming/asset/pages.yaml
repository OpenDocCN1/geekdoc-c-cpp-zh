    \ (I/O) ports, and static constant volatile-qualified objects model memory-mapped\
    \ input ports such as a real-time clock.\n\nThe values stored in these objects\
    \ may change without the knowledge of the compiler. For example, every value from\
    \ a real-time clock is read, it may change, even if the value has not been written\
    \ to by the C program. Using a volatile-qualified type lets the compiler know\
    \ that the value may change, and ensures that every access to the real-time clock\
    \ occurs (otherwise, an access to the real-time clock may be optimized away or\
    \ replaced by a previously read and cached value). In the following code, the\
    \ compiler must generate instructions to read the value from port and then write\
    \ this value back to port:\n\n```\nvolatile int port;\nport;\n```\n\nWithout the\
    \ volatile qualification, the compiler would see this as a no-op (a programming\
    \ statement that does nothing) and potentially eliminate both the read and the\
    \ write.\nAlso, volatile-qualified types are used for communications with signal\
    \ handlers and setjmp/longjmp (refer to the C Standard for information on signal\
