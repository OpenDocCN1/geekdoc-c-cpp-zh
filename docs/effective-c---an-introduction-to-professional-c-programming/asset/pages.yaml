  md: '# FOREWORD

    BY PASCAL CUOQ


    The first time I came across Robert Seacord’s name was in 2008. Robert was already
    well known in the C programming galaxy for his work on the CERT C Coding Standard
    and Annex K of the C Standard. But in 2008, it had been only a few years since—young
    and foolish—I had embarked on the Frama-C project to guarantee the absence of
    undefined behavior in C programs. At some point, a CERT Vulnerability Note about
    how C compilers (and GCC in particular) removed certain pointer-arithmetic overflow
    checks, piqued my interest. The compilers had reason to eliminate the checks:
    naively written, they invoked undefined behavior when the overflow was present.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The compilers were also allowed to tell the programmer nothing about what they
    had done, even at the maximum warning level. Undefined behavior in C can be harsh.
    I had set out to solve this exact problem. Robert was one of the authors of that
    note.


    Effective C will teach you C programming for the modern era. It will help you
    establish good habits to keep you from using undefined behavior, whether voluntarily
    or through negligence. Let the reader be warned: in large C programs, avoiding
    ordinary programming errors alone may not suffice for dodging undefined behavior
    caused by arbitrary inputs!


    This book''s emphasis on the security aspects of C programming is unmatched. My
    personal recommendation is that, after reading it, you use all of the available
    tools it presents to avoid undefined behavior in the C programs you write.


    Pascal Cuoco

    Chief Scientist, TrustInSoft'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# FOREWORD

    BY OLLIE WHITEHOUSE


    When I started in cyber security over 25 years ago, I learned my trade primarily
    by finding and exploiting unsafe handling in C programs—a class of vulnerability
    that, even at the time, was over 20 years old. In my career at BlackBerry, as
    I waded through torrents of code review, I saw firsthand how dangerous C could
    be to the improperly initiated. Now, as a CTO of a multinational security professional
    and managed services firm, I see the consequences of poorly written C code on
    our connected society every day.


    Today we still face numerous challenges in writing secure and professional C.
    The many innovations in compiler- and operating system-level mitigations can be
    and are regularly undermined. And even while we see'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'advanced innovations in other modern languages, there is still a growing demand
    for C, particularly in IoT or other highly resource constrained environments.


    Robert is the authority on how to program professionally and securely in C. For
    over a decade, I have recommended his material to customers and internal teams
    alike. There is no better person to teach how to code C in a professional and,
    among other things, secure manner.


    Writing professional C today means writing code that is performant, safe, and
    secure. By doing so, you will be able to contribute to our connected society without
    increasing its technical debt.


    This book will help those with little or no C experience quickly develop the knowledge
    and skills to become professional C programmers and will provide a strong foundation
    for developing systems that are performant, safe, and secure.


    Ollie Whitehouse


    Global CTO, NCC Group'
  merge: -1
  pgno: 21
