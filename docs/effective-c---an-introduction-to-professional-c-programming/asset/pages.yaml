    the required number of bytes to allocate. Historically, some implementations failed
    to validate that these values wouldn''t overflow when multiplied. Modern implementations
    of calloc perform this and return a null pointer if the product cannot be represented
    in size_t.


    # The realloc Function


    The realloc function increases or decreases the size of previously allocated storage.
    It takes a pointer to some memory allocated by an earlier call to aligned alloc,
    malloc, calloc, or realloc (or a null pointer) and a size, and has the following
    signature:


    ```

    void *realloc(void *ptr, size_t size);

    ```


    You can use the realloc function to grow or (less commonly) shrink the size of
    an array.


    # Avoiding Memory Leaks


    To avoid bugs when you use realloc, you should understand how the function is
    (conceptually) implemented. The realloc function calls the malloc function to
    allocate new storage, and then copies the contents of the old storage to the new
    storage to the minimum of the old and new sizes. If the newly allocated storage
    is larger than the old contents, realloc leaves the additional storage uninitialized.
    If realloc succeeds in allocating the new object, it calls free to deallocate
    the old object. If the allocation fails, the realloc function retains the old
    object data at the same address and returns a null pointer. A call to realloc
    can fail, for example, when insufficient memory is available to allocate the requested
    number of bytes.


    ```

    size += 50;

    if ((p = realloc(p, size)) == NULL) return NULL;

    ```'
