  md: '# 8


    # INPUT/OUTPUT


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_176_0.png)


    This chapter will teach you how to perform input/output (I/O) operations to read
    data from, or write data to, terminals and filesystems. I/O involves all the ways
    information enters or exits a program, without which your programs would be useless.
    We''ll cover techniques that use C Standard streams and POSIX file descriptors.
    We''ll start by discussing C Standard text and binary streams. We''ll then cover
    different ways of opening and closing files using C Standard Library and POSIX
    functions.


    Next we will discuss reading and writing characters and lines, reading and writing
    formatted text, and reading to and from binary streams. We''ll also cover stream
    buffering, stream orientation, and file positioning.


    Many other devices and I/O interfaces (such as ioctl) are available but are not
    discussed in this chapter.'
