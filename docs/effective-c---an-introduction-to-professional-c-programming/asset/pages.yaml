    # Linkage


    Linkage is a process that controls whether an interface is public or private and
    determines whether any identifiers refer to the same entity. C provides three
    kinds of linkage: external, internal, or none. When a declaration has external
    linkage, identifiers referring to all refer to the same entity (such as a function
    or an object) everywhere in the program. When a declaration has internal linkage,
    identifiers referring to the same entity only within the translation unit containing
    the declaration. If two translation units both refer to the same internal linkage
    identifier, they refer to different instances of the entity. A declaration has
    no linkage, it is a unique entity in each translation unit.


    The linkage of a declaration is either explicitly declared or implicitly implied.
    If you declare an entity at file scope without explicitly specifying external
    or static, the entity is implicitly given external linkage. Identifiers that have
    no linkage include function parameters, block scope identifiers without an external
    storage class specifier, or enumeration constants.


    List 10-1 shows examples of declarations of each kind of linkage.


    ```

    static int i; // i is declared with explicit internal linkage.

    void foo(int j) {

    // foo is declared with explicit external linkage.

    // j has no linkage because it is a parameter.

    }

    ```


    List 10-1: Examples of external, internal, and no linkage


    If you declare an identifier with the static storage class specifier at file scope,
    it has internal linkage. The static keyword gives internal linkage only to file
    entities. Declaring a variable at block scope creates an identifier with no linkage,
    but it does give the variable storage duration. As a reminder, static storage
    duration means its lifetime is only once, prior to program startup. The different
    meanings of static when used in different contexts is obviously confusing and
    confusing common interview question.


    You can create an identifier with external linkage by declaring it with the external
    storage class specifier. This works only if you haven''t previously declared the
    linkage for that identifier. The external storage class specifier has no effect
    if a prior declaration gave the identifier linkage.


    Declarations with conflicting linkage can lead to undefined behavior; see C rule
    DCL36-C (Do not declare an identifier with conflicting linkage classifications)
    for more information.


