    The void type is a strange type. The keyword void (by itself) means "cannot hold
    any value." For example, you can use it to indicate that a function does not return
    a value, or as the sole parameter of a function to indicate that the function
    takes no arguments. On the other hand, the derived type void * means that the
    pointer can reference any object. I discuss derived types in this chapter.


