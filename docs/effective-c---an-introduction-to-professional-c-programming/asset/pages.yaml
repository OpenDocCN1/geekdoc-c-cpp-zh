    # Characters


    The characters that people use to communicate aren''t naturally understood by
    digital systems, which operate on bits. To process characters, digital systems
    use character encodings assign unique integer values, referred to as code points,
    to designate specific characters. As you''ll see, there are multiple ways to encode
    the same notion character in your program. Common standards used by C implementations
    for encoding characters include Unicode, ASCII, Extended ASCII, ISO 8859-1, Shift-JIS,
    and EBCDIC.⁹


    # ASCII


    The 7-bit ASCII Standard for Information Interchange, specifies a set of 128 characters
    and their coded representation (ASCII X3.4-1986). Characters up to 0x1F are control
    characters, such as null, backspace, and horizontal tab. Characters from 0x20
    through 0x7E are all printable characters such as letters, digits, and symbols.


    We often refer to this with the updated name US-ASCII to clarify that this system
    was developed in the United States and focuses on the typographical symbols predominantly
    used in this country. Modern era character encoding schemes are based on US-ASCII,
    although they support additional characters.


    Characters in the 0x80-0xFF range are not defined by ASCII but are part of the
    8-bit character encoding known as Extended ASCII. Numerous encodings for these
    ranges exist, and the actual mapping depends on the code page. A code page is
    a character encoding that maps a set of printable characters and control characters
    to unique numbers.


    # Unicode


    Unicode has the universal character encoding for representing text in computer
    processing. It supports a much wider range of characters than ASCII does; the
    current Unicode Standard (Unicode 2020) encodes characters in the range U+0000
    to U+FFFF, which amounts to a 21-bit code space. An individual Unicode value is
    expressed as U followed by four or more hexadecimal digits in printed text. The
    Unicode characters U+0000 to U+007F are identical to US-ASCII, and the range U+0080
    to U+0FF is identical to ISO-8859-1 (Latin-1), consisting of characters from the
    Latin script used throughout the Americas, Western Europe, Oceania, and much of
    Africa.


    +   9. Unicode and ASCII are explicitly referenced by the C. Standard.'
