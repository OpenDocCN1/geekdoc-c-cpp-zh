    # String-Handling Functions


    Several approaches can be used to manage strings in C, the first of which are
    the C Standard Library functions. Narrow string-handling functions are defined
    in the `<string.h>` header file, and wide string-handling functions in `<wchar.h>`.
    These legacy string-handling functions have been associated in recent years with
    security vulnerabilities. This is because they don''t check the size of the array
    (frequently lacking the information needed to perform such checks) and trust you
    to provide adequately sized character arrays to hold the output. While it is possible
    to write safe, robust, error-free code using these functions, the library promotes
    programming styles that can result in buffer overflows if a size is too large
    for the provided array. These functions are inherently insecure and are prone
    to misuse and need to be used carefully (or not at all).


    As a result, C11 introduced the normative (but optional) Annex K bounds-checking
    interfaces. This annex provides alternative library functions to promote safety,
    more secure programming by requiring you to provide the length of output buffers,
    for example, and validating that these buffers are adequately sized to contain
    the output of these functions. For instance, Annex K defines the `strcpy_s`, `strcat_s`,
    `strncpy_s`, and `strncat_s` as class replacements for the C Standard Library''s
    `strcpy`, `strcat`, and `strncat` functions.


    POSIX also provides several string-handling functions, such as `strdup` and `strndup`,
    which provide another set of string APIs you can use on POSIX-compliant platforms
    such as Linux and Unix (IEEE Std 1003.1:2018).


    Visual C++ provides all the string-handling functions defined by the C Standard
    Library by C99 but doesn''t implement the full POSIX specification.¹⁰ Visual C++
    has many of its library functions with a leading underscore; for example, `_strdup`
    instead of `strdup`. Visual C++ also supports many of the safe string-handling
    functions from Annex K and will diagnose use of an unsafe variant, unless you
    define `_CRT_SECURE_NO_WARNINGS` prior to including the header file that declares
    the function.


    We''ll discuss each of these string-handling libraries in the subsequent sections.


