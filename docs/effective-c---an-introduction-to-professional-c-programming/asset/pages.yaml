  md: '# # 6

    # DYNAMICALLY ALLOCATED MEMORY


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_128_0.png)


    In Chapter 2, you learned that every object has a storage duration that determines
    its lifetime, and that C defines four storage durations: static, automatic, and
    allocated. In this chapter, you''ll learn about dynamically allocated memory,
    which is allocated from the heap at runtime. Dynamically allocated memory is useful
    when the exact storage requirements for a program are unknown before runtime.


    We''ll first describe the differences between allocated, static, and automatic
    storage duration. As this involves parallel execution, which we don''t cover here.
    We''ll then explore the functions you can use to allocate and deallocate dynamic
    memory, memory allocation errors, and strategies for avoiding them. The terms
    memory and storage are used interchangeably in this chapter, in similar fashion
    to the way they''re used in practice.'
