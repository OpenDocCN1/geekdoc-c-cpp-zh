  md: '# Listing 5-13: Breaking out of a loop


    Because continue and break bypass part of a loop body, you should use these statements
    carefully: the code following these statements is not executed.


    # The return Statement


    A return statement terminates execution of the current function and returns control
    to its caller. You''ve already seen many examples of return statements in this
    book. A function may have 0 or more return statements.


    A return statement can simply return, or it can return an expression. Within a
    void function (a function that doesn''t return a value), the return statement
    should simply return. When a function returns a value, the return statement should
    return an expression that produces a value of the return type. If a return statement
    with an expression is executed, the value of the expression is returned to the
    caller as the value of the function call


    ```

    int sum(int x, int y, int z) {

    return x + y + z;

    }

    ```


    This function sums its parameters and returns the sum. The return expression x
    + y + 2 produces a value of type int, which matches the return type of the function.
    If this expression produced a different type, it would be implicitly converted
    to an object having the return type of the function. The return expression can
    be as simple as returning 0 or 1. The function result may then be used in an expression
    or assigned to a variable.


    Aware that control reaches the closing brace of a non-void function (a function
    declared to return a value) without evaluating a return statement with an expression,
    using the return value of the function call is undefined behavior. For example,
    the following function fails to return a value when a is nonnegative, because
    the condition a < 0 is false:


    ```

    int absolute_value(int a) {

    if (a < 0) {

    return -a;

    }\}

    ```


    We can easily repair this defect by providing a return value when a is nonnegative,
    as shown in Listing 5-14.'
