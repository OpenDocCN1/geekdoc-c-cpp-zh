    # ## CONTROL FLOW


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_110_0.png)


    In this chapter, you''ll learn how to control the order in which individual statements
    are evaluated. We''ll start by going over expression statements and compound statements
    that define the work to be performed. We''ll then cover three kinds of statements
    that determine which code blocks are executed, and in what order: selection, iteration,
    and jump statements.


    # ## Expression Statements


    An expression statement is an optional expression terminated by a semicolon. It
    is one of the most common kinds of statements and a basic unit of work. Listing
    5-1 shows examples of expression statements.'
