    formats that assign each Unicode scalar value to a unique code unit sequence.
    A Unicode point may except high-surrogate and low-surrogate code points. A code
    unit is the minimal combination that can represent encoded text for processing
    or interchange. The Unicode Standard defines three UTFs to allow for code units
    of various sizes:


