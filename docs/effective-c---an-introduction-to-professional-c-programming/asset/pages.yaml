    # Scope


    Objects, functions, macros, and other C language identifiers have scope that delimits
    the contiguous region where they can be accessed. C has four types of scope: file,
    block, function prototype, and function.


    The scope of an object or function is determined by where it is declared. If the
    declaration is outside any block or parameter list, the identifier has file scope,
    the meaning is the text file in which it appears as well as any files included
    after that point.


    If the declaration appears inside a block or within the list of parameters, it
    has block scope, meaning that the identifier is accessible only within the block.
    The identifiers for a and b from Listing 2-4 have block scope and can be used
    to refer to only these variables within the code in the main function where they''re
    defined.


    If the declaration appears within the list of parameter declarations in a function
    prototype (not part of a function definition), the identifier has function prototype
    scope, which terminates at the end of the function declaration. Function scope
    is the area between the opening { of a function definition and its closing }.
    A label is the only kind of identifier that has function scope. Labels are identifiers
    followed by a colon and identify a statement in a function to which control can
    be transferred. Chapter 5 covers labels and control transfer.


    Scopes can be nested, with inner and outer scopes. For example, you can have a
    block scope inside another block scope, and every block scope is defined within
    a file scope. The inner scope accesses the outer scope, but not vice versa. As
    the name implies, any inner scope must be completely contained within the outer
    scopes that encompass it.


    If you declare the same identifier in both the inner and outer scope, the identifier
    declared in the outer scope is hidden the identifier within the inner scope, which
    takes precedence. In this case, naming the identifier will refer to the object
    in the inner scope; the object from the outer scope is hidden and cannot be referenced
    by it. The easiest way to prevent this from becoming a problem is to use different
    names.'
