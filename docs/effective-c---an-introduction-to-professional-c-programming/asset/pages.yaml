  md: 'the file position indicator determines the file position for the subsequent
    I/O operation. For a binary stream, we set the new position by adding the offset
    (measured in bytes) to the position specified by the first argument (the beginning
    of the file, as indicated by SEEK_SET). The first signal is 0 in the file, and
    each subsequent signal is an integer multiple of the size of the structure from
    the beginning of the file.


    After the file position indicator is positioned at the start of the second call,
    we call the fread function to read from the binary stream into the structure referenced
    by &sigrec. Similar to write, the fread function reads up to one element, whose
    size is specified by size, from the stream pointed to fp. In many cases, this
    has the size and type of the corresponding call to write. The file position indicator
    for the stream is advanced by the number of characters successfully read. We check
    the return value from the fread to ensure the correct number of elements was read.


    Binary files can have different formats. In particular, the order of bytes within
    a binary representation, or endianness, can vary between systems. A big-endian
    ordering places the most significant byte and the least significant byte last,
    while a little-endian ordering does the opposite. For example, consider the unsigned
    hexadecimal number 0x1234, which requires two bytes to represent. In a big-endian
    ordering, these bytes are 0x12, 0x34, while in a little-endian ordering, the bytes
    are arranged Intel and AMD processors use the little-endian format, while the
    ARM and POWER processors can switch between either little- or big-endian format.
    However, big-endianness is the dominant ordering in network protocols as IP, TCP,
    and UDP. Endianness is a problem when a binary file is created on one computer
    and read on another computer with different endianness. Endianness independence
    in binary data formats can be achieved by always storing the data in one fixed
    endianness, or including a field in the binary file to indicate the endianness
    of the data.


