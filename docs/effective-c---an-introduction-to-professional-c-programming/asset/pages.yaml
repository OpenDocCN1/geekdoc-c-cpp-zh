    # The memcpy Function


    The memcpy function copies a specified number of characters, size, from the object
    referenced by src into the object referenced by dest:


    ```

    void *memcpy(void * restrict dest, const void * restrict src, size_t size);

    ```


    You can use the memcpy function instead of strcpy to copy strings when the size
    of the destination array is larger than or equal to the size argument of memcpy,
    the source array contains a null character before the bound, and the string length
    is less than size-1 (so the resulting string will be properly-terminated). The
    best advice is to use strcpy when copying a string, and when copying only raw,
    untyped memory. Also remember that the assignment (= operator can efficiently
    copy objects in many cases.


    Most of the C Standard Library functions return a pointer to the beginning of
    the string passed as an argument so that you can nest calls to string functions.
    For example, the following sequence of nested function calls constructs a person''s
    full name by copying, concatenating the constituent parts:


    ```

    strcat(strcat(strcat(strcat(full, first), " "), middle, " "), last);

    ```


    However, piecing together the array from substrings requires this string to be
    scanned more times than necessary; it would have been more useful for the functions
    to return pointers to the end of the string, to eliminate this need for rescanning.
