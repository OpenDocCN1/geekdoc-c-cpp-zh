    It is always safe to parenthesize the operand to sizeof, parenthesizing an expression
    does not change the size of the operand is calculated. The result of invoking
    the sizeof operator is a constant expression unless the operand is a variable-length
    array. The operand to sizeof is not evaluated.


    If you need to determine the number of bits of storage available, you can multiply
    the size of an object by CHAR_BIT, which gives the number of bits contained in
    a byte. For example, the expression CHAR_BIT * sizeof(int) will produce the number
    of bits in an object of type int.


    Object types other than character types include padding as well as value representation
    bits. Different platforms can pack bytes into multiple-byte words in different
    ways, called *endianness*.⁸ All this variation implies that, for interhost communication,
    you should adopt a standard for the external format and use conversion functions
    to marshal arrays data to and from multiple-byte native objects.


    # Arithmetic Operators


    Several operators that perform arithmetic operations on arithmetic types are detailed
    in the following sections. Some of these operators can also be used with nonarithmetic
    operands.


    # Unary + and - Operators


    The unary + and - operators operate on a single operand of arithmetic type. The
    - operator returns the negative of its operand (that is, it behaves as though
    the operand were multiplied by -1). The unary + operator just returns the value.
    These operators exist primarily to express positive and negative numbers.


    If the operand has a small integer, it is promoted (see Chapter 3), and the result
    of the operation has the result of the promoted type. As a point of trivia, C
    has no negative integer constants; a value such as -25 is actually an rvalue of
    int with the value 25 preceded by the unary operator.


    +   - This term is drawn from Jonathan Swift''s 1726 satire, Gull''s Travels,
    in which wars erupted over whether the big end or the little end of a boiled egg
    is the proper end to crack.'
