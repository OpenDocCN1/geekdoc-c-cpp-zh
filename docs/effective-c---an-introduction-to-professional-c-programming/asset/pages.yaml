    # -O Optimization


    The uppercase letter -O flags compiler optimization. Most optimizations are disabled
    at -00 or if an -O level is not set on the command line. The compiler attempts
    to speed compilation and simplify debugging. The -g level optimizes the code for
    debugging, pressing many optimization passes, and is a better choice than -00
    for producing debugable code.


    When you''re ready to deploy your application or submit it for acceptance, you''ll
    want to optimize your code. Turning on optimization instructs the compiler to
    improve the performance or code size at the expense of compilation time and your
    ability to build the program. The -O2 level performs almost all optimizations
    that don''t involve a space-speed trade-off and is generally recommended for production-level
    code. The -O2 level or higher is also required by FORTIFY_SOURCE. There is also
    an -O3 optimization that may increase the speed of running executable, but can
    also increase its size.


    Initially compiling your code (for example, during the analysis phase), you may
    want to use the -O2 flag to enable diagnostics that are only performed for optimized
    builds when building with GCC. Do not enable sanitization (discussed in "AddressSanitizer"
    on page 217) during analysis because the inserted runtime instrumentation can
    cause false positives.


    - -O1 level performs fast optimizations that don''t significantly build times,
    which might be useful for testing.


    # -g Debugging


    The -g flag produces debugging information in the operating system''s native format.
    You can specify how much information to produce by setting the debug level. The
    default level is -g2. Level 3 (-g3) includes extra information, such as all the
    macro definitions present in the program. Level 3 also allows you to expand macros
    in debuggers that support the capability.


    # -Wall Warnings


    The -Wall flag enables a useful set of warning flags, but not all of them. You
    can also specify -Wextra to enable additional warnings not enabled by -Wall.


    # -Werror Errors


    The -Werror flag turns all warnings into errors, requiring you to address them
    before you can begin debugging. This flag encourages good programming discipline.'
