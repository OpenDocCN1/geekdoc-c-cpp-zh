  md: "# CODE STYLE\n\nCompeting coding styles disagree on when and where to place\
    \ braces. If you're modifying existing code, it would be wise to follow the style\
    \ already in use for the project. Otherwise, take a look at styles you see in\
    \ code written by experienced C programmers and choose one that seems clear. For\
    \ example, programmers line up the opening and closing braces to make it easy\
    \ to find the mate for a given brace. Others follow the style used in The C Programming\
    \ Language by Brian Kernighan and Dennis Ritchie (1988), wherein opening brace\
    \ is placed at the end of the preceding line, and the closing brace gets a line\
    \ to itself. Once you have chosen a style, use it consistently.\n\n# Selection\
    \ Statements\n\nSelection statements allow you to conditionally execute a substatement\
    \ based on the value of a controlling expression. The controlling expression determines\
    \ which statements are executed based on a condition. This allows you to write\
    \ code to produce different output based on different inputs. Selection statements\
    \ include the if statement and the switch statement.\n\n# The if Statement\n\n\
    The if statement allows a programmer to execute a substatement based on the value\
    \ of a controlling expression of scalar type.\n\nThere are two kinds of if statements.\
    \ The first conditionally determines whether the statement is executed:\n\n```\n\
    if (expression)\nsubstatement\n```\n\nIn this case, subatement is executed if\
    \ expression is not equal to 0. Only the single statement of the if is conditionally\
    \ executed, though it can be a compound statement.\n\nListing 5-2 shows a division\
    \ function that uses if statements. It divides a dividend by a specified divisor\
    \ and returns the result in the object referenced by quotient. The function tests\
    \ for both division by zero and signed integer overflow, and returns false in\
    \ either case.\n\n```\nbool safdiv(int dividend, int divisor, int *quotient) {\n\
    \  if (!quotient) return false;\n  if ((divisor == 0) || ((dividend == INT_MIN)\
    \ && (divisor == -1)) {\n    return false;\n  }\n  *quotient = dividend / divisor;\n\
    \  return true;\n}\n```\n\nListing 5-2: Safe division function"
