  md: '# Complement Operator


    The unary complement (~) operator works on a single operand of integer type and
    returns the bitwise complement of its operand; that is, a value in which each
    bit of the original value is flipped. The complement operator is used in applying
    the POSIX umask, for example. A file permission mode is the result of a logical
    AND operation between the complement of the mask and the process''s requested
    permission mode setting. Integer promotions are performed on the operand, and
    result has the promoted type. For example, the following code snippet applies
    the ~ operator to a value of unsigned char:


    ```

    unsigned char uc = UCHAR_MAX; // 0xFF

    int i = ~uc;

    ```


    On an architecture with 8-bit char and 32-bit int, uc is assigned the value 0xFF.
    When uc is used as the operand to the ~ operator, uc is promoted to signed int
    by zero-extending it to 32 bits, 0x000000FF. The complement of this value is 0xFFFF00.
    Therefore, on this platform, complementing an unsigned short type always results
    in a negative value of signed int. As a general policy and to avoid surprises
    such as this, all bitwise manipulations should involve a single, sufficiently
    wide unsigned integer type.


    # Shift Operators


    Shift operations shift each bit of an operand of integer type by a specified number
    of positions. Shifting is commonly performed in system programming, where bit
    masks are common. They may also be used in code that manages network protocols
    or file formats to pack or unpack data. They include left-shift operations, of
    the form:


    ```

    shift-expression << additive-expression

    ```


    and right-shift operations, of the form:


    ```

    shift-expression >> additive-expression

    ```


    The shift expression is the value to be shifted, and the additive expression is
    the number of bits by which to shift the value. Figure 4-1 illustrates a logical
    left shift of 1 bit.


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_99_0.png)


    Figure 4-1: Logical left shift of 1 bit


    The additive expression determines the number of bits by which to shift the value.
    For example, the result of E1 << E2 is the value of E1 left-shifted E2 positions;
    vacated bits are filled with zeros. If E1 has an unsigned type,'
