    # Summary


    In this chapter, you learned about working with memory that has allocated duration,
    and how this differs from objects of either static or static duration. We described
    the heap and memory managers and each of the standard memory management functions.
    We identified some common causes of errors when using dynamic memory, such as
    leaks, double-free vulnerabilities, and some mitigations to help avoid these problems.


    We also covered more specialized memory allocation topics as flexible array members,
    the alloca function, and variable-length arrays. We concluded the chapter with
    a discussion of debugging allocated storage problems by using the dalloc library.


