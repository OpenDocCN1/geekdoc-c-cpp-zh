  md: 'You cannot choose which representation to use; that is determined by the implementers
    of C for the various systems. Though all three are still in use, two''s complement
    is by far the most common representation—so much that the C Standards committee
    intends, starting with C2x, to accommodate only only two''s-complement representation.
    The remainder of this book assumes two''s-complement representation.


    Signed integer types with a width of N can represent any integer value in the
    range of $-2^{N-1}$ to $2^{N-1}-1$. This means, for example, an 8-bit value of
    signed char has a range of -128 to 127. Two''s complement can represent an additional
    *negative* value. The most negative value for an 8-bit signed char is -128, and
    its absolute value |-128| cannot be represented as this type. This leads to some
    interesting edge cases, which we will examine later in this chapter and the next.


    Table 3-3 shows the constant expressions from ``<limits.h>`` for each signed type,
    the minimum range required by the standard, and the actual range on x86 implementations.


    Table 3-3: Signed Integer Ranges


    | Constant expression | Minimum magnitudes | x86 | Type |

    |---|---|---||}{

    | SCHAR_MIN | -127 // (-2^7 - 1) | -128 | signed char |

    | SCHAR_MAX | +127 // 2^7 - 1 | Same | signed char |

    | SHRT_MIN | -32767 // (-2^15 - 1) | -32,768 | short int |

    | SHRT_MAX | +32767 // 2^15 - 1 | Same | short int |

    | INT_MIN | -2147483648 // (-2^31 - 1) | -2,147,483,648 | int |

    | INT_MAX | +2147483647 // 2^31 - 1 | +2,147,483,647 | int |

    | LONG_MIN | -2147483648 // (-2^31 - 1) | -2,147,483,648 | long int |

    | LONG_MAX | +2147483647 // 2^31 - 1 | Same | long int |

    | LLONG_MIN | -9223372036854775808 // (-2^63 - 1) | -9,223,372,036,854,775,808
    | long long int |

    | LLONG_MAX | +9223372036854775807 // 2^63 - 1 | Same | long long int |


    The two''s complement representation for signed values includes a sign bit and
    other value bits. The sign bit is given the weight $-(2^{N-1})$. To negate a value
    in two''s-complement representation, simply toggle each padding bit and add 1
    (with carries as necessary), as shown in Figure 3-1.


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_70_0.png)


    Figure 3-1: Negating an 8-bit value in two''s complement representation'
