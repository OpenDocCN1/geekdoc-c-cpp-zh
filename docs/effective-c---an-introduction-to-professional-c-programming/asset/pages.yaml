    The unlink function has better-defined semantics because it''s specific to POSIX
    filesystems. POSIX also uses rename for renaming. In POSIX and Windows, we can
    have any number of links to a file, including hard links and open file descriptors.
    The unlink function always removes the entry for the file, but it deletes the
    actual file only when there are no more links to it. Even at this point, the actual
    contents of the file may remain in permanent storage.


    The remove function behaves the same as the unlink function on POSIX systems but
    may have different behavior on operating systems.


