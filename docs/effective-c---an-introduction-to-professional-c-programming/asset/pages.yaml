  md: '# The POSIX open Function


    On POSIX systems, the open function (IEEE Std 1003.1:2018) establishes the connection
    between a file identified by path and a value called a file descriptor.


    ```

    int open(const char *path, int oflag, ...);

    ```


    The file descriptor is a non-negative integer that refers to the structure representing
    the file (called the open file description). The file descriptor returned by the
    open function is the smallest integer not returned by a prior call to open or
    pass to close and is unique to the calling process. The file descriptor is used
    by I/O functions to refer to that file. The open function sets the file offset
    to match the current position within the file to the beginning of the file.


    The value of the oflag parameter sets the file description''s access modes, which
    specifies whether the file is being opened for reading, writing, or both. Values
    for oflag are constructed by a bitwise-OR of a file access mode and any combination
    of access flags. Applications must specify one of the following file access modes
    in the value of oflag:


    +   - O_EXEC Open for execute only (nirectory files)

    - O_RDONLY Open for reading only

    - O_RDWR Open for reading and writing

    - O_SEARCH Open directory for search only

    - O_WRONLY Open for writing only


    The value of the oflag parameter also sets the file status flags, which control
    the behavior of the open function and affect how file operations are performed.
    These flags include the following:


    +   - O_APPEND Sets the offset to the end of the file prior to each

    - O_TRUNC Truncates the length to 0

    - O_CREAT Creates a file

    - O_EXCL Causes the open to fail if 0_CREAT is also set and the file exists


    The open function takes a variable number of arguments. The value of the argument
    following oflag specifies the file-bits (the file permissions when you create
    a new file) and is of type mode_t.\Listing 8-1 shows an example of using the open
    function to open a file for writing by its owner.


    ```

    #include <fcntl.h>

    #include <sys/stat.h>

    #include <stdio.h>

    #include <stdlib.h>

    //...

    int fd;

    mode_t mode = S_IRUSR | S_IWUSR | S_IRGRP | S_IROTH;

    const char *pathname = "/tmp/file";

    ```'
