  md: '# Type Qualifiers


    All the types examined so far have been unqualified types. Types can be qualified
    by using one or more of the qualifiers: const, volatile, and restrict. Each of
    these qualifiers changes behaviors when accessing objects of the qualified type.


    The qualified and unqualified versions of types can be used interchangeably as
    arguments to functions, return values from functions, and members of unions.


    NOTE The_Atomic type qualifier, available since C11, supports concurrent programs.


    # const


    Objects declared with the const qualifier (const-qualified types) are not modifiable.
    In particular, they''re not assignable but can have constant initializers. This
    means objects with const-qualified types can be placed in read-only memory by
    the compiler, and any attempt to write to them will result in a runtime error:


    ```

    const int i = 1; // const-qualified int

    i = 2; // error: i is const-qualified

    ```


    It''s possible to accidentally convince your compiler to change a const-qualified
    object for you. In the following example, we take the address of a const-qualified
    object and tell the compiler that this is actually a pointer to an int:


    ```

    const int i = 1; // object of const-qualified type

    *ip = (int *)&i;

    *ip = 2; // undefined behavior

    ```


    C does not allow you to cast the const if the original was declared as a const-qualified
    object. This code might appear to work, but it''s defective and may fail. For
    example, the compiler might place the const-qualified object in read-only memory,
    causing a memory fault when trying to store a value in it at runtime.


    C allows you to modify an object that is pointed to by a const-qualified pointer
    by casting the const away, provided that the original object was declared const:


    ```

    int i = 12;

    const int j = 12;

    const int *ip = &i;

    const int *jp = &j;

    *(int *)ip = 42; // ok

    *(int *)jp = 42; // undefined behavior

    ```


    32 Chapter 2'
