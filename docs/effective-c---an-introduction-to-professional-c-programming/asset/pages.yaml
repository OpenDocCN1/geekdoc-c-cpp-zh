  md: '# Calling realloc with a Null Pointer


    Calling realloc with a null pointer is equivalent to calling malloc. Provided
    newsize is not equal to 0, the following code


    ```

    if (p == NULL)

    newp = malloc(newsize);

    else

    newp = realloc(p, newsize);

    ```


    can be replaced with


    ```

    newp = realloc(p, newsize);

    ```


    The first, longer version of this code calls malloc the first time storage is
    allocated, and realloc to adjust the size later as required. Because calling realloc
    with a null pointer is equivalent to calling malloc, the second version concisely
    accomplishes the same thing.


    # The reallocarray Function


    The OpenBSD reallocarray function can allocate storage for an array, but also
    provides overflow checking for array size calculations. This saves you from having
    to perform these checks. The reallocarray function has the following signature:


    ```

    void *reallocarray(void *ptr, size_t nmemb, size_t size);

    ```


    The reallocarray function allocates storage for nm members of size and checks
    for integer overflow in the calculation nmemb * size. Other platforms, including
    the GNU C Library (libc), have adopted this function, and it has been proposed
    for inclusion in the next revision of the POSIX standard. The reallocarray function
    doesn''t zero out the allocated storage.


    As we have in previous chapters, integer overflow is a serious problem that can
    result in buffer overflows and other security vulnerabilities. In the following
    code, for example, the expression num * size might overflow before being passed
    the size in the following call to realloc:


    ```

    if ((newp = realloc(p, num * size)) == NULL) {

    //---snip---

    ```


    The reallocarray function is useful when two values are multiplied to determine
    the size of the allocation:


    ```

    if ((newp = reallocarray(p, num, size)) == NULL) {

    //---snip---

    ```


    This call to the reallocarray function will fail and return a null pointer if
    num * size would otherwise overflow.'
