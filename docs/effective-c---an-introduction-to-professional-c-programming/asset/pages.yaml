    # Preprocessor Directives


    The first lines of hello.c program use the #include preprocessor directive, which
    behave as if you replaced it with the contents of the file at the exact same location.
    We include the <stdio.h> and <stdlib.h> headers to access the functions declared
    in those headers, which we can then call from the program. The puts function is
    declared in <stdio.h>, and the EXIT_SUCCESS macro is defined in <stdlib.h>. As
    the filenames suggest, <stdio.h> contains the declarations for C Standard I/O
    functions, and <stdlib.h> contains the declarations for general utility functions.
    You need to include the declarations for any library functions that you use in
    your program.


    # The main Function


    The main portion of the program, shown previously in Listing 1-1, starts with
    1


    ```

    int main(void) {

    ```


    This defines the main function that''s called at program startup. The main function
    defines the main entry point for the program that is executed in a hosted environment
    when the program is invoked by the command line or from another program. C defines
    two possible environments: freestanding and hosted. A freestanding environment
    may not provide an operating system and is typically used in embedded programming.
    These implementations provide a minimal set of library functions, and the name
    and type of the function called at program startup are implementation. This binary
    primarily assumes a hosted environment.


    We define main to return a value of type int inside the parenthesis to indicate
    that the function does not accept arguments. The int is a signed integer type
    that can be used to represent both positive and negative integer values as well
    as zero. Similar to other procedural languages, C programs consist of procedures
    (referred to as functions) which can accept arguments and return values. Each
    function is a reusable unit of work that you can invoke as frequently as necessary
    in your program.'
