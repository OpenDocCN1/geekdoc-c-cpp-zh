    zero.


    The signed and unsigned integer types are used to represent integers of various
    sizes. Each platform (current or historical) determines the size of each of these
    types, given some constraints. Each has a minimum representable range. The types
    are ordered by width, guaranteeing that wider types are at least large as narrower
    types so that an object of type long int represent all values an object of type
    long int can represent, an object of type int represent all values that can be
