    void *calloc(size_t nmemb, size_t size);

    ```


    This function initializes the storage to all zero-valued bytes. This zero value
    might not be the one used to represent floating-point zero or null-pointer constants.
    You can also use the calloc function to allocate storage for a single object,
    which can be thought of as an array of one element.


