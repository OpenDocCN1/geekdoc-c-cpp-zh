  md: '# TYPE DEFINITIONS


    You use a typedef to declare an alias for an existing type; it never creates a
    new type. For example, each of the following declarations creates a new type alias:


    ```

    typedef unsigned int uint_type;

    typed signed char sch_type, *scar_p, (*fp)(void);

    ```


    On the first line, we declare uint_type as an alias for the type unsigned int.
    On the second line, we declare scar_type as an alias for signed char, scar_p as
    an alias for signed char*, and fp as an alias for signed char(*). Identifiers
    that end in _t in the standard headers are type definitions (aliases for existing
    types). Generally speaking, you should not follow this in your own code because
    the C Standard reserves identifiers that match the patterns int[0-9a-z]_t and
    uint[0-9a-z]_t and the Portable Operating System Interface (POSIX) reserves all
    identifiers that end in _t. If you define identifiers that use these names, they
    may collide with names used by the implementation, which can cause problems that
    are difficult to debug.


    # Structures


    A structure type (also known as a struct) contains sequentially allocated memory
    objects. Each object has its own name and may have a distinct type—unlike arrays,
    which must be all of the same type. Structures are similar to record types found
    in other programming languages. Listing 2-9 declares an object identified by sigline
    that has a type of struct record and a pointer to the sigline object identified
    by sigline_p.


    ```

    struct sigrecord {

    int signum;

    char signame[20];nchar sigdesc[100];nsigline, *sigline_p;

    ```


    Listing 2-9: struct sigrecord


    The structure has three member objects: signum is an object of type int, signame
    is an array of type char consisting of 20 elements, and sigdesc is an array of
    char consisting of 100 elements.


    Structures are useful for declaring related objects and may be used to represent
    things such as a date, customer, or personnel record. They are especially useful
    for grouping objects that are frequently passed together as arguments to a function,
    so you don''t need to repeatedly pass individual objects separately.'
