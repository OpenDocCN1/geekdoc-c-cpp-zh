  md: '# Cast Operators


    Casts (also known as type casts) explicitly convert a value of one type to a value
    of another type. To perform a cast, we precede an expression by a parenthesized
    type name, which converts the value of the expression to the unqualified version
    of the named type. The following code illustrates an explicit conversion, or cast,
    of x from double to type int:


    ```

    double x = 1.2;

    int sum = (int)x + 1; // Explicit conversion from double to int

    ```


    Unless the type name specifies a void type, the type name must be a qualified
    or unqualified scalar type. The operand must also scale; a pointer cannot be converted
    to any floating-point type, and vice versa.


    Casts are extremely powerful and must be used carefully. For one thing, casts
    may reinterpret the existing bits as a value of the specified type without changing
    the bits:


    ```

    intptr_t i = (intptr_t)some_pointer; // reinterpret bits as an integer

    ```


    Casts may also change these bits into whatever bits are needed to represent the
    original value in the resulting type:


    ```

    int i = (int)some_float; // change bits to an integer representation

    ```


    Casts can also disable diagnostics. For example, consider the following code snippet:


    ```

    char c;

    // ---snip---

    while ((c = fgetc(in)) != EOF) {

    // ---snip---

    }

    ```


    This generates the following diagnostic when compiled with Visual C++ 2019 with
    warning level /W4:


    | Severity Description |

    | Warning C4244 ''='': conversion from ''int'' to ''char'', possible loss of data
    |


    Adding a cast to char disables the diagnostic without fixing the problem:


    ```

    char c;

    while ((c = (char)fgetc(in)) != EOF) {

    // ---snip---

    }

    ```'
