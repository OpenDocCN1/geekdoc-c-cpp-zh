    This book is an introduction to the C language. It is written to be accessible
    as possible to anyone who wants to learn C programming, without dumping it out.
    In other words, we didn''t overly simplify C programming in the way many other
    introductory books and courses might. These simplified references will teach you
    how to get code to compile and run, but the code might still be wrong. Developers
    who learn how to program C from such sources will typically develop substandard,
    flawed, inexperienced code that will eventually need to be rewritten (often sooner
    than later). Hopefully, these developers will eventually benefit from senior developers
    in their organizations who help them understand these harmful misconceptions about
    programming in C, and help developing professional quality. On the other hand,
    this book will quickly teach you how to develop correct, portable, professional-quality
    code, build foundation for developing security-critical and safety-critical systems,
    and perhaps teach you a or two that even the senior developers at your organization
    don''t know.


