    C Standard Library <math.h> header.


    # Predefined Macros


    Some macros are defined automatically by the implementation without requiring
    you to include a header file. These macros are called predefined macros because
    they are implicitly defined by the preprocessor rather than explicitly defined
    by the programmer. For example, the C Standard defines numerous macros that you
    can use to interrogate the compilation environment or provide basic functionality.
    Other aspects of the implementation (such as the compiler or the compilation target
    operating system) also automatically define macros. Table 9-12 lists some of the
    common macros defined by the C Standard. You can obtain a full list of predefined
    macros from Clang or GCC by passing the -E -dm flags to your compilers. You should
    check your implementation''s documentation for more information.'
