  md: '+   - Fully buffered Characters are intended to be transmitted to or from the
    host environment as a block when a buffer is filled. Streams used for file I/O
    are normally fully buffered to optimize throughput.


    +   - Line buffered Characters are intended to be transmitted or from the host
    environment as a block when a newline character is encountered. Streams connected
    to interactive devices such as terminals are line-buffered when you open them.


    In the next section, we''ll introduce predefined streams and describe how they''re
    buffered.


    # Predefined Streams


    Your program has three predefined text streams open and available for use on startup.
    These predefined streams are declared in <stdio.h>.


    ```

    extern FILE * stdin; // standard input stream

    extern FILE * stdout; // standard output stream

    extern FILE * stderr; // standard error stream

    ```


    The standard output stream (stdout) is the conventional output destination from
    the program. This stream is usually associated with the terminal that initiated
    the program but can be redirected to output to a file or other stream,


    ```

    $ echo fred

    fred

    $ echo > tempfile

    $ cat tempfile

    ```


    Here, the output from the echo standard input stream (stdin) is the conventional
    input source for the program. By default, stdin is associated with the keyboard
    but may be redirected to input from a file, for example, with the following commands:


    ```

    $ echo "one three four five seven" > fred

    $ wc < fred

    ```


    The contents of the file fred are redirected to the stdin of the command, which
    outputs the newline (1), word (7), and byte counts (34) from fred.


    The standard error stream (stderr) is for writing diagnostic output. As initially
    opened, stderr is not fully buffered; stdin and stdout are fully buffered if only
    if the stream does not refer to an interactive device. The stderr stream is not
    fully buffered, so that error messages can be seen as possible.


    Figure-1 shows the predefined streams stdin, stdout, and stderr attached to the
    keyboard and display of the user''s terminal.'
