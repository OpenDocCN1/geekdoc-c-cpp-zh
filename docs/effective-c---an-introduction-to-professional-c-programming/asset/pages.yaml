    # Compound Assignment Operators


    Compound assignment operators modify the current value of an object by performing
    an operation on it. The compound assignment operators are shown in Table 4-6.


    Table 4-6: Compound Assignment Operators

    | Operator | Description |

    |---|---|

    | += -= = | Assignment by sum and difference |

    | *= /= %= | Assignment by product, quotient, and remainder |

    | << >>= | Assignment by bitwise left shift and right shift |

    | &= ^= = \|= | Assignment by bitwise AND, XOR, and OR |


    A compound assignment of the form E1 op = E2 is equivalent to the simple assignment
    expression E1 = E1 op (E2), except that E1 is evaluated only once. Compound assignments
    are primarily used as a shorthand notation. There are no compound assignment operators
    for logical operators.


    # Comma Operator


    In C, we use comma in two ways: as operators and as a way to separate items in
    a list (such as arguments to functions or lists of declarations). The comma (,)
    operator is a way to evaluate one expression before another. The first operand
    of a comma operator is evaluated as a void expression. There is a sequence point
    between the evaluation of the left operand and the evaluation of the right operand.
    The right operand is evaluated after the left. The result of the comma operation
    has the type and value of the right operand—mostly because it is the last expression
    evaluated.


    You cannot use the comma operator in contexts where a comma might separate items
    in a list. Instead, you would include a comma within'
