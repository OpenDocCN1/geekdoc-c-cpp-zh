    # Header Guards


    One problem you face when writing header files is preventing programmers from
    including the same file twice in a translation unit. Given that you can transitively
    include header files, you could easily include the same header file multiple times
    by accident (possibly even leading to infinite recursion between header files).


    Header guards ensure that a header file is included only once per translation
    unit. A header guard is a design pattern that conditionally includes the contents
    of a header file based on whether a header-specific macro is defined. If the macro
    is not already defined, then a subsequent test of the header guard will not include
    the code. In the program shown in Table 9-4, bar.h uses a header guard (in bold
    font) to prevent its (accidental) duplicate inclusion from foo.c.


    The first time "bar.h" is included, the test to see that BAR_H is not defined
    returns true. We then define the macro BAR_H with an empty replacement list, which
    is sufficient to define BAR_H, and the function definition for func is included.
    The second time "bar.h" is included, the preprocessor will not generate any tokens,
    because the conditional inclusion test will return false. Consequently, func is
    defined only once in the translation unit.'
