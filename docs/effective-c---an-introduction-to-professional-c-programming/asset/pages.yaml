  md: 'Because of wraparound, an unsigned integer expression can never evaluate to
    less than 0. It''s easy to lose track of this and implement comparisons that are
    always true or false. For example, the i in the following loop can never take
    a negative value, so this loop will never terminate:


    ```

    for (unsigned int i = n; i >= 0; --i)

    ```


    This behavior caused some real-world bugs. For example, all power-generating systems
    on a Boeing 787 are managed by a responding generator control unit. Boeing''s
    laboratory testing discovered that an internal software counter in the generator
    control unit wraps around running continuously for 248 days, according to the
    Federal Aviation Administration. This defect causes all six generator generators
    to enter fail-safe mode at the same time.


    To avoid unplanned behavior (as having your airplane fall from the sky), it''s
    important to check for wraparound by using the limits <limits>. You should be
    careful when implementing these checks, because it is easy to make mistakes. For
    example, the code contains a defect as sum + ui can never be larger than UINT_MAX:


    ```

    extern unsigned int ui, sum;

    // assign values to ui and sum

    if (sum + ui > UINT_MAX)

    too_big();

    else

    sum = sum + ui;

    ```


    The result of sum + ui is larger than UINT_MAX, it''s reduced modulo UINT_MAX
    + 1. Therefore, this entire test is useless, and the generated code will unconditionally
    perform the summation. Quality compilers might warn you out, but not to all. To
    remedy this, we can subtract sum from sides of the inequality to the following
    effective test:


    ```

    extern unsigned int ui, sum;

    // assign values to ui and sum

    if (ui > UINT_MAX - sum)

    too_big();

    else

    sum = sum + ui;

    ```


    UINT_MAX is the largest value that can be represented as an unsigned int, and
    sum is a value between 0 and UINT_MAX. If sum is equal to UINT_MAX, the result
    of the subtraction is 0, and if sum is equal to 0, the result of the subtraction
    is UINT_MAX. Because the result of this operation will always fall in the allowable
    range of 0 to UINT_MAX, it can never wrap.


    +   6. See Airworthiness Directives; The Boeing Company Airplanes, https://www.federalregister.gov/doc/2015-10066/'
