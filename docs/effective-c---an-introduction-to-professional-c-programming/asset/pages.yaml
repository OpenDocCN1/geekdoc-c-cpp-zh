  md: '# 3


    # ARITHMETIC TYPES


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_64_0.png)


    In this chapter, you''ll learn about the two kinds of arithmetic types: integers
    and floating-point types. Most operators in C operate on arithmetic types. Because
    C is a system-level language, performing arithmetic operations correctly can be
    difficult—resulting in frequent defects. This is partially because arithmetic
    operations in digital systems with limited range and precision do not always produce
    the same result as they would in ordinary mathematics. Being able to perform basic
    arithmetic correctly in C is an essential foundation to becoming a professional
    C programmer.'
