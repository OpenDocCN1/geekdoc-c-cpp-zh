  md: '# Standard I/O Streams


    The C Standard specifies the use of streams to communicate with terminals and
    files stored on supported, structured storage devices. A stream is a uniform abstraction
    for communicating with files and devices that consume or produce sequential data
    such as sockets, keyboards, USB ports, and printers.


    C uses the opaque FILE type to represent streams. A FILE object holds the internal
    state for the connection to the associated file, including the file position indicator,
    buffering, an error indicator, and an end-of-file indicator. You should never
    allocate a FILE object yourself. C Standard Library functions operate on type
    FILE * (that is, a pointer to the FILE type). As a result, streams are frequently
    referred to as file pointers.


    The C Standard provides an extensive API, in <stdio.h>, for operating on streams;
    we will explore this API later in this chapter. However, because these I/O functions
    need to work with a wide variety of devices and filesystems across many platforms,
    they''re highly abstracted, which makes them unsuitable for anything beyond the
    simplest applications.


    For example, the C Standard has no concept of directories, because it must be
    able to work with nonhierarchical filesystems. The C Standard makes references
    to filesystem-specific details, like file permissions or locking. However, function
    specifications frequently state that behaviors happen “to the extent that the
    underlying system supports it,” meaning that they will occur only if they’re supported
    by your implementation.


    As a result, you will generally need to use the least portable APIs provided by
    POSIX, Windows, and other platforms to perform I/O in real-world applications.
    Frequently, applications define their own APIs that, in turn, rely on platform-specific
    APIs to provide safe and secure I/O operations across platforms.


    # Stream Buffering


    Buffering is the process of temporarily storing data in memory that''s passing
    between a process and a device or file. Buffering improves the throughput of I/O
    operations, which often have high latencies. Similarly, when a program requests
    to write to block-oriented devices like disks, the driver can cache the data in
    memory until it has accumulated enough data for one or more devices, at which
    point it writes the data all at once to the disk, improving throughput. This strategy
    is called flushing the buffer.


    Like device drivers, streams often maintain their I/O buffers. Typically, a stream
    uses one input buffer for each file the program wants to read, and one output
    buffer for each it it wants to write to. A stream can be one of three states:


    +   - **Unbuffered** Characters are intended to appear from the source or the
    destination as soon as possible. Streams used for error reporting or logging might
    be unbuffered.'
