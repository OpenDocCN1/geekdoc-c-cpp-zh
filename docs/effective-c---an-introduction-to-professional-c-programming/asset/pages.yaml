    ```


    The first two lines are declarations that define and initialize i with the value
    21, and j with the value 7. An initializer uses an expression but is not itself
    an assignment expression, because an initializer is always part of a declaration.


    The third line contains a simple assignment. You must define or declare all identifiers
    that appear in an expression such as simple assignment for your code to compile.


