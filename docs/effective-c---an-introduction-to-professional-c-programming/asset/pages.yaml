  md: '# Jump Statements


    A jump statement unconditionally transfers control to another section of the same
    function when encountered. These are the lowest-level control flow statements
    and generally correspond closely to the underlying assembly language code.


    # The goto Statement


    Any statement may be preceded by a label, which is an identifier followed by a
    colon. A goto statement causes a jump to the statement prefixed by the label named
    in the enclosing function. The jump is unconditional, meaning-it happens every
    time the goto statement is executed. Here is an example of a goto statement:


    ```

    /* executed statements */

    goto location;

    /* skipped statements */

    /* executed statements */

    ```


    Execution continues until the goto statement is reached, where point control jumps
    to the statement following the label location, where execution continues. Between
    the goto statement and the label are passed over.


    The goto statement has had a bad reputation since Edger Dijkstra wrote a paper
    in 1968 "Go To Statement Considered Harmful" (1968). His criticism was that goto
    statements can result in spaghetti code if used haphazardly-code a complex and
    tangled control structure, resulting in a program flow that is conceptually twisted
    and tangled like a bowl of spaghetti. However, goto statements can make code easier
    to read if used in a clear, consistent manner.


    One helpful way to use goto statements is to chain them together to release allocated
    resources (such as dynamic memory or an open file) when an error occurs and you
    must leave a function. This scenario occurs when a program allocates multiple
    resources, each allocation can fail, and resources must be released to prevent
    leaking. If the first allocation fails, no cleanup is needed, because no resources
    have been allocated. If the second resource cannot be allocated, similarly, if
    the third resource cannot be allocated, the second and first resources allocated
    need to be released, and so. This pattern results in duplicated cleanup code,
    and it can be err-prone because of the duplication and additional complexity.


    One solution is to use nested statements, which can also become difficult to read
    if nested too deeply. Instead, we can use a goto chain as shown in Listing 5-11
    to release resources.


    ```

    int do_something(void) {

    FILE *file1, *file2;

    object_t *obj;

    ```'
