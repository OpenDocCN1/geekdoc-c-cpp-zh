  md: 'We''ll dive deep into how arithmetic works in the C language so that you have
    a firm grasp of these fundamental concepts. We''ll also look at how to convert
    one arithmetic type to another, which is necessary for performing operations on
    mixed types.


    # Integers


    As mentioned in Chapter 2, each integer type represents a finite range of integers.
    Signed integer types represent values that can be negative, zero, or positive;
    unsigned integers represent values that can only be zero or positive. The range
    that each type of integer can represent depends on your implementation.


    The value of an integer object is the ordinary mathematical value stored in the
    object. The representation of a value for an integer object is the particular
    encoding of the value in the bits of its allocated storage. We will look at the
    representation in more detail later.


    # Padding and Precision


    All integer types except char, signed char, and unsigned char may contain unused
    bits, called padding, that allow implementations to accommodate hardware quirks
    (such as skipping over a sign in the middle of a multiple-word representation)
    or to optimally align with a target architecture. The number of bits used to represent
    a value of a given type, excluding padding but including the sign, is called the
    width and is often denoted by N. The precision is the number of bits used to represent
    values, excluding sign and padding bits.


    #  <limits.h> Header File


    The <limits.h> header file provides the minimum and maximum values for the various
    integer types. A representable value is one that can be represented in the number
    of bits available to an object of a particular type. Types that cannot be represented
    will be diagnosed by the compiler or converted to a different but (incorrect)
    value. Compiler writers provide the correct minimum, maximum, and width values
    for their implementations. To write portable code, you should use these constants,
    rather than integer literals such as 2147483647 which represent a specific limit
    and may change when port to a different implementation.


    The C Standard imposes only three constraints on integer sizes. First, storage
    for every data type occupies an integral number of adjacent char objects (which
    may include padding). Second, each integer type has to support the minimum ranges,
    allowing you to depend on a portable range of values across any implementation.
    Third, smaller types cannot be wider than larger types. So, for example, USHRT_MAX
    cannot be greater than UINT_MAX, but they can be the same width.'
