    String literals initialize array variables, which you can declare with an explicit
    bound that matches the number of characters in the string literal. Consider the
    following declaration:


    ```

    #define S_INIT "abc"

    // ---snip---

    const char s[4] = S_INIT;

    ```


    The size of the array s is four, the exact size required to initialize the array
    to the string literal, including the space for a trailing null byte.


    If you add another character to the string literal used to initialize the array,
    however, the meaning of the code changes substantially.


    ```

    #define S_INIT "abcd"

    // ---snip---

    const char s[4] = S_INIT;

    ```


    The size of the array s remains four, although the size of the string literal
    is five. As a result, the array s is initialized to the character array "abcd"
    with the trailing null byte omitted. This syntax is by design, to allow you to
    initialize a character array and not a string. Therefore, it is unlikely that
    your compiler will diagnose this declaration as an error. GCC issues a warning
    when an array is passed as an argument to a string function.


    There is some risk that, if the string literal changes during maintenance, a string
    could unintentionally be changed to a character array without terminating null
    character, particularly when the string literal is defined separately from the
    declaration, in this example. If your intent is to always initialize s to a string,
    you should omit the array bound. If you do not specify the bound of the array,
    the compiler will allocate sufficient space for the entire string literal, including
    the terminating null character:


    ```

    const char s[] = S_INIT;

