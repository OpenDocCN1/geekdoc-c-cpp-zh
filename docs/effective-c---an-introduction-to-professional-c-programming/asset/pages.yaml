  md: '# Declaring Integers


    Unless explicitly declared as unsigned, integer types are assumed to be signed
    (except for char, which the implementation can define as either a signed or unsigned
    integer type). The following are valid declarations of unsigned integers:


    ```

    unsigned int ui; // unsigned is required

    unsigned u; // int can be omitted

    unsigned long ull; // int can be omitted

    unsigned char uc; // unsigned is required

    ```


    When declaring signed integer types, you can omit the signed keyword—except for
    signed char, which requires the keyword to distinguish signed char from plain
    char. Unless it is the only keyword present, int can also be omitted. For example,
    instead of declaring a variable to be type long int, it is common practice to
    declare it as long and save some type typing. The following are all valid declarations
    of signed integers:


    ```

    int i; // signed can be omitted

    long int sli; // signed can be omitted

    long long sll; // signed and int can be omitted

    signed char sc; // signed is required

    ```


    # Unsigned Integers


    Unsigned integers have ranges that start at 0, and their upper bound is greater
    than that of the corresponding signed integer type. Unsigned integers are frequently
    used for counting items that may have large, nonnegative quantities.


    # Representation


    Unsigned integer types are easier to understand and to use signed integer types.
    They represent values using a pure binary system with no offset: the least significant
    bit has the weight 2⁰, the next least significant has the weight 2¹, and so forth.
    The value of the binary number is the sum of all the weights for the set bits.
    Table 3-1 shows some examples of unsigned values using an an unpadded 8-bit representation.


    # Table 3-1: 8-Bit Unsigned Values


    | Decimal | Binary | Hexadecimal |

    |---|---|---||

    | 0 | 0000 0000 | 0x00 |

    | 1 | 0000 0001 | 0x01 |

    | 17 | 0001 0001 | 0x11 |

    | 255 | 1111 1111 | 0xFF |'
