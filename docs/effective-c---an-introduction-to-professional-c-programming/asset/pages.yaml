    # Integer Constants


    Integer constants (or integer literals) are constants we use to introduce particular
    values into a program. For example, you might use them in a declaration or initialize
    a counter to 0. C has three kinds of integer constants that use different number
    systems: decimal constants, octal constants, and hexadecimal constants.


    Decimal constants always begin with a nonzero digit. For example, the following
    code uses two decimal constants:


    ```

    unsigned int ui = 71;

    si = -12;

    ```


    In this code, we initialize u1 to the decimal constant 71 and assign si the decimal
    constant value -12. Use decimal constants when introducing regular integer values
    into your code. If a constant starts with a 0, optionally followed by digits 0
    through 7, it is an octal constant. Here''s an example:


    ```

    int agent = 007;

    int permissions = 0777;

    ```


    In this example, 007 octal equals 7 decimal, and the decimal value 511. Octal
    constants are convenient when dealing with 3-bit fields, for example.


    You can also create a hexadecimal constant by prefixing a sequence of digits a
    (or A) through f (or F) with 0x or 0X. For example:


    ```

    int burger = 0xDEADBEEF;

    ```'
