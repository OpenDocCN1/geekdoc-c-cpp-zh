    This command will set the logfile name to logfile, and instruct the library to
    perform a check every 100 invocations, specified in the -i argument. If you specify
    a larger number as the -i argument, dmalloc will check the head less often, and
    your code will run faster; lower numbers are more likely to catch memory problems.
