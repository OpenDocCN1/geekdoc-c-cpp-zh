  md: '# The free Function


    You should deallocate dynamically allocated memory when it''s no longer needed
    by calling the free function. Deallocating memory is important because it allows
    memory to be reused, reducing the chances that you''ll exhaust the available memory,
    and often providing more efficient use of the heap.

    We deallocate memory by passing a pointer to that memory to the free function,
    which has the following signature:


    ```

    void free(void *ptr);

    ```


    The ptr value must have been returned by a previous call to aligned_alloc, malloc,
    calloc, or realloc. CERT rule MEM34-C (Only free memory allocated dynamically)
    discusses what happens when the value is not returned. Memory is a limited resource
    and so must be reclaimed.

    If we call free with a null-pointer argument, nothing happens, and the free function
    simply returns:


    ```

    char *ptr = NULL;

    free(ptr);

    ```


    # Avoiding Double-Free Vulnerabilities


    If you call the free function on the same pointer more than once, undefined behavior
    occurs. These defects can result in a security flaw known as a double-free vulnerability.
    One possible consequence is that they can be exploited to execute arbitrary code
    with the permissions of the vulnerable process. The full effects of double-free
    vulnerabilities are beyond the scope of this book, I discuss them in detail in
    Secure Coding in C and C++ (Secard 2013). Double-free vulnerabilities are especially
    common in error-handling code, as programmers attempt to free allocated resources.

    Another common error is to access memory that has already been freed. This type
    of error frequently goes undiagnosed, because the code might appear as invalid,
    but fails in unexpected ways away from the actual error. In Listing 6-4, taken
    from an actual application, the argument to close is invalid, because the storage
    formerly pointed to dirp is reclaimed by the second call to free:


    ```

    #include <dirent.h>

    #include <stdlib.h>

    #include <unistd.h>


    int closedir(DIR *dirp) {

    free(dirp->d_buf);

    free(dirp);

    return close(dirp->d_fd); // dirp has already been freed

    }

    ```


    Listing 6-4: Accessing already freed memory'
