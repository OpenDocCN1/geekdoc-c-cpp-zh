  md: '# Size and Length


    As mentioned earlier in this chapter, these strings have both a size (which is
    the number of bytes allocated to the backing storage) and a length. You can determine
    the size of a statically allocated backing array at compile time using the sizeof
    operator:


    ```

    char str[100] = "Here comes the sun";

    size_t str_size = sizeof(str); // str_size is 100

    ```


    You can compute the length of a string by using the strlen function:


    ```

    char str[100] = "Here comes the sun";

    size_t str_len = strlen(str); // str_len is 18

    ```


    The wccs function computes the length of a wide string measured by the number
    of code units preceding the terminating null character:


    ```

    wchar_t str[100] = "Here comes the sun";

    size_t str_len = wcslen(str); // str_len is 18

    ```


    The length is a count of something, but what exactly is counted can be unclear.
    Here are some of the things that could be counted when taking the length of a
    string:


    +   **Bytes** Useful when allocating storage.


    +   **Code units** Number of individual code units used to represent the string.
    This length depends on encoding and can also be used to allocate memory.


    +   **Code points** Code (characters) can take up multiple code units. This value
    is not useful when allocating storage.


    +   **Extended grapheme cluster** A group of one or more Unicode scalars that
    approximate a single user-perceived character. Many individual characters, such
    as “´” and “ñ”, may be constructed from multiple Unicode scalar values. Unicode’s
    boundary algorithms combine these code points into extended grapheme clusters.


    The strlen and wcslen functions count code units. For the strlen, this corresponds
    to the number of bytes. Determining the amount of storage required by using the
    wcslen function is more complicated because the size of the wchar_t type is implementation
    defined. Listing 7-2 contains examples of allocating storage for both narrow and
    wide strings.


    ```

    // narrow strings

    char str[] = "Here comes the sun";

    char *str2 = malloc(strlen(str1) + 1));

    ```'
