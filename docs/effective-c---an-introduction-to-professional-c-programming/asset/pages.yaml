    The chapters are as follows:


    Chapter 1: Getting Started with C You''ll write a simple C program to become familiar
    with the main function. You will also look at a few options for editors and compilers.


    Chapter 2: Objects, Functions, and Types This chapter explores basics like declaring
    variables and functions. You will also look into the principles of using basic
    types.


    Chapter 3: Arithmetic Types You''ll learn about the two kinds of arithmetic data
    types: integers and floating-point types.


    Chapter 4: Expressions and Operators You''ll learn about operators and how to
    write simple expressions to perform operations on various object types.


    Chapter 5: Control Flow You''ll learn how to control the order in which individual
    statements are evaluated. We''ll start going over expression statements and compound
    statements that define the work to be performed. We''ll then cover three kinds
    of statements that determine which code blocks are executed, and in what order:
    selection, iteration, and jump statements.


    Chapter 6: Dynamically Allocated Memory You''ll learn about dynamically allocated
    memory, which is allocated from the heap at runtime. Dynamically allocated memory
    is useful when the exact storage requirements for a program are unknown before
