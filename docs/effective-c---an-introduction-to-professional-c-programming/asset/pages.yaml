  md: 'Unsigned integer types do not require the sign to be represented and so generally
    1 bit precision than the corresponding signed integer values range from 0 to a
    maximum value that depends on the width of the type. This maximum value is $2^n
    - 1$, where $n$ is the width. For example, x86 architectures use 32-bit integers
    with no padding bits, so an object of unsigned int has a range of 0 to $2^{32}-1$
    (4,294,967,295). The constant UINT_MAX from <limits.h> specifies the implementation-defined
    range for this type. Table 3-2 shows the constant expressions from <limits.h>
    for each unsigned type, the minimum range required by the standard, and the actual
    on modern x86 implementations.


    | Constant expression | Minimum magnitudes | x86 | Maximum value for an object
    of type |

    |---|---|---|---|---|

    | UCHAR_MAX | 255 // $2^8 - 1$ | Same | unsigned char |

    | USHRT_MAX | 65,535 // $2^{16} - 1$ | Same | unsigned short int |

