    The C language supports three floating-point types: float, double, and long double.
    Floating-point arithmetic is similar to, and often used as a model for, the arithmetic
    of real numbers. The C language supports a variety of floating-point representations
    including, on most systems, the IEEE Standard for Floating-Point Arithmetic (IEEE
    754–2008). The choice of floating-point representation is implementation dependent.
    Chapter 3 covers floating-point types in detail.


