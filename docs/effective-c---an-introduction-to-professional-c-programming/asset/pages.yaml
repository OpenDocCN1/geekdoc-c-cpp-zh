  md: '# Compilers


    Many C compilers are available, so I won''t discuss them all here. Different compilers
    implement different versions of the C Standard. Many compilers for embedded systems
    support only C89/C90. Popular compilers for Linux and Windows work harder to support
    modern versions of the C Standard, and up to including support for C2x.


    # GNU Compiler Collection


    The GNU Compiler Collection (GCC) includes frontends for C, C++, and Objective-C,
    as well as other languages (https://gcc.gnu.org/). GCC follows a well-defined
    development plan under the guidance of the GCC steering committee.


    GCC has been adopted as the standard compiler for Linux systems, although versions
    are also available for Microsoft Windows, macOS, and other platforms. Installing
    GCC on Linux is easy. The following command, for example, should install GCC 8
    on Ubuntu:


    ```

    % sudo apt-get install gcc-8

    ```


    You can test the version of GCC you''re using with the following command:


    ```

    % gcc --version

    gcc (Ubuntu 8.3.0-6ubuntu18.04) 8.3.0

    This is free software; see the source for copying conditions. There is NO

    Warranty; not even for MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.

    ```


    Fedora is an ideal development system if you intend to develop software for Red
    Hat Enterprise Linux. The following command can be used to install GCC on Fedora:


    ```

    % sudo dnf install gcc

    ```


    # Clang


    Another popular compiler is Clang (https://clang.llvm.org/). Installing Clang
    on Linux is also easy. The following command, for example, should install Clang
    on Ubuntu:


    ```

    % sudo apt-get install clang

    ```


    You can test the version of Clang you''re using with the following command:


    ```

    % clang --version

    clang version 6.0.0-1ubuntu2 (tags/RELEASE_600-gnu)

    Target: x86_64-pc-linux-gnu

    Thread model: posix

    InstalledDir: /usr/bin

    ```'
