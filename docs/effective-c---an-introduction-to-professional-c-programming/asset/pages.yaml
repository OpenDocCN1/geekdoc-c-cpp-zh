    Any real-world system is made up of multiple components, such as source files,
    header files, and libraries. Many also contain resources including images, sounds,
    and configuration files. Composing a program from smaller logical components is
    a good software engineering practice, because these components are easier to manage
    than a single large file. In this chapter, you''ll learn how to structure your
    program into multiple units consisting of both source and include files. You''ll
    also learn how to link multiple object files together to create libraries and
    executable files.'
