  md: 'Use hexadecimal constants when the constant you are introducing is meant to
    represent a bit pattern more than a particular value; for example, when representing
    an address. Idiomatically, hexadecimal constants are written like 0xDEADBEEF because
    it resembles a typical hex dump. It''s probably a good idea for you to write all
    your hexadecimal constants like this.


    You can also add a suffix to the constant to specify its type. Without a suffix,
    a decimal constant is the int type if it can be represented as a value in that
    type. If it cannot be represented as an int, it will be represented as a long
    int or long long. The suffixes are U for unsigned, L for signed long, and LL for
    long long. These can be combined. For example the U suffix represents the unsigned
    long type. Here are some examples:


    ```

    unsigned int ui = 7UI;

    signed int si = 922337203685475807L;

    unsigned long int ui = 1844674407370955161ULL

    ```


    If we don''t use a suffix, the integer constant isn''t of the required type, (We''ll
    discuss implicit conversion in "Arithmetic Conversion" on page 49). This may result
    in a surprising conversion or a compiler diagnostic, so it''s best to correctly
    specify the desired type of your integer constants. Section 6.4.4.1 of the C Standard
    contains more information on integer constants.


    # Floating-Point


    Floating-point is the most common representation for real numbers in computers.
    Floating-point representation is a technique that uses scientific notation to
    encode numbers with a base number and an exponent. For example, the decimal number
    123.456 can be represented as 1.23456 × 10^4 while the binary number 0b10100.110
    can be represented as 1.0100110 × 2^4.


    You can generate floating-point representations in several ways. The C Standard
    doesn''t require implementations use any specific model, although it does require
    every implementation to support some model. To keep things simple, we''ll assume
    conformance to Annex F (the most common floating-point format). You can test the
    values of the STDC_IEC_60559_BP or _STDC_IEC_559_ macros in newer compilers to
    determine whether the implementation conforms to Annex F.


    This section explains floating-point types, arithmetic, values, and constants,
    so you will know how and when to use them to emulate real numbers and when to
    avoid them.'
