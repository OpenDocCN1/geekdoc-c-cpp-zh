    # Safety-Critical Systems


    Systems with high safety requirements frequently ban the use of dynamic memory,
    because memory managers can have unpredictable behavior that significantly impacts
    performance. For all applications to live within a fixed, pre-allocated area of
    memory can eliminate many of these problems and make it easier to verify memory
    use. In the absence of recursion, alloca, and VLAs (also prohibited in safety-critical
    systems), an upper bound on the use of stack memory can be derived statically,
    making it possible to prove that sufficient storage exists to ensure the functionality
    of the application for all possible inputs.


