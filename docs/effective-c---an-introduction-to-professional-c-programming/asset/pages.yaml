  md: '# Code Reuse


    Code reuse is the practice of implementing functionality only once, and then reusing
    it in various parts of the program without duplicating the code. Code duplication
    can lead to subtly unexpected behavior, oversized and bloated executables, and
    increased maintenance costs. And anyway, why write the same code more than once?


    Functions are the lowest-level reusable units of functionality. Any logic that
    you repeat more than once is a candidate for encapsulating in a function. If the
    functionality has only minor differences, you can frequently parameterize the
    function to serve multiple purposes. Each function should perform work that isn''t
    duplicated by any other function. You can then compose individual functions to
    solve increasingly sophisticated problems.


    Packaging reusable logic into functions can improve maintainability and eliminate
    defects. For example, you could determine the length of a null-terminated string
    by writing a simple loop, or more maintainable to use the strlen function from
    the C Standard Library. Because other programmers are already familiar with the
    strlen function, they''ll have an easier time understanding what that function
    is doing than what your loop. Furthermore, if you reuse functionality, you''re
    less likely to introduce behavioral differences compared to ad hoc implementations,
    and you can easily globally replace the functionality with a better-performing
    algorithm or more secure implementation.


    When designing functional interfaces, a balance must be struck between generality
    and specificity. An interface that specific to the current requirement may be
    lean and effective, but hard to modify when requirements change. A general interface
    might allow for future requirements, but be cumbersome for foreseeable needs.


    # Data Abstractions


    Data abstraction is any reusable software component that enforces a separation
    between the abstraction''s public interface and the implementation details. The
    public interface for each data abstraction includes the data-type definitions,
    function declarations, and constant definitions required by the users of the data
    abstraction and is placed in header files. The implementation details of how the
    data abstraction is coded, as well as any utility functions, are hidden within
    a source file, or a header file that''s in a separate location from the public
    interface header files. This separation of the interface from the private implementation
    allows you to change the implementation details without breaking code that depends
    on it.


    Header files contain function declarations and type definitions for the component.
    For example, the C Standard Library <string.h> provides the public interface for
    string-related functionality, while <threads.h> provides utility functions for
    threading. This logical separation has low coupling and high cohesion. This approach
    makes it easier to access only the components you need and reduces compile times
    and the likelihood of name collisions. You dont need to know anything about threading,
    if all you need is the strlen function.'
