  md: '# Principles of Componentization


    Nothing prevents you from writing your entire program within the main function
    of a single file. However, as the function grows in size, this approach will quickly
    become unmanageable. For this reason, it makes sense to decompose your program
    into a collection of components that exchange information across a shared boundary,
    or interface. Organizing source code into components makes it easier to understand,
    and it allows you to reuse the code elsewhere in the program, or even with other
    programs.


    Understanding how to decompose a program typically requires experience. Many of
    the decisions programmers are driven by performance. For example, you may need
    to minimize communication over a high-latency interface. Or, a client may need
    input field validation from the user interface so that it doesn''t require a round
    to the server. In this section, we''ll cover some principles of component-based
    software engineering.


    # Coupling and Cohesion


    to achieve desirable properties like low coupling and high cohesion. Cohesion
    is a measure of the commonality of elements of a programming interface. Assume,
    for example, that a header file exposes functions for calculating the length of
    a string, the tangent of a given input value, and creating a thread. This header
    file has low cohesion, because the exposed functions are unrelated to each other.
    Conversely, a header file that exposes functions to calculate the length of a
    string, concatenate two strings together, and search for a substring within a
    string has high cohesion, because all of the functionality is related. This way,
    if you need to work with strings, you need only to include the string header file.
    Similarly, related functions and type definitions that form a public interface
    should be exposed by the same header file to provide a highly cohesive interface
    of limited functionality. We''ll discuss interfaces further in "Data Abstractions"
    on page 187.


    Coupling is a measure of the interdependency of programming interfaces. A tightly
    coupled header file can''t be included in a program by itself; instead, it must
    be included with other header files in a specific order. You may couple interfaces
    for a variety of reasons, such as a mutual reliance on data structures, interdependence
    between functions, or the use of a shared global state. But when interfaces are
    tightly coupled, modifying program behavior becomes difficult, because changes
    can have a ripple effect across the system. You should always strive to loose
    coupling between interface components, regardless of whether they members of a
    public interface or implementation details of the program.


    By separating your program logic into distinct, highly cohesive components, you
    make it easier to reason about the components and test the program (because you
    can verify the correctness of each component independently). The end result is
    a more maintainable, less buggy system.'
