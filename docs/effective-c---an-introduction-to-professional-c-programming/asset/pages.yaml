  md: '# About the Author


    Robert Seacord (Robert.Seaccord@nccgroup.com) is a Technical Director of NCC Group,
    where he develops and delivers secure coding training in C, C++, and other languages.
    Robert is also an expert on ISO/IEC JTCI/SC22/WG14, the international standardization
    working group for the C programming language. He is the author of other books,
    including The C Coding Standard, Second Edition (Addison-Wesley, 2014), Coding
    in C and C++, Second Edition (Addison-Wesley, 2013), and Java Guidelines: 75 Recommendations
    for Reliable and Secure Programs (Addison-Wesley, 2014). He has also published
    more than 50 papers on software security, component-based software engineering,
    web-based system design, legacy-system modernization, component repositories and
    search engines, and user interface design and development.


    # About the Contributor


    Aaron Ballman (aaron@aronballman.com) is a compiler frontend engineer for Gamma,
    Inc. and works primarily on the static analysis tool CodeSonar. He is also a frontend
    maintainer for Clang, a popular open source compiler for C, C++, and other languages.
    Aaron is an expert for the JTCI/SC22/WG14 C programming language and SC22/WG21
    C++ programming language standards committees. His primary focus has been in helping
    programmers recognize mistakes in their code through better language design, diagnostics,
    and tooling. When not thinking about programming, he enjoys quiet moments in the
    woods of rural Maine with his family.


    # About the Techer


    Martin Sebor is Principal Software Engineer with the GNU Toolchain Team at Red
    Hat. His main focus is the GCC compiler and, in particular, the areas of detecting,
    diagnosing, preventing security-related issues in C and C++ programs, and implementing
    optimizations of string-based algorithms. Prior to joining Red Hat in 2015, he
    worked as a compiler toolchain engineer at Cisco. Martin has been a member of
    the C++ standardization committee since 1999 and a member of the C language committee
    since 2010. He lives with his wife near the small town of Lyons, Colorado.'
