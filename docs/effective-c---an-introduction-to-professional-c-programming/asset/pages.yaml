  md: '# COVERS

    C17 AND C2x


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_273_0.png)


    # "C PROGRAMMING

    FOR THE

    MODERN ERA"

    PASCAL CUOC


    The world runs on code written in the C programming language, yet most schools
    begin the curriculum with Python or Java. Effective C bridges this gap and brings
    C into the modern era—covering the C17 Standard as well as potential C2 features.
    With the aid of this instant classic, you''ll see writing professional, portable,
    and secure C programs to power robust systems and solve real-world problems.


    +   * How dynamic memory allocation works and how to use nonstandard functions

    * How to use character encodings and types

    * How to perform I/O with terminals and filesystems using C Standard and POSIX
    file descriptors

    * How to understand the C compiler''s translation phases and the role of the preprocessor

    * How to test, debug, and analyze C programs


    Robert C. Seacord introduces C and the C Standard Library while addressing best
    practices, common errors, and open debates in the C community. Developed together
    with other Standards committee experts, Effective C will teach you to debug, test,
    and analyze C programs. You''ll benefit from Seacord''s concise explanations of
    C language constructs and behaviors, and from his 40 years of coding experience.


    Effective C will teach you to write professional, secure, and portable C code
    that will stand the test of time and help strengthen the foundation of the computing
    world.


    # ABOUT THE AUTHOR


    Robert C. Seacord is a Technical Director at NCC Group where he develops and secures
    coding training in C, C++, and other languages. Seacord is an expert on the C
    Standards committee. His six previous books include The CERT C Coding Standard
    and Secure Coding in C and C++.


    You''ll learn:


    +   * How to identify and handle undefined behavior in a C program

    * The range and representations of integers and floating-point values


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_273_1.png)


