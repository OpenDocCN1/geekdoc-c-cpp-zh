  md: '# -std= flag Language Standards


    The -std= flag can be used to specify the language standard as c89, c99, c11,
    c17. For GCC, the default, if no C language dialect options are given, is -std=gnu11,
    which provides extensions to the C language that, on rare occasions, conflict
    with the C standard. For Clang, the default is -std=gnu11. For portability, specify
    the standard you''re using. For access to new language features, specify a recent
    standard. A good choice (in 2020) is -std=c17.


    # -pedantic Warnings


    The -pedantic flag issues warnings when code deviates from strict conformance
    to the standard. This flag is typically used in conjunction with the -std= flag
    to improve the portability of the code.


    # -D_FORTIFY_SOURCE=2 Buffer Overflow Detection


    The _FORTIFY_SOURCE macro provides lightweight support for detecting buffer overflows
    in functions that perform operations on memory and strings. All types of buffer
    overflows can be detected with this macro, but compiling your source with -D_FORTIFY_SOURCE=2
    provides an extra level of validation for functions that copy memory, as memcpy,
    memset, strcpy, strnc, sprintf and are potential source of buffer overflows. Some
    of the checks can be performed at compile time and result in diagnostics; others
    occur at runtime and result in a runtime error.


    # -fpie -Wl,-fpie and -fpic Position Independence


    Address space layout randomization (ASLR) is a security mechanism that randomizes
    the process''s memory space to prevent attackers from locating the code they''re
    trying to execute. You can learn more about ASLR and other security mitigations
    in Secure Coding in C and C++ (Seacord 2013).


    You must specify the -fpie -Wl,-fpie flags to create position-independent executables
    and to make possible to enable ASLR for your main program (executable). However,
    while code emitted with these options is position-independent, it does use some
    relocations that cannot be used in shared libraries (dynamic shared objects).
    For those, use -fpic, and link with -shared to avoid text relocations on architectures
    that support position-dependent shared libraries. Dynamic shared objects are always
    position-independent and therefore support ASLR.


    # Visual C++


    Visual C++ provides a wide assortment of compiler options, many of which are similar
    to the options available for GCC and Clang.14 One obvious difference is that Visual
    C++ generally uses the slash (/) character


    +   14. For more information on compiler options, see https://docs.microsoft.com/en-us/cpp/build/reference/compiler-options-listed-by-category/'
