    # Wraparound


    Wraparound occurs when you perform arithmetic operations that result in values
    too small (less than 0) or too large (greater than $2^n - 1$) to be represented
    as a particular unsigned integer type. In this case, the value is reduced modulo
    the number that is one greater than the largest value that can be represented
    in the resulting type. Wraparound is well-defined behavior in the C language.
    Whether it is a defect in your code depends on the context. For example if you
    are counting something and the value wraps, it is likely to be an error. However,
    the use of wraparound in certain encryption algorithms is intentional.


    For example, the code in Listing 3-1 initializes ui to its maximum value and increments
    it. The resulting value cannot be represented as an unsigned int, so it wraps
    around to 0. If it is then decremented, it falls out the range once more, so it
    wraps around to UINT_MAX.


    ```

    unsigned int ui = UINT_MAX; // 4,294,967,295 on x86

    ui++;nprintf("ui = %u\n", ui); // ui is 0

    ui--;

    printf("ui = %u\n", ui); // ui is 4,294,967,295

    ```


    Listing 3-1: Unsigned integer wraparound'
