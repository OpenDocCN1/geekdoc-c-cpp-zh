    environment variable is used to specify the location of the global temporary directories,
    which are typically /tmp and /var/tmp. Linux usually has user-specific temporary
    directories defined by the XDG_RUNTIME_DIR environment variable, which is typically
    set. In Windows, you can find user-specific temporary directories in the AppData
