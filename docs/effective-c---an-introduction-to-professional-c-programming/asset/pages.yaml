    # Source and Execution Character Sets


    No universally accepted character encoding existed when C was originally standardized,
    it was designed to work with a variety of character representations. Instead of
    specifying a character encoding like Java, each C implementation defines both
    a source character set in which source files are written and an execution character
    set used for string and literals at compile time.


    Both the source and execution character sets must contain encodings for the uppercase
    and lowercase letters of the Latin alphabet; the 10 digits; the 29 graphic characters;
    and the space, horizontal tab, vertical tab, form feed, and newline characters.
    The execution character set also includes alert, backspace, carriage return, and
    null characters.


    The character conversion and classification functions (such as isdigit) are evaluated
    at runtime, based on the locale-determined encoding in effect at the time of the
    call. Locales define local conventions of nationality, culture, and language.


