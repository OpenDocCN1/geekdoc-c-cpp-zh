    # Operator Precedence and Associativity


    In mathematics and computer programming, the order of operations (or operator
    precedence) is a collection of rules that dictate the order in which operations
    are performed in a given expression. For example, multiplication is normally granted
    a higher precedence than addition. Therefore, the expression 2 + 3 × 4 is interpreted
    to have the value 2 + (3 × 4) = 14,


    Associativity determines how operators of the same precedence are grouped when
    no parentheses are used. If adjacent operators have equal precedence, the choice
    of which operation to apply first is determined by the associativity. Left-associative
    operators cause the operations to be grouped from the left while right-associative
    operators cause the operations to be grouped from the right. Grouping can be thought
    of as the implicit introduction of parentheses. For example, the (+) operator
    has left associativity, so the expression a + b + c is interpreted as ((a + b)
    + c). The assignment operator is right-associative, so the expression a = b =
    c is interpreted as (a = (b = c)).


    Table 4-1 lists the precedence and associativity of C operators, as specified
    by the language syntax. Operators are listed from top to bottom, in descending
    precedence.


    Operator Precedence and Associativity


    | Precedence | Operator | Description | Associativity |

    |---|---|---||

    | 0 | (...) | Forced grouping | Left |

    | 1 | ++ | Postfix increment and decrement | Left |

    | | | Function call | |

    | | [] | Array subscripting | |

    | | . | Structure and union member access | |

    | | -> | Structure and union member access through pointer | |

    | | (type){list} | Compound literal | |


