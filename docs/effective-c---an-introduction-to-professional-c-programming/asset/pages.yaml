  md: '# Floating-Point Types


    C has three floating-point types: float, double, and long double.

    The float type can be used for floating-point calculations in which the result
    can be adequately represented as a single-precision result. The common IEC 60559
    float type encodes values using 1 sign bit, 8 exponent bits, and 23 significant
    bits (ISO/IEC/IEEE 60559-2011).

    The double type provides greater precision but requires additional storage. It
    encodes values using 1 sign bit, 11 exponent bits, and 52 significant bits. These
    types are illustrated in Figure 3-2.


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_75_0.png)


    Figure 3-2: The float and double types


    Each implementation assigns the long double type one of the following formats:


    +   - IEC 60559 quadruple (or binary128) format⁷

    - IEC 60559 binary64-extended format

    - A non-IEC 60559 extended format

    - IEC 60559 double (or binary64) format


    Recommended practice for compiler implementers is to match the long double type
    with the IEC 60559 binary128 format or an IEC 60559 binary64-extended format.
    IEC 60559 binary64-extended formats include the 80-bit IEC 60559 format.

    Larger types have greater precision but require more storage. Any value that can
    be represented as a float can also be represented as a double, and any value that
    can be represented as a double can be represented as a long double. Future versions
    of the standard may include additional floating-point types, including those with
    greater range, precision, or both than long double, or lesser range and precision,
    such as 16-bit floating-point type.


    7. IEC 60559 added binary128 to its basic formats in the 2011 revision.'
