  md: '# Microsoft Visual Studio


    The most popular development environment for Windows is Microsoft Visual Studio,
    which includes both the IDE and the compiler. The most recent version of Visual
    Studio at the time of writing is 2019 (https://visualstudio_microsoft.com/downloads/).
    It''s bundled with Visual++ 2019, which includes both the C and C++ compilers.


    You can set options for Visual Studio on the Project Properties Pages. On the
    Advanced tab under C/C++, make sure you compile as C code by using the Compile
    as C Code (/TC) option and not the Compile as C++ Code (/TP) option. By default,
    when you name a file with a .c extension, it''s compiled with /TC. If the file
    is named a .cpp, .cc, or for a few other extensions, it''s compiled with /TP.


    # Portability


    Every C compiler implementation is at least a little different. Compilers continually
    evolve—so, for example, a compiler like GCC might provide full support for C17
    but be working support for C2x, in which case it might have some C2x features
    implemented but not others. Consequently, compilers support a full spectrum of
    C Standard standards (including between versions). The overall evolution of C
    implementations is slow, with many compilers significantly lagging behind the
    C Standard.


    Programs written for C can be considered strictly conforming if you use only those
    features of the language and library specified in the standard. These programs
    are intended to be maximally portable. However, because of the range of implementation
    behaviors, real-world C program is strictly conforming, nor ever will (and probably
    shouldn''t be). Instead, the C Standard allows you to write conforming programs
    that may depend on nonprofit language and library features.


    It''s common practice to write code for a single reference implementation, or
    sometimes several implementations, depending on which platforms you plan to deploy
    your code. The C Standard allows ensures that these implementations don''t differ
    too much, and allows you to target several at once, without having to learn a
    new language each time.


    Five kinds of portability issues are enumerated in Annex J of the C Standard:


    +   - Implementation-defined behavior

    - Unspecified behavior

    - Undefined behavior

    - Locale-specific behavior

    - Common extensions


    As you learn about the C language, you''ll encounter examples of all five kinds
    of behaviors, so it''s important to understand precisely what these are.'
  merge: -1
