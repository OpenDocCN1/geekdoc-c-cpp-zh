    +   * Using a null byte to terminate a string (a topic we''ll discuss later) works
    the same as for an ASCII string.


    +   * All currently defined Unicode code points can be encoded using between 1
    and 4 bytes.


    +   * Unicode is designed to make it easy to identify character boundaries for
    scanning for well-defined patterns in either direction.


    On Windows, you can compile and link your programs with the Visual C++ /utf8 flag
    to set the source and execution characters as UTF-8. You''ll also need to configure
    Windows to use UTF-8 for worldwide support, unless this changes in the future.


