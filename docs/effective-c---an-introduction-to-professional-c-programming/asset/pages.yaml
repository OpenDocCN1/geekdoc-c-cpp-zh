  md: 'We refer to pointers to already freed memory as dangling pointers. Dangling
    pointers are a potential source of errors (like a banana peel on the floor) because
    they can be used to write to memory that has already been freed or to the free
    function, resulting in double-free vulnerabilities. See CERT C rule MEM30-C (Do
    not access freed memory) for more information on these topics.


    # Setting the Pointer to Null


    To limit the opportunity for defects involving dangling pointers, set the pointer
    to NULL after completing a call to free:


    ```

    char *ptr = malloc(16);

    //---snlp--

    free(ptr);

    ptr = NULL;

    ```


    Any future attempt to dereference the pointer will usually result in a crash (increasing
    the likelihood that the error is detected during implementation and testing).
    If the pointer is set to NULL, the memory can be freed multiple times without
    consequence. Unfortunately, the free function cannot set the pointer to NULL itself,
    because it''s passed a copy of the pointer, not the actual pointer.


    # Memory States


    Dynamically allocated memory can exist in one of three states shown in Figure
    6-1: unallocated and uninitialized within the memory manager, allocated but uninitialized,
    and initialized. Calls to the malloc and free functions, as well as writing the
    memory, can cause the memory to transition from one state to another.


