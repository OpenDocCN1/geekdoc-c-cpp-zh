  md: '# Storage Duration


    Objects occupy storage, which might be random-access memory (RAM), read-only memory
    (ROM), or registers. Storage of allocated duration has significantly different
    properties than storage of either automatic or static storage duration. First,
    we''ll review automatic and static storage duration—initially described in Chapter
    2.


    Objects of automatic storage duration are declared within a block or as a function
    parameter. The lifetime of these objects begins when the block they are in begins
    execution, and ends when execution of the block ends. If the block is entered
    recursively, a new object is created each time, with its own storage.


    Objects declared in the file scope have static storage duration. The lifetime
    of these objects is the entire execution of the program, and their stored value
    is initialized prior to program startup. You can also declare a variable within
    a block to have static storage duration by using the storage-class specifier static.


    # The Heap and Memory Managers


    Dynamically allocated memory has allocated storage duration. The lifetime of an
    allocated object extends from the allocation until the deallocation. Dynamically
    allocated memory is allocated from the heap, which is simply one or more large,
    subdividable blocks of memory that are managed by the memory manager.


    Memory managers are libraries that manage the heap for you providing implementations
    of the standard memory management functions described in the following sections.
    A memory manager runs as part of the client process. The memory manager will request
    one or more blocks of memory from the operating system and then allocate this
    memory to the client process when it invokes a memory allocation function.


    Memory managers manage unallocated and deallocated memory. Once memory has been
    allocated, the caller manages the memory until it is returned. It''s the caller''s
    responsibility to ensure that the memory is deallocated, although most implementations
    will reclaim dynamically allocated memory when the program terminates.


    > MEMORY MANAGER IMPLEMENTATIONS

    Memory managers typically implement a variant of a dynamic storage allocation
    algorithm described by Donald Knuth (1997). This algorithm uses boundary tags—fields
    that appear before and after the block of memory returned to the programmer. This
    information allows all memory blocks to be traversed from any known block in either
    direction, allowing the manager to coalesce two bordering unused blocks into a
    larger block to minimize fragmentation.'
