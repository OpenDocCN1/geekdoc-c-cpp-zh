  md: '# # File Inclusion


    A powerful feature of the preprocessor is the ability to insert the contents of
    one source file into the contents of another source file using the #include preprocessing
    directive. The included files are called header files to distinguish them from
    other source files. Header files typically contain declarations for use by other
    programs. This is the most common way to share external declarations of functions
    and objects with other parts of the program. You''ve already seen many examples
    of including the headers for C Standard Library functions in the examples in this
    book. For instance, the program in Table 9-2 is separated into a header file named
    bar.h and a source file named foo.c. The source file foo.c does not directly contain
    a declaration of function, the #include directive inserts the contents of bar.h
    into foo.c in the place of the #include directive directive itself.


    | Table 9-2: Header File Inclusion |

    | Original sources | Resulting translation unit |

    |---|---|n| bar.h | int func(void); |

    | int func(void); | int main(void) { return func(); } |

    | foo.c | |

    | #include "bar.h" | |

    | | | |


    The preprocessor executes #include directives as it encounters them. Therefore,
    inclusion has transitive properties: if a source file includes a header file that
    itself includes another header file, the preprocessed output will contain the
    contents of both header files. For example, given the baz.h and bar.h header files
    and the foo.c source file, the output after running the preprocessor on the baz.c
    source code is shown in Table 9-3.


    | Table 9-3: Transitive Header File Inclusion |

    | Original sources | Resulting translation unit |

    |---|---|n| baz.h | int other_func(void); |

    | int other_func(void) | int func(void); |

    | bar.h | |

    | #include "baz.h" | int main(void) { return func(); } |

    | int func(void); | |

    | foo.c | |

    | #include "bar.h" | |

    | int main(void) { return func(); } |'
