  md: '# INTRODUCTION


    ![](img/68b8d5766d6d0346cd3da10ffab956b5_24_0.png)


    C was developed as a system programming language in the 1970s, and even after
    all this time, it remains incredibly popular.

    System languages are designed for performance and ease of access to the underlying
    hardware while providing high-level programming features. While other languages
    may offer newer language features, their compilers and libraries are typically
    written in C. Carl Sagan once said, "If you wish to make an apple pie from scratch,
    you must first invent the universe."


    The inventors of C did not invent the universe; they designed C to work with a
    variety of computing hardware and architectures that, in turn, are constrained
    by physics and mathematics. C is layered directly on top of computing hardware,
