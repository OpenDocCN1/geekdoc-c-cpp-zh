  md: 'Having a tool locate and identify specific errors in your program is much,
    much easier than hours of testing and debugging, and much less costly than deploying
    defective code. A wide variety of free and commercial static analysis tools are
    available. For example, Visual C++ has static analysis capabilities that you can
    enable with the /analyze flag. Visual C++ analysis allows you to specify rule
    sets (such as recommended, security, or internationalization) you would like to
    run, or whether to run them all. For more information on Visual C++''s static
    code analysis, see Microsoft''s website at https://docs.microsoft.com/en-us/visualstudio/code-analysis-for-cpp/.
    Similarly, Clang has a static analyzer that can be run as a standalone tool or
    within Xcode (https://clang.llvm.org/). GCC 10 will also have a simple static
    analyzer. Commercial tools also exist, such as CodeSonar from GrammTech, TrustInfo
    Analyzer, SonarQube from SonSource, Coverity from Synopsys, LDRA Testbed, Helix
    QAC from Perforce, and others.


    Many static analysis tools have nonoverlapping capabilities, so it may make sense
    to use more than one.


    # Dynamic Analysis


    Dynamic analysis is the process of evaluating a system or component during execution.
    It is also referred to runtime analysis, among other similar names.


    A common approach to dynamic analysis is to instrument the code—by enabling compile-time
    flags that inject extra instructions into the executable—and then run the instrumented
    executable. A similar approach is taken by the debug memory allocation library
    dmalloc described in Chapter 6. The malloc library provides replacement memory
    management routines with runtime-configurable facilities. You can control the
    behavior of these routines by using a command line utility (also called dmalloc)
    to detect memory leaks, and to discover and report defects such as writing outside
    the bounds of an object and using a pointer after it''s been


    The advantage of dynamic analysis is that it has a low false-positive rate, so
    if one of these tools flags a problem, fix it!


    A drawback of dynamic analysis is that it requires sufficient code coverage. If
    a defective code path is not exercised during the testing process, the defect
    won''t be found. Another drawback is that the instrumentation may change aspects
    of the program in undesirable ways, such as adding performance overhead or increasing
    the binary size.


    AddressSanitizer is an example of an effective dynamic analysis tool that is available
    (for free) for several compilers. Several related sanitizers exist, including
    ThreadSanitizer, MemorySanitizer, Hardware-Assisted AddressSanitizer, and UndefinedBehaviorSanitizer
    Many other dynamic analysis tools are available, both commercial and free. I will
    demonstrate the value of these tools by discussing AddressSanitizer in detail.


    16. For more information on sanitizers, see https://github.com/google/sanitizers/.'
