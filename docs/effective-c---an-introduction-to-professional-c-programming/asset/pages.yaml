  md: 'The same problem occurs when checking the result of an arithmetic operation
    against 0, the minimum unsigned value:


    ```

    extern unsigned int i, j;

    // assign values to i and j

    if (i - j < 0) // cannot happen

    negative();

    ```


    Because integer values can never be negative, the subtraction will be performed
    unconditionally. Quality compilers may warn about this mistake as well. Instead
    of useless this test, we can check for wraparound by testing whether j is greater
    than i:


    ```

    if (j > i) // correct

    negative();

    i = i - j;

    ```


    If j > i, the result would wrap around, so the possibility of wraparound is clearly
    detected. By eliminating the subtraction operation in the test, we eliminate the
    possibility of wraparound occurring during the test.


    > Keep in mind that the width used when wrapping depends on the implementation,
    which means you can obtain different results on different platforms. Unless you
    take this into account, your code won''t be portable.


    # Signed Integers


    Each unsigned integer type (excluding _Bool) has a corresponding integer type
    that occupies the same amount of storage. We used integers to represent negative,
    zero, and positive values, the range of which depends on the number of bits allocated
    to the type and the representation.


    # Representation


    Representing signed integer types is more complicated than representing unsigned
    integer types. Historically, the C language has supported three signed integer
    representation schemes:


    +   **Sign and magnitude** The high-order bit indicates the sign, and the remaining
    bits represent the magnitude of the value in pure binary notation.


    +   **Ones'' complement** The sign bit is given the weight $-(2^{N-1})$, and the
    other value bits have the same weights as unsigned.


    +   **Two''s complement** The sign bit is given the weight $-(2^{N-1})$, and the
    other value bits have the same weights as unsigned.'
