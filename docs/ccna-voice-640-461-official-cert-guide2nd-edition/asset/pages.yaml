- pgno: 126
  md: '# Chapter 5: Managing Endpoints and End Users with CME


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_126_0.png)


    **Figure 5-5** Configuring Extensions in CCP


    As you add the extensions to CCP, they are stored on the CME running-configuration
    (don''t forget to save when you''re done!) and appear as valid extensions in CCP
    (see Figure 5-6).


    Now, we can move on to adding the phones. Clicking the Phones CCP configuration
    (Configure > Unified Communications > Users, Phones and Extensions > Phones) reveals
    a window almost identical to the Extensions window. Clicking the Add button pops
    up a simple interface asking for two keys: model of Cisco IP Phone you want to
    add and the associated MAC address (shown in Figure 5-7).


    After you click the OK button, the CCP CLI Preview displays the following syntax:


    ```

    ephone 1

    mac-address 0014.1C48.E71A

    type 7960

    auto-line

    exit

    ```


    You can repeat this operation for as many phones as you want to.


    **Tip:** On the right pane of the CCP interface is a bulk import wizard. This
    exists both for the extensions and phones. If you format all the required data
    in a Comma Separated Value (CSV) file, you can perform a bulk import of both extensions
    and phones into the system (which takes much less time than adding them individually
    for a large group of devices).'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# CCNA Voice 640-461 Official Cert Guide


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_127_0.png)


    Figure 5-6 CCP with Three Extensions Added


    Now that we add extensions and phones to the system, we can move into the final
    piece of the configuration: adding users. Unlike the pure command-line configuration
    of CME, which links ephone-dns to phones, CCP ties the extensions and phones through
    a user account. By creating a user account, the end user can have the ability
    to manage his her phones through a web interface. For now, let''s get the phones
    working.


    To add a user in CCP, navigate to Configure > Unified Communications > Users,
    Phones and Extensions > User Settings. After you are there, you can create a new
    user, as shown in Figure 5-8. The only required field is the User ID, which represents
    the username the user uses when logging on to the system. You can configure these
    additional fields:


    +   * First Name

    * Last Name

    * Display Name (used for Caller ID)

    * Password (used to log on to the system)

    * PIN (used for features like Extension Mobility)


    This simple configuration window also contains the information CME uses to build
    a directory of users. After you add these users to CME, the users of the VoIP
    system will be able to press the directories button on their IP phone, navigate
    to Local Directory, and search the database of users contained in CME.'
  merge: -1
  img_proc: true
