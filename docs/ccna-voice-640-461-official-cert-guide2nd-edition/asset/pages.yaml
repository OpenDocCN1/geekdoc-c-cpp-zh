- pgno: 170
  md: 'This configuration creates two identical destination patterns for the two FXO
    ports. Because the preference command is not used to indicate a more preferred
    dial, the router will randomly choose one of the FXO ports as an exit anytime
    user dials 911 or 9911 (the additional 9 are entered if users are accustomed to
    dialing 9 for an outside line). The dial peers created for the 911 destination
    pattern (dial peers 10 and 12) are also assigned the no-digit-strip command. Otherwise,
    the automatic digit-stripping rule of POTS would strip explicitly defined digits
    (which are all of them in this case; the router would not send any digits to the
    PSTN). The dial peers created for the 9911 destination pattern (dial peers 11
    and 13) are assigned the forward-digits 3 command to send the right-justified
    three digits (911, in this case) to the PSTN and allow the automatic digit-stripping
    rule to remove the initial 9 access code.


    # Practical Scenario 4: Using Translation Profiles


    The digit manipulation discussed thus allow you to perform "minor translations"
    to a number. For example, you can add some digits to ensure digits do or not get
    stripped with the forward-digits command. The num-exp command allows you to make
    the biggest changes of all, but these changes are applied globally to the router,
    which might not give you the flexibility all situations require. Translation profiles
    are useful to address these needs. If you find yourself saying, "I want to change
    this dialed number to that dialed number, but only when it goes out this port,"
    you need a translation profile.


    Working with translation profiles is definitely not as easy as working with the
    "simple" digit manipulation methods discussed earlier. Implementation of translation
    profiles requires a three-step process:


    +   **Step 1.** Define the rules that dictate how the router will transform the
    number.


    +   **Step 2.** Associate the rules into a translation profile.


    +   **Step 3.** Assign the translation profile to a dial peer.


    In a way, this is similar to access-list configuration on a router.


    To demonstrate the configuration of translation profiles, consider the scenario
    illustrated in Figure 6-15.


    The headquarters of this organization used the DID from a PSTN provider of 602.555.XXX.
    This allows PSTN callers to dial directly into the organization without being
    redirected by a receptionist. Typically, when you lease a block of DID numbers,
    the PSTN carrier will strip the numbers to a four-digit extension. In this case,
    the DID block assigned to the organization (6XXX) does not match its internal
    extension range (5XXX). The administrator of network would like to translate all
    6XXX dialed numbers to 5XXX, but only if these dialed numbers come in from the
    T1 PSTN interface, so as to interfere with the numbering scheme of the remote
    office. To accomplish this, he cannot use the num-exp 6... global configuration
    command because it will interfere with dialing the 6XXX extensions at the remote
    office. This situation is ideal for translation profiles.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "![](img/e4ad7862dc47b4e5de0cde3b4550ad65_171_0.png)\n\n# ### Figure 6-15 Translating\
    \ DID Ranges to Internal Extensions\n\nThe first step to configure the translation\
    \ profiles is to create the translation rules. These use the general syntax shown\
    \ in Example 6-20.\n\n# ### Example 6-20 Translation Rule General Syntax\n\n```\n\
    Router(config)# voice translation-rule rule number\nRouter(cfg-translation-rule)#\
    \ rule 1 /match/ /set/\nRouter(cfg-translation-rule)# rule 2 /match/ /set/\nRouter(cfg-translation-rule)#\
    \ rule 3 /match/ /set/ ... and so on\n```\n\nExample 6-21 configures the necessary\
    \ translation rule for the scenario in Figure 6-15.\n\n# ### Example 6-21 Configuring\
    \ Translation Rules\n\n```\nHQ_ATR(config)# voice translation-rule 1\nHQ_ATR(cfg-translation-rule)#\
    \ rule 1 ?\n/WORD/ Matching pattern\n  reject Call block rule\nHQ_ATR(cfg-translation-rule)#\
    \ rule 1 /6/ ?\n/WORD/ Replacement pattern\nHQ_ATR(cfg-translation-rule)# rule\
    \ 1 /6/ /5/\n```\n\nThe syntax in rule 1 command may look a little cryptic. The\
    \ first entry between the set of forward slashes (/) is the match statement. This\
    \ tells the router, \"Look for the number 6.\" The entry between the second set\
    \ of forward slashes is the set statement. This tells the router, \"Replace the\
    \ 6 you found from the match statement with a 5.\" In this case, the router changes\
    \ the first 6 that is found to be a 5."
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Thankfully, Cisco does not leave you “hoping” that the translation rule will
    work properly after it is applied to the interface. You can use the test voice
    translation-rule command from privileged mode to test the rules you create before
    you apply them, as shown in Example 6-22.


    # ### Example 6-22 Testing Translation Rules


    ```

    HQ_RTR# test voice translation-rule 1 6546

    Matched with rule 1

    Original number: 6546 Translated number: 5546

    Original type: none Translated number type: none

    Original plan: none Translated number plan: none

    H_RTR# test voice translation-rule 1 6677

    Matched with rule 1

    Original number: 6677 Translated number: 5677

    Original type: none Translated number type: none

    Original plan: none Translated number plan: none

    ```


    Example 6-22''s output indicates the translation rule tests successfully, 6546
    is translated to 5546 and 6677 is translated to 5677.


    Next, you need to take the voice translation rule and assign it to a translation
    profile. The translation profile designates which the translation rule will change
    the caller (ID or ANI) or called (dialed number or DNIS) information. Example
    6-23 assigns translation rule 1 to a translation profile called CHANGE_DID.


    # ### Example 6-23 Assigning Translation Rules to a Translation Profile


    ```

    HQ_RTR(config)# voice translation-profile ?

    WORD Translation profile name

    HQ_RTR(config)# voice translation-profile# CHANGE_DID

    HQ_RTR(cfg-translation-profile)# translate ?

    called Translation rule for the calling-number

    calling Translation rule for the calling-number

    redirect-called Translation rule for the redirect-number

    redirect-target Translation rule for the redirect-target

    HQ_RTR(cfg-translation-profile)# translate called ?

    <1-2147483647> Translation rule tag

    HQ_RTR(cfg-translation-profile)# translate called 1

    ```


    Example 6-23 assigns translation rule 1 as a called (dialed number) translation.
    Because the scenario requires you to change the ID information, this is the proper
    assignment. Assigning the translation rule as a calling translation would change
    the caller ID of a person calling into the organization.


    The last step is to assign the translation profile. The following example assumes
    that the router is using POTS dial-peer 100 as inbound dial peer for calls coming
    from the PSTN:


    ```

    HQ_RTR(config)# dial-peer voice 100 pots

    HQ_RTR(cfg-dial-peer)# translation-profile incoming CHANGE_DID

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Note that the example applies the translation profile in the incoming direction.
    This causes it to affect calls coming from the PSTN rather than outgoing calls.
    The translation profile is now in effect, accomplishing the objective of the scenario.


    Note: You can do far more with translation profiles (and far more complex patterns
    that you can match with translation rules). This is covered more in the CVOICE
