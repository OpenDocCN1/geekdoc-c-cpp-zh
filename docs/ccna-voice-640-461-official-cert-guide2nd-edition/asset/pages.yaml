    maps, multil interfaces, and so on. The full explanation of these commands is
    saved for the CCNP Voice QoS material.


    **Note: In Example 6-30, entering the auto ? command under the FastEthernet interface,
    notice that one of the options you are given is auto discovery.** This enables
    a newer, ultra-incredible version of AutoQoS that allows the router to monitor
    your network for an extended time to discover known types of data, video, and
    video traffic that are considered higher priority on common high-priority application
    types. After the router captures enough traffic, it generates QoS policy recommendations
    that you can choose to apply or ignore.


    Table 6-8 summarizes the different variations of AutoQoS commands you can enter
    on Cisco switch and router platforms.


    # **Table 6-8** AutoQoS Syntax Variations


    | Command | Platform | Description |

    |--- |--- |--- |

    | auto qos voip | Router or Layer 3 switch | Enables AutoQoS without trusting
    any existing markings on packets. The router re-marks all traffic types using
    access lists or Network-Based Application Recognition (NBAR) to identify traffic
    (higher processor-utilization tasks). |


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_194_0.png)'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Table 6-8 AutoQoS Syntax Variations


    | Command | Platform | Description |

    |---|---|--|

    | auto qos voip trust | Router or switch | Enables AutoQoS, trusting any existing
    QoS markings that enter the interface only if the switch detects a Cisco IP phone
    attached through CDP. |

    | auto qos voip cisco-phone | Switch | Enables AutoQoS, trusting any existing
    QoS markings that enter the interface only if the switch detects a Cisco IP phone
    attached through CDP. |

    | auto qos voip cisco-softphone | Switch | Enables AutoQoS, trusting any existing
    QoS markings that enter the interface only if the switch detects a Cisco IP SoftPhone
    (such as Cisco IP Communicator) attached through CDP. |


    **Note:** QoS engineers identify what have been called QoS markings in the previous
    section as Class of Service (CoS) and Type of Service (ToS) markings. QoS is a
    marking that exists in the Layer 2 header of a frame, which a switch can identify.
    ToS is a marking that exists in the Layer 3 header of a packet, which a router
    can identify. This topic is explored in depth in the material for the QoS CCNP
    Voice certification exam.'
  merge: -1
