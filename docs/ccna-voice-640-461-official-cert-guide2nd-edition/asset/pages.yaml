  md: '# Foundation Topics


    # Describe the CUCM GUI and CLI


    Administrative Web access to CUCM is possible only via HTTPS (or Secure Shell
    [SSH] for the command line). There are six separate interfaces:


    +   - Cisco Unified Communications Manager Administration (https://<node_ip>/cmadmin)

    - Cisco Unified Serviceability (https://<node_ip>/ccmservice)

    - Disaster Recovery System (https://<node_ip>/drf)

    - Cisco Unified Operating System Administration (https://<node_ip>/cmplatform)

    - Cisco Unified Reporting (https://<node_ip>/cucreports)

    - Command-Line Interface (CLI)


    Each of these (with the exception of the CLI) is accessible via its own URL or
    by using the navigation pull-down at the top right of the page and clicking the
    Go button next to it.

    The account and password defined at install for platform administration is used
    to access Disaster Recovery and the Operating System Administration pages. Likewise,
    the application account and password defined during install is used to access
    the CM Administration, Serviceability, and Unified Reporting interfaces. Additional
    accounts can be created and assigned administrative privileges so that they may
    also access these interfaces.

    During install, an additional password is defined as the security password. This
    password is needed to connect to the Publisher database (for Subscriber servers
    or other Unified Communications applications that use the Publisher database).


    # Cisco Unified Communications Manager Administration Interface


    The CM Administration interface (as shown in Figure 8-1) includes nine menus for
    the following (a brief description is given for the tasks that each menu can perform;
    this is by no means an exhaustive list, and there are many tasks not listed):


    +   - System menu: Includes tasks for the configuration of CM groups, Presence
    groups, Device Mobility Groups, Device Pools, Regions, Locations, Enterprise and
    Service Parameters, Survivable Remote Sitephony (SRST), and others.

    - Call Routing menu: Includes tasks to define the call routing system, Call Hunting,
    Class of Control, Intercom, and features such as Call Park, Call Pickup, and many
    more.

    - Media Resources menu: In this menu, resources such as Music On Hold (MOH), annunciator,
    media termination points, and transcoders can be defined and hold-misc files managed.

    - Advanced Features menu: Under this menu, VoiceMail integrations,com Media Engine
    Configuration, Extension Mobility Cross-Cluster, and VPN features are configured.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_250_0.png)


    # Figure 8-1 CUCM Administration Home Page


    +   - **Device menu:** Provides configuration pages for gateways, gatekeepers,
    trunks, IP phones, and Remote Destinations, plus many device settings, including
    phone button and softkey templates.

    - **Application menu:** Accesses the CUCM Assistant Configuration Wizard and the
    Plug-ins menu.

    - **User Management menu:** Accesses the Application User, End User, Group, and
    Role configuration pages.

    - **Bulk Administration menu:** Provides many options to perform repetitive tasks
    (such as adding many users or phones) in an automated way. There are many additional
    and powerful capabilities of the BAT tool not listed.

    - **Help menu:** Provides access to the local searchable help files, This Page
    help, and the About information page.


    # Cisco Unified Serviceability Administration Interface


    The Cisco Unified Serviceability interface (shown in Figure 8-2) provides five
    menus, each with submenus, as summarized in the following:


    +   - **Alarm menu:** Provides Configuration and Definition options for alarms
    to monitor system performance and health.

    - **Trace menu:** Provides the Configuration and Troubleshooting Trace Settings
    sub-menus, which monitor the system and troubleshoot.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_251_0.png)


    Figure 8-2 Cisco Unified Serviceability Interface for CUCM


    +   **SNMP menu:** The submenu (V1/V2c, V3, and SystemGroup) control Simple Management
    Protocol (SNMP) connectivity and authentication to network management applications.


    +   **Help menu:** Provides access to the searchable Contents help, This Page
    help, and About information.


    What is the difference between Feature services and Network services? Network
    services are automatically activated and required for server operation (such as
    Cisco CallManager Admin Service, DB Replicator, and CDP). Network services cannot
    be deactivated, but can be started, stopped, and restarted.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Feature services are optional services that can be activated using the Service
    Activation page. These services might not be activated on a particular server
    in a large cluster where the design calls for assigning a particular role to a
    server. For example, the Cisco CallManager, TFTP, or IP Voice Media Streaming
    Apps might be active or inactive depending on the server''s job(s) in the cluster.


    # Cisco Unified Operating System Administration Interface


    The Cisco Unified Operating System interface (shown in Figure 8-3) allows an administrator
    to monitor and interact with the Linux-based operating system platform. Administrative
    tasks that can be performed here include the following:


    +   - Monitor hardware-resource utilization (CPU, disk space)

    - Check and upgrade software versions

    - Verify and change IP address information

    - Manage Network Time Protocol (NTP) server IP addresses

    - Manage server security including IPSec and digital certificates

    - Create a TAC remote assistance account

    - Ping other IP devices


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_252_0.png)


    Figure 8-3 Cisco Unified OS Administration Interface for CUCM'
