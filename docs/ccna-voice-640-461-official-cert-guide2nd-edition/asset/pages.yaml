    \ group chat rooms where the conversation persists even when all participants\
    \ have left the chat session. If Persistent Chat is enabled, it requires an external\
    \ database to store the chat rooms and conversations. Offline IM chat messages\
    \ to be sent to users who are currently offline; these messages are stored in\
    \ the local IDS database on the CUPC server.\n The Jabber XCP message routing\
    \ system\n\nThe Jabber XCP message routing system has been modified in the CUPC\
    \ implementation to improve functionality when users are available on multiple\
    \ devices. Messages are\n\n> Topic"
  merge: -1
