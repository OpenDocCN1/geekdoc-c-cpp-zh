- pgno: 429
  md: '# Foundation Topics


    # Troubleshooting


    When troubleshooting, employing a consistent and systematic methodology saves
    time and helps prevent errors that might make the situation worse. The sequence
    of de-scribed in this section is supported by Cisco best practices as one model
    for effective troubleshooting. Figure 15-1 illustrates the troubleshooting sequence.
    This same model and process is also seen in Chapter 16, "Management and Troubleshooting
    of Cisco Unified Communications Manager," because it also applies to Cisco Unified
    Communications Manager (CUCM) troubleshooting.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_429_0.png)


    Figure 15-1 Troubleshooting Methodology


    The steps illustrated in Figure 15-1 are described here:


    +   1. **Define the problem:** Analyze the symptoms and probable causes. Compare
    current conditions to a baseline "normal" condition.

    2. **Gather facts:** Collect and consider command outputs and user statements.
    Eliminate possible causes to reduce the number of potential issues. Ask: When
    did this problem occur? What changed before the problem started? Is it intermittent
    or constant? Is there a pattern to the intermittency? Are there any error messages?
    Does anyone else have the problem?

    3. **Consider possibilities:** Based on the facts gathered in Step 2, identify
    a short list of likely causes. This may be a quick, almost intuitive process,
    or it might require significant research and discussion.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '4. Create action plan: Beginning with the most likely cause on the list from
    Step 3, define a plan of action to correct the problem. The plan should modify
    only one variable at a time, so that the effect of that one change can be easily
    evaluated.


    5. Implement an action plan: Execute the commands or make the changes decided
    in Step 4. Do not improve; if new information or ideas come up, you may want to
    start at Step 3 again. At each step, make sure that the action taken does not
    make the problem worse—if it does, undo the change. Minimize the impact of changes
    on production systems, by specifically limiting the duration of security vulnerabilities,
    such as temporarily removing access lists to see if they are the problem.


    6. Observe results: Has the problem been solved?


    +   6a. Unsolved: If the problem is not solved, undo the change implemented in
    Step 5 and return to Step 4.


    +   6b. Solved: If the problem is solved, document the solution, root cause, and
    the changes made to the system.


    # # Troubleshooting Common CME Registration Issues


    I’m sure many of you have had the experience when a friend or family member calls
    and says, "My computer is not working." Instinctively, your mind begins to narrow
    down this broad statement by asking questions, such as, “Are there lights on the
    PC? Does the monitor display an image? Do applications open? Do you smell smoke?”
    Based on these questions, you can begin defining a plan of action.


    In the same sense, troubleshooting IP telephony issues requires you to ask questions
    to help narrow down the many possible issues to a focused troubleshooting process.
    For example, if you receive a call from a user who states, "My IP phone is not
    working." You might ask the probing questions, “How are you talking to me now?
    Does the IP phone show your extension number on the screen? Is there any dial
    tone when you lift the handset? What happens when you dial? What messages are
    on the screen right now? Does it seem like the phone is rebooting? When you noticed
    the phone stop working?


    All these questions are geared towards your troubleshooting into one of the following
    areas:


    +   - Issues relating to the network


    +   - Issues relating to the IP phone configuration


    +   - Issues relating to CME configuration


    Just like any data device, an IP phone relies on the network and supporting servers
    to operate correctly; without them, the IP phone will not function. The absolute
    biggest thing for you to know when troubleshooting network-related issues is the
    boot process of the Cisco IP phone (see Figure 15-2). This was covered in earlier
    chapters, but we add it here for discussion.


    +   1. 802.3af Power over Ethernet (PoE) switch sends a small DC voltage on the
    Ethernet cable, detects an unwanted 802.3af device, and supplies power to the
    line.


    +   2. The switch delivers VLAN information to the Cisco IP Phone using Cisco
    Discovery Protocol (CDP).


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_430_0.png)'
  merge: -1
  img_proc: true
- pgno: 431
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_431_0.png)


    Figure 15-2 Cisco IP Phone Boot Process


    +   3. The IP phone sends a DHCP request on its voice VLAN. The DHCP server replies
    with IP addressing information, including DHCP Option 150, which directs the IP
    phone to the TFTP server.

    4. The IP phone contacts the TFTP server and downloads its configuration file
    and firmware.

    5. Based on the IP address listed in the configuration file, the IP phone contacts
    the call processing server (the CME router, in this case), supports VoIP functions.


    Knowing this boot process virtually plans your troubleshooting process for you!
    Anytime a Cisco IP Phone gets stuck in the boot process (for example, it is unable
    to get a DHCPassigned address, reach a TFTP server, or register with the CME router),
    it reboots itself and tries again. You get get clues as how far the phone is getting
    in the boot process by carefully watching the messages on the screen. The IP phone
    tells you when it attempts to configure a voice VLAN, obtain an IP address, or
    contact a TFTP server. By watching the screen, you can identify the step where
    the phone stops in the boot process and begin your troubleshooting from that point.


    > Tip: Keep in mind that it is normal for a newly installed IP phone to reboot
    several times because of firmware and configuration updates.'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'Here''s the process you should use for troubleshooting network-related issues:


    # Issue 1: Verifying PoE


    Obviously, if the IP phone does not receive power, nothing is going to work correctly.
    You can quickly diagnose this issue by asking the user if her phone is displaying
    anything on the screen. If not, here are your areas of focus:


    +   - Check the physical connections: Verify that the IP phone is securely plugged
    in, verify all patch panel connections, and verify the Ethernet cable used has
    all eight pins functioning properly (because PoE uses the four pins not used by
    data).


    +   - Check the PoE switch: Ensure that the switch is online and operational,
    verify that the PoE clients have not exhausted the switch power supply using the
    show power inline command, and use a show run command to verify that the port
    does not have the command power inline never (which disables PoE).


    +   - Check the IP phone: Verify that the IP phone does not have expansion modules
    causing it to exceed PoE capabilities, move the IP phone to a different port to
    see if it receives power, try a different IP phone on the same port to see if
    it receives power, and be sure that the IP phone and PoE switch support a compatible
    PoE standard (Cisco inline, 802.2af, and 802.3at).


    > Tip: Before you move too far into the troubleshooting process, it''s always
    best to reset the phone''s configuration settings to default factory. Although
    the various IP phones have different locations to reset the configuration, all
    of them will have the option. Often, a bogus configuration item will end up in
    one of the key fields that you may not initially see. Resetting the phone configuration
    gives you a clean starting ground to work.


    # Issue 2: Voice VLAN Assignment


    If an IP phone is assigned to the wrong VLAN, it may not be able to contact the
    supporting servers (DHCP, TFTP, CME, and so on). You can diagnose this and the
    following issues when you receive a report that the IP phone is continuously rebooting:


    +   - Check the switch configuration: Ensure that you correctly configured the
    voice VLAN by viewing the running-configuration (show run), verifying the interface
    operating mode by entering a show interface <interface name>switchport command,
    verifying that you created the voice VLAN on the switch (show VLAN), verifying
    that the voice VLAN is added to all applicable trunk connections (show interface
    trunk), and verifying CDP is enabled on the port connected to the IP phone (because
    the voice VLAN is sent to the IP phone using CDP).


    +   - Check the IP phone: If you have physical access to the IP phone, navigate
    to the network settings page (using the Settings button on the phone). Verify
    that the IP phone has received the VLAN configuration, verify the IP phone has
    an IP address, and access the IP address in a web browser and view the log files
    for more clues.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# Issue 3: DHCP Server


    Receiving an IP address through DHCP goes hand-in-hand with the voice VLAN assignment
    (Issue 2). If a Cisco IP Phone is not assigned to the correct VLAN, it may not
    receive an IP address from the DHCP server, or if it does, the DHCP options for
    the pool may not be correct. After you verify the VLAN configuration, you can
    use this process to troubleshoot the DHCP process:


    +   Check the DHCP helper-address: If you are using a centralized DHCP server,
    ensure a router (or L3 switch) supporting the voice VLAN is forwarding DHCP requests
    to a proxy server. (You can find the helper-address command under the router interface
    connected to the VLAN).


    +   Check the DHCP server: Verify that the DHCP server has an IP pool created
    for the voice VLAN devices, ensure that the pool has not run out of addresses,
    verify that DHCP option 15 (TFTP Server) is properly configured and assigned to
    the pool, connect other test devices (laptop or PC) in the voice VLAN, and ensure
    these devices receive IP addresses.


    +   Check the IP phone: If you have physical access to the IP phone, navigate
    to the network settings page (using the Settings button on the phone). Verify
    that the phone received an IP address from the appropriate subnet, verify all
    applicable DHCP options (subnet, default gateway, TFTP server) are filled in,
    and attempt to ping the phone from another subnet to ensure routing rules (assuming
    no access control lists [ACL] block this communication).


    Keep in mind that it''s easy to miss DHCP-related troubleshooting when other system
    issues. Because a phone experiencing communication issues constantly reboots,
    there are times when the phone does not have an IP address (which can send you
    down a wrong track of troubleshooting). Before you pull your hair out focusing
    on DHCP issues, try statically an IP configuration to the phone and see if the
    phone registers successfully with CME. If it does register successfully, the problem
    is most likely related to DHCP or VLAN issues. If not, the problem is more likely
    related to routing, TFTP, or CME issues.


    # Issue 4: TFTP Server


    The TFTP server is a critical part of the IP phone boot process because it supplies
    the phone firmware and configuration file with the base settings the phone should
    use for operation (and the IP address of the CME for registration). While CME
    supports using an external TFTP server to store all this data, CME deployments
    use the flash memory and dynamic RAM of the router to store these files. Take
    the following steps to troubleshoot TFTP communication:


    +   Check routing configuration: If the TFTP server is on a different subnet than
    the IP phone, validate that it is able to route between the two subnets by placing
    a test device (such as a laptop or PC) in the voice VLAN and testing connectivity
    to the TFTP server (by transferring files via TFTP).


    +   Check the TFTP server: Verify that the TFTP server is operational and serving
    files, validate the firmware for the IP phone model in question exists on the
    TFTP'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'server as well a specific configuration file for the phone (the configuration
    file should have the MAC address of the IP phone in the filename), and verify
    that you entered the create cnf-files command for telephony-service configuration
    mode to generate the necessary configuration files on TFTP server.


    +   Check the IP phone: If you have physical access to the IP phone, navigate
    to the network settings page (using the Settings button on the phone). Verify
    that the IP phone is configured (either statically or via DHCP) for the appropriate
    TFTP server IP address.


    # Issue 5: CME Server


    The final troubleshooting step is to investigate the CME server itself. The most
    common issue encountered is a "Registration Rejected" error message on the IP
    phone. Seeing this error is fantastic news: It means that the IP phone is moving
    through the initial boot process but fails when trying to register with the CME
    router. Almost 100% of your focus should be on the phone settings. A registration
    rejected message always appears because the IP phone has not been properly configured
    in CME. First, validate that a phone entry exists in your CME configuration for
    the IP phone in question. If so, verify that the MAC address entered for the phone
    matches the MAC address of the IP phone. Don''t trust the sticker on the outside
    of the IP phone! Verify the MAC address directly from the phone settings or the
    Cisco switch (viewing the dynamic MAC addresses learned on connecting to the IP
    phone).


    If the MAC address appears correct in the CME configuration, try enabling auto-registration
    in CME (under the telephony-service configuration). This should allow the phone
    to register without any extension assignment. You can then validate the MAC address
    of the IP phone by entering the show phone command. If you want to get into the
    nitty-gritty, use a debug phone detail command, and you''ll be able to watch the
    phone registration process line by line. Be careful with this command, because
    it might become overwhelming (to both you and your CME router) if you have many
    phones registering at the same time.


    # Troubleshooting Dial-Plan and QoS Issues


    Although this topic is bit outside the current scope of the CCNA Voice exam, it
    is extremely advantageous to you to be able to troubleshoot dial-plan and QoS
    issues. These issues occur after the IP phone successfully registers with the
    CME router and attempts to place calls. Symptoms range from call failure when
    dialing (call busy/recorder) to static, distortion, or dropped calls after the
    call is connected. The former issue is typically related to a misconfigured dial-plan,
    while the latter is related to QoS.


    # Dial-Plan Issues


    To troubleshoot issues related to the dial-plan on the CME router, you must first
    focus on the dial peers. The dial-peer configuration builds builds the routing
    table for your voice calls. If you configured it inaccurately or incompletely,
    calls will not complete. Although you can use many commands to troubleshoot calls,
    two key commands rise to the surface: show dial-peer voice summary and debug voip
    dialpeer.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_434_0.png)'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'Similar to the dial interface brief command, using dial-peer voice summary
    allows you to see a table view of all the dial peers that exist on your voice
    gateway. If calls fail as they are dialed, this is usually the best place to start.
    Use this command to verify that the expected dial peers exist, with the correct
    destination pattern configured, and point to a port or IP address that is reachable
    from the CME router. Example 15-1 shows the output of the command.


    # Example 15-1 dial-peer voice summary Command Output


    | TAG | TYPE | MIN | OPER PREFIX | DEST-PATTERN | FER THRUS-TARGET | STAT PORT
    |

    |---|---|---|---|---|---|---||

    | 20005 | pots | up | | 1500$ | 0 | | 50/0/28 |

    | 20006 | pots | up | | 1501$ | 0 | | 50/0/21 |

    | 20007 | pots | up | | 1502$ | 0 | | 50/0/22 |

    | 20008 | pots | up | | 1503$ | 0 | | 50/0/23 |

    | 20009 | pots | up | | 1504$ | 0 | | 50/0/24 |

    | 20010 | pots | up | | 1505$ | 0 | | 50/0/25 |

    | 20011 | pots | up | | 1506$ | 0 | | 50/0/26 |

    | 20012 | pots | up | | 1507$ | 0 | | 50/0/27 |

    | 20013 | pots | up | | 1508$ | 0 | | 50/0/28 |

    | 20014 | pots | up | | 1509$ | 0 | | 50/0/29 |

    | 1101 | pots | up | | 1101 | 0 | up 0/0/0 |

    | 1102 | pots | up | | 1102 | 0 | up 0/0/1 |

    | 1200 | voip | up | | 91................ | 0 | syst ipv4:67.215.241.250 |

    | 1201 | voip | up | | 9*[1]:[2-9].... | 0 | syst ipv4:67.215.241.250 |


    In this example, if you tried to call the destination 916025551212, you could
    identify a match on dial 1200.


    Now, verifying that a dial peer matches a dialed string and actually completing
    a call can be two different things. If you verify the dial peer and still receive
    reorder tones, you can use the debug voice dialpeer command. This command shows
    digits as they are dialed, as shown in Example 15-2.'
  merge: -1
  img_proc: true
