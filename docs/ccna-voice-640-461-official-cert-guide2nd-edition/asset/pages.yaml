- pgno: 352
  md: '# Enabling Mobility Features in CUCM


    The explosion in mobile technology has made communication possible from a huge
    array of devices, including home phones, cellular phones, WiFi-enabled smartphones,
    tablets, laptops, desktops, and specialized wireless IP phones. It has never been
    easier to stay in touch. But all this has created its own set of problems: Managing
    all the different methods of communication, all the phone numbers and voicemail
    boxes takes increasingly more time and creates more confusion.


    In a business environment (and increasingly in a personal context), this confusion
    creates inefficiencies that actually impair communications instead of facilitating
    them. That might mean a loss of valuable business or simply missing an important
    call. The Mobility feature allows a person to be reached at a single number, and
    to place calls from any device and have all calls appear to come from that same,
    creating a consistent point of voice contact and greatly simplifying the management
    of voice communications with an individual.


    This chapter defines, describes, and reviews the implementation steps for both
    of these mobility features, explaining the advantages, drawbacks, and integration
    of each with the Cisco Unified Communications Manager (CUCM) architecture.


    # “Do I Know This Already?” Quiz


    The “Do I Know This Already?” allows you to assess whether you should read this
    entire chapter or simply jump to the “Exam Preparation Tasks” section for review.
    If you are in doubt, read the entire chapter. Table 12-1 outlines the major headings
    in this chapter and the corresponding “Do I Know This Already?” questions. You
    can find the answers in Appendix A, "Answers Appendix.",


    | Foundation Topics Section | Questions Covered in This Section |

    | --- | --- |

    | Mobile Connect | 1–3, 6 |

    | Mobility (General) | 4–5 |

    | Mobile Voice Access | 7–9 |'
  merge: -1
  img_proc: true
