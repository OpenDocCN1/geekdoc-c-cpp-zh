- pgno: 343
  md: '# Configuring Intercom Features


    As previously discussed, the Intercom feature uses special Intercom DNs, Partitions,
    and Calling Search Spaces. The following steps walk through setting up the Intercom
    feature:


    +   1. Navigate to Call Routing > Intercom Route Partition.

    2. Click Add New. In the Configuration Page, enter the name and comma-separated
    description of the new Intercom Partition. You can create up to 75 Partitions
    at once on this page.

    3. Click Save.

    4. Navigate to Call Routing > Intercom > Intercom Calling Search Space. Click
    Find, and note that an Intercom CSS will be automatically created as a result
    of creating the Intercom Partition (the auto-named entry will be \<partition_name>_GEN).
    The auto-generated CSS automatically includes the Intercom Partition just created.
    You may use the auto-generated CSS to modify it, or create custom Intercom CSSs
    as desired.


    Note: A custom Intercom CSS is really only necessary if an Intercom button needs
    to support multiple (dialed instead of dialed) targets, and access to some of
    those targets must be limited. If you are creating point-to-point Intercom lines,
    there is no need to customize the Intercom CSS.


    +   1. Navigate to Call Routing > Intercom > Intercom Directory Number.

    2. Click Add New to create an Intercom DN. You must create at least two, because
    of the one-way nature of Intercom DNs and the fact that an Intercom DN cannot
    call an ordinary DN.

    3. Assign an Intercom Partition and Intercom Calling Search Space to the Intercom
    DNs according to your call control design.


    To configure a phone with an Intercom button, the Phone Button Template will be
    modified. (Alternatively, you could modify the phone directly from the Configuration
    page, but this kind of one-off configuration is more difficult to administer and
    does not scale well.) To set up and apply the Phone Button Template, follow these
    steps:


    +   1. Navigate to Device > Device Settings > Phone Button Template.

    2. Select the Phone Button Template that corresponds to the phone/protocol for
    which you want to configure Intercom. You may modify the stock profile, copy and
    modify the copy, or create a new one from scratch. Copying and modifying the copy
    is the recommended action.

    3. In the Phone Button Template configuration window, add the Intercom feature
    to the desired button appearance.

    4. Click Save.


    Figure 11-18 shows the Phone Button Template configuration.


    Now that the DNs and template set up, we can assign the template to the phones:


    +   1. Apply the template to a phone by selecting the modified template from the
    pull-down in the phone''s configuration page.'
  merge: -1
  img_proc: true
