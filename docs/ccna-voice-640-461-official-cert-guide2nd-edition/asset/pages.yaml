- pgno: 447
  md: '# # Foundation Topics


    # ## Describe How to Provide End-User Support for Connectivity and Voice Quality
    Issues


    Troubleshooting a complex application like CUCM can be challenging. The scope
    of CCNA Voice (ICOMM) requires us to keep it relatively simple, so by no means
    should be considered a comprehensive CUCM troubleshooting manual. In this chapter,
    you learn how to troubleshoot basic IP Phone registration issues and look at the
    extensive reporting capabilities of the CUCM system, which you monitor the health
    and well-being of the servers in your deployment.


    Note the following section on troubleshooting methodology is duplicated in Chapter
    9. "Managing Endpoints and End Users with CME." It appears again here because
    it is important, and it makes it easier to refer to as you read this chapter.


    # Troubleshooting


    When troubleshooting, employing a consistent and systematic methodology saves
    time and helps prevent errors from making the situation worse. The sequence of
    steps described is supported by Cisco best practices as one model for effective
    troubleshooting, Figure 16-1 illustrates the troubleshooting sequence.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_447_0.png)


    Figure 16-1 Troubleshooting Methodology'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'Here are the steps illustrated in Figure 16-1:


    +   1. **Define the Problem:** Analyze the problem and create a clear problem
    statement. Define symptoms and probable causes. Compare current conditions to
    a baseline "normal" condition.


    +   2. **Gather Facts:** Collect and use command outputs and user statements.
    Eliminate possible causes to reduce the number of potential issues. Ask: When
    did this problem occur? What changed before the problem started? Is it intermittent
    or constant? Are there any error messages? Is anyone having the problem?


    +   3. **Consider Possibilities:** Based on the facts gathered in Step 2, identify
    a short list of likely causes. This may be a quick, almost intuitive process,
    or it may require research and discussion.


    +   4. **Create Action Plan:** Beginning with the most likely cause on the list
    from Step 3, define a plan of action to correct the problem. The plan should modify
    only one variant at a time, in order that the effect of one change can be easily
    evaluated.


    +   5. **Implement Action Plan:** Execute the commands or make the changes decided
    in Step 4. Do not improvise: If new information or ideas come up, you may want
    to start at Step 3 again. Make sure at each step the action taken does not make
    the problem worse—if it does, undo it. Minimize the impact of changes on production
    processes, especially limiting the duration of security vulnerabilities, such
    as temporarily removing access lists to see if they are them.


    +   6. **Observe Results:** Has the problem been solved?


    +   7a. Unsolved: If the problem is not solved, undo the change implemented in
    Step 5 and return to Step 4.


    +   7b. Solved: If the problem is solved, document the solution, the root cause,
    and the changes made to the system.


    +   8. You are done.


    A list like that (which you need to memorize) needs a good mnemonic. Here’s one
    for you: Define, Gather, Consider, Create, Implement, Observe: "**Dogs Gobble
    Cookies, Cats Interact.**"


    # Troubleshooting IP Phone Registration Problems


    The IP Phone registration process is deceptively complex, and several discrete
    areas may cause problems—and, of, if one step fails, subsequent steps fail, too.
    That being the case, you can use a Divide and Conquer methodology: Quickly check
    which steps have succeeded, and then start troubleshooting from the first point
    of failure. IP phone registration problems can be categorized according to the
    following points of failure:


    +   * Local to the IP Phone


    +   * VLAN or switch mismatches


    +   * DHCP problems'
  merge: -1
  img_proc: true
- pgno: 449
  md: '+   - TFTP problems


    +   - CUCM registration problems


    Let''s examine a scenario where the phone is not registering. In this scenario,
    the phones are supposed to be used by DHCP. Each point that follows describes
    a possible place where problems might be happening. Best practices dictate that
    we follow these troubleshooting procedures in the order that follows: there will
    be times when experience or specific knowledge allows us to skip to a later procedure:


    +   - Local to the IP Phone: The Phone itself can display its current configuration
    and settings, which can quickly indicate which part of the sequence has failed.
    Press the Settings button, and then select Network Configuration from the displayed
    list. Scroll down to IP Configuration and verify that the phone has received an
    IP address (in the correct subnet), subnet mask, default gateway, and the correct
    TFTP server address. If the entries are absent or incorrect, verify that the phone
    is configured to use DHCP by pressing Settings > Network Configuration, and then
    scrolling down to DHCP Enabled and verifying that it is set to Yes. If all is
    correct, but the phone is still not receiving an address from DHCP, move on to
    the next step.


    +   - VLAN or switch mismatches: Verify that the switch is correctly configured
    to support IP Phones. The switch should have a voice VLAN defined, and if there
    is a PC connected to the phone, a separate VLAN (See Chapter 3, "Understanding
    the Cisco IP Phone Concepts and Registration," for the configurations). Verify
    that the VLAN numbers are correct. If the switch configuration is correct, move
    on.


    +   - DHCP problems: Verify that the DHCP server is running and has not run out
    of IP addresses. Make sure that the DHCP scopes (subnets or pools) are correct
    with respect to the IP address range have been assigned, the subnet mask, default
    gateway, and Option 150 (TFTP server IP address). On the IP Phone, navigate to
    Settings > Network Configuration. Verify that the DHCP Server entry lists the
    IP address of the correct DHCP server. Check that an IP address has been assigned,
    and if so, that it is in the correct range. Verify that the TFTP Server 1 address
    entry is correct.


    > Note: If the DHCP server is on a remote subnet of IP phones, the local router
    blocks DHCP broadcasts by default. Use the ip-helper<ip address> command on the
    local router to allow it to forward DHCP requests to the IP of the DHCP server.


    +   - TFTP problems: As it boots up, the phone queries the TFTP server (at the
    address learned via DHCP) for its configuration file. The filename it asks for
    is SEP<mac>.cnf.xml. If the phone has been successfully added to the CUCM or Cisco
    Communication Manager Express (CME) application, the file will exist and be downloaded
    to the phone. If the phone has not been added to the application before, the file
    will not be there. The phone will then ask for the file called XMLDe-cnf.xml.
    This default file is always available. If the phone is not getting its config
    file, verify that the phone has the correct TFTP address in the Network Configuration
    list. Verify that the TFTP service is running on the server at that IP. You can
    check on the status of the TFTP process on the phone by pressing Settings > Status
    Messages:'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'example messages include Not Found:SEP<mac address>.cnf.xml, TFTP Timeout:SEP<mac
    address>.cnf.xml, and SEP<mac address>.cnf.xml.


    +   - CUCM registration problems: The TFTP download file contains the IP address
    of the CUCM server with which it is supposed to register. Check Settings > Device
    Configuration > Unified CM Configuration to verify that the Unified CM IP address
    listed is correct. There may be a backup and tertiary server IP listed, depending
    on how the cluster is configured. Verify that the CallManager Service is running
    on the server(s) listed; you may also need to verify that autoreistration is correctly
    set up (if you are actually using Autistration, of course).


    If all the previous are verified as correct, there may be a problem with the phone
    itself; that type of troubleshooting is beyond the scope of CCNA Voice.


    # Deleting Unassigned Directory Numbers using the Route Plan Report


    When using Autistration, one of the more common issues encountered is that the
    phone fails to register, displaying "Error DB Config" or a similar message on
    the IP Phone screen. The source of the problem is that the range of Directory
    Numbers (DNs) allocated for Autistration has been used up; Autistration is working,
    but there are no DNs available to assign to the phones. This situation arises
    because it is normal practice to change the DN of an autoregistered phone (which
    is assigned sequentially from the range defined for Autistration) to its "real"
    production DN. An odd thing happens to the Autistration-assigned DN: It is not
    released back to the available range, but instead is marked as "Unassigned" and
    held in "database limbo." Unassigned Autistration DNs are not visible unless you
    go looking for them, so it is not obvious that they are the source of your problem.


    The fix is simple: Add either to the range of Autistration DNs, or use the following
    steps to "reclaim" them so they can be re-used on newly-registering phones:


    +   - Navigate to System > Route Plan Report.

    - Set the first filter (left-most field) to "Unassigned DNs."

    - Click Find.

    - Delete all of the listed unassigned DNs. This can be done easily by selecting
    all the listed DNs using the checkboxes to their left and then clicking Delete
    Selected.


    The DNs are now released back to the Autistration range as available for assignment.

    These steps are also used to "clean up" the database after modifications to your
    Partitions design. Another interesting behavior of the CUCM database is when a
    DN is assigned to a different Partition, it still exists in the previous one but
    is flagged as unassigned. These unassigned DNs can create confusion, because they
    do appear in lists as selectable (for example, when building a Line Group)—but
    they do not function because they are not assigned to any device.


    You should be familiar with using the Route Plan Report to delete unassigned DNs
    as a routine maintenance task.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_450_0.png)'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# Describe CUCM Reports and How They Are Generated


    CUCM includes numerous reporting tools. This section reviews how to generate and
    access these reports, and how to use them for troubleshooting, maintenance, and
    system analysis.


    The Cisco Unified reporting tool pulls information from a range of sources, and
    formats the data into a single simplified output. The report tool alerts the user
    if the report job will cause performance issues for the server or take an excessive
    amount of time.


    The reports pull data from the Publisher and the subscribers, including the following
    sources:


    +   - Real-Time Monitoring Tool (RTMT)

    - Call Detail Records (CDR) and the CDR Administration and Reporting database

    - CUCM database

    - Disk files (traces and logs)

    - Prefs settings

    - CLI

    - Real-Time Information Server (RIS)


    The reporting system uses the Cisco Tomcat service and Remote Procedure Calls
    (RPC) to the other servers via HTTPS. Make sure the Tomcat service is running
    and that HTTPS traffic can reach and return from the servers.


    # Generating Reports


    Access the Cisco Unified Reporting tool from the navigation drop-down at the top
    right of the CUCM Administration interface or directly via the URL https://<ip_address>/reports.
    By default, only the users with the necessary privilege to view the reports are
    members of the CUCM Super Users Group, the only member of which by default is
    the CUCM application administration defined at install.


    The reports are accessed under the System Reports menu, as shown in Figure 16-2.

    Select the desired report from the menu list. The Reporting tool stores one of
    each previously created report for later access; if the report selected has not
    been run before, a message is displayed, indicating that the report does not exist
    and the user should generate a new report. The Generate New Report link is directly
    below this message.


    If an old copy of the report exists, a message is displayed to that effect, and
    a link to the report is listed. Bear in mind that the report contains old information;
    check the time/date stamp on the report to be sure the report is recent enough
    to be valid. To recreate the report, click the icon at the top right to run it
    again.


    Figure 16-3 shows a sample report (in this case, a Device Counts Summary). The
    green checkmark at the top indicates that the report ran successfully. The other
    buttons to the right side of the page allow you to upload an XML report that is
    stored on your local workstation to keep it on the CUCM server, download the report
    to your local workstation, or run it again.'
  merge: -1
  img_proc: true
- pgno: 452
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_452_0.png)


    **Figure 16-2** Cisco Unified Reporting: System Reports Menu


    # Analyzing Reports


    The reports you generate can be used as part of the following tasks:


    +   - **Troubleshooting:** For gathering facts, considering possibilities, and
    observing results.

    - **Maintenance:** Find configuration or load mismatches, and summarize system
    information.

    - **System Analysis:** List phones by type, feature, or several other filters.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# 424 CCNA Voice 640-461 Official Cert Guide


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_453_0.png)


    Figure 16-3 Unified Reporting: Sample Report


    # Understanding CUCM CDR Analysis and Reporting Tool Reports


    In this section, we review the Call Detail Record Analysis and Reporting (CAR)
    tool—its general parameters, system settings, scheduler options, and database.
    This section also goes over how to generate reports using these users, the system,
    and devices.


    Every call CUCM processes can be logged. These logs, called Call Detail Records
    (CDR) and Call Management Records (CMR), contain information about the call and
    the voice quality metrics for the call. These CDRs are stored as flat files on
    subscriber servers and uploaded to the CDR/CAR database on the Publisher at regular
    intervals (the interval can be manually set). In addition to providing information
    for interstellar administrative purposes, the CDR database can be used by third-party
    billing applications to prepare internal or external billing reports.


    Administrators can pull reports manually using the web interface at https://<ip
    address>/ or set up reporting jobs to occur automatically. The option to load
    CMRs in addition to CDRs is determined administratively; CMRs are not loaded by
    default. Figure 16-4 shows the CAR Reports tool.


    # Activate CAR-Related Services


    To use CAR, the Cisco CAR Web Service must be activated:


    +   1. From the Unified Serviceability page, navigate to Tools > Service Activation.
    Select the Cisco CAR Web Service and click Save.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# Chapter 16: Management and Troubleshooting of Cisco Unified Communications
    Manager 425


    CDR Analysis and Reporting - Cisco Firewall


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_454_0.png)


    Figure 16-4 CAR Report Tool


    +   2. If an external billing server is to be used, you must also activate the
    Cisco SOAP-CDRDemand Service. (SOAP stands for Simple Object Access Protocol).


    # Configure CDR Service Parameters


    In the CM Administration interface, navigate to System > Service Parameters. Select
    a server from the first drop-down, and then select the Cisco CallManager service.
    Click the Advanced button at the top of the page to display all parameters. Adjust
    the following as:


    +   * CDR Enabled Flag: This setting determines whether CDRs will be generated.
    This must be set on all servers. The default is False (CDRs not collected).


    +   * CDR Log Calls with Zero Duration Flag: Setting this parameter to True causes
    CUCM to generate CDRs for calls that never connect or that last less than 1 second.
    Calls that are unsuccessful (including calls that result in longer or fail because
    of a busy tone) are always logged regardless of this setting. The default is False.


    +   * Call Diagnostics Enabled: This parameter enables the logging of CMRs. You
    have the choice to not generate CDRs, generate them only if CDRs are also being
    generated, or to generate CMRs whether CDRs are being collected or not. The default
    is Disabled.


    +   * Display FAC in CDR: This parameter controls whether the Forced Authorization
    Code used to make a call will be included in the CDR. The default value is False.'
  merge: -1
  img_proc: true
- pgno: 455
  md: '+   -Line Group Member DN in finalCalledPartyNumber CDR Field: For calls to
    Hunting systems, this parameter determines whether the Pilot number or the DN
    that picked up the calls is recorded in the CDR. The default is False (the Hunt
    Pilot number is recorded, not the DN).


    +   Add Incoming Number Prefix to CDR: This parameter controls whether incoming
    prefix (several are defined in the service parameters) is added to the calling
    party number in CDRs; Prefixes added to an inbound call are always recorded in
    CDRs; this setting controls whether prefixes are added to CDRs if they are added
    to outbound calls. The default value is False.


    # CAR Tool Users


    The CUCM CAR allows three types of users to have access to the tool:


    +   -Administrators use the tool to access all reporting features to build reports
    for system performance analysis, load balancing, and troubleshooting purposes.
    Any end user or application user can be given administrator access to the CAR
    tool by making them member of the Standard CAR Admin Users Group.


    +   -Managers generate reports for users, departments, and Quality of Service
    (QoS). Managers are defined by the Manager User ID in CM Administration: If User
    A''s is selected as the Manager User ID on User''s configuration page, User A
    can run Manager reports on User B. Managers can set up automatic reports to be
    delivered to their configured mail ID.


    +   -Users generate a billing report for their calls. Users can generate reports
    for a specific date and can have the system e-mail the report. Users must be members
    of the standard CCM End Users Group to access these reports, and the devices they
    want to generate reports for must be associated with their account.


    # CDR and CMR Architecture


    CDRs are generated by CUCM servers that are processing calls (those that are running
    the CallManager Service). The CDRs contain information about the called and calling
    numbers, the time/date stamp for connect and disconnect, and why the call was
    disconnected. CMRs contain information about latency, jitter, packet loss, and
    the amount of data sent during the call. Each call may generate several CDRs and
    CMRs. The processing nodes collect the CAR data (the collective term for CDRs
    and CMRs) in a local log and periodically upload them to the CDR repository node
    using SFTP. The repository node runs the CDR Repository Manager Service, which
    is responsible for maintaining the CDR and CMR files, managing the disk space
    used by the CDR data, and sending the files to (up to) three configured locations
    (typically, these are third-party billing servers).


    # CAR System Parameters


    The CAR system requires some setup to function most effectively. The following
    tasks need to be completed:


    +   -Configure Mail Parameters so the CAR system can send reports and alerts by
    e-mail.'
