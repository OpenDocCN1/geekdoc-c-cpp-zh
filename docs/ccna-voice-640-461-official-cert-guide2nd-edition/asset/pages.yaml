    # Configuring After-Hours Call Blocking


    In the traditional telephony realm, there have been many recorded incidents of
    unauthorized calls being placed after-hours, when most, if not all, staff has
    left for the evening. To prevent this, you can implement after-hours call blocking
    on CME.


    After-hours call blocking allows you to define ranges of times specified as after-hours
    intervals. You can then list number patterns that are disallowed during those
    intervals. If a user places a call during the after-hours time range that matches
    one of the defined patterns, CME will play a reorder tone and disconnect the call.


    Of course, there are exceptions to every rule. You may want to have some phones
    completely exempt from the policy, or give users a "back door" around the restrictions
    if they are working late and need to make business-related calls that CME would
    typically restrict. After-hours call blocking configuration on CME provides for
    both of these scenarios. You have the option to completely exempt certain IP phones
    from the after-hours restrictions or provide users with a PIN they can enter into
    the IP phone. If they enter the PIN correctly, CME exempt the IP phone from the
    after-hours policy for a configurable amount of time.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_229_0.png)


    Figure 7-19 Configuring Multiple-Group Paging in CCP


    Note: There are some patterns that may be beneficial to block all the time. For
    example, 1-900 numbers in the United States often represent high-cost, less-than-reputable
    business-es that are typically banned by all corporate environments. CME also
    allows you to create 24/7, nonexemplary pattern that is disallowed at all times,
    using the after-hours call system.


    After-hours call blocking has three major steps of configuration:


    +   - Step 1. Define days and/or hours of the day that your company considers
    off-hours.

    - Step 2. Specify patterns that you want to block during the times specified in
    Step 1.

    - Step 3. Create exemptions to the policy, if needed.


    You will perform most of the configuration for the after-hours call blocking restrictions
    from telephony service configuration mode. Example 7-11 demonstrates the after-hours
    time intervals.


    # Example 7-11 Configuring After-Hours Time Ranges and Dates


    ```

    CME_Voice(config)# telephony-service

    ME_Voice(config-telephony)# after-hours =

    block define after-hours block pattern

    date define month and day

    ```'
