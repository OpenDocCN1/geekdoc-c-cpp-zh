    +   2. Enter a number for the Mobile Voice Access Directory Number. This number
    is the internal number to which the H.323 MVA gateway will forward calls it receives
    on the PSTN number for MVA access. On the gateway, a dial peer must be configured
    that matches the PSTN MVA number to the MVA CUCM server.


