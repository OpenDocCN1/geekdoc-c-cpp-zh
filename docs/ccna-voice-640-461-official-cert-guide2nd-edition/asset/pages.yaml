    routing the call. This is useful for dial peer 93 in Example 6-12. Because international
    numbers can be a variable length, it is impossible to tell what value to enter
    for the forward-digits command. By using the prefix 011 command, the automatic
    digit-stripping feature of POTS, dial peers strip the explicitly defined 9011
    digits from the pattern, and the prefix adds the 011 back in its place.


