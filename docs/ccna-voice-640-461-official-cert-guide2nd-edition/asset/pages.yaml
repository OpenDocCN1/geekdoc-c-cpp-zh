    **Figure 17-7** Server Report


    # # Troubleshooting and Maintenance Operations Using Cisco Unity Connection Reports**


    The CUC Serviceability Reports provide insight into what is happening on the server.
    For example:


    +   - An administrator might run the **Phone Interface Failed Logon Report** to
    see if there are a significant number of failed logins for a given time period.
    If there are, the next question is whether these failed attempts to log in are
    a user issue (which could be resolved by talking with the user) or evidence of
    an attack to hack the user''s mailbox. Figure 17-8 shows the Phone Interface Failed
    Logon Report.


    +   - The User Lockout Report (often run in conjunction with the **Failed Login
    Report**) provides a list of which accounts are locked, why, and when they were
    locked. The administrator can then contact the locked-out users and take any corrective
    action required; then, in the CCM Administration web application, the administrator
    can navigate to **Users > Users**, select the affected user, navigate to **Edit
    > Password Settings**, and click **Unlock Password** to unlock the user''s account.
    Figure 17-9 shows the User Lockout Report.'
  merge: -1
  img_proc: true
