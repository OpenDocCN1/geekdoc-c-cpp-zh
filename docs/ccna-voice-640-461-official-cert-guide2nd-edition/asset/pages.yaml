- pgno: 87
  md: 'Using this process, the PC never knows what VLAN belongs to. The VLAN tag is
    applied when the incoming frames cross a trunk port. The VLAN tag is removed when
    exiting the port to the destination PC. Always keep in mind that VLANs are a switching
    concept; the PCs never participate in the VLAN tagging process.


    VLANs are not a Cisco-only technology. Just about all managed switches support
    VLANs. In order for VLANs to operate in a mixed-vendor environment, a common trunk
    or "tagging" language must exist between them. This language is known as 802.1Q.
    All vendors design their switches to recognize and understand the 802.1Q tag,
    which allows us to trunk between switches in any environment.


    # Understanding Voice VLANs


    It is common and recommended practice to separate voice and data traffic by using
    VLANs. There are already easy-to-use applications available, such as Wireshark
    and Voice Over Misconfigured Internet Telephones (VOMIT), that allow intruders
    to capture voice conversations over the network and convert them into WAV files.
    Separating voice and data traffic using VLANs provides a solid security boundary,
    preventing data applications from reaching the voice traffic. It also gives you
    a simpler method to deploy QoS, prioritizing the voice traffic over the data.


    One difficulty you may encounter when separating voice and data traffic is the
    fact that PCs are often connected to the network using the Ethernet port on the
    back of a Cisco IP Phone. Because you can assign a switchport to a single VLAN,
    it initially seems impossible to separate voice and data traffic. That is, until
    you that Cisco IP Phones support 802.1Q tagging.


    The switch built into Cisco IP Phones has much of the same hardware that exists
    inside of a full switch. The incoming switchport is able to receive and send 802.1Q
    tagged packets. This gives you the capability to establish a type of trunk connection
    between the Cisco switch and IP phone, as shown in Figure 3-6.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_87_0.png)


    Figure 3-6 Separating Voice and Data Traffic Using VLANs'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'You might call the connection between the switch and IP phone a "mini-trunk"
    because a typical trunk carries a large number of VLANs (if not all VLANs). In
    this case, the IP phone tags its own packets with the correct voice VLAN (VLAN
    25, in the case of Figure 3-6). Because the switch receives this traffic on a
    port supporting tagged packets (mini-trunk), the switch can read the tag and place
    the data in the correct VLAN. The data packets pass through the IP phone and into
    the switch. The switch assigns these untagged packets to whatever VLAN you have
    configured on the switchport for data traffic.


    **Note:** Traditionally, a switchport on a Cisco switch that receives tagged packets
    is referred to as a trunk port. However, when you configure a switchport to connect
    to a Cisco IP Phone, you configure it as an access port (for the untagged data
    from the PC) while supporting tagged traffic from the IP phone. So, think of these
    ports as "access ports supporting tagged voice VLAN traffic."


    > Key Topic


    # VLAN Configuration


    Configuring a Cisco switch to support Voice VLANs is a fairly simple process.
    First, you can add the VLANs to the switch, as shown in Example 3-1.


    # **Example 3-1** Adding and Verifying Data and Voice VLANs


    > Key Topic


    ```

    Switch#configure terminal

    Switch(config)#vlan 10

    Switch(config-vlan)#name VOICE

    Switch(config-vlan)#vlan 50

    Switch(config-vlan)#name DATA

    Switch(config-vlan)#end

    Switch#show vlan brief

    ```


    | Name | Status | Ports |

    |---|---|---|

    | 1 default | active | Fa0/2, Fa0/3, Fa0/4, Fa0/5 Fa0/6, Fa0/7, Fa0/8, Fa0/9 Fa0/10,
    Fa0/11, Fa0/12, Fa0/13 Fa0/14, Fa0/15, Fa0/16, Fa0/17 Fa0/18, Fa0/19, Fa0/20,
    Fa0/21 Fa0/22, Fa0/23, Fa0/24, Gi0/1 Gi0/2 |

    | 10 VOICE | active | |

    | 50 DATA | active | |

    | 1002 fddi-default | act/unsup | |

    | 1003 token-ring-default | act/unsup | |

    | 1004 fddinet-default | act/unsup | |

    | 1005 trnet-default | act/unsup |'
  merge: -1
