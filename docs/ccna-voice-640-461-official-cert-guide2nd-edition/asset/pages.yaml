- pgno: 89
  md: 'Sure enough, VLANs 10 (VOICE) and 50 (DATA) now appear as valid VLANs on the
    switch. Now that the VLANs exist, you can assign the ports attaching to Cisco
    IP Phones (with PCs connected to the IP Phone) to the VLANs, as shown in Example
    3-2.


    # 3-2 Assigning Voice and Data VLANs


    ```

    Switch#configure terminal

    Switch(config)#interface range fa0/2 - 24

    Switch(config-if-range)#switchport mode access

    Switch(config-if-range)#spanning-tree portfast

    Switch(config-if-range)#switchport access vlan 50

    Switch(config-if-range)#switchport vlan 10

    Switch(config-if-range)#end

