    from the pull-down. The Hunt options determine if and when the call will move
    from the current Line Group to the next Line Group in the Hunt List.


    8. Add DNs to the Line Group. The order in which the DNs are listed may be important
    depending on the earlier choice of distribution algorithm.


    9. Click Save.


    Figure 11-16 shows the Line Group Configuration page.


