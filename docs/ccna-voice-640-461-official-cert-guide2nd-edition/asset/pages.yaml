    # Matching Inbound and Outbound Dial Peers


    When a router receives a voice call, it must always match a dial peer in some
    way for the router to process the call. Although this might seem like a simplistic
    statement, there is actually a lot of strategy that must be in place to accomplish
    this in both the inbound and outbound direction. Take the scenario presented in
    Figure 6-10, which expands on the call leg scenario that this section on dial
    peers.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_161_0.png)


    Figure 6-10 Inbound and Outbound Dial Peers


    In addition to the call legs, Figure 6-10 displays the dial-peer configurations
    to complete end-to-end calls from x1101 to x2510 and vice versa. Now, matching
    the outbound dial peers is easy: Take the dialed digits and compare them to the
    destination patterns under the dial peers you configured on the router to find
    the most specific match. For example, if x1101 dials x2510, the router looks out
    its dial peers and realizes there a VoIP dial peer direct matching the call to
    the IP address 10.1.1.2. When ROUTER B receives it, it realizes the dialed digits
    are an match to the POTS dial peer 2510, which causes the router to call out the
    T1 interface to access the PBX system. This process explains how routers match
    the outbound dial peers (shown in Figure 6-10 as call leg 2 and call leg 4), but
    how does router match the inbound dial peers? A router matches inbound dial peers
    through the following methods:


    +   1. Match the dialed number (DNIS) using the incoming call-number dial peer
    configuration command.

    2. Match the caller ID (ANI) using the answer-address dial peer configuration
    command.'
