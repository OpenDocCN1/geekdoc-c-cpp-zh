    # Dial Peer Wildcards


    As you saw in the previous few sections, configuring dial peers (and destination
    patterns) without using wildcards would be extremely time consuming. By far, the
    most commonly used wildcard is the dot (.), which represents any dialed digit.
    You will find a few wildcards useful in your configurations. Table 6-3 describes
    these wildcards.


    | Table 6-3 Wildcards You Can Use with the destination-pattern Command |

    | Wildcard | Description |

    | --- | --- |

    | Period (.) | Matches any dialed digit from 0–9 or the * key on the telephone
    keypad. For example, 20., matches any number from 2000 to 2099. |

    | Plus (+) | Matches one or more instances of the preceding digit. For example,
    5+23 matches 5523, 55523, 555523 and so on. This trend continues up to 32 digits,
    which is the maximum length of a dialable number. |

    | Brackets ([]) | Matches a range of digits. For example, [1-3]22 matches 122,
    222, and 322. You can include a caret (^) before the entered numbers to designate
    a "does not match" range. For example, [1-3]22 matches 022, 422, 522, 622, 722,
    822, 922, and *22. |

    | T | Matches any number of dialed digits (from 0–32 digits). |

    | Comma (,) | Inserts a 1-second pause between dialed digits. |


    Note: The pound symbol (#) on a telephone keypad is not a wildcard symbol. This
    key immediately processes a dialed number when it is entered without waiting for
    additional digits.


    Tip: If you plan to create a dial peer using only the T wildcard as the destination
    pattern, Cisco recommends that you create the destination as .T. This requires
    a user to dial at least one digit to match the destination pattern. Otherwise,
    a phone left off-hook for for too long without a dialed digit will match the destination
    pattern.


    Typically, the brackets wildcard is the most difficult to understand, primarily
    because it is the most flexible. Table 6-4 shows a few examples of how it can
    be used.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Table 6-4 Destination-Pattern Brackets Wildcard Examples

    | Pattern | Description | Key Topic |

    | --- | --- | --- |

    | 555[1-3]... | Matched dials numbers beginning with 555, having 1, 2, or 3 as
    the fourth digit, and ending in any three digits. | |

    | [14-6]555 | Matched dials numbers where the first digit is 1, 4, 5, or 6 and
    the last three digits are 555. | |

    | 55[59]12 | Matched dials numbers where the first two digits are 55, the third
    digit is 5 or 9, and the last two digits are 12. | |

    | ^[1-7].,[135] | Matched dials numbers where the first digit is 1–7, the second
    and third digits are any number, and the last digit is 1, 3, or 5. | |


    These wildcards are most often used when creating dial-plans for PSTN access.
    Initially, the most logical destination pattern choice for the PSTN may seem to
    be 9T (for an outside line followed by any number of digits). The problem with
    this is that Cisco designed the T wildcard to match variable-length strings from
    0-32 digits. When a user dials an outside number, such as 14085551212, the router
    configured with the T wildcard will sit silently and wait for the user to dial
    more digits. By default, the router will wait for additional dialed digits for
    10 seconds, which is the interdigit timer (also called the T302 timer). Although
    you can force the router to process the call immediately after dialing the number
    by pressing the pound key (#), this is not something you would want to train all
    of your users to.


    Creating a PSTN dialing plan using wildcards other than T is not extremely difficult,
    as long as you think through the reachable PSTN numbers. Table 6-5 provides a
    sample PSTN dial-plan that you could use in the United States.


    Table 6-5 Sample PSTN Destination Patterns for North America

    | Pattern | Description | Key Topic |

    | --- | --- | --- |

    | [2-9]...... | Used for 7-digit dialing areas | |

    | [2-9].[2-9]...... | Used for 10-digit dialing areas | |

    | 1[2-9].[2-9]...... | Used for 11-digit long-distance dialing | |

    | [469]11 | Used for service numbers, such as 411, 611, and 911 | |

    | 011T | Used for international dialing | |


    **Note:** Although you can manually create an international dial-plan without
    using the T symbol, doing so can become tedious.


    Example 6-12 illustrates the configuration of a North American PSTN dial-plan
    on a router. In this example, the T1 CAS port 1/0:1 is connected to the PSTN,
    and internal users must dial 9 for outside PSTN access.'
