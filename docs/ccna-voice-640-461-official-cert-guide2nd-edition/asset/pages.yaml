    displaying the order of operations for outgoing POTS dial peers. The order remains
    the same for VoIP dial peers; however, most digit-manipulation commands apply
    only to POTS dial peers.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_173_0.png)


    Figure 6-16 Digit Manipulation Order of Operation for POTS Dial Peers'
  merge: -1
