- pgno: 113
  md: '# Foundation Topics


    # Ensuring the Foundation


    Chapter 3, “Understanding the Cisco IP Phone Concepts and Registration,” and Chapter
    4, “Getting Familiar with CME Administration,” put configurations in place that
    are key to a working CME system. It is wise to take a high-level review of these
    concepts before you jump into the configuration of the IP phones.


    Just about all the concepts discussed so far focus on the boot process of the
    Cisco IP Phone. The following list outlines the Cisco IP Phone boot process, which
    is illustrated in Figure 5-1:


    +   1. The 802.3af PoE switch sends a small DC voltage on the Ethernet cable,
    detects an unpowered 802.3af device, and supplies power to the line.


    +   2. The switch delivers voice VLAN information to the Cisco IP Phone using
    Cisco Discovery Protocol (CDP).


    +   3. The IP Phone sends a Dynamic Host Configuration Protocol (DHCP) request
    on its voice VLAN. The DHCP server replies with IP addressing information, including
    DHCP Option 150, which directs the IP phone to the TFTP server.


    +   4. The IP phone contacts the TFTP server and downloads its configuration file
    and firmware.


    +   5. Based on the IP address listed in the configuration file, the IP phone
    contacts the call processing server (the CME router, in this case), which supports
    VoIP functions.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_113_0.png)


    Figure 5-1 Cisco IP Phone Boot Process'
  merge: -1
  img_proc: true
- pgno: 114
  md: '**Note:** Figure 5-1 shows the DHCP server, TFTP server, and CME router as
    three separate devices. To save resources, smaller networks typically combine
    all three of these functions into one device. In this case, the CME router also
    acts as the DHCP and TFTP server for the network.


    To meet the demands of this boot process, we put the following configuration over
    the previous two chapters:


    +   - Voice VLAN

    - DHCP services

    - TFTP services


    # ### Voice VLAN


    To separate the voice and data traffic, you must configure each port connecting
    to a Cisco IP Phone for a voice VLAN. In Example 5-1, the voice VLAN is 100 and
    the data VLAN (for the PC device attaching to the IP phone) is 200.


    # ### Example 5-1 Configuring Voice VLANs


    ```

    Switch#configure terminal

    Switch(config)#interface fa0/1

    Switch(config-if)#switchport mode access

    Switch(config-if)#switchport vlan 100

    Switch(config-if)#switchport access vlan 200

    Switch(config-if)#spanning-tree portfast

    ```


    # ### DHCP Services


    After the IP phone receives its voice VLAN information, it begins sending DHCP
    requests. The configuration in Example 5-2 enables a Cisco router to become a
    DHCP server for the voice VLAN and deliver the needed IP address information to
    the IP phones.


    # ### Example 5-2 Configuring a DHCP Scope on a Router


    ```

    ROUTER(config)#ip pool VOICE_SCOPE

    ROUTER(dhcp-config)#network 172.16.1.0 255.255.255.0

    ROUTER(dhcp-config)#default-router 172.16.1.1

    ROUTER(dhcp-config)#option 150 172.16.1.1

    ROUTER(dhcp-config)#dns-server 4.2.2.2

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'In addition to delivering the DHCP standard information (IP address, subnet
    mask, default gateway, and DNS), the DHCP server delivers phone Option 150, which
    gives the IP phone IP address of the TFTP server.


    # TFTP Services


    During the IP phone boot process, the IP phone contacts the TFTP server to download
    its configuration files. Until then you might wonder, “Where is this TFTP server?
    And what is in that configuration file?” I’m glad you asked. The TFTP server is
    what it has always been: simple file store that serves files to unauthenticated
    clients on demand. Although you can install and configure a TFTP server virtually
    on any device, typically the Cisco router (in the case of CME) or the CUCM Publisher
    server handles the role of the TFTP server.


    The TFTP server plays the role of “file server” in the IP telephony network. The
    IP phones download their configuration and firmware files from this server. The
    CME router generates these configuration files as you work through the initial
    configuration. For example, if you specify a new firmware for a Cisco IP phone
    to use, the CME router would modify a configuration file in flash (or an external
    TFTP server, if that''s what you choose to use) to list the new firmware. The
    next time the phone reboots, it retrieves the new configuration file, which is
    out of date, and contacts the TFTP server to download and apply the new firmware
    image.


    If you have not entered any individual phone configurations, the only configuration
    file sent to the Cisco IP Phones is the XMLDefault.cnf xml file. This file contains
    the IP address and port number used to connect to the call processing server (the
    CME router, in our case) and the names of the firmware file the IP phone should
    use. After the IP phone has configuration file, it downloads the necessary firmware
    and contacts the CME router.


    Although Cisco routers have the capability to act as a TFTP server, they were
    never designed to handle a large IP telephony network with many requests. Also,
    each model of Cisco IP phone has a number of associated firmware files. Some of
    the high-end Cisco IP phone firmware files can be over 40 MB in size! It doesn’t
    take too many of them to fill up the router’s flash memory. Because of this, using
    an external TFTP server to store the support files for the VoIP network is a good
    idea.


    > Note: In CME 4.0 and later, configuration and firmware files can be stored on
    an external TFTP server using the command c-file location http://<ip address of
    TFTP server> from telephony service configuration mode. This can save some valuable
    flash space on your router.


    To use your router’s flash as a TFTP server, you must make the files individually
    available for the IP phones to download. Example 5-3 illustrates this process
    for the 7940/7960 IP phone firmware files.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Example 5-3 Configuring Router-Based TFTP Services for IP Phone Firmware


    ```

    CME_Voice# dir flash:/phone/7940-7960

    Directory of /phone/7940-7960/

    98  -rw      129824 May 12 2008 21:33:56 -07:00 P0308000500.bin

    99  -rw        458 May 12 2008 21:33:56 -07:00 P0308000500.loads

    100 -rw      705536 May 12 2008 21:34:00 -07:00 P0308000500.sb2

    101 -rw      130228 May 12 2008 21:34:00 -07:00 P0308000500.sbn

    129996800 bytes total free

    ```


    CME_Voice# configure terminal

    Enter configuration commands, one per line. With CNTL/


    ```

    CME_Voice()# tftp-server flash:/phone/7940-7960/P0308000500.bin alias

    P0308000500.bin

    CME_Voice()# tftp-server flash:/phone/7940-7960/P0308000500.loads alias

    P0308000500.loads

    CME_Voice()# tftp-server flash:/phone/7940-7960/P0308000500.sb2 alias

    P0308000500.sb2

    CME_Voice()# tftp-server flash:/phone/7940-7960/P0308000500.sbn alias

    P0308000500.sbn

    ```


    The alias syntax that follows the tftp-server command enables the firmware file
    to be requested by asking for the aliased filename. This is necessary in the newer
    CME versions, which organize the firmware files into subdirectories. The Cisco
    IP Phones do not know the path to the firmware file; they ask only for the firmware
    filename.


    > **Note:** Be sure to make all the firmware files in each subdirectory via TFTP.
    The Cisco IP Phones use most, if not all, of these files during the boot process.


    The firmware files for the Cisco 7940 and 7960 IP Phones are now available through
    TFTP from the Cisco Unified CME router. You can repeat this process as many times
    as necessary to make the firmware files available for the additional models of
    IP Phones you have on your network.


    > **Note:** You can download the latest firmware files for Cisco IP Phones from
    the Cisco website assuming you have a valid support contract with Cisco. These
    files come in a TAR archive, which you can extract to the flash of your router
    with a single command.


    # Base CME Configuration


    For the CME router to support the Cisco IP Phones, you must configure some core
    telephony service information. The key items you must configure include the following:


    +   - IP Source Address

    - Max-DN

    - Max-Ephones


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_116_0.png)'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Although you can configure many additional features, these three are necessary
    to get the phone system up and running. Example 5-4 illustrates this configuration.


    # Example 5-4 Provisioning CME Phone and Directory Number Support


    ```

    CME_Voice(config)# telephony-service

    CME_Voice(config-telephony)# ip source-address 172.166.1.1

    CME_Voice(config-telephony)# max-phones ?

    <1-30> Maximum phones to support

    CME_Voice(config-telephony)# max-phones 24

    CME_Voice(config-telephony)# max-dn ?

    <1-150> Maximum directory numbers

    <cr>

    CME_Voice(config-telephony)# max-dn 48

    ```


    The max-phones parameter configures the maximum number of IP phones the router
    will support, whereas the max-dn parameter specifies the maximum number of directory
    numbers. The ip source-address command enables the router to know which IP address
    will receive registration requests from the IP phones.


    > Note: The max-phones and max-dn parameters directly affect how much memory the
    router reserves to support the CME service. Setting the value much higher than
    you actually need require excessive resources on your router and impact other
    network services. In addition, the max-phones parameter should not be any higher
    than the number of我说 you have purchased for your CME system.


    At this point, CME is nearly ready. The Cisco Phone has come to the CME router
    and said, "I want to use you as my calling processing device." The CME router
    receives this request and says, "Great! But, who are you?" The CME router delivers
    additional configuration because you let it enter. So, let''s enter away! Welcome
    to the world of ephones and ephone-dn.


    # Ephone and Ephone-DN—The Keys to Ringing Phones


    In the movie Matrix, Thomas Anderson (also known as Neo) finds out the world around
    him is not real, but rather a computer-generated environment. He soon becomes
    a part of the Resistance, who fights against the forces behind this computer-generated
    world. He meets up with Morpheus, who teaches him about this new world. Let''s
    pick up with their dialogue here:


    > Morpheus: "This is the construct. It''s our loading program. We can load anything
    from clothing, to equipment, weapons, training simulations, anything we need."

    Neo: "Right now, we''re inside a computer program?"

    Morpheus: "Is it really so hard to believe? Your clothes are different. The plugs
    in your arms and head are gone. Your appearance is what we call residual self
    image. It is the mental projection of your digital self."'
  merge: -1
  img_proc: true
- pgno: 118
  md: "The concepts of ephone and ephone-dn are not too far beyond. You must now configure\
    \ the CME router to support IP phones. Think about this as your construct “mental\
    \ projection of your digital phones.” Each ephone you configure is a representation\
    \ of the settings of a physical Cisco IP phone sitting in your office somewhere.\
    \ Each ephone-dn represents a directory number that you can assign to one or more\
    \ phones. Because ephone-dns are assigned to ephones, you should configure them\
    \ first.\n\n**Note:** Although watching The Matrix is not required for Cisco certification,\
    \ I (Jeremy) believe over 90 percent of the concepts in Cisco can somehow be linked\
    \ back to this movie, which I highly recommend.\n\n# Understanding and Configuring\
    \ Ephone-DNs\n\nAn ephone-dn in its simplest form is a directory number that can\
    \ be assigned to one or more buttons on one or more Cisco IP Phones. You can configure\
    \ each ephone-dn you create as a single- or dual-line mode ephone-dn. Here's the\
    \ difference:\n\n+   - Single-line ephone-dn:** In single-line mode, the ephone\
    \ is able to make or receive one call at a time. If a call arrives on an ephone-dn\
    \ where there is already an active call, the caller receives a busy signal.\n\
    - **Dual-line ephone-dn:** In dual-line mode, the ephone is able to handle two\
    \ simultaneous calls. This is useful for supporting features like call waiting,\
    \ conference calling, and consultative transfers.\n\nIn most network environments,\
    \ dual-line configurations are useful for user IP phones, whereas single-line\
    \ configurations are useful for network functions (such as intercom and paging).\
    \ Example 5-5 configures two ephone-dns: the first as a single-line and the second\
    \ as a dual-line.\n\n**Tip:** Newer IOS versions also support octo-line configuration,\
    \ which enables eight calls per line! This configuration is typically used for\
    \ receptionist phones, shared lines (where many people share the same extension),\
    \ or as a conference resource. Assigning all phones the octo-line configuration\
    \ uses us excessive resources on your CME router and is not recommended!\n\n#\
    \ Example 5-5 Configuring ephone-dn\n\n```\nCME_Voice# config t\nEnter configuration\
    \ mode. End with CNTL/Z.\nCME_Voice(config)# ephone-dn ?\n  <-150> ephone-dn tag\n\
    CME_Voice(config)# ephone-dn 1\nCME_Voice(config-ephone-dn)# number 2?\n  WORD\
    \ A sequence of digits - telephone number\nCME_Voice(config-ephone-dn)# number\
    \ 1000\nCME_Voice(config-ephone-dn)# exit\nCME_Voice(config)# ephone-dn 2 ?\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 119
  md: '```

    dual-line dual-line DN (2 calls per line/button)

    <cr>

    CME_Voice(config)# ephone-dn 2 dual-line

    CME_Voice(config-ephone-dn)# number 1001

    ```


    That''s all there is to Notice the range of ephone-dn tags from the context-sensitive
    help is 1-150. This tag is a logical number, which is used when assigning the
    ephone-dn to an ephone. You can choose any ephone-dn tag from the range when creating
    the ephone-dn as long as the total number of ephone-dns does not exceed the number
    specified by the max-dn command.


    **Note:** Creating more ephone-dns than you have specified using the max-dn command
    results in the following error message:


    CME_Voice(config)# ephone-dn 49

    dn 49 exceeds legal range 1 to max-dn 48


    To correct this error, increase the max-dn value from telephony service configuration
    mode.


    The number syntax (which is used to assign a directory number to an ephone-dn)
    also supports a secondary number value. For example, you can enter the following:


    CME_Voice(config)#ephone-dn 2 dual-line

    CME_Voice(config-ephone-dn)#number 1001 secondary 4805551001


    This enables the ephone-dn to answer for multiple numbers. This can be used if
    you want an internal extension to be reachable by someone on the internal network
    dialed a four-digit extension or the full Public Switched Telephone Network (PSTN)
    Direct Inward Dial (DID) number.


    **DID:** A feature is supported by PSTN carriers that enable internal extensions
    to be reached by PSTN callers directly without the need to route calls through
    a receptionist.


    # Understanding and Configuring Ephones


    When you configure an ephone in CME, it represents the configuration applied directly
    to a single Cisco IP Phone or SoftPhone managed by the CME router. Just as with
    the ephones, the max-ephone parameter directly impacts the number of ephones you
    are able to create and manage on a CME router. Example 5-6 adds an ephone to the
    CME router.


    # **Example 5-6** Creating an Ephone


    ```

    CME_Voice(config)# ephone ?

    <1-24> Ethernet phone tag

    CME_Voice(config)# ephone 1

    CME_Voice(config-ephone)#

    ```'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'After you enter the command ephone \<tag>, the CME router moves you into ephone
    configuration mode. Every command you enter after this directly affects the Cisco
    IP Phone matched to this.


    After initially creating the ephone, you need to logically link it to the physical
    phone it represents. The CME router uses the MAC address of a Cisco IP Phone for
    this purpose. There are three ways to find the MAC address of a Cisco IP Phone:


    +   - On the box of the Cisco IP Phone: The box the Cisco IP Phone ships has in
    the MAC address of the phone on next to a UPC code.


    +   - On the back of the Cisco IP Phone: A sticker on the back side of the phone
    lists the MAC address of the device. The address appears next to a UPC code.


    +   - From the Settings menu of Cisco IP Phone: All IP Phones have Settings button
    that enables you to manually configure various settings for the device. On most
    models of Cisco IP Phones, choosing Settings and then Network Configuration displays
    the MAC address of the phone on the LCD display.


    > Note: A UPC code containing the MAC address information of the IP phone is beneficial
    if you have a handheld UPC scanner (barcode scanner). You can set the scanner
    to allow you to scan the MAC address of each device and then the extension number
    into an Excel spreadsheet. You can export this information for bulk entry of devices.


    When you have the MAC address of the IP phone, you can enter it from ephone configuration
    mode, as shown in Example 5-7.


    # Example 5-7 Assigning a MAC Address to an Ephone


    ```

    CME_Voice(config)# ephone 1

    CME_Voice(config-ephone)# mac-address ?

    H.H.H Mac address

    <cr>

    CME_Voice(config-ephone)# mac-address 0014.1c48.e71a

    ```


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_120_0.png)


    After you enter the ephone MAC address information, you can verify the IP phone
    registration status by using the show ephone command, shown in Example 5-8.


    # Example 5-8 Verifying Ephone Registration Status


    ```

    CME_Voice# show ephone

    ephone-1 Mac:0014.1C48.E6D1 TCP socket:[2] activeLine:0 REGISTERED in SCCP ver
    11\and Server in ver 8

    mediaActive:0 offhook:0 ringing:0 reset:0 reset_sent:0 paging 0 debug:0 caps:8

    IP:172.30.60.31 52777 Telecaster 7960 keepalive 0 max_line 6

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: '```

    ephone-2 Mac:000C.ACF5 TCP socket:[-1] activeline:0 UNREGISTERED

    mediaActive:0 offhook:0 ringing:0 reset_sent:0 paging:0 debug:0 caps:0

    IP:0.0.0.0 Unknown keepalive:0 max_line 0

    ```


    This show output shows two configured phones: one currently registered ephone

    1) with the IP address 172.30.60.31 and the other currently unregistered (phone
    2).


    **Tip:** If you see a phone status as DECEASED in the show phone output,

    the CME router has lost connectivity with the IP phone through a TCP keepalive
    failure.

    The UNREGISTERED status indicates the CME router closed the connection to the
    IP

    phone a normal manner.


    With the ephone linked to a physical Cisco IP Phone, you can now begin assigning
    the

    buttons to the ephone-dns.


    # Associating Ephones and Ephone-DNs


    Linking phones and ephone-dns is probably the most confusing section of the CME
    con-

    figuration because there are so many options. You can assign ephone-dns by using
    the

    button command from ephone configuration mode. The basic syntax of this command
    is

    as follows:


    ```

    button <physical> <separator> ephone-dn

    ```


    Example 5-9 demonstrates the basic use of the button command.


    Example 5-9 Assigning Ephone-DN 2 to Button 1 on Ephone 1


    | CME_Voice(config)# ephone 1 |

    | CME_Voice(config-ephone)# button 1:2 |

    | CME_Voice(config-ephone)# restart |


    The 1:2 syntax assigns ephone-dn 2 (configured in Example 5-3) to button 1 of

    ephone 1. The colon (:) separator designates that this is a "normal ring" button
    assignment.

    That is, calls to 101 (the number of ephone-dn 2) causes the IP phone to audibly
    ring and

    t light on the handset to blink. The restart syntax causes the phone to perform
    a warm

    reboot and reload its configuration file from the TFTP server. Example 5-2 illustrates

    what the IP phone looks like after making this assignment.


    You can assign multiple lines to a phone by entering multiple button commands,
    as

    shown in Example 5-10, or putting multiple entries on the same line, as shown
    in

    Example 5-11.


    # Example 5-10 Assigning Buttons Using Multiple Commands


    | CME_Voice(config)# ephone 1 |

    | CME_Voice(config-ephone)# button 1:2 |

    | CME_Voice(config-ephone)# button 2:1 |'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_122_0.png)


    Figure 5-2 Ephone 1 Following ephone-dn Assignment


    # Example 5-11 Assigning Buttons Using One Command


    ```

    CME_Voice(config)# ephone 1

    CME_Voice(config)# button 1:2 2:1

    ```


    The show ephone command is also used to verify button assignments, as shown in
    Example 5-12.


    # Example 5-12 Verifying Button Assignments using the show ephone command


    ```

    CME_Voice show ephone

    ephone 1: Mac:0014.62A.C2DA TCP socket:[5] activeLine:0 REGISTERED in SCCP ver
    8

    mediaActive:offhook:0 ringing:0 reset_sent:0 debug:0 caps:7

    IP:172.30.60.32 14179 7912 keepalive 2701 max_line 2 dual-line

    button 1: dn 2 number 1001 CH1 IDLE CH2 IDLE

    button 2: dn 1 number 1000 CH1 IDLE IDLE

    ```


    Notice the two lines of this show output. You are now able to verify the ephone-dns
    assigned to the ephone. As an added benefit, the output displays the actual extension
    as well. Notice the first button shows CH1 and CH2 as IDLE, whereas the second
    button just shows CH1 as IDLE. This is because ephone-dn 2 was configured with
    the dual-line syntax, which enables two active channels.


    Let''s wrap this initial ephone/ephone-dn discussion with a final configuration
    example. In this example, a company wants to create five DNs for its three IP
    phones:'
