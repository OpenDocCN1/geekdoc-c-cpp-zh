    (such as music by Bon Jovi) over MOH. With that in mind, there are thousands of
    royalty-free songs available on the Internet that you can use for MOH.


    # # Configuring Single Number Reach


    Wouldn''t it be wonderful if you were reachable anywhere from a single phone number?
    A call to your single phone number could make your office desk phone ring in the
    middle of the day, your cell phone ring in the middle of dinner, or your home
    phone ring in the middle of the night. Single Number Reach (SNR) allows you to
    link an additional device to a “parent” number. For example, you could link your
    mobile phone to your desk extension. When a call comes in your DN, the office
    phone begins to ring. After a specified timeout, your mobile phone rings along
    with your office phone. If neither phone answers within a specified timeout, CME
    transfers the call to the corporate voice-server.


    > Tip: Single Number Reach is a lightweight version of Mobile Connect, which is
    a CUCM feature allowing you (or the user) to assign multiple devices to ring simultaneously.
    The first one to answer receives the call.


    In addition to a simultaneous-ring feature, Single Number Reach also allows a
    mid-call transfer. For example, you could be sitting at your desk speaking on
    a Cisco VoIP phone with a valued customer when you suddenly realize you''re late
    for your daughter''s birthday party. You can simply press the Mobility softkey
    on your office phone and CME transfers the call to your preconfigured Single Number
    Reach destination. CME can transfer the call back by pressing the Resume softkey.


    > Note: Using Single Number Reach may cost additional voice trunks to the PSTN.
    The mystical feature allowing you to make a call between your office phone and
    cell phone is only available because CME is maintaining the call at all times.
    For example, if a user received a call on his desk phone and then pressed the
    mobility button to send it to his cell phone, there will be two PSTN trunks active:
    one for the incoming call to the office phone and one for the outgoing call to
    the cell phone.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Chapter 7: Configuring Cisco Unified CME Voice Productivity Features 209


    You can configure Single Number Reach from the command line or using CCP. If CCP
    navigate to the Extension configuration window (Unified Communications > Users,
    Phones, and Extensions > Extensions). You can then edit any extension where you
    want to enable Single Number. After bringing up the Edit Extension window, click
    the Advanced tab and choose the Single Number Reach menu option (see Figure 7-23).


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_238_0.png)


    **Figure 7-23** Configuring SNR Using CCP


    From here, you can define the following options:


    +   **Enable SNR for this extension:** Enables the feature and allows you to configure
    the following fields.


    +   **Remote Number:** This required field defines the remote number CME should
    ring after a specified timeout. Remember to enter the number accordingly if your
    CME dial plan requires an access code (such as 9) for an outside line.


    +   **Ring remote number after:** How long (in seconds) CME should wait before
    ringing the remote number defined in the previous field.


    +   **Timeout:** The amount of time (in seconds) CME should wait before considering
    the call unanswered.


    +   **Forward unanswered calls to:** This optional field allows calls to forward
    to an additional number (such as an operator or hunt group) when the timeout value
    is reached.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Note: Keep in mind the amount of time the phone rings in your country when
    defining the "remote ring number after" and "timeout" values. For example, in
    the United States, phones ring for 2 seconds and then remain silent for 4 seconds.
    Defining a "ring remote number after" value of 8 allows two full rings and immediately
    begins ringing the remote cell phone.


    Selecting the options shown in Figure 7-22 generates the following command-line
    syntax:


    ```

    ephone-dn 2 dual-line

    nsr 14005551212 delay 8 timeout 30 cfwd-no 2000

    mility

    exit

    ```


    Notice that CME applies the configuration on an ephone-dn basis (allowing you
    to enable this feature only for select users). Also, notice that you can configure
    the mobility feature (allowing transfers of active calls to and the Single Number
    Reach device) separately from the Single Number Reach feature (allowing calls
    to ring another device after a specified amount of time).


    # Enabling the Flash-Based CME GUI


    In addition to CCP, Cisco provides a GUI that allows you to manage some of the
    CME functions through a web interface. These basic functions include configuring
    and managing earphones, ephone-dns, some system and voicemail functions, and reports.


    Note: After being in the Cisco world for some time, you definitely get the feeling
    that "real techs" use the CLI. Seeing the CME GUI only reinforces your feeling;
    although it does enable you to configure some basic settings, you can accomplish
    far more by using the command line. The GUI suffices for a phone administrator
    whose primary job is the configuration of new phones and phone lines.


    Before you are able to access the GUI, there are few preliminary configuration
    steps you need to have in place. First and foremost, you must ensure that you
    have loaded into the flash memory of the CME router the files that power the GUI.
    If you extracted the TAR file that contains the full CME installation into the
    flash of the CME router, the GUI files should be included. If you installed the
    CME files individually, be sure to download and install the CME file pack from
    Cisco.com. For more information on downloading and installing CME files into the
    flash of the router, check out Chapter 4, "Getting Familiar with CME Administration."


    Tip: You can always verify that you have installed the GUI files by performing
    a directory list of your router''s flash. Different CME versions organize the
    file structure differently, but should have relatively the same files. Here''s
    a directory listing of CME version 4.3:


    ```

    CME_Voice# dir flash:

    Directory of flash:/

    ```'
