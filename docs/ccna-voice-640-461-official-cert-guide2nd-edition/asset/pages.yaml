- pgno: 418
  md: '# Enabling Cisco Unified Presence


    This section reviews the steps required to configure end users so that they can
    use Cisco Unified Personal Communicator (CUPC) in either desk phone control mode
    or softphone mode.


    Enabling End Users for Cisco Unified Personal Communicator in CUCM


    The steps required to enable end users for CUPC must be carried out on CUCM, CUPS,
    and the CUPC client. The steps required for CUCM are summarized in the following
    list:


    +   1. Assign license capabilities in CUCM.

    2. Configure end users in CUCM.

    3. Associate the directory numbers with the end users in CUCM.

    4. Create a Cisco Unified Client Services Framework (CSF) device.

    5. Associate the CSF device with the end user in CUCM.


    These summary steps are detailed in the following sections.


    # Step 1: Assign License Capabilities in CUCM


    CUCM controls which end users can use CUPS and CUPC. In CUCM Administration, navigate
    to System > Licensing > Capabilities Assignment. Find the user for whom you want
    to enable Presence and CUPC and click on the username. On the page that opens,
    select Enable CUPC (Cisco Unified Presence) to enable CUPC for that user. Select
    Enable CUPC (Cisco Unified Personal Communicator) to enable CUPC for that user.
    You can also use the Bulk Assignment button, which allows you to select multiple
    users from the list and assign these two capabilities to all selected users at
    once.


    # Step 2: Configure End Users in CUCM


    To configure desk phone control for a user, in CUCM Administration, navigate to
    Management > End User and select the user you want to configure. In the Device
    Information section on the End User configuration page, click the Device Association
    button and select the user''s IP phone that it appears in the Controlled Devices
    pane. You should also verify the Allow Control of Device from CTI checkbox is
    selected on that device''s configuration page; it is selected by default. If the
    user uses Extension Mobility, you must move the appropriate Device Profile to
    the CTI Controlled Device Profiles pane.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_418_0.png)


    > Key Point: If you do not check the Allow Control of Device from CTI checkbox,
    the user cannot control his desk phone while using CUPC, and he cannot make any
    calls!


    Because IP Phone models support CTI in different ways, the end user must be added
    to one or more groups for the CTI functions to work correctly on the phone models
    the user might have access to. On the End User configuration page, scroll down
    to the Permissions Information section. Use the following guidelines to add the
    user to the appropriate group or groups:


    +   - For all IP Phone models: Add the user to the Standard CTI Enabled group.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '+   - For IP Phone 69XX series models: Add the user to the Standard CTI Allow
    Control of Phones supporting Rollover mode group.


    +   - For IP Phone 89XX and 99XX series models: Add the user to the Standard CTI
    Allow Control of Phones connecting Xnetfer and conf group.


    # Step 3: Associate the Directory Numbers with the End Users in CUCM


    Navigate to Device > Phone, select the user''s IP Phone, and go to the Directory
    Number Configuration. Select the Allow Control of Device from CTI checkbox. If
    Extension Mobility, click to enable the same box on the appropriate Device Profile
    configuration page for the user.


    Next, scroll down to the Users Associated with Line section and click the Associate
    End Users button. Select the user associated with this DN and click Add Selected.
    Click Config.


    # Step 4: Create a Cisco Unified CSF Device


    At this point, you need to set CUPC in softphone mode. Navigate to Device > Phone
    and click Add New. Select the appropriate Phone Type for the version of CUPC in
    use. The Key Concept following Step 4 provides the detail you need to know to
    select the correct Phone Type.


    Next, select the Allow Control of Device from CTI checkbox. Then, select a Security
    Profile by a SIP Profile. On the user''s Directory Number configuration page,
    add this new CSF device with the same DN as the user''s primary IP Phone. Verify
    that the user is associated with the DN.


    > Key Concept: Keep this in mind with respect to the version of CUPC in use:

    1. If using CUPC version 8.0+, select Cisco Unified Client Services Framework
    as the Phone Type:


    +   - CSF devices can be named anything you like; there isn''t a naming convention,
    but there is a limit of 15 characters (letters and numbers only).


    +   2. If using CUPC version 70, select Cisco Unified Personal Communicator as
    the Phone Type. CUPC version 70 devices must follow a specific naming convention:


    +   - The cup v70 device name must be named with the letters "UPC," followed by
    a derivation of the username.


    +   - The cup v70 device name can contain only numbers and uppercase letters;
    it can be a maximum of 12 characters after the "UPC".


    +   - For example: The CUPC 7.0 device name for the user ID "Mike.Valentine" would
    be "UPCMKEVALENTINE."


    This might seem counterintuitive at first. Just remember that the CSF is the newer
    way of doing things, so the newer version of CUPC uses CSF. The newer version
    has no naming restrictions; again, newer is easier and fancier.'
  merge: -1
  img_proc: true
- pgno: 420
  md: "# Step 5: Associate the CSF Device with the End User in CUCM\n\nOn the End\
    \ User configuration page, under the Device Information section, add the newly\
    \ created CSF device to the Controlled Lists list by clicking the Device Association\
    \ button. Click Save.\n\n# Enabling End Users for CUPC in Cisco Unified Presence\n\
    \nCUPC has a tight integration with CUPS. On the CUPS server, there are several\
    \ configurations that must be built to support CUPC features, such as accessing\
    \ voice mail messages from the CUPC client, desk phone control mode, LDAP directory\
    \ lookups, and CCMIP-based user device information. Some features might not be\
    \ necessary in some deployments. The following list summarizes these features\
    \ and the CUPC configurations required to support them:\n\n+   - Access personal\
    \ voice mail using CUPC: CUPC can retrieve and process voice messages from the\
    \ Mailstore: There are several interconnected steps that must be configured to\
    \ support the feature in CUPC, as follows:\n  1. Define the Mailstore: In CUPS,\
    \ navigate to Application > Cisco Unified Personal Communicator > Mailstore and\
    \ select Add New. Configure a Name and IP address for the voice messaging server,\
    \ optionally modifying the port and protocol as appropriate for the messaging\
    \ server deployment. This particular allows the use of IMAP to retrieve voice\
    \ messages.\n  2. Define the Voicemail Server: Navigate to Application > Cisco\
    \ Unified Personal Communicator > Voicemail Server. Click Add New. The Server\
    \ Type can be Unity or Unity Connection. Set the appropriate IP Address, and then\
    \ click Save.\n3. Define the Voicemail Profile: Navigate to Application > Cisco\
    \ Unified Personal Communicator > Voicemail Profile. Select the previously configured\
    \ Mailstore and Voicemail Server.\n\n+   - Allow Desk Phone Control: CUPC can\
    \ control the user's desk phone using CTI. To enable this, perform the following\
    \ steps:\n  1. Navigate to Application > Cisco Unified Personal Communicator >\
    \ CTI Gateway Server. Click Add New. Enter a Name and IP Address.\n  2. Navigate\
    \ to Application > Cisco Unified Personal Communicator > CTI Gateway Profile.\
    \ Verify that the auto-created entry exists.\n\n+   - Allow LDAP Directory Lookups:\
    \ CUPC can access the local LDAP directory to provide a list of users that can\
    \ be clicked-to dial:\n  1. Navigate to Application > Cisco Unified Personal Communicator\
    \ > LDAP Server. Click Add New. Enter a Name and IP Address, and then click Save.\n\
    \  2. Navigate to Application > Cisco Unified Personal Communicator > LDAP Profile.\
    \ Configure a Name and the LDAP account and password to access the LDAP system.\
    \ In the Search Context field, enter the LDAP search string (the same syntax as\
    \ used for LDAP Sync on CUCM) that contains the CUPC users. From the Primary LDAP\
    \ Server drop-down, select the LDAP server configured in Step 1.\n\n![](img/e4ad7862dc47b4e5de0cde3b4550ad65_420_0.png)"
  merge: -1
  img_proc: true
- pgno: 421
  md: '+   - **Define the CCMCIP Profile**: The CCMCIP service has been adapted to
    allow CUPC to discover all the devices on which a particular user is logged in
    and available, presenting the user with this information in the CUPC interface:

    1. Navigate to Application > Cisco Unified Personal Communicator > CCMCIP Profile,
    and then click Add New.

    2. Enter the IP Address of the Primary CCMCIP Host, and optionally add a Backup
    CCMCIP Host as well.


    What you have just done create a set of application profiles that allows CUPC
    to connect with the various resources and applications on the Unified Communications
    network. Other application profiles can be created for things like conferencing
    applications.


    Each application profile must be assigned to users in order to be able to use
    it. This can be done in two ways: the simplest is to enable the **Make this the
    default <profile_type> for the system** box on each profile configuration page.
    If this is done before any users are synchronized with CUCM, then all new user
    accounts will use these default profiles without requiring further configuration.
    The other way is to associate users individually to the profiles as (or after)
    the profiles are created. This is done on each profile page or from the End User
    configuration page in CUPS. This manual method can be used at any time to modify
    an individual''s application profile.


    The last configurations needed are on the CUPC application itself. Each user should
    customize his CUPC client with the correct credentials for each application in
    his profile set. Applications for which no profile has been defined for this user
    is not listed in his CUPC client and is not accessible.


    # Troubleshooting CUPC


    Table 14-3 provides a few examples of issues that can arise with CUPC, along with
    things to check to fix the problems.


    # Table 14-3 CUPC Troubleshooting Quick Reference


    | Symptom | Things to Check |

    | --- | --- |

    | Error on starting CUPC: "The selected device is not available." | - Verify that
    devices are registered in CUCM.<br>- Verify that the end user is associated with
    IP Phone in CUCM.<br>- Verify that the CCMCIP Profile is associated with the user
    in CUPS.<br>- Verify that the device and DN can be controlled by CTI in CUCM.
    |

    | User can''t make calls using CUPC in softphone mode. | - Verify that the user
    is associated with the CSF device in CUCM.<br>- Verify that the CSF device is
    registered in CUCM.<br>- Check for correct DN, partition, and CSS. |'
  merge: -1
  img_proc: true
- pgno: 422
