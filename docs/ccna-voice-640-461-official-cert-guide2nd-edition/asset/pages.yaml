- pgno: 231
  md: "| 7-24 block pattern works for 7 * 24 |\n| <cr>\n| CME_Voice(config-telephony)#\
    \ after-hours block pattern 3 91900....... 7-24 |\n\nYou might have noticed on\
    \ the context-sensitive help output in Example 7-12 that the CME router allows\
    \ you to configure up 32 indexes of block patterns. The initial block pattern\
    \ 1 matches and blocks long distance numbers; block pattern 2 matches and international\
    \ numbers; block pattern 3 matches and 1-900 toll calls. Notice that block pattern\
    \ 3 is followed by the 7-24 keyword. This additional syntax tells the CME router\
    \ to block calls with this pattern at all times. If you enter block patterns with\
    \ this keyword, exempted from other after-hours blocked numbers are not exempt\
    \ these patterns.\n\n**Note:** If you need more flexibility than after-hours blocking,\
    \ you can also use Class of Restriction (COR) features with CME. Cisco Voice over\
    \ IP (CVOICE) Authorized Self-Study Guide, Third Edition, (Cisco Press, 2008),\
    \ has more information on the configuration of COR on Cisco routers. For more\
    \ information on the web, go to http://tinyurl.com/64256f.\n\nThe final step in\
    \ the configuration of after-hours blocking is to allow any necessary exemptions\
    \ to the policy, as shown in Example 7-13. You can add exemptions on a per-IP\
    \ phone basis or by using one or more PIN numbers to allow on-demand access to\
    \ block patterns (with the exception of patterns defined with the 7-24 keyword)\
    \ from any IP phone. Example 7-13 configures phone 1 to be exempt from the after-hours\
    \ blocking policy. Phones 2 and 3 are configured with PIN numbers. In order to\
    \ become exempt from the after-hours call blocking policy, the user using the\
    \ phone must enter the necessary PIN number.\n\n# Example 7-13 Configuring After-Hours\
    \ Exemptions\n\n```\nCME_Voice(config)# phone 1\nCME_Voice(config-phone)# after-hours\
    \ exempt\nCME_Voice(config-phone)# exit\nCME_Voice(config-phone)# phone 2\nCME_Voice(config-phone)#\
    \ pin 7\n  WORD A sequence of digits · representing personal identification\n\
    CME_Voice(config-phone)# phone 1234\nCME_Voice(config-phone)# exit\nCME_Voice(config-phone)#\
    \ phone 3\nCME_Voice(config-phone)# pin 4321\nCME_Voice(config-phone)# exit\n\
    CME_Voice(config-phone)# telephony-service\nCME_Voice(config-telephony)# login\
    \ timeout 120 clear 23:00\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: "Note: The PIN number can be any number between four and eight digits.\n\nThe\
    \ last line in Example 7-13 is a key to allowing the PIN numbers to function properly.\
    \ By default, all CME-supported Cisco IP Phones have a Login softkey on the LCD\
    \ display. This softkey is dimmed and unusable until you enter the login command\
    \ from telephony service configuration mode. The timeout value that follows this\
    \ command represents the amount of idle time before the phone automatically revokes\
    \ the PIN number entered. The clear value is an absolute time at which the last-entered\
    \ PIN number becomes invalid. In case of Example 7-13, the PIN will clear at 11:00\
    \ p.m., regardless of the time it was entered. It does not prevent users from\
    \ logging back in by entering their PIN number a second time after 11:00 p.m.\n\
    \nNote: The default timeout for the login command is 60 minutes. Also, you need\
    \ to restart or reset all phones before the login command takes effect.\n\nCCP\
    \ provides a fairly spectacular interface for configuring after-hours call blocking.\
    \ When navigating to Unified Communications > Telephony Features > After-Hour\
    \ Toolbar, CCP greets you with a window allowing you to define the specific patterns\
    \ you want to block (shown in Figure 7-20). You can create schedules and PIN number\
    \ overrides by clicking the Weekly Schedule, Holiday Schedule, or Override (Softkey\
    \ Login) window panes at the bottom of the After-Hour Toolbar configuration window.\n\
    \n# Configuring CDRs and Call Accounting\n\n“Who called?” could arise for many\
    \ reasons. Perhaps the entire police and fire departments arrive at the front\
    \ door of your company because of an emergency originating from your business.\
    \ Perhaps management is reviewing the recent long-distance bill and came across\
    \ an international call to Aruba that was four hours in length. Whatever the reason,\
    \ you can find the answer by looking through the archived Call Detail Records\
    \ (CDR), as long as you have configured the CME router to support them.\n\nCDRs\
    \ contain valuable information about the calls going into, going out of, and the\
    \ IP phones on your network. These records contain all the information you need\
    \ to find who called and how long they were talking. The CME router can log CDRs\
    \ to the buffered memory (RAM) of the router, to a syslog server, or to both.\
    \ Storing the CDRs in the RAM of the router is better than nothing, but not effective.\
    \ If the CME router loses power, all the CDRs will be lost. Likewise, the RAM\
    \ of the router has limited storage and is not an effective solution. Viewing\
    \ CDRs from the file is cryptic and tedious to understand. Example 7-14 demonstrates\
    \ the syntax you use to enable logging of CDRs to the buffered memory of the router.\n\
    \nExample 7-14 Configuring CDR Logging to Buffered Memory\n\n```\nCME_Voice(config)#\
    \ logging buffered 512000\nCME_Voice(config)# dial-control-mib =\n  max-size \
    \     Specify the maximum size of the dial control history table\n```"
  merge: -1
  img_proc: true
