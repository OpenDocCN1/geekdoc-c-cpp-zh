  img_proc: true
- pgno: 475
  md: '+   * Maximum Entries Allowed in Audit Log: This setting limits the number
    of entries in the Audit Log. When the defined number is exceeded, the oldest entries
    are overwritten. Values are between 1 and 100,000. The default is 100,000.


    +   * Enable Security Log: Unchecking this box stops the recording of stored procedures
    to the Security Log. The default setting is Enabled.


    +   * Maximum Entries Allowed in Security Log: This setting limits the number
    of entries in the Security Log. When the defined number is exceeded, the oldest
    entries are overwritten. Values are between 1 and 100,000. The default is 100,000.


    +   * Minutes Between Data Collection Cycles: This value controls how frequently
    port data is gathered from logs. The default is 30 minutes.


    +   * Days to Keep Data in Reports Database: Determines how many days of historical
    data should be kept in the reports database. The default is 90 days. Note that
    if the report specifies a date range of more than 90 days in the past, the report
    will still be limited to this setting''s value.


    +   * Reports Database Size (as a Percentage of Capacity) After Which the Reports
    Harvest Is Disabled: Sets the maximum percentage of disk space the reports database
    may take up. When the value is reached, the CUC Report Harvest service is stopped,
    preventing the database size from growing. The default value is 80%.


    +   * Maximum Records in Report Output: Limits the number of records presented
    in the report output. The allowed range is from 5,000 to 30,000; the default is
    25,000. Some reports impose their own restrictions due to the size of the report
    (for example, User Message Activity is limited to 25,000 records).


    +   * Minimum Records Needed to Display Progress Indicator: This value determines
    whether running a report will cause a message to pop up before the report is generated,
    and a progress bar to be shown as it. The idea is to provide a warning that the
    selected report is large and may impact server performance. The allowed range
    is from 1 to 10,000. The default is 2,500.


    Figure 17-4 shows the Report Configuration page.


    # Analyzing Cisco Unity Connection Reports


    In the Cisco Unified Service web application, navigate to Tools > Serviceability
    Reports Archive. Click the month for which you want to view reports, and then
    click the specific date. Figure 17-5 shows the Serviceability Reports Archive
    list page.


    There are two Serviceability Archive Reports available to view (assuming enough
    time has elapsed to provide data to collect it).


    The Alerts Report displays the following:


    +   * Number of alerts per severity in the cluster


    +   * Number of alerts per server


    +   * Top ten alerts in the cluster'
