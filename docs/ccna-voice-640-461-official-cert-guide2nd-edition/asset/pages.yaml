- pgno: 133
  md: '+   Configuring Physical Voice Port Characteristics: According to the OSI Model,
    the Physical layer is where it all begins. Similarly, some basic voice-port configuration
    items can prove essential to setting up your connections to the legacy voice environment.
    This section breaks down the key commands used in analog and digital voice connections.


    +   Understanding and Configuring Dial-Peers: If there were one most important
    topic for all things related to voice in CME, this would be Dial-peers define
    the “routing table” for your voice calls. This section discusses the configuration
    of both POTS and VoIP dial-peers through many practical examples.


    +   Understanding Router Call Processing and Digit Manipulation: Even the simplest
    of all VoIP environments need to modify dialed digits or caller ID information
    for incoming and outgoing calls. This section breaks down the core digit-manipulation
    commands and explores the flow of a typical CMEhandled call.


    +   Understanding and Implementing CME Class of Restriction (COR): Just like you
    can use access lists to secure the data plane of your router, COR lists secure
    access to dialed numbers in your VoIP environment. This section discusses the
    concepts and configuration of COR lists.


    +   Quality of Service: Regardless of how beautiful and expansive your VoIP network,
    a voice network missing QoS is like confidential data lacking security—it won’t
    last long. This section quickly overviews QoS and the configuration of AutoQoS
    on switches and routers.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_133_0.png)'
  merge: -1
  img_proc: true
