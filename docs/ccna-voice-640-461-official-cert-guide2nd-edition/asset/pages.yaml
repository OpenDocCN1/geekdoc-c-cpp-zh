- pgno: 498
  md: '# Glossary


    **802.1Q** An industry-standard trunking protocol that allows traffic for multiple
    VLANs to be sent between switches.


    **802.3af** Power over Ethernet (PoE) Industry-standard method of supplying power
    over an Ethernet cable attached to devices.


    **administration via telephone (AVT) system** Gives an administrator an easy way
    to record custom prompts and quickly record and enable the AA alternate greeting
    via a telephone connection.


    **Administrative Extensions for XML (AXL)** Method by which user accounts in CUCM
    database may be replicated and synchronized with the user account database in
    CUC.


    **analog signal** A method of signaling that uses properties of the transmission
    medium to convey sound characteristics, such as using electrical properties to
    convey the characteristics of voice.


    **application (CUCM)** Includes CM Administration, Unified Serviceability, Cisco
    Extension Mobility, and so on. Each application has resources that roles are permitted
    or restricted from viewing and/or editing.


    **auto-assignment** A feature that allows the Cisco CME router to distribute phone-dns
    to auto-registered IP phones.


    **auto-attendant** A common application of Interactive Voice Response (IVR) that
    allows callers to use automated menus to navigate to specific areas of your company.


    **auto-registration** A Cisco UME CME feature that allows Cisco IP phones to register
    with the CME router without an existent phone configuration; auto-registration
    is turned on by default.


    **automated attendant (AA)** Provides a business with the ability to answer and
    direct incoming phone calls to the appropriate person within the business without
    requiring human intervention.


    **Automatic Number Identification (ANI)** Describes de caller ID delivered to
    a voice-processing device. Closely related to Dialed Number Identification Service
    (DNIS), which identifies dialed number information.


    **Call Detail Record (CDR)** A log of specific information about a phone call
    that can be used for billing, analysis, reporting, and troubleshooting.'
  merge: -1
  img_proc: true
- pgno: 499
  md: Cisco Unified Communications Manager The multiserver call processing platform
    that is able to support up to 30,000 users per cluster.
  merge: -1
  img_proc: true
- pgno: 500
  md: 'Cisco Unified Communications Manager Business Edition The single-server call
    processing platform that is able to support up to 500 users and includes integrated
    voicemail.


    Cisco Unified Communications Manager Express (CME) The call processing platform
    that is able to support up to 250 users (depending on router hardware).


    Cisco Unified Communications Manager IP Phone Service (CCMCIP) Used to list user-associated
    devices that can be used for communication.


    Cisco Unified Contact Center Express A call center application that is able to
    support up to 300 agents.


    Cisco Unified MeetingPlace Provides a multimedia conference solution that gives
    you the capability to conference voice, video, and data into a single conference
    call.


    Cisco Unified Mobility Allows users to have a single contact phone number that
    they can link to multiple devices.


    Cisco Unified Presence Provides status and reachability information for the users
    of the voice network.


    Cisco Unified Serviceability Archives Reports Two reports of collected data: one
    for Alerts and for Server statistics (CPU, hard-disk utilization).


    Cisco Unified Serviceability Reports A set of 19 built-in reports to provide administrators
    with information about the configuration, utilization, and status of the CUC application.


    Cisco Unity The unified messaging platform that is capable of supporting up to
    7,500 users per server and redundant server configurations.


    Cisco Unity Connection The single-server unified messaging platform that is capable
    of supporting up to 7,500 users.


    Cisco Unity Express The unified messaging platform that is integrated into a Cisco
    CME router; capable of supporting up to 250 users.


    Cisco Unity Express administrator A subscriber that is a member of the administrators
    group.


    Cisco Unity Express Advanced Integration Module (AIM-CUE) An entry-level hardware
    platform for Cisco Unity Express, providing up to 50 mailboxes, 12 four or six
    ports that can be used for simultaneous voice sessions, depending upon the model
    of Cisco ISR router it is installed.


    Cisco Unity Express automated-attendant (AA) script A collection of software steps
    that defines each action to be performed on a received call.


    Cisco Unity Express CLI The command-line interface used to configure and administer
    Cisco Cisco Unity Express.


    Cisco Unity Express custom scripting The act of modifying the default Cisco Unity
    Express AA script to match a business need.


    Cisco Unity Express Editor A PC software application that is used to create Cisco
    Unity Express custom scripts.'
  merge: -1
  img_proc: true
- pgno: 501
  md: 'Cisco Unity Express Enhanced Network Module (NME-CUE) The high-end hardware
    platform for Cisco Unity Express, providing up to 250 mailboxes, 300 hours of
    storage, and 24 ports that can be used for simultaneous voice sessions.


    Cisco Unity Express GUI Provides subscribers and administrators with a web interface
    to use and manage Cisco Unity Express features and functions.


    Cisco Unity Express greeting/prompt A recorded message played to a caller.


    Cisco Unity Express Network Module (NME-CUE) The lower-middle hardware platform
    for Cisco Unity Express, providing up to 100 mailboxes, 100 hours of storage,
    and eight ports that can be used for simultaneous voice sessions.


    Cisco Unity Express Network Module with Enhanced Capability (NME-CUE-EC) The upper-middle
    hardware platform for Cisco Unity Express, providing up to 250 mailboxes, 300
    hours of storage, and 16 ports that can be used for simultaneous voice sessions.


    Cisco Unity Express password Used to authenticate subscribers via the GUI.


    Cisco Unity Express PIN Used to authenticate subscribers via the TUI.


    Cisco Unity Express subscriber A user account configured in Cisco Unity Express.


    Cisco Unity Express telephony user interface (TUI) Provides subscribers and administrators
    with a telephone interface to use and manage Cisco Unity Express features and
    functions.


    Class of Restriction (COR) The method used to implement call restrictions in the
    CME environment. An inbound COR list assigns privileges, whereas an outgoing COR
    list restricts calling.


    class of service (CoS) Group of settings that provides or restricts access to
    licensed features, advanced features, or user capabilities.


    Client Services Framework (CSF) The client-side foundations for CUPC and other
    CUC-integrated applications, such as Microsoft Outlook.


    common channel signaling (CCS) A method of signaling in which information is committed
    using a separate, dedicated signaling channel.


    community A group of devices managed by the Cisco Configuration Assistant with
    its IP address.


    compliance As it relates to CUPC, compliance refers to the preservation of IMs
    on an external PostgreSQL database or compliance server.


    Computer Telephone Interface Quick Buffer Encoding (CTTIQBE) The protocol used
    for CUPC desk phone control.


    dial-peer Logical configuration used to define dial plan information on a Cisco
    router.


    Dialed Number Identification Service (DNIS) Describes dialed number information
    to a voice processing device. Closely related to Automatic Number Identification
    (ANI), which identifies caller ID information.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# Glossary


    **Direct Inward Dial (DID)** A voice configuration that allows users from the
    PSTN to dial directly into an individual phone at an organization without passing
    through a receptionist or automated attendant application.


    **directed pickup** A method used with call pickup to answer a phone directly
    by dialing the extension number of the ringing phone.


    **Disaster Recovery System (DRS)** The built-in Unified Communications platform
    backup and restore utility.


    **dual-tone multifrequency (DTMF)** A type of address signaling in which the buttons
    on a telephone keypad use a pair of high and low electrical frequencies to generate
    a signal each time a caller presses a digit.


    **Dynamic Trunking Protocol (DTP)** Allows switches to dynamically negotiate trunk
    links.


    **E.164** An international numbering plan created by the ITU and adopted for use
    on the PSTN.


    **Ear and Mouth (E&M)** Analog interface type that acts as a trunk to a PBX system.


    **ephone** A configuration in the CME router that represents a single IP phone
    (or IP telephony device).


    **ephone-dn** A configuration in the CME router that represents a single directory
    number (DN).


    **extended super frame (ESF)** A modern T1 signaling method that sends 24 T1 frames
    at a time.


    **Extensible Messaging and Presence Protocol (XMPP)** Used for instant messaging
    with CUPS.


    **feature license** A license dictating the number of IP phones a Cisco Unified
    CME router is able to support.


    **feature ring** Causes an IP phone to ring with three consecutive pulses; configured
    by using the f button separator.


    **Foreign Exchange Office (FXO)** Analog interface type that connects to a telephone
    carrier central office (CO) or PBX system: FXO ports receive dial tone from the
    attached device.


    **Foreign Exchange Office (FXO) ports** Analog interfaces that allow you to connect
    a VoIP network to legacy telephony networks such as the PSTN or a PBX system.


    **Foreign Exchange Station (FXS)** Analog interface type that connects to a legacy
    analog device (station); provides dial tone to the attached device.


    **Foreign Exchange Station (FXS) ports** Analog interfaces that allow you to connect
    a legacy analog device to a VoIP network.


    **G.711** Uncompressed audio codec consuming 64 kbps of bandwidth.


    **G.726** Compressed audio codec consuming 32 kbps of bandwidth.


    **G.728** Compressed audio codec consuming 16 kbps of bandwidth.'
  merge: -1
  img_proc: true
- pgno: 503
  md: 'G.729 Compressed audio codec consuming 8 kbps of bandwidth.


    general delivery mailbox (GDM) A mailbox that a message is shared by a group of
    subscribers.


    glare An instance in which a user picks up a phone and connects unexpectedly to
    an incoming call.


    ground start signaling A method of signaling that relies on grounding wires connecting
    to a device to a new call; typically used in PBX systems to avoid glare.


    H.323 Protocol suite created by the ITU-T to allow multimedia communication over
    network-based environments.


    H.450.2 Industry-standard method of transferring calls without hairpinning.


    H.450.3 Industry-standard method of forwarding calls without hairpinning.


    hairpinning A problem that occurs when a call is transferred or forwarded from
    one IP phone to another that keeps the audio path established (or hairpinned)
    through the original IP phone; this causes QoS issues with the call.


    integrated messaging Provides access to voicemail via an e-mail client and allows
    a subscriber to treat voicemail similarly to e-mail messages.


    integration Configuration of a voicemail system (CUC) to interact with a call
    agent (CUCM). An integration provides MWI, call forward to personal greeting,
    and easy message access.


    Interactive Voice Response (IVR) An automated system that provides a recorded,
    automated prompt to callers accessing your network.


    Internet Low Bitrate Codec (iBLC) Compressed audio codec consuming 15.2 kbps of
    bandwidth.


    Internet telephony service provider (ITSP) Provides VoIP trunk connectivity to
    the PSTN to provide calls over traditional telephony service providers (TSP).


    Inter-Switch Link (ISL) A Cisco-proprietary trunking protocol, which has been
    replaced by the industry-standard 802.1Q.


    IP Phone Messenger An interface to handle IMs on the desk IP Phone.


    key system A system that allows a company to run a private, internal voice network;
    key systems are usually used in smaller companies and share-wide extensions to
    all devices, although many key systems provide unique extensions to all devices.


    LAN expansion port The 10/100BASE-TX port in the UCS220 that is automatically
    configured in the system configuration as the external system interface. This
    port is used to connect to a DSL or cable router for Internet access.


    live record Enables a subscriber to record a live call and have that call delivered
    into the subscriber''s mailbox.


    live reply Enables a subscriber to receive the received call identification number
    (ANI) and place a phone call to that caller during voicemail message playback.'
  merge: -1
  img_proc: true
- pgno: 504
  md: 'local directory The directory that is built automatically by the CME router
    as you define caller ID information for the ephone-dns.


    local group pickup A method used with call pickup to answer a ringing phone from
    within the local group of an IP phone.


    local loop The PSTN link between the customer premises (such as a home or business)
    and the telecommunications service provider.


    loop start signaling A method of signaling that relies on connecting the tip and
    ring wires connecting to a device to complete an electrical circuit; typically
    used in devices connecting to the PSTN.


    mailbox caller features Mailbox features that Cisco Unity Express offers to a
    caller, where the caller may not be a subscriber configured on Cisco Unity Express.


    mailbox subscriber features Mailbox features that Cisco Unity Express offers to
    a configured subscriber.


    mean opinion score (MOS) A subjective method of determining voice quality; listeners
    hear a phrase read over a voice network and the quality of the audio on a scale
    of 1 to 5.


    Media Convergence Server (MCS) The server hardware platforms that support Cisco
    Unified Communications software.


    Media Gateway Control Protocol (MGCP) Voice signaling protocol created by the
    IETF; allows gateways to be controlled by a centralized agent in client/server
    fashion.


    message notification Feature used to generate a call, send an e-mail, or send
    a page to the subscriber when a new message has arrived in their mailbox.


    Message Waiting Indicator (MWI) Provides a mechanism to alert a subscriber that
    a new message has arrived in a mailbox. This is typically achieved by turning
    on a light on the subscriber''s IP phone.


    Mobile Connect The ability to have a call for the user''s enterprise IP phone
    number simultaneously switch between IP phone and remote device while in the call.
    Also known as Single Number Reach.


    Mobile Voice Access (MVA) The ability for a user to dial from a remote device
    to an enterprise MVA access PSTN number, authenticate, and then place an outbound
    PSTN call that appears to come from their IP phone.


    Monitor Mode/Watch Mode Line configuration that allows you to assign line instances
    to a Cisco IP phone for incoming or outgoing calls; they can be used to check
    line status.


    Network Time Protocol (NTP) Synchronizes the clock of a network device to a more
    accurate NTP server.


    Nyquist theorem Describes the method of converting analog audio signals into digital
    format by sampling at twice the highest frequency of the audio.'
  merge: -1
  img_proc: true
- pgno: 505
  md: 'other group pickup A method used with pickup to answer a ringing phone from
    another number, which must be specified by GPickUp softkey.


    overlay line Allowed line configurations by assigning multiple line instances
    to a physical line button (overlay) on a Cisco IP phone; configured by using the
    o, c, or x separator.


    packetization interval The amount of data (typically audio) placed into each packet.
    Cisco defaults to a 20 ms packetization interval for all codecs.


    persistent chat Group chats that are reserved when a user rejoins a chat room
    after going out.


    phone user license A license belonging to each Cisco IP Phone that allows it to
    communicate with a Cisco Unified CME router or Cisco Communications Manager server;
    most purchased IP Phones with a phone user license.


    power failure (PFO) The feature that allows the UC520 to complete calls out to
    the PSTN from a designated analog phone in the event of a power failure.


    private branch exchange (PBX) A system that allows a company to run an internal,
    private voice network; PBX systems are used in larger companies and provide unique
    extensions to all devices.


    private distribution lists A collection of subscribers created by a single subscriber
    for exclusive use by that subscriber.


    Private Line Automatic Ringdown (PLAR) A configuration used to enable "immediate
    dial" applications, such as a phone that immediately dials an emergency number
    when a user lifts the handset.


    public distribution list A collection of subscribers that is available to all
    Cisco Unity Express subscribers to use as a distribution list.


    pulse-amplitude modulation (PAM) The process of sampling an analog waveform many
    times to determine numeric amplitude values for digital conversion; PAM is combined
    with pulse-code modulation (PCM).


    pulse-code modulation (PCM) The process of converting pulse-amplitude modulation
    (PAM) values into binary number equivalents that voice equipment can transmit
    over digital circuits.


    pulse dialing A type of address signaling in which the rotary-dial of a phone
    connects and disconnects the local loop circuit as it rotates around signal specific
    digits.


    Q.931 A signaling protocol used by ISDN CCS implementations.


    quantization The process of assigning analog signals to a numeric value that can
    be transported over a digital network.


    Real-Time Transport Control Protocol (RTCP) The UDP-based protocol responsible
    for transporting audio statistics; uses random, odd-numbered UDP ports from 16,384
    to 32,767 for communication.'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'Real-Time Transport Protocol (RTP) The UDP-based protocol responsible for transport-audio
    packets; uses random, even-numbered UDP ports from 16,384 to 32,767 for communication.


    resource May be an administrative web page, part of a web page, or a tool or interface
    within an application.


    robbed bit signaling (RBS) An implementation of channel associated signaling (CAS)
    that steals the bit of every sixth frame of a digital T1 circuit for signaling
    information.


    role (CUCM) Defines a set of privileges to an application’s resources. Privileges
    may be defined as No Access, Read, or Update.


    router-on-a-stick An inter-VLAN routing configuration that allows a single router
    to route data between VLANs by a FastEthernet or greater interface broken into
    subinterfaces connected to a switch trunk port.


    service engine The interface that is created on Cisco CME the Cisco Unity Express
    hardware platform is installed and recognized by the router. CME will route calls
    through this interface to the service module for Cisco Unity Express to process.


    service module The internal interface of Cisco Unity Express. Cisco Unity Express
    routes calls through this interface to the service engine for Cisco CME to process.


    Session Initiation Protocol (SIP) Voice-signing protocol created by the IETF for
    a light-weight alternative to H.323.


    Signaling System 7 (SS7) The protocol used within the telephony service provider
    network to provide inter-CO communication and call routing.


    Single Number Reach A feature that allows users to have incoming calls ring another,
    pre-configured number after a defined time limit. Single number reach also allows
    for mobility, which allows the transfer of an active call to or from the same,
    preconfigured number.


    SIP for Instant Messaging and Presence Leveraging (SIMPLE) Used for IM with third-party
    systems.


    Skinny Client Control Protocol (SCCP) Cisco-proprietary voice-signing protocol
    used to control Cisco IP phones.


    smartports A CCA method that aids in the configuration of route for individual
    ports.


    Spanning Tree Protocol (STP) A method designed to prevent loops in switched networks
    due to redundant inter-switch connections.


    super frame (SF) An early T1 signaling method that sends 12 T1 frames at a time.


    Survivable Remote Site Telephony (SRST) A configuration that allows a router to
    act as a failover device if an IP phone is unable to reach a Cisco Unified Communications
    Manager


    switched virtual interface (SVI) A routed interface on a switch.'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'time-division multiplexing (TDM) A method of transmitting multiple channels
    of voice or data over a single digital connection by sending data in specific
    time slots.


    troubleshooting A sequence of steps by which the possible causes of a problem,
    and the possible steps to correct it, are determined and executed.


    trunk port A port on a Cisco switch specifically configured to transmit multiple
    VLANs. Trunks are typically used between switch devices and in router-on-a-stick
    configurations.


    user group (CUCM) Associated with one or more roles. Users who members of a group
    inherit the privileges of the role(s) with the group. Membership in multiple groups
    may create conflicting privilege assignments; the enterprise parameter Effective
    Access Privileges for Overlapping User Groups and Roles defines whether the effective
    privilege is Maximum or Minimum.


    virtual LAN (VLAN) A configuration used to break a switch into multiple broadcast
    domains and IP subnets.


    VLAN Trunking Protocol (VTP) A Cisco-proprietary protocol that replicates VLAN
    data-base information to all switches participating in the same VTP domain.


    voice expansion port The integrated voice/WAN interface card (VWIC) port in all
    models of the UC520 that allows for PSTN voice expansion. This port does not support
    WAN connectivity.


    Voice Profile for Internet Mail (VPIM) A feature that allows one voicemail system
    to exchange messages with another voicemail system.


    VoiceView Express An XML application that provides to subscribers GUI access to
    their voicemail messages via the Services button on an IP phone.'
  merge: -1
  img_proc: true
