- pgno: 456
  md: '+   - Configure the dial-plan to match calling pattern so that CDRs are interpreted
    correctly (for example, 4-digit calls are classified as On Net and 10-digit calls
    are local). The default settings are based on the NANP.


    +   - Configure the gateways in the CAR tool. Gateways configured in CUCM are
    automatically added and deleted, but the area codes to the gateway must be added
    so that the reports can determine which calls are long distance.


    +   - Set the COMPANY NAME value (maximum of 64 characters) as desired; this name
    appears in the header of CAR reports.


    +   - Set up the CAR Scheduler to control which types of records are loaded, at
    intervals, and for how long. The aim is to allow sufficient loading time without
    impacting the server performance. Loading the CDR and CMR file should should not
    be confused with the actual generation of the CDRs and CMRRs; loading refers to
    the Repository node pulling the raw CDR/CMR from the call processing nodes into
    the CDR/CAR database.


    +   - Configure CDR/CAR database parsing. Automatic Purge is on by default; you
    can adjust the High and Low Water values to control when the purge begins and
    stops, based on the percentage utilization of the available database disk space.
    Records to purge is based on the age of the records. Manual Purge is also available.


    +   - Configure Automatic Report Generation. Choose which reports should be automatically
    and optionally select whether you would like the reports emailed. The interval
    for report generation is fixed (daily, weekly, or monthly), but the start time
    can be customized using the Scheduler interface.


    # Exporting CDR and CMR Records


    CDR and CMR files can be downloaded from the server as a CSV file, typically to
    be imported into a billing application. The steps are as follows:


    +   1. From the CAR tool, navigate to CDR > Export CDR/CMR.

    2. Set the From Date and To Date values.

    3. In Select Records, check CDR Records, CMR Records, or both.

    4. Click Export File.

    5. In the new window, choose either CDR Dump or CMR Dump, and then click Save
    As to select a file location on the workstation.

    6. Selecting the Delete File checkbox causes the CAR tool to delete the downloaded
    records from the CAR database. This is recommended to prevent the database size
    from ballooning unnecessarily.


    # Generating CDR Reports


    As mentioned previously, users, Managers, and Administrators can use the CAR report
    tool to generate different reports. This section discusses the reports in more
    detail.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_456_0.png)'
