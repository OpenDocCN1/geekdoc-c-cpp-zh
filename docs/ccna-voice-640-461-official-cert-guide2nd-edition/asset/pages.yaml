    # Describe Cisco Unified Presence Architecture


    > Key Topic


    CUPS is a standards-based application that uses several protocols to provide functionality\and
    feature richness; and XMPP to provide generic Presence and federation functionality


    +   - SIP, SIMPLE, and XMPP

    - Simple Object Access Protocol (SOAP) to access the CUCM database via Cisco Uni-ified
    Communications System XML and CUPC configuration profiles

    - Computer telephone interface Quick Buffer Encoding (CTIQBE) for CTI integration
    for remote control with Microsoft Office Communicator

    - HTTP to provide IP Phone Messenger (IPPM) on Cisco IP phones


    The components of CUPS are as follows:


    +   - Jabber XCP: Provides Presence, IM, contacts listing, message and call routing,
    and presence and federation.

    - Rich Presence service: Manages Presence state gathering and Presence-enabled
    routing.

    - Group chat storage: Ad/ Hoc group chats are normally stored in memory on the
    CUPS server; Persistent Chat and message archiving require an external database.


    # Integration with Microsoft Office Communications Server


    CUPS interoperates with Microsoft Live Communications Server 2005 or Microsoft
    Of-f Server 2007 using SIP. The Microsoft Office Communicator client and associated
    IP phone interoperate to provide click-to-dial, phone control, and Presence capability.


    # Integration with LDAP


    CUPS can be integrated with Lightweight Directory Access Protocol (LDAP) (including
    Microsoft Active Directory), allowing users to log in with their LDAP credentials
    and synchronize their Presence status with their Outlook/Exchange calendar. The
    LDAP'
  merge: -1
  img_proc: true
- pgno: 414
  md: 'directory can be searched from the CUPC interface. CUPS can communicate with
    Exchange using Outlook Web Access (a Web Distributed Authororing and Versioning
    interface provided by Exchange). The CUPS database is synchronized with CUCM,
    in turn synchronize its database with LDAP. CUPS can redirect authentication to
    LDAP, providing a single sign-on experience for users. Figure 14-5 shows CUPS
    integration with LDAP.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_414_0.png)


    # Figure 14-5 CUPS Integration with LDAP


    # Integration with Cisco UUC Connection


    CUPS integration with CUC provides the user with the ability to sort, view, listen
    to, and delete voicemail messages, and call the sender of voicemail messages,
    all from the CUPC interface. Presence information for the sender is displayed,
    allowing the user to select how to communicate with the sender or escalate to
    a call, message, or conference. Interaction with the CUC mailbox is via Internet
    Message Access Protocol (IMAP) and requires a voicemail profile to be configured
    on the CUPS server. Figure 14-6 illustrates CUPS interaction-with CUC.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_414_1.png)


    # Figure 14-6 CUPS Integration with CUC


    # Integration with Conferencing Resources


    CUPS uses WebEx or MeetingPlace for its conferencing capability. The use of WebEx
    requires a local Meeting Center server. Communication with conferencing server
    is via Macromedia Flash with HTTP or HTTPS for transport. Figure 14-7 shows CUPS
    integration-with conferencing resources.


    # Integration with Calendar Resources


    CUPS can integrate with Microsoft Exchange 2003 or 2007 (Active Directory 2003
    or 2008 is required) to provide access to calendar status (Free/Busy/Out of Office)
    and map that status to a Presence status (Available, Busy, Away). A special Exchange
    account (with'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'membership in the View-Only Administrators in Exchange and Receive-As permissions
    on all user mailboxes must be configured for CUPS to inspect user calendars. Figure
    14-8 shows CUPS interaction with calendar resources.


    | Cisco Unified Presence | Cisco Unified Personal Communicator | Cisco Unified
    Meeting Place |

    | --- | --- | --- |

    | Login | Configuration | Communicates over HTTP or HTTPS |


    Figure 14-7 CUPS Integration with Conferencing Resources


    | Cisco Unified Personal Communicator | Cisco Unified Presence | Microsoft Exchange
    |

    | --- | --- | --- |

    | Map it to availability status for a user. | | Uses the OWA/WebDAV Interface


    Figure 14-8 CUPS Interaction with Calendar Resources


    # Architecture and Call Flow: Softphone Mode


    If the user is away from his desk (using a laptop while travelling is the typical
    scenario) or no IP phone is available, CUPC can operate in softphone mode. In
    this scenario, the CSF uses CUPS signaling to register with CUCM as a CSF device.
    It then downloads the configuration file from CUCM, obtaining a DN, partition,
    CSS, device pool, and so on. XMPP is used for chat features, sending all IMs to
    CUPC.


    # Architecture and Call Flow: Desktop Control Mode


    When using CUPC in deskphone control mode, CUPC registers with CUCM and downloads
    its configuration file. It logs in with the user-provided credentials. The CCM-CIP
    service provides CUPC with the list of user-associated controlled devices. CUPC
    uses CTIQE to control the IP phone. (If the user has multiple phones associated
    with his account, he can select the phone CUPC should control.) CUPC uses XMPP
    for chat features, sending all IMs to CUPC.


    # Compliance and Persistent Chat


    Persistent Chat refers to group chat messages that are preserved when all group
    participants have left the session, so that the information can be referenced
    later. For Hotchats, these messages are preserved in server memory. Persistent
    Chat requires an external database store; a separate database store is required
    for each CUPS server for Persistent Chat. The database instances can run on the
    same server but do not have to. Interaction with the PostgreSQL database is via
    Open Database Connectivity (ODBC).'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'Regulatory compliance may require that IM chats be preserved. CUPS can provide
    this capability by using a PostgreSQL external database. Third-party compliance
    applications may provide more features than a single PostgreSQL database; capabilities
    such as inline virus scanning of IMs and antipspam measures for IM are the more
    common features. If a third-party compliance application is used, all chats are
    sent through the compliance server; this means that if the server is not available
    to CUPS, no IMs can be sent. Figure 14-9 illustrates CUPS integration with an
    external PostgreSQL server.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_416_0.png)


    Figure 14-9 CUPS Integration with External Compliance Server


    # CUPS and QoS Considerations


    Because Quality of Service (QoS) is so vital to successful Unified Communications
    deployments, some measures must be taken to ensure that CUPC traffic is appropriately
    processed by QoS mechanisms. CUPS marks traffic outbound from the user workstation
    with values appropriate for voice, video, and signaling traffic. Normally, all
    traffic coming from the user workstation is untreated and marked down to a low
    QoS value by the first QoS-enabled device that handles it; this behavior may be
    modified by specifying the port ranges that CUPC uses and the appropriate QoS
    markings to that traffic. This requires that the network device (switch, router,
    firewall, and so on) have the capability to classify traffic by port number, the
    mark appropriate for the QoS environment, and a QoS policy to forward the traffic
    to specific destination addresses with appropriate bandwidth and length guarantees.
    It is possible that the OS on the workstation running CUPS may not support QoS
    marking outbound, but this is increasingly unlikely in modern LAN environments.


    Table 14-2 lists the protocols transmitted by CUPS, along with their port numbers
    and a brief description.


    # Table 14-2 Protocols, Port Numbers, and Descriptions of CUPC Outbound Traffic


