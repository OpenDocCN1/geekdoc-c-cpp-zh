- pgno: 321
  md: '# Foundation Topics


    # Describe Extension Mobility in CUCM


    Cisco Extension Mobility (EM) allows a user to log in to any phone in the CUCM
    cluster (and as of version 8.x, cross-cluster). In environments where workers
    move from desk to desk, this allows their personal configurations, such as directory
    numbers (DN) and dials to be dynamically set up on the IP Phones they are currently
    using, making them reachable at the same extension number regardless of which
    phone they are using.


    EM operates as an IP Phone service, applying user-specific Profiles to the phone
    the user logs into. Once the phone is subscribed to the Extension Mobility Service,
    the user selects that on the phone and enters his User ID and PIN when prompted
    (using the phone keypad in alphanumeric mode, similar to texting on a cell phone).
    CUCM then applies the Device Profile settings and resets the phone. Separate Device
    Profiles must be created for each phone model a user might log in to. For example,
    the user''s primary phone is a 7965 with six buttons set up for two DNs and four
    speed dials. When the user logs in to a 7942 with only two buttons, the Device
    Profile defines what to configure on the two buttons: one DN and two DNs, or whatever
    the user needs. The user must select the correct profile from a list if multiple
    profiles exist.


    If a user logs in to multiple phones concurrently, administrators have three options
    to determine how the system behaves:


    +   * Allow multiple logins: The user can be logged in to multiple phones at the
    same time. When this happens, the effect is that of a shared line: All the phones
    will ring when the DN configured on each is called.


    +   * Deny login: The user can only be logged in to one device at a time. When
    he attempts to log in to a second device, he receives an error message. He must
    log out of the first device before the second login succeeds.


    +   * Auto-logout: The user can only be logged in to one device at a time. When
    he attempts to log in to the second device, the system automatically logs him
    out of the first device, and the second login succeeds.


    When the device is logged out, either another Device Profile can be applied (typically
    a logout Device Profile, perhaps allowing on-net and emergency calls only), or
    the settings in the phone configuration page are applied.


    The Device Profile settings include the following:


    +   * User Music on Hold (MoH) audio source


    +   * Phone button template


    +   * Softkey template


    +   * User locale


    +   * Do not disturb (DND)'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   * Privacy setting


    +   * Service subscriptions


    +   * Dialing name


    A Default Device Profile exists to allow users without a user Device Profile for
    a particular IP Phone type to log in using EM.


    # # Enable EM in CUCM


    Enabling EM involves several steps, a few of which may need to be repeated many
    times depending on the number of phones and users in the system. The basic steps
    are as follows:


    +   1. Activate the Cisco EM Service.

    2. Configure EM service parameters.

    3. Add the EM service.

    4. Create a default Device Profile for each model of phone in use.

    5. Create Device Profiles and subscribe them to the EM service.

    6. Create end users and associate them with Device Profiles.

    7. Enable EM for phones and subscribe phones to the EM service.


    The steps are described in more detail in the following sections.


    # ## Step 1: Activate the EM Service


    +   1.1 In the Serviceability web page, navigate to Tools > Service Activation.

    1.2 Select Cisco Extension Mobility, and then click Save.


    # ## Step 2: Configure EM Service Parameters


    +   2.1 In the CM Administration web page, navigate to System > Service Parameters.
    Select the server(s) you want to configure from the Server drop-down, and then
    select the Cisco Extension Mobility Service from the Service drop-down.


    +   2.2 Scroll down to the Clusterwide Parameters section. Here, you can select
    whether to force EM login after a maximum login time has expired, and how long
    that timer is. This is also where you set the behavior for multiple logins (Multiple
    Logins Not Allowed, Multiple Logins Allowed, or Auto Logout), as described earlier.
    Additional settings here include enabling Alphanumeric User IDs (or using numeric
    only), choosing to remember and display on Alphanumeric (or not) the last User
    ID logged in the phone, and whether or not to clear the call lists for the last
    logged in user on logout.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Step 3: Add the EM Service


    +   3.1 Navigate to Device > Device Settings > Phone Services.


    +   3.2 Click New.


    +   3.3 Give the EM service a name and description, if desired.


    +   3.4 Type (or copy and paste from an external source) the following URL to
    the Service URL field:

    http://IP_address_of_Publisher:8080/emapp/EMAppContext?device=#DEVICENAME#.


    +   3.5 You may choose to add the Secure Service URL as well; if both are configured,
    and the IP Phone supports HTTPS, the secure URL will be used preferentially.


    +   3.6 Make sure the Enable checkbox is selected.


    +   3.7 You may choose to select the Enterprise Subscription checkbox as well.
    Doing automatically subscribes all IP Phones that support service subscription
    to the EM service; the administrator does not need to add the service manually
    to each device.


    Figure 11-1 shows the Services Configuration page.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_323_0.png)


    Figure 11-1 Extension Mobility Service Configuration'
  merge: -1
  img_proc: true
