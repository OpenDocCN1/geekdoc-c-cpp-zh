- pgno: 217
  md: '# Table 7-2 Options for Use with the park slot Command


    | Command | Function |

    |---|---|

    | timeout <seconds> | Specifies the number of seconds CME should wait before notifying
    the phone that parked the call that the call is still parked. To notify, CME rings
    the phone for one second and displays a message on the LCD display. |

    | limit <count> | Limits the number of timeout intervals a parked call can reach.
    After this limit is reached, the parked call is disconnected. As a side note,
    setting this value high is recommended. Customers tend to get bothered when they
    are on hold for an extended period and then are disconnected. |

    | notify <dn> | Notifies a different DN, in addition to the phone that parked
    the call, when the parked call reaches timeout period. |

    | only | Used with the prior notify syntax; instructs CME to only ring the DN
    specified with the notify command rather than ring the original phone. |

    | recall | Causes the call to return (transfer back) to the original phone that
    parked the call after the parked call reaches the timeout period. |

    | transfer <dn> | Causes the call to transfer to a specified DN after the parked
    call reaches the timeout period. |

    | alternate <dn> | Allows to specify an alternate transfer destination should
    the DN specified in the transfer command be on the phone. |

    | retry <seconds> | Sets the amount of time before CME attempts to transfer a
    parked call again. |


    There is plenty of flexibility in configuring your call park options. After you
    have at least one phone-dn designated for call park (by using the park-slot command),
    the Park softkey appears on the IP phones on an active call.


    > **Note:** You must restart or reset the IP phones if you configure the initial
    iphone-dn designated call park softkey will appear on active calls. You can accomplish
    this by using the restart or reset command from telephony service configuration
    mode.


    To park a call, simply press the Park softkey while on an active call. CME finds
    a parking slot for the phone that parked the call, as shown in Figure 7-11.


    When the users park the call, CME allocates the first available park slot. Sometimes,
    you might want to designate which parking slot gets the call, in cases as those
    in which each department of the company is assigned a unique call park number.
    In this case, you can transfer the call (using the Transfer softkey) directly
    into the parking slot you want.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_218_0.png)


    Figure 7-11 IP Phone After Parking a Call


    **Note:** If you want to use a Call Park system in which each department has its
    own Call Park slot, it may be beneficial to configure multiple e-dns assigned
    to each department designated for Call Park. Otherwise, you will be able to park
    only one call for each department.


    You can answer parked calls in one of three ways:


    +   - Dial directly into the call park slot. For example, lifting a phone handset
    and dialing 3001 answers whatever call is parked at 3001.

    - Press the PickUp softkey and dial the call park number that you want to answer.

    - From the phone which the call was parked, press the PickUp softkey followed
    by an asterisk (*) to recall the most recently parked call back to the phone.


    Using CCG to configure call park features automates the process quite a bit. First,
    navigate to the call park configuration window (Unified Communications > Telephony
    Features > Call Park). Once you arrive there, you can click the Create button
    to bring up the Create Call Park Entry configuration window. Entering a name creates
    a description label in the IOS for the call park entry. CCG gives you the option
    to select the number of slots (call park numbers) as well as the starting number
    for slots. For example, applying the configuration shown in Figure 7-12 creates
    ten park slots numbered from 1300 through 1309.'
  merge: -1
