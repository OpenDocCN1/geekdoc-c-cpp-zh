    Tip: If you are interested, I (Jeremy) recorded a free video that explains translation
    rules in depth. You can watch this video at www.cbtnuggets.com/series?id=440.


    With all these various methods of digit manipulation, two questions quickly arise:
    Which method applied first? Will the router remove added prefix digits because
