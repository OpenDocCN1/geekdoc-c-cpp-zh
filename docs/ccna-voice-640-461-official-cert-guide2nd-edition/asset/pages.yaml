- pgno: 174
  md: '# Using CCP to Configure a CME Dial-Plan


    If you prefer, you can also use the Cisco Configuration Professional (CCP) to
    modify the CME dial-plan. Cisco neatly organizes all dial-plan configurations
    in a Dial-Plans folder, shown in Figure 6-17.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_174_0.png)


    6-17 Configuring a Dial-Plan Using CCP


    Notice the first two items in the Dial-Plans folder of CCP are POTS and VoIP.
    These correlate to the two categories of dial peers you most frequently configure
    in CME. Selecting the POTS configuration item brings up the Create Dial-Plan menu.
    In an attempt to ease the configuration, Cisco provides three wizard-like configuration
    items:


    +   - Create Incoming Dial-Plan: Allows you to configure inbound dial-peers using
    PSTN trunks.


    +   - Create Outbound Dial-Plan: Allows you to configure outbound dial-peers using
    PSTN trunks. The wizard also provides you the ability to specify access digits
    (such as dialing 9 for an outline line) and caller ID information.


    +   - Import Outgoing Dial-Plan Template: Allows you to import a dial-plan from
    a CSV template.


    After you get comfortable with the CME configuration, you will likely access the
    Dial Peers tab (next to the Create Dial-Plans tab shown in Figure 6-17). In this
    configuration pane, you can manually create ten-configured dial peers through
    a GUI configuration. Figure 6-18 shows the creation of a ten-digit dialing dialN
    peer.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_175_0.png)


    **Figure 6-18** Configuring Dial Peers Using CCP


    Unlike the POTS dial peer configuration window in CCP, the VoIP dial peer configuration
    does not have the wizard-based configuration items; it allows only the manual
    dial peer creation.


    # # Understanding and Implementing CME Class of Restriction


    If you implement what you''ve seen so far, you can create a powerful VoIP system
    that supports both internal (iphone) and external (dial peer) dialing. However,
    there might be times when you need to prevent some users from calling certain
    numbers, such as the following examples:


    +   - Prevent standard employees from making international calls, but allow management
    to place international calls without restriction\- Block certain high-cost numbers
    (such as 1-900 numbers in the United States)

    - Prevent certain internal phones from reaching executive office directory numbers


    This list goes on and on, but you get the idea: it''s necessary to place calling
    restrictions on the VoIP network. If you were implementing this feature in the
    full Cisco Unified Communications Manager (CUCM) platform, you would use a feature
    called Partitions and Calling Search Spaces (CSS). In the CME environment, the
    equivalent feature is called incoming and outgoing Class of Restriction (COR)
    lists.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Without a doubt, COR lists take some practice before the concept sinks in fully.
    At a high-level view, here''s how the process works:


    +   1. A user picks up his IP phone and is immediately associated with an incoming
    COR list (which the "tags") he can access).

    2. The user dials, causing CME to match an outgoing dial-peer.

    3. If the outgoing dial-peer requires a COR "tag," CME checks to see if that tag
    is listed in the user''s incoming COR list.

    4. If the "tag" is listed in the user''s incoming COR list, CME permits the call.

    5. If the "tag" is not listed in the user''s incoming COR list, CME denies the
    call.


    **Note:** I know the word "tag" is vague, but when you see the configuration of
    COR lists, you will understand why I chose this word.


    Similar to the famous quote in The Matrix, "Unfortunately, no one can be told
    what COR lists are. You have to see them for yourself." Let''s walk through a
    practical configuration example (see Figure 6-19).


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_176_0.png)


    **Figure 6-19** Practical COR List Example


    As shown in Figure 6-19, three phones are on the internal network:


    +   - Ephone-dn 1 (x2000)

    - Ephone-dn 2 (x2001)

    - Ephone-dn 3 (x2002)'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'In addition, there are three POTS dial-peers connecting to the PSTN;


    +   - Dial-peer 10 (emergency calls, destination-pattern 911)


    +   - Dial-peer 11 (local PSTN calls, destination-pattern [2-9],......


    +   - Dial-peer 12 (long-distance PSTN calls, destination-pattern 1........


    A corporation wants to implement the following restrictions in CME:


    +   - Ephone-dn 1 (x2000) represents a lobby phone that should only be able to
    dial internal extensions and place emergency calls.


    +   - Ephone-dn 2 (x2001) represents an employee phone that should be able to
    dial international extensions and place emergency and local PSTN calls.


    +   - Ephone-dn 3 (x2002) represents a manager phone that should have no calling
    restrictions.


    Based on these requirements, we can begin the COR list implementation on the CME
    router. It breaks down into the following steps:


    +   1. Define the tags we will use for the restrictions.


    +   2. Create the outbound COR lists.


    +   3. Create the inbound COR lists.


    +   4. Assign the outbound COR lists.


    +   5. Assign the inbound COR lists.


    This seems like an extensive process, but it gets rather quickly when you get
    to enter the syntax.


    To tackle the first, we define the tags we will use for the restrictions. I''ve
    been calling them "tags" because they are simply names that you create. Some documentation
    calls them COR list members, whereas other documentation calls them keys. Here,
    we''ll call them tags. The names you create are typically based on the restrictions
    you want to apply. Example 6-24 shows the process of defining these tags.


    # Example 6-24 Defining COR List Tags


    ```

    Router# configure terminal

    Router(config)# dial-peer cor custom

    Router(config-dp-cor)# name 911

    Router(config-dp-cor)# name LOCAL

    Router(config-dp-cor)# name LD

    ```


    At this point, we defined the tags 911, LOCAL, and LD, which represent the various
    outgoing restrictions we can place. At this point, these tags are doing absolutely
    nothing, but because we define the names, the CME router allows us to use them
    to create COR lists. We''ll first create the outgoing COR lists that we will apply
    to the PSTN dial peers, as shown in Example 6-25.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Example 6-25 Creating Outgoing COR Lists


    ```

    Router(config)#dial-peer cor list 911-CALL

    Router(config)-dp-corlist)#member 911

    Router(config)-dp-corlist)#exit

    Router(config)#dial-peer cor list LOCAL-CALL

    Router(config)-dp-corlist)#member LOCAL

    Router(config)-dp-corlist)#exit

    Router(config)#dial-peer cor list LD-CALL

    Router(config)-dp-corlist)#member LD

    Router(config)-dp-corlist)#exit

    ```


    We eventually apply the COR lists shown in Example 6-25 as outgoing COR lists
    to the PSTN dial peers. If you were to read these COR lists in plain English,
    the 911-COR list would say, "For this COR list to allow the call, the caller must
    be assigned the 911 tag." The LOCAL-CALL COR list would say, "For this COR list
    to allow the call, the caller must be assigned the LOCAL tag." Hopefully, you
    get the idea, but keep in mind that the COR lists are not doing anything, because
    we have not yet applied them to the dial peers. Next, we create incoming COR lists,
    as shown in Example 6-26.


    # Example 6-26 Incoming COR Lists


    ```

    Router(config)#dial-peer cor list 911-ONLY

    Router(config)-dp-corlist)#member 911

    Router(config)-dp-corlist)#exit

    Router(config)#dial-peer cor list 911-LOCAL

    Router(config)-dp-corlist)#member 911

    Router(config)-dp-corlist)#member LOCAL

    Router(config)-dp-corlist)#exit

    Router(config)#dial-peer cor list 911-LOCAL-LD

    Router(config)-dp-corlist)#member 911

    Router(config)-dp-corlist)#member LOCAL

    Router(config)-dp-corlist)#member LD

    Router(config)-dp-corlist)#exit

    ```


    We eventually apply the COR lists shown in Example 6-26 to the ephone-ds to grant
    calling privileges. If you were to read these COR lists in plain English, the
    911-ONLY COR list would say, "Anyone assigned to this COR list can call dial peers
    requiring the 911 tag." The 911-LOCAL COR list would say, "Anyone assigned to
    this COR list can call dial peers requiring the 911 or LOCAL tags."


    **Note:** You might wonder, "How do these COR lists say different things when
    they''re created the same way?" Great question! This is what makes COR lists so
    confusing. Both inbound and outbound COR lists are created the same way. The effect
    they have is completely based on how you apply them. If you apply a COR list in
    the outbound direction, it says, "I will require a caller to have the defined
    tags to complete a call." If you'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'apply a COR list in the inbound direction, it says, "I will assign these tags
    to a caller, grant the ability to place a call."


    Now, we can move to the final two steps: assigning the inbound and outbound COR
    lists.

    Example 6-27 records this monumental event.


    # Example 6-27 Assigning Inbound and Outbound COR Lists


    ```

    Router(config)#dial-peer voice 10 pots

    Router(config)-dial-peer)#corlist outgoing 911-CALL

    Router(config)-dial-peer)#exit

    Router(config)#dial-peer voice 11 pots

    Router(config)-dial-peer)#corlist outgoing LOCAL-CALL

    Router(config)-dial-peer)#exit

    Router(config)#dial-peer voice 12 pots

    Router(config)-dial-peer)#corlist outgoing LD-CALL

    Router(config)-dial-peer)#exit

    Router(config)#ephone-dn 1

    Router(config)-ephone-dn)#corlist incoming 911-ONLY

    Router(config)-ephone-dn)#exit

    Router(config)#ephone-dn 2

    Router(config)-ephone-dn)#corlist incoming 911-LOCAL

    Router(config)-ephone-dn)#exit

    Router(config)#ephone-dn 3

    Router(config)-ephone-dn)#corlist incoming 911-LOCAL-LD

    Router(config)-ephone-dn)#exit

    ```


    > **Note:** Example 6-27 assumes dial peer 10, 11, and 12 have been previously
    configured with the really destination-pattern and port values to correctly route
    the call to the PSTN.


    Example 6-27 puts it all together. You might need to flip back through the last
    pages to see the building examples to fill the pieces in your mind. To see this
    in action, we follow a call originated from the lobby phone (ephone-dn 1):


    +   1. Someone picks up the lobby phone and calls 4805551212.

    2. CME immediately assigns the lobby phone 911-ONLY COR list, which assigns the
    tag 911.

    3. CME matches the outbound dial peer 11, which is assigned the outgoing COR list
    LOCAL-CALL.

    4. The outgoing LOCAL-CALL COR list requires the LOCAL tag.

    5. Because the lobby phone was only assigned the 911 tag (and not LOCAL), the
    call fails with a reorder tone.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Okay, we''ve now seen how COR lists deny a call. Let''s now follow a call that
    succeeds from the employee phone (ephone-dn 2):


    +   1. An employee picks up her phone and calls 4805551212.


    +   2. CME immediately assigns the employee phone 911-LOCAL COR list, which assigns
    the 911 and LOCAL.


    +   3. CME matches the outbound dial peer 11, which is assigned the outgoing COR
    list LOCAL-CALL.


    +   4. The outgoing LOCAL-CALL COR list requires the LOCAL tag.


    +   5. Because the employee phone is assigned the 911 and LOCAL tags, the call
    completes successfully.


    > Note: In the previous COR list scenarios, the incoming COR list are applied
    to ephone-DNs and the outgoing COR list are applied to dial peers. Although this
    is the most common, you can apply any incoming and outgoing COR lists to any combination
    of calling or called entities. For example, you might apply an incoming COR list
    to a PSTN dial peer to restrict which internal extensions a PSTN caller can reach.


    That''s the foundation of COR lists! Now, with understanding, there are a couple
    rules of COR lists that you should know:


    Rule 1: If there is no outgoing COR list applied, the call is always routed.


    Rule 2: If there is no incoming COR list applied, the call is always routed.


    Typically, Rule 1 makes perfect sense. For example, if you created a PSTN dial
    peer that lets all phones to access, simply not apply an outgoing COR list. After
    that is done, the PSTN dial peer does not require any COR list tags to pass the
    call through. Now, regardless of the incoming COR list applied to an ephone-dn
    (or a complete lack of COR list applied to the ephone-dn), the call to the PSTN
    dial peer completes successfully.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_180_0.png)


    On the other hand, Rule 2 makes no sense at all. If a calling entity (ephone-dn)
    does not have an incoming COR list, it is able to call any other entity regardless
    of the outgoing COR list assigned. Nonetheless, this is how the rule works. Think
    of it: If a calling entity does not have an incoming COR list, no restrictions
    are applied to the device. By using this approach, Cisco has lessened the potential
    of causing outages when applying COR to your CME router. COR always requires an
    inbound COR list meeting an outbound COR list. If either of those entities is
    missing, CME permits the call.


    With these two rules in mind, we could make our previous configuration more efficient.
    You might remember that the scenario required the manager phone (ephone-dn 3)
    to be able to call any of the listed dial-peers. To accomplish this, we created
    a COR list "911-LOCAL-LD" that listed all three COR tags. However, in light of
    Rule 2, we could have simply not assigned ephone-dn 3 an incoming COR list, and
    we would have accomplished the same objective.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'We have applied a similar efficiency for emergency calling. Every ephone-dn
    in our scenario had the ability to make emergency calls. This was granted to them
    because every ephone-dn the 911 tag assigned to their incoming COR list. However,
    in light of Rule 1, we could have not assign an outgoing COR list to dial-peer
    10 (which was used for emergency calls). At that point, any of the ephone-dns
    would be able to use the dial-peer regardless of their incoming COR list.


    > > **Tip:** Even though the previous two rules can make your configuration more
    efficient


    To combat these issues, you to ensure not only that there is bandwidth available
    for VoIP traffic, this means if a bottleneck is in the network where a router
    queues traffic before it is sent, the router must be waiting the voice traffic
    ahead of the data traffic to be sent in the first interval. Accomplishing this
    is the job of QoS. QoS is not a tool in itself, but rather category of many tools
    aimed at getting complete control over the traffic crossing your network. There
    might be times when you use a single QoS tool at the delay of traffic. Other times,
    you may employ multiple QoS tools to control delay, reserve bandwidth, and compress
    data that is heading over the WAN. How and when you use each of the QoS tools
    depends on the network requirements of traffic and the characteristics (such as
    bandwidth, delay, and so on) of the network supporting the traffic.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Understanding the Enemy


    Before you can deploy QoS successfully, you need to know what you are fighting
    against.

    The are the three enemies of VoIP traffic:


    +   - **Lack of bandwidth**: Multiple streams of voice and data traffic competing
    for a limited amount of bandwidth.


    +   - **Delay**: The time it takes a packet to move from the original starting
    point to the final destination. Delay comes in three forms:


    +   - **Fixed delay**: Delay values that you cannot change. For example, it takes
    a certain amount of time for a packet to travel specific geographical distances.
    This value is considered fixed. QoS cannot impact fixed delay issues.


    +   - **Variable delay**: Delay values that you can change. For example, queuing
    delay (how long a packet waits in a router''s interface queue) is variable because
    it depends on how many packets are currently in the queue. You can impact queuing
    delay by selectively moving voice packets ahead of data packets.


    +   - **Jitter** (delay variations): Describes packets that have different amounts
    of delay between them. For example, the first voice packet of a conversation might
    take 100 ms to reach a destination, while the second voice packet might take 110
    ms. There is 10 ms of delay variation (jitter) between these packets.


    +   - **Packet loss**: Packets lost because of a congested or unreliable network
    connection.


    These plague every network environment; however, the stakes are much higher when
    you add VoIP traffic to an existing data network. Users are accustomed to a PBX-style
    environment that has a separate network and dedicated bandwidth assigned just
    for voice traffic. The tolerance for crackling, echoing, or dropped calls from
    a voice network is very low.


    QoS is designed to keep voice traffic running smoothly during temporary moments
    of congestion on the network. It is not a "magic bullet" that can solve any network
    scenario. For example, if there is a network environment where the WAN link is
    constantly lacking, adding voice to the link and expecting QoS to take care of
    the situation is similar to rearranging the deck chairs on the sinking Titanic.
    QoS can only do so much; if your applications perform so slowly they are no longer
    functional or your voice traffic will experience quality issues. This also goes
    the other way; if you have a network environment where fiber-optic cable is the
    norm and gigabit speeds abound, you might never experience network congestion.
    These environments will get little to no gain by using QoS most QoS tools only
    engage during times of network congestion.


    Your goal is to provide consistent bandwidth to voice traffic in such a way that
    there is low, steady delay from one end of the network to the other. To accomplish
    this, you need to have QoS at each point of the network where congestion exists.
    This means doing an end-to-end audit of your network to determine the traffic
    types that exist and the service levels required for those traffic types.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Requirements for Voice, Video, and Data Traffic


    The different traffic types that cross your network every day have their own QoS
    requirements. Some of these requirements might be very loose; the network would
    essentially need to fail for the application to stop working. Other requirements
    might be very tight, requiring high-speed connectivity with low delay for the
    application to work successfully. This section describes general goals for voice,
    video, and data.


    **Tip:** A plethora of QoS software utilities are available that will analyze
    your network traffic and report the bandwidth and delay each traffic type receives
    from the network. A popular tool in the Cisco realm is NetQoS (www.netqos.com).


    # Network Requirements for Voice and Video


    Unlike data traffic, voice traffic is predictable. Whereas data traffic can jump
    considerably if a large web download or file transfer is started, voice traffic
    remains a consistent value for each call entering and leaving the network. The
    actual amount of bandwidth required for voice is heavily dependent on the codec
    you are using.


    In addition to bandwidth requirements, voice traffic has the following additional
    one-way requirements:


    +   - End-to-end delay: 150 ms or less

    - Jitter: 30 ms or less

    - Packet loss: 1% or less


    Video traffic has identical delay requirements as voice, but consumes a lot more
    bandwidth. In addition, the bandwidth can vary depending on how much movement
    is in the video (lots of movement increases the bandwidth required for video considerably).


    # Network Requirements for Data


    It is impossible to give one sweeping guideline for all data applications, because
    every data application that exists has its own QoS requirement. When designing
    for the data applications on your network, divide your applications into no more
    than four or five broad categories. For example:


    +   - Mission-critical applications: These applications are critical to your organization
    and require dedicated bandwidth amounts.


    +   - Transactional applications: These applications are typically interactive
    with users and rapid response times. For example, a technical support employee
    might use a database application to retrieve caller information based on previous
    case ID values.


    +   - Scavenger applications: These nonproductive applications typically have
    no business need, but consume excessive amounts of bandwidth. For example, peer-to-peer
    file-sharing applications, such as Kazaa, BitTorrent, and LimeWire, fall into
    this category.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'You can assign each of these data application categories a specific level of
    QoS. You can map the actual applications to these categories using a variety of
    methods (such as incoming interface, exit interface, access lists, and so on).


    # QoS Mechanisms


    With the applications requiring different levels of QoS, multiple models and mechanisms
    emerged to address the needs. Today, the following models are available for you
    to deploy QoS:


    +   **Best Effort:** Best Effort makes the list simply because this is the model
    every network works by default. On the positive side, the Best-Effort model requires
    absolutely no effort at all on your end to implement. No QoS mechanisms are used,
    and all traffic is treated on a first come, first served basis. Of course, this
    does not address the QoS requirements of most network environments today.


    +   **Integrated Services (IntServ):** The IntServ model works through a method
    of reservations. For example, if a user wanted to make an 80kbps VoIP call over
    the data network, the network designed purely to the IntServ model would reserve
    80Kbps on every network device between the two VoIP endpoints using the Resource
    Reservation Protocol (RSVP). For the duration of the call, 80Kbps of bandwidth
    would not be available for any other use than the VoIP call. Although the IntServ
    model is the only model that provides guaranteed bandwidth, it has scalability
    issues. If enough reservations are made, the network simply runs out of bandwidth.


    +   **Differentiated Services (DiffServ):** The DiffServ model is the most popular
    and flexible model for implementing QoS. In this model, you can configure any
    device to respond with a variety of QoS methods based on different traffic classes.
    You can specify which network traffic goes into each class and how each class
    is treated. Unlike the IntServ model, the traffic is not absolutely guaranteed
    (since bandwidth). However, DiffServ gets so close to guaranteed bandwidth (some
    Cisco documentation refers to it as "guaranteed"), while at the same time addressing
    the scalability concerns of IntServ, that it becomes the standard QoS model used
    by most organizations around the world.


    The QoS model you use is primarily a strategy or mindset of how you design and
    implement QoS mechanisms are a series of tools that combine to deliver the levels
    of service your network traffic needs to survive. Each of these tools fits into
    one of the following categories:


    +   **Classification and Marking:** These tools allow you to identify and mark
    a packet so network devices easily identify it as it crosses the network. Typically
    the first device that receives the packet identifies it using tools such as access-lists,
    interfaces, or deep packet inspection (which looks at the data itself). This tools
    can be processor intense and add delay to the packet, so after the packet is initially
    identified, it is marked. The marking can be in the layer 2 (data link) header
    (allowing switches to read it) or the layer 3 (network) header so routers can
    read it. Then, as the packet crosses the rest of the network, the network devices
    simply look at the marking to classify it rather than digging into the packet.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   **Congestion Management:** All of the QoS queuing strategies fall under
    this umbrella, which are typically the primary tools you will use to implement
    QoS network-wide. The queuing strategies define the rules the router should use
    when congestion occurs. For example, if a T1 WAN interface was completely saturated
    with traffic, the router would begin holding packets in memory (queuing) to send
    when bandwidth is available. All the queuing strategies aim to answer that one
    golden question: When there is bandwidth available, what packet goes first?


    +   **Congestion Avoidance:** Most QoS mechanisms engage only when congestion
    occurs on the network. The aim of congestion avoidance tools is to drop enough
    packets of non-essential (or not-essential) traffic to the network to avoid heavy
    congestion occurring in the first place.


    +   **Policing and Shaping:** You can think of policing as one of the few “anti-QoS”
    mechanisms available (yes, you could argue this, but please don''t). Rather guaranteeing
    an amount of bandwidth, policing limits the amount of bandwidth certain network
    traffic can use. This is very useful for many of the “bandwidth hogs” on the network:
    peer-to-peer applications, web surfing, FTP, and so on. You can also use shaping
    to limit the amount of bandwidth network traffic can use. It is designed for networks
    where the actual speed allowed is slower than the physical of the interface. The
    difference between the two mechanisms is shaping queues excess traffic (and tries
    to send it later), whereas policing typically drops excess traffic.


    +   **Link Efficiency:** As the name implies, this final group of tools focuses
    on delivering the traffic in the most efficient way. For example, some low-speed
    links work better if you take the time to compress your network traffic before
    it is sent (compression is one of the link efficiency tools).


    Understanding completely is a fairly massive undertaking, which is why Cisco has
    dedicated an entire certification exam to the topic in the CCNP Voice track. At
    the CCNA Voice level, Cisco has chosen to highlight two of the key QoS categories:
    link efficiency mechanisms and queuing algorithms.


    # Link Efficiency Mechanisms


    As network technology progresses and spreads around the world, links slower than
    T1 (1.544Mbps) are becoming increasingly rare. However, there are still many of
    these slower (aka “speed challenged”) links in existence. There are typically
    two challenges facing these connections:


    +   Lack of bandwidth makes it difficult to send the amount of data required in
    a timely fashion.


    +   Slower link speeds can have a significant impact on end-to-end delivery to
    the serialization process (the amount of time it takes the router to put the packet
    from its memory buffers onto the wire). On these slow links, the larger the packet,
    the longer the serialization delay. For example, sending a 1500-byte packet on
    a 56Kbps link adds 214ms just in serialization delay.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'To address these challenges, the following link efficiency mechanisms have
    been introduced:


    +   - Payload Compression: Compresses application data sent over the network so
    the router sends less data across the WAN link.

    - Header Compression: Some traffic (such as VoIP) may have a small amount of application
    data (RTP audio) in each packet but sends many packets. In this case, the amount
    of header information becomes a significant factor and often consumes more bandwidth
    than the data itself. Header compression addresses this issue directly by eliminating
    many of the redundant fields in the header. Amazingly, RTP compression (also called
    Real-time Transport Protocol (-RTP)) reduces a 40-byte header down to 2-4 bytes

    - Link Fragmentation and Interleaving (LFI): LFI addresses the serialization delay
    by chopping large packets into smaller pieces before they are sent. This allows
    the router to move more critical VoIP traffic between the now-fragmented pieces
    of the data traffic (which is called “interleaving” the voice). You can use LFI
    on PPP or Frame Relay connections (using FRE/T1 Annex C).


    > Tip: One thing to understand: Link efficiency mechanisms are not a magic way
    to get more bandwidth. Each of them has their drawback: Compression adds delay,
    and processor load and link fragmentation increases the amount of data being sent
    on the line (because all the fragmented packets now need their own header information).
    Cisco does not recommend using these methods on links faster than T1.


    # Queuing Algorithms


    Queuing defines the rules the router should apply when congestion occurs. The
    majority of network interfaces use First-in, First-out (FIFO) queuing by default.
    In this method, whatever packet arrives first is sent first. Although this seems
    fair, not all traffic is equal. The primary goal of queuing is to ensure that
    the network servicing your critical or time-sensitive business applications gets
    sent before non-essential network traffic. Beyond FIFO queuing, there are three
    primary queuing algorithms used in today:


    +   - Weighted Fair Queuing (WFQ): WFQ tries to balance available bandwidth among
    all senders (the “fair” queuing). By using this method, a high-bandwidth sender
    gets less priority than a low bandwidth sender. On Cisco routers, WFQ is the default
    method applied to serial interfaces.

    - Class-Based Weighted Fair Queuing (CBWFQ): This queuing method allows you to
    specify guaranteed amounts of bandwidth for your various classes of traffic. For
    example, you could specify that web traffic gets 20 percent of the bandwidth,
    whereas traffic gets 50 percent of the bandwidth (you can specify values as a
    percent or a specific bandwidth amount). WFQ is then used for all the unspecified
    traffic (the remaining 30 percent, in the previous example).

    - Low Latency Queuing (LLQ): LLQ is often referred to as PQ-CBWFQ because it is
    exactly the same thing as CBWFQ, but adds a priority queuing (PQ) component.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'When you specify that certain network traffic should go into the priority queue,
    the router then not only guarantees traffic bandwidth, it guarantees the first
    band-width. For example, using CBWFQ, Citrix traffic might be guaranteed 50 percent
    of the bandwidth, but it may get that bandwidth after the router has fulfilled
    some other traffic guarantees. When using LLQ, the priority traffic always gets
    before any other traffic guarantees are fulfilled. As you might guess, this works
    very well for VoIP, making LLQ the preferred queuing algorithm for voice.


    Although there are many queuing algorithms available, these three encompass the
    methods used by most modern networks.


    # Applying QoS


    By nature, you can apply most of the QoS mechanisms discussed as the network traffic
    leaves a router (because you cannot control the order the router receives traffic;
    it simply arrives). Table 6-7 summarizes the QoS methods discussed and the direction
    you can apply them on your router.


    Table 6-7 Applying QoS to Input and Output Interfaces of a router


    | QoS Methods Applied as Traffic Enters the Router (Input) | QoS Methods Applied
    as Traffic Leaves the Router (Output) |

    |---|---|n| Classification | Congestion Management |

    | Marking | Marking |

    | Policing | Congestion Avoidance |

    | | Shaping |

    | | Policing |

    | | Compression |

    | | Fragmentation and Interleaving


    As you can see, you can apply some QoS methods (such as policing) in either direction.


    # Using Cisco AutoQoS


    Deploying QoS can be complex (which is why there''s a difficult CCNP Voice exam
    dedicated just to the topic). To help ease the learning curve for QoS, Cisco created
    a mechanism called AutoQoS, which allows you to enable a variety of QoS mechanisms
    with little QoS knowledge. AutoQoS works well out of the box that many network
    administrators have full knowledge of the QoS capabilities and configuration on
    Cisco devices use it. AutoQoS moved to this acclaimed status because it deploys
    a template QoS configuration in line with Cisco best practices based on the bandwidth
    and encapsulation under each of your router or switch interfaces. This template-based
    QoS deployment offers multiple advantages to manual QoS configuration:


    +   - Reduces the time of deployment: Entering a single command on a device is
    much less time consuming than the potentially complex QoS configurations.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   - Provides configuration consistency: Using a single-command QoS template
    on each device ensures that all the devices use a similar QoS configuration that
    is not as prone to forgotten commands or mistypes.


    +   - Reduces deployment cost: It takes some time and training to get fully up
    to speed on everything QoS has to offer.


    +   - Allows manual tuning: You can manually adjust and tune the template-based
    configuration deployed by AutoQoS to fit your specific network QoS requirements.


    Before you can AutoQoS on your network, you must first establish the trust boundary
    for your voice traffic. However, to understand the concept of QoS markings, As
    a device sends traffic, that traffic might not be trustworthy. For example, a
    Cisco IP phone marks all of its traffic with an extremely high priority. In this
    case, the markings are trustworthy because the audio traffic from the phone does
    indeed need high-priority service. However, a technology-savvy user might configure
    a computer to mark traffic from it with the same high-priority marking as the
    voice traffic. In this case, the marking is not trustworthy.


    Now, we can jump back to the concept of a trust boundary. The trust boundary is
    the point of the network where you begin trusting that the network traffic is
    accurately identified with the correct QoS marking. Depending on the capabilities
    of the devices on your network, you can begin applying QoS markings close to the
    user devices, as shown in Figure 6-20.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_188_0.png)


    Figure 6-20 Possible QoS Trust Boundaries


    Cisco IP phones have the ability to mark their own traffic as high priority and
    strip any high-priority markings from traffic sent by the attached PC. If you
    are using the Cisco IP phone to mark traffic, you have extended the trust boundary
    to point 1 shown in Figure 6-20. This is the ideal trust point because because
    it distributes the QoS marking process to many'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Cisco IP phones rather than forcing the switches to apply QoS markings to a
    higher volume of traffic.


    If you have PCs attached to the network and you have access layer switches with
    QoS capabilities, you can begin marking at these devices (point 2 in Figure 6-20).
    If your access layer switches do not have QoS capabilities, then the first possible
    place you can apply QoS markings is at the distribution layer switches (point
    3 in Figure 6-20). This will work just fine; however, it adds an extra load to
    the distribution layer switches. Likewise, you will have network traffic passing
    through access layer switches without any QoS treatment. Although this is usually
    a safe bet—because access layer switches typically have higher-speed connections,
    on which congestion is rare—it is always best to apply QoS in as many places as
    possible where there is a potential bottleneck.


    **Note:** AutoQoS uses Cisco Discovery Protocol (CDP) to detect IP phones on Cisco
    switches and properly configure the QoS settings. This ensures that a user cannot
    disconnect their IP phone and attach another device to receive high-priority network
    treatment. Be sure not to disable CDP on switches supporting Cisco IP phones.


    Now, we have come to the point of configuring AutoQoS. Amazing, by Cisco''s design,
    enabling AutoQoS is accomplished through a single command under interface configuration
    mode. To enable AutoQoS in your network, you must first identify the interfaces
    to which applying AutoQoS makes sense. AutoQoS does not need to be applied under
    every switch and router in your network (it probably wouldn''t hurt anything if
    you did). It primarily should be applied to interfaces on which the devices or
    applications need special or preferred treatment over others. Figure 6-21 shows
    a typical network. The interfaces labeled A represent areas of the network where
    you would use AutoQoS.


    As you can see from Figure 6-21, you will be typing this command many times. Before
    you enter the AutoQoS command, always ensure that you have entered the correct
    bandwidth statement under the serial interfaces of your routers, because a router
    cannot detect the actual speed of a WAN connection. A router can detect all other
    interfaces without requiring the bandwidth command.


    **Note:** AutoQoS uses a sophisticated queuing method known as Low Latency Queuing
    (LLQ). This queuing method provides a specific amount of bandwidth for the various
    types of network traffic, including voice. Using AutoQoS features with incorrectly
    configured bandwidth commands can cause substandard network service.


    The AutoQoS command syntax might be slightly different depending on where you
    enter it. The syntax in Example 6-28 enables AutoQoS for the interfaces shown
    in Figure 6-21 that are connected to the Cisco IP phones.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_190_0.png)


    Figure 6-21 AutoQoS Configuration Points


    # Example 6-28 Enabling AutoQoS on the Access Layer Switchports


    ```

    Voice_Switch# show run interface FastEthernet 0/3

    Building configuration...

    Current configuration : 169 bytes

    !

    interface FastEthernet/0

    description CONNECTION TO IP PHONE

    switchport vlan 10

    switchport mode access

    switchport voice vlan 5

    spanning-tree portfast

    end

    Voice_Switch# config term

    ter configuration commands, one per line. End with CTL/Z.

    Voice_Switch(config-if)# interface fa0/3

    Voice_Switch(config-if)# auto qos ?

    voip Configure AutoQoS for VoIP

    Voice_Switch(config-if)# auto qos voice ?

    cisco-phone Trust the QoS marking of Cisco IP Phone

    cisco-softphone Trust the QoS marking of Cisco IP SoftPhone

    trust Trust the DSCP/CoS marking

    Voice_Switch(config-if)# auto qos voice cisco-phone

    Voice_Switch(config-if)# ~

    ```'
  merge: -1
  img_proc: true
- pgno: 191
  md: '```

    VoiceSwitch# show run interface FastEthernet 0/3

    Building configuration...

    Current configuration : 510 bytes

    !

    interface FastEthernet0/3

    description CONNECTION TO IP PHONE

    switchport vlan 10

    switchport mode access

    switchport voice vlan 5

    mmls qos trust device cisco-phone\mls qos trust cos

    auto qos voip cisco-phone

    wrr-queue bandwidth 10 20 70 1

    wrr-queue min-reserve 1 5

    wrr-queue min-reserve 2 6

    wrr-queue min-reserve 3 7

    wrr-queue min-reserve 4 8

    wrr-queue cos-map 1 0 1

    wrr-queue cos-map 2 2 4

    wrr-queue cos-map 3 6 7

    wrr-queue cos-map 4 5

    priority-queue out

    spanning-tree portfast

    end

    ```


    Notice the options given by the context-sensitive help when the auto qos voip
    command was entered. Entering the command auto qos voip cisco-phone or auto qos
    voip cisco-softphone only enables the trust boundary if CDP detects Cisco IP phone
    or Cisco IP Communicator (or equivalent IP Softphone device) attached to the port.
    If a user removes this device, the trust boundary is broken and is not restored
    until the device is reattached. If you enter the command auto qos voip trust,
    the switch switches the markings from the attached device regardless of what it
    is. You need to use this command if you purchase non-Cisco IP phones. Keep in
    mind that if you use this the network becomes susceptible to users removing the
    non-Cisco IP phone and attaching rogue devices.


    **Note:** The auto qos voip command is entered under the FastEthernet 0/3 interface
    in Example 6-28, a show run command was performed so that you could see the current
    syntax entered under the interface. Notice how many commands are generated when
    entering the auto qos voip command. It is beneficial that the Cisco switch (and
    router) shows you all the individual commands so that you can optionally tune
    the settings to exactly fit your environment.


    If the configuration generated by the auto qos voip command is not desired, you
    can remove this configuration simply by entering no auto qos voip.'
  merge: -1
  img_proc: true
