- pgno: 241
  md: "Example 7-17 enables both the HTTP (ip http server) and HTTPS (ip secure-server)\
    \ services on the router. Of course, HTTPS is the preferred method of accessing\
    \ the CME GUI because the CME router encrypts all communication. The ip path flash/command\
    \ sets the HTTP server to use files from the GUI subdirectory of flash memory\
    \ of the CME router for HTTP requests. Finally, the CME router uses its local\
    \ user database to authenticate users accessing to the web interface.\n\n**Note:**\
    \ You might need to change the argument of the ip path flash command based on\
    \ where the HTML files are located for the CME GUI. Earlier versions of CME placed\
    \ CME files directly into flash without any directory structure. In this case,\
    \ the command should be entered as **ip path flash.\n\nThe next step in enabling\
    \ the CME GUI is to create a user account with permission to access and manage\
    \ the CME router. Example 7-18 configures this.\n\n# Example 7-18 Creating a CME\
    \ Web Administrator Account and Adding Permissions\n\n```\nCME_Voice(config)#\
    \ telephony-service\nCME_Voice(config-telephony)# web admin ?\n  customer admin\n\
    \  system admin\nCME_Voice(config-telephony)# web admin system ?\n  name admin\
    \ username\n  password admin password\n  secret secret password\nCME_Voice(config-telephony)#\
    \ web admin name ?\n  WORD username for admin\nCME_Voice(config-telephony)# web\
    \ admin name NinjaAdmin ?\n  password admin password\n  secret secret password\n\
    CME_Voice(config-telephony)# web admin name NinjaAdmin secret ?\n  UNENCRYPTED\
    \ password will follow\n  ENCRYPTED password will follow\nCME_Voice(config-telephony)#\
    \ web admin name NinjaAdmin secret @ ?\n  WORD Admin password\nCM_Voice(config-telephony)#\
    \ web admin name NinjaAdmin secret @ cisco\n  dn-webit\nCME_Voice(config-telephony)#\
    \ time-webit\n```\n\n![](img/e4ad7862dc47b4e5de0cde3b4550ad65_241_0.png)\n\nBy\
    \ default, the CME GUI is not able to add phone-dns to the CME configuration or\
