- pgno: 35
  md: '# Foundation Topics


    # Where It All Began: Analog Connections


    In 1877, Thomas Edison created a brilliant device known as a phonograph, which
    is shown in Figure 1-1.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_35_0.png)


    Figure 1-1 Replica of Edison''s Phonograph


    This device was able to record sounds by pressing a needle into a cylinder covered
    with tinfoil on a rhythmic basis as a person spoke into a sound-collecting horn.
    The phonograph could then play back this sound by moving the needle at a steady
    speed back over the indentations made in the tinfoil. This "archaic" form of recording
    is one representation of an analog signal.


    An analog signal uses a property of the device that captures the audio signal
    to convey audio information. In the case of Edison''s phonograph, the property
    was the indentations in tinfoil. In today''s world, where everything is connected
    through some form of cabling, electric currents are used to send analog signals.
    When you speak into an analog phone, the sounds that come out of your mouth are
    converted into electricity. The volume and pitch that you use when speaking in
    different variations of electrical current. Electrical voltage, frequency, current,
    and charge are all used in some combination to convey the properties of your voice.
    Figure 1-2 illustrates perhaps a more familiar view of using electrical signals
    to capture the properties of voice.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_36_0.png)


    **Figure 1-2** Electrical Analog Waveform of Human Speech


    **Note:** The analog waveform shown in Figure 1-2 is from me (Jeremy) saying,
    "Hello."


    Analog phone lines use the properties of electricity to convey changes in voice
    over cabling. Of course, there is far more than just voice to send over the phone
    lines. The analog phones you use at home must convey many different types of signaling,
    too. Signaling includes messages such as dial tone, dialed digits, busy signals,
    and so on. These signaling types are just a moment. For now, let''s look at the
    cabling used to make analog connections function.


    Each analog circuit is composed of a pair of wires. One wire is the ground, or
    positive side of the connection (often called the tip). The other wire is the
    battery, or negative side of the connection (often called the ring). You''ll commonly
    hear phone technicians talk about these wires as the "tip and ring." These two
    wires are what power the analog phone and allow it to function, just like the
    wires that connect your car battery to the car. Figure 1-3 illustrates the connections
    of the tip and ring wire to your analog phone.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_36_1.png)


    > Key Topic


    **Figure 1-3** Connections of the Ground and Battery W to an Analog Phone'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The jagged line over the wires in the analog phone in Figure 1-3 represents
    a broken circuit. Anyone the phone is on hook, the phone separates the two wires,
    preventing electric signal from flowing through the phone. When the phone is lifted
    off hook, the phone connects the two wires, causing an electrical signal (48V
    DC voltage) to flow from the phone company central office (CO) into the phone.
    This is known as loop start signaling.


    Loop start signaling is the typical signaling type used in home environments.
    Loop start signaling is susceptible to a problem known as glare. Glare occurs
    when you pick up the phone to make an outgoing call at the same time as a call
    comes on the phone line before the phone has a chance to ring. This gives you
    the awkward moment of "Uhh...Oh! Hello, Bob! I''m sorry, I didn''t know you were
    on the phone." In home environments, this is not usually a problem for a couple
    first. The chances of having a simultaneous outgoing and incoming call are slim.
    Second, if you do happen to have an incoming call, it''s always meant for your
    house (unless the dialed the wrong number)


    In business environments, glare can become a significant problem because of the
    large number of employees and high call volume. For example, a corporation may
    have a key system (which allows it to run its own, internal phone system) with
    five analog trunks to the PSTN, as shown in Figure 1-4.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_37_0.png)


    # Figure 1-4 Illustration of Glare


    If a call comes in for x5002 at the same time as x5000 picks up the phone, the
    key system will connect the two signals, causing x5000 to receive the call for
    x5002. This happens because the loop start signaling from x5000 seizes the outgoing
    PSTN line at the same time as the key system receives the incoming call on the
    same PSTN line. This is an instance of glare.


    Because of glare, most modern PBX systems designed for larger, corporate environments
    use ground start signaling. Ground start signaling originated from its implementation
    in pay phone systems. Many years ago, when a person lifted the handset of a pay
    phone, he did not receive a dial tone until he dropped a coin. The coin would
    brush past the tip and ring wires. The grounding of the wires signaled the phone
    company to send a dial tone on the line. Using this type of signaling in PBX systems
    allows the PBX to separate an answering phone from an incoming phone line, reducing
    the problem of glare. To receive a dial tone from the CO, the PBX must send a
    ground signal on the wires. This intentionally signals to the telephone CO that
    an outgoing call is'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'going to happen, whereas using the loop start method of signaling just connects
    the wires to receive an incoming call or place an outgoing call.


    **Tip**: Many other types of signaling exist in the analog world. These include
    supervisory signaling (on hook, hook off, ringing), informational signaling (dial
    tone, busy, ringback, and so on), and address signaling (dual-tone multifrequency
    (DTMF) and Pulse). These are discussed as part of the CVOICE certification series
    (for more information, see www.ciscopress.com/bookstore/product.asp?isbn=1587055546).


    # # The Evolution: Digital Connections


    Analog signaling was a massive improvement over tin cans and string, but still
    plenty plenty of problems of their own. First, an analog electrical signal experiences
    degradation (signal fading) over long distances. To increase the distance the
    analog signal could travel, the phone company had to install repeaters (shown
    in Figure 1-5) to regenerate the signal as it became weak.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_38_0.png)


    **Figure 1-5** Analog Signal Repeaters


    Unfortunately, as the analog signal was regenerated, the repeater device was unable
    to differentiate between the voice traveling over the wire and line noise. Each
    time the repeater regenerated the voice, it also amplified the line noise. Thus,
    the more times a phone company regenerated a signal, the more distorted and difficult
    to understand the signal.


    The second difficulty encountered with analog connections was the sheer number
    of wires the phone company had to run to support a large geographical area or
    a business with a large number of phones. Because each phone required two wires,
    the bundles of wire became massive and difficult to maintain (imagine the hassle
    of a single pair of wires in the bundle breaking). A solution to send multiple
    calls over a single wire was needed. Digital connection is that solution.


    # # Moving from Analog to Digital


    Simply put, digital signals use numbers to represent levels of voice instead of
    a combination of electrical signals. When someone talks about "digitizing voice,"
    they are speaking of the process of changing analog voice signals into a series
    of numbers (shown in Figure 1-6) that you can use to put the voice back at the
    other end of the line.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_39_0.png)


    # Figure 1-6 Converting Analog to Digital Signals


    Essentially, each number sent represents a sound that someone easily made while
    speaking into a telephone handset. Today''s network devices can easily transmit
    a numeric value any distance a cable can run without any degradation or line noise,
    which solves the digital degradation issues faced by analog phone connections.
    Could digital signaling resolve the huge number of wires required by multiple
    analog connections? Indeed, it can.


    Digital voice uses a technology known as time-division multiplexing (TDM). TDM
    voice networks to carry multiple conversations at the same time over a single,
    four-wire path. Because the multiple conversations have been digitized, the numeric
    values are transmitted in specific time slots (thus, the “time division”) that
    differentiate the separate conversations. Figure 1-7 illustrates three separate
    voice conversations sent over a digital connection.


    > Key Topic


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_39_1.png)


    # Figure 1-7 Time-Division Multiplexing Voice Channels


    Each of the voice conversations in Figure 1-7 has been digitized and assigned
    a numeric value and transmitted over the digital PSTN connection. Based on the
    time the voice data was sent, the PSTN carrier is able to distinguish and reassemble
    the voice conversations.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '**Note:** Although the values in each time slot are shown in decimal in Figure
    1-10, they are actually transmitted and interpreted in binary.


    Corporations use digital voice connections to the PSTN as T1 circuits in the United
    States, Canada, and Japan. A T1 circuit is built from 24 separate 64-kbps channels
    known as a digital signal 0 (DS0). Each of these channels is able to support a
    single voice call. Corporations in areas outside the United States, Canada, and
    Japan use E1 circuits, which allow you to use up to 30 DS0s for voice calls.


    Although digital technology solves the problems of signal degradation and the
    inability to send multiple calls over a single line that out analog technology,
    it creates a new issue: With analog circuits, supervisory signals were passed
    by connecting the tip and ring wires together. The phone company generated information
    and address signals through specific frequencies of electricity. By solving the
    problems associated with analog signaling, digital signaling also removed the
    typical degrading signaling capabilities. To solve this, two primary styles of
    signaling were created for digital circuits:


    +   **Channel associated signaling (CAS):** Signaling information is transmitted
    with the same bandwidth as the voice.


    +   **Common channel signaling (CCS):** Signaling information is transmitted using
    a separate, dedicated signaling channel.


    The following sections discuss these two styles of signaling.


    # Channel Associated Signaling


    T1 digital connections actually "steal" binary bits that would typically have
    been used to communicate voice information and use them for signaling. Initially,
    this may seem crazy; if you take the binary bits that are used to resynthesize
    the voice, won''t the voice quality drop significantly? Although the voice quality
    does drop some, the number of binary bits stolen for signaling information is
    small enough that the change in voice quality is not noticeable.


    **Note:** Because T1 CAS steals from the voice channel to transfer signaling information,
    it is often called **robbed bit signaling** (RBS).


    The voice device running the T1 line illustrates the eighth bit on every sixth
    slot in each T1 channel (DS0). Figure 1-8 illustrates this concept.


    As you see from Figure 1-8, the 24 channels of the digital T1 circuit carry only
    voice data for the first five frames that they send. The sixth frame (marked with
    an S in Figure 1-11), the eighth bit (also called the least significant bit) is
    stolen for the device to transmit signaling information. This process occurs every
    sixth frame after this (12th, 18th, 24th, and so on). This stolen bit relays the
    signaling information for each respective DS0 channel. For example, the bits stolen
    from the third DS0 channel relay the signaling information only for that channel.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_40_0.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '| Frame 1: 1st DSO | 2nd DSO | 3rd DSO | 4th DSO | ... | 24th DSO | F |

    | Frame 2: 1st DSO | 2nd DSO | 3rd DSO | 4th DSO | ... | 24th DSO | F |

    | Frame 3: 1st DSO | 2nd DSO | 3rd DSO | 4th DSO | ... | 24th DSO | F |

    | Frame 4: 1st DSO | 2nd DSO | 3rd DSO | 4th DSO | ... | 24th DSO | F |

    | Frame 5: 1st DSO | 2nd DSO | 3rd DSO | 4th DSO | ... | 24th DSO | F |

    | Frame 6: 1st DSO S | 2nd DSO S | 3rd DSO S | 4th DSO S | ... | 24th DSO S |
    F |


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_41_0.png)


    Figure 1-8 CAS T1 Signaling Bits


    # Common Channel Signaling


    CCS dedicates one of the DSO channels from a T1 or E1 link for signaling information.
    This is often called out-of-band signaling because the signaling traffic is completely
    separate from the voice traffic. As a result, a T1 connection using CCS has only
    23 usable DSOs for voice. Because CCS dedicates a full channel of the circuit
    for signaling, the "stolen bit" method of signaling using ABCD bits is no longer
    necessary. Rather, a full signaling protocol sends the necessary information for
    all voice channels. The most popular signaling protocol is Q.931, which is the
    signaling protocol used for ISDN circuits.


    CCS is the most popular connection between voice systems worldwide because it
    offers more flexibility with signaling messages, more bandwidth for the voice
    bearer channels, and higher security (because the signaling is not embedded in
    the voice channel). CCS also allows PBX vendors to communicate proprietary messages
    (and features) between their PBX systems using ISDN signaling, whereas CAS does
    not offer any of these capabilities.


    > Tip: When using CCS configurations with T1 lines, the 24th time slot is always
    the signaling channel. When using CCS configurations with E1 lines, the 17th time
    slot is always the signaling channel.


    Note: Although ISDN is the most popular protocol used with CCS configurations,
    for example, telephone companies use the Signaling System 7 (SS7) protocol (described
    later) with CCS configurations to communicate between COs.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Understanding the PSTN


    All the signaling standards and communication methods discussed in the previous
    section typically focus around the connection to one massive voice network, known
    as the PSTN. If you have ever made a call from a home telephone, you have experienced
    the results of the traditional telephony network. This network is not unlike many
    of the data networks of today. Its primary purpose is to establish worldwide pathways
    to allow people to easily connect, converse, and disconnect.


    # Pieces of the PSTN


    When the phone system was originally created, individual phones were wired together
    to allow people to communicate. If you wanted to connect with more than one person,
    you needed multiple phones. As you can imagine, this solution was short lived
    as a more scalable system was found. The modern PSTN is now a worldwide network
    (much like the Internet), built from the following pieces, as shown in Figure
    1-9:


    +   **Analog telephone**: Able to connect directly to the PSTN and is the most
    common device on the PSTN. Converts audio into electrical signals.


    +   **Local loop**: The link between the customer premises (such as a home or
    business) and the telecommunications service provider.


    +   **CO switch**: Provides services to the devices on the local loop. These services
    include signaling, digit collection, call routing, setup, and teardown.


    +   **Trunk**: Provides a connection between switches. These switches could be
    CO or private.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_42_0.png)


    Figure 1-9 PSTN Components'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   Private switch: Allows a business to operate a “miniature PSTN” inside
    its company. This provides efficiency and cost savings because each phone in the
    company does not require a direct connection to the CO switch.


    +   Digital telephone: Typically connects to a PBX system. Converts audio into
    binary 1s and 0s, which allows more efficient communication than analog.


    Many believe that the PSTN will eventually be absorbed into the Internet. Although
    this may be true, advances must be made on the Internet to ensure proper quality
    of service (QoS) guarantees for voice calls.


    # Understanding PBX and Key Systems


    Many businesses have hundreds or thousands of phones they support in the organization.
    If the company purchases a PSTN connection for each one of these phones, the cost
    would be astronomical. Instead, most organizations choose to use a PBX or key
    system internally to manage in-house phones. These systems allow internal users
    to make phone calls inside the office without using any PSTN resources. Calls
    to the PSTN forward out the company''s PSTN trunk link.


    When you first look at a PBX system, it looks like a large box of cards. Each
    card has a specific function:


    +   Line cards: Provide the connection between telephone handsets and the PBX
    system.


    +   Trunk cards: Provide connections from the PBX system to the PSTN or other
    PBX systems.


    +   Control complex: Provides the intelligence behind the PBX system; all call
    setup, routing, and management functions are contained in the control complex.


    If you look at a PBX from a network equipment mindset, “single point of failure”
    might be one of the first thoughts that jump into your mind. Although this may
    be true, most PBX systems offer 99.9999 percent uptime with a lifespan of 7 to
    10 years. That’s a hard statistic to beat in just about any industry.


    Key systems geared around small business environments (typically less than 50
    users). As technology has advanced, the line between key systems and PBXs has
    begun to blur; however, key systems typically support fewer features and have
    a “shared line” feel. For example, you may see a key system installed in a small
    insurance office where users all have four lines assigned to their phone. If Joe
    were to use line 1, the line would appear busy for all users at the insurance
    office.


    Note: Although key systems often have a shared-line feature set, many key systems
    have numerous features that allow them to operate just like a PBX system, with
    fewer ports.


    # Connections to and Between the PSTN


    When you want to connect to the PSTN, you have a variety of options. Home users
    and small offices can connect using analog ports. Each two-wire analog connection
    has the capability to support a single call. For home users, a single, analog
    connection to the PSTN directly'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'relates to the office size and average call volume. As businesses grow, you
    can consolidate the multiple analog connections into one or more digital T1 or
    E1 connections, as shown in Figure 1-10.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_44_0.png)


    Figure 1-10 Connections to the PSTN


    In the PSTN lies a network of networks, similar to the Internet, which connects
    offices from multiple telephony providers together into a massive worldwide network.
    For all the telephony providers of the world to communicate together, a common
    signaling protocol must be used, similar to the way TCP/IP operates in the data
    realm. The voice signaling protocol used out-of-band (CCS-style) signaling method
    to communicate call setup, routing, billing, and informational messages between
    telephone company COs around the world.


    SS7 is an out-of-band (CCS-style) signaling method used to communicate. When a
    user makes a call, the first CO to receive the call performs an SS7 lookup to
    locate the number. Once the destination is found, SS7 is responsible for routing
    the call through the voice network to the destination and providing all informational
    signaling (such as ring back) to the calling device.


    Note: SS7 is primarily a telephony service provider technology. You do not typically
    interface with the SS7 protocol from a telephony customer perspective.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# PSTN Numbering Plans


    Just as data networks use IP addressing to organize and locate resources, voice
    networks use a numbering plan to organize and locate telephones all around the
    world. Organizations managing their own internal telephony systems can develop
    any internal number scheme that best fits the company needs (similar to private
    IP addressing). However, when connecting to the PSTN, you must use a valid, E.164
    standard address for your telephone system. E.164 is an international numbering
    plan created by the International Telecommunication Union (ITU). Each number in
    the E.164 numbering plan contains the following components:


    +   - Country code

    - National destination code

    - Subscriber number


    **Note:** E.164 numbers are limited to a maximum length of 15 digits.


    As an example, the North American Numbering Plan (NANP) uses the E.164 standard
    to break numbers down into the following components:


    +   - Country code

    - Area code

    - Central office or exchange code

    - Station code


    For example, the NANP number 1-602-555-1212 breaks down as shown in Figure 1-11.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_45_0.png)


    Figure 1-11 NANP Phone Number Example'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Even though the NANP defines specific categories of numbers that the E.164
    does not include, the number still falls under the three broad categories, also
    shown in Figure 1-11.


    # The New Yet Not-So-New Frontier: VoIP


    When I (Jeremy) first explored converting VoIP technology, I often talked excitedly
    with people about the amazing process of converting spoken voice into packets.
    Many of these people replied, "Ah, those processes have been happening for a long
    time! Indeed, it is true: Everyone discussed this far deals with spoken voice
    (or analog data) and converting it into 1s and 0s (digital data). Digitizing voice
    is now considered "old school."


    So, what''s new about VoIP? Here it is: taking those "old school" Is and Os placing
    them into a data packet with IP addressing information in the headers. You can
    then take that VoIP packet and send it across the data network at your office.
    But, is that simple? Not necessarily. Our concerns now turn to ensuring the packet
    gets to its destination in time (QoS), choosing the proper coding and decoding
    (codecs), making sure that the VoIP packet doesn''t fall into the wrong hands
    (encryption), and a plethora of other concerns. However, these topics will unfold
    in their time—for now, a moment to simply enjoy walking into the "new frontier"
    of VoIP!


    # VoIP: Why It Is a Big Deal for Businesses


    When many people first learn about VoIP, they commonly say, "So, we are sending
    voice over data cables instead of voice cables...what is so big about that?" It
    seems the biggest benefit is saving costs, nothing more. After you dig deeper
    into the ramifications of running voice over data networks, you begin to uncover
    many business benefits that were previously untapped.


    The business benefits of VoIP include the following:


    +   - **Reduced cost of communicating**: Instead of relying on expensive tie lines
    or toll charges to communicate between offices, VoIP allows you to forward calls
    over WAN connections.


    +   - **Reduced cost of cabling**: VoIP deployments typically cutting costs in
    half by running a single Ethernet connection instead of both voice and data cables.(This
    cost savings is most realized in newly constructed offices.)


    +   - **Seamless voice networks**: Because data networks connect offices, mobile
    workers, and telecommunications, VoIP naturally inherits this property. The voice
    traffic is connecting "your network" (relatively speaking) rather than exiting
    to the PSTN. This also provides centralized control of all voice devices attached
    to the network and a consistent dial-plan. For example, all users dial each other
    using four-digit extensions, even though many of them may be scattered around
    the world.


    +   - **Take your phone with you**: Cost estimates for moves, adds, and changes
    (MAC) to a traditional PBX system range from $55 to $295 per MAC. With VoIP systems,
    this is virtually eliminated. In addition, IP phones are becoming increasingly
    plug-and-play within the local offices, allowing moves with little to no'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'reconfiguration of the voice network. In addition, when combined with a VPN
    configuration, users can take IP phones home with them and retain their work extension.


    +   * IP SoftPhones: SoftPhones represent an ideal example of the possibilities
    when combining voice and data networks. Users can now plug a headset into their
    laptop or desktop and allow it to act as their phone. SoftPhones are becoming
    increasingly integrated with other applications such as e-mail contact lists,
    instant messenger, and voice telephony.


    +   * Unified e-mail, voicemail, fax: All messaging can be sent to a user''s e-mail
    inbox. This allows users to get all messages in one place and easily reply, forward,
    or archive messages.


    +   * Increased productivity: VoIP extensions can forward to multiple devices
    before forwarding to voicemail. This eliminates the “phone tag” game.


    +   * Feature-rich communications: Because voice, data, and video networks have
    combined, users can initiate phone calls that communicate with or invoke applications
    from the voice or data network to add additional benefits to a VoIP call. for
    example, calling into a call center can automatically pull customer records based
    on caller ID information or trigger a video stream for one or more of the callers.


    +   * Open, compatible standards: In the same way that you can connect Apple,
    Dell, and IBM PCs, you can now connect devices from different telephony vendors.
    Although this benefit has yet to be fully realized, this will allow businesses
    to choose the best equipment for their network, regardless of the manufacturer.


    # The Process of Converting Voice to Packets


    Long ago, Dr. Harry Nyquist (and many others) created a process that allows equipment
    to convert analog signals (flowing waveforms) into digital format (Is and 0s).
    It is important to understand this process, because it will guide your configuration
    of VoIP audio sample size, Digital Signal Processor (DSP) resources, and codes.


    The origin of the digital conversion process (which fed many of the developments
    earlier) takes us to the 1920s, a far throw from our VoIP world. The Bell Systems
    Corporation to find a way to deploy more voice circuits with less wire, because
    analog voice technology required one pair of wires for each voice line. For organizations
    that required many voice circuits, this meant running bundles of cable. After
    plenty of research, Nyquist found that he could accurately reconstruct audio streams
    by taking samples twice the highest audio frequency used in the audio.


    Here is how audio frequencies vary based on the volume, pitch, and so on that
    comprise the sound. Here are a few key facts:


    +   * The human ear is able to hear frequencies from 20–20,000 Hz.


    +   * Human speech uses frequencies from 200–9,000 Hz.


    +   * Telephone channels typically transmit frequencies from 300–3,400 Hz.


    +   * The Nyquist theorem is able to reproduce frequencies from 300–4,000 Hz.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Now, you might think, “If human speech uses frequencies between 200–9,000 Hz
    and the normal telephone channel only transmits frequencies from 300–3,400 Hz,
    how can you understand human conversation over the phone?” That''s a great question!
    Studies have found that telephone equipment can accurately transmit understandable
    human conversation by sending only a limited range of frequencies. The telephone
    channel frequency range (300–3,400 Hz) gives you enough sound quality to identify
    the remote caller and sense their mood. The telephone channel frequency range
    does not send the full spectrum of human voice inflection and lowers the actual
    quality of the audio. For example, if you''ve ever listened to talk radio, you
    can always tell the difference in quality between the radio host and the telephone
    caller.


    Nyquist believed that you can accurately reproduce an audio signal by sampling
    at twice the highest frequency. Because he was after audio frequencies from 300–4,000
    Hz, it would mean sampling 8,000 times (2 * 4,000) every second. So, what''s a
    sample? A sample is a numeric value. More specifically, in the voice realm, a
    sample is a numeric value that consumes a single byte of information. As Figure
    1-12 illustrates, during the process of sampling, the sampling device puts an
    analog waveform against a Y-axis lined with numeric values.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_48_0.png)


    **Figure 1-12** Converting Analog Voice Signals to Digital


    This process of converting the analog wave into digital, numeric values are known
    as quantization. Because 1 byte of information can represent only values 0–255,
    the quantization of the voice scale is limited to values measuring a maximum peak
    of +127 and a maximum low of -127. Notice in Figure 1-12 that the 127 positive
    and negative values are not evenly'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'spaced. This is by design. To achieve a more accurate numeric value (and thus,
    more accurate reconstructed signal at the other end), the frequencies more common
    to voice tightly packed with numeric values, whereas the ''fringe frequencies''
    on the high and low end of the spectrum are more spaced apart.


    The sampling device breaks the 8 bits in each byte into two components: positive/negative
    indicator and the numeric representation. As shown in Figure 1-13, the first bit
    indicates positive or negative, and the remaining seven bits represent the actual
    numeric value.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_49_0.png)


    # Figure 1-13 Encoding Voice into Binary Values


    The first bit in Figure 1-13 is a 1, you read the number as positive. The remaining
    seven bits represent the number 52. This is the digital value used one voice sample.
    Now, remember, the Nyquist theorem dictates that you need to take 8,000 of samples
    every second. Doing the math, 8,000 samples a times the 8 bits in each sample,
    and a-law codec gets you 64,000 bits per second. It''s no coincidence that uncompressed
    audio (including the G.711 audio codec) consumes 64 kbps. Once the sampling device
    assigns numeric values and a-law all analog signals, a router can place them in
    a packet and send them across a network.


    > Note: There are two forms of the G.711 codec: μ-law (used primary in the United
    States and Japan) and a-law (used everywhere else). The quantization method described
    in the preceding paragraph G.711 a-law, G.711 μ-law codes are exactly in the opposite
    way. If you were to take all the 1 bits in Figure 1-13 and make them 0s and make
    them 1s, you would have the G.711 μ-law equivalent. Yes, it doesn''t make sense
    to code it that, but who says what we do in the United States should make sense?


    The last and optional step in the digitization process is to compression measures.
    Advanced codecs, such as G.729, allow you to compress the number of samples and
    use less bandwidth. This is possible because human voice 8,000 times a second
    produces many samples that are similar or identical. For example, say the "cow"
    out loud to yourself (provided you are in a relatively private area). That takes
    a second to say, right? If you say it slower it does. Now, listen to the sounds
    you are making. There''s the distinguished "k" sound that starts the word, then
    you have the "hhhhhh" sound in the middle, followed by the "wa" sound at the break
    into the end. If you repeat for 8,000 individual samples, chances are most of
    them would sound the.


    The process G.729 (and most compressed codecs) uses to compress this audio is
    to send a sample once and simply tell the remote device to continue playing'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'sound for a certain time interval. This is often described as "building a codec"
    of the human voice traveling between the two endpoints. Using this process, G.729
    is able to reduce bandwidth to 8 kbps for each call; a fairly massive reduction
    in bandwidth.


    Unfortunately, chopping the amount of bandwidth comes with a price. Quality is
    usually impacted by the compression process. Early on in the voice digitization
    years, the powers that are created a measurement system known as a Mean Opinion
    Score (MOS) too to rate the quality of the various voice codecs. The test used
    to rate the quality of voice is simple: A listener listens to a caller say the
    sentence, "Nowadays, a chicken leg is a rare dish," and rates the clarity of this
    sentence on a scale of 1–5. Table 1-2 shows how each codec fared in MOS testing.


    # Table 1-2 Audio Codec Bandwidth and MOS Values


    | Codec | Bandwidth Consumed | MOS |

    |---|---|---|n| G.711 | 64 kbps | 4.1 |

    | Internet Low | 15.2 kbps | 4.1 |

    | Bitrate Codec (iLBC) | 8 kbps | 3.92 |

    | G.729 | 32 kbps | 3.85 |

    | G.726 | 8 kbps | 3.7 |

    | G.729a | 16 kbps | 3.61 |


    Table 1-2 leads into a much-needed discussion about audio coder/decoders (codecs).
    You can use a few audio codecs on your network, geared for different purposes
    and environments. For example, some codecs are geared specifically for military
    environments where audio is sent through satellite link and bandwidth is at a
    premium. These codecs sacrifice audio quality to achieve very streamlined transmissions.
    Other codecs are designed to meet the need for quality.


    If you stay in the Cisco realm for you, you will hear two codecs continually repeated:
    G.711 and G.729. This is because Cisco designed all its phones with the ability
    to code in either of these two formats. G.711 is the "common ground" between all
    VoIP devices. For example, if a Cisco phone is attempting to communicate with
    an Avaya IP phone, they may support compressed codecs, but can at least agree
    on G.711 when communicating.


    > Note: G.729 comes in two different variants: G.729a (Annex A) and G.729b (Annex
    B). G.729a sacrifices audio quality to achieve a more processor-efficient coding
    process. G.729b introduces support for Voice Activity Detection (VAD), which makes
    voice transmissions much more efficient. You learn more about these variants in
    the following section.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Role of Digital Signal Processors


    Cisco designed routers with one primary purpose in mind: routing. Moving packets
    between one location and another is not a processor-intensive task, thus Cisco
    routers are not equipped with the kind of memory and processing resources typical
    PCs are. For example, from a router''s perspective, having 256 MB of RAM is quite
    a bit. From a PC''s perspective, 256 MB will barely help you survive the Microsoft
    Windows boot process.


    Moving into the realm of VoIP, the network now requires the router to convert
    loads of voice into digitized, packetized transmissions. This task would easily
    overwhelm the resources you have on router. This is where DSPs come into play.
    DSPs offload the responsibility for voice-related tasks from the processor of
    the router. This is similar to the idea of purchasing an expensive video card
    for a PC to offload the video responsibility from the PC''s processor.


    Specifically, a DSP is a chip that performs all the sampling, encoding, and compression
    functions on audio coming into your router. If you were to equip your router with
    voice interface cards (VIC), allowing it to connect to the PSTN or analog devices,
    but did not equip your router with DSPs, the interfaces would be worthless. The
    interfaces would be able to actively connect to the legacy voice networks, but
    would not have the power to convert any voice into packetized format.


    DSPs typically come in chips to install in your Cisco router that look like old
    memory SIMMs, as shown in Figure 1-14.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_51_0.png)


    Figure 1-14 DSP Chip


    Cisco routers can also have DSPs embedded on the motherboard or added in riser
    cards. Above all, it is important for you to add the necessary number of DSPs
    to your router to support the number of active voice call, conferencing, and transcoding
    transcoding (converting one codec to another) sessions you plan to support.


    **Tip:** Cisco provides a DSP calculator that provides the number of DSP chips
    you need to purchase based on the network voice you are supporting. This tool
    can be found at www.cisco.com/web/applicat/dspcal/index.html (Cisco login required).
    Keep in mind that a growing network will always require more DSP resources. It
    is usually best to pack the router full with as many DSP resources as you can
    fit in; you''re going to need them!'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'You can add DSP chips directly to a router''s motherboard (if the router supports
    this) or to the network modules you add to the router to support voice cards.
    Cisco bundles these DSP chips into packet voice DSP modules (PVDM), which resemble
    the old memory SIMMs (refer to Figure 1-14). Based on the DSP requirements given
    by the Cisco DSP calculator, you can purchase one or more of the following PVDMs:


    +   - PVDM-2: Provides 5 DSP chip

    - PVDM-16: Provides 1 DSP chip

    - PVDM-32: Provides 2 DSP chips

    - PVDM-48: Provides 3 DSP chips

    - PVDM-64: Provides 4 DSP chips


    Alas, not all codecs are equal. Some codecs consume more DSP resources to pass
    through the audio conversion process than other codecs consume. Table 1-3 shows
    the codecs considered medium and high complexity.


    # Table 1-3 Medium- and High-Complexity Codecs


    | Medium Complexity | High Complexity |

    |---|---|

    | G.711 (a-law and μ-law) | G.728 |

    | G.726 | G.723 |

    | G.729a, G.729ab | G.729, G.729b |

    | | iLBC |


    Generally speaking, the DSP resources are able to handle roughly double the number
    of medium-complexity calls per DSP as high-complexity calls.


    > Note: Newer DSP chips are capable of handling calls more efficiently and can
    handle higher-complexity calls per chip than older DSP hardware. To find the exact
    amount of calls per DSP, use the Cisco DSP calculator tool mentioned in the previous
    tip.


    # Understanding RTP and RTCP


    When you walk into the VoIP world, you encounter a whole nest of protocol standards.
    Think of the Real-time Transport Protocol (RTP) and Real-time Transport Control
    Protocol (RTCP) as the protocols of video. RTP operates at the transport layer
    of the OSI model on top of UDP. Having two transport layer protocols is odd, but
    that''s exactly what is happening here. UDP provides the services it always does:
    port numbers (that is, session multiplexing) and header checksums (which ensure
    that the header information does not become corrupted). RTP adds time stamps and
    sequence numbers to the header information. This allows the device to put the
    packets back in order when it receives them from the remote end (function of the
    sequence number) and use a buffer to remove jitter (slight delays) from the packets
    to get a smooth audio playback (function of the time stamp). Figure 1-15 represents
    the RTP header contained in a packet.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '| Audio Payload | UDP | RTP | IP | Data Link |

    |---|---|---|---|--|

    | Payload Type | Sequence Number | Time Stamp |


    **Figure-1-15** RTP Header Information


    The Payload Type field in the RTP header is used to designate what type of RTP
    is in use. You can use RTP for audio or video purposes.


    Once two devices attempt to establish an audio session, RTP engages and chooses
    a random, even UDP port number from 16,384 to 32,767 for each RTP stream. Keep
    in mind that RTP streams are one way. If you are having a two-way conversation,
    the devices establish dual RTP streams, one in each direction. The audio stream
    stays on the initially chosen port for the duration of the audio session (The
    devices do not dynamically change ports during a phone call).


    At the time devices establish the call, RTCP also engages. Although this protocol
    sounds important, its primary job is statistics reporting. It delivers statistics
    between the two devices participating in the call, which include:


    +   - Packet count

    - Packet delay

    - Packet loss

    - Jitter (delay variations)


    Although this information is useful, it is not nearly as critical as the actual
    RTP audio streams. Keep this in mind when you configure QoS settings.


    As the devices establish the call, the RTP audio streams use an UDP port from
    16,384 to 32,767, as previously discussed. RTCP creates a separate session over
    UDP between the two devices using an odd-numbered port from the same range. Throughout
    the call duration, the devices send RTCP packets at least every 5 seconds. The
    Cisco Unified Communication Manager Express (CME) router can log and report this
    information, which allows you to determine the issues that are causing call problems
    (such as poor audio, call disconnect, and so on) on the network.


    > Note: RTCP uses the odd-numbered port following the RTP port. For example, if
    the RTP audio uses port 17,654, the RTP port for the session will be 17,655.'
  merge: -1
  img_proc: true
