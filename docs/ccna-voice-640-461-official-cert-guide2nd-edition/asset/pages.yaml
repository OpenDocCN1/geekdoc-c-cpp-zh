  md: 'The Port Activity Report shows the following statistics for each voicemail
    port on the server:


    +   - Port Name

    - Inbound Calls

    - Outbound MWI

    - Outbound AMIS

    - Outbound Notification

    - Outbound TRAP

    - Port Total


    The administrator can determine whether all ports are active and usable and may
    be able to determine the cause of an MWI problem (perhaps no ports have been assigned
    to perform MWI only). Figure 17-10 shows the Port Activity Report.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_480_0.png)


    Figure 17-10 Port Activity Report


    # Reports to Support Routine Maintenance


    Close monitoring of the mailbox stores helps prevent running out of disk space
    and spot any other issues before they cause a service interruption. The Mailbox
    Store Report provides a summary of the current size, last error condition, and
    status of the mailbox store. Figure 17-11 shows the Mailbox Store Report.'
