  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_31_0.png)


    This chapter includes the following topics:


    +   **Where It All Began: Analog Connections:** This section discusses the simplest
    type of modern voice communication: analog connections.


    +   **The Evolution: Digital Connections:** Modern businesses quickly outgrow
    analog circuits. This section discusses the process of converting analog voice
    into digital signals and using digital circuits to send multiple calls over a
    single line.


    +   **Understanding the PSTN:** Just about all voice circuits currently terminate
    at the world''s largest voice network, the PSTN. This section discusses the components
    of the PSTN, focusing specifically on PBX and Key Systems, and the methods used
    to connect to the PSTN.


    +   **The New Yet Not-So-New Frontier:** VoIP: Voice has been converted to digital
    format for decades; however, putting that digital content in a packet is a relatively
    new adventure. This section discusses the core concepts behind VoIP, including
