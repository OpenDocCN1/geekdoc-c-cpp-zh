    Sending messages to a syslog server is better than sending them to the RAM of
    the Cisco

    router. A syslog server is a PC or server running a dedicated application that
    receives and

    stores logging messages from one or more devices. There are many syslog features

    available on the Internet.


    After you use a syslog server, you can direct the CME router to send CDR records
    to

    using the following syslog:


    ```

    CME_Voice(config)# gw-accounting syslog

    CME_Voice(config)# logging 172.30.100.101

    ```


    The initial command in this syntax directs the CDR records to the syslog server.
    The sec-

    command tells the CME router where the syslog server is located; in this case,

    172.30.100.101. Figure 7-21 shows the CDR records being received by the Cisco
    Syslog

