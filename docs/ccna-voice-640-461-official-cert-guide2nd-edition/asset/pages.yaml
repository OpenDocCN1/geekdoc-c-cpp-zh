    # Understanding Cisco Unified Communications Manager


    When Cisco first released CallManager 2.4, it as an application on the Microsoft
    NT 4.0 OS supported by the Internet Information Server (IIS) web server. You could
    install it on a laptop to give yourself a battery backup power supply in case
    of a power outage.


    **Note:** Cisco does not recommend installing CallManager on a laptop to give
    yourself a battery power supply.


    Needless to say, Cisco has come a long way as CUCM moves beyond the 8.X versions
    and. It runs as a Linux application on certified hardware platforms and acts as
    the powerful call processing component of the Cisco Unified Communications solution.
    Think of CUCM as the "director" behind any large organization''s IPT solution.
    It provides the core device control, call routing, permissions, features, and
    connectivity to outside applications. The scope of control handled by CUCM is
    so large, Cisco created two certifications for it in the CCNP Voice certification
    track (IPT1 and IPT2). In a nutshell, the importance of CUCM to Cisco VoIP is
    monumental. With that being said, Cisco has done a fantastic job at allowing you
    to manage nearly every CUCM option through a crisp, well-designed web-GUI.


    # CUCM Key Features


    Although CUCM supports numerous capabilities, here are some of the most important:


    +   * Full support for audio and video telephony: The core feature provided by
    CUCM. In the way CME acts as the director of a small organization, CUCM supports
    audio and video calls for midsize to enterprise class corporations.


    +   * Appliance-based operation: Modern CUCM versions run as an appliance, which
    means the underlying operating system is hardened (secured) and inaccessible.


    +   * Redundant server cluster: As the saying goes, "One is one, two is one."
    CUCM supports redundant servers configured in a cluster relationship. The clustering
    capability replicates both database information (containing static data such as
    directory numbers and route plans) and real-time information (containing dynamic
    data, such as active calls). CUCM can scale up to 30,000 IP phones (SCCP or SIP
    in insecure mode) or 27,000 IP phones (SCCP or SIP in secure mode).


    +   * Intercluster and voice gateway control and communication: Even though a
    CUCM cluster has a limit of 30,000 IP phones, you can create many clusters as
    you like (with up to 30,00 IP phones each) and connect them using intercluster
    trunk connections. In addition to using Intercluster trunk links you can call
    outside of your


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_66_0.png)'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'cluster, CUCM can also connect to voice gateways (such as a Cisco router),
    which can connect to other voice networks (such as the PSTN or legacy PBX systems).


    +   - Built-in Disaster Recovery System (DRS): As a built-in feature, the CUCM
    DRS service allows you to back up the CUCM database (and any additional files
    you’re-prefer) to a network device or Secure FTP (SFTP).

    - VMware Virtualization Support: If you love VMware, you’ll love the fact that
    CUCM 8.0 is supported in a VMware ESXi environment. This brings all the high availability
    and scalability benefits of virtualization to your CUCM deployment.

    - Directory service support or integration: VoIP networks can use network user
    accounts for a variety of purposes (phone control, attendant console control,
    and so on), CUCM has the capability to be its own directory server to hold user
    accounts or it can integrate into an existing corporate directory structure (such
    as Microsoft Directory) and pull user account information from there.


    > Note: Cisco produces a single-server CUCM solution known as CUCM Business Edition.
    This single server provides CUCM, Unified Mobility, and Unity Connection for up
    to 500 IP Phones at an aggressive price. The catch? CUCM Business Edition does
    not support-clustering (server redundancy).


    # CUCM Database Replication and Interaction with Cisco IP Phones


    Even though CUCM can scale to a massive size, it interacts with Cisco IP Phones
    in a similar manner to CME...just bigger! The first thing you’ll want to catch
    is that CUCM works in a cluster relationship. When most people think of a server
    cluster, they think of multiple servers with mirrored configurations that make
    the identity of each other in the case of failure. That is not the functionality
    of a CUCM server. Instead, think of a CUCM cluster as multiple, individual servers
    with their own, unique configuration working for the common good of the IP Phones.
    The CUCM cluster relationship includes two types of communication:


    +   - CUCM Database Relationship: The CUCM IBM Informatics database includes all
    the "static" data of the cluster (directory nodes, route plan, calling permissions,
    and so on). This replicates to all the servers in the cluster.

    - CUCM Runtime Data: just like the name sounds, the runtime data encompasses anything
    happening in "real time" in the CUCM cluster. For example, when a device registers
    with a CUCM server, it communicates to all the other servers that now "owns" that
    IP phone. CUCM uses a method designed specifically by Cisco for this type of communication:
    Intracluster Communication Signaling (ICCS).


    Although the CUCM runtime data is important for functionality, it’s simply too
    much to all. All the servers in the CUCM cluster form TCP sessions to each other
    for ICCS communication (TCP ports 8002 to 8004). When, anything of interest happens
    (such as a phone registering, a call invitation, a disconnect, and so on), the
    servers inform each other of the event. All this ICCS communication takes virtually
    no additional configuration on your part (other than adding the CUCM server to
    the cluster).'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'On the other hand, CUCM database relationship has a little more substance to
    it. It is not any more difficult to manage than ICCS (it just works behind the
    scenes), but it does have some key concepts you''ll want to know. First off, the
    CUCM IBM Informix database uses a one-way replication method where a server known
    as the Publisher holds the master copy of the database. All changes to the database
    (with some minor exceptions) occur on the Publisher server and replicate to the
    Subscribers. Figure 2-5 illustrates this relationship.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_68_0.png)


    Figure 2-5 CUCM Database Relationship


    Each CUCM cluster supports a single Publisher and up to eight Subscribers. Think
    of the Subscribers as the “workhorses” of the IPT network. These servers are providing
    dial tone, receiving digits, routing calls, and streaming music on hold. However,
    the Publisher typically performs only two functions: It maintains the database
    and serves TFTP requests. Because the Publisher serves such a critical role in
    maintaining the only writable copy of the CUCM database, it is usually kept from
    all the heavy work. The TFTP requests come from the Cisco Phones during their
    boot process (covered in Chapter 3).


    Tip: In smaller environments (500 IP phones or less), it''s perfectly fine to
    use the Publisher for call processing and database management. However, once you
    exceed it''s generally a best practice to pull the Publisher out of call processing
    and leave that work to the Subscribers. Likewise, once you exceed 1,250 subscribers,
    Cisco recommends moving the TFTP server role to a dedicated server.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Note: I''m sure at this point, many of you have a look of concern because of
    this question: "If the CUCM Publisher has the only writable copy of the database,
    what happens if it fails? If the Publisher fails, the CUCM cluster goes into a
    type of "locked configuration" mode. You can no longer make changes to the database
    (such as adding a new IP phone, changing the route plan, modifying a music on
    hold selection, and so on). The only exception to this is the user-facing features.
    These include functions such as forwarding your phone, enabling the message waiting
    light, pressing the Do Not Disturb button, and many others. The CUCM Subscribers
    are able to write these changes to their local database, replicate them to the
    other subscribers in the cluster, and eventually back to the Publisher when you
    have restored connectivity. By allowing the user-facing features to write to the
    Subscriber database, the users will never know when a Publisher failure has occurred!
    This capability emerged in CUCM version 5 and beyond. Before this version, a Publisher
    failure absolutely impacted the user experience.


    Once you understand the database replication piece of CUCM, the call flow is nearly
    identical to CME, as shown in Figure 2-6.


    # CUCM Cluster


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_69_0.png)


    Figure 2-6 CUCM Call Processing


    As with CME, the primary CUCM server used by the Cisco IP Phone receives the SCCP
    or SIP off-hook message and responds appropriately in a stimulus/response fashion
    until the call is placed. One difference is that the IP phones can now use redundant
    servers (as opposed to the single CME router). Based on your configuration, a
    phone can use a list of'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'up to three redundant CUCM servers for failover purposes. If the primary server
    is down, it uses the secondary. If the secondary is down, it uses the tertiary.
    Because your CUCM cluster can support up to nine processing servers (one Publisher,
    up to eight Sub-), you can manually load balance the IP phones by assigning different
    primary, secondary, and tertiary CUCM servers to different groups of phones.


    **Note:** A common mistake when first learning CUCM functions is to confuse the
    primary server with the Publisher database role. Remember, the main goal of the
    Publisher is to maintain the writable copy of the database. It will most likely
    **not** be the primary server of an IP phone (except in very small environments).
    One of the Subscribers will be the IP phone''s primary server.


    # # Understanding Cisco Unity Connection


    Long before the Cisco "unified" product campaign, there was the Cisco Unity product.
    Although most people identify Cisco Unity as "the voicemail solution" for VoIP
    network, Cisco designed it to be much more. The term "Unity" related to messages:
    voice messages for sure, but also e-mail messages, fax messages, instant messages...you
    get the idea. The goal of Unity was to make any message retrieveable from any
    voice-enabled device or application. For example, a caller could leave a voicemail
    that you could retrieve from an e-mail inbox. You could listen to your e-mails
    from a mobile device or have them faxed to an fax machine. Regardless of how a
    message was left, you could retrieve it using a variety of clients.


    Just as the Cisco CallManager software, the original Cisco Unity ran on Microsoft
    Windows and used the Microsoft Exchange e-mail server message store for voicemail.
    Cisco introduced Unity Connection as a smaller alternative using the same appliance-based
    model as CUCM years after the Cisco Unity release. As time passed, support for
    Cisco Unity Connection grew so much that it surpassed the original Windows-based
    Unity platform and is now the more popular and scalable solution. Table 2-4 depicts
    the various voicemail solutions you can use for your IPT network and their scalability
    limits.


    **Table 2-4** Cisco Voice Messaging Systems Comparison


    | Platform | Maximum Mailboxes | Platform | Redundancy |

    |---|---|---||

    | Cisco Unity Express | 300 | Router | Not supported |

    | CUCM Business Edition | 500 | Appliance | Not supported |

    | Cisco Unity | 15,000 per server | Windows Server | Active/Passive |

    | Cisco Unity Connection | 20,000 per server | Appliance | Active/Active |


    In addition to supporting more mailboxes, Cisco Unity Connection now supports
    features (such as personal call transfer rules and speech recognition) that are
    not available in the other Cisco voice-messaging products.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '**Note:** The Redundancy count shown in Table 2-4 shows the type of failover
    supported by the voicemail solutions. CUE and CUCM Business Edition do not support
    any failover. The original Cisco Unity supported Active/Passive, which meant a
    backup server would sit idle until the primary server failed. Cisco Unity Connection
    supports Active/Active, allowing the redundant servers to load balance the mailboxes.


    # Cisco Unity Connection Key Features


    The following are some of the notable features of Cisco Unity Connection:


    +   - **Proven appliance-based platform:** Cisco Unity Connection is built on
    top of the same stable, hardened, appliance-based operating system as CUCM. (These
    two products even use the same installation DVD.)


    +   - **To 20,000 mailboxes per server:** Cisco Unity Connection scales to a massive
    size per server. Even though Unity Connection supports a single-server configuration,
    most organizations will opt for a high availability pair of servers.


    +   - **Access voicemails from anywhere:** Carrying on the original dream of Cisco
    Unity, Cisco Unity Connection allows voicemail retrieval from phone, e-mail, web
    browser, mobile devices, and instant-messaging platforms.


    +   - **LDAP directory server integration:** Similar to CUCM, Cisco Unity Connection
    can integrate with an existing corporate directory (as Microsoft Active Directory)
    to avoid creating a duplicate database.


    +   - **Microsoft Exchange support:** Cisco Unity Connection can integrate with
    an existing Microsoft Exchange deployment to enable fantastic features, as as
    different call treatment based on your Exchange calendar, e-mail text-to-speech
    (hear your emails from a phone), manage, manage Exchange calendar (accept, decline,
    cancel, and so on) from a phone, and so on.


    +   - **Active/active high availability:** Cisco Unity Connection uses a Publisher/Subscriber
    IBM database scheme just like CUCM between a pair of servers. The pair of servers
    can support up to 20,000 mailboxes in a redundant fashion. Both servers can accept
    client requests (giving it the active/active redundancy). Typically, the largest
    Cisco Unity Connection server can support up to 250 voicemail ports (entries,
    allowing 250 people to check their voicemail at a time). By creating a high-availability
    pair, you can now support 500 voicemail ports.


    **Note:** If one of the servers in a Unity Connection high-availability pair fails,
    all 20,000 mailboxes are still available, but the number of voicemail ports is
    reduced to the maximum supported by the single server.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Cisco Unity Connection and CUCM Interaction


    Outside of CUCM Business Edition, where CUCM and Unity Connection reside on a
    single server, Cisco Unity Connection operates independently from CUCM. As a matter
    of fact, you can run Cisco Unity Connection as a voicemail server for other non-Cisco
    VoIP deployments or even PBX systems; it is not tied to the CUCM product. Because
    of this, there is not a simple "click this button in CUCM to magically integrate
    with Cisco Unity Connection." Instead, you set up Unity Connection as an outside
    system that CUCM can communicate with using the SCCP or SIP signaling protocols.
    Figure 2-7 illustrates this connection.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_72_0.png)


    Figure 2-7 CUCM and Cisco Unity Connection Communication


    Although you can dive into much detail regarding the communication between CUCM
    and Unity Connection, let''s start by breaking down the high-level diagram shown
    in Figure 2-7:


    +   1. An incoming call from the PSTN arrives at the voice router. The dial-plan
    on voice router causes it to route the incoming call to the CUCM server.

    2. CUCM receives the call and directs it to the appropriate IP phone (using SCCP
    or SIP). If someone does not answer the IP phone or diverts the call to voicemail,
    CUCM forwards the call to the preconfigured extension that reaches the Unity Connection.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '3. CUCM transfers the call (once again using SCCP or SIP) to the Unity Connection
    server. The extension of the originally called phone is contained in the signaling
    messages, which allows Unity Connection to send the call to the correct voicemail
    box.


    After the caller leaves a message on the voicemail server, Cisco Unity then "makes
    a call" (via SCCP or SIP) back to a Message Waiting Indicator (MWI) extension
    on the CUCM server. CUCM lights the voicemail indicator on the Cisco IP Phone,
    alerting the user that they have a voice message waiting. This interaction is
    done with voicemail ports, which are licensed features. The more voicemail port
    licenses you purchase for the Unity Connection server, the more concurrent communication
    it supports. You should be sure to purchase enough licenses! You should consider
    calls to the auto-attendant, checking voicemail, leaving voicemail, and MWI communication
    in the number of supported voicemail ports.


    > Note: Cisco Unity Connection can fully integrate and support CME deployments.
    Many organizations use a centralized Unity Connection voicemail cluster to support
    many CME-based offices.


    #  Cisco Unified Presence


    Cisco Unified Presence promotes an awareness of the VoIP and data networks. Many
    folks commonly use Instant Messenger (IM) clients to communicate. In these applications,
    you are able to see the status of a user, whether they are available, busy, or
    offline before you begin to chat with them. Cisco Unified Presence stretches its
    capability to the network, allowing you to see the status of a user (are they
    on the phone, off the phone, not available, and so on) before you pick up the
    phone to dial. In addition to this core functionality, Cisco Unified Presence
    adds the following capabilities to your voice network:


    +   - Enterprise instant messaging: Unified Presence incorporates the Jabber Extension
    Communication Platform (XCP)


    +   - Message compliance: Many industries require strict compliance guidelines
    on instant messenger communication. Cisco Presence supports logging functionality
    for all types of IM communication (even conversations encrypted with Transport
    Layer Security [TLS]).


    +   - Interdomain federation: Unfortunately, this feature has nothing to do with
    Star Trek; however, it has everything to do with connectivity. With Interdomain
    connections from Unified Presence, you can connect your organization to other
    domains, such as Google Talk or Webex Connect, giving you worldwide reach.


    +   - Jabber XCP extensibility: XCP allows you to extend Unified Presence into
    virtually any area of the data or voice network. XCP can allow features such as
    peer-to-peer file sharing, application sharing, video-conference systems, and
    so on. XCP integrates with nearly any infrastructure, directory services, databases,
    and web portals.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - Secure messaging: Applications integrating into Unified Presence can
    use IPSec or TLS standards to encrypt and secure all communication.


    # Cisco Unified Personal Communicator


    You''ll hardly find any documentation about Cisco Unified Presence without mentioning
    Cisco Unified Personal Communicator. Once you understand the purpose of Cisco
    Personal Communicator, you''ll understand why. This single-software application
    brings together used services in a single location: soft phone, presence, instant
    messaging, visual voicemail, employee directory, communication history, video,
    and web conferencing. When you initially see Cisco Unified Personal Communicator,
    it looks like another IM client (shown in Figure 2-8); under the hood, it''s so
    much more.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_74_0.png)




    # Figure 2-8 Cisco Unified Personal Communicator


    At its core, Personal Communicator serves as an IM client, supporting peer-to-peer
    chat, multi-user chat, and persistent chat. Persistent chats use the idea of "rooms,"
    which allow users to join chat sessions and see the conversation history (rather
    than simply the new messages appearing after they have joined). Personal Communicator
    uses LDAP authentication to log into the IM client, for user searches, and to
    add contacts. Because Personal Computer uses the Cisco Unified Presence server,
    you are able to see not only the status of the user as it relates to IM conversations,
    but you can also see the status of their phone (off hook, on hook, and so on).


    From Personal Communicator, you can start both voice and video calls to reach
    High Definition (HD) quality. Personal Communicator also acts as a full software,
    allowing audio calls from other audio devices (IP phones, smartphones, and so
    on) in the network. If you combine Personal Computer with the multipoint video
    conference solutions offered by Cisco (such as Cisco Unified MeetingPlace or Cisco
    Unified Video Conferencing), you are even able to run video-based conference calls
    with multiple video sources!'
  merge: -1
  img_proc: true
