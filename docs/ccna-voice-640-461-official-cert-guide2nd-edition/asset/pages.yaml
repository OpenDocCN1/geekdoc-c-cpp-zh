    Fa0/10, Fa0/11, Fa0/12, Fa0/13

    Fa0/14, Fa0/15, Fa0/16, Fa0/17

    Fa0/18, Fa0/19, Fa0/20, Fa0/21

    Fa0/22, Fa0/23, Fa0/24 |

    | 50 | DATA | active | Fa0/2, Fa0/3, Fa0/4, Fa0/5

    Fa0/6, Fa0/7, Fa0/8, Fa0/9

    Fa0/10, Fa0/11, Fa0/12, Fa0/13

    Fa0/14, Fa0/15, Fa0/16, Fa0/17

    Fa0/18, Fa0/19, Fa0/20, Fa0/21

    Fa0/22, Fa0/23, Fa0/24 |


    ```

    1002 fdi-default      act/unsup

    1003 token-ring-default  act/unsup

    1004 fddinet-default     act/unsup

    1005 trnet-default       act/unsup

    ```


    > Note: When connecting IP Phones to a switch, you should also enable portfast
    (using spanning-tree portfast, as shown in Example 3-2), because the IP phones
    boot quickly and request an assigned address before a typical port with spanning-tree
    enabled go active. Also, keep in mind that port Fa0/1 does not appear in the Example
    3-2 output because it is configured as a trunk port (ports 2–24 are not considered
    trunks by Cisco IOS).


    The ports are now configured to support a newer VLAN of 10 and a data VLAN of
    50. This syntax is a new configuration for IP Phone connections. In the "old days,"
    you would configure the interface as a trunk port because the switch was establishing
    a trunking relationship between it and the IP Phone. This was less secure because
    a hacker could remove the IP phone from the switch and attach their own device
    (another managed'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'switch or PC and perform a VLAN-hopping attack. The more modern syntax configures
    the port as a "quasi-access port," because an attached PC will be able to access
    only VLAN 50. Only an attached Cisco IP Phone will be able to access the voice
    VLAN 10.


    **Note:** Keep in mind that Cisco IP phones will be able to receive this voice
    VLAN configuration from the switch via CDP. After it receives the voice VLAN number,
    the IP Phone begins tagging its own packets. Non-Cisco IP Phones cannot understand
    CDP packets. This typically requires you to manually configure each of the non-Cisco
    IP Phones with its voice VLAN number from a local phone configuration window (on
    the phone).


    # Understanding the Cisco IP Phone Boot Process


    Now that you learned about the VLAN architecture used with Cisco IP Phones, we
    can turn your attention to the IP Phones themselves. By understanding the IP Phone
    boot process, you can more fully understand how the Cisco IP Phone operates (which
    aids significantly in troubleshooting Cisco IP Phone issues). The Cisco IP Phone
    boot process, can start to finish:


    +   1. The Cisco IP Phone connects to an Ethernet switchport. If the IP phone
    and switch support PoE, the IP phone receives power through either Cisco-proprietary
    PoE or 802.3af PoE.

    2. As the Cisco IP Phone powers on, the Cisco switch delivers voice VLAN information
    to the IP phone using CDP as a delivery mechanism. The Cisco IP Phone now knows
    what VLAN it should use.

    3. The Cisco IP Phone sends a DHCP request asking for an IP address on its voice
    VLAN.

    4. The DHCP server responds with an IP address offer. When the Cisco IP Phone
    accepts the offer, it receives all the DHCP options that go with the DHCP request.
    DHCP options include items such as default gateway, DNS server information, main
    name information, and so on. In the case of Cisco Phones, a unique DHCP option
    is included, known as Option 150. This option directs the IP phone to a TFTP server.
    (You learn more about this in the upcoming section, "Configuring a Router-Based
    DHCP Server.")

    5. After the Cisco IP Phone has the IP address of the TFTP server, it contacts
    the TFTP server and downloads its configuration file. Included in the configuration
    file is a list of valid call processing agents (such as Cisco Unified Communications
    Manager or Cisco Unified Communications Manager CME agents).

    6. The Cisco IP Phone attempts to contact the first call processing server (the
    primary server) listed in its configuration file to register. If it fails, the
    IP phone moves to the next server in the configuration file. This process continues
    until the IP phone registers successfully or the list of call processing agents
    is exhausted.


    # Configuring a Router-Based DHCP Server


    We currently made to Step 4 in the preceding IP phone boot process. The phones
    in our network now need to receive IP address and TFTP server information. In
    the network design scenario used in this chapter, we use the WAN branch router
    as the DHCP server.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Using a router as a DHCP server is a somewhat common practice in smaller networks.
    Once you move into larger organizations, DHCP services are typically centralized
    onto server platforms. Either DHCP option is capable of sending TFTP server information
    to the IP phones.


    Example 3-3 shows the syntax used to configure a WAN branch router as a DHCP server.


    # Example 3-3 Configuring Router-Based DHCP Services


    ```

    WAN_RTR#configure terminal

    WAN_RTR(config)#ip dhcp excluded-address 172.16.1.1 172.16.1.9

    WAN_RTR(config)#ip dhcp excluded-address 172.16.2.1 172.16.2.9

    WAN_RTR(config)#ip dhcp pool DATA_SCOPE

    WAN_RTR(dhcp-config)#network 172.16.2.0 255.255.255.0

    WAN_RTR(dhcp-config)#default-router 172.16.2.1

    WAN_RTR(dhcp-config)#dns-server 4.2.2.2

    WAN_RTR(dhcp-config)#exit

    WAN_RTR(config)#ip dhcp pool VOICE_SCOPE

    WAN_RTR(dhcp-config)#network 172.16.1.0 255.255.255.0

    WAN_RTR(dhcp-config)#default-router 172.16.1.1

    WAN_RTR(dhcp-config)#option 150 ip 172.16.1.1

    WAN_RTR(dhcp-config)#dns-server 4.2.2.2

    ```


    > Note: This example uses a Cisco router as a DHCP server. 1 (Jeremy) took this
    approach because using a router as a DHCP server is simple and stable. That being
    said, most people use a Windows server or other centralized device for DHCP services.
    Even Cisco Unified Communications Manager includes DHCP server capabilities. In
    these cases, you typically need to configure an ip helper-address <central DHCP
    server ip address> to forward DHCP requests to the central DHCP server for the
    voice VLAN devices.


    The way in which Cisco routers approaches DHCP configurations is differently from
    how many other DHCP servers do. Most DHCP servers allow you to specify a range
    of IP addresses that you would like to hand out to clients. Cisco routers take
    the opposite approach: using the ip dhcp excluded-address syntax from global configuration
    mode. Configuring the excluded addresses before you configure the DHCP pools ensures
    the Cisco router does not accidentally hand out IP addresses before you have a
    chance to exclude them from the range. The DHCP service on the router will begin
    handing out IP addresses from the first nonzero IP address in the network range.
    In Example 3-3, this is 172.16.1.10 for the voice scope and 172.16.2.10 for the
    data scope.


    > Tip: Notice a DNS server of 4.2.2.2 is assigned to both the data and voice devices.
    This is a well-known, open DNS server on the Internet. This IP address works fantastically
    to test connectivity and DNS services in new network deployments because it is
    such a simple IP address to remember.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Also notice the VOICE SCOPE DHCP pool includes the option 150 syntax. This
    creates the custom TFTP server to be handed out to the Cisco Phones along with
    their IP address information. In this case, the TFTP server of the IP phones is
    the same as the default gateway we use the CME router as a call processing agent.
    As mentioned in the section, "Understanding the Cisco IP Boot Process," the TFTP
    server holds the configuration files for the phones. When you configure a Cisco
    Phone in Cisco Unified Communications Manager (CUCM) or CME, an XML configuration
    file is generated and stored on a TFTP server. These CML configuration files have
    a format of SEP-IP Phone Address.cnf.xml and contain a base configuration for
    the IP phone (specifying layout settings, URLs, and so on). Most importantly,
    these XML files contain a list of up to three CUCM server or CME addresses the
    Cisco Phone uses for registration. After the IP phone receives the XML file, it
    attempts to register with the first CUCM or CME server listed in the file. If
    it is unable to reach that server, it moves down to the next until it is exhausted
    (which point the IP phone reboots and tries all again).


    Note: If the IP Phone has not yet been configured in CUCM or CME (no SEP-MAC.cnf.xml
    exists on the TFTP server), the IP Phone requests a file named XMLDefault.cnf.xml.
    This is a base configuration typically used for a feature called Auto-Registration
    (allowing phones to register without being configured).


    Tip: Many people often wonder the meaning of SEP at the beginning of the configuration
    filename. SEP stands for Siemens Ethernet Phone, Selius was the name of the company
    Cisco acquired when they first began manufacturing VoIP technology.


    # Setting the Clock of a Cisco Device with NTP


    The final task to prepare the network infrastructure to support a VoIP network
    is to set the time. Having an accurate time on Cisco devices is important for
    many reasons. Here is a quick list of some of the reasons why you want an accurate
    clock on your network devices:


    +   - It allows Cisco IP Phones to display the date and time to your users.

    - It assigns the correct date and time to voicemail tags.

    - It gives accurate times on Call Detail Records (CDR), which are used to track
    calls on the network.

    - It plays an integral part in multiple security features on all Cisco devices.

    - It tags logged messages on routers and switches with accurate time information.


    When Cisco devices boot, many of them default date and time to on March 1, 1993.
    You have two options in setting the clock: manually, using the clock set command
    from the privileged EXEC command, or automatically, using the Network Time Protocol
    (NTP).

    Devices setting the clock using NTP have a more accurate clock than a manually
    set clock. Likewise, all the NTP devices on your network will have the exact'
  merge: -1
  img_proc: true
- pgno: 93
  md: "# 64 CCNA Voice 640-461 Official Cert Guide\n\ntime. These advantages make\
    \ NTP the preferred clock-setting method. The accuracy of the clock on your device\
    \ depends on the stratum number of the NTP server. A stratum 1 time server is\
    \ one that has a radio or atomic clock directly attached. The device that receives\
    \ its time from this server via NTP is considered a stratum 2 device. The device\
    \ that receives its time from this stratum 2 device via NTP is considered a stratum\
