    **Figure 11-7** Subscribing the Phone to the EM Service


    # Describe Telephony Features in CUCM


    CUCM supports a wide range of telephony features. This section reviews some of
    the widely used features, including several Call Coverage Options, Intercom, and
    Presence.


    # Call Coverage


    Call Coverage is a general term that references several features and mechanisms
    used to ensure calls are answered under almost any unforeseen circumstances. CUCM
    supports the following Call Coverage features:


    +   - Call Forward

    - Shared Lines

    - Call Pickup

    - Call Hunting'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Call Forward


    There are several Call Forward options configurable in CUCM:


    +   - Call Forward All (CFA): CFA calls all calls to be forwarded to the destination
    number specified by the user or administrator, either at the phone itself or on
    the CUCM user or administrative web pages, without ringing the original dialed
    number. When CFA is enabled, the Call Forward Search Space is used and line/device
    search spaces are ignored. For this reason, the Call Forward Search Spaces should
    be configured to avoid call failures in a system that uses Custom Partitions and
    Search Spaces.


    Note: The Voice Mail checkbox is selected, CUCM ignores the destination in the
    forward setting and Calling Search Space fields and forwards the call to the Voice
    Mail Pilot number specified in the configured Voice Mail Profile.


    # Shared Lines


    If two (or more) IP Phones have the same DN configured on one of their lines,
    calling the DN causes both phones to ring. The first phone to be picked up takes
    the call; the second phone cannot pick up the call without invoking the Barge
    feature (if configured). If the first phone places the call on hold, the second
    phone can pick up the held call.


    # Barge and Privacy


    If two phones have a shared line configured and one of the phones is using that
    line, the second phone can force a three-way conference with the first phone using
    the Barge feature. The conference is hosted on the first phone''s built-in conference
    bridge. (For IP Phone models not supporting a built-in bridge, an external conference
    bridge can be configured.) When the second phone barges on the call, all parties
    hear a beep (by default). If the barge fails (typically a lack of conference resources),
    the barging phone displays an error message.


    A Privacy softkey can be configured that, when enabled, prevents barging into
    a call in progress. Both the Barge and Privacy capabilities can be enabled and
    disabled both cluster-wide and at the individual phone configuration pages.


    # Call Pickup


    A DN can be a member of a Call Pickup Group, which is simply a numbered assignment.
    Three types of Call Pickup can be configured using these Pickup Group assignments:


    +   - Call Pickup: If multiple DNs have the same group number and one of them
    is ringing, another phone with a DN in the same pickup group can invoke the Call
    Pickup softkey and the call is immediately extended to that phone instead.


    +   - Group Call Pickup: If two DNs have different Call Pickup Groups and one
    of them is ringing, the other phone can invoke the GPicup (Group Call Pickup)
    softkey, dial the group number of the ringing DN, and the call is immediately
    extended to that phone instead. A variant of this feature called Directed Call
    Pickup allows a user to enter a specific DN that is ringing to pick up that specific
    call, rather than the first call that started ringing in the group.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   **Other Group Pickup:** Introduced in CUCM v.7, Other Group Pickup allows
    the administrator to set up group associations between Call Pickup Groups. This
    allows a phone to pick up a call ringing in a different associated group without
    entering the other group''s number. The OGroup softly enables this feature.


    For all Call Pickup implementations, the administrator can configure audio/visual/both
    notifications on group members to indicate that a phone in one of their pickup
    groups is ringing. This is particularly useful if the phones are not within earshot
    of each other.


    # Call Hunting


    A more advanced call coverage system can be built in CUCM using a Call Hunting
    Structure allows a single dialed DN (or PSTN number) to distribute calls to several
    phones in sequence. This is typically set up for helpdesk or customer-service
    groups that are not very large; large implementations would be better served by
    a dedicated center application. Call Hunting consists of the following components
    and configurations:


    +   **DNs and voicemail ports:** The ultimate targets of the Call Hunting system.
    These are assigned to Line Groups.


    +   **Line groups:** Assigned to Hunt Lists; one or more can be assigned to a
    single Hunt List. The line group configuration provides for different hunt algorithms
    (specifically, Top-Down, Circular, Longest Idle, and Broadcast) and other hunt
    options.


    +   **Hunt Lists:** A Hunt List is a top-down ordered list of line groups. Calls
    flowing through the Call Hunting system are sent to the first line group in the
    Hunt List. If no member of that line group can answer the call, it may be returned
    to the Hunt List, which then tries the second line group. This process may repeat
    until the call is answered, the list of line groups is exhausted, or the caller
    hangs up.


    +   **Hunt Pilots:** A Hunt Pilot is associated with a Hunt List. The Hunt Pilot
    may be a unique DN, a shared line, or a PSTN number.


    During the hunting process, the Call Forwarding configuration of group members
    is ignored; for example, if the DN is busy, the next DN in the line group would
    be chosen rather than the CFB setting for that DN.


    # Call Park


    Call Park allows us to temporarily attach a call to a Call Park slot (effectively
    a DN). Any user can pick up the call by dialing the Call Park number. For example:
    If Mark is on the phone with a customer, and the customer asks about theBailer
    9000 series product, Mark can say, “That''s LuAnn''s product line. Let me find
    LuAnn for you.” Mark presses the Call Park softkey, and CUCM displays a message
    on the phone indicating the Call Park slot it parked the call. Mark then has to
    contact LuAnn (perhaps by paging system or just yelling across the showroom),
    tell her the Call Park number, and LuAnn simply dials that number to pick up the
    call.


    A variation of this feature, called Direct Call Park, requires LuAnn to enter
    a prefix code (effectively a asterisk) to retrieve the call.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Intercom


    The Intercom feature allows a button to be configured that calls an intercom line
    on an-other phone. The recipient phone auto-answers in speakerphone mode, with
    the microphone muted. A one-way audio stream now exists from the caller to the
    recipient; the recipient can hear the caller, but the caller cannot hear the recipient.
    This is known as Whisper Intercom..


    When the recipient presses the Intercom button, a second one-way audio stream
    is established back to the caller and they can hear each other. For both these
    intercom calls, an auto-answer tone is heard when the recipient phone answers
    the call.


    If the recipient is in a call when the Whisper Intercom is made, the recipient
    hears the one-way audio from the intercom caller, but the other party does not
    see.


    Intercom lines are different from normal DNs. Intercom lines cannot call DNs,
    and DNs cannot call intercom lines. Intercom lines have their own dial plan and
    permissions (Inter-Partitions and CSS). An Intercom button can be a speed dial
    (with one preconfigured target intercom line), or you can configure an intercom
    button that requires the user to dial the target intercom line.


    # CUCM Native Presence


    Presence can be defined as "signaling one''s capability and willingness to communicate."
    Presence indications can include Instant Messaging status indicators, such as
    Online, Offline, Busy to Lunch, in a Call, and in a telephone system, Simply On
    Hook or Off Hook. CUCM supports a built-in capacity to track the on or off hook
    status of a DN.


    Presence status can be monitored using either a Busy Lamp Field (BLF) speed dial
    or Presence-enabled call and directory lists. A BLF Speed Dial is a speed dial
    that lights up when the target of the speed dial is off hook. Presence-Enabled
    Call Lists display an indicator that identifies the entry in the list is one of
    the following:


    +   - Unknown: The entry is not being watched, or the device displaying the list
    does not have permission to watch the target''s presence status. The icon displayed
    is a blank phone keypad.


    +   - On Hook: The entry is on hook. The icon displayed is a telephone over a
    blank keypad.


    +   - Off Hook: The entry is off hook. The icon displayed is two handsets over
    a blank keypad.


    Figure 11-8 shows an IP Phone displaying a Presence-Enabled Call List with each
    of the three icons showing the current status of the targets of recently placed
    calls. In the figure, 8512001 and 3001 display Unregistered status, 2002 is Off
    Hook, and 2001 is On Hook.


    # Presence Architecture


    In some cases, it may not be desirable to have every phone watch every DN in the
    system. Presence visibility can be controlled in the following ways:


    +   - BLF Speed Dials can be configured only by an administrator; users cannot
    create or edit their own.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_333_0.png)


    Figure 11-8 Presence Indications


    +   - Visibility for Partitions and subscribe Calling Search Spaces. A Subscribe
    CSS is specific to a Presence monitoring system: If the DN is to be watched in
    the watcher''s CSS, presence indications are visible: If it is not, the DNs appear
    as Unregistered status to the watcher.


    +   - Presence Groups allow different sets of watchers to be assigned (or denied)
    permission to watch the Presence status of DNs in other Presence Groups. Phones,
    DNs, and users can be assigned to Presence Groups. All users in the standard Presence
    Group by default, but can be assigned to custom Presence Groups as desired. The
    enterprise permission configuration page Inter-Presence Group Subscription policy
    defines the default setting for whether Presence Groups have permission to watch
    each other Presence status or not; this setting may be overridden in the Presence
    Group settings. Members of a Presence Group are always able to watch other members
    of the same group, unless the Subscribe CSS prevents the subscription. The Subscribe
    CSS and Presence Group settings be used independently of one another or together.
    If both are used, both must allow a subscription in order for a watcher to monitor
    the Presence status of a DN.


    +   - Inter-Presence Group settings apply only to BLF Call Lists and Directories
    and do not affect BLF Speed Deals.


    # Enable Telephony Features in CUCM


    The following sections detail the necessary steps to configure the telephony features
    outlined earlier, including Call Coverage, Intercom, and Presence.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Enabling Call Coverage


    This section describes the configuration steps to enable the following Call Coverage
    features:


    +   - Shared Lines

    - Barge and CBarge

    - Call Pickup

    - Call Park and Directed Call Park

    - Call Hunting


    # Configuring Shared Lines


    When two or more devices are configured with the same DN, it is called a shared
    line. The configuration is straightforward: Simply add the DN to multiple phones,
    either from the DN Configuration page or the Phone Configuration page via the
    Phone Button configuration. Figure 11-9 shows the DN configuration page, with
    two devices associated with the same DN.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_334_0.png)


    Figure 11-9 DN Configuration for Shared Line


    # Configuring Barge


    The Barge feature (as described earlier) allows a user with a shared line to force
    a three-way conference with another user of that shared line. To enable the feature,
    the built-in'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'conference bridge (available on most IP Phone models) must be activated. The
    privacy feature removes the call information from all phones that share lines
    and blocks other shared lines from barging in its calls. The following steps describe
    how to configure Barge


    +   1. In CM Administration, navigate to System > Service Parameters. Select the
    server you want to configure from the Server drop-down.

    2. Select the Cisco CallManager service from the Service drop-down.

    3. Scroll down to the Clusterwise Parameters (Device-Phone) section. Built-in
    Bridge Enable On.

    4. Set the Privacy Setting to True (the default).


    **Note:** The Built-in Bridge, Privacy, Privacy, and Single Button settings can
    be overridden at the Device Pool or the individual phone if desired.


    +   5. Scroll down to Clusterwise Parameters (Feature-Join Across Lines And Single
    Barge Feature Set) and set the Single Barge/CBarge Policy. Your choices are Off,
    Barge, CBarge. This setting allows pressing the shared line button to cause a
    Barge onto the shared line when it is in use (instead of using the softkey). Setting
    the value to Barge uses the built-in bridge on the target phone, while setting
    it to CBarge forces the Barge operation to use an external conference resource.
    Figure 11-10 shows the Clusterwise Parameters where Barge is configured.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_335_0.png)'
  merge: -1
  img_proc: true
- pgno: 336
  md: '**Note:** Using the Barge softkey method requires that you configure the softkey
    template to include the Barge softkey for the phones involved in the Barge operation.
    Using the Single Button Barge method does not.

    CBarge is required, an external conference resource must be configured and made
    available to the phones.


    # Configuring Call Pickup


    To configure Call Pickup, you must create and apply Call Pickup Groups to DNs
    that must pick up each other''s calls. Follow these steps:


    +   1. In CM Administration, navigate to Call Routing > Call Pickup Groups.

    2. Click Add New.

    3. Enter a name and a unique number. (The number cannot contain wildcards).

    4. Select a Partition (normally the same as the DN Partition; however, selecting
    a different Partition allows the administrator to restrict access to the pickup
    group by modifying the CSS of the phones if desired).


    It is possible to preconfigure associated Call Pickup Groups so that the Other
    Group Pickup feature (described earlier) can be used if desired; this option is
    only available during the initial configuration of the Pickup Group. Figure 11-11
    shows the Call Pickup Group configuration page.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_336_0.png)


    **Figure 11-11** Call Pickup Group Configuration'
  merge: -1
  img_proc: true
