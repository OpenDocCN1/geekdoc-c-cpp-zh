- pgno: 306
  md: '# Centralized Deployment PSTN Backoff Flow


    In the event IP WAN fails, all phones in the branch lose connectivity to the CUCM
    at the main location and no longer function. In this event, Survivable Remote
    Telephony (SRST) is recommended to provide registration and call control signaling
    local to the branch phones. SRST provides on-net-to-IP calling between branch
    phones, but if calls from branch phones to other locations are reachable (whether
    on-net or off-net), they will fail. This is because of a lack of call-routing
    configuration on the branch gateway router. Typically, the branch gateway is configured
    with a subset of CUCM capabilities to provide public switched telephone network
    (PSTN) access to branch phones. If the SRST router dial-plan is configured properly,
    the branch users can still dial the same network for calls to other locations,
    and the SRST router transparently modifies the dialed digits for PSTN routing.
    Most users will not be aware of the WAN failure.


    From the main location CUCM perspective, the branch phones have de-registered
    and are considered unreachable. This is not entirely accurate because they are
    reachable via the PSTN) and is an undesirable failure of the system. To provide
    continuity of service, call routing options and settings are configured on the
    CUCM that provide an alternate path to the branch via the PSTN:


    +   1. The call-routing table has a second option added to provide a PSTN gateway
    and appropriate digit manipulation to require the PSTN dialed digits.

    2. The Call Forward Unregistered (CFUR) is configured on each branch phone to
    specify the full PSTN number to reach the branch phone.


    These two configurations, in combination with the appropriate SRST configuration,
    ensure that branch phones can reach and be reached by the main location in the
    event of WAN failure.


    When the WAN recovers, the branch phones de-register from the SRST router, re-register
    with CUCM, and the normal WAN-based signaling and calling patterns return.


    # Centralized Deployment Considerations and Limitations


    Deploying CUCM in a centralized call-processing environment is one of the most
    popular choices, providing full features and capabilities to branch offices while
    consolidating equipment and management efforts at the headquarters. The following
    points should be considered during the design and planning of a Centralized deployment:


    +   - CUCM supports a maximum of 1000 locations and a maximum of 1100 H.323 or
    Media Gateway Protocol (MGCP) devices per cluster.


    Although there is no limit to the number of phones at a branch, the number of
    phones supported by the SRST router will be limited based on the router hardware
    and the configuration applied to it. The maximum number of phones supported in
    SRST mode is 1500 by a 394E branch router. The correct configuration to allocate
    resources to ensure that many phones must be applied, and the approximate amount
    of RAM must be installed.


    +   - The WAN must be properly provisioned and QoS to allocate the priority queue
    bandwidth appropriate to the number of concurrent calls, and to limit delay for
    both RTP voice and signaling traffic.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_306_0.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Call Admission Control (CAC), as explained in the next section, should be implemented,
    either CUCM location-based or Resource Reservation Protocol (RSVP)-based. Regardless
    of the CAC method used, the goal is to prevent more calls than the design specifies
    from being extended across the WAN, protecting call quality for all IP calls.


    # PSTN Backup Using CAC


    CAC prevents IP calls from being extended across a WAN link, if the additional
    WAN bandwidth required would exceed the Quality of Service (QoS)-allocated bandwidth
    for concurrent calls. For example, if the design specifies a maximum of ten calls
    G.729, the QoS configuration would create a Priority Queue (LLQ) to serve those
    ten calls.(The QoS configurations are beyond the scope of the CCNA Voice exam.)
    If an 11th call were extended to the gateway, the additional bandwidth would overrun
    the input buffer for the LLQ, and packets from all 11 calls would start to drop,
    causing unacceptable packet loss and resultant deterioration of voice quality
    for all 11 calls.


    With location-based CAC implemented, CUCM tracks how many calls are extended to
    a given location, subtracting the bandwidth used for each concurrent call from
    the bandwidth specified for that location. When the remaining bandwidth is less
    than the amount used by a single call (which varies by the codec used for the
    call, which is in turn defined by the Region setting), the default behavior of
    CAC is to drop the call. Users get re-order tone or an annunciator message indicating
    that the call has failed.


    In most cases, calling drop is not desirable, and Automated Alternate Routing
    (AAR) is implemented to reroute the call across the PSTN. AAR is exclusively triggered
    by CAC; when CAC prevents the call from extending across the WAN, CUCM checks
    to see if an AAR Group is configured for the calling phone. If an AAR Group is
    configured, specifies what digit manipulation is required to retry the call with
    a full PSTN Dialed Number Information Service (DNIS). The operation is transparent
    to the user (although it is possible he notice a difference in call quality using
    the PSTN instead of the WAN).


    If the call is extended over the PSTN, the call-signaling path includes the PSTN
    gateways at the main and branch locations, and the RTP voice streams are converted
    to the appropriate transport protocol.


    > Note: Be clear about the difference between PSTN rerouting over WAN failure
    CAC and AAR being triggered by a lack of available WAN bandwidth for calls. If
    the WAN fails, calls may be rerouted to the PSTN using the hierarchical design
    of the dial plan and CFUR on the CUCM side, and SRST on the branch side. If the
    WAN has no available bandwidth, CAC triggers AAR, which will redraw the call with
    a full PSTN number, but only if it is correctly configured to do so. Figure 10-6
    summarizes the sequence of events


    # Distributed Deployment Call Flow


    In a distributed deployment, one CUCM cluster signals another CUCM cluster across
    a WAN. The signaling flows from the calling phone to the local CUCM, then from
    the CUCM across the WAN to the remote CUCM, then from the remote CUCM to'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'remote (called) phone. The RTP voice streams extend from each phone across
    the WAN to the other phone. Figure 10-7 illustrates call flow in a distributed
    deployment.


    # Route Pattern


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_308_0.png)


    Figure 10-6 WAN Failure to SRST/CFUR


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_308_1.png)


    Figure 10-7 Distributed Deployment Call Flow CUCM Call-Routing Components


    The signaling protocols available include Inter-Cluster Trunk (ICT), H.323, and
    Session Initiation Protocol (SIP). CUCM clusters at each site control their local
    phones using Skinny Client Control Protocol (SCCP) or SIP. The use of gatekeepers
    (along with a well-designed dial-plan) may allow scalability to thousands of sites,
    with either a full CUCM for large sites or a CUME for smaller sites (third-party
    solutions may also be integrated). PSTN backup for WAN failure is achieved through
    a hierarchical dial-plan, and gatekeeper may be used when bandwidth for calls
    is not available.


    **Note:** Location-based CAC does not work in a distributed deployment because
    the clusters do not communicate their current bandwidth utilization to other clusters.
    Instead, Gatekeeper CAC provides a centralized service to track available bandwidth
    between clusters and trigger AAR when necessary. Gatekeeper is a router IOS feature
    set that may be configured on one or more gateway routers in the system.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The building blocks of the CUCM dial-plan are simple and consistent. The potential
    for complexity increases when multiple hierarchical paths are implemented, with
    different features and capabilities enabled. This section identifies the core
    elements and explains their interactions.


    # Call-Routing Sources in CUCM


    A call-routing request (including but not limited to a simple phone call) can
    originate from any of the following:


    +   * IP phone: Places a routing request using one of its configured lines. This
    may be a manually dialed number, a speed dial, feature button, or softkey.

    * Trunk: Signals inbound calls from another CUCM cluster, CUEME, or other call
    agent.

    * Gateway: Signals inbound calls from the PSTN or another call agent, such as
    a prime branch exchange (PBX).

    * Translation pattern: Matches the original called digits and immediately transforms
    them to a new dialed digit. The new string is resubmitted to digit analysis for
    routing.

    * Voicemail port: Can be the source of a call-routing request if the application
    attempts a call, transfer or message notification on behalf of a user''s mailbox.


    A call-routing request is simply one of the previous entries signaling CUCM with
    a string of dialed digits. These digits can be manually dialed by a user on their
    phone, automatically by an application such as Cisco Unified Connection, or by
    another system via a trunk or gateway.


    # Call-Routing Destinations in CUCM


    Following are possible call-routing destinations in CUCM:


    +   * Directory Number (DN): Each button on an IP phone can be assigned a uniqueonet
    extension.

    * Translation Pattern: Matches a string of dialed digits and transforms them to
    a new dialed string, which is in turn resubmitted to digit analysis and routed
    to a different target.

    * Route Pattern: Matches a string of dialed digits and triggers a call-routing
    process that can include one or more potential paths, providing a hierarchical
    set of call-routing options.

    * Hunt Pilot: A specific pattern of digits that, when matched, triggers a customizable
    call-coverage system.

    * Call Park Number: A pattern or range of patterns that CUCM can use to temporarily
    hold a call until a user dials the call number to pick it up from any IP phone.

    * Meet-Me Number: The conference initiator dials into the Meet-Me number to begin
    the conference, and one or more users dial into the same number to join the conference.'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'The previous destinations are represented by strings of dialable digits. The
    dial-plan must allocate ranges of numbers for all these targets, and CUCM must
    be configured to route to them appropriately (including not routing to them, if
    necessary).


    # Call-Routing Configuration Elements


    The primary components of the CUCM call-routing system are the following:


    +   - Route Patterns

    - Route Lists

    - Route Groups

    - Gateways/Trunks


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_310_0.png)


    # Route Pattern


    A Route Pattern matches a string of dialed digits. The pattern may be specific,
    matching a single dial number, or it may be general, matching hundreds of thousands
    of possible numbers. This variable precision is configured using wildcard digits
    in the pattern. Route Patterns allow the administrator to specify the target of
    any given string of dialed digits.


    Route Patterns are necessary to provide PSTN dial access. They may also be used
    to integrate the CUCM dial-plan with an existing PBX dial-plan; in this instance,
    the Route Pattern would match all DNS (extensions) controlled by the PBX. In fact,
    a Route Pattern may be customized to use all users to dial and reach any desired
    end.


    Route Patterns are associated with either a Route List or a Specific Gateway.


    > Note: If a Route Pattern is directly associated with a gateway (as opposed to
    a Route List), the selected Gateway can no longer be referenced by a Route Group;
    the gateway is "locked in" to the Route Pattern. In small deployments, this may
    not be problematic, but in large deployments, doing so limits the flexibility
    of the system.


    # Route List


    A Route List is an ordered list of Route Groups. The first entry in the list is
    the preferred call-routing path; if that path is unavailable (due to failure or
    no circuit/channel available), if a second choice is configured, it will be used
    instead. There may be several choices in the list; each new uses the choices in
    top-down order.


    The hierarchical order of the Route List allows the administrator to provide depth
    of coverage for calls while controlling which resources are used for each call.
    For example, if the Route Pattern matches a national-distance number is associated
    with a Route List that lists its first choice as a Route Group providing access
    to an inexpensive Inter-Exchange Carrier (IXC) PRI circuit, the call is routed
    to IXC circuit. Subsequent calls matching the same Route Pattern are also routed
    to the IXC circuit until no channels are available.


    At that point, the routing request to the IXC is rejected and the Route List''s
    second choice is tried. If the second choice is a Local Exchange Carrier (LEC)
    PSTN PRI circuit, the call'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'is dialed over the LEC PSTN link, as long as a channel is available. This call
    costs more using the IXC circuit, but it works—the call does not fail, and business
    continuity is maintained.


    In this example, the cost is the design driver: The IXC is less expensive than
    the LEC circuit, so the IXC is the desired target for all long-distance calls.
    However, if the IXC is busy (or has failed), it is acceptable that long-distance
    calls be placed out the LEC circuit so that service is not interrupted.


    # Route Group


    A Route Group is a list of devices (gateways or trunks) that are configured to
    support circuits to the PSTN or to remote CUCM clusters in distributed designs.
    Route Groups are commonly configured to contain devices with common signing characteristics
    (for example, a set of PSTN PRI gateways in one group and a set of WAN IPs to
    a remote cluster in another).


    The distribution algorithm of a Route Group is configurable; selecting Top-Down
    causes the devices in the group to be used in top-down order for each new call,
    while selecting Circular uses the devices in round-robin order. The specific context
    and requirements of the system determines which algorithm is appropriate.


    > **Note:** The Local Route Group feature allows the administrator to define a
    Route Group in the Route Pool, and reference that local Route in the Route List.
    Doing effectively decouples the location of a PSTN gateway from the Route Patterns
    that target that gateway. This feature greatly reduces the complexity of dial-plan
    design in systems with many locations.


    # Gateways and Trunks


    Gateways and trunks are the devices that physically terminate and support circuits
    to the PSTN, to digital or analog PBXs, and to IP WAN circuits to remote clusters
    or IP-TSP circuits to service providers.


    CUCM supports various gateway devices and interfaces, controlling them with either
    peer-to-peer gateway protocols (H.323 and SIP) or gateway control protocols (MGCP
    and SCCP).


    10-8 shows the calling-routing elements described previously.


    | Route Pattern | Route Group | Gateway |

    | --- | --- | --- |

    | 9.1 [2–9]XX[2–9]XXXXXX | IXC_RG | IXC |

    | Route List LD_PSTN_RL 1st 2nd | LEG_RG | LEC |


    **Figure 10-8** Calling-Routing Elements


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_311_0.png)'
  merge: -1
  img_proc: true
- pgno: 312
  md: '**Key Point:** The configuration order of the call routing elements is: Devices,
    Route Groups, Route Lists, Route Patterns. The call flow is the reverse: The dialed
    digits match a Route Pattern, which points to a Route List, which points to a
    Route Group, which refers Devices.


    # Call-Routing Behavior


    Digit analysis is the process by which CUCM matches dialed digits to possible
    targets for call routing. Different protocols and devices perform digit analysis
    in different ways: Dialed digits-by-digit by SCCP and SIP phones that use Keypad
    Markup Language (KPML), and en-bloc (all at once a set of digits) on basic SIP
    phones, trunks, and most gateways.


    # Digit Analysis


    The digit analysis logic that CUCM uses to select the target for the call-routing
    request is based on the closest match. Consider the following set of Route Patterns:


    +   - 1111

    - 1211

    - 1[23]XX

    - 131

    - 13[0-4]X

    - 13!


    With these Route Patterns in mind (these are not intended to be realistic; they
    just illustrate the pattern-matching logic), let''s look at three examples of
    how CUCM will process different dialed strings:


    Example 1 If User A dials 1111, there is an exact match with the pattern “1111.”
    No other patterns match, and the call is extended to that target.


    Example 2 If User B dials 1211, CUCM has two possible matches:


    +   - 1211: Matches 1 digit string.

    - 1[23]XX: Matches 200 digit strings.

    CUCM selects the closest match target (the one that matches the fewest possible
    strings) (in this case, 1211).


    Example 3 If User C dials 131, CUCM has four possible matches:


    +   - 1[23]XX: Matches 200 digit strings.

    - 131: Matches 1 digit string.

    - 13[0-4]X: Matches 50 digit strings.

    - 13!: Matches almost 10,000 quintillion digit strings. (For our purposes, that
    is practically an unlimited number.)


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_312_0.png)'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The pattern 13 matches exactly, but other patterns match, too: other patterns
    are longer, so CUCM has to wait to see if User C dials another digit. If she does,
    13 no longer matches and is discarded as a possible target. The wait time is set
    by the T.302 InterDigit Timeout value, which defaults to 15 seconds. If User C
    dials a fourth digit, the T.302 timer starts again, because there is still a longer
    pattern that might match (“13”). If User C stops dialing after 4 digits, after
    15 seconds (the T.302 timer call), the call is extended to the target of the “13-04X”
    pattern. If she dials another digit within the User digit count, the “13-04X”
    pattern is discarded because it no longer matches. When User C finishes dialing,
    the T.302 timer must exhaust before the call is routed.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_313_0.png)


    **Key Concept:** Digit-by-digit analysis means CUCM collects digits one at a time
    they are dialed. As digits are collected, patterns that no longer match the string
    are discarded as possible routing targets.


    The Closest Match will choose a pattern target according to the following criteria:


    +   - The pattern matches the dialed string.


    +   - Among all the potential matches, it matches the fewest strings other than
    the actual dialed string.


    # Hunt Groups


    A Hunt Group is a set of IP phones (technically, Directory Numbers [DN] on the
    phones) that are able to be reached by calling a common number. The classic example
    is the Helpdesk; users dial 7777, and all the DNs of the helpdesk staff ring in
    sequence until one of them picks up the call.


    The components of a Hunt Group are


    +   - Hunt Lists:** Contain the DNs that can ring sequentially. The Line groups
    allow the selection of the call-distribution algorithm: Top-Down, Circular, Longest
    Idle, or Broadcast. The settings allow control when, or if to, to proceed to the
    next Line Group in the Hunt List.


    +   - Hunt Lists: Contain a top-down ordered list of Line Groups. Each new call
    is routed to the first Hunt Group in the list; if that group cannot provide call
    coverage, the next Line Group in the Hunt List is tried until the list is exhausted.


    +   - Hunt Pilot: This is a call-routing entry (like a Route Pattern) that matches
    a dialed string and targets a Hunt List (which in turn targets a Line Group).
    Hunt Pilot numbers may be on-net, E.164, or any format as required.


    # Class of Control


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_313_1.png)


    Class of Control is defined as the ability to apply call restrictions to devices.
    Typical examples include the following:


    +   - Preventing certain individuals from placing long-distance calls


    +   - Routing the same number called to different targets at different times of
    day


    +   - Routing the same number called to different targets at different locations'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Class of Control is configured using Partitions and Calling Search Spaces (discussed
    in the following sections).


    # ## Partition


    A Partition is a grouping of things with similar reachability characteristics.
    In general, you can think of a Partition as being assigned to things you can dial,
    such as the following:


    +   - DNs

    - Route Patterns

    - Translation Patterns

    - Voicemail Ports

    - Meet-Me Conference Patterns


    By default, one Partition exists; it is the Null Partition, although it is listed
    in the CUCM web pages as <none>. Up to 75 additional Partitions can be created
    at once.


    # ## Calling Search Space


    A Calling Search Space is a top-down ordered list of Partitions. A Calling Search
    Space can be applied to a device (such as an iPhone or gateway), or to a line
    on the IP phone. One CSS exists by default, and by default, it contains only the
    Null Partition. You can think of a CSS as being assigned to things that can place
    calls.


    # ## Interaction of Partitions and Calling Search Spaces


    The essential thing to understand is: If the target that is being dialed does
    not exist in one of the Partitions in the CSS of the caller, the call will fail.
    This behavior allows us to design specific calling-privilege schemes and apply
    them to different calling devices or lines. Consider the following example: A
    company wants to implement call restriction so that lobby phones cannot place
    long-distance calls. A new Partition is created "PSTN. Local. PTN." The Route
    Patterns that match 7-digit and 10-digit (toll free) PSTN are assigned to the
    PSTN_Local PTN Partition.


    A new CSS is created Lobby CSS. The PSTN_Local PTN Partition is added to the Lobby_CSS.


    The Lobby CSS is applied to the phone configurations. As soon as that change is
    made, the lobby phones will get the ringtone when they try to dial any number
    that does not match the 7- or 10-digit patterns in the Lobby_CSS. Thus, no one
    can abuse the lobby phones and the cost fees by calling long-distance calls.


    A few related points:


    +   - If a user tries to call 911 from the lobby phone, that will fail too, unless
    the emergency call patterns are also added to the PSTN_Local PTN Partition or
    another Partition that is in turn added to the Lobby_CSS. It is generally a good
    idea to ensure that every phone can place emergency calls.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '+   - When a Route Pattern is moved from the default Partition <none>, it is
    no longer accessible to the default CSS. This means calls matching the Route Pattern
    will fail until a new, functional CSS/Partition structure is completed. For this
    reason, it is best to plan and implement Class of Service (CoS) configurations
    before phones are in use to avoid service interruption.


    +   - Every CSS includes the default Partition <none>, at the end of the list
    of custom Partitions. This means that any that is left in the default Partition
    <none> is reachable by every calling device.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_315_0.png)


    # Line-Device Configuration


    So far, we have assumed that the CSS is applied only to the device (that is, the
    IP phone). It is also possible to apply a CSS to the line on the phone; the line
    CSS may be very different and include other Partitions, which in turn contain
    different Route Patterns, and so on.


    If both a Device and a Line CSS are applied, the Partitions in both CSS are concatenated
    in sequential top-down order, with the line CSS Partitions listed first, and the
    device CSS Partitions


    CUCM will analyze the list of Partitions in that order, looking for a match to
    the dialed digits among the patterns in the list. If a match is found, the call
    is routed to the target. If more than one identical match is found, the Partition
    containing the match that is first in the concatenated list will be the target.
    In other words, the Line CSS overrides the Device CSS.


    There are several benefits to using the Line/Device method. In general, best practices
    suggest setting up the Device CSS to allow full calling privilege to all patterns,
    with the call routing appropriate to the device''s location (for example, PSTN
    calls placed out the local gateway). The calling restrictions are then applied
    using the Line CSS, which can contain Route Patterns that match long-distance
    numbers, but are configured to block those calls. The result is that fewer total
    CSS need to be configured, which makes it simpler to manage and scale the dial-plan.'
  merge: -1
  img_proc: true
