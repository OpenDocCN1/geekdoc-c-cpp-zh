    There are many commands to discuss in Example 6-5, with the show controllers t1
    command allows you to identify the T1 interfaces on your router. These interfaces
    do not appear in the show ip brief output, because the router does not know if
    you configure the interface as a voice or data connection. After you identify
    the slot and port of your T1 interface, you can configure the necessary framing
    and linecode commands. These commands let you change how the T1 or E1 interface
    formats the it sends to the service provider. Set these values based on the service
    provider to which you are connecting.


    Note: If you are in the United States, service providers use extended super frame
    (ESF) framing and B8ZS linecoding.


    After setting the framing and linecoding, you can move into the clocking. The
    command clock source line instructs the router to receive its interface clocking
    from the service provider. If you are connecting to a PSTN carrier, this is the
    norm. If your router is connecting to a PBX system inside your company, you can
    enter the command clock source internal, which allows the router to provide clocking
    information to the PBX system.


    Finally, the ds0-group command configures the line as a T1 CAS connection and
    allows you to enter the specific number of time slots you to provision. In Example
    6-5, all 24 time slots are provisioned under DS0 group 1. You can choose any value
    from 0 to 23 for the group number. This acts as an identifier for the time slots
    you place into it. You can provide a single T1 line for many different purposes.
    For example, you could create DS0 group 5 with time slots 1–5 that connect to
    an onsite PBX system. You could create ds0 group 6 using time slots 6–24 that
    connect to the PSTN (provided the PBX system and PSTN carrier are provisioned
    for these time slot settings). Figure 6-3 illustrates the physical design of this
    network type.'
