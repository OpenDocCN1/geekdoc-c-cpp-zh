- pgno: 485
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_485_0.png)


    The first 17 chapters of this book cover the technologies, protocols, design concepts,
    and considerations required to be prepared to pass the 640-461 Exam. Although
    these chapters supply the detailed information, most people need more preparation
    than simply reading the first 17 chapters of this book. This chapter details a
    set of tools and a study plan to help you complete your preparation for the exams.


    This short chapter has two main sections. The first section lists the exam-preparation
    tools useful at this point in the study process. The second section lists a suggested
    study plan now that you completed all the earlier chapters of this book.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# # Final Preparation


    # ## Tools for Final Preparation


    This section lists some information about the available tools and how to access
    the tools.


    Pearson Cert Practice Test Engine and Questions on the CD


    The CD in the back of this book includes the Pearson Cert Practice Test engine—software
    that displays and grades a set of exam-realistic multiple-choice questions. Using
    the Pearson Cert Practice Test engine, you can either study by going through the
    questions in Study mode or take a simulated (timed) CCNA Voice exam.


    The installation process requires two major steps. The CD has a recent copy of
    the Pearson Cert Practice Test engine. The practice exam—the database of CCNA
    Voice exam questions—is not on the CD.


    # Install the Software from the CD


    The software-installation process is routine compared with other software-installation
    processes. To be complete, the following steps outline the installation process:


    +   Step 1. Insert the CD into your PC.


    +   Step 2. The software that automatically runs the Cisco Press software to access
    and use all CD-based features, including the exam engine and the CD-only appendices.
    From the main menu, click the option to Install the Exam Engine.


    +   Step 3. Respond to window prompts as any typical software-installation process.


    The installation process gives you the option to activate your exam with the activation
    code supplied on the paper in the CD sleeve. This process requires that you establish
    a Pearson website login. You need this login to activate the exam, so please register
    when prompted. If you already have a Pearson website login, there is no need to
    re-register, just use your existing login.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# Activate and Download the Practice Exam


    After the exam engine is installed, you should activate the exam associated with
    this book (if you did not do so during the installation process), as follows:


    +   **Step 1.** Start the Pearson Cert Practice Test (PCPT) software from the
    Windows Start menu or from your desktop shortcut icon.


    +   **Step 2.** To activate and download the exam associated with this book, from
    the My Products or Tools tab, select the Activate button.


    +   **Step 3.** At the next screen, enter the Activation Key from inside the cardboard
    CD holder in the back of the book. Once entered, click the Activate button.


    +   **Step 4.** The activation process downloads the practice exam. Click Next,
    and then click Finish.


    After the activation process is completed, the My Products tab should list your
    new exam. If you do not see the exam, make sure you selected the My Products tab
    on the menu. At this point, the software and practice exam are ready to use. Simply
    select the exam and click the Use button.


    To update a particular exam you have already activated and downloaded, simply
    select the Tools tab and the Update Products button. Updating your exams ensures
    that you have the latest changes and updates to the exam data.


    If you want to check for updates to the PCPT exam engine software, simply select
    the Tools tab and select the Update Application button. This ensures that you
    are running the latest version of the software engine.


    # Activating Other Exams


    The exam-installation process, and the registration process, has to happen only
    once. Then, for each new exam, only a few steps are required. For example, if
    you buy another new Cisco Press Official Cert Guide or Pearson IT Certification
    Cert Guide, extract the activation code from the CD sleeve in the back of that
    book—you don''t even need the CD at this point. All you have to do is start the
    exam engine and perform Steps 2 through 4 from the premium list.


    # Premium Edition


    In addition to the free practice exam provided on the CD-ROM, you can purchase
    additional exams with expanded functionality directly from Pearson IT Certification.
    The Premium Edition of this title contains an two full practice exams and an eBook
    (in both PDF and ePub format). In addition, the Premium Edition title also has
    remediation for each question to the specific part of the eBook that relates to
    question.


    Because you purchased the print version of this title, you can purchase the Premium
    Edition at a deep discount. There is a coupon code in the CD sleeve that contains
    a one-time use code and instructions for where you can purchase the Premium Edition.'
  merge: -1
  img_proc: true
- pgno: 488
  md: 'To view the premium edition product page, go to http://www.pearsoncitertification.com/title/9780132748322.


    # Cisco Learning Network


    Cisco provides a wide variety of CCNA Voice preparation tools at a Cisco Systems
    website called the Cisco Learning Network. This site includes a variety of exam-preparation
    tools, including sample questions, forums on each Cisco exam, learning video games,
    and information about each exam.


    To reach the Cisco Learning Network, go to www.cisco.com/go/learnnetpace, or just
    search for "Cisco Learning Network." You need to use the login you created at
    www.cisco.com. if you do not have a login, you can register for free. To register,
    simply go to www.cisco.com, click Register at the top of the page, and supply
    the required information.


    # Chapter-Ending Review Tools


    Chapters 1–17 have several features in the Exam Preparation Tasks at the end of
    the chapter. You might have already worked through these in each chapter. It can
    also be useful to use these tools again as you make your final preparations for
    the exam.


    # Suggested Plan for Final Review/Study


    This section lists a suggested study plan from the point at which you finish reading
    through Chapter 17 until you take the 640-461 ICCOMM Exam. Certainly, you can
    ignore this plan, use it as it is, or just take suggestions from it.


    The plan uses six steps:


    +   **Step 1.** Review key topics and DIKTA questions:


    +   You can use the table that lists the key topics in each chapter or just flip
    the pages looking for key topics. Also, reviewing the Do I Know This Already questions
    from the beginning of the chapter can be helpful for review.


    +   **Step 2.** Use the PCPT engine to practice:


    +   The PCPT engine on the CD can be used to study using a bank of unique exam-realistic
    questions available only with this book.


    +   **Step 3.** Review weak topics:


    +   Working through the practice exam will reveal topics you may want to review
    and study. Take the time to fill in the gaps in your knowledge and attempt the
    practice exam again. However, be careful about taking the practice exam too many
    times because you may gain a false sense of confidence simply because you begin
    to memorize the answers to the practice test. Be sure you truly understand the
    content before attempting the real exam.'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Step 4. Schedule and take the 640-461 ICOMM Exam:


    Put your knowledge to the test in the real certification exam environment! While
    we wish you the best of luck, please keep in mind that Cisco certification exams
    are some of the most difficult in the industry, and there are many factors beyond
    just technical knowledge that weigh on the final exam results.


    # Step 5. Study based on your results:


    When you leave the certification center, you will know the exam results. If you
    passed, congratulations! If not, write down areas or topics you remember struggling
    with the exam. In your studies, focus 90% of your time on these content areas
    and 10% of your time brushing up on the other areas.


    # Step 6. Repeat Step 4 and 5 until fully certified!


    # Using the Exam Engine


    The PCPT on the CD includes a database of questions created specifically for this
    book. The PCPT engine can be used either in Study mode or Practice Exam mode,
    as follows:


    +   - **Study mode:** Most useful when you want to use the questions for learning
    and practicing. In Study mode, you can select options like randomizing the order
    of the questions and answers, automatically answering the questions as you go,
    testing on specific topics, and many other options.


    +   - **Practice Exam mode:** Presents questions in a timed environment, providing
    you with a more-realistic experience. It also restricts your ability to see your
    score as you progress through the exam and view answers to questions as you are
    taking the exam. These timed exams not only allow you to study for the actual
    640-461 ICOMM Exam, they help you simulate the pressure that can occur on the
    actual exam.


    When doing your final preparation, you can use Study mode, Practice Exam mode,
    or both. However, after you see each question a couple of times, you will likely
    start to remember the questions, and the usefulness of the exam database may go
    down. So, consider the following options when you use the exam engine:


    +   - Use this question database for review. Use Study mode to study the questions
    by chapter, just as with the other final review steps listed in this chapter.
    Plan on getting another exam (possibly from the Premium Edition) if you want to
    take additional simulations.


    +   - Save the question database, not using it for review during your review of
    each book part. Save it until the end, so you will not have seen the questions
    before. Then, use Practice Exam mode to simulate the exam.'
  merge: -1
  img_proc: true
- pgno: 490
  md: 'Picking the correct mode from the exam engine''s user interface is obvious.
    The following steps show how to move to the screen from which to Study or Practice
    Exam mode:


    **Step 1.** Click the My Products tab if you are not already in that screen.


    **Step 2.** Select the exam you want to use from the list of available exams.


    **Step 3.** Click the Use button.


    By taking these actions, the engine should display a window from which you can
    choose Study Mode or Practice Exam Mode. When Study mode, you can further choose
    the book chapters, limiting the questions to those explained in the specified
    chapters of this book.


    # Summary


    The tools and suggestions listed in this chapter are designed with one goal in
    mind: to help you develop the skills required to pass the 640-461 ICOMM Exam.
    This book has been developed from the beginning to not just tell you the facts,
    but help you learn how to apply the facts. No matter what your experience level
    leading up to you take the exams, it is our hope that the broad range of preparation
    tools, and even the structure of the book, will help you pass the exam with ease.
    I hope you do well on the exam.'
  merge: -1
  img_proc: true
