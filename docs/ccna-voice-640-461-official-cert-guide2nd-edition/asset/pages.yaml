- pgno: 140
  md: 'Finally, you can use the syntax shown in Example 6-4 to configure caller ID
    information for the device attached to the FXS port.


    # Example 6-4 Configuring FXS Port Caller ID Information


    ```

    CME_Voice(config)# voice-port 0/0/0

    CME_Voice(config-voiceport)# station-id name 3rd Floor Fax

    CME_Voice(config-voiceport)# station-id number 5551000

    ```


    This configuration allows other devices in your system to receive caller ID name
    and information any time the device attached to the FXS port places a call to
    them.


    # Foreign Exchange Office Ports


    FXO ports act as a trunk into the public switched telephone network (PSTN) central
    office (CO) or private branch exchange (PBX) systems, as shown in Figure 6-2.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_140_0.png)


    # Figure 6-2 FXO Port Connections


    FXO ports use many of the same commands as FXS ports, such as signal to loop start
    or ground start signaling and station-id to set caller ID information. Two additional
    commands are of note:


    +   - dial-type

    - ring number


    The dial-type <dtmf|pulse> command allows you to choose to use dual-tone multifrequency
    (DTMF) or pulse dialing. Yet, some areas of the world still require the use of
    pulse dialing (and rotary phones). If you are installing a voice network into
    one of these areas, this command is for:


    The ring number <number> command allows you to specify the number of rings that
    should pass through the router answering an incoming call to the FXO port. By
    default, this is set to one ring, which causes the router to answer an incoming
    call immediately. There'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# CCNA Voice 640-461 Official Cert Guide


    might be instances where the FXO port of the router is attached to a loop of other
    devices (as in a home office environment) and the user wants the other devices
    to have a chance to answer before the router picks up the line and processes it.
    In this case, you can set the ring number to a higher value.


    # Configuring Digital Voice Ports


    Cisco provides digital T1 and E1 ports in the form of Voice and WAN Interface
    Cards (VWIC) for routers. These cards offer you the flexibility to configure for
    a data connection or a voice connection. Unlike analog interfaces, you must configure
    digital interfaces before they operate correctly, because the router does not
    know the type of network you will be using. As discussed in Chapter 1, "Traditional
    Voice Versus Unified Voice," two types of network configurations exist: T1/E1
    associated signaling (CAS) or T1/E1 common channel signaling (CCS), commonly referred
    to as ISDN Primary Interface [PRI]. The type of network you are connecting dictates
    the command you use to configure your VWIC card: ds-group for T1/E1 CAS connections
    or pri-group for T1/E1 CCS connections.


    Example 6-5 demonstrates how to configure all 24 channels of a T1 CAS interface
    to connect to a PSTN carrier.


    # Example 6-5 Configuring a T1 CAS PSTN Interface


    ```

    CME Voice# show controllers t1

    T1 1/0 is down.

    Applique type is Channelized T1

    cableLength is longgain36 db

    Transmitter is sending remote alarm.

    Receiver has loss of signal.

    alarmtrigger is not set

    Soaking time: 3, Clearance time: 10

    AIS State:Clear LOS State:Clear LOF State:Clear

    Version info Firmware: 20585620, FPGA: 20, spm_count = 0

    Framing is SF, Line Code is AMI, Clock Source is Line.

    Current port master clock:local osc on this network module

    Data in current interval (215 seconds elapsed)

    @ Line Code Violations, @ Code Violations

    @ Slip Secs, @ Fr Secs, @ Err Secs, @ Degraded Mins

    @ Errored Secs, @ Bursty Err Secs, @ Severely Err Secs, 215 Unavail Secs

    CME_Voice# configure terminal

    Enter configuration commands, one per line. End with CNTL/Z.

    CME_Voice(config)# controller t1 1/0

    CME_Voice(config-controller)# framing ?

    esf Extended Superframe

    sCME_Voice(config-controller)# framing esf

    CME_Voice(config-controller)# linecode ?

    ```'
  merge: -1
  img_proc: true
