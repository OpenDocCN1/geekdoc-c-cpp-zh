    After you create the dial peer, you can then assign the phone number to the attached
    device(s) by using the destination-pattern and port commands. You enter this configuration,
    you can place calls between the phones attached to the CME A router. Before you
    place any calls, it is always best to verify the dial peer configuration.


    > **Tip:** After a dial peer is created, you no longer need to specify the type
    of dial peer when entering the configuration mode. For example, to create a VoIP
    dial peer with tag 50, you enter dial-peer voice 50 voip. If you want to return
    to the configuration mode later, you only enter dial-peer voice 50. If you want
    to change the type of dial peer (VoIP or POTS), you must delete the dial peer
    (no dial-peer voice 50) and create it again.


    The show dial-peer voice command (without the summary keyword) shows you all the
