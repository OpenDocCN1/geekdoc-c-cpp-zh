    # How This Book Is Organized


    Although this book could be read cover-to-cover, it is designed to be flexible
    and allow you to easily move between chapters and sections of chapters to cover
    just the material you need work with. If you intend to read all the chapters,
    the order in the book is an excellent sequence to use.


    The core chapters, Chapters 1 through 17, cover the following topics:


    +   - Chapter 1, "Traditional Voice Versus Unified Voice." This chapter discusses
    what would be known as the traditional telephony world. It begins where the telephone
    system originally started: analog connectivity. It moves into the realm of digital
    connections and considerations and considers the traditional voice discussion
    with the primary pieces that you need to know from the public switched telephone
    network (PSTN). Chapter 1 then moves into the unified voice realm, discussing
    the benefits of VoIP, the process of coding and decoding audio, digital signal
    processors (DSP), and the core VoIP protocols.'
