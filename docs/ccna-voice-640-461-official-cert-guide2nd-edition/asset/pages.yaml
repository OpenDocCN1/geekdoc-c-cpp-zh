    number that is failing and how CME handles the digits as the user dials them.


    # QoS Issues


    Troubleshooting QoS is a different skill set and strategy for troubleshooting
    dial-plan issues. Instead of working with the routing table for you, you''re working
    with the traffic itself.


    You might have heard the saying before, "If you have no goal, you''ll hit it every
    time." Before we troubleshoot voice quality issues, we need to have a goal we''re
    shooting for. Table 15-2 shows the Cisco recommended parameters for high-quality
    voice calls.


    # Table 15-2 Requirements for High-Quality VoIP Calls


    | Parameter | Requirement |

    | --- | --- |

    | End-to-end (one-way) delay | 150 ms or less |

    | Jitter | 30 ms or less |

    | Packet loss | 1% or less |'
  merge: -1
  img_proc: true
- pgno: 438
  md: 'The full definition of each these was discussed in Chapter 6, “Understanding
    the CME Dial-Plan.” This is half of the puzzle: We know how fast and consistent
    our voice traffic must travel across the network. The other half of the puzzle
    is how much voice traffic must travel across the network. You can find this out
    on two factors: the voice CODEC you are using for the calls and how many concurrent
    calls you plan to support. Table 15-3 shows the average bandwidth usage for the
    most popular codecs used in a VoIP network.


    # Table 15-3 Average Bandwidth Utilization for G.711 and G.729A


    | Codec | Packetization Interval | Bandwidth Per Cell |

    | G.711 | 20 ms | 80 kbps |

    | G.711 | 30 ms | 74 kbps |

    | G.729A | 20 ms | 24 kbps |

    | G.729A | 30 ms | 19 kbps |


    Keep in mind that these are simply average values. After you develop the ninja
    skills needed for CCNP Voice, you can calculate these down to the bit-level for
    your specific environment. The methods you need to do this are covered in the
    CVOICE Authorized Self-Study Guide, which you can find at www.cisco.com/bookstore/product.asp?isbn=1587055546.


    > Tip: The packetization interval represents how much audio is included per packet.
    The larger your packetization interval, the more audio data you put into each
    packet. The more audio data you put in each packet, the less packets you send
    (thus, the slight bandwidth savings by choosing 30 ms packetization intervals).
    The default packetization interval on Cisco routers is 20 ms.


    Now, we can pick the two puzzle pieces together. We know the requirements for
    high-quality audio and we know how much bandwidth each call consumes. Now, we
    need to provide QoS for our switches and routers are able to guarantee priority
    queuing for our voice call bandwidth.


    After you configure QoS, keep a proactive eye on the network to ensure that it
    meets quality standards. Although there are many sophisticated (and expensive)
    tools available to help measure and monitor the voice traffic crossing the network,
    you actually get a basic monitoring utility each time you purchase a Cisco IP
    Phone. Whenever a phone is on an active call, you can press the question-mark
    button (help menu) to retrieve call statistics, as shown in Figure 15-3.


    The call statistics include:


    +   * Codec

    "* Packet size

    "* Received and transmitted packets

    "* Average and maximum jitter

    "* Lost packets'
  merge: -1
  img_proc: true
- pgno: 439
  md: "![](img/e4ad7862dc47b4e5de0cde3b4550ad65_439_0.png)\n\n**Figure 15-3** Gathering\
    \ Call Statistics\n\nYou can also retrieve these statistics by accessing the built-in\
    \ web server of the IP phone (by entering the phone's IP address into a web browser\
    \ while it is on an active call).\n\nAlthough a plethora of QoS troubleshooting\
    \ techniques are available (and discussed in the CVOICE book previously mentioned),\
    \ we highlight only one of them. When you deploy QoS on a router, there are a\
    \ variety of methods and configurations you can use. However, when it comes time\
    \ to apply these methods to your router, you use an interface command known as\
    \ **service-policy**. This command applies a policy-map to your interface and\
    \ engages QoS similar to the **ip access-group** command applying an access-list\
    \ to an interface and engaging QoS security. You can verify your QoS statistics\
    \ by using the **show policy-map interface** command. Example 15-3 shows the output\
    \ of this command.\n\n**Example 15-3** show policy-map interface Command Output\n\
    \n```\nRouter# show policy-map interface serial3/1 output\nSerial3/1\n Service-policy\
    \ output: VoicePriority\n Class-map: voice (match-all)\n  0 packets, 0 bytes\n\
    \  5 minute offered rate 0 bps, drop rate 0 bps\n  Match: ip precedence 5\n  Weighted\
    \ Fair Queuing\n    Strict Priority\n    Output Queue: Conversation 264\n```"
  merge: -1
  img_proc: true
- pgno: 440
  md: '| Bandwidth 128 (kbps) Burst 3200 (Bytes) |

    | (pkts matched/bytes matched) 14231/3903582 |

    | (total drops/bytes drops) 1253/391292 |


    This output allows you to see the success or failure of the QoS policy applied
    to the outbound-direction of Serial 3/1. Notice the QoS policy is named VoicePriority.
    It grants strict priority to the first 128 kbps of voice traffic. Notice the number
    of packets dropped (1253). This indicates a problem; this is roughly 8 percent
    of your voice packets. On an actual network, this could call degradation issues
    of active calls.


    The drops are most likely caused by one of two things: a congested WAN link or
    voice traffic exceeding the provisioned amount. A congested WAN link simply means
    that there is not enough bandwidth to send the calls in the time required, so
    the packets are dropped. The latter seems almost identical to the first. That
    is, if you have too many voice calls, won''t congest the WAN and not be able to
    get all the packets through? Although this may be true, the more likely is the
    Strict Priority queuing configuration. Strict Priority ensures that the VoIP traffic
    gets the first and fastest 128 kbps available. However, once the voice traffic
    tries to exceed this amount, the router begins dropping the traffic (even if there
    is bandwidth available on the WAN link). This ensures that you know exactly how
    much voice traffic is going over your WAN connections. The data traffic won''t
    have to fight for the scraps of bandwidth left over.


    **Note:** All these troubleshooting guidelines also apply to phones registering
    with CUCM.'
  merge: -1
  img_proc: true
