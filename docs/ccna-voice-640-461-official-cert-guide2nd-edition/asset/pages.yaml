    # # Configuring Call Pickup


    Michael works in the sales department at Widget Things, Inc. Being the newest
    member to the group, he works the late shift, covering calls from 10:30 a.m. to
    7:30 p.m. Around 6:00 p.m., the last coworker leaves, and Michael handles all
    the incoming calls alone. Unfortunately, many of Widget Things'' customers have
    the direct contact information for other sales employees, so a typical evening
    for Michael consists around answering phone calls coming in the IP phones of the
    five other sales reps. This is where call pickup features can help.


    Call park allows you to answer another ringing phone in the organization from
    your local phone. This is accomplished by pushing the Pickup Up softkey on the
    IP phone while another phone is ringing. The call automatically transfers to the
    local phone, where you can answer. Of course, the organization is large, and there
    could be many ringing phones at the same time, so call park gives you the opportunity
    to divide the phones into groups. You assign each of these groups a number in
    the CME configuration, as shown in Figure 7-14.


    Based on the softkey, the users can answer other ringing phones in their own group
    or enter other group numbers to answer the ringing phones in that group.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Chapter 7. Configuring Cisco CME Voice Productivity Features 191


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_220_0.png)


    Figure 7-13 Advanced Call Park Features Available from CCP


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_220_1.png)


    Figure 7-14 Designing Call Pickup Groups


    The configuration of call pickup is incredibly simple: Just design your groups
    of phones and assign the ephone-dns to the groups. Example 7-7 assigns ephone-dns
    1, 2, and 3 to the SALES group and ephone-dns 4, 5, and to the ACCOUNTING group,
    as shown in Figure 7-14.


    # Example 7-7 Configuring Call Pickup


    ```

    CME_Voice(config)# ephone-dns 1

    CME_Voice(config-ephone-dn)# pickup-group 5509

    CME_Voice(config-ephone-dn)# ephone-dns 2

    CME_Voice(config-ephone-dn)# pickup-group 5509

    CME_Voice(config-ephone-dn)# ephone-dns 3

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: '```

    CME_Voice(config-ephone-dn)# pickup-group 5509

    CME_Voice(config-ephone-dn)# ephone-dn 4

    CME_Voice(config-ephone-dn)# pickup-group 5510

    CME_Voice(config-ephone-dn)# ephone-dn 5

    CME_Voice(config-ephone-dn)# pickup-group 5510

    CME_Voice(config-ephone-dn)# ephone-dn 6

    CME_Voice(config-ephone-dn)# pickup-group 5510

    ```


    Note: When you assign the first ephone-dn to a call group number, CME creates
    the call pickup group. No additional command is needed for the call pickup creation.


    When you assign the ephone-dns to the respective call pickup groups, users can
    begin answering other ringing phones. CME permits three methods to answer other
    ringing phones:


    +   **Directed pickup:** You can pick up another ringing phone directly by pressing
    the PickUp softkey and dialing the DN of the ringing phone. CME then transfers
    the call and immediately answers it at your local place.


    +   **Local pickup:** You can pick up another ringing phone in the same call pickup
    group as your phone by pressing the GPickUp button and entering an asterisk (*)
    when you hear the second dial tone.


    +   **Other group pickup:** You can pick up a ringing phone in another group by
    pressing the GPickUp button and entering the other group number when you hear
    the second dial tone.


    If multiple phones are ringing in the user''s call pickup group, CME answers the
    oldest ringing phone when the user invokes call pickup.


    Note: The GPickUp softkey functions differently depending on the call pickup configuration
    in CME. If there is only one group configured in CME, the GPickUp button automatically
    answers the call from your group number. You will not hear a second dial tone,
    and you do not need to dial an asterisk to signify your group, because only one
    group is defined. After you configure multiple groups in CME, you hear a second
    dial tone after pressing the GPickUp softkey; at this point, you can dial either
    an asterisk for the local group or another group number.


    Tip: By default, users can pick up other ringing phones managed by CME using the
    directed pickup method, described previously, regardless of the destination device
    being assigned to a Call Pickup group. To disable this feature, enter the command
    no service directed-pickup from telephony service configuration mode. After you
    enter this command, the GPickUp softkey on the IP phones operates as a local group
    button. Pressing the softkey immediately answers ringing calls in your own local
    pickup group.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_221_0.png)'
  merge: -1
  img_proc: true
