  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_209_0.png)


    Figure 7-6 Adding Manual Directory Entries with CCP


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_209_1.png)


    Figure 7-7 Forwarding Calls from the Cisco IP Phone'
  merge: -1
  img_proc: true
- pgno: 210
  md: "# Forwarding Calls from the CLI\n\nForwarding calls from the command line gives\
    \ you more options than does forwarding calls from the IP phone, as shown in Example\
    \ 7-3.\n\n# Example 7-3 Forwarding Calls from the Cisco IOS CLI\n\n```\nCME_Voice(config)#\
    \ ephone-dn 21\nCME_Voice(config-ephone-dn)# call-forward ?n  all           forward\
    \ all calls\n  busy          forward call on busy\n  max-length    max number\
    \ of digits allowed for CFwdAll from IP phone\n  night-service forward call on\
    \ activated-service\n  noan          forward call on no-answer\nCME_Voice(config-ephone-dn)#\
    \ call-forward busy 1599\nCME_Voice(config-ephone-dn)# call-forward noan 1599\
    \ ?n  timeout       ringno answer timeout duration\nCME_Voice(config-ephone-dn)#\
    \ call-forward noan 1599 timeout ?n  <3-6000> ringing no answer timeout duration\
    \ in seconds\n```\n\n![](img/e4ad7862dc47b4e5de0cde3b4550ad65_210_0.png)\n\nThese\
    \ options allow you to forward calls that are busy or not answering (noan) to\
    \ a different extension. Although this is typically a voicemail number (which\
    \ 1599 represents in Example 7-3), this could also be another IP phone if this\
    \ DN was a member of a hunt group.\n\n> Tip: In the United States, the phone rings\
    \ for 2 seconds followed by 4 seconds of silence. Knowing this can be useful in\
    \ calculating a good answer (noan) timeout value.\n\nAlso notice that you can\
    \ specify a max-length value after the call-forward command. Using this, you can\
    \ restrict the IP phone from forwarding to external destinations. If you enter\
    \ the command call-forward max-length 0, CME makes the IP phone call forwarding\
    \ feature unavailable to the Cisco IP Phone. The CFwdAll button will dim on the\
    \ IP phone and become inaccessible.\n\n> Tip: At this point, you should have a\
    \ good idea that plenty of configurations each ephone-dn are similar to all the\
    \ others. Make an ephone-dn (and ephone) template in Notepad (or some other text\
    \ editor) which you list all the common configuration commands you'll be applying\
    \ in your environment. That way, if you ever need to add new ephone-dns, you will\
    \ already have a template listing the common commands you need to enter.\n\n#\
    \ Using the call-forward pattern Command to Support H.450.3\n\nThere is one additional\
    \ command to discuss here, which is available from telephony configuration mode:\
    \ call-forward pattern. This command allows you to enter a pattern for numbers\
    \ that will support the H.450.3 call forward standard."
  merge: -1
  img_proc: true
- pgno: 211
  md: 'To understand the benefits of H.450.3, you must first understand what happens
    with typical

    VoIP forwarding. When a call enters the network and hits a forwarded device, that
    de-

    vice takes responsibility for the call and becomes a tandem hop in the call flow.
    How

    means that the voice traffic now forwards through the IP phone that forwarded
    the call.

    This can cause quality problems if the device that forwarded the call is a large
    geography-

    distance away from the phone receiving the forwarding call. The H.450.3 standard
    rep-

    sresents a method that allows the CME router to redirect the call directly to
    the final

    destination instead of acting as a tandem hop. Figure 7-8 illustrates this concept.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_211_0.png)


    Call Forwarding without H.450.3


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_211_1.png)


    Call Forwarding with H.450.3


    Figure 7-8 Forwarding Calls With and Without H.450.3 Standards


    In Figure 7-8, the IP phone with x1002 is forwarded to the IP phone with x1003.
    The top

    part shows the VoIP call flow without H.450.3 when x1001 places a call to x1002.
    Notice

    the VoIP traffic must pass through the California CME router to reach Florida.
    This

    can cause intense quality of service (QoS) problems with the call, such as audio
    clipping,

    distortion, and even drops. This symptom is commonly called bairpairing of the
    call.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The bottom part shows the call with H.450.3 support enabled. When the call
    reaches California, CME sends an H.450.3-based redirect message, instead of accepting
    the call and forwarding it on to Florida. The VoIP traffic travels directly from
    x1001 in Texas to Florida rather than passing through California to get there.


    Entering call-forward pattern <pattern> from telephony service configuration mode
    tells CME numbers which should begin with H.450.3 support. Entering the pattern
    15, tells CME, "I want all four-digit numbers that begin with 15 to support H.450.3."
    Thus, all calls to 15XX would support H.450.3 call forwarding.


    **Note:** There is much more to be said about the H.450.3 standard. There is also
    more configuration that should be in place to fully support H.450.3. This is intended
    to be a "sneak peak" of the standard, which the CCNP voice certification track
    fully explores.


    If you prefer to use CCP for making forwarding modifications, you can find the
    settings under the Advanced tab of the Extensions window (Unified Communication
    > Users, Phones, and Extensions > Extensions), as shown in Figure 7-9.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_212_0.png)


    **Figure 7-9** Configuring Forwarding Using CCP'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Configuring Call Transfer


    Transferring calls represents another common function in voice networks. To transfer
    a call, hit the Transfer softkey while on an active call. (Note that this is not
    a typo: Transer without the i is correct.) When you hear another dial tone, at
    which point you can dial the phone number to which you want to transfer your active
    call. What happens depends on the transfer method configured on the CME router.
    Two transfer methods are:


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_213_0.png)


    +   - Consult: Consult transfer allows you to speak with the other party before
    transferring the call. After you dial the number to which you want to transfer
    the call, you can wait for the other party to answer and speak with them before
    transferring the call. Pressing the Transfer softkey a second time transfers the
    call, dropping you out of the conversation. Consult transfers require a second
    line (or dual-line configuration). This is the default transfer mode in CME. However,
    the specific method of transfer used by default in CME is Full Consult.


    +   - Blind: Blind transfer immediately transfers the call after you dial the
    number (you do not hit the Transfer softkey a second time). Blind transfers can
    work in a single-line configuration.


    To configure the transfer method used, see Example 7-4.


    # Example 7-4 Configuring CME Transfer Methods System-Wide


    ```

    CME_Voice(config)# telephony-service

    CME_Voice(config-telephony)# transfer-system =

    full-blind      Perform calls without consultation using H.450.2 or SIP

    REFER standard methods

    full-consult   Perform H.450.2/SIP call transfers with consultation using second

    phone line if available, fallback to full-blind if second line is unavailable.

    This is the recommended method for most systems. See also ''supplementary-service''

    commands under ''voice service voip'' and dial-peer.

    local-consult  Perform call transfers with local consultation using second

    line if available, fallback to blind for non-local consultation/transfer

    target. Use Cisco proprietary method.

    ```


    ```

    CME_Voice(config-telephony)# transfer-system full-consult

    ```


    As you can see from the context-sensitive help, three transfer methods are available:
    full-blind, full-consult, and local-consult. Describe the transfer methods introduced
    at the beginning of this section. The full-blind and full-consult transfer methods
    use the industry-standard H.450.2 method of transferring. Just like call forwarding,
    you don''t want to hairpin the call and cause potential QoS issues each time you
    transfer. By using the H.450.2 standard when transferring a call, the CME router
    completely drops the call from the transferring phone and starts a new call to
    the phone to which the call was transferred.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'The local-consult method uses a Cisco proprietary transfer method that performs
    a consult if multiple lines or dual-line configurations are available, but will
    revert to blind transfers if only a single line is available. Cisco proprietary
    works similar to the H.450 standard. The only problem is this transfer method
    results in hairpinned calls if you have no-Cisco IP telephony systems on your
    network.


    **Note:** You can also configure transfer modes individually for each ephone-dn
    by using the transfer-mode<blind/consult> syntax for ephone-dn configuration mode.
    Configuring the transfer mode way uses H.450 standards and overrides the system-wide
    setting.


    By default, the Cisco router restricts transfers to devices that are not locally
    managed. This is usually a good policy, because transferring outside of the company
    can result in toll fraud. For example, a user could transfer an outside caller
    to an international number, causing the tolls to be billed to the organization
    rather than the outside caller. If you would like to allow transfers outside of
    the locally managed devices, you can use the transfer-pattern<pattern> command
    from telephony service mode, where pattern represents numbers to whom you would
    like to allow transfers. Example 7-5 configures the Cisco Unified CME allows transfers
    to 5XXX extensions and local-digit PSTN numbers.


    # Example 7-5 Configuring CME Transfer Patterns to Allow Outside Transfers


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_214_0.png)


    ```

    CME_Voice(config)#telephony

    CME_Voice(config-telephony)#transfer-pattern ?n  WORD digit string pattern for
    permitted non-local call transfers


    CME_Voice(config-telephony)#transfer-pattern 5...

    CME_Voice(config-telephony)#transfer-pattern 9....................


    ```


    Cisco CCP also allows the configuration of transfer patterns. These are found
    under Unified Communications > Advanced Telephony Settings. The simple configuration
    shown in Figure 7-10 allows you to simply click the Add button and add manually
    configured transfer patterns directly into the CCP interface.


    # Configuring Call Park


    Typically, when you place a call on hold, you can retrieve the call only from
    the original phone where you placed the call on hold. Shared-line systems bind
    the rules by allowing you to retrieve the call from any phone with the same shared
    line assignment. The call park features this one step further allowing you to
    retrieve the call from any phone in the organization. Call park “parks” the caller
    on hold at an extension rather than on a specific line. Any IP phone that is able
    to dial the park extension number can retrieve the call.


    The call park system works by finding free e-dns in the Cisco Unified CME configuration
    that you have not assigned to an IP phone and have specifically designated as
    a'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'call park slot. You can either allow CME to park calls randomly at the first
    available ephone-dn or allow users to choose the extension where the call is parked.
    Each of these scenarios fits different environments. Calls being parked at random
    extensions might work well for a warehouse environment with a voice-paging system.
    When an employee has a call, the receptionist could announce, "Larry, you have
    a call on 5913," over the loudspeaker, at which point Larry could go to a phone
    and dial the extension to pick up the call on hold.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_215_0.png)


    **Figure 7-10** Using CCP to Configure Transfer Patterns


    Choosing extensions would work well for an electronics superstore in which each
    department responded to a known extension number. For example, software could
    be extension 301, cameras could be extension 302, and so on. The receptionist
    can then park multiple calls on a single park number (this requires multiple ephone-dns
    assigned the same extension). As the service department retrieves the calls, CME
    distributes them in the order in which they were requested.


    You can configure call park by simply adding an ephone-dn designated for call
    park purposes. Example 7-6 creates two ephone-dns designated for call park.


    **Example 7-6** Configuring Call Park Ephone-DNDs


    ```

    CME_Voice(config)# ephone-dn 50

    CME_Voice(config-ephone-dn)\# number 3001

    CME_Voice(config-ephone-dn)\# name Maintenance

    CME_Voice(config-ephone-dn)\# park-slot

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: '```

    CME_Voice(config-ephone-dn)# exit

    CME_Voice(config-ephone-dn)# ephone-dn 51

    CME_Voice(config-ephone-dn)# number 3002

    CME_Voice(config-ephone-dn)# name Sales

    CME_Voice(config-ephone-dn)# park-slot =

    reserved-for Reserve this park slot for the exclusive use of the phone with the

    extension indicated by the transfer extension number

    timeout Set call park timeout

    <cr>

    CME_Voice(config-ephone-dn)# park-slot ? =

    <0-65535> Specify the park timeout (seconds) before the call is returned to the

    number it was

    CME_Voice(config-ephone-dn)# park-slot timeout 60 ?

    limit Set call park timeout count limit

    CME_Voice(config-ephone-dn)# park-slot timeout 60 limit =

    <1-65535> Specify the number of park timeout cycles before the call is

    disconnected

    CME_Voice(config-ephone-dn)# park-slot timeout 60 10 ?

    notify Define additional extension number to notify for park timeout

    recall recall transfer back to originator phone after timeout

    transfer Transfer to originator or specified destination after timeout

    exceeded

    <cr>

    CME_Voice(config-ephone-dn)# park-slot timeout 60 10 recall =

    alternate Transfer to alternate target if original target is busy

    retry Set call/transfer retry interval if target is in use

    <cr>

    ME_Voice(config-ephone-dn)# park-slot timeout 60 10 recall

    ```


    Look at the configuration of ephone-dn 50 in Example 7-6. Designating a call park
    extension is as simple as using the park-slot command over ephone-dn configuration
    mode.


    **Note:** When planning to configure call park, keep in mind that each parked
    call slot consumes an ephone-dn slot (regardless of single- or dual-line configurations).
    You may need to increase the number of ephone-dns (max-dn) that your CME deployment
    supports.


    Example 7-6 also shows that you have many options when you designate call park-specific
    ephone-dns. Table 7-2 explains where you can use these options.


    # **Table 7-2** Options for Use with the park slot Command


    | Command | Function |

    | reserved-for <dn> | Allows you to reserve the call park slot for the directory
    number (DN) you enter. Other phones are not able to use the call park slot. |'
