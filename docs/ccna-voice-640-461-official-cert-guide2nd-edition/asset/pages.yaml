    Two commands in this syntax deal with the automatic digit-stripping feature of
    POTS dial forward-digits <numbers> and prefix <number>. The forward-digits <number>
    command allows you to specify the number of right-justified digits you want to
    forward. Notice the first dial 90 in Example 6-12. With a destination pattern
    of [469]11, the router would automatically strip the 9 and the 2s from the pattern
