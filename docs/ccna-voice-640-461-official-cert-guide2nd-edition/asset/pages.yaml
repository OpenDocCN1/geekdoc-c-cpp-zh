    # Adding Directory Numbers, Phones, and Users with CCP


    For the not-so-command-line-at-heart, Cisco provides the Cisco Configuration Professional
    (CCP) GUI to configure ephones and ephone-dns using a point-and-click interface.
    Because the CCP keeps everything in order and formal, simply adding ephone-dns
    (called "Extensions" in CCP) and ephones (called "Phones" in CCP) is not possible.
    If you try to do it, CCP, displays the error message shown in Figure 5-3.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_124_0.png)


    Figure 5-3 CCP Forces Telephony Service Configuration


    The Telephony Service configuration is essentially the same configuration from
    the Base CME commands shown in Example 5-4. To access the Telephony Service configuration
    in CCP, access Configure > Unified Communications > Telephony Settings. CCP then
    provides a window to configure the max-phones, max-dn, and ip source address commands
    (see Figure 5-4). The IOS CLI preview confirms this.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 96 CCNA Voice 640-461 Official Cert Guide


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_125_0.png)


    #  5-4 Telephony Service Configuration from CCP


    > Tip: CCP might not refresh the CME configuration after making a change (such
    as configuring the base telephony service features). If you configure the telephony
    service as shown in Figure 5-4 and still receive the message stating that the
    telephony service must be set up (before configuring extensions or phones), refresh
    the CME configuration in CCP by clicking the Refresh button at the top of the
    utility.


    Now, we can return to the Extension configuration (Configure -> Unified Communications
    -> Users, Phones and Extensions > Extensions). CCP does not immediately connect
    the extensions (phone-dns) and phones (phones); you can configure them in whatever
    order you feel most comfortable. For now, we start with the extensions: At the
    bottom of the CCP Extensions window is a button labeled Create. Clicking this
    causes the Create Extension dialog box to appear, as shown in Figure 5-5.


    This window provides the same capabilities that we had added the phone-dn from
    a command-line interface (CLI) without knowing a lick of command-line syntax.
    Upon clicking the OK button, the CCP IOS CLI Preview displays the following:


    +   * phone-dn 1 dual-line

    * number 1050 secondary 14805551050

    * label Jeremy Ciara

    * description Primary line

    * exit'
