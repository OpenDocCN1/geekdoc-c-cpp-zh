- pgno: 23
  md: '# Command Syntax Conventions


    The conventions used to present command syntax in this book are the same conventions
    used in the IOS Command Reference. The Command Reference describes these conventions
    as follows:


    +   - **Boldface indicates commands and keywords that are entered literally as
    shown.** In actual configuration examples and output (not general command syntax),
    boldface indicates commands that are manually input by the user (such as a **show**
    command).

    - *Italics* indicate arguments for which you supply actual values.

    - Vertical bars (|) separate alternative, mutually exclusive elements.

    - Square brackets [ ] indicate optional elements.

    - Braces { } indicate a required choice.

    - Braces within brackets [ [ ] indicate a required choice within an optional element.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# # Introduction


    Welcome to the world of CCNA Voice! As technology continues to evolve, the realm
    of voice, which was traditionally kept completely separate from data, has now
    begun to merge with the data network. This brings together two different worlds
    of people: data technicians—historically accustomed to working with routers, switches,
    servers, and the like—and technicians, historically accustomed to working with
    PBX systems, digital headsets, and trunk lines. Regardless of your background,
    one of the primary goals of the new CCNA Voice certification is to bridge these
    two worlds together.


    In June 2008, Cisco announced new CCNA specialties, including CCNA Security, CCNA
    Wireless, and CCNA Voice. These certifications, released ten years after the initial
    CCNA, represent Cisco''s growth into new and emerging industries. Certification
    candidates can now specialize in specific areas of study. Figure I-1 shows the
    basic organization of the certifications and exams used to achieve your CCNA Voice
    certification.


    **Figure I-1** Cisco Certifications and CCNA Voice Certification Path


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_24_0.png)


    As you can see from Figure I-1, a traditional CCNA certification is a prerequisite
    before you venture into the CCNA Voice certification.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Goals and Methods


    The most important and somewhat obvious goal of this book is to help you pass
    the Introducing Cisco Voice and Unified Communications Administration v8.0 (ICOM
    8.0) exam (640-461). In fact, if the primary objective of this book were different,
    the book''s title would be misleading. The methods used help you pass the ICOMM
    8.0 exam and make you much more knowledgeable about how to do your job.


    This book uses several key methodologies to help you discover the topics that
    you need to review in depth, to help you fully understand and remember those details,
    and to help you prove to yourself that you have retained your knowledge of those
    topics. So, this book does not help you pass by memorization, but helps you truly
    learn and understand the topics. The CCNA Voice exam is the foundation for many
    of the Cisco professional certifications, and it would be a disservice to you
    if this book did not help you learn the material. Therefore, this book helps you
    pass the CCNA Voice exam by using the following methods:


    +   Helping discover which test topics you have not mastered


    +   Providing explanations and information to fill in your knowledge gaps


    +   Supplying exercises and scenarios to enhance your ability to recall and deduce
    the answers to test questions


    +   Providing practice exercises on the topics and the testing process via test
    questions on the CD-ROM


    In addition, this book uses a different style from typical certification-preparation
    books. The newer Cisco certification exams have adopted a style of testing that
    essentially says, "If you don''t know how to do it, you won''t pass this exam."
    This means that most of the questions on the certification exam require you to
    deduce the answer through reasoning or configuration rather than just memorizing
    facts, figures, or syntax from a book. To accommodate this newer testing style,
    the authors have written this book as a real-world explanation of Cisco VoIP topics.
    Most concepts are explained using real-world examples rather than showing syntax
    and explanations, which are freely available on Cisco.com. As you read this book,
    you দ্বিত get a feeling of, "This is how I can do this," which is exactly what
    you need for the newer Cisco exams.


    # Who Should Read This Book?


    The purpose of this book is twofold. The primary purpose is to tremendously increase
    your chances of passing the CCNA Voice certification exam. The secondary purpose
    is to provide the information necessary to manage a VoIP solution using Cisco
    Unified Communication Manager (CME), Cisco Unified Communications Manager (CUCM),
    Cisco Unity Connection, or Cisco Presence. Cisco''s new exam approach provides
    an avenue to write this book with both a real-world and certification-study approach
    at the same time. As you read this book and study the configuration examples and
    exam tips, you will have a true sense of understanding how you could deploy a
    VoIP system, while at the same time feeling equipped to pass the CCNA Voice certification
    exam.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Strategies for Exam Preparation


    Strategies for exam preparation will vary depending on your existing skills, knowledge,
    and equipment available. Of course, the ideal exam preparation would consist of
    building a small voice lab with a Cisco Integrated Services Router, virtualized
    lab versions of CUCM, Unity Connection, and Presence servers, a switch, and a
    few IP Phones, which you could then use to work through the configurations as
    you read this book. However, not everyone has access to this, so the next best
    step you can take is to read the chapters and jot down notes with key concepts
    or configurations on a separate notepad. Each chapter begins with a “Do I Know
    This Already?” quiz, which is designed to give you a good idea of the chapter''
    content and your current understanding of it. In some cases, you might already
    know most of or all the information covered in a given chapter.


    After you read the book, look at the current exam objectives for the CCNA Voice
    exam listed on Cisco.com (www.cisco.com/certification). If there are any areas
    in the certification exam outline that you would still like to study, find those
    sections in the book and review them.


    When you feel confident in your skills, attempt the practice exam included on
    the CD with this book. As you work through the practice exam, note the areas where
    you lack confidence and review those concepts or configurations in the book. After
    you have reviewed the areas, work through the practice exam a second time and
    review your skills. Keep in mind that the more you work through the practice exam,
    the more familiar the questions will become, and so the practice exam will become
    a less accurate judge of your skills.


    After you work through the practice exam a second time and feel confident with
    your skills, schedule the real ICOMM 8.0 (640-46) exam through Vue (www.vue.com).
    You should typically take the exam within a week from when you consider yourself
    ready to take the exam, so that the information is fresh in your mind.


    Keep in mind that Cisco exams are very difficult. Even if you have a solid grasp
    of the information, many other factors play into the testing environment (stress,
    time constraints, and so on). If you pass the exam on the first attempt, fantastic!
    If not, know that this commonly happens. The next time you attempt the exam, you
    will have a major advantage: You already experienced the exam first-hand. Although
    future exams may have different questions, the topics and general “feel” of the
    exam remain the same. Take some time to study areas from the book where you feel
    weak on them. Retaking the exam the same or following day from your first attempt
    is a little aggressive; instead, schedule to retake it within a week, while you
    are still familiar with the content.


    # 640-461 ICOMM 8.0 Exam Topics


    Table I-1 lists the exam topics for the 640-461 ICOMM 8.0 exam. This table also
    lists the book parts in which each exam topic is covered.'
  merge: -1
  img_proc: true
