  md: "# Common CME Management and Troubleshooting Issues\n\nIf it worked right the\
    \ first time every, none of us would have jobs! This chapter discusses how to\
    \ handle questions and troubleshoot Cisco Unified Communication Manager Express\
    \ (CME). The chapter is divided into the three major areas of troubleshooting\
    \ typically encountered on production networks: IP phone registration issues,\
    \ dial-plan issues, and Quality of Service (QoS) issues.\n\n# “Do I Know This\
    \ Already?” Quiz\n\nThe “Do I Know This Already?” quiz allows you to assess whether\
    \ you should read this entire chapter or simply jump to the “Exam Preparation\
    \ Tasks” section for review. If you are in doubt, read the entire chapter. Table\
    \ 15-1 outlines the major headings in this chapter and the corresponding “Do I\
    \ Know This Already?” quiz questions. You can find the answers in Appendix A,\
    \ “Answers Appendix.”\n\nTable 15-1 “Do I Know This Already?” Foundation Topics\
    \ Section-to-Question Mapping\n\n| Foundation Topics Section | Questions Covered\
    \ in This Section |\n|---|---|\n| Troubleshooting | 1–2 |\n| Troubleshooting Common\
    \ CME Registration Issues | 3–7 |\n| Troubleshooting Common Dial-Plan and QoS\
    \ Issues | 8–10 |\n\n+   1. You are planning a structured troubleshooting approach\
    \ for an IP phone registration issue. You just defined the problem; what is your\
    \ next step?\n   a. Consider the possibilities.\n   b. Gather the facts.\n   c.\
    \ Create an action plan.\n   d. Implement an action plan."
