    | 80 | TCP | Connects to services such as Cisco Unified MeetingPlace for meetings,
    or Cisco Unity or Cisco Unity Connection for voicemail features. |

    | | HTTP | |

    | 143 | IMAP (TCP/TLS) | Connects to Cisco Unity or Cisco Unity Connection to
    retrieve and manage the list of voice messages for the user, and the voice messages.
    |

    | 389 | TCP | Connects to the LDAP server for contact searches. |'
  merge: -1
  img_proc: true
