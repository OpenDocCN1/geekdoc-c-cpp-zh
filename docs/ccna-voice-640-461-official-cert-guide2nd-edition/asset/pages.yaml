- pgno: 81
  md: '# Foundation Topics


    # Connecting and Powering Cisco IP Phones


    Before we get to the point of plugging in phones and having happy users placing
    and receiving calls, we must first list the foundational infrastructure of the
    network. This includes technologies such as Power over Ethernet (PoE), voice VLANs,
    and Dynamic Host Configuration Protocol (DHCP). The network diagram shown in Figure
    3-1 represents the placement of these technologies. As you read this, each section
    will act as a building block to reach this goal. The first item that must be in
    place for power for the Cisco IP Phones.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_81_0.png)


    **Figure 3-1** VoIP Network


    Cisco IP Phones connect to switches just like any other network device (such as
    PCs, IP-based printers, and so on). Depending on the model of IP phone you are
    using, it may also have a built-in switch. Figure 3-2 illustrates the connections
    on the back of a Cisco 7960 IP Phone.


    The ports in Figure 3-2 are as follows:


    +   - **RS232**: Connects to a expansion module (such as a 7914, 7915, or 7916)


    +   - **100/10 SW**: Used to connect the IP phone to the network


    +   - **100/10 PC**: Used to connect a co-located PC (or other network device)
    to the IP Phone'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_82_0.png)


    Figure 3-2 Cisco IP Phone Ethernet Connections


    After you physically connect the IP phone to the network, it needs to receive
    power in some way. There are three potential sources of power in a Cisco VoIP
    network:


    +   - Cisco Catalyst Switch PoE (Cisco prestand or 802.3af power)

    - Power Patch Panel PoE (Cisco prestand or 802.3af power)

    - Cisco IP Phone Brick (wall power)


    Let''s dig deeper into each one of these power sources.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Cisco Catalyst Switch PoE


    If you were to create an Ethernet cable (Category 5 or 6), you would find that
    there are eight wires (four pairs of wires) to crimp into an RJ-45 connector on
    each of the connection. Further study reveals that only four of the wires are
    used to transmit data. The other four remain unused and idle...until needed.


    The terms inline power and PoE describe two methods you can use to send electricity
    over the unused Ethernet wires to power a variety of de-vices that can attach
    sollly to an Ethernet cable and receive all the power they need to operate. In
    addition to Cisco IP Phones, other common PoE devices include wireless access
    points and video surveillance equipment.


    Powering devices through an Ethernet cable offers many advantages over using a
    local power supply. You have a centralized point of power distribution. Many users
    experience the phone system to continue to work even if the power is out in the
    company. By using PoE, you can connect the switch powering the IP phones to an
    uninterruptible power supply (UPS) instead of placing a UPS at the location of
    each IP phone. PoE also enables you to power devices that are not conveniently
    located near a power outlet. For example, it is a common practice to mount wireless
    access points in the ceiling, where power is not easily accessible. Finally, PoE
    eliminates much of the "cord clutter" at employees'' desks.


    PoE became an official standard (802.3af) in 2003. However, the IP telefono industry
    was quickly developing long before this. To power the IP phones without an official
    PoE-standard, some proprietary methods were created, one such method being Cisco
    Inline Power.


    > Note: The IEEE standards body has recently created the 802.3at PoE standard
    (also called PoE Plus), the goal of which is to increase the current maximum PoE
    wattage from 15.4W to 25.5W. In addition, some proprietary implementations of
    PoE have reached 51W of power by using all four pairs of wire in the Ethernet
    cable.


    # Powering the IP Phone Using a Power Patch Panel or Coupler


    Many companies already have a significant investment in their switched network.
    To upgrade switches to support PoE would be a significant expense. These organizations
    may choose to insert intermediary devices, such as a patch panel, that are able
    to inject PoE on the line. The physical layout for this design is demonstrated
    in Figure 3-3.


    By using the power patch panel, you still get the advantage of centralized power
    and backup without requiring switch upgrades.


    > Note: Keep in mind that Cisco switches must also provide quality of service
    (QoS) and voice VLAN support capabilities, which may require switch hardware upgrades.
    Be sure your switch supports these features before you consider a power patch
    panel solution.


    Inline PoE injectors provide a low-cost PoE solution for single devices (one device
    per coupler). These are typically used to support wireless access points or other
    "single spot" PoE solutions. Using inline PoE couplers for a large IP Phone network
    would make a mess'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'of your wiring infrastructure and exhaust your supply of electrical outlets
    (because inline PoE coupler requires a dedicated plug).


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_84_0.png)


    Figure 3-3 Design for Power Patch Panels or Inline Couplers


    # Powering the IP Phone with a Power Brick


    Using a power brick to power a device is so simple that it warrants only brief
    mention. Thus, the reason for this section is primarily to mention that most Cisco
    IP Phones do not ship with power supplies. Cisco assumes VoIP network deployments
    support PoE. If you have to choose between purchasing power bricks and upgrading
    your switch infrastructure, it''s wise to check the prices of the power bricks.
    The average Cisco IP Phone brick price is between $30-$40 USD. When pricing out
    a 48-switchport deployment, purchasing power bricks for all the IP phones may
    very well be in the same price range as upgrading the switch infrastructure.


    > Note: Some devices exceed the power capabilities of the 802.3af PoE standard.
    For example, when you add a sidecar module to a Cisco IP Phone (typically to support
    more line buttons), PoE connections can no longer support the device. These devices
    will need a power brick adapter.


    # VLAN Concepts and Configuration


    After the IP phone has received power, it must determine its VLAN assignment.
    Because of security risks associated with having data and voice devices on the
    same network, Cisco recommends isolating IP phones in VLANs to voice devices.
    To understand how to implement this recommendation, let''s review a few key VLAN
    concepts.


    # VLAN Review


    When VLANs were introduced a number of years ago, the concept was so radical and
    beneficial that it was immediately adopted into the industry. Nowadays, it is
    rare to find any reasonably sized network that is not using VLANs in some way.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'VLANs allow you to break up switched environments into multiple broadcast domains.
    Here is the basic summary of a VLAN:


    A VLAN = A Broadcast Domain = An IP Subnet


    There are many benefits to using VLANs in an organization, some of which include
    the following:


    +   * Increased performance: By reducing the size of the broadcast domain, network
    devices run more efficiently.


    +   * Improved manageability: The division of the network into logical groups
    of users, applications, or servers allows you to understand and manage the network
    better.


    +   * Physical topology independence: VLANs allow you to group users regardless
    of their physical location in the campus network. If departments grow or relocate
    to a new area of the network, you can simply change the VLAN on your new ports
    without making any physical network changes.


    +   * Increased security: A VLAN boundary marks the end of a logical subnet. To
    reach other subnets (VLANs), you must pass through a routed (Layer 3) device.
    Any time you send traffic through a router, you have the opportunity to add filtering
    options (such as access lists) and other security measures.


    # VLAN Trunking/Tagging


    VLANs are able to transcend individual switches, as shown in Figure 3-4.


    If a member of VLAN_GRAY sends a broadcast message, it goes to all VLAN GRAY ports
    on both switches. The same holds true for VLAN_WHITE. To accommodate this, the
    connection between the switches must carry traffic for multiple VLANs. This type
    of port is known as a trunk port.


    Trunk ports are often called tagged ports because the switches send frames between
    each other with a VLAN "tag" in place. Figure 3-5 illustrates the following process:


    +   1. HostA (in VLAN_GRAY) wants to send data to HostD(also in VLAN_GRAY), HostA
    transmits the data to SwitchA.


    +   2. SwitchA receives the data and realizes that HostD is available through
    the FastEthernet-0/24 port (because HostD''s MAC address has been learned on this
    port). Because FastEthernet0/24 is configured as a trunk port, SwitchA puts the
    VLAN_GRAY tag in the IP header and sends the frame to SwitchB.


    +   3. SwitchB processes the VLAN_GRAY tag because the FastEthernet 0/24 port
    is configured as a trunk. Before sending the frame to HostD, the VLAN_GRAY tag
    is removed from the frame.


    +   4. The tagless frame is sent to HostD.'
  merge: -1
  img_proc: true
