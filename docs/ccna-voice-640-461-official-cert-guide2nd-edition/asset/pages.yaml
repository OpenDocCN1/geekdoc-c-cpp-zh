    The configuration in Example 7-11 defines weekdays, from 5:00 p.m. to 8:00 a.m.
    the next day, as after-hours, with the entire on dec 25 (Christmas) and January
    1 (New Year''s Day).


    In the next step of the after-hours configuration, you define the patterns that
    CME block during the after hours you have configured (see Example 7-12).


    > Note: Chapters 8 and 9 discuss the patterns you can use for matching fully.
    For now, examples in this chapter use the \*, wildcard, which matches any digit
    dialed, and the "T" wildcard, which matches any number of digits.


    # Example 7-12 Configuring After-Hours Block Patterns


    ```

    CME_Voice(config)# telephony-service

    CM_Voice(config-telephony)# after-hours block ?npattern block pattern

    CME_Voice(config-telephony)# after-hours block pattern ?n<1-32> index of patterns

    CME_Voice(config-telephony)# after-hours block pattern 1 ?nWORD digits string
    for after hour pattern

    CM_Voice(config-telephony)# after-hours block pattern 1 91...

    CM_Voice(config-telephony)# after-hours block pattern 2 98011T

    CM_Voice(config-telephony)# after-hours block pattern 3 91900..... ?

    ```


