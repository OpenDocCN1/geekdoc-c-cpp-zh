    # Configuring VoIP Dial Peers


    In the scenario shown in Figure 6-7, the POTS dial peers provide connectivity
    to the legacy voice equipment. However, CME_A and ROUTER_B are divided by an IP
    WAN connection that the legacy voice equipment must cross to achieve end-to-end
    communication.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_153_0.png)


    **Figure 6-7** Dial Peer Configuration Scenario


    To accomplish this connectivity, you must use VoIP dial peers, because the call
    is crossing an IP-based network. Example 6-11 configures the necessary VoIP dial
    peers on CME_A and ROUTER_B devices.


    # Example 6-11 Configuring VoIP Dial Peers


