- pgno: 394
  md: '+   Pager/Phone Settings: Sets the Phone Number CUC should call. Modify the
    extra settings to edit digits, wait times, and so on to ensure the call completes
    correctly. All these settings should be applied to the individual user account
    rather than at the template.


    # Configure CUC End Users


    Adding users to CUC can be done manually (one at a time), via import from CUCM
    or LDAP, or by using the Bulk Administration Tool (BAT). In each case, the goal
    is to provide individually information per user to complete the common information
    provided by the different User Templates previously configured.


    In the following sections, some possible configuration steps have been omitted
    in the interest of relevancy to ICOMM.


    # Manual Process


    To manually create a new user, navigate to *Users > Users* and create a new user.
    Select the appropriate *User Type* (typically User with Mailbox) and select or
    enter the following:


    +   1. From the Based on Template drop-down, select the appropriate User Template
    for this user to supply the common configurations.


    +   2. Add the *Alias* (which must be unique), *First Name, Last Name,* and *Display
    Name.


    +   3. Choose the appropriate Mailbox Store, if there is more than one in use.


    +   4. Add the *Extension* of the user, which is typically the primary DN associated
    with its IP phone.


    +   5. Click Save.


    Figure 13-11 shows part of the User Configuration Basics page.


    # Alternate Extensions and Names


    An Alternate Extension can be provided to users to allow them to call in CUC from
    a number other than their primary Extension and gain access to their mailbox without
    going through the Opening Greeting. The following steps outline the configuration
    of Alternate Extensions:


    +   1. In the User Configuration page


    +   2. Set the *Type of Phone* from the drop-down (Work, Home, Mobile).


    +   3. Provide a *Display Name*.


    +   4. Set the correct *Phone Number*. This is the Caller ID (ANI) number of the
    phone as it will appear to CUC; typically, this is the full PSTN number, but be
    aware of the possibility that CUCM may be stripping or modifying digits before
    they are sent to CUC.


    Figure 13-12 shows the Alternate Extension page.


    +   5. From the *Edit menu*, select Alternate Names.'
  merge: -1
