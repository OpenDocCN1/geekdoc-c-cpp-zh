- pgno: 409
  md: '# Foundation Topics


    # Describe Cisco Unified Presence Features


    Cisco Unified Presence Server (CUPS) extends the basic Presence capability of
    Cisco Unified Communications Manager (CUCM) (on-hook, off-hook, or unknown) to
    include advanced capability and availability signaling. The availability and capability
    of colleagues and business partners to communicate (Available, Busy, and Away
    for various devices) is immediately visible and can be additionally enhanced using
    their calendar status. Enterprise Instant Messaging (IM) capability is available
    both within and beyond the enterprise to external contacts, including Group Chat,
    Persistent Chat, and compliance features, such as IM logging and IM history.


    The primary goal of CUPS is to reduce communication delays by providing instant
    and useful information about the capability and availability of contact. Users
    can indicate whether they are available, and by methods, including desk phone,
    mobile phone, or conferencing application. This signaling capability can be extended
    to applications to allow contact with the right individual to be quickly established.
    This helps resolve support or customer issues more quickly, eliminating phone
    tag and the delays associated with e-mails.


    CUPS is tightly integrated with CUCM, which provides central control and Native
    signaling (on-/off-hook status). CUPS provides a central collection point for
    user capabilities and status by way of standards-based signaling using Session
    Initiation Protocol (SIP), SIP for Instant Messaging and Presence Leveraging Extensions
    (SIMPLE), and Extensible Messaging and Presence Protocol (XMPP). A variety of
    client interfaces are available, including Cisco Unified Personal Communicator
    (CUPC), which provides a rich and tightly integrated user experience.


    # Cisco Unified Personal Communicator


    CUPS provides a single interface for the most commonly used Cisco Unified Communicator
    tools. From the CUPS application, users can initiate voice calls (either through
    deskphone or softphone mode). Contacts are listed with their enhanced Presence
    status, providing click-to-communicate functionality by phone call, video call,
    chat, group, chat, and collaboration interaction with a simple interface to transition
    from one medium to another. Chat is enabled using the Jabber Extensible Communications
    Platform (XCP) using XMPP as the chat protocol.


    # CUPC Operating Modes


    CUPC operates in two modes:


    +   - Desktop phone mode: CUPS can control the user''s desk phone to place calls.
    The IP phone must be registered with CUCM and associated with the user. CUPS uses
    Computer Telephone Integration Quick Buffer Encoding (CTIQBE) for IP phone control.
    Figure 14-1 illustrates the protocol interaction when CUPS is in desktop mode.'
  merge: -1
  img_proc: true
- pgno: 410
  md: "![](img/e4ad7862dc47b4e5de0cde3b4550ad65_410_0.png)\n\n# Figure 14-1 CUPC in\
    \ Deskphone Mode\n\n+   - Softphone mode: When the IP phone is not available or\
