    \ dial-control-mib max-size 700\n\n![](img/e4ad7862dc47b4e5de0cde3b4550ad65_233_0.png)\n\
    \n**Figure 7-20** Configuring After-Hours Restrictions Using CCP\n\nExample 7-14\
