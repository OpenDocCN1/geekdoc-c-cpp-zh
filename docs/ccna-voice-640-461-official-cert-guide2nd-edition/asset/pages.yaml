- pgno: 7
  md: '# About the Authors


    Jeremy D. Cioara, CCIE 11727, works in many facets of the Cisco networking realm.
    As an author, he has written multiple books for Cisco Press and Exam Cram. As
    an instructor, he teaches at Interface Technical Training (www.interfacet.com)
    in Phoenix, Arizona. Likewise, Jeremy has recorded many CBTs at CBTNuggets (www.cbtnuggets.com).
    Finally, Jeremy is the CIO of ADTEC Networks and works as a consultant, focusing
    on Cisco network and VoIP implementations. Jeremy also casually blogs about Cisco
    topics at Tekert (www.tekert.com) in his “free time.” Thankfully, he is married
    to the Certified Best Wife in the World (CBWW), who helps him manage his time
    and priorities and prevents him from getting an enormous Cisco logo tattooed across
    his chest.


    Michael Valentine has 15 years of experience in the IT field, specializing in
    network design and installation. Currently, he is a Cisco trainer with Skyline
    Advanced Technology Services and specializes in Cisco Unified Communications,
    CCNA, and CCNP classes. His accessible, humorous, and effective teaching style
    has demystified Cisco for hundreds of students since he began teaching in 2002.
    Mike holds a Bachelor of Arts degree from the University of British Columbia and
    currently holds CCNA, CGDA, CCNP, CCVP, and CCSI No. 31461 certifications. Mike
    has developed courseware and labs for Cisco and his training partners. Mike is
    the coauthor of CCNA Exam Cram (Exam 640-802), Third Edition (Que 2008), authored
    the CCNA Voice Quick Reference Guide, and has served as technical editor and contributor
    on several Cisco Press titles.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Technical Reviewers


    Brion Washington, CCNA, is a senior voice engineer consultant in Atlanta, GA.
    He has more than ten years of Cisco experience, with the last five years dedicated
    to VoIP; he has worked with all the Cisco VoIP products. Brion has done large
    projects involving VoIP, from complete network design, implementation, and the
    last level of escalation. He is currently finishing up his CCVP.


    John Swartz, CCIE No. 4426, is the founder of Boson Software and training, 3DSNMP,
    Purple Penguin and Inner Four. Currently focused on cloud technologies using the
    VBLOCK Infrastructure Platform by VCE.


    He is also focused on mobile technology his company has published over 500 apps
    for the iPhone. John created the original Cisco Press CCNA simulator, the Boson
    Netsim, and numerous practice tests. He has been a Cisco instructor for 12 years,
    starting with basic courses and now teaching Unified Computing, Nexus switching
    and other data center technology. John lives in Florida with his wife and three
    kids.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Dedication


    From Jeremy D. Cioara:


    This book is dedicated to you. Yes...the person reading this right now. No, I''m
    not being cheesy, I''m serious! The only real way people are truly successful
    and fulfilled in their career is to love what they''re doing. Because of that,
    I put much effort (within grammatical boundaries) into not just communicating
    technical mumbo jumbo—hey! Microsoft Word didn''t correct that! Who knew “mumbo
    jumbo” was a real word?—but making it fun and interesting to read. I hope this
    book sparks something in you that blooms into an interesting, fun, and fulfilling
    career.


    (In case you''re curious, dictionary.com defines “mumbo jumbo” as senseless or
    pretentious language, usually designed to obscure an issue, confuse a listener,
    or like. It also says that mumbo jumbo is a masked man who combats evil in the
    western Sudan. I don''t think either of these was my intention...)


    From Mike Valentine:


    This book is dedicated to my wife Liana, without unflinching support, it might
    never have happened. You and me, love.


    In memory of my Dad.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Acknowledgments


    Jeremy D. Cioara: When you see a movie, ever how the credits roll for about 5
    minutes with hundreds of names? It''s the same with this book. There are probably
    hun-dred of names you never see that had some part in making this book possible.
    My thanks goes to all of them!


    Personally, I give thanks to Jesus Christ who is...well, everything! Without Christ,
    my world of color quickly fades to a dull, boring grey. To my wife, who tirelessly
    homeschools our three kiddos and puts up with my countless Matrix analogies to
    explain anything the sun. Finally, thanks to Interface Technical Training (www.interfacet.com),
    CBTNuggets (www.cbtnuggets.com), and Pearson (www.pearson.com) for allowing me
    to communicate my love for all things networking to people everywhere.


    Mike Valentine: In forgetting someone, let me try to list all the people who helped
    make this book happen:


    Brett Bartow: For asking, answering, and adapting. Thank you, sir.


    Jeremy Cioara: For trusting me and all the hard stuff..kidding, man.


    Dayna, Ginny, Chris, and all the unknown soldiers at Cisco Press: They tempered,
    refined, redrew, and otherwise helped create what you are holding. Professionals,
    all; I salute them.


    Toby Sauer, Dave Schulz, and Dave Bateman: My colleagues at Skyline, and most
    impor-tantly, my good friends; for their opinions, their commiseration and support,
    and for mak-ing me a better instructor and author. Thank you, my friends. (Please
    go buy their books, too; you will not regret it.)


    Andy de Maria: Thank you for your empathy, flexibility, and your trust.


    Ed Misely: A good friend and terrifyingly capable technical resource, for his
    assistance with my labs.


    My family: Thank you so much for your support, patience, your love, and your belief
    in me.


    The readers and posters on the Cisco Learning Community: For your early input
    and sup-port. Here it is, finally, I sincerely hope you enjoy it.'
  merge: -1
  img_proc: true
