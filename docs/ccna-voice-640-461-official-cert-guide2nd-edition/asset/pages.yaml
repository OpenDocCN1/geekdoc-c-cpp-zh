  md: '# # Understanding the Cisco IP Phone Concepts and Registration


    You walk into the new corporate headquarters for Fizzmo Corp. On the top of each
    desk is a Cisco 7945G IP Phone, glowing with a full-color display and two line
    instances. Courteous agents are busy taking phone calls from callers excited to
