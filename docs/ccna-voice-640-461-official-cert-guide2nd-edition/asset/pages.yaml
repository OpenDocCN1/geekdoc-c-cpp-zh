    Notice the highlighted output from the debug command in Example 6-9. This shows
    the router performing digit-by-digit call processing. As the phone dials each
    digit, the router processes each digit and attempts to find a match among its
    dial peer configuration. For the first three dialed digits, the result is: more
    digits needed. After the caller dials the fourth digit, the router matches dial-peer
    tag t1101 and processes the call.


    Now, we turn our attention to the POTS dial peer configuration on ROUTER B, which
    has a T1 PRI connection to a PBX system hosting XXXXX extensions (four-digit extensions
    beginning with the number 2). In the earlier section, “Configuring Voice Ports,”
    the physical characteristics of the T VWIC interface were configured to support
    T1 PRI connectivity (by the pri-group command). When this command was entered,
    the router automatically created the voice port 1/0/23, representing the signaling
    channel of the T1 PRI connection. Example 6-10 now connects the router to use
    this T1 PRI port anytime it receives a call for a XXXXX extension.


    # Example 6-10 Configuring a POTS Dial Peer for a T1 Interface


    ```

    ROUTER_B(config)# dial-peer 2000 pots

    ROUTER_B(config-dial-peer)# destination-pattern 2...

    ROUTER_B(config-dial-peer)# no digit-strip

    ROUTER_B(config-dial-peer)# port 1/0:23

    ```


    It''s simple. Notice that you can use the “.” wildcard to represent any dialed
    digit. This instructs the router to send all XXXXX extensions out port 1/0/23
    (the T1 PRI interface). One additional command in this example brings a big point
    of discussion: no digit-strip. This command prevents the router from automatically
    stripping dialed digits from this dial peer. Why would the router do that? Because
    of the POTS dial peer rule programmed into Cisco IOS. Here''s the:


    Digit-Stripping Rule of POTS Dial Peers:

    The router automatically strips any explicitly defined digit from a POTS dial
    before forwarding the call.


    An explicitly defined digit is any non-wildcard digit. In the case of Example
    6-10


