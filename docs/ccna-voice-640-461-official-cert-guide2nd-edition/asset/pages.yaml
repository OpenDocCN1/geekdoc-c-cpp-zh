- pgno: 29
  md: '+   Chapter 2, “Understanding the Pieces of Cisco Unified Communications,”
    This chapter primarily focuses on the components of a Cisco VoIP network. By breaking
    down the voice infrastructure into four distinct areas, each component can be
    categorized and organized. These components include endpoints, processing agents,
    applications, and network infrastructure devices.


    +   Chapter 3, “Understanding the Cisco IP Phone Concepts and Registration,” This
    chapter discusses the preparation and base configuration of the LAN infrastructure
    to support VoIP. These preparations include support for Power over Ethernet (PoE),
    voice VLANs, a properly configured DHCP scope for VoIP devices, and the Network
    Time Protocol (NTP).


    +   Chapter 4, “Getting Familiar with CME Administration.” This chapter familiarizes
    you with Cisco Unified Communication Manager Express (CME) administration by unpacking
    the primary interfaces of CME: command-line and the Cisco Configuration Professional
    (CCP) GUI.


    +   Chapter 5, “Managing Endpoint and End Users with CME.” This chapter focuses
    on the process to create and assign directory numbers (DN) and user accounts to
    Cisco IP Phones. The chapter walks through these configurations in both the command-line
    and CCP interfaces.


    +   Chapter 6, “Understanding the CMF Dial-Plan.” Now that the VoIP network is
    operational through the CME configuration, this chapter examines connections to
    the outside world through the PSTN or an IP network. Concepts covered in this
    chapter include the configuration of voice port characteristics, dial peers, digit
    manipulation, class of restriction (COR), and quality of service (QoS).


    +   Chapter 7, “Configuring Cisco CME Voice Productivity Features.” This chapter
    examines feature after feature supported by the CME router. By the time you''re
    done with this chapter, you''ll understand how to configure features such as intercom,
    call Park and pickup, and many others.


    +   Chapter 8, “Administrator and End-User Interfaces.” This chapter introduces
    the administrative interfaces for CUCM, CUC, and CUP. From the administrative
    GUI for each application to the common Unified Serviceability interface, disaster
    recovery and CLI, the fundamentals of navigation and configuration are laid out
    in a clear and logical sequence.


    +   Chapter 9, “Managing Endpoints and End Users in CUCM.” The configuration and
    management of users and phones is covered in this chapter, including integration
    with LDAP.


    +   Chapter 10, “Understanding CUCM Dial-Plan Elements and Interactions.” The
    guts of the call-routing system in CUCM are explained with simplicity and clarity.
    Call flows in different deployments and under different conditions of use and
    failure (including CAC and AAR) are demonstrated and compared, and the great mystery
    of partitions and calling search spaces (CSS) is revealed for the simple truth
    it really is.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   Chapter 11, “Enabling Telephony Features with CUCM.” A small but excellent
    sample of the billions* (*approximately*) of features available in CUCM, including
    Extension Mobility and call coverage.


    +   Chapter 12, “Enabling Mobility Features in CUCM.” A step-by-step guide to
    enabling some of the most popular and powerful features in CUCM: Mobile Connect
