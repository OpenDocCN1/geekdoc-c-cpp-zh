- pgno: 146
  md: 'When configuring a CCS connection, the first step is to set the ISDN switch
    type to match the type of switch your local service provider is using. Example
    6-6 sets to this primary sessions. After you configure the switch type, the router
    allows you to enter the pri-group command. This works identically to the dso-group
    command in that it allows you to provision a specific number of time slots for
    use with the PSTN carrier. This command does not you to select a signaling type
    because the router assumes ISDN PRI signaling.


    **Note:** This example assumes you have enough Digital Signal Processor (DSP)
    resources to support a full PRI connection. If your router does not have enough
    DSPs, it displays an error message when you try to use the pri-group command.
    The error message says exactly how many channels the router can support.


    After you enter the pri-group command, the router creates 24 ISDN voice ports
    that it will use for incoming and outgoing voice calls. This is verified with
    the show port summary command. Notice that the voice port is labeled with the
    identifier 1/0:23. This represents 23 (time slot 24) of the T1 ISDN PRI connection
    (channels are listed from 0–23, whereas time slots are listed 1–24, which is the
    dedicated signaling channel used to bring up the other 23 voice bearer channels.


    > **Note:** When using T1 interfaces, channel 23 (time slot 24) is always the
    signaling channel. When using E1 interfaces, channel 16 (time slot 17) is always
    the signaling channel.


    As before, make a note of this port identifier for the ISDN circuit. The router
    requires you to identify this interface when configuring your dial peers.


    # Understanding and Configuring Dial Peers


    When you initially entered the Cisco world, you probably learned about the concept
    of static routing. This method of routing allows you to manually enter destinations
    the router is able to reach on the data network. Dial peers use a similar concept
    to this; think of dial peers as static routes for your voice network. By default,
    the CME router only knows how to reach the iphone-dns you configure for the Cisco
    IP phones. You can connect the CME router to any number of FXS, FXO, or digital
    T1/E1 connections, but until you create dial peers for these connections, the
    router will not use them.


    Dial peers define voice reachability information. Simply put, these are the phone
    numbers you can dial. For example, you might connect an analog phone to the FXS
    port of the router. As soon as you make the connection, the analog phone receives
    a dial tone and is able to place calls. However, no one will be able to call the
    analog phone because it does'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'not yet have a phone number. Using a dial peer, you can assign one or more
    phone numbers to this analog device. Furthermore, dial peers allow you to use
    wildcards to define ranges of phone numbers. This is useful when you want to define
    large groups of numbers available from a destination such as a PBX system or PSTN
    connection.


    You can create two types of dial peers:


    +   - Plain Old Telephone Service (POTS) dial peer: Defines voice reachability
    information for any traditional voice connection (that is, any device connected
    to an FXS, FXO, E&M, or digital voice port).

    - VoIP over IP (VoIP) dial peer: Defines voice reachability information for any
    VoIP connection (that is, any device that is reachable through an IP address).


    Figure 6-4 illustrates the placement of POTS and VoIP dial peers in a network.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_147_0.png)


    Figure 6-4 POTS and VoIP Dial Peers'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Voice Call Legs


    To accurately configure dial peers, you must first understand the concept of call
    legs. A call leg represents a connection to or from a voice gateway from POTS
    or VoIP source. Figure 6-5 illustrates an example voice connection scenario.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_148_0.png)


    **Figure 6-5** Voice Connection Legs


    As illustrated in Figure 6-5, the phone on the left (extension 1101) makes a call
    to the phone (extension 2510). For this call to pass through successfully, four
    call legs must exist:


    +   * **Call leg 1:** The incoming POTS call leg from x1101 to CME_A.

    * **Call leg 2:** The outgoing VoIP call leg from CME_A to ROUTER_B.

    * **Call leg 3:** The incoming VoIP call leg to ROUTER_B from CME_A.

    * **Call leg 4:** The outgoing POTS call leg to x2510 from ROUTER_B.


    If the call was placed in the opposite direction (from x2510 to x1101), the same
    number of call legs would be needed, in reverse. Thus, to provide a two-way communication
    that enables x1101 to call x2510 and vice versa, you need a total of eight call
    legs.


    It is critical to understand the concept of call legs to properly configure the
    dial peers on your router. Each call leg identified in Figure 6-5 represents a
    dial peer that must exist on your router. Your dial peers define not only the
    reachability information (phone numbers) for the devices, but also the path audio
    travel. CME_A''s perspective, it receives audio and pass information over the
    IP network to 10.1.1.2 (call leg 2). ROUTER_B''s perspective, it receives a call
    from x1101 on the IP WAN network (call leg 3). It must then take that call and
    pass it to the PBX using the digital T1 1/0 interface (call leg 4).


    As you can see from Figure 6-5, call legs are matched on the inbound and outbound
    directions. In the same way, you must configure dial peers to match voice traffic
    in both directions. In some cases, you can use a single dial peer for bidirectional
    traffic. For example, creating a single POTS dial peer for x1101 will match incoming
    and outgoing calls to x1101. At other times, you create more than one dial peer
    for inbound and outbound traffic. For example, CME_A requires an outbound VoIP
    dial peer to send the call to ROUTER_B, ROUTER_B needs an inbound VoIP dial peer
    to receive the call from CME_A. As you see the multiple examples of dial peers
    in the upcoming sections, these concepts become clearer.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'Note: Keep in mind, the engine behind all this is the DSP resources in the
    CME router. These workhorses convert the analog audio to digital (VoIP packets)
    and vice versa. If the CME routers did not have any DSP resources, this conversion
    would not be possible.


    # Configuring POTS Dial Peers


    As previously mentioned, you can use POTS dial peers to define reachability information
    for anything connected to your VoIP network from the traditional telephony world.
    This includes devices connected to FXO, FXS, E&M, and digital BRI/T1/E1 interfaces.


    Tip: If you are connecting to something that not have an IP address (such as an
    analog phone, fax machine, PBX, or the PSTN), it is a POTS dial peer.


    The network in Figure 6-6 demonstrates the configuration of POTS dial peers.


    # Figure 6-6 Dial Peer Configuration Scenario


    The configuration begins with the CME_A router. To create POTS dial peers, you
    can use the syntax dial-peer voice <tag> from global configuration mode. The tag
    value can be any number you want (from 1 to 2,147,483,647), as long as it is unique
    on the router. Although this tag does not have any impact on the reachability
    information you assign to the devices, many administrators have a common practice
    of relating a dial peer tag to the phone number of the device. Example 6-7 explains
    the extensions shown in Figure 6-6 to the analog phones attached to the CME_A
    router''s FXS ports.


    # Example 6-7 Configuring POTS Dial Peers for FXS Ports


    ```

    CME_A(config)# dial-peer voice ?

    <1-2147483647> Voice dial-peer tag

    CME_A(config)# dial-peer voice 1101 ?

    mmoip Multi Media Over IP

    npots Telephony

    ```'
