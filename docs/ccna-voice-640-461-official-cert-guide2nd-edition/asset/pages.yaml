    # Understanding Router Call Processing and Digit Manipulation


    Understanding how the router processes dialed digits is critical to accurately
    implement dial peers. There are two primary rules to guide you in your dial peer
    strategy:


    +   - The most specific destination pattern always wins.

    - When a match is found, the router immediately processes the call.


    This section presents examples of these rules in action. Example 6-15 shows the
    dial peers for the router.


