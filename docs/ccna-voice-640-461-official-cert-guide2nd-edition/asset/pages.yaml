- pgno: 375
  md: '# Foundation Topics


    # Describe Unity Connection (CUC)


    Cisco Unity Connection (CUC) is a full-featured voice-messaging and voice-recognition
    system, providing universal access to calls and messages as part of a Unified
    Communications solution. Up to 20,000 users can be hosted by a single CUCMv8.x
    server (assuming the most powerful hardware platform). Voice recognition capabilities
    allow speech-activated commands to be used by both internal and external callers.
    A built-in IMAP server allows e-mail access to voice messages, and a clientless,
    web-based interface provides the same capability from any compatible browser with
    web access to the CUC server. The following sections discuss CUC.


    # Overview of Cisco Unity Connection


    CUC is one of the five Cisco Unified Communication products currently offered
    as a Linux appliance. (The others are Cisco Unified Communications Manager [CUCM],
    Cisco Unified Presence [CUP], Cisco Unified Emergency Responder, and Unified Center
    Express.) The data and message database stores are held locally on the server,
    both using an instance of the Informatix Database Service application, just as
    the other Communications applications do.


    CUC supports integration with a variety of traditional PBX systems that support
    either native IP functionality or a digital TDM circuit that can be connected
    via PBX or T1 IP Media Gateway (PBX IP Media Gateway [PIMG] or T1 IP Media Gateway
    [TIMG]). CUC users can be manually configured, bulk imported from a Comma-Separated
    Values (CSV) file, imported from a CUCM server database, or synchronized directly
    from a Lightweight Directory Access Protocol (LDAP) system. Password authentication
    can be redirected to the LDAP server for single sign-on functionality.


    CUC can integrate with a Microsoft Exchange server, using Web-Based Distributed
    Authoring and Versioning (WebDAV) to provide calendar and journal information
    for integration with Cisco Unified MeetingPlace and Cisco Unified MeetingPlace
    Express, Microsoft Exchange 2003, and personal call routing rules within CUC itself.
    Calendar integration services for Microsoft Exchange 2007 are handled using the
    web service''s programming interface (API).


    CUC provides a traditional Telephone User Interface (TUI) for interaction over
    Dual-Tone Multi-Frequency (DTMF) phones, a Voice User Interface (VUI) for hands-free
    interaction, and the IP phone service-based View Express screen to see voice-message
    headers on the phone screen or in the Cisco Unified Personal Communicator.


    # Single-Site and Multisite Deployment Considerations


    The simplest deployment of the CUC application is a single-site model, with one
    building or campus accessing a single CUC server (or active-active redundant pair).
    The advantages of design simplicity, a single codec for all calls, and a greatly
    reduced implementation task list make this an attractive option.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'If there are multiple locations (or will be in the future), a multi-site deployment
    may be a better choice; although users can call across the WAN to check or leave
    voicemail messages (or use other features) in a single-site deployment, doing
    so can put a significant load on WAN bandwidth and transcoder resources. This
    is especially true as the number of users in the system increase. Locating additional
    servers in branch locations can greatly reduce the impact of these problems while
    providing the same functionality as a single-site model.


    # CUC Integration Overview


    Integration in this context refers to interoperation with a PBX- or IP-based telephone
    system. CUC supports a variety of integrations using SCCP, SIP, or PIMG/TIMG.
    Multiple phone systems are supported concurrently; CUCM and CME can be supported
    using SCCP or SIP, and a SIP-capable PBX will integrate using SIP, and a variety
    of digital PBX products can be supported using a PIMG or TIMG device that converts
    a digital TDM circuit to a SIP trunk.


    # CUC Integration with CUCM Using SCCP


    A Voicemail Wizard is available in CUCM 8.x that simplifies the integration of
    CUC with CUCM. The wizard requests user input to correctly set up the system,
    and then generates voicemail ports in CUCM and adds them to a Line Group. The
    administrator must manually configure the Hunt List and Hunt Pilot to support
    the Line Group.


    The Hunt Pilot is referenced by a Voicemail Pilot, which is itself referenced
    by a Voicemail Profile. Figure 13-1 illustrates the architecture of the voicemail
    integration on the CUCM side.


    > Key Topic


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_376_0.png)


    Figure 13-1 SCCP Voicemail Integration Components in CUCM'
