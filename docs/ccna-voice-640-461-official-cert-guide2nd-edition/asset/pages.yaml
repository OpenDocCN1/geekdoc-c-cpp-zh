    and preferences, the router will randomly choose a dial peer to use.


    Looking at the Arizona router in Example 6-17, you can see that dial peer 10 is
    the more preferred path to the Texas router. Because the connection uses VoIP
    dial peers, no automatic digit stripping occurs and no digit-manipulation commands
    are required. (Keep in mind that the digit-strip, forward-digits, and prefix commands
    are only valid under POTS dial peers anyhow.)


    If the IP connection between Arizona and Texas fails, the Arizona router begins
    using the next most preferred dial peer, which is dial peer 11. To overcome the
    automatic digit-stripping feature of POTS dial peers, the no digit-strip command
    is used. (Otherwise, the router would strip the 6 digit from the dialed number.)
    The prefix 1512555 command adds the necessary prefix information to get the call
    across the PSTN.


    Note: If the IP WAN fails, all the active calls established during the WAN failure
    will disconnect and be required to redial. There is no "dynamic failover" mechanism
    for calls already established.


    # Practical Scenario 2: Directing Operator Calls to the Receptionist


    This practical scenario is fairly simple. The organization shown in Figure 6-13
    wants to direct all calls to the operator number 0 to the receptionist at extension
    5000.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_167_0.png)


    Figure 6-13 Redirecting Operator Calls


    Because this is a "universal" transformation (you always want to change the dialed
    number from 0 to 5000), you can accomplish this objective using the num-exp global
    configuration command, which is shown in Example 6-18.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Example 6-18 Transforming Dialed Numbers Using num-exp


    ```

    Voice_RTR(config)# voice-port 1/0/1

    Voice_RTR(config-voiceport)# connection plar 0

    Voice_RTR(config-voiceport)# exit

    Voice_RTR(config)# num-exp 0 5000

    ```


    Now, anytime the number 0 is dialed from anywhere in the organization (could be
    an IP phone, FXS port, and so on), the voice router automatically transforms it
    to 5000 and then searches for a dial peer allowing it to reach the number 5000.


    Note: The router applies the num-exp command the instant it receives a dialed
    number, even before it attempts to match an inbound dial.


    # Practical Scenario 3: Specific POTS Lines for Emergency Calls


    As organizations move more to VoIP connections, they are finding cost-saving benefits
    by eliminating traditional telephony connections at remote offices in favor of
    centralizing all PSTN calls (and toll charges) at a central site. Figure 6-14
    illustrates this type of net-work design.


    This type of call allows an organization to get higher call volume from a single
    location, which typically allows the organization to negotiate cheaper long-distance
    routes with its PSTN carrier.


    Note: Some countries restrict businesses from forwarding PSTN calls over the IP
    WAN. You should always check with the local government regulations before you
    do this. Frankly, the United States is not one of those countries.


    Although the centralization of PSTN calls offers significant cost savings, the
    remote sites need to keep at least one local PSTN connection for emergency calling.
    This is because PSTN carriers provide location information to emergency service
    providers based on the PSTN connection. If emergency calls from the remote offices
    were to traverse the IP WAN and leave the PSTN connection at the central site,
    the emergency service provider would receive location information for the central
    site.


    Depending on the size of the remote office, you can typically dedicate one or
    two analog FXO ports for emergency calls. The configuration in Example 6-19 configures
    the necessary dial peers for dual FXO ports connected to the PSTN. This assumes
    the FXO ports are 1/0/0 and 1/0/1.


    # Example 6-19 Dynamic WAN to PSTN Failover Implementation


    ```

    REMOTE_RTR(config)# dial-peer voice 10 pots

    REMOTE_RTR(config-dial-peer)# destination-pattern 911

    REMOTE_RTR(config-dial-peer)# port 1/0/0

    REMOTE_RTR(config-dial-peer)# no digit-strip

    REMOTE_RTR(config-dial-peer)# exit

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: '```

    REMOTE_RTR(config)# dial-peer voice 11 pots

    REMOTE_RTR(config-dial-peer#) destination-pattern 9911

    REMOTE_RTR(config-dial-peer#) port 1/0/0

    REMOTE_RTR(config-dial-peer#) forward-digits 3

    REMOTE_RTR(config-dial-peer#) exit

    REMOTE_RTR(config)# dial-peer voice 12 pots

