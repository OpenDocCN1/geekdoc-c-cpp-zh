- pgno: 411
  md: 'routed to all the non-negative priority devices the user is logged into, instead
    of routing only to the highest-priority device (Non-negative means devices that
    are not explicitly blocked from receiving messages). CUPS delivers messages to
    all the logged-in devices for a user (this behavior is called IM Forking). When
    the user replies on a particular device, subsequent messages are sent only to
    the device used for the reply. Backward compatibility for SIP-only Presence clients
    (such as CUPC 7x) is provided via an IM gateway.


    # Voice Calls


    CUPSC supports voice calls in deskphone mode or softphone mode. Voice encryption
    using Real-Time Protocol (SRP) is supported. Survivable Remote Telephony (SRST)
    is supported in softphone mode with appropriate CUCM/CSF configuration. CUPC supports
    the following codecs in softphone mode:


    +   - G.711 a-law, mu-law

    - G.722 Wideband

    - G.729A, G.729B

    - iIBC (Internet Low Bandwidth Codec)

    - iASAC (Internet Speech Audio Codec)


    CDEC support in deskphone mode depends on the IP phone model.


    # Voice Calls


    CUPSC supports voice calling in either deskphone or softphone mode. In deskphone
    mode, CUPSC uses Cisco Audio Session Tunnel (CAST) and Cisco Discovery Protocol
    (CDP) for communication between the IP phone and the computer running CUPC. The
    desk phone must be enabled for voice support in CUCM. SIP desk phones are not
    supported by CAST.


    In softphone mode, CUPSC uses the CSF device configured on CUCM for video calls.
    CSF devices are video-enabled by default.


    Video conferencing is supported, using a video-conference bridge accessible by
    the Media Resource Group List (MRGL) assigned to the IP phone or CSF device.


    # Integration Support


    CUPSC can integrate with many Cisco Unified Communications applications, providing
    a wide range of rich features. CUPC can provide visual voicemail when integrated
    with Cisco Unity or Unity Connection. Users can control their mailboxes and listen
    to, send, and delete messages using CUPC.


    Click-to-call functionality is supported by CUPC and other applications, such
    as Microsoft Outlook, Word, and Excel. Presence indicators for contacts can also
    be viewed in Outlook. If Cisco Unified MeetingPlace is integrated in the system,
    a call in CUPC can be easily escalated to a conference.'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Cisco System Requirements


    Refer to the Cisco documentation at www.cisco.com/en/US/products/ps6844/index.html
    for current system requirements for Windows and Macintosh operating systems (OS).


    # Cisco Unified Client Services Framework


    The Cisco Unified Client Services Framework (CSF) provides the foundation of all
    Unified Communications client software. It is part of CUPC, but it also extends
    the functionality of Microsoft Outlook and WebEx Connect. The core functionality
    of CSF is video and video, secure communication with text (IM) servers such as
    CUPC, CSF with CUCM, provides audio and video call control and advanced features,
    such as voicemail support.


    Only one CSF can be installed at one time on a client PC; for example, CUPC and
    Cisco Unified Communications Integration for Microsoft Office Communicator cannot
    co-reside on the same client computer.


    # Cisco Unified Communications Manager IP Phone Service


    The Cisco Unified Communications Manager IP Phone (CCMCIP) Service was originally
    used to provide authentication, directory services, and help for end users. It
    has been adapted for use by CUPC and CSF clients to retrieve a list of devices
    on which the user can be reached when they log in. Figure 14-3 illustrates CUPC''s
    use of the CCMCIP service.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_412_0.png)


    Figure 14-3 CCMCIP Interaction


    # Cisco IP Phone Messenger


    Cisco IP Phone Messenger (IPPM) is an IP phone service that allows a user to build
    a contact list and see the Presence status of those contacts, all from their IP
    desk phone. The service also allows users to read and clear IM messages from others,
    respond to the sender by calling them, or send preconfigured text messages directly
    from the phone.(The text of these messages can be customized by the CUCM administrator.)
    Users can also change their Presence status using the IP phone.


    The background components of IPPM include XML-over-HTTP signaling between the
    IP phone running the CUPS, and XMPP between CUPS and CUPC on the user''s workstation.
    SIP is used for communication with SIP proxy or registrar servers. Figure 14-4
    illustrates protocol interactions using IPPM.'
  merge: -1
  img_proc: true
