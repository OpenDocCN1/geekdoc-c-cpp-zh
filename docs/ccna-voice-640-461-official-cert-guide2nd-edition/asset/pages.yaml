- pgno: 457
  md: 'The following reports are available to users, Managers, and Administrators,
    as indicated in each description:


    +   - Bills


    +   - Individual: Available to users, Managers, and Administrators. Provides call
    information for a specified date range summary or detail format. Report can be
    viewed or e-mailed.


    +   - Department: Available to Managers and Administrators. Provides call and
    QoS information in summary or detail format, for all users who report to the Manager
    or selected users.


    # Top N


    +   - By Charge: Available to Managers and Administrators. The report lists the
    top number of users in order of call charges for the specified time period (N
    is the number of users in the list). Reports can also be configured to report
    charges by the destination of the calls, or by all calls, which lists the top
    N calls that incurred the most charges.


    +   - By Duration: Available to Managers and Administrators. Reports list users
    sorted by duration of call during the specified time period. The report can also
    list top calls in order by destination or all calls by duration.


    +   - By Number of Calls: Available to Managers and Administrators. Reports list
    users by number of calls or extensions by number of calls.


    # Cisco Unified Communications Manager Assistant


    +   - Manager Call Usage: Available to Administrators. Reports list summary or
    detail information for call completion by Managers using Cisco Communications
    Manager Assistant. Reports can list the calls Managers made for themselves, calls
    that assistants handled for Managers, or calls handled by both for Managers.


    +   - Assistant Call Usage: Available to Administrators. Reports list the calls
    assistants made for themselves, calls that assistants handled for Managers, or
    calls handled by assistants for both assistants and Managers.


    +   - Cisco IP Phone Services: Available to Administrators, this report shows
    selected IP services, the number of users subscribed to the services, and the
    utilization percentage for each.


    # Example Report Generation


    The following steps illustrate how to generate a report using the CAR tool. As
    an example, we run a report that tells us what users have made the most:


    +   1. Navigate to the CAR Reports tool at https://<ip_address>/car, as shown
    in Figure 16-4.


    +   2. Select User Reports > Top N > By Number of Calls, as shown in Figure 16-5.


    +   3. The next step allows you to define the parameters for the report, including
    call types, user types, and date range, as shown in Figure 16-6.'
  merge: -1
