- pgno: 206
  md: 'After you select the Local Directory, the IP phone gives you the option to
    search by first or last name by typing a user''s name as a string on the IP phone.
    You can enter many characters as you like to filter down the number of results
    or simply press the Select soft-key to ensure the entire corporate directory,
    as shown in Figure 7-3.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_206_0.png)


    **Figure 7-3** Local CME Directory


    By default, Cisco Unified organizes the local directory alphabetically by first
    name. You can change this setting by using the **directory** command from telephony
    service configuration mode. In addition, you can add manual entries to the directory
    by using the **directory entry** command. This is useful for devices in the company
    that do not have an explicit phone-dn configuration. Example 7-2 demonstrates
    these two commands in action.


    **Example 7-2** Configuring Manual Local Directory Entries


    ```

    CME_Voice(config-telephony)# directory ?

    entry                 Define new directory entry

    first-name-first      first name is first in ephone-dn name field

    last-name-first       last name is first in ephone-dn name field

    CME_Voice(config-telephony)# last-name-first

    CME_Voice(config-telephony)# directory ?

    <1-100>              clear               clear all directory entries

    CME_Voice(config-telephony)# directory 1 ?

    WORD                 A sequence of digits representing dir. number

    CME_Voice(config-telephony)# directory 1 1599 ?

    name                 Define directory name

    CME_Voice(config-telephony)# directory 1 1599 ?

    LINE                 representing directory name (max length: 24 chars)

    CME_Voice(config-telephony)# directory 1 1599 * Corporate Fax

    ```'
  merge: -1
  img_proc: true
- pgno: 207
  md: '**Note:** As you can see from the context-sensitive help, you can add up to
    100 manual entries to the local CME directory. Also, keep in mind that sorting
    alphabetically by last name flips all the information in the directory to list
    last name first. CME will list the "Corporate Fax" entry just added as "Fax Corporate."


    If you are using the Cisco Configuration Professional (CCP) to manage caller ID
    and Local Directory configurations, the GUI performs the Caller-ID assignment
    for you when you associate a user with a Phone/Extension. You might remember that
    the CCP utility does not associate extensions (phone-dns) directly to phones (ephones).
    Instead, you create the necessary extensions and phones, they are linked together
    through the user account. Once you add a First Name and Last Name to the user
    account, the name is applied to the extension associated with that user account.
    As shown in Figure 7-4, the user account Peter Rock is associated with extension
    1501 (using the Phones/Extensions tab, not pictured in Figure 7-4).


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_207_0.png)


    **Figure 7-4 Assigning Directory Information Using CCP


    Likewise, you can find the directory sorting option under Unified Communications
    > Advanced Telephony Settings > System Config (shown in Figure 7-5).'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_208_0.png)


    # Figure 7-5 CCP Directory Sorting Options


    Finally, you can create manual directory entries by navigating to Unified Communications
    > Telephony Features > Directory Services (shown in Figure 7-6).


    # Configuring Call Forwarding


    There are two methods used to forward calls to a different destination: from the
    phone (the user''s method) and from Cisco IOS CLI (the administrator''s method).
    This section describes both methods and provides an overview of the call-forward
    pattern command.


    # Forwarding Calls from the IP Phone


    To forward calls from the IP phone, simply press the CFwdAll softkey button, as
    shown in Figure 7-7. The IP phone beep twice and allows you to enter a number.
    Enter the number to which all calls on the IP phone will forward, and then press
    the pound key (#) on the phone so that it knows you are entering the number. To
    cancel forwarding, press the CFwdAll button a second time.


    **Tip:** If you want to forward all calls directly to voicemail, press the CFwdAll
    button followed by the messages button on the IP phone.'
  merge: -1
  img_proc: true
