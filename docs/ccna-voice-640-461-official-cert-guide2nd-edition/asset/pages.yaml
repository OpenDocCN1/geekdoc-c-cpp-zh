- pgno: 253
  md: '# Disaster Recovery System Interface


    The Disaster Recovery System (DRS) provides a backup (with scheduler) and restore
    capability. Access to this interface uses the Platform Administration account
    defined at install (does the OS Admin interface). Additional accounts can be created
    for access by other individuals.


    Backups can be written to a local DLT tape drive or to an SFTP server. A Scheduler
    is provided for automated backups, or an immediate start to the backup can be
    selected. Individual server or full cluster backups may be performed.


    # Cisco Unified Reporting Interface


    The Cisco Unified Reporting interface provides a simplified method to access system
    reports. These reports gather information from existing logs and format the data
    into simple, useful, one-click reports. Data is collected from logs across the
    cluster (Publisher and Subscribers) to provide summarized information and highlight
    irregularities that might impact operation of the cluster. The interface also
    warns if a particular report could adversely impact server operation and take
    excessive time.


    # CLI


    The CLI is typically accessed using SSH, although it is possible to directly connect
    a keyboard and monitor. Initially, the only account that can log on using the
    CLI is the Platform Administration account defined during install, although additional
    accounts can be created to allow access.


    The commands and functionalities of the CLI include all those found in the OS
    Administration interface, plus the following (this is not a comprehensive list):


    +   - Shut down or restart the system

    - Change versions after an upgrade

    - Start, stop, and restart services

    - Modify network settings (IP Address, mask, gateway, and so on)

    - Use network tools such as ping, traceroute, and packet capture

    - Use the DRS (backup and restore)

    - Add and modify Platform Administration accounts

    - Display server load and process information

    - Check server status, including software versions, CPU, memory and disk utilization,
    hardware platform, and serial numbers, and on


    Inline help is available for the CLI using the question mark (?) in a similar
    fashion to the Cisco IOS.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '**Caution:** The CLI is a powerful interface. The Enter key commits the command
    immediately, and you are very rarely asked to confirm your intent. This effectively
    means the CLI will do exactly what you told it to do, including the possibility
    of negatively impacting the operation of the server. Review the CLI Administration
    Guide and be certain of the commands you are entering before using the CLI.


    # User Management in CUCM: Roles and Groups


    The CUCM application defines a consistent and simple method of assigning (and
    limiting) administrative privilege to users. Users are assigned to groups; Groups
    are assigned Roles; Roles define privileges to applications. The following sections
    provide some detail on this structure.


    # Roles


    Roles define a set of privileges to the resources in an application. Resources
    may be a CUCM administration page, a report tool, or a section within a CUCM web
    page. The privilege assigned for each resource can be one of the following:


    +   **No Access:** The role denies access to the resource; for example, a web
    page will load, and an error appears instead.


    +   **Read:** The role allows the resource to be displayed but not edited: for
    example, a web page may load, but none of the fields or settings can be modified.
    Buttons such as Add, Insert, Delete, or Update do not appear.


    +   **Update:** The role allows full access to the resource, including editing
    and modification (and deletion where applicable).


    Other applications (for example, Cisco Unified Serviceability or Cisco Extension
    Mobility) define access privileges that are relevant and specific to the application.


    +   - CUCM Administration

    - CUCM Serviceability

    - Cisco Computer Telephone Interface (CTI)

    - CUCM Administrative XML (AXL) database

    - Cisco Extension Mobility

    - CUCM End User


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_254_0.png)'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Figure 8-4 shows the Find and List Roles page.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_255_0.png)


    **Figure 8-4** Roles List in CUCM.


    # Groups


    The CUCM application defines 24 Standard Groups by default. These Groups are as-associated
    with one or more Standard Role(s) that provide various levels of privilege to
    the various applications via CUCM Administration pages. Most Groups have members
    by default; when users are created or associated in CUCM, these accounts may be
    added to one or more Groups. The privileges defined by the Role are inherited
    by the user account by way of membership in the Group.


    With Roles, it is likely that the administrative requirements in these scenarios
    will be met by using the Standard Groups and Role associations. If this is not
    the case, custom Groups can be created and associated with Standard or Custom
    Roles to exactly meet administrative requirements.


    Because a user can be a member of multiple groups and therefore inherit multiple
    levels of privilege, it is important to understand the effect of conflicting Role
    privileges. Consider this scenario:


    Bob is a member of two Groups, A and B. Group A is associated with Role X, which
    provides Update privilege to an application resource. Group B is associated with
    Role Z, which provides Read privilege to the same resource. The question is: What
    is Bob''s effective privileges for the resource?'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'The answer is determined by the Enterprise Parameter Effective Access Privileges
    for Overlapping User Groups and Roles. The default setting is Maximum, meaning
    that, by default, Bob has update privileges. The parameter can be changed to Minimum,
    changing Bob''s effective privilege to Read.


    **Note:** Changing the enterprise parameter as described affects all groups except
    the Standard CCM Super Users group (the maximum-privilege group, the only default
    member of which is the CUCM Application Administrator installed at [for example,
    CCMAdministrator]).


    Interestingly, the default setting of Maximum privilege is opposite of the default
    settings of most network applications and operating systems. This fact is not
    an issue as long as the administrator is aware of the impact and significance
    of the setting, regardless of what is chosen.


