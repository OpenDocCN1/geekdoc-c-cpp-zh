    # Describe Cisco Unity Connection Users and Mailboxes


    The system components identified previously are important, but without users and
    mailboxes, system functionality is limited. The following sections outline the
    basics of adding users and mailboxes to the system.


    # User Templates


    User Templates, as the name implies, provide a pattern used in the creation of
    new user accounts. Most of the required configuration information common to all
    the new users can be entered in the template, and then the individual user-specific
    information is combined with the template to create (potentially) new user accounts
    with speed and accuracy. The template settings are applied as the user is created;
    changing the template not retroactively change the user accounts that were created
    using that template.


    Two default User Templates are created at install: one for administrators and
    one for users. These can be modified if desired, and as many custom templates
    as needed can be created.


    The following sections highlight some of the settings on the User Template Pages
    (of which there are many, so not all settings are discussed).


    # User Template Basics


    The basic elements of User Template configuration are summarized in the following
    sections:


    +   **Name:** The name of the template, such as Managers. The Alias and Display
    Name generation for user accounts can also be specified; the default is first
    name followed by last name.


    +   **Phone:** In this section, the Dial-Plan (Partition/Search Space), Class
    of Service (CoS), and Schedule are defined.


    +   **Location:** Geographic location information, language localization, and
    time zone are set here.


    > **Key Point:** CoS in CUC (not to be confused with Layer 2 Quality of Service
    [QoS] marking or CCM Class of Control) is a simple and powerful method of assigning
    and restricting user privilege. The CoS defines greeting and message length timers,
    licensed feature access, advanced feature access, alternate extension definition,
    Private DL number, and membership limits and call transfer abilities.


    An unlimited number of CoS can be defined, providing exactly the combination of
    abilities and features for as many sets of users as needed.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_382_0.png)'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Figure 13-4 illustrates the basic components of a CoS.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_383_0.png)


    Figure 13-4 CoS Components


    # Password Settings

    On this page, the administrator can lock and unlock the account, control when
    and if the password must be changed, and set the Authentication Rule. All these
    can be set for both the Voicemail password and the Web Application password.


    # Roles


    Roles define one of the default administrative capability assignments, as described
    in Table 13-2.


    # Transfer Rules and Greetings

    Three transfer rules are defined by default. The Standard rule cannot be modified
    and is active by default. The Alternate rule can be modified to be active according
    to a different schedule or a specific end date. The Closed rule takes effect during
    defined closed hours.


    These rules are applied to determine the behavior of the user''s mailbox, including
    which greeting is played to callers. The available greetings are the following:


    +   - Alternate: Used for personalization of the voicemail box with a custom greeting.

    - Busy: Plays when the user''s extension is busy.

    - Internal: Plays only to internal (on-net) callers.

    - Holiday: Plays when the Holiday schedule is in effect.

    - Closed: Plays when the Closed schedule is in effect.

    - Standard: Plays the default "<user name> is not available...” greeting."'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# Call Actions


    The administrator can select what action the system takes after the greeting has
    played. Typically, Take Message would be selected, but Hang Up and Restart Greeting
    are available-options.


    Other Call Actions include sending the call to any configured call handler or
    to a user mailbox.


    # Message Settings, Message Actions, and Call Input


    When the caller leaves a message, he can be allowed to edit it or not, allowed
    to mark it as Urgent, or have the system all messages as Urgent or Normal. Messages
    can also be marked as secure, which can be used to limit where the message can
    be delivered. (For example, a secure message can be restricted from delivery to
    an IMAP client.)


    After the message has been left, the administrator can set what action the system
    takes, with the default being goodbye and hang up. Other options include sending
    the caller to any configured call handler or to a user mailbox.


    During the conversation with CUC, the caller may be allowed to press a key to
    perform a configured action (such as logging in to the Greetings Administrator
    TUI). The default key presses are zero (0) for the operator and asterisk (*) to
    log in to the mailbox.


    # TUI Settings


    The TUI user experience can be customized to speed up or slow down the conversation
    with CUC, make it louder or quieter, change how long the system will wait for
    key presses, and customize the order of playback of different message types, among
    others.


    # CUC End Users


    Creating a new user requires many configuration parameters; if using User Templates
    to create new users, most of these settings are pulled from the template. The
    individual settings that must be configured include the Alias (the unique user
    ID), Name, Mailbox Store, Extension, and Alternate Extensions.


    # Extension and Call Forward Options


    The extension is a required entry. This should be the primary DN on the user''s
    IP phone; when he presses the Messages button, it is the caller ID CUC uses to
    determine if it is a mailbox owner and if so, prompts him to log in. if a call
    to a user''s phone is forwarded to CUC because the user was on the phone or did
    not answer, CUC uses the caller ID to determine which mailbox greeting to play
    to the caller.


    The call forward options on the IP phone (discussed earlier in this book) can
    change the behavior of CUC; for example, a different greeting may be played for
    internal versus external-callers.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_384_0.png)'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Voice Messaging with SRST and AAR


    In the event the IP WAN fails, calls can be rerouted over the PSTN using Automated
    Routing (AAR) or Survivable Remote Site Telephony (SRST). If the CUC server is
    reached over the WAN from branch user, in the event of an outage, these systems
    reroute the call to CUC over the PSTN, too. When the call arrives at CUC, the
    ten-digit PSTN caller ID will not be recognized as a mailbox owner unless it is
    added as an alternate extension for the user (the same goes for each other user
    over the system as well).


    # Voicemail Box


    When creating the user mailbox, the administrator can choose whether to list the
    user in the directory or not, record the voice name (the spoken version of the
    username); CUC speaks the name in the configuration page if the name is not recorded),
    and record a greeting. The administrator can also require the user to go through
    these steps at his next login.


    # Private Distribution Lists


    Each user is permitted to create up to 99 DLs, each with a maximum of 999 members.
    Lower limits can be set in the COS or individually per user. Private DLs are visible
    only to the user who created them (and administrators).


    # Notification Devices


    In addition to the MWI lamp on the IP phone, users can be notified of new messages
    by way of up to three PSTN numbers (mobile phone, home phone, and pager) and e-mail.
    Toll control is handled by restriction tables that define what numbers CUC can
    call for message notification. When CUC calls the configured number, it informs
    the user that there is a new voice message and prompts the user to authenticate
    before playing the message.


    # User Creation Options


    There are several ways to create or import user accounts into CUC:


    +   - **Manual creation:** Creates users one at a time. All data is maintained
    locally in the CUC database.


    +   - **Bulk administration:** Creates many users at once from data in a .csv
    file. All user data is maintained locally in the CUC database.


    +   - **Migration from Cisco Unity:** Users can be migrated and imported using
    the Consolidated Object Backup and Restore Application Suite (COBRAS) tool, helps
    administrators migrate users from a Cisco Unity system to a Cisco Unity Connection
    system. The users can be imported with or without their mailboxes.


    +   - **Import from CUCM:** Synchronizes the CUC user database with an existing
    CUCM database. Some user data is maintained in CUC and copied to CUC, but CUC-specific
    data is locally maintained in the CUC database.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_385_0.png)'
  merge: -1
  img_proc: true
- pgno: 386
  md: '+   **Import from LDAP:** Synchronizes the CUC user database with an existing
    LDAP database. Some user data is maintained in LDAP and copied to CUC, but CUCspecific
    data is locally maintained in the CUC database. Optionally, web-password authentication
    can be redirected to LDAP to provide a single point of administration and single
    sign-on for user passwords.


    # CUC Voicemail Boxes


    A voicemail box is typically associated with each user (one per user in most scenarios).
    The mailbox is held in a database store that may be synchronized between two CUC
    servers in an Active-Active redundant pair. The user mailbox may be moved to another
    store if necessary.


    # Message Aging Policy and Mailbox Quotas


    To control disk usage by voicemail box storage, administrators can set message
    aging policies that move read messages to the Deleted Items folder after a specific
    number of days (disabled by default). Messages in the Deleted Items folder are
    automatically permanently after 15 days by default (configurable).


    User storage quotas can be configured to warn users when their mailbox nears maximum
    allowed size (at 12 MB by default). Users are prevented from sending new messages
    when their mailbox reaches 13 MB (configurable to any appropriate value), and
    they cannot send or receive messages if their mailbox reaches 14 MB by default
    (also configurable).


    12 MB of disk space is approximately 200 minutes of recorded messages using the
    G.729 codec, and 25 minutes using G.711.


    # Implement Cisco Unity Connection Users and Mailboxes


    In the following sections, the concepts introduced previously are put into action.
    What follows are the basics of implementation of users and mailboxes. There are,
    of course, many other possible steps that are not included here, both for clarity
    and to stay within the scope of the CCNA Voice exam.


    # Configure End User Templates


    Templates are a powerful and useful way to speed up and simplify the creation
    of users. You may modify an existing template or create a new one to meet requirements.
    Although many configurations are available, the IICM course is limited in scope
    and examines only the following Edit menu entries:


    +   * User Template Basics


    +   * Password Settings


    +   * Roles


    +   * Message Settings and Actions'
  merge: -1
  img_proc: true
- pgno: 387
  md: '+   - Phone Menu

    - Playback Settings

    - Message Notification


    Remember that all the following sections reference editing a User Template, and
    consequently will set configurations for all user accounts created with the template.
    Some settings obviously need to be unique per user and can be included as part
    of the user creation steps or configured after the accounts are created. You can
    create as many User Templates as you need. To begin, navigate to Templates > User
    Templates and select an existing template (or create a new one).


    # User Template Basics


    The following points review most of the elements found on the User Template Basics
    screen. You may or not need to change them all; each template will be at least
    slightly in your environment:


    +   - Alias: This is a required field; in this case, it is the name of the template
    itself.

    - Display Name: This is a required field; this is the template name as it appears
    in the Find/List Templates page.

    - Display Name Generation: Choose one of First Name, then Last Name or Last Name,
    then First Name.

    - Outgoing Fax Server: Select the correct fax server for the users, if any.

    - Partition: Select the appropriate Partition for the users.

    - Search Scope: Select the appropriate Search Scope (Search Space) for the users.

    - Phone System: Select the phone system for the users. Most deployments will have
    only one available, CUC supports multiple integrations so this setting can be
    important.

    - Class of Service: The CoS controls what features and capabilities the users
    can access.

    - Active Schedule: Select the schedule that will be applied to the users. Schedules
    can be used to affect when the Standard or Closed greetings play, as well as what
    aftergreeting actions CUC takes.

    - Set for Self-enrollment at Next Login: Check this box to force the user to go
    through the tutorial and record his voice name and greetings the time he logs
    in CUC.

    - List in Directory: Select this checkbox to list the users in the CUC directory;
    doing so outside callers to search for, and then all callers.

    - Time Zone: Use System Default Time Zone or choose the appropriate time zone
    for the users. Select the time zone with care, because it will modify CUC behavior
    for displaying the time was received and for message notification.

    - Language: Select the language that CUC uses to play instructions to users and
    for text-to-speech. This setting does not apply to the voice recognition conversation.'
