    # Centralized Remote Branch Call Flow


    In a centralized deployment, the CUCM servers are located at the main location,
    with one or more locations at remote branches, connected by an IP WAN. The branch-office
    IP phones use the IP WAN for both signaling and on-net voice traffic. Off-net
    calls from'
