    # Configuring Music on Hold


    What voice network would be complete without the sound of music coming through
    handsets on hold everywhere? CME has the ability to stream Music on Hold (MoH)
    from specified WAV or AU audio files that you copy to the flash memory of the
    router. CME can stream this audio either in multiple unicast streams (which is
    more resource intensive) or in a single multicast stream (which is less resource
    intensive, but requires a multicast configuration). In addition, CME can stream
    the MoH using G.711 or G.729 codecs.


    > Note: Because the G.729 codec is designed for human voice, the quality of MoH
    streamed using G.729 is significantly lower than MoH streamed using G.711. In
    addition, CME uses transcoding DSP resources to convert the MoH to the G.729 codec.
    With all these factors, using G.711 for your MoH, if at all possible, is highly
    recommended.


    Example 7-16 configures a CME router to stream to multicast MoH, streaming music
    from a file in flash called bonjovi.wav.


    # Example 7-16 Configuring MoH Support


    ```

    CME_Voice(config)# telephony-service

    CME_Voice(config-telephony)# moh ?

    WORD music-on-hold filename containing G.711 A-law or u-law 8Kz audio file (.wav
    or .au format). The file must be loaded into the routers

    ```'
  merge: -1
  img_proc: true
