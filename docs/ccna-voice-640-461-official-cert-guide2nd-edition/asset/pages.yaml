- pgno: 273
  md: '# Configuring DHCP in Router IOS


    Cisco routers support basic DHCP server functionality, commonly used in small
    office environments where a dedicated DHCP server is not needed or available.
    The following commands show a typical DHCP configuration, with commands annotated
    for reference:


    ```

    service dhcp

    ```


    ! Enables the DHCP service


    ```

    ip dhcp excluded-address 10.1.1.1 10.1.1.10

    ```


    ! Specifies a start / end range of addresses that DHCP will NOT assign


    ```

    ip dhcp pool name IP_PHONES

    ```


    ! Creates a pool of addresses (case-sensitive) and enters DHCP configuration mode


    ```

    network 10.1.1.0 255.255.255.0

    ```


    ! Defines the subnet address for the pool


    ```

    default-router address 10.1.1.1

    ```


    ! Defines the default gateway


    ```

    dns-server 192.168.1.10 192.168.1.11

    ```


    ! Identifies the DNS server IP address(es) - up to 8 IPs


    ```

    option 150 ip 192.168.1.2

    ```


    ! Identifies the TFTP server IP. Multiple IPs may be included, separated by spaces.


    Multiple DHCP pools can be created, so DHCP services can be provided for PCs in
    a small office by the same router. For some third-party SIP phones, it may be
    necessary to specify Option 66 (the TFTP server DNS name).


    # IP Phone Configuration Requirements in CUCM


    CUCM has several configuration elements for IP Phones. We briefly look at the
    following basic required elements:


    +   - Device Pool


    +   - Cisco Unified CM Group


    +   - Region


    +   - Location


    +   - Date/Time Group


    +   - Phone NTP Reference


    +   - Device Defaults


    +   - Softkey Template


    +   - Phone Button Template


    +   - SIP Profile'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - Phone Security Profile


    +   - Common Phone Profile


    # Device Pool


    Device Pools provide a set of common configurations to a group of devices; think
    of a Device Pool as a template to apply several different settings all at once,
    quickly and accurately. You can create as many Device Pools as you need, typically
    one per location, but they can also be applied per function. (For example, all
    the phones in the call center may use a different Device Pool from the rest of
    the phones in the administration offices, although they are all at the same location).
    There are several settings within the Device Pool; some of the relevant to us
    are described next.


    Cisco Unified Group A CM Group defines a top-down ordered list of redundant subscribers
    to the phones can register. The list can include a maximum of three subscribers
    (plus an optional Survivable Remote Site Telephony [SRST] reference). The first
    server in the list is the primary subscriber; the second is the backup, and the
    third is the tertiary. In normal operation, phones send primary registration messages
    to the primary, backup and nothing to the tertiary. If the primary server fails
    or becomes unavailable, the phone sends a registration message to the backup server
    (and registers with it) and begins sending backup registration messages to the
    tertiary.


    The number of CM Groups created depends on the number of subscribers in the cluster;
    the goal is to provide server redundancy to the phones while distributing phone
    registrations evenly as in the system design. A subscriber may be listed in more
    than one CM Group to provide overlapping depth of coverage, as long as its performance
    capacity will not be exceeded in any unfore failure circumstance. This is simply
    another requirement of a good design.


    Region is a virtual assignment that allows the system designer to control the
    rate for calls. For example, if we define two regions, called Vancouver_HQ_REG
    and Ottawa_BR_REG, we can set the rate for calls within the Vancouver region to
    256 kbps, within the Ottawa region to 64 kbps, and between the two regions to
    16 kbps.


    We are actually selecting the codec to be used for these calls: the codec generates
    a known rate, which turn uses a predictable amount of bandwidth and provides a
    predictable voice quality. In general, it is assumed that WAN bandwidth is limited;
    selecting a lower rate reduces the amount of bandwidth per call at the expense
    of call quality.


    Location As we just saw, we can select the appropriate rate for calls and, therefore,
    the bandwidth used by each call. Given that WAN bandwidth is usually limited,
    we need to limit the amount of bandwidth used by calls to a particular location.
    Location defines a maximum amount of bandwidth used by calls to a particular location;
    each call is tracked, and the bandwidth it uses is deducted from the total for
    location. When the bandwidth remaining is not enough to support another call at
    a given rate, that call is dropped by default (but may be rerouted over the PSTN
    if AAR is correctly configured). This is one mechanism for Call Admission Control,
    which is described later in this book.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Date/Time Group As discussed earlier, it is recommended to use NTP for time
    synchronization of all devices. The problem is that NTP references Greenwich Mean
    Time, which makes the time displayed on devices "wrong" if they are not in the
    GMT time zone. Date/Time Groups allow us to offset the correct time learned via
    NTP to match the time zone of the device. Date/Time Groups also allow us to display
    the time and date in the desired format, which can vary from place to place.


    Phone NTP Reference needs an NTP server address from which they can obtain the
    time using NTP. (This is not required for SCCP phones, which are configured to
    use the correct time using SCCP signaling.) It is preferred that the NTP reference
    be local to the phones that need it.


    It is common to have groups of phones with similar configurations. Using a Device
    Pool for each group simplifies and speeds up administrative tasks, making them
    less error-prone in the bargain. Figure 9-4 shows part of a Device Pool configuration.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_275_0.png)


    ### Figure 9-4 Device Pool


    # Device Defaults


    The Device Defaults page lists all the supported endpoints (with separate entries
    for SCCP and SIP as necessary), and the firmware load, Device Pool, and Phone
    Button Template each endpoint uses by default. This allows an administrator to
    set useful system-wide defaults for any newly registered device of each type.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Softkey Template and Phone Button Template


    The Softkey Template controls softkey button functions are available to the user;
    these are typically used for feature access (Conference, Transfer, Park, Extension
    Mobility, and so on). Seven softkey templates are available by default, and you
    can create as many as your design requires.


    The Phone Button Template defines the behavior of the buttons to the right of
    the phone screen (for most models). Eighty (or more) are defined by default, because
    there are unique templates for each supported phone type—and for most phones,
    a separate template for SCCP and SIP. The default templates typically provide
    two lines and as many speed dials as there are remaining buttons on a particular
    phone model; you can add and customize each button one of many different functions.


    # Profiles


    Profiles allow for a one-time configuration of repetitive tasks; several types
    of profiles exist, and you can create many versions of each type to be applied
    to phones as needed.


    # Phone Security Profile


    A default Phone Security Profile exists for each type of phone/protocol. These
    default profiles have security security disabled; you can choose to configure
    the device as secured, set encrypted TFTP configuration files, and modify Certificate
    Authority Proxy settings.


    # Common Phone Profile


    The Common Phone Profile includes settings that control the behavior of the phone,
    including the following:


    +   - DND settings

    - Phone personalization capabilities

    - VPN settings

    - USB port behavior

    - Video capabilities

    - Power-save options


    # Adding Phones in CUCM


    Phones can be added to CUCM in four ways:


    +   - Manual Configuration: The administrator creates a new phone, configuring
    all settings in real time on the Phone Configuration page.

    - Autoreistration: The administrator configures CUCM to dynamically configure
    and add to the database any new IP Phone that connects to the network.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '+   * Bulk Administration Tool (BAT): Using templates provided by CUCM, administrator
    .csv files that contain all the required information to create multiple phones
    in one operation.


    +   * Auto Register Phone Tool (TAPS): An Interactive Voice Response (IVR) server
    enhances the Autoregister and BAT functionality, providing an automated method
    of adding thousands of phones at a time.


    The following sections provide more detail on each of these operations.


    # Manual Configuration of IP Phones


    The basic steps for manually adding an IP Phone are as follows:


    +   1. Navigate to Device > Phone, and then click New.


    +   2. Choose the IP Phone Model from the drop-down list.


    +   3. Choose the device protocol (either SCCP or SIP); some phones will support
    only one protocol, and this step will be skipped.


    +   4. Select, or enter, the required specific information for the phone. The
    four required fields that do not have default values (must be manually configured)
    include the following:


    +   * MAC Address: The MAC address is the unique identifier that links the IP
    Phone hardware to the software configuration in CUCM. If you are building a phone
    for Bob, you must obtain the MAC address of the phone that will end up on Bob''s
    desk, or Bob will not get the correct settings, DN, and so forth.


    +   * Device Pool: The Device Pool (as described earlier in this chapter) applies
    many common settings to the phone that are relevant to its physical location and
    desired behavior.


    +   * Phone Button Template: The Phone Button Template (also detailed earlier
    in this chapter) defines what functions are assigned to the buttons on the phone
    (DNs, Speed Dials, Services, and so on).


    +   * Device Security Profile: Applies a set of security-related configurations,
    described previously in this chapter.


    +   5. Click Save.


    When the page reloads, a new pane labeled Association Information appears on the
    left, in which you can configure the phone buttons. The functionality (Line, Speed
    Dial, Intercom, Service, and so on) is defined by the Phone Button Template specified
    previously; here is where you specify what the DN number on the line(s) will be,
    what Service is accessed, or which Intercom DN is dialed. Figure 9-5 shows the
    Phone Configuration page, including the Association Information page.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Figure 9-5 The Phone Configuration Page


    In the Association Information pane, continue the basic phone configuration steps,
    as follows:


    +   Click Line [1] - Add New DN. The Directory Number Information page opens,
    in which you must enter a Directory Name, and optionally select the Partition
    and other optional configurations. The following points highlight a few of the
    settings found on the Directory Number Configuration page:


    +   **Route Partition:** As discussed in Chapter 10, “Understanding CUCM Dial-Plan
    Elements and Interactions,” the Partition is the part of the calling privileges
    system or of Control.


    +   **Alerting Name:** This is the name to display on the caller''s phone when
    phone is ringing. Some PSTN connections might not support this functionality.


    +   **Call Forward and Call Pickup Settings:** This is where the administrator
    can determine how to forward a call if the DN is busy or not, or for Call Forward
    All. The user can set Call Forward All at the phone itself using the CallFWD softkey,
    or on their User Web Page; other Call Forward settings (such as Busy and No Answer)
    are available to the user only on the user’s Web Page.


    +   **Display:** The text entered in the Display field serves as an internal ID.
    When this DN calls another IP Phone, the Display text replaces the calling DN
    number. In other cases, if Bob''s DN is 5309 and the Display field is blank, when
    Bob calls Ethan, Ethan''s phone shows that 5309 is calling, if the Display field
    on


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_278_0.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Bob''s phone was "Bob Loblow" as the entry, Ethan''s phone displays the caller
    as Bob Loblow.


    +   - Line Text Label: This is the text that displays on the phone to describe
    the line; for example, if the second button on the phone is the shared DN for
    the Parts Desk, the Line Text Label for Line 2 might read "Parts Line."


    +   - External Phone Number Mask: If this phone makes an off-net call (typically
    to the PSTN), this field can change the Calling Line ID (CLID) to present a full
    PSTN number instead of the internal DN.


    +   7. Click Save.


    +   8. In the Related Links drop-down, select Configure Device (<Phone>), and
    then click Go.


    +   9. You are now at the Phone Configuration page for the new phone. At this
    point, if you need to continue making config changes you can do so, or you can
    click Save the changes so far. The page prompts to "Click on the Apply Config
    button to have the changes effect." This happens in order for the phone to adopt
    the changes, it has to reload with its new config. This requires either a Restart
    or a Reset, depending on what was changed.


    > There is a great deal of confusion about Restart, Reset, and Apply Config. The
    differences are explained in the following points:


    +   - A Reset reboots the firmware and the configuration of the phone. Some information
    such as firmware version, local changes, SRST, or Communications Manager Groups
    require a full reset so that the phone will pull a new page from the TFTP server.
    A Reset is triggered from the Administration web page, or from the phone itself
    by entering Settings >## (using the keypad).


    +   - A Restart restarts the phone, and the phone comes right back and registers
    again. Because Communications Manager reads the database for this device when
    it registers, it is a good way to refresh information that is not passed through
    the configuration button. But changes, names, and forwarding would only require
    a Restart. A Restart is faster than a Reset, because the firmware is not rebooted
    at all.


    +   - The confusion between Restart and Reset was that in CUCM 8.X, a new function
    labeled "Apply Config" was introduced. This button intelligently triggers either
    a Reset or a Restart as appropriate, depending on what changes were made to the
    device. In all cases, the phone has to be registered for the Reset or Restart
    to be sent to the phone.


    It is common, especially with advanced features as Extension Mobility or Cisco
    Unified Personal Communications, to associate a user with a particular Device
    (IP Phone). It is required to associate the user with the Device if you want to
    be able to use the User Web Pages to customize their phone. The End User is associated
    with the Device (IP Phone), and the Device is associated with one or more DNs.
    This allows the user not only to access the User Web Pages to configure this phone,
    but for other applications and processes to interact with the user through the
    phone system.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'So, what happens if you delete an End User who is associated with a device
    that is associated with a DN? Nothing. Although the association exists and is
    important and useful, the three database entities of User, Device, and DN are
    independent of each other. The device and DN do not go away if the User is deleted,
    and the same result applies if the Device or DN are deleted (although a phone
    without a DN, or a DN without a phone, can''t make calls).


    # Autoreistration of IP Phones


    CUCM includes the Autoreistration feature, which dynamically adds new phones to
    the database and allows them to register, including issuing each new phone a DN
    so it can place and receive calls. Autoreistration is supported by all Cisco IP
    Phones.


    To enable Autoreistration, perform the following steps:


    +   1. Verify the Autoreistration Phone Protocol. Access this setting under System
    > Parameters; choose either SCP (default) or SIP. Phones that do not support the
    chosen protocol will still register using their native protocol.

    2. Verify that at least one CM Group has Autoreistration enabled (by selecting
    the checkbox for Auto-registration Cisco Unified Communications Manager Group).

    3. Enable and configure autoreistration on one or more CM servers within the CM
    Group enabled for autoreistration:

    - Enable Autoreistration by deselecting the Auto-registration Disabled on this
    Cisco Unified Communications Manager checkbox; it is disabled by default, so unchecking
    the box enables it.

    - Configure the range of DNs that will be dynamically and sequentially issued
    to auto-registering phones. The default Starting Directory Number is 1000; if
    you change the Ending Directory Number to anything higher than 1000, Autoreistration
    is automatically enabled. If you set the Starting and Ending DNs to the same value,
    Autoreistration is automatically disabled. (Autoreistration is disabled by default,
    because both the Starting and Ending Numbers are set to 1000.) You will want to
    choose a range of DNs that fits well with your dial plan to avoid overlap and
    confusion)

    - Set the Partition that will be assigned to the autoregistered DNs. This is optional,
    but it is a good way to limit and control autoregistered phones.

    - Verify that the Auto-registration Disabled on this Cisco Unified Communications
    Manager checkbox is unchecked, and then click Save.


    A simple way to test autoreistration is to plug in a new phone; if it receives
    a DN in the range you specified (or a DN in the range of 1000–1999 if you left
    it at the defaults), Autoreistration is working.


    Some administrators use Autoreistration as a security weakness, because any IP
    phone will be dynamically added to the database and potentially begin making calls,
    perhaps even to the PSTN if it is not restricted. It is common to enable Autoreistration
    only when it is needed to prevent the occurrence of "rogue phones."'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Figure 9-6 shows the Auto-Registration Information section of the Unified CM
    Configuration page.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_281_0.png)


    Figure 9-6 Autoregistration Configuration


    # Bulk Administration Tool


    The Bulk Administration Tool (BAT) allows administrators to perform database inserts,
    modifications, or deletions in bulk. This makes it feasible to add many phones,
    users, or other elements more quickly and fewer errors; it also allows the administrator
    to schedule the operation to happen automatically and unattended.


    The BAT Export feature allows the administrator to pull selected records from
    the database and export them. The administrator can then modify the records and
    re-import them into the database, making bulk changes faster and more accurate.


    BAT can be used to add, modify, or delete almost any component in CUCM, including
    Phones, Users, Forced Authorization Codes and Client Matter Codes, Device Profiles,
    the Region Matrix, Gateway devices, and many others.


    The components of BAT include an Excel template that provides the required fields
    and formatting for the new unique data, server-side templates that configure the
    common data, and a set of web page interfaces for preparing and executing the
    many operations that BAT supports.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The Excel template is downloaded from the CUCM server. The administrator customizes
    the templates for the needs of this BAT operation, prepares the required fields
    with the correct data, and uploads the resulting....csv file to the server.


    Using the BAT interface appropriate for the operation (Insert Phones, Insert Users,
    Create Routing components, and so on), the administrator may need to create a
    server-side BAT Template for adding new devices, or in some cases simply select
    the uploaded .csv file for processing. If templates are required (as they would
    be if adding phones, example), the template specifies all the settings that all
    of the phones have in common, whereas the .csv file specifies all of the unique
    settings for each phone, such as DN, Line Label, and so.


    The only trick to adding phones with the BAT tool is that the MAC address of each
    phone must be specified. Using a barcode scanner to scan the MAC barcode on the
    phone into the .csv file makes things faster and more accurate, but there is another
    challenge waiting for you: You create a detailed config for the phone, including
    DNs and other user-specific settings, and you specify the MAC address of the new
    phone. You must make sure that the physical phone with that MAC gets to the user
    it was for; this is no easy task if several hundred phones are being deployed
    at once.


    A couple of alternate strategies are available to make BAT deployments easier.
    One is to use Autistration to get all the phones working, and then use the BAT
    tool to modify the phones'' configurations after the fact. This approach still
    has some weaknesses, notably that you must positive of the MAC address of the
    physical phone that sits on the desk and match it to the database entry that changes.


    # Auto Register Phone Tool


    The most sophisticated strategy involves the use of the Auto Register Phone Tool
    (formerly known as the Tool for Registered Phone Support, but which is still known
    as TAPS, it''s a better acronym than ARPT). TAPS goes one step further in the
    automation of new IP Phone deployments, as summarized in the following steps:


    +   1. An IP-IVR is built and configured to support TAPS, and the CUCM server
    is integrated with the IP-IVR server. The IP-IVR functionality is supported by
    several Cisco applications, including Unified Contact Center Center.


    +   2. The administrator prepares a BAT job, specifying a Device Template for
    all common phone settings and a detailed....csv file with all the unique phone
    settings. The administrator runs the BAT job, substituting fake "dummy" MAC addresses
    for the as-yet-unknown real ones (a simple checkbox in the BAT interface does
    this substitution automatically).


    +   3. The new phones are autoregistered and receive a DN. They now place calls.


    +   4. Using Bob''s phone as an example: Bob (or perhaps an administrator if Bob
    feels comfortable so) picks up his new, autoregistered phone that has DN 1024
    (from the default autoregistration range) and dials the specially-configured IP-IVR
    pilot number.


    +   5. The IP-IVR may prompt Bob to authenticate (this is an option but more secure
    approach). When Bob has authenticated successfully, the IP-IVR prompts Bob to
    enter'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'the extension his phone should have; in a new deployment, this may be provided
    to Bob on an information sheet, or it may simply be the same extension (let''s
    assume 5309 in this case) that he had on the old phone system that is being migrated
    to CUCM.


    +   6. When Bob enters the extension, the IP-IVR records his input of "5309" and
    captures the MAC address of the phone Bob is using. The IP-IVR sends all this
    information to CUCM.


    +   7. CUCM looks up the extension of 5309 in the database, and finds it in the
    record for the newly-added BAT job phones—one that will become Bob’s phone. CUCM
    replaces the dummy MAC address in the BAT record with the real MAC captured and
    forwarded by the IP-IVR. The database record now is complete and accurate, using
    the real MAC address of the phone that sits on Bob''s desk.


    +   8. CUCM restarts Bob’s phone, and when it comes online, it is fully configured
    with all of the specific details from the BAT record for Bob''s phone.


    This is an exceptionally powerful way to deploy thousands of IP Phones. With some
    minor tweaks and some training of the users, it requires minimal administrator
    involvement in the phone deployment. The downside is that it requires the IP-IVR
    hardware and software and a capable administrator to configure it, and still involves
    either trainers to set up their own phones or using administrators to perform
    repetitive tasks, which are not cost-effective uses of their time.


    # Describe End Users in CUCM


    It is technically true that a phone system doesn''t need End Users. A person parks
    himself in front of a phone and starts using it; it doesn''t really matter who
    the person is as long as the phone does what that person needs it to do. But a
    Unified Communications system provides far more than phone functionality; it has
    a massive array of features that can be provided and customized by individual
    users. Converged networks are increasingly complex, and End Users expect an increasing
    simplicity of use. The configuration of End Users is an integral part of a full-featured
    system.


    # End Users Versus Application Users


    > Key Topic


    CUCM makes a clear distinction between End Users and Application Users. The distinction
    is simple: End Users are typically people who type in a username and password
    to a login screen (usually a Web page) to access features or controls. An Application
    User is typically an application that sends authentication inline with a request
    to read or write information to a system (perhaps a third-party billing application
    accessing the CDR/CAR database, for example). Table 9-2 lists some of the characteristics
    and limitations of End Users versus Application Users.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Table 9-2 End Users Versus Application Users


    | End Users | Application Users |

    |---|---|

    | Associated with an actual person | Associated with an application |

    | For individual use in interactive logins | For noninteractive logins |

    | Used to assign user features and administrative | Used for application authorization
    |

    | Included in the user directory | Not included in the user directory |

    | Can be provisioned and authenticated using LDAP | Must be provisioned locally
    (no LDAP) |


    # Credential Policy


    The Credential Policy defines preset passwords, end-user PINs, and application-user
    passwords. The default Credential Policy applies the application password specified
    at install to all Application Users.


    Administrators can define additional policies that can specify the allowed number
    of failed login attempts, minimum password length, minimum time between password
    changes, number of previous passwords stored, and the lifetime of the password.
    The policy can also check for weak passwords. A strong password:


    +   - Contains three of the four characteristics: uppercase, lowercase, numbers,
    and symbols

    - Cannot use the same number or character more than three times consecutively

    - Cannot include the alias, username, or extension

    - Cannot include consecutive numbers or characters


    Similar rules exist for phone PINs:


    +   - Cannot use any number more than two times consecutively

    - Cannot include the user mailbox or extension, not the reverse of them

    - Must contain at least three different numbers (for example, 121212 is invalid)

    - Cannot be the dial-by-name version of the user name (such as Mike = 6453)

    - Cannot contain repeated digit patterns, or any patterns that are dialed in a
    straight line on the phone keypad (for example, 2580 or 357)


    # Features Interacting with User Accounts


    The following features use the End-User-Account login process, with either the
    username/password or PIN as the authentication:


    +   - Unified CM Administration web pages

    - User web pages'
  merge: -1
  img_proc: true
- pgno: 285
  md: '+   - Serviceability

    - OS Administration

    - Disaster Recovery System

    - Cisco Extension Mobility

    - Cisco Unified Communications Manager Assistant

    - Directories


    +   - IP Phone Services

    - Data Associated with User Accounts


    User account information is divided into three categories, with fields for specific
    data in each category:


    # 1. Personal and Organizational Settings:


    +   - UserID

    - First, Middle, Last Name

    - Manager UserID

    - Department

    - Phone Number, Mail ID


    # 2. Password Information:


    +   - Password


    # 3. CUCM Configuration Settings:


    +   - PIN

    - SIP Digest Credentials

    - User Groups and Roles

    - Associated PCs, controlled devices, and DNs

    - Application and feature parameters (Extension Mobility, Presence Group, CAPF)


    Application User accounts use a subset of the previous attributes.


    # User Locale


    User locales allow different languages to be displayed on the IP Phone and the
    User Web Pages. Additional locales are installed on the CUCM server; then specific
    locale files are downloaded to the phone via TFTP. This allows for the customization
    of the primary interfaces for users in a wide range of available locales/languages.


    # Device Association


    For users to be able to control their own devices (setting up their speed dials,
    services, and ring preferences, for example), the End User account must be associated
    with the'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'device. In CUCM, End Users can be associated with IP Phones, Cisco IP Communicator
    (CIPC), and Cisco Extension Mobility profiles.


    Because the End User account must have a unique User Attribute Name in the CUCM
    database, it is possible to dial a user by name. Cisco Unified Presence Presence
    Server (CUPS) tracks the availability status of a user and his communication capabilities
    (such as voice, video, and chat).


    # Implementing End Users in CUCM


    End Users can be added to the CUCM database via three main methods:


    +   - Manual, one-at-a-time entry


    +   - Bulk import using the Bulk Administration Tool


    +   - LDAP synchronization (and optional authentication)


    This section reviews each of these methods.


    # Manual Entry


    The CUCM database includes fields for comprehensive user information. Only some
    of these fields are required, including the following:


    +   - User ID


    +   - Last Name


    +   - Presence Group (defaults to Shared Presence Group)


    +   - Remote Destination Limit (defaults to 4)


    Given that the last two required fields are populated by default, it is clear
    that CUCM does not require much information to create a new user. The User ID
    must be unique, which implies that you should have a naming convention that accommodates
    many users with similar names.


    There are many optional fields on the End User Configuration page, including Password,
    PIN, Last Name, Telephone Number, and Device Association. The more users you have,
    the more likely it is that these optional fields will be populated to implement
    features, improve searching and reporting, or improve security. Figure 9-7 shows
    part of the End User Configuration page.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_287_0.png)


    # Figure 9-7 End User Configuration Page


    # Bulk Import Using BAT


    Instead of adding potentially hundreds or thousands of users one at a time, the
    administrator can add users in bulk using the Bulk Administration Tool (BAT).
    BAT allows the administrator to create and upload a CSV file with all the users''
    information populated and insert the data into the database in an automated way.
    BAT is a fast way to add, remove, or modify database entries for almost every
    part of the CUCM database.


    # LDAP Integration


    CUCM supports integration with Lightweight Directory Access Protocol (LDAP). LDAP
    is a standards-based(with some significant vendor-specific exceptions) system
    that allows an organization to create a single, centralized directory information
    store. LDAP holds information about user accounts, passwords, and user privileges.
    The information centralized in LDAP is available to other applications, so that
    separate directories do not need to be maintained for each application. Using
    LDAP simplifies user administration, and makes using systems slightly easier for
    users who only need to maintain their information and passwords in one place.


    > Note: Only End Users are replicated by LDAP Sync. Application users are always
    and only maintained in the CUCM database.


    CUCM supports LDAP integration with several widely used LDAP systems, including
    the:'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   - Microsoft Active Directory (2000, 2003, 2008)

    - Microsoft Active Directory Application Mode 2003

    - Microsoft Lightweight Directory Services 2008

    - iPlanet Directory Server 5.1

    - Sun ONE Directory Server (5.2, 6.x)

    - Open LDAP (2.3.39, 2.4)


    CUCM can interact with LDAP in two ways: LDAP Synchronization populates the CUCM
    database with user attributes from LDAP, and LDAP Authentication redirects password
    authentication to the LDAP system. Typically, Synchronization and Authentication
    are enabled. In either case, some information that now comes from LDAP is no longer
    configurable in CUCM—the fields actually become read-only in CUCM, because the
    information can only be edited in LDAP. The following sections review LDAP Synchronization
    and Authentication in more detail.


    # LDAP Synchronization


    Implementing LDAP Synchronization (LDAP Sync) means that some user data (but not
    all) is maintained in LDAP and replicated to the CUCM database. When LDAP Sync
    is enabled, user accounts must be created and maintained in LDAP and cannot be
    created or deleted in CUCM; the user attributes that LDAP holds become read-only
    in CUCM. However, some user attributes are not held in LDAP and are still configured
    in CUCM because those attributes exist in the CUCM database.


    Perhaps most important to understand is that with LDAP Sync, the user passwords
    are still managed in the CUCM database. This means that, although a user account
    in LDAP is replicated to the CUCM database, the user password must be maintained
    in both the LDAP system and CUCM; this is likely to confuse and annoy the user.


    CUCM uses the DirSync service to perform LDAP Sync. The synchronization is configured
    to run just once, on demand, or on a regular schedule. The choice depends on the
    system environment and the frequency of changes to LDAP content; the need for
    up-to-date information must be balanced against the load on the servers and network
    if the sync is frequent during place busy times.


    > Note: If LDAP Authentication is enabled and LDAP fails or is inaccessible, the
    only User account that will be able to log on to the CUCM system is the Application
    Administrator account defined during install. This may cause drastic unified communications
    service interruption, depending on how users normally interact with the system.
    Of course, if LDAP has failed, it is likely to be a serious issue already, causing
    many applications to cease functioning.


    # LDAP Authentication


    LDAP Authentication redirects password authentication requests from CUCM to the
    LDAP system. End-user account passwords are maintained in the LDAP system and
    are not configured, stored, or replicated to CUCM. Because one of the benefits
    (particularly'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'to the End User) of LDAP is a centralized password system (making single sign-on
    possible), it is typical and desirable to implement LDAP Authentication with LDAP
    Sync.


    # LDAP Integration Considerations


    A common misconception regarding CUCM LDAP Integration is that all user data resides
    in LDAP. This is absolutely false. With LDAP Sync, certain LDAP user attributes
    are held in the LDAP directory and replicated to the CUCM database as read-only
    attributes. The balance of the user attributes in the CUCM database (fields such
    as Associated Devices, PINs, Extension Mobility profile, and so) are still held
    and managed only in the CUCM database.


    There is a similar misconception with LDAP Authentication: Remember that the LDAP
    password is not replicated to the CUCM database; rather, the entire authentication
    process is redirected to the LDAP system.


    The interaction of CUCM with LDAP varies with each synchronization event. The
    primary concern is how much data is replicated. For example, Microsoft Active
    Directory 2000/2003/2008 performs a full sync of all records every time; this
    can mean a very large amount of data is being synchronized, potentially causing
    congestion and server performance issues. For this reason, sync intervals and
    scheduling should be carefully considered to minimize the performance impact.


    Synchronization with all supported LDAP systems is incremental (for example, the
    new or changed information is replicated), which typically greatly reduces the
    amount of data being replicated, thereby reducing the impact on the network and
    servers.


    # LDAP Attribute Mapping


    The user attribute field names that LDAP uses are most likely different form the
    equivalent attribute field names in the CUCM database. Therefore, the various
    LDAP attributes must be mapped to the appropriate CUCM database attribute. Creating
    an LDAP Sync agreement involves identifying the one user attribute that will map
    to the CUCM User ID attribute. In a Microsoft Active Directory integration, for
    example, the LDAP attribute that will become the CUCM User ID can be any of the
    following:


    +   - sAMAccountName

    - uid

    - mail

    - TelephoneNumber


    It doesn''t matter which one is chosen, for consistency and ease of use, the attribute
    that the users are already using to log in to other applications should be used.


    After the initial User ID mapping is selected, some other LDAP attributes should
    be manually mapped to CUCM database fields. Table 9-3 lists the fields in the
    CUCM database that map to the possible equivalent attribute in each type of supported
    LDAP database.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_289_0.png)'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Table 9-3 LDAP User Attribute Mapping


    | CUCM | Microsoft AD | Other Supported LDAP |

    |---|---|--|

    | User ID | sAMAccountName | uld |

    | | mail | mail |

    | | employeeNumber | employeeNumber |

    | | telephoneNumber | telephonePhone |

    | | UserPrincipalName | | |

    | First Name | givenName | Username |

    | Middle Name | middleName | Initials |

    | initials | | |

    | Last Name | sn | sn |

    | Manager ID | manager | manager |

    | Department | department | department |

    | Phone Number | telephoneNumber | telephonumber |

    | | ipPhone | |

    | Mail ID | mail | mail |

    | | sAMAccountName | uld |


    LDAP Sync Requirements and Behavior Keep these points in mind when planning and
    implementing an LDAP Sync:


    +   - The data in the LDAP attribute that maps to the CUCM User ID must be unique
    in the LDAP (and therefore CUCM) database. Some LDAP fields allow duplicate entries,
    the CUCM User ID must be unique, so it is necessary to verify that the LDAP data
    is unique before the Sync agreement is built.

    - The sn attribute (surname/last name) in LDAP must be populated with data or
    the record will not be replicated to CUCM.

    - If the LDAP attribute that maps to the CUCM User ID attribute contains the same
    data as an existing Application User in CUCM, that data is skipped and not imported
    into CUCM database.


    # LDAP Sync Agreements


    An LDAP Sync agreement defines what part of the LDAP directory will be searched
    for user accounts. Many LDAP systems have a highly organized structure, with different
    containers for functions, departments, locations, or privileges. The synchronization
    agreement specifies at which point the search for all user accounts will begin.
    CUCM has access to the container specified in the agreement, and all below that
    in the tree; it cannot search higher up the tree than the start point, nor can
    it search across to


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_290_0.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'other branches in the tree that must be accessed by going higher than the starting
    point then back down.


    The agreement can specify the root of the domain, but although this is a simple
    agreement to create, it creates the entire LDAP structure to be searched, which
    may return unwanted accounts or simply too many accounts.


    # LDAP Sync Mechanism


    The LDAP Sync agreement specifies when to begin synchronizing and when to repeat
    the synchronization (a schedule). It is possible to have a synchronization run
    only once, although this is somewhat unusual.


    The first time the synchronization happens, the following events take place:


    +   1. All existing end-user accounts in the CUCM database are deactivated (not
    deleted).

    2. Accounts whose CUCM User ID exactly matches a user in LDAP are reactivated,
    and any settings from LDAP are updated or applied in the CUCM database.

    3. Accounts that exist only in LDAP are created in the CUCM database.

    4. Any accounts that remain deactivated (meaning they do not exist in LDAP) are
    deleted from the CUCM database after 24 hours.


    # LDAP Custom Filters


    The default behavior of LDAP Sync is to import all user accounts from the start
    point in the tree down. This may cause accounts to be imported that are not wanted.
    Using a Custom Filter allows an administrator to limit which accounts are imported;
    for example, a filter could specify that only user accounts in a particular Organizational
    Unit (OU) are imported. If the filter is changed, a full LDAP sync must be performed
    for the change to take effect.


    # Configure LDAP Sync


    Setting up LDAP Sync is surprisingly simple. The main difficulty is typically
    gaining a full understanding of the target LDAP structure, knowing what containers
    hold the users to be imported, and knowing where to start the LDAP search.


    The basics steps to set up LDAP Sync are as follows:


    +   1. Activate the Cisco DirSync service.

    2. Configure the LDAP system.

    3. Configure the LDAP directory.

    4. Configure LDAP Custom Filters.


    For CUCM to be able to access and search LDAP, an account must be created in LDAP
    for CUCM. Configurations may vary between LDAP systems, but the account must essentially
    read permissions on everything in the search base.'
  merge: -1
  img_proc: true
