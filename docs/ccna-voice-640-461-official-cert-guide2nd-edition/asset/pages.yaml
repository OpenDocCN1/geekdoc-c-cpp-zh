    # Configure CUCM Native Presence


    As previously described, there are two implementations of CUCM native Presence.
    The first, simplest implementation is BLF Speed Dial; the second, more involved
    implementation is Presence-Enabled Call Lists, which uses Presence Groups and
    a special Subscribe CSS.


    # Configure BLF Speed Dials


    To add a BLF Speed Dial to a phone, it is recommended that you modify the Phone
    Button Template; it is possible to modify the individual phone''s buttons, but
    doing so creates administrative burden and does not scale well. To set up BLF
    Speed Dial, follow these steps:


    +   1. Navigate to Device > Device Settings > Phone Button Template.

    2. Select, copy, copy, or create the appropriate template for the phone model/protocol.

    3. Add the Speed Dial feature to one or more of the available buttons.

    4. Apply the template to the phones.

    5. In the configuration page, select an available new BLF SD button and configure
    the Destination DN and display Label.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_345_0.png)


    Figure 11-19 Intercom Button Configuration


    Figure 11-20 illustrates the configuration of a BLF Speed Dial.


    # Configuring Presence-Enabled Call Lists


    As described earlier, the CUCM system can track the on-hook status of phones both
    through BLF Speed Dials and Presence-Enabled Call Lists. Presence-Enabled Call
    Lists use the device''s configured Subscribe CSS and/or Presence Group subscription
    policies to determine whether a device can watch a DN''s Presence status:


    +   - If the Subscribe applied does not include the Partition of the DN being
    watched, Presence status is unavailable.


    +   - If the Inter-Presence Group subscription is denied between the two groups,
    Presence status information is unavailable.


    +   - If both the Subscribe CSS and Presence Groups are used together, both must
    allow the subscription in order for Presence status to be watched.


    Configuring Presence-Enabled Call Lists is somewhat more complex than BLF Speed
    Dials, but it allows greater flexibility, precision, and scalability when large
    numbers of devices need to watch large numbers of DNs. To configure Presence-Enabled
    Call Lists, follow these steps:


    +   1. Navigate to System > Enterprise Parameters. Scroll down to Enterprise Parameters
    Configuration.


    +   2. Set Enable BLF for Call Lists to Enabled.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_346_0.png)


    Figure 11-20 Configuring a BLF Speed Dial


    Figure 11-21 illustrates the Enterprise BLF for Call Lists configuration.


    +   3. If using a custom Subscribe CSS is desired, create new Subscribe CSSs.
    It is generally recommended to create custom Subscribe CSSs and use existing Partitions,
    the overall Class of Control plan should be well thought out prior to making these
    changes.


    +   4. Apply the appropriate CSS to phones and SIP trunks as required.


    # Configuring Custom Presence Groups


    Because all devices and DNs are part of the Standard Presence Group by default
    and all devices can watch DNS within the same Presence Group, the configured Subscribe
    CSS and existing Partitions provide adequate control over Presence subscriptions.
    If a more complex design is required, it may be necessary to set up custom Presence
    Groups and define custom inter-Presence Group subscriptions, as follows:


    +   1. Navigate to System > Presence Group.


    +   2. Click Add New and configure a name.


    +   3. Set the Presence Group Relationship to each other Presence Group (Allow
    Subscription or Disallow Subscription) to control whether or not this group can
    watch the Presence status of other groups. Setting it to System Default references
    the Default Inter-Presence Group Subscription Enterprise discussed next. Each
    subscription is one-way: For example, Executives may be allowed to watch Employee
    status, but Employees may not be allowed to watch Executive status. Figure 11-22
    shows a Presence Group Configuration page.'
  merge: -1
  img_proc: true
