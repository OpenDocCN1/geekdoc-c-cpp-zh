    # Configuring Paging


    Paging is similar to the intercom concept; however, it provides only a one-way
    automatic path for communication. This is useful to allow broadcast messages,
    such as emergency notifications or to notify employees of holding calls.


    The CME paging system works by designating an ephone-dn as a paging number. Calls
    to the DN of this ephone-dn broadcast to the IP phones that you assigned to this
    paging group. Figure 7-17 illustrates this concept.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_225_0.png)


    **Figure 7-17** Call Paging Functionality


    As shown in Figure 7-17, calls to DN 5555 page the three phones assigned to that
    paging group. Calls to 5556 do the same for the paging group 81.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Note: You can assign an IP phone to only one paging group. However, CME allows
    you to create paging groups that page multiple paging groups, providing directed
    and company-wide paging functionality.


    CME supports paging in unicast and multicast configurations. Paging in unicast
    configuration causes the CME router to send individual messages to each one of
    the IP phones in the group. So, if six IP phones were assigned to paging group
    80, a page to the group would cause the CME router to stream six individual audio
    signals to the devices. Because of the overhead this, CME limits unicast paging
    groups to a maximum of ten IP phones.


    Multicast configuration allows the CME router to send one audio stream, which
    only the IP phones assigned to the paging group will receive. This allows a virtually
    limitless number of IP phones in each paging group. Sounds like the winning option,
    right? The catch is to support multicast, you must configure the foundation network
    environment to support multicast traffic. Some of these configurations can get
    complex and are covered in the CCNP configuration track.


    The three paging configurations are unicast, multicast paging, and multiple-group
    paging. Example 7-9 shows unicast, single-group paging.


    # Example 7-9 Configuring Unicast, Single-Group Paging


    ```

    CME_Voice(config)# ephone-dn 80

    CME_Voice(config-ephone-dn)# number 5555

    CME_Voice(config-ephone-dn)# paging

    CME_Voice(config-ephone-dn)# exit

    CME_Voice(config)# ephone 1

    CME_Voice(config-ephone)# paging-dn 80

    CME_Voice(config-ephone)# exit

    CME_Voice(config)# ephone 2

    CME_Voice(config-ephone)# paging-dn 80

    ```


    Calls to the paging number 5555 now page both phones 1 and 2 using unicast paging.
    To convert the configuration in Example 7-9 to multicast paging, you could modify
    the paging with the following syntax:


    ```

    CME_Voice(config)# ephone-dn 80

    CME_Voice(config-ephone-dn)# paging ip 239.1.1.100 port 2000

    ```


    The IP address that follows the paging command is a multicast address. Think of
    this as a "radio frequency" that the IP phones tune to each time a page occurs.
    Just like a car radio tuning to a specific FM frequency to a radio station, the
    IP phones tune into the address 239.1.1.100 and hear the audio stream for the
    paging system. As previously mentioned, your switches treat this multicast traffic
    just like it treats broadcasts, flooding your network on all ports each time a
    page occurs.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The paging configuration in Example 7-10 demonstrates the configuration of
    a multiple-group paging system. Ephones 1 and 2 continue to use ephone-dn 80 as
    their dedicated paging group. Ephones 3 and 4 use ephone-dn 81. This time, a third
    paging group enables you to page paging groups at once. This gives an organization
    the flexibility to page specific departments or the company as a whole.


    # Example 7-10  Configuring Multiple-Group Paging


    ```

    CME_Voice(config)# ephone-dn 80

    CME_Voice(config-ephone-dn)# number 5555

    CME_Voice(config-ephone-dn)# paging

    CME_Voice(config-ephone-dn)# exit

    CME_Voice(config)# ephone-dn 81

    CME_Voice(config-ephone-dn)# number 5556

    CME_Voice(config-ephone-dn)# paging

    CME_Voice(config-ephone-dn)# exit

    CME_Voice(config)# ephone-dn 82

    CME_Voice(config-ephone-dn)# paging group 80,81

    CME_Voice(config-ephone-dn)# exit

    CME_Voice(config)# ephone 1

    CME_Voice(config-ephone)# paging-dn 80

    CME_Voice(config-ephone)# exit

    CME_Voice(config)# ephone 2

    CME_Voice(config-ephone)# paging-dn 80

    CME_Voice(config-ephone)# exit

    CME_Voice(config)# ephone 3

    CME_Voice(config-ephone)# paging-dn 81

    CME_Voice(config-ephone)# exit

    CME_Voice(config)# ephone 4

    CME_Voice(config-ephone)# paging-dn 81

    ```


    With the configuration in Example 7-10, a call to DN 5555 ephones 1 and 2, a call
    to DN 5556 pages ephones 3 and 4, and a call to DN 5557 pages all ephones. You
    do not need to assign any ephones to paging-dn 82, because this ephone-dn represents
    a group of both paging-dns 80 and 81.


    **Note:** CME allows you to list up to ten paging numbers using the paging group
    command.


    If you choose to use CCP to configure paging, navigate to Unified Communications
    > Telephony Features > Paging Numbers. Clicking the Create button allows you to
    define numbers and associate phones, as shown in Figure 7-18. Think of this as
    the single-group configuration allows.


    CCP also allows the configuration of multiple-group paging. By navigating to Unified
    Communications > Telephony Features > Paging Groups, you can create paging group'
