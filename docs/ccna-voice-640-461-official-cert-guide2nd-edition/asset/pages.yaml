- pgno: 533
  md: '# CCNA Voice 640-461

    Official Cert Guide


    The official study guide helps you master all the topics on the CCNA Voice exam,
    including


    +   * Voice and data convergence

    * IP phone connections to the LAN infrastructure

    * Cisco Unified Communications Manager

    * CUXM IP phone configuration and voice productivity features

    * Gateways and trunks

    * Cisco Unity features

    * Smart Business Communications System

    * UC500 series for voice


    CCNA Voice 640-461 Official Cert Guide is a best-of-breed Cisco exam study guide
    that focuses specifically on the objectives for the CCNA Voice ICOMM exam. Senior
    voice consultants and trainers Chiara and Michael Valentine prepare preparation
    hints and test-tips, helping you identify areas of weakness and improve your knowledge
    and hands-on skills. Materials are presented in a concise manner, focusing on
    increasing your understanding and performance.


    CCNA Voice 640-461 Official Cert Guide presents you with an organized test preparation
    routine through the use of seven elements and techniques. "Do I Know Already"
    quizzes open each chapter and to help you know how much time you need to spend
    on each section. Chapter-ending Exam Preparation Tasks help you on key concepts
    you must know thoroughly.




    The CD-ROM contains two free, complete practice exams.


    Includes Exclusive Offer for 70% off Premium Edition ebook and Practice Test


    The companion CD-ROM contains the powerful Pearson IT Certification Practice engine
    that enables you to handle issues on individual topics or take a complete, timed
    exam. The assessment tool allows you to review your performance and provide feedback
    on module-by-module, laying out a complete assessment of your knowledge to help
    find where your study is most needed.


    Well-regarded for its level of detail, assessment features, challenges and review
    questions and exercises, this official study guide helps you master the concepts
    and techniques that will you succeed on the exam for the first time.


    CCNA 640-461 Official Cert Guide is part of a recommended learning list from Cisco
    that includes simulations and hands-on training from Cisco Authoring and self-study
    products from Cisco. To find out about instructor-led training, e-learning, and
    instruction authored by Cisco Learning Partners worldwide, please visit www.cisco.com/go/training.


    Pearson IT Practice Test minimum system requirements:

    Windows XP (SP3), Windows Vista (SP2) or later; .NET Framework 4.0 Client; SQL
    Server Compact edition Performance; 512 MB RAM; 50 MB free disk space


    Jeremy D Chiara, Cisco CCIE #11727, has in many facets of the Cisco and Voice
    exam. As an author, he has written multiple books for Cisco (http://www.interact.com).
    In Phoenix, Arizona, Jeremy teaches at Technical Training. Jeremy is the leader
    of AITEC and serves as a network consultant focusing on Cisco network and Voice
    over IP (VoIP) implementation and helps colleagues about Cisco topics at Tek (http://www.tekkert.com)
    in his "free" time.


    This volume is part of the Official Cert Guide series from Cisco. This series
    provides officially developed exam preparation materials that offer assessment,
    review, and help to identify weaknesses, concentrate their study efforts, and
    enhance their confidence as exam day nears.


    Michael Valentine has 15 years of experience in the IT field, specializing in
    network design and implementation. Currently he is a Cisco trainer with Skyline
    Advanced Technology and specializes in Cisco Unified Communications, CCNA, and
    CCNP concepts. His accessible, humorous, and effective teaching style has demonstrated
    for hundreds of students since he joined the University of British Columbia.


    Mike Valentine, Jeremy D. Chiara, CCNA Voice and CCIE


    CCNA Voice Quick Reference,

    several other Cisco Press titles.


