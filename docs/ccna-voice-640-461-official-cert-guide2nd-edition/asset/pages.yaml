- pgno: 377
  md: 'Default entries for the voicemail and voicemail pilot exist, which are used
    by all users of the CUCM system; these may be used and customized, or others may
    be added for other integrations and used by different subsets of users. The Voicemail
    Pilot Wizard has all eliminated a common problem in CUCM-to-CUC integrations with
    SCPP. Often, administrators would forget one or more of the critical steps of
    creating the Voicemail Pilot and linking it to the Hunt Pilot, and creating the
    Voicemail Profile and linking it to the Voicemail Pilot. Miss one of these, and
    the Messages button on the phones won''t work, even though you can dial the CUC
    Hunt Pilot directly and reach CUC.


    On the CUC server, a set of ports (number of available ports being linked by the
    server hardware capacity, and then by licensing) is defined, and each port is
    configured for various call-behavior options, including whether the port should
    answer calls, perform Message Waiting Indicator (MWI) or Message Notification,
    and other settings. Call routing within CUC can be controlled by (among other
    things) the phone system or the group port.


    MWI uses a separate and unique Directory Number (DN) for MWI On and MWI Off. The
    DNs must be configured (and match) in both CUCM and CUC. One of the tricks you
    can play on your co-workers is to dial the MWI DN from their phone: their MWI
    light will come on (dial MWI off and it turns off, too). This practical joke is
    also an effective way to test MWI functionality.


    An integration using Skinny Client Control Protocol (SCCP) may be secured using
    digital certificates and SCCP over port 2448. (Nonsecure SCCP uses port 2000.)


    # CUC Integration Using SIP


    The Session Initiation Protocol (SIP) integration components are slightly different
    from SCCP: Instead of the voicemail pilot pointing to a Hunt Pilot, it points
    to a Route Pattern, which in turn points to a SIP trunk. The SIP trunk is configured
    to connect to CUC. The number of ports is not defined on the CUCM server as is
    for SCCP integration; rather, they are only defined in CUC. Each port is configured
    to register with a SIP server (which is the CUCM server). A significant difference
    in a SIP integration is that there are no separate DNs for MWI On/Off; instead,
    SIP handles the signaling of the MWI lamp state. SIP can also be secured using
    port 5061. (Nonsecure SIP uses port 5060.) Figure 13-2 illustrates the SIP integration
    components on CUCM.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_377_0.png)


    Figure 13-2 SIP Voicemail Integration Components in CUCM'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# CUC Features


    This section describes many of the system-level features and settings of CUC.


    # System Settings


    The installation and configuration of CUC includes many system settings. Because
    the ICOMM exam scope is relatively limited, we describe only a few here.


    # General Configuration


    The General Configuration page includes the defaults for the system Time Zone,
    Language, and Maximum Greeting Length.


    # Roles


    The Roles page lists the eight administrative roles defined in the application.
    An administrative role gives (and limits) administrative capability to users.
    Table 13-2 lists these roles and brief descriptions of their functions.


    | Table 13-2 CUC Roles and Description |

    | Role | Description |

    | Audio text administrator | Administrators all handlers, directory handlers,
    and interview handlers. |

    | Greeting administrator | Manages all recorded greetings via TUI. |

    | Help desk administrator | Resets user passwords, unlocks user accounts, and
    views user settings. |

    | Mailbox access delegate account | Accesses all messages via messaging APIs.
    |

    | Remote administrator | Administrators the database using remote management tools.
    |

    | System administrator | Top-level connection administrator; accesses all administrative
    functions, reports, and tools for server and users. |

    | Technician | Accesses functions that enable management of system and phone system
    integration settings, views all system and user settings, runs all reports and
    diagnostic tools. |

    | User administrator | Administrators users; accesses all administration functions,
    user reports, and user administration tools. |


    # Enterprise Parameters and Service Parameters


    Equivalent to the pages of the same name in CUCM, these pages define and tune
    system and service parameters, such as what users can see and configure on the
    User Web Pages, Quality of Service (QoS) settings for CUC-generated traffic, and
    so on.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# LDAP


    These pages define the integration with an LDAP system to provide user synchronization
    and optional authentication.


    # Call Handlers


    Inbound calls to CUC are handled by a series of call handlers. The three basic
    types of call handlers are as follows:


    +   - System Handlers are used for greetings and can be customized to offer user
    input options ("For Sales, Pre ....") and automation, such as playing a different
    greeting when the business is closed.


    +   - Directory Handlers allow a caller to search the CUC directory for the user
    they want to contact. Different directories can be defined based on location,
    distribution list membership, and so on.


    +   - Interview Handlers provide the caller with recorded information, and then
    ask questions and the caller''s answers in a single message. Interview Handlers
    can be used for telephone-based reporting for almost any purpose, such as automating
    job applications.


    Three System Call Handlers are defined by default: Goodbye Call Handler, Opening
    Greeting, and Operator Call Handler. Opening Greeting is what outside calls (those
    without a voicemail box on the CUC server) hear; it is expected, of course, that
    the greeting will be customized by the business.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_379_0.png)


    # Call Routing


    Two primary call routing criteria are built into CUC: The application identifies
    Direct calls and Forwarded calls. A Direct Call is when the caller dials the CUC
    system directly, either by pressing the Messages button on his IP phone (dialing
    the voicemail pilot manually) or by dialing the public switched telephone network
    (PSTN) Direct Inward Dial (DID) of the CUC Auto-Attendant.


    The system examines the information presented in the call as it is routed to the
    CUC port for its decision making includes the following:


    +   - Calling number


    +   - Calling number


    +   - Forwarding station


    +   - Phone system/port


    +   - Schedule


    Two rules are defined under each category of call routing rule. The following
    sections describe these rules.


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_379_1.png)'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'Figure 13-3 illustrates the call routing actions and rule criteria within CUC.


    | Rule Condition | Call Action |

    |---|---|

    | Calling Number | Call Handler |

    | Called Number | Conversation |

    | Forwarded Station | User With Mailbox |

    | Phone System | |

    | Port | |

    | Schedule | |


    Figure 13-3 Call Routing Actions and Rule Criteria


    # Direct Routing Rules


    For calls placed directly to CUC, the following two default rules apply:


    +   - **Attempt Sign-In:** If the calling number is recognized as the primary
    DN associated with a voicemail box, the call is sent to the Attempt Sign-In Conversation,
    and the caller is prompted to enter his PIN to his voicemail box.

    - **Opening Greeting:** If the calling number is not associated with a voicemail
    box on the CUC server, the call is sent to the Opening Greeting.


    Additional rules can be defined administratively (for example, routing calls to
    the business'' customer help number to a specific call handler); the rules are
    processed top-down for each call, so the order of rules is critical to their behavior.


    # Forwarded Routing Rules


    For calls that are forwarded to CUC (typically because the user was on the phone
    or did not answer their phone), the following two default rules apply:


    +   - **Attempt Forward:** If the forwarding station is associated with a voicemail
    box on the CUC system, the forwarding phone user''s personal greeting is played.

    - **Opening Greeting:** If the forwarding station is not associated with a voicemail
    box on the CUC system, the Opening Greeting is played.


    # Call Routing Rules Filters


    When defining custom call routing rules (for Direct or Forwarded calls), the following
    filters can be applied (ingly or combined within a single rule):


    +   - Calling number

    - Called number'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# CCNA Voice 640-461 Official Cert Guide


    +   - Voicail port

    - Phone system

    - Forwarding station (applies only to forwarded calls)

    - Schedule


    The use of these rule capabilities provides administrators with a powerful customized
    call-routing capability.


    **Key Point:** CUC Calling Rules only apply if the call has been answered by CUC;
    for example, a PSTN call to a user''s phone DID did not be answered by CUC unless
    the IP phone forwards it because of a Busy or No Answer condition.




    Distribution Lists (DL) provide a simple way to send a voice message to a group
    of users. Two types of DL can be configured: System DIs are managed by the administrator
    and be made available to all users or a subset of users as required. Private DLs
    are managed and maintained by an individual user and usable only by the user who
    made them. The administrator can limit how many private lists a user can create
    and how many members can be in each.




    To set the security level for access to the CUC system, authentication rules for
    Voicemail (for TUI access via PIN) and Web Application (access to the User Web
    Pages) can be customized. Authentication rules specify how many failed login attempts
    can occur before the account is locked out, how long the account is locked, the
    minimum number of characters in a password, how often the password must be changed,
    and so on. The default Authentication Rules apply to all users. You can create
    new Authentication Rules with customized settings, and apply them to User Templates
    or even individual users. In this way, you could allow a four-digit password for
    a new User Template while keeping a five




    CUC incorporates the concepts of Partitions and Search Spaces in a similar way
    to CUCM. Objects that can receive calls, such as a user mailbox or call handler,
    are assigned a Partition; objects that can place or transfer calls are assigned
    a Search Space. The object being called must be one of the Partitions listed in
    the Search Partition of the object calling. A default Search Space, containing
    the default Partition, allows all objects to reach all other objects until the
    administrator customizes the system as needed.


    Using this mechanism, it is possible to create a directory handler for the Vancouver
    office, and limit the Search Space of the directory handler to include only the
    Vancouver'
  merge: -1
  img_proc: true
