    # Notification Devices


    Message notification should not be confused with MWI; notification refers to CUC
    making a phone call or sending an email to a user that he has a new message. CUC
    supports notification on a Pager, Work Phone, Home Phone, and Mobile Phone and
    via SMTP by default. Additional notification devices may be added.


    For each device, the following as needed:


    +   - Enable: Check this box to allow CUC to send notifications to this device.

    - Display Name: Modifies the name as needed.

    - Delay Before First Notification Event: Sets the number of minutes CUC waits
    for a new message is left before it sends a notification using this device.

    - Notify Repeat Interval: How frequently CUC resends the notification.

    - Notify Me Of: Select the checkboxes to allow CUC notifications for All Messages,
    Voice Messages, Fax Messages, Calendar Appointments, Calendar Meetings, and for
    each type, to send for Urgent Only.'
