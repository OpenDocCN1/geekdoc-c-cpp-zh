    # Figure 10-4 Phone URLs Changed from Hostnames to Host IP Addresses


    The signaling and voice bearer stream paths are the same as in the single-site
    deployment; the difference is simply that the branch phones send all signaling
    traffic over the WAN to the CUCM server, along with non-RTP voice streams to IP
    phones at other locations. However, if a branch phone calls another phone, both
    phones signal to the CUCM across the WAN, and the RTP voice streams stay local
    to the branch—direct from phone to one, always. Figure 10-5 illustrates Centralized
    Branch call flow.


