    # Configuring Call Park and Directed Call Park


    The Call Park feature allows a user to park a call at a reserved DN, and retrieve
    it from any IP Phone. Directed Call Park is similar, with the added features of
    requiring a prefix code to retrieve the call and specify a different recursion
    number. The following steps configure the Call Park and Directed Call Park features:


    +   1. In CM Administration, navigate to Call Routing > Call Park.

    2. Click Add New.

    3. Specify either an individual DN or a range of DNs to be used for Call Park.
    The number can be partitioned if desired by selecting a custom Partition or range
    is associated with the CUCM server you select from the pull-down; if you are associating
    Call Park slots to multiple servers, ensure that the number ranges do not overlap
    between servers.

    4. Click Save.


    > Note: A Call Park number range is defined with the same wildcard used in Route
    Patterns; for example, the range of 88X defines ten Call Park slots numbered 8800
    through 8809.


    Figure 11-14 shows Call Park configuration.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/e4ad7862dc47b4e5de0cde3b4550ad65_339_0.png)


    Configuring Directed Call Park is similar. Follow these steps:


    +   1. In CM Administration, navigate to Call Routing > Directed Call Park.

    2. Click Add New.

    3. Enter a unique number or range and specify a Partition if desired.

    4. Specify the Reversion Number (the DN to which a call will be forwarded if not
    picked up from the park slot before the Call Park Reversion timer [60 seconds
    by de-fault] expires).

    5. Specify the Reversion Calling Search Space to allow the phone to find the reversion
    number specified above, if it is not in the normal CSS of the phone or line.

    6. Specify the Retrieval Prefix, which is the code the person picking up the parked
    call must dial in order to retrieve it.

    7. Click Save.


    Figure 11-15 shows Directed Call Park configuration.'
  merge: -1
