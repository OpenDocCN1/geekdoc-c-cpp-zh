- pgno: 137
  md: '# Foundation Topics


    # Configuring Physical Voice Port Characteristics


    Before you can dive fully into the configuration of dial-plans using dial peers,
    you must first think about the physical characteristics of the voice ports on
    the router. Obviously, the voice ports plug into cables, which eventually connect
    to far-end devices. Beyond that, you can tune a few additional settings on the
    router to allow the voice ports to operate exactly to your specification. This
    section divides the discussion of these configurations into analog and digital
    forms.


    # Configuring Analog Voice Ports


    Unlike Ethernet, when you connect a cable to an analog voice port on a router,
    it just works (provided a signal is coming from the other end). The router receives
    the electrical signals from the line and processes them normally. In addition
    to normal call processing, each interface type has a few settings you can tune
    to change the way it operates with the other end of the connection. This section
    describes configuration options for Foreign Exchange Station (FXS) ports and Foreign
    Exchange Office (FXO) ports.


    # Foreign Exchange Station Ports


    FXS ports connect to end stations—that is, typical analog devices such as telephones,
    fax machines, and modems (shown in Figure 6-1).


    > Key Topic


    ![](img/e4ad7862dc47b4e5de0cde3b4550ad65_137_0.png)


    Figure 6-1 FXS Port Connections


    When you are ready to configure your FXS voice ports, the best place to start
    is to find out what voice ports your router is equipped with. You can do this
    quickly by using the show voice port summary command, as shown in Example 6-1.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Example 6-1 Identifying Voice Ports Using voice port summary


    | CME_Voice# show voice port summary |

    | PORT | CH | SIG-TYPE | ADMIN OPER STATUS | STATUS | EC |

    |---|---|---|---|---|---||

    | 0/0/0 | | fxs-1ls | up | dorm on-hook | idle | y |

    | 0/0/1 | | fxs-1ls | up | dorm on-hook | idle | y |

    | 0/2/0 | | fxo-1ls | up | dorm idle | on-hook | y |

    | 0/2/1 | | fxo-1ls | up | dorm idle | on-hook | y |

    | 0/2/2 | | fxo-1ls | up | dorm idle | on-hook | y |

    | 0/2/3 | | fxo-1ls | up | dorm idle | on-hook | y |


    **Note:** If you are using your router for Cisco Unified Communication Manager
    Express (CME), each phone-dn you configure shows up under the **show voice port
    summary** output as an EXFS port.


    Based on the output from Example 6-1, you can see that this router is equipped
    with two FXS ports and four FXO ports.


    FXS ports have three common areas of configuration:


    +   - Signaling

    - Call progress tones

    - Caller ID information


    You can use two types of signaling for analog FXS interfaces: The signal type
    dictates the method used by the attached device to signal that a phone is going
    off-hook. Table 6-2 briefly describes the differences between ground start and
    loop start signaling.


    # Table 6-2 Comparing Ground Start and Loop Start


    | Ground Start | Loop Start |

    |---|---|n| Signals a new connection by grounding two of the wires in the cable
    temporarily | Signals by completing a circuit (by lifting the handset off-hook)
    and dropping the total DC voltage down the line |

    | Must be configured | Is the default |

    | Typically used when connecting to PBX equipment | Typically used when connecting
    to analog devices, such as telephones, fax machines, and | |


    You can use the syntax shown in Example 6-2 to set the signaling type on the voice
    port.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Example 6-2 Configuring FXS Voice-port 0/0/0


    ```

    CME_Voice(config)# voice-port 0/0/0 CME_Voice(config-voiceport)# signal ? groundStart
    Start loopStart Loop Start CME_Voice(config-voiceport)# signal loopStart

    ```


    If you have traveled to other countries, you probably noticed that phones sound
    different in different regions. Based on your geographical location, dial tones
    might be higher or lower and busy signals might be fast or slow. These are all
    considered progress tones: audio signals that inform the caller how the call is
    progressing. By default, the FXS port of your router uses the progress tones from
    the United States. If your router is serving another part of the world, use the
    command shown in Example 6-3 to adjust the progress tones.


    # Example 6-3 Adjusting Call Progress Tones


    ```

    CME_Voice(config)# voice-port 0/0/0 CME_Voice(config-voiceport)# cptone ? locale
    2 letter ISO-3166 country

    ```


    | AR Argentina | IN India | PE Peru |

    | AU Australia | ID Indonesia | PH Philippines |

    | AT Austria | IE Ireland | PL Poland |

    | BE Belgium | IL Israel | PT Portugal |

    | BR Brazil | IT Italy | RU Russian Federation |

    | CA Canada | JP Japan | SA Saudi Arabia |

    | CN China | JO Jordan | SG Singapore |

    | CO Colombia | KE Kenya | SK Slovenia |

    | C1 Custom | KR Korea Republic | SI Slovenia |

    | C2 Custom | KW Kuwait | ZA South Africa |

    | CY Cyprus | LB Lebanon | ES Spain |

    | CZ Czech Republic | LU Luxembourg | SE Sweden |

    | DK Denmark | MY Malaysia | CH Switzerland |

    | EG Egypt | MX Mexico | TW Taiwan |

    | FI Finland | NP Nepal | TH Thailand |

    | FR France | NL Netherlands | TR Turkey |

    | DE Germany | NZ New Zealand | AE United Arab Emirates |

    | GH Ghana | NG Nigeria | GB United Kingdom |

    | GR Greece | NO Norway | US United States |

    | HK Hong Kong | OM Oman | VE Venezuela |

    | HU Hungary | PK Pakistan | ZW Zimbabwe |

    | IS Iceland | PA Panama |


    Simply enter the two-digit country code to change the sound of all the progress
    tones on the device attached to the FXS port.'
