    The key areas in Example 15-2 are highlighted. At the beginning of the debug output
    that the CME router matches incoming dial-peer when the IP phone with extension
    1500 goes off-hook (incoming dial peer 20005 matched). Then, CME analyzes each
    digit it is dialed from the IP phone. The first digit dialed is a 9. The debug
