    # Cisco Unity Connection Administration


    The CUC Administration interface uses a tree structure similar to the Windows
    Explorer, making finding and navigating to the desired page easy. The main menu
    items are described in the following sections; more detailed information is presented
    in Chapter 13, "Voicemail Integration with Cisco Unity Connection.


    +   **Users:** Provides access to the local user database to create or edit users.
    User import and synchronization menu options are also listed here.


    +   **Class of Service:** Defines the features available to the user, including
    Licensed and Advanced features, and may apply other user interaction limits. Class
    of Service is a flexible and powerful method of controlling users'' interaction
    with CUC, particularly for licensed features. There is no limit to the number
    of Classes of Service that can be created, making it possible to build a diverse
    and specific range of Classes of Service to cover any combination of requirements.


    +   **Templates:** Provide a way to define common settings for Users, Contacts,
    or Call Handlers. When creating a new one of three types of object, selecting
    the appropriate template applies all but the individually specific information
    for each object, making the process faster and more accurate.


    +   **Contacts:** A System Contact is an account that provides interaction with
    CUC with an associated mailbox. Perhaps a consultant works in a customer office
    and interacts with customer team on a daily basis, but has a mailbox on the system
    his firm corporate office. A System Contact can provide a directory for CUC users
    to send messages to, with the messages relayed to the consultant''s mailbox at
    the corporate office.


    +   **Distribution Lists:** Allow one message to be delivered to multiple users.
    As distribution lists can be created as needed. A Class of Service setting can
    prevent users from using System Distribution Lists.


    +   **Call Management:** Defines Call Handlers. Call Handlers are the function
    structures of CUC and can be configured to answer calls, play greetings, route
    calls, and take messages. Specialized call handlers include *Directory Handlers*,
    which allow a caller to search the directory and either call or leave a message
    for the selected user, and *Interview Handlers*, which interact with caller by
    playing a series of recorded messages, then collecting the answers in a single
    message.


    +   **Message Storage:** Allows mailbox quotas to be set, enforcing limits on
    mailbox size to prevent running out of disk space.'
