  md: 'We will analyze each of them in detail, giving some application examples.


    # ABSTRACTION


    Abstraction is the first principle of the object-oriented paradigm. What is abstraction?

    Think when you look at a real-world object, for example a tree. You need to get
    the most important information about this object in order to model it in a computer
    program. Therefore, you should worry about what you really need to know: in your
    case you only need to know the scientific name of the tree, its type of leaf and
    where it grows geographically. However, you do not care what type of root grows.
    This information will be created in the program and an object will ONLY show the
    outside (that is, to the objects that you use this information) the necessary
    interfaces. No more less.

    Here you are using the abstraction technique. The object will never show any other
    type of information other than what is necessary. You get only what you are interested
    in modeling, excluding what you don''t care to know to model said object.

    Therefore, an abstraction focuses on the external view of an object using the
    technique of least compromise.

    This technique refers to the process by which an interface of an object (the information
    it shows to the outside) shows only its specific behavior. Speaking of interface,
    we refer to the functionality (in OOP, methods) that each object will show to
    the outside without having to specify its implementation, that is, its details.

    In our example of the PERSONA class, the chosen interface can be:


    ```

    Run()

    Walk()

    Sleep()

    ```


    So only the exterior will show this functionality and nothing else.


    # Properties of an abstraction


    +   Every abstraction has 2 properties:

    * Static: it is not modifiable, for example: Name of external of a person.'
