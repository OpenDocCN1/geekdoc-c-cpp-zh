    # CLASS


    A class is a description of a set of similar objects. It has common methods and
    characteristics of this set.


    In other words, a class is a template where the characteristics and functions
    common to all the objects it contains are defined.


    For example, the class PERSON has Name, Age and Weight as common characteristics
    and Running, Walking and Sleeping as common methods (there can be many more).


    Then, every object that is created in a programming language of the type of this
    class PERSON will automatically have the attributes and methods of that class
    available.


    Let''s get on with the theory. A class is the declaration of an object type. Something
    like abstract data types in a programming language (for example, the integer or
    string type). Every time an object is constructed from a class, we are creating
    an instance of that class. This concept of instance is something awfully specific
    to OOP. Instance is the creation of an object in the memory of a PC.


