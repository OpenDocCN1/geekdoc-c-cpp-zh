  md: '# FUNCTIONAL PROGRAMMING


    The Functional Programming is a declarative paradigm which has been gaining a
    lot of popularity lately and, in order not to be left behind, it would be important
    that you learn it. Even languages that are strongly Object Oriented had to incorporate
    Functional Programming due to their high increasing use, such as Java, which in
    version 8 incorporated elements of this type of programming.


    Functional Programming emphasizes WHAT we are doing and not HOW we are doing it.
    This is called the Imperative Approach.


    Functional language emphasizes statements rather than executing statements, unlike
    other types of languages that emphasize a local or global state.


    We will not describe flow controls; we will not use cycles or conditions. These
    ideas were based on the lambda calculus.


    LISP was the first language used, developed in 1960.


    On the other hand, there is another term that is also gaining popularity, which
    is Reactive Programming, and this also uses Functional Programming, However, we
    will not go into Reactive Programming as it will be the subject of another book.'
  merge: -1
