  md: '# ADVANTAGES AND DISADVANTAGES OF FUNCTIONAL PROGRAMMING


    Like any programming paradigm, there are advantages and disadvantages that we
    must know before understanding whether it is good for a type of software project.

    The advantages are as follows:


    +   - Functions are treated as values - improves code understanding and readability.

    - Supports the concept of lazy evaluation: it means that the value is only evaluated
    and stored when necessary.

    - The flow is clear: the state is not changed implicitly.

    - Efficient use of concurrency: due to the nature of pure functions that prevent
    variables from changing.

    - They do not have assignment statements: after a value is passed to a variable,
    it will not change (constant).

    - Focus on the WHAT and not the HOW.


    +   On the other hand, there are some disadvantages that you need to know:

    - It is not easy: it is a bit complicated to learn for a beginner and even more
    so if it comes from Object Oriented Programming.

    - Difficult to maintain because there is the evolution of objects

    - Complicated needs: needs refactoring

    - Complication when representing real world objects


    In short, each programmer is different and must know when to use which paradigm,
    since neither is a panacea, and all have their pros and cons.

    However, we will see later the differences between Functional Programming and
    Object-Oriented Programming.


    # CEPTS


    +   There are 4 fundamental concepts of Functional Programming:

    - PURE FUNCTIONS'
