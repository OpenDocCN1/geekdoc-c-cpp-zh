  md: '# FUNCTIONAL PROGRAMMING PRINCIPLES


    The principles of Functional Programming are the following:


    +   * **USE OF FUNCTIONS**: Everything is built by means of functions. This way
    of working is not only simple, orderly, clear, easy to test, but it is also practice
    used by great figures such as Julius Caesar or Napoleon. They clearly did not
    use Python (or at least there is no record of it), but they applied the concept
    of "divide and conquer". Functional Programming uses this strategy for almost
    everything.

    * **FIRST CLASS FUNCTIONS**: Functions are treated as one more variable. They
    can even be "returned". This concept means that one function can call another
    and this returns data.

    * **PURE FUNCTIONS**: It means that it is totally predictive. The same input data
    will produce the same output data. You can replace the input parameters without
    altering the flow of the program.

    * **RECURSIVITY**: Functions can call themselves, simplifying tasks such as traversing
    data trees or managing variables.

    * **IMMUTABILITY**: There are no variables, only constants. Basically, this concept
    implies understanding its potential and putting it into practice is like giving
    your brain a "reset" marked by the other paradigms. It''s a start over the basics
    of programming. But is it worth it? It is relearning how to use variables.


    Speaking of this subject IMMUTABILITY the Software usually fail? In most cases,
    it comes from a variable that has been modified. This causes a block of code to
    be executed with conditions not foreseen by anyone. You will have to review each
    line to find the failure variable.

    I give you a reflection: what if you use variables that you cannot modify? In
    other words, what if we create a new constant for each modification? If I tell
    you that at the performance level this is more efficient? It is an interesting
    concept to apply.

    Let''s continue with the principles.


    LAZY EVALUATION: Also called NON-STRICT. In Functional'
