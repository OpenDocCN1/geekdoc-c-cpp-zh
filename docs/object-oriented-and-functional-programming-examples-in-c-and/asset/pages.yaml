    Let''s look at each of these key concepts.


    # PURE FUNCTIONS


    A function is P, when it meets these fundamental requirements:

    • Same arguments always return the same. This is called referential transparency.

    • It has no collateral effect.


    Let''s clarify the terms a bit. Referential transparency implies that the behavior
    of pure functions depends only on the arguments passed to the function in an explicit
    way.

    It means if you pass the same input data, the function should generate the same
    return value.

    Example:


    ```

    const sum = (a, b) => (a + b);

    sum(1, 2); // => 5

    sum(1, 2); // => 5

    ```


    In this sum function, we pass it 2 numeric arguments (1 and 2), it should always
    return the same result. If we replaced the sum (1,2) invocations with 3 in our
    program, everything should still work fine. This is thanks to Referential Transparency.'
