    # HERITAGE


    Let''s move on to understand this important principle of Object Orientation. This
    concept implies that a new class is created from an existing class. That is, one
    class depends on another, called Base Class. The inheriting class is commonly
    called a Derived Class or Subclass.


    The most important thing to understand about this topic is that the subclass inherits
    the attributes and behavior of the base class if the latter has the appropriate
    access modifiers (public or protected). Remember that the private access modifier
    only allows objects to obtain the attributes and methods of their own class.


    This principle of inheritance allows us to create a specialized hierarchical class
    structure, so when we as programmers create a class and inherit from it, we do
    not have to recreate its attributes and methods from scratch, but rather the programming
    language allows create them from your base class, which allows ease in writing
    code.


    # Class Hierarchy


    Classes can be hierarchized through a parent-child tree, which begins with a main
    base class called a superclass or parent, and its derived classes become specialized
    as they go down the tree.


    For example, let''s think about the ANIMAL class. This class will contain generic
    attributes and methods for an animal. But if we create, for example, a Carnivore,
    it will have a specialization that is to eat meat, which does not happen if we
    create a class called Herbivore, although it has the Eat method, will not do it
    in the same way as a carnivore. Therefore, we are specializing.


    In this way, classes can continue to be created from existing classes, within
    their hierarchy. There is not limit.


    However, it is not very advisable for the tree to be quite large as a disadvantage
    is that the programmer can get lost in the code and it becomes unreachable.


    # Relations between classes'
