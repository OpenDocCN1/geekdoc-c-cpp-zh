    # POLYMORPHISM


    Polymorphism is another of the principles of the Object-Oriented paradigm. This
    principle is closely related to the principle of Inheritance that we saw earlier.


    I will try to explain this topic in a simple way, since it seems somewhat complicated,
    although it is not.


    Let''s start by talking about pure theory. Polymorphism, for several authors,
    implies a relaxation of the type system, in such a way that a reference to a class
    (attribute, parameter, etc.), accepts addresses of objects of said class and its
    derived classes.


    As we can see, inheritance and polymorphism are intricately linked concepts. We
    implement polymorphism in classification hierarchies that occur through inheritance.


    As we talk about the Type System, it is important that we look at this concept
    first.


    # TYPE SYSTEM


    I''m going to assume that you already know what a data type means in a programming
    language. But I''m going to mention it in case you don''t know it. There are weakly
    typed languages, such as PHP or JavaScript, as well as strongly typed languages
    like C or Java.


    ### What is a Data Type?


    A data type is, for a variable, what it is going to store inside. That is, if
    a variable is of type integer, it means that it can only store an integer. If
    it is of type string (string), it will obviously only store strings.


    ### Weakly Typed language


    So, a weakly typed language is one that is not interested in compilation mode
    what type of data a variable is going to store but takes it automatically in execution
    mode when there is an assignment.


    For example, if we have the variable number, we all think that it will store an
    integer. But if we do

    Number = "Leonel"        Then you will be storing a string.

    But if later in the program we do

    Number = 73

    Then the compiler will understand that variable is now an integer. This means
    that a variable can change the data type in the same thread, depending on its
    current assignment.


    # Strongly Typed Language


    A strongly typed language is one that is interested in what type of data each
    of the variables will contain before its execution begins. That is, if when programming
    we have Number = 73 (integer data type) So then we can''t do Number = "Leonel"
    (data type string) Because that variable already has a data type assigned which
    is integer. If we try to do the type of change in a strongly typed language, then
    the compiler will show an error.


    So, what is a polymorphism?


    In object and class theory, and as strongly typed languages work, a variable must
    point to an object of the class indicated at the beginning of its declaration.
    That is, an object of a corresponding type must point to that type always

    For example, in C#


    ```

    Car myCar = new Car();

    ```


    In this example we have that the myCar object is of type Auto and is constructed
    by making a new of Auto, not of another class.


    Okay. Polymorphism is a relaxation of this strongly typed system, that is, it
    is feasible to be able to assign objects of derived classes.

    But this is not so relaxed. It is only feasible to accept objects of classes of
    the corresponding hierarchy, not of any class.

    For example, we have 3 classes, a parent and 2 derivatives:

    PARENT CLASS: Vehicle

    DERIVATIVE CLASSES: Car, Bike


    For example, in C#


    ```

    Vehicle myVehicle = new Vehicle ();

    Car myCar = new Car();

    Bike myBike = new Bike();

    ```


    If we declare a method that receives a vehicle, we think that we should only send
    it a Vehicle object, but the principle of polymorphism says that it is possible
    to send it a derived class object. For example


    Start (Vehicle vehicle);


    ```

    myVehicle.Start(myBike);

    myVehicle.Start(myBike);

    ```


    So, the start method has as a parameter an object of type Vehicle, but it is possible
    to send a car or a motorcycle, because both are classes derived from Vehicle.

    This is the main idea of the polymorphism principle, to be able to use a method
    to send it different objects and its behavior to vary depending on the sent object.
    This improves the readability, maintainability, and reuse of code.


    # SUMMARY


    The Object-Oriented Paradigm is a way of analyzing, designing and programming
    software to create quality products using different principles, based on modeling
    real world objects using the technique of abstraction. It differs from Structured
    Programming in that it uses functions or procedures from beginning to end based
    on data and algorithms.

    Object Oriented Programming uses the following principles:


    - Objects.

    - Lessons.

    - Inheritance.

    - Encapsulation.

    - Modularity.

    - Abstraction.

    - Polymorphism.


    Classes are user-defined types. Templates that define attributes and behavior.
    Objects are instances of classes in memory.

    Inheritance is a way of generalizing /specializing classes to reuse the data and
    behaviors of the base classes.

    Encapsulation is a way of hiding information about a class from the outside.

    Modularity is another principle of Object Orientation in which we divide the program
    into modules, which must have high cohesion and low coupling.

    Abstraction is the technique of capturing desirable information for an object
    and leaving aside what is not of interest. The object shows the outside only what
    it should show. No more no less.

    Polymorphism is the last principle in which a method created with a base class
    parameter, in turn admits objects of its derived classes to extend its functionality.


    The advantages are clear:


    - Improves readability.

    - Improves software reuse.

    - It is easy to understand, using abstraction of real-world objects.

    - We can eliminate redundant code.

    - We can divide the work to make it simpler (modularity).

    - Improved software maintenance.

    - Software complexity is managed efficiently.


    The disadvantages are:

    - It is not highly recommended if we have easy to develop software.

    - Learning curve for those who come from a structured development.

    - The execution of programs may be slower than usual.


    Recommended object-oriented languages to learn:


    - C

    - C++

    - C#

    - Java

    - Python


