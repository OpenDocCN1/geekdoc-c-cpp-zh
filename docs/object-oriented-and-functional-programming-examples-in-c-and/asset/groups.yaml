    that is understandable and executed by a computer. There are many programming
    languages and different types of computers. But here the important thing is the
    concept of algorithm, which are the necessary steps to solve a problem. In terms
    of the data required to represent the case of a problem and the set of steps necessary
    to produce the desired result.


    Programming languages must give the programmer a notational way to represent the
    process and the data with which every algorithm is going to work.


    Speaking of data, it is represented as strings of binary digits, so we need to
    represent data types to give them structure and meaning.


