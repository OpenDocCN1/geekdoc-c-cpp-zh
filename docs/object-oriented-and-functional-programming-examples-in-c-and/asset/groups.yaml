    \n-   无需阅读另一个类即可理解一个类\n-   修改一个类而不影响另一个类\n-   提高代码的可读性\n\n让我们继续讨论模块化原则。正如我们所看到的，程序员将编程的所有逻辑划分为这些模块。这些模块包含了我们将使用的类，用这些类来抽象属性（数据）和行为（方法或函数），这些行为将被它们的实例（即对象）所使用。通过这种方式，我们能够重用代码、更好地理解它、使其组织良好、分离特定任务并执行复杂工作，因为我们正在使用“分而治”的原则。\n\
