- md: '

    # OBJECT-ORIENTED PROGRAMMING PARADIGM


    It is one of the most used to program Software, since it has many advantages

    in terms of issues such as reuse, abstraction, solving real world problems, etc.

    Some of the things we should know about this Paradigm:


    - Objects are created and destroyed

    - We use classes to define objects

    - Classes have attributes and methods (behavior)


    This Paradigm is the objective of this book and all the basic concepts will be

    studied so that you can apply it in a programming language that accepts it.

    The most common languages that adopt this Paradigm are: C#, Java, C++,

    VB.NET, among others.


    # LOGIC PROGRAMMING PARADIGM


    This is a type of Paradigm of programming that is within the Paradigm of Declarative
    type. This Paradigm of logic programming revolves around the concept of predicate
    or relation of elements. It is based on the concept of the more mathematical acceptance
    function. Mathematical logic is the simplest way to formally express complex problems
    and to be able to solve them based on rules, hypotheses and theorems. For example:


    - Logical statements seen as a programming language

    - Logical statements that are for formal specifications that describe the behavior
    of a program.

    - Data and Boolean expressions used in almost all programming languages.

    - Boolean algebra


    Logic programming involves the use of facts and relationships to represent information
    and to answer queries.

    Don''t forget the following equation.

    Algorithm = logic + control


    # FUNCTIONAL PROGRAMMING PARADIGM


    This is a type of programming paradigm that is based on the use of Functions for
    problem solving, avoiding mutable data and sharing states between functions.


    Functions that can receive functions as parameters and return functions as results
    are called Higher Order Function.

    Functional programming is a Declarative Paradigm, like logic programming. We focus
    on the WHAT and not the HOW (this would be imperative). What does it mean? We
    do not use flow controls, that is, neither loops nor conditionals, only functions.


    NOTE: If you are interested in Functional Programming, I have written a book on
    INTRODUCTION TO FUNCTIONAL PROGRAMMING that you can purchase at Amazon Kindle
    stores.


    # DECLARATIVE AND IMPERATIVE PARADIGMS


    As we mentioned previously, there are Paradigms of Programming called imperatives
    and declaratives.

    We already saw 2 of the declaratives: logical and functional.

    In DECLARATIVE programming, what they do is describe the problem to be solved,
    they are programmed by saying what they want to solve at the user level, but not
    the instructions necessary to solve it.

    The Prolog, Maude, SQL, Haskell, and Erlang languages are examples of declarative
    languages.

    as we discussed earlier, they focus on the WHAT rather than the HOW

    On the other hand, IMPERATIVE programming requires knowing what data is required
    for the calculation, associating the memory addresses with these and carrying
    out a sequence of transformations on the stored data by step in such a way that
    the final state represents the correct result.

    Imperative programming is the oldest programming paradigm that exists. It consists
    of instructions which are chained one after the other that determine what the
    computer must always do to obtain a result.

    The most popular programming languages are:

    Fortran, Basic, C, C#, Pascal, Cobol, Python, Java, C++, etc.


    # DIFFERENCE BETWEEN DECLARATIVE AND IMPERATIVE LANGUAGES


    - IMPERATIVE PROGRAMMING: describes step by step a set of instructions that are
    executed to vary the state of a program. Use the concept of algorithm (steps necessary
    to solve a problem). The main advantage is that it is simpler than the declarative
    one, easy to implement and to be able to reuse the same code in different places
    in the program.

    - DECLARATIVE PROGRAMMING: sentences are used that describe the problem, programming
    what is to be solved at the user level, but the instructions necessary for the
    solution are not indicated. As a fundamental advantage is that in which in declarative
    languages mathematical reasoning is used.


