  mdcn: '


    # 面向对象编程范式


    它是最常用的软件编程范式之一，因为它在重用、抽象、解决现实世界问题等方面具有许多优势。

    关于这种范式，我们需要了解的一些内容：


    - 对象的创建与销毁

    - 我们使用类（classes）来定义对象

    - 类具有属性和方法（行为）


    这种范式是本书的主题，我们将学习所有的基本概念，以便你能将其应用于支持该范式的编程语言中。

    采用这种范式的常用语言有：C#、Java、C++、VB.NET 等。


    # 逻辑编程范式


    这是声明式（Declarative）范式的一种编程范式。逻辑编程范式围绕谓词或元素间关系的概念展开。它基于数学数学接受函数的概念。数学逻辑是形式化表达复杂问题并根据规则、假设和定理解决问题最简单的方法。例如：


    - 被视为逻辑语句的逻辑陈述

    - 用于描述程序行为的形式化规范

    - 几乎所有编程语言中的数据和布尔表达式

    - 逻辑编程涉及使用事实和关系来表示信息并回答查询。不要忘记公式：

    算法 = 逻辑 + 控制


    # 函数式编程范式


    这是一类编程范式，基于使用函数来解决问题，避免可变数据和函数间的状态共享。


    接收函数作为参数并返回函数作为结果的被称为高阶函数（Order Order）。函数式编程是一种声明式范式，类似于逻辑编程。我们关注“做什么”（WHAT）而不是“怎么做”（HOW）（即不使用控制语句，如循环或条件语句）。注意：如果你对函数式编程感兴趣，可以在亚马逊购买《函数式编程导论》这本书。


    # 声明式与命令式范式


    正如前面提到的，存在声明式（Declarative）和命令式（Imperative）编程范式。我们已经看到了声明式的：逻辑和函数式。在声明式编程中，它们做的是在用户层面描述要解决的问题。Prolog、Maude、Haskell
    和 Erlang 都是声明式语言的示例。正如之前讨论的，它们关注“做什么”。


    另一方面，命令式编程需要为了计算所需的数据，通过对存储的数据执行一系列转换，以获得最终的结果。命令式编程是最古老的编程范式，它由一个接一个的指令组成，决定了计算机必须做什么。最流行的编程语言有：Fortran、Basic、C、Pascal、Cobol、Python、Java、C++
    等。


    # 声明式与命令式语言的区别


    - 命令式编程：逐步描述一组执行指令以改变程序的状态。它使用算法概念（解决问题的必要步骤）。其主要优势是比声明式的更简单、易于实现并能够在程序的不同地方重用代码。

    - 声明式编程：使用的语句用于描述要解决的问题，即在用户层面，但没有指示解决方案所需的指令。其基本优势是声明式语言中使用了数学推理。


    # 什么是编程？


    在学习面向对象范式之前，让我们简单回顾一下什么是编程。


    编程是将算法在某种计算机可以理解并执行的语言中进行编码的过程。有许多编程语言和类型的计算机。但这里重要的是算法概念，即解决问题的必要步骤。在表示问题案例方面，需要产生所需结果的数据。


    编程语言必须为程序员提供一种方式来表示过程以及算法运行的数据。


    谈到数据，它被表示为数字位，因此我们需要表示数据类型以赋予它们结构和意义。


    简而言之，编程是程序员使用编程语言开发计算机程序的艺术，这种语言包含有限且确定的步骤，并使用数据结构、过程和任何可行的范式来解决问题。


    我不再详细阐述这个概念，因为本书的目的不是深入研究编程本身的概念，而是了解最常用的编程范式之一：面向对象范式。


    # 什么是面向对象编程？


    面向对象编程（或 OOP）是目前最广泛使用的软件开发范式，它基于一系列用于此类开发的通用原则，即：


    - 对象

    - 类

    - 继承

    - 封装

    - 多态

    - 抽象

    - 模块化


    也就是说，程序员使用这种范式解决问题，使用面向对象的语言创建现实世界对象，并使用抽象技术通过赋予它们特征和行为来进行建模。我们将详细分析每个原则并给出相应的示例。


    # 面向对象范式的目标


    让我们从分析这种范式的特性开始：


    - 便于创建软件

    - 使用现实世界对象并对其建模

    - 使用概念


    另一方面，OOP 有以下目的：


    - 更好的维护

    - 扩展功能

    - 可用性


    我们将详细查看每个特性：


    # OOP 能够轻松创建高质量软件


    OOP 允许创建漏洞更少的软件，因为它比其他范式更健壮、质量更高。


    # 更好的维护


    使用 OOP 维护软件更容易执行，因为必须接触代码的开发者更有可能地理解主程序员想做什么，因此代码的更改或改进更容易实现。


    # 功能扩展


    使用 OOP 开发的软件，其特征扩展比其他范式更好，因为它允许使用现实世界的抽象的类。


    # 提高软件重用


    重用建立在上述概念之上，通过创建封装的类（组件），我们可以在不同的项目中使用它们，而无需重新编写它们。这一特性是该范式中最重要的特性之一。


    # 可用性


    关于可用性，它指的是界面的易用程度和操作质量（用户/软件选项的关系），因此开发者应该关注这一元素。因此，可用性概念与软件产品的质量密切相关。在软件工程中，除了可用性，我们还可以观察到可靠性、效率等概念，但我们不会强调后者，因为这不是本书的目标。


    传统上，软件开发方法侧重于过程，即创建软件的活动、工具和符号。可用性技术的引入可以适应传统的开发方法（瀑布模型），但并不推荐敏捷开发方法，因为敏捷方法基于在短时间内的部分交付，产品随着持续的用户反馈呈指数级增长。


    当我们看到抽象概念时，可以更好地理解这个主题指的是什么。


    OOP 使用现实世界对象


    使用面向对象的语言并使用抽象技术通过赋予它们特征和行为来进行建模。'
