    # INTRODUCTION TO CLASSES AND OBJECTS


    The Object-Oriented paradigm is based primarily on the concepts of classes and
    objects.


    When looking at the real world, we see objects everywhere. If we go out to the
    street (object), we can see trees, people, cars, motorcycles, bicycles, a sky,
    clouds, etc.


    Each of these objects can be modeled in this paradigm to give you attributes (characteristics)
    and behavior (actions). For example, in the case of a person, we can give him
    attributes such as age, height, hair color, weight, name, etc. And behavior such
    as walking, running, eating, sleeping, etc.


    Once this is known, let''s explain the theoretical concepts of a class and an
    object in the scope of the Object-Oriented paradigm.


    # CLASS


    A class is a description of a set of similar objects. It has common methods and
    characteristics of this set.


    In other words, a class is a template where the characteristics and functions
    common to all the objects it contains are defined.


    For example, the class PERSON has Name, Age and Weight as common characteristics
    and Running, Walking and Sleeping as common methods (there can be many more).


    Then, every object that is created in a programming language of the type of this
    class PERSON will automatically have the attributes and methods of that class
    available.


    Let''s get on with the theory. A class is the declaration of an object type. Something
    like abstract data types in a programming language (for example, the integer or
    string type). Every time an object is constructed from a class, we are creating
    an instance of that class. This concept of instance is something awfully specific
    to OOP. Instance is the creation of an object in the memory of a PC.


    In C # language, which is a purely object-oriented language, we instantiate an
    object of type PERSON, like this:'
  - '[PAGE 42]


    ```

    Person = new Person ()

    ```


    Where

    **Person** is a type of class.

    **person** (all lowercase) is an object that belongs to Person (its class)

    new is the C # reserved word where the compiler creates the object in memory.

    And then we put what we are going to create after new and always placing the final
    parentheses of the corresponding type.'
  - '[PAGE 43]


    # OBJECT


    An object is an element. It is the instance of a class in memory. It is the one
    that will be used in an object-oriented programming language to use its attributes
    or functionality.


    In the example above, a person object can be used in C # like this:


    ```

    person.Run();

    person.Age = 73;

    ```


    # DIFFERENCE BETWEEN OBJECT AND CLASS


    As we saw, an object is an element. A class describes the set of similar elements.
    From a class, an indeterminate number of objects is defined. Each object has its
    own state (for example, a person object can be running, and another person object
    can be walking) within the state of a program.


    The class is an abstract type. The object is the concrete element that is used
    in a program to show its status and observe its functionality.'
