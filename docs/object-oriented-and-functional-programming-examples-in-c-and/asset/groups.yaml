    - So, what is a polymorphism?\n- SUMMARY\n\n# PREFACE\n\nHello!\n\nIn this course\
    \ of “OBJECT ORIENTED AND FUNCTIONAL PROGRAMMING” we will see the concepts of\
    \ OOP and Functional Programming and we will analyze some functions with examples\
    \ in C# and Python.\n\nFirst, it should be clarified that it is not the objective\
    \ of this book to deepen teach about C# or Python, but rather to know the fundamental\
    \ concepts of OOP and Functional Programming and see examples of it in those programming\
    \ languages.\n\nWe will observe the advantages, disadvantages and characteristics\
    \ of these paradigms and we will see the Principles of Functional Programming\
    \ with learn their principles. We will also see the languages that support it\
    \ and the examples of lambda, closures, filter, map, reduce and about OOP we will\
    \ learn the relationship between OOP and FP.\n\nEasy. You don't need to know it.\
    \ This book provides basic concepts, for beginners, on OOP and Functional Programming.\n\
    \nIt is not essential that you have some previous knowledge although it is necessary\
    \ that you have some knowledge of computer science and programming in general\
    \ (if it is C# or Python better), since no explanation of Fundamentals of Programming\
    \ will be provided.\n\nLet's get started!\n\nLeonel Peña\n\n# NOTE\n\nThe first\
    \ version of this book had been written in Spanish. So, the examples are in that\
    \ language. This is not a problem to understand the concepts of OOP and Functional\
    \ Programming.\n\n# FUNCTIONAL PROGRAMMING\n\nThe Functional Programming is a\
    \ declarative paradigm which has been gaining a lot of popularity lately and,\
    \ in order not to be left behind, it would be important that you learn it. Even\
    \ languages that are strongly Object Oriented had to incorporate Functional Programming\
    \ due to their high increasing use, such as Java, which in version 8 incorporated\
    \ elements of this type of programming.\n\nFunctional Programming emphasizes WHAT\
    \ we are doing and not HOW we are doing it. This is called the Imperative Approach.\n\
    \nFunctional language emphasizes statements rather than executing statements,\
    \ unlike other types of languages that emphasize a local or global state.\n\n\
    We will not describe flow controls; we will not use cycles or conditions. These\
    \ ideas were based on the lambda calculus.\n\nLISP was the first language used,\
    \ developed in 1960.\n\nOn the other hand, there is another term that is also\
    \ gaining popularity, which is Reactive Programming, and this also uses Functional\
    \ Programming, However, we will not go into Reactive Programming as it will be\
    \ the subject of another book.\n\n# ADVANTAGES AND DISADVANTAGES OF FUNCTIONAL\
    \ PROGRAMMING\n\nLike any programming paradigm, there are advantages and disadvantages\
    \ that we must know before understanding whether it is good for a type of software\
    \ project.\nThe advantages are as follows:\n\n- Functions are treated as values\
    \ - improves code understanding and readability.\n- Supports the concept of lazy\
    \ evaluation: it means that the value is only evaluated and stored when necessary.\n\
    - The flow is clear: the state is not changed implicitly.\n- Efficient use of\
    \ concurrency: due to the nature of pure functions that prevent variables from\
    \ changing.\n- They do not have assignment statements: after a value is passed\
    \ to a variable, it will not change (constant).\n- Focus on the WHAT and not the\
    \ HOW.\n\n- On the other hand, there are some disadvantages that you need to know:\n\
    - It is not easy: it is a bit complicated to learn for a beginner and even more\
    \ so if it comes from Object Oriented Programming.\n- Difficult to maintain because\
    \ there is the evolution of objects\n- Complicated needs: needs refactoring\n\
    - Complication when representing real world objects\n\nIn short, each programmer\
    \ is different and must know when to use which paradigm, since neither is a panacea,\
    \ and all have their pros and cons.\nHowever, we will see later the differences\
    \ between Functional Programming and Object-Oriented Programming.\n\n# CONCEPTS\n\
    \n- There are 4 fundamental concepts of Functional Programming:\n- PURE FUNCTIONS\n\
    - COMPOSITION OF FUNCTIONS\n- RECURSIVE FUNCTIONS\n- HIGH ORDER FUNCTIONS\n\n\
    Let's look at each of these key concepts.\n\n# PURE FUNCTIONS\n\nA function is\
    \ P, when it meets these fundamental requirements:\n- Same arguments always return\
    \ the same. This is called referential transparency.\n- It has no collateral effect.\n\
    \nLet's clarify the terms a bit. Referential transparency implies that the behavior\
    \ of pure functions depends only on the arguments passed to the function in an\
    \ explicit way.\nIt means if you pass the same input data, the function should\
    \ generate the same return value.\nExample:\n\n```\nconst sum = (a, b) => (a +\
    \ b);\nsum(1, 2); // 5\nsum(1, 2); // 5\n```\n\nIn this sum function, we pass\
    \ it 2 numeric arguments (1 and 2), it should always return the same result. If\
    \ we replaced the sum (1,2) invocations with 3 in our program, everything should\
    \ still work fine. This is thanks to Referential Transparency.\n\nAs for the Collateral\
    \ Effects, we mean that it does not affect the state outside its scope and that\
    \ it has no interaction with the functions that call it or the outside world,\
    \ beyond returning a value.\nSo, in summary, the Pure Function returns the same\
    \ result every time I invoke it.\nIt differs from Impure Functions since the latter,\
    \ in various calls, can return different values since the declared variables are\
    \ not local. This is not recommended.\nLet's continue with the following concepts.\n\
    \n# FUNCTION COMPOSITION\n\nThis concept comes from the hand of the creation of\
    \ complex functions or other small ones.\nFor example, we have function 1 that\
    \ receives the parameter X and returns the value Y and function 2 that receives\
    \ the parameter A and returns the value \"Hello\".\nFrom these 2 functions we\
    \ can create a third function that processes parameters and returns another result,\
    \ using its logic, function 1 and 2.\nExample:\n\n```\nalCuadrado(numero):\n \
    \ return numero * numero\n\nsumaDeCuadrados(num1,num2):\n  return alCuadrado(num1)\
    \ + alCuadrado(num2)\n\nprint(sumaDeCuadrados(3, 4))\n```\n\nThe function alCuadrado\
    \ receives a number and returns its square.\n\nThe function sumaDeCuadrados receives\
    \ 2 numbers and in turn calls the function alCuadrado 2 times, making its sum\
    \ with 2 numbers as a parameter.\nFinally, we will make a third function that\
    \ we will call cuadradoAntecesorMasSucesor, which receives a number and calls\
    \ the\n"
  mdcn: "\n\n# 自呆教程 (For Dummies)\nC# 与 Python 示例\n\n# 面向对象与函数编程\n\nLEONEL PEÑA\n\n\
    ![](img/5837c8935ecd30c8ae021c4977b70059_1_0.png)\n\nLeonel Peña\nleonelqpena@gmail.com\n\
    \n# 面向对象与函数编程\n\nC# 与 Python 示例\n\n# 前言\n\n- 函数式编程的优缺点\n- 核心概念\n- 纯函数\n- 函数组合\n\
    - 递归函数\n- 高阶函数\n- 函数式编程原则\n- 请开始练习！\n- Lambda\n- 闭包\n- Filter (过滤)\n- Map (映射)\n\
    - Reduce (归约)\n- 函数式语言\n- 补充 Python\n- 函数式编程 vs 面对象编程\n- 面向对象编程\n- 结构化编程范式\n-\
    \ 面向对象编程范式\n- 逻辑编程范式\n- 函数式编程范式\n- 声明式与命令式范式\n- 声明式与命令式语言的区别\n- 什么是编程？\n- 什么是面向对象编程？\n\
    - 面向对象范式的目标\n- OOP 如何易于创建高质量软件\n- 最佳维护\n- 改进功能扩展\n- 提高软件复用\n- OOP 使用真实世界对象\n-\
    \ OOP 使用对象和类的概念\n- 类与对象的介绍\n- 类\n- 对象\n- 对象与类的区别\n- 面向对象范式的原则\n- 抽象\n- 封装\n- 模块化\n\
    - 继承\n- 多态\n- 类型系统\n- 什么是数据类型？\n- 弱类型语言\n- 强类型语言\n- 那么，什么是多态？\n- 总结\n\n# 前言\n\n\
    你好！\n\n在“面向对象与函数编程”课程，我们将学习 OOP 和函数式编程的概念，并通过 C# 和 Python 的示例来分析一些函数。\n\n首先需要明确的是，本书的目的并不是深入教授\
    \ C# 或 Python，而是了解 OOP 和函数式编程的基本概念，并在这些编程语言中看到它们的示例。\n\n我们将观察这些范式的优点、缺点和特征，并通过学习其原理来了解函数式编程原则。我们还将看到支持它的语言以及\
    \ lambda、闭包、filter、map、reduce 的示例。关于 OOP，我们将学习 OOP 与 FP（函数式编程）之间的关系。\n\n很简单。你不需要预先了解。本书为初学者提供了关于\
    \ OOP 和函数式编程的基础概念。\n\n你不需要具备某些先验知识，但你必须对计算机科学和通用编程有所了解（如果是 C# 或 Python 话更好），因为我们不会提供关于编程基础的解释。\n\
    \n让我们开始吧！\n\nLeonel Peña\n\n# 注意\n\n本书的第一版本是用西班牙语编写的。因此，示例使用的是该语言。这对于理解 OOP 和函数式编程的概念没有影响。\n\
    \n# 函数式编程\n\n函数式编程是一种声明式范式，最近非常流行，为了不掉队，学习它是非常重要的。即使是强面向对象的语言也由于其使用率的不断增加而不得不引入函数式编程，例如\
    \ Java，在第 8 版本中引入了此类编程的元素。\n\n函数式编程强调我们正在**做什么**，而不是我们**怎么做**。这被称为命令式方法。\n\n函数式语言强调语句而非执行语句，这与其他强调局部或全局状态的语言类型不同。\n\
    \n我们不会描述流控制；我们不会使用循环或条件。这些思想基于 lambda 演算。\n\nLISP 是第一个被使用的语言，开发于 1960 年。\n\n另一方面，另一个日益流行的术语是响应式编程\
    \ (Reactive Programming)，它也使用了函数式编程。然而，我们不会深入响应式编程，因为它将是另一本书的主题。\n\n# 函数式编程的优缺点\n\
    \n像任何编程范式一样，在理解它是否适用于某种软件项目之前，我们必须知道优缺点。\n优点如下：\n\n- 函数被视为值 - 提高了代码理解和可读性。\n-\
    \ 支持惰性求概念：意味着只有在需要时才对值进行求值和存储。\n- 流清晰：状态不会被隐式改变。\n- 高效利用并发：由于纯函数的特性，防止了变量改变。\n\
    - 没有赋值语句：值传递给变量后，它将不会改变（常量）。\n- 关注“做什么”而不是“怎么做”。\n\n- 另一方面，你还需要了解一些缺点：\n- 并不简单：对初学者来说学习有点复杂，如果来自面向对象编程则更是如此。\n\
    - 难以维护，因为存在对象的演变。\n- 复杂的需求：需要重构。\n- 在表示真实世界对象时的复杂性。\n\n简而言之，每个程序员都是不同的，并且必须知道在何时使用哪种范式，因为两者都不是万灵药，而且它们都有自己的优缺点。\n\
    然而，我们稍后将看到函数式编程和面向对象编程的区别。\n\n# 概念\n\n- 函数式编程有 4 个基本概念：\n- 纯函数\n- 函数组合\n- 递归函数\n\
    - 高阶函数\n\n让我们来看这些核心概念。\n\n# 纯函数\n\n当一个函数满足以下基本要求时，它就是纯的（Pure）：\n- 相同的参数总是返回相同的结果。这被称为引用透明性。\n\
    - 没有副作用。\n\n让我们稍微澄清一下术语。引用透明性意味着纯函数的行为完全取决于传递给函数的显式参数。\n这意味着如果你传递相同的输入数据，函数应该生成相同的返回值。\n\
    示例：\n\n```javascript\nconst sum = (a, b) => (a + b);\nsum(1, 2); // 5\nsum(1,\
    \ 2); // 5\n```\n\n在这个 sum 函数中，我们传递了两个数值参数（1 和 2），它总是返回相同的结果。如果我们在程序中将 sum(1,2)\
    \ 的调用替换为 3，一切仍然会正常运行。这归功引用透明性。\n\n至于副作用，我们的意思是不会影响范围之外的状态，除了返回返回值外，与调用它的函数或外部世界没有任何交互。\n\
    总之，纯函数每次被调用都会返回相同的结果。\n它与不纯函数不同，后者在多次调用中可能会返回不同的值，因为定义的变量不是局部的。这是不推荐的。\n让我们继续后续概念。\n\
    \n# 函数组合\n\n这个概念源于创建复杂函数或其他小函数。\n例如，我们有一个函数 1 接收参数 X 并返回值 Y，函数 2 接收参数 A 并返回值“Hello”。\n\
    通过这两个函数，我们可以创建一个第三个函数，它处理参数并返回另一个结果，并使用它的逻辑、函数 1 和 2。\n示例：\n\n```python\nalCuadrado(numero):\n\
    \  return numero * numero\n\nsumaDeCuadrados(num1,num2):\n  return alCuadrado(num1)\
    \ + alCuadrado(num2)\n\nprint(sumaDeCuadrados(3, 4))\n```\n\nalCuadrado 接收一个数字并返回它的平方。\n\
    \nsumaDeCuadrados 接收两个数字，并反调用两次 alCuadrado 函数，将两个数字作为参数进行求和。\n最后，我们将制作一个名为 cuadradoAntecesorMasSucesor\
    \ 的第三个函数，它接收一个数字并调用\n\n"
