- fmt: '

    Windows computers usually never have Python preinstalled. To obtain the software,
    navigate to the [Python website](https://www.python.org/downloads/) and download
    the most recent version. As of now, Python 3.5.2 is the current version. So long
    as your version number is Python 3, the code written in this book should also
    be compatible. Install the software with mostly default settings. Definitely check
    the “Add Python to the Path”, because it simplifies testing programs. After the
    installer is done the Python interpreter can be started by searching for `python`
    in the start menu.


    The interpreter, or parser, is one of Python’s advertised features that allows
    for individual lines to be written and run. For testing out code the parser is
    fantastic, but mostly every program we write in this book will be multiline, so
    we will need an IDE (integrated Development Environment). Windows has a few popular
    solutions, such as `Atom`, `Pycharm`, and `Eclipse`. These are all 3rd party applications
    that can be downloaded and installed. IDEs are essentially glorified text editors
    that offer helpful programming features such as syntax highlighting and command-completion.
    Although `Atom` is highly recommended for Windows developers, Python comes with
    an IDE solution already. `IDLE` is an interpreter program that can be made multiline
    by clicking on “file” and then “new file”. Whether you choose to use the preinstalled
    editor or choose to get a full-fledged programming environment through `Atom/Eclipse`,
    the Python code will work just the same. You will write your code within one of
    the multiline programs.


    On Linux you also have the option of downloading a Python-compatible IDE application,
    but most programmers tend to use the preinstalled application `nano`. `Nano` is
    a built-in, barebones text editor accessible by typing `nano` into a console.
    The program can actually do some rudimentary syntax highlighting once it knows
    a Python script is being written, so many developers prefer the basic setup provided.
    Code is written into `nano`, then saved by pressing `ctrl+x`.


    Now that there is a development environment set up, you can continue onwards to
    begin writing your first Python program.


    ## Hello World


    Mostly every programmer gets introduced to a new language by writing the “Hello
    World” program. Hello World is traditionally a simple exercise that involves displaying
    the titular text on the screen. To do it in Python, we must open up our IDE or
    text editor and simply type the function.


    ```

    print (“Hello, World!")

    ```


    Next, we save the file. In `IDLE` (and most IDEs such as `Atom`) one must go through
    “file” and click “save as”. In `Nano` ctrl+x` must be pressed. Name the file with
    a `.py` extension and save it in an easily accessible directory- your desktop
    is perfectly fine. For this demonstration we will name the file `test.py`.


    Running a Python file differs slightly between platforms. Windows must use the
    command prompt, while Linux must use the terminal. Open up the respective application
    (`ctrl+R` and then `cmd` for Windows, `ctrl+T` for Linux). These applications
    are text-based interfaces that can be used to navigate and interact with a computer.
    The printed line will tell which directory you are currently located in, and you
    can type `dir` in Windows or `ls` in Linux to display a list of files in that
    directory. Move to another folder by typing `cd` followed by the directory name.
    Since we have saved the file to the desktop, on both operating systems we can
    make it active by typing `cd Desktop`. Finally, the Hello World script can be
    run by typing `python test.py` or `python3 test.py` (on Linux).


    If the above programming code was copied exactly, the output “Hello, World!” will
    be seen. The program will run and then exit back to terminal/prompt. Not entirely
    glamourous, but a worthy first step into learning Python.


    ## Programming Concepts


    In the above program, `print` is referred to as a command or function. Each function
    has a specific syntax that must be followed. For example, after `print` there
    is a set of parenthesis. Values passed within parenthesis are called parameters.
    Quotations also surround our text, and that is syntax that specifies written text,
    or a string. The syntax of `print` must be followed exactly, or else a syntax
    error will be returned when the program tries to run. As new functions are introduced
    in this book, careful attention must be placed upon following the syntax rules.


    Anything can be put within the quotations of the `print` function and it will
    be written to the console. Since Python starts at the beginning of a script and
    reads lines individually, multiple `print` functions can be placed one after another
    like so:


    ```

    print (“Hello, World!")

    print (“This is my 2nd Python Program”)

    print (“Notice how each print command puts the text on a new line!")

    ```


    After saving and running the file, all three functions will print their respective
    parameters. As mentioned previously, the quotations explain that text will be
    displayed. By forgoing quotations, numbers can be displayed instead.


    ```

    print (“The answer to everything is:”)

    print (42)

    ```


    Python starts at the beginning of the script file and works its way down one line
    at a time until no more lines are found, in which case the program exits back
    to prompt or terminal.


    ## Variables


    Computers have the ability to “remember” data by storing the values as variables.
    Variables are RAM locations that are set aside to contain a value. Programming
    languages must specifically declare variables and assign them by writing code.
    Being able to manipulate data will prove valuable asset.


    Creating a variable is known as “declaration”. Giving a value is known as “assigning”.
    Python simplifies the process by combining the two into a single statement.


    ```

    lucky_number = 7

    ```


    And then we can use the `print` function to view the variable we created.


    ```

    print (lucky_number)

    ```


    Because Python starts at the top of the program and works downwards, the above
    lines need to be in the correct order. If `lucky_number` is not first created,
    then `print()` will return an error for attempting to call a variable that does
    not exist.


    An important distinction that can be made is seen when closely viewing the previous
