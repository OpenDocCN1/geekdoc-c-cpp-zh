- fmt: "\n## Headers\nThere are several headers out there for C++, and all of them\
    \ are necessary or at the very least useful to your programming operations. However,\
    \ for most functions you will see the header that is above `<iostream>`. When\
    \ you use a header be sure to enclose it properly, and put `#include` before it\
    \ to prompt the program to use that header.\n\n## Namespace\nNamespaces are a\
    \ fairly new addition to C++, only coming about in the 2011 update. They do not\
    \ do much, other than describe which namespace to use. While they are not necessary,\
    \ they save you a lot of confusion on functions of a program. It simply act as\
    \ a way to organize your functions more systematically.\n\n## Main\nHere is where\
    \ the `main` function begins. Using the line `// main()` instructs the program\
    \ to start executing the `main` function of the program, and start the output\
    \ process. It is essential that you set up the `main` function command, otherwise\
    \ your program will not know what it is supposed to be running, nor will it know\
    \ when it is supposed to run. This will be seen as a single line comment inside\
    \ the program and it is going to tell the program that the `main` function is\
    \ beginning.\n\n## INT main\nThis is where the function execution officially begins.\
    \ If you do not include this, the entire process will stop, because you did not\
    \ introduce the variables, and without the variables, the program is lost.\n\n\
    ## Cout\nThis instructs the program to display the message that you want on the\
    \ screen. If you do not put `cout`, chances are your program will may or may not\
    \ fail. The problem is you don’t know if you succeed or not so if you want to\
    \ make sure that everything runs smoothly, be sure to add `cout`.\n\n## Return\n\
    This returns the value back to zero, and terminates the function. It instructs\
    \ the program to end the process, and go back to the beginning.\n\n## Compilation\
    \ Guide\nNow to compile and execute your first official C++ program.\n\nFirst\
    \ you must know how to save the file. Open your chosen text editor, and enter\
    \ the code that is seen above. Once you have done that, hit save as, and choose\
    \ a file location that is easily found. For organization purposes, it is always\
    \ best to have a separate folder for all of your programs. Save the file as `hello.cpp`,\
    \ and once you have saved it, you should open up your command prompt before heading\
    \ to the directory where the file is saved.\n\nTo get the file to open inside\
    \ your compiler, start by typing `g++ hello.cpp`. you can then press enter and\
    \ the code will be opened properly. As long as there aren’t any errors, the prompt\
    \ is going to generate an `a.out` executable file. To run the program, type out\
    \ `./a.out` and see the compiler work. The information that you should get on\
    \ the compiler from this on the computer includes:\n\n```bash\ng++ hello.cpp\n\
    ./a.out\n```\n\n### Try This\nMake sure that you are inputting all of the variables\
    \ the proper way, and remember, these things are case sensitive. If you do not\
    \ input the functions the right way, you will find that things tend to go awry.\
    \ The thing with coding is you have to be precise. This detailed oriented personal\
    \ attributed applies to all programming languages! However, anyone can do it if\
    \ they are willing to pay attention.\n\nThe basic function commands are not the\
    \ only things you need to use. There are other things that are important when\
    \ you are building a prompt as well, as they too instruct the program to do specific\
    \ things. Some of these things are blocks and semicolons.\n\n### Semicolons\n\
    You probably think a pause in a sentence when you think semicolon, however, they\
    \ are complete stops in C++ programs. The semicolon indicates the termination\
    \ of a statement. This means that each individual statement must be indicated\
    \ by the use of a semicolon. The following are three different statements:\n\n\
    ```cpp\nx=y;\ny=y+1;\nadd(x,y);\n```\n\nEach one of those statements were separated\
    \ by not only a line break, but also a semicolon. You could also do it this way:\n\
    \n```cpp\nx=y; y=y+1; add(x,y);\n```\n\nEach one of those will be recognized as\
    \ separate statements simply because of the semicolon. It is kind of mind blowing\
    \ how something so simple can have so much of an impact.\n\n### Blocks\nIn this\
    \ coding language, a block is going to be a set of statements that you enclose\
    \ with brackets. These statements logical entities that the program puts on the\
    \ screen due to the main command prompt. For example:\n\n```cpp\n{\n    cout <<\
    \ \"I like Pizza\"; //prints I like Pizza\n    return 0\n}\n```\n\nThe end of\
    \ a line is not a terminator, as was indicated above. The semicolon is the only\
    \ thing that terminates the statement.\n\n## Identifiers\nNow let us move on to\
    \ the identifiers in the program. These identifiers are used to identify multiple\
    \ things, such as classes, modules, functions and variables within a block. An\
    \ identifier is going to be a group of letters and numbers that you are able to\
    \ name your program or your files and they must start with a letter, but can have\
    \ any letter or number you want afterwards. There are no punctuation characters\
    \ other than what you might see in a sentence that are allowed as identifiers.\
    \ You will not see characters such as `@`, `&`, `,`, `%` or `$`, and the programming\
    \ is case sensitive. That means `YokoOno` is different than `Yokoono`, `yokoOno`,\
    \ and `yokono`. Make sure that you are capitalizing only the letters that you\
    \ should be capitalizing in your programs.\n\nThough pretty much anything can\
    \ be an identifier, there are some things that are reserved for keywords in C++,\
    \ and can't be used as identifiers. These words are as follows:\n\n| | | | |\n\
    | :--- | :--- | :--- | :--- |\n| `asm` | `Break` | `Bool` | `Auto` |\n| `Char`\
    \ | `Catch` | `Case` | |\n| `Const cast` | `Const` | `Class` | |\n| `Delete` |\
    \ `Default` | `Continue` | |\n| `Dynamic cast` | `Double` | `Do` | |\n| `Explicit`\
    \ | `Enum` | `Else` | |\n| `False` | `Extern` | `Export` | |\n| `Friend` | `For`\
    \ | `Float` | |\n| `Inline` | `If` | `Goto` | |\n| `Mutable` | `Long` | `Int`\
    \ | |\n| `Protected` | `Private` | `Namespace` | |\n| `Reinterpret cast` | `Register`\
    \ | `Public` | |\n| `Signed` | `Short` | `Return` | |\n| `Static cast` | `Static`\
    \ | `Sizeof` | |\n| `Template` | `Switch` | `Struct` | |\n| `True` | `Throw` |\
    \ `This` | |\n| `Typeid` | `Typedef` | `Try` | |\n| `Unsigned` | `Unlon` | `Typename`\
    \ | |\n| `Void` | `Virtual` | `Using` | |\n| `While` | `Wchart` | `Volatile` |\
    \ |\n\nEverything else is fair game when it comes to identifiers. Think of identifiers\
    \ as usernames and passwords. Mix it up, but make sure that they are functional.\n\
    \n## Trigraphs\nTrigraphs are going to be sequences of three characters that will\
    \ represent just one character. You will notice these because they are going to\
    \ start out with two question marks at the beginning. Seems a little redundant\
    \ to use three characters when one will work, but the reason behind this is so\
    \ you do not confuse the program with the meaning of the character, as many are\
    \ similar.\n\nHere are some frequently used trigraphs to give you an example of\
    \ what we mean:\n\n- `??=` is `#`\n- `??/` is `\\`\n- `??'` is `^`\n- `??(` is\
    \ `[`\n- `??)` is `]`\n- `??!` is `|`\n- `??<` is `{`\n- `??>` is `}`\n- `??-`\
    \ is `~`\n\nNot all compilers support trigraphs due to their confusing nature,\
    \ and most people try to stay away from them, however, it has been found that\
    \ when you memorize trigraphs, you are less likely to mess up by hitting the wrong\
    \ symbol in your function.\n\n## Whitespace\nMoving on to whitespace. This is\
    \ the empty lines in a program. Sometimes they contain comments, and these are\
    \ known as blank lines. The compilers completely ignore them. Whitespace describes\
    \ blanks, new lines, tabs, characters and comments. It is merely used to make\
    \ your program look more organized and readable.\n\nThere should be at least one\
    \ line of whitespace between the variable/identifier and the statement.\n\n##\
    \ Quiz\nYou thought that you could just walk through this book without being tested\
    \ on if you were paying attention? No cheating either! Just because you can peek\
    \ at the answers does not mean that you should. You should take it just like a\
    \ normal quiz to truly test your knowledge so you can figure out if you need to\
    \ go back and re-read some things. This is a short quiz, so you will be okay.\n\
    \n1. What is whitespace?\n2. Fill in the blanks `___ <<x=y+1_>>`\n3. What are\
    \ trigraphs?\n4. Who Invented the C with Classes language?\n"
