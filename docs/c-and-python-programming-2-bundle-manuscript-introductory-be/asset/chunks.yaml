    Windows 电脑通常不会预装 Python。要获取该软件，请访问 [Python 网站](https://www.python.org/downloads/)
    并下载最新版本。截至目前，Python 3.5.2 是当前版本。只要你的版本号是 Python 3，书中编写的代码也应该是兼容的。使用大部分默认设置安装软件。务必勾选“Add
    Python to the Path”（将 Python 添加到路径），因为这可以简化程序的测试。安装程序完成后，可以通过开始菜单中搜索 `python`
    来启动 Python 解释器。


    解释器（或解析器）是 Python 宣传特性之一，允许逐行编写和运行。对于测试代码来说，解析器非常棒，但我们在书中编写的几乎每个程序都是多行的，因此我们需要一个
    IDE（集成开发环境）。Windows 拥有一些流行的解决方案，例如 `Atom`、`Pycharm` 和 `Eclipse`。这些都是可以下载并安装的第三方应用程序。IDE
    本质上是增强版的文本编辑器，提供了实用的编程功能，如语法高亮和命令补全。虽然非常推荐 Windows 开发者使用 `Atom`，但 Python 已经带有一个
    IDE 解决方案。`IDLE` 是一个解释器程序，通过点击“file”（文件）然后“new file”（新建文件）可以变为多行。无论你选择使用预装编辑器，还是选择通过
    `Atom/Eclipse` 获取完整的编程环境，Python 代码的运行方式都是一样的。你将在一个多行程序中编写代码。


    在 Linux 上，你也可以选择下载兼容 Python 的 IDE 应用程序，但大多数程序员倾向于使用预装的应用程序 `nano`。`Nano` 是一个内置的简易文本编辑器，通过在控制台中输入
    `nano` 访问。一旦程序知道正在编写 Python 脚本，它实际上可以执行一些基础的语法高亮，因此许多开发者更倾向于其提供的基础设置。代码写在 `nano`
    中，然后按 `ctrl+x` 保存。


    现在开发环境已经就绪，你可以继续开始编写你的第一个 Python 程序了。


    ## Hello World


    大多数程序员都是通过编写“Hello World”程序开始接触新语言的。Hello World 传统上是一个简单的练习，涉及在屏幕上显示标题所示的文本。要在
    Python 中实现这一点，我们必须打开 IDE 或文本编辑器并简单地输入该函数。


    ```

    print (“Hello, World!")

    ```


    接下来，我们保存文件。在 `IDLE`（以及大多数 IDE，如 `Atom`）中，必须通过“file”（文件）并点击“save as”（另存为）。在 `Nano`
    中必须按 `ctrl+x`。以 `.py` 扩展名命名文件并保存到容易访问的目录——桌面完全可以。为了这次演示，我们将文件命名为 `test.py`。


    运行 Python 文件在不同平台之间略有不同。Windows 必须使用命令提示符，而 Linux 必须使用终端。打开相应的应用程序（Windows 使用
    `ctrl+R` 然后 `cmd`，Linux 使用 `ctrl+T`）。这些应用程序是基于文本的界面，用于导航和与计算机交互。打印出的行将告诉你在当前所在的目录，你可以在
    Windows 中输入 `dir` 或在 Linux 中输入 `ls` 来显示该目录下的文件列表。输入 `cd` 后跟目录名移动到另一个文件夹。由于我们已将文件保存到桌面，在两个操作系统中我们都可以通过输入
    `cd Desktop` 使其激活。最后，通过输入 `python test.py` 或 `python3 test.py`（Linux 上）即可运行 Hello
    World 脚本。


    如果上述编程代码被完全复制，将看到输出“Hello, World!”。程序将运行并返回终端/提示符。这并不完全华丽，但是是学习 Python 值得的第一步。


    ## 编程概念


    在上面的程序中，`print` 被称为命令或函数。每个函数都有必须遵循的特定语法。例如，在 `print` 之后有一组括号。括号内传递的值被称为参数。引号还包围了我们的文本，这种语法指定了编写的文本，即字符串（string）。必须完全遵循
    `print` 的语法，否则当程序尝试运行时将返回语法错误。随着书中引入新函数，必须留心遵循语法规则。


    `print` 函数的引号内可以放置任何内容，它将被写入控制台。由于 Python 从脚本开头开始并逐行读取，可以一个一个地放置多个 `print` 函数，如下所示：


    ```

    print (“Hello, World!")

    print (“This is my 2nd Python Program”)

    print (“Notice how each print command puts the text on a new line!")

    ```


    保存并运行文件后，三个函数都将打印各自的参数。正如之前提到的，引号解释了将显示文本。放弃引号，则可以显示数字。


    ```

    print (“The answer to everything is:”)

    print (42)

    ```


    Python 从脚本文件的开头开始，逐行向下运行，直到没有更多行，在这种情况下程序返回提示符或终端。


    ## 变量


    计算机具有通过将值存储为变量来“记忆”数据的能力。变量是预留用于包含值的 RAM 位置。编程语言必须通过编写代码专门声明变量并为其赋值。能够操作数据将证明是一项重要的资产。


    创建变量被称为“声明”。赋值被称为“赋值”。Python 通过将两者合并为单一语句简化了这个过程。


    ```

    lucky_number = 7

    ```


    然后我们可以使用 `print` 函数查看我们创建的变量。


    ```

    print (lucky_number)

    ```


    由于 Python 从程序顶部开始向下工作，上述行需要处于正确的顺序。如果 `lucky_number` 没有先创建，那么 `print()` 将因为尝试调用不存在的变量而返回错误。


    仔细观察之前的 `print()` 参数时，可以看到一个重要的区别。变量 `lucky_number` 没有放在引号内，因此 Python 知道要打印其中的值
    (7)。如果在文本周围加上引号，Python 将打印“lucky_number”，这并不是预期的结果。这种情况被称为逻辑错误（logic error）。


    ### 变量类型


    变量可以包含多种类型的值。我们的第一个变量被赋值为一个数值，但 Python 也有处理不同类型值的方法。


    ```

    secret_message = “rosebud”

    print (secret_message)

    ```


    如所示，我们也可以给变量分配文本字符串。过程几乎相同，但注意值周围的引号，它明确指示这是一个字符串。以下是 Python 3 中最重要的数据类型：


    - **Integer (整数)**：作为整数整数的简单数值。（例如 `1`、`0`、`-7`）。

    - **Float (浮点数)**：小数值。“浮点数”（例如 `3.0`、`-7.6`、`1.010001`）。

    - **String (字符串)**：字母、单词或整个短语。包含在引号内。（例如 `“Hello, world”`、`“no”`、`“12”`）。

    - **Lists/Tuples/Dictionaries (列表/元组/字典)**：多个相关值作为一个对象分组在一起。可以是多种数据类型。（例如 `[1,
    4, 4, 0]`、`[“Dog”, 2, “yes”]`）。


    显然，通过简单在变量声明中提供整数来声明数值值。如果涉及小数，它将是一个浮点数。变量也可以用于方程，或者在程序过程中进行修改和更改。将以下行写入脚本。


    ```

    first_num = 2

    result = 3 + first_num

    print (result)


    first_num = 3

    result = 3 + first_num

    ```


    '
- fmt: '

    ```

    print (result)

    ```


    You can observe that the value 2 is assigned to `first_num`. Then, we create a
    new variable `result` that is equal to a short mathematical expression. `3` and
    `2` are added and assigned to the `result`, which is printed as `5`. Then, `first_num`
    is updated to contain a new value. Result is calculated again and the new result
    is printed out. This program shows how easy it is to use variables within assignments,
    and how variables can be edited at any time in the program.


    More arithmetic operations can be done to numerical variables by specifying an
    operator in the equation. The following list explains the 5 main operators and
    the symbol that is used to perform the sequence.


    - Addition `+` – Combining numbers

    - Subtraction `-` – Taking the difference of numbers

    - Multiplication `*` – Repeated addition

    - Division `/` – Grouping, or the opposite of multiplication

    - Modulus `%` – Dividing and using the remainder as an answer


    Both integers and floats can easily perform calculations using the above operators.
    Note, though, that integers will generally return integer answers (whole numbers)
    while floats will always return an answer with a decimal point. Python can usually
    transform an integer into a float when it is needed, but good programming form
    comes from choosing the correct data type at the appropriate time. For example,
    see how floats are used in the program below:


    ```python

    first_number = 5.0

    second_number = 3.0

    result = first_number / second_number

    print (result)

    ```


    And the console will return `1.666666` as an answer. Whereas if integers were
    used everything past the decimal would be left off for an answer of `1`. Assigning
    the answer to the `result` variable is not entirely necessary in our small program,
    and we can rewrite it like so:


    ```python

    first_number = 5.0

    second_number = 3.0

    print (first_number / second_number)

    ```


    String variables are not edited mathematically (as in `1 + “two”` would not return
    `3`). Instead, the remarks are changed by simply overwriting the words.


    ```python

    name = “Bob”

    name = “Bill”

    print (name)

    ```


    `name` will initially be created as the string “Bob”, but “Bill” is assigned to
    it directly after. So when `print()` is called, the string only contains “Bill”.
    Operators can be used, however, to combine separate strings.


    ```python

    my_string = “Hello,”

    my_string2 = “World! ”

    print (my_string + my_string2)

    print (my_string2 * 3)

    ```


    The output would be “Hello, World!” for the first `print()`, and “World! World!
    World!” for the second `print()`. The addition operator combines two strings together
    into one massive string, and the multiplication operator repeats a string the
    specified number of times.


    ## Input


    Although what we have learned so far is interesting, predetermined applications
    are not very useful for the end user. Python allows us, though, to obtain input
    from the user to add a layer of interactivity within our scripts. The `input()`
    function assigns input to a variable.


    ```python

    favorite_number = input (“What is your favorite number? ”)

    ```


    When a program reaches this line, it will display the text specified and wait
    for user input. Whatever is input will be assigned to `favorite_number`, which
    can be called just as any other variable.


    ```python

    print (“Your favorite number is”, favorite_number)

    ```


    Instead of using an addition operand, we use a comma instead. In `print()`, commas
    are used to combine multiple print statements into one (on the same line). We
    could have used either method, but operators cannot be used for differing data
    types. Both data types are strings in this case, so it all still works.


    The answer that the user gives through `input()` will always be a string, though.
    If we were seeking a numerical answer we would have to convert it. Another function,
    `int()` can be used to extract numerical data from a string.


    ```python

    favorite_number = int(input (“What is your favorite number? ”))

    print (“Your favorite number plus 2 is “, favorite_number + 2)

    ```


    There are a lot of new nuances going on in this program. For example, `int()`
    is used to convert the input into an integer. Notice how `int()` surrounds the
    entire `input()` function, which happens because `input()` must be passed as the
    entire parameter of `int()`. Next, the `print` statement is printing multiple
    bits of output, and the equation `favorite_number + 2` is evaluated before being
    printed.


    Using `int()` will always return an integer answer, but `float()` could have been
    used to extract a decimal answer instead. The `int()` function works essentially
    by transforming the string “3” into the number 3. Definitely remember to include
    it whenever getting numerical input.


    ## String Formatting


    Being able to display strings with `print()` is useful, but sometimes our programs
    require us to display variables within them. To actually insert a variable into
    a string without first editing it or combining multiple variables, we can use
    a “string formatter”. The `format()` function can be included within a `print()`
    statement to do positional formatting of variables.


    ```python

    dog_name = “Rex”

    print (“My dog’s name is {} and he is a good boy.".format(dog_name))

    ```


    When you run the above code, it automatically replaced the brackets `{}` with
    the supplied variable. The `format()` is placed directly after the string it will
    be editing, and before the closing parenthesis. So when the code is run, the console
    outputs “My dog’s name is Rex…”. Without using `format()`, we would have had to
    use a multi-line complicated print setup. But `format()`’s greatest use comes
    from situations with multiple variables.


    ```python

    dog_name = “Rex”

    dog_age = 12

    print (“My dog’s name is {0} and he is {1}. Sit, {0}!”.format(dog_name, dog_age))

    ```


    Here we choose to specify values within the curly brackets. `0` translates to
    the first supplied parameter, while `1` refers to the second variable. Therefore
    anywhere in our string we can use `{0}` to have `dog_name` be inserted and `{1}`
    to have `dog_age` be inserted. The console text will be “My dog’s name is Rex
    and he is 12. Sit, Rex!”


    ## Example Program 1 – project1.py


    ```python

    user_name = input("What is your name? ")

    user_age = int(input("What is your age? "))

    user_pets = int(input("How many pets do you have? "))

    user_GPA = float(input("what is your GPA? "))


    print () #print a blank line


    print ("{0} is {1} years old. They have a {3} GPA, probably because they have
    {2} pets.".format(user_name, user_age, user_pets, user_GPA))

    ```


    This program combines what we have learned so far to obtain input from the user
    and display it back to them. A new concept, comments are introduced as well. The
    `#` symbol is used to denote a comment, or a block of text for human reading.
    Whenever a `#` is placed on a line everything after it is ignored by Python. Comments
    are used primarily to explain things to other programmers that might happen to
    read your code. In our case, we explain that a blank `print()` line simply produces
    a blank line. It is good programming form to use comments throughout your code
    to explain potentially confusing elements or help remind yourself of what certain
    blocks of code are doing.


    Next, the `format()` function is used to replace 4 different instances within
    a `print()` function. As you might have noticed, counting begins with `0` in Python.
    `0` always refers to the first element of something, which is why `3` indicates
    the fourth supplied variable in our `format()`.


    Depending upon the medium in which you are reading this publication, some of the
    above lines may have word-wrapped to multiple lines. This is not how you should
    be typing it into a text editor though, as the `print()` line is one single command.
