    当编程代码就是不起作用时，你总是可以转向搜索引擎来解决问题。在 `Google` 中输入错误文本可以找到其他也遇到过相同问题并在网上发布过帖子的程序员。如果无法通过观察其他代码解决问题，像
    `Stack Overflow` ([`stackoverflow.com/`](http://stackoverflow.com/)) 这样的网站在解决代码问题方面是著名的非常有帮助。在那里创建一个账户并礼貌地发布你的问题，可能就会有人帮助你。


    最后，还有一些网站提供如何学习中级和高级 Python 编程的在线教程。[`www.learnpython.org/`](http://www.learnpython.org/)
    是其中一个特别具有典范的例子，但之所以如此多，是因为 Python 被广泛使用且广为人知。在任何需要 Python 帮助的时候，快速的互联网搜索可能就能解决你的疑惑。


    # 职场市场


    作为一种流行的语言，并且由于其应用广泛，Python 的工作机会非常丰富。大型公司和初创公司都在寻找理解 Python 的程序员，而且 Python 的使用量仍在增加，因此就业前景将继续增长。


    大多数公司对编程工作并不要求大学学历，因为他们理解大多数程序员都是自学的。正因如此，在 Python 职场市场获得工作并不困难，但这仍然需要程序员自身的准备和奉献。年轻的
    Python 程序员只需表现出学习动力，就能在 `Google`、`Apple`、`Intel` 等公司获得实习。成年 Python 程序员可以通过直接联系公司或回复职位列表来申请编程工作。在留言板、招聘网站以及如
    `UpWork` 这样的自由职业网站上在线搜索机会。还可以询问编程小组并参加招聘招聘会，以了解正在招聘 Python 程序员的公司。


    编写一份体面的简历，并准备好用这种语言证明你的知识。编程工作的面试过程通常包含“白板”编程测试，他们会给你出一个情境并要求你使用 Python 来解决问题。这些测试不会太困难，但你确实需要对
    Python 有良好的掌握才能通过。


    总的来说，由于目前的市场，寻找 Python 工作是很容易的，但因为你必须熟悉 Python，它也很困难。投入精力申请尽可能多的职位，最终会出现一份工作的。


    # Python 历史


    Python 是一门起源于 20 世纪 80 年后期的编程语言。其创始人 `Guido van Rossum` 当初是想开发一种作为业爱好项目的语言来取代
    `ABC` 编程语言。从流行的 `C` 语言中汲取灵，Python 被创建为一种强大但易于的脚本语言。


    “脚本语言”一词是指编写的代码实际上并没有被编译，而是由应用程序解释的。通常这意味着脚本语言远没有真正的编程语言强大。但对于 Python 来说，情况恰恰相反——这种语言仍然是
    Web 服务器和桌面客户端可用的最强大的语言之一。Python 的开发持续了整个 20 年 9 年 年，直到 `2` 版本在 2000 年发布。Python
    后面的解释器变得足够复杂，以至于现在的 Python 版本与低级编程语言几乎没有区别。


    在整个 2000 年代中叶直到现在，Python 一直由 `Guido van Rossum` 和一组专注的志愿者继续开发。这种语言由于其许多优势而广受欢迎，诸如
    `YouTube`、`Reddit` 和 `Instagram` 这样的热门网站甚至使用 Python 的功能。随着公司采用这种易用且高效的 Python
    语言，Python 似乎将在未来多年内继续增长。


    # 为什么要使用 Python？


    初次开始学习编程时，海量的选择、信息和建议可能真正令人生畏。一些专家声称困难但历史悠久的 `C` 语言是最好的起点，但其他专业人士表示，从更简单的语言（如
    `Java` 或 `Python`）开始将给学习者机会真正吸收核心概念。推荐 Python 正是因为这个原因——通过从简单直观的脚本语言开始，编程将不会那么陌生和困惑。


    Python 易于理解，是一种优雅且整洁的语言，没有了其他地方使用的许多复杂符号和标记。通常，使用 Python 完成一项任务只需要几行格式整齐的代码。


    `Google`、`Disney`、`NASA` 和 `Yahoo` 等大公司都使用 Python 编写它们自己的程序；拥有 Python 知识可能会让程序员获得在知名机构工作的机会。此外，由于
    Python 现在仍在不断开发并不断添加新功能，对这种语言的兴趣随着时间的推移不断增加。更多的公司将发现 Python 是一门极其的编程语言，因此现在学习它将为你的未来做好准备。


    # Python 的优点


    除了简单和快速之外，Python 还有许多其他优点。Python 具有很好的移植性，这意味着 Python 代码可以运行在各种不同的操作系统上。`Windows`、`Mac
    OSX` 和 `Linux` 发行版都得到了直接支持，在一个平台上编写的代码可以在所有平台上使用。


    Python 的易用性并没有损害性能。脚本语言背后的解释器能够将近乎自然的英语命令转换为低级处理器指令，使其与真正的编程语言并肩。知名公司正因如此选择使用
    Python，正如 `YouTube` 和 `Pinterest` 等网站所证明的，Python 具有广泛的功能。


    Python 非常整洁并保持对代码可读性的关注。风格和格式通常由个人程序员决定，但在 Python 中，整洁是绝对要求的。对于初学者来说，这培养了良好的编程习惯，双重有助于
    Python 以及新手想要学习的任何其他语言。


    开发和测试的便利也使 Python 领先其他类似的语言。代码可以使用解释器立即运行，允许快速原型设计。能够快速测试代码意味着可以快速修复错误，从而为其他开发目标留出更多时间。


    总之，Python 是初学者的完美语言。Python 既易于开发和学习，也相当强大。对于新者和刚开始编程的人来说，Python 仍然是各地科技公司的首选。随着其受欢迎程度的增长，学习这种语言将被证明现在和未来都是有用的。


    # 设置开发环境


    编程语言通常用于基于 Linux 的操作系统上，如 `Ubuntu` 和 `Debian`。Python 也不例外，但在 `Windows` 上开发是另一种选择。这本书将解释如何设置这二者。但重要的是，我们将使用
    `Python 3` 进行开发，而不是旧的（但仍然非常流行的）`Python 2.7`。


    大多数 Linux 发行版实际上默认安装了 Python。因此，获取工作环境不需要额外的设置程序。通过在终端控制台中输入 `python` 即可进入 Python
    解释器。但是，如果安装了多个版本，`python` 将启动找到的第一个。在解释器中检查版本号，如果启动了 `2.7`，你可能需要在终端输入 `python3`。按
    `ctrlr+c` 随时退出解释器。


