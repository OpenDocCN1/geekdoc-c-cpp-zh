    再次感谢你购买本书。我希望它能让你获益匪，同时也让你感到乐趣。请将这本书不仅作为知识的指南，也作为灵感的来源。`C++` 似乎是一门令人生畏的语言，但只要你坚持地以天、月、年为单位进行练习，你就会像掌握生活中其他任何事情一样，完全掌握这门编程语言。我要求你在问题出现时苦恼或焦虑，因为这种情况会发生很多。那里有许多资源等待着你去阅读和发现，尽你的尽责去学习、改进并将你的
    `C++` 编程技能提升到新的水平，对你是有利的。


    ## 附录：简要黑客历史与概述


    许多人听过 `C++` 这个名字，但其实对其不一顾。如果你不精通技术，你可能认为这只是一个平庸的字母等级，但事实并非如此。


    信不信由，`C++` 是一门黑客语言，虽然它不是唯一的黑客语言，但它是最重要的语言之一，因为它功能强大且易于使用。要深入了解 `C++`，你必须更多地了解它产生的背景，那就是黑客行为。


    ### 黑客行为 (Hacking)


    黑客行为并不是新概念。只要有任何类型的技术存在，就会有人破解它们的方法。黑客行为是对从一个地方到另一个地方传输的任何数据流的操纵和/或中断。这是通过脚本实现的。你可以在网上获得预包的脚本，但许多人更倾向于编写自己脚本的老办法，因为这让他们能更灵活地处理他们想要的信息。预先设置在包中的脚本移动性有限，且非常明显。真正想要进行黑客行为的人其目标是保持低调。如果你被抓到，除非你有权执行正在正在的事情，否则你会陷入巨大的麻烦。


    ### 黑客历史


    黑客行为正式开始于 20 世纪 70 年代，当时青少年因为尝试拨打免费电话而被禁止使用电话线，结果他们发现了实现的方法。电话黑客是最大的现象，并持续了一百多年。以前通话很贵，特别是在电话线还是新的时候，所以人们自然会尝试寻找省钱的方法，而且通常会让他们付出代价。一个名叫约翰·德雷珀（John
    Draper）的人就是这样。他被捕是因为他发现只需通过向接收器吹口哨就能让其在没有接线员的情况下拨通长途电话。然后你可以输入号码并随心所欲地通话。这是天才，但是非法的。


    然而，他引发了一场革命。一群青少年聚集在一起，创建了一种破解系统的电话线，帮助人们拨打免费电话。一旦这种做法像野火一样蔓延开，斯蒂夫·乔布斯（Steve Jobs）决定开发一种他可以营销的产品，这种产品可以破解电话线并帮助人们自己打免费电话。


    大规模计算机黑客行为直到 20 世纪 80 年代才真正开始。然而，一旦开始，它像野火一样蔓延，许多人认为看看他们能做什么，以及他们如何操纵这些计算机是一个很棒的主意。


    ### 黑客类型


    世界上有几种不同的黑客类型。尽管媒体将所有黑客描绘成坏人，但他们并非如此。这也不是非黑即白的。虽然在谈论黑客时，这两个群体是最流行的，但它们之间还有许多类别，以至于只讨论最广知的两个并不是有益的。


    然而，所有子类别所属的两个大类是伦理黑客和非伦理黑客。


    **伦理黑客（Ethical hacking）**是仅用于良好目的的黑客行为。很多人有完全权限进入系统，并发现软件或硬件的所有漏洞。


    伦理黑客是负责你手机、应用程序、平板电脑或计算机中所有漏洞修复的人。这些人受公司聘佣，找出其系统中的问题，并找到最好的修复方法。这些黑客是黑客社区不可或缺的组成。


    如果没有黑客，我们就没有全球维网、`urls` 或 `HTML`。如果在伦理黑客的边界内进行，黑客行为是一个重要部分。


    然而，**非伦理黑客（Unethical hacking）**不属于当前法律允许的黑客行为范畴。它是出于恶意目的的黑客行为。破解银行主机、盗取他人信用卡和账户信息并用其来清空账户的人被称为非伦理黑客。


    非伦理黑客是真正黑客存在的性梦。这些人是那些让好人坏了名的人。


    现在来看所有不同类型黑客的术语。


    *   **白帽黑客（White Hat Hackers）**：这些是完全合伦理的黑客。他们所做的一切都是为了做好。他们检查系统，仔细搜寻任何漏洞，并建立超强大的防火墙以确保系统安全。他们创建反恶意病毒软件。

    *   **黑帽黑客（Black Hat Hacking）**：这是你必须远离的黑客类型。能力越大，责任越大。不成为黑帽黑客这种诱惑的猎物的这种巨大责任。这种类型的黑客行为会让你陷入很多麻烦，而且是不道德的。破解政府文件甚至他人的隐私可能是诱人的，但会导致严厉的纪律处分。

    *   **灰帽黑客（Grey Hat Hacking）**：这些是有时为了好的理由而做坏事的黑客。例如匿名组织（Anonymous）。他们可能会破解敏感信息文件的防火墙，但这样做是为了暴露防火墙背后发生的腐败。这些黑客通常被视为罪犯，但实际上，取决于你的观点，他们可以视为英雄。

    *   **红帽（Red Hats）**：这些是黑客世界的赏金猎人。他们利用黑客技能寻找非法黑客，例如黑帽黑客或正在做不该做坏事的灰帽。然后他们将他们交给联邦政府，以便非法黑客被捕。

    *   **蓝帽黑客（Blue Hat Hackers）**：这些是黑客世界的蓝领工人。他们坐在隔间里，整天黑客攻击以为微软或其他大公司寻找漏洞。他们做着朝九晚五的工作，只不过恰好涉及黑客行为。


    这些是黑客的主要分类。还有精英黑客，他们花费整个寿命成为世界上见过的最优秀的黑客；以及绿帽黑客，他们并不在乎黑客行为，只是为了好玩。黑客行为可以是一个非常有用的工具，如果你方法得当，甚至可以成为一种职业。


    现在重要的是，所有这些黑客都将以不同的方式工作，但他们将使用相同类型的代码从其他计算机中获取他们想要的信息。黑帽黑客将专注于进入系统并获取他们所需的信息以获得成功，而白帽黑客将致力于将这些黑客挡在系统之外。虽然他们的方式不同，但他们将使用相同的工具，并看最终谁会胜出。


