            self.connection = connection


            self.BYOD = BYOD


        def __str__(self):


           return "{} is owned by {} and it uses {}.  BYOD? {}".format(self.name,
    self.owner, self.connection, self.BYOD)


    device1 = laptop("STAFF12", "IT", "Staff-wifi")


    device2 = cellular("Jack''s-iDevice", "Jack", "4G LTE", "yes")


    print (device1)


    print (device2)


    print (device.get_total())


    In this program, the parent class “device” is created with 2 attributes – name
    and owner.  The other classes, laptop and cellular, also contain name and owner
    attributes, so we set them up to inherit them from the parent class.  To set a
    class into a parent/child relationship, the child class must pass the parent class
    as a parameter in the declaration.  This is why “class cellular(device)” is used,
    because we are setting cellular to be linked to device. 


    Secondly, we call the device constructor method specifically within each child
    class constructor method.  When this is done, the child class actually runs the
    entire parent constructor method.  Name and owner are obtained this way, and also
    the “total_devices += 1” line gets passed as well.


    Both children contain a __str__ method, even though the parent class also has
    one.  Through a process called overwriting, if a special method is called that
    exists in both the parent and child, than only the child method will run.  In
    the absence of a called method in a child, the parent will runs its method instead. 
    This is why referencing a laptop object as a string will display laptop information,
    but deleting a laptop object will fall back to the parent and run its destructor
    method instead.


    Understanding how inheritance works can provide your applications with unprecedented
    organization and composition.  Most higher-level and advanced programs take advantage
    of classes and their properties to quickly devise a framework for many applications
    such as database tools, so learning them would undoubtedly improve your Python
    skills.


    Example Program 7 – project7.py


    class house:


        def __init__(self, name, bedrooms, bathrooms):


            self.name = name


            self.bedrooms = bedrooms


            self.bathrooms = bathrooms


            self.cost = 0


            print("Living space for sale!")


        def __del__(self):


            print("Living space off the market.")


    class apartment(house):


        def __init__(self, name, bedrooms, bathrooms):


            house.__init__(self, name, bedrooms, bathrooms)


            self.montly_payment = 0


    forsale1 = apartment("100 Col. Ave", 2, 2)


    forsale1.montly_payment = 250


    Homework program:


    *   Expand the database program that you could optionally create in the last chapter
    to include inheritance.


    Modules


    Every bit of functionality that we have used so far is built-in to Python already. 
    Python is an expansive language, but additional features can be added to Python
    easily through modules.  Those familiar with C can relate modules to “h” files
    and preprocessor statements.  Modules do much the same thing, they are included
    in order to add new functions and commands to Python.


    To add a new module, we only need to include one statement at the top of our program.


    import math


    So in this line, we import the “math” module, which opens up a slew of new functions
    for us to use.


    import math


    print (math.sin(3))


    answer = math.sqrt(16)


    print (answer)


    print (math.gcd(100, 125))


    In particular, sqrt(), sin(), and gcd() are three examples you can notice above. 
    Every module has a defined purpose, and math’s is to provide advanced mathematical
    functions.  Here is a list of the most important ones.


    *   math.sqrt() – square root of number


    *   math.sin() – sine of number


    *   math.cos() – cosine of number


    *   math.tan() – tangent of number


    *   math.log() – two parameters, log and base


    *   math.pi – 3.14159


    *   math.e – 2.71828


    Those needing to use complicated functions such as the ones above only need to
    “import math” at the top of the program.


    Other specialized modules exist as well, such as datetime.  Datetime is a module
    that provides time-keeping functions. 


    import datetime


    current_time = datetime.datetime.now()


    print (current_time.hour)


    print (current_time.minute)


    print (current_time.second)


    Other functions provided through datetime include:


    *   year


    *   month


    *   day


    Or os, a module that unlocks operating system functions for altering files.  Here
    is a small program for creating a new folder and then making it the active directory.


    import os


    os.mkdir("folder") #make folder


    os.chdir("folder") #go into folder


    os.chdir("..") #up one directory


    More functions available to os are listed.


    *   os.rmdir() – delete specified folder


    *   os.remove() – delete specified file


    *   os.path.exists() – checks to see if specified file exists


    *   os.rename() – renames specified file to second parameter supplied


    And other highly useful modules, such as random, statistics, and pip exist that
    can give new features to your Python applications that were not previously possible. 
    Python also has support for downloading and using user-created modules, but that
    is an advanced concept not covered here.


    Example Program 8 – project8.py


    import random


    print ("Fortune telling...")


    rng = random.randrange(1, 7)


    if (rng == 1):


        print("You will soon come into money.")


    elif (rng == 2):


        print("Consider buying stocks.")


    elif (rng == 3):


        print("Look both ways before crossing.")


    elif (rng == 4):


        print("Call your relatives...")


    elif (rng == 5):


        print("You will get a phone call.")


    else:


        print("Future cloudy... Try again.")


    Homework project:


    *   Create a “sampler” program that shows off various Python module features.


    Common Errors


    Because many programmers choose Python as their first language to learn, they
    often succumb to a few common errors.  If your applications are not functioning
    correctly, or if you are looking for a few of the best programming practices,
    than this section will help you.  When code is run through Python, it may stop
    and return an error to you.  By reading the error you can learn which line the
    error comes from, and usually Python will point (^) to the exact character that
    is wrong.  Use the information that is given to you to understand your error and
    rectify the situation.


    Not specifying the correct parameters is a common newbie mistake.  When putting
    values between the parentheses for a function, you must pay close attention to
    what kind of data it expects.  Some functions require only integers, and some
    have 2 or more parameters to enter.  When in doubt, consult the Python documentation
    page for the specific function you are working with.  Advanced IDEs, such as Atom
    and Eclipse often are programmed to display an example parameter list as you are
    typing out a function, and you can follow along with the example to know what
    each parameter is expecting.'
