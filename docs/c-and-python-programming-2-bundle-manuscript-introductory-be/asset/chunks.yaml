    Initializing arrays


    You can initialize arrays one by one or using a single statement. Example


    double balance [5]= {1000.0, 2.0, 3.4, 17.0, 50.0};


    The numbers that are found between the bracket can’t end up higher than the amount
    of elements that you are using.  This means that you cannot have six sets of numbers
    when your array title only specified five. However, if you do not specify the
    size, then an array of just the right size is created. You would type it as follows


    double balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};


    This creates the exact same array as the previous example, only you did not specify
    the array size so it was created for you. Pretty nifty.


    Now that you know how to write an array, it is time to move on to putting it into
    the actual program. This program is a bit more advanced than the ones before,
    and has a few more elements. You can look up these elements on www.compileonline.com.
    You will be directed to a lot of tutorials and there is even a PDF file for you
    to download.


    Here is the formula for your program to assign an array.


    #include <iostream>


    using namespace std;


    #include <iomanip>


    using std::setw;


    int main ()


    {


    int n[ 10 ];  //n is an array of ten integers


                // initialize elements of array n to 0


    for ( int i=0; I <10; i++)


    {


    n[i] =i+100; // set ekement at location I to i+ 100


    }


    cout << element << setw(13) << value<< endl:


    //output each array element''s value


    for (int j=0; j<10; j++)


    {


    cout << setw(7)<< j << setw(13) <<n[j] << endl;


    }


    return 0


    }


    This program was able to use the setw() function in order to format the output
    that you see.


    Loop Types


    The loop types are used any time that you would like to take one type of code
    and execute it over and over. These statements are going to be done one right
    after the other. The loop statement will make it easier to execute these statements
    as many times as you would like.


    There are four types of loops. These loops handle different requirements.


    While loop


    The While loop is going to continue repeating the loop as long as a certain condition
    is met. It is going to test out this condition each time it restarts the loop
    cycle and will do this until the condition is no longer true.


    Written like this


    while (condition)


    {


    statement(s);


    }


    For Loop


    This loop executes a statement sequence over and over again while abbreviating
    the code that manages the loop variables.


    Written like this


    for ( init; condition; increment)


    {


    statement(s);


    }


    Do.. while loop


    The Do…while loop is going to be similar to the while statement, but it is going
    to test the condition when you reach the end of your statement, rather than the
    beginning.


    Written like this


    do


    {


    statement(s);


    }while (condition);


    Nested loops


    The nested loop is going to have a loop that works inside of another loop, to
    create a continuous loop of loops. This one can get confusing after awhile.


    Written like this


    while (condition)


    {


    while (condition)


    {


    statement(s)


    }


    statement(s) // you can put more statements


    }


    Why is this important


    Eventually you are going to want to branch out. I would highly recommend to further
    enhance your C++knowledge of the basics to ensure mastery and better understanding
    of more difficult tasks.


    Though these may seem like they are too advanced for some or too easy for others,
    it’s always good to do other practices and tutorials to enrich your programming
    skills. You can find tutorials at www.compileonline.com. It cannot be stressed
    enough how much of an essential tool this is. You have to check it out for yourself,
    and find out just how useful it really is. There are tutorials for other languages
    as well, not just C++ dabble around and see what you like.


