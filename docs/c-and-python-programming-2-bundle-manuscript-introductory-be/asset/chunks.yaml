    ## Introduction

    Thank you for downloading the book “Hacking University: Junior Edition. Learn
    Python Computer Programming from Scratch. Become a Python Zero to Hero. The Ultimate
    Beginners Guide in Mastering the Python Language.”


    Python is a powerful and highly recommended language for beginners for a variety
    of reasons. This book serves as a beginners guide for those that have never written
    programming code before, so even if the thought of programming is daunting this
    book can explain it in simple terms. We will introduce the process from the very
    beginning with actual code examples; follow along to learn a valuable computer
    skill that can potentially land you a job working with the elegant Python language.


    ## Related Software

    For enhancing your Python skill, use an IDE. If you have not downloaded it yet,
    Atom is highly recommended for Python programming. Atom is customizable, in that
    you can install add-ons at any time to make programming easier. `autocomplete-python`
    is one such add-on that can guess what you are typing and automatically fill in
    the rest of the command.


    `VI` and `Emacs` are two other popular text editors for programmers. Both are
    considered highly advanced and optimized for writing code, but a bit of a “flame
    war” exists between fans of both softwares. For the Linux Python programmer, investigate
    the two text editors and test whether it helps with Python workflow.


    After you have finished a particularly useful Python program and wish to distribute
    it to users, you have to keep in mind that many of them do not have Python installed
    and will likely not want to install it just to run your program. `PyInstaller`
    (`http://www.pyinstaller.org/`) is a piece of software that builds your Python
    script and the needed modules into an `.exe` file that does not need Python to
    run. It is a handy software should distribute your applications.


    ## Online Resources

    For obtaining online help related to Python, you can always check the online documentation
    (`https://www.python.org/doc/`). The documentation contains examples and manual
    pages for every function built-in to Python and its included modules.

