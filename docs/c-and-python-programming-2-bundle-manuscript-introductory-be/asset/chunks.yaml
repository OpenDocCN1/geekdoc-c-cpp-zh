- fmt: "\nNow that the basics of Python 3 are explained, we can begin to offer truly\
    \ interactive programs by implementing decision structures into our code. Decision\
    \ structures are pieces of code (called conditional statements) that evaluate\
    \ an expression and branch the program down differing paths based on the outcome.\
    \ Observe the following example:\n\n```python\nuser_input = int(input(\"What is\
    \ 4 / 2? \"))\n\nif (user_input == 2):\n    print (\"Correct!\")\nelse:\n    print\
    \ (\"Incorrect...\")\n```\n\nFirst we obtain input from the user. We test `user_input`\
    \ against `2` (the correct answer). If the conditional statement turns out true,\
    \ then the program will print “Correct!”. However, if the user provides the wrong\
    \ answer Python will return “Incorrect...”. There is a lot of new concepts going\
    \ on here, so we will break it down line by line.\n\nThe first line is familiar\
    \ to us; it obtains input, converting it into an integer and assigning it to the\
    \ variable `user_input`. Line 2 introduces a new function-an “`if statement”.\
    \ `if` statements are conditionals that evaluate the expression contained within\
    \ the parenthesis. Our exact statement checks to see if `user_input` is `2`, and\
    \ if it is than the immediately following line of code is run. Comparisons use\
    \ the `==` operator instead of the `=` operator. Double equal signs are checking\
    \ for equality while single equal signs are only used to assign variables. Lastly,\
    \ a colon follows the `if` statement.\n\nIndentations are used extensively in\
    \ Python to separate off blocks of code. Under the `if` statement is a tabbed\
    \ line with a `print()` function. Because this line is tabbed in, it will not\
    \ run normally in code. Rather, the line will only run if the conditional `if`\
    \ statement is proven true. Because our user input `3` the conditional will evaluate\
    \ to “False” and the “Correct!” line will not run. Instead the program moves on\
    \ to the “`else statement`”. `else` is a keyword that means “run when the `if`\
    \ statement fails”. Another indented line follows the conditional, but this time\
    \ the indented code actually runs because `else` becomes activated.\n\nIf the\
    \ user had input the correct answer of `2` instead, the `if` statement would evaluate\
    \ to true and the console would print “Correct”. In that situation, the `else`\
    \ statement would not run at all. Focus once again on the indented code and understand\
    \ that those lines are indented because they are part of the “`if`” and “else”\
    \ code blocks. Also realize that only one statement from a decision structure\
    \ can ever run in a program, so if `else` runs, that means `if` did not run. Likewise\
    \ a program that has `if` activated will not run the code block under `else`.\
    \ Conditional statements are not limited to single lines of code, as you can see\
    \ below.\n\n```python\nuser_input = input(\"What language is this written in?\
    \ \")\n\nif (user_input == \"Python\"):\n    print (\"Correct!\")\nelse:\n   \
    \ print (\"Incorrect...\")\n    print (\"This is not written in {}, it uses Python!\"\
    .format(user_input))\n```\n\nAnother indented line is within the `else` code block,\
    \ and both lines will run if the user does not correctly input “Python”. This\
    \ program does indeed compare strings, so quotations must surround the text.\n\
    \n### Conditional Operators\n\nDouble equal signs (`==`) are only one of the many\
    \ operators that can be used to create a conditional expression. This small list\
    \ shows other operators in Python.\n\n- `>` - Greater than\n- `<` - Less than\n\
    - `==` - Equal to\n- `>=` - Greater than or equal to\n- `<=` - Less than or equal\
    \ to\n- `!=` - Not equal to\n\n`if` statements evaluate whether the expression\
    \ in the parenthesis is true; the above operators allow for some interesting expressions.\n\
    \n```python\nage = int(input(\"How old are you? \"))\n\nif (age <= 18):\n    print\
    \ (\"Starting early! Good for you!\")\nelse:\n    print (\"Ah, a good age to learn.\"\
    )\n\nprint (\"Thank you for downloading this book.\")\n```\n\nA clever use of\
    \ indentations is used here. If the user’s age is 18 or under, it will congratulate\
    \ them then skip the `else` statement and finally print out the thank you message.\
    \ If the user is above 18 it will display the `else` message and then also thank\
    \ them. No matter which conditional runs, the user will still receive the thank\
    \ you message. The indentation makes all the difference about what code lines\
    \ will actually run within a decision structure, and you must pay close attention\
    \ to avoid a logic error.\n\nFor situations that require more than just two potential\
    \ outcomes, the keyword “`elif`” can be used.\n\n```python\nage = int(input(\"\
    How old are you? \"))\n\nif (age <= 18 and age > 0):\n    print (\"Starting early!\
    \ Good for you!\")\nelif (age >= 80):\n    print (\"Never too late to learn!\"\
    )\nelif (age > 18 and age < 80):\n    print (\"Ah, a good age to learn.\")\nelse:\n\
    \    print (\"That seems like an invalid age.\")\n    quit()\n\nprint (\"Thank\
    \ you for downloading this book.\")\n```\n\n`elif` is a keyword that can be used\
    \ to split the decision making process into multiple branching paths. Between\
    \ `if` and `else` statements, any number of `elif` conditionals can be used. Also,\
    \ another new keyword is used above-“`and`”. Our first comparison checks to see\
    \ if `age` is less than or equal to `18` AND greater than `0`. Therefore that\
    \ conditional will only evaluate to true if the `age` value satisfies both requirements.\
    \ Pretend the user input `75`. The first statement evaluates, and `75` is indeed\
    \ greater than `0`, but it is not also less than `18`, so that statement is skipped.\
    \ Then, the first `elif` is evaluated. `Age` is not greater than `80`, so that\
    \ statement is skipped as well. Thirdly, `age` is definitely between `18` and\
    \ `80`, so the console prints “Ah, a good age to learn” and then skips the `else`\
    \ statement altogether.\n\nRemembering that only one statement in a decision “tree”\
    \ can ever run, we can see that any `elif` that activates essentially runs its\
    \ code block and then breaks from the decision structure. `else` is used as a\
    \ “catch-all” type expression in our above program. Any invalid input, such as\
    \ \"-1”, would be picked up by `else` and displayed as such. Good programming\
    \ form comes from catching potential user errors like this, and as an aspiring\
    \ programmer you should always be expecting the user to incorrectly input values\
    \ whenever the chance arises.\n\n“`And`” is a comparison operator that forces\
    \ both parts of an expression to be true. Another operator, “`or`”, is used to\
    \ force only one part of the expression to evaluate to true.\n\n```python\nelif\
    \ (age == 25 or age == 50 or age == 75):\n    print (\"Happy quarterly birthday!\"\
    )\n```\n\nIf we were to put this `elif` within the above program (under the first\
    \ `if`), we would see that only one part of the expression must be true for the\
    \ whole comparison to be true. The user’s age could be `25`, `50`, or `75` and\
    \ the application would say “Happy quarterly birthday”. Using `and` instead of\
    \ `or` would be impossible, because the age cannot be `25` and `50` and `75` all\
    \ at the same time. The keywords that we use for comparisons are helpful and greatly\
    \ useful, but if used incorrectly they can lead to logic errors.\n\n### Example\
    \ Program 2 – `project2.py`\n\n```python\nprint(\"Python Quiz!\")\nanswered =\
