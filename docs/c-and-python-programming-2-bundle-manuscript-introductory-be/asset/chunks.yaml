  trans: "\n\n通过一种名为“继承”的过程，类可以建立父/子关系，其中某些父类属性可以被子类“继承”。在类之间有效地共享属性可以实现更优优的组织结构，并减少整体代码量。\n\
    \n```python\nclass device:\n    total_devices = 0\n    def __init__(self, name,\
    \ owner):\n        self.name = name\n        self.owner = owner\n        device.total_devices\
    \ += 1\n    def __del__(self):\n        device.total_devices -= 1\n    def __str__(self):\n\
    \        return \"{}\".format(self.name)\n    def get_total():\n        return\
    \ device.total_devices\nclass laptop(device):\n    def __init__(self, name, owner,\
    \ wifi):\n        device.__init__(self, name, owner)\n        self.wifi = wifi\n\
    \    def __str__(self):\n        return \"{} is owned by {} and connected to {}\"\
    .format(self.name, self.owner, self.wifi)\nclass cellular(device):\n    def __init__(self,\
    \ name, owner, connection, BYOD):\n        device.__init__(self, name, owner)\n\
    \        self.connection = connection\n        self.BYOD = BYOD\n    def __str__(self):\n\
    \        return \"{} is owned by {} and it uses {}. BYOD? {}\".format(self.name,\
    \ self.owner, self.connection, self.BYOD)\ndevice1 = laptop(\"STAFF12\", \"IT\"\
    , \"Staff-wifi\")\ndevice2 = cellular(\"Jack's-iDevice\", \"Jack\", \"4G LTE\"\
    , \"yes\")\nprint (device1)\nprint (device2)\nprint (device.get_total())\n```\n\
    \n在这个程序中，父类 `device` 包含了 2 个属性——`name` 和 `owner`。其他类 `laptop` 和 `cellular` 也包含\
    \ `name` 和 `owner` 属性，因此我们设置它们从父类继承这些属性。要建立类之间的父/子关系，子类必须在声明中将父类作为参数传递。这就是为什么使用\
    \ `class cellular(device)` 的原因，因为我们设置 `cellular` 链接到 `device`。\n\n其次，我们在每个子类的构造方法内部显式地调用了\
    \ `device` 构造方法。这样做之后，子类实际上运行了整个父类构造方法。`name` 和 `owner` 是通过这种获得的，`total_devices\
    \ += 1` 这一行也被传递了。\n\n两个子类都包含一个 `__str__` 方法，尽管父类也有一个。通过一种名为“重写”（overwriting）的过程，如果调用了父类和子类共同存在的特殊方法，则只有子类方法会运行。如果子类中没有调用的方法，则运行父类的方法。这就是为什么将\
    \ `laptop` 对象作为字符串引用会显示笔记本信息，但删除 `laptop` 对象时将退回到父类并运行其析构方法。\n\n理解继承如何工作可以为你的应用程序提供前所未有的组织结构和组合。大多数高级和进阶程序都利用类及其属性来快速为数据库工具等许多应用程序构建框架，因此学习它们无疑会提高你的\
    \ Python 技能。\n\n### 示例程序 7 – project7.py\n\n```python\nclass house:\n    def __init__(self,\
    \ name, bedrooms, bathrooms):\n        self.name = name\n        self.bedrooms\
    \ = bedrooms\n        self.bathrooms = bathrooms\n        self.cost = 0\n    \
    \    print(\"Living space for sale!\")\n    def __del__(self):\n        print(\"\
    Living space off the market.\")\nclass apartment(house):\n    def __init__(self,\
    \ name, bedrooms, bathrooms):\n        house.__init__(self, name, bedrooms, bathrooms)\n\
    \        self.montly_payment = 0\nforsale1 = apartment(\"100 Col. Ave\", 2, 2)\n\
    forsale1.montly_payment = 250\n```\n\n**作业程序：**\n* 扩展上一章中可选创建的数据库程序，包含继承功能。\n\n\
    ### 模块\n\n我们目前为止使用的每个功能都是 Python 内置的。Python 是一门功能丰富的语言，但可以通过模块轻松地向 Python 添加额外功能。熟悉\
    \ C 语言可以将模块与“h”文件和预处理器语句联系起来。模块的作用非常相似，它们被包含是为了为 Python 添加新的函数和命令。\n\n要添加新模块，我们只需要在程序的顶部包含一条语句。\n\
    \n```python\nimport math\nprint (math.sin(3))\nanswer = math.sqrt(16)\nprint (answer)\n\
    print (math.gcd(100, 125))\n```\n\n特别地，`sqrt()`、`sin()` 和 `gcd()` 是你在上面看到的三个例子。每个模块都有定义的用途，而\
    \ `math` 的作用是提供高级数学函数。这里是最重要的函数列表。\n\n* `math.sqrt()` – 数字的平方根\n* `math.sin()`\
    \ – 数字的正弦\n* `math.cos()` – 数字的余弦\n* `math.tan()` – 数字的正切\n* `math.log()` – 两个参数，对数和底\n\
    * `math.pi` – 3.14159\n* `math.e` – 2.71828\n\n需要使用上面那些复杂函数的人只需要在程序顶部 `import\
    \ math` 即可。\n\n其他其他专门的模块，例如 `datetime`。Datetime 是一个提供计时函数的模块。\n\n```python\nimport\
    \ datetime\ncurrent_time = datetime.datetime.now()\nprint (current_time.hour)\n\
    print (current_time.minute)\nprint (current_time.second)\n```\n\n通过 `datetime`\
    \ 提供的其他函数包括：\n* `year`\n* `month`\n* `day`\n\n或者 `os`，一个用于解锁操作系统功能以修改文件的模块。这里有一个创建一个新文件夹然后将其设置为活动目录的小程序。\n\
    \n```python\nimport os\nos.mkdir(\"folder\") #创建文件夹\nos.chdir(\"folder\") #进入文件夹\n\
    os.chdir(\"..\") #返回上级目录\n\n`os` 可用的更多函数列举如下。\n\n* `os.rmdir()` – 删除指定的文件夹\n*\
    \ `os.remove()` – 删除指定的文件\n* `os.path.exists()` – 检查文件是否存在\n* `os.rename()` –\
    \ 将指定的文件重命名为第二个参数\n\n还有许多非常有用的模块，例如 `random`、`statistics` 和 `pip`，它们可以为你的应用程序提供以前不可能的功能。Python\
    \ 还支持下载和使用用户创建的模块，但这是一个此处未涵盖的高概念。\n\n### 示例程序 8 – project8.py\n\n```python\nimport\
    \ random\nprint (\"Fortune telling...\")\nrng = random.randrange(1, 7)\nif (rng\
    \ == 1):\n    print(\"你很快就会发财了.\")\nelif (rng == 2):\n    print(\"考虑买点股票.\")\n\
    elif (rng == 3):\n    print(\"过路前先看左右.\")\nelif (rng == 4):\n    print(\"给你的亲戚打电话...\"\
    )\nelif (rng == 5):\n    print(\"你会收到一个电话.\")\nelse:\n    print(\"未来多云……再试一次.\"\
    )\n```\n\n**作业项目：**\n* 创建一个“采样”程序，展示各种模块功能。\n\n### 常见错误\n\n由于许多程序员选择 Python 作为他们学习的第一门语言，他们往往会陷入一些常见的错误中。如果你的应用程序运行不正常，或者你正在寻找一些最佳编程实践，本节将对你有帮助。当代码通过\
    \ Python 运行时，它可能会停止并向你返回错误。通过阅读错误，你可以学习错误来自哪一行，通常 Python 会指向 (^) 错误的精确字符。利用提供给你的信息来理解你的错误并纠正情况。\n\
    \n未指定正确的参数是新手的常见错误。在函数括号之间填写值时，你必须注意它期望什么类型的数据。某些函数只需要整数，而有些则有 2 个或更多参数。如果有疑问，请查阅你正在处理的特定函数的\
    \ Python 文档。高级 IDE（如 `Atom` 和 `Eclipse`）通常被设计为在你输入函数时显示示例参数列表，你可以跟随示例来了解每个参数期望什么。\n\
    \n"
