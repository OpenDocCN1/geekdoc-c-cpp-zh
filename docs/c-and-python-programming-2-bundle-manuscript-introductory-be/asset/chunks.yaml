    the attributes “Tim” and “Freshman”.  This would have previously taken two lines,
    but it is condensed considerably with classes.  Classes compartmentalize the related
    variables of the object so that each “student” declared has the 3 properties “name”,
    “grade”, and “gpa”.  The second line of our class declaration contains __init__,
    which is a “method” (user defined function) that runs when an object in the student
    class is created.  Init’s parameters are the ones required when creating that
    object.  Self is not actually a parameter, it just refers to “student”, but “name”
    and “grade” are required, which is why we included them when creating “student1”. 
    Attributes of student1 can be called like so:


    print (student1.name)


    Which would simply print “Tim”.  We did not declare the GPA variable during the
    student1 initialization, so we can do that with an assignment statement.


    student1.gpa = 4.0


    Or otherwise change an attribute that already exists.


    student1.grade = “Sophomore”


    If we were to create another object, it would have its own set of attributes that
    are completely different from student1.


    student2 = student("Mary", "Senior")


    Where student1.grade is different from student2.grade, even though they share
    the same variable name.  For large projects with multiple repeating variables,
    classes can reduce the amount of code clutter and variable names to keep track
    of.


    Looking back to our custom class, we can expand upon it to achieve user defined
    functions within the class itself.  


    class student:


        def __init__(self, name, grade):


            self.name = name


            self.grade = grade


            self.gpa = 0.0


        def record(self):


            return "Student {} is a {} with a {}".format(self.name, self.grade, self.gpa)


    student3 = student("Lily", "Junior")


    student3.gpa = 3.67


    print (student3.record())


    The __init__ stays the same, but we add a UDF definition with the name “record”. 
    It passes the parameter self (because it has to refer to the class) and returns
    a formatted string.  In our actual main program student3 is created.  Finally,
    we call the UDF with student3.record() (object.function).  It returns our formatted
    string, and therefore it is printed out by print(). 


    Special Methods


    The __init__ method is actually a form of a UDF.  However, methods that are surrounded
    by two underscores are special methods within Python, which means they run automatically
    at certain times.  __init__ is a special method also specifically called a “constructor
    method”.  Constructor methods get called whenever an object is created, and that
    is why we put variable declarations within it.  When student3 is created, so too
    are student3.name, student3.grade, and student3.gpa.  Therefore, any code that
    is put within the __init__ block will be activated any time an object is created
    for the first time. 


    Other special methods exist, and they are called on different events.


    *   __del__ - called whenever an object is deleted (del).  Also called destructor
    method.


    *   __str__ - called when an object is passed as a string


    *   __setattr__ - will run every time an attribute is set with a value


    *   __delattr__ - same as setattr, but only runs when an attribute is deleted


    Adding in these special methods can show when they run.


    class student:


        def __init__(self, name, grade):


            self.name = name


            self.grade = grade


            self.gpa = 0.0


        def __str__(self):


           return "{}".format(self.name)


        def record(self):


            return "Student {} is a {} with a {}".format(self.name, self.grade, self.gpa)


    student4 = student("Barry", "Professor")


    print (student4)


    When student4 is printed (referenced as a string), the __str__ special method
    takes over and returns the “name” attribute of the object.  If this special method
    was not in there, we would not get the intended output from referencing the object.


    Finally, classes are useful because we can create “class variables” within them. 
    “Name” and “GPA” are attribute variables that are specific to each object declared,
    but there can also be class variables that are shared by all objects.  For instance,
    this program will keep track of the total number of objects using a class variable.


    class food:


        total_foods = 0


        def __init__(self, name):


            self.name = name


            self.calories = 0


            self.foodgroup = ""


            food.total_foods += 1


        def __del__(self):


            food.total_foods -= 1


        def __str__(self):


           return "{}".format(self.name)


        def get_total():


            return food.total_foods


        def record(self):


            return "Food {0} is a {2} with {1} calories.".format(self.name, self.calories,
    self.foodgroup)


    food1 = food("Carrot Stew")


    food1.calories = 210


    food1.foodgroup = "Vegetables"


    food2 = food("Buttered Toast")


    food2.calories = 100


    food2.foodgroup = "Grains"


    print (food.get_total())


    del food2


    print (food.get_total())


    As the program creates a food, 1 is added to total_foods.  Then, a food object
    is deleted so 1 is taken away.  The console prints 2, then 1 to show how our UDF
    can be called to check the class variable.  Keeping track of the number of something
    is a common use for class variables, but they are highly useful for other situations
    as well.


    Example Program 6 – project6.py


    class house:


        def __init__(self, name, bedrooms, bathrooms, cost):


            self.name = name


            self.bedrooms = bedrooms


            self.bathrooms = bathrooms


            self.cost = cost


            print("House for sale!")


        def __del__(self):


            print("House off the market.")


    print("House for sale:")


    user_input = input("What is the address of the house? ")


    user_input2 = int(input("How many bedrooms? "))


    user_input3 = int(input("How many bathrooms? "))


    user_input4 = int(input("How much does it cost? "))


    house1 = house(user_input, user_input2, user_input3, user_input4)


    print("Looking for buyers...")


    for x in range (0, house1.cost):


        x += 1 #wait a while


    print("Sold!")


    del house1


    Homework program:


    *   Use classes to make a database organization program.  Users should be able
    to create new entries of a class and set variables, and also view them at will.


    Inheritance


    In your more robust and expansive programs, you might use multiple related classes. 
    As an example, think of the program where you must categorize devices on a network. 
    Each device type (desktop, laptop, phone, etc…) will have its own class, but you
    will ultimately be repeating commonly used attributes.  Both desktops and laptops
    will have names, departments, and IP addresses, but they will also have a few
    distinct variables specific to them such as Wi-Fi for the laptops and graphics
    cards for the desktop.'
