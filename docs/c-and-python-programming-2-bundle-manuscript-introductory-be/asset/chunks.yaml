  trans: "\n既然 Python 3 的基础知识已经解释完毕，我们可以通过在代码中实现决策结构来开始提供真正的交互式程序了。决策结构是代码片段（称为条件语句），它们评估一个表达式并根据结果将程序分支到不同的路径。观察以下示例：\n\
    \n```python\nuser_input = int(input(\"What is 4 / 2? \"))\n\nif (user_input ==\
    \ 2):\n    print (\"Correct!\")\nelse:\n    print (\"Incorrect...\")\n```\n\n\
    首先，我们从用户处获取输入。测试 `user_input` 是否等于 `2`（正确答案）。如果条件语句结果为真，程序将打印“Correct!”。然而，如果用户提供了错误答案，Python\
    \ 将返回“Incorrect...”。这里涉及许多新概念，因此我们将逐行进行分析。\n\n第一行对我们来说很熟悉：它获取输入，将其转换为整数并赋值给变量\
    \ `user_input`。第二行引入了一个新函数——“`if 语句`”。`if` 语句是用于评估括号内表达式的条件判断。我们的具体语句会检查 `user_input`\
    \ 是否为 `2`，如果是，则执行紧随其后的代码行。比较使用 `==` 运算符而不是 `=` 运算符。双等号用于检查相等性，而单等号仅用于变量赋值。最后，`if`\
    \ 语句后面跟着一个冒号。\n\n缩进在 Python 中被广泛用于区分代码块。`if` 语句下方有一个带有 `print()` 函数的缩进行。由于此行被缩进了，它不会在代码中正常运行。相反，只有当条件\
    \ `if` 语句被证明为真时，该行才会运行。因为我们的用户输入了 `3`，条件将评估为“False”，“Correct!”一行将不会运行。相反，程序将移动到“`else\
    \ statement`”。`else` 是一个关键字，意思是“当 `if` 语句失败时运行”。条件语句后还有另一个缩进行，但这次由于 `else` 被激活，缩进代码实际上会运行。\n\
    \n如果用户输入了正确答案 `2`，则 `if` 语句将评估为真，控制台将打印“Correct”。在这种情况下，`else` 语句将完全不会运行。再次关注缩进代码并理解这些行之所以缩进是因为它们是“`if`”和“`else`”代码块的一部分。此外要意识到，程序中决策结构中只能有一个语句运行，因此如果\
    \ `else` 运行了，意味着 `if` 没有运行。同样，激活了 `if` 的程序将不会运行 `else` 下方的代码块。条件语句并不限于单行代码，如下所示。\n\
    \n```python\nuser_input = input(\"What language is this written in? \")\n\nif\
    \ (user_input == \"Python\"):\n    print (\"Correct!\")\nelse:\n    print (\"\
    Incorrect...\")\n    print (\"This is not written in {}, it uses Python!\".format(user_input))\n\
    ```\n\n另一个缩进行位于 `else` 代码块中，如果用户没有正确输入“Python”，则两行都将运行。此程序确实在比较字符串，因此必须用引号包围文本。\n\
    \n### 条件运算符\n\n双等号（`==`）只是用于创建条件表达式的许多运算符之一。这个小列表显示了 Python 中的其他运算符。\n\n- `>`\
    \ - 大于\n- `<` - 小于\n- `==` - 等于\n- `>=` - 大于等于\n- `<=` - 小于等于\n- `!=` - 不等于\n\n\
    `if` 语句评估括号中的表达式是否为真；上述运算符允许一些有趣的表达式。\n\n```python\nage = int(input(\"How old\
    \ are you? \"))\n\nif (age <= 18):\n    print (\"Starting early! Good for you!\"\
    )\nelse:\n    print (\"Ah, a good age to learn.\")\n\nprint (\"Thank you for downloading\
    \ this book.\")\n```\n\n这里巧妙地利用了缩进。如果用户年龄为 18 岁或以下，它将祝贺他们，跳过 `else` 语句，最后打印感谢消息。如果用户年大于\
    \ 18 岁，它将显示 `else` 消息，然后也感谢他们。无论运行哪个条件，用户都会收到感谢消息。缩进决定了决策结构中哪些代码行会实际运行，你必须密切注意以避免逻辑错误。\n\
    \n对于需要两个两个潜在结果的情况，可以使用关键字“`elif`”。\n\n```python\nage = int(input(\"How old are\
    \ you? \"))\n\nif (age <= 18 and age > 0):\n    print (\"Starting early! Good\
    \ for you!\")\nelif (age >= 80):\n    print (\"Never too late to learn!\")\nelif\
    \ (age > 18 and age < 80):\n    print (\"Ah, a good age to learn.\")\nelse:\n\
    \    print (\"That seems like an invalid age.\")\n    quit()\n\nprint (\"Thank\
    \ you for downloading this book.\")\n```\n\n`elif` 是一个可以将决策过程拆分为多个分支路径的关键字。在 `if`\
    \ 和 `else` 语句之间可以使用任意数量的 `elif` 条件。此外，上面还使用了另一个新关键字“`and`”。我们的第一个比较检查 `age` 是否小于或等于\
    \ `18` 且大于 `0`。因此，只有当 `age` 值同时满足这两个要求时，该条件才会评估为真。假设用户输入了 `75`。评估第一个语句，`75` 确实大于\
    \ `0`，但它也不小于 `18`，因此该语句被跳过。然后评估第一个 `elif`。`Age` 不大于 `80`，所以该语句也被跳过。第三，`age` 肯定在\
    \ `18` 和 `80` 之间，因此控制台打印“Ah, a good age to learn”，然后完全跳过 `else` 语句。\n\n记住决策“树”中只能有一个语句运行，我们可以看到任何激活的\
    \ `elif` 本质上都会运行其代码块然后跳出决策结构。在上面的程序中，`else` 被用作一种“兜底”类型的表达式。任何无效输入（例如“-1”）都会被\
    \ `else` 捕获并显示。良好的编程习惯源于捕获此类潜在的用户错误，作为一名有志的程序员，你应该在任何机会出现时预预期用户输入错误的值。\n\n“`And`”是一个比较运算符，强制表达式的两个部分都为真。另一个运算符“`or`”用于强制表达式的某一部分评估为真。\n\
    \n```python\nelif (age == 25 or age == 50 or age == 75):\n    print (\"Happy quarterly\
    \ birthday!\")\n```\n\n如果我们把这个 `elif` 放在上面的程序中（第一个 `if` 下方），我们将看到只要表达式的某部分为真，整个比较就为真。用户的年龄可以是\
    \ `25`、`50` 或 `75`，应用程序会说“Happy quarterly birthday”。使用 `and` 代替 `or` 是可能的，因为年龄不能同时是\
    \ `25`、`50` 和 `75`。我们用于比较的关键字非常有帮助且有用，但如果使用不当，会导致逻辑错误。\n\n### 示例程序 2 – `project2.py`\n\
    \n```python\nprint(\"Python Quiz!\")\nanswered = 0\ncorrect = 0\n\nprint()\nprint(\"\
    What version of python are we using?\")\nprint(\"A: 1, B: 2, C: 3\")\nuser_answer\
    \ = input(\"Enter A, B, or C: \")\nanswered += 1\n\nprint()\n\nif (user_answer\
    \ == \"C\" or user_answer == \"c\"):\n    correct += 1\n    print (\"Correct\"\
    )\nelse:\n    print (\"Incorrect\")\n\nprint()\n\nprint(\"How many 'else' statements\
    \ can be in a decision tree?\")\nprint(\"A: 1, B: Infiniate, C: None\")\nuser_answer\
    \ = input(\"Enter A, B, or C: \")\nanswered += 1\n\nprint()\n\nif (user_answer\
    \ == \"A\" or user_answer == \"a\"):\n    correct += 1\n    print (\"Correct\"\
    )\nelse:\n    print (\"Incorrect\")\n\nprint()\n\nprint(\"What does '=' do in\
    \ Python?\")\nprint(\"A: Compare, B: Assign, C: Both\")\nuser_answer = input(\"\
    Enter A, B, or C: \")\nanswered += 1\n\nprint()\n\nif (user_answer == \"B\" or\
    \ user_answer == \"b\"):\n    correct += 1\n    print (\"Correct\")\nelse:\n \
    \   print (\"Incorrect\")\n\nprint()\n\nprint (\"You got {} out of {} correct.\"\
    .format(correct, answered))\n\nif (correct == 3):\n```\n"
- fmt: "\n```python\nprint (\"Congratulations!  Good score.\")\n\nelif (correct ==\
    \ 2):\n\n    print (\"Good work, but study hard!\")\nelse:\n    print (\"Go back\
    \ and read over the section again, I'm sure you'll get it.\")\n```\n\n## Homework\
    \ program\n\n*   Use if statements to create a calculator program that prompts\
    \ the user for two numbers and an operator.\n\n## Loops\n\nJust as conditional\
    \ statements activate if an expression evaluates to true, looping conditionals\
    \ also compare values in an expression. But while `if`, `elif`, and `else` statements\
    \ are linear in nature, other conditionals have the ability to repeatedly run\
    \ blocks of code. “Loops” are conditional statements that can be run several times\
    \ through the course of a program, and they allow for expanded functionality within\
    \ Python programs. A `while` loop is such a conditional.\n\n```python\nanswer\
    \ = 0\n\nwhile (answer != 2):\n  answer = int(input(\"What is 4 / 2? \"))\nprint\
    \ (\"Correct!\")\n```\n\nSo long as the specified condition evaluates to true,\
    \ the `while` code block will continuously run. We can see a perfect example of\
    \ this through the program above. We create a new variable `answer` and repeatedly\
    \ compare it to `2`. While `answer` is not equal to `2`, the program will ask\
    \ the user for the correct answer. Inputting something other than `2` will just\
    \ loop back around to the `while` statement, again prompting for the correct answer.\
    \ If `while` finally does evaluate to true (because `answer` equals `2`) the loop\
    \ will break and the program will resume by printing “Correct”.\n\nThe program\
    \ can be enhanced further by “nesting” conditionals. A single indentation indicates\
    \ a code block set aside for our `while` statement, but we can go for a second\
    \ level of indentation to add an additional comparison.\n\n```python\nanswer =\
    \ 0\n\nwhile (answer != 2):\n  answer = int(input(\"What is 4 / 2? \"))\n  if\
    \ (answer != 2):\n      print (\"Incorrect...\")\nprint (\"Correct!\")\n```\n\n\
    This program uses “nested” functions to incorporate `if` statements within `while`\
    \ statements. The sheer amount of possibilities gained from this are virtually\
    \ endless. Note how there are indentation levels that determine which code blocks\
    \ can run within which functions. Every intended block, both 1 and 2 indent levels,\
    \ will run when the `while` loop activates. It is a hard-to-master concept, but\
    \ one that surely increases functionality.\n\nAnother common loop is the `for`\
    \ loop. `For` is different from `while` in that a `for` loop runs through a range\
    \ of numbers or a set of values instead of checking a conditional.\n\n```python\n\
    for user_variable in range (1, 5):\n    print (user_variable)\n```\n\n`For` takes\
    \ the specified variable `user_variable` and uses the supplied `range`. The variable\
    \ will be initialized at `1`, and it will be iterated every time the function\
    \ loops. By observing the output we can see how this works.\n\n1\n2\n3\n4\n\n\
    `User_variable` is printed out, then incremented to `2`. It is printed again and\
    \ incremented as `3`. Once more time for `4`. But it reaches `5` and stops, which\
    \ is why `5` does not get printed out. Because the keyword `range` was used, the\
    \ `for` loop will always start at the first number and stop at the second. Leaving\
    \ it out will have the `for` loop cycle through the values given.\n\n```python\n\
    for user_variable in (1, 5):\n    print (user_variable)\n```\n\n`For` example,\
    \ only `range` is left out here, but the output is very different.\n\n1\n5\n\n\
    Python runs the loop with the first value, `1`, and then runs it with the second\
    \ value, `5`. We will learn that using `for` loops this way is especially useful\
    \ for lists, dictionaries, and tuples.\n\nLastly, loops can be broken with the\
    \ `break()` function. Bad programming form can lead to infinite loops, but including\
    \ `break()` as a safeguard might save a user’s computer from crashing.\n\n## Example\
    \ Program 3 – project3.py\n\n```python\nprint(\"Adding simulator\")\nprint(\"\
    Type a number to add to total, or type blank line to stop\")\nline = \"a\"\ntotal\
    \ = 0\n\nwhile (line != \"\"):\n    line = input(\"\")\n    if (line == \"\"):\n\
    \        break\n    total += int(line)\n    print (\"Total = {}\".format(total))\n\
    ```\n\n## Homework program\n\n*   Write a program using if statements that displays\
    \ a text adventure game. Offer multiple choices to the player that they can type\
    \ in to select. Use while loops to check the validity of user input.\n\n## More\
    \ about Variables\n\nLists are another data type beneficial to talk about. A list\
    \ is an array of values that are grouped together into a single variable. The\
    \ single variable can then be used to call upon any of the “sub variables” it\
    \ contains. They are mostly used for organization and grouping purposes, and also\
    \ to keep related variables in a similar place. List variables are created by\
    \ initializing them.\n\n```python\nstate = \"Texas\"\njack_info = [8, \"West Elementary\"\
    , state, \"A\"]\nprint (\"Jack goes to {} in {}.\".format(jack_info[1], jack_info[2]))\n\
    print (\"He has a {} in math, even though he's only {}.\".format(jack_info[3],\
    \ jack_info[0]))\n```\n\nThe list `jack_info` contains four values because we\
    \ specify four different entries between the square brackets. They are just ordinary\
    \ values such as the integer `8` or the variable `state`, but they are grouped\
    \ together for a common purpose by being placed into the list. As it is seen,\
    \ entries in lists can be accessed by specifying the location of the entry in\
    \ square brackets. Counting starts at `0`, so the first entry of `jack_info` is\
    \ `8`, and the entry in `[3]` is “A”. Visualize it like so:\n\n| Entry number:\
    \ | 0 | 1 | 2 | 3 |\n| :--- | :--- | :--- | :--- | :--- |\n| Data value: | 8 |\
    \ “West Elementary” | state | “A” |\n\nA list could be initially declared with\
    \ 3 entries, and it would have the range `0-2`. The number of entries is nearly\
    \ infinite, and it is only limited by the computer’s memory and the amount of\
    \ variables the programmer fills it with.\n\nThe elements of a list can be edited\
    \ as if they were individual variables. If Jack ages a year, we only need to update\
    \ the entry. Furthermore, adding a new entry to the list can be done without completely\
    \ redefining every value within it. Using `append()`, a new entry will be created\
    \ in the last\n\n```python\nstate = \"Texas\"\njack_info = [8, \"West Elementary\"\
    , state, \"A\"]\njack_info[0] = 9\njack_info.append(22)\nprint (\"Jack goes to\
    \ {} in {}.\".format(jack_info[1], jack_info[2]))\nprint (\"He has a {} in math,\
    \ even though he's only {}.\".format(jack_info[3], jack_info[0]))\nprint (\"Lucky\
    \ number is {}\".format(jack_info[4]))\n```\n\nThe new additions to the program\
    \ change the list ever so slightly to now have a new set of values.\n\n| Entry\
    \ number: | 0 | 1 | 2 | 3 | 4 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | Data value: | 9 | “West Elementary” | state | “A” | 22 |\n\nBefore continuing\
    \ onwards, it is worthy to note a few more features about the string data type.\
    \ Strings are actually lists that contain character values. As an example, take\
    \ the string “Hello, World!”. Broken down as a list, it would look like this:\n\
    \n| Entry | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | … |\n| :--- | :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- |\n| Character | H | e | l | l | o |\
    \ , | | W | … |\n\nAnd likewise, individual entries can be displayed from the\
    \ string list.\n\n```python\nprint (user_string[0]) # would print “H”\nprint (user_string[7:13])\
    \ #would print “World!”\n```\n\nMoving onwards, tuples are another data type within\
    \ Python. They are declared by using parentheses instead of square brackets. Tuples\
    \ are actually static lists, or lists that cannot be edited. They are used when\
    \ the programmer needs to ensure a range of data cannot change.\n\n```python\n\
    jim_grades = (99, 87, 100, 99, 77)\nprint (jim_grades[2])\n```\n\nNotice how an\
