    While they are not necessary, they save you a lot of confusion on functions of
    a program. It simply act as a way to organize your functions more systematically.


    Main- Here is where the main function begins. Using the line // main() instructs
    the program to start executing the main function of the program, and start the
    out put process. It is essential that you set up the main function command, otherwise
    your program will not know what it is supposed to be running, nor will it know
    when it is supposed to run. This will be seen as a single line comment inside
    the program and it is going to tell the program that the main function is beginning.


    INT main- This is where the function execution officially begins. If you do not
    include this, the entire process will stop, because you did not introduce the
    variables, and without the variables, the program is lost.


    Cout- This instructs the program to display the message that you want on the screen.
    If you do not put cout, chances are your program will may or may not fail. The
    problem is you don’t know if you succeed or not so if you want to make sure that
    everything runs smoothly, be sure to add cout.


    Return- This returns the value back to zero, and terminates the function. It instructs
    the program to end the process, and go back to the beginning.


    Now to compile and execute your first official C++ program.


    First you must know how to save the file. Open your chosen text editor, and enter
    the code that is seen above. Once you have done that, hit save as, and choose
    a file location that is easily found. For organization purposes, it is always
    best to have a separate folder for all of your programs. Save the file as hello.cpp,
    and once you have saved it, you should open up your command prompt before heading
    to the directory where the file is saved.


    To get the file to open inside your compiler, start by typing ‘g++ hello.cpp’.
    you can then press enter and the code will be opened properly. As long as there
    aren’t any errors, the prompt is going to generate an a.out executable file. To
    run the program, type out ‘o.out’ and see the compiler work. The information that
    you should get on the compiler from this on the computer includes:


    $  g++ hello.cpp


    $  ./a.out


    Try This


    Make sure that you are inputting all of the variables the proper way, and remember,
    these things are case sensitive. If you do not input the functions the right way,
    you will find that things tend to go awry. The thing with coding is you have to
    be precise. This detailed oriented personal attributed applies to all programming
    languages! However, anyone can do it if they are willing to pay attention.


    The basic function commands are not the only things that you need to use. There
    are other things that are important when you are building a prompt as well, as
    they too instruct the program to do specific things. Some of these things are
    blocks and semicolons.


    You probably think a pause in a sentence when you think semicolon, however, they
    are complete stops in C++ programs. The semicolon indicates the termination of
    a statement. This means that each individual statement must be indicated by the
    use of a semicolon.  The following are three different statements.


    x=y;


    y=y+1;


    add(x,y);


    Each one of those statements were separated by not only a line break, but also
    a semicolon. You could also do it this way.


    x=y; y=y+1; add(x,y);


    Each one of those will be recognized as separate statements simply because of
    the semicolon. It is kind of mind blowing how something so simple can have so
    much of an impact.


    In this coding language, a block is going to be a set of statements that you enclose
    with brackets.  These statements are logical entities that the program puts on
    the screen due to the main command prompt. For example


    {


    cout << “I like Pizza”>>; //prints I like Pizza


    return 0


    }


    The end of a line is not a terminator, as was indicated above. The semicolon is
    the only thing that terminates the statement.


    Identifiers


    Now let us move on to the identifiers in the program. These identifiers are used
    to identify multiple things, such as classes, modules, functions and variables
    within a block. An identifier is going to be a group of letters and numbers that
    you are able to name your program or your files and they must start with a letter,
    but can have any letter or number you want afterwards. There are no punctuation
    characters other than what you might see in a sentence that are allowed as identifiers.
    You will not see characters such as @,&,% or $, and the programming is case sensitive.
    That means YokoOno is different than Yokoono, yokoOno, and yokoono. Make sure
    that you are capitalizing only the letters that you should be capitalizing in
    your programs.


    Though pretty much anything can be an identifier, there are some things that are
    reserved for keywords in C++, and can''t be used as identifiers.  These words
    are as follows.


    | asm |  |  |


    | Break | Bool | Auto |


    | Char | Catch | Case |


    | Const cast | Const | Class |


    | Delete | Default | Continue |


    | Dynamic cast | Double | Do |


    | Explicit | Enum | Else |


    | False | Extern | Export |


    | Friend | For | Float |


    | Inline | If | Goto |


    | Mutable | Long | Int |


    | Protected | Private | Namespace |


    | Reinterpret cast | Register | Public |


    | Signed | Short | Return |


    | Static cast | Static | Sizeof |


    | Template | Switch | Struct |


    | True | Throw | This |


    | Typeid | Typedef | Try |


    | Unsigned | Unlon | Typename |


    | Void | Virtual | Using |


    | While | Wchar t | Volatile |


    Everything else is fair game when it comes to identifiers. Think of identifiers
    as usernames and passwords. Mix it up, but make sure that they are functional.


    Trigraphs


    Trigraphs are going to be sequences of three characters that will represent just
    one character. You will notice these because they are going to start out with
    two questions marks at the beginning. Seems a little redundant to use three characters
    when one will work, but the reason behind this is so you do not confuse the program
    with the meaning of the character, as many are similar.


    Here are some frequently used trigraphs to give you an example of what we mean.


    ??=    #


    ??/    \


    ??''     ^


    ??(     [


    ??)     ]


    ??!     |


    ??<     {


    ??>     }


    ??-     ~


    Not all compilers support trigraphs due to their confusing nature, and most people
    try to stay away from them, however, it has been found that when you memorize
    trigraphs, you are less likely to mess up by hitting the wrong symbol in your
    function.


    Whitespace


    Moving on to whitespace. This is the empty lines in a program. Sometimes they
    contain comments, and these are known as blank lines. The compilers completely
    ignore them. Whitespace describes blanks, new lines, tabs, characters and comments.
    It is merely used to make your program look more organized and readable.


    There should be at least one line of whitespace between the variable/identifier
    and the statement.


    QUIZ


    You thought that you could just waltz through this book without being tested on
    if you were paying attention? No cheating either! Just because you can peek at
    the answers does not mean that you should. You should take it just like a normal
    quiz to truly test your knowledge so you can figure out if you need to go back
    and re-read over some things. This is a short quiz, so you will be okay.


    1.What is whitespace?


    2.Fill in the blanks ___ <<x=y+1_>>


    3.What are trigraphs?


    4.Who Invented the C with Classes language?'
