    Sometimes we forget to convert user input to an integer. If we are prompting a
    user for numerical input, we must surround `input()` with `int()` or `float()`.
    Failure to do this will pass the `input` as a string, which will likely return
    an error.


    When comparing two values, Python requires the programmer to use the double equal
    sign (`==`). When assigning a value, you must use the single equal sign (`=`).
    Using an inappropriate sign for any occasion will always return a syntax error.


    After every comparison statement and loop (such as `if`, `elif`, `else`, `for`,
    `while`, `def`, and `class`) there is a colon (`:`). This colon denotes that the
    next line should be indented, and thus all indented lines will fall within the
    function’s scope. Failure to place a colon returns a syntax error.


    Strings and functions are usually surrounded by a pair of characters. Functions
    use parentheses, while strings use quotations to indicate where their boundaries
    are. If you ever forget to supply the closing character, Python will surely return
    an error.


    Beginners will often try to use functions that are not in Python by default without
    including the correct module. Trying to call an advanced math function, or editing
    a file directory is not possible with regular Python. Always place the `import`
    commands for modules you will use at the top of the program, or the application
    will simply not run.


    Indentations are required in Python. Those coming from other programming languages
    will likely forget this and indent in their own personal style. This will break
    mostly all Python programs, because the interpreter expects a certain formatting
    standard. An error will be returned every time that indentations are incorrect.
    Pay close attention to your indentation levels or risk your program failing to
    logic and syntax errors.


    Programming languages demand perfect syntax at all times. Because of this, even
    a spelling error can be disastrous for our applications. Besides indentation problems
    and misspelled functions, giving the wrong variable name or accidentally calling
    the wrong function can make your program fail outright or perform unexpectedly.
    When coding, double check over your scripts to ensure no characters are out of
    place. Test your code after each implementation so you know that when an error
    occurs it should be coming from a new addition. Sometimes there is an error or
    bug in the code and it just cannot be rectified after reviewing the code. Programmers
    must “debug” their code by following it line-by-line at this point, “tracing”
    the path that the interpreter takes as it runs the program. Some IDE’s have tools
    for debugging, such as “breakpoints” or “line stops” that allow you to run each
    line at the click of a button. Taking the program slow like that can reveal the
    source of the issue most of the time, but it takes a keen eye and a dedicated
    troubleshooter to fix code.


    Many programmers consider it unnecessary, but commenting your scripts is an essential
    part of coding. Failure to do so is an extremely common beginner mistake that
    many first time programmers fall for. Once you master the art of Python and begin
    programming in a company with other coders, there might be multiple people working
    on the same script. Even the cleanest code is confusing to look at for the first
    time, but comments help to demystify the complex characters. Moreover, coming
    back to an old script of yours from weeks past can feel like reading a foreign
    language-comments help you to quickly get back to coding. Many programmers put
    a comment as the top line of their program with a brief description of what the
    script does, when it was written, and any contributors to it. That way the next
    time you are quickly looking through files trying to find a certain program, the
    comments can help you understand what is inside without actually running or deciphering
    the code.


    The final common mistake that runs rampant in Python newbies is variable naming.
    If it has not already been brought to light in your experimentation, there are
    just certain names that you cannot name your variables. “Reserved” words such
    as `class`, `break`, `print`, `and`, `or`, `while`, etc… are keywords that cannot
    be used for a variable name. If Python detects their use a syntax error will occur.
    Besides errors, though, programmers often use bad form when naming their variables.
    Avoid ambiguous and simple variable names such as “number” or `var1` in favor
    of descriptive one such as `user_input` or `totalNumberOfDogs`. These variables
    explain their use at a glance, so a verbose programmer will never misuse a variable
    or have to check what its intent is. Python programmers typically use the underscore
    method to name their variables (`grade_average`, `dog_1`), but `camelCase` is
    acceptable as well (`userInput`, `multAnswer`). No matter which method is used,
    a skillful programmer will always make the name descriptive.


    ## Conclusion


    Thank you again for downloading this beginner’s guide to Python. Now that you
    have finished the text, you have a basic knowledge of how Python works, and you
    should be able to write your own programs. You can further increase your knowledge
    by attempting to create larger and more complicated programs, or you can study
    modules and learn new functions. If you have enjoyed the book, rate and leave
    a review on Amazon so more high quality books can be produced.


