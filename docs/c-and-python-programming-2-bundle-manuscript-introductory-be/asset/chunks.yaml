  raw: 'print ("I have {} pets, {} and {}".format(pet_dict["Total"], pet_dict["Dog"],
    pet_dict["Cat"]))


    Here, the dictionary pet_dict contains three values: “Total”, “Dog”, and “Cat”. 
    The entries are declared by naming the entry within quotations and then supplying
    a value.  Those entries are called by specifying the name of the entry, such as
    with pet_dict[“Dog”] to access the value stored within.  An unprecedented amount
    of organization is available when using dictionaries because they resemble a database
    in form.  Likewise, they can be changed, updated, removed, or added to at any
    time within a program.


    albums = {"Milkduds": 2, "Harold Gene": 1, "The 7750''s": 3}


    albums["Milkduds"] += 1 #new album!


    albums["The 7750''s"] = 2 #actually only had 2


    albums.update({"Diamond Dozens": 1}) #found new band


    del albums["Harold Gene"] #sold one away, didn''t like


    print ("These are the number of albums I own:")


    print (albums)


    The humorous example above is a simple dictionary used to store the number of
    albums a person has.  At the beginning the dictionary has a set number of albums
    for each band, but the second line has the collector gaining a new Milkduds album. 
    That line also uses a new code shortcut.  Whenever “+=” is used, the code is actually
    expanded to be “albums["Milkduds"] = albums["Milkduds"] + 1”, but much time and
    space is saved in the program by using the shorthand.  Third line has the collector
    realizing they only had 2 7750’s albums, so the command changes the value of the
    entry altogether.  Next update() is introduced.  It shows how an entirely new
    entry can be added to the dictionary.  Sadly, though, Harold Gene is deleted from
    the dictionary because the collector sold away the album.  Finally, printing the
    entire dictionary can be done by not specifying any entry.


    A fun example, the above program actually shows how versatile dictionaries can
    be in gathering and storing data.  Include them within your program to group variables
    together in an easy-to-call way.


    Example Program 4 – project4.py


    keep_going = "a" #initialize variables before they are used


    number_grades = 0


    grade_list = []


    total = 0


    print("Grade Average Calculator")


    print()


    while (keep_going != "No" and keep_going != "no"):


        grade = int(input("Enter a test grade: "))


        number_grades += 1


        grade_list.append(grade)


        keep_going = input("Add more grades? ")


    print()


    for x in range (0, number_grades):


        total += grade_list[x] #add up all grades in list


    print ("Average of {} tests is {}".format(number_grades, total / number_grades))


    Homework program:


    *   Devise code for more math functions, such as medians and modes.


    Functions


    Every function used thus far has been built-in to Python and programmed by Python’s
    developers.  Functions are actually code shortcuts, as functions are condensed
    versions of code that take data as parameters, run longer blocks of code behind
    the scenes, and then return a result.  The use of functions is to save time and
    code when doing commonly repeated tasks.  Python retains the ability for programmers
    to write their own functions, and they are done like so:


    def happy(name):


        print ("Happy birthday to you. " * 2)


        print ("Happy birthday dear {}.".format(name))


        print ("Happy birthday to you.")


    The “def” keyword indicates a user defined function declaration, and the name
    immediately following is the name of the function; we create the function happy(). 
    Within the parentheses are the values that our function will take (only one, a
    variable named “name”).  Just as print() must have a value, so does our happy()
    need one too.  Then, the code associated with the function is indented.  Our code
    simply runs through a happy birthday song, which supplying the variable “name”
    inside the song.  This function declaration goes at the top of our python program,
    but it does not actually run when the program starts.  To call it, we need to
    specifically reference the function in code.


    happy("Dana")


    Something interesting happens here.  We call happy() by passing “Dana” as the
    value.  “Dana” gets assigned to “name”, and the function runs through.  However,
    the variable “name” does not exist outside of the user defined function, and any
    attempts to call it will result in an error.  This is because variables have scopes
    of operation, which are areas in which they can be accessed.  “Name” has a variable
    scope that is specific to the function, so it will not ever be called outside
    of it.  Similarly, any variables declared in the main program cannot directly
    be accessed by the user defined function, but rather they must be passed as parameters
    when calling the function.  Follow along with the next exercise to see an example
    for an in-depth analysis on user defined functions (UDFs).


    def intdiv(num_one, num_two):


        whole_answer = int(num_one / num_two)


        remainder = num_one % num_two


        print ("{} / {} = {} with {} left


    over.".format(num_one, num_two, whole_answer, remainder))


    first = int(input("Enter first number: "))


    second = int(input("Enter second number: "))


    intdiv(first, second)


    First, the UDF is declared.  This code does not run automatically because it has
    not yet been called.  The program actually starts on the fifth line.  The variable
    “first” is declared within the main program’s scope based on the user’s input. 
    So too is the variable “second”.  The UDF “intdiv” is invoked with first and second
    as the two parameters.  The variables are passed as parameters so they can be
    transferred into the UDF.  First and second are not actually leaving their scope,
    though, because the UDF uses the variables num_one and num_two to perform calculations. 


    Variables can be passed back from a UDF by using the return keyword.


    def exp (base, pow):


        orig_num = base


        for x in range (1, pow):


            base = base * orig_num


        return base


    Above is a UDF that calculates the result of exponential multiplication based
    on two supplied values, the base and power numbers.   The return keyword passes
    a variable back into the main program, which is how we can get around the variable’s
    scope.


    answer = exp(2, 3)


    So when we call the function like above, the answer (base) is given back as the
    result and assigned to the variable “answer”. 


    Conclusively, user defined functions can save a lot of time for programs that
    must repeatedly call a block of code.  UDFs can just contain other functions,
    like our Happy Birthday UDF, or they can help simplify complicated code, such
    as our exponential multiplication UDF.  You must remember that variables are defined
    within a scope that they cannot leave.  However, values can be passed from the
    main program to a UDF by supplying them as parameters, and values can return from
    a UDF by using the return keyword and assigning the result to a variable. 


    Example Program 5 – project5.py


    def cm_to_inch(cm):


        inch = cm * 0.39


        return inch


    def inch_to_cm(inch):


        cm = inch * 2.54


        return cm


    print("Inch/cm converter")


    print("1: Convert cm to inch")


    print("2: Convert inch to cm")


    choice = int(input("Enter a menu option: "))


    while (choice != 1 and choice != 2):


        print("Invalid, try again.")


        choice = int(input("Enter a menu option: "))


    if (choice == 1):


        user_input = int(input("Enter cm: "))


        print("{} cm is {} inches.".format(user_input, cm_to_inch(user_input)))


    if (choice == 2):


        user_input = int(input("Enter inches: "))


        print("{} inches is {} cm.".format(user_input, inch_to_cm(user_input)))


    print("Thank you for using the program.")


