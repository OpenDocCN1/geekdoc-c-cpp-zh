    }

    ```


    你应该能得到答案 15。


    你也可以在程序中声明并定义变量，但那是更高级的内容，所以如果你想了解，可以在 Google 上搜索这方面的教程。


    # 测验


    这是设置。你应该有一个短语、一个数学题，然后使用上述整数给出数学题的答案。你可以自己编写所有的变量，随你想让它们变成什么样。


