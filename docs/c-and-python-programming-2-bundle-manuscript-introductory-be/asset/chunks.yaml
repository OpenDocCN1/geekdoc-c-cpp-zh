    \ (user_answer == \"B\" or user_answer == \"b\"):\n    correct += 1\n    print\
    \ (\"Correct\")\nelse:\n    print (\"Incorrect\")\n\nprint()\n\nprint (\"You got\
    \ {} out of {} correct.\".format(correct, answered))\n\nif (correct == 3):\n```\n"
