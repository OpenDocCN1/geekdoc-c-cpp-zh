    ## 引言

    感谢下载《黑客大学：少年版。从零开始学习 Python 计算机编程。成为 Python 零英雄：掌握 Python 语言的终极新手指南》。


    由于多种原因，Python 是一种强大且推荐初学者使用的语言。本书为从未写过编程代码的人提供新手指南，因此即使编程的想法令人生生畏，这本书也可以用简单的语言对其进行解释。我们将从最开始通过实际代码示例介绍整个过程；跟随学习一项宝贵的计算机技能，这项技能可能会帮助你找到一份使用优雅的
    Python 语言的工作。


    ## 相关软件

    为了提高你的 Python 技能，请使用 IDE。如果你还没有下载，非常推荐使用 Atom 进行 Python 编程。Atom 是可定制的，你可以随时安装插件来让编程变得简单。`autocomplete-python`
    就是其中一个插件，它可以猜测你输入的内容并自动填充命令的剩余部分。


    `VI` 和 `Emacs` 是程序员使用的另外两个流行的文本编辑器。它们都被认为是高度先进并针对编写代码进行了优化，但在这款软件的粉丝之间存在着“口水战”。对于
    Linux Python 程序员来说，可以调查这两个文本编辑器，并测试它们是否对 Python 工作流有帮助。


    当你完成了一个特别实用的 Python 程序并希望将其分发给用户时，必须记住，他们中的许多没有安装 Python，并且可能不想为了运行你的程序就安装它。`PyInstaller`
    (`http://www.pyinstaller.org/`) 是一款软件，它可以将你的 Python 脚本和所需的模块构建成 `.exe` 文件，该文件不需要
    Python 即可运行。它是分发应用程序的得手工具。


    ## 在线资源

    要获取有关 Python 的在线帮助，你可以随时查看在线文档（`https://www.python.org/doc/`）。文档包含了 Python 及其内置模块中每个函数的示例和手册页。

