  trans: "\n\n# 类 (Classes)\n\n类是 Python 的一个特性，使其更接近某些更复杂的编程语言。从本质上说，它们是“程序程序”，因为你可以在一个中放入许多功能。此外，使用类进行组织是一种良好的编程习惯。像\
    \ Python 这样面向对象的语言偶尔会通过这些概念展示其面向对象的根源，而对象以 `object.attribute` 的形式包含属性。请看下面的示例以理解。\n\
    \n```python\nclass student:\n    def __init__(self, name, grade):\n        self.name\
    \ = name\n        self.grade = grade\n        self.gpa = 0.0\n```\n\n我们创建的类被称为\
    \ `student`，`student` 包含了它自己的变量。类提供了一种组织对象并赋予它们个人属性的方法。因此，与其拥有 `student1_name`、`student1_grade`、`student2_grade`\
    \ 等不同变量，可以通过属于一个类来合并它们。在程序中，类声明位于最顶端。就像 UDF（用户自定义函数）一样，在被调用之前，它实际上不会在主程序中运行。\n\
    \n```python\nstudent1 = student(\"Tim\", \"Freshman\") #object is student1, an\
    \ attribute is “name”.\n```\n\n我们新声明的 `student` 类用于创建具有属性 `Tim` 和 `Freshman` 的\
    \ `student1` 对象。这在以前需要两行，但使用类后大大简化了。类将对象的相关变量隔离开，使得每个声明的 `student` 都拥有 `name`、`grade`\
    \ 和 `gpa` 这三个属性。我们类声明的第二行包含 `__init__`，这是一个“方法”（用户定义函数），它在创建 `student` 类中的对象时运行。`__init__`\
    \ 的参数是创建该对象时所需的参数。`self` 实际上并不是参数，它只是指向 `student`，但 `name` 和 `grade` 是需要的，这就是为什么我们在创建\
    \ `student1` 时包含了它们。`student1` 的属性可以这样调用：\n\n```python\nprint (student1.name)\n\
    ```\n\n这将简单地打印 `Tim`。我们在初始化 `student1` 时没有声明 GPA 变量，因此我们可以通过赋值语句来完成。\n\n```python\n\
    student1.gpa = 4.0\n```\n\n或者更改已存在的属性。\n\n```python\nstudent1.grade = “Sophomore”\n\
    ```\n\n如果我们创建另一个对象，它将拥有一组与 `student1` 完全不同的属性。\n\n```python\nstudent2 = student(\"\
    Mary\", \"Senior\")\n```\n\n其中 `student1.grade` 与 `student2.grade` 不同，尽管它们共享相同的变量名。对于具有多个重复变量的大型项目，类可以减少代码混乱和需要跟踪的变量数量。\n\
    \n回看我们自定义的类，我们可以扩展它以在类内部实现用户自定义函数。\n\n```python\nclass student:\n    def __init__(self,\
    \ name, grade):\n        self.name = name\n        self.grade = grade\n      \
    \  self.gpa = 0.0\n    def record(self):\n        return \"Student {} is a {}\
    \ with a {}\".format(self.name, self.grade, self.gpa)\n\nstudent3 = student(\"\
    Lily\", \"Junior\")\nstudent3.gpa = 3.67\n\nprint (student3.record())\n```\n\n\
    `__init__` 保持不变，但我们添加了一个名为 `record` 的 UDF 定义。它传递了参数 `self`（因为它必须引用该类）并返回一个格式化字符串。在我们的实际主程序中心创建了\
    \ `student3`。最后，我们通过 `student3.record()` (`object.function`) 调用 UDF。它返回了我们的格式化字符串，因此被\
    \ `print()` 出来。\n\n## 特殊方法 (Special Methods)\n\n`__init__` 方法实际上是 UDF 的一种。然而，被双下划线围绕的方法是\
    \ Python 中的特殊方法，这意味着它们会在某些时间自动运行。`__init__` 也是一种特殊方法，专门称为“构造方法”。构造方法在每次创建对象时都会被调用，这就是为什么我们将变量声明放在里面。当创建\
    \ `student3` 时，`student3.name`、`student3.grade` 和 `student3.gpa` 也随之创建。因此，任何放在\
    \ `__init__` 块中的代码会在第一次创建对象时被激活。\n\n其他特殊方法也，它们在不同的事件上被调用：\n\n- `__del__` - 每当对象被删除\
    \ (`del`) 时被调用。也称为析构方法。\n- `__str__` - 当对象作为字符串传递时被调用\n- `__setattr__` - 每当属性被设置值时都会运行\n\
    - `__delattr__` - 与 `setattr` 相同，但仅在属性被删除时运行\n\n添加这些特殊方法可以看到它们运行的时机。\n\n```python\n\
    class student:\n    def __init__(self, name, grade):\n        self.name = name\n\
    \        self.grade = grade\n        self.gpa = 0.0\n    def __str__(self):\n\
    \        return \"{}\".format(self.name)\n    def record(self):\n        return\
    \ \"Student {} is a {} with a {}\".format(self.name, self.grade, self.gpa)\n\n\
    student4 = student(\"Barry\", \"Professor\")\n\nprint (student4)\n```\n\n当 `student4`\
    \ 被打印（作为字符串引用）时，`__str__` 特殊方法接管并返回对象的 `name` 属性。如果这里没有这个特殊方法，我们就无法通过引用对象获得预期的输出。\n\
    \n最后，类之所以有用是因为我们可以在它们内部创建“类变量”。`Name` 和 `GPA` 是特定于每个声明对象的属性变量，但也可以有由所有对象共享的类变量。例如，这个程序将使用类变量来跟踪对象的总数。\n\
    \n```python\nclass food:\n    total_foods = 0\n    def __init__(self, name):\n\
    \        self.name = name\n        self.calories = 0\n        self.foodgroup =\
    \ \"\"\n        food.total_foods += 1\n    def __del__(self):\n        food.total_foods\
    \ -= 1\n    def __str__(self):\n        return \"{}\".format(self.name)\n    def\
    \ get_total():\n        return food.total_foods\n    def record(self):\n     \
    \   return \"Food {0} is a {2} with {1} calories.\".format(self.name, self.calories,\
    \ self.foodgroup)\n\nfood1 = food(\"Carrot Stew\")\nfood1.calories = 210\nfood1.foodgroup\
    \ = \"Vegetables\"\nfood2 = food(\"Buttered Toast\")\nfood2.calories = 100\nfood2.foodgroup\
    \ = \"Grains\"\n\nprint (food.get_total())\ndel food2\nprint (food.get_total())\n\
    ```\n\n当程序创建一个 `food` 时，`total_foods` 加 1。然后删除一个 food 对象，所以减 1。控制台打印 2，然后是 1，显示了我们如何调用\
    \ UDF 来检查类变量。跟踪某物的数量是类变量的常见用途，但它们对其他情况也有用。\n\n## 示例程序 6 – project6.py\n\n```python\n\
    class house:\n    def __init__(self, name, bedrooms, bathrooms, cost):\n     \
    \   self.name = name\n        self.bedrooms = bedrooms\n        self.bathrooms\
    \ = bathrooms\n        self.cost = cost\n        print(\"House for sale!\")\n\
    \    def __del__(self):\n        print(\"House off the market.\")\n\nprint(\"\
    House for sale:\")\nuser_input = input(\"What is the address of the house? \"\
    )\nuser_input2 = int(input(\"How many bedrooms? \"))\nuser_input3 = int(input(\"\
    How many bathrooms? \"))\nuser_input4 = int(input(\"How much does it cost? \"\
    ))\n\nhouse1 = house(user_input, user_input2, user_input3, user_input4)\nprint(\"\
    Looking for buyers...\")\nfor x in range (0, house1.cost):\n    x += 1 #wait a\
    \ while\nprint(\"Sold!\")\ndel house1\n```\n\n## 继承 (Inheritance)\n\n在你更健壮和扩展的程序中，你可能会使用多个相关的类。例如，思考一个必须对网络分类设备的程序。每个设备类型（台式电脑、笔记本电脑、手机等）都有自己的类，但你最终会重复一些常用的属性。台式电脑和笔记本电脑都有名称、部门和\
    \ IP 地址，但它们还有一些特定的不同变量，例如笔记本电脑的 Wi-Fi 和台式电脑的显卡。\n\n## 作业程序\n\n*   使用类创建一个数据库组织程序。用户应该能够创建类的条目并设置变量，并随时查看它们。\n\
    \n"
- fmt: "\nThrough a process called “inheritance”, classes can be put into a parent/child\
    \ relationship where certain parent attributes can be “inherited” by children\
    \ classes. Effectively sharing attributes across classes leads to more elegant\
    \ organization and less code overall.\n\n```python\nclass device:\n    total_devices\
    \ = 0\n    def __init__(self, name, owner):\n        self.name = name\n      \
    \  self.owner = owner\n        device.total_devices += 1\n    def __del__(self):\n\
    \        device.total_devices -= 1\n    def __str__(self):\n        return \"\
    {}\".format(self.name)\n    def get_total():\n        return device.total_devices\n\
    class laptop(device):\n    def __init__(self, name, owner, wifi):\n        device.__init__(self,\
    \ name, owner)\n        self.wifi = wifi\n    def __str__(self):\n        return\
    \ \"{} is owned by {} and connected to {}\".format(self.name, self.owner, self.wifi)\n\
    class cellular(device):\n    def __init__(self, name, owner, connection, BYOD):\n\
    \        device.__init__(self, name, owner)\n        self.connection = connection\n\
    \        self.BYOD = BYOD\n    def __str__(self):\n        return \"{} is owned\
    \ by {} and it uses {}. BYOD? {}\".format(self.name, self.owner, self.connection,\
    \ self.BYOD)\ndevice1 = laptop(\"STAFF12\", \"IT\", \"Staff-wifi\")\ndevice2 =\
    \ cellular(\"Jack's-iDevice\", \"Jack\", \"4G LTE\", \"yes\")\nprint (device1)\n\
    print (device2)\nprint (device.get_total())\n```\n\nIn this program, the parent\
    \ class `device` is created with 2 attributes – `name` and `owner`. The other\
    \ classes, `laptop` and `cellular`, also contain `name` and `owner` attributes,\
    \ so we set them up to inherit them from the parent class. To set a class into\
    \ a parent/child relationship, the child class must pass the parent class as a\
    \ parameter in the declaration. This is why `class cellular(device)` is used,\
    \ because we are setting `cellular` to be linked to `device`.\n\nSecondly, we\
    \ call the `device` constructor method specifically within each child class constructor\
    \ method. When this is done, the child class actually runs the entire parent constructor\
    \ method. `name` and `owner` are obtained this way, and also the `total_devices\
    \ += 1` line gets passed as well.\n\nBoth children contain a `__str__` method,\
    \ even though the parent class also has one. Through a process called overwriting,\
    \ if a special method is called that exists in both the parent and child, than\
    \ only the child method will run. In the absence of a called method in a child,\
    \ the parent will runs its method instead. This is why referencing a `laptop`\
    \ object as a string will display laptop information, but deleting a `laptop`\
    \ object will fall back to the parent and run its destructor method instead.\n\
    \nUnderstanding how inheritance works can provide your applications with unprecedented\
    \ organization and composition. Most higher-level and advanced programs take advantage\
    \ of classes and their properties to quickly devise a framework for many applications\
    \ such as database tools, so learning them would undoubtedly improve your Python\
    \ skills.\n\n### Example Program 7 – project7.py\n\n```python\nclass house:\n\
    \    def __init__(self, name, bedrooms, bathrooms):\n        self.name = name\n\
    \        self.bedrooms = bedrooms\n        self.bathrooms = bathrooms\n      \
    \  self.cost = 0\n        print(\"Living space for sale!\")\n    def __del__(self):\n\
    \        print(\"Living space off the market.\")\nclass apartment(house):\n  \
    \  def __init__(self, name, bedrooms, bathrooms):\n        house.__init__(self,\
    \ name, bedrooms, bathrooms)\n        self.montly_payment = 0\nforsale1 = apartment(\"\
    100 Col. Ave\", 2, 2)\nforsale1.montly_payment = 250\n```\n\n**Homework program:**\n\
    * Expand the database program that you could optionally create in the last chapter\
    \ to include inheritance.\n\n### Modules\n\nEvery bit of functionality that we\
    \ have used so far is built-in to Python already. Python is an expansive language,\
    \ but additional features can be added to Python easily through modules. Those\
    \ familiar with C can relate modules to “h” files and preprocessor statements.\
    \ Modules do much the same thing, they are included in order to add new functions\
    \ and commands to Python.\n\nTo add a new module, we only need to include one\
    \ statement at the top of our program.\n\n```python\nimport math\nprint (math.sin(3))\n\
    answer = math.sqrt(16)\nprint (answer)\nprint (math.gcd(100, 125))\n```\n\nIn\
    \ particular, `sqrt()`, `sin()`, and `gcd()` are three examples you can notice\
    \ above. Every module has a defined purpose, and `math`s is to provide advanced\
    \ mathematical functions. Here is a list of the most important ones.\n\n* `math.sqrt()`\
    \ – square root of number\n* `math.sin()` – sine of number\n* `math.cos()` – cosine\
    \ of number\n* `math.tan()` – tangent of number\n* `math.log()` – two parameters,\
    \ log and base\n* `math.pi` – 3.14159\n* `math.e` – 2.71828\n\nThose needing to\
    \ use complicated functions such as the ones above only need to `import math`\
    \ at the top of the program.\n\nOther specialized modules exist as well, such\
    \ as `datetime`. Datetime is a module that provides time-keeping functions.\n\n\
    ```python\nimport datetime\ncurrent_time = datetime.datetime.now()\nprint (current_time.hour)\n\
    print (current_time.minute)\nprint (current_time.second)\n```\n\nOther functions\
    \ provided through `datetime` include:\n* `year`\n* `month`\n* `day`\n\nOr `os`,\
    \ a module that unlocks operating system functions for altering files. Here is\
    \ a small program for creating a new folder and then making it the active directory.\n\
    \n```python\nimport os\nos.mkdir(\"folder\") #make folder\nos.chdir(\"folder\"\
    ) #go into folder\nos.chdir(\"..\") #up one directory\n```\n\nMore functions available\
    \ to `os` are listed.\n\n* `os.rmdir()` – delete specified folder\n* `os.remove()`\
    \ – delete specified file\n* `os.path.exists()` – checks to see if file exists\n\
    * `os.rename()` – renames specified file to second parameter\n\nAnd highly useful\
    \ modules, such as `random`, `statistics`, and `pip` exist that can give new features\
    \ to your applications that were not possible. Python also has support for downloading\
    \ and using user-created modules, but that is an advanced concept not covered\
    \ here.\n\n### Example Program 8 – project8.py\n\n```python\nimport random\nprint\
    \ (\"Fortune telling...\")\nrng = random.randrange(1, 7)\nif (rng == 1):\n   \
    \ print(\"You will soon come into money.\")\nelif (rng == 2):\n    print(\"Consider\
    \ buying stocks.\")\nelif (rng == 3):\n    print(\"Look both ways before crossing.\"\
    )\nelif (rng == 4):\n    print(\"Call your relatives...\")\nelif (rng == 5):\n\
    \    print(\"You will get a phone call.\")\nelse:\n    print(\"Future cloudy...\
    \ Try again.\")\n```\n\n**Homework project:**\n* Create a “sampler” program that\
    \ shows off various module features.\n\n### Common Errors\n\nBecause many programmers\
    \ choose Python as their first language to learn, they often succumb to a few\
    \ common errors. If your applications are not functioning correctly, or if you\
    \ are looking for a few of the best programming practices, this section will help\
    \ help. When code is run through Python, it may stop and return an error to you.\
    \ By reading the error you can learn which line the error comes from, and usually\
    \ Python will point (^) to the exact character that is wrong. Use the information\
    \ that is given to you to understand your error and rectify the situation.\n\n\
    Not specifying the correct parameters is a common newbie mistake. When putting\
    \ values between the parentheses for a function, you must pay close attention\
    \ to what kind of data it expects. Some functions require only integers, and some\
    \ have 2 or more parameters to enter. When in doubt, consult the Python documentation\
    \ page for the specific function you are working with. Advanced IDEs, such as\
    \ `Atom` and `Eclipse` often are programmed to display an example parameter list\
    \ as you are typing out a function, and you can follow along with the example\
    \ to know what each parameter is expecting.\n"
