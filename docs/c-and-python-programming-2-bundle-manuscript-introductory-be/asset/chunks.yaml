  trans: "\n\n```python\nprint (\"I have {} pets, {} and {}\".format(pet_dict[\"Total\"\
    ], pet_dict[\"Dog\"], pet_dict[\"Cat\"]))\n```\n\n在这里，字典 `pet_dict` 包含三个值：“Total”、“Dog”和“Cat”。这些条目是通过在引号内命名并提供值来声明的。通过指定条目的名称来调用这些条目，例如使用\
    \ `pet_dict[\"Dog\"]` 来访问存储的值。使用字典时可以获得前所未有的组织管理能力，因为它们的形式形式类似于数据库。同样，它们可以在程序的任何时间被更改、更新、删除或添加。\n\
    \n```python\nalbums = {\"Milkduds\": 2, \"Harold Gene\": 1, \"The 7750's\": 3}\n\
    \nalbums[\"Milkduds\"] += 1 #新专辑！\n\nalbums[\"The 7750's\"] = 2 #实际上只有 2 张\n\n\
    albums.update({\"Diamond Dozens\": 1}) #发现了一个新乐队\n\ndel albums[\"Harold Gene\"\
    ] #卖掉了一个，不喜欢\n\nprint (\"These are the number of albums I own:\")\n\nprint (albums)\n\
    ```\n\n上面的幽默示例是一个简单的字典，用于存储某人拥有的专辑数量。在开始时，字典中每个乐队都有固定数量的专辑，但第二行显示收藏者获得了一张新的 Milkduds\
    \ 专辑。该行还使用了一种新的代码快捷。每当使用 `+=` 时，代码会被展开为 `albums[\"Milkduds\"] = albums[\"Milkduds\"\
    ] + 1`，但在程序中使用这种简写可以节省大量的时间和空间。第三行，收藏者意识到他们只有 2 张 7750 的专辑，因此命令完全更改了该条目的值。接下来引入了\
    \ `update()` 方法，它展示了如何向字典添加一个完全新的条目。遗憾的是，Harold Gene 从字典中删除了，因为收藏者卖掉了那张专辑。最后，通过不指定任何条目就可以打印整个字典。\n\
    \n这是一个有趣的例子，上面的程序实际上展示了字典在收集和存储数据方面是多么通用。将它们包含在程序中，以一种易于调用的方式将变量分组。\n\n### 示例程序\
    \ 4 – project4.py\n\n```python\nkeep_going = \"a\" # 在变量使用前初始化\n\nnumber_grades\
    \ = 0\n\ngrade_list = []\n\ntotal = 0\n\nprint(\"平均分计算器\")\n\nprint()\n\nwhile\
    \ (keep_going != \"No\" and keep_going != \"no\"):\n\n    grade = int(input(\"\
    输入测试成绩: \"))\n    number_grades += 1\n    grade_list.append(grade)\n    keep_going\
    \ = input(\"还要更多成绩吗？ \")\n\nprint()\n\nfor x in range (0, number_grades):\n  \
    \  total += grade_list[x] #累加列表中的所有成绩\n\nprint (\"{} 次测试的平均分是 {}\".format(number_grades,\
    \ total / number_grades))\n```\n\n### 业程序：\n\n* 编写更多数学函数的代码，例如中位数和众数。\n\n## 函数\n\
    \n到为止使用的每个函数都是 Python 内置的，由 Python 开发者编写的。函数实际上是代码快捷方式，因为函数是代码的压缩版本，它们接收数据作为参数，在后台运行较长的块，然后返回结果。使用函数是为了在执行常见的重复任务时节省时间和代码。Python\
    \ 保留了程序员编写自定义函数的能力，其写法如下：\n\n```python\ndef happy(name):\n    print (\"Happy birthday\
    \ to you. \" * 2)\n    print (\"Happy birthday dear {}.\".format(name))\n    print\
    \ (\"Happy birthday to you.\")\n```\n\n`def` 关键字表示用户定义函数的声明，紧随其后的是函数名；我们创建了函数\
    \ `happy()`。括号内是我们的函数将接收的值（只有一个，名为 `name` 的变量）。就像 `print()` 必须有一个值一样，我们的 `happy()`\
    \ 也需要一个。然后，与函数相关的代码被缩进。我们的代码只是运行了一首生日歌，并在歌曲中提供了变量 `name`。这个函数声明位于我们 Python 程序的顶部，但它在程序启动时并不会运行。要调用它，我们需要在代码中特意地引用该函数。\n\
    \n```python\nhappy(\"Dana\")\n```\n\n这里发生了一些有趣的事情。我们通过传递“Dana”作为值来调用 `happy()`。“Dana”被赋值给\
    \ `name`，函数开始运行。然而，变量 `name` 在用户定义函数外部不存在，任何调用它的尝试都会导致错误。这是因为变量有作用域（scopes），即它们可以访问的区域。`Name`\
    \ 有一个特定于函数的变量作用域，因此它永远不会在外部被调用。同样，主程序中声明的任何变量都不能被用户定义函数直接访问，必须在调用函数时作为参数传递。跟随下一个练习查看一个用户定义函数（UDF）的示例。\n\
    \n```python\ndef intdiv(num_one, num_two):\n    whole_answer = num_one // num_two\n\
    \    remainder = num_one % num_two\n    print(\"{} / {} = {} {}\".format(whole_answer,\
    \ remainder))\n```\n*(注：原文中 `intdiv` 的文本高度碎片化/混乱，我已根据上下文重构了逻辑流)。*\n\n"
- fmt: "\n# Classes\n\nClasses are a feature of Python that bring it more in line\
    \ with some of the more difficult programming languages. They are essentially\
    \ “programs within programs” because of how many features you can put into one.\
    \ Moreover, it is good programming form to use classes for organization. Object-oriented\
    \ languages such as Python occasionally show their object roots through concepts\
    \ like these, whereas objects contain attributes in the form `object.attribute`.\
    \ See the example below to understand.\n\n```python\nclass student:\n    def __init__(self,\
    \ name, grade):\n        self.name = name\n        self.grade = grade\n      \
    \  self.gpa = 0.0\n```\n\nThe class that we create is called `student`, and `student`\
    \ contains its own variables. Classes give us a way to organize objects and give\
    \ them personal attributes. So instead of having `student1_name`, `student1_grade`,\
    \ `student2_grade`, etc… as different variables, they can be consolidated by belonging\
    \ to a class. Within a program, the class declaration goes at the very top. Just\
    \ like a UDF, it does not actually run in the main program until called.\n\n```python\n\
    student1 = student(\"Tim\", \"Freshman\") #object is student1, an attribute is\
    \ “name”.\n```\n\nOur newly declared `student` class is used to create the `student1`\
    \ object with the attributes `Tim` and `Freshman`. This would have previously\
    \ taken two lines, but it is condensed considerably with classes. Classes compartmentalize\
    \ the related variables of the object so that each `student` declared has the\
    \ 3 properties `name`, `grade`, and `gpa`. The second line of our class declaration\
    \ contains `__init__`, which is a “method” (user defined function) that runs when\
    \ an object in the `student` class is created. `__init__`s parameters are the\
    \ ones required when creating that object. `self` is not actually a parameter,\
    \ it just refers to `student`, but `name` and `grade` are required, which is why\
    \ we included them when creating `student1`. Attributes of `student1` can be called\
    \ like so:\n\n```python\nprint (student1.name)\n```\n\nWhich would simply print\
    \ `Tim`. We did not declare the GPA variable during the `student1` initialization,\
    \ so we can do that with an assignment statement.\n\n```python\nstudent1.gpa =\
    \ 4.0\n```\n\nOr otherwise change an attribute that already exists.\n\n```python\n\
    student1.grade = “Sophomore”\n```\n\nIf we were to create another object, it would\
    \ have its own set of attributes that are completely different from `student1`.\n\
    \n```python\nstudent2 = student(\"Mary\", \"Senior\")\n```\n\nWhere `student1.grade`\
    \ is different from `student2.grade`, even though they share the same variable\
    \ name. For large projects with multiple repeating variables, classes can reduce\
    \ the amount of code clutter and variable names to keep track of.\n\nLooking back\
    \ to our custom class, we can expand upon it to achieve user defined functions\
    \ within the class itself.\n\n```python\nclass student:\n    def __init__(self,\
    \ name, grade):\n        self.name = name\n        self.grade = grade\n      \
    \  self.gpa = 0.0\n    def record(self):\n        return \"Student {} is a {}\
    \ with a {}\".format(self.name, self.grade, self.gpa)\n\nstudent3 = student(\"\
    Lily\", \"Junior\")\nstudent3.gpa = 3.67\n\nprint (student3.record())\n```\n\n\
    The `__init__` stays the same, but we add a UDF definition with the name `record`.\
    \ It passes the parameter `self` (because it has to refer to the class) and returns\
    \ a formatted string. In our actual main program `student3` is created. Finally,\
    \ we call the UDF with `student3.record()` (`object.function`). It returns our\
    \ formatted string, and therefore it is printed out by `print()`.\n\n## Special\
    \ Methods\n\nThe `__init__` method is actually a form of a UDF. However, methods\
    \ that are surrounded by two underscores are special methods within Python, which\
    \ means they run automatically at certain times. `__init__` is a special method\
    \ also specifically called a “constructor method”. Constructor methods get called\
    \ whenever an object is created, and that is why we put variable declarations\
    \ within it. When `student3` is created, so too are `student3.name`, `student3.grade`,\
    \ and `student3.gpa`. Therefore, any code that is put within the `__init__` block\
    \ will be activated any time an object is created for the first time.\n\nOther\
    \ special methods exist, and they are called on different events:\n\n- `__del__`\
    \ - called whenever an object is deleted (`del`). Also called destructor method.\n\
    - `__str__` - called when an object is passed as a string\n- `__setattr__` - will\
    \ run every time an attribute is set with a value\n- `__delattr__` - same as `setattr`,\
    \ but only runs when an attribute is deleted\n\nAdding in these special methods\
    \ can show when they run.\n\n```python\nclass student:\n    def __init__(self,\
    \ name, grade):\n        self.name = name\n        self.grade = grade\n      \
    \  self.gpa = 0.0\n    def __str__(self):\n        return \"{}\".format(self.name)\n\
    \    def record(self):\n        return \"Student {} is a {} with a {}\".format(self.name,\
    \ self.grade, self.gpa)\n\nstudent4 = student(\"Barry\", \"Professor\")\n\nprint\
    \ (student4)\n```\n\nWhen `student4` is printed (referenced as a string), the\
    \ `__str__` special method takes over and returns the `name` attribute of the\
    \ object. If this special method was not in there, we would not get the intended\
    \ output from referencing the object.\n\nFinally, classes are useful because we\
    \ can create “class variables” within them. `Name` and `GPA` are attribute variables\
    \ that are specific to each object declared, but there can also be class variables\
    \ that are shared by all objects. For instance, this program will keep track of\
    \ the total number of objects using a class variable.\n\n```python\nclass food:\n\
    \    total_foods = 0\n    def __init__(self, name):\n        self.name = name\n\
    \        self.calories = 0\n        self.foodgroup = \"\"\n        food.total_foods\
    \ += 1\n    def __del__(self):\n        food.total_foods -= 1\n    def __str__(self):\n\
    \        return \"{}\".format(self.name)\n    def get_total():\n        return\
    \ food.total_foods\n    def record(self):\n        return \"Food {0} is a {2}\
    \ with {1} calories.\".format(self.name, self.calories, self.foodgroup)\n\nfood1\
    \ = food(\"Carrot Stew\")\nfood1.calories = 210\nfood1.foodgroup = \"Vegetables\"\
    \nfood2 = food(\"Buttered Toast\")\nfood2.calories = 100\nfood2.foodgroup = \"\
    Grains\"\n\nprint (food.get_total())\ndel food2\nprint (food.get_total())\n```\n\
    \nAs the program creates a `food`, 1 is added to `total_foods`. Then, a food object\
    \ is deleted so 1 is taken away. The console prints 2, then 1 to show how our\
    \ UDF can be called to check the class variable. Keeping track of the number of\
    \ something is a common use for class variables, but they are highly useful for\
    \ other situations as well.\n\n## Example Program 6 – project6.py\n\n```python\n\
    class house:\n    def __init__(self, name, bedrooms, bathrooms, cost):\n     \
    \   self.name = name\n        self.bedrooms = bedrooms\n        self.bathrooms\
    \ = bathrooms\n        self.cost = cost\n        print(\"House for sale!\")\n\
    \    def __del__(self):\n        print(\"House off the market.\")\n\nprint(\"\
    House for sale:\")\nuser_input = input(\"What is the address of the house? \"\
    )\nuser_input2 = int(input(\"How many bedrooms? \"))\nuser_input3 = int(input(\"\
    How many bathrooms? \"))\nuser_input4 = int(input(\"How much does it cost? \"\
    ))\n\nhouse1 = house(user_input, user_input2, user_input3, user_input4)\nprint(\"\
    Looking for buyers...\")\nfor x in range (0, house1.cost):\n    x += 1 #wait a\
    \ while\nprint(\"Sold!\")\ndel house1\n```\n\n## Inheritance\n\nIn your more robust\
    \ and expansive programs, you might use multiple related classes. As an example,\
    \ think of the program where you must categorize devices on a network. Each device\
    \ type (desktop, laptop, phone, etc…) will have its own class, but you will ultimately\
    \ be repeating commonly used attributes. Both desktops and laptops will have names,\
    \ departments, and IP addresses, but they will also have a few distinct variables\
    \ specific to them such as Wi-Fi for the laptops and graphics cards for the desktop.\n\
    \n## Homework program\n\n*   Use classes to make a database organization program.\
    \ Users should be able to create new entries of a class and set variables, and\
    \ also view them at will.\n"
