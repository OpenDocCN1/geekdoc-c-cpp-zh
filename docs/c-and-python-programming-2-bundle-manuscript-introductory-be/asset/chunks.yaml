  trans: "\n\n无论你计划使用哪种编程语言，学习如何使用运算符都是非常重要的。这些运算符将帮助你告诉程序你想做什么，并能让处理你自己的代码变得简单得多。在程序内部可以使用四种主要的运算符，它们每种都将以不同的方式告诉程序如何运行。在\
    \ C++ 语言中可以使用的一些运算符包括：\n\n- 逻辑运算符\n- 算术运算符\n- 赋值运算符\n- 关系运算符\n\n让我们来看看其中一些运算符是如何工作的，以及在编写\
    \ C++ 语言代码时如何让它们很好地发挥作用。\n\n## 逻辑运算符\n\n我们在本指南中将使用的第一种运算符是逻辑运算符。它们将帮助你比较输入到系统的某些部分。你可以使用的的一些逻辑运算符包括：\n\
    \n- `||`: 这被称为逻辑或（OR）。如果你的操作数中有一个不为零，条件就为真。\n- `&&`: 这被称为逻辑与（AND）。如果你有两个操作数且它们都不为零，你的条件就为真。\n\
    - `!`: 这是逻辑非（NOT）。你可以用它来反转操作数的状态。所以如果条件结果为假，这个符号将将其变为真。\n\n## 算术运算符\n\n你可以使用的另一种运算符是算术运算符。这些与在学校里学习数学几乎相同。你将告诉程序使用你提供的信息进行加法、减法和其他方程计算。你可以使用的一些术运算符包括：\n\
    \n- `+`: 这是加法运算符，它将你选择的两个操作数相加。\n- `-`: 这是减法运算符。它将取右侧操作数并将其从左侧操作数中减去。\n- `*`:\
    \ 这是在 C++ 语言中进行乘法的运算符。\n- `/`: 这个运算符帮助你在 C++ 中进行除法。\n- `++`: 这是自增运算符。它将你的操作数的值增加一。\n\
    - `--`: 这是自减运算符。它将将操作数的值仅减少一。\n\n## 赋值运算符\n\n赋值运算符将帮助你更容易地为变量命名，并有助于搜索、保存等你正在编写的代码的不同部分。在\
    \ C++ 中可能使用的一些赋值运算符包括：\n\n- `=`: 这个运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧。\n- `+=`: 这种被称为加加赋值运算符。它将两个操作数的值相加，然后将和和赋值给左侧的操作数。\n\
    - `*=`: 这是乘乘赋值运算符。它将两个操作数相乘，然后将结果交给左侧的操作数。\n- `-=`: 这个运算符会将你右侧操作数的值从左侧减去，然后将此差值交给左侧操作数。\n\
    - `/=`: 这是除除赋值运算符。它将左侧的值除以右侧的值，然后将此结果赋值给左侧。\n\n还有其他一些赋值运算符，但它们更高级，所以我们只坚持这些基础运算符以帮助保持条不紊！\n\
    \n## 关系运算符\n\n在 C++ 语言中工作时，关系运算符会非常有帮助。你可以使用的一些包括：\n\n- `==`: 这个运算符将检查你的两个操作数的相等性。如果它们相等，条件将为真。\n\
    - `>`: 这个运算符将检查你操作数的值。如果左侧的操作数高于右侧，条件将为真。\n- `<`: 这个运算符基本上与上面相反。如果你发现左侧操作数的值大于右侧，条件将为真。\n\
    - `!=`: 这个运算符将检查你的两个操作数的相等性，如果值不相等，你的条件就为真。\n- `<=`: 这个运算符将检查左侧操作数是否小于或等于右侧操作数。如果符合这一标准，条件就为真。\n\
    - `>=`: 这个运算符将检查左侧操作数的值是否大于或等于右侧。如果为，条件就为真。\n\n## 第 6 章：帮助 C++ 做出决策\n\n有时，你需要程序为你做决策。你可以根据用户输入到计算机的信息以及你认为使条件为真需要满足的条件来设置让它以某种方式运行。在这个系统中，决策过程稍微高级一些，但你会发现它很容易学习，并且将开启你在\
    \ C++ 系统中可以使用的许多想法。让我们来看看你可以做什么来帮助系统自己做出决策。\n\n### Switch 语句\n\n我们在系统中内部要处理的第一个决策是\
    \ switch 语句。这些语句很好，因为它们允许你检查变量与一组值（或情况，cases）的相等性。你尝试检查的变量将与每个 case 进行比较。你可以使用的这种语法的好例子包括：\n\
    \n```\nSwitch(expression){\n  case constant-expression:\n    statement(s);\n \
    \   break; //可选\n  case constant-expression:\n    statement(s);\n    break; //可选\n\
    \  //你可以根据需要添加尽可能多的这些 case 语句\n  Default: //可选\n    statement(s);\n}\n```\n\n\
    在这些语句内部工作时，有一些规则你应该记在脑中。首先，switch 语句的表达式应该是整数类型或枚举类类型。此外，它也可以属于一个具有转换函数的类。在 C++\
    \ 中，你向语法中添加的 case 语句数量没有限制，你可以根据需要让它们变长或变短。只需记住每个 case 中都需要一个冒号和一个值。\n\n一旦变量找到了与它相等的值，它将继续运行直到找到\
    \ `break` 语句。系统找到 `break` 语句后，switch 就会停止。然后将传递控制流。你不需要在 cases 中放入 `break` 语句。如果你最终没有这些语句，控制流将继续传递下去。\n\
    \n### if 语句\n\n你在程序中可以做的最基础的事情之一就是创建一个 `if` 语句。这些基于系统内部的真和假概念。如果系统根据你设置的条件判断输入为真，那么程序将运行你要求执行的任何内容。例如，你设置系统判断\
    \ `2 + 2` 的答案是什么。如果用户输入的答案是 `4`，你可以弹出一个消息说“那是正确的！干得好！”\n\n每当用户输入的根据你设置的条件结果为真时，你就会看到你选出的语句。相反，如果用户输入了错误的答案会发生什么？如果他们对上面的问题的答案是\
    \ `5`，它将不对，系统将看到答案是假的。\n\n"
