    有时我们忘记了将用户输入转换为整数。如果我们正在提示用户输入数值，我们必须用 `int()` 或 `float()` 包裹 `input()`。如果不这样做，`input`
    的内容将作为字符串传递，这可能会导致返回错误。


    在比较两个值时，Python 要求程序员使用双等号（`==`）。在赋值值时，你必须使用单等号（`=`）。在任何情况下使用不恰的符号都将导致语法错误。


    在每个比较语句和循环（如 `if`、`elif`、`else`、`for`、`while`、`def` 和 `class`）之后都有冒号（`:`）。这个冒号表示下一行应该缩进，因此所有缩进的行都属于函数的作用范围。未放置冒号将返回语法错误。


    字符串和函数通常由一对字符包围。函数使用括号，而字符串使用引号来指示它们的边界。如果你忘记提供结束字符，Python 肯定会返回错误。


    学者经常会尝试使用 Python 默认不包含的函数，而没有包含正确的模块。在普通的 Python 中，无法调用高级数学函数或编辑文件目录。务必将将要用模块的
    `import` 命令放在程序顶部，否则应用程序将无法运行。


    Python 中缩进是必不可少的。来自其他编程语言的人可能会忘记这一点，并按照自己的风格进行缩进。这将破坏几乎所有的 Python 程序，因为解释器期望特定的格式标准。每当缩进错误就会返回错误。请密切关注你的缩进级别，否则你的程序可能会出现逻辑和语法错误。


    编程语言始终要求完美的语法。因此，即使是拼写错误对我们的应用程序也可能是灾难性的。除了缩进问题和拼写错误，给出错误的变量名或意外调用错误的函数可能会导致你的程序完全失败或运行异常。编写代码时，反复检查你的脚本，以确保没有字符出错。在每次实现后测试代码，这样当发生错误时，你就知道它是来自新添加的内容。有时代码中存在错误或漏洞，在检查代码后无法纠正。此时，程序员必须通过逐行跟踪代码来“调试”其代码，“追踪”解释器运行程序时采取的路径。某些
    IDE 具有调试工具，例如“断点”或“行停止”，它们允许你点击按钮运行每一行。像这样缓慢地运行程序大多数时候可以揭示问题的源，但需要敏锐的眼光和专注的问题解决者来修复代码。


    许多程序员认为没有必要，但为脚本编写注释是编码中不可或缺的一部分。这样做是一个极其常见的初学者错误，许多初次编程的人都会陷进去。一旦你掌握了 Python
    艺术并在与其他程序员一起工作的公司进行编程，可能会有多个人处理同一个脚本。即使是最整洁的代码第一次看也是令人困惑的，但注释有助于揭开复杂字符的神秘面。此外，回到你几周前的旧脚本可能感觉像在读外外语——注释能帮助你快速回到编码状态。许多程序员会在程序的第一行添加注释，简要描述脚本的功能、编写时间以及任何贡献者。这样，当你下一次快速浏览文件寻找某个特定程序时，注释可以帮助你在不实际运行或解码代码的情况下了解其内部内容。


    Python 新手中泛滥的最后一个常见错误是变量命名。如果在你的实验中尚未发现，那么某些名称是你不能用作变量名的。诸如 `class`、`break`、`print`、`and`、`or`、`while`
    等“保留”字是不能用作变量名的关键字。如果 Python 检测到它们的使用，将发生语法错误。除了错误之外，程序员在命名变量时经常也使用不当的形式。避免模糊且简单的变量名，如“number”或
    `var1`，而要使用描述性的名称，如 `user_input` 或 `totalNumberOfDogs`。这些变量一眼就能解释它们的用途，因此冗长的程序员永远不会误用变量，也不需要检查它的意图。Python
    程序员通常使用下划线法来命名变量（`grade_average`、`dog_1`），但 `camelCase` 也是接受的（`userInput`、`multAnswer`）。无论使用哪种方法，练的程序员总是会让名称具有描述性。


    ## 结论


    再次感谢下载这本 Python 初学者指南。现在你已经完成了阅读，拥有了关于 Python 如何运行的基础知识，你应该能够编写自己的程序了。你可以通过尝试创建更大更复杂的程序来进一步增加知识，或者学习模块并学习新函数。如果你喜欢这本书，请在
    Amazon 上评分并留下评论，以便制作更多高质量的书。


