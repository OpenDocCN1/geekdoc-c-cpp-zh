  raw: 'For times when programming code just does not work, you can always turn to
    search engines to resolve your problem.  Typing in the error text into Google
    can turn up other programmers who also had the same problem and posted online. 
    If the problem cannot be fixed by observing other code, websites such as Stack
    Overflow ([http://stackoverflow.com/](http://stackoverflow.com/)) are notoriously
    helpful in resolving code issues.    Make an account their and post your problem
    politely and somebody will probably help you out. 


    Finally, there are websites that offer tutorials online about how to learn intermediate
    and advanced Python programming. [http://www.learnpython.org/](http://www.learnpython.org/)
    is one particularly exemplary one, but the sheer amount comes from the fact that
    Python is highly used and well understood.  For any time Python help is needed,
    a quick internet search may solve your curiosities.


    The Job Market


    As a popular language and because of its widely implemented use, Python jobs are
    abundant.  Large companies and start-ups alike are looking for programmers that
    understand Python, and because Python is still increasing in use the jobs prospects
    will continue to increase.


    Most companies do not require college education for programming jobs, because
    they understand that most programmers are self-taught.  Obtaining a job in the
    Python job market is not difficult because of this, but it still requires preparation
    and dedication on the programmer’s part.  Younger Python programmers can gain
    internships at Google, Apple, Intel, and more just by showing a drive to learn. 
    Adult Python programmers can apply for programming jobs by directly contacting
    companies or replying to job listings.  Search online in message boards, job sites,
    and freelance websites such as UpWork for prospects. Also ask around programming
    groups and attend job fairs to learn about companies that are hiring Python programmers. 


    Build a decent résumé and be prepared to prove your knowledge with the language. 
    The interview process for programming jobs often contain “whiteboard” programming
    tests where you are presented with a situation and asked to use Python to solve
    the issue.  They will not be too terribly difficult, but you certainly need to
    have a decent grasp on Python to pass. 


    Overall, finding a Python job is easy because of the current market, but also
    difficult because you need to know Python intimately.  Dedicate yourself to applying
    for as many positions as possible and eventually a job will appear.


    History of Python


    Python is a programming language with origins in the late 1980’s.  Guido van Rossum,
    the creator, was looking to develop a language as a hobby project to supersede
    the ABC programming language.  Taking cues from the popular C language, Python
    was created to be a powerful but easy to understand scripting language.


    The term “scripting language” refers to the fact that written code is not actually
    compiled, but rather it is interpreted by an application.  Normally this means
    that scripting languages are not nearly as powerful as actual programming languages. 
    For Python, though, the opposite is true- the language remains one of the most
    powerful available for web servers and desktop clients.  Development of Python
    continued throughout the 1990’s until version 2 was released in 2000.  The interpreter
    behind Python became intricate enough that current versions of Python are almost
    indistinguishable from lower level programming languages. 


    Throughout the mid 2000’s and even now, Python continues to be developed by Guido
    van Rossum and a team of dedicated volunteers. The language gained great popularity
    due to its many benefits, and popular websites such as YouTube, Reddit, and Instagram
    even use Python for functionality.  It seems as though Python will continue to
    grow for many more years as companies adopt the easy to use but highly useful
    Python language.


    Why Use Python?


    When first starting out learning how to program, the huge amount of options, information,
    and advice can be truly intimidating.  Some experts claim that the difficult but
    time-honored C language is the best start, but other professionals say starting
    on an easier language such as Java or Python will give the learner a chance to
    actually absorb key concepts.  Python is recommended for this exact reason- programming
    will not be as foreign and confusing by starting with a straightforward scripting
    language. 


    Python is easy to understand, an elegant and clean language, and free of many
    of the complicated symbols and markings that are used elsewhere.  Often accomplishing
    a task using Python only requires a few lines of neatly formatted code.


    Large companies such as Google, Disney, NASA, and Yahoo all use Python for their
    own programs; having Python knowledge could potentially land a programmer a job
    working at a high-profile organization.  Moreover, because Python is continuously
    developed today with new features always being added, interest in the language
    will continuously increase with time.  More companies will discover that Python
    is an exceedingly useful programming language, so learning it now will prepare
    you for the future.


    Benefits of Python


    In addition to being easy and fast, Python also has various other benefits.  Python
    is very portable, meaning that Python code can run on a variety of different operating
    systems.  Windows, Mac OSX and Linux distributions are all supported directly,
    and code written on one platform can be used on all of them. 


    Power is not compromised by Python’s ease-of-use.  The interpreter behind the
    scripting language is able to turn near-natural English commands into low-level
    processor instructions that put it on par with actual programming languages. 
    Big-name companies choose to use Python because of this, and as websites such
    as YouTube and Pinterest prove, Python has a wide range of functionality. 


    Python is clean and retains a focus on readable code.  Style and formatting are
    usually left up to individual programmers, but with Python neatness is absolutely
    required.  For beginner programmers this instills good programming practices,
    which will dually help with Python and any other languages the novice wishes to
    learn.


    Ease of development and testing also propel Python above other similar languages. 
    Code can be run instantly with the interpreter which allows for rapid prototyping. 
    Being able to quickly test out code means that bugs can be fixed quickly, allowing
    more time for other development goals. 


    Conclusively, Python is the perfect language for beginners.  Both simple to develop
    for and learn, Python is also decently powerful.  Fantastic for newcomers and
    those just starting out programming, Python remains the top choice of technology
    companies everywhere.  Learning the language will prove to be useful now and into
    the future as its popularity continues to grow.


    Setting up a Development Environment


    Programming languages are typically used on Linux-based operating systems such
    as Ubuntu and Debian.  Python is no exception, but there is another option of
    developing on Windows.  This book will explain how to get both set up.  It is
    important to know though, that we will develop with Python 3, rather than the
    older (but still extremely popular) Python 2.7.


    Most Linux distributions actually come with Python installed by default.  Therefore,
    there are no extra setup procedures to obtaining a working environment.  The Python
    interpreter can be entered by typing “python” into a terminal console.  If there
    are multiple versions installed, though, “python” will start the first one found. 
    Check the version number in the interpreter, and if 2.7 launches you might have
    to type “python3” into the terminal instead.  Press ctlr+c to quit out of the
    interpreter at any time.'
