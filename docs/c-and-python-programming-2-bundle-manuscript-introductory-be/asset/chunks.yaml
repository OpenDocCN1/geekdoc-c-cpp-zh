    \ += 1\n\nprint()\n\nif (user_answer == \"A\" or user_answer == \"a\"):\n    correct\
    \ += 1\n    print (\"Correct\")\nelse:\n    print (\"Incorrect\")\n\nprint()\n\
    \nprint(\"What does '=' do in Python?\")\nprint(\"A: Compare, B: Assign, C: Both\"\
