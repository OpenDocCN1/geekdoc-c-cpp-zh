    # 5. What is the header used in most functions?


    ### Answers

    1. The blank spaces or comments that the compiler ignores

    2. `Cout <<x=y+1;>>`

    3. A sequence of three characters that represent a single character

    4. Bjarne Strousup

    5. `<iostream>`


    Congratulations, if you got all five right, then you can move on to the next section!
    However, if you got more than one wrong, then you should probably go back and
    reread the section. If you’re ready then onwards to Chapter 3.


    # Chapter 3: Diving more into Program Comments, Data Types, Lines, and Characters


    Now that we have covered the bare basics of C++ it is time to get into some more
    in depth subjects that surround the program. While these are more in depth, they
    are still a paramount concepts all beginners need to learn.


    ## Program Comments


    So, there are going to be times when you will want to write some comments inside
    of your code. These are important because they allow you to leave a little message
    inside the code so that others who are reading through it later on will be able
    to get a good look at exactly how your code is ran and also provide “referral”
    to what you’re trying to accomplish in your code. Furthermore, leaving notes within
    the lines of your code is a good way to notify yourself where a code might have
    gone wrong. By putting comments inside your codes, you are more likely to know
    where you succeed or where you went wrong.


    These comments can be as simple or as complex as you would like. Some people will
    just place in one or two words if that is all that is needed to help out the other
    users, but there are other times when you are going to need to combine a few more
    lines into the mix to ensure that it is all going to work out and that the other
    person understands what is going on inside of the code.


    In this language, you will just need to use the `//` symbol in order to show that
    you are writing out a comment. You can make it as long as you would like, just
    make sure that when the comment is done, you skip to the next line so that the
    program knows that it is supposed to start reading through it again.


    The program is going to stop reading after the `//` and it is not going to affect
    the way that the program works. Other programmers who look at the code will see
    the comments that you write, but when the program is executed, these comments
    are going to be skipped. You can add in as many as you would like to your program,
    but do try to keep them a bit limited because it can start to clog up the code
    and make it hard to read and understand.


    Program comments are basically the statements that are inside the code. The statements,
    or comments, are going to be there to help others who use your code understand
    what the purpose of each function is. All program languages allow for some type
    of comments, but they do not allow all of the kinds of comments that are out there.
    The most common to use is a single line comment. This is what all program languages
    allow for. These comments are simple explanatory lines that tell the next reader
    what the purpose is in a simple sentence.


    There are also multiple line comments. This is one that very few program languages
    allow for. C++ is one of those few languages. Sometimes you have a more complex
    explanation, and it needs to span over more than one line. This is possible to
    do in C++.


    When you are using a single line comment, you will see that it is written out
    in the code with `//` and can go all the way to the end of your line. An example
    of this is:


    ```cpp

    {

    cout << “that''s great” >>;  //prints that''s great

    return 0

    }

    ```


    will have the final output of “that''s great” and nothing else. The comment is
    ignored by the compiler so that you can let other programmers in on what the code
    is for, or what you need done to the code.


    However if you are trying to get some help on a code, you should use a multi line
    comment so that you can easily get the best out of your complicated code. Multi
    line comments are surrounded by these symbols `/*-*/`. Typed out like that it
    almost looks like an emoji. For example: `/* I need help making the puppet dance*/`


    A better example would be


    ```cpp

    /* I need help making the puppet dance

    *All he does at this point is sway from side to side */

    ```


    That would be a multi line comment. As you can see, when you start a new line
    you should put the asterisk at the beginning to indicate to the program that you
    are still writing a comment and that the next line is indeed whitespace. When
    compiled it will ignore the comments and only show what you want it to show.


    While you can mix the comment styles, it is best to keep them separated for now,
    until you get the hang of everything.


    ## Data Types


    You have to use different variables when you are writing a program using any language.
    These are nothing more than just reserved memory values that store locations in
    some space in the memory of the compiler. The above list of reserved keywords
    are useful here as well. While there are a lot of keywords, there are seven basic
    keywords that define data types.


    | Type | Keyword |

    | :--- | :--- |

    | Wide character | `wchar_t` |

    | Valueless | `Void` |

    | Double floating point | `Double` |

    | Floating point | `Float` |

    | Integer | `Int` |

    | Character | `Char` |

    | Boolean | `bool` |


    Most of the data types that you can use can be modified using one of these following
    modifiers to help:

    - `Long`

    - `Short`

    - `Unsigned`

    - `Signed`


    ## Variable Types Cont…


    When you are using variables inside of a coding language, you are providing some
    storage space that makes it easier to the program to manipulate. All of the variables
    that you use will be attached to a different type and these types are going to
    determine the layout and the size of the memory of the variable. It is also going
    to set a range of values that you are able to store on this memory space.


    Naming the variable is going to be similar to naming the identifier. You will
    only be able to name it with a letter or an underscore and the letters are going
    to be case sensitive. But after that, you are able to use any type of digit, letter,
    and character that you would like.


    Again, the basic variables that you will be able to use here in more detail include:

    - `wchar_t`: this is the wide character type.

    - `Void`: this is going to represent the absence of a type.

    - `Double`: this is a floating value that will have double precision.

    - `Float`: this is a floating point that is going to have single precision.

    - `Int`: this is an integer.

    - `Char`: this is often going to be just one byte and is a type of integer.

    - `Bool`: this is going to work with values that are either true or false.


    You can also define other types of variables. These variables are things line
    pointer, array, reference, enumeration, data structures, and classes.


    ## Creating a new line


    Now that you know the data types and modifiers, and all about making a comment
    in your program, it is time to learn about how to create a new line. This is a
    problem that a lot of new programmers run into. They have their program all nice
    and laid out in the input, but the output is still really mashed together and
    really unkempt. This is because they did not properly create a new line. Remember
    that whitespace is ignored, so you cannot just skip a line, and expect to have
    a line skipped in your program. You have to indicate to the compiler that you
    want to start a new line. This is really important, as when you play out your
    program, you want it to run smoothly. You do not want to see something like this.


    Try This Today I ate Pizza and I did math. 6= (7-1) that what I learned today.


    You would probably rather see this.


    Try This


    today I ate pizza and I did math


    6=(7-1)


    that is what I learned today


    To make the distinction, you have to have the right function, as that is what
    programming relies on, having the correct function.

    '
