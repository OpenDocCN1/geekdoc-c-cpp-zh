    你可以观察到值 2 被赋值给 `first_num`。然后，我们创建了一个新变量 `result`，它等于一个简短的数学表达式。`3` 和 `2` 被相加并赋值给
    `result`，然后打印为 `5`。接着，`first_num` 更新为包含一个新值。再次计算结果并打印出新结果。这个程序展示了在赋值中使用变量是多么简单，以及在程序中如何随时编辑变量。


    通过在等式中指定运算符，可以对数值变量进行更多算术操作。以下列表解释了 5 种运算符以及用于执行序列的符号。


    - 加法 `+` – 合并数字

    - 减法 `-` – 求数字之差

    - 乘法 `*` – 重复相加

    - 除法 `/` – 分组，或乘法的逆运算

    - 取模 `%` – 除法并使用余数作为答案


    整数和浮点数都可以轻松地使用上述运算符进行计算。但需要注意的是，整数通常会返回整数答案（整数），而浮点数将始终返回带有小数点的答案。Python 通常可以在需要时将整数转换为浮点数，但良好的编程习惯来自于在适当的时间选择正确的数据类型。例如，查看下方程序是如何使用浮点数的：


    ```python

    first_number = 5.0

    second_number = 3.0

    result = first_number / second_number

    print (result)

    ```


    控制台将返回 `1.666666` 作为答案。而如果使用整数，小数点之后的所有内容将被舍弃，答案为 `1`。在我们的这个小型程序中，将答案赋值给 `result`
    变量并不是完全必要的，我们可以重写为：


    ```python

    first_number = 5.0

    second_number = 3.0

    print (first_number / second_number)

    ```


    字符串变量不是通过数学方式进行编辑的（例如 `1 + “two”` 不返回 `3`）。相反，通过简单地覆盖单词来更改备注。


    ```python

    name = “Bob”

    name = “Bill”

    print (name)

    ```


    `name` 最初被创建为字符串“Bob”，但之后直接给它赋值了“Bill”。因此当调用 `print()` 时，字符串只包含“Bill”。然而，可以使用运算符来组合不同的字符串。


    ```python

    my_string = “Hello,”

    my_string2 = “World! ”

    print (my_string + my_string2)

    print (my_string2 * 3)

    ```


    第一个 `print()` 的输出将是“Hello, World!”，第二个 `print()` 的输出将是“World! World! World!”。加法运算符将两个字符串合并成一个巨大的字符串，而乘法运算符则按照指定的次数重复字符串。


    ## 输入


    尽管我们目前所学的内容很有趣，但预设的应用程序对终端用户来说并不实用。然而，Python 允许我们从用户那里获取输入，以便在脚本中增加一层交互性。`input()`
    函数将输入赋值给变量。


    ```python

    favorite_number = input (“What is your favorite number? ”)

    ```


    当程序到达这一行时，它将显示指定的文本并等待用户输入。输入的任何内容将被赋值给 `favorite_number`，可以像调用任何其他变量一样调用它。


    ```python

    print (“Your favorite number is”, favorite_number)

    ```


    我们没有使用加法运算符，而是使用了逗号。在 `print()` 中，逗号用于将多个打印语句合并为一条（在同一行）。我们可以使用任一种方法，但运算符不能用于不同的数据类型。在这种情况下，两种数据类型都是字符串，所以一切仍然有效。


    不过，用户通过 `input()` 给出的答案始终是一个字符串。如果我们寻求数值答案，就必须对其进行转换。另一个函数 `int()` 可以从字符串中提取数值数据。


    ```python

    favorite_number = int(input (“What is your favorite number? ”))

    print (“Your favorite number plus 2 is “, favorite_number + 2)

    ```


    这个程序中有很多新的细节之处。例如，使用 `int()` 将输入转换为整数。注意 `int()` 是如何包裹整个 `input()` 函数的，这是因为 `input()`
    必须作为 `int()` 的整个参数传递。接下来，`print` 语句打印多个部分的输出，等式 `favorite_number + 2` 在打印之前会被求值。


    使用 `int()` 总是返回一个整数答案，但可以使用 `float()` 来提取小数答案。`int()` 函数的工作原理实际上是将字符串“3”转换为数字
    3。每当获取数值输入时，务必包含它。


    ## 字符串格式化


    能够使用 `print()` 显示字符串是有用的，但有时我们的程序要求我们在其中显示变量。为了实际上将变量插入字符串中而不预先编辑它或合并多个变量，我们可以使用“字符串格式化器”。`format()`
    函数可以包含在 `print()` 语句中，对变量进行位置格式化。


    ```python

    dog_name = “Rex”

    print (“My dog’s name is {} and he is a good boy.".format(dog_name))

    ```


    当你运行上述代码时，它会自动将括号 `{}` 替换为提供的变量。`format()` 直接放在它将要编辑的字符串之后、右括号之前。因此，当代码运行时，控制台输出“My
    dog’s name is Rex…”。如果不使用 `format()`，我们不得不使用多行的复杂的打印设置。但 `format()` 最大的用处来自于涉及多个变量的情况。


    ```python

    dog_name = “Rex”

    dog_age = 12

    print (“My dog’s name is {0} and he is {1}. Sit, {0}!”.format(dog_name, dog_age))

    ```


    在这里，我们选择在大括号内指定值。`0` 翻译为第一个提供的参数，而 `1` 指向第二个变量。因此，在字符串的任何地方我们可以使用 `{0}` 来插入 `dog_name`，使用
    `{1}` 来插入 `dog_age`。控制台文本将是“My dog’s name is Rex and he is 12. Sit, Rex!”


    ## 示例程序 1 – project1.py


    ```python

    user_name = input("What is your name? ")

    user_age = int(input("What is your age? "))

    user_pets = int(input("How many pets do you have? "))

    user_GPA = float(input("what is your GPA? "))


    print () #打印空行


    print ("{0} is {1} years old. They have a {3} GPA, probably because they have
    {2} pets.".format(user_name, user_age, user_pets, user_GPA))

    ```


    这个程序结合了我们目前学的内容，从用户那里获取输入并返回。同时也引入了一个新概念：注释。`#` 符号用于表示注释，或供人类阅读的文本块。每当某行放置 `#`
    时，其后的所有内容会被 Python 忽略。注释主要用于向可能阅读你代码的其他程序员解释。在我们的案例中，我们解释了空的 `print()` 行只是产生空行。在代码中使用注释是良好的编程习惯，可以解释复杂的元素或提醒自己代码的作用。


    接下来，`format()` 函数用于在 `print()` 函数中替换 4 个实例。正如你可能注意到的，Python 中的计数从 `0` 开始。`0` 总是指向第一个元素，这就是为什么
    `3` 表示 `format()` 中第四个提供的变量。


    取决于你阅读本文出版物的媒介，上面的某些行可能已换行变为多行。但你不应该这样输入到文本编辑器中，因为 `print()` 行是一个单一命令。此外，从本文复制粘贴可能会引入
    Python 无法理解的额外字符。因此，输入项目 1 代码的正确方法是自己输入。


