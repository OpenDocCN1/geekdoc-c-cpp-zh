    Homework program:


    *   Use if statements to create a calculator program that prompts the user for
    two numbers and an operator.


    Loops


    Just as conditional statements activate if an expression evaluates to true, looping
    conditionals also compare values in an expression.  But while if, elif, and else
    statements are linear in nature, other conditionals have the ability to repeatedly
    run blocks of code.  “Loops” are conditional statements that can be run several
    times through the course of a program, and they allow for expanded functionality
    within Python programs.  A “while” loop is such a conditional.


    answer = 0


    while (answer != 2):


      answer = int(input("What is 4 / 2? "))


    print ("Correct!")


    So long as the specified condition evaluates to true, the “while” code block will
    continuously run.  We can see a perfect example of this through the program above. 
    We create a new variable “answer” and repeatedly compare it to 2.  While answer
    is not equal to 2, the program will ask the user for the correct answer.  Inputting
    something other than 2 will just loop back around to the while statement, again
    prompting for the correct answer.  If while finally does evaluate to true (because
    answer equals 2) the loop will break and the program will resume by printing “Correct”. 


    The program can be enhanced further by “nesting” conditionals.  A single indentation
    indicates a code block set aside for our while statement, but we can go for a
    second level of indentation to add an additional comparison.


    answer = 0


    while (answer != 2):


      answer = int(input("What is 4 / 2? "))


      if (answer != 2):


          print ("Incorrect...")


    print ("Correct!")


    This program uses “nested” functions to incorporate if statements within while
    statements.  The sheer amount of possibilities gained from this are virtually
    endless.  Note how there are indentation levels that determine which code blocks
    can run within which functions.  Every intended block, both 1 and 2 indent levels,
    will run when the while loop activates.  It is a hard-to-master concept, but one
    that surely increases functionality. 


    Another common loop is the “for” loop.  For is different from while in that a
    for loop runs through a range of numbers or a set of values instead of checking
    a conditional. 


    for user_variable in range (1, 5):


        print (user_variable)


    For takes the specified variable “user_variable” and uses the supplied range. 
    The variable will be initialized at 1, and it will be iterated every time the
    function loops.  By observing the output we can see how this works.


    1


    2


    3


    4


    User_variable is printed out, then incremented to 2.  It is printed again and
    incremented as 3.  Once more time for 4.  But it reaches 5 and stops, which is
    why 5 does not get printed out.  Because the keyword “range” was used, the for
    loop will always start at the first number and stop at the second.  Leaving it
    out will have the for loop cycle through the values given.


    for user_variable in (1, 5):


        print (user_variable)


    For example, only “range” is left out here, but the output is very different.


    1


    5


    Python runs the loop with the first value, 1, and then runs it with the second
    value, 5.  We will learn that using for loops this way is especially useful for
    lists, dictionaries, and tuples. 


    Lastly, loops can be broken with the break() function.  Bad programming form can
    lead to infinite loops, but including break() as a safeguard might save a user’s
    computer from crashing.


    Example Program 3 – project3.py


    print("Adding simulator")


    print("Type a number to add to total, or type blank line to stop")


    line = "a"


    total = 0


    while (line != ""):


        line = input("")


        if (line == ""):


            break


        total += int(line)


        print ("Total = {}".format(total))


    Homework program:


    *   Write a program using if statements that displays a text adventure game. 
    Offer multiple choices to the player that they can type in to select.  Use while
    loops to check the validity of user input.


    More about Variables


    Lists are another data type beneficial to talk about.  A list is an array of values
    that are grouped together into a single variable.  The single variable can then
    be used to call upon any of the “sub variables” it contains.  They are mostly
    used for organization and grouping purposes, and also to keep related variables
    in a similar place.  List variables are created by initializing them.


    state = "Texas"


    jack_info = [8, "West Elementary", state, "A"]


    print ("Jack goes to {} in {}.".format(jack_info[1], jack_info[2]))


    print ("He has a {} in math, even though he''s only {}.".format(jack_info[3],
    jack_info[0]))


    The list “jack_info” contains four values because we specify four different entries
    between the square brackets. They are just ordinary values such as the integer
    8 or the variable state, but they are grouped together for a common purpose by
    being placed into the list.  As it is seen, entries in lists can be accessed by
    specifying the location of the entry in square brackets.  Counting starts at 0,
    so the first entry of jack_info is 8, and the entry in [3] is “A”.   Visualize
    it like so:


    | Entry number: | 0 | 1 | 2 | 3 |


    | Data value: | 8 | “West Elementary” | state | “A” |


    A list could be initially declared with 3 entries, and it would have the range
    0-2.  The number of entries is nearly infinite, and it is only limited by the
    computer’s memory and the amount of variables the programmer fills it with. 


    The elements of a list can be edited as if they were individual variables.  If
    Jack ages a year, we only need to update the entry.  Furthermore, adding a new
    entry to the list can be done without completely redefining every value within
    it.  Using append(), a new entry will be created in the last


    state = "Texas"


    jack_info = [8, "West Elementary", state, "A"]


    jack_info[0] = 9


    jack_info.append(22)


    print ("Jack goes to {} in {}.".format(jack_info[1], jack_info[2]))


    print ("He has a {} in math, even though he''s only {}.".format(jack_info[3],
    jack_info[0]))


    print ("Lucky number is {}".format(jack_info[4]))


    The new additions to the program change the list ever so slightly to now have
    a new set of values.


    | Entry number: | 0 | 1 | 2 | 3 | 4 |


    | Data value: | 9 | “West Elementary” | state | “A” | 22 |


    Before continuing onwards, it is worthy to note a few more features about the
    string data type.  Strings are actually lists that contain character values. 
    As an example, take the string “Hello, World!”.  Broken down as a list, it would
    look like this:


    | Entry | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | … |


    | Character | H | e | l | l | o | , |  | W | … |


    And likewise, individual entries can be displayed from the string list.


    print (user_string[0]) # would print “H”


    print (user_string[7:13]) #would print “World!”


    Moving onwards, tuples are another data type within Python.  They are declared
    by using parentheses instead of square brackets.  Tuples are actually static lists,
    or lists that cannot be edited.  They are used when the programmer needs to ensure
    a range of data cannot change. 


    jim_grades = (99, 87, 100, 99, 77)


    print (jim_grades[2])


    Notice how an entry in a tuple is still accessed using square brackets. 


    Dictionaries take the concept of organized variables and take it to an extreme. 
    Just like lists and tuples, dictionaries can contain multiple values in a single
    variable.  The difference, however, is that dictionaries organize their records
    through names instead of numbers.  In this way, dictionaries are “unordered” lists
    of sorts, where any value can be called by the entry name.  Declare a dictionary
    with curly brackets, separating out values with commas and colons.


