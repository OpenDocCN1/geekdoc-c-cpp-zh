  \n### 引言\n感谢下载《黑客大学：少年版。从零开始学习 Python 计算机编程。成为 Python 零英雄：掌握 Python 语言的终极新手指南》。\n\
  \n由于多种原因，Python 是一种强大且推荐初学者使用的语言。本书为从未写过编程代码的人提供新手指南，因此即使编程的想法令人生生畏，这本书也可以用简单的语言对其进行解释。我们将从最开始通过实际代码示例介绍整个过程；跟随学习一项宝贵的计算机技能，这项技能可能会帮助你找到一份使用优雅的\
  \ Python 语言的工作。\n\n### 相关软件\n为了提高你的 Python 技能，请使用 IDE。如果你还没有下载，非常推荐使用 Atom 进行 Python\
  \ 编程。Atom 是可定制的，你可以随时安装插件来让编程变得简单。`autocomplete-python` 就是其中一个插件，它可以猜测你输入的内容并自动填充命令的剩余部分。\n\
  \n`VI` 和 `Emacs` 是程序员使用的另外两个流行的文本编辑器。它们都被认为是高度先进并针对编写代码进行了优化，但在这款软件的粉丝之间存在着“口水战”。对于\
  \ Linux Python 程序员来说，可以调查这两个文本编辑器，并测试它们是否对 Python 工作流有帮助。\n\n当你完成了一个特别实用的 Python\
  \ 程序并希望将其分发给用户时，必须记住，他们中的许多没有安装 Python，并且可能不想为了运行你的程序就安装它。`PyInstaller` (`http://www.pyinstaller.org/`)\
  \ 是一款软件，它可以将你的 Python 脚本和所需的模块构建成 `.exe` 文件，该文件不需要 Python 即可运行。它是分发应用程序的得手工具。\n\n\
  ### 在线资源\n要获取有关 Python 的在线帮助，你可以随时查看在线文档（`https://www.python.org/doc/`）。文档包含了 Python\
  \ 及其内置模块中每个函数的示例和手册页。\n\n\n\n\n当编程代码就是不起作用时，你总是可以转向搜索引擎来解决问题。在 `Google` 中输入错误文本可以找到其他也遇到过相同问题并在网上发布过帖子的程序员。如果无法通过观察其他代码解决问题，像\
  \ `Stack Overflow` ([`stackoverflow.com/`](http://stackoverflow.com/)) 这样的网站在解决代码问题方面是著名的非常有帮助。在那里创建一个账户并礼貌地发布你的问题，可能就会有人帮助你。\n\
  \n最后，还有一些网站提供如何学习中级和高级 Python 编程的在线教程。[`www.learnpython.org/`](http://www.learnpython.org/)\
  \ 是其中一个特别具有典范的例子，但之所以如此多，是因为 Python 被广泛使用且广为人知。在任何需要 Python 帮助的时候，快速的互联网搜索可能就能解决你的疑惑。\n\
  \n## 职场市场\n\n作为一种流行的语言，并且由于其应用广泛，Python 的工作机会非常丰富。大型公司和初创公司都在寻找理解 Python 的程序员，而且\
  \ Python 的使用量仍在增加，因此就业前景将继续增长。\n\n大多数公司对编程工作并不要求大学学历，因为他们理解大多数程序员都是自学的。正因如此，在 Python\
  \ 职场市场获得工作并不困难，但这仍然需要程序员自身的准备和奉献。年轻的 Python 程序员只需表现出学习动力，就能在 `Google`、`Apple`、`Intel`\
  \ 等公司获得实习。成年 Python 程序员可以通过直接联系公司或回复职位列表来申请编程工作。在留言板、招聘网站以及如 `UpWork` 这样的自由职业网站上在线搜索机会。还可以询问编程小组并参加招聘招聘会，以了解正在招聘\
  \ Python 程序员的公司。\n\n编写一份体面的简历，并准备好用这种语言证明你的知识。编程工作的面试过程通常包含“白板”编程测试，他们会给你出一个情境并要求你使用\
  \ Python 来解决问题。这些测试不会太困难，但你确实需要对 Python 有良好的掌握才能通过。\n\n总的来说，由于目前的市场，寻找 Python 工作是很容易的，但因为你必须熟悉\
  \ Python，它也很困难。投入精力申请尽可能多的职位，最终会出现一份工作的。\n\n## Python 历史\n\nPython 是一门起源于 20 世纪\
  \ 80 年后期的编程语言。其创始人 `Guido van Rossum` 当初是想开发一种作为业爱好项目的语言来取代 `ABC` 编程语言。从流行的 `C`\
  \ 语言中汲取灵，Python 被创建为一种强大但易于的脚本语言。\n\n“脚本语言”一词是指编写的代码实际上并没有被编译，而是由应用程序解释的。通常这意味着脚本语言远没有真正的编程语言强大。但对于\
  \ Python 来说，情况恰恰相反——这种语言仍然是 Web 服务器和桌面客户端可用的最强大的语言之一。Python 的开发持续了整个 20 年 9 年 年，直到\
  \ `2` 版本在 2000 年发布。Python 后面的解释器变得足够复杂，以至于现在的 Python 版本与低级编程语言几乎没有区别。\n\n在整个 2000\
  \ 年代中叶直到现在，Python 一直由 `Guido van Rossum` 和一组专注的志愿者继续开发。这种语言由于其许多优势而广受欢迎，诸如 `YouTube`、`Reddit`\
  \ 和 `Instagram` 这样的热门网站甚至使用 Python 的功能。随着公司采用这种易用且高效的 Python 语言，Python 似乎将在未来多年内继续增长。\n\
  \n## 为什么要使用 Python？\n\n初次开始学习编程时，海量的选择、信息和建议可能真正令人生畏。一些专家声称困难但历史悠久的 `C` 语言是最好的起点，但其他专业人士表示，从更简单的语言（如\
  \ `Java` 或 `Python`）开始将给学习者机会真正吸收核心概念。推荐 Python 正是因为这个原因——通过从简单直观的脚本语言开始，编程将不会那么陌生和困惑。\n\
  \nPython 易于理解，是一种优雅且整洁的语言，没有了其他地方使用的许多复杂符号和标记。通常，使用 Python 完成一项任务只需要几行格式整齐的代码。\n\
  \n`Google`、`Disney`、`NASA` 和 `Yahoo` 等大公司都使用 Python 编写它们自己的程序；拥有 Python 知识可能会让程序员获得在知名机构工作的机会。此外，由于\
  \ Python 现在仍在不断开发并不断添加新功能，对这种语言的兴趣随着时间的推移不断增加。更多的公司将发现 Python 是一门极其的编程语言，因此现在学习它将为你的未来做好准备。\n\
  \n## Python 的优点\n\n除了简单和快速之外，Python 还有许多其他优点。Python 具有很好的移植性，这意味着 Python 代码可以运行在各种不同的操作系统上。`Windows`、`Mac\
  \ OSX` 和 `Linux` 发行版都得到了直接支持，在一个平台上编写的代码可以在所有平台上使用。\n\nPython 的易用性并没有损害性能。脚本语言背后的解释器能够将近乎自然的英语命令转换为低级处理器指令，使其与真正的编程语言并肩。知名公司正因如此选择使用\
  \ Python，正如 `YouTube` 和 `Pinterest` 等网站所证明的，Python 具有广泛的功能。\n\nPython 非常整洁并保持对代码可读性的关注。风格和格式通常由个人程序员决定，但在\
  \ Python 中，整洁是绝对要求的。对于初学者来说，这培养了良好的编程习惯，双重有助于 Python 以及新手想要学习的任何其他语言。\n\n开发和测试的便利也使\
  \ Python 领先其他类似的语言。代码可以使用解释器立即运行，允许快速原型设计。能够快速测试代码意味着可以快速修复错误，从而为其他开发目标留出更多时间。\n\
  \n总之，Python 是初学者的完美语言。Python 既易于开发和学习，也相当强大。对于新者和刚开始编程的人来说，Python 仍然是各地科技公司的首选。随着其受欢迎程度的增长，学习这种语言将被证明现在和未来都是有用的。\n\
  \n## 设置开发环境\n\n编程语言通常用于基于 Linux 的操作系统上，如 `Ubuntu` 和 `Debian`。Python 也不例外，但在 `Windows`\
  \ 上开发是另一种选择。这本书将解释如何设置这二者。但重要的是，我们将使用 `Python 3` 进行开发，而不是旧的（但仍然非常流行的）`Python 2.7`。\n\
  \n大多数 Linux 发行版实际上默认安装了 Python。因此，获取工作环境不需要额外的设置程序。通过在终端控制台中输入 `python` 即可进入 Python\
  \ 解释器。但是，如果安装了多个版本，`python` 将启动找到的第一个。在解释器中检查版本号，如果启动了 `2.7`，你可能需要在终端输入 `python3`。按\
  \ `ctrlr+c` 随时退出解释器。\n\n\n\n\n\nWindows 电脑通常不会预装 Python。要获取该软件，请访问 [Python 网站](https://www.python.org/downloads/)\
  \ 并下载最新版本。截至目前，Python 3.5.2 是当前版本。只要你的版本号是 Python 3，书中编写的代码也应该是兼容的。使用大部分默认设置安装软件。务必勾选“Add\
  \ Python to the Path”（将 Python 添加到路径），因为这可以简化程序的测试。安装程序完成后，可以通过开始菜单中搜索 `python`\
  \ 来启动 Python 解释器。\n\n解释器（或解析器）是 Python 宣传特性之一，允许逐行编写和运行。对于测试代码来说，解析器非常棒，但我们在书中编写的几乎每个程序都是多行的，因此我们需要一个\
  \ IDE（集成开发环境）。Windows 拥有一些流行的解决方案，例如 `Atom`、`Pycharm` 和 `Eclipse`。这些都是可以下载并安装的第三方应用程序。IDE\
  \ 本质上是增强版的文本编辑器，提供了实用的编程功能，如语法高亮和命令补全。虽然非常推荐 Windows 开发者使用 `Atom`，但 Python 已经带有一个\
  \ IDE 解决方案。`IDLE` 是一个解释器程序，通过点击“file”（文件）然后“new file”（新建文件）可以变为多行。无论你选择使用预装编辑器，还是选择通过\
  \ `Atom/Eclipse` 获取完整的编程环境，Python 代码的运行方式都是一样的。你将在一个多行程序中编写代码。\n\n在 Linux 上，你也可以选择下载兼容\
  \ Python 的 IDE 应用程序，但大多数程序员倾向于使用预装的应用程序 `nano`。`Nano` 是一个内置的简易文本编辑器，通过在控制台中输入 `nano`\
  \ 访问。一旦程序知道正在编写 Python 脚本，它实际上可以执行一些基础的语法高亮，因此许多开发者更倾向于其提供的基础设置。代码写在 `nano` 中，然后按\
  \ `ctrl+x` 保存。\n\n现在开发环境已经就绪，你可以继续开始编写你的第一个 Python 程序了。\n\n### Hello World\n\n大多数程序员都是通过编写“Hello\
  \ World”程序开始接触新语言的。Hello World 传统上是一个简单的练习，涉及在屏幕上显示标题所示的文本。要在 Python 中实现这一点，我们必须打开\
  \ IDE 或文本编辑器并简单地输入该函数。\n\n```\nprint (“Hello, World!\")\n```\n\n接下来，我们保存文件。在 `IDLE`（以及大多数\
  \ IDE，如 `Atom`）中，必须通过“file”（文件）并点击“save as”（另存为）。在 `Nano` 中必须按 `ctrl+x`。以 `.py`\
  \ 扩展名命名文件并保存到容易访问的目录——桌面完全可以。为了这次演示，我们将文件命名为 `test.py`。\n\n运行 Python 文件在不同平台之间略有不同。Windows\
  \ 必须使用命令提示符，而 Linux 必须使用终端。打开相应的应用程序（Windows 使用 `ctrl+R` 然后 `cmd`，Linux 使用 `ctrl+T`）。这些应用程序是基于文本的界面，用于导航和与计算机交互。打印出的行将告诉你在当前所在的目录，你可以在\
  \ Windows 中输入 `dir` 或在 Linux 中输入 `ls` 来显示该目录下的文件列表。输入 `cd` 后跟目录名移动到另一个文件夹。由于我们已将文件保存到桌面，在两个操作系统中我们都可以通过输入\
  \ `cd Desktop` 使其激活。最后，通过输入 `python test.py` 或 `python3 test.py`（Linux 上）即可运行 Hello\
  \ World 脚本。\n\n如果上述编程代码被完全复制，将看到输出“Hello, World!”。程序将运行并返回终端/提示符。这并不完全华丽，但是是学习 Python\
  \ 值得的第一步。\n\n### 编程概念\n\n在上面的程序中，`print` 被称为命令或函数。每个函数都有必须遵循的特定语法。例如，在 `print` 之后有一组括号。括号内传递的值被称为参数。引号还包围了我们的文本，这种语法指定了编写的文本，即字符串（string）。必须完全遵循\
  \ `print` 的语法，否则当程序尝试运行时将返回语法错误。随着书中引入新函数，必须留心遵循语法规则。\n\n`print` 函数的引号内可以放置任何内容，它将被写入控制台。由于\
  \ Python 从脚本开头开始并逐行读取，可以一个一个地放置多个 `print` 函数，如下所示：\n\n```\nprint (“Hello, World!\"\
  )\nprint (“This is my 2nd Python Program”)\nprint (“Notice how each print command\
  \ puts the text on a new line!\")\n```\n\n保存并运行文件后，三个函数都将打印各自的参数。正如之前提到的，引号解释了将显示文本。放弃引号，则可以显示数字。\n\
  \n```\nprint (“The answer to everything is:”)\nprint (42)\n```\n\nPython 从脚本文件的开头开始，逐行向下运行，直到没有更多行，在这种情况下程序返回提示符或终端。\n\
  \n### 变量\n\n计算机具有通过将值存储为变量来“记忆”数据的能力。变量是预留用于包含值的 RAM 位置。编程语言必须通过编写代码专门声明变量并为其赋值。能够操作数据将证明是一项重要的资产。\n\
  \n创建变量被称为“声明”。赋值被称为“赋值”。Python 通过将两者合并为单一语句简化了这个过程。\n\n```\nlucky_number = 7\n```\n\
  \n然后我们可以使用 `print` 函数查看我们创建的变量。\n\n```\nprint (lucky_number)\n```\n\n由于 Python 从程序顶部开始向下工作，上述行需要处于正确的顺序。如果\
  \ `lucky_number` 没有先创建，那么 `print()` 将因为尝试调用不存在的变量而返回错误。\n\n仔细观察之前的 `print()` 参数时，可以看到一个重要的区别。变量\
  \ `lucky_number` 没有放在引号内，因此 Python 知道要打印其中的值 (7)。如果在文本周围加上引号，Python 将打印“lucky_number”，这并不是预期的结果。这种情况被称为逻辑错误（logic\
  \ error）。\n\n### 变量类型\n\n变量可以包含多种类型的值。我们的第一个变量被赋值为一个数值，但 Python 也有处理不同类型值的方法。\n\n\
  ```\nsecret_message = “rosebud”\nprint (secret_message)\n```\n\n如所示，我们也可以给变量分配文本字符串。过程几乎相同，但注意值周围的引号，它明确指示这是一个字符串。以下是\
  \ Python 3 中最重要的数据类型：\n\n- **Integer (整数)**：作为整数整数的简单数值。（例如 `1`、`0`、`-7`）。\n- **Float\
  \ (浮点数)**：小数值。“浮点数”（例如 `3.0`、`-7.6`、`1.010001`）。\n- **String (字符串)**：字母、单词或整个短语。包含在引号内。（例如\
  \ `“Hello, world”`、`“no”`、`“12”`）。\n- **Lists/Tuples/Dictionaries (列表/元组/字典)**：多个相关值作为一个对象分组在一起。可以是多种数据类型。（例如\
  \ `[1, 4, 4, 0]`、`[“Dog”, 2, “yes”]`）。\n\n显然，通过简单在变量声明中提供整数来声明数值值。如果涉及小数，它将是一个浮点数。变量也可以用于方程，或者在程序过程中进行修改和更改。将以下行写入脚本。\n\
  \n```\nfirst_num = 2\nresult = 3 + first_num\nprint (result)\n\nfirst_num = 3\n\
  result = 3 + first_num\n```\n\n\n\n\n\n```\nprint (result)\n```\n\n你可以观察到值 2 被赋值给\
  \ `first_num`。然后，我们创建了一个新变量 `result`，它等于一个简短的数学表达式。`3` 和 `2` 被相加并赋值给 `result`，然后打印为\
  \ `5`。接着，`first_num` 更新为包含一个新值。再次计算结果并打印出新结果。这个程序展示了在赋值中使用变量是多么简单，以及在程序中如何随时编辑变量。\n\
  \n通过在等式中指定运算符，可以对数值变量进行更多算术操作。以下列表解释了 5 种运算符以及用于执行序列的符号。\n\n- 加法 `+` – 合并数字\n- 减法\
  \ `-` – 求数字之差\n- 乘法 `*` – 重复相加\n- 除法 `/` – 分组，或乘法的逆运算\n- 取模 `%` – 除法并使用余数作为答案\n\n\
  整数和浮点数都可以轻松地使用上述运算符进行计算。但需要注意的是，整数通常会返回整数答案（整数），而浮点数将始终返回带有小数点的答案。Python 通常可以在需要时将整数转换为浮点数，但良好的编程习惯来自于在适当的时间选择正确的数据类型。例如，查看下方程序是如何使用浮点数的：\n\
  \n```python\nfirst_number = 5.0\nsecond_number = 3.0\nresult = first_number / second_number\n\
  print (result)\n```\n\n控制台将返回 `1.666666` 作为答案。而如果使用整数，小数点之后的所有内容将被舍弃，答案为 `1`。在我们的这个小型程序中，将答案赋值给\
  \ `result` 变量并不是完全必要的，我们可以重写为：\n\n```python\nfirst_number = 5.0\nsecond_number =\
  \ 3.0\nprint (first_number / second_number)\n```\n\n字符串变量不是通过数学方式进行编辑的（例如 `1 + “two”`\
  \ 不返回 `3`）。相反，通过简单地覆盖单词来更改备注。\n\n```python\nname = “Bob”\nname = “Bill”\nprint (name)\n\
  ```\n\n`name` 最初被创建为字符串“Bob”，但之后直接给它赋值了“Bill”。因此当调用 `print()` 时，字符串只包含“Bill”。然而，可以使用运算符来组合不同的字符串。\n\
  \n```python\nmy_string = “Hello,”\nmy_string2 = “World! ”\nprint (my_string + my_string2)\n\
  print (my_string2 * 3)\n```\n\n第一个 `print()` 的输出将是“Hello, World!”，第二个 `print()`\
  \ 的输出将是“World! World! World!”。加法运算符将两个字符串合并成一个巨大的字符串，而乘法运算符则按照指定的次数重复字符串。\n\n###\
  \ 输入\n\n尽管我们目前所学的内容很有趣，但预设的应用程序对终端用户来说并不实用。然而，Python 允许我们从用户那里获取输入，以便在脚本中增加一层交互性。`input()`\
  \ 函数将输入赋值给变量。\n\n```python\nfavorite_number = input (“What is your favorite number?\
  \ ”)\n```\n\n当程序到达这一行时，它将显示指定的文本并等待用户输入。输入的任何内容将被赋值给 `favorite_number`，可以像调用任何其他变量一样调用它。\n\
  \n```python\nprint (“Your favorite number is”, favorite_number)\n```\n\n我们没有使用加法运算符，而是使用了逗号。在\
  \ `print()` 中，逗号用于将多个打印语句合并为一条（在同一行）。我们可以使用任一种方法，但运算符不能用于不同的数据类型。在这种情况下，两种数据类型都是字符串，所以一切仍然有效。\n\
  \n不过，用户通过 `input()` 给出的答案始终是一个字符串。如果我们寻求数值答案，就必须对其进行转换。另一个函数 `int()` 可以从字符串中提取数值数据。\n\
  \n```python\nfavorite_number = int(input (“What is your favorite number? ”))\nprint\
  \ (“Your favorite number plus 2 is “, favorite_number + 2)\n```\n\n这个程序中有很多新的细节之处。例如，使用\
  \ `int()` 将输入转换为整数。注意 `int()` 是如何包裹整个 `input()` 函数的，这是因为 `input()` 必须作为 `int()`\
  \ 的整个参数传递。接下来，`print` 语句打印多个部分的输出，等式 `favorite_number + 2` 在打印之前会被求值。\n\n使用 `int()`\
  \ 总是返回一个整数答案，但可以使用 `float()` 来提取小数答案。`int()` 函数的工作原理实际上是将字符串“3”转换为数字 3。每当获取数值输入时，务必包含它。\n\
  \n### 字符串格式化\n\n能够使用 `print()` 显示字符串是有用的，但有时我们的程序要求我们在其中显示变量。为了实际上将变量插入字符串中而不预先编辑它或合并多个变量，我们可以使用“字符串格式化器”。`format()`\
  \ 函数可以包含在 `print()` 语句中，对变量进行位置格式化。\n\n```python\ndog_name = “Rex”\nprint (“My dog’s\
  \ name is {} and he is a good boy.\".format(dog_name))\n```\n\n当你运行上述代码时，它会自动将括号\
  \ `{}` 替换为提供的变量。`format()` 直接放在它将要编辑的字符串之后、右括号之前。因此，当代码运行时，控制台输出“My dog’s name is\
  \ Rex…”。如果不使用 `format()`，我们不得不使用多行的复杂的打印设置。但 `format()` 最大的用处来自于涉及多个变量的情况。\n\n```python\n\
  dog_name = “Rex”\ndog_age = 12\nprint (“My dog’s name is {0} and he is {1}. Sit,\
  \ {0}!”.format(dog_name, dog_age))\n```\n\n在这里，我们选择在大括号内指定值。`0` 翻译为第一个提供的参数，而 `1`\
  \ 指向第二个变量。因此，在字符串的任何地方我们可以使用 `{0}` 来插入 `dog_name`，使用 `{1}` 来插入 `dog_age`。控制台文本将是“My\
  \ dog’s name is Rex and he is 12. Sit, Rex!”\n\n### 示例程序 1 – project1.py\n\n```python\n\
  user_name = input(\"What is your name? \")\nuser_age = int(input(\"What is your\
  \ age? \"))\nuser_pets = int(input(\"How many pets do you have? \"))\nuser_GPA =\
  \ float(input(\"what is your GPA? \"))\n\nprint () #打印空行\n\nprint (\"{0} is {1}\
  \ years old. They have a {3} GPA, probably because they have {2} pets.\".format(user_name,\
  \ user_age, user_pets, user_GPA))\n```\n\n这个程序结合了我们目前学的内容，从用户那里获取输入并返回。同时也引入了一个新概念：注释。`#`\
  \ 符号用于表示注释，或供人类阅读的文本块。每当某行放置 `#` 时，其后的所有内容会被 Python 忽略。注释主要用于向可能阅读你代码的其他程序员解释。在我们的案例中，我们解释了空的\
  \ `print()` 行只是产生空行。在代码中使用注释是良好的编程习惯，可以解释复杂的元素或提醒自己代码的作用。\n\n接下来，`format()` 函数用于在\
  \ `print()` 函数中替换 4 个实例。正如你可能注意到的，Python 中的计数从 `0` 开始。`0` 总是指向第一个元素，这就是为什么 `3` 表示\
  \ `format()` 中第四个提供的变量。\n\n取决于你阅读本文出版物的媒介，上面的某些行可能已换行变为多行。但你不应该这样输入到文本编辑器中，因为 `print()`\
  \ 行是一个单一命令。此外，从本文复制粘贴可能会引入 Python 无法理解的额外字符。因此，输入项目 1 代码的正确方法是自己输入。\n\n**作业程序：**\n\
  \n- 制作一个获取宠物信息并将其返回的程序。\n\n### 决策结构\n\n\n\n\n既然 Python 3 的基础知识已经解释完毕，我们可以通过在代码中实现决策结构来开始提供真正的交互式程序了。决策结构是代码片段（称为条件语句），它们评估一个表达式并根据结果将程序分支到不同的路径。观察以下示例：\n\
  \n```python\nuser_input = int(input(\"What is 4 / 2? \"))\n\nif (user_input == 2):\n\
  \    print (\"Correct!\")\nelse:\n    print (\"Incorrect...\")\n```\n\n首先，我们从用户处获取输入。测试\
  \ `user_input` 是否等于 `2`（正确答案）。如果条件语句结果为真，程序将打印“Correct!”。然而，如果用户提供了错误答案，Python 将返回“Incorrect...”。这里涉及许多新概念，因此我们将逐行进行分析。\n\
  \n第一行对我们来说很熟悉：它获取输入，将其转换为整数并赋值给变量 `user_input`。第二行引入了一个新函数——“`if 语句`”。`if` 语句是用于评估括号内表达式的条件判断。我们的具体语句会检查\
  \ `user_input` 是否为 `2`，如果是，则执行紧随其后的代码行。比较使用 `==` 运算符而不是 `=` 运算符。双等号用于检查相等性，而单等号仅用于变量赋值。最后，`if`\
  \ 语句后面跟着一个冒号。\n\n缩进在 Python 中被广泛用于区分代码块。`if` 语句下方有一个带有 `print()` 函数的缩进行。由于此行被缩进了，它不会在代码中正常运行。相反，只有当条件\
  \ `if` 语句被证明为真时，该行才会运行。因为我们的用户输入了 `3`，条件将评估为“False”，“Correct!”一行将不会运行。相反，程序将移动到“`else\
  \ statement`”。`else` 是一个关键字，意思是“当 `if` 语句失败时运行”。条件语句后还有另一个缩进行，但这次由于 `else` 被激活，缩进代码实际上会运行。\n\
  \n如果用户输入了正确答案 `2`，则 `if` 语句将评估为真，控制台将打印“Correct”。在这种情况下，`else` 语句将完全不会运行。再次关注缩进代码并理解这些行之所以缩进是因为它们是“`if`”和“`else`”代码块的一部分。此外要意识到，程序中决策结构中只能有一个语句运行，因此如果\
  \ `else` 运行了，意味着 `if` 没有运行。同样，激活了 `if` 的程序将不会运行 `else` 下方的代码块。条件语句并不限于单行代码，如下所示。\n\
  \n```python\nuser_input = input(\"What language is this written in? \")\n\nif (user_input\
  \ == \"Python\"):\n    print (\"Correct!\")\nelse:\n    print (\"Incorrect...\"\
  )\n    print (\"This is not written in {}, it uses Python!\".format(user_input))\n\
  ```\n\n另一个缩进行位于 `else` 代码块中，如果用户没有正确输入“Python”，则两行都将运行。此程序确实在比较字符串，因此必须用引号包围文本。\n\
  \n### 条件运算符\n\n双等号（`==`）只是用于创建条件表达式的许多运算符之一。这个小列表显示了 Python 中的其他运算符。\n\n- `>` -\
  \ 大于\n- `<` - 小于\n- `==` - 等于\n- `>=` - 大于等于\n- `<=` - 小于等于\n- `!=` - 不等于\n\n`if`\
  \ 语句评估括号中的表达式是否为真；上述运算符允许一些有趣的表达式。\n\n```python\nage = int(input(\"How old are you?\
  \ \"))\n\nif (age <= 18):\n    print (\"Starting early! Good for you!\")\nelse:\n\
  \    print (\"Ah, a good age to learn.\")\n\nprint (\"Thank you for downloading\
  \ this book.\")\n```\n\n这里巧妙地利用了缩进。如果用户年龄为 18 岁或以下，它将祝贺他们，跳过 `else` 语句，最后打印感谢消息。如果用户年大于\
  \ 18 岁，它将显示 `else` 消息，然后也感谢他们。无论运行哪个条件，用户都会收到感谢消息。缩进决定了决策结构中哪些代码行会实际运行，你必须密切注意以避免逻辑错误。\n\
  \n对于需要两个两个潜在结果的情况，可以使用关键字“`elif`”。\n\n```python\nage = int(input(\"How old are you?\
  \ \"))\n\nif (age <= 18 and age > 0):\n    print (\"Starting early! Good for you!\"\
  )\nelif (age >= 80):\n    print (\"Never too late to learn!\")\nelif (age > 18 and\
  \ age < 80):\n    print (\"Ah, a good age to learn.\")\nelse:\n    print (\"That\
  \ seems like an invalid age.\")\n    quit()\n\nprint (\"Thank you for downloading\
  \ this book.\")\n```\n\n`elif` 是一个可以将决策过程拆分为多个分支路径的关键字。在 `if` 和 `else` 语句之间可以使用任意数量的\
  \ `elif` 条件。此外，上面还使用了另一个新关键字“`and`”。我们的第一个比较检查 `age` 是否小于或等于 `18` 且大于 `0`。因此，只有当\
  \ `age` 值同时满足这两个要求时，该条件才会评估为真。假设用户输入了 `75`。评估第一个语句，`75` 确实大于 `0`，但它也不小于 `18`，因此该语句被跳过。然后评估第一个\
  \ `elif`。`Age` 不大于 `80`，所以该语句也被跳过。第三，`age` 肯定在 `18` 和 `80` 之间，因此控制台打印“Ah, a good\
  \ age to learn”，然后完全跳过 `else` 语句。\n\n记住决策“树”中只能有一个语句运行，我们可以看到任何激活的 `elif` 本质上都会运行其代码块然后跳出决策结构。在上面的程序中，`else`\
  \ 被用作一种“兜底”类型的表达式。任何无效输入（例如“-1”）都会被 `else` 捕获并显示。良好的编程习惯源于捕获此类潜在的用户错误，作为一名有志的程序员，你应该在任何机会出现时预预期用户输入错误的值。\n\
  \n“`And`”是一个比较运算符，强制表达式的两个部分都为真。另一个运算符“`or`”用于强制表达式的某一部分评估为真。\n\n```python\nelif\
  \ (age == 25 or age == 50 or age == 75):\n    print (\"Happy quarterly birthday!\"\
  )\n```\n\n如果我们把这个 `elif` 放在上面的程序中（第一个 `if` 下方），我们将看到只要表达式的某部分为真，整个比较就为真。用户的年龄可以是\
  \ `25`、`50` 或 `75`，应用程序会说“Happy quarterly birthday”。使用 `and` 代替 `or` 是可能的，因为年龄不能同时是\
  \ `25`、`50` 和 `75`。我们用于比较的关键字非常有帮助且有用，但如果使用不当，会导致逻辑错误。\n\n### 示例程序 2 – `project2.py`\n\
