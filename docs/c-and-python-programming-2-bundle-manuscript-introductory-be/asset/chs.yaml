- "# C++ 与 Python 编程合集：学习 C++ 编程与 Python 编程入门初学者指南\n\n\n\n![](img/cover.jpeg)\n\n\n\
  \n\n\n![](img/00001.jpeg)\n\n\n本书包含来自《破解自由与数据驱动》系列中的 2 篇手稿。本质上是两书合一。\n\n本书的第一部分将深入学习\
  \ C++ 这种复杂的编程语言，并让你开启像大牛一样编程的之路！\n\n黑客大学：初级版 将介绍并提升你的 Python 编程技能，从入门到精通！\n\n\n\n\
  \n![](img/00002.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n## 第 1 章：基础背景、历史与 C++ 的成果\n\n在我们开始学习使用\
  \ `C++` 之前，你必须了解它是什么以及它是如何产生的。原因非常简单：要真正了解某事，你必须了解关于该主题你可能学到的一切，特别是当涉及到计算机编程这样具有技术性的领域时。\n\
  \n`C++` 是计算机和互联网历史中非常重要的一部分。它简单地交织在我们今天所知的科技历史之中。此外，如果没有 `C++`，智能手机上的应用和其他功能将不复存在。\n\
  \n当你学习 `C++` 时，你会对一种编程语言竟然对我们的日常生活产生如此巨大的影响感到惊。几乎每一台计算机都可以归功于可以追溯到 `C++` 语言的特定方面。学习这种语言的处之一是能够轻松学习其他语言。掌握\
  \ `C++` 的能力将增强你对其他编程语言的理解，这就是为什么许多人将其视为计算机编程的“教父”。此外，许多大公司仍然需要掌握 `C++` 的程序员，因为他们依赖这种编程语言来运行其中央计算机系统。所以，当遇到困难时，只要知道从长远来看这对你有益处，保持坚强并进入编程状态吧！\n\
  \n### C++ 的历史\n\nBjarne Stroustrup 正在撰写他的博士论文，他决定使用一种名为 Simula 的编程语言。这种语言是计算机时代最早的编程语言之一。但它非常慢而且充满了\
  \ Bug。\n\nStroustrup 提出了“带类的 C（C with Classes）”的想法。这是一种比 `Simula` 快得多的编程语言。带类的 C\
  \ 后来变成了 `Cfront`，它加速了创建语言的过程。然而，当 `C++` 出现时，`Cfront` 被远远甩身后，因为它在语言中加入了编译器，使其比当时的任何其他项目语言都更易用、更快地使用。\n\
  \n从那时起，已经有了注释类的参考指南和语言更新，使其变得更好、更快、更易于使用。《C++ 傻瓜》是该语言的一本流行指南。\n\n### C++ 到底是什么\n\
  \n`C++` 不仅仅是任何编程语言，它是面向对象的。面向对象编程（或简称 `OOP`）是围绕对象而非动作的编程。这就像是一次看到整幅画面，而不是每一个独立的拼图碎片。\n\
  \n这种编程语言在设计时考虑了灵活性和速度，因为当时的其他语言太慢了，而且只能做一件事，所以每当你想创建一个新事物时，都需要一种新语言。\n\n你可以用这种语言完成很多事情，尽管现在有数量惊人的语言，但它们在今天仍然非常流行。\n\
  \n*   **预装脚本**：这些是脚本爱好者和新黑客用来练习编程技巧的工具。由于现在有许多人想走捷径，预先准备好的脚本是大多数黑客寻找的，因此这些包需要改进，而他们使用\
  \ `C++` 实现了这一点。\n*   **视频游戏**：让我们面对现实，几乎每个人在人生的某个阶段都会玩视频游戏。无论是长大还是有了孩子，你都会沉浸在视频游戏的世界里，并且无法逃脱。那些游戏可以某种程度上归功于对\
  \ `C++` 语言的使用。如果你对制作游戏感兴趣，并通过图形为世界带来快乐，那么学习 `C++` 语言绝对是一个好主意。\n*   **网页**：许多网页是使用\
  \ `C++` 制作的。这是因为这种语言非常容易操控，它可以创建一个快速方便的网站，为人们提供许多交互功能。你经常访问的某些用 `C++` 创建的网站有 Amazon\
  \ 和 Ebay。如果你喜欢设计网页，你应该学习 `C++` 以提高效率，甚至在这个领域找到一份不错的工作。\n\n\n\n\n\n## 手机应用\n如今似乎每个人都有一部智能手机，这意味着应用程序无处不在。世界上有成千上万的应用程序，而且每天都在产生。有些应用是免费的，有些是付费的，但很大一部分是用\
  \ `C++` 开发的。这是因为这种语言的扩展性极强，可以用于简单的游戏，也可以用于复杂的购物应用。\n\n`C++` 还用于许多其他小型领域，例如 VoIP\
  \ 通话它就是使用 `C++` 创建的。事实是，你会反复听到 `C++` 是一门正在消亡的语言，但实际上这只是 `JAVA` 用户为了恐吓人们切换语言而使用的诡计，以确保\
  \ `C++` 走向死亡。\n\n### 为什么使用它\n\n使用 `C++` 不仅是因为它的灵活和快速，还因为它拥有许多组件、相对容易学习，而且如果你掌握了\
  \ `C++`，就能轻松地掌握其他语言。原因在于，当你先学习比其他东西都复杂一点的内容时，简单的内容就会迎刃而解；然而，如果你习惯了容易学习的科目，那么你会发现更困难的内容很难学习，因为你不习惯在尝试学习的科目上投入那么多精力。\n\
  \n如果你想学习一种可以在计算机技术领域内用于不同类型函数的语言，那么这种语言就适合你。你可以用它做几乎任何事情，一旦你对它足够了解，你可能就能找到操纵这种语言来完成它通常无法做的事情。\n\
  \n在计算机编程领域，`C++` 是一门非常重要的语言，尽管它的布局方式使其有很多变量，但它非常易读，也非常容易创建。这使其成为世界上最受欢迎的编程语言之一，因为没有人想苦苦于阅读代码。没有人想把所有时间花在自己知道是正确的事情上，仅仅因为他们找不到哪里出错了。\n\
  \n### 职业前景\n\n是的，市场上仍然有许多工作依赖于 `C++` 运行。你可以做许多不同的事情，而且所有这些事情都会影响社区中的其他人。视频游戏设计和网页设计是最著名的两个领域。你也可以成为一名白帽或蓝帽黑客。\n\
  \n但根据 `payscale.com`（搜索软件工程师），具有 `C++` 软件工程师背景的人根据经验可以获得 $57,000 到 $120,000 不等的收入。中位数约为\
  \ $80,363。拥有 `C++` 语言背景的人的其他头衔还包括计算机程序员、电气工程师和应用开发人员。\n\n然而，为了做到最好，你应该始终掌握两到三门编程语言以保持竞争力。虽然这些语言不会包含在本书中，但不要把自己固定在单一语言上。相反，就像人类语言一样，拓宽你的眼界并涉猎几种，但保持一种作为你的主语言。\n\
  \n由于其多功能性，`C++` 应该是你最后的备选主语言。也许可以使用 `JAVA` 或 `Linux` 作为你的其他语言，但 `C++` 是最好的主语言，而你只想主语言是最好的。\n\
  \n`C++` 是一种静态编写的低级语言，这意味着它是一门清晰且扩展的语言。\n\n`C++` 是 `C` 的全功能超集，支持面向对象编程。这意味着它支持 `OOP`\
  \ 的所有支柱，如封装、数据隐藏、继承和多态。\n\n要了解更多关于面向对象编程的知识，你可以在网上进行快速搜索并发现更多。最好了解它是什么，但这并不是你 `C++`\
  \ 知识的本质，所以它不会真正包含在书中，除了少数几带提及以及这里那里的一些零信息。\n\n### C++ 的三个重要组件\n\n标准的 `C++` 由三个非常重要的概念组成。\n\
  \n* **核心语言**：这由所有变量、数据类型、字面量以及语言的其他重要方面组成，创建了进入下一阶段的基石。\n* **C++ 标准库**：这允许你操作文件以及语言中的其他工作，并按照你的意愿操纵它们。\n\
  * **STL**：代表标准模板库（Standard Template Library），它提供了操纵数据结构、变量以及类似内容的函数。\n\n### 为什么\
  \ C++ 被认为是世界上最好的语言？\n\n嗯，除了反复提到的灵活性、速度和简单之外，它是一门跨越了三十多年的语言，并且今天仍被广泛使用。在生活的任何领域中，没有多少产品可以这样说。产品和公司来去去，但只有真正的完美会留下。俗话是这么说的。老实地说，自那时\
  \ `C++` 有了很多更新，但核心过程仍然相同。它问世时领先了时代几个量级，今天由于保持保持顶尖地位的更新，它仍然是一项非常先进的技术。\n\n还有很多关于为什么\
  \ `C++` 被认为是最好的语言的观点。虽然有很多人说 `C++` 不再流行，但有更多的人证明它仍然是世界上最好的语言，并且是他们的备选语言。这是他们最熟悉的语言，也是他们放在心底的语言。原因各异，但\
  \ 90% 的程序员默认使用 `C++` 表明它是今天世界上最好的编程语言。\n\n`C++` 是少数完全遵循 ANSI 标准的语言之一，这就是为什么你玩过的最棒的游戏仍然是使用\
  \ `C++` 编写的。因为它们的编译器被设置为确保所有命令在编写和执行时没有错误。它还可以用于许多不同类型的平台，无论你拥有 Microsoft、Unix、Mac、Windows\
  \ 还是 Alpha 设备，都可以使用 `C++`。这是一件很好的事，因为许多程序员必须跨多个不同的平台操作，而通用性使其易于操作和移植。只需将你的代码丢到闪存盘上并上传到任何需要的地方即可。\n\
  \n### 使用 C++ 语言的好处\n\n在使用 `C++` 语言时，你将享受到许多好处。其中一些益处包括：\n\n* **巨大的库**：由于 `C++` 已经存在很长时间，他们拥有一个非常大的库。这供你使用，你可以从脚本中挑选你需要的代码并节省一些时间甚至学习一些新知识。如果你愿意，也可以创建一些自己的代码，但这个库对于正在学习的初学者来说非常有帮助，并使比任何时候都更容易写出代码。\n\
  * **与其他语言协作的能力**：`C++` 是一种与世界上其他一些语言一起使用的极佳语言。这使得真正从事你想要的项目变得更容易，因为你可以从不同的代码语言中添加你喜欢的部分并将它们结合在一起，以获得真正惊不起的东西。\n\
  * **适用于许多项目**：大多数其他编程语言将只关注一个或两个小项目。例如，使用 `JavaScript` 意味着你将只致力于网站工作。但通过 `C++`，你可以利用它来帮助许多不同的项目。无论你是想从事网站工作、想创建一个新程序，还是用编程做其他事情，你都可以在\
  \ `C++` 的帮助下完成。\n\n\n\n\n\n*   快速且可靠：如果你用过过去流行的一些其他编程语言，你会发现它们有时并不是最可靠的。信息可能会丢失，或者它们并不会按照你想要的方式运行。如果你想要一种一次就能用通且可靠的工具，那么选择\
  \ `C++` 是一个好主意。\n*   提供强大功能：那些喜欢编程并希望在所做工作中拥有强大控制力的人会发现，`C++` 是他们的正确选择。在现有的编程语言中，它拥有最强大的功能之一。\n\
  \n这些只是当你使用 `C++` 编程语言时可以享受的几个优点。它看起来可能比其他语言（如 `Python`）稍微难用，但它拥有你所需的大量功能，并且与其他编程语言良好协作。通过一些练习，你将掌握这种语言的所有基础知识，并真正享受你用这种编程语言能实现的功能。\n\
  \n# 第 2 章：让我们开始\n\n让我们开始吧！有很多地方可以开始，但让我们先聊聊环境。虽然你并不真的需要搭建自己的环境，因为有很多在线环境。环境就是你选择的编译器，它接收你的代码并为你完成所有功能。在过去，你必须打开命令行提示符并创建一个环境来使用，但那些日子已经结束了。以前的一个小错误就可能对他们的电脑造成严重损坏。现在你可以练习一些有风险的命令，而不会对你的设备造成任何风险。\n\
  \n互联网上有许多示例可以尝试和使用。要尝试它们，最简单的地方是 `http://www.compileonline.com`。选择底部的“Learn C++”选项，它将带你去你需要去的地方。\n\
  \n这是一个可以尝试的示例。输出应该是单词“Try This”。\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nint main ()\n\n{\n\ncourt << “Use This One!”;\n\nreturn 0;\n\n}\n```\n\
  \n现在，你可以选择直接将这些代码输入到中，也可以编写几段代码并保存到计算机中，随时访问，这样你就不用在每次想弄它们时都重新输入。你可以使用几种不同类型的文本编辑器。然而，某些编辑器是特定设备类型的。这意味着它们只在创建它们的设备类型上运行。\n\
  \n你可以使用的文本编辑器有 `OS edit command`、`Brief`、`EMACS`、`epsilon`、`Windows Notepad`、`vlm`\
  \ 或 `vl`。然而，只有 `vlm` 和 `vl` 是多平台通。确保用 `.c` 或 `.cpp` 扩展保存文件。\n\n在考虑移动到编译器之前，你应该先在文本编辑器中编写程序的草稿。这是因为一旦你到了编译器，就很容易在程序上出错且无法察觉。然而，如果你在文本编辑器中以整洁、利落的方式布局好，那么在编译器中运行它们时应该就不会有问题问题。\n\
  \n## C++ 编译器\n\n市场上有很多不同的编译器，其中很多相当贵。那些编译器是为已经精通低级编译器的精英程序员准备的。初学者只需要基础编译器，而大多数都是免费的。然而，就像任何免费东西一样，你必须对你得到的东西小心。市场上糟糕的廉价编译器比好的多，所以借着免费的名义，我建议你在启动页面之后支付额外的功能费用。这些额外功能通常很便宜，所以你不需要花大血就能获得它们。\n\
  \n可用的最流行的编译器之一是 `GNU C/C++ compiler`。它最常用于 `UNIX` 和 `Linux` 安装。要检查你是否已经有了该编译器，请在你的\
  \ `UNIX/Linux` 应用中调出命令行并输入以下内容\n\n```bash\n$ g++ -v\n```\n\n如果编译器已安装，你应该会在屏幕上看到这条消息：\n\
  \n```\nUsing built-in specs.\nTarget: i386-redhat-linux\nConfigured with: ../configure\
  \ –prefix=/usr ......\nThread model: posix\ngcc version 4.1.2 20080704 (Red Hat\
  \ 4.1.2-46)\n```\n\n如果屏幕上没有出现这条消息，要么编译器不在电脑上，要么是你安装错误了，你需要重新检查并正确安装。\n\n在书中，我们将介绍如何使用\
  \ `Windows` 进行安装。如果你有不同的平台，应该去 `http://gcc.gnu.org/install/` 并阅读如何将其下载到你平台的说明。\n\
  \n要在你的 `Windows` 计算机上安装此编译器，你需要先安装 `MinGW`。这是让编译器与你的计算机兼容的软件，拥有这个软件是非常重要的，否则你甚至无法下载编译器。\n\
  \n要安装此软件，你可以前往软件主页 `www.mingw.org` 并让它引导你前往你需要的地方。一旦安装，你至少应该安装 `gcc core`、`gcc-g++`、`MinGW\
  \ runtime` 和 `blnutlls`，如果你愿意也可以安装更多。完成安装后，你可以在 Windows 命令行中运行所有的 `GNU tools`。\n\
  \n现在你已经准备就绪并可以运行，你可以开始学习更多关于运行程序本身的内容。\n\n## 基础语法\n\nC++ 不仅可以定义为程序，还可以定义为通过调用其他方法进行集体通信的对象。当你使用\
  \ `C++` 时，最重要的是知道以上四件事的含义。\n\n*   **类 (Class)**：这是一个模板或蓝图，规定了对象及其支持类型，并描述了对象的行为。这意味着对象根据它们的行为和动作/支持被分类到符合问题对象描述的类中。\n\
  *   **对象 (Object)**：对象具有行为和状态。例如，如果你看一只狗，它有状态。这些状态可以被分类为颜色、品种、名字、品种标准（AKC/AKA/APC\
  \ 注册处）。“狗”也表现出某些行为。它们摇尾巴、汪叫、喘气、吃干狗粮，并在院子外上厕。这些特征让狗成为了独特的对象。这些对象被分为若干组，你猜得没错，被称为类。\n\
  *   **方法 (Method)**：这是行为的另一个术语。在你的类中，你可以根据需要选择任意多或少的方法。这是操作所有数据并执行动作的地方，也是编写所有逻辑的地方。方法特别重要，因为没有它们，你的程序就不知道应该对你给它的变量做什么。它只会像个废品一样呆在那里，什么都不做。\n\
  *   **瞬时变量 (Instant Variables)**：指的是每一个单独的对象。每个对象都通过一组独特的这些变量进行分类，这些变量充当对象的指纹。这些变量通过使用对象每次创建时出现的值分配给对象。\n\
  \n现在你已经了解了编程的四个主要定义，让我们来看一段你可以编写的代码，它将打印出：“Try This”。与上面的示例不同，这会更深入地解释你想做什么，以及每个函数的原因。\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// main() [这是程序开始执行的时候。]\n\
  \nint main()\n{\n\ncout << “Try This”; // [打印 Try This]\n\nreturn 0;\n\n}\n```\n\
  \n此函数将允许你打印任何你想打印的内容，而不只是“Try This”这些单词。\n\n现在让我们分解一下上面列出的程序的各个方面。这种语言有几个不同的方面是需要你考虑的。每个方面对于运行它都至关重要，如果你不完全执行它们。\n\
  \n\n\n\n\n## 头文件\nC++ 有多个头文件，所有它们对你的编程操作来说都是必不可少的，或者至少是有用的。然而，对于大多数函数，你会看到位于 `<iostream>`\
  \ 之上的头文件。当你使用头文件时，请确保正确包含它，并在前面加上 `#include` 以提示程序使用该头文件。\n\n## 命名空间\n命名空间是 C++\
  \ 中一个相当新的特性，直到 2011 年的更新才引入。除了描述使用哪个命名空间外，它们并没有太大作用。虽然它们不是必须的，但它们可以减少你对程序函数的困惑。它们仅仅是作为更系统地组织函数的方法。\n\
  \n## Main\n这是 `main` 函数开始的地方。使用行 `// main()` 会令程序开始执行程序的 `main` 函数并开始输出过程。设置 `main`\
  \ 函数命令是关重要的，否则你的程序将不知道它应该运行什么，也不知道应该什么时候运行。这在程序内部被视为单行注释，它将告诉程序 `main` 函数正在开始。\n\
  \n## INT main\n这是函数执行正式开始的地方。如果你不包含它，整个过程将停止，因为你没有引入变量，而没有变量，程序就会迷失。\n\n## Cout\n\
  这指令程序在屏幕上显示你想显示的的消息。如果你不放置 `cout`，你的程序可能失败也可能不失败。问题在于你不知道自己是否成功了，所以如果你想确保一切运行顺畅，请务必添加\
  \ `cout`。\n\n## Return\n这会将值返回回零并终止函数。它指令程序结束进程并回到开头。\n\n## 编译指南\n现在来编译并执行你的第一个正式\
  \ C++ 程序。\n\n首先，你必须知道如何保存文件。打开你选择的文本编辑器，并输入上方看到的代码。完成后，点击“另存为”，并选择一个容易找到的文件位置。为了组织起见，最好为你的所有程序准备一个单独的文件夹。将文件保存为\
  \ `hello.cpp`，一旦完成后，在进入文件保存的目录之前打开命令提示符。\n\n要让文件在编译器中打开，首先输入 `g++ hello.cpp`。然后你可以按回车，代码就会被正确打开。只要没有错误，提示符就会生成一个\
  \ `a.out` 可执行文件。要运行程序，输入 `./a.out` 并查看编译器的工作。从此以后，你应该在计算机上从编译器获得的信息包括：\n\n```bash\n\
  g++ hello.cpp\n./a.out\n```\n\n### 尝试一下\n确保你以正确的方式输入所有变量，并记住，这些内容是对大小写敏感的。如果你不以正确的方式函数，你会发现事情往往会出错。编码的关键在于你必须保持精确。这种注重细节的个人特质适用于所有编程语言！然而，只要愿意留心，任何人都可以做到。\n\
  \n基础函数命令并不是你唯一需要使用的。当你构建提示符时，还有其他事情也很重要，因为它们也指令程序执行特定的事情。其中一些东西是代码块和分号。\n\n### 分号\n\
  当你想到分号时，你可能认为它是句子中的停顿，然而，在 C++ 程序中它们是完全的停止。分号表示语句的结束。这意味着每个单独的语句必须通过使用分号来指示。以下是三个不同的语句：\n\
  \n```cpp\nx=y;\ny=y+1;\nadd(x,y);\n```\n\n这些每一个语句之间不仅通过换行符分隔，还通过分号分隔。你也可以这样做：\n\n\
  ```cpp\nx=y; y=y+1; add(x,y);\n```\n\n每一个都仅仅因为分号而被识别为独立的语句。如此简单的东西竟然能产生如此大的影响，这确实令人惊讶。\n\
  \n### 代码块\n在这个编码语言中，代码块是一组用括号括起来的语句。这些语句是程序由于主命令提示符而在屏幕上输出的逻辑实体。例如：\n\n```cpp\n\
  {\n    cout << \"I like Pizza\"; //打印 I like Pizza\n    return 0\n}\n```\n\n行尾并不是终止符，如上文所示。分号是终止语句的唯一东西。\n\
  \n## 标识符\n现在让我们转向程序中的标识符。这些标识符用于识别多个事物，例如块内的类、模块、函数和变量。标识符是一组字母和数字，你可以用它们来命名你的程序或文件，它们必须以字母开头，之后可以包含任何你想要的字母或数字。除了你在句子中可能看到的符号外，不允许使用标点字符作为标识符。你不会看到如\
  \ `@`、`&`、`,`、`%` 或 `$` 等字符，并且编程是对大小写敏感的。这意味着 `YokoOno` 与 `Yokoono`、`yokoOno` 和\
  \ `yokono` 是不同的。确保你在程序中只对应该大写的字母进行大写。\n\n虽然几乎任何东西都可以作为标识符，但 C++ 中有些东西是保留给关键字的，不能作为标识符。这些词如下：\n\
  \n| | | | |\n| :--- | :--- | :--- | :--- |\n| `asm` | `Break` | `Bool` | `Auto`\
  \ |\n| `Char` | `Catch` | `Case` | |\n| `Const cast` | `Const` | `Class` | |\n|\
  \ `Delete` | `Default` | `Continue` | |\n| `Dynamic cast` | `Double` | `Do` | |\n\
  | `Explicit` | `Enum` | `Else` | |\n| `False` | `Extern` | `Export` | |\n| `Friend`\
  \ | `For` | `Float` | |\n| `Inline` | `If` | `Goto` | |\n| `Mutable` | `Long` |\
  \ `Int` | |\n| `Protected` | `Private` | `Namespace` | |\n| `Reinterpret cast` |\
  \ `Register` | `Public` | |\n| `Signed` | `Short` | `Return` | |\n| `Static cast`\
  \ | `Static` | `Sizeof` | |\n| `Template` | `Switch` | `Struct` | |\n| `True` |\
  \ `Throw` | `This` | |\n| `Typeid` | `Typedef` | `Try` | |\n| `Unsigned` | `Unlon`\
  \ | `Typename` | |\n| `Void` | `Virtual` | `Using` | |\n| `While` | `Wchart` | `Volatile`\
  \ | |\n\n在标识符方面，其他一切都是允许的。将标识符视为用户名和密码。混合使用，但要确保它们是有效的。\n\n## 三元组\n三元组是三个字符的序列，代表一个字符。你会注意到这些，因为它们以两个问号开头。使用三个字符代替一个似乎有点冗余，但背后的原因是为了让你不要混淆字符的含义，因为很多字符是相似的。\n\
  \n这里是一些常用的三元组，向你说明我们的意思：\n\n- `??=` 是 `#`\n- `??/` 是 `\\`\n- `??'` 是 `^`\n- `??(`\
  \ 是 `[`\n- `??)` 是 `]`\n- `??!` 是 `|`\n- `??<` 是 `{`\n- `??>` 是 `}`\n- `??-` 是 `~`\n\
  \n由于其混淆的本质，并不是所有编译器都支持三元组，大多数人也试图避开它们，然而发现，当你背下三元组时，你在函数中按错符号出错的概率就会降低。\n\n## 空格符\n\
  接下来是空白符。这是程序中的空行。有时它们包含注释，这些被称为空行。编译器完全忽略它们。空白符描述了空格、新行、制表符、字符和注释。它仅仅用于让你的程序看起来更有组织性、更易读。\n\
  \n在变量/标识符和语句之间应该至少有一行空白。\n\n## 测验\n你以为你可以直接翻过这本书而不接受测试你是否在关注吗？不要作弊！仅仅因为你可以偷看答案，并不意味着你应该这样做。你应该像对待普通测验一样对待它，真正测试你的知识，这样你就可以判断是否需要回去重读某些内容。这是一个短测验，所以你会没事的。\n\
  \n1. 什么是空白符？\n2. 填空： `___ <<x=y+1_>>`\n3. 什么是三元组？\n4. 谁发明了带类的语言？\n\n\n\n\n\n## 5.\
  \ 大多数函数中使用的头文件是什么？\n\n### 答案\n1. 编译器忽略的空格或注释\n2. `Cout <<x=y+1;>>`\n3. 表示单个字符的三个字符序列\n\
  4. Bjarne Strousup\n5. `<iostream>`\n\n恭喜你，如果你这五个都对了，那么你就可以进入下一个章节了！但是，如果你错了不止一个，那么你可能应该回去重读这一节。如果你已经准备好了，请继续进入第\
  \ 3 章。\n\n# 第 3 章：深入学习程序注释、数据类型、行和字符\n\n现在我们已经涵盖了 C++ 的最基础知识，是时候进入一些围绕程序的更深入的话题了。虽然这些内容更深入，但它们仍然是初学者需要学习的核心概念。\n\
  \n## 程序注释\n\n在某些时候，你可能想在代码内部编写一些注释。这些注释很重要，因为它们允许你在代码中留下一些简短的信息，这样以后阅读代码的人就能清楚地看到你的代码是如何运行的，并为你代码中尝试实现的目标提供“参考”。此外，在代码行中留笔记是提醒自己代码可能出错的好良好方法。通过在代码中添加注释，你更有可能知道自己在哪里成功了，或者在哪里犯了错。这些注释可以根据你的需要变得简单或复杂。有些人可能只需要写一两个单词就能帮助到其他用户，但在其他时候，你可能需要结合更多的行内容，以确保一切正常运行，并让其他人理解代码内部正在发生什么。\n\
  \n在这种语言中，你只需要使用 `//` 符号来表示你正在编写注释。你可以写任意长度的注释，只需确保在注释完成后跳到下一行，这样程序就知道应该重新开始读取了。\n\
  \n程序在遇到 `//` 之后会停止读取，这不会影响程序的运行方式。查看代码的其他程序员会看到你编写的注释，但在程序执行时，这些注释会被跳过。你可以在程序中添加任意数量的注释，但请尽量保持适量，因为它们可能会填满代码，使其难以阅读和理解。\n\
  \n程序注释基本上是位于代码内部的语句。这些语句（或注释）将帮助使用你代码的人理解每个函数的用途。所有的编程语言都允许某种类型的注释，但它们并不允许所有类型的注释。最常用的是单行注释，这是所有编程语言都允许的。这些注释是简单的解释行，用简单的句子告诉下一个读者其用途。\n\
  \n还有多行注释。这是极少数编程语言允许的类型。C++ 就是这些少数语言之一。有时你有一段更复杂的解释，并且它需要跨越多行。这在 C++ 中是可以实现的。\n\n\
  当你使用单行注释时，你会看到它在代码是用 `//` 编写的，并且可以延伸到行的末尾。示例如下：\n\n```cpp\n{\ncout << “that's great”\
  \ >>;  //打印 that's great\nreturn 0\n}\n```\n\n最终输出将是“that's great”而没有其他内容。编译器会忽略注释，这样你就可以让其他程序员知道代码的用途，或者你需要对代码进行哪些处理。\n\
  \n然而，如果你试图在某些代码上寻求帮助，你应该使用多行注释，这样你就能轻松地利用你复杂的代码。多行注释由 `/*-*/` 符号包围。这样写出来看起来几乎像一个表情符号。例如：`/*\
  \ 我需要帮助让木偶跳起来*/`\n\n一个更好的例子是：\n\n```cpp\n/* 我需要帮助让木偶跳起来\n* 在此阶段，他所做的只是左右摇晃 */\n\
  ```\n\n这就是多行注释。如你所见，当你开始新的一行时，应该在开头放置星号，以指示程序你仍在编写注释，并且下一行确实是空白内容。编译时，它将忽略注释，并只显示你想让显示的内容。\n\
  \n虽然你可以混合使用注释样式，但目前最好将它们分开，直到你完全掌握了这一切。\n\n## 数据类型\n\n在用任何语言编写程序时，你必须使用不同的变量。这些无非只是预留的内存值，存储在编译器内存某些空间中的位置。上述预留关键字列表在这里也有用。虽然有很多关键字，但有七个定义数据类型的基本关键字。\n\
  \n| 类型 | 关键字 |\n| :--- | :--- |\n| 宽字符 | `wchar_t` |\n| 空值 | `Void` |\n| 双精度浮点数\
  \ | `Double` |\n| 浮点数 | `Float` |\n| 整数 | `Int` |\n| 字符 | `Char` |\n| 布尔值 | `bool`\
  \ |\n\n你可以使用的大部分数据类型都可以使用以下修饰符之一进行修改以提供帮助：\n- `Long`\n- `Short`\n- `Unsigned`\n\
  - `Signed`\n\n## 变量类型（续）\n\n当你在编码语言内部使用变量时，你提供了一些存储空间，使得程序更容易进行操作。你使用的所有变量都会关联到一个不同的类型，这些类型将决定变量内存的布局和大小。它还将设定你可以在此内存空间上存储的值范围。\n\
  \n为变量命名与为标识符命名相似。你只能用字母或下划线命名，并且字母是区分大小写的。在此之后，你就可以使用任何你喜欢的数字、字母和字符。\n\n再次，你在这里可以使用的变量变量的详细信息包括：\n\
  - `wchar_t`：这是宽字符类型。\n- `Void`：这代表类型的缺失。\n- `Double`：这是一个具有双精度的浮点值。\n- `Float`：这是一个单精度的浮点数。\n\
  - `Int`：这是一个整数。\n- `Char`：这通常只有一个字节，是一种整数类型。\n- `Bool`：这将适用于真或假的值。\n\n你还可以定义其他类型的变量。这些变量包括指针、数组、引用、枚举、数据结构和类。\n\
  \n## 创建新行\n\n现在你已经知道了数据类型和修饰符，以及关于在程序中创建注释的所有知识，是时候学习如何创建新行了。这是许多新程序员都会遇到的问题。他们的程序在输入中布局得很整齐，但输出仍然挤在一起且非常凌乱。这是因为他们没有正确地创建新行。记住空白是被忽略的，所以你不能只是跳过一行就期望程序中也跳过一行。你必须指示编译器你想开始新的一行。这非常重要，因为当你运行程序时，你希望它运行顺畅。你不想看到像这样的：\n\
  \n尝试一下 我今天吃了披萨并做了数学。6= (7-1) 这就是我今天学到的。\n\n你可能更愿意看到这个：\n\n尝试一下\n\n今天我吃了披萨并做了数学\n\
  \n6=(7-1)\n\n这就是我今天学到的\n\n为了做出这种区别，你必须使用正确的函数，因为编程依赖于拥有正确的函数。\n\n\n\n\n要创建换行，你必须使用函数\
  \ `endl`；这表示你想换行，如果你不想加空格，你甚至不需要添加空格，尽管建议这样做，因为这会让你的程序对人类来说更易读。\n\n例如，像这样：\n\n```cpp\n\
  {\ncout << Try This;>> endl;\n<<Today I ate Pizza and did Math;>> endl;\n<<6=(7-1);>>\
  \ endl;\n<< That is what I learned today;>> endl;\nreturn 0\n}\n```\n\n看起来比下面这个好得多：\n\
  \n```cpp\n{\ncout << Try This;>> endl; << Today I ate Pizza and did Math;>> endl;\
  \ <<6=(7-1);>> endl; << That is what I learned today;>> endl;\nreturn 0\n}\n```\n\
  \n你能看到这对于阅读代码的人来说会有多么困惑吗？你希望你的代码文件易于阅读，这样如果其他人必须修复某些东西，他们就能轻松地找到错误之处。如果所有内容都混在一起，他们就无法很容易地找到任何东西，不是吗？\n\
  \n你也可以使用 `\\n` 来指示换行。这与 `endl;` 的作用相同，但输入速度快得多。你可以使用任何你喜欢的方法，但要选择一种并坚持下去。\n\n##\
  \ C++ 基础的重要性\n\n我知道你在想什么，为什么在你刚开始时就必须知道这些无意义的碎片信息，原因在于，如果你现在不学习它们，你以后就不会认为自己会需要它们，那么当你在阅读别人别人写的程序时，你会好奇所有那些额外的字符是什么意思，以及为什么有这么多空格。如果要精通更复杂的编程方法，养成这些简单但有些枯燥任务的习惯至关重要。就像掌握任何语言一样，你必须先掌握基础，才能掌握专家级概念。\n\
  \n### 变量定义\n\n变量定义指示编译器如何以及在何处存储和创建变量。它指定了数据类型，并列出了一个或多个该类型的变量。例如：\n\n`type variable_list;`\n\
  \n你必须列出上述的有效数据类型。只要用逗号分隔，它们可以包含一个或多个标识符名称，例如：\n\n`int ---- j,k,l;`\n\n`char----c,ch;`\n\
  \n`float---- f, salary;`\n\n`double--- d;`\n\n这些每一个缩写都指示编译器创建具有这些名称的该类型变量。可以通过等号指定一个值来为变量分配初始值。例如：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint. main ()\nint j=10;\n\
  int k=5;\nint l=j+k\n{\ncout <<l>> endl;\nreturn 0\n}\n```\n\n你应该能得到答案 15。\n\n你也可以在程序中声明并定义变量，但那是更高级的内容，所以如果你想了解，可以在\
  \ Google 上搜索这方面的教程。\n\n## 测验\n\n这是设置。你应该有一个短语、一个数学题，然后使用上述整数给出数学题的答案。你可以自己编写所有的变量，随你想让它们变成什么样。\n\
  \n```cpp\n#using <header>\nusing namespace std;\n\nint main ()\nint _=_\nint _=_\n\
  int _=_+_\n{\ncout < “”;> /n\n< “”;> /n\ncout  < “int_”;> /n\nreturn 0\n}\n```\n\
  \n只需输入你的数字并确保你的数字相加正确。完成后，在不依赖复制和粘贴不带数字代码的情况下重新运行代码。通过这种方式，你对变量有一个基础的理解，并在 C++ 中练习基本的整数运算。\n\
  \n# 第 4 章：数组、循环和条件\n\n信不否，你已经学了这么多。基础知识真的并不难，现在只需要学习更多事情，并将一个接一个的概念结合起来，以确保你正在成为一名更好的\
  \ C++ 程序员。让我们继续吧。\n\n## 数组\n\n数组是 C++ 中的一种数据结构，能够存储基本相同类型且大小固定的元素。基本上是同类型变量的集合。与其使用单个变量，你会声明一个如数字之类的变量数组。要做到这一点，你使用\
  \ 0 到 99 的数字，并通过数组的索引访问每一个数字。\n\n数组将是连续的内存位置。最低的总是第一个元素，然后最高的元素将是最后一个元素。\n\n## 初始化数组\n\
  \n你可以逐个初始化数组，也可以使用单条语句。例如：\n\n`double balance [5]= {1000.0, 2.0, 3.4, 17.0, 50.0};`\n\
  \n括号之间找到数字不能高于你使用的元素数量。这意味着当你的数组标题只指定了五个时，你不能有六组数字。然而，如果你不指定大小，就会创建一个大小恰合适的数组。你按照如下方式输入：\n\
  \n`double balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};`\n\n这创建了与上例完全相同的数组，只是你没有指定数组大小，所以它为你创建了。非常巧妙。\n\
  \n现在你已经知道如何编写数组，是时候将它放入实际程序中了。这个程序比之前的稍微高级一点，包含更多元素。你可以在 www.compileonline.com 上查找这些元素。你将被引导到很多教程，甚至有一个\
  \ PDF 文件供你下载。\n\n这是你的程序分配数组的公式。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n#include <iomanip>\nusing std::setw;\n\nint main ()\n{\nint n[ 10 ];  //n\
  \ 是一个十个整数的数组\n// 将数组 n 的元素初始化为 0\nfor ( int i=0; I <10; i++)\n{\nn[i] =i+100; //\
  \ 将位置 I 元素设置为 i+ 100\n}\ncout << element << setw(13) << value<< endl:\n// 输出每个数组元素的值\n\
  for (int j=0; j<10; j++)\n{\ncout << setw(7)<< j << setw(13) <<n[j] << endl;\n}\n\
  return 0\n}\n```\n\n这个程序能够 `setw()` 函数来格式化输出。\n\n## 循环类型\n\n循环类型用于你想获取一种代码并反复执行它的时候。这些语句将一个接一个地执行。循环语句将更容易按照你想要的次数执行。\n\
  \n有四种类型的循环。这些循环处理不同的需求。\n\n### While 循环\n\nWhile 循环只要满足特定条件，就会继续循环。它会在每次重启循环时测试此条件，并一直持续到条件不再成立。\n\
  \n写法如下：\n\n```cpp\nwhile (condition)\n{\nstatement(s)\n}\n```\n\n### For 循环\n\n\
  此循环反复执行语句序列，同时缩短了管理循环变量的代码。\n\n写法如下：\n\n```cpp\nfor ( init; condition; increment)\n\
  {\nstatement(s)\n}\n```\n\n### Do.. while 循环\n\nDo…while 循环与 while 语句相似，但它会在到达语句结束时测试条件，而不是在开始。\n\
  \n写法如下：\n\n```cpp\ndo\n{\nstatement(s)\n}\nwhile (condition);\n```\n\n### 嵌套循环\n\
  \n嵌套循环将有一个在另一个循环内部工作的循环，创建一个连续的循环嵌套。这运行一段时间后可能会变得混乱。\n\n写法如下：\n\n```cpp\nwhile (condition)\n\
  {\nwhile (condition)\n{\nstatement(s)\n}\nstatement(s) // 你可以放更多语句\n}\n```\n\n##\
  \ 为什么这很重要\n\n最终你想扩展领域。我强烈建议进一步加强你的 C++ 基础知识，以确保精通并更好地理解更困难的任务。\n\n虽然这些对于某些人来说可能太高级或对另一些人太简单，但进行其他练习和教程来丰富你的编程技能总是好的。你可以在\
  \ www.compileonline.com 找到教程。无论如何强调，这个工具是多么重要的工具。\n\n# 第 5 章：在 C++ 中使用运算符\n\n\n\n\
  \n\n无论你计划使用哪种编程语言，学习如何使用运算符都是非常重要的。这些运算符将帮助你告诉程序你想做什么，并能让处理你自己的代码变得简单得多。在程序内部可以使用四种主要的运算符，它们每种都将以不同的方式告诉程序如何运行。在\
  \ C++ 语言中可以使用的一些运算符包括：\n\n- 逻辑运算符\n- 算术运算符\n- 赋值运算符\n- 关系运算符\n\n让我们来看看其中一些运算符是如何工作的，以及在编写\
  \ C++ 语言代码时如何让它们很好地发挥作用。\n\n## 逻辑运算符\n\n我们在本指南中将使用的第一种运算符是逻辑运算符。它们将帮助你比较输入到系统的某些部分。你可以使用的的一些逻辑运算符包括：\n\
  \n- `||`: 这被称为逻辑或（OR）。如果你的操作数中有一个不为零，条件就为真。\n- `&&`: 这被称为逻辑与（AND）。如果你有两个操作数且它们都不为零，你的条件就为真。\n\
  - `!`: 这是逻辑非（NOT）。你可以用它来反转操作数的状态。所以如果条件结果为假，这个符号将将其变为真。\n\n## 算术运算符\n\n你可以使用的另一种运算符是算术运算符。这些与在学校里学习数学几乎相同。你将告诉程序使用你提供的信息进行加法、减法和其他方程计算。你可以使用的一些术运算符包括：\n\
  \n- `+`: 这是加法运算符，它将你选择的两个操作数相加。\n- `-`: 这是减法运算符。它将取右侧操作数并将其从左侧操作数中减去。\n- `*`: 这是在\
  \ C++ 语言中进行乘法的运算符。\n- `/`: 这个运算符帮助你在 C++ 中进行除法。\n- `++`: 这是自增运算符。它将你的操作数的值增加一。\n\
  - `--`: 这是自减运算符。它将将操作数的值仅减少一。\n\n## 赋值运算符\n\n赋值运算符将帮助你更容易地为变量命名，并有助于搜索、保存等你正在编写的代码的不同部分。在\
  \ C++ 中可能使用的一些赋值运算符包括：\n\n- `=`: 这个运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧。\n- `+=`: 这种被称为加加赋值运算符。它将两个操作数的值相加，然后将和和赋值给左侧的操作数。\n\
  - `*=`: 这是乘乘赋值运算符。它将两个操作数相乘，然后将结果交给左侧的操作数。\n- `-=`: 这个运算符会将你右侧操作数的值从左侧减去，然后将此差值交给左侧操作数。\n\
  - `/=`: 这是除除赋值运算符。它将左侧的值除以右侧的值，然后将此结果赋值给左侧。\n\n还有其他一些赋值运算符，但它们更高级，所以我们只坚持这些基础运算符以帮助保持条不紊！\n\
  \n## 关系运算符\n\n在 C++ 语言中工作时，关系运算符会非常有帮助。你可以使用的一些包括：\n\n- `==`: 这个运算符将检查你的两个操作数的相等性。如果它们相等，条件将为真。\n\
  - `>`: 这个运算符将检查你操作数的值。如果左侧的操作数高于右侧，条件将为真。\n- `<`: 这个运算符基本上与上面相反。如果你发现左侧操作数的值大于右侧，条件将为真。\n\
  - `!=`: 这个运算符将检查你的两个操作数的相等性，如果值不相等，你的条件就为真。\n- `<=`: 这个运算符将检查左侧操作数是否小于或等于右侧操作数。如果符合这一标准，条件就为真。\n\
  - `>=`: 这个运算符将检查左侧操作数的值是否大于或等于右侧。如果为，条件就为真。\n\n## 第 6 章：帮助 C++ 做出决策\n\n有时，你需要程序为你做决策。你可以根据用户输入到计算机的信息以及你认为使条件为真需要满足的条件来设置让它以某种方式运行。在这个系统中，决策过程稍微高级一些，但你会发现它很容易学习，并且将开启你在\
  \ C++ 系统中可以使用的许多想法。让我们来看看你可以做什么来帮助系统自己做出决策。\n\n### Switch 语句\n\n我们在系统中内部要处理的第一个决策是\
  \ switch 语句。这些语句很好，因为它们允许你检查变量与一组值（或情况，cases）的相等性。你尝试检查的变量将与每个 case 进行比较。你可以使用的这种语法的好例子包括：\n\
  \n```\nSwitch(expression){\n  case constant-expression:\n    statement(s);\n   \
  \ break; //可选\n  case constant-expression:\n    statement(s);\n    break; //可选\n\
  \  //你可以根据需要添加尽可能多的这些 case 语句\n  Default: //可选\n    statement(s);\n}\n```\n\n在这些语句内部工作时，有一些规则你应该记在脑中。首先，switch\
  \ 语句的表达式应该是整数类型或枚举类类型。此外，它也可以属于一个具有转换函数的类。在 C++ 中，你向语法中添加的 case 语句数量没有限制，你可以根据需要让它们变长或变短。只需记住每个\
  \ case 中都需要一个冒号和一个值。\n\n一旦变量找到了与它相等的值，它将继续运行直到找到 `break` 语句。系统找到 `break` 语句后，switch\
  \ 就会停止。然后将传递控制流。你不需要在 cases 中放入 `break` 语句。如果你最终没有这些语句，控制流将继续传递下去。\n\n### if 语句\n\
  \n你在程序中可以做的最基础的事情之一就是创建一个 `if` 语句。这些基于系统内部的真和假概念。如果系统根据你设置的条件判断输入为真，那么程序将运行你要求执行的任何内容。例如，你设置系统判断\
  \ `2 + 2` 的答案是什么。如果用户输入的答案是 `4`，你可以弹出一个消息说“那是正确的！干得好！”\n\n每当用户输入的根据你设置的条件结果为真时，你就会看到你选出的语句。相反，如果用户输入了错误的答案会发生什么？如果他们对上面的问题的答案是\
  \ `5`，它将不对，系统将看到答案是假的。\n\n\n\n\n\n由于 `if` 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了\
  \ `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入系统的内容获取答案。\n\n### if else\
  \ 语句\n\n现在正如我们在上面稍微讨论的，在使用 `if` 语句时可能会出现一些局限性。如果用户输入了错误答案，屏幕将变为空白，这在系统操作中可能会很麻烦。此外，有时用户需要输入各种答案，例如当他们输入年龄时，而你想对这些年龄进行分类。他们的年龄并不一定是错误的，但如果你只想筛选大于\
  \ `21` 岁的人，你希望确保在过程中能够正确显示答案。\n\n用于处理 `if else` 语句的良好语法包括：\n\n```\nif(boolean_expresion)\n\
  {\n// 如果布尔表达式为真，将执行语句(s)\n}\nElse\n{\n// 如果布尔表达式为假，将执行语句(s)\n}\n```\n\n你可以根据需要在语句中添加尽可能多的此类语句。所以，如果你想有一个将人们分为五个不同年龄组的程序，你可以根据语法中更多的\
  \ `else` 来进行设置。这使得添加其他选项变得更加容易。\n\n所以让我们保持简单。假设你的系统中有 `2 + 2`。如果用户猜测答案是 `4`，你可以在第一部分将其设置为真值语句，然后屏幕上会显示“正确！干得好！”的消息。但如果用户输入的答案是\
  \ `5`（或除 `4` 以外的任何答案），你可以让屏幕上显示类似“抱歉，那不是正确的答案”的消息。\n\n这让你在处理代码内部想要执行的操作时拥有很大的自由度。你将能够在过程中添加一些不同的内容，并可以真正扩展你正在编写的代码。\n\
  \n在处理这些内容时，你可以记住的另外一点是，你可以在内部嵌套一些 `if` 语句和 `if else` 语句。对于初学者来说，这可能会有点复杂，但通过练习，你会发现它将为整个过程增加很多力量，并让你更容易在该编程语言中实现你想要的功能。\n\
  \n使用 `if` 语句和 `if else` 语句可以让你的编程体验变得好得多。它允许系统根据用户输入的内容来做出决策，而不是由你亲自在那里完成。请务必尝试这些不同类型的语句，看看它们在你的代码中以及你想要实现的功能中是如何工作的。\n\
  \n## 第 6 章：常量与各种字面量\n\n`if` 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了\
  \ `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入的内容获取答案。\n\n### if else\
  \ 语句\n\n现在正如我们在上面稍微讨论的，在使用 `if` 语句时可能会出现一些局限性。如果用户输入了错误答案，屏幕将变为空白，这在系统操作中可能会很麻烦。此外，有时用户需要输入各种答案，例如当他们输入年龄时，而你想对这些年龄进行分类。他们的年龄并不一定是错误的，但如果你只想筛选大于\
  \ `21` 岁的人，你希望确保在过程中能够正确显示答案。\n\n用于处理 `if else` 语句的良好语法包括：\n\n```\nif(boolean_expresion)\n\
  {\n// 如果布尔表达式为真，将执行语句(s)\n}\nElse\n{\n// 如果布尔表达式为假，将执行语句(s)\n}\n```\n\n你可以根据需要在语句中添加尽可能多的此类语句。所以，如果你想有一个将人们分为五个不同年龄组的程序，你可以根据语法中更多的\
  \ `else` 来进行设置。这使得添加其他选项变得更加容易。\n\n所以让我们保持简单。假设你的系统中有 `2 + 2`。如果用户猜测答案是 `4`，你可以在第一部分将其设置为真值语句，然后屏幕上会显示“正确！干得好！”的消息。但如果用户输入的答案是\
  \ `5`（或除 `4` 以外的任何答案），你可以让屏幕上显示类似“抱歉，那不是正确的答案”的消息。\n\n这让你在处理代码内部想要执行的操作时拥有很大的自由度。你将能够在过程中添加一些不同的内容，并可以真正扩展你正在编写的代码。\n\
  \n在处理这些内容时，你可以记住的另外一点是，你可以在内部嵌套一些 `if` 语句和 `if else` 语句。对于初学者来说，这可能会有点复杂，但通过练习，你会发现它将为整个过程增加很多力量，并让你更容易在该编程语言中实现你想要的功能。\n\
  \n使用 `if` 语句和 `if else` 语句可以让你的编程体验变得好得多。它允许系统根据用户输入的内容来做出决策，而不是由你亲自在那里完成。请务尝试尝试这些不同类型的语句，看看它们在你的代码中以及你想要实现的功能中是如何工作的。\n\
  \n### 常量与各种字面量\n\n`if` 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了 `4`\
  \ 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入的内容获取答案。\n\n### 浮点数字面量\n\n`if`\
  \ 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了 `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入的内容获取答案。\n\
  \n### 布尔值字面量\n\n`if` 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了 `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入的内容获取答案。\n\
  \n### 字符字面量\n\n`if` 语句非常基础，你会发现如果用户输入了错误答案，它将不会做出准备。在这个阶段，如果他们在上面的示例中输入了 `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种类型的语句将更深入，并向你展示如何根据用户输入的内容获取答案。\n\
