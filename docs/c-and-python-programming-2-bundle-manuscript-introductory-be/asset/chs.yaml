  \ `if`、`elif` 和 `else` 语句在本质上是线性的，其他条件语句则具有重复运行代码块的能力。“循环”是在程序运行过程中可以执行多次的条件语句，它们允许\
  \ Python 程序扩展功能。一个 `while` 循环就是这样的条件语句。\n\n```python\nanswer = 0\n\nwhile (answer\
  \ != 2):\n  answer = int(input(\"What is 4 / 2? \"))\nprint (\"Correct!\")\n```\n\
  \n只要指定的条件求值为真（true），`while` 代码块就会持续运行。我们可以通过上面的程序看到一个完美的例子。我们创建了一个新变量 `answer` 并反复将其与\
  \ `2` 进行比较。只要 `answer` 不等于 `2`，程序就会要求用户输入正确答案。输入 `2` 以外的内容只会循环回到 `while` 语句，再次提示输入正确答案。如果\
  \ `while` 最终求值为真（因为 `answer` 等于 `2`），则循环将终止，程序将通过打印“Correct”恢复运行。\n\n可以通过“嵌套”条件语句来进一步增强程序。单级缩进表示为我们的\
  \ `while` 语句预留的代码块，但我们可以使用第二层缩进来添加额外的比较。\n\n```python\nanswer = 0\n\nwhile (answer\
  \ != 2):\n  answer = int(input(\"What is 4 / 2? \"))\n  if (answer != 2):\n    \
  \  print (\"Incorrect...\")\nprint (\"Correct!\")\n```\n\n此程序使用“嵌套”函数将 `if` 语句包含在\
  \ `while` 语句中。这种方式获得的可能性几乎是无尽的。注意缩进层级决定了哪些代码块可以在哪些函数运行。每个预期的块（无论是 1 层还是 2 层缩进）都会在\
  \ `while` 循环激活时运行。这是一个很难掌握的概念，但它无疑增加了功能。\n\n另一个常见的循环是 `for` 循环。`For` 与 `while` 的不同在于，`for`\
  \ 循环遍历一组数字或一组值，而不是检查条件。\n\n```python\nfor user_variable in range (1, 5):\n    print\
  \ (user_variable)\n```\n\n`For` 接收指定的变量 `user_variable` 并使用提供的 `range`。变量将初始化为 `1`，并在每次函数循环时进行迭代。通过观察输出，我们可以看到它是如何工作的。\n\
  \n1\n2\n3\n4\n\n`User_variable` 被打印出来，然后增加到 `2`。它再次被打印并增加到 `3`。再一次针对 `4`。但它到达 `5`\
  \ 时停止了，这就是为什么 `5` 没有被打印出来。因为使用了关键字 `range`，`for` 循环将始终从第一个数字开始，在第二个数字停止。如果省略它，`for`\
  \ 循环将遍历给定的值。\n\n```python\nfor user_variable in (1, 5):\n    print (user_variable)\n\
  ```\n\n在 `For` 例子中，这里只省略了 `range`，但输出非常不同。\n\n1\n5\n\nPython 用第一个值 `1` 运行循环，然后用第二个值\
  \ `5` 运行。我们将学习到这样使用 `for` 循环对于列表（lists）、字典（dictionaries）和元组（tuples）特别有用。\n\n最后，可以使用\
  \ `break()` 函数打破循环。糟糕的编程习惯会导致无限循环，但包含 `break()` 作为保护可能会用户的计算机崩溃。\n\n### 示例程序 3 –\
  \ project3.py\n\n```python\nprint(\"Adding simulator\")\nprint(\"Type a number to\
  \ add to total, or type blank line to stop\")\nline = \"a\"\ntotal = 0\n\nwhile\
  \ (line != \"\"):\n    line = input(\"\")\n    if (line == \"\"):\n        break\n\
  \    total += int(line)\n    print (\"Total = {}\".format(total))\n```\n\n### 家庭作业\n\
  \n*   使用 if 语句编写一个程序显示文字冒险游戏。为玩家提供多个选项，他们可以通过输入进行选择。使用 while 循环检查用户输入的有效性。\n\n###\
  \ 关于变量更多\n\n列表（Lists）是另一个值得讨论的数据类型。列表是一个将值组合在单个变量中的数组。该单个变量可以用来调用它包含的任何一个“子变量”。它们主要用于组织和分组，并将并将相关的变量保持在相似的位置。列表变量通过初始化来创建。\n\
  \n```python\nstate = \"Texas\"\njack_info = [8, \"West Elementary\", state, \"A\"\
  ]\nprint (\"Jack goes to {} in {}.\".format(jack_info[1], jack_info[2]))\nprint\
  \ (\"He has a {} in math, even though he's only {}.\".format(jack_info[3], jack_info[0]))\n\
  ```\n\n列表 `jack_info` 包含四个值，因为我们在方括号之间指定了四个不同的条目。它们只是普通的值，例如整数 `8` 或变量 `state`，但由于被放置在列表中，它们为了共同的目的被组合在一起。所示，可以通过指定条目在方括号中的位置来访问列表项。计数从\
  \ 0 开始，因此 `jack_info` 的第一个条目是 `8`，`[3]` 中的条目是“A”。将其视觉化如下：\n\n| 条目编号: | 0 | 1 | 2\
  \ | 3 |\n| :--- | :--- | :--- | :--- | :--- |\n| 数据值: | 8 | “West Elementary” |\
  \ state | “A” |\n\n列表最初可以声明包含 3 个条目，其范围为 `0-2`。条目的数量几乎是无限的，仅限于计算机内存和程序员填充的变量数量。\n\
  \n列表的元素可以像单独的变量一样被编辑。如果 Jack 又大了一岁，我们只需要更新该条目。此外，向列表添加新条目不需要完全重新定义其中的每一个值。使用 `append()`，会在最后创建一个新条目。\n\
  \n```python\nstate = \"Texas\"\njack_info = [8, \"West Elementary\", state, \"A\"\
  ]\njack_info[0] = 9\njack_info.append(22)\nprint (\"Jack goes to {} in {}.\".format(jack_info[1],\
  \ jack_info[2]))\nprint (\"He has a {} in math, even though he's only {}.\".format(jack_info[3],\
  \ jack_info[0]))\nprint (\"Lucky number is {}\".format(jack_info[4]))\n```\n\n程序中的新添加项使列表发生了细微变化，现在有了一组新值。\n\
  \n| 条目编号: | 0 | 1 | 2 | 3 | 4 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n|\
  \ 数据值: | 9 | “West Elementary” | state | “A” | 22 |\n\n在继续之前，值得注意关于字符串（string）数据类型的更多特征。字符串实际上是包含字符值的列表。例如，取字符串“Hello,\
  \ World!”。将其拆分为列表，它看起来像这样：\n\n| 条目 | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | … |\n| :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 字符 | H | e\
  \ | l | l | o | , | | W | … |\n\n同样，可以从字符串列表中显示单个条目。\n\n```python\nprint (user_string[0])\
  \ # 会打印“H”\nprint (user_string[7:13]) #会打印“World!”\n```\n\n接下来，元组（tuples）是 Python\
  \ 中的另一种数据类型。它们通过圆括号而不是方括号来声明。元组实际上是静态列表，或不可编辑的列表。当程序员需要确保一组数据不会更改时，就会它们。\n\n```python\n\
  jim_grades = (99, 87, 100, 99, 77)\nprint (jim_grades[2])\n```\n\n注意元组中的条目仍然使用方括号访问。\n\
  \n字典（Dictionaries）将组织变量的概念推向了极端。和列表和元组一样，字典可以在单个变量中包含多个值。然而，区别在于，字典通过名称而不是数字来组织记录。通过这种方式，字典是某种意义上的“无序”列表，可以通过条目名称调用任何值。使用大括号声明字典，用逗号和冒号分隔值。\n\
  \n```python\npet_dict = {\"Total\": 2, \"Dog\": \"Scruffy\", \"Cat\": \"Meowzer\"\
  }\n```\n\n\n\n\n\n```python\nprint (\"I have {} pets, {} and {}\".format(pet_dict[\"\
  Total\"], pet_dict[\"Dog\"], pet_dict[\"Cat\"]))\n```\n\n在这里，字典 `pet_dict` 包含三个值：“Total”、“Dog”和“Cat”。这些条目是通过在引号内命名并提供值来声明的。通过指定条目的名称来调用这些条目，例如使用\
  \ `pet_dict[\"Dog\"]` 来访问存储的值。使用字典时可以获得前所未有的组织管理能力，因为它们的形式形式类似于数据库。同样，它们可以在程序的任何时间被更改、更新、删除或添加。\n\
  \n```python\nalbums = {\"Milkduds\": 2, \"Harold Gene\": 1, \"The 7750's\": 3}\n\
  \nalbums[\"Milkduds\"] += 1 #新专辑！\n\nalbums[\"The 7750's\"] = 2 #实际上只有 2 张\n\nalbums.update({\"\
  Diamond Dozens\": 1}) #发现了一个新乐队\n\ndel albums[\"Harold Gene\"] #卖掉了一个，不喜欢\n\nprint\
  \ (\"These are the number of albums I own:\")\n\nprint (albums)\n```\n\n上面的幽默示例是一个简单的字典，用于存储某人拥有的专辑数量。在开始时，字典中每个乐队都有固定数量的专辑，但第二行显示收藏者获得了一张新的\
  \ Milkduds 专辑。该行还使用了一种新的代码快捷。每当使用 `+=` 时，代码会被展开为 `albums[\"Milkduds\"] = albums[\"\
  Milkduds\"] + 1`，但在程序中使用这种简写可以节省大量的时间和空间。第三行，收藏者意识到他们只有 2 张 7750 的专辑，因此命令完全更改了该条目的值。接下来引入了\
  \ `update()` 方法，它展示了如何向字典添加一个完全新的条目。遗憾的是，Harold Gene 从字典中删除了，因为收藏者卖掉了那张专辑。最后，通过不指定任何条目就可以打印整个字典。\n\
  \n这是一个有趣的例子，上面的程序实际上展示了字典在收集和存储数据方面是多么通用。将它们包含在程序中，以一种易于调用的方式将变量分组。\n\n### 示例程序\
  \ 4 – project4.py\n\n```python\nkeep_going = \"a\" # 在变量使用前初始化\n\nnumber_grades\
  \ = 0\n\ngrade_list = []\n\ntotal = 0\n\nprint(\"平均分计算器\")\n\nprint()\n\nwhile (keep_going\
  \ != \"No\" and keep_going != \"no\"):\n\n    grade = int(input(\"输入测试成绩: \"))\n\
  \    number_grades += 1\n    grade_list.append(grade)\n    keep_going = input(\"\
  还要更多成绩吗？ \")\n\nprint()\n\nfor x in range (0, number_grades):\n    total += grade_list[x]\
  \ #累加列表中的所有成绩\n\nprint (\"{} 次测试的平均分是 {}\".format(number_grades, total / number_grades))\n\
  ```\n\n### 业程序：\n\n* 编写更多数学函数的代码，例如中位数和众数。\n\n### 函数\n\n到为止使用的每个函数都是 Python 内置的，由\
  \ Python 开发者编写的。函数实际上是代码快捷方式，因为函数是代码的压缩版本，它们接收数据作为参数，在后台运行较长的块，然后返回结果。使用函数是为了在执行常见的重复任务时节省时间和代码。Python\
  \ 保留了程序员编写自定义函数的能力，其写法如下：\n\n```python\ndef happy(name):\n    print (\"Happy birthday\
  \ to you. \" * 2)\n    print (\"Happy birthday dear {}.\".format(name))\n    print\
  \ (\"Happy birthday to you.\")\n```\n\n`def` 关键字表示用户定义函数的声明，紧随其后的是函数名；我们创建了函数 `happy()`。括号内是我们的函数将接收的值（只有一个，名为\
  \ `name` 的变量）。就像 `print()` 必须有一个值一样，我们的 `happy()` 也需要一个。然后，与函数相关的代码被缩进。我们的代码只是运行了一首生日歌，并在歌曲中提供了变量\
  \ `name`。这个函数声明位于我们 Python 程序的顶部，但它在程序启动时并不会运行。要调用它，我们需要在代码中特意地引用该函数。\n\n```python\n\
  happy(\"Dana\")\n```\n\n这里发生了一些有趣的事情。我们通过传递“Dana”作为值来调用 `happy()`。“Dana”被赋值给 `name`，函数开始运行。然而，变量\
  \ `name` 在用户定义函数外部不存在，任何调用它的尝试都会导致错误。这是因为变量有作用域（scopes），即它们可以访问的区域。`Name` 有一个特定于函数的变量作用域，因此它永远不会在外部被调用。同样，主程序中声明的任何变量都不能被用户定义函数直接访问，必须在调用函数时作为参数传递。跟随下一个练习查看一个用户定义函数（UDF）的示例。\n\
  \n```python\ndef intdiv(num_one, num_two):\n    whole_answer = num_one // num_two\n\
  \    remainder = num_one % num_two\n    print(\"{} / {} = {} {}\".format(whole_answer,\
  \ remainder))\n```\n*(注：原文中 `intdiv` 的文本高度碎片化/混乱，我已根据上下文重构了逻辑流)。*\n\n\n\n\n\n###\
  \ 类 (Classes)\n\n类是 Python 的一个特性，使其更接近某些更复杂的编程语言。从本质上说，它们是“程序程序”，因为你可以在一个中放入许多功能。此外，使用类进行组织是一种良好的编程习惯。像\
  \ Python 这样面向对象的语言偶尔会通过这些概念展示其面向对象的根源，而对象以 `object.attribute` 的形式包含属性。请看下面的示例以理解。\n\
  \n```python\nclass student:\n    def __init__(self, name, grade):\n        self.name\
  \ = name\n        self.grade = grade\n        self.gpa = 0.0\n```\n\n我们创建的类被称为 `student`，`student`\
  \ 包含了它自己的变量。类提供了一种组织对象并赋予它们个人属性的方法。因此，与其拥有 `student1_name`、`student1_grade`、`student2_grade`\
  \ 等不同变量，可以通过属于一个类来合并它们。在程序中，类声明位于最顶端。就像 UDF（用户自定义函数）一样，在被调用之前，它实际上不会在主程序中运行。\n\n\
  ```python\nstudent1 = student(\"Tim\", \"Freshman\") #object is student1, an attribute\
  \ is “name”.\n```\n\n我们新声明的 `student` 类用于创建具有属性 `Tim` 和 `Freshman` 的 `student1`\
  \ 对象。这在以前需要两行，但使用类后大大简化了。类将对象的相关变量隔离开，使得每个声明的 `student` 都拥有 `name`、`grade` 和 `gpa`\
  \ 这三个属性。我们类声明的第二行包含 `__init__`，这是一个“方法”（用户定义函数），它在创建 `student` 类中的对象时运行。`__init__`\
  \ 的参数是创建该对象时所需的参数。`self` 实际上并不是参数，它只是指向 `student`，但 `name` 和 `grade` 是需要的，这就是为什么我们在创建\
  \ `student1` 时包含了它们。`student1` 的属性可以这样调用：\n\n```python\nprint (student1.name)\n\
  ```\n\n这将简单地打印 `Tim`。我们在初始化 `student1` 时没有声明 GPA 变量，因此我们可以通过赋值语句来完成。\n\n```python\n\
  student1.gpa = 4.0\n```\n\n或者更改已存在的属性。\n\n```python\nstudent1.grade = “Sophomore”\n\
  ```\n\n如果我们创建另一个对象，它将拥有一组与 `student1` 完全不同的属性。\n\n```python\nstudent2 = student(\"\
  Mary\", \"Senior\")\n```\n\n其中 `student1.grade` 与 `student2.grade` 不同，尽管它们共享相同的变量名。对于具有多个重复变量的大型项目，类可以减少代码混乱和需要跟踪的变量数量。\n\
  \n回看我们自定义的类，我们可以扩展它以在类内部实现用户自定义函数。\n\n```python\nclass student:\n    def __init__(self,\
  \ name, grade):\n        self.name = name\n        self.grade = grade\n        self.gpa\
  \ = 0.0\n    def record(self):\n        return \"Student {} is a {} with a {}\"\
  .format(self.name, self.grade, self.gpa)\n\nstudent3 = student(\"Lily\", \"Junior\"\
  )\nstudent3.gpa = 3.67\n\nprint (student3.record())\n```\n\n`__init__` 保持不变，但我们添加了一个名为\
  \ `record` 的 UDF 定义。它传递了参数 `self`（因为它必须引用该类）并返回一个格式化字符串。在我们的实际主程序中心创建了 `student3`。最后，我们通过\
  \ `student3.record()` (`object.function`) 调用 UDF。它返回了我们的格式化字符串，因此被 `print()` 出来。\n\
  \n### 特殊方法 (Special Methods)\n\n`__init__` 方法实际上是 UDF 的一种。然而，被双下划线围绕的方法是 Python\
  \ 中的特殊方法，这意味着它们会在某些时间自动运行。`__init__` 也是一种特殊方法，专门称为“构造方法”。构造方法在每次创建对象时都会被调用，这就是为什么我们将变量声明放在里面。当创建\
  \ `student3` 时，`student3.name`、`student3.grade` 和 `student3.gpa` 也随之创建。因此，任何放在 `__init__`\
  \ 块中的代码会在第一次创建对象时被激活。\n\n其他特殊方法也，它们在不同的事件上被调用：\n\n- `__del__` - 每当对象被删除 (`del`)\
  \ 时被调用。也称为析构方法。\n- `__str__` - 当对象作为字符串传递时被调用\n- `__setattr__` - 每当属性被设置值时都会运行\n\
  - `__delattr__` - 与 `setattr` 相同，但仅在属性被删除时运行\n\n添加这些特殊方法可以看到它们运行的时机。\n\n```python\n\
  class student:\n    def __init__(self, name, grade):\n        self.name = name\n\
  \        self.grade = grade\n        self.gpa = 0.0\n    def __str__(self):\n  \
  \      return \"{}\".format(self.name)\n    def record(self):\n        return \"\
  Student {} is a {} with a {}\".format(self.name, self.grade, self.gpa)\n\nstudent4\
  \ = student(\"Barry\", \"Professor\")\n\nprint (student4)\n```\n\n当 `student4` 被打印（作为字符串引用）时，`__str__`\
  \ 特殊方法接管并返回对象的 `name` 属性。如果这里没有这个特殊方法，我们就无法通过引用对象获得预期的输出。\n\n最后，类之所以有用是因为我们可以在它们内部创建“类变量”。`Name`\
  \ 和 `GPA` 是特定于每个声明对象的属性变量，但也可以有由所有对象共享的类变量。例如，这个程序将使用类变量来跟踪对象的总数。\n\n```python\n\
  class food:\n    total_foods = 0\n    def __init__(self, name):\n        self.name\
  \ = name\n        self.calories = 0\n        self.foodgroup = \"\"\n        food.total_foods\
  \ += 1\n    def __del__(self):\n        food.total_foods -= 1\n    def __str__(self):\n\
  \        return \"{}\".format(self.name)\n    def get_total():\n        return food.total_foods\n\
  \    def record(self):\n        return \"Food {0} is a {2} with {1} calories.\"\
  .format(self.name, self.calories, self.foodgroup)\n\nfood1 = food(\"Carrot Stew\"\
  )\nfood1.calories = 210\nfood1.foodgroup = \"Vegetables\"\nfood2 = food(\"Buttered\
  \ Toast\")\nfood2.calories = 100\nfood2.foodgroup = \"Grains\"\n\nprint (food.get_total())\n\
  del food2\nprint (food.get_total())\n```\n\n当程序创建一个 `food` 时，`total_foods` 加 1。然后删除一个\
  \ food 对象，所以减 1。控制台打印 2，然后是 1，显示了我们如何调用 UDF 来检查类变量。跟踪某物的数量是类变量的常见用途，但它们对其他情况也有用。\n\
  \n### 示例程序 6 – project6.py\n\n```python\nclass house:\n    def __init__(self, name,\
  \ bedrooms, bathrooms, cost):\n        self.name = name\n        self.bedrooms =\
  \ bedrooms\n        self.bathrooms = bathrooms\n        self.cost = cost\n     \
  \   print(\"House for sale!\")\n    def __del__(self):\n        print(\"House off\
  \ the market.\")\n\nprint(\"House for sale:\")\nuser_input = input(\"What is the\
  \ address of the house? \")\nuser_input2 = int(input(\"How many bedrooms? \"))\n\
  user_input3 = int(input(\"How many bathrooms? \"))\nuser_input4 = int(input(\"How\
  \ much does it cost? \"))\n\nhouse1 = house(user_input, user_input2, user_input3,\
  \ user_input4)\nprint(\"Looking for buyers...\")\nfor x in range (0, house1.cost):\n\
  \    x += 1 #wait a while\nprint(\"Sold!\")\ndel house1\n```\n\n### 继承 (Inheritance)\n\
  \n在你更健壮和扩展的程序中，你可能会使用多个相关的类。例如，思考一个必须对网络分类设备的程序。每个设备类型（台式电脑、笔记本电脑、手机等）都有自己的类，但你最终会重复一些常用的属性。台式电脑和笔记本电脑都有名称、部门和\
  \ IP 地址，但它们还有一些特定的不同变量，例如笔记本电脑的 Wi-Fi 和台式电脑的显卡。\n\n### 作业程序\n\n*   使用类创建一个数据库组织程序。用户应该能够创建类的条目并设置变量，并随时查看它们。\n\
  \n\n\n\n\n通过一种名为“继承”的过程，类可以建立父/子关系，其中某些父类属性可以被子类“继承”。在类之间有效地共享属性可以实现更优优的组织结构，并减少整体代码量。\n\
  \n```python\nclass device:\n    total_devices = 0\n    def __init__(self, name,\
  \ owner):\n        self.name = name\n        self.owner = owner\n        device.total_devices\
  \ += 1\n    def __del__(self):\n        device.total_devices -= 1\n    def __str__(self):\n\
  \        return \"{}\".format(self.name)\n    def get_total():\n        return device.total_devices\n\
  class laptop(device):\n    def __init__(self, name, owner, wifi):\n        device.__init__(self,\
  \ name, owner)\n        self.wifi = wifi\n    def __str__(self):\n        return\
  \ \"{} is owned by {} and connected to {}\".format(self.name, self.owner, self.wifi)\n\
  class cellular(device):\n    def __init__(self, name, owner, connection, BYOD):\n\
  \        device.__init__(self, name, owner)\n        self.connection = connection\n\
  \        self.BYOD = BYOD\n    def __str__(self):\n        return \"{} is owned\
  \ by {} and it uses {}. BYOD? {}\".format(self.name, self.owner, self.connection,\
  \ self.BYOD)\ndevice1 = laptop(\"STAFF12\", \"IT\", \"Staff-wifi\")\ndevice2 = cellular(\"\
  Jack's-iDevice\", \"Jack\", \"4G LTE\", \"yes\")\nprint (device1)\nprint (device2)\n\
  print (device.get_total())\n```\n\n在这个程序中，父类 `device` 包含了 2 个属性——`name` 和 `owner`。其他类\
  \ `laptop` 和 `cellular` 也包含 `name` 和 `owner` 属性，因此我们设置它们从父类继承这些属性。要建立类之间的父/子关系，子类必须在声明中将父类作为参数传递。这就是为什么使用\
  \ `class cellular(device)` 的原因，因为我们设置 `cellular` 链接到 `device`。\n\n其次，我们在每个子类的构造方法内部显式地调用了\
  \ `device` 构造方法。这样做之后，子类实际上运行了整个父类构造方法。`name` 和 `owner` 是通过这种获得的，`total_devices\
  \ += 1` 这一行也被传递了。\n\n两个子类都包含一个 `__str__` 方法，尽管父类也有一个。通过一种名为“重写”（overwriting）的过程，如果调用了父类和子类共同存在的特殊方法，则只有子类方法会运行。如果子类中没有调用的方法，则运行父类的方法。这就是为什么将\
  \ `laptop` 对象作为字符串引用会显示笔记本信息，但删除 `laptop` 对象时将退回到父类并运行其析构方法。\n\n理解继承如何工作可以为你的应用程序提供前所未有的组织结构和组合。大多数高级和进阶程序都利用类及其属性来快速为数据库工具等许多应用程序构建框架，因此学习它们无疑会提高你的\
  \ Python 技能。\n\n### 示例程序 7 – project7.py\n\n```python\nclass house:\n    def __init__(self,\
  \ name, bedrooms, bathrooms):\n        self.name = name\n        self.bedrooms =\
  \ bedrooms\n        self.bathrooms = bathrooms\n        self.cost = 0\n        print(\"\
  Living space for sale!\")\n    def __del__(self):\n        print(\"Living space\
  \ off the market.\")\nclass apartment(house):\n    def __init__(self, name, bedrooms,\
  \ bathrooms):\n        house.__init__(self, name, bedrooms, bathrooms)\n       \
  \ self.montly_payment = 0\nforsale1 = apartment(\"100 Col. Ave\", 2, 2)\nforsale1.montly_payment\
  \ = 250\n```\n\n**作业程序：**\n* 扩展上一章中可选创建的数据库程序，包含继承功能。\n\n### 模块\n\n我们目前为止使用的每个功能都是\
  \ Python 内置的。Python 是一门功能丰富的语言，但可以通过模块轻松地向 Python 添加额外功能。熟悉 C 语言可以将模块与“h”文件和预处理器语句联系起来。模块的作用非常相似，它们被包含是为了为\
  \ Python 添加新的函数和命令。\n\n要添加新模块，我们只需要在程序的顶部包含一条语句。\n\n```python\nimport math\nprint\
  \ (math.sin(3))\nanswer = math.sqrt(16)\nprint (answer)\nprint (math.gcd(100, 125))\n\
  ```\n\n特别地，`sqrt()`、`sin()` 和 `gcd()` 是你在上面看到的三个例子。每个模块都有定义的用途，而 `math` 的作用是提供高级数学函数。这里是最重要的函数列表。\n\
  \n* `math.sqrt()` – 数字的平方根\n* `math.sin()` – 数字的正弦\n* `math.cos()` – 数字的余弦\n* `math.tan()`\
  \ – 数字的正切\n* `math.log()` – 两个参数，对数和底\n* `math.pi` – 3.14159\n* `math.e` – 2.71828\n\
  \n需要使用上面那些复杂函数的人只需要在程序顶部 `import math` 即可。\n\n其他其他专门的模块，例如 `datetime`。Datetime 是一个提供计时函数的模块。\n\
  \n```python\nimport datetime\ncurrent_time = datetime.datetime.now()\nprint (current_time.hour)\n\
  print (current_time.minute)\nprint (current_time.second)\n```\n\n通过 `datetime` 提供的其他函数包括：\n\
  * `year`\n* `month`\n* `day`\n\n或者 `os`，一个用于解锁操作系统功能以修改文件的模块。这里有一个创建一个新文件夹然后将其设置为活动目录的小程序。\n\
  \n```python\nimport os\nos.mkdir(\"folder\") #创建文件夹\nos.chdir(\"folder\") #进入文件夹\n\
  os.chdir(\"..\") #返回上级目录\n\n`os` 可用的更多函数列举如下。\n\n* `os.rmdir()` – 删除指定的文件夹\n* `os.remove()`\
  \ – 删除指定的文件\n* `os.path.exists()` – 检查文件是否存在\n* `os.rename()` – 将指定的文件重命名为第二个参数\n\
  \n还有许多非常有用的模块，例如 `random`、`statistics` 和 `pip`，它们可以为你的应用程序提供以前不可能的功能。Python 还支持下载和使用用户创建的模块，但这是一个此处未涵盖的高概念。\n\
  \n### 示例程序 8 – project8.py\n\n```python\nimport random\nprint (\"Fortune telling...\"\
  )\nrng = random.randrange(1, 7)\nif (rng == 1):\n    print(\"你很快就会发财了.\")\nelif\
  \ (rng == 2):\n    print(\"考虑买点股票.\")\nelif (rng == 3):\n    print(\"过路前先看左右.\"\
  )\nelif (rng == 4):\n    print(\"给你的亲戚打电话...\")\nelif (rng == 5):\n    print(\"\
  你会收到一个电话.\")\nelse:\n    print(\"未来多云……再试一次.\")\n```\n\n**作业项目：**\n* 创建一个“采样”程序，展示各种模块功能。\n\
  \n### 常见错误\n\n由于许多程序员选择 Python 作为他们学习的第一门语言，他们往往会陷入一些常见的错误中。如果你的应用程序运行不正常，或者你正在寻找一些最佳编程实践，本节将对你有帮助。当代码通过\
  \ Python 运行时，它可能会停止并向你返回错误。通过阅读错误，你可以学习错误来自哪一行，通常 Python 会指向 (^) 错误的精确字符。利用提供给你的信息来理解你的错误并纠正情况。\n\
  \n未指定正确的参数是新手的常见错误。在函数括号之间填写值时，你必须注意它期望什么类型的数据。某些函数只需要整数，而有些则有 2 个或更多参数。如果有疑问，请查阅你正在处理的特定函数的\
  \ Python 文档。高级 IDE（如 `Atom` 和 `Eclipse`）通常被设计为在你输入函数时显示示例参数列表，你可以跟随示例来了解每个参数期望什么。\n\
  \n\n\n\n有时我们忘记了将用户输入转换为整数。如果我们正在提示用户输入数值，我们必须用 `int()` 或 `float()` 包裹 `input()`。如果不这样做，`input`\
  \ 的内容将作为字符串传递，这可能会导致返回错误。\n\n在比较两个值时，Python 要求程序员使用双等号（`==`）。在赋值值时，你必须使用单等号（`=`）。在任何情况下使用不恰的符号都将导致语法错误。\n\
  \n在每个比较语句和循环（如 `if`、`elif`、`else`、`for`、`while`、`def` 和 `class`）之后都有冒号（`:`）。这个冒号表示下一行应该缩进，因此所有缩进的行都属于函数的作用范围。未放置冒号将返回语法错误。\n\
  \n字符串和函数通常由一对字符包围。函数使用括号，而字符串使用引号来指示它们的边界。如果你忘记提供结束字符，Python 肯定会返回错误。\n\n学者经常会尝试使用\
  \ Python 默认不包含的函数，而没有包含正确的模块。在普通的 Python 中，无法调用高级数学函数或编辑文件目录。务必将将要用模块的 `import`\
  \ 命令放在程序顶部，否则应用程序将无法运行。\n\nPython 中缩进是必不可少的。来自其他编程语言的人可能会忘记这一点，并按照自己的风格进行缩进。这将破坏几乎所有的\
  \ Python 程序，因为解释器期望特定的格式标准。每当缩进错误就会返回错误。请密切关注你的缩进级别，否则你的程序可能会出现逻辑和语法错误。\n\n编程语言始终要求完美的语法。因此，即使是拼写错误对我们的应用程序也可能是灾难性的。除了缩进问题和拼写错误，给出错误的变量名或意外调用错误的函数可能会导致你的程序完全失败或运行异常。编写代码时，反复检查你的脚本，以确保没有字符出错。在每次实现后测试代码，这样当发生错误时，你就知道它是来自新添加的内容。有时代码中存在错误或漏洞，在检查代码后无法纠正。此时，程序员必须通过逐行跟踪代码来“调试”其代码，“追踪”解释器运行程序时采取的路径。某些\
  \ IDE 具有调试工具，例如“断点”或“行停止”，它们允许你点击按钮运行每一行。像这样缓慢地运行程序大多数时候可以揭示问题的源，但需要敏锐的眼光和专注的问题解决者来修复代码。\n\
  \n许多程序员认为没有必要，但为脚本编写注释是编码中不可或缺的一部分。这样做是一个极其常见的初学者错误，许多初次编程的人都会陷进去。一旦你掌握了 Python\
  \ 艺术并在与其他程序员一起工作的公司进行编程，可能会有多个人处理同一个脚本。即使是最整洁的代码第一次看也是令人困惑的，但注释有助于揭开复杂字符的神秘面。此外，回到你几周前的旧脚本可能感觉像在读外外语——注释能帮助你快速回到编码状态。许多程序员会在程序的第一行添加注释，简要描述脚本的功能、编写时间以及任何贡献者。这样，当你下一次快速浏览文件寻找某个特定程序时，注释可以帮助你在不实际运行或解码代码的情况下了解其内部内容。\n\
  \nPython 新手中泛滥的最后一个常见错误是变量命名。如果在你的实验中尚未发现，那么某些名称是你不能用作变量名的。诸如 `class`、`break`、`print`、`and`、`or`、`while`\
  \ 等“保留”字是不能用作变量名的关键字。如果 Python 检测到它们的使用，将发生语法错误。除了错误之外，程序员在命名变量时经常也使用不当的形式。避免模糊且简单的变量名，如“number”或\
  \ `var1`，而要使用描述性的名称，如 `user_input` 或 `totalNumberOfDogs`。这些变量一眼就能解释它们的用途，因此冗长的程序员永远不会误用变量，也不需要检查它的意图。Python\
  \ 程序员通常使用下划线法来命名变量（`grade_average`、`dog_1`），但 `camelCase` 也是接受的（`userInput`、`multAnswer`）。无论使用哪种方法，练的程序员总是会让名称具有描述性。\n\
