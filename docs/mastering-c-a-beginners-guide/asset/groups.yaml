    # LINQ


    Language-Integrated Query (LINQ) is the name for a set of technologies based on
    the integration of query capabilities directly into the C# language. LINQ provides
    a consistent query experience for objects (LINQ to Objects), relational databases
    (LINQ to SQL), and XML (LINQ to XML).'
  - '[PAGE 261]


    # Advantages of LINQ Include the Following:


    +   - It gives syntax highlighting and IntelliSense as LINQ is incorporated into
    C# language. These characteristics make it easier to produce accurate queries
    and to find mistakes at design time.

    +   - Because LINQ queries are integrated into the C# language, you can write
    code much faster than if you were writing old-style queries.

    +   - The integration of queries into the C# language also makes it easy to step
    through your queries with the integrated debugger.

    +   - The hierarchical feature of LINQ allows you to easily see the relationship
    between tables, thereby making it easy to compose queries that join multiple tables
    quickly.

    +   - The unitive foundation of LINQ allows you to use a single LINQ syntax when
    querying multiple data sources. This will enable you to get up to speed on new
    technologies much more quickly.

    +   - Because LINQ is extensible, you can use your knowledge of LINQ to make new
    types of data sources queriable.

    +   - After creating or discovering a new LINQ provider, you can leverage your
    knowledge of LINQ to quickly understand how to write queries against these new
    data sources.'
  - '[PAGE 262]


    +   - Because LINQ is composable, you can quickly join multiple data sources in
    a single query or a series of related queries.

    +   - The transformational features of LINQ make it easy to convert data of one
    type into a second type. For instance, you can quickly transform SQL data into
    XML data using LINQ.

    +   - LINQ extends the language by the addition of query expressions, which are
    similar to SQL statements. LINQ query expressions can be used to extract conveniently
    and process data from arrays, enumerable classes, XML documents, relational databases,
    and third-party data sources.

    +   - Query expressions can be used to query and transform data from any LINQ-enabled
    data source.


