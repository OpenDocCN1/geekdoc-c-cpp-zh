    }\n```\n\n从上面的代码可以看出，必要的方法和属性通过 public 访问修饰符公开，不必要的方法和属性通过 private 访问修饰符隐藏。这样，我们就能在代码或\
    \ Web 应用中实现抽象。\n\n## 继承\n\n继承是一种利用已定义的类来创建新类的方式。新形成的类称为派生类；被继承的类称为基类。继承的重要优点是代码复用和降低程序的复杂度。派生类（子类）可以重写或扩展基类（父类）的功能。下面举例说明：\n\
    \n```csharp\nusing System;\npublic class Being\n{\n    public Being()\n    {\n\
    \        Console.WriteLine(\"Being is created\");\n    }\n}\n\npublic class Human:\
