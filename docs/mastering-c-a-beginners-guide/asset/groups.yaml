    # C# Constraint


    We used a placeholder T in the above examples, and this placeholder can be of
    any type. In C#, we can also constrain the type of placeholder using the where
    keyword. Suppose we have defined a class as:


    ```

    class ClassName<T> where T: class

    ```


    In this case, T can only be a reference type like class, string, etc. If we try
    with something else, we will get an error. Here, class in where T: class means
    T/can be a reference type. Let’s look at the table given below for another type
    of constraint.


