    # Short Overview of DLR


    So now have understood how the dynamic type works, let’s discuss what’s behind
    the curtains a little.


    DLR or Dynamic Language Runtime makes dynamic Type easy to use in a C#, statically
    typed language. DLR attaches a set of services to the CLR that do dynamic work.


    As we can see, the services DLR included in the already existing functionalities
    of CLR include Call Site Caching, Expression Trees, and Dynamic Object Interoperability.


    # Call Ste Caching


    DLR provides a way to cache previously called operations to achieve maximum efficiency
    in operation execution. A dynamic call site is where you may use the a.b() and
    a+b functions on dynamic objects. DLR caches the types of objects used while executing
    these operations and stores'
  - '[PAGE 302]


    them in a cache. If a similar operation is performed once more, DLR can retrieve
    the information from that cache.


    # Expression Trees


    Expression trees constitute code in a tree-like data structure, where each node
    is an expression, for example, a method call or a binary operation. DLR has extended
    LINQ expression trees with assignment, control flow, and other language-modeling
    nodes.


    # Dynamic Object Interoperability


    To earn operability with different languages and enable authors to implement dynamic
    libraries, DLR gives a set of classes and interfaces used for this purpose: IDynamicMetaObjectProvider,
    ExpandoObject DynamicMetaObject, and DynamicObject.


    The advantages of DLR are:


    +   - Simplified portability of dynamic languages to .NET.

    +   - Allow dynamic features in static languages.

    +   - Enhanced sharing of libraries and communication between static and dynamic
    languages.

    +   - Fast dispatch and invocation (using caching).


    In conclusion, DLR makes the dynamic type work as we know it, and we wouldn’t
    be able to use dynamic Type without it and the mechanisms it renders.


