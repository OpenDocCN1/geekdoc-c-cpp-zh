  md: "\nEncapsulation is achieved by utilizing access specifiers. An access specifier\
    \ determines the scope and visibility of a class member. Available access specifiers\
    \ are public, protected, private, and internal.\n\n### How to Achieve Encapsulation\n\
    \nWe can achieve encapsulation by using a private access modifier, as shown in\
    \ the below example method.\n\n```csharp\nprivate string GetEngineMakeFormula()\n\
    {\n    private string formula = \"a*b\";\n    return formula;\n}\n```\n\n### Example—Encapsulation\n\
    \n```csharp\npublic class Car\n{\n    public int mileage = 65;\n    public string\
    \ color = \"Black\";\n    private string formula = \"a*b\";\n\n    //Its public\
    \ - so accessible outside class\n    public int GetMileage()\n    {\n        return\
    \ mileage;\n    }\n    //Its public - so accessible outside class\n    public\
    \ string GetColor()\n    {\n```\n\n## Abstract Classes\n\nIn C#, abstraction is\
    \ achieved with the help of Abstract classes. An abstract class is declared with\
    \ the help of an abstract keyword.\n\nIn C#, you are not permitted to create objects\
    \ of the abstract class. Or in other words, you cannot use the abstract class\
    \ directly with the new operator.\n\nClass that includes the abstract keyword\
    \ with some of its methods (not all abstract methods) is known as an Abstract\
    \ Base Class. While a class that includes the abstract keyword with all of its\
    \ methods is known as pure Abstract Base Class.\n\nYou are not allowed to declare\
    \ the abstract methods outside the abstract class. You are not allowed to declare\
    \ an abstract class as a sealed class.\n\nFor example, we continue with “Car”\
    \ as an example, and we have no access to the piston directly and use the start\
    \ button to run the piston. Just imagine if a Car manufacturer allows direct access\
