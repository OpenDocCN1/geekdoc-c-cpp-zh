    \n.NET 的 `Nullable<T>` 类型施加了此约束。此类型存在的唯一原因是为原本无法保存空值的类型提供可空性。因此，只对值类型使用它才有意义——引用类型变量已经可以在不需要此包装器的情况下设置为\
    \ null。值类型约束阻止你对不必要的类型使用 `Nullable<T>`。\n\n## 值类型和非托管约束\n\n你也可以指定 `unmanaged`\
    \ 作为约束，这要求类型参数为值类型，并且不包含引用。这不仅意味着该类型的所有字段都必须是值类型，而且每个字段的类型也必须只包含值类型字段，依此类推。在实践中，这意味着所有实际数据必须是固定集合的内置类型之一或枚举类型。这主要是因为符合\
    \ `unmanaged` 约束的类型可以安全高效地传递给非托管代码。\n\n## notnull 约束\n\nC# 8.0 引入了一种新的约束类型 `notnull`，如果启用可空引用类型功能则可用。如果这样做，则允许值类型或不可空引用类型。\n\
    \n## 其他特殊类型约束\n\n有时将类型参数约束为其中一种类型会很方便。这没有独特的技巧：你只需使用类型约束即可。所有委托类型都派生自 `System.Delegate`，所有枚举类型都派生自\
    \ `System.Enum`。因此，你可以编写一个类型约束，要求类型参数派生自其中之一：⁵\n\n```\npublic class RequireDelegate<T>\n\
    \    where T : Delegate\n{\n}\n```\n\n```\npublic class RequireEnum<T>\n    where\
    \ T : Enum\n{\n}\n```\n\n## 多个约束\n\n如果你想为单个类型参数施加多个约束，只需将它们放在列表中即可。然而，有一些排序限制：如果有引用或值类型约束，`class`\
    \ 或 `struct` 关键字必须在列表中排在第一位。如果存在 `new()` 约束，它必须是最后一个：\n\n```\npublic class Spong<T>\n\
    \    where T : IEnumerable<T>, IDisposable, new()\n...\n```\n\n当你的类型具有多个类型参数时，你为每个想要约束的类型参数添加一个子句。\n\
    \n## 类型推断\n\nC# 编译器经常用于推断泛型方法的类型参数。泛型方法类型参数推断的标准示例如下所示：\n\n```\nint[] values =\
    \ { 1, 2, 3 };\nint last = GetLast(values);\n```\n\n当提供这种看似普通的函数调用时，如果没有可用的非泛型同名方法，编译器将开始查找其他泛型方法。\n\
    \n尽管如此，随着更复杂的案例，其变得更加复杂。C# 规范大约有六页专门用于类型推断算法。尽管如此，它都是为了支持一个目的：让你在类型参数冗余时省略它们。顺便说一下，类型推断始终在编译时运行，因此它基于方法参数的静态类型。\n\
    \n大量使用泛型的 API 明确列出每种类型的参数会使代码很难记住，因此通常依赖于类型推断。而且，如果你使用匿名类型，类型参数推断就变得必要了，因为不可能显式提供类型参数。\n\
    \n## 泛型中的协变和逆变\n\n协变和逆变是指能够使用比最初指定的更派生的类型（更具体）或更少派生的类型（更不具体）。泛型类型参数支持协变和逆变，以在分配和使用泛型类型时提供更大的灵活性。\n\
    \n"
