    # OPERATORS


    An operator is a symbol that regulate the compiler to complete specific mathematical
    or logical manipulations. C# has an extensive set of built-in operators and offers
    the following type of operators:


    +   - Arithmetic operators

    +   - Relational operators

    +   - Logical operators

    +   - Assignment operators

    +   - Misc operators

    +   - Bitwise operators


    # Arithmetic Operators


    The arithmetic operator lets the program execute general algebraic operations
    against numeric values.


    There are five basic operators available in the C# programming language.


    +   1. Addition (symbol "+"): Perform the addition of operands.

    +   2. Subtraction (symbol "-"): Performs subtraction of operands.'
  - '[PAGE 99]


    +   3. **Division (symbol "/")**: execute division of operands.

    +   4. **Multiplication (symbol "*")**: do multiplication on operands.

    +   5. **Modulus (symbol "%")**: Returns reminder post the division of integer.


    Example of this is given below:


    ```

    int a = 10;

    int b = 5;

    int result;

    result = a + b;

    result = a - b;

    result = a * b;

    result = a / b;

    result = a % b;

    ```


    +   - The result of the first operation will be 15, that is, the summation to
    two integers.

    +   - The result of the second operation will be 5, that is, subtraction of two
    integers.

    +   - The result of the third operation will be 50, that is, multiplication between
    two integers.

    +   - The result of the fourth operation will be 2, which is an output of the
    division of two integers.

    +   - The result of the fifth operation will be 0 as there will be no reminder
    left when two given integers are divided.'
  - '[PAGE 100]


    You have to remember that the result of the operation will depend upon the data
    type used to store the result.


    So, if the division of two integer values returns a float value and if the result
    is designated to an integer variable, then the decimal part will be lost because
    of different data types.


    The modulus operator is not like the other operators, it returns the value of
    the remainder from the division of integers. That is, if we divide 20 by 6, then
    the division operator will return an answer as 3 (the quotient), and the modulus
    operator will return two, i.e., the remainder of the division.


    Not only have the above five defined operators, but C# also offers two special
    operators that increase or decrease the value of a variable by 1.


    These are:


    +   1. **Increment operator:** Denoted by the symbol “++”

    +   2. **Decrement operator:** Denoted by the symbol “--”


    These operators can be prefixed or suffixed with variables for operation.


    # **Example:**


    ```

    int a = 10;

    int b = 5;

    int increment;

    int decrement;

    increment = a++;

    decrement = b--;

    ```


    In the aforementioned example, the answer for increment will be 11, i.e., the
    value of a will be increased by 1. While'
