    \n## 命名空间\n\n命名空间是相似类和对象的逻辑分组。其目的是将不同组的项彼此分开。这允许程序员在一个命名空间中定义一个类，在另一个命名空间中定义另一个类，而不会产生任何问题。\n\
    \n假设我们要创建两个命名空间：“fruits”和“colors”。这两个命名空间都可以有一个“Orange”类，而不会相互干扰。创建命名空间的方法是输入\
    \ namespace 关键字，后跟命名空间的名称。例如，命名空间 ConsoleApplication。\n\n## 类\n\n定义类类似于定义数据类型的蓝图。数据不是通过风格来描述的，而是作为一个重要的实体来组织。\n\
