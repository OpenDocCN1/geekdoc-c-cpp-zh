    # WHAT ARE GENERICS


    Generic is a class that lets the user define classes and methods with the placeholder.
    Generics were incorporated into version 2.0 of the C# language. The fundamental
    idea behind using Generic is to let type (Integer, String, ... etc., and user-defined
