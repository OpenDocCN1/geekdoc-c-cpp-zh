    \ 20 种其他 CTS 兼容语言生成的代码交互。单个程序集可能包含用不同 .NET 语言编写的不同模块，并且类型可以相互引用，就好像它们是用同一种、唯一的语言编写的一样。\n\
    \n除了运行时服务外，.NET 还包含全面的库。这些库支持许多不同类型的负载。它们被组织成命名空间，为从文件输入输出到字符串操作、XML 解析、Web 应用框架和\
    \ Windows Forms 控件等一切提供广泛的适当功能。典型的 C# 应用大量利用 .NET 类库来处理日常的“管道”任务。\n\n## 为什么 C#\
