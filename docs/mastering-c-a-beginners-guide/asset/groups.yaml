  mdcn: "\n被称为程序。程序有很多种，它们是用不同的编程语言开发出来的。每种语言都面向不同层次上的计算机控制。有些语言面向机器级（最低层）——例如汇编语言。另一些语言在系统级（与操作系统交互）最有用，比如\
    \ C。还有一些用于创建应用程序的高级语言，包括 C#、Java、C++、PHP、Visual Basic、Python、Ruby、Perl、JavaScript\
    \ 等。当程序员使用 C# 时，他是在高层发出指令，就像工厂里的总执行官一样。以 C# 编写的程序形式给出的指令，几乎可以直接或通过操作系统访问和控制所有计算机资源。\n\
    \n本书旨在教你编程基础知识之外，还教你正确的算法思维，以及在编程中使用基本数据结构。数据结构和算法是程序员最重要的基础技能。如果你对它们有很好的理解，那么精通任何软件技术、开发工具、框架或\
    \ API 都不会有困难。这正是最严肃的软件公司招聘员工时所依赖的能力。谷歌和微软等大公司的求职面试就证明了这一点，这些面试完全依赖算法思维以及对所有基本数据结构和算法的掌握。\n\
    \nC# 对于具有中高级编码经验的开发者来说是一个绝佳选择。虽然专家们承认该语言具有一定的合理复杂度，但他们也确认它相当直接易懂，使得\n\n然后你可能会成功，也可能不会，你会再试一次，直到你最终意识到你已经学会了它。记住，学习是一步一步、连续不断地进行的，需要付出大量努力并持之以恒。\n\
    \n在给出了这些声明之后，人们可以得出结论：C# 是一门很棒的语言，而且它的新特性非常具有原创性，必定会在开发者和 IT 学习社区中找到自己的位置。因此，如果你想为这些具有巨大增长潜力的运动贡献力量，现在就是开始的好时机。很多事物尚未完全定型，许多服务仍待创造，而你自己的一个小型个人项目可能会极大地帮助语言社区发展和成长。你现在已经掌握了开始创作所需的全部信息。\n\
