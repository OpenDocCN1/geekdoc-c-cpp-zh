    ## HISTORY OF C#


    In 2000, Microsoft announced its initial version of C# as a part of the .NET Framework.
    VB.NET was also an alternative, but VB.NET stuck to the standard Microsoft Visual
    Basic syntax, while C# was close to Java, a C-style language. The name given to
    C# firstly was “Cool.” Microsoft was conscious of working with a language very
    similar to C++, so they wanted to specify that its new language was one step higher
    than C++. C# is a newly introduced language on the market developed by Microsoft.
    Initially, Microsoft advanced and deployed the Active Server Pages (ASP) language.


    This language is now labeled Classic ASP, and its support has been discontinued.
    ASP lets programmers generate VB-like scripts to create dynamic web pages. These
    sorts of web pages continued on aged Internet Information Services (IIS) servers
    running Windows. Some Linux providers also supported Classic ASP, but it was routinely
    a nonstandard way to create web pages.


    In the late 1990s, Microsoft decided to make a language that fought a spirited
    fight with Java. During this course of time, Java was the most common language,
    and its popularity was rising. Classic ASP had its place, but the software required
    to create the product was a paid application. Java was used to develop web applications,
    and it was favored among developers who understood C and C++. Instead of labeling
    the new language C++, they decided to use the name C# (pronounced C sharp), which
    refers to the musical notation that a note should be higher in pitch. The C# team
    is continuing to innovate and add new specific features.


