    # NAMESPACES


    Namespaces are used to organize the classes.[^5] They are great to manage the
    scope of methods and classes. To put it simply, you can say that it provides a
    way to keep one set of names (like class names) different from other sets of names.
    The most important advantage of using namespace is that the class names declared
    in one namespace will not clash with the same class names displayed in another
    namespace. It is also referred to as a named group of classes having common features.
    The items of a namespace can be namespaces, interfaces, structures, and delegates.


    In order to define a namespace in C#, we will use the namespace keyword followed
    by the name of the namespace and curly braces containing the body of the namespace
    as follows:


    ```

    namespace name_of_namespace {

    // Namespace (Nested Namespaces)

    // Classes

    // Interfaces

    // Structures

    // Delegates

    }

    ```


    > [^5]: https://www.geeksforgeeks.org/c-sharp-namespaces/, geeksforgeeks'
