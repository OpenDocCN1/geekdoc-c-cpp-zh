    程序集是 .NET Framework 使用的主要构建块。应用程序使用 .NET Framework。它是 CLR 可以简单执行的已编译代码。它是为协同工作而创建的资源和类型的集合，用于构建功能逻辑基础。它可以根据我们选择的项目是
    DLL 还是 exe。您可以在 .NET Core 和 .NET Framework 中从一个或多个源代码文件创建程序集。在 .NET Framework
    中，程序集可以包含一个或多个模块。这使得大型项目可以设计为让其他开发人员在不同的源代码文件或模块上工作，这些模块被合并以构建单个程序集。程序集本质上是 .NET
    Framework 应用程序的构建块。元数据与 Microsoft 中间语言（MSIL）一起创建，并在编译时放置在程序集清单中。元数据和 MSIL 都封装在可移植可执行文件（PE）文件中。程序集清单包含有关其自身的信息。此信息称为程序集清单，它包括有关类型、引用、成员以及运行时执行所需的所有其他数据的信息。


    您创建的每个程序集都包含一个或多个程序文件和一个清单。进程程序集（EXE）和


    库程序集是两种软件文件（DLL）。每个程序集只能有一个输入点（DllMain、WinMain 或 Main）。


    程序集有两种类型：


    1. **共享程序集：** 可以在多个项目中使用的程序集称为共享程序集。这些通常被引入到全局程序集缓存（GAC）中。建立在 GAC 中的程序集可供该机器上的所有
    .NET 应用程序使用。

    2. **私有程序集：** 它是一个仅由单个应用程序使用的程序集。想象一下，我们现在有一个项目，其中提到了一个 DLL，因此当我们开发该特定项目时，该 DLL
    将被复制到我们项目的 bin 文件夹中。该 DLL 在我们的项目中成为私有程序集。通常，专为特定项目而设的 DLL 是私有程序集。


    卫星程序集和共享程序集是 .NET 中的其他类型的程序集。


    ## GAC


    GAC 代表全局程序集缓存，通常用于存储应由其他不同应用程序使用的程序集。


    所有安装了 CLR 的计算机都需要有一个 GAC，其位置可以在“ C:\Windows\assembly ”下看到


    '
