  mdcn: "\n\n在纯函数中，不会有隐藏状态或对外部世界的任何依赖。这一事实会使测试变得容易得多，因为我们不必担心模拟依赖项或其他黑客手段来为测试准备功能。\n\
    \n- 以函数式风格编写的程序调试更顺畅。\n\n编写使程序更清晰的纯函数也有助于调试。如果我们确信一个函数的作用是什么，那么我们要做的就是查看传入的参数是什么，并跟踪该值以查看出了什么问题。\n\
    \n- 声明式方法使代码更容易理解。\n\n在面向对象的编程风格中，我们有直接更改和操作值的语句。这种编程风格被称为命令式编程。但还有另一种风格称为声明式编程。在这种风格中，我们不是直接更改程序，而是编写执行特定功能的小块功能，并且做得非常好。以一种可以与单独的值一起使用的方式，我们将这些函数组合起来。因此，我们只是宣布需要做什么，而不是直接将所有必要的计算累积在一个地方。这最终会导致更易读的代码，并使我们能够专注于解决实际的业务问题。\n\
    \n- 方法签名诚实。\n\n这个概念意味着纯函数的方法签名是经过深思熟虑的。通常在非函数式代码中，我们会遇到没有返回值或参数却做某事的方法。通过查看签名，我们不知道此函数的输入和输出是什么以及它做什么。此外，方法名称也不是此方面的可靠信息来源。因此，我们唯一的办法就是阅读整个函数。\n\
    \n但在纯函数中，仅通过查看其签名，我们就能立即获得有关函数做什么的大量信息。有时这就是我们需要了解的有关函数的全部信息，而且比非纯函数更清晰、更快。\n\n\
    函数式编程是 C# 中的一种编程范式，始终与面向对象编程结合使用。C# 允许你使用面向对象概念进行命令式编程，但它也使用声明式编程。² 在声明式编程中，你使用更具描述性的方式来定义需要做什么，而不是如何执行操作，正如我们前面讨论的那样。例如，假设你想要找到价格小于\
    \ 20 按标题排序的前 10 本书。在函数式编程中，你可以定义如下内容：\n\n```\nbooks.Where(price<20).OrderBy(title).\n\
    Take(10);\n```\n\n在这里，你只需指定需要选择价格小于 20 的书籍，按标题排序，并取前十本。正如你所见，你没有指定如何执行此操作——只有需要做什么。\n\
    \n函数式编程中的基本概念是函数。在函数式编程中，我们必须像对待其他对象一样创建函数，操作它们，将它们传递给其他函数等。因此，我们需要更多的自由，因为函数不仅仅是类的组成部分——它们应该是独立的对象。在\
    \ C# 中，你可以将函数对象用作任何其他对象类型。\n\n## 函数类型\n\n函数对象必须具有某种类型。在 C# 中，我们可以定义通用函数或强类型委托。委托可以被视为函数原型的定义，其中方法签名被定义。委托类型的“实例对象”是指向函数的指针（静态方法、类方法），其原型与委托定义匹配。以下代码中显示了委托定义的示例：\n\
    \n```\ndelegate double MyFunction(double x);\n```\n\n此委托定义了一个函数的原型，该函数具有一个 double\
    \ 参数并以 double 值返回结果。请注意，只有类型才重要；方法及其参数的实际名称是任意的。此委托类型匹配多个三角函数、指数、 polynomial、\
    \ 对数和其他函数。例如，你可以简单地定义一个引用某些数学函数的函数变量，通过函数变量执行它，并将结果放在另一个变量中。以下列表中显示了一个示例：\n\n\
    ```\nMyFunction f = Math.Sin;\ndouble y = f(4); //y=sin(4)\nf = Math.Exp;\ny =\
    \ f(4);\n//y=exp(4)\n```\n\n除了严格类型的委托之外，你肯定可以使用通用函数类型 Func<T1, T2, T3, …, Tn,\
    \ TResult>，其中 T1、T2、T3、…、Tn 是参数的类型（如果函数有参数），Result 是返回类型。以下列表中显示了一个与前一个代码等效的示例：\n\
    \n```\nFunc<double, double> f = Math.Sin;\ndouble y = f(4); //y=sin(4)\nf = Math.Exp;\n\
    y = f(4);\n//y=exp(4)\n```\n\n你可以定义自己的命名委托或使用通用类型。除了 Func 之外，你还有两个类似的通用类型：\n\n\
    - `Predicate<T1, T2, T3, …, Tn>` 表示返回 true/false 值的函数——相当于 `Func<T1, T2, T3, …,\
    \ Tn, bool>`\n- `Action<T1, T2, T3, …, Tn>` 表示不返回任何值的过程——相当于 `Func<T1, T2, T3,\
    \ …, Tn, void>`\n\n谓词是一个函数，它接受一些参数并返回 true 或 false 值。在下面的示例中，显示了一个接收字符串参数的谓词函数。此函数的\
    \ value 被设置为 String.IsNullOrEmpty。此函数接受一个字符串参数并返回有关此字符串是否为空或空的信息——因此，它匹配 Predicate<string>\
    \ 类型：\n\n```\nPredicate<string> isEmptyString = String.\nIsNullOrEmpty;\nif (isEmptyString(\"\
    Test\"))\n{\n    throw new Exception(\"'Test' cannot be empty\");\n}\n```\n\n\
    操作可以定义为可以执行的程序。它们接受一些参数但不返回任何内容。在下面的示例中，显示了一个接受字符串参数的操作，它指向标准的 Console.WriteLine\
    \ 方法：\n\n```\nAction<string> println = Console.WriteLine;\nprintln(\"Test\");\n\
    ```\n\n当使用参数调用操作引用时，调用会被转发到 Console.WriteLine 方法。当你使用 Action 类型时，你只需要定义输入参数列表，因为没有结果。在此示例中，Action<string>\
    \ 等同于 Func<string, void>。\n\n一旦你定义了函数对象，你就可以像前面的列表中所示的那样将它们分配给其他现有函数或其他函数变量。也可以将它们作为标准变量传递给其他函数。如果你想为函数分配一个值，你有以下几种可能性：\n\
    \n- 将函数对象指向引用某个现有方法名称。\n- 使用 lambda 表达式或委托创建匿名函数并将其分配给函数对象。\n- 创建函数表达式，在其中你可以添加或减去一个函数并将这种多播委托分配给函数对象\n\
    \n以下列表中详细说明了一些为函数分配值的示例：\n\n```\nFunc<double, double> f1 = Math.Sin;\nFunc<double,\
    \ double> f2 = Math.Exp;\ndouble y = f1(4) + f2(5); // y=sin(4) + exp(5)\nf2 =\
    \ f1;\ny = f2(9);               // y=sin(9)\n```\n\n在这种情况下，方法被引用为 ClassName.MethodName。除了现有函数之外，你还可以动态创建函数并将它们分配给变量。在这种情况下，你可以使用匿名委托或\
    \ lambda 表达式。以下列表中显示了一个示例：\n\n```\nFunc<double, double> f = delegate(double x)\
    \ { return 3*x+1; };\ndouble y = f(4); // y=13\nf = x => 3*x+1;\ny = f(5);\n//y=16\n\
    ```\n\n在此代码中，我们分配了一个接受 double 参数 x 并返回 double 值 3*x+1 的委托。由于此动态创建的函数与 Func<double,\
    \ double> 匹配，因此可以分配给函数变量。在第三行，分配了等效的 lambda 表达式。正如你所见，lambda 表达式与函数相同：它只是以参数 =>\
    \ 返回表达式格式表示的函数。在下表中，显示了一些 lambda 表达式及其等效的委托：\n\n| Lambda expression | Delegate\
    \ |\n|---|---|\n| `() => 3` | `delegate(){ return 3; }` |\n| `() => DateTime.Now`\
    \ | `delegate(){ return DateTime.Now; };` |\n| `(x) => x+1` | `delegate(int x){\
    \ return x+1; }` |\n| `x => Math.Log(x+1)-1` | `delegate(int x){ return Math.Log(x+1)-1;\
    \ }` |\n| `(x, y) => x+y` | `delegate(int x, int y){ return x+y;}` |\n| `(x, y)\
    \ => x+y` | `delegate(string x, string y){ return x+y;}` |\n\nLambda 表达式必须具有参数名称定义的部分——如果\
    \ lambda 表达式没有参数，则应放置空括号 ()。如果参数列表中只有一个参数，则不需要括号。在 => 符号之后，你需要放置将被返回的表达式。\n\n"
