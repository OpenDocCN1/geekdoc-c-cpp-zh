    ### C# Version 2.0


    With Visual Studio 2005 (formerly codenamed Whidbey), C# is back with some innovations.
    The C# language has successfully been updated to version 2.0 and comes with several
    language extensions. Besides generic types, the C# language introduces other exciting
    features such as iterators, partial classes, anonymous methods, partial types,
    and nullable value types.


    Other C# 2.0 features essentially added capabilities to existing features:


    - Getter/setter separate accessibility.

    - Method group conversions (delegates).

    - Static classes.

    - Delegate inference.


    While C# may have started as a generic OOL, C# version 2.0 changed that vastly.
    Once they had complete control over them, they went after some complicated developer
    pain points. And they even went after them in a significant way.


    ### C# Version 3.0


    C# version 3.0 was released as part of .NET version 3.5. Many of the features
    added explicitly with this version supported Language-Integrated Query (LINQ).


    List of added features:


    - LINQ.

    - Lambda expressions.

    - Extension methods.

    - Anonymous types.

    - Implicitly typed variables.

    - Object and collection initializers.

    - Automatically implemented properties.

    - Expression trees.


    In retrospect, many of these features above seem both inevitable and inseparable.
    They all fit together strategically. It’s generally thought that the C# version’s
    killer feature was the query expression, also popularly known as Language-Integrated
    Query (LINQ).


    A more nuanced view examines expression trees, lambda expressions, and anonymous
    types as the foundation of LINQ. But, in either case, C# 3.0 introduced a breathtaking
    concept. C# 3.0 had begun to lay the groundwork for turning C# into a hybrid OOL/functional
    language. Importantly, you could now write SQL-style declarative queries to perform
    operations on collections, among other things.


    ### C# Version 4.0


    Microsoft introduced this version of C# in April 2010 with Visual Studio 2010.
    Mono C# compiler fully supported the new version by October 2010 with the release
    of Mono 2.8. This version did introduce some interesting new features:


    - Dynamic binding.

    - Named/optional arguments.

    - Generic covariance and contravariance.

    - Embedded interop types.


    The new version of the C# language brought a new type, dynamic. Once a variable
    is declared as having type dynamic, operations on these values are not done or
    verified at compile-time but instead happen entirely at runtime. This is also
    known as duck typing.


    Embedded interop types eased the deployment pain of creating COM interop assemblies
    for your application. Generic covariance and contravariance provide you with more
    power to use generics, but they’re a bit academic and probably most appreciated
    by framework and library authors. Named and optional parameters let you eliminate
    many method overloads and provide convenience. But none of those features are
    precisely paradigm-altering.


    ### C# Version 5.0


    C# version 5.0, released with Visual Studio 2012, was a focused version of the
    language. Almost all of the effort for that version went into another disruptive
    language concept: the async and await model for asynchronous programming. Here’s
    the list of the significant features:


    - Asynchronous methods.

    - Caller info attributes.


    The Async feature establishes two keywords, async and await, which allow you to
    write asynchronous code more quickly and intuitively like synchronous code. Before
    C# 5.0, for writing asynchronous code, you have to define callbacks (also known
    as continuations) to capture what happens after an asynchronous process completes.
    This makes your code and another routine task such as exception handling complicated.
    Caller information can help you out in tracing, debugging, and creating diagnostic
    tools. It will help you avoid duplicate code that is generally invoked in many
    methods for the same purpose, such as logging and tracing.


    ### C# Version 6.0


    With versions 3.0 and 5.0, C# had added significant and outstanding new features
    in an OOL. With version 6.0, released with Visual Studio 2015, it would refrain
    from introducing a dominant killer feature and, in lieu, release many more minor
    features that made C# programming more productive. The C# 6.0 version contains
    many essential elements which will improve the productivity of developers. Here
    are some of them:


    - using static.

    - Exception filters.

    - Auto-property initializers.

    - Expression-bodied members.

    - Null propagator.

    - String interpolation.

    - nameof operator.

    - Index initializers.

    - Await in catch/finally blocks.

    - Default values for getter-only properties.


    Each of these features is quite interesting in its own right. But if you gaze
    at them all together, you see an interesting pattern. In this version, C# eliminated
    language boilerplate to make code more terse and readable. So for fans of clean,
    simple code, this language version was a huge win.


    ### C# Version 7.0


    With Visual Studio 2017 (March 7, 2017), we got a new version of C#—C# 7.0. There
