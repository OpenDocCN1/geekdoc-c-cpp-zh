    \ just pass the callback function that will be called when the function finishes\
    \ execution. An example of the call with callback is shown in the following code:\n\
    \n```\nFunc<int, int, int> f = Klass.SlowFunction;\n//Start execution\nf.BeginInvoke(5,\
    \ 3, async =>\n{\n    string arguments = (string)async.AsyncState;\n    var ar\
    \ = (AsyncResult)async;\n    var fn = (Func<int, int, int>)ar.AsyncDelegate;\n\
    ```\n\n> https://hownot2code.com/2016/12/14/functional-programming-in-csharp/\n\
    hownot2code\n\n```\nint result\n    = fn.EndInvoke(async);\n\nConsole.WriteLine(\"\
    f({0}) = {1}\",\n    arguments, result);\n\n\"5,3\"\n);\n```\n\nThe callback function\
    \ (or lambda expression in this example) takes a parameter async that has information\
    \ about the asynchronous call. And when you cast the parameter of the lambda expression\
    \ to AsyncResults, you can find the original function and call its EndInvoke method.\
    \ As a result, you can print it on the console window.\n\nMoreover, there is no\
    \ need to explicitly check in the main code if the function has finished – just\
    \ let it know what should be done when it is completed.\n\n## Tuples\n\nTuples\
    \ are great way to dynamically form a required data structure. You can create\
    \ tuples by passing a set of fields that belong to the tuple to the Tuple. An\
    \ illustration of a function that uses tuples is shown below:\n\n```\nRandom rnd\
    \ = new Random();\nTuple<double, double> CreateRandomPoint()\n{\n    var x = rnd.NextDouble()\
    \ * 10;\n    var y = rnd.NextDouble() * 10;\n    return Tuple.Create(x, y);\n\
    }\n```\n\nThis function creates a random 2D point within area 10x10.\n"
  mdcn: "\n\n当需要创建自己的新函数时，能够构建自己的函数可能会很有用。例如，你可以创建一些不属于 Math 类、但又必须使用的数学函数。其中一些函数如下：\n\
    \n```\nasinh(x) = log(x + sqrt(x^2 + 1))\nacosh(x) = log(x + sqrt(x^2 - 1))\n\
    atanh(x) = (log(1+x) - log(1-x))/2\n```\n\n## 函数运算\n\n你还可以在表达式中对函数（委托）进行加法或减法运算。如果添加两个函数值，当调用所得到的函数变量时，两个函数都会被执行。这就是所谓的多播委托。你也可以从多播委托中移除某些函数。在下面的示例中，我们添加了两个与\
    \ `Action<string>` 类型匹配的函数：\n\n```\nstatic void Hello(string s)\n{\nSystem.Console.WriteLine(\"\
    Hello, {0}!\", s);\n}\nstatic void Goodbye(string s)\n{\nSystem.Console.WriteLine(\"\
    Goodbye, {0}!\", s);\n}\n```\n\n这些方法接受一个字符串参数，并且不返回任何内容。下面的代码演示了如何应用委托运算来操作多播委托：\n\
    \n```\nAction<string> action = Console.WriteLine;\nAction<string> hello = Hello;\n\
    Action<string> goodbye = Goodbye;\naction += Hello;\naction += (x) => { Console.WriteLine(\"\
    \ Greeting {0} from lambda expression\", x); };\naction(\"First\");  // called\
    \ WriteLine, Hello, and lambda expression\n\naction -= hello;\naction(\"Second\"\
    ); // called WriteLine, and lambda expression\n\naction = Console.WriteLine +\
    \ goodbye\n    + delegate(string x) {\nConsole.WriteLine(\"  Greeting {0} from\
    \ delegate\", x);\n    };\naction(\"Third\");  // called WriteLine, Goodbye, and\
    \ delegate\n\n(action - Goodbye)(\"Fourth\"); // called WriteLine and delegate\n\
    ```\n\n首先，我们创建了三个委托，分别指向函数 WriteLine、Hello 和 Goodbye。然后，我们将函数 Hello 和新的 lambda\
    \ 表达式添加到第一个委托上。运算符 `+=` 用于附加将由多播委托调用的新函数。最终，它会\n\n创建一个多播委托，一旦被调用，就会依次调用这三个函数。最后，你会看到如何创建表达式并执行它。在最后一条语句中，表达式\
    \ `action – goodbye` 的结果是一个在 action 中不含 Goodbye 函数的函数组合。\n\n## C# 函数式编程\n\n现在，我们可以继续看一些函数式编程的示例。函数可以作为参数传递，这一事实使我们能够构建非常通用的结构。例如，假设你想创建一个泛型函数，用来统计数组中满足某些条件的对象数量。下面的例子展示了这个函数的实现方式：\n\
    \n```\npublic static int Count<T>(T[] arr,\nPredicate<T> condition)\n{\n    int\
    \ counter = 0;\n    for (int i = 0; i < arr.Length; i++)\n        if (condition(arr[i]))\n\
    \ncounter++;\n    return counter;\n}\n```\n\n在这个函数中，我们统计数组中满足条件的元素数量。决定条件是否满足的代码并不是硬编码在函数中的，而是作为参数（谓词）传入。这个函数\n\
    \n可以用在各种场景中，例如统计书名超过十个字符的图书数量、价格低于二十的图书数量，或者统计数组中的负数个数。\n\n此外，你还可以使用函数式编程来替换一些标准的\
    \ C# 结构。一个典型的例子是使用下面代码块中展示的 using 块：\n\n```\nusing (obj)\n{\nobj.DoAction();\n\
    }\n```\n\nusing 块用于可释放对象。在 using 块内，你可以操作该对象、调用某些方法等。当 using 块结束时，该对象会被直接释放。或者，你也可以不直接使用\
    \ using 块，而是创建自己的函数来封装要应用于该对象的操作：\n\n```\npublic static void Use<T>(this T obj,\n\
    Action<T> action) where T : IDisposable\n{\n    using (obj)\n    {\naction(obj);\n\
    \    }\n}\n```\n\n## 高阶函数\n\n将函数作为普通对象使用，使我们可以把它们用作其他函数的参数和返回值。管理其他函数的函数被称为高阶函数。\n\
    \n在使用 LINQ 库时，高阶函数非常常见。例如，如果你想使用某个函数将一个序列转换为新的序列，你会使用类似 Select LINQ 函数的方法：\n\n\
    ```\n// Apply a function f T1 -> T2 to each\nelement of data using a List\npublic\
    \ static IEnumerable<T2> MySelect<T1,\nT2>(this IEnumerable<T1> data, Func<T1,\n\
    T2> f)\n{\n    List<T2> retVal= new List<T2>();\n    foreach (T1 x in data) retVal.\n\
    Add(f(x));\n    return retVal;\n}\n```\n\n在这个示例中，函数遍历列表，将函数 f 应用于每个元素，把结果放入新列表，然后返回这个集合。通过修改函数\
    \ f，你可以使用同一个泛型高阶函数对原始序列进行各种变换。\n\n## 异步函数\n\n函数的重要特性之一是它们可以异步调用，这意味着你可以启动一个函数，继续其他工作，然后在需要结果时等待函数结束。C#\
    \ 中的每个函数对象都有以下方法：\n\n- **BeginInvoke**：启动函数执行，但不会等待函数完成。\n- **IsCompleted**：检查执行是否已完成。\n\
    - **EndInvoke**：阻塞当前线程的执行，直到函数完成为止。\n\n下面是一个异步执行函数的示例：\n\n```\nFunc<int, int,\
    \ int> f = Klass.SlowFunction;\n//Start execution\nIAsyncResult async = f.BeginInvoke(5,\
    \ 3,\nnull, null); //calls function with\narguments (5,3)\n//Check is function\
    \ completed\nif(async.IsCompleted) {\n    int result = f.EndInvoke(async);\n}\n\
    //Finally - demand result\nint sum = f.EndInvoke(async);\n```\n\n在这个示例中，变量 f 提供了一个对某个计算两数之和的慢速函数的引用。你也可以分别启动调用并传入参数，检查计算是否完成，再显式地获取结果。下面代码块中展示了这类函数的一个示例：\n\
    \n```\npublic class Klass{\n    public static int SlowFunction(int x,\nint y){\n\
    Thread.Sleep(10000);\n\nreturn x+y;\n    }\n}\n```\n\n## 带回调的异步函数\n\n在前面的示例中，你已经看到参数被传递给函数，但还有一些额外的参数被设置为\
    \ null。这些参数是：\n\n- 回调函数，当函数完成时会被调用。\n- 一些会被传递给回调函数的对象。\n\n这样，你就不需要显式检查函数是否已执行——只需传入一个回调函数，它会在函数执行完成时被调用。下面代码演示了一个带回调的调用示例：\n\
    \n```\nFunc<int, int, int> f = Klass.SlowFunction;\n//Start execution\nf.BeginInvoke(5,\
    \ 3, async =>\n{\n    string arguments = (string)async.AsyncState;\n    var ar\
    \ = (AsyncResult)async;\n    var fn = (Func<int, int, int>)ar.AsyncDelegate;\n\
    ```\n\n> https://hownot2code.com/2016/12/14/functional-programming-in-csharp/\n\
    hownot2code\n\n```\nint result\n    = fn.EndInvoke(async);\n\nConsole.WriteLine(\"\
    f({0}) = {1}\",\n    arguments, result);\n\n\"5,3\"\n);\n```\n\n回调函数（在本例中是 lambda\
    \ 表达式）接收一个参数 async，其中包含有关异步调用的信息。当你将 lambda 表达式的参数转换为 AsyncResults 时，可以找到原始函数并调用其\
    \ EndInvoke 方法。最后，你可以在控制台窗口中将其打印出来。\n\n此外，无需在主代码中显式检查函数是否已完成——只需让它知道函数完成时应该做什么。\n\
    \n## 元组\n\n元组是动态形成所需数据结构的一种绝佳方式。你可以通过将一组属于元组的字段传递给 Tuple 来创建元组。下面展示了一个使用元组的函数示例：\n\
    \n```\nRandom rnd = new Random();\nTuple<double, double> CreateRandomPoint()\n\
    {\n    var x = rnd.NextDouble() * 10;\n    var y = rnd.NextDouble() * 10;\n  \
    \  return Tuple.Create(x, y);\n}\n```\n\n该函数会在 10x10 的区域内创建一个随机的 2D 点。\n\n"
