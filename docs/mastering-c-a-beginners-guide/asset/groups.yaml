  mdcn: "\n\n## 动态关键字\n\nDynamic 是一种对象类型，但它绕过了编译器的类型检查。我们可以给 dynamic 变量赋予任何东西，而不必为编译器或类型感到困惑。它使用\
    \ DLR 的功能，DLR 是 CLR 的扩展。虽然绕过编译器检查很简单，但如果使用不当，可能会导致意外的行为。我们不需要在显式尝试不同操作之前对 dynamics\
    \ 进行强制转换。\n\n```csharp\ndynamic testDynamic = 10;\ntestDynamic = testDynamic +\
    \ 25;\n```\n\nRuntimeBinderException 是我们在执行时可能遇到的异常，如果 dynamic 类型无法处理我们在不支持该操作的类型的操作。\n\
    \n简单来说，想象你试图对一个静态类型做某事，而该静态类型并未实现该行为。\n\n比如尝试递增一个字符串。或对一个整数调用 .Split()。\n\n这并不容易，而且我们必须注意一些问题。例如，对一个已被赋值为\
    \ ICollection 的 dynamic 对象调用 Count()：\n\n```csharp\npublic static void\nExamplePrintCount(ICollection\
    \ collection)\n{\n    dynamic d = collection;\n    Console.WriteLine(\"Static\
    \ typing: {0}\",\n        collection.Count);\n    Console.WriteLine(\"Dynamic\
    \ typing: {0}\",\n        d.Count);\n}\n```\n\n如果我们运行此示例并传入一个 int 数组：\n\n```csharp\n\
    ExamplePrintCount(new int[20]);\n```\n\n你对结果有什么想法？\n\n假设你猜测第一个 Console.WriteLine()\
    \ 会输出 20，而第二个会得到 RuntimeBinderException，你猜对了。\n\n本书中，但就目前而言，你可以将面向对象语言视为具有属性并能够执行操作的语言。本书通过一个真实世界的示例涵盖了面向对象编程的概念。然后你将深入到高级概念，如泛型和集合，并熟悉对象和\
    \ LINQ。接近尾声时，你将使用应用程序组件工作，这些组件说明了本书中解释的所有概念。\n\n本书采用独特且实用的方法向绝对初学者教授 C#。它首先教授你基本的基础知识，并通过以实践方式介绍语言的重要特性和细微差别，让你熟悉\
    \ C# 编程，帮助你流畅地掌握概念。\n\n我们将从检查 C# 中的原始类型和变量开始——它们是什么以及如何使用它们。首先，我们将回顾所有数据类型——整数类型、实数浮点类型、布尔类型、字符类型、字符串和对象类型。我们将继续讨论变量、它们的特征、如何声明它们、如何为它们赋值以及变量初始化是什么。熟悉\
    \ C# 中数据类型的两个主要类别——值类型和引用类型也很重要。我们还将讨论字面量，它们是什么以及有哪些种类。\n\n在了解语言基础知识后，你需要花一些时间学习数组，作为对同一类型元素序列进行操作的一种手段。本书解释了它们是什么以及如何声明、创建和实例化数组以访问其元素。你将能够检查一维和多维数组，并学习遍历数组的各种方法，从标准输入读取和向标准输出写入。在此过程中，将提供许多可作为示例的练习，这些练习可使用数组解决，只是为了向你展示这些工具有多么有用。\n\
    \n此外，你将详细了解编程中的子程序，在 C# 中称为方法。我们将描述何时以及为何使用方法；展示方法如何声明以及方法签名是什么。你将学习如何创建自定义方法以及如何随后使用参数和处理方法时的一些既定实践来调用它。同样，所有这些都将以详细解释的示例为后盾。\n\
    \n回到面向对象编程的原则，请准备好深入研究类继承、接口实现、数据和行为抽象、数据封装和隐藏实现细节、多态性和虚方法等概念。更不用说内聚性和耦合性原则了。我们还将简要概述面向对象建模以及基于特定技术问题的对象模型创建。\n\
    \n你还将接触到 C# 的一些更复杂的功能。更具体地说，我们将特别关注如何使用 lambda 表达式和 LINQ 对集合进行查询的说明。本书详细解释了如何使用扩展方法向已创建的类添加功能。我们将熟悉匿名类型并简要描述其性质和用途。此外，我们还将回顾\
    \ lambda 表达式并在实践中展示大多数内置 lambda 函数的工作方式。\n\n本书还包括一个关于流行的 .NET 技术语言集成查询（LINQ）的章节，该技术允许对数组、列表和其他对象执行各种查询（例如搜索、排序、求和和其他分组操作）。它是有意放在后面，在数据结构和算法复杂性等基本章节之后。原因在于，优秀的程序员应该知道在排序列表或根据条件在数组中搜索时会发生什么，以及这些操作需要多少次操作。如果应用\
    \ LINQ，就不明显给定查询是如何操作的以及花费了多少时间。LINQ 是一种非常强大且广泛使用的技术，但必须在你对编程基础和主要算法非常熟悉之后再掌握。否则，你冒着学习编写低效代码的风险，而不理解其工作原理以及后台运行了多少次操作。\n\
    \n作为初学者，无需担心，因为学习 C# 非常简单。然而，要了解 C#，你至少应该对编写代码有一个基本概念，即使你尚未构建第一个应用程序或程序。与更复杂的语言相比，C#\
    \ 的学习曲线相对较低。\n\n如果你正在寻找在行业中开始职业生涯，尝试查看程序员的职位招聘网站，你就会亲眼看到对 C# 和 .NET 专家需求非常高。对\
    \ PHP、C++ 和其他技术专家的需求远低于对 C# 和 Java 工程师的需求。与此同时，对于优秀的经验丰富的程序员来说，他们使用的语言意义不大，因为他们懂得编程。无论任务需要什么语言和技术，他们都能迅速掌握。因此，你的目标不仅仅是学习\
    \ C#，而是获得对编程的理解。在你掌握编程基础并学会算法化思考后，当你熟悉其他编程语言时，你会发现它们与 C# 有多少共同点，以及学习它们会多么容易。\n\
    \n编程建立在几乎多年来从未改变的原则之上，而本书教授的就是这些原则。你应该意识到，编程的本质是通过不同层面对计算机工作进行控制。这是通过程序员的“命令”和“指令”，也称为编程指令来实现的。“编程”意味着通过指令序列来协调计算机的工作，以实现某种结果。这些命令以书面形式给出，并由计算机（分别由操作系统、CPU\
    \ 和外围设备）隐式遵循。因此，“编程”意味着能够编写多个指令序列，以组织计算机的工作以实现结果。这些指令序列被称为“计算机程序”或“脚本”。\n\n为实现或完成某项工作，或获得特定结果的一系列步骤称为算法。这就是编程与算法的关系。\n\
    \n简单来说，编程涉及通过一系列步骤描述你希望计算机做什么。而程序员就是创建这些指令的专业人士，这些指令控制计算机。这些指令\n\n"
