  mdcn: "\n\n较大数据类型更有效地实现为引用类型，因为对引用类型变量的赋值只需要写入一个引用，而不需要写入整个数据值。\n\n同时，存在三种引用类型：\n\
    \n- 1. 类\n- 2. 接口\n- 3. 委托\n\n委托用于表示单个方法，且超出本课程的范围。\n\n引用类型变量不需要引用任何数据值。在这种情况下，它们存储一个\
    \ null 值（值类型的变量不能存储 null）。任何尝试访问 null 的方法、属性或其他成员，或对其应用索引的操作都将导致 NullReferenceException。\n\
    \n类或结构体的字段存储方式取决于字段是值类型还是引用类型。如果是值类型，则值直接存储在字段中，无论该字段属于从栈还是堆分配的对象。如果是引用类型，则存储\
    \ null 或指向从堆分配的对象的引用。\n\n值类型和引用类型之间的区别可以用以下代码示例说明：\n\n```\nprivate int[] DoSomething(int\
    \ i, int j)\n{\n    Point a = new Point(i, j);\n    Point b = a;\n    a.X = i\
    \ + j;\n    int[] c = new int[10];\n```\n```\nint[] d = c;\nc[0] = b.X;\nreturn\
    \ d;\n}\n```\n\n假设此方法按如下方式调用：\n\n```\nint[] values = DoSomething(1, 2);\n```\n\
    \n该方法包含六个局部变量：i、j、a、b、c 和 d。int 是一个结构体，因此是值类型。Point 是一个结构体（因此是值类型），包含公共的 int 属性\
    \ X 和 Y，每个属性都可以读取或修改。int[]  however  however 是一个引用类型。这六个变量的空间都从栈分配，而两个点的空间包括为每个点存储两个\
    \ int 字段的空间。分别传递给 i 和 j 的值 1 和 2 直接存储在这些变量中。\n\n## ARRAYS AND OPERATORS\n\n数组可以定义为项目的集合，例如字符串。你可以将其应用于将项目收集到一个组中，并对它们执行各种操作，如排序。此外，框架内的多种方法也作用于数组，以使其能够接受一系列项目而不仅仅是一个。仅此一点就使得了解一些关于数组的知识变得很重要。\n\
    \n数组的初始化方式与变量类似，在数据类型后加上 [] 括号，如下所示：\n\n```\nstring[] names;\n```\n\n你需要实例化数组才能使用它，方法如下：\n\
    \n```\nstring[] names = new string[2];\n```\n\n数字（2）是数组的大小，即我们可以放入其中的项目数。将项目放入数组也非常简单：\n\
    \n```\nnames[0] = \"John Smith\";\n```\n\n从数组中获取数据的最常见方法是遍历它并对每个值执行某种操作。让我们使用之前的数组来做一个实际示例：\n\
    \n```\nusing System;\nusing System.Collections;\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n    static void Main(string[] args)\n    {\n    \
    \    string[] names = new string[2];\n        names[0] = \"John Doe\";\n     \
    \   names[1] = \"Jane Doe\";\n        foreach(string s in names)\n        Console.WriteLine(s);\n\
    \        Console.ReadLine();\n    }\n    }\n}\n```\n\n我们使用 foreach 循环，因为这是最简单的方法，但当然也可以使用其他类型的循环代替。for\
    \ 循环对于数组也很适用，例如当你需要计数每个项目时，如下所示：\n\n```\nfor(int i = 0; i < names.Length; i++)\n\
    Console.WriteLine(\"Item number \" + i + \": \"\n+ names[i]);\n```\n\n我们使用数组的\
    \ Length 属性来查看循环应迭代多少次，然后使用计数器（i）输出我们在过程中的位置，以及从数组中获取项目。就像我们使用一个数字，即所谓的索引器，将项目放入数组一样，我们也可以使用它再次取出特定项目。\n\
    \n你可以使用数组对一系列值进行排序，而且非常简单。数组类包含许多用于操作数组的智能方法。此示例使用数字而不是字符串，只是为了尝试其他内容，但同样也可以是字符串。我想向你展示另一种填充数组的方法，如果你有一组小的、预定义好的项目想要放入数组中，这种方法会容易得多。看一下：\n\
    \n```\nint[] numbers = new int[5] { 4, 3, 8, 0, 5 };\n```\n\n通过一行代码，我们创建了一个大小为\
    \ 5 的数组，并用 5 个整数填充它。通过这种方式填充数组，你会获得额外的优势，因为编译器会检查并确保你不会向数组中插入过多的项目。尝试再添加一个数字——你会看到编译器通知潜在的错误。\n\
    \n我们迄今为止使用的数组只有一维。然而，C# 数组也可以是多维的，有时被称为数组中的数组。多维数组在 C# 中有两种类型：矩形数组和锯齿数组。区别在于矩形数组的所有维度必须具有相同的大小，因此得名矩形。锯齿数组的维度可以具有不同的大小。\n\
    \n## OPERATORS\n\n运算符是一个符号，用于指示编译器完成特定的数学或逻辑操作。C# 具有广泛的内置运算符，并提供以下类型的运算符：\n\n\
    - - 算术运算符\n- - 关系运算符\n- - 逻辑运算符\n- - 赋值运算符\n- - 杂项运算符\n- - 按位运算符\n\n### Arithmetic\
    \ Operators\n\n算术运算符让程序对数值执行一般的代数运算。\n\nC# 编程语言中有五个基本运算符可用。\n\n- 1. 加法（符号 \"+\"\
    ）：执行操作数的加法。\n- 2. 减法（符号 \"-\"）：执行操作数的减法。\n- 3. **除法（符号 \"/\"）**：执行操作数的除法。\n- 4.\
    \ **乘法（符号 \"*\"）**：对操作数执行乘法。\n- 5. **取模（符号 \"%\"）**：返回整数除法后的余数。\n\n示例如下所示：\n\n\
    ```\nint a = 10;\nint b = 5;\nint result;\nresult = a + b;\nresult = a - b;\n\
    result = a * b;\nresult = a / b;\nresult = a % b;\n```\n\n- - 第一个操作的结果将为 15，即两个整数的求和。\n\
    - - 第二个操作的结果将为 5，即两个整数的减法。\n- - 第三个操作的结果将为 50，即两个整数之间的乘法。\n- - 第四个操作的结果将为 2，即两个整数相除的输出。\n\
    - - 第五个操作的结果将为 0，因为两个给定整数相除后不会有余数。\n\n你必须记住，操作的结果将取决于用于存储结果的数据类型。\n\n因此，如果两个整数值的除法返回一个浮点值，而结果被指定给一个整数变量，则小数部分会因数据类型不同而丢失。\n\
    \n取模运算符与其他运算符不同，它返回整数相除后的余数值。也就是说，如果我们用 6 除 20，则除法运算符将返回 3（商），而取模运算符将返回 2，即除法的余数。\n\
    \n除了上述五个定义好的运算符外，C# 还提供两个特殊的运算符，可将变量的值增加或减少 1。\n\n它们是：\n\n- 1. **自增运算符：** 用符号“++”表示\n\
    - 2. **自减运算符：** 用符号“--”表示\n\n这些运算符可以与变量一起前缀或后缀使用以进行操作。\n\n### **Example:**\n\n\
    ```\nint a = 10;\nint b = 5;\nint increment;\nint decrement;\nincrement = a++;\n\
    decrement = b--;\n```\n\n在上述示例中，increment 的答案将为 11，即 a 的值将增加 1。而\n\n"
