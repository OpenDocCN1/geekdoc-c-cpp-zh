    manually tear them down and release the memory taken up by them. This is possible
    because of the embedded in .NET CLR system for cleaning the memory (garbage collector),
    which takes care of releasing unused objects instead of us. Objects to which there
    is no reference in the program at a particular moment instinctively released,
    and the memory they take up is released. This way, many potential bugs, and problems
    are controlled. If we would like to release a specific object manually, we have
    to destroy the reference to it, for example, this way:


    ```

    someCat = null;

