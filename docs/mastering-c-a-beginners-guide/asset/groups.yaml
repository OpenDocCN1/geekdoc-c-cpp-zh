    \   new Human();\n    }\n}\n```\n\n在这个程序中，我们有两个类：基类 Being 和派生类 Human。派生类继承自基类：\n\
    \n- `public class Human: Being`\n\n在 C# 中，我们使用冒号 (:) 运算符来创建继承关系：\n\n- `new Human();`\n\
    \n我们实例化派生类 Human。\n\n上述继承代码的输出将是：\n\n- Being 已创建\n- Human 已创建\n\n可以看到两个构造函数都被调用了。首先调用基类的构造函数，然后调用派生类的构造函数。\n\
    \n## 多态\n\n多态可以描述为针对不同的数据输入，以多种方式应用运算符或函数。\n\n实际上，多态意味着如果类 B 继承自类 A，它不必继承类 A 的所有内容；也就是说，它可以以不同的方式完成类\
    \ A 的某些功能。\n\n多态还代表着为派生类重新定义方法的能力。绑定有两种类型。运行时多态的一个示例是：\n\n```csharp\nusing System;\n\
    public abstract class Shape\n{\n    protected int x;\n    protected int y;\n \
    \   public abstract int Area();\n}\npublic class Rectangle : Shape\n{\n    public\
    \ Rectangle(int x, int y)\n    {\n        this.x = x;\n        this.y = y;\n \
    \   }\n    public override int Area()\n    {\n    }\n}\npublic class Square: Shape\n\
    {\n    public Square(int x)\n    {\n        this.x = x;\n    }\n    public override\
    \ int Area()\n    {\n        return this.x * this.x;\n    }\n}\npublic class Polymorphism\n\
    {\n    static void Main()\n    {\n        Shape[] shapes = { new Square(5),\n\
    \            new Rectangle(9, 4), new\n            Square(12) };\n        foreach\
