  md: "\nare called programs. Numerous programs exist, and they are developed using\
    \ different kinds of programming languages. Each language is oriented toward controlling\
    \ the computer on a different level. There are languages oriented toward the machine\
    \ level (the lowest)—Assembler, for instance. Others are most useful at the system\
    \ level (interacting with the operating system), like C. There are also high-level\
    \ languages used to create application programs. Such languages include C#, Java,\
    \ C++, PHP, Visual Basic, Python, Ruby, Perl, JavaScript, and others. When a programmer\
    \ uses C#, he gives commands in high level, like from the position of a general\
    \ executive in a factory. The instructions given in the form of programs written\
    \ in C# can access and control almost all computer resources directly or via the\
    \ operating system.\n\nThis book aims to teach you, in addition to the basic knowledge\
    \ in programming, proper algorithmic thinking, and using basic data structures\
    \ in programming. Data structures and algorithms are a programmer’s most important\
    \ fundamental skills. If you have a good understanding of them, you will not have\
    \ any trouble becoming proficient in any software technology, development tool,\
    \ framework, or API. That is what the most serious software companies rely on\
    \ when hiring employees. Proof of this are job interviews at large companies like\
    \ Google and Microsoft that rely exclusively on algorithmic thinking and knowledge\
    \ of all basic data structures and algorithms.\n\nC# is an excellent choice for\
    \ developers with moderate to advanced experience with writing code. While experts\
    \ admit the language is one of the reasonable complexities, they also confirm\
    \ that it is pretty straightforward, making\n\nThen you would succeed or you would\
    \ not and you would try again, until you finally realize you have learned it.\
    \ Remember that learning is done step by step, consecutively, in series, with\
    \ a lot of effort and consistency.\n\nHaving provided these disclaimers, one might\
    \ conclude that C# is a great language, and the new features are so original that\
    \ it will undoubtedly find its place in the developers and IT learning communities.\
    \ Therefore, if you want to contribute to such movements with enormous growth\
    \ potential, now is a great time to start. Things are not yet fully established.\
    \ Many services still need producing, and a small personal project of your own\
    \ making could considerably help the language community to evolve and strive.\
    \ You now hold all the information necessary to begin with your creations.\n\n\
