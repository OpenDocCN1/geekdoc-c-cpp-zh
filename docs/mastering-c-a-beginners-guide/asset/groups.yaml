  mdcn: "\n协变类型参数允许你进行看起来很像普通多态性的赋值，如以下代码所示：\n\n```\nIEnumerable<Derived> d = new\
    \ List<Derived>();\nIEnumerable<Base> b = d;\n```\n\nList<T> 类实现了 IEnumerable<T>\
    \ 接口，因此 List<Derived>（在 Visual Basic 中为 List(Of Derived)）实现了 IEnumerable<Derived>。其余部分由协变类型参数完成。\n\
    \n另一方面，逆变看起来有些违反直觉。下面的示例创建了一个类型为 Action<Base>（在 Visual Basic 中为 Action(Of Base)）的委托，然后将该委托赋值给一个类型为\
    \ Action<Derived> 的变量：\n\n```\nAction<Base> b = (target) => { Console.WriteLine(target.GetType().Name);\
    \ };\nAction<Derived> d = b;\nd(new Derived());\n```\n\n这看起来可能有点反直觉，但这是可编译且可运行的类型安全代码。Lambda\
    \ 表达式与它被赋值给的委托匹配，因此它定义了一个接受类型为 Base 的参数且没有返回值的方法。生成的委托可以赋值给类型为 Action<Derived>\
    \ 的变量，因为 Action<T> 委托的类型参数 T 是逆变的。这段代码之所以类型安全，是因为 T 指定了一个参数类型。当类型为 Action<Base>\
    \ 的委托像类型为 Action<Derived> 的委托一样被调用时，其参数必须是 Derived 类型。由于方法的参数类型是 Base，因此该参数总能安全地传递给底层方法。\n\
    \n一般来说，协变类型参数可以用作委托的返回类型，而逆变类型参数可以看作参数类型。\n\n基本上，协变和逆变统称为变体。未被设置为协变或逆变的泛型类型参数称为不变。以下是关于公共语言运行时中变体的事实摘要：\n\
    \n-   变体类型参数仅限于泛型接口和泛型委托类型。\n-   泛型接口或泛型委托类型可以同时具有协变和逆变类型参数。\n-   变体仅适用于引用类型；如果为变体类型参数指定值类型，则该类型参数对于生成的构造类型是不变的。\n\
    -   变体不适用于委托组合。也就是说，给定类型为 Action<Derived> 和 Action<Base>（在 Visual Basic 中为 Action(Of\
    \ Derived) 和 Action(Of Base)）的两个委托，你不能将第二个委托与第一个组合，尽管结果会是类型安全的。\n-   变体允许将第二个委托赋值给类型为\
    \ Action<Derived> 的变量，但委托只有在类型完全匹配时才能组合。\n\n现在让我们看下面的示例来详细说明协变类型参数。该示例定义了两个类型：Base\
    \ 有一个名为 PrintBases 的静态方法，该方法接受一个 IEnumerable<Base>（在 Visual Basic 中为 IEnumerable(Of\
    \ Base)）并打印各个元素。Derived 继承自 Base。该示例创建了一个空的 List<Derived>（在 Visual Basic 中为 List(Of\
    \ Derived)），并演示了该类型无需强制转换即可传递给 PrintBases 并赋值给类型为 IEnumerable<Base> 的变量。List<T>\
    \ 实现了 IEnumerable<T>，后者只有一个协变类型参数：\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    \nclass Base\n{\n    public static void PrintBases(IEnumerable<Base> bases)\n\
    \    {\n        foreach (Base b in bases)\n        {\n            Console.WriteLine(b);\n\
    \        }\n    }\n}\n\nclass Derived : Base\n{\n    public static void Main()\n\
    \    {\n        List<Derived> dlist = new List<Derived>();\n        Derived.PrintBases(dlist);\n\
    \        IEnumerable<Base> bIEnum = dlist;\n    }\n}\n```\n\n### 具有逆变类型参数的泛型接口\n\
    \n多个泛型接口具有逆变类型参数，例如：IComparer<T>、IComparable<T> 和 IEqualityComparer<T>。这些接口只有逆变类型参数，因此在这些接口的成员中，类型参数仅用作参数类型。\n\
    \n为了解释如何使用逆变类型参数，我们来看下面的示例。该示例定义了一个抽象（在 Visual Basic 中为 MustInherit）Shape 类，其中包含一个\
    \ Area 属性。它还定义了一个实现 IComparer<Shape>（在 Visual Basic 中为 IComparer(Of Shape)）的 ShapeAreaComparer\
    \ 类。IComparer<T>.Compare 方法的实现基于 Area 属性的值，因此 ShapeAreaComparer 可用于按面积对 Shape\
    \ 对象进行排序。\n\n你还可以观察 Circle 类如何继承 Shape 并重写 Area。该示例创建了一个 Circle 对象的 SortedSet<T>，使用的构造函数接受一个\
    \ IComparer<Circle>（在 Visual Basic 中为 IComparer(Of Circle)）。但是，示例没有传递 IComparer<Circle>，而是传递了一个实现\
    \ IComparer<Shape> 的 ShapeAreaComparer 对象。当代码要求使用更派生类型（Circle）的比较器时，示例可以传递较不派生类型（Shape）的比较器，因为\
    \ IComparer<T> 泛型接口的类型参数是逆变的。\n\n同时，方法的参数类型（Shape）比正在传递的类型（Circle）的派生程度更低，因此该调用是类型安全的。逆变使\
    \ ShapeAreaComparer 能够对任何派生自 Shape 的单一类型集合，以及对派生自 Shape 的多种类型组成的混合集合进行排序。\n\n\
    ```\nusing System;\nusing System.Collections.Generic;\n\nabstract class Shape\n\
    {\n    public virtual double Area { get { return 0; } }\n}\n\nclass Circle : Shape\n\
    {\n    private double r;\n    public Circle(double radius) { r = radius; }\n \
    \   public double Radius { get { return r; } }\n    public override double Area\
    \ { get { return Math.PI * r * r; } }\n}\n\nclass ShapeAreaComparer : System.Collections.Generic.IComparer<Shape>\n\
    {\n    int IComparer<Shape>.Compare(Shape a, Shape b)\n    {\n        if (a ==\
    \ null) return b == null ? 0 : -1;\n}\n```\n\n## C# 中的函数式编程与 Lambda 表达式\n\n###\
    \ 本章内容\n\n-   函数式编程\n-   Lambda 表达式\n-   LINQ\n\n在前一章中，我们已经介绍了泛型及其方法，现在我们将讨论函数式编程。函数式编程及其概念对软件行业和数据驱动应用程序变得越来越重要。但是，要利用函数式编程的优势，我们不必使用像\
    \ Haskell 这样严格的函数式语言。\n\nC# 通过委托来支持高阶函数。这意味着我们可以接受函数作为参数，或者返回函数。换句话说，函数在 C# 中是一等公民，这意味着我们可以像函数式语言一样，以函数式方式来组织程序。\n\
    \n函数式编程的历史比计算机还要悠久。它基本上源自数学逻辑（lambda 演算）。在函数式编程中，我们使用函数进行编程，函数不会改变或修改任何内容。它们将输入映射到输出。\n\
    \n### 函数式编程\n\n函数式编程是一种编程范式，在这种范式中，开发者试图将所有内容绑定到纯数学函数风格中。程序员设法构建函数并将函数发送给计算机后，就轮到计算机来执行任务了。通常，计算机的角色是求值函数中的表达式并返回结果。我们可以把计算机想象成一个计算器，因为它会分析函数中的表达式，并以打印格式将结果呈现给用户。计算器会对一个函数进行求值，该函数由作为参数传入的变量和构成函数体的表达式组成。它们的值会替换表达式中的变量。我们可以使用代数运算符给出简单表达式和复合表达式。由于没有赋值的表达式永远不会改变值，子表达式只需求值一次。\n\
    \n假设函数中有表达式 3 + 5。计算机在彻底求值后会立即返回 8 作为结果。然而，这只是计算机对表达式求值方式的一个简单示例。程序员可以通过在函数内创建复杂的定义和表达式来提升计算机的能力。计算机不仅可以求值简单表达式，还可以求值复杂计算，而且表达式是一种声明式编程风格。它主要关注的是解决什么，而不是命令式风格中那种精确指导如何解决的方式。它使用表达式而不是语句。表达式会通过求值来产生值，而语句则通过执行来为变量赋值。\n\
    \n### 函数式编程的优势¹\n\n-   纯函数使我们的代码更容易推理。\n\n    帮助我们对一段代码有更好理解的最重要方法之一，是知道变化的来源在哪里。这很关键，因为如果我们确切知道一段代码做什么和不做什么，那么我们就可以更有把握地修改代码。这种代码清晰度还能带来另一个好处，那就是当我们需要查找系统中的问题或进行调试时。\n\
    \n-   测试纯函数更容易。\n"
