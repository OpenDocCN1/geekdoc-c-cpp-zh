    \n因为我们的 `EmployeeFactory` 类以通用的 `System.Object` 类型返回员工，所以情况就是这样。`System.Object`\
    \ 是所有其他类的基类，如果我们不知道应预期什么类型的对象，我们可以使用它。\n\n要调用 `System.Object` 的方法，我们必须首先确定它是什么类型的对象。我们通过调用\
    \ `object.GetType()` 方法来做到这一点。然后，使用 `InvokeMember()` 方法，我们将能够在 `firstEmployee`\
    \ 对象上执行 `GetWorkStatus` 函数。\n\n经过一些枚举解析后，我们终于可以确定 `firstEmployee` 的工作状态。\n\n看起来有点复杂，但它有效。\n\
