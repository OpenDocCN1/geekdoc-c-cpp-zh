    ## Other Function Members


    Members that include executable code are collectively known as the function members
    of a class.


    ### Constructors


    C# supports both instance and static constructors.


    - **Instance constructor:** a member that implements the actions required to initialize
    an instance of a class.

    - **Static constructor:** a member that carries out the actions needed to initialize
    a class itself when it’s first loaded.


    A constructor is declared like a method with no return type and the same name
    as the containing class. If a constructor declaration contains a static modifier,
    it declares a static constructor. If this is not the case, an instance constructor
    is declared.


    Instance constructors can be overloaded and can have optional parameters. For
    example, the `MyList<T>` class declares one instance constructor with a single
    optional `int` parameter. Instance constructors are invoked using the `new` operator.
    The following statements allocate two `MyList<string>` instances using the constructor
    of the `MyList` class with and without the optional argument.


    ```

    MyList<string> list1 = new MyList<string>();

    MyList<string> list2 = new MyList<string>(10);

    ```


    Instance constructors aren’t inherited, unlike any other member. Other than the
    constructors declared in the class, there are no instance constructors in a class.
    If a class doesn’t have an instance constructor, it defaults to an empty one with
    no parameters.


    ### Events


    An event is a member that allows a class or object to furnish notifications. An
    event is declared like a field except that the declaration contains an event keyword,
    and the type must be a delegate type.


    ### Operators


    A member that provides the meaning of applying a particular expression operator
    to instances of a class is called an operator. Unary operators, binary operators,
    and conversion operators are the three types of operators that may be specified.
    All operators should be declared public and static.


    ### Finalizers


    A finalizer is a class member that implements the operations required to close
    a class instance. Typically, a finalizer is necessary to release unmanaged resources.
    Finalizers can’t have parameters, they can’t have accessibility modifiers, and
    they can’t be invoked. The finalizer, for instance, is called automatically during
    garbage collection.


    ### Expressions


    Expressions are formed from operands and operators. The operators of an expression
    indicate which operations to apply to the operands. Examples of operators include
    `+`, `-`, `*`, `/`, and `new`. Examples of operands include literals, fields,
    local variables, and expressions.


    ### Statements


    The actions of a program are expressed using statements. C# supports different
    kinds of statements, several of which are defined in terms of embedded statements.


    ## Understanding the CLI


    The common language runtime (CLR) code uses a standard common type system (CTS)
    based on the Common Language Infrastructure (CLI). CLI is part of Microsoft’s
    .NET platform and is expected to become an ECMA standard. The CLI includes the
    CTS and Common Language Specification (CLS).


    CLI is a specification created by Microsoft that explains the executable code
    and runtime environment. In simple terms, this allows us to use various high-level
    programming languages on numerous machines without rewriting the code.


    The .NET Framework, .NET Core, and Mono are some implementations of CLI (picture).


    CLI can be divided into four main components.


    ### Common Type System


    CTS is accountable for laying out the framework to use two or more languages simultaneously.
    It defines how types are declared and managed in the source code of any .NET language
    in the CLR where your bytecode or portable executable file changes into machine
    code. It also gives the object-oriented programming (OOP) model, which enables
    the execution of different high-level languages. It defines instructions that
    must be followed so that other languages can communicate and provide primitive
    data type libraries.


    ### Common Language Specification


    CLS is a set of requirements that must be met by any language for it to be considered
    .NET compatible. It’s a collection of rules and a subset of CTS types. Elimination
    of pointers and multiple inheritance are examples of it.


    ### Metadata


    Metadata provides information about all the classes and the class members specified
    in the assembly.


    ### Virtual Execution System


    Virtual execution system (VES) loads and runs the programs that are compatible
    with the CLI.


    CLI advantages are as follows:


    - Defines a consistent programming model. For example, a .NET program is syntactically
    similar to C#.NET or VB.NET and follows the same essential steps when accessing
    and obtaining data.

    - Administrators may define and reinforce security by limiting data access and
    ensuring user authenticity.

    - Implements protocols like HTTP, Transmission Control Protocol/Internet Protocol
    (TCP/IP), Simple Object Access Protocol (SOAP), and Extensible Markup Language
    (XML), providing technology compatibility with added security layers.

    - Allows users to separate application presentation logic and business logic for
    increased maintenance and portability using metadata. To make it crystal clear,
    CLI is a bunch of specifications for a virtual operating system (OS) that is solely
    a CLR.


    ## The .NET Framework


    The .NET Framework is a managed execution environment for Windows that gives various
    services to its running apps. There are two main components of the .NET Framework.


    ### CLR


    It is the primary and virtual machine component of the .NET Framework. The runtime
    environment in the .NET Framework runs the code and makes the development process
    easier by providing various services such as remoting, thread management, type-safety,
    memory management, robustness, etc. It is accountable for controlling the execution
    of .NET programs without considering any .NET programming language. It also allows
    the execution of code: code that targets the runtime is explicitly known as managed
    code, and code that doesn’t target the runtime is called unmanaged code.


    ### Framework Class Library (FCL)


    The collection of reusable, object-oriented class libraries and methods, etc.,
    can be combined with CLR. It is also called the assemblies. It is like the header
    files in C/C++ and packages in Java. Installing the .NET Framework is the installation
    of CLR and FCL into the system.


    ### App Models


    The common app models for creating software applications in the .NET Framework
    include the following:


    - **ADO.NET:** This is always used to create applications that interact with databases,
    such as Microsoft SQL Server and Oracle.

    - **ASP.NET:** This model is used to build web-based applications that can run
    on browsers.

    - **WinForms:** This model is used to build forms-based applications deployed
    on end-user devices.


    The following are some of the benefits that the .NET Framework provides to running
    apps:


    - **Memory management:** Programmers are responsible for allocating and releasing
    memory and managing object lifetimes in many programming languages. The CLR provides
    various services on behalf of the app in .NET Framework applications.

    - **A common type system:** Basic types are defined by the compiler in conventional
    programming languages, complicating cross-language compatibility. In .NET Framework,
    basic types are determined by the .NET Framework type system and are common to
    all languages that specifically target .NET Framework.

    - **An extensive class library:** Programmers can use a readily accessible library
    of types and members from the .NET FCL instead of writing bulk code to handle
    common low-level programming operations.

    - **Development frameworks and technologies:** .NET Framework contains libraries
    for specific areas of app development, such as Windows Communication Foundation
    for service-oriented apps, ASP.NET for

