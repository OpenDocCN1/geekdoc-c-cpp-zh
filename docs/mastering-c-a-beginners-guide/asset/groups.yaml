    ```\n\n## 方法\n\n方法是一组协同工作以完成某项任务的语句。每个 C# 应用程序中至少有一个包含一个 Main 方法的类。\n\n它包含以下定义。它以访问修饰符声明开始，然后是返回类型，接着我们定义方法名，在圆括号内我们指定参数。\n\
