  mdcn: "\n\n同样地，在代码开发过程中，我们可能会以相同的方式遇到多种数据类型。例如，代码中有一堆字符串。我们可以利用列表的内置功能对其执行某些操作。不仅如此，代码中还有一个整数列表，我们可以完全自由地使用内置列表功能来运行操作。\n\
    \n那么，设想一下，如果我们需要实现一个用户自定义的功能，并且它需要能兼容并适用于所有基本数据类型和用户自定义数据类型。因此，我们需要开发一个类似于 List（C#\
    \ 集合中自带的那种）的泛型类，并且它应包含与列表相同的方法（Add、AddRange、Where 等）。这些方法还必须能与新类所支持的相同数据类型集合一起工作。\n\
    \n那么，如何创建一个在运行时指定数据类型并执行其中方法的用户自定义类呢？C# 提供了一项名为泛型（Generics）的功能，为我们解答了这个问题。\n\n\
    ## 什么是泛型\n\n泛型是一种允许用户使用占位符定义类和方法的类。泛型是在 C# 语言 2.0 版本中引入的。使用泛型的基本思想是让类型（Integer、String\
    \ 等，以及用户自定义类型）成为类、方法和接口的参数。集合的一个主要限制是缺乏编译时类型检查。这实际上意味着你可以将任何对象放入集合中，因为 C# 编程语言中的所有类都派生自\
    \ object 基类。这实际上损害了类型安全性，并与 C# 作为一种类型安全语言的基本定义相矛盾。不仅如此，使用集合还会以隐式和显式类型转换的形式带来显著的性能开销，而这是向集合添加对象或从集合检索对象所必需的。\n\
    \n为了彻底解决类型安全问题，.NET 框架提供了泛型来创建具有类型占位符的结构、类、方法和接口。泛型通常用于为引用类型和值类型创建类型安全的集合。.NET\
    \ 框架在 System.Collections.Generic 命名空间中提供了大量的接口和类来实现泛型集合。\n\n### 泛型的特性\n\n泛型是一种可以在很多方面增强程序的技术，例如：\n\
    \n- 它允许你提高代码性能、代码复用性和类型安全性。\n- 你可以创建自己的泛型方法、类、接口和委托。\n- 你可以创建泛型集合类。.NET Framework\
    \ 类库在 System.Collections.Generic 命名空间中包含许多新的泛型集合类。\n- 你可以在运行时获取泛型数据类型中使用的类型信息。\n\
    \n与传统非泛型类型相比，泛型类型有以下一些重要特征，使其显得特别：\n\n- 类型安全。\n- 性能。\n- 二进制代码复用。\n\n### 类型安全\n\
    \n泛型最重要的特性之一是类型安全。对于非泛型的 ArrayList 类，如果使用对象，任何类型都可以添加到集合中，这有时会导致严重问题。下面的示例展示了将字符串、整数和一个对象添加到\
    \ ArrayList 类型的集合中：\n\n```cs\nArrayList obj = new ArrayList();\nobj.Add(50);\n\
    obj.Add(\"Dog\");\nobj.Add(new TestClass());\n```\n\n现在，如果该集合通过 foreach 语句以整数元素进行遍历，编译器会接受这段代码，但由于集合中的所有元素并非都是整数，运行时就会发生异常：\n\
    \n```cs\nforeach(int i in obj)\n{\n    Console.WriteLine(i);\n}\n```\n\n编程中的经验法则是，错误应该尽早被发现。对于泛型类\
    \ `Test<T>`，泛型类型 T 定义了允许的类型。通过 `Test<int>` 的定义，只能将整数类型添加到集合中。编译器不会编译以下代码，因为 Add()\
    \ 方法包含无效参数：\n\n```cs\nTest<int> obj = new Test<int>();\nobj.Add(50);\nobj.Add(\"\
    Dog\");        // compiler error\nobj.Add(new TestClass());   // compiler error\n\
    ```\n\n### 性能\n\n泛型的另一个关键特性是性能。使用非泛型集合类处理值类型时，一旦值类型被转换为引用类型，通常会产生装箱和拆箱的开销。\n\n\
    在下一个示例中，ArrayList 类存储对象，而 Add() 方法以整数参数被调用。因此，整数会被装箱。当使用 foreach 语句从 ArrayList\
    \ 读取值时，就会发生拆箱：¹\n\n```cs\nArrayList obj = new ArrayList();\nobj.Add(50);     \
    \ // boxing - convert value type to reference type\nint x = (int)obj[0]; // unboxing\n\
    foreach(int i in obj)\n{\n    Console.WriteLine(i);   // unboxing\n}\n```\n\n\
    泛型比其他集合（如 ArrayList）更快。\n\n与其使用对象，不如将 `TestClass<T>` 类的泛型类型定义为 int，这样编译器动态生成的类内部就会使用\
    \ int 类型。因此，装箱和拆箱不再发生，如下所示：\n\n```cs\nTestClass<int> obj = new TestClass<int>();\n\
    obj.Add(50);      // No boxing\nint x = obj[0]; // No unboxing\nforeach(int i\
    \ in obj)\n{\n    Console.WriteLine(i);      // No unboxing\n}\n```\n\n### 二进制代码复用\n\
    \n泛型提供了一种源代码复用。一个泛型类可以被定义一次，并用许多不同的类型进行实例化。泛型可以在一种支持 CLR 的语言中定义，并从另一种 .NET 语言中使用。下面的\
    \ `TestClass<T>` 分别使用 int 和 string 类型实例化：\n\n```cs\nTestClass<int> obj = new TestClass<int>();\n\
    obj.Add(50);\n\nTestClass<string> obj1 = new\nTestClass<string>();\nobj1.Add(\"\
    hello\");\n```\n\n### 泛型方法\n\n虽然大多数开发者通常会使用基类库中已有的泛型类型，但你当然也可以构建自己的泛型成员和自定义泛型类型。\n\
    \n这个示例的主要目标是构建一个交换（swap）方法，它可以通过单一类型参数对任何可能的数据类型（基于值或基于引用）进行操作。由于交换算法的性质，传入的参数将通过\
    \ ref 关键字以引用方式传递：\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
    \nnamespace GenericApp\n{\n    class Program\n    {\n        // Generic method\n\
