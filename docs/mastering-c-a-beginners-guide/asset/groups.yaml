  - '[PAGE 234]


    There will be no hidden state or any dependency on the outside world in pure functions.
    This fact will make testing much easier because we don’t have to worry about Mocking
    dependency or other hacks to prepare the functionality for a test.


    +   - Debugging is smoother in programs written in functional style.


    Writing pure functions that makes a program more obvious also can help with debugging.
    If we are aware with certainty what a function does, then all we have to do is
    to see what parameter was passed in and follow that value to see what went wrong.


    +   - The declarative approach makes it easier to understand the code.


    In object-oriented style of programming, we have statements that straightly alter
    and manipulate the values. This style of programming is known as imperative programming.
    But there is another style which is called declarative programming. In this kind
    of style, instead of changing the program directly, we write small pieces of functionality
    that do a specific thing and do it every well. In a way that it can be used with
    separate values, and we make up these functions together. As a result, we just
    announce what is required to be done instead of directly accumulate all the required
    calculations in one place. This eventually leads to a more readable code and can
    allow us to concentrate on solving the actual business problem.'
  - '[PAGE 235]


    +   - Method signature honesty.


    This concept means that method signature of pure functions is thoughtful. Often
    in nonfunctional codes, we will encounter methods with no return value or parameter
    that does something. By viewing the signature, we don’t know what the input and
    output of this function are and what it does. Also, the name of the methods is
    not an authentic source of information in this regard. So the only choice we have
    is to read the entire function.


    But in pure functions, we immediately receive a lot of information about what
    a function does just by looking at its signature. Sometimes that is all we need
    to know about a function, and that’s far more clear and faster than the nonpure
    functions.


    Functional programming is a kind of programming paradigm in C# that is always
    combined with object-oriented programming. C# allows you to use imperative programming
    using object-oriented concepts, but it also uses declarative programming.² In
    declarative programming, you are using a more descriptive way to define what you
    need to do and not how you need to do some action, as we discussed earlier. For
    example, imagine that you want to find the top 10 books with a price less than
    20 ordered by title. In functional programming, you can able to define something
    like:


    ```

    books.Where(price<20).OrderBy(title).

    Take(10);

    ```'
  - '[PAGE 236]


    Here, you just specify that you need to select books where the price is less than
    40, order them by title, and take the first twenty. As you can see, you do not
    specify how this has to be done – only what you need to do.


    The fundamental concept in functional programming is functions. In functional
    programming, we have to create functions as any other objects, manipulate them,
    pass them to other functions, etc. Therefore, we require more freedom as functions
    are not just parts of classes – they should be independent objects. In C#, you
    can use a function object as any other object type.


    # Function Types


    Function objects must have some type. In C#, we can define either generic functions
    or strongly typed delegates. Delegates might be acknowledged as a definition of
    function prototypes where the method signature is defined. “Instance objects”
    of delegate types are pointers to functions (static methods, class methods) with
    a prototype that matches the delegate definition. An example of a delegate definition
    is shown in the following code:


    ```

    delegate double MyFunction(double x);

    ```


    This delegate defines a prototype of a function that has a double argument and
    returns the result as a double value. Note that only types are significant; actual
    names of methods and their arguments are arbitrary. This delegate type matches
    several trigonometric functions, exponential, polynomial, logarithm, and other
    functions. For example, you can simply define a function variable that references
    some math function, executes it via a function variable,'
  - '[PAGE 237]


    and place the result in some other variable. An example is shown in the following
    listing:


    ```

    MyFunction f = Math.Sin;

    double y = f(4); //y=sin(4)

    f = Math.Exp;

    y = f(4);

    //y=exp(4)

    ```


    Instead of firmly typed delegates, you can definitely use generic function types
    Func<T1, T2, T3, …, Tn, TResult> where T1, T2, T3, …, Tn are types of the arguments
    (used if the function has some arguments), and Result is the return type. An example
    equivalent to the previous code is shown in the following listing:


    ```

    Func<double, double> f = Math.Sin;

    double y = f(4); //y=sin(4)

    f = Math.Exp;

    y = f(4);

    //y=exp(4)

    ```


    You can either define your named delegates or use generic types. Besides Func,
    you have two similar generic types:


    +   - `Predicate<T1, T2, T3, …, Tn>` that represents a function that returns a
    true/false value – equivalent to `Func<T1, T2, T3, …, Tn, bool>`

    +   - `Action<T1, T2, T3, …, Tn>` that represents a procedure that does not return
    any value – equivalent to `Func<T1, T2, T3, …, Tn, void>`'
  - "[PAGE 238]\n\nThe predicate is a function that takes some arguments and returns\
    \ either a true or false value. In the following example, a predicate function\
    \ that receives a string parameter is shown. The value of this function is set\
    \ to String.IsNullOrEmpty. This function accepts a string argument and returns\
    \ information whether or not this string is null or empty – therefore, it matches\
    \ the Predicate<string> type:\n\n```\nPredicate<string> isEmptyString = String.\n\
    IsNullOrEmpty;\nif (isEmptyString(\"Test\"))\n{\n    throw new Exception(\"'Test'\
    \ cannot be empty\");\n}\n```\n\nActions could be defined as procedures that can\
    \ be executed. They accept some arguments yet return nothing. In the following\
    \ example, one action that accepts string argument is shown, and it points to\
    \ the standard Console.WriteLine method:\n\n```\nAction<string> println = Console.WriteLine;\n\
    println(\"Test\");\n```\n\nWhen an action reference is called with the parameter,\
    \ the call is forwarded to the Console.WriteLine method. When you use Action types,\
    \ you just need to define the list of input parameters because there is no result.\
    \ In this example, Action<string> is equivalent to Func<string, void>.\n\nOnce\
    \ you define function objects, you can assign them other existing functions as\
    \ shown in the previous listings"
  - '[PAGE 239]


    or other function variables. Also, you can pass them to other functions as standard
    variables. If you want to assign a value to a function, you have the following
    possibilities:


    +   - Point the function object to reference some existing method by name.

    +   - Create an anonymous function using the lambda expression or delegate and
    assign it to the function object.

    +   - Create a function expression where you are able to add or subtract a function
    and assign that kind of multicast delegate to the function object


    Some examples of assigning values to functions are elaborated in the following
    listing:


    ```

    Func<double, double> f1 = Math.Sin;

    Func<double, double> f2 = Math.Exp;

    double y = f1(4) + f2(5); // y=sin(3) + exp(5)

    f2 = f1;

    y = f2(9);               // y=sin(9)

    ```


    In this case, methods are referred to as ClassName.MethodName. Instead of existing
    functions, you can dynamically create functions and assign them to variables.
    In this case, you can use either anonymous delegates or lambda expressions. An
    example is shown in the following listing:


    ```

    Func<double, double> f = delegate(double x) { return 3*x+1; }

    double y = f(4); // y=13

    ```'
  - '[PAGE 240]


    ```

    f = x => 3*x+1;

    Y = f(5);

    //y=16

    ```


    In this code, we have allocated a delegate that accepts a double argument x and
    returns a double value 3*x+1. As this dynamically created function matches, Func<double,
    double>, it can be allocated to the function variable. In the third line, an equivalent
    lambda expression is allocated. As you can see, the lambda expression is identical
    to the function: it is just a function representation in the format parameters
    => return-expression. In the following table, some lambda expressions and equivalent
    delegates are shown:


    | Lambda expression | Delegate |

    |---|---|

    | () => 3 | delegate(){ return 3; } |

    | () => DateTime.Now | delegate(){ return DateTime.Now; }; |

    | (x) => x+1 | delegate(int x){ return x+1; } |

    | x => Math.Log(x+1)-1 | delegate(int x){ return Math.Log(x+1)-1; } |

    | (x, y) => x+y | delegate(int x, int y){ return x+y;} |

    | (x, y) => x+y | delegate(string x, string y){ return x+y;} |


    Lambda expression must have part for definition of argument names – if lambda
    expression does not have parameters, empty brackets () should be placed. If there
    is only one parameter in the list, brackets are not needed. After => sign, you
    need to put an expression that will be returned.'
