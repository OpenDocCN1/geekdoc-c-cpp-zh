    functional programming, we don’t have to use a strictly functional language like
    Haskell.


    C# lets higher order functions through delegation. That means we can accept functions
    as parameters or return functions. In other words, functions are a first-class
    citizen in C#, which means we can structure together with a program in a functional
    manner just like functional languages.


    Functional programming is older than computers. It came basically from mathematical
    logic (lambda calculus). In functional programming, we program with functions,
    and they don’t change or mutate anything. They map an input to output.


    # FUNCTIONAL PROGRAMMING


    Functional programming is a kind of programming paradigm in which one developer
    tries to bind everything in pure mathematical functions style. After a programmer
    manages to build the function and sends the function to the computer, it’s the
    computer’s turn to do its job. In general, the role of the computer is to evaluate
    the expression in the function and return the result. We can imagine that the
    computer acts as a calculator since it will analyze the expression from the function
    and yield the result to the user in a printed format. The calculator will evaluate
    a function composed of variables passed as parameters and expressions that form
    the body of the function. Their values substitute variables in the expression.
    We can give simple expressions and compound expressions using algebraic operators.
    Since expressions without assignments never alter the value, sub expressions need
    to be evaluated only once.'
  - '[PAGE 233]


    Suppose we have the expression 3 + 5 inside a function. The computer will return
    8 as the result right after it thoroughly evaluates it. However, this is just
    a simple example of how the computer acts in evaluating an expression. A programmer
    can increase the computer''s ability by creating a complex definition and expression
    inside the function. Not only can the computer evaluate the simple expression,
    but it can also evaluate the complex calculation, and expression is a declarative
    type of programming style. Its primary focus is how to solve instead of an imperative
    style where the exact direction is how to solve it. It uses expression instead
    of statements. An expression is evaluated to create a value, whereas a statement
    is executed to assign variables.


    # Benefits of Functional Programming¹


    +   - Pure functions make it simpler to reason about our code.


    One of the most significant things that help us understand a piece of code better
    is to know where the source of change is. It is imperative because if we know
    for sure what a piece of code does and doesn''t do, then we can alter our code
    with more conviction. Another benefit that this sort of code clarity can bring
    is when we need to find a problem in a system or debug.


    +   - Testing pure functions are easier.'
