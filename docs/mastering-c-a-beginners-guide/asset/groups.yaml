    # REFERENCE TYPE AND VALUE TYPES


    Data types in C# have two distinct flavors: value types and reference types. In
    order to get the difference, it helps to contemplate how space is allocated in
    C#. Whenever a method is called, the space that has to execute that method is
    allotted from a data structure called the call stack. The space for a method contains
    its local variables, including its parameters, but it has exceptions like out
    or ref parameters.


    Value types are two kinds:


    +   1. structures

    +   2. enumerations


    Typically, structures contain numeric types such as int, double, and char.


    Because value types are stored entirely in variables, whenever a value is allocated
    to a variable of a value type, the entire value should be written to the variable.
    For performance reasons, value types, therefore, should be significantly small.


    In the case of reference types, the values are not saved directly into the space
    allotted for the variable. Instead, the variable saves a reference, which is like
    an address where the value of the variable can definitely be found. When a reference
    type is developed with a new expression, space for that instance is allocated
    from a large data structure called the heap (which is unrelated to a heap used
    to implement a priority queue).


    The heap basically stands for a large pool of available memory from which space
    of multiple sizes may be allocated at any time. It is more complex and less efficient
    than the stack. When space for a reference type is allotted from the heap, a reference
    to that space is saved in the variable.'
