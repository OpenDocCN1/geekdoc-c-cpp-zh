    \ operators. Operators let us perform different types of operations on operands.\
    \ In C#, operators can be categorized according to their different functionality:\n\
    \n- Arithmetic operators.\n- Relational operators.\n- Logical operators.\n- Bitwise\
    \ operators.\n- Assignment operators.\n- Conditional operator.\n\nIn C#, operators\
    \ can also be categorized based upon the number of operands:\n\n- **Unary operator:**\
    \ Operator that picks one operand to perform the operation.\n- **Binary operator:**\
    \ Operator that picks two operands to perform the operation.\n- **Ternary operator:**\
    \ Operator that picks three operands to perform the operation.\n\nWe will look\
    \ into the details of different operators in the last part of this chapter.\n\n\
    ### BASIC DATA TYPES IN C#\n\nThe C# language brings with it a set of basic data\
    \ types. These data types are always used to build values that are applied within\
