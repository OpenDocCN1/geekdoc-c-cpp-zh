    ASP 自有其用武之地，但制作该产品所需的软件是付费应用。Java 被用于开发 Web 应用，并在熟悉 C 和 C++ 的开发者中颇受欢迎。微软没有将新语言命名为
    C++，而是决定使用 C#（读作 C sharp），这个名称来源于乐理中“音符升半音”的记号。C# 团队持续创新，不断添加新的特定功能。


    本章介绍 C# 语言重要版本的历史，因为该团队正专注于显著的创新，并不断为这门语言增添出色的功能。


    - C# 1.0 版本。

    - C# 1.2 版本。

    - C# 2.0 版本。

    - C# 3.0 版本。

    - C# 4.0 版本。


    最重要的是，当 IEnumerator 实现 IDisposable 时，生成的代码在 foreach 循环中会调用 Dispose 方法。


    ### C# 2.0 版本


    随着 Visual Studio 2005（此前代号为 Whidbey）的发布，C# 携众多创新回归。C# 语言已成功升级到 2.0 版本，并带来了若干语言扩展。除了泛型类型之外，C#
    语言还引入了其他令人兴奋的特性，例如迭代器、分部类、匿名方法、分部类型和可空值类型。


    C# 2.0 的其他特性主要是在已有功能的基础上追加能力：


    - Getter/setter 独立可访问性。

    - 方法组转换（委托）。

    - 静态类。

    - 委托推断。


    虽然 C# 最初可能只是一门普通的面向对象语言，但 2.0 版本彻底改变了这一点。一旦他们完全掌控了这些特性，便着手解决一些复杂的开发者痛点，而且是以一种意义重大的方式去解决的。


    ### C# 3.0 版本


    C# 3.0 作为 .NET 3.5 版本的一部分发布。该版本明确添加的许多特性都用于支持语言集成查询（LINQ）。


    新增特性列表：


    - LINQ。

    - Lambda 表达式。

    - 扩展方法。

    - 匿名类型。

    - 隐式类型变量。

    - 对象和集合初始化器。

    - 自动实现的属性。

    - 表达式树。


    回过头来看，上述许多特性似乎既不可避免又密不可分。它们在战略上相互契合。人们普遍认为，C# 这一版本的杀手级特性是查询表达式，也就是广为人知的语言集成查询（LINQ）。


    更细致的看法则是将表达式树、Lambda 表达式和匿名类型视为 LINQ 的基础。但无论如何，C# 3.0 引入了令人叹为观止的概念。C# 3.0 已开始为将
    C# 转变为混合型面向对象/函数式语言奠定基础。重要的是，你现在可以编写类似 SQL 的声明式查询来对集合等对象执行操作。


    ### C# 4.0 版本


    微软于 2010 年 4 月随 Visual Studio 2010 发布了这一版本的 C#。Mono C# 编译器在 2010 年 10 月随 Mono
    2.8 发布时完全支持了该新版本。这一版本确实引入了一些有趣的新特性：


    - 动态绑定。

    - 命名/可选参数。

    - 泛型协变与逆变。

    - 嵌入式互操作类型。


    C# 语言的新版本带来了一种新类型：dynamic。一旦变量被声明为 dynamic 类型，对这些值的操作不会在编译时完成或验证，而是完全在运行时进行。这也被称为鸭子类型。


    嵌入式互操作类型缓解了为应用程序创建 COM 互操作程序集的部署难题。泛型协变和逆变让你在运用泛型时拥有更强大的能力，但它们有点学术化，可能最受框架和类库作者的青睐。命名参数和可选参数让你能减少许多方法重载，并提供便利。但这些特性都算不上彻底改变编程范式的变革。


    ### C# 5.0 版本


    随 Visual Studio 2012 发布的 C# 5.0 是一个高度聚焦的语言版本。该版本几乎所有的开发精力都投入到了另一个颠覆性的语言概念上：用于异步编程的
    async 和 await 模型。以下是主要特性列表：


    - 异步方法。

    - 调用方信息特性。


    Async 特性引入了两个关键字：async 和 await，让你能够像编写同步代码一样，更快、更直观地编写异步代码。在 C# 5.0 之前，编写异步代码需要定义回调（也称为
    continuation）来捕获异步过程完成之后要执行的操作。这会让你的代码以及异常处理等其他常规任务变得复杂。调用方信息可以帮你进行跟踪、调试和创建诊断工具。它还能帮助你避免在许多方法中为了同一目的而重复编写代码，例如日志记录和跟踪。


    ### C# 6.0 版本


    借助 3.0 和 5.0 版本，C# 在面向对象语言中增添了重大而卓越的新特性。而在随 Visual Studio 2015 发布的 6.0 版本中，C#
    没有推出统治级的杀手特性，而是发布了大量较小的特性，使 C# 编程更高效。C# 6.0 版本包含许多能提升开发者生产力的关键元素。以下是其中一部分：


    - using static。

    - 异常筛选器。

    - 自动属性初始化器。

    - 表达式体成员。

    - 空传播运算符。

    - 字符串插值。

    - nameof 运算符。

    - 索引初始化器。

    - 在 catch/finally 块中使用 await。

    - 仅 getter 属性的默认值。


    这些特性本身都各有趣味。但如果把它们放在一起看，你会发现一个有趣的模式。在这个版本中，C# 消除了语言中的样板代码，使代码更简洁、更易读。因此，对于喜欢简洁、干净代码的人来说，这个语言版本是一场巨大的胜利。


    ### C# 7.0 版本


    随着 Visual Studio 2017（2017 年 3 月 7 日）的发布，我们迎来了 C# 的新版本——C# 7.0。其中有许多令人兴奋的新特性，在现有特性之上很好地进行了构建。


    以下是 C# 新特性概览：


    - out 变量。

    - 模式匹配。

    - 元组。

    - 解构。

    - 弃元。

    - 局部函数。

    - 二进制文本。

    - 数字分隔符。


    '
