  - '[PAGE 65]


    An assembly reference list is, in essence, a list of all external dependencies,
    such as .dlls or other files. Assembly references include references to both global
    and private objects. Global objects are accessible to all other applications.
    In .NET Core, global objects are coupled with a particular .NET Core runtime.
    In .NET Framework, global objects house in the GAC. System.IO.dll is a perfect
    example of an assembly in the GAC. Private objects must be in a directory level
    at or below the directory in which your app is installed.


    # What Are the Benefits of Using Assemblies?


    Assemblies are mainly introduced to sort out the problems of versioning, DLL conflicts,
    and simplifying deployment. Most end users have experienced versioning or deployment
    issues when installing a new version or a new application of an existing one.
    There are many circumstances where you install a new application only to find
    an existing one stopped working, and the system cannot recover from that. Many
    developers spent much of their time retaining the registry entries consistency
    to activate a COM class. All this frustration happens because of versioning issues
    that occur with component-based applications.


    # Versioning Problems


    Two versioning problems occur with WIN32 applications. The versioning rules are
    enforced by the OS and are not between the pieces of an application. Backward
    compatibility between the new part of code and the old one is the current way
    of versioning, and this is almost impossible to maintain in most applications.
    Besides that, only a single'
  - '[PAGE 66]


    version of an application is admitted and executed on a computer at any given
    point in time. The second issue is that there is no way to maintain consistency
    between components created together and the current present group at run time.


    # DLL Conflicts


    As a result of the above two versioning problems, DLL conflicts do emerge. When
    installing a new application, an existing one may break because the new one installed
    a new version of a component or a DLL that is not fully backward compatible enough
    with the previous one.


    # The Solution


    To sort out the above problems, Microsoft started a sophisticated way in its Windows
    2000 platform. Windows 2000 provides you the capacity to place DLL files used
    by your application in the same directory as your application’s exe file to convince
    use the correct version designed for use. Besides that, Windows 2000 locks files
    that exist in the System32 directory to prevent their replacement when newer applications
    are installed, and this contains the DLLs used by existing applications from being
    replaced and so avert the crashing of existing applications.


    The .NET framework established assemblies as an evolution toward the complete
    solution of versioning problems and DLL conflicts. Assemblies on their core design
    allow developers to specify version rules between components, offer the infrastructure
    required to impose these rules, and enable different versions of the part to be
    run side by side simultaneously.'
