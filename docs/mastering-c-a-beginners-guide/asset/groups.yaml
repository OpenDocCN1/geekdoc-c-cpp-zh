    5, 6, 7, 8, 9, 10};

    Console.WriteLine("Sum: " + numbers.Sum());

    //55

    Console.WriteLine("Min: " + numbers.

    Where(x=> x >= 2).Min()); //2

    Console.WriteLine("Max: " + numbers.Where(x

    => x < 7).Max()); //6

    //Returns the number of elements: 10

    Console.WriteLine("Count: " + numbers.

    Count());

    //Returns the average of numbers whose

    value is > 3. Result: 7

    Console.WriteLine("Average: " + numbers.

    Where(x => x > 3).Average());

    ```


