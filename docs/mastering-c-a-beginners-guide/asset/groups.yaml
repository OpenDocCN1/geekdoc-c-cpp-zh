    \ Twitter、流媒体服务如 Netflix、消息应用如 WhatsApp，代码都构成了所有事物的基础。今天互联网上有超过 17 亿个网站，所有这些都由某种编程语言驱动。它在行业和研究中不断演进，因为系统和应用在不断变化。编程是创建软件、应用程序和网站的过程。它是一种人工语言，可用于控制机器，特别是计算机或其他设备如手机的行为。我们已经知道，计算机或其他类似技术无法自行思考；它们需要用户提供有序的指令集来知道该做什么。所以编程在这里发挥作用。它用于促进关于组织和操纵信息以及精确表达算法的沟通。它的语言与大多数其他形式的人类表达完全不同，因为它们需要更高的精确度和完整性。\n\
    \n这种语言被称为“代码”。你在计算机和互联网上使用的大多数资源都是用代码制作的。学习这种编码很简单。你只需要一些想法和合适的工具。编码一个应用涉及拍照、设计应用、测试它并发布它。没有比今天更好的开发应用的理想时间了。令人惊讶的是，一旦你的应用登陆\
    \ Google Play 和 App Store，你就拥有了巨大的市场。如果你是移动应用开发世界的新手，但热切地想以某种方式自己参与其中，本书是一份详细的指南，将帮助学习者开始\
    \ C# 编程。它首先谈论基础知识，然后转向实践练习，帮助读者快速获得所需的知识。\n\n## C# 编程语言简介\n\nC# 是一种通用、高级且面向对象的编程语言，发音为“C\
    \ sharp”，由 Microsoft 创建，运行于 .NET Framework 上。C# 源自 C 家族，其语言接近其他流行语言如 C++ 和 Java。第一个版本于\
    \ 2002 年发布。最新版本 C# 8 于 2019 年 9 月发布。C# 已被 ECMA 和 ISO 认可为标准。C# 专门为通用语言基础结构 Common\
    \ Language Infrastructure CLI 设计。它是描述可执行代码及其运行环境的标准的。C# 最初被称为 C-like Object-Oriented\
    \ Language COOL，但更改了名称以避免商标问题。由于 C# 是在 Microsoft 的 .NET Framework 计划中形成的，它提供了各种集成开发环境\
    \ IDE 来顺利运行 C# 程序。\n\n虽然 C# 可以被各种程序员更好地使用，但语言用户群的大部分由偏爱 Microsoft 平台的人组成。\n\n\
    ## 什么是 C#\n\nC# 发音为“C-sharp” 是 Microsoft 的一种基于对象的编程语言，重点在于将 C++ 的计算能力与 Visual\
    \ Basic 的编程简易性相结合。C# 基于 C++，并包含与 Java 相似的功能。它是 C 和 C++ 的混合体。C# 通常用于后端服务、Windows\
    \ 应用、网站开发和游戏开发。\n\nC# 安排为与 Microsoft 的 .NET 平台一起工作。Microsoft 的主要目标是促进通过网络交换信息和服务，并让开发人员构建高度可移植的应用。C#\
    \ 通过使用可扩展标记语言 XML 和简单对象访问协议 SOAP 使编程变得顺畅，这允许访问编程对象或方法而无需程序员为每个步骤编写额外代码。这是一件相当有趣的事情。你知道一件事吗？程序员可以在此基础上构建现有代码，而不是反复重复它。C#\
    \ 预计会使新产品和服务的上市更快、成本更低。C# 程序在 .NET 和一个名为通用语言运行时的虚拟执行系统 CLR 上运行，并包含许多类库。CLR 是 Microsoft\
    \ 对 CLI 的实现，这是一个国际标准。CLI 是创建执行和开发环境的平台，在这些环境中语言和库可以持续协同工作。\n\n用 C# 编写的源代码被编译为符合\
    \ CLI 规范的中间语言 IL。IL 代码及其资源，如位图和字符串，被保存在一个通常以 .dll 结尾的程序集中。一个包包含一个清单，提供有关程序集的类型、流派和文化的信息。\n\
    \n当 C# 程序运行时，程序集被加载到 CLR 中。CLR 执行即时 JIT 编译，将 IL 代码更改为本地机器指令。CLR 提供与自动垃圾回收、异常处理和资源管理相关的其他服务。由\
