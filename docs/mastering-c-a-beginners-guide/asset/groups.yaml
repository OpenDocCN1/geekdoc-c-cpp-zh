    contravariant type parameters.

    +   - Variance applies only to reference types; if you specify a value type for
    a variant type parameter, that type parameter is invariant for the resulting constructed
    type.

    +   - Variance does not apply to delegate combination. That is, given two delegates
    of types Action<Derived> and Action<Base> (Action(Of Derived) and Action(Of Base)
    in Visual Basic), you cannot combine the second delegate with the first, although
    the result would be type safe.'
