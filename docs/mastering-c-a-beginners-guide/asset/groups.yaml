    method, because the method’s parameter is of type Base.


    In general, a covariant type parameter can be applied as the return type of a
    delegate, and contravariant type parameters can be seen as parameter types.


    Basically, both covariance and contravariance are referred to as variance. A generic
    type parameter that is not set as covariant or contravariant is referred to as
    invariant. A summary of facts about variance in the common language runtime:


    +   - Variant type parameters are restricted to generic interface and generic
    delegate types.

