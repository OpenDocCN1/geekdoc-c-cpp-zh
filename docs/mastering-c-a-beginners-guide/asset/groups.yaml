    IEnumerable<Base> b = d;

    ```


    The List<T> class implements the IEnumerable<T> interface, so List<Derived> (List(Of
    Derived) in Visual Basic) implements IEnumerable<Derived>. The covariant type
    parameter does the rest.


    Contravariance, on the other hand, seems counterintuitive. The below example creates
    a delegate of type Action<Base> (Action(Of Base) in Visual Basic) and then allocate
    that delegate to a variable of type Action<Derived>:


    ```

    Action<Base> b = (target) => { Console.

    WriteLine(target.GetType().Name); };

    Action<Derived> d = b;

    d(new Derived());

    ```


    It might seem backward, but it is type-safe code that compiles and runs. The lambda
    expression matches the delegate it’s assigned to, so it defines a method that
    takes one parameter of type Base and has no return value. The resulting delegate
    can be assigned to a variable of type Action<Derived> because the type parameter
    T of the Action<T> delegate is contravariant. The code is type-safe because T
    specifies a parameter type. When the delegate of type Action<Base>'
