    \      Console.WriteLine(\"After swap: {0}, {1}\", a, b);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n### 泛型类和方法\n\nC# 也有并非针对特定类型设计，而是可以用于任何常规类型的类和方法。\n\
    \n我们通常使用 `<>` 尖括号来实现这一目的。假设我们用 `<T>` 设置了一个类或方法，并在方法或类内部对 `T` 执行各种操作。当我们在调用时加上整数类型——`<int>`，那么在编译期间，类或方法内部的\
