    \        TheAnswerToLife);\n}\n```\n\n然而，大多数常量是在类级别声明的，这样它们可以被所有类方法甚至类外部访问（当然，不能被修改），具体取决于可见性。常量将充当类的静态成员，这意味着你无需实例化该类即可访问它。考虑到这一点，让我们尝试一个完整的示例，其中定义了两个常量——一个私有常量和一个公共常量：\n\
    \n```\nusing System;\n\nnamespace Constants\n{\n    class Program\n    {\n   \
    \     static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    The fake answer to life: \" + SomeClass.TheFakeAnswerToLife);\n            Console.WriteLine(\"\
    The real answer to life: \" + SomeClass.GetAnswer());\n        }\n    }\n\n  \
    \  class SomeClass\n    {\n        private const int TheAnswerToLife = 42;\n \
    \       public const int TheFakeAnswerToLife = 43;\n\n        public static int\
    \ GetAnswer()\n        {\n            return TheAnswerToLife;\n        }\n   \
    \ }\n}\n```\n\n请注意，我定义了一个包含两个常量的类（SomeClass）。第一个是私有的，因此只能从类本身访问，而另一个是公共的。因此，在我们的主程序代码中，我以不同的方式访问这两个常量——首先直接访问，因为假的答案是公开的；其次借助\
    \ GetAnswer() 方法访问。\n\n## 哪些类型可以用作常量？\n\n由于常量必须立即声明并且以后不能更改，因此你分配给常量的值必须是常量表达式。编译器必须已经在编译时计算该值。这意味着数字、布尔值和字符串可以很好地用作常量，而例如\
    \ DateTime 对象不能用作常量。\n\n由于编译器需要立即知道该值，这也意味着在设置值时会有一些限制。例如，以下是可以做的完美示例：\n\n```\n\
    const int a = 10;\nconst float b = a * 2.5f;\nconst string s1 = \"Hello, world!\"\
    ;\nconst string s2 = s1 + \" How are you?\";\n```\n\n另一方面，你不能使用方法调用或非常量类成员的结果，因为它们不是常量表达式。让我们讨论一些不能做的示例：\n\
    \n```\n// NOT possible:\nconst int a = Math.Cos(4) * 2;\n// Possible:\nconst string\
    \ s1 = \"Hello, world!\";\n// NOT possible:\nconst string s2 = s1.Substring(0,\
    \ 6) + \" Universe\";\n```\n\n区别在于，编译器在处理你的代码时预期能知道什么，例如数字、字符串和其他常量，而不是为了获取值而必须执行什么。\n\
    \n## 常量的替代方案：只读字段\n\n如果你正在寻找一个限制稍宽松的类常量版本，你可能想看看 readonly 关键字。它在方法级别不可用。不过，它可以在类级别使用，定义一个只能在声明期间或类的构造函数方法执行期间修改的字段。因此，一旦对象可供使用，只读字段将永远具有相同的值，并且用户无法修改。让我们尝试一下：\n\
    \n```\nclass SomeClass\n{\n    private readonly DateTime rightNow;\n    public\
    \ readonly DateTime later = DateTime.Now.AddHours(2);\n\n    public SomeClass()\n\
    \    {\n        this.rightNow = DateTime.Now;\n    }\n}\n```\n\n所以，我们有两个只读字段：第一个是私有的，第二个是公共的（通常我们会用属性来做这件事，但请耐心听我说）。第一个在声明时没有值（与常量不同，只读字段可以这样），而另一个会立即初始化。你还会注意到，我们使用\
    \ DateTime 类作为数据类型，并为其分配了一个非常量值。换句话说，我们做了很多用常量无法做到的事情，这使得只读字段成为常量的绝佳替代方案。\n\n\
    请注意，我们在 SomeClass 类的构造函数中如何为 rightNow 字段赋值。如前所述，这是给只读字段赋值的最后机会。之后，无论你是在定义类内部的方法中还是在外部，如果给只读字段赋值，都会出现编译错误。\n\
    \n## 引用类型和值类型\n\nC# 中的数据类型有两种不同的种类：值类型和引用类型。为了理解它们的区别，思考一下 C# 中空间是如何分配的会有所帮助。每当调用一个方法时，执行该方法所需的空间从称为调用栈的数据结构中分配。方法的空间包含其局部变量，包括参数，但也有像\
    \ out 或 ref 参数这样的例外。\n\n值类型有两种：\n\n1. 结构体\n2. 枚举\n\n通常，结构体包含数值类型，如 int、double\
    \ 和 char。\n\n因为值类型完全存储在变量中，所以每当为值类型的变量分配值时，整个值都应该写入该变量。因此，出于性能原因，值类型应该非常小。\n\n\
    对于引用类型，值不会直接保存到分配给变量的空间中。相反，变量保存一个引用，它就像一个地址，变量的值可以确定地在那里找到。当使用 new 表达式创建引用类型时，该实例的空间从称为堆的大型数据结构中分配（堆与用于实现优先级队列的堆无关）。\n\
    \n堆基本上代表一个大的可用内存池，可以随时从中分配不同大小的空间。它比栈更复杂且效率更低。当从堆中为引用类型分配空间时，该空间的引用会保存在变量中。\n"
