    anyway. Mathematically, we could simply write each of the terms that we have described
    using a formula:


    +   - F(n) = F(n-1) + F(n-2),


    With the base values F(0) = 0, and F(1) = 1. To calculate the other numbers, we
    adhere to the the above relationship.


    An example for it is F(2) is the sum f(0) and f(1), which is equal to 1.


