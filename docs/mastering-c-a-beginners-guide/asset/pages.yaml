    provides us an answer to this.


    # WHAT ARE GENERICS


    Generic is a class that lets the user define classes and methods with the placeholder.
    Generics were incorporated into version 2.0 of the C# language. The fundamental
    idea behind using Generic is to let type (Integer, String, ... etc., and user-defined
    types) be a parameter to classes, methods, and interfaces. A main limitation of
    collections is the absence of productive type checking. This actually means that
    you can put any object in a collection as all classes in the C# programming language
    stick out from the object'
