    # INTRODUCTION TO C# PROGRAMMING LANGUAGE


    C# is a general-purpose, advanced and Object-Oriented Programming Language pronounced
    as “C sharp” created by Microsoft that runs on the .NET Framework. C# has roots
    in the C family, and the language is close to other popular languages like C++
    and Java. The first version was released in the year 2002. The latest version,
    C# 8, was released in September 2019. C# is recognized as a standard by ECMA and
    ISO. C# is specifically designed for Common Language Infrastructure (CLI). It’s
    a standard for describing executable code and the environment in which it runs.
    C# was initially known as C-like Object-Oriented Language (COOL) but altered the
    name to prevent trademark concerns. Since the C# is formed within the .Net Framework
    initiative by Microsoft, it provides various integrated development environments
    (IDEs) to run C# programs smoothly.


    While C# can be put to better use in the hands of all sorts of programmers, a
    large part of the language’s user base comprises those who are partial to the
    Microsoft platform.


    # WHAT IS C#


    C# (pronounced “C-sharp”) is an object-based programming language from Microsoft
    that significantly focuses'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'on combining the computing power of C++ with the programming ease of Visual
    Basic. C# is based on C++ and includes features similar to those of Java. It’s
    a blend between C and C++. C# is commonly used for backend services, windows applications,
    website development, and game development.


    C# is arranged to work with Microsoft’s .NET platform. Microsoft’s main aim is
    to facilitate exchanging information and services over the web and let developers
    build highly portable applications. C# smoothen programming by using Extensible
    Markup Language (XML) and Simple Object Access Protocol (SOAP), which allowed
    access to a programming object or method without requiring the programmer to write
    additional code for each step. That is something quite interesting. Do you know
    one thing? Programmers here can build on existing code rather than repeatedly
    duplicating it. C# is expected to make it faster and less expensive to market
    new products and services. C# programs run on .NET and a virtual execution system
    called the common language runtime (CLR) and included many class libraries. The
    CLR is the implementation of the CLI by Microsoft, an international standard.
    The CLI is the ground for creating execution and development environments in which
    languages and libraries work together continuously.


    Source code written in C# is compiled into an intermediate language (IL) that
    matches the CLI specification. The IL code and its resources, like bitmaps and
    strings, are saved in an assembly, which usually ends in.dll. A pack includes
    a manifest that provides information about the assembly’s types, genre, and culture.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'When the C# program is carried out, the assembly is filled into the CLR. The
    CLR performs Just-In-Time (JIT) compilation to change the IL code to native machine
    instructions. The CLR gives other services related to automatic garbage collection,
    exception handling, and resource management. Code carried out by the CLR is sometimes
    referred to as “managed code,” in comparison with “unmanaged code,” which is composed
    into native machine language that selects a specific platform.


    Language interoperability is a crucial feature .NET. IL code produced by the C#
    compiler conforms to the Common Type Specification (CTS). IL code generated from
    C# can simply interact with code generated from the .NET versions of F#, Visual
    Basic, C++, or any of more than 20 other CTS-compliant languages. A single assembly
    may include different modules written in different .NET languages, and the types
    can reference each other as if they were written in the same, unique language.


    Besides the runtime services, .NET also includes comprehensive libraries. These
    libraries support many different kinds of workloads. They’re organized into namespaces
    that give a wide variety of proper functionality for everything from file input
    and output to string manipulation to XML parsing, web application frameworks,
    and Windows Forms controls. The typical C# application utilizes the .NET class
    library considerably to handle every day “plumbing” chores.


    # WHY C# MATTERS


    As a beginner, it’s pretty simple to learn C#; to know C#, you should have at
    least a basic idea of writing code, even if'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'you have yet to build your first application or program. The learning curve
    for C# is comparatively low when compared to more complex languages.


    C# is an excellent choice for developers with moderate to advanced experience
    with writing code. While experts admit the language is one of the reasonable complexities,
    they agree that it’s relatively simple to grasp and outperform. Once you’re introduced
    to C# and put in the time to get the hang of it, you can expect to advance quickly
    from an amateur to an expert.


    This is since C# is a first-class language, which means it’s relatably easy to
    grasp and write, making it a splendid choice for beginners and a convenient option
    for experts. In addition to readability, C# can also automate complex tasks that
    require a lot of time to achieve minor results.


    This programming language is also statistically typed, which means that errors
    are identified before the application goes live. This makes it simple to detect
    minor flaws in your stack that would otherwise be almost.


    # HISTORY OF C#


    In 2000, Microsoft announced its initial version of C# as a part of the .NET Framework.
    VB.NET was also an alternative, but VB.NET stuck to the standard Microsoft Visual
    Basic syntax, while C# was close to Java, a C-style language. The name was given
    to C# firstly was “Cool.” Microsoft was conscious of working with a language very
    approximately to C++, so they wanted to specify that its new language was one
    step higher than C++. C# is a newly discovered language on the market developed
    by Microsoft. Initially, Microsoft advanced and deployed the'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Active Server Pages (ASP) language. This language is now labeled Classic ASP,
    and its support has been discontinued. ASP lets programmers generate VB-like scripts
    to enlarge dynamic web pages. These sort of web pages continued on aged Internet
    information Services (IIS) servers running Windows. Some Linux providers also
    supported Classic ASP, but it was routinely a nonstandard way to create web pages.
    In the late 1990s, Microsoft decided to make a language that fought a tight-spirited
    fight with Java. During this course of time, Java was the most common language,
    and its popularity was rising. Classic ASP had its place, but the software required
    to create the product was a paid application. Java was used to develop web applications,
    and it was favored among developers who understood C and C++. Instead of label
    the new language C++, they decided to use the name C# (pronounced C sharp), which
    attributes the musical notation that a note should be higher in pitch. The C#
    team is continuing to innovate and add new specific features.


    This chapter provides a history of a significant release of the C# language as
    they are meticulously focusing on remarkable innovation and adding spectacular
    features to this.


    +   - C# version 1.0.

    +   - C# version 1.2.

    +   - C# version 2.0.

    +   - C# version 3.0.

    +   - C# version 4.0.'
