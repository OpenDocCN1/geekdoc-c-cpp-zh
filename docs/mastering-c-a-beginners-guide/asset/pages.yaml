    # Static and Instance Methods


    A static method is a kind of method declared with a static modifier. It can only
    directly access static members and can’t operate on a specific instance.


    An instance method is a method declared without a static modifier. It runs on
    a specific instance and can easily acquire both static and instance members. The
    example on which an instance method was invoked can be accessed like this. It’s
    a mistake to refer to this in a static method.


    # Method Overloading


    Because of method overloading, various methods in the same class can have the
    same name as long as their signatures are distinct. The compiler uses overload
    resolution to find the exact method to invoke when compiling an invocation of
    an overloaded method. Overload resolution finds the one method that appropriately
    suits the arguments. An error will be reported if no single best match can be
    found.


    The following example indicates overload resolution in effect. The comment for
    each of the invocations in the UsageExample method invokes which method is invoked.'
