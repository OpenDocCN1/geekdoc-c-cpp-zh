    Programming is built upon principles that almost never change over the years,
    and this book teaches you these very principles. You should realize that the essence
    of programming is to control the work of the computer on different levels. This
    is done with the help of “orders” and “commands” from the programmer, also known
    as programming instructions. To “program” means to coordinate the work of the
    computer through sequences of instructions. These commands are given in written
    form and are implicitly followed by the computer (respectively by the operating
    system, the CPU and the peripheral devices). Thus, to “program” means to be able
    to script multiple sequences of instructions in order to organize the work of
    the computer to achieve something as a result. These sequences of instructions
    are called “computer programs” or “scripts.”


    A sequence of steps to achieve, complete some work, or get a certain result is
    called an algorithm. This is how programming is related to algorithms.


    To put it simply, programming involves describing what you want the computer to
    do by a sequence of steps. And programmers are the professionals who create these
    instructions, which control computers. These instructions'
