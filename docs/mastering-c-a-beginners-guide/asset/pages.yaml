  md: '# Object-Oriented

    Programming in C#


    # IN THIS CHAPTER


    +   - What is OOP

    +   - Implementation of OOP

    +   - Encapsulation and Inheritance


    We have explored user-defined types in the last chapter and now will discuss Object-oriented
    programming (OOP) in C#. It is a kind of programming structure where programs
    are arranged around objects as an alternative to action and logic. This is a design
    that uses a different set of programming languages, such as C#. Understanding
    OOP concepts can help decide how we should design an application and what language
    to use.'
