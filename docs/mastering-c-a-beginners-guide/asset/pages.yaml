    The value data types are integer-based and floating-point based. C# language supports
    both signed and unsigned literals.


    There are two types of value data type in C# language:


    +   1. **Predefined Data Types:** includes values like Integer, Boolean, Float

    +   2. **User-defined Data Types:** consists of Structure and Enumerations


    The memory size of data types may vary from 32 or 64 bit operating system.'
