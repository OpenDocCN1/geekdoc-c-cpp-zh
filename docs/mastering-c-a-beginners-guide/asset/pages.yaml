    # ASSEMBLIES IN .NET


    The primary building block in the Assembly. Applications that use the .NET Framework.
    It is a compiled code that the CLR can simply execute. It is a collection of resources
    and types created to work together and build a logical base of functionality.
    It can be a DLL or exe based upon the project that we choose. You may create an
    assembly from one or more source code files in .NET Core and .NET Framework. In
    .NET Framework, assemblies can include one or more modules. This provides larger
    projects to be designed so that other developers can work on different source
    code files or modules, which are incorporated to build a single assembly. Assemblies
    are essentially the building blocks of .NET Framework applications. Metadata is
    created with Microsoft Intermediate Language (MSIL) and placed in Assembly Manifest
    between this compiling time. Both Metadata and MSIL are wrapped together in a
    Portable Executable (PE) file. Assembly Manifest contains information about itself.
    This information is called Assembly Manifest, and it includes information about
    the types, references, members, and all the other data that the runtime requires
    for execution.


    Every assembly you create contains one or more program files and a Manifest. Process
    Assemblies (EXE) and'
