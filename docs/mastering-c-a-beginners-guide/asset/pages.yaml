    # Constructors


    C# supports both instance and static constructors.


    +   - **Instance constructor:** a member that implements the actions required
    to initialize an instance of a class.

    +   - **Static constructor:** a member that carries out the actions needs to initialize
    a class itself when it’s first loaded.


    A constructor is announced like a method with no return type and the same name
    as the containing class. If a constructor declaration contains a static modifier,
    it declares a static constructor. If this is not the case, an instance constructor
    is declared.


