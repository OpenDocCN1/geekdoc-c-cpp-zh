- pgno: 46
  md: 'The following is the outline for the kinds of members a class can contain:


    +   - **Fields:** Variables that are related to the class.

    +   - **Types:** Nested types declared by the class.

    +   - **Properties:** Actions related to reading and writing named properties
    of the class.

    +   - **Constants:** Constant values associated with the class.

    +   - **Indexers:** Actions related to indexing instances of the class like an
    array.

    +   - **Events:** Notifications that the class can create.

    +   - **Operators:** Conversions and expression operators aided by the class.

    +   - **Constructors:** Actions need to initialize instances of the class or the
    class itself.

    +   - **Methods:** Actions that the class can simply perform.

    +   - **Finalizers:** Actions taken before the permanent deletion of instances
    of the class.


    # Accessibility


    Each class member has associated accessibility, which controls the regions of
    program text that can access the member.


    Six forms of possible accessibility can be summarised as below:


    +   1. **Protected:** Access is confined to this class or classes derived from
    this class.

    +   2. **Private protected:** Access is confined to this class or classes derived
    from this type within the same assembly.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   3. **Protected internal:** Access is confined to this class, classes derived
    from this class, or classes within the same assembly.

    +   4. **Public:** Access isn’t limited.

    +   5. **Private:** Access is limited to this class.

    +   6. **Internal:** Access is confined to the current assembly.


    # Fields


    A field is a variable that is related to a class or with an instance of a class.


    A field stated with the static modifier expounds a static field. It precisely
    identifies one storage location. It is not a problem how many instances of classes
    are created. Only one copy of a static field would be there.


    A field announced without the static modifier clearly defines an instance field.
    Every instance of a class includes a separate copy of all the instance fields
    of that class.


    # Methods


    A method is a member that introduces a computation or action that an object or
    class can perform. Static methods are acquired through the class while instance
    methods are acquired through instances of the class.


    Methods may have a bunch of parameters, which includes values or variable references
    given to the technique. Methods have a return type, which describes the type of
    the value computed and returned by the method. A method’s return type is invalid
    if it doesn’t return a value.'
  merge: -1
