  md: 'are no instance constructors in a class. If a class doesn’t have an instance
    constructor, it defaults to an empty one with no parameters.


    # Events


    An event is a member that allows a class or object to furnish notifications. An
    event is stated like a field except that the declaration co an event keyword,
    and the type must be a delegate type.


    # Operators


    A member that provides the meaning of applying a particular expression operator
    to instances of a class is called an operator. Unary operators, binary operators,
    and conversion operators are the three types of operators that may be specified.
    Public and static operators should be indicated for all operators.


    # Finalizers


    A finalizer is a class member that implements the operations required to close
    a class instance. Typically, a finalizer is necessary to release unmanaged resources.
    Finalizers can’t have parameters, they can’t have accessibility modifiers, and
    they can’t be invoked. The finalizer, for instance, is gathered automatically
    during garbage collection.


    # Expressions


    Expressions are developed from operands and operators. The operators of an expression
    point out which operations to apply to the operands. Examples of operators include
    +, -, *, /, and new. Examples of operands contain literals, fields, local variables,
    and expressions.'
