  md: '# THE .NET FRAMEWORKS


    .NET framework is a managed execution condition for Windows that gives various
    services to its running apps. There are two kinds of main components of .NET Frameworks.


    # CLR


    It is the primary and Virtual Machine component of the .NET Framework. The runtime
    environment in the .NET Framework runs the codes and makes the development process
    easier by providing various services such as remoting, thread management, type-safety,
    memory management, robustness, etc. It is accountable for controlling the execution
    of .NET programs without considering any .NET programming language. It also allows
    in the direction of code, as code that hit the runtime is explicitly known as
    the Managed Code, and code that doesn’t switch to runtime is called Unmanaged
    code.


    # Framework Class Library (FCL)


    The group of repeatable, object-oriented class libraries and methods, etc., can
    be combined with CLR. It is also called the Assemblies. It is like the header
    files in C/C++ and packages in java. Installing the .NET framework is the installation
    of CLR and FCL into the system.


    # App Models


    The common app models for creating software applications in the .NET Framework
    contain the following:


    +   - **ADO.NET:** This is always used to create applications that interact with
    databases, like the Microsoft SQL Server and Oracle.'
