  md: 'In this case, we would like the objects someCat to represent a cat whose name
    is “Jack” and is brown. We indicate this by using the words “Jack” and “brown,”
    written in the brackets after the name of the class.


    When creating an object with the operator new, two things would happen: Memory
    is set aside for this object, and its data members are initialized. The initialization
    is performed by a unique method called constructor. In the example above, the
    initializing parameters are really parameters of the constructor of the class.


    As the member variables name and color of the class Cat are of a reference type
    (of the class String), they are also recorded in the dynamic memory (heap), and
    in the object itself are kept their references (addresses/ pointers).


    # Releasing the Objects


    An essential feature of working with objects in C# is that there is no need to
    manually tear them down and release the memory taken up by them. This is possible
    because of the embedded in .NET CLR system for cleaning the memory (garbage collector),
    which takes care of releasing unused objects instead of us. Objects to which there
    is no reference in the program at a particular moment instinctively released,
    and the memory they take up is released. This way, many potential bugs, and problems
    are controlled. If we would like to release a specific object manually, we have
    to destroy the reference to it, for example, this way:


    ```

    someCat = null;

    ```'
