  md: '# Type Inference


    The C# compiler is often used to infer the type arguments for a generic method.
    Standard example of Generic method type argument inference look like this:


    ```

    int[] values = { 1, 2, 3 };

    int last = GetLast(values);

    ```


    When provided with this sort of ordinary-looking method call, if there’s no nongeneric
    method of that name available, the compiler will start looking for other generic
    methods.


    Nevertheless, it gets more complicated with more intricate cases. The C# specification
    has about six pages dedicated to the type inference algorithm. Still, it’s all
    to support one purpose: letting you omit type arguments when they would be redundant.
    By the way, type inference is always running at compile time, so it’s based on
    the static type of the method arguments.


    APIs that make extensive use of generics explicitly listing every type of argument
    can make the code very hard to remember, so it is common to depend on type inference.
    And if you use anonymous types, type argument inference becomes necessary because
    it is impossible to supply the type arguments explicitly.


    # COVARIANCE AND CONTRAVARIANCE IN GENERICS


    Covariance and contravariance refer to the ability to use a more derived type
    (more specific) or a less derived type (less specific) than initially specified.
    Generic type parameters support covariance and contravariance to give greater
    flexibility in assigning and using generic types.'
