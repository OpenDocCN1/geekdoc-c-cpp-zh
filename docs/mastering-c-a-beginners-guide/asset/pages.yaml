- pgno: 306
  md: 'Let’s discuss them below.


    # Var Keyword


    Var is used to type a variable implicitly in a method scope. The variable is strongly
    typed, but the compiler makes up its mind which Type it will be in the runtime.
    We can even notice the Type by hovering over the var keyword.


    ```

    var imNumber = 10; //implicitly typed variable

    int exNumber = 10; //explicitly typed variable

    ```


    Our opinion is that var enhances the readability of the code, and it should be
    used because, generally, we don’t need to type our variables explicitly.


    In times if the types are complicated.


    Take an example, Dictionary<string, IEnumerable<Employee>> or something even more
    complicated. The Type of the variable is not able to alter at runtime.


    # Object Keyword


    The object is an alias for System. An object is the base class in C#. Every class
    in C# is obtained from System.Object, and we can employ that fact to make a more
    generic codebase. We will get the concrete Type of the object we are working on
    within runtime through the object type. At the same time, we can earn pretty much
    anything in terms of abstraction with the System.Object, sometimes we are strained
    to use reflection to achieve our goal, which is not ideal.


    If you want to use the type that is assigned to the System.Object variable, we
    need to profoundly cast it first. For example:


    ```

    object testObj = 10;

    testObj = (int)testObj + 10;

    ```'
