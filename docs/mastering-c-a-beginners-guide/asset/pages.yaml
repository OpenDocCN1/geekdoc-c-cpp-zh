  md: '# ADVANTAGES OF DYNAMIC

    AND STATIC LANGUAGES


    Dynamic languages, while being slower, are much simple to write. And you can write
    them quickly without thinking about which Type to use or how to initialize them.


    This comes at the price of identifying more bugs in runtime due to the interpreter
    missing to familiarize a variable’s Type. At the same time, such code seems to
    be simple to read and is smaller overall, so the bugs generally have less space
    to hide in.


    On the other hand, Static languages are generally considered quicker because they
    settle their types during the compilation phase. This helps enhance the application’s
    performance and optimization.


    Apart from fast, static languages are also being quick to fail. You can able to
    find bugs even before the application sets about as the compiler checks. This
    means only fewer bugs once the application is up and running.


