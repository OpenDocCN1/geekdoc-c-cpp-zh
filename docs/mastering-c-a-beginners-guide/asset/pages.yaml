  md: 'Library Assemblies are the two sorts of software files (DLL). There can only
    be one input point per assembly (DllMain, WinMain, or Main).


    Assemblies are two types:


    +   1. **Shared Assembly:** Assemblies that are possible to be used in more than
    one project are known as a shared assembly. These are usually inducted into the
    global assembly cache (GAC). Assemblies that are established in the GAC are made
    available to all the .NET applications on that machine.


    +   2. **Private Assembly:** It is an assembly that is being used by only a single
    application. Imagine that we have a project now in which we mention to a DLL,
    so when we develop that particular project, that DLL will be copied to the bin
    folder of our project. That DLL becomes a private assembly within our project.
    Usually, the DLLs that are meant for a specific project are private assemblies.


    Satellite Assembly and Shared Assembly are the other types of assemblies in .NET.


    # GAC


    GAC stands for Global Assembly Cache, a memory typically used to store the assemblies
    that are supposed to be used by other different applications.


    All computers with CLR installed need to have a GAC as its location can be seen
    at “C:\Windows\assembly” for'
