  md: '# Bottom-Up Approach


    The bottom-up approach is a kind of technique that can be used to implement dynamic
    programming. It utilizes the tabulation technique to implement the dynamic programming
    approach. It sorts out the same kind of problems, but it also eliminates the recursion.
    If we eliminate the recursion, there is no stack overflow issue and no overhead
    of the recursive functions. In this tabulation technique, we can resolve the problems
    and store the results in a matrix.


    The bottom-up is the approach used to keep away from the recursion, thus saving
    the memory space. The bottom-up algorithm sets off from the beginning, whereas
    the recursive algorithm begins from the end and works backward. In the bottom-up
    approach, we set off from the base case to figure out the answer for the end as
    we are already familiar that the base cases in the Fibonacci series are 0 and
    1. Since the bottom approach begins from the base cases, we will set off from
    0 and 1.


    # *Key Points*


    +   - We solve all the smaller subproblems needed to solve the larger subproblems,
    then move to the more significant problems using smaller subproblems.

    +   - We use for loop to the subproblems.

    +   - The tabulation or table filling method is another name for the bottom-up
    approach.


