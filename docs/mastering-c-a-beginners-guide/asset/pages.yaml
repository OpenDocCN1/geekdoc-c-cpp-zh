    # Function Arithmetic


    You can also add or subtract functions (delegates) in expressions. If you add
    two function values, when the resulting function variable is called, both functions
    will be implemented. This is the so called multicast delegate. You can also remove
    some functions from the multicast delegate. In the following example, we have
    added two functions that match the Action<string> type:


    ```

    static void Hello(string s)

    {

    System.Console.WriteLine("Hello, {0}!", s);

    }

    static void Goodbye(string s)

    {

    System.Console.WriteLine("Goodbye, {0}!", s);

    }

    ```'
