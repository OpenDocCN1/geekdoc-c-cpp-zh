  md: '# *Classes and Objects*


    Classes could be perceived as special types of templates from which you can create
    objects. Each object has its data and methods to manipulate and access that data.
    The class defines the data and the functionality that each object of that class
    can contain.


    A class declaration consists of a class header and body. The class header contain
    modifiers, attributes, and the class keyword. The class body encapsulates the
    members of the class, which are the data members and member functions. The syntax
    of a class declaration is as follows:


    +   - Attributes accessibility modifiers class identifier: baselist {body}


    Attributes can bring additional context to a class, like adjectives. The following
    table lists the accessibility keywords:


    | Keyword | Description |

    |---|---|

    | Public | Public class is visible in the current and referencing assembly. |

    | Private | Visible inside current class. |

    | Protected | Visible inside current and derived class. |

    | Internal | Visible inside containing assembly. |

    | Internal protected | Visible inside containing assembly and descendent of the
    current class. |'
