- pgno: 58
  md: '+   - **Reliability:** NET has been used to create and run thousands of applications
    since its release in 2002. Despite the creation of new and advanced versions,
    the earlier renditions still provide reliable performance.

    +   - **Portability:** The .NET Framework allows applications to run on any Windows
    platform. It also offers cross-platform features, letting developers create programs
    that can operate on other OSs. Third parties can use conforming languages to create
    compatible framework implementations on various platforms.

    +   - **Integrates with legacy systems:** The .NET Framework can integrate with
    legacy systems such as XML smoothly. It can quickly write and process any file
    format, making it a flexible system with several uses.


    # .NET Framework for Users


    If you don’t create .NET Framework apps but use them, you don’t need to have a
    specific understanding of the .NET Framework or its operation. In most cases,
    the framework is fully transparent to users.


    If Windows is your OS, .NET Framework may already be installed on your computer.
    Not only that, if you install an app that needs .NET Framework, the app’s setup
    program itself might install a specific version of the framework on your computer.
    You may notice a dialog box that asks you to install .NET Framework in some cases.
    If you’ve just tried to operate an app when this dialog box pop up and if your
