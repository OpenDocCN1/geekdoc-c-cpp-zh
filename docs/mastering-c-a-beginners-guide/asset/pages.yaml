- pgno: 310
  md: 'this book, but, as for now, you can think of object-oriented languages as languages
    that have properties and are able to perform actions. This book covers the concepts
    of object-oriented programming through a real-world example. Then you will dive
    into advanced-level concepts such as generics and collections and get acquainted
    with objects and LINQ. Toward the end, you will work with application components
    that illustrate all the concepts explained in this book.


    This book takes a unique and practical approach to teach C# to absolute beginners.
    It begins by teaching you the basic fundamentals and gets you acquainted with
    C# programming by introducing important features and nuances of the language in
    a hands-on way, helping you grasp the concepts in a fluid manner.


    We will start by examining primitive types and variables in C#—what they are and
    how to work with them. First, we will review all the data types—integer types,
    real floating-point types, Boolean, character types, strings, and object types.
    We will continue with variables, their characteristics, how to declare them, how
    they are assigned a value, and what variable initialization is. It is also important
    to familiarize oneself with the main categories of data types in C#—value and
    reference types. We shall also discuss literals, what they are and what kinds
    of literals there are.


    After getting to know the basics of the language, you are expected to spend some
    time learning arrays as a means for operating sequence of elements of the same
    type. This book explains what they are and how we can declare, create, and instantiate
    arrays to provide access to their elements. You will be able to examine one-dimensional
    and multidimensional arrays and learn the various ways for'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'iterating through an array, reading from the standard input and writing to
    the standard output. Many exercises as examples, which can be solved using arrays,
    will be provided along the way, just to show you how useful these tools can be.


    In addition, you will get to know in detail the subroutines in programming, which
    are called methods in C#. We will describe when and why methods are used; show
    how methods are declared and what a method signature is. You will learn how to
    create a custom method and how to invoke it subsequently, using parameters and
    some established practices when dealing with methods. Again, all of this will
    be backed up with examples explained in details.


    Going back to the principles of object-oriented programming, be prepared to look
    into notions of class inheritance, interfaces implementation, data and behavior
    abstraction, data encapsulation and hiding implementation details, polymorphism,
    and virtual methods. Not to mention the principles of cohesion and coupling. We
    will also briefly outline object-oriented modeling and object model creation based
    on a specific technical problem.


    You will also be exposed to some of the more sophisticated capabilities of C#.
    To be more specific, we will pay special attention to clarifying how to make queries
    to collections using lambda expressions and LINQ. This book thoroughly explains
    how to add functionality to already created classes, using extension methods.
    We will familiarize ourselves with anonymous types and briefly describe their
    nature and usage. Moreover, we will also review lambda expressions and show in
    practice how most of the built-in lambda functions work.'
