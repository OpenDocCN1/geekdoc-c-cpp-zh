    # Why Do Companies Use .NET?


    Language interoperability. Language compilers that specifically target the .NET
    Framework release an intermediate code called Common Intermediate Language (CIL),
    which, in turn, is compiled at runtime by the CLR. With this, routines written
    in one language are available to other languages, and programmers develop apps
    in their preferred languages.


    +   - **Version compatibility:** Apps created using a particular version of the
    .NET Framework run with no modification on a later version.

    +   - **Side-by-side execution:** .NET Framework allows us to resolve version
    conflicts by letting different versions of the CLR exist on the same computer.
    This does mean that multiple versions of apps can simply coexist and that an app
    can operate on the version of the .NET Framework with which it was developed.
    The .NET Framework version groups are affected by side-by-side execution.

    +   - **Multitargeting:** By hitting .NET Standard, developers built class libraries
    that run on multiple .NET Framework platforms supported by that standard version.
    Libraries targeting .NET Standard 2.0, for example, may be utilized by programs
    targeting the .NET Framework 4.6.1, .NET Core 2.0 and UWP 10.0.16299.'
  merge: -1
