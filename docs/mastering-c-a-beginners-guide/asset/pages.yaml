    # Advantages of Inheritance in C#


    Below are the main advantages of Inheritance:


    +   - It reduces code redundancy.

    +   - It also reduces the size of the source code and file.

    +   - It helps in providing the extensibility to code.

    +   - The code is easy to manage as it divided into classes of the base class
    and child class.

    +   - Private members are not accessed in derived class when base class members
    are inherited by the derived class.

    +   - It does not support multiple inheritances but can be achieved through interfaces.

    +   - It helps in achieving the polymorphism that allows an object to represent
    more than one type.


    Following are the essential features of Inheritance:


    +   - Inheritance can be used to prevent the direct instantiation of the class,
    and to achieve this, the abstract keyword has been used.'
