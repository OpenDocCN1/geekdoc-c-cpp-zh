    which is one of the fundamental principles in OOP.


    # Creating and Using Objects


    Let us focus on creating and using objects in our programs, and it is doing with
    already well defined classes and mostly with system classes from .NET Framework.


    The creation of objects from preliminarily defined classes during program implementation
    is done by the operator new. The newly created object is often assigned to the
    variable from type coinciding with the class of the object. We will note that
    in this assignment, the object is not copied, and only a reference to the newly
    created object is recorded in the variable (its address in the memory). Here is
    a simple example of how it works:


    ```

    Cat someCat = new Cat();

    ```


    The variable someCat of type Cat, we appropriate the newly created instance of
    the class Cat. The variable someCat remains in the stack, and its value (the instance
    of the class Cat) remains in the managed heap.


    Now, we will take up a slightly different variant of the example above in which
    we set parameters when creating the object:


    ```

    Cat someCat = new Cat("Jack", "brown");

    ```'
