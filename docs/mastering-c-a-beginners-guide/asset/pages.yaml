- pgno: 146
  md: 'Everything in OOP is put together as self-sustainable “objects.” An object
    is a combination of functions, variables, and data that performs a set of related
    activities. When the object performs those activities, it defines the object’s
    behavior. furthermore, an object is an instance of a class.


    OOP provides several advantages over the other programming models like:


    +   - The precise and clear modular approach for programs offers easy understanding
    and maintenance.

    +   - Classes and objects built in the project can be used across the project.

    +   - The modular approach lets different modules exist independently, thereby
    allowing several other developers to work on different modules together OOP systems
    can be easily upgraded from small to large systems.

    +   - Multiple instances of objects coexist without any kind of interference.

    +   - It can be possible to map the objects in the problem domain to those in
    the program.

    +   - By using inheritance, we can definitely eliminate redundant code and extend
    the use of existing classes.

    +   - Message passing techniques are used for communication between objects which
    would, in essence, makes the interface descriptions with external systems much
    more uncomplicated.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - The data-centered design approach help us to capture more details of
    the model in an implementable form.

    +   - It is effortless to partition the work into a project based on objects.

    +   - The principle of data hiding allow the programmer build secure programs
    that the code cannot invade in other parts of the program.


