  md: '# Statements


    The actions of a program are demonstrated using statements. C# supports different
    kinds of statements, several of which are defined in terms of embedded statements.


    # UNDERSTANDING THE CLI


    The common language runtime (CLR) code uses a standard common type system (CTS)
    based on a common language infrastructure (CLI). CLI is part of Microsoft’s .NET
    platform and is expected to become an ECMA standard. The CLI includes the CTS
    and Common Language Specification (CLS).


    CLI is a specification created by Microsoft that explains the executable code
    and runtime environment. In simple terms, this provides us to use various high-level
    programming languages on numerous machines without rewriting the code.


    The .NET Framework, .NET Core, and Mono are some implementations of CLI (picture).


    CLI can be divided into four main components.


    # Common Type System


    CTS is accountable for lay-outing the framework to use two or more languages simultaneously.
    It defines how types are declared and controlled in a source code of any .NET
    language in the CLR where your bytecode or portable execution file changes into
    machine code. It also gives the object-oriented programming (OOPs) model, which
    enables the execution of different high-level languages. It defines instructions
    that must be followed so that other languages can communicate and provide primitive
    data type libraries.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Common Language Specification


    CLS is a set of requirements that must be met by any language for it to be considered
    .NET compatible. It''s a collection of rules and a subset of CTS kinds. Elimination
    of pointers and multiple inheritances are examples of it.


    # Metadata


    Metadata provides information about all the classes and the class members specified
    in the assembly.


    # Virtual Execution System


    Virtual execution system (VES) loads and runs the programs that are compatible
    with the CLI.


    CLI advantages are as follows:


    +   - Defines a consistent programming model. For example, a .NET program is syntactically
    similar to C.NET or VB.NET and follows the same essential steps when accessing
    and obtaining data.

    +   - Administrators may define and reinforce security by limiting data access
    and ensuring user authenticity.

    +   - Implements protocols like HTTP, Transmission Control Protocol/Internet Protocol
    (TCP/IP), Simple Object Access Protocol (SOAP), and Extensible Markup Language
    (XML), providing technology compatibility with added security layers.

    +   - Allows users to separate application presentation logic and business logic
    for increased maintenance and portability using metadata. To make it crystal clear,
    CLI is a bunch of specifications for a virtual operating system (OS) that is solely
    a CLR.'
  merge: -1
  img_proc: true
