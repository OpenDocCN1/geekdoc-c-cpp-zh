- pgno: 128
  md: "+   • Circular Linked List can also be used to create Circular Queue. In a\
    \ Queue we have to keep two pointers, FRONT and REAR in memory all the time, where\
    \ as in Circular Linked List, only one pointer is required.\n\n# Josephus Problem\n\
    \nThe Josephus problem consists of a group of soldiers surrounded by an overwhelming\
    \ enemy force. There is only a single horse available for escape. To determine\
    \ which soldier is to escape, they form a circle & a number n is picked from a\
    \ hat. A name is also picked from the hat. They begin to count clockwise around\
    \ the circle, beginning with the soldier, whose name is picked. One soldier is\
    \ removed from the circle on which count reaches n & the count starts again with\
    \ next soldier, removing another soldier each time the count reaches n & the last\
    \ remaining soldier is the one to take the horse.\n\nOur problem is to find the\
    \ order in which soldier will escape; The input to our program is the number and\
    \ a list of names. The names are according to the clockwise; ordering of circle\
    \ beginning with the soldier from whom the count is to start. The program prints\
    \ the names in the order in which they are eliminated & the name of the soldier\
    \ who escapes. The data structure used is, a circular linked list in which each\
    \ node represents one soldier as it is possible to reach any node from any other\
    \ node by moving around the circle.\n\nThe structure of the node in the circular\
    \ linked list consist of name and link part\n\n```\nstruct node\n{\n char name[30];\n\
    \ struct node *link;\n }\n```\n\n# Algorithm to solve Josephus problem\n\n```\n\
    ALGORITHM: JOSEPHUS (HEAD)\n1. Read N and Name\n2. Set count= number of soldiers\n\
    \   Set Temp=HEAD\n3. Repeat until Name=Temp->name\n   Temp=Temp->LINK\n   [End\
    \ of loop]\n4. Repeat until Count=1\n   a) Set C=1\n   b) Repeat until C=N\n \
    \     i) Set Prev=Temp\n     ii) Set Temp=Temp->LINK\n    iii) Set C=C+1\n   \
    \   [End of loop]\n   c) Prev->LINK=Temp->LINK\n      Print Temp->DATA \"soldier\
    \ remove\"\n   d) Set Count=Count-1\n   [End of loop]\n5. Print Prev->name \"\
    soldier escape\"\n6. Return\n```"
  merge: -1
  img_proc: true
