  md: '# GLOSSARY


    **Abstract Data Type (ADT)** describes the data objects, which constitute the
    data structure and the fundamental operations supported on them.


    **Algorithm** a finite sequence of steps, each of which is elementary that must
    be followed to solve a problem.


    **Array** a collection of the similar type of data items, which is stored in the
    consecutive memory locations under a common name.


    **AVL tree** is a height-balanced binary tree if it is either empty or if T is
    a non-empty binary search tree with T<sub>l</sub> and T<sub>r</sub> as its left
    and right subtrees, if and only if i) TL and TR are height balanced and ii) |h<sub>l</sub>-h<sub>r</sub>|<=1
    where h<sub>l</sub> and h<sub>r</sub> are the heights of T<sub>l</sub> and T<sub>r</sub>
    respectively.


    **Binary tree** is a finite set of nodes, which is either empty or consists of
    a root and two disjoint binary trees called left subtree and the right subtree.


    **Complete binary tree** is a binary tree in which all the levels are filled and
    the last level possibly is partially filled from left to right and some rightmost
    leaves may be missing.


    **Data** is the basic entity or fact that is used in calculation or manipulation
    process.


    **Data type** refers to the type of data that variables hold.


    **Double-ended Queue** (Deque) is a linear list that generalizes a queue, for
    which elements can be inserted or deleted from either the front end or from the
    rear end but not in the middle. There are two variations of a Deque: Input-restricted
    Deque and Output-restricted Deque


    **Dynamic Data Structure** is one kind of data structure, which can be extended
    during execution.


    **Dynamic memory allocation** allocates storage locations at execution time from
    part of memory, known as the _heap_.


    **Expression tree** is a binary tree, which is used to represent a mathematical
    expression.


    **Extended binary tree** can be converted from a binary tree by adding new nodes
    to its leaf nodes and the nodes that have only one child. The extended binary
    tree also is known as 2-tree.


    **External sorting** is a type of sorting, when the list of elements or records
    to be sorted in files are accommodated in external storage devices (secondary
    memory such as hard disks).


    **Full binary tree** is a binary tree of depth k=2<sup>k</sup>-1, that contains
    the maximum number of nodes 2<sup>k</sup>-1.


    **Graph** G is defined as an Ordered set G=(V, E), where V represents a set of
    elements called nodes (or points or vertices) and E represents a set of edges
    in G, that connects these vertices.


    **In-place sorting** algorithm when a constant amount of data of an array is never
    stored outside the array. No additional array is required.


    **Internal Sorting** is a type of sorting, when the list of elements or records
    to be sorted are small enough to be accommodated in the internal (primary) memory
    of the computer.


    **Linear data structure** is a type of data structure in which every data item
    is related (or attached) to its previous and next data item and data items are
    arranged in memory in a linear sequence.


    **Linked list** is an ordered collection of finite homogeneous data elements called
    node where the linear order is maintained by means of links or pointers.


    **Non-linear data structure** is a type of data structure in which every data
    item is attached to many other data items in specific to reflect relationships
    and the data items are not in sequence.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '**Non-primitive data structures** are derived from the primitive data structure
    and that cannot be manipulated or operated directly by the machine instructions.


    **Merging** is an operation that combining the data items of two or more different
    sorted lists into a single sorted list.


    **Offline sorting** algorithm cannot start unless all the data items are present
    at the beginning. All the elements must be available beforchand.


    **Pointer** a variable that is used to store an address or location of another
    variable.


    **Polish notation** where binary operators appear before its two operands. This
    notation also is known as prefix notation.


    **Prefix data structure** is defined that can be manipulated or operated by the
    machine instruction and generally built upon simpler primitive data types.


    **Priority Queue** is a collection of elements such that each element have been
    assigned a priority and the elements are arranged based on priority.


    **Queue** is a homogeneous collection of elements in which deletions can take
    place only at the front end, known as dequeue and insertions can take place only
    at the rear end, known as enqueue.


    **Recursion** a repetitive process in which a function calls itself either directly
    or indirectly.


    **Reverse Polish notation** where binary operators appear after its two operands.
    This notation also is known as postfix notation.


    **Searching** is an operation of finding the location of the desired key value
    within the data structure.


    **Skewed binary tree** is a binary tree, which is dominated solely by left child
    nodes or right child nodes, more specifically left skewed binary tree, or right
    skewed binary tree.


    **Sparse Matrix** a matrix most of its elements are zero, having a relatively
    small number of non-zero elements.


    **Sorting** means arranging all the data items in a data structure either in ascending
    or in descending order or in lexicographical order (for Strings).


    **Stable Sorting** is a type of sorting when two elements that are equal (i.e.
    duplicate element) remain in the same relative order even after performing sorting.


    **Stack** a collection of elements into which new elements may be inserted and
    from which elements may be deleted only at one end called the top of the stack.


    **Static data structure** is a kind of data structure, in which once memory space
    is allocated it cannot extend.


    **Strictly binary tree** is a binary tree when every non-terminal node has non-empty
    left and right subtree.


    **String** is a sequence of characters.


    **Tail recursion** is a special form of recursion where the last operation of
    a function is a recursive call and there are no pending operations to be performed
    on return from a recursive call.


    **Traversing** is an operation of accessing and processing each data item of the
    data structure exactly once.


    **Tree** is a non-linear data structure. A Tree may be defined as a non-empty
    finite set of nodes, such that, i.) There is a specially designated node called
    the root, ii) The remaining nodes are partitioned into zero or more disjoint trees
    T1, T2 ... Tn are called the subtrees of the root R.'
