  md: '# Evaluation of Arithmetic Expressions


    An expression is defined as a number of operands or data items combined with several
    operators. An Arithmetic expression consists of arithmetic operators and operands.


    There are three types of notations in an arithmetic expression.


    +   i) Infix Notation

    +   ii) Prefix Notation

    +   iii) Postfix Notation


    # Infix Notation


    Most usually, in arithmetic expressions, the binary operator appears between its
    two operands. This is called infix notation. The general form of the infix notation
    is:


    ```

    Op1 operator Op2   where Op1 and Op2 are two operands

    ```


    # Example:


    ```

    a + b

    ```


    # Prefix Notation


    In prefix notation, binary operators appear before its two operands. This notation
    is also known as Polish notation. In prefix notation, the operations that are
    to be performed is absolutely determined by the positions of the operators and
    operands in the expression. Therefore, parentheses are never used when writing
    expressions in prefix notation. The general form of the prefix notation is:


    ```

    operator Op1 Op2   where Op1 and Op2 are two operands

    ```


    # Example:


    ```

    + a b

    ```


    # Postfix Notation


    In postfix notation, binary operators appear after its two operands. This notation
    is also known as Reverse Polish notation. In postfix notation, the operations
    are to be performed is absolutely determined by the positions of the operators
    and operands in the expression. Therefore, parentheses are never used when writing
    expressions in postfix notation. The general form of the postfix notation is:


    ```

    Op1 Op2 operator   where Op1 and Op2 are two operands

    ```


    # Example:


    ```

    a b +

    ```


    We are familiar with the conventional infix notation. However, postfix notation
    is most suitable for a computer to calculate any expression and it is the universally
    accepted notation for designing Arithmetic Logic Unit (ALU) of CPU. Therefore,
    it is necessary for us to study the postfix notation. Postfix expression is the
    way the computer looks towards any arithmetic expression.


    # Disadvantages of infix expression


    +   The infix expression is evaluated by traversing in more than one passes.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   - The infix expression does not exclusively define the order in which the
    operators are to be evaluated. In infix expression, the operators are evaluated
    on basis of operator precedence convention.

    +   - In infix notation, one can increase the operator precedence by using parentheses.
    Therefore, parentheses can change the order of evaluation in an infix expression.

    +   - While storing the fully parenthesized expression is wasteful, since the
    parentheses in the expression need to be stored to evaluate the expression properly.


    # Advantages of postfix expression


    +   - The postfix expression is evaluated by traversing only one pass. Therefore,
    evaluation of postfix expression is faster than infix expression.

    +   - Postfix expression is already arranged according to the operator precedence.
    Therefore, one never needs to look at the precedence of the operator during evaluation

    +   - In postfix expression, parentheses are never used.


    The Computer usually evaluates an expression written in infix notation in two
    steps:


    +   i) Converts the infix expression to equivalent postfix expression

    +   ii) Evaluates the postfix expression in a single pass


    # Converting infix expression to postfix form


    The order of evaluation can be fixed by assigning a priority to each operator.
    The operators within parentheses having the highest priority will be evaluated
    first. When an expression has two operators with same priority then the expression
    is evaluated according to its associativity (left to right or right to left) order.
    In table 6.2, the priorities of different operators are specified.


    Table 6.2: Priority of Operators in the order of evaluation


    | Operator | Description | Priority |

    | :--- | :--- | :--- |

    | + - | Unary operator | 5 |

    | ^ | Power operator | 4 |

    | * / % | Multiplication, Division, Remainder | 3 |

    | + - | Addition, Subtraction | 2 |

    | <= >= == != | Relational operators | 1 |


    There is an algorithm to convert an infix expression to the equivalent postfix
    expression. A stack is used here to store operators rather than operand. The purpose
    of the stack is to reverse the order of the operators in the expression.


    # Algorithm converts an infix expression to the equivalent postfix expression.


    ```

    Algorithm: POSTFIX (Q, P)

    [Q is a given infix expression and P is a postfix expression]

    1. Push "(" onto stack & add ")" to the end of Q.

    2. Scan Q from left to right and repeat step 3 to 6

    for each element (symbol) of Q while the stack is not empty

    3. If the element is an operand then add it to P.

    ```'
  merge: -1
  img_proc: true
