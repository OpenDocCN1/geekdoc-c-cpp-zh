    # Multilevel Indexing


    Initially, the content of index file are stored in many fashions but when the
    number of records increases obviously the size of index file also increases. Though
    the contents are stored in sorted fashion the searching time cannot be less than
    [log2 n] .


    In order to reduce the searching time, tree structure will be the first choice
    but binary tree will not be the appropriate structure because it can not reduce
    searching time.


    In order to reduce the height of the tree structure m-way tree like B-tree or
    B+ tree are selected where m depends on the size of the disk.


    Here at first the root node block is accessed where pointers point to the inner
    block node. Generally, leaf node pointer points to a particular record or block
    where the desired record is placed.


    # B-tree


    A B-tree of order m is an m way search tree where a node may have m children.
    A B-tree allows dynamic multilevel indexing. An index entry is nothing but a pair
    of key value and a pointer. In B-tree the leaf nodes are not connected that may
    increase the search time. This difficulty of B-tree is overcome in B+ tree.


    # B + Tree


    A B+ tree is modified B-tree where searching time is decreased and searching performance
    is increased.


    Following are the properties of B + tree:


    +   * Every node should store (m-1) key-pointer pair(k, Pn), value m should be
    odd.

    +   * Each node should have my three pointers (P1) to another node at the next
    level.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   - Every non-terminal node except root node has at least [m/2] non null
    pointers. The root node has at least 2 non-null pointers.

    +   - All leaf nodes are at the same level and the tree is balanced.

    +   - If a node has (m+1) children it must contain m key-pointers pairs.

    +   - For each node key- value pair is less than next key-value pair.

    +   - Each and every key- value pair of non-terminal node should be present at
    leaf level.

    +   - All the leaf nodes must be linked with each other and form a linked structure
    at leaf level.


    # Insertion in a B+ Tree


    Insertion operation into a B+ tree of order m is performed by searching the appropriate
    leaf node where we insert the key. There are three cases for insert a key into
    B+ tree.


    **Case 1:** When the leaf node is not at full capacity (i.e. it has fewer than
    m – 1 keys), then simply insert it into proper position so that after insertion
    the keys remain seated. Therefore, it requires to movement keys within leaf node
    for the newly inserted key. Since m is assumed a constant, so the constant time
    overhead may be ignored.


    **Case 2:** When the node is full (i.e. it has exactly m – 1 keys), then one key
    is moved to immediate upper level. The key at [m/2]th position is moved upward.
    If m is even, then key at ([m/2]+1)th position can be moved upward. The rule of
    insertion should be same for inserting key elements at any level. When a key is
    moved then a copy of that key is stored at the leaf level. Intermediate nodes
    do not contain any duplicate values. Each leaf node makes link with succeeding
    leaf node to reduce searching time.


    # Example:


    Insert the following keys in a B+ tree of order 4 1, 4, 7, 10, 17, 21, 31, 25,
    19, 20, 28, 42


    Since the order of the B + tree is 4, the node of this tree can hold maximum 4
    children, which implies the key pointers for each node is 4 whereas the key value
    is 3.


