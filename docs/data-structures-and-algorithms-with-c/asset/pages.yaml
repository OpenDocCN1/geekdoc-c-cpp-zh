  md: '# SOLVED PROBLEMS


    Q1.We are given a set of n distinct elements and an unlabeled binary tree with
    n nodes. In how many ways can we populate the tree with the given set so that
    it becomes a binary search tree?

    (A) 0 (B) 1 (C) n! (D) 1/(n+1) . (2n C n)

    Ans. B

    Given a binary tree, the inorder traversal outputs exactly one permutation of
    its nodes. Since the values are distinct, the values must be inserted in sorted
    order in these nodes in order. SO, there is only one way.


    Q2. Statement for Linked Answer Questions 54 and 55:

    An undirected graph G(V, E) contains n (n>=2) nodes named v1, V2,....Vn. Two nodes
    vi,vj connected


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_340_0.png)


    Q3. What will be the cost of the minimum spanning tree (MST) of such a graph with
    n nodes?

    (A) 1/12 (11n^2 - 5n) (B) n^2 - n + 1 (C) 6n -11 (D) 2n + 1

    Ans. One can test that for n = 2 and n = 3, the minimum spanning tree weight must
    be 3 and 7 respectively. We can thus infer that option B is the right answer.
    The optimum way of constructing the tree is as follows.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_340_1.png)


    A new vertex Vn+1 added is made adjacent to the Vn-1 in the spanning tree. The
    spanning tree weight increases by (n+1+(n-1))=2n

    One can verify that (n^2-n+1)+2n=(n+1)^2-(n+1)-1


    Q4. The length of the path from V5 to V6 in the MST of previous questions with
    n=10 is

    (A) 11 (B) 25 (C) 31 (D) 41

    Ans. C

    Let eij denote the edge from Vi to Vj in the spanning tree.

    The path from V5 to Vj is given by e5-e1-e2-e4-e6 and its weight is

    5 + 3 + 3 + 1 + 2 + 2 + 4 + 4 + 6 - 31


    Q5. The worst case running time to search for an element in a balanced in a binary
    search tree with n2^n elements is

    (A) Θ(n log n) (B) Θ(n2^n) (C) Θ (n) (D) Θ (log n)

    Ans: (C)'
