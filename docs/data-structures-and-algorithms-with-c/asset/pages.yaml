  md: '# # Dynamic Memory Allocation


    When memory has been needed by a program, it has been set aside by declaring the
    desired type of variables. For variables declared in any function, space in memory
    is set aside to hold the value assigned to the variable. This memory is reserved
    until the function finishes.


    Another problem may arise when declared an array in a program. The user may provide
    a less number of elements than the number of elements of the declared array, and
    then the rest of the memory space will be wasted. This leads to the inefficient
    use of memory. As well as the user may also enter a number of elements more than
    the number of elements of the declared array, then the user may get unexpected
    result or user may face a runtime error or system may be crashed.


    This may not always be the optimal way to allocate memory. Fortunately, you can
    instead write your programs and obtain memory as they are running. With dynamic
    memory allocation, memory is not reserved or set aside at the start of the program;
    rather, it is allocated on an-as-needed basis.


    When a program is compiled, many memory locations needed for the program to hold
    variable and constant data can be determined in advance. As the compiler works
    through the main part of the program and each of the other functions, it can figure
    out how much memory will be needed when the program runs. The memory can be divided
    into four regions as shown in the figure.


    When the program is loaded, it can request the needed memory from the operating
    system before the program actually begins to run. The operating systems reserve
    the needed memory locations by stacking one variable on top of another in memory,
    in a tight, neat block. Because of the way this process works, this part of the
    memory is known as the stack. Memory reserved within the stack cannot be freed
    up until the program quits running.


    | Region |

    | :--- |

    | Stack |

    | Heap |

    | Global Variables |

    | Program Code |


    **Figure 4.5:** Four regions of memory


    Some programs need to use a large block of memory to hold data, but they only
    need those blocks for a short period of time. Rather than use all that memory
    the entire time the program is running, such programs can temporarily allocate
    storage locations from another portion of memory, known as the heap. When the
    program is done using a particular block of heap memory, it simply tells the operating
    system that it is done, and the system returns that memory to the heap, where
    it can be freed out to other needing programs. For best utilization of memory,
    clearly having a heap is a good idea.


    A compiled C program creates and uses four logically distinct regions of memory.
    The first region is memory that actually holds the program''s executable code.
    The next region is a memory where global variables are stored. The remaining two
    regions are the stack and the heap. The stack is used for a great many things
    while your program executes. It holds the return addresses of function calls,
    arguments to functions, and local variables. It will also save the current state
    of the CPU. The heap is a region of free memory that your program can use via
    C''s dynamic memory allocation functions.'
