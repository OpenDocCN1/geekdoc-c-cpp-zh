    # Static Data Structure


    The static data structure is a kind of data structure, in which once memory space
    is allocated it cannot extend, i.e. the memory allocation for the data structure
    takes place at compile-time that cannot be changed afterwards.


    Example: Array


    # Dynamic Data Structure


    Dynamic Data Structure is another kind of data structure, which can be extended
    or shrink during the execution, i.e., the memory allocation as well as memory
    de-allocation for the data structure takes place at run-time and allocates memory
    as required amount at any time.


    Example: linked list, stack, queue, tree


    # Applications of Data Structure


    Different Data Structure is used in real life, such as the representation of an
    image in the form of a bit-map, implement printer spooler so that jobs can be
    printed in the order of their arrival, store information about the directories
    and files in a system, etc. Data Structure is used in various fields of Computer
    Science, such as:


    +   - Compiler Design

    +   - Operating System

    +   - Database Management System

    +   - Statistical Analysis Package

    +   - Numerical Analysis

    +   - Graphics

    +   - Artificial Intelligence

    +   - Simulation


    Different kinds of data structures are suitable for different kinds of applications.
    Some data structures are highly specialized for specific tasks. For example, databases
    use B-tree indexes for small percentages of data retrieval, and compilers and
    databases use dynamic hash tables as lookup tables, operating systems use queues
    for process management, I/O request handling.


    # Abstract Data Type


    A data type refers to the type of data that variables hold. Thus, integer, real,
    characters are referred to as primitive data types.


    Data Object represents an object having a data. The study of classes of objects
    whose logical behavior is defined by a set of values and a set of operations.


    Definition: An Abstract Data Type (ADT) describes the data objects, which constitute
    the data structure and the fundamental operations supported on them.


    An ADT promotes data abstraction and focuses on what a data structure does, rather
    than how it implements (does).


    +   - An ADT is a conceptual model of information structure.

    +   - An ADT specifies the components, their structuring relationships and a list
