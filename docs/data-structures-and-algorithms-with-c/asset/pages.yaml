    # ## Type casting of Pointers


    The pointer variables have their own data type. Unlike basic data types, the pointers
    do not support implicit type conversion. Therefore, pointer types can be converted
    to other pointer types using the explicit type casting mechanism.


    # ### Example:


    ```

    ```c

    int a = 10;

    float b = 12.3;

    int *p;

    float *q;

    p = &a;

    q = &b;

    q = b;        /* this is invalid */

    q = p;        /* this is invalid */

    p = q;        /* this is valid */

    q = (float*)p; /* this is valid */

    p = (int*)q;   /* this is valid */

    ```

    ```


    > > Note: if the compiler encountered some conversion of a pointer that caused
    the pointer to point to a different type then the compiler gives an error message
    like “Suspicious pointer conversion”.


    # ## Null Pointer


    A null pointer is a pointer value that points to no valid location. A null pointer
    is a constant pointer (often represented by address zero) that is compatible with
    any pointer. It is not compatible with function pointers. When a pointer is equivalent
    to NULL it is guaranteed not to point to any variable defined within the program.


    A null pointer value is an address that is different from any valid pointer. Assigning
    the integer constant 0 to a pointer assigns a null pointer value to it. The mnemonic
    NULL (defined in the standard library header file, stdio.h) can be used for legibility.


    # ### Example:


    ```

    ```c

    int *p;

    *p = 12;

    ```

    ```


    Since p is not defined, therefore p may contain a garbage value (say, p = 65550).
    Now purposely or accidentally when a value assigning to *p then there are chances
    that modify that memory location'
