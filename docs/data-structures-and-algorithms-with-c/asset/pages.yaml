    # ## Different Types of Binary Trees


    Different types of binary trees are possible. Following are common types of binary
    trees:


    +   - Strictly Binary Tree

    +   - Extended Binary Tree

    +   - Complete Binary Tree

    +   - Full Binary Tree

    +   - Skewed Binary Tree

    +   - Binary Expression Tree

    +   - Balanced Binary Tree

    +   - Threaded Binary Tree

    +   - Binary Search Trees


    # ## Strictly Binary Tree


    A binary tree is called strictly binary tree if every non-terminal node has non-empty
    left and right subtree. All the non-terminals nodes must always have exactly two
    non-empty children. Strictly Binary tree is also known as a 2-ary tree. In the
    strictly binary tree, the degree of any node is either zero or two, never degree
    one. A strictly binary tree with n leaves always contains 2n–1 nodes.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_184_1.png)


    Figure 8.3: Strictly binary trees


    # ## Extended Binary Tree


    A binary tree can be converted to an extended binary tree by adding special nodes
    to its leaf nodes and the nodes that have only one child. The extended binary
    tree also known as 2-tree. The nodes of the original tree are called internal
    nodes and the special nodes that are added to the binary tree are called external
    nodes.'
