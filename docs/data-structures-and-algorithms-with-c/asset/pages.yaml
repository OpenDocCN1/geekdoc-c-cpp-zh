  md: '# TREE


    > "Computers do not solve problems, they execute solutions." -Laurent Gasser


    Tree is one of the most important non-linear data structure in computer algorithms.
    The drawbacks of linked list can be overcome by using a tree. Many real life problems
    can be represented and solved using trees. Trees are very flexible, versatile
    and powerful non-linear data structure that can be used to represent data items
    possessing a hierarchical relationship among the nodes of the tree.


    # KEY FEATURES


    +   - Binary Tree

    +   - Binary Search Tree

    +   - Threaded Tree

    +   - Expression Tree

    +   - AVL Tree

    +   - Multi-way Search Tree

    +   - B-tree


    Definition: A Tree may be defined as a non-empty finite set of nodes, such that,
    i) There is a specially designated node called the root, ii) The remaining nodes
    are partitioned into zero or more disjoint trees T1, T2, ...Tn are called the
    subtrees of the root R.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_182_0.png)


    Figure 8.1: A Tree


    # Terminology of Tree


    Node (or vertex): A node stands for the item of information with the branches
    to other items. Consider the tree in the above figure. This tree has 11 nodes
    (A, B, C, D, E, F, G, H, I, J and K).


    Root: A node without any parent is called root node. In the above figure, A is
    the root node.


    Parent node (or predecessor): Suppose N is a node in tree with successors s1,
    s2, ... sn, then N is called the parent (or predecessor) of the successors. Each
    node in the tree, except the root, has a unique parent. In the above figure, node
    D is the parent of H, I and J.


    Children: The successors are called children of N. The left and right successors
    of node N are called left child and right child of node N respectively. In the
    above figure, H, J and I are children of node D.'
