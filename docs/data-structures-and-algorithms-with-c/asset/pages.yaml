    \nIn the next step another node is created and linked with first node. The LINK\
    \ field of the NEW node is linked with first node.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_124_1.png)\n\
    \nFigure 5.15 (a, b, c): Circular linked list\n\n# Add a New Node at The Beginning\
    \ of the Circular Linked list\n\nThis algorithm creates a node and inserts it\
    \ at the beginning of the list. HEAD is a pointer, which holds the address of\
    \ the first node of the linked list and ITEM is the value of the new node. NEW\
    \ is a pointer which holds the address of the new node and _Temp' and _In' are\
    \ temporary pointers.\n\n# Algorithm to insert a node at the beginning.\n\n```\n\
    Algorithm: CIRADD_BEG (HEAD, ITEM)\n1. [Create the new node]\na) Allocate memory\
    \ for NEW node.\nb) IF NEW = NULL then Print: \"Memory not Available\" and Return\n\
    c) Set NEW→DATA= ITEM\nd) Set NEW→LINK= HEAD\n2. a) Set Temp=HEAD\nb) Repeat while\
    \ Temp→LINK ≠ HEAD do\n   Set Temp = Temp→LINK\n   [End of loop]\n3. [Move FIRST\
    \ to point to the new node]\n   Set HEAD = NEW    // to make new node the first\
    \ node\n   Set Temp→LINK=HEAD\n4. Return\n```\n\nA NEW node is created and linked\
    \ with the HEAD node of Circular linked list.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_124_2.png)"
