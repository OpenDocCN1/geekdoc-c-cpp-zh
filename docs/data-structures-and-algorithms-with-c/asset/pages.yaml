  img_proc: true
- pgno: 165
  md: "A circular definition may have no base criteria and define the value of a function\
    \ in terms of that value itself, rather than on other values of the function.\
    \ Such a situation would lead to an infinite regress.\n\n> Note: If infinite recursion\
    \ occurs in a program then you may get a runtime error message, e.g. “Stack overflow”.\n\
    \n# Depth of Recursion\n\nSuppose P is a recursive function. During the execution\
    \ of a program, which contains P a level number is assigned. The original execution\
    \ of P is assigned level 1 and each time P is executed because of the recursive\
    \ call, its level is one more than the level of execution that had made the recursive\
    \ call.\n\nThe depth of the recursive function P, with given set of arguments,\
    \ refers to the maximum level number P during its execution.\n\n# Recursion Tree\n\
    \nA recursion tree is a tree that is generated by tracing the execution of a recursive\
    \ function. A recursion tree shows the relationship between calls to the function.\
    \ Recursion tree is a pictorial representation of recursion call, which is in\
    \ the forms of a tree, where at each level nodes are expanded. Each node represents\
    \ how recursive function calls are generated. Descendants of a function call are\
    \ further recursive calls. Calls in the tree with no descendants involve evaluation\
    \ of the base case(s). Example of recursion tree is shown in figure 7.2.\n\n#\
    \ Types of Recursion\n\nThe ways in which recursive functions are characterized\
    \ are:\n\n+   - Whether the function calls itself or not (direct or indirect/mutual\
    \ recursion),\n+   - How many internal recursive calls are made there within the\
    \ body (linear, binary, and non-linear recursion)?\n+   - Whether there are pending\
    \ operations or not at each recursive call (tail or non-tail recursion). Recursion\
    \ is mainly two types depending on whether a function calls itself or not.\n+\
    \     i) Direct Recursion\n+     ii) Indirect Recursion or Mutual Recursion\n\n\
    # Direct Recursion\n\nIn direct recursion, a function calls itself from the body\
    \ of the function. A function is directly recursive if it contains an explicit\
    \ call to itself. The format of direct recursion is as follows:\n\n```\nfunction\
    \ F()\n{\n  if base condition satisfied\n    then return some value(s)\n  else\n\
    \  {\n    :\n    call F();\n    :\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: "# Examples: Factorial, Fibonacci, GCD, etc.\n\n# Indirect Recursion\n\nIn indirect\
    \ recursion, two functions call one another directly. A function is indirectly\
    \ recursive if it contains a call to another function, which ultimately calls\
    \ it. Indirect recursion also is known as mutual recursion. The format of indirect\
    \ recursion is as follows:\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_166_0.png)\n\
    \n# Examples: Recursive Descent Compilation, Hilbert Curves, etc.\n\nRecursion\
    \ is categories into three types depending on the number of recursion calls:\n\
    \n+   i) Linear Recursion\n+   ii) Binary Recursion\n+   iii) Non-Linear or Multiple\
    \ Recursion\n\n# Linear Recursion\n\nIn linear recursion, a single recursion call\
    \ is performed. A recursive function in which only one internal recursive call\
    \ is made within the body is called linearly recursive. The format of linear recursion\
    \ is as follows:\n\n```\nfunction L ()\n{\n    if base condition satisfied\n \
    \   then return some value(s)\n    else\n    {\n        :\n        call L ();\n\
    \        :\n    }\n}\n```\n\n# Examples: Factorial, GCD, Binary Search, etc.\n\
    \n# Binary Recursion\n\nIn binary recursion, two recursion calls are performed.\
    \ A function that makes two internal calls to itself is said to be binary recursive.\
    \ The format of binary recursion is as follows:"
