    \ Set Temp = Temp–LLINK\n   [End of loop]\n5. Return\n```\n\n# Search an Item\
    \ in a doubly linked list\n\nThis algorithm describes searching of an ITEM in\
    \ a doubly linked list. P is a pointer that assigned the Head node address of\
    \ the doubly linked list. P moves from left to right until the ITEM is found or\
    \ the list end.\n\n# Algorithm to search an item in doubly linked list\n\n```\n\
    Algorithm: DLL_SEARCH (HEAD, ITEM, LOC)\n1. Set P = HEAD, LOC=NULL\n2. [Check\
    \ for empty list]\n   If P = NULL then\n   i) \"The linked list is empty\"\n \
    \  ii) Return\n3. Repeat step 4 while P ≠ NULL\n4. If P→DATA = ITEM then\n   i)\
    \ Print: \"Element found\"\n   ii) Set LOC = P\n   iii) Return\n   Else\n   P\
    \ = P→RLINK\n   [End of If]\n   [End of Loop]\n5. Print: \"Element not found\"\
    \n6. Return\n```\n\nIn the first step P is assigned with the address of the first\
    \ node of the doubly linked list."
