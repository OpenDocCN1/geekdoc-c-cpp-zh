    \nFollowing algorithm describes the process of insertion of key in a hashtable\
    \ using a Linear Probing collision resolution technique. The Flag array is used\
    \ to indicate whether HashTable consist of key value at HashIndex. If HashTable\
    \ has key at HashIndex then HashIndex of flag array is set to true else it is\
    \ set to false. Initially flag array is initialised with false.\n\n# Algorithm:\
    \ Insertion in Linear Probing\n\n```\nAlgorithm: INSERT_LINEAR_PROBING (HashTable,\
    \ Key, Size)\n[HashTable is an array represents a hash table, Key is a value to\
    \ be inserted as key and Size is the size of the HashTable]\n1. Set HashIndex\
    \ = Key mod Size\n2. Repeat while HashTable[hashIndex] # NULL\n3. If HashTable[hashIndex]\
    \ = NULL then\n   i) Set HashTable[hashIndex] = Key\n   ii) Set Flag[HashIndex]\
    \ = true\n   iii) Return\nElse\n   Set HashIndex = (HashIndex + 1) mod Size\n\
    \   [End of If]\n[End of while]\n4. Return\n```\n\n# Searching in Hash Table\n\
    \nIn linear probing, searching a key in the hashtable with the slot at location\
    \ H (K) = h, and continue linear search the adjacent slots in the table with h+1,\
    \ h+2, ... until finding either an empty slot, which indicates an unsuccessful\
    \ search or finding a slot whose stored key.\n\nFollowing algorithm describes\
    \ the process of searching a key in a hash table using a Linear Probing technique."
