  md: '# Complexity of a singly linked list


    The cost to insert or delete an element into a known location in the singly linked
    list is O(1). Whereas for a linear array the insert or delete operation cost is
    O(n). This is because, in the case of linked list insert or delete operation do
    not involve any data movement just by performing pointer exchange among nodes
    the insertion or deletion take place. In case of array both the operations involve
    data replacement by n places.


    # Table 5.3: Comparison of Array and Linked list


    | Operations | Array | Linked List |

    |---|---|---|

    | Insert/delete at the beginning | O(n) | O(1) |

    | Insert/delete at the end | O(1) | O(1) |

    | Insert/delete in the middle | O(n) | O(1) |

    | Indexing | O(1) | O(n) |

    | Wastage space | O(1) | O(n) |


    # Circular Linked List


    A circular linked list is the variation of singly linked list in which the last
    node points to the first node of the list. The circular linked lists have neither
    a beginning nor an end.


    In a circular linked list, there are two methods to know if a node is the first
    node or not.


    +   i) Either an external pointer, list, points the first node or

    +   ii) A header node is placed as the first node of the circular list.


    The header node can be separated from the others by either having a sentinel value
    as the info part or having a dedicated flag variable to specify if the node is
    a header node or not.


    A linked list can be implemented either in two ways:


    +   i) A single pointer is used to point to the header node of the linked list
    and the last node of the list points to the header node of the list.

    +   ii) Two different pointers can be used to point to the first and last node
    of the circular linked list respectively.


    In a linear linked list once we traverse the list, then it is difficult to return
    back to the first node of the list. A circular linked list provides a solution
    to this problem. In a circular linked list the last node points to the first node
    of the linked list so, there is no difficulty to return back to the first node
    when the list is traversed.


    A circular linked list can easily be formed from a linear linked list where the
    last node of linear linked points to the first node of the linked list.


    The circular linked list can be represented by three nodes as follows


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_122_0.png)


    # Figure 5.14: Circular linked list


    Here, HEAD points to the first node of the list and last node points to the first
    node forming a circular list.'
