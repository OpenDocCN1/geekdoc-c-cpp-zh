  md: 'Q11. Which of the following statements is/are TRUE for undirected graphs?

    P: Number of odd degree vertices is even.

    Q: Sum of degrees of all vertices is even.

    (A) P Only

    (B) Q only

    (C) Both P and Q

    (D) Neither P nor Q

    Ans. C

    P is true for undirected graph as adding an edge always increases degree of two
    vertices by 1. Q is true: If we consider sum of degrees and subtract all even
    degrees, we get an even number because every edge increases the sum of degrees
    by 2. So total number of odd degree vertices must be even.


    Q12. The line graph L(G) of a simple graph G is defined as follows: There is exactly
    one vertex v(e) in L(G) for each edge e in G . For any two edges e and e'' in
    G, L(G) has an edge between v(e) and v(e''), if and only if e and e'' are incident
    with the same vertex in G. Which of the following statements is/are TRUE?

