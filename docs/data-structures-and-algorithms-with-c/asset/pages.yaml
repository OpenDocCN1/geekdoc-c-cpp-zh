  md: '# LINKED LIST


    > "The whole is equal to the sum of its parts". - Euclid


    +   - Singly Linked List

    +   - Doubly Linked List

    +   - Circular Linked List

    +   - Linked Stack

    +   - Linked Queue

    +   - Polynomial Representation


    ink list, as the name suggests, is a linear list of linked elements. Like arrays,
    linked list represents another linear data structure. Arrays are very commonly
    used data structure in most of the programming languages. Since it has several
    limitations and drawbacks; therefore, an alternative approach is required. These
    limitations can be overcome by using Linked List data structure.


    Allen Newell, Cliff Shaw and Herbert A. Simon at RAND Corporation developed linked
    lists as the primary data structure in 1955–1956 for their Information Processing
    Language.


    # Limitations of Array


    The array is the most common data structure used to store a collection of homogeneous
    elements. In most languages, arrays are convenient to declare, and fast to access
    any element in a constant amount of time. The address of an element is computed
    as an offset from the start of the array which only requires one multiplication
    and one addition.


    In many applications, the array is not suitable as it has some drawback. The drawbacks
    of Array are listed below:


    +   - The maximum size of the array needs to be predicted beforhand. One cannot
    change the size of the array after allocating memory, but, many applications require
    resizing. Most often this size is specified at compile time with a simple declaration.
    The size of the array can be deferred until the array is created at runtime, but
    after that it remains fixed. When arrays are allocating dynamically from the heap
    and then one can dynamically resize it with realloc(), but that requires some
    real programmer effort.

    +   - Most of the space in the array is wasted when programmer allocates arrays
    with large size. On the other hand, when program ever needs to process more than
    the specify size then the code breaks.

    +   - Storage of the array must be available contiguously. Required storage not
    always immediately available.

    +   - Insertion and deletion operation may be very slow. The worst case occurs
    when the first element is to be deleted or inserted. Almost all the elements of
    the array need to be moved. On an average about half the elements of the array
    need to be moved. Thus, the time complexity depends on the total no of elements
    rather than the actual operation.

    +   - Joining and splitting of two or more arrays is difficult.'
