  md: '# Binary Search Tree


    A Binary search tree (BST) is an ordered binary tree. P. F. Windley, A. D. Booth,
    A. J. T. Colin and T. N. Hibbard invent Binary search tree, in 1960.


    **Definition:** A Binary Search Tree, which is either empty or each node in the
    tree contains a key and


    +   i) All keys in the left subtree are less than the keys in the root node,

    +   ii) All keys in the right subtree are greater than the keys in the root node,

    +   iii) The left and right subtrees are also binary search tree.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_199_0.png)


    Figure 8.19: Binary Search Tree


    # Operations on Binary Search Tree


    Operations supported by a Binary search tree are as follows:


    Table 8.2: Various Operation on Binary Search Tree


    | Operation | Description |

    |---|---|

    | Traverse | This operation traversing all the nodes of binary search tree exactly
    once. |

    | Insertion | This operation insert a node in the binary search tree |

    | Deletion | This operation removes a node from the binary search tree |

    | Searching | This operation searches a desired key value within the binary search
    tree. |

    | Successor | This operation finds the successor of a given node in the binary
    search tree. |

    | Predecessor | This operation finds the predecessor of given node in the binary
    search tree. |


    # Binary Search Tree Traversal


    The tree traversal algorithm (preorder, postorder and inorder) are the standard
    way of traversing a binary search tree, which is similar as traversing in a binary
    tree. In a binary search tree, inorder traversal always retrieves data items in
    increasing sorted order.


    # Insertion in Binary Search Tree


    Suppose a new data item having a key and the tree in which the key is inserted
    are given as an input. Insertion operation starts from the root node. If the tree
    is empty then the new item inserted as the root node. Otherwise, if the tree is
    non-empty then compare the value of the key with the root node. If the key is
    less than the root node then it is inserted in the left subtree, otherwise it
    is inserted in the right subtree.'
