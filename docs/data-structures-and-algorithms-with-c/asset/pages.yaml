  md: "# # Insertion Sort\n\nThe intuitive idea is to insert a new element in the\
    \ sorted array one by one (known as card player sort). As the insertion operation\
    \ is performed in this sorting technique, hence it is named as insertion sort.\
    \ This algorithm is known as on-line sorting algorithm as it can start even if\
    \ not all the elements are present at the beginning.\n\nSuppose A is an array\
    \ with n elements from A[0] to A[N-1]. The insertion sort algorithm, inserts each\
    \ element A[K] into the sorted sub-array A[0], A[1],..., A[K-1], so that after\
    \ insertion the sub-array A[0], A[1], A[2],...,A[K] remains sorted.\n\n+   - The\
    \ first array element A[0] by itself is trivially sorted.\n+   - In the first\
    \ pass, A[1] is inserted into its proper position so that, A[0], A[1] is sorted.\n\
    +   - In the second pass, A[2] is inserted into its proper position in A[0], A[1],\
    \ so that, A[0], A[1], A[2] is sorted.\n+   - In the third pass, A[3] is inserted\
    \ into its proper position in A[0], A[1], A[2] , so that, A[0], A[1], A[2], A[3]\
    \ is sorted.\n+   - In the N-1 pass, A[N-1] is inserted into its proper position\
    \ in A[0], A[1], A[2], A[3], A[N-2], so that, A[0], A[1], A[2],..A[N-1] is sorted.\n\
    \n# ## Algorithm: Insertion Sort\n\n```\nAlgorithm: INSERTION_SORT (A, N)\n[A\
    \ is an array of N elements]\n1. Repeat steps 2 to 4 For K = 1 to N\n2. Set Temp\
