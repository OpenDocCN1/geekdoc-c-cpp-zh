    A n algorithm is a well-defined computational procedure that transforms inputs
    into outputs achieving the desired input-output relationship. We must design a
    process to solve a specific problem before programming. This process must be formulated
    as a detailed sequence of basic steps, which is called an algorithm. An algorithm
    can perform the calculation, data processing and automated reasoning task in a
    finite time.


    +   - Algorithm

    +   - Types of Algorithm

    +   - Time Complexity

    +   - Space Complexity

    +   - Asymptotic Notations


    The word «algorithm» is a Persian word algorism derived from the name of the Persian
    author and great mathematician «Abu Abd Allah Jafar Mohammad bin Musa al Khowarizmi»
    (Born in 780 A.D. in Baghdad). He worked on algebra, geometry, and astronomy.
    He designs the first algorithm for adding numbers represented in the numerical
    system.


    # ## ALGORITHM


    **Definition:** Algorithm is a finite sequence of instructions/steps, each of
    which is very elementary that must be followed to solve a problem.


    +   - **Input:** There are some inputs (zero or more quantities), which are externally
    supplied.

    +   - **Output:** The result (at least one quantity) should be produced after
    completion of the job to the user.

    +   - **Definiteness:** The instructions should be unique, concise, clear and
    unambiguous.

    +   - **Finiteness:** The instructions should be relative in nature and should
    not be of an infinite type. Should be terminated after a finite number of steps.

    +   - **Effectiveness:** Every instruction must be elementary, so that it can
    be carried out, in principle, by a person using only pencil and paper. Repetition
    of same steps should be avoided. It must be feasible.


    # ## Types of Algorithms


    Algorithms that use a similar problem-solving approach can be grouped together.
    This classification scheme is neither exhaustive nor disjoint. The purpose of
    this classification is to highlight the various ways in which a problem can be
    solved. Using different techniques, one can develop many algorithms for the same
    problem. These techniques are not only applicable in Computer Science but also
    to other fields such as Operation Research, Electrical Engineering etc. We can
    formulate/develop a good algorithm by studying all the techniques.'
