    # Red-Black Tree


    The red-black tree is a balanced binary search tree in which each node is colored
    either red or black. The red-black tree is introduced by Guibas and Sedgewick,
    in 1978. The tree is named after a red-black tree, as they had red and black pens
    to draw the trees.


    In the red-black tree, ordering of the keys are the same as for binary search
    trees: all the keys to the left of a node are smaller, and all the keys to the
    right of a node are larger than the key at the node itself. The number of black
    nodes on every path from the root to each leaf is the same, called the black height
    of the tree. There are no two adjacent nodes are red. When a node is red, then
    both its children are black.


    In insertion and deletion operation, when the tree is modified, the tree is rearranged
    and recolored to restore the properties. The tree is designed in such a way that
    this rearranging and recoloring can be performed efficiently. The searching, insertion,
    deletion operations are performed in O (log n) time. One extra bit per node is
    required to represent the colour (red or black) of the node.


