    # Binary Expression Tree


    A binary expression tree is a strictly binary tree, which is used to represent
    a mathematical expression. Two common types of expressions that an expression
    tree can represent are algebraic and boolean.


    This is not necessary that expression tree is always a binary tree. In this example,
    there are all the binary operators. Therefore, this tree is a binary tree. Although,
    it is possible to a node to have one child as in the case of a unary operator.


    Applications of expression trees:


    +   - Evaluation of expression

    +   - Performing symbolic mathematical operations (such as differentiation) on
    the expression.

    +   - Generating correct compiler code to actually compute the expression''s value
    at execution time.


    Properties of expression tree:


    +   - Expression tree does not contain parenthesis.

    +   - The leaf nodes contain the operands such as constants or variables.

    +   - The non-leaf nodes contain the operators.


    Inorder traversal of the expression tree produces infix form of the expression
    without parenthesis. When the expression tree is traversed in preorder, the prefix
    (polish) form of the expression is obtained. Similarly, when the expression is
    traversed in postorder then the postfix (reverse polish) form of the expression
    is obtained. A prefix or postfix form corresponds to exactly one expression tree.


    An infix form may correspond to more than one expression tree. The one expression
    tree. Therefore, it is not suitable for expression evaluation.


    Consider the infix expression A + B * C. The expression is ambiguous because it
    produces more'
