    # Summary


    +   • Tree is a non-linear data structure with a root node and subtrees that can
    be used to represent data items possessing a hierarchical relationship among the
    nodes of the tree.


    +   • A binary tree is a finite set of nodes, which is either empty or consists
    of a root and two disjoint binary trees called left subtree and the right subtree.


    +   • A Binary search tree is a binary tree, which is either empty or each node
    in the tree contains a key. Such that all keys in the left subtree of X are less
    than X, all keys in the right subtree of X are greater than X and the left and
    right subtrees are also binary search tree.


    +   • AVL tree is a height-balanced binary tree where the heights of the two subtrees
    of any node differ by at most ±1. After insertion or deletion if they differ by
    more than one, then rebalancing is done to restore its property.


