  md: "# The addition of two Polynomial using Linked List\n\nIn the following algorithm\
    \ addition of two polynomials are described. Two linked lists consisting of two\
    \ polynomials are headed by HEAD1 and HEAD2 respectively. Insert function is used\
    \ to insert a node in a new linked list which is headed by R.\n\n# Algorithm to\
    \ addition of two polynomials\n\n```\nALGORITHM: POLYADD(HEAD1, HEAD2)\n1. Set\
    \ P=HEAD1, Q=HEAD2, R=NULL\n2. Repeat while P!=NULL and Q !=NULL\n   i) If P-EXP\
    \ > Q-EXP then\n      Call INSERT(R, P-EXP, P-COEFF)\n      Set P=P-LINK\n   ii)\
    \ Else If P-EXP < Q-EXP then\n      Call INSERT(R, Q-EXP, Q-COEFF)\n      Set\
    \ Q=Q-LINK\n   iii) Else If P-COEFF + Q-COEFF != 0\n      Call INSERT(R, P-EXP,\
    \ P-COEFF + Q-COEFF)\n      Set P=P-LINK\n      Set Q=Q-LINK\n   [End of if]\n\
    \   [End of loop]\n3. Repeat while P!=NULL\n   i) Call INSERT(R, P-EXP, P-COEFF)\n\
    \   ii) Set P=P-LINK\n   [End of loop]\n4. Repeat while Q!=NULL\n   i) Call INSERT(R,\
    \ Q-EXP, Q-COEFF)\n   ii) Set Q=Q-LINK\n   [End of loop]\n5. Return\nFunction:\
    \ INSERT(R, EXP, COEF)\n1. Allocate memory for NEW node\n2. If NEW=NULL then\n\
    \   i) Print: Out of Memory\n   ii) Return\n3. Set NEW-EXP=EXP, NEW-COEFF=COEF,\
    \ NEW-LINK=NULL\n4. If R=NULL then\n   HEAD3=R=NEW\n   Else\n   Set R-LINK=NEW\
    \ and R=NEW\n   [End of If]\n5. Return\n```"
