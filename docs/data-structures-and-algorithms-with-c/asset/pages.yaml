    # Algorithm to traverse a graph using depth first search in non-recursive/iterative
    process.


    ```

    Algorithm: DFS (G, s)

    [G is a given graph of N vertices, s is the source node]

    1. Repeat for all vertices v of graph G do

    2. Set VISITED [v] = 0

    [End of loop]

    3. Initialize Stack STK to be empty

    4. Set VISITED [s] = 1

    5. Call PUSH (STK, s)

    6. While ISEMPTY (STK) = false do

    7. Call POP (STK, s)

    8. Visit s

    9. Repeat for all vertices v adjacent to s do

    10. If VISITED [v] = 0 then

    11. Call PUSH (STK, v)

    12. Set VISITED[v] = 1

    [End of For loop]

    [End of While loop]

    13. Return

    ```


    In case G is represented by its adjacency lists, then the vertices, w adjacent
    to v can be determined by following in a chain of links. Since the algorithm,
    DFS would examine each vertex in the adjacency lists at most once and there are
    2e list vertices, the time to complete the search is O (e). If G is represented
    by its adjacency matrix, then the time to determine all vertices adjacent to v
    is O (n). Since at most n vertices are visited, the total time is O (n^2).


