    \ = 58 % 10 = 8, collision occur\nHash2(58) = 7 - (58 % 7) = 5 position move from\
    \ [8]\nHash1(69) = 69 % 10 = 9, collision occur\nHash2(69) = 7 - (69 % 7) = 1\
    \ position move from [9]\n\n| Index | Value |\n|---|---|\n| [0] | 69 |\n| [1]\
