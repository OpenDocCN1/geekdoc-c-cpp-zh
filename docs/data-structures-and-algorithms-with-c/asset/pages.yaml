    Where M (i, j) is the matrix obtained from M by deleting row i and column j. Let
    $l_{xy}$ be the (x, y)-cofactor of L. Note that $l_{xy}$ does not depend on an
    ordering of the vertices of G. We set N = t(G) and show that

    $N = l_{xy} = \det(L + 1/n^2, J) = 1/n . l_{xy} ... \lambda_n$ for any x, y $\in$
    V (G).

    Let L . S. for S $\subset$ V(G), denote the matrix obtained from L by deleting
    the rows and columns indexed by S, so that $l_x = \det L^{(x)}$. The equality
    N = $l_x$ follows by induction on n, and for fixed n > 1 on the number of edges
    incident with x. Indeed, if n = 1 then $l_x = 1$. Otherwise, if x has degree 0,
    then $l_x = 0$ since $L^x$ has zero row sums. Now, if xy is an edge, then deleting
    this edge from G decreases $l_{xx}$ by $\det L^{x,y}$, which by induction is the
    number of spanning trees of G with edge xy collapsing to a point, which is the
    number of spanning trees containing the edge xy. This shows N = $l_{xx}$. Since
    the sum of the columns of L is zero, so that one column is minus the sum of the
    other columns, we have $l_{xx} = l_{xy}$ for any x, y.


    Now, we consider the Laplacian polynomial

    \(\mu(G, t) = \det(t(L - I)) = t \prod_{r=2}^n (t - \lambda_r)\) for graph G then

    \((-1)^{n-1} \lambda_2 ... \lambda_n\) is the coefficient of t, that is

    \(d/dt(\det(t(I - L))) = \Sigma_d (\det(t(I - L^S))\)

    Putting, t = 0 it is obtained that $\lambda_2 ... \lambda_n = \Sigma_k l_{kk}
    = nN$

    Finally, the eigenvalues of $L + 1/n . J''$ are 1/n and $\lambda_2, ..., \lambda_n$
    so

    \(\det(L + 1/n^2 . J) = 1/n (\lambda_2 ... \lambda_n)\)


