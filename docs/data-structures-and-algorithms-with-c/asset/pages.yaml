    # All Pairs Shortest Paths


    Consider a weighted digraph G = (V, E). Solving All Pair Shortest Path problem
    consists of computing the shortest distance or path in terms of cost/weight between
    every pair of vertices(u, v) where u, v∈V in the graph G. It is assumed that the
    graph does not contain any negative or zero weight cycle.


    # Floyd-Warshall Algorithm


    Robert Floyd and Stephen Warshall had invented this algorithm. In a single execution
    of the algorithm, the shortest path between all pairs of vertices is discovered.
    This algorithm is based on dynamic programming.


    Cost[1,n,1,n] is the cost adjacency matrix of a graph with n vertices. A[i, j]
    is the cost of a shortest path from vertex i to vertex j. cost[i,j]=0, for 1<=i<=n.


    # Floyd-Warshall Algorithm for all pairs shortest path


    ```

    Algorithm: Shortest_path(A, cost)

    [A[i, j] is the cost of a shortest path from vertex i to vertex j]

    ```'
