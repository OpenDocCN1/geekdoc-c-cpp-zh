    # Linear Data Structures


    The data structure is linear if every data item is related to its previous and
    next data items (e.g., array, linked list). In the linear data structure, data
    items are arranged in memory in a linear sequence and data items are accessed
    linearly. The traversing of the linear data structure is exactly once.


    Linear data structures are two types:


    +   - i) Sequential

    +   - ii) Linked


    Sequential Data Structures are based on arrays where objects are stored in a sequence
    of consecutive memory locations.


    Example: Arrays, Stacks, Queues


    Linked Data Structure is a data structure, which consists of a set of nodes linked
    together and organized with links.


    Example: Linked Lists, Linked Stacks, Linked Queues


    # Non-linear Data Structures


    A data structure is non-linear if every data item attaches to many other data
    items in specific ways to reflect relationships (e.g., tree). In non-linear data
    structures, the data elements are not in sequence, i.e., insertion and deletion
    are not possible in a linear manner. The traversing of the non-linear data'
