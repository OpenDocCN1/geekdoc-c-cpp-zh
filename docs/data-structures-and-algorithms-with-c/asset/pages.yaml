  md: "# Insertion in Singly Linked List\n\nInsertion operation in a singly linked\
    \ list can be done in different ways using position.\n\n+   - Insertion at beginning.\n\
    +   - Insertion in the middle.\n+   - Insertion at end.\n\n# Insertion of a node\
    \ at first position of a singly linked list\n\nIn the following algorithm insertion\
    \ of node at beginning position is described. The ‘HEAD’ is a pointer which points\
    \ to the starting node of the linked list. NEW points to the new node.\n\n# Algorithm\
    \ to insert a node at the beginning\n\n```\nAlgorithm:ADD_BEG (HEAD, ITEM)\n1.\
    \ [Create the new node]\n   a) Allocate memory for NEW node.\n   b) IF NEW = NULL\
    \ then Print: “Memory not Available” and Return\n   c) Set NEW→DATA = ITEM\n \
    \  d) Set NEW→LINK = HEAD\n2. [Make the HEADER to point to the NEW node]\n   Set\
    \ HEAD = NEW\n3. Return\n```\n\nAt first creates a NEW node from the heap using\
    \ dynamic memory allocation and checks whether is NULL or not. If the NEW node\
    \ is NULL, then memory is not available. Otherwise, stores the value of ITEM of\
    \ the DATA part of the NEW node.\n\nThe following diagrams explain the insertion\
    \ operation at the beginning of a singly linked list.\n\nAt first HEAD points\
    \ to the first node of the list containing two nodes.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_109_0.png)\n\
    \n(a)\n\nA new node is created and pointed by pointer NEW. LINK field of new node\
    \ contains the address of head node.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_109_1.png)\n\
    \n(b)\n\nNow, HEAD pointer points to the new node\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_109_2.png)\n\
    \n(c)\n\nFigure 5.4 (a-c): Node insertion in a single linked list at beginning"
