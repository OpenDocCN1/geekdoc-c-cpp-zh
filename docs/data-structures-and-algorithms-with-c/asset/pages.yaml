  md: "each byte of the two variables, since every type of variable can be treated\
    \ as sequence of character.\n\n# Dangling Pointer\n\nDangling pointers are pointers\
    \ that do not point to a valid variable of the proper type. Dangling pointers\
    \ are created when memory is deallocated, without modifying the value of the pointer,\
    \ so that the pointer still points to the memory location of the deallocated memory.\
    \ When the system reallocates the previously freed memory to another process and\
    \ the original program dereferences the dangling pointer, then it may produce\
    \ an unpredictable result, as the memory may now contain completely different\
    \ data.\n\n# Example:\n\n```\n{\n    int *cp;\n    {\n        int c;\n       \
    \ cp = &c;\n    }\n/* c is in out of scope, cp is now a dangling pointer */\n\
    }\n```\n\nA solution to the above is to assign NULL to cp immediately before the\
    \ inner block is exited. Another frequent source of dangling pointers is a combination\
    \ of malloc() and free() library function calls: a pointer becomes dangling when\
    \ the block of memory it points to is freed. As with the previous example, one\
    \ way to avoid this is to make sure to reset the pointer to null after freeing\
    \ its reference.\n\n# Example:\n\n```\n#include <stdio.h>\n{\n    int *cp = malloc\
    \ (100);\n    free ( cp ); /* cp now becomes a dangling pointer */\n    cp = NULL;\
    \ /* cp is no longer dangling */\n}\n```\n\n# Allowable Operations with Pointer\n\
    \nThere are only a few numbers of operations of pointer are allowed. The allowable\
    \ operations of pointer are as follows:\n\n+   - Increment and decrement operations\
    \ with pointer variables.\n+   - Subtraction of two pointer variables.\n+   -\
    \ Addition and subtraction of integer value with pointers.\n+   - Relational operations\
