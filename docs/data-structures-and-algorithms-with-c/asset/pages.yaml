  md: "# Time complexity of Quick Sort\n\nBest-case time complexity: In Quick sort\
    \ best case occurs when the partitions are as evenly balanced as possible; their\
    \ sizes are almost equal, each partition has at most n/2 elements and the tree\
    \ of subproblem sizes looks like the following figure.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_287_0.png)\n\
    \nThe total number of comparisons can be calculated recursively:\n\n```\nT(n)\
    \ = {\n  c, when n=1\n  2T(n/2) + cn, Otherwise\n}\n```\n\nWhere c is a constant\n\
    \nNow,\n\n```\nT(n) = 2T(n/2) + cn\n= 2 . [2.T (n/4) + c.n/2] + cn\n= 2^2 T(n/4)\
    \ + cn+cn\n= 2^2 T (n/2^2) + 2cn\n:\n= 2^x T (n/2^x) + xcn\n```\n\nNow, let 2^x\
    \ = n, therefore x = log2n\n\n```\nT(n) = nT (n/n) + cnlog2n\n= nT (1) + cnlog.n\n\
    = cn + cnlog2n [hence T(1) = c]\n= O (nlog n)\n```\n\nIn the best case of quick\
    \ sort log n passes and each pass n number of comparisons are required."
  merge: -1
  img_proc: true
- pgno: 288
  md: "Worst-case time complexity: In quick sort worst case occurs when the array\
    \ is already sorted or when the pivot chosen by the partition function is always\
    \ either the smallest or the largest element in the n element subarray. Then one\
    \ of the partitions will contain no elements and the other partition will contain\
    \ n-1elements all but pivot. Therefore, the recursive calls will be on subarrays\
    \ of sizes 0 and n-1 elements. The tree of subproblem sizes looks like the following\
    \ figure.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_288_0.png)\n\nFigure 10.9:\
    \ Subprogram size in Quick Sort for worst case\n\nThe original call takes on time\
    \ for some constant c, the recursive call on n-1 elements takes c(n-1) time. The\
    \ recursion call on n-2 elements takes c(n-2) time, and so on.\n\nIn worst case,\
    \ total number of comparisons can be calculated recursively:\n\n```\nT (n) = {\n\
    \    c,             when n=1\n    T(n-1) + cn,   Otherwise\n}\n```\n\nWhere c\
    \ is a constant.\n\n```\nNow,\nT (n) = T (n-1) + cn\n    = [T (n-2) + c(n-1)]\
    \ + cn\n    = T (n-2) + c[n + (n-1)]\n    :\n    = T (n-r) + c[n + (n-1) + ...\
    \ + (n-r+1)]\n    = T (n-n+1) + c[n + (n-1) + ... + (n-n+1+1)] [when x = n-1]\n\
    \    = T (1) + c[n + (n-1) + ... +2] [hence T (1) = c]\n    = c + c[n + (n-1)\
    \ + ... +2]\n    = c[n + (n-1) + ... +2+1]\n    = c.n(n+1)/2\n    = O (n^2)\n\
    ```"
  merge: -1
  img_proc: true
