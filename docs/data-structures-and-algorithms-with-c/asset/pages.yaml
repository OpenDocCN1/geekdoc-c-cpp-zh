    During DFS, directed graph edges can be classified into the following:


    +   - Back edges: An edge (u, v) in which v is assumed as an ancestor of u in
    the tree (though it may not be in proper order). Thus, a self-loop is considered
    as back edge.

    +   - Forward edges: An edge (u, v) in which v is a proper descendant of u in
    the tree. These types of edges are known as forward edges.

    +   - Cross edges: An edge (u, v) in which u and v are not an ancestor or a descendant
    of one another. Such type of edges is known as cross edges.


