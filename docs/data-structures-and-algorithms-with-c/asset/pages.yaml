- pgno: 315
  md: "# Algorithm of Searching with Linear Probing\n\n```\nAlgorithm: SEARCH_PROBING\
    \ (HashTable, Key, Size)\n[HashTable is an array represents a hashtable, Key is\
    \ a searching key and Size is the size of the HashTable]\n1. Set HashIndex = Key\
