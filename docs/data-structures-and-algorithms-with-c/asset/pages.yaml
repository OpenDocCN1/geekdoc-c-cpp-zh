  md: '# **$\Theta$ (Theta) -Notation (Tight Bound)**


    If $f(n)$ & $g(n)$ are functions defined for positive integers, then we say $f(n)
    = \Theta (g(n))$ if there exists positive constants $n_0, c_1$ and $c_2$ such
    that


    $c_1 |g(n)| \le |f(n)| \le c_2 |g(n)|, \text{for all } n \ge n_0$


    In general, $\Theta (g(n)) = \{ f(n): \text{there exist positive constants } c_1,
    c_2 \text{ and } n_0 \text{ such that } c_1 |g(n)| \le f(n) \le c_2 |g(n)| \text{
    for all } n, \text{ where } n \ge n_0\}$.


    That is the right of $n_0$, the value of the function $f(n)$ always lies between
    $c_1 |g(n)|$ and $c_2 |g(n)|$ inclusive. This notation bounds a function to within
    constant factors. This is saying that the function, $f(n)$ is bounded from both
    the top and bottom by the same function, $g(n)$.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_34_0.png)


    $f(n)=\Theta(g(n))$


    **Figure 2.3: Theta Notation**


    **Example:**

    Suppose $f(n) = 3n + 2$

    Now we can write $3n \le 3n + 2 \le 4n$, for all $n \ge 2$, here $g(n) = n, c_1
    = 3, c_2 = 4, n_0 = 1$

    Hence, we can write $f(n) = \Theta (g(n)) = \Theta (n)$


    **Example:**

    Suppose $f(n) = 10n^2 + 4n + 2$

    Now we can write $10n^2 \le 10n^2 + 4n + 2 \le 11n^2$, for all $n \ge 5$

    Here $g(n) = n^2, c_1 = 10, c_2 = 10, n_0 = 5$

    Hence, we can write $f(n) = \Theta (g(n)) = \Theta (n^2)$


    **Example:**

    Suppose $f(n) = 2n^3 + n^2 + 2n$

    Now we can write $2n^3 \le 2n^3 + n^2 + 2n \le 3n^3$ for all $n \ge 2$, here,
    $c_1 = 2, c_2 = 3, n_0 = 2$

    Hence, we can write $f(n) = \Theta (g(n)) = \Theta (n^3)$


    # **o ("little oh") - Notation**


    For non-negative functions, f(n) and g(n), f(n) is little o of g(n) if and only
    if f(n) = O(g(n)), but f(n) $\neq$ $\Theta$(g(n)). This is denoted as "f(n) =
    o(g(n))".'
