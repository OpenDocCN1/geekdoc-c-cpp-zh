    \ Set C[K]=B[J]\n   b) Set J=J+1\n   c) Set K=K+1\n   (End of Loop)\n5. Return\n\
    ```\n\n# Time Complexity\n\nIn traversing operation, it required to access all\
    \ the elements of the array exactly once. Therefore, the time complexity is O\
    \ (n).\n\nDuring insertion operation, a best case occurs when insert element at\
    \ the last position of the array, then no array element movement is required.\
    \ Therefore, the time complexity of the insertion operation in the best case is\
    \ O (1), since not depends on the size of the array. The worst case occurs when\
    \ insert element at the first position of the array then all the array elements\
    \ required moving one position; n number of movements are required. Therefore,\
    \ the time complexity of the insertion operation in the worst case is O (n), since\
    \ depends on the size of the array. On an average, about half the elements of\
    \ the array need to be moved. Therefore, the time complexity of the insertion\
    \ operation in average case is O (n).\n\nSimilarly, in deletion operation, a best\
    \ case occurs when deletes an element from the last position of the array and\
    \ worst case occurs when deleting an element from the first position of the array.\
    \ Therefore, the time complexity of deletion operation in the best case is O (1),\
    \ in the worst case and average case is O (n).\n\nThe time complexity of this\
    \ merging algorithm is O (m + n), where m + n is the number of output elements\
    \ or the number of source elements combined.\n\n# Applications of Array\n\nArrays\
    \ are used to implement mathematical elements like vectors, matrices (including\
    \ sparse matrices), polynomials and different kinds of tables. Many databases\
    \ consist of one-dimensional arrays whose elements are recorded. Arrays are used\
    \ to implement other data structures, such as heaps, hash tables, deques, queues,\
    \ stacks and strings.\n\n# Representation of Polynomials\n\nA polynomial p(x)\
    \ is an expression of the form (a_nX^n + a_n-1X^n-1 + ... + a_3 X^3 + a_2X^2 +\
    \ a_1X + a_0).\n\nEach a_i X^i is a term of the polynomial, where x is a variable,\
    \ a_i is a respective coefficient and n is a non-negative integer. The number\
    \ n is called the degree of the polynomial. If a_i = 0, then the term is zero\
    \ term, otherwise it is non-zero term\n\nAn important characteristic of a polynomial\
    \ is that each term in the polynomial expression consists of two parts – one is\
    \ a coefficient and the other is an exponent."
