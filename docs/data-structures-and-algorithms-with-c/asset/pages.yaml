- pgno: 169
  md: "When should we use iteration, and when use recursion? There are three factors\
    \ to consider:\n\n+   i) Iterative functions are typically faster than their recursive\
    \ alternatives. Therefore, if speed were an issue, you would normally use iteration.\n\
    +   ii) If the stack limit is too constraining then you will prefer iteration\
    \ over recursion.\n+   iii) Some procedures are very naturally programmed recursively,\
    \ and all but unmanageable iteratively. Here, the choice is clear.\n\n# Factorial\n\
    \nFactorial of a number n is the product of the positive integer from 1 to n.\n\
    \nn! = 1 x 2 x 3 x ... x (n-1) x n\n\nFactorial of number can be defined in recursively\
    \ as follows:\n\nFactorial (n) = \\begin{cases} 1, & \\text{when n = 0 or 1} \\\
    \\ n \\times \\text{Factorial (n-1)}, & \\text{when n > 1} \\end{cases}\n\n# Function\
    \ to compute the factorial of a given number using recursion\n\n```\nFunction:\
    \ INT FACTORIAL (N)\n[N is a number]\n1. [Base condition]\n   If N < 2\n   Then\
    \ Return 1\n2. Else\n   [Call itself]\n   Return (N*FACTORIAL (N-1))\n```\n\n\
    The above function obtains the factorial of a given number n in a recursive manner.\
    \ If the number is one then factorial is computed otherwise for one the function\
    \ returns 1.\n\nThe above function fact is a recursive function because it calls\
    \ itself, namely, factorial (n) is calling fact (n -1).\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_169_0.png)\n\
    \nFigure 7.1: Recursive Function call processing"
  merge: -1
  img_proc: true
- pgno: 170
  md: "Therefore, if the function factorial is called by a value say 4, the function\
    \ call factorial (4) invokes itself with the value 3. The function call factorial\
    \ (3) invokes factorial (2), the factorial (2) invokes factorial (1). Then we\
    \ have no further function call because it has reached the base condition.\n\n\
    Therefore, in Stack first fact (3) is pushed, then fact (2) and at last, the fact\
    \ (1) is pushed. Moreover, these function calls are processed according to the\
    \ sequence they are popped from the stack.\n\n# Fibonacci sequence\n\nFibonacci\
    \ sequence is a series of positive number in a manner that the next term of the\
    \ series is the addition of two previous terms:\n\n0 1 2 3 5 8 13 21 34....\n\n\
    Fibonacci series can be defined in recursively as follows:\n\nFib (n) = { 0, when\
    \ n = 1 1, when n = 2 Fib (n-1) + Fib (n-2), when n > 2 }\n\n# A function : generate\
    \ a Fibonacci number using recursion\n\n```\nFunction : INT FIB (N)\n1. [Base\
    \ condition]\n   If N = 1\n   Then Return 0\n2. [Base condition]\n   If N = 2\n\
    \   Then Return 1\n3. [Call itself]\n   Return FIB (N-1) + FIB (N-2))\n```\n\n\
    The above function for obtaining a Fibonacci number of a given number n in a recursive\
    \ manner. If the number is greater than 2 then Fibonacci number is calculated\
    \ otherwise for one or two the function returns 0 or 1 respectively.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_170_0.png)\n\
    \nFigure 7.2: Recursion Tree for Fib (5)"
