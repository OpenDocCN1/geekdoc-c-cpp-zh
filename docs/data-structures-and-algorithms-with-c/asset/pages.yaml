    # Time complexity


    The time complexity of an algorithm is a number of computer time needs in execution
    to complete. It allows comparing the algorithms to check which one is efficient.


    There are different factors affecting the execution time, e.g. programmer skills,
    compiler options, hardware characteristics (instruction set, clock speed), the
    algorithm used, input size, etc. Generally, an estimate of the growth rate of
    execution time with input size is sufficient for comparison.


    # The rules for computing running time


    +   1. Sequence: Add the time of the individual statements. The maximum is the
    one that counts.

    +   2. Alternative structures: Time for testing the condition plus the maximum
    time taken by any of the alternative paths.

    +   3. Loops: Execution time of a loop is at most the execution time of the statements
    of the body (including the condition tests) multiplied by the number of iterations.

    +   4. Nested loops: Analyze them inside out.

    +   5. Subprograms: Analyze them as separate algorithms and substitute the time
    wherever necessary.

    +   6. Recursive Subprograms: Generally, the running time can be expressed as
    a recurrence relation. The solution of the recurrence relation yields the expression
    for the growth rate of execution time.


