    Consider the nodes of a binary tree of n nodes are numbered from 1 to n. The inorder
    permutation defined by such a binary tree is the order in which its nodes are
    visited during an inorder traversal of the tree. A preorder permutation can be
    defined similarly.


    Now, if the nodes of a binary tree are numbered such that its preorder permutation
    is 1, 2...n then distinct binary tree define distinct inorder permutation. For
    example, if the nodes of binary tree numbers 1, 2, 3 then possible permutations
    obtain by a stack are


    +   1, 2, 3

