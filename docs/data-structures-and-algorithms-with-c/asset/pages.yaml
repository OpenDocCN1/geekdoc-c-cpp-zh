  md: "# Operations on Circular linked list\n\nOperations supported by a singly linked\
    \ list are as follows:\n\n| Operation | Description |\n| :--- | :--- |\n| Createlist\
    \ | This operation creates a linked list. |\n| Traverse | This operation traverse/visit\
    \ all the elements of the linked list exactly once. |\n| Insertion | This operation\
    \ inserts an element to the linked list. |\n| Deletion | This operation removes\
    \ an element from the linked list. |\n| Searching | This operation performs linear\
    \ searching for a key value in the linked list. |\n| Reverse | This operation\
    \ performs the reverse of the linked list. |\n| Merging | This operation performs\
    \ merging of two linked lists in a single linked list. |\n\n# Create a Circular\
    \ linked list\n\nThis algorithm creates a node and appends it after the last node\
    \ (which points to the first node) of the existing list. HEAD is a pointer which\
    \ holds the address of the FIRST pointer of the linked list and DATA is the value\
    \ of the new node. _NEW' is a pointer which holds the address of the new node\
    \ and '_temp' is a temporary pointer.\n\n# Algorithm to create a Circular Linked\
    \ List\n\n```\nAlgorithm: CIRCULAR_ADD (HEAD, ITEM)\n1. [Create the new node]\n\
    \   a) Allocate memory for NEW node\n   b) IF NEW = NULL then Print: “Memory not\
    \ Available” and Return\n   c) Set NEW→DATA = ITEM\n   d) Set NEW→LINK = NEW\n\
    2. [Check whether List is empty or not]\n   If HEAD = NULL then\n   Set HEAD =\
    \ NEW\n3. Else\n   a) Set Temp = HEAD\n   b) Repeat while Temp→LINK # HEAD do\n\
    \   Set Temp = Temp→LINK\n   [End of loop]\n   c) Set Temp→LINK = NEW\n4. [Make\
    \ a new node to point to the first node]\n   Set NEW→LINK=HEAD\n5. Return\n```\n\
    \nPrimarily HEAD is assigned with NULL. when there is no node in a circular linked\
    \ list indicates first node of the linked list. Initially it is pointing to NULL.\n\
    \n![](img/723fa3ef35f5102eb67dc45b74bb823d_123_0.png)"
  merge: -1
  img_proc: true
