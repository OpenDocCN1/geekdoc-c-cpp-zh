  md: '+   - The pointers in linked list consume additional memory compared to an
    array.

    +   - In array and linked list push, pop operations can be done in O(1).


    # Applications of Stack


    The stack is a very useful data structure. Most of the modern computers and microprocessor
    provide an inbuilt hardware stack. Even there are stack-oriented computer architectures.


    +   1. A very important application of stack is to implement recursive function
    call and processing of function calls such as passing arguments.

    +   2. Evaluation of Arithmetic expressions.

    +   3. To simulate recursion.

    +   4. The scope rule and block structure can also be implemented using the stack.
    Stacks are used in the development of Compilers, System programs, Operating systems
    and in many elegant application algorithms.

    +   5. Stack is used to implement different algorithms, Depth first search, Quicksort,
    Mergesort etc.


    # Processing of Function calls


    One of the most important applications of the stack is the processing of subprogram
    calls and their termination.


    The program must remember the place where the call was made: so that it can return
    back after the subroutine is complete.


    Suppose we have three subprograms called A ( ), B ( ), C ( ) and one main program
    and main ( ) invokes A ( ), A ( ) invokes B ( ) and B ( ) in turn invokes C (
    ). Then B will not have finished its work until C ( ) has finished and returned.
    Similarly main ( ) is the first to start work, but it is finished last to be finished.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_146_0.png)


    Figure 6.2: Function call processing


    These function calls are pushed into the stack according to the order in which
    they were called along with their parameters and processed according to the order
    in which they are popped from the stack. The stack, which is used in function-call,
    is generally implemented in physical memory and in the reverse order. That means
    the stack top locates the last address.'
