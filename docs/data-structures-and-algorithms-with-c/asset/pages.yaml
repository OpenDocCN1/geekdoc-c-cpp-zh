  md: 'In the above example, primary indexing is explained. In the Student relation,
    Student_Roll is the primary key. It is used to identify a record in the relation
    uniquely. In the index file, the Student_Roll is used as a primary key value,
    block pointers are used to point the block that contains the record. The Indexing
    that is used here is called Sparse Index, where each primary key is not present
    in the index file rather some blocks are created where the first record of each
    block is indexed by the block pointer of the index file.


    # Table 12.1: Comparison between Dense and Sparse Primary Index


    | Feature | Dense Primary Index | Sparse Primary Index |

    |---|---|---|

    | Indexing | Pointer field directly points to a record for a search key. | Pointer
    corresponds to the first record of each block. |

    | Searching Time | Searching is fast. | Searching takes more time. |

    | Space Allocation | Consumes greater space. | Consume less space. |


    # Secondary Index


    To assist primary key index, a secondary index is created to improve search performance.
    This secondary index is created to improve search performance. This secondary
    key is generally on a non-key attribute and may have duplicate values. Generally,
    a base table is associated with one primary index and several secondary indices.


