- pgno: 296
  md: 'The shift-down process presents the entire input array as a complete binary
    tree, but non-heap and maintains it starts from the last non-trivial sub-heap
    (that is, the last parent node). Here, the building of the heap is done using
    a bottom-up approach and nodes are successfully shifting downward to establish
    the heap property. The elements A[N/2+1], A[N/2+2], ..., A[N], have no children,
    each of these elements is a sub-heap of size 1. Now, shift-down operation is performed
    for each I where I = N/2, N/2-1,...,1. Each of the two children of A[I] are the
    root of a sub-heap, so calling shift-down makes A[I] into the root of its own
    sub-heap. In shift-down operation, if one of the child is greater (max-heap) or
    smaller (min-heap) than its children, then it needs to be interchanged with that
    child.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_296_0.png)


    Figure 10.14: (a) Bottom-up (Shift-Down), (b) Top-Down (Shift-Up). The number
    in the circle indicates the maximum time of interchanges are needed when building
    the Heap.


    This shift-down version is more efficient than shift-up where insertion operation
    is called N times. Note that, for N/2 elements we call shift-down for N/4 elements
    on a sub-heap rooted at A[I] and whose height is 1. For N/8 elements, we call
    shift-down on a sub-heap whose height is two, and so on. In the figure 10.14,
    the number in the circle indicates the maximum time of interchanges are needed
    when building the heap. The shift-down version needs a less number of interchanges
    than shift-up version. Therefore, typically shift-down version is used to build
    a heap.


    Now, heap sort algorithm can be divided into two parts. Suppose A is an array
    with N elements from A[1] to A[N].


    +   i) In the first step, a max-heap is built from the N data items. As a result,
    the root A[1] is to be the largest element.


    +   ii) In the second step,


    +   - The interchange between A[1] and A[N]. Trivially, the largest element is
    placed in the N position of the array at the end of pass 1. Decreasing the heap
    size by one and shifting down the new first value A[1] into its proper position
    to rebuild the heap.


    +   - The interchange between A[1] and A[N-1]. The second largest element is placed
    in the N-1 position of the array at the end of pass 2. Decreasing the heap size
    by one and shifting down the new first value A[1] into its proper position to
    rebuild the heap.


    +   - The interchange between A[1] and A[N-2]. The third largest element is placed
    in the N-2 position of the array at the end of pass 3. Decreasing the heap size
    by one and shifting down the new first value A[1] into its proper position to
    rebuild the heap.


    +   - Finally, the interchange between A[1] and A[2]. Decreasing the heap size
    by one and trivially, the smallest element is in A [1].


    Therefore, the array of N elements from A[1] to A[N] is sorted after N-1 passes.'
  merge: -1
  img_proc: true
