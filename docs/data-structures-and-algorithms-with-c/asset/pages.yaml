  md: 'Binary search trees are a basic data structure used to construct abstract data
    structures such as sets, multisets, associative arrays. To sort a sequence of
    numbers, at first, all numbers are required to insert into a new binary search
    tree then traverse the tree in inorder.


    # Advantages of Binary Search Tree


    The major advantage of binary search tree over other data structures are as follows:


    +   i) Sorting and search algorithm can be very efficient.

    +   ii) Easy to the coding of most of the operations that performed on binary
    search tree.


    # Disadvantages of Binary Search Tree


    +   i) The shape of the binary search tree fully depends on the sequence of insertions
    and deletions operations may result in skewedness.

    +   ii) The height of the binary search tree is much higher than logn in the most
    of the cases, as a result, runtime may increase.

    +   iii) As the binary search tree is not a balanced tree, run time of most of
    the operations is O (n) in the worst case.


    # HEAP


    Heap is a binary tree that must satisfy the following properties:


    +   i) The binary tree essentially complete that means the tree completely filled
    all levels, the last level may be partially filled from left to right, and some
    rightmost leaves may be missing.

    +   ii) All keys in the tree, other than the root node, are greater/smaller than
    or equal to the key in the parent node.


    There are two types of the heap:


    +   i) Max Heap and ii) Min Heap


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_207_0.png)


    Figure 8.23: (a) Max Heap and (b) Min Heap


    # Max Heap


    A Max Heap is defined to be a complete binary tree with the property that the
    key of each node is greater than or equal to the keys of its children nodes.


    # Min Heap


    A Min Heap is also a complete binary tree with the property that the key of each
    node is smaller than or equal to the keys of its children nodes.


