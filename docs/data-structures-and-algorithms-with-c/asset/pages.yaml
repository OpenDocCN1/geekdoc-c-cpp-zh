  md: 'Bubble sort and insertion sort can be implemented as stable algorithms, but
    selection sort cannot (without significant modifications). Merge-sort is a stable
    algorithm, but Quicksort and Heapsort are not stable algorithms.


    # Online and Offline Sorting


    A sorting algorithm can start even if not all the elements are available at the
    beginning, is known as online sorting. Suitable when data items are arriving over
    a communication channel one by one. Insertion sort is an online sorting algorithm.


    An offline sorting algorithm cannot start unless all the data items are present
    at the beginning. All the elements must be available beforehand. Bubble sort,
    selection sort, quick sort, merge sort are offline sorting algorithm.


    # Comparison based Sorting and Non-comparison based Sorting


    A comparison sort examines the list of data elements only by comparing two elements
    with a comparison (relational) operator. In comparison-based sorting access input
    array elements only by using comparisons. It is a general-purpose sorting method.
    Bubble sort, insertion sort, selection sort, merge sort, quick sort, heap sort,
    shell sort, etc. are examples of comparison-based sorting algorithms. It can be
    proved that every comparison based sorting algorithm must have an average or worst
    case running time lower bound of Ω(nlog n), that means comparison based sorting
    algorithms cannot perform better than Ω(nlog n) in the average or worst case.


    Other sorting algorithms are not comparison sorts. As such, they are not limited
    by a Ω (nlog n) lower bound. Bucket sort, counting sort, radix sort are examples
    of non-comparison-based sorting, they are faster than the Ω (nlog n), although
    they have some limitations. Non-comparison-based sorting typically require specialized
    versions for each data-type and applicable only for a small range of elements.


    # Bubble Sort


    Bubble sort (also known as sinking sort) is a simple sorting algorithm that performs
    comparisons on each pair of adjacent elements, the first two elements in the array,
    then between the second and third element, then the third and fourth element,
    and so on and interchanging them if they are in the wrong order. The algorithm
    is named in the way smaller elements “bubble” to the top of the list.


    Suppose A is an array with n elements from A [0] to A[N-1]. The bubble sorting
    algorithm performs as below.


    +   - In the first pass, compare each pair of adjacent elements A [0] and A[1],
    A[1] and A[2], A[2] and A[3], until A[N-2] and A[N-1] and arrange them in proper
    order by interchanging them if they are in the wrong order. Therefore, in this
    pass, N-1 comparisons are required and the trivially largest element is placed
    in the N-1 position of the array at the end of pass 1.


    +   - In the second pass, compare each adjacent element A [0] and A [1], A [1]
    and A[2], A[2] and A[3], until A[N-3] and A[N-2] and arrange them in proper order.
    Therefore, in this pass, N-2 comparisons are required and the second largest element
    is placed in the N-2 position of the array at the end of pass 2.


    +   - In the third pass, compare each adjacent element A [0] and A [1], A [1]
    and A[2], A[2] and A[3], until A[N-4] and A[N-3] and arrange them in proper order.
    Therefore, in this pass, N-3 comparisons are required and the third largest element
    is placed in the N-3 position of the array at the end of pass 3.'
