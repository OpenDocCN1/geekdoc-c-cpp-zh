    In the example, the calloc() function allocates a memory block for 10 integer
    elements at runtime. After the memory allocation, it returns a pointer to the
    memory block and the block is initialized to zero. The sizeof operator is used
    to evaluate the size of each integer element in bytes. The explicit type conversion
    is optional.


    The calloc() function returns a void pointer to the newly allocated block of memory.
    When there is not enough space exists for the new block or if the argument size
    or nitems is zero then the calloc function returns NULL.


    The heap is available for dynamic allocation of variable-sized blocks of memory.
    Many data structures, such as trees and lists, naturally employ a heap memory
    allocation.


    # The realloc Function


    The realloc() function reallocates the memory block that means it attempts to
    reduce or increase the previously allocated block.


    The general form of the calloc() function is


    ```

    void *realloc(void *p , size)

    ```


    Here, p is a pointer to block that is previously allocated and size is representing
    the size of the memory block.


    If size is zero, the memory block is freed and NULL is returned. The block argument
    points to a memory block previously obtained by calling malloc, calloc() or realloc().
    If the block is a NULL pointer, the realloc () function works just like malloc.
    The realloc() function adjusts the size of the allocated block to size, copying
    the contents to a new location if necessary.


    The realloc() function returns the address of the reallocated block, which can
    be different than the address of the original block. When the block cannot be
    reallocated then the realloc() function returns NULL. If the value of size is
    zero, the memory block is freed and realloc() returns NULL.


    # The free Function


    The free() function is used to deallocate a memory block allocated by a previous
    call to calloc(), malloc(), or realloc(). The general form of the calloc() function
    is


    ```

    void free(void *p);

    ```


    Here, p is a pointer to block that is previously allocated. It returns nothing.


    # Example:


    ```

    int *p;

    p = malloc(10 * sizeof(int));

    free(p);

    ```


    The free() function releases the memory block, which is previously allocated by
    malloc() function.


    # Example:


    ```

    #include <stdio.h>

    #include <stdlib.h>

    #include <string.h>

    ```'
