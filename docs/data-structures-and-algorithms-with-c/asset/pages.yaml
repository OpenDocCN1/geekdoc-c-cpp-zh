- pgno: 324
  md: '# FILE STRUCTURE


    > "The most beautiful thing we can experience is the mysterious. It is the source
    of all true art and science." -Albert Einstein


    In computing, a file system is a method for organizing computer files and the
    data they contain to make it easy to find and access them. File systems may use
    a data storage device such as a hard disk or CD-ROM and involve maintaining the
    physical location of the files, they might provide access to data on a file server
    by acting as clients for a network protocol.


    # KEY FEATURES


    +   - File system

    +   - Elements of File System

    +   - Software Architecture of file system

    +   - Objective of file management system

    +   - Category of file Organization


    # ELEMENTS OF FILE SYSTEM


    There are four building blocks of the file system.


    +   - **Field**: Basic element of data contains a single value fixed or variable
    length

    +   - **Record**: A collection of related fields that can be treated as a unit
    by some application program fixed or variable length.

    +   - **File**: a collection of similar records treated as a single entity may
    be referenced by name access control restrictions usually apply at the file level.

    +   - **Database**: It is a collection of related data. The relationships among
    elements of data are explicit. It is designed to use by a number of different
    applications consists of one or more types of files.


    # Needs of File Management System


    File Management System is essential for managing the data in a file. An optimized
    file management system is required to manipulate the data in the file. It provides
    support to a variety of storage device type. It also provides a set of I/O interfaces
    routine to user processes.


    # File System Architecture


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_324_0.png)


    Figure 12.1: Architecture of File system'
  merge: -1
  img_proc: true
- pgno: 325
  md: '**Device Driver:** It is the lowest level component of the file system that
    directly communicates with hardware devices. It is responsible for I/O operation
    on a device. It provides an interface for the I/O peripherals to communicate with
    the operating system of the computing device.


    **Basic File System:** This component of the file system is considered as the
    interface between the memory device and the environment outside. The access methodology
    of secondary memory is defined by this interface. The memory block size, placement
    of memory block in secondary memory is also described by the basic file system.
    Buffering in main or primary memory is also the task of this file system.


    **Basic I/O Supervisor:** This component is responsible for all I/O initiation
    and termination process. It controls the scheduling disk and tape access to optimize
    performance. I/O buffers are assigned and secondary memory is allocated by this
    I/O Supervisor.


    **Logical I/O:** It presents a logical view of devices. Details of hardware devices
    and error handling are made hidden from the application. It optimise the use of
    I/O devices and CPU. Sharing and scheduling of devices are also done by logical
    I/O component of the file system.


    # File Organization Type


    The basic file operations that are performed on files are


    +   a) Insertion of record

    +   b) Deletion of records

    +   c) Manipulation of records

    +   d) Retrieval of records


    File organization is defined as the activity of planning data records onto a storage
    medium in such a way to facilitate ease of access to the stored data records.
    The effective file organization is required to reduce file access time for needed
    information, to store a large quantity of data records in the minimum space possible,
    to speed up computerized information storage and retrieval process, and to handle
    several sets of files using a hierarchy of storage device. Selection of the type
    of file organization is to be chosen depends upon several factors:


    +   • Type of application

    +   • The method of processing for updating files

    +   • The size of the file

    +   • The inquiry capabilities

    +   • The volatility

    +   • Response time


    # Category of file organization


    There are many ways of organizing the records in a file. Depending on the process
    of records are organized the file organization is categorized into various ways.
    The following figure describes the taxonomy of file organization:


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_325_0.png)


    Figure 12.2: Taxonomy of File Organization'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# ## Sequential File Organization


    In a sequential file organization the records are stored by maintaining an order
    either descending or ascending order determined by the key field. Sequentially
    organized files that are processed by the computer system are normally stored
    on storage media such as magnetic tape, punched paper tape, punched cards or magnetic
    disks. To access these records, the computer must read the file in sequence from
    the beginning. During searching of a record from a file, each record is examined
    sequentially until and unless the desired key field is matched. This method is
    suitable for taking backup for a database file where all the records should be
    processed at one time.


    # ## Advantages


    +   - Simple to understand approach.

    +   - Easy to organize, maintain and understand.

    +   - Loading a record requires only the record key.

    +   - Efficient and economical if the activity rate, i.e the preparation of file
    records to be processed is high.

    +   - Relatively inexpensive I/O media and devices may be used.

    +   - Errors in file remain localized.

    +   - Files may be relatively easy to reconstruct since a good measure of built-in
    backup is usually available.


    # ## Disadvantages


    +   - Random inquiries are usually impossible to handle.

    +   - Data redundancy is typically high since the same data may be stored in several
    files sequenced in different ways.

    +   - The entire file is needed to be processed even when it is not required.

    +   - Increase time complexity during searching for a single record.


    # ## Heap File Organization


    It is the simplest file organization where the records are stored without any
    order. As the records are inserted they are stored in that manner. A new record
    is inserted in the last page of the file; if there is insufficient space on the
    last page, a new page is added to the file. This makes insertion very efficient.
    However, as the heap file does not maintain any order so the records are retrieved
    using a linear search. A linear search involves reading pages from the file until
    the required is found. This makes retrievals from heap files that have more than
    a few pages relatively slow unless the retrieval involves a large proportion of
    the records in the file. During deletion of a record from a heap, the required
    page first has to be retrieved, the record marked as deleted, and the page written
    back to disk. The space with deleted records is not reused. Consequently, performance
    progressively deteriorates as deletion occurs. This means that heap files have
    to be periodically reorganized by the Database Administrator (DBA) to reclaim
    the unused space of deleted records.


    Heap files are one of the best organizations for bulk loading data into a table,
    as records are inserted at the end of the sequence; there is no overhead of calculating
    what page the record should go on.


    # ## Advantage


    +   - It is useful when we deal with the bulk of data at a time.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '+   - The relation is only a few pages long. In this case, the time to locate
    any tuple is Short, even if the entire relation has been searched serially.

    +   - When every tuple in the relation has to be retrieved (in any order) every
    time the relation is accessed. For example, retrieve the name of all the students.


    # Disadvantages


    +   - Heap file organization is not good when we deal with selected records of
    a file, this will increase processing time and thus degrade the performance.


    # Hash File organization


    In hash file organization the records are stored in the file using a hash function.
    A hash function is defined over a key field and that field is known as Hash Field.
    Hash function generates a value which is mapped to the key and accordingly the
    record is placed in the file. This file organization is also termed as Direct
    or Random file organization. These types of files are used in a direct access
    storage device (DASD) like a floppy disk, computer disk, optical disk, etc. in
    such storage devices, the records are stored in random order that allows immediate
    access as direct access to the individual records. Commonly some arithmetic function
    is applied to the hash field so that the records will be evenly distributed throughout
    the file.


    # Advantages


    +   - Access and retrieval of records become easy and fast.

    +   - Transaction need not be sorted and placed in sequence prior to processing.

    +   - Accumulation of transactions into batches is not required before processing
    them.

    +   - Immediate updating of several files as a result of the single transaction
    is possible.


    # Disadvantages


    +   - These files must be stored on a direct- access storage device. Hence, relatively
    expensive hardware and software resources are required.

    +   - Special precaution should be taken during manipulation of records.

    +   - Updating of records becomes difficult.

    +   - Less efficient than sequential file organization.


    # Index Sequential File Organization


    In this file organization the records are organized in a sequential manner. The
    difference with Sequential file organization is that here an index table is maintained
    for easy and fast access to the record. The records of the files can be stored
    in a random sequence but the index table is in a sorted sequence on the key value.
    The file management system simply accesses the data records in the order of the
    index value. These, indexed sequential files provide the user sequential access,
    even though the file management system is accessing the data records in a physically
    random order.


    +   Index file contains two fields

    +   i) Index field

    +   ii) Pointer field


    Depending upon these two fields, file indexing is categorized into following classes:


    # Primary Index


    If the primary key of the table is used as an index field then the corresponding
    indexing is known as'
