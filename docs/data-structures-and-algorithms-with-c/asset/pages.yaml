- pgno: 18
  md: '# # INTRODUCTION


    > > "Those who wise succeed must ask the right preliminary questions". - Aristotle


    In Computer Science, one of the core fields that belongs to its foundations, with
    the design, analysis, and implementation of algorithms for the efficient solutions
    of the problem concerned. The data structure is one of the subjects that intrinsically
    connected with the design and implementations of efficient algorithms. The subject_Data
    Structure'' deals with the study of methods, techniques, and tools to organize
    or structure data in computer memory. Now before defining Data Structure, we should
    know –what is data?” and –what is the difference between data and information?


    +   - Data and Information

    +   - Data Structure

    +   - Data Type

    +   - Abstract Data Type

    +   - Classification of Data Structure


    # ## Data and Information


    Data is a plural of datum, which is originally a Latin noun meaning –something
    given.” The Oxford dictionary meaning of data is: i) Facts or statistics used
    for reference or analysis. ii) The quantities, characters or symbols operated
    by a computer.


    For our purpose, the second meaning is more important. Therefore, we can say that:
    The data represent quantities, characters, or symbols on which operations are
    performed by a computer, stored and recorded on either magnetic, optical, or mechanical
    recording media, and transmitted in the form of digital electrical signals.


    **Definition:** Data is the basic entity or fact that is used in a calculation
    or manipulation process.


    Data is commonly processed by some stages. Unprocessed data or raw data is a collection
    of numbers, characters, that may be considered as an input of a stage and processed
    data is the output of the stage.


    There are two types of data, such as numerical and alphanumerical data. Data may
    be a single value or a set of values and it is to be organized in a particular
    fashion. This organization or structuring of data will have a profound impact
    on the efficiency of the program.


    Most of the individuals consider that the terms "Data" and "Information" are interchangeable
    and mean the same thing. However, there is a distinct difference between the two
    words. Data are raw facts without context, whereas Information is data with context.
    Data are an abstraction of information in a problem-solving system. Data requires
    interpretation to become an Information.


    Data can be any character, text, words, number, pictures, sound, or video and
    if not put into context means nothing to a human or computer. For example, 10409
    is a data, whereas information'
  merge: -1
  img_proc: true
