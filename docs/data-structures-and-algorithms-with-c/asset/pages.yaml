  md: '# Initialization of two-dimensional Arrays


    Like the one-dimensional arrays, two-dimensional arrays may be initialized by
    following their declaration with a list of initial values enclosed in braces.


    # Example:


    ```

    ```c

    int matrix[2][3] = {1, 1, 1, 2, 2, 2};

    ```

    ```


    Initializes all the elements of first row to 1 and the second row to 2. The individual
    array elements are as follow:


    ```

    ```c

    matrix [0] [0] = 1   matrix [0] [1] = 1   matrix [0] [2] = 1

    matrix [1] [0] = 2   matrix [1] [1] = 2   matrix [1] [2] = 2

    ```

    ```


    The initialization is done row by row. The above statement can be equivalently
    written as


    ```

    ```c

    int matrix[2][3] = {{1, 1, 1}, {2, 2, 2}};

    ```

    ```


    When a two dimensional array is completely initialized with all the elements then
    there is no explicit need of specifying the first dimensional. That is the statement


    # Example:


    ```

    ```c

    int matrix[][3] = {{1, 1, 1}, {2, 2, 2}};   /* valid */

    ```

    ```


    The compiler will automatically supply the first dimension. However, we have to
    specify the second dimension.


    So the statement


    ```

    ```c

    int matrix[2][] = {{1, 1, 1}, {2, 2, 2}};   /* invalid */

    ```

    ```


    is invalid, also the statement


    ```

    ```c

    int matrix[][]={{1, 1, 1}, {2, 2, 2}};   /* invalid */

    ```

    ```


    is invalid as the second dimension is missing.


    If some of the elements are missing, they are automatically initialized to zero
    by the compiler. So consider the following case


    ```

    ```c

    int matrix[2][3] = {{1,1},{2,2}};

    ```

    ```


    ```

    ```c

    matrix[0][0] = 1   matrix[0][1] = 1   matrix[0][2] = 0

    matrix[1][0] = 2   matrix[1][1] = 2   matrix[1][2] = 0

    ```

    ```


    Here the element matrix[0][2] and matrix[[1][2] are initialized to zero.


    Now consider the following case


    ```

    ```c

    int matrix[2][3] = {1, 1, 2, 2};

    ```

    ```


    The first four elements are initialized to 1, 1, 2 and 2 respectively and the
    remaining elements are initialized to 0 by default by the compiler. Therefore,
    the matrix elements are


    ```

    ```c

    matrix[0][0] = 1   matrix[0][1] = 1   matrix[0][2] = 2

    matrix[1][0] = 2   matrix[1][1] = 0   matrix[1][2] = 0

    ```

    ```


    # Reading and Writing a two-dimensional array


    We have already discussed how to read and write a one-dimensional array. Since
    there is only one subscript specification, it requires only one running variable;
    hence, we can use a single loop.


    However, in the case of the two-dimensional array, there are two subscripts. So
    it requires two running variables, one for a row and other for a column. Therefore,
    we have to use nested loops. Now consider the following example.'
