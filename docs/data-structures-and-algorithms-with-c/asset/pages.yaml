  md: "# Algorithm of Radix Sort\n\n```\nAlgorithm: RADIX_SORT (A, N)\n[Q is an array\
    \ of Circular Queue of size 10]\n[A is an array of N elements]\n1. Initialize\
    \ array Q\n2. Set X = maximum element of A\n3. Count the digits of X and Set pass\
    \ = number of digits\n4. Set DIV = 1\n5. Repeat For I = 1 to pass do\n6.     Repeat\
    \ steps For J = 0 to N-1 do\n7.         Set Remainder = A[J] mod (DIV *10)\n8.\
    \         Set Remainder = Remainder / DIV\n9.         Call INSERT (Q[Remainder],\
    \ A[J])\n   [End of Loop]\n10. Set DIV = DIV * 10\n11. Delete the elements from\
    \ the queue and place them into A\n12. [End of Loop]\n13. Return\n```\n\n# Time\
    \ complexity of Radix Sort\n\nThe lower bound of the comparison-based sorting\
    \ algorithms (Quick sort, Merge sort, Heap sort etc.) is Ω(nlog n), i.e. they\
    \ cannot be better than nlog n to sort n keys.\n\nNow, let there be k average\
    \ digits in the input data for Radix sort, b is the base for representing numbers,\
    \ for example, for the decimal system, b is 10. An LSD radix sort takes O(k*(n+b)\
    \ or O(nk) time. Sometimes k is presented as a constant, which would make the\
    \ radix sort better (for sufficiently large n) than the best comparison-based\
    \ sorting algorithms. The space complexity of the radix sort is O(n+b) as it needs\
    \ space for the original numbers and b buckets to place the n items.\n\n| Radix\
    \ Sort algorithm | Best Case | Average Case | Worst Case |\n|---|---|---|---|\n\
    | Radix Sort algorithm | O(nk) | O(nk) | O(nk) |\n\n# Shell Sort\n\nShell sort\
    \ can be seen as a generalized form of insertion sort. Donald Shell published\
    \ the first version of this sort in 1959. As Donald Shell developed this sorting\
    \ technique, hence it is named as Shell sort. The difficulty for insertion sort\
    \ is that an element moves towards its final position very slowly, one position\
    \ at a time and it cannot make a long jump quickly to reach its destination.\n\
    \n```\nh number of independent sub-arrays {\nA[0]   A[h]   A[2h]   A[3h]   ......\n\
    A[1]   A[h+1] A[2h+1] A[3h+1] ......\nA[2]   A[h+2] A[2h+2] A[3h+2] ......\n.\
    \      .      .       .\n.      .      .       .\n.      .      .       .\nA[h-1]\
    \ A[2h-1] A[3h-1] A[4h-1] ......\n}\n```\n\nFigure 10.17: h independent sub-arrays"
