  md: '# Representation of Priority Queue


    The priority queue can be represented using a (unsorted or sorted) linked list
    or array. For an unsorted array or for a linked list, insertion operation is done
    at the end or to the head of the linked list, or at the end of the array, therefore,
    it runs in O (1). In the peek operation, to return the highest-priority element,
    it required searching (linear search) the highest-priority element in the entire
    array or the linked list, therefore it runs in O (n). To remove the highest-priority
    element, it required searching (linear search) the highest-priority element in
    the entire array or the linked list. In an array, we also have to shift array
    contents to fill the gap. Therefore, it runs in O (n).


    However, a linked list or unsorted array are great for inserting elements, but
    not good at searching high-priority elements (or removing them). An alternative
    is to sort the array (or List or linked list) according to the priority, with
    the highest priority at the end of the array. For a sorted array or for a linked
    list, in insertion operation at first it needs to search for the correct position
    using binary search in an array (O (log n)) and linear search in a linked list
    (O (n)). Once the correct position is found, insert the element thereby keeping
    the entries in the array or linked list in order (as in insertion sort). In an
    array, this involves shifting all elements to the right of the inserted element
    over by one position. Therefore, in either case, the cost is O (n). In peek operation,
    to return the highest-priority element, it required returning the last element
    of the array or linked list as the highest-priority element is always at the end.
    Therefore, it runs in O (1). To remove the highest-priority element, it required
    removing the last element of the array or linked list as the highest-priority
    element is always at the end. In the array, by decreasing the size counter. Therefore,
    it takes O (1).


    A sorted array or linked list is fast at looking up and removing high-priority
    elements, but pays with linear insertion cost.


    # Priority Queue Representation with Heap


    The priority queue can be represented efficiently using a max-heap; the representation
    would be as follows:


    # Insert Operation


    Since we maintain the property of the complete binary tree, insert the element
    as a new leaf, as far to the left as possible, i.e. at the end of the array; increment
    the size of the heap. After insertion, it may violate the heap property when the
    newly added element has higher priority than its parent. Therefore, to restore
    the heap condition shift-up through the heap with that element. The running time
    of the insert operation on a n element heap is O (log n).


    # Algorithm to insert an item to Priority Queue


    ```

    Algorithm: Insert (Q, N, ITEM)

    [Q is an array represent priority queue, N is the number of items and ITEM is
    an item to be inserted into priority queue]

    1. Set N = N + 1

    2. Set I = N and J = I/2

    3. Repeat step 4 and 5 while I>1 and Q[J] < ITEM

    4. Set Q[I] = Q[J]

    5. Set I = J and J = I/2

    ```'
