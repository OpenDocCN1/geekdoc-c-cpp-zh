  md: "# Algorithm to insert an item to binary search tree using recursion method\n\
    \n```\nAlgorithm: INSERT (ROOT, DATA)\n1. IF ROOT = NULL THEN\n   i) Allocate\
    \ Memory for ROOT node.\n   ii) ROOT->INFO=DATA\n   iii) ROOT->LCHILD=NULL\n \
    \  iv) ROOT->RCHILD=NULL\n2. ELSE IF ROOT->INFO>DATA THEN\n   CALL INSERT (ROOT->LCHILD,\
    \ DATA)\n3. ELSE IF ROOT->INFO<DATA THEN\n   CALL INSERT (ROOT->RCHILD, DATA)\n\
    4. RETURN\n```\n\n# Searching in Binary Search Tree\n\nSimilar to traversing,\
    \ insertion operations in the binary search tree, search algorithm also utilized\
    \ the recursion technique.\n\nSuppose a key and the tree in which the key is searched\
    \ for are given as an input. Now starting from the root node, check whether the\
    \ value of the current node equals to the key or not. In the case, when a current\
    \ node is null then the searched key value does not exists in the binary search\
    \ tree. If the node has the key that is being searched for, then the search is\
