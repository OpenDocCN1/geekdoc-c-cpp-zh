    The tree is a non-linear data structure. A Tree may be defined as a non-empty
    finite set of nodes, such that i) There is a specially designated node called
    the root, ii) The remaining nodes are partitioned into zero or more disjoint trees
    T1, T2, ... Tn are called the subtrees of the root R.


    # Graph


    The graph is another non-linear data structure. A Graph G is defined as an ordered
    set G = (V, E), consists of finite non-empty set of objects V, where V(G) = {v1,
    v2, v3, ... vn} called vertices (or nodes or points) and another set E where E
    (G) = {e1, e2, e3, ... en} whose elements are called edges, that connects these
    vertices.


