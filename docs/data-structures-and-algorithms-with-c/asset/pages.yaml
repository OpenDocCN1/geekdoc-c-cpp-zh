  md: 'algorithm M are two main measures for the efficiency of M.


    The complexity of an algorithm M is the function f (n) which gives the running
    time and/or storage space requirement of the algorithm in terms of the size n
    of the input data.


    There are some qualitative aspects of algorithms, e.g., simplicity, readability,
    modularity, modifiability, well documented, etc. However, based on these, there
    can only be some subjective judgment about algorithms. Moreover, the objective
    criteria for the qualities of an algorithm are the amount of memory used and execution
    time.


    Therefore, the performance of the algorithm can be measured on the scales of time
    and space. Time means, we are looking for the fastest algorithm for the problem.
    Space means we are looking for an algorithm that consumes or needs minimum memory
    space for its execution.


    When performance is measured in terms of space, it is known as space complexity
    and when performance is measured in terms of time, it is termed as time complexity.


    There are two kinds of analysis of algorithm may be possible:


    +   i) Apriori Analysis

    +   ii) Posteriori Analysis


    # Theoretical / Apriori Analysis


    Apriori meaning “from the earlier”. It is on a theoretical basis, independent
    of programming languages and machine structures. Here, we do analysis (space and
    time) of an algorithm prior to running it on a specific system. That means we
    can determine time and space complexity of an algorithm of getting the algorithm
    rather than running it on a particular system (with different processor and compiler).
    The stress is laid on the frequency of execution of statements in the algorithm.


    # Empirical / Posteriori Analysis


    Posteriori means “from the latter”. The actual amount of space and time taken
    by the algorithms are recorded during execution. It is dependent on the programming
    language used and machine structure. Here, we do an analysis of the algorithm
    only after running it on the system. It directly depends on the system and changes
    from system to system.


    In real-life, we cannot do posteriori analysis as software is generally made for
    an anonymous user, which runs it on a system different from those present in the
    industry. Therefore, in Apriori analysis, we use asymptotic notations to determine
    time and space complexity as they change from computer to computer but asymptotically
    they are same


    # Space Complexity


    The space complexity is the amount of space (memory) is needed for an algorithm
    to solve the problem. An efficient algorithm takes space as small as possible.


    Space needed by a program is the sum of the following components:


    +   1. Instruction space: Space needed to store the executable version of the
    program and it is fixed.

    +   2. Data Space: Space needed to store all constants, variable values and has
    further following components.

    +      a) Space needed by constants and simple variables. This space is fixed.

    +      b) Space needed by fixed sized structured variables, such as arrays and
    structure.

    +      c) Dynamically allocated space from memory pool called heap. This space
    usually varies.

    +   3. In-built stack space: Space needed to store the information needed to resume
    the suspended functions. Each time a function, the following data is saved on
    the in-build stack.'
