    # Figure 11.5: Separate Chaining


    The main drawback to chaining is that one needs more memory spaces for the link
    field and there are m memory slots for the pointer array. An additional disadvantage
    is that traversing a linked list has poor cache representation.


    +   - Cost is proportional to the length of the list: Cost in terms of time complexity
    is proportional to the length of the list.

    +   - Worst case: If the hash function is not efficient then it generates same
    hash key that increases the length of one list.

    +   - M too large: If the value of m is too large then the number of chains becomes
    a more and more chain will be empty.

    +   - M too small: If the value of m is too small, that increase the length of
    the list.


    # Table 11.2: Type of Collision Resolution Technique


    | Feature | Linear Probing | Quadratic Probing | Double Hashing |

    | :--- | :--- | :--- | :--- |

    | Efficiency | Fastest among three. | Easy to implement and deploy | Make more
    efficient use of memory |

    | Probe use | Use few probes. | Uses extra memory for links and it does not probe
    all locations in the table. | Use few probes, but take more time. |

    | Demerit | Primary clustering is a limitation. | Secondary clustering is the
    limitation. | More complicated to implement. |

    | Computing Interval | The interval between probes is fixed and it is 1. | The
    interval between probes increases proportionally to the hash value. | The interval
    between probes is computed using the second hash function. |'
