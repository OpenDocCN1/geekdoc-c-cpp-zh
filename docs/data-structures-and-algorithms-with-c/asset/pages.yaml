    # Selection Sort


    In selection sorting algorithm, first select the smallest element in the list
    and place it in the first position. Then select the second smallest element in
    the list and place it in the second position, and so on. As selection operation
    is performed in this sorting technique, hence it is named as selection sort.


    Suppose A is an array with N elements from A[0] to A[N-1]. The selection sorting
    algorithm, select the Kth smallest element A [K] from the array and place into
    the K-1 position.


    +   - In the pass 1, select the position POS of the smallest element in the list
    of N elements and then swapping A[POS] and A[0] so that, A[0] is sorted.

    +   - In the pass 2, select the position POS of the smallest element in the sub-list
    of N-1 elements A[1], A[2],...A[N-1] and then swapping A[POS] and A[1] so that,
    A[0], A[1] is sorted.

    +   - In the pass 3, select the position POS of the smallest element in the sub-list
    of N-2 elements A[2], A[3],..., A[N-1] and then swapping A[POS] and A[2] so that,
    A[0], A[1], A[2] is sorted.

    +   - In the pass N-1, select the position POS of the smallest element in the
    sub-list of 2 elements A[N-2], A[N-1] and then swapping A[POS] and A[N-2] so that,
    A[0], A[1], A[2],...,A[N-2] is sorted.

    +   - The last array element A [N-1] is the apparently largest element of the
    array.


    Therefore, array A of N elements from A [0] to A [N-1] is sorted after N-1 passes.


