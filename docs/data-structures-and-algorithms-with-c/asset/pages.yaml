- pgno: 36
  md: '# 1. Constant time algorithms [ O(1) ]:


    This means that the algorithm requires the same fixed number of steps regardless
    of the size of the task.


    Example: Array access, Push and pop operations for a stack, enqueue and dequeue
    operations for a queue, other atomic operations.


    # 2. Logarithmic time algorithms [ O (log n) ]:


    Logarithm time algorithms mean that T(n) is upper bounded by logarithmic of the
    input size, i.e. T(n) = log n.


    Example: Binary search in a sorted list of n elements. Insert and Find operations
    for a binary search tree with n nodes, Insert and Remove operations for a heap
    with n nodes, etc.


    # 3. Linear time algorithms [ O (n) ]:


    Linear time algorithm means that for large enough input sizes the running time
    increases linearly with the size of the input.


    Example: Array traversal


    # 4. Linearithmic time algorithm [ O (nlog n) ]:


    An algorithm is said to run in linearithmic time when T(n) = O (nlog n). Thus,
    a linearithmic term grows faster than a linear term, but slower than any polynomial
    in n with degree greater than 1.


    Example: Merge sort, Heap sort


    # 5. Polynomial time algorithms [ O (n^k), for k > 1 ]:


    +   i) Quadratic time ( O (n^2)) algorithm: The number of operations is proportional
    to the size of the task squared.


    Example: Slow sorting algorithms, for example, selection sort of n elements.


    +   ii) Cubic time O (n^3) algorithm: The number of operations is proportional
    to the size of the task cubed.


    Example: Matrix multiplication


    # 6. Exponential time algorithms [ O (k^n), for k > 1 ]:


    Exponential time algorithm means that T(n) is upper bounded by exponential expression
    of input size, i.e. T(n) = k^n


    Example: Towers of Hanoi, implementation of recursive Fibonacci, generating all
    permutations of n symbols.


    # 7. Factorial time algorithms [ O (n!) ]:


    Polynomial time algorithm means that T (n) is upper bounded by the factorial of
    the input size, i.e. T(n) = n!.


    Example: Non-attacking n queen problem, traveling salesman problem by brute-force
    search


    The best time in the above list is obviously constant time, and the worst is exponential
    time, which, as we have seen, quickly overwhelms even the fastest computers even
    for relatively small n. Polynomial growth (linear, quadratic, cubic, etc.) is
    considered manageable as compared to'
