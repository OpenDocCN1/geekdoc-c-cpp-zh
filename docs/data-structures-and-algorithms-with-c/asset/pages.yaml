  img_proc: true
- pgno: 222
  md: "![](img/723fa3ef35f5102eb67dc45b74bb823d_222_0.png)\n\n# B-tree\n\nB-tree is\
    \ a good example of a data structure for external memory; it uses multi-way search\
    \ tree rather than a binary tree. The B-tree optimized the system to read and\
    \ write a large block of data to external memory because they allow for large\
    \ amounts of data to be stored in a node. B-tree performs searching, insertion\
    \ and deletion operation in O (log n) time. B-tree is commonly used in databases\
    \ and file systems.\n\nB-trees are balanced trees and an m-way search tree of\
    \ order m (where m >= 3). B-tree is a generalization of a binary search tree in\
    \ that a node can have more than two children and only one key (where m = 2).\n\
    \nDefinition: B-tree can be defined as follows:\nA B-tree is either empty or for\
    \ a non-empty B-tree satisfies the following properties:\n\n+   i) All the non-terminal\
    \ nodes, except root node, each node has maximum m children and minimum [m/2]\
    \ children. The non-terminal root node has maximum m children and minimum two\
    \ children.\n+   \n+   ii) If a node has m number of children then it must have\
    \ m-1 distinct key values K1, K2, ... Km-1 and all the key values of each node\
    \ are in sorted order such that K1 < K2 < ... < Km-1.\n+   \n+   iii) All the\
    \ key values in the subtree A1 of a node [K1, K2, ... Kn] may hold only values\
    \ K in the range K_i <= K <= K_{i+1}.\n+   \n+   iv) Each terminal nodes must\
    \ contain minimum [m/2] - 1 keys.\n+   \n+   v) All the terminal nodes must be\
    \ at same level.\n\nThese restrictions make B-trees always at least half full,\
    \ have few levels, and remain perfectly balanced. Therefore, in B-trees do not\
    \ need re-balancing as frequently as other self-balancing search trees but may\
    \ waste some space, since nodes are not entirely full. The lower and upper bounds\
    \ on the number of children nodes are typically fixed for a particular implementation.\n\
    \nFor example, for a B-tree of order 4, i.e. when m = 4 then each internal nodes\
    \ has from 2 to 4 children and from 1 to 3 keys. Another B-tree order of 7, i.e.,\
    \ when m = 7 then each internal nodes has from 4 to 7 children and from 3 to 6\
    \ keys (except the root node which may have as few as 2 children and 1 key)."
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The structure definition for a node of B-tree as follows:


    ```

    struct BTreeNode

    {

    int nchild;

    struct *BTreeNode[M];

    int key[M-1];

    };

    ```


    # Operations on B-tree


    Operations supported by a B-tree are as follow:


    | Operation | Description |

    |---|---|

    | Traverse | This operation traversing all the nodes of B-tree exactly once. |

    | Insertion | This operation inserts a node in the B-tree. |

    | Deletion | This operation removes a node from the B-tree. |

    | Searching | This operation searches a desired key value within the B-tree. |


    # Searching in B-tree


    Searching in a B-tree for a key is the generalization form of the searching in
    Binary Search Tree. An internal node with keys K<sub>1</sub> < K<sub>2</sub> ...
    < K<sub>n-1</sub> can search for a searching key k in either linearly or by binary
    searching. If the key is found in the node then searching is over. Otherwise,
    determine the index i such that K<sub>i</sub> < k < K<sub>i+1</sub>, and recursively
    search the subtree A<sub>i</sub>. Finally, search all the keys in the leaf node.
    If the key is not found there then searching is unsuccessful.


    # Insertion in a B-tree


    Insertion operation into a B-tree of order m is performed by searching the appropriate
    leaf node where we insert the key. There are three cases for insert a key into
    B-tree.


    **Case 1:** When the leaf node is not at full capacity (i.e. it has fewer than
    m – 1 keys), then simply insert it into proper position so that after insertion
    the keys remains sorted. Therefore, it requires to movement keys within leaf node
    for the newly inserted key. Since m is assumed a constant, so the constant time
    overhead may be ignored.


    **Case 2:** When the node is full (i.e. it has exactly m – 1 keys), then check
    its immediate left or right siblings in the B-tree, which may have fewer than
    the maximum of m – 1 keys. Suppose Q is the right siblings has less than m – 1
    keys and P is the node has m – 1 keys. Now, after inserting the new key, transfer
    the key of the parent node to the Q node and make minimum key. The maximum key
    transfers from P and places it in the parent node. Finally, transfer the rightmost
    subtree from P to become leftmost subtree of Q. At this point, the B-tree is balanced
    and no further rebalancing is required. This method is known as **key rotation**.
    Similarly, when left siblings have less than m – 1 keys then key rotation also
    can be performed.


    **Case 3:** When the node along with its both siblings is full, then key rotation
    is not possible. Suppose, after inserting the new key, the node becomes overflow
    with k keys. Now, split this node into three parts, one with the smallest [(m
    – 1)/2] keys, a single central key and one with the largest [(m – 1)/2] keys.
    Then, create a new B-tree node with the smallest keys, insert the single central
    node'
