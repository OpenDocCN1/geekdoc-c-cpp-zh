    # Complete Binary Tree


    A binary tree is called a complete binary tree in which all the levels are filled
    and the last level possibly be partially filled from left to right and some rightmost
    leaves may be missing. The complete binary tree is maximally space efficient.
    The number of internal nodes in a complete binary tree of n nodes is [n/2]. Consider
    the figure, all the terminal nodes are at the adjacent levels. Practical example
    of a complete binary tree is Heap.


    # Full Binary Tree


    A binary tree of depth k>=1, contains 2^k-1 nodes, is called full binary tree
    or perfect binary tree. Note that, a binary tree can have the maximum number of
    nodes 2^k-1. In the other word, in a full binary tree, all the internal nodes
    have two children and all leaves are at the same level. Consider the figure, a
    full binary tree of depth 3. All full binary tree is a complete binary tree, but
    all complete binary trees are not full binary tree.


