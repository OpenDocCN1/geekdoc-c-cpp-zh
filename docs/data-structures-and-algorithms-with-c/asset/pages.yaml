    \ text editors to find and replace all.\n\n# Brute Force (Naive) String Matching\n\
    \nBrute Force string matching technique is a simple way to test where a pattern\
    \ occurs within a string in all the possible positions. Brute Force string matching\
    \ algorithm also known as Naive algorithm. Naive means basic.\n\nConsider m is\
    \ the length of a pattern and n is the length of the searchable string or text.\
    \ The algorithm can be interpreted as a sliding a pattern P over the text string\
    \ S and observe for which shift all the characters in the pattern match the corresponding\
    \ character in the string. Specifically, the pattern is shifting successively\
    \ from I = 0 to n - m, and for each shifting compare the pattern P[1 to m] with\
    \ the string S[I + 1 to I + m].\n\n# Example:\n\nSuppose a given text string S\
