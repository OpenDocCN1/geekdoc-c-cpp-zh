    # Representation of Data


    Almost all the high-level languages, e.g. FORTRAN, COBOL, C, Pascal, C++, Java,
    etc. allow data to be represented in computer memory of mainly two types:


    +   - i) Numerical Data

    +   - ii) Alphanumerical Data


    Most of the high-level languages classified numerical data into two types:


    +   - i) Integer

    +   - ii) Floating-point


    In C language, the following Data types are used to represent numerical data.


    # Table 1.1: Ranges of numerical data types


    | Data types | Memory requirement | Ranges |

    |---|---|---|

    | char or signed char | 1 byte | -128 to +127 |

    | unsigned char | 1 byte | 0 to 255 |

    | short signed int or short int or signed int or int | 2 bytes | -32768 to +32767
    |

    | long signed int or long int | 4 bytes | -2147483648 to +2147483647 |

    | signed int or int ( for 32 bit compiler) | 4 bytes | -2147483648 to +2147483647
    |

    | unsigned int | 2 bytes | 0 to 65,535 |

    | long unsigned int | 4 bytes | 0 to 4294967295 |

    | float | 4 bytes | -3.4e38 to +3.4e38 |

    | double | 8 bytes | -1.7e308 to +1.7e308 |

    | long double | 10 bytes | -1.7e4932 to +1.7e4932 |


    # Integer


    For small integer data, most of the high-level languages generally use two bytes
    to represent both positive and negative decimal integers. Negative integer numbers
    are represented by 2''s complement notation. For large integer data, generally,
    four bytes are used to represent both positive and negative decimal integers.


    # Floating-Point


    In the representation of small floating-point data, most of the high-level languages,
    e.g. C language, use four bytes for fractional decimal numbers. For large numbers,
    double and long double are used to accommodate in memory.


    Alphanumerical data are classified into two types:


    +   - i) Character

    +   - ii) String'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # Character


    The characters may be alphabets, digits, special characters and white spaces.
    In C language, characters are represented by char data type and one-byte memory
    space is used for storing the same. The ASCII format has been used in C language
    to represent the characters. While storing character ‘C’ in the computer, ASCII
    value 67 is stored in memory.


    # # String


    The string is a sequence of characters may consist of any number and any combination
    of characters. The characters may be alphabets, digits, special characters and
    white spaces. In C language, the string can be defined as an array of characters
    terminated with a null character.


    # # Data Type


    Generally, computer programs do exist for a single purpose: how to process data.
    The type of data, the format of data that is going to be returned and the correctness
    of the processing are the primary concerns of a computer program. When a program
    is written, how the computer handles the data internally is usually a secondary
    concern.


    **Definition:** A data type refers to the type of data that variables hold.


    Now, depending on the representation of different forms of data, different data
    types are used. The data types are names given to a set of variables, which have
    common properties. A data type refers to the type of data that variables hold.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_20_0.png)


    Figure 1.2: Data Types


    The C language supports three classes of data types:


    +   i) Primary or Basic data types

    +   ii) Derived data types

    +   iii) User-defined data types


    Basic or primary data types are language built-in. The C language supports five
    primary or basic data types. They are


    +   i) char ii) int iii) float iv) double v) void


    # # Data Structure


    Data Structure is the representation of the logical relationship between individual
    elements of data. In Computer Science, Data Structure is defined as a mathematical
    or logical model of organizing the data items into computer memory in such a way
    that they can be used efficiently. The purpose of studying'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'data structure is to learn how to organize data into memory so that it can
    be accessed quickly and conveniently.


    Data Structure refers to the study of data and representation of data objects
    within the program; i.e., the implementation of structured relationships among
    different data objects.


    **Example:** lists, stacks, queues, heaps, search trees, hash tables, etc.


    Different sets of operations can be performed on different data structures. The
    operations that can be performed on different data elements within a data structure
    are accessing, traversing, inserting, deleting, modifying etc. While writing a
    program, a minimal data structure must be chosen that supports all the operations
    as per need.


    Data Structure can be used for the following purpose:


    +   i) Organizing the data – How data items are organized in the main memory?

    +   ii) Accessing methods – How data items can be accessed?

    +   iii) Specifying the degree of associativity – How data items are interrelated?

    +   iv) Processing alternatives for data – How many different ways are there in
    which these data items can be processed?


    A program is a set of instructions, which involve a computer performing some kind
    of computation or algorithm. Data Structure affects the design of both structural
    and functional aspects of a program. To implement a program of an algorithm, we
    should select an appropriate data structure for that algorithm. Therefore, the
    programs are inherited by an algorithm and its associated data structure.


    # **Algorithm + Data Structure = Program**


    Programming languages provide facilities for representatives of algorithm and
    data. High-level Programming Language, like C, facilitates structured and modular
    programming by providing algorithm structures.


    # **Classifications of Data Structure**


    Data Structure can be classified into two categories:


    +   i) Primitive data structure

    +   ii) Non-Primitive data structure


    # **Primitive Data Structure**


    The primitive data structures are defined that can be manipulated or operated
    by the machine instruction. There are numerous types of data structures, generally
    built upon simpler primitive data types, called Primitive data structures, which
    are represented in computer memory.


    **Example:** Integer, floating point, characters, pointer, boolean, etc. are some
    of the different primitive data structure.


    In C language, the different primitive data structures are defined using the data
    type such as int, char, float, double etc.


    # **Non-primitive Data Structure**


    The non-primitive data structures are a data structure that cannot be manipulated
    or operated directly by the machine instructions. These are more sophisticated
    data structures. Non-primitive data structures are derived from the primitive
    data structure. These are a group of homogeneous or heterogeneous data items.


    **Example:** Arrays, structure, stack, queues, linked lists etc.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The Non-primitive data structures are classified into two categories:


    +   - i) Linear data structure

    +   - ii) Non-linear data structure


