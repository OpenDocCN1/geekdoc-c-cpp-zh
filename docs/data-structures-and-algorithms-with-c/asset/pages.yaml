    # Travelling Sale''s Man Problem


    Before describing Travelling Salesman Problem, we need to know Hamilton circuit.


    **Hamilton Circuit**: A Hamilton circuit is a circuit that uses every vertex of
    a graph once.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_265_0.png)


    Figure 9.35: Hamilton Circuit


    In this example the Hamilton circuit is


    +   1. V5->V4->V1->V2->V4->V5

    +   2. V1->V2->V4->V5->V3->V1

    +   3. V1->V3->V2->V4->V5->V1


    **Minimum cost Hamilton circuit**: In a weighted graph, a minimum Hamilton circuit
    is a Hamilton circuit with the smallest possible weight.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_265_1.png)


    Figure 9.36: Minimal Cost Hamilton Circuit


    # Solution By Brute Force Algorithm


    This algorithm describes the process of finding minimal cost shortest path from
    vertex i to vertex j.


    ```

    Algorithm: Butte_force(A, cost)

    [A[i, j] is the cost of a shortest path from vertex i to vertex j]

    1. Choose A starting Point, here it is V1.

    2. List all possible Hamilton circuits with total cost.

    3. Find weight of each circuit.

    4. Find minimum Hamilton circuit with the lowest cost.

    5. Return

    ```'
