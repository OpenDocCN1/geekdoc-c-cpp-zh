    # Breadth First Search (BFS)


    In breadth first search we visit a vertex (v) first and then explore all its adjacent
    vertices and make them visited. A vertex (v) is said to be explored when all its
    adjacent vertices are visited. The newly visited vertex is put into the list of
    unexplored vertices.'
