    # Operations Perform on Data Structure


    Data are processed by means of certain operations, which appear in the data structure.
    The particular data structure is chosen largely depends on the frequency of the
    operation that needs to be performed on the data structure. Different kinds of
    operations are to be performed on data structures.


    Table 1.2: Operations on Data Structures


    | Operation | Description |

    |---|---|

    | Creation | Allocation of memory for the data structure, the creation of data
    structure may take place either during compile-time or during run-time. |

    | Insertion | Insert a data item in the data structure. |

    | Deletion | Delete a data item from the data structure. |

    | Traversing | Accessing and processing each data item of the data structure exactly
    once. |

    | Searching | Find the location of the key value within the data structure. |

    | Sorting | Arranging all the data items in a data structure either in ascending
    or in descending order or in lexicographical order (for Strings). |

    | Merging | Combining the data items of two different sorted lists into a single
    sorted list. |


    # Overview of Different Data Structures


    Different data structures can be defined as follows:


    # Array


    An array is a collection of the same type of data items, which are stored in consecutive
    memory locations under a common name. In arrays, there is always a fixed relationship
    between the addresses of two consecutive elements as all the items of an array
    must be stored contiguously.


    # Stack


    A stack is a collection of elements into which new elements may be inserted and
    from which elements may be deleted only at one end called the top of the stack.
    Since all the insertion and deletion in a stack is done from the top of the stack,
    the last added element will be first to be removed from the stack. That is the
    reason why stack is also called Last-In-First-Out (LIFO) data structure.


    # Queue


    A queue is a homogeneous collection of elements in which deletions can take place
    only at the front end, known as dequeue and insertions can take place only at
    the rear end, known as enqueue. The element, which inserts in the queue first,
    will delete the queue first. In this order, a queue is called First-In-First-Out
    (FIFO) system.'
