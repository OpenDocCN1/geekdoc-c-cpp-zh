    Figure 3.2: Two-dimensional array m [2][3]


    # Address Calculation in two-dimensional Array


    A two-dimensional array can be implemented in a programming language in two ways:


    +   * Row-major Implementation

    +   * Column-Major Implementation


    Note: In C language a two Dimensional Array is implemented only by row major order.


    # Row-major Implementation


    In a row-major implementation, memory allocation is done row by row; i.e. all
    the elements of the first row is stored then the second row is stored and so on.


    | | 0 | 1 | 2 |

    |---|---|---|---|

    | 0 | A[0][0] | A[0][1] | A[0][2] |

    | 1 | A[1][0] | A[1][1] | A[1][2] |

    | 2 | A[2][0] | A[2][1] | A[2][2] |


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_47_0.png)


    Figure 3.3: Two dimensional array and row-major representation


    The two-dimensional array can be implanted in row major order like the above figure
    3.3.


    Address of element A [ i ] [ j ] = B + W ( n ( i – Lr ) + ( j – Lc ) )


    +   * Where B is the base address of the array

    +   * W is the size of each array element

    +   * Lr is the lower bound of row

    +   * Lc is the lower bound of column

    +   * Ur is the upper bound of row

    +   * Uc is the upper bound of column

    +   * n is the number of columns , n = ( Uc – Lc ) + 1'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Column-major Implementation


    In a column-major implementation, memory allocation is done column by column;
    i.e. all the elements of the first column are stored then the second column is
    stored and so on.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_48_0.png)


    Figure 3.4: Two-dimensional array and column-major representation


    The two-dimensional array can be implanted in column-major order like the above
    figure 3.4.


    Address of element A [ i ] [ j ] = B + W ( ( i - Lr ) + m ( j - Lc ) )


    +   - Where B is the base address of the array

    +   - W is the size of each array element

    +   - Lr is the lower bound of row

    +   - Lc is the lower bound of column

    +   - Ur is the upper bound of row.

    +   - Uc is the upper bound of column

    +   - m is the number of rows, m = ( Ur - Lr ) + 1


    # Example:


    Let the size of the elements stored in an 8 x 3 matrix be 4 bytes each. If the
    base address of the matrix is 3500, then find the address of A [5][2] for both
    row major and column major cases.


    Answer: As the lower bounds of row and column are not given, they are assumed
    as 0. [As in C lower bounds are always 0]

    So,

    Lr = 0

    Lc = 0

    Number of rows m = 8

    Number of columns n = 3

    Size of each element W = 4

    Base address B = 3500

    So, in row major order address of element A[5][2]

    = 3500 + 4 × ((5 – 0) × 3 + (2 – 0))

    = 3568

    And in column major order address of element A[5][2]

    = 3500 + 4 × ((5 – 0) + (2 – 0) × 8)

    = 3584'
  merge: -1
  img_proc: true
