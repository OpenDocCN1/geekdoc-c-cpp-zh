    # Comparisons of queer representation using linked list over the array


    +   - The array is fixed size, therefore, a number of elements will be limited
    in the queue. Since linked list is dynamic and can be changed easily, so the number
    of elements can be changed.

    +   - The pointers in linked list consume additional memory compared to an array.

    +   - In array implementation, sometimes dequeue operation not possible, although
    there are free slots. This drawback can be overcome in linked list representation.

    +   - In array and linked list enqueue and dequeue operations can be done in O
    (1).


    # Application of Queue


    +   - A major application of the queue is in simulation [see Kruse for example].

    +   - In operating systems, queues are used for process management, I/O request
    handling, etc. Examples: Print queue of DOS, Message queue of Unix IPC.

    +   - Queues are also used in some elegant algorithms like graph algorithms (breadth
    first search), radix sort etc.

    +   - Different types of customer service software are designed using a queue
    for proper service to the customer.

    +   Example: Railway ticket reservation system


    # Drawbacks of Linear Queue


    The linear queue, when represented using an array, suffers from drawbacks. Once
    the queue is full, even though few elements are deleted from the front end and
    some free slots are created, it is not possible to insert new elements, as the
    rear has already reached the queue''s rear most position. Consider the figure,
    the queue of size 5 and the front is 2, rear is 4. Now, we are not able to insert
    new data item into the queue, although there are free slots (first and second
    location) in the front of the queue, because of rigid rule followed by linear
    queue (insertion can be done at the rear end of the queue). It is also known as
    a boundary case problem.'
