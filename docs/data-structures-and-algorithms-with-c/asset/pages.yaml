    # ASYMPTOTIC NOTATIONS


    There are some notations commonly used in performance analysis to characterize
    the complexity of an algorithm. Big Oh (O), little oh (o), omega ($\Omega$), theta
    ($\Theta$) and little omega ($\omega$) are related notations to describe different
    kinds of bounds on asymptotic growth rates.


    Big O notation introduced in 1894 by Paul Bachmann, popularized in Computer Science
    by Donald Knuth, who re-introduced the related Omega and Theta notations.


    # Big-O (“big oh”) Notation (Upper Bound)


    The big-O notation is the formal method of expressing the upper bound of an algorithm’s
    running time. It is a measure of the longest amount of time it could possibly
    take for the algorithm to complete. This notation allows us to compare a function
    to a set of functions that are bounded by some other function, allowing us to
    describe the performance of a particular algorithm.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_32_0.png)


    Figure 2.1: Big-O Notation


    If $f(n)$ and $g(n)$ are functions for positive integers, then we write $f(n)
    = O(g(n))$ if there exist positive constants $n_0$ and $c$ such that $|f(n)| \le
    c |g(n)|$, for all $n \ge n_0$.


    In general, $O(g(n)) = \{f(n)\}$: there exist positive constants c and $n_0$ such
    that $0 \le f(n) \le cg(n)$ for all $n$, where $n \ge n_0$.


    That is the right of $n_0$, the value of $f(n)$ always lies on or below $cg(n)$.
    This notation gives an upper bound for a function to within a constant factor.


    # Example:


    Suppose $f(n) = 3n + 2$


    Now we can write $f(n) = 3n + 2 \le 4n$, for all $n \ge 2$, here $g(n) = n, c
    = 4, n_0 = 2$


    Hence, we can write $f(n) = O(g(n)) = O(n)$


    # Example:


    Suppose $f(n) = 10n^2 + 4n + 2$


    Now we can write $f(n) = 10n^2 + 4n + 2 \le 11n^2$, for all $n \ge 5$, here $g(n)
    = n^2, c = 11, n_0 = 5$


    Hence, we can write $f(n) = O(g(n)) = O(n^2)$'
