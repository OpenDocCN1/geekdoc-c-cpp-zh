  md: "# Single-source shortest-path\n\nThe starting vertex of the path is considered\
    \ to be the source(S) vertex and the last vertex is the destination vertex. There\
    \ are two ways for solving single source shortest path problem.\n\n# Dijkstra's\
    \ Algorithm.\n\nThis algorithm finds the shortest path to a vertex to the rest\
    \ of the vertices in a graph. First, it explores the shortest path from the source\
    \ to a vertex nearest to it, then to a second nearest, and so on. The algorithm\
    \ both directed and undirected graphs. The one constraint for this algorithm is\
    \ that all the edges must be non-negative edges.\n\n+   G = (V, E) is a weighted\
    \ connected graph,\n+   W = weight matrix\n+   S = set of visited vertices from\
    \ source vertex to destination vertex, initially it is empty.\n+   s = source\
    \ vertex, dist[v] = distance of vertex v from s\n\n# Dijkstra's Algorithm for\
    \ single source shortest path\n\n```\nAlgorithm: Shortest_path(G, s)\n{G is a\
    \ given graph of N number of edges and V number of vertices, s is the source vertex}\n\
    1. Initialize S = {s}\n2. Initialize dist[s] = 0\n3. Repeat for all v ∈ V -{s}\n\
    \   dist[v] = α\n   [End of loop]\n4. Repeat while S ≠ V\n5. Find a vertex w ∈\
    \ V-S such that dist[w] is a minimum distance\n6. S=S U {w}\n7. Repeat for all\
    \ v ∈ V-S\n8. dist[v] = min(dist[v] , dist[w] + W(w,v))\n   [End of loop]\n  \
    \ [End of loop]\n9. Return\n```\n\n# Example:\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_261_0.png)\n\
    \nFigure 9.32: Shortest Path Using Dijkstra Algorithm"
