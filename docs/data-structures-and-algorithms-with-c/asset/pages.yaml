- pgno: 171
  md: "The recursion tree for obtaining the Fibonacci number of a given number 5.\
    \ Finally, the function adding all values of the leaf nodes.\n\nFIB (5) = FIB\
    \ (2) + FIB (2) + FIB (1) + FIB (2) + FIB (1) = 1 + 1 + 0 + 1 + 0 = 3\n\nTherefore,\
    \ the function calculated 5th term of the Fibonacci series, which is 3.\n\n# GCD\n\
    \nThe greatest common divisor (GCD) or highest common factor (HCF) of two non-negative,\
    \ not- both-zero integers a and b, denoted by GCD (a, b), is defined by the greatest\
    \ integer that divides both a and b evenly, that is with no remainder.\n\nGCD\
    \ can be defined by Euclid's algorithm on recursively as follows:\n\nGCD (a, b)\
    \ = \n{ a, when b = 0 \nGCD (b, a mod b), otherwise }\n\nwhere a mod b is the\
    \ remainder of the division of a by b, until b is equal to zero and final value\
    \ of a is the greatest common factor of the first value a and b.\n\n# Function\
    \ to find out GCD of two numbers using recursion\n\n```\nFunction: INT GCD (A,\
    \ B)\n1. [Base Condition]\n   If B = 0\n   then Return A\n2. [Call itself]\n \
    \  Else\n   Return GCD(B, A MOD B)\n```\n\nIn the above algorithm, there is no\
    \ need to check whether A is greater than B or not.\n\nFor example, A = 4 and\
    \ B = 6 then the GCD (A, B) function is called in the following sequence:\n\n\
    GCD (4, 6) → GCD (6, 4) → GCD (4, 2) → GCD (2, 0)\n\nand when A = 6 and B = 4\
    \ then the GCD (A, B) function is called in the following sequence:\n\nGCD (6,\
    \ 4) → GCD (4, 2) → GCD (2, 0)\n\nTherefore, when B is greater than A, the GCD\
    \ (A, B) function is called just one more time.\n\nThis algorithm runs very fast,\
    \ but division (taking remainders) is a more time-consuming operation than simple\
    \ addition and subtraction.\n\n# Integer Power\n\nInteger power problem is to\
    \ find x^n where x is real and n is a positive integer, using a minimal number\
    \ of multiplications. The naive one-at-a-time algorithm required n number of repeated\
    \ multiplication.\n\nx^n = x x x ... x\n\nn times"
  merge: -1
  img_proc: true
- pgno: 172
  md: "We can call this as x^n to the power of n\" or \"x raised to the power of n\"\
    . Here, x is the base and n is the exponent or the power.\n\nNow, x^n can be defined\
    \ recursively as follow:\n\nx^n = \\begin{cases} 1, & \\text{if } n = 0 \\\\ x\
    \ \\cdot x^{n-1}, & \\text{Otherwise} \\end{cases}\n\n# Function to find out power\
    \ using recursion\n\n```\nFUNCTION: INT POWER (X, N)\n[ X is the base and N is\
    \ the exponent]\n1. [Base Condition]\n   If N=0 then Return 1\n2. [Check whether\
    \ negative exponent]\n   Else If N<0 then Call Power(X, N+1)/X\n3. Else call Power\
    \ (X, N-1)*X\n   [End of If]\n4. Return\n```\n\nPower by the squaring method can\
    \ minimize the number of multiplications. Power by the squaring method can be\
    \ defined on recursively as follows:\n\nx^n = \\begin{cases} x.(x^{(n-1)/2})^2,\
    \ & \\text{if n is odd} \\\\ (x^{n/2})^2, & \\text{if n is even} \\end{cases}\n\
    \nWhen n is an even number then\nx^n = x^(2z) = (x^z)^2, where n = 2z,\nWhen n\
    \ is an odd number then\nx^n = x^(2z+1) = x * (x^z)^2 where n = 2z+1.\n\n# Function\
    \ to find out power using recursion\n\n```\nFUNCTION: INT POWER (X, N)\n1. If\
    \ N=0 then Return 1\n2. If N<0 then Call Power(1/X, -N)\n3. Set P = 1\n4. If N\
    \ mod 2 = 1 then P = X\n5. P = P * Power (X*X, N/2)\n6. Return P\n```\n\nBy using\
    \ this method, we can minimize the multiplication operations. This algorithm uses\
    \ [log2 n] squares and at most [log2 n] multiplications. For instance, when n=15,\
    \ the above algorithm required 3 squares and 3 multiplications, 6 multiplications\
    \ in total. However, it does not always do the fewest possible number of multiplications."
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Tower of Hanoi


    Tower of Hanoi problem has a historical basis in the ritual of ancient Vietnam.
    This Problem is a classic example of the application of recursion. The Problem
    is stated as follows:


    Suppose, there are three towers A, B, C. There are n disks of decreasing size
    so that no two disks are of the same size. Initially, all the disks are stacked
    on one tower in their decreasing order of size. Let this tower be A. Other two
    towers are empty. The problem is to move all the disks from one tower to other
    using third tower.


    +   i) Only one disk may be moved at a time.

    +   ii) Only the top disc on any tower may be moved to any other tower.

    +   iii) A large disk cannot be placed on a smaller one.


    A solution of this problem can be stated recursively as follows:


    +   i) Move first (n – 1) disks from tower A to B

    +   ii) Move the n’th disk from tower A to C.

    +   iii) Move all (n – 1) disks from tower B to C.


    Our objective is to find all possible moves to be performed to solve the problem.


    # Function to tower of Hanoi using recursion


    ```

    Algorithm: Tower (A, B, C, N)

    1. If N > 0 then

    2. Call Tower (A, C, B, N-1)

    3. Print: Move Nth disk from tower A to tower C

    4. Call Tower (B, A, C, N-1)

    5. Return

    ```


    # Example:


    When a number of disks are 2, i.e. n = 2 we have the following moves.


    +   i) Move 1st disk from A to B

    +   ii) Move 2nd disk from A to C

    +   iii) Move 1st disk from B to C


    So when a number of disks are 3, i.e n=3 we have the following call tree:


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_173_0.png)


    Figure 7.3: Recursion Tree for three disks'
  merge: -1
  img_proc: true
- pgno: 174
  md: "![](img/723fa3ef35f5102eb67dc45b74bb823d_174_0.png)\n\n+   i) Move 1st disk\
    \ from A to C\n+   ii) Move 2nd disk from A to B\n+   iii) Move 1st disk from\
    \ C to B\n+   iv) Move 3rd disk from A to C\n+   v) Move 1st disk from B to A\n\
    +   vi) Move 2nd disk from B to C\n+   vii) Move 1st disk from A to C\n\n| Number\
    \ of disks | Number of moves required |\n|---|---|\n| 1 | 2^1-1=1 |\n| 2 | 2^2-1=3\
    \ |\n| 3 | 2^3-1=7 |\n| 4 | 2^4-1=15 |\n| 5 | 2^5-1=31 |\n\n# Time Complexity\n\
