- pgno: 62
  md: '# STRINGS


    A string is a sequence of characters. In C language, the end of the string is
    marked with a special character, the null character, which is simply the character
    with the ASCII value 0 ( the null character has no relation except in name to
    the null pointer ). The null or string terminating character is represented by
    a character escape sequence ''\0''. However, remember that \ and 0, they are not
    two separate characters.


    Any sequence or set of characters defined by double quotation symbols is a constant
    string. Whenever we write a string, enclosed in double quotes, ''C'' automatically
    creates an array of characters for us, containing that string terminating character
    ''\0''. Programs rarely get to see this end marker as most functions which handle
    strings use it or add it automatically. To do anything else with strings, we must
    typically call functions.


    Strings are stored in memory as ASCII codes of characters that make up the string
    appended with ''\0'' (ASCII value of null). Normally, each character is stored
    in one byte (may depend on the compiler); successive characters are stored in
    successive bytes.


    | Character | H | E | L | L | O | | I | N | D | I | A | \0 |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | ASCII Code | 72 | 101 | 108 | 108 | 111 | 32 | 87 | 111 | 114 | 108 | 100 |
    0 |

    | Address | 2000 | 2001 | 2002 | 2003 | 2004 | 2005 | 2006 | 2007 | 2008 | 2009
    | 2010 | 2011 |


    **Figure 3.16: String representation**


    The last character is the null character having the ASCII value zero.


    # Declaring and Initializing Strings


    As discussed earlier, strings in C are represented by an array of characters.
    Therefore, to declare a string, we will declare a character array. The general
    form of declaring a string is:


    ```

    char string_name[size];

    ```


    The size determines the no of characters that a string can hold. When the compiler
    assigns a character size to a character array, then it automatically supplies
    a null character at the end of the string. Therefore, while choosing the length
    or size of the string it must be one more than the number of characters you want
    to accommodate in the string. If the null character is not assigned at the end
    of the string, then the extra characters may be displayed.


    Following are the examples of string declaration:


    # Example:


    ```

    char name[30];

    char city[25];

    ```


    A string is initialized only when it is declared. We can initialize a string in
    the following ways:


    ```

    char city[8] = { ''K'',''o'',''l'',''k'',''a'',''t'',''a'',''\0'' };

    ```


    Then the string city is initializing to Kolkata.


    The above initialization is perfectly valid but C offers a special way to initialize
    strings.


    The above string can be initialized as


    ```

    char city[8] = "Kolkata";

    ```'
