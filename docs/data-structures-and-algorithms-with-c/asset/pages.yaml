    clog2 n, where c = 1.4. The average running time f(n) to search for an item in
    a binary search tree with n elements is proportional to log2 n, that is f(n) =
    O(log n).


    # Inorder Successor of a Node


    In a binary tree, inorder successor of a node is the next node in inorder traversal
    of the binary tree. Inorder successor is NULL for the last node in inorder traversal.
    In binary search tree, inorder successor of a node with key k is a smallest key
    value that belongs to the tree and that is strictly greater than k. The idea of
    finding the successor of a given node x:


    +   i) If the x has a right child then its inorder successor will the left most
    element in the right sub-tree of x (i.e. the minimum in the right subtree of x).


    +   ii) Otherwise, if the x doesn''t have a right child then its inorder successor
    will the one of its ancestors, the inorder successor is the farthest node that
    can be reached from x by following only right branches backward.


    +   iii) Otherwise, if x is the right most node in the tree then its inorder successor
    will be NULL.


    # Algorithm to find the inorder successor from binary search tree


    ```

    Algorithm: BST_SUCCESSOR(X)

    1. If X -> RCHILD # NULL then

    2. Y = X -> RCHILD

    3. Repeat while Y->LCHILD # NULL

    4. Y = Y -> LCHILD

    5. [End of loop]

    6. Return Y

    7. Else

    8. Y = X

    9. Repeat while Parent(X) -> RCHILD = X

    10. X = Parent(X)

    [End of loop]

    11. If Parent(X) # NULL then Return Parent(X)

    12. Else Print: No successor

    [End of If]

    [End of If]

    13. Return

    ```'
