  md: '# Height Balanced Binary Tree


    A height-balanced binary tree has the minimum height for the leaf nodes. A binary
    tree is height balanced if height of the tree is O (log n) where n is number of
    nodes. One common height-balanced tree structure is a binary tree structure in
    which the left and right subtrees of every node differ in height by no more than
    one.


    For Example, AVL Tree (Adel''son-Vel''skii and E. M. Landis, 1962) maintain O
    (log n) height by making sure that the difference between heights of left and
    right subtrees is at most ±1. Red-Black trees (Guibas and Sedgewick, 1978) maintain
    O (log n) height by making sure that the number of Black nodes on every root to
    leaf paths are same and there is no adjacent red nodes. Balanced Binary Search
    trees are performed good as they provide O (log n) time for search, insert and
    delete operations.


    # Threaded Binary Tree


    A threaded binary tree is a binary tree in which having a loop. In a binary tree,
    most of the entries in the link field will contain null elements. These null entries
    are replaced by special pointers, which point to nodes higher in the tree. These
    special pointers are called threads and binary trees with such pointers are called
    threaded tree.


    +   For a n-node binary tree, there exists

    +   * total n2 number of pointer or link fields

    +   * total n-1 number of actual (not null) pointers or link fields

    +   * total n+1 number of null pointers or link fields


    For optimizing null pointers, the concept of the thread is used. There are different
    types of threaded binary trees are possible, inorder threaded binary trees, preorder
    threaded binary trees, and postorder threaded binary trees correspond to inorder,
    preorder and postorder traversals. Each type of threaded binary trees can be of
    two representations: one-way threading and two-way threading.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_189_0.png)


    Figure 8.9: One-way inorder threaded binary tree'
