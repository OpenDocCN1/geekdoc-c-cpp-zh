- pgno: 236
  md: '# GRAPH


    > "Computers make it easier to do a lot of things, but most of the things they
    make it easier to do don''t need to be done."-Andy Rooney


    Graph is an abstract data structure that is used to implement the mathematical
    concept of graphs. It is also used to model networks, complex data structures,
    scheduling, computation and a variety of other systems, where the relationship
    between objects in the system plays a key role.


    +   - Categorization of Graph

    +   - Graph Representation

    +   - Graph traversals

    +   - Shortest Path

    +   - Spanning Tree

    +   - Application of Graph


    A Graph G = (V, E) consists of finite non-empty set of objects V, where G (V)
    = {v1, v2, v3 ... vn} called vertices and another set E where E (G) = {e1, e2,
    e3 ... en} whose elements are called edges.


    Definition: A Graph G is defined as an ordered set G = (V, E), where V represents
    a set of elements called vertices (or points or vertices) and E represents a set
    of edges in G, that connects these vertices.


    In the figure 9.1 shows a graph with five vertices, V = {A, B, C, D, E} and six
    connecting edges, E = {(A, B), (B, C), (A, D), (B, D), (D, E), (C, E)};


