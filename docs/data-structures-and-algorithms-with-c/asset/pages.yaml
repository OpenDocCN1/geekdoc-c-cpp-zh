  md: "# Interpolation Search\n\nAnother efficient searching technique that operates\
    \ on ordered list is interpolation search. The list of elements must be sorted\
    \ and the elements should be uniformly or near uniformly distributed on the list.\
    \ Interpolation search estimates the position of the key value, taking into account\
    \ the lowest and highest elements in the array and the length of the array. For\
    \ example, if the key value is close to the highest element in the array, it is\
    \ likely to be located near the end of the array.\n\nSuppose we are searching\
    \ for a key K in the list A.\n\n# Algorithm of Interpolation Search\n\n```\nALGORITHM:\
    \ INTERPOLATION_SEARCH(A, N, KEY, LOC)\n[A is an array of N elements, Key is the\
    \ searching key, LOC is the location of the KEY]\n1. Set I = 0, J = N-1\n2. Repeat\
    \ steps 3 and 4 while I<=J\n3. MID = I + (KEY-A[I]) * (J-I) / (A[J]-A[I])\n4.\
    \ If KEY = A[MID] then Goto step 5\n   Else If KEY < A[MID] Set J=MID-1\n   Else\
    \ Set I = MID+1\n   [End of If]\n   [End of Loop]\n5. If A[MID] = KEY then\n \
    \  Set LOC = MID\n   Else Set LOC = -1\n   [End of If]\n6. Return\n```\n\n# Time\
    \ complexity of Interpolation Search\n\nInterpolation search is slower than binary\
    \ search for small arrays, as interpolation search requires extra computation,\
    \ and the slower growth rate of its time complexity compensates for this only\
    \ for large arrays.\n\n| Interpolation Searching algorithm | Best Case | Average\
    \ Case | Worst Case |\n|---|---|---|---|\n| | O(1) | O(loglog n) | O(n) |\n\n\
    # SORTING\n\nSorting refers to the operation of rearranging the data elements\
    \ of a list in some specified order (ascending or descending). Many applications\
    \ require sorting of a list of data elements. Given a list of data elements of\
    \ an array of n elements (A1, A2, A3...An), which can be arranged in ascending\
    \ (increasing) order or in descending (decreasing) order. Such that:\n\n+   -\
    \ Ascending order: A1 < A2 < A3 ... < An\n+   - Descending order: A1 > A2 > A3\
    \ ... > An"
