    be the graph constructed by squaring the weights of edges in G. Let T and T''
    be the minimum spanning trees of G and G'', respectively, with total weights t
    and t''. Which of the following statements is TRUE?

    (A) T = T'' with total weight t = t''   (B) T = T'' with total weight t < t''

    (C) T'' != T but total weight t'' = t^2   (D) None of the above

    **Ans:** (D)


    **Q7.** Suppose a circular queue of capacity (n – 1) elements is implemented with
    an array of n elements. Assume that the insertion and deletion operation are carried
    out using REAR and FRONT as array index variables, respectively. Initially, REAR
    = FRONT = 0. The conditions to detect queue full and queue empty are

    (A) Full: (REAR+1) mod n == FRONT; empty: REAR == FRONT

    (B) Full: (REAR+1) mod n == FRONT; empty: (FRONT+1) mod n == REAR

    (C) Full: REAR == FRONT; empty: (REAR+1) mod n == FRONT

    (D) Full: (FRONT+1) mod n == REAR; empty: REAR == FRONT

    **Ans:** (A)


    **Q8.** A list of n strings, each of length n, is sorted into lexicographic order
    using the merge-sort algorithm. The worst case running time of this computation
    is

    (A) O(n log n)   (B) O(n^2 log n)   (C) O(n^2 + log n)   (D) O(n^2)

    **Ans:** (B)


    **Q9.** The height of a tree is defined as the number of edges on the longest
    path in the tree. The function shown in the pseudocode below is invoked as height
    (root) to compute the height of a binary tree rooted at the tree pointer root


    ```

    int height(treeptr n)

    {

    if(n==NULL) return -1;

    if(n->left==NULL)

    if(n->right==NULL) return 0;

    else return B1; //Box1

    else

    {h1 = height(n->left);

    if(n->right==NULL) return(1+h1);

    else {h2 = height(n->right);

    return B2; //Box2

    }

    }

    }

    ```


    The appropriate expression for the two boxes B1 and B2 are

    (A) B1 : (1 + height(n->right)), B2 : (1 + max(h1,h2))

    (B) B1 : (height(n->right)), B2 : (1 + max(h1,h2))

    (C) B1 : height(n->right), B2 : max(h1,h2)

    (D) B1 : (1 + height(n->right)), B2 : max(h1,h2)

    **Ans:** (A)


    **Q10.** What is the time complexity of Bellman-Ford single-source shortest path
    algorithm on a complete graph of n vertices?

    (A) O(n^2)   (B) O(n^2 logn)   (C) O(n^3)   (D) O(n^3 logn)

    **Ans:** C

    Time complexity of Bellman-Ford algorithm is O(VE) where V is number of vertices
    and E is number of edges. For a complete graph with n vertices, V = n, E = O(n^2).
    So overall time complexity becomes O(n^3)'
