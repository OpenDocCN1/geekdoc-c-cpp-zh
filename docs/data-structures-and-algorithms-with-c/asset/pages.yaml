    ```\n```\n\n# Properties of Binary Tree\n\n**Lemma 1:** A binary tree with n nodes\
    \ has exactly n – 1 edges (same as any normal tree).\n\n**Proof:** The property\
    \ can be proof by induction. **Induction Base:** Let n = 1. That is there is only\
    \ one node in the tree. Therefore, a number of the edge is 0. Hence, the property\
    \ is true for one node. **Induction Hypothesis:** Assume the property is true\
    \ for n = k i.e., for k nodes there is k – 1 edges. **Induction Step:** The number\
    \ of edges for k nodes is k - 1 edges by the induction hypothesis. Now addition\
    \ of one node (i.e. n = k + 1) includes one extra edge. Therefore, total number\
    \ of edges are = (k – 1) + 1 = k. Hence proved.\n\n**Lemma 2:** The maximum number\
    \ of nodes on level i of a binary tree is 2^(i-1), i >= 1\n\n**Proof:** The property\
    \ can be proof by induction on i. **Induction Base:** The root is the only node\
    \ on level i=1."
