- pgno: 290
  md: 'named as merge sort. The Mergesort algorithm can be described in general terms
    as consisting of the following three steps:


    Suppose A is an array with N elements from A[0] to A[N-1].


    +   1. Divide Step: If given array A has zero or one element, then return, as
    it is already sorted. Otherwise, divide A into two sub-arrays, A1 = A[0], A[1],
    ..., A[N/2-1] and A2 = A[N/2], A[N/2+1], ..., A[N-1], each containing about half
    of the elements of A.

    +   2. Recursion Step: Recursively sort two sub-array A1, and A2;

    +   3. Conquer Step: Combine the elements back in A by merging the two sorted
    arrays A1 and A2 into a single sorted sequence.


    Example:


    Input Data: 8, 6, 3, 5, 2, 7, 4 and 1.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_290_0.png)


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_290_1.png)


    Figure 10.116: (a) Divide phase and (b) Combine phase'
  merge: -1
  img_proc: true
- pgno: 291
  md: "# Algorithm of Merge Sort\n\n```\nAlgorithm: MERGE_SORT(A, F, L)\n[A is an\
    \ array of N elements, F is the first position and L is the last position of the\
    \ sub-array]\n1. If F < L then\n    a) Set MID = (F + L)/2\n    b) Call MERGE_SORT(A,\
    \ F, MID)\n    c) Call MERGE_SORT(A, MID+1, L)\n    d) Call MERGE(A, F, L, MID)\n\
    2. Return\n\nFunction: MERGE(A, F, L, MID)\n[A is an array, F is the first position,\
    \ L is the last position and MID is the middle position of the sub-array]\n1.\
    \ Set I = F, J = MID + 1, K = F\n2. Repeat while I <= MID and J <= L\n    If A[I]\
    \ < A[J] then\n    a) Set C[K] = A[I]\n    b) Set I = I + 1\n    c) Set K = K\
    \ + 1\n    ELSE\n    a) Set C[K] = A[J]\n    b) Set J = J + 1\n    c) Set K =\
    \ K + 1\n    [End of IF]\n    [End of Loop]\n3. Repeat while I <= MID\n    a)\
    \ Set C[K] = A[I]\n    b) Set I = I + 1\n    c) Set K = K + 1\n    [End of Loop]\n\
    4. Repeat while J <= L\n    a) Set C[K] = A[J]\n    b) Set J = J + 1\n    c) Set\
    \ K = K + 1\n    [End of Loop]\n5. Repeat for I = F to K\n    Set A[I] = C[I]\n\
    6. Return\n```\n\n# Time complexity of MergeSort\n\nBest-case / Worst-case / Average-case\
    \ time complexity: In Merge-sort the partitions are always evenly balanced, their\
    \ sizes are equal, each partition has n/2 elements. Each of the subproblems of\
    \ size n/2"
  merge: -1
  img_proc: true
