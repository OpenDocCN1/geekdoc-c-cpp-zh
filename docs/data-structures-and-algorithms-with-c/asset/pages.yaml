  md: "# Insertion of a node before a specified node of a singly linked list\n\nThis\
    \ algorithm creates a node and inserts it before the node pointer P. The HEAD\
    \ is a pointer that points to the first node of the linked list and ITEM is the\
    \ value of the new node. NEW is a pointer that holds the address of the new node.\
    \ Temp and PTemp are two temporary pointers to traverse the list.\n\n# Algorithm\
    \ to insert a node before a given node pointer\n\n```\nALGORITHM: ADD_BEFORE (HEAD,\
    \ ITEM, P)\n1. Set Temp = HEAD [to make Temp to point to the first node]\n2. Repeat\
    \ step 3 while Temp != P\n3. a) Set PTemp = Temp\n   b) Set Temp = Temp-LINK\n\
    \   c) If Temp = NULL then\n      i) Print: \"Not Found\"\n     ii) Return\n \
    \  [End of loop]\n4. [Create the new node]\n   a) Allocate memory for NEW node\n\
    \   b) IF NEW = NULL then Print: \"Memory not Available\" and Return\n   c) Set\
    \ NEW-DATA = ITEM\n   d) Set NEW-LINK = Temp\n   e) Set PTemp-LINK = NEW\n5. Return\n\
    ```\n\nAt the beginning traversing the linked list from HEAD to node pointer P\
    \ to get the location of the previous node. Then, create a NEW node from the heap\
    \ using dynamic memory allocation and checks whether is NULL or not. If the NEW\
    \ node is NULL, then memory is not available. Otherwise, stores the value of ITEM\
    \ of the DATA part of the NEW node.\n\nThe following diagrams explain the insertion\
    \ operation before a node pointer of a singly linked list.\n\nAt first, Temp is\
