  md: '# STACK AND QUEUE


    > "The art of programming is the art of organizing complexity". - W. W. Dijkstra


    +   KEY FEATURES

    +   - Stack

    +   - Evaluation of Expression

    +   - Queue

    +   - Circular Queue

    +   - Dequeue

    +   - Priority Queue


    In this chapter, we discuss some elementary data structures like stack and queue
    along with their properties, different operations that are performed on them,
    algorithms of their different operations and applications of them.


    In 1946, Alan M. Turing first proposed the stack, in the computer design. In 1955,
    Klaus Samelson and Friedrich L. Bauer of Technical University Munich proposed
    the idea of the stack and filed a patent in 1957. The Australian Charles Leonard
    Hamblin in the first half of 1957 developed the same concept, independently.


    # STACK


    A stack is a one of the most important and useful non-primitive data structure
    in computer science. Real-life examples of the stack are a stack of books, a stack
    of plates, a stack of cards, a stack of coins, etc.


    Definition: A stack is a sequential collection of elements into which new elements
    are inserted and from which, elements are deleted only at one end.


    All the insertion and deletion in a stack is done from the top of the stack, the
    lastly added element will be first to be removed from the stack. That is the reason
    why stack is also called Last-In-First-Out (LIFO) data structure. Note that the
    most frequently accessed element in the stack is the top most elemental, whereas
    the least accessible element is the bottom of the stack.


    In the stack, the top variable is used to point the top of the stack. The following
    tasks are performed by the top variable:


    +   - To keep track, how many cells are used,

    +   - Whether the stack is full or empty

    +   - Insert new element in the stack

    +   - Delete elements from the stack


    # Operations on Stack


    The stack is an abstract data type since it is defined in terms of operations
    on it and its implementation is hidden. Therefore, we can implement a stack using
    either array or linked list. The stack includes a finite sequence of the same
    type of items with the different operations described in table 6.1.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Table 6.1: Operations on Stack


    | Operation | Description |

    | :--- | :--- |

    | Creation | This operation creates a stack and initializes the stack. |

    | Isempty | This operation checks whether the stack is empty or not. |

    | Isfull | This operation whether the stack is full or not. |

    | Insertion (Push) | This operation inserts an item only at the top of the stack
    when the stack is not full. |

    | Deletion (Pop) | This operation deletes an item only from the top of the stack
    when the stack is not empty. |

    | Peek | This operation returns the value of the top of the stack without removing
    the element from the stack. |


    The insertion (or addition) operation is referred as push, and the deletion (or
    remove) operation as pop. A stack is said to be empty if the stack contains no
    elements. At this point, the top of the stack is present at the bottom of the
    stack. In addition, it is full when the stack becomes full, i.e., no other elements
    can be pushed onto the stack. At this point, the top pointer is at the highest
    location of the stack. If the pop operation in the stack when it is in the empty
    state then underflow occurs. Similarly, if the push operation is done in a full
    stack, then stack overflow happens.


    Stack as an ADT promotes data abstraction and focuses on what operations it does
    rather than how it does (implements). Therefore, the stack can be implemented
    with an array or with the linked list.


    # Stack representation with Array


    The array can be used to implement a stack of fixed size, therefore only fixed
    a number of data items can be pushed and popped. Consider the following figure
    6.1, the stack of size 4; therefore, maximum only 4 data items can be inserted.
    The top index always keeps track of the last inserted element of the stack, which
    is the top of the stack. Initially, the top is initialized by -1 (for the zero-based
    array) when there are no items in the stack, i.e. stack is empty.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_143_0.png)


    Figure 6.1: Stack Operations'
  merge: -1
  img_proc: true
- pgno: 144
  md: "When a new item is inserted in the stack, the top is incremented by 1 before\
    \ the item is stored in the stack. Once all the four items are inserted then pop\
    \ is 3, as shown in the figure. Now, if we try to insert next item, it leads to\
    \ an overflow condition. It indicates that the stack is full and we cannot insert\
    \ the new item. If the size of the array is MAXSIZE then when the top equals to\
    \ MAXSIZE -1 then the stack is full.\n\nWhen an item is deleted from the stack,\
    \ the top is decremented by 1, after the item is removed from the queue. Now,\
    \ if top = -1 then if we try to delete an item, it results in underflow condition.\
    \ It indicates that the stack is empty and we cannot delete an item.\n\nTherefore,\
    \ it is required to check these conditions whenever push and pop operations take\
    \ place.\n\n# Algorithm to insert (push) onto the stack\n\n```\nAlgorithm: PUSH\
    \ (STACK, ITEM)\n[STACK is an array of MAXSIZE and ITEM is an item to be pushed\
    \ onto stack]\n1. [Check for stack overflow]\n   If TOP = MAXSIZE - 1 then\n \
    \  a) Print: Overflow\n   b) Return\n2. [Increment top by 1]\n   Set TOP = TOP\
    \ + 1\n3. [Insert item in new top position]\n   Set STACK[TOP] = ITEM\n4. Return\n\
    ```\n\n# Algorithm to deletes (pop) the top element from the stack.\n\n```\nAlgorithm:\
    \ POP (STACK, ITEM)\n[STACK is an array and ITEM is an item to be popped from\
    \ stack]\n1. [Check for stack underflow]\n   If TOP = -1 then\n   a) Print: Underflow\n\
    \   b) Return\n2. [Assign top element to item]\n   Set ITEM = STACK[TOP]\n3. [Decrease\
    \ top by 1]\n   Set TOP = TOP - 1\n4. Return\n```\n\nThe stack can be represented\
    \ using the following structure:\n\n```\nstruct STACK\n{\n   int a[MAXSIZE];\n\
    \   int top;\n};\n```"
