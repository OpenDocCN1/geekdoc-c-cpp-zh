    # AVL Tree


    A binary tree is height balanced binary tree if it is either empty or if T is
    a non-empty binary search tree with Tl and Tr as its left and right subtrees,
    and if and only if i) Tl and Tr are height balanced and ii) |hr-hl| <= 1 where
    hl and hr are the heights of Tl and Tr respectively.


    It is introduced by two Russian mathematicians, G. M. Adelson-Velskii and E. M.
    Landis, in 1962. Hence, such trees are known as AVL trees.


    The balance factor BF (T) of a node T in a binary tree is defined to be hl - hr
    where hl and hr are the heights of the left and right subtrees of T. For any node
    in an AVL tree BF (T) = -1, 0 or 1.


    # Operations on AVL Tree


    Operations supported by an AVL tree are as follow:


    | Operation | Description |

    |---|---|

    | Traverse | This operation traversing all the nodes of AVL tree exactly once.
    |

    | Insertion | This operation inserts a node in the AVL tree |

    | Deletion | This operation removes a node from the AVL tree |

    | Searching | This operation searches a desired key value within the AVL tree.
    |


    # Insertion in an AVL Tree


    When a new node is inserted to a balanced binary search tree, as a result the
    tree could be unbalanced. The re-balancing was carried out using four different
    kinds of rotations LL, RR, LR and RL.


    These rotations are characterized by nearest ancestor A on the path from the inserted
    node B to the root node, whose balanced factor becomes +2.'
