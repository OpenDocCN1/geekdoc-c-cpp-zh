  md: '# Manipulation of Asymptotic Notations


    A number of rules to manipulate asymptotic notations are followed:


    +   Rule 1: O ( c f(n) ) = O ( f(n) )

    +   Rule 2: O ( O ( f(n) ) ) = O ( f(n) )

    +   Rule 3: O ( f(n) g (n) ) = f(n) O ( g (n) )

    +   Rule 4: O ( f(n) O ( g (n) ) ) = O ( f(n) g (n) )

    +   Rule 5: O ( f(n) + g (n) ) = O ( max ( f(n), g (n) )

    +   Rule 6: If f(n) = O(g(n)) and g(n) = O(h(n)), then f(n) = O(h(n)). [Transitivity
    Rule]

    +   Rule 7: (f(n) = O(g(n)) iff g(n) = Ω(f(n)). [Symmetry Rule]


    Suppose, in an algorithm consists of two independent parts-A1 and A2. These parts
    may be considered as a sub-algorithm or a single instruction. Let us assume that
    A1 and A2 take time t1 and t2 respectively for computation.


    Now, whenever these two parts are in a sequential structure that means first A1
    is computed, and then A2 is computed, denoted by A1; A2, the total computation
    time is t1 + t2. According to maximum rule, the computation time denoted by max
    (t1, t2).


    # Example:


    Suppose t1 = O (n^2) and t2 = O (n), calculate the total computation time for
    A1;A2


    +   Answer: For A1;A2, computation time

    +   = t1 + t2

    +   = max (t1, t2)

    +   = max ( O (n^2), O (n))

    +   = O (n^2)


    Again reconsider A1 and A2 are two independent parts of an algorithm, with t1
    and t2 as computation times respectively. Now, whenever these two parts are in
    a decision structure, that means A1 is computed only when the given condition
    is true, otherwise, A2 is computed when the condition is false, denoted by A1
    / A2, the total computation time is t1 / t2. According to maximum rule, the computation
    time denoted by max (t1, t2).


    # Example:


    Suppose t1 = O (n^2) and t2 = O (n), calculate the total computation time for
    A1/A2


    +   Answer: For A1/A2, computation time

    +   = t1 / t2

    +   = max (t1, t2)

    +   = max ( O (n^2), O (n))

    +   = O (n^2)


    # Example:


    ```

    sum = 0;

    for (i=0; i<3; i++)

    for (j=0; j<n; j++)

    sum++;

    ```


    Here, the statement sum++ executes 3n times.


    Answer: The complexity is O (n)'
