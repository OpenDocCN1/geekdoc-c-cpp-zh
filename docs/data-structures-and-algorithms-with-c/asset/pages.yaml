    Lemma 1 (Hand Shaking Lemma): In a regular undirected graph the sum of the degree
    of all the vertices is twice the number of edges. That is for an undirected graph
    G = (V, E), $\Sigma_{v \in V} deg(v) = 2|E|$


    Proof: Let P be the proposition —n any graph, the sum of the degrees of all vertices
    is equal to twice the number of edges” for a graph G = (V, E)


    ```

    P(n): $\Sigma_{V \in E deg(|V|)=2n where |E|=n$

    Base case: P(0):2n=0|n=0. Since there is not any edge the number of vertices must
    be equal to 11or 0. $\Sigma_{V \in E deg(|V|)=deg(|V|)=0}$ the number of degrees
    is equal to 0. Thus P(0) is true.

    Induction step: Assuming that P(n) is true for a given natural number. Let show
    that P(n)⇒P(n+1).

    P (n): $\Sigma_{V \in E deg(|V|)=2n}$

    $\Sigma_{V \in E deg(|V|) + 2 = 2n + 2}$

    $\Sigma_{V \in E deg(|V|) + 2 = 2 (n + 1) which yields by adding 2 Vertices of
    degree 1}$

    ∀n ∈ N , $\Sigma_{V \in E deg(|V|)=2|E|}$

    ```'
