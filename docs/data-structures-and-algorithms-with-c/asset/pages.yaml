- pgno: 145
  md: "# Stack Representation with Linked List\n\nAnother way to represent stack is\
    \ by using the singly linked list, which is also known as Linked Stack. A linked\
    \ list is a dynamic data structure and each element of a linked list is a node\
    \ that contains a value and a link to its neighbor. The list is a pointer to another\
    \ node that contains a value and another pointer to another node and so on.\n\n\
    The linked list header acts as the top of the Stack. All push or pop operations\
    \ are taking place at the front of the linked list. Each operation always changes\
    \ the header of the linked list. When the stack is empty then HEAD is null. If\
    \ the stack has at least one node, the first node is the top of the stack. In\
    \ the push operation, it needs to add a new node to the front of the list. The\
    \ pop operation removes the first node of the linked list when the stack is not\
    \ empty.\n\n# Algorithm of the push operation using linked list\n\n```\nAlgorithm:\
    \ PUSH (HEAD, ITEM)\n[HEAD is a pointer to the first node and ITEM is an item\
    \ to be pushed onto stack]\n1. [Create the new node]\n   Allocate memory for NEW\
    \ node\n2. If NEW = NULL then\n   i) Print: Out of memory\n   ii) Return\n3. Set\
    \ NEW→DATA = ITEM\n4. Set NEW→LINK = HEAD\n5. Set HEAD = NEW\n6. Return\n```\n\
    \n# Algorithm of pop operation using linked list\n\n```\nAlgorithm: POP (HEAD,\
    \ ITEM)\n[HEAD is a pointer to the first node and ITEM is an item to be popped\
    \ from stack]\n1. [Whether List is empty]\n   If HEAD = NULL then\n   i) Print:\
    \ Stack is underflow\n   ii) Return\n2. ITEM = HEAD→DATA\n3. Set P = HEAD\n4.\
    \ HEAD = HEAD→LINK\n5. Set P→LINK = NULL\n6. De-allocate memory for node P\n7.\
    \ Return\n```\n\n# Comparisons of stack representation using linked list or array\n\
    \n+   - The array is fixed size, therefore, a number of elements will be limited\
    \ in the stack. Since linked list is dynamic and can be changed easily, so the\
    \ number of elements can be changed."
