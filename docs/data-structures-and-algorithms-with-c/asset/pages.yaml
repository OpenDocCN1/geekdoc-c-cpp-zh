- pgno: 321
  md: '# Problems for which Hash Tables are not suitable are:


    +   - The problem for which data ordering is required.

    +   - Problems having multi-dimensional data.

    +   - Prefix searching if keys are long and of variable length.

    +   - The problem that has dynamic data.

    +   - The problem in which data does not have any unique key.


    # Advantages of Hash Table


    +   - It can efficiently handle a large volume of data.

    +   - The speed of searching a data item increased as parallel searching can be
    applied here.

    +   - Look up cost may be reduced by proper hash function, hash table size and
    internal data structure.


    # Disadvantages of Hash Table


    +   - Hash table implementation is more difficult than search tree.

    +   - Hash table does not allow duplicate keys.

    +   - In some cases, the cost of a good hash function is more than that of the
    search tree.

    +   - For a dynamic hash table cost of insertion and searching of the element
    in the hash table is more.

    +   - If collision occurs very frequently in the hash table then the efficiency
    of hash table degrades.


    # Load Factor


    The performance of hash table depends on two factors, initial capacity and load
    factor. Initial capacity is the number of cells(n) in the hash table. A Load Factor
    (α) of a hash table is defined as the ratio of the number of elements (n) in the
    hash table to the table size (size).


    α = n /size


    Load Factor is a measure which decides when exactly to increase the hash table
    capacity, so that get and put operation can still have O (1) complexity.


    For linear probing α can tends to 1 (0 ≤ α ≤ 1), that implies collision probability
    is higher in linear probing. Load Factor tends to zero (0) implies that the proportion
    of unused space on hash table is increasing. However, there is no necessary reduction
    in search cost. The result is wasted memory.


    Generally, the default load factor (0.75) indicates better performance for a hash
    table. The expected number of entries in the hash table and its load factor should
    be considered when the initial capacity of the hash table is defined. If the initial
    capacity is more than the maximum number of entries divided by the load factor,
    no rehash operation will ever occur.


    # Summary


    +   - Hashing is one of the most suitable techniques for storing and retrieving
    data when data volume is more than the storage volume.

    +   - The choice of best hash function depends on the application.

    +   - Collision resolution is one of the key feature of hashing process.


    # Exercises


    +   1. What do you mean by hashing? What are the applications where you will prefer
    hash tables to other data structures?

    +   2. Why do the hash functions need to be simple?'
