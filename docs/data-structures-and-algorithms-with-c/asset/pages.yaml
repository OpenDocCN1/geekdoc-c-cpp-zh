    # Lemma 2: Prove that every connected graph with n vertices has at least n – 1
    edges.


    Proof: This can be proved by induction


    Base case: n=1


    In such situation, only one vertex is there in a graph i.e. isolated vertex. There
    is no edge, so n-1=0.


    Induction step: n≥2. Assume that there are n-1 number of vertices.


    Let G is a graph with n vertices. Choose a vertex v from the set V and edge e
    from the set E where e= {v, w} a unique edge.


    Remove v and e from the graph G and a subgraph G’ is formed where


    +   - (i) G’ is connected with only one path went to/ from v.

    +   - (ii) G’ has no cycles

    +   - (iii) So G’ is a graph with n-1 vertices.


    By the induction hypothesis G’ has n - 2 edges.


    Then G has (n - 2) + 1 = (n -1) edges.


    Simple directed graph: A directed graph G is said to be a simple directed graph
    if and only if it has no parallel edges. However, a simple directed graph may
