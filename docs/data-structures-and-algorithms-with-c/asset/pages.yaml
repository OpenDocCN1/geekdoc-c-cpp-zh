    # Non-Attacking 8 Queens


    The problem is to place eight queens in such a manner on an 8-by-8 chessboard
    that no two queens attack each other. Remember that a queen can attack another
    if they lie on the same row or same column or on the same diagonal in either direction.
    This problem can be solved by using backtracking method. However, there is more
    than one solution of this problem.


    Backtracking is a general algorithm technique for finding all possible solution
    for the problem and discards partial solution as soon as possible without following
    them till the end. Backtracking is a depth-first traversal of the path in the
    graph where nodes are states of the solution and edge between two states of solution
    only if one state can be reached from another state. Each path may lead to a solution,
    taking one path at a time and as soon as if the path does not lead to the solution
    then go back and try with the alternate path.


    In a non-attacking n queens problem, where n is the number of queens/rows/columns,
    it can be seen that for n = 1, the problem has a trivial solution, and it is easy
    to see that there is no solution for n = 2 and n = 3. Therefore, at first, we
    consider the four queens problem, solve it by the backtracking technique, and
    then generalized it to 8-queens problems and an n-queens problem.


    Now start with the empty board and then place the first queen in the first possible
    position at the first row, which is in the first column. The second queen 2 at
    the second row cannot be placed on the first and second column but can be placed
    on the third column that is the first acceptable position for it.


    After that, it reaches a dead end, because there is no acceptable position for
    the third queen. Therefore, the algorithm backtracks and puts the second queen
    in the next possible position at 2nd row 4th column. Then the third queen can
    be placed at 3rd row 2nd column, which reaches to another dead end. The algorithm
    then backtracks all the way to 1st queen replaced to 1st row 2nd column, 2nd queen
    replaced to 2nd row 4th column, 3rd queen placed to 3rd row 1st column, and 4th
    queen placed to 4th row 3rd column, which is a solution to the problem. The state-space
    tree of this search is shown in Figure 7.7.


    A chessboard may be represented by a two-dimensional array. It is known that each
    row in the array contains exactly one queen in the solution configuration. Thus,
    a one-dimensional array is sufficient as a suitable data structure, where the
    index of the array is row number and the value of the array is column number.
    For example, A[i] = j means the queen is placed on ith row and of the jth column.'
