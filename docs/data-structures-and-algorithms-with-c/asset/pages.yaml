    A sorting algorithm is said to be stable if two elements that are equal (i.e.
    duplicate element) remain in the same relative order even after performing sorting.
    Suppose K1 and K2 are two keys such that k1 = k2, and POS (K1) > POS (K2) where
    POS (K1) is the position of the keys in the unsorted list, then after sorting,
    POS (K1) < POS (K2) where POS (K1) is the position of the keys in the sorted list.'
