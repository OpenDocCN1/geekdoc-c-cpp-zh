    \nFigure 5.18 (a, b, c): Deletion from a Circular linked list\n\n# Traverse a\
    \ circular Linked list\n\nThis algorithm traverses a circular linked list and\
    \ prints the data part of each node of the linked list. _f is a pointer which\
    \ points to the starting node of the linked list . _Temp' is a temporary pointer\
    \ to traverse the list.\n\n# Algorithm to display a Circular Linked List\n\n```\n\
    ALGORITHM: DISPLAY (HEAD)\n1. [Make Temp to point to the first node]\n   Set Temp\
    \ = HEAD\n   [Check for empty list]\n2. IF HEAD = NULL then\n   Print: \"The linked\
    \ list is empty\" and Return\n3. Print: Temp->DATA\n   Set Temp = Temp->LINK\n\
    4. Repeat While Temp! = HEAD\n   Print: Temp->DATA\n   Set Temp = Temp->LINK\n\
    5. Return\n```\n\n# Complexity of a circular linked list\n\nThe cost to add or\
    \ delete an element from a known location in the circular linked list is O(1).\n\
    \n# Application of Circular Linked List\n\n+   - The real life application where\
    \ the circular linked list is used is our Personal Computers, where multiple applications\
    \ are running. All the running applications are kept in a circular linked list\
    \ and the OS is given a fixed time slot to all for running. The Operating System\
    \ keeps on iterating over the linked list until all the applications are completed.\n\
    \n+   - Another example, can be Multiplayer games. All the Players are kept in\
    \ a Circular Linked List and the pointer keeps on moving forward as a player's\
    \ chance ends."
