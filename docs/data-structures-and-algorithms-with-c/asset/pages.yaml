  md: 'Hence the maximum number of nodes on level = 1 is 2^0 = 2^(1-1).


    Induction Hypothesis: For all j, 1 <= j <= i, the maximum number of nodes on level
    j is 2^(j-1).


    Induction Step: The maximum number of nodes on level i-1 is 2^(i-2), by the induction
    hypothesis. Since each node in a binary tree has maximum degree 2, the maximum
    number of nodes on level i is two times the maximum number on level i-1, i.e.
    2*2^(i-2) = 2^(i-1).


    # Lemma 3: The maximum number of nodes in a binary tree of depth k is 2^(k+1),
    k>=1.


    Proof: The maximum number of nodes on level i of a binary tree is 2^(i-1). Therefore,
    the maximum number of nodes in a binary tree of depth k is,


    ```

    = \sum_{i=1}^k (maximum number of nodes on level i)

    = \sum_{i=1}^k (2^{i-1})

    = 2^{k+1} - 1

    ```


    # Lemma 4: For any non-empty binary tree T, if n0 is the number of leaves (terminal
    nodes) and n2 be the number of nodes having degree 2 then n0 = n2 + 1.


    Proof: Let n1, be the number of nodes of degree 1 and n is the total number of
    nodes. Since all the nodes in T are of degree <= 2 we have,


    ```

    n = n0 + n1 + n2 (i)

    ```


    Now, if we count the number of branches in a binary tree, we see that every node
    except for the root has a branch leading into it. If B is the number of branches,
    then n = B + 1. All the branches come either from a node of degree one or from
    a node of degree two. Thus, B = n1 + 2n2. Hence, we obtain


    ```

    n = 1 + n1 + 2n2 (ii)

    ```


    Subtracting (ii) from (i) and rearranging terms we get


    ```

    n0 = n2 + 1

    ```


    # Lemma 5: If n is the total number of nodes in a complete binary tree of height
    h, then h = [log2 n] + 1.


    Proof: From the definition of a complete binary tree of height h, it is filled
    up to height h - 1 and in the last level, it may have partially filled with nodes.
    Hence, we can write:


    ```

    2^(h-1) - 1 < n <= 2^h - 1

    ```


    Since the maximum number of nodes at height h-1 is 2^(h-1) - 1 and at height,
    h is 2^h - 1.


    ```

    or we can write 2^(h-1) <= n < 2^h (iii)

    ```


    Taking the logarithm of (ii) we get


    ```

    h - 1 < log2 n <= h

    ```


    Therefore, the value of log2 n lies between h and h-1. Now if we take floor value
    of log2 n then it will be h-1.


    Hence, h = [log2 n] + 1


    # Representation of Binary Tree


    Tree is a widely used abstract data type since it is defined in terms of operations
    on it and its implementation is hidden. Therefore, we can implement a tree using
    either array or linked list. Binary Tree also can be representation with two different
    ways.


    +   i) Using array


