  md: '# # POINTER


    > > "The duties of the Pointer were to point out, by calling their names, those
    in the congregation who should take note of some point made in the sermon." —H.
    B. Otis


    The pointers are one of the most important and powerful data structure. A pointer
    is a variable that is used to store an address or location of another variable.
    We can say that the pointer points to another variable. A pointer declaration
    consists of a data type, the indirection operator (*) and a variable name. The
    indirection operator is also called the dereference operator. Do not confuse the
    indirection operator with the multiplication operator, although they have the
    same symbol. The indirection operator is a unary operator, whereas the multiplication
    operator is a binary operator. The pointers are very useful in dynamic memory
    allocation, and used to modify variable arguments passed to a function.


    +   - Null Pointer

    +   - Void pointer

    +   - Generic Function

    +   - Dangling Pointer

    +   - Pointer to Pointer

    +   - Array of Pointer

    +   - Pointer to an Array

    +   - Pointer to Function

    +   - Dynamic memory allocation


    # ## Pointer Declaration


    The general form of pointer declaration is:


    ```

    data-type *pointer-variable-name;

    ```


    The data type specifies the type of data to which the pointer points, that means
    it can store an address of that data type.


    # ### Example:


    ```

    int *p;

    char *q;

    float *r;

    ```


    In the above declaration, p is a pointer to an integer; it can store an address
    of integer type variables. The q is a pointer to a character, it can store an
    address of character type variables (it does not mean that q holds the character
    value rather it means that q contain the address of a character variable). Similarly
    r is a pointer to a floating-point, it can store an address of floating-point
    type variables. Remember that address is always an unsigned integer.


    # ## Address of Operator


    The address-of operator (&) can return an address in memory of its operand. Do
    not confuse the address-of operator with the bitwise AND operator, although they
    have the same symbol. The address-of operator is a unary operator, whereas bitwise
    AND operator is a binary operator.


    In the following example, display the addresses of the variables c, a and f along
    with their values. The addresses of the variables are dependent on compiler and
    operating system.'
