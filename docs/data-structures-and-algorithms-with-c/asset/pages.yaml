    # PRIORITY QUEUE


    A Priority Queue is a collection of elements such that each element has been assigned
    a priority and the elements are arranged on the basis of priority. The order in
    which elements are deleted and processed comes from the following rules:


    +   i) The element having a higher priority is processed before any elements of
    lower priority.

    +   ii) The two elements that have the same priority are processed according to
    the order in which that are inserted into the priority queue.


    There are two types of priority queue:


    +   i) **Ascending priority queue:** In this type of the priority queue, the elements
    can be inserted arbitrarily, but only the element with the smallest priority can
    be removed.

    +   ii) **Descending priority queue:** In this type of the priority queue, the
    elements can be inserted arbitrarily, but only the element with the highest priority
    can be removed.


    Here we discuss the operations and algorithms for descending priority queue.


    # Abstract Data Type


    A priority queue is an abstract concept. A priority queue can be implemented with
    an array, a linked list or a heap. Priority Queue supports the operations as follows:


    | Operation | Description |

    |---|---|

    | Insert | This operation inserts the element into the priority queue with an
    associated priority |

    | Peek | This operation returns the element that has the highest priority. |

    | Extract-Maximum or Remove | This operation removes the element from the priority
    queue that has the highest priority. |'
