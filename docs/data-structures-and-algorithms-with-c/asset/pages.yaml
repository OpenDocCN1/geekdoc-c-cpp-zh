- pgno: 229
  md: '# # Deletion in a B-tree


    Deletion operation into a B-tree of order m is performed by searching the node
    where we delete the key. If the key is found then delete the key from the node.
    When an underflow (a leaf node has less than [m/2] - 1 entries or an internal
    node has less than [m/2] nonempty subtrees) occurred after key deletion, then
    an adjustment must be done. Now two cases need to consider, whether the key at
    leaf node or non-leaf node.


    # ## Case 1: When deleting a key in a non-leaf node, we must find substitute data.
    We use the immediate predecessor, which is the largest node in the left subtree
    of the entry to be deleted. In the subtree, the largest node is the rightmost
    subtree.


    # ## Case 2: When deleting a key in a leaf node and it contains more than the
    minimum number of entries, then delete the key without any adjustment. However,
    when a node is underflow, we need to do some adjustment, which is called reflow.
    Suppose one of the subtree contains underflow node, two situations need to consider:
    If the other subtree has more entries than the minimum number, then just move
    some entry from the subtree to the underflow node, which is called balance. If
    the other subtree only has a minimum number of entries, then we need to combine
    two nodes to one node together with the root entry. This is called combine.


    # ## Example:


    Delete the keys from the following B-tree: 10, 87, 39, 60, 72, 35.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_229_0.png)


    (a)


    # ### Delete 10: Borrow from right


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_229_1.png)


    (b)'
