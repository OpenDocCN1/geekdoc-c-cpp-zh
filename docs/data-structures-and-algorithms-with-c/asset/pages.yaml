  md: "recursive call. Whenever there is a pending operation, the function is non-tail\
    \ recursive.\n\nThe factorial function can be written in a tail-recursive way:\n\
    \n```\nint fact_aux(int n, int result)\n{\n    if (n==1)\n        return result;\n\
    \    else\n        return fact_aux (n-1, n*result)\n}\nint fact(n)\n{\n    return\
    \ fact_aux(n,1) ;\n}\n```\n\nHere fact_aux is a recursive function, not fact.\n\
    \n# Advantages of Recursion\n\n+   i) Recursion functions can be written easily.\
    \ We can write a simple version of programs using recursion.\n\n+   ii) There\
    \ are some complex problems such as Tower of Hanoi, Non-attacking Queen, etc.\
    \ can be easily understood and implements using recursion.\n\n+   iii) The recursive\
    \ definitions can be translated into recursive function easily.\n\n# Disadvantages\
    \ of Recursion\n\n+   i) Recursion consumes more storage space because each time\
    \ a new recursive call is made; a new memory space is allocated to each automatic\
    \ variable used by the recursive function.\n\n+   ii) The computer may run out\
    \ of memory if base criteria are not checked.\n\n+   iii) Recursion is not efficient\
    \ in terms of speed and execution time, as function call require storing the current\
    \ state of the function onto the stack, jump to execute recursive call, restoring\
    \ state from the stack.\n\n# Table 7.1: Differences between iteration and recursion\n\
    \n| Iteration | Recursion |\n| :--- | :--- |\n| Iteration is a process of executing\
    \ a block of statements repeatedly until some specific condition. | Recursion\
    \ is a technique that breaks down a problem into one or more subproblems that\
    \ are similar to the original problem. |\n| The iterative process is more efficient\
    \ in terms of storage space and execution time. | Recursion is not efficient in\
    \ terms of storage space and execution time. |\n| Any recursive problem can be\
    \ solved iteratively. | Not all problems have a recursive solution. |\n| Iteration\
    \ process sometimes not easy to implement. Complicated problems are difficult\
    \ to solve in iteratively; e.g. tower of Hanoi problem, eight queen problem etc.\
    \ | Recursive functions are easier to implement and maintain. Complicated problems\
    \ are solved easily. |\n| Iteration has four steps: initialization, condition\
    \ checking, execution statements and updating. | A recursive function must have\
    \ base criteria for which the function does not call itself. Each time a function\
    \ calls itself (directly or indirectly), it must be closer to the base criteria.\
    \ |"
