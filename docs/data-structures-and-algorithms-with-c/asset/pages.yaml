    the prefix form of the expression. The postorder traversal of the above expression
    tree is A B C ^ * D / E +, this is the postfix form of the expression.


    # Evaluation of Expression Tree


    A postfix expression can be converted to expression tree using the above algorithm.
    Now we can evaluate the expression tree, using the following algorithm:


    # Algorithm: evaluation of expression tree


    ```

    ALGORITHM: EVALUATION (T)

    1. If T is a leaf then

    2. Return value of T’s operand

    3. Else

    4. Operator = T.Element

    5. Operandi = EVALUATION(T.Left)

    6. Operand2 = EVALUATION(T.Right)

    7. Return (Operation (Operandi, Operator, Operand2))

    8. [End of If]

    End

    ```


    # Balanced Binary Tree


    There are mainly two types of balanced binary trees.


    +   i) Weight balanced binary tree

    +   ii) Height balanced binary tree


    # Weight Balanced Binary Tree


    A weight-balanced binary tree is a binary search tree if for each node it holds
    that the number of inner nodes in the left subtree and the number of inner nodes
    in the right subtree differ by at most one. These trees can be used to implement
    dynamic sets, dictionaries (maps) and sequences. The weight-balanced binary trees
    were introduced by Nievergelt and Reingold in 1972. It is purely functional implementations
    are widely used in functional programming languages.'
