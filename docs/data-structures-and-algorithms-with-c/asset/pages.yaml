    # QUEUE


    The queue is also another useful non-primitive linear data structure in computer
    science. A real-life example of the queue is line or sequence of people or vehicles
    awaiting their turn to be attended to or to proceed.


    **Definition:** A queue is a homogeneous collection of elements in which deletions
    can take place only at the front end, known as dequeue and insertions can take
    place only at the rear end, known as enqueue.


    The element to enter the queue first will be deleted from the queue first. That
    is why a queue is called First-In-First-Out (FIFO) system.


    The concept of the queue can be understood by our real life problems. For example,
    a customer comes and join in a queue to take the train ticket at the end (rear)
    and the ticket is issued from the front end of the queue. That is, the customer
    who arrived first will receive the ticket first. It means the customers are serviced
    in the order in which they arrive at the service center.


    # Operations on Queue


    The queue is an abstract data type since it is defined in terms of operations
    on it and its implementation is hidden. Therefore, the queue can be implemented
    with an array or with the help of the linked list. The queue includes a finite
    sequence of the same type of items with the different operations described in
    table 6.3.


    | Operation | Description |

    | :--- | :--- |

    | Creation | This operation creates a queue and initialization is done here. |

    | isempty | This operation checks whether the queue is empty or not. |

    | isfull | This operation checks whether the queue is full or not. |

    | Insertion (Enqueue) | This operation inserts an item only at the rear of the
    queue when the queue is not full. |

    | Deletion (Dequeue) | This operation deletes an item only from the front of the
    queue when the queue is not empty. |

    | Peek | This operation returns the value of the front of the queue without removing
    the element from the queue. |'
