    # Peek Operation


    To return the highest-priority element, it required returning the root element
    of the heap as the highest-priority element will always be at the root of the
    max-heap. Therefore, it runs in O (1).


    # Remove Operation


    To remove the highest-priority element, it required removing the top element of
    the heap; decrement the size of the heap, and then shift-down through the heap
    with that item to restore the heap condition. The running time of remove operation
    on an n element heap is O (log n).


    # Algorithm to delete an item from Priority Queue


    ```

    Algorithm: Remove (Q, N, ITEM)

    [Q is an array represent priority queue, N is the number of items

    and ITEM is an item to be removed from priority queue]

    1. [check whether queue is empty]

    If N < 1 then Print: Queue Underflow and Return

    2. Set ITEM = Q[1]

    3. Set Q[1] = Q[N]

    4. Set N = N – 1

    5. Call Heapify(Q, 1)

    6. Return

    ```


    In the following table (Table 6.7) the time complexity of different operations
    on priority queue are given where different data structures are used. From the
    table, it is observed that the time complexity of Heap data structure is the best
    choice for implementing a priority queue.


    | Operation | Unsorted array or linked list | Sorted array or linked list | Heap
    |

    |---|---|---|---|

    | Insert | O(1) | O(n) | O(log n) |

    | Peek | O(n) | O(1) | O(1) |

    | Remove | O(n) | O(1) | O(log n) |


    # Summary


    +   - A stack is an ordered collection of elements into which new elements may
    be inserted and from which elements may be deleted only at one end called the
    top of the stack.

    +   - A queue is a homogeneous collection of elements in which deletions can take
    place only at the front end, known as dequeue and insertions can take place only
    at the rear end, known as enqueue.'
