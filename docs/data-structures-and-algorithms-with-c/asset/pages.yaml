    \ find out the interval to skip a variable amount. Suppose a record R with key\
    \ K has the hash address H(K) = h and H'(K) = h' ≠ m, then we search the location\
    \ with the address h, h + h', h + 2h', h + 3h'...\n+   If m is a prime number,\
    \ then the above sequence will access all the location in the table T.\n\nSecond\
    \ hash function in double hashing has the following couple of requirements\n\n\
    +   • It must never evaluate to 0.\n+   • Must make sure that all cells can be\
    \ probed.\n\nA popular hash function for double hashing is Hash2(key) = R - (key\
    \ % R) where R is a prime number that is smaller than the size of the table.\n\
