  md: "# Doubly Linked List\n\nA double linked list is defined as a collection of\
    \ nodes in which each node has three parts: data, llink, rlink. Data contains\
    \ the data value for the node, llink contains the address of node before it and\
    \ rlink contains the address of node after it.\n\nA generic doubly linked list\
    \ node can be designed as:\n\n```\nstruct node\n{\n int data;\n struct node* rlink;\n\
    \ struct node* llink;\n};\n```\n\nEach node contains three parts:\n\n+   i) An\
    \ information field contains data.\n+   ii) A pointer field rlink, which contains\
    \ the location of the next node.\n+   iii) A pointer field llink, which contains\
    \ the location of the preceding node.\n\nThe following figure, explain how the\
    \ doubly linked list looks like:\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_129_0.png)\n\
    \nFigure 5.19: Structure of a doubly linked list\n\nIn the figure Head and Tail\
    \ pointer Points to the header node and tailor node of the list respectively.\n\
    \n# Algorithm for Creation of Doubly Linked list\n\nThis algorithm creates a node\
    \ and appends it at the end of existing list. Temp is a pointer which holds the\
    \ address of the HEADER of the linked list and ITEM is the value of the new node.\
    \ NEW is a pointer which holds the address of the new node and _Temp' is a temporary\
    \ pointer.\n\n# Algorithm to Create Doubly Linked List\n\n```\nAlgorithm: DLL_CREATE\
    \ (HEAD, ITEM)\n1. [Create the new node]\n   a) Allocate memory for NEW node\n\
    \   b) IF NEW = NULL then Print: “Memory not Available” and Return\n   c) Set\
    \ NEW-DATA = ITEM\n   d) Set NEW-LLINK = NULL\n   e) Set NEW-RLINK = NULL\n2.\
    \ [Whether List is empty, head is the content of HEADER]\n   If HEAD = NULL then\
    \ Set HEAD = NEW\n3. Else\n   a) Set Temp = HEAD\n   b) While Temp-RLINK # NULL\
    \ do\n```"
  merge: -1
  img_proc: true
