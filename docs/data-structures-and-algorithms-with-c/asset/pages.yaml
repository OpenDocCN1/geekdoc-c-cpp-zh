  md: "```\n```\nfunction B (...)\n{\n    if base condition satisfied\n        then\
    \ perform actions/ return value(s)\n    else\n    {\n        perform some action(s);\n\
    \        make a call to B to solve one smaller problem ;\n        make a call\
    \ to B to solve the other smaller problem ;\n    }\n}\n```\n```\n\nExamples: Fibonacci\
    \ sequence, Quick sort, Merge sort, Binary Tree algorithms, General Divide-and-conquer\
    \ algorithms.\n\n# Non-linear recursion\n\nIn non-linear recursion, more than\
    \ two recursion call are performed. A function using a number of more than two\
    \ internal recursive calls within the body of the function is non-linear recursive.\
    \ Non-linear recursion also is known as multiple recursion. The format of non-linear\
    \ recursion is as follows:\n\n```\n```\nfunction N (...)\n{\n    for j= k to n\
    \ do\n    {\n        perform some action(s);\n        if base condition not satisfied\n\
    \        then make a call to N\n        else perform some action(s);\n    }\n\
    }\n```\n```\n\nExamples: Non-attacking 8-queens, Sample Generation, Combination\
    \ generation, Permutation generation, etc.\n\n# Tail Recursion\n\nA special form\
    \ of recursion where the last operation of a function is a recursive call. That\
    \ is a recursive function is said to be tail recursive if there are no pending\
    \ operations to be performed on return from a recursive call.\n\n# Example:\n\n\
    ```\n```\nint fact (int n)\n{\n    if(n==1)\n        return 1;\n    else\n   \
    \     return n * fact(n-1)\n}\n```\n```\n\nNotice that there is pending operation\
    \ namely multiplication, to be performed on return from each"
