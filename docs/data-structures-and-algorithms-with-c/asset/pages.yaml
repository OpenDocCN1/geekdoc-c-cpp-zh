    # Quick Sort


    The Quicksort (also called partition-exchange sort) is one of the fastest sorting
    algorithm known and it is the method of choice in most sorting libraries. As this
    sorting technique has best average behaviour among all the sorting methods, hence
    it is named as quick sort. Quicksort is based on the divide-and-conquer strategy,
    which is developed by C.A.R. Hoare in 1959.


    In quick sort, we select an element from the array called pivot and then partitions
    the array into two sub-arrays. So that, all the elements that are less than the
    pivot are placed in its left sub-array and all the elements that are greater than
    the pivot, are placed in its right sub-array. This is called the partition operation.
    After the partition, the pivot is in its final position. Next, we apply the same
    process recursively to two independent sub-array of smaller size.


    Suppose A is an array with N elements from A[0] to A[N-1]. At first, select the
    A[0] as a pivot, placed it in POS position in such a way that it partitions the
    array into two sub-arrays, all the elements that are less than pivot are placed
    to A[0] to A[POS-1] and all the elements that are greater than pivot are placed
    from A[POS+1] to A[N-1]. In the next step, apply the same process recursively
    to two sub-arrays A[0] to A[POS-1] and A[POS+1] to A[N-1].'
