  md: '# Deletion in an AVL Tree


    The deletion operation in an AVL tree is perform using the following steps:


    +   i) Search the AVL tree to find out the node to be deleted as in the Binary
    Search Tree

    +   ii) After delete the node, check the balance factor of each node of the tree.

    +   iii) Rebalance the AVL tree if the tree is unbalanced by using AVL rotations.


    Suppose X is the deleted node from the AVL tree and A be the closest ancestor
    node on the path from X to the root node, with a balance factor ±2 after deletion.
    For balancing the AVL tree, the rotation is classified as L or R depending on
    whether the deletion occurred on the left or right subtree of A. Moreover, depending
    on the balanced factor of B, where B is the root of the left or right subtree
    of A, the L or R rotations is classified as R0, R1 and R-1 or L0, L1 and L-1.


    # R0 Rotation


    Suppose right subtree of node A is Ar of height h, left and right subtree of node
    B are Bl and Br of height h each. Now a node X from Ar is deleted, then the height
    of Aa becomes h-1 and B be the nearest ancestor node of X, with balance factor
    +2. The node B is the root of the left subtree of A with balance factor 0 and
    node X deleted from the right subtree of A, therefore R0 rotation is used.


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_216_0.png)


    Figure 8.37: Before and after delete node X


    ![](img/723fa3ef35f5102eb67dc45b74bb823d_216_1.png)


    Figure 8.38: After R0 Rotation


    # L0 Rotation


    The left subtree of node A is Al, of height h, left and right subtree of node
    B are Bl and Bg of height h each. Now a node X from Al is deleted, then the height
    of Al becomes h-1 and A be the nearest ancestor node of X, with balance factor
    -2. The node B is the root of the right subtree of A with balance factor 0 and
    node X deleted from left subtree of A, therefore L0 rotation is used. L0 rotation
    is similar with R0 rotation.'
