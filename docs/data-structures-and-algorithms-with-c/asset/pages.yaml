    \ in B-tree\n\n# 2-3 Tree\n\nThe 2-3 tree is a tree, which is either empty or\
    \ non-empty balance tree has following properties:\n\n+   i) Each non-terminal\
    \ node has either two children with one data element (2-node) or three children\
    \ with two data items (3-nodes).\n+   \n+   ii) The terminal nodes have one or\
    \ two data elements.\n+   \n+   iii) All the keys values of each node [K1, K2]\
    \ are in sorted order (K1 < K2).\n+   \n+   iv) The key values in the left subtree\
    \ of a 3-node [K1, K2] are less than K1, the key values in the right subtree are\
    \ greater than K2 and the middle subtree contains only the k values in the range\
    \ K1 <= k <= K2.\n+   \n+   v) The key values in the left subtree of a 2-node\
    \ [K] are less than K, the key values in the right subtree are greater than K.\n\
    +   \n+   vi) All the terminal nodes must be at same level.\n+   \n+   vii) All\
    \ the subtrees are also 2-3 trees.\n\n2-3 trees are B-tree of order 3, like B-tree\
    \ they can perform search, insert and delete in O(log n) time.\n\n![](img/723fa3ef35f5102eb67dc45b74bb823d_231_1.png)\n\
    \nFigure 8.54: Complete 2-3 Tree\n\n# 2-3-4 Tree\n\nThe 2-3-4 tree is a tree,\
    \ which is either empty or non-empty balance tree has following properties:\n\n\
    +   i) Each non-terminal node has two children with one data element (2-node),\
    \ three children with two data items (3-nodes) or four children with three data\
    \ elements (4-nodes).\n+   \n+   ii) The terminal nodes have one, two or three\
    \ data elements.\n+   \n+   iii) All the keys values of each node [K1, K2, K3]\
    \ are in sorted order (K1 < K2 < K3).\n+   \n+   iv) All key values in the leftmost\
    \ subtree A0 are less than K1.\n+   \n+   v) All key values in the rightmost subtree\
    \ A3 are greater than K3.\n+   \n+   vi) All the key values in the subtree A1\
    \ of a node [K1, K2, K3] may hold only values K in the range K1 <= K <= K(i+1).\n\
    +   \n+   vii) All the terminal nodes must be at same level.\n+   \n+   viii)\
    \ All the subtrees are also 2-3-4 trees."
