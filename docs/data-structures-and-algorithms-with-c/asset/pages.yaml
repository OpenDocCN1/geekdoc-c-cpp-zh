- pgno: 61
  md: "J= Column position\nValue= Non-zero value at position (I, J)\nThe first row\
    \ contains the number of rows, columns and non-zero elements of the matrix.\n\
    Subsequent rows contain the positions of the non-zero elements and the non-zero\
    \ value. The no. of columns of this representation is always fixed at three. Hence,\
    \ it is called as three-tuples.\n\n| | [0] | [1] | [2] |\n|---|---|---|---|\n\
    | [0] | 6 | 1 | [2] |\n| [1] | 0 | 0 | 20 |\n| [2] | 0 | 3 | 15 |\n| [3] | 0 |\
    \ 5 | -10 |\n| [4] | 1 | 1 | 10 |\n| [5] | 1 | 2 | 3 |\n| [6] | 2 | 3 | -6 |\n\
    | [7] | 4 | 0 | 90 |\n| [8] | 5 | 2 | 30 |\n\nFigure 3.15: Three-tuple representation\
    \ of a sparse matrix\n\nIn the above, figure 3.14 displays a three-tuple representation\
    \ of a sparse matrix given in figure 3.10.\n\n# 3.10.\nAlgorithm of three-tuple\
    \ representation of a sparse matrix\n\n```\nAlgorithm: THREE_TUPLE (A, M, N, B)\n\
    [A is a sparse matrix of order M x N stored in matrix B]\n1. Set C=1\n2. For I=0\
    \ to M-1 do\n    For J=0 to N-1 do\n        If A[I][J]!=0 then\n            Set\
    \ B[C][0] = I\n            Set B[C][1] = J\n            Set B[C][2] = A[I][J]\n\
    \            Set C = C + 1\n        [End of If]\n    [End of Loop]\n[End of Loop]\n\
    3. Set B[0][0]=M, B[0][1]=N, B[0][2] = C-1\n4. Return\n```\n\nImportance of Sparse:\
    \ Matrices Sparse matrices occur in many applications including solving partial\
    \ differential equations (PDEs), text-document matrices used for latent semantic\
    \ indexing (LSI), linear and non-linear optimization, and manipulating network\
    \ and graph models."
