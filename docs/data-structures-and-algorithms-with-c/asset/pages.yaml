  md: "Before going to the detail operation on singly linked list, we need two data\
    \ types: Node and Node pointer.\n\nA linked list is constructed by the nodes.\
    \ These nodes are allocated in the heap. Each node contains a single data element\
    \ and a pointer to the next node in the list.\n\n```\nstruct node {\n int DATA;\n\
    \ struct node *LINK;\n };\n```\n\nThe Node structure of a linked list is shown\
    \ here. Where DATA contains value and LINK holds the address of the next node.\n\
    \n| DATA | LINK |\n|---|---|\n\n# Figure 5.2: Symbolic representation of a node\n\
    \nThe LINK field of a node in a linked list points to the next node of list. LINK\
    \ pointer is termed as self-referential pointer as it points to the address of\
    \ a node of the same type.\n\n# Create a Singly Linked List\n\nThe following algorithm\
    \ creates a node and appends it at the end of the existing list._HEAD' is a pointer\
    \ which holds the address of the HEADER of the linked list and _ITEM' is the value\
    \ of the new node. NEW is a pointer which holds the address of the new node and\
    \ _Temp' is a temporary pointer.\n\n# Algorithm to create a Singly Linked List\n\
    \n```\nAlgorithm: CREATE (HEAD, ITEM)\n1. [Create NEW node]\n a) Allocate memory\
    \ for NEW node.\n b) IF NEW = NULL then Print: “Memory not Available” and Return\n\
    \ c) Set NEW→DATA = ITEM\n d) Set NEW→LINK = NULL\n2. [Whether List is empty,\
    \ head is the content of HEADER]\n If HEAD = NULL then Set HEAD = NEW\n3. Else\n\
    \ a) Set Temp = HEAD\n b) While Temp→LINK ≠ NULL do\n Set Temp = Temp→LINK\n [End\
    \ of while]\n c) Set Temp→LINK = NEW\n [End of IF]\n4. Return\n```\n\nAt first\
    \ creates a NEW node from the heap using dynamic memory allocation and checks\
    \ whether is NULL or not. If the NEW node is NULL, then memory is not available\
    \ for creating the linked list. Otherwise, stores the value of ITEM to the DATA\
    \ part of the NEW node and stores NULL to the LINK part of the NEW node."
