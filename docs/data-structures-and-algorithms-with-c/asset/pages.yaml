  img_proc: true
- pgno: 183
  md: 'Siblings: The children (or the nodes) of the same parent are said to be siblings.
    In the above figure, H, I and J are siblings.


    The degree of a node: The number of subtrees (or children) of a node is called
    its degree. In the above figure, the degree of node A and D are 3, the degree
    of B is 2, degree of C is 1, the degree of E, F, G, H, I and K are zero.


    The degree of tree: The degree of a tree is the maximum degree of the nodes in
    the tree. In the above figure, degree 3 is the maximum. Therefore, the degree
    of the tree is 3.


    Internal node (or non-terminal node): The node with at least one child is called
    internal nodes. In the above figure, A, B, C, D and J are internal nodes.


    External nodes (or leaf node): The nodes that have degree zero are called external
    node or leaf or terminal nodes. In the above figure, E, F, G, H, I and K are the
    leaf nodes.


    +   Level: The level of a node is defined as follows:

    +   i) The root of the tree is at level one.

    +   ii) If a node is at level L, then their children are at level L + 1.


    > Note: In some literature, the level of a node is defined in such a way that
    the root of the tree is at level zero.


    In the above figure, the corresponding levels are shown; node A is at level 1,
    nodes B, C, and D are at level 2, nodes E, F, G, H, I and J are at level 3 and
    node K at level 4.


    Height (or depth): The height or depth of a tree is defined to be the maximum
    level of any node in the tree. In the above figure, the height of the tree is
    4.


    Forest: A forest is a set of zero or more disjoint trees. The removal of the root
    node from a tree results in a forest.


    Descendant: A node M in the tree is called a descendant of another node N, if
    M reachable from the N by repeated proceeding from parent to child.


    Ancestor and Descendant: A node N is called an ancestor of node M if N is either
    the parent of M or the parent of some ancestor of M, i.e., there is a succession
    of children from N to M; the node M is called descendant of the node N. In the
    above figure, node D is the ancestor of H, I, J and K.


    Edge: The line from a node N in the tree to a successor is called an edge.


    Path and path length: A sequence of consecutive edges from the source node to
    the destination node is called a path. The number of edges in a path is path length.
    In the above figure, A->D->J is a path and the path length is 2.


    Internal path length: The sum of the levels of all the internal nodes in the tree
    is called internal path length.


    External path length: The sum of the levels of all the external nodes in the tree
    is called external path length.


    Branch: A path ending in a leaf node is called a branch. In the above figure,
    A->D->J->K is a branch.


    # Binary Tree


    A binary tree is a finite set of nodes, which is either empty or consists of a
    root and two disjoint binary trees called left subtree and the right subtree.
    In a binary tree, the degree of any node is either zero, one or two. A binary
    tree is a special case of an ordered k-ary tree, where k is 2.'
