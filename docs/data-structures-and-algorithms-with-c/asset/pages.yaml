  md: 'the cluster need several attempts to resolve the collision. As a result increases
    the average search time for a record. Insertion and searching time depend on the
    length of the cluster.


    An example of primary clustering:


    # Example:


    Suppose input keys {89, 18, 49, 58, 69} and table size is 10. Using Linear probing
    keys are inserted in the index shown in the following table.


    | Index | Value |

    |---|---|

    | [0] | 49 |

    | [1] | 58 |

    | [2] | 69 |

    | [3] | |

    | [4] | |

    | [5] | |

    | [6] | |

    | [7] | |

    | [8] | 18 |

    | [9] | 89 |


    Figure 11.2: Primary Clustering in Linear Probing


    To overcome this limitation of linear probing another collision resolution technique
    is used which is known as Quadratic Probing.


    # Quadratic Probing


    Suppose a record R with key K has the hash address H (K) = h. Then, instead of
    searching the location with address h, h+1, h+2...we search the locations by address
    h, h + 1, h + 4, h + 9, h + 16..., h + i^2,..........


    If the number m of location in the table T is a prime number, then the above sequence
    will access half of the locations in T. Quadratic probing is a more efficient
    algorithm in a closed hash table, since it better avoids the primary clustering
    problem that can occur linear probing.


    With quadratic probing, there is no guarantee of finding an empty cell once the
    table gets more than half-full or even before the table gets half full if the
    table size is not prime. This is because at most half of the table can be used
    as alternative locations to resolve the collision.


    Quadratic probing leads to secondary clustering, when two keys do only have the
    same collision chain if their initial position is the same. As it turns out, secondary
    clustering prevents us from guaranteeing an insert if the table is greater than
    half full.


    Secondary clustering is less severe in terms of performance hit than primary clustering.
    It is a process to keep clusters formation by using Quadratic Probing. The idea
    is to probe more widely separated cells, instead of those adjacent to the primary
    hash site.'
  merge: -1
  img_proc: true
