- pgno: 310
  md: '# # HASHING


    > > "Part of the inhumanity of the computer is that, once it is competently programmed
    and working smoothly, it is completely honest." - Isaac Asimov


    In the previous chapters, we have talked about different data storing and data
    accessing technique in the data structure. Irrespective of linear and non-linear
    data structure, the data are stored sequentially and searching of data in done
    in a sequential order. However, in some cases when the amount of data, then too
    large parallels accessing of memory space can increase the efficiency of the program.
    This can be achieved by Hashing.


    +   - Hash Functions

    +   - Linear Probing

    +   - Quadratic Probing

    +   - Double Hashing

    +   - Separate Chaining


    Hashing or hash addressing is the process of mapping a large amount of data items
    to a smaller table with the help of a hash function. Hashing is a searching technique,
    which is essentially independent of the number of elements.


    A hash table or Hashmap is a data structure, which uses a hash function to generate
    a key corresponding to the associated value. The advantage of this searching method
    is its efficiency to handle a large amount of data item in a given collection.


    The two primary problems associated with the creation of hash tables are:


    +   i) The efficient hash function is designed so that it distributes the index
    values of inserting objects uniformly across the table.

    +   ii) The efficient collision resolution algorithm is designed so that it computes
    an alternative index for an object whose hash index corresponds to an object previously
    inserted into the hash table.


    # ## Hash Functions


    A hash function is a function or process that map variable length data to fixed
    size data. The value generated by the hash function is called hash value, hash
    codes, hash sum or simply hashes. A hash function is used to speed up table lookup
    or data comparison task such as searching for an item in a database, find redundant
    data in a database or large files.


    **Definition:** The fixed process to convert a key to a hash value is known as
    the hash function. Hash function and hash function maps the key with the corresponding
    key address or location. It provides the key to address transformation. Hash function
    (H) is used by a hash table to compute a set (L) of a memory address from the
    set K of the key. Thus, Hash function denoted as: H : K → L


    The mapping between the key value and the location is not easy to maintain. The
    hash function will generally map several different keys to the same index. If
    the desired record is in the location given by the index, then there will not
    be any problem. However, if the record is not found, then either another hash
    function or same hash function is used.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Choice of Hash Function


    The choice of the hash function is a very difficult job in hashing. It is not
    possible for selecting a perfect hash function, which is suitable for all different
    kinds of problem. There may be three possible ways to choose a hash function.


    +   - Perfect Hash Function: There is no feasibility of this type of hash function
    if the data is large because practically it is not possible for huge data.

    +   - Desirable Hash Function: For these hash function the address space should
    be small and collision should be kept very less or minimum.


    # Criteria of Hash Function


    The two main criteria used in selecting a hash function are:


    +   - Function H should be very easy and quick to compute.

    +   - The function H should be as far as possible uniformly distribute the hash
    address throughout the set L. So, there is a minimum number of the collision.


    Typical Hash functions are as follows:


    # Division method


    Division method is the simplest and most common way of implementing a hash function
    for a large volume of data. The aim of this function is to compute the index of
    a hash table.


    The hash function H is defined by

    H (K) = K mod m, [generates index value from 0 to m-1]

    or

    H (K) = (K mod m) + 1, [generates index value from 1 to m]


    The number m is usually chosen to be a prime number (since this frequently minimizes
    the number of collisions). Here, the first function denotes the remainder when
    k is divided by m. The second function is used if the hash address ranges from
    1 to m rather than from 0 to m-1.


    # Example:


    Suppose key values are 3205, 7148, 2345 and table size 100. Select M = 97 is a
    prime number

    H (3205) = 3205 mod 97 = 4

    H (7148) = 7148 mod 97 = 67

    H (2345) = 2345 mod 97 = 17


    # Mid squares method


    In mid square method, the key is multiplied by itself (i.e. k^2) and select a
    number of digits from the middle of the result. How many digits you select will
    depend on your table size and the size of your hash key. If the square is considered
    as the decimal number, the table size must be a power of 10. The mid square method
    squares the key value and then takes out the middle digits of the square result.


    # Example:


    | K: | 3205 | 7148 | 2345 |

    |---|---|---|---|

    | K^2: | 10272025 | 51093904 | 5499025 |

    | H(K): | 72 | 93 | 99 |'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# # Folding method


    The key K is partitioned into a number of parts, K1, K2, ... , Kn, where each
    part except possibly the last has the same number of digits as the required address.
    Then the parts are added together, ignoring the last carry.


    ```

    H(K) = K1 + K2 + ... + Kr

    ```


    Folding method can be classified into three types.


    +   - Pure Fold method

    +   - Fold Shifting method

    +   - Fold Boundary


    # ## Pure Fold method:


    In this technique, parts of numbers are added together without any change.


    # ### Example:


    Suppose key values are 3205, 7148, 2345 and table size 100.


    ```

    H (3205) = 32 + 05 = 37

    H (7148) = 71 + 48 = 19 [ignoring the last carry]

    H (2345) = 23 + 45 = 68

    ```


    # ## Fold Shifting method:


    In this method the alternate parts are reversed before addition.


    # ### Example:


    Suppose key is 1522756


    ```

    H (1522756) = 01 52 27 56 (as the number contains 7 digits, so 0 is padded with
    left most digit)

    H (1522756) = 10 + 52 + 72 + 56 = 36 [ignoring the last carry]

    ```


    # ## Fold Boundary:


    Here, the first and last part of the number are reversed before addition.


    # ### Example:


    Suppose key is 1522756


    ```

    H (1522756) = 01 52 27 56 (as the number contains 7 digits, so 0 is padded with
    left most digit)

    H (1522756) = 10 + 52 + 27 + 65 = 54 [ignoring the last carry]

    ```


    # # Operations on Hash Table


    The hash functions used to perform different operations on hash tables.


    | Operation | Description |

    |---|---|

    | Insertion | This operation inserts a key in the Hash Table. |

    | Deletion | This operation removes a key from the Hash Table. |

    | Searching | This operation searches a desired key value within the Hash Table.
    |


    # # Collision Resolutions


    Sometimes a hash function H may produce the same values rather than distinct values;
    it is possible that two different keys K1 and K2 will produce the same hash address.
    This situation is called Collision. Some methods must be used to resolve it.


    There are two broad ways of collision resolution technique.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   i) Open Addressing /Closed Hashing (in array based implementation)

    +   ii) Separate Chaining / Open Hashing (in array of linked list implementation)


    There are many ways of Open Addressing/ Close Hashing


    +   - Linear Probing

    +   - Quadratic Probing

    +   - Double Hashing or Rehashing


    # Linear Probing


    Linear probing is a collision resolution technique that used to resolve the collision
    by sequentially searching the hash table for a first available location. We assume
    that the hash table T with m location is circular so that T(0) comes after T(m
    – 1).


    For insertion, a new record with key k is to be added to the hash table T, with
    a memory location H (K) = h, if an empty slot is available, otherwise try with
    h+1, h+2, ... etc. for first available location.


    For searching a record R with key K, find out memory location H (k) = h, and then
    searches the table T by linearly searching the location, which h+1, h+2, ... until
    finding R or meeting an empty location, which indicates an unsuccessful search.


    # Insertion in a Hash Table


    In the linear probing, key will be inserted into the hash table if an empty slot
    is available. When a collision occurs, the key will be stored in the next available
    slot in the hash table, assuming that the table is not already full. This is done
    by linear search (i.e. Linear probe for an empty slot from the collision slot.
    When end of table reached during linear search, the search will wrap around to
    the beginning of the table and continue from there. If an empty slot is not found,
    then the table is full.


    # Example:


    Suppose input keys in hash table are {65, 12, 27, 38, 49, 80, 10, 35, 97}; and
    hash table size is 10, where, hash key = key mod table size


    +   65 mod 10 = 5

    +   12 mod 10 = 2

    +   27 mod 10 = 7

    +   38 mod 10 = 8

    +   49 mod 10 = 9

    +   80 mod 10 = 0


    | Index | Value |

    |---|---|

    | [0] | 80 |

    | [1] | |

    | [2] | 12 |

    | [3] | |

    | [4] | |

    | [5] | 65 |

    | [6] | |

    | [7] | 27 |

    | [8] | 38 |

    | [9] | 49 |


    Figure 11.1a: Linear Probing without collision'
