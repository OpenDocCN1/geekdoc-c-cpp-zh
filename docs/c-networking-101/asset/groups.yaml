    \    {\n        std::cerr << \"Command execution failed!\" << std::endl;\n   \
    \ }\n\n    return 0;\n}\n```\n\n该程序运行命令 `iw dev wlan0 scan | grep SSID`，该命令扫描可用网络并打印每个网络的\
    \ SSID。\n\n### 连接到网络\n\n为了连接到无线网络，你通常会使用 NetworkManager 或 WPA Supplicant 之类的工具。例如，要使用\
