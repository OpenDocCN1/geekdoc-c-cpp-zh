  mdcn: "\n- 关闭套接字：通信结束后，必须使用 close() 函数（在 Windows 上为 closesocket()）关闭套接字。\n\nC++\
    \ 为套接字编程提供了丰富的库支持。在接下来的章节中，我们将使用第 1 章讨论的库，深入探讨 C++ 中 TCP 和 UDP 套接字编程的实践方面，并提供实操示例和练习，以便更好地理解。理解套接字和套接字编程对任何网络管理员来说都是基础，因为它构成了许多网络操作和应用程序的基础。\n\
    \n## TCP 客户端-服务器套接字编程\n\n让我们通过用 C++ 创建一个简单的 TCP 客户端-服务器应用程序，将前几节/章学到的理论付诸实践。对于此示例，我们将使用\
    \ Boost.Asio 库，它为网络编程提供了强大、一致且富有表现力的 C++ 接口。\n\n### 设置 Boost.Asio\n\n在开始之前，请确保你已在开发环境中安装并配置好\
    \ Boost.Asio 库。如果需要复习如何操作，请回看第 1 章。\n\n### 服务器应用程序\n\n下面是一个基本的 TCP 回显服务器，它接收来自客户端的数据，并将相同的数据发送回客户端。\n\
    \n```cpp\n#include <boost/asio.hpp>\n#include <array>\n#include <iostream>\n\n\
    using boost::asio::ip::tcp;\n\nint main() {\n    try {\n        boost::asio::io_service\
    \ io_service;\n\n        tcp::acceptor acceptor(io_service, tcp::endpoint(tcp::v4(),\
    \ 12345));\n\n        for (;;) {\n            tcp::socket socket(io_service);\n\
    \            acceptor.accept(socket);\n\n            std::array<char, 128> buf;\n\
    \            boost::system::error_code error;\n\n            while (true) {\n\
    \                size_t len = socket.read_some(boost::asio::buffer(buf), error);\n\
    \n                if (error == boost::asio::error::eof)\n                    break;\n\
    \                else if (error)\n                    throw boost::system::system_error(error);\n\
    \n                boost::asio::write(socket, boost::asio::buffer(buf, len));\n\
    \            }\n        }\n    }\n    catch (std::exception& e) {\n        std::cerr\
    \ << e.what() << std::endl;\n    }\n\n    return 0;\n}\n```\n\n服务器在端口 12345 上监听新连接。当客户端连接时，服务器进入一个循环，在循环中从客户端读取数据，并将相同的数据写回客户端。\n\
    \n### 客户端应用程序\n\n接下来，我们创建相应的 TCP 客户端，它连接到服务器、发送一些数据并接收响应。\n\n```cpp\n#include\
    \ <boost/asio.hpp>\n#include <array>\n#include <iostream>\n\nusing boost::asio::ip::tcp;\n\
    \nint main() {\n    try {\n        boost::asio::io_service io_service;\n\n   \
    \     tcp::resolver resolver(io_service);\n        tcp::resolver::query query(tcp::v4(),\
    \ \"localhost\", \"12345\");\n        tcp::resolver::iterator endpoint_iterator\
    \ = resolver.resolve(query);\n\n        tcp::socket socket(io_service);\n    \
    \    boost::asio::connect(socket, endpoint_iterator);\n\n        const std::string\
    \ msg = \"Hello, World!\\n\";\n        boost::asio::write(socket, boost::asio::buffer(msg,\
    \ msg.size()));\n\n        std::array<char, 128> buf;\n        boost::system::error_code\
    \ error;\n\n        while (true) {\n            size_t len = socket.read_some(boost::asio::buffer(buf),\
    \ error);\n\n            if (error == boost::asio::error::eof)\n             \
    \   break;\n            else if (error)\n                throw boost::system::system_error(error);\n\
    \n            std::cout.write(buf.data(), len);\n        }\n    }\n    catch (std::exception&\
    \ e) {\n        std::cerr << e.what() << std::endl;\n    }\n\n    return 0;\n\
    }\n```\n\n客户端连接到运行在 localhost 上端口 12345 的服务器，发送一条 \"Hello, World!\\n\" 消息，然后读取并打印服务器的响应。\n\
    \n上述程序说明了使用 Boost.Asio 库在 C++ 中使用套接字进行 TCP 客户端-服务器编程的基础知识。在接下来的章节中，我们将进一步增强这些程序，以包含更复杂的交互和更高级的网络概念。\n\
    \n## UDP 客户端-服务器套接字编程\n\nUDP（用户数据报协议）是一种无连接协议，适用于速度与效率很重要、且可接受少量数据丢失的应用。基于 UDP\
    \ 的应用示例包括 DNS 查询、视频流和在线多人游戏。现在，让我们使用 C++ 中的 Boost.Asio 库创建一个简单的 UDP 回显服务器和客户端。\n\
    \n### 服务器应用程序\n\n服务器将从客户端接收数据报，并将相同的数据发送回客户端。下面是 UDP 回显服务器的基本代码：\n\n```cpp\n#include\
    \ <boost/asio.hpp>\n#include <array>\n#include <iostream>\n\nusing boost::asio::ip::udp;\n\
    \nint main() {\n    try {\n        boost::asio::io_service io_service;\n     \
    \   udp::socket socket(io_service, udp::endpoint(udp::v4(), 12345));\n\n     \
    \   for (;;) {\n            std::array<char, 1024> recv_buf;\n            udp::endpoint\
    \ remote_endpoint;\n            boost::system::error_code error;\n\n         \
    \   size_t len = socket.receive_from(boost::asio::buffer(recv_buf),\n        \
    \                                     remote_endpoint, 0, error);\n\n        \
    \    if (error && error != boost::asio::error::message_size)\n               \
    \ throw boost::system::system_error(error);\n\n            boost::asio::send_to(socket,\
    \ boost::asio::buffer(recv_buf, len),\n                                 remote_endpoint,\
    \ 0, error);\n        }\n    }\n    catch (std::exception& e) {\n        std::cerr\
    \ << e.what() << std::endl;\n    }\n\n    return 0;\n}\n```\n\n服务器绑定到端口 12345，并进入一个循环，在循环中等待接收数据报，然后将相同的数据报发送回客户端。\n\
    \n### 客户端应用程序\n\n接下来，我们创建相应的 UDP 客户端，它向服务器发送数据报并接收响应。下面是 UDP 客户端的基本代码：\n\n```cpp\n\
    #include <boost/asio.hpp>\n#include <array>\n#include <iostream>\n\nusing boost::asio::ip::udp;\n\
    \nint main() {\n    try {\n        boost::asio::io_service io_service;\n\n   \
    \     udp::resolver resolver(io_service);\n        udp::resolver::query query(udp::v4(),\
    \ \"localhost\", \"12345\");\n        udp::endpoint receiver_endpoint = *resolver.resolve(query);\n\
    \n        udp::socket socket(io_service);\n        socket.open(udp::v4());\n\n\
    \        std::array<char, 1024> send_buf = { \"Hello, World!\\n\" };\n\n     \
    \   socket.send_to(boost::asio::buffer(send_buf, send_buf.size()),\n         \
    \              receiver_endpoint);\n\n        std::array<char, 1024> recv_buf;\n\
    \        udp::endpoint sender_endpoint;\n        size_t len = socket.receive_from(boost::asio::buffer(recv_buf),\n\
    \                                         sender_endpoint);\n\n        std::cout.write(recv_buf.data(),\
    \ len);\n    }\n    catch (std::exception& e) {\n        std::cerr << e.what()\
    \ << std::endl;\n    }\n\n    return 0;\n}\n```\n\n客户端向运行在 localhost 上端口 12345\
    \ 的服务器发送一条 \"Hello, World!\\n\" 消息，然后读取并打印服务器的响应。与之前的 TCP 示例一样，为了清晰起见，这些程序中的错误处理保持最少。通过理解\
    \ TCP 和 UDP 客户端-服务器编程，你将拥有坚实的基础来构建更高级的网络编程任务，并对网络应用程序中使用的两种主要传输协议获得实际理解。\n\n-\
    \ 缓冲区管理：为发送和接收数据选择合适的缓冲区大小。如果缓冲区太小，你将需要进行更多次发送或接收数据调用。如果太大，可能会浪费内存。通常，1024 或 4096\
    \ 字节的大小是一个不错的起点。\n- 数据序列化与解析：当通过网络发送复杂数据结构时，你需要将数据序列化为可通过网络发送的格式（例如 JSON、XML 或二进制），然后在另一端解析数据。注意处理解析错误，当数据损坏或不符合预期格式时可能发生这种错误。\n\
    - 处理网络字节序：网络协议通常使用大端字节序，这可能与你计算机 CPU 使用的字节序（称为主机字节序）不同。使用 htons()（主机到网络短整型）、htonl()（主机到网络长整型）、ntohs()（网络到主机短整型）和\
