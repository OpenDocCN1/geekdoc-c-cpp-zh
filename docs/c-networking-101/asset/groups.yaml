    ## 第6章：无线网络


    ### 无线网络简介


    本章将开启一段穿越无线网络领域的激动人心之旅——这项技术无可否认地彻底改变了我们的连接方式，并显著改变了我们获取和共享信息的方式。随着无线网络的出现，对物理线缆进行数据传输的依赖已显著降低，使我们无论身处何地都能自由保持连接。


    无线网络通过电磁波（如无线电频率或红外光）传输数据来运作。这种传输受一组规则或协议约束，这些规则或协议定义了数据应如何发送和接收的具体方式。无线网络中最常用的两种协议是
    Wi-Fi（无线保真）和蓝牙。Wi-Fi 是一种基于 IEEE 802.11 网络标准的高速无线网络协议。它在一定范围内为智能手机、计算机和智能家电等设备提供互联网连接。另一方面，蓝牙主要用于在相对较短的距离内将无线耳机、鼠标和键盘等外围设备连接到计算机。无线网络的普遍存在要求采取严格的安全措施。已制定不同的无线安全标准，以保护网络及其用户免受潜在威胁。有线等效保密（WEP）是为无线网络引入的第一个安全协议，但由于其漏洞，很快被
    Wi-Fi 保护访问（WPA）取代。WPA 提供了比 WEP 更高级别的安全性，但它并不完美。因此，引入了更安全的协议 WPA2。最新协议 WPA3 通过即使用户选择弱密码也能提供强大保护，进一步提高了安全性。


    无线网络通过提供无需布线的互联网接入，显著影响了家庭、企业和公共场所等许多领域。它促进了物联网（IoT）设备的兴起，赋能智能家居和智慧城市，并在移动设备的增长中发挥了关键作用。然而，无线网络的便利也带来了一系列自身挑战，包括安全问题、范围限制和干扰问题。


    在本章接下来的主题中，我们将更深入地探讨无线网络的复杂性，详细解析协议，全面探索安全标准，并理解如何利用 C++ 来管理和操作无线网络。


    ### 无线保真（WiFi）


    WiFi（无线保真）已成为支撑现代世界连接性的无处不在的技术。其架构围绕一个简单而有效的模型构建，允许设备在一定范围内无线连接到网络（通常是互联网）。WiFi
    网络的主要组件是无线接入点（WAP）、无线网络接口卡（WNIC）以及网络基础设施（通常包括路由器和交换机）。


    无线接入点（WAP）是一种充当无线信号中心发射器和接收器的设备。它与笔记本电脑、智能手机和平板电脑等设备中的无线网络接口卡（WNIC）通信。WAP 通常连接到有线网络（通常是互联网），并弥合无线设备与互联网之间的差距。WiFi
    通过使用无线电波发送和接收数据来运作。待发送的数据首先由发送设备中的 WNIC 转换为无线电信号。该信号通过空气传输并由 WAP 接收，WAP 将无线电信号解码回数据，并通过有线网络发送。对于传入数据，该过程也反向运作。


    关于使用 C++ 进行 WiFi 设置和管理，有若干库可以促进这些任务。例如 Windows 的 WinPcap 和 WpdPack，或 Linux 的 libpcap
    等库，可用于捕获和发送网络数据包，从而允许分析和操纵 WiFi 流量。例如，管理员可以使用 C++ 创建网络扫描器，该扫描器可以发现连接到 WiFi 网络的所有设备。这可以通过发送探测请求，然后捕获并分析探测响应以检索有关已连接设备的信息来实现。此外，可以通过为网络通信设置认证和加密机制，使用
    C++ 编程和测试 WiFi 安全性。例如，网络管理员可以在自定义网络设置中使用 C++ 中的加密库来实现 WPA2 或 WPA3 等协议。


    请注意，这些任务需要理解较低层的网络协议，并且为此目的使用 C++ 不像使用 Python 等高级语言那样直接。然而，C++ 提供了巨大的性能优势以及在低层与网络接口协同工作的能力，这对于高级网络管理和网络安全任务可能很有用。在接下来的章节中，我们将更深入地探讨
    C++ 网络编程的这些方面。


    ### 使用 C++ 进行 WiFi 编程


    鉴于操作系统限制以及使用 C++ 直接与 WiFi 硬件交互所涉及的复杂性，通常更好的做法是使用高级库、API 或命令行工具来完成此类任务，然后使用系统调用或进程执行将它们与你的
    C++ 程序集成。让我们看一个示例，了解如何使用 C++ 在 Linux 系统上执行用于管理 WiFi 网络的命令行指令。


    “iw”命令行实用工具在 Linux 中常用于管理无线设备及其配置。你可以使用 system() 函数从 C++ 程序内部执行命令，该函数可用


    - 主机控制器接口（HCI）：该层为基带控制器和链路管理器提供命令接口。

    - L2CAP 层：该层在不同高层协议之间复用数据，并提供数据包的分段与重组。

    - 应用层：该层包括各种协议和接口（如 RFCOMM、SDP 等），为应用软件提供服务。


    蓝牙在企业中用于多种目的，包括文件共享、设备配对（如无线键盘、鼠标或耳机）、实时定位服务以及物联网（IoT）设备通信。蓝牙的低能耗要求（在低功耗蓝牙 BLE
    中）使其适合由电池供电的 IoT 设备。然而，在企业环境中使用蓝牙存在安全方面的考虑。未经授权的设备可能连接到开放的蓝牙网络，从而导致潜在的数据泄露。因此，需要对蓝牙使用进行谨慎控制，并采取必要的安全措施，如设备认证、授权和数据加密。


    关于 C++，虽然可用于蓝牙编程的广泛使用的库并不多，但你可以使用平台特定的 API 来处理蓝牙。例如，在 Linux 上，你可以使用 BlueZ 库，它为核心蓝牙层和协议提供支持。在
    Windows 上，你将使用 Windows 运行时 API 中的 Windows.Devices.Bluetooth 命名空间。

    '
