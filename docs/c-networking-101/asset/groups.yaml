    \n## 使用 Nagios 执行安全监控\n\n使用 Nagios 进行安全监控涉及结合使用内置的 Nagios 服务和添加自定义插件。让我们看一个监控\
    \ SSH 服务器安全性的简单场景。\n\n### 安装和设置 Nagios\n\n按照上一节描述的步骤安装 Nagios Core 并添加要监控的主机。\n\
    \n### SSH 监控\n\n要监控 SSH 服务器，请在您的 Nagios 配置中添加以下服务定义：\n\n```text\ndefine service{\n\
    \    use                 local-service\n    host_name           your-host-name\n\
