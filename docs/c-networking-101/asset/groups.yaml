    ## 第 2 章：理解互联网协议 - TCP 和 UDP


    来自不同制造商、运行在不同操作系统上的设备，协议充当了一种所有设备都能理解和遵循的通用语言。这保证了任何设备都可以与任何其他设备通信，无论其品牌或型号如何。


    在许多互联网协议中，有些因其广泛使用和通用性而更受欢迎。例如，TCP/IP 协议套件（包括 TCP、IP、UDP、HTTP 等协议）是现代互联网的基础。TCP/IP
    确保数据包从源到目的地正确路由，其中 TCP 提供可靠、有序且经过错误检查的字节流传输。另一个流行的协议是 HTTP，Web 浏览器使用它从服务器获取网页。其安全版本
    HTTPS 确保浏览器和服务器之间的通信经过加密，防止窃听。


    在电子邮件领域，SMTP、IMAP 和 POP3 等协议很流行。SMTP 用于发送电子邮件，而 IMAP 和 POP3 用于接收电子邮件。每种协议都有其优点，并根据电子邮件服务的具体需求来选择。在物联网领域，MQTT
    和 CoAP 等协议因其轻量级特性而受到欢迎，使其适用于资源受限的设备。


    互联网协议是网络的核心，能够实现设备之间无缝、有效的通信。在当今互联互通的世界中，它们的作用不容低估，并且它们是任何网络管理员工具包中至关重要的一部分。理解这些协议不仅是要求，更是任何渴望在网络领域出类拔萃之人的必需品。随着我们进一步深入，我们将更详细地探索这些协议，重点关注它们在
    C++ 网络编程中的使用。


    ## 深入理解传输控制协议（TCP）


    传输控制协议（TCP）是互联网的基本协议之一，提供可靠、有序且经过错误检查的字节流传输。它是 TCP/IP 协议套件的一部分，工作在传输层。让我们详细探讨
    TCP 的各个方面。


    ### TCP 的基本结构


    在 TCP 中，数据以数据包的形式传输，具体称为“报文段”。每个 TCP 报文段包含一个头部和数据。头部长度为 20 到 60 字节，包含正确传递数据所需的信息，包括源端口号和目的端口号、序号、确认号、数据偏移、保留字段、控制标志、窗口、校验和以及紧急指针，如下所示：


    -   源端口号和目的端口号：这些是 16 位字段，用于标识源机器和目标机器上的端口。

    -   序号：这个 32 位字段表示当前消息中第一个数据字节被分配的编号。

    -   确认号：同样是 32 位，该字段表示报文段发送方期望接收的下一个序号的值。


