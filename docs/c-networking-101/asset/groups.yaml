    Nagios can be used with a C++ application and can be extended and controlled using
    scripts and compiled programs in a variety of languages, including C++, provided
    they adhere to the Nagios Plugin API.


    # Sample Program to Perform Fault Monitoring


    Below is an example of how to use Nagios to perform fault monitoring.


    In the previous step, you''ve already created a configuration file for your host
    and added it to the Nagios configuration. Let us assume you''ve added a host named
