    ## 第3章：网络接口与寻址


    ### 网络接口与寻址概述


    计算机网络是一组相互连接、共享数据和资源的设备。在网络中，设备通过数字信号系统相互通信。设备要参与网络，需要网络接口和地址。网络接口是计算机与私有或公共网络之间的互连点。网络接口通常是一块带有软件驱动程序的网络接口卡（NIC）。NIC
    提供到网络的物理连接。它通常有一个用于有线连接的以太网端口和一个用于无线连接的天线。软件驱动程序使操作系统和网络协议能够与硬件协同工作。


    所有 NIC 都有一个唯一标识符，称为媒体访问控制（MAC）地址。MAC 地址在制造时分配给 NIC，并存储在其硬件中。网络中的地址是分配给网络上每个设备的唯一标识符。它允许设备向特定设备发送信息以及从特定设备接收信息。


    有两种类型的寻址方案：


    - IP 寻址：互联网协议（IP）地址是分配给参与使用互联网协议进行通信的计算机网络的每个设备的数字标签。它有两个主要功能：主机或网络接口标识以及位置寻址。

    - MAC 寻址：如前所述，每块网络接口卡都有一个唯一的 MAC 地址，在网络协议的物理层上标识它。


    目前使用的 IP 地址有两个版本：IPv4 和 IPv6。IPv4 地址长度为 32 位，IPv6 地址长度为 128 位。IP 地址的长度影响可能地址的总数。IPv4
    寻址系统按类别（A、B、C、D、E）组织，以适应不同类型的网络，从小型网络（地址较少，如 C 类）到大型网络（地址较多，如 A 类）。然而，随着无类别域间路由（CIDR）的出现，类别的概念不再使用。寻址主题还与子网划分的概念相关。子网划分是一种用于将网络划分为两个或多个较小网段（称为子网）的技术，每个子网都作为一个独立的小型网络运行。这提高了网络性能并提供了安全性。


    在接下来的章节中，我们将深入探讨子网划分、IP 配置和网络接口编程，这些对网络管理员至关重要。这些主题将帮助你理解设备如何被分配地址、网络流量如何被高效路由，以及如何使用
    C++ 以编程方式与网络接口交互。


    ### 理解网络接口


    网络接口充当计算机与网络之间的通信桥梁，使你的设备与网络或互联网上的其他设备之间能够传输数据。在本节中，我们将深入理解两种主流操作系统环境下的网络接口：Windows
    和 Linux。


    #### Windows 中的网络接口


    Windows 在“网络和共享中心”中组织网络接口，该中心提供图形界面来管理连接和查看网络信息。你可以通过控制面板访问网络和共享中心。


    每个网络接口，无论是物理以太网端口、Wi-Fi 适配器还是虚拟适配器（如 VPN 中使用的适配器），都表示为一个网络连接。你可以右键单击某个网络连接并选择“属性”，以查看和更改属性，包括
    IP 寻址信息、DNS 服务器信息等。


    此外，Windows 有一个强大的命令行工具，用于网络故障排除和接口管理，称为“netsh”（网络 shell）。使用 netsh，你可以查看接口设置、更改
    IP 地址，并执行各种其他与网络相关的任务。


    #### Linux 中的网络接口


    在 Linux 中，网络接口传统上使用命令行工具进行管理。具体工具可能因 Linux 发行版和版本而异。ifconfig 命令传统上用于显示系统上网络接口的信息以及配置它们。然而，ifconfig
    现在在许多 Linux 发行版中已被弃用。ip 命令现在是现代 Linux 系统上网络接口管理的首选工具。它可以显示网络接口的信息，也可以配置它们。


    Linux 中的网络接口通常命名为“eth0”、“eth1”等用于以太网连接，“wlan0”、“wlan1”等用于无线连接。Linux 还支持广泛的虚拟网络接口，例如回环接口（lo）、隧道接口（tun/tap）和桥接接口（br）。


    ### IP 地址与子网


    #### IP 地址


    IP（互联网协议）地址是分配给网络中每个设备的唯一标识符。在 Linux 中，你通常与两个版本的 IP 地址交互：IPv4 和 IPv6。


    IPv4 是使用最广泛的版本。一个 IPv4 地址由四组 0 到 255 之间的数字组成，以句点分隔，例如 192.168.1.1。这些地址根据第一个八位组的值进一步分为五类（A、B、C、D
    和 E）。


    IPv6 是较新的版本，旨在解决 IPv4 中可用地址有限的问题。一个 IPv6 地址由八组四位十六进制数字组成，以冒号分隔，例如 2001:0db8:85a3:0000:0000:8a2e:0370:7334。


    每个配置了 IP 地址的网络接口都有两个组成部分：网络地址和主机地址。网络地址标识网络，而主机地址标识该网络上的特定设备。


    #### 子网


    子网划分是一种用于将网络划分为更小、更易管理的部分的技术。其中的每个部分称为一个子网。一个子网

