    \n### 小结\n\n本章对无线网络进行了深刻而实用的探索，首先全面了解了无线网络的整体格局。通过概述无线网络、其演进过程、体系结构以及所涉及的各种协议，奠定了这一基础。这为理解现代企业中常见的各种无线通信技术（如\
    \ WiFi、蓝牙和 Zigbee）做好了铺垫。\n\n我们深入研究了每种技术，从 WiFi 开始，了解了其体系结构以及如何使用 C++ 来设置和管理 WiFi\
    \ 网络。按照类似的结构，我们深入探讨了蓝牙技术、其体系结构、用例，最后使用 C++ 进行了蓝牙编程的动手演示。Zigbee 是一种令人兴奋的低功耗、低成本无线网状网络技术，也同样遵循了先理论后实际编码演示的模式。\n\
    \n随后，本章转向了无线网络标准和无线安全标准的更细节内容，这些是每位网络管理员都应熟悉的。我们讨论了 802.11 标准系列、它们的特性以及它们的独特之处。随着我们深入探讨\
    \ WEP、WPA、WPA2 和 WPA3 等各种安全标准，无线安全的重要性得到了强调。最后，我们通过使用 C++ 在 Linux 平台上执行各种无线网络操作（如设置网络、网络配置、扫描网络和连接网络）来实践所有这些概念。通过本章，我们展示了如何利用\
    \ C++ 与无线网络环境交互，为网络管理任务带来了编程灵活性。\n\n## 第 7 章：异步编程\n\n### 异步编程入门\n\n### 什么是异步编程？\n\
    \n异步编程，用最简单的话说，是一种允许多个操作或任务并发处理但不一定同时执行的编程形式。这种方法与同步或阻塞式 I/O 编程有显著不同，后者按顺序执行任务，一个任务会阻塞下一个任务直到其完成。在网络操作中，响应性和效率至关重要。鉴于许多网络任务都涉及等待\
    \ I/O 操作（如从网络套接字读取或写入数据），使用同步方法可能不是对资源的最佳利用。这就是异步编程的用武之地。借助异步编程，当一个任务等待 I/O 操作完成时，CPU\
    \ 可以用来执行其他任务。\n\n例如，考虑一个处理多个客户端请求的服务器。在同步模型中，服务器会一个接一个地处理每个客户端请求，如果某个客户端较慢或某个操作耗时超出预期，其他客户端就需要等待。然而，在异步模型中，服务器可以发起一个请求，然后继续开始处理另一个请求，即使第一个请求尚未完成。一旦第一个请求完成，服务器可以再回来处理它。因此，异步编程提供了一种构建更高效、更灵敏、更具可扩展性的网络应用的方法。它对于受\
    \ I/O 限制的任务尤其有用，例如网络操作，这些操作中你经常需要等待数据通过网络发送或接收。通过异步操作，你的程序可以在等待这些 I/O 操作完成的同时继续执行其他代码。\n\
    \nC++ 提供了多种库和结构来执行异步操作，包括标准 C++ 库、Boost.Asio 等。通过恰当地利用这些工具，你可以使用 C++ 编写能够高效处理多个并发连接的网络程序，从而提高应用程序的可扩展性和性能。本章将深入探讨异步编程的复杂性，特别是在网络任务的背景下。\n\
    \n### 为什么不用同步编程？\n\n同步编程与异步编程之间的区别主要在于程序内任务或操作的管理和执行方式。在同步编程中，操作按顺序逐个执行。如果某个操作涉及\
    \ I/O（如从文件读取数据或通过网络发送数据），整个程序会暂停并等待该操作完成。在当前操作完成之前，不会继续执行任何操作。这种方法的主要优点是简单；控制流是直接且易于理解的，因为它遵循顺序模式。然而，缺点是效率低下；当程序等待\
    \ I/O 操作完成时，CPU 处于空闲状态，尽管它可以执行其他有用的工作。\n\n另一方面，异步编程允许并发执行多个操作。当发起涉及 I/O 的操作时，程序不会等待其完成，而是可以继续执行其他操作。一旦\
    \ I/O 操作完成，通常会调用回调函数来处理操作结果。这种方法可以更好地利用资源，因为 CPU 可以在等待 I/O 操作完成的同时继续处理其他任务。它还能让程序更具响应性，因为即使在\
    \ I/O 密集型操作进行期间，程序也能继续响应用户输入。然而，由于需要处理回调和管理任务的并发执行，异步编程通常比同步编程更复杂。\n\n在网络编程的背景下，同步操作意味着服务器一次处理一个客户端请求。相比之下，采用异步操作时，服务器可以并发处理多个客户端请求，从而可能在相同时间内服务更多客户端。对于涉及并发管理多个连接或任务的网络密集型任务，异步编程通常可以提供更好的性能和可扩展性。\n"
