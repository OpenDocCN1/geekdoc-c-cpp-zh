    for transmitting documents on the World Wide Web. HTTP follows a client-server
    model where the client opens a connection and sends a message to a known server.
    The server then responds with a message of its own and closes the connection.


    HTTP messages consist of requests from client to server and responses from server
    to client. A request consists of a method (like GET or POST), the URL being requested,
    and a series of headers. A response consists of a response code (like 200 for
    success, 404 for not found), a message, and the response''s own series of headers.


