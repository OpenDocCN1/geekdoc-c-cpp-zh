    \ the error:\n\n```\n```cpp\nboost::system::error_code ec;\n\n// Some operation\
    \ that sets ec...\n\nif (ec) {\n\n    std::cerr << \"Error: \" << ec.message()\
    \ << \"\\n\";\n```\n```"
