- pgno: 144
  md: '# Types of VPN


    A Virtual Private Network (VPN) can be deployed in two main ways: as a Remote
    Access VPN or a Site-to-Site VPN. Each serves a different purpose and is used
    in different scenarios.


    # Site-to-Site VPN


    A Site-to-Site VPN, also known as a Router-to-Router VPN, is used when different
    offices of the same company need to connect to each other over the internet securely.
    In this setup, each location has a VPN gateway, like a router, firewall, or VPN
    concentrator, which is responsible for encrypting and decrypting the data coming
    in and out of the network.


    There are two types of Site-to-Site VPNs:


    Intranet-based Site-to-Site VPN: When a company has several remote locations that
    they want to join in a single private network, they create an intranet VPN. In
    this case, the network in each location is connected to the VPN gateway. This
    setup allows all offices to share resources as if they were on the same local
    network.


    Extranet-based Site-to-Site VPN: Suppose a company wants to communicate and collaborate
    securely with an external company, like a supplier or a partner. In that case,
    they can set up an extranet VPN. The external company won''t have access to all
    the resources on the network, only the ones that are necessary for collaboration.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Remote Access VPN


    A Remote Access VPN, also known as a Virtual Private Dial-up Network (VPDN), is
    used to provide users or employees with remote access to a company''s network.
    This setup is widely used by companies whose employees need to access the company''s
    resources securely from different locations, like from home or while traveling.


    In a Remote Access VPN, each user needs a VPN client installed on their device.
    This client is responsible for establishing the connection to the VPN gateway
    on the company''s network, and it encrypts and decrypts the data sent through
    this connection. This ensures that the connection is secure, and the data cannot
    be intercepted. Remote Access Virtual Private Networks (VPNs) are essential tools
    for providing secure connections to remote resources, typically classified into
    two categories: Internet Protocol Security (IPsec) and Secure Sockets Layer (SSL)
    VPNs.


    Traditionally, IPsec-based VPNs were the prevalent choice for ensuring secure,
    end-to-end encryption of data transferred between networks. These solutions require
    the installation of a VPN client on the user''s device, and their strength lies
    in creating secure network-level connections suitable for large enterprise environments.


    On the other hand, SSL-based VPNs have surged in popularity in recent years due
    to their flexibility and ease of use. The unique advantage of SSL VPNs is their
