- pgno: 65
  md: '# Sockets and Socket Programming


    Before we dive into TCP and UDP programming in C++, we must first understand the
    concept of a socket. Sockets are a fundamental entity used in network programming
    for establishing communication between different processes over a network. They
    serve as an interface for programming networks at the transport layer of the internet
    protocol suite and can be created using various programming languages, including
    C++. Let us delve deeper into what sockets are and how they work in the realm
    of network programming.


    # What is a Socket?


    A socket, in the context of networking, is an endpoint in a communication flow
    between two systems running network software. It can be seen as a communication
    gate. It has a socket number consisting of an IP address concatenated with a port
    number, e.g., ''192.168.1.1:22'' for an SSH server running on a machine with IP
    address 192.168.1.1. Port numbers allow different applications on the same machine
    to share a single IP address without interfering with each other''s communication.


    # Socket Programming in C++


    Socket programming is a method of communication between two computers using sockets.
    In C++, socket programming is done by using a series of system calls to make the
    network communication possible.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The process usually involves the following steps:


    Socket Creation: The socket function creates a new socket and returns a socket
    descriptor that can be used in later system calls. The socket is created using
    the socket(domain, type, protocol) function, where domain refers to the communication
    domain (usually AF_INET for IPv4 or AF_INET6 for IPv6), type refers to the communication
    type (SOCK_STREAM for TCP or SOCK_DGRAM for UDP), and protocol is usually set
    to 0 to automatically select the appropriate protocol based on the chosen type.


    Binding the Socket: Once the socket is created, it needs to be bound to a specific
    IP address and port number using the bind() function. This allows the socket to
    receive incoming data directed to that IP and port.


    Listening and Accepting Connections: In the case of server applications, the socket
    then listens for incoming connections using the listen() function, and when a
    client attempts to connect, the server accepts the connection using the accept()
    function.


    Connecting to a Server: For client applications, the socket attempts to connect
    to a server using the connect() function, specifying the server''s IP address
    and port number.


    Data Transfer: Once a connection is established (either by accepting a client
    connection for a server or successfully connecting to a server for a client),
    data can be sent and received using the send() and recv() functions (or write()
    and read()).'
  merge: -1
  img_proc: true
