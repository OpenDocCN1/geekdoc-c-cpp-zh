  md: '# Zigbee


    Zigbee is a high-level communication protocol used to create personal area networks
    built from small, low-power digital radios. Zigbee is often used in applications
    that require a low data rate, long battery life, and secure networking. It is
    based on an IEEE 802.15 standard.


    The Zigbee architecture consists of three types of devices: Zigbee Coordinator
    (ZC), Zigbee Router (ZR), and Zigbee End Device (ZED).


    Zigbee Coordinator (ZC): There is precisely one coordinator in each network which
    is responsible for initiating the network. The coordinator stores information
    about the network, including acting as the Trust Center & repository for security
    keys.


    Zigbee Router (ZR): The routers can pass on data from other devices. A ZR device
    has the same functionalities as ZED plus the capability to route data from other
    devices.


    Zigbee End Device (ZED): These are devices that connect to the network but do
    not route packets. They can communicate with the coordinator and routers, depending
    on the network configuration.


    The Zigbee protocol focuses on creating networks with low data traffic, and low
    power consumption is vital. Zigbee networks are secured with 128-bit symmetric
    encryption keys, providing a high level of security'
  merge: -1
  img_proc: true
