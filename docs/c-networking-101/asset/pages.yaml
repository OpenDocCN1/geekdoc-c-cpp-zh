    \n```\n```cpp\n#include\n\n#include\n\n#include\n\nnlohmann::json read_config(const\
    \ std::string& filename) {\n\n    std::ifstream i(filename);\n\n    nlohmann::json\
    \ config;\n\n    i >> config;\n\n    return config;\n\n}\n```\n```\n\n# Apply\
    \ Configuration\n\nWe can use this data to configure our sockets:\n\n```\n```cpp\n\
    void apply_config(int sockfd, const nlohmann::json& config) {\n```\n```"
