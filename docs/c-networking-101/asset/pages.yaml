- pgno: 32
  md: '# Refreshing C++ Basics


    As you embark on your journey to master C++ for network administration, it''s
    crucial to have a firm grasp on the fundamentals of the language. Although you
    have prior knowledge, refreshing these concepts can provide a stronger foundation
    for the more complex topics ahead. Let us dive into the syntax and data structures
    in C++. C++ is a statically typed, compiled, general-purpose, case-sensitive,
    free-form programming language. A C++ program generally consists of one or more
    functions, one of which must be named main(). The main function serves as the
    starting point for program execution.


    # Basic Syntax


    In the C++ programming language, a statement is terminated with a semicolon (;).
    Code blocks, typically used for function bodies, loops, and conditionals, are
    enclosed within curly braces {}. Comments can be added using either double slashes
    (//) for single-line comments or forward slash followed by an asterisk (/*) and
    ending with an asterisk followed by a forward slash (*/) for multi-line comments.


    A simple C++ statement might look like this:


    ```

    int a = 10; // This is a single line comment

    ```


    # Data Types'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'C++ supports several types of data:


    Integer types: Represent numbers without a decimal point. They are further divided
    into short, int, long, and long long, with varying sizes and ranges. Signed and
    unsigned versions are available for each type, with unsigned types unable to represent
    negative numbers.


    Floating-Point types: Represent numbers with a decimal point. They come in float,
    double, and long double varieties, each with different precision levels and ranges.


    +   - Boolean type: Represent true or false values.

    +   - Character types: Represent single characters.

    +   - Void type: Represents the absence of value.


    ```

    ```cpp

    int num = 10;

    ```

    ```


    ```

    ```cpp

    double pi = 3.14159;

    ```

    ```


    ```

    ```cpp

    bool is_true = true;

    ```

    ```


    ```

    ```cpp

    char initial = ''A'';

    ```

    ```


    # Variables'
