- pgno: 85
  md: '# Overview of Network Interfaces and Addressing


    A computer network is a group of interconnected devices that share data and resources.
    Within a network, devices communicate with each other using a system of digital
    signals. For a device to participate in a network, it needs a network interface
    and an address. A network interface is the point of interconnection between a
    computer and a private or public network. A network interface is usually a network
    interface card (NIC) with a software driver. The NIC provides a physical connection
    to the network. It often has an Ethernet port for wired connections and an antenna
    for wireless ones. The software driver enables the operating system and the network
    protocol to function together with the hardware.


    All NICs have a unique identifier, called a Media Access Control (MAC) address.
    MAC addresses are assigned to the NIC at the time of manufacture and are stored
    in its hardware. An address in a network is a unique identifier assigned to each
    device on the network. It allows devices to send and receive information to and
    from specific devices.


    There are two types of addressing schemes:


    IP Addressing: An Internet Protocol (IP) address is a numerical label assigned
    to each device participating in a computer network that uses the Internet Protocol
    for communication. It serves two main functions: host or network interface identification
    and location addressing.


    MAC Addressing: As mentioned, every network interface card has a unique MAC address
    that identifies it on the network at the physical layer of the network protocol.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'There are two versions of IP addresses in use: IPv4 and IPv6. IPv4 addresses
    are 32 bits long, and IPv6 addresses are 128 bits long. The length of the IP address
    affects the total number of possible addresses. The IPv4 addressing system is
    organized into classes (A, B, C, D, E) for different kinds of networks, from small
    networks (fewer addresses, such as Class C) to large networks (more addresses,
    such as Class A). However, with the advent of CIDR (Classless Inter-Domain Routing),
    the concept of classes is no longer used. The topic of addressing is also linked
    to the concept of subnetting. Subnetting is a technique used to divide a network
    into two or more smaller network segments (called subnets), each functioning as
    a small, separate network. This improves network performance and provides security.


    In the upcoming sections, we will dive deeper into subnetting, IP configuration,
    and programming network interfaces, which are essential for network administrators.
    These topics will help you understand how devices are assigned addresses, how
    network traffic is routed efficiently, and how you can interact with network interfaces
    programmatically using C++.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # Understanding Network Interfaces


    Network interfaces serve as the communication bridge between your computer and
    the network, enabling data transmission between your device and others on the
    network or internet. In this case, we''ll delve into understanding network interfaces
    within the contexts of two prevalent operating systems: Windows and Linux.


    # ## Network Interfaces in Windows


    Windows organizes network interfaces within the Network and Sharing Center, which
    provides a graphical interface to manage connections and view network information.
    You can access the Network and Sharing Center through the Control Panel.


    Each network interface, be it a physical Ethernet port, a Wi-Fi adapter, or a
    virtual adapter (like those used in VPNs), is represented as a network connection.
    You can view and change properties, including IP addressing information, DNS server
    information, and more, by right-clicking a network connection and selecting "Properties".


    Additionally, Windows has a powerful command-line tool for network troubleshooting
    and interface management called "netsh" (network shell). Using netsh, you can
    view interface settings, change IP addresses, and perform various other network-related
    tasks.


    # ## Network Interfaces in Linux'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'In Linux, network interfaces are traditionally managed using command-line tools.
    The specific tools can vary depending on the Linux distribution and version. The
    ifconfig command is traditionally used to display information about the network
    interfaces on the system, as well as to configure them. However, ifconfig is now
    deprecated in many Linux distributions. The ip command is now the preferred tool
    for network interface management on modern Linux systems. It can display information
    about network interfaces, and also configure them.


    Network interfaces in Linux are typically named "eth0", "eth1", etc. for Ethernet
    connections, and "wlan0", "wlan1", etc. for wireless connections. Linux also supports
    a broad range of virtual network interfaces, such as loopback interfaces (lo),
    tunnel interfaces (tun/tap), and bridge interfaces (br).'
