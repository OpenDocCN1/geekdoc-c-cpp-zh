    individual servers changes rapidly.


    Load balancing and energy optimization are correlated and affect the cost of providing
    the services; they can be done locally, but global load balancing and energy optimization
    policies encounter the same difficulties as the capacity allocation [144]. Quality
    of service (QoS) is probably the most challenging aspect of resource management
    and, at the same time, possibly the most critical for the future of cloud computing.


    Resource management policies must be based on a disciplined approach, rather than
    ad hoc methods. The basic mechanisms for the implementation of these policies
    are:


