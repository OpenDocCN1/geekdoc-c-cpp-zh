    # 5.1 BIG DATA APPLICATIONS IN SCIENCE AND ENGINEERING


    It should not be surprising that applications in computational physics, chemistry,
    biology, astrophysics, nanotechnology, civil engineering, computer-aided design,
    and many other areas of science and engineering do not perform well on clouds.
    These applications are CPU-, memory-, and I/O-interconnection and run efficiently
    on systems with low-latency, high-bandwidth interconnection networks available
    on the most powerful supercomputers [222].


    Clouds built with off-the-shelf components offer a cost-effective alternative
    to computing and it would be beneficial to make cloud computing an attractive
    choice for scientific and engineering applications. Overcoming the high cost and
    the limited availability of supercomputers would accelerate the discovery process
    in many areas of science and also lead to more aggressive designs of advanced
    systems.


    In this section we discuss the astounding progress made by the infrastructure
    for cloud computing during the past few years. We also contemplate the difficult
    road ahead in the quest to allow applications in computational sciences and engineering
    that process data sets, ranging in size from petabytes to exabytes and beyond,
    to run efficiently on clouds. Such applications require:


    +   1. An infrastructure with fast interconnects, faster processors, and high
    performance storage systems. Faster processors alone will only exacerbate the
    imbalance between computing and communication bandwidth.

    2. Guaranteed access to large pools of resources for extended periods of time.

    3. Support for complex workflows with specific resource demands for each phase
    of the workflow [86].

    4. A fault-tolerant environment for long-running applications.

    5. Stable and effective system software, including resource management.


    A study carried in the early days of cloud computing [126] reports on the results
    of a comparison of several supercomputers with the Amazon Web Services (AWS),
    vintage 2009–10. This study used the high performance benchmark discussed next.'
