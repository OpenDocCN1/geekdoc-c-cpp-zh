    # 1.2 THE MANY FACETS OF COMPLEXITY


    There is no universally accepted definition of complexity; typically, the concept
    is conveyed by particular examples. Systems with a very large number of components,
    such as the human brain with more than 100 billion neurons, are examples of complex
    systems. The space shuttle,³ a modern fighter jet, a multicore processor with
    several billion transistors,⁴ or the Internet with more than 1 billion hosts as
    of January 2014, are examples of complex man-made systems. Arguably, one of the
    most complex system, to date is LHC, the particle accelerator, together with its
    seven particle detectors at CERN in Geneva. Data recorded by the LHC detectors
    fills around 100,000 dual-layer DVDs each year and to the discovery of the Higgs
    boson, and provided new insights into the structure of the matter. Cloud computers
    are also complex consisting of millions of servers. Clouds deliver the computing
    cycles and the storage, allowing analysis of large data sets such as produced
    by LHC.


    Percolation, the movement and filtering of fluids through porous materials, and
    turbulence, the violent flow of a fluid, are examples of complex phenomena occurring
    in nature. Some of these phenomena, such as turbulence, are not fully understood
    in spite of significant progress in the field of fluid dynamics and their importance
    in the design of systems for modern society. It is reported that on his deathbed,
    Werner Heisenberg, one of the pioneers of quantum mechanics and the author of
    the Uncertainty Principle, declared that he had two questions for God: “Why relativity
    and why turbulence?” “I really think that He may have an answer to the first question”
    [92].


