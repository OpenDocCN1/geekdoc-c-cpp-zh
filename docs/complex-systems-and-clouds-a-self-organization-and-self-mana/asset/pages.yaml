  md: '# # CHAPTER 5

    Cloud Self-Organization and Big Data Applications


    From the early days of cloud computing it was evident that computer clouds provide
    an ideal environment for many enterprise applications. The success of cloud computing
    stimulated the interest in the new paradigm, and as a result, the pace of the
    development of the infrastructure and cloud services accelerated. In the second
    decade of the new millennium, more and more applications migrated to clouds, with
    the notable exception of Big Data scientific and engineering applications.


    According to Gartner Research, “Big Data is high volume, high velocity, and/or
    high variety information assets that require new forms of processing to enable
    enhanced decision-making, insight discovery, and process optimization” (http://www.gartner.com/it-glossary/big-data/).
    Big Data applications demand massive computing resources including CPU cycles,
    primary and secondary storage, and network. Only computer clouds and powerful
    supercomputers can supply resources.


    Existing data show that mobile applications, data analytics, and many Big Data
    enterprise perform well on the cloud as they exploit request-level parallelism.
    These applications take advantage of the low cost for cloud services. At the other
    end of the spectrum are applications in computational sciences, discussed in Section
    5.1, computational finance, and computational engineering. The data-level parallelism
    of such applications is often fine-grained and they do not perform well on clouds.


    It is likely that faster communication, more powerful processors, and new Cloud
    Resource Management (CRM) policies addressing the problems discussed in Section
