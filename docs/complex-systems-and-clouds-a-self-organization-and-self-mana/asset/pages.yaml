  md: 'address the question of quantitative measures of complexity. Disciplines such
    as computer science, systems engineering, biology, finance, or game theory, have
    developed their own measures of complexity. These measures reflect answers to
    questions such as: How difficult is it to describe the system or the organization
    of the system? How difficult is it to create a model of the system?


    The quantitative characterization of a system complexity, sometimes called abstract
    complexity, can be formulated only in terms of its structure. If we consider a
    system with $n$ components forming $S$ substructures, the degree of complexity
    could be measured as $D=S/n$. Then, the abstract complexity of the system depends
    on the degree of complexity and the cardinality of the set of substructures, and
    can be expressed as


    ```

    $C=D \times S=\frac{S^{2}}{n}. (1.14)$

    ```


    Consider a hierarchical structure of $n$ elements and $L$ levels. The number of
    substructures at levels $0, 1, \dots, L-1$, are respectively


    ```

    $S_0=n, S_1=N_1, \dots, S_{L-1}=N_{L-1}. (1.15)$

    ```


    Then the abstract complexity of the entire structure can be expressed as


    ```

    $C_L=\prod_{i=1}^{L-1}C_i=\frac{N_1^{2}}{n} \times\frac{N_2^{2}}{N_1} \times\dots
    \times\frac{N_{L-2}^{2}}{N_{L-3}} \times\frac{N_{L-1}^{2}}{N_{L-2}} \prod_{i=1}^{L-1}N_i.
    (1.16)$

    ```


    We have to accept that the quantitative characterization of a system’s complexity
    is more challenging. It is hard to reflect all factors contributing to complexity,
    including: the number of components, the diversity of the components, the interaction
    patterns among the components, how far can the system be from equilibrium, how
    extensive the knowledge of the system’s history be to give us some understanding
    of its behavior, and what type of feedback, what is its intensity, and how is
    it applied in time?


    Typically, we operate with a model of a system and quantify aspects of this model
    as a proxy for the system. For example, we can measure the actual amount of information
    needed to describe the system [34], the number or the types of the components
    [169], a measure of the interactions among the system components, or a combination
    of these metrics.'
