    The alternative to the wasteful resource management policy when the servers are
    always on, regardless of their load, is to develop energy-aware load balancing
    and scaling policies. Such policies dynamic power management with load balancing
    and attempt to identify servers operating outside their optimal energy regime,
    decide if and when they should be switched to a sleep state or what other actions
    should be taken to optimize the energy consumption.


    Energy optimization is an important policy for Cloud Resourced Management (CRM),
    but it cannot be considered in isolation, it has to be coupled with admission
