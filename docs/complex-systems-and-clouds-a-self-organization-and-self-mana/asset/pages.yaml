    # 3.3 MANAGING COMPLEXITY


    A recent textbook on principles of computer systems design [194] devoting its
    first chapter to system complexity and the means to manage complexity, including
    modularity, layering, and hierarchical organization. Layering and hierarchy have
    been present in social systems since ancient times. For example, the Spartan Constitution,
    called Politeia, describes a Dorian society based on a rigidly layered social
    system and a strong military. Nowadays, in a modern society, we are surrounded
    by organizations structured hierarchically.


    Modularity is a technique to build systems from a set of interacting components
    assembled and tested independently. Modularity has been used extensively since
    the industrial revolution for building every imaginable product, from weaving
    looms to steam engines, from watches to automobiles, and from electronic devices
    to airplanes. Individual modules are often made of subassemblies; for example,
    the power train of a car includes the engine assembly, the gear box, and the transmission.
    In computer architecture, pipelined processors have multiple functional units.'
  merge: -1
