  md: '# 1.8 SELF-ORGANIZATION AND SELF-ORGANIZED CRITICALITY


    Self-organization is the spontaneous emergence of global coherence out of local
    interactions. The behavior of many systems seems chaotic and unpredictable, but
    a closer analysis discovers self-organization. Positive feedback sometimes amplifies
    random fluctuations and generates different forms of self-organization in physical,
    chemical, biological, robotic, social, and cognitive systems. This point of view
    reflects the principle of “order from noise,” formulated in 1960 by Heinz Foerster
    [229].


    Self-organization could open a new era in the design and implementation of large-scale
    computing systems and networks [166, 178]. Self-organization is prevalent in nature
    [199], for example, molecular self-assembly, self-assembly of monolayers, and
    the formation of liquid and colloidal crystals and many other examples in chemistry.
    Spontaneous folding of proteins and other bio-macromolecules, the formation of
    lipid bilayer membranes, thermal convection of fluids, chemical oscillation, and
    crystallization are manifestations of self-organization in nature. The flocking
    behavior of different species, the creation of structures by such animals, and
    animal swarming are manifestation of self-organization of biological systems.
    Ecosystems are examples of systems where individuals have competing interests
    and conflicts are inherent, but still some form of equilibrium is reached.


    An interesting question addressed by the 1977 Nobel laureate in Chemistry, Ilya
    Prigogine, is how self-organization can be reconciled with the second law of thermodynamics,
    which states that the entropy of a system can never decrease. Prigogine studied
    dissipative structures like the Benard cells which exhibit dynamic self-organization
    and are examples of systems far-from-equilibrium. Benard cells are ordered hexagonal
    convection cells, or atomic-molecular structures that spontaneously form in viscous
