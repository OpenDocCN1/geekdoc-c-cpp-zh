    benefit a History-Based (HB) coalition formation process.


    The second strategy, called Just-in-Time (JST), is intuitive and straightforward,
    server coalitions are formed based on customer needs expressed at the time of
    the auction. JST implementation details consists of several steps:


    +   1. Examine the service requests and determine the type of servers and the
    size of the coalitions.

    2. Send directives down the hierarchical structure of a WSC on the type of servers
    and the sizes matching the needs.

    3. Servers form coalitions matching the service requests.

    4. Coalitions compete for service requests.

    5. Unatisfied service requests are submitted again.


    One is inclined to believe that JST coalition formation is a better choice because
    it seems more natural to respond to the current needs, rather than anticipate
    the needs. A counterargument is that in JST the two processes, the coalition formation
    and the combinatorial auctions are independent, thus the goal of providing packages
    involving multiple coalitions is likely to involve additional overhead.


    There are other reasons to be concerned about the effectiveness of JST coalition
    formation which requires information about the current state of the servers. Cloud
    data centers consist of multiple WSCs each with hundreds of thousands of servers
    interconnected by a hierarchy of networks. CRM policies relying on state information
    collected through a monitoring process is rather inefficient compared with a trivial
    bidding process [163]. This motivates us to investigate market models for resource
    management based on coalition formation, but why combinatorial auctions?'
