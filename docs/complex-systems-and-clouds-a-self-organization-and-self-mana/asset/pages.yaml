  md: 'A combinatorial auction is a market where the participants can place bids for
    packages of goods or services. Combinatorial auctions allow cloud users to acquire
    packages consisting of coalitions of servers with different types and amounts
    of resources. Combinatorial auctions are desirable because different phases of
    an application may require systems with different configurations or systems supporting
    different functions.


    For example, the ubiquitous Map applications illustrate the need for coalition
    formation and combinatorial auctions: coalitions of servers with attached GPUs
    are optimal for the computationally intensive Map phase, and coalitions of servers
    with solid-state secondary would be best for the Reduce phase. The two types of
    coalitions must be acquired at the same time; the results produced during the
    Map phase by the first coalitions should be stored during the Reduce phase on
    the systems in the second coalitions.


    # 5.4 HISTORY-BASED RACK-LEVEL COALITION FORMATION


    The organization of the cloud infrastructure should support a flexible environment.
    The resource management system should allocate resources in packages determined
    by the actual application needs, rather than providing a limited set of predefined
    packages. This objective can be best achieved by market-based self-organization
    and self-management mechanisms which are more efficient, agile, and user-friendly
    than the ones relying on hierarchical resource management.


    The coalition formation process discussed next is based on concepts related to
    cooperative games presented in Section 3.8. A rack is homogeneous, all servers
    have the same architecture and identical configuration and are indistinguishable
    from one another. Rather being selfish, the goal of all servers in a rack is to
    cooperate with one another and bring in a maximum benefit to the CSP. The homogeneity
    assumption simplifies considerably the search for optimal structures (CS).


    Spatial locality constraints. Communication is critical for the performance of
    a parallel application with a complex workflow, therefore mapping computations
    to processors should be very high on the priority list of any CRM system. The
    coalition members should be able to effectively communicate with one another and
    this condition should be of utmost concern for the coalition formation algorithms.'
