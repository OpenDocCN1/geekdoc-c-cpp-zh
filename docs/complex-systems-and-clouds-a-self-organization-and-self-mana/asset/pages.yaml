  md: '# Nature-Inspired Algorithms and Systems


    Richard Feynman believed that computing and physics and, particularly, quantum
    mechanics, are in a symbiotic relationship [82]. In 1998, Leonard Adleman expressed
    his conviction that “Biology and computer science—life and computation are related.
    I am confident that at their interface great discoveries await who seek them...”
    [7]. A significant number of research results in quantum and DNA computing have
    proven that the two visionary scientists were right.


    The study of insect and animal behavior, immunology, molecular biology, genetics,
    the study of the nervous system, and of the human brain are a few disciplines
    that have inspired new problem-solving techniques and principles for systems design
    and implementation. Evolutionary computing is inspired by Darwin’s theory of evolution,
    and membrane computing draws its inspiration from the organization of cells where
    different components interact through permeable cellular walls.


    Neural computation attempts to emulate the brain [120], and amorphous computing
    draw their ideas from morphogenesis, investigated by Alan Turing at the beginning
    of the 1950s [224]. The behavior of groups of insects, birds, and animals is a
    source of ideas for swarm intelligence, and self-replication led to the development
    of cellular automata. The study of the natural immune system inspired the study
    of artificial immune systems.


    We wish to understand the laws governing complex systems in nature and, whenever
    feasible, apply the learned in designing and building increasingly complex man-made
    systems. Bio-inspired computing and organic computing are two areas driven by
    the desire to apply lessons learned from nature to system design. Bio-inspired
    computing aims to model the living phenomena using computers, and, at the same
    time, improve the use of computers through modeling the behavior of living organisms.
    Organic computing assumes that we shall be surrounded by networks of intelligent
    systems aware of their environment through sensors, and capable of acting using
    sets of actuators, and that such systems will self-organize to optimize their
    activities.'
