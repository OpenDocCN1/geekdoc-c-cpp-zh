  md: 'A side-by-side comparison of generic attributes of simple and complex systems
    shows that complex systems are nonlinear, operate far from equilibrium, are intractable
    at the component level, exhibit different patterns of behavior at different scales,
    require a long history to draw conclusion about their properties, exhibit complex
    forms of emergence, are affected by phase transitions, and scale well. In contrast,
    simple systems are linear, operate close to equilibrium, are tractable at a component
    level, exhibit similar patterns of behavior at different levels, relevant properties
    can be inferred based on a short history, exhibit simple forms of emergence, are
    not affected by phase transitions, and do not scale well.


    Natural sciences, including chemistry, molecular biology, neuroscience, and physics,
    study different aspects of complexity and complex phenomena. For example, self-organized
    criticality discussed in Section 1.8 was an important discovery in statistical
    physics in the second half of the 20th century [22]. Bak et al analyzed mechanisms
    supporting natural complexity, and the spontaneous emergence of complexity from
    simple local interactions. They concluded that [21]“the complexity in nature does
    not depend on fine details of the system, several model parameters could have
    ample variations without affecting the emergence of critical behavior.


    Complexity plays a role whenever we model processes in fields such as economics,
    meteorology, psychology, earthquake prediction, or sociology. Friedrich Hayek,
    a philosopher and Nobel prize economist, and Karl Popper, both associated with
    the Austrian school of economics, made significant contributions to the understanding
    of complexity in economics. More recently, Paul Krugman, the 2008 winner of the
    Nobel Prize in Economic Sciences for his contributions to New Trade and New Economic
    Geography, analyzed the application of self-organization in economy [142].


    Ludwig von Bertanffy, who initiated the study of open systems, stresses that:
    “It is necessary to study not parts and processes in isolation, but also to solve
    the divisive problems found in organization and order unifying them, resulting
    from dynamic interaction of parts, and making the behavior of the parts different
    when studied in isolation or within the whole” [36]. The patterns of the interactions
    between the components of a complex system can be stable over longer periods of
    time or short-lived [49].


    The concept of emergence describes phenomena characteristic of complex systems
    and is related to self-organization [104]. Emergence is the'
