    # 2.7 QUANTUM INFORMATION PROCESSING SYSTEMS


    Quantum is a Latin word meaning “some quantity.” In physics it is used with the
    same meaning as the word discrete in mathematics; it refers to a quantity or variable
    that can take only sharply defined values, as opposed to a continuously varying
    quantity. Quantum mechanics is a mathematical model of the physical world. This
    model allows us to specify states, observables, measurements, and the dynamics
    of quantum systems. Quantum computing and quantum information theory are concerned
    with the transmission and processing of quantum states and the interactions of
    quantum information with the “classical” one. Classical information is carried
    by physical processes obeying the laws of classical physics. Classical physics
    does not use the quantization paradigm and includes classical mechanics and relativity.


    Quantum computers are stochastic systems because the state of a quantum system
    is uncertain and therefore, a certain probability is associated with any possible
    state the system can be. The outputs of a stochastic engine are random: the label
    of the output state cannot be discovered. All we can do is label a set of pairs
