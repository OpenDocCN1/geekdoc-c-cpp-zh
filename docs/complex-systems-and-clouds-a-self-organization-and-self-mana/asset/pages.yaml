    # 3.9 COOPERATIVE GAMES FOR COALITION FORMATION


    There are many instances when individual agents work together towards a common
    goal rather than being driven by their personal interest. This is true in the
    case of social activities and is also true for the autonomous servers of a cloud
    infrastructure. In Chapter 5 we present a reservation system based on coalition
    formation and combinatorial auctions. Coalitions are formed to create large pools
    of resources for Big Data applications. The common goal is to maximize the revenue
    of the cloud service provider.


    Task-oriented coalition formation is often $\mathcal{NP}$ hard [99]. When all
    agents have the same ability to perform a single task, the problem is similar
    to the set partitioning problem, while in the case of agents to perform multiple
    tasks the problem resembles the set covering problem [203].'
