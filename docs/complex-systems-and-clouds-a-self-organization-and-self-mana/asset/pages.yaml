    The high connectivity nodes of a scale-free network play the important role of
    hubs in communication and networking, a fact that can be exploited when designing
    efficient search algorithms [4].


    Fig. 3.3 shows the graph of a scale-free network. The average distance $d$ between
    the $N$ nodes, also referred to as the diameter of the scale-free network, scales
    as $ln N$; in fact it has been shown that $k_{min} > 2$ a lower bound on the diameter
    of the network with $2 < y < 3$ is $ln N$ [56].


    A number of studies have shown that scale-free networks have remarkable properties,
    such as: (a) robustness against random failures [30]; (b) favorable scaling [9,
    10]; (c) resilience to congestion [95]; (d) tolerance to attacks [223]; and (e)
    small diameter [56] and small average path length [29].


    The moments of a Power Law distribution play an important role in the behavior
    of a network. It has been shown that the connected component (GCC) of networks
    with a finite average degree and divergent variance can only be destroyed if all
    vertices are removed; such networks are highly resilient against faulty constituents
    [54, 55]. These properties make scale-free networks very attractive for interconnection
    in many applications, including social systems [174], peer-to-peer systems, and
    sensor networks [147, 159].


    Another important property is that the majority of the nodes of a scale-free network
    are directly connected with the nodes of higher degree (see Fig. 3.3). For example,
    in a network with $N=130$ nodes and $m=215$ links, 60% of the nodes are directly
    connected with the five nodes with the highest degree, while in a random network
    fewer than half, 27%, have this property [10]. Thus, the nodes of a scale-free
    network with a larger degree than a given threshold $T$ could assume the role
    of “core nodes” and assume


