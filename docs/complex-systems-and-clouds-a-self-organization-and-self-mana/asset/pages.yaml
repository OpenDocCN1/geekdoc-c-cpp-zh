    # 3.5 AUTONOMIC COMPUTING


    The management and control of large-scale systems is extremely challenging. As
    the system complexity grows due to technological advances and pressure from the
    user community, the system becomes unmanageable, less reliable due to the very
    large number of components, less secure, and more difficult to maintain due to
    the complexity of the software. These facts were recognized, and in early 2000,
    IBM advanced the idea of autonomic computing [85, 134].


    The 2003 autonomic computing manifesto [134] proposed embedding complexity in
    the system infrastructure. Since then, a significant body of research was devoted
    to autonomic computing. Over 8,000 papers, nearly 200 conferences, and some 200
    issued patents and more than 100 pending patents, are some of the results of a
    decade-long research effort in this field [137]. Some of these efforts have resulted
    in commercial products, such as the Tivoli produced by IBM Cloud and Smarter Infrastructure.
    Some of the traits of autonomic computing, including self-optimization, self-configurations,
    and continuous monitoring, appear in database management systems (DBMS) such as
    DB2 [69]. DB2 supports disaster recovery and autonomic index determination.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Complex Systems and Clouds


    Autonomic systems are expected to make decisions on their own based on high-level
    policies; such systems attempt to optimize their state and to adapt to changing
    conditions of the environment and of the internal state of the system. Four aspects
    of autonomic computing are identified in [134]:


    +   1. Self-configuration—automated configuration of components and systems follows
    high-level policies, the entire system adjusts automatically and seamlessly.


    +   2. Self-optimization—the components and systems continually seek opportunities
    to improve their performance and efficiency.


    +   3. Self-healing the system automatically detects, diagnoses, and repairs localized
    software and hardware problems.


    +   4. Self-protection—the system automatically defends against malicious attacks
    or cascading failures. It uses early warning to anticipate and prevent systemic
    failures.


    The goal of autonomic computing is to manage complexity, reduce cost of ownership,
    and enhance the quality of the software. Complexity should be managed by exploiting
    technological advances, including those in several areas of Artificial Intelligence.
    Autonomic computing requires software and hardware capable to ensure that the
    system is self-aware and, at the same time, aware of the environment [1811]. The
    systems should be able to monitor and analyze internal events, as well as events
    caused by the interaction between the environment and the system. Machine-learning
    techniques, feedback control, planning and optimization techniques are some of
    the mechanisms to support system awareness.


    An autonomic system should be supported by policy-based management and effective
    negotiations between system components. A policy defines the high-level objective
    driving the response of the system to internal changes of state and to changes
    in the environment. Different mechanisms for the implementation of policy-based
    management for large-scale systems exist, see Section 4.6.


    A policy can specify the action to be taken or can define a goal state to be reached.
    In both cases, it is necessary to know the current state of the system as well
    as the state to be reached. Knowing any degree of accuracy the global state of
    a large-scale system is a very challenging proposition. Equally challenging is
    the determination of the path leading to a desirable state.'
