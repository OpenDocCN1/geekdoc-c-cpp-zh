    # 2.4 ANT COLONY OPTIMIZATION


    Ant Colony Optimization (ACO) is a metaheuristic¹ for solving hard combinatorial
    optimization problems introduced in [74]. The biological inspiration of ACO is
    that ants find the shortest path from their nest to a source of food using pheromone
    trails, chemicals left on the ground marking the path for other ants to follow.


    Stigmergy² is a phenomenon observed in social insects; it describes a process
    when individuals leave in the environment a trail stimulating the actions of other
    members of the population. Subsequent actions reinforce and build on each other,
    leading to the spontaneous emergence of coherent, apparently systematic activity.
    Stigmergy is a form of self-organization.


