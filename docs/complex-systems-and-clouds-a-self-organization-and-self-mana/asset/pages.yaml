    # 2.8 MEMBRANE COMPUTING


    Membranes play an important role in the biochemical processes of living organisms.
    A cell is separated from its environment by a membrane, the nucleus of a cell
    where the genetic material resides is surrounded by a membrane, and various regions
    of a cell where specific biochemical processes take place are also surrounded
    by membranes. The transfer of molecules from one region of a cell to another is
    controlled by membranes and, often the chemical reactions that take place in a
    cell are catalyzed by proteins bounded on membranes. The transport of molecules
    from lower to higher concentrations is also controlled by membranes.


    Membrane computing (MC) is biologically inspired; it is a generalization of DNA
    computing, but it is a computational rather than a biological model. In MC, transformation
    rules allow objects encapsulated in compartments defined by membranes to evolve.
    In this evolution compartments communicate among themselves and with the environment.
    The structure of a P-system, as MC is named after its inventor, Gheorghe Paul,
    has a hierarchical arrangement of membranes, as in a cell or a net of membranes
    as in a tissue or a neural net. A membrane can be viewed as an abstraction, a
    separator of two regions of the Euclidean space, a finite “inside” and an infinite
    “outside,” able to communicate among themselves [185].


    Chemicals are modeled by symbols, or strings of symbols, collectively called objects.
    A region defined by a membrane can contain other symbols or strings or other membranes.
    A P-system has one outer membrane, called the skin membrane, and a hierarchical
    relationship governing all its membranes under the skin membrane (see Fig. 2.3).'
