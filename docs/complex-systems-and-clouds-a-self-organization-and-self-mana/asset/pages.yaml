    Fig. 5.15(A–F) shows several performance metrics including the customer satisfaction
    index, the service mismatch index, the auction success ratio, the spot opportunity
    index, the temporal fragmentation index, and the capacity allocation index. The
    simulation covers 50 slots.


    The 5% confidence intervals for the mean of all performance metrics are computed
    for 25 batches, each one of 200 realization of random variable. The simulation
    times are 6.4s for 2,000 runs and 11.7s for 5,000 runs. The confidence intervals
    are rather tight; this indicates that the performance of the protocol is relatively
    stable for the range of parameters explored in this evaluation.


    The auction success rate is high, typically above 80%. The low auction success
    rate is an artifact of the decision to randomly select the service startup time.
    The spot allocation opportunity index is correlated with the auction success rate
    and shows that a significant fraction of the capacity is available for spot allocation.
    This result is correlated with the one in Fig. 5.15(F) which shows that on average,
    50% of the server capacity is not allocated by the reservation system and it is
    available for the spot market.


    A reservation system covering 50% of the server capacity is probably the most
    significant result; it shows that self-management based on auctions can drastically
    improve server utilization. We live in a world of limited resources and cloud
    over-provisioning is not sustainable either economically or environmentally.


    The service mismatch index is fairly high, typically in the 50% range and it is
    above 60% in a few slots. The customer satisfaction is correlated with the service
    mismatch and typically is in the region of 50%. In a realistic scenario, when
    coalitions maintain statistics regarding the services offered and avoiding offered
    services unlikely to be demanded by the cloud users, the service mismatch would
    not affect the performance of the algorithm. Temporal fragmentation, though rather
    low, is undesirable. The overidding factor 64 ± 2.93% is another indication that
    the protocol needs to be finely tuned.


