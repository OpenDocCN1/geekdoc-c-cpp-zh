  md: '# Complex Systems and Clouds


    We can年纪 two types of interactions in a hierarchically organized system, interactions
    among the subsystems and interactions within the subsystems. Typically, these
    interactions often are of different orders of magnitude. According to Herbert
    Simon, *nearly decomposable* systems have two properties [209]: “(a) in a nearly
    decomposable system, the short-run behavior of each of the component subsystems
    is approximately independent of the short-run behavior of the other components;
    (b) in the long run, the behavior of any one of the components depends in only
    an aggregate way on the behavior of the other components.”


    Hierarchical organization is a common approach to accommodate the complexity of
    many large-scale, economical, computer, and communication systems. Hierarchical
    organization restricts the communication pattern between the system components;
    the system is organized as a tree. In a hierarchical organization, information
    about the state of the system flows from the leaves to the root of the tree; management
    decisions flow in a reverse pattern, from the top to the bottom. Typically, each
    node manages the subtree rooted at node. In practice, a more involved communication
    pattern may exist, a child node may have multiple parents.


    Many large-scale computing systems are organized hierarchically; in each cluster,
    a *leader* is responsible for monitoring and controlling the activity of the cluster
    nodes and interacts with other cluster leaders to achieve common system objectives.
    Such an organization is more efficient communication delays are shorter and the
    overhead for resource management is lower.


    Layering and hierarchical organization have their own problems, could negatively
    affect the society, impose a rigid structure and affect social interactions, increase
    the overhead of activities, and prevent the system from acting promptly when such
    actions are necessary. In the case of computing and communication systems, layering
    typically affects performance.


