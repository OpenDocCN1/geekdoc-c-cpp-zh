  md: 'The entropy and the Kolmogorov complexity discussed in this section, the fractal
    dimension mentioned in Section 1.3, and the Fisher information$^{11}$ are expressed
    as the number of bits. The entropy is a measure of the lack of information about
    the state of a system.


    We briefly discuss thermodynamic entropy, Shannon entropy, and von Neumann entropy.
    *Thermodynamic entropy* is a measure of the number of ways in which the individual
    atoms and molecules, i.e., the micro-states, which comprise the macroscopic state
    of the system may be arranged. It is a measure of disorder in the system defined
    by Boltzmann as


    ```

    $S = k_B \ln \Omega,$

    ```


    with $k_B$ the Boltzmann’s constant and $\Omega$ the number of micro-states of
    the system.


    *Shannon entropy* measures the surprise caused by the occurrence of an event.
    Consider an event which happens with probability $p$; we wish to quantify the
    information content of a message communicating the occurrence of this event, and
    we impose the condition that the measure should reflect the “surprise” brought
    by the occurrence of this event. An initial guess for a measure of this *surprise*
    would be $1/p$, such that the lower the probability of the event, the larger the
    surprise. But this simplistic approach does not resist scrutiny; the surprise
    should be additive. If an event is composed of two independent events which occurs
    with probabilities $q$ and $r$, then the probability of the event should be $p=qr$,
    but we see


    ```

    $$\frac{1}{p} \neq \frac{1}{q} + \frac{1}{r}.$

    ```


    On the other hand, if the *surprise* is measured by the logarithm of $1/p$, then
    the additivity property is obeyed


    ```

    $$\log\frac{1}{p} = \log\frac{1}{q} + \log\frac{1}{r}.$

    ```


    All logarithms are in base 2 unless otherwise. Given a discrete probability distribution
    with $\sum_i p_i=1$ we see that the uncertainty is in fact equal to the average
    *surprise*


    > ¹The Fisher information is a way of measuring the amount of information that
    an observable random variable $X$ carries about an unknown parameter $\theta$
    upon which the probability of $X$ depends. The Fisher-information matrix is used
    to calculate the covariance matrices associated with maximum-likelihood estimates.'
