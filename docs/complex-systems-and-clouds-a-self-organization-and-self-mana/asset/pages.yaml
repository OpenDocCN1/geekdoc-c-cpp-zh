  md: 'The concept of utility is based on the principle of rational choice, i.e.,
    a component of a complex system will choose the most beneficial course of action.
    Policies based on utility seem suitable for large-scale systems. The utility is
    a real number measuring the system’s benefit of being in a certain state. For
    a system with a very large number of autonomous components, each one of the components
    is able to accurately determine its state and its utility. Determining the utility
    of the entire system requires a global resource manager tasked to collect information
    from all system components filtered by objective analyzers and then determine
    the course of action. The decision-making process involves an upwards flow of
    utility information followed by downwards flow of decisions.


    This is the case of the Tovi Intelligent Orchestrator (TIO) where the objective
    analyzers process utility information from groups of nodes [136]. This form of
    self-management is unlikely to be effective for systems with millions of components
    with rapidly changing states. The information used by the objective analyzers
    and by the global resource manager will inherently be obsolete. A significant
    fraction of the communication bandwidth of the system will be in the process.
    In Chapter 5, we discuss the results of a simulation experiment comparing hierarchical
    control with market mechanisms. The results confirm that monitoring the states
    of individual system components does not always effectively support self-management.


    The scalability of TIO self-management is questionable. According to [136]: “Models
    are essential for relating higher-level metrics to lower-level system control
    parameters. In our data center example, we were able to tap into a queuing model
    that could predict what would happen if the amount of resource changed.” Developing
    such models for large-scale systems is extremely challenging.


    The decisions made by self-management must take into account, not only changes
    in the internal system configuration, but also the interactions with the environment
    [2, 5]. Some of these interactions affect the system resources, others reflect
    the service demands placed by the user community. Changes in the internal system
    configuration are due to predictable phenomena, such as individual server failures,
    or to unpredictable ones, such as power failures affecting a number of servers.
    Maintaining a history of such events helps in determining the failure rate and
    the actions to be taken in each case. This approach reflects the principle of
    embedding complexity'
