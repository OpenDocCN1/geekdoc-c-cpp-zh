    Tensor contraction is the summation over repeated indices of the two tensors or
    a vector and a tensor. Let $C$ be the contraction of two arbitrary tensors $A$
    and $B$. The rank of the tensor resulting after contraction is


    ```

    $R(C) = \mathcal{R}(A) + \mathcal{R}(B) - 2. \quad (5.2)$

    ```


    For example, when $A = [a_{ij}]$, $B = [b_{jk}]$ and we contract over $j$ we obtain
    $C = [c_{ijk}]$ with


    ```

    $c_{ijk} = \sum_{j} a_{ij}b_{jk}. \quad (5.3)$

    ```


    The rank of $C$ is $\mathcal{R}(C) = 2 + 3 - 2 = 3$. Tensor $C$ has 8 elements


    +   $c_{111} = \sum_{j=1}^2 a_{1j}b_{j1} = a_{11}b_{11} + a_{12}b_{21} \quad c_{121}
    = \sum_{j=1}^2 a_{1j}b_{j1} = a_{11}b_{11} + a_{12}b_{21}$

    $c_{212} = \sum_{j=1}^2 a_{2j}b_{j2} = a_{21}b_{12} + a_{22}b_{22} \quad c_{222}
    = \sum_{j=1}^2 a_{2j}b_{j2} = a_{21}b_{12} + a_{22}b_{22}$

    $c_{112} = \sum_{j=1}^2 a_{1j}b_{j2} = a_{11}b_{12} + a_{12}b_{22} \quad c_{122}
    = \sum_{j=1}^2 a_{1j}b_{j2} = a_{11}b_{12} + a_{12}b_{22}$

    $c_{211} = \sum_{j=1}^2 a_{2j}b_{j1} = a_{21}b_{11} + a_{22}b_{21} \quad c_{221}
    = \sum_{j=1}^2 a_{2j}b_{j1} = a_{21}b_{11} + a_{22}b_{21} \quad (5.4)$


    Tensor networks and Tensor Contraction (TNC). A tensor network is defined as:
    let $[A_1], \dots, [A_n]$ be $n$ tensors with index sets $x^{(1)}, \dots, x^{(n)}$
    where each $\{x^{(i)}\}$ is a subset of $\{x_1, \dots, x_N\}$ with $N$ very large.
    We assume that the “big” tensor $A[x_1,\dots,x_N]$ can be expressed as the product
    of the “smaller” tensors $[A_1], \dots, [A_n]$


    ```

    $A[x_1,\dots,x_N] = [A_1] \dots \dots [A_n][x^{(n)}]. \quad (5.5)$

    ```


    We wish to compute the scalar


    ```

    $Z_A = \sum_{x_1,\dots,x_N} [A_i][x_1,\dots,x_N]. \quad (5.6)$

    ```


    For example, $n=7$ and $n=4$ and the index set is $\{x_1, x_2, \dots, x_7\}$ for
    the TNC in Fig. 5.3. The four “small” tensors and their respective subsets of
