    and energy storage technologies to match the sharp reduction of energy consumption
    per instruction we have witnessed throughout the last decades; we expect that
    communication efficiency will continue to be an important design goal for sensor
    networks.


    The Organization, Routing, and Mobility (ORM) management of ad-hoc networks to
