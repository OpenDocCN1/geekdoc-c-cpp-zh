    where S is a search space over a set of discrete decision variables containing
    a finite set of possible solutions, \Omega is a set of constraints among the discrete
    set of decision variables, and f: S \to R+ assigns a positive cost value to each
    solution. The goal is to find within a reasonable amount of time, either a solution
    of minimum cost value, or a good approximate solution [182].


