  md: '# Managing Complexity of Large-Scale Cyber-Physical Systems 95


    Communication protocols at the data link and transport layer transform error-prone
    communication channels into error-free ones.


    A self-organizing system responds to changes of the environment through adaptation,
    anticipation, and robustness; the system reacts to changes in the environment,
    predicts changes, and reorganizes itself to respond to them, or is robust enough
    to sustain a certain level of perturbations. Self-organization and self-management
    of a man-made system imply that there is no centralized control and individual
    components organize and manage themselves to provide a function consistent with
    global system policies.


    Consider, for example, the organization of the traffic lights in a large metropolis
    [88]. The system could be centralized, sensors placed in the vicinity of traffic
    lights send data to a computer system which uses a global optimization algorithm
    to minimize the waiting time of the vehicles to reduce pollution, and then sets
    the traffic lights accordingly. In a self-organizing system, there is no central
    computer and each traffic light receives information from sensors in its proximity;
    the light turns red when there are only a few cars in the direction it controls
    and green when the converse is true. There is negative feedback, if it stays on
    red for an extended period, the number of waiting cars increases and the light
    has to turn green. Multiple traffic lights are affected by the traffic flow in
    the direction they control thus have to coordinate their behavior.


    Practical implementation of self-organization and self-management is challenging.
    Very few of the large-scale systems designed in recent years claim some form of
    self-organization or self-management. In its itself proof of the challenges faced
    by the designers of such systems. Some of these challenges are:


    +   * The absence of a technically suitable definition of self-organization, a
    definition that could hint at practical design principles for self-organizing
    systems and quantitative evaluation of the results. Marvin Minsky [171] and Murray
    Gell-Mann [89] have discussed the limitations of concepts in complex system theory,
    such as emergence and self-organization. The same applies to autonomic computing,
    there is no indication of how to implement any of the four principles and how
    to measure the effects of their implementation.


    +   * A quantitative characterization of complex systems and self-organization
    and self-management is extremely difficult. We can'
