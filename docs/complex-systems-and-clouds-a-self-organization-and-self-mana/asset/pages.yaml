    processor with 4 GB of RAM consumes 110 W when idle and 175 W when fully loaded
    [28].


    An energy-proportional system is one when the amount of energy used proportional
    to the load of the system. Different subsystems of a computing system behave differently
    in terms of energy efficiency; while many processors have reasonably good energy-proportional
    profiles, significant improvements in memory and disk subsystems are necessary.
    The processors used in servers consume one-third of their peak power at very low
    and have a dynamic range of more than 70% of peak power; the processors used in
