    # 5.5 A COMBINATORIAL AUCTION PROTOCOL


    Several combinatorial auctions discussed in Section 4.11 have been analyzed, but
    none is a good choice for CRM. In traditional applications of combinatorial auctions,
    the bidders are the consumers of resources, while in this particular application,
    there are two distinct competitions, one initiated by the buyers and the other
    by the consumers of services.


    The protocol presented in this section primarily targets reservation systems for
    the cloud delivery model represented by AWS. Reservation and spot allocations
    are now offered by many CSPs. Reservations guarantee access for long-running enterprise
    applications, where spot allocations are used primarily by individual users for
    software development. This is the case of AWS where reservations are more costly
    than spot allocation.


    The protocol is inspired by the clock-proxy auction [20]. This auction seems most
    suitable for cloud computing environments with a large population of both buyers
    and sellers. The clock-proxy auction has two phases:


    +   1. A clock phase when the price discovery takes place.


    +   2. A proxy phase, when the bids for packages are entertained.'
