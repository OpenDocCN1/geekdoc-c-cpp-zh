    # 1.6ERGENCE, NONLINEARITY, AND PHASE TRANSITIONS


    Emergence is generally understood as a property of a system not predictable from
    the properties of individual system components. Emergent structures occur in nature,
    e.g., the shapes of hurricanes are emergent structures. The growth of crystals
    can lead to emerging structures, or the random motion of water molecules can give
    rise to complex orderly structures.


    The number of interactions between the components of a system increases exponentially
    with the number of system components, and implicitly creates the conditions for
    subtle types of behavior, including emergence. Emergence is often a product of
    particular patterns of interaction, e.g., positive feedback allows local variations
    to grow into global patterns. Emergence may be related to dual-phase evolutions;
    during the first phase, patterns form or grow, and during the second phase, these
    patterns are either refined, or removed.


    Goldstein defined emergence as: "the arising of novel and coherent structures,
    patterns, and properties during the process of self-organization in complex systems."
    He identified several characteristics of emergence [96]:'
