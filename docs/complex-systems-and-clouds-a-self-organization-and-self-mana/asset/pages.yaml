    # 4.4 HIERARCHICAL ORGANIZATION: WAREHOUSE-SCALE COMPUTERS


    Cloud computing had an impact on the architecture of large-scale systems. The
    Warehouse-Scale Computers [27, 110] form the backbone of the cloud infrastructure
    of Google, Amazon, and other CSPs. WSCs are hierarchically organized systems with
    50,000–100,000 processors capable of exploiting request-level and data-level parallelism.


    Request-level parallelism is typical for transaction-oriented systems designed
    to support a very large user population, as well as requests of million transactions
    per second. Many interactive cloud applications such as email and a wide range
    of mobile applications, are based on the SaaS delivery model. Transactions are
    a form of request-response communication where a client generates the request,
    the request travels to the cloud, the cloud responds, and the response travels
    back to the client. Data-level parallelism is exploited by another class of cloud
    applications. Data analytics and other batch applications based on the IaaS and
    PaaS delivery models process large volumes of data. The data is partitioned in
    blocks which are then processed in parallel, see, for example, the Map-Reduce
    service [161] is supported by AWS and others. The ability to effectively process
    both interactive and batch applications is critical for the cloud infrastructure.


    At the heart of a WSC is a hierarchy of networks which connect the system components,
