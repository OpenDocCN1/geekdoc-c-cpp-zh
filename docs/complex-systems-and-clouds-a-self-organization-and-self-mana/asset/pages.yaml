    # 4.10 AUCTIONS: CONCEPTS, RULES, AND ENVIRONMENTS


    An auction is a public sale where the goods or services are sold to the highest
    bidder. A combinatorial auction is one where a buyer requires simultaneous access
    to a package of goods or, as is the case discussed in this chapter, a package
    of services. The bidders could be individuals, groups of individuals, organizations,
    robots, sensors, or autonomous servers in a large-scale system.


    Auctions address fundamental questions in economics, the most important being
    who should get the goods offered and at what price. The environment where auctions
    are conducted and in particular, the size of the populations of sellers and buyers,
    the type and number of items auctioned, the private information shared among the
    participants, determine the type of auction and the rules of a particular auction.
    An auction is characterized by efficiency and the revenue it brings.


    Among the numerous applications of auctions are: the auctioning of airport takeoff
    and landing slots, spectrum licensing by the Federal Communication Commission
    (FCC), and industrial procurement. In Chapter 5 we discuss auctions involving
    two distinct set of bidders, cloud users bidding for services and cloud servers
    providing services.


    Auction theory has been one of the most intensely studied area of economics in
    the last half century. 1961 Vickrey used game theory to study the dynamics of
    auctions [227]; this seminal paper marks the beginning of the auction theory.In
    the private value model introduced in [227], each bidder has its own value for
    every package of goods and has no knowledge about the values of any other bidder;
    the individual values do not depend on the private information of other bidders.
    The paper shows that when each bidder pays the social opportunity cost of his
    winnings rather than his own bid, truthful bidding is a dominant strategy.


    > ³ickrey got the Nobel prize for economics in 1996 for his contributions to the
    theory of incentives under asymmetric information; he died 3 days after the prize
    was announced.'
