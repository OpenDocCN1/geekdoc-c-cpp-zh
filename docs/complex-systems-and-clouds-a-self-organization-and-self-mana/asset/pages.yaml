    #  3.10 CYBER-PHYSICAL SYSTEMS AND THEIR SELF-ORGANIZATION SAGA


    Complexity and self-organization have preoccupied the minds of the pioneers of
    computing, Turing [224] and von Neumann [235, 236]. The essence of self-organization
    is captured by Alan Turing’s observation “Global order can arise from local interactions”
    [224].


    Exploiting self-organization in the design and implementation of large-scale cyber-physical
    systems proves to be extremely challenging.


    Self-organization implies that all individual components of a system respond to
    local stimuli, that there is a division of labor among the components, and the
    entire system adapts to reach common goals efficiently [57]. This implies that
    goal(s) must be defined; there are stimuli/inputs, and the system produces some
    output. Each component has an internal state and this state changes as a function
    of the input and of information about the states of other components. All units
    contribute to achieving the system’s goal, no subset of units can achieve the
    goal, only the entire system as a whole. Last, but not least, the system adapts
    and in time it achieves its goals more efficiently.


    The design of all computing and communication systems aim to ensure robustness
    and graceful performance degradation when components fail. For example, routing
    in packet-switched networks is designed to maintain connectivity when communication
    links and switches fail.'
