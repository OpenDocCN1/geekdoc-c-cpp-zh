  md: 'formation of larger entities, patterns, and regularities through interactions
    among smaller and/or simpler entities themselves do not exhibit such properties.
    Emergence has been discussed since the time of Aristotle. Aldous Huxley observed
    [123]: “now and again there is a rapid passage to a totally new and more comprehensive
    type of order or organization, with quite new emergent properties, and involving
    quite new methods of further evolution.”


    Emergent behavior is increasingly harder to predict as the number of system components
    and the complexity of interactions among increase. Emergence is often associated
    with positive feedback. Positive feedback amplifies changes in the behavior of
    individual components and favors the formation of new patterns of behavior. On
    the other hand, negative feedback tends to stabilize the system behavior and makes
    emergence less likely.


    In 1948, Warren Weaver observed that there was a conceptual distinction between
    organized and disorganized complexity [246]. Correlated relations between the
    parts and the entire system can manifest properties that cannot be inferred from
    the study of the individual parts, are at the core of organized complexity. On
    the other hand, disorganized complexity is characteristic of systems and phenomena
    when the number of variables is very large and the variables have an erratic or
    unknown behavior. In spite of the behavior of the individual variables, the system
    as a whole possesses certain orderly and analyzable average properties.


    The properties of an entire system characterized by disorganized complexity can
    be understood by using probability and statistical methods. The study of disorganized
    complexity was triggered at the beginning of the 20th century by life sciences,
    including biology, and now has applications in many fields. For example, a life
    insurance company does not have any knowledge of how long a particular individual
    will live, it has dependable knowledge of the average lifetime of individuals.


    Complexity can be measured by the total number of properties of an object or phenomenon
    detected by an observer. Complexity can also be associated with the probability
    of a state vector of a physical system. In network theory, complexity reflects
    the connectivity among the nodes. In software engineering, complexity measures
    the interactions between system components. Several measures of complexity are
    discussed in [173].'
