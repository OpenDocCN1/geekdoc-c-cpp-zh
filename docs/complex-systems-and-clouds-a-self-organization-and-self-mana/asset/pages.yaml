  md: '# CHAPTER 1

    Complex Systems


    Informally, we say that a system or a phenomenon is complex if its behavior cannot
    be easily described or understood [121]. Biological systems shaped by evolution,
    physical phenomena such as turbulence, the mixture of biology and social components
    involved in spreading of infectious diseases, and man-made systems such as the
    Large Hadron Collider (LHC) exhibit elements of complexity.


    Complex systems are difficult to model, thus it is difficult to study them and
    understand the laws governing their evolution. A complex system is characterized
    by intricate interactions among its components and the emergence of novel properties
    that cannot be inferred from the study of the individual system components. The
    behavior of a complex system is subject to statistical laws which affect the individual
    system components, as well as the interactions among them.


    We review philosophical concepts related to the nature and scope of knowledge,
    and the defining attributes of complexity, including nondeterminism, self-similarity,
    emergence, nonlinearity, and phase transitions. We analyze the interactions of
    a complex system with the environment. In this chapter, we discuss fractal geometry,
    Power Law distributions, self-organized criticality, and quantitative characterization
    of complexity. We conclude with a discussion of the interdisciplinary nature of
    complexity studies.


