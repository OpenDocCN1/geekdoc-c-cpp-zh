    # 5.2 A CASE STUDY: TENSOR NETWORK CONTRACTION ON AWS


    To illustrate the problems posed by Big Data, we discuss an application in the
    area of condensed physics and analyze options offered by 2016 vintage M4 and C4
    to be the best choices for applications such as TNC.


    **Tensor contraction.** In linear algebra the rank $\mathcal{R}$ of an object
    is given by the number of indices to describe its elements. A scalar has rank
    0, a vector $a = (a_1, a_2, \dots, a_n)$ has rank 1 and $n$ elements, a matrix
    $\mathcal{A} = [a_{ij}]$, $1 \le i \le j$ has rank 2 and $n \times m$ elements


    ```

    $$\mathcal{A} = \begin{pmatrix} a_{11} & a_{12} & \dots & a_{1m} \ a_{21} & a_{22}
    & \dots & a_{2m} \ \vdots & \vdots & \ddots & \vdots \ a_{n1} & a_{n2} & \dots
    & a_{nm} \end{pmatrix} \quad (5.1)$

    ```


    Tensors have rank $\mathcal{R} \ge 3$; the description of tensor elements is harder.
    For example, consider a rank 3 tensor $\mathcal{B} = [b_{ijk}]$ with elements
    $b_{ijk} \in \mathbb{R}^{2\times2\times2}$. The eight elements of this tensor
    are $\{b_{111}, b_{112}, b_{121}, b_{122}\}$ and $\{b_{211}, b_{212}, b_{221},
    b_{222}\}$. We can visualize the tensor elements as the vertices of a cube where
    the first group of elements are in the plane $j=1$ and $j=2$, respectively. Similarly,
    the tensor $\{b_{111}, b_{211}, b_{112}, b_{212}\}$ and $\{b_{121}, b_{221}, b_{122},
    b_{222}\}$ are in the planes $k=1$ and $k=2$, respectively, while $\{b_{111},
    b_{121}, b_{211}, b_{221}\}$ and $\{b_{112}, b_{122}, b_{212}, b_{222}\}$ are
    in the planes $l=1$ and $l=2$, respectively.'
