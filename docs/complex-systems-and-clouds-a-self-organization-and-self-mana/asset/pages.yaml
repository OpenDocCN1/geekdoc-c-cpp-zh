    Avalanche phenomena occur in a packet-switched networks without congestion control
    mechanisms. When the network load increases, routers with limited buffer start
    dropping packets, the senders do not receive acknowledgments, time out, and resend
    packets, and eventually the network ceases to transport packets. Similar phenomena
    could occur in computer systems when processor scheduling algorithms fail to detect
    thrashing and take adequate measures. For example, memory-intensive processes
    could generate a large rate of page faults and cause frequent context switching,
    preventing processes or threads from making progress.


    Minor faults could trigger an unforeseen and undesirable chain of events and cause
    a complex system, such as the cloud infrastructure of a Cloud Provider (CSP) to
    collapse. Such a sequence of events led to the failure of Amazon Web Services
    (AWS) on June 30, 2012 at 11:21 PM, when a severe thunderstorm caused the North
    Virginia site to go down. Several companies, including Netflix, Instagram, and
    Pinterest, as well as a large number of individual AWS users, were affected by
    this outage.


    Avalanche becomes a serious threat to large concentrations of resources contributing
    to the critical infrastructure of the society. The financial crisis of 2007–2008
    threatened the collapse of large financial institutions. The “too big to fail”
    theory asserting that the failure of large financial institutions would be catastrophic
    was then used to justify the intervention of the government. Mechanisms for early
    detection of such phenomena should be included in the initial design of such systems
    to ensure graceful degradation, rather than total collapse.


