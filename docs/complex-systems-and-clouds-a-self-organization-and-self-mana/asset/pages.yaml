    # 2.2 EPIDEMIC ALGORITHMS


    Epidemic algorithms provide effective ways to spread information in largescale
    systems when individual systems/nodes have only limited knowledge of the network
    topology and the capabilities of other nodes. Epidemic algorithms mimic the process
    of spreading an infectious disease in nature. Such algorithms are easy to implement
    and guarantee information delivery in heterogeneous environments. The Game of
    Life is one of the most popular examples of epidemic algorithms.


    An epidemic algorithm requires that each member of a population of size n to be
    in one of the following states at time t:


    > Susceptible—the individual is susceptible to some stimulus; a living organism
    can be infected; a node can get information from its neighbors in a distributed
    system;

    Infective—the individual has been infected and is capable of spreading the infection;
    it has some information and it will spread it to neighbors, in a distributed system;

    Recovered/Removed—the individual is immune to infection and does not spread it;
    in a distributed system, the node knows the information and does not transmit
    it to its neighbors.


    Several classes of epidemic algorithms are known: Susceptible-Infective (S1),
    Susceptible-Infective-Susceptible (SIS), and Susceptible-Infective-Removed (SIR).
    We shall now use only the language of infectious disease-spreading, the translation
    to information dissemination is straightforward.'
