    The slots are randomly chosen when the client is the provisional winner. The evaluation
    process consists of the following steps:


    +   1. *Initialization.*

    2. *Preliminary rounds.* Carry out $\gamma$ preliminary rounds with $\gamma =
    \max_k \gamma_k$.

    * Auction $\kappa_1$ slots of service $S_1$, $\kappa_2$ slots of service $S_2$,
    and so on, in the first preliminary round.

    * Identify the first slot of each run and the reservation request that best matches
    the offer.

    * Identify the provisional winners if such matches exist and remove the corresponding
    runs from the set of available runs. A match exists if the run consists of the
    same number of slots or one slot is longer than requested and if the capacity
    offered is at least the one required by the reservation request. For services
    without a match, remove the last slot, add both the shorter run and the last slot
    to the list of available runs.

    * Continue this process until only single slots are available.'
