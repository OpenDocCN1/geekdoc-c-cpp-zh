    Processor sharing is now controlled by a new layer of software, the *Virtual Machine
    Monitor* (VMM), also called a *hypervisor*. It is often argued that a VMM is a
    more compact software with only a few hundred thousand lines of code versus the
    million lines of code of a typical OS, thus it is less likely to be faulty. Unfortunately,
    though the footprint of the VMM is small, the server must run a management OS.
    For example, *Xen*, the VMM used by AWS and others, starts *Dom0*, a privileged
