  md: "Managing Complexity of Large-Scale Cyber-Physical Systems 85\n\n**Clustering.**\
    \ The clustering coefficient quantifies the tendency of the nodes of a complex\
    \ graph to cluster together. This tendency is exemplified by social networks where\
    \ friends are present. If the $k_i$ neighbors of node $n_i$ are part of the cluster\
    \ there would be $N_i = k_i(k_i-1)/2$ edges between them. The clustering coefficient\
    \ of node $i$ is\n\n```\n$$C_i = \\frac{E_i}{N_i} = \\frac{2E_i}{k_i(k_i-1)} \\\
    quad (3.7)$\n```\n\nWith $E_i$ the actual number of edges between these $k_i$\
    \ nodes. For example, the clustering coefficient $C$ of a small-world network\
    \ depends on the value of $\beta$:\n\n```\n$$C(0) = \\frac{3(K-2)}{4(K-1)}, \\\
    quad C(1) = \\frac{K}{N} \\quad C \\rightarrow C(1) \\quad \\text{when} \\beta\
    \ \\rightarrow 1. \\quad (3.8)$\n```\n\n**Empirical data confirm the existence\
