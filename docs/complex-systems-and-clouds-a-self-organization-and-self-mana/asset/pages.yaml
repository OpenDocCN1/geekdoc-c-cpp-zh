    # 5.3 SERVER COALITIONS, COMBINATORIAL AUCTIONS, AND BIG DATA


    A main advantage of computer clouds is that their infrastructure benefits from
    the latest hardware and software technologies. We have seen in Section 5.1 that
    cloud servers use the most powerful processors with large caches and ample main
    memories and run sophisticated software capable of masking hardware failures.
    It is thus, the time to analyze CRM policies can be adapted to the needs of high-impact
    applications. In this section we start our discussion of alternative CRM policies
    and their potential effect on Big Data applications in computational science and
    engineering.


    Many existing and future cloud applications are likely to need computing cycles,
    main memory, disk space, and other resources well beyond provided by a single
    server thus, the need for assembling coalitions of servers offering sufficient
    resources for data-intensive applications. At this time, Cloud Service Providers
    (CSPs) support a limit of instances with a different number of vCPUs that may,
    or may not, match application needs.


    Market mechanisms, and future feedback as coalition formation and combinatorial
    auctions can be very effective for the implementation of CRM policies for data-intensive
    applications. The case study presented in Section 5.2 is a perfect illustration
    of the need for alternative CRM of Big Data applications. The reservation system
    discussed in this chapter addresses the challenges posed by such applications.
    A reservation system based on coalitions of servers supply the resources demanded
    by the applications and combinatorial auctions deliver packages of coalitions,
    one coalition for each phase of the application workflow.


    Two strategies for coalition formation are presented next. The first strategy,
    History-Based (HB) uses feedback and learning from past behavior, as shown in
    Fig. 5.5. HB exploits information from past auctions to determine the size of
    the coalitions formed in each rack. Then the coalitions selected based on historic
    data compete to satisfy the current user needs for service. It'
