  md: '# 5.8 HISTORY-BASED VERSUS JUST-IN-TIME COALITIONS


    The results of a simulation experiment comparing the two strategies for coalition
    formation, HB and JST are reported in [164] and in [253] and reviewed in this
    section. The simulation is based on a simple model when a service request specifies
    the type of service, the duration, and service intensity increased as the number
    of vCPUs. For each service type, only racks offering service coalitions, provided
    that the autonomous servers in the rack have sufficient capacity.


    **The system model.** In the HB strategy, described in Section 5.3, a rack leader
    uses historic information about past successful coalitions in a window of w auctions
    to suggest the size of the coalitions that the servers in the rack join, provided
    that their available capacity allows participation in a coalition. Once the coalitions
    are formed, all racks of a WSC independently bid for services requested in allocation
    slot. An auction takes place and the racks hosting successful coalitions are informed.
    This information is passed to the servers and the service starts.


    In the JST strategy, service requests are dispatched to a WSC where they are analyzed
    to determine the service type and the desired coalition size for each. This information
    is broadcast to the racks of the WSC where an attempt is made to dynamically create
    appropriate coalitions. Rack leaders initiate the coalition formation process,
    and finally, the information about newly formed coalitions is passed to the combinatorial
    auction system. The algorithm for JST coalition formation is similar to the one
    for the HB strategy. The only difference is that the coalition sizes are now the
    ones demanded by the service request rather than those determined by past activity.


    **The combinatorial auction protocol.** The protocol is based on the clock algorithm
    discussed in Section 5.5. The auctioneer announces prices and the bidders iterate
    the quantities they want to buy at the current price. Then the auctioneer adjusts
    the prices based on the current demand. In our simulation, after coalition formation,
    coalitions starting based on the service request and the auctioneer analyzes these
    bids and prioritizes them based on the prices offered.


    Several criteria drive the decisions of the auctioneer when selecting the coalitions
    required by the work-flow. These decisions are based on the price discovered during
    the clock phase. The implementation of the auction is based on a hierarchical
    decision making process.'
