    produced by a net force $f$ is directly proportional to the magnitude of the force,
    and inversely proportional to the mass $m$ of the object. The ideal gas law, the
    equation of state of a hypothetical ideal gas is expressed as $pV = nRT$ where
    $p$ is the pressure, $V$ is the volume, $n$ is the amount (in moles), $R$ is the
    gas constant, and $T$ is the temperature of the gas; this law is a good approximation
    of the behavior of many gases under many conditions. The thermodynamic energy,
    $S$ is given by the equation $S = k_B\Omega$ with $k_B$ the Bolman''s constant
    and $\Omega$ the number of microstates of the system.


