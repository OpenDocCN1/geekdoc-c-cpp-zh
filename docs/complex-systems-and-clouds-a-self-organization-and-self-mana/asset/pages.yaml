- img_proc: true
  md: 'The infrastructure of cloud data centers is hierarchically structured and the
    communication latency among the servers in a rack is lower and the bandwidth is
    larger than communication with servers in another rack. The coalition formation
    should ensure spatial locality to minimize the communication overhead among the
    members of a coalition; it is therefore desirable to form coalitions among the
    tens of servers in the same rack of a WSC.


    A rack consists of $N$ powerful multicore servers capable of providing computing
    cycles, as well as primary and secondary memory for virtually all Big Data applications.
    A rack is homogeneous as all servers have identical configurations. This realistic
    assumption simplifies considerably the complexity of the search for an optimal
    coalition structure as the servers are indistinguishable from one another.


    **Coalition lifetime and payoff distribution.** In the applications discussed
    in the literature, coalitions have a rather long lifetime and coalition stability
    is of primary concern. It is not the case for the HB coalitions. The cloud model
    assumes slotted time and auctions at the beginning of each allocation slot. The
    coalitions have a short-lifetime; a coalition participates at an auction and,
    if successful, the coalition persists for the duration of the contract.


    If a coalition is not successful during the auction organized in the current slot,
    the members are free to act alone. Some members of an unsuccessful coalition may
    decide to offer their services for the current slot on the spot market, others
    may decide to stay idle for the current time slot and join a new coalition in
    the next allocation slot. Joining a coalition is not a long-term commitment, it
    is for a short time, and it is an ad hoc process.


    The value of a coalition also reflects the length of time the coalition was active
    in response to a successful auction. The value attributed to a coalition of $n$
    servers is distributed equally among the members of the coalition. The value of
    a package of several coalitions auctioned successfully is divided among the coalitions
    based on the resource supplied by each one of them.


    **An algorithm for rack-level coalition formation.** The $S$ servers in a rack
    have a unique $Sld$ and are organized in a logical ring, $Sld^{i-1}$ and $Sld^{i+1}$
    are the predecessor and, respectively, the successor of $Sld^i$; $Sld^s$ and $Sld^2$
    are the predecessor and, respectively, the successor of $Sld^1$.'
