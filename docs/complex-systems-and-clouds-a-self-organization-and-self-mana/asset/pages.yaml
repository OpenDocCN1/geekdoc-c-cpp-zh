    Several MAC-layer protocols for hoc networks avoid, or reduce collisions. A nonexhaustive
    list of such protocols includes: Medium Access Collision Avoidance (MACA) which
    uses Request to Transmit and Clear to Transmit (RTS/CTS) messages to avoid the
    hidden node problem [128]; Power Aware Multi Access protocol with Signaling for
    Ad Hoc Networks (PAMAS) uses one channel for control packets and one channel for
    data packets; Carrier Sense Medium Access with Collision Avoidance (CSMA/CA).


    The SMACS (Self-organizing Medium Access Control for Sensor Networks) protocol
    [215] uses a TDMA-like frame with FDMA to avoid interference among nodes. The
    organized channel access method used by SMACS and SFSN protocols can be traced
    back to several papers [23, 91] which propose to form a hierarchical structure
    to localize groups of nodes and make the channel assignment easier.


    Several other TDMA-based protocols for sensor networks have been proposed, including
    WLC12-5 [188]. Sensor MAC (S-MAC) is a protocol inspired by PAMAS and implemented
    over Berkeley Motes [252]. The nodes listen and sleep periodically; the radio
    is set to sleep during transmissions of other nodes. Neighboring nodes form virtual
    clusters to auto-synchronize on sleep schedules. The protocol divides long messages
    into small segments and transmits all segments back to back; it uses RTS/CTS once
    per message but ACK for each segment. The energy savings are 2.5 times larger
    than IEEE 802.11.


    To increase the algorithm efficiency, the number of collisions experienced by
    a sensor should be minimized and a sensor should be idle as long as feasible.
    Thus, it is highly desirable to integrate the MAC protocol/algorithm with the
    algorithm for self-organization which determines the schedule for communication.
    This requirement precludes the use of one of the existing MAC algorithms; we decided
    to adapt a known CRA and integrate it with our self-organization scheme.


