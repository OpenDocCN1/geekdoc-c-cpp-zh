    $[A_1][\{x_1,x_2,x_5\], [A_2][\{x_2,x_3,x_4\}], [A_3][\{x_3,x_4,x_6\}], and $[A_4][\{x_5,x_6,x_7\}].
    \quad (5.7)$

    ```


    The “big” tensor $A$ is the product of the four “small” tensors


