    ```


    The entropy is a measure of the uncertainty of a single random variable $X$ before
    it is observed, or the average uncertainty removed by removing it [60]. This quantity
    is called entropy due to its similarity to the thermodynamic entropy. The Shannon
    entropy of a random variable $X$ with a probability density function $p_X(x)$
    is


    ```

    $H(X) = -\sum x p_X(x) \log p_X(x). \quad (1.21)$

    ```


    The entropy of a random variable is a positive number. Indeed, the $p_X(x)$ is
    a positive real number between 0 and 1, $\log p_X(x) \le 0$ and $H(X) \ge 0$.
    Let $X$ be a binary random variable and $p = p_X(x=1)$ be the probability that
    the $X$ takes the value 1; the entropy of $X$ is


    ```

    $H(p) = -p \log p - (1-p) \log(1-p). \quad (1.22)$

    ```


    If the logarithm is in base 2, the binary entropy is measured in bits. The entropy
    has a maximum of one when $p=1/2$, and goes to zero when $p=0$ or $p=1$; intuitively,
    we expect the entropy to be zero when the outcome is certain, and reach its maximum
    when both outcomes are equally possible.


    Shannon channel coding theorem establishes the limits to possible data compression
    and gives an operational meaning of the Shannon entropy.


    There is a relationship between thermodynamics and Shannon entropy. When the $N$
    molecules of the system are grouped together in $m$ micro-states depending on
    their energy, the number of bits required to label the individual micro-states
    is


    ```

    $Q = H(p_1, p_2, \dots, p_m), \quad (1.23)$

    ```


    With $H(p_1, p_2, \dots, p_m)$ the Shannon entropy of a system with $m$ states.
    If $n_i$ is number of molecules in state $i$ then $p_i = n_i/N$ is the probability
    of the system being in state $i$.


    The $von Neumann$ entropy of a quantum system with the density matrix $\rho$,


    ```

    $S(\rho) = -tr[\rho \log \rho] \quad (1.24)$

    ```


    is equal to the Shannon entropy if the system is prepared in a *maximally mixed
    state*, a superposition state where all pure states are equally likely.'
