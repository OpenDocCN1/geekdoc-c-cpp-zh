  md: '**Limitations and vulnerabilities.** The protocol may the fairly complex and
    has at least one vulnerability. A bidder may be the provisional winner of services
    in slots not included in its winning package; such services will remain unassigned
    during the current auction. A solution is to penalize excess bidding activity
    and charge the bidder a percentage of the costs for these services. Another alternative
    is to include in a request a set of “substitute services” for a service $S_i$.
    Then, during the last round of the proxy phase, the auctioneer could try to match
    services having provisional winners with unsatisfied requests for services.


    The capacity offered, but not auctioned, in each slot is available for spot allocation,
    it has the potential to be used, rather than being wasted. The capacity of a coalition
    left uncommitted at the end of the auction $A^i$ for $AS^i_1$, the first slot
    of the auction (see Fig. 5.8), is then available for spot allocation at a price
    equal to $p_{k,t}$, while the free capacity in slots starting with $AS^i_j$ can
    be offered at the next auction if this capacity takes place before the beginning
    of the slot. This capacity is measured by the spot allocation index.


    # 5.6 EVALUATION OF CLOUD POLICIES AND MECHANISMS


    The question we address now is how to experiment with new cloud policies and mechanisms
    implementing these policies. Experimentation with a realistic cloud infrastructure
    is not feasible as systems cannot be shut down, reconfigured, and their behavior
    and performance under new policies cannot be thoroughly investigated. Analytical
    studies are unrealistic due to the scale and the complexity of the system.


    It is tempting to conduct experiments on a testbed system, but there is no guarantee,
    in fact it is unlikely, the results will hold for a large-scale system. New phenomena
    and different system behavior is expected when a system scales up, as we have
    seen in Chapters 1 and 3. As pointed out in [27] “...the WSCs are a new class
    of large-scale machines driven by new and rapidly evolving sets of workloads.
    The size alone makes them difficult to experiment with, or to simulate effectively...”


    One expects to learn useful lessons from the successful methodology used for the
    development of other complex, man-made systems designed to perform under different
    operating conditions. This is the case of modern microprocessors, aircraft, or
    space exploration systems. In all these cases'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Cloud Self-Organization and Big Data Applications 175


    a new system is designed sometimes from scratch, based on the lessons learned
    from past developments and after a thorough analysis of the individual system
    components and their ability to work together.


    For example, the development of a new processor with billion gates goes through
    a rigorous process. This process starts with the development of detailed performance,
    power consumption, and reliability models. The next step is to experiment with
    the model. Simulators such as Simple Scalar (http://www.simplescalar.com/) and
    timing analysis tools have been widely used by the industry and research groups
    for years. Benchmarks (https://www.spec.org/benchmarks.html) used as input to
    the simulator allow us to predict the performance for different workloads.


    Applying these ideas to computer clouds is from trivial. We can model in great
    detail the operation of an individual server, the interactions among the set of
    servers is what gives the cloud infrastructure its flexibility and power and require
    an analysis of the system as a whole. Moreover, a model useful for understanding
    the effect of new CRM policies is even more complex because the model should also
    describe the interactions of the infrastructure with an environment consisting
    of a large population of users, rather than describing the infrastructure in isolation.
    Unfortunately, detailed models of a cloud environment are yet to be developed.


    It is extremely challenging to capture the dynamic interaction of individual servers
    in a model, then test several policies and mechanisms under different workloads.
    It is also not helpful that the organization of the infrastructure of existing
    systems, and the internal mechanisms for resource management are rather opaque.
    The CSPs are reluctant to disclose the inner working of their infrastructure,
    thus, it is not feasible to compare new policies and mechanisms with existing
    ones. This hinders not the investigation of alternative CRM policies, but also
    standardization and efforts for supporting cloud interoperability.


    A realistic alternative is to develop high-level (rather than detailed) models
    of the cloud infrastructure, conduct simulation experiments using these models,
    and draw qualitative conclusions from the simulation results. Such models must
    be carefully crafted and avoid details that unnecessarily complicate the simulation,
    or make it infeasible. The goal should be to identify trends and determine the
    effect of different model parameters to gain insights based on a qualitative,
    rather than a quantitative analysis of the simulation results.'
  merge: -1
