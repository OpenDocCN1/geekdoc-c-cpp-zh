    # 1.5 POWER LAW DISTRIBUTIONS: ZIPF’S LAW


    There are many instances of phenomena where large events are rare, but small ones
    are quite common and there is no typical size of the events. For example, according
    to the Gutenberg-Richter Law, there are few large earthquakes, but many small
    ones. For ten earthquakes of magnitude 6 on the Richter scale there are 100 of
    magnitude 5, and some 1000 of magnitude 4. We cannot talk about a typical earthquake
    magnitude! The population rankings of cities in various countries follow the same
    rules, are there few with a large population and many small ones. Talking about
    a typical population size of a city makes no sense, either.


    Mandelbrot counted the number of months with a given cotton price variation and
    observed that the price variations are scale-free, meaning there is no typical
    size of the variations. When looking at the coastal map of Norway, one wonders
    “how long is a typical fjord?” There is no answer to this question; the map shows
    a hierarchical structure of fjords, with fjords within fjords, and fjords within
    fjords within fjords. The phenomenon of fjord creation is scale-free.


    In 1949, George Kingsley Zipf, a professor of statistics at Harvard University,
    observed that the log-log plot of rank frequency of many phenomena with slope
    near unity and formulated the Zipf’s Law [22]. Zipf counted the frequency of words
    in James Joyce’s Ulysses and in a collection of newspapers. He plotted the frequency
    of the English words versus their rank and “said” that the frequency of occurrence
    of the words “the,” “I,” and “say” ranked 1, 10, and 100 was 9%, 1%, and 0.1%,
    respectively. Zipf’s Law predicts that given $N$ elements, the frequency of elements
    of rank $k$, $f(k; \gamma, N)$, is


    ```

    f(k; \gamma, N) = \frac{k^{-\gamma}}{\sum_{i=1}^{N} i^{-\gamma}}

    ```'
