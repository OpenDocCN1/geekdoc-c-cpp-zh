    **Effectiveness metrics.** The effectiveness of the protocol is captured by several
    metrics:


    +   1. The customer satisfaction index—percentage of reservation requests fully
    or partially satisfied in each allocation slot.

    2. The service mismatch index—percentage of services requested but not offered
    in each allocation slot.

    3. The service success index—percentage of services successfully auctioned.

    4. The capacity allocation index—percentage of the capacity offered but not auctioned
    in each allocation slot.

    5. The overbilling factor—percentage of slots with a provisional winner that have
    not been included in any package.

    6. The temporal fragmentation index—percentage of services successfully auctioned
    in nonconsecutive slots given all services successfully auctioned.

    7. The additional profit index—percentage of additional profit of coalitions involved
    in the auction, the difference of the actual price obtained at the auction and
    the price demanded by the coalition relative to the price demanded by the coalition.'
