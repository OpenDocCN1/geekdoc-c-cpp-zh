  md: 'Open systems are analyzed in [132]. The author stresses that open systems evolve
    as cycles of events and have several defining properties:


    +   - they import energy from the environment;

    - they transform the resources available to them;

    - they export some resources to the environment;

    - they generate entropy;

    - they have a negative feedback loop to maintain a steady-state;

    - they dynamically achieve homeostasis;

    - they strive to achieve differentiation and specialization;

    - they include mechanisms for integration and coordination; and

    - they enjoy equifinality.


    Homeostasis describes the successful survival of an organism, and equifinality
    means a given end state can be reached by many potential means [36].


    Open systems are classified in several categories in the order of their complexity
    [40]:


    +   1. systems comprising static structures, e.g., crystals;

    2. simple dynamic systems with predetermined motions, e.g., clocks or the solar
    system;

    3. systems capable of self-regulation with an externally prescribed target, the
    cybernetic systems, e.g., a thermostat;

    4. systems capable of self-maintenance through exchange of resources with the
    environment, e.g., a cell;

    5. blueprint-growth systems, e.g., systems reproducing through seeds and eggs;

    6. systems with a detailed awareness of their environment, e.g., animals;

    7. self-consciousness systems, e.g., humans;

    8. social systems groups sharing a common order and culture; and

    9. transcendental systems—“absolutes and inescapable unknowns.”


    The concept of open systems has many applications, not only in natural sciences,
    but also in social sciences and economics. In computing, an open system supports
    a combination of interoperability, portability, and open software standards. The
    idea of open computer systems, initially referred to systems based on Unix, in
    contrast to the proprietary systems of vendors such as IBM, HP, or Microsoft.'
