  md: '# Complex Systems and Clouds


    Zipf’s Law holds if the number of occurrences of each element are independent
    and identically distributed random variables with Power Law distribution $p(f)
    = \alpha f^{-1/\gamma}$. The simplest case of Zipf’s Law states that the size
    of the $k$th largest occurrence is event inversely proportional to its rank


    ```

    $f(k) \approx k^{-\gamma}, \quad \text{with} \quad \gamma \approx 1. \qquad (1.4)$

    ```


    It follows immediately that


    ```

    $log f(k) \approx -\gamma \log k, \qquad (1.5)$

    ```


    thus the exponent $\gamma$ is the slope of the straight line (Fig. 1.3A).


    ![](img/527756a25ef2ac53ecf8852fd8f955ff_20_0.png)


    Fig. 1.3 (A) Zipf’s Law: log-log plot of rank frequency; the size number of avalanches
