    # 2.1 CELLULAR AUTOMATA


    Cellular automata are spatially and temporally finite-state discrete computational
    systems composed of a finite set of cells evolving in parallel at discrete time
    steps. Cellular automata are abstract structures that can be used as general models
    of complexity. They can also be used for the study of nonlinear dynamics.


    Cellular automata are inspired by self-reproducing/self-replicating organisms.
    Under favorable circumstances, viruses and bacteriophage particles, which infect
    and replicate within a bacteria, can reproduce themselves. The same principle
    applies to the multiplication of nucleic acid complexes in chromosomes. Knowing
    that self-reproducing properties of nucleic acid depend on its highly complex
    structure, we should expect that a man-made, self-replicating, system should be
    more complex. Replication allows not only the division of the cell, but also the
    growth and repair of a complete organism.


    Cellular automata can be specified in mathematical terms and can be implemented
    in physical structures. Only local interactions can be modeled with cellular automata;
    the state of a cell is updated by taking into account the states of the cells
    in its neighborhood. Cellular automata can compute functions and solve algorithmic
    problems and, with suitable rules, can emulate a universal Turing machine.


    The idea of cellular automata is credited to Stan Ulam and John Neumann, who collaborated
    during their work on Project Manhattan at Los Alamos. Ulam was studying crystal
    growth and von Neumann was interested in self-replicating systems. John von Neumann,
    one of the greatest minds of the 20th century, introduced in the early 1940s the
    von Neumann'
