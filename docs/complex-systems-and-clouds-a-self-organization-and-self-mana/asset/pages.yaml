- img_proc: true
  md: 'racks, and the number of cells; (ii) a hardware description file containing
    detailed data about the architecture and the configuration of each server. The
    interconnection network must also be described by the hardware configuration file;
    it typically consists of a hierarchy of Gigabit Ethernet (GE) networks and rack
    and cell switches, and border routers.


    The scale of the simulated system is limited, as the simulation environment must
    keep track of the state of all servers and of the interconnection network. While
    it may be feasible to simulate a system with 50,000–100,000 servers, the simulation
    of a cloud with 10^8 servers seems unrealistic at this time. One of the most difficult
    tasks is to simulate communication among the servers within the rack, among the
    racks of a cell, and among the cells of a WSC.


    The trace data generated on the testbed system is used as input to multiple simulated
    instances, to create realistic workload. The volume of trace data collected for
    realistic applications running over extended periods of time is likely to be the
    order of terabytes, or possibly petabytes, thus, such simulations can only be
    carried on the most powerful instances available from AWS. If the architecture
    and the configuration of servers used to collect trace data is identical with
    that of simulated servers, then the simulated execution of an application simply
    advances the simulated time based on the events in the trace file.


    The simulation is data-intensive and can be distributed over a set of instances,
    each simulating a cell with tens of racks and thousands of servers. The simulation
    of resource management is communication-intensive and challenging. The instances
    simulating different cells must communicate with the simulated admission control
    system running on a separate instance. This instance accepts simulated service
    requests and matches them with the bids provided by server coalitions. The simulated
    operation of the algorithm operating at server level should implement the algorithm
    discussed in Section 5.10.


    # 5.12 FINAL THOUGHTS ON SELF-ORGANIZATION AND SELF-MANAGEMENT


    Self-organization and self-management offer an appealing alternative to existing
    cloud resource management policies; they have the potential to significantly alter
    the cloud computing landscape. So far, pragmatic means for the adoption of self-organization
    principles for large-scale computing'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'and communication systems have eluded us. A main reason for this state of affairs
    is that self-management has to be coupled with some mechanisms for cooperation;
    these mechanisms should allow autonomous servers to act in concert towards global
    system goals. Cooperation means that individual systems have to partially surrender
    their autonomy. Striking a balance between autonomy and cooperation is a challenging
    task, it requires a fresh look at the mechanics of self-organization and the practical
    means to achieve it.


    Practical implementation of cloud self-organization is challenging for several
    reasons, including the absence of a technically suitable definition of self-organization,
    a definition that could hint to practical design principles for self-organizing
    systems and quantitative evaluation of the results. Computer clouds exhibit the
    essential aspects of complexity and controlling complex systems is inherently
    difficult.


    The investigation reported in this chapter started with a realistic model of the
    cloud infrastructure, the hierarchical organization reported in [27] which seems
    inherently tied to hierarchical control. First, the hierarchical control based
    on monitoring was compared with a market model in which the servers of a WSC place
    bids for service requests and found out that the latter is more effective than
    the hierarchical control [163].


    In the simple market model the servers act individually, rather than cooperating
    with each other, a fundamental aspect of self-organization. But cooperation is
    clearly needed because individual servers may not be able to supply the resources
    demanded by many data-intensive application. Thus, it was concluded that servers
    have to form coalitions to offer larger pools of resources. At the same time,
    it seemed obvious to us that complex applications with multiple phases would require
    packages of resources offered by different coalitions.


    Algorithms for coalition formation based on combinatorial auctions are at the
    heart of the cloud ecosystem discussed in this chapter. Auctions have been successfully
    used for resource management in the past. Auctions do not require a model of the
    system, while traditional resource management strategies do. The auction-based
    protocol is scalable, and the computations can be done efficiently, though the
    computational algorithms involved are often complex.


    We end now where we started, attempting to answer the question if self-organization
    and self-management are feasible in large-scale, cyber-physical systems. An important
    step is to accept that the systems cannot be examined'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'in isolation. The systems have to adapt to the environment and this can

    only be done by learning the patterns of events and interactions with the

    environment over a period of time. Fortunately, the rate of events generated

    by the environment is very high, the history of events and the responses

    to these events could be compressed. While initially the system may perform

    suboptimally, after days, weeks, maybe months, the system should be able

    to accumulate enough knowledge and avoid to be surprised by changes of

    the environment.


    To assess the quality of system responses, it is necessary to have a clear

    and easily implementable definition of utility. This is extremely challenging

    in most cases because the utility measures the impact of a system action

    on the global system state. Determining accurately the state of a large-scale

    system after each event is not feasible. The only solution is to periodically

    assess the system state and correlate the set of events and the system''s

    actions leading to that state with previous observations. A large database of

    events, actions, and system state can then be used by a reinforced learning

    alg to guide the future system behavior. The auction system discussed

    in this chapter avoids these hard problems as individual servers bid for

    services.'
