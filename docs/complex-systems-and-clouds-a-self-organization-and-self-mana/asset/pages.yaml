    Energy efficiency is a major concern for mobile devices as they have limited power
    reserves and are able to recharge only after extended periods of time [107, 109,
    252]. Communication among mobile nodes is more energy-intensive than either computing
    or sensing; the energy to transmit 1 kB of data at a distance of 100 m is equal
