  md: '# 5.10 SOFTWARE ORGANIZATION FOR A RESERVATION SYSTEM


    This system presents a software organization for a cloud reservation system for
    Big Data applications. The software implements the algorithms for the HB coalition
    formation and the combinatorial auctions introduced earlier in this chapter. The
    reservation system supports a primitive form of self-organization and self-management.
    Indeed, no monitoring is involved, the information about available resources flows
    from the bottom to the top, from the individual servers to the WSCs, where service
    requests are matched to a set of available coalitions.


    The software organization reflects the WSC organization presented in Section 4.4
    and illustrated in Fig. 4.4 and assumes that all servers in a rack have the same
    architecture and identical configuration, the servers in different racks may have
    a different architecture and configuration, while a WSC is a heterogeneous collection
    of different racks.


    | CRM—cloud resource management |

    |---|---|---|---||

    | CM Configuration management | RH Request handler | EM Event management | PM
    Power management |

    | Rack 1 | Rack 2 | Rack 500 | |

    | Server 1.1 | Server 1.40 | Server 2.1 | Server 2.40 | Server 500.1 | Server
    500.40 |

    | S&R | S&R | S&R | S&R | S&R | S&R |

    | Hard | Hard | Hard | Hard | Hard | Hard |


    > Fig. 5.16 The software organization for a reservation system using history-based
    coalition formation and combinatorial auctions. All servers in a rack run the
    S&R control system responsible for coalition formation. Global functions are provided
    by the CRM running on dedicated servers.


    The software for the reservation system includes the Server and Rack (S&R) control
    system and the CRM system (see Fig. 5.16). The S&R control system is responsible
    for coalition formation and resource management at the rack level.


    A rack leader manages the coalition formation process in each rack. The role of
    rack leader is passed from one server to the next to balance the load'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Complex Systems and Clouds


    and to ensure some degree of fault-tolerance. The rack leader may or not be included
    in any coalition. Selection of a rack leader can be done automatically to avoid
    a communication-intensive election process. For example, the server IDs are (1,
    2, ..., j, ..., S) then in slot $k$ the role of rack leader can be automatically
    assigned to the server with ID $j=k \pmod S$.


    The coalition formation process involves several steps:


    +   1. Ranking of coalitions most likely to succeed based on historic performance
    data;

    2. Assignment of available servers to coalitions according to their bids;

    3. Sharing information about successful coalitions after an auction.


    To reduce communication complexity, all servers maintain a list of successful
    coalitions in previous auctions. This list is ordered according to the revenues
    brought in by the coalitions with the same number of servers. The coalition with
    the largest number of servers is placed before the others in case of a tie. The
    list could be extended to include the most likely combinations of successful coalitions.


    For example, such a list could be $\mathcal{R} = \{6(75), 11(40), 8(43), \dots,
    2(97)\}$. Data gathered after previous auctions showed that coalitions of 6 servers
    from the rack were successful 75 times and brought the largest revenue, while
    coalitions of 1 server were successful 198 times and brought the least amount
    of revenue for the rack.


    At the beginning of a slot, the rack leader receives bids from the $N_a$ servers
    which are not members of an active coalition and chooses the coalition to compete
    for service packages in the current allocation slot. For example, if $N_a = 27$
    then this report reported by each leader is $\mathcal{C} = (6, 11, 8, 2)$. The
    rack leader reads the bids on the revenue reported by each leader and assigns
    the first 6 servers to the first coalition, then the next 11 servers to the second
    coalition and so on. Finally, after the auction, the leader broadcasts the information
    about successful coalitions, e.g., $\{6, 8\}$ and verifies that the leader for
    the next allocation slot is ready to carry out its duties.


    The CRM includes a large number of components including the Configuration Management
    System (CMS), the Request Handler System (RHS), the Event Management (EM) system,
    and the Power Management System (PMS). The CMS describes the organization of the
    entire infrastructure including the WSCs, the cells in each WSC, the racks in
    each cell, and the architecture and configuration of individual servers in each
    rack.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Cloud Self-Organization and Big Data Applications 201


    Racks with identical servers have an identical rack-description record. The CMS
    includes a network-configuration file with a detailed description of the interconnect
    fabric. The CMS also supports the Health Monitoring Center (HMC) tasked to provide
    data about the performance and state of all system components. Another component
    of the CMS is the System Administrator Access (SAA) system which supports privileged
    system access for system administrators.


    The Request Handler System has multiple functions, some supporting an application-centric
    environment, and others implementing the market-oriented mechanisms for resource
    allocation. Its main components are:


    +   1. Client Access Console (CAC),

    2. Intelligent Concierge (IC),

    3. Blueprint Interpreter (BPI),

    4. Admission Control System (ACS),

    5. Combinatorial Auction Management System (CAMS),

    6. Spot Allocation System (SAS),

    7. Task Management System (TMS),

    8. Workflow Management System (WMS),

    9. Error Recovery System (ERS), and

    10. Accounting System (AS).


    The Client Access Console supports a set of high-level services for cloud users.
    CAC allows users to create and manage an account, request services, list all active
    instances, monitor the execution of running instances, gather performance data
    for active instances, terminate an instance, report on storage utilization, and
    accounting data. The Intelligent Concierge aims to improve the user experience.
    The Intelligent Concierge collects history data, builds user profiles, suggests
    blueprints for different activities, supports workflow definition, profiles applications,
    and suggests alternatives for application optimization.


    The role of the Blueprint Interpreter is to parse a blueprint, a request for service
    expressed in a Service-oriented Description Language, and generate the internal
    format of a service request. The blueprint can specify a specific service, e.g.,
    MapReduce, or it can describe the characteristics of the application as CPU intensive,
    data intensive, memory intensive and let the system identify the type of instance
    suited for the application. The blueprint can also specify the workflow of the
    application and the package of services. The internal format includes the service
    description, the service duration, and the service intensity for each service
    in the package.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'The Admission Control System uses the internal format produced by BPI to create:
    (i) SRA—a list of service requests to participate in the auction organized at
    the beginning of the next allocation slot and (ii) SRSA—a list of service requests
    for spot allocation. The Combinatorial Auction Management System implements the
    combinatorial auction algorithm. CAMS gathers the bids from different coalitions
    and attempts to match them with the service requests in SRA. After an auction,
    the SAS invites bids for spot allocation from servers in unsuccessful coalitions
    and matches them to service requests in the SRSA.


    The Task Management starts an instance and supervises its execution. The Error
    Recovery System interacts with the TMS and restarts the instance, if the error
    is due to hardware failure, or activates the recovery procedure specified by the
    blueprint. The Accounting System records the resources used by all instances and
    generates accounting records for system users.


    The Event Management is a distributed event processing system. All system software
    components use the publish-subscribe paradigm to interact with the EM. Event logs
    are maintained by the EM and whenever compliance issues occur. Last, but not,
    the task of Power Management System is to minimize power consumption. This means
    to keep servers operating in an optimal mode as discussed in [186], turn servers
    to a sleep mode when the system load is low and wake them when the load increases.


    # 5.11 AN INTEGRATED STRATEGY FOR CLOUD SOFTWARE DEVELOPMENT


    Once a model of the system has been thoroughly analyzed, the next step is the
    development of system software. The software development is a complex process
    requiring multiple iterations; the insights gained after each iteration should
    lead to changes of system components and overall better system performance. Such
    insights can be only gained through the simulation of the system behavior, therefore,
    a first objective is to develop a simulation environment for investigating the
    behavior of a realistic system subject to realistic working conditions.


    The simulation software should implement as accurately as possible the algorithms
    and protocols for all system components and should allow the simulation of different
    system configurations. Another challenge is to'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'conduct simulation with a realistic workload. Initially, a synthetic workload
    can be used, but more realistic results can only be obtained using trace data
    gathered from runs on a small-scale system. Therefore, the second objective is
    to conduct experiments on a testbed system and collect trace data. At this stage,
    two difficult problems arise: first, ensuring that the testbed operates in a manner
    consistent with the system model; second, scaling up the simulation results.


    The implementation should progress from the model development, to high-level description
    of the software and then translation of the high level system description to:
    (i) software for the testbed system and (ii) simulation software. This solution
    ensures compatibility between the software for system simulation, the software
    running on the testbed system, and the final product, the software for a realistic
    cloud infrastructure. Fig. 5.17 illustrates this process; it shows testbed experiments
    running realistic applications and generating trace data for the simulation of
    a realistic cloud infrastructure with realistic workload.


    The simulated cloud infrastructure is generated using as input: (i) a configuration
    file describing the organization of a rack, the number of


