  md: 'The clock proxy auction starts with a clock phase with multiple rounds until
    there is no excess demand for any of the items being auctioned. Next the agents
    pass to the proxy the information on items, quantities, and prices. During the
    proxy phase, the process continues as described above. During the clock phase,
    the cost of the package is computed as the sum of products of quantity and price
    per unit, the so-called linear pricing and the monotonicity in quantity rule.
    In practice, clock auctions use discrete rounds rather than continuous-time rounds.
    In such auctions the size of the bid increments is important. Large increments
    introduce inefficiencies as well as the potential for gaming the system. The technique
    of intra-round bids allows a discrete-time clock auction to benefit from virtually
    all nice properties of continuous-time auctions.


    This technique works as follows: the auctioneer defines end-of-round prices and
    the bidders express their price vectors in range from start-of-round to the end-of-round
    prices. If during the round, which can last a relatively long time, tens of minutes,
    there is an excess supply for some item, the round ends with the current prices,
    otherwise the round ends with the end-of-round prices proposed by the auctioneer.


    The clock phase ends when there is no excess demand for any of the items being
    auctioned and produces the information about all packages and the prices bid for
    each of them throughout this phase. At the end of the clock phase, a significant
    excess supply for many items may exist and a strategy for maximizing the revenues
    could exploit this information. For example, one can find the position of the
    clock when the revenue was maximal and use the corresponding prices as the starting
    prices for the proxy phase.


