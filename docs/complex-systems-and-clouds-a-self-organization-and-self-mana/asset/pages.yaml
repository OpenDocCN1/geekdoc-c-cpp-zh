  md: 'An important step of model development is the identification of performance
    metrics likely to be affected by a new policy. Once these metrics are identified,
    the model should capture the processes affecting each one of them and quantify
    their effects.


    The simulation models should exploit homogeneity whenever feasible. For example,
    assuming that all severs in a rack of a WSC are identical reduces the complexity
    of the simulation model and it is realistic, as it reflects the practice of current
    system architecture. These principles are applied in the analysis of market mechanisms
    based on coalition formation and combinatorial auctions for CRM discussed in this
    chapter.


    The next three sections discuss simulation studies. The first simulation experiments
    compare hierarchical control with market-based policies for CRM. The second compare
    HB coalitions and JST coalitions, and the third covers experiments with an algorithm
    for combinatorial auctions.


    # 5.7 HIERARCHICAL CONTROL VERSUS MARKET MECHANISMS


    Hierarchical control in large-scale systems is ubiquitous. A distributed hierarchical
    management scheme seems a natural choice for a cloud infrastructure given the
    hierarchical topology of WSC networks. This motivates the choice of comparing
    the hierarchical control with the market mechanisms as reported in [163] and discussed
    in this section.


    Hierarchical control means that decisions are made at different levels of the
    hierarchy of a cloud infrastructure similar to the one presented in Section 4.4.
    The decision process at each level of the hierarchy must be based on information
    about the state of the system components at the levels below it. The state information
    required by hierarchical control is collected periodically by a monitoring process
    and communicated to the decision agents.


    Some of the desirable properties and the problem posed by the application of market
    mechanisms to CRM, discussed in Section 4.8, deserve to be further investigated.
    From the wide range of choices for the market mechanisms, a simple bidding scheme
    is chosen. In this scheme individual servers offer services and the decision process
    at the WSC level attempts to match service requests to services offered by the
    system. A qualitative analysis of hierarchical control and market mechanisms in
    a hierarchically organized computer cloud is presented next.'
