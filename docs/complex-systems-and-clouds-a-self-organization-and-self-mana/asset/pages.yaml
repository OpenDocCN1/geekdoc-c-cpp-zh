  md: 'only assess the effectiveness of a particular self-organization or self-management
    algorithm indirectly, based on some of the measures of system effectiveness, e.g.,
    the savings in cost or energy consumption. We do not know how far from optimal
    a particular algorithm is.


    +   Large-scale systems exhibit the essential aspects of complexity; it is inherently
    difficult to control complex systems.


    As pointed out in Chapter 1, complex systems are nonlinear; operate far from equilibrium;
    are intractable at the component level; exhibit patterns of behavior at different
    scales; require a long history to draw conclusions about their properties; scale
    well; exhibit complex forms of emergence; and are affected by phase transitions.
    For example, a faulty error recovery mechanism in the case of a power failure
    took down East Coast Region operations in 2013.


    In contrast, simple systems are linear, operate close to equilibrium, are tractable
    at the component level, exhibit similar patterns of behavior at different levels,
    relevant properties can be inferred based on a short history, exhibit simple forms
    of emergence, are not affected by phase transitions, and do not scale well.


    # 3.11 SELF-ORGANIZATION OF SENSOR NETWORKS


    To illustrate that self-organization of cyber-physical systems is feasible, we
    now discuss a self-organizing sensor network. A sensor network consists of spatially
    distributed autonomous devices equipped with a radio transceiver or other wireless
    communication device, a micro-controller, a power source, and sensors that monitor
    temperature, sound, vibration, motion, chemical pollutants, radiation, or other
    physical characteristics of the environment. The software running on the nodes
    of a sensor network includes a network stack communicating with a middleware layer
    running on top of a real-time operating system.


    **Very-large sensor networks.** We discuss self-organization principles to very
    large-scale sensor networks with applications in the area of climate changing,
    environment monitoring, or fire prevention. Typical applications could be studies
    of the temperature at the polar cap, of the sol humidity in a forest, or of the
    tremors in an earthquake prone or in a volcanic region. The area to be monitored
    by such applications is rather large, e.g., 1 mile², and for a density of 2 sensors
    per 100 ft² the total number of sensors'
