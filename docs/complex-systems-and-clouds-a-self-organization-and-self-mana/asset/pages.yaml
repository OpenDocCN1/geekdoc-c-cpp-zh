    # Simulation of a market model. In this resource management model, all servers
    of a WSC bid for service. A bid consists of the service type(s) offered and the
    available capacity of the bidder.


    The overhead is considerably lower than that of the hierarchical control; there
    is no monitoring, and the information maintained by WSC consists only of the set
    of unsatisfied bids at any given time. The servers are autonomous and act individually;
    there is no collaboration among them. Note that self-organization and self-management
    require agents to collaborate with each other.


    At the beginning of an allocation slot, servers with available capacity above
    a threshold τ places bids. The bids are collected by each WSC. A bid is persistent,
    if not successful in the current allocation slot it remains in effect until a
    match with a service request is found. This strategy to reduce the communication
    costs is justified because successful bidding is the only way a server can increase
    its workload.


    One of the objectives of the investigation is the effectiveness of the bidding
    mechanism for lightly and heavily loaded system, around 20% and 80% average system
    load, respectively. The thresholds for the two cases are different, τ = 30% for
    the former and τ = 15% for the latter. The choice for the lightly loaded is motivated
    by the desire to minimize the number of messages; a large value of τ, e.g., 40%
    would lower the rejection ratio but increase the number of messages. Increasing
    the threshold, e.g., using a value τ = 20%, would increase dramatically the rejection
    rate in the case of heavily loaded system; indeed, few servers would have 20%
    available capacity when the average system load is 80%.


