  md: '# Complex Systems and Clouds


    The rate of events that change the state in computer clouds and other large-scale
    systems is extremely high. This gives us the opportunity of embedding sophisticated
    learning algorithms in the systems to determine the essential characteristics
    of the environment after shorter periods of time. Knowledge accumulated in hours,
    days, or weeks can be used to adapt to the environment and optimize the performance
    of the system. Of course, this applies only to ergodic processes.¹13 but we have
    no reasons to believe that we are dealing with nonergodic processes for systems
