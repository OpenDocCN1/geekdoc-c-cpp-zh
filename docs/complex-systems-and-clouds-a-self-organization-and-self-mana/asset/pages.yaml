  md: '# PREFACE


    In 2003, IBM researchers enthusiastically formulated the autonomic computing challenge.

    A decade and more than 8,000 papers, 200 conferences, and 200 patents later later,
    a few small- or medium-scale systems were the signs of success of the autonomic
    computing movement [137]. In the mean time we kept building systems with increasingly
    larger numbers of components interacting with each other in intricate ways.


    The first cloud computing services were introduced a decade ago. In 2006, Amazon
    Web Services (AWS) started offering storage and computing services, S3 and EC2.
    The number of Cloud Service Providers (CSPs) has increased year after year, as
    larger numbers of individuals and large organizations have enthusiastically joined
    the cloud computing community. Decade later, the most powerful processors with
    large cache and memory and attached GPU co-processors, storage arrays, interconnected
    by a hierarchy of networks populate the cloud computing infrastructure of many
    CSPs.


    The complexity of computer clouds is undeniable and yet their design is based
    on traditional, mostly deterministic hierarchical management. The time has come
    to ask if elusive goal of self-organization and self-management can be achieved
    for large-scale systems such as computer clouds. The best place to start looking
    for an answer is to understand what are the defining attributes of a complex system.


    The first chapter of the book covers complex systems. After a brief review of
    the evolution of thinking about systems consisting of an ensemble of components,
    we analyze nondeterminism, nonlinearity, and phase transitions in complex systems.
    A range of topics pertinent to complexity, such as self-organization, self-organized
    criticality, power law distributions, computational irreducibility, and quantitative
    characterization of complexity are then covered. Cybernetics and the interdisciplinary
    nature of complexity are the last topics of the chapter.


    Nature is a good place to look for ideas regarding complex systems and the second
    chapter is dedicated to nature-inspired algorithms and systems. Disciplines as
    evolutionary computation, neural computation, artificial'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'immune systems, swarm intelligence, and Ant Colony Optimization (ACO) draw
    from their inspiration for new problem-solving techniques. Cellular automata,
    epidemic algorithms, genetic algorithms, ACO algorithms, swarm intelligence, DNA
    computing, quantum information processing, and membrane computing are then presented.
    A discussion of the scope and the limitations of nature-inspired algorithms and
    of realistic expectations from DNA computing and quantum information processing
    concludes the chapter.


    The third chapter is dedicated to managing the complexity of cyberphysical systems.
    Most large-scale systems are cyber-physical systems integrating computation, communication,
    sensing, and physical processes. Cyber-physical systems are now ubiquitous and
    their undeniable complexity is caused by a set of factors reviewed in the first
    sections of the chapter, which also discusses how software has pushed the limits
    of system composability. Challenges specific to large-scale cyber-physical systems,
    autonomic computing, and scalable system organizations are the topics of the next
    sections. The discussion of virtualization by aggregation and coalition formation
    is followed by a survey of cooperative games for coalition formation. An in-depth
    analysis of a self-organization protocol for very large sensor networks concludes
    the chapter.


    The fourth chapter covers computer clouds. Computer clouds have altered our thinking
    about computing and we first provide a downearth view of the new paradigm and
    present the cloud delivery models. The hierarchical organization of the cloud
    infrastructure, consisting of multiple warehouse-scale computers is discussed
    next. Cloud elasticity, the effects of over-provisioning on costs and energy consumption,
    and existing Cloud Resource Management (CRM) policies and mechanisms for implementing
    these policies are analyzed. Alternative CRMs based on market mechanisms, such
    as auctions and server coalitions are introduced. Combinatorial auctions allow
    access to packages of resources for applications with a complex workflow.


    The last chapter analyzes cloud self-organization and Big Data applications in
    science and engineering. Computational science and engineering applications exacerbate
    the shortcomings of existing CRM for Big Data applications. Significant enhancements
    of cloud infrastructure have been noticeable since 2010, when a comparison between
    the performance of HPCC applications on supercomputers and AWS instances was reported.'
