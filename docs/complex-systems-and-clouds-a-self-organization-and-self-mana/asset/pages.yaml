  md: '# 2.5 SWARM INTELLIGENCE


    Swarm intelligence is a form of collective intelligence observed in some collections
    of organisms, such as flocks of birds, schools of fish, ant colonies, herds of
    bisons, or packs of wolves [39]. Swarms of organisms display abilities not shown
    by individuals. The collective intelligence emerges from individual experiences
    of the members of the organization combined with their ability to communicate
    with one another.


    The collective intelligence is the result of simple rules easily followed by the
    individual members of the swarm. For example, for cohesion requires individual
    members to stay in close proximity to one another, and at the same time, to avoid
    conflicts or collisions with other members of the group; whenever the group moves,
    all the members of the group should move together.


    Particle swarm optimization (PSO) algorithms [133] are applicable when the cardinality
    of the set of participants is limited to a few thousands and all individuals collaborate
    to optimally achieve a common objective. Such algorithms are robust, asynchronous,
    do not require a central control, and can be parallelized with relative ease.
    PSO algorithms are easy to implement and only a few parameters of the model are
    required.


    A population of random solutions is generated during an initialization phase of
    a PSO algorithm. Then the search for optimal solutions, called particles, is carried
    out by updating generations. Unlike in genetic algorithms, there are no crossover
    or mutation evolution operators in this evolution. A fitness function evaluates
    the individual fitness values of all particles to identify the particle(s) with
    optimal trajectory. All particles flow through the problem space, tracing the
    trajectory of the current optimum particle(s).


    The high-level description of the algorithm presented follows the notations used
    in [111, 133]. We assume n particles with positions X(i) ∈ R^m, and velocities
    V(i) ∈ R^m, i ∈ {1, n} in a space with m dimensions. The fitness function f :
    R^m → R is used to determine XLocalOpt(i), the optimal position of particle i
    ∈ {1, n}, and the global optimum XGlobalOpt. Three parameters, w, a, and b are
    used in the following high-level description of the algorithm'
