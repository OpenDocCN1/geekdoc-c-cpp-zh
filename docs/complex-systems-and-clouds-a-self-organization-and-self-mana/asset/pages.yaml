  md: 'The notations used to describe the contraction algorithms for tensor network
    T are:


    +   - $N^{(i)}$—number of vCPUs for iteration $i$; $N=2$ for all iterations of
    Stage 1, while the number of vCPUs for Stage 2 may increase with the number of
    iterations;


    +   - $m$—amount of memory available on the vCPU of the current instance;


    +   - $\mathcal{T}^{(i)} = [T_{jk}^{(i)}]$—version of the $[T]$ after the $i$th
    iteration;


    +   - $L^{(i)}$—the number of columns of $[T]$ at iteration $i$;


    +   - $T_{j,k}^i = T_{jk}^{(i)}$—tensor in row $j$ and column $k$ of $\mathcal{T}^{(i)}$


    +   - $\mathcal{T}_k^{(i)}$—column $k$ of $\mathcal{T}^{(i)}$;


    +   - $\mathcal{C}(T_k^{(i)}, T_j) > 1$—contraction operator applied to columns
    $T_k^{(i)}$ and $T_j$ in Stage 1;


    +   - $\mathcal{V}(T_{col})$—vertical contraction operator applied to the “big
    tensor” obtained after $L_{col}$ column contractions;


    +   - $\mu$—amount of memory for $T_{jk}$, a tensor of the original $T$;


    +   - $\mu^{(i)}$—storage for iterations $T_{jk}^{(i)}$ created at iteration $i$;


    +   - $I_{max}$—maximum number of iterations for Stage 1 of the TNC.


    The generic contraction algorithm for a 2-D tensor network with $L_{row}$ rows
    and $L_{col}$ columns, $T = [T_{jk,l}]$,$ $1 \leq j \leq 2L_{row}$, $1 \leq k
    \leq 2L_{col}$ is an extension of the one in Fig. 5.4. TNC is an iterative process,
    at each iteration two pairs of columns $(1, 2)$, and $(2L, 2L-1)$ are contracted.
    Iterations $2 \leq i \leq L$ the new tensor network has $L^{(i)}$ and $L-2$ columns.
    The contraction is applied to pairs of columns. The two columns resulting from
    the left and right contractions of the leftmost and rightmost columns at iteration
    $(i-1)$ are now columns 1 and $L^{(i)}$. They are contracted with columns 2 and
    $L^{(i-1)}$, respectively.


    The TNC algorithm is organized in multiple stages with different AWS instances
    for different stages. Small to medium size problems need only the first stage
    to produce the results and use low-end instances with 2 vCPUs, while large problems
    must fetch the results of the first stage to a second one running on more powerful
    AWS instances. A third stage may be required for extreme cases when the size of
    tensor exceeds the amount of vCPU memory, some 4 GB at time. The three stages
    of the algorithm are now discussed.


    +   - An entire column of $\mathcal{T}^{(i)}$ can be stored in the vCPU memory
    and successive contraction iterations can proceed seamlessly'
