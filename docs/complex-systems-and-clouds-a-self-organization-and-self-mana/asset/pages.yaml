    showing the causes of overheating in an internal combustion engine. https://upload.wikimedia.org/wikipedia/commons/6a/Pareto_analysis.svg.


    Instead of asking what the $k$th largest event is, the Italian economist Vilfred
    Pareto asked how many events are greater than x. Pareto’s law is formulated in
    terms of the cumulative distribution function (CDF), i.e., the number of events
    larger than x is an inverse power of x:


    ```

    $P[X > x] \approx x^{-k}. \qquad (1.6)$

    ```


    For example, in terms of income distribution, Pareto’s Law says that there are
    a few multimillionaires, but most people have a modest income.


    A Power Law distribution gives the number of events of magnitude exactly x rather
    than the number of events with a magnitude greater than x.


