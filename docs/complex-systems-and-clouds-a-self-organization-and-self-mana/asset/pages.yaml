    \ edge $(n_i, n_j)$ with $i < j$ and rewire it with probability $\\beta$ by replacing\
    \ $(n_i, n_j)$ with $(n_i, n_k)$. Node $n_k$ is chosen with uniform probability\
    \ from all possible values avoiding:\n\n+   1. self-loops, $k \\neq i$, and\n\
    2. link duplication; no edge $(n_i, n_{k'})$ with $k'=k$ is allowed.\n\nProperties\
    \ of small-worlds are discussed in [25]. The Watts-Strogatz algorithm is also\
