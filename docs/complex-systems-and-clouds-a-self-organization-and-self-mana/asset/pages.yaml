    diverse as psychology and control theory, philosophy and mechanical engineering,
    architecture and evolutionary biology, or social sciences and electrical engineering.


    There is little wonder that philosophers and scientists have different definition
    of cybernetics. Cybernetics is “the art of creating equilibrium in a world of
    constraints and possibilities,” according to the philosopher Ernst von Glasersfeld.
    The famous mathematician Andrey Nikolevich Kolmogorov defines cybernetics as the
    “science concerned with the study of systems of any nature which are capable of
    retrieving, storing, and processing information so as to use it for control.


    Other remarkable definitions of cybernetics are: “The art of steering-deals with
    all forms of behavior in so far as they are regular, or determinate, or reproducible:
    stands to the machine—electronic, mechanical, neural, or economic—much as geometry
    to real object in our terrestrial space; offers a method for the scientific treatment
    of the system in which complexity is outstanding and too important to be ignored,”
    by the famous psychiatrist and pioneer of cybernetics, William Ross Ashby. It
    is also “the science and art of understanding,” according to the biologist Humberto
    Maturuna, known for creating concepts such as structural determinism and structure
    coupling. Other definitions of cybernetics can be found at the site of the American
    Association of Cybernetics, http://www.asc-cybernetics.org/foundations/history.htm.


    In recent years, scientists have shown some reluctance to use the term cybernetics
    because the discipline covers a very broad range of concepts and applications
    in many areas of human endeavor. Nevertheless, some concepts of cybernetics, such
    as feedback are essential for understanding complex systems, simply because systems
    have to adapt their behavior based on feedback from the environment they operate
    in. Two feedback loops allow the system to learn and adapt; one used frequently,
    makes small adjustments and enables learning, while the other, used less frequently,
    senses the need to replace obsolete information with new information, enabling
    adaptation. According to Ashby [17], learning implies that a system discovers
    patterns of successful behavior in the environment'
