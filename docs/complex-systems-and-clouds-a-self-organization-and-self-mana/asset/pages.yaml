    acquires an item or a set of items at the price of the bid.


    The advantage of this scheme is its efficiency. An effective price discovery allows
    the agents to develop early in the auction in the sense of what the final price
    for each item might be. Most auctions allow the agents to withdraw their bids
    and thus, limit their exposure. The main disadvantage of SAA is that package bidding
    is not supported and agents may win some of the items in the set they desire,
    but not all.


    The typical rules governing most auctions including the SAA are :


    +   1. Activity rule—requires the agents to bid consistently. For example, agents
    desiring to acquire large quantities of goods at the end of the auction, thus,
    bidders in the last rounds when the prices are higher, are required to bid for
    large quantities at the beginning of the auction, when the prices are lower. This
    monotonicity in quantity rule increases the effectiveness of price discovery in
    SAA and other auctions.

    2. Minimum bid increment rule—allows an auction to proceed efficiently rather
    than drag for a long time; bid increments in the range 5–20% are typical.

    3. Stopping rule—necessary to give the agents enough flexibility to pursue their
