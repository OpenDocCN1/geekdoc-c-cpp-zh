    # 3.6 SCALABLE SYSTEM ORGANIZATION


    Scalability is a critical concern as the systems are increasingly more, e.g.,
    social networks such as Facebook are projected to reach one billion users in several
    years. Today’s computer networks connecting hundreds of millions of computers,
    computer clouds with millions of servers, the future smart power grid infrastructure
    expected to have a very large number of nodes including customers, power generators,
    and transmission lines, are only a few examples of systems expected to have properties
    invariant to the scale of the system, in other words, to be scale-free.


    Graphs are mathematical structures used to model pairwise relations between objects
    and to study system organization. Several models of graphs have been investigated
    using the Erdős-Rényi model [78], where the number of vertices is fixed and the
    edges connecting vertices are created randomly. This model produces a homogenous
    network with an exponential tail; connectivity follows a Poisson distribution
    peaked at the average degree $k$ and decaying exponentially for $k \gg \tilde{k}$.


    An evolving network, where the number of vertices increases linearly and a newly
    introduced vertex is connected to $m$ existing vertices according to a preferential
    attachment rule, is described by Barabási and Albert in [9, 10, 29]. Regular graphs,
    where a fraction of edges are rewired with a probability $p$, have been proposed
    by Watts and Strogatz and called small worlds networks [244]. Networks whose degree
    distribution follows a Power Law are called scale-free networks. The four graph
    models are sometimes abbreviated as: ER (Erdős-Rényi), BA (Barabási-Albert), WS
    (Watts-Strogatz), and SF (scale-free) models, respectively. We use the terms networks,
    nodes, and links when we discuss a physical system and the terms graphs, vertices,
    and arcs when we discuss the model of a system.'
