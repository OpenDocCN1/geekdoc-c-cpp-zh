  md: 'The proxy phase of the auction consists of multiple rounds. The auction favors
    bids for long runs of consecutive slots for services provided by the same coalition.
    This strategy is designed to exploit temporal and spatial locality and minimize
    the overhead for resource allocation, and reduce communication, as well as the
    execution time.


    The auction starts with the longest runs and the lowest price per slot and proceeds
    with increasingly shorter runs and diminished incentives. Once a run of consecutive
    slots is the subject of a provisional winning bid, all shorter runs of slots for
    that particular service are removed from the coalition offerings.


    During the first round, only the longest run of consecutive slots for each one
    of the services offered by the participating coalitions is auctioned and all bidders
    who have committed to any of the slots of the run are allowed to bid. The price
    per slot for the lowest price for any slot of the run the bidder has committed
    to during the clock phase of the auction. If there are multiple bids for services,
    $S_i^1$ the provisional winner is the one providing the largest revenue for the
    coalition offering the service.


    If $k_i^1$ is the longest run of consecutive slots for service $S_i^1$ auctioned
    in the first round then, in the second round, a shorter run of $k_i^1-1$ slots
    is auctioned. The price for the winner equals the second lowest price for any
    slot of the run the bidder has committed to during the clock phase of the auction
    times the number of the time slots in the run.


    The length of the consecutive slot runs auctioned decreases after each round.
    The preliminary rounds end with the auction of a single slot for each service.
    At the end each bidder is required to offer the price for the slot to committed
    during the clock phase. Fig. 5 depicts a plausible snapshot at the end of the
    preliminary rounds of the proxy phase when four services $S_1, S_2, S_3$, and
    $S_4$, are offered and shows the provisional winners for service $S_4$.


    During the final round, the bidders reveal the packages they want to reserve;
    these packages include only the provisional winners from the preliminary slots.
    All provisional winning bids for services in a reservation request are known,
    the auction chooses the package that best matches the consumer''s needs and, at
    the same time, maximizes the profit for the CSP. The coalition for a reservation
    request consists of the set of coalitions that provide the services in the winning
    package.'
