  md: 'irreducibility implies that there are cases where theoretical predictions are
    not possible and there are normally computationally irreducible phenomena. Wolfram
    conjectured that there is no easy theory for any behavior that seems complex.


    Shortly after the introduction of the concept of computational irreducibility,
    it was shown in [125] that some computationally irreducible elementary cellular
    automata have properties that are predictable, therefore their properties are
    computationally reducible. These cellular automaton can emulate reducible cellular
    automata by coarse-graining. This is the case of a universal automaton described
    by rule 110.


    A result confirming Wolfram''s conjecture is discussed in [162]. The dynamic behavior
    of a system can be modeled as the trajectory of the system in the phase space.
    A phase space is an abstraction where each possible state of the system is represented
    by a unique point. Each dimension of the phase space represents a degree of freedom
    of the system. Individual trajectories have different probabilities, with some
    of them more likely than others.


    In [162] it is shown that for a complex system, the highly probable trajectories
    in the phase space are dominant. The paper analyzes random walks in fully connected
    finite state machines, and shows that the cardinality of the set of highly probable
    trajectories is very large; its lower bound is exponential in the number of states
    traversed by the random walk, and in an expression of system entropy (see Fig.
    1.5).


    ![](img/527756a25ef2ac53ecf8852fd8f955ff_36_0.png)


    Fig. 1.5 In fully connected finite state machines the cardinality of the set of
    highly probable trajectories is very large, its lower bound is exponential in
    the number of states traversed by the random walk and in an expression of system
    entropy. From D.C. Marinescu, High probability trajectories in the phase space
    and system complexity, Complex Syst. 22 (3) (2013) 233–246.'
