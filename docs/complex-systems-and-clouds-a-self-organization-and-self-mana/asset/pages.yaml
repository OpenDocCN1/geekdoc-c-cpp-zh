    in the package; price of items is given by $\mathcal{M} = \{m_1, m_2, \dots, m_{\mathcal{N}}\}$.
    Package bidding can be traced back to generalized Vickrey-Clarke-Groves auctions
    based on [52, 100].


    In an ascending package auction (APA) there are $\mathcal{K}$ participants identified
    by an index, $k=0$ is the seller and $k=1, 2, \dots, \mathcal{K}$ are the buyers
    [18]. Each buyer has a valuation $v_i = (v_i(z), z \in [0, \mathcal{M}])$ where
    $v_k(z)$ represents the value of package $z$ to the bidder $k$. in an ascending
    auction all bids are firm and a bid cannot be removed or withdrawn. The auctioneer
    identifies after each round the set of bids that maximize the total price, the
    provisional winning bids. The auction ends when a round fails to elicit new bids;
    the provisional winning bids become the winners of the auction.


    A bidder can be deterred from bidding for the package she dearly desires by the
    threat that competitors could drive prices up; this would threaten the equilibrium
    of an ascending package auction. This problem does not exist in ascending proxy
    auctions when each bidder instructs a proxy agent to bid on her behalf [18]. The
    proxy accepts as input the bidder’s valuation profile and bids following a “sincere
    strategy.”


    In an APA the bidder passes the information about quantities of items and prices
    to proxies which iteratively submit package bids designed to maximize the profits
    of the bidders. The auctioneer chooses provisional winners bids that maximize
    the revenue for the suppliers of the items. The process stops when the proxies
    do not submit bids.


    Clock auctions are combinatorial auctions designed for auctioning related items.
    In clock auctions the auctioneer announces prices for individual items and the
    agents specify the quantities of individual items they desire at the current price.
    When the demand for an item increases, so does its price until there is no excess
    demand (see Fig. 5.7). On the other hand, when the offering exceeds the demand,
    the price decreases [18]. The process stops when there are no more items with
    excess demand.'
