  md: '# 4.3 HOW CLOUDS CHANGED OUR THINKING ABOUT COMPUTING


    The infrastructure of computer clouds uses the latest computing and communication
    technology, and as expected, had a profound impact on the hardware and the software
    developments in recent years. Our computing systems have evolved from single processors,
    to multiprocessors, to multicore multiprocessors, clusters, and now Warehouse-scale
    Computers (WSC) controlled by increasingly complex software stacks.


    Built with inexpensive off-the-shelf components to deliver cheap computing cycles,
    the millions of servers operating in today''s data centers are capable of delivering
    the computing power necessary to solve problems that previously could only be
    solved by large supercomputers assembled from expensive, one-of-a-kind components.
    The scale of the cloud infrastructure, combined with the relatively low mean-time
    to failure of the off-the-shelf components used to assemble a WSC, make the task
    of ensuring reliable services quite challenging.


    At the same time, long-running cloud services require a very high degree of availability.
    For example, a 99.99% availability means that the services can only be down for
    less than 1 hour/year. Only a fair level of hardware redundancy combined with
    software support for error detection and recovery can ensure such a level of availability
    [110]. Software helps integrate a very large number of system components and contributes
    to the challenge of ensuring efficient and reliable operation as discussed in
    Section 3.2.


    New services, which hide from the end-user some of the intricacies of parallel
    and distributed computing, facilitate access to cloud resources. For example,
    to deal with Big Data applications, new AWS services as Map-Reduce and Elastic
    Beanstalk provide automatic support for concurrent execution and automate the
    execution of complex workflows.


    Processor virtualization, running multiple independent instances of one or more
    Operating Systems (OS), pioneered by IBM in the early 1970s, was revived for computer
    clouds. Running multiple Virtual Machines (VMs) allows multiple applications to
    better share the resources of a server and achieve a better processor utilization.
    The instantaneous demands for resources of the applications running concurrently
    are likely to be different or complement each other, and the idle time of the
    server is reduced.'
