  md: '# 1.12 THE INTERDISCIPLINARY NATURE OF COMPLEXITY


    The interdisciplinary nature of complexity is reflected by the scientists who
    made major contributions to the field; papers authored by biologists, chemists,
    physicists, mathematicians, computer scientists, economists, and others, introduced
    seminal ideas for the study of complexity [112, 153, 243, 251]. The idea that
    physical, biological, chemical, social, economic, linguistic, and any other systems
    and their properties should be viewed as wholes, not as collections of parts,
    is the main theme of Holism and Evolution, a book written by the South African
    statesman Ian Smuts in 1926 [213].


    Charles Darwin [67] is the creator of the theory of evolution. More recently,
    Richard Dawkins [68] made important contributions to the theory of evolution,
    Stephen Gould and Niles Eldred formulated the thesis that evolution is a chaotic
    process with long periods of equilibrium followed by bursts of dramatic changes
    [97]. Sir Julian Huxley was a British scientist proponent of natural selection,
    a leading figure in the mid-20th century modern evolutionary science, and in ethics
    in science [123]. Karl Ludwig von Bertalanffy was an Austrian biologist, one of
    the founders of general systems theory [36].


    Ilya Prigogine was a Belgian physical chemist and Nobel Laureated for his work
    on dissipative structures, complex systems, and irreversibility [177, 189]. Self-similarity
    was investigated by Shlomo Havlin [106] and fractal geometry was developed by
    Benoit Mandelbrot [154]. George Kingsley-Zipf formulated the so-called Zip''s
    Law [242], based on the observation that the log-log plot of run frequency of
    many phenomena is a straight line with slope near unity. The study of networks
    was initiated by Leonard Euler [79]. Paul Erdős made contributions to graph theory
