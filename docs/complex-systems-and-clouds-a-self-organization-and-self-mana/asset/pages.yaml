  md: '# Managing Complexity of Large-Scale Cyber-Physical Systems 81


    In a scale-free organization, the probability $p(k)$ that an entity interacts
    with $k$ other entities decays as a Power Law discussed in Section 1.5


    ```

    $p(k) \approx k^{-\gamma}, \quad (3.1)$

    ```


    with $\gamma$ a constant and $k$ a positive integer. This probability is independent
    of the type and the function of the system, the identity of its constituents,
    and the relationships between them.


    ![](img/527756a25ef2ac53ecf8852fd8f955ff_86_0.png)


    > Fig. 3.3 A scale-free network is nonhomogeneous; the majority of the vertices
    of a graph model of a scale-free network have a low degree and only a few vertices
    are connected to a large number of edges; the majority of the vertices are directly
    connected with the vertices with the highest degree.


    The graph of a scale-free network is nonhomogeneous, there are a few vertices
    with a high degree of connectivity and the majority of the vertices are only connected
    with few other vertices. In addition to scalability, free networks have a significant
    number of other highly desirable properties discussed later in this section.


    The degree distribution of scale-free networks follows a Power Law; we only consider
    the discrete case when the probability density function is $p(k) = af(k)$ with
    $f(k) = k^{-\gamma}$ and the constant $a$ is $a = 1/\zeta(\gamma, k_{min})$, thus,


    ```

    $p(k) = \frac{1}{\zeta(\gammagamma k_{min})} k^{-\gamma}. \quad (3.2)$

    ```'
