- img_proc: true
  md: 'Modularity can reduce the cost for the manufacturer and for the consumers.
    The same module may be used by a manufacturer in multiple products; to repair
    a defective product, a consumer only replaces the module causing the malfunction,
    rather than the entire product. Modularity encourages specialization, as individual
    modules can be developed by experts with deep understanding of a particular field.
    It also allows a module to be replaced with another one, possibly a more performant
    one, without affecting the rest of the system.


    Since the early days of computing large programs have been split into modules,
    each with a well-defined functionality. Modules with related functionalities have
    then been grouped together into numerical, graphical, statistical, and many other
    types of libraries. A strong requirement for modularity is to clearly define the
    interfaces between modules and enable modules to work together.


    Layering is a particular form of modularity when the functions of the system are
    ensured by modules with a well-defined communication pattern; logically, the modules
    are stacked on top of one and each module, except the top and the bottom one,
    communicate only with the one above and the one below it. This restrictive communication
    pattern simplifies the design of the interfaces of each module and makes testing
    and debugging the system easier. Layering helps us in dealing with complicated
    problems when we have to separate concerns that prevent us from making optimal
    design decisions. To do so, we define layers that address each concern and design
    clear interfaces between the layers.


    Communication protocols are layered. The TCP/IP network architecture accommodates
    a variety of physical communication channels that carry electromagnetic, optical,
    or acoustic signals, thus, there is the need for a physical layer whose function
    is to transport physical signals. The next concern is how to transport frames
    consisting of a number of bits, rather than signals, between two nodes linked
    to one another by a communication channel, thus, the need for a data link layer.
    The Internet is a network of networks; data packets have traverse a set of networks
    and a chain of intermediate routers from the source to the destination; the concern
    of the network layer is to forward the data packets from one intermediate node
    to the next. The source, as well as the recipient of information, outside the
    network are not interested in how the information crosses the network, but want
    the information to reach its destination unaltered; the transport layer is responsible
    for data segments delivery'
