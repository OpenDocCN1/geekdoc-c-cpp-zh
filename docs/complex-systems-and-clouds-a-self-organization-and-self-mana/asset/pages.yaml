  md: '# Managing Complexity of Large-Scale Cyber-Physical Systems 105


    recursively the set of nodes involved in a collision on a multiple-access channel
    until the cardinality of the set is equal to one and a single node successfully
    transmits. This splitting is based upon the ternary channel feedback, “Success,”
    “Collision,” or “Idle Slot.” Blocking algorithms forbid new nodes to join the
    set of nodes involved in a collision; newcomers have to wait until the original
    collision was resolved and only then transmit. Nonblocking algorithms allow newcomers
    to join a game in progress. The Stack Algorithm also known as CTM (Capetanakis-Tsybakonov-Mikhailov
    [225], Fig. 3.8A, is nonblocking.


    The model of the multiaccess channel suitable for a sensor network is slightly
    more complicated than the one considered by traditional CRAS. First, the transmission
    frequency changes, and perhaps importantly, not all sensors involved in a collision
    are able to hear the channel feedback. The transmission range of the sensors is
    normally distributed around $\gamma$. It is possible that two sensors $b$ and
    $c$ both transmit in response to a request from sensor $a$, but they are outside
    of the reception of each other, a phenomenon encountered in wireless networks
    and called hidden problem [128]. The version of the stack algorithm (Fig. 3.8B)
    differs from the original CTM algorithm in several ways:


    +   1. The algorithm is executed during the self-organization phase when collisions
    may occur.

    2. During the self-organization phase, the duration of a slot is $A = n\delta\delta$
    with $\delta$ the duration of a micro-slot $k$ and $n\delta = \mathcal{O}(10^3)$.
    The time $t_k$ of the event $\epsilon_k$ is the starting time of slot $k$ and
    of its first micro-slot. The time between two consecutive events is determined
    by the random number generator, and should be at least $\Delta$ ($t_{k+1} - t_k
    \geq \Delta$). We expect a collision in slot $k$ to be resolved before the event
    $\epsilon_{k+1}$ ($n\delta = \mathcal{O}(10^3)$).

    3. Only one sensor is allowed to transmit in the first micro-slot of a slot: the
    sink transmits during the slot $k$, the “winner” of a collision contest during
    slot $(k-1)$, transmits in slot $k$.

    4. The micro-slots are grouped in pairs. Collisions may occur only in the even-slots
    of a slot. Odd micro-slots are collision-free and used by the sensor who initiated
    the CRI to broadcast the channel feedback. This allows us to address the hidden
    node problem. Indeed, if two sensors $b$ and $c$ are in the range of sensor $a$
    and may attempt to responding to $a$ in micro-slot $2k$, but they may be out of
    each other’s range. To solve this problem, $a$ will broadcast in micro-slot $2k+1$
    the channel feedback and in this case report a collision.'
