    # 4.6 CLOUD RESOURCE MANAGEMENT POLICIES AND MECHANISMS


    The policies for CRM are loosely grouped into five classes: (1) admission control;
    (2) capacity allocation; (3) load balancing; (4) energy optimization; (5) quality
    of service (QoS) guarantees.


    The explicit goal of an admission control policy is to prevent the system from
    accepting workload in violation of high-level system policies [102]. A system
    should not accept additional workload if this would prevent it from completing
    work already in progress or contracted. Limiting the workload requires some knowledge
    of the global state of the system.'
