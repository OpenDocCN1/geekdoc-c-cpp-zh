  md: '# Computer Clouds 115


    +   * The maintenance and the security are ensured by service providers.

    * Economy of scale allows CSPs to operate more efficiently due to specialization
    and centralization.

    * To reduce maintenance costs, the cloud infrastructure typically uses the same
    family of hardware and similar software.

    * Cloud computing is cost-effective due to resource multiplexing; lower costs
    for the service provider are passed on to the clouds.

    * The application data is stored at the site where it is used in a device-and
    location-independent manner.


    The term “elastic computing” refers to the ability of dynamically acquiring computing
    resources and supporting a variable workload. A CSP maintains a massive infrastructure
    to support elastic services. Such a massive infrastructure requires a large initial
