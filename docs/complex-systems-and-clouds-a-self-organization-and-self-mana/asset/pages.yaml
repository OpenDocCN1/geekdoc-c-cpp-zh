  md: 'Complex Systems 29


    Another measure of complexity is the relative predictive efficiency defined as
    $e = E/C$ where E is the excess entropy and C is the statistical complexity [65].
    The excess entropy measures the complexity of the stochastic process, and can
    be regarded as the fraction of historical information about the process that allows
    us to predict the future behavior of the process. The statistical complexity reflects
    the size of the model of the system at a certain level of abstraction.


    Complexity could be related to the description of a system and may consist of
    structural, functional, and, possibly, other important properties of the system
    [45]. The question of how to measure the descriptive complexity of an object was
    addressed by Kolmogorov [139].


    The Kolmogorov complexity $K_V(s)$ of a string $s$ with respect to the universal
    computer $\mathcal{V}$, is defined as the minimal length over all programs $Progy$
    that print $s$ and halt


    $K_V(s) = min[Length(s)]$ over all Prog: $\mathcal{V}(Progy) = s. \quad (1.25)


    The intuition behind Kolmogorov complexity is to provide the shortest possible
    description of any object or phenomena. Gell-Mann argues that the Kolmogorov complexity
    has a fundamental flaw; it is never known if a more efficient compression scheme
    will be discovered in the future, leading to a shorter description of the object
    or phenomenon [89].


    # 1.11 COMPUTATIONAL IRREDUCIBILITY


    There are systems whose behavior is repetitive, or can be expressed by a straightforward
    interaction of a relatively small number of easy-to-describe components. In this
    case, there are shortcuts that allow us to reduce the computational effort to
    model such systems, and we say that the behavior of such systems is *computationally
    reducible*. So the natural question is if there are shortcuts that allow us to
    describe the behavior of complex systems in a simple way, and thus, create simple
    models and simplify the simulation of such systems.


    In his book, *A New Kind of Science*, Stephen Wolfram [250] introduced *computational
    irreducibility* to describe systems for which it is not possible to describe their
    behavior in a simple way, and thus, to find shortcuts for a program simulating
    the behavior of such systems. Computational'
