    TNC is CPU and memory intensive. If the tensor network has an arbitrary topology,
    TNC is considerably more intensive than in the case of a regular topology, e.g.,
    a 2-D lattice.


    **An example of TNC.** We now discuss the case of an application where the tensors
    form a 2-D, $L \times L$ rectangular lattice. Each tensor in the interior of the
    lattice has four indices each one from 1 to $D^2$, while others have only three
