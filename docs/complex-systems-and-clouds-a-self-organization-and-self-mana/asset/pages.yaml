  md: "# Complex Systems and Clouds\n\n\"small-worlds\" [244]. This model is also\
    \ known as Six Degrees, the title of the popular science book written by Watts.\
    \ The \"six degrees of separation\" concept attributed to Milgram [170] is the\
    \ most popular example of small worlds.4 Next we present the Watts-Strogatz algorithm.\
    \ We are given:\n\n+   1. N—the number of nodes.\n2. K—the mean degree, an even\
    \ integer satisfying the condition\n\n```\n$N \\gg K \\gg \\ln(N) \\gg 1. \\quad\
    \ (3.4)$\n```\n\n+   3. $0 \\le \\beta \\le 1$—a parameter which controls the\
    \ shape of the graph.\n\nThe limits, $\beta=0$ and $\beta=1$ correspond to a random\
    \ lattice and to an Erdős–Rényi random graph $G(n,p)$ with $n=N$ and $p=\\frac{NK}{2(N)}$,\
    \ respectively.\n\nTwo steps are required to construct an undirected graph with\
    \ $N$ nodes and edges:\n\n+   Step 1: construct a random lattice, a graph with\
    \ $N$ nodes each connected to $K$ neighbors, $K/2$ on each side. If the nodes\
