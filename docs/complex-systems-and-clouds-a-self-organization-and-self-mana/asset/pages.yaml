    Hierarchical organization. Herbert Simon defines a hierarchical system [210] as
    follows: “By a hierarchical system, or hierarchy, I mean a system that is composed
    of interrelated subsystems, each of the latter being, in turn, hierarch in structure
    until we reach some lowest level of elementary subsystem.”'
