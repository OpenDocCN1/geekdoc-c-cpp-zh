  md: '# Cloud Self-Organization and Big Data Applications


    The decision factors in priority order are:


    +   1. the coalition size—the larger coalition size, the higher priority;

    2. the requested service duration—the longest duration has the highest priority;

    3. the rack load—the lower rack load, the higher priority; and

    4. the cell load—the lower cell load, the higher priority.


    If two coalitions with the same size and duration, but with different rack load
    levels bid for a request, priority is given to the coalition from the rack with
    lower load. This decision process aims to balance the load on racks and cells.


    **Simulation experiments.** Several simplifications are necessary to simulate
    a cloud infrastructure with several WSCs:


    +   1. Auctions are organized periodically and the time between two consecutive
    auctions is called an *allocation slot*.

    2. A service request should specify the service duration as an integer number
    of slots.

    3. The communication complexity is measured by the number of messages; this approximation
    avoids a detailed timing analysis of the communication delays, which would require
    modeling contention at different levels of the network hierarchy.

    4. For practical reasons, the simulation is conducted for only 500 allocation
    slots. A longer history would lead to more accurate predictions of the size of
    successful coalitions for each service type, thus, we expect the results to improve
    in time for the HB strategy.


    The choice of the system configuration is guided by data from the literature [27].
    The simulated system consists of 4 WSC, each one with 25 cells; each cell has
    100 racks and each rack has 40 servers. The server capacity, measured by the number
    of vCPU, is uniformly distributed in the range of 10–50 vCPU.


    Sensible choices to describe the workload include: the number of coalitions in
    each package of services in a client’s request, the number of different service
    types provided by the system, service intensity measured by the number of vCPU
    requested, and service duration. Each coalition request specifies the service
    type, the service duration, and the service intensity expressed as the number
    of vCPU. The last parameter is used to determine a sensible coalition size. Service
