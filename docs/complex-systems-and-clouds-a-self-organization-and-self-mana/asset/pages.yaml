    are sufficient and adopting all of them would significantly add to the costs of
    the cloud infrastructure. Indeed, further interconnection networks are very expensive
    and they represent a significant fraction of a supercomputer. Such changes would
    require extensive experimentation with new policies and implementing the policies,
    a difficult proposition because it is infeasible'
