  md: 'Each server maintains a coalition success record, $\mathcal{R} = \{n, p, p_m\}$
    with $n$ the coalition size, $p$ the probability of success, and $p_m$ the probability
    that $m$ copies of a coalition of size $n$ were successful at an auction. All
    servers have the same information therefore, these records are identical. The
    probability of success $p$ is the ratio of instances when a coalition consisting
    of $n$ servers from this rack was matched with a service request and the number
    of instances this coalition size was offered but the bid was unsuccessful. When
    the system starts, $\mathcal{R} = \emptyset$ and the coalition sizes are randomly
    selected.


    At the beginning of allocation slot $k$ the role of *rack leader* is assumed by
    the server with $S_{l,j} = k \pmod s$. The rack leader communicates with the servers
    in the rack and the WSC admission control process $\mathcal{A}$ which matches
    service requests with the set of coalitions proposed by all racks. The functions
    of the rack leader are:


    +   1. Collect bids from servers ready to participate in coalition formation at
    the beginning of allocation slot $k$.

    2. Select the set of coalitions most likely to be successful.

    3. Send to $\mathcal{A}$ the set of proposed coalitions including the service
    type provided by the rack.

    4. Receive from $\mathcal{A}$ the set of successful coalitions if any.

    5. Form coalitions including: the set of successful coalitions is not empty.

    6. Broadcast all: the set of proposed coalitions, the set of successful coalitions,
    and the servers in each coalition.

    7. Get a confirmation that its successor in the ring is ready to assume the role
    of rack leader at the next allocation slot.


    To select the set of coalitions most likely to be successful, the rack leader
    first determines the set of available servers $N_k$ and then selects the clusters
    sizes $n_i$ in the order of probability of success such that the condition expressed
    by Eq. (5.26) is satisfied.


    $\sum_{i} n_i \le N_k$.


    If this set does not include all $N_k$ available servers then clusters of size
    one or two are added. For example, if $N_k = 19$ and the clusters of sizes 3,
    5, 6 have the largest probability of success then the list of coalitions proposed
    is $\mathcal{L} = \{1, 1, 1, 2, 3, 5, 6\}$.'
