  md: 'The first step after typing in a program (or just a sub-unit of a program)
    is to compile the program. The compiling process converts the source code file
    you typed into machine language and is stored in an object file. This is known
    as compiling.


    With most systems, the object file is automatically linked with the system libraries.
    These libraries contain the code for the functions that are part of the languages
    library. (For example, the C libraries contain the code for the printf() function.)


    # 2.1 Compiler Errors-


    Every language has syntax rules. These rules determine what statements are legal
    in the language and which are not. Compiler programs are designed to enforce these
    rules. When a rule is broken, the compiler prints an error message and an object
    file is not created.


    Most compilers will continue scanning the source file after an error and report
    other errors it finds. However, once an error has been found, the compiler made
    be confused by later legal statements and report them as errors. This brings us
    to the first rule of compiler errors:


    # First Rule of Compiler Errors-


    > The first listed compiler error is always a true error; however, later errors
    may not be true errors.


    Succeeding errors may disappear when the first error is removed. So, if later
    error messages are puzzling, ignore them. Fix the errors to assure you are sure
    errors and re-compile. The puzzling errors may magically disappear when the other
    errors are removed.


    If you have many errors, the first error may scroll off the screen. One solution
    to this problem is to save the errors into a file using redirection. One problem
    is that errors are written to stderr not stdout using the > redirection operator
    uses.


    To redirect output to stderr using the 2> operator.


    # Here''s an example:


    ```

    $cc x.c 2>errors

    $more errors

    ```


    The compiler is just a program that other humans created. Often the error messages
    it displays is confusing (or just plain wrong!). Do not assume that the line that
    an error message refers to is always the line where the error actually resides.


    The compiler scans source files from the top sequentially to the bottom.'
