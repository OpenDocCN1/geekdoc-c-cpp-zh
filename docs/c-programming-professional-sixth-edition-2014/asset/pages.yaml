- img_proc: true
  md: "have different scope. Variable a in prn() has local scope every time prn()\
    \ is called the new copy of a will be generated.\n\n# Static storage class:-\n\
    \nStatic storage class should be used only when a program requires the value of\
    \ a variable to persist between different function calls like in recursive function.\
    \ The variable is declared as: static int b; Static variable will have local scope\
    \ and global lifetime.\n\nStatic variable are defined within individual functions\
    \ and therefore have the same scope as automatic variables. They are local to\
    \ the functions in which they are deault.\n\nThey retain their values throughout\
    \ the life of the program. Thus if a function is exited and then re-entered at\
    \ a later time, the static variables defined within that function will return\
    \ their former values.\n\n```\nvoid prn();\nmain()\n{\n    prn();\n    prn();\n\
    \    prn();\n}\nvoid prn()\n{\n    static int a=10;\n    a++;\n    printf(\"%d\
    \ \n\",a);\n}\nOutput: 11 12\n```\n\nIn the above example only a single copy of\
    \ variable a will be created and this single copy will be used every time prn()\
    \ is called, so it will increment the last function value of variable a.\n\n#\
    \ External storage class:-"
  merge: -1
  pgno: 279
- img_proc: true
  md: "Variable declared outside all the functions have external storage class. Extern\
    \ storage class should be used for only those variables which are being used by\
    \ all the functions in the programs, Now there is no need to pass a variable in\
    \ all the functions.\n\nBut it is also not advisable to store all the variables\
    \ as extern as it will remain active through the life of the program thus wasting\
    \ a lot of memory unnecessarily. The external variables are declared as int c;\
    \ It is also used when the variables of one program have to be used in some other\
    \ programs also **for example:-**\n\n# File1.c\n\n# File2.c\n\n```\n#include \"\
    File2.c\"\nint a; /*Variable definition */\nmain()\n{\n    a= 5;\n    func();\n\
    \    printf(\"%d\",a);\n}\n```\n\n```\nextern int a; /*Variable declaration*/\n\
    void func()\n{\n    a=10;\n}\n```\n\n**Output: 10** Variable a will get memory\
    \ in File1.c. Because it is outside the function so it is called as external variable\
    \ and its scope is global. It can also be used in other file File2.c. variable\
    \ a used in both files is same. But when we compile the File2.c we have to inform\
    \ the compiler that variable a will come from outside so we have declared a as\
    \ extern int a;(no memory allocation at this time), but if we declare it as int\
    \ a; then compiler will treat it as a new variable.\n\n# Register:-\n\nThere are\
    \ only 14 CPU registers available and even lesser than that can be used by us\
    \ the microprocessor is using. But the CPU registers are accessed by the computer\
    \ very fast and so the program is executed very fast. So, it will be best used\
    \ for loop counters which have to be used a number of times. However if a register\
    \ is not free, auto storage class is used and the execution is carried on. The\
    \ CPU registers are 2 bytes long. So their maximum range is equal to that int.\
    \ float values cannot be stored in register. Even if we register float x, auto\
    \ is assumed for x. The variable for this class are declared as,\n\n**register\
    \ int d;**\n\n# Summary:-\n\n| Default Value |\n|--- |"
