    int i=0;

    while(i<100)

    {

    printf("ni=%d",i);

    i=i+1;

    }

    system("pause");

    }

    ```


    In above example i=i+1 means: add 1 to i and then assign it to i or simply increase
    its value. As we saw earlier, there is a special operator in C programming language
    that does the same thing. We can use

    expression i++ instead of i=i+1.


