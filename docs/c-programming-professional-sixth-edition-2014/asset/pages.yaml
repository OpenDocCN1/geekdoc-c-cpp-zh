  md: 'Four steps are required in order to build any program in C. They are **save,
    compile, link, and run.** Most C programming language packages automatically perform
    the linking step,


    Whether or not it''s done manually, it''s still in there. Save! Saving means to
    save your source code. You create that source code in a text editor and save it
    as a text file with the C (single letter C) extension.


    Compile and link! Compiling is the process of transforming the instructions in
    the text file into instructions the computer''s microprocessor can understand.
    The linking step is where the instructions are finally transformed into a program
    file. (Again, your compiler may do this step automatically.)


    Run! Finally, you run the program you have created. Yes, it''s a legitimate program,
    like any one on your hard drive. You have completed all these steps in this chapter,
    culminating in the creation of the GOODBYEHARRY program. That''s how C programs
    are built.


    At this stage, the hardest part is knowing what to put in the source file, which
    gets easier as you progress through this book. (But by then, getting your program
    to run correctly and without errors is the hardest part!)


    You find the instructions to save, compile, and run often in this book. That''s
    because these steps are more or less mechanical. What''s more important understands
    how the language works. That''s what you start to find out in the next chapter.


