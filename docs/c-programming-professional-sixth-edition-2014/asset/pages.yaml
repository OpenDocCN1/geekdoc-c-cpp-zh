    # 4.3 Leaving characters in the input buffer -


    C input (and output) functions buffer data. Buffering stores data in memory and
    only reads (or writes) the data from (or to) I/O devices when needed. Reading
    and writing data in chunks is much more efficient than a byte (or character) at
    a time. Often the buffer has no effect on programming.


    One place where buffering is visible is input using scanf(). The keyboard is usually
    buffered. This means each line input is stored in a buffer. Problems can arise
    when a program does not process all data in a line, before it wants to process
    the next line of input. For example, consider the following code:


    ```

    int x;

    char st[31];

    printf("Enter an integer: ");

    scanf("%d", &x);

    printf("Enter a line of text: ");

    gets(st, 31, stdin);

    ```


    The gets() will not read the line of text that is typed in. Instead, it will probably
    just read an empty line. In fact, the program will not even wait for an input
    for the gets() call. Why? The scanf() reads all the characters needed that represent
    the integer number Why, but it leaves the ''\n'' in the input buffer. The gets()
    then starts reading data from the input buffer. It finds a ''\n'' and stops without
    any additional keyboard input.


    What''s the solution? One simple method is to read and dump all the characters
    from the input buffer until ''\n'' after the scanf() call. Since this is something
    that might be used in lots of places, it makes sense to make this a function.
