  md: "# # CHAPTER\n∞ 5 ∞\n(One Dimensional Array)\n\n# ## Introduction-\n\n**ARRAY\
    \ –** Array is a collection of similar data items or elements. Or we can say that\
    \ array is a collection of homogeneous data elements stored continuously under\
    \ a single name.\n\n**Need for an array –**\n\nWhen the number of variables of\
    \ same type and nature are more than it is difficult to handle them. So we need\
    \ an array. Let us understand the use of array with an example:\n\n```\nint i,a;\n\
    for(i=1;i<=5;i++)\n{\n    printf(\"Enter the no.\");\n    scanf(\"%d\",a);\n}\n\
    ```\n\nIn the above program as soon as the new value is assigned to the variable\
    \ a the old value is lost.\n\nThus all the variables that we have used so far\
    \ are not able to hold more than one value at a time. But sometimes we wish to\
    \ store more than one value for a variable. For example if we wish to arrange\
    \ the marks of 10 students in ascending order.\n\n**There are two ways for it:**\n\
    \n+   (i) Use of 10 different variables so that each variable can store"
