  md: 'Then it loads the file from the disk into the place in memory called buffer.


    It sets a character pointer which will point the first character in the buffer.


    # Need of buffer:


    The buffer is the temporary area in the memory of the computer where a file is
    kept for sometime so that it can be accessed quickly to read or write characters.
    It would be rather inefficient to every time go to the hard disk and read a character
    print it on the screen, then again go to the hard disk again to access next character.


    Here the buffer comes to use, whenever we open a file contents of the file copied
    to this temporary area and then read character by character from the buffer rather
    than from the disk and similarly to characters of the file one at a time on the
    disk would also be a wastage of time so buffer is used to write the characters
    and then they are transferred to the disk.


    The fopen() gathers information like file name, size of file and the mode to open
    the file then returns the address of this file to a pointer called fp. This can
    be explained as:


    ```

    FILE *fp;

    fp=fopen("file_name", "mode");

    ```


    here FILE is a constant defined in the header file stdio.h so it is compulsory
    to use

    #include<stdio.h>


    # Reading a file:


    The function getc() is used to read the contents of the file which has been brought
    to the buffer(partly or wholly) from the hard disk. getc() is used as:

    ch= getc(fp);


    fgets() is used to read the character from the current position of the pointer.
