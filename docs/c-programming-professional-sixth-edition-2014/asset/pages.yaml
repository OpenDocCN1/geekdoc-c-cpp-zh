    2. User defined data types (enumerator, typedef)

    3. Derived data types (array, function, pointers, structure, union)

    4. Empty data sets. (void)


    # Primary Data Types -


    | Integer | Real | Character |

    |---|---|--|

    | int or short or short int occupies 2 bytes- | float occupies 4 bytes-range:3.4e-38
    to 3.4e38 | char occupies 1 byte Range— |

    | -32768 to +32767 | double occupies 8 bytes-range:1.7e-308 to 1.7e+308 | -128
    to +127 |

    | long int or long occupies 4 bytes range: - | long double occupies 10 bytes —
    | |

    | -2,147,483,648 to+2,147,483,647 | range: 3.4e-4932 to 1.1e+4932 | |


    # Formula to calculate range -


    2ⁿ⁻¹

    Where n is the number of bits occupied by the data type.


    Range of int:

    int occupies 2 byte i.e. 16 bits ( since 1 byte is equal to 8 bytes)


    So, 2¹⁶⁻¹ = 2¹⁵ = 32768.'
