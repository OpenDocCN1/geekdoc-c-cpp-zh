  md: '# Limitations of array -


    +   1. The array formed will be homogeneous. That is in an integer array only
    integer values can be stored, while in a float array only floating values and
    character array can have only characters. Thus no array can have values of two
    data types.


    +   2. While declaring the array passing size of the array is compulsory, and
    the size must be either shortage or wastage of memory.


    +   3. Insertion or deletion of elements in an array will require shifting.


    +   4. The array does not check its boundaries: In C there is no check to see
    if the values entered in the array are exceeding the size of the array. Data entered
    with the subscript exceeding the array size will be simply placed outside the
    array, probably on the top of the data or the program itself.


    This will lead to unpredictable results, to say the least, and there will be no
    error message to warn the programmer of going beyond the array size. In some cases
    the program may hang. Thus the following program can give undesired result:


    ```

    int a[10];

    for(i=0;i<=20;i++)

    a[i]=;

    ```


