    }

    ```


    In above example, program accepts all input but omits the ''.'', '' character
    from it.

    The text will be echoed as you enter it but the main output will be printed after
    you

    press the enter key (which is equal to inserting a "\n" character) is pressed.
    As we told

    erlier this is because getchar() is a buffered input function.


    Whereas break forces an immediate exit from the nearest enclosing loop the

    continue keyword causes the next iteration of the loop.


    In the case of while and do loops, it jumps straight to the condition and

    re-evaluates it. In the case of for loop, it jumps onto the update part of the
    loop,

    executes that, then re-evaluates the condition.


