    Let us evaluate the output now: the binary equivalent of the number 5 will be
    0000 0000 0000 0101.


    As already said one''s complement converts all the 1s to 0s and all 0s to 1s.so
    the complement is 1111 1111 1111 1010 and converting the number to a decimal number
    will be—


    ```

    1*215+1*214+1*213+1*212+1*211+1*210+1*29+1*28+1*27+1*26+1*25+1*24+1*23-

