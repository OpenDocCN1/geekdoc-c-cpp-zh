    allow a large program to be broken down into a number of smaller contained components,
    each of which has a definite purpose. It avoids rewriting the code over & over.
    Breaking down of logic into separate functions make the entire process of writing
    & debugging easier.


    Another hand you can say Function is a self contained block of statements that
    is used to perform some task. A function is assigned some work once and can be
    called upon for the task number of times. Every C program uses some functions,
    the commonly used functions are printf, scanf, main, etc.


    Functions can be library functions or user defined functions. Library functions
    are those functions which come along with the compiler and are present in the
    disk. The user defined functions are those which the programmer makes by himself
    to make his program easier to debug, trace.


