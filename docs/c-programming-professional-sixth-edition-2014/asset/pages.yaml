    A useful technique for finding the cause of puzzling compiler errors is to delete
    (or comment out) preceding sections of code until the error disappears. When the
    error disappears, the last section removed must have caused the error.


    The compiler can also display warnings. A warning is not a syntax error; however,
    it may be a logical error in the program. It marks a statement in your program
    that is legal, but suspicious.


