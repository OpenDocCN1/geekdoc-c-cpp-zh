  md: '# Operators –


    Operators can be used to perform the required computations on the values.


    Types of operators: There are three types of operators:


    +   1. Unary Operator: Operators which work on one operand only.

    2. Binary Operator: Operators which work on two operands.

    3. Ternary Operator: Operators which work on three operands.


    # The Rule of Precedence -


    Each operator in C has precedence associated with it. This precedence is used
    to determine how an expression involving more than one operator is evaluated.


    There are distinct levels of precedence and an operator may belong to one of the
    levels. The operators at the higher level of precedence are evaluated first.


    # The Rule of Associativity -


    The operators of the same precedence are evaluated either from left to right or
    from right to left, depending on the level. This is known as the Associativity
    property of an operator. There are 45 operators in C:


    # Classes of operators:


    Operators are divided into mainly 9 classes:


    +   1. Arithmetic operator.

    2. Unary operators.

    3. Relational operators.

    4. Assignment operators.

    5. Equality operators.

    6. Logical operators.

    7. Conditional operators.

    8. Bitwise operators.'
