    After input by any user key or click the mouse to select the menu item. the keypress
    or mouse-click is known as an ''event'' as u know Visual Basic programming.the
    occurrence of this event is sensed by the keyboard or mouse driver. the device
    driver would now informed about it.


    Windows would in turn notify the application about the occurrence of this event
    of this particular event. this notification known as "message". thus the o.s has
    communicated with application.


    When application receive the message, communicated back with the o.s by calling
    a windows API function to display the string "wel come to EVC resch India" in
    this API function in turn communicates with the device driver of the graphics
    card that drives the screen, to display the string, thus there is a two-way communication
    between the o.s and the application.


    # 5.Event Driven Programming model.


    When a user interact with windows program a lot of events occur,for each event
    message is sent to the program and the program reacts to it.since the order in
    which the user would interact with the user-interface elements of the program
    can not be predicted the order of occurrence of events.'
