    # Jump statements (New Topic)-


    Loop performs a set of statements, till the condition becomes false. The number
    of times a loop is to be repeated is decided in advance and a condition is set.
    But sometimes it becomes necessary to skip certain part of the loop or terminate
    the loop if a particular condition is true then jump statements come to action:


    # C supports four jump statements:


    +   i. break.

    ii. continue.

    iii. goto.

    iv. return.


    break -

    The break statement is used inside a loop, to directly come out of the loop. We
    have already used break in switch statement. It is used to skip the execution
    of the loop any further and transfer the control of the program to the statement
    following the loop.


    continue-


    Sometimes it is necessary to skip the execution of the statement when certain
    condition is true. continue does not terminate the loop but jumps directly to
    the next iteration. In for loop continue brings the control to the next increment
    or decrement but in while or do loop continue causes the control of the loop to
    jump directly to the condition.


    goto-


    It is also used to jump from one part of the program to the other or exit from
    the deeply nested loop. But using goto is not a good practice because it makes
    the logic complicated and long programs unreadable.


    return -


    Used in a function to return some value and to jump from called function definition
    to calling function definition.'
