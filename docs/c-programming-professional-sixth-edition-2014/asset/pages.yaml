  md: '# History of C -


    C programming language is perhaps the most popular programming language. C was
    created in 1972 by Dennis Ritchie at the Bell Labs in USA as a part of UNIX operating
    system. C was also used to develop some parts of this operating system. 1960’s
    “Basic Combined Programming Language (BCPL) called B language was developed at
    Cambridge university.


    It was not fully satisfied language. ‘B’ language was modified by denies Ritchie
    was implemented at bell laboratory in 1972. C is generally supported by most compilers.
    C was developed by a system programmer Dennis Ritchie in 1972, at American Telegraph
    & Telecommunication (AT & T) Bell Laboratories in New Jersey USA.


    From that time C programming language has been the de facto programming language
    when fast programs are needed or the software needs to interact with the hardware
    in some way.


    Most of the operating systems like Linux, Windows™, and MacTM are either developed
    in C language or use of this language for most parts of the operating system and
    the tools coming with it.


    This course is a quick course on C Programming language. In our first lesson we
    will first write our C program. We will then learn about printing to screen, variables
    and functions. We assume that you are familiar with at least one of the popular
    operating systems.


    For this course you can use the following compilers or Programming Environments.


    +   - Gcc and cc in UNIX and Linux operating systems.


    +   - Borland C or Turbo C in DOS operating system or in Command line environment
    of windows operating system.


    +   - “Bloodshed Dev-Cpp” integrated development environment (IDE) gives you a
    complete and compact programming environment.'
