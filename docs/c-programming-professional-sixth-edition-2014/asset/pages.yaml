    1. If a[i]=i++ is undefined, then by the same resoni i+1 should also be undefined.
    But it is not so. Why?


    Answer: If an object is to be modified within an expression all accesses to it
    within the same expression must be for computing the value to be stored in the
    object. The expression a[i]=i++ is disallowed because one of accesses of i ( the
    one in a[i]) has nothing to do with the value that ends up stored in i.


    In this case the compiler may not know whether the access should take place before
