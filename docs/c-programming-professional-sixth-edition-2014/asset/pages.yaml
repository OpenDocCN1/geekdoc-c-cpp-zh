  md: '* It comes with “MinGW” and “GCC” Compilers and you should not need anything
    else for this course.


    # The C Development Cycle -


    Here is how you create a C program in seven steps in what’s known as the development
    cycle:


    +   1. Come up with an idea for a program.

    2. Use an editor to write the source code.

    3. Compile the source code and link the program by using the C compiler.

    4. Weep bitterly over errors (optional).

    5. Run the program and test it.

    6. Pull out hair bugs (optional).

    7. Start over (required).


    No need to memorize this list. It’s like the instructions on a shampoo bottle,
    though you don’t have to be naked and wet to program a computer. Eventually, just
    like shampooing, you start following these steps without thinking about it. No
    need to memorize anything. The C development cycle is not an exercise device.
    In fact, programming does more to make your body fit snugly into your chair than
    anything.


    Step 1 is the hardest. The rest fall naturally into place.


    Step 3 consists of two steps: compiling and linking. For most of this book, however,
    they are done together, in one step. Only later if you’re still interested do
    I go into the specific differences of a compiler and a linker.


    # From Text File to Program:


    When you create a program, you become a programmer. Your friends or relatives
    may refer to you as a “computer wizard” or “guru,” but trust me when I say that
    programmer is a far better title.


    As a programmer, your job is not “programming.” No, the act of writing a program
    is coding. So what do you when you sit down to write that program is code the
    program. Get to use that term! It’s very trendy.


    The job of the programmer is to write some code! Code to do what? And what type
    of code do you use? Secret code? Morse Code? Zip code?'
