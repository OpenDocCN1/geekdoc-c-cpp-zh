  md: '# Semicolon Warning ! -


    Avoid Semicolons After while . We have already seen problems can arise if a semicolon
    is placed after an if statement. A similar problem exists with loops, although
    it is more serious. With if the no op statement is potentially executed only once.
    With a loop it may be executed an infinite number of times.


