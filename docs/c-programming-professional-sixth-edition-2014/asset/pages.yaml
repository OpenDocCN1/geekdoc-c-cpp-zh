    # One''s complement operator:


    Also referred as the complementation operator. It is a unary operator that inverts
    the bits of the operand, i.e. all 0s become 1 and all 1s become 0s. The operand
    for the operator must always be an integer value(int, short int, long int, unsigned,
    char).


    ```

