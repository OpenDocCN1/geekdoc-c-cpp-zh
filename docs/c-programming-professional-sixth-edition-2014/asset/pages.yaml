    structure, unions, bit fields, typedef and enumerator. Unlike array these can
    be used to store the data of same or different type.


    # Structure -


    A Structure can be defined as a derived data type which can represent several
    different types of data in a single unit. Each individual data item within the
    structure is referred to as member.


    Structure is the method of packing the data of different types to organize the
    data in a more meaningful way. A structure definition creates a format that may
    be used to declare structure variable.'
