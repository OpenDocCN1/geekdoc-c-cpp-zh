    Mind Wash Drill –


    malloc is used allocate the memory of contiguous bytes. The request can fail if
    the memory space is not sufficient to satisfy the request. If it fails, it returns
    a NULL.


    Allocating multiple blocks (calloc) -


    Calloc is also a memory allocation function which is generally used to allocate
    memory for array and structure. malloc is used to allocate a single block of storage
    space, calloc allocates multiple blocks of storage, each of same size and initializes
    them with zero. The general syntax of calloc is:


    ```

    P=(cast type*) calloc(n, array size);

    P=(int*)calloc (10 , sizeof(int));

    ```


    Now let us see an e.g.:


    The above statement allocates contiguous space for 10 blocks, each of size 2 bytes(since
    int requires two bytes).


    All the bytes are initialized to zero and a pointer gets the starting address
    of the block allocated. Like malloc here also if the memory request cannot be
    fulfilled NULL returned.'
