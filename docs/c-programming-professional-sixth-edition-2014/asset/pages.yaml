    Answer: All declarations must be written in the manner shown below. Assume that
    the name of header file is FUNCS.H.


    ```

    #ifndef_FUNCS

    #define_FUNCS

    #endif

    ```


    Now if we include this file twice as shown below, it would get included only once.


    9. On inclusion, where are the header files searched for?


    Answer: If the header file is included using <> the files get searched in the
    predefined path(the path can also be changed). If included with the “ ” syntax
    in addition to the predefined path the file is also searched in the current directory(usually
    the directory from which you invoked the compiler).'
