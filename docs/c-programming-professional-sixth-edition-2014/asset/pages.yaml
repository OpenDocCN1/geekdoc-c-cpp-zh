    # (Programming Guidelines)


    Introduction-


    This Chapter explains how to write computer programs that work and that are understandable
    to other intelligent beings! This two attributes are not independent! In general,
    programs that other programmers cannot understand do not work very well. (Not
    to mention the fact that they are maintenance nightmares!)


    Writing structured programs (structured code and data!) helps greatly in debugging
    the code. Here is a quick review of some of the features of a structured program.


    +   1. Lots of well-defined functions!

    2. Using structured loop constructs (i.e., while and for) instead of goto.

    3. Using variables that have one purpose and meaningful names.

    4. Using structured data types to represent complex data.

    5. Using the ADT (Abstract Data Type) or OOP (Object-Oriented Programming) paradigm
    of programming.


    +   1. How to Start


    The most common types of mistakes when programming are:


    +   1. Programming without thinking.'
