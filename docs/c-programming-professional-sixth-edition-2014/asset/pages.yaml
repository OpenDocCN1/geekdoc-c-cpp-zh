  md: "It decides the default value of a variable (Zero value or garbage value). It\
    \ also decides the scope & lifetime of a variable. Scope indicates the region\
    \ over which the variable’s declaration has an effect or in other words that particular\
    \ variable can be used.\n\nThe four different kinds of scopes are global, function,\
    \ block and prototype.\n\n# There are 4 storage classes:-\n\n+   1. Automatic\
    \ storage class (auto)\n2. Static storage class (static)\n3. External storage\
    \ class (extern)\n4. Register storage class. (register)\n\n# Automatic storage\
    \ class:-\n\nVariable declared inside a function has by default automatic storage\
    \ class. It is initialized by garbage value.\n\n```\nThe declaration is given\
    \ as: int a or auto int;\nvoid prn();\nmain()\n{\n    int a=5;\n    printf(\"\
    %d \", a);\n    prn();\n    prn();\n    prn();\n}\nvoid prn()\n{\n    int a=10;\n\
    \    a++;\n    printf(\"%d \",a);\n}\n```\n\nOutput: 5 11 11 11\n\nHere in the\
    \ above example the two variables have the same name but they"
  merge: -1
