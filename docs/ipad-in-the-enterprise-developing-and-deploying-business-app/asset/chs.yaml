  \n[content]\n其次，企业可以创建并发布用户可以安装的设备配置文件。这些配置文件可以通过电子邮件发送到设备。（如果设备上尚未设置企业邮箱，则可以发送到个人邮箱地址。）您还可以让\
  \ iPhone 用户通过 `Safari` 导航到特定的网页，或者在短信息服务（SMS）中包含指向配置文件的网页链接。\n\n使用配置文件的优点非常多。安全和使用策略可以与特定的企业资源相关联。此外，可以对策略进行配置，使其无法被删除，或在获得系统管理员批准后才能删除。（企业应该注意，如果将配置文件安装在个人拥有的设备上，在某些司法管辖区可能是不法的。）使用通用配置文件的一个主要缺点是，它们没有与特定的用户或设备绑定，可以被未经授权的人员共享和使用。\n\
  \nIT 部门始终可以在每台设备上手动安装配置文件并为每个用户进行定制。这可以确保设备符合企业策略。然而，这是一项劳动密集型过程，可能只在涉及设备数量有限的情况下才可行。\n\
  \n设备配置的最终选项 SCEP 已被整合到 iPhone OS 3.0 中，但直到 Apple 在 iOS 4.0 中加入新的 MDM 功能后才真正变得流行。SCEP\
  \ 减少了基于 IT 的手动部署过程，并通过允许在注册和配置部署之前进行策略强制和用户验证来增强安全性。\n\n接下来的章节描述了 iPhone 用户为了与 SCEP\
  \ 服务交互而需要遵循的流程。请记住，由于 Apple 不提供实际的服务——只提供服务的规范——这是每个企业必须为自己的内部使用自行创建，或通过第三方供应商实现的。大多数\
  \ iOS MDM 供应商都支持用于注册的 SCEP，MDM 将将在第 20 章详细介绍。\n\n注册过程始于用户使用 `Safari` 导航到配置文件（配置）服务的\
  \ URL。用户可以手动输入网址，或点击发送到其设备的短信中的嵌入链接。一旦用户连接到配置文件服务，就需要对用户的身份进行验证。这也是 Apple 未提供的服务，因此部署组织必须创建它或使用第三方供应商提供的服务。可以使用任何身份验证机制，包括单次注册令牌、使用现有的身份提供程序（如\
  \ `Active Directory`）或您想要使用的其他方式，因为实现取决于您或第三方供应商。\n\n一旦用户身份通过验证，服务需要响应一个 iPhone\
  \ 配置文件（`.mobileconfig` 文件）。该响应包含先先共享的密钥或挑战令牌，以及在此时过程的身份验证阶段需要发送回服务器的一系列设备属性。该配置文件可以被设置为请求\
  \ iPhone OS 版本、唯一设备 ID (`UDID`)、MAC 地址、产品类型（iPad、iPhone 或 iPod touch）、手机 ID (`IMEI`）和\
  \ SIM 信息 (`ICCID`）。阶段 1 的流程概述于图 18-1。\n\n图 18.1：在阶段 1 中，SCEP 注册过程从设备与服务进行验证以请求注册开始，服务可以对该请求响应设备属性。\n\
  \n![18.1](img/c18f001.jpg)\n\n在设备接收到阶段 1 中生成的配置文件后，它会向用户显示提示，询问用户是否接受安装该配置文件。配置文件包含一个\
  \ SCEP 初始化负载，一旦接受，iPhone 将发送一个响应，该响应包含负载程序所请求的设备属性以及挑战令牌。响应使用 Apple 颁发的证书（使用设备的唯一身份）进行签名。该配置文件可以被设置为请求\
  \ iPhone OS 版本、唯一设备 ID (`UDID`)、MAC 地址、产品类型（iPad、iPhone 或 iPod touch）、手机 ID (`IMEI`）和\
  \ SIM 信息 (`ICCID`）。阶段 1 的流程概述于图 18-1。\n\n（注：由于原文中存在大量重复段落，此处译文已提取核心内容并去重。）\n\n在阶段\
  \ 1 中，SCEP 注册过程从设备与服务进行验证以请求注册开始，服务可以对该请求响应设备属性。\n\n（后续段落均为前述内容的重复，已根据“不要重复输出原文”的原则进行过滤，译文涵盖了所有唯一且逻辑的翻译内容。）\n\
  \n\n\n在 iOS 的语文中，“provisioning”（配置）一词通常带有不同的含义，当用于其他 IT 相关的语境时，其含义可能完全不同。在 iOS 中，描述文件（provisioning\
  \ profile）是一个带有 `.mobileprovision` 扩展的文件，用于签名和验证 iOS 应用程序。这一过程将在下一章中详细描述。\n\n然而，需要许多，除了通过\
  \ App Store 分发的 App 之外，任何通过临时（ad hoc）或企业发行模型分发的 App，都要求 iOS 设备上安装与签名应用程序时使用的相同的描述文件。空中下载安装包（Over-the-air\
  \ installation bundles）可以配置为单个软件包，将描述文件与应用程序本身一起嵌入到包中。但对于企业部署，将此分为两个步骤通常非常有价值，这可以为内部应用程序增加额外的安全层级；例如，可以允许描述文件仅由\
  \ MDM 服务器分发和安装。\n\n## 配置\n\n除了可以启动上述 `SCEP` 注册过程的初始配置方案，以及将在第 20 章中详细描述的 MDM 配置细节外，iOS\
  \ 配置方案中还可以包含许多不同类型的“有效负载”（payloads）。这些包括账户设置，例如：\n\n*   Exchange ActiveSync\n* \
  \  IMAP/POP 邮件\n*   VPN\n*   Wi-Fi\n*   LDAP\n*   CalDAV\n*   CardDAV\n*   订阅日历\n\
  \n它们还包括安全策略，例如：\n\n*   密码要求\n*   允许简单值\n*   要求字母数字\n*   密码长度\n*   复杂字符数量\n*   密码最大有效期\n\
  *   自动锁定前的时间\n*   重复使用前的唯一密码数量\n*   设备锁定的宽限期\n*   擦除前的失败次数\n*   允许用户移除配置方案\n\n此外设备设备限制，例如：\n\
  \n*   App 安装\n*   截屏\n*   漫游时自动同步邮件账户\n*   锁定时语音拨号\n*   应用内购买\n*   要求加密备份到 iTunes\n\
  *   iTunes 中的显式音乐和播客\n*   电影、电视节目、App 的内容分级\n*   YouTube\n*   iTunes Store\n*  \
  \ App Store\n*   Safari\n*   Safari 安全偏好\n\n其他设置包括：\n\n*   证书和标识\n*   网页剪辑（Web Clips）\n\
  *   APN 设置\n\n### 创建配置方案的选项\n\n配置方案主要可以通过四种方式创建：通过 iPhone 配置工具；通过生成自定义 XML 动态创建；通过\
  \ iPhone 配置工具使用 `C# .NET` 脚本进行编程创建；以及通过第三方工具。让我们深入这些不同的选项。\n\n## iPhone 配置工具\n\n\
  iPhone 配置工具（`iPCU`）如图 18.5 所示，是 Apple 提供的一个免费应用程序，适用于 Windows 和 Mac OS X 版本。无论是否将\
  \ `iPCU` 作为创建和管理配置方案的主要工具，对于负责 iOS 相关问题的 IT 管理员、应用程序开发人员或企业架构师来说，它都是不可或缺的工具。它可以查看设备上的控制台日志、在设备上安装或卸载\
  \ App，以及添加或删除描述文件。它还具有易用的视觉界面，用于创建和管理配置方案。再次，即使你不计划在生产环境中使用此工具创建或管理配置方案，它仍然是 iOS\
  \ 平台配置和管理能力的简单方法，并能快速学习哪些策略可以使用或不能使用。它还有助于学习如何策略性地构建“胡萝卜与大棒”（carrot-and-stick）场景。\n\
  \n图 18.5：iPhone 配置工具（`iPCU`）提供了一个管理设备、应用程序、描述文件和配置方案的视觉界面。\n\n![18.5](img/c18f005.jpg)\n\
  \n如图 18.6 所示，通过从 iPhone 配置工具左侧选项卡中选择“配置方案”，并从屏幕左上标签栏选择“新建”按钮，你可以轻松地创建一个新的配置方案。\n\
  \n图 18.6：`iPCU` 允许用户通过其图形界面轻松快速地创建配置方案。\n\n![18.6](img/c18f006.jpg)\n\n屏幕下方中间列的“有效负载”（payloads）列表包含了包含在配置方案中的所有不同类型的配置。\n\
  \n`General`（通用）负载关注配置方案的名称、描述和标识，它是唯一要求的负载，因为所有其他类型的负载都是可选的。`Name`（名称）是在设备上视觉显示的内容，因此它应该是自解释的且不要太晦涩。`Identifier`（标识符）对于每个配置方案都是唯一的，因此应该根据你想要采用的结构和管理方法为组织标准化命名规范。描述文件的\
  \ `Identifier` 字段应采用 `com.company.profile` 格式，并具有灵活性以允许根据所需的深度命名结构。如果你在现有方案之上安装具有相同标识符的不同方案，它将替换现有方案（顺便说，这是移除方案的唯一方法）。`Organization`（组织）是公司名称，`Description`（描述）应该用简单的语言描述包含的内容。这是用户被提示接受时显示的内容。最后，`Security`（安全）值允许配置方案，使其可以始终由用户移除、永远不允许用户移除，或仅通过密码经管理员批准后移除。\n\
  \n密码负载（图 18.7）允许各种 iOS 支持的与密码相关的安全策略作为配置方案的一部分进行配置。除了 `Restriction`（限制）包中提供的各种类型限制外，这是通过将特定的安全策略或限制与企业功能（如\
  \ `VPN` 或 `Wi-Fi`）绑定来构建“胡萝卜与大棒”型方案的方法。\n\n图 18.7：密码负载可以策略性地用于实施各种服务的“胡萝卜与大棒”策略。\n\
  \n![18.7](img/c18f007.jpg)\n\nExchange ActiveSync 负载（如图 18.8 中 `iPCU` 所示）允许组织配置用于与\
  \ Exchange 同步的邮件、日历和联系人。这些配置方案可以按特定的方式生成，使其针对用户，并嵌入活动目录域、`username` 和 `password`，或者可以将用户特定的安全区域留空，并提示用户输入这些信息。还需要记住，配置方案可以以签名或未签名的形式分发，虽然通过签名和加密配置方案来确保安全始终是一个良好的通用规则，但如果在方案中嵌入安全凭据，则是绝对必须的。\n\
  \n图 18.8：Exchange ActiveSync 负载可以提供包含域、用户名和密码的完整配置连接，或者可以将这些项目留空以提示用户输入。\n\n![18.8](img/c18f008.jpg)\n\
  \n\n\n\niOS 配置文件的一个非常强大但经常被误解的能力是部署 Web Clip（网页签）负载（在图 18.9 中的 iPCU 中所示）。Web Clip\
  \ 本质上是一个提供 Web 应用程序链接的图标。对于大多数用户来说，如果设计合理，该 Web 应用程序看起来与用户设备上安装的任何其他应用无异。Web Clip\
  \ 可以配置为全屏模式，这样用户看不到 Safari 屏幕顶部的地址栏或底部带有前进和后退按钮的工具栏。\n\n图 18.9 网页签在用户设备上放置一个指向特定\
  \ URL 的图标。\n\n![18.9](img/c18f009.jpg)\n\n同样值得注意的是，Web Clip 可以指向除 Safari 常用的 `http://`\
  \ 和 `https://` 之外的其他 URI 方案。例如，如果您的组织开发了一个在 iOS 设备上注册了名为 `acme://` 的自定义 URI 方案的内部应用，那么\
  \ Web Clip 可以指向 `acme://`，这将启动该自定义应用程序。然而，这种方法的真正威力在于可以通过类似于 `acme://sales/reports`\
  \ 或 `acme://accounts` 的链接，“深度链接”到您的自定义应用程序，通过 Web Clip 的多个图标指向单个原生 iOS 应用程序中不同类型的功能。这种方法的强大之处还源于，Web\
  \ Clip 可以通过 MDM 在无需用户参与的情况下推送到设备，而通过空中下载（the air）部署的内部应用则需要用户参与。\n\n## 构建 XML 文件\n\
  \n由于配置文件仅仅是遵循 Apple PLIST 格式且带有 `.mobileconfig` 文件扩展名的 XML 文件，因此编写自己的自定义应用程序来生成描述文件（provisioning\
  \ profiles）相对容易。例如，这可以用于用户自助门户，用户可以在其中登录、使用 `Active Directory` 进行身份验证、选择所需的任何功能、确认将应用的安全策略和限制，然后让服务生成适当的配置文件并提供链接以便在设备上安装。\n\
  \n这也可以作为自动化移动设备管理解决方案的一部分，因为某些 MDM 供应商提供自定义 API 以与他们的平台集成。你可以编写代码生成特定的配置文件，并通过 MDM\
  \ 解决方案程序化地将其推送到相应的设备。\n\n此外，这还可以作为中心化管理部署或硬件仓库设施的一部分，例如在这些设施中，可以将条码资产标签物理贴在设备上、扫描并插入台式电脑，然后动态生成并部署配置文件到\
  \ iOS 设备。\n\n配置文件简单的 XML 文件，可以作为几乎任何企业工作流或自动化系统的一部分程序化生成。因此，每个组织都要根据其特定需求设计相应的流程。下面是一个配置文件\
  \ XML 格式的示例。在 iPCU 中创建模板配置文件很容易，其中你可以程序化地替换所需的任何值，而无需从头创建整个 XML 文档。\n\n```\n <?xml\
  \ version=“1.0”=“UTF-8”?>\n<!DOCTYPE plist PUBLIC “-//Apple Inc//DTD PLIST 1.0//EN”\n\
  “http://www.apple.com/DTDs/PropertyList-1.0.dtd”>\n<plist version=“1.0”>\n     <dict>\n\
  \          <key>PayloadVersion</key>\n          <integer>1</integer>\n         \
  \ <key>PayloadUUID</key>\n          <string>Ignored</string>\n          <key>PayloadType</key>\n\
  \          <string>Configuration</string>\n          <key>PayloadIdentifier</key>\n\
  \          <string>Ignored</string>\n          <key>PayloadContent</key>\n     \
  \     <array>\n               <dict>\n                  <key>PayloadContent</key>\n\
  \                  <dict>\n                         <key>URL</key>\n           \
  \              <string>https://scep.acmecorp.com/scep</string>\n               \
  \          <key>Name</key>\n                         <string>EnrollmentCAInstance</string>\n\
  \                         <key>Subject</key>\n                         <array>\n\
  \                              <array>\n                                   <array>\n\
  \                                        <string>O</string>\n                  \
  \                      <string>Acme Corp</string>\n                            \
  \       </array>\n                              </array>\n                     \
  \         <array>\n                                   <array>\n                \
  \                      <string>CN</string>\n                                   \
  \   <string>User Device Cert</string>\n                                   </array>\n\
  \                              </array>\n                         </array>\n   \
  \                      <key>Challenge</key>\n                         <string>...</string>\n\
  \                         <key>Keysize</key>\n                         <integer>1024</integer>\n\
  \                         <key>Key Type</key>\n                         <string>RSA</string>\n\
  \                         <key>Key Usage</key>\n                         <integer>5</integer>\n\
  \                  </dict>\n                  <key>PayloadDescription</key>\n  \
  \                <string>Provides device encryption identity</string>\n        \
  \          <key>PayloadUUID</key>\n                  <string>fd8a6b9e-0fed-406f-9571-8ec98722b713</string>\n\
  \                  <key>PayloadType</key>\n                  <string>com.acmecorp.security.scep</string>\n\
  \                  <key>PayloadDisplayName</key>\n                  <string>Acme\
  \ Encryption Identity</string>\n                  <key>PayloadVersion</key>\n  \
  \                <integer>1</integer>\n                  <key>PayloadOrganization</key>\n\
  \                  <string>Acme Corp</string>\n                 <key>PayloadIdentifier</key>\n\
  \n                  <string>com.acmecorp.profile.scep</string>\n               </dict>\n\
  \          </array>\n     </dict>\n</plist>\n```\n\n## 通过 iPCU 程序化操作\n\niPhone Configuration\
  \ Utility 通过 `iPCUScripting.dll` 提供对 API 的程序化访问。为了通过访问 IntelliSense 代码自动补全简化开发，可以将此\
  \ DLL（位于 Windows Program Files 下 iPhone Configuration Utility 文件夹中）作为引用添加到 Visual\
  \ Studio 项目中。但为了使用脚本功能，必须将包含继承自 `IScript` 接口的类的 `.cs` 文件（如下代码段所示）在启动应用程序时作为命令行参数传递给\
  \ iPhone Configuration Utility 来执行。\n\n\n\n\n\n```cs\n using System;\nusing Com.Apple.iPCUScripting;\n\
  \npublic class TestScript : IScript\n{\n     private IApplication _host;\n     public\
  \ TestScript()\n     {\n     }\n     public void main(IApplication inHost)\n   \
  \  {\n       _host = inHost;\n       string message = string.Format(“Config profile\
  \ Count : {0}”,\n       host.ConfigurationProfiles.Count);\n       Console.WriteLine(message);\n\
  \       IConfigurationProfile profile = _host.AddConfigurationProfile();\n     \
  \  profile.Name = “Acme Corp Scripted Profile”;\n       profile.Identifier = “com.acmecorp.config”;\n\
  \       profile.Organization = “Acme Corp”;\n       profile.Description = “Acme\
  \ Corp Configuration Profile”;\n       // Passcode Payload\n       IPasscodePayload\
  \ passcodePayload = profile.AddPasscodePayload();\n       passcodePayload.PasscodeRequired\
  \ = true;\n       passcodePayload.AllowSimple = true;\n       // Restrictions Payload\n\
  \       IRestrictionsPayload restrictionsPayload =\n       profile.AddRestrictionsPayload();\n\
  \       restrictionsPayload.AllowYouTube = false;\n       // Wi-Fi Payload\n   \
  \    IWiFiPayload wifiPayload = profile.AddWiFiPayload();\n       wifiPayload.ServiceSetIdentifier\
  \ = “WPA Wi-Fi”;\n       wifiPayload.EncryptionType = WirelessEncryptionType.WPA;\n\
  \       wifiPayload.Password = “WPAWiFiPassword”;\n       wifiPayload = profile.AddWiFiPayload();\n\
  \       profile.RemoveWiFiPayload(wifiPayload);\n       // VPN Payload\n       IVPNPayload\
  \ vpnPayload = profile.AddVPNPayload();\n       vpnPayload.ConnectionName = “Acme\
  \ Corp VPN”;\n       vpnPayload = profile.AddVPNPayload();\n       profile.RemoveVPNPayload(vpnPayload);\n\
  \       // Exchange Payload\n       IExchangePayload exchangePayload = profile.AddExchangePayload();\n\
  \       exchangePayload.AccountName = “AcmeExchangeAccount”;\n       // Webclip\
  \ Payload\n       IWebClipPayload wcPayload = profile.AddWebClipPayload();\n   \
  \    wcPayload.Label = “Acme Corp App Catalog Web Clip ”\n       wcPayload = profile.AddWebClipPayload();\n\
  \       wcPayload.Label = “Acme Corp Default Web Clip”;\n     }\n}\n```\n\n## 注意\n\
  \n包含在这些 iPCU 脚本中的 C# .NET 代码并非预编译的，而是通过运行时使用 `Reflection.Emit` 编译的。\n\n### 使用第三方解决方案\n\
  \n除了使用 iPhone Configuration Utility（iPhone 配置实用程序）手动创建配置文件，或者通过生成 XML 或集成 iPCU API\
  \ 以编程方式创建外，还有许多第三方工具提供了管理控制台，以协助并简化创建配置文件的过程。大多数情况下，这些工具是大型 MDM（移动设备管理）解决方案的一部分，将在第\
  \ 20 章中介绍，该章节识别了十多个第三方供应商。由于 MDM 解决方案的主要用途之一是部署配置和强制安全策略，因此在 MDM 管理控制台内部生成 iOS 配置文件的能力，是在进行任何\
  \ MDM 评估和选择时都应该考虑的特性。\n\n## 总结\n\n在本章中，你研究了作为企业部署一部分的 iOS 设备的配置和置备过程。注册过程可以手动完成，也可以通过名为\
  \ `SCEP` 的过程自动完成。配置文件是配置 iOS 设备以及强制安全策略或使用限制的基础，并可以作为企业移动管理中“胡萝卜加大棒”方法的一部分进行策略性使用。配置文件还可以通过\
  \ iPhone Configuration Utility、XML 生成、C# .NET 脚本或第三方工具来创建。\n\n在下一章中，你将查看部署应用程序、管理更新以及促进内部应用程序空中部署（OTA）的的选项。\n\
  \n### 第 19 章：空中部署应用程序\n\n### 本章内容包括？\n\n*   使用 App Store 对比 Ad Hoc 对比企业级分发\n*  \
  \ 为内部应用创建内部目录\n*   促进应用的空中安装\n*   更新内部应用的管理\n*   使用第三方解决方案创建应用目录\n\n现在，你已经确定了最佳的硬件部署方法，并对设备进行了适当的安全加固和置备，现在是时候将软件部署到移动硬件上了。\n\
  \n首先，你将查看三种部署模型：用于通过 App Store 公开发分发应用程序、通过 Ad Hoc 部署进行私有测试，以及面向组织内部的企业级应用程序部署。\n\
  \n然后，你将查看使用 Apple 提供的特殊自定义 URI 方案结合基于 XML 的应用程序清单文件、二进制文件以及任何资源或元数据，实际在空中部署原生应用的机制。\n\
  \n你还将检查创建内部应用目录并部署它的不同方法，无论是通过 Web Clip（网络剪辑）还是作为原生应用程序。在应用程序部署之后，你将查看保持应用程序更新的不同方式。\n\
  \n虽然这是一种可以内部构建的能力，但也存在使用第三方供应商直接获取这些功能的选项。\n\n### 选择部署模型\n\n在部署 iOS 应用程序时，可以使用三种不同的部署模型：App\
  \ Store、Ad Hoc 和企业级。部署模型没有对错之分；它们都是各不相同的，而且事实上，大多数企业会结合使用这三者。理解每个模型及其工作原理至关重要，以便在任何情况下都能使用适当部署模型。\n\
  \n#### App Store\n\n如果你的应用程序目标用户是外部客户或业务合作伙伴，那么 App Store 部署模型可能适用于你的应用程序。为了通过 App\
  \ Store 分发应用程序，你必须拥有标准的 iOS 开发者账户。该账户每年费用为 99 美元，可以以个人或组织形式获取。\n\n应用程序可以通过 App Store\
  \ 分发，可以是免费的，也可以按预设价格出售。如果是付费应用，Apple 将保留 30% 的收入，开发者将获得 70% 的回报。对于免费应用，开发者除了 99\
  \ 美元的年费外，无需支付费用。\n\n应用程序通过公共 App Store 分发，并不意味着其内部的功能和数据是公开的。公司可以要求使用登录账户访问应用程序，并限制具有登录凭据的人（例如客户、业务合作伙伴或员工）访问。当然，为了获得在\
  \ App Store 分发的 Apple 批准，必须将应用提交 Apple 进行评估，并提供用户账户供其进行测试。此外，另一种流行方法是创建一个包含公共功能的应用程序，并在授权用户（如客户、业务合作伙伴和员工）使用时解锁额外的额外功能和能力。\n\
  \n#### Ad Hoc\n\n如果你的部署限制在 100 台设备或以下，那么 Ad Hoc 部署可能适用于你的应用程序。通常来说，Ad Hoc 部署最适用于测试，甚至可以向相对较少的用户试点应用程序。如果你正准备部署到\
  \ App Store，但想在提交给 Apple 审核之前部署应用进行测试，那么 Ad Hoc 是最佳选择。\n\n\n\n\n否则，如果你打算部署内部应用程序，那么企业级部署模型（Enterprise\
  \ deployment model）可能是更好的选择。以前，获取 iOS 企业开发者账户较为困难，因此许多小型组织在内部应用上使用 Ad Hoc 部署。随着苹果放宽了对企业账户的限制，对于大多数希望方便内部应用部署的组织来说，通过为每个设备注册以进行\
  \ Ad Hoc 应用部署而经历额外的繁琐步骤已变得不再必要。\n\n除了 100 台设备的限制外，Ad Hoc 部署模型最大的痛点在于，唯一设备标识符（`UDID`）必须通过开发者门户向\
  \ Apple 注册，以便生成用于“签名”应用程序包的描述文件（provisioning profile）。这意味着每当你想通过 Ad Hoc 部署模型向新设备部署应用程序时，你都必须获取设备的\
  \ `UDID`，通过开发者门户将其提交给 Apple，并生成新的描述文件。这为原本非常简单的应用部署过程增加了大量的开销。\n\n## 企业级 (Enterprise)\n\
  \n对于内部应用程序，企业级部署模型很可能是最佳方案。为了实现这一点，你必须拥有一个 iOS 企业开发者账户。（组织通常在标准的 iOS 开发者账户之外，可以并且经常拥有企业开发者账户。）该账户每年费用\
  \ 399 美元，并且需要一个可以与 Apple 通的法律联系人。在与许多大型法律部门部门时，这个过程可能需要几周甚至几个月，因此不要推迟从 Apple 采购企业开发账户的过程。\n\
  \n直到 2010 年底，Apple 对企业账户有一项限制，要求组织至少拥有 500 名员工。由于少于 500 名员工的公司唯一的备替代方案是使用限制 100\
  \ 台设备的 Ad Hoc 部署，许多许多中型组织在 iOS 内部应用开发和采用方面面临着巨大的障碍。但在 2010 年底，Apple 静静取消了这 500 名员工的限制，现在允许所有规模的公司获取企业开发者账户。\n\
  \n与 Ad Hoc 部署模型不同，企业级部署模型并不要求每个设备都向 Apple 注册，因为描述文件可以供组织内的设备使用，并不绑定特定设备。这是 Apple\
  \ 之前对获取企业开发者账户设置这么多限制的原因之一；它不希望非企业开发者利用它绕过 Apple 对 App Store 的审核流程。\n\n作为预防措施，Apple\
  \ 创建了一种机制，使得分发证书在应用程序首次运行时会自动与 Apple 服务器（`ocsp.apple.com`）验证。此响应会缓存几天，但随着时间的推移会定期查询，以便如果\
  \ Apple Determine iOS 企业开发者账户被滥用并违反了服务条款，它可以远程禁用所有使用该账户构建和部署的应用程序。\n\n## 构建应用目录\
  \ (App Catalog)\n\n在构建应用目录时，可以采取许多不同的方法。当然，部署应用并不需要目录，但随着大多数企业的移动性策略趋于成熟，它们的应用程序库几乎会包含多个应用，无论是通过\
  \ App Store 公开提供，还是作为内部企业应用通过空中下载（OTA）私有部署。\n\n你的应用目录可以是指向企业应用空中安装包的链接，以及指向 iTunes\
  \ App Store 链接的组合。认识这一点很重要，因为大多数企业将同时拥有内部应用和现成应用（如第 5 节所述）。应用目录可以提供类似于 Apple App\
  \ Store 的体验，但也可以为自定义的内部应用以及公司批准或推荐的应用列表提供公司品牌化的体验。此外，正如第 5 节所述，目前公司还没有办法批量购买付费应用程序的版本，但作为通通方案，大多数企业软件供应商采取的做法是在\
  \ App Store 上让客户端 iPad 应用程序免费，而服务器或云端服务则单独授权。\n\n在任何情况下，应用目录可以是 Web 快捷方式（Web Clips，可以通过配置描述通过空中下载部署并通过移动设备管理（`MDM`）推送，提供链接到基于\
  \ HTML 的网络应用的图标），也可以是原生企业应用。如果应用目录以原生应用的形式交付（如图 19.1 所示），用户必须通过点击链接（在电子邮件、短信 `SMS`\
  \ 或网页中）来安装，并在提示时接受安装，而 Web 快捷方式方法可以通过配置描述和 `MDM` 在后台“推送”到设备，而不需要任何用户参与。\n\n[图 19.1]:\
  \ 你的内部应用目录可以是部署为 Web 快捷方式的移动网站，也可以是此处所示原生 iOS 应用。\n\n![19.1](img/c19f001.jpg)\n\n\
  ## 使用空中下载部署 (Over-the-Air Deployment)\n\n虽然 Apple 的文档关注空中下载适用于企业级部署模型，但这一过程在 Ad\
  \ Hoc 部署模型中的工作方式完全相同。\n\n这一过程通过一个名为 `itms-services` 的自定义 URI 方案实现，它代表 iTunes 音乐商店协议。在此自定义\
  \ URI 方案下，用户导航到一个带有查询字符串参数的 URL，其中 `action` 设置为 `download-manifest`，另一个查询字符串属性 `url`\
  \ 设置为应用程序的 PLIST 格式 XML 清单的完全限定 URL。用户将看到一个请求许可安装应用程序的屏幕。\n\n此 `itms-services` URL\
  \ 可以发送在电子邮件或短信中，或者简单地从网站或原生应用内部进行链接。以下是将 URL 嵌入 HTML 链接的示例：\n\n```html\n<a href=\"\
  itms-services://action=download-manifest&url=http://example.com/manifest.plist\"\
  >安装应用</a>\n```\n\n清单文件（manifest file）必须是一个遵循 Apple 属性列表（`PLIST`）语法的 XML 文件，用以描述通过空中下载部署的应用程序的各种属性、特性和元数据。这些信息用于为设备提供方便安装应用程序所需的所有信息，以及作为请求许可的提示部分显示给用户的适当元数据。该\
  \ XML 文件可以是位于 Web 服务器上的静态文件，也可以用 PHP、Java、ASP.NET 或任何其他 Web 服务器语言或技术动态生成。这是一个清单文件示例：\n\
  \n\n\n\n\n```xml\n <!DOCTYPE plist PUBLIC “-//Apple//DTD PLIST 1.0//EN”\n“http://www.apple.com/DTDs/PropertyList-1.0.dtd”>\n\
  <plist version=“1.0”>\n<dict>\n     <!-- 如果要捆多个应用，则为下载项数组 -->\n     <key>items</key>\n\
  \     <array>\n          <dict>\n               <!-- 要下载的资源数组 -->\n            \
  \   <key>assets</key>\n               <array>\n               <!-- software-package:\
  \ 要安装的 ipa。 -->\n               <dict>\n               <!-- 必需。资源的类型。 -->\n    \
  \           <key>kind</key>\n               <string>software-package</string>\n\
  \               <!-- 可选. 每 n 字节计算一次 md5。如果\n               md5 失败则将重启块。 -->\n  \
  \             <key>md5-size</key>\n               <integer>10485760</integer>\n\
  \               <!-- 可选。 每个“md5-size” \n               大小块的 md5 哈希值数组。 -->\n   \
  \            <key>md5s</key>\n               <array>\n               <string>41fa64bb7a7cae5a46bfb45821ac8bba</string>\n\
  \               <string>51fa64bb7a7cae5a46bfb45821ac8bba</string>\n            \
  \   </array>\n               <!-- 必需。要下载的文件 URL。 -->\n               <key>url</key>\n\
  \               <string>http://www.acmecorp.com/apps/sales.ipa</string>\n      \
  \         </dict>\n               <!-- display-image: 下载期间显示的 \n               \
  \     图标。-->\n               <dict>\n                    <key>kind</key>\n     \
  \               <string>display-image</string>\n                    <!-- 可选。表示图标是否需要应用闪\n\
  \                    效果。-->\n                    <key>needs-shine</key>\n      \
  \              <true/>\n                    <key>url</key>\n                   \
  \ <string>http://www. \nacmecorp.com/salesicon.57x57.png</string>\n            \
  \   </dict>\n               <!-- full-size-image: iTunes 使用的 \n                \
  \    512x512 大图标。 -->\n               <dict>\n                   <key>kind</key>\n\
  \                   <string>full-size-image</string>\n                   <!-- 可选。整个文件的一个\
  \ md5 哈希。 -->\n                   <key>md5</key>\n                   <string>61fa64bb7a7cae5a46bfb45821ac8bba</string>\n\
  \                   <key>needs-shine</key>\n                   <true/>\n       \
  \            <key>url</key><string>http://www. \nacmecorp.com/salesimage.512x512.jpg</string>\n\
  \               </dict>\n               </array><key>metadata</key>\n          \
  \     <dict>\n                    <!-- 必需 -->\n                    <key>bundle-identifier</key>\n\
  \                    <string>com. acmecorp.sales</string>\n                    <!--\
  \ 可选（仅限软件） -->\n                    <key>bundle-version</key>\n                \
  \    <string>1.0</string>\n                    <!-- 必需。下载的类型。 -->\n            \
  \        <key>kind</key>\n                    <string>software</string>\n      \
  \              <!-- 可选。下载期间显示；通常为 \n                    公司名称\n                -->\n\
  \                    <key>subtitle</key>\n                    <string>Acme Corp</string>\n\
  \                    <!-- 必需。下载期间显示的标题。 -->\n                    <key>title</key>\n\
  \                   <string>Acme Sales</string>\n              </dict>\n       \
  \  </dict>\n     </array>\n</dict>\n</plist>\n```\n\n### 管理应用更新\n\n与自动促进更新过程的 Apple\
  \ App Store 不同，内部企业应用部署负责管理自身的更新。由于每个应用程序都使用有效期仅为一年的企业证书签名，因此随着时间的推移，会有更新应用程序的需求。此外，iOS\
  \ 的更改可能需要更新应用以利用新功能和能力。\n\n因此，内部应用目录和内部应用本身都应该跟踪应用版本情况并相应地管理更新。例如，可以对每个内部应用进行程序检查是否有更新版本，如果发现新版本，则提示用户安装。可以采取这种方式：让用户选择是否升级，或者让应用程序在安装更新版本之前阻止被使用。\n\
  \n在更新应用时，出于几个原因，更新后的应用使用相同的应用程序包标识符（`com.example.app`）非常重要。如果不同，两个应用都将留在设备上，用户可能很难判断哪个是哪个应用。此外，存储在应用沙盒中的任何数据都是与包标识符相关联。如果在一个具有相同包标识符的现有应用上安装应用更新，则沙盒内包含的所有应用和用户数据将保持完\
  \ way。如果用户在安装更新版本之前先删除了应用，那么所有数据将丢失。向您的用户清晰地沟通这一点非常重要。\n\n虽然可以通过自定义代码实现，但也有许多第三方供应商既提供了预构建应用目录模板中的逻辑，也提供了软件开发工具包（SDK），可以嵌入自定义的内部应用中以自动检测并管理更新。例如，Apperian\
  \ 的应用目录如图 19.2: 管理应用更新是每个企业的责任，因此你可以在内部构建该能力，也可以使用第三方解决方案。\n\n![19.2](img/c19f002.jpg)\n\
  \n### 使用第三方解决方案\n\n除了自己构建应用目录的选择外，还有使用第三方供应商解决方案的选项。有很多提供企业应用目录产品的供应商。其中大多数供应商将应用目录作为整体移动设备管理（MDM）产品的一部分，但也有独立的产品。MDM\
  \ 供应商将在下一章进行详细讨论，但对于独立的应用目录供应商，让我们深入研究一家名为 Apperian 的公司的领先产品，本章中已经提到过。\n\nApperian\
  \ 的产品（图 19.3: Apperian 提供了一个用于管理内部企业 iOS 应用部署的云端平台。\n\n![19.3](img/c19f003.jpg)\n\
  \n基于 Web 的管理控制（如图 19.4: Apperian 的 Web 端应用管理控制允许系统管理员上传和组织应用程序。\n\n![19.4](img/c19f004.jpg)\n\
  \n\n\n\n输入到基于 Web 的管理台的信息会被动态提供给 iOS 设备上运行的应用程序目录（见图 19.5）。这提供了与 Apple App Store\
  \ 相似的体验，不同在于它是由企业而非 Apple 控制和管理的。用户可以报告问题，这些问题将直接路由到相应的企业支持人员。\n\n图 19.5: Apperian\
  \ 可自定义的企业应用程序目录提供了与 Apple 自己的 App Store 相似的用户体验。\n\n![19.5](img/c19f005.jpg)\n\n\
  与 Apple App Store 一样，内部应用程序可以分为不同的类别。根据当前身份验证用户的权限，Apperian 的解决方案（如图 19.6 所示）仅显示当前用户有权限安装的应用程序类别。\n\
  \n图 19.6: 可以在 Apperian 的应用程序目录内按类别组织和查看应用程序。\n\n![19.6](img/c19f006.jpg)\n\nApperian\
  \ 解决方案提供的一个独特功能是可以集中管理和部署媒体文件的能力，如图像、视频、文档或与自定义内部应用程序关联的自定义文件格式文件（如图 19.7 所示）。这可以帮助组织保持内容更新，并在用户需要的时间和地点将内容分发给他们。\n\
  \n图 19.7: Apperian 应用程序目录提供的独特功能是能够将媒体和内容推送到 iOS 设备，以便用户消费。\n\n![19.7](img/c19f007.jpg)\n\
  \nApperian 只是许多供应商中的一个，它们提供的功能内部开发可以相对简单。在下一章中讨论的许多 MDM 供应商都提供了非常相似的功能和能力，但如果你选择不包含应用程序目录功能的\
  \ MDM 方案，那么 Apperian 是值得考虑的选项。\n\n## 总结\n\n一旦你开发了内部企业应用程序并部署了硬件，你就需要在用户的设备上安装软件。这种目标可以通过三种方式实现：App\
  \ Store、Ad Hoc（即时发布）或企业部署模型。根据应用程序和具体情况，这三个模型中的任何一个都可能是合适的选择，大多数组织将结合使用这三者。此外，由于大多数公司会部署多个内部应用程序，为你的用户提供内部目录可以提供巨大的价值，并赋予用户与\
  \ Apple 自己的 App Store 相当的自服务能力。促进应用程序的部署和更新是一个相对简单的过程，但你不必重新发明轮子，因为有许多第三方供应商提供了预构建的解决方案来实现这一目标。\n\
  \n在下一章中，你将深入涉及移动设备管理的概念和供应商。其中许多相同的第三方供应商也将提供本章讨论的应用程序目录功能。\n\n### 第 20 章：管理和安全部署\n\
  \n### 本章内容提要\n\n* 使用 Exchange ActiveSync 强制执行安全策略\n* 理解 Apple 的 iOS MDM API 如何工作\n\
  * 支持 Apple iOS API 的第三方 MDM 供应商\n* MDM 供应商如何提供差异化？\n* 根据你的特定需求评估 MDM 供应商\n\n在过去的几章中，你已经检查了部署规划和选择合适方法的过程。你研究了设备置备和配置的细节，以及将应用程序部署到移动设备的不同方法。\n\
  \n现在在本章中，为了完成书中关于部署的章节，你将检查有关管理和安全 iPad 等 iOS 设备部署的细节。\n\n首先，你将查看管理 iOS 设备的两种主要方法：通过强制执行安全策略以及对设备执行操作（例如在设备丢失或被盗时进行远程擦除设备）。这些基本的管理功能可以由\
  \ Exchange ActiveSync (EAS) 和 Apple 的 iOS MDM 应用程序接口 (API) 同时提供。EAS 提供了更基础的功能，而\
  \ MDM 则提供了更高级的能力。\n\n你将深入研究 Apple iOS MDM 能力的细节及其实际工作原理，并查看在该行业中提供服务的数十家第三方供应商列表。由于供应商受限于\
  \ Apple 为其提供的 API，来自不同供应商的各种产品的大多数功能非常相似，因此我们将检查供应商及其各种产品之间的主要差异领域。\n\n## 使用 Exchange\
  \ ActiveSync\n\n正如书中之前讨论的，过去几年移动行业最有趣的进展之一是整个行业在 Exchange ActiveSync (EAS) 上实现了服务器端和移动设备之间通信及协作数据同步的标准化。\n\
  \n除了向 iOS 设备提供邮件、日历和联系人的推送同步外，EAS 提供了提供了强制执行安全策略的能力，以及在设备丢失或被盗时远程擦除设备的能力。尽管 EAS\
  \ 提供的功能或能力不如 Apple MDM API 多，但 EAS 可能提供了足够的功能，让某些组织对 iOS 的安全性感到放心。\n\n### 强制执行策略\n\
  \n当策略应用于 Exchange ActiveSync 时，用户将被强制遵守该策略，否则他们将无法将设备连接到 Exchange 服务器进行同步。在某些情况下（例如要求密码或建立特定的密码复杂性），用户将收到提示配置其设备。其他策略（如要求设备加密）完全取决于设备硬件（在那种特定情况下，仅允许具有硬件加密的\
  \ iOS 设备连接，包括所有 iPad 和 iPhone 3GS 及更新机型，但不包括较旧的 iOS 设备）。\n\n适用于 Exchange Server\
  \ 2003 SP2 的 Exchange ActiveSync (EAS) 支持在 iOS 设备上强制执行几项基本策略：\n\n* 在设备上强制执行密码 (`DevicePasswordEnabled`)\n\
  * 最小密码长度 (`MinDevicePasswordLength`)\n* 最大密码尝试失败次数 (`MaxDevicePasswordFailedAttempts`)\n\
  * 密码需要同时数字和字母 (`AlphanumericPasswordEnabled`)\n* 不活动时间分钟 (`MaxInactivityTimeDeviceLock`)\n\
  \n此外，适用于 Exchange Server 2007 SP1 和 Exchange Server 2010 的 Exchange ActiveSync (EAS)\
  \ 支持在 iOS 设备上强制执行许多额外策略：\n\n* 在设备上强制执行密码 (`DevicePasswordEnabled`)\n* 禁止使用简单密码 (`AllowSimpleDevicePassword`)\n\
  * 密码过期天数 (`DevicePasswordExpiration`)\n* 密码历史 (`DevicePasswordHistory`)\n* 密码中复杂字符的最数量\
  \ (`MinDevicePasswordComplexCharacters`)\n* 漫游时要求手动同步 (`RequireManualSyncWhenRoaming`)\n\
  * 允许相机 (`AllowCamera`)\n* 允许网络浏览器 (`AllowBrowser`)\n* 同步邮件的最大年龄 (`MaxEmailAgeFilter`)\n\
  * 要求设备加密 (`RequireDeviceEncryption`)\n\n虽然 EAS 支持比这些更多的策略，但这里列出的是目前 iOS 支持的所有 EAS\
  \ 策略。\n\n### 远程擦除\n\n\n\n\n\n除了强制安全策略外，`EAS` 还提供了一种在设备丢失或被盗时的远程擦除机制。请记住，这将擦除整个设备，包括所有应用程序、数据、图片、视频、音乐以及任何其他内容，无论是个人还是业务相关的。由于删除个人所有设备上的个人内容和数据可能涉及潜在法律责任，许多组织要求用户签署法律协议，承认公司有权远程擦除设备（包括任何个人信息）。\n\
  \n## 使用移动设备管理\n\n对于许多组织而言，`EAS` 提供的设备管理功能无法满足安全合规性要求。Apple 听取了企业社区的意见，并在 `iOS 4.x`\
  \ 中引入了许多 `MDM APIs`，为企业 IT 组织提供了比以前多得多的控制。在此过程中，市场上出现了数十个第三方 `MDM` 供应商。由于这些供应商受到\
  \ Apple 提供的 `iOS MDM APIs` 能力的限制，许多组织发现确定各种 MDM 解决方案和供应商之间的具体差异时，MDM 领域令人困惑。为了消除这些困惑，让我们来看看\
  \ Apple 的 MDM 功能在 `iOS` 上是如何工作的。\n\n## 理解 MDM\n\nApple 的 `iOS MDM APIs` 基于一个相对简单的架构。与其它移动平台上使用的许多早期设备管理架构不同，Apple\
  \ 决定复用相同的统一 Apple 推送服务 (`APNS`)。这是应用程序开发者可以使用其向单个用户设备发送推送通知的通道，同时也驱动了 Apple `FaceTime`\
  \ 服务的通信启动。\n\n一旦设备在 MDM 服务器上注册，该服务器就可以通过 `APNS` 发送特定设备的通知来应用配置策略、进行管理更改或查询设备属性。当设备接收到推送通知时，它会收到一条来自\
  \ `MDM server` 请求联系的消息。该 MDM 过程不像其他推送通知那样显示消息，而是在后台静静运行的。\n\n当设备接收到来自 `MDM server`\
  \ 的请求时，它会打开一个到 `MDM server` 的连接，并请求 `MDM server` 等待它的任何内容。这可能包括一组管理请求、待应用的配置或描述文件，或需要响应的查询。此过程如图图\
  \ 20.1 所示。\n\n图 20.1：为了节省电池电量并提高整体效率，Apple 的 MDM 方法不包含一个独立的设备管理“代理”，而是使用现有的 Apple\
  \ 推送服务。\n\n![20.1](img/c20f001.jpg)\n\n需要注意的是，配置策略、查询和响应并不通过 Apple 推送服务传输。`APNs`\
  \ 仅作为触发器，让设备知道需要联系 `MDM server`。\n\n## 注册\n\nMDM 注册过程通常遵循第 18 节描述的相同的简单证书注册协议 (`SCEP`)。不过，部署的不是像\
  \ `EAS` 或 `VPN` 那样的特定服务配置，而是一个包含 MDM 负载的配置配置文件。然后，在设备注册到 MDM 后，`MDM server` 就可以向设备推送并管理任何额外的配置配置文件。\n\
  \n## 配置\n\n一旦 iOS 设备注册了 MDM，管理服务器就有了通过添加或删除配置文件来配置设备的能力。这些配置文件与第 18 节中讨论的完全相同，不同之处在于通过\
  \ MDM 部署时，用户不会收到提示，且配置文件可以在后台静默应用和更新，对用户来说是透明的。\n\n## 查询\n\n除了管理配置和描述文件外，`iOS MDM\
  \ APIs` 还允许 `MDM server` 查询设备硬件、通信信息、合规与安全以及应用程序数据的许多属性。\n\n### 设备信息：\n\n* 唯一设备标识符\
  \ (`UDID`)\n* 设备名称\n* `iOS` 版本和内部版本\n* 型号和编号\n* 序列号\n* 容量和可用空间\n* 国际设备识别码 (`IMEI`)\n\
  * 调制器固件\n\n### 通信信息：\n* 卡 ID (`ICCID`)\n* 蓝牙和 Wi-Fi MAC 地址\n* 当前运营商网络\n* 用户模块 (`SIM`)\
  \ 运营商网络\n* 运营商设置版本\n* 电话\n* 数据漫游设置（开启/关闭）\n\n### 合规与安全信息：\n* 已安装的配置文件\n* 带有过期的安装证书\n\
  * 所有强制执行的限制列表\n* 硬件加密能力\n* 是否设置密码\n\n### 应用程序信息：\n* 已安装的应用程序（应用 ID、名称、版本、大小以及应用数据大小）\n\
  * 带有过期的安装描述文件\n\n## 管理\n\n最后，`iOS MDM APIs` 允许对设备执行几项重要的管理操作：远程擦除、远程锁定和清除密码，以及应用配置和描述文件的能力。\n\
  \n### 远程擦除\n\n虽然大多数 iOS 部署也会使用 `EAS`，但重要的是，这种远程擦除能力是独立于 `EAS` 远程擦除能力的。这一点很重要，因为经常需要基于任务的\
  \ iPad 部署或共享设备，此时 `EAS` 并不适用，但远程擦除设备的能力至关重要。\n\n### 远程锁定\n\n如果远程设备放置、丢失或被盗且尚未设置密码，可以远程应用密码以防止他人访问设备中包含的信息。\n\
  \n### 清除密码\n\n用户偶尔会忘记密码，如果设备配置为在失败尝试次数后自擦除，那么允许 IT 集中重置单个用户的密码将非常有价值。\n\n### 应用配置和描述文件\n\
  \n配置文件可以在后台静默地应用和从受管的设备上移除，而不会提示用户。正如第 18 节所述，配置文件可以包含负载，包括帐户设置、安全策略、设备限制、证书和 Web\
  \ 快捷方式。此外，注册了 MDM 的设备可以被添加或移除企业描述文件——这些配置文件必须存在设备上，以便让内部企业应用能够运行。\n\n### 第三方供应商\n\
  \n移动设备管理市场近期经历了爆发式增长。因此，目前开发和创新的速度非常快，并且这种趋势在可预见的未来可能会持续。在市场趋于成熟以及我们看到 MDM 供应商进行某些整合之前，仅仅跟进行业的所有进展可能就是一项全职工作。因此，此列表并不是\
  \ iOS MDM 供应商的详尽列表，而且随着明确的领导者的出现以及其他大型软件公司决定通过收购进入该领域，此处列出的许多供应商很可能会发生合并。\n\n由于该行业正经历如此快速变化，书中将不会涵盖每个供应商解决方案的功能特性，因为这些内容会很快过时。每个供应商的列表都包含一个自述。在供应商列表之后是一组用于评估和比较供应商的标准，用以确定适合贵组织的解决方案。\n\
