  \n图 5.38: 使用 iPad 版 `DocuSign`，你可以随时随地发送、跟踪和签署文档。\n\n![5.38](img/c05f038.jpg)\n\n\
  # IT 管理\n\n信息技术专业人员也需要应用程序，App Store 中有很多现成的可用应用。从安全监控、远程服务器访问到网站管理和 `FTP` 客户端，iPad\
  \ 有许多功能强大的应用程序；这里是其中最受欢迎的一些。\n\n## MobileIron Sentry\n\n`MobileIron Sentry` 是一种针对管理员的强大移动设备管理解决方案\
  \ (图 5.39)。该应用程序提供图形图表和图，以视觉化的方式表示网络安全威胁。第 20 章将进行更详细的介绍。\n\n图 5.39: `MobileIron\
  \ Sentry` 让管理员可以看到网络上的实时安全威胁。\n\n![5.39](img/c05f039.jpg)\n\n## Wyse PocketCloud\n\
  \n有时你只需要运行 Windows 程序，有了 `Wyse PocketCloud` (图 5.40)，就不需要放下 iPad 了。该应用程序允许用户从 iPad\
  \ 远程访问他们的桌面电脑。使用桌面协议 (`RDP`)，用户可以连接到 Windows 电脑，并像身处现场一样使用它。\n\n图 5.40: `Wyse PocketCloud`\
  \ 提供远程桌面和 `RDP` 客户端，让用户通过 iPad 控制基于 Windows 的电脑和应用程序。\n\n![5.40](img/c05f040.jpg)\n\
  \n## iSSH\n\n如果你是服务器管理员，很有可能经常要进行 Secure Shell (`SSH`)、`Telnet` 和虚拟网络计算 (`VNC`)\
  \ 操作。通过 `iSSH` (图 5.41)，你可以完成所有这些甚至更多，在随身携带 iPad 的任何地方保持高效工作。\n\n图 5.41: `iSSH`\
  \ 通过 iPad 无线连接提供 `SSH`、`Telnet` 和终端连接。\n\n![5.41](img/c05f041.jpg)\n\n## Gusto\n\
  \n`Gusto` (图 5.42) 让使用 iPad 的 Web 开发人员能够管理 Web 设计和开发工作流，并随时随地更改网页内容。网站内容可以在本地更新和预览。可以同时管理多个项目，并通过内置的\
  \ `FTP`/`SFTP` 客户端发布内容。\n\n图 5.42: Web 开发者可以使用 `Gusto` 通过 iPad 维护他们的网站。\n\n![5.42](img/c05f042.jpg)\n\
  \n## FTP On The Go PRO\n\n无论你是在管理服务器、更新网站还是往回传输文件，有时在移动时需要使用 `FTP`。`FTP On The Go\
  \ PRO` (图 5.43) 允许用户通过 `FTP` 或 `SFTP` 从 iPad 下载、查看、修改和上传文件。\n\n图 5.43: `FTP On The\
  \ Go PRO` 让用户能够使用 `FTP` 在任何地方访问他们的文件。\n\n![5.43](img/c05f043.jpg)\n\n# 跳过 App Store\
  \ 购买的替代方案\n\nApp Store 中的现成应用程序可以满足你的许多需求，但如果你需要进行某些特定的更改，例如与后端系统的自定义集成、添加额外的数据加密或支持单点登录模型，你确实有其他选择。你可能会接触\
  \ App 开发者，许可该应用程序用于企业内部应用分发，从而绕过 App Store。\n\n虽然并不是每位开发者都愿意参与此类安排，但许多 App Store\
  \ 应用程序开发者乐意为特定组织创建定制版本，并通过内部企业部署模型进行部署。他们甚至愿意通过源代码或静态库向你许可他们的应用程序，以便你自行进一步定制应用程序，或者可能将它们的功能包含在自己的自己的自定义内部应用中。\n\
  \n例如，Microsoft SharePoint 客户端 `SharePlus` 的开发者 SouthLabs 为企业客户提供了多种许可选项，用于自定义品牌和其他应用程序定制、高级客户支持以及企业内部企业应用部署。\n\
  \n# 现有的软件供应商\n\n如果你希望将现有企业系统的数据和/或功能扩展到 iPad，总是建议与现有的软件供应商交流，了解他们的策略和对 iPad 的看法。\n\
  \n许多企业软件供应商开始在 App Store 中发布应用程序。其他供应商则采取开发模板应用程序的方法，特定企业可以许可这些模板，然后将其构建并分发为内部企业应用程序，从而绕过\
  \ App Store。\n\n如果你正在考虑为现有的封装企业软件产品开发 iPad 版本，你理应该联系供应商，以确定他们在移动应用程序方面的路线图。如果供应商正在开发其软件的移动版本，你可以判断正在开发的内容是否满足你的需求，以及是否能为你节省费用。另一方面，许多企业软件组织正在利用移动应用程序促使客户升级到后端产品的最新版本。在这种情况下，如果你原本没有计划此类升级，那么构建自己的移动扩展可能更具成本效益。无论如何，与现有的软件供应商保持沟通渠道畅通是关重要的。\n\
  \n\n\n\n在“自建”与“购买”的决策中，另一个重要的考虑因素是与系统维护相关的长期成本、时间和精力。每当解决方案发生变化（无论是后端还是客户端），集成的双方都必须保持同步。\n\
  \n与传统的企业级软件部署不同，组织可以通过要求特定版本的浏览器或操作系统（如 `Internet Explorer 6` 或 `Windows XP`）来控制客户端设备，而当今的移动格局赋予了用户自行更新设备操作系统的能力。对于支持\
  \ `iPad` 的公司，用户可以在家里通过 `iTunes` 更新自己的设备操作系统，而目前还没有方法可以阻止用户这样做。\n\n企业级开发者和其他人一样，每当\
  \ `Apple` 发布更改或破坏应用程序行为的新 `iOS` 版本时，都必须更新发布在 `App Store` 中的应用程序。`Apple` 允许开发者访问系统的预发布版本，以便在操作系统发布之前对应用程序进行兼容性测试并解决任何问题。由于这仅提供了几周或至多几个月的提前通知，进行移动开发的企业需要遵循与\
  \ App Store 开发者相同的时间表。这通常要求比企业级开发者传统习惯更高的开发速度。\n\n在构建 iPad 应用程序之前，组织必须理解所需的持续系统维护以及通常会加速的时间周期，这是至关重要的。\n\
  \n## 总结\n\n随着用户对在 iPad 上运行应用程序的需求日益增加，许多应用很可能来自 `App Store`，而另一些可能是内部自开发的定制应用程序。在本章中，你查看了\
  \ `iPad` 上可用的许多热门应用程序，这有助于了解目前市面上有什么产品，以及 `iPad` 能够实现什么。关注市面现成产品是重要的，以便知道哪些应用程序是必须构建的。\n\
  \n在下一章中，我们将检查适用于现成应用和内部定制化开发的几种不同类型的应用程序架构。\n\n# 第 6 章：评估潜在架构\n\n### 本章包含哪些内容？\n\
  \n*   为你的情况确定最佳架构\n*   特定平台架构 vs 跨平台架构\n*   Web vs. 原生 vs. 混合应用程序架构\n* 了解何时采用薄客户端方法\n\
  *   创建移动架构决策树\n\n现在你已经知道了需要构建的应用程序，你需要为这些应用程序决定合适的架构。有时，架构的选择是显而易见的，因为只有一种架构能够满足应用程序的要求。但在大多数情况下，选择最佳架构并不是一个显而易见的决定。多种架构可以满足技术要求，但在可用性和总拥有成本\
  \ (`TCO`) 方面会有不同的影响。\n\n软件架构通常是企业内部应用开发小组中争议激烈的话题之一；重要的是认识到移动开发（特别是针对 `iPad`）以及一般的移动软件开发引入了两个对大多数企业架构师来说可能是新的变量：连接性限制和对可用性的强调。因此，你应该从移动用户的角度来看这些架构讨论，而不仅仅是传统企业软件的典型用户。\n\
  \n在本章中，我们将查看移动架构的两个主要维度：首先是特定平台编码与跨平台应用开发的方法，其次是原生 vs. Web vs. 混合应用程序架构。\n\n## 架构方法\n\
  \n在为你的特定（应用程序）选择最佳架构时，标准归结为环境、上下文和用法。例如，如果你正在开发单一应用程序，仅供公司拥有的 `iPad` 上的单一用户使用，且该设备仅集成一个后端数据源（如图\
  \ 6.1: 开发与单个后端数据源集成的 iPad 专用应用程序可以实现简化架构。\n\n![6.1](img/c06f001.jpg)\n\n另一方面，如果你的移动环境更像图\
  \ 6.2: 如果存在复杂的后端和应用环境，建议采用更具策略性的架构方法。\n\n![6.2](img/c06f002.jpg)\n\n通过对上下文有清晰的理解（不仅是现在，还包括用户未来预期如何使用他们的应用程序），你将能够做出架构决策，这些决策将影响架构解决方案的长期灵活性可行性。\n\
  \n## 设备特定应用程序\n\n有必要使某些应用程序针对特定设备。例如，如果功能集仅适用于 `iPad` 而不是 `iPhone` 或 `iPod touch`\
  \ 等其他 iOS 设备，那么这种方法可能是合适的（图 6.3）。\n\n图 6.3: 开发仅限 iPad 的应用程序可以使用设备特有的功能。\n\n![6.3](img/c06f003.jpg)\n\
  \n## 特定平台应用程序\n\n尽管在某些情况下设备特定性的应用程序是合适的，但通常建议以这种方式开发应用程序，使其能够支持特定平台的任何设备（图 6.4）。\n\
  \n图 6.4: 即使应用程序最初在 iPad 上使用，将其开发为“通用”应用也是好主意，以便未来可以在其他 iOS 设备上运行。\n\n![6.4](img/c06f004.jpg)\n\
  \n例如，你可能专门为 iPad 设计并开发应用程序，但如果根据 `Apple` 创建通用应用程序的指南进行设计，该应用程序在 `iPhone` 或 `iPod\
  \ touch` 上也能运行得良好（图 6.5）。\n\n图 6.5: 将 iPad 应用程序优化为“通用”应用可以使其在 iPhone 和 iPod touch\
  \ 上也具有良好的可用性。\n\n![6.5](img/c06f005.jpg)\n\n特定平台方法通常是必要的，但请记住，如果为特定平台开发的应用程序将来需要在多个平台上受支持，其后果也是重要的（图\
  \ 6.6）。\n\n图 6.6: 如果需要支持额外的设备和平台，特定平台方法将需要多次开发工作，可能使用完全不同的编程语言和技术。\n\n![6.6](img/c06f006.jpg)\n\
  \n\n\n\n许多组织最终陷入了支持同一应用程序的多个特定平台版本的境地，因为在项目开始时，只需要支持特定的设备或平台。但随着时间的推移，支持额外设备和平台的需求被增加到了需求中。即使现在不需要支持多个平台，但确定未来是否会有此类需求，以及特定平台的架构方法是否仍然是最佳选择，也是至关重要的。\n\
  \n## 跨平台应用程序\n\n对于那些从第一天就需要支持多个平台的应用程序，或者明确未来需要支持额外平台的应用程序，应该审查并评估如图 6.7 所示的跨平台架构方法，以确定其是否适用于你的应用程序。\n\
  \n图 6.7: 如果需要支持其他设备和平台，则应该考虑使用跨平台架构方法。\n\n![6.7](img/c06f007.jpg)\n\n需要注意的是，跨平台开发方法并不意味着“一次编写，到处部署”。虽然通常可以在多个平台之间共享大量的代码和逻辑，但有时必须针对每个特定的设备、外形和/或平台对用户体验进行定制和优化。将在后面的章节中详细讨论。\n\
  \n## 应用程序架构\n\n在这些架构方法的背景下，有几种基本的移动应用程序架构：瘦客户端、Web 应用（web app）、混合应用（hybrid app）和原生应用（native\
  \ app）。这些架构适用于不同的情况，但在做出决定之前，充分理解每种方法在你的解决方案中的优缺点至关重要。\n\n### 瘦客户端\n\n当应用程序安装并执行在远程服务器上，瘦客户端架构就会出现。这是“哑终端”的现代等效物，因为所有的处理都在服务器上完成。如图\
  \ 6.8 所示，`Citrix Receiver` 负责传输按键和触摸屏交互，以及接收并显示从服务器传输的视觉用户界面。这使得安装在 iPad 上的单个瘦客户端能够访问运行在服务器上的可能数百个现有\
  \ `Windows` 应用程序。\n\n图 6.8: `Citrix Receiver` 允许 iPad 用户通过 `Citrix XenApp` 虚拟环境访问任何\
  \ `Windows` 应用程序。\n\n![6.8](img/c06f008.jpg)\n\n### 优点\n\n对于已经在瘦客户端架构和基础设施方面投入大量资金的组织来说，iPad\
  \ 应用程序的瘦客户端方法非常有吸引力。只需相对小的成本，就可以将大量的现有 `Windows` 应用程序面向 iPad 用户。\n\n此外，如果有 `Windows`\
  \ 应用程序专门针对 iPad（甚至更泛指的平板外形）进行了显示分辨率和触摸屏（而非鼠标键盘），那么在具有快速且高可用本地无线连接环境中，可用性通常是可以接受的。\n\
  \n### 缺点\n\n瘦客户端应用程序的缺点是完全依赖无线连接的可用性。此外，由于该架构的技术要求，应用程序性能将受到连接延迟和带宽的极大影响。\n\n另一个主要问题与该架构的核心价值主张直接相关。瘦客户端架构让你现有的应用程序移动，但这些应用程序可能并不是针对\
  \ iPad 设计的，因此可用性通常很差。大多数现有应用程序是为鼠标和键盘设计的，而不是触摸屏。因此，瘦客户端架构通常可以非常容易且廉价地让用户访问现有功能，但如果可用性很差，他们根本就不会使用。\n\
  \n在决定采用瘦客户端架构之前，强烈建议与用户进行试点，以获取他们的反馈，并确定这种架构是否能被他们接受。\n\n### Web 应用\n\nWeb 应用架构在大多数企业应用开发组中已经流行了多年。其原因极具说服力。Web\
  \ 应用只需要在 Web 服务器上的一处进行更新，不需要管理客户端应用程序的分发、安装和更新。应用程序通常也具有良好的移植性，如果设计得当，支持几乎所有的浏览器和操作系统。\n\
  \n因此，大多数现有的企业 Web 应用以及来自第三方软件即服务（SaaS）提供者的应用程序，如图 6.9 所示的 [salesforce.com](http://salesforce.com)，在\
  \ iPad 上运行得完全良好。\n\n图 6.9: 此处所示如 [salesforce.com](http://salesforce.com) 的 Web 应用使用\
  \ `HTML`、`CSS` 和 `JavaScript` 构建，并通过 iPad 上的 `Safari` 等 Web 浏览器使用。\n\n![6.9](img/c06f009.jpg)\n\
  \n### 优点\n\nWeb 应用有很多优点，但最大的优点是，许多现有的 Web 应用已经在 iPad 上运行——如果它们不能运行，相对较小的重构通常可以修复任何\
  \ `CSS` 或 `JavaScript` 问题。在为 iPad 开发 Web 应用时，你现有的基础设施、开发能力和构建过程可能会“按现状”工作。\n\n为了维护\
  \ Web 应用，你不需要在客户端设备上部署或更新任何内容，但可以为 iOS 部署“Web 书签”（web clip），在用户的主屏幕上提供图标，让 Web 应用感觉更像原生应用一点。\n\
  \n此外，还有许多 `HTML5` 功能和针对 Apple iOS 特定硬件的图形加速 `CSS` 过渡，极大增强了这些应用程序在 iPad 上的功能、性能和视觉效果。通过\
  \ `HTML5`，这些 Web 应用可以利用地理定位、带有 `HTML5` 缓存清单的离线功能以及更多。\n\n### 缺点\n\nWeb 应用有几个缺点，即依赖连接、缺乏对原生功能和能力的访问，并且在性能和可用性上通常低于具有相似原生应用程序。`HTML5`\
  \ 有许多功能可以提供离线使用支持，虽然这对于访问静态数据通常效果良好，但在离线状态下执行数据操作的事务完整性非常困难。\n\n### 混合应用\n\n混合应用是原生应用与\
  \ Web 应用的结合。这允许产生全谱的混合应用，其中混合应用可以是主要是原生的、主要是 Web 的，或者处于两者之间的某种状态。\n\n\n\n\n\n在光谱的一端，混合应用可能可能是\
  \ 99% 的 Web 内容和仅有 1% 的原生代码，其原生应用的功能仅仅是包含一个指向远程 Web 服务器的 浏览器。另一方面，混合应用可以由大部分原生应用代码组成，但可以从浏览器对象内部暴露由\
  \ `HTML`、`CSS` 和 `JavaScript` 生成的某些用户界面组件。混合应用也可以介于两者之间。\n\n在图 6.10 中，左侧的 Web 应用完全由\
  \ `HTML`、`CSS` 和 `JavaScript` 组成，并通过 浏览器进行消费。右侧的原生应用完全使用 Apple 的 `CocoaTouch` API\
  \ 构建了适用于 iOS 的特定原生用户界面。中间的混合应用是原生和 Web 的结合，由原生应用在屏幕底部提供原生标签栏（`UITabBarController`），而标签栏以上的所有部分都是一个浏览器（`UIWebViewController`），显示从远程\
  \ Web 服务器传输的内容。\n\n图 6.10：“混合光谱”从 Web 应用到原生应用，混合应用是介于之间的任何形式。\n\n![6.10](img/c06f010.jpg)\n\
  \nWeb 应用的原生“容器”或“包装器”也可以通过 `JavaScript` 接口为混合应用提供对原生设备或特定平台的功能，如图 6.11 所示。Web 应用可以通过预定义的\
  \ `JavaScript` 接口与原生功能交互，该接口允许 Web 应用通过回调传递信息并接收数据。此外，原生应用可以通过 `JavaScript` 与 Web\
  \ 应用交互，或者与 Web 应用的 `HTML` 文档对象模型（`DOM`）交互。\n\n图 6.11：混合应用可以包含自己的嵌入式浏览器，并为 Web 应用提供访问原生设备和应用功能的能力。\n\
  \n![6.11](img/c06f011.jpg)\n\nPhoneGap 是一个开源混合容器项目，提供了一个统一的 `JavaScript` 接口，用于访问各种移动平台的原生功能。这允许\
  \ Web 开发人员从 `HTML`/`CSS`/`JavaScript` 混合应用访问原生功能，如加速度计、摄像头、指南针、联系人、文件系统、地理位置、音频录制、媒体播放等。\n\
  \n### 优点\n混合应用兼具 Web 和原生应用的许多优点。与 Web 应用一样，混合应用可以在移动场景下使用现有的 Web 功能、基础设施和开发者。与原生应用一样，混合应用可以访问原生设备和特定平台的\
  \ `APIs`，并且可以通过内部应用目录中的 `App Store` 进行发。\n\n### 缺点\n由于混合应用本质上是作为 Web 应用“容器”或“包装器”的原生应用，它要求将应用部署并安装到移动设备上。\n\
  \n尽管混合应用可以提供对原生功能的访问，但大多数用户界面通常是通过渲染 `HTML`、`CSS` 和 `JavaScript` 的浏览器对象提供的。虽然这对于许多应用程序来说完全可以接受，但它无法提供与完全原生应用相同的性能和丰富的用户体验。\n\
  \n### 原生应用\n原生应用被编译到本地移动设备上并执行。近年来，客户端软件的流行程度已开始下降，但与 `App Store` 爆炸式增长带来的巨大势头相结合，原生应用正在经历一场戏剧性的复兴。对于许多类型的业务应用，原生应用对于提供必要的性能和用户体验是必要的。例如，`Roambi`（如图图\
  \ 6.12 中所示）是一种移动商业智能应用，提供了带有数据可视化的丰富图形交互。\n\n图 6.12：原生应用可以提供非常丰富的用户体验，并且在没有无线连接时仍保持功能完备。\n\
  \n![6.12](img/c06f012.jpg)\n\n虽然原生应用要求将应用编译到特定平台，但重要的是要意识到并不是所有原生应用都是平台特定的，并且有许多跨平台开发方法和架构允许在其他平台之间实现应用代码的重要共享和重用。这将在后面的章节中进行更详细讨论。\n\
  \n### 优点\nApple 反复证明，移动应用的成功完全取决于用户体验，没有任何能比得上原生应用的用户体验。原生应用提供了大多数 iPad 用户已习惯的高标准性能和用户体验。\n\
  \n此外，对于需要访问和同步离线数据以确保事务完整性的应用，原生应用通常是唯一的必之之选。\n\n### 缺点\n原生应用必须部署到设备上。由于源代码的任何更改或更新都需要重新编译应用，因此生成的二进制文件必须重新部署到设备上。虽然\
  \ `iOS` 支持空中应用部署，但更新原生应用通常比更新 Web 应用更复杂。\n\n此外，为了在 iPad 上获得最佳的用户体验，通常意味着需要进行设备特定的优化以利用设备。这种增强的可用性通常以成本增加为代价。\n\
  \n### 为应用选择最佳架构\n在选择应用的最佳架构时，并不总是基于直接的客观标准。许多主观标准和意见通常会参与其中。因此，许多组织发现开发标准的决策树是有价值的，如图\
  \ 6.13 所示。该树由组织内的领导层定义，它可以帮助为评估特定应用提供更客观的标准。\n\n图 6.13：选择最佳移动应用架构的决策树示例。\n\n![6.13](img/c06f013.jpg)\n\
  \n## 总结\n正如大多数组织拥有现应用和定制应用一样，它们也会拥有混合的应用架构。移动企业架构有两个主要维度：平台特定与跨平台，以及 Web 与原生与混合之间。在这两个维度上都有完全的灵活性（例如，你可以拥有平台特定的\
  \ Web 应用或跨平台的原生应用）。没有一种架构优于其他架构，因为每种架构都呈现出其独特的优势和缺点。在考虑应用的功能和用户特征时，权衡各种架构的优缺点对于确定任何给定应用的最佳方法至关重要。\n\
  \n\n\n\n\n在本章中，你学习了涉及原生、Web 和混合等不同类型的应用架构，并学习了如何为任何给应用评估最佳方案。在下一章中，你将探索更多关于特定平台和跨平台开发方法的架构细节点。\n\
  \n# 第 7 章：创建企业友好型解决方案\n\n### 本章内容\n\n*   使你现有的技术投资实现最大化\n*   将你现有的移动应用程序迁移到 iPad\n\
  *   为你的新移动开发工作提供“面向未来”的设计\n*   为你的应用选择最佳编程语言\n*   通过合理的设计实现代码的可移植性和复用\n*   确保你的移动应用程序和数据的安全性\n\
  \n现在，你已经制定了企业移动性策略，识别了潜在的应用，确定了哪些是需要自开发的哪些是需要购买的，并选择了合适的架构，现在是时候确保你的应用程序设计得是企业友好型的。这意味着什么？你的新应用程序开发工作应该尽可能地利用现有的\
  \ IT 投资、基础设施和可重用的软件组件。虽然 `iPad` 是目前最受欢迎的设备，但你应该确保在该平台上投入的投资在未来需要时可能可以迁移到其他平台。最后，你应该确保通过身份验证和加密妥善保护你的应用程序沙箱，这样设备安全的泄露并不意味着应用程序安全的泄露。\n\
  \n## 利用现有的 IT 投资\n\n在创新和颠覆性技术方面，通常阻止企业采用的一个因素是：人们认为现有投资必须丢弃并被新投资取代。虽然情况通常如此，但并非总是如此。策略性的技术评估和架构规划可以使可重用的投资最大化，并减少需要丢弃的投资。\n\
  \n这些投资包括连接到后端企业系统和软件的 Web 服务及集成。访问后端数据和功能通常是移动企业应用开发中最困难、最昂的部分，但复用现有的 Web 服务通常可以减轻这一费用。现有的\
  \ Web 应用通常可以重新皮肤（reskin）以针对 `iPad` 进行优化，并利用其独特的用户界面范式。现有的移动应用程序可以在迁移到 `iPad` 的同时复用大量的现有代码。\n\
  \n### Web 服务\n\n如前所述，移动应用程序总成本的大部分不在于移动应用本身的开发，而在于与后端系统、数据和服务的集成。随着`面向服务的架构 (SOA)`\
  \ 在过去十年中变得越来越流行，松耦合 Web 服务基础设施的广泛可用减少了与开发和维护系统集成相关的工作。\n\n即使现有服务由于其架构、协议或冗余性没有针对移动端进行优化，在现有的基础设施和服务层之上构建一个移动友好的\
  \ Web 服务层通常也是一个直接的过程。当然，如果现有系统不具备扩展性或灵活性，那么复用它们并不总是恰当的，但仔细检查你的环境以确定现有基础设施和投资中哪些可能被复用至关重要。\n\
  \n### 现有功能\n\n由于今天大多数通用企业应用开发都是使用基于浏览器的 Web 应用架构完成的，与 `iPad` 最常见的功能复用类型涉及 Web 应用。只要没有特定浏览器的限制，大多数企业\
  \ Web 应用都可以轻松地迁移到 `iPad`。遗憾的是，许多企业在从 `Microsoft Internet Explorer 6.0 (IE6)` 升级时遇到了许多麻烦，因为它们的\
  \ Web 应用仅兼容 `IE6`。因此，有时需要对应用程序进行 `CSS` 和 `JavaScript` 重构，以便在 `iPad` 上正常运行。\n\n尽管大多数\
  \ Web 应用并不是针对 `iPad` 设计的，但通常可以进行一些相对简单的 `CSS` 和 `JavaScript` 微调，以极大地提高 `iPad` 上的用户体验。当用户界面无法修复时，可以使用像\
  \ `Sencha Touch` 这样的移动 `HTML 5.0` 框架将现有 Web 应用的表示层重写为针对 `iPad` 优化的丰富移动 Web 应用，这些应用还可以兼容\
  \ `iPhone`、`IPod touch`、`Android`、`BlackBerry` 和其他设备。如图 7.1 所示，`Sencha Touch` 使用许多\
  \ `HTML5` 和 `CSS3` 特性来交付看起来和感觉像原生应用的丰富移动 Web 应用。\n\n图 7.1：`Sencha Touch` 是一个强大的移动\
  \ `HTML5` 框架，用于为 `iPad` 优化 Web 应用。\n\n![7.1](img/c07f001.jpg)\n\n虽然 `iPad` 确实帮助将移动企业应用的概念推向主流，但自定义的业务移动应用已被许多行业使用了十多年。在\
  \ `Windows CE` 和 `Windows Mobile` 之间，`Microsoft` 在这类设备和应用的平台上一直处于着事实上的垄断。\n\n幸运的是，对于许多为\
  \ `Windows Mobile` 或 `Windows CE` 开发 `C# .NET Compact Framework` 应用投入了大量资金的组织，迁移到\
  \ `iOS` 时，通常可以复用大部分代码。如图 7.2 所示，`MonoTouch` 提供为 `iOS` 编译 `C# .NET` 代码的能力，因此虽然用户界面和表示层需要重新开发，但底层逻辑和数据访问代码可以复用。\n\
  \n图 7.2：`MonoTouch` 使得现有的 `C# Windows Mobile` 代码和功能能够在 `IPads`、`iPhones` 和 `iPod\
  \ touches` 上复用。\n\n![7.2](img/c07f002.jpg)\n\n如果这些应用程序在开发时，业务逻辑和数据结构没有受到设备和平台依赖项的限制，那么这些类可以通过\
  \ `MonoTouch` 轻松迁移到 `iOS`，且几乎不需要重构。\n\n当然，这并不意味着每一个 `C# .NET Compact Framework`\
  \ 都能够或应该迁移到 `iOS`。有时，如果应用程序设计得不当，迁移和重构应用的工作将比将其丢弃并从头开始要困难得多。尽管如此，这更有理由确保应用程序和架构设计合理，以实现代码的可移植性。\n\
  \n## 面向未来的应用投资\n\n在 `iPad` 发布后几个月，企业就开始大规模部署这些设备了。鉴于 IT 消费化的行业趋势，移动市场唯一可以肯定的就是它会发生变化。虽然\
  \ `iPad` 现在非常流行，六个月后它还会那么流行吗？一年后，或者二到三年后呢？来自 `RIM`、`HP`、`Google`、`Microsoft` 等其他人的竞争将会如何？\n\
  \n\n\n\n\n你如何让你的应用投资具有“未来保障性”，以至于当你以后需要支持 iPad 以外的内容时，不必从头开始？虽然没有某种“银弹弹”可以完美且完全地对你的应用进行“未来保障”，但有很多策略可以最大化你对应用开发投资的长期回报。\n\
  \n## 开发语言\n\n一个影响应用“未来保障性”的非常重要的决策是你的开发语言选择。虽然 `Objective-C` 是原生应用的首选开发语言，但根据 Apple\
  \ 的说法，该语言仅在 Apple 的 iOS 和 Mac OS X 操作系统上受到支持。遗憾的是，当需要支持非 Apple 设备或平台时，这并没有为机构提供太多的代码移植性。\n\
  \n正如本章前面提到的，行业内一个非常有趣的进展是 `Mono` 框架的出现和成熟。`Mono` 是 `Microsoft .NET` 框架的开源实现，它允许\
  \ `C# .NET` 代码在 Linux、Mac OS X 和基于 Unix 的操作系统上编译和运行。这通常被用于让 `.NET Active Server\
  \ Pages (ASP.NET)` Web 应用程序运行在 Linux 而不是 Windows 服务器上，但也为移动应用开发带来了 `C# .NET` 代码的移植性。\n\
  \n`MonoTouch` 是由 `Novell` 开发并支持的商业框架，让 `.NET` 开发者通过 `C#` 代码访问 Apple 所有的 iOS CocoaTouch\
  \ API。这允许 `.NET` 开发者将现有的开发技能带到 iOS 平台，并重用现有的 `C# .NET` 代码和库。\n\n对于服务器端应用，大多数开发小组都会希望利用他们最熟悉的技术栈。在企业内部，这通常意味着使用\
  \ `Java/J2EE` 或 `C# /.NET`。截至 2011 年年中，还没有一种好的方法使用 `Java` 开发原生 iOS 应用。虽然这在未来可能会发生变化，但目前这让\
  \ Java 团队的处变得复杂。不过，`Microsoft .NET` 团队的决策要清晰得多，因为 `C# .NET` 具有非常好的移植性，不仅在移动平台之间，而且在客户端原生应用和服务器端\
  \ Web 应用之间。虽然 `Ruby` 在企业中没有 `Java` 或 `.NET` 流行，但 `Ruby` 团队会很高兴地知道通过名为 `RhoMobile`\
  \ 的框架，`Ruby` 代码具有移动端移植性。\n\n另一种方法是使用移动企业应用平台 (MEAP)，如 `Sybase Unwired Platform`、`Antenna\
  \ Mobility Platform` 或 `Pyxis Mobile Application Studio`。`MEAPs` 提供了一个中间件集成层，并允许使用第四代编程语言\
  \ (`4GL`) 进行开发。这些平台每一个都提供了高级的拖拽开发环境，这些环境之所以受欢迎是因为它们通常可以由业务分析师等非程序员维护。`Antenna` 和\
  \ `Pyxis` 提供了用户界面抽象层，而 `Sybase` 的方法是使用代码生成将其专有的 `4GL` 翻译成特定平台的源代码。对于 iOS，`Sybase\
  \ Unwired Platform` 生成 `Objective-C` 代码，允许开发者创建自定义的 iPhone 或 iPad 用户界面，并访问 `Sybase`\
  \ 数据对象和中间件。\n\n虽然它不完全是一个 MEAP，因为它使用的是 `C#` 而不是高级别的专有第四代语言，但 `iFactr` 是一个基于 `.NET`\
  \ 的移动跨平台框架，它提供了数据同步中间件和用户界面抽象。`iFactr` 提供了数据同步中间件和用户界面抽象。\n\n此外，通过一个名为 `RhoMobile`\
  \ 的框架，`Ruby` 代码具有移动端移植性。虽然它不完全是一个 MEAP，因为它使用的是 `C#` 而不是高级别的专有第四代语言，但 `iFactr` 是一个基于\
  \ `.NET` 的移动跨平台框架，它提供了数据同步中间件和用户界面抽象。\n\n\n\n\n\n开源 MonoCross 项目通过跨平台模型-视图-控制器（MVC）设计模式提供了该模式的绝佳范例。在这个基于\
  \ `C#` 和 `.NET` 的框架中，模型和控制器是以设备无关的方式开发的，而每个视图都是一个抽象类，并具有特定于设备或平台的具体实现。这使得应用程序不仅可以在不同平台之间共享模型和控制器，还可以为\
  \ iPad、iPhone、Android 和 Windows Phone 实现特定平台的视图，从而为应用程序提供针对每个平台优化的用户体验。\n\n无论你是否计划支持多个平台，你永远无法预知未来会如何，因此，你应该尝试设计你的应用程序，使你的代码尽可能具有可移植性。\n\
  \n## 架构灵活性\n\n除了规划和提供各种平台客户端原生应用之间的移植性之外，考虑客户端与服务器端上下文之间代码的移植性同样重要，如图 7.6：设计良好的业务逻辑和数据集成层也可以在客户端原生应用和服务器端\
  \ Web 应用之间具有移植性。\n\n![7.6](img/c07f006.jpg)\n\nMonoCross 还通过支持使用 `ASP.NET` 的设备端原生\
  \ `C#` 应用和服务器端基于 Web 的 `C#` 应用展示了这种架构灵活性。实现这一目标的方法之一是统一导航范式，使原生应用和 Web 应用都使用基于 `URI`\
  \ 的导航。由于 Web 应用在状态和导航方面的限制更多，使用相同的相对-`URI` 导航方法可以让业务逻辑和数据集成代码在原生应用和 Web 应用之间共享。\n\
  \n## 确保应用程序安全\n\n对于几乎所有面向内部的业务应用程序，确保数据和功能的安全性至关重要。尽管如此，安全性往往是以牺牲可用性为代价的。例如，带有硬件令牌的多因素身份验证会提高应用程序的安全性，但会大幅降低可用性并损害用户体验。对于移动应用程序而言，可用性是至关重要的。大多数移动应用程序不是“必须使用”的应用，而是帮助用户更好地完成工作的应用。如果可用性降低到用户不愿意忍受的程度，他们根本就不会使用。遗憾的是，我观察到太多的企业移动解决方案在部署时给用户带来了过沉重的安全负担，导致用户根本不使用。在考虑应用程序的安全性时，记住所有这些是非常重要的。\n\
  \n## 应用程序沙箱\n\n虽然传统上企业移动安全的重点一直放在在保护设备上，但人们对保护应用程序沙箱的关注正日益增加。这并不是说设备不能或不应该被保护，但随着消费化持续将更多个人拥有的移动设备引入企业，人们更加强调将个人信息和应用程序与业务数据及应用程序隔离开。\n\
  \n即使设备正受到保护和管理，将其视为可能被攻破仍然是一个好主意，因此要把应用程序沙箱视为它自己的堡垒，提供应用程序级的身份验证、授权、加密，甚至是自毁能力。\n\
  \n与其关注设备或平台的潜在安全问题，不如通过在应用程序沙箱内部管理安全来确保组织数据的安全。\n\n## 用户身份验证\n\n过去许多企业应用开发都围绕着设备级身份验证展开。用户通过登录计算设备进行身份验证，一旦登录，就可以无需额外身份验证即可访问应用程序。\n\
  \n随着个人拥有设备变得越来越普遍，移动设备的个人用途和业务用途混合在一起。对于移动应用程序，确保并管理其自身的安全性至关重要。这并不意味着用户每次启动应用程序时都将被强制登录。可以使用单点登录（SSO）解决方案，让用户登录一个受企业控制的应用程序沙箱，然后通过授权的会话令牌在应用程序之间传递，切换执行到另一个应用。这样，用户在预定的超时期内不需要重新进行身份验证。\n\
  \n## 加密传输中的数据\n\n对于大多数移动应用程序，到后端 Web 服务的数据通信可以通过基于安全套接层（`SSL`）的加密 `HTTPS` 连接轻松实现。在这种情况不可接受的情况下（出于安全原因或当\
  \ Web 服务无法在防火墙外部暴露），可以使用 `L2TP`、`PPTP` 或 `IPSec` `VPN` 连接。出于可用性和性能的考虑，这并不总是理想的情况，但它确实有效。\n\
  \n如果这两种解决方案都不能提供足够的保护，你可以采取“双信封”方法，在 `VPN` 连接中嵌入 `HTTPS/SSL` 连接。再次，这可能会导致通信开销、可用性和性能问题，但如果为了满足安全要求所需的，这是可以实现的。\n\
  \n## 加密静态数据\n\n虽然 `iOS` 提供了许多应用程序可以使用的 `APIs` 对数据进行基于硬件的加密，但持久化数据的安全性最终是你的应用程序的责任。无论你是想使用\
  \ Apple 提供的 `APIs`、你对开源加密算法的实现，还是两者的结合，都取决于应用程序开发者根据内容的敏感性来实现必要的加密安全级别。\n\n如果你处理的是特别敏感的信息，那么是否有必要将任何信息持久到设备上也是值得商榷。当然，设备端持久对于离线应用执行是必要的，但通常需要在可用性和安全性之间取得微妙的平衡。\n\
  \n\n\n\n\n- 从用户的角度思考你的数据\n- 设计适用于移动端的数据模型\n- 理解移动性对 Web 服务的影响\n- 在 REST 和 SOAP Web\
  \ 服务之间进行选择\n- 移动应用程序连接模型的不同类型\n\n几乎从定义上说，企业级软件是数据驱动的，移动应用程序也不例外。然而，将你的数据移动化可能比表面看起来要困难得多。\n\
  \n本章将探讨优化数据模型以供 iPad 应用程序使用的最佳方法。尽管 iPad 是一款强大的移动计算设备，但移动和无线技术仍然引入了许多限制，必须适当管理这些限制以最大限度地提高性能、可扩展性和可用性。你将学习其中一些“移动友好”的概念以及实现这些的一些通用方法。\n\
  \n随后，你将检查使用 `SOAP` 和 `REST` 的 Web 服务架构，包括这些方法之间的主要区别，以及各自的优缺点。\n\n最后，你将查看 iPad 提供的不同类型的无线连接，以及移动应用程序可以种四种连接模型：始终连接、通常连接、偶尔连接和从不连接。\n\
  \n# 为移动性优化你的数据模型\n\n当你的企业级应用程序的数据模型需要移动化时，它需要与典型的企业集成项目不同的方法。当涉及到移动性时，即使硬件拥有像 iPad\
  \ 一样的计算能力，也重要的是意识到，移动设备的限制比数据仓库中的服务器多得多，而服务器通常运行促进企业系统间集成的应用程序。因此，为了让移动应用程序成功集成到企业环境中，集成应该以这种方式进行：Web\
  \ 服务和服务数据模型针对通过无线连接在移动设备上的消费进行了优化。\n\n## 以移动用户为中心\n\n后端数据仓库中的数据模型是从系统和企业的整体需求角度进行建模和存储信息的。然而，当这些数据移动化时，数据模型应该从用户的角度进行设计。\n\
  \n这可以通过从现有数据模型开始并对其进行重构，仅包含移动应用程序所需的数据结构和元素来实现。但通常从零开始并简单地定义用户需要什么会更容易、更有效。\n\n\
  通过从外向内地（而非从内向外）查看你的数据需求，通常可以保持简洁简单，然后使用移动友好型数据模型来定义接口，该接口可以在服务之后隐藏许多数据相关的复杂性。\n\n\
  ## 数据扁平化\n\n在关系型数据库和强调数据规范化的企业数据库设计最佳实践的世界中，重要的是记住，当涉及到移动性和通用 Web 服务时，许多关于数据库设计的总体指导原则并不一定适用。\n\
  \n虽然你的后端数据模型可能有很多小表，在查询数据时可以将它们连接起来，但当通过 Web 服务将这些数据暴露给移动应用程序时，所有的繁重工作都应该在服务器端完成。与其从服务器拉取所有不同的对象并在客户端连接它们，通常在服务中管理这些会更有效。\n\
  \n例如，你可能有一个带有 `Company` 对象的的数据模型：\n\n```xml\n <?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n <Company>\n    <ID>1</ID>\n    <Name>Ashtree Software</Name>\n    <Website>www.ashtreesoftware.com</Website>\n\
  \    <PrimaryPhone>(612) 852-7900</PrimaryPhone>\n  </Company>\n```\n\n以及带有 `Contact`\
  \ 对象的：\n\n```xml\n <?xml version=\"1.0\" encoding=\"utf-8\"?>\n  <Contact>\n   \
  \ <ID>2</ID>\n    <CompanyID>1</CompanyID>\n    <FirstName>Scott</FirstName>\n \
  \   <LastName>Olson</LastName>\n    <Title>Chief Architect</Title>\n    <Email>scott@ashtreesoftware.com</Email>\n\
  \    <OfficePhone>(612) 852-7964</OfficePhone>\n  </Contact>\n```\n\n以及带有 `Address`\
  \ 对象的：\n\n```xml\n <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ArrayOfAddress>\
  \  \n  <Address>\n    <ID>3</ID>\n    <CompanyID>1</CompanyID>\n    <Description>World\
  \ Headquarters</Description>\n    <Street1>520 Marquette Ave.</Street1>\n    <Street2>Suite\
  \ 500</Street2>\n    <City>Minneapolis</City>\n    <State>MN</State>\n    <Zip>55402</Zip>\n\
  \  </Address>\n  <Address>\n    <ID>4</ID>\n    <CompanyID>1</CompanyID>\n    <Description>Regional\
  \ Sales Office - East</Description>\n    <Street1>520 Lexington Ave.</Street1>\n\
  \    <Street2>Suite 125</Street2>\n    <City>New York</City>\n    <State>NY</State>\n\
  \    <Zip>10022</Zip>\n  </Address>\n</ArrayOfAddress>\n```\n\n然而，为了让移动设备消费这些内容，所有三个对象必须下载到设备并在客户端连接起来。因此，从移动用户的角度将数据进行扁平化（或反规范化）对移动消费来说通常更好，这样数据连接就发生在服务器端。在那种情况下，你可能会看到类似的内容：\n\
  \n```xml\n <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<Company>\n  <ID>1</ID>\n\
  \  <Name>Ashtree Software</Name>\n  <Website>www.ashtreesoftware.com</Website>\n\
  \  <PrimaryPhone>(612) 852-7900</PrimaryPhone>\n  <PrimaryAddress>\n    <ID>3</ID>\n\
  \    <CompanyID>1</CompanyID>\n    <Description>World Headquarters</Description>\n\
  \    <Street1>520 Marquette Ave.</Street1>\n    <Street2>Suite 500</Street2>\n \
  \   <City>Minneapolis</City>\n    <State>MN</State>\n    <Zip>55402</Zip>\n  </PrimaryAddress>\n\
  \  <Addresses>\n    <Address>\n      <ID>3</ID>\n      <CompanyID>1</CompanyID>\n\
  \      <Description>World Headquarters</Description>\n      <Street1>520 Marquette\
  \ Ave.</Street1>\n      <Street2>Suite 500</Street2>\n      <City>Minneapolis</City>\n\
  \      <State>MN</State>\n      <Zip>55402</Zip>\n    </Address>\n    <Address>\n\
  \      <ID>4</ID>\n      <CompanyID>1</CompanyID>\n      <Description>Regional Sales\
  \ Office - East</Description>\n      <Street1>520 Lexington Ave.</Street1>\n   \
  \   <Street2>Suite 125</Street2>\n      <City>New York</City>\n      <State>NY</State>\n\
  \      <Zip>10022</Zip>\n    </Address>\n  </Addresses>\n  <Contacts>\n    <Contact>\n\
  \      <ID>2</ID>\n      <CompanyID>1</CompanyID>\n      <FirstName>Scott</FirstName>\n\
  \      <LastName>Olson</LastName>\n      <Title>Chief Architect</Title>\n      <Email>scott@ashtreesoftware.com</Email>\n\
  \      <OfficePhone>(612) 852-7964</OfficePhone>\n    </Contact>\n  </Contacts>\n\
  </Company>\n```\n\n结果是，客户端不需要多次调用来构建数据的单一视图（这很重要，因为无线延迟通常是性能的瓶颈）。客户端不需要执行复杂的连接或数据处理（避免这些操作可以显著提高性能和电池续航时间）。而且客户端还可以集中地管理促进此调用的逻辑（而不是将逻辑分发到每个移动客户端并保持更新）。\n\
  \n## 简洁轻量级\n\n尽管示例 XML 中的数据并不特别臃肿或沉重，但在企业环境中，数据结构极其复杂且沉重是非常常见的。在移动化数据时，重要的是记住你只需要提供用户和移动应用程序所需的数据。虽然上述所有数据都是有效的，但如果某些数据将被忽略且不使用，那么没有理由在网络传输中不发送它们：\n\
  \n\n\n\n\n```xml\n <?xml version=\"1.0” encoding=\"utf-8”?>\n<Company>\n  <ID>1</ID>\n\
  \  <Name>Ashtree Software</Name>\n  <Website>www.ashtreesoftware.com</Website>\n\
  \  <PrimaryPhone>(612) 852-7900</PrimaryPhone>\n  <PrimaryAddress>\n    <ID>3</ID>\n\
  \    <Description>World Headquarters</Description>\n    <Street1>520 Marquette Ave.</Street1>\n\
  \    <Street2>Suite 500</Street2>\n    <City>Minneapolis</City>\n    <State>MN</State>\n\
  \    <Zip>55402</Zip>\n  </PrimaryAddress>\n  <Addresses/>\n  <Contacts/>\n</Company>\n\
  ```\n\n这种面向移动端的数据设计应该在移动应用程序设计的背景下进行，因为如果没有特定的工作流和用例背景，很难从用户的视角查看这些数据。\n\n## Web\
  \ 服务与移动性\n\n虽然有许多方法向 iPad 应用程序传递数据，但 Web 服务是最常见的方法。正如前面的章节中提到的，Computer Associates\
  \ 的首席技术官 Donald F. Ferguson 博士对移动性和 Web 服务将如何影响企业 IT 部门有自己的愿景。根据 Ferguson 的说法，“传统的\
  \ IT 为客户和员工提供了数量有限的应用程序。IT 将演变为为员工和终端用户从应用商店下载的数以未计的‘星系’应用程序提供数据和 API 调用。”\n\n这意味着需要一个非常成熟且面向移动端的\
  \ Web 服务基础设施，这并不是一夜之间就能完成的。如果你相信这种面向服务的移动性愿景，你可以做很多事情来开始为你的组织的未来做准备。你可以从建立一个面向移动端的企业服务平台开始。\n\
  \n首先，你可以做出一些基本的架构决策。让我们来看 Web 服务的两种主要方法：`SOAP` 和 `REST`。\n\n## SOAP\n\nSOAP（简单对象访问协议，Simple\
  \ Object Protocol）在许多企业环境中是最常用的 Web 服务协议。SOAP 通常用于远程过程调用（RPC），服务提供了在远程服务提供者处执行函数的能力，如图\
  \ 8.1。\n\n在 SOAP 服务的上下文中，通常会定义“动词”和“名词”来构建新的词汇（例如 `getCustomers()` 或 `performCreditCheck(customerId)`），这些定义本质上没有限制，因为使用\
  \ `HTTP POST` 动词来通信所有服务请求。许多 SOAP 实现遵循发布服务描述语言（`WSDL`）的约定，用于自动生成代理程序，以便客户端与服务集成。\n\
  \n这是一个基于 SOAP 的请求示例：\n\n```\n POST /Customers HTTP/1.1\nHost: www.example.org\n\
  Content-Type: application/soap+xml; charset=utf-8\nContent-Length: 827\n\n<?xml\
  \ version=\"1.0”?>\n<soap:Envelope\nxmlns:soap=\"http://www.w3.org/2003/05/soap-envelope”\n\
  soap:encodingStyle=\"http://www.w3.org/2003/05/soap-encoding”>\n\n  <soap:Body xmlns:m=\"\
  http://www.example.org”>\n    <m:GetCompany>\n      <m:company>1</m:company>\n \
  \   </m:GetCompany>\n  </soap:Body>\n</soap:Envelope>\n```\n\n这是对应的响应：\n\n```\n\
  \ HTTP/1.1 200 OK\nContent-Type: application/soap+xml; charset=utf-8\nContent-Length:\
  \ 1897\n\n<?xml version=\"1.0”?>\n<soap:Envelope\nxmlns:soap=\"http://www.w3.org/2003/05/soap-envelope”\n\
  soap:encodingStyle=\"http://www.w3.org/2003/05/soap-encoding”>\n\n  <soap:Body xmlns:m=\"\
  http://www.example.org”>\n    <m:GetCompanyResponse>\n      <Company>\n        <ID>1</ID>\n\
  \        <Name>Ashtree Software</Name>\n        <Website>www.ashtreesoftware.com</Website>\n\
  \        <PrimaryPhone>(612) 852-7900</PrimaryPhone>\n        <PrimaryAddress>\n\
  \          <ID>3</ID>\n          <Description>World Headquarters</Description>\n\
  \          <Street1>520 Marquette Ave.</Street1>\n          <Street2>Suite 500</Street2>\n\
  \          <City>Minneapolis</City>\n          <State>MN</State>\n          <Zip>55402</Zip>\n\
  \        </PrimaryAddress>\n        <Addresses/>\n        <Contacts/>\n      </Company>\n\
  \    </m:GetCompanyResponse>\n  </soap:Body>\n</soap:Envelope>\n```\n\n### SOAP\
  \ 的优势\n\nSOAP 最显著的优势是基于 SOAP 服务在许多企业中广泛可用，因此当需要与新的移动应用程序集成时，这些服务可能已经存在。如果服务不是过度重量或复杂，并且通过\
  \ `MonoTouch` 使用 `C# .NET` 等环境进行开发（支持消费基于 C# WSDL 生成的 SOAP 代理），那么使用 SOAP 服务可能是最佳选择。\n\
  \n### SOAP 的劣势\n\nSOAP 在移动背景下最大的劣势是其冗长且沉重的 XML 格式。虽然带宽并不是数据中心大多数服务器之间交互的限制，但许多常用的企业服务比带宽受限无线传输所需的要重且复杂得多。\n\
  \n另一个劣势是缓存 SOAP Web 服务请求困难。因为每个基于 SOAP 的操作都是 `HTTP POST` 动词，所以没有像 `HTTP GET` 动词那样内置的数据请求缓存机制。\n\
  \n虽然大多数企业开发者习惯于可以在开发环境中轻松消费 SOAP 服务，但对于 iOS 开发，消费 SOAP 服务并没有那么简单或直接。例如，如果你使用 `Objective-C`\
  \ 开发应用程序，Apple 的 `Xcode` 开发环境并不提供直接消费 `WSDL` 的能力。此外，如果你采用基于 `HTML5` 的开发方法并使用 `AJAX`\
  \ 进行数据请求，在 JavaScript 中消费基于 SOAP 服务是非常困难的。\n\n## REST\n\nREST（或表述状态转移，REpresentational\
  \ State Transfer）是一种 Web 服务架构风格，它利用了 `HTTP`（超文本传输协议）的能力和限制。\n\n与其像常见的 SOAP Web 服务那样定义新的“动词”，RESTful\
  \ Web 服务使用四个基础 HTTP 动词：`GET`、`POST`、`PUT` 和 `DELETE`。\n\n“名词”可以定义为任何需要的内容，但预定义的映射到通知的\
  \ CRUD 操作（创建、读取、更新、删除），其中创建使用 `POST` 动词，读取使用 `GET` 动词，更新使用 `PUT` 动词，删除使用 `DELETE`\
  \ 动词。\n\n这是一个 REST 服务请求示例：\n\n```\n GET /Customers/1 HTTP/1.1\nHost: www.example.org\n\
  ```\n\n这是对应的响应：\n\n```\n HTTP/1.1 200 OK\nContent-Length: 977\nContent-Type: application/xml;\
  \ charset=utf-8\n\n<Company>\n  <ID>1</ID>\n  <Name>ITR Group, Inc.</Name>\n  <PrimaryAddress>\n\
  \    <City>Mendota Heights</City>\n    <Description>World Headquarters</Description>\n\
  \    <ID>1</ID>\n    <State>MN</State>\n    <Street1>2520 Lexington Ave. So.</Street1>\n\
  \    <Street2>Suite 500</Street2>\n    <Zip>55120</Zip>\n  </PrimaryAddress>\n \
  \ <PrimaryPhone>(651) 757-4500</PrimaryPhone>\n  <Website>www.itrgroupinc.com</Website>\n\
  \  <Addresses/>\n  <Contacts/>\n</Company>\n```\n\n由于 RESTful 服务通常被基于 JavaScript\
  \ 的应用程序消费，并且由于 JavaScript 对象表示（JSON）比 XML 更轻量，因此 REST 服务通常使用 JSON，如例所示：\n\n\n\n\n\
  \n```\nHTTP/1.1 200 OK\nContent-Length: 297\nContent-Type: application/json; charset=utf-8\n\
  \n{ “Addresses”:[],\n  “Contacts”:[],\n  “ID”:“1”,\n  “Name”:“Ashtree Software”,\n\
  \  “PrimaryAddress”:{ “City”:“Minneapolis”,\n                    “Description”:“World\
  \ Headquarters”,\n                    “ID”:“3”,\n                    “State”:“MN”,\n\
  \                    “Street1”:“520 Marquette Ave.”,\n                    “Street2”:“Suite\
  \ 500”,\n                    “Zip”:“55402” },\n  “PrimaryPhone”:“(612) 852-7900”,\n\
  \  “Website”:“www.ashtreesoftware.com” }\n```\n\n## REST 的优势\n\n从移动性的角度来看，`REST`\
  \ 最大优势在于它通常比 `SOAP` 服务更轻量且更容易消费。因为它利用了 `HTTP` 的基础架构，与 `SOAP` 相比，缓存请求的能力被极大简化了。\n\
  \n由于 `SOAP` 很难从 `JavaScript` 中消费，而 `REST` 在 Web 应用中相对容易消费，`RESTful` 服务已成为大多数基于 `AJAX`\
  \ 服务的的基础。结合 `HTML5` 的新功能（例如指示消费者预取并缓存某些资源的缓存清单 manifest），`RESTful` 服务端点可以进行预缓存，从而极地提高\
  \ Web 应用的性能。\n\n## REST 的劣势\n\n许多企业开发者认为 `REST` 最大的劣势是缺乏与 `SOAP` 服务中常用的 `WSDL` 相当的自动代理存根生成器。另一个投诉通常是关于要求仅使用四个\
  \ `HTTP` 动词所加的限制，但这个主题引起了激烈争议；有人认为 `HTTP` 动词的限制简化了 `RESTful` 创建和消费。\n\n## 在 SOAP\
  \ 和 REST 之间进行选择\n\n通常情况下，由于上述所有原因，在 `iOS` 应用开发中更倾向于基于 `REST` 的服务。尽管如此，在某些情况下采用基于\
  \ `SOAP` 的方法也是合适的。\n\n如果你正在从零开始开发 Web 服务，应该认真考虑对移动数据采用 `RESTful` 方案。如果你已经在使用现有的基于\
  \ `SOAP` 的服务，则应该评估它们对移动端的友好程度。如果它们相对轻量，且请求缓存和消费代理生成问题对你的特定应用程序不是问题，那么可能没有理由不在你的移动应用中使用这些\
  \ `SOAP` 服务。\n\n如果存在与移动相关的 `SOAP` 消费问题，通常有办法轻松获取 `REST` 服务。例如，如果基于 `SOAP` 的服务是用\
  \ `.NET WCF` 开发的，可以使用微软的 `WCF REST Starter Kit` 相对简单地将这些相同的服务发布为 `REST`。否则，一个 `RESTful`\
  \ 移动服务层通常位于现有的基于 `SOAP` 的企业服务之上，提供清晰、轻量且对移动友好的服务接口。\n\n## 理解连接模型\n\n在开发企业移动应用之前，理解适用于该应用的连接模型至关重要。\n\
  \n尽管许多人将“移动”（mobile）和“无线”（wireless）作为同义词使用，但实际上存在非常重要的区别。虽然“无线”应用需要连接到无线网络，但“移动”应用并不一定依赖连接。\n\
  \n网络连接主要通过两种类型的无线网络建立：无线局域网（`WLAN`）和无线广域网（`WWAN`）。\n\n已标准的 `WLAN` 称为 `802.11x`，或简称为\
  \ `Wi-Fi`。iPad 支持所有常见的 `Wi-Fi` 标准，包括 `802.11n`、`802.11g`、`802.11a` 和 `802.11b`。\n\
  \n作为 iPad 可选组件的 `WWAN` 技术通常被称为 `3G`，第三代无线网络的缩写。第一代 iPad 的 `3G` 仅支持 `GSM`（全球移动通信系统），但\
  \ iPad 2 也提供了 `CDMA`（码分多接入）`3G` 模型。\n\n在此背景下，让我们移动应用的四种主要连接模型：始终连接、通常连接、偶尔连接和从不连接。\n\
  \n### 始终连接\n\n对于某些使用场景、环境和应用程序，利用始终连接模型可能是首选或必要的。如果应用程序架构是轻客户端模型，那么始终需要连接。或者，如果在离线状态下运行所需的数据太大或由于安全敏感性无法缓存在移动设备上，那么由于始终连接模型就是必要的。\n\
  \n#### 始终连接应用的示例\n\n应该使用始终连接模型的应用示例包括：需要访问支付网关以处理信用卡的销售点（POS）应用程序；处理信用检查的贷款申请程序；以及需要访问特定患者文件的电子健康记录系统。始终连接模型对于需要访问外部数据库（如金融或信贷网络或医疗记录系统）的应用程序，或者使用环境位于可以建立并支持非常可靠的本地无线设施物理空间内的应用程序，运行得非常好。当由于原因无法保证无线连接时，问题就会出现，例如，如果用户离开了没有专门设置提供无处不在的本地无线连接的物理位置。\n\
  \n#### 始终连接架构\n\n始终连接的应用程序可以使用轻客户端、Web、混合或原生架构进行开发。在始终连接的场景下，合适的架构通常取决于应用程序对用户体验的需求。例如，原生应用将比\
  \ Web 应用或轻客户端应用提供更丰富的体验，但由于始终连接模型支持所有架构，差异将主要围绕所需或期望的用户体验。\n\n### 通常连接\n\n通常连接的应用通常具有需要连接的功能，但应用程序必须能够优雅地处理离线状态。有时这意味着向用户发出错误消息，说明在离线时无法执行该特定功能，有时意味着利用缓存数据以便在后台管理连接状态。由于通常连接的应用假设存在通用连接，任何同步类型的活动通常会在后台自动发生。\n\
  \n#### 通常连接应用的示例\n\n大多数不在单一物理位置使用的重数据驱动型移动企业业务应用将采用通常连接模型。这包括执行仪表板、销售自动化、订单录入以及此类系统。\n\
  \n#### 通常连接架构\n\n在通常连接的场景下，原生应用可以通过最优雅地处理离线事件提供最佳体验。尽管如此，也可以开发在通常连接情况下表现良好的 Web\
  \ 或混合应用。\n\n### 偶尔连接\n\n通常情况下，偶尔连接的应用是通常连接的应用的反面，因为它们预计通常处于离线状态，因此在连接可用时充分利用连接进行预取、同步或存储并转发可能存在队列中的任何信息。虽然这种类型的应用程序也可以自动检测连接状态，但其使用场景通常是已知网络不可靠的场景；因此，让用户控制在网络可用时何时尝试“更新”、“同步”或任何其他操作通常是最优的。\n\
  \n\n\n\n\n# 间歇性连接示例\n\n如果在无线连接经常不可用或不可靠的环境中使用重型数据驱动型应用，那么对于许多类型的应用，有时必须采用间歇性连接的方法，例如现场数据捕获和调查收集，这些应用通常被作为常规连接应用来处理。这通常会为某些类型的应用引入更多复杂性。但其他类型（例如调查收集）天然地可以在“存储并转发”队列中工作，或者内容变化不频繁的应用（例如电子学习或培训），在间歇性连接模型中运行得非常好，且不会增加太多复杂性。\n\
  \n## 间歇性连接架构\n\n在间歇性连接的场景下，原生应用通常通过在连接时允许网络检测和同步来提供最佳体验。技术上可以开发可以在间歇性连接情况下运行的 Web\
  \ 或混合应用，但这些架构通常在数据模型相对简单时才可行。\n\n## 从不连接（独立）\n\n如果一个应用程序没有任何动态数据需求，并且在功能和数据上完全静态的，那么从不连接的应用就是合适的。或者如果应用程序必须在永远无法提供连接的环境中使用，那么就有必要从不连接的方法。\n\
  \n## 从不连接的应用示例\n\n独立的预定义函数，如用于各种特定业务目的的计算器、文档、培训以及其他提供相对静态内容或功能的应用类型，通常可以在从不连接的应用中运行良好。如果从不连接应用中的内容或功能任何需要更新，则应用本身必须进行更新并重新安装。\n\
  \n## 从不连接架构\n\n原生应用通常是从不连接情况的首选架构，但如果所有基于网络的内容（`HTML`、`CSS`、`JavaScript`、`XML/JSON`\
  \ 等）都物理存储在混合容器中，混合应用也可以运行良好。由于从不建立连接，在此类使用场景中，客户端和 Web 应用架构是不可能的。\n\n## 总结\n\n在本章中，你结束了书的架构部分，并查看了关于移动数据建模和\
  \ Web 服务的最佳实践与常见的关系型数据库设计不同的方法。你查看了如何从外向内设计移动数据对象，以用户视角为指导，而不是从内向外看，并以现有的数据基础设施为起点点。\n\
  \n你还查看了 `SOAP` 与基于 `REST` 的 Web 服务、各自的优缺点，以及为什么移动应用开发通常倾向于 RESTful 服务。最后，你查看了四种移动应用连接模型：始终连接、通常连接、间歇性连接和从不连接。连接模型具有许多架构上的影响，对于任何给定的应用和用户配置/环境，采取最佳方法至关重要。\n\
  \n在下一章中，你将开启书中关于设计的下一个部分，特别是用户界面设计的最佳实践以及 Apple 的用户体验规范和设计指南。\n\n# 第三部分：设计\n\n##\
  \ 本部分\n\n* 第 9 章：设计企业 iPad 应用\n* 第 10 章：用户体验原型\n* 第 11 章：最大化应用可用性\n* 第 12 章：通过迭代改进\n\
  \n# 第 9 章\n\n## 设计企业 iPad 应用\n\n### 本章包含什么？\n\n* 定义应用的关注点目的\n* 学习 iPad 用户体验范式\n\
  * 理解 Apple 的人机交互指南\n* 从用户的角度设计应用\n* 建模导航和用户体验工作流\n* iPad 业务应用用户界面示例\n\n现在你已经制定了企业移动战略和应用路线图，选择了最高优先级的应用，并确定了应用的首选软件架构，是时候开始设计过程了。\n\
  \n我说的设计是什么意思？这是一个非常好的问题，因为有很多不同的定义。就本书而言，设计指的是围绕应用的视觉和功能定义进行的创意和艺术过程。\n\n我意识到，对于许多企业\
  \ IT 人士来说，“设计”一词通常指的是技术软件设计；为了清晰起见，本书在之前的架构章节中处理了高级技术软件设计，而低级技术软件设计的某些方面将在下一章“开发”中涵盖。\n\
  \n在本章中，我们将从描述企业 IT 为了为 iPad 开发应用而必须经历的范式转变开始。这种转变是微妙的，但它具有深远的影响。开发企业软件的许多传统方法在创建\
  \ iPad 应用时并不有效，因此 iPad 应用的设计和开发需要一种新方法。让我们看看那是什么。\n\n## 理解 iPad 范式\n\niPad 是那种你必须握在手中并体验才能理解的设备。虽然它没有取代个人电脑，但它创造了一种极其个性化的体验，从根本上改变了人与计算机交互的方式。\n\
  \n我询问了 iPad 可用性大师、`Tapworthy` 的作者 Josh Clark，关于企业 IT 为了成功为 iPad 开发业务应用而必须经历的范式转变。他回答道：\n\
  \n> “iPad 引入了一种新的计算方式，我相信这甚至让 Apple 都感到惊讶。它看起来像是一部大手机或一台小笔记本电脑，但它独特的物理形状为计算创造了一种超越两者任何一的背景和心态。iPad\
  \ 是一个用于沉思和流的平台，一个强调大想法（big idea）的个人电脑。对于企业来说，还有比这更重要的吗？\n>\n> iPad 是用于阅读、思考、共享以及是的，工作的绝佳设备。虽然它并不适合传统的办公生产任务，但\
  \ iPad 确实促进了大局思维：草图、记笔记、项目规划。它比移动设备平台不那么容易跳跃，但比笔记本电脑更具创意扩张性——就像纸质笔记本赋予的开放自由。而且由于\
  \ iPad 易于传阅，它是一种社交设备，让小组共享和协作变得容易（在同一个房间的人里，这已成为日益稀有的新奇现象！所有这些特性都要求对用户体验有新的——对于企业来说是非寻常的——关注。一个用于创意和沉思的设备需要具有同样特征的设计。\n\
  >\n> 作为设计师和开发者，我们仍在弄清楚这东西到底是什么。它不是笔记本电脑，不是手机，不是报纸，不是书，不是网络浏览器。然而它继承并混合了它们所有的特质，是许多父母所生的早产儿。我们正处于对这种设备进行实验的激动时期，正在发现为这个真正的工作和思考的新平台而准备的应用（以及应用程序）。”\n\
  \n我相信 Clark 的评估是正确的，那么对于对于想要为 iPad 开发应用的企业 IT 领导和开发者来说，这意味着什么？\n\n首先，我认为至关重要的是意识到，虽然\
  \ iPad 在技术上是一台“计算机”，但它是一种非常不同的计算机，在传统计算范式中运行良好的事物可能可能或不适用于 iPad。\n\n\n\n\n其次，iPad\
  \ 针对不同的生产力需求进行了优化。虽然它不是创建电子表格的最佳平台，但它是捕捉清单和调查中数据的理想平台。尽管在 iPad 上编写文档的效率不是极高，但它让内容的协作和注释变得非常简单。这意味着，传统提供的应用类型和功能可能适用或不适用于\
  \ iPad。对 iPad 而言最优的可能以前从未出现过。这需要这种根本性的范式转变来发现这些细微之处。\n\n第三，iPad 要求对设计和用户体验的强调，而这是企业所并不习惯的。这并不是一项可选择的能力；如果企业\
  \ IT 不投入精力为他们的应用程序创建良好的用户体验，那么用户将直接选择不使用它们。与传统的企业软件不同，用户被强制接受糟糕的用户体验，而 iPad 用户会期望并要求实实的用户体验，否则他们就不会使用组织投入开发的应用程序。如果你的组织不愿意投入精力学习如何进行适当的用户体验设计，那么你可能根本就不应该从事\
  \ iPad 应用开发。\n\n最后，至关重要的一点是要意识到 iPad 作为一种范式和平台，仍在快速演变。Clark 所描述的“实验”过程可能会令人恐畏，但对于企业\
  \ IT 人来说是绝对必要的。企业软件开发人员传统上只关注特性和功能，直到项目结束（如果有的话）才考虑用户体验和可用性，这种倾向必须被彻底倒。思维必须专注于用户体验和可用性，并允许特性和功能根据需要进入或移出范围范围。虽然这在传统的企业软件开发人员听起来可能像异端，但重要的是记住，iPad\
  \ 的设计并不是作为 PC 的替代品，因此 iPad 应用不需要具备所有必要的功能。如果有一项复杂且不常用的功能，那么 iPad 应用的默认做法应该是跳过它。如果用户需要该功能，他们应该能够通过传统的\
  \ PC 和应用程序来实现。iPad 应用功能的最佳组合只有通过实验才能被发现，而企业开发人员必须拥抱这种实验。\n\n# “消费化”的影响\n\n正如第 2\
  \ 节提到的，IT 正在受到消费者（他们也是 IT 系统的员工和用户）的影响，开始使用消费者广泛采用的技术。虽然这种现象最常归因于硬件和设备进入企业环境，但这一趋势对应用世界也产生了巨大的溢出效应。\n\
  \n在之前一章中，我们包含了《连线》杂志主编克里斯·安德德森（Chris Anderson）对这一主题的观点，他表示：“App Store 正在不断增长。增长。不断增长。消费者现在期望任何事情都有对应的\
  \ App，而当这些消费者去上班时，他们开始期望工作方面也应该有 App。移动应用的长尾效应改变了企业员工的心态，IT 部门正面临难以应对这一切。”\n\n那么，对于试图开发应用以满足这种应用需求的企业\
  \ IT 来说，这意味着什么？这意味着你自定义的内部企业应用将不断地与用户拥有的几十甚至上百个其他应用进行比较。仅仅创建应用本身不足以满足需求，因为应用必须具有与用户拥有的所有其他应用平行的用户体验。如果只是构建一个应用并提供给用户，而它像大多数现有企业软件那样遭受糟糕可用性的困扰，是无法让他们安静的；他们只会更大声地抱怨糟糕的用户体验。\n\
  \n当我与 Best Buy 的首席技术官（CTO）罗伯特·斯芬斯（Robert Stephens）坐下接受本书采访时，他热情地与我分享他认为人们在智能手机上使用的应用正在提高他们对企业\
  \ IT 的期望门值。这应该让每个 IT 人心生恐惧。技术正在变得更加人性化，为了接近这一点，工程师需要接触他们的设计感。他们应该去上一门艺术史课程。”\n\n\
  这代表了企业 IT 的一次重大转变，如果忽视了设计和用户体验这一元素，它们在 iPad 应用开发方面无法取得成功。\n\nGreen Mountain Coffee\
  \ Roasters 的首席信息官（CIO）吉姆·普雷沃（Jim Prevo）对消费化对用户体验设计的影响增加了额外的视角。他说：“我发现 iPad 比之前的技术平台更地融合了我的个人和职业生活（照片、视频、应用、邮件等）。由于这个原因，加上它没有完全取代我背包里的任何设备，我们还没有决定具体如何将其作为一种新的企业工具。”\n\
  \n这一评论也回到了这一点：我们仍在学习 iPad 在企业内部真正的潜力，有时我们必须对可能性的进行实验，以发现最有效的方法。\n\n# 人机界面指南\n\n\
  Apple 发布了一份 iOS 人机界面指南（Human Interface Guidelines）文档，这是任何参与 iPad 应用设计的人的必读物。在文档，Apple\
  \ 陈述了开发者必须遵循的通用原则和严格指南，否则将面临被 App Store 拒绝的风险。这些准则中的主观性在过去 Apple 拒绝他们的产品时让许多开发者感到沮丧，尽管现在透明度高得多，因为\
  \ Apple 也为拒绝提供了正式的申诉流程。\n\n即使你开发的是无需提交给 Apple 并经其批准的内部企业应用，遵循这些准则仍然非常重要。遵循这些准则有助于为用户提供直观的一致性，使他们在\
  \ iPad 上使用的每个应用具有相似的交互范式。\n\n在随后的章节中，我们将深入研究人机界面指南中的某些细节，但现在，重要的是提到，任何参与设计或开发 iPad\
  \ 应用的人都应该花时间了解 iOS 人机界面指南，并在设计问题出现时经常参考该文档。\n\n# 构想应用\n\n在进行任何其他事情之前，定义应用的愿景和目的至关重要。应用需要做什么？谁将使用这个应用？这些人将如何使用这个应用？\n\
  \n对于许多企业软件，这种定义从未真正出现过。应用变成了不断扩张的特性和功能的存储区域，一个应用程序可以被许多不同类型的用户和用户组用于许多不同的目的。对于 iPad\
  \ 应用，这种方法根本行不通。这通常意味着将一个现有的应用带到 iPad 的过程会导致创建多个更集中的 iPad 应用。\n\n## 应用的目的是什么？\n\n\
  应用程序的目的是什么？用户为什么要使用它？这个目的必须简单明了。\n\n\n\n\n虽然传统的企业应用可能被简单称为“外勤销售工具箱”，例如，它可能包含各种特性和功能，而这些功能在\
  \ iPad 上作为多个独立的应用程序存在可能更为合适。与其说是一个单一的“销售”应用，还可能存在 分别用于客户信息、销售和财务报告、里程和报销报表、订单输入、产品信息以及其他类别的独立应用。\n\
  \n虽然企业级开发者可能抵制多应用程序的理念，但重要的是，这些应用程序“套件”可以共享代码和数据；这种区别在技术上会产生一些细微的影响，但对用户体验却有许多重大的影响。\n\
  \n## 用户是谁？\n\n谁将使用这个应用程序？不仅要知道用户是谁至关重要，还要尽可能地理解用户在查看应用程序时的视角也至关重要。\n\n如果存在多个具有显著差异的用户群体特征，那么将应用拆分成多个版本可能是非常合适的。再次，这并不意味着要分叉（fork）代码库，而是为特定的用户组提供特定的应用程序版本。例如，产品目录应用可能同时被内部销售代表和第三方分销商代表使用。虽然功能可能非常相似甚至完全相同，但提供不同的用户体验版本可能是一个极有力的理由。\n\
  \n## 应用将如何被使用？\n\n定义定义应用程序的核心目的和深入理解用户之外，理解应用将在何时以及何地被使用也很重要。它是坐在桌前使用的吗？还是站着走动时使用的？是由单个用户使用，还是用于促进多个用户之间的通信与协作？\n\
  \n设计一个在用户走动时优化了在清单上采集数据的应用程序，与设计（例如）一个在用户坐着时需要文本输入的数据输入应用是完全不同的。设计一个供用户向他人演示并与其协作的应用，与设计一个供单用户使用的应用也是不同的。这些都是在开始设计之前必须理解的重要考量。当然，这些考量可能会随着应用程序和用户体验的演变而改变，但在开始之前，你应该有一个基础性的理解。\n\
  \n## 从用户的角度思考\n\n为了设计 iPad 应用程序，你必须设身于用户的角色，从用户的角度进行思考。这往往说易行难，这就是为什么你从一开始开始就需要让真实的用户参与到设计和开发过程中。此外，请注意，随着用户对\
  \ iPad 越来越熟悉并有机会体验任何应用程序的前几次迭代，他们的反馈将会发生变化和演变。这不应该让人感到气馁，必须拥抱这些反馈才能设计并开发出成功的 iPad\
  \ 应用程序。\n\n## 用户体验就是一切\n\n与我谈论用户体验的大多数企业开发者和 IT 领导者往往难以意识到这种体验的重要性。常见的想法是：“我的用户只是在渴望移动端访问数据和功能，只要我能把这些给他们，无论体验好坏，他们都会高兴。”遗憾的是，这种想法是有缺陷的。\n\
  \n我认为这在很大程度上是因为将“丰富的用户界面”与“良好的用户体验”混淆了。一个华丽的界面可能很容易导致糟糕的用户体验，就像一个简洁的界面也可以拥有极佳的用户体验一样。正如史芬斯（Stephens）解释的那样：“丰富的用户界面并不是指标。一个优秀的界面仅通过使用率这一指标来衡量。如果用户体验糟糕，他们就不会使用它。”\n\
  \n当企业 IT 仅仅关注交付功能而不考虑用户体验时，用户的采纳率将很差，使用率也会很低。移动应用应该为了强大的用户体验而构建，否则干脆不要构建。\n\n##\
  \ 定义工作流\n\n除了理解应用程序的目的和用户之外，理解用户工作流的更大组织背景也很重要。通常，现有的遗留流程持续存在，是因为没有人理解它们最初为什么要被创建。虽然业务流程的改变绝不应轻视，但在为像\
  \ iPad 这样具有变革性和颠覆性的技术创建应用程序时，没有比现在更好的时候了。\n\n### 建模用户的流程，而不是系统的\n\n我看到组织在整合现有系统时所犯的最大错误，是倾向于尝试将现有的系统“迁移”到像\
  \ iPad 这样的移动平台。虽然从“底层”迁移或甚至复用应用程序代码通常是可行的且无疑是理想的，但重要的是要意识到，“迁移后的应用程序”从根本上应该是不同的。\n\
  \n原始应用程序并不是针对 iPad 范式设计的，而且它可能执行许多在 iPad 上无法优优完成的事情。因此，移动版本从根本上应该只是原始程序的子集，因为 iPad\
  \ 应用不应该做原始应用程序所做的一切。此外，iPad 的功能几乎可以启用新的特性和功能，以增强用户体验。\n\n移动应用程序应该为了最佳的用户体验而设计，而不是为了后端数据的结构。你的应用程序可能会与多个后端系统集成。同样，从用户的角度来看，将移动应用简单视为后端系统的移动版本是不理想的。用户应该认为能够帮助他们执行特定任务或信息驱动的特定工作流的特定应用，而这很少会模拟现有系统的框架。对于许多企业开发者来说，这是一个很难打破的习惯，但对于\
  \ iPad 应用的成功很重要。\n\n### 遵循最佳信息流\n\n假设信息是在纸质表单上收集的，然后输入后端应用程序，数据用于生成更多的纸质表单以收集更多数据，再次输入系统。这种过程在\
  \ iPad 等移动技术出现之前可能是设计工作流理想方式，但数据收集过程真的需要多个阶段吗？也许需要，也许不需要。你应该质疑现状并挑战你的任何假设。测试你的想法。例如，也许数据只需要一个中间验证步骤，也许可以消除工作流的多个阶段，从而创建出更高效的信息流。\n\
  \n### 利用 iPad 的功能\n\n停一下，思考 iPad 在其优雅极简主义包装内包含的一切可以实现的功能：\n\n*   触摸屏\n*   GPS\n\
  *   指南针\n*   陀螺仪\n*   加速度计\n*   麦克风\n*   扬声器\n*   耳机孔\n*   双摄像头\n\n然后考虑与 iPad 可以使用的许多配件：\n\
  \n*   手写笔\n*   条形扫描器\n*   磁条读卡器\n*   无线打印机\n*   VGA/HDMI 适配器\n\n\n\n\n\n这些技术如何被用于简化用户体验并优化工作流？`GPS`\
  \ 是否可以用于检测用户的物理位置，并让你的应用在启动时自动显示最近的地点？触摸屏和手写笔是否可以用于捕签名？条形扫描器或磁性读取器能否简化数据输入？交互式和动态内容生成能取代一堆旧材料吗？有了\
  \ iPad，许多新事物都成为了现实，我们才刚刚开始发现它们是什么。进行头脑风暴、实验并获取用户反馈，结果可能会让你大惊喜。\n\n## 保持简单\n\n保持简单。记住帕累托法则，也称为\
  \ 80/20 法则。在这种情况下，这意味着 20% 的功能将被用于 80% 的时间里。对于 iPad 应用程序，由于它们通常被设计用于增强现有应用程序而不是取代它们，因此你应该专注于交付那\
  \ 20% 的功能。是的，这会导致应用无法在每种情况下都被使用，但这比为那些大多数时候都在使用它的其他用户把应用复杂化要好。\n\n## 示例：iPad 设计画廊\n\
  \n为了获得灵感，查看设计良好的用户界面示例通常会有帮助。你可以利用`图 9.1`到`图 9.8`来激发自己的创造力。\n\n- `图 9.1`：带签名的销售自动化\n\
  - `图 9.2`：客户关系管理\n- `图 9.3`：设备报告与遥测\n- `图 9.4`：交互式产品目录\n- `图 9.5`：管理文档和图像\n- `图\
  \ 9.6`：实时图表交互\n- `图 9.7`：视频内容促进在线学习\n- `图 9.8`：三维模型交互\n\n## 总结\n\n在本章中，我们将“设计”定义为涉及应用程序视觉和功能定义的创性过程。这对于企业\
  \ IT 来说可能是一个新概念，但它与技术架构一样重要。iPad 的核心在于用户体验，为该平台开发应用程序需要专注于设计出色的用户体验。\n\n你学习了如何定义应用程序，从核心目的到它将如何被使用。我们讨论了如何从用户的角度出发，在利用\
  \ iPad 独特能力的同时承认其局限性，从而优化体验并改进工作流。挑战自己和团队其他成员专注于应用程序的核心目的至关重要，同时消除所有不必要的内容。最后，你查看了一些\
  \ iPad 设计画廊，以激发你在开始设计过程中的想象力。\n\n你准备好拥抱 iPad 范式了吗？你愿意专注于设计卓越的用户体验吗？如果是，下一章将介绍创建模型（mockups）和原型设计的过程。\n\
  \n# 第 10 章：用户体验原型设计\n\n### 本章内容\n\n- 什么是用户体验原型设计？\n- 开始使用原型设计工具\n- 纸质原型设计的练习和示例\n\
  - 模型（mockup）原型设计的练习和示例\n- 快速创建功能性原型\n- 尽早频繁地获取用户反馈\n\n现在你已经开始设计你的 iPad 应用程序，是时候着手创建一些东西了。是时候开始定义和设计用户体验了。正如上一章所述，这需要大量的创造力，特别是愿意放弃对事物应该如何运作的刻板印象。\n\
  \n我最近与用户体验专家 Suzanne Ginsberg 聊了聊，她撰写了《iPhone 用户体验设计》（*Designing the iPhone User\
  \ Experience*）。我询问了她关于为 iPad 开发企业级应用时，用户体验原型设计的重要性。根据她的说法：\n\n> 大多数 IT 专业人员习惯于在几乎或完全没有用户输入的情况下设计企业软件。资源有限是引述这种方法的主要原因；然而，让用户参与到设计过程中可以大大减少你的应用迭代，并节省宝贵的工程时间。可以考虑的一种敏捷方法是将纸质原型与用户测试相结合。向潜在用户展示\
  \ iPad 应用原型，并要求他们完成相关场景。在纸上进行迭代是最便宜、最快的方法，但 iPad 也有许多高保真度选项，例如 HTML 和视频。无论选择何种媒介，目标都是在最终确定应用设计之前收集用户反馈。通常情况下，你等待得越久，解决核心问题就越困难。\n\
  \n在本章中，我们将探讨这些主题，从纸质原型设计过程开始，转向真实的模型（mockups），最后是到功能性的用户体验原型——在这些原型中，你可以将静态模型图像转换为交互式体验。我们还将涵盖你可以用于加速原型设计工作的各种工具，以及如何确保在过程中尽可能尽早、频繁地获得你的用户的反馈。\n\
  \n## 纸质原型设计\n\n你可能在想：“我们为什么要在一本关于 iPad 的书里讨论使用纸张？”这是一个非常好的问题。\n\n由于参与过数十个 iPad 应用程序的设计过程，我可以证明，纸张上的草图确实有些东西有助于激发创造力和想象力。当你把一个纸质原型放在用户面前时，它并不应该是完美的，所以他们不会关注细节。你可以向用户展示纸质原型，他们可以看到大局。他们可以想象用户体验。在深入研究细节之前，他们可以对大局概念提供反馈。\n\
  \n使用 `App Store` 中的可用应用在 iPad 上进行原型设计并没有什么不好，例如 `App Layout` 和 `iMockups`，我都有这两个软件并且非常推荐它们。但首先从手绘的纸质原型开始可以是一次非常有的练习。如果你真的想在\
  \ iPad 本身上进行原型设计，可以使用手写笔配合 `Penultimate` 或 `OmniGraffle` 等应用直接在触摸屏上勾画，这两者都是很棒的应用。\n\
  \n底线是：一旦你将一个真实的模型展示在用户面前以获取反馈，你会倾向于获得关于细节的低级反馈，而不是大局，这就是为什么如果先从低保真的纸质原型开始并迭代几次，再转向高保真的真实模型，这个过程通常是最有效的。\n\
  \n\n\n\n\n不过，我要对此补充一点说明。iPad 的这种范式是你真正必须亲身体验才能理解的，而且任何纸质原型（或逼真模型）的一个重要前提是，设计者必须牢牢掌握\
  \ iPad 用户界面最佳实践以及整体的 `iOS Human Interface Guidelines`（iOS 人类交互指南）。如果对什么是优秀的 iPad\
  \ 应用没有坚实的理解基础，在任何用户体验设计练习中都很难成功。\n\n### UIStencils.com\n\n有很多提供纸质原型材料的优质来源，但我个人最喜欢的之一是\
  \ [UIStencils.com](http://UIStencils.com)，它拥有一整系列针对 iPad 的原型工具。在图 10.1 中，你会看到一个\
  \ iPad Sketch 字本，你可以用它快速创建具有一定程度一致性的屏幕设计。当然，你完全没有理由只用一张白纸，但从像这样的画布开始通常会有帮助。\n\n\
  图 10.1:你可以使用物理纸质 iPad Sketch 字本创建纸质原型。\n\n![10.1](img/c10f001.jpg)\n\n即使你不认为自己是一个特别有天赋的艺术家也不要担心；纸质原型的目标是有意在非常具体的细节上保持模糊，以便你向展示的用户能够想象用户体验。如果你真的觉得需要帮助，可以买一个模板套装，比如图\
  \ 10.2 所示的那样，以便轻松描摹许多常用的用户界面组件以及手势甚至是图标。\n\n图 10.2:如果你不认为自己是艺术家，可以使用 iPad 模板套装来描摹用户界面控件。\n\
  \n![10.2](img/c10f002.jpg)\n\n无论你是手绘纸质原型还是使用模板，都不要担心完美。为你勾勒的每个屏幕设置一个时间限制，这样你就不会让自己陷入过程的细节中。保持简单，就像图\
  \ 10.3 所示的草图原型那样，你就能用铅笔在几分钟内产出“屏幕”。\n\n图 10.3:使用写字本和模板，可以在几分钟内创建纸质原型。\n\n![10.3](img/c10f003.jpg)\n\
  \n当你从一个屏幕移动到另一个屏幕时，可以自由强调任何给定屏幕与上一个屏幕之间可能变化的元素。但请记住关注大局并忽略细节，就像图 10.4 所示，其中文本仅用涂鸦来表示。如果你在这些区域中放入实际单词，向你展示纸质原型的用户将关注内容的准确性和列表的完整性，而不是应用程序的流程和体验。\n\
  \n图 10.4:纸质原型看起来足够像真实的应用程序以便用户理解，但又看起来没那么真实，以至于用户不会对特定的视觉元素挑剔。\n\n![10.4](img/c10f004.jpg)\n\
  \n在你创建纸质原型并与用户讨论体验时，记住接受你收到的反馈并对你的初始设计进行迭代。有时你只需要更换单个屏幕设计，而有时你需要将整个设计抛出窗外并从头开始。不要害怕重新开始。尝试为一个单一应用程序概念构多种用户体验和导航概念的挑战，真的有助于巩固和完善你脑海以及用户脑海中的愿景，他们随后将能更好地准备好表达他们的反馈。\n\
  \n如果你发现自己不断在同一个纸质“屏幕”上从头开始，有时像图 10.5 所示的白擦板 iPad 模板可以有助于简化迭代过程。\n\n图 10.5:白板可用于快速更改用户界面。\n\
  \n![10.5](img/c10f005.jpg)\n\n在你勾勒纸质原型的过程中，不要害怕从其他应用中获取灵感。你涵盖了一些最优秀的 iPad 业务……如果你能写下或至少思考以下几点将会有帮助：\n\
  \n- 应用程序的目的是什么？\n- 应用程序的用户是谁？\n- 该应用程序将如何使用？\n\n一旦定义了这些，你可能想要列出用户“快乐路径”工作流的步骤。然后对于这些步骤中的每一步，思考理想的应用屏幕是什么。将它们画出来、思考它们、完善它们。然后当你有了认为良好的初稿后，开始展示给别人看。\n\
  \n### 制作真实的界面\n\n在过程的这一阶段，你可能对应用程序的高级设计已经有了相当不错的想法。既然纸质原型已经阐述了粗略的设计，现在你可以向细节上深入一个或两个层次。\n\
  \n\n\n\n\n与纸原型不同，在计算机本身上创建逼真模型时，细节非常重要。当你向用户展示这些模型时，他们会注意到一些小细节，如配色方案、图标、图形和文本，包括列表的完整性、拼写和语法。低保真纸原型的最大优势之一是允许设计忽略这些细节，但现在接受这些细节变得至关重要。通过向用户展示纸原型可以获得许多宝贵的意见。\n\
  \n对于真实的界面来说，迭代同样重要。虽然创建这些界面通常需要更长时间，但由于它们是数字对象，后续每次迭代都可以使用上一次迭代的内容来加速进度。\n\n创建真实的用户界面设计有很多方法。许多图形艺术家会倾向于使用\
  \ `Photoshop`，但使用像 `Microsoft PowerPoint` 或 `Apple Keynote` 这样的演示工具也是非常流行的方法。正如在本章早期提到的，还有一些出色的\
  \ iPad 应用程序可以直接在 iPad 上创建拟真模型，包括 `App Layout` 和 `iMockups`。让我们来看看其中的一些工具。\n\n##\
  \ iPad GUI PSD\n\n如果你倾向于使用 `Photoshop` 工作，可以使用许多模板来加速拟真模型的创建。一个流行且全面的模板（同时也是免费的\
  \ `Photoshop` 模板）可以从 `http://www.teehanlax.com/blog/2010/12/10/ipad-gui-psd-version-2/`\
  \ 下载，如图 10.8 所示。\n\n图 10.8: 为偏好于使用 `Photoshop` 强大功能的设计师提供了免费模板。\n\n![10.8](img/c10f008.jpg)\n\
  \n通过这种方法，你可以逐个屏幕处理你的纸原型，并将它们转换为计算机上的高保真详细拟真模型。再次，一旦完成此操作，尽早频繁地向用户展示这些模型以收集有关设计的反馈，是非常重要的。\n\
  \n## Keynotopia\n\n如果你不是 `Photoshop` 专家，你可能更喜欢一个名为 `Keynotopia` 的工具（图 10.9），它提供了\
  \ `PowerPoint` 和 `Keynote` 格式的用户界面（UI）模板。如果你想将拟真模型交给你的用户或组织内的其他人员，让他们对模型本身进行自己的编辑和调整，这非常有价值。\n\
  \n图 10.9: `Keynotopia` 提供了照片级真实的用户界面（UI）组件，可以用于轻松创建拟真模型。\n\n![10.9](img/c10f009.jpg)\n\
  \n但是，记住遵循 Apple 的《人界面指南》和通用的 UI 设计原则。任何从事这些设计的人都应该熟悉这些概念以及 iPad 本身。\n\n虽然 `Photoshop`\
  \ 对于高级图形和复杂的图像处理可能是必要的，但许多应用程序并不一定需要那种程度的复杂。iPad 用户界面设计可以通过从 `Keynote` 或 `PowerPoint`\
  \ 内部拖放组件（如图 10.10: 特定组件可以在 `Keynote` 或 `PowerPoint` 中轻松地“拖放并放置”。\n\n![10.10](img/c10f010.jpg)\n\
  \n## 原型制作示例\n\n现在你已经知道如何制作原型以及可以使用哪些工具来创建设计，那么这个过程从开始到结束看起来是怎样的呢？为了说明这一点，让我们走一下一个\
  \ iPad 数据收集应用的设计流程，如下：\n\n*   该应用程序的核心目标是用 iPad 应用程序取代纸质表单和写板。\n*   用户是一名设施经理。\n\
  *   工作流是经理对车间地面进行每日巡视和检查，捕捉各种观察结果。\n\n该应用程序的好处是可以电子化访问历史检查记录，包括应该额外仔细检查的历史问题区域，以及信息的电子化传输，使得纸质表单不再需要手动重新输入数据库。在下一节中，你将看到纸原型；之后，你将看到它们如何转换为屏幕上真实的电子拟真模型，随后是反映用户实际体验的“功能性”原型。\n\
  \n## 纸原型\n\n纸原型的第一个版本是从该企业最初使用的双页纸质表单的几乎相同的复制开始的。创建该纸原型并向用户展示获取反馈后，收集了更多关于用户实际理想工作流的信息。发现，与其试图一次性放入所有内容，不如有六个特定主题对于检查是最优。\n\
  \n在与用户进行了几次设计会议后，创建了以下纸原型。在图 10.11 中你会看到一个启动界面（左）和一个登录界面（右）。注意图 10.11 是一些粗略的草图。\n\
  \n图 10.11: 启动界面和登录界示例。\n\n![10.11](img/c10f011.jpg)\n\n在图 10.12 所示的屏幕中，应用程序使用了分视图，主视图描述了作为检查一部分的元素。这代表了应用程序逻辑和功能组织，用户可以从主视图选择检查区域以在右侧查看详情。\n\
  \n图 10.12: 画出你的界面，但也要注释并标记特定属性。\n\n![10.12](img/c10f012.jpg)\n\n设计师提出的另一个视觉和审美元素是使用螺旋装，这样虚拟的\
  \ iPad 应用程序就会呈现出让人想起以前纸质流程的视觉感受。图 10.13 说明了描述理想背景的草图和注释。\n\n图 10.13: 除了功能性，还要考虑审美，例如这里画的螺旋装。\n\
  \n![10.13](img/c10f013.jpg)\n\n为了让所有的检查问题适应双面纸，许多检查项目描述都被简化了。通过将检查分解为主视图项目代表的多个区域，我们在屏幕上创建了额外的空间来包含每个项目的完整描述和详细解释，如图\
  \ 10.14 所示。\n\n\n\n\n\n# 从用户工作流的角度思考用户体验\n\n图 10.14\n\n![10.14](img/c10f014.jpg)\n\
  \n对于每个问题，都需要三个潜在的回答，分别代表检查项目是优秀、合格还是较差。由于纸质版本的表单有一个自由文本区域，用于对任何排名较差的项目添加注释，发现使用相机拍摄照片可以消除大部分对自由文本输入过程的需求。图\
  \ 10.15 展示了如何对特定的用户界面组件进行放大，以便与用户进行更详细的讨论。\n\n图 10.15: 如果你想说明或描述一个特定的用户界面组件，可以更详尽地描画出它。\n\
  \n![10.15](img/c10f015.jpg)\n\n根据用户反馈，还确定了图片中表示单个问题可能会影响检查中的多个项目。因此，与其要求用户拍摄多张照片，不如在按下相机按钮时，用户可以选择拍摄新照片或重用现有照片。图\
  \ 10.16 阐释了用户在选择相机图标时是如何被提示的。\n\n图 10.16: 你可以视觉化地描述用户交互的响应。\n\n![10.16](img/c10f016.jpg)\n\
  \n虽然应用程序的大部分可以通过简单的触摸来选择检查表单上的各项项目，但流程中至少有一个环节需要文本输入。在设计需要文本输入的屏幕时，请记住考虑键盘的大小（图\
  \ 10.17）。\n\n图 10.17: 如果应用程序需要文本输入，记住在设计屏幕时留出键盘的空间。\n\n![10.17](img/c10f017.jpg)\n\
  \n在创建纸质原型时，视觉化地描述业务逻辑也很有价值，例如当用户尝试提交不完整的检查时，图 10.18 所示的数据验证错误。\n\n图 10.18: 工作流和业务逻辑也可以在纸质原型中进行视觉化描述。\n\
  \n![10.18](img/c10f018.jpg)\n\n## 真实的模型型\n\n在成功地对纸质原型进行开发、迭代并获取反馈后，是时候迈出下一步创建一个真实的模型型了。请记住，虽然纸质原型重点在于确定高层细节，但真实的模型型现在应该能够描述从头到尾的用户体验。在创建这些设计时，记住创建一个启动页（图\
  \ 10.19），随后是登录屏幕（图 10.20）因为这些对于为营造良好的用户体验奠定基础非常重要。\n\n图 10.19: 不要忘记启动页，因为它在设定用户体验方面是强大的。\n\
  \n![10.19](img/c10f019.jpg)\n\n图 10.20: 登录屏幕。\n\n![10.20](img/c10f020.jpg)\n\n当你从纸质原型过渡到真实的模型型时，要利用高保真图形的契机，尝试不同的美学设计以提升用户体验。在图\
  \ 10.21 所示的屏幕中，标准的 iPad 分割视图被转化为了真实的螺旋笔记本设计。像这样的细微细节可能看起来并不重要，但用户反馈显示，这些小细节在提高感知用户体验方面很大。\n\
  \n图 10.21: 这种细微细节（注：此处原文存在大量重复逻辑混乱，已按原文字意翻译）\n\n\n\n\n我曾见过这个过程进展得惊人快速。一位熟练的设计师和一位熟练的程序员，他们都具有这种快速功能原型开发的经验，可以并肩坐在一起在几小时内制作出一个包含\
  \ 20 个屏幕应用程序的功能性原型。然后，通过立即捕捉用户反馈来迭代设计，我曾见过这样的功能性原型在一天之内通过用户反馈循环经过了多次迭代。如果你的组织计划开发大量的\
  \ iPad 应用程序，那么在你的内部 IT 员工中培养这种独特且快速的原型制作能力可能是非常值得的投资。\n\n## 获取用户反馈\n\n之前提到过，但在设计过程中尽可能早、越频繁地获取用户反馈至关重要。大多数企业软件在开发完成之前绝不会被推到用户面前，只有在之后，人们才会发现哪些新的\
  \ iPad 特有功能是有价值的，哪些可能永远不会被使用，以及与用户体验相关的其他概念。\n\n创建原型（无论是低保真草图、高保真模型，甚至是功能性的用户体验原型）都是加速获取用户反馈的一种简单而有效的方法。原型制作极具成本效益，特别是考虑到早期原型制作过程的成本通常远低于后期为了更改遗漏或误解的功能需求而进行的代码重构工作。\n\
  \n## 总结\n\n在本章中，我们讨论了如何将你的应用程序概念转换为用户体验原型。有很多类型的原型和许多不同的工具可以加速这一过程，从纸张和模板到 iPad\
  \ 应用程序以及 Photoshop 或 PowerPoint 模板。\n\n纸质原型制作可以用于在忽略许多具体细节的情况下提炼高层应用程序概念。在提供反馈时，用户能够关注大局，并从端到端用户体验的背景思考应用程序的用途。\n\
  \n随后，真实的模型可以通过填充纸质原型过程中留给想象的细节，将你的纸质原型推向下一个水平。这些真实的模型还可以通过将静态图像连接到交互式应用程序中转换为功能性原型，让用户亲身体验应用程序的工作流。\n\
  \n迭代制作你的应用程序并获取用户反馈将极大提高你 iPad 应用程序开发的成功率。你准备好并愿意这样做吗？\n\n在下一章中，我们将详细讨论如何通过 iPad\
  \ 设计最佳实践来提高应用程序的可用性。\n\n## 第 11 章：最大化应用程序可用性\n\n### 本章内容简介？\n\n*   提高你的 iPad 应用程序的可用性\n\
  *   理解基础的人机交互原则\n*   从传统的 Web 设计进行转型\n*   拥抱 iOS 用户界面范式\n*   遵循移动应用可用性的最佳实践\n* \
  \  来自 Apple《人机交互指南》（Human Interface Guidelines）的核心思想\n\n最后几个章节涵盖了设计 iPad 应用程序的高层概念。这些讨论始于定义应用程序的核心目的以及用户是谁，以及用户实际上将在何时、何地使用该应用。设计用户体验的过程——从纸质原型到真实的模型，并最终通过功能性的用户体验原型——也得到了概述。\n\
  \n在本章中，我们将在这些概念的基础上进行构建，重点关注应用程序的整体可用性。正如我之前所提到的，人机交互设计和用户体验的许多原则在许多企业环境中并不常见实实践，所以如果你不熟悉这些观点，请不要感到。在许多传统的企业软件开发中，可用性和用户界面设计通常是优先级较低的，在项目末尾才检查。然而，在移动软件开发中，特别是对于\
  \ iPad，高可用性和极佳的用户体验对于应用程序的成功是绝对必要的，即使是部署给内部员工。\n\n本章从详细介绍一些对 iPad 应用程序设计重要的原则开始。之后，你将了解到一些\
  \ Web 设计可用性的最佳实践并不一定适用于 iPad，以及在创建应用程序时真正拥抱 iOS 用户界面范式的重要性。最后，我们将讨论遵循 Apple《iOS\
  \ 人机交互指南》的重要性，并总结这些指南中最重要的概念。\n\n## 人机交互原则\n\n在 iOS 开发的世界中，良好的用户体验设计有六大核心原则：审美完整（aesthetic\
  \ integrity）、一致性、直接操控、反馈、隐喻和用户控制。虽然其中许多原则是通用的适的，但这些思想在 iPad 应用程序设计的背景下尤为重要。Apple\
  \ 是世界上最注重设计的公司之一，Apple 投入了精力设计了 iPad 用户体验的每一个方面。\n\n当你开发一个 iPad 应用程序时，你并不是在创建一个在真空环境中被消费的东西。任何特定的\
  \ iPad 应用程序只是整体 iPad 体验的组成部分。虽然企业软件通常不强调这些思想，但 iPad 上的企业应用要求关注这些原则。\n\n### 审美完整性\n\
  \n虽然用户绝对期望他们的 iPad 应用程序具有某种程度的美学吸引力，但审美完整不仅仅是好看。它关乎外观与功能结合得有多好。例如，很容易在花哨的用户界面上做得过头，盖过了应用程序的基本目的。应用程序应该具有审美吸引力，但外观应该平滑地融入用户体验中，而不是让用户感到压力。\n\
  \n### 一致性\n\n与其他许多没有清晰人机交互指南的平台不同，iOS 有一个非常独特的用户界面范式。Apple 通过在运行于 iPad 的所有应用程序中创建一致的体验，将\
  \ iPad 的用户体验提升到了其他平台之上。iPad 能够提供高水平的可用性是因为平台内部这种一致性；你的企业应用程序也不例外。它们不是真空存在的，而是 iPad\
  \ 整体用户体验的一部分，因此你应用程序的可用性与你与 iPad 用户界面范式的一致性直接相关。需要注意的是，与现有企业系统的一致性没有与 iPad 体验的一性重要。尝试与现有系统保持一致性是一个常见的错误，但悖论在于，完全与\
  \ iPad 用户界面范式一致确保了直觉性，因此这对学习曲线的影响可能比预期的要得多。如果你不相信这一点，可以创建两种功能性用户体验原型并让用户进行测试。\n\n\
  ### 直接操控\n\n\n\n\n\niPad 应用程序体验最强大的方面之一，是能够通过触摸屏上的旋转、拉伸、轻扫、拖动等多点手势，或者通过使用加速度计和/陀螺仪，直接在屏幕上操作物理对象的表示。与其他平台上的标准做法（使用独立的控件来操作对象）不同，iPad\
  \ 用户期望通过直接操作获得更具沉浸感的体验。虽然这在许多企业级应用中可能并不常见，但这种能力可以作为销售演示应用的一部分。利用这一原则可以极大提升你 App\
  \ 的用户体验。\n\n## 反馈\niPad 应用程序的用户期望应用提供反馈作为对交互的确认。例如，点击列表项将使该项短暂高亮。如果应用程序正在执行需要一两秒钟的操作，则应该显示旋转图标（spinner）或进度条，以显示移动和进度。这些细微的视觉元素可以极大提高应用程序的用户体验。\n\
  \n## 隐喻\n大多数用户对各种计算隐喻都很熟悉，例如用于存放各种“文件”或其他数据的“文件夹”。iPad 引入了新的隐喻，如可以左右滑动以切换状态的开启/关闭开关，或用于进行选择的旋转选择器轮。在你的\
  \ iPad 应用程序中使用这些隐喻可以提升用户体验，但不要将隐喻推得太远或过度使用它们同样重要。\n\n## 用户控制\n在 iPad App 中，用户必须始终感到自己处于控制之中。应用程序应该能够引导他们完成工作流，并在需要时允许他们退出或取消。如果应用程序需要执行潜在的破坏性操作（例如删除数据、不保存文档或未完成的操作），用户期望被提示以确认该操作。此外，用户还期望能够优雅地停止进行中的操作，甚至在任何时候退出\
  \ App 而不会丢失数据。\n\n## 重新思考基于 Web 设计\n如果你具有 Web 开发背景，那么意识到 Web 易用性最佳实践与 iPad App 用户的期望之间存在许多显著差异是非常重要的。请记住，在这种情况下，“应用”可能是原生的、Web\
  \ 的或混合的，这意味着尽管它可能使用与网站相同的 `HTML`、`CSS` 和 `JavaScript` 技术开发，但用户期望移动 App 是与众不同的。\n\
  \n例如，许多网站被设计为“门户”，为用户提供许多导航选项或功能。在应用程序中，用户期望应用能够专注于单一目的，并期望在启动后立即有用，而不是在经过多个导航步骤后才。\n\
  \n另一个巨大的区别是 iPad 应用程序应该为触控设计。不要尝试将你的 Web 用户界面范式带到 iPad，而是要拥抱 iOS 用户体验范式以及随之产生的所有隐喻和用户界面组件。\n\
  \n最后两个大区别是滚动和导航。虽然 Web 设计通常强调“折屏以上”以防止用户滚动，但 iPad 滚动感觉非常自然，没有理由尝试阻止它（尽管设计师应该避免极端的滚动）。在导航方面，Web\
  \ 设计范式强调始终可见的“首页”按钮，但在 iOS 范式中这并不适用也不合适。iOS 用户始终点击屏幕顶部的状态栏快速回到长列表顶部，而且由于 iOS 应用通常没有首页，因此没有理由创建自定义首页按钮。\n\
  \n## 拥抱 iOS 用户界面范式\n正如本章前面提到的，创建成功的 iPad 应用程序需要设计拥抱 iOS 用户界面范式。这确保了你的应用程序将高度易用且直观，并提供出色的用户体验。\n\
  \n当然，说起来做起来难。由于范式的转变，你越早地识别并拥抱这种转变而不是与其抗争，设计就会越好，最终的应用程序也会越出色。\n\n## 关注用户体验\n我以前说过过，但我现在还要说一遍，因为它至关重要。涉及到\
  \ iPad 应用程序时，用户体验就是一切。如果应用程序不可用，它就不会被使用。唯一关键的移动性指标是使用率和采纳率，因为这最终决定了任何应用程序的投资回报率。如果你的应用程序因为没有提供良好的用户体验而无人使用，那么你可能根本不开发\
  \ iPad 应用程序更好。开发 iPad 应用程序需要对用户体验和设计的强调，这是企业 IT 并不习惯的，但对于创建成功的 iPad 应用程序来说是绝对必要的。\n\
  \n## Apple 人机交互指南\nApple 的 iOS 人机交互指南 (HIG) 是创建成功的 iPad 应用程序的关键。这些指南不仅仅是建议，如果你想创建提供出色用户体验的\
  \ App，你就需要将它们视为要求。在本章中，我总结了 iOS HIG 中发现的一些概念，但明智的做法是将此总结作为指南，而不是替代阅读、消化和吸收 Apple\
  \ 完整文档的手段。HIG 应该是团队中每个人的必读物，因为它包含了 iOS 应用开发成功的关键。\n\n## 关注主要任务\n专注、专注、专注。简单和聚焦是成功的\
  \ iPad 应用程序设计至关重要的。不要让 App 执行太多事情。删掉所有不必要的需求。记住 80/20 原则，专注于 80% 的时间内被使用的 20% 功能。这可能是企业级\
  \ iPad 开发中最困难的任务之一，但它是成功的基本要求。\n\n## 给用户提供逻辑路径\n用户应该能够清晰、直观地导航整个应用程序。如果需要顺序导航，请务始终允许用户“返回”，不要强迫用户在应用程序中只能“前进”。你还应该尝试为任何给定的屏幕提供唯一的导航路径，因为多个导航路径会让他们困惑并让\
  \ App 更难使用。如果有需要重用的屏幕，查看是否可以在多个上下文中使用弹出框（popover）或模态视图（modal views）。\n\n## 使用以用户为中心的术语\n\
  尽管许多企业应用程序倾向于使用大量术语，但你应该确保使用用户能够理解的词。利用 iPad App 设计过程尽可能简化复杂的措辞。此外，许多企业数据结构和字段名是从企业数据的角度设计的，而不是从用户的角度设计的。从用户的角度考虑数据、内容和功能，并确保任何标签和消息都清晰且简洁。\n\
  \n## 最小化用户输入的努力\n\n\n\n\n虽然在 iPad 上使用屏幕键盘输入数据确实比在 iPhone 或 iPod touch 上容易，但与带有全尺寸物理键盘的其它设备形态相比，仍然困难得多。考虑如何通过利用选择列表或其他提供自动输入数据的用户界面控件的常用选择，来最大限度地减少自由文本输入。这可能需要调整你的应用程序的功能，甚至是工作流。虽然并不总是能够消除自由文本输入，但通常可以显著减少它。\n\
  \n### 恰当的品牌化\n对于 iPad 应用程序，你应该以一种不显眼的方式融入品牌元素，而不要占用屏幕空间来显示 Logo 或其他品牌元素。考虑如何通过配色方案和背景图像将品牌微妙地整合到应用程序中。这种微妙的品牌化不仅更有效，而且极大地增强并提高了用户体验。但请记住，图标和启动屏幕可以清晰地传达你的品牌。你应该花些时间在将品牌融入应用程序之间找到合适的平衡点。\n\
  \n### 让搜索变得快速且有收获\niPad 应用程序的用户期望在合适将搜索功能集成到应用程序的核心区域。例如，与其将搜索设置为单独标签页，你可以在数据列表顶部包含一个搜索栏。然后，当用户在搜索字段中输入文本时，你可以实时过滤数据以创建更好的用户体验。为了优化性能，请确保你的数据已正确索引；如果你的搜索是远程进行的，那么在可能的情况下，在用户输入搜索框时进行搜索和过滤也是很有价值的。\n\
  \n另一个重要的考虑是，尽可能在任何时间、任何情况下将搜索视为单框模式。虽然许多企业级应用具有多个文本框的搜索屏幕来搜索不同的元素，但 iPad 用户习惯于单“Google”文本字段搜索范式。例如，如果你的应用程序需要赋予用户搜索客户的能力，你不需要单独的文本字段来搜索公司名称、客户编号、城市、州或邮编。让所有可搜索字段都通过单个搜索框进行搜索。这可能需要对你的数据进行一些创新的索引优化，但这是用户所期待的并将提供好得多的用户体验。\n\
  \n### 保持简洁\n减少冗长的描述。为控件和对象提供简短的标签甚至符号图标，以最大限度地减少文本。尽可能简化，并像像写报纸标题一样思考，即尝试尽可能删掉更多的词汇。这可能是困难的，但带来的用户体验改进是值得的。\n\
  \n### 一致地使用用户界面元素\n这通常是企业级 iPad 应用用户界面设计面临的最大挑战之一。与其他平台不同，iOS 对标准用户界面（UI）组件有明确定义的用法。iPad\
  \ 用户会理解这些标准 UI 元素以及标准操作是什么。任何偏离标准行为的行为都会对可用性和用户体验产生负面影响。此外，如果存在执行给定操作的标准 UI 元素，你不应该剧烈改变某个特定组件的外观，因为用户将挣苦于如何与之交互。此外，iOS\
  \ 自带有许多标准按钮和图标，你永远不应该使用这些元素执行不同于标准默认行为的操作。\n\n### 支持所有方向\n在 iPad 范式中没有“倒置”的。用户应该以他们想要的方式持有设备，而应用程序应该无缝响应。如果可能，当用户更改设备方向时，应用程序应该简单旋转而不影响屏幕布局。如果应用程序的布局太复杂，无法做到这一点，请考虑如何让竖屏和横屏之间的切换尽可能相似。此外，你还应该使用微妙的动画来视觉化旋转时用户界面布局的变化。\n\
  \n### 增强交互性\n尽管 iPad 屏幕比 iPhone 或 iPod touch 大得多，但克制添加与应用程序核心目的和焦点不直接相关的特征欲望仍然很重要。或者，考虑\
  \ iPad 上提供的更大的屏幕空间如何为与内容和功能的交互提供新方式。例如，商业智能应用程序可能会找到在不改变上下文的情况下与数据交互的方法，通过透视或从不同的视角查看相同的内容。\n\
  \n### 减少全屏过渡\n在 iPhone 或 iPod touch 上，全屏过渡是正常且预期的，但在 iPad 较大的屏幕上，这并不是最优的。与其使用全屏过渡，不如在分视图的主面板或详情面板中使用过渡，或者是弹出框（popover）或模态视图出现时的过渡动画。否则，考虑使用弹出框或模态视图内的过渡，而不是整个屏幕。在\
  \ iPad 上，在决定采用全屏过渡之前，考虑用户界面范式的所有其他方面。\n\n### 限制你的信息层级\n尽管 iPad 屏幕相当大，你不应该在任何给屏幕上填充过多的信息。关注应用程序的主要目的和核心内容。并利用\
  \ iPad 用户界面元素来结构化和组织内容及导航。例如，使用分视图，将左侧面板视为主视图；选择项目后，右侧的详情视图可以相应更改内容。根据需要，你还可以使用导航栏来深入查看分视图左侧或右侧面板的内容。你还可以使用弹出框为屏幕上的对象提供额外的操作或交互。屏幕顶部工具栏上的分段控件可用于提供相同内容的不同视角，底部的标签栏可以提供访问不同类别或应用程序模式的。\n\
  \n### 协作与连接性\niPad 是一种独特的形态，非常适合协作。与多个用户协作时可能相当笨重的笔记本电脑形态不同，iPad 可用于实现应用程序上的多用户协作；你应该考虑你的应用是否适合这种使用场景。此外，虽然许多应用程序必须设计为在未连接网络时保持可用，但\
  \ iPad 应用程序在尽可能可用的情况下充分利用网络连接。例如，可以使用地理定位获取当前位置并加载适用于该特定物理区域的信息，或者在后台预取并缓存通用数据。\n\
  \n### 用惊艳的图形取悦人们\n\n\n\n\n\n在你的应用程序中，不要低估使用高分辨率写实图形的价值。考虑一下对木材、皮革、石材甚至贵金属等高质量材料的视觉化运用，将如何增强你应用程序的美学完整性。\n\
  \n你不应该在应用程序中硬编码屏幕分辨率。随着 Apple 对 iOS 设备线的演进，现在已经有了三种不同的分辨率。如果未来的 iPad 具有更高分辨率的显示器，你应该对此做好准备，而无必重写大量现有代码。\n\
  \n## 考虑多指手势\n\n虽然多指手势并非对每个应用程序都适用或合适，但你应该深思如何通过创造性使用诸如“双指缩放和滑动”等手势来提升你应用程序的用户体验。你也可以将复杂手势作为快捷方式来简化流程，但不应将其设为执行该特定任务的唯一方法。\n\
  \n如果你选择使用手势，应该始终使用与特定手势关联的标准操作，以避免误导用户。就像用户界面元素的一致性一样，手势行为的一性对于整体用户体验同样重要。\n\n##\
  \ 最小化模态化\n\n模态视图（你可能知道它是子窗口）在为传统 PC 设计的许多企业级应用程序中非常常见，虽然 iOS 上提供了模态视图，但应尽可能减少并消除它们。\n\
  \n模态视图适用于以下情况：需要获取用户的注意力时，或者必须以特定方式完成或放弃任务，以维护数据或工作流过程的完整性。如果情况并非如此，请探索是否可以移除该模态化。\n\
  \n## 某些模态任务考虑使用弹出框（Popovers）\n\n虽然在很多方面弹出框视图与模态视图非常相似，但它们之间有一个非常显著的区别。当用户触碰弹出框外部时，弹出视图会自动消失，而模态视图则不会消失，且对模态视图外部的触摸会被忽略。模态视图有许多适用场景，但在选择使用视图时，请考虑弹出框是否是更好的选择。\n\
  \n## 淡化文件处理操作\n\n虽然在桌面计算范式中，与“文件”的交互很常见，但 iPad 并没有“Finder”或“文件资源管理器”的概念来让用户具备管理或操作文件的能力。因此，在\
  \ iPad 应用程序中，虽然确实可以使用文件在后台存储信息、在应用之间传递信息，或从电子邮件或网络访问文件进行查看或编辑，但不应向用户呈现复杂的**文件管理概念**。任何暴露给用户的文件管理都应尽可能简化并图形化。\n\
  \n## 仅在必要时要求用户保存\n\n在 iPad 上，用户期望应用程序能够自动保存工作，这样如果他们退出应用程序，就不会丢失任何数据。根据工作流，这有时需要使用进程内数据保存功能，因为保存不完整的事务是不恰当的。这是\
  \ iPad 用户的一个重要预期，企业开发人员应该特别注意这可能如何影响应用程序的设计。\n\n## 立即启动\n\niPad 用户通常不习惯等待，因此你的应用程序应该非常重视性能，特别是启动时间。如果你的应用程序必须从远程源获取数据才能显示第一个屏幕，不要等获取了数据后再显示屏幕。理想情况下，尽可能使用之前遗留的缓存数据，但无论如何，都要显示应用程序已经启动并提供视觉反馈。\n\
  \n\n\n\n第二个关键区别在于，用户和业务客户表达和解释需求的方式有所不同。正如 Best Buy 的首席技术官 Robert Stephens 在本章之前关于消费者化的章节中所引述的那样：“用户现在知道他们想要什么，而且他们现在并且也将向\
  \ IT 部门提出这些要求。”但这些用户并不是通过传统的需求文档来传达这些需求，而是尝试描述一种“体验”。如果对这种“体验”的描述以某种方式转换为传统的需求文档并交给开发团队去创建，那么当最终产品交付给终端用户时，这种“体验”几乎肯定会在传译过程中流失。这意味着“体验”必须整合到整个端到端的开发过程中，用户必须能够迭代地“体验”应用程序并提供反馈，以指导和改进设计与开发。\n\
  \n在本章中，我们将探讨你如何在 iPad 应用开发中规避甚至拥抱这些差异，以最大限地提高这些项目在组织内的成功率。\n\n## 敏捷开发的优势\n\n虽然我不想引发一场关于项目管理方法论的非必要意识形态辩论，但我认为分享我在移动软件开发领域持续且重复的经验是极其重要的。\n\
  \n由于我们在这里将讨论的许多原因，iPad 应用开发项目通常采用敏捷开发过程比传统的瀑布式方法要成功得多。让我们来看看这些影响因素。\n\n### 瀑布式开发\n\
  \n传统的瀑布式开发遵循顺序阶段的过程，每个阶段在进入下一个阶段之前都会完成，如图 12.1 所示。项目始于需求定义，然后用它创建设计，随后将其提供给开发人员进行实现。开发完成后，交付物被交给质量保证（QA）进行测试和验证，一旦完成，项目将交付并进入维护状态。\n\
  \n图 12.1: 瀑布模型遵循了一系列顺序的开发阶段。\n\n![12.1](img/c12f001.jpg)\n\n当然，对于许多项目，例如核反应堆的监控系统或深空探测器的导引系统，瀑布式不仅是首选方法——而且是这类系统交付的唯一方式。需求必须在前期清晰地记录，并且在项目交付之前，每一项需求都必须经过设计、实现和验证。\n\
  \n然而，企业级 iPad 应用很少、甚至不会属于这类系统。由于 iPad 应用的核心在于简单性和体验，以及交付用户在 80% 的时间里需要的 20% 的功能，许多“需求”在用户有机会实际使用系统并提供反馈之前是无法确定的。这对于习惯于在前期定义所有需求的项目经理来说是一个悖论。\n\
  \n### 敏捷开发\n\n作为更传统的瀑布式开发方法的替代方案，敏捷开发是一种基于几个关键原则的迭代开发方法，这些原则使其成为 iPad 应用开发的理想选择。\n\
  \n敏捷开发的一个基本原则是欢迎需求的变化，即使在开发后后期也是如此，因为敏捷流程可以利用变化为客户的竞争优势。这允许应用程序随着用户需求的出现而演变。传统的瀑布式开发抵制需求变化，而敏捷开发拥抱变化，并帮助客户发现他们真正的功能和用户体验需求是什么。\n\
  \n其他敏捷原则包括频繁交付可运行的软件，以及业务人员和开发人员在整个项目期间每天协作。通过在开发早期以及整个过程中反复交付可运行的软件，用户能够在自己的脑海中明确他们真正需要什么，并沟通新出现的需求以及解释如何改进应用程序。由于在将可运行的软件交付给用户之前，这种反馈循环无法发生，因此在开发过程早期（在进行大量编码之前）这样做，远比等到项目结束交付时再做要好得多。这种反馈循环的价值在像\
  \ iPad 这样的新型平台上被进一步放大。瀑布式流程固定范围并调整时间和/或预算，而敏捷开发过程则固定时间和预算，同时允许范围灵活变化。\n\n在迭代和敏捷的开发过程中，需求先被起草，然后用于创建设计。随后，实现和测试应该并行进行，并在迭代固定周期结束时，将可运行的软件提供给客户。这为后续迭代的需求和设计工作提供了反馈循环。这一过程在图\
  \ 12.2 中描述。\n\n图 12.2: 敏捷开发基于一种迭代方法，通过与用户协作创建软件并获取反馈。\n\n![12.2](img/c12f002.jpg)\n\
  \n在我写这本书时，我与《敏捷开发成功：使用 Scrum 进行软件开发》一书的作者 Mike Cohn 讨论了他对移动软件迭代开发的看法。根据 Cohn 的说法，“对于像\
  \ iPad 这样任何新的创新设备，用户不可能确切知道他们想要什么。他们需要与软件开发人员紧密合作，以确定他们想要什么以及它应该什么样。像 `Scrum` 这样的敏捷软件开发方法非常适合今天\
  \ iPad 开发所面临的挑战和机遇。”\n\n`Scrum` 是一种用于软件开发项目管理的敏捷方法，由一系列迭代的“冲刺”（sprints）组成，通常持续两周到四周。`Scrum`\
  \ 使得跨职能和自组织的团队成为可能，但也强调了任何项目中另外两个关键角色：产品所有者（Product Owner）和 Scrum 导师（ScrumMaster）。`Product\
  \ Owner` 是客户的代表，代表代表业务和用户；他们有权代表客户做出决策；并最终负责确保项目为业务创造价值。`ScrumMaster` 是 `Scrum`\
  \ 流程的促进者。虽然他们不是团队领导，但负责消除实现冲刺交付物的障碍，并保护团队免受任何干扰因素的影响。\n\n\n\n每个迭代（Sprint）都始于产品待办列表（product\
  \ backlog）的创建和/或整理，它包含一个按优先级排序的高级潜在特性和功能列表。这些高级项目按数量级进行估算，并根据固定周期迭代内资源的容量被划分为迭代待办列表（sprint\
  \ backlog）。迭代待办列表中的高级功能会在迭代计划会议上被进一步分解为具体的任务，并由团队进行低层级的估算。在每个迭代期间，每天都会举行 Scrum 会议，团队成员介绍他们昨天做了什么、今天计划做什么，以及是否存在任何阻碍进的障碍。每天还会更新迭代燃尽图（burndown\
  \ chart），以提供迭代内实际进展的完全透明，以便确定团队交付迭代内所有功能方面是领先、落后还是按计划进行。在每个迭代结束时，将交付一个可运行的软件版本，作为一个可能发布的产品增量，并在迭代评审会议上进行演示。还会进行迭代回顾会议，以识别迭代期间学到的任何教训并进行持续的流程改进。在此时，项目要么以已发布的项目而结束，要么通过另一个迭代再次重复。这一过程在图\
  \ 12.3 中进行了说明。\n\n图 12.3：Scrum 是一种敏捷、迭代式软件开发的流行方法。\n\n![12.3](img/c12f003.jpg)\n\
  \n虽然企业级软件通常更多关注功能，但当企业应用移动化时，它完全取决于用户体验。如果某些特性或功能在移动场景下不可用，那么构建它们就毫无意义。\n\n## 收集迭代用户反馈\n\
  \n如第 8 章所述，开发企业级 iPad 应用的大部分成本、精力和时间都在与后端数据及系统的集成上。应用程序的用户界面在总成本、时间和精力方面通常只是冰山一角，但它也是最难有效定义和设计的，尤其是在真空环境下。\n\
  \n### 用户体验原型\n\n用户体验原型通常在全应用开发过程之前或作为其前提进行，这是快速迭代实现改进的终极手段。当图形设计师与程序员并肩坐着，双方都有电脑处理各自的原型制作活动时，这种方式效果最好：设计师创建图像，程序员通过编写代码将它们组合在一起以模拟实际功能。精通这门艺术的设计师和开发者通常可以在几小时内创建初始功能原型，随后在\
  \ 30 到 90 分钟的循环中进行迭代。\n\n想象这种情况在同一个房间的一个或多个用户面前发生，这样设计师和开发者就可以快速构建原型并立即将其交给用户以获取反馈。在短短几天内就可以发生多次迭代，这些迭代通常代表了应用的剧烈演变。我见过许多应用程序在这一过程中产生，其看起来与最初提议的概念完全不同。如果没有这些可丢弃的用户体验原型的快速迭代，最终开发并部署给用户的将将是一个极其糟糕的应用概念。底线是：执行得当的用户体验原型会议的投资回报率绝不应低估。\n\
  \n### 走廊测试\n\n虽然走廊测试对于大多数类型的传统企业软件来说是不可能的，但它对于收集 iPad 应用的反馈可以非常有效。由于 iPad 应用应该是自然直观的，并为快速使用会话而设计，你可以给公司走廊里的随机用户递一个\
  \ iPad，描述一个工作流或场景，并要求该用户尝试使用该应用程序。在此过程中，观察用户停顿、出错或必须返回上的任何区域。这些观察提供了改进应用程序用户体验的机会。随着应用程序的演变，对部分（但不是全部）相同的用户进行“走廊测试”也有帮助，因为这有助于在跨越学习曲线后，将应用程序的直观性与整体易用性进行对比。\n\
  \n### 焦点小组\n\n焦点小组比走廊测试更正式，也可以提供许多有价值的反馈。除了向个人参与者发放 iPad 并要求他们执行与走廊测试中描述的工作流和场景外，焦点小组还可以提供独特的协作讨论和反馈。通常，将来自不同背景和技术技能水平的各种人聚集在同一个房间内讨论应用程序，可能会产生单靠个人级测试无法实现的突破性想法。在应用的迭代演变生命周期中，安排至少几次焦点小组会议是有价值的。\n\
  \n### 试点部署\n\n在许多传统的“试点部署”中，系统被交付少数用户进行测试，以确定是否适合推广到整个用户群。或者，在迭代式移动开发的背景下，试点可以也应该推出，其唯一目的是收集改进应用程序的反馈。与其使用试点来做出“去/留”的决策，不如使用试点来收集后续迭代的反馈，并在做出最终“去/留”决策之前对试点进行部署。\n\
  \n### 使用率分析\n\n在试点或全量部署中配置应用程序使用如 `Google Analytics` 之类的分析工具，可以提供关于用户如何使用应用程序、使用频率以及他们正在或没有利用哪些特性的极有价值的信息。当与用户调查结合时，这还可以提供有趣的数据对比和比较，凸显感知与现实之间的差异。\n\
  \n### 应用内反馈\n\n用户提供关于错误和怪癖、建议、功能请求或其他评论反馈的一种简单方法，是在应用程序内部包含一个“提供反馈”功能。这可以是应用内的表单，但一种流行的实现方法是允许用户从应用程序内部发送电子邮件。当用户选择“提供反馈”选项时，会出现一封新邮件，其主题和正文填充了任何相关信息（`device\
  \ UDID`、`user id`、`session token` 等）。甚至可以日志文件，以便随后对任何工作流序列、使用模式、错误消息和堆栈跟踪进行分析。\n\
  \n许多公司还成功利用了应用内调查和功能投票。假设应用程序路线图上有 10 个即将推出的特性。可以向用户展示所有特性的列表和描述，让他们选择他们最想要的三个特性。这提供了一种更客观的反馈，而不是来自随机且可能大声抗议的用户，他们可能只是从少数派的角度发表意见。\n\
  \n## 快速发布计划\n\n\n\n\n虽然在某些企业环境中存在一定争议，但许多领先的 iOS 开发者保持着非常快速的发布周期，通常每两到四周发布一次更新版本。这在应用程序首次投放市场时尤为如此，直到其特性和功能达到基准并趋于稳定。这种快速的发布周期适用于某些企业级应用，但对于其他企业级应用和公司环境，考虑到\
  \ QA（QA）资源在发布前应用回归测试方面的限制和要求，如此快的发布周期是不现实的。不过，重要的是，考虑到 Apple 自身的平台发布周期，三到四月的发布周期通常是\
  \ iOS 开发中不可忽视的要求，因为平台更新可能会（而且通常会）为现有应用引入问题。\n\n# 项目规划与管理\n\n从业务和项目管理的角度，有一些最佳实践可以帮助最大化\
  \ iPad 应用开发的成功率。无论你对项目管理方法论或方法持何态度，遵循这些理念都可以产生巨大的影响。\n\n## 从小开始\n\n意识到 iPad 应用与传统的企业级软件在本质上不同这一点是非常重要的。iPad\
  \ 应用应该有简洁、的焦点和目的，而不应该被不必要或很少使用的特性和功能所干扰。复杂的应用不仅开发起来需要更多的时间和金钱，与简单应用相比，它在采用时也会面临更多阻力。这并不是说你不能开发复杂的\
  \ iPad 应用，而是通过一系列小型发布，比通过一个巨大的开发和发布周期来交付复杂应用要容易得多。\n\n## 获得快速胜利\n\n如果你从小开始，你交付交付可能会比尝试从庞大的范围开始得更快速、更成功。一旦你取得了最初的成功，就可以通过反复迭代同一个应用程序并增加额外的特性和功能（基于来自真实用户的优先反馈），或通过在第一个应用之外引入额外的应用，从而在快速胜利的基础上继续构建。\n\
  \n## 为迭代做计划\n\n如果你从小开始并获得了快速胜利，你需要知道如何在此基础上构建。由于许多应用程序是复杂且庞大的，寻找一种通过系列迭代来交付广泛特性和功能的方法是非常重要的。当第一次或两次迭代发布后，后续迭代和发布的优先级几乎会发生变化，这就是为什么将大型且复杂的应用拆分为较小的应用和项目是非常有价值的。\n\
  \n## 尽且频繁地让用户\n\n再次，这一点已经提到多次，但其重要性值得反复强调。你的用户必须参与整个开发过程。开发团队往往与用户隔离开，并且难以接触最终客户，但对于\
  \ iPad 应用来说，这几乎保证了当用户最终收到应用时会出现问题。为了开发出成功的企业级 iPad 应用，用户必须在整个开发过程中参与。\n\n## 总结\n\
  \n在本章中，你学习了通过迭代来改进 iPad 应用设计的重要性——包括早期设计和原型阶段的迭代，以及贯穿整个开发过程后续迭代。你将传统的瀑布式开发方法与更敏捷、更迭代的过程（如\
  \ `Scrum`）进行对比，以理解在开发 iPad 应用时采用更敏捷方法的特定优势。\n\n你还涵盖了许多与用户建立反馈循环的方法，通过用户体验原型设计、走廊测试、焦点小组、试点部署、使用情况分析以及应用内反馈机制。然后，你看到了如何通过快速发布周期来利用这些反馈。\n\
  \n尽管这些方法对于企业 IT 部门的大多数人来说是新事物，但你是否愿意尝试一下，以提高你创建 iPad 应用成功的概率呢？\n\n本章结束了关于设计的章节，在下一节中我们将深入开发部分，下一章将讨论如何开始实际开发\
  \ iPad 应用。\n\n## 第四部分：开发\n\n### 本部分内容\n\n第 13 章：开发 iPad 应用\n第 14 章：应用之间共享业务逻辑\n\
  第 15 章：开发移动友好型 Web 服务\n第 16 章：确保应用和数据安全\n\n### 第 13 章：开发 iPad 应用\n\n### 本章内容简介\n\
  \n*   为 iPad 开发 Web 和原生应用\n*   使用 `HTML5` 和 `Sencha Touch` 创建 Web 应用\n*   使用 `Objective-C`\
  \ 创建原生应用\n*   使用 `C#` 创建原生 iPad 应用\n*   使用 `MEAP` 生成原生 iPad 应用\n*   理解每种方法的优势\n\n\
  在过去的几章中，你学习了设计 iPad 应用的流程，即通过原型设计、遵循最佳实践以及根据用户反馈进行迭代来优化用户体验。\n\n在本章中，你将学习如何将这些设计开发成功能完整的\
  \ iPad 应用。正如第 6 章所讨论，有几种不同的应用架构，每种架构都有其固有的优缺点。在本章中，我们将重点介绍用于 Web 和原生应用开发的概念、技术、框架、工具和开发环境。\n\
  \n首先，对于 Web 应用，你将查看用于创建 `HTML5` Web 应用的 `Sencha Touch` 框架。然后，你将查看创建原生应用，从 Xcode\
  \ 中的 `Objective-C` 和 `Cocoa Touch` 开始；然后使用带有 `MonoTouch` 的 `C#` 和 `.NET`；最后使用 `Sybase\
  \ Unwired Platform`，这是一个移动企业应用平台 (`MEAP`)。\n\n## 构建 Web 应用\n\n由于 iPad 拥有较大的高分辨率显示屏，并且运行着现代的支持\
  \ `HTML5` 的 `WebKit` 浏览器，它能够成功运行几乎任何基于标准的 Web 应用。这就是为什么像 `salesforce.com` 和 `NetSuite`\
  \ 这样流行的基于 Web 的企业软件可以在 iPad 上无需更改即可完美运行。\n\n尽管 iPad 能够运行几乎任何 `HTML` Web 应用，但重要的是意识到\
  \ iPad 与传统的个人电脑在本质上是不同的。因此，如果根据 iPad 来设计 Web 应用，其用户体验将得到极大的提升。\n\n虽然理论上有许多方法可以实现这一点，但最简单、最流行的方法之一是通过第三方框架来加速开发。有很多移动\
  \ `HTML5` 框架，但 `Sencha Touch` 是第一个真正拥抱 iPad 更大尺寸的框架，而不仅仅是较小的平板设备。让我们来看看这个独特且强大的框架。\n\
  \n### Sencha Touch HTML5 框架\n\n`Sencha Touch` 框架是一个相对简单但极其强大的框架，用于创建移动 Web 应用。使用\
  \ `Sencha Touch` 的优势之一是它被设计为支持 iPad 的大尺寸屏幕以及小尺寸的智能手机设备。这样，你就可以使用相同的框架来创建智能手机的 Web\
  \ 应用以及移动 iPad 应用。\n\n\n\n\n[content]\n\nSencha Touch 的开发完全使用 HTML、CSS 和 JavaScript\
  \ 完成，因此大多数 Web 开发者会对该框架感到非常熟悉。Sencha Touch 包含了一系列用户界面控件（或“组件”，这些组件可以用于快速创建美观且易于触摸的用户界面。该框架还包含一个本地存储代理用于将数据存储在本地设备上；针对点击、双指缩放、滑动和旋转的增强触摸事件；以及针对\
  \ AJAX 和 JSON 的内置数据集成支持。该框架允许开发者快速创建 Web 应用，如图 13.1 所示所示。\n\n图 13.1: Sencha Touch\
  \ 专为 iPad 等大尺寸移动设备的应用开发而设计。\n\n![13.1](img/c13f001.jpg)\n\n## 开发环境\n\nSencha Touch\
  \ 并没有特定的首选开发环境，因为该框架中的所有开发都是通过 HTML、CSS 和 JavaScript 完成的。由于这些语言在运行时进行渲染和解释，因此没有构建过程。你可以在任何喜欢的集成开发环境（IDE）或文本编辑器中编辑\
  \ HTML、CSS 和 JavaScript 文件，如图 13.2 所示的编辑器。\n\n图 13.2: Sencha Touch 开发是用 HTML、CSS\
  \ 和 JavaScript 完成的，因此可以使用任何编辑器。\n\n![13.2](img/c13f002.jpg)\n\n#### 语言和技术栈\n\nSencha\
  \ Touch 是一个基于 HTML5、CSS3 和 JavaScript 的框架，所有应用开发都是使用这些语言和技术进行的。不过，与其他某些 Web 应用开发风格不同，Sencha\
  \ Touch 中的大部分应用开发都是使用 JavaScript 完成的。事实上，你创建的主 HTML 文档有一个空的 `<body>` 标签，因为所有的 HTML\
  \ 在运行时使用 JavaScript 动态生成的。Sencha Touch 提供了一种基于 JavaScript 的模型视图控制器（MVC）设计模式来帮助你创建应用程序。\n\
  \n## 示例\n\n为了让你体验一下使用 Sencha Touch 开发应用的感受，让我们来看一个示例。\n\n在下面的代码段中，你可以看到一个名为“Company”的模型（Model）的实现，包括模型中的各种字段。它还展示了用于调用\
  \ Web 服务以检索 JSON 从而填充（hydrate）模型的代理：\n\n```\n Ext.regModel“Company”, {\n    fields:\
  \ [\n        {name: “ID”,             type: “int”},\n        {name: “Name”,    \
  \       type: “string”},\n        {name: “PrimaryAddress”, type: “object”},\n  \
  \      {name: “PrimaryPhone”,   type: “string”},\n        {name: “Website”,    \
  \    type: “string”}\n    ],\n    getGroupString : function(record) {\n        return\
  \ record.get(‘Name’)[0];\n    },\n    proxy: {\n        type: ‘rest’,\n        url\
  \ : ‘/customers.json’\n    },\n    associations: [\n        {type: ‘hasMany’, model:\
  \ ‘Address’, name: ‘Addresses’},\n        {type: ‘hasMany’, model: ‘Contact’, name:\
  \ ‘Contacts’}\n    ]\n});\n```\n\n在“Customer”模型的语境下，这里有一个名为 CompanyList 的视图（View），它显示了客户对象的集合：\n\
  \n```\n cust.views.CompanyList = Ext.extend(Ext.List, {\n    emptyText   : ‘No customers\
  \ matching that query.’,\n    ui: ‘cust’,    \n    itemTpl: new Ext.XTemplate(\n\
  \            ‘<div class=“company”>’,\n                ‘{Name}<br>’,\n         \
  \           ‘<small>’,\n                        ‘{PrimaryAddress.Street1}<br>’,\n\
  \                        ‘{PrimaryAddress.City}, {PrimaryAddress.State}’,\n    \
  \                    ‘{PrimaryAddress.Zip}’,\n                    ‘</small>’,\n\
  \            ‘</div>’\n    ),\n\n    initComponent: function() {\n        Ext.applyIf(this,\
  \ {\n            store: new Ext.data.Store({\n                model: “Company”,\n\
  \                autoLoad: true,\n                remoteFilter: true,\n        \
  \        sorters: ‘Name’,\n            })\n        });\n\n        cust.views.CompanyList.superclass.initComponent.apply(this,\
  \ arguments);\n\n        this.enableBubble(‘selectionchange’);\n    }\n});\n\nExt.reg(‘customerList’,\
  \ cust.views.CompanyList);\n```\n\n如你所见，如果你熟悉 JavaScript Web 开发，Sencha Touch 是一个非常简单但强大的框架，用于为\
  \ iPad 创建 Web 应用。如果你以前没有做过这种基于 JavaScript 的开发，可能会有一个学习曲线。但是，如果你计划为 iPad 开发 Web 应用，那么绝对值得看一看，看看它是否适合你和你的应用程序。\n\
  \n### 优点\n\nSencha Touch 是一个遵循通用公共许可协议（GPL）的开源框架。在本文写作时，提供双重许可，其中也提供免费的商业使用许可，尽管提供付费支持。该框架使得能够非常容易地构建针对触摸优化的应用程序，同时也支持启用\
  \ WebKit 浏览器的平台。\n\n### 缺点\n\n对于 Web 框架而言，Sencha Touch 目前是顶尖的。尽管如此，Web 应用提供的用户体验仍然不如原生应用丰富，而且它们需要混合外壳（而不是仅仅浏览器）来访问原生功能。此外，虽然\
  \ HTML5 支持离线存储和缓存清单预取，但管理数据同步和维护离线事务完整性仍然困难。\n\n## 构建原生应用\n\n在本节中，我们将介绍创建原生应用的种不同方法。首先，我们将使用\
  \ Objective-C 和 Cocoa Touch 创建原生应用。然后，我们将如何利用 MonoTouch 中对 Cocoa Touch 应用程序接口（API）的\
  \ C# 绑定，使用 C# 和 .NET 创建原生应用。最后，我们将查看流程。\n\n### Objective-C\n\nObjective-C 是 Apple\
  \ 使用 SDK 开发原生 iPad 应用的首选语言。虽然 Objective-C 在其大部分时间里是一门相对冷门的语言，但 iPhone 和 iPad 的流行，结合\
  \ App Store 的爆炸式增长，极大地提高了开发者对 Objective-C 的认知。\n\n#### Xcode 开发环境\n\niOS SDK 包含了\
  \ Xcode 开发环境（见图 13.3），以及用于设计图形界面的 Interface Builder、监控应用程序性能和内存使用的 Instruments，以及用于在\
  \ Mac 上而非物理设备上运行和调试应用的 iPhone 和 iPad 模拟器。Apple 免费提供 iOS SDK，但为了将应用程序部署到物理设备，你必须注册\
  \ Apple 开发者账户（标准版每年 99 美元，企业版每年 299 美元）。\n\n图 13.3: Xcode 是 Apple iOS SDK 中包含的集成开发环境。\n\
  \n![13.3](img/c13f003.jpg)\n[/content]\n\n\n\n\n`Cocoa Touch` 是一组用于开发原生 iPhone、iPod\
  \ touch 和 iPad 应用程序的 `iOS APIs`。该框架基于 `Model View Controller`（模型视图控制器）设计模式来开发应用程序。\n\
  \n`Cocoa Touch` 既是 `Mac OS X` 开发 `Cocoa APIs` 子集也是超集，它们都主要用 `Objective-C` 编写。`Cocoa\
  \ Touch` 位于 `iOS` 的分层堆栈中，位于 `Graphics` 和 `Media` (`Application Services`) 之上，然后是\
  \ `Core Services`，最后是 `Core OS` 和 `Mac OS X` 内核层。\n\n## Example\n\n为了感受使用 `Objective-C`\
  \ 和 `Cocoa Touch` 开发原生 iPad 应用的感觉，让我们来看一个示例。这里是一个表示 Model 的数据类的示例代码：\n\n```objc\n\
  \ @implementation Company\n\n@synthesize ID;\n@synthesize Website;\n@synthesize\
  \ Name;\n@synthesize PrimaryPhone;\n@synthesize PrimaryAddress;\n@synthesize Addresses;\n\
  @synthesize Contacts;\n\n- (id)init\n{\n    if (self = [super init])\n     {\n \
  \            self.ID = [[NSString alloc] init];\n             self.Website = nil;\n\
  \             self.Name = [[NSString alloc] init];\n             self.PrimaryPhone\
  \ = [[NSString alloc] init];\n             self.PrimaryAddress = [[NSString alloc]\
  \ init];\n             self.Addresses = nil;\n             self.Contacts = nil;\n\
  \       }\n       return self;\n}\n```\n\n这里是来自 `UITableViewDelegate` 内部的代码，负责在\
  \ View 中渲染上述 Model：\n\n```objc\n - (NSInteger)numberOfSectionsInTableView:(UITableView\
  \ *)aTableView {\n    // 返回 section 的数量。\n    return 1;\n}\n\n- (NSInteger)tableView:(UITableView\
  \ *)aTableView \nnumberOfRowsInSection:(NSInteger)section {\n    // 返回该 section\
  \ 中的行数。\n       if (companies != nil)\n             return companies.count;\n  \
  \     else\n             return 0;\n}\n\n- (UITableViewCell *)tableView:(UITableView\
  \ *)tableView \ncellForRowAtIndexPath:(NSIndexPath *)indexPath {\n\n    static NSString\
  \ *CellIdentifier = @“CellIdentifier”;\n\n    // 取用或创建一个适当类型的 cell。\n    UITableViewCell\
  \ *cell = [tableView dequeueReusableCellWithIdentifier:CellIdentifier];\n    if\
  \ (cell == nil) {\n        cell = [[[UITableViewCell alloc] \ninitWithStyle:UITableViewCellStyleSubtitle\
  \ reuseIdentifier:CellIdentifier] \nautorelease];\n        cell.accessoryType =\
  \ UITableViewCellAccessoryNone;\n    }\n\n    // 配置 cell。\n       Company* company\
  \ = [companies objectAtIndex:indexPath.row];\n    cell.textLabel.text = company.Name;\n\
  \       cell.detailTextLabel.text = [company.Website absoluteString];\n    return\
  \ cell;\n}\n```\n\n## Advantages\n\n使用 `Objective-C` 开发应用程序的主要优势是这种方法是 Apple 推荐的，因此大多数\
  \ iPad 开发的文档和示例源码都是用 `Objective-C` 编写的。\n\n## Disadvantages\n\n尽管 Apple 推荐，但 `Objective-C`\
  \ 是其技术栈的专有，因此应用程序逻辑无法迁移到其他非 Apple 平台。`Objective-C` 在大多数企业 IT 环境中并不是常见的技能 set，尽管它的流行度正在增加，但目前缺乏具备这种技能的熟练企业级开发者。\n\
  \n此外，Apple 目前针对 `iOS` 的 `Objective-C` 实现不包含垃圾回收（这是许多现代开发语言中具备的特性），而垃圾回收几乎消除消除了一整类调试问题，即内存泄漏。\n\
  \n## C# .NET\n\n与 `Objective-C` 不同，`C# .NET` 被企业 IT 广泛应用于开发。为了使用 `C#` 和 `.NET` 开发\
  \ iPad 应用程序，你必须利用名为 `MonoTouch` 的框架。`MonoTouch` 为开发者提供了访问 `Cocoa Touch` 原生 `iOS\
  \ APIs` 和 `.NET` 框架。这使得没有平台特定依赖的现有 `C#` 代码库可以重用于 iPad 开发，同时也允许用于 iPad 的 C# 代码 代码到其他平台。让我们仔细看看这种开发方法。\n\
  \n## MonoTouch Development Environment\n\n`MonoTouch` 使用 `MonoDevelop`（在图 13.4 所示）作为\
  \ IDE。虽然大多数 `C# .NET` 开发者使用 `Microsoft Visual Studio`，但 `MonoTouch` 开发必须在 Mac 上的\
  \ `MonoDevelop` 中完成。当然，`C# .NET` 业务逻辑和类可以在 Mac 上的 `MonoTouch` 开发与 Windows 上的 `Visual\
  \ Studio` 开发之间共享，但所有的表现层逻辑以及所有的构建和调试都必须在 Mac 上完成（因为所有 `MonoTouch` 构建也需要 `Apple iOS\
  \ SDK` 和编译器链）。iPad 模拟器可以用于调试，但正如之前提到的，在物理设备上进行调试和部署需要 `Apple Developer Program`。\n\
  \n图 13.4 ：`MonoDevelop` 是一个与 `Visual Studio` 相似的 IDE，用于在 Mac 上进行 iOS 开发。\n\n![13.4](img/c13f004.jpg)\n\
  \n## Language and Technology Stack\n\n`MonoTouch` 通过 `Mono` 让 `C#` 访问 `Cocoa Touch\
  \ API`。`Mono` 是 `Microsoft .NET` 的开源移植版，提供了 `C#` 编译器和运行时。虽然它提供了大多数 `.NET` 程序集的访问，但并不提供具有\
  \ Windows 特定依赖的程序集，例如 `Windows Forms` 或 `Windows Presentation Foundation`。结果是大部分\
  \ `Silverlight` 程序集加上部分桌面 `.NET` 程序集，并移除了一些功能。`MonoTouch` 程序集在应用二进制接口（ABI）方面与现有的\
  \ .NET 程序集不兼容，必须针对 `MonoTouch` 重新编译。与标准的 .NET（编译为中间语言 `IL` 并在运行时使用即时编译 `JIT`）不同，`MonoTouch`\
  \ 使用预编译（AOT）编译器在构建时而非运行时将其编译为机器码。\n\n为了理解 `MonoTouch` 项目看起来像什么样，这里是示例项目中的一些代码。在这个示例中，数据类表示\
  \ Model，如下：\n\n```csharp\n public class Company\n{\n    public string ID { get;\
  \ set; }\n    public string Name { get; set; }\n    public string Website { get;\
  \ set; }\n    public string PrimaryPhone { get; set; }\n    public Address PrimaryAddress\
  \ { get; set; }\n    public List<Address> Addresses { get; set; }\n    public List<Contact>\
  \ Contacts { get; set; }\n}\n```\n\n现在是 `UITableViewController` 的代码，用于在 `TableView`\
  \ 中渲染上述 Model：\n\n\n\n\n\n```c\n public class CustomerTableViewController : UITableViewController\n\
  {\n    public CustomerTableViewController ()\n    {\n        Title = “Customers”;\n\
  \n        List<Company> customers = GetCustomers();\n\n        TableView.Delegate\
  \ = new TableViewDelegate(customers);\n        TableView.DataSource = new TableViewDataSource(customers);\n\
  \        TableView.ReloadData();\n    }\n\n    private class TableViewDelegate :\
  \ UITableViewDelegate\n    {\n        private List<Company> list;\n        public\
  \ TableViewDelegate(List<Company> list)\n        {\n            this.list = list;\n\
  \        }\n        public override void RowSelected (UITableView tableView, \n\
  NSIndexPath indexPath)\n        {\n            string uri = list[indexPath.Row];\n\
  \            Application.Navigate(uri);\n        }\n    }\n\n    private class TableViewDataSource\
  \ : UITableViewDataSource\n    {\n        static NSString kCellIdentifier = new\
  \ NSString (“CustomerCell”);\n        private List<Company> list;\n\n        public\
  \ TableViewDataSource (List<Company> list)\n        {\n            this.list = list;\n\
  \        }\n\n        public override int RowsInSection (UITableView tableview,\
  \ int \nsection)\n        {\n            return list.Count;\n        }\n\n     \
  \   public override UITableViewCell GetCell (UITableView tableView, \nNSIndexPath\
  \ indexPath)\n        {\n            UITableViewCell cell = tableView.DequeueReusableCell\
  \ \n(kCellIdentifier);\n            if (cell == null)\n            {\n         \
  \       cell = new UITableViewCell \n                           (UITableViewCellStyle.Subtitle,\
  \ kCellIdentifier);\n                cell.Accessory =\n\t\t\t   UITableViewCellAccessory.DisclosureIndicator;\n\
  \            }\n            cell.TextLabel.Text = list[indexPath.Row].Name;\n  \
  \          cell.DetailTextLabel.Text = list[indexPath.Row].Website;\n          \
  \  return cell;\n        }\n        public override string TitleForHeader (UITableView\
  \ tableView, \n\t\t\t\t\t      int section)\n        {\n            return “Customers”;\n\
  \        }\n        public override int NumberOfSections (UITableView tableView)\n\
  \        {\n            return 1;\n        }\n    }\n}\n```\n\n### 优势\n\n假设你对应用层进行了松散耦合，使得底层业务逻辑不受任何平台特定代码的限制，使用\
  \ `C# .NET` 的最大优势是你的代码到其他平台具有近乎通的可移植性。\n\n如果你是一个 `.NET` 开发团队，你还有一个额外的好处，即可以从单一统一的技术栈保持一致性。此外，还有许多精通\
  \ `C# .NET` 的企业级开发者。\n\n自动垃圾回收是 `C#` 和 `MonoTouch` 相比于 `Objective-C` 的另一个优势。\n\n\
  ### 劣势\n\n如果你是一个 `Microsoft .NET` 团队，你可能认为使用 `MonoTouch` 的最大劣势是你需要在带有 `iOS SDK`\
  \ 的 `Mac OS X` 上使用 `MonoDevelop` 进行开发，而不是在 Windows 上使用 `Visual Studio`。话虽如此，如果你对代码进行了合理的分层，你可以在\
  \ `Visual Studio` 和 `MonoDevelop` 之间共享代码，因此你的开发者可以在 `Windows` 机器上开发业务逻辑和数据访问代码，只在\
  \ `Mac` 上进行表示层的开发、构建和调试。\n\n如果你不是 `.NET` 团队，并且永远不想支持 `iOS` 之外的任何平台，那么直接使用 `Objective-C`\
  \ 可能比使用带有 `MonoTouch` 的 `C#` 更优。\n\n### MEAP\n\n移动企业应用平台（或简称 `MEAP`）提供了中间件，将后端数据和功能扩展到移动设备。Sybase（现归企业软件巨头\
  \ `SAP` 所有）拥有行业领先的 MEAP，即 `Sybase Unwired Platform` (`SUP`)。为了学习如何使用 `MEAP` 开发 iPad\
  \ 应用，让我们仔细查看该平台。\n\n#### Sybase Unwired Platform\n\n`SUP` 提供了数据同步中间件以及一种第四代语言 (`4GL`)，允许快速开发移动应用。它包含一个名为\
  \ `Sybase Unwired Workspace` 的设计器，该设计器与 `Eclipse` 集成以创建移动业务对象 (`MBOs`)，这些对象可以与后端数据源进行视觉集成（如图\
  \ 13.5 所示）。\n\n[Figure 13.5]: Sybase Unwired Platform 为数据集成提供了可视化的拖放界面。\n\n![13.5](img/c13f005.jpg)\n\
  \n虽然 `SUP` 支持某些移动平台的用户界面生成，但针对 `iOS` 的 `SUP` 开发方法是使用 `Objective-C` 和 `Cocoa Touch`\
  \ 创建原生用户界面，并依赖 `SUP` 进行数据访问层。通过代码生成，`MBOs` 被转换为 `Objective-C` 代码，然后可以用于从原生 iOS 应用访问数据。\n\
  \n#### 语言和技术栈\n\n`SUP` 技术栈涉及开发工具、同步框架和数据中间件的结合。`SUP` 提供的 `4GL` 是一种专有语言，但生成的 `MBOs`\
  \ 随后可以通过代码生成工具转换为用于 `iOS` 开发的 `Objective-C` 代码，如图 13.6 所示。生成的代码可以被添加到 `Xcode` 中的\
  \ `Objective-C` 原生 iPad 应用中，并可以使用 `SUP` 同步框架将 `iOS` 设备上的客户端数据与后端数据源进行同步。\n\n[Figure\
  \ 13.6]: Sybase Unwired Platform 使用代码生成将业务对象转换为 Objective-C 用于 iOS 开发。\n\n![13.6](img/c13f006.jpg)\n\
  \n## 示例\n\n由于 `SUP` 应用的用户界面使用了前文提到的相同的 `Objective-C` 和 `Cocoa Touch`，我们不会关注应用的表示层，而是关注数据访问层。在下面的代码段中，配置了\
  \ `SUP` 同步配置并启动了后台同步：\n\n```\n SUPConnectionProfile* cp = [CustomerApp_CustomerDB\
  \ \ngetSynchronizationProfile];\n[cp setDomainName:@“default”];\n\n[CustomerApp_CustomerDB\
  \ createDatabase];\n[CustomerApp_CustomerDB startSynchronization];\n\nNSInteger\
  \ status = [SUPMessageClient start];\n```\n\n为了访问本地数据，可以使用类似 SQL 的语法进行查询：\n\n```\n\
  \ SUPQuery *query = [SUPQuery getInstance];\n[query select:@“c.name,c.website,s.phone”];\
  \        \n[query  from:@“Customer”:@“c”];\n[query  join:@“Address”:@“a”:@“a.cust_id”:@“c.id”];\n\
  query.testCriteria =\n[SUPAttributeTest match:@“c.name”:@“American Company”];\n\
  SUPQueryResultSet* resultSet = [CustomerApp_CustomerDB \nexecuteQuery:query];\n\
  if(resultSet == null)\n{ \n    MBOLog(@“executeQuery failed”);\n    return;\n} \
  \ \nfor(SUPDataValueList* result in resultSet)\n{\n    MBOLog(@“name,website,phone\
  \ = %@ %@ %@”,\n    [SUPDataValue  getNullableString:[result item:0]],\n    [SUPDataValue\
  \ getNullableString:[result item:1]],\n    [SUPDataValue getNullableString:[result\
  \ item:2]]);\n```\n\n如果你对构建移动 Web 服务感兴趣，并且倾向于使用中间件将现有数据库的过滤子集同步到移动设备，像 `SUP` 这样的\
  \ MEAP 作为移动访问网关和中间件层提供了巨大的价值。\n\n此外，MEAP 的代码生成方法可以提供代码的可性和跨平台支持，因为代码可以生成以支持多个平台。\n\
  \n\n\n\n\n本章讨论了 Web 和原生 iPad 应用程序的开发方法。对于 Web 开发，`Sencha Touch` 框架被概述为使用 `HTML5`、`CSS3`\
  \ 和 `JavaScript` 开发 iPad 应用的卓越选择。\n\n对于原生开发，我们讨论了更多选项，包括 `Xcode` 中的 `Objective-C`\
  \ 和 `Cocoa Touch`、带有 `MonoTouch` 的 `C# .NET`，以及作为移动企业应用平台示例的 `Sybase Unwired Platform`。\n\
  \n现在了解了开发 iPad 应用的不同方法的优点，你是否清楚为组织开发应用将采用什么方法？\n\n在下一章中，我们将讨论如何通过企业库和代码可移植性，跨应用程序共享业务逻辑。\n\
  \n### 第 14 章：应用程序之间的业务逻辑共享\n\n### 本章内容\n\n- 建立可重用组件的企业级库\n- 跨架构共享业务逻辑代码\n- 为应用代码到其他平台的可移植性进行规划\n\
  - 为混合应用统一使用 `JavaScript` 接口\n- 利用自定义 URI 方案\n- 创建一套相互关联的 iPad 应用程序\n\n上一章研究了用于创建\
  \ iPad 应用的各种语言、开发环境和技术栈。\n\n在本章中，你将研究一些企业级 iPad 应用的最佳实践。\n\n首先，你将涵盖可重用企业软件库和组件的设计与使用，以简化开发，并对安全相关的身份验证或加密，或日志、分析等实用工具进行标准化。\n\
  \n然后，你将概述如何设计应用程序以实现跨架构的灵活性，以及在未来必要时向其他平台的可移植性。还将涵盖混合应用开发的标准制定。\n\n最后，你将查看自定义 URI\
  \ 方案，以及如何利用它不仅为你的 iPad 应用程序提供深度链接，还能促进创建一套稳健的应用集。\n\n## 使用可重用组件\n\n无论你选择何种架构和技术栈来开发企业级\
  \ iPad 应用，在逻辑上设计并分离组件，以便它们可以在需要时被重用，都是很好的主意。\n\n这可能涉及创建一个企业级库或框架，以为各种服务、功能或工具提供标准访问，帮助快速启动移动开发工作。它还涉及考虑类库的结构，因为可能某些代码适用于两个独立但相关的应用程序共享，但不适合包含在共享的企业级功能或工具库中。\n\
  \n让我们仔细观察这些类型的可重用软件组件。\n\n### 创建企业级库\n\n对于寻求建立更成熟的移动和 iPad 应用开发能力的组织来说，建立可重用组件、功能和服务的企业级库是有价值的。\n\
  \n除了提供围绕各种规范的应用模板和标准外，企业级库应该包含大多数 iPad 应用所需的各种软件组件。\n\n例如，安全组件是应当标准化的最明显且价值最高的功能部分。首先，组织应该建立安全标准；通过为身份验证、授权、加密等功能提供共享库，可以确保安全性。此外，共享身份验证库可以实现单点登录（SSO）方案，身份令牌可以安全地存储在\
  \ `iOS keychain` 中并在内部应用程序之间共享。这将在第 16 章中详细讨论。\n\n此外，设备和硬件访问抽象层（如条码扫描）可以提供支持多个条码扫描仪并在需要时更换硬件。另一个很好的例子是应用程序配置、日志、分析或通过推送通知进行警等等工具。对这些基础实用工具进行标准化可以为开发者提供巨大价值，他们可以专注于需要创建的应用，而不是重复发明这些常用实用工具。你可以在图\
  \ 14.1 中看到企业实用工具集的示例。\n\n图 14.1: 常用企业移动软件组件库可以提供巨大价值并帮助快速启动移动开发工作。\n\n![14.1](img/c14f001.jpg)\n\
  \n### 组织类库\n\n将逻辑和类分离到单独的类库也具有价值。正如之前的章节所述，iPad 应用应该从本质上专注于单一任务和目的，这通常需要将现有的桌面或基于\
  \ Web 的应用程序转换为多个 `iOS` 应用。由于许多相同的应用程序可能共享类似的业务逻辑和数据结构，因此在套件内的两个或多个应用程序之间共享类库通常是合适的，但并不一定适合放在共享的企业功能或工具库中。\n\
  \n### 跨架构共享\n\n在上一章中，我们查看了 Web 应用以及原生应用的开发。由于 Web 应用可以托管在运行 `C# .NET` 的服务器上，因此原生\
  \ `MonoTouch` 客户端和 `HTML5` 应用可以共享相同的业务逻辑和数据集成层，如图 14.2 所示。\n\n图 14.2: 业务逻辑和数据应用层可以跨原生和\
  \ Web 应用共享。\n\n![14.2](img/c14f002.jpg)\n\n#### 清晰分离层次的价值何？\n\n以这种方式开发应用程序可以提供许多益处。首先，你可以选择将应用程序部署为\
  \ Web、原生或混合应用，它们都共享相同的业务逻辑。或者，你正在开发一个 Web 应用，在初始部署后，用户请求一个需要该应用变为原生应用的新功能。你只需要开发一个原生用户界面，即可作为原生\
  \ iPad 应用提供相同的应用。反之亦然；你可能从原生应用开始，由于某些原因需要将其转换为 Web 应用。\n\n即使你只是在开发 Web 应用，实现这种清晰的分离仍然可以很多价值。你可能希望有多个\
  \ Web 显示层：一个用于桌面浏览器，一个用于 iPad，其他用于智能手机设备。最后，如果你在开发业务逻辑和数据集成层时不产生任何平台特定的依赖项，那么这些代码就具有高度的可移植性，不仅限于原生应用和基于服务器的\
  \ Web 应用之间，还可以到其他 `Windows`、`Unix` 和 `Linux` 操作系统。\n\n### 共享业务逻辑和数据代码\n\n为了理解代码共享如何工作，让我们看看实现这种方法的许多方式中的一种。\n\
  \n开源框架 `MonoCross` 很好地阐明了这一概念，因此让我们检查上一章中相同的客户应用示例如何在 `MonoCross` 中进行开发。\n\n`MonoCross`\
  \ 提供了一个模型-视图-控制器（MVC）框架，其中 `Model` 和 `Controller` 可以跨架构共享，但 `View` 是针对实现进行定制的。\n\
  \n\n\n\n\n在这个示例中，我们将拥有一个共享的 `Application`、`Models` 和 `Controllers`。这些内容在原生和基于 Web\
  \ 的架构中都是共享的，但针对这两种架构，每个 `View` 都有各自独立的实现。对于基于 Web 的架构，`Views` 是 `ASP.NET` 的实现，生成的\
  \ HTML 将通过 AJAX 响应返回给 Web 客户端。对于原生 MonoTouch 应用程序，每个 `View` 都实现为 `UITableViewController`。\n\
  \n你可能注意到的关于共享应用程序的要点之一是它使用了基于 URI 的导航。这很重要，因为无论应用程序是原生的基于 Web 的，它都提供了一种统一的导航方法。虽然原生应用中可能有许多方式来实现导航，但\
  \ Web 应用是基于 URI 导航范式的，通过在原生应用中采用相同的方法，可以实现更完整地共享应用程序逻辑。URI 导航映射中的 `\"{id}\"` 与导航发生时传递的参数相关。\n\
  \n以下代码展示了共享应用程序的实现。\n\n```csharp\n public class App : MXApplication\n{\n    public\
  \ override void OnAppLoad()\n    {\n        // Set the application title\n     \
  \   Title = “Customers”;\n\n        // Add navigation mappings\n        NavigationMap.Add(\"\
  ”, new CustomerListController());\n        NavigationMap.Add(\"{id}”, new CustomerController());\n\
  \n        // Set default navigation URI\n        NavigateOnLoad = “”;\n    }\n}\n\
  ```\n\n在这个示例中，基础 `Model` 是一个名为 `Company` 的类，它可以包含描述任何给定客户的数据：\n\n```csharp\n public\
  \ class Company\n{\n    public string ID { get; set; }\n    public string Name {\
  \ get; set; }\n    public string Website { get; set; }\n    public string PrimaryPhone\
  \ { get; set; }\n    public Address PrimaryAddress { get; set; }\n    public List<Address>\
  \ Addresses { get; set; }\n    public List<Contact> Contacts { get; set; }\n}\n\
  ```\n\n对于客户列表，我们没有创建一个新类作为 `Model`，而是简单地使用 `Company` 类型的 `List`：\n\n```csharp\n\
  \ List<Company>\n```\n\n这里是客户列表的 `Controller`，其中 `Model` 是 `Company` 类型的 `List`。该\
  \ `Controller` 调用 Web 服务并根据情况设置 `Model`：\n\n```csharp\n public class CustomerListController\
  \ : MXController<List<Company>>\n{\n   public override void Load(Dictionary<string,\
  \ string> parameters)\n   {\n        Model = new List<Company>();\n        try\n\
  \        {\n            XmlSerializer serializer = new \nXmlSerializer(typeof(List<Company>));\n\
  \n            // web request\n            string urlCustomers =\n\n“http://dev.acmecorp.com/services/customers.xml”;\n\
  \            HttpWebRequest request =\n(HttpWebRequest)HttpWebRequest.Create(urlCustomers);\n\
  \            using (StreamReader reader =\n                    new StreamReader(request.GetResponse()\n\
  .GetResponseStream(), true))\n            {\n                Model = (List<Company>)serializer.Deserialize(reader);\n\
  \            }\n        }\n        catch (Exception ex)\n        {\n           \
  \ Debug.WriteLine(ex.Message);\n            Debug.WriteLine(ex.StackTrace.ToString());\n\
  \        }\n    }\n}\n```\n\n这是第二个用于显示特定客户详情的控制器。注意在此示例中，客户的 `\"id\"` 是通过 `parameters`\
  \ 字典传入的，字典上的键指向在导航映射中添加的动态参数值：\n\n```csharp\n public class CustomerController :\
  \ MXController<Company>\n{\n    public override void Load(Dictionary<string, string>\
  \ parameters)\n    {\n        Model = new Company();\n\n        try\n        {\n\
  \            XmlSerializer serializer = new XmlSerializer(typeof(Company));\n  \
  \          string urlCustomers = string.Format(\n“http://dev.acmecorp.com/services/customers/{0}.xml”,\
  \ parameters[“id”]);\n\n            // web request\n            HttpWebRequest request\
  \ =\n(HttpWebRequest)HttpWebRequest.Create(urlCustomers);\n            using (StreamReader\
  \ reader =\n                new StreamReader(request.GetResponse().GetResponseStream(),\
  \ \ntrue))\n            {\n                Model = (Company)serializer.Deserialize(reader);\n\
  \            }\n        }\n        catch (Exception ex)\n        {\n           \
  \ Debug.WriteLine(ex.Message);\n            Debug.WriteLine(ex.StackTrace.ToString());\n\
  \        }\n\n    }\n```\n\n通过不让这些共享类依赖于任何特定平台的依赖项，相同的代码可以在无需任何更改的情况下被任何平台或架构使用。\n\
  \n### 服务端 HTML5 应用程序\n\n再次，虽然基础 `Application` 以及 `Models` 和 `Controllers` 是共享的，但\
  \ `Views` 必须为每个平台和/架构实现。为了创建一个基于 HTML5 的 Web 应用，我们将使用运行在服务器上的 `ASP.NET`。由于共享应用程序业务逻辑使用了\
  \ Web 应用标准的基于 URI 的导航范式，传入的请求将映射到相应的 `Controller`，然后将 `Model` 传递给正确的 `View` 进行渲染。在这个示例中，客户端\
  \ Web 应用向基于服务器的程序发送 AJAX 请求，以请求客户列表视图。`View` 被渲染为 HTML 代码并放置在 XML 响应中，客户端 JavaScript\
  \ 随后将其注入到文档对象模型 (`DOM`) 中显示：\n\n```csharp\n public class CustomerListView : MXView<List<Company>>\n\
  {\n    public override void Render()\n    {\n        HtmlGenericControl div = new\
  \ HtmlGenericControl(“div”);\n        div.Attributes.Add(“class”, “iMenu”);\n\n\
  \        HtmlGenericControl ul = new HtmlGenericControl(“ul”);\n        ul.Attributes.Add(“class”,\
  \ “iArrow”);\n\n        foreach (Company customer in Model)\n        {\n       \
  \     HtmlGenericControl li = new HtmlGenericControl(“li”);\n            HtmlGenericControl\
  \ a = new HtmlGenericControl(“a”);\n            a.Attributes.Add(“href”, \n    \
  \                    HttpUtility.UrlPathEncode(string.Format(“{0}”, \n         \
  \               customer.ID)));\n            a.Attributes.Add(“rev”, “async”);\n\
  \            HtmlGenericControl em = new HtmlGenericControl(“em”);\n           \
  \ em.InnerText = customer.Name;\n            HtmlGenericControl small = new HtmlGenericControl(“small”);\n\
  \            small.InnerText = string.Format(“{0}<br>{1}, {2}  {3}”,\n         \
  \               customer.PrimaryAddress.Street1, \n                        customer.PrimaryAddress.City,\
  \ \n                        customer.PrimaryAddress.State, \n                  \
  \      customer.PrimaryAddress.Zip);\n\n            a.Controls.Add(em);\n      \
  \      a.Controls.Add(small);\n            li.Controls.Add(a);\n            ul.Controls.Add(li);\n\
  \        }\n        div.Controls.Add(ul);\n        MXWebkitContainer.WriteControlToResponse(“CustomerList”,\
  \ \n                                                 “Customers”, div);\n    }\n\
  }\n```\n\n正如你在这个示例中看到的，虽然 `Model` 和 `Controllers` 没有特定平台的依赖项负担，但 `View` 显然有。这是必要的；虽然应用程序的业务逻辑和数据集成层是可以共享的，但表示层需要使用特定平台的技术。\n\
  \n### 客户端原生应用程序\n\n对于此示例的原生版本，我们将再次使用相同的基础 `Application` 类以及 `Models` 和 `Controllers`。为了创建原生的\
  \ iPad 用户体验，我们将使用使用 `MonoTouch` 从 C# 访问 CocoaTouch 应用程序编程接口 (`API`)。对于我们刚刚使用 HTML\
  \ 显示的同一个 `View`，我们将使用 `UITableViewController` 为原生应用创建它。我们将使用 `UITableViewDelegate`\
  \ 在选择项目时触发适当的导航，并使用 `UITableViewDataSource` 通过重写 `GetCell` 方法并返回适当渲染的 `UITableViewCell`\
  \ 来实际上将 `Model` 绑定到原生用户界面。\n\n\n\n\n\n```\n [MXTouchViewType(ViewType.Master)]\n\
  public class CustomerListView : MXTouchTableViewController<List<Company>>\n{\n \
  \   public CustomerListView()\n    {\n    }\n    public override void Render ()\n\
  \    {\n        Title = “Customers”;\n        TableView.Delegate = new TableViewDelegate(Model);\n\
  \        TableView.DataSource = new TableViewDataSource(Model);\n        TableView.ReloadData();\n\
  \    }\n\n    private class TableViewDelegate : UITableViewDelegate\n    {\n   \
  \     private List<Company> list;\n        public TableViewDelegate(List<Company>\
  \ list)\n        {\n            this.list = list;\n        }\n        public override\
  \ void RowSelected (UITableView tableView, NSIndexPath \n\t\tindexPath)\n      \
  \  {\n            string uri = list[indexPath.Row];\n            MXTouchContainer.Navigate(uri);\n\
  \        }\n    }\n\n    private class TableViewDataSource : UITableViewDataSource\n\
  \    {\n        static NSString kCellIdentifier = new NSString (“CustomerCell”);\n\
  \        private List<Company> list;\n\n        public TableViewDataSource (List<Company>\
  \ list)\n        {\n            this.list = list;\n        }\n\n        public override\
  \ int RowsInSection (UITableView tableview, int section)\n        {\n          \
  \  return list.Count;\n        }\n\n        public override UITableViewCell GetCell\
  \ (UITableView tableView, \n            NSIndexPath indexPath)\n        {\n    \
  \        UITableViewCell cell = tableView.DequeueReusableCell \n(kCellIdentifier);\n\
  \            if (cell == null)\n            {\n                cell = new UITableViewCell\
  \ \n                           (UITableViewCellStyle.Subtitle, kCellIdentifier);\n\
  \                cell.Accessory = UITableViewCellAccessory.\n                DisclosureIndicator;\n\
  \            }\n            cell.TextLabel.Text = list[indexPath.Row].Name;\n  \
  \          cell.DetailTextLabel.Text = list[indexPath.Row].Website;\n          \
  \  return cell;\n        }\n        public override string TitleForHeader (UITableView\
  \ tableView,\n\t\t\t\t\t      int section)\n        {\n            return “Customers”;\n\
  \        }\n        public override int NumberOfSections (UITableView tableView)\n\
  \        {\n            return 1;\n        }\n    }\n}\n```\n\n任何利用 iOS 开发工具包提供的\
  \ API 的特定平台代码都应该隔离在表示层。通过这种方法，应用程序底层的业务逻辑和数据集成层就不会被锁定在特定平台上，并且可以像本示例所示利用架构灵活性。\n\
  \n### 跨平台共享\n\n有多种方法可以在多个平台之间共享应用程序投资，无论这是即时需求，还是仅仅是未来移动格局规划的一部分。当然，Web 应用程序具有某种可移植性，尽管级联样式表\
  \ (`CSS`) 和 JavaScript 支持在不同平台之间有所差异，但可以实现大量的重用。我们之前提到过这一点，但也有其他方法可以最大化原生和混合应用程序的可移植性。\n\
  \n#### 可移植源代码\n\n通过 `Mono` 实现 `C# .NET` 标准化的一个重要优势是，如果你选择在此技术栈上开发 iPad 应用，那么你的代码对其他平台具有很好的移植性。\n\
  \n事实上，上述使用 `MonoCross` 的示例可以很容易通过 `Windows WPF`、`Windows Phone 7 Silverlight` 或\
  \ `Mono for Android` 支持其他平台。要在这些其他平台上实现此示例，你只需要创建一个容器项目，引用共享应用程序类库，并通过根据平台适当实现每个\
  \ `View` 来创建特定平台的表示层。\n\n#### 混合 JavaScript 接口\n\n如第 6 节所述，混合应用程序的优势之一是通过 JavaScript\
  \ 接口从 Web 应用程序访问原生设备功能。虽然像相机、加速度计、联系人，甚至通过第三方硬件配件或 `SDKs` 进行条码扫描的原生 API 会因平台而异，但混合应用程序可以提供一个标准的抽象层，使得混合应用也可以在多个平台之间迁移（图\
  \ 14.3）。\n\n图 14.3: 用于从混合应用程序访问原生功能的 JavaScript 接口在多个平台上可以是相同的。\n\n![14.3](img/c14f003.jpg)\n\
  \n开源项目 `PhoneGap` 为这种架构方法提供了绝佳示例。`PhoneGap` 为原生功能暴露了标准的 JavaScript `APIs`，包括加速度计、相机、指南针、联系人、设备、事件、文件系统、地理位置、媒体播放、网络、通知和存储。在适用的情况下，`PhoneGap`\
  \ 遵循 `W3C API` 规范，因此即使特定平台供应商未添加对特定功能的支持，该功能也可以在更多平台上可用。通过暴露标准的 JavaScript 接口，混合应用可以利用这个抽象层来支持广泛的平台。\n\
  \n例如，`PhoneGap API` 暴露了这样的 JavaScript 辅助方法：\n\n```\nnavigator.notification.beep(3);\n\
  ```\n\n在后台，这利用了自定义 URI 方案（URI schemes）在 Web 应用程序和原生壳之间传递信息。`PhoneGap` 使用以下自定义 URI\
  \ 方案来识别何时应该拦截 Web 应用程序的导航：\n\n```\nphonegap://\n```\n\nWeb 应用程序中的 JavaScript 能够通过辅助方法将方法和参数转换为自定义\
  \ URI 来与原生应用程序通信，例如：\n\n```\nphonegap://notification/beep/3\n```\n\n虽然 `PhoneGap`\
  \ 使用了特定的语法，但如果你愿意，也可以采用类似的方法开发自己的混合壳。你的原生壳应用程序可以实现一个 `UIWebView` 来拦截对特定 URI 的尝试，例如使用自定义的“acmecorales”：\n\
  \n```\nacmecorales://notification/beep/3\n```\n\n再次，`PhoneGap` 提供了巨大的价值，但如果你有在应用程序内部触发激光扫描仪等需求，你可以扩展\
  \ `PhoneGap` 或实现自己的功能，如下：\n\n```\nacmecorales://barcodesanner/startscan\n```\n\n\
  最终如果你正在开发混合应用程序，使用像 `PhoneGap` 实现的此类约定对于代码的长期移植性非常有价值，无论你是否选择使用 `PhoneGap` 项目。\n\
  \n### 使用自定义 URI 方案\n\n`iOS` 的功能之一是可以为应用程序定义自定义 URI 方案。这提供了从其他应用程序启动你的程序，甚至通过点击电子邮件或网络浏览器中的链接来启动的能力。例如，你可以使用\
  \ `mailto` 链接启动用户的电子邮件应用程序并创建新的电子邮件消息，如下：\n\n```\nmailto://\n```\n\n同样，你可以在应用程序的\
  \ `info.plist` 中定义自定义 URI 方案以为应用程序注册特定方案，例如：\n\n```\nacmecorales://\n```\n\n一旦注册了自定义\
  \ URI 方案，设备只要导航到带有该方案的 URL，你的应用程序就会启动，整个 URL 将传递给应用程序。你可以在应用程序的 `UIApplicationDelegate`\
  \ 中访问它。\n\n在 Objective-C 中：\n\n```objc\n- (BOOL)application:(UIApplication *)application\
  \ openURL:(NSURL *)url\n    sourceApplication:(NSString *)sourceApplication annotation:(id)annotation\n\
  {\n    // validate and navigate within the app as appropriate\n}\n```\n\n或者在 C#\
  \ 中：\n\n```csharp\npublic override void OpenUrl (UIApplication application, \nMonoTouch.Foundation.NSUrl\
  \ url, \n    string sourceApplication, MonoTouch.Foundation.NSObject annotation)\n\
  {\n    // validate and navigate within the app as appropriate\n}\n```\n\n\n\n\n\
  这是促进启动应用程序、确认源应用程序以及在启动时向应用传递的核心机制。\n\n## 使用 URI 进行导航\n\n虽然在本章较早部分已经针对原生架构与基于 Web\
  \ 的架构之间代码的可移植性讨论了 URI 风格的导航，但无论你是使用 Objective-C 还是 C# 构建应用，采用基于 URI 的导航方法还有其他一些优势。\n\
  \n例如，你可以设计你的应用程序，让使用户导航到：\n\n```\nacmecorpsales://customer/12345\n```\n\n用户随后就可以通过指定的标识符查看客户详情。如果整个应用程序都以这种方式设计，不仅可以简化应用内导航逻辑，而且当你开发了多个内部\
  \ iOS 应用程序时，它还可以提供其他益处。\n\n## 创建应用程序套\n\n想象一下，你的组织开发并部署的第一个内部 iPad 应用程序用于销售流程自动化。在第一个应用开发并部署后，出现了创建第二个业务智能或高管仪表板应用程序的需求。一旦部署了第二个应用程序，就会定义一个自定义\
  \ URI 方案（URI scheme）来启动该应用程序：\n\n```\nacmecorpdashboard://\n```\n\n这是除了第一个方案之外新增的：\n\
  \n```\nacmecorpsales://\n```\n\n结果是，应用程序可以相互链接。通过从仪表板应用内部导航到特定地址，销售应用将启动，反之亦然；通过导航到仪表板应用的自定义\
  \ URI，仪表板应用就可以启动。\n\n这允许创建一组内部应用程序，它们是相互分离且独立的，但可以通过将执行权从一个应用传递到另一个应用来相互交互。\n\n\
  ## 跨应用程序的深度链接\n\n那么，如何利用一个应用启动其他应用的能力来增强用户体验并充分利用内部应用程序套呢？\n\n实现这一目标最强大的方法之一是通过自定义\
  \ URI 方案对应用程序进行深度链接（deep-linking）。例如，可以使用如下链接来启动产品目录应用并打开到特定的产品详情视图：\n\n```\nacmecorproducts://sku/abc123\n\
  ```\n\n该产品目录应用可以同时链接到销售应用和仪表板应用。在销售应用中，用户可能正在查看历史订单包含的产品，并可能想要查看有关产品的更多信息。与其在销售应用中添加显示产品信息的功能，销售应用可以简单地链接到产品应用。但为什么要创建一个独立的产品应用，而不是直接将该功能添加到销售应用中呢？想象高管仪表板应用按产品显示销售数字。如果产品应用作为一个独立应用可用，那么销售应用和仪表板应用都可以利用深度链接能力来共享功能。\n\
  \n## 利用回调设计\n\n链接到其他自定义内部应用很棒，但如果用户需要快速且方便地返回初始应用程序怎么办？\n\n在例例中，链接到应用程序的深度链接包含了指向原始应用程序的回调：\n\
  \n```\nacmecorproducts://sku/abc123?callback=acmecorpsales://customer/12345\n```\n\
  \n这允许第二个应用程序在用户完成特定工作流、点击返回按钮或关闭模态视图（modal View）时返回原始应用程序。这样，独立应用程序可以提供简单且专注的功能来满足其核心目的，并且可以利用套件中的其他应用实现复杂的应用程序和工作流。\n\
  \n## 建立企业标准\n\n在使用自定义 URI 方案时，为它们的使用定义并建立企业标准至关重要。自定义 URI 方案对于 App Store 中的应用程序和内部应用程序来说都应该是唯一的。你的组织应该定义用于内部自定义\
  \ URI 方案命名的前缀和规范。\n\n这种方法具有许多安全影响。例如，你可能不想在切换应用之间要求用户重新登录，因此身份验证应通过在共享组钥匙串（keychain）项中存储凭据或会话令牌来使用共享的单登录（SSO）机制。此外，你应该设计你的自定义\
  \ URI 方案实现以安全地验证和授权源，并确保在没有用户意图的情况下意外或恶意执行交易。设计这些安全机制至关重要。这些确保自定义 URI 深度链接安全并促进单登录的概念将在第\
  \ 16 章进行更详细讨论。\n\n## 总结\n\n在本章中，你查看了如何设计和开发 iPad 应用程序以最大化代码复用——在同一平台上的多个应用之间、使用不同架构（如原生和\
  \ Web）的应用之间，以及针对不同平台的同一应用程序版本之间。你还查看了如何使用标准的抽象 JavaScript 接口来开发的混合应用程序。最后，你学习了如何使用自定义\
  \ URI 方案创建应用程序套件，该套件可以安全地为跨多个应用的用户工作流提供深度链接和回调。\n\n在下一章中，你将涉及移动友好 Web 服务服务端开发的最佳实践。\n\
  \n### 第 15 章：开发移动友好型 Web 服务\n\n### 本章内容包括？\n\n* 为你的 Web 服务选择最佳技术栈\n* Java 和 .NET\
  \ 栈的技术选项\n* 如何客户端和服务器之间共享数据类\n* 开发 RESTful Web 服务的最佳实践\n* 针对移动性优化服务的原则\n* 移动友好型\
  \ RESTful Web 服务示例\n\n最后几章讨论了使用多种不同架构和方法开发 iPad 应用程序。\n\n在本章中，你将查看服务端 Web 服务开发。正如第\
  \ 8 章之前讨论的，基于 SOAP 的服务通常开销大得多且比 RESTful 服务重，因此本章将重点关注创建移动友型的 RESTful 服务。可以使用几十种语言和技术栈来创建\
  \ RESTful Web 服务，但在企业世界中，有两种语言和技术最流行：Java 和 .NET。你将使用这两种技术栈检查 RESTful 服务创建的基础。此外，如果客户端开发和服务端开发都使用\
  \ C# .NET，你将接触如何在客户端和服务器之间共享数据类。\n\n你将查看一些移动友好型 RESTful 服务设计的最佳实践，包括 REST 的资源导向特性、保持一切尽可能轻量化的重要性以及\
  \ RESTful 服务端点命名规范。\n\n最后，你将查看一个 RESTful Web 服务示例创建。\n\n## 选择技术栈\n\n在为你的服务端移动 Web\
  \ 服务开发选择技术栈时，决定通常很容易。大多数大型企业 IT 组织使用 Java 和/或 .NET 进行应用程序和 Web 服务开发，在创建移动友型的 Web\
  \ 服务层时，通常没有理由进行更改。\n\n正如最后几章所讨论的，有很多不同的客户端技术选项，大多数对于企业 IT 组织来说可能是新的的。但对于服务端技术，确实不需要偏离企业标准。\n\
  \n\n\n\n为供 iPad 应用程序使用的创建移动友好型 Web 服务，最重要的问题是对其进行适当的设计，以便它们能够通过无线连接被移动应用调用。开发这些服务时使用的实际语言和技术栈通常并不重要，因此通常最好的做法是直接使用贵企业在\
  \ Web 服务开发方面的标准。尽管如此，如果你确实选择使用 `C# .NET` 开发客户端，那么使用相同的语言开发 Web 服务可能会带来一些好处，因为代表资源和业务对象的数据类可以在客户端和服务器之间共享。\n\
  \n## Java\n\n在 `Java` 中创建 RESTful Web 服务有许多方法，但最常用的可能是通过使用 `JAX-RS`，它是一种专门为创建 RESTful\
  \ Web 服务而设计的 Java 应用程序接口 (API)。`JAX-RS` 是 `Java EE` 的官方组成部分。\n\n`JAX-RS` 允许通过注解将\
  \ `Java` 类映射到 RESTful 端点。以下是一个使用 `JAX-RS` 创建的简单 Web 服务示例：\n\n```\n @UriTemplate(“/customers.xml”)\n\
  \n   public class Service {\n\n       @HttpContext UriInfo uriInfo;    \n      \
  \ @PersistenceUnit(unitName = “CustomersPU”)\n\n       public List<Company> getCustomers()\
  \ {\n           return getCompanies();\n       }    \n   }\n```\n\n注解包括 `@GET`、`@PUT`、`@POST`\
  \ 和 `@DELETE`，用于指定特定资源请求的 HTTP get，以及用于描述资源类相对路径的 `@Path`。\n\n`JAX-RS` 的各种实现（厂商在括号内）包括\
  \ `RESTEasy` (JBoss);`CXF` (Apache) 以及 `Jersey` (Sun/Oracle)。\n\n使用 `C# .NET` 创建\
  \ RESTful Web 服务也有许多方法，但最常用的方法是使用 `Windows Communication Foundation (WCF)`。从 `.NET\
  \ 3.5 SP1` 开始，`WCF` 包含了许多属性来简化 RESTful 服务的创建。\n\n这些属性允许将特定的资源端点和 HTTP 动映射到 `C#`\
  \ 类，这些类会被自动序列化以通过网络传输。这是一个使用 `WCF` 创建的简单 `C# .NET` RESTful 服务示例：\n\n```\n public\
  \ class Service\n{\n     [WebGet(UriTemplate = “customers.xml”)]\n     public List<Company>\
  \ GetCustomers()\n     {\n          return GetCompanies();\n     }\n}\n```\n\n`WCF`\
  \ 属性包括 `WebGet`，它将类映射到特定资源端点的 HTTP `GET` 动，以及 `WebInvoke`，它将 HTTP `POST`、`PUT` 和\
  \ `DELETE` 动映射到资源端点。此外，虽然 `WCF` 默认使用 XML 序列化，但它支持 JSON 序列化。\n\n## 客户端与服务器之间的代码共享\n\
  \n如所述，如果你一直在使用 `C#` 进行 iPad 应用开发，你会看到使用 `C# .NET` 创建 RESTful Web 服务的额外好处。你将能够在 iPad\
  \ 应用和 Web 服务之间共享数据类。例如，请看以下类：\n\n```\n public class Company\n{\n    public string\
  \ ID { get; set; }\n    public string Name { get; set; }\n    public string Website\
  \ { get; set; }\n    public string PrimaryPhone { get; set; }\n    public Address\
  \ PrimaryAddress { get; set; }\n    public List<Address> Addresses { get; set; }\n\
  \    public List<Contact> Contacts { get; set; }\n}\n```\n\n包含此类的代码文件可以作为 `WCF`\
  \ Web 服务项目的一部分，在服务器上编译并运行；但同一个代码文件也可以作为 `C# MonoTouch` 项目的一部分，被编译为原生 iPad 应用。\n\n\
  此外，由于 `WCF` 自动将类序列化以通过网络发送数据，因此相同的类也可以用于在客户端上将数据反序列化为对象。例如，以下代码可以用于 `MonoTouch`\
  \ 从 iPad 应用调用 RESTful Web 服务，并共享 `WCF` Web 服务在服务器上使用的相同的 `Company` 数据类：\n\n```\n\
  \ string urlCustomers =\n     “http://dev.acmecorp.com/mobile/services/customers.xml\"\
  ;\nHttpWebRequest request = (HttpWebRequest)HttpWebRequest.Create(urlCustomers);\n\
  using (StreamReader reader =\n     new StreamReader(request.GetResponse().GetResponseStream(),\
  \ true))\n{\n     List<Company> companies = serializer.Deserialize(reader);\n}\n\
  ```\n\n再次，这是客户端和服务器之间使用统一的 `C# .NET` 技术栈带来的额外收益。然而，如果企业 Web 服务的开发标准是 `Java`，并且这是团队开发人员所熟悉的技术栈，那么这种好处可能不值得偏离标准所带来的痛苦。\n\
  \n## RESTful 服务开发\n\n在许多方面，RESTful 服务的开发可以非常简单且直接。最大的挑战通常是重新思考 Web 服务方法时所需要的范式转变。\n\
  \n正如第 8 节讨论，在过去的十年里，企业内部大多数 Web 服务开发都围绕远程过程调用 (`RPC`) 或 `SOAP` 风格的服务展开，这些服务通常带有大量的开销和元数据。通常，这对于普通的企业应用程序来说不是问题，因为所有内容都在局域网内进行用，而且服务集成往往发生在同一个数据中心内部。然而，对于移动软件，在连接方面有显著更多的限制，包括带宽和延迟。\n\
  \n因此，大多数现有的企业 Web 服务并不是 iPad 应用程序的理想选择，人们更倾向于使用更轻量、以用户为中心且移动友好的 RESTful Web 服务。\n\
  \n### 思考资源，而不是过程\n\n开始 RESTful 服务开发时，首先要意识到你的服务应该关注“资源”而不是“过程”。在 REST 中，你利用了基础的\
  \ HTTP 动词——`GET`、`POST`、`PUT` 和 `DELETE` 来与这些资源进行交互，而不是像 RPC 风格那样在过程中定义这些动词。\n\n\
  在初开始开发 RESTful 服务时，这可能需要某种程度自律；对于 `Java` 中的 `JAX-RS` 和 `C# .NET` 中的 `WCF`，需要由开发者来将资源端点映射到返回特定类的方法。将\
  \ `GET`、`POST`、`PUT` 和 `DELETE` 映射到相应的 `CRUD` 函数是开发者的责任。缩写 `CRUD` 对应的四个函数是 `Create`（创建）映射到\
  \ `POST`，`Read`（读取）映射到 `GET`，`Update`（更新）映射到 `PUT` 以及 `Delete`（删除，自言自懂）。\n\n由于许多现有的\
  \ Web 服务可能是面向过程的，在 `CRUD` 语境下在心理上重构服务往往很困难。这仅仅意味着当你为 iPad 应用开发 Web 服务时，你应该从用户的角度来考虑资源。在这些各种示例中，资源就是客户。\n\
  \n### 保持轻量化\n\n虽然我之前提到过，但它是如此重要，以至于我想再次强调一次：保持服务尽可能轻量化。针对 iPad 的移动和无线消费对服务进行优化。\n\
  \n\n\n\n\n如果你从外向内看，即按照移动应用程序需要消费的方式来设计服务，那么这通常不是一个问题。但如果你从内向外看，你的数据往往会比实际需要的复杂得多、沉重得多。记住，`RESTful`\
  \ 服务暴露的资源并不需要包含后端系统关于该资源的所有信息。它对资源的结构甚至不需要与其在后端数据模型中存储的方式相同。资源可以被极大地简化，并包含预计算、扁平化和去规范化的数据，以便让这些移动服务的消费变得更加简单和直观。\n\
  \n### 资源端点（Resource End-Point）命名规范\n\n在开发 `RESTful` Web 服务时，考虑的最事项之一就是端点命名规范。这些规范应该在逻辑上进行组织和构建，以便调用开发者能够清晰地理解资源是什么以及如何访问它。\n\
  \n在这些命名规范中同时确保简单性和一致性至关重要，这不仅适用于应用程序内部，对于整个组织而言也是如此。随着移动应用变得越来越普遍，一个用于常用访问数据和资源的共享移动服务平台可以促进之前章节中描述的“创新平台”。尽管如此，确保该“平台”上的\
  \ Web 服务使用使用一致的端点命名规范仍然非常重要。\n\n当然，在资源端点的命名上有一些常见的做法，但行业内存在某种程度的裁量和差异。在本例中，我们将检查一些在命名规范中广泛使用的原则。\n\
  \n首先，假设我们有一个名为“customer”（客户）的资源。我们可能想要查看客户列表，因此我们将该端点命名为：\n\n```\n customers.xml\n\
  ```\n\n虽然该客户列表可能只是一个轻量加载的列表，经过适当索引以用于搜索或显示客户列表，但你可能还想要查看特定客户的完整详情：\n\n```\n customers/{company}.xml\n\
  ```\n\n如果你想查看该特定客户的地址：\n\n```\n customers/{company}/addresses.xml\n```\n\n或者该客户的各种联系人：\n\
  \n```\n customers/{company}/contacts.xml\n```\n\n该联系人列表可以返回一个轻量加载的客户索引。然后，你可以为特定公司内特定联系人的完整详细信息指定一个新的端点，并传入索引：\n\
  \n```\n customers/{company}/contacts/{contact}.xml\n```\n\n到为止，我们一直假设 XML 是数据响应的优选格式。你也可以使用\
  \ JSON 提供上述服务相同的功能：\n\n```\n customers.json\ncustomers/{company}.json\ncustomers/{company}/addresses.json\n\
  customers/{company}/contacts.json\ncustomers/{company}/contacts/{contact}.json\n\
  ```\n\n虽然这对于 `GET` 动词是合理的，但 `POST` 一个新客户的首选端点应该是什么？有几种实现方法。例如，你可以对以下任一个执行 `POST`：\n\
  \n```\n customers.xml\n```\n\n或者\n\n```\n customers/{company}.xml\n```\n\n这将创建一个新的客户资源。对于\
  \ `PUT` 和 `DELETE`，你可能不想使用复数，只需单数。\n\n最终，许多命名决策取决于偏好，但一旦你开始建立资源端点规范，你应该确保在执行这些规范时保持一致。\n\
  \n## 其他考虑因素\n\n除了开发 `RESTful` 服务的这些基础概念，在开发 `RESTful` Web 服务时还应该考虑其他几个想法。\n\n##\
  \ 端点版本化（End-Point Versioning）\n\n不仅是为了简化应用程序版本管理过程，为了帮助多个应用程序访问同一服务的需求，`RESTful`\
  \ 服务应该像产品一样进行管理，通过版本化来支持创新而不破坏依赖它的应用程序。\n\n例如，将端点版本化整合到相对 URI 中可能像如下所示：\n\n```\n\
  \ mobile/services/v1.0/customers.xml\n```\n\n即使你不计划使用 Web 服务支持超过一个应用程序，将 Web 服务版本化整合到端点中仍然是一个推荐的良好实践。\n\
  \n## 灵活响应（Flexible Responses）\n\n由于移动应用程序对数据带宽问题特别敏感，赋予开发者指定其在响应对象中想要什么以及多少数据的能力非常有价值的。\n\
  \n例如，你可能希望在查询字符串上允许一个可选参数，以过滤响应内容，使其仅包含调用所需的数据元素。它可能像这样：\n\n```\n customers.xml?show=id,name,website\n\
  ```\n\n如果你计划从单一 `RESTful` Web 服务层支持多个移动应用，并且认为某些应用程序可能比其他应用程序需要更多数据，这就是策略性管理 `RESTful`\
  \ Web 服务复杂度的一种方法。\n\n## 分页（Pagination）\n\n同样，由于移动应用程序对数据带宽特别敏感，赋予开发者过滤大量数据列表并允许分页的能力可能是重要的。\n\
  \n例如，你可能会选择使用查询字符串参数实现分页：\n\n```\n customers.xml?count=10&offset=30\n```\n\n通过这种方式，应用程序可以请求它们正在寻找的信息，甚至可以懒加载内容列表。虽然对于每种类型的\
  \ `RESTful` Web 服务都不是必要的，但对于大量的资源列表，这非常有价值。\n\n## 搜索（Searching）\n\n`RESTful` 服务关注的是资源，而不是远程过程调用。结果，搜索是新接触\
  \ `REST` 的开发者遇到困难的最常见问题之一。由于最终对特定类型资源的搜索仍然只会返回这些资源的列表，像搜索这样的概念可以很容易地这样实现：\n\n```\n\
  \ customers.xml?term=acme\n```\n\n这无疑不是在 `RESTful` 规范内实现搜索的唯一方法，但它是如何以资源为中心的方式正确实现“过程”的常见示例。\n\
  \n## API 密钥管理（API Key Management）\n\n随着越来越多的应用程序使用共享服务，跟踪应用程序对服务的利用情况是非常重要的，`API`\
  \ 密钥可以用于促进这一点。\n\n你可能会选择使用查询字符串参数来实现此：\n\n```\n customers.xml?apikey=d8ad3be01d98001865e96e\n\
  ```\n\n这是面向外部 Web 服务的标准做法，而且对于设计用于企业内部跨多个内部应用程序消费的 Web 服务，这种做法正变得越来越普遍。\n\n## 资源缓存（Resource\
  \ Caching）\n\n记住，`REST` 相比 `SOAP` 的最大优点之一是 `REST` 使用 `GET` 动词来访问信息（而 `SOAP` 对所有操作，包括仅请求数据时都使用\
  \ `POST`）。因此，`REST` 的响应可以很容易地缓存，使用客户端和服务器上现有的功能。\n\n## 身份验证（Authentication）\n\n\
  由于 `RESTful` Web 服务本质上是无状态的并基于标准的 HTTP 协议，身份验证通常通过 `SSL/TLS` 和基础身份验证（Basic Authentication）来实现。\n\
  \n\n\n\n对于那些使用单登录（SSO）解决方案为面向外部 Web 应用提供身份验证（无论是直接提供，还是通过 OpenID 或 SAML 等联合解决方案）的组织来说，其实现过程可能会稍微复杂。复杂之处在于，这些解决方案通常使用\
  \ cookie 来存储会话状态，由于 RESTful 服务是由代码而非浏览器调用的，因此无法提供原生的 cookie 支持。通常的解决方案提供一个独立的 RESTful\
  \ 服务来执行身份验证，然后获取本应存储在 cookie 中的会话令牌（session token），并在应用程序客户端简单地将其注入到所有 HTTP 请求的头部中。\n\
  \n## 示例\n\n现在我们已经讨论了创建 RESTful Web 服务的许多考虑因素，让我们来详细观察开发一个 RESTful Web 服务实际上是什么样的。\n\
  \n正如本章之前所示，以下是一个使用 WCF C# .NET 编写的简单服务示例，它返回一个客户列表：\n\n```csharp\n[WebGet(UriTemplate\
  \ = “customers.xml”)]\npublic List<Company> GetCustomers()\n{\n     return GetCompanies();\n\
  }\n```\n\n要查看特定客户的详情，你可以创建一个类似这样的服务：\n\n```csharp\n[WebGet(UriTemplate = “customers/{company}.xml”)]\n\
  public Company GetCompany(string company)\n{\n     Company retval = GetCompanies()\n\
  \     .Where(obj => obj.ID == company).FirstOrDefault();\n     retval.PrimaryAddress\
  \ = retval.Addresses.FirstOrDefault();\n     retval.Addresses.Clear();\n     retval.Contacts.Clear();\n\
  \     return retval;\n}\n```\n\n使用 HTTP POST 动词创建一个新的客户实例可能如下所示：\n\n```csharp\n\
  [WebInvoke(UriTemplate = “customers.xml”, Method = “POST”)]\npublic Company CreateCompany(Company\
  \ instance)\n{\n     List<Company> companies = GetCompanies();\n     companies.Add(instance);\n\
  \     SaveCompanies(companies);\n     return instance;\n}\n```\n\n如果我们想用 JSON 代替默认的\
  \ XML，我们可以编写类似这样的代码：\n\n```csharp\n[WebGet(UriTemplate = “customers.json”, ResponseFormat\
  \ = \nWebMessageFormat.Json)]\npublic List<Company> GetCustomersJson()\n{\n    \
  \ return GetCompanies();\n}\n```\n\n为了更全面地展示整组 RESTful Web 服务应该什么样，这里有一个完整的 C# .NET\
