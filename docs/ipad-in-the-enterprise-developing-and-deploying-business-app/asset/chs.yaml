  \ 2009 年以来，IDC 和 Forrester Research 一直将 ubitexx 列为全球领先供应商之一。”2011 年 5 月，Research\
  \ in Motion (RIM) 宣布通过对 ubitexx 的待收购，支持通过 BlackBerry Enterprise Server 的统一 Web 控制台对\
  \ iOS 服务进行管理。”\n\n## Zenprise\n“Zenprise 使大型企业能够配置、管理和部署员工及公司拥有的 iOS 设备。该软件几小时内即可运行，并支持在单个服务器上扩展至\
  \ 50,000 多用户。Zenprise 成立于 2003 年，曾获得 Gartner“酷玩供应商”和 InfoWorld“年度技术”奖。”\n\n### 评估供应商\n\
  由于 iOS MDM 环境的根本性限制，以及由于有许多供应商涌入该行业，了解某些可以区分不同供应商提供解决方案的主要标准至关重要。我在评估 iOS MDM 供应商时与许多客户合作过，该行业发展异常迅速，且整体非常不成熟，这对于希望根据短期能力以及长期可行性和持续创新潜力做出最佳决策的企业来说是一个独特的挑战。以下是用于组织、区分和评估\
  \ MDM 供应商的关键标准：\n\n### 方案\n首先，重要的是理解并非所有 MDM 供应商都以相同的方式解决安全问题。行业内存在两种引起许多困惑的初方案。\n\
  \n#### Apple 的 iOS MDM API\n如前节所述，大多数 MDM 供应商使用 Apple 的 API 进行设备的注册、配置、查询和管理。采取这种方案的供应商在安全和管理功能上实际上是平等的，因为它们受\
  \ Apple 的限制，且策略在设备上执行。\n\n#### 邮件替换沙箱\n在 Apple 在 iOS 4.x 提供 MDM API 之前，某些 MDM 供应商（例如\
  \ Good Technology）决定采取安全和管理沙箱而非整个设备的方案。这是因为企业沙箱可以完全控制，但对设备的控制、安全和管理尚未完全实现。\n\n\n\
  \n\n\n再次，重要的是记住，这种基于沙箱的方法曾是确保 iOS 上企业数据高安全性的唯一方法，但由于 Apple 现在已经发布了 `MDM APIs`，行业内对于这种方法是否仍然必要存在大量争议。\n\
  \n## 架构\n\n影响不同供应商 MDM 解决方案整体灵活性和扩展性的最大差异之一是底层解决方案架构。架构基本有三种类型：云端、硬件设备或本地化（on-premise）。某些供应商提供所有三种架构，而另一些仅提供一种或两种。此外，某些供应商还提供架构之间实现的可移植性（例如，从云端开始到本地化，或从硬件设备开始到云端）。\n\
  \n## 云端\n\n基于云的通过软件服务（`SaaS`）模型提供移动设备管理能力。该解决方案可能由 MDM 供应商本身托管在数据中心，也托管在其他供应商的云平台上，如\
  \ `Amazon Elastic Compute Cloud (EC2)`、`Rackspace Cloud` 或 `Microsoft Azure`。\n\n\
  云端方法的优势是 MDM 解决方案的部署和实施非常快速，但缺点是许多组织对于这类托管在他人云端基础设施上的安全性仍感到不安。\n\n## 硬件设备 (Appliance)\n\
  \n基于硬件设备的模型允许 MDM 解决方案作为硬件销售，可以简单地在数据中心中上架。某些 MDM 供应商利用了这种方法的简单性，通过增值值商（`VARs`）迅速获得了市场份额。\n\
  \n硬件设备方法的优势是其实施和部署几乎与云端模型一样简单，但可以托管在您自己的数据中心。缺点是这种“成品”解决方案在潜在配置和实施方面的灵活性有限，且扩展性可能不如其他架构。\n\
  \n## 本地化 (On Premise)\n\n本地托管模型通常与硬件设备模型类似，服务器位于您自己的数据中心，但不是使用预配置的设备，而是将服务器软件安装并配置在您自己的服务器硬件和物理基础设施上。因此，组织可以保持更高水平的控制，从理论上讲也可以像云端模型一样扩展（假设组织拥有适当的硬件和基础设施），但完全托管在组织自己的数据中心内。\n\
  \n本地化方法的优势是更大的控制权，但缺点可能是更高的总拥有成本和更大的管理开销。\n\n## 管理控制台\n\n除了底层架构，MDM 供应商之间最大的区别点之一是管理控制台，因为这是解决方案中可见性最高的部分。大多数供应商提供基于\
  \ Web 的管理控制台，而其他供应商则为现有的基础设施管理控制台提供插件。某些供应商甚至可能提供 iPad 应用程序作为管理界面，如图 20.2 所示的 `MobileIron\
  \ Sentry` 。\n\n图 20.2：除了提供基于 Web 的管理控制台外，`MobileIron` 还提供了一个名为 `Sentry` 的 iPad 应用，允许管理员实时查看其移动设备管理基础设施。\n\
  \n![20.2](img/c20f002.jpg)\n\n## 配置\n\n虽然大多数 MDM 供应商的配置过程相似，但某些供应商提供了设备配置的独特功能，这些功能可用于设备支持库，以支持集中配置和配置设备部署。根据您组织的需求和部署配置方法，这可能是评估供应商的重要标准。\n\
  \n## 集成\n\n某些 MDM 供应商提供 `API`，允许以编程方式集成到 MDM 平台。虽然这对许多组织来说不是必须，但某些公司可能会发现，通过与其他内部系统或工具集成，可以轻松地实现大部分管理自动化。通过编程方式访问\
  \ MDM 的能力（例如强制策略或查询设备属性）可以在解决方案集成方面提供巨大价值。\n\n## 内部应用沙箱管理\n\n某些 MDM 供应商为内部 iOS 应用程序开发提供\
  \ `SDK`，以利用预构建的功能，如应用单点登录（Single Sign-On）、数据加密、应用分析以及对应用程序本身的额外管理，这些功能超越了受 Apple\
  \ `MDM APIs` 限制的设备管理能力。\n\n## 内部应用目录管理\n\n某些 MDM 供应商提供创建内部应用目录的能力，类似于上一章中讨论的 `Apperian`\
  \ 的独立应用目录功能。虽然 MDM 解决方案并不一定需要提供您的内部应用目录，但某些组织倾向于在一个平台上同时进行应用管理和设备管理。。\n\n## 对其他平台的支持\n\
  \n由于基于 iOS 的 MDM 供应商受到 Apple 提供的 `APIs` 和能力的限制，MDM 供应商之间功能上最广泛差异之一是对 iOS 之外其他平台的支持。某些\
  \ MDM 供应商仅支持 iOS，而另一些则支持其他平台的各种组合。但同样重要的是指出，由于 Apple 对 MDM 的方法是独特的，对于您的组织来说，拥有一个针对\
  \ iOS 的 MDM 解决方案和另一个针对其他平台的不同解决方案可能是最佳决策。另一方面，许多组织倾向于尽可能整合其 MDM 解决方案；如果他们需要支持和管理\
  \ iOS 之外的多个平台，那么对这些平台的支持在评估 MDM 解决方案和供应商时变得至关重要。\n\n## 总结\n\n在本章中，我们查看了 `EAS` 和第三方\
  \ MDM 解决方案作为管理 iPad 等 iOS 设备的方式。我们查看了 `EAS` 能做什么，并将其与通过第三方供应商实现的 Apple iOS `MDM\
  \ APIs` 的高级功能和能力进行了对比。由于大多数供应商的产品基本上相同，我们还涵盖了不同产品和供应商之间的主要区别领域。\n\n![Title Page](img/titlepage.jpg)\n\
