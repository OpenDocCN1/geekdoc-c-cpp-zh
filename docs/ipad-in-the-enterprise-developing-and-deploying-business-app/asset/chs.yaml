- "# 企业级 iPad：业务应用开发与部署\n\n\n\n![](img/cover)\n\n![cover_image](img/cover_fmt.jpg)\n\
  \n\n\n## 第四部分：开发\n### 第十三章：开发 iPad 应用\n## 构建 Web 应用\n## 构建原生应用\n## 总结\n### 第十四章：在应用间共享业务逻辑\n\
  ### 使用可复组件\n### 共享架构\n### 共享平台\n### 使用自定义 URI 方案\n## 总结\n### 第十五章：开发移动友好的 Web 服务\n\
  ## 选择技术栈\n### RESTful 服务的开发\n## 示例\n## 总结\n### 第十六章：确保应用和数据安全\n## 理解沙盒安全模型\n###\
  \ 安全沙盒\n## 遵循安全最佳实践\n### 审计您的应用\n## 建立企业标准\n## 总结\n\n\n\n\n\n## 本章内容概览\n\n* iPad\
  \ 是一项变革性技术\n* 业务技术正受到消费者的影响\n* 苹果是行业变革的催化剂\n* “应用革命”如何随 iPhone 开始\n* “应用革命”已扩展到\
  \ iPad\n* 苹果如何应对“创新者困境”\n\niPad 正在改变企业使用技术的方式。iPad 不仅仅是一种消费现象，它正在打破企业技术（IT）部门的业务模式和权力结构。在发布后的\
  \ 90 天内，该设备已被 50% 的财富 100 强采用。这种前所未有的渗透率代表了技术进入企业方式的根本性转变。\n\nIT 部门传统对技术的选择和管理拥有完全控制权，但这种铁腕控局面正受到威胁。企业员工本身也是消费者，他们将自己的个人设备带入办公室。虽然许多\
  \ IT 部门迅速采取了禁止措施，但这种禁令很难执行，尤其是当高管领导者也是违规者时。即使能够执行，禁令也给 IT 部门带来了巨大压力，要求他们支持员工群体所要求的普及化消费技术。\n\
  \n许多行业领袖已开始意识到，支持这一趋势比对抗它更符合公司的利益。市场影响力的分析师和技术咨询公司 Gartner, Inc. 发布了建议，推荐企业拥抱 iPad。Gartner\
  \ 甚至表示，由于 iPad 是一项如此颠覆性的技术，其采用将面临重大障碍，高层管理人员应该介入，消除企业内部使用 iPad 的障碍。\n\n“CEO 的角色通常不是参与特定技术设备的决策，但苹果的\
  \ iPad 是一个例外，”Gartner 特别顾问兼副总裁 Stephen Prentice 表示，“它不仅仅是最新的消费电子产品，如果 CEO 和业务领袖尚未与他们的首席信息官（CIO）就此进行对话，他们应该发起对话。”\n\
  \n颠覆性技术对于使用它的公司来说既是强大的又是危险的，iPad 也不例外。但根据 Prentice 的说法，“即使你认为这只是一个暂时的风尚，尽早行动的成本很低，而延迟的代价可能极大。”\n\
  \n## 苹果作为催化剂\n\n为了充分理解 iPad 在企业中的潜力，后退一步审视大局是重要的。iPad 的爆炸式增长并非在真空中发生的。多种因素和趋势共同成了目前的环境。\n\
  \n智能手机在苹果发布 iPhone 之前已经存在多年，而基于平板的电脑在 iPad 发布之前已上市了十多年。尽管苹果没有发明这些技术，但它简化了用户体验，并将这些技术通过大众吸引力带入了主流消费市场。\n\
  \n当苹果在 2007 年 6 月发布 iPhone 时，它引发了所未有的智能手机销量。凭借苹果在 iPod 上的势，iPhone 对大型用户群具有即时吸引力，这些用户同时携带手机和\
  \ iPod，现在可以使用单一硬件设备取代这两种设备。\n\n## Exchange ActiveSync 标准化\n\n第一代 iPhone 无疑是一种消费现象，但它对企业并不友好。IT\
  \ 组织迅速发布了政策，明确规定 iPhone 不是支持的设备，不允许访问公司网络或数据。许多用户对此并不满意，但他们并无能为力，因为 iPhone 尚未准备好用于企业环境。\n\
  \n随着 2008 年 6 月 `iPhone OS 2.0` 的发布，苹果采取了一项微妙但极具战略意义的举措，改变了行业权力格局。到 2008 年初，微软的\
  \ `Windows Mobile` 平台刚刚开始从研究移动公司（RIM）的黑莓夺取大量市场份额。当 RIM 正在销售黑莓企业服务器（`BES`）时，微软决定通过将推送电子邮件以及日历和联系人同步集成到\
  \ `Exchange Server 2003` 来与之竞争。`BES` 是一种基于服务器的产品，为黑莓智能手机提供对 `Microsoft Exchange`\
  \ 或 `IBM Lotus Notes` 等消息服务器的无线移动访问。当微软决定通过 `Exchange ActiveSync` 直接在 `Exchange\
  \ Server` 中构建移动同步功能时，它消除了对像 RIM `BES` 这样的独立服务器产品的需求。这为苹果提供了一个通过“后门”进入企业的机会，即从微软处获得\
  \ `Exchange ActiveSync` 的许可（licensing），并允许使用 `iPhone OS 2.0` 的 iPhone 和 iPod touch\
  \ 连到公司网络并访问业务信息。\n\n突然之间，个人拥有的 iPhone 通过 IT 部门为支持公司拥有 `Windows Mobile` 设备而建立的相同\
  \ `Microsoft Exchange ActiveSync` 基础设施进入了企业。尽管 `Microsoft Exchange` 允许阻止 iPhone\
  \ 连接，但许多组织并没有利用这一功能。由于 iPhone 强制执行 `Exchange ActiveSync` 提供的大多数基本安全和设备管理策略，组织例如可以要求用户为设备配置开机密码，并在\
  \ iPhone 丢失或被盗时远程擦除数据。\n\n为了给 iPhone 提供企业级支持，Google 为其云端 `Google Apps` 购买了 `Exchange\
  \ ActiveSync` 许可。甚至 IBM 也从微软处购买了 `Exchange ActiveSync` 许可，以便 `Lotus Notes` 能够支持\
  \ iPhone。该产品于 2009 年底发布，名为 `Lotus Notes Traveler`。在此之前，拥有 `Lotus Notes` 的组织获取移动电子邮件的唯一途径是通过黑莓企业服务器（`BES`），它可以可以运行在\
  \ `Microsoft Exchange` 或 `Lotus Notes` 之上。\n\n除了 RIM 的黑莓之外，主要的移动平台也都在 `Exchange\
  \ ActiveSync` 标准化。除了微软的移动平台和 iPhone 之外，`Palm/HP Web OS`、`Android` 甚至诺基亚手机现在都可以在任何消息环境（`Microsoft\
  \ Exchange`、`Lotus Notes` 或 `Google Apps`）访问企业电子邮件、联系人和日历。几乎一夜之间，RIM 从主导消息平台变成了一个挣扎生存的专有解决方案。\n\
  \n当苹果平板电脑的传闻最终属实时，该产品的成功超出了几乎所有人的预期。苹果首席执行官史蒂夫·乔斯在 2010 年 1 月 27 日推出了 iPad，将其描述为价格令人置信的神奇革命性设备。\n\
  \n## 平板走向主流\n\niPhone OS 3.0 于 2009 年 6 月发布，带来了额外的安全和设备管理 `Exchange ActiveSync`\
  \ 策略。iPhone 3GS 还为平台引入了硬件数据加密，并能够执行仅允许具备硬件加密 iPhone 设备连接的规则。这些事件为 iPad 的成功奠定了基础。\n\
  \n\n\n\n\n早在近十年前的 2001 年，微软创始人比尔·盖茨发布了基于 Windows 的平板电脑（Tablet PC）。他做出了非常有力的预测，称：“这是一个几乎没有限制的\
  \ PC，我预测在五年内它将成为美国最受欢迎的 PC 形式。”五年后的 2006 年，平板电脑的市场占有率仅为 PC 市场的 1.2%。比尔·盖茨看到了这一机遇，但微软没能将平板电脑推向主流。\n\
  \n苹果于 2010 年 4 月 3 日发布了 iPad，第一天就售出了 30 万台。销售额增长迅速，第一个月销量就达到了 100 万台，并到 2010 年 6\
  \ 月 22 日达到了 300 万台。在 iPad 销售的第一个完整季度里，苹果出货了 419 万台设备，这使其在不到六个月的时间内总出量达到 750 万台。到\
  \ 2010 年底，iPad 已售出近 1500 万台，占据了超过 95%的平板市场份额。如果将 iPad 的销售额纳入整个移动 PC 市场计算，iPad 在不到一年内就已占据了超过\
  \ 10%的市场份额。\n\n消费者非常喜爱 iPad 并张开双臂拥抱它。2010 年 9 月，CNBC 报道称，iPad 在美国消费者满意指数上的得分比该领先指数上以往任何产品都要高，而该指数由密歇根大学附属。当奥普拉·温斯瑞宣布\
  \ iPad 为她“有史以来最喜爱的东西”时，这款设备已经真正俘获了主流消费者的心灵。“从我们相遇的第一刻起，我知道它偷走了我的心，”这位电视节目主持人向她的观众宣道。温斯瑞手里拿着\
  \ iPad 说：“言语无法描述我对这件奇妙、奇妙设备的感觉。我真的认为它是迄今为止本世纪最伟大的发明。”\n\n苹果在 2010 年底通过`iOS 4.2`统一了\
  \ iOS 系列设备，该版本除了支持 iPhone 和 iPod touch 外，还支持 iPad。这次更新带来了重大的企业友好型改进，如移动设备管理（`MDM`）和内部应用的空中下载（`over-the-air`）部署。随着多个第三方`MDM`供应商竞相抢地为\
  \ iPad 提供支持，iPad 在企业中的采用率在 2010 年底到 2011 年期间不断加速。在上市第一年结束，这款平板电脑不仅获得了消费者的主流认可，也开始获得企业的广泛接受。\n\
  \n## 消费者选择\n\n正当苹果努力让 iPhone 达到企业级使用水平时，各种因素正汇聚在一起，酝酿出一场将永远改变移动和无线领域格局的“完美风暴”。2008\
  \ 年的全球经济衰退给企业支出带来了压力，使公司寻找任何可能的削减开支的方法。随着许多拥有公司移动设备的员工开始自掏腰包购买自己的个人 iPhone，公司意识到他们可以在增加员工满意度的同时，减少无线网络费的开支。事实证明，如果可以携带自己喜爱的手机，许多员工非常愿意承担全部或部分自己的无线费用。当美国国税局（IRS）决定严厉打击个人使用公司手机的行为时，这无异于火上浇油。结果是行业内发生了从“公司承担无线资计划”向“个人承担无线资计划”极其显著且快速的转变，这种转变在图\
  \ 1.1 中有所体现。\n\n图 1.1: 企业级与个人级无线计划\n\n![1.1](img/c01f001.jpg)\n\n到 2010 年 6 月，iPhone\
  \ 在财富 500 强企业中的采用率已达到 80%。乍一看，考虑到企业内部传统的采购周期，这可能听起来非常惊人，但重要的是要理解大多数企业并不是为用户购买设备。他们只是为用户提供了使用\
  \ iPhone 的选项。\n\n基因瑞克（Genentech）是一个前瞻性组织的例子，他们迅速拥抱了消费者选择。这家位于旧金山的生物技术公司（现罗氏集团的一部分）此前拥有超过\
  \ 5000 台黑莓设备。尽管大多数基因瑞克的用户喜爱他们的黑莓，但当公司开始让用户选择自己喜欢的手机时，这些用户大批量转向了 iPhone。到 2009 年底，基因瑞克有超过\
  \ 5000 名员工使用 iPhone，而使用黑莓的仅有 1500 名。\n\n虽然 iPhone 主要是通过个人用户进入企业的，但 iPad 正在走一条不同的道路。在许多情况下，进入企业环境的前几台设备是个人拥有的设备，但公司很快就发现了\
  \ iPad 的优势，并开始大批量购买设备。\n\n例如，医疗器械行业已经展示了广泛的企业采用和部署。到 2010 年底，在 iPad 发布不到九个月后，美敦力（Medtronic）已部署了\
  \ 4500 台 iPad，波士顿科学（Boston Scientific）推出了 2000 台，而圣朱德医疗（St. Jude Medical）、雅培医疗（Abbott\
  \ Labs）、金谷医疗控股（Zimmer Holdings）和史赛克（Stryker）也都部署了设备。在这些许多相同的公司内部，手机正在从过去多年的集中式企业承担部署模式转向个人承担的部署模式。\n\
  \n这似乎代表了消费者化趋势中一个非常有趣的现象，即使是企业驱动的集中式部署似乎也正在向以消费者为中心的技术迁移。在计算历史背景下，这似乎是过去一种趋势的逆转：过去创新是由政府驱动，然后进入私营部门，最后带给消费者（图\
  \ 1.2）。\n\n图 1.2: 旧的创新趋势\n\n![1.2](img/c01f002.jpg)\n\n这种趋势产生于当时唯一有资源资助新技术的政府。当沉重的研发成本被覆盖后，技术成本就会下降到私营部门可以使用的水平。随着时间的推移，成本持续下降，直到技术达到消费者可以接受的价格点。\n\
  \n通过互联网和个人计算革命，更再加上持续发展的`摩尔定律`（简单来说，计算能力每 18 个月翻一倍），从政府到私营部门再到消费者的历史趋势被颠覆了。在许多方面，今天消费者拥有最先进的技术，而这些技术正在进入业务界并最终进入政府。\n\
  \n图 1.3: 新的创新趋势\n\n![1.2](img/c01f003.jpg)\n\n不仅是消费者技术（如 iPhone 或 iPad）正从消费者的手中进入公司，消费者的需求现在也能影响企业的采购决策。这一趋势才刚刚出现，目前还不知道它会发展到什么程度。但有一点是肯：今天的企业员工也是消费者，这些用户将继续对公司的技术决策产生重大影响。\n\
  \n## 一切为了应用\n\n人们很容易忘记，当苹果首次发布 iPhone 时，没有 App Store，没有`iPhone SDK`，也没有开发者生态系统。人们认为手机用于语音通话、检查电子邮件，甚至浏览一下网页就很了。普通用户完全不知道手机可以运行如雪片般大量的“应用”（图\
  \ 1.4）。\n\n图 1.4: “应用”的激增\n\n![1.4](img/c01f004.jpg)\n\n\n\n\n\n尽管第一代 iPhone 不支持原生应用，但当\
  \ Apple 推出 iPhone SDK 和 App Store 时，这并不是什么新鲜事。Windows Mobile 当时已经拥有许多人认为繁荣的开发者生态系统，拥有超过\
  \ 20,000 个移动应用程序可用。然而，Apple 通过 App Store 所做的是简化用户体验。它让向手机上安装应用的操作变成了一个简洁、直观的过程。随后，他们在电视黄金时段播放了大量广告，介绍\
  \ App Store 中所有可用的应用，以及在设备上安装这些应用是多么简单。Apple 将在移动手机上安装软件这一极客化、复杂的过程，转变为一种极其简单的体验。\n\
  \nApple 能够在其已经成功的 iTunes 平台之上构建 App Store，因此它已经记录中存了近 1 亿个信用卡号。作为 iPhone 或 iPod\
  \ touch 的所有者，你不需要为了这些文件向 Apple 提供信用卡号，但在你提供之前，你无法下载免费应用。结果就是建立了一个围绕冲动购买构建的繁荣生态系统。\n\
  \nApp Store 的绝大多数下载都是免费应用，但这并没有阻止金热潮——成千上万的开发者迅速为几乎任何需求开发了应用。App Store 推出时仅有 500\
  \ 个应用，但迅速增长到 5,000 个，然后是 25,000 个，接着是 100,000 个。它可能会在 2011 年年中达到五十万大关。\n\n## iPhone\
  \ 的先驱\n\n这事儿有应用。那事儿也有。那个事儿也有。\n\n随着 App Store 的爆发式增长，普通消费者发现几乎对任何事情都有应用。正如 Apple\
  \ 的电视广告所说，无论你是“想读餐厅评论、读核共振成像（MRI）报告，还是只是读一本旧书”，任何事情都有应用。想玩游戏？识别收音机里的歌曲？付账单？点披萨？启动汽车？锁上大门？iPhone\
  \ 用户很快意识到，他们能想象到的几乎任何事情真的都有应用。\n\n汽车保险行业提供了一个极佳的案例，展示了财富杂志 1000 强企业是如何开始接受面向消费者的移动应用的。2009\
  \ 年 4 月，全国家保险（Nationwide Insurance）在 iPhone App Store 推出了 Nationwide Mobile。该应用为\
  \ Nationwide 的客户提供了一个“事故工具箱”。除了拨打救援服务电话外，该应用还可以提交事故报告，使用 `GPS` 精确定位用户的准确位置，并用相机拍摄损坏照片。它甚至提供手电筒功能。该公司随后在电视黄金时段进行了大规模的电视广告活动，展示了这款\
  \ iPhone 应用。除了提供极佳的营销信息外，该应用通过将人工密集型流程替换为客户可以直接在手机上使用的自助服务功能，为客户提供了巨大的价值主张。\n\n\
  到 2009 年 12 月，Geico 保险已经在 App Store 推出了它们自己的 Geico GloveBox 应用，并在不久后开始在电视广告中与它们标志性的“穴人”形象一起推介该应用。\n\
  \n到 2010 年春天，几乎所有主要的汽车保险公司，包括 Allstate、American Family、esurance、Farmers Insurance、Progressive\
  \ 和 State Farm，都已发布了 iPhone 应用。State Farm 延续了通过电视黄金时段广告来宣布其 iPhone 应用的传统。Nationwide\
  \ 则将这一趋势推向了新高度，并围绕其开发的另一款名为 `Cartopia` 的 iPhone 应用进行了第二次电视广告活动。该应用不仅向现有的 Nationwide\
  \ 客户进行营销，还被设计为一个线索生成引擎，用户可以在此比较汽车维修店，甚至对二手车进行免费的车辆识别号码（`VIN`）检查。该应用可以立即为路途中的购车者提供汽车保险报价，而他们已经花时间将车辆信息输入了应用中。\n\
  \n花点时间想象一下，你在这些汽车保险公司之一担任理赔审核员。对于你的雇主给消费者提供的技术比给你这个员工的要好这件事，你会有什么感受？如果在你启动公司提供的笔记本电脑所需的时间内，你可以从口袋里掏出一部\
  \ iPhone，从 App Store 安装一个应用、登录、启动理赔、获取 `GPS` 坐标以获得精确位置，并用内置相机拍摄几张损坏照片，这会让你感觉如何？\n\
  \n另一个例子，让我们看看零售业。大多数主要的实体零售商，如 Barnes & Noble、Best Buy、Home Depot、Macy's、Target、Toys\
  \ “R” Us 和 Walmart 都有面向消费者的应用。这些应用中的几个（包括来自 Best Buy 和 Target 的）能够使用 iPhone 的相机扫描实体产品上的条形码，并调出有关产品的额外信息，包括详细的技术规格和产品评论。\n\
  \n现在花点时间想象一下，你在一家零售店的销售区域工作。如果一个客户来向你提问，但他自己手机上拥有的产品信息比你通过商店提供的员工用加固手持扫描仪所能获取的信息要详细得多，你会有什么感受？\n\
  \n这些思维练习并非虚构的场景；它们是成千上万企业员工每天面临的真实情况。作为消费者，你已经习惯了每样东西都有应用，并期望你所有喜爱的品牌都会为你提供应用来完成以消费者为导的品牌体验。但作为员工，你无法从手机上获取与桌面电脑或笔记本电脑上相同的信息。确实，你的\
  \ IT 部门现在终于允许你将邮件、日历和联系人同步到手机，但为什么你想运行某些报告时仍然要启动电脑呢？为什么你必须坐在桌旁才能“批准”工作流请求？为什么你不能在任何工作的地方运行工作所需的应用？为什么你不能在需要的时候、在需要的地方获取你需要的信息？\n\
  \n结果是，企业是否会接受面向员工的 iPhone 应用不是问题，而是何时的问题。正如消费化趋势将移动平台引入工作场所一样，企业也必须意识到员工对业务应用的需求甚至明确预期。`iOS\
  \ 4.0` 的发布以及内部企业应用的空中部署能力加速了许多企业 IT 部门的采用率。\n\n到 2009 年底，Genentech 已为 iPhone 开发了\
  \ 30 多个内部应用，并为员工部署了自己的 Genentech App Store。这些应用的示例见图 1.5。在一次采访中，Genentech 的首席信息官\
  \ Todd Pierce 说：“为了让我的采购系统在 `SAP` 上可用，我花费了 1000 万美元；为了让它在我的 iPhone 上可用，我花费了 1 万美元。你自己算算。”\n\
  \n图 1.5：Genentech 的内部销售应用让代表们在“路上”获取客户信息。\n\n![1.5](img/c01f005.jpg)\n\n## 现在有了\
  \ iPad\n\n\n\n\niPad 发布时，能够运行约 200,000 个最初为 iPhone 和 iPod touch 设计的应用程序。虽然用户体验并不一定是最好的，但这促进了\
  \ iPad 的爆发式增长。尽管 iPad 上的网页浏览体验已经相当出色，但许多主流网站已提供了针对 iPad 优化的应用程序，将浏览体验提升到了新的高度。想一想典型用户，他们会在电脑上花费大量时间在诸如彭博社、《美国今日报》、《华尔街日报》、《纽约时报》或\
  \ [Weather.com](http://Weather.com) 等网站上进行浏览。这些网站的 iPad 应用程序提供了极其丰富且引人入胜的用户体验，在许多情况下，这种体验明显优于在传统电脑上访问的网站本身。\n\
  \n从第一天起，iPad 就被认为不仅仅是一个消费设备。通过像苹果的 `Keynote` 这样可以进行演示的应用，该设备迅速被专业人士所纳，用于向同事展示幻灯片。无论是在会议室还是餐桌旁，iPad\
  \ 都比任何笔记本电脑都要方便得多，因此很快被专业人士抓住并用于业务目的。此后，公司们很快就预见到了 iPad 的潜力。\n\n### 梅赛德斯-奔驰的应用\n\
  \n作为最早采用 iPad 的组织之一，梅赛德斯-奔驰开发了一个自定义应用程序，并在 2010 年 6 月推向 40 家试点门店。该应用程序名为 `MB Advantage`，让经销商员工可以直接通过\
  \ iPad 访问销售点系统（图 1.6）。\n\n图 1.6: 梅赛德斯-奔驰销售人员可以在展厅通过他们的 iPad 访问销售点系统。\n\n![1.6](img/c01f006.jpg)\n\
  \n梅赛德斯-奔驰的销售人员可以使用 iPad 在展厅的车辆旁直接为潜在客户办理贷款申请并查询营销活动。iPad 还被用于取代租赁还流程中的纸质表单，在该过程中，经销商员工需要为汽车填写一份检查清单。\n\
  \n梅赛德斯-奔驰金融服务公司的营销副总裁 Andreas Hinrichs 在一份新闻稿中提到：“iPad 上的 `MB Advantage` 让梅赛德斯-奔驰的经销商提高了流动性和效率，从最初的融资和租赁流程到租赁还流程。”到\
  \ 2010 年底，梅赛德斯-奔驰还增加了直接在 iPad 上采集某些文件客户签名的能力（图 1.7）。\n\n图 1.7: 客户也可以使用梅赛德斯-奔驰 iPad\
  \ 应用程序签署某些文件。\n\n![1.7](img/c01f007.jpg)\n\n但梅赛德斯-奔驰并不是唯一采用 iPad 的汽车制造商。宝马开发了一个自定义\
  \ iPad 应用程序，在贸易展会上展示交互式车辆信息和价格。该应用程序包含许多照片和视频，并配备了数字配置器，允许消费者设计自己的车辆。通用汽车（GM）也为\
  \ iPad 启动了“雪佛兰经销商”应用程序，让销售人员可以访问可选车辆颜色、配置和价格以及经销商库存。\n\n### 医疗设备行业\n\n在应用程序的语境下，让我们回顾一下之前提到的医疗设备行业案例。美敦力（Medtronic）是全球最大的医疗设备制造商，也是首批购买大量此类设备的大型公司之一。随着\
  \ 4,500 台 iPad 的推出，美敦力可能拥有 2010 年规模最大的 iPad 部署。在设备上市后的几周内，该公司就组建了一支团队，开始为 iPad 开发内部应用程序。根据《华尔街日报》引的美敦力首席信息官\
  \ Mike Hedges 的话，“iPad 让我们的销售人员能够以一种与以前完全不同的方式，更好地与客户互动。”\n\n波士顿科学（Boston Scientific）是另一家财富\
  \ 500 强医疗设备制造商，他们在设备发布后几个月内就部署了 2,000 多台 iPad，正致力于为 iPad 开发许多面向员工的应用程序。在 2010 年底的一次会议上，波士顿科学首席执行官\
  \ Ray Elliott 谈到了为什么公司在处于削减成本模式下，仍向 iPad 平台投入巨资。他说：“我们正在为销售团队启动下载超过 20 个特定产品应用的过程，并[将给他们]机会接触定价、时间效率、报销单、填写申请以及我们为了从销售人员身上抽身时间而做的其他事情。”\n\
  \n财富 500 强企业的 CEO 在公司会议上花时间讨论部署 iPad 的 IT 战略，这似乎很令人惊讶，但商业高管讨论 IT 问题正变得越来越普遍，特别是当涉及到\
  \ iPad 的时候。正如之前提到的，2010 年 11 月，盖特纳（Gartner）分析公司向 CEO 们发布了建议，建议他们清除 IT 在支持 iPad 可能存在的任何障碍。\n\
  \n这代表了企业 IT 常规业务模式的一种激进且颠覆性的转变。iPad 正在改变局面，组织有机会利用这项技术的潜力来提高移动工作者的生产力和效率。\n\n###\
  \ 创新者的困境\n\n1997 年，哈佛商学院教授克莱顿·克里斯坦森（Clayton Christensen）写了一本名为《创新者的困境》的书，在书中描述了新技术在市场中极具颠覆性的趋势。当市场领导者专注于通过现有技术的改进来满足现有客户的需求时，他们为新市场进入者利用颠覆性技术留了大门。颠覆性技术最初可能仅对市场的小众或低端部分具有吸引力，但一旦它们开始成熟并在市场上获得动力，就能超越现有技术，而之前的市场领导者将无能为力。这种颠覆性技术的影响如图\
  \ 1.8 所示。\n\n图 1.8: 颠覆性技术随时间推移从低端向高端移动。\n\n![1.8](img/c01f008.jpg)\n\n以钢铁行业为例，当微钢技术在\
  \ 20 世纪 60 年代开发时，微钢并没有威胁到大型整合钢厂。整合钢厂正如其名，是垂直整合的生产设施，拥有钢铁所需的所有功能，包括将铁矿石、焦炭和石灰岩转化为液铁的高炉，然后将液铁转化为液钢，最后进行铸造和轧成成品。\n\
  \n微钢厂使用废钢，废钢通常是从旧设备或汽车上回收的，最初生产的钢质量仅适用于市场低端产品（如钢筋）。微钢厂使用电弧炉，可以轻松启动和停止，不像整合钢厂的高炉。因此，微钢厂能够在需求高时扩大生产规模，在需求较低时缩小规模。\n\
  \n\n\n\n这使得小型化钢厂能够使其供应更紧密地贴合市场需求，从而比整合钢厂获得更高的利润水平。整合钢厂非常乐意将市场低端让给小型化钢厂，但这些市场份额的获取为小型化钢厂提供了所需的空间，使其技术得以进化和成熟。生产的钢材质量可以沿着价值链向上移动，从钢筋转向其他钢材和棒。因此，获取的市场份额促进了增长，小型化钢厂的技术继续成熟。到\
  \ 20 世纪 80 年代，小型化钢厂就能生产出质量与整合钢厂相当的结构钢和板材，但成本更低。这使得像 NuCor 这样的初创小型化钢铁钢铁公司（现为全球最大的钢铁公司之一）能够从此前占据主导地位的整合钢铁生产商（如美国钢铁\
  \ US Steel 和已倒闭的伯塞莱姆钢铁 Bethlehem Steel）手中夺取市场份额。\n\n另一个例子是硬盘驱动行业的历史，14 英寸磁盘让位于 8\
  \ 英寸磁盘，后者又让位于 5.25 英寸磁盘，并最终让位于 3.5 英寸磁盘。在硬盘驱动行业演化的每个阶段，既有的市场领导者专注于市场高端要求的增量改进，而较规模的颠覆性创新者则针对市场低端，并最终利用其市场份额向上移动。\n\
  \n## 苹果的颠覆性进化\n\n在这一背景下，苹果如何利用这种颠覆性技术现象，在多个行业中成功地向价值链上移动，这非常令人震惊。当苹果计算机仅在个人电脑领域竞争时，它无法打破被仅仅视为小众参与者的局面。虽然\
  \ Mac 拥有一群近乎狂热的忠实追随者，但其市场份额无法增长超过 5%。\n\n苹果计算机并没有直接针对 IBM 或 微软，而是选择与索尼（Sony）竞争。20\
  \ 世纪 80 年代，索尼通过 Walkman 创造了个人音乐播放器行业，并占据了大部分市场份额。即使在 20 世纪 90 年代从磁带转型到紧光盘时，索尼仍然能够保持其市场领先地位。当数字音乐（或\
  \ MP3）播放器在 20 世纪 90 年代后期进入个人音乐播放器行业时，索尼专注于对其现有技术的增量改进，而不是拥抱数字音乐这种新的颠覆性技术。\n\n史蒂夫·乔布斯（Steve\
  \ Jobs）在数字音乐播放器中看到了机会，但他观察到市场上的产品笨重、只能容几十首歌，并且拥有“难以置糟糕”的用户界面。这就是苹果计算机需要的突破口，2001\
  \ 年 10 月，他们推出了 iPod，将“1000 首歌曲装进你的口袋”。该产品的设计旨在提供非常简单的用户体验，并有足够的容量携带整个音乐库。iPod 取得了惊人的成功，到\
  \ 2004 年，不仅在数字音乐播放器领域，在个人音乐播放器行业也占据了大部分市场份额。\n\n为了支持 iPod 的势头并提供更统一的用户体验，苹果计算机于\
  \ 2003 年春季推出了 iTunes Store。在几年内，iTunes Store 发展成为美国最大的音乐供应商，并控制了全球 70%以上的数字音乐销售额。图\
  \ 1.9（此处经版权所有者 Alex Kleinschmidt（[www.Alex-K-Art.com](http://www.Alex-K-Art.com)）许可转印）说明了这一演变。\n\
  \n图 1.9：iPod 的演变，2001–2010\n\n![1.9](img/c01f009.jpg)\n\n到 2007 年 1 月，iPod 以超过 70%的市场份额主导市场。这代表了公司的一个转折点，苹果计算机从其名称中去掉了“Computer”一词，以标志电脑不再是组织的重点。与此同时，它还宣布了\
  \ Apple TV 和 iPhone，后者本质上是一个内置了电话的 iPod。iPhone 于 2007 年 6 月发布。不久后，2007 年 9 月，苹果推出了\
  \ iPod touch，它同样由 iPhone OS 驱动，但没有蜂窝电话功能。\n\niPhone SDK 和 App Store 于 2008 年 7 月推出，引发了许多人所说的“App\
  \ 革命”，开发者们竞相创建数十万个应用程序。App Store 创建了一个生态系统，首次简化了软件的销售和分发，使其普通消费者也能够触及。凭借目前的势头和增长，App\
  \ Store 将在 2011 年中期达到 50 万个应用程序。\n\n当 iPad 在 2010 年 4 月发布时，它针对的是介于手机和笔记本电脑之间的使用场景。对于许多用户来说，iPad\
  \ 并没有取代手机或笔记本电脑，但它取代了大部分的使用。苹果利用了 iPod 并以此为足点进入了手机市场，然后利用它创造了 iPad 的巨大成功。iPad 发布后不久，苹果将\
  \ iPhone OS 改名为简单的 iOS，标志着该平台的未来不再取决于任何特定设备，而在于支持整个系列设备。\n\n## 继续创新\n\n在向价值链的持续进军的过程中（图\
  \ 1.10），苹果于 2011 年 1 月推出了 Mac App Store。这将 iTunes 以及 iPhone/iPad App Store 极其简单的用户体验带到了桌面和笔记本电脑计算平台。就像普通消费者可以轻松地在\
  \ iPhone 和 iPad 上安装 App 一样，现在 也可以安装到桌面或笔记本 Mac 上了。\n\n图 1.10：苹果从 iPod 到 iPhone 到\
  \ iPad 在价值链上积累了势头。它能利用此来增加 Mac 的市场份额吗？\n\n![1.10](img/c01f010.jpg)\n\n观察并看看苹果不仅能够保持其在个人音乐播放器、手机和平板电脑领域的领导地位，还能继续向价值链上移动，以在笔记本电脑和桌面个人电脑领域获得显著的市场份额，将是非常有趣的。\n\
  \n## 总结\n\niPad 不仅是市场上的颠覆性创新，在企业 IT 内部也是如此。这类技术转型通常是痛苦的，但对于能够战略性利用这些机会的公司来说，它们非常有价值。本章通过概述行业格局奠定了基础。现在，让我们深入研究消费者转化的整体趋势，以及它对公司制定策略以最大化其\
  \ iPad 的回报的影响。\n\n# 第 2 章：拥抱 IT 消费化\n\n### 本章包含什么？\n\n*   什么是 IT 消费化？\n*   对技术采纳生命周期的影响\n\
  *   App Store 的“长尾”效应\n*   识别消费化的益处\n*   学习拥抱消费化\n*   理解 iPad 对 IT 演化的影响\n\n现在我们已经在更广泛的移动背景下奠定了基础，更详细了解驱动企业采纳\
  \ iPad 的整体趋势至关重要。\n\n\n\n\n在我写这本书期间，我与数十位技术作家、行业分析师、企业软件高管、财富 1000 强企业的 CIO 以及其他企业\
  \ IT 远见者进行了交流、访谈并接收了他们的反馈。探索这一概念的最佳方式或许是听听这些行业领导者的意见。虽然 `iPad` 本身就是一个极具争议的话题，但“IT\
  \ 消费化”这一概念更具争议。我接触过的不愿具名的人数几乎与允许我在这里引用他们话的人一样多。\n\n在本章中，我们将定义什么是“IT 消费化”、这一整体趋势如何加速了企业内部对\
  \ `iPad` 的采用，以及“思想领袖”对这一主题的思考和评论。\n\n# 什么是消费化？\n\n“消费化”一词最早在 2001 年流行起来，当时 `Douglas\
  \ Neal` 和 `John Taylor` 用它来描述信息技术创新如何从消费级基础的技术中脱颖而出，并预计它最终会迁移到企业中。\n\n在许多方面，消费化的想法似乎非常简单直接。初看之下，它可能看起来很有趣，但不太会对企业\
  \ IT 的行业格局和权力结构产生巨大影响。\n\n## 消费化真的挑战了企业 IT 的现状吗？\n\n2005 年，`Gartner, Inc.` 发布了一份报告，指出：“在进入工业市场之前向消费市场引入新技术的日益增长的实践，将是未来\
  \ 10 年影响信息技术最显著的趋势。”\n\n2010 年后期，`Gartner` 特员兼副总裁 `Stephen Prentice` 编写了一篇名为《立即抓住\
  \ iPad 机机》的 `Gartner` CEO 建议书。但早在 2005 年，他就写道：“当敏锐的 `CIO` 试图将他们僵化的、充斥遗留问题的基础设施转型敏捷、高效、服务驱动的交付机制时，他们必须采取务实的方法在管理消费级\
  \ IT 风险的同时拥抱其收益。否则，`CIOs` 面临被其利益相关者视为‘敌人’而而被边缘化的风险。”\n\n2005 年，`Gartner` 推广的“消费化是未来\
  \ 10 年最重要的趋势”的观点可能引起争议。但 `iPhone` 在 2008 年 6 月至 2010 年 6 月期间，从财富 1000 强公司中占比的 0%\
  \ 增长到 80%，其获得的动力无疑证明了这一趋势的强大影响力。\n\n尽管如此，`Enterprise Mobility Foundation` 的创始人兼执行经理\
  \ `Philippe Winthrop` 认为，`iPhone` 以及现在的 `iPad` 所展示的移动消费化趋势与一般的消费化趋势存在某些细微差别。根据 `Winthrop`\
  \ 的说法，“企业移动消费化与通用 IT 的消费化有微妙之处。首先，价格点使得移动设备比其他计算设备更容易获得。其次，应用程序的海量多样性以及这些应用程序购买和安装的便利性，与\
  \ `IT` 部门通常习惯的非常不同。具有远见的公司已经意识到拥抱而非对抗这种变化的机会，并将其化为己有。在许多情况下，真正的 `ROI` [投资回报]仍然难以捉捉，但毫无疑问，工作场所的未来取决于移动设备和应用程序的使用。”\n\
  \n## 但“IT 消费化”对于企业信息技术领导者实际上意味着什么？\n\n在寻找这一概念的清晰定义时，我听过的最好的解释之一来自 `Hyatt Hotels`\
  \ 的 `CIO` `Mike Blake`。他向我分享了 `Hyatt` 在识别并最终拥抱 `iPad` 这一消费化趋势所经历的历程。用 `Blake` 的话说：\n\
  \n`iPad` 问世时，它是最具创新性的公司之一推出的最新‘闪眼产品’。每个人都想拥有一个，但没有人真正知道它是做什么用的。这个产品的力量，除了其精美的设计和可靠的操作系统外，源于它在用户想象力中创造的火花。用户正在定义利用该工具的方法，以证明它不仅仅虚有其表，而是可以提供真正的实用性。在我们的案例中，`IT`\
  \ 从第一天起就接受了 `iPad`，帮助让产品尽可能地进入更多人的手中。从这种草根的试验中，我们找到了以新方式服务客户的方法，并为员工提供了他们真正喜欢使用的强大工具。这正是\
  \ IT 消费化真正发挥作用的地方。它是 `IT` 意识到消费级产品的力量，培养它，并给它一个成功的公平机会。我们抛弃了傲慢，但保留了一点怀疑态度和保守做法，以确保企业系统仍然安全，我们的帮助热台不会于于负荷。\n\
  \n`IT` 对企业中消费化技术的接受使我们能够建立一个更敏捷的组织，让用户在选择偏好的计算平台时获得赋权。事实上，`IT` 对这些技术的接受有助于推动对 `IT`\
  \ 更积极的看法。过去 `IT` 被认为是僵化且独断的，而现在它被视为一个真正的合作伙伴，积极与业务合作，并使用消费级技术来帮助解决关键业务问题。\n\n最终结果是员工能够获得所需的数据和信息以做出更好的决策。这些消费化工具让人们能够更好地使用和解释信息：它们更容易维护，并且在用户群体中的满意度比以往任何一代工具都高。\n\
  \n我相信 `Blake` 证明了“IT 消费化”对企业而言最终是一个积极的趋势。它可能涉及企业 `IT` 现状的某些痛苦改变，包括正如 `Blake` 所说，`IT`\
  \ 部门必须‘抛弃我们的傲慢’，以便给底层技术一个成功的机会。但这一趋势为业务、整个公司，甚至是整个经济带来了效率、生产力和最终利润的提升。\n\n## 那么这种消费化趋势已经持续多久了？`iPad`\
  \ 是起到了催化剂的作用，还是这一趋势已经持续了一段时间？\n\n`Computerworld` 总编辑 `Scot Finnie` 认为消费化已经持续很长时间。他说：“IT\
  \ 消费化的兴起在过去几年中变得非常明显。这一趋势的直接原因包括强大且多功能的智能手机和平电脑的普及、简单实用的移动 App 的流行，以及衰退驱动了对更高水平生产力和有效更长网页的需求。”\n\
  \n“尽管如此，”`Finnie` 继续道，“IT 消费化已经显现了 20 年，从个人电脑的出现开始。例如，`Microsoft` 在 90 年代初的崛起取得主导地位，部分是因为它对操作系统和应用程序的终端用户易用性的高度关注。当然，`Apple`\
  \ 已经是一家消费电子产品公司很一段时间了。`IT` 组织的关键在于识别并拥抱巨大的消费趋势，因为这些趋势几乎总是以现在的方式出现在商业环境中。”\n\n如果\
  \ `IT` 拥抱消费化，对业务将产生巨大的好处。益处在于用户本身比通常情况更早将最新技术引入公司。这可能意味着更好的集成、更好的沟通、更好的工具，并最终为公司带来竞争优势。\n\
  \n\n\n\nFinnie 为气馁的领导者们带来了希望：“IT 消费化的核心在于员工的自由和员工的生产力。在某个时刻，你必须信任你的员工，不仅要让他们更好地完成工作，还要支持他们这样做。投资回报率（ROI）自然会随之而来。”\n\
  \n`CA Technologies` 的首席技术官 Donald Ferguson 同意 Finnie 的观点，他表示：“IT 消费化多年来一直在发生。`iPhone`\
  \ 以及随后的 `iPad` 已经让‘消费化’的 IT 成了新常态。企业可以选择启用并支持 `iPhone`、`iPad` 和新的消费设备，否则他们的员工将绕过\
  \ IT 部门。”\n\n`Data Domain` 前首席执行官、`EMC` `BRS Division` 执行主席 Frank Slootman 也表达了相似的情感：“IT\
  \ 消费化并不是随着 `iPad` 甚至智能手机的出现而新现象。早在 20 世纪 80 年代中期，第一批 `Macs` 和 `LaserWriters` 被引入企业部门时，就完全违背了\
  \ IT 部门严密锁定的政策，当时 IT 部门拒绝支持这些设备。这是一种持续了数十年的、不可阻挡的草根动态。我确信我们看到的还只是冰角。”\n\n消费级技术正走进企业大门，`Deloitte`\
  \ 合伙人兼副主席 Eric Openshaw 表示，这种趋势在执行管层中的普及程度与企业前线一样普遍。他观察到：“企业对采用平板电脑的需求似乎是永无满足的——而\
  \ `iPad` 作为这种更广泛采纳的代表——反映了一个根本性的转变：从由 IT 驱动技术使用的如何、何时、何用和何地，转变为由用户决定这些参数。令人着迷的是，这种趋势既是自下而上的推动，也是自上而下的驱动。在这种情况下，刚出校的学生和\
  \ CEO 们同样拥抱了一种无干扰的设备，这种设备支持他们许多、甚至是全部的个人和职业计算需求。”\n\n根据电子零售商 `Best Buy` `Geek Squad`\
  \ 创始人兼 CTO Robert Stephens 的说法，`iPad` 正在促进企业内部发生一种更基础的转变：用户驱动的设计，这正在推动业务流程的改进。“直到最近，”Stephens\
  \ 说，“大多数业务高管并没有信心知道向 IT 部门要什么。但现在他们看到自己可以直接通过 `iPad` 追踪 `FedEx` 包，并确切看到它在哪里或是谁签收的。你可以直接在\
  \ `iPhone` 上从 `Papa John's` 定制并订披萨。IT 不再拥有关于可能性的独特知识。用户现在知道他们想要什么，现在他们可以也也将向 IT\
  \ 提出要求。”\n\n## 跨越鸿沟 (Crossing the Chasm)\n\n自从畅销作家 Geoffrey Moore 在 1991 年写下《跨越鸿沟》（Crossing\
  \ the Chasm）以来，这本书一直是全球技术产品创业者和营销者的战略指南。在书中，Moore 描述了“技术采用生命周期”，其中新技术产品根据贝斯曲线模式被采用，如图\
  \ 2.1 所示。在这种模式中，产品的初始购买者是“创新者”（Innovators），之后是“早期采用者”（Early Adopters）、“早期大众”（Early\
  \ Majority）、“晚期大众”（Late Majority），最后是“落后者”（Laggards）。然而，这并不是一条平滑的曲线，在技术采用生命周期中的“早期采用者”阶段，存在一个“鸿沟”。这是因为客户倾向于寻找同一领域内其他公司的参考。由于“创新者”购买产品仅仅是为了拥有最新、最强大的技术，他们并不能为“早期采用者”提供很好的参考，后者关注的是技术带来的益处，而非技术本身。这使得创新新产品的营销人员在追求主流客户时，“跨越鸿沟”变得极具挑战性。\n\
  \n图 2.1：`iPad` 是是如何跳跃了“技术采用生命周期”的？\n\n![2.1](img/c02f001.jpg)\n\n然而，随着 `iPad` 的发布，这种技术似乎能够打破几十年来在企业\
  \ IT 中根深蒂固的采用模式。苹果是如何做到这一点的？\n\n我询问 Moore `iPad` 是如何跳过整个“技术采用生命周期”的，他向我分享了关于 `iPad`\
  \ 和 IT 消费化的想法。他的回答是：“关于 `iPad`、`iPhone` 以及整个消费化运动，关键的一点是，对于终端用户来说没有‘技术采用生命周期’——甚至没有培训——所以当技术由终端用户引入时，企业也就没有采用生命周期。确实，基于几十年来过时的用户界面和用户体验，存在着一种积压的需求。对于\
  \ IT 来说，这有一定的采用冲击，但这次并不严重，因为有更灵活的基础设施来吸收它。”\n\n但 Moore 也认为这为企业提供了巨大的机会。他继续道：“剩下的就是让执行团队去理解这些部署的投资回报率（ROI）。我相信这将通过授权那些负责跨全球分布式价值链进行行动谈判的大量中层经理来实现这些人这些人通信、协调和协作设施有强烈的需求，而这些是消费市场已经接受的、但企业在此之前从未有机会部署过的。”\n\
  \n但再次，`iPad` 是如何在企业内部实现如此快速采用的？苹果又是如何在不到 90 天内渗透进 50% 的富时百强（Fortune 100）公司的？\n\n\
  在与我交过的所有人中，我认为 `Accenture` 的 CIO Frank Slowon 对 `iPad` 如何渗透其组织给出了最生动的解释：\n\n`iPad`\
  \ 推出的那天，我们就讨论了将其引入我们的环境；24 小时后，我们就有 500 台设备接入了。\n\n人们期望他们的个人设备（如 `iPad`、`iPhone`\
  \ 等）可以在办公室使用。他们想提高效率，想工作得更好，并期望能够将这些个人设备与办公应用程序相结合。这是一个理性的预期，我们认为满足这一预期是迫在必行的。”\n\
  \n\n\n\n\n许多 IT 负责人认为，虽然 iPad 的采用率增长迅速，但这种采用是肤面的。在我接触过的不少 IT 负责人中，这种观点非常普遍，但唯一一位愿意公开阐述这一观点的高管是\
  \ Valspar 的首席信息官（CIO）Kate Bass，她表示：“我个人认为，50% 的财富 100 强企业已经采用了 iPad 这一事实是极大的夸大。是的，我们机构内部有\
  \ iPad，但这并不意味着被广泛采用，也不意味着 iPad 被用于日常业务流程。它们非常适合‘消费’‘消费者’可以获得的信息，但对于创建信息来说并不理想。不过，我认为这为\
  \ ERP [企业资源计划] 供应商带来了一种紧迫需求，让他们更容易‘消费’我们多年来一直锁在‘诺克斯堡’级数据库和存储系统中的数据。”\n\nBass 的这种紧迫需求体现在对高质量应用的指数级增长的需求上，这些应用能够处理并为数据增加价值。\n\
  \n那么，这对于企业软件行业意味着什么？\n\n`salesforce.com` 的创始人兼首席执行官 Marc Benioff 同意这是一场变革性的转变，它不仅关乎软件，同样关乎硬件。他说：“我们的行业经历过许多转变，但归根结底，巨大的转变一直围绕软件而非硬件。现在，我们正在目睹软件和硬件的同步革命。移动设备和平板电脑的销量已远超\
  \ PC。我们使用的关键应用都将被重写，以利用这一根本转变。这种转变甚至延伸到了我们使用这些应用的地方。因为像 iPad 这样的设备非常易携带且可以随地使用，它创造了真正的移动工作队伍。这就是为什么我计划给我的每一位销售人员都配备一台\
  \ iPad。”\n\n专注于商业智能的企业软件公司 MicroStrategy 也意识到了消费化如何创造一支高效率的移动工作队伍。根据执行副总裁兼首席运营官\
  \ Sanju Bansal 的说法：“人们期望在一天中的任何时候，无论是在家里还是在办公室，都能通过移动设备访问所需的任何信息。越来越多的公司意识到移动设备对其业务的价值，并正在为员工、高管、供应商和业务伙伴构建移动应用程序。‘我稍后回复你’这个短语最终将消失，因为每一次对话都将充满信息，每一个决策都将基于事实。24/7\
  \ 访问业务信息的能力缩短了决策时间，简化了业务流程，增强了协作，并让每个地方变成办公室。”\n\n## 长尾效应\n\n2006 年，《连线》杂志主编 Chris\
  \ Anderson 编写了《纽约时报》畅销书《长尾理论》，在书中描述了资源丰富的经济现象。随着虚拟库存和数字产品不再受物理容量限制的限制，待售的产品数量可以无限接近。结果是，由于买家能够通过更个性化或小众化的选择来满足愿望，“爆款”产品的销量将会减少，总销售额从峰值向分布曲线的远端移动，如图\
  \ 2.2 所示。\n\n[图 2.2:像 App Store 这样的数字市场创造了一个环境，长尾效应为每种欲望和小众提供产品。]\n\n![2.2](img/c02f002.jpg)\n\
  \n那么，App Store 的爆发式增长对企业 IT 有什么影响？\n\n我向 Anderson 提问了这个问题，他的回答是：“App Store 就在不断增长。不断增长。不断增长。消费者现在期望任何事情都有对应的应用，而当这些消费者上班时，他们开始期望这些工作也应该有‘应用’。移动应用的的长尾效应改变了企业员工的思维模式，而\
  \ IT 部门正难以应对这一切。”\n\n长尾效应的经济影响对许多企业 IT 人员来说可能是显而易见的；然而，许多人可能认为这将影响像 `Amazon.com`\
  \ 或 Apple 的 App Store 和 iTunes 等公司的业务，但不会影响他们，至少不会直接影响。我倾向于同意 Anderson 的观点，这对企业\
  \ IT 的有直接且显著的影响。\n\n最终，这个想法代表了 IT 的根本性转变，CA Technologies 的首席技术官（CTO）Donald Ferguson\
  \ 也认同，他说：“传统的 IT 为客户和员工提供了数量有限的应用。IT 将演变为为员工和终端用户从应用商店下载的未知应用银系提供数据和 API 调用。IT 将从构建\
  \ Web 界面和页面转向每天交付新的应用和更新。”\n\n“当我们进入一个云网络成为常态的世界，”Ingenix 的 CTO Art Glasgow 说道，“CIO\
  \ 必须接受世界已经改变的事实。网络上的任何设备在任何时间都将常态，而且必须在不牺牲安全性和管理性的情况下完成。酷炫很重要，易用性主宰一切，因此像 iPad 这样的设备不仅要被考虑到，还要被专门为此设计。好消息是，像\
  \ iPad 这样的设备不仅仅是酷。它们是灵活的多功能工具，正在改变我们工作和创造的方式，从这个意义上说，它们可能不仅是创新本身，更是创新的催化剂。”\n\n\
  皇家勒比邮轮公司的 CIO Bill Martin 针对“企业 IT 正难以应对这一切”的评估，向我分享了他的邮轮公司利用 iPad 战略性转型内部流程和客房体验的数十种方法。他总结道：“所以，我不认为企业\
  \ IT 正难以应对目前可用移动技术的冲击。相反，我们正在拥抱它，并尝试运用不受限的思想来寻找利用它的新方法。从我们的角度来看，我们说：‘尽管来吧’”\n\n\
  Martin 确实是拥抱 iPad 的 IT 远见者，但并非所有的 IT 负责人对这种转变都如此乐观。\n\nSpectrum Brands 的业务技术副总裁\
  \ Allen Benson 实际上对 iPad 在企业中的潜力感到非常兴奋，但对应用的这种爆炸式增长并不完全看好。他说：“App Store 这个失控的火车注定会脱轨。就像你的衣柜一样，单个应用的空间是有限的，最后你无法高效地找到你想找的东西。‘酷’因素会消退，‘成本’因素将接管，迫使公司重新审视它们的应用组合。iPad\
  \ 虽然被视为消费级设备，但实际上在高管层填补了更大的空白，因为高管[使用它]进行 ERP。按一下按钮，输入一个密码，即可访问向董事会或任何其他高级高管汇报的所有企业信息。iPad\
  \ 可能始于消费者手中，但在未来一段时间，它将成为首选的业务设备，且不依赖应用。”\n\n## 全新的思维\n\n在 2005 年的《纽约时报》畅销书《全新的思维》中，作者\
  \ Daniel Pink 描述了“我们正在从一个基于信息时代逻辑、线性、类计算机能力的经济和社会，转向一个基于正在取代它的概念时代的创造性、同理心、大局能力的经济和社会。”\n\
  \n\n\n\n他继续谈到在概念时代，“工作与娱乐的融合已变得日益普遍且日益必要。有时，这甚至成为了一种明确的企业战略。”由此产生的围绕企业移动化中个人与职业领域界限模糊的各种影响，只会进一步提高用户对企业\
  \ IT 的期望。\n\n我询问了平克（Pink）对这种消费化趋势的看法，他向我分享了他的观点并说：“iPad 的奇妙之处本应该让既有组织感到警觉。一个完整、庞大且利润丰厚的应用生态系统诞生了，而这些创造者不需要培训和开发部门来教他们做什么，也不需要\
  \ IT 部门帮助他们分发自己的作品。”\n\n当我们进入概念时代，显而易见，像 iPad 这样的技术将企业 IT 的日常运营产生巨大影响。\n\n那么，IT\
  \ 领导者如何通过战略性地利用这一趋势，对业务产生积极影响呢？\n\n一些 IT 领导者看到了提高用户满意度和灵活性的潜力。鲍视光学（Bausch and Lomb）的首席信息官（CIO）艾兰·范恩斯沃（Alan\
  \ Farnsworth）解释了他的公司通过拥抱消费化和个人与职业活动界限模糊所取得的益处。他说：“我们坚信 iPad 以及泛苹果技术在提高员工参与度和满意度方面的力量。多年来，企业一直强制员工在工作中的沟通和协作方式与他们在个人生活中完全不同。为什么？这没有必要，也没有合理的理由，特别是在\
  \ iPhone 和 iPad 等设备的强大功能加持下。”\n\n在汤森路透（Thomson Reuters），移动技术总监丹丹·本内特（Dan Bennett）向我分享了\
  \ iPad 对该业务产生的影响，他表示：“显然，iPad 正在成为不可或缺的商务配件：高管们终于有了可以带进会议室的东西，销售人员可以抛弃笔记本电脑了。许多人正在购买自己的设备并要求连接。”\n\
  \n本内特继续道：“挑战似乎是双重的：其一，IT 必须确定如何提供对企业资源的安全访问——这绝非易事。从长远来看，如果想将消费化的收益转化为业务价值，就必须改进典型企业应用平庸的用户体验。”\n\
  \n451 集团专注于移动服务的分析师维沙尔·杰恩（Vishal Jain）也认为，像 iPad 这样的技术正在提高用户对企业 IT 的期望。他说：“信息消费和传播的形式已经改变了，这部分是由以消费者为中心的技术爆炸引起的，这些技术正在寻找进入企业的方法。始终在线的手机和平板电脑凭借其卓越的\
  \ UI（用户界面）、处理能力和上下文能力，满足了眼光的消费者所有的计算需求。随着实时通信、社交媒体和搜索嵌入到应用栈或设备中，用户的期望会更上一个台阶。如今的\
  \ CIO 办公室本身就是一个业务组织，而此类设备的可用提供了一个重新审视系统、流程和呈现方式的机会。”\n\nIT 必须对不断增长的期望做出反应，你应该将其视为一个从内而外使你的业务差异化的机会。\n\
  \n许多 CIO 都在认真对待这一挑战，但他们意识到，现实问题（如安全方面的问题）必须由一个有效的后消费化 IT 组织来承认并解决。康宝汤（Campbell Soup）高级副总裁兼\
  \ CIO 约瑟夫·斯帕诺莱蒂（Joseph Spagnoletti）表示：“走进大门的个人所有 iPad 让人们意识到，需要通过移动性来整合个人和职业信息。到目前为止，安全是最大的障碍，我们的\
  \ R&D（研发）工作立即开始解决这些安全问题了。”\n\n在雪佛能源（Chevron），CIO 路易·埃里希（Louie Ehrlich）意识到像 iPad\
  \ 这样的设备带来了挑战，但也带来了巨大的机遇，他表示：“手机和平板电脑等消费设备可以成为企业的游戏规则改变者。它们提供了加速业务决策速度和提高个人生产力的巨大机会，但也明确要求\
  \ IT 重新思考围绕应用开发、交付和支持的旧范式。”\n\n克劳德公司（Crawford & Company）高级副总裁兼全球 CIO 布莱恩·弗莱恩（Brian\
  \ Flynn）表示：“总来说，iPad 对企业来说是不可避免的。他们通过理解客户并通过营销炒作引起了如此巨大的波动，使得那些一直在其他平台上进行标准化的 CIO\
  \ 很难忽视 iOS 作为一个平台。”\n\n## 每个人都来了\n\n《每个人都来了》（Here Comes Everybody）和《认知盈余》（Cognitive\
  \ Surplus）的畅销书作者克莱·希基（Clay Shirky）是纽约大学关于技术对社会和经济影响的顾问和教师。我最喜欢的希基的名言之一是：“当一项技术变得变得理所当然、无处不在，最后无处不在到近乎无形时，真正深刻的变化才会发生。”\n\
  \n希基向我分享了一个个人故事：就在今天早上，当我带孩子们去看牙医时，他给了我一个 iPad 来办理签到并更新我的信息。那种通常糟糕的、“我们知道见过你 20\
  \ 次了，但这里有个剪板”的体验被改变了。他们已有的任何数据都已填写，所以我只需要添加或更改新内容。更有趣的是，这个功能的“应用”是网页浏览器——这是一个云托管应用程序的\
  \ Web 界面，通过办公室本地 Wi-Fi 运行。\n\niPad 的采用就像香槟瓶中弹出的软塞，部分原因是因为它在其他领域也释放了积压的需求。如果没有良好的网页设计、云托管应用、本地\
  \ Wi-Fi 以及一系列技术，这个牙科应用将无法运行；在出现一个可以递给某人并直接运行的平板电脑之前，这些技术的价值还不如它们部分价值的总和。而对于企业来说，真正的关键在于，这些用途不再仅仅是\
  \ PC 和笔记本电脑的替代品，它们还取代了剪板、纸张和本地数据库，所有低效的做法都变得更加顺畅、良好。\n\n我个人对希基关于 iPad 如何利用他所详尽记录的许多宏观经济趋势的亲身观察感到非常兴奋。此外，我发现他的观察围绕着医疗保健行业，这非常有趣。虽然我最近大部分时间都在为医疗保健、医疗设备和制药行业提供咨询，但我认为\
  \ iPad 对这些行业产生了不成比例的影响。在上一章中，我讨论了 iPad 如何通过该行业几乎每家大公司的采用，正在改变医疗销售行业，但在许多方面，这仅仅是\
  \ iPad 如何影响整个医疗保健行业的冰一角。\n\nLifespan 医疗交付系统的 CTO 大卫·海明丁格（David Hemendinger）表示：“我们正处于医疗保健的转折点，我认为\
  \ iPad 有潜力从根本上增强医疗保健的交付和消费方式。在治疗点通过触感良好、易于使用且支持应用程序的设备即访问临床信息，正是医生所需要的。我相信 iPad\
  \ 将变得像听诊器的发明和日常使用对医疗保健一样重要。”\n\n\n\n\n医疗设备巨头美敦力（Medtronic）的首席信息官 Michael Hedges\
  \ 同意这一观点：“在医疗保健行业，像 `iPad` 这样的平板电脑可能很快取代笔记本电脑，服务于销售人员和其他员工。如果临床医生只有五分钟时间交流，销售人员可以使用它快速显示宝贵的数据或进行演示。这些设备在速度、清晰度和易用性方面具有巨大优势。”\n\
  \nHedges 继续说道：“通过 `iPad` 和 `iPhone` 等移动技术，患者将能够随时随地从公司订购他们的用品，医生也将能够查看患者信息并进行必要的治疗调整。未来，我们预见到一个高度连接的世界，患者、护理人员和医生将通过他们的移动设备进行互动，并采取及时行动来更好地管理自己的健康。`iPad`\
  \ 启动速度快、易于使用、电池续航长、屏幕大且清晰度高，这些事实使其在这一领域的应用非常有价值。”\n\n制药巨头阿斯利康（AstraZeneca）的副总裁兼集团首席信息官\
  \ Rich Williams 也同意，他表示：“像 `iPad` 这样的设备和 IT 的消费化确实从根本上改变了企业网络模型，使其转向真正的无处不在和统一的信息访问。企业\
  \ IT 不能掩龟自亚洲，希望问题消失。员工希望在方便他们的时间和地点——也就是现在——访问信息，就像他们在家里一样。虽然这将为安全和网络容量带来挑战，但领先的将走在这些新工作方式的前面，鼓励按需计算。结果将是更高的协作、参与度和信息共享，从而带来更好的业务决策和更高的业务绩效。”\n\
  \n`iPad` 还直接击中了医疗服务的触点。医疗保健巨头凯撒波马医疗（Kaiser Permanente）护理交付部门（Care Delivery）的副总裁兼业务信息官\
  \ Lisa Caplan 表示：“简单且创新的消费级技术产品改变了企业预期的轨迹。每个企业员工都希望周二在他们当地电子商店上市的产品也能在办公室里支持他们。这同样推动了针对企业级市场的巨大进展，但在像医疗保健这样一个高度受监管的行业中，技术关乎生死，因此消费化也意味着企业级的安全性、按规模定价的成本，以及足够的稳定性来支持医疗服务点的决策。在真正讨论投资回报率（ROI）之前，这些都是入场券。”\n\
  \n`iPad` 正在影响医疗保健行业的每一个方面，包括支付方。在大型医疗保险公司联合健康集团（UnitedHealth Group），战略倡议副总裁 Bud\
  \ Flagstad 评论道：“`iPad` 潜力改变并增强我们与成员、客户和合作伙伴互动的方式。你只需打开它它就能工作。对大量培训的需求消失了。App 之间\
  \ `UI` 的相似性使得用户支持电话成为过去式了！”\n\n## 拥抱消费化\n\n在许多方面，拥抱这一趋势意味着 IT 传统上采取的许多立场发生了彻底的逆转。过去，是\
  \ IT 引导用户使用新技术；而现在情况恰恰反过来了。在过去的 50 年里，IT 的重心已经从后端转向前端；而现在以 `iPad` 为首的移动体验正在对直观的\
  \ `UI`、无处不在的连接以及对后端的更大访问和控制创造新的需求。方向反转了。\n\n《Network World》杂志主编 John Dix 总结得非常到位：“IT\
  \ 往往以控制力为傲。对对所用设备的控制、对谁可以访问什么的监管、对允许运行的程序的控制。多年来，随着这些控制权的流失，IT 一直在挣扎。员工开始使用自己的即时通讯工具，然后带来了他们自己的社交网络/协作方案、自己的智能手机、自己的电脑、笔记本电脑和平板电脑，随着\
  \ `Google Voice` 的出现，他们甚至有了自己的电话号码和语音信箱。虽然涉及风险，但毫无疑问，这种 IT 的消费化在短期内不会停止，精明的公司意识到，顺应潮流远比对抗洪流要好。”\n\
  \n《Baseline》杂志主编 Eileen Feretic 同意这一观点，她表示：“多年来，IT 经理一直抵抗 PDA 和智能手机侵入企业领域，主要是因为让员工通过移动设备访问公司数据涉及安全风险。但那是一场注定失败的战斗。一旦员工享受了在个人生活中使用这些设备的好处，他们就决心要将它们也带到工作中。IT\
  \ 的消费化迫使技术经理设法如何更好地管理、监控和保护移动技术——最新的就是 `iPad` 和其他平板设备。智能手机为企业接受移动设备铺平了道路，而平板电脑用户正在获得获益：合法性和支持。”\n\
  \n那么，IT 领导者是否准备好放弃控制并充分拥抱消费化了？\n\nCSC 首席信息官 David J. McCue 认为是。他说：“`iPad` 是交付和服务和应用的转型平台。企业一直被批评为适应\
  \ `iPad` 不够快，IT 部门被指责为阻碍者。现实是，我认识的每个 CIO 都已经认同这种设备的价值并正在部署它。”\n\n丙烷气巨头 AmeriGas\
  \ 的首席信息官 Rick Fabrizio 将这种破坏性的变革视为积极变化的机遇。Fabrizio 表示：“拥抱‘新科技’的公司将比不拥抱的公司具有竞争优势。企业内部客户对技术的采用一直是\
  \ IT 的一项挑战，所以这里 IT 有了一个利用业务社区已经在使用的技术的机会。`iPad` 和 `iPhone` 就是完美的例子。”\n\n好胜客品牌（Hostess\
  \ Brands）高级副总裁兼首席信息官 Steven Birgfeld 也认为这是一个机会：“我相信消费主义对企业的影响不是是否会发生的问题，而是何时发生的问题，IT\
  \ 需要确保他们正在积极应对这一新动态。在我们的案例中，实际上是 CEO 推动了 `iPad` 进入我们的环境，所以这有助于迫使问题得到解决。现在的问题是，随着新的企业能力的出现，如何进一步利用并管理\
  \ `iPad` 技术。”\n\n## 企业 IT 的演变\n\n根据本章关于 IT 消费化的许多观点，我认为企业 IT 有必要利用这一趋势来为业务和整个公司带来利益。这无疑对现状以及整个企业\
  \ IT 构成了巨大且巨大的挑战，尽管变化可能是痛苦的，但为了实现这种最终演进的宏观经济趋势的全部利益，这通常是必要的。\n\n\n\n\n尽管消费化仍然是一个具有争议的话题，但\
  \ `CIO.com` 的主编辑 Brian Carlson 认为，从战略上拥抱企业移动化对于 IT 领导岗位的人来说是一项必然任务。根据 Carlson 的说法，“消费电子产品与企业\
  \ IT 组织的融合正进行得如火如荼，没有任何地方能比爆发的移动企业市场更能体现这一点了。企业移动化有望在 2011 年超越云计算，成为技术行业最大的趋势，企业正在为各级员工扩大智能手机、平板电脑和移动应用程序的使用。预计将看到企业将其所有的核心应用程序移动化，包括\
  \ `CRM` [客户关系管理]、`ERP`、费用管理、库存管理和时间跟踪。一个有效的企业移动策略不再是可有可无的，而是业务增长的必要条件。”\n\n`IDC`\
  \ 移动和消费者连接平台副总裁 Scott Ellison 向 IT 领导者建议，“平板电脑、智能手机和应用程序的结合是现实往往超越夸张的地方。对于企业而言，挑战在于如何更好地利用员工带入工作场所的‘应用成瘾’行为，并以有利于企业的方式。实现这一点的三个关键是：允许员工使用其先进的个人平板电脑和智能手机进行核心工作解决方案；将过于复杂的软件程序转换为更符合用户习惯的类应用体验；以及充分利用触屏作为与大多数信息交互的最佳方式。”\n\
  \n`Work Goes Mobile` 的作者、`AT&T Mobility` 行业解决方案总 Vishy Gopalakrishnan 认为，拥抱个人所有的设备是有效企业移动策略的要求。Gopalakrishnan\
  \ 表示：“随着企业 IT 组织努力满足日益由移动驱动的业务需求，他们将‘自自带设备’（`BYOD`）方法视为其移动战略的关键要素。虽然这种方法让 IT 组织免于通常繁琐的移动设备认证和采购流程，但它要求\
  \ IT 承担责任，建立一个可持续的框架来在多个设备平台进行开发移动应用程序，并特别关注设备生命周期；以及建立流程、基础设施和如移动设备管理之类的工具，以获得预期的可见性和控制力。”\n\
  \n## 总结\n\n`iPad` 是一项极其颠覆性的技术；这一点毫无悬疑。但 `iPad` 以及消费化的整体趋势最终对企业 IT 产生何种影响，还有待观察。\n\
  \n您是如何应对贵组织内部 IT 消费化的？贵公司是否准备好迎接必要的颠覆性变革，以实现这一趋势的全部效益？\n\n在下一章中，我们将讨论如何将这些概念应用于贵组织企业移动战略的开发。\n\
  \n## 第 3 章：制定企业移动化策略\n\n### 本章内容简介\n\n*   作为战略性业务推动因素的信息技术\n*   理解移动策略的要素\n*   如何确保移动化带来业务成果\n\
  *   管理移动化往往冲突的需求\n*   利用企业范围的规模经济\n*   开发和维护企业最佳实践\n\n在前两个章节中，您了解了移动整体版图以及 `iPad`\
  \ 对公司 IT 产生的影响。我们还讨论了围绕“IT 消费化”的趋势，以及 `iPad` 如何作为催化剂，由于这些趋势促使企业更大范围、更快速地采用。\n\n\
  本章探索将信息技术作为一种战略的概念，以及移动技术（特别是 `iPad`）应该如何融入企业的移动战略。本章将讨论移动策略的七个关键组成部分。\n\n在深入研究移动策略的特定组件后，您将学习如何确保\
  \ `iPad` 驱动业务所期望的结果和收益。\n\n然后，您将涵盖管理全业务所有移动化冲突需求的过程。有许多不同的角色从截然不同的视角来看移动化，从用户本身到业务运营、营销部门，当然还有\
  \ IT 部门。在制定移动战略时，理解并承认所有这些视角至关重要。\n\n我们还将研究组织如何利用跨企业的规模经济，为创新建立战略性的移动平台，以促进和加速创新移动应用程序的开发。\n\
  \n最后，您将查看如何跨企业范围内建立和共享有关移动化的最佳实践。无论信息是非正式分发的，还是最佳实践是通过正式结构（如 `Mobile COE` 移动卓越中心）确立的，识别和培养最佳实践都有许多益处。\n\
  \n### 战略性 IT\n\n在大多数公司中，大部分 IT 相关的支出都集中在“维持运转”上，而只有一小部分用于新项目和创新。因此，在利用像 `iPad` 这样的新技术时，资源总是显得捉襟见肘。当\
  \ IT 完全专注于成本控制时，倾向于忽视像 `iPad` 这样的设备，因为至少从现状的角度来看，它并没有真正改变成本等式。然而，`iPad` 的价值在于这种技术的变革性质，它在劳动力中实现了以前所未有的功能和行为。\n\
  \n尽管在某些方面，`iPad` 走进企业大门代表了控制权的失去，但也为 IT 提供了一个机会，既可以拥抱用户的需求，又同时帮助业务发现技术的终极价值。\n\n\
  在《变革型 CIO》一书中，作者 `Hunter Muller` 说：“在当今的环境下——即时时代——`CIO` 承担不起被视为反对者的声誉。如果你找不到一种与业务合作的方法，业务可能就会找到一种不需要你的参与的工作方式。在许多公司里，你会听到这样的故事：业务部门在对\
  \ IT 部门失去耐心后径自购买了技术。”\n\n而这正是 `iPad` 在许多组织中创造出的那种局面。这也为 IT 提供了一个机会，去制定一种能够赋能并让业务更高效、多力的战略。通过将\
  \ IT 战略与整体业务战略相结合，公司 IT 可以利用 `iPad` 带来的颠覆性变革来赋能员工，并帮助创建一个更有效的组织。\n\n制定 IT 战略绝不应在真空中进行，因为\
  \ IT 的目的是为业务提供技术，帮助业务实现其整体目标。这些目标可能围绕推动业务增长、提高盈利、增强竞争力、提高劳动力利用率或提高员工满意度展开。无论业务目标如何，IT\
  \ 战略都应与其直接对齐。\n\n在《世界级 IT》一书中，作者 `Peter A. High` 讨论了 IT 战略规划的理想流程：\n\n\n\n\n战略规划需要一个自下而上的维度。这并不意味着在空白起步阶段就应该让所有的\
  \ IT 人员参与其中。相反，这将是一个带有风险的公式，因为人们提供的想法将缺乏结构，而且参与公司重要流程的最初兴奋感将会转为失望的情绪，因为大多数人的想法可能不会被考虑。相反，最高层目标的确定的可能仍然是\
  \ IT 领导层的范畴。而实现每个目标的战术则应属于更广泛的组织范畴。目标提供了结构，而战术提供了一份想法清单，当需要新一轮项目想法时，组织可以从中寻求。\n\n\
  虽然开发完整的 IT 战略不在本书的涵盖范围内，但意识到移动策略应该是整体 IT 战略的一个组成部分是非常重要的。因此，移动策略应该直接与业务整体目标对齐。由于像\
  \ `iPad` 这样的移动技术通常是被强加给 IT 部门的，IT 组织往往以反应性的方式看待移动性，而不是作为整个 IT 战略的一部分主动寻求并开发最佳的移动策略。\n\
  \n## 移动策略的组成部分\n\n过去十年对移动策略的讨论集中在移动设备的控制和管理，以及相应业务流程的治理上。这些主题仍然至关重要，但“IT 消费化”、移动平台的激增、个人拥有移动设备的广泛引入，以及对万事万使用移动应用程序的主流预期，推动了对更稳健、更复杂的移动策略的需求，这种策略需要考虑到所有这些组成部分。\n\
  \n尽管许多公司已经开发和管理移动性策略多年，但 `iPhone` 和 `iPad` 引入的广泛破坏性变化，结合电子邮件之外移动应用的主流采用，使得大多数传统的企业移动策略变得过时且无关紧。\n\
  \n正如上一章提到的，[CIO.com](http://CIO.com) 的总编辑 Brian Carlson 表示：“预计将看到企业将他们所有的核心应用——从\
  \ `CRM`、`ERP` 到费用管理、库存管理和时间跟踪——全部移动化。有效的企业移动策略不再是可有可无的装饰，而是业务增长的必需品。”\n\n过去的移动性可能围绕着电子邮件、日历和联系人展开，但今天的移动革命是关于完整且完全的员工赋能。成功交付这些电子邮件之外的应用程序，比\
  \ IT 通常对移动性所给予的需要更多的战略关注。\n\n此外，移动行业快速且加速的变化趋势使得移动策略不应试图预测未来。相反，它应该以这样方式开发和维护：预见甚至规划剧烈变化。`iPad`\
  \ 几乎是在一夜之间闯入企业市场的，虽然它可能是第一个以这种戏剧方式完成这一壮举的，但它不会是最后一个。\n\n开发和定义移动性策略的过程对于每家公司都是不同的，但一个有效的移动策略应该由这些核心部分组成：\n\
  \n* 业务驱动因素\n* 硬件所有权与支持\n* 部署、配置与管理\n* 用于创新的企业服务平台\n* 应用程序组合与路线图\n* 公司治理与流程\n* 安全标准与审计流程\n\
  \n如果你是在为某个部门或科室制定策略，而不是企业级的策略，那么某些组成部分可能不适用于你的策略。例如，部门级的策略可能侧重于特定业务单元的业务驱动因素、应用程序组合和路线图，而涉及硬件所有权、支持、部署、配置、管理、公司治理、安全标准和审计流程的问题可以在企业层面进行处理。\n\
  \n另一方面，你的企业级策略可能会选择更多地关注底层基础设施问题，并将应用程序组合和路线图留给基于共享基础的各个业务单元。\n\n无论如何，无论这些给定的战略组件的责任是否落在你的职责范围内，你都应该确保所有这些组件最终得到解决。\n\
  \n## 业务驱动因素\n\n业务希望通过移动技术的战略性应用获得什么样的结果？像所有优秀的 IT 战略一样，任何移动策略的基础都应该是业务驱动因素、目标和愿景。技术绝不应该仅仅为了技术而使用技术，而应该为了驱动业务所需的结果。\n\
  \n这些业务驱动因素应该直接源于公司的整体战略、业务计划、目标和愿景。这些目标可以是任何内容，但可能关注增长、盈利能力、创新、客户满意度、员工生产力或员工赋能等话题。\n\
  \n与业务领导就他们的整体战略进行对话也非常有帮助。在处理像 `iPad` 这样变革性的技术时，保持开放的心态是重要的。由于业务流程甚至整个业务模型的设计都是为了在一系列限制内尽可能高效，技术创新可以从根本上改变这些限制。结果可能会成为一种使现状发生剧烈变化的力量。\n\
  \n## 硬件所有权与支持\n\n硬件所有权和支持的讨论有两个重要的维度。首先，是关于公司所有与个人拥有硬件之间的决策。在许多组织中，将会有两者的结合，但确定特定企业适当所有权结构的标准是什么？虽然行业整体趋向于个人拥有设备，但总会有公司拥有设备更优选甚至是必要的情况。例如，许多组织不希望销售人员在离开加入竞争对手时能够带走他们的移动手机号码。允许公司管理个人拥有设备的组织还应该确保他们拥有适当的法律协议和责任免除声明，以便员工能够承认，如果员工离开公司或设备丢失或被盗，公司有权远程擦除设备（包括任何个人信息或数据）。\n\
  \n其次，是平台支持的问题。虽然传统的 IT 能够通过在单一平台进行标准化来维持完全的中心化控制，但消费化的趋势使得这变得困难，甚至不可能。在移动手机方面拥抱消费者选择是一个日益增长的趋势，但在\
  \ `iPad` 作为平板电脑设备上正在进行标准化。观察这种趋势随着时间的推移是否能保持是有趣的，或者平板电脑设备是否也会走向移动手机的道路。\n\n最后，重要的是，移动策略应该涵盖面向内部和面向外部的移动性。通常情况下，面向客户和业务合作伙伴的外部移动性将涉及由个人或组织拥有的设备（因此无法控制平台支持）。然而，我了解到一些组织为业务合作伙伴购买了\
  \ `IPads`，并向客户临时提供 `IPads` 以协助特定的工作流和活动。\n\n\n\n\n其中一些主题将在第 17 章中进行详细讨论。\n\n## 部署、配置与管理\n\
  \n移动设备的部署、配置和管理主题在很大程度上取决于之前讨论过的硬件所有权和平台支持等战略组件。\n\n设备部署通常适用于公司拥有硬件的同质化部署场景。如前所述，尽管智能手机正向“自自带设备”（BYOD）范式转变，但集中化的\
  \ iPad 部署正变得流行。\n\n然而，配置和管理对于同质化部署和“自自带设备”带来的异构结果都是至关重要的。在集中式部署中，设备在分发给用户之前可能已经完成了置备和预配置；也可以直接将新硬件提供给用户，由他们以自服务的方式自行配置设备。在“自自带设备”范式中，自服务通常优于全服务的设备配置。\n\
  \n无论何种情况，一旦设备完成置备、配置和注册，组织就应该具备管理这些设备的能力。在同质化的公司自有部署中，为用户提供退出设备管理策略的可能并不合适；但在“自自带设备”范式下，这可能非常合适甚至是建议的，因为在这种范式下，采用“胡萝卜加大大棒”的方法可以激励用户加入企业安全策略和设备管理。\n\
  \n部署过程将在后续章节中进行更详细讨论：第 17 章讨论了许多与促进移动部署相关的问题；第 18 章涵盖了配置细节和安全策略执行；第 19 章概述了应用部署和更新管理流程；第\
  \ 20 章包含了移动设备管理解决方案和供应商选择的细节。\n\n## 用于创企业服务平台\n\n随着移动技术的持续快速变化演变，企业应该具备在 iPad 上进行快速且低成本创新的能力。虽然传统的企业移动完全围绕移动邮件、日历和联系人展开，但当前移动创新的爆发式增长建立在移动平台可用性的基础之上，能够实现远超这些基础应用的完全新类型的应用。\n\
  \n企业内部移动开发的大部分成本通常在于与后端数据的集成。通过标准化的移动友好型企业服务层暴露对这些系统和功能的访问权限，可以大幅降低创新成本。\n\n此外，通过提供企业库中共享功能（如应用身份验证、授权、分析、日志和其他工具）的开箱即用访问，开发者可以专注于创建能够驱动业务价值的应用程序，而无需重复造轮子。\n\
  \n我们将在后面的章节中多次涵盖这些主题。第 14 章讨论了数据、功能和工具如何在应用之间共享。第 7 章讨论了企业友好型解决方案的开发，包括一些重用方面。你将在第\
  \ 8 章学习更多创建移动友好 Web 服务的过程。虽然面向服务的架构（SOA）日益流行，且企业服务已经建立，但这些服务通常设计为供位于私有网络数据中心的应用程序进行消费和交互，而不是供可能来自外部公共网络的移动设备。\n\
  \n## 应用组合与路线图\n\n在企业中使用 iPad，价值并不仅仅来自于将设备交到用户手中。业务价值将来自赋能这些员工，让他们能够更有效地完成工作。实现 iPad\
  \ 的全额投资回报，需要部署能够提供用户所需功能和能力的应用程序。\n\n然而，重要的是要意识到 iPad 是一项根本性的全新且具有革命性的计算技术类别。我不认为\
  \ Apple 在发布该设备时完全理解了 iPad 会变成什么样。因此，并不是每个现有的企业应用都适用于 iPad。而且许多在 iPad 上交付将产生巨大价值的\
  \ App 也不会是现有应用程序的完全镜像。理想的 iPad 版本应该是现有功能的子集，并通过 iPad 独特的能力和属性引入新的功能超集。这些独特的能力和属性还能让\
  \ iPad 交付此前无法实现的全新类型应用。\n\n开发战略性的 iPad 应用组合需要业务部门和 IT 部门共同努力，进行创新并发现可能。这正是 IT 有机会迎接挑战并为业务提供前所未价值的地方。\n\
  \n下一章（第 4 章）将涵盖作为移动路线图一部分的应用识别和优先级排序过程，以及对这些应用组合的管理。第 5 章讨论了决定构建还是购买应用程序的决策过程。第\
  \ 6 章概述了适用于 iPad 的各种应用架构的影响，第 7 章描述了如何将这些应用作为企业友好型解决方案进行交付。\n\n## 内部治理与流程\n\n建立和维护\
  \ IT 治理的主题远超出本书的范畴，但我个人认为，意识到某些长期存在的流程和可能会阻碍 iPad 在企业中的应用是重要的。鉴于行业发生的剧性变化，以及 iPad\
  \ 的出现和 IT 的通用消费化，可能需要考虑某些治理流程和政策需要如何演变，以识别快速变化的技术格局。\n\nIT 治理的重点通常放在确保符合企业标准和风险风险上，在我看来，良好的\
  \ IT 治理的最终目的是使每美元支出所交付的价值最大化。当涉及 iPad 这样的颠覆性技术时，即使是良好的 IT 治理职最初也可能被视为阻碍交付最大价值。在当今消费化的\
  \ IT 环境中，企业标准和 IT 治理必须响应业务和个人用户快速变化的需求，无论是在一线还是在高管层。根据你组织的需要和合适性，这些主题应纳入移动战略的开发中。\n\
  \n## 安全标准与审计流程\n\niOS 和通用消费化趋势都要求企业采用新的移动技术安全范式。虽然传统的移动安全关注设备级，但个人与业务数据及功能的混合需要对应用沙箱级安全给予额外关注。此外，由于是在未托管设备上交付给客户和合作伙伴的，所有的安全都必须在应用级进行管理，因为无法在设备级应用任何安全措施。\n\
  \n\n\n\n沙箱安全模型的优缺点在于，它的安全性取决于你将其构建得有多高标准。如果你遵循行业最佳实践并建立企业级标准，那么你的应用程序就可以极其安全；但如果你将安全性交给没有\
  \ iOS 或沙箱级安全企业标准的临时开发团队来处理，那么你的应用程序可能就没那么安全了。\n\n当你选择购买应用程序而不是在内部开发时，这一点同样重要。审计你所有的移动应用程序（无论是购买的还是自建）都至关重要，以确保它们与企业安全标准保持一致。由于\
  \ iPad 对大多数组织来说是新事物，IT 安全小组可能并不熟悉 iOS 上的所有潜在攻击向量，也不熟悉保护这些应用程序的最佳实践。此外，这些最佳实践、企业标准，以及一致的\
  \ iOS 应用安全评估和审计流程，最终应该整合到组织的软件开发生命周期（SDLC）方法论和流程中。\n\n一些与架构相关的安全主题将在第 7 章中介绍。与 iOS\
  \ 企业应用相关的安全问题和最佳实践将在第 16 章。第 18 章讨论了安全策略与执行，第 20 章讨论了这些安全策略的管理。\n\n## 确保价值主张\n\n\
  企业级 iPad 的核心在于驱动价值。正如上一章引用的许多财富 1000 强企业 CIO 所言，iPad 的价值并非设备本身固有的，而在于 IT 与业务部门如何协作，发现特定的用途和应用，从而为业务带来最终价值。\n\
  \n就像 PC 一样，iPad 的价值完全取决于它运行的应用程序所能交付的结果。如今的 IT 拥有一种稀有的能力，可以利用一种全新的变革性技术来帮助交付业务迫切渴望的结果。\n\
  \n在《IT 的真实业务》（Real Business of IT）书中，作者 Richard Hunter 和 George Westerman 写道：“高管最终对\
  \ IT 要求的不是对齐，也不是被当作客户对待。高管想要结果。销售额的增加、利润率的提高和市场份额的都是高管想要的结果示例。如果 IT 团队正在讨论并帮助交付这些结果，那么‘与业务对齐’就不是一个问题了。”\n\
  \n这真是价值创造的双重击击！拿一个业务迫切想要使用的设备，并利用它帮助他们实现他们所关注的结果。IT 不应该用恐惧眼光看待 iPad，而应该对通过正确使用该设备能创造的所有价值感到兴奋。\n\
  \n## 管理移动性的冲突需求\n\n对于像 iPad 这样的颠覆性技术，组织内部利益相关者往往存在许多冲突的需求。通常是 IT 部门处于中间，解决这些不同的观点。虽然这些观点不一定明确包含在移动策略中，但意识到这些不同的声音至关重要，以确保他们的需求在移动策略中得到解决。\n\
  \n### 用户\n\n无论是一线员工还是 C 层高管，用户都希望能够使用移动技术来完成工作。无论他们是将自己的个人硬件带入办公室，还是由组织提供设备，他们都希望使用这些技术来提高生产力和效率。\n\
  \n在当今文化中，移动技术已演变为个人极具特性的延伸。像 iPad 这样的设备模糊了用户个人生活与职业生活的边界。与其对抗，不如拥抱它。赋予用户力量，他们不仅会提高生产力，而且会有更高的员工满意度。\n\
  \n### 运营\n\n像 iPad 这样的移动技术转型业务流程的潜力是巨大的。许多组织拥有内部业务流程，通过引入和转型移动技术来简化信息和功能的获取、分发和访问，可以实现极高的效率。\n\
  \n如果业务部门看到了利用 iPad 优化运营流程的机会，应该鼓励他们在交付符合整体业务目标和战略的结果方面进行实验和创新。他们不应该为了 IT 治理而陷入试图将\
  \ iPad 建立为企业标准的困境。\n\n### 营销\n\n随着移动技术的普及率提高，以及 iPod touch、iPhone 和 iPad 等设备的应用程序实现主流化，这些设备已成为向客户营销和建立联系的理想平台和渠道。\n\
  \n移动性已成为大多数营销策略和活动的不可或缺的一部分。事实上，“移动策略”一词在广告和营销领域被常用，用于描述针对移动设备和渠道的以消费者为中心的营销或广告策略。当外部机构或内部营销团队寻求开发\
  \ iPad 和其他移动应用时，应该鼓励他们遵循架构最佳实践，并为安全以及共享移动 Web 服务层访问等提供企业标准，这最终将为组织提供大量价值，因为外部应用程序所需的服务和数据通常可以广泛地复用于内部应用程序。\n\
  \n### IT\n\n当然，IT 处于这些冲突观点的中心。由于 IT 最终负责确保安全和管理支持，直觉反应是抵制这些移动性需求。如果发生数据安全泄露，或者业务操作因为技术系统故障而停止，或者呼叫中心被支持请求淹没，IT\
  \ 就是那个被“背锅”的人。\n\n尽管已广泛讨论，如果 IT 选择忽略这些移动性需求，其他方就会绕过 IT。这在某种程度上确实使 IT 陷入了困境，但另一方面，它也给了\
  \ IT 一个为业务创造大量新价值的机会。\n\n## 内部 vs 外部移动性\n\n在企业内部移动性的背景下，营销与 IT 之间的关系非常有趣。对于大多数公司来说，组织内部开发的第一个\
  \ iPhone 或 iPad 是由营销部门驱动的。在许多情况下，这让 IT 处于防御性地位，因为这些应用通常被直接推给 IT 部门进行长期的维护和支持。这使得情况更加复杂，因为通过开发这些应用，营销部门不仅满足了外部客户和业务伙伴的需求，也满足了内部员工的需求。\n\
  \n在第一章中，详细讨论了这一趋势的许多案例，引用了保险和零售等各种行业，在这些行业中，公司通过面向的应用程序向客户提供的数据和功能往往比向内部员工提供的。此外，意识到外部消费所需的功能与内部使用所需的功能非常相似。\n\
  \n例如，通过 `App Store` 分发的面向客户的营销应用（包含产品详情、图片、视频和价格）可能也会为直接销售或渠道销售人员提供巨大的价值。另一个例子可能是为客户提供自助服务功能的外部应用程序。内部员工对该功能的需求可能与客户同样巨大。\n\
  \n\n\n这里存在另一层的复杂性，因为在推动开发这些应用程序时，营销部门往往走在 IT 部门前面，但面向客户的版本通常是员工使用的内部应用程序所需功能的子集。与之前的示例类似，内部销售团队可能希望营销应用的某个版本包含产品信息和交互式媒体，同时还应包含机密的竞争产品分析或不应向公众免费公开的特定话术点（talking\
  \ points）。对于自服务类应用程序，虽然客户仅代表自己进行操作，但面向内部的版本则要求员工代表客户进行操作。在两种情况下，应用程序的内部版本比其面向客户的版本需要更高级别的安全防护、应用程序认证和授权。\n\
  \n如果 IT 部门没有参与这些面向外部应用的架构、设计和开发，那么遗憾的是，这些由营销驱动的外部应用通常必须完全重写才能适用于内部的使用和消费。\n\n因此，IT\
  \ 部门和营销部门之间的协作至关重要，在制定移动战略和应用路线图时，要同时考虑面向外部和内部的应用。当企业移动战略充分考虑到营销部门和 IT 部门对内部和外部应用的需求时（图\
  \ 3.1），就可以实现巨大的价值并节省成本。\n\n由于营销部门倾向于比 IT 部门更快地拥抱最新技术，营销部门往往决定在没有 IT 支持的情况下直接推行这些新技术。从长远来看，这为技术管理带来了许多问题。\n\
  \n图 3.1: 企业移动战略应该涵盖面向内部和面向外部的用户画像及应用程序。\n\n![3.1](img/c03f001.jpg)\n\n由于许多营销活动需要快速进行，因此如果\
  \ IT 部门想要参与讨论，那么在采用技术方面，IT 部门的责任就是像营销部门一样快速。正如本章前面讨论的，作为创新企业服务平台的一部分，创建一个标准化的、面向外部的、移动友\
  \ Web 服务层，可以大幅提高上市速度并降低交付增量移动应用程序的成本，这恰恰是营销部门真正想要的。在开发移动战略时，考虑所有这些内部与外部面对的需求至关重要。\n\
  \n## 定义移动用户画像\n\n随着 iPhone 以及现在是 iPad 进入企业环境，许多定义清晰的移动化边界和处理方法已经发生了变化。大多数组织拥有多个移动用户画像，每个画像都有其独特的一组属性。在开发企业移动战略的过程中，正确识别这些画像是创建应用路线图的前提。事实上，每个移动画像甚至可能拥有独立的应用程序组合和路线图，尽管它们通常会有某些重叠部分。\n\
  \n为了理解这些移动画像是什么以及它们代表的意义，请查看 `图 3.2` 中的图表，该图描述了某示例企业的四个移动用户画像。\n\n图 3.2: 此图表对比了示例组织内部的各种移动用户画像。\n\
  \n![3.2](img/c03f002.jpg)\n\n为了设定背景，假设这家公司像大多数大型企业一样，已经使用了加固移动计算设备很长时间了。想想大多数制造设施和仓库中存在的、用于产品检查或库存管理的手持条形码扫描仪。在这种情况下，iPad\
  \ 等技术可能不会取代现有的移动部署。尽管 iPad 可能会增强这些部署，因为 iPad 独特的形状设计可能为某些工作流和应用程序提供最佳体验。这种画像被称为“公司所有”，因为这些设备是组织的资产，并且是在多个用户之间共享的。此外，由于这些设备和应用程序永远不需要离开公司的物理场场所，因此对始终可用的无线连接有基本预期，且网络是私有且安全的局域网。\n\
  \n在光谱的另一端，“客户所有”用户画像与“公司所有”画像大不同。由于这些设备由客户或业务伙伴拥有，组织无法管理这些设备，实际上对它们完全没有控制权。虽然这种用户画像对许多组织来说很新，但针对该画像的应用程序通常由营销驱动，因此其移动和演进速度要快得多。\n\
  \n在这两个极端之间，这个特定的示例描述了另外两个移动用户画像：公司影响画像和员工所有画像。在许多方面，这两个画像之间有显著的相似之处，但存在一个重要的区别。在这个示例中，公司影响的移动用户画像使用\
  \ Exchange ActiveSync (`EAS`) 来访问企业电子邮件、日历和联系人，并受到企业移动设备管理 (`MDM`) 安全策略的限制，而员工所有画像则不是。虽然这两个画像都可能代表个人所有的设备，但公司能够对其中一个画像的用户和设备施加某种程度的影响和控制，而另一个则不能。许多组织理所当然地认为用于业务的设备将用于公司电子邮件，因此它们可以对设备拥有某些控制。但在某些日益常见的场景中，情况并非如此。例如，许多大型公司有大量的一线员工，他们不使用且通常也无法访问公司电子邮件帐户。随着移动化变得越来越普遍，越来越多的劳动者将使用移动设备作为访问互联网的主要工具；任何人力资源或薪资自服务门户、请假申请系统或其他类型的面向员工的应用程序都应做好移动访问的准备。这些应用程序将在公司无法控制的员工移动设备上运行。\n\
  \n当然，每家公司都会有一组独特的移动用户画像，它们可能与本示例描述的相似，也可能完全不同。然而，在开发企业移动战略早期明确定义这些移动用户画像是非常重要的，因为来自组织不同部门的人对“移动用户”有独特的观点。因此，必须在提前定义这些画像，并传给所有参与移动战略的人员。\n\
  \n## 利用企业的规模效应\n\n通过利用大多数大型企业内部规模效应，组织可以在多个方面获得显著收益。\n\n在基础设施层面，在整个企业范围内统一使用移动设备管理解决方案通常是明智的，以提供部署、注册、配置、管理和安全的一致性。\n\
  \n\n\n\n在服务层面，创建一个移动端友好型的企业共享服务层通常很有价值，通过该层可以对公共数据和后端系统进行集中聚合。在某些情况下，在整个企业范围内这样做是合适的，但在其他情况下，在部门或业务单元范围内更具适用性。\n\
  \n在应用层面，创建标准组件、库或框架不仅可以显著节省成本，还可以通过标准化帮助提供一致的安全性。例如，集中地开发和维护一个用于应用程序身份验证、授权和加密的模块化组件，不仅极大地减少了开发团队启动新移动应用程序的工作量，还能确保极高水平的一致性安全性，而如果将安全性交由各个开发小组自行负责，则可能无法达到这种水平。\n\
  \n当然，中心化（特别是在应用开发中）可能与敏捷性产生冲突，因此这些标准通常最好作为特定开发工作的一部分进行，然后移动到中心化的语文中。\n\n## 制定组织最佳实践\n\
  \n始终记住，最佳实践不应在真空中产生。当然，组织可以轻松且快速地采用行业范围内的最佳实践，但不应仅止于此。\n\n例如，正如在企业级规模效应讨论中提到的，移动应用程序开发的最佳实践将在移动应用程序的实际开发中产生。特定开发团队和项目学到的教训应该被记录并与整个组织共享。\n\
  \n在某些情况下，建立一个移动卓越中心（COE）是有意义的，以促进组织内部知识和最佳实践的共享。随着移动成为 IT 的关键功能，移动 COE 正在变得越来越常见。如果你的组织不适合或不需要这种程度的正式化，那么像\
  \ wiki 这样的工具也可以且应该被用于交流和共享知识以及组织最佳实践。\n\n## 总结\n\niPad 已经不可逆地影响了企业 IT 的角色，制定企业移动性战略现在是任何有效的整体\
  \ IT 策略的关键要求。在本章中，我们讨论了有效策略的组成部分，包括识别底层业务驱动因素、硬件所有权和平台支持的方法、部署和设备管理、建立支持移动创新的企业服务平台、开发应用组合和路线图、评估移动性对\
  \ IT 治理功能的影响，以及创建移动安全标准和审计流程。\n\n当然，管理对移动性的冲突需求还涉及额外的复杂性，包括在移动战略中纳入内部和外部的移动性视角的重要性。识别并记录组织内部的移动用户画像是移动战略规划的重要前提，而且尽可能利用规模效应并建立最佳实践始终是一个好主意。\n\
  \n你准备好为你的组织制定移动战略了吗？\n\n在下一章中，我们将深入研究开发应用路线图的过程。为了帮助开启脑风暴，我将描述在数十个垂直行业和横向职能组织中使用的数百潜在应用程序。\n\
  \n# 第 4 章\n\n## 创建应用路线图\n\n### 本章包含什么？\n\n*   如何识别应用作为你移动战略的一部分\n*   对可能性的进行脑风暴\n\
  *   特定行业的垂直应用示例\n*   跨行业的横向应用示例\n*   理解内部应用与外部应用\n*   如何策略性地对潜在应用进行排序\n\niPad 是一个强大的平台，但应用赋予了\
  \ iPad 充分业务潜力。为了最大化组织在移动性支出上的投资回报率（ROI），你必须利用能够为业务提供真实价值的应用程序来利用平台。\n\n当你为组织制定和演进移动战略时，你的策略和计划中最重要的方面之一将集中在应用上。在之前的章节中，我们讨论了围绕特定的业务驱动因素、目标和任务制定企业移动战略。\n\
  \n在本章中，我们将从整体移动战略的背景来看开发应用路线图的过程。这是通过识别潜在应用、组织应用、评估它们，并根据它们对业务的相对成本、收益和风险进行排序来实现的。\n\
  \n## 识别潜在应用\n\n在为企业识别潜在应用时，进行脑风暴会议通常是有益的。\n\n这种脑风暴练习可以由个人或小团队进行，但根据我的经验，由 IT 的技术和非技术人员以及不同业务小组组成的跨部门团队通常最有效。参与者将把他们自己的视角带入会议，拥有各种不同的视角和观点是一件好事。\n\
  \n从观察你所在行业的公司如何使用移动技术开始，然后扩展视野，看看其他行业的公司如何使用这项技术。然后思考你公司内部不同的用户画像和功能组，看看是否有任何想法能从这些组用户的角度产生共鸣。\n\
  \n在小组花时间讨论其他组织如何使用 iPad 之后，为脑风暴活动设定阶段是关重要的。鼓励所有参与者分享他们想到的任何想法。在这个阶段不要否决或批评任何想法。在脑风暴产生长长的潜在应用想法列表后，你可以评估并对应用进行排序，过滤掉任何不恰的想法。这里的关键是尽可能多提出应用概念。你的想法越多，就可能产生能够推动巨大价值的概念，概率越高。记住，表达一个想法并不意味着做出实际实施任何内容的决定。它只是一个想法，想法之间可以相互借鉴。\n\
  \n## 垂直应用\n\n特定行业，或通常所说的垂直市场，往往具有许多在该领域内公司之间相似的潜在应用。并非所有应用都所有组织。许多因素决定了适用性；本节将概述这些不同垂直市场公司使用的一些较常见的\
  \ iPad 解决方案。\n\n同样，检查完全不相关行业的公司如何利用移动性通常具有同样的价值。不要只关注你自己的垂直市场。技术最强大的应用可能来自完全不同领域之间想法的交融。\n\
  \n以下并非垂直市场的详尽列表，它没有涵盖每种潜在应用。本节将简单地概述这些特定行业（此处按字母顺序排列）各的一些流行和新兴应用。\n\n消费品\n\n\n\n\
  \n无论是通过企业对企业（B2B）渠道向分销商销售消费品，还是在企业对消费者（B2C）背景下直接面向客户，都有许多强大的方法可以使用 iPad 来改进和增强销售流程。客户关系管理系统可以帮助销售人员跟踪客户互动和机会。订单录入系统可以在外勤处理交易，并为进行演示和查看报告提供数据。\n\
  \n对于需要对零售商进行审计，或派遣员工团队收集有关自身或竞争对手产品定价、定位或可用性数据的公司来说，iPad 可以提供许多节省时间的应用程序。条形码扫描器还可以与\
  \ iPad 配对，以加速产品信息的采集。\n\n许多消费品公司还在开发面向客户的应用程序，以强化品牌形象、扩展客户体验、寻找零售网点甚至直接订购产品。随着移动应用程序整体采用率的持续上升，营销和品牌应用正成为主要消费品牌不可或缺的关键渠道。\n\
  \n## 金融服务\n\n金融服务机构是 iPad 最早的采用者之一，可以使用该设备处理许多类型的信息驱动型应用程序。商业智能、执行官仪表板和其他类型的报告应用程序是各类金融服务机构流行的解决方案。\n\
  \n文档管理和工作流自动化也是该行业的强大解决方案。此外，可以电子化采集签名并保存到文档中，集成到工作流中。商业贷款机构通常有额外的纸质文件、实物检查、审计和其他流程，这些流程可以通过\
  \ iPad 应用程序得到显著简化。\n\n大多数大型金融服务机构还在为客户创建许多不同类型的外部应用程序。消费银行可以提供账户管理、贷款申请和账单支付解决方案。券商可以提供投资组合跟踪以及股票交易。\n\
  \n## 酒店住宿业\n\niPad 具有增强酒店和其他酒店住宿组织内部客户体验许多方面的潜力。此外，某些 iPad 应用程序员工和客人都可以使用。\n\n对于酒店来说，员工可以使用\
  \ iPad 简化办理入住或退房流程，以及各种维护、清洁和客房服务活动。应用程序还可以为客人提供订购房间服务、预订设施、访问账户账单甚至办理退房的能力。\n\n\
  一些高端餐厅正在使用 iPad 显示详尽的酒单，并确保酒单与实时库存同步。它还可以供领位或接待人员查询预订并协调座位安排。快餐餐厅还可以提供菜单，以及针对外带或外卖进行下单和支付的能力。\n\
  \n许多酒店住宿机构还在开发面向客户的应用程序，以强化品牌、允许预订或预约，或通过与其他服务提供者的互动来增强整体客户体验。对于拥有强大品牌的大型酒店公司，面向客人的应用程序和功能正成为标准做法。\n\
  \n## 保险\n\n保险销售人员可以使用 iPad 使用交互式和动态计算器进行演示，包括实时、可定制的插图工具。可以对保单进行定价和报价，并显示建议供查看或电子邮件给客户以便稍后审核。合同可以直接在触摸屏上查看和签署。\n\
  \n理赔审核员可以遵循理赔调整工作流进行工作。相机、GPS 和条形码扫描器也可用于加速许多类型保险理赔调整的数据采集。由于大多数类型的保险理赔调整需要大量的纸质文件，且随后必须重新输入计算机，因此移动应用程序具有巨大的潜力。这些应用程序通过简化数据采集、通过在现场执行数据验证来提高质量，并减少了将纸质表单信息输入计算机时引入的开销和错误，通常能提供极具吸引力的投资回报。\n\
  \n对于使用独立代理人或经纪人的保险公司来说，创建能够让独立代理人更容易销售公司自身保险保单的应用程序是有价值的。一些保险公司甚至为表现优异的销售人员奖励 iPad\
  \ 以及针对性强的应用程序，以帮助加强他们与保险公司的关系。此外，允许独立代理人或经纪人访问理赔状态或佣金的应用程序正越来越流行。\n\n拥有消费产品和品牌的保险公司可以开发面向客户的应用程序，以提供保单访问、自助服务请求和理赔申报。在某些保险领域，面向客户的移动应用程序可以为用户自助服务提供巨大的投资回报，并已被几乎每家大型保险公司广泛采用。\n\
  \n## 制造业\n\n虽然制造业对 iPad 的采用速度比其他行业慢，但仍有很多应用程序可以驱动显著的投资回报。制造定制化产品的组织可以将产品配置器扩展到 iPad，供客户、分销商、经销商或直接销售团队使用。无论是直接销售还是通过分销商销售，客户关系管理和销售力量自动化解决方案都能提供强大的价值。产品设计可以在\
  \ iPad 上以 2D 或 3D 计算机辅助设计 (CAD) 图纸查看，并可在生产车间作为参考，或促进与客户或合作伙伴的对话。\n\n管理层可以查看、监控甚至调整调度制造计划的流程。警报和仪表板可以为主管提供实时性能指标，并让他们在制造问题出现时就能看到。\n\
  \n通过消除纸质文件并在检查点数字化采集数据，可以简化工作流和检查流程。条形码扫描器还可用于跟踪资产、查询产品库存状态、加速检查并执行许多其他数据驱动的活动。维护人员可以使用应用程序访问设备参考指南和服务维修手册，查询特定设备的维修历史，并跟踪工单或执行其他维护任务。\n\
  \n如果适用于产品，甚至将产品与 iPad 等移动设备集成，以访问内部信息、提供配置或以其他方式增强使用体验也可能是有价值的。对于拥有强大消费品牌的制造商，开发用于营销的面向客户的应用程序已常见，同时也提供产品指南、参考、培训视频和类似功能。\n\
  \n## 医疗器械与医药\n\n医疗器械和制药行业的机构是最早将 iPad 部署到其外勤销售团队的大公司之一，这提供了巨大的价值。通过让这些销售人员在 iPad\
  \ 上访问产品信息和其他面向销售的功能，销售人员可以最大限度地利用与医生交流的宝贵时间，并大幅提高整体销售生产力和效率。\n\n\n\n\n制药制造商正在使用\
  \ `iPad` 进行处方药样品管理，以协助跟踪库存以及在分发产品样品时采集医生的签名。医疗器械制造商也在使用应用程序进行库存管理以及销售交易处理。\n\n制药商和医疗器械制造商还使用\
  \ `iPad` 开发面向临床医生和患者的应用程序。医生可以使用此类应用程序将其作为自启动更新的电子宣传册、参考指南、产品培训材料和计算器。医疗器械制造商可以开发与医疗器械交互的医生端应用程序，通过移动设备提供状态、诊断、配置和其他类型的交互功能。制药制造商可以提供药物用量和处方计算器。\n\
  \n对于面向患者的应用程序，制药商和设备制造商都可以提供教育内容、参考材料，甚至是可以允许患者通过移动设备与医疗器械交互的应用程序。\n\n## 医疗提供者与执业人员\n\
  \n医生传统一直是移动技术的早期采用者，`iPad` 也不例外。由于该设备在医疗专业人员中流行，`App Store` 中有一个整个应用程序类别专门用于医疗应用。然而，由于应用程序的使用是由个人用户而非整个组织驱动的，因此提供者和机构内部存在大量的碎片化现象。这意味着今天使用的大多数应用程序都是相对独立的，没有与后端系统和数据集成。像参考指南和计算器等独立应用程序的使用非常广泛。电子健康记录\
  \ (`EMR`) 和 电子处方 (`e-prescribing`) 等解决方案正在受到关注，但采用速度较慢，因为它们需要提供者或机构进行集成和管理。\n\n\
  医生最常用的应用程序之一是医学参考指南。这些应用程序可以提供对通用话题、特定疾病详情以及医学期刊发表的最新文章信息的强大访问。带有药物数据库、处方计算器和药物相互作用计算器的应用程序也极其强大，并具有挽救生命的潜力。`iPad`\
  \ 在护士和医学生中也受欢迎，可以作为培训、学习和参考的强大平台。\n\n`iPad` 的另一个流行用途是作为患者的演示工具。该设备可以显示心脏或脊柱等解剖结构的\
  \ 3D 模型，帮助医生与患者进行视觉化沟通，并让患者更容易理解难以描述的概念。\n\n对于复杂的医疗操作，`iPad` 可以作为交互式同意书，提供手术过程的图片、视频或\
  \ 3D 渲染图，帮助医疗专业人员通过视觉方式与患者交流复杂概念，并采集患者同意的屏幕电子签名。\n\n用于自动化采集诊断和手术代码的应用程序可以简化计费流程，并帮助在治疗点捕捉编码错误，而不是在之后的转录和数据输入期间。此外，可以从\
  \ `iPad` 访问电子健康记录，让执业人员实时获取患者状态、放射学报告和实验室检查等信息。\n\n可以从 `iPad` 远程监测体征，医生可以立即看到患者实时数据和警报。从分娩期间的胎心和子宫收缩模式到心律、脉搏氧饱和度和监护室患者的呼吸机峰值，此类应用程序让医生能够随时随地严密监控患者。\n\
  \n## 石油与天然气行业是移动技术的长期用户，但大部分用途是针对极端环境条件所需的“加固型”手持计算机。因此，`iPad` 对于该行业的某些应用来说并不是合适的设备，尽管对于其他应用可能是的。\n\
  \n可以使用应用程序自动化检查和维护流程，以简化调查和数据收集。与相机、`GPS` 设备和条形扫描器的集成也可以提供增强这些工作流和流程的方法。\n\n随着大量的嵌入式系统采集海量数据并监控井或钻井设备的状态，直接从\
  \ `iPad` 访问图表、图形和警报可以成为利用这些海量采集数据的强大方式。执行管理层还可以使用 `iPad` 查看有关安全和生产的各种关键性能指标的实时状态。在一个充满安全忧虑的行业中（特别是自深水地平线灾难之后），快速访问安全指标变得日益重要。\n\
  \n## 专业服务\n\n律师、会计师、顾问和许多其他类型的专业人士迅速拥抱了 `iPad`。虽然独立专业人士可以自由地使用 `iPad`，但大型专业服务公司也很快看到了其益处。\n\
  \n时间跟踪应用程序可以与计费系统集成，还可以与里程和费用跟踪集成。通过让专业人士跟踪客户互动变得更加简单、方便，未计费的时间会更少，这对许多专业服务组织具有重大的底线潜力。\n\
  \n文档管理解决方案可以使专业人士在任何地方访问他们需要的任何文档。通过复杂的文档搜索解决方案，专业人士可以快速确定位所需的确切文档，节省时间和金钱。\n\n\
  法律检索系统可以提供对文档、引用和案例历史的移动访问。无论是在法庭还是在会议室，获取几乎无限制数据的能力正在改变法律专业人士执业法律的方式。\n\n合同管理应用程序可以提供自定义合同和采集移动执行所需签名的功能。文档随后可以保存到后端管理系统、推送到工作流系统，或简单地打印和/发送电子邮件。\n\
  \n## 公共服务\n\n尽管政府机构通常不是 iPad 的早期采用者，但 `iPad` 为他们提供了巨大的机会。此外，政府工作人员已使用他们自己的 `iPad`\
  \ 来帮助他们更有效地工作。世界各地的政府领导人，以及警察、健康、安全、消防和交通工作人员正在使用 `iPad` 从任何地方获取信息，并最终提高效率。\n\n\
  通信应用程序可用于保持现场人员与中央管理层之间的联系。这在灾害管理中也可以一个极其强大的应用程序。\n\n`iPad` 可用于数据收集，取代手动和纸质流程。应用程序可用于辅助检查并简化数据采集过程，以及参考历史检查记录。条形码和\
  \ `GPS` 设备可以提高工作流的效率和准确性。地图和地理信息系统 (`GIS`) 通常可以提供巨大的价值。\n\n在任何地方搜索并访问信息的能力是非常强大的。查看法律法规和刑法典可以帮助律师、执法人员以及法律系统的其他人员。在任何地方搜索未执行逮捕令和进行背景调查的能力对许多组织都非常有用。\n\
  \n## 房地产产\n\n\n\n\n\n房地产行业的许多功能和角色都可以通过 iPad 增强。无论是住宅还是商业销售代理，都可以在途中访问他们的信息和客户数据。跟踪预约、房产和沟通可能具有挑战性；而\
  \ iPad 让所有这些信息对代理人触手可及。\n\n房产检员和评估师可以使用 iPad 代替纸质表格，并比以前的手工流程更快、更高效地采集数据。\n\n商业和住宅管理公司可以使用\
  \ iPad 跟踪服务请求和工作单。维修人员可以访问服务管理系统，并根据其位置和技能进行派单。\n\n个人客户可以通过许多面向消费者的应用程序，在他们的 iPad\
  \ 上搜索房产。许多房地产经纪人和公司还提供自己的应用程序，用于营销和品牌建设之目的。\n\n## 零售\n\n零售商正将 iPad 用于各种应用。销售区域的员工可以使用该设备与客户互动，并查询产品信息、可用性和配置。信贷申请可以直接在设备上进行采集。调度应用程序可以帮助管理预约。iPad\
  \ 还可以作为自助机，为客户提供对产品信息、交互功能、视频和其他功能的访问。\n\n某些类型的零售商正在使用 iPad 进行销售点（POS）应用，并在销售现场或在结账银台拥满且商店没有足够的固定\
  \ POS 终端的溢出场景处理交易。条码扫描器也可用于广泛的零售应用。\n\n对于不一定面向客户的系统，提供仪表板、报告、警报和其他关键业务信息的应用程序可以提供巨大的价值。应用程序可辅助“平面图规划”（planogramming）——即对装置和产品进行绘图，展示如何以及在哪里展示零售产品以获得最高销售额和最佳架空间利用。检查流程、调查采集、数据收集和类似的工作流可以轻松从纸质转移到\
  \ iPad，条码扫描器在许多此类应用中也能提供巨大的价值。\n\n面向客户的应用程序正成为行业常态。让客户获得产品信息、可用性、促销、商店位置、购物车甚至结账功能的访问，既可以提供良好的营销渠道，也能为客户自助服务提供强有力的投资回报。\n\
  \n## 交通\n\n许多不同类型的运输公司迅速拥抱了 iPad。该行业的许多公司正使用该设备进行工作流、清单和检查流程。\n\n航空公司飞行员使用 iPad\
  \ 管理他们的行程、规划路线、访问机场图纸并检查航路手册和终端程序。某些航空公司甚至在航站楼和休息室放置 iPad 供旅客使用。\n\n快递公司使用 iPad\
  \ 作为包裹送达证明的平台，并向客户提供实时位置状态。他们还可以根据最近的可用快递员实时派发快递员进行取件。\n\n面向消费者和业务伙伴的应用程序也适用于运输行业的许多方面。包裹和货物跟踪应用程序可以为客户提供实时状态，以及调度取件的功能。运输提供商也可以使用应用程序让客户自助访问行程等信息，并让他们预订交通。\n\
  \n## 公用事业\n\n公用事业和其他能源相关公司使用移动技术已十多年，但由于环境条件的限制，该行业在许多应用中一直在使用加固设备。尽管，iPad 可用于许多应用，这些应用并不一定需要极其加固的硬件。工作流、数据采集、检查、设备维护和服务管理是能够提供显著投资回报的应用。提供管理层访问仪表板、报告和警报的应用程序也可以提供大量的业务价值。\n\
  \n公用事业可以为客户提供应用程序，让他们访问自助功能和使用信息，以及支付账单的能力。\n\n## 水平应用\n\n除了垂直行业特定解决方案外，许多其他解决方案被应用于各种行业的业务中。这些被称为水平解决方案。当然，并不是每个水平解决方案都适用于每个行业或公司；某些解决方案仅适用于少数几个用户组，而其他解决方案适用于几乎整个组织。\n\
  \n再次，这份水平市场和应用列表并不是详尽的，但它是最常见移动功能的良好代表性样本。\n\n## 业务智能\n\n无论是在执行领导层、中层管理还是运营监督，信息工作人员经常需要访问仪表板、指标和关键性能指标。虽然大多数业务智能系统设计为用户坐在桌子旁使用，但许多信息工作人员在外出时需要访问这些数据。\n\
  \niPad 是与图表交互、钻取数据和查看警报的强大平台。因此，业务智能已被证明是平台上采用最快的业务应用程序之一。\n\n## 通信\n\n电子邮件是最流行的业务通信应用程序，但许多其他应用程序在通信中提供了价值。在线会议、视频会议、实时聊天、即时消息或在线留言板协作也提供了巨大的价值。许多组织拥有高度分散的员工，在专门主题方面具有深专业知识；移动通信工具可用于促进人和团队之间的协作。\n\
  \n通信系统可以简单地利用现有平台，例如通过 `Exchange` 使用电子邮件、通过 `SharePoint` 使用留言板，或专门为移动工作场所通信和协作设计的自定义系统。通信系统还可以与协作、知识管理和工作流系统集成，在适当的情况下提供额外价值。\n\
  \n## 客户自助\n\n许多组织拥有面向外部的网站或应用程序，向消费者或业务伙伴开放自助功能。与其拿起电话或发送电子邮件，自助系统可以赋能这些个人完成需要的工作，而不需要额外的人工参与。\n\
  \n对于具有此类潜在功能的组织，其业务案例通常非常强有力，因为替代方案通常是极度耗费人工的人工流程。通过推动采用自助系统，公司将实现显著的节省。\n\n\n\n\
  \n\niPad 可以为用户在旅途中提供一种随时随地进行数据分析的独特且强大的用户体验。尽管许多移动计算平台尚无法进行重大的计算和数据分析，但 iPad 的硬件具备了大量用于处理的强大能力。此外，该平台可以为用户提供丰富的交互性，用以处理以前无法获得的数据。从点击进行数据钻取，到通过双指缩放和滑动手势在内容间导航，iPad\
  \ 为许多不同类型的数据分析提供了独一无二的用户体验。\n\n将此类应用视为一种最大化移动设备计算能力的方式，以便处理、操作和操纵数据，并根据任何类型的企业数据、内容或信息做出决策。\n\
  \n## 数据采集\n尽管加固型移动设备已用于收集各种类型的数据十余久，但 iPad 现在将这种能力提升了一个新水平。触摸屏可用于快速浏览工作流、填写表单和检查清单，并执行其他数据采集过程。当与地理定位功能或市面上许多兼容\
  \ iPad 的条形扫描器相结合时，数据采集能力将得到进一步增强。\n\n将此类应用视为一种简化并增强从任何地方获取信息或内容的能力，并将其回传到组织，最终进入其所需的任何后端系统或数据库。\n\
  \n## 文档管理\n随着许多组织转向数字化，iPad 提供了以前无法实现的丰富交互性来处理数据。从点击数据钻取到滑动手势在内容间导航，iPad 为许多不同类型的数据分析提供了独特的用户体验。\n\
  \n由于许多组织转向无纸化未来，iPad 的电子文档管理功能可以帮助用户快速访问所需文档。\n\n## 自动化\n\n  自动化\n对于任何类型企业数据、内容或信息做出决策。\n\
  \n对于无纸化未来，，， iPad 文档管理功能，不同 能够提供一种强大的用户体验。\n\n\n\n  现场自动化\n将此类应用视为一种简化并增强从任何地方获取信息或内容的能力，并将其回回到组织，的文档管理系统可以提供强大的数据库。\n\
  \n## 现场服务自动化\n当服务人员  订单或或时，，   提供强大的强大的强大的。。。。。、、订单或进行进行时，iPad 能够提供强大的的体验。\n\n##\
  \ 地理信息系统\n地理信息系统 (GIS) 整合地图和其他数据，在不同的场景场景，GIS 能够提供强大的强大的视觉体验。\n\n## 人力资源\n随着员工变得日益移动，人力资源系统的访问将成为一种标准。\n\
  \n## 库存管理\n虽然 iPad 并不一定适用于所有的库存管理解决方案，但对于需要查看信息的用户，特别是需要大屏幕的用户，它是一个非常强大的平台。\n\n\
  ## 知识管理\n无论知识管理系统是用于培训还是偶尔参考，公司对它的投资都可以通过信息人员得到增强。\n\n## 营销\niPad 现在被许多营销、广告和品牌管理小组用作离的营销平台和渠道。就像\
  \ iPhone 应用为现有和潜在客户提供了强大的机制一样，iPad 正将这一趋势推向了新的高度。\n\n## 移动电子商务\n对于 B2B 和 B2C 应用，执行交易和获取新客户的能力是移动电子商务的强大功能。移动电子商务应用程序可以让客户访问带有产品信息和价格目录，以及产品配置或自定义工具。\n\
  \n## 报告\n大多数信息工作人员必须运行许多类型的报告以保持信息并有效完成工作。无论报告是静态的还是具有交互透视和钻取能力的动态，iPad 都是许多类型报告应用的强大形式。\n\
  \n## 销售力量自动化\n最广泛应用的 iPad 解决方案之一解决了销售力量自动化。与笔记本电脑不同，iPad 不会干扰一对一的交谈，并可以轻松用作通信工具和显示内容或信息的快速参考。\n\
  \n营销手册、演示文稿、视频和其他材料可以进行集中管理，并与每个销售人员的 iPad 同步，以便随时随地访问，而无需在销售组织中更新和分发纸质材料。\n\n\n\
  \n\n客户关系管理功能可以帮助销售人员访问客户、账户、联系人、潜在客户和线索信息。用户可以记录客户与潜在客户的互动，并同样轻松地调取过去互动和对话的历史记录。\n\
  \n在可能成为最强大的功能中，移动销售力量自动化系统还可以提供生成报价、估算交货日期、创建提案甚至捕捉订单的能力。这些销售交易可以传递给后端系统进行处理、履行和账单结算。\n\
  \n## 安全\n\n随着数字 IP 视频解决方案变得越来越普遍，从如 `iPad` 等移动设备访问实时或存档的安全视频录像的能力，可以作为现有安全系统投资的有力扩展。当发生特定类型的事件时，系统还可以向适当的员工发送警报。让安全人员和其他管理人员访问此功能，可以在许多不同的用场景中提供巨大的益处。\n\
  \n## 培训\n\n许多组织为员工提供在线学习和培训系统，将这些解决方案扩展到移动平台通常可以提供巨大的价值。视频和其他形式的动画或互动内容可以提升学习体验。测验和测试功能让用户能够快速评估自己的理解程度，也能让组织能够确保员工正在学习相关内容。\n\
  \n## 工作流自动化\n\n在许多组织中，已经建立了工作流自动化系统来简化业务流程，并让管理层能够批准或拒绝各种类型的请求。这些系统可以提供显著的投资回报，并让组织能够从任何地方管理员工。通过像\
  \ `iPad` 这样的设备，整体流程效率可以提高。\n\n## 组织应用程序\n\n在收集了一长串潜在应用程序后，在对它们进行优先级排序之前，将应用程序组织成不同的类别和用户组是非常重要的。原因之一是，很难权衡针对完全不同用户组的应用程序的相对优势。例如，如果你要将一个面向外部的品牌应用程序（供客户使用）与一个供管理层使用的面向内部的应用程序进行比较，将很难对它们进行适当的评估。虽然这两个应用程序可能都针对\
  \ `iPad`，提供类似的功能，并使用相同的技术进行开发，但它们的目的和价值主张可能是完全不同的。此外，这些应用程序中的每一个都可能由完全不同的预算和成本中心出资。\n\
  \n通过首先将应用程序组织为用户画像，就可以在该画像背景下对针对特定用户画像的应用进行优先级排序。独立地，可以根据该画像内应用程序的整体价值对用户画像进行评估、比较和优先级排序。通过对用户画像以及每个画像内的应用进行优先级排序，这可以极大地帮助为整体移动战略提供重点。\n\
  \n同样重要的是，不同用户画像之间的应用程序通常存在显著的重叠——有时在面向内部和外部的用户画像之间也会重叠。由于面向外部的应用程序通常由营销或品牌部门驱动，而面向内部的应用程序通常由\
  \ IT、销售或其他特定的运营小组驱动，因此通常不知道其他小组在做什么。由于面向内部和面向外部的应用程序都可以使用相同的工具和技术进行开发，因此协调这些工作并将它们纳入统一的移动战略中，对组织可以产生巨大的收益，如图\
  \ 4.1 所示。虽然这对于每个组织来说并不可行或合适，但它可以为大多数公司提供大幅的成本节省。\n\n图 4.1: 企业移动战略应同时涵盖面向内部和外部的用户画像及应用程序。\n\
  \n![4.1](img/c04f001.jpg)\n\n## 面向内部的应用程序\n\n对于面向内部的应用程序，理解背景和用户画像很重要。同一个应用程序为一个用户画像带来的业务效益可能比为另一个带来的多得多。\n\
  \n你可以从列出所有面向内部应用程序的不同类型的离散用户组开始。例如，你可能会识别出管理层、外勤销售、现场销售管理、财务、制造运营和物业管理。或者你可能会识别现场服务技术人员、送货司机和配送管理。你可能只有几个用户画像，也可能有几十个；这完全取决于你公司所属的行业、公司规模，以及你是在为整个公司还是某个特定部门或运营小组进行此工作。\n\
  \n在获得内部用户画像后，回过你识别的潜在应用程序完整列表，并将每个应用程序置于一个或多个面向内部的用户画像中。一个应用程序可能会出现在多个用户画像中，因此不要担心重复应用程序。这个过程通常可以激发其他思路和对潜在应用程序的新想法。就这么做吧，用潜在应用程序填充你的用户画像。不过，此时不要担心对应用程序进行优先级排序，因为那将在该过程的后期进行。\n\
  \n## 面向外部的应用程序\n\n与面向内部的应用程序一样，在面向外部应用程序的背景下识别不同的用户画像并对其进行细分以解决其需求是非常关重要的。\n\n例如，保险公司可能针对三个不同的用户画像拥有不同类型的应用程序：面向独立代理的销售工具、面向现有客户的保单自助服务，以及面向潜在客户的互动式营销应用。\n\
  \n医疗设备和制药公司可能有更多面向外部的用户画像，并可能开发针对特定用户群体（如医生、护士、医学生、医院管理员和患者）的不同应用程序功能。\n\n零售商可能有针对客户的面向外部应用程序，还有一个向供应商和其他业务合作伙伴分发应用程序的应用商店。\n\
  \n这种独立于面向内部用户组的面向外部用户组细分是非常重要的，因为其中某些应用程序由营销小组驱动和控制，而另一些将由 IT 或运营小组驱动。\n\n同样，与面向内部的应用程序一样，检查面向外部的用户画像并列出所有潜在应用程序。不要担心在不同的用户画像（内部或外部）之间重复使用应用程序。可能会某些应用程序适用于面向内部和面向外部的用户画像，即使内部和外部版本的特定功能有所不同，此时也不要担心这个问题。\n\
  \n## 评估和优先级排序应用\n\n一旦你与团队合作识别并组织了许多可能的应用程序想法，快速评估每个应用程序的潜在成本、收益和风险以有效地对其进行优先级排序就变得至关重要。\n\
  \n成本应包括应用程序的开发、购买或获取，以及与集成应用程序与后端系统相关的成本或人工成本。\n\n\n\n收益应包括硬性收益，如生产力或员工效率的提高以及成本的降低，以及软性收益，如员工满意度的提高。\n\
  \n确定风险时，应当同时考虑技术风险和业务风险。在技术方面，识别应用程序开发或与后端系统集成过程中的任何重大技术挑战至关重要。有时，一个移动应用程序在移动端背景下的开发可能非常简单，但要以正确暴露数据的方式与后端系统集成却非常困难。业务风险应包括有关部署、培训、流程变更和用户采纳的挑战。如果一个移动应用程序要求用户改变工作方式，那么其采纳成本将比不需要用户改变的类似系统更昂贵、更痛苦且更耗时。并不是说这种变化最终不符合用户和公司的利益，而是说促进这种变化往往很困难。\n\
  \n现在逐一查看内部和外部用户画像，并相对于该用户画像内的其他应用程序，对每个应用程序的成本、收益和风险进行排名。如何做这取决于你，但通常使用 1-5 分的分表来衡量每个标准比较简单。你可以从收益中减去成本来计算快速的相对价值分。任何得分为正都是良好的候选者，对于得数为负的应用程序，推迟其使用可能是合适的（尽管如果该应用程序在不同的画像中提供正分，它仍然可能为该用户画像提供价值，因为成本可以在另一个用户画像的背景下得到涵盖）。\n\
  \n取决于许多不同因素，包括你的性格和组织文化，如何将风险纳入相对价值分中取决于你。然而，无论你选择如何做，在用户画像内对每个应用程序进行排名以提供清晰的优先级排序是非常关重要的。\n\
  \n## 总结\n\niPad 的业务价值不在于设备本身，而在于在 iPad 提供的移动平台之上构建的应用程序。在制定企业移动战略时，请确保你已正确识别、组织并优先考虑路线图中的应用程序，以最大限度地提高组织内技术的投资回报潜力。\n\
  \n## 第二部分\n\n## 架构\n\n### 本部分内容\n- 第 5 章：决定自建还是购买\n- 第 6 章：评估潜在架构\n- 第 7 章：创建企业友好解决方案\n\
  - 第 8 章：暴露数据和网络服务\n\n## 第 5 章\n\n### 决定自建还是购买\n\n#### 本章包含哪些内容？\n- 自建与购买的影响是什么？\n\
  - App Store 中的某些类型应用程序\n- 如何对预构建应用程序使用内部部署\n- 我还能在哪里寻找可以购买的应用程序？\n- 应用程序集成的总成本\n\
  - 维护和长期总拥有成本\n\n随着你移动战略的完善，你将制定一个根据业务收益、总拥有成本和潜在风险进行优先级排序的潜在应用程序路线图。在那个时候，对于是自建还是购买你的企业解决方案做出正确的决定至关重要。\n\
  \n自建还是购买的决定将在初始部署后很长一段时间内影响你的组织。你的移动解决方案的长期总拥有成本也将受到自建或购买决定的极大影响。\n\n尽管如此，同样重要的是要认识到，大多数企业不会构建它们所有的应用程序，它们可能也不会购买所有的应用程序。大多数企业可能会采取定制构建系统和现成应用程序的组合，这些应用程序既可以独立运行，也可以与企业系统集成。\n\
  \n你的组织应该制定一套标准，以确定特定的应用程序应该是从市面上购买，还是开发为定制解决方案。首先，首要问题是该应用程序是否作为现成选项存在。如果是，它是否满足了大部分需求？此应用是否可以定制以满足业务需求，或者是否可以调整业务需求以利用该应用程序提供的功能？在考虑自建还是购买的决策过程中，必须检查这些以及许多其他问题。\n\
  \n### 寻找潜在的现成选项\n\n对于你考虑提供给用户的任何应用程序想法，总是建议查看市面上有什么现成的。即使你确信市售的应用程序无法满足你的特定需求，在\
  \ `App Store` 或从现有软件供应商处寻找类似的应用程序，也可以帮助你定义和开发任何定制构建解决方案的需求。\n\n#### App Store\n\n\
  `App Store` 拥有各种形状和大小的应用程序。根据商店的性质，这些应用程序大多数并非为企业使用设计的，而是为个人用户设计的。因此，商店中的大多数应用程序是独立应用，或与云服务集成。然而，有越来越多的应用程序被设计为开箱即用与现有的企业服务器产品集成，例如\
  \ `SharePlus`（它与 `SharePoint` 集成）或 `MicroStrategy Mobile`（它与现有的 `MicroStrategy`\
  \ 实现集成，以便通过移动访问商业智能）。某些应用程序还具有与服务器产品的预构建集成功能，该产品可以在企业环境中实施，并在不修改移动应用程序的情况下促进后端的集成（例如，用于文档管理的\
  \ `Cortado Corporate Server` 或用于交互式仪表板的 `Roambi ES3`）。\n\n截至本文写作时，企业还没有通过 `App Store`\
  \ 批量购买应用程序的方法。有一个计划——`App Store Volume Purchase Program`，允许教育机构进行批量购买，但不适用于公司。对于许多作为付费后端企业应用程序或服务器产品配套的免费\
  \ `iPad` 应用程序来说，这不是问题，但对于付费应用程序来说是一个问题。不过，有几种方法可以解决这个问题。公司可以为授权用户获取“礼物”应用程序。一些应用程序开发者允许公司创建应用程序的定制版本，然后通过公司的内部应用程序目录分发。或者，许多公司允许用户自行购买应用程序，并在某些情况下提供应用程序费用的报销。Apple\
  \ 因缺乏企业批量购买计划而受到批评，但人们希望这很快就会改变。\n\n阅读下列表 `App Store` 中可用的应用程序列表，有助于对企业内部可能实现的功能进行头脑风暴。无论某个应用程序是否适合你的组织，它都可以提供一个你的员工如何使用\
  \ `iPad` 的示例。\n\n### 文档管理\n\n由于大多数 `iPad` 工作人员需要处理各种类型的电子文档，以下许多应用程序可能是你用户的“刚需”。这些应用程序中的一些被设计为独立的文档查看器和编辑器，而另一些则设计为在企业服务器和移动设备之间提供文档管理和同步。\n\
  \n#### Pages\n\n`Pages` (图 5.1) 是 Apple iWork 套件中的核心应用程序。它将文字处理确立为移动市场的主流。几十种模板让移动办公成为可能。然而，`Pages`\
  \ 精简的功能通过简单直观的界面保持了较短的学习曲线。\n\n\n\n\nFigure 5.1: Pages 是一款功能齐全的文字处理应用，类似于 Microsoft\
  \ Word。\n\n![5.1](img/c05f001.jpg)\n\n## Keynote\n\n与 Microsoft PowerPoint 相比，Apple\
  \ 的 Keynote (Figure 5.2) 是一款用于创建、查看和进行演示文稿的强大应用程序。演示文稿可以在 iPad 上进行小范围的展示，也可以连接到投影仪进行大范围的展示。Keynote\
  \ 既可以打开也可以保存 PowerPoint 文件，因此可以在 Keynote 中创建销售演示，并通过电子邮件发送给客户，客户可能会在 PowerPoint\
  \ 中查看它。\n\nFigure 5.2: Keynote 是 iPad 上不可或缺的文稿应用。\n\n![5.2](img/c05f002.jpg)\n\n\
  ## QuickOffice Connect\n\nQuickOffice Connect Mobile Suite (Figure 5.3) 可以在移动设备上打开并编辑\
  \ Microsoft Office 文件（Word 和 Excel）。该套件对于需要在差旅途中管理 Microsoft Office 文件的商务专业人士特别有用。该应用赋予了用户创建和编辑\
  \ Word、Excel 和 PowerPoint 文档的能力。它还可以用于进行演示文稿。\n\nFigure 5.3: QuickOffice Connect\
  \ 可以在你的 iPad 上管理、创建和编辑业务文档。\n\n![5.3](img/c05f003.jpg)\n\n## GoodReader\n\nGoodReader\
  \ (Figure 5.4) 是一款流行的移动文档阅读器，允许你管理所有文档，包括 PDF、Office 和 iWork 格式。你还可以对文档进行注释——高亮、标记和绘图——并在服务器之间往返文件。\n\
  \nFigure 5.4: GoodReader 提供了对所有文档的便捷查看访问，并具备注释功能。\n\n![5.4](img/c05f004.jpg)\n\n\
  ## Cortado Workplace\n\nCortado Workplace (Figure 5.5) 允许你通过连接为云驱动器从 iPad 访问你的桌面电脑。该应用可以通过\
  \ Wi-Fi 在打印机上显示、编辑和打印文档，然后将其以 PDF 格式保存到中央 Cortado 服务器上。\n\nFigure 5.5: Cortado 企业服务器允许组织发布文档，用户可以从他们的\
  \ iPad 上访问、编辑和打印打印。\n\n![5.5](img/c05f005.jpg)\n\n## SharePlus Office\n\n对于在 Microsoft\
  \ SharePoint 上投入大量资金的组织，SharePlus Office 移动客户端 (Figure 5.6) 提供了丰富的原生用户体验，这种体验通过浏览器无法获得。该应用管理\
  \ SharePoint 数据，如文档、日历、任务列表和讨论板。它允许用户与其他第三方应用程序交换文档。\n\nFigure 5.6: SharePlus Office\
  \ 移动客户端允许用户在旅途中将文档和其他内容同步到他们的 iPad 上。\n\n![5.6](img/c05f006.jpg)\n\n## Workflow\
  \ 工作效率\n\n当你身在外时，仍然需要完成工作。无论是在担任公司董事会成员期间管理文档和通信、作为航空公司飞行员查询机场航楼楼信息、作为工程师查看三维 CAD\
  \ 图纸，还是作为评估师进行房屋检查，iPad 都能帮助你投入工作。以下是 App Store 中提供的许多应用中的几个，可以帮助信息工作者在移动时保持高效。\n\
  \n### Jeppesen Mobile TC\n\n航空公司飞行员可以使用 Jeppesen Mobile Terminal Charts (Figure\
  \ 5.7) 保持全球各地最新机场航楼信息的更新。此导航应用提供了全球机场的 IFR/VFR 图表、航楼平面图和手册。Jeppesen 还提供演示图表、收藏图表和推送通知。\n\
  \nFigure 5.7: Jeppesen Mobile TC 将关键信息带到飞行员的 iPad 上。\n\n![5.7](img/c05f007.jpg)\n\
  \n### BoardVantage\n\nBoardVantage Collaborate (Figure 5.8) 允许用户在董事会会议期间管理文档和通信。该应用允许用户与其他第三方应用程序交换文档。\n\
  \nFigure 5.8: BoardVantage Collaborate 允许用户在旅途中将文档和其他内容同步到他们的 iPad 上。\n\n![5.8](img/c05f008.jpg)\n\
  \n### Numbers\n\nNumbers (Figure 5.9) 是一款功能强大的电子表格应用，类似于 Microsoft Excel。你可以在 iPad\
  \ 上查看小组演示，或者连接投影仪进行大型演示。Keynote 既可以打开也可以保存 PowerPoint 文件，因此可以在 Keynote 中创建销售演示，并通过电子邮件发送给客户，客户可能会在\
  \ PowerPoint 中查看它。\n\nFigure 5.9: Numbers 提供了对所有文档的便捷查看访问，并具备注释功能。\n\n![5.9](img/c05f009.jpg)\n\
  \n\n\n\n\n# Roambi Visualizer\nRoambi Visualizer (图 5.13) 可与现有的商业智能系统配合，将报告和电子表格转换为安全的移动仪表板。该应用程序在\
  \ iPad 上运行，通过点击、旋转和滑动，为用户提供其最重要的业务指标的交互式视觉报告和图表。你可以访问、分析、管理、存储和共享你的数据。`Roambi ES3`\
  \ 是一款企业级服务器产品，为组织提供了与 iPad 应用的开箱即用集成。\n\n图 5.13: Roambi Visualizer 允许用户与其业务数据生成的图表、图形和报告进行交互。\n\
  \n![5.13](img/c05f013.jpg)\n\n# SAP BusinessObjects Explorer\nSAP BusinessObjects\
  \ Explorer (图 5.14) 是一款移动数据搜索和可视化应用程序。该应用程序具有简单的关键词搜索和导航功能，无论你使用 iPad 位于何处，都能访问所有的\
  \ SAP 信息。\n\n图 5.14: SAP BusinessObjects Explorer 为用户提供移动端信息访问，以便做出现场决策。\n\n![5.14](img/c05f014.jpg)\n\
  \n# MicroStrategy Mobile\nMicroStrategy Mobile (图 5.15) 是现有商业智能系统的移动扩展程序。通过 MicroStrategy\
  \ Mobile，用户可以在多控表格、图表、图形和地图中访问业务数据。通过连接 MicroStrategy Mobile 服务器，他们可以查看、编辑和共享交互式报告、文档和仪表板。\n\
  \n图 5.15: MicroStrategy Mobile 提供对数据、图表、图形和报告的实时访问。\n\n![5.15](img/c05f015.jpg)\n\
  \n# QlikView\nQlikView (图 5.16) 是一款商业智能应用，配有配套服务器产品，提供对公司绩效和业务指标的实时移动访问。QlikView\
  \ 服务器提供交互式分析和共享，并促进了后端系统的集成。\n\n图 5.16: QlikView 服务器向 QlikView iPad 应用程序提供实时业务智能数据，以便访问当前绩效和指标。\n\
  \n![5.16](img/c05f016.jpg)\n\n# PushBI Mobile\nPushBI Mobile 商业智能 (图 5.17) 是另一款使用现有商业智能技术并将你的关键业务数据转换为移动视觉化格式的应用程序。你可以访问业务的关键绩效指标，并在远程地点找到业务决策所需的信息。PushBI\
  \ 还提供了与 Microsoft SharePoint 的集成。\n\n图 5.17: PushBI Mobile 商业智能创建了 iPad 访问业务的关键绩效指标。\n\
  \n![5.17](img/c05f017.jpg)\n\n# Analytics HD\nAnalytics HD (图 5.18) 创建并共享带有 Google\
  \ Analytics 和 Adwords 数据的网络流量报告，包括流量量、访问时长、访问深度、访问者频率和访问者的地理位置。仪表板提供概览，大多数报告都有多个指标可用。当然，所有功能在\
  \ iPad 上都是移动端化的。\n\n图 5.18: 你可以使用 Analytics HD 跟踪网站访问者和 Google 广告活动。\n\n![5.18](img/c05f018.jpg)\n\
  \n# 知识管理\n无论你是试图捕捉想法，还是搜索之前脑风暴会议中的想法，iPad 都为知识管理解决方案提供了一个强大的平台。以下应用包含用于捕捉、处理、存储和搜索信息的某些热门应用程序。\n\
  \n## Evernote\nEvernote (图 5.19) 捕捉文本、截图和语音录音，并为文件标记地理位置信息。它可以帮助你存储任何你需要记住的东西。Evernote\
  \ 捕捉内容，然后将其从你的 iPad 同步到云端以及桌面。\n\n图 5.19: Evernote 捕捉文本、截图和语音录音。\n\n![5.19](img/c05f019.jpg)\n\
  \n## SketchBook Pro\nAutodesk SketchBook for iPad (图 5.20) 是一款专业级的绘画和绘图应用程序。它提供了一套完整的素描和绘画工具。\n\
  \n图 5.20: SketchBook Pro 可以创建高品质的素描。\n\n![5.20](img/c05f020.jpg)\n\n## OmniGraffle\n\
  OmniGraffle (图 5.21) 在 iPad 上创建流程图、图表和线框。多控手势帮助用户添加或更改现有线条。导入的数据可以用于创建图表。\n\n图 5.21:\
  \ OmniGraffle 创建流程图和线框。\n\n![5.21](img/c05f021.jpg)\n\n## Penultimate\nPenultimate\
  \ (图 5.22) 是一款允许用户记录笔记并共享的手写应用程序。它就像在纸上写字，但具有数字化的功能。\n\n图 5.22: Penultimate 创建手写笔记。\n\
  \n![5.22](img/c05f022.jpg)\n\n## OmniGraphSketcher\nOmniGraphSketcher (图 5.23) 是另一款在\
  \ iPad 上创建和展示手写图表的应用程序。导入的数据可以用于创建精确图表。\n\n图 5.23: OmniGraphSketcher 创建详细的图表和图形。\n\
  \n![5.23](img/c05f023.jpg)\n\n# 协作\n无论是共享文档和任务还是举行在线会议，iPad 都是随地协作的强大移动平台。以下是 App\
  \ Store 中用于 iPad 在线协作的一些热门应用。\n\n## Sorted\nSorted (图 5.25) 是一款任务管理应用程序，为每个任务分配了自定义优先级级别、截止日期和提醒。完成的任务可以通过滑动进行重复或删除。你可以根据优先级、截止日期或完成日期对任务进行排序。闹钟确保你不会忘记预约。\n\
  \n图 5.25: Sorted 应用程序按优先级、截止日期或完成日期安排任务。\n\n![5.25](img/c05f025.jpg)\n\n# WebEx\n\
  \n\n\n\n\n## WebEx\n\nWebEx (Figure 5.26) 是一款移动音频视频会议应用，允许用户通过 iPad 从远程位置参加在线会议。多个摄像头可以同时显示会议中的所有参与者。语音激活的视频切换功能突出显示当前正在说话的人。用户可以查看从任何电脑共享的文档，并进行实时标注。\n\
  \nFigure 5.26: WebEx 为您的 iPad 提供在线会议的音频视频会议。\n\n![5.26](img/c05f026.jpg)\n\n## Things\n\
  \nThings (Figure 5.27) 是另一款任务管理应用，旨在易用性与强大功能之间寻求平衡。它可以管理待办事项列表、截止日期以及笔记。“今天”列表和调度功能可以帮助用户按适当安排每日任务。\n\
  \nFigure 5.27: Things for iPad 是一款让您的“待办事项”列表触手可及的任务管理应用。\n\n![5.27](img/c05f027.jpg)\n\
  \n## Dropbox\n\nDropbox (Figure 5.28) 是一款用于在 iPad 上查看、保存和共享文件的 iPad 应用。它可以处理照片、视频、文档和演示文稿。共享文件可以通过电子邮件发送或与另一个应用程序关联。Dropbox\
  \ 还可以您的所有电脑之间同步文件。\n\nFigure 5.28: 您可以使用 Dropbox 查看、保存、共享和同步文件。\n\n![5.28](img/c05f028.jpg)\n\
  \n## 1Password\n\n1Password (Figure 5.29) 存储用户名、密码和网站地址，以便方便访问您的私人在线账户。iPad 的移动性让您能够在旅途中安全地携带所有敏感信息，并受到单个密码的保护。1Password\
  \ 会自动让您登录安全网站，而无需重新输入用户名或记住大量密码。\n\nFigure 5.29: 1Password 存储、记住并同步您所有的安全网站、用户名和密码。\n\
  \n![5.29](img/c05f029.jpg)\n\n## Fuze Meeting HD\n\nFuze Meeting HD (Figure 5.30)\
  \ 是一款在线会议应用，可以启动会议、邀请参与者并显示带有文档、图像、电影和演示文稿的会议信息。您可以指定任何参与者为演示者，以便他们向小组展示桌面，并且可以从\
  \ iPad 上静音或取消每个参与者的静音。\n\nFigure 5.30: 使用 Fuze Meeting HD 启动在线会议，添加或移除参与者，并听到每个人的声音。\n\
  \n![5.30](img/c05f030.jpg)\n\n## 医疗\n\n医疗行业一直被认为是移动技术的早期采用者，并且已经接受了 iPad。事实上，医疗应用非常多，以至于\
  \ Apple 在 App Store 中专门为它们提供了一个整个类别。这里只是医生、护士、医学生、医药销售代表以及医疗行业许多其他专业人士使用的数千个应用程序中的示例。\n\
  \n### Heart Pro\n\nHeart Pro (Figure 5.31) 是一款强大的应用，提供解剖学上准确的人心脏 3D 模型。用户可以在三个维度上进行旋转、旋转、切割和缩放，提供丰富的图形体验。医生和医学生可以使用此应用进行教育和参考，或者向患者说明难以解释的概念。\n\
  \nFigure 5.31: Heart Pro 为医疗保健专业人员和医学生提供了一个交互的人心脏 3-D 模型。\n\n![5.31](img/c05f031.jpg)\n\
  \n### Epic Canto\n\n作为电子医疗记录解决方案的领先供应商之一，Epic Systems 现在允许医生和其他护理人员通过 iPad 访问 Epic\
  \ Canto (Figure 5.32)。该应用让用户安全地访问诊日程和医院患者列表。\n\nFigure 5.32: Epic Canto 允许医生访问日程和患者列表。\n\
  \n![5.32](img/c05f032.jpg)\n\n### Astrip Monitoring\n\nAirstrip (Figure 5.33) 是一款专为临床医生设计的远程监控应用。它包含了体征、药物和过敏史。\n\
  \nFigure 5.33: Airstrip 允许医生远程监控患者状况。\n\n![5.33](img/c05f033.jpg)\n\n### Proloquo2Go\n\
  \nProloquo2Go (Figure 5.34) 是是一种为说话困难的人提供的辅助和替代语音解决方案。它提供自然的音频和可扩展的词汇。\n\nFigure\
  \ 5.34: Proloquo2Go 为语言困难者提供文本转语音。\n\n![5.34](img/c05f034.jpg)\n\n### iSpine Pain\
  \ Management\n\niPad 上的 iSpine Pain Management (Figure 5.35) 是一种提供颈椎和腰椎疼痛管理的教育工具。它包含了电影、笔记和医学影像。\n\
  \nFigure 5.35: iSpine Pain Management 提供关于颈椎和腰椎疼痛的教育。\n\n![5.35](img/c05f035.jpg)\n\
  \n### The Merck Manual\n\n《默克手册》专业版 (Figure 5.36) 是医疗保健专业人员随时访问医学信息的移动资源。内容被下载到\
  \ iPad 上，因此使用《默克手册》不需要连接网络。\n\nFigure 5.36: 《默克手册》是一个可搜索的移动手册。\n\n![5.36](img/c05f036.jpg)\n\
  \n## 法律\n\niPad 改变了律师在不在办公桌前的工作效率。在任何地方搜索文档、案例历史和法律检索数据库的能力正在改变律师的工作方式。\n\n### WestlawNext\n\
  \nWestlawNext (Figure 5.37) 让用户能够通过 iPad 检索法律问题并搜索文档。可以在应用程序内对文档进行排序、组织和注释，并可以选择内容连同相应的参考文献通过电子邮件发送。\n\
  \nFigure 5.37: WestlawNext 为律师提供了可在 iPad 上访问的法律检索系统。\n\n![5.37](img/c05f037.jpg)\n\
