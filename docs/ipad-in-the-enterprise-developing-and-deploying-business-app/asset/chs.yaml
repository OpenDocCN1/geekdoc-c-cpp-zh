  \ { get; set; }\n        public string OfficePhone { get; set; }\n        public\
  \ string MobilePhone { get; set; }\n    }\n}\n```\n\n这实际上是上一章中示例中用于调用此处所实现的 Web\
  \ 服务的同一组数据类。\n\n## 总结\n\n\n\n在本章中，你深入研究了创建 RESTful Web 服务的细节。你从讨论为你的环境选择最佳技术栈开始，审视了\
  \ Java 和 .NET。\n\n本章涵盖了 REST 面向资源的本质，以相对于以过程为中心的 RPC 风格 SOAP。此外，还涵盖了保持服务和数据轻量化的重要性、RESTful\
  \ 服务资源端点命名规范的最佳实践，以及其他考虑因素和最佳实践。\n\n最后，本章提供了一些 RESTful Web 服务示例，这些服务被第 13 章和第 14\
  \ 章中的 iPad 应用示例所调用。\n\n在下一章中，你将研究开发 iPad 应用时安全性的重要性，包括 iOS 攻击向量以及确保企业应用安全性一致的最佳实践。\n\
  \n### 第 16 章：确保应用与数据安全\n\n### 本章内容\n\n- 保护 iOS 应用沙盒安全\n- 保护传输中数据和静态存储中的数据\n- 识别潜在的安全“陷阱”（gotchas）\n\
  - 既定的行业最佳实践\n- 如何审计内部和商业类 iOS 应用\n- 为 iOS 应用安全创建企业标准\n\n现在你已经很好地了解了如何为 iPad 开发应用程序，那么理解如何保护你的应用程序（包括其中包含的数据和功能）就非常重要。尽管对于大多数企业\
  \ IT 和安全部门来说，iOS 是一个相对新的平台，但在过去的几个版本和迭代中，它已经相当成熟并发展。因此，有许多复杂的技术可以显著增强应用级安全，远超任何应用于设备级的安全。对于那些负责开发和安全的人来说，理解这些概念至关重要。\n\
  \n在本章中，我们将讨论沙盒安全模型的理念，以及如何通过拥抱沙盒概念来最大化提高安全性，而不是仅仅依赖传统的设备级安全理念。我们将讨论如何在应用级别实现身份验证和授权，与后端数据源进行安全通信，以及在部署前建立审计应用程序的正式流程。\n\
  \n## 理解沙盒安全模型\n\n思考移动安全有两种方式。你可以从设备级考虑安全性，也可以从应用级级考虑安全性。虽然许多传统的企业移动性重点关注设备本身的安全，但并不是当今所有安全工作都应该关注的地方。当然，这并不意味着你不应该尝试在设备级实现安全，但请记住，这并不总是可能的。如果你需要为客户或业务伙伴开发安全的应用程序，你必须确保在应用级别实现所有适当的安全措施，因为你对设备级安全没有控制权。\n\
  \n此外，由于 iOS 现在变得如此流行，黑客对该平台的关注日益增加。结合许多与越狱设备（jailbreaking）设备相关的已知漏洞（这些漏洞可以获得对设备文件系统中任何未加密数据的完全访问权限），保护整个\
  \ iOS 设备的挑战就变得几乎令人无所措。\n\n## 注意\n\n越狱（Jailbreaking）是一个解锁 iOS 设备以获得对操作系统的完全访问权限并绕过苹果对平台进行限制的过程。\n\
  \n然而，通过保护应用沙盒的方法，即使设备被攻破，你的数据和功能仍然受到保护。这减轻了部分保持设备本身完全安全的压力，因为在许多方面，那些潜在的漏洞完全在你的控制之外。但是，应用沙盒完全在你的控制范围内，你可以实施尽可能多的安全层。\n\
  \n## 保护沙盒\n\n在保护应用沙盒时，必须处理三个三个领域：以提供沙盒访问为中心的身份验证与授权、设备与服务器之间往来传输数据的通信安全，以及物理持久化在设备本身上的任何数据的存储安全。\n\
  \n### 访问与授权\n\n如果你的应用程序包含任何专有内容、数据或功能，你应该始终保护你的应用。当然，如果你的应用程序包含公开的营销内容或也许是每日食堂菜单，那么可能不需要保护该应用程序，但大多数情况下，绝大多数企业应用都应该实现身份验证机制。\n\
  \n许多习惯在以 Windows 为中心的企业环境中创建企业应用的开发者，可能不习惯于实现这些身份验证机制，因为 `Active Directory` 通常用于自动验证从其\
  \ PC 登录域的用户。但在 iOS 上，并没有这种开箱即用的功能来实现应用级身份验证。开发者有责任实现他们自己的身份验证机制。\n\n在第 14 章中，我们讨论了用于各种工具和服务的共享企业库的概念。身份验证机制是一个可以且应该在多个应用程序之间共享的极佳示例。此外，共享的身份验证库可以用于创建单点登录（SSO）机制，这样用户在不同的内部企业应用之间导航时，不需要每次都提示进行身份验证。除了改善用户体验外，这还可以帮助简化分布式开发组之间内部\
  \ iOS 应用的开发，使他们不需要重复实现相同的身份验证机制。\n\n这可以使用名为 `keychain access groups`（钥匙串访问组）的概念来促进，由同一个开发者账户创建并签名的多个应用程序可以共享对钥匙串项的访问。身份验证机制最初可以提示用户输入用户名和密码，这些密码可以针对后端的\
  \ `Active Directory`、`Lightweight Directory Access Protocol (LDAP)`或其他机制进行验证，并返回一个可以存储在共享钥匙串项中的令牌。当用户在应用程序之间切换时，每个应用最初都会向后端身份验证提供者验证令牌。首先，重要的是知道令牌仍然有效（例如，你可以根据公司策略和数据的敏感性，将身份验证提供者配置为\
  \ 30 秒、30 分钟、3 小时、3 天甚至 30 天的超时时间）。如果令牌有效，应用程序已经通过了身份验证，并将为用户提供无缝体验。然而，如果令牌已过期，系统会提示用户保存用户名和密码。\n\
  \n从安全角度来看，通常希望使用一组替代凭据进行身份验证，而不仅仅是用户的主要网络凭据。因此，移动身份验证也可以通过移动特定的用户凭据，或者通过使用 `Security\
  \ Assertion Markup Language (SAML)` 或 `OpenID` 等协议与外部身份提供者进行联合来实现。\n\n\n\n\n从可用性的角度来看，输入包含字母和数字的用户名和密码并不总是理想的，因此如果场景的安全性敏感性允许替代登录机制，可以使用数字\
  \ PIN 甚至随机图形图案识别机制作为替代方案。此外，如果希望在应用程序本身与后端服务器之间、除用户提供的凭据之外增加额外的身份验证层，RSA 提供了一款适用于\
  \ iOS 的 SecurID 软件开发包（SDK），允许在应用程序内部生成软令牌。\n\n## 通信安全\n\n一旦用户通过身份验证并授权使用应用程序，确保通过网络传输的任何数据都经过安全加密至关重要。实现这一点的最简单且常用的方法是对所有与后端数据源的通信都使用\
  \ `HTTPS` 和 `Secure Socket Layer (SSL)`。通过依赖受信任的根证书颁发机构颁发的证书，你可以确保应用程序正在直接与服务器进行安全通信，并且没有中间截获数据。\n\
  \n遗憾的是，当开发者在代码中重写证书验证检查时，`HTTPS` 和 `SSL` 提供的保护往往会在不经意间被消除。开发和测试服务器环境通常最初是用自签名证书创建的，直到生产环境收到来自受信任根证书颁发机构的证书。因此，开发者可能会在应用程序中收到错误，为了解决这个问题，他们可能会简单地重写验证检查。如果这种重写在应用程序上线之前没有删除，应用程序将很容易受到中间人攻击，即使它现在正在与一个具有受信任根证书颁发机构签名证书的生产服务器通信。\n\
  \n中间人攻击发生在攻击者可以截获 `HTTPS` 流量并对通信进行代理，导致受害者认为他们仍在相互通信，而实际上通信安全已经被破坏。中间人代理随后将向移动应用程序客户端提供一个自签名证书，如果应用程序代码中已经重写了验证检查，程序将继续进行握手和传输，并使所有传输的数据处于风险之中。\n\
  \n这应该通过确保开发和测试环境也使用受信任根证书颁发机构签名的 `SSL` 证书来解决，并应对应用程序代码进行审计，以确保没有实现 `SSL` 验证重写。遵循最佳实践时，`SSL`\
  \ 和 `HTTPS` 可以非常安全，但确保应用程序不要重写这些内置的安全机制至关重要。\n\n作为 `HTTPS` 和 `SSL` 的替代方案，还可以使用虚拟专用网络（VPN）通过支持\
  \ `IPSec`、`L2TP` 或 `PPTP` 来确保与后端系统的通信安全。此外，App Store 中还有来自 Juniper、Cisco 和 F5 的基于\
  \ `SSL` 的 VPN 客户端。\n\niOS 的一个价值的 VPN 相关功能是按需 VPN（VPN on Demand）。当使用基于证书的身份验证配置时，当应用程序尝试访问定义的域名时，iOS\
  \ 会自动连接到 VPN。这有助于大幅提高 iOS 应用基于 VPN 的通信信道的可用性，使用户无需负责适地连接和断开 VPN。\n\n然而，使用 VPN 会增加性能开销，并可能暴露某些安全漏洞。`VPN`\
  \ 可以访问该私有网络上暴露的所有网络资源，第三方应用程序也可以通过 VPN 连接进行通信。因此，对网络进行适当划分以仅允许适当的流量通过 VPN 是重要的。\n\
  \n如果需要或想要额外的通信安全，还可以创建一种“双层封”安全性，即可以在 `VPN` 内部使用 `HTTPS` 和 `SSL`，或者在 `HTTPS` 请求/响应中使用诸如\
  \ `AES256` 的算法对通信数据进行手动加密。\n\n## 静态数据安全\n\n一旦你确保了用户已通过身份验证且所有移动数据都在安全传输，沙箱安全的最后一个方面就是确保任何静态数据在物理存储时被妥善加密。\n\
  \nApple 两个非常强大的功能：`keychain` 和 `iOS Data Protection`。`keychain` 是一个用于数字身份、用户名、密码、令牌和其他敏感项的安全加密存储器。`keychain`\
  \ 项目是分区域的，使得它们只能从创建它们的应用程序进行访问，但正如在讨论单点登录（SSO）机制时提到的，使用相同开发者账户签名的应用程序可以共享 `keychain`\
  \ 项目。这些共享的 `keychain` 项目是企业内部套件中跨应用程序访问的唯一可编辑持久化存储器，因为文件系统在每个应用程序沙箱内是完全隔离的。\n\n\
  `Data Protection APIs` 利用用户的唯一设备密码，配合设备级硬件加密来生成一个非常强大的加密密钥。因此，应用程序只有在用户解锁设备时，才能访问\
  \ `Data Protection` 下的文件或 `keychain` 项目。如果设备被自动锁定或被用户锁定，应用程序将失去对该数据的访问权限。\n\n如果你希望在\
  \ `Data Protection APIs` 之上提供额外的安全层，你可以始终使用基于软件的加密算法加密任何数据。`Objective-C` 和 C# `.NET`\
  \ 都有许多不同的库可用。由于 `MonoTouch` 也暴露了 `.NET Crypto` 库，在 C# `.NET` 中开发的数据加密代码对其他平台也具有极强的移植性。\n\
  \n## 遵循安全最佳实践\n\n意识到有关应用程序安全的各种 iOS 相关最佳实践是重要的。在本节中，你将查看一些推荐最佳实践的细节，以及你应该警惕的潜在“坑”（gotchas）。\n\
  \n### 利用 Keychain\n\n首先，每当你需要存储任何敏感信息（如用户名、密码、令牌或其他身份相关信息和凭据）时，都应该使用 `keychain`。同样记住，`keychain`\
  \ 是允许在一组应用程序之间共享数据的唯一机制。例如，Apple 中的一个开发组可能具有 ID：\n\n```\n 951A5313EF25.com.acmecorp\n\
  ```\n\n其两个应用程序的应用程序标识符可能是：\n\n```\n951A5313EF25.com.acmecorp.sales\n951A5313EF25.com.acmecorp.service\n\
  ```\n\n两个应用程序都可以添加一个 `keychain-access-groups` 权限，并在访问组数组中包含一个值：\n\n```\n 951A5313EF25.com.acmecorp.sso\n\
  ```\n\n然后两个应用程序都能够在共享空间内创建并访问 keychain 项目。\n\n这可以通过 Objective-C 完成：\n\n```objectivec\n\
  \ OSStatus status = SecKeychainAddGenericPassword(NULL,         \n             \
  \                    strlen([serviceName UTF8String]),\n                       \
  \          [serviceName UTF8String],\n                                 strlen([username\
  \ UTF8String]), \n                                 [username UTF8String],\n    \
  \                             strlen([password UTF8String]),\n                 \
  \                [password UTF8String],\n                                 NULL);\n\
  ```\n\n也可以用 C# 完成：\n\n\n\n\n\n```\n SecStatusCode status = SecKeyChain.Add ( new\
  \ SecRecord ( \n         SecKind.GenericPassword ) {\n                         \
  \   Service = serviceName,\n                            Account = username,\n  \
  \                          Generic = NSData.FromString(password, \n            \
  \                NSStringEncoding.UTF8,\n         Accessible = SecAccessible.WhenUnlocked\
  \ )\n} );\n```\n\n关于钥匙和跨应用程序共享项的更多信息，可以参阅 Apple 的《Keychain Services Programming\
  \ Guide》。\n\n### 使用 iOS 数据保护\n\n如上所述，在将数据保存到持久性存储时，应当使用 iOS Data Protection API。你可以使用\
  \ Data Protection API 直接将启用文件保护的数据保存到文件系统，也可以修改文件系统中的现有文件以添加或删除 Data Protection\
  \ 属性。\n\n要将启用保护的 `NSData` 对象保存到文件中，以下是 Objective-C 代码：\n\n```objc\n [secureData\
  \ writeToFile:file options:NSDataWritingFileProtectionComplete\n       error: &error];\n\
  ```\n\n以下是 C# 代码：\n\n```csharp\n secureData.Save(file, NSDataWritingOptions.FileProtectionComplete,\
  \ out error)\n```\n\n使用 Objective-C 为文件系统中的现有文件启用 Data Protection：\n\n```objc\n\
  \ NSDictionary *fileAttributes = \n [NSDictionary dictionaryWithObject:NSFileProtectionComplete\
  \ \nforKey:NSFileProtectionKey];\n[[NSFileManager defaultManager] setAttributes:fileAttributes\
  \ \nofItemAtPath:filePath error:&error]; \n```\n\n使用 C# 为文件系统中的现有文件启用 Data Protection：\n\
  \n```csharp\n NSDictionary fileAttributes = new NSDictionary();\nfileAttributes.SetObject\
  \ (“NSFileProtectionComplete”, “NSFileProtectionKey”);\nNSFileManager.DefaultManager.SetAttributes\
  \ (filePath, fileAttributes, out \nerror);\n```\n\n受数据保护的文件仅在设备解锁时才可访问。运行数据保护代码的\
  \ App 需要处理在 App 运行时设备变为锁定的情况。因此，你可能希望知道何时即将失去文件的访问权限，以及何时能够再次访问它们。\n\n在 Objective-C\
  \ 中接收这些通知：\n\n```objc\n - (void)applicationProtectedDataWillBecomeUnavailable:(UIApplication\
  \ \n*)application\n{\n    //释放对受保护文件的引用\n}\n\n- (void)applicationProtectedDataDidBecomeAvailable:(UIApplication\
  \ *)application\n{\n    // 你现在可以保存任何需要保护的内容\n    // 你现在可以查询任何受保护的内容\n}\n```\n\n\
  在 C# 中接收通知：\n\n```csharp\n public override void ProtectedDataWillBecomeUnavailable\
  \ (UIApplication \napplication)\n{\n    //释放对受保护文件的引用\n}\n\npublic override void\
  \ ProtectedDataDidBecomeAvailable (UIApplication \napplication)\n{\n    // 你现在可以保存任何需要保护的内容\n\
  \    // 你现在可以查询任何受保护的内容\n}\n```\n\n如果你的应用程序在锁定状态下尝试访问受数据保护的文件，它将接收到一个异常。\n\n####\
  \ 安全设计自定义 URI Scheme\n\n在第 14 章中，我们讨论了如何使用自定义 URI Scheme 创建一组应用程序，允许跨 App 的深度链接（deep-linking）。这些自定义\
  \ URI Scheme 可以通过对应用程序二进制文件的静态文件分析轻松发现，因此在设计你的自定义 URI 导航方案时，应该假设它们是公开的。换句话说，不要试图隐藏深度链接功能，因为它们很可能会被发现。因此，虽然深度链接对于导航和工作流效果非常好，但它不应用于事务处理（例如更新数据或删除记录），至少在没有向用户提供清晰直观的消息并请求用户授权的情况下。第三方攻击者可以利用对你自定义\
  \ URI 导航方案的知识来执行复杂的钓鱼攻击，甚至可以将自定义 URI Scheme 的链接嵌入到用户在 Safari 中查看的网页的 `<iframe>`\
  \ 标签中，这这将自动启动应用程序并导航到该 URI。\n\n因此，你不应该设计可以执行此类操作的 URI Scheme：\n\n```text\n acmesales://customer/delete/12345\n\
  acmeservice://updateworkorder/status=complete\nacmehealth://patient/6789/setdiagnosiscode=abc123\n\
  acmeoperations://equipment/shutdown/device=456\n```\n\n应当考虑如果攻击者能够仅通过链接到应用程序来更新或删除数据会发生什么，无论该应用程序是使用单点登录（SSO）机制进行了预验证，还是提示用户进行身份验证。用户很可能会继续并成功通过身份验证，因为该用户正在查看他或她应该验证的实际应用程序。用户并的是验证后会发生什么。如果攻击者仅通过链接到应用程序而无需任何用户输入即可更新或删除数据，那么该应用程序就处于风险之中，无论它是使用单点登录机制进行了预验证，还是即使提示用户进行身份验证。在这种情况下，在没有用户确认的情况下，用户可能察觉不到任何潜在风险，并错误地认为通过身份验证意味着应用程序是安全的。\n\
  \n你应该确保仔细解析任何传入的 URI 请求，并在确认任何操作之前提示用户。此外，从 iOS 4.2 开始，Apple 弃用了以前接收传入 URI 的方法，并添加了带有源应用程序（Source\
  \ Application）和注释（Annotation）的新方法：\n\n```objc\n - (BOOL)application:(UIApplication\
  \ *)application openURL:(NSURL *)url\n    sourceApplication:(NSString *)sourceApplication\
  \ annotation:(id)annotation\n{\n    // sourceApplication 是否是可靠且安全的源？\n    // 如果是，解析\
  \ url 并验证\n    // 如果是事务性的，请求用户授权\n    // 如果已授权，进行相应的导航\n}\n```\n\n这是 C# 中的实现：\n\n\
  ```csharp\n public override void OpenUrl (UIApplication application, \nMonoTouch.Foundation.NSUrl\
  \ url, \n    string sourceApplication, MonoTouch.Foundation.NSObject annotation)\n\
  {\n    // sourceApplication 是否是可靠且安全的源？\n    // 如果是，解析 url 并验证\n    // 如果是事务性的，请求用户授权\n\
  \    // 如果已授权，进行相应的导航\n}\n```\n\n但记住，某些未进行适当验证的 App 可能只是尝试在其自定义 URI Scheme 之后导航到相对\
  \ URL。这可能会触发级联导航，“双重链接”，攻击者可以使用通过其他应用程序（你可能允许从中链接的 App）进行重定向，最终通过批准的 App 导航到你的 App。这是一个级联导航的示例：\n\
  \n```text\n otherapp://acmecorpapp://do/something\n```\n\n因此，审计所有你允许传入连接的应用程序是非常重要的，以确保它们不允许这种动态重定向，这种重定向可能会被攻击者利用。如果你在第三方应用程序中发现这种情况，而你又希望使用它们跳转到你内部的应用程序，你应该与第三方开发者就这些问题进行通信，以便在你的环境中实施之前解决这些问题。\n\
  \n### 不要重写 HTTPS 证书验证\n\n正如本章早期部分讨论的，HTTPS 和 SSL 提供了极其安全的通信通道，但遗憾的是，开发者在开发和测试期间经常重写证书验证检查。如果这些重写在部署和生产使用之前没有删除，那么应用程序将受到中间人攻击，导致数据被截获和安全受损，包括用户身份验证凭据被捕获。\n\
  \n\n\n\n\n下面的代码片段是这些覆盖操作的示例。你不应该在应用程序中使用这些代码片段。在这里列出它们仅是为了让你审查代码，对你的应用程序开发工作进行审计，以确保你的\
  \ `HTTPS` 和 `SSL` 通信通道保持安全。\n\n你不应该使用类似下面的 Objective-C 代码：\n\n```objc\n - (BOOL)connection:(NSURLConnection\
  \ *)connection\ncanAuthenticateAgainstProtectionSpace:(NSURLProtectionSpace *)protectionSpace\n\
  {\n    return [protectionSpace.authenticationMethod\n        isEqualToString:NSURLAuthenticationMethodServerTrust];\n\
  }\n\n- (void)connection:(NSURLConnection *)connection\ndidReceiveAuthenticationChallenge:(NSURLAuthenticationChallenge\
  \ *)challenge\n{\n    [challenge.sender useCredential:[NSURLCredential\n       \
  \ credentialForTrust:challenge.protectionSpace.serverTrust]\n        forAuthenticationChallenge:challenge];\n\
  }\n```\n\n你不应该使用类似下面的 C# 代码：\n\n```csharp\n public override void CanAuthenticateAgainstProtectionSpace\
  \ (NSUrlConnection \nconnection,\n    NSUrlProtectionSpace protectionSpace) \n{\n\
  \    return protectionSpace.AuthenticationMethod == \n           protectionSpace.ServerTrust;\n\
  }\n\npublic override void ReceivedAuthenticationChallenge (NSUrlConnection \nconnection,\n\
  \    NSUrlAuthenticationChallenge challenge) \n{\n    challenge.Sender.UseCredentials(challenge.ProtectionSpace.ServerTrust,\
  \ \n              challenge);\n}\n```\n\n以下方法是 Apple 的私有 API。虽然 Apple 不允许使用此方法的应用程序进入\
  \ App Store，但创建内部企业级应用的开发者可能会倾向于使用它。\n\n你不应该使用此 Objective-C 私有 API 方法调用：\n\n```objc\n\
  \ setAllowsAnyHTTPSCertificate:forHost:\n```\n\n由于 `MonoTouch` 不提供 Apple 私有 API\
  \ 的 C# 绑定，上述调用仅在 Objective-C 代码中存在问题。另一方面，如果使用 C# `.NET` 进行开发，特别是当在开发代码时考虑了可移植性，网络访问可能会使用\
  \ `.System.Net` 命名空间以及如 `HttpWebRequest` 类，而不是 Apple 的 `NSURLConnection`。在这种情况下，可以通过以下代码实现\
  \ `.NET` 栈的 `SSL` 覆盖。\n\n你不应该使用这段 C# 代码：\n\n```csharp\n ServicePointManager.ServerCertificateValidationCallback\
  \ = \n    delegate(Object obj, X509Certificate certificate, X509Chain chain,\n \
  \       SslPolicyErrors errors) { return true; };\n```\n\n最后，由于开发者可能有其他方法来覆盖证书验证检查，因此作为应用程序测试的一部分尝试中间人攻击始终是一个好主意，以确保应用程序做出响应，并且允许在可能受损的通道上进行通信。\n\
  \n### 推送通知并不安全\n\nApple 推送服务 (`APNs`) 为应用程序开发者提供了一个集中且共享的机制，用于触发用户警报，用户在确认后可以自动启动并深度链接到自定义应用程序。\n\
  \n然而，推送通知是不安全的。它们不仅在设备锁定时也可见可见，而且由于所有推送通知都通过 Apple 的 `APNs` 基础设施中继，Apple 能够以明文查看这些消息，取决于敏感数据的类型，向第三方披露此类信息可能会产生法律后果。\n\
  \n此外，推送通知的传递是不保证的。Apple 文档在显示推送通知时提醒，此类通知的传递是基于“尽力而为”的原则。\n\n因此，推送通知应仅作为工作流的增强，而不能作为工作流的关键部分。如果需要提供有关某种安全数据的通知，推送通知应仅包含一条关于警报的通用消息。一旦用户确认并启动应用程序，他们可以在应用程序的安全沙箱内查看递送的消息。\n\
  \n### 防止屏幕缓存\n\n每当用户按下 iOS 设备上的 Home 键，或点击触发导航到不同应用程序的链接时，iOS 都会截一张屏并将其保存到文件系统中应用程序的文件夹中。如果设备丢失或被盗并在随后被越狱，就可以访问文件系统来查看这些自动缓存的截图。\n\
  \n幸运的是，有一种极其简单的变通方法防止关键数据保存到缓存中。基本上，你可以在截图和动画发生之前立即将屏幕用户界面清空并在应用程序重新启动后重新显示。\n\n\
  在 Objective-C 中代码看起来如下：\n\n```objc\n - (void)applicationDidEnterBackground:(UIApplication\
  \ *)application {\n    window.hidden = YES; \n}\n\n- (void) applicationWillEnterForeground:(UIApplication\
  \ *)application {\n    window.hidden = NO; \n}\n```\n\n在 C# 中代码看起来如下：\n\n```csharp\n\
  \ public override void DidEnterBackground (UIApplication application) {\n    window.Hidden\
  \ = true;\n}\n\npublic override void WillEnterForeground (UIApplication application)\
  \ {\n    window.Hidden = false;\n}\n```\n\n如果你不喜欢关闭或切换应用时显示空屏的用户体验，你可以选择显示启动屏而不是仅仅清空屏幕。\n\
  \n### 警惕应用内钓鱼攻击\n\n如果你的应用程序使用 `UIWebView`，你可以添加安全检查和平衡，以确保你的用户不会特别受到钓鱼攻击。由于许多应用程序使用嵌入浏览器（无论是为了混合应用功能，还是为了在留在应用程序的同时查看网页内容），确保用户没有被拦截并导航到远程网站是非常关重要的。虽然像\
  \ `Safari` 这样的浏览器会显示地址栏，但如果用户看到正在查看奇怪的内容（例如在 IP 地址而不是域名处查看请求安全信息的表单），他们应该注意到。但如果应用程序不显示当前\
  \ URL，用户很容易被欺骗去遵循钓鱼攻击。\n\n安全的替代方案是，如果嵌入 `UIWebView` 用于浏览，则显示 URL。如果它仅作为混合应用程序使用，可以编程配置为仅允许连接到预定义的域名，从而防止连接器被劫持。\n\
  \n### 确保安全数据不输出到日志\n\n在应用程序的广泛测试期间，你以及 IT 部门负责安全的人应该监控控制台日志，以确保安全数据没有被记录。可以通过 `Xcode`\
  \ 或 iPhone 配置工具查看日志。如果你在日志中发现了安全信息，请确保在应用程序进入生产环境之前删除日志代码。\n\n### 审计你的应用程序\n\n现在我们已经讨论了应用程序级安全的基本概念、行业最佳实践和潜在的“陷阱”，在将应用程序部署给用户之前，确保应用程序是安全的。为了达到这种安全水平，IT\
  \ 组织应该在部署之前为应用程序建立安全审计流程。这对于内部应用程序以及通过 App Store 或外部开发者提供的（并将通过企业级部署模型分发）的第三方应用程序来说都是非常重要的。\n\
  \n## 内部应用程序\n\n对于内部开发的应用程序，审计会更直接一些，因为你可以访问源代码。你应该审查应用程序的功能以及源代码，以确保不存在显而易见的问题：\n\
  \n*   确保凭据存储在钥匙链中。\n\n\n\n\n\n* 确保使用数据保护（Data Protection）存储安全数据。\n* 扫描代码以是否存在 HTTPS\
  \ 和 SSL 验证覆盖。\n* 确保自定义 URI 字符串经过验证和授权。\n* 确保在缓存屏幕截图之前对敏感数据进行脱敏处理。\n\n## 商业应用\n\n\
  通过 App Store 分发的应用程序是经过加密的，但网上有详细记录如何对这些应用程序进行解密分析。一旦解密，就可以查看应用程序二进制文件和辅助资源文件，并可以使用\
  \ `grep`（一种命令行文本搜索工具）在应用程序内容中搜索未记录的自定义 URI 方案事务、硬编码密码、凭据、`URLs` 以及其他类型的信息。\n\n你还应该确保，任何计划允许从自定义\
  \ URI 导航到你内部应用程序的商业应用程序，都不易受到 URI 中继和重定向的影响。\n\n## 所有 iOS 应用\n\n对于所有应用程序（无论是内部开发还是第三方开发），你都应该在标准的\
  \ iOS 应用安全审计中包含以下技术：\n\n* 尝试进行中间人攻击并确保行为正常。\n* 确保安全数据不会被记录到控制台。\n* 使用 `grep` 搜索静态字符串/凭据/密钥/URL。\n\
  * 确保已建立防止应用内钓鱼的机制。\n* 对运行应用的设备进行越狱并监控文件系统。\n* 确保自定义 URI 方案经过适当验证。\n* 通过代理监控网络流量以发现不当传输。\n\
  \n## 建立企业标准\n\n随着 iPad 越来越普及，企业级应用的需求无疑会爆发。即使你的组织开发分布在多个小组或部门，建立确保 iOS 应用安全的标准和程序也是至关重要的。\n\
  \n考虑到 iOS 开发者可用的工具，可以开发出极其安全的应用程序，但确保这种级别的安全性需要对 iOS 平台日益复杂的攻击有一定的认识。除了提高所有 iOS\
  \ 开发者对这些安全最佳实践的意识外，你的企业 IT 安全团队应该开发内部能力，以理解潜在风险及其解决方案。\n\n## 总结\n\n在本章中，你了解了应用沙箱安全的基本概念，包括通过身份验证和授权确保适当的访问控制；通过加密传输数据确保通信安全；以及通过加密任何持久化数据确保存储安全。我们还研究了许多行业最佳实践和“陷阱”，以及在部署应用程序之前进行安全审计的重要性。\n\
  \n我确定你的组织对安全问题非常敏感，但你们在内部是否准备好处理这些主题了？如果这些设备要在组织内部部署，企业 IT 培养 iOS 安全能力是非常关重要的。\n\
  \n本章结束了关于开发的章节。在下一节中，我们将查看部署流程，从规划 iPad 部署的章节开始。\n\n## 第五部分：部署\n\n### 本部分内容\n* 第\
  \ 17 章：部署规划\n* 第 18 章：设备的置备与配置\n* 第 19 章：通过空中部署应用程序\n* 第 20 章：部署的管理与安全保障\n\n###\
  \ 第 17 章：部署规划\n\n### 本章内容简介？\n\n* 决定设备配置的最佳方法\n* 如何管理硬件采购流程\n* 利用现有的硬件配件\n* 为部署的物流工作做准备\n\
  * 规划用户支持和自服务\n\n尽管此书在最后几章中已经涵盖了“部署”，但许多组织在设计和开发任何应用程序之前，实际上会先推出设备和移动设备管理解决方案。\n\n\
  因此，这最后四章可能是许多负责支持企业内部 iPad 部署的读者需要需要消化的前几章。本章将介绍规划的策略和最佳实践，还将涵盖在准备 iPad 部署时应该考虑的许多问题。\n\
  \n首先，我们将检查你可以采取的不同部署方案，可以采用个人用户自服务方法，也可以采用集中置备方法（即设备在交付给用户时已预先配置并开箱即用）。此外，我们将研究个人拥有设备与公司拥有硬件的影响。\n\
  \n然后，我们将查看配件，不仅包括消费者常用的 iPad 配件，还包括强大的移动业务配件，如条形扫描器、磁条读卡器和加固型便携打印机。这些配件可以使 iPad\
  \ 执行任务和活动，为多年来一直是 Windows Mobile 设备专有的业务线解决方案提供动力支持。\n\n最后，我们将讨论在准备任何部署时应该考虑的各种物流问题，以及不同类型的用户支持模型。我们将查看用于启用用户自服务以及准备呼叫中心以有效支持外地移动用户的行业最佳实践。\n\
  \n### 部署方案\n\n在实际推出设备时，你可以采取两种主要方法中的一种，或是两者的结合。一方面，你可以创建一个环境和流程，允许用户自服务完成自己的部署。另一方面，你可以创建一个集中置备设备的流程，以便设备在用户接收时已已完成预先配置。\n\
  \n在你的组织内部，一种方法可能比另一种更合适，或者结合两种方法可能是最好的。有时，不同的用户组和用户配置文件更适合不同的部署模型。有时，默认使用用户自服务模型也是行的，但如果用户倾向于那种方法，则提供集中设备置备。再次，这真的取决于你如何为你的组织、你的\
  \ IT 部门和你的用户确定最佳方法。\n\n### 自服务\n\n在许多方面，iOS 的企业功能设计时就考虑了用户自服务。由于 Apple 对 iOS 和 iPad\
  \ 设计的完全是为了最大化用户体验，许多用于置备、配置和管理移动部署的传统方法已被 Apple 设计的让用户掌握控制权的方法所取代。\n\n例如，Apple 努力创建了一个拥有超过\
  \ 2 亿个留存了信用卡账户的用户库。由于 Apple 在 App Store 使用的账户与 iTunes 和 iBooks 使用的账户相同，它精心设计了一种体验，用户只需点击一下即可购买应用程序、音乐、电影和书籍。这种方法的一个影响是，每个\
  \ iPad 用户都需要他们自己的 Apple ID，而且为了下载应用程序（即使是免费的），也必须在账户中留存有效的信用卡。这种购买音乐、电影等的过程也意味着需要将\
  \ iPad 与 PC 或 Mac 同步以备份其内容。\n\n\n\n\n\n在这种环境下，企业 IT 部门应该如何做呢？采取“胡萝卜加大大棒”的方法可能非常有效。如果用户想要访问公司电子邮件，他们必须接受安全限制。如果他们想使用公司内部应用程序，他们可能需要接受更严格的安全规则；而如果他们想要\
  \ VPN 访问权限，则可能需要极其严苛的规则。在自服务模式下，用户掌握着控制权。如果用户出于任何原因不愿服从某项功能的安全策略或限制，他们可以选择拒绝该功能，或者将其从自己的设备中移除。\n\
  \nApple 通过使用一种被称为“配置文件”（configuration profile）的东西实现了这一点。配置文件可以包含一组账户设置和用户限制。需要记住，配置文件必须始终作为一个“全有全无”（all-or-nothing）整体被接受。如果\
  \ `Mail`、`VPN`或其他功能与特定的限制或策略绑定，则用户必须在接受功能的同时也接受该限制。如果用户不接受限制，或者如果用户在最初接受后想要移除执行某特定限制的配置文件，那么该功能也将随之移除。这最终让用户对自己的设备拥有控制权，许多组织发现，当使用“胡萝卜加大大棒”的方法时，用户比被直接强加限制在头头上时更愿意接受限制。\n\
  \n通过将提供功能（如电子邮件、应用、VPN）作为“胡萝卜”，你可以更容易地让企业用户在他们的个人设备上接受必要的限制。自服务方法让用户感到他们处于控制之中，同时赋予了\
  \ IT 部门对用户执行策略和限制的能力。这可能就是为什么在企业全面消费化的大趋势下，这种方法正变得越来越流行。\n\n## 中心化配置 (Centrally\
  \ Provisioned)\n\n传统上，移动部署主要围绕中心化配置过程展开，虽然 Apple 帮助普及了自服务模型，但在许多情况下，采用中心化配置的 iPad\
  \ 部署仍然非常有意义。\n\n当 iPad 用户是任务导向型工作者，或者 iPad 可能会被多个用户共用时，采用中心化配置的方法可能更为合适。当个人用户无法承担设备的“所有者”角色时，自服务模型的效果并不理想，而一个为用户提供预先配置并准备好的设备模型则更为合适。\n\
  \n这种模型也常见于高管层场景，这些用户只希望拿到一个完全配置并即插即用的设备。\n\n## 硬件采购 (Hardware Procurement)\n\n无论部署是作为自服务模型管理，还是通过中心化配置和设置管理，对于移动硬件应该由用户个人拥有，还是作为公司资产拥有，仍然会有讨论。同样与之前的情况一样，这并不总是非此即彼的。许多公司在向特定用户发放公司拥有\
  \ iPad 的同时，也支持愿意接受公司强制性安全策略和限制的其他用户使用个人所有的 iPad。\n\n## 个人拥有硬件 (Personally Owned\
  \ Hardware)\n\n在个人拥有硬件的背景下，组织可以采取不同的方法。第一种模型是让用户自腰包购买设备。第二种模型是给用户津贴，以便他们选择他们想要的精确设备配置。\n\
  \n完全基于个人拥有硬件的部署，最大的问题是，无法保证任何给定用户群体中的所有（甚至是大多数）用户都拥有 iPad。这使得为那些能够真正提高员工生产力的应用程序进行投资变得极其困难。\n\
  \n这就是为什么在整个行业中，我们看到许多公司转向个人拥有智能手机设备，但通过为整个用户组购买设备，在 iPad 上实现标准化。这使得为能够提供巨大投资回报率的业务应用提供支持变得容易得多。\n\
  \n## 公司拥有设备 (Corporately Owned Devices)\n\n对于公司拥有设备，我从 IT 领导者那里听到的最多的问题是，iPad 是否真的可以作为笔记本电脑或桌面电脑的替代品，还是只是他们必须提供给用户的另一个设备。这个问题没有简单的答案，但重要的是，这在很大程度上取决于用户的类型。对于外销团队、服务技术人员或在现场进行调查采集的工作人员，iPad\
  \ 基本上可以作为全 PC 替代品。其他用户组可能仍然需要 PC，但会发现对 PC 的需求比以前少得多。\n\n无论如何，行业的整体趋势已转向公司拥有的 iPad\
  \ 部署，至少对于那些将 iPad 作为业务应用程序平台的组织而言如此。最终，这是每家企业必须根据对其自身组织、文化和环境最佳的选择做出的决策。\n\n## 配件\
  \ (Accessories)\n\n提到消费端的配件时，这些通常为设备的性能、功能或用户体验提供可选的增强。然而，在企业移动领域，配件对移动部署的重要性可能与移动设备本身一样。如果解决方案需要条形码扫描、磁条读取、签名采集和收据打印，那么使用该解决方案将需要\
  \ iPad 之外的许多配件。在本节中，我们将查看一些对企业 iPad 部署至关重要的配件类型。\n\n本节提到的配件并不是产品的详尽列表，甚至不是产品类别，而只是作为企业\
  \ iPad 部署部分的常用配件类型示例。\n\n### 保护壳 (Case)\n\n虽然 iPad 2 的智能保护壳是一件出色的工业设计作品，但它无法为 iPad\
  \ 将使用的许多现场环境提供足够的保护。幸运的是，iPad 保护壳领域有一个整个手工业行业，其中一些可以提供大量的保护。\n\n例如，图 17.1 所示的 `OtterBox\
  \ Defender` 系列 iPad 保护壳提供了三层保护：自粘透明保护膜、高冲击性聚碳酸酯外壳和耐用的硅胶层。考虑到 iPad 在现场业务应用的能力，许多其他加固\
  \ iPad 保护壳将继续出现在市场上。\n\n图 17.1：`OtterBox Defender` 系列为 iPad 提供了三层加固保护。\n\n![17.1](img/c17f001.jpg)\n\
  \n### 键盘 (Keyboard)\n\n对于需要大量打字的应用程序，或者如果 iPad 是某些类型用户的 PC 替代品，硬件键盘通常是一件有价值的配件。\n\
  \n图 17.2 所示的 `Apple 蓝牙键盘` 是一种小轻便的键盘，便于在 iPad 上输入数据甚至编写完整的文档。Apple 还销售 `iPad 键盘底座`，它的移动性不如蓝牙键盘，但如果键盘底座留在书桌、休息室甚至共享工作空间等固定位置，它可以提供更好的打字体验。由于\
  \ iPad 兼容任何蓝牙键盘和任何 USB 键盘（通过 `camera kit USB 适配器`），因此键盘的选择几乎是无限的。\n\n\n\n\n\n图 17.2:\
  \ Apple 蓝牙键盘可以为 iPad 提供一个轻巧但全尺寸的外部键盘，适用于需要大量文字输入的应用程序。\n\n![17.2](img/c17f002.jpg)\n\
  \n### 手电写笔\n\n虽然简单的手写功能通常不是业务应用的一部分，但还有许多其他类型的业务应用可以很好地在 iPad 上使用电写笔。从绘制布局到注释图表或捕捉签名，许多应用程序都能通过电写笔提供巨大的价值。图\
  \ 17.3 所示的 Griffin Technology 手写笔只是许多兼容 iPad 电容式触摸屏的电写笔之一。\n\n图 17.3: Griffin Technology\
  \ 手写笔可配合 iPad 的电容触摸屏使用，并用于许多强大的业务功能，例如 iPad 中的嵌入式签名捕捉。\n\n![17.3](img/c17f003.jpg)\n\
  \n### 外部显示器适配器\n\niPad 支持分辨率高达 1080p 的视频图形阵列 (VGA) 和高定义多媒体接口 (HDMI) 视频输出。它可以显示 `iOS`\
  \ `4.3` 引入的镜像功能，无需任何配置或应用程序自定义即可自动输出 iPad 屏幕上显示的任何内容。但应用程序也可以通过向外部显示器输出与 iPad 屏幕不同的内容来覆盖此功能。例如，`Keynote`\
  \ 允许演讲者查看下一幻灯片、备注和计时器，而仅将演示中的当前幻灯片输出到外部显示器。\n\n因此，外部显示器适配器将成为许多企业 iPad 用户和部署的必备配件。Apple\
  \ 的数字 AV 适配器提供 HDMI 输出，并在镜像 iPad 屏幕的同时提供扩展充电功能。\n\n### 条形码扫描器\n\n条码扫描应用曾是 Windows\
  \ 平台加固移动设备的专属领域，而现在 iPad 和其他 iOS 设备的条码扫描应用开始打破微软在该领域的垄断。从库存查寻、资产追踪、零售销售点 (POS) 到订单交易处理，iPad\
  \ 加上条形码扫描器可以在传统的业务应用类别中提供现代的用户体验。正因如此，市场上源不断有新的基于 iOS 的条码扫描产品面世。\n\n凭借 iPad 2 的相机，像\
  \ `RedLaser` 这样基于软件的条码扫描 SDK 可以轻松将光学条码扫描嵌入到您的应用程序中，但有时需要激光扫描器为重复、快速的扫描提供更高水平的用户体验。图\
  \ 17.4 所示的 Mobilogics `iScan` 设备是一种可以插入任何 iPad、iPhone 或 iPod touch 底部接口的适配器，它可以提供激光扫描功能，且价格仅\
  \ 99 美元起。\n\n图 17.4: Mobilogics `iScan` 是一款经过 Apple 认证的用于 iPad 的激光条形码扫描器，起价 99 美元，能够实现整类强大的基于\
  \ iPad 的移动业务解决方案。\n\n![17.4](img/c17f004.jpg)\n\n对于需要 2D 条形码扫描，或者您认为使用外部蓝牙扫描器更方便的应用程序，图\
  \ 17.5 所示的 `Socket CHS-7x` 是一款非常流行且强大的手持扫描设备。\n\n图 17.5: `Socket CHS-7x` 是一款基于蓝牙的\
  \ 1D 和 2D 条形码扫描器，可配合 iPad 使用，在业务应用中实现丰富的条形码扫描功能。\n\n![17.5](img/c17f005.jpg)\n\n\
  对于基于 iPad 的扫描应用，如果用户并不总是方便同时拿着扫描器和 iPad，图 17.6 所示的 `KoamTac 300i` 提供了一个可以给用户提供扫描反馈的显示器，这样每次扫描后就不一定需要查看\
  \ iPad。\n\n图 17.6: `KoamTac 300i` 是一款经过 Apple 认证的蓝牙条形码扫描器，可配合 `SDK` 在手持扫描单元本身上提供视觉反馈。\n\
  \n![17.6](img/c17f006.jpg)\n\n### 磁条读卡器\n\n磁条读卡器可以为 iPad 提供销售点、酒店业等宝贵能力。Mobilogics\
  \ `iScan` 设备（图 17.4）是一种可以插入任何 iPad、iPhone 或 iPod touch 底部接口的适配器，它可以提供激光扫描功能，且价格仅\
  \ 99 美元起。\n\n图 17.4: Mobilogics `iScan` 是一款经过 Apple 认证的用于 iPad 的激光条形码扫描器，起价 99 美元，能够实现整类强大的基于\
  \ iPad 的移动业务解决方案。\n\n### 打印机\n\n随着 `OS` `4.2` 的发布，Apple 推出了 AirPrint 功能，让应用程序开发者能够从程序中打印。除了允许开发者为\
  \ `Safari`、`Mail`、`Keynote`、`Numbers` 等其他热门应用开箱添加 AirPrint 支持外，发布时，AirPrint 仅支持少数打印机，例如图\
  \ 17.8 所示的 `HP Digitaljet Pro 8500P`。\n\n图 17.8: `HP Digitaljet Pro 8500P` 多功能一体机允许\
  \ iPad 用户从任何兼容 AirPrint 的应用程序进行打印。\n\n![17.8](img/c17f008.jpg)\n\n## 管理部署物流\n\n\
  当涉及到实际部署物理硬件时，不可避免地会出现问题，特别是当组织第一次支持像 iPad 这样的新平台或新技术时。因此，对部署进行大量的试点测试至关重要，以识别任何问题并解决这些问题，以便在大规模部署期间通过记录解决方案来提供易于参考。在试点小组中包含来自不同人口统计和技术水平的用户是有价值的，这有助于确保任何潜在问题在试点期间出现。试点用户也是焦点小组的绝佳参与者，可以收集改进应用程序以及整个部署流程的反馈。\n\
  \n\n\n\n\n在试点部署后，当准备开始更大规模的全方位部署时，分批次向用户分发设备通常是一个好主意。这主要有两个功能：首先，如果发现了任何关键问题，回滚某一个批次比回滚整个部署容易得多；其次，支持呼叫中心会有不可避免的大量来电，通过将部署分为多个批次，这些电话可以在时间上分布得更均匀，防止呼叫中心瘫痪。\n\
  \n## 准备用户支持\n\n作为任何企业级部署的一部分，你必须在用户遇到任何问题或疑问时做好准备。iPad 是一台直观的设备，但用户仍然会经常提出疑问。在整个行业中，最大的趋势是鼓励用户尽可能地自助，从而减少传统的呼叫中心\
  \ IT 支持。这并不意味着你可以消除对呼叫中心支持的需求，而是如果你为用户提供了设计用于自助的流程和系统，你的用户就会觉得他们有能力学习如何使用设备并独立解决问题。\n\
  \n在你准备移动部署时，你需要确定你的组织是否提供自助支持选项是否合适，以及将通过呼叫中心提供什么水平的支持。对于这些话题，没有绝对的对错之分；完全取决于对任何特定组织来说什么是最好的。\n\
  \n## 允许用户自助\n\n如果你允许采用消费化的自助方式进行配置和设置，或者如果你允许在企业环境中支持个人拥有设备，那么你可能想要为用户自助创建机制。作为迈向消费化的整体行业趋势的一部分，赋予用户自助满足需求的能力有助于提高用户满意度并降低\
  \ IT 支持成本。实现这一目标有很多方法，但让我们来看看用户自助最常见的两种系统和流程：Wiki（维基）和论坛。\n\n### Wiki\n\n如果你选择用户自助的路线，将所有用户引导至一个提供如何进行自助服务的指导和说明的\
  \ Wiki 是非常有价值的。Wiki 的优势在于，如果用户遇到问题，或者发生了某些变化（例如来自 `iOS` 的更新），用户会觉得有权自己更新信息。当然，这取决于企业文化和用户特征。\n\
  \n再次，这不是一个一劳永逸的解决方案。文化和用户态度中有很多变量，但关键在于确定这是否对你是一个合适的解决方案。\n\n### 论坛\n\n当话题广泛多样时（例如对特定业务应用程序的支持），论坛特别有价值。大多数有效的论坛由同一的\
  \ IT 支持人员通过论坛提供答案。但某些问题对许多用户来说是常见的，简单的搜索通常就能为用户提供其他用户已发现的克服相同问题的解决方案。\n\n与 Wiki\
  \ 类似，基于论坛的支持选项的成功很大程度上取决于企业文化和用户类型。例如，高级高管通常反感在公共论坛上提问，但在现场销售团队中，通常有一种同事情之谊，这提供了互相帮助的强大动力。\n\
  \n## 准备呼叫中心\n\n对于 iPad，用户体验与以往任何事物完全不同。在支持人员接受与 iPad 相关的新支持问题培训时，让他们有机会接触并玩玩 iPad\
  \ 以亲自体验是极其重要的。iPad 是那种除非你亲身体验，否则很难描述的东西。因此，呼叫中心的支持人员在对设备本身有一定的了解之前，将很难解释并帮助排除故障。\n\
  \n## 总结\n\n向组织内的用户分发 iPad 时，为部署做好准备是重要的。即使你的组织过去有部署移动设备的经验，iPad 也足够与众，现有的流程可能需要重新检查。此外，每个\
  \ IT 组织都必须做出一些根本决定：你将采取用户自助的方法吗？还是走集中化部署管理的路线？你是否允许个人拥有设备？还是要求公司拥有硬件？这些仅仅是你必须做出的决策之一。\n\
  \n在下一章中，我们将查看配置描述是什么以及它们如何工作。我们将研究如何创建和管理它们，以及如何使用它们来实现“胡萝卜加大大棒”的方法，将安全策略和使用限制与特定功能（如\
  \ `Exchange` 或 `VPN` 访问）联系起来。\n\n### 第 18 章：设备的配置与设置\n\n### 本章内容\n\n*   理解 `SCEP`\
  \ 注册流程\n*   什么是配置描述以及它们如何工作\n*   如何将配置描述用于 `iOS` 部署\n*   使用 `iPhone Configuration\
  \ Utility`\n*   通过程序创建配置描述\n*   使用第三方供应商的配置工具\n\n在最后一章中，你研究了在企业内部促进 `iOS` 部署的一些策略和后勤问题。在本章中，你将更深入地研究上一章描述的某些机制，并查看配置和设置\
  \ `iOS` 设备的实际和流程实际上运作。\n\n你将首先通过一种名为 `SCEP` 或“简单证书注册协议”的机制研究注册过程，该机制允许设备唯一且安全地注册到企业环境中。然后，你将查看配置和设置描述具体是什么，它们的作用是什么，以及它们之间有什么区别。\n\
  \n接下来，你将检查可以作为配置描述部分分发的不同类型“负载”，以及如何使用 `iPhone Configuration Utility` 快速方便地创建配置描述。你将考虑配置描述基于\
  \ `XML` 的内容，以及这些内容如何作为任何类型的内部自助门户或其他自定义系统的一部分通过程序生成。你还将查看 Apple 为 `iPhone Configuration\
  \ Utility`提供的基于 `C# .NET` 的 API，以帮助脚本和自动化动态配置描述的生成。\n\n## 理解配置描述\n\n配置描述是 Apple\
  \ 对 `iOS` 企业支持的基础。它们首次引入于 `iPhone OS 2.0`，但在 `iPhone OS 3.0` 和 `iOS 4.0` 中得到了显著改进，并将在\
  \ `iOS 5.0` 中进一步完善。作为 `iOS 4.0` 引入的移动设备管理 (MDM) 功能的一部分，配置描述是配置和管理设备以及执行策略/限制的根本机制。这并不是说\
  \ `MDM` 是使用配置描述的前提，而是说配置描述是 `MDM` 实际执行其许多管理能力的底层基础（将在第 20 章中更详细地讨论）。\n\n## 注册\n\n\
  Apple 提供了几种不同的方法来支持设备配置。首先，用户可以手动配置自己的设备。这不需要 IT 的任何输入，但也没有让企业对安全策略的执行拥有任何控制。\n\n\
  \n\n\n其次，企业可以创建并发布用户可以安装的设备配置文件。这些配置文件可以通过电子邮件发送到设备。（如果设备上尚未设置企业邮箱，则可以发送到个人邮箱地址。）您还可以让\
  \ iPhone 用户通过 `Safari` 导航到特定的网页，或者在短信息服务（SMS）中包含指向配置文件的网页链接。\n\n使用配置文件的优点非常多。安全和使用策略可以与特定的企业资源相关联。此外，可以对策略进行配置，使其**无法被删除，或只能在获得系统管理员批准后才能删除。（企业应该注意，如果将配置文件安装在个人拥有的设备上，在某些司法管辖区可能是不法的。）使用通用配置文件的一个主要缺点是，它们没有与特定的用户或设备绑定，可以被未经授权的人员共享和使用。\n\
  \nIT 部门始终可以在每台设备上手动安装配置文件并为每个用户进行定制。这可以确保设备符合企业策略。然而，这是一项劳动密集型过程，可能只在涉及设备数量有限的情况下才可行。\n\
  \n设备配置的最终选项 SCEP 已被整合到 iPhone OS 3.0 中，但直到 Apple 在 iOS 4.0 中加入新的 MDM 功能后才真正变得流行。SCEP\
  \ 减少了基于 IT 的手动部署过程，并通过允许在注册和配置部署之前进行策略强制和用户验证来增强安全性。\n\n接下来的章节描述了 iPhone 用户为了与 SCEP\
  \ 服务交互而需要遵循的流程。请记住，由于 Apple 不提供实际的服务——只提供服务的规范——这是每个企业必须为自己的内部使用自行创建，或通过第三方供应商实现的。大多数\
  \ iOS MDM 供应商都支持用于注册的 SCEP，MDM 将将在第 20 章详细介绍。\n\n注册过程始于用户使用 `Safari` 导航到配置文件（配置）服务的\
  \ URL。用户可以手动输入网址，或点击发送到其设备的短信中的嵌入链接。一旦用户连接到配置文件服务，就需要对用户的身份进行验证。这也是 Apple 未提供的服务，因此部署组织必须创建它或使用第三方供应商提供的服务。可以使用任何身份验证机制，包括单次注册令牌、使用现有的身份提供程序（如\
  \ `Active Directory`）或您想要使用的其他方式，因为实现取决于您或第三方供应商。\n\n一旦用户身份通过验证，服务需要响应一个 iPhone\
  \ 配置文件（`.mobileconfig` 文件）。该响应包含先先共享的密钥或挑战令牌，以及在此过程的身份验证阶段需要发送回服务器的一系列设备属性。该配置文件可以被设置为请求\
  \ iPhone OS 版本、唯一设备 ID (`UDID`)、MAC 地址、产品类型（iPad、iPhone 或 iPod touch）、手机 ID (`IMEI`）和\
  \ SIM 信息 (`ICCID`）。阶段 1 的流程概述于图 18-1。\n\n图 18.1：在阶段 1 中，SCEP 注册过程从设备与服务进行验证以请求注册开始，服务可以对该请求响应设备属性。\n\
  \n![18.1](img/c18f001.jpg)\n\n在设备接收到阶段 1 中生成的配置文件后，它会向用户显示提示，询问用户是否接受安装该配置文件。配置文件包含一个\
  \ SCEP 初始化负载，一旦接受，iPhone 将发送一个响应，该响应包含负载程序所请求的设备属性以及挑战令牌。响应使用 Apple 颁发的证书（使用设备的唯一身份）进行签名。该配置文件可以被设置为请求\
  \ iPhone OS 版本、唯一设备 ID (`UDID`)、MAC 地址、产品类型（iPad、iPhone 或 iPod touch）、手机 ID (`IMEI`）和\
  \ SIM 信息 (`ICCID`)。阶段 1 的流程概述于图 18-1。\n\n在设备接收到阶段 1 中生成的配置文件后，它会向用户显示提示，询问用户是否接受安装该配置文件。配置文件包含一个\
  \ SCEP 初始化负载，一旦接受，iPhone 将发送一个响应，该响应包含负载程序所请求的设备属性以及挑战令牌。响应使用 Apple 颁发的证书（使用设备的唯一身份）进行签名。该配置文件可以被设置为请求\
