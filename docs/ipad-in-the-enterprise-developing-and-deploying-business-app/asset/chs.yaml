  \n# 引言\n\niPad 改变了移动计算的格局，而该设备对企业 IT 产生的影响也毫不逊色。移动革命的核心在于应用，但在企业中使用 iPad 应用比简单地从\
  \ App Store 点击一个图标要复杂得多。在软件开发、系统集成、信息安全、应用部署和设备管理方面面临的挑战是真实的，但对于能够成功克服这些障碍的组织来说，其回报将是巨大的。\n\
  \niPad 已经席卷企业界，现在已出现在几乎每个行业公司各个层级员工的手中，用户也开始要求业务应用程序，以帮助他们在任何地方都能提高生产力和效率。从商业智能和执行高管仪表板，到客户关系管理和订单采集解决方案，iPad\
  \ 具有巨大的潜力，可以利用现有的信息系统和企业应用投资。即使是今天许多依赖纸质的流程（从销售演示到调查数据采集），也可以通过引入 iPad 得到极大的增强。\n\
  \n本书是一关于业务部门和 IT 部门如何协作制定移动策略，以充分利用这一变革性技术的指南。读者还将学习高层软件架构方案、设计与用户体验的重要性、应用开发工具和技术，以及在企业中部署和管理\
  \ iPad 的最佳实践。\n\n虽然有几十本书涵盖了 iPad 应用开发，但大多数都聚焦于消费级应用开发，还没有什么书籍涵盖了在企业环境中开发应用程序的独特需求和特殊考虑。\n\
  \n# 本书的结构\n\n本书分为五个部分：策略、架构、设计、开发和部署。这每一个部分在很大程度上都可以独立成篇，因此请随时跳读，阅读书中与你和你的情况最契合的部分。\n\
  \n- **第一部分策略**：涵盖了移动性的现状、拥抱 IT 消费化的方法，以及如何制定企业移动性策略和应用路线图。\n- **第二部分架构**：讨论了移动应用架构的多个维度，以及如何为任何特定应用选择最佳架构，包括轻客户端对比\
  \ Web vs. 原生 vs 混合，以及特定平台对比 跨平台的方法。\n- **第三部分设计**：侧重于 iPad 应用开发中的创意和艺术方面，事实证明，这对于创建成功的移动应用实际上非常重要。\n\
  - **第四部分开发**：介绍了针对几种架构的移动开发方法和技术，提出了常见的安全问题，演示了最佳实践，并展示了客户端应用和服务器端 Web 服务开发的示例代码。\n\
  - **最后，第五部分部署**：描述了 iPad 部署如何与传统的类型部署有显著不同，并描述了安全、置备、配置、应用部署和设备管理的最佳实践。\n\n# 本书的读者\n\
  \n本书适用于任何参与企业内部 iPad 相关工作的人员，包括 IT 和业务领导层、企业架构师、应用开发人员，以及基础设施、安全和支持人员。\n\n如果你是 IT\
  \ 高管（`CIO`、`CTO`、`IT 副总裁`、`应用开发 VP/总监`），那么第一部分策略是为你准备的，你可能也会发现第二部分架构和第五部分部署适用于你的情况。\n\
  \n此外，如果你是一个非 IT 领域的业务高管，并想了解你的组织如何通过向员工部署 iPad 应用来获益，那么第一部分策略将对你产生吸引。\n\n如果你涉及企业架构，你可能会发现书的五个部分都符合你的需求。\n\
  \n如果你是一个应用开发人员，你可能对第一部分策略感兴趣，但如果没有，请直接跳到第二部分架构、部分部分设计和第四部分开发。\n\n如果你负责基础设施相关的任务，第五部分部署是为你准备的，但你可能也会发现第一部分策略和第二部分架构非常有价值。\n\
  \n如果你是一个业务分析师，第一部分策略和第三部分设计可能对你最适用。\n\n其他，如果你是企业软件公司的高管或开发者，你将在书中处发现价值，即了解如何开发贵公司软件的\
  \ iPad 版本或该软件的配套软件，并为客户提供解决方案。\n\n# 约定\n\n为了帮助你从正文中获取最大的信息并跟踪进度，我们在全书中使用了多种约定。\n\
