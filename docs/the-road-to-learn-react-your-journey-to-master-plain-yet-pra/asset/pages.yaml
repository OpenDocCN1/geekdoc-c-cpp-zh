    \ page) => (prevState) => {\n  const { searchKey, results } = prevState;\n\n \
    \ const oldHits = results && results[searchKey]\n    ? results[searchKey].hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  return {\n    ...results,\n    [searchKey]: { hits: updatedHits, page }\n \
    \ },\n    isLoading: false\n  };\n};\n\nclass App extends Component {\n  ....\n\
    };\n```\n\nThat's it. The function over an object approach in setState() fixes\
    \ potential bugs yet increases readability and maintainability of your code. Furthermore,\
    \ you could export it and write a test for it as exercise."
