  md: '# Fetching Data


    Now you are prepared to fetch data from the Hacker News API. There was one lifecycle
    method mentioned that can be used to fetch data: componentDidMount(). You will
    use the native fetch API in JavaScript to perform the request.


    Before we use it, let''s set up the URL constants and default parameters to breakup
    the request into chunks.


    src/App.js


    ```

    import React, { Component } from ''react'';

    import ''./App.css'';

    ```


    ```

    const DEFAULT_QUERY = ''redux'';

    ```


    ```

    const PATH_BASE = ''https://hn.algolia.com/api/v1/'';

    const PATH_SEARCH = ''/search/'';

    const PARAM_SEARCH = ''query'';

    ```


    ```

    ...

    ```


    In JavaScript ES6, we use template strings to concatenate strings. You will use
    it to concatenate your URL for the API endpoint.


    # Code Playground


    ```

    // ES6

    const url = `${PATH_BASE}${PATH_SEARCH}$${PARAM_SEARCH}${DEFAULT_QUERY}`;

    ```


    ```

    // ES5

    var url = PATH_BASE + PATH_SEARCH + ''?'' + PARAM_SEARCH + DEFAULT_QUERY;

    ```


    ```

    console.log(url);

