  md: "# Split Up Components\n\nYou have one large App component now. It keeps growing\
    \ and can become confusing eventually. You can start to split it up into chunks\
    \ of smaller components.\n\nLet's start use a component for the search input and\
    \ a component for the list of items.\n\n```\nsrc/App.js\nclass App extends Component\
    \ {\n\n...\n\nrender() {\n  const { searchTerm, list } = this.state;\n  return\
    \ (\n    <div className=\"App\">\n      <Search />\n      <Table />\n    </div>\n\
    \  );\n}\n}\n\n```\n\nYou can pass those components properties which they can\
    \ use themselves. In the case of the App component it needs to pass the properties\
    \ managed in the local state and its class methods.\n\n```\nsrc/App.js\nclass\
    \ App extends Component {\n\n...\n\nrender() {\n  const { searchTerm, list } =\
    \ this.state;\n  return (\n    <div className=\"App\">\n      <Search\n      \
    \  value={searchTerm}\n        onChange={this.onSearchChange}\n      />\n    \
    \  <Table\n        list={list}\n      />\n    </div>\n  );\n}\n}\n\n```"
