  md: "in the onClick handler is enclosed by another function. It is an arrow function.\
    \ That way, you can sneak in the objectID property of the item object to identify\
    \ the item that will be dismissed. An alternative way would be to define the function\
    \ outside of the onClick handler and only pass the defined function to the handler.\
    \ A later chapter will explain the topic of handlers in elements more detail.\n\
    \nDid you notice the multil for the button element? Note that elements with multiple\
    \ attributes get messy as one line at some point. That's why the button element\
    \ is used with multiline and indentations to keep it readable. It is not mandatory.\
    \ It is only a code style recommendation that I highly recommend.\n\nNow have\
    \ to implement the onDismiss() functionality. It takes an id to identify the item\
    \ to dismiss. The function is bound to the class and thus becomes a class method.\
    \ That's why you access it with this.onDismiss() and not onDismiss(). In order\
    \ to define the onDismiss() as class method, you have bind it in the constructor.\
    \ Bindings will be explained in another chapter on.\n\nsrc/App.js\n\n```\nclass\
    \ App extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n  render() {\n    ...\n  }\n}\n```\n\nIn the next step, you have to define\
    \ its functionality, the business logic, in your class. Class methods can be defined\
    \ the following way."
