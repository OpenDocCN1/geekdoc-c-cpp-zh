  md: '# Getting Real with an API


    There is one more lifecycle:componentDidCatch(error, info). It was introduced
    in React 16 and is used to catch errors in components. For instance, displaying
    the sample list in your application works fine. But there could be a case when
    the local state is set to null by accident (e.g. when fetching the list from an
    external API, but the request failed and you set the local state of it to null).
    Afterward, it wouldn''t be possible to filter and map the list anymore, would
    fail. because it is null and not an empty list. The component would be broken
    and the whole application would fail. Now, by using componentDidCatch(), you can
    catch the error, store it in your local state, and show an optional message to
    your application user that an error has happened.


