  md: "# Introduction to React\n\nsrc/App.js\n\n```\nimport React, { Component } from\
    \ 'react';\n\n...\n\nclass App extends Component {\n  render() {\n    ...\n  }\n\
    }\n```\n\nThe App class extends Component. Basically you declare the App component,\
    \ but it extends from another component. What does extend mean? In object-oriented\
    \ programming you have the principle of inheritance. It is used to pass over functionalities\
    \ from one class to another.\n\nThe App class extends functionality from the Component\
    \ class. To be more specific, it inherits functionalities from the Component class.\
    \ The Component class is used to extend a basic ES6 class to a ES6 class. It has\
    \ all the functionalities that a component in React needs to have. The render\
    \ method is one of these functionalities that you have already used. You will\
    \ learn about other component classes later on.\n\nComponent class encapsulates\
    \ all the implementation details of a React component. It enables developers to\
    \ use classes as components in React.\n\nThe methods as React Component exposes\
    \ the public interface. One of these methods has to be overridden, the others\
    \ don't need to be overridden. You will learn about the latter ones when the book\
    \ arrives at lifecycle methods in a later chapter. The render() method has to\
    \ be overridden, because it defines the output of a React Component. It has to\
    \ be defined.\n\nNow you know the basics around JavaScript ES6 classes and how\
    \ they are used in React to extend them to components. You will learn more about\
    \ the Component methods when the book describes React lifecycle methods.\n\n#\
    \ Exercises:\n\n+   - read more about ES6 classes⁶³\n\n⁶³https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes"
