    );\n}\n```\n\nThe this object of an ES6 class component helps us to reference\
    \ the DOM node with the ref attribute.\n\nsrc/App.js\n\n```\nclass Search extends\
    \ Component {\n  render() {\n    const {\n      value,\n      onChange,\n    \
    \  onSubmit,\n      children\n    } = this.props;\n    return (\n      <form onSubmit={onSubmit}>\n\
