    \ again. In total it makes 3 requests. But you searched for \"redux\" twice and\
    \ both times it took a whole asynchronous roundtrip to fetch the Data. In a client-sided\
    \ cache you would store each result. When a request to the API is made, it checks\
    \ if a result is already there. If it is, the cache is used. Otherwise an API\
    \ request is made to fetch the data.\n\nIn order to have a client cache for each\
    \ result, you have to store multiple results rather than one result in your internal\
    \ component state. The results object will be a map with the search term as key\
