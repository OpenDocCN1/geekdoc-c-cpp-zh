  md: "# Basics in React\n\nsrc/App.js\n\n```\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      list,\n      searchTerm: '',\n\
    \    };\n\n    this.onSearchChange = this.onSearchChange.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n\n  ...\n}\n```\n\nNow you store the input\
    \ value to your internal component state every time the value in the input field\
    \ changes.\n\nA brief note about updating the local state in a React component.\
    \ It would be fair to assume that when updating the searchTerm with this.setState()\
    \ the list needs to be passed as well to preserve it. But that isn't the case.\
    \ React's setState() is a shallow merge. It preserves the sibling properties in\
    \ the state object when updating one property in it. Thus the list state, even\
    \ though you have already dismissed an item from it, it would stay the same when\
    \ updating the searchTerm property.\n\nLet's get back to your application. The\
    \ list isn't filtered yet based on the input field value that is stored in the\
    \ local state. Basically you filter the list temporarily based on the searchTerm.\
    \ Everything you need to filter. So how to filter it temporarily now? In your\
    \ render() method, before you map over the list, you can apply a filter on it.\
    \ The filter would only evaluate if the searchTerm matches title property of the\
    \ item. You have already used the built-in JavaScript filter functionality, so\
    \ let's do it again. You can sneak in the filter function before the map function,\
    \ because the filter function returns a new array and thus the map function can\
    \ be used on it in such a convenient way."
