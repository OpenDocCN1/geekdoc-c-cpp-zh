  md: "# Ref a DOM Element\n\nSometimes you need to interact with your DOM nodes in\
    \ React. The ref attribute gives you access to a node in your elements. Usually\
    \ that is an anti pattern in React, because you should use its declarative way\
    \ of doing things and its unidirectional data flow. You have learned about it\
    \ when you have introduced your first search input field. But there are certain\
    \ cases where you need access to the DOM node. The official documentation mentions\
    \ three use cases:\n\n+   - to use the DOM API (focus, media playback etc.)\n\
    - to invoke imperative DOM node animations\n- to integrate with a third-party\
    \ library that needs the DOM node (e.g. D3.js¹²²³)\n\nLet's do it by the Search\
    \ component. When the application renders the first time, the input field should\
    \ be focused. That's one use case where you would need access to the DOM API.\
    \ This chapter will show you how it works, but it is not very useful for the application\
    \ itself, we will omit the changes after the chapter. You can keep it for your\
    \ own application though.\n\nIn general you can use the ref attribute in both\
    \ functional stateless components and ES6 class components. In the example of\
    \ the use case, you will need a lifecycle method. That's why the approach is first\
    \ showcased by using the ref attribute with an ES6 class component.\n\nThe initial\
    \ step is to refactor the functional stateless component to an ES6 class component.\n\
    \n```\nsrc/App.js\n\nclass Search extends Component {\n  render() {\n    const\
    \ {\n      value,\n      onChange,\n      onSubmit,\n      children\n    } = this.props;\n\
    \n    return (\n      <form onSubmit={onSubmit}>\n      <input\n        type=\"\
    text\"\n        value={value}\n        onChange={onChange}\n      />\n      <button\
    \ type=\"submit\">\n```\n\n> ¹²³https://d3js.org/"
  merge: -1
