    Let''s recap what happens during the component lifecycle. Your component gets
    initialized by the constructor. After that, it renders for the first time. But
    you prevent it from displaying anything, because the result in the local state
    is null. It is allowed to return null for a component to display nothing. The
    componentDidMount() lifecycle method runs. In that method you fetch the data from
    the Hacker News API asynchronously. Once the data arrives, it changes your internal
    state in setSearchTopStories(). Afterward, the update lifecycle comes into place
    because the state was updated. The component runs the render() method again, but
    this time with populated result in your internal component state. The component
    and the Table with its content will be rendered.


    You use the native fetch API that is supported by most browsers to perform an
    asynchronous request to an API. The create-react-app configuration makes sure
    that it is supported in every browser. Third-party node packages that you can
    use to substitute the native fetch API superagent⁰ and axios⁹¹.


    Keep in mind that the book builds up on JavaScript''s shorthand notation for truthfulness.
    In the previous example, if (result) was used in favor of if (result === null).
    The same applies for other cases throughout the book too. For instance, if (!list.length)
    is used in favor of if (list.length === 0) or if (someString) is used in favor
    of if (someString !== ''''). Read about the topic API if you are not familiar
    with it.


    Back to your application: The list of hits should be visible now. However, there
    are two regression bugs in your application. First, the “Dismiss” button is broken.
    It doesn''t know about the complex result object and operates on the plain list
    from the local state when dismissing an item. Second, when the list is displayed
    but you to search for something else, the list gets filtered on the client-side
    even when the initial search was made by searching for the server-side. The perfect
    behavior would be to fetch another object from the API when using the Search component.
    Both regression bugs will be fixed in the following chapters.


