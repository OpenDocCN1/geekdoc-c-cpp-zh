  md: "# Composable Components\n\nThere is one more little property which is accessible\
    \ in the props object: the children prop. You can use it to pass elements to your\
    \ components from above, which are unknown to the component itself, but make it\
    \ possible to compose components into each other. Let's see how this looks like\
    \ when you only pass a text (string) as a child to the Search component.\n\n```\n\
    src/App.js\nclass App extends Component {\n  ...\n  render() {\n    const { searchTerm,\
    \ list } = this.state;\n    return (\n      <div className=\"App\">\n        <Search\n\
    \          value={searchTerm}\n          onChange={this.onSearchChange}\n    \
    \    />\n        <Table\n          list={list}\n          pattern={searchTerm}\n\
    \          onDismiss={this.onDismiss}\n        />\n      </div>\n    );\n  }\n\
