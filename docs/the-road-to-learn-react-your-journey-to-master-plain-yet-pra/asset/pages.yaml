  md: '# Zero-Configuration Setup


    In the Road to learn React, you will use create-react-app to bootstrap your application.
    It''s an opinionated zero-configuration starter kit for React introduced by Facebook
    in 2016. People would recommend it to beginners by 96%. In create-react-app the
    tooling and configuration evolve in the background while the focus is on the application
    implementation.


    To get started, you will have to install the package to your global node packages.
    After that, you will always have it available on the command line to bootstrap
    new React applications.


    # Command Line


    ```

    npm install -g create-react-app

    ```


    You can check the version of create-react-app to verify a successful installation
    on your command line:


    # Command Line


    ```

    create-react-app --version

    *v1.5.1

    ```


    Now you can bootstrap your first React application. We call it hackernews, but
    you can choose a different name. The bootstrapping takes a couple of seconds.
    Afterward, simply navigate into the folder:


    # Command Line


    ```

    create-react-app hackernews

    cd hackernews

    ```


    Now you can open the application in your editor. The following folder structure,
    or a variation of depending on the create-react-app version, should be presented
    to you:'
