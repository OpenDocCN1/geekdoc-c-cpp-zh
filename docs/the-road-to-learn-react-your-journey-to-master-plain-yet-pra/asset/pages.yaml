  md: '# ES6 Modules: Import and Export


    In JavaScript ES6 you can import and export functionalities from modules. These
    functionalities can be functions, classes, components, constants and others. Basically
    everything that you assign to a variable. The modules can be single files or folders
    with one index file as entry point.


    In the beginning of the book, after you bootstrapped your application with create-react-app,
    you already had several import and export statements across your initial files.
    It was a mess, because you would want to find one standardized way rather than
    having several approaches for the same thing. Now it is the appropriate time to
    explain this.


    The import and export statements help you to share code across multiple files.
    Before there were already several solutions for this in the JavaScript environment.
    It was a mess, because you would want to find one standardized way rather than
    having several approaches for the same thing. Now it is a native behavior since
    JavaScript ES6.


    Additionally these statements embrace code splitting. You distribute your code
    across multiple files to keep it reusable and maintainable. The former is true
    you can import the piece of code in multiple files. The latter is true because
    you have one single source where you maintain the piece of code.


    Last not least, it helps you to think about code encapsulation. Every functionality
    needs to get exported from a file. Some of these functionalities should only be
    used in the file where they have been defined. The exports of the file are basically
    the public API to the file. Only the exported functionalities are available to
    be reused somewhere else. It follows the best practice of encapsulation.


    But let''s get practical. How do these import and export statements work? The
    following examples showcase the statements by sharing one or multiple variables
    across two files. In the end, the approach can scale to multiple files and share
    more than simple variables.


    You can export one or multiple variables. It is called a named export.


    # Code Playground: file.js


    ```

    const firstName = ''robin'';

    const lastname = ''wieruch'';

    export { firstName, lastName };

    ```


    And import them in another file with a relative path to the first file.'
