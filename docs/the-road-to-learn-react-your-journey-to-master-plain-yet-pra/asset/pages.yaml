  md: "src/App.js\n\n```\nconst Button = ({\n  onClick = '',\n  className, \n  children,\n\
    }) => (\n  <button\n    onClick={onClick}\n    className={className}\n    type=\"\
    button\"\n  >\n    {children}\n  </button>\n)\n```\n\n```\nconst Loading = ()\
    \ => (\n  <div>Loading...</div>\n)\n```\n\n```\nconst withWithLoading = (Component)\
    \ => ({ isLoading, ...rest }) => (\n  isLoading\n    ? <Loading />\n    : <Component\
