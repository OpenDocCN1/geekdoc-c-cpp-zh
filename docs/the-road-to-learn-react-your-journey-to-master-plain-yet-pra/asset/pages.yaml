  md: '# Getting Real with an API


    Last but not least there the unmounting lifecycle. It has only one lifecycle method:
    componentWillUnmount().


    After all, you don''t need to know all of these lifecycle methods from the beginning.
    It can be intimidating yet you will not use all of them. Even in a React application
    you will only use a few of them after the `constructor()` and the `render()` method.
    Still, it is good to know that each lifecycle method can be used for specific
    cases:


    +   * constructor(props) - It is called when the component gets initialized. You
    can set an initial component state and bind class methods during that lifecycle
    method.

    * componentWillMount() - It is called before the `render()` lifecycle method.
    That''s why it could be used to set internal component state, because it will
    not trigger a second rendering of the component. Generally it is recommended to
    use the `constructor()` to set the initial state.

    * render() - This lifecycle is mandatory and returns the elements as an output
    of the component. The method should be pure and therefore shouldn''t modify the
    component state. It gets input as props and returns an element.

    * componentDidMount() - It is called only when the component gets mounted. The
    perfect time to do an asynchronous request to fetch data from an API. The fetched
    data would get stored in the internal component state to display it in the `render()`
    lifecycle method.

    * componentWillReceiveProps(nextProps) - The lifecycle method is called during
    an update lifecycle. As input you get the next props. You can diff the next props
    with the previous props, by using this props, to apply a different behavior based
    on the diff. Additionally, you can set state on the next props.

    * shouldComponentUpdate(nextProps, nextState) - It is always called when the component
    updates due to state or changes. You will use it in React applications for performance
    optimizations. Depending on a boolean that return from this lifecycle method,
    the component and all its children will render or not render on an update lifecycle.
    You can prevent the render method of a component.

    * componentWillUpdate(nextProps, nextState) - The lifecycle method is immediately
    invoked before the `render()` method. You have the next props and state at your
    disposal. You can use the method as last opportunity to perform preparations before
    the render method gets executed. Note that you cannot trigger `setState()` anymore.
    If you want to compute state from the next props, you have to use componentWillWillReceiveProps()().

    * componentDidUpdate(prevProps, prevState) - The lifecycle method is immediately
    invoked after the `render()` method. You can use it as opportunity to perform
    DOM operations or to perform further asynchronous requests.

    * componentWillUnmount() - It is called before you destroy your component. You
    can use the lifecycle method to perform any cleanup tasks.


    The `constructor()` and `render()` lifecycle methods are already used by you.
    These are commonly used lifecycle methods for ES6 class components. Actually the
    `render()` method is required, otherwise you wouldn''t return a component instance.'
