  md: "# ES6 const and let\n\nI guess you noticed that we declared the variable hello\
    \ with a var statement. JavaScript ES6 comes with two more options to declare\
    \ your variables: const and let. In JavaScript ES6, you will rarely find var anymore.\n\
    \nA variable declared with const cannot be re-assigned or re-declared. It cannot\
    \ be mutated (changed, modified). You embrace immutable data structures by using\
    \ it. Once the data structure is defined, you cannot change it.\n\nCode Playground\n\
    \n```\n// not allowed\nconst hello = 'Welcome to the Road to learn React';\nhello\
    \ = 'Bye Bye React';\n```\n\nA variable declared with let can get mutated.\n\n\
    Code Playground\n\n```\n// allowed\nlet hello = 'Welcome to the Road to learn\
    \ React';\nhello = 'Bye Bye React';\n```\n\nYou would use it when you would need\
    \ to re-assign a variable.\n\nHowever, you have to be careful with const. A variable\
    \ declared with const cannot be modified. But when the variable is an array or\
    \ object, the value it holds can get updated. The value it holds is not immutable.\n\
    \nCode Playground\n\n```\nconst hello = {\n  text: 'Welcome to the Road to learn\
    \ React';\n};\nhello.text = 'Bye Bye React';\n```\n\nBut when to use each declaration?\
    \ There are different opinions about the usage. I suggest using const when you\
    \ can. It indicates that you want to keep your data structure immutable even though\
    \ values in objects and arrays can get modified. If you want to modify your variable,\
    \ you can use let.\n\nImmutability is embraced in React and its ecosystem. That’s\
    \ why const should be your default choice when you define a variable. Still, in\
    \ complex objects the values within can get modified. Be careful about this behavior.\n\
    \nIn your application, you should use const over var."
