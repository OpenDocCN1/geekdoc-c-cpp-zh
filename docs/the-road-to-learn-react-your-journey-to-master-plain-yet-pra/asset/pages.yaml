  md: "# Event Handler\n\nThe chapter should give you a deeper understanding of event\
    \ handlers in elements. In your application, you are using the following button\
    \ element to dismiss an item from the list.\n\nsrc/App.js\n\n```\n<button\n  onClick={()\
    \ => this.onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n</button>\n\
    ```\n\nThat's already a complex use case, because you have to pass a value to\
    \ the class method and thus you have to wrap it into another (arrow) function.\
    \ So basically, it has to be a function that is passed to the event handler. The\
    \ following code wouldn't work, because the class method would be executed immediately\
    \ when you open the application in the browser.\n\nsrc/App.js\n\n```\n<button\n\
    \  onClick={this.onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n\
    </button>\n```\n\nWhen using onClick={doSomething()}, the doSomething() function\
    \ would execute immediately when you open the application in your browser. The\
    \ expression in the handler is evaluated. Since the returned value of the function\
    \ isn't a anymore, nothing would happen when you click the button. But when using\
    \ onClick={doSomething} whereas doSomething is a function, it would be executed\
    \ when clicking the button. The same rules apply for the onDismiss() class method\
    \ that is used in your application."
  merge: -1
