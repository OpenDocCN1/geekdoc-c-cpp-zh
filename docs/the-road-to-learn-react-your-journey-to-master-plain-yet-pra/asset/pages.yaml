    \n>\n- More\n- </button>\n+ <div>\n+ Loading ...\n+ </div>\n\nYou can either fix\
    \ the component now, when you think there is something wrong about it, or can\
    \ accept the new snapshot of it. Because you introduced the Loading component\
    \ in this chapter, you can accept the altered snapshot test on the command line\
    \ in the interactive test.\n\nHigher-order components are an advanced technique\
    \ in React. They have multiple purposes like improved reusability of components,\
    \ greater abstraction, composability of components and manipulations of props,\
    \ state and view. Don't worry if you don't understand them immediately. It takes\
    \ time to get to them.\n\nI encourage you to read the gentle introduction to higher-order\
    \ components¹²⁸. It gives you another approach to learn them, shows you an elegant\
    \ way to use them in a functional programming way and specifically solves the\
    \ problem of conditional rendering with higher-order components.\n\n# Exercises:\n\
    \n+   - read a gentle introduction to higher-order components¹²⁹\n\n> ¹²⁸https://www.robinwierch.de/gentle-introduction-higher-order-components/\n\
