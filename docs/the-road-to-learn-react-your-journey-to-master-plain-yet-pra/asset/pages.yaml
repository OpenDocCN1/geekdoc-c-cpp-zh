  md: 'Introduction to React


    # ReactDOM


    Before you continue with the App component, you might want to see where it is
    used. It is located

    your entry point to the React world: the src/index.js file.


    ```

    src/index.js

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import App from ''./App'';

    import ''./index.css'';

    ```


    ```

    ReactDOM.render(

    <App />,

    document.getElementById(''root'')

    );

    ```


    ReactDOM.render() uses a DOM node in your HTML to replace it with your JSX.

    That is how you can easily integrate React in every application. It is not forbidden
    to use

    ReactDOM.render() multiple times across your application. You can use it at multiple
    places to

    bootstrap JSX syntax, a React component, multiple React components or a whole
    application.

    But in plain React application you only use once to bootstrap your whole component
    tree.


    ReactDOM.render() expects two arguments. The first argument is JSX that gets rendered.
    The second

    argument specifies the place where the React application hooks into your HTML.
    It expects an

    element with an id=''root''. You can open your public/index.html file to find
    the id attribute.


    In the implementation ReactDOM.render() already takes your App component. However,
    it would

    fine to pass simpler JSX as long as it is JSX. It doesn''t have to be an instantiation
    of a component.


    # Code Playground


    ```

    ReactDOM.render(

    <h1>Hello World</h1>,

    document.getElementById(''root'')

    );

    ```


    # Exercises:


    +   - open the public/index.html to see where the React applications hooks into
    your HTML

    - read more about rendering elements in React⁵


    > ⁵https://reactjs.org/docs/rendering-elements.html'
