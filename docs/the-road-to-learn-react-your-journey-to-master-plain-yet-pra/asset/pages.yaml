    \ it is often missed when developing applications nowadays: error handling. It\
    \ is too easy to implement the happy path without worrying about the errors that\
    \ can happen along the way.\n\nIn this chapter, you will introduce an efficient\
    \ solution to add error handling for your application in case of an erroneous\
    \ API request. You have already learned the necessary building blocks in React\
    \ to introduce error handling: local state and conditional rendering. Basically,\
    \ the error is only another state in React. When an error occurs, you will store\
    \ it in the local state and display it with a conditional rendering of your component.\
