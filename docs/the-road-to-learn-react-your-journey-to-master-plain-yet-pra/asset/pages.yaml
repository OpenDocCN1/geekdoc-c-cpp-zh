  md: "# Bindings\n\nIt is important to learn about bindings in Java–cript– classes\
    \ when using React ES6 class components.\nIn the previous chapter, you have bound\
    \ your class method onDismiss() in the constructor.\n\nsrc/App.js\n\n```\nclass\
    \ App extends Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n...}\n```\n\nWhy would you do that in the first place? The binding step\
    \ is necessary, because class methods do\nautically bind this to the class instance.\
    \ Let's demonstrate it with the help of the following ES6 class component.\n\n\
    Code Playground\n\n```\nclass ExplainBindingsComponent extends Component {\n \
    \ onClickMe() {\n    console.log(this);\n  }\n\n  render() {\n    return (\n \
    \     <button\n        onClick={this.onClickMe}\n        type=\"button\">\n  \
    \      Click Me\n      </button>\n    );\n  }\n}\n```"
