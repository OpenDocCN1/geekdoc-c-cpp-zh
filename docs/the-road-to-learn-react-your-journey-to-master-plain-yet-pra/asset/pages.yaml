  md: "Getting Real with an API\n\n# Conditional Rendering\n\nConditional rendering\
    \ is introduced pretty early in React applications. But not in the case of the\
    \ book, because there wasn't such an use case. The conditional rendering happens\
    \ when you want to make a decision to render either or another element. Sometimes\
    \ it means to render an element or nothing. After all, a conditional rendering\
    \ simplest can be expressed by an if-else statement in JSX.\n\nThe result object\
    \ in the internal component state is null in the beginning. So far, the App component\
    \ returned no elements when the result hasn't arrived from the API. That's already\
    \ a conditional rendering, because you return earlier from the render() lifecycle\
    \ method for a certain condition. The App component renders nothing or its elements.\n\
    \nBut let's go one step further. It makes sense to wrap the Table component, which\
    \ is the only component that depends on the result, in an independent conditional\
    \ rendering. Everything else should be displayed, even though there is no result\
    \ yet. You can use a ternary operator in\n\n```\nsrc/App.js\nclass App extends\
    \ Component {\n  ...\n  render() {\n    const { searchTerm, result } = this.state;\n\
    \    return (\n      <div className=\"page\">\n        <div className=\"interactions\"\
    >\n          <Search\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          </Search>\n        </div>\n        { result\n        ? <Table\n   \
    \         list={result.hits}\n            pattern={searchTerm}\n            onDismiss={this.onDismiss}\n\
    \          />\n        : null\n        }\n      )\n    );\n  }\n```"
