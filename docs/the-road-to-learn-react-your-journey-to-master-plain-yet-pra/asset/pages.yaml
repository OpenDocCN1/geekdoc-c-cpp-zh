  md: "# Basics in React\n\nHowever, using onClick={this.dismiss} wouldn't suffice,\
    \ because somehow the item.objectID property needs to be passed to the class method\
    \ to identify the item that is going to be dismissed. That's why it can be wrapped\
    \ into another function to sneak in the property. The concept is called higher-order\
    \ functions in JavaScript and will be explained briefly later on.\n\nsrc/App.js\n\
    \n```\n<button\n onClick={() => this.dismiss(item.objectID)}\n  type=\"button\"\
    \n>\nDismiss\n</button>\n```\n\nA workaround would be to define the wrapping function\
    \ somewhere outside and only pass the defined function to the handler. Since it\
    \ needs access to the individual item, it has to live in the inside of the map\
    \ block.\n\nsrc/App.js\n\n```\nclass App extends Component {\n\nrender() {\n \
    \ return (\n    <div className=\"App\">\n      {this.state.list.map(item => {\n\
    \        const onHandleDismiss = (item) => {\n        return (\n          <div\
    \ key={item.objectID}>\n            <span>\n              <a href={item.url}>{item.title}</a>\n\
    \            </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        )\n      })})}\n\
    \    </div>\n  )\n}\n```"
