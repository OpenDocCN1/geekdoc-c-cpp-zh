  md: "# Getting Real with an API\n\nnot followed by many developers, to preserve\
    \ a clean application without any annoying warnings. However, the current promise\
    \ API doesn't implement aborting a request. Thus you need to help yourself on\
    \ this issue. This might also be the case why many developers are following this\
    \ best practice. The following implementation seems more like a workaround for\
    \ a sustainable implementation. Because of that, you can decide on your own if\
    \ you want to implement it to work around the warning because of an unmounted\
    \ component. Nevertheless, keep the warning in mind if it comes up in a later\
    \ chapter of this book or in your application one day. Then you know how to deal\
    \ with it.\n\nLet's start to work around it. You can introduce a class field which\
    \ holds the lifecycle of your component. It can be initialized as false when the\
    \ component initializes, changed to true when the component mounted, but then\
    \ again set to false when the component unmounted. This way, you can keep track\
    \ of your component's lifecycle state. It has nothing to do with the local state\
    \ stored and modified with this state. setState(), you should be able to access\
    \ it directly on the component instance without relying on React's local state\
    \ management. Moreover, it doesn't lead to any re-rendering of the component when\
    \ the class field is changed this way.\n\n```\nsrc/App.js\nclass App extends Component\
    \ {\n  _isMounted = false;\n\n  constructor(props) {\n    ...\n  }\n\n  ...\n\
    \  componentDidMount() {\n    this._isMounted = true;\n\n    const { searchTerm\
    \ } = this.state;\n    this.setState({ searchKey: searchTerm });\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n\n  componentWillUnmount() {\n    this._isMounted = false;\n  }\n\n  ...\n\
    }\n```"
