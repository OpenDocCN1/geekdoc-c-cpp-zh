    class App extends Component {\n  ...\n  render() {\n    return (\n      <div className=\"\
    App\">\n        <form>\n          <input type=\"text\" />\n        </form>\n \
    \       {this.state.list.map(item => (\n          ...\n        ))}\n      </div>\n\
    \    );\n  }\n}\n```\n\nIn the following scenario you will type into the input\
    \ field and filter the list temporarily by the search term that is used in the\
    \ input field. To be able to filter the list based on the value of the input field,\
