  md: '# Unit Tests with Enzyme


    Enzyme¹¹¹⁷ is a testing utility by Airbnb to assert, manipulate and traverse your
    React components. You can use it to conduct unit tests to complement your snapshot
    tests in React.


    Let''s see how you use enzyme. You first have to install it since it doesn''t
    come with default create-react-app. It also comes with an extension to use it
    in React.


    Command Line


    ```

    npm install --save-dev enzyme react-addons-test-utils enzyme-adapter-react-16

    ```


    Now, you need to include it in your test setup and initialize its Adapter for
    using it in React.


    src/App.test.js


    ```

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import renderer from ''react-test-renderer'';

    import Enzyme from ''enzyme'';

    import Adapter from ''enzyme-adapter-react-16'';

    import App, { Search, Button, Table } from ''./App'';


    Enzyme.configure({ adapter: new Adapter() });

