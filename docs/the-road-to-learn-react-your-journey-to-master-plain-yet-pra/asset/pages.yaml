  md: "# Basics in React\n\nThe component renders just fine, but when you click the\
    \ button, you will get undefined in your developer console log. That's a main\
    \ source of bugs using React, because if you want to access this.state in your\
    \ class method, it cannot be retrieved because this is undefined. So in order\
    \ to make this accessible in your class methods, you have to bind the class methods\
    \ to this.\n\nIn the following component the class method is properly bound in\
    \ the class constructor.\n\n# Code Playground\n\n```\nclass ExplainBindingsComponent\
    \ extends Component {\n  constructor() {\n    super();\n  }\n\n  this.onClickMe\
    \ = this.onClickMe.bind(this);\n\n  onClickMe() {\n    console.log(this);\n  }\n\
    \n  render() {\n    return (\n      <button\n        onClick={this.onClickMe}\n\
    \        type=\"button\"\n      >\n        Click Me\n      </button>\n    );\n\
    \  }\n}\n```\n\nWhen trying the button again, this object, to be more specific\
    \ the class instance, should be defined and you would be able to access this.state,\
    \ or as you will later learn this.props, now.\n\nThe class method binding can\
    \ happen somewhere else too. For instance"
