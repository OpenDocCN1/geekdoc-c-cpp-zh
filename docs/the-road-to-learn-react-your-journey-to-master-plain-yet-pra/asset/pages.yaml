  md: '# Requirements


    If you are coming from a different SPA framework or library, you should already
    be familiar with the basics of web development. If you have just started in web
    development, you should feel comfortable with HTML, CSS and JavaScript ES5 to
    learn React. The book will smoothly transition to JavaScript ES6 and beyond. I
    encourage you to join the official Slack Group³⁹ for the book to get help or to
    help others.


    # Editor and Terminal


    What about the development environment? You will need a running editor or IDE
    and terminal (command line tool). You can follow my setup guide⁴⁰ It is adjusted
    for MacOS users, but you can substitute most of the tools for other operating
    system. There is a ton of articles out there will show you how to set up a web
    development environment in a more elaborated way for your OS.


    Optionally, you can use git and GitHub on your, while conducting the exercises
    in the book, to keep your projects and the progress in repositories on GitHub.
    There exists a little guide⁴¹ on to use these tools. But again, it is not mandatory
    for the book and can be overwhelming when learning from scratch. So you can skip
    it if you are a newcomer in web development to focus on the essential parts in
    this book.


    # Node and NPM


    Last not least, you will need an installation of node and npm⁴². Both are used
    to manage libraries you will need along the way. In this book, you will install
    external node packages via npm (node package manager). These node packages can
    be libraries or whole frameworks.


    You can verify your versions of node and npm on the command line. If you don''t
    get any output in the terminal, you need to install node and npm first. These
    are only my versions during the time writing this book:


    # Command Line


    ```

    node --version

    *v8.9.4

    npm --version

    *v5.6.0

    ```


    > ³⁹https://slack-the-road-to-learn-react.wieruch.com/

    ⁴⁰https://www.robinwieruch.de/developer-setup/

    ⁴¹https://www.robinwieruch.de/git-essential-commands/

    ⁴²https://nodejs.org/en/'
