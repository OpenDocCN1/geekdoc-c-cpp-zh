    ```

    import { firstname, lastname } from ''./file1.js'';


    console.log(firstname);

    // output: robin

    ```


    You can also import all exported variables from another file as one object.


    # Code Playground: file2.js


    ```

    import * as person from ''./file1.js'';


    console.log(person.firstname);

    // output: robin

    ```


    Imports can have an alias. It can happen that you import functionalities from
    multiple files that have the same name export. That''s why you can use an alias.


    # Code Playground: file2.js


    ```

    import { firstname as foo } from ''./file1.js'';


    console.log(foo);

    // output: robin

    ```


    Last but not least there exists the default statement. It can be used for a few
    use cases:


    +   - to export and import a single functionality

    - to highlight the main functionality of the exported API of a module

    - to have a fallback import functionality'
