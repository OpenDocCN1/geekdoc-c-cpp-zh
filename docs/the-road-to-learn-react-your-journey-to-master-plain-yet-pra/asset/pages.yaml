    >\n        <img src={logo} className=\"App-logo\" alt=\"logo\" />\n        <h1\
    \ className=\"App-title\">Welcome to React</h1>\n      </header>\n      <p className=\"\
    App-intro\">\n        To get started, edit <code>src/App.js</code> and save to\
    \ reload.\n      </p>\n    </div>\n  }\n}\n\nexport default App;\n```\n\nDon't\
    \ let yourself confused by the import/export statements and class declaration.\
    \ These features are already JavaScript ES6. We will revisit this in a later chapter.\n\
    \nIn the file you have declared a React ES6 class component with the name App.\
    \ It is a component declaration. Basically after you have declared a component,\
    \ you can use it as element everywhere in your application. It will produce an\
    \ instance of your component or in other words: the component gets instantiated.\n\
    \nThe element it returns is specified in the render() method. Elements are what\
    \ components are made of. It is useful to understand the differences between component,\
    \ instance and element.\n\nPretty soon, you will see where the App component is\
    \ instantiated. Otherwise you wouldn't see the rendered output in the browser,\
    \ would The App component is only the declaration, but not the usage. You would\
    \ instantiate the component somewhere in your JSX with <App />."
