  md: "# Command Line\n\n```\nnpm test\n```\n\nJest enables you to write snapshot\
    \ tests. These tests make a snapshot of a rendered component and run this snapshot\
    \ against future snapshots. When a future snapshot changes, you will get notified\
    \ in the test. You can either accept the snapshot change, because you changed\
    \ the component implementation on purpose, or deny the change and investigate\
    \ for the error. It complements unit tests very well, because you only test the\
    \ diff of the rendered output. It doesn't add big maintenance costs, because you\
    \ can simply accept changed snapshots when you changed something on the snapshots\
    \ for the rendered output in your component.\n\nJest stores the snapshots in a\
    \ folder. Only that way can it validate the diff against a future snapshot. Additionally,\
    \ the snapshots can be shared across teams by having them in one folder.\n\nBefore\
    \ writing your first snapshot test with Jest, you have to install a utility library.\n\
    \n# Command Line\n\n```\nnpm install --save-dev react-test-renderer\n```\n\nYou\
    \ can now extend the App component with your first snapshot test. First, import\
    \ the new functionality from the node package and wrap your previous \"it\"\b\
    lock for the App component into a descriptive \"describe\"\block. In this case,\
    \ the test suite is only for the App component.\n\n```\nsrc/App.test.js\n```\n\
    \n```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\nimport renderer\
    \ from 'react-test-renderer';\nimport App from './App';\ndescribe('App', () =>\
    \ {\n  it('renders without crashing', () => {\n    const div = document.createElement('div');\n\
    \    ReactDOM.render(<App />, div);\n    ReactDOM.unmountComponentAtNode(div);\n\
    \  });\n});\n```\n\nYou can now implement your first snapshot test by using a\
    \ \"test\"block."
