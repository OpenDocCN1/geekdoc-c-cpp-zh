  md: "# Revisited: setState()\n\nSo far, you have used setState() to manage your\
    \ internal component state. You can pass an object to the function where you can\
    \ update partially the internal state.\n\nCode Playground\n\n```\nthis.setState({\
    \ foo: bar });\n```\n\nBut setState() doesn't take only an object. In its second\
    \ version, you can pass a function to update the state.\n\nCode Playground\n\n\
    ```\nthis.setState((prevState, props) => {\n  ..\n});\n```\n\nWhy would you want\
    \ to do that? There is one crucial case where it makes sense to use a function\
    \ over an object. It is when you update the state depending on the previous state\
    \ or props. If you don't use a function, the internal state management can cause\
    \ bugs.\n\nBut does it cause bugs to use an object over a function when the update\
    \ depends on the previous state or props? The React setState() method is asynchronous.\
    \ React batches setState() calls and executes them eventually. It can happen that\
    \ the previous state or props changed in between when you would rely on in your\
    \ setState() call.\n\nCode Playground\n\n```\nconst { fooCount } = this.state;\n\
    const { barCount } = this.props;\nthis.setState({ count: fooCount + barCount });\n\
    ```\n\nImagine that fooCount and barCount, the state or the props, change somewhere\
    \ else asynchronously when you call setState(). In a growing application, you\
    \ have more than one 'setState()' call across your application. Since setState()\
    \ executes asynchronously, you could rely on the example on stale values.\n\n\
    With the function approach, the function in setState() is a callback that operates\
    \ on the state and props at the time of executing the callback function. Even\
    \ though setState() is asynchronous, with a function it takes the state and props\
    \ at the time when it is executed."
  merge: -1
  pgno: 195
- img_proc: true
  md: "# Code Playground\n\n```\nthis.setState((prevState, props) => {\n  const {\
    \ fooCount } = prevState;\n  const { barCount } = props;\n  return { count: fooCount\
    \ + barCount };\n});\n```\n\nNow, lets get back to your code to fix this behavior.\
    \ Together we will fix it for one place where setState() uses and relies on the\
    \ state or props. Afterward, you are able to fix it at other places too.\n\nThe\
    \ setSearchTopStories() method relies on the previous state and thus is a perfect\
    \ example of using a function on an object in setState(). Right now, it looks\
    \ like the following code snippet\n\nsrc/App.js\n\n```\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n  const { searchKey, results } = this.state;\n\
    \n  const oldHits = results && results[searchKey]\n    ? results[searchKey].hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  this.setState({\n    results: {\n      ...results,\n      [searchKey]: { hits:\
    \ updatedHits, page }\n    },\n    isLoading: false\n  });\n}\n```\n\nYou extract\
    \ values from the state, but update the state depending on the previous state\
    \ asynchronously. Now you can use the functional approach to prevent bugs because\
    \ of a stale state."
