  md: "Getting Real with an API\n\n# ES6 Spread Operators\n\nThe \"Dismiss\" button\
    \ doesn't work because the onDismiss() method is not aware of the complex result\
    \ object. It only knows about a plain list in the local state. But it isn't a\
    \ plain list anymore. Let's change it to operate on the result instead of the\
    \ list itself.\n\nsrc/App.js\n\n```\nonDismiss(id) {\n  const isNotId = item ===\
    \ item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n\n\n```\n\nBut what happens in setState() now? Unfortunately\
    \ the result is a complex object. The list of hits is only one of multiple properties\
    \ in the object. However, only the list gets updated, when an item gets removed\
    \ in the result object, while the other properties stay the same.\n\nOne approach\
    \ could to mutate the hits in the result object. I will demonstrate it, but we\
    \ won't do that way.\n\n# Code Playground\n\n```\n// don't do this\nthis.state.result.hits\
    \ = updatedHits;\n```\n\nReact embraces immutable data structures. Thus you shouldn't\
    \ mutate an object (or mutate the state directly). A better approach is to generate\
    \ a new object based on the information you have. Thereby none of the objects\
    \ got altered. You will keep the immutable data structures. You will always return\
    \ a new object and never alter an object.\n\nThere you can use JavaScript ES6\
    \ Object.assign(). It takes as first argument a target object. All following arguments\
    \ are source objects. These objects are merged into the target object. The target\
    \ can be an empty object. It embraces immutability, because no source object gets\
    \ mutated. It would look like the following:\n\n# Code Playground\n\n```\nconst\
    \ updatedHits = { hits: updatedHits };\nconst updatedResult = Object.assign({},\
    \ this.state.result, updatedHits);\n```\n\nLatter objects will override merged\
    \ objects when they share the same property names. Now let's do it in the onDismiss()\
    \ method:"
