  md: "Basics in React\n\n# Code Playground\n\n```\n// ES5\nvar userService = {\n\
    \  getUser = function (user) {\n    return user.firstname + ' ' + user.lastname;\n\
    \  }\n};\n\n// ES6\nconst userService = {\n  getUser(user) {\n    return user.firstname\
    \ + ' ' + user.lastname;\n  }\n};\n```\n\nLast but not least, you are allowed\
    \ to use computed property names in JavaScript ES6.\n\n# Code Playground\n\n```\n\
    // ES5\nvar user = {\n  name: 'Robin',\n};\n\n// ES6\nconst key = 'name';\nconst\
    \ user = {\n  [key]: 'Robin'\n};\n```\n\nPerhaps computed property names make\
    \ no sense for you. Why should you need them? In a later chapter, you will come\
