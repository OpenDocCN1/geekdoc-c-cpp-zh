  md: "Advanced React Components\n\n161\n\n# # Advanced Sorting\n\nYou have already\
    \ implemented a client- and server-side search interaction. Since you have a Table\
    \ component, it would make sense to enhance the Table with advanced interactions.\
    \ What about introducing a sort functionality for each column by using the column\
    \ headers of the Table?\n\nIt would be possible to write your own sort function,\
    \ but personally I prefer to use a utility library for such cases. Lodash¹³⁰ is\
    \ one of these utility libraries, but you can use whatever library suits you.\
    \ Let's install Lodash and use it for the sort functionality.\n\nCommand Line\n\
    \n```\nnpm install lodash\n```\n\nNow you can import the sort functionality of\
    \ Lodash in your src/App.js file.\n\nsrc/App.js\n\n```\nimport React, { Component\
    \ } from 'react';\nimport axios from 'axios';\nimport { sortBy } from 'lodash';\n\
    import './App.css';\n```\n\nYou have several columns in your Table. There are\
    \ title, author, comments and points columns. You can define sort functions whereas\
    \ each function takes a list and returns a list of items sorted by a specific\
    \ property. Additionally, you will need one default sort function which doesn't\
    \ sort but only returns the unsorted list. That will be your initial state.\n\n\
    src/App.js\n\n```\nconst SORTS = {\nNONE: list => list,\nTITLE: list => sortBy(list,\
    \ 'title'),\nAUTHOR: list => sortBy(list, 'author'),\nCOMMENTS: list => sortBy(list,\
    \ 'num_comments').reverse(),\nPOINTS: list => sortBy(list, 'points').reverse(),\n\
    };\n\nclass App extends Component {\n  ...\n}\n\n```\n\n> ¹³⁰https://lodash.com/"
