    \ App 组件中进行调查。\n\n基本上`renderer.create()` 函数创建了你的 App 组件的快照。它进行虚拟渲染并将 DOM 存储在快照中。之后，当你最后一次运行快照时，该快照预计与之前的快照匹配。通过这样，你可以确保你的\
    \ DOM 保持不变，不会意外更改任何内容。\n\n让我们为我们的独立组件添加更多测试。首先，是 Search 组件：\n\n### src/App.test.js\n\
