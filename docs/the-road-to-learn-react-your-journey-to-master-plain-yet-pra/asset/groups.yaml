  - "[PAGE 33]\n\n# Complex JavaScript in JSX\n\nLet's get back to your App component.\
    \ So far you rendered some primitive variables in your JSX. Now you will start\
    \ to render a list of items. The list will be sample data in the beginning, but\
    \ far later you will fetch the data from an external API⁹. That will be far more\
    \ exciting.\n\nFirst you to define the list of items.\n\n```\nsrc/App.js\nimport\
    \ React, { Component } from 'react';\nimport './App.css';\n\nconst list = [\n\
    {\n  title: 'React',\n  url: 'https://facebook.github.io/react/',\n  author: 'Jordan\
    \ Walke',\n  num_comments: 3,\n  points: 4,\n  objectID: 0,\n},\n{\n  title: 'Redux',\n\
    \  url: 'https://github.com/reactjs/redux',\n  author: 'Dan Abramov, Andrew Clark',\n\
    \  num_comments: 2,\n  points: 5,\n  objectID: 1,\n}\n];\n\nclass App extends\
    \ Component {\n}\n```\n\nThe sample data will reflect the data we will fetch later\
    \ from the API. An item in the list has a title, an url and an author. Additionally\
    \ it comes with an identifier, points (which indicate how popular an article is)\
    \ and a count of comments.\n\nNow you can use the built-in JavaScript map functionality\
    \ in JSX. It enables you to iterate your list of items to display them. Again\
    \ you will use curly braces to encapsulate the JavaScript expression in your JSX.\n\
    \n> ⁹https://www.robinswieruch.de/what-is-an-api-javascript/"
  - "[PAGE 34]\n\n# src/App.js\n\n```\nclass App extends Component {\n  render() {\n\
    \    return (\n      <div className=\"App\">\n        {list.map(function(item)\
    \ {\n          return <div>{item.title}</div>\n        })}\n      </div>\n   \
    \ );\n  }\n}\n```\n\nUsing JavaScript in HTML is pretty powerful in JSX. Usually\
    \ you might have used map to convert one list of items to another list of items.\
    \ This time you use map to convert a list of items to HTML elements.\n\nSo far,\
    \ only the title will be displayed for each item. Let's display some more of the\
    \ item properties.\n\n# src/App.js\n\n```\nclass App extends Component {\n  render()\
    \ {\n    return (\n      <div className=\"App\">\n        {list.map(function(item)\
    \ {\n          return (\n            <div>\n              <span>\n           \
    \     <a href={item.url}>{item.title}</a>\n              </span>\n           \
    \   <span>{item.author}</span>\n              <span>{item.num_comments}</span>\n\
    \              <span>{item.points}</span>\n            </div>\n          )\n \
    \       })}\n      </div>\n    );\n  }\n}\n```"
  - "[PAGE 35]\n\n# Introduction to React\n\n}\n\nexport default App;\n\nYou can see\
    \ how the map function is simply inlined in the JSX. Each item property is displayed\
    \ in a <span> tag. Moreover the url property of the item is used in the href attribute\
    \ of the anchor tag. React will do all the work for you and display each item.\
    \ But you should add one helper for React to embrace its full potential and improve\
    \ its performance. You have to assign a key attribute to each list element. That\
    \ way React is able to identify added, changed and removed items when the list\
    \ changes. sample list items come with an identifier already.\n\nsrc/App.js\n\n\
    ```\nlist.map(function(item) {\n  return (\n    <div key={item.objectID}>\n  \
    \  <span>\n      <a href={item.url}>{item.title}</a>\n    </span>\n    <span>{item.author}</span>\n\
    \    <span>{item.num_comments}</span>\n    <span>{item.points}</span>\n  </div>\n\
    \  );\n});\n```\n\nYou should make sure that the key attribute is a stable identifier.\
    \ Don’t make the mistake of using index of the item in the array. The array index\
    \ isn't stable at all. For instance, when the list changes order, React will have\
    \ a hard time identifying the items properly.\n\nsrc/App.js\n\n```\n// don't do\
    \ this\nlist.map(function(item, key) {\n  return (\n    <div key={key}>\n    </div>\n\
    \  );\n});\n```\n\nYou are displaying both list items now. You can start your\
    \ app, open your browser and see both items of the list displayed."
- md: "\n# Exercises:\n\n- read more about React lists and keys<sup>60}\n- recap the\
    \ standard built-in array functionalities in JavaScript<sup>61}\n- use more JavaScript\
    \ expressions on your own in JSX\n\n${60}https://reactjs.org/docs/lists-and-keys.html\n\
    \n${61}https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map\n\
    \n# ES6 Arrow Functions\n\nJavaScript ES6 introduced arrow functions. An arrow\
    \ function expression is shorter than a function expression.\n\nCode Playground\n\
    \n```\n// function expression\nfunction () { ... }\n\n// arrow function expression\n\
    () => { ... }\n```\n\nBut you have to be aware of its functionalities. One of\
    \ them is a different behavior with the this object. A function expression always\
    \ defines its own object. Arrow function expressions still have this object of\
    \ the enclosing context. Don't get confused when using this in an arrow function.\n\
    \nThere is another valuable fact about arrow functions regarding the parentheses.\
    \ You can remove the parentheses when the function gets only one argument, but\
    \ have to keep them when it gets multiple arguments.\n\nCode Playground\n\n```\n\
    // allowed\nitem => { ... }\n\n// allowed\n(item) => { ... }\n\n// not allowed\n\
    item, key => { ... }\n\n// allowed\n(item, key) => { ... }\n```\n\nHowever, let's\
    \ have a look at the map function. You can write it more concisely with an ES6\
    \ arrow function.\n\n# src/App.js\n\n```\n{list.map(item => {\n  return (\n  \
    \  <div key={item.objectID}>\n      <span>\n        <a href={item.url}>{item.title}</a>\n\
    \      </span>\n      <span>{item.author}</span>\n      <span>{item.num_comments}</span>\n\
    \      <span>{item.points}</span>\n    </div>\n  );\n})}\n``` (Note: corrected\
    \ the extra closing brace in original)\n\nAdditionally, you can remove the block\
    \ body, meaning the curly braces, of the ES6 arrow function. In a concise body\
    \ an implicit return is attached. That you can remove the return statement. That\
    \ will happen more often in the book, so be sure to understand the difference\
    \ between a block body and a concise body using arrow functions.\n\n# src/App.js\n\
    \n```\n{list.map(item =>\n<div key={item.objectID}>\n  <span>\n    <a href={item.url}>{item.title}</a>\n\
    \  </span>\n  <span>{item.author}</span>\n  <span>{item.num_comments}</span>\n\
    \  <span>{item.points}</span>\n</div>\n))}\n```\n\nYour JSX looks more concise\
    \ and readable now. It omits the function statement, the curly braces and the\
    \ return statement. Instead a developer can focus on the implementation details.\n\
    \n# Exercises:\n\n- read more about ES6 arrow functions^62\n\n> 62https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Functions/Arrow_functions\n\
    \n# ES6 Classes\n\nJavaScript ES6 introduced classes. A class is commonly used\
    \ in object-oriented programming languages. JavaScript was and is very flexible\
    \ in its programming paradigms. You can do functional programming and object-oriented\
    \ programming side by side for their particular use cases.\n\nEven though React\
    \ embraces functional programming, for instance with immutable data structures,\
    \ classes are used to declare components. They are ES6 class components. React\
    \ mixes the good of both programming paradigms.\n\nLet's consider the following\
    \ Developer class to examine a JavaScript ES6 class without thinking about a component.\n\
    \n# Code Playground\n\n```\nclass Developer {\n  constructor(firstname, lastname)\
    \ {\n    this.firstname = firstname;\n    this.lastname = lastname;\n  }\n\n \
