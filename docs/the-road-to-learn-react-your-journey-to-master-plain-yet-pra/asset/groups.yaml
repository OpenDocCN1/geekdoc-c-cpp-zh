  mdcn: "\n\n# 代码组织与测试\n\n142\n\n```\n> \n{children}\n</button>\n```\n\n```\nButton.propTypes\
    \ = {\n  onClick: PropTypes.func,\n  className: PropTypes.string,\n  children:\
    \ PropTypes.node,\n};\n```\n\n基本上就是这样。你从函数签名中获取每一个参数，并为它分配一个 PropType。基本类型和复杂对象的常用\
    \ PropTypes 有：\n\n- * PropTypes.array\n- * PropTypes.bool\n- * PropTypes.func\n\
    - * PropTypes.number\n- * PropTypes.object\n- * PropTypes.string\n\n此外，你还有两个 PropType\
    \ 可以定义可渲染的片段（节点），例如字符串或 React 元素：\n\n- * PropTypes.node\n- * PropTypes.element\n\
    \n你已经在 `Button` 组件中使用过 `node`  PropType 了。总的来说，你可以在 React 官方文档中查阅更多的 PropType\
    \ 定义。\n\n目前，为 `Button` 定义的所有 PropTypes 都是可选的。参数可以是 `null` 或 `undefined`。但对于某些\
    \ props，你希望强制它们是定义的。你可以要求这些 props 必须传递给组件。\n\n# 代码组织与测试\n\nsrc/App.js\n\n```\n\
    Button.propTypes = {\n  onClick: PropTypes.func.isRequired,\n  className: PropTypes.string,\n\
    \  children: PropTypes.node.isRequired,\n};\n```\n\n`className` 不是必需的，因为它可以默认为空字符串。接下来你将为\
    \ `Table` 组件定义一个 PropType 接口：\n\nsrc/App.js\n\n```\nTable.propTypes = {\n  list:\
    \ PropTypes.array.isRequired,\n  onDismiss: PropTypes.func.isRequired,\n};\n```\n\
    \n你可以更显式地定义数组 PropType 的内容：\n\nsrc/App.js\n\n```\nTable.propTypes = {\n  list:\
    \ PropTypes.arrayOf(\n    PropTypes.shape({\n      objectID: PropTypes.string.isRequired,\n\
    \      author: PropTypes.string,\n      url: PropTypes.string,\n      num_comments:\
    \ PropTypes.number,\n      points: PropTypes.number,\n    })\n  ).isRequired,\n\
    \  onDismiss: PropTypes.func.isRequired,\n};\n```\n\n`objectID` 是必需的，因为你知道某些代码依赖于它。其他属性仅用于显示，因此它们并不一定是必需的。此外，你无法确定\
    \ Hacker News API 是否始终为数组中的每个对象都有定义的属性。\n\n这是关于 PropTypes 的。但还有另一个方面。你可以在组件中定义默认\
    \ props（default props）。再次以 `Button` 组件为例。`className` 属性在组件签名中有一个 ES6 默认参数。\n\n\
    # src/App.js\n\n```\nconst Button = ({\n  onClick = \n  className = '',\n  children\n\
    }) => {\n  ..\n```\n\n你可以用 React 内部的默认 prop 替换它：\n\n# src/App.js\n\n```\nconst\
    \ Button = ({\n  onClick,\n  className,\n  children\n}) => {\n  <button\n    onClick={onClick}\n\
    \    className={className}\n    type=\"button\"\n  >\n    {children}\n  </button>\n\
    ```\n\n```\nButton.defaultProps = {\n  className: '',\n};\n```\n\n与 ES6 默认参数相同，默认\
    \ prop 确保了当父组件没有指定该属性时，该属性会被设置为默认值。PropType 的类型检查在评估默认 prop 之后进行。\n\n如果你运行测试，可能会在命令行中看到组件的\
    \ PropType 错误。这可能是因为你没有在测试中为组件定义在 PropType 定义中标记为必需（required）的所有 props。不过测试本身都是正确通过的。你可以在测试中向组件传递所有必需\
    \ props 以避免这些错误。\n\n# 练习：\n\n- 为 `Search` 组件定义 PropType 接口\n- 在接下来的章节添加和更新组件时，添加并更新\
    \ PropType 接口\n- 更多关于 React PropTypes¹²¹\n\n¹²¹https://reactjs.org/docs/typechecking.html\n\
    \n你已经学习了如何组织代码！让我们回顾一下章节：\n\n- React 允许你对组件进行类型检查\n- Jest 允许你为组件编写快照测试\n- Enzyme\
    \ 允许你编写单元测试\n- ES6 允许你组织代码\n- 通用方法允许你通过 PropTypes 扩展应用程序\n\n你可以在官方仓库中找到源代码¹²。\n\
    \n¹²https://github.com/the-road-to-react/client/5\n\n# 高级 React 组件\n\n本章将关注高级组件的实现。此外，你将深入探讨更高级的主题并实现复杂的交互。\n\
    \n# Ref 元素\n\n有时你需要与 DOM 节点进行交互。`ref` 属性让你访问这些节点。通常这在 React 中是一种反模式，因为你应该使用声明式的处理方式和单向数据流。官方文档提到了三种用例：\n\
    \n- 使用 DOM API（聚焦、媒体播放等）\n- 调用命令式 DOM 动画\n- 与需要 DOM 节点的第三方集成，例如 D3.js¹²³\n\n¹²³https://d3.org/\n\
    \n让我们通过 `Search` 组件来实现。当应用程序首次渲染时，输入框应该获得焦点。本章将展示它是如何工作的，但对于应用程序本身它并不有用，我们将在章节后省略这些更改。不过你可以为自己的应用保留它。\n\
    \n通常，你可以在函数式组件和 ES6 类组件中使用 `ref` 属性。在聚焦用例中，你需要一个生命周期方法。这就是为什么这种方法首先通过在 ES6 类组件中使用来展示。\n\
    \n第一步是将函数式组件重构为 ES6 类组件。\n\n```\nsrc/App.js\n\nclass Search extends Component\
    \ {\n  render() {\n    const {\n      value,\n      onChange,\n      onSubmit,\n\
    \      children\n    } = this.props;\n\n    return (\n      <form onSubmit={onSubmit}>\n\
    \      <input\n        type=\"text\"\n        value={value}\n        onChange={onChange}\n\
    \      />\n      <button type=\"submit\">\n        {children}\n      </button>\n\
    \    </form>\n    )\n  }\n}\n```\n\n# 高级 React 组件\n\n149\n\n```\n>\n{children}\n\
    </button>\n```\n\n# 高级 React 组件\n\n151\n\n```\nsrc/App.js\nconst Search = ({\n\
    \  value,\n  onChange,\n  onSubmit,\n  children\n}) => {\n  let input;\n  return\
    \ (\n    <form onSubmit={onSubmit}>\n      <input\n        type=\"text\"\n   \
    \     value={value}\n        onChange={onChange}\n        ref={(node) => input\
    \ = node}\n      />\n      <button type=\"submit\">\n        {children}\n    \
    \  </button>\n    </form>\n  );\n}\n```\n\n现在你就可以访问输入 DOM 元素了。在聚焦用例中它对你没有帮助，因为函数式组件中没有生命周期方法来触发聚焦。但在未来，你可能会遇到其他在函数式组件中使用\
    \ `ref` 属性是有意义的用例。\n\n- 更多关于 React 中 `ref` 属性的使用¹²⁴\n- 更多关于 React 中 `ref` 属性的通用介绍¹²⁵\n\
    \n¹²⁴https://reactjs.org/docs/refs-and-refs.html\n¹²⁵https://reactjs.org/docs/declarative.html\n\
    \n"
