    # Introduction to React


    The chapter gives you an introduction to React. You may ask yourself: Why should
    I learn React in the first place? The chapter might give you the answer to that
    question. Afterward, you will dive into the ecosystem by bootstrapping your first
    React application from scratch with zero-configuration. Along the way, you will
    get an introduction to JSX and ReactDOM. So be prepared for your first React components.'
  - '[PAGE 15]


    Introduction to React


    # Hi, my name is React.


    **Why should you bother to learn React?** In recent years single page applications
    (SPA¹) have become popular. Frameworks like Angular, Ember and Backbone helped
    JavaScript developers to build modern web applications using the usage of vanilla
    JavaScript and jQuery. The list of these popular solutions is not exhaustive.
    There exists a wide range of SPA frameworks. When you consider the release dates,
    most of them are among the first generation of SPAs: Angular 2010, Backbone 2010
    and Ember 2011.


    The initial React release was 2013 by Facebook. React is not an SPA framework
    but a view library. It is the V in MVC (view controller). It allows you to render
    components as viewable elements in a browser. While the whole ecosystem React
    makes it possible to build single page applications.


    But why you consider using React over the first generation of SPA frameworks?
    While the first generation of frameworks tried to solve of things at once, React
    only helps you to build your view layer. It''s a library and not a framework.
    The idea behind it: Your view is a hierarchy of composable components.


    In React you can focus on your view layer before you introduce more aspects to
    your application. Every aspect is another building block for your. These building
    blocks are essential to build a mature application. It can come with two advantages.


    First, you can learn the building blocks step by step. You don''t have to worry
    about understanding them altogether. It is different from a framework that gives
    you every building block from the start. This book focuses on React as the first
    building block. More building blocks follow eventually.


    Second, all building blocks make the ecosystem around React such an innovative
    place. Multiple solutions are competing with each other. You can pick the most
    appealing solution for you and use your case.


    The first generation of SPA frameworks arrived at an enterprise level. They are
    more rigid. React stays innovative and gets adopted by multiple tech leader companies
    like Airbnb, Netflix and of Course Facebook⁵ All of them invest in the future
    of React and are content with React and the ecosystem itself.


    React is probably one of the best for building modern web applications nowadays.
    It delivers the view layer, but the React ecosystem is a flexible and interchangeable
    framework⁶. React has a slim API, an amazing ecosystem and a great community.
    You can read about experiences why I moved from Angular to React⁷ I highly recommend
    you to have an understanding of why you choose React over another framework or
    library. But after, everyone is keen to experience where React will lead us in
    the next years.


    ¹https://en.wikipedia.org/wiki/Single-page_application


    ²https://en.wikipedia.org/wiki/Model⁴


    ³https://github.com/facebook/react/wiki/Using-React


    ⁴https://www.roohwier.de/essential-react-libraries-framework/


    ⁵https://www.roohwier.de/reasons-why-i-moved-from-angular-to-react/'
