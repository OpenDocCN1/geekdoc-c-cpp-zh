    \ null 而不是空列表。组件将会崩溃，整个应用程序也将失败。现在，通过使用 `componentDidCatch()`，你可以捕获错误，将其存储在本地状态中，并向应用程序用户显示一条已发生错误的可选消息。\n\
    \n# 练习：\n\n- 了解更多关于 React 生命周期周期方法\n- 了解更多关于 React 中与生命周期相关的状态\n- 了解更多关于组件中的错误处理\n\
