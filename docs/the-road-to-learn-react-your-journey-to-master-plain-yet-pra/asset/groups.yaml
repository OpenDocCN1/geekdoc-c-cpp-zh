    \n## 使用 PropTypes 定义组件接口\n\n你可能知道 TypeScript⁹ Flow⁰ 是为 JavaScript 引入类型接口。类型语言更不容易出错，因为代码在程序文本上被验证。编辑器和其他工具可以在程序运行前这些这些错误。它让你的代码更健壮。\n\
