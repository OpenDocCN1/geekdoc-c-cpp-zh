    \  {children}<input\n        type=\"text\"\n        value={value}\n        onChange={onChange}\n\
    \      />\n    </form>\n  );\n}\n```\n\nThat's basically it. The props are accessible\
    \ in the function signature and the return value is JSX. But you can do more code\
    \ in a functional stateless component. You already know the ES6 destructuring.\
    \ The best practice is to use it in the function signature to destruct the props.\n\
    \nsrc/App.js\n\n```\nfunction Search({ value, onChange, children }) {\n  return\
    \ (\n    <form>\n      {children}<input\n        type=\"text\"\n        value={value}\n\
    \        onChange={onChange}\n      />\n    </form>\n  );\n}\n```\n\nBut it can\
    \ get better. You know already that ES6 arrow functions allow you to keep your\
    \ functions concise. You can remove the block body of the function. In a concise\
    \ body an implicit return is attached thus you can remove the return statement.\
    \ Since your functional stateless component is function, you can keep it concise\
    \ as well."
