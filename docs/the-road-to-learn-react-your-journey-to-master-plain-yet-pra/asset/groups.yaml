  mdcn: "\n\n# 生命周期方法\n\n在开始在组件中使用 API 获取数据之前，你需要了解 React 的生命周期方法。这些方法是进入 React 组件生命周期的钩子（hook）。它们可以用于\
    \ ES6 类组件，但不能用于函数式无状态组件。\n\n你还记得之前某一个章节教过你 JavaScript ES6 类以及它们在 React 中是如何用法的吗？除了\
