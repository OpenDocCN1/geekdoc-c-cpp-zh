    \ } />\n  );\n\n  expect(element.find('.table-row').length).toBe(2);\n});\n```\n\
    \nShallow renders the component without its child components. That way, you can\
    \ make the test very dedicated to one component.\n\nEnzyme has overall three rendering\
    \ mechanisms in its API. You already know shallow(), but there also exist mount()\
    \ and render(). Both instantiate instances of the parent component and all child\
    \ components. Additionally mount() gives you access to the component lifecycle\
    \ methods. But when to use which mechanism? Here some rules of thumb:\n\n+   •\
    \ Always begin with a shallow test\n• If componentDidMount() or componentDidUpdate()\
    \ should be tested, use mount()\n• If you want to test component lifecycle and\
    \ children behavior, use mount()\n• If you want to test a component's rendering\
    \ with less overhead than mount() and you are not interested in lifecycle methods,\
    \ use render()\n\nYou could continue to test your components. But sure to keep\
    \ the tests simple and maintainable. Otherwise you will have to refactor them\
    \ once you change your components. That's why Facebook introduced snapshot tests\
    \ with Jest in the first place.\n\n# Exercises:\n\n+   • write a unit test for\
    \ Enzyme for your Button component\n• keep your unit tests to date during reading\
    \ the following chapters\n• read more about enzyme and its rendering API\n\n>\
    \ https://github.com/airbnb/enzyme"
  - "[PAGE 154]\n\n# Component Interface with PropTypes\n\nYou may know TypeScript¹¹⁹\
    \ Flow¹²⁰ to introduce a type interface to JavaScript. A typed language is less\
    \ error prone, because the code gets validated on its program text. Editors and\
    \ other utilities can catch these errors before the program runs. It makes your\
    \ program more robust.\n\nIn the book, you will not include Flow or TypeScript,\
    \ but another way to check your types in components. React comes with a built-in\
    \ type checker to prevent bugs. You can use PropTypes to describe your component\
    \ interface. All the props that get passed from a parent component to a child\
    \ component get validated on the PropTypes interface assigned to the child component.\n\
    \nThe chapter will show you how to make all your types safe with PropTypes. I\
    \ will omit the changes for the following chapters, because they add unnecessary\
    \ code refactorings. But you should keep and update them along the way to keep\
    \ your components interface safe.\n\nFirst, you have install a separate package\
    \ for React.\n\n# Command Line\n\n```\nnpm install prop-types\n```\n\nNow, you\
    \ can import the PropTypes.\n\nsrc/App.js\n\n```\nimport React, { Component }\
    \ from 'react';\nimport axios from 'axios';\nimport PropTypes from 'prop-types';\n\
    ```\n\nLet's start to assign a props interface to the components:\n\nsrc/App.js\n\
    \n```\nconst Button = ({\nonClick,\nclassName = '',\nchildren,\n}) => (\n  <button\n\
    \    onClick={onClick}\n    className={className}\ntype=\"button\"\n```\n\n> ¹¹⁹https://www.typescript.org/\n\
    ¹²⁰://flowtype.org/"
- md: "\n# Code Organization and Testing\n\n142\n\n```\n> \n{children}\n</button>\n\
    ```\n\n```\nButton.propTypes = {\n  onClick: PropTypes.func,\n  className: PropTypes.string,\n\
    \  children: PropTypes.node,\n};\n```\n\nBasically that's it. You take every argument\
    \ from the function signature and assign a PropType to it. The basic PropTypes\
    \ for primitives and complex objects are:\n\n- * PropTypes.array\n- * PropTypes.bool\n\
    - * PropTypes.func\n- * PropTypes.number\n- * PropTypes.object\n- * PropTypes.string\n\
    \nAdditionally you have two more PropTypes to define a renderable fragment (node),\
    \ e.g. a string, or a React element:\n\n- * PropTypes.node\n- * PropTypes.element\n\
    \nYou already used the node PropType for the Button component. Overall there are\
    \ more PropType definitions you can read up on the official React documentation.\n\
    \nAt the moment all of the defined PropTypes for the Button are optional. The\
    \ parameters can be null or undefined. But for several props you want to enforce\
    \ that they are defined. You can make it a requirement that these props are passed\
    \ to the component.\n\n# Code Organization and Testing\n\nsrc/App.js\n\n```\n\
    Button.propTypes = {\n  onClick: PropTypes.func.isRequired,\n  className: PropTypes.string,\n\
    \  children: PropTypes.node.isRequired,\n};\n```\n\nThe className is not required,\
    \ because it can default to an empty string. Next you will define a PropType interface\
    \ for the Table component:\n\nsrc/App.js\n\n```\nTable.propTypes = {\n  list:\
    \ PropTypes.array.isRequired,\n  onDismiss: PropTypes.func.isRequired,\n};\n```\n\
    \nYou can define the content of an array PropType more explicitly:\n\nsrc/App.js\n\
    \n```\nTable.propTypes = {\n  list: PropTypes.arrayOf(\n    PropTypes.shape({\n\
    \      objectID: PropTypes.string.isRequired,\n      author: PropTypes.string,\n\
    \      url: PropTypes.string,\n      num_comments: PropTypes.number,\n      points:\
    \ PropTypes.number,\n    })\n  ).isRequired,\n  onDismiss: PropTypes.func.isRequired,\n\
    };\n```\n\nThe objectID is required, because you know that some of your code depends\
    \ on it. The other properties are only displayed, thus they are not necessarily\
    \ required. Moreover you cannot be sure that the Hacker News API has always a\
    \ defined property for each object in the array.\n\nThat's for PropTypes. But\
    \ there is one more aspect. You can define default props in your component. Let's\
