    \n# 重温：setState()\n\n到目前为止，你一直在使用 `setState()` 来管理组件的内部状态。你可以向函数传递一个对象，并在其中部分更新内部状态。\n\
    \n代码沙练场\n\n```javascript\nthis.setState({ foo: bar });\n```\n\n但 `setState()`\
    \ 不仅仅接受一个对象。在它的第二个版本中，你可以传递一个函数来更新状态。\n\n代码沙练场\n\n```javascript\nthis.setState((prevState,\
    \ props) => {\n  ..\n});\n```\n\n你为什么想要这样做呢？有一个关键情况，使用函数比使用对象更有意义。那就是当你根据之前的状态或\
    \ props 更新状态时。如果你不使用函数，内部状态管理可能会导致 bug。\n\n但是，当更新依赖于之前的状态或 props 时，使用对象而不是函数会导致\
    \ bug 吗？React 的 `setState()` 方法是异步的。React 会批处理 `setState()` 调用并最终执行它们。可能会出现这种情况：在你赖的\
    \ `setState()` 调用中依赖的值之间，之前的状态或 props 发生了变化。\n\n代码沙练场\n\n```javascript\nconst\
    \ { fooCount } = this.state;\nconst { barCount } = this.props;\nthis.setState({\
    \ count: fooCount + barCount });\n```\n\n想象一下在你调用 `setState()` 时，`fooCount` 和\
    \ `barCount`（状态或 props）在其他地方异步发生了变化。在一个不断增长的应用程序中，你的应用程序会有多个 `setState()` 调用。由于\
    \ `setState()` 是异步执行的，你可能会依赖于这个关于过时值的示例。\n\n使用函数的方法，`setState()` 中的函数是一个回调，它在执行回调函数时对状态和\
    \ props 进行操作。即使 `setState()` 是异步的，但通过函数，它获取的是执行执行时的状态和 props。\n\n# 代码沙练场\n\n```javascript\n\
    this.setState((prevState, props) => {\n  const { fooCount } = prevState;\n  const\
    \ { barCount } = props;\n  return { count: fooCount + barCount };\n});\n```\n\n\
    现在，让我们回到你的代码来修复这种行为。我们将共同修复一个 `setState()` 使用并依赖状态或 props 的地方。之后，你也能修复其他地方。\n\n\
    `getSearchTopStories()` 方法依赖于之前的状态，因此它是在 `setState()` 中使用函数对象的完美示例。现在，它看起来像下面的代码段\n\
    \nsrc/App.js\n\n```javascript\nsetSearchTopStories(result) {\n  const { hits,\
    \ page } = result;\n  const { searchKey, results } = this.state;\n\n  const oldHits\
    \ = results && results[searchKey]\n    ? results[searchKey].hits\n    : [];\n\n\
    \  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n  this.setState({\n\
    \    results: {\n      ...results,\n      [searchKey]: { hits, page }\n    },\n\
    \    isLoading: false\n  });\n}\n```\n\n你从状态中提取值，因为更新依赖于之前的状态。使用函数方法可以防止过时状态的问题。\n\
    \nsrc/App.js\n\n```javascript\nsetSearchTopStories(result) {\n  const { hits,\
    \ page } = result;\n\n  this.setState(prevState => {\n    ...\n  }));\n```\n\n\
    你可以将已经实现的块移动到函数中。你只需要操作 `prevState` 而不是 `this.state`。\n\nsrc/App.js\n\n```javascript\n\
    setSearchTopStories(result) {\n  const { hits, page } = result;\n\n  this.setState(prevState\
    \ => {\n    const { searchKey, results } = prevState;\n\n    oldHits = results\
    \ && results[searchKey]\n      ? results[searchKey].hits\n      : [];\n\n    const\
    \ updatedHits = [\n      ...oldHits,\n      ...hits\n    ];\n\n    return {\n\
    \      results: {\n        ...results,\n        [searchKey]: { hits, page }\n\
    \      },\n      isLoading: false\n    };\n  });\n}\n```\n\n这将修复过时状态的问题。还有一个改进。由于它是函数，你可以提取该函数以提高可读性。这是使用函数而不是对象的另一个优势。函数可以位于组件外部。但毕竟，你想根据从\
    \ API 获取的结果来更新状态。\n\n```javascript\nsrc/App.js\nsetSearchTopStories(result) {\n\
