  - "[PAGE 50]\n\n# src/App.js\n\n```\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      list,\n    };\n\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n\n  onDismiss(id) {\n    ...\n  }\n\n  render()\
    \ {\n    ...\n  }\\}\n```\n\nNow you are able to define what happens inside of\
    \ the class method. Basically you want to remove the item identified by the id\
    \ from the list and store an updated list to your local state. Afterward, the\
    \ updated list will be used in the re-running render() method to display it. The\
    \ removed item shouldn't appear anymore.\n\nYou can remove an item from a list\
    \ using the JavaScript built-in filter functionality. The filter function takes\
    \ a function as input. The function has access to each value in the list, because\
    \ it iterates over the list. That way, you can evaluate each item in the list\
    \ based on a filter condition. If the evaluation for an item is true, the item\
    \ stays in the list. Otherwise it will be filtered from the list. Additionally,\
    \ it is good to know that the function returns a new list and doesn't mutate the\
    \ old list. It supports the convention in React of having immutable data structures."
  - "[PAGE 51]\n\nBasics in React\n\nsrc/App.js\n\n```\nonDismiss(id) {\n  const updatedList\
    \ = this.state.list.filter(function isNotId(item) {\n    return item.objectID\
    \ !== id;\n  });\n}\n```\n\nIn the next step, you can extract the function and\
    \ pass it to the filter function.\n\nsrc/App.js\n\n```\nonDismiss(id) {\n  function\
    \ isNotId(item) {\n    return item.objectID !== id;\n  }\n\n  const updatedList\
    \ = this.state.list.filter(isNotId);\n}\n```\n\nIn addition, you can do it more\
    \ concisely using a JavaScript ES6 arrow function.\n\nsrc/App.js\n\n```\nonDismiss(id)\
    \ {\n  const isNotId = item => item.objectID !== id;\n  const updatedList = this.state.list.filter(isNotId);\n\
    }\n```\n\nYou could even inline it again, like you did in the onClick handler\
    \ of the button, but it might get less readable.\n\nsrc/App.js\n\n```\nonDismiss(id)\
    \ {\n  const updatedList = this.state.list.filter(item => item.objectID !== id);\n\
    }\n```\n\nThe list removes the clicked item now. However the state isn't updated\
