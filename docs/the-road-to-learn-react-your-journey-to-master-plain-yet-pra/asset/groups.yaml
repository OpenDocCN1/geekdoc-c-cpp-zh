    \ test that came with create-react-app. It verifies that the App component would\
    \ render without any errors.\n\nsrc/App.js\n\n```\nimport React from 'react';\n\
    import ReactDOM from 'react-dom';\nimport App from './App';\n\nitit('renders without\
    \ crashing', () => {\n  const div = document.createElement('div');\n  ReactDOM.render(<App\
    \ />, div);\n  ReactDOM.unmountComponentAtNode(div);\n});\n```\n\nThe \"it-blocks\
    \ describes one test case. It comes with a test description and when you want\
    \ to test it, it can either succeed or fail. Furthermore, you could wrap it into\
    \ a \"describe\"block that defines your test suite. A test could include a bunch\
    \ of the \"it-blocks for specific component. You will see those \"describe\"blocks\
    \ later on. Both blocks are used to separate and organize your test cases.\n\n\
    Note that the it function is acknowledged in the JavaScript community as the function\
    \ where you run a single test. However, in Jest it is often found as an alias\
    \ test function.\n\nYou can run your test cases using the interactive create-react-app\
    \ test script on the command line. You will get the output for all test cases\
    \ on your command line interface."
  - "[PAGE 147]\n\n# Command Line\n\n```\nnpm test\n```\n\nJest enables you to write\
    \ snapshot tests. These tests make a snapshot of a rendered component and run\
    \ this snapshot against future snapshots. When a future snapshot changes, you\
    \ will get notified in the test. You can either accept the snapshot change, because\
    \ you changed the component implementation on purpose, or deny the change and\
    \ investigate for the error. It complements unit tests very well, because you\
    \ only test the diff of the rendered output. It doesn't add big maintenance costs,\
    \ because you can simply accept changed snapshots when you changed something on\
    \ the snapshots for the rendered output in your component.\n\nJest stores the\
    \ snapshots in a folder. Only that way can it validate the diff against a future\
    \ snapshot. Additionally, the snapshots can be shared across teams by having them\
    \ in one folder.\n\nBefore writing your first snapshot test with Jest, you have\
    \ to install a utility library.\n\n# Command Line\n\n```\nnpm install --save-dev\
    \ react-test-renderer\n```\n\nYou can now extend the App component with your first\
    \ snapshot test. First, import the new functionality from the node package and\
    \ wrap your previous \"it\"\block for the App component into a descriptive \"\
    describe\"\block. In this case, the test suite is only for the App component.\n\
    \n```\nsrc/App.test.js\n```\n\n```\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport renderer from 'react-test-renderer';\nimport App from\
    \ './App';\ndescribe('App', () => {\n  it('renders without crashing', () => {\n\
    \    const div = document.createElement('div');\n    ReactDOM.render(<App />,\
    \ div);\n    ReactDOM.unmountComponentAtNode(div);\n  });\n});\n```\n\nYou can\
    \ now implement your first snapshot test by using a \"test\"block."
- md: "\n## Code Organization and Testing\n\n### src/App.test.js\n\n```javascript\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport renderer\
    \ from 'react-test-renderer';\nimport App from './App';\n\ndescribe('App', ()\
    \ => {\n  it('renders without crashing', () => {\n    const div = document.createElement('div');\n\
    \    ReactDOM.render(<App />, div);\n    ReactDOM.unmountComponentAtNode(div);\n\
    \  });\n\n  test('has a valid snapshot', () => {\n    const component = renderer.create(<App\
    \ />);\n    let tree = component.toJSON();\n    expect(tree).toMatchSnapshot();\n\
    \  });\n});\n```\n\nRun your tests again and see how the tests either succeed\
    \ or fail. They should succeed. Once you change the output of the render block\
    \ in your App component, the snapshot test should fail. Then you can decide to\
    \ update the snapshot or investigate in your App component.\n\nBasically the renderer.create()\
    \ function creates a snapshot of your App component. It renders virtually and\
    \ stores the DOM into a snapshot. Afterward, the snapshot is expected to match\
    \ the previous snapshot when you run your snapshot the last time. Way, you can\
    \ ensure that your DOM stays the same and doesn't change anything by accident.\n\
    \nLet's add more tests for our independent components. First, the Search component:\n\
    \n### src/App.test.js\n\n```javascript\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport renderer from 'react-test-renderer';\nimport App,\
    \ { Search } from './App';\n\ndescribe('Search', () => {\n  it('renders without\
    \ crashing', () => {\n    const div = document.createElement('div');\n    ReactDOM.render(<Search>Search</Search>,\
    \ div);\n    ReactDOM.unmountComponentAtNode(div);\n  });\n\n  it('has a valid\
    \ snapshot', () => {\n    const component = renderer.create(\n      <Search>Search</Search>\n\
    \    );\n    let tree = component.toJSON();\n    expect(tree).toMatchSnapshot();\n\
    \  });\n});\n```\n\nThe Search component has two tests similar to the App component.\
    \ The first test simply renders the Search component to the DOM and verifies that\
    \ there is no error during the rendering process. If there would be an error,\
    \ the test would break even though there isn't any assertion (e.g expect, match,\
    \ equal) in the test block. The second snapshot test is used to store a snapshot\
    \ of the rendered component and to run it against a previous snapshot. It fails\
    \ when the snapshot has changed.\n\nSecond, you can test the Button component\
    \ whereas the same test rules are as in the Search component apply.\n\n### src/App.test.js\n\
    \n```javascript\n...\nimport App, { Search, Button } from './App';\n...\ndescribe('Button',\
    \ () => {\n  it('renders without crashing', () => {\n    const div = document.createElement('div');\n\
    \    ReactDOM.render(<Button>Give Me More</Button>, div);\n    ReactDOM.unmountComponentAtNode(div);\n\
    \  });\n\n  it('has a valid snapshot', () => {\n    const component = renderer.create(\n\
    \      <Button>Give Me More</Button>\n    );\n    let tree = component.toJSON();\n\
    \    expect(tree).toMatchSnapshot();\n  });\n});\n```\n\nLast but not least, the\
    \ Table component that you can pass a bunch of initial props to render it with\
    \ a sample list.\n\n### src/App.test.js\n\n```javascript\n...\nimport App, { Search,\
    \ Button, Table } from './App';\n...\n```\n\n```javascript\ndescribe('Table',\
    \ () => {\n  const props = {\n    list: [\n      { title: '1', author: '1', num_comments:\
    \ 1, points: 2, objectID: 'y' },\n      { title: '2', author: '2', num_comments:\
    \ 1, points: 2, objectID: 'z' },\n    ]\n  }\n});\n```\n\n```javascript\nit('renders\
    \ without crashing', () => {\n  const div = document.createElement('div');\n \
    \ ReactDOM.render(<Table { ...props } />, div);\n});\n```\n\n```javascript\ntest('has\
    \ a valid snapshot', () => {\n  const component = renderer.create(\n  <Table {\
    \ ...props } />\n  );\n  let tree = component.toJSON();\n  expect(tree).toMatchSnapshot();\n\
    });\n\n});\n```\n\nSnapshot tests usually stay pretty basic. You only want to\
    \ cover that the component doesn't change its output. Once it changes the output,\
    \ you have to decide if you accept the changes. Otherwise you have to fix the\
    \ component when the output is not the desired output.\n\n## Exercises:\n\n- see\
    \ how a snapshot test fails once you change your component’s return value in the\
    \ render() method\n- either accept or deny the snapshot change\n- keep your snapshots\
    \ tests up to date when the implementation of components change in chapters\n\
    - read more about Jest in React¹16\n\n> ¹16https://facebook.github.io/jest/docs/tutorial-react.html\n\
    \n## Unit Tests with Enzyme\n\nEnzyme¹¹¹ is a testing utility by Airbnb to assert,\
    \ manipulate and traverse your React components. You can use it to conduct unit\
    \ tests to complement your snapshot tests in React.\n\nLet's see how you use enzyme.\
    \ You first have to install it since it doesn't come with default create-react-app.\
    \ It also comes with an extension to use it in React.\n\n### Command Line\n\n\
    ```\nnpm install --save-dev enzyme react-addons-test-utils enzyme-adapter-react-16\n\
    ```\n\nNow, you need to include it in your test setup and initialize its Adapter\
    \ for using it in React.\n\n### src/App.test.js\n\n```javascript\nimport React\
    \ from 'react';\nimport ReactDOM from 'react-dom';\nimport renderer from 'react-test-renderer';\n\
    import Enzyme from 'enzyme';\nimport Adapter from 'enzyme-adapter-react-16';\n\
    import App, { Search, Button, Table } from './App';\n\nEnzyme.configure({ adapter:\
    \ new Adapter() });\n```\n\nNow you can write your first unit test in the Table\
    \ \"describe\" block. You will use shallow() to render your component and assert\
    \ that the Table has two items, because you pass it list items. The assertion\
    \ simply checks if the element has two elements with the class table-row.\n\n\
    ### src/App.test.js\n\n```javascript\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport renderer from 'react-test-renderer';\nimport Enzyme,\
    \ { shallow } from 'enzyme';\nimport Adapter from 'enzyme-adapter-react-16';\n\
    import App, { Search, Button, Table } from './App';\n\n...\ndescribe('Table',\
    \ () => {\n```\n\n> ¹¹¹https://github.com/airbnb/enzyme\n\n## Code Organization\
    \ and Testing\n\n```javascript\nconst props = [\n  { title: '1', author: '1',\
    \ num_comments: 1, points: 2, objectID: 'y' },\n  { title: '2', author: '2', num_comments:\
    \ 1, points: 2, objectID: 'z' }\n];\n```\n\n```javascript\nit('shows two items\
    \ in list', () => {\n  const element = shallow(\n    <Table { ...props } />\n\
    \  );\n\n  expect(element.find('.table-row').length).toBe(2);\n});\n```\n\nShallow\
    \ renders the component without its child components. That way, you can make the\
    \ test very dedicated to one component.\n\nEnzyme has overall three rendering\
    \ mechanisms in its API. You already know shallow(), but there also exist mount()\
    \ and render(). Both instantiate instances of the parent component and all child\
    \ components. Additionally, mount() gives you access to the component lifecycle\
    \ methods.\n\nBut when to use which? Here some rules of thumb:\n\n- Always begin\
    \ with a shallow test\n- If componentDidMount() or componentDidUpdate() should\
    \ be tested, use mount()\n- If you want to test lifecycle and children behavior,\
    \ use mount()\n- If you want to test component rendering and you are not interested\
    \ in lifecycle methods, use render()\n\nYou could continue to test your components.\
    \ But sure to keep the tests simple and maintainable. Otherwise you will have\
    \ to refactor them once you change your components. That's why Facebook introduced\
    \ snapshot tests with Jest in the first place.\n\n## Exercises:\n\n- write a unit\
    \ test for Enzyme for your Button component\n- keep your unit tests to date during\
    \ reading the following chapters\n- read more about enzyme and its rendering API\n\
    \n> https://github.com/airbnb/enzyme\n\n## Component Interface with PropTypes\n\
    \nYou may know TypeScript¹⁹ Flow²⁰ to introduce a type interface to JavaScript.\
    \ A typed language is less error prone, because the code gets validated on its\
    \ program text. Editors and other utilities can catch these errors before the\
    \ program runs. It makes your more robust.\n\nIn the book, you will not include\
    \ Flow or TypeScript, but another way to check your types in components. React\
    \ comes with a built-in type checker to prevent bugs. You can use PropTypes to\
    \ describe your component interface. All the props that get passed from a parent\
    \ component to a child component get validated on the PropTypes interface assigned\
    \ to the child component.\n\nThe chapter will show you how to make all your types\
    \ safe with PropTypes. I will omit the changes for the following chapters, because\
    \ they add unnecessary code refactorings. But you should keep and update them\
    \ along the way to keep your components interface safe.\n\nFirst, you have install\
    \ a separate package for React.\n\n```\nnpm install prop-types\n```\n\nNow, you\
    \ can import the PropTypes.\n\n### src/App.js\n\n```javascript\nimport React,\
    \ { Component } from 'react';\nimport axios from 'axios';\nimport PropTypes from\
    \ 'prop-types';\n```\n\nLet's start to assign a props interface to the components:\n\
    \n### src/App.js\n\n```javascript\nconst Button = ({\nonClick,\nclassName = '',\n\
    children,\n}) => (\n  <button\n    onClick={onClick}\n    className={className}\n\
    type=\"button\"\n```\n\n> ¹⁹https://www.typescript.org/\n²⁰https://flowtype.org/\n"
