  - "[PAGE 169]\n\n# Higher-Order Components\n\nHigher-order components (HOC) is an\
    \ advanced concept in React. HOCs are an equivalent to higher-order functions.\
    \ They take any input - most of the time a component, but also optional arguments\
    \ - return a component as output. The returned component is an enhanced version\
    \ of the input component and can be used in your JSX.\n\nHOCs are used for different\
    \ use cases. They can prepare properties, manage state or alter the representation\
    \ of a component. One use case could be use a HOC as a helper for a conditional\
    \ rendering. Imagine you have a List component that renders a list of items or\
    \ nothing, because the list is empty or null. On the other hand, the plain List\
    \ component doesn't need to bother anymore about an non existent list. It only\
    \ cares about rendering the list.\n\nLet's do in your src/App.js which takes a\
    \ component as input and returns a component. You can place it in your src/App.js\
    \ file.\n\nsrc/App.js\n\n```\nfunction withFoo(Component) {\n  return function(props)\
    \ {\n    return <Component {...props} />;\n  }\nn}\n```\n\nsrc/App.js\n\n```\n\
    const withFoo = (Component) => (props) =>\n  <Component {...props} />\n```\n\n\
    One neat convention is to prefix the naming of a HOC with. Since you are using\
    \ JavaScript ES6, you can express the HOC more concisely with an ES6 arrow function.\n\
    \nIn the example, the input component would stay the same as the output component.\
    \ Nothing happens. It renders the same instance and passes all of the props to\
    \ the output component. But that's useless. Let's enhance the output component.\
    \ The output component should show the Loading component, when the loading state\
    \ is true, otherwise it should show the input component. A conditional rendering\
    \ is a great use case for a HOC."
