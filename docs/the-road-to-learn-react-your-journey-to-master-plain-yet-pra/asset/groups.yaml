    \n# 练习：\n\n- 阅读更多关于 [React 事件](#-48)\n- 了解更多关于 [高阶函数](#higher-order-functions-69)\n\
    \n> 48 https://reactjs.org/docs/handling-events.html\n> 69 https://en.wikipedia.org/wiki/Higher-order_function\n\
    \n# ES6 解构\n\nJavaScript ES6 有一种方法可以更方便地访问对象和数组中的属性。这被称为解构。对比以下 JavaScript ES5\
    \ 和 ES6 的代码片段。\n\n# 代码沙场\n\n```javascript\nconst user = {\n  firstname: 'Robin',\n\
    \  lastname: 'Wieruch'\n}\n\n// ES5\nvar firstname = user.firstname;\nvar lastname\
