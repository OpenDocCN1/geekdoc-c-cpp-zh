    \ of React⁷⁷³\n\n> ⁷³https://reactjs.org/docs/composition-vs-inheritance.html\n\
    \n## Reusable Components\n\nReusable and composable components empower you to\
    \ come up with capable component hierarchies. They are the foundation of React's\
    \ view layer. The last chapters mentioned the term reusability. You can reuse\
    \ the Table and Search components by now. Even the App component is reusable,\
    \ because you could instantiate somewhere else again.\n\nLet's define one more\
