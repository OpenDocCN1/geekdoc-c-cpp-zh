- md: "\n# Lifecycle Methods\n\nYou will need to know about React lifecycle methods\
    \ before you can start to fetch data in your components using an API. These methods\
    \ are a hook into the lifecycle of a React component. They can be used in ES6\
    \ class components, but not in functional stateless components.\n\nDo you remember\
    \ when a previous chapter taught you about JavaScript ES6 classes and how they\
    \ are used in React? Apart from the render() method, there are several methods\
    \ that can be overridden in a React ES6 class component. All of these are the\
    \ lifecycle methods. Let's dive into them:\n\nYou already know two lifecycle methods\
    \ that can be used in an ES6 class: `constructor()` and `render()`.\n\nThe constructor\
    \ is only called when an instance of the component is created and inserted into\
    \ the DOM. The component gets instantiated. That process is called mounting of\
    \ component.\n\nThe `render()` method is called during the mount process, but\
    \ also when the component updates. Each time the state or the props of a component\
