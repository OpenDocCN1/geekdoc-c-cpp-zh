  - '[PAGE 194]


    State Management in React and beyond


    181


    state closer into another component. Other components got more lightweight again.
    Additionally the component API of the Table got more lightweight because it deals
    internally with the sort functionality.


    The process of lifting state can go the other way as well: from child to parent
    component. It is called as lifting state up. Imagine you were dealing with internal
    state in a child component. Now you want to fulfill a requirement to show the
    state in your parent component as well. You would have to lift the state to your
    parent component. But it goes even further. Imagine you want to show the state
    in a sibling component of your child component. Again you would have to lift the
    state up to your parent component. The parent component deals with the internal
    state, but exposes it to both child components.


    # Exercises:


    +   - read more about lifting state in React¹³⁴

    - read more about lifting state in learn React using Redux¹³⁵


    > ¹³⁴https://reactjs.org/docs/lifting-state-up.html


    > ¹³⁵https://www.robinwieruch.de/learn-react-before-using-redux/'
  - "[PAGE 195]\n\n# Revisited: setState()\n\nSo far, you have used setState() to\
    \ manage your internal component state. You can pass an object to the function\
    \ where you can update partially the internal state.\n\nCode Playground\n\n```\n\
    this.setState({ foo: bar });\n```\n\nBut setState() doesn't take only an object.\
    \ In its second version, you can pass a function to update the state.\n\nCode\
    \ Playground\n\n```\nthis.setState((prevState, props) => {\n  ..\n});\n```\n\n\
    Why would you want to do that? There is one crucial case where it makes sense\
    \ to use a function over an object. It is when you update the state depending\
    \ on the previous state or props. If you don't use a function, the internal state\
    \ management can cause bugs.\n\nBut does it cause bugs to use an object over a\
    \ function when the update depends on the previous state or props? The React setState()\
    \ method is asynchronous. React batches setState() calls and executes them eventually.\
    \ It can happen that the previous state or props changed in between when you would\
    \ rely on in your setState() call.\n\nCode Playground\n\n```\nconst { fooCount\
    \ } = this.state;\nconst { barCount } = this.props;\nthis.setState({ count: fooCount\
    \ + barCount });\n```\n\nImagine that fooCount and barCount, the state or the\
    \ props, change somewhere else asynchronously when you call setState(). In a growing\
    \ application, you have more than one 'setState()' call across your application.\
    \ Since setState() executes asynchronously, you could rely on the example on stale\
    \ values.\n\nWith the function approach, the function in setState() is a callback\
    \ that operates on the state and props at the time of executing the callback function.\
    \ Even though setState() is asynchronous, with a function it takes the state and\
    \ props at the time when it is executed."
  - "[PAGE 196]\n\n# Code Playground\n\n```\nthis.setState((prevState, props) => {\n\
    \  const { fooCount } = prevState;\n  const { barCount } = props;\n  return {\
    \ count: fooCount + barCount };\n});\n```\n\nNow, lets get back to your code to\
    \ fix this behavior. Together we will fix it for one place where setState() uses\
    \ and relies on the state or props. Afterward, you are able to fix it at other\
    \ places too.\n\nThe setSearchTopStories() method relies on the previous state\
    \ and thus is a perfect example of using a function on an object in setState().\
    \ Right now, it looks like the following code snippet\n\nsrc/App.js\n\n```\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n  const { searchKey, results } = this.state;\n\
    \n  const oldHits = results && results[searchKey]\n    ? results[searchKey].hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  this.setState({\n    results: {\n      ...results,\n      [searchKey]: { hits:\
    \ updatedHits, page }\n    },\n    isLoading: false\n  });\n}\n```\n\nYou extract\
    \ values from the state, but update the state depending on the previous state\
    \ asynchronously. Now you can use the functional approach to prevent bugs because\
    \ of a stale state."
  - "[PAGE 197]\n\nsrc/App.js\n\n```\nsetSearchTopStories(result) {\nconst { hits,\
    \ page } = result;\n\nthis.setState(prevState => {\n  ...\n}));n\n```\n\nYou can\
    \ move the whole block that you have already implemented into the function. You\
    \ only have to exchange that you operate on the prevState rather than this.state.\n\
    \nsrc/App.js\n\n```\nsetSearchTopStories(result) {\nconst { hits, page } = result;\n\
    \nthis.setState(prevState => {\nconst { searchKey, results } = prevState;\n\n\
    oldHits = results && results[searchKey]\n? results[searchKey].hits\n: [];\n\n\
    const updatedHits = [\n...oldHits,\n...hits\n];\n\nreturn {\nresults: {\n...results,\n\
    [searchKey]: { updatedHits, page }\n},\nisLoading: false\n};\n});n\n```\n\nThat\
    \ will fix the issue with a stale state. There is one more improvement. Since\
    \ it is a function, you can extract the function for an improved readability.\
    \ That's one more advantage to use a function"
  - "[PAGE 198]\n\nover an object. The function can live outside of the component.\
    \ But you have to use a higher-order function to pass the result to it. After\
    \ all, you want to update the state based on the fetched result from the API.\n\
    \n```\nsrc/App.js\nsetSearchTopStories(result) {\n  const { hits, page } = result;\n\
    \  this.setState(updateSearchTopStoriesState(hits, page));\n}\n```\n\nThe updateSearchTopStoriesState()\
    \ function has to return a function. It is a higher-order function. You can define\
    \ this higher-order function outside of your App component. Note how the function\
    \ signature changes slightly now.\n\n```\nsrc/App.js\nconst updateSearchTopStoriesState\
    \ = (hits, page) => (prevState) => {\n  const { searchKey, results } = prevState;\n\
    \n  const oldHits = results && results[searchKey]\n    ? results[searchKey].hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  return {\n    ...results,\n    [searchKey]: { hits: updatedHits, page }\n \
    \ },\n    isLoading: false\n  };\n};\n\nclass App extends Component {\n  ....\n\
    };\n```\n\nThat's it. The function over an object approach in setState() fixes\
    \ potential bugs yet increases readability and maintainability of your code. Furthermore,\
    \ you could export it and write a test for it as exercise."
