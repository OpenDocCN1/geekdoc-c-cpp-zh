    \ ES6 类中使用的生命周期方法：`constructor()` 和 `render()`。\n\n`constructor` 只有在组件实例创建并插入\
    \ DOM 时才会被调用。此时组件被实例化。这个过程被称为组件的挂载（mounting）。\n\n`render()` 方法在挂载过程中会被调用，当组件更新时也会被调用。每当组件的状态（state）或属性（props）发生变化时，组件的\
    \ render() 方法就会被调用。\n\n现在你对这两个生命周期方法以及它们的调用时机有了更多的了解。你已经熟悉它们了。但还有更多。\n\n组件的挂载有两个生命周期方法：`componentWillMount()`\
    \ 和 `componentDidMount()`。`constructor` 先被调用，`componentWillMount()` 在 `render()`\
    \ 方法之前调用，而 `componentDidMount()` 在 `render()` 方法之后调用。\n\n总来说，挂载过程有 4 个生命周期方法。它们按照以下顺序触发：\n\
    \n- `constructor()`\n- `componentWillMount()`\n- `render()`\n- `componentDidMount()`\n\
    \n当状态或属性变化时，组件的更新生命周期又是怎样的？总来说，它有 5 个生命周期方法，顺序如下：\n\n- `componentWillReceiveProps()`\n\
    - `shouldComponentUpdate()`\n- `componentWillUpdate()`\n- `render()`\n- `componentDidUpdate()`\n\
    \n# 实战 API 调用\n\n最后但同样重要的是还有卸载（unmounting）生命周期。它只有一个生命周期方法：`componentWillUnmount()`。\n\
    \n毕竟，你不需要从一开始就知道所有的生命周期方法。这看起来可能望人生畏，但你并不会使用所有的它们。即使在 React 应用中，在使用 `constructor()`\
    \ 和 `render()` 方法之后，你也只会使用其中的几个。尽管如此，了解每个生命周期方法可以用于特定情况是很有用的：\n\n- `constructor(props)`\
    \ - 在组件初始化时调用。你可以在该生命周期方法中设置初始组件状态并绑定类方法。\n- `componentWillMount()` - 在 `render()`\
