    # 常见问题 (FAQ)


    我如何获取更新？

    你可以订阅事通讯或在 Twitter 上关注我。一旦你拥有副本，当新版本发布时，它将保持更新。


    它使用了最新版本吗？

    当 React 发布新版本时，这本书会更新。


    它涵盖了 Redux 吗？

    没有。我为 Redux 写了另一本书。


    你未来会添加更多章节吗？

    通常情况下，这取决于社区。如果有需求，我将提供更多章节。


