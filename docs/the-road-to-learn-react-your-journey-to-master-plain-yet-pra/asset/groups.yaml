    # # FAQ


    **How do I get updates?** You can subscribe^{14} to the Newsletter or follow me
    on Twitter^{15} for updates. Once you have a copy of the book, it will stay updated
    when a new edition gets released. But you have to grab the copy again when an
    update is announced.


    **Does it use the recent React version?** The book always receives an update when
    the React version got updated. Usually books are outdated soon after their Release.
    Since this book is self-published, I will update whenever I want.


    **Does it cover Redux?** It doesn''t. Therefore I have written a second book.
    The Road to learn React should give you a solid foundation before you dive into
    advanced topics. The implementation of the sample application in the book will
    show you that don''t need Redux to build an application in React. After you have
    read the book, you will be able to implement a solid application without Redux.
    Then you can read my second book to learn Redux^{16}.


    **Does it use JavaScript ES6 ES7?** But no worry. You will be fine if you are
    familiar with JavaScript ES5. All JavaScript ES6 features, I describe on the journey
    to learn React, will transition from ES5 to ES6 in the book. Every feature along
    the way will be explained. The book does not only teach React, but also useful
    JavaScript ES6 features for React.


    **Will you add more chapters in the future?** You can have a look at the Change
    Log chapter for major updates that already happened. There will be announced improvements
    in between two. In general, it depends on the community we continue to work on
    the book. If there is acceptance for the book, I will deliver more chapters and
    improve the old material. I will keep the content up to date with recent best
    practices, concepts and patterns.


    **How can I get help while reading the book?** The book has a Slack Group^{17}
    for people who are reading the book. You can join the channel to get help or to
    help others. After all, helping others can improve your learnings todos.


    **Is there any troubleshoot?** If you run into problems, please join the Slack
    Group. In addition, you could look into the open issues on GitHub^{18} for the
    book. Perhaps your problem was already mentioned and you can find the solution
    for it. If your problem wasn''t mentioned, don''t hesitate to open a new issue
    (e.g. book page, node version). After you explain your problem, please provide
    a screenshot, and some more details. After, I try to ship fixes in next editions
    of the book.


    > $^{13}https://www.getrieview.com/profile/rwietuch

    ${14}https://twitter.com/rwietuch

    ${15}https://roadtoreact.com/course-details?courseiseld-TAMING_THE_STATE

    ${16}https://roadtoreact.com/to-learn-react.rwietuch.com/

    ${17}https://slack-the-road-to-learn-react.rwietuch.com/

    ${18}https://github.com/rwietuch/the-road-to-learn-react/issues'
