    \    className={className}\n    type=\"button\"\n  >\n    {children}\n  </button>\n\
    ```\n\n```\nButton.defaultProps = {\n  className: '',\n};\n```\n\nSame as the\
    \ ES6 default parameter, the default prop ensures that the property is set to\
    \ a default value when the parent component didn't specify it. The PropType type\
    \ check happens after the default prop is evaluated.\n\nIf you run your tests,\
    \ you might see PropType errors for your components on your command line. It can\
    \ happen because you don't define all props for your components in the tests that\
    \ are defined as required in the PropType definition. The tests themselves all\
    \ pass correctly though. You can pass all required props to the components in\
    \ your tests to avoid these errors.\n\n# Exercises:\n\n- define the PropType interface\
    \ for the Search component\n- add and update the PropType interfaces when you\
    \ add and update components in the next chapters\n- read more about React PropTypes¹²¹\n\
    \n¹²¹https://reactjs.org/docs/typechecking-with-protypes.html\n\nYou have learned\
    \ how to organize your code and how to test it! Let's recap the last chapters:\n\
    \n- React\n  - PropTypes let you define type checks for components\n  - Jest allows\
    \ you to write snapshot tests for your components\n  - Enzyme allows you to write\
    \ unit tests for your components\n- ES6\n  - import and export statements help\
    \ you to organize your code\n- General\n  - code organization allows you to scale\
    \ your application with best practices\n\nYou can find the source code in the\
    \ official repository¹¹².\n\n¹¹²https://github.com/the-road-to-react/hackernews-client/tree/5.4\n\
    \n# Advanced React Components\n\nThe chapter will focus on the implementation\
    \ of advanced React components. You will learn about higher-order components and\
    \ how to implement them. In addition, you will dive into more advanced topics\
    \ in React and implement complex interactions with it.\n\n# Ref a DOM Element\n\
    \nSometimes you need to interact with your DOM nodes in React. The ref attribute\
    \ gives you access to a node in your elements. Usually that is an anti pattern\
    \ in React, because you should use its declarative way of doing things and its\
    \ unidirectional data flow. You have learned about it when you have introduced\
    \ your first search input field. But there are certain cases where you need access\
    \ to the DOM node. The official documentation mentions three use cases:\n\n- to\
    \ use the DOM API (focus, media playback etc.)\n- to invoke imperative DOM node\
    \ animations\n- to integrate with a third-party library that needs the DOM node\
    \ (e.g. D3.js¹²²³)\n\nLet's do it by the Search component. When the application\
    \ renders the first time, the input field should be focused. That's one use case\
    \ where you would need access to the DOM API. This chapter will show you how it\
    \ works, but it is not very useful for the application itself, we will omit the\
    \ changes after the chapter. You can keep it for your own application though.\n\
    \nIn general you can use the ref attribute in both functional stateless components\
    \ and ES6 class components. In the example of the use case, you will need a lifecycle\
    \ method. That's why the approach is first showcased by using the ref attribute\
    \ with an ES6 class component.\n\nThe initial step is to refactor the functional\
    \ stateless component to an ES6 class component.\n\n```\nsrc/App.js\n\nclass Search\
    \ extends Component {\n  render() {\n    const {\n      value,\n      onChange,\n\
    \      onSubmit,\n      children\n    } = this.props;\n\n    return (\n      <form\
    \ onSubmit={onSubmit}>\n      <input\n        type=\"text\"\n        value={value}\n\
    \        onChange={onChange}\n      />\n      <button type=\"submit\">\n     \
    \   {children}\n      </button>\n    </form>\n  )\n}\n```\n\n¹²³https://d3.org/\n\
    \n# Advanced React Components\n\n149\n\n```\n>\n{children}\n</button>\n```\n\n\
    # Advanced React Components\n\n151\n\n```\nsrc/App.js\nconst Search = ({\n  value,\n\
