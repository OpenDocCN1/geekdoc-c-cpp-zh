- md: "\n## Taming the State\n\nThe previous chapters have shown you that state management\
    \ can be a crucial topic in larger applications. In general, not only React but\
    \ a lot of SPA frameworks struggle with it. Applications get more complex in the\
    \ recent years. One big challenge in web applications nowadays is to tame and\
    \ control the state.\n\nCompared to other solutions, React already made a big\
    \ forward. The unidirectional data flow and a simple API to manage state in react\
    \ is indispensable. These concepts make it easier to reason about your state and\
    \ your state changes. It makes it easier to reason about it on a component level\
    \ and to a certain degree on an application level.\n\nIn a growing application,\
    \ it gets harder to reason about state changes. You can introduce bugs by operating\
    \ on state when using an object over a function in `setState()`. You have to lift\
    \ state to share or hide state across components. It can happen that a component\
    \ needs to lift up, because its sibling depends on it. Perhaps the component is\
    \ far away in the component tree and you have to share the state across the whole\
    \ component tree. In conclusion, components get involved to a greater extent in\
    \ state management. But after all, the main responsibility of components should\
    \ be representing the UI, shouldn't it?\n\nBecause of all these reasons, there\
    \ exist standalone solutions to take care of the state management. These solutions\
    \ are not only used in React. However, that makes the React ecosystem a powerful\
    \ place. You can use different solutions to solve your problems. To address the\
    \ problem of scaling state management, you might have heard of the libraries Redux¹\
    \ or MobX². You can use either of these solutions in a React application. With\
    \ them, extensions, react-redux³ and mobx-react⁴ integrate them into the React\
    \ view layer.\n\nRedux and MobX are outside the scope of this book. When you have\
    \ finished the book, you will get guidance on how you can continue to learn React\
    \ and its ecosystem. One learning path could be to learn React. Before you dive\
    \ into the topic of external state management, I recommend to read this article⁶.\
    \ It aims to give you a better understanding of how to learn external state management.\n\
    \n## Exercises:\n\n- read more about external state management and how to learn\
    \ it⁷\n- check out my second ebook about state management in React⁸\n\n⁷ https://redux.org/docs/introduction/\n\
    ⁸ https://mobx.js/\n⁹ https://github.com/reactjs/react-redux\n¹⁰ https://github.com/mobjs/mobx-react\n\
    ¹¹ https://www.robinwieruch.de/redux-mobx-confusion/\n¹² https://www.robinwieruch.de/redux-mobx-confusion/\n\
    ¹³ https://roadreact.com/\n\nState Management in React and beyond\n\nYou have\
    \ learned advanced state management in React! Let's recap the last chapters:\n\
    \n- React\n- lift state management up and down to suitable components\n- setState\
    \ can use a function to prevent stale state bugs\n- existing external solutions\
    \ that help you to tame the state\n\nYou can find the source code in the official\
    \ repository14⁴.\n\n> 144 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.6\n\
    \n## Final Steps to Production\n\nThe last chapters will show you how to deploy\
    \ your application to production. You will use the free hosting service Heroku.\
    \ On the way to deploy your application, you will learn more about create-react-app.\n\
    \n## Eject\n\nThe following step is up to you. Still, create-react-app comes with\
    \ one feature to keep it extendable also to prevent a vendor lock-in. A vendor\
    \ lock-in usually happens when you buy into a technology but there is no escape\
    \ hatch using in the future. Fortunately in create-react-app you have such an\
    \ escape hatch with \"eject\".\n\nIn your package.json you will find the scripts\
    \ to start, test and build your application. The last script is eject. You could\
    \ try it, but there is no way back. It is a one-way operation. Once you eject,\
    \ you can't go back! If you just started to learn React, it makes no sense to\
    \ leave the convenient environment of create-react-app.\n\nIf you would run npm\
    \ run eject, the command would copy all the configuration and dependencies to\
    \ your package.json and a new config folder. You would convert the whole project\
    \ into a custom setup with tooling that includes Babel and Webpack. After all,\
    \ you would have full control over all these tools.\n\nThe official documentation\
    \ says that create-react-app is suitable for small to mid size projects. You shouldn't\
    \ feel obligated to use the \"eject\" command.\n\n## Exercises:\n\n- read more\
    \ about eject¹⁴⁵\n\n> https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup\n\
    \n## Deploy your App\n\nIn the end, no application should stay on localhost. You\
    \ want to go live. Heroku is a platform as a service where you host your application.\
    \ They offer a seamless integration with React. To be more specific: It's possible\
    \ to deploy a create-react-app in minutes. It is a zero-configuration deployment\
    \ which follows the philosophy of create-react-app.\n\nYou need to fulfill requirements\
    \ before you can deploy your application to Heroku:\n\n- install the Heroku CLI¹¹⁶\n\
    - create a free Heroku account¹¹⁷\n\nIf you have Homebrew, you can install the:\n\
    \n## Command Line\n\n```bash\nbrew update\nbrew install\n```\n\nNow you can use\
    \ git to deploy your application.\n\n## Command Line\n\n```bash\ngit init\ngit\
    \ add .\ngit commit -m \"deploy\"\ngit push heroku master\n```\n\nThat's it. If\
    \ you run into problems, you can check the following resources: \n\n- Git and\
    \ Essentials¹¹⁸\n- Deploying React with Zero Configuration¹¹⁹\n- Firebase¹¹⁰\n\
    \n> 146 https://www...com/\n> 147 https://www.heroku.com/\n> 148 https://www.github.com/\n\
    > 149 https://www.robwieruch.de/\n> 150 https://github.com/ \n\n## Outline\n\n\
    That was the last chapter of the book. I hope you enjoyed reading it and that\
    \ it helped you get traction in React. If you liked the book, share it with your\
    \ friends.\n\nSo, where can you go after reading this book? If you are looking\
    \ for further extensions for your application, I can recommend several learning\
    \ paths after you have used only React:\n\n- **State Management**: You have used\
    \ `setState()` and this state to manage local state. That's a perfect start. However,\
    \ in a larger application you will experience the limits of React's local state¹¹².\
    \ Therefore you can use a third-party state management library as Redux or MobX¹¹³.\
    \ On the course platform Road to React¹¹⁴ you will find the course \"Taming the\
    \ State in React\" that teaches advanced state in React, Redux and MobX. The course\
    \ comes with an ebook, but I recommend everyone to dive into the source code too.\n\
    - **Connecting to a Database or Authentication**: In a growing React application,\
    \ you might want to persist data. Eventually the data should be stored in a database\
    \ so that it can survive a browser session and be shared across different users\
    \ using your application. The simplest way to introduce a database is using Firebase.\
    \ In this comprehensive tutorial¹¹⁵ you will find a step by step guide on how\
    \ to use Firebase authentication (sign up, sign in, sign out...) in React. Beyond\
    \ that, you use Firebase's realtime database to store entities. After that, it\
    \ is up to you to store more which is needed by your application.\n- **Tooling\
    \ with Webpack and Babel**: In the book you have used create-react-app to set\
    \ up your application. At some point, when you have learned React, you might want\
    \ to learn the...\n\n151 https://www.amazon.com/dp/B06JHFFCQX\n152 https://www.goodreads.com/book/show/3750318-the-road-to-learn-react\n\
    153 https://twitter.com/rwier\n154 https://www.robwieruch.com/learn-react-before-redux/\n\
    155 https://www.robwieruch.com/redux-mobx-confusion/\n156 https://roadtoreact.com/\n\
    157 https://www.robwieruch.com/complete-firebase-authentication-tutorial/\n"
  mdcn: "\n\n## 驯服状态\n\n之前的章节向你展示了，状态管理在大型应用中是一个至关重要的课题。通常情况下，不仅是 React，许多 SPA 框架都为此苦恼。近年来，应用程序变得越来越复杂。如今\
    \ Web 应用程序的一个大挑战就是驯服并控制状态。\n\n与其他解决方案相比，React 已经迈出了巨大一步。单向数据流和用于管理状态的简单 API 是不可或缺的。这些概念让你更容易推导出你的状态以及状态的变化。它让你在组件层面、在某种程度上在应用层面，更容易进行推理。\n\
    \n在一个不断增长的应用程序中，推理状态的变化变得越来越困难。在 `setState()` 中使用对象而非函数来操作状态时可能会引入 Bug。你必须通过提升状态（lift\
    \ state）来在组件之间共享或隐藏状态。可能会某个组件需要向上移动，因为它的兄弟组件依赖它。也许该组件在组件树中离得很远，你必须跨越整个组件树共享状态。总之，组件参与状态管理的程度越来越大。但根结底，组件的主要职责应该是表示\
    \ UI，不是吗？\n\n正因为所有这些原因，存在独立的解决方案来处理状态管理。这些解决方案不仅用于 React。然而，这让 React 生态变成了一个强大的地方。你可以使用不同的解决方案来解决你的问题。为了解决状态管理扩展的问题，你可能听过库\
    \ Redux¹ 或 MobX²。你可以在 React 应用中使用这些解决方案之一。通过扩展 react-redux³ 和 mobx-react⁴，你可以将它们集成到\
    \ React 视图层中。\n\nRedux 和 MobX 不在本书的范围内。当你读完这本书后，你将获得关于如何继续学习 React 及其生态系统的指导。一条学习路径可以是学习\
    \ React。在深入研究外部状态管理主题之前，我建议阅读这篇文章⁶。它旨在让你更好地理解如何学习外部状态管理。\n\n## 练习：\n\n- 了解更多关于外部状态管理以及如何学习它⁷\n\
    - 查看我关于 React 中 状态管理的第二本电子书⁸\n\n⁷ https://redux.org/docs/introduction/\n⁸ https://mobx.js/\n\
    ⁹ https://github.com/reactjs/react-redux\n¹⁰ https://github.com/mobjs/mobx-react\n\
    ¹¹ https://www.robinwieruch.de/redux-mobx-confusion/\n¹² https://www.robinwieruch.de/redux-mobx-confusion/\n\
    ¹³ https://roadreact.com/\n\nReact 中的状态管理及以后\n\n你已经学习了 React 中的高级状态管理！让我们回顾一下最后几章：\n\
    \n- React\n- 将状态管理向上或向下移动到合适的组件\n- setState 可以使用函数来防止过时状态 Bug\n- 现有的可以帮助你驯服状态的外部解决方案\n\
    \n你可以在官方仓库14⁴ 中找到源代码。\n\n> 144 https://github.com/the-road-to-learn-react/hackernews-client/tree/5.6\n\
    \n## 生产环境的最后步骤\n\n最后章节将向你展示如何将应用程序部署到生产环境。你将使用免费托管服务 Heroku。在部署应用程序的过程中，你将学习更多关于\
    \ create-react-app 的知识。\n\n## Eject (弹出)\n\n下一步由你决定。尽管如此，create-react-app 带有一个功能，以保持其可扩展性并防止供应商锁定（vendor\
    \ lock-in）。供应商锁定通常发生在你投入某项技术但未来没有逃生口时。幸运的是，在 create-react-app 中，你有这样一个名为 \"eject\"\
    \ 的逃生口。\n\n在你的 package.json 中，你会找到启动、测试和构建应用程序的脚本。最后一个脚本是 eject。你可以尝试它，但没有路可以回了。这是一个单向操作。一旦你执行了\
    \ eject，就无法回去了！如果你刚刚开始学习 React，离开 create-react-app 方便的环境是没有意义的。\n\n如果你运行 `npm\
    \ run eject`，该命令会将所有配置和依赖复制到你的 package.json 和一个新的 config 文件夹中。你会将整个项目转换为带有包含 Babel\
    \ 和 Webpack 等工具链的自定义设置。毕竟，你将对所有这些工具拥有完全控制权。\n\n官方文档说，create-react-app 适用于小型到中项目。你不应该觉得有义务使用\
    \ \"eject\" 命令。\n\n## 练习：\n\n- 了解更多关于 eject¹⁴⁵\n\n> https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup\n\
    \n## 部署你的应用\n\n最后，没有任何应用程序应该停留在 localhost。你想上线。Heroku 是一个平台即服务（PaaS），你可以在那里托管你的应用程序。他们提供了与\
    \ React 的无缝集成。具体来说：可以在分钟内部署 create-react-app。这是一种遵循 create-react-app 哲学的零配置部署。\n\
    \n在将应用程序部署到 Heroku 之前，你需要满足要求：\n\n- 安装 Heroku CLI¹¹⁶\n- 创建免费 Heroku 账户¹¹⁷\n\n\
    如果你有 Homebrew，你可以安装：\n\n## 命令行\n\n```bash\nbrew update\nbrew install\n```\n\n\
    现在你可以使用 git 部署你的应用程序。\n\n## 命令行\n\n```bash\ngit init\ngit add .\ngit commit -m\
    \ \"deploy\"\ngit push heroku master\n```\n\n就是这样。如果你遇到问题，可以查看以下资源： \n\n- Git\
    \ 基础¹¹⁸\n- 零配置部署 React¹¹⁹\n- Firebase¹¹⁰\n\n> 146 https://www.com/\n> 147 https://www.heroku.com/\n\
    > 148 https://github.com/\n> 149 https://www.robinwieruch.de/\n> 150 https://github.com/\n\
    \n## 大纲\n\n这是本书的最后一章。希望你读得愉快，并且它帮助你进入 React 的轨道。如果你喜欢这本书，请分享给你的朋友。\n\n那么，读完这本书后你可以去哪里？如果你在为应用程序寻找进一步的扩展，我在仅使用\
    \ React 后推荐了一些学习路径：\n\n- **状态管理**：你使用了 setState() 来管理本地状态。这是一个完美的开始。然而，在较大的应用程序中，你会遇到\
    \ React 本地状态的限制¹² 因此你可以使用第三方状态管理库 Redux 或 MobX¹³ 在 Road to React 平台⁴ 上找到“驯服状态”课程，它教授了\
    \ React、Redux 和 MobX。该课程带有一个电子书，但我建议大家深入研究源代码。\n- **连接数据库或身份验证**：在一个增长的 React\
    \ 应用程序中，你可能想要持久化数据。最终数据应该存储在数据库中，以便跨浏览器会并在使用应用程序的不同用户之间共享。引入数据库最简单的方法是使用 Firebase。在这份详细的教程¹⁵\
    \ 中，你找到如何在 React 中使用 Firebase 身份验证……此外，你使用 Firebase 的实时数据库存储实体。之后，由你决定存储更多内容。\n\
