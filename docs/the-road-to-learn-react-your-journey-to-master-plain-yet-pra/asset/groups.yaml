    \ about the two lifecycle methods and when they are called. You already know them\
    \ as well. But there are more of them.\n\nThe mounting of a component has two\
    \ lifecycle methods: `componentWillMount()` and `componentDidMount()`. The constructor\
    \ is called first, `componentWillMount()` gets called before the render() method\
    \ and `componentDidMount()` is called after the render() method.\n\nOverall the\
    \ mounting process has 4 lifecycle methods. They are invoked in the following\
    \ order:\n\n- `constructor()`\n- `componentWillMount()`\n- `render()`\n- `componentDidMount()`\n\
    \nWhat about the update lifecycle of a component that happens when the state or\
    \ the props change? Overall it has 5 lifecycle methods in the following order:\n\
    \n- `componentWillReceiveProps()`\n- `shouldComponentUpdate()`\n- `componentWillUpdate()`\n\
    - `render()`\n- `componentDidUpdate()`\n\n# Getting Real with an API\n\nLast but\
    \ not least there the unmounting lifecycle. It has only one lifecycle method:\
    \ `componentWillUnmount()`.\n\nAfter all, you don't need to know all of these\
    \ lifecycle methods from the beginning. It can be intimidating yet you will not\
    \ use all of them. Even in a React application you will only use a few of them\
    \ after the `constructor()` and the `render()` method. Still, it is good to know\
    \ that each lifecycle method can be used for specific cases:\n\n- `constructor(props)`\
    \ - It is called when the component gets initialized. You can set an initial component\
    \ state and bind class methods during that lifecycle method.\n- `componentWillMount()`\
    \ - It is called before the `render()` lifecycle method. That's why it could be\
    \ used to set internal component state, because it will not trigger a second rendering\
    \ of the component. Generally it is recommended to use the `constructor()` to\
    \ set the initial state.\n- `render()` - This lifecycle is mandatory and returns\
    \ the elements as an output of the component. The method should be pure and therefore\
    \ shouldn't modify the component state. It gets input as props and returns an\
    \ element.\n- `componentDidMount()` - It is called only when the component gets\
    \ mounted. The perfect time to do an asynchronous request to fetch data from an\
