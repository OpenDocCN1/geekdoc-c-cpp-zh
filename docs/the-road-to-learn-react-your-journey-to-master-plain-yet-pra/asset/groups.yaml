    - `render()` - 该生命周期是强制性的，并返回元素作为组件的输出。该方法应该是纯净的，因此不应该修改组件状态。它接收 props 作为输入并返回一个元素。\n\
    - `componentDidMount()` - 仅在组件挂载后调用。这是执行异步请求以从 API 获取数据的完美时机。获取的数据将存储在组件内部状态中，以便在\
    \ `render()` 生命周期方法中显示。\n- `componentWillReceiveProps(nextProps)` - 该生命周期方法在更新生命周期期间调用。你作为输入接收\
    \ next props。你可以通过这些 props 将 next props 与之前的 props 进行对比（diff），并根据差异应用不同的行为。此外，你可以根据\
