- md: "\n# Basics in React\n\n# Code Playground\n\n```\n// ES5\nstring.indexOf(pattern)\
    \ !== -1\n```\n\n```\n// ES6\nstring.includes(pattern)\n```\n\nAnother neat refactoring\
    \ can be done with an ES6 arrow function. It makes the function more concise:\n\
    \n# Code Playground\n\n```\n// ES5\nfunction isSearched(searchTerm) {\n  return\
    \ function(item) {\n    return item.title.toLowerCase().indexOf(searchTerm.toLowerCase())\
    \ === -1;\n  }\n}\n```\n\n```\n// ES6\nconst isSearched = searchTerm => item =>\n\
    item.title.toLowerCase().includes(searchTerm.toLowerCase());\n```\n\nOne could\
    \ argue which function is more readable. Personally I prefer the second one. The\
    \ React ecosystem uses a lot of functional programming concepts. It happens often\
    \ that you will use a function that returns a function (higher-order functions).\
    \ In JavaScript ES6, you can express these more concisely with arrow functions.\n\
    \nBut not least, you have to use the defined `isSearched()` function to filter\
    \ the list. You pass the `searchTerm` property from your local state, it returns\
    \ the filter input function, and filters your list based on the filter condition.\
    \ Afterward it maps over the filtered list to display an element for each list\
    \ item.\n\n# Basics in React\n\nsrc/App.js\n\n```javascript\nclass App extends\
    \ Component {\n  \n  render() {\n    return (\n      <div className=\"App\">\n\
    \        <form>\n          <input\n            type=\"text\"\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        {this.state.list.filter(isSearched(this.state.searchTerm)).map(item\
    \ =>\n\n        ))}\n      </div>\n    );\n  }\n}\n```\n\nThe search functionality\
    \ should work now. Try it yourself in the browser.\n\n# Exercises:\n\n- read more\
    \ about [React events](#-48)\n- read more about [higher-order functions](#higher-order-functions-69)\n\
    \n> 48 https://reactjs.org/docs/handling-events.html\n> 69 https://en.wikipedia.org/wiki/Higher-order_function\n\
    \n# ES6 Destructuring\n\nThere is a way in JavaScript ES6 for an easier access\
    \ to properties in objects and arrays. It's called destructuring. Compare the\
    \ following snippet in JavaScript ES5 and ES6.\n\n# Code Playground\n\n```javascript\n\
    const user = {\n  firstname: 'Robin',\n  lastname: 'Wieruch'\n}\n\n// ES5\nvar\
    \ firstname = user.firstname;\nvar lastname = user.lastname;\n\nconsole.log(firstname\
    \ + ' ' + lastname);\n// output: Robin Wiesuch\n\n// ES6\nconst { firstname, lastname\
    \ } = user;\n\nconsole.log(firstname + ' ' + lastname);\n// output: Robin Wiesuch\n\
    ```\n\nWhile you have to add an extra line each time you want to access an object\
    \ property in JavaScript ES5, a best practice for readability is to use multilines\
    \ when you destructure an object into multiple properties.\n\n# Code Playground\n\
    \n```javascript\nconst {\n  firstname,\n  lastname\n} = user;\n```\n\nThe same\
    \ goes for arrays. You can destructure them too. Again, multilines will keep your\
    \ code scannable and readable.\n\n# Basics in React\n\n# Code Playground\n\n```javascript\n\
    const users = ['Robin', 'Andrew', 'Dan'];\nconst [\n  userOne,\nuserTwo,\nuserThree\n\
    ] = users;\n\nconsole.log(userOne, userTwo, userThree);\n// output: Robin Andrew\
    \ Dan\n```\n\nPerhaps you have noticed that the local state in the App component\
    \ can get destructured the same way. You can shorten the filter and map line of\
    \ code.\n\nsrc/App.js\n\n```javascript\nrender() {\n  const { searchTerm, list\
    \ } = this.state;\n  return (\n    <div className=\"App\">\n      ...\n      {list.filter(isSearched(searchTerm)).map(item\
    \ =>\n      ...)}\n    </div>\n  );\n}\n```\n\nYou can do it the ES5 or ES6 way:\n\
    \n# Code Playground\n\n```javascript\n// ES5\nvar searchTerm = this.state.searchTerm;\n\
    var list = this.state.list;\n```\n\n```javascript\n// ES6\nconst { searchTerm,\
    \ list } = this.state;\n```\n\nBut since the book uses JavaScript ES6 most of\
    \ the time, you should stick to it.\n\n# Exercises:\n\n> 70 https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment\n\
    \n# Basics in React\n\n# Controlled Components\n\nYou already learned about the\
    \ unidirectional data flow in React. The same law applies for the input field,\
    \ which updates the local state with the `searchTerm` in order to filter the list.\
    \ When the state changes, the `render()` method runs again and uses the recent\
    \ `searchTerm` from the local state to apply the filter condition.\n\nBut didn't\
    \ we forget something in the input element? A HTML input tag comes with a value\
    \ attribute. The attribute usually has the value that is shown in the input field.\
    \ In this case it would be the `searchTerm` property. However, it seems we don't\
    \ need that in React.\n\nThat's wrong. Forms as `<input>`, `<textarea>` and `<select>`\
    \ hold their own state in plain HTML. They modify the value internally when someone\
    \ changes it from the outside. In React that's called an uncontrolled component,\
    \ because it handles its own state. In React, you should make sure to make those\
    \ elements controlled components.\n\nHow should you do that? You only have to\
    \ set the value attribute of the input field.\n\nsrc/App.js\n\n```javascript\n\
    class App extends Component {\n  ...\n  render() {\n    return (\n      <div className=\"\
    App\">\n        <form>\n          <input\n            type=\"text\"\n        \
    \    onChange={this.onSearchChange}\n            value={this.state.searchTerm}\n\
    \          />\n        </form>\n        {this.state.list.filter(isSearched(this.state.searchTerm)).map(item\
    \ =>\n          ...\n        ))}\n      </div>\n    );\n  }\n}\n```\n\nThe search\
    \ functionality should work now. Try it yourself in the browser.\n\n# Split Components\n\
    \nYou have one large component growing eventually. You can split it into smaller\
    \ components.\n\nLet's use components for the search and a component for the list.\n\
    \nsrc/App.js\n\n```javascript\nclass App extends Component {\n  ...\n\n  render()\
    \ {\n    const { searchTerm, list } = this.state;\n    return (\n      <div className=\"\
    App\">\n        <Search\n        value={searchTerm}\n        onChange={this.onSearchChange}\n\
    \        />\n        <Table\n        list={list}\n      />\n      </div>\n   \
    \ );\n  }\n}\n```\n\nNow you define the components next to your App component.\
    \ Those components will be ES6 components as well. They render the same elements\
    \ like before.\n\nThe first one is the Search component.\n\n```javascript\nsrc/App.js\n\
    class Search extends Component {\n  render() {\n    const { value, onChange }\
    \ = this.props;\n    return (\n      <form>\n        <input\n          type=\"\
    text\"\n          value={value}\n          onChange={onChange}\n        />\n \
    \     </form>\n    );\n  }\n}\n```\n\nThe second one is the Table component.\n\
    \n[content-continued-corrected]\n# Basics in React\n\nsrc/App.js\n\n```javascript\n\
    class Table extends Component {\n  render() {\n    const { list, pattern, onDismiss\
    \ } = this.props;\n    return (\n      <div>\n        {list.filter(isSearched(pattern)).map(item\
    \ => (\n        <div key={item.objectId}>\n          <span>\n            <a href={item.url}>{item.title}</a>\n\
    \          </span>\n          <span>{item.author}</span>\n          <span>{item.num_comments}</span>\n\
    \          <span>{item.points}</span>\n          <span>\n            <button\n\
    \              onClick={() => onDismiss(item.objectId)}\n              type=\"\
    button\">\n              Dismiss\n            </button>\n          </span>\n \
    \       </div>\n        ))}\n      </div>\n    );\n  }\n}\n```\n\nYou now have\
    \ three ES6 class components. Perhaps you have noticed the props object that is\
    \ accessible via the class instance by using `this`. The props, short form for\
    \ properties, have all the values you have passed to the components when you used\
    \ them in your App component. That way, components can pass properties down the\
    \ component tree.\n\nBy extracting those components from the App component, you\
    \ would be able to reuse them somewhere else. Since components get their values\
    \ by using the props object, you can pass every different props to your components\
    \ when you use them somewhere else. These components became reusable.\n[/content]\
