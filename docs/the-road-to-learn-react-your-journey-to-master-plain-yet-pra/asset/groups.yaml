    \ 方法的 `onClick` 处理器是将该方法封装在另一个箭头函数中，以传递项目标识符。每当 `render()` 方法运行时，处理器都会实例化该高阶函数。这可能会对你的应用程序性能产生影响，但在大多数情况下你并不会注意到它。想象你有一个包含\
