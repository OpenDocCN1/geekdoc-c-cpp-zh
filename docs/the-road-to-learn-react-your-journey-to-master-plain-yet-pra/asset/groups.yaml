    # 关于作者


    Robin Wieruch 是一位德国软件和 Web 工程师，致力于学习和教授 JavaScript 编程。在从大学获得计算机科学硕士学位后，他从未停止过每天的自学。他在初创公司世界的经历——在工作和业余时间里他都大量使用
    JavaScript——这为他向他人教授这些主题提供了机会。


    几年来，Robin 在一家名为 Small Improvements 的公司与一个优秀的工程师团队密切合作，开发一个大型应用程序。该公司构建了一款 SaaS
    产品，允许客户创建反馈框架。在底层，该应用程序在前端和后端都使用了 JavaScript。在前端，第一个版本是用 Java 配合 Widget Framework
    和 jQuery 编写的。当第一代 SPA（单页应用）流行时，公司将前端应用迁移到了 Angular 1.X。在使用 Angular 超过 2 年后，很明显，在当时
    Angular 并不是处理此类密集型应用程序的最佳解决方案。这就是为什么公司最终转向了 React 和 Redux，这使其能够成功地进行大规模化运营。


    在公司工作期间，Robin 定期在他的个人网站上撰写关于网页开发的文章。他注意到人们会对他的文章提供反馈，这帮助他改进了自己的写作和教学风格。一篇又一篇文章，Robin
    教他人的能力日益增长。而第一篇文章充斥了太多的内容，随着时间的推移，文章通过专注于和只教授一个主题得到了改进。


    现在，Robin 自由职业教授他人。他发现，通过给学生清晰的目标和短反馈循环，看到他们茁壮成长是一项充满成就感的活动。但在反馈反馈公司，你应该学到这一点，不是吗？但如果不自己写代码，他就无法教授这些。这就是为什么他把剩余的时间投入到编程中。你可以在他的网站上找到关于
    Robin 的更多信息以及支持和和他合作的方式。


    https://www.robinwieruch.de/about


