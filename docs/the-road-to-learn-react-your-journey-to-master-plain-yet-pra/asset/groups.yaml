    # Installation


    There are multiple approaches to get started with a React application.


    The first one is to use a CDN. That may sound more complicated than it is. A CDN
    is a content delivery network. Several companies have CDNs that host files publicly
    for people to consume. These files can be libraries like React, because after
    all the bundled library is only a react.js JavaScript file. It can be hosted anywhere
    and you can include it in your application.


    How to use a CDN to get started in React? You can inline the <script> tag in your
    HTML that points to a CDN URL. To start in React you need two files (libraries):
    react and react-dom.


    # Code Playground


    ```

    <script crossorigin src="https://unpkg.com/react@16/umd/react.development.js"></script>

    <script crossorigin src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>

    ```


    But why should you use a CDN when you have to install node packages such as React?


    When your application uses a package.json file, you can install react and react-dom
    from the command line. The requirement is that the folder is initialized as my
    project using npm init -y with a package.json file. You can install multiple node
    packages in one line with npm.


    # Command Line


    ```

    npm install react-dom

    ```


    That approach is often used to add React to an existing application that is managed
    with npm.


    Unfortunately that''s not everything. You would have to deal with Babel⁶⁵ to make
    your application of JSX (the React syntax) and JavaScript ES6. Babel transpiles
    your code so that browsers can interpret JavaScript ES6 and JSX. Not all browsers
    are capable of interpreting the syntax. The setup includes a lot of configuration
    and tooling. It can be overwhelming for React newcomers to both with all the configuration.


    Because of this reason, Facebook introduced create-react-app as a zero-configuration
    React solution. The next chapter will show you how to set up your application
    using this bootstrapping tool.


    # Exercises:


    +   - read about React installations⁶⁶


    > ⁶⁴https://en.wikipedia.org/wiki/Content_delivery_network

    ⁶⁵https://babeljs.io/

    ⁶⁶https://reactjs.org/docs/try-react.html'
  - '[PAGE 21]


    # Zero-Configuration Setup


    In the Road to learn React, you will use create-react-app to bootstrap your application.
    It''s an opinionated zero-configuration starter kit for React introduced by Facebook
    in 2016. People would recommend it to beginners by 96%. In create-react-app the
    tooling and configuration evolve in the background while the focus is on the application
    implementation.


    To get started, you will have to install the package to your global node packages.
    After that, you will always have it available on the command line to bootstrap
    new React applications.


    # Command Line


    ```

    npm install -g create-react-app

    ```


    You can check the version of create-react-app to verify a successful installation
    on your command line:


    # Command Line


    ```

    create-react-app --version

    *v1.5.1

    ```


    Now you can bootstrap your first React application. We call it hackernews, but
    you can choose a different name. The bootstrapping takes a couple of seconds.
    Afterward, simply navigate into the folder:


    # Command Line


    ```

    create-react-app hackernews

    cd hackernews

    ```


    Now you can open the application in your editor. The following folder structure,
    or a variation of depending on the create-react-app version, should be presented
    to you:'
- md: "\n## Introduction to React\n\n## Folder Structure\n\n```\nhackernews/\nREADME.md\n\
    node_modules/\npackage.json\n.gitignore\npublic/\nfavicon.ico\nindex.html\nmanifest.json\n\
    src/\nApp.css\nApp.js\nApp.test.js\nindex.css\nindex.svg\nlogo.svg\nregisterServiceWorker.js\n\
    ```\n\nA short break down of the folder and files. It is fine if you don't understand\
    \ all of them in the beginning.\n\n- *README.md*: The md extension indicates that\
    \ the file is a markdown file. Markdown is used as a lightweight markup language\
    \ with plain text formatting syntax. When source code projects with a README.md\
    \ file to give you initial instructions about the project. When pushing your project\
    \ to a platform such as GitHub eventually, the README.md file will show its content\
    \ properly when you access the repository. Because you have used create-react-app,\
    \ your README.md will be the same as shown in the official create-react-app GitHub\
    \ repository.$^{49}$\n- *node_modules/: The folder contains all packages that\
    \ were installed via npm. Since you have used create-react-app, there should be\
    \ a couple of node modules installed for you. Usually you will never touch this\
    \ folder, but only install and uninstall node packages with the command line.\n\
    - *package.json*: The file shows you a list of node package dependencies and other\
    \ project configuration.\n- *.gitignore*: The file indicates all files and folders\
    \ that shouldn't be added to your remote repository when using it. It should only\
    \ live in your local project. The node_modules/ folder is such a case. It is sufficient\
    \ to share the package.json file with your peers to enable them to install all\
    \ dependencies on their own without sharing the whole dependency folder.\n\n>\
    \ $^{49}$https://github.com/facebookincubator/create-react-app\n\n- *public/*:\
    \ The folder holds all your files when building your project for production. Eventually\
    \ all your written code in the `src/` folder will be bundled into a couple of\
    \ files when building your project and placed in the public folder.\n- *manifest.json*\
    \ and *registerServiceWorker.js*: don't worry about what these files do at this\
    \ stage, we won't needing them in this project.\n\nAfter all, you don't need to\
    \ touch the mentioned files and folders. In the beginning everything you need\
    \ is located in the `src/App.js` file to implement React components. It will be\
    \ used to implement your application, but you might want to split your components\
    \ into multiple files whereas each file maintains one a few components on its\
    \ own.\n\nAdditionally, you will find a `src/App.test.js` for your tests and `src/index.js`\
    \ as entry point to the React world. You will get to know both files in a later\
    \ chapter. In addition, there is a `src/index.css` file to style your general\
    \ application and your components. They all come with default style when you open\
    \ them.\n\nThe `create-react-app` application is a npm project. You use npm to\
    \ install and uninstall node packages to your project. Additionally it comes with\
    \ the following npm scripts for your command line:\n\n## Command Line\n\n```\n\
    // Runs the application in http://localhost:3000\nnpm start\n```\n\n```\n// Runs\
    \ the tests\nnpm test\n```\n\n```\n// Builds the application for production\n\
    npm run build\n```\n\nThe scripts are defined in your `package.json`. Your boilerplate\
    \ React application is bootstrapped. The exciting part comes in the exercises\
    \ to finally run your bootstrapped application in the browser.\n\n## Exercises:\n\
    \n- *npm start* your application and visit the application in your browser (you\
    \ can exit the command by pressing Ctrl + C)\n- run the interactive `npm test`\
    \ script\n- run the `npm run build` script and verify that a `build/` folder was\
    \ added to your project (you can remove it again afterward; note that the build\
    \ folder can be used later on to deploy your application^{50})\n\n> 50https://www.robinwieruch.de/deploy-applications-digital-ocean/\n\
    \n- make yourself familiar with the folder structure\n- make yourself familiar\
    \ with the content of the files\n- read more about the npm scripts and create-react-app\n\
    \n> https://github.com/facebookincubator/create-react-app\n\n## Introduction to\
    \ JSX\n\nNow you get to know JSX. It is the syntax in React. As mentioned before,\
    \ create-react-app has already bootstrapped a boilerplate application for you.\
    \ All files with default implementations. Let's dive into the source code. The\
    \ only file you touch in the beginning will be the `src/App.js` file.\n\n```javascript\n\
    src/App.js\nimport React, { Component } from 'react';\nimport logo from './logo.svg';\n\
    import './App.css';\n\nclass App extends Component {\n  render() {\n    <div className=\"\
    App\">\n      <header className=\"App-header\">\n        <img src={logo} className=\"\
    App-logo\" alt=\"logo\" />\n        <h1 className=\"App-title\">Welcome to React</h1>\n\
    \      </header>\n      <p className=\"App-intro\">\n        To get started, edit\
    \ <code>src/App.js</code> and save to reload.\n      </p>\n    </div>\n  }\n}\n\
    export default App;\n```\n\nDon't let yourself confused by import/export statements.\
    \ These features are already JavaScript. We will revisit this in a later chapter.\
    \ In the file you have declared a React component with the name App. It is a component\
    \ declaration. Basically after you have declared a component, you can use it everywhere\
    \ in your application. It will produce an instance of your component or in other\
    \ words: the element is specified in the `render()` method. Elements are what\
    \ components are made of. It is useful to understand the differences between component,\
    \ instance and element. Pretty soon, you will see where the component is instantiated.\
    \ Otherwise you wouldn't see the rendered output in the browser. The component\
    \ is only the declaration, but not the usage. You would instantiate the component\
    \ somewhere in your JSX.\n\nThe content in the render block looks pretty similar\
    \ to HTML, but it's JSX. JSX allows you to mix HTML and JavaScript. That's why\
    \ a good starting point is to use basic HTML in your JSX. In the beginning, remove\
    \ all the distracting content in the file.\n\n```javascript\nsrc/App.js\nimport\
    \ React, { Component } from 'react';\nimport './App.css';\n\nclass App extends\
    \ Component {\n  render() {\n    <div className=\"App\">\n      <h2>Welcome to\
    \ learn React</h2>\n    </div>\n  }\n}\nexport default App;\n```\n\nNow, you only\
    \ return HTML in your `render()` method without JavaScript. Let's define the \"\
    Welcome to learn React\" as a variable. A variable can be used in your JSX using\
    \ curly braces.\n\n```javascript\nsrc/App.js\nimport React, { Component } from\
    \ 'react';\nimport './App.css';\n\nclass App extends Component {\n  render() {\n\
    \    var helloWorld = 'Welcome to learn React';\n    <div className=\"App\">\n\
    \      <h2>{helloWorld}</h2>\n    </div>\n  }\n}\nexport default App;\n```\n\n\
    ## Introduction to React\n\nIt should work when you start your application on\
    \ the command line with `npm start`. Additionally you might have noticed the `className`\
    \ attribute. It reflects the standard attribute in HTML. Because of technical\
    \ reasons, JSX had to replace a handful of internal HTML attributes. You can find\
    \ all of the supported HTML attributes in the React documentation52. They all\
    \ follow the camelCase convention. On your way to learn React, you will come across\
    \ more JSX attributes.\n\n## Exercises:\n\n- define more variables and render\
    \ them in your JSX\n- use a complex object to represent a user with a first name\
    \ and last name\n- render the user properties in your JSX\n- read more about JSX53\n\
    - read more about React components, elements and instances54\n\n> 52https://reactjs.org/docs/dom-elements.html#all-supported-html-attributes\n\
    > 53https://reactjs.org/docs/introducing-jsx.html\n> 54https://facebook.github.io/react/blog/2015/12/18/react-components-elements-and-instances.html\n\
    \n## ES6 const and let\n\nI guess you noticed that we declared the variable hello\
    \ with a `var` statement. JavaScript ES6 comes with two more options to declare\
    \ your variables: `const` and `let`. In JavaScript ES6, you will rarely find `var`\
    \ anymore.\n\nA variable declared with `const` cannot be re-assigned or redecl.\
    \ It cannot be mutated (changed, modified). You embrace immutable data structures\
    \ by using it. Once the data structure is defined, you cannot change it.\n\nCode\
    \ Playground\n\n```javascript\n// not allowed\nconst hello = 'Welcome to learn\
    \ React';\nhello = 'Bye Bye React';\n```\n\nA variable declared with `let` can\
    \ get mutated.\n\nCode Playground\n```javascript\n// allowed\nlet hello = 'Welcome\
    \ to learn React';\nhello = 'Bye Bye React';\n```\n\nYou would use it when you\
    \ would need to re-assign a variable.\n\nHowever, you have to be careful with\
    \ `const`. A variable declared with `const` cannot be modified. But when the variable\
    \ is an array or object, the value it holds can get updated. The value it holds\
    \ is not immutable.\n\nCode Playground\n\n```javascript\nconst hello = {\n  text:\
    \ 'Welcome to learn React';\n};\nhello.text = 'Bye Bye React';\n```\n\nBut when\
    \ to use each declaration? There are different opinions about the usage. I suggest\
    \ using `const` when you can. It indicates that you want to keep your data structure\
    \ immutable even though values in objects and arrays can be modified. If you want\
    \ to modify your variable, you can use `let`.\n"
