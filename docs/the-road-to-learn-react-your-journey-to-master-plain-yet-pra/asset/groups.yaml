    - 阅读更多关于 React 中的 Jest ¹16 \n\n> ¹16https://facebook.github.io/jest/docs/tutorial-react.html\n\
    \n## 使用 Enzyme 进行单元测试\n\nEnzyme¹¹¹ 是 Airbnb 提供的一种测试工具，用于断言、操作和遍历你的 React 组件。你可以使用它进行单元测试，以补充你在\
