    \ 生态系统使用了大量的函数编程概念。你经常会使用一个返回函数的函数（高阶函数）。在 JavaScript ES6 中，你可以用箭头函数更简洁地表达这些内容。\n\
    \n但同样或重要的是，你必须使用定义的 `isSearched()` 函数来过滤列表。你从本地状态中传递 `searchTerm` 属性，它返回一个过滤输入函数，并根据过滤条件过滤你的列表。之后，它对过滤后的列表进行\
    \ map 操作，为每个列表项显示一个元素。\n\n# React 基础\n\nsrc/App.js\n\n```javascript\nclass App\
