  - "[PAGE 119]\n\n# Client Cache\n\nEach search submit makes a request to the Hacker\
    \ News API. You might search for \"redux\", followed by \"react\" and eventually\
    \ \"redux\" again. In total it makes 3 requests. But you searched for \"redux\"\
    \ twice and both times it took a whole asynchronous roundtrip to fetch the Data.\
    \ In a client-sided cache you would store each result. When a request to the API\
    \ is made, it checks if a result is already there. If it is, the cache is used.\
    \ Otherwise an API request is made to fetch the data.\n\nIn order to have a client\
    \ cache for each result, you have to store multiple results rather than one result\
    \ in your internal component state. The results object will be a map with the\
    \ search term as key as value. Each result from the API will be saved by search\
    \ term (key).\n\nAt the moment, the result in the local state looks similar to\
    \ the following:\n\n# Code Playground\n\n```\nresult: {\n  hits: [ ... ],\n  page:\
    \ 2,\n}\n```\n\nImagine you have made two API requests. One for the search term\
    \ \"redux\" and another one for \"react\". The results object should look like\
    \ the:\n\n# Code Playground\n\n```\nresults: {\n  redux: {\n    hits: [ ... ],\n\
    \    page: 2,\n  },\n  react: {\n    hits: [ ... ],\n    page: 1,\n  },\n  ...\n\
    }\n```\n\nLet's implement a client-side cache with React useState(). First, rename\
    \ the result object to results in the initial component state. Second, define\
    \ a temporary searchKey which is used to store each result."
