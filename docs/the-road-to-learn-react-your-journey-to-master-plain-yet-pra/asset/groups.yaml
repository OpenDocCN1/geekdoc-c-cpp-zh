    \ + DEFAULT_QUERY;\n```\n\n```javascript\nconsole.log(url);\n// output: https://hn.algolia.com/api/v1/search?query=redux\n\
    ```\n\nThat will keep your URL construction flexible in the future.\nBut let's\
    \ get to the API request where you will use the url.\n\n# Getting Real with an\
    \ API\n\nsrc/App.js\n\n```javascript\nclass App extends Component {\n  constructor(props)\
