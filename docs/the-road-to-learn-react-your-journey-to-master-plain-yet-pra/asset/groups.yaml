    \          onDismiss={this.onDismiss}\n        />\n      </div>\n    );\n  }\n\
    }\n```\n\nNow the Search component can destructure the children property from\
    \ the props object. Then it can specify where the children should be displayed.\n\
    \n## Basics in React\n\n```\nsrc/App.js\n\nclass Search extends Component {\n\
    \  render() {\n    const { value, onChange, children } = this.props;\n    return\
