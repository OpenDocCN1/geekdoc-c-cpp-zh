    \ {\nconst { hits, page } = result;\n\nthis.setState(prevState => {\nconst { searchKey,\
    \ results } = prevState;\n\noldHits = results && results[searchKey]\n? results[searchKey].hits\n\
    : [];\n\nconst updatedHits = [\n...oldHits,\n...hits\n];\n\nreturn {\nresults:\
    \ {\n...results,\n[searchKey]: { hits: updatedHits, page }\n},\nisLoading: false\n\
    };\n});\n```\n\nThat will fix the issue with stale state. There is one more improvement.\
    \ Since it is a function, you can extract the function for improved readability.\
    \ That's one more advantage to use a function over an object. The function can\
    \ live outside of the component. But you have to use a higher-order function to\
