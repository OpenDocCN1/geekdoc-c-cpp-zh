- md: "\n# Loading ...\n\nNow let's get back to the application. You might want to\
    \ show a loading indicator when you submit a search request to the Hacker News\
    \ API. The request is asynchronous and you should show your user some feedback\
    \ that something is to happen. Let's define a reusable Loading component in your\
    \ `src/App.js`.\n\n```javascript\nsrc/App.js\nconst Loading = () =>\n  <div>Loading\
    \ ...</div>\n```\n\nNow you will need a property to store the loading state. Based\
    \ on the loading state you can decide to show the Loading component later on.\
    \ \n\n```javascript\nsrc/App.js\nclass App extends Component {\n  _isMounted =\
    \ false;\n\n  constructor(props) {\n    super(props);\n\n    this.state = {\n\
    \      results: null,\n      searchKey: '',\n      searchTerm: DEFAULT_QUERY,\n\
    \      error: null,\n      isLoading: false,\n    }\n  }\n\n  ...\n}\n```\n\n\
    The initial value of `isLoading` property is false. You don't load anything before\
    \ the App component is mounted.\n\nWhen you make the request, you set a loading\
    \ state to true. Eventually the request will succeed and you can set the loading\
    \ state to false.\n\n```javascript\nsrc/App.js\nclass App extends Component {\n\
    \  ...\n  setSearchTopStories(result) {\n    ...\n    this.setState({\n      results:\
    \ {\n        ...results,\n        [searchKey]: { hits: updatedHits, page }\n \
    \     },\n      isLoading: false\n    });\n  }\n\n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    this.setState({ isLoading: true });\n  }\n\n  axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}\\\
    \n${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n    .then(result => this._isMounted &&\
    \ this.setSearchTopStories(result.data))\n    .catch(error => this._isMounted\
    \ && this.setState({ error }));\n  }\n}\n```\n\nIn the last step, you will use\
    \ the Loading component in your App. A conditional rendering based on the loading\
    \ state will decide whether you show a Loading component or the Button component.\
    \ The latter one is your button to fetch more data.\n\n```javascript\nsrc/App.js\n\
    class App extends Component {\n  ...\n  render() {\n    const {\n      searchTerm,\n\
    \      results,\n      searchKey,\n      error,\n      isLoading\n    } = this.state;\n\
    \n    return (\n      <div className=\"page\">\n        ...\n        <div className=\"\
    interactions\">\n          {isLoading\n            ? <Loading />\n           \
    \ : <Button\n                onClick={() => this.fetchSearchTopStories(searchKey,\
    \ page + 1)}>\n                More\n              </Button>\n          }\n  \
    \      </div>\n      </div>\n    );\n  }\n}\n```\n\nInitially the Loading component\
    \ will show up when you start your application, because you make a request on\
    \ `componentDidMount()`. There is no Table component, because the list is empty.\
    \ When the response returns from the Hacker News API, the result is shown, the\
    \ loading state is set to false and the Loading component disappears. Instead,\
    \ the \"More\" button to fetch more data appears. Once you fetch more data, the\
    \ button will disappear again and the Loading component will show up.\n\n## Exercises:\n\
    \n- use a library such as Font Awesome[^126](http://fontawesome.io/) to show a\
    \ loading icon instead of the “Loading ...” text.\n\n[^126]: http://fontawesome.io/\n\
    \n## Higher-Order Components\n\nHigher-order components (HOC) is an advanced concept\
    \ in React. HOCs are an equivalent to higher-order functions. They take any input\
    \ - most of the time a component, but also optional arguments - return a component\
    \ as output. The returned component is an enhanced version of the input component\
    \ and can be used in your JSX.\n\nHOCs are used for different use cases. They\
    \ can prepare properties, manage state or alter the representation of a component.\
    \ One use case could be use a HOC as a helper for a conditional rendering. Imagine\
    \ you have a List component that renders a list of items or nothing, because the\
    \ list is empty or null. On the other hand, the plain List component doesn't need\
    \ to bother anymore about an non existent list. It only cares about rendering\
    \ the list.\n\nLet's do in your `src/App.js` which takes a component as input\
    \ and returns a component. You can place it in your `src/App.js` file.\n\n```javascript\n\
    src/App.js\nfunction withFoo(Component) {\n  return function(props) {\n    return\
    \ <Component {...props} />;\n  }\n}\n```\n\n```javascript\nsrc/App.js\nconst withFoo\
    \ = (Component) => (props) =>\n  <Component {...props} />\n```\n\nOne neat convention\
    \ is to prefix the naming of HOC with. Since you are using ES6, you can express\
    \ the HOC more concisely with arrow function. In the example, the input component\
    \ would stay the same as the output component. Nothing happens. It renders the\
    \ same and passes all of the props to the output component. But that's useless.\
    \ Let's enhance the output component. The output component should show the Loading\
    \ component when the loading state is true, otherwise it should show the input\
    \ component. A conditional rendering is a great use case for HOC.\n\n```javascript\n\
    src/App.js\nconst withLoading = (Component) => (props) =>\n  props.isLoading\n\
    \    ? <Loading />\n    : <Component {...props} />\n```\n\nIn general it can be\
    \ very efficient to spread an object like the props in the previous example, as\
    \ input for a component. See the following snippet.\n\n```javascript\n// before\
    \ you would have to destructure the props before passing them\nconst { foo, bar\
    \ } = props;\n<SomeComponent foo={foo} bar={bar} />\n\n// but you can use the\
    \ object spread to pass all properties\n<SomeComponent {...props} />\n```\n\n\
    There is one little thing that you should avoid: pass all the props including\
    \ isLoading property by spreading the object into input component. However, the\
    \ input component may not care about isLoading property. You can use ES6 rest\
    \ destructuring to avoid it.\n\n```javascript\nsrc/App.js\nconst withLoading =\
    \ (Component) => ({ isLoading, ...rest }) =>\n  isLoading\n    ? <Loading />\n\
    \    : <Component {...rest} />\n```\n\nIt takes one property of the object, but\
    \ it takes the remaining object it works as well. You might have already read\
    \ about it in destructuring assignment[^2](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Destructuring_assignment).\n\
    \nNow you can use the HOC in JSX. An use case in the application could be either\
    \ the “More” button or the Loading component. The Loading component is already\
    \ encapsulated in the HOC, but in case of showing a Button component or a Loading\
    \ component, the Button is the input component of the HOC. The enhanced output\
    \ component is ButtonWithLoading component.\n\n[^2]: https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Destructuring_assignment\n\
    \n```javascript\nsrc/App.js\nconst Button = ({\n  onClick = '',\n  className,\n\
    \  children,\n}) => (\n  <button\n    onClick={onClick}\n    className={className}\n\
    \    type=\"button\"\n  >\n    {children}\n  </button>\n)\n```\n\n```javascript\n\
    src/App.js\nconst Loading = () => (\n  <div>Loading...</div>\n)\n```\n\n```javascript\n\
    src/App.js\nconst withLoading = (Component) => ({ isLoading, ...rest }) => (\n\
    \  isLoading\n    ? <Loading />\n    : <Component {...rest} />\n)\n```\n\nconst\
    \ ButtonWithLoading = withLoading(Button);\n\nEverything is defined now. As a\
    \ last step, you have to use the ButtonWithLoading component, which receives the\
    \ loading state as an additional property. While the HOC consumes the loading\
    \ property, all other props get passed to the Button component.\n\n```javascript\n\
    src/App.js\nclass App extends Component {\n  ...\n  render() {\n    ...\n    return\
    \ (\n      <div className=\"page\">\n        ...\n        <div className=\"interactions\"\
    >\n          <ButtonWithLoading\n            isLoading={isLoading}\n         \
    \ />\n        </div>\n      </div>\n    )\n  }\n}\n```\n\n```javascript\nonClick={()\
    \ => this.fetchSearchTopStories(searchKey, page + 1)}\nMore\n</ButtonWithLoading>\n\
    </div>\n</div>\n);\n}\n```\n\nWhen you run your tests again, you will notice that\
    \ your snapshot test for the App component fails. The diff might look like the\
    \ following on the command line:\n\n## Command Line\n\n+ - <button\n  class=\"\
    \"\n  onClick={[Function]}\n  type=\"button\"\n>\n- More\n- </button>\n+ <div>\n\
    + Loading ...\n+ </div>\n\nYou can either fix the component now, when you think\
    \ there is something wrong about it, or can accept the new snapshot of it. Because\
    \ you introduced the Loading component in this chapter, you can accept the altered\
    \ snapshot test on the command line in the interactive test.\n\nHigher-order components\
    \ are an advanced technique in React. They have multiple purposes like improved\
    \ reusability of components, greater abstraction, composability of components\
    \ and manipulations of props, state and view. Don't worry if you don't understand\
    \ them immediately. It takes time to get to them.\n\nI encourage you to read the\
    \ gentle introduction to higher-order components[^128](https://www.robinwierch.de/gentle-introduction-higher-order-components/).\
    \ It gives you another approach to learn them, shows you an elegant way to use\
    \ them in a functional programming way and specifically solves the problem of\
    \ conditional rendering with higher-order components.\n\n## Exercises:\n\n- read\
    \ a gentle introduction to higher-order components[^129](https://www.robinwierch.de/gentle-introduction-higher-order-components/)\n\
    \n[^128]: https://www.robinwierch.de/gentle-introduction-higher-order-components/\n\
    [^129]: https://www.robinwierch.de/gentle-introduction-higher-order-components/\n"
  mdcn: "\n\n# 加载中 ...\n\n现在让我们回到应用程序。当你向 Hacker News API 提交搜索请求时，可能想要显示一个加载指示器。请求是异步的，你应该给用户提供一些反馈，告知某些操作正在发生。让我们在\
    \ `src/App.js` 中定义一个可用的 `Loading` 组件。\n\n```javascript\nsrc/App.js\nconst Loading\
    \ = () =>\n  <div>Loading ...</div>\n```\n```\n\n现在，你需要一个属性来存储加载状态。根据加载状态，你可以决定以后是否显示\
    \ `Loading` 组件。\n\n```javascript\nsrc/App.js\nclass App extends Component {\n\
    \  _isMounted = false;\n\n  constructor(props) {\n    super(props);\n\n    this.state\
    \ = {\n      results: null,\n      searchKey: '',\n      searchTerm: DEFAULT_QUERY,\n\
    \      error: null,\n      isLoading: false,\n    }\n  }\n\n  ...\n}\n```\n\n\
    `isLoading` 属性的初始值为 `false`。在 App 组件挂载之前，你不会加载任何内容。\n\n当你发送请求时，将加载状态设置为 `true`。请求最终会成功，然后你可以将加载状态设置为\
    \ `false`。\n\n```javascript\nsrc/App.js\nclass App extends Component {\n  ...\n\
    \  setSearchTopStories(result) {\n    ...\n    this.setState({\n      results:\
    \ {\n        ...results,\n        [searchKey]: { hits: updatedHits, page }\n \
    \     },\n      isLoading: false\n    });\n  }\n\n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    this.setState({ isLoading: true });\n  }\n\n  axios(`${PATH_BASE}${PATH_SEARCH}?${PARAM_SEARCH}${searchTerm}&${PARAM_PAGE}\\\
    \n${page}&${PARAM_HPP}${DEFAULT_HPP}`)\n    .then(result => this._isMounted &&\
    \ this.setSearchTopStories(result.data))\n    .catch(error => this._isMounted\
    \ && this.setState({ error }));\n  }\n}\n```\n\n在最后一步，你将在 App 中使用 `Loading` 组件。基于加载状态的条件渲染将决定显示\
    \ `Loading` 组件还是 `Button` 组件。后者是你获取更多数据的按钮。\n\n```javascript\nsrc/App.js\nclass\
    \ App extends Component {\n  ...\n  render() {\n    const {\n      searchTerm,\n\
    \      results,\n      searchKey,\n      error,\n      isLoading\n    } = this.state;\n\
    \n    return (\n      <div className=\"page\">\n        ...\n        <div className=\"\
    interactions\">\n          {isLoading\n            ? <Loading />\n           \
    \ : <Button\n                onClick={() => this.fetchSearchTopStories(searchKey,\
    \ page + 1)}>\n                More\n              </Button>\n          }\n  \
    \      </div>\n      </div>\n    );\n  }\n}\n```\n\n最初当你启动应用程序时，`Loading` 组件将会显示，因为你在\
    \ `componentDidMount()` 中发送了请求。此时没有 `Table` 组件，因为列表是空的。当响应从 Hacker News API 返回时，结果将显示，加载状态被设置为\
    \ `false`，`Loading` 组件消失。相反，获取更多数据的“More”按钮会出现。一旦获取了更多数据，按钮将再次消失，`Loading` 组件将再次显示。\n\
    \n## 练习：\n\n- 使用如 Font Awesome[^126](http://fontawesome.io/) 之类的库来显示加载图标，而不是“Loading\
    \ ...”文本。\n\n[^126]: http://fontawesome.io/\n\n## 高阶组件 (Higher-Order Components)\n\
    \n高阶组件（HOC）是 React 中的一个高级概念。HOC 等同于高阶函数。它们接受任何输入——大多数情况下是组件，但也可能是可选参数——并返回一个组件作为输出。返回的组件是输入组件的增强版本，可以在你的\
    \ JSX 中使用。\n\nHOC 用于不同的用例。它们可以准备属性、管理状态或更改组件的表示形式。一个用例是将 HOC 用作条件渲染的辅助工具。假设你有一个\
    \ `List` 组件，它可以渲染项目列表或者什么都不渲染（因为列表为空或为 null）。另一方面，普通的 `List` 组件不再需要担心不存在的列表了。它只关心渲染列表。\n\
    \n让我们在 `src/App.js` 中实现一个接收组件作为输入并返回组件的函数。你可以将其放在 `src/App.js` 文件中。\n\n```javascript\n\
    src/App.js\nfunction withFoo(Component) {\n  return function(props) {\n    return\
    \ <Component {...props} />;\n  }\n}\n```\n\n```javascript\nsrc/App.js\nconst withFoo\
    \ = (Component) => (props) =>\n  <Component {...props} />\n```\n\n一个整洁的约定是用 `with`\
    \ 前缀对 HOC 命名。由于你正在使用 ES6，可以使用箭头函数更简洁地表示 HOC。在示例中，输入组件与输出组件保持相同。什么都没有发生。它渲染相同的内容，并将所有\
    \ props 传递给输出组件。但这没有用处。让我们增强输出组件。当加载状态为 `true` 时，输出组件应该显示 `Loading` 组件，否则它应该显示输入组件。条件渲染是\
    \ HOC 的一个极佳用例。\n\n```javascript\nsrc/App.js\nconst withLoading = (Component) =>\
    \ (props) =>\n  props.isLoading\n    ? <Loading />\n    : <Component {...props}\
    \ />\n```\n\n通常情况下，将像上示例中的 props 对象展开并作为组件的输入是非常高效的。看下面的代码片段。\n\n```javascript\n\
    // 之前你必须在传递之前对 props 进行解构\nconst { foo, bar } = props;\n<SomeComponent foo={foo}\
    \ bar={bar} />\n\n// 但你可以使用对象展开来传递所有属性\n<SomeComponent {...props} />\n```\n\n\
    有一点你应该避免：通过展开对象将包括 `isLoading` 属性在内的所有 props 传递给输入组件。然而，输入组件可能不在 `isLoading` 属性。你可以使用\
    \ ES6 剩余解构来避免这一点。\n\n```javascript\nsrc/App.js\nconst withLoading = (Component)\
    \ => ({ isLoading, ...rest }) =>\n  isLoading\n    ? <Loading />\n    : <Component\
    \ {...rest} />\n```\n\n它获取了对象中的一个属性，但剩余的对象也同样有效。你可能已经读过关于解构赋值[^2](https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Destructuring_assignment)\
    \ 了。\n\n现在你可以在 JSX 中使用这个 HOC 了。应用程序中的一个用例可以是“More”按钮也可以是 `Loading` 组件。`Loading`\
    \ 组件已经封装在 HOC 中，但在需要显示 `Button` 组件或 `Loading` 组件的情况下，`Button` 是 HOC 的输入组件。增强后的输出组件是\
    \ `ButtonWithLoading` 组件。\n\n[^2]: https://developer.mozilla.org/en-US/docs/JavaScript/Reference/Destructuring_assignment\n\
    \n```javascript\nsrc/App.js\nconst Button = ({\n  onClick = '',\n  className,\n\
    \  children,\n}) => (\n  <button\n    onClick={onClick}\n    className={className}\n\
    \    type=\"button\"\n  >\n    {children}\n  </button>\n)\n```\n\n```javascript\n\
    src/App.js\nconst Loading = () => (\n  <div>Loading...</div>\n)\n```\n\n```javascript\n\
    src/App.js\nconst withLoading = (Component) => ({ isLoading, ...rest }) => (\n\
    \  isLoading\n    ? <Loading />\n    : <Component {...rest} />\n)\n```\n\nconst\
    \ ButtonWithLoading = withLoading(Button);\n\n现在一切都定义好了。最后一步，你必须使用 `ButtonWithLoading`\
    \ 组件，它接收加载状态作为一个额外属性。当 HOC 消耗了加载属性时，其他属性都会传递给 `Button` 组件。\n\n```javascript\n\
    src/App.js\nclass App extends Component {\n  ...\n  render() {\n    ...\n    return\
    \ (\n      <div className=\"page\">\n        ...\n        <div className=\"interactions\"\
    >\n          <ButtonWithLoading\n            isLoading={isLoading}\n         \
    \ />\n        </div>\n      </div>\n    );\n  }\n}\n```\n\n当你再次运行测试时，你会发现 App\
    \ 组件的快照测试失败了。差异在命令行可能如下：\n\n## 命令行\n\n+ - <button\n  class=\"\"\n  onClick={[Function]}\n\
    \  type=\"button\"\n>\n- More\n- </button>\n+ <div>\n+ Loading ...\n+ </div>\n\
    \n高阶组件是 React 中的一种高级技术。它们有多个用途，如提高组件的可重用性、增强抽象、组合组合，以及对属性、状态和视图的操作。如果你不能立即理解它们，不要担心。这需要时间。\n\
    \n我鼓励你阅读高阶组件的温和介绍[^128](https://www.robinwierch.de/gentle-introduction-higher-order-components/)。它为你提供了另一种学习方法，展示了如何以函数式编程的方式使用它们，并专门解决了高阶组件进行条件渲染的问题。\n\
    \n## 练习：\n\n- 阅读高阶组件的温和介绍[^129](https://www.robinwierch.de/gentle-introduction-higher-order-components/)\n\
    \n[^128]: https://www.robinwierch.de/gentle-introduction-higher-order-components/\n\
    [^129]: https://www.robinwierch.de/gentle-introduction-higher-order-components/\n\
    \n"
