- md: "\nsrc/App.js\n\n```javascript\nonDismiss(id) {\n  const isNotId = item => item.objectID\
    \ !== id;\n  const updatedList = this.state.list.filter(isNotId);\n  this.setState({\
    \ list: updatedList });\n}\n```\n\nNow run again your application and try the\
    \ \"Dismiss\" button. It should work. What you experience now is the unidirectional\
    \ data flow in React. You trigger an action in your view with onClick(), a function\
    \ or class method modifies the internal component state and the render() method\
    \ of the component runs again to update the view.\n\n# Exercises:\n\n- read more\
    \ about the state and lifecycle in React^67\n\n> 67 https://reactjs.org/docs/state-and-lifecycle.html\n\
    \n# Bindings\n\nIt is important to learn about bindings in JavaScript classes\
    \ when using React ES6 class components.\nIn the previous chapter, you have bound\
    \ your class method onDismiss() in the constructor.\n\nsrc/App.js\n\n```javascript\n\
    class App extends Component {\n  constructor(props) {\n    super(props);\n   \
    \ this.state = {\n      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n...}\n```\n\nWhy would you do that in the first place? The binding step\
    \ is necessary, because class methods do automatically bind this to the class\
    \ instance. Let's demonstrate it with the help of the following ES6 class component.\n\
    \n# Code Playground\n\n```javascript\nclass ExplainBindingsComponent extends Component\
    \ {\n  onClickMe() {\n    console.log(this);\n  }\n\n  render() {\n    return\
    \ (\n      <button\n        onClick={this.onClickMe}\n        type=\"button\"\
    >\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n# Basics in React\n\
    \nThe component renders just fine, but when you click the button, you will get\
    \ undefined in your developer console log. That's a main source of bugs using\
    \ React, because if you want to access this.state in your class method, it cannot\
    \ be retrieved because this is undefined. So in order to make this accessible\
    \ in your class methods, you have to bind the class methods to this.\n\nIn the\
    \ following component the class method is properly bound in the class constructor.\n\
    \n# Code Playground\n\n```javascript\nclass ExplainBindingsComponent extends Component\
    \ {\n  constructor() {\n    super();\n  }\n\n  this.onClickMe = this.onClickMe.bind(this);\n\
    \n  onClickMe() {\n    console.log(this);\n  }\n\n  render() {\n    return (\n\
    \      <button\n        onClick={this.onClickMe}\n        type=\"button\"\n  \
    \    >\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\nWhen trying\
    \ the button again, this object, to be more specific the class instance, should\
    \ be defined and you would be able to access this.state, or as you will later\
    \ learn this.props, now.\n\nThe class method binding can happen somewhere else\
    \ too. For instance\n\n# Basics in React\n\n# Code Playground\n\n```javascript\n\
    class ExplainBindingsComponent extends Component {\n  onClick() {\n    console.log(this);\n\
    \  }\n\n  render() {\n    return (\n      <button\n        onClick={this.onClick.bind(this)}\n\
    \        type=\"button\"\n      >\n        Click Me\n      </button>\n    );\n\
    \  }\n}\n```\n\nBut you should avoid it, because it would bind the class method\
    \ every time when the render() method runs. Basically it runs every time your\
    \ component updates which leads to performance implications. When binding the\
    \ class method in the constructor, you bind it only once in the beginning when\
    \ the component is instantiated. That’s a better approach to do it.\n\nAnother\
    \ thing people sometimes come up with is defining the business logic of their\
    \ class methods in the constructor.\n\n# Code Playground\n\n```javascript\nclass\
    \ ExplainBindingsComponent extends Component {\n  constructor() {\n    super();\n\
    \    this.onClick = () => {\n      console.log(this);\n    }\n  }\n\n  render()\
    \ {\n    return (\n      <button\n        onClick={this.onClick}\n        type=\"\
    button\"\n      >\n    );\n  }\n}\n```\n\n```javascript\n> Click Me\n</button>\n\
    );\n```\n\nYou should avoid it too, because it will clutter your constructor over\
    \ time. The constructor is only there to instantiate your class with all its properties.\
    \ That's why the business logic of class methods should be defined outside of\
    \ the constructor.\n\n# Code Playground\n\n```javascript\nclass ExplainBindingsComponent\
    \ extends Component {\n  constructor() {\n    super();\n    this.doSomething =\
    \ this.doSomething.bind(this);\n    this.doSomethingElse = this.doSomethingElse.bind(this);\n\
    \  }\n\n  doSomething() {\n    // do something\n  }\n\n  doSomethingElse() {\n\
    \    // do something else\n  }\n  }\n```\n\nLast but not least, it is worth to\
    \ mention that class methods can be autobound automatically without binding them\
    \ explicitly by using JavaScript ES6 arrow functions.\n\n# Code Playground\n\n\
    ```javascript\nclass ExplainBindingsComponent extends Component {\n  onClick =\
    \ () => {\n    console.log(this);\n  }\n\n  render() {\n    return (\n      <button\n\
    \        onClick={this.onClick}\n        type=\"button\"\n      >\n        Click\
    \ Me\n      </button>\n    );\n  }\n}\n```\n\nIf the repetitive binding in the\
    \ constructor annoys you, you can go ahead with this approach instead. The official\
    \ React documentation sticks to the class method bindings in the constructor.\
    \ That's why the book will stick to those as well.\n\n# Exercises:\n\n- try the\
    \ different approaches of bindings and console log the this object\n\n# Event\
    \ Handler\n\nThe chapter should give you a deeper understanding of event handlers\
    \ in elements. In your application, you are using the following button element\
    \ to dismiss an item from the list.\n\nsrc/App.js\n\n```javascript\n<button\n\
    \  onClick={() => this.onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n\
    </button>\n```\n\nThat's already a complex use case, because you have to pass\
    \ a value to the class method and thus you have to wrap it into another (arrow)\
    \ function. So basically, it has to be a function that is passed to the event\
    \ handler. The following code wouldn't work, because the class method would be\
    \ executed immediately when you open the application in the browser.\n\nsrc/App.js\n\
    \n```javascript\n<button\n  onClick={this.onDismiss(item.objectID)}\n  type=\"\
    button\"\n>\n  Dismiss\n</button>\n```\n\nWhen using onClick={this.onDismiss(item.objectID)}\
    \ the class method would be executed immediately when you open the application\
    \ in the browser. The expression in the handler is evaluated. Since the returned\
    \ value of the function isn't a function, nothing would happen when you click\
    \ the button. But when using onClick={this.onDismiss(item.objectID)} whereas doSomething\
    \ is a function, it would be executed when clicking the button. The same rules\
    \ apply for the onDismiss() class method that is used in your application.\n\n\
    # Basics in React\n\nHowever, using onClick={this.dismiss} wouldn't suffice, because\
    \ somehow the item.objectID property needs to be passed to the class method to\
    \ identify the item that is going to be dismissed. That's why it can be wrapped\
    \ into another function. The concept is called in JavaScript and will be explained\
    \ later on.\n\nsrc/App.js\n\n```javascript\n<button\n  onClick={() => this.dismiss(item.objectID)}\n\
    \  type=\"button\"\n>\n  Dismiss\n</button>\n```\n\nA workaround would be to define\
    \ the wrapping function somewhere outside and only pass the defined function to\
    \ the handler. Since it needs access to the individual item, it has to live the\
    \ inside of the map block.\n\nsrc/App.js\n\n```javascript\nclass App extends Component\
    \ {\n\nrender() {\n  return (\n    <div className=\"App\">\n      {this.state.list.map(item\
    \ => {\n        const onDismiss = (item) => {\n        return (\n          <div\
    \ key={item.objectID}>\n            <span>\n              <a href={item.url}>{item.title}</a>\n\
    \            </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        )\n      })})}\n\
    \    </div>\n  )\n}\n```\n"
  mdcn: "\n\nsrc/App.js\n\n```javascript\nonDismiss(id) {\n  const isNotId = item\
    \ => item.objectID !== id;\n  const updatedList = this.state.list.filter(isNotId);\n\
    \  this.setState({ list: updatedList });\n}\n```\n\n现在再次运行你的应用程序并尝试“Dismiss”（移除）按钮。它应该可以工作。你现在体验到\
    \ React 中的单向数据流。你通过 `onClick()` 在视图中触发了一个动作，一个函数或类方法修改了组件内部状态，组件的 `render()` 方法会再次运行以更新视图。\n\
    \n# 练习：\n\n- 更多关于 React 中的状态（state）和生命周期^67\n\n> 67 https://reactjs.org/docs/state-and-lifecycle.html\n\
    \n# 绑定 (Bindings)\n\n在使用 React ES6 类组件时，学习 JavaScript 类中的绑定（bindings）是非常重要的。\n\
    在之前的章节中，你已经在构造函数（constructor）中绑定了类方法 `onDismiss()`。\n\nsrc/App.js\n\n```javascript\n\
    class App extends Component {\n  constructor(props) {\n    super(props);\n   \
    \ this.state = {\n      list,\n    };\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n...}\n```\n\n你起初为什么要这样做呢？绑定步骤是必要的，因为类方法不会自动将 `this` 绑定到类实例。让我们通过下面的 ES6\
    \ 类组件来演示这一点。\n\n# 代码游场 (Code Playground)\n\n```javascript\nclass ExplainBindingsComponent\
    \ extends Component {\n  onClickMe() {\n    console.log(this);\n  }\n\n  render()\
    \ {\n    return (\n      <button\n        onClick={this.onClickMe}\n        type=\"\
    button\">\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n# React 基础\n\
    \n组件渲染完全正常，但当你点击按钮时，你会在开发者控制台日志得到 `undefined`。这是使用 React 时产生错误的主要来源，因为如果你想在类方法中访问\
    \ `this.state`，将无法获取它，因为 `this` 是 `undefined`。所以，为了在类方法中可以访问它，你必须将类方法绑定到 `this`。\n\
    \n在下面的组件中，类方法在类的构造函数中被正确绑定。\n\n# 代码游场 (Code Playground)\n\n```javascript\nclass\
    \ ExplainBindingsComponent extends Component {\n  constructor() {\n    super();\n\
    \  }\n\n  this.onClickMe = this.onClickMe.bind(this);\n\n  onClickMe() {\n   \
    \ console.log(this);\n  }\n\n  render() {\n    return (\n      <button\n     \
    \   onClick={this.onClickMe}\n        type=\"button\"\n      >\n        Click\
    \ Me\n      </button>\n    );\n  }\n}\n```\n\n再次尝试点击按钮时，这个对象（具体来说是类实例）应该是定义的，你现在可以访问\
    \ `this.state`，或者正如你之后会学到的 `this.props`。\n\n类方法的绑定也可以发生在其他地方。例如：\n\n# React 基础\n\
    \n# 代码游场 (Code Playground)\n\n```javascript\nclass ExplainBindingsComponent extends\
    \ Component {\n  onClick() {\n    console.log(this);\n  }\n\n  render() {\n  \
    \  return (\n      <button\n        onClick={this.onClick.bind(this)}\n      \
    \  type=\"button\"\n      >\n        Click Me\n      </button>\n    );\n  }\n\
    }\n```\n\n但你应该避免这样做，因为每当 `render()` 方法运行时它都会绑定一次类方法。基本上，它在你的组件每次更新时都会运行，这会导致性能影响。在构造函数中绑定类方法，你只在组件实例化之初绑定一次。这是一种更好的做法。\n\
    \n人们有时会提到的另一件事是在构造函数中定义类方法的业务逻辑。\n\n# 代码游场 (Code Playground)\n\n```javascript\n\
    class ExplainBindingsComponent extends Component {\n  constructor() {\n    super();\n\
    \    this.onClick = () => {\n      console.log(this);\n    }\n  }\n\n  render()\
    \ {\n    return (\n      <button\n        onClick={this.onClick}\n        type=\"\
    button\"\n      >\n    );\n  }\n}\n```\n\n```javascript\n> Click Me\n</button>\n\
    );\n```\n\n你也应该避免这样做，因为随着时间的推移，这会让你的构造函数变得杂乱。构造函数的作用只是带所有属性实例化你的类。这就是为什么类方法的业务逻辑应该定义在构造函数之外。\n\
    \n# 代码游场 (Code Playground)\n\n```javascript\nclass ExplainBindingsComponent extends\
    \ Component {\n  constructor() {\n    super();\n    this.doSomething = this.doSomething.bind(this);\n\
    \    this.doSomethingElse = this.doSomethingElse.bind(this);\n  }\n\n  doSomething()\
    \ {\n  }\n\n  doSomethingElse() {\n  }\n}\n}\n```\n\n最后但同样，值得提到类方法可以使用箭头函数自动绑定，而不需要显式绑定。\n\
    \n# 代码游场 (Code Playground)\n\n```javascript\nclass ExplainBindingsComponent extends\
    \ Component {\n  onClick = () => {\n    console.log(this);\n  }\n\n  render()\
    \ {\n    return (\n      <button\n        onClick={this.onClick}\n        type=\"\
    button\"\n      >\n        Click Me\n      </button>\n    );\n  }\n}\n```\n\n\
    如果你对构造函数中的绑定感到困扰，可以采用这种方法。React 文档也提到了这一点。\n\n# 练习：\n\n- 尝试绑定的各种方法并打印 `this` 对象\n\
    \n# 事件处理器 (Event Handler)\n\n在你的应用程序中，你使用以下按钮来移除列表中的项。\n\nsrc/App.js\n\n```javascript\n\
    <button\n  onClick={() => onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n\
    </button>\n```\n\n这已经是一个复杂的用例了，因为你必须向类方法传递一个值，因此你必须将其封装在另一个函数中。基本上，它必须是传递给事件处理器的函数。以下代码将不起作用，因为类方法会在你打开浏览器应用程序时立即执行。\n\
    \nsrc/App.js\n\n```javascript\n<button\n  onClick={onDismiss(item.objectID)}\n\
    \  type=\"button\"\n>\n  Dismiss\n</button>\n```\n\n当使用 `onClick={onDismiss(item.objectID)}`\
    \ 时，类方法会在打开浏览器应用程序时立即执行。处理器中的表达式会被求值。由于该函数的返回值不是函数，点击按钮时将什么都不会发生。但当使用 `onClick={onDismiss(item.objectID)}`\
    \ 且 `onDismiss` 是一个函数时，点击按钮时会执行。相同的规则适用于你应用程序中的 `onDismiss()` 类方法。\n\n# React\
    \ 基础\n\n然而，使用 `onClick={this.dismiss}` 是不够的，因为某种程度上需要将 `item.objectID` 属性传递给类方法，以识别要移除的项。这就是为什么它可以封装在另一个函数中。这个概念在\
    \ JavaScript 中被称为，并在之后解释。\n\nsrc/App.js\n\n```javascript\n<button\n  onClick={()\
    \ => this.dismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n</button>\n\
    ```\n\n一种变通是在外部定义封装函数，并只将定义的函数传递给处理器。由于它需要访问项目，它必须存在于 `map` 块内部。\n\nsrc/App.js\n\
    \n```javascript\nclass App extends Component {\n\nrender() {\n  return (\n   \
    \ <div className=\"App\">\n      {this.state.list.map(item => {\n        const\
    \ onDismiss = (item) => {\n        return (\n          <div key={item.objectID}>\n\
    \            <span>\n              <a href={item.url}>{item.title}</a>\n     \
    \       </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        )\n      })})}\n\
    \    </div>\n  )\n}\n}\n```\n\n"
