    \ <form onSubmit={onSubmit}>\n      <input\n        type=\"text\"\n        value={value}\n\
    \        onChange={onChange}\n        ref={(node) => input = node}\n      />\n\
    \      <button type=\"submit\">\n        {children}\n      </button>\n    </form>\n\
    \  );\n}\n```\n\nNow you would be able to access the input DOM element. In the\
    \ example of the focus use case it wouldn't help you, because you have no lifecycle\
