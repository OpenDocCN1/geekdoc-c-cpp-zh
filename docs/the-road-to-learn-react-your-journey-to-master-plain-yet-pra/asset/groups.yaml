    \ React';\n    return (\n      <div className=\"App\">\n        <h2>{helloWorld}</h2>\n\
    \      </div>\n    );\n  }\n}\n```\n\n```javascript\nexport default App;\n```\n\
    \n## 练习：\n\n- 关于 ES6 const⁵\n- 更多 ES6 let⁶\n- 深入研究不可变数据结构\n  - 为什么它们在通用编程中是有意义的\n\
    \  - 为什么在 React 及其生态系统中使用了它们\n\n> ⁵⁵https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    > ⁶https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n## ReactDOM\n\n在你继续学习 App 组件之前，你可能想先看看它在哪里被使用。它位于你进入 React 世界的入口点：src/index.js\
    \ 文件。\n\n```javascript\nsrc/index.js\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport App from './App';\nimport './index.css';\n```\n\n\
    ```javascript\nReactDOM.render(\n  <App />,\n  document.getElementById('root')\n\
    );\n```\n\nReactDOM.render() 使用你 HTML 中的一个 DOM 节点将其替换为你的 JSX。这就是你如何轻松将 React 集成到每个应用程序中。并不是在应用程序中多次调用\
    \ ReactDOM.render()。你可以在多个地方使用它来引导 JSX 语法、单个 React 组件、多个 React 组件或整个应用程序。但在纯 React\
    \ 应用程序中，你只需要使用一次来引导你的整个组件树。\n\nReactDOM.render() 接收两个参数。第一个参数是待渲染的 JSX。第二个参数指定\
    \ React 应用程序挂载到你的 HTML 的位置。它期望一个 id='root' 的元素。你可以打开 public/index.html 文件来找到 id\
    \ 属性。\n\n在实现中，ReactDOM.render() 已经接收了你的 App 组件。不过，只要是 JSX，传递更简单的 JSX 也是可以的。它不必是一个组件的实例化。\n\
    \n## 代码沙场\n\n```javascript\nReactDOM.render(\n  <h1>Hello World</h1>,\n  document.getElementById('root')\n\
    );\n```\n\n## 练习：\n\n- 打开 public/index.html 查看 React 应用程序是如何挂载到 HTML 中的\n- 更多关于在\
    \ React 中渲染元素⁵\n\n> ⁵https://reactjs.org/docs/rendering-elements.html\n\n## 热模块替换\
    \ (Hot Module Replacement)\n\n你可以在 src/index.js 文件中做一件事来提升你作为开发体验。但它是可选的，在刚学习\
    \ React 时不应该让你感到无所措。\n\n在 create-react-app 中，当你更改源代码时，浏览器会自动刷新页面，这是一个优势。尝试更改 src/App.js\
    \ 文件中的 `helloWorld` 变量。浏览器应该会刷新页面。但有一种更好的方法。\n\n热模块替换 (HMR) 是一种在浏览器中重新加载应用程序的工具。浏览器不会执行页面刷新。在\
    \ create-react-app 中，在你的 src/index.js（进入 React 的入口点）中，你需要添加一个小小的配置。\n\nsrc/index.js\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import App from './App';\nimport './index.css';\n\nReactDOM.render(\n  <App />,\n\
    \  document.getElementById('root')\n);\n\nif (module.hot) {\n  module.hot.accept();\n\
    }\n```\n\n就是这样。再次更改 src/App.js 文件中的 `helloWorld` 变量。浏览器不应该执行页面刷新，但应用程序会重新加载并显示正确的输出。HMR\
    \ 有许多优势：\n\n想象你正在使用 `console.log()` 语句进行调试。即使你更改了代码，这些语句也会保留在你的开发者控制台中，因为浏览器不再刷新页面。这对于调试目的非常方便。\n\
    \n在一个不断增长的应用程序中，页面刷新会降低你的效率。你需要等待页面加载。页面重新加载可能需要几秒钟。\n"
