    Introduction to React


    # Folder Structure


    ```

    hackernews/

    README.md

    node_modules/

    package.json

    .gitignore

    public/

    favicon.ico

    index.html

    manifest.json

    src/

    App.css

    App.js

    App.test.js

    index.css

    index.svg

    logo.svg

    registerServiceWorker.js

    ```


    A short break down of the folder and files. It is fine if you don''t understand
    all of them in the beginning.


    +   * README.md: The md extension indicates that the file is a markdown file.
    Markdown is used as a lightweight markup language with plain text formatting syntax.
    When source code projects with a README.md file to give you initial instructions
    about the project. When pushing your project to a platform such as GitHub eventually,
    the README.md file will show its content properly when you access the repository.
    Because you have used create-react-app, your README.md will be the same as shown
    in the official create-react-app GitHub repository.$^{49}$

    * node_modules/: The folder contains all packages that were installed via npm.
    Since you have used create-react-app, there should be a couple of node modules
    installed for you. Usually you will never touch this folder, but only install
    and uninstall node packages with the command line.

    * package.json: The file shows you a list of node package dependencies and other
    project configuration.

    * .gitignore: The file indicates all files and folders that shouldn''t be added
    to your remote repository when using it. It should only live in your local project.
    The node_modules/ folder is such a case. It is sufficient to share the package.json
    file with your peers to enable them to install all dependencies on their own without
    sharing the whole dependency folder.


    > $^{49}$httpsgithub.com/facebookincubator/create-react-app'
  - '[PAGE 23]


    # Introduction to React


    +   * `public/`: The folder holds all your files when building your project for
    production. Eventually all your written code in the `src/` folder will be bundled
    into a couple of files when building your project and placed in the public folder.

    * `manifest.json` and `registerServiceWorker.js`: don''t worry about what these
    files do at this stage, we won''t needing them in this project.


    After all, you don''t need to touch the mentioned files and folders. In the beginning
    everything you need is located in the `src/App.js` file to implement React components.
    It will be used to implement your application, but you might want to split your
    components into multiple files whereas each file maintains one a few components
    on its own.


    Additionally, you will find a `src/App.test.js` for your tests and `src/index.js`
    as entry point to the React world. You will get to know both files in a later
    chapter. In addition, there is a `src/index.css` file to style your general application
    and your components. They all come with default style when you open them.


    The `create-react-app` application is a npm project. You use npm to install and
    uninstall node packages to your project. Additionally it comes with the following
    npm scripts for your command line:


    # Command Line


    ```

    // Runs the application in http://localhost:3000

    npm start

    ```


    ```

    // Runs the tests

    pm test

    ```


    ```

    // Builds the application for production

    npm run build

    ```


    The scripts are defined in your `package.json`. Your boilerplate React application
    is bootstrapped. The exciting part comes in the exercises to finally run your
    bootstrapped application in the browser.


    # Exercises:


    +   * `npm start` your application and visit the application in your browser (you
    can exit the command by pressing Ctrl + C)

    * run the interactive `npm test` script

    * run the `npm run build` script and verify that a `build/` folder was added to
    your project (you can remove it again afterward; note that the build folder can
    be used later on to deploy your application^{50})


    > 50https://www.robinwieruch.de/deploy-applications-digital-ocean/'
