    \ another HOC would make sense\n  - implement the HOC, if there is a use case\n\
    \n## Advanced React Components\n\n161\n\n## Advanced Sorting\n\nYou have already\
    \ implemented a client- and server-side search interaction. Since you have a Table\
    \ component, it would make sense to enhance the Table with advanced interactions.\
    \ What about introducing a sort functionality for each column by using the column\
    \ headers of the Table?\n\nIt would be possible to write your own sort function,\
    \ but personally I prefer to use a utility library for such cases. Lodash¹³⁰ is\
    \ one of these utility libraries, but you can use whatever library suits you.\
    \ Let's install Lodash and use it for the sort functionality.\n\nCommand Line\n\
    \n```bash\nnpm install lodash\n```\n\nNow you can import the sort functionality\
    \ of Lodash in your src/App.js file.\n\nsrc/App.js\n\n```javascript\nimport React,\
    \ { Component } from 'react';\nimport axios from 'axios';\nimport { sortBy } from\
    \ 'lodash';\nimport './App.css';\n```\n\nYou have several columns in your Table.\
    \ There are title, author, comments and points columns. You can define sort functions\
    \ whereas each function takes a list and returns a list of items sorted by a specific\
    \ property. Additionally, you will need one default sort function which doesn't\
    \ sort but only returns the unsorted list. That will be your initial state.\n\n\
    src/App.js\n\n```javascript\nconst SORTS = {\n  NONE: list => list,\n  TITLE:\
    \ list => sortBy(list, 'title'),\n  AUTHOR: list => sortBy(list, 'author'),\n\
    \  COMMENTS: list => sortBy(list, 'num_comments').reverse(),\n  POINTS: list =>\
    \ sortBy(list, 'points').reverse(),\n};\n\nclass App extends Component {\n  ...\n\
    }\n```\n\n> ¹³⁰https://lodash.com/\n\n## Advanced React Components\n\n162\n\n\
    You can see that two of the sort functions return a reversed list. That's because\
    \ you want to see the items with the highest comments and points rather than to\
    \ see the items with the lowest counts when you sort the list for the first time.\n\
    \nThe SORTS object allows you to reference any sort function. Again your App component\
    \ is responsible for storing the state of the sort. The initial state will be\
    \ the default sort function, which doesn't sort at all and returns the input list\
    \ as output.\n\nsrc/App.js\n\n```javascript\nthis.state = {\n  results: null,\n\
    \  searchKey: '',\n  searchTerm: DEFAULT_QUERY,\n  error: null,\n  isLoading:\
    \ false,\n  sortKey: 'NONE'\n};\n```\n\nOnce you choose a different sort key,\
    \ let's say the AUTHOR key, you will sort the list with the appropriate sort function\
    \ from the SORTS object.\n\nNow you can define a new method in your App component\
    \ that simply sets a sortKey to your local state. Afterward, the sortKey can be\
    \ used to retrieve the sorting function to apply it on your list.\n\nsrc/App.js\n\
    \n```javascript\nclass App extends Component {\n  _isMounted = false;\n\n  constructor(props)\
    \ {\n    ...\n    this.needsToSearchTopStories = this.needsToSearchTopStories.bind(this);\n\
    \    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n    this.fetchSearchTopStories\
    \ = this.fetchSearchTopStories.bind(this);\n    this.onSearchSubmit = this.onSearchSubmit.bind(this);\n\
    \    this.onSearchChange = this.onSearchChange.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n    this.onSort = this.onSort.bind(this);\n  }\n\
    \n  onSort(sortTable) {\n    this.setState({ sortKey });\n  }\n}\n```\n\nThe next\
    \ step is to pass the method and sortKey to your Table component.\n\nsrc/App.js\n\
    \n```javascript\nclass App extends Component {\n  ...\n  render() {\n    const\
    \ {\n      searchTerm,\n      results,\n      searchKey,\n      error,\n     \
    \ isLoading,\n      sortKey\n    } = this.state;\n    ...\n    return (\n    \
    \  <div className=\"page\">\n        ...\n        <Table\n          list={list}\n\
    \          sortTable={sortKey}\n          onSort={this.onSort}\n          onDismiss={this.onDismiss}\n\
    \        />\n      </div>\n    );\n  }\n}\n```\n\nThe Table component is responsible\
    \ for sorting the list. It takes one of the SORT functions by sortKey and passes\
    \ the list as input. Afterward it keeps mapping over the sorted list.\n\nsrc/App.js\n\
    \n```javascript\nconst Table = ({\n  list,\n  sortKey,\n  onSort,\n  onDismiss\n\
    }) => (\n  <div className=\"table\">\n    {SORTS[sortKey](list).map(item => (\n\
    \      <div key={item.objectID} className=\"table-row\">\n      </div>\n    ))}\n\
    \  </div>\n)\n```\n\nIn theory the list would get sorted by one of the functions.\
    \ But the default sort is set to NONE, so nothing is sorted yet. So for no one\
    \ executes the onPress() method to change the sortKey. Let's extend the Table\
    \ with a row of column headers that use Sort components in columns to sort each\
    \ column.\n\nsrc/App.js\n\n```javascript\nconst Table = ({\n  list,\n  sortKey,\n\
    \  onSort,\n  onDismiss\n}) => (\n  <div className=\"table\">\n    <div className=\"\
    table-header\">\n      <Sort onClick={() => onSort('TITLE')} active={sortKey ===\
    \ 'TITLE'}>Title</Sort>\n      <Sort onClick={() => onSort('AUTHOR')} active={sortKey\
    \ === 'AUTHOR'}>Author</Sort>\n      <Sort onClick={() => onSort('COMMENTS')}\
    \ active={sortKey === 'COMMENTS'}>Comments</Sort>\n      <Sort onClick={() =>\
    \ onSort('POINTS')} active={sortKey === 'POINTS'}>Points</Sort>\n    </div>\n\
    \    {SORTS[sortKey](list).map(item => (\n      <div key={item.objectID} className=\"\
    table-row\">\n      </div>\n    ))}\n  </div>\n)\n```\n\n## Advanced React Components\n\
    \n178\n\n## Advanced React Components\n\n179\n\n## Advanced React Components\n\
