    \ this props, to apply a different behavior based on the diff. Additionally, you\
    \ can set state on the next props.\n- `shouldComponentUpdate(nextProps, nextState)`\
    \ - It is always called when the component updates due to state or changes. You\
    \ will use it in React applications for performance optimizations. Depending on\
    \ a boolean that return from this lifecycle method, the component and all its\
    \ children will render or not render on an update lifecycle. You can prevent the\
