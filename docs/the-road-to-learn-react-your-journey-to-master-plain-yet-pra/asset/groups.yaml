    \n但让我们回到实际操作。这些 `import` 和 `export` 语句是如何工作的？接下来的示例通过在两个文件之间共享一个或多个变量来展示这些语句。最后，这种方法可以扩展到多个文件并共享比简单变量更多的内容。\n\
