    \     [searchKey]: { hits: updatedHits, page }\n    },\n    isLoading: false\n\
    \  });\n}\n```\n\nYou extract values from the state, but update the state depending\
    \ on the previous state asynchronously. Now you can use the functional approach\
    \ to prevent bugs because of a stale state.\n\nsrc/App.js\n\n```javascript\nsetSearchTopStories(result)\
