    # Basics in React


    The chapter will guide you through the basics of React. It covers state and interactions
    in components, because static components are a bit dull, aren’t they? Additionally,
    you will learn about the different ways to declare a component and how to keep
    components composable and reusable. Be prepared to breathe life into your components.'
  - "[PAGE 43]\n\n# Internal Component State\n\nInternal component state, also known\
    \ as local state, allows you to save, modify and delete properties that are stored\
    \ in your component. The ES6 class component can use a constructor to initialize\
    \ internal component state later on. The constructor is called only once when\
    \ the component initializes.\n\nLet’s introduce a class constructor.\n\nsrc/App.js\n\
    \n```\nclass App extends Component {\n\n  constructor(props) {\n    super(props);\n\
    \  }\n\n  ...\n\n}\n```\n\nWhen having a constructor in your ES6 class component,\
    \ it is mandatory to call super(); because the App component is a subclass of\
    \ Component. Hence the extends Component in your component declaration. You will\
    \ learn more about ES6 class components later on.\n\nYou can call super(props);\
    \ as well. It sets this.props in your constructor in case you want to access them\
    \ in the constructor. Otherwise, when accessing this.props in your constructor,\
    \ they would be undefined. You will learn more about the props of a React component\
    \ later on.\n\nNow, in your case, the initial state in your component should be\
    \ the sample list of items.\n\nsrc/App.js\n\n```\nconst list = [\n{\n  title:\
    \ 'React',\n  url: 'https://facebook.github.io/react/',\n  author: 'Jordan Walke',\n\
    \  num_comments: 3,\n  points: 4,\n  objectID: 0,\n  ...\n},\n];\n```"
- md: "\n## Basics in React\n\n```\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      list: list,\n    };\n  }\n\
    \  ...\n}\n```\n\nThe state is bound to the class by using the this object. Thus\
    \ you can access the local state in your whole component. For instance, it can\
    \ be used in the render() method. Previously you have mapped a static list of\
    \ items in your render() method that was defined outside of your component. You\
    \ are about to use the list from your local state in your component.\n\nsrc/App.js\n\
    \n```\nclass App extends Component {\n  ...\n  render() {\n    return (\n    \
    \  <div className=\"App\">\n        {this.state.list.map(item => (\n         \
    \ <div key={item.objectID}>\n            <span>\n              <a href={item.url}>{item.title}</a>\n\
    \            </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n          </div>\n        ))}\n     \
    \ </div>\n    );\n  }\n}\n```\n\n# Basics in React\n\nThe list is part of the\
    \ component now. It resides in the internal component state. You could add items,\
    \ change items or remove items in and from your list. Every time you change your\
    \ component state, the render() method of your component will run again. That's\
    \ how you can simply change your internal component state and be sure that the\
    \ component re-renders and displays the correct data that comes from the local\
    \ state.\n\nBut careful. Don't mutate the state directly. You have to use a method\
    \ called setState() to modify your state. You will get to know it in a following\
    \ chapter.\n\n# Exercises:\n\n- * experiment with the local state\n  - define\
    \ initial state in the constructor\n  - use and access the state in your render()\
    \ method\n- read more about the ES6 class constructor⁶⁵\n\n> ⁶⁵https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Classes#Constructor\n\
