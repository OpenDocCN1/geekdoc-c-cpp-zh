- md: "\n# Requirements\n\nIf you are coming from a different SPA framework or library,\
    \ you should already be familiar with the basics of web development. If you have\
    \ just started in web development, you should feel comfortable with HTML, CSS\
    \ and JavaScript ES5 to learn React. The book will smoothly transition to JavaScript\
    \ ES6 and beyond. I encourage you to join the official Slack Group³⁹ for the book\
    \ to get help or to help others.\n\n# Editor and Terminal\n\nWhat about the development\
    \ environment? You will need a running editor or IDE and terminal (command line\
    \ tool). You can follow my setup guide⁴⁰ It is adjusted for MacOS users, but you\
