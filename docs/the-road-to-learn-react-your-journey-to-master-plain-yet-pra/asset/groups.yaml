  - '[PAGE 203]


    # Eject


    The following step is it to you. Still, create-react-app comes with one feature
    to keep it extendable also to prevent a vendor lock-in. A vendor lock-in usually
    happens when you buy into a technology but there is no escape hatch using in the
    future. Fortunately in create-react-app you have such an escape hatch with "eject".


    In your package.json you will find the scripts to start, test and build your application.
    The last script is eject. You could try it, but there is no way back. It is a
    one-way operation. Once you eject, you can''t go back! If you just started to
    learn React, it makes no sense to leave the convenient environment of create-react-app.


    If you would run npm run eject, the command would copy all the configuration and
    dependencies to your package.json and a new config folder. You would convert the
    whole project into a custom setup with tooling that includes Babel and Webpack.
    After all, you would have full control over all these tools.


    The official documentation says that create-react-app is suitable for small to
    mid size projects. You shouldn''t feel obligated to use the "eject" command.


    # Exercises:


    +   read more about eject¹⁴⁵


    > https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup'
  - '[PAGE 204]


    # Deploy your App


    In the end, no application should stay on localhost. You want to go live. Heroku
    is a platform as a service where you host your application. They offer a seamless
    integration with React. To be more specific: It''s possible to deploy a create-react-app
    in minutes. It is a zero-configuration deployment which follows the philosophy
    of create-react-app.


    You need to fulfill requirements before you can deploy your application to Heroku:


    +   - install the Heroku CLI^{146}

    - create a free Heroku account^{147}


    If you have installed Homebrew, you can install the Heroku CLI from command line:


    # Command Line


    ```

    brew update

    brew install heroku-toolbelt

    ```


    Now you can use git and Heroku CLI to deploy your application.


    # Command Line


    ```

    git init

    heroku create -b https://github.com/mars/create-react-app-buildpack.git

    git add

    git commit -m "react-create-app on Heroku"

    git push heroku master

    heroku open

    ```


    That''s it. Hope your application is up and running. If you run into problems
    you can check the following resources:


    +   - Git and GitHub Essentials^{148}

    - Deploying React with Zero Configuration^{149}

    - Heroku Buildpack for create-react-app^{150}


    > ^^{146}https://deventer.heroku.com/articles/heroku-command-line

    ^{147}https://www.heroku.com/

    ^{148}https://www.zohinwierch.de/git-essential-commands/

    ^{149}https://blog.heroku.com/deploying-react-with-zero-configuration

    ^{150}https://github.com/mars/create-react-app-buildpack'
