    # Snapshot Tests with Jest\n\nThe book will not dive deeply into the topic of\
    \ testing, but it's unmentioned. Testing your code in programming is essential\
    \ and seen as mandatory. Perhaps you have heard about the testing pyramid. There\
    \ are end-to-end tests, integration tests and unit tests. If you are not familiar\
    \ with those, the book gives you a quick overview. A unit is used to test an isolated\
    \ and small block of code. It can be a single function that is tested by unit\
    \ test. However, sometimes the units work well in isolation yet don't work in\
    \ combination with other units. They may need to be tested as a group. That's\
    \ where integration tests can help out by covering whether units work together.\
    \ But not least, the end-to-end test is the simulation of a real user scenario.\
    \ It is automated in a browser. While unit tests are fast and easy to write and\
    \ maintain, end-to-end tests are the opposite. How many tests of each type? You\
    \ want to have many unit tests to cover your functions. After that, you can need\
    \ several integration tests to cover the most important functions in combination.\
    \ But not least, you might want to have only a few end-to-end tests to simulate\
    \ critical scenarios in your application.\n\nSo do you apply this to testing in\
    \ your React application? The foundation for testing in React are component tests\
    \ which can be generalized as unit tests and part as snapshot tests. In this chapter,\
    \ you will focus on another kind of tests: snapshot tests. That's where Jest comes\
    \ in.\n\nJest is a JavaScript testing framework that is used at Facebook. In the\
    \ React community, it is used for component tests. Fortunately, create-react-app\
    \ already comes with Jest, so you don't need to worry about setting it up. Let's\
    \ start to test your components. Before you can do that, you have to export the\
    \ components you are going to test from your src/App.js. Afterward you can test\
    \ them in a different file. You learned about this in the code organization chapter.\n\
    \nhttps://facebook.io/jest/\n\n# Code Organization and Testing\n\nsrc/App.js\n\
    \n```\nclass App extends Component {\n}\n```\n\n```\nexport default App;\n\nexport\
    \ {\n  Button,\n  Search,\n  Table,\n}\n```\n\nIn your App.test.js file, you will\
    \ find a first test that came with create-react-app. It verifies that the App\
    \ component would render without any errors.\n\nsrc/App.test.js\n\n```\nimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from './App';\n\
    \nit('renders without crashing', () => {\n  const div = document.createElement('div');\n\
    \  ReactDOM.render(<App />, div);\n  ReactDOM.unmountComponentAtNode(div);\n});\n\
    ```\n\nThe \"it\" block describes one test case. It comes with a test description\
    \ and when you want to test it, it can either succeed or fail. Furthermore, you\
    \ could wrap it into a \"describe\" block that defines your test suite. A test\
    \ could include a bunch of \"it\" blocks for specific component. You will see\
    \ those \"describe\" blocks later on. Both blocks are used to separate and organize\
    \ your test cases.\n\nNote that the it function is acknowledged in the JavaScript\
    \ community as the function where you run a single test. However, in Jest it is\
    \ often found as an alias function.\n\nYou can run your test cases using the interactive-react-app\
    \ test script on the command line. You will get the output for all test cases\
    \ on your command line interface.\n\n# Command Line\n\n```\nnpm test\n```\n\n\
    Jest enables you to write snapshot tests. These tests make a snapshot of a rendered\
    \ component and run this snapshot against future snapshots. When a future snapshot\
    \ changes, you will get notified in the test. You can either accept the snapshot\
    \ change, because you changed the component implementation on purpose, or deny\
    \ the change and investigate for the error. It complements unit tests very well,\
    \ because you only test the diff of the rendered output. It doesn't add big maintenance\
    \ costs, because you can simply accept changed snapshots when you changed something\
    \ on the snapshots for the rendered output in your component.\n\nJest stores the\
    \ snapshots in a folder. Only that way can it validate the diff against a future\
    \ snapshot. Additionally, the snapshots can be shared across teams by having them\
    \ in one folder.\n\nBefore writing your first snapshot test with Jest, you have\
    \ to install a utility library.\n\n# Command Line\n\n```\nnpm install --save-dev\
    \ react-test-renderer\n```\n\nYou can now extend the App component with your first\
    \ snapshot test. First, import the functionality from the node package and wrap\
    \ your previous \"it\" block for the App component into a descriptive \"describe\"\
    \ block. In this case, the test suite is only for the App component.\n\n```\n\
    src/App.test.js\n```\n\n```\nimport React from 'react';\nimport ReactDOM from\
    \ 'react-dom';\nimport renderer from 'react-test-renderer';\nimport App from './App';\n\
    describe('App', () => {\n  it('renders without crashing', () => {\n    const div\
    \ = document.createElement('div');\n    ReactDOM.render(<App />, div);\n    ReactDOM.unmountComponentAtNode(div);\n\
    \  });\n});\n```\n\nYou can now implement your first snapshot test by using a\
    \ \"test\" block.\n"
