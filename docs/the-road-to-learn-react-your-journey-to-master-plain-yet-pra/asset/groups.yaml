  mdcn: "\n\n- 尝试你创建的 HOC\n- 思考一个另一个 HOC 可能合理的用例\n  - 如果存在用例，则实现该 HOC\n\n## 高级 React\
    \ 组件\n\n161\n\n## 高级排序\n\n你已经实现了客户端和服务器端的搜索交互。由于你有一个 `Table` 组件，因此通过高级交互来增强 `Table`\
    \ 是很有意义的。通过使用 `Table` 的列标题来为每一列引入排序功能如何？\n\n你可以编写自己的排序函数，但我个人更倾向于在类情况下使用工具库。Lodash¹³⁰\
    \ 是这些工具库之一，但你也可以使用任何适合你的库。让我们安装 Lodash 并使用它来实现排序功能。\n\n命令行\n\n```bash\nnpm install\
    \ lodash\n```\n\n现在，你可以在可以的 `src/App.js` 文件中导入 Lodash 的排序功能。\n\nsrc/App.js\n\n\
    ```javascript\nimport React, { Component } from 'react';\nimport axios from 'axios';\n\
    import { sortBy } from 'lodash';\nimport './App.css';\n```\n\n你的 `Table` 中有几列，包括标题（title）、作者（author）、评论（comments）和分数（points）。你可以定义排序函数，每个函数接受一个列表并返回一个按特定属性排序的项列表。此外，你还需要一个默认排序函数，它不进行排序，仅返回未排序的列表。这将是初始状态。\n\
    \nsrc/App.js\n\n```javascript\nconst SORTS = {\n  NONE: list => list,\n  TITLE:\
    \ list => sortBy(list, 'title'),\n  AUTHOR: list => sortBy(list, 'author'),\n\
    \  COMMENTS: list => sortBy(list, 'num_comments').reverse(),\n  POINTS: list =>\
    \ sortBy(list, 'points').reverse(),\n};\n\nclass App extends Component {\n  ...\n\
    }\n```\n\n> ¹³⁰https://lodash.com/\n\n## 高级 React 组件\n\n162\n\n你可以看到两个排序函数返回了反转的列表。这是因为当你第一次对列表排序时，你希望看到评论和分数最高的项，而不是看到计数最低的项。\n\
    \n`SORTS` 对象允许你引用任何排序函数。同样，你的 `App` 组件负责存储排序状态。初始状态将是默认排序函数，它不进行任何排序，并将输入列表作为输出。\n\
    \nsrc/App.js\n\n```javascript\nthis.state = {\n  results: null,\n  searchKey:\
    \ '',\n  searchTerm: DEFAULT_QUERY,\n  error: null,\n  isLoading: false,\n  sortKey:\
    \ 'NONE'\n};\n```\n\n一旦你选择了一个不同的排序键（例如 `AUTHOR` ），你将使用 `SORTS` 对象中相应的排序函数对列表进行排序。\n\
    \n现在你可以在 `App` 组件中定义一个新方法，只需将 `sortKey` 设置到你的本地状态中。之后，可以使用 `sortKey` 来获取排序函数并将其应用于你的列表。\n\
    \nsrc/App.js\n\n```javascript\nclass App extends Component {\n  _isMounted = false;\n\
    \n  constructor(props) {\n    ...\n    this.needsToSearchTopStories = this.needsToSearchTopStories.bind(this);\n\
    \    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n    this.fetchSearchTopStories\
    \ = this.fetchSearchTopStories.bind(this);\n    this.onSearchSubmit = this.onSearchSubmit.bind(this);\n\
    \    this.onSearchChange = this.onSearchChange.bind(this);\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n    this.onSort = this.onSort.bind(this);\n  }\n\
    \n  onSort(sortTable) {\n    this.setState({ sortKey });\n  }\n}\n```\n\n下一步是将该方法和\
    \ `sortKey` 传递给你的 `Table` 组件。\n\nsrc/App.js\n\n```javascript\nclass App extends\
    \ Component {\n  ...\n  render() {\n    const {\n      searchTerm,\n      results,\n\
    \      searchKey,\n      error,\n      isLoading,\n      sortKey\n    } = this.state;\n\
    \    ...\n    return (\n      <div className=\"page\">\n        ...\n        <Table\n\
    \          list={list}\n          sortTable={sortKey}\n          onSort={this.onSort}\n\
    \          onDismiss={this.onDismiss}\n        />\n      </div>\n    );\n  }\n\
    }\n```\n\n`Table` 组件负责对列表排序。它通过 `sortKey` 获取 `SORT` 函数中的之一，并将列表作为输入。之后，它将持续对排序后的列表进行映射。\n\
    \nsrc/App.js\n\n```javascript\nconst Table = ({\n  list,\n  sortKey,\n  onSort,\n\
    \  onDismiss\n}) => (\n  <div className=\"table\">\n    {SORTS[sortKey](list).map(item\
    \ => (\n      <div key={item.objectID} className=\"table-row\">\n      </div>\n\
    \    ))}\n  </div>\n)\n```\n\n理论上，列表将通过其中一个函数进行排序。但默认排序被设置为 `NONE`，所以目前还没有进行任何排序。因此，还没有人执行\
    \ `onPress()` 方法来更改 `sortKey`。让我们扩展 `Table`，增加一行列头，并在列列头中使用 `Sort` 组件来对每一列进行排序。\n\
    \nsrc/App.js\n\n```javascript\nconst Table = ({\n  list,\n  sortKey,\n  onSort,\n\
    \  onDismiss\n}) => (\n  <div className=\"table\">\n    <div className=\"table-header\"\
    >\n      <Sort onClick={() => onSort('TITLE')} active={sortKey === 'TITLE'}>Title</Sort>\n\
    \      <Sort onClick={() => onSort('AUTHOR')} active={sortKey === 'AUTHOR'}>Author</Sort>\n\
    \      <Sort onClick={() => onSort('COMMENTS')} active={sortKey === 'COMMENTS'}>Comments</Sort>\n\
    \      <Sort onClick={() => onSort('POINTS')} active={sortKey === 'POINTS'}>Points</Sort>\n\
    \    </div>\n    {SORTS[sortKey](list).map(item => (\n      <div key={item.objectID}\
    \ className=\"table-row\">\n      </div>\n    ))}\n  </div>\n)\n```\n\n## 高级 React\
    \ 组件\n\n178\n\n## 高级 React 组件\n\n179\n\n## 高级 React 组件\n\n180\n\n## 高级 React 组件\n\
    \n181\n\n"
