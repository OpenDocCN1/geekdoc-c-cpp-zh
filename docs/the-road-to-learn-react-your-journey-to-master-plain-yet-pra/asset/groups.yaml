  - "[PAGE 104]\n\n# Getting Real with an API\n\nsrc/App.js\n\n```\nonDismiss(id)\
    \ {\n  const isNotId = item => item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: Object.assign({}, this.state.result, hits: updatedHits\
    \ )\n  });\n}\n```\n\nThat would already be the solution. But there is a simpler\
    \ way in JavaScript ES6 and future JavaScript releases. May I introduce the spread\
    \ operator to you? It only consists of three dots ... When it is used, every value\
    \ from an array or object gets copied to another array or object.\n\nLet's examine\
    \ the ES6 array spread operator even though you don't need it yet.\n\n# Code Playground\n\
    \n```\nconst userList = ['Robin', 'Andrew', 'Dan'];\nconst additionalUser = 'Jordan';\n\
    const allUsers = [ ...userList, additionalUser ];\n```\n\n```\nconsole.log(allUsers);\n\
    // output: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\nThe allUsers is a completely\
    \ new array. The other variables userList and additionalUser stay the same. You\
    \ can merge two arrays that way into a new array.\n\n# Code Playground\n\n```\n\
    const oldUsers = ['Robin', 'Andrew'];\nconst newUsers = ['Dan', 'Jordan'];\nconst\
    \ allUsers = [ ...oldUsers, ...newUsers ];\n```\n\n```\nconsole.log(allUsers);\n\
    // output: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\nNow let's a look at the\
    \ object spread operator. It is not JavaScript ES6. It is a proposal for a next\
    \ JavaScript version yet already used by the React community. That's why we create-react-app\
    \ incorporated the feature in the configuration.\n\nBasically it is the same as\
    \ the JavaScript ES6 array spread operator but with objects. It copies each key\
    \ value pair into a new object.\n\n> https://github.com/sebmarkage/javascript-rest-spread"
- md: "\n# Getting Real with an API\n\n# Code Playground\n\n```javascript\nconst userNames\
    \ = { firstName: 'Robin', lastName: 'Wieruch' };\nconst age = 28;\nconst user\
    \ = { ...userNames, age };\n```\n\n```javascript\nconsole.log(user);\n// output:\
    \ { firstName: 'Robin', lastName: 'Wieruch', age: 28 }\n```\n\nMultiple objects\
    \ can be spread like in array spread example.\n\n# Code Playground\n\n```javascript\n\
    const userNames = { firstName: 'Robin', lastName: 'Wieruch' };\nconst userAge\
    \ = { age: 28 };\nconst user = { ...userNames, ...userAge };\n```\n\n```javascript\n\
    console.log(user);\n// output: { firstName: 'Robin', lastName: 'Wieruch', age:\
    \ 28 }\n```\n\nAfter all, it can be used to replace Object.assign().\n\nsrc/App.js\n\
    \n```javascript\nonDismiss(id) {\n  const isNotId = item !== item.objectID !==\
    \ id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n  this.setState({\n\
    \    result: { ...this.state.result, hits: updatedHits }\n  });\n}\n```\n\nThe\
    \ \"Dismiss\" button should work again, because the onDismiss method is aware\
    \ of the complex result object and how to update it after dismissing an item from\
    \ the list.\n\n# Exercises:\n\n- read more about the ES6 Object.assign()⁹6\n-\
    \ read more about the ES6 array spread operator⁹7\n  - the object spread operator\
    \ is briefly mentioned\n\n> ⁹6https://developer.mozilla.org/en/docs/JavaScript/Reference/Global_Objects/Object/assign\n\
    ⁹7https://developer.mozilla.org/en/docs/JavaScript/Reference/Operators/Spread_operator\n\
    \nGetting Real with an API\n\n# Conditional Rendering\n\nConditional rendering\
    \ is introduced pretty early in React applications. But not in the case of the\
    \ book, because there wasn't such an use case. The conditional rendering happens\
    \ when you want to make a decision to render either or another element. Sometimes\
    \ it means to render an element or nothing. After all, a conditional rendering\
    \ simplest can be expressed by an if-else statement in JSX.\n\nThe result object\
    \ in the internal component state is null in the beginning. So far, the App component\
    \ returned no elements when the result hasn't arrived from the API. That's already\
    \ a conditional rendering, because you return earlier from the render() lifecycle\
    \ method for a certain condition. The App component renders nothing or its elements.\n\
    \nBut let's go one step further. It makes sense to wrap the Table component, which\
    \ is the only component that depends on the result, in an independent conditional\
    \ rendering. Everything else should be displayed, even though there is no result\
    \ yet. You can use a ternary operator in\n\n```javascript\nsrc/App.js\nclass App\
    \ extends Component {\n  ...\n  render() {\n    const { searchTerm, result } =\
    \ this.state;\n    return (\n      <div className=\"page\">\n        <div className=\"\
    interactions\">\n          <Search\n            value={searchTerm}\n         \
    \   onChange={this.onSearchChange}\n          </Search>\n        </div>\n    \
    \    { result\n        ? <Table\n            list={result.hits}\n            pattern={searchTerm}\n\
    \            onDismiss={this.onDismiss}\n          />\n        : null\n      \
    \  }\n      )\n    );\n  }\n}\n```\n\nThat’s your second option to express conditional\
    \ rendering. A third option is the logical && operator. In JavaScript a true &&\
    \ 'Hello World' always evaluates to 'Hello World'. A false && 'Hello World' always\
    \ evaluates to false.\n\n# Code Playground\n\n```javascript\nconst result = true\
    \ && 'Hello World';\nconsole.log(result);\n// output: Hello World\n```\n\n```javascript\n\
    const result = false && 'Hello World';\nconsole.log(result);\n// output: false\n\
    ```\n\nIn React you can use of that behavior. If the condition is true, the expression\
    \ after the logical && operator will be the output. If the condition is false,\
