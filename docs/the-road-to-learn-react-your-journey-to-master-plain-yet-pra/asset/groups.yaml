    \n# React 基础\n\n# 受控组件\n\n你已经学习了 React 中的单向数据流。同样的规则也适用于输入框，它通过 `searchTerm` 更新本地状态以过滤列表。当状态改变时，`render()`\
    \ 方法会再次运行，并使用本地状态中最新的 `searchTerm` 应用过滤条件。\n\n但我们没有在输入元素中漏掉什么吗？HTML `input` 标签带有一个\
