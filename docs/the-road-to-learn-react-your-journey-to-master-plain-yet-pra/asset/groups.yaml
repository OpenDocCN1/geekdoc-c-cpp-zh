    \ <h2>{helloWorld}</h2>\n      </div>\n    );\n  }\n}\n```\n\n```javascript\n\
    export default App;\n```\n\n## Exercises:\n\n- read more about ES6 const⁵\n- read\
    \ more about ES6 let⁶\n- research more about immutable data structures\n  - why\
    \ do they make sense in programming in general\n  - why are they used in React\
    \ and its ecosystem\n\n> ⁵⁵https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const\n\
    > ⁶https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/let\n\
    \n## ReactDOM\n\nBefore you continue with the App component, you might want to\
    \ see where it is used. It is located at your entry point to the React world:\
    \ the src/index.js file.\n\n```javascript\nsrc/index.js\nimport React from 'react';\n\
    import ReactDOM from 'react-dom';\nimport App from './App';\nimport './index.css';\n\
    ```\n\n```javascript\nReactDOM.render(\n  <App />,\n  document.getElementById('root')\n\
    );\n```\n\nReactDOM.render() uses a DOM node in your HTML to replace it with your\
    \ JSX. That is how you can easily integrate React in every application. It is\
    \ not forbidden to use ReactDOM.render() multiple times across your application.\
    \ You can use it at multiple places to bootstrap JSX syntax, a React component,\
    \ multiple React components or a whole application. But in plain React application\
    \ you only use once to bootstrap your whole component tree.\n\nReactDOM.render()\
    \ expects two arguments. The first argument is JSX that gets rendered. The second\
    \ argument specifies the place where the React application hooks into your HTML.\
    \ It expects an element with an id='root'. You can open your public/index.html\
    \ file to find the id attribute.\n\nIn the implementation ReactDOM.render() already\
    \ takes your App component. However, it would be fine to pass simpler JSX as long\
    \ as it is JSX. It doesn't have to be an instantiation of a component.\n\n## Code\
    \ Playground\n\n```javascript\nReactDOM.render(\n  <h1>Hello World</h1>,\n  document.getElementById('root')\n\
    );\n```\n\n## Exercises:\n\n- open the public/index.html to see where the React\
    \ applications hooks into your HTML\n- read more about rendering elements in React⁵\n\
    \n> ⁵https://reactjs.org/docs/rendering-elements.html\n\n## Hot Module Replacement\n\
