    # # Outline


    That was the last chapter of the book. I hope you enjoyed reading it and that
    it helped you to get traction in React. If you liked the book, share it as a way
    to learn React with your friends. It should be used as giveaway. In addition,
    it would mean a lot to me if you could take 5 minutes to write a review about
    it at Amazon151 or Goodreads152.


    So, where can you go from after reading this book? You can extend the application
    on your own or give your own React project a shot. Before you dive into another
    book, course or tutorial, you should create your own hands-on React project. Do
    it for one week, then take it to production by deploying it, and reach out to
    me153 to showcase it. I am curious what you will build after you have read the
    book.


    If you are looking for further extensions for your application, I can recommend
    several learning paths after you have used only React in this book:


    +   **State Management**: You have used React this.setState() and this state to
    manage and access local component state. That''s a perfect start. However, in
    a larger application you will experience the limits of React''s local component
    state154. Therefore you can use a third-party state management library as Redux
    or MobX155. On the course platform Road to React156 you will find the course "Taming
    the State in React" that teaches advanced state in React, Redux and MobX. The
    course comes with an ebook, but I recommend everyone to dive into the source code
    and screasts too. If you liked this book, you should definitely check Taming the
    State in React.

    **Connecting to a Database/or Authentication**: In a growing React application,
    you might want to persist data. Eventually the data should be stored in a database
    so that it can survive a browser session and be shared across different users
    using your application. The simplest way to introduce a database is using Firebase.
    In this comprehensive tutorial157 you will find a step by step guide on how to
    use Firebase authentication (sign up, sign in, sign out...) in React. Beyond that,
    you will use Firebase''s realtime database to store entities. After that, it is
    up to you to store more which is needed by your application.

    **Tooling with Webpack and Babel**: In the book you have used create-react-app
    to set up your application. At some point, when you have learned React, you might
    want to learn the


