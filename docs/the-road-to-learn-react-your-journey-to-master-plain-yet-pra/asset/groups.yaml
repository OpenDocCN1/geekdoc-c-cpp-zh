  mdcn: "\n\n# 接入真实的 API\n\n其次，使用 `componentDidMount()` 生命周期周期方法在组件挂载后获取数据。在首次获取时，将使用本地状态中的默认搜索词。它将获取与\
    \ \"redux\" 相关的故事，因为这是默认参数。\n\n第三，使用了原生的 `fetch` API。JavaScript ES6 模板字符串允许它结合\
    \ `searchTerm` 组合 URL。URL 是原生 `fetch` API 函数的参数。响应需要被转换为 JSON 数据结构，这在处理 JSON 数据结构时是原生\
    \ `fetch` 函数中一个必不可少的步骤，最后可以将其设置为内部组件状态中的结果。此外，使用了 `catch` 块以防发生错误。如果在请求过程中发生错误，函数将进入\
    \ `catch` 块而不是 `then` 块。在书后的章节中，你将包含错误处理。\n\n最后但同样重要，不要忘记在构造函数中绑定你的新组件方法。现在你可以使用获取到的数据代替示例项目列表了。然而，你再次需要格外小心。结果不仅仅是一个数据列表，而是一个包含元数据和\
    \ hits 列表的复杂对象，其中 hits 就是我们的故事⁴。你可以在 `render()` 方法中使用 `console.log(this.state)`\
    \ 输出内部状态以便进行可视化。\n\n在下一步中，你将使用该结果进行渲染。但在最初没有结果时，我们将阻止它渲染任何内容，即返回 `null`。一旦对 API\
    \ 请求成功，结果将保存到状态中，App 组件将使用更新后的状态重新渲染。\n\nsrc/App.js\n\n```\nclass App extends\
    \ Component {\n...\n  render() {\n    const { searchTerm, result } = this.state;\n\
    \n    if (!result) { return null; }\n\n    return (\n    <div className=\"page\"\
    >\n      ...\n      <Table\n        list={result.hits}\n        pattern={searchTerm}\n\
    \        onDismiss={this.onDismiss}\n      />\n    </div\n    );\n  }\n}\n```\n\
    \n> ⁴https://hn.algolia.com/api\n\n让我们回顾一下组件生命周期期间发生了什么。你的组件通过构造函数初始化。之后，它进行第一次渲染。但你阻止了它显示任何内容，因为本地状态中的结果是\
    \ `null`。组件返回 `null` 以不显示任何内容是被允许的。`componentDidMount()` 生命周期方法运行。在该方法中，你异步从 Hacker\
    \ News API 获取数据。一旦数据到达，它会在 `setSearchTopStories()` 中更改你的内部状态。之后，由于状态被更新，更新生命周期也随之触发。组件再次运行\
    \ `render()` 方法，但此时你的内部组件状态中已经填充了 `result`。组件和带有内容的 `Table` 将被渲染。\n\n你使用了大多数浏览器支持的原生\
    \ `fetch` API 对 API 发起异步请求。`create-react-app` 配置确保了它在每个浏览器中都受到支持。你可以使用第三方 node\
    \ 包来替代原生 `fetch` API，如 superagent⁰ 和 axios⁹¹。\n\n请记住，本书是基于 JavaScript 对真值（truthfulness）的简写表示构建的。在上在上例子中，使用了\
    \ `if (result)` 代替 `if (result === null)`。书中的其他情况也同样适用于这一点。例如，使用 `if (!list.length)`\
    \ 代替 `if (list.length === 0)`，或者使用 `if (someString)` 代替 `if (someString !== '')`。如果你不熟悉该主题，请阅读\
    \ API 相关内容。\n\n回到你的应用程序：现在 hits 列表应该是可见的。然而，你的应用程序中存在两个回归错误（regression bugs）。首先，“Dismiss”按钮失效了。它并不知道复杂的响应对象，在移除某项时操作的是本地状态中的普通列表。其次，当列表显示但你想搜索其他内容时，即使初始搜索是通过服务器端进行的，列表也会在客户端进行过滤。更完美的行为是在使用\
    \ Search 组件时从 API 获取另一个对象。这两个回归错误将在后续章节中修复。\n\n# 练习：\n\n- 阅读 ES6 模板字符串 ²\n- 阅读原生\
    \ fetch API ³\n- 阅读 React 中的数据获取 ⁴\n\n⁰https://github.com/visionnedia/superagent\n\
    \n¹https://github.com/mzabriskie/axios\n\n²https://developer.mozilla.org/en/docs/JavaScript/Reference/Template_literals\n\
    \n³https://developer.mozilla.org/en/docs/Web/API/Fetch_API\n\n⁴https://www.robinuerch.de/react-fetching-data\n\
    \n"
