  md: "# Chapter 5.2. Loops - Exam Problems 219\n\n```\nif ((day % 3 == 0) && (untreatedPatients\
    \ > treatedPatients)\n{\n    countOfDoctors++;\n}\nif (currentPatients > countOfDoctors)\n\
    {\n    treatedPatients += countOfDoctors;\n    untreatedPatients -= countOfDoctors;\n\
    }\nelse\n{\n    treatedPatients += currentPatients;\n}\n```\n\nWith the help of\
    \ a for loop we iterate through all days in the given period (period). For each\
    \ day, we read from the console the number of patients (currentPatients). Increasing\
    \ doctors by requirements can be done every third day, BUT only if the count of\
    \ untreated patients is greater than the count of treated ones. For this purpose,\
    \ we check if the day is third one - with the arithmetic operator for remainder\
    \ (%%): day % 3 == 0.\n\nFor example:\n\n+   - If the day is third one, the remainder\
    \ of the division by 3 will be 0 (3 % 3 = 0) and the check day % 3 == will return\
    \ true.\n- If the day is second one, the remainder of the division by 3 will be\
    \ 2 (2 % 3 = 2) and the check will return false.\n- If the day is false one, the\
    \ remainder of the division will be 1 (4 % 3 = 1) and the check will return false.\n\
    \nIf day % 3 == 0 returns true, the system will check the count of untreated patients\
    \ is greater than count of treated ones: untreatedPatients > treatedPatients.\
    \ If the result is true, then the count of doctors will be increased (countOfDoctors).\n\
    \nThen we check if the count of patients for the day (currentPatients) is greater\
    \ than the count of doctors (countOfDoctors). If the count of patients is greater:\n\
    \n+   - Increase the value of the variable treatedPatients by the count of doctors\
    \ (countOfDoctors).\n- Increase the value of the variable untreatedPatients by\
    \ the count of the remaining patients, which we calculate by subtracting the count\
    \ of doctors from the count of patients (currentPatients - countOfDoctors).\n\n\
    If the count is not greater, increase only the variable treatedPatients with the\
