  md: "# Programming Basics with C#\n\nIt is a good practice to use blocks that are\
    \ enclosed with curly braces { } after if and else. Also, it is recommended writing\
    \ to move away the code after if and else with a single tabulation inward, in\
    \ order to make the code more easily readable.\n\n# Switch-Case Conditional Statement\n\
    \nThe switch-case condition works as a sequence of if-else blocks. Whenever the\
    \ work of our program depends on the value of one variable, instead of making\
    \ consecutive conditions with if-else blocks, we can use the conditional switch\
    \ statement. It is being used for choosing between a list of possibilities. The\
    \ statement compares a given value with defined constants and depending on the\
    \ result, it takes an action.\n\nWe put the variable that we want to compare,\
    \ inside the brackets after the operator switch and it is called a \"selector\"\
    . Here the type must be comparable (numbers, strings). Consecutively, the program\
    \ starts beginning and continues until it reaches the operator break. Upon a match,\
    \ the execution of the code from the respective place begins each value is found\
    \ found the case labels. In programming languages like C and C++) break may be\
    \ skipped, in order to execute a code from other case construction, until it reaches\
    \ another operator. In C# though, the presence of break is mandatory for every\
    \ case that contains a program logic. When no matches are found, the default construction\
    \ is executed, if switch exists.\n\n```\nswitch (selector)\n{\n    case value1:\n\
    \        construction;\n        break;\n    case value2:\n        construction;\n\
    \        break;\n    case value3:\n        construction;\n        break;\n...\n\
    \    default:\n        construction;\n        break;\n}\n```\n\n# Video: Switch-Case\n\
    \nWatch the video to learn how to use the switch-case conditional statement in\
    \ programming: https://youtu.be/mGJOc4xx5Ho.\n\n# Example: Day of the Week\n\n\
    Let's write a program that prints the day of the week (in English) depending on\
    \ given number (1 ... 7) or 'Error!' if an invalid input is given.\n\n# Sample\
    \ Input and Output\n\nA sample input and output are given in the table on the\
    \ right.\n\n| Input | Output |\n|---|---|\n| 1 | Monday |\n| 7 | Sunday |\n| -1\
    \ | Error! |"
