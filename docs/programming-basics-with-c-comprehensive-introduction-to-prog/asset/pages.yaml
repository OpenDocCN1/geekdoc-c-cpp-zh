    \ It is important to note that when calling the method, we must pass to it values\
    \ for the parameters in the order, in which they are declared. If the parameters\
    \ are int and after string, when calling the method, we can't give it first a\
    \ string and then int. We can only change places of parameters if we write the\
    \ name of the parameter beforehand, you will also see in one of the examples.\
