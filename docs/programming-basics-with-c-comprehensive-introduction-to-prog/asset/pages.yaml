    # Problem: Equal Pairs


    There are 2 * n numbers. The first and second number pair, the third and fourth
    number also, and so on. Each pair has a value – the sum of its numbers. Write
    a program that checks if all pairs have equal value.


    In case the value is same, print "Yes, value=..." + the value, otherwise, print
    the maximum difference between two neighboring pairs in format: "No, maxdiff=..."
    + the maximum difference.


    The input consists of the n numbers, followed by 2*n integers, all of them on
    line.'
