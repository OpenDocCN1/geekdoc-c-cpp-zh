  md: "# Chapter 5.1. Loops (Repetitions)\n\nIn the present chapter we will get familiar\
    \ how to repeat blocks of commands, also known in software development as \"loops\"\
    . We will write a number of simple loops using the for operator in its simplest\
    \ form (for i = 1 ... n). Finally, we will solve series of practical problems\
    \ that require repeating of series of actions, using loops.\n\n# Video: Chapter\
    \ Overview\n\nWatch a video lesson to review what we learn in this chapter about\
    \ loops in programming: https://youtube.be/GIF2smfXP2g\n\n# Introduction to Simple\
    \ Loops by Examples\n\nIn programming we can execute a block of code multiple\
    \ times using a simple for-loop like this:\n\n```\nfor (int i = 1; i <= 5; i++)\n\
    {\n    Console.WriteLine(i);\n}\n```\n\nRun the above code example: https://repl.it/@nakov/for-loop-1-to-5-csharp.\n\
    The above code prints the numbers 1, 2, ..., 5. The output is as follows:\n\n\
    +   1\n2\n3\n4\n5\n\nWe can enter multiple numbers from the console and process\
    \ them using loops like this:\n\n+   1. Read the count n of the numbers.\n2. In\
    \ a for-loop read and process n times one simple number.\n\nThis is how the above\
    \ idea may work:\n\n```\nint n = int.Parse(Console.ReadLine());\nlong sum = 0;\n\
    for (int i = 0; i < n; i++)\n{\n    int num = int.Parse(Console.ReadLine());\n\
    \    sum += num;\n}\n```\n\nConsole.WriteLine(\"Sum = {0}\", sum);\n\nRun the\
    \ above code example: https://repl.it/@nakov/for-loop-sum-n-numbers-csharp.\n\
    The output from the above example may look like this (when we enter 3 numbers:\
    \ 10, 20 and 30):\n\n+   3\n10\n20\n30\nSum = 60"
