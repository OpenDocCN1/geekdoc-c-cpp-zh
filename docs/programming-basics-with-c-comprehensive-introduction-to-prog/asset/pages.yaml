    # Simple Calculations – Quick Review


    Before jumping into the practical problems, let''s make a quick review of what
    we have learned in the previous chapter.


    # Reading Numbers from the Console


    Before tasks, we are going to review the most important aspects of what we have
    studied in the previous chapter. We will start by reading numbers from the console.


    # Reading an Integer


    We need to create a variable to store the integer (for example, num) and use a
    standard command for reading input from the console Console.ReadLine(), combined
    with the function int.Parse(...) which converts string to an integer:


    ```

    var num = int.Parse(Console.ReadLine());

    ```


    # Reading a Floating-Point Number


    We read a floating-point number, the same way we read an integer, but this time
    we use the function double.Parse(...):


    ```

    var num = double.Parse(Console.ReadLine());

    ```


    # Printing Text Placeholders


    Placeholder is an expression which is replaced with a practical value while printing
    an output. The methods Console.Write(...) / WriteLine(...) supports printing a
    string based on a placeholder, where the first argument is the formatted string,
    followed by the number of arguments, equal to the number of placeholders.


    ```

    Console.WriteLine("You are {0} {1}, a {2}-years old person from {3}.", firstName,
    lastName, age, town);

    ```


    # Arithmetic Operators


    Let''s revise the main arithmetic operators for simple calculations.


    # Operator +


    ```

    var result = 3 + 5; // the result is 8

    ```'
