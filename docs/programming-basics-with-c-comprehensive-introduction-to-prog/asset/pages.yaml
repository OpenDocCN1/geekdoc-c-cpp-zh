- img_proc: true
  md: '+   Algorithmic thinking is developed by solving multiple programming (1000+)
    problems, as possible. That is the recipe: solving thousands of practical problems,
    building algorithms and implementing them, along with debugging the issues that
    come up in the process.


    +   Sciences like physics, mathematics and identical ones helps a lot, but they
    are not mandatory! People with engineering and technical skills usually learn
    very easily to think logically, because they already have problem solving skills,
    even if it is not algorithmic.


    +   The ability of solving programming problems (for which algorithmic thinking
    is needed) is extremely important for a programmer. Many companies particular
    test this skill during their job interviews.


    The current book develops the beginner level of algorithmic thinking, but it''s
    not enough to make a good programmer. To become good at this profession you must
    add logical thinking and problem-solving skills, beyond the range of this book.
    For example, working with data structures (arrays, lists, matrices, hashes-binary
    trees) and basic algorithms (searching, sorting, in tree structures, recursion,
    etc.).


    Algorithmic thinking skills can be seriously developed at the beginner level for
    software engineers in Softuni curriculum as well as in specialized algorithm-oriented
    trainings like data structures and algorithms.


    As you can guess the programming language doesn''t guarantee the development of
    algorithmic thinking. To think logically is a universal skill, and it''s not related
    to programming. Because of the well-developed logical thinking it''s believed
    that programmers are smart people, and a stupid person can''t be a programmer.


    # Skill #3 - Computer Science and Software Engineering (25%)


    Fundamental knowledge and skills for programming, software development, software
    engineering and computer science comprise around 25% of the developer''s minimum
    skills to start a job. Here are the more important of these skills and knowledge:


    +   Basic mathematical concepts related to programming - coordinate systems, vectors
    and matrices, discrete and non-discrete mathematical functions, state automata
    and state machines, combinatorics and statistics concepts, algorithm complexity,
    mathematical modeling and others


    +   Programming skills - code writing, working with data, using conditional statements
    and loops, working with arrays, lists and associative arrays, strings and text
    processing, with streams and files, using programming interfaces (APIs), working
    with IDE, debugger, developer tools,


    +   Data structures and algorithms - lists, trees, hash-tables, graphs, search,
    sorting, recursion, binary search trees,


    +   Object-oriented programming (OOP) - working with classes, inheritance, polymorphism,
    abstraction, interfaces, data encapsulation, exceptions management, design pattern


    +   Functional programming (FP) - working with lambda functions, higher order
    functions, functions that return a function as a result, closure, etc.


    +   Databases - relational and non-relational databases, database modeling (tables
    and links between them), SQL query language, object-relational mapping (ORM),
    transactions and transaction management


    +   Network programming – network protocols, network communication, TCP/IP, concepts,
    tools and technologies from computer networks


    +   Client-server interaction, peer to peer communication, back-end technologies,
    front-end technologies, MVC architectures'
