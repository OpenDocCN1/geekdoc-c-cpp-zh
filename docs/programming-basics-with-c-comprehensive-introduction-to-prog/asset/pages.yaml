  md: '# Programming Basics with C#


    # Example: 2D Rectangle Area


    A rectangle is given with the coordinates of its opposite angles. Calculate its
    area and perimeter (the screenshot).


    In this task, we have to consider that if we subtract the smaller x from the higher
    x, we will obtain the length of the rectangle. If identically, we subtract the
    smaller y from the higher y, we will obtain the height of the rectangle. What
    is left is to multiply both sides. Here is an example of an implementation of
    the described logic:


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_71_0.png)


    ```

    var x1 = double.Parse(Console.ReadLine());

    var y1 = double.Parse(Console.ReadLine());

    var x2 = double.Parse(Console.ReadLine());

    var y2 = double.Parse(Console.ReadLine());

    ```


    ```

    // Calculate the sides of the rectangle:

    var width = Math.Max(x1, x2) - Math.Min(x1, x2)

    var height = Math.Max(y1, y2) - Math.Min(y1, y2);

    ```


    ```

    Console.WriteLine("Area = " + width * height);

    Console.WriteLine("Perimeter = " + 2 * (width + height));"

    ```


    We use Math(a, b), to find the higher value from a and b and identically Math.Min(a,
    b) to find the lower of both values.


    When the program is executed with the coordinate system given in the above example,
    we obtain the result, shown at the screenshot.


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_71_1.png)


