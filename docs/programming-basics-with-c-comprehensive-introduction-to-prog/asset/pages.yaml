  md: "# Problem: Summing Numbers\n\nWrite a program that inputs n integers and sums\
    \ them up.\n\n+   * The first line of the input holds the number of integers n.\n\
    * Each of the following n lines holds an integer for summing.\n* Sum up the numbers\
    \ and finally print the result.\n\n# Sample Input and Output\n\n| Input | Output\
    \ | | Input | Output | | Input | Output |\n| --- | --- | | --- | --- | | --- |\
    \ --- |\n| 2 | | | 4 | | | 0 | |\n| 10 | 30 | | 45 | | | | |\n| 20 | | -20 | 43\
    \ | | 1 | |\n| | | -30 | | 999 |\n\n# Video: Summing Numbers\n\nWatch this video\
    \ to learn how to sum numbers in for-loop: https://youtube.be/l7PAichwl7k.\n\n\
    # Hints and Guelines\n\nWe can solve the problem with summing numbers in the following\
    \ way:\n\n+   * We read the input number n.\n* We initially start with a sum =\
    \ 0.\n* We run a loop from 1 to n. On each step of the loop, we read the number\
    \ num and add it to the sum sum.\n* Finally, we print the calculated amount sum.\n\
    \nBelow is the source code for the solution:\n\n```\nConsole.WriteLine(\"n = \"\
    );\nvar n = int.Parse(Console.ReadLine());\nConsole.WriteLine(\"Enter the numbers:\"\
    );\nvar sum = 0;\nfor (int i = 0; i < n; i++)\n{\n    var num = int.Parse(Console.ReadLine());\n\
    \    sum = sum + num;\n}\nConsole.WriteLine(\"sum = \" + sum);\n```\n\n# Testing\
    \ in the Judge System\n\nTest your solution: https://judge.softuni.com/Contests/Practice/Index/510#.\n\
    \n# Problem: Max Number\n\nWrite a program that enters n integers (n > 0) and\
    \ finds the max number among them (the largest). The first input line specifies\
    \ the number of integers n. The next n lines hold the integers, one per line."
