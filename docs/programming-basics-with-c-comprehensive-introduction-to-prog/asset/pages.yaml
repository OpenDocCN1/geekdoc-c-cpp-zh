  md: '# Chapter 8.1. Practical Exam Preparation – Part I


    In the present chapter we will examine a few problems with a level of difficulty
    that can be expected in the problems of the practical exam in "Programming Basics".
    We will review and practice all the knowledge that was gained from this book and
    through the "Programming Basics" course.


    # Video: Chapter Overview


    Watch a video about what you learn in this chapter: https://youtu.be/tOeqLSziR4.


    # The "Programming Basics" Practical Exam


    The course "Programming Basics" at SoftUni finishes with a practical exam. There
    are 6 problems included, and you have 4 hours to solve them. Each of the problems
    will cover one of the topics studied during the course. Problem tasks are from
    the following 6 groups:


    +   - Problem with simple calculations (no conditions)

    - Problem with simple condition (simple checks)

    - Problem with more complex conditions (nested checks and multiple checks)

    - Problem with a simple loop (e.g. iterate from 1 to N)

    - Problem with nested loops (e.g. drawing a 2D figure on the console)

    - Problem with nested loops and more complex logic (loops and checks checks)


    # Video: The Practical Exam Explained


    Watch this to learn more about the practical exam, the problems, the evaluation
    and the automated judge system: https://youtu.be/KPF980HWhw.


    # The Online Evaluation System (Judge)


    All exams and exercises from this book are automatically tested with visible (zero
    point) tests to help you understand what is expected of the problem and fix your
    mistakes, as competition tests that are hidden and check if your solution is working
    properly. In the Judge system you can log in with softuni.org.


    How does the testing in the Judge system work? You upload / paste the source code
    of your solution from the Web page and you choose to compile and run it as a C#
    program. The program is tested with a series of tests (input data + checks of
    the produced output), giving points for successful test. For each problem the
    Judge provides a separate code submission page, separate evaluation tests and
    scoring (points).


    # Simple Calculations – Problems


    The first problem of the "Programming Basics" Practical Exam covers calculations
    without checks and loops. Participants in the exam should know how to write simple
    loops, use variables and data, read and print numbers on the console and perform
    simple calculations. Let''s solve a few sample problems with simple calculations.


