  md: "# Chapter 11. Tricks and Hacks\n\nIn the current chapter we are going to see\
    \ some tricks, hacks and techniques, which will make our work with C# in the Visual\
    \ Studio IDE. In particular, we will see:\n\n+   - How to properly format our\
    \ code\n- Conventions for naming elements in the code\n- Some keyboard shortcuts\n\
    - Some code snippets\n- Techniques to debug your code\n\n# Code Formatting\n\n\
    The right writing of our code will make it easier to read and understand in case\
    \ someone else needs to work with it. This is important, because in practice we\
    \ will need to work in a team with other people and it is highly important to\
    \ write our code in a way that our colleagues can quickly understand.\n\nThere\
    \ are some defined rules for correct formatting of the code, which are all called\
    \ conventions. The conventions are a group of rules, generally accepted by the\
    \ programmers using a given language, what is the best to write and what are good\
    \ practices. It is accepted that if a programmer follows then his code is easy\
    \ to read and understand.\n\nThe C language is made by Microsoft and they are\
    \ the people who define the best practices for writing. You should know that even\
    \ if you don't follow the conventions given by Microsoft, your code will work\
    \ (as it is properly written), but it will not be easy to understand. This, of\
    \ course, is not fatal at base level, but the faster you get used to writing quality\
    \ code the better.\n\n# The Official C# Code Conventions\n\nThe official C# code\
    \ conventions are published by Microsoft are in the “C# Coding Conventions” article\
    \ in the .NET document and in this book we shall follow: https://docs.microsoft.com/dotnet/csharp/programming-guide/inside-a-program/coding-conventions.\n\
    \nFor code formatting Microsoft recommends curly brackets {} to be on a separate\
    \ line and just below the construction to which they apply, as in the example:\n\
    \n```\nif (someCondition)\n{\n    Console.WriteLine(\"Inside the if statement\"\
    );\n}\n```\n\nYou can see that the command Console.WriteLine(...) in the example\
    \ is offset by 4 white spaces (one tab), which is also recommended by Microsoft.\
    \ If given construction with curly brackets is offset by one tab, then the curly\
    \ brackets {} must be in the beginning of the construction, as in the example:\n\
    \n```\nif (someCondition)\n{\n    if (anotherCondition)\n    {\n        Console.WriteLine(\"\
    Inside the if statement\");\n    }\n}\n```"
