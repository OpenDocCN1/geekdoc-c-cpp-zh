    \ of int to read the input from the console.\n- Nest six for loops into one another,\
    \ for every single digit of the searched 6-digit numbers.\n- In the last loop,\
    \ using if, check if the product of the six digits is equal to the magic number.\n\
    \n```\nint magic =\nfor (int d1 = 0; d1 <= 9; d1++) {\n    for (int d2 = 0; d2\
