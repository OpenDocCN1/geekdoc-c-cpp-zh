  md: "# 376 Programming Basics C#\n\nhave good support in the older versions and\
    \ it's ineffective. That's why in previous versions of C# the elements in Tuple\
    \ were seen as Item1, Item2 etc. and the names of their variables (the variables\
    \ in which they are contained) could not be changed. In C# 7 the type ValueTuple\
    \ is maintained, while allowing giving meaningful names to the elements in a ValueTuple.\n\
    \n# Declaring a ValueTuple\n\nLet's examine an example declaring a variable of\
    \ ValueTuple type:\n\n```\nvar personInfo = (name: \"Steve\", age: 27, \"Bulgaria\"\
    );\n```\n\nTo make it clear when declaring, we use the keyword var, and in the\
    \ brackets we list the names of the variables we want, followed by the values\
    \ themselves. Let's see what the personInfo contains in debug:\n\n```\nvar personInfo\
    \ = (name: \"Steve\", age: 27, \"Bulgaria\");\npersonInfo(\"Steve\", 27, \"Bulgaria\"\
    )\n```\n\n| name | \"Steve\" |\n|---||\n| age | 27 |\n| Item3 | \"Bulgaria\" |\n\
    | Raw View | ('Steve', 27, \"Bulgaria\") |\n\nWe can see that it contains several\
    \ fields with names and values, which were given when initializing the variable.\
    \ We can see that the last variable is called Item3. This is so because initializing\
    \ we haven't named the variable, which contains the value \"Bulgaria\". In this\
    \ case the naming is by default, i.e. the variables are named Item1, Item2, Item3,\
    \ etc.\n\n# Method Returning Multiple Values\n\nThe following method takes as\
    \ parameters two integers (x and y) and returns two values - the result of integer\
    \ division and the remainder:\n\n```\nstatic (int result, int remainder) Divide(int\
    \ x, int y)\n{\n    int result = x / y;\n    int remainder = x % y;\n    return\
    \ (result, remainder);\n}\n```\n\nThis method returns a result of ValueTuple type,\
    \ containing two variables (fields) of int type, named result and remainder respectively.\
    \ Calling the method is in the following way:\n\n```\nvar division = Divide(1,\
    \ 3);\n```\n\nIn order to get the results returned from the method, we apply point\
    \ notation to the variable division. as it is shown on the example below:\n\n\
    ```\nvar division = Divide(1, 3);\nint res = division.result;\nint rem = division.remainder;\n\
    ```\n\nTo simplify the developers, Visual Studio implements auto-complete tuples,\
    \ returned from a method, just as it can be expected:"
