  md: '# Programming Basics with C#


    You can become a programmer (working in a software company) after at least 1-2
    years of intensive training and coding every day, solving thousands of programming
    tasks, development of several serious practical projects and gaining a lot of
    experience with code writing and software development. You can''t become a programmer
    for a month or two! The profession of software engineer requires a lot of knowledge,
    covered with a lot of practice.


    # Video: Become a Software Engineer – 4 Essential Skills


    Watch a video lesson about the 4 essential skills, that all software engineers
    should have in order to be their proficient: https://youtube.be/qO1ckspCqxs


    # The 4 Essential Skills of the Software Developers


    There are 4 main groups where programmers must master. Most of these skills are
    resistant in time and are not influenced by the development in specific technologies
    (that are changing constantly). They are the skills that any good programmer has
    and to which every beginner must strive:


    +   - coding (20%)

    - algorithmic thinking (30%)

    - computer science and software engineering concepts (25%)

    - languages and software technologies (25%)


    # Skill #1 – Coding (20%)


    Writing code forms around 20% of the minimum knowledge and skills of a programmer,
    needed for starting in a software company. The skill of coding includes the following
    components:


    +   - Using with variables, conditional statements, loops

    - Using functions, methods, classes and objects

    - Data mapping: arrays, lists, hash, strings


    The skill of coding can be acquired in a few months of hard learning and solving
    problems by writing code every day. This book covers only the first point of coding:
    with variables, conditional statements and loops. The rest remains to be learned
    in follow-up tutorials, courses, books and practical work on projects.


    The book (and the courses based on it) gives only the basics and serious training
    on the way to professional programming. If you don''t learn the material from
    this book, you can''t become a programmer. For this reason, enough time to programming
    basics: solve many problems and write code every day until you learn to solve
    every problem from the book very easily. Then go ahead.


    We specifically note that the programming language does not matter for the ability
    to code. You can or not. If you use C#, you will easily learn to code with Java,
    C++ or other languages. Why that''s coding skills are being quite seriously at
    the beginners in SoftUni (curriculum), and every programming book for beginners
    starts with them, including this one.


    # Skill #2 – Algorithmic Thinking (30%)


    The algorithmic (logical, engineering, mathematical, abstract) thinking forms
    around 30% of the minimum skills of a programmer needed to start the profession.
    Algorithmic thinking is the ability to break a practical problem into a logical
    sequence (algorithm), to find a solution for every separate step and then the
    steps into a working solution. That is the most important skill of any programmer.
    How to develop algorithmic thinking?'
  merge: -1
