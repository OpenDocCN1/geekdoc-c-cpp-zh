  md: "# Greatest Common Divisor (GCD)\n\nBefore proceeding to the next problem, we\
    \ will get familiar with the definition of the greatest common divisor (GCD),\
    \ widely used in mathematics and numbers theory, and will learn how to calculate\
    \ GCD. Definition of GCD: the greatest common divisor of two natural numbers a\
    \ and b is the largest number that divides both a and b without.\n\n| a | b |\
    \ GCD | a | b | GCD | a | b | GCD |\n|---|---|---|---|---|---|---|---||\n| 24\
    \ | 16 | 8 | 12 | 24 | 12 | 10 | 10 | 10 |\n| 67 | 18 | 1 | 15 | 9 | 3 | 100 |\
    \ 88 | 4 |\n\n# Video: Greatest Common Divisor (GCD)\n\nWatch the video lesson\
    \ to learn about the Euclidean algorithm for calculating the GCD of given two\
    \ integers: https://youtube.be/1-SEQWupvrA.\n\n# The Euclidean Algorithm\n\nIn\
    \ the next problem we will use one of the first published algorithms for finding\
    \ the GCD – Euclid's algorithm.\n\nUntil we reach a remainder of 0:\n\n+   * We\
    \ divide the greater number by the smaller.\n* We take the remainder of the division.\n\
    \nEuclid's algorithm pseudo-code:\n\n```\nwhile b != 0\n  var oldB = b;\n  b =\
    \ a % b;\n  a = oldB;\nprint a;\n```\n\n# Example: Greatest Common Divisor (GCD)\n\
    \nEnter integers a and b find GCD(a,b).\n\nWe will solve the problem through Euclid's\
    \ algorithm:\n\n+   * We create variables a and b to which we assign integer values\
    \ taken from the console input.\n* For a loop condition, put an expression that\
    \ is true if the number is different from 0.\n* In the body of the loop we follow\
    \ the instructions from the pseudo-code:\n\n+   * We create a temporary variable\
    \ to which we assign the current value of b.\n* We assign a new value to b, which\
    \ is the remainder of the division of a and b.\n* On the variable a we assign\
    \ the previous value of the variable b.\n\n+   * Once the loop is complete and\
    \ we have found the GCD, we print it on the screen.\n\nThis is a sample implementation\
    \ of the Euclidean algorithm:"
