    # Problem: Passion Shopping Days


    Lina has a real shopping trip. When she has some money, she immediately goes to
    the closest shopping center (mall) and tries to spend as much as she can on clothes,
    bags and shoes. Her favorite thing are winter items. Our task is to analyze her
    strange behavior and calculate the purchases that Lina does when she enters the
    mall, as well as the money she has left when the shopping is over. All prices
    and money are in BGN (Bulgarian lev, lv).


    The first line of input will pass the amount that Lina before she starts shopping.
    After that, upon reading the ''mall.Enter'' command, Lina enters the mall and
    starts shopping until the ''mall.Exit'' command is given. When Lina starts shopping,
    on each line of the input will be given strings that are actions performed by
    Lina. Each symbol is a purchase or other action. The ASCII code of each sign is
    related to what Lina must pay for. You need to interpret the symbols in the following:


    +   - If the symbol is a capital letter, Lina gets a 50% discount, which means
    that you must decrease the money she has by 50% of the numeric representation
    of the symbol from the ASCII table.

    - If the symbol is a small letter. Lina gets a 70% discount, which means that
    you must decrease the money she has by 30% of the numeric representation of the
    symbol from the ASCII table.

    - If the symbol is "", Lina makes a purchase that decreases her money in half.

    - If the symbol is "*", Lina withdraws money from her debit and adds 10 lv to
    her available funds.


    If a value of her purchases is higher than her current available funds, Lina DOES
    NOT make the purchase. Lina''s funds cannot be less than 0.


    The shopping ends when the ''mall.Exit'' command is given. When this happens,
    you need to print the number of purchases made and what Lina has left.


    # Input Data


    The input data must be read from the console. The first line of input will indicate
    the amount that Lina has before starting to purchase. On each of the following
    lines there will be a particular command. After you read the command ''mall.Enter'',
    each of the following lines will be given strings holding information regarding
    the purchases / actions that Lina wants to perform. These strings will keep being
    passed, until the ''mall.Exit'' command is given.


    Always only one ''mall.Enter'' command will be given, as well as only one ''mall.Exit''
    command.'
