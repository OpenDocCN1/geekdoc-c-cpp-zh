    | | 24-11-2013 |

    | | 14-12-2013 |

    | | 23-12-2014 |

    | | 31-12-2014 |

    | 2012 | |

    | 2014 | |

    | 80 | |


    # Input Data


    Input data should be read from the console. It consists of 3 lines:


    +   * The first line contains integer: start year.

    * The second line contains integer: end year.

    * The third line contains integer: the search weight for the dates.


    Input data will always be valid and always will be in the format described. No
