    # The System Console


    Simply called "console", the "system console", the "system terminal", the "standard
    input / output", also the "computer command line console", represents the tool
    by which we give the computer commands in a text format and get the results from
    their execution as a text.


    # Video: The System Console


    Watch a video lesson about the system console here: https://youtu.be/ehHNu6M55M.


    # The System Console Explained


    Generally, the system console represents a text terminal, which means that it
    accepts and visualizes just text without graphical elements like buttons, menus,
    etc. It usually looks like a black colored window like this:


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_61_0.png)


    In operating systems, the console is available as a standalone application on
    which we write console commands. It is called a Command Prompt in Windows, and
    a Terminal in Linux and Mac. The console runs console applications. They read
    text from the console and print text to the console. In this we are going to learn
    programming by creating console applications.


    In the examples we will read data (like integers, floating-point numbers and strings)
    from the console and will print data on the console (text and numbers).


    # Reading Integers from the Console


    In order to read integer (not a float) number from the console, we have to declare
    a variable, declare the number type and use the standard command for reading a
    text line from the system console Console.ReadLine() and after that convert the
    text line into an integer number using int.Parse(text):


    ```

    var num = int.Parse(Console.ReadLine());

    ```


    The above line of C# code reads an integer from the first line on the console.'
