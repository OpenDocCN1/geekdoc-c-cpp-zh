  md: "# Chapter 6.1. Nested Loops\n\nIn the current chapter we will be looking at\
    \ nested loops and how to use loops to draw various figures on the console, that\
    \ contain symbols and signs, ordered in rows and columns on the console. We will\
    \ use single and nested loops (loops that stay in other loops), calculations and\
    \ checks, in order to print to the console simple and not so simple figures by\
    \ specified sizes.\n\n# Video: Chapter Overview\n\nWatch a video lesson to learn\
    \ what we learn in this chapter: https://youtube.be/sbnhyr1Yz7U.\n\n# Introduction\
    \ to Nested Loops by Examples\n\nIn programming loops can be nested, which means\
    \ that we can put one loop inside another. This is an example of nested-loops,\
    \ which are used to draw a square of n rows, each holding n times the chars :=\n\
    \n```\nint n = int.Parse(Console.ReadLine());\nfor (int row = 1; row <= n; row++)\n\
    {\n    for (int col = 1; col <= n; col++)\n    {\n        Console.Write(\"-\"\
    );\n    }\n    Console.WriteLine();\n}\n```\n\nRun the above code example: https://repl.it/@nakov/nested-loops-draw-square-csharp.\n\
    If we run the above code and enter 5 as input, the output will be as follows:\n\
    \n```\n5\n=====\n=====\n=====\n=====\n=====\n```\n\nUsing a combination of calculations,\
    \ conditional statements and nested loops, we can implement complex logic. For\
    \ example, we can draw a rhombus of stars as follows:\n\n```\nint n = 10;\nfor\
    \ (int row = 1; row < n; row++)\n{\n    var spaces = Math.Abs(n / 2 - row);\n\
    \    var stars = n/2 - spaces;\n    for (int col = 1; col <= spaces; col++)\n\
    \        Console.Write(\" \");\n    for (int col = 1; col <= stars; col++)\n \
    \       Console.Write(\"* \");\n    Console.WriteLine();\n}\n```\n\nRun the above\
    \ code example: https://repl.it/@nakov/nested-loops-draw-rhombus-csharp."
