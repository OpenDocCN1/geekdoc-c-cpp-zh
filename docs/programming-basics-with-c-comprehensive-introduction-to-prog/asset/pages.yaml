    \ 3 parts – upper, middle and lower one. The upper part contains two\nsub-parts\
    \ - a first row and a body of the arrow. We can see from the examples that the\
    \ count of the\nouter dots on the first row and in the body of the arrow is (n\
    \ - 1) / 2. We can write this value in\nvariable outerDots.\n\n```\nvar outerDots\
    \ = (n - 1) / 2;\n```\n\nThe number of inside dots in the body of the arrow is\
    \ (n - 2). We must create a variable named\ninnerDots, which will store this value.\n\
    \n```\nvar innerDots = n - 2;\n```\n\nWe can see from the examples the structure\
