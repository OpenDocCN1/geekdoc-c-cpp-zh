  md: "# Other Rounding Methods\n\nIn case we always want to round down instead of\
    \ Math.Round(...) we can use another method Math.Floor(...) which always rounds\
    \ down, but always rounds to an integer. For example, if we have the number 5.99\
    \ and we use Math.Floor(5.99), we will get the number 5.\n\nWe can also do the\
    \ opposite – round up using the method Math.Ceiling(...). Again, if we have the\
    \ example 5.11 and we use Math.Ceiling(5.11), we will get 6. Here are some examples:\n\
    \n```\nvar numberOfToFloor = 5.99;\nConsole.WriteLine(Math.Floor(numberOfToFloor));\n\
    // This will print on the console 5\n\\var numberOfToCeiling = 5.11;\nConsole.WriteLine(Math.Ceiling(numberOfToCeiling));\n\
    // This will print on the console 6\n```\n\n# Rounding with a Placeholder\n\n\
