  md: "# Chapter 3.2. Simple Conditions – Exam Problems\n\nIn the previous chapter,\
    \ we went through the simple conditional statements in C#, which we can use to\
    \ execute different actions depending on a given condition. Now we shall solve\
    \ a few practical exercises from SoftUni exams to gain some experience.\n\n# Simple\
    \ Conditions – Quick Review\n\nWe mentioned that the scope of a variable is, and\
    \ how to track the execution of our program step by step (the-called debugging)\
    \ as well. In this chapter, we will practice working with simple conditions by\
    \ going through some exam tasks. To do this, let's first revise the if-else construction:\n\
    \n```\nif (bool expression)\n{\n    // condition body;\n}\nelse{\n    // else-construction\
    \ body;\n}\n```\n\nif conditions in C# consists of:\n\n+   - if clause\n  - bool\
    \ expression – a variable of type (bool) or bool logical expression (an expression\
    \ that results in true/false)\n  - condition body – contains block of source code\n\
    \  - else clause and its block of source code (optional)\n\nAfter having revised\
    \ how to write simple conditions, let's solve a few exam problems in order to\
    \ practice the if-else construction.\n\n# Problem: Transportation Price\n\nA student\
    \ has to travel n kilometers. He can choose between types of transportation:\n\
