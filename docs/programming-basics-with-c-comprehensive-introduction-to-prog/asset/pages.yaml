  md: "# The \"Return\" Operator\n\nIn order to obtain a result from the method we\
    \ need to use the return operator. It should be used in the body of the method\
    \ and tells the program to stop its execution and to return the method invoker\
    \ a certain value, which is defined by the expression after the operator.\n\n\
    In the example below there is a method that reads two names from the console,\
    \ concatenates them and returns them as a result. The return value is of type:\n\
    \n```\nstatic string ReadName()\n{\n    string firstName = Console.ReadLine();\n\
    \    string lastName = Console.ReadLine();\n    return firstName + \" \" + lastName;\n\
    }\n```\n\nThe return operator can also be used in void methods. This way the method\
    \ will stop its execution without returning a value, and there shouldn't be an\
    \ expression, which should be returned. In this case we use return to exit the\
    \ method.\n\nThere are cases where return can be called from multiple places in\
    \ the method, but only if there are certain input conditions.\n\n# The \"Return\"\
    \ Operator – Example\n\nWe have a method in the example below, which compares\
    \ two numbers and returns a result respectively -1 or 1 depending on if the first\
    \ argument is smaller, equal or larger than the second argument, given to the\
    \ function. The method uses the keyword return in three different places to return\
    \ values according to the logic of comparing the numbers:\n\n```\nstatic int CompareTo(int\
    \ number1, int number2)\n{\n    if (number1 > number2)\n    {\n        return\
    \ 1;\n    }\n    else if (number1 == number2)\n    {\n        return 0;\n    }\n\
    \    else\n    {\n        return -1;\n    }\n}\n```\n\nWe can invoke the above\
    \ method and ensure that it behaves as expected:\n\n+   - CompareTo(3, 4) -> -1\n\
    - CompareTo(20, 10) -> 1\n- CompareTo(5, 5) -> 0\n- CompareTo(-5, -7) -> 1\n-\
    \ CompareTo(-10, -5) -> -1"
