    # Problem: Numerical Expression


    Bonny is an exceptionally powerful witch. Her natural power is not sufficient
    to successfully fight vampires and werewolves, she has started to master the power
    of Expressions. An expression is very hard to master, the spell relies on it to
    quickly solve mathematical expressions.


    In order to use an "Expression spell", the witch must know the result of a mathematical
    expression in advance. An Expression spell consists of a few simple mathematical
    expressions. Each mathematical expression can contain operators for summing up,
    subtraction, multiplying and/or division.


    The expression is solved without considering the mathematical rules for calculating
    numerical expressions. This means that the priority is applied according to the
    sequence of the operators, and not the type of calculation that they do. The expression
    can contain brackets, as everything inside the brackets is calculated first. Every
    expression can contain multiple brackets, but no nested brackets:


    +   * An expression containing (...)() is an invalid one.

    * An expression containing (...)((..) is a valid one.


    # Example


    The expression


    ```

    4 + 6 / 5 (4 * 9 - 8) / 7 * 2

    ```


    is solved in the following way:


    ```

    4 + 6 / 5 (4 * 9 - 8) / 7 * 2 =

    10 / 5 + (4 * 9 - 8) / 7 * 2 =

    2 + (4 * 9 - 8) / 7 * 2 =

    2 + (36 - 8) / 7 * 2 =

    2 + 28 / 7 * 2 =

    30 / 7 * 2 =

    4.285172857142857 * 2 =

    8.571728571428571 =

    8.57

    ```


    Bonny is very pretty, but not as wise, she will need our help to master the power
    of Expressions.


    # Input Data


    The input data consists of a single text line, passed from the console. It contains
    a mathematical expression for calculation. The line always ends with the "=" symbol.
    The "=" symbol means end of the mathematical expression.


    The input data is always valid and always in the described format. No need to
    validate it.


    # Output Data


    The output data must be printed on the console. The output consists of one line:
    the result of the calculated mathematical expression, rounded up to the second
    digit after the decimal point.'
