  md: "# Chapter 6.1. Nested Loops 225\n\nLet's look at the example above. After initializing\
    \ the first (outer) loop, its body, which contains the second (nested) loop starts\
    \ executing. By itself it prints on one row n number of stars. After the inner\
    \ loop finishes executing at the first iteration of the outer one, the first loop\
    \ will continue, i.e. it prints an entry on the console. After that, the first\
    \ loop will be renewed and the whole loop will be executed again. The inner loop\
    \ will execute as many times as the body of the outer loop executes, in this case\
    \ n times.\n\n# Example: Rectangle Made of 10 x 10 Stars\n\nPrint on the console\
