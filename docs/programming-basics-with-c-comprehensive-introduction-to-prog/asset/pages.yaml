  md: "# Chapter 10. Methods 381\n\nIn this example the Result() method is a local\
    \ function, because it is nested in the Main() method, i.e. Result() is for Main().\
    \ This means that the Result() method can only be used in the Main() method, because\
    \ it's declared inside it. The difference between nested and normal methods is\
    \ nested methods can't be static. The difference for static will be later, we\
    \ will say for the moment when declaring a local function, we write only the return\
    \ value, the name of the method and its list of parameters. In this case it is\
    \ double Result(a, b).\n\nLocal functions can access variables, which are in the\
    \ method containing them. The next example demonstrates how this is happening:\n\
    \n```\nstatic void Main()\n{\n    string output = \"I am a local function\";\n\
    \    void PrintOutput()\n{\n        Console.WriteLine(output);\n    }\n}\n```\n\
    \nThis feature of nested methods makes them very helpful when solving a problem.\
    \ They save time and code, which we would otherwise lose to give them parameters\
    \ and variables, which we can already use in nested methods.\n\n# Naming Methods\n\
    \nWhen you use, mean meaningful names.\n\n+   - Because every method handles a\
    \ part of our problem, when naming it we should keep in mind the action it does,\
    \ it is a good practice for the name to describe what the method does.\n- Each\
    \ method must do only one task and its name should describe this task. This principle\
    \ in programming is 'strong cohesion'.\n- In C# method must start with uppercase\
    \ letter and be made of a verb or couple: verb + noun. The name is formatted following\
    \ the Upper Camel Case convention (PascalCase), i.e. each word, including the\
    \ first one, starts with uppercase.\n- The brackets ( and ) always follow the\
    \ name (without spaces).\n\nA few for correctly named methods:\n\n+   - FindStudent.\
    \ LoadReport.Sine\n- Method1.DoSomething. HandleStuff. SampleMethod.DirtyHack\n\
    \nA examples for incorrectly named methods (think why):\n\nIf you cannot think\
    \ of an appropriate name, the method probably solves more than one task or doesn't\
    \ have a clearly defined purpose and in this case you have to think about split\
    \ it into several simpler methods.\n\n# Naming Method Parameters\n\nWhen naming\
    \ the parameters of a method you can apply the same rules as with the methods\
    \ themselves. The difference here is that it is good for the names of the parameters\
    \ to use a noun or couple of an adjective and noun, and when naming the parameters,\
    \ we use the lowerCamelCase"
