  md: "Programming Basics with C#\n\n# The Code After \"Return\" is Inaccessible\n\
    \nAfter the return operator, there should not be any more lines of code in the\
    \ current block, because if it is, Visual Studio will warn you that it has found\
    \ a piece of code that is inaccessible:\n\n```\nstatic int SomeFunction()\n{\n\
    \    return 5;\n    return 2; // This code in unreachable\n}\nUnreachable code\
    \ detected\n```\n\nIn programming you can't have the return operator twice, one\
    \ after the other (double return), because executing the first one won't allow\
    \ the execution of the second one. From time to time programmers by saying \"\
    write return; return; and let's go\", in order to explain that the program logic\
    \ is lost.\n\n# The Returned Value\n\nAfter a method is executed and returns a\
    \ value, this value can be used in multiple ways.\n\nThe first one is to assign\
    \ the result as a value of a variable of a compatible type:\n\n```\nint max =\
    \ GetMax(5, 10);\n```\n\nThe second one is to pass the result to be used in an\
    \ expression:\n\n```\ndecimal total = GetPrice() * quantity * 1.20m;\n```\n\n\
    The third one is to pass the result of the method to another method:\n\n```\n\
