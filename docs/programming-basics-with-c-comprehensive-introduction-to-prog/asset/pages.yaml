  md: '# Programming Basics with C#


    +   * Operator <= (less than equals)

    * Operator >= (greater than equals)

    * Operator == (equals)

    * Operator != (different from)


    When compared, the result is a Boolean value true or false, depending on whether
    the result of the comparison is true or false.


    # Video: Comparing Numbers


    Watch the video lesson about comparing numbers: https://youtube.be/KTdqDWg7Wf8.


    # Examples for Comparing Numbers


    ```

    var a = 5;

    var b = 10;

    Console.WriteLine(a < b); // True

    Console.WriteLine(a > 0); // True

    Console.WriteLine(a > 100); // False

    Console.WriteLine(a < a); // False

    Console.WriteLine(a <= 5); // True

    Console.WriteLine(b == 2 * a); // True

    ```


    Note when printing the true and false values in C# language, they are printed
    with a capital letter, respectively True and False.


    # Comparison Operators


    In C#, we can use the following comparison operators:


    | Operator | Notation | Applicable for |

    | --- | --- | --- |

    | Greater than | > | |

    | Greater than or equals | >= | numbers, dates, other comparable objects |

    | Less than | < | |

    | Less than or equals | <= | |

    | Equals | == | numbers, strings, dates |

    | Not equal | != | |


    The following example demonstrates how to use comparison operators in expressions:


    ```

    var result = (5 < 6);

    Console.WriteLine(result); // True

    ```


