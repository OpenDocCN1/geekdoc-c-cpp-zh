  md: "A method should be called from a code inside another method, e.g. from the\
    \ Main() method of the C# program:\n\n```\nstatic void Main()\n{\n    PrintHeader();\n\
    }\n```\n\n# Why Use Methods?\n\nSo far we determined that methods help with dividing\
    \ larger programs into smaller parts, which leads to easier solving of the problem\
    \ and makes our program not only better structured and easier to read, but more\
    \ understandable as well.\n\nBy using methods, we avoid repeating code. Repetition\
    \ is bad practice, because it complicates maintaining the program and leads to\
    \ errors. If a certain part of our code can be found more than once in the program\
    \ and we need to change it, the changes must be made in all of repetitions of\
    \ the code in question. There is a great probability to miss a spot where correction\
    \ is needed, which would lead to incorrect behavior of the program. This is the\
    \ reason why it is good practice to use a certain fragment of code more than once\
    \ in our program, define it as a separate method.\n\nMethods make it possible\
    \ to use code multiple times. With solving and more problems, you will find that\
    \ using already existing methods saves a lot of time and effort.\n\n# Declaring\
    \ Methods\n\nIn C# you can declare methods inside a class, i.e. between the opening\
    \ { and closing } brackets of the class. Declaring is registering the method in\
    \ the program, so that it can be recognized in the rest of it. The best-known\
    \ example is the Main(...) method, which we use in every program that we write.\n\
    \nclass Methods\n\n```\n0 references\nstatic void Main()\n{\n}\n```\n\nWith the\
    \ next example we will look at the mandatory elements in the declaration of a\
