  md: '# Chapter 2.2. Simple Calculations – Exam Problems 105


    Again: after we have an idea on how to solve the problem and we have considered
    the data types that we are going to use, we can start writing the program. As
    in the previous tasks, we can divide the solution into three smaller tasks:


    +   - Reading the input from the console.

    - Doing the calculations.

    - Printing the output on the console.


    We declare the variables that we are going to use by trying to choose meaningful
    names. With Console.ReadLine(...) we read the input from the console and we convert
    the string to int or double with int/double.Parse(...).


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_104_0.png)


    # Doing the Calculations


    We do the calculations:


    ```

    double monthSalary = workloads * moneyPerDay;

    double moneyYear = (monthSalary * 12) + (monthSalary * 2.5);

    double taxes = 0.25 * moneyYear;

    double netSalary = moneyYear - taxes;

    double salaryInEUR = netSalary * currencyRate;

    ```


    We could write an expression that calculates the annual income without brackets
    as well. As multiplication is an operation that has a higher priority over addition,
    it will be performed first. Despite, writing brackets is recommended when using
    more operators, by this way the code is easily readable and chances of making
    a mistake smaller.


    # Printing the Result


    Finally, we have to print the result on the console. We notice that the number
    has to be rounded up to the second digit after the decimal point. In order to
    do that, we can use a placeholder - an item that will be replaced by a particular
    value when printing. In C#, a digit surrounded by curly brackets is used for a
    placeholder. As in programming starts from 0, the expression {0} means that it
    will be replaced by the first argument. We can format an integer or a floating-number
    using F or f, which is followed by a positive number, specifying the number of
    digits after the decimal point:


    ```

    double average = salaryInEUR / 365;

    Console.WriteLine("{0:f2}", average);

    ```


