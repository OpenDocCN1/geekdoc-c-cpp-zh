    var b = 2.5;

    var sum = "The sum is: " + (a + b);

    Console.WriteLine(sum); // The sum is: 1.525

    ```


    Did you notice something strange? Maybe you expected the numbers a and b to be
    summed? Actually, the concatenation works from left to right and the result above
    is absolutely correct.


    If we want to sum the numbers, we have to use brackets, in order to change the
    order of execution of the operations:


    ```

    var a = 1.5;

    var b = 2.5;

    var sum = "The sum is: " + (a + b);

    Console.WriteLine(sum); // The sum is: 4

    ```


