    # Problem: Crossing Sequences


    We have two sequences:


    +   - a sequence of Tribonacci (by analogy with the Fibonacci sequence), each
    number is the sum of the previous three (with given numbers)

    - a sequence generated by a numerical spiral defined by looping a spiral (right,
    bottom, left, top, right, bottom, left, top, etc.) of a matrix of numbers starting
    from its center with a given starting number and incremental step, by storing
    the current numbers in the sequence each we make a turn


    Write a program that finds the first number that appears in both sequences defined
    in the aforementioned.


    # Example


    Let the Tribonacci sequence start with 1, 2 and 3. This means that the first sequence
    will contain the numbers 1, 2, 3, 6, 11, 20, 37, 68, 125, 230, 423, 778, 1431,
    2632, 4841, 8904, 16377, 30122, 55403, 101902, and so on.


    At the same time, the numbers in the spiral begin with 5 and the spiral increases
    by 2 at each step.


    The second sequence will contain the numbers 5, 7, 9, 13, 17, 23, 29, 37 and so
    on. We see that 37 is the first number be found in the Tribonacci sequence and
    in the spiral one, and that is the desired solution to the problem.


    | 45 | | | | | 55 |

    |---|---|---|---|---|---|n| | 17 | 19 | 21 | 23 | ... |

    | ... | ... | ... | | | | | |

    | | | 15 | 5 | 7 | ... |

    | ... | | | | | | | ... |

    | | | 13 | 11 | 9 | ... |

    | ... | | | | | | | ... |

    | 37 | | | | 29 | ... |

    | ... | | | | | | | ... |

    | ... | | | | | 65 |


    # Input Data


    Input data should be read from the console.


    +   - On the first line of the input we will read three integers, representing
    the first three numbers in the Tribonacci sequence, positive non-zero numbers,
    sorted in ascending order.

    - On the next two lines of the input we will read two integers representing the
    first number and the step for each cell of the matrix for spiral of numbers. The
    numbers representing the spiral are positive non-zero numbers.


    Input data will always be valid and will always be in the format described. No
    need to check.


    # Output Data


    The result should be printed on the console.'
