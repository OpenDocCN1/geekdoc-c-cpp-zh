    # The Programming Language Doesn''t Matter!


    As it already became clear, the difference between programming languages and more
    specific between the skills of developers in different languages and technologies
    forms 10-20% of the developer''s skills.


    +   - All programmers have around 80-90% of the same skills that do not depend
    on the programming language! These are the skills to program and design and develop
    software, that are very similar in different programming languages and development
    technologies.


    +   - The more languages and technologies you know, the faster you will learn
    new ones, and the less you will feel the difference between them.


    Indeed, the programming language almost does nothing, you just have to learn to
    program, and this starts with coding (this book) goes on the more complex programming
    concepts (like data structures, algorithms, OOP and FP) includes of the fundamental
    knowledge and skills for software development, software engineering and computer
    science.


