  md: "In general, there are different approaches and ways to apply the above conditions,\
    \ but let's examine a basic switch-case conditional statement, in the individual\
    \ case blocks we will use if and if-else conditional statements.\n\n# Calculating\
    \ Prices for May and October\n\nLet's start with the first group of months: May\
    \ and October. For these two months the price for stay is the same for both types\
    \ of accommodation - in a studio or an apartment, therefore the only that remains\
    \ is to apply an internal condition regarding the number of stays and recalculate\
    \ the relevant price (if needed).\n\n```\nswitch (month)\n{\n    case \"May\"\
    :\n    case \"October\":\n        studioPrice = 50.00M;\n        apartmentPrice\
    \ = 65.00M;\n\n        studioRent = studioPrice * nights;\n        apartmentRent\
    \ = apartmentPrice * nights;\n\n        if (nights > 14)\n        {\n        \
    \    studioRent *= 0.70M;\n            apartmentRent *= 0.90M;\n        }\n  \
    \      else if (nights > 7)\n        {\n            studioRent *= 0.95M;\n   \
    \     }\n        break;\n```\n\n# Calculating Prices for June, September, July\
    \ and August\n\nTo some extent, the logic and calculations will be identical for\
    \ the following months.\n\n```\ncase \"June\":\ncase \"September\":\n    studioPrice\
    \ = 75.20M;\n    apartmentPrice = 68.00M;\n\n    studioRent = studioPrice * nights;\n\
    \    apartmentRent = apartmentPrice * nights;\n\n    if (nights > 14)\n    {\n\
    \        studioRent *= 0.80M;\n        apartmentRent *= 0.90M;\n    }\n```"
