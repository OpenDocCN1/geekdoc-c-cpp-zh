  md: "# 392 Programming Basics with C#\n\nYou can see here an example for badly formatted\
    \ code according to the accepted conventions for writing code in C#:\n\n```\n\
    if(someCondition)\n    Console.WriteLine(\"Inside the if statement\"););\n```\n\
    \nThe first thing that we see is the curly brackets {}. The first (opening) bracket\
    \ should be just below the if condition, and the second (closing) bracket - below\
    \ the command Console.WriteLine(...), at a new and empty line. In addition, the\
    \ command if condition should be offset by 4 white spaces (one tab). Just after\
    \ the keyword if and before the condition you put a space.\n\nThe same rule applies\
    \ for the for loops and all other constructions with curly brackets {}. Here are\
    \ some examples:\n\nCorrect formatting:\n\n```\nfor (int i = 0; i < 5; i++)\n\
    {\n    Console.WriteLine(i);\n}\n```\n\nWrong formatting:\n\n```\nfor(int i=0;i<5;i++){\n\
    \    Console.WriteLine(i);\n}\n```\n\n# Code Formatting Shortcuts in Visual Studio\n\
    \nFor your comfort there are keyboard shortcuts in Visual Studio, we will explain\
    \ later in chapter, but for now we are interested in two specific combinations.\
    \ The first is for formatting the code in the entire program, and the second for\
    \ formatting part of the code. If we want to format the entire code, we need to\
    \ press [CTRL + K + D]. If we need to format only a part of the code, we need\
    \ to mark this part with the mouse and press (CTRL + K + F).\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_391_0.png)\n\
    \nLet's use the wrongly formatted example from earlier:\n\n```\nfor(int i=0;i<5;i++){\n\
    \    Console.WriteLine(i);\n}\n```\n\nIf we press [CTRL + K + D], which is the\
    \ combination to format the whole document, we will have a code, formatted according\
    \ to the accepted conventions for C#, which will look like follows:"
