    # Algorithms


    Computer programs usually execute some algorithm. **Algorithms** are a **sequence
    of steps**, necessary for the completion of a task and for gaining some expected
    result, something like a “recipe”.


    For example, if we fry eggs, we follow some recipe (algorithm); we warm up the
    egg in a pan, break the eggs inside it, wait for them to move and fry away from
    the stove.


    Similarly, in programming the **computer programs execute algorithms**: a sequence
    of commands, necessary for the completion of a task. For example, to arrange a
    sequence of numbers in an ascending order, an algorithm is needed, eg find the
    smallest number and it, then find the smallest number among the rest of numbers
    and print it, and this is repeated until there are no more numbers left.


    For convenience when creating programs, for writing programming code, for execution
    of programs and other operations related to programming, we need a **development
    environment**, for example Visual Studio.


    # Languages, Compilers, Interpreters and Environments


    Let’s review some concepts from computer programming: programming languages, compilers,
    interpreters and development environments (IDEs).


    # Programming Languages


    **A programming language** is an artificial language (syntax for expression),
    meant for **giving commands** that we want the computer to read, process and execute.
    Using programming languages, we write sequences of commands (*programs*), which
    define **what the computer should do**. Examples of programming languages are
    C#, Java, JavaScript, Python, C, C++, PHP, Swift, and many others. These languages
    differ in their philosophy, syntax, program constructions and execution environment.
    The execution of computer programs can be done with a **compiler** or an **interpreter**.


    # Compilers


    The compiler translates the code from programming language to **machine code**,
    as for each of the constructions (commands) in the code it chooses a proper, previously
    prepared fragment of machine code and in the meantime, it **checks the text of
    the program for errors**. Together, the compiled fragments comprise the program
    into a machine code, as the microprocessor of the computer expects'
