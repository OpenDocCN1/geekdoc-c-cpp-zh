    \ times as we need them.\n\nA method can be called as many times, as we think\
    \ we need, in order to solve a problem. This saves repeating the same code over\
    \ and over again, and also reduces the possibility to make a mistake when correcting\
    \ the code.\n\n# # Simple Methods\n\nSimple methods are used for performing a\
    \ certain action helps to solve a given problem. These actions can be printing\
    \ a string on the console, doing a verification, executing a loop, etc.\n\nLet's\
    \ see the following example of a simple method:\n\n```\nstatic void PrintHeader()\
    \ {\n  Console.WriteLine(\"--------------------\");\n}\n```\n\nThis method prints\
