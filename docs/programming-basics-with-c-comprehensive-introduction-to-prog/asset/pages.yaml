  md: "# Adding the DrawRatings(int) Method\n\nAdd a method DrawRatings in the controller\
    \ HomeController. Open the file Controllers/HomeController.cs and add the following\
    \ code:\n\n```\npublic ActionResult DrawRating(int rating)\n{\n    var fullStars\
    \ = rating * 10 / 100;\n    var emptyStars = (100 - rating) * 10 / 100;\n    var\
    \ halfStars = 10 - fullStars - emptyStars;\n\n    var stars = \"\";\n    for (int\
    \ i = 0; i < fullStars; i++)\n        stars += \"<img src='images/full-star.png'\
    \ />\";\n    for (int i = 0; i < halfStars; i++)\n        stars += \"<img src='images/half-star.png'\
    \ />\";\n    for (int i = 0; i < emptyStars; i++)\n        stars += \"<img src='images/empty-star.png'\
    \ />\";\n\n    ViewBag.Stars = stars;\n    ViewBag.Rating = rating;\n    return\
    \ View(\"Index\");\n}\n```\n\nThe above code takes the number rating, which makes\
    \ calculations to find the number of full stars, the number of empty stars and\
    \ number of half-full stars, from which it generates an HTML code, which orders\
    \ a few of stars after the other so that it can make the rating picture from them.\
    \ The ready HTML code is stored in ViewBag.Stars to view the Index.cshtml. Additionally,\
    \ the rating is kept (as a number) in ViewBag.Rating, so that it can be put in\
    \ the field for rating in view. In order to use your work, you can help yourself\
    \ with the picture of Visual Studio below:\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_238_0.png)"
