  md: '# Chapter 8.1. Practical Exam Preparation - Part I 299


    ```

    int y1 = int.Parse(Console.ReadLine());

    int x2 = int.Parse(Console.ReadLine());

    int y2 = int.Parse(Console.ReadLine());

    int x3 = int.Parse(Console.ReadLine());

    int y3 = int.Parse(Console.ReadLine());

    ```


    # Calculate Triangle Side and Height


    We have to calculate the side and the height of the triangle. From the pictures,
    as well as the condition y2 = y3, we notice that the side is parallel to the horizontal
    axis. This means that its length is equal to the length of the segment between
    its coordinates x2 and x3, which is equal to the difference between the larger
    and smaller coordinates. Similarly, we can calculate the height. It will be equal
    to the difference between y1 and y2 (or y3, as they are equal). Since we do not
    know if x2 is greater than x3, or y1 will be below or above the triangle, we will
    use the absolute values of the difference in positive numbers, because one segment
    cannot have a negative length.


    ```

    int a = Math.Abs(x2 - x3);

    int h = Math.Abs(y2 - y1);

    ```


    # Calculate and Print Triangle Area


    we will utilize our familiar formula for finding an area of a triangle. An important
    thing to keep in mind is that although we get integers at an input, the area will
    not always be an integer. That''s why we use double type for the area. We have
    to convert the right side of the equation, if we give numbers as equation parameters,
    our result will also be an integer.


    ```

    double s = (double)a * h / 2;

    ```


    The only thing left is to print the area on the console.


    ```

    Console.WriteLine(s);

    ```


