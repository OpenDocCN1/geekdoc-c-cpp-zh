  md: "# Chapter 4.1. More Complex Conditions 155\n\n# Example: Point on a Rectangle\
    \ Border\n\nWrite a program that checks whether a point [x, y] is placed any of\
    \ the sides of a rectangle [x1, y1] - [x2, y2] (see the figure).\n\nThe input\
    \ data is read from console and consists of 6 lines: the decimal numbers x1, y1,\
    \ x2, and y (as it is guaranteed that x1 < x2 and y1 < y2). Print \"Border\" (if\
    \ the point lies on any of the sides) or \"Inside / Outside\" (in the opposite\
    \ case).\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_154_0.png)\n\n# Sample Input\
    \ and Output\n\n| Input | Output |\n| --- | --- |\n| 2 | |\n| -3 | |\n| 12 | Border\
    \ |\n| 3 | Inside / Outside |\n| -8 | |\n| -1 | |\n\n# Solution\n\nThe point lies\
    \ on any of the sides of the rectangle if:\n\n+   - coincides with x1 or x2 and\
    \ at the same time y is between y1 and y2\n- coincides with y1 or y2 and at the\
    \ same time x is between x1 and x2.\n\nThis may be checked as follows:\n\n```\n\
    if ((x == x1 || x == x2) && (y >= y1) && (y <= y2)) ||\n    (y == y1 || y == y2)\
    \ && (x >= x1) && (x <= x2))\n{\n    Console.WriteLine(\"Border\");\n}\n```\n\n\
    The previous evaluation might be simplified in the following way:\n\n```\nvar\
    \ onLeftSide = (x == x1) && (y >= y1) && (y <= y2);\nvar rightSide = (x == x2)\
    \ && (y >= y1) && (y <= y2);\nvar upSide = (y == y1) && (x >= x1) && (x <= x2);\n\
    var downSide = (y == y2) && (x >= x1) && (x <= x2);\nif (onLeftSide || rightSide\
    \ || upSide || downSide)\n{\n    Console.WriteLine(\"Border\");\n}\n```\n\nThe\
    \ second way with the additional Boolean variables is longer, but much more understandable\
    \ than the first one. We recommend when you use logical conditions to make them\
    \ easy to read and understand, instead of making them complex. Use additional\
    \ variables with meaningful names. The names of the variables help hint what is\
    \ the value that is kept inside them.\n\nWhat remains to finish writing the code\
    \ to print \"Inside / Outside\", if the point is not on any of the sides of the\
    \ rectangle."
