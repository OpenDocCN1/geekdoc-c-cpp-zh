    \ An integer is prime if it is divisible by itself and by 1. By definition, the\
    \ prime numbers are positive and greater than 1. The smallest prime number is\
    \ 2.\n\nWe can assume that an integer n a prime number if n > 1 and n is not divisible\
    \ by a number between 2 and n-1.\n\nThe first prime numbers are 2, 3, 5, 7, 11,\
    \ 13, 17, 19, 23, 31, 37, 41, 43, ...\n\nUnlike the prime numbers, composite numbers\
    \ are integers which can be obtained by multiplying several prime numbers.\n\n\
    Here are some examples of composite numbers:\n\n+   - 10 = 2 * 5\n- 42 = 2 * 3\
    \ * 7\n- 143 = 13 * 11\n\nPositive integers, greater than 1, can be either prime\
    \ or composite (product of primes). Numbers like 0 and 1 are not prime but not\
    \ composite.\n\nWe can check if an integer is prime following the definition:\
    \ check if n > 1 and n is divisible by 2, 3, ... n-1 without remainder.\n\n+ \
    \  - If it is divisible by any of the numbers, it is composite.\n- If it is not\
    \ divisible by any of the numbers, then it is prime."
