    # Hints and Guidelines


    The problem can be divided into four logical parts:


    +   * Reading the input.

    * Checking all numbers in the given range, and running a loop.

    * Checking the conditions of the problem according every number in the given range.

    * Printing the numbers.


    First is ordinary – we read three integers from the console, so we will use **int**.

    We have already seen examples of the second part – initialization of the **for**
    loop. It is a bit tricky – the explanations mean that the numbers have to be in
    **reversed order**. This means that the initial value of variable **i** will be
    **bigger**, and from the examples we can see that it is M. The final value of
    **i** should be N. The fact that we will print the results in reversed order and
    the values of **i**, suggests that the value will be **decreased by 1**.


    ```

    for (int i = m; i >= n; i--)

    ```


    After we have initialized the for loop, it is for the third part of the problem
    – checking the condition if the given number is divisible by 2 and 3 without remainder.
    We will do this using one simple **if** condition that will leave the reader to
    do by themselves.

    Another tricky part of this problem is that from the above we need to do another
    one – whether the number is equal to the “stop” entered from the console on the
    third line. To do this, the previous one has to be passed. We will add another
    statement we nest in the previous one. If the condition is **true**, we need to
    stop the program from printing. We can do this using a **break** operator, and
    it will lead us **out of** the **for loop**.nIf the condition checks whether the
    number is equal with “stop” returns a **false** result, our program should **continue
    to** print. This covers the **fourth** and **last** part of our program.


