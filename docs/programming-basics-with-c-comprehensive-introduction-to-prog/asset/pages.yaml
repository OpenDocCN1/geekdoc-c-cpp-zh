  md: '# Chapter 1. First Steps in Programming


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_38_0.png)


    A project in VS logically groups multiple files constructing a given application
    or a component. A C# project contains one or more source files, configuration
    files and other resources. In every C# source file, there is one or more definition
    of types (classes or others). In the classes there are methods (actions), and
    they contain a sequence of commands. It sounds complicated, but with bigger projects
    a structure like this is very convenient and allows good organization of the files.


    Visual Studio represents a container (a work solution), which a few projects are
    logically bound. The purpose of the binding of VS projects is to create an opportunity
    for the code of any of the projects to collaborate with the code from the rest
    of the VS, to ensure the application or the website work correctly. When the software
    product or service that we develop is big, it is built as a VS, and this solution
    is split into projects and inside each project there are folders with source files.
    This hierarchical organization is much more convenient with more serious projects
    (let''s say over 50 000 lines of code).


    For smaller projects VS Solutions and VS Projects are complicating the work, rather
    than helping, but you will get used to it quickly.


