    \ structure of methods, how to declare them and invoke them by their name.\n\n\
    +   * We went over examples for methods with parameters and how to use them in\
    \ our program.\n\n+   * We learned what signature and return value of a method\
    \ is and what also is the purpose of the operator return.\n\n+   * We introduced\
    \ ourselves with the good practice when working with methods, how to name them\
    \ and parameters, how to format code, etc.\n\n# Defining a Method\n\nThis is how\
    \ we define a method, which takes a parameter and returns a value:\n\n```\nstatic\
    \ double CircleArea(double radius)\n{\n    return Math.PI * radius * radius;\n\
    }\n```\n\nThe above example defines a method called \"CircleArea\", which takes\
    \ as a parameter a number (double) and returns as a number (double).\n\n# Invoking\
