  md: "# Nested Methods (Local Functions)\n\nLet's examine the following example:\n\
    \n```\nstatic void Main()\n{\n    double first = 1.22;\n    double second = 3.27;\n\
    \    double Result(double a, double b)\n    {\n        return a + b;\n    }\n\
    \    Console.WriteLine(Result(first, second));\n}\n```\n\n# What Is a Local Function?\n\
    \nWe can see that in this code Main() method has another declared method Result().\
    \ This nested method is called local function.\n\nLocal functions can be declared\
    \ inside every other method. When the C# compiles functions, they are turned into\
    \ private methods. You will learn about the difference between public and private\
    \ methods later, we can now say that private is only used in the class, in which\
    \ they have been declared. The programs that we write at this level are using\
    \ only one class, therefore we can use local methods without any concerns.\n\n\
    # Why Use Local Functions?\n\nWith time and practice you will see that you are\
    \ writing code, you often need methods that you only need once; or the method\
    \ gets very long. We said earlier that when a method contains many lines of code\
    \ it becomes hard to read and maintain.\n\nThis is where local functions come\
    \ in handy - they help declare a new method in one we we already have, and it\
    \ will be used only once. This helps making our code better ordered and easier\
    \ to read, which helps for faster correction if there is an error in the code\
    \ and limits the possibility for mistakes when making changes in the program logic.\n\
    \n# Declaring Local Functions\n\nLet's look again at the previously mentioned\
    \ example:\n\n```\nstatic void Main()\n{\n    double first = 1.22;\n    double\
    \ second = 3.27;\n    double Result(double a, double b)\n    {\n        return\
    \ a + b;\n    }\n    Console.WriteLine(Result(first, second));\n}\n```"
