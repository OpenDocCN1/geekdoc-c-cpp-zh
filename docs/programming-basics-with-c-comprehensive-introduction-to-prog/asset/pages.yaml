    \ create a loop, which runs n - 2 times.\n\n```\nfor (int i = 0; i < innerDots;\
    \ i++) {\n    Console.WriteLine(\"{0}#{1}{0}\");\n    new string(\\'.', outerDots);\n\
    \    new string(\\#', i));\n}\n```\n\nThe middle of the figure is made of a beginning\
