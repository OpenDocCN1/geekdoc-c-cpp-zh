  md: "Chapter 10. Methods\n\n377\n\ndivision.\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_376_0.png)\n\
    \n# Method Overloading\n\nIn many programming languages like C# and Java the same\
    \ method can be declared in few variants with the same name and different parameters.\
    \ This goes by the term \"method overloading\". Now's see how to write these overloaded\
    \ methods in C#.\n\n# Method Signature\n\nIn programming methods are identified\
    \ through the elements of their declaration: name of the method a + list of its\
    \ parameters. These two elements define its specification, the so called \"method\
    \ signature\". The method signature is defined by the method name and the definitions\
    \ of the method parameters (only parameter types are considered, and the parameter\
    \ names are ignored). Example:\n\n```\nstatic void Print(string text)\n{\n   \
    \ Console.WriteLine(text);\n}\n```\n\nIn this example the method's signature is\
    \ its name (Print), together with its parameter types (string). If our program\
    \ holds several methods with the same name, but with different lists of parameters\
    \ (signatures), we can use \"method overloading\".\n\n# Overloading Methods in\
    \ C# Programs\n\nAs mentioned, if you use the same name for several methods with\
    \ different signatures, this means that you are overloading a method. The code\
    \ below shows how different methods can use the same name with different combinations\
    \ of parameters and execute different actions.\n\n```\nstatic void Print(string\
    \ text)\n{\n    Console.WriteLine(text);\n}\n```\n\n```\nstatic void Print(int\
    \ name)\n{\n    Console.WriteLine(number);\n}\n```"
