  md: '# Chapter 4.1. More Complex Conditions 153


    # Testing in the Judge System


    Test your solution: https://judge.softuni.org/Contests/Practice/Index/508#2.


    # Logical "OR"


    The "OR" operator (||) means that **at least one** among few conditions is fulfilled.
    Similar to the operator &&, the logical "OR" accepts a few arguments of **bool**
    (conditional) type and returns **true** or **false**. We easily guess that we
    obtain a **true** value every time when at least one of the arguments has a **true**
    value (see the truth table).


    | a | b | a || b |

    | true | true | true |

    | true | false | true |

    | false | true | true |

    | false | false | false |


    Typical example of the logic of this operator is the following: At school the
    teacher says "John or Peter should clear the board." To fulfill this condition
    (to clear the board), it is possible just for John to clean it, or for Peter to
    clean it, or both of them to do it.


    # Video: Logical "OR"


    Watch the video about "OR" in programming: https://youtube.com/e6i-2E66RNU.


    # How the || Operator Works


    We have already learned what logical "OR" represents. But how is it actually being
    achieved? Just like the logical "AND", the program **checks** from left to right
    the arguments that are given. In order to obtain **true** from the expression,
    it is necessary for **just one** argument to have a **true** value. Respectively,
    the checking continues until an argument with **value** is met or until the arguments
    are over. Here is one example of the expression in action:


    ```

    bool a = false;

    bool b = true;

    bool c = false;

    bool d = true;

    bool result = a || b || c || d;

    // (as c and d are not being checked)

    ```


    The programs **checks** a, accepts that it has a value **false** and continues.
    Reaching **b**, it understands that it has a **true** value and the **expression**
    is calculated as **true**, **without** having to check **c** or **d**, because
    their values **wouldn''t** change the result of the expression.


    # Example: Fruit or Vegetable


    Let''s check whether a given **product** is a **fruit** or a **vegetable**.


    +   - The "fruits" are banana, apple, kiwi, lemon and grapes.

    - The "vegetables" are tomato, cucumber, pepper and carrot.

    - Everything else is "unknown".


    # Sample Input and Output


    | Input | Output |

    | banana | fruit |

    | Input | Output |

    | tomato | vegetable |

    | Input | Output |

    | java | unknown |'
