  md: "# Chapter 6.2. Nested Loops – Exam Problems\n\nIn the previous chapter we introduced\
    \ nested loops and how to use them to draw different kinds of figures on the console.\
    \ Now we shall solve a few exam problems to gain more experience.\n\n# Nested\
    \ Loops – Quick Review\n\nWe learned how to print figures with different sizes,\
    \ thinking of an appropriate logic to construct them using nested and for loops\
    \ in combination with various calculations and program logic:\n\n```\nfor (var\
    \ r = 1; r <= 5; r++) {\n  Console.Write(\"*\");\\n  for (var c = 1; c < 5; c++)\
