  md: '# Tricks for C# Developers


    In this section we will recall tricks and techniques in programming with C#, already
    seen in the book, which can be very useful if you attend an exam for beginner
    programming.


    # Inserting Variable Values in Strings


    In programming we often need to combine text with variable values to obtain a
    string value, e.g.


    ```

    var text = "some text";nConsole.WriteLine("{0}", text);

    // This will print on the console "some text"

    ```


    In this case we use a placeholder - {x}, where x is a number (larger than or equal
    to O), corresponding to the position on which we placed our variable. Therefore,
    if we insert two variables, we will have one placeholder, which will be {0} and
    it will keep the value of the first variable and another one - {1}, which will
    keep the value of the second variable. For example:


    ```

    var text = "some text";nvar number = 5;

    Console.WriteLine("{0} {1}", text, number);

    // This will print some text 5 some text

    ```


    In this example we can see that not only text variables. We can also a given variable
    several times and for we put the number which corresponds to the position of the
    variable in the placeholder. In this case position zero is the variable text,
    and at first is the variable number. At the beginning, numbering can be confusing,
    but you need to remember that in programming counting starts from O.


    # Formatting with 2 Digits After the Decimal Point


    When we print numbers, we often need to round them to 2 digits after the decimal
    point, e.g.


    ```

    var number = 5.432432;

    Console.WriteLine(Math.Round(number, 2));

    // This will print on the console "5.43"

    ```


    # Rounding Numbers


    To round numbers, we may use the Math.Round(...) method, which takes 2 parameters:


    +   - the first one is the number we want to round

    - the second is the one that determines how many digits after the decimal point
    we want to round (this should be an integer)


    If we want to round to 2 digits after the decimal point and the third digit is
    lower than 5, as in the example above, the rounding is down, but if the third
    digit is equal or bigger than 5 - the rounding is up, in the example below:


    ```

    var number = 5.4389;

    Console.WriteLine(Math.Round(number, 2));

    // This will print on the console "5.44"

    ```'
