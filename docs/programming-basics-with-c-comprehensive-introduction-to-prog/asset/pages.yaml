  md: "# Chapter 10. Methods\n\nIn the current chapter we get familiar with methods\
    \ and learn what they are, and which are the base concepts when working with them.\
    \ We will also learn why it is a good practice to use them, how to call them.\
    \ We will look at parameters and return value of a method, and also understand\
    \ how to use the returned value. At the end of the chapter we will look at the\
    \ established practices using methods.\n\n# Introduction by Examples\n\nMethods\
    \ allow invoking a parameterized named piece of code several times from many places\
    \ in the code. Example:\n\n```\nstatic void PrintLetter(char letter, int count)\n\
    {\n    for (int i = 0; i < count; i++)\n        Console.Write(letter + \" \");\n\
    \        Console.WriteLine();\n}\n\nstatic void Main()\n{\n    int count = 0;\n\
    \    for (char letter = 'a'; letter <= 'd'; letter++)\n        PrintLetter(letter,\
    \ ++count);\n\n    for (char letter = 'c'; letter >= 'a'; letter--)\n        PrintLetter(letter,\
    \ --count);\n}\n```\n\nRun the above code example: https://repl.it/@nakov/triangle-of-letters-csharp.\n\
    \nThe above code produces the following output:\n\n```\na\nb b\nc c c\nd d d d\n\
    c c c\nb b\na\n```\n\nThe above method (named piece of code) PrintLetter(letter,\
    \ count) prints given character (letter) several times (count). It is invoked\
    \ several times in two loops from the program Main() method.\n\nLet's get into\
    \ details how methods are defined, how methods are invoked, how methods accept\
    \ parameters (input values) and how methods return results (output values).\n\n\
    Methods can take parameters and can return values. e.g.\n\n```\nstatic double\
    \ CalCircleArea(double radius)\n{\n    return Math.PI * radius * radius;\n}\n\
    ```\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_362_0.png)"
