  md: '# Programming Basics with C#


    The input data will always be valid. There is no need to verify them.


    # Output Data


    The output data must be printed on the console. The output must consist of a single
    line, holding all suggested numbers, space separated. If there are no suggested
    numbers that match the criteria from the console, we must print "No".


    # Constraints


    +   - The secret number will always consist of 4 digits in the range [1.9].

    - The number of cows and bulls will always be in the range [0.9].

    - Allowed execution time: 0.15 seconds.

    - Allowed memory: 16 MB.


    # Sample Input and Output


    | Input | Output |

    | --- | --- |

    | 2228 | 1222 2122 2232 2242 2252 2262 2272 2271 2281 2284 2285 2286 2287 |

    | 2 | 2289 2392 2422 2522 2562 2722 2821 2823 2824 2825 2826 2827 2829 |

    | 1 | 2922 3222 4222 5222 6222 7222 8221 8223 8224 8225 8226 8227 8229 9222 |


    | Input | Output |

    | --- | --- |

    | 1234 | 1134 1214 1224 1231 1232 1233 1235 1236 1237 1238 1239 1244 1254 1264
    |

    | 0 | 1274 1284 1294 1334 1434 1534 1634 1734 1834 1934 2234 3234 4234 5234

    6234 7234 8234 9234 |


    # Hints and Guidelines


    We solve the problem in a few steps:


    +   - We will read the input data.

    - We will generate all possible four-digit combinations (candidates for verification).

    - For each generated combination we will calculate how many bulls and how many
    cows it has according to the secret number. Upon matching the needed bulls and
    cows, we will print the combination.


    # Reading the Input Data


    We have 3 lines in the input data:


    +   - Secret number.

    - Number of desired bulls.

    - Number of desired cows.


    Reading the input data:


    ```

    int guessNumber = int.Parse(Console.ReadLine());

    argetBulls = int.Parse(Console.ReadLine());

    targetCows = int.Parse(Console.ReadLine());

    ```'
