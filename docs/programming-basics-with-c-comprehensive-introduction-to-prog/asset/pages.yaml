    # Lab: Graphical and Web Applications


    Now we are able to build one simple web application and one simple graphical application,
    in order to take a look at what we will be able to create when progress with programming
    and software development. We are not going to look through the details about the
    used techniques and constructions fundamentally. Rather than that, we are just
    going to take a look at the arrangement and functionality of our creation. As
    we progress with our knowledge, we will be able to do bigger and more complex
    software applications and systems. We hope that the examples given below will
    strengthen your interest, rather than what we give you.


    # Console, Graphical and Web Applications


    With console applications, as you can figure yourself, all operations for reading
    input and printing output are done through the console. The input data is entered
    in the console, which is read by the application, also in it, and the output data
    is printed on the console or during the runtime of the program.


    While a console application uses the text console, web applications use user-based
    interface. To execute them, two things need – a web server and a web browser,
    as the browser plays the main role in the visualization of the data and the interaction
    with the user. Web applications are more pleasant for the user, they visually
    look better, and a mouse and touch can be used (for tablets and smartphones),
    but programming stands behind all of that. And this is why we have to learn to
    program and we have made our first steps towards that.


    GUI applications have a visual user interface, directly into your computer or
    mobile device, without a browser. Graphical applications (also known as desktop
    applications) contain one or more graphical windows, in which certain controllers
    are text fields, buttons, pictures, tales and others), serving for dialog with
    the user in an intuitive way. They are similar to the mobile applications in your
    phone or tablet: we use forms, text fields, buttons and other controls and we
    control them by programming code. This is why we are learning how to write code:
    the code is everywhere in software development.


    # Exercises: GUI and Web Applications


    In the next exercises we will create a GUI and a Web application:


    +   - Graphical Application "Sumator" (Calculator)

    - Web Application "Sumator" (Calculator)


    # Lab: Graphical Application "Sumator" (Calculator)


