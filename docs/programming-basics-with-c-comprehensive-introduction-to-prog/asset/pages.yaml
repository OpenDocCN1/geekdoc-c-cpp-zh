  md: '# Programming Basics with C#


    +   - On the first line – workdays per month. An integer within the range of [5
    ... 30].

    - On the second line – daily earnings. A floating-point number within the range
    of [10.00 ... 2000.00].

    - On the third line – exchange rate of USD to EUR: 1 dollar = X euro. A floating-point
    number within the range of [0.05 ... 4.99].


    # Output Data


    Print number on the console – the daily earnings in EUR. The result should be
    rounded up to the second digit after the decimal point.


    # Sample Input and Output


    | Input | Output | Input | Output |

    |---|---|---|--|

    | 21 | | 15 | |

    | 75.00 | 41.30 | 105 | 80.24 |

    | 0.88 | | 22 | 199.99 | 196.63 |

    | | 1.50 |


    Explanation for the first example:


    +   - One monthly salary = 1575 * 12 months + 155 bonus = 22837.5 dollars.

    - Annual income = 25% of 22837.5 = 5709.375 dollars.

    - Net annual income in USD = 22837.5 - 5709.375 = 17128.125 dollars.

    - Net annual income in EUR = 17128.125 dollars * 0.88 = 15072.75 EUR.

    - Average earnings per day = 15072.75 / 365 = 41.30 EUR.


    # Hints and Guidelines


    Firstly, we have analyze the problem and think of a way to solve it. Then, we
    will choose the data type with the higher scope, and we will write the code.


    # Idea for Solution


    Let''s first calculate how the monthly salary of Ivan is. We do by multiplying
    the working days per month by his daily earnings. Firstly, we multiply the number
    by 12, so as to calculate his salary for 12 months, and then, we multiply it by
    2.5 in order to calculate the bonus. After having summed the two values, we calculate
    his annual income. Then, we reduce the annual income by 25% taxes. Depending on
    the exchange rate, we exchange the (USD) to Euro (EUR) and after we divide the
    result by 365 (days per year).


    # Choosing Data Types


    The working days per month are given as an integer, therefore, we can declare
    a variable of int type to store their value. For both the earned money and the
    exchange rate of USD to EUR, we will obtain a floating-point number, therefore,
    we will use double. As double is the data type with the higher scope, and the
    output should also be a floating-point number, we will use double for the other
    variables that we create.


