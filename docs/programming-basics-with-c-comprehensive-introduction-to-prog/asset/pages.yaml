  md: '# Preface


    The book "Programming Basics with C#" introduces the readers with writing programming
    code at a beginners'' level (basic coding skills), working with development environment
    (IDE), using variables and data, operators and expressions, working with the console
    (reading input data and printing output), using conditional statements (if-else,
    switch-case) loops (for, while, do-while, foreach) and methods (declaring and
    calling methods, passing parameters, and returning values).


    # Video: Book + Video Course Overview


    Watch a video lesson about what we learn from this book and video course basics
    of programming: https://youtube.be/H6TWSOhav9.


    # The Book Uses C# and Visual Studio


    This book and video lessons coming with it, teach basic coding skills, using the
    programming language C# and the development environment Visual Studio. All examples
    are given in C#, which is a modern, general purpose programming language, a good
    choice for beginners.


    > This book gives you the first steps to programming. It covers very basic skills
    that you must develop for years, in order to reach a high enough level to start
    working as a programmer.


    # Official Textbook at SoftUni


    This book is the official textbook for the free Programming Basics course for
    absolute beginners at the Software University (SoftUni) - https://softuni.org/.
    The curriculum provides basic training for a deeper study of programming and prepares
    readers for the exam entrance in SoftUni.


    The book is also used as unofficial textbook for school-level programming courses
    in the high schools, studying professions like "Programmer", "Application Programmer"
    and "System Programmer", as well as an additional technical tool in the initial
    programming courses at the secondary schools, mathematical and professional high
    schools.


    # Who Is This Book Intended For?


    That book is suitable for absolute beginners in programming who want to try what
    programming is and learn the main constructions for writing programming code that
    are used in software development, regardless of the programming language and the
    technologies used. The book gives a solid basis of practical skills that you can
    use in any future training in programming and software development.


    For anyone who hasn''t passed the free course on Programming Basics in SoftUni,
    we specifically recommend to sign up for it completely free, because one learns
    by doing, not just reading it! During the course you will get free access to lessons,
    explanations and demonstrations on site or online (like video tutorials), a lot
    of practice and code writing, help with the tasks after each topic, access to
    trainers, assistants and mentors, as well as forums and discussion groups for
    any questions, access to a community of people who are new in programming, and
    any other help that a beginner might need.


    The free course for beginners in SoftUni is suitable for school students (age
    10+), university students and workers having any other professions, who want to
    gain technical knowledge and check if programming is what they like to do and
    understand if they would like to develop in the software development field.'
