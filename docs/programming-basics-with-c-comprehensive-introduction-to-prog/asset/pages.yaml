    # Reading the Input Data


    The input is standard, and we only need to be careful about the sequence in which
    we read the data.


    ```

    int x = int.Parse(Console.ReadLine());

    int w = int.Parse(Console.ReadLine());

    int m = int.Parse(Console.ReadLine());

    ```


    # Calculating bricks Per Course


    We calculate how many bricks the workers transport in a single course:


    ```

    int bricksInCourse = w * m;

    ```


    # Calculating and Printing the Needed Courses


    By dividing the total number of bricks transported for 1 course, we obtain the
    number of courses required to carry them. We have to consider that when dividing
    whole numbers, the remainder is ignored and rounded down. To avoid this, we will
    convert the right side of the equation to double and use the Math.Ceiling(...)
    function to return the result always. When the bricks can be transferred with
    an exact number of courses, the division will return a whole number and no need
    to round. Accordingly, if not, the result of the division will be the number of
    exact courses but a decimal. The decimal part will be rounded up and we will get
    the 1 course for the remaining bricks.'
