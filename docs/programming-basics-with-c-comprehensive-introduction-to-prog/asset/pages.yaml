    book, then you are ready for the exam. Also, pay attention to the chapters on
    preparation for the practical exam in programming. They will give you a good idea
    of the difficulty of the exam and the types of tasks that you need to learn.


    If the tasks from the book and the preparation examples are hard for you, then
    you need more preparation. Enroll for the free course in "Programming Basics"
    or go through the book carefully one more time, without skipping the problems
    in any of the topics! You must learn how to solve them with ease, without helping
    yourself with the guidelines and the sample solutions.


    # The SoftUni Curriculum for Software Engineers


    What follows after the entrance exam is a serious curriculum in the SoftUni program
    for training software engineers. It is formed as a sequence of modules in a number
    of courses in programming and software technologies, fully directed towards gaining
    fundamental knowledge in software development and acquiring practical skills for
    working as programmer with the most contemporary software technologies. Students
    are given a choice between a number of professions and specializations focused
    on C#, Java, JavaScript, Python, PHP and other languages and technologies. Each
    profession is trained in a number of modules with 4 months duration, and each
    module consists of 2 or 3 courses. The classes are divided into theoretical (30%)
    and practical exercises, projects and trainings (70%), and each ends with a practical
    exam or academic project.


    # How Many Hours per Day Does the Training Take?


    The training for software engineers at SoftUni is a very serious occupation and
    you need to spend on it at least 4-5 hours every day, preferably your entire attention
    and time. Combining working and training is not always successful, but if you
    work something and you have a lot of spare time, it is a good option. SoftUni
    is an appropriate option for school students, university students and people who
    work, but it is best if you assign your time to mastering the profession. It will
    not work if you spend 2 or 4 hours a week!


    The forms of training at SoftUni are on-site (the better choice) and online (if
    you don''t have another option). In both forms of training, in order to learn
    the program in the curriculum (that is required by software companies for taking
    a job), you need a lot of learning. You just need to find the time for it! Reason
    #1 for hard time on the road to the profession in SoftUni is not spending enough
    time for the training; as a minimum you need to spend at least 20-30 hours a week.


    # SoftUni for People Who Work and Study


    We recommend to everyone who gets excellent score at the SoftUni entrance exam
    and are really passionate about making programming their profession, to leave
    the rest of their commitments aside and spend their entire time on learning the
    profession of a "software engineer" and start making a living through it.


    +   For people who work this means quitting your job (getting a loan or decreasing
    their expenses, in order to spend with a lower income a period of 1-2 years until
    they start working in the new profession).'
