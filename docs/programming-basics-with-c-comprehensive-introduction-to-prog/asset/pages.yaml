  md: '# Chapter 5.2. Loops – Exam Problems


    In the previous chapter we learned how to run a loop of commands more than once.
    That''s why we introduced a for loop and reviewed its main use cases. The purpose
    of this chapter is to improve our knowledge by solving more complex problems with
    loops, used for exams. For some of them we will show examples of detailed solutions,
    and for others we will leave only guidance.


    # For Loops – Quick Review


    Before we start working, it will be good to review again the for construction:


    | for construction | Start value | End value | Loop body: block of commands |

    | :--- | :--- | :--- | :--- |

    | for (var i = 1; i <= 10; | | | i++) |

    | { | | Console.WriteLine("i " + i); |


    For loops consist of:


    +   - Initialization block in which the variable-counter is declared (var i) and
    its initial value is set.

    - Repeat condition (i <= 10), executing once, before each iteration of the loop.

    - Restarting the counter (i++)) – this code is executed after each iteration.

    - Body of the loop – contains random block of source code.


    Now, after a review, let''s solve a few problems with loops in exams in SoftUni.


    # Problem: Histogram


    We have n integers within the range of {1 ... 1000}. Some of them p1 are under
    200, another percent p2 are from 200 to 399, percent p3 are from 400 to 599, percent
    p4 are from 600 to 799 and the p5 percent are from 800 upwards. Write a program
    that calculates and prints the percentages p1, p2, p3, p4 and p5.


    Example: we have n = 20 numbers: 53, 7, 56, 180, 450, 920, 12, 750, 250, 680,
    2, 600, 200, 800, 799, 199, 46, 128, 65. We get the following distribution and
    visualization:


    | Group | Numbers | Count | Percent |

    | :--- | :--- | :--- | :--- |

    | < 200 | 53, 7, 56, 180, 12, 7, 150, 199, 46, 128, 65 | 12 | p1 = 12 / 20 * 100
    = 60.00% |

    | 200... 399 | 250, 200 | 2 | p2 = 2 / 20 * 100 = 10.00% |

    | 400... 599 | 450 | 1 | p3 = 1 / 20 * 100 = 5.00% |

    | 600... 799 | 680, 600, 799 | 3 | p4 = 3 / 20 * 100 = 15.00% |

    | ≥ 800 | 920, 800 | 2 | p5 = 2 / 20 * 100 = 10.00% |'
