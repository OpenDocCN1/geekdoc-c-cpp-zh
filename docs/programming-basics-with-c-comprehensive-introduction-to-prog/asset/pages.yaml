  md: "```\n{\nConvertCurrency();\n}\n```\n\nprivate void comboBoxCurrency_SelectedIndexChanged(object\
    \ obj, EventArgs e)\n{\n    ConvertCurrency();\n}\n\nOur task is to select the\
    \ currency 'EUR' when we start the program and change the values in the sum or\
    \ currency field then calculating the result by calling the ConvertCurrency()\
    \ method.\n\n# Writing the Program Code\n\nWe have to write the event ConvertCurrency()\
    \ to convert the BGN amount into the selected currency:\n\n```\nprivate void ConvertCurrency()\n\
    {\n    var originalAmount = this.numericUpDownAmount.Value;\n    var convertedAmount\
    \ = originalAmount;\n    if (this.comboBoxCurrency.SelectedItem.ToString() ==\
    \ \"EUR\")\n    {\n        convertedAmount = originalAmount / 1.95583m;\n    }\n\
    \    else if (this.comboBoxCurrency.SelectedItem.ToString() == \"USD\")\n    {\n\
    \        convertedAmount = originalAmount / 1.80810m;\n    }\n    else if (this.comboBoxCurrency.SelectedItem.ToString()\
    \ == \"GBP\")\n    {\n        convertedAmount = originalAmount / 2.54990m;\n \
    \   }\n    this.labelResult.Text = originalAmount + \" BGN = \" +\n    Math.Round(convertedAmount,\
    \ 2) + \" \" + +\n    this.comboBoxCurrency.SelectedItem;\n}\n```\n\nThe above\
    \ code takes the amount for converting the field numericUpDownAmount and the selected\
    \ currency for the result from the field comboBoxCurrency. With a conditional\
    \ statement according to the selected currency, the amount is divided by the exchange\
    \ rate (which is fixed in the source code). Finally, a text message with the result\
    \ (rounded to the second digit after the decimal point) is generated and recorded\
    \ in the green box labelResult. Try it!\n\nIf you have problems with the example,\
