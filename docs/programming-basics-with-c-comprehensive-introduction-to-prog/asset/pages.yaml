  md: "# Declaring a Flag\n\nBefore starting to write the algorithm for solving our\
    \ problem, we must declare a flag that indicates whether a solution is found:\n\
    \n```\nbool solutionFound = false;\n```\n\nIf after finishing our algorithm it\
    \ is still false, then we will print No on the console, as specified in the requirements:\n\
    \n```\nif (!solutionFound)\n{\n    Console.WriteLine(\"No\");\n}\n```\n\n# Generating\
    \ Four-Digit Numbers\n\nLet's start analyzing our problem. What we need to do\
    \ is analyze all numbers from 1111 to 9999, excluding those that contain zeroes\
    \ (for example 9011, 3401, are invalid). What is the easiest to generate all these\
    \ numbers? We will use nested loops. As we have a 4-digit number, we will have\
    \ 4 nested loops, as each of them will generate an individual digit in our number\
    \ for testing:\n\n```\nfor (int digit1 = 1; digit1 <= 9; digit1++)\n    for (int\
    \ digit2 = 1; digit2 <= 9; digit2++)\n        for (int digit3 = 1; digit3 <= 9;\
    \ digit3++)\n            for (int digit4 = 1; digit4 <= 9; digit4++)\n```\n\n\
    Thanks to these loops, we have access to every digit of all numbers that we need\
    \ to check. Our next step is to separate the secret number into digits. This can\
    \ be achieved very easily using a combination of integer division and modular\
    \ division.\n\n```\nint guessDigit1 = (guessNumber / 1000) % 10;\nint guessDigit2\
    \ = (guessNumber / 100) % 10;\nint guessDigit3 = (guessNumber / 10) % 10;\nint\
    \ guessDigit4 = (guessNumber / 1) % 10;\n```\n\n# Creating Additional Variables\n\
    \nOnly two steps remain until we start analyzing how many cows and bulls there\
    \ are in a particular number. Accordingly the first one is the declaration of\
    \ counter variables in the nested loops, in order to count the cows and bulls\
    \ for the current number. The second step is to make copies of the digits of the\
    \ current number that we will analyze, in order to prevent problems working with\
    \ nested loops, in case we make changes to them:\n\n```\nint digitToCheck1 = digit1;\n\
    int digitToCheck2 = digit2;\nint digitToCheck3 = digit3;\nint digitToCheck4 =\
    \ digit4;\n\nint currentBulls = 0;\nint currentCows = 0;\n```"
