  md: "# Programming Basics with C#\n\nIf we want to round up, we need to use the\
    \ method Math.Ceiling(...): int result = (int)Math.Ceiling(3 / 2f); In this example\
    \ the division isn't between integers. \"f\" after a number shows that this number\
    \ is float (a floating-point number). The result of 3 / 2f is 1.5f. Math.Ceiling(...)\
    \ rounds the division up. In this 1.5f will become 2. (int) is used so that we\
    \ can transfer the type back to int.\n\n# Printing the Root\n\nAfter we calculated\
    \ the length of the root, we make a loop from 0 to rootLength. On each iteration\
    \ we will:\n\n+   Calculate the number of dashes to draw. The number will be equal\
    \ to (n - stars) / 2. We store it in a variable padding.\n\n```\nvar padding =\
    \ (n - stars) / 2;\n```\n\n+   We print on the console: \"dashes\" (padding /\
    \ 2 times) + \"stars\" (stars times) + \"dashes\" (padding / 2 times).\n\n```\n\
    var line = new string('-', padding)\n+ new string('*', stars)\n+ new string('-',\
    \ padding);\nConsole.WriteLine(line);\n```\n\n+   Before the iteration, we add\
    \ 2 to stars (the number of stars).\nstars += 2;\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_233_0.png)\n\
    \n> It is not good idea to add character strings as it is shown above, because\
    \ this leads to performance issues. Learn more at: https://en.wikipedia.org/wiki/String_(computer_science)#String_buffers\n\
    \n# Printing the Base\n\nAfter we have finished with the root, it is time for\
    \ the base. It is easier to print:\n\n+   We start with a loop from 0 to n (not\
