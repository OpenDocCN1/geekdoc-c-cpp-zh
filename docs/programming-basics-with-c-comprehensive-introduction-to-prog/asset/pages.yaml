  md: "# Programming Basics with C#\n\nLet's explain in greater detail how to use\
    \ simple for loops to repeat blocks of code multiple times.\n\n# For Loops (Repeating\
    \ Code Blocks)\n\nIn programming it is often required to perform a block of commands\
    \ multiple times. In order to do that, the so-called loops are used. Let's examine\
    \ an example of a for loop that passes sequentially through the numbers 1 to 10\
    \ and prints them:\n\n```\nfor (int i = 1; i <= 10; i++) {\n    Console.WriteLine(\"\
    \" + i);\\n}\n```\n\nThe loop starts with the for operator and passes through\
    \ all values for a particular variable in a given range, for the numbers from\
    \ 1 to 10 (included), and for each value it performs a series of commands.\n\n\
    # Video: Simple For-Loops\n\nWatch the video about the for-loop statement: https://youtube.be/yzEamf5L1ZY.\n\
    \n# Syntax: For-Loop\n\nUpon declaring the loop, you can specify a start value\
    \ and an end value. The body of the loop is usually enclosed in curly brackets\
    \ { } and represents a block of one or multiple commands. The figure shows the\
    \ structure of a for loop:\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_189_0.png)\n\
    \nIn most cases a for loop is run between 1 and n times (from the numbers 1, 2,\
    \ 3, ... n and for each of them to perform a particular action. In the example\
    \ above, the i variable accepts values from 1 to 10 and the current value is printed\
    \ in the body of the loop. The loop repeats 10 times and each of these repetitions\
    \ is called an \"iteration\".\n\nNow, let's demonstrate how to use the loop in\
    \ practice by a few simple examples.\n\n# Example: Numbers from 1 to 100\n\nWrite\
    \ a program that prints the numbers from 1 to 100. The program does not accept\
    \ input and prints the numbers from 1 to 100 sequentially, each on a separate\
    \ line.\n\n# Video: Numbers 1...100\n\nWatch the video lesson to learn how to\
    \ print the numbers from 1 to 100 using a for-loop: https://youtube.be/pui8KXt\
    \ uPLI."
