  md: "# Programming Basics with C#\n\nPrint a vertical arrow on the console, in which\
    \ “#” (number sign) marks the outline of the arrow, and\n\"\" - the rest.\n\n\
    # Hints and Guidelines\n\nFrom the explanation we see that the input data will\
