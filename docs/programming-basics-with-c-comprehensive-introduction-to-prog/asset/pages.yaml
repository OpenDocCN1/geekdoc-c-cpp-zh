    # Shortcuts in Visual Studio


    In the previous section we mentioned two of the combinations that are used for
    formatting code. One of them [CTRL + K + D] is used for formatting the whole code
    in a file, and the second one [CTRL + K + F] serves if we want to format just
    a piece of the code. These combinations are called shortcuts and now we will give
    more thorough information about them.


    Shortcuts are combinations that give us the possibility to do things in an easier
    and faster way, and each IDE has its shortcuts, even though most of them are recurring.
    We will look at some of the shortcuts in Visual Studio:


    | Combination | Action |

    | [CTRL + F] | Opens the search window, by which we can search in the code. |

    | [CTRL + K + C] | Comments part of the code. |

    | [CTRL + K + U] | Uncomments a code, which is already commented. |

    | [CTRL + Z] | Brings back one change (so-called Undo). |

