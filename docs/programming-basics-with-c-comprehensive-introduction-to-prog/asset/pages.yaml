    \ and print the text message Hello C#, which we should surround by quotation marks,\
    \ in order to clarify that this is a text. In the end of each command in the C#\
    \ language the symbol ; is put out and says that the command ends in place (it\
    \ doesn't continue to the next line).\n\nThis command is very typical in programming:\
    \ we say a given object should be found (in this case the console) and some action\
    \ should be executed upon it (in this case it is something that is inside the\
    \ brackets). More technically explained, we call the method WriteLine(...) from\
    \ the class Console and give as a literal \"Hello C#\".\n\n# Starting the Program\n\
    \nTo start the program, press [Ctrl + F5]. If there aren't any errors, the program\
    \ will be executed. The result will be on the console (in the black window):\n\
    \n![](img/246636b3c9d6ecf641f97ed3560e57a9_41_0.png)\n\nNotice that we start it\
    \ with [Ctrl+F5], and not only [F5] or with the start button in Visual Studio.\
    \ If we use [F5], the program will run shortly and right afterwards the black\
    \ window will disappear, and we are not going to see the result.\n\nActually,\
    \ the output from the program is the following text message:\n\nHello C#\n\nThe\
    \ message \"Press any key to continue . . . is displayed additionally on the last\
    \ line of the console after the program ends, in order to push us to see the result\
