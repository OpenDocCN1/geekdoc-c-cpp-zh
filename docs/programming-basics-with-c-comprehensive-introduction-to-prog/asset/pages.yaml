    the screenshot).

    By entering numbers in the first two fields and pressing the button [Calculate]
    their sum is being calculated and the result is shown in the third field. For
    our application we will use the Windows Forms technology, which allows the creation
    of graphical applications for Windows, in the development environment Visual Studio
    and with programming language C#.


