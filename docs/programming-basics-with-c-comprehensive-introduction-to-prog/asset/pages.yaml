  md: "# 276 Programming Basics with C#\n\n+   - We create a num variable to which\
    \ we assign the result of the current row + the current column (+1 as we start\
    \ from 0).\n- We check for num > n. If num is greater than n, we assign a new\
    \ value to num which is equal to two times n - the current value for num. We do\
    \ this in order not to exceed n in any of the cells in the table.\n- We print\
    \ the number from the current table cell.\n\n+   - We print a blank line in the\
    \ outer loop to move to the next row.\n\n# Implementation of the Idea\n\nHere\
    \ is a sample implementation of the described idea:\n\n```\nvar n = int.Parse(Console.ReadLine());\n\
    for (int row = 0; row < n; row++)\n{\n    for (int col = 0; col < n; col++)\n\
    \    {\n        var num = row + col + 1;\n        if (num > n)\n        {\n  \
    \          num = 2 * n - num;\n        }\n        Console.Write(num + \" \");\n\
    \    }\n    Console.WriteLine();\n}\n```\n\n# Testing in the Judge System\n\n\
