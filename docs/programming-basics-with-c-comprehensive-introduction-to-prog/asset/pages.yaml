    \ of the loop will not be completed, accordingly, the rest of the code in the\
    \ body of the loop will not be executed.\n\n# Example: Prime Number Checking\n\
    \nThe next problem we are going to solve is to check whether number is prime.\
    \ An integer is prime if it cannot be decomposed to a product of other numbers.\
    \ For example: 2, 5 and 19 are primes, while 9, 12 and 35 are composite.\n\n#\
