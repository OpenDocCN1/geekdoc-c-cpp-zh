    \n# Good Practices When Working with Methods\n\nLet's remind you that a method\
    \ should do only one defined task. If this cannot be, you must know how to split\
    \ the method into a few smaller methods. As we already said the name of the method\
    \ should be clear and should describe its purpose. Another good practice in programming\
    \ is to avoid methods, which are longer than a typical screen size (approximately).\
    \ If the code becomes large it is recommended to split it into several, shorter\
    \ methods, as in the example below.\n\n```\nstatic void PrintReceipt()\n{\n  \
    \  PrintHeader();\n    PrintBody();\n    PrintFooter();\n}\n```\n\n# Code Structure\
    \ and Formatting\n\nWhen writing methods, we should be careful to use correct\
    \ indentation (moving blocks of the code to the right).\n\nExample for correctly\
    \ formatted C# code:\n\nExample for incorrectly formatted C# code:\n\n```\nstatic\
    \ void Main()\n{\n    // some code here...\n    // some more code...\n}\nstatic\
    \ void Main()\n{\n// some code...\n}\n```\n\nWhen the declaration of the method\
    \ is too long, it is recommended to split it into several lines, as each line\
    \ after the first one is two tabs to the right of the first one (for better readability):\n\
    \n```\nstatic double GetTriangleArea(double length,\n    double height)\n{\n \
    \   return (length * height) / 2;\n}\n```\n\nAnother good practice when writing\
    \ code is to leave an empty line between the methods, after loops and conditional\
    \ statements. Also try to abstain from writing long lines and complicated expressions.\
    \ With time you will see that this makes the readability better and saves time.\n\
    \nIt is also recommended to always use curly brackets for the bodies of conditional\
    \ statements and loops. The brackets not only improve readability, but also reduce\
    \ the possibility to make a mistake and the program to run incorrectly."
