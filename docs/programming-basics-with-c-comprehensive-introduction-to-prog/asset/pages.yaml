- img_proc: true
  md: '# Programming Basics with C#


    A new group starts each month. The "Programming Basics" course at SoftUni is organized
    regularly using a few different programming languages as basis. So, just check
    it out! The course is free and you can quit any time you like. Signing up for
    free on-site or online training is available via the SoftUni application: https://softuni.org.


    # Why Did We Choose C#?


    For this book, we choose C# language because it is a modern programming language
    for high-level programming, open source, easy to learn and suitable for beginners.
    Using C# is widespread, with a well-developed ecosystem, numerous libraries and
    technology frameworks, and accordingly, it gives many perspectives for development.
    C# combines paradigms of procedural, object-oriented and functional programming
    in a modern way with easy syntax. In this book we will use C# and Visual Studio
    development, which are also free from Microsoft.


    As we will explain, the programming language that we start with does not make
    a significant difference, but we still need to use some programming language,
    and in this book we choose C#. The book can also be found in other programming
    languages such as Java and JavaScript (https://csharp-book.softuni.org).


    # Learning Resources: Code + Videos + Exercises + Judge


    This free coding combines video lessons, text and code with explanations, practical
    coding exercises with hints and guidelines, presentation slides and an automated
    judge system for checking your solutions.


    It is more than a book or tutorial. It is a carefully designed tool for learning
    programming by a lot of practical coding, suitable for beginners with no experience.


    # Programming Is Learned by Writing, Not Reading!


    If someone thinks they will read a book and learn to program without writing code
    and solving problems, this is a plenty of delusion. Programming needs a lot of
    practice, with code writing every day and hundreds, thousands of problems, for
    years.


    You need to solve a lot of problems, to make mistakes, to try, to experiment,
    to search for solutions and information from the Internet, to get used to the
    code, syntax, the programming language, the development environment, search for
    errors and debugging the broken code, the algorithmic thinking, breaking the problems
    into smaller parts, gaining experience and raising your skills every day, because
    when you learn to write code, this is only the first step to the profession of
    the "software engineer", You have all to learn, really!


    We advise the reader, as a minimum, to try all the examples from the book, to
    play with them, to change and test them. More important than the are the exercises
    because they develop the programmer''s practical skills. This book provides nearly
    150 coding exercises, so it is a good foundation for developing coding and algorithmic
    thinking.


    You need to solve all the problems in the book because programming is learned
    with practice! The exercises after each topic are carefully selected to cover
    in depth the learning material. The purpose of solving all the problems is to
    provide complete set of skills for writing programming code at a beginner''s level
    (which is the purpose of this book). During the courses in SoftUni we purposefully
    focus on practice and problem solving, and in most courses code writing covers
    70% of the entire course.


    > Solve all the exercises in the book. Otherwise you won''t learn anything! Programming
    is learned by writing a lot of code and solving thousands of problems!'
