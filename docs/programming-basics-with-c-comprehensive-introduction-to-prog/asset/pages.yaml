  md: "# Output Data\n\nPrint on the console all \"dump\" passwords in alphabetical\
    \ order, separated by space.\n\n# Hints and Guidelines\n\nWe can split the solution\
    \ of the problem into 3 parts:\n\n+   - Reading the input - di in the current\
    \ problem includes reading two numbers n and 1, each on a single line.\n\n+  \
    \ - Processing the input data - using of nested loops to iterate through every\
    \ possible symbol each of the five password symbols.\n\n+   - Printing the output\
    \ - printing every \"dump\" password that meets the requirements.\n\n# Reading\
    \ the Input Data\n\nFor reading input data we will declare two integer variables\
    \ int: n and l.\n\n```\nvar n = int.Parse(Console.ReadLine());\nvar l = int.Parse(Console.ReadLine());\n\
    ```\n\nLet's declare and initialize the variables that will store the characters\
    \ of the password: for the characters of digit type - int - d1, d2, and d3, for\
