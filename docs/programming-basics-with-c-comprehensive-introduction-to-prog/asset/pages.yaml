    This combination in Visual Studio can help us if we work with a badly formatted\
    \ code.\n\n# # Naming Elements\n\nIn this section we will focus on the accepted\
    \ conventions for naming projects, files and variables, defined by Microsoft.\n\
    \n# # Naming Projects and Files\n\nIt is recommended to use a descriptive name\
    \ for naming projects and files, which suggests the role of the respective file\
    \ / project and at the same time the PascalCase convention is also recommended.\
    \ This is a convention for naming elements, in each word, including the first\
    \ one, starts with an uppercase character, for example ExpressionCalculator.\n\
    \nExample: this starts with a First steps in coding lecture, therefore an exemplary\
    \ name for the code to be more understandable, the solution for this lecture can\
    \ be FirstStepsInCoding. The same convention applies for the files in a project.\
    \ If we take for the first problem in the First steps in coding lecture, it is\
    \ called Hello World, our file in the project will be called HelloWorld.\n\n#\
    \ # Naming Variables\n\nIn programming variables keep data, and for the code to\
    \ be more understandable, the name of a variable should suggest its purpose. Here\
    \ are some recommendations for naming variables:\n\n+   * The name should be short\
    \ and descriptive and to explain what the variable serves for.\n* The name should\
    \ only contain the letters a-z A-Z, the numbers 0-9, and the symbol '_'.\n* It\
    \ is accepted in C# for the variables to always begin with a lowercase letter\
    \ and to contain lowercase letters, and each next word in them should start with\
    \ an uppercase letter (this naming is also known as camelCase convention).\n*\
    \ You should be careful about uppercase and lowercase letters, C# distinguishes\
    \ them. For example, age and Age are different variables.\n* The names of the\
    \ variables do not coincide with keywords in the C# language, for int is an invalid\
    \ name for a variable.\n\n> Although using the symbol _ in the names of variables\
    \ is allowed, in C# it is not recommended and is considered a bad style of naming.\n\
    \n# # Naming – Examples\n\nHere are some examples for well named variables:\n\n\
    +   * firstName\n* age\n* startIndex\n* lastNegativeNumberIndex"
