  md: "# Chapter 4.1. More Complex Conditions\n\nIn the current chapter, we are going\
    \ to examine the nested conditional statements in the C# language, by which our\
    \ program can contain conditions that contain other nested conditions. We call\
    \ them \"nested\", because we put an if condition into another if condition. We\
    \ are going to examine the more logical conditions through proper examples.\n\n\
    # Video: Chapter Overview\n\nWatch this video to see what you will learn in this\
    \ chapter: https://youtube.com/qbVrKKxxu0.\n\n# Introduction to Complex Conditions\
    \ by Examples\n\nConditional statements can be nested, i.e. we can put if-else\
    \ inside another if-else statement. Conditions in the constructions can be complex,\
