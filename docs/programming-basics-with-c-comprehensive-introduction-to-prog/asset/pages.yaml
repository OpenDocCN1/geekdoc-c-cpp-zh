  md: '# The Software University (SoftUni)


    The Software University (SoftUni) is the largest training center for software
    engineers in the South-Eastern Europe. Tens of thousands of students pass through
    the university every year. SoftUni was founded in 2014, as a continuation of the
    hard work of Dr. Svetlin Nakov in training software engineering professionals
    by modern high-quality practice, that combines fundamental knowledge with modern
    software technologies and a lot of practice.


    # Video: SoftUni and SoftUni Judge


    Watch a video lesson about SoftUni and SoftUni Judge: https://youtube.be/TDIDxnFCzoo.


    # SoftUni: High-Quality Practical Education


    The Software University (SoftUni) provides quality education, profession, job
    and diploma for programmers, software engineers and IT professionals. SoftUni
    builds extremely successful and strong connection between education and industry
    by collaboration with hundreds of software companies, provides job and internship
    of its students, quality professionals for the software industry and directly
    responds to the needs of employers via the training process.


    ![](img/246636b3c9d6ecf641f97ed3560e57a9_14_0.png)


    # Free Programming Courses at SoftUni


    SoftUni organizes free programming lessons for beginners: online and physically
    in few locations. The purpose is to give everyone who is interested in programming
    and technologies to try programming and check if they are interested and if they
    would get involved in software development. You can sign up for the free course
    in programming basics using the SoftUni application page: https://softuni.org.


    The free courses at SoftUni have the purpose to introduce you to basic programming
    constructions in the software development world, that you can use at any programming
    language. These include working with data, variables and expressions, using conditional
