  md: '# 32 Programming Basics with C#


    # Runtime environments


    Runtime environments are needed by some languages to execute the compiled programs.
    For example, the compiled C programs are executed by the .NET runtime environment
    and the Java programs are executed by Java JRE runtime environment. Other languages
    do not need compilation, but still require a runtime environment. For example,
    the Python programs are executed by the Python interpreter and runtime environment
    and the JavaScript programs are executed by Node.js runtime environment or by
    a Web browser (which provides another JS environment).


    # Programming Languages: Low-Level and High-Level


    There are different kinds of programming languages. Via languages of the instructions
    that manage the program, for example, using the "assembler" language. With a higher
    level language, like C and C++, you can create an operating system, drivers for
    hardware management (for example a video card), web browsers, compilers, engines
    for graphics and games (game engine) and other system components and programs.
    With languages of even higher level, C#, Python and JavaScript you can create
    applications programs, a example for reading emails or a chat program.


    Low level languages manage the hardware directly and require a lot of effort and
    a large count of commands to do a single task. Languages of higher level require
    less code for a single task, but not have a direct access to hardware. Application
    software is developed using such languages, for example web applications and mobile
    applications.


    Most of the software that we use daily, like music programs, video players, GPS
    trackers, etc., are written with languages for application programming that are
    high-level, C#, Java, Python, C++, JavaScript, PHP and others.


    C# is a compiled language, which means we write commands that are compiled before
    they''re executed. Exactly these commands, through a help program (a compiler),
    are being transformed into a file, which can be executed (executable). To write
    a language C# we need a text editor or a development environment and .NET Runtime
    (.NET Core).


    # .NET Runtime Environment


    .NET Runtime Environment represents a virtual machine, something like a computer
    in the computer, with the risk of going too deep into details, we have to explain
    the language C# is compiled into an intermediary .NET code and is executed by
    the .NET environment, which compiles this intermediate code into machine instructions
    (machine code) to be executed by the microprocessor. .NET environment contains
    libraries with classes, CSC compiler, CLR (Common Language Runtime – CLR) and
    others, which are required for working with the C# language and run C# programs.


    The .NET environment is available as a free source code for every modern operating
    system (like Windows, Linux and Mac OS). It has two variations, .NET Framework
    (the older one) and .NET Core (the newer), but none of that is essential when
    it comes to getting into programming. We focus on writing programs with the C#
    language.


    # Compilation and Execution of C# Programs


    As we have already mentioned, a program is a sequence of commands, otherwise said,
    it describes a sequence of calculations, evaluations, iterations and all kinds
    of similar operations, which aim to obtain result.


    A C# program is written in a text format, and the text of the program is called
    a source code. It gets compiled into an executable file (for example Program.cs
    gets compiled to Program.exe) or it is executed directly from the .NET environment.'
