    numbers and, the variables will be double.


    We can also declare variables to store the income from the fruits and vegetables
    separately. We are multiplying a variable of int type (total kilograms) with one
    double type (price), the result should also be of double type. Let''s clarify
    that generally, operators work with arguments of the same type. Therefore, in
    order to multiply various different types we have to convert them into the same
    type. When there are types of different scopes in one expression, the one with
    the highest scope is the other types converted to, in this case, double. As there
    isn''t data loss, the conversion is implicit and is automatically done by the
    compiler.


    The output should be a floating-point number and therefore, the result will be
    stored in a variable double type.


