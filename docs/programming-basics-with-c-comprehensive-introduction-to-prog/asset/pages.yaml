  md: "# 224 Programming Basics with C#\n\nThe above code will print on the console\
    \ the following output:\n\n![](img/246636b3c9d6ecf641f97ed3560e57a9_223_0.png)\n\
    \nLet's explain in greater detail how to use nested loops to implement more complex\
    \ logic in our C# programs.\n\n# Nested Loops – Concepts\n\nA nested loop is a\
    \ construction where the body of one loop (outer one) stays another loop (inner).\
    \ In each iteration of the outer loop, the whole inner loop is executed. This\
    \ happens in the following way:\n\n+   * When nested loops start executing, the\
    \ outer loop starts first: the controlling variable is initialized and after a\
    \ check for ending the loop in its body is executed.\n* After, the inner loop\
    \ is executed. The controlling variables start position is initialized, a check\
    \ for ending the loop is made and the code in its body is executed.\n* When reaching\
    \ the specified value for ending the loop, the program goes back one step and\
    \ continues the previous (outer) loop. The controlling variable of the outer loop\
    \ changes with one step, a check is made to see if the condition for ending the\
    \ loop is met and a new execution of the nested (inner) loop is started.\n* This\
    \ is repeated until the outer loop meets the condition to end the loop.\n\n# Video:\
    \ Nested Loops\n\nWatch this video to learn the concepts of nested loops: https://youtube.be/Sj49u6XlzXU.\n\
    \n# Nested Loops – Examples\n\nHere is an example that illustrates nested loops.\
