    will need some specific programming language, knowledge about specific programming
    libraries (APIs), frameworks and software technologies (front-end UI, back-end
    technologies, ORM technologies, etc.). Keep calm, you will learn them, all programmers
    are learning them, but first you need to learn the foundation: program and do
    it well.


