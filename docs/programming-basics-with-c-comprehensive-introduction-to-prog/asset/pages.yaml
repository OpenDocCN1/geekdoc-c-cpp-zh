  md: '# Chapter 2.1. Simple Calculations 69


    Dividing numbers is done using the / operator. It works differently with integers
    and floating-point numbers.


    +   - When we divide two integers, an integer division is applied, and the obtained
    is without its fractional part. Example: 11 / 3 = 3.

    - When we divide two numbers and at least one of them is a float number, a floating
    division is applied, and the obtained result is a float number, just like math.
    Example 11 / 4.0 = 2.75. When it cannot be done with exact precision, the result
    is rounded, for example 11.0 / 3.666666666666667.

    - The division by O causes an exception during runtime (runtime exception).

    - Float numbers divided by 0 do not cause an exception and the result is +/- infinity
    or a special value NaN. Example 5 / 0.0 = ∞.


    Here are few examples with the division operator:


    ```

    var a = 25;

    var i = a / 4; // we are applying an integer division:

    // the result of this operation will be 6

    // the fractional part will be cut,

    // because we are dividing integers

    var f = a / 4.0; // 6.25 - floating division. We have set the

    // number 4 to be interpreted

    // as a float by adding a decimal separator

    // followed by zero

    var error = a / 0; // Error: Integer divided by zero

    ```


