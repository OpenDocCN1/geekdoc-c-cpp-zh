  md: "# 4.1.4 Measuring bond sensitivity to interest rate changes\n\nNow, the reason\
    \ for why we say that we can measure the sensitivity of a bond price using duration.\
    \ To a first approximation, \\(\\Delta B_0\\), the change in the bond price for\
    \ a small change in the interest rate \\(\\Delta r\\), can be calculated\n\n\\\
    (\\frac{\\Delta B_0}{B_0} \\approx -\\frac{D}{1+r} \\Delta r\\)\n\nwhere \\(D\\\
    ) is the bond's duration. For simplicity one often calculates the term in front\
    \ of the \\(\\Delta y\\) in the above, \\(\\frac{D}{1+y}\\) directly and terms\
    \ it the bond's *modified duration*.\n\n\\(\\text{Modified Duration} = D^* = \\\
    frac{D}{1+r}\\)\n\nThe sensitivity calculation is then\n\n\\(\\frac{\\Delta B_0}{B_0}\
    \ \\approx -D^* \\Delta r\\)\n\nThe modified duration is also written in term's\
    \ of the bond's yield to maturity \\(y\\), and is then\n\n\\(D^* = \\frac{D}{1+y}\\\
    )\n\nC++ Code 4.5 shows this calculation.\n\n```\n#include <vector>\nusing namespace\
    \ std;\n#include \"fin_recipes.h\"\n\ndouble bonds_duration_modified_discrete\
    \ (const vector<double>& times,\n                                         const\
    \ vector<double>& cashflows,\n                                         const double&\
    \ bond_price){\n    double y = bonds_yield_to_maturity_discrete(times, cashflows,\
    \ bond_price);\n    double D = bonds_duration_discrete(times, cashflows, y);\n\
    \    return D/(1+y);\n};\n```\n\n# C++ Code 4.5: Modified duration\n\nApproximating\
    \ bond price changes using duration is illustrated in the following figure.\n\n\
    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_43_0.png)"
