  md: "# A.2 The cumulative normal distribution\n\nThe solution of a large number\
    \ of option pricing formulas are written in terms of the cumulative normal distribution.\
    \ For a random variable x the cumulative probability is the probability that the\
    \ outcome is lower than a given value x. To calculate the probability that a normally\
    \ distubted random variable with mean 0 and unit variance is less than z, N(z),\
    \ one have to evaluate the integral\n\nProb(x \\le z) = N(z) = \\int_{-\\infty}^{z}\
    \ n(x) dx = \\int_{-\\infty}^{z} \\frac{e^{-\\frac{x^2}{2}}}{\\sqrt{2\\pi}} dx\n\
    \nThere is no explicit closed form solution for calculation of this integral,\
    \ but a large number of well known approximations exist. Abramowiz and Stegun\
    \ (1964) is a good source for these approximations. The following is probably\
    \ the most used such approximation, it being pretty accurate and relatively fast.\
    \ The arguments to the function are assumed normalized to a (0,1) distribution.\n\
    \n```\n#include <cmath> // /math functions.\nusing namespace std;\n\ndouble N(const\
    \ double& x) {\n  if (x > 6.0) { return 1.0; }; // this guards against overflow\n\
    \  if (x < -6.0 ) { return 0.0; };\n\n  double b1 = 0.31938153;\n  double b2 =\
    \ -0.356563782;\n  double b3 = 1.781477937;\n  double b4 = -1.821255978;\n  double\
    \ b5 = 1.330274429;\n  double p = 0.2316419;\n  double c2 = 0.3989423;\n\n  double\
    \ a=fabs(x);\n  double t = 1.0/(1.0+a*p);\n  double b = c2*exp((-x)*(x/2.0));\n\
    \  double n = (((((b5*t+b4)*t+b3)*t+b2)*t+b1)*t);\n  n = 1.0-b*n;\n  if ( x <\
    \ 0.0 ) n = 1.0 - n;\n\n  return n;\n};\n```\n\nC++ Code A.2: The cumulative normal\n\
    \n# A.3 Multivariate normal\n\nThe normal distribution is also defined for several\
    \ random variables. We then characterise the _vector_ of random variables\n\n\\\
    (\\mathbf{X} = \\begin{bmatrix} x_1 \\\\ x_2 \\\\ \\vdots \\\\ x_n \\end{bmatrix}\\\
    )\n\nA probability statement about this vector is a joint statement about all\
    \ elements of the vector."
