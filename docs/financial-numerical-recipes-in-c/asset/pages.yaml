- pgno: 235
  md: "# # A.5 Simulating random normal numbers\n\nGeneration of random numbers is\
    \ a large topic and is treated at length in such sources as Knuth (1997). The\
    \ generated numbers can never be truly random, only \"pseudo\"-random, they will\
    \ be generated according to some reproducible algorithm and after a (large) number\
    \ of random number generations the sequence will start repeating itself. The number\
    \ of iterations before replication starts is a measure of the quality of a random\
    \ number generator. For anybody requiring high-quality random number generators\
    \ the rand() function provided by the standard C++ library should be avoided,\
    \ but for not getting into involved discussion of random number generations we\
    \ use this function as a basis for the generation of uniformly distributed numbers\
    \ in the interval [0,1), as shown in C++ Code A.4.\n\n```\n```cpp\n#include <cstdlib>\n\
    using namespace std;\ndouble random_uniform_0_1(void){\n return double(rand())/double(RAND_MAX);\
    \ // this uses the C library random number generator.\n};\n```\n```\n\nC++ Code\
    \ A.4: Pseudorandom numbers from an uniform [0,1) distribution\n\n# ## Exercise\
    \ A.1.\n\nReplace the random_uniform function here by an alternative of higher\
    \ quality, by looking into what numerical libraries is available on your computing\
    \ platform, or by downloading a high quality random number generator from such\
    \ places as mathlib or statlib.\n\nThese uniformly distributed distributed random\
    \ variates are used as a basis for the polar method for normal densities discussed\
    \ in Knuth (1997) and implemented as shown in C++ Code A.5.\n\n```\n```cpp\n#include\
    \ <cmath>\n#include <cstdlib>\nusing namespace std;\ndouble random_uniform_0_1(void);\n\
    double random_normal(void){\n double U1, U2, V1, V2;\n double S=2;\n while (S>=1)\
    \ {\n  U1 = random_uniform_0_1();\n  U2 = random_uniform_0_1();\n  V1 = 2.0*U1-1.0;\n\
    \  V2 = 2.0*U2-1.0;\n  S = pow(V1,2)+pow(V2,2);\n };\n double X1=V1*sqrt((-2.0*log(S))/S);\n\
    \ return X1;\n};\n```\n```\n\nC++ Code A.5: Pseudorandom numbers from a normal\
    \ (0,1) distribution\n\n# ## Example\n\n+   1. Generate 5 random uniform numbers\
    \ (0,1)\n+   2. Generate 5 random N(0,1) numbers."
