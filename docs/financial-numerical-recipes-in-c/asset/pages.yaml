    \    return 0.0;\n  };\n\n  const int MAX_ITERATIONS = 100;\n  const double ACCURACY\
    \ = 1.0e-5;\n  double t_sqrt = sqrt(time);\n\n  double sigma = (option_price/S)/(0.398*t_sqrt);\
    \ // find initial value\n  for (int i=0;i<MAX_ITERATIONS;++i){\n    double price\
    \ = option_price_call_black_scholes(S,K,r,sigma,time);\n    double diff = option_price-price;\n\
    \    if (fabs(diff)<ACCURACY) return sigma;\n    double d1 = (log(S/K)+(r*time))/(sigma*t_sqrt)\
    \ + 0.5*sigma*t_sqrt;\n    double vega = S * t_sqrt * n(d1);\n    sigma = sigma\
