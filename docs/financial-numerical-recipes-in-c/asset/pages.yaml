  md: "```\n#include <vector>\nusing namespace std;\n#include \"fin_recipes.h\"\n\n\
    double term_structure_yield_linearly_interpolated(const double& time,\n      \
    \                                           const vector<double>& obs_times,\n\
    \                                                 const vector<double>& obs_yields)\
    \ {\n    // assume the yields are in increasing time to maturity order.\n    int\
    \ no_obs = int(obs_times.size());\n    if (no_obs == 1) return 0;\n    double\
    \ t_min = obs_times[0];\n    if (time <= t_min) return obs_yields[0]; // earlier\
    \ than lowest obs.\n    double t_max = obs_times[no_obs-1];\n    if (time >= t_max)\
    \ return obs_yields[no_obs-1]; // later than latest obs\n    int t=1; // find\
    \ which two observations we are between.\n    while ( (t<no_obs) && (time>obs_times[t])\
    \ ) { ++t; };\n    double lambda = (obs_times[t]-time)/(obs_times[t]-obs_times[t-1]);\n\
    \    // by ordering assumption, time is between t-1,t\n    double r = obs_yields[t-1]\
    \ * lambda + obs_yields[t] * (1.0-lambda);\n    return r;\n};\n```\n\n# C++ Code\
    \ 5.4: Interpolated term structure from spot rates\n\n```\nC++ program:\n\nvector<double>\
    \ times;\nvector<double> yields;\ntimes.push_back(0.1); times.push_back(0.5);\
