  md: 'The rank of a matrix is the number of independent rows or columns in the matrix,
    and calculated as


    ```

    >> Ahi

    A =

    1 2 3

    4 5 6

    >> rank(A)

    ans =

    2

    ```


    The inverse of a square matrix A is the matrix inv(A) such that A*inv(A) equals
    the identity matrix, or in mathematical notation AA^-1 = I.


    ```

    >> D=[1 2;1 4]

    D =

    1 2

    1 4

    >> inv(D)

    ans =

    2.00000 -1.00000

    -0.50000 0.50000

    >> D^-1

    ans =

    2.00000 -1.00000

    -0.50000 0.50000

    ```


    To make sure that this is the inverse, multiply D and inv(D):


    ```

    >> D * inv(D)

    ans =

    1 0

    0 1

    ```


    # Determinant


    ```

    >> B

    B =

    1 2

    3 4

    >> det(B)

    ans = -2

    ```


    # 2.3 Solving linear equations


    Consider the basic linear equation


    ```

    Ax = b

    ```


    This equation has a defined solution if the rank of A equals the rank of [A|b].
    If A is nonsingular, we solve the linear equation by finding the unique solution


    ```

    x = A^-1b

    ```'
