  md: '# Chapter 10


    # Warrants


    # Contents


    | Item | Page |

    |---|---|

    | 10.1 Warrant value in terms of assets | 99 |

    | 10.2 Valuing warrants when observing the stock value | 100 |

    | 10.3 Readings | 101 |


    A warrant is an option-like security on equity, but it is issued by the same company
    which has issued the equity, and when a warrant is exercised, a new stock is issued.
    This new stock is issued at a the warrant strike price, which is lower than the
    current stock price (If it wasn''t the warrant would not be exercised). Since
    the new stock is a fractional right to all cashflows, this stock issue waters
    out, or dilutes, the equity in a company. The degree of dilution is a function
    of how many warrants are issued.


    # 10.1 Warrant value in terms of assets


    Let \( K \) be the strike price, \( n \) the number of shares outstanding and
    \( m \) the number of warrants issued. Assume each warrant is for 1 new share,
    and let \( A_t \) be the current asset value of firm. Suppose all warrants are
    exercised simultaneously. Then the assets of the firm increase by the number of
    warrants times the strike price of the warrant.


    ```

    \( A_t + mK \),

    ```


    but this new asset value is spread over more shares, since each exercised warrant
    is now an equity. The assets of the firm is spread over all shares, hence each
    new share is worth:


    ```

    \(\frac{A_t + mK}{m + n}\)

    ```


    making each exercised warrant worth:


    ```

    \(\frac{A_t + mK}{m + n} - K = \frac{n}{m + n} \left( \frac{A_t}{n} - K \right)\)

    ```


    If we knew the current value of assets in the company, we could value the warrant
    in two steps:


    +   1. Value the option using the Black Scholes formula and \(\frac{A_t}{n}\)
    as the current stock price.

    +   2. Multiply the resulting call price with \(\frac{n}{m+n}\).


    If we let \( W_t \) be the warrant value, the above arguments are summarized as:


    ```

    \( W_t = \frac{n}{n+m} C_{BS} \left( \frac{A}{n}, K, \sigma, r, (T-t) \right)
    ,\)

    ```'
