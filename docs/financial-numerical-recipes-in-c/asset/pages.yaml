  md: '# Chapter 3


    # The value of time


    | Section | Title | Page |

    |---|---|---|

    | 3.1 | Present value | 26 |

    | 3.2 | One interest rate with annual compounding | 27 |

    | 3.2.1 | Internal rate of return | 30 |

    | 3.3 | Continuously compounded interest | 34 |

    | 3.3.1 | Present value | 35 |

    | 3.4 | Further readings | 35 |


    Finance as a field of study is sometimes somewhat flippantly said to deal with
    the value of two things: *time* and *risk*. While this is not the whole story,
    there is a deal of truth in it. These are the two issues which is always present.
    We start our discussion by ignoring risk and only considering the implications
    of the fact that anybody prefers to get something earlier rather than later, or
    the value of time.


    # 3.1 Present value


    The present value is the current value of a stream of future payments. Let $C_t$
    be the cash flow at time $t$. Suppose we have $N$ future cash flows that occur
    at times $t_1, t_2, \cdots, t_N$.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_26_0.png)


    To find the *present value* of these future cash flows one needs a set of prices
    of future cash flows. Suppose $d_t$ is the price one would pay today for the right
    to receive one dollar at a future date $t$. Such a price is also called a *discount
    factor*. To complicate matters further such prices will differ depending on the
    riskiness of the future cash flows. For now we concentrate on one particular set
    of prices, the prices of *riskless* future cash flows. We will return to how one
    would adjust the prices for risky cash flows.


    If one knows the set of prices for future claims of one dollar, $d_1, d_2, \dots$,
    one would calculate the present value as the sum of the present values of the
    different elements.


    ```

    PV = \sum_{i=1}^N d_i C_{t_i}

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: "![](img/f93b3f3a5d69957a07ff6e28c47bacdd_27_0.png)\n\nHowever, knowing this\
    \ set of current prices for cash flows at all future dates is not always feasible,\
    \ and some way has to be found to simplify the data need inherent in such general\
    \ present value calculations.\n\n# 3.2 One interest rate with annual compounding\n\
    \nThe best known way to simplify the present value calculation is to rewrite the\
    \ discount factors in terms of interest rates, or yields, through the relationship:\n\
    \n\\( d_t = \\frac{1}{(1+r_t)^t} \\)\n\nwhere \\( r_t \\) is the interest rate\
    \ (usually termed the spot rate) relevant for a t-period investment. To further\
    \ simplify this calculation one can impose that this interest rate \\( r \\) is\
    \ constant for all periods. This is termed a *flat* term structure. We will in\
    \ the next chapter relax this simplifying assumption. The prices for valuing the\
    \ future payments \\( d_t \\) is calculated from this interest rate:\n\n\\( d_t\
    \ = \\frac{1}{(1+r)^t} \\)\n\nIn this case one would calculate the present value\
    \ of a stream of cash flows paid at discrete dates \\( t = 1, 2, \\dots N \\)\
    \ as\n\n\\( PV = \\sum_{t=1}^N \\frac{C_t}{(1+r)^t} \\)\n\nThe implementation\
    \ of this calculation is shown in C++ Code 3.1.\n\n```\n#include <cmath>\n#include\
    \ <vector>\nusing namespace std;\n#include <cmath>\ndouble cash_flow::pr_discrete(const\
    \ vector<double>& cflow_times,\n                              const vector<double>&\
    \ cflow_amounts,\n                              const double& r){\n    double\
    \ PV=0.0;\n    for (int t=0; t<cflow_times.size();t++) {\n        PV += cflow_amounts[t]/pow(1.0+r,cflow_times[t]);\n\
    \    }\n    return PV;\n};\n```\n\nC++ Code 3.1: Present value with discrete compounding\n\
    \nExample"
