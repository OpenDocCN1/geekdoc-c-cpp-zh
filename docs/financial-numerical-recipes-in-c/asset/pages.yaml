    # 18.1 Intro


    A trinomial tree is similar to a binomial tree, just with one more branch. At
    each point of time there are three possible future values of the underlying S.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_183_0.png)


    # 18.2 Implementation


    A trinomial tree can be implemented with various parameterizations. We will show
    the calulation using the following parameterization:


    ```

    u = e^{\sigma \sqrt{\Delta t}}


    e = \frac{1}{u}


    p_u = -\sqrt{\frac{\Delta t}{12\sigma^2}} \left( r - q - \frac{\sigma^2}{2} \right)
    + \frac{1}{6}


    p_m = \frac{2}{3}


    p_u = \sqrt{\frac{\Delta t}{12\sigma^2}} \left( r - q - \frac{\sigma^2}{2} \right)
    + \frac{1}{6}

    ```'
