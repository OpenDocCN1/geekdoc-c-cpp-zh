    In this chapter we expand on the analysis of the previous chapter by relaxing
    the “one interest rate” assumption used there and allow the spot rates to change
    as you change the time you are discounting over.


    Recall that we said that the present value of a set of cash flows is calculated
    as


    ```

    PV = \sum_{t=1}^N d_t C_{t_i}

    ```


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_51_0.png)


    To make this applicable to cash flows received at any future date t we potentially
    need an infinite number of discount factors d_t. This is not feasible, so some
    lower dimensional way needs to be found to approximate d_t, but with more flexibility
    than the extremely strong assumption that there is one fixed interest rate r,
    and that the discount factor for any time t is calculated as either d_t = 1/(1+r)^t
    (discrete compounding), or d_t = e^{-rt} (continuous compounding), which we used
    in the previous chapter.'
