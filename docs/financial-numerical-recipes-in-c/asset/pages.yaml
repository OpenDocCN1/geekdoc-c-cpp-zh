    # 14.3 Hedge parameters


    It is of course, just as in the standard case, desirable to estimate hedge parameters
    as well as option prices. We will show how one can find an estimate of the option
    delta, the first derivative of the call price with respect to the underlying security:
    \(\Delta = \frac{\partial c}{\partial S}\). To understand how one goes about estimating
    this, let us recall that the first derivative of a function \(f\) is defined as
    the limit


    ```

    \(f''(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}\)

    ```


    Thinking of \(f(S)\) as the option price formula \(c_t = f(S, X, r, \sigma, (T-t))\),
    we see that we can evaluate the option price at two different values of the underlying,
    \(S\) and \(S+q\), where \(q\) is a small quantity, and estimate the option delta
    as


    ```

    \(\widehat{\Delta} = \frac{f(S+q) - f(S)}{q}\)

    ```'
