    # 12.2.2 American Options


    An American option differs from an European option by the exercise possibility.
    An American option can be exercised at any time up to the maturity date, unlike
    the European option, which can only be exercised at maturity. In general, there
    is unfortunately no analytical solution to the American option problem, but in
    some cases it can be found. For example, for an American call option on non-dividend
    paying stock, the American price is the same as the European call.


    It is in the case of American options, allowing for the possibility of early exercise,
    that binomial approximations are useful. At each node we calculate the value of
    the option as a function of the next periods prices, and then check for the value
    exercising of exercising the option now


    C++ Code 12.2 illustrates the calculation of the price of an American call.'
