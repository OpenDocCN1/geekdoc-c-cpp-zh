  md: '# 19.2 Hestons pricing formula for a stochastic volatility model


    Heston (1993) relaxes the Black-Scholes assumption of a constant volatility by
    introducing a stochastic volatility. He finds exact solutions for European options.


    Let S be the stock price and v the volatility. These two variables are assumed
    to follow joint stochastic processes.


    ```

    [ dS(t) = \mu S dt + \sqrt{v(t)} S dz_1(t) ]

    [ d\sqrt{v(t)} = -\beta \sqrt{v(t)} dt + \delta v(t) S dz_2(t) ]

    ```


    The two processes z1 and z2 have correlation \rho. Rewrite the process for the
    volatility as


    ```

    dv(t) = \kappa (\phi - v(t)) dt + \sigma \sqrt{v(t)} dz_2

    ```


    Let \Lambda(S, v, t) be the price of volatility risk. Under a constant interest
    rate r


    ```

    P(T, T) = e^{-r(T-t)}

    ```


    Consider a call option with strike price K. Its price is given by Formula 19.2.


    Price of Call option using Hestons formula The option price is


    ```

    C(s, v, t) = S P_1 - K P(T, T) P_2

    ```


    where


    ```

    P_j(x, v, T, ln(K)) = \frac{1}{2} + \frac{1}{\pi} \int_0^\infty Re \left[ \frac{e^{-i\phi
    ln(K)} f_j(x, v, T, \phi)}{i\phi} \right] d\phi

    ```


    ```

    f_j(x, v, T, \phi) = e^{C(\tau, \phi) + D(\tau, \phi) v + i\phi z}

    ```


    ```

    C(\tau, \phi) = r\phi i\tau + \frac{a}{\sigma^2} \left\{ (b_j - \rho \sigma \phi
    i + d) \tau - 2 \ln \left[ \frac{1 - g e^{d\tau}}{1 - g} \right] \right\}

    ```


    ```

    D(\tau, \phi) = \frac{b_j - \rho \sigma \phi i + d}{\sigma^2} \left[ \frac{1 -
    e^{d\tau}}{1 - g e^{d\tau}} \right]

    ```


    ```

    u_1 = \frac{1}{2}, \quad u_2 = -\frac{1}{2}

    ```


    ```

    a = \kappa \theta

    ```


    ```

    b_1 = \kappa + \lambda - \rho \sigma \quad b_2 = \kappa + \lambda

    ```


    ```

    x = ln(S)

    ```


    ```

    g = \frac{b_j - \rho \sigma \phi i + d}{b_j - \rho \sigma \phi i - d}

    ```


    ```

    d = \sqrt{(\rho \phi i - b_j)^2 - \sigma^2 (2 u_j \phi i - \phi^2)}

    ```


    Note: S: price of underlying security. K: exercise price.


    The implementation of this pricing formula has some instructive C++ features.
    First, it illustrates calculations of complex variables. Complex numbers is part
    of the C++ standard, and are accessed by including the


    ```

    #include <complex>

    ```'
