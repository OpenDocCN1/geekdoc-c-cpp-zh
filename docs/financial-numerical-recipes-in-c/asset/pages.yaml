  md: "```\nM.push_back(3);\n```\n\nshows the ability of the programmer of changing\
    \ the size of the array after it has been defined. push_back is a standard operation\
    \ on arrays which \"pushes\" the element onto the back of the array, extending\
    \ the size of the array by one element. Most programming languages do not allow\
    \ the programmer to specify variable-sized arrays \"on the fly\". In FORTRAN or\
    \ Pascal we would usually have to set a maximum length for each array, and hope\
    \ that we would not need to exceed that length. The vector<> template of C++ gets\
    \ rid of the programmers need for \"bookkeeping\" in such array manipulations.\n\
    \n# 1.2.5 Flow control\n\nTo repeat statements several times one will use on of\
    \ the possibilities for flow control, such as the for or while constructs. For\
    \ example, to repeat an operation n times one can use the following for loop:\n\
    \n```\nfor (int i=0; i<n; i++) {\n    some_operation(i);\n};\n```\n\nThe for statement\
    \ has tree parts. The first part gives the initial condition (i=0). The next part\
    \ the terminal condition (i<n), which says to stop when i<n is not fulfilled,\
    \ which is at the n'th iteration. The last part is the increment statement (i++),\
    \ saying what to do in each iteration. In this case the value of i is increased\
    \ by one in each iteration. This is the typical for statement. One of the causes\
    \ of C's reputation for terseness is the possibility of elaborate for constructs,\
    \ which end up being almost impossible to read. In the algorithms presented in\
    \ this book we will try to avoid any obfuscated for statements, and stick to the\
    \ basic cases.\n\n# 1.2.6 Input Output\n\nFor any program to do anything useful\
    \ it needs to be able to output its results. Input and output operations is defined\
    \ in a couple of libraries, iostream and fstream. The first covers in/output to\
    \ standard terminals and the second in/output to files.\n\nTo write to standard\
    \ output cout (the terminal), one will do as follows:\n\n```\n#include <iostream>\n\
    cout << \"This is a test\" << endl;\n```\n\nTo write to a file \"test.out\", one\
    \ will do as follows:\n\n```\n#include <fstream>\nofstream outf;\noutf.open(\"\
    test.out\");\noutf << \"This is a test\" << endl;\noutf.clear();\noutf.close();\n\
    ```\n\n# 1.2.7 Splitting up a program\n\nAny nontrivial program in C++ is split\
    \ into several pieces. Usually each piece is written as a function which returns\
    \ a value of a given type. To illustrate we provide a complete example program,\
    \ shown in C++ Code 1.1."
