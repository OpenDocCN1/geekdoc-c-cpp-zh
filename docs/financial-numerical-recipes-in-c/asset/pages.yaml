  md: "# 5.2 The term structure as an object\n\nFrom the previous we see that the\
    \ term structure can be described in terms of discount factors, spot rates or\
    \ forward rates, but that does not help us in getting round the dimensionality\
    \ problem. If we think in terms of discount factors, for a complete specification\
    \ of the current term structure one needs an infinite number of discount factors\
    \ \\(\\{d_t\\}_{t \\in R+}\\). It is perhaps easier to think about this set of\
    \ discount factors as a function d(t), that, given a nonnegative time t, returns\
    \ the discount factor. Since we have established that there are three equivalent\
    \ ways of defining a term structure, discount factors, spot rates and forward\
    \ rates, we can therefore describe a term structure as a collection of three different\
    \ functions that offer different views of the same underlying object.\n\nA term\
    \ structure is an abstract object that to the user should provide\n\n+   * discount\
    \ factors d (prices of zero coupon bonds).\n+   * spot rates r (yields of zero\
    \ coupon bonds).\n+   * forward rates f\n\nfor any future maturity t. The user\
    \ of a term structure will not need to know how the term structure is implemented,\
    \ all that is needed is an interface that specifies the above three functions.\n\
    \nThis is tailor made for needing be implemented as a C++. class. A class in C++\
    \ terms is a collection of data structures and functions that operate on these\
    \ data structures. In the present context it is a way of specifying the three\
    \ functions.\n\n```\nr(t)\nd(t)\nf(t)\n```\n\n# 5.2.1 Base class\n\nHeader File\
    \ 5.1 shows how we describe the generic term structure as a C++. class.\n\n```\n\
    #ifndef _TERM_STRUCTURE_CLASS.H_\n#define _TERM_STRUCTURE_CLASS.H_\nclass term_structure\
    \ {\npublic:\n    virtual double r(const double& t) const; // yield on zero coupon\
    \ bond\n    virtual double d(const double& t) const; // discount factor/price\
    \ of zero coupon bond\n    virtual double f(const double& t1, const double& t2)\
    \ const; // forward rate\n};\n// term_structure.class();\n#endif\n```\n\nHeader\
    \ file 5.1: Header file describing the term_structure base class\n\nThe code for\
    \ these functions uses algorithms that are described earlier in this chapter for\
    \ transforming between various views of the term structure. The term structure\
    \ class merely provide a convenient interface to these algorithms. The code is\
    \ shown in C++. Code 5.2\n\nNote that the definitions of calculations are circular.\
    \ Any given specific type of term structure has to over-ride at least one of the\
    \ functions r (yield), d (discount factor) or f (forward rate).\n\nWe next consider\
    \ two examples of specific term structures."
