    # 19.1 Merton''s Jump diffusion model.


    Merton (1976) has proposed a model where in addition to a Brownian Motion term,
    the price process of the underlying is allowed to have jumps. The risk of these
    jumps is assumed to not be priced.


    In the following we look at an implementation of a special case of Merton''s model,
    described in (Hull, 1993, pg 454), where the size of the jump has a normal distribution.
    \(\lambda\) and \(\kappa\) are parameters of the jump distribution. The price
    of an European call option is given in Formula 19.1 and implemented in C++ Code
    19.1


    ```

    c = \sum_{n=0}^{\infty} \frac{e^{\lambda \tau} (\lambda \tau)^n}{n!} C_{BS}(S,
    X, r_n, \sigma_n^2, T - t)


    where


    \tau = T - t


    \lambda'' = \lambda(1 + \kappa)


    C_{BS}(\cdot) is the Black Scholes formula, and


    \sigma_n^2 = \sigma^2 + \frac{n \delta^2}{\tau}


    r_n = r - \lambda \kappa + \frac{n \ln(1 + \kappa)}{\tau}

    ```


