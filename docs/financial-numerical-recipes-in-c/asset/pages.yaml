    # Term Structure Derivatives


    # Contents


    +   26.1 Vasicek bond option pricing . . . . . . . . . . . . . . . . . . . . .
    . . . . . 227


    # 26.1 Vasicek bond option pricing


    If the term structure model is Vasicek''s model there is a solution for the price
    of an option on a zero coupon bond, due to Jamshidan (1989).


    Under Vasicek''s model the process for the short rate is assumed to follow.


    ```

    dr = a(b - r)dt + \sigma dZ

    ```


    where a, b and \sigma are constants. We have seen earlier how to calculate the
    discount factor in this case. We now want to consider a European Call option in
    this setting.


    Let P(t, s) be the time t price of a zero coupon bond with a payment of $1 at
    time s (the discount factor). The price at time t of a European call option maturing
    at time T on on a discount bond maturing at time s is [See Jamshidan (1989) and
    Hull (1993])


    ```

    P(t, s)N(h) - XP(t, T)N(h - \sigma_P)

    ```


    where


    ```

    h = \frac{1}{\sigma_P} ln \frac{P(t, s)}{P(t, T)X} + \frac{1}{2} \sigma_P


    \sigma_P = v(t, T)B(T, s)


    B(T, T) = \frac{1 - e^{-a(T-t)}}{a}


    v(t, T)^2 = \frac{\sigma^2(1 - e^{-a(T-t)})}{2a}

    ```


    In the case of a = 0,


    ```

    v(t, T) = \sigma\sqrt{T-t}


    \sigma_P = \sigma(s - T)\sqrt{T - t}

    ```


    # Example


    Parameters: a = 0.1, b = 0.1, \sigma = 0.02, r = 0.05, X = 0.9. Price a Vasicek
    call on a zero.'
