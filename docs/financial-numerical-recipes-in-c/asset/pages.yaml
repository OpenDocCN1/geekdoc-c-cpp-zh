  md: '# Appendix B


    # C++ concepts


    This chapter contains a listing of various C/C++ concepts and some notes on each
    of them.


    +   - accumulate() Function accumulating the elements of a sequence.

    +   - bool Boolean variable, taking on the two values true and false. For historical
    reasons one can also use the values zero and one for false and true.

    +   - class (C++ keyword).

    +   - const (qualifier to variable in C++ function call).

    +   - double (basic type). A floating point number with high accuracy.

    +   - exp(x) (C function). Defined in <cmath>. Returns the natural exponent e
    to the given power x, e^x.

    +   - fabs

    +   - float (basic type). A floating point number with limited accuracy.

    +   - for Loop

    +   - header file

    +   - if

    +   - Indexation (in vectors and matrices). To access element number i in an array
    A, use A[i-1]. Well known trap for people coming to C from other languages. Present
    in C for historical efficiency reasons. Arrays in C were implemented using pointers.
    Indexing was done by finding the first element of the array, and then adding pointers
    to find the indexed element. The first element is of course found by adding nothing
    to the first element, hence the first element was indexed by zero.

    +   - include

    +   - inline (qualifier to C++ function name). Hint to the optimizer that this
    function is most efficiently implemented by inlining it, or putting the full code
    of the function into each instance of its calling. Has the side effect of making
    the function local to the file in which it is defined.

    +   - int (basic type). An integer with a limited number of significant digits.

    +   - log(x) (C function). Defined in <cmath>. Calculates the natural logarithm
    ln(x) of its argument.

    +   - long (basic type). An integer that can contain a large number.

    +   - min_element() (C++ function)'
