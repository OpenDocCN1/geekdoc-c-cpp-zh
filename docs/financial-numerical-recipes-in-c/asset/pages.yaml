    # 24.2 Discount factors


    We want to price bonds and other fixed income securities, which contains sets
    of future cash flows. Instead of interest rates we generate prices, not interest
    rates, i.e. discount factors. The interest rate tree therefore needs to be used
    to generate discount factors, which needs to be specified at every point of the
    tree, and for all relevant maturities. Let $d(t,T)$ be the discount factor at
    time $t$ for a time $T$ payment. If we at time 0 want to price cash flows at time
    2, we need the following set of discount factors


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_216_0.png)


    In constructing trees of discount we need one additional piece of information,
    $q$, which are used as follows:


    $d(0,2) = e^{-r_0} (q d_u(1,2) + (1+q) d_d(1,2))$


    The parameter $q$ serves the same purpose as the state price probability, but
    it is found differently.


    # Exercise 24.1.


    Given the prices of two discount bonds, with maturities 1 and 2, how would you
    back out $q$?


    # Exercise 24.2.


    Suppose you have $q$ and the tree of short interest rates. How would you calculate
    the $t$-period spot rate?


