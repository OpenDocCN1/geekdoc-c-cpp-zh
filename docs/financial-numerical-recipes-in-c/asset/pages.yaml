    we will work with a specially simple specification of the term structure, namely
    that it is flat, and specified by the interest rate \(r\).


    # 4.1 Flat term structure with discrete, annual compounding


    This is the simplest possible specification of a term structure,


    \(d_t = \left( \frac{1}{1+r} \right)^t = \frac{1}{(1+r)^t}\)


    # 4.1.1 Bond Price


    The current bond price (\(B_0\)) is the present value of the cash flows from the
    bond


    \(B_0 = \sum_{t=1}^T \left( \frac{1}{(1+r)^t} \right) C_t = \sum_{t=1}^T \frac{C_t}{(1+r)^t}\)
    (4.1)


    If we continue with the example of a standard fixed interest bond, where \(C_t
    = C\) when \(t < T\) and \(C_T = C + F\), and show how the bond price will be
    calculated using Matlab.


    # Example


    A 3 year bond with a face value of $100 makes annual coupon payments of 10%. The
    current interest rate (with annual compounding) is 9%.


    +   1. Determine the current bond price.


    The current bond price: \(B_0 = \frac{10}{(1+0.09)^1} + \frac{10}{(1+0.09)^2}
    + \frac{110}{(1+0.09)^3} = 102.531\).


