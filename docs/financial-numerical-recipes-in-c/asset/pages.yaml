  md: '![](img/f93b3f3a5d69957a07ff6e28c47bacdd_113_0.png)


    which has the same time series properties as a (continuous time) process with
    the same mean and volatility? There is actually any number of ways of constructing
    this, hence one uses one degree of freedom on imposing that the nodes *reconnect*,
    by imposing \(u = \frac{1}{d}\).


    (To value an option using this approach, we specify the number \(n\) of periods
    to split the time to maturity \((T - t)\) into, and then calculate the option
    using a binomial tree with that number of steps.


    Given \(S, X, r, \sigma, T\) and the number of periods \(n\), calculate


    ```

    \(\Delta t = \frac{T - t}{n}\)

    \(u = e^{\sigma \sqrt{\Delta t}}\)

    \(d = e^{-\sigma \sqrt{\Delta t}}\)

    ```


    We also redefine the “risk neutral probabilities”


    ```

    \(R = e^{r \Delta t}\)

    \(q = \frac{R - d}{u - d}\)

    ```


    To find the option price, will “roll backwards.” At node \(t\), calculate the
    call price as a function of the two possible outcomes at time \(t + 1\). For example,
    if there is one step,


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_113_1.png)


    find the call price at time 0 as


    ```

    \(C_0 = e^{-r\tau}(qC_u + (1 - q)C_d)\)

    ```


    With more periods one will “roll backwards” as discussed in chapter 8


