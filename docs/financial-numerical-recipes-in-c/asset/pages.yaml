- pgno: 124
  md: '# 12.5 Pricing options on stocks paying dividends using a binomial approximation


    # 12.5.1 Checking for early exercise in the binomial model.


    If the underlying asset is a stock paying dividends during the maturity of the
    option, the terms of the option is not adjusted to reflect this cash payment,
    which means that the option value will reflect the dividend payments.


    In the binomial model, the adjustment for dividends depend on whether the dividends
    are discrete or proportional.


    # 12.5.2 Proportional dividends.


    For proportional dividends, we simply multiply with an adjustment factor the stock
    prices at the ex-dividend date, the nodes in the binomial tree will "link up"
    again, and we can use the same "rolling back" procedure.'
