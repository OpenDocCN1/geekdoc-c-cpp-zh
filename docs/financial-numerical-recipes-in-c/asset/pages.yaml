    # 12.1 Introduction


    We have shown binomial calculations given an up and down movement in chapter 8.
    However, binomial option pricing can also be viewed as an *approximation* to a
    continuous time distribution by judicious choice of the constants u and d. To
    do so one has to ask: Is it possible to find a parametrization (choice of u and
    d) of a binomial process'
