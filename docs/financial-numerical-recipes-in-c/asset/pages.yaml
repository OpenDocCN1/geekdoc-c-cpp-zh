  md: "# 22.4 Cox Ingersoll Ross.\n\nThe Cox et al. (1985) model is the best known\
    \ example of a continuous time, general equilibrium model of the term structure.\
    \ It is commonly used in academic work because it is a general equilibrium model\
    \ that still is “simple enough” to let us find closed form expressions for derivative\
    \ securities.\n\nThe short interest rate.\n\n$dr(t) = \\kappa(\\theta - r(t))dt\
    \ + \\sigma\\sqrt{r(t)}dW$\n\nThe discount factor for a payment at time T.\n\n\
    $d(t, T) = A(t, T)e^{-B(t, T)r(t)}$\n\nwhere\n\n$\\gamma = \\sqrt{(\\kappa + \\\
    lambda)^2 + 2\\sigma^2}$\n\n$A(t, T) = \\left[ \\frac{2\\gamma e^{\\frac{1}{2}(\\\
    kappa + \\lambda + \\gamma)(T-t)}}{(\\gamma + \\kappa + \\lambda)(e^{\\gamma(T-t)}\
    \ - 1) + 2\\gamma} \\right]^{\\frac{2\\kappa\\theta}{\\sigma^2}}$\n\nand\n\n$B(t,\
    \ T) = \\frac{2\\gamma e^{\\gamma(T-t)} - 1}{(\\gamma + \\kappa + \\lambda)(e^{\\\
    gamma(T-t)} - 1) + 2\\gamma}$\n\nFive parameters: $r$, the short term interest\
    \ rate, $\\kappa$, the mean reversion parameter, $\\lambda$, the “market” risk\
    \ parameter, $\\theta$ the long-run mean of the process and $\\sigma$, the variance\
    \ rate of the process.\n\n```\n#include <cmath>\nusing namespace std;\ndouble\
    \ term_structure::discount_factor.cir(const double& t,\n                     \
    \                      const double& r,\n                                    \
    \       const double& kappa,\n                                           const\
    \ double& lambda,\n                                           const double& theta,\n\
    \                                           const double& sigma){\n    double\
    \ sigma_sqr=pow(sigma,2);\n    double gamma = sqrt(pow((kappa+lambda),2)+2.0*sigma.sqr);\n\
    \    double denum = (gamma+kappa+lambda)*(exp(gamma*T-t))-1)+2*gamma;\n    double\
    \ p=2*kappa*theta/sigma.sqr;\n    double enum1 = 2*gamma*exp(0.5*(kappa+lambda+gamma)*t);\n\
    \    double A = pow((enum1/denum),p);\n    double B = (2*(exp(gamma*T-t)-1))/denum;\n\
    \    double disc.factor=A*exp(-B*r);\n    return disc.factor;\n};\n```\n\nC--\
    \ Code 22.7: Calculation of the discount factor using the Cox et al. (1985) model"
