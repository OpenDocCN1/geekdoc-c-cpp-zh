    In this section we use the present value framework of the previous chapter to
    price bonds and other fixed income securities. What distinguishes bonds is that
    the future payments are set when the security is issued. The simplest, and most
    typical bond, is a fixed interest, constant maturity bond with no default risk.
    There is however a large number of alternative contractual features of bonds.
    The bond could for example ba an annuity bond, paying a fixed amount each period.
    For such a bond the principal amount outstanding is paid gradually during the
    life of the bond. The interest rate the bond pays need not be fixed, it could
    be a floating rate, the interest rate paid could be a function of some market
    rate. Many bonds are issued by corporations, and in such cases there is a risk
    that the company issued the bond defaults, and the bond does not pay the complete
    promised amount. Another thing that makes bond pricing difficult in practice,
    is that interest rates tend to change over time.


    We start by assuming that all the promised payments are certain.


    Then the bond current price \( B_0 \) is found as the present value of these payments.
    The first step of pricing is to use the terms of the bond to find the promised
    payments. We start by considering a fixed interest bond with no default risk.
    Such bonds are typically bonds issued by governments. The bond is a promise to
    pay a face value \( F \) at the maturity date \( T \) periods from now. Each period
    the bond pays a fixed percentage amount of the face value as coupon \( C \). The
    cash flows from the bond thus look as follows.


    | t = | 0 | 1 | 2 | 3 | ... | T |

    |---|---|---|---|---|---|---|

    | Coupon | C | C | C | ... | C |

    | Face value | | | | | F |

    | Total cash flows | \( C_1 = C \) | \( C_2 = C \) | ... | \( C_T = C + F \) |


    In general a bond price is found as the present value


    ```

    \( B_0 = d_1 C_1 + d_2 C_2 + \cdots + d_T C_T = \sum_{t=1}^T d_t C_t \)

    ```


    where \( d_t \) is the discount factor, or the time 0 price of a payment of 1
    at time \( t \). To fully specify the'
