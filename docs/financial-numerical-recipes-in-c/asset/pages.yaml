  md: '# 1.4 Const references


    Let us now discuss a concept of more technical nature. Consider two alternative
    calls to a function, defined by function calls:


    ```

    some_function(double r);

    some_function(const double& r);

    ```


    They both are called by an argument which is a double, and that argument is guaranteed
    not to be changed in the calling function, but they work differently. In the first
    case a copy of the variable referenced to in the argument is created for use in
    the function, but in the second case one uses the same variable, the argument
    is a reference to the location of the variable. The latter is more efficient,
    in particular when the argument is a large class. However, one worries that the
    variable referred to is changed in the function, which in most cases one do not
    want. Therefore the const qualifier, it says that the function can not modify
    its argument. The compiler will warn the programmer if an attempt is made to modify
    such a variable.


    For efficiency, in most of the following routines arguments are therefore given
    as as constant references.


