    # 3.3 Continuously compounded interest


    Such discrete compounding as we have just discussed is not the only alternative
    way to approximate the discount factor. The discretely compounded case assumes
    that interest is added at discrete points in time (hence the name). However, an
    alternative assumption is to assume that interest is added continuously. If compounding
    is continuous, and r is the interest rate, one would calculate the current price
    d<sub>t</sub> of receiving one dollar at a future date t as


    d<sub>t</sub> = e<sup>-rt</sup>,


    Formula 3.1 summarizes some rules for translating between continuously compounded
    and discretely compounded interest rates.


    | Formula |

    |---|

    | r = n ln(1 + r<sub>n</sub>/n) |

    | r<sub>n</sub> = n(e<sup>r/n</sup> - 1) |

    | Future value = e<sup>rt</sup> |

    | Present value = e<sup>-rt</sup> |

    | Notation: r<sub>n</sub>: interest rate with discrete compounding, n: compounding
    periods per year. r: interest rate with continuous compounding, t: time to maturity.
    |


    Formula 3.1: Translating between discrete and continuous compounding


    # Example


    +   1. Given a 15% interest rate with monthly compounding, calculate the equivalent
    interest rate with continuous compounding.


    +   2. Given a 12% interest rate with continuous compounding, find the equivalent
    interest rate with quarterly compounding.


    Carrying out the calculations:


    +   1. r<sub>12</sub> = 15%, r = 12 ln(1 + 0.15/12) = 14.91%


    +   2. r = 12%, r<sub>a</sub> = n(e<sup>r/n</sup> - 1) = 4(e<sup>0.12/4</sup>
    - 1) = 12.18%


    Using Matlab to do the calculations:


    ```

    Matlab program:

    r = 12 * log(1+0.15/12)

    r4 = 4 * (exp(0.12/4)-1)

    ```


    Output from Matlab program:


    ```

    r = 0.14907

    r4 = 0.12182

    ```'
