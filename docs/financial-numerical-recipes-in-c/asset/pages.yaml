- pgno: 90
  md: 'information needed to price the option is the (continuously compounded) risk
    free interest rate r, the variability of the underlying asset, measured by the
    standard deviation σ of (log) price changes, and the time to maturity (T − t)
    of the option, measured in years. The original formula was derived under the assumption
    that there are no payouts, such as stock dividends, coming from the underlying
    security during the life of the option. Such payouts will affection option values,
    as will become apparent later.


    # 9.1 The formula


    Formula 9.1 gives the exact formula for a call option, and the calculation of
    the same call option is shown in C++ Code 9.1 and Matlab Code 9.1.


    c = SN(d_1) - Ke^{-r(T-t)}N(d_2)


    where


    d_1 = \frac{\ln(\frac{S}{K}) + (r + \frac{1}{2}\sigma^2)(T - t)}{\sigma\sqrt{T
    - t}}


    and


    d_2 = d_1 - \sigma\sqrt{T - t}


    Alternatively one can calculate d_1 and d_2 as


    d_1 = \frac{\ln(\frac{S}{K}) + r(T - t)}{\sigma\sqrt{T - t}} + \frac{1}{2}\sigma\sqrt{T
    - t}


    d_2 = \frac{\ln(\frac{S}{K}) + r(T - t)}{\sigma\sqrt{T - t}} - \frac{1}{2}\sigma\sqrt{T
    - t}


    S is the price of the underlying security, K the exercise price, r the (continuously
    compounded) risk free interest rate, σ the standard deviation of the underlying
    asset, t the current date, T the maturity date, T − t the time to maturity for
    the option and N(·) the cumulative normal distribution.


    Formula 9.1: The Black Scholes formula


    ```

    #include <cmath> // mathematical C library

    #include "normdist.h" // the calculation of the cumulative normal distribution

    double option_price_call_black_scholes(const double& S, // spot (underlying) price

    const double& K, // strike (exercise) price,

    const double& r, // interest rate

    const double& sigma, // volatility

    const double& time) // { time to maturity

    {

    double time_sqrt = sqrt(time);

    double d1 = (log(S/K)+r*time)/(sigma*time_sqrt)+0.5*sigma*time_sqrt;

    double d2 = d1-(sigma*time_sqrt);

    return S*N(d1) - K*exp(-r*time)*N(d2);

    };

    ```


    C++ Code 9.1: Price of European call option using the Black Scholes formula'
