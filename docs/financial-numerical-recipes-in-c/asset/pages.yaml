    # Basic Option Pricing, the Black Scholes formula


    # Contents


    | 9.1 | The formula | 90 |

    | --- | --- | --- |

    | 9.2 | Understanding the why''s of the formula | 92 |

    | 9.2.1 | The original Black Scholes analysis | 93 |

