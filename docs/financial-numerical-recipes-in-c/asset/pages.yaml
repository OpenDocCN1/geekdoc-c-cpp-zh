- pgno: 251
  md: '# # Appendix E


    # # Installation


    The routines discussed in the book are available for download.


    # ## E.1 Source availability


    The algorithms are available from my home page as a ZIP file containing the source
    code. These have been tested with the latest version of the GNU C++ compiler.
    As the algorithms in places uses code from the Standard Template Library, other
    compilers may not be able to compile all the files directly. If your compiler
    complains about missing header files you may want to check if the STL header files
    have different names on your system. The algorithm files comply with the current
    ANSI standard for C++ libraries. If the compiler is more than a couple of years
    old, it will not have STL. Alternatively, the GNU compiler gcc is available for
    free on the internet, for most current operating systems.'
