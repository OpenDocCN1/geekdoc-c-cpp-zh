    # Exercise 9.1.


    The Black Scholes price for a put option is:


    \(p = Ke^{-r(T-t)} N(-d_2) - SN(-d_1)\)


    where \(d_1\) and \(d_2\) are as for the call option:


    \(\displaystyle d_1 = \frac{\ln \left(\frac{S}{K}\right) + (r + \frac{1}{2}\sigma^2)(T
    - t)}{\sigma \sqrt{T - t}}\)


    \(d_2 = d_1 - \sigma \sqrt{T - t},\)


    \(S\) is the price of the underlying security, \(K\) the exercise price, \(r\)
    the (continuously compounded) risk free interest rate, \(\sigma\) the standard
    deviation of the underlying asset, \(T - t\) the time to maturity for the option
    and \(N(\cdot)\) the cumulative normal distribution.


    +   1. Implemet this formula.


    # 9.2 Understanding the why''s of the formula


    To get some understanding of the Black Scholes formula and why it works will need
    to delve in some detail into the mathematics underlying its derivation. It does
    not help that there are a number of ways to prove the Black Scholes formula, depending
    on the setup. As it turns out, two of these ways are important to understand for
    computational purposes, the original Black Scholes continuous time way, and the
    "limit of a binomial process" way of Cox, Ross, and Rubinstein (1979).'
