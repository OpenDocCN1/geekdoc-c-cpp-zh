- pgno: 233
  md: '# A.4 Calculating cumulative bivariate normal probabilities


    The most used multivariate normal calculation is the bivariate case, where we
    let x and y be bivariate normally distributed, each with mean 0 and variance 1,
    and assume the two variables have correlation of ρ. By the definition of correlation
    ρ ∈ [-1, 1]. The cumulative probability distribution


    P(x < a, y < b) = N(a, b, ρ) = ∫_{-∞}^{a} ∫_{-∞}^{b} (1 / 2π√(1-ρ²)) exp(-1/2
    * (x² - 2ρxy + y²) / (1-ρ²)) dxdy


    There are several approximations to this integral. We pick one such, discussed
    in (Hull, 1993, Ch 10), shown in C++. Code A.3.


    If one has more than two correlated variables, the calculation of cumulative probabilities
    is a nontrivial problem. One common method involves Monte Carlo estimation of
    the definite integral. We will consider this, but then it is necessary to first
    consider simulation of random normal variables.


    # Example


    Calculate N(0) and N(0,0,0)


    ```

    C++ program:

    cout << " N(0) = " << N(0) << endl;

    cout << " N(0,0,0) = " << N(0,0,0) << endl;

    Output from C++ program:

    N(0) = 0.5

    N(0,0,0) = 0.25

    ```'
