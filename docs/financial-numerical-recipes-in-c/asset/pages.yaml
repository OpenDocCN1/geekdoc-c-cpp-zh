  md: "# 12.3.1 Estimating partials.\n\nIt is always necessary to calculate the partial\
    \ derivatives as well as the option price. Let us start with Delta, the derivative\
    \ of the option price with respect to the underlying. The binomial methods gives\
    \ us ways to approximate these as well. How to find them in the binomial case\
    \ are described in Hull (2011). The implementation in C++ Code 12.3 is for the\
    \ non-dividend case.\n\n```\n#include <cmath>\n#include <algorithm>\n#include\
    \ <vector>\nusing namespace std;\ndouble option_price_delta_american_call_binomial(const\
    \ double& S,\n    const double& K,\n    const double& r,\n    const double& sigma,\n\
    \    const double& t,\n    const int& no_steps){ // steps in binomial\ndouble\
    \ R = exp(t/(*no_steps));\ndouble Rinv = 1.0/R;\ndouble u = exp(sigma*sqrt(t/no_steps));\n\
    double d = 1.0/u;\ndouble uu = u*u;\ndouble pUp = (R-d)/(u-d);\ndouble pDown =\
    \ 1.0 - pUp;\nvector<double> prices (no_steps+1);\nprices[0] = S*pow(d, no_steps);\n\
    for (int i=1; i<=no_steps; ++i) prices[i] = uu*prices[i-1];\nvector<double> call_values\
    \ (no_steps+1);\nfor (int i=0; i<=no_steps; ++i) call_values[i] = max(0.0, (prices[i]-K));\n\
    for (int curr_step=no_steps-1; curr_step>=0; --CurrStep) {\n    for (int i=0;\
    \ i<=CurrStep; ++i) {\n        prices[i] = d*prices[i+1];\n        call_values[i]\
    \ = (pDown*call_values[i]+pUp*call_values[i+1])*Rinv;\n        call_values[i]\
    \ = max(call_values[i], prices[i]-K); // check for exercise\n    };\n};\ndouble\
    \ delta = (call_values[1]-call_values[0])/(S*u-S*d);\nreturn delta;\n};\n```\n\
    \n# C++ Code 12.3: Delta\n\nCalculation of all the derivatives are shown in C++\
    \ Code 12.4"
