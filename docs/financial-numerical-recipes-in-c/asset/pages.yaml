- pgno: 73
  md: '# 6.6 The zero beta portfolio


    Proposition 3 For any portfolio p on the frontier, there is a frontier portfolio
    zc(p) satisfying


    $$cov(r_{zc(p)}, r_p) = 0.$$


    This portfolio is called the zero beta portfolio relative to p. The zero beta
    portfolio zb(p) has return


    $$E[r_{zc(p)}] = \frac{A}{C} - \frac{\frac{D}{C}}{E[r_p] - \frac{A}{C}}$$


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_73_0.png)


    Note that if p is an efficient portfolio on the mean variance frontier then zc(p)
    is inefficient. Conversely, if p is inefficient zc(p) is efficient.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_73_1.png)


    # 6.7 Allowing for a riskless asset.


    Suppose have N risky assets with weights w and one riskless assets with return
    r_f.


    Intuitively, the return on a portfolio with a mix of risky and risky assets can
    be written as


    $$E[r_p] = \text{weight in risky} \times \text{return risky} + \text{weight riskless}
    \times r_f$$


    which in vector form is:


    $$E[r_p] = w''e + (1 - w''1)r_f$$


    Proposition 4 An efficient portfolio in the presence of a riskless asset has the
    weights


    $$w_p = V^{-1}(e - 1r_f) \frac{E[r_p] - r_f}{H}$$


    where


    $$H = (e - 1r_f)''V^{-1}(e - 1r_f)$$'
