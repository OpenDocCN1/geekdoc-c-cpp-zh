  md: '# 22.3 Cubic spline.


    Cubic splines are well known for their good interpolation behaviour. The cubic
    spline parameterization was first used by McCulloch (1971) to estimate the nominal
    term structure. He later added taxes in McCulloch (1975). The cubic spline was
    also used by Litzenberger and Rolfo (1984). In this case the qubic spline is used
    to approximate the *discount factor*, not the yields.


    $$d(t) = 1 + b_1 t + c_1 t^2 + d_1 t^3 + \sum_{j=1}^K F_j (t - t_j)^3 1_{\{t <
    t_j\}}$$


    Here $1_{\{A\}}$ is the indicator function for an event $A$, and we have $K$ knots.


    To estimate this we need to find the $3 + K$ parameters:


    $\{b_1, c_1, d_1, F_1, \cdots, F_K\}$


    If the spline *knots* are known, this is a simple linear regression. C++ Code
    22.5 shows the calculation using this approximation.


    ```

    #include <cmath>

    #include <vector>

    using namespace std;


    double term_structure::discount_factor::cubic_spline(const double& t,

    const double& b1,

    const double& c1,

    const double& d1,

    const vector<double>& f,

    const vector<double>& knots){

    double d = 1.0 + b1 * t + c1 * (pow(t,2)) + d1 * (pow(t,3));

    for (int i=0; i<knots.size();++i) {

    if (t >= knots[i]) { d += f[i] * (pow((t-knots[i]),3)); }

    else { break; }

    }

    return d;

    };

    ```


    C++ Code 22.5: Approximating a discount function using a cubic spline


    Header File 22.3 and C++ Code 22.6 wraps this calculations into a term structure
    class.


    ```

    #include "fin_recipes.h"

    #include <vector>

    using namespace std;


    class term_structure::class::cubic_spline : public term_structure.class {

    private:

    double b_; double c_; double d_;

    vector<double> f_; vector<double> knots_;

    public:

