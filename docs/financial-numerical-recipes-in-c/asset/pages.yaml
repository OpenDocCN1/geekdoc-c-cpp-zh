- pgno: 159
  md: '# 15.3 A quadratic approximation to American prices due to Barone-Adesi and
    Whaley.


    We now discuss an approximation to the option price of an American option on a
    commodity, described in Barone-Adesi and Whaley (1987) (BAW).1 The commodity is
    assumed to have a continuous payout b. The starting point for the approximation
    is the (Black-Scholes) stochastic differential equation valid for the value of
    any derivative with price V.


    ```

    $$\frac{1}{2}\sigma^2 S^2 V_{SS} + b S V_S - r V + V_t = 0$$ (15.1)

    ```


    Here V is the (unknown) formula that determines the price of the contingent claim.
    For an European option the value of V has a known solution, the adjusted Black
    Scholes formula. For American options, which may be exercised early, there is
    no known analytical solution.


    To do their approximation, BAW decomposes the American price into the European
    price and the early exercise premium


    ```

    $$C(S, T) = c(S, T) + \epsilon_C(S, T)$$

    ```


    Here $\epsilon_C$ is the early exercise premium. The insight used by BAW is that
    $\epsilon_C$ must also satisfy the same partial differential equation. To come
    up with an approximation BAW transformed equation (15.1) into one where the terms
    involving $V_t$ are negligible, removed these, and ended up with a standard linear
    homogeneous second order equation, which has a known solution.


    The functional form of the approximation is shown in formula 15.2.


    ```

    $$C(S, T) = \begin{cases} c(S, T) + A_2 \left(\frac{S}{S^*}\right)^{q_2} & \text{if
    } S < S^* \\ S - X & \text{if } S \ge S^* \end{cases}$$

    where

    $$q_2 = \frac{1}{2} \left( -(N-1) + \sqrt{(N-1)^2 + \frac{4M}{K}} \right)$$

    $$A_2 = \frac{S^*}{q_2} \left( 1 - e^{(b-r)(T-t)} N(d_1(S^*)) \right)$$

    $$M = \frac{2r}{\sigma^2}, N = \frac{2b}{\sigma^2}, K(T) = 1 - e^{-r(T-t)}$$

    and $S^*$ solves

    $$S^* - X = c(S^*, T) + \frac{S^*}{q_2} \left( 1 - e^{(b-r)(T-t)} N(d_1(S^*))
    \right)$$

    ```


    Notation: S Stock price, X: Exercise price.


    Formula 15.2: The functional form of the Barone Adesi Whaley approximation to
    the value of an American call


    In implementing the formula, the only problem is finding the critical value $S^*$.
    This is the classical problem of finding a root of the equation


    ```

    $$g(S^*) = S^* - X - c(S^*) - \frac{S^*}{q_2} \left( 1 - e^{(b-r)(T-t)} N(d_1(S^*))
    \right) = 0$$

    ```


    1 The approximation is also discussed in Hull (2011).'
