    In this chapter we show a way of building interest rate trees and apply it to
    the pricing of various fixed income securities. The first need in such a procedure
    is to specify the future evolution of interest rates.


    # 24.1 The movement of interest rates


    We will assume that interest rates follow a Geometric Brownian Motion process


    ```

    dr = μrdt + σrdZ

    ```


    This is the same assumption which was used for stock prices in the Black Scholes
    case. This leads to the same binomial approximation, for one period:


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_214_0.png)


    or several periods:'
