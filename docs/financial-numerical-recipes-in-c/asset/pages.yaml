  md: "The modified duration measures the angle of the tangent at the current bond\
    \ yield. Approximating the change in bond price with duration is thus only a first\
    \ order approximation. To improve on this approximation we also need to account\
    \ for the curvature in the relationship between bond price and interest rate.\
    \ To quantify this curvature we calculate the *convexity* of a bond.\n\nConvexity\
    \ = \\(Cx = \\frac{1}{B_0} \\frac{1}{(1+r)^2} \\sum_{t=1}^T (t+t^2) \\frac{C_t}{(1+r)^t}\\\
    ) (4.6)\n\nThis calculation is implemented in C++ Code 4.6. To improve on the\
    \ estimate of how the bond price\n\n```\n#include <cmath>\n#include \"fin_recipes.h.\"\
    \n\ndouble bonds_convexity_discrete(const vector<double>& times,\n           \
    \                     const vector<double>& cashflows,\n                     \
    \           const double& r ){\n    double Cx=0;\n    for (int i=0;i<times.size();i++){\n\
    \        Cx+= cashflows[i]*times[i]*(times[i]+1)/(pow((1+r),times[i]));\n    };\n\
    \    double B=bonds_price_discrete(times, cashflows, r);\n    return (Cx/(pow((1+r),2)))/B;\n\
    };\n```\n\nC++ Code 4.6: Bond convexity with a flat term structure and annual\
    \ compounding\n\nchange when the interest rates changes you will then calculate\n\
    \n\\(\\frac{\\Delta B_0}{B_0} \\approx -D^* \\Delta y + \\frac{1}{2} C_x (\\Delta\
    \ y)^2\\)\n\nFormula 4.1 summarizes the above calculations.\n\n| Bond Price (\\\
    (B_0\\)) | Modified duration |\n|---|---|\n| \\(B_0 = \\sum_{t=1}^T \\frac{C_t}{(1+r)^t}\\\
    ) | \\(D^* = \\frac{D}{1+y}\\) |\n| Yield to maturity \\(y\\) solves | Convexity\
    \ (\\(Cx\\)) |\n| \\(B_0 = \\sum_{t=1}^T \\frac{C_t}{(1+y)^t}\\) | \\(Cx = \\\
    frac{1}{B_0} \\frac{1}{(1+r)^2} \\sum_{t=1}^T (t+t^2) \\frac{C_t}{(1+r)^t}\\)\
    \ |\n| Duration (\\(D\\)) | Approximating bond price changes |\n| \\(D = \\frac{1}{B_0}\
    \ \\sum_{t=1}^T \\frac{t C_t}{(1+r)^t}\\) | \\(\\frac{\\Delta B_0}{B_0} \\approx\
