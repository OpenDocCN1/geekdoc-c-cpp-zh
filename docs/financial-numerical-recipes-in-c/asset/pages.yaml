  md: '# 11.2.1 Exact american call formula when stock is paying one dividend.


    When a stock pays dividend, a call option on the stock may be optimally exercised
    just before the stock goes ex-dividend. While the general dividend problem is
    usually approximated somehow, for the special case of one dividend payment during
    the life of an option an analytical solution is available, due to Roll-Geske-Whaley.


    If we let S be the stock price, K the exercise price, D1 the amount of dividend
    paid, t1 the time of dividend payment, T the maturity date of option, we denote
    the time to dividend payment \(\tau_1 = T - t_1\) and the time to maturity \(\tau
    = T - t\).


    A first check of early exercise is:


    \(D_1 \le K \left( 1 - e^{-r(T-t_1)} \right)\)


    If this inequality is fulfilled, early exercise is not optimal, and the value
    of the option is


    \(c(S - e^{-r(t_1-t)} D_1, K, r, \sigma, (T-t))\)


    where c(.) is the regular Black Scholes formula.


    If the inequality is not fulfilled, one performs the calculation shown in Formula
    11.2 and implemented in C++ Code 11.3.


    ```

    C = (S - D_1 e^{-r(\tau_1-t)}) (N(b_1) + N(a_1, -b_1, \rho)) + K e^{-r(T-t)} N(a_2,
    -b_2, \rho) - (K - D_1) e^{-r(\tau_1-t)} N(b_2)

    where

    \(\rho = - \sqrt{\frac{(t_1 - t)}{T - t}}\)

    \(a_1 = \frac{\ln \left( \frac{S - D_1 e^{-r(\tau_1)}}{K} \right) + (r + \frac{1}{2}
    \sigma^2) \tau}{\sigma \sqrt{\tau}}\)

    \(a_2 = a_1 - \sigma \sqrt{T - t}\)

    \(b_1 = \frac{\ln \left( \frac{S - D_1 e^{-r(\tau_1-t)}}{S} \right) + (r + \frac{1}{2}
    \sigma^2) (t_1 - t)}{\sigma \sqrt{(t_1 - t)}}\)

    \(b_2 = b_1 - \sigma \sqrt{T - t}\)

    and \(\tilde{G}\) solves

    \(c(\tilde{S}, t_1) = \tilde{S} + D_1 - K\)

    ```


    S is the price of the underlying security, K the exercise price, r the risk free
    interest rate, D1 is the dividend amount and \(\sigma\) the standard deviation
    of the underlying asset, t the current date, T the maturity date, \(\tau = T -
    t\) the time to maturity for the option and N(.) the cumulative normal distribution.
    N(.) with one argument is the univariate normal cumulative distribution, N(.)
    with three arguments is the bivariate normal cumulative distribution with the
    correlation between the two normal given as the third argument.


    # Formula 11.2: Roll-Geske-Whaley price of american call option paying one fixed
    dividend


