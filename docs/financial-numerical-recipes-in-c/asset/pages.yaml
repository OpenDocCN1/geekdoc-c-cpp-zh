    # 22.2 Extended Nelson Siegel models


    The Nelson and Siegel (1987) model is simple, with parameters with clear obvious
    economic interpretations. It does have the problem that the term structure shapes
    that it allows is limited. To allow for more complex shapes, such as humped shapes,
    it has been extended in various ways. A popular approximation was introduced by
    Lars Svensson, parameterized as shown in Formula 22.2


    ```

    \( r(t) = \beta_0 + \beta_1 \left( \frac{1 - e^{-\frac{t}{\tau_1}}}{\frac{t}{\tau_1}}
    \right) + \beta_2 \left( \frac{1 - e^{-\frac{t}{\tau_1}}}{\frac{t}{\tau_1}} -
    e^{-\frac{t}{\tau_1}} \right) + \beta_3 \left( \frac{1 - e^{-\frac{t}{\tau_2}}}{\frac{t}{\tau_2}}
    - e^{-\frac{t}{\tau_2}} \right) \)

    ```


    Notation: \(t\): Time to maturity, \(r\) spot interest rate, \(\beta_0, \beta_1,
    \beta_2\) and \(\lambda\): constants.


    # Formula 22.2: Svensson''s extension of the Nelson and Siegel (1987) parameterization
    of term structure


    This is wrapped in a term structure class as shown in Header File 22.2 and C++
    Code 22.4.'
