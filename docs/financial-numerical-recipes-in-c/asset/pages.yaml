  md: 'Using these numbers to answer the questions, let us see what happens when the
    interest rate increases to 10%. This means the bond will be selling at par, equal
    to 100, which can be confirmed with direct computation:


    ```

    \( B_0 = \frac{10}{(1 + 0.1)^1} + \frac{10}{(1 + 0.1)^2} + \frac{110}{(1 + 0.1)^3}
    = 100 \)

    ```


    Using duration to estimate the change in the bond price for a unit change in the
    interest rate:


    ```

    \( \frac{\Delta B_0}{B_0} = -D^* \Delta y = -2.51 \cdot 0.01 = -0.0251 \)

    ```


    Using this duration based number to estimate the new bond price.


    ```

    \( \hat{B} = B_0 + \left( \frac{\Delta B_0}{B_0} \right) B_0 = 102.531 - 0.0251
    \cdot 102.531 = 99.957 \)

    ```


    Additionally using convexity in estimating the change in the bond price:


    ```

    \( \frac{\Delta B_0}{B_0} = -D^* \Delta y + \frac{1}{2} C \Delta y^2 = -2.51 \cdot
    0.01 + \frac{1}{2} 8.93(0.01)^2 = -0.0251 + 0.00044 = -0.02465 \)

    ```


    ```

    \( \hat{B} = 102.531 \left( 1 + \left( \frac{\Delta B_0}{B_0} \right) \right)
    = 102.531(1 - 0.02465) = 100.0036 \)

    ```


