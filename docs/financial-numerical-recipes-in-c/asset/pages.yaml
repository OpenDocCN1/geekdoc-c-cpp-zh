    +   14.4 More general payoffs. Function prototypes ...........................
    146

    +   14.5 Improving the efficiency in simulation ..............................
    147

    +   14.5.1 Control variates. ............................................... 147

    +   14.5.2 Antithetic variates. ............................................ 148

    +   14.6 More exotic options ............................................... 151

    +   14.7 References ........................................................ 152


    We now consider using Monte Carlo methods to estimate the price of an European
    option, and let us first consider the case of the "usual" European Call, which
    can priced by the Black Scholes equation. Since there is already a closed form
    solution for this case, it is not really necessary to use simulations, but we
    use the case of the standard call for illustrative purposes.


    At maturity, a call option is worth


    \( c_T = \max(0, S_T - X) \)


    At an earlier date t, the option value will be the expected present value of this.


    \( c_t = E[PV(\max(0, S_T - X)] \)


    Now, an important simplifying feature of option pricing is the "risk neutral result,"
    which implies that we can treat the (suitably transformed) problem as the decision
    of a risk neutral decision maker, if we also modify the expected return of the
    underlying asset such that this earns the risk free rate.


    \( c_t = e^{-r(T-t)} E^*[\max(0, S_T - X)] \)


    where \( E^*[\cdot] \) is a transformation of the original expectation. One way
    to estimate the value of the call is to simulate a large number of sample values
    of \( S_T \) according to the assumed price process, and find the estimated call
    price as the average of the simulated values. By appealing to a law of large numbers,
    this average will converge to the actual call value, where the rate of convergence
    will depend on how many simulations we perform.'
