    ), and calculate \\(\\hat{p}_T^{cv}\\), the estimate of the put price with a control\
    \ variate adjustment, as follows\n\n\\(\\hat{p}_T^{cv} = \\hat{p}_t + (\\hat{c}_t^{bs}\
    \ - \\hat{c}_t)\\)\n\nOne can use other derivatives than the at-the-money call\
    \ as the control variate, the only limitation being that it has a tractable analytical\
    \ solution.\n\nC++ Code 14.6 shows the implementation of a Monte Carlo estimation\
    \ using an at-the-money European call as the control variate.\n\n```\n#include\
    \ <cmath>\nusing namespace std;\n#include \"fin_recipes.h\"\n\ndouble\nderivative_price_simulate_european_option_generic_with_control_variate(const\
    \ double& S,\n                                                               \
    \       const double& X,\n                                                   \
    \                   const double& r,\n                                       \
    \                               const double& sigma,\n                       \
    \                                               const double& time,\n        \
    \                                                              double payoff(const\
    \ double& S,\n                                                               \
    \                     const double& X),\n                                    \
    \                                  const int& no_sims) {\n    double c_bs = option_price_call_black_scholes(S,S,r,sigma,time);//\
    \ price an at the money Black Scholes call\n    double sum_payoffs=0;\n    double\
    \ sum_payoffs_bs=0;\n    for (int n=0; n<no_sims; n++) {\n        double S_T=\
    \ simulate_lognormal_random_variable(S,r,sigma,time);\n        sum_payoffs +=\
    \ payoff(S_T,X);\n        sum_payoffs_bs += payoff(call(S,T,S)); // simulate at\
    \ the money Black Scholes price\n    }\n    double c_sim = exp(-r*time) * (sum_payoffs/no_sims);\n\
    \    double c_bs_sim = exp(-r*time) * (sum_payoffs_bs/no_sims);\n    double c_sim\
    \ = (c_bs-c_bs_sim);\n    return c_sim;\n};\n```\n\nC++ Code 14.6: Generic with\
    \ control variate\n\n# 14.5.2 Antithetic variates.\n\nAn alternative to using\
    \ control variates is to consider the method of antithetic variates. The idea\
    \ behind this is that Monte Carlo works best if the simulated variables are “spread”\
    \ out as closely as possible to the true distribution. Here we are simulating\
    \ unit normal random variables. One property of the normal is that it is symmetric\
    \ around zero, and the median value is zero. Why don’t we enforce this in the\
    \ simulated terminal values? An easy way to do this is to first simulate a unit\
    \ random normal variable Z, and then use both Z and -Z to generate the lognormal\
    \ random variables. C++ Code 14.7 shows the implementation of this idea.\n\nBoyle\
    \ (1977) shows that the efficiency gain with antithetic variates is not particularly\
    \ large. There are other ways of ensuring that the simulated values really span\
    \ the whole sample space, sometimes called “pseudo Monte Carlo.”"
