  md: "# 14.1 Simulating lognormally distributed random variables\n\nLognormal variables\
    \ are simulated as follows. Let \\(\\tilde{x}\\) be normally distributed with\
    \ mean zero and variance one. If \\(S_t\\) follows a lognormal distribution, then\
    \ the one-period-later price \\(S_{t+1}\\) is simulated as\n\n\\(S_{t+1} = S_t\
    \ e^{(r - \\frac{1}{2}\\sigma^2) + \\sigma \\tilde{x}}\\)\n\nor more generally,\
    \ if the current time is \\(t\\) and terminal date is \\(T\\), with a time between\
    \ \\(t\\) and \\(T\\) of \\((T-t)\\),\n\n\\(S_T = S_t e^{(r - \\frac{1}{2}\\sigma^2)(T-t)\
    \ + \\sigma \\sqrt{T-t} \\tilde{x}}\\)\n\nSimulation of lognormal random variables\
    \ is illustrated by C++ Code 14.1.\n\n```\n#include <cmath>\nusing namespace std;\n\
    #include \"normdist.h\"\ndouble simulate_lognormal_random_variable(const double&\
    \ S, // current value of variable\n                                          const\
