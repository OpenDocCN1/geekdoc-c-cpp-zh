- pgno: 163
  md: 'The call option is found as


    C(S, K, T, r, b, \sigma; X) = \alpha(X)S^\beta - \alpha(X)\varphi(S, T|\beta,
    X, X) + \varphi(S, T|1, X, X)

    -\varphi(S, T|1, K, X) - X\varphi(S, T|0, X, X) + X\varphi(S, T|0, K, X)


    where


    \alpha(X) = (X - K)X^{-\beta}

    \beta = \left(\frac{1}{2} - \frac{b}{\sigma^2}\right) + \sqrt{\left(\frac{b}{\sigma^2}
    - \frac{1}{2}\right)^2 + 2\frac{r}{\sigma^2}}

    \varphi(S, T|\gamma, H, X) = e^{\lambda S^T} \left[ N(d_1) - \left(\frac{X}{S}\right)^\kappa
    N(d_2) \right]

    \lambda = \left( -r + \gamma b + \frac{1}{2}\gamma(\gamma - 1)\sigma^2 \right)
    T

    d_1 = - \frac{\ln(S/H) + (b + (\gamma - \frac{1}{2})\sigma^2)T}{\sigma\sqrt{T}}

    d_2 = - \frac{\ln(X^2/SH) + (b + (\gamma - \frac{1}{2})\sigma^2)T}{\sigma\sqrt{T}}

    \kappa = \frac{2b}{\sigma^2} + (2\gamma - 1)

    X_T = B_0 + (B_\infty - B_0)(1 - e^{h(T)})

    h(T) = -\left( bT + 2\sigma\sqrt{T} \right) \left( \frac{B_0}{B_\infty - B_0}
    \right)


    or (suggested in a later paper Bjerksund and Stensland (2002))


    h(T) = -\left( bT + 2\sigma\sqrt{T} \right) \left( \frac{K^2}{B_\infty - B_0}
    \right)


    B_\infty = \frac{\beta}{\beta - 1} K

    B_0 = \max \left( K, \left( \frac{r}{r - b} \right) K \right)


    S: Price of underlying security. K: Exercise price.


    Formula 15.3: The Bjerksund and Stensland (1993) lower bound approximation to
    the value of an American Call'
