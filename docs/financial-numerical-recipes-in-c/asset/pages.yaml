  md: '# Chapter 23


    # Binomial Term Structure models


    # Contents


    | Section | Page |

    |---|---|

    | 23.1 The Rendleman and Bartter model | 211 |

    | 23.2 Readings | 213 |


    Pricing bond options with the Black Scholes model, or its binomial approximation,
    as done in chapter 20, does not always get it right. For example, it ignores the
    fact that at the maturity of the bond, the bond volatility is zero. The bond volatility
    decreases as one gets closer to the bond maturity. This behaviour is not captured
    by the assumptions underlying the Black Scholes assumption. We therefore look
    at more complicated term structure models, the unifying theme of which is that
    they are built by building trees of the interest rate.


    # 23.1 The Rendleman and Bartter model


    The Rendleman and Bartter approach to valuation of interest rate contingent claims
    (see Rendleman and Bartter (1979) and Rendleman and Bartter (1980)) is a particular
    simple one. Essentially, it is to apply the same binomial approach that is used
    to approximate options in the Black Scholes world, but the random variable is
    now the interest rate. This has implications for multiperiod discounting: Taking
    the present value is now a matter of choosing the correct sequence of spot rates,
    and it may be necessary to keep track of the whole "tree" of interest rates. Such
    a tree can then be used to price various fixed income securities. In the next
    chapter we illustrate this more generally, here we show a direct implementation
    of the original model. C++ Code 23.1 implements the original algorithm for a call
    option on a (long maturity) zero coupon bond.'
