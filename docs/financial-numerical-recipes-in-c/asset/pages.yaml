    First step: Find terminal payoffs of derivative security:


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_86_1.png)


    Next step: Find the two possible call prices at time 1:


    $C_u = e^{-r}(qC_{uu} + (1-q)C_{ud})$

    $C_d = e^{-r}(qC_{ud} + (1-q)C_{dd})$


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_86_2.png)


    Final step: Using the two possible payoffs at time 1, $C_u$ and $C_d$, find option
    value at time 0:


    $C_0 = e^{-r}(qC_u + (1-q)C_d)$


    Thus, binomial pricing really concerns "rolling backward" in a binomial tree,
    and programming therefore concerns an efficient way of traversing such a tree.
    The obvious data structure for describing such a tree is shown in C++ Code 8.2,
    where the value in each node is calculated from finding out the number of up and
    down steps are used to get to the particular node.


    Exercise 8.2.'
