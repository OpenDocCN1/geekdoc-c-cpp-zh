    To just use todays term structure, we need to take the observations of discount
    factors \(d_t\), observed in the market and use these to generate a term structure.
    The simplest possible way of doing this is to linearly interpolate the currently
    observable discount factors.


    # 5.3.1 Linear Interpolation.


    If we are given a set of discount factors (\(d_t\)) for various maturities, the
    simplest way to construct a term structure is by straightforward linear interpolation
    between the observations we have to find an intermediate time. For many purposes
    this is “good enough.” This interpolation can be on either zero coupon yields,
    discount factors or forward rates, we illustrate the case of linear interpolation
    of spot (zero coupon) rates.


    Computer algorithm, linear interpolation of yields. Note that the algorithm assumes
    the yields are ordered in increasing order of time to maturity.


    # Example


    You observe the following term structure of spot rates


    | Time | r |

    |---|---|

    | 0.1 | 0.1 |

    | 0.5 | 0.2 |

    | 1 | 0.3 |

    | 5 | 0.4 |

    | 10 | 0.5 |


    Interpolate spot rates (zero rates) at times 0.1, 0.5, 1, 3, 5 and 10.'
