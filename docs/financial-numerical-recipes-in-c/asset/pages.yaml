  md: 'where \( C_{BS}(\cdot) \) is the Black Scholes formula.


    # 10.2 Valuing warrants when observing the stock value


    However, one does not necessarily observe the asset value of the firm. Typically
    one only observes the equity value of the firm. If we let \( S_t \) be the current
    stock price, the asset value is really:


    \( A_t = nS_t + mW_t \)


    Using the stock price, one would value the warrant as


    \( W_t = \frac{n}{n+m} C_{BS} \left( \frac{nS_t + mW_t}{n}, K, \sigma, r, (T-t)
    \right) \)


    or


    \( W_t = \frac{n}{n+m} C_{BS} \left( S_t + \frac{m}{n} W_t, K, \sigma, r, (T-t)
    \right) \)


    Note that this gives the value of \( W_t \) as a function of \( W_t \). One need
    to solve this equation numerically to find \( W_t \).


    The numerical solution for \( W_t \) is done using the Newton-Rhapson method.
    Let


    \( g(W_t) = W_t - \frac{n}{n+m} C_{BS} \left( S_t + \frac{m}{n} W_t, K, \sigma,
    r, (T-t) \right) \)


    Starting with an initial guess for the warrant value \( W_t^i \), the Newton-Rhapson
    method is that one iterates as follows


    \( W_t^i = W_t^{i-1} - \frac{g(W_t^{i-1})}{g''(W_t^{i-1})}, \)


    where \( i \) signifies iteration \( i \), until the criterion function \( g(W_t^{i-1})
    \) is below some given accuracy \( \epsilon \). In this case


    \( g''(W_t) = 1 - \frac{m}{m+n} N(d_1) \)


    where


    \( d_1 = \frac{\ln \left( \frac{S_t + \frac{m}{n} W_t}{K} \right) + (r + \frac{1}{2}
    \sigma^2)(T-t)}{\sigma \sqrt{T-t}} \)


    An obvious starting value is to set calculate the Black Scholes value using the
    current stock price, and multiply it with \( \frac{m}{m+n} \).


    C++: Code 10.1 implements this calculation.


    # Example


    A stock is currently priced at \( S = 48 \). Consider warrants on the same company
    with exercise price \( K = 40 \) and time to maturity of six months. The company
    has \( n = 10000 \) shares outstanding, and has issued \( m = 1000 \) warrants.
    The current (continously compounded) risk free interest rate is 8%. Determine
    the current warrant price.'
