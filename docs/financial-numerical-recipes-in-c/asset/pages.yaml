  md: '# Chapter 15


    # Pricing American Options – Approximations


    # Contents


    +   15.1 The Johnson (1983) approximation . . . . . . . . . . . . . . . . . .
    . . 153

    +   15.2 An approximation to the American Put due to Geske and Johnson (1984)
    . . . . . . . . . . . . . . . . . . . . 156

    +   15.3 A quadratic approximation to American prices due to Barone-Adesi and
    Whaley. . . . . . . . . . . . . . . . . . . . 159

    +   15.4 An alternative approximation to american options due to Bjerksund and
    Stensland (1993) . . . . . . . . . . . . . . . . . . . . 162

    +   15.5 Readings . . . . . . . . . . . . . . . . . . . . 165


    There has been developed some useful _approximations_ to various specific options.
    It is of course American options that are approximated. We will look at a number
    of approximations, both for their intrinsic usefulness, but also as examples of
    different approaches to generating an approximated value. The first we will look
    at is the Johnson (1983) approximation to an American put. This is a purely empirical
    approach to estimating the functional forms, with parameters estimated using regressions.
    The Geske and Johnson (1984) approach is to view the American option as the a
    limit of a sequence of Bermudan options with increasing number of exercise times.
    The American value is found by interpolating forward the Bermudan values. The
    Barone-Adesi and Whaley (1987) approximation decomposes the American option into
    two, the European value, and the early exercise premium. The early exercise premium
    is relatively small, and is easier to approximate. Finally, the Bjerksund and
    Stensland (1993) is an example of bounding the option value by finding a lower
    bound on its value. A typical approach to doing so is to specify some (suboptimal)
    exercise strategy. As soon as the exercise strategy is known, the option is easily
    valued.


    Approximations are useful, but they should be used with caution. Typically, an
    approximation works well within a range of parameter values, but can go seriously
    wrong for some unfortunate combination of parameters. The user is well advised
    to consider alternative approximations, and at a minimum use the price of the
    corresponding European option as a "sanity check" in the calculations. (In fact,
    in several of the following routines values are checked against Black Scholes
