  md: '# 5.3 Using the currently observed term structure.


    A first step to a general term structure is to use market data on bond prices
    and interest rates to infer discount factors. The simplest way of presenting this
    problem is in terms of linear algebra. Suppose we have three bonds with cash flows
    at times 1, 2 and 3.


    ```

    B_1 = d_1 C_{11} + d_2 C_{12} + d_2 C_{13}

    B_2 = d_1 C_{21} + d_2 C_{22} + d_2 C_{23}

    B_1 = d_1 C_{31} + d_2 C_{32} + d_3 C_{33}

    ```


    Writing this in terms of matrices


    ```

    \begin{bmatrix} B_1 \\ B_2 \\ B_3 \\ \end{bmatrix} = \begin{bmatrix} d_1 \\ d_2
    \\ d_3 \\ \end{bmatrix} \begin{bmatrix} C_{11} & C_{12} & C_{13} \\ C_{21} & C_{22}
    & C_{23} \\ C_{31} & C_{32} & C_{33} \\ \end{bmatrix}

    ```


    Solving for the discount factors


    ```

    \begin{bmatrix} d_1 \\ d_2 \\ d_3 \\ \end{bmatrix} = \begin{bmatrix} C_{11} &
    C_{12} & C_{13} \\ C_{21} & C_{22} & C_{23} \\ C_{31} & C_{32} & C_{33} \\ \end{bmatrix}^{-1}
    \begin{bmatrix} B_1 \\ B_2 \\ B_3 \\ \end{bmatrix}

    ```


    or


    ```

    d = C^{-1}B

    ```


    using the obvious matrix definitions


    ```

    B = \begin{bmatrix} B_1 \\ B_2 \\ B_3 \\ \end{bmatrix} \quad d = \begin{bmatrix}
    d_1 \\ d_2 \\ d_3 \\ \end{bmatrix} \quad C = \begin{bmatrix} C_{11} & C_{12} &
    C_{13} \\ C_{21} & C_{22} & C_{23} \\ C_{31} & C_{32} & C_{33} \\ \end{bmatrix}

    ```


    # Example


    The following set of bond and bond prices is observed:


    | Bond | Bond Price | 0 | 0.5 | 1 | 1.5 | 2 | 3 | 4 |

    |---|---|---|---|---|---|---|---|---|

    | 1 | 98 | | 100 | | | | | |

    | 2 | 96 | | | 100 | | | | |

    | 2 | 92 | | | | 100 | | | |

    | 3 | 118 | | 10 | 10 | 10 | 110 | | |

    | 4 | 109 | | 8 | 8 | 8 | 8 | | 108 |

    | 5 | 112 | | 9 | 9 | 9 | 9 | 9 | 109 |


    The bonds are treasury securities, which can be viewed as nominally riskless.


    +   1. For what maturities is it possible to infer discount factors?

    +   2. Determine the implicit discount factors in the market.

    +   3. What is the interest rates implied in this set of discount rates?


    Here we can find the discount factors for maturities of 0.5,1,1.5,2,3 and 4.'
