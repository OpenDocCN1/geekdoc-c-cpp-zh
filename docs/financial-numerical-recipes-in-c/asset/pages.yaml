  md: '# Example


    A 3 year bond with a face value of $100 makes annual coupon payments of 10%. The
    current interest rate (with annual compounding) is 9%.


    +   1. Determine the current bond price.

    +   2. Suppose the interest rate changes to 10%, determine the new price of the
    bond by direct calculation.

    +   3. Use duration to estimate the new price and compare it to the correct price.

    +   4. Use convexity to improve on the estimate using duration only.


    Need to calculate the following:


    The current bond price: \( B_0 = \frac{10}{(1+0.09)^1} + \frac{10}{(1+0.09)^2}
    + \frac{110}{(1+0.09)^3} = 102.531 \).

    The bond''s duration: \( D = \frac{10 \times 1}{102.531} \frac{1}{(1.09)} + \frac{2
    \times 10}{102.531} \frac{1}{(1.09)^2} + \frac{3 \times 110}{102.531} \frac{1}{(1.09)^3}
    = 2.74 \)

    The modified duration: \( D^{mod} = \frac{D}{1+r} = \frac{2.74}{1.09} = 2.51 \).

    The convexity: \( Cx = \frac{1}{(1+0.09)^2} \frac{10 \times 1 \times 2}{102.531}
    (\frac{1+1 \times 10}{1.09} + \frac{2^2+2 \times 10}{1.09^2} + \frac{(3+3)^2 \times
    110}{1.09^3}) = 8.93 \).


    Here are the calculations:


    ```

    Matlab program:

    C = [10,10,110];

    t = 1:3;

    r = 0.09;

    B = C * (1./(1+r).^(-t));

    De = (1/B)''* C .* (1./(1+t).^-2.*C .* (1./(1+r).^-t)'');

    Cx = (1/(1+t+2)) * (1/(B).^t).*2.*C .* (1./(1+r).^-t)'';

    newB=C* (1./(1+0.1).^-t);

    ```


    Output from Matlab program:

    B = 102.53

    D = 2.7390

    Cx = 6.6272

    newB = 100.000


