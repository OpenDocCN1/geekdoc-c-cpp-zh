  md: '# 15.2 An approximation to the American Put due to Geske and Johnson (1984)


    Geske and Johnson (1984) develop an approximation for the American put problem.
    The solution technique is to view the American put as a sequence of Bermudan options,
    with the number of exercise dates increasing. The correct value is the limit of
    this sequence.


    Define \(P_i\) to be the price of the put option with \(i\) dates of exercise
    left. \(P_1\) is then the price of an european option, with the one exercise date
    the expiry date. \(P_2\) is the price of an option that can be exercised twice,
    once halfway between now and expiry, the other at expiry. Geske-Johnson shows
    how these options may be priced, and then develops a sequence of approximate prices
    that converges to the correct price. An approximation involving 3 option evaluations
    is


    ```

    \(\hat{P} = P_3 + \frac{7}{2}(P_3 - P_2) - \frac{1}{2}(P_2 - P_1)\)

    ```


    To calculate these, first define


    ```

    \(d_1(q, \tau) = \frac{\ln\left(\frac{S}{q}\right) + (r + \frac{1}{2}\sigma^2)\tau}{\sigma\sqrt{\tau}},
    d_2(q, \tau) = d_1 - \sigma\sqrt{\tau}\)

    ```


    and


    ```

    \(\rho_{12} = \frac{1}{\sqrt{2}}, \rho_{13} = \frac{1}{\sqrt{3}}, \rho_{23} =
    \sqrt{\frac{2}{3}}\)

    ```


    In this notation, \(P_1\) is the ordinary (european) Black Scholes value:


    ```

    \(P_1 = Xe^{-rT}N_1(-d_2(X, T)) - SN_1(d_1(X, T))\)

    ```


    To calculate \(P_2\):


    ```

    \(P_2 = Xe^{-r\frac{T}{2}}N_1 \left(-d_2 \left(\overline{S}_{\frac{T}{2}}, \frac{T}{2}\right)\right)
    - SN_1 \left(-d_1 \left(\overline{S}_{\frac{T}{2}}, \frac{T}{2}\right)\right)
    + Xe^{-rT}N_2 \left(d_2 \left(\overline{S}_{\frac{T}{2}}, \frac{T}{2}\right),
    -d_2(X, T); -\rho_{12}\right) - SN_2 \left(d_1 \left(\overline{S}_{\frac{T}{2}},
    \frac{T}{2}\right), -d_1(X, T); -\rho_{12}\right)\)

    ```


    and \(\overline{S}_{\frac{T}{3}}\) solves


    ```

    \(S = X - p \left( S, X, \frac{T}{2}, r, \sigma = \overline{S}_{\frac{T}{3}} \right)\)

    ```


    To calculate \(P_3\):


    ```

    \(P_3 = Xe^{-r\frac{T}{3}}N_1 \left(-d_2 \left(\overline{S}_{\frac{T}{3}}, \frac{T}{3}\right)\right)
    - SN_1 \left(-d_1 \left(\overline{S}_{\frac{T}{3}}, \frac{T}{3}\right)\right)
    + Xe^{-r\frac{2T}{3}}N_2 \left(d_2 \left(\overline{S}_{\frac{T}{3}}, \frac{T}{3}\right),
    -d_2 \left(\overline{S}_{\frac{2T}{3}}, \frac{2T}{3}\right); -\rho_{12}\right)
    - SN_2 \left(d_1 \left(\overline{S}_{\frac{T}{3}}, \frac{T}{3}\right), -d_1 \left(\overline{S}_{\frac{2T}{3}},
    \frac{2T}{3}\right); -\rho_{12}\right) + Xe^{-rT}N_3 \left(d_1 \left(\overline{S}_{\frac{T}{3}},
    \frac{T}{3}\right), d_1 \left(\overline{S}_{\frac{2T}{3}}, \frac{2T}{3}\right),
    -d_1(X, T); \rho_{12}, -\rho_{13}, -\rho_{23}\right) - SN_3 \left(d_2 \left(\overline{S}_{\frac{T}{3}},
    \frac{T}{3}\right), d_2 \left(\overline{S}_{\frac{2T}{3}}, \frac{2T}{3}\right),
    -d_2(X, T); \rho_{12}, -\rho_{13}, -\rho_{23}\right)\)

    ```'
