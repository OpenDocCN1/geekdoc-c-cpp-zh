  md: '# 15.4 An alternative approximation to american options due to Bjerksund and
    Stensland (1993)


    Bjerksund and Stensland (1993) provides an alternative approximation to the price
    of American options. Their approximation is an example of calculating a lower
    bound for the option value. Their valuation relies on using an exercise strategy
    that is known, although suboptimal, close enough to the (unknown) exercise strategy
    that the approximated value is


    The corresponding put option can be estimated as


    ```

    P(S, X, T, r, b, \sigma) = C(X, S, T, r - b, -b, \sigma)

    ```'
