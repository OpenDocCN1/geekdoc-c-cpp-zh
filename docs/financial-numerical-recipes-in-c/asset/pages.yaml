  md: '# 6.11 Equilibrium: CAPM


    Under certain additional assumptions, an economy of mean variance optimizers will
    aggregate to an economy where the Capital Asset Pricing Model (CAPM) holds. Under
    the CAPM, any asset returns will satisfy.


    $E[r_i] = r_f + \beta_i(E[r_m] - r_f)$


    where $r_i$ is the return on asset $i$, $r_f$ the return on the risk free asset,


    # 6.11.1 Treynor


    $T_p = \frac{r_p - r_f}{\beta_p}$


    # 6.11.2 Jensen


    $\alpha_p = r_p - (r_f + \beta_p(r_m - r_f))$


    # 6.12 Working with Mean Variance and CAPM


    The computational problems in mean variance optimization and the CAPM are not
    major, except for the case of short sales constrained portfolios (quadratic programming).
    The issues of more concern is estimation of parameters such as covariances and
    betas.


    ```

    ```matlab

    function s = sharpe(r,rf)

    s=(mean(r)-mean(rf))/std(r-rf);

    endfunction

    ```

    ```


    Matlab Code 6.2: Sharpe Ratio


    ```

    ```matlab

    function t = treynor(r, m, rf)

    beta = cov(r,m)/var(m);

    t = (mean(r-rf))/beta;

    endfunction

    ```

    ```


    Matlab Code 6.3: Treynor Ratio


    ```

    ```matlab

    function alpha = jensen(r, m, rf)

    beta = cov(r,m)/var(m);

    alpha = mean(r) - (rf+beta*(mean(m)-rf));

    endfunction

    ```

    ```


