    ```


    Notation: r_p desired portfolio returns: V: covariance matrix of asset returns.
    e: vector of expected asset returns.


    # 6.4 The global minimum variance portfolio


    The portfolio that minimizes variance regardless of expected return is called
    the global minimum variance portfolio. Let mvp be the global minimum variance
    portfolio.


    # Proposition 2 (Global Minimum Variance Portfolio) The global minimum variance
    portfolio has weights


    ```

    w''_{mvp} = (1''V^{-1}1)^{-1} 1''V^{-1} = \frac{1}{C} 1''V^{-1},

    ```


    expected return E[r_{mvp}] = \frac{A}{C} and variance var(r_{mvp}) = \frac{1}{C}.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_72_0.png)


    # 6.5 Efficient portfolios


    Portfolios on the minimum variance frontier with expected returns higher than
    or equal to E[r_{mvp}] are called efficient portfolios.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_72_1.png)'
