  md: "In addition to the above economic qualifications to interpretations of the\
    \ internal rate of return, we also have to deal with technical problem stemming\
    \ from the fact that any polynomial equation has potentially several solutions,\
    \ some of which may be imaginary. By imaginary here we mean that we move away\
    \ from the real line to the set of complex numbers. In economics we prefer the\
    \ real solutions, complex interest rates are not something we have much intuition\
    \ about... To see whether we are likely to have problems in identifying a single\
    \ meaningful IRR, the code shown in code 3.3 implements a simple check. It is\
    \ only a necessary condition for a unique IRR, not sufficient, so you may still\
    \ have a well-defined IRR even if this returns false. The first test is just to\
    \ count the number of sign changes in the cash flow. From Descartes rule we know\
    \ that the number of real roots is one if there is only one sign change. If there\
    \ is more than one change in the sign of cash flows, we can go further and check\
    \ the aggregated cash flows for sign changes (See Norstrom (1972)).\n\n```\n#include\
    \ <cmath>\n#include <vector>\nusing namespace std;\ninline int sgn(const double&\
    \ r) { if (r>=0) {return 1;} else {return -1;} };\nbool cash_flow_unique_irr(const\
    \ vector<double>& cflow_times,\n             const vector<double>& cflow_amounts)\
    \ {\n  int sign_changes=0; // first check Descartes rule\n  for (int t=1;t<cflow_times.size();++t){\n\
    \    if (sgn(cflow_amounts[t-1])*sgn(cflow_amounts[t])) sign_changes++;\n  }\n\
    \  if (sign_changes==0) return false; // can not find any irr\n  if (sign_changes==1)\
    \ return true;\n  double A = cflow_amounts[0]; // check the aggregate cash flows,\
    \ due to Norstrom\n  for (int t=1;t<cflow_times.size();++t){\n    if (sgn(A) !=\
    \ sgn(A+=cflow_amounts[t])) sign_changes++;\n  }\n  if (sign_changes<=1) return\
    \ true;\n  return false;\n}\n```\n\n# C++ Code 3.3: Test for uniqueness of IRR\n\
    \nA better way to gain an understanding for the relationship between the interest\
    \ rate and the present value is simply to plot the present value as a function\
    \ of the interest rate. The following picture illustrates the method for two different\
    \ cash flows. Note that the set of cash flows on the right has two possible interest\
    \ rates that sets the present value equal to zero.\n\n![](img/f93b3f3a5d69957a07ff6e28c47bacdd_33_0.png)\n\
    \n![](img/f93b3f3a5d69957a07ff6e28c47bacdd_33_1.png)\n\n$C_0 = -100, C_1 = 10,\
    \ C_2 = 100$\n\n$C_0 = -100, C_1 = 201, C_2 = -100$"
