- pgno: 160
  md: 'This is solved using Newton''s algorithm for finding the root. We start by
    finding a first “seed” value $S_0$. The next estimate of $S_i$ is found by:


    \( S_{i+1} = S_i - \frac{g()}{g''()} \)


    At each step we need to evaluate \( g() \) and its derivative \( g''() \).


    \( g(S) = S - X - c(S) - \frac{1}{q_2} S \left( 1 - e^{(b-r)(T-t)} N(d_1) \right)
    \)


    \( g''(S) = (1 - \frac{1}{q_2}) \left( 1 - e^{(b-r)(T-t)} N(d_1) \right) + \frac{1}{q_2}
    (e^{(b-r)(T-t)} n(d_1)) \frac{1}{\sigma \sqrt{T-t}} \)


    where \( c(S) \) is the Black Scholes value for commodities. Code 15.3 shows the
    implementation of this formula for the price of a call option.


    # Example


    Consider the following set of parameters, used as an example in the Barone-Adesi
    and Whaley (1987) paper: \( S = 100, X = 100, \sigma = 0.20, r = 0.08, b = -0.04
    \).


    +   1. Price a call option with time to maturity of 3 months.


    ```

    C++ program:

    double S = 100; double X = 100; double sigma = 0.20;

    double r = 0.08; double b = -0.04; double time = 0.25;

    cout << " Call price using Barone-Adesi Whaley approximation = "

    << option_price_american_call_approximated_baw(S,X,r,b,sigma,time) << endl;

    Output from C++ program:

    Call price using Barone-Adesi Whaley approximation = 5.74339

    ```


    # Exercise 15.1.


    The Barone-Adesi – Whaley insight can also be used to value a put option, by approximating
    the value of the early exercise premium. For a put option the approximation is


    \( P(S) = \begin{cases} p(S,T) + A_1 \left( \frac{S}{S^{**}} \right)^{q_1} & \text{if
    } S > S^{**} \\ X - S & \text{if } S \le S^{**} \end{cases} \)


    \( A_1 = -\frac{S^{**}}{q_1} (1 - e^{(b-r)(T-t)} N(-d_1(S^{**}))) \)


    One again solves iteratively for \( S^{**} \), for example by Newton''s procedure,
    where now one would use


    \( g(S) = X - S - p(S) + \frac{S}{q_1} \left( 1 - e^{(b-r)(T-t)} N(-d_1) \right)
    \)


    \( g''(S) = (\frac{1}{q_1} - 1) \left( 1 - e^{(b-r)(T-t)} N(-d_1) \right) + \frac{1}{q_1}
    e^{(b-r)(T-t)} \frac{1}{\sigma \sqrt{T-t}} n(-d_1) \)


    +   1. Implement the calculation of the price of an American put option using
    the BAW approach.'
