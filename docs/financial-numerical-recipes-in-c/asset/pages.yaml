- pgno: 93
  md: '# 9.2.1 The original Black Scholes analysis


    The primary assumption underlying the Black Scholes analysis concerns the stochastic
    process governing the price of the underlying asset. The price of the underlying
    asset, S, is assumed to follow a geometric Brownian Motion process, conveniently
    written in either of the shorthand forms


    ```

    dS = μSdt + σSdZ

    ```


    or


    ```

    dS/S = μdt + σdZ

    ```


    where μ and σ are constants, and Z is Brownian motion.


    Using Ito''s lemma, the assumption of no arbitrage, and the ability to trade continuously,
    Black and Scholes showed that the price of *any* contingent claim written on the
    underlying must solve the *partial differential equation* (9.1).


    ```

    ∂f/∂S S + ∂f/∂t + 1/2 ∂²f/∂S² σ²S² = rf (9.1)

    ```


    For any *particular* contingent claim, the terms of the claim will give a number
    of *boundary conditions* that determines the form of the pricing formula.


    The pde given in equation (9.1), with the boundary condition c_T = max(0, S_T
    - K) was shown by Black and Scholes to have an analytical solution of functional
    form shown in the Black Scholes formula 9.1.


    # 9.2.2 The limit of a binomial case


    Another is to use the limit of a binomial process (Cox et al., 1979). The latter
    is particularly interesting, as it allows us to link the Black Scholes formula
    to the binomial, allowing the binomial framework to be used as an approximation.


    # 9.2.3 The representative agent framework


    A final way to show the BS formula to assume a representative agent and lognormality
    as was done in Rubinstein (1976).


    # 9.3 Partial derivatives.


    In trading of options, a number of partial derivatives of the option price formula
    is important.


    # 9.3.1 Delta


    The first derivative of the option price with respect to the price of the underlying
    security is called the *delta* of the option price. It is the derivative most
    people will run into, since it is important in hedging of options.


    ```

    ∂c/∂S = N(d₁)

    ```


    C++ - Code 9.2 shows the calculation of the delta for a call option.'
