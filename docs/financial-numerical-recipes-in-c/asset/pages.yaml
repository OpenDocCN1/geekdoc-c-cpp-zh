  md: '# 16.2 Asian options


    The payoff depends on the average of the underlying price. An *average price call*
    has payoff


    $$C_T = \max(0, \bar{S} - X),$$


    where $\bar{S}$ is the average of the underlying in the period between $t$ and
    $T$.


    Another Asian is the *average strike call*


    $$C_T = \max(0, S_T - \bar{S})$$


    There are different types of Asians depending on how the average $\bar{S}$ is
    calculated. For the case of $\bar{S}$ being lognormal and the average $\bar{S}$
    being a geometric average, there is an analytic formula due to Kemna and Vorst
    (1990). Hull (2011) also discusses this case. It turns out that one can calculate
    this option using the regular Black Scholes formula adjusting the volatility to
    $\sigma/\sqrt{3}$ and the dividend yield to


    $$\frac{1}{2} \left( r + q + \frac{1}{6} \sigma^2 \right)$$


    in the case of continuous sampling of the underlying price distribution.


    C++ Code 16.2 shows the calculation of the analytical price of an Asian geometric
    average price call.


    ```

    #include <cmath>

    using namespace std;

    #include "normdist.h" // normal distribution definitions

    double

    option_price_asian_geometric_average_price_call(const double& S,

    const double& K,

    const double& r,

    const double& q,

    const double& sigma,

    const double& time){

    double sigma_sqr = pow(sigma,2);

    double adj_div_yield=0.5*(r+q+sigma_sqr/6.0);

    double adj_sigma=sigma/sqrt(3.0);

    double adj_time=time;

    double adj_S=S*exp((adj_div_yield-r)*time);

    double d1 = (log(S/K) + (r-adj_div_yield + 0.5*adj_sigma_sqr)*time)/(adj_sigma*sqrt(time));

    double d2 = d1-(adj_sigma*sqrt(time));

    double call_price = S * exp(-adj_div_yield*time)* N(d1) - K * exp(-r*time) * N(d2);

    return call_price;

    };

    ```


    C++ Code 16.2: Analytical price of an Asian geometric average price call


    # Example


    Relevant parameters: $S = 100, K = 100, q = 0, r = 0.06, \sigma = 0.25$ and time
    to maturity is one year. Price an Asian geometric average price call.


    C++ program:


    ```

    double S=100; double K=100; double q=0;

    double r=0.06; double sigma=0.25; double time=1.0;

    cout << "Analytical geometric average = "

    << option_price_asian_geometric_average_price_call(S,K,r,q,sigma,time)

    << endl;

    ```


    Output from C++ program:


    Analytical geometric average = 6.74876'
