    \ \\(t_1, t_2, \\cdots, t_n\\), we get the following present value calculation:\n\
    \n\\(PV = \\sum_{i=1}^n e^{-rt_i} C_{t_i}\\)\n\nThis calculation is implemented\
    \ in C++ Code 3.4.\n\n```\n```cpp\n#include <cmath>\n#include <vector>\nusing\
    \ namespace std;\n\ndouble cash_flow_pv( const vector<double>& cflow_times,\n\
    \                     const vector<double>& cflow_amounts,\n                 \
    \    const double& r){\n    double PV=0.0;\n    for (int t=0; t<cflow.times.size();t++){\n\
    \        PV += cflow.amounts[t] * exp(-r*cflow.times[t]);\n    };\n    return\
    \ PV;\n};\n```\n```\n\nC++ Code 3.4: Present value calculation with continously\
    \ compounded interest\n\nIn much of what follows we will work with the case of\
    \ continously compounded interest. There is a number of reasons why, but a prime\
    \ reason is actually that it is easier to use continously compounded interest\
    \ than discretely compounded, because it is easier to deal with uneven time periods.\
    \ Discretely compounded interest is easy to use with evenly spaced cash flows\
    \ (such as annual cash flows), but harder otherwise.\n\n# 3.4 Further readings\n\
