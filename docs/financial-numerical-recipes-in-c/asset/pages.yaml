  md: '# 16.3 Lookback options


    The payoff from lookback options depend on the maximum or minimum of the underlying
    achieved through the period. The payoff from the lookback call is the terminal
    price of the underlying less the minimum value


    $C_T = \max(0, S_T - \min_{\tau \in [t,T]} S_\tau)$


    For this particular option an analytical solution has been found, due to Goldman,
    Sosin, and Gatto (1979), which is shown in Formula 16.1 and implemented in C++
    Code 16.3.


    $C = Se^{-q(T-t)}N(a_1) - Se^{-r(T-t)}\frac{\sigma^2}{2(r-q)}N(-a_1) - S_{min}e^{-r(T-t)}\left(N(a_2)
    - \frac{\sigma^2}{2(r-q)}e^{Y_1}N(-a_3)\right)$


    $a_1 = \frac{\ln\left(\frac{S}{S_{min}}\right) + (r - q + \frac{1}{2}\sigma^2)(T
    - t)}{\sigma\sqrt{T - t}}$


    $a_2 = a_1 - \sigma\sqrt{T - t}$


    $a_3 = \frac{\ln\left(\frac{S}{S_{min}}\right) + (-r + q + \frac{1}{2}\sigma^2)(T
    - t)}{\sigma\sqrt{T - t}}$


    $Y_1 = \frac{2\left(r - q - \frac{1}{2}\sigma^2\right)\ln\left(\frac{S}{S_{min}}\right)}{\sigma^2}$


    Formula 16.1: Analytical formula for a lookback call


    ```

    #include <cmath>

    using namespace std;

    #include "normdist.h"

    double option_price_european_lookback_call(const double& S,

    const double& Smin,

    const double& r,

    const double& q,

    const double& sigma,

    const double& time){

    if (r==q) return 0;

    double sigma_sqr = sigma*sigma;

    double time_sqrt = sqrt(time);

    double a1 = (log(S/Smin) + (r-q+sigma_sqr/2.0)*time)/(sigma*time_sqrt);

    double a2 = a1-sigma*time_sqrt;

    double a3 = (log(S/Smin) + (-r+q+sigma_sqr/2.0)*time)/(sigma*time_sqrt);

    double Y1 = 2.0 * (r-q-sigma_sqr/2.0)*log(S/Smin)/sigma_sqr;

    return S * exp(-q*time)*N(a1) - S*exp(-q*time)*exp(sigma_sqr/2.0*(r-q))*N(-a1)

    - Smin * exp(-r*time)*N(a2)-(sigma_sqr/(2*(r-q)))*exp(Y1)*N(-a3);

    };

    ```


    C++ Code 16.3: Price of lookback call option


    # Example


    Parameters \( S = 100, Smin = S q = 0, r = 0.06, \sigma = 0.346, \text{time} =
    1.0 \). Price an European lookback call.'
