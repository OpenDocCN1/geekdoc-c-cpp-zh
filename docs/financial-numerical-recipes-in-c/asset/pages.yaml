  md: '# 25.4 Pricing things


    We now have access to what we need to do pricing through the recursive relationship


    ```

    C(n,i) = [\pi C(n+1, i+1) + (1-\pi) C(n+1, i)] P_i^{(n)}(1)

    ```


    where C(n,i) is the value of a security at time n at node i.


    What we are pricing are typically state and time-contingent claims to cash flows.
    Let us illustrate pricing of an (European) call option on some underlying bond.
    Suppose this bond is risk free. Its cash flows at each future date does not depend
    on the state, but the timing of cash flows changes as you move in the tree. It
    is therefore necessary to some way figure out at date t: What are the future cash
    flows when you want to price the underlying bond at that date. We build a small
    class that contains this information, and use it, together with the term structures
    in the individual nodes, to find the bond price at each node. The value of the
    bond at the different nodes change because the term structure you use for discounting
    is changing. This bond price is then used to find the option value at each node.'
