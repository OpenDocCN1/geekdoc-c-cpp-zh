  md: 'The variance of the efficient portfolio is


    $$

    \sigma^2(r_p) = \frac{(E[r_p] - r_f)^2}{H}

    $$


    Note that standard deviation is a linear function of \(E[r_p]\). The efficient
    set is a line in mean-standard deviation space.


    # 6.8 Efficient sets with risk free assets.


    Suppose \(r_f < \frac{A}{C}\). Then the efficient set is the line from \((0, r_f)\)
    through tangency on the efficient set of risky assets.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_74_0.png)


    Suppose \(r_f > \frac{A}{C}\). Then the efficient set is the two half-lines starting
    from \((0, r_f)\).


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_74_1.png)


    If \(r_f = \frac{A}{C}\), the weight in the risk free asset is one. The risky
    portfolio is an zero investment portfolio. The efficient set consists of two asymptotes
    toward the efficient set of risky assets.'
