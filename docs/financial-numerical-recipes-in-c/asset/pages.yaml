    \ case\n\n\\( f(x) = c_{obs} - c_{BS}(\\sigma) \\)\n\nand, each new iteration\
    \ will calculate\n\n\\( \\sigma_{i+1} = \\sigma_i + \\frac{c_{obs} - c_{BS}(\\\
    sigma_i)}{\\frac{\\partial c_{BS}(\\sigma)}{\\partial \\sigma}} \\)\n\nC++ Code\
    \ 9.5 shows the calculation of implied volatility using Newton-Raphson.\n\n```\n\
    #include \"fin_recipes.h\"\n#include \"normdist.h\"\n#include <cmath>\n#include\
    \ <iostream>\n\ndouble option_price_implied_volatility_call_black_scholes_newton(const\
