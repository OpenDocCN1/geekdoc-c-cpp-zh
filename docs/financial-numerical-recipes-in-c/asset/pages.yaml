    # 14.5 Improving the efficiency in simulation


    There are a number of ways of "improving" the implementation of Monte Carlo estimation
    such that the estimate is closer to the true value.


    # 14.5.1 Control variates.


    One is the method of control variates. The idea is simple. When one generates
    the set of terminal values of the underlying security, one can value several derivatives
    using the same set of terminal values. What if one of the derivatives we value
    using the terminal values is one which we have an analytical solution to? For
    example, suppose we calculate the value of an at the money European call option
    using both the (analytical) Black Scholes formula and Monte Carlo simulation.
    If it turns out that the Monte Carlo estimate overvalues the option price, we
    think that this will also be the case for other derivatives valued using the same
    set of simulated terminal values. We therefore move the estimate of the price
    of the derivative of interest downwards.


    Thus, suppose we want to value an European put and we use the price of an at the
    money European call as the control variate. Using the same set of simulated terminal
    values \(S_{T,i}\), we estimate the two options using Monte Carlo as:


