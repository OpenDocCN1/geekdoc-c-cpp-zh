  md: 'it is necessary to make assumptions about the probability distribution of movements
    of the underlying security. We start by considering this in a particularly simple
    framework, the binomial assumption. The price of the underlying is currently $S_0$.
    The price can next period only take on two values, $S_u$ and $S_d$.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_83_0.png)


    If one can find all possible future “states,” an enumeration of all possibilities,
    one can value a security by constructing artificial “probabilities,” called “state
    price probabilities,” which one use to find an artificial expected value of the
    underlying security, which is then discounted at the risk free interest rate.
    The binomial framework is particularly simple, since there are only two possible
    states. If we find the “probability” q of one state, we also find the probability
    of the other as $(1-q)$. Equation 8.1 demonstrates this calculation for the underlying
    security.


    $S_0 = e^{-rT}(qS_u + (1-q)S_d)$ (8.1)


    Now, any derivative security based on this underlying security can be priced using
    the same “probability” q. The contribution of binomial option pricing is in actually
    calculating the number q. To do valuation, start by introducing constants u and
    d implicitly defined by $S_u = uS_0$ and $S_d = dS_0$, and you get a price process
    as illustrated in figure 8.1.


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_83_1.png)


    Figure 8.1: Binomial Tree


    and calculate the artifical “probability” q as


    $q = \frac{e^r - d}{u - d}$


    The price of a one-period call option in a binomial framework is shown in Formula
    8.1 and implemented in C++ Code 8.1.


    The “state price probability” q is found by an assumption of no arbitrage opportunities.
    If one has the possibility of trading in the underlying security and a risk free
    bond, it is possible to create a portfolio of these two assets that exactly duplicates
    the future payoffs of the derivative security. Since this portfolio has the same
    future payoff as the derivative, the price of the derivative has to equal the
    cost of the duplicating portfolio. Working out the algebra of this, one can find
    the expression for q as the function of the up and down movements u and d.


    # Exercise 8.1.


    The price of the underlying security follows the binomial process'
