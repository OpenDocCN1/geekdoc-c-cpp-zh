- pgno: 30
  md: '# ## 3.2.1 Internal rate of return.


    In addition to its role in simplifying present value calculations, the interest
    rate has some further use. The percentage return on an investment is a summary
    measure of the investment''s profitability. Saying that an investment earns 10%
    per year is a good way of summarizing the cash flows in a way that does not depend
    on the amount of the initial investment. The return is thus a relative measure
    of profitability.


    To estimate a return for a set of cash flows we calculate the internal rate of
    return. The internal rate of return for a set of cash flows is the interest rate
    that makes the present value of the cash flows equal to zero. When there is a
    uniquely defined internal rate of return we get a relative measure of the profitability
    of a set of cash flows, measured as a return, typically expressed as a percentage.
    Note some of the implicit assumptions made here. We assume that the same interest
    rate applies at all future dates (i.e. a flat term structure). The IRR method
    also assumes intermediate cash flows are reinvested at the internal rate of return.


    Suppose the cash flows are \(C_0, C_1, C_2, \dots C_T\). Finding an internal rate
    of return is finding a solution \(y\) of the equation


    ```

    \(\sum_{t=1}^T \frac{C_t}{(1+y)^t} - C_0 = 0\)

    ```


    Note that this is a polynomial equation, and as \(T\) becomes large, there in
    no way to find an explicit solution to the equation. It therefore needs to be
    solved numerically. For well behaved cash flows, where we know that there is one
    IRR, the method implemented in C++ Code 3.2 is suitable, it is an iterative process
    called bisection. It is an adaption of the bracketing approach discussed in (Press,
    Teukolsky, Vetterling, and Flannery, 1992, Chapter9),'
  merge: -1
  img_proc: true
