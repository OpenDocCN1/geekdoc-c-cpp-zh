    \ e^{-y t_i}\\)\nConvexity \\(Cx\\):\n\\(Cx = \\frac{1}{B_0} \\sum_i t_i^2 d_i\
    \ C_{t_i}\\)\n\\(Cx = \\frac{1}{B_0} \\sum_i t_i^2 e^{-r_{t_i} t_i} C_{t_i}\\\
    )\n\\(Cx = \\frac{1}{B_0} \\sum_i t_i^2 e^{-y t_i} C_{t_i}\\)\n\nFormula 5.1:\
