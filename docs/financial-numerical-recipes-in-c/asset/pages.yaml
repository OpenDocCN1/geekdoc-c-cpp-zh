  md: "# Chapter 2\n\n# Matrix Tools\n\nBeing computer literate entails being aware\
    \ of a number of computer tools and being able to choose the most suitable tool\
    \ for the problem at hand. Way to many people turns this around, and want to fit\
    \ any problem to the computer tool they know. A tool that very often is _the_\
    \ tool for business school students is a spreadsheet like _Excel_. Of course,\
    \ a spreadsheet is very useful for very many business applications. However, it\
    \ is not the best tool for more computationally intensive tasks.\n\nWhile the\
    \ bulk of the present book concerns itself with C++, in many applications in finance\
    \ a very handy tool is a language for manipulating vectors and matrices using\
    \ linear algebra. There are a lot of different possible programs that behaves\
    \ very similarly, with a syntax taken from the mathematical formulation of linear\
    \ algebra. An early tool of this sort was _matlab_, with a large number of programs\
    \ copying much of the syntax of this program. As a result of this there is a proliferation\
    \ of programs with similar syntax to Matlab doing similar analysis. General tools\
    \ include the commercial package Matlab sold by Mathworks, the public domain programs\
    \ octave and scilab. Tools that are similar, but more geared towards econometrics,\
    \ include Gauss, Ox and _S_ with its public domain \"clone\" R. As for what program\
    \ to install, there is no right answer. For the basic learning of how these tools\
    \ work, any of the mentioned packages will do the job. For students on a limited\
    \ budget the public domain tools octave, scilab and R are obvious candidates.\
    \ All of them perform the basic operations done by the commercial Matlab package,\
    \ and good for learning the basics of such a matrix tool.\n\nAll of these tools\
    \ are programs that lets the user manipulate vectors and matrices using very compact\
    \ notation. While compact notation is always prone to tense, making programs using\
    \ it unreadable, this is not such a large problem in Matlab, the notation tends\
    \ to be so close how a mathematician would write them that programs can be relatively\
    \ easy to follow. There are some pitfalls for the unwary user, in particular it\
    \ is easy to \"miss\" the difference between a command operating on a whole matrix\
