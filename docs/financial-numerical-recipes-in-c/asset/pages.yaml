  md: "# 4.1.3 Duration\n\nWhen holding a bond one would like to know how sensitive\
    \ the value of the bond is to changes in economic environment. The most relevant\
    \ piece of the economic environment is the current interest rate. An important\
    \ component of such calculation is the _duration_ of a bond. The duration of a\
    \ bond should be interpreted as the weighted average maturity of the bond, and\
    \ is calculated as\n\n\\(\\text{Duration}=\\frac{\\sum_t t \\frac{C_t}{(1+r)^t}}{\\\
    text{Bond Price}},\\)\n(4.3)\n\nwhere \\(C_t\\) is the cash flow in period \\\
    (t\\), and \\(r\\) the interest rate. Using the bond price calculated in equation\
    \ 4.1 we calculate duration as\n\n\\(D=\\frac{\\sum_t t \\frac{C_t}{(1+r)^t}}{\\\
    sum_t \\frac{C_t}{(1+r)^t}}\\)\n(4.4)\n\nwhich is shown in C++ Code 4.3.\n\n```\n\
    #include <cmath>\n#include <vector>\nusing namespace std;\n\ndouble bonds.duration.discrete(const\
    \ vector<double>& times,\n const vector<double>& cashflows,\n const double& r)\
    \ {\n double B=0;\n double D=0;\n for (int i=0;i<times.size();++i){\n B += times[i]\
    \ * cashflows[i] / pow(1+r,times[i]);\n D += cashflows[i] / pow(1+r,times[i]);\n\
    \ };\n return D/B;\n };\n```\n\nC++ Code 4.3: Bond duration using discrete, annual\
    \ compounding and a flat term structure\n\nAn alternative approach to calculating\
    \ duration is calculate the yield to maturity \\(y\\) for the bond, and use that\
    \ in estimating the bond price. This is called _Macaulay Duration_. First one\
    \ calculates \\(y\\), the yield to maturity, from\n\n\\(\\text{Bond price}=\\\
    sum_{t=1}^T \\frac{C_t}{(1+y)^t}\\)\n\nand then use this \\(y\\) in the duration\
    \ calculation:\n\n\\(\\text{Macaulay duration}=\\frac{\\sum_t t \\frac{C_t}{(1+y)^t}}{\\\
    sum_t \\frac{C_t}{(1+y)^t}}\\)\n(4.5)\n\nC++ Code 4.4 implements this calculation.\n\
    \nNote though, that in the present case, with a flat term structure, these should\
    \ produce the same number. If the bond is priced correctly, the yield to maturity\
    \ must equal the current interest rate. If \\(r=y\\) the two calculations in equations\
    \ (4.4) and (4.5) obviously produces the same number.\n\n# Example\n\nA 3 year\
    \ bond with a face value of $100 makes annual coupon payments of 10%. The current\
    \ interest rate (with annual compounding) is 9%."
