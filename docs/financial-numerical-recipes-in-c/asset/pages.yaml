  md: '# Chapter 8


    # Binomial option pricing


    # Contents


    | 8.1 Options | 82 |

    | 8.2 Pricing | 82 |

    | 8.3 Multiperiod binomial pricing | 85 |


    # 8.1 Options


    Option and other derivative pricing is one of the prime “success stories” of modern
    finance. An option is a derivative security, the cash flows from the security
    is a function of the price of some *other* security, typically called the underlying
    security. A call option is a right, but not obligation, to buy a given quantity
    of the underlying security at a given price, called the exercise price $K$, within
    a certain time interval. A put option is the right, but not obligation, to *sell*
    a given quantity of the underlying security to an agreed exercise price within
    a given time interval. If an option can only be exercised (used) at a given date
    (the time interval is one day), the option is called a European Option. If the
    option can be used in a whole time period up to a given date, the option is called
    American.


    ```

    $C_T = \max(0, S_T - K)$

    $P_T = \max(0, K - S_T)$

    ```


    The challenge of option pricing is to determine the option premia $C_0$ (call
    price) and $P_0$ (put price).


    # 8.2 Pricing


    All pricing uses that the cashflows from the derivative is a direct function of
    the price of the underlying security. Pricing can therefore be done *relative*
    to the price of the underlying security. To price options'
