- pgno: 7
  md: '# 1.2.3 Functions and libraries


    In addition to the basic mathematical operations there is a large number of additional
    operations that can be performed on any type. However, these are not parts of
    the core language, they are implemented as standalone functions (most of which
    are actually written in C or C++). These functions are included in the large library
    that comes with any C++ installation. Since they are not part of the core language
    they must be defined to the compiler before they can be used. Such definitions
    are performed by means of the include statement.


    For example, the mathematical operations of taking powers and performing exponentiation
    are defined in the mathematical library cmath. In the C++ program one will write


    ```

    #include <cmath>

    ```


    cmath is actually a file with a large number of function definitions, among which
    one finds pow(x,n) which calculates x^n, and exp(r) which calculates e^r. The
    following programming stub calculates a = 2^2 and b = e^1.


    ```

    #include <cmath>

    double a = pow(2,2);

    double b = exp(1);

    ```


    which will give the variables a and b values of 4 and 2.718281828..., respectively.


    # 1.2.4 Templates and libraries


    The use of libraries is not only limited to functions. Also included in the standard
    library is generic data structures, which can be used on any data type. The example
    we will be considering the most is the vector<>, which defines an array, or vector
    of variables.


    ```

    #include <vector>

    vector<double> M(2);

    M[0]=1.0;

    M[1]=2.0;

    M.push_back(3);

    ```


    This example defines an array with three elements of type double


    ![](img/f93b3f3a5d69957a07ff6e28c47bacdd_7_0.png)


    Note some peculiarities here. When first defining the vector with the statement


    ```

    vector<double> M(2);

    ```


    we defined an array of 2 elements of type double, which we then proceeded to fill
    with the values 1 and 2. When filling the array we addressed each element directly.
    Note that in the statement


    ```

    M[0]=1.0;

    ```


    lies one of the prime traps for programmers coming to C or C++ from another language.
    Indexing of arrays starts at zero, not at one. M[0] really means the first element
    of the array.


    The last statement,'
