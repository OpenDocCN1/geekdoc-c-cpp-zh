- pgno: 70
  md: '# Differentiate


    $$

    \frac{\partial L}{\partial w} = \mathbf{w}''\mathbf{V} - \lambda \mathbf{e}''
    - \gamma \mathbf{1}'' = 0

    $$


    $$

    \frac{\partial L}{\partial \lambda} = E[r_p] - \mathbf{w}''\mathbf{e} = 0

    $$


    $$

    \frac{\partial L}{\partial \gamma} = 1 - \mathbf{w}''\mathbf{1} = 0

    $$


    Rewrite conditions above as (note that this requires the invertibility of V.


    $$

    \mathbf{w}'' = \lambda \mathbf{e}'' \mathbf{V}^{-1} - \gamma \mathbf{1}'' \mathbf{V}^{-1}
    \tag{6.1}

    $$


    $$

    \mathbf{w}''\mathbf{e} = E[r_p] \tag{6.2}

    $$


    $$

    \mathbf{w}''\mathbf{1} = 1 \tag{6.3}

    $$


    Post-multiply equation (6.1) with e and recognise the expression for \( E[r_p]
    \) in the second equation


    $$

    \mathbf{w}''\mathbf{e} = \lambda \mathbf{e}'' \mathbf{V}^{-1} \mathbf{e} + \gamma
    \mathbf{1}'' \mathbf{V}^{-1} \mathbf{e}

    $$


    Similarly post-multiply equation (6.1) with 1 and recognise the expression for
    1 in the third equation


    $$

    \mathbf{w}''\mathbf{1} = 1 = \lambda \mathbf{e}'' \mathbf{V}^{-1} \mathbf{1} +
    \gamma \mathbf{1}'' \mathbf{V}^{-1} \mathbf{1}

    $$


    With the definitions of A, B, C and D above, this becomes the following system
    of equations


    $$

    \left\{\begin{array}{l l }

    E[r_p] = \lambda B + \gamma A \\

    1 = \lambda A + \gamma C

    \end{array}\right.

    $$


    Solving for \(\lambda\) and \(\gamma\), get


    $$

    \gamma = \frac{B - A E[r_p]}{D}

    $$


    $$

    \lambda = \frac{C E[r_p] - A}{D}

    $$


    Plug in expressions for \(\lambda\) and \(\gamma\) into equation (6.1) above,
    and get


    $$

    \mathbf{w}'' = \frac{1}{D} \left( B \mathbf{1}'' - A \mathbf{e}'' \right) \mathbf{V}^{-1}
    + \frac{1}{D} \left( C \mathbf{e}'' - A \mathbf{1}'' \right) \mathbf{V}^{-1} E[r_p]
    = \mathbf{g} + h E[r_p]

    $$


    The portfolio defined by weights g is a portfolio with expected return 0. The
    portfolio defined by weights \( (\mathbf{g} + \mathbf{h}) \) is a portfolio with
    expected return 1. This implies the useful property that \(\mathbf{g}''\mathbf{1}
    = 1\), and \(\mathbf{h}''\mathbf{1} = 0\).


    # Example


    An investor can invest in three assets with expected returns and variances as
    specified in the following table.


    | t | Asset | E[r] | \(\sigma^2(r)\) |

    |---|---|---|---|

    | 1 | | 10% | 0.20 |

    | 2 | | 11.5% | 0.10 |

    | 3 | | 8% | 0.15 |


    The three assets are independent (uncorrelated).


    +   1. What are the weights of the minimum variance portfolio with mean 9%?'
