  md: "# 9.3.3 Implied Volatility.\n\nIn calculation of the option pricing formulas,\
    \ in particular the Black Scholes formula, the only unknown is the standard deviation\
    \ of the underlying stock. A common problem in option pricing is to find the implied\
    \ volatility, given the observed price quoted in the market. For example, given\
    \ \\(c_0\\), the price of a call option, the following equation should be solved\
    \ for the value of \\(\\sigma\\):\n\n\\(c_0 = c(S, K, r, \\sigma, T - t)\\)\n\n\
    Unfortunately, this equation has no closed form solution, which means the equation\
    \ must be numerically solved to find \\(\\sigma\\). What is probably the algorithmic\
    \ simplest way to solve this is to use a binomial search algorithm, which is implemented\
    \ in C++ Code 9.4. We start by bracketing the sigma by finding a high sigma that\
    \ makes the BS price higher than the observed price, and then, given the bracketing\
    \ interval, we search for the volatility in a systematic way. shows such a calculation.\n\
    \n```\n#include <cmath>\n#include \"fin_recipes.h\"\n\ndouble option_price_implied_volatility_call_black_scholes_bisections(const\
    \ double& S,\n        const double& K,\n        const double& r,\n        const\
    \ double& time,\n        const double& option_price){\n    if (option_price<0.99*(S-K*exp(-time*r)))\
    \ { // check for arbitrage violations\n        return 0.0;\n        // Option\
    \ price is too low if this happens\n    };\n    // simple binomial search for\
    \ the implied volatility.\n    // relies on the value of the option increasing\
    \ in volatility\n    const double ACCURACY = 1.0e-5; // make this smaller for\
    \ higher accuracy\n    const int MAX_ITERATIONS = 100;\n    const double HIGH_VALUE\
    \ = 1e10;\n    const double ERROR = -1e40;\n    // want to bracket sigma, first\
    \ find a maximum sigma by finding a sigma\n    // with a estimated price higher\
    \ than the actual price.\n    double sigma_low=1e-5;\n    double sigma_high=0.3;\n\
    \    double sigma=option_price_call_black_scholes(S,K,r,sigma_high,time);\n  \
    \  while (price < option_price){\n        sigma_high = 2.0 * sigma.high; // keep\
    \ doubling.\n        sigma = option_price_call_black_scholes(S,K,r,sigma_high,time);\n\
    \        if (sigma.high>HIGH_VALUE) return ERROR; // panic, something wrong.\n\
    \    }\n    for (int i=0;i<MAX_ITERATIONS;++i){\n        double sigma = (sigma_low+sigma_high)*0.5;\n\
    \        price = option_price_call_black_scholes(S,K,r,sigma,time);\n        double\
    \ test = (price-option_price);\n        if (fabs(test)<ACCURACY) { return sigma;\
    \ };\n        if (test < 0.0) { sigma_low = sigma; }\n        else { sigma_high\
    \ = sigma; }\n    };\n    return ERROR;\n}\n```\n\nC++ Code 9.4: Calculation of\
    \ implied volatility of Black Scholes using bisections\n\nInstead of this simple\
    \ bracketing, which is actually pretty fast, and will (almost) always find the\
    \ solution, we can use the Newton–Raphson formula for finding the root of an equation\
    \ in a single variable. The general description of this method starts with a function\
    \ \\(f()\\) for which we want to find a root.\n\n\\(f(x) = 0.\\)"
