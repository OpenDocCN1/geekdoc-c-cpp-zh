- pgno: 23
  md: 'Consider the linear equation


    3x_1 + 4x_2 = 5

    4x_1 + 6x_2 = 8


    Write this in matrix form by defining


    A = [ 3 4 ; 4 6 ]


    b = [ 5 ; 8 ]


    Let us first check that this system is solvable


    ```

    >> A = [3 4; 6]

    A =

    3 4

    4 6

    ```


    ```

    >> b=[5;8]

    b =

    5

    8

    ```


    ```

    >> rank(A)

    ans =

    2

    ```


    ```

    >> rank([A b])

    ans =

    2

    ```


    Note how to create the augmented matrix [A|b] by [A b]. The rank of the two is
    the same. Since A is square, we can calculate the solution as


    ```

    >> inverse(A)

    ans =

    3.0000 -2.0000

    -2.0000 1.5000

    ```


    ```

    >> x = inverse(A) * b

    x =

    -1

    2

    ```


    The solution to the system of equations is


    x = [ -1 ; 2 ]


    In this case we calculated the solution by finding the inverse. But you should
    be aware that solving the system of equations by calculation of the inverse is
    not the numerically most stable way of doing the calculation. Matlab has built
    in a direct linear matrix solver, which is invoked by the left division operator


    ```

    >> x = A\b

    x =

    -1

    2

    ```'
