    # The Mean Variance Frontier


    # Contents


    +   6.1 Setup .................................................... 67

    +   6.2 The minimum variance frontier ........................ 69

    +   6.3 Calculation of frontier portfolios ................... 69

    +   6.4 The global minimum variance portfolio ................ 72

    +   6.5 Efficient portfolios ................................... 72

    +   6.6 The zero beta portfolio ................................ 73

    +   6.7 Allowing for a riskless asset .......................... 73

    +   6.8 Efficient sets with risk free assets ................... 74

    +   6.9 Short-sale constraints ................................. 75

    +   6.10 The Sharpe Ratio ...................................... 75

    +   6.11 Equilibrium: CAPM ..................................... 76

    +     6.11.1 Treynor ........................................... 76

    +     6.11.2 Jensen ............................................ 76

    +   6.12 Working with Mean Variance and CAPM ................. 76

    +   6.13 Mean variance analysis using matrix libraries ....... 77


    We now discuss a classical topic in finance, mean variance analysis. This leads
    to ways of accounting for the riskiness of cashflows.


    Mean variance analysis concerns investors choices between portfolios of risky
    assets, and how an investor chooses portfolio weights. Let r_p be a portfolio
    return. We assume that investors preferences over portfolios p satisfy a mean
    variance utility representation, u(p) = u(E[r_p], \sigma(r_p)), with utility increasing
    in expected return (\partial u / \partial E[r_p] > 0) and decreasing in variance
    (\partial u / \partial \text{var}(r_p) < 0). In this part we consider the representation
    of the portfolio opportunity set of such decision makers. There are a number of
    useful properties of this opportunity set which follows purely from the mathematical
    formulation of the optimization problem. It is these properties we focus on here.


    # 6.1 Setup


    We assume there exists n \ge 2 risky securities, with expected returns e


    ```

    e = \begin{bmatrix} E[r_1] \\ E[r_2] \\ \vdots \\ E[r_n] \end{bmatrix}

    ```'
