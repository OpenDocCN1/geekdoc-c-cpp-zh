    \ the parameterization shown in FormulaRefns\n\n```\nr(t) = \\beta_0 + (\\beta_1\
    \ + \\beta_2) \\left[ \\frac{1 - e^{-\\frac{t}{\\lambda}}}{\\frac{t}{\\lambda}}\
    \ \\right] + \\beta_2 \\left[ e^{-\\frac{t}{\\lambda}} \\right]\n```\n\nNotation:\
    \ t: Time to maturity. r spot interest rate, \\beta_0, \\beta_1, \\beta_2 and\
