- pgno: 52
  md: 'In this chapter we first show that this approximation of the discount factors
    can be done in either terms of discount factors directly, interest rates, or forward
    rates. Either of these are useful ways of formulating a term structure, and either
    of them can be used, since there are one to one transformations between either
    of these three. We then go on to demonstrate how a feature of C++, the ability
    to create an abstract datatype as an object, or class, is very useful for the
    particular application of defining and using a term structure. It is in fact this
    particular application, to create a term structure class, which really illustrates
    the power of C++, and why you want to use an object oriented language instead
    of classical langues like FORTRAN and C, or matrix languages like Gauss or Matlab
    for many financial calculations.


    # 5.1 The interchangeability of discount factors, spot interest rates and forward
    interest rates


    The term structure can be specified in terms of either discount factors, spot
    interest rates or forward interest rates. A discount factor is the current price
    for a future (time t) payment of one dollar. To find the current value PV of a
    cash flow Ct, we calculate PV = d_t C_t. This discount factor can also be specified
    in terms of interest rates, where we let r_t be the relevant interest rate (spot
    rate) for discounting a t-period cashflow. Then we know that the present value
    PV = e^{-r_t t} C_t. Since these two methods of calculating the present value
    must be consistent,


    ```

    PV = d_t C_t = e^{-r_t t} C_t

    ```


    and hence


    ```

    d_t = e^{-r_t t}

    ```


    Note that this equation calculates d_t given r_t. Rearranging this equation we
    find the spot rate r_t in terms of discount factors


    ```

    r_t = \frac{-\ln(d_t)}{t}

    ```


    An alternative concept that is very useful is a forward interest rate, the yield
    on borrowing at some future date t_1 and repaying it at a later date t_2. Let
    f_{t_1, t_2} be this interest rate. If we invest one dollar today, at the current
    spot rate spot rate till period t_1 and the forward rate for the period from t_1
    to t_2 (which is what you would have to do to make an actual investment), you
    would get the following future value


    ```

    FV = e^{r_{t_1} t_1} e^{f_{t_1, t_2} (t_2 - t_1)}

    ```


    The present value of this forward value using the time t_2 discount factor has
    to equal one:


    ```

    d_{t_2} FV = 1

    ```


    These considerations are enough to calculate the relevant transforms. The forward
    rate for borrowing at time t_1 for delivery at time t_2 is calculated as


    ```

    f_{t_1, t_2} = \frac{-\ln\left(\frac{d_{t_2}}{d_{t_1}}\right)}{t_2 - t_1} = \frac{\ln\left(\frac{d_{t_1}}{d_{t_2}}\right)}{t_2
    - t_1}

    ```


    The forward rate can be also calculated directly from yields as


    ```

    f_{t_1, t_2} = r_{t_2} \frac{t_2}{t_2 - t_1} - r_{t_1} \frac{t_1}{t_2 - t_1}

    ```'
