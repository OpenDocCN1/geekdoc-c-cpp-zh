  \ 编写一个程序，告知元音数量。\n\n**3.** 将交替字符转换为大写。\n\n**4.** 你的程序应该有四个对象。\n\n**5.** 编写一个程序显示字符串中\
  \ 'a' 的出现次数。17. 动态数组类\n\n与静态数组不同，动态数组为程序员提供了在未知确切大小的情况下存储数据的灵活性。由于这是经常需要的，标准模板库\
  \ (STL) 以 `vector` 类的形式提供了现成的解决方案。在本节中，你学习\n\n![Image](img/square.jpg) `vector`\
  \ 的特性\n\n![Image](img/square.jpg) 典型的 `vector` 操作\n\n![Image](img/square.jpg) 的大小和容量的概念\n\
  \n![Image](img/square.jpg) STL `deque` 类\n\n### `std::vector` 的特性\n\n`vector` 是一个模板类，提供了动态数组的通用功能并具有以下特点：\n\
  \n![Image](img/square.jpg) 常数时间内向数组末尾添加元素；这意味着插入所需取决于数组的大小。从末尾删除元素也是如此。\n\n![Image](img/square.jpg)\
  \ 在中间插入或删除元素的时间与后面的元素数量成正比。\n\n![Image](img/square.jpg) 持有的元素数量是动态的，由 `vector` 类管理内存。\n\
  \n*vector* 可以可视如图 17.1](#ch17.html_ch17fig01）所示。\n\n![Image](img/17fig01.jpg)\n\n\
  **图 17.1** vector 的内部结构\n\n* * *\n\n**提示**\n\n使用 `std::vector` 类包含头文件：\n\n```\n\
  #include <vector>\n```\n\n* * *\n\n### 典型的 vector 操作\n\n`vector` 的行为规范和公共成员由 C++\
  \ 标准定义。因此，你在本节中学习的 `vector` 操作由各种标准的 C++ 平台支持。\n\n#### 实例化 Vector\n\n`vector` 是一个模板类，需要按照第\
  \ 14 节](#ch14.html_ch14)“宏与模板简介](#ch14.html_ch14)”涵盖的模板实例化技术进行实例化。`vector` 的模板实例化需要指定你想在这个动态数组中收集的对象类型。\n\
  \n点击此处查看代码图像\n\n```\nstd::vector<int> dynIntArray; // 包含整数的 vector\nstd::vector<float>\
  \ dynFloatArray; // 包含浮点数的 vector\nstd::vector<Tuna> dynTunaArray; // 包含金枪的 vector\n\
  ```\n\n要声明一个指向列表中元素的迭代器，你会使用\n\n\n\n\n\n点击此处查看代码图像\n\n`std::vector<int>::const_iterator\
  \ elementInVec;`\n\n如果你需要一个可以修改值或调用非 `const` 函数的迭代器，你应该使用 `iterator` 而不是 `const_iterator`。\n\
  \n鉴于 `std::vector` 有几个重载的构造函数，你还可以选择在实例化 vector 时告诉它初始时应包含的元素数量及其初始值，或者在实例化另一个 vector\
  \ 时使用一个 vector 的部分或全部。\n\n列表 17.1 展示了几个 vector 的实例化方式。\n\n**列表 17.1** 实例化 `std::vector:`\
  \ 的不同形式：指定大小、初始值以及从另一个向量拷贝值\n\n点击此处查看代码图像\n\n```cpp\n#include <vector>\n\nint main\
  \ ()\n{\n    // 整数类型的 vector\n    std::vector<int> integers;\n\n    // 使用 C++11\
  \ 列表初始化化的 vector\n    std::vector<int> initVector{ 202, 2017, -1 };\n\n    // 实例化一个包含\
  \ 10 个元素的 vector（它仍然可以增长）\n    std::vector<int> tenElements (10);\n\n    // 实例化一个包含\
  \ 10 个元素的 vector，每个元素初始化为 90\n    std::vector<int> tenElemInit (10, 90);\n\n   \
  \ // 将 vector 初始化为另一个 vector 的内容\n    std::vector<int> copyVector (tenElemInit);\n\
  \n    // 使用迭代器从另一个 vector 初始化为 5 个元素的 vector\n    std::vector<int> partialCopy (tenElements.cbegin(),\n\
  \                                  tenElements.cbegin() + 5);\n\n    return 0;\n\
  }\n```\n\n分析：前面的代码针对 `int` 类型对 `vector` 类进行了模板特化化；换句话说，它实例化了一个整数 `vector`。这个名为 `integers`\
  \ 的 `vector` 使用了第 5 行的默认构造函数，这在你不知道容器的最小大小需求时非常有用——即当你不知道想在其中存储多少个整数时。第 8 行所示的第二实例化形式使用了\
  \ C++11 引入的列表初始化概念，用三个包含值 202、2017 和 –1 的元素来初始化 `initVector`。第 11 行和第 14 行所示的 `vector`\
  \ 实例化是程序员知道自己需要一个至少包含 10 个元素的 `vector`。注意，这并不会限制容器的最终 `size`，而只是设置了初始 `size`。最后，第\
  \ 17 行和第 20 行演示了如何使用 `vector` 来实例化另一个向量的内容——换句话说，创建一个另一个拷贝或其部分的 `vector` 对象。这种构造也适用于所有的\
  \ STL 容器。最后一种形式是使用迭代器。`partialCopy` 包含了来自 `vecWithTenElements` 的前五个元素。\n\n注意：第四种构造仅适用于相同类型的对象。因此，你可以实例化一个\
  \ `vecArrayCopy`——使用另一个整数对象的 `vector` 来实例化一个整数对象的 `vector`。如果其中一个是例如 `float` 类型的\
  \ `vector`，则代码将无法编译。\n\n### 使用 `push_back()` 在末尾插入元素\n\n实例化一个整数 `vector` 后，显而易见的任务是向其中插入元素（整数）。在\
  \ `vector` 中的插入发生在数组的末尾，并使用成员函数 `push_back()` 将元素“推”入末部：\n\n点击此处查看代码图像\n\n```cpp\n\
  vector <int> integers;  // 一个 int 类型的 vector\n\n// 向 vector 插入示例整数：\nintegers.push_back\
  \ (50);\nintegers.push_back (1);\n```\n\n列表 17.2 展示了在向 `std::vector` 动态添加元素时使用 `push_back()`。\n\
  \n**列表 17.2** 使用 `push_back()` 在 Vector 中插入元素\n\n点击此处查看代码图像\n\n```cpp\n#include\
  \ <iostream>\n#include <vector>\nusing namespace std;\n\nint main ()\n{\n    vector<int>\
  \ integers;\n\n    // 向 vector 插入示例整数：\n    integers.push_back (50);\n    integers.push_back\
  \ (1);\n    integers.push_back (987);\n    integers.push_back (1001);\n\n    cout\
  \ << \"The vector contains \";\n    cout << integers.size () << \" Elements\" <<\
  \ endl;\n\n    return 0;\n}\n```\n\n输出：点击此处查看代码图像\nThe vector contains 4 Elements\n\
  \n分析：如第 9-12 行所示，`push_back()` 是 `vector` 公共成员函数，用于在动态数组的末尾插入对象。注意函数 `size()` 的用法，它返回\
  \ `vector` 中的元素个数。\n\n### 列表初始化\n\nC++11 通过类 `std::initialize_list` 提供了初始化列表特性，这种功能允许你像初始化静态数组一样初始化容器。`std::vector`\
  \ 像大多数容器一样支持这种特性，让你在一行内初始化一个包含多个元素的 vector：\n\n```cpp\nvector<int> integers = {50,\
  \ 1, 987, 1001};\n```\n\n这种语法在列表 17.2 中减少了行数。\n\n### 使用 `insert()` 在指定位置插入元素\n\n\
  你使用 `push_back()` 在 vector 的末尾插入元素。如果你想在中间插入呢？许多 STL 容器（包括 `std::vector`）都具有 `insert()`\
  \ 函数，它有许多重载。\n\n在一种形式中，你可以指定插入元素的位置：\n\n```cpp\nintegers.insert (integers.begin(),\
  \ 25);\n```\n\n在另一种形式中，你可以同时指定位置以及需要插入的元素个数及其值：\n\n```cpp\nintegers.insert (integers.end(),\
  \ 2, 45);\n```\n\n你还可以将一个 vector 的内容在指定位置插入另一个：\n\n```cpp\n// 另一个包含 2 个 30 元素的 vector\n\
  vector <int> another (2, 30);\n\n// 在位置 [1] 插入另一个的所有元素\nintegers.insert (integers.begin()\
