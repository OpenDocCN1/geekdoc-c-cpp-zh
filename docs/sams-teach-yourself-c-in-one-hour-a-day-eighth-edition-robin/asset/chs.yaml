  ```\n\n你会使用哪种强制转换来获取一个指向此 `Tuna` 类型对象的 `Tuna*` 指针？请用代码演示。\n\n## 第 14 节 宏与模板简介\n\n\
  到现在，你应该对基础 C++ 语法有了固定的理解。用 C++ 编写的程序应该是易理解的，你已经准备好学习帮助你高效编写应用程序的语言特征。\n\n在本节中，你将学习：\n\
  \n- ![Image](img/square.jpg) 预处理器简介\n- ![Image](img/square.jpg) `#define` 关键字和宏\n\
  - ![Image](img/square.jpg) 模板简介\n- ![Image](img/square.jpg) 如何编写模板函数和类\n- ![Image](img/square.jpg)\
  \ 宏与模板的区别\n- ![Image](img/square.jpg) 如何使用 C++11 引入的 `static_assert` 进行检查\n\n##\
  \ 预处理器编译器\n\n到现在，你应该对基础 C++ 语法有了固定的理解。用 C++ 编写的程序应该是易理解的，你已经准备好学习帮助你高效编写应用程序的语言特征。\n\
  \n预处理器正如其名，是在编译器开始之前运行的。预处理器指令的特征是它们都以 `#` 开头。例如：\n\n```\n#include <iostream>\n\
  ```\n\n预处理器主要关注代码中的两种预处理器指令：一种使用 `#define` 定义常量，另一种使用 `#define` 定义函数。无论这些指令扮演什么角色，它们都告诉预处理器替换标识符。\n\
  \n### 注意\n\n宏也是关于文本替换。预处理器除了原地替换标识符之外不做任何事情。\n\n### 使用 #define 定义常量\n\n使用 `#define`\
  \ 定义量的语法非常简单：\n\n`#define 标识符 值`\n\n例如，替换为 25 的常量 `ARRAY_LENGTH` 如下：\n\n```cpp\n\
  #define ARRAY_LENGTH 25\n```\n\n每当预处理器遇到文本 `ARRAY_LENGTH` 时，该标识符现在会被替换为 25：\n\n\
  ```cpp\nint numbers [ARRAY_LENGTH] = {0};\n```\n\n预处理器运行后，这三个对编译器可见的内容：\n\n```cpp\n\
  int numbers [25] = {0};\ndouble radiuses [25] = {0.0};\nstd::string names [25];\n\
  ```\n\n替换适用于代码的每个部分，包括这样的 `for` 循环：\n\n```cpp\nfor(int index = 0; index < ARRAY_LENGTH;\
  \ ++index)\n    numbers[index] = index;\n```\n\n这个 `for` 循环对编译器可见的内容：\n\n```cpp\n\
  for(int index = 0; index < 25; ++index)\n    numbers[index] = index;\n```\n\n要确切了解这样一个宏是如何工作的，请查看\
  \ 列表 14.1。\n\n\n\n\n\n```cpp\n14:    cout << \"Enter a radius: \";\n15:    MY_DOUBLE\
  \ radius = 0;\n16:    cin >> radius;\n17:    cout << \"Area is: \" << PI * radius\
  \ * radius << endl;\n19:    string favoriteWhisky (FAV_WHISKY);\n20:    cout <<\
  \ \"My favorite drink is: \" << FAV_WHISKY << endl;\n22:    return 0;\n23: }\n```\n\
  \nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nArray’s length: 25\nEnter a radius:\
  \ 2.1569\nArea is: 14.7154\nMy favorite drink is: Jack Daniels\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n`ARRAY_LENGTH`, `PI`， `MY_DOUBLE` 和 `FAV_WHISKY` 分别是第 4 到第 7 行定义的四个宏常量。如你所见，`ARRAY_LENGTH`\
  \ 用于第 11 行定义数组的长度，这通过第 12 行使用运算符 `sizeof()` 得到了间接确认。`MY_DOUBLE` 用于在第 15 行声明一个类型为\
  \ `double` 的变量 `radius`，而 `PI` 用于在第 17 行计算圆面积。最后，`FAV_WHISKY` 用于第 19 行初始化一个 `std::string`\
  \ 对象，并直接用于第 20 行的 `cout` 语句。所有这些实例展示了预处理器是如何简单地进行文本替换的。\n\n这种“愚笨”的文本替换似乎在 列表 14.1\
  \ 中找到了无处不在的应用，但它也有缺点。\n\n### 提示\n\n由于预处理器进行的是愚笨文本替换，它并不检查替换的正确性（但编译器总是会检查）。你可以像这样在\
  \ 列表 14.1 的第 7 行中定义 `FAV_WHISKY`：\n\n点击此处查看代码图像\n\n```cpp\n#define FAV_WHISKY 42\
  \ // \"Jack Daniels\"\n```\n\n这会导致第 19 行的 `std::string` 实例化出现编译错误，但在没有它的情况下，编译器将继续并打印以下内容：\n\
  \nMy favorite drink is: 42\n\n这显然是不合逻辑的，而且重要的是它在未被察觉的情况下就通过了。此外，你对宏定义的常量 `PI` 没有太大的控制权：它是\
  \ `double` 还是 `float`？答案是两者都不是。对于预处理器来说，`PI` 只是一个文本替换元素“3.1416”。它从未是一个被定义过的数据类型。\n\
  \n常量使用 `const` 关键字配合数据类型定义会更好。因此，这样好得多：\n\n点击此处查看代码图像\n\n```cpp\nconst int ARRAY_LENGTH\
  \ = 25;\nconst double PI = 3.1416;\nconst char* FAV_WHISKY = \"Jack Daniels\";\n\
  typedef double MY_DOUBLE; // typedef 为类型创建别名\n```\n\n### 使用宏防止多次包含\n\nC++ 程序员通常在名为头文件（header\
  \ files）的 .H 文件声明类和函数。相应的函数定义在 .CPP 文件中，这些文件通过 `#include<header>` 预处理器指令包含头文件。如果一个头文件——我们称其为\
  \ `class1.h`——声明了一个类，该类将另一个在 `class2.h` 中声明的类作为成员，那么 `class1.h` 需要包含 `class2.h`。如果设计很复杂，且另一个类也需要前者，那么\
  \ `class2.h` 也会包含 `class1.h`！\n\n然而对于预处理器来说，两个相互包含的头文件是一个具有递归性质的问题。为了避免这个问题，你可以结合预处理器指令\
  \ `#ifndef` 和 `#endif` 使用宏。\n\n包含 `<header2.h>` 的 `header1.h` 如下所示：\n\n点击此处查看代码图像\n\
  \n```cpp\n#ifndef HEADER1_H_ // 多重包含保护符（multiple inclusion guard）:\n#define HEADER1_H_\
  \ // 预处理器只会读取此行及后续行\n#include <header2.h>\nclass Class1\n{\n   // 类成员\n};\n#endif\
  \  // header1.h 的结束\n```\n\n`header2.h` 类似类似，但使用了不同的宏定义并包含了 `<header1.h>`：\n\n点击此处查看代码图像\n\
  \n```cpp\n#ifndef HEADER2_H_// 多重包含保护符\n#define HEADER2_H_\n#include <header1.h>\n\
  class Class2\n{\n   // 类成员\n};\n#endif // header2.h 的结束\n```\n\n### 注意\n\n`#ifndef`\
  \ 可以被读为“如果未定义”（if-not-defined）。这是一种条件处理，指示预处理器只有在标识符未定义时才继续。`#endif` 标记了这种条件处理的结束。\n\
  \n因此，当预处理器第一次运行进入 `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入\
  \ `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h`\
  \ 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h` 并遇到 `#ifndef`\
  \ 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_`\
  \ 尚未定义并继续执行。由此，当预处理器进入 `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入\
  \ `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h`\
  \ 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h` 并遇到 `#ifndef`\
  \ 时，它注意到宏 `HEADER1_H_` 尚未定义并继续执行。由此，当预处理器进入 `header1.h` 并遇到 `#ifndef` 时，它注意到宏 `HEADER1_H_`\
