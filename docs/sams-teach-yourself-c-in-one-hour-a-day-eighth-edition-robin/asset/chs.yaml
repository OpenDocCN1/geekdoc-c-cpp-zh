  \ `string` 的内容。\n\n### 提示\n你可以通过使用关键字 `auto` 来避免第 24 行中看到的繁琐的迭代器声明，从而告诉编译器使用 `std::string::cbegin()`\
  \ 的返回值来确定 `charLocator` 的类型，如下所示：\n\n点击此处查看代码图片\n\n```\n24: // delete line: string::const_iterator\
  \ charLocator;\n25: for (auto charLocator = stlString.cbegin();\n26:      charLocator\
  \ != stlString.cend();\n27:      ++ charLocator )\n28: {\n29:    cout << \"Character\
  \ [\"<<charOffset++ << \"] is: \";\n30:    cout << *charLocator << endl;\n31: }\n\
  ```\n\n### 将一个字符串拼接到另一个字符串\n字符串拼接可以使用 `+=` 操作符或 `append()` 成员函数来实现：\n\n点击此处查看代码图片\n\
  \n```cpp\nstring sampleStr1 (\"Hello\");\nstring sampleStr2 (\" String! \");\nsampleStr1\
  \ += sampleStr2;   // 使用 std::string::operator+=\n// 或者使用 std::string::append()\n\
  sampleStr1.append (sampleStr2);  // (针对 char* 也进行了重载)\n```\n\n`Listing 16.3` 展示了这两种变体的用法。\n\
  \n**列表 16.3** 使用相加赋值符 (`+=`) 或 `append()` 拼接字符串\n\n点击此处查看代码图片\n\n```cpp\n0: #include\
  \ <string>\n1: #include <iostream>\n2:\n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6:\n7:     string sampleStr1 (\"Hello\");\n8:     string sampleStr2 (\"\
  \ String!\");\n9:\n10:     // 拼接\n11:     sampleStr1 += sampleStr2;\n12:     cout\
  \ << sampleStr1 << endl << endl;\n13:\n14:     string sampleStr3 (\" Fun is not\
  \ needing to use pointers!\");\n15:     sampleStr1.append (sampleStr3);\n16:   \
  \  cout << sampleStr1 << endl << endl;\n17:\n18:     const char* constCStyleString\
  \ = \" You however still can!\";\n19:     sampleStr1.append (constCStyleString);\n\
  20:     cout << sampleStr1 << endl;\n21:\n22:     return 0;\n23: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\n```\nHello String!\nHello String! Fun is not needing to use pointers!\n\
  Hello String! Fun is not needing to use pointers! You however still can!\n```\n\n\
