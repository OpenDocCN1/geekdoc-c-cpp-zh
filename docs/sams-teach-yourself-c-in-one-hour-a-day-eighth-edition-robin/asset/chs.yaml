  \ (1001);\n\n    cout << \"Vector contains \" << integers.size () << \" elements:\
  \ \";\n    DisplayVector(integers);\n\n    // 移除末尾的一个元素\n    integers.pop_back ();\n\
  \n    cout << \"After a call to pop_back()\" << endl;\n    cout << \"Vector contains\
  \ \" << integers.size () << \" elements: \";\n    DisplayVector(integers);\n\n \
