  9999\nFound at position: 1\n\n\n\n\n\n在本节中，你学习了 STL 容器、迭代器和算法所基于的概念。你还接触了 `basic_string<T>`，我们将在接下来的课程中对其进行详细讨论。容器、迭代器和算法是\
  \ STL 中最重要的概念之一，彻底理解这些概念将帮助你在应用程序中高效地使用 STL。第 17 节 到第 25 节 将更详细地阐述这些概念的实现及其应用。\n\
  \n### 问答\n\n**Q：我需要使用数组。但我不知道它需要包含多少个元素。我应该使用哪种 STL 容器？**\n\n**A** `std::vector`\
  \ 或 `std::deque` 完美符合这一需求。它们都能管理内存，并根据应用程序不断增长的需求动态调整自身的大小。\n\n**Q：我的应用有涉及频繁搜索的需求。我应该选择哪种容器？**\n\
  \n**A** 像 `std::map` 或 `std::set` 这样的关联容器或它们的无序变最适合涉及频繁搜索的需求。\n\n**Q：我需要存储键值对以便快速查找。然而，用例可能会导致出现多个不唯一的键。我应该选择哪种容器？**\n\
  \n**A** 类型为 `std::multimap` 的关联容器适合这种需求。`multimap` 可以持有非唯一的键值对，并提供关联容器特有的快速查找功能。\n\
  \n**Q：一个应用程序需要在不同的平台和编译器之间迁移。需要一种可以帮助根据键进行快速查找的容器。我应该使用 `std::map` 还是 `std::hash_map`？**\n\
  \n**A** 可移植性是一个重要的约束条件，使用符合标准的容器是必要的。`hash_map` 并不是 C++ 标准的一部分，因此可能在与应用程序相关的所有平台上都不支持。如果你在所有相关平台都使用符合\
  \ C++11 标准的编译器，可以使用 `std::unordered_map`。\n\n## 工作坊\n\n工作坊包含测试题，旨在帮助你巩固对所涵盖内容的理解。在查看\
