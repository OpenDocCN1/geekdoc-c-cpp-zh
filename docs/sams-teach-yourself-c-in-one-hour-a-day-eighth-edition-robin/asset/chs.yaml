  \ `Sunday` 使代码更具可读性。\n\n## 使用 `switch-case` 进行条件处理\n\n`switch-case` 的目的是允许你将一个特定表达式与一系列可能的常量进行比较，并可能为这些不同的值值执行不同的操作。你会在此类结构中经常遇到的新\
  \ C++ 关键字有 `switch case`、`default` 和 `break`。\n\n以下是 `switch-case` 结构的语法：\n\n点击此处查看代码图片\n\
  \n```cpp\nswitch(expression)\n{\ncase LabelA:\n    DoSomething;\n    break;\ncase\
  \ LabelB:\n    DoSomethingElse;\n    break;\n// 等此类推...\ndefault:\n    DoStuffWhenExpressionIsNotHandledAbove;\n\
  \    break;\n}\n```\n\n发生的情况是，生成的代码求值 `expression`，并与其后的每个 case 标签进行相等性检查。每个 case\
  \ 标签需要是一个常量。然后它执行该标签后的代码。当 `expression` 的求值不为 `LabelA` 时，它会检查 `LabelB`。如果该检查结果为\
  \ `true`，则执行 `DoSomethingElse`。这种检查会持续进行，直到遇到 `break`。这是我们第一次使用 `break` 关键字。`break`\
  \ 会导致执行退出代码块。`break` 并不是强制的；但是，如果没有 `break`，执行将简单继续检查下一个标签，依此类推，而这正是你在这种情况下想要避免的。`default`\
  \ 也是可选的，当表达式不等于 `switch-case` 结构中的任何标签时，将执行该 case。\n\n* * *\n\n**提示**\n\n`switch-case`\
  \ 结构非常适合与枚举器一起使用。关键字 `enum` 引入于 第 3 课，“使用变量、声明常量。](#ch03.html_ch03)”\n\n* * *\n\n\
