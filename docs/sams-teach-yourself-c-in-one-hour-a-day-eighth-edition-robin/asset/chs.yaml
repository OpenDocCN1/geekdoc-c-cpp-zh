  ## 5. 找错（BUGBUSTERS）：以下初始化中有什么错误：\n\n```cpp\nauto Integer;\n```\n\n# 第 4 节：数组与字符串的管理\n\
  \n在之前的课程中，你声明了用于包含单个 `int`、`char` 或 `string` 的变量（仅举几个例子）。然而，你可能想要声明一个对象集合，例如 20\
  \ 个 `int` 或一个用于存储名字的字符串。\n\n在本节中，你将学习到：\n\n- ![Image](img/square.jpg) 什么是数组以及如何声明和使用它们\n\
  - ![Image](img/square.jpg) 什么是字符串以及如何使用字符数组来创建它们\n- ![Image](img/square.jpg) `std::string`\
  \ 的简要介绍\n\n## 什么是数组？\n\n`array`（数组）的字典定义非常接近我们想要理解的概念。根据韦氏-韦斯特词典（Merriam Webster），数组是“形成完整单元的元素组，例如太阳能电池板数组”。\n\
  \n以下是数组的特征：\n\n- ![Image](img/square.jpg) 数组是元素的集合。\n- ![Image](img/square.jpg)\
  \ 数组中包含的所有元素都是相同类型的。\n- ![Image](img/square.jpg) 该集合形成了一个完整的集合。\n\n在 C++ 中，数组允许你以顺序且有序的方式在内存中存储某种类型的数据元素。\n\
  \n### 数组的必要性\n\n想象你正在编写一个程序，用户可以输入五个整数，你将它们返回给用户。一种方法是让你的程序声明五个独立的唯一整数变量，并使用它们来存储和显示值。声明看起来如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nint firstNumber = 0;\nint secondNumber = 0;\nint thirdNumber\
  \ = 0;\nint fourthNumber = 0;\nint fifthNumber = 0;\n```\n\n如果你的用户希望程序在稍后的阶段存储并显示\
  \ 500 个整数，你需要使用上述系统声明 500 个这样的整数。在耐心和时间充足的情况下，这仍然是可以行的。但是，想象一下用户要求你支持 500,000 个整数而不是\
  \ 5 个——你会怎么做？\n\n你应该正确且聪明地这样做，从声明一个五个整数的数组开始，每个整数初始化为零，如下：\n\n```cpp\nint myNumbers\
  \ [5] = {0};\n```\n\n因此，如果你被要求支持 500,000 个整数，你的数组会非常迅速扩展，如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  int manyNumbers [500000] = {0};\n```\n\n五个字符的数组定义为：\n\n```cpp\nchar myCharacters\
  \ [5];\n```\n\n此类数组被称为 `static arrays`（静态数组），因为它们包含的元素数量以及数组消耗的内是在编译时就固定的。\n\n###\
  \ 声明和初始化静态数组\n\n在前面的代码行中，你声明了一个名为 `myNumbers` 的数组，它包含五个 `int` 类型（即整数）的元素——这些都初始化为值\
  \ 0。因此，C++ 中的数组声明遵循简单的语法：\n\n点击此处查看代码图像\n\n```cpp\nElementType ArrayName [constant_number\
  \ of elements] = {optional initial values};\n```\n\n你甚至可以逐元素地声明一个数组并初始化其内容，就像这个整数数组，五个整数中的每一个都分别初始化为五个不同的整数值：\n\
  \n点击此处查看代码图像\n\n```cpp\nint myNumbers [5] = {34, 56, -21, 5002, 365};\n```\n\n你可以将数组中的所有元素都初始化为零（编译器为数值类型提供的默认值），如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nint myNumbers [5] = {}; // 将所有整数初始化为 0\n```\n\n你也可以部分初始化数组中的元素，如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nint myNumbers [5] = {34, 56};\n// 将前两个元素初始化为 34 和 56，其余初始化为\
  \ 0\n```\n\n你可以定义数组的长度（即元素的数量），如下：\n\n点击此处查看代码图像\n\n```cpp\nconst int ARRAY_LENGTH\
  \ = 5;\nint myNumbers [ARRAY_LENGTH] = {34, 56, -21, 5002, 365};\n```\n\n如果你知道初始值，可以省略数组的长度，如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nint myNumbers[] = {34, 56, -21, 5002, 365};\n```\n\n\n\n\
  \n\n当要求访问索引为 `N` 的元素时，编译器使用第一个元素（位于索引 0）的内存地址作为起点，然后通过添加计算为 `N*sizeof(element)`\
  \ 的偏移量来跳过 `N` 个元素，到达包含第 (N+1) 个元素的地址。C++ 编译器不会检查该索引是否在数组实际定义的边界内。你可以尝试在一个只有 10 个元素的数组中获取索引为\
  \ 1001 的元素，这会使你的程序的安全性和稳定性面临风险。确保数组不越界访问的完全在于程序员。\n\n### 警告\n\n访问越界数组会导致不可预知的行为。在许多情况下，这会导致你的程序崩溃。应该尽一切努力避免访问越界数组。\n\
  \nListing 4.1 展示了如何声明一个整数数组，初始化其元素为整数值，并访问它们将它们显示在屏幕上。\n\n**列表 4.1** 声明整数数组并访问其元素\n\
  \n点击此处查看代码图像\n\n```cpp\n0:  #include <iostream>\n1:\n2:  using namespace std;\n\
  3:\n4:  int main ()\n5:  {\n6:    int myNumbers [5] = {34, 56, -21, 5002, 365};\n\
  7:\n8:    cout << \"First element at index  0: \" << myNumbers [0] << endl;\n9:\
  \    cout << \"Second element at index  1: \" << myNumbers [1] << endl;\n10:   \
  \  cout << \"Third element at index  2: \" << myNumbers [2] << endl;\n11:     cout\
  \ << \"Fourth element at index  3: \" << myNumbers [3] << endl;\n12:     cout <<\
  \ \"Fifth element at index  4: \" << myNumbers [4] << endl;\n13:\n14:     return\
  \ 0;\n15:  }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nFirst element at\
  \ index  0: 34\nSecond element at index  1: 56\nThird element at index  2: -21\n\
  Fourth element at index  3: 5002\nFifth element at index  4: 365\n\n分析 ![Image](img/arrow.jpg)\n\
  \n第 6 行声明了一个包含五个整数的数组，并为每个元素指定了初始值。后续行简单地使用 `cout` 和数组变量 `myNumbers` 相应的索引来显示这些整数。\n\
  \n### 注意\n\n为了让你熟悉用于访问数组元素的零基索引概念，我们从 Listing 4.1 及之后开始对代码行进行编号，第一行编号为 Line 0。\n\
  \n## 修改存储在数组中的数据\n\n在之前的代码列表中，你没有向数组中输入用户定义的数据。为该数组中的元素分配整数的语法与为整数变量分配整数值非常相似。\n\
  \n例如，给整数赋值值 2016 如下：\n\n```cpp\nint thisYear;\nthisYear = 2016;\n```\n\n给你的数组中的第四个元素赋值值\
  \ 2016 如下：\n\n点击此处查看代码图像\n\n```cpp\nmyNumbers [3] = 2016; // Assign 2016 to the\
  \ fourth element\n```\n\nListing 4.2 展示了在声明数组长度时使用常量，以及如何在程序执行期间为单个数组元素赋值。\n\n**列表\
  \ 4.2** 为数组中的元素赋值\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2: constexpr int Square(int number) { return number*number; }\n3:\n4: int\
  \ main()\n5: {\n6:   const int ARRAY_LENGTH = 5;\n7:\n8:   // 使用 const 化的 5 个整数数组\n\
  9:   int myNumbers [ARRAY_LENGTH] = {5, 10, 0, -1, 20};\n10:  // 使用 constexpr 处理\
  \ 25 个整数数组\n11:  int moreNumbers [Square(ARRAY_LENGTH)];\n12:   cout << \"Enter\
  \ index of the element to be changed: \";\n13:   int elementIndex = 0;\n14:   cin\
  \ >> elementIndex;\n15:\n16:   cout << \"Enter new value: \";\n17:   int newValue\
  \ = 0;\n18:   cin >> newValue;\n19:\n20:   myNumbers[elementIndex] = newValue;\n\
  21:   moreNumbers[elementIndex] = newValue;\n22:\n23:   cout << \"Element \" <<\
  \ elementIndex << \" in myNumbers is: \";\n24:   cout << myNumbers[elementIndex]\
  \ << endl;\n25:\n26:   cout << \"Element \" << elementIndex << \" in moreNumbers\
  \ is: \";\n27:   cout << moreNumbers[elementIndex] << endl;\n28:\n29:   return 0;\n\
  30: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter index of the element\
  \ to be changed: 3\nEnter new value: 101\nElement 3 in myNumbers is: 101\nElement\
  \ 3 in moreNumbers is: 101\n\n分析 ![Image](img/arrow.jpg)\n\n数组长度需要是一个常量。这可以通过第 9\
  \ 行使用的常量 `ARRAY_LENGTH` 或第 12 行使用的常量表达式 `Square()` 来指定。因此，数组 `myNumbers` 被声明长度为\
  \ 5，而数组 `moreNumbers` 为 25。第 14-20 行要求用户输入要修改的元素索引以及要存储在该索引的新值。第 22 和 23 行演示了根据索引修改数组中的特定元素。第\
  \ 26-29 行演示了根据索引访问数组元素。注意，修改索引为 3 的元素实际上修改的是数组中的第四个元素，因为索引是从零开始的。你必须习惯。\n\n### 注意\n\
  \n许多初学者 C++ 程序员会在五个整数的数组中为索引 5 赋值。注意，这超出了数组的边界，因为编译后的代码尝试访问数组边界之外的第六个元素。\n\n这种错误被称为“栅栏错误”（fence-post\
  \ error）。它的名字是因为建造栅栏所需的柱子数量比栅栏间隔的数量多。\n\n### 警告\n\nListing 4.2 中缺少了基础内容：它没有检查用户输入的索引是否在数组边界内。之前的程序应该验证\
  \ `elementIndex` 对于 `myNumbers` 是否在 0 到 4 之间，对于 `moreNumbers` 是否在 0 到 24 之间，并拒绝所有其他输入。这种缺失的检查允许用户赋值并访问数组边界之外的值。这可能导致应用程序崩溃，在极端的情况下会导致系统崩溃。\n\
  \n执行检查在 Lesson 6“控制程序流”中解释。\n\n## 使用循环访问数组元素\n\n当顺序处理数组及其元素时，你应该使用循环来访问它们（换句话说是迭代）。参见\
  \ Lesson 6，特别是 Listing 6.10，以快速学习如何使用 `for` 循环高效地插入或访问数组中的元素。\n\n### 应当\n\n- **应当**\
  \ 始终初始化数组，否则它们将包含垃圾值。\n- **应当** 始终确保你的数组在定义的边界内使用。\n\n### 不要\n\n- **不要** 永远不要在包含\
  \ N 个元素的数组中使用索引 N 访问第 N 个元素。请使用索引 (N–1)。\n- **不要** 忘记数组中的第一个元素是使用使用索引 0 访问的。\n\n\
  ### 多维数组\n\n我们目前为止看到的数组类似于书架上的书。较长的书架可以放更多的书，较短的书架书较少。也就是说，书架的长度是定义书架容量的唯一维度，因此是一维的。现在，如果我们使用数组来模拟太阳能板阵列会怎样，如图\
  \ 4.3\n\n**图 4.3** 屋顶上的太阳能板阵列。\n\n\n\n\n如你在图 4.3 中所示，六块太阳能板以两行三列的二维排列方式放置。从一个角度来看，你可以将这种排列看作是一个包含两个元素的数组，每个元素本身又是一个包含三个面板的数组——换句话说，这是一个数组的数组。在\
  \ C++ 中，你可以模拟二维数组，但并不局限于二维。根据你的需求和应用程序的性质，你也可以在内存中模拟多维数组。\n\n## 多维数组的声明与初始化\n\n\
  C++ 允许你通过指定每个维度上保留的元素数量来声明多维数组。因此，表示图 4.3 中太阳能板的二维整数数组如下：\n\n```cpp\nint solarPanels\
  \ [2][3];\n```\n\n注意，在图 4.3 中，你还为太阳能阵列中的六块面板分配了一个从 0 到 5 的 ID。如果你按照相同的顺序初始化该整数数组，它看起来像所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nint solarPanels [2][3] = {{0, 1, 2}, {3, 4, 5}};\n```\n\n\
  如你所见，使用的初始化语法实际上与初始化两个一维数组的相似。一个包含三行三列的数组看起来如下：\n\n点击此处查看代码图像\n\n```cpp\nint threeRowsThreeColumns\
  \ [3][3] = {{-501, 206, 2016}, {989, 101, 206}, {303, 456, 596}};\n```\n\n***\n\n\
  **注意**\n\n尽管 C++ 允许我们模拟多维数组，但包含数组的内存是一维的。因此，编译器将多维数组映射到内存空间中，该空间只向一个方向扩展。\n\n如果你愿意，你也可以像如下所示初始化名为\
  \ `solarPanels` 的数组，它在相应元素中仍包含相同的值：\n\n点击此处查看代码图像\n\n```cpp\nint solarPanels [2][3]\
  \ = {0, 1, 2, 3, 4, 5};\n```\n\n然而，前面的方法提供了一个更好的例子，因为它更容易将多维数组想象并理解为“数组的数组”。\n\n\
  ***\n\n## 访问多维数组中的元素\n\n将多维数组想象成一个由数组元素组成的数组。因此，在处理一个包含三行三列且每列都包含整数的二维数组时，将其视觉化为处理一个包含三个元素的数组，其中每个元素都是一个包含三个整数的数组。\n\
