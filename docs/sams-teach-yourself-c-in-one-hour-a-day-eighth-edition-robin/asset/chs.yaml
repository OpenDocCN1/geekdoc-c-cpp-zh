  \ `true`。因此，重要的是编写一个在某些情况下变为 `false` 的条件，否则 `while` 循环将不会结束。列表 6.8 是 `goto` 的等效形式，但使用了更优雅的方式。\n\
  \n**列表 6.8** 使用 `while` 循环帮助用户重新计算\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
