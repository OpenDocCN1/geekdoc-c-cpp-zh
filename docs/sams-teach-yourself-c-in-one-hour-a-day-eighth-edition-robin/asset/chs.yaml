  \n## 分析 ![Image](img/arrow.jpg)\n\n尽管 列表 10.2 的输出与 列表 10.1 相同，但第 3–16 行定义的 `class\
  \ Fish` 发生了许多根本性的变化。第一个也是最明显的变化是，布尔成员 `Fish::isFreshWaterFish` 现在是一个 `protected`\
  \ 属性，因此，如第 51 行所示，无法通过 `main()` 访问（取消注释将看到编译器错误）。尽管如此，`Fish` 中这个访问修饰符为 `protected`\
  \ 的成员可以从派生类 `Tuna` 和 `Carp` 访问，分别如第 23 行和 32 行所示。这个小程序有效地演示了使用 `protected` 关键字的作用，即确保需要继承的基类属性受到保护，防止类体系外部访问。\n\
  \n这是面向对象编程的一个重要方面，它结合了数据抽象和继承，确保派生类可以安全地继承基类属性，而这些属性不会被该层次系统之外的任何人篡改。\n\n### 基类初始化——向基类传递参数\n\
  \n如果基类包含一个在实例化时需要参数的重载构造函数会怎样？在构造派生类时，这样的基类将如何被实例化呢？线索在于使用初始化列表，并通过派生类的构造函数调用相应的基类构造函数，如下代码所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Base\n{\npublic:\n    Base(int someNumber) // 重载构造函数\n\
  \    {\n        // 使用 someNumber\n    }\n};\n\nClass Derived: public Base\n{\npublic:\n\
  \    Derived(): Base(25)  // 使用参数 25 实例化 Base\n    {\n        // 派生类构造函数代码\n   \
  \ }\n};\n```\n\n这种机制在 `class Fish` 中非常有用，通过向 `Fish` 的构造函数提供一个布尔输入参数来初始化 `Fish::isFreshWaterFish`，该`基类\
  \ Fish` 就可以确保每个派生类都必须说明 `Fish` 是淡水鱼还是咸水鱼，如 列表 10.3 所示。\n\n**列表 10.3** 使用初始化列表的派生类构造函数\n\
  \n点击此处查看代码图片\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Fish\n\
  {\nprotected:\n    bool isFreshWaterFish; // 仅派派类类访问\n\npublic:\n    // Fish 构造函数\n\
  \    Fish(bool isFreshWater) : isFreshWaterFish(isFreshWater){}\n\n    void Swim()\n\
  \    {\n        if (isFreshWaterFish)\n            cout << \"Swims in lake\" <<\
  \ endl;\n        else\n            cout << \"Swims in sea\" << endl;\n    }\n};\n\
  \nclass Tuna: public Fish\n{\npublic:\n    Tuna(): Fish(false) {} // 基类构造函数\n};\n\
  \nclass Carp: public Fish\n{\npublic:\n    Carp(): Fish(true) {}\n};\n\nint main()\n\
  {\n    Carp myLunch;\n    Tuna myDinner;\n\n    cout << \"About my food\" << endl;\n\
  \n    cout << \"Lunch: \";\n    myLunch.Swim();\n\n    cout << \"Dinner: \";\n \
