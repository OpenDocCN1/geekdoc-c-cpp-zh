  \ `value` 执行的，操作的结果被赋值回它。因此，在第 9 行，用户输入的 440 加上 8，结果为 448 并赋值回 `value`。在第 11 行的随后的操作中，从\
  \ 448 中减去 2，得到 446，然后赋值回 `value`，以此此类推。\n\n## 使用运算符 `sizeof` 确定变量占用的内存\n\n该运算符告诉您特定类型或变量所消耗的字节（bytes）内存量。`sizeof`\
  \ 的用法如下：\n\n```\nsizeof (variable);\n```\n\n或\n\n```\nsizeof (type);\n```\n\n###\
  \ 注意\n\n`sizeof(...)` 看起来像是一个函数调用，但它并不是函数。`sizeof` 是一个运算符。有趣的是，这个运算符不能由程序员定义，因此不能被重载。\n\
  \n你可以在第 12 节 “运算符类型与运算符重载”学习更多关于定义自定义运算符的知识。\n\n列表 5.10 展示了使用 `sizeof` 来确定数组占用的内存空间。此外，你可能想重新回顾列表\
  \ 3.4，分析 `sizeof` 在确定最常见变量类型所消耗内存方面的用法。\n\n**列表 5.10** 使用 `sizeof` 确定包含 100 个整数的数组及其每个元素占用的字节数\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     cout << \"Use sizeof to determine memory used by arrays\"\
  \ << endl;\n6:     int myNumbers [100] = {0};\n7:\n8:     cout << \"Bytes used by\
  \ an int: \" << sizeof(int) << endl;\n9:     cout << \"Bytes used by myNumbers:\
  \ \" << sizeof(myNumbers) << endl;\n10:    cout << \"Bytes used by an element: \"\
  \ << sizeof(myNumbers[0]) << endl;\n11:\n12:     return 0;\n13: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nUse sizeof to determine memory used by arrays\nBytes used by\
  \ an int: 4\nBytes used by myNumbers: 400\nBytes used by an element: 4\n```\n\n\n\
  \n\n\n你已经学习了运算符的优先级，以及使用括号编写让其他程序员也能理解的代码是多么重要。你还了解了整数溢出的概述，以及避免溢出在实际上是有多重要。\n\n\
  ### 问答\n\n**Q 为什么有些程序使用 `unsigned int`，而 `unsigned short` 占内存更少且也能编译？**\n\n**A**\
  \ `unsigned short` 通常有一个限制为 65535，如果对其进行加 1，它会溢出为 0。为了避免这种行为，良好的应用程序在不确定数值是否会远低于此限值时，会选择\
  \ `unsigned int`。\n\n**Q 我需要计算一个数字在除以 3 之后的两倍。那么，你认为以下代码有什么问题吗：**\n\n点击此处查看代码图像\n\
  \n```cpp\nint result = Number / 3 << 1;\n```\n\n**A** 有的！你为什么不直接使用括号让这行代码对其他程序员来说更容易读呢？增加一两行注释也没有坏处。\n\
  \n**Q 我的应用程序将两个整数值 5 和 2 相除：**\n\n点击此处查看代码图像\n\n```cpp\nint num1 = 5, num2 = 2;\n\
  int result = num1 / num2;\n```\n\n**执行时，结果包含值 2。这不不对吗？**\n\n**A** 完全不是。整数并不是为了包含小数数据的。因此，该操作的结果是\
  \ 2 而不是 2.5。如果你期望的结果是 2.5，请将所有数据类型改为 `float` 或 `double`。这些类型是用来处理浮点（小数）操作的。\n\n\
  ## 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查 附录 E 中的答案之前，请尝试回答测验和练习题，并确保在继续下一节之前你理解了这些答案。\n\
