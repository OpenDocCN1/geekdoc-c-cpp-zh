  \ 10,000 个元素而不是 100 个，它的速度将慢 100 倍。\n\n***\n\n因此，虽然对数复杂度看起来已经很不错，但人们应该记住，`map`（或\
  \ `multimap`、`set` 或 `multiset`）中的插入也会变慢，因为这些容器在插入时会排序。因此，对更快容器的搜索仍在继续，数学家和程序员都在寻找具有常数时间插入和搜索的容器“圣杯”。哈希表（Hash\
  \ Table）就是这样一种容器，在给定键的情况下，独立于容器的大小，承诺常数时间的插入和（在大多数情况下）接近常数时间的搜索。\n\n### STL 基于哈希表的键值容器\n\
  \n从 C++11 开始，STL 支持以 `std::unordered_map` 类的形式提供哈希映射。要使用此模板容器类，请包含：\n\n```cpp\n\
  #include<unordered_map>\n```\n\n`unordered_map` 承诺对容器中任意元素的平均常数时间插入、删除和查找。\n\n####\
  \ 哈希表如何工作\n\n虽然详细讨论这个主题不在本书的范围之内（因为这已经是一个过多的博士论文的主题了），但让我们尝试理解让哈希表运行的基本原理。\n\n哈希表可以看是一个键值对的集合，给定一个键，表就能找到一个值。哈希表与简单\
  \ map 的区别在于，哈希表将键值对存储在桶（buckets）中，每个桶都有一个定义其在表中的相对位置的索引（类似于数组）。该索引由一个使用键作为输入的 `hash-function`（哈希函数）决定：\n\
  \n点击此处查看代码图片\n\n```cpp\nIndex = HashFunction(key, TableSize);\n```\n\n当给定键执行 `find()`\
  \ 操作时，会再次使用 `HashFunction()` 来确定元素的位置，表返回该位置的值，就像数组返回存储在其的元素一样。在 `HashFunction()`\
  \ 程序得不够优化的情况下，可能会有多个元素具有相同的 `Index`（此处原文为 Index，对应代码中的 `Index`），落在同一个桶中——这在内部是一个元素列表。在这种情况下，被称为\
  \ *collisions*（冲突），搜索将变慢，且不再是常数时间。\n\n#### 使用 `unordered_map` 和 `unordered_multimap`\n\
  \n从 C++11 开始引入的这两个实现哈希表的容器分别与 `std::map` 和 `std::multimap` 并不太大。实例化、插入和 `find` 遵循相似的模式：\n\
  \n点击此处查看代码图片\n\n```cpp\n// 实例化一个 int 到 string 的 unordered_map:\nunordered_map<int,\
  \ string> umapIntToStr;\n\n// insert()\numapIntToStr.insert(make_pair(1000, \"Thousand\"\
  ));\n\n// find():\nauto pairFound = umapIntToStr.find(1000);\ncout << pairFound->first\
  \ << \" - \" << pairFound->second << endl;\n\n// 使用数组语义查找值:\ncout << \"umapIntToStr[1000]\
  \ = \" << umapIntToStr[1000] << endl;\n```\n\n然而，`unordered_map` 的一个重要特性是可以使用哈希函数，该函数负责决定排序顺序：\n\
  \n点击此处查看代码图片\n\n```cpp\nunordered_map<int, string>::hasher hFn =\n    umapIntToStr.hash_function();\n\
  ```\n\n你可以通过调用键的哈希函数来查看分配给键的优先级：\n\n点击此处查看代码图片\n\n```cpp\nsize_t hashingVal = hFn(1000);\n\
  ```\n\n由于 `unordered_map` 将键值对存储在桶中，当 map 中的元素数量达到或趋于桶的数量时，它会进行自动负载均衡：\n\n点击此处查看代码图片\n\
  \n```cpp\ncout << \"Load factor: \" << umapIntToStr.load_factor() << endl;\ncout\
  \ << \"Max load factor = \" << umapIntToStr.max_load_factor() << endl;\ncout <<\
  \ \"Max bucket count = \" << umapIntToStr.max_bucket_count() << endl;\n```\n\n`load_factor()`（负载因子）是\
  \ `unordered_map` 中桶填充程度的指标。当由于插入导致 `load_factor()` 超过 `max_load_factor()` 时，`map`\
  \ 会重新组织自己以增加可用桶的数量并重建哈希表，如 列表 20.6 所示。\n\n***\n\n**提示**\n\n`std::unordered_multimap`\
  \ 与 `unordered_map` ，它支持具有相同键的多个对。\n\n***\n\n**列表 20.6** 实例化 STL 哈希表实现 `unordered_map`，使用\
  \ `insert()`、`find()`、`size()`、`max_bucket_count()`、`load_factor()` 和 `max_load_factor()`\n\
  \n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include<iostream>\n1: #include<string>\n2: #include<unordered_map>\n\
  3: using namespace std;\n4: \n5: template <typename T1, typename T2>\n6: void DisplayUnorderedMap(unordered_map<T1,\
  \ T2>& cont)\n7: {\n8:     cout << \"Unordered Map contains: \" << endl;\n9:   \
  \  for (auto element = cont.cbegin();\n10:          element != cont.cend();\n11:\
  \          ++ element )\n12:         cout << element->first << \" -> \" << element->second\
  \ << endl;\n13:\n14:     cout << \"Number of pairs: \" << cont.size() << endl;\n\
  15:     cout << \"Bucket count = \" << cont.bucket_count() << endl;\n16:     cout\
  \ << \"Current load factor: \" << cont.load_factor() << endl;\n17:     cout << \"\
  Max load factor = \" << cont.max_load_factor() << endl;\n18: }\n19: \n20: int main()\n\
  21: {\n22:     unordered_map<int, string> umapIntToStr;\n23:     umapIntToStr.insert(make_pair(1000,\
  \ \"Thousand\"));\n24:     umapIntToStr.insert(make_pair(1, \"One\"));\n25:    \
  \ umapIntToStr.insert(make_pair(45, \"Forty Five\"));\n26:     umapIntToStr.insert(make_pair(1001,\
  \ \"One Thousand\"));\n27:     umapIntToStr.insert(make_pair(-2, \"Minus Two\"));\n\
  28:     umapIntToStr.insert(make_pair(12, \"Twelve\"));\n29:     umapIntToStr.insert(make_pair(100,\
  \ \"One Hundred\"));\n30:     umapIntToStr.insert(make_pair(-100, \"Minus One\"\
  ));\n31:\n32:     DisplayUnorderedMap(umapIntToStr);\n33:\n34:     cout << \"Inserting\
  \ one element\" << endl;\n35:     umapIntToStr.insert(make_pair(300, \"Three Hundred\"\
  ));\n36:     DisplayUnorderedMap(umapIntToStr);\n37:\n38:     cout << \"Enter key\
  \ to find: \";\n39:     int Key;\n40:     cin >> Key;\n41:     auto element = umapIntToStr.find(Key);\n\
  42:     if (element != umapIntToStr.end())\n43:         cout << \"Found! Key pairs\
  \ with value \" << element->second << endl;\n44:     else\n45:         cout << \"\
  Key has no corresponding value!\" << endl;\n46:\n47:     return 0;\n48: }\n```\n\
  \n\n\n\n### 注意事项\n\n不要依赖 `unordered_map`（顾名思义）中元素的顺序，无论键是什么。map 中某个元素相对于其他元素的顺序取决于许多因素，包括其键、插入顺序以及桶（buckets）的数量等。\n\
  \n这些容器针对搜索性能进行了优化，当你在遍历它们时，不要依赖于元素的顺序。\n\n## 备注\n\n`std::unordered_map` 提供的插入和搜索（在不发生冲突的情况下）几乎是常数时间复杂度，这与包含的元素数量无关。然而，这并不意味着\
  \ `std::unordered_map` 优于 `std::map`，因为 `std::map` 在所有情况下都提供对数复杂度。常数项可能大得多，导致前者在元素数量较少的情况下速度较慢。\n\
  \n在进行模拟真实场景使用的特定基准测试后，根据容器的类型做出决策是非常关重要的。\n\n## 建议 (DO)\n\n- 在需要键唯一的键值对的情况下，**务必**使用\
  \ `map`。\n- 在需要键可以重复的键值对（例如，电话簿）的情况下，**务必**使用 `multimap`。\n- **务必**记住 `map` 和 `multimap`\
  \ 与其他 STL 容器一样，都具有成员方法 `size()`，它可以告诉你它们包含多少键值对。\n- 当常数时间插入和搜索至关重要时（通常是元素数量非常多时），**务必**使用\
  \ `unordered_map` 或 `unordered_multimap`。\n\n## 避免 (DON’T)\n\n- **不要**忘记 `multimap::count(key)`\
  \ 可以告诉你容器中使用 `key` 索引的键值对数量。\n- **不要**忘记通过将 `find()` 操作的结果与容器的 `end()` 进行比较来检查结果。\n\
  \n### 总结\n\n在本节中，你学习了如何使用 STL `map` 和 `multimap`、它们重要的成员函数及其特性。你还学习了这些容器具有对数复杂度，并且\
  \ STL 以 `unordered_map` 和 `unordered_multimap` 的形式提供了哈希表容器。它们在 `insert()` 和 `find()`\
  \ 操作中的性能与容器大小无关。你还学习了使用谓词自定义排序标准的重要性，正如在 Listing 20.5 的目录应用程序中所演示的那样。\n\n### 问答\n\
  \n**Q：如何声明一个按数值降序排序或存储的整数 map？**\n\n**A** `map <int>` 定义了一个整数的 `map`。它使用默认的排序谓词\
  \ `std::less <T>` 按数值升序对项目进行排序，也可以表示为 `map <int, less <int>>`。要按数值降序排序，请将 `map`\
  \ 定义为 `map <int, greater <int>>`。\n\n**Q：如果我在字符串 map 中插入两次字符串 \"Jack\" 会发生什么？**\n\
  \n**A** `map` 不用于插入非唯一值。因此，该 map 仍然只包含一个键名为 \"Jack\" 的键值对。\n\n# 第四部分：更多 STL\n\n\
  ## 第 21 节：理解函数对象\n\n函数对象或*仿函数 (functors)* 听起来可能奇异或令人生畏，但它们是 C++ 中的实体，你可能已经见过甚至在使用，而并没有意识到。在本节中，你将学习到：\n\
  \n- 函数对象的概念\n- 函数对象作为谓词用法\n- 如何使用函数对象实现一元和二元谓词\n\n### 函数对象和谓词的概念\n\n在概念层，函数对象是像函数一样工作的对象。但在实现层，函数对象是实现了了\
  \ `operator()` 的类对象。虽然函数和函数指针也可以被归类为函数对象，但正是实现 `operator()` 的类对象携带 `state`（即类成员属性中的值）的能力，使得它在标准模板库\
  \ (STL) 算法中非常有用。\n\n\n\n\n返回 `boolean` 类型的函数对象自然适用于用于辅助决策的算法。`find()` 和 `sort()`\
  \ 是你之前在课程中学习过的两种算法。组合两个函数对象的函数对象被称为“自适应函数对象”（`adaptive function object`）。\n\n###\
  \ 函数对象的典型应用\n\n可以用数页的理论解释来介绍函数对象，也可以通过微小的示例程序来理解它们的外观和工作原理。让我们采取实用的方法，直接进入函数对象或仿（functors）的\
  \ C++ 编程世界！\n\n#### 一元函数\n\n对单个参数的操作的操作称为一元函数。一元函数可以执行非常简单的操作——例如，在屏幕上显示一个元素。可以按如下方式编写：\n\
  \n点击此处查看代码图像\n\n```cpp\n// A unary function\n\ntemplate <typename elementType>\n\
  \nvoid FuncDisplayElement (const elementType& element)\n{\n    cout << element <<\
  \ ' ';\n};\n```\n\n函数 `FuncDisplayElement` 接受一个模板类型 `elementType` 的参数，并使用控制台输出语句\
  \ `std::cout` 将其显示。该函数也可以有另一种表示，即函数的实现实际上包含在 `class` 或 `struct` 的 `operator()` 中：\n\
  \n点击此处查看代码图像\n\n```cpp\n// Struct that can behave as a unary function\n\ntemplate\
  \ <typename elementType>\n\nstruct DisplayElement\n{\n    void operator () (const\
  \ elementType& element) const\n    {\n        cout << element << ' ';\n    }\n};\n\
  ```\n\n**提示**\n\n注意 `DisplayElement` 是一个 `struct`。如果它是一个 `class`，则需要给 `operator()`\
  \ 一个 `public` 访问修饰符。`struct` 类似于 `class`，其成员默认是 `public` 的。\n\n这两种实现方式都可以与 STL 算法\
  \ `for_each()` 配合，将集合的内容逐个打印到屏幕上，如 Listing 21.1 所示。\n\n**列表 21.1** 使用一元函数在屏幕上显示集合的内容\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <iostream>\n2: #include\
  \ <vector>\n3: #include <list>\n4: using namespace std;\n5:\n6: // struct that behaves\
  \ as a unary function\n7: template <typename elementType>\n8: struct DisplayElement\n\
  9: {\n10:     void operator () (const elementType& element) const\n11:     {\n12:\
  \         cout << element << ' ';\n13:     }\n14: };\n15:\n16: int main ()\n17:\
  \ {\n18:     vector <int> numsInVec{ 0, 1, 2, 3, -1, -9, 0, -999 };\n19:      cout\
  \ << \"Vector of integers contains: \" << endl;\n20:\n21:     for_each (numsInVec.begin\
  \ (),    // Start of range\n22:                 numsInVec.end (),         // End\
  \ of range\n23:                   DisplayElement<int> () ); // Unary function object\n\
  24:\n25:     // Display the list of characters\n26:     list <char> charsInList{\
  \ 'a', 'z', 'k', 'd' };\n27:     cout << endl << \"List of characters contains:\
  \ \" << endl;\n28:\n29:     for_each (charsInList.begin(),\n30:                \
  \   charsInList.end(),\n31:                   DisplayElement<char> () );\n32:\n\
  33:     return 0;\n34: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\nVector\
  \ of integers contains:\n0 1 2 3 -1 -9 0 -999\nList of characters contains:\na z\
  \ k d\n\n分析 ![Image](img/arrow.jpg)\n第 8–14 行包含函数对象 `DisplayElement`，它实现了 `operator()`。该函数对象的使用在第\
  \ 21–23 行的 STL `std::for_each()` 中可见。`for_each()` 接受三个参数：第一个是范围的起始点，第二个是范围的终点，第三个是范围内范围内每个元素被调用的函数。换句话说，该代码为\
  \ `numsInVec` 中的每个元素调用了 `DisplayElement::operator()`。\n\n**注意**\n\n在 Listing 21.1\
  \ 中，你可以选择使用 `FuncDisplayElement` 代替 `struct DisplayElement` 以达到相同的效果：\n\n点击此处查看代码图像\n\
  ```cpp\nfor_each (charsInList.begin(),\n          charsInList.end(),\n         \
  \ FuncDisplayElement<char>);\n```\n\n**提示**\n\nC++11 引入了 lambda 表达式，它是无名的函数对象。来自\
  \ Listing 21.1 的 `DisplayElement<T>` 的 lambda 表达式版本压缩了整个代码，包括 `struct` 的定义。\n\n\
  C++11 引入了 lambda 表达式，它是无名的函数对象。一个 lambda 表达式版本的 `DisplayElement<T>`（源自 Listing 21.1）压缩了整个代码，包括\
  \ `struct` 的定义。\n\n\n\n此示例与 Listing 21.1 中的示例最大的区别在于将 `DisplayElementKeepCount()`\
  \ 作为 `for_each()` 的返回值。在 `struct DisplayElementKeepCount` 中实现的 `operator()` 会被算法\
  \ `for_each()` 为容器中的每个元素调用。它显示该元素并增加存储在成员属性 `count` 中的内部计数器。在 `for_each()` 完成后，你使用\
  \ `Line \\ 29` 中的对象来显示元素被打印的次数。请注意，在这种场景下，如果使用普通函数而不是在 `struct` 中实现的函数，将无法以这种如此直接的方式提供此功能。\n\
  \n### 一元谓词 (Unary Predicate)\n\n返回 `bool` 的一元函数称为**谓词**（predicate）。这类函数可以帮助为 STL\
  \ 算法做出决策。Listing 21.3 是一个示例谓词，用于判断输入元素是否为某个初始值的倍数。\n\n**LISTING 21.3** 一个判断数字是否为另一个数字倍数的一元谓词\n\
  \n点击此处查看代码图像\n\n```cpp\n  0: // 作为一元谓词的结构\n  1: template <typename numberType>\n\
  \  2: struct IsMultiple\n  3: {\n  4:     numberType Divisor;\n  5:\n  6:     IsMultiple\
  \ (const numberType& divisor)\n  7:     {\n  8:         Divisor = divisor;\n  9:\
  \     }\n  10:\n  11:     bool operator () (const numberType& element) const\n \
  \ 12:     {\n  13:         // 检查元素是否是除数的倍数\n  14:         return ((element % Divisor)\
  \ == 0);\n  15:     }\n  16: };\n```\n\n分析 ![Image](img/arrow.jpg)\n\n在这里 `operator()`\
  \ 返回 `bool` 并可以作为一元谓词。该结构体有一个构造函数并在 `Line \\ 8` 中初始化为除数的值。存储在对象中的该值随后用于判断发送比较的元素是否能被其整除，正如你在\
  \ `operator()` 的实现中所看到的，在 `Line \\ 14` 使用了数学取模运算 `%` 返回除法运算的余数。谓词将该余数与零比较，以确定该数字是否为倍数。\n\
  \n在 Listing 21.4 中，我们利用之前在 Listing 21.3 中看到的谓词，来判断集合中的数字是否为用户输入的除数的倍数。\n\n**LISTING\
  \ 21.4** 使用 `std::find_if()` 通过一元谓词 `IsMultiple` 在 `vector` 中查找用户提供的除数的倍数元素\n\n\
  点击此处查看代码图像\n\n```cpp\n  0: #include <algorithm>\n  1: #include <vector>\n  2: #include\
  \ <iostream>\n  3: using namespace std;\n  4: // 在此处插入 Listing 21.3 的代码\n  5:\n\
  \  6: int main ()\n  7: {\n  8:     vector <int> numsInVec{ 25, 26, 27, 28, 29,\
  \ 30, 31 };\n  9:     cout << \"The vector contains: 25, 26, 27, 28, 29, 30, 31\"\
  \ << endl;\n  10:\n  11:     cout << \"Enter divisor (> 0): \";\n  12:     int divisor\
  \ = 2;\n  13:     cin >> divisor;\n  14:\n  15:     // 找到第一个是除倍数的元素\n  16:     auto\
  \ element = find_if (numsInVec.begin (),\n  17:                                \
  \     numsInVec.end (),\n  18:                                     IsMultiple<int>(divisor)\
  \ );\n  19:     if (element != numsInVec.end ())\n  20:     {\n  21:         cout\
  \ << \"First element in vector by \" << divisor;\n  22:         cout << \": \" <<\
  \ *element << endl;\n  23:     }\n  24:\n  25:     return 0;\n  26: }\n```\n\n输出\
  \ ![Image](img/arrow.jpg)\n点击此处查看代码图像\nThe vector contains: 25, 26, 27, 28, 29,\
  \ 30, 31\nEnter divisor (> 0): 4\nFirst element in vector by 4: 28\n\n分析 ![Image](img/arrow.jpg)\n\
  \n该示例以一个整数 `vector` 容器开始。一元谓词的使用如 `Line \\ 16` 所示位于 `find_if()` 中。在这里，函数对象 `IsMultiple()`\
  \ 初始化为用户提供的除数并存储在 `Divisor` 中。`find_if()` 的工作原理为指定范围内的每个元素调用一元谓词 `IsMultiple::operator()`。当\
  \ `operator()` 返回 `true` 时（当该元素能被除数整除时发生），`find_if()` 返回该迭代器。正如你在 `operator()` 的实现中所看到的，在\
  \ `Line \\ 14` 使用了数学取模运算 `%` 返回除法运算的余数。谓词将该余数与零比较，以确定该数字是否为倍数。\n\n在 Listing 21.4\
  \ 中，我们利用之前在 Listing 21.3 中看到的谓词，来判断集合中的数字是否为用户输入的除数的倍数。\n\n\n\n\n\n```cpp\n45: \
  \     cout << vecResult [index] << ' ';\n\n47:      return 0;\n48: }\n```\n\n输出\
  \ ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n第一个 vector 内容为：\n\n0 1 2 3 4\n\n第二个 vector\
  \ 内容为：\n\n100 101 102 103 104\n\n乘法的结果为：\n\n0 101 204 309 416\n\n### 分析\n\n![Image](img/arrow.jpg)\n\
  \n第 4–13 行包含了 `Multiply` 类，如上一个代码段所示。在此示例中，你使用 `std::transform()` 算法将两个范围的内容相乘，并存储在第三个范围中。在这种情况下，涉及的范围存储在\
  \ `std::vector` 中，分别为 `multiplicands`（乘数）、`multipliers`（乘因子）和 `vecResult`。你在第 27–31\
  \ 行中使用 `std::transform()` 将 `multiplicands` 中的每个元素与其在 `multipliers` 中对应的元素相乘，并将乘法结果存储在\
  \ `vecResult` 中。乘法本身是由二进制函数 `Multiply::operator()` 完成的，该函数为构成源和目标范围的向量中的每个元素调用。`operator()`\
  \ 的返回值存储在 `vecResult` 中。\n\n因此，此示例演示了二元函数在对 STL 容器元素执行算术操作的应用。下一个示例也使用了 `std::transform()`，但用于使用函数\
  \ `tolower()` 将字符串转换为小写。\n\n### 二元谓词\n\n接受两个参数并返回 `bool` 的函数是二元谓词。此类函数应用于 STL 函数，例如\
  \ `std::sort()`。列表 21.6 展示了二元谓词的使用，在将两个字符串都转换为小写后对其进行比较。例如，这种谓词可以用于 `string` 的 `vector`\
  \ 执行不区分大小写的排序。\n\n**列表 21.6** 用于不区分大小写字符串排序的二元谓词\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <algorithm>\n1: #include <string>\n2: using namespace std;\n3:\n4: class CompareStringNoCase\n\
  5: {\n6: public:\n7:     bool operator () (const string& str1, const string& str2)\
  \ const\n8:     {\n9:         string str1LowerCase;\n10:\n11:         // 分配空间\n\
  12:         str1LowerCase.resize (str1.size ());\n13:\n14:         // 将每个字符转换为小写\n\
  15:         transform (str1.begin (), str1.end (), str1LowerCase.begin (),\n16:\
  \                             ::tolower);\n17:\n18:         string str2LowerCase;\n\
  19:         str2LowerCase.resize (str2.size ());\n20:         transform (str2.begin\
  \ (), str2.end (), str2LowerCase.begin (),\n21:                             ::tolower);\n\
  22:\n23:         return (str1LowerCase < str2LowerCase);\n24:     }\n25: };\n```\n\
  \n### 分析\n\n![Image](img/arrow.jpg)\n\n在 `operator()` 中实现的二元谓词首先使用算法 `std::transform()`（如第\
  \ 15 和 20 行所示）将输入字符串转换为小写，然后使用字符串的比较运算符 `operator <` 返回比较结果。\n\n你可以将此二元谓词与算法 `std::sort()`\
  \ 一起使用，对 `vector<string>` 中的动态数组进行排序，如列表 21.7 所示。\n\n**列表 21.7** 使用函数对象 `class CompareStringNoCase`\
  \ 对 `vector<string>` 执行不区分大小写的排序\n\n点击此处查看代码图像\n\n```cpp\n0: //在此处插入列表 21.6 中的 classStringNoCase\
  \ \n1: #include <vector>\n2: #include <iostream>\n3:\n4: template <typename T>\n\
  5: void DisplayContents (const T& container)\n6: {\n7:     for (auto element = container.cbegin();\n\
  8:          element != container.cend ();\n9:          ++ element )\n10:     cout\
  \ << *element << endl;\n11: }\n12:\n13: int main ()\n14: {\n15:     // 定义一个存储名称的\
  \ string vector\n16:     vector <string> names;\n17:\n18:     // 将示例名称插入 vector\n\
  19:     names.push_back (\"jim\");\n20:     names.push_back (\"Jack\");\n21:   \
  \  names.push_back (\"Sam\");\n22:     names.push_back (\"Anna\");\n23:\n24:   \
  \  cout << \"按插入顺序排列的 vector 中的名称: \" << endl;\n25:     DisplayContents(names);\n\
  26:\n27:     cout << \"使用默认 std::less<> 排序后的名称: \" << endl;\n28:     sort(names.begin(),\
  \ names.end());\n29:     DisplayContents(names);\n30:\n31:     cout << \"使用不区分大小写谓词排序后的名称:\
  \ \" << endl;\n32:     sort(names.begin(), names.end(), CompareStringNoCase());\n\
  33:     DisplayContents(names);\n34:\n35:     return 0;\n36: }\n```\n\n\n\n\n\n\
  # 3. 编写一个辅助升序排序的二元谓词。\n\n## 第 22 节 Lambda 表达式\n\nLambda 表达式是一种定义和构造无名函数对象的简洁方式。这些表达式是在\
  \ C++11 中引入的。在本节中，你将了解到：\n\n![Image](img/square.jpg) 如何编写 lambda 表达式\n\n![Image](img/square.jpg)\
  \ 如何将 lambda 表达式作为谓词\n\n![Image](img/square.jpg) 什么是 C++14 通用 lambda 表达式\n\n![Image](img/square.jpg)\
  \ 如何编写可以持有并操作状态的 lambda 表达式\n\n### 什么是 Lambda 表达式？\n\nLambda 表达式可以可视化为带有公共 `operator()`\
  \ 的无名 `struct`（或 `class`）的紧凑版本。从这个意义上说，lambda 表达式是一个函数对象，类似于第 21 节中“理解函数对象”中的对象。在深入分析\
  \ lambda 函数的编程之前，先以列表 21.1（来自第 21 节）中的函数对象作为示例：\n\n点击此处查看代码\n\n```cpp\n// 行为类似于一元函数的结构体\n\
  template <typename elementType>\nstruct DisplayElement\n{\n    void operator ()\
  \ (const elementType& element) const\n    {\n        cout << element << ' ';\n \
  \   }\n};\n```\n\n该函数对象使用 `cout` 在屏幕上显示对象 `element`，通常用于 `std::for_each()` 等算法：\n\
  \n点击此处查看代码\n\n```cpp\n// 显示 vector 中包含的每个整数\nfor_each (numsInVec.cbegin (),   //\
  \ 范围开始\n          numsInVec.cend (),      // 范围结束\n          DisplayElement <int>\
  \ ()); // 一元函数对象\n```\n\nLambda 表达式将包括函数对象定义在整个代码压缩为三行：\n\n点击此处查看代码\n\n```cpp\n\
  // 使用 lambda 表达式显示 vector 中包含的每个整数。\nfor_each (numsInVec.cbegin (),   // 范围开始\n\
  \          numsInVec.cend (),      // 范围结束\n          [](const int& element) {cout\
  \ << element << ' '; } );\n```\n\n当编译器看到 lambda 表达式时，在此情况下：\n\n点击此处查看代码\n\n```cpp\n\
  [](const int& element) {cout << element << ' '; }\n```\n\n它会自动将此表达式展开为类似于 struct\
  \ `DisplayElement<int>` 的表示形式：\n\n点击此处查看代码\n\n```cpp\nstruct NoName\n{\n    void\
  \ operator () (const int& element) const\n    {\n        cout << element << ' ';\n\
  \    }\n};\n```\n\n> **提示**\n> Lambda 表达式也称为 Lambda 函数。\n\n### 如何定义 Lambda 表达式\n\
  \nLambda 表达式的定义必须以方括号 `[]` 开始。这些括号本质上是告诉编译器 lambda 表达式已经开始。其后是参数列表，这与在你不使用 lambda\
  \ 表达式时为 `operator()` 的实现提供的参数列表相同。\n\n### 用于一元函数的 Lambda 表达式\n\n接收一个参数的一元 `operator(Type)`\
  \ 的 lambda 版本如下：\n\n点击此处查看代码\n\n```cpp\n[](Type paramName) {  // 此处为 lambda 表达式代码;\
  \  }\n```\n\n请注意，如果你需要，可以按引用传递参数：\n\n点击此处查看代码\n\n```cpp\n[](Type& paramName) { \
  \ // 此处为 lambda 表达式代码;  }\n```\n\n请使用列表 22.1 学习如何使用 lambda 函数通过算法 `for_each()` 显示标准模板库\
  \ (STL) 容器的内容。\n\n**列表 22.1** 通过由 lambda 表达式而非函数对象调用的算法 `for_each()` 显示容器中的元素\n\n\
