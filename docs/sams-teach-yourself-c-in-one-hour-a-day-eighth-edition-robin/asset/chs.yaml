  \ 的成员函数\n\n如表所示，栈的公共成员函数仅暴露允许符合栈行为的位置进行插入和删除的方法。也就是说，即使底层容器可能是 `deque`、`vector`\
  \ 或 `list`，该容器的功能也没有被暴露，以强制执行栈的行为特征。\n\n### 使用 `push()` 和 `pop()` 在栈顶插入和删除\n\n元素的插入通过方法\
  \ `stack<T>::push()` 完成：\n\n点击此处查看代码图像\n\n```cpp\nnumsInStack.push(25); // 25 is\
  \ atop the stack\n```\n\n栈通过方法 `top()` 允许对栈顶元素的访问：\n\n点击此处查看代码图像\n\n```cpp\ncout\
  \ << numsStack.top() << endl;\n```\n\n如果你想移除栈顶的元素，可以使用 `pop()` 函数：\n\n点击此处查看代码图像\n\
  \n```cpp\nnumsInStack.pop(); // 移除栈顶元素\n```\n\n列表 24.2 演示了使用 `push()` 和 `pop()`\
  \ 在栈顶进行插入和删除。\n\n**列表 24.2** 使用 `push()` 操作整数栈\n\n\n\n\nSTL `queue` 是一个模板类，需要包含\
  \ `<queue>` 头文件。它是一个通用类，允许仅在末尾插入元素并仅在头部删除元素。`queue` 不允许对中间的元素进行任何访问或检查；然而，可以访问开头和结尾的元素。从某种意义上说，std::queue`\
  \ 的行为与超市收银台前排队的队列非常相似！\n\n### 实例化队列\n\n`std::queue` 定义为：\n\n点击此处查看代码图片\n\n```cpp\n\
  template <\n   class elementType,\n   class Container = deque<Type>\n> class queue;\n\
  ```\n\n在这里，`elementType` 是队列对象收集的元素类型。`Container` 是 `std::queue` 类用于维护其数据的集合类型。`std::list,`、`vector`\
  \ 和 `deque` 都是该模板参数的可能候选类型，而 `deque` 是默认值。\n\n整数队列最简单的实例化方式如下：\n\n```cpp\nstd::queue\
  \ <int> numsInQ;\n```\n\n如果你想创建一个在 `std::list` 中（而不是默认的 `deque`）包含 `double` 类型元素的队列，请使用以下代码：\n\
  \n点击此处查看代码图片\n\n```cpp\nstd::queue <double, list <double>> dblsInQInList;\n```\n\
  \n就像栈一样，队列也可以实例化为另一个队列的拷贝：\n\n点击此处查看代码图片\n\n```cpp\nstd::queue<int> copyQ(numsInQ);\n\
  ```\n\n列表 24.3 演示了 `std::queue` 的各种实例化技术。\n\n**列表 24.3** 实例化 STL 队列\n\n```cpp\n\
  0: #include <queue>\n1: #include <list>\n...\nint main ()\n{\n   using namespace\
  \ std;\n\n   // 一个整数队列\n   queue <int> numsInQ;\n\n   // 一个双精度浮数队列\n   queue <double>\
  \ dblsInQ;\n\n   // 一个内部存储在 list 中的双精度浮数队列\n   queue <double, list <double>> dblsInQInList;\n\
  \n   // 作为另一个队列拷贝创建的队列\n   queue<int> copyQ(numsInQ);\n\n   return 0;\n}\n```\n\n\
  分析：示例演示了如何实例化通用 STL 类 `queue` 来创建一个整数队列（如第 8 行所示），或用于 `double` 类型对象的队列（如第 11 行所示）。在第\
  \ 14 行实例化的 `dblsInQInList` 是一个 `queue`，你显式指定了 `queue` 用于管理其内部的适配底层容器为 `std::list`，正如第二个模板参数所指定的。在没有第二个模板参数的情况下（如前两个队列），使用\
  \ `std::deque` 作为 `queue` 内容的默认底层容器。\n\n### `queue` 的成员函数\n\n`std::queue` 与 `std::stack`\
  \ 一样也基于 STL 容器（如 `vector`、`list` 或 `deque`）来实现实现。`queue` 仅暴露实现队列行为特征的成员函数。表格 24.2\
  \ 解释了使用 `numsInQ` 的成员函数，而 列表 24.3 演示了这是一个整数 `queue`。\n\nSTL `queue` 不具备 `begin()`\
  \ 和 `end()` 函数，这些函数是由大多数 STL 容器（包括 `queue` 类使用的底层 `deque`、`vector` 或 `list`）提供的。这是刻意为，以确保\
  \ `queue` 上唯一允许的操作是符合 `queue` 行为特征的操作。\n\n### 通过 `push()` 和 `pop()` 在 `queue` 的末尾插入和头部删除\n\
  \n队列中元素的插入发生在末尾，并使用成员方法 `push()` 完成：\n\n点击此处查看代码图片\n\n```cpp\nnumsInQ.push (5);\
  \ // 元素插入在末尾\n```\n\n相反，删除通过 `pop()` 在头部发生：\n\n点击此处查看代码图片\n\n```cpp\nnumsInQ.pop\
  \ (); // 移除头部元素\n```\n\n与 `stack` 不同，`queue` 允许两端的元素（即 `front` 和 `back`）被检查：\n\n\
  ```cpp\ncout << \"Element at front: \" << numsInQ.front() << endl;\ncout << \"Element\
  \ at back: \" << numsInQ.back () << endl;\n```\n\n插入、删除和检查在 列表 24.4 中演示。\n\n**列表\
  \ 24.4** 在整数 `queue` 中插入、删除和检查元素\n\n```cpp\n#include <queue>\n#include <iostream>\n\
  \nint main ()\n{\n   using namespace std;\n   queue<int> numsInQ;\n\n   cout <<\
  \ \"Inserting {10, 5, -1, 20} into queue\" << endl;\n   numsInQ.push(10);\n   numsInQ.push(5);\n\
  \   numsInQ.push(-1);\n   numsInQ.push(20);\n\n   cout << \"Queue contains \" <<\
  \ numsInQ.size() << \" elements\" << endl;\n   cout << \"Element at front: \" <<\
  \ numsInQ.front() << endl;\n   cout << \"Element at back: \" << numsInQ.back ()\
  \ << endl;\n\n   while (numsInQ.size() != 0)\n   {\n      cout << \"Deleting element:\
  \ \" << numsInQ.front() << endl;\n      numsInQ.pop(); // removes element at front\n\
  \   }\n\n   if (numsInQ.empty())\n   {\n      cout << \"The queue is now empty!\"\
  \ << endl;\n   }\n   return 0;\n}\n```\n\n分析：元素通过 `push()` 添加到 `numsInQ`，该操作在队列的末尾（back），如第\
  \ 9-12 行所示。第 18-22 行的 `while` 循环显示队列头部元素，然后在第 21 行将其移除。输出显示元素按插入顺序从队列中删除，因为元素是从队列头部删除的。\n\
  \n### 使用 STL 优先级队列\n\nSTL `priority_queue` 是一个模板类，同样需要包含 `<queue>` 头文件。`priority_queue`\
  \ 与 `queue` 不同之处在于，最高值（或由二元谓词认为最高的值）位于队列的头部，且队列操作仅限于头部。\n\n### 实例化 `priority_queue`\
  \ 类\n\n`std::priority_queue` 类定义为：\n\n点击此处查看代码图片\n\n```cpp\ntemplate <\n   class\
  \ elementType,\n   class Container= vector<Type>,\n   class Compare=less<typename\
  \ Container::value_type>\n>\nclass priority_queue\n```\n\n在这里，`elementType` 是传递队列收集的元素类型的模板参数。第二个模板参数告诉\
  \ `priority_queue` 内部存储数据的集合类，而第三个参数允许程序员指定一个二元谓词，帮助队列确定顶部的元素。在没有指定二元谓词的情况下，`priority_queue`\
  \ 类使用 `std::less` 的默认值，它使用 `operator<` 比较两个对象。\n\n整数优先级队列最简单的实例化方式是\n\n\n\n\n\n\
  ```cpp\nstd::priority_queue <int> numsInPrioQ;\n```\n\n如果你想在 `std::deque` 中创建一个包含`double`\
  \ 类型元素的优先级队列`priority queue`）：\n\n点击此处查看代码图像\n\n```cpp\npriority_queue <int, deque\
  \ <int>, greater <int>> numsInDescendingQ;\n```\n\n就像栈（stack）一样，队列也可以作为另一个队列的拷贝来实例化：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::priority_queue <int> copyQ(numsInPrioQ);\n```\n\n`priority_queue`对象的实例化由列表\
  \ 24.5 所示。\n\n**列表 24.5** 实例化一个 STL `priority_queue`\n\n点击此处查看代码图像\n\n***\n\n```cpp\n\
  0: #include <queue>\n1: #include <functional>\n2:\n3: int main ()\n4: {\n5:    \
  \ using namespace std;\n6:\n7:     // 使用 std::less <>（默认）排序的 int 优先级队列\n8:     priority_queue\
  \ <int> numsInPrioQ;\n9:\n10:     // 一个 double 优先级队列\n11:     priority_queue <double>\
  \ dblsInPrioQ;\n12:\n13:     // 使用 std::greater <> 排序的整数优先级队列\n14:     priority_queue\
  \ <int, deque <int>, greater<int>> numsInDescendingQ;\n15:\n16:     // 作为另一个拷贝创建的优先级队列\n\
  17:     priority_queue <int> copyQ(numsInPrioQ);\n18:\n19:     return 0;\n20: }\n\
  ```\n\n分析 ![Image](img/arrow.jpg)\n\n第 8 行和第 11 行演示了分别为`int`和`double`对象实例化两个`priority_queue`。缺少其他模板参数会导致使用`std::vector`作为数据的内部容器，并且默认比较准则由`std::less`提供。因此，这些队列的优先级非常高，使得最大的整数位于优先级队列的头部。然而，`numsInDescendingQ`为第二个参数提供了一个`deque`作为内部容器，并使用`std::greater`作为谓词。该谓词导致队列中最小的数字位于头部。\n\
  \n使用谓词`std::greater<T>`的效果将在本节稍后在列表 24.7 中进行解释。\n\n***\n\n注意\n\n列表 24.5 包含了标准头文件\
  \ `<functional>`以使用`std::greater<>`。\n\n***\n\n### `priority_queue` 的成员函数\n\n`queue`中可用的成员函数`front()`和`back()`在`priority_queue`中不可用。表\
  \ 24.3 引入了`priority_queue`的成员函数。\n\n![Image](img/24tab03.jpg)\n\n**表 24.3** `std::priority_queue`的成员函数\n\
  \n如表所示，`queue`成员只能通过`top()`访问，它返回使用自定义谓词或在无谓词时使用`std::less`评估的最大值。\n\n通过`push()`和`pop()`在`priority_queue`的尾部插入和头部删除\n\
  \n在`priority_queue`中插入元素通过成员方法`push()`完成：\n\n点击此处查看代码图像\n\n```cpp\nnumsInPrioQ.push\
  \ (5); // 元素按排序组织\n```\n\n相反，通过`pop()`从头部删除：\n\n点击此处查看代码图像\n\n```cpp\nnumsInPrioQ.pop\
  \ (); // 删除头部元素\n```\n\n`priority_queue`成员的使用由列表 24.6 所示。\n\n**列表 24.6** 使用`push()`、`top()`和`pop()`操作`priority_queue`\n\
  \n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <queue>\n1: #include <iostream>\n2:\n\
  3: int main ()\n4: {\n5:     using namespace std;\n6:\n7:     priority_queue <int>\
  \ numsInPrioQ;\n8:     cout << \"Inserting {10, 5, -1, 20} into the priority_queue\"\
  \ << endl;\n9:     numsInPrioQ.push (10);\n10:     numsInPrioQ.push (5);\n11:  \
  \   numsInPrioQ.push (-1);\n12:     numsInPrioQ.push (20);\n13:\n14:     cout <<\
  \ \"Deleting the \" << numsInPrioQ.size () << \" elements\" << endl;\n15:     while\
  \ (!numsInPrioQ ())\n16:     {\n17:         cout << \"Deleting element: \" << numsInPrioQ.top\
  \ () << endl;\n18:         numsInPrioQ.pop ();\n19:     }\n20:\n21:     return 0;\n\
  22: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nInserting {10,\
  \ 5, -1, 20} into the priority_queue\nDeleting 4 elements\nDeleting element: 20\n\
  Deleting element: 10\nDeleting element: 5\nDeleting element: -1\n\n\n\n\n\n# Q 栈中间的元素可以被修改吗？\n\
  \n**A** - 不，因为这违背了 `stack`（栈）的用途，它被设计为一个后进先出的容器。\n\n# Q 我可以遍历队列（queue）中的所有元素吗？\n\
  \n**A** - `queue`（队列）没有提供迭代器，且 `queue` 中的元素只能在它的两端访问。\n\n# Q STL 算法可以与自适应容器配合吗？\n\
  \n**A** - STL 算法通过迭代器工作。由于 `stack` 和 `queue` 类都没有提供标记范围末尾的迭代器，因此无法在这些容器上使用 STL 算法。\n\
