  \ `hash_set` 吗？\n\n## 第 16 节. STL String 类\n\n标准模板库（STL）为程序员提供了一个有助于字符串操作和处理的容器类。`string`\
  \ 类不仅能够动态调整自身的大小以适应应用程序的需求，还提供了实用的辅助函数或方法，帮助处理和使用字符串。\n\n因此，它帮助程序员在应用程序中使用标准、可移植且经过测试的功能，并将精力集中在开发至关重要的特性上。\n\
  \n在本节中，你将学习到：\n\n![Image](img/square.jpg) 为什么字符串处理类是必要的\n\n![Image](img/square.jpg)\
  \ 如何使用 STL `string` 类\n\n![Image](img/square.jpg) STL 如何帮助你轻松地连接、追加、查找并执行其他字符串操作\n\
  \n![Image](img/square.jpg) 如何使用基于模板实现的 STL `string`\n\n![Image](img/square.jpg)\
  \ 自 C++14 起 STL `string` 支持的 `operator \"\"s` \n\n### 字符串处理类的必要性\n\n在 C++ 中，`string`\
  \ 是一个字符数组。正如你在第 4 节“管理数组和字符串”中所示，最简单的字符数组可以定义如下：\n\n```cpp\nchar staticName [20];\n\
  ```\n\n`staticName` 是一个固定为 20 个元素的（因此是静态的）字符数组（也称为字符串）的声明。如你所见，这个缓冲区可以存放有限长度的字符串，如果你尝试在其放入更多的字符，它很快就会溢出。调整这种静态分配的数组是不可能的。为了克服这一限制，C++\
  \ 提供了数据的动态分配。因此，`string array` 更具动态性的表示方式是：\n\n点击查看代码图像\n\n```cpp\nchar* dynamicName\
  \ = new char [arrayLen];\n```\n\n`dynamicName` 是一个动态分配的字符数组，可以实例化为值 `arrayLen` 中存储的长度，这可以在运行时确定，因此可以分配来持有变长度的数据。然而，如果你想在运行时更改数组的长度，必须先释放已分配的内存，然后重新分配以持有所需的数据。\n\
  \n如果这些 `char*` 字符串被用类的属性，情况就会变得复杂。当一个类的对象赋值给另一个对象时，如果没有正确编写拷贝构造函数和赋值运算符，这两个对象将包含指针的拷贝，本质上指向同一个。结果是两个对象中包含相同的指针，因此指向内存中的同一位置。第一个对象的析会导致另一个对象中的指针失效，崩溃迫在眉睫。\n\
  \n字符串类为你解决了这些问题。STL 字符串类建模字符字符串的 `string` 和建模宽字符字符串的 `wstring` 从以下方面帮助你：\n\n![Image](img/square.jpg)\
  \ 减少了字符串创建和处理的努力\n\n![Image](img/square.jpg) 通过内部管理内存分配增加了编写程序的稳定性\n\n![Image](img/square.jpg)\
  \ 特有的拷贝构造函数和赋值运算符自动确保成员被正确拷贝\n\n![Image](img/square.jpg) 提供实用的工具函数，例如截断、查找和删除等\n\
  \n![Image](img/square.jpg) 提供有助于比较的运算符\n\n![Image](img/square.jpg)让你将精力放在应用程序的主要需求上，而不是字符串处理细节\n\
  \n* *\n\n注意\n\n`std::string` 和 `std::wstring` 实际上是同一个类的模板特化，分别是针对类型 `char` 和 `wchar_t`\
  \ 的 `basic_string<T>`。当你学会了使用其中一个，就可以在另一个上使用相同的方法和运算符。\n\n* *\n\n你很快将学习 STL 字符串类提供的一些实用的辅助函数，以\
  \ `std::string` 为例。\n\n### 使用 STL String 类\n\n最常用的字符串函数有：\n\n![Image](img/square.jpg)\
  \ 拷贝\n\n![Image](img/square.jpg) 连接\n\n![Image](img/square.jpg) 查找字符和子字符串\n\n![Image](img/square.jpg)\
  \ 截断\n\n![Image](img/square.jpg) 字符串反转和大小写转换，这些是通过标准库提供的算法实现的\n\n要使用 STL 字符串类，必须包含头文件\
  \ `<string>`。\n\n####实例化 STL String 和拷贝\n\n\n\n\n\n`string` 类具有许多重载的构造函数，因此可以用许多不同的方式进行实例化和初始化。例如，你可以简单地将一个常量字符字符串字面量初始化或赋值给一个\
  \ STL `std::string` 对象：\n\n点击此处查看代码图像\n\n```cpp\nconst char* constCStyleString =\
  \ \"Hello String!\";\n\nstd::string strFromConst (constCStyleString);\n```\n\n或者\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::string strFromConst = constCStyleString;\n```\n\n上述操作类似于：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::string str2 (\"Hello String!\");\n```\n\n显而易见，实例化字符串对象并将其初始化为值不需要提供字符串的长度或内存分配细节——STL\
  \ string 类的构造函数会自动完成这些操作。\n\n同样，可以使用一个 `string` 对象来初始化另一个：\n\n点击此处查看代码图像\n\n```cpp\n\
  std::string str2Copy (str2);\n```\n\n你还可以指示 `string` 的构造函数只接受输入输入字符串的前 `n` 个字符：\n\
