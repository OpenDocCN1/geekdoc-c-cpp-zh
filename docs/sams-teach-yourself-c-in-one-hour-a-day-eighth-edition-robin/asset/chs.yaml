  \ 如何使用运算符 `new` 和 `delete` 来分配内存和释放内存\n\n![Image](img/square.jpg) 如何使用指针和动态分配编写稳定的应用程序\n\
  \n![Image](img/square.jpg) 什么是引用\n\n![Image](img/square.jpg) 指针和引用之间的区别\n\n![Image](img/square.jpg)\
  \ 何时使用指针，何时使用引用\n\n## 什么是指针？\n\n`pointer`（指针）也是一种变量——它存储内存中的地址。正如 `int` 类型的变量用于包含整数值一样，指针变量被用于包含内存地址，如图\
  \ 8.1 所示。\n\n![Image](img/08fig01.jpg)\n\n**图 8.1** 指针的可可视化。\n\n因此，指针是一个变量，和所有变量一样，指针在内存中占用空间（在图\
  \ 8.1 中，地址为 `0x101`）。指针的特殊之处在于，指针中所包含的值（在本例中为 `0x558`）被解释为内存地址。所以，指针是一个特殊的变量，*指向*内存中的某个位置。\n\
  \n***\n\n### 注意\n\n内存位置通常使用 `hexadecimal`（十六进制）表示法进行编号。这是一种 16 进制的计数系统，即包含 16 个不同符号：0–9\
  \ 后面跟着 A–F。在显示十六进制数时，习惯加上前缀 `0x`。因此，`0xA` 是十进制 10 的十六进制；`0xF` 是十进制 15 的十六进制；`0x10`\
  \ 是十进制 16 的十六进制。更多信息请参阅附录 A，“处理数字：二进制与十六进制.](#app01.html_app01)”\n\n***\n\n### 声明指针\n\
  \n指针作为变量也需要声明。你通常会声明一个指针指向特定的值类型（例如，`int`）。这意味着指针中包含的地址指向内存中存储整数的位置。你也可以指定一个指向内存块的指针（也称为空指针）。\n\
  \n指针作为变量，需要像所有变量一样进行声明：\n\n点击此处查看代码图像\n\n```PointedType * PointerVariableName;`\n\
  \n和大多数变量一样，除非你初始化指针，否则它将包含一个随机值。你不希望访问随机的内存地址，因此将指针初始化为 `NULL`。`NULL` 是一个可以被检查的值，且它不是一个内存地址：\n\
  \n点击此处查看代码图像\n\n```\nPointedType * PointerVariableName = NULL; // 初始化值\n```\n\n\
  因此，声明一个整数指针将是：\n\n`int *pointsToInt = NULL;`\n\n***\n\n### 警告\n\n指针和你学过的所有数据类型一样，除非经过初始化，否则它包含一个垃圾值。这种垃圾值在指针情况下特别危险，因为指针的值预期包含一个地址。未初始化的指针会导致你的程序访问无效的内存位置，从而导致崩溃。\n\
  \n***\n\n### 使用引用运算符 (`&`) 确定变量的地址\n\n变量是语言提供的用于处理内存中数据的工具。这一概念在第 3 节，“使用变量、声明常量.](#ch03.html_ch03)”中有详细解释。\n\
  \n如果 `varName` 是一个变量，`&varName` 给出其值所在所在的内存地址。\n\n所以，如果你声明了一个整数，使用你熟悉的语法，例如：\n\n\
  `int age = 30;`\n\n`&age` 就是值（`30`）放置的内存地址。列表 8.1 演示了整数变量内存地址的概念，该地址用于存储其包含的值。\n\
  \n**列表 8.1** 确定 `int` 和 `double` 的地址\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int age =\
  \ 30;\n6:     const double Pi = 3.1416;\n7:\n8:     // 使用 & 查找内存地址\n9:     cout\
  \ << \"Integer age is located at: 0x\" << &age << endl;\n10:     cout << \"Double\
  \ Pi is located at: 0x\" << &Pi << endl;\n11:\n12:     return 0;\n13: }\n```\n\n\
  ***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n```\nInteger age is located at:\
  \ 0x...\nDouble Pi is located at: 0x...\n```\n（注：源代码提供的文本在末尾包含重复的乱码片段；我已根据提供的技术上下文清理了逻辑流。）\n\
  \n## 使用指针存储地址\n\n你已经学习如何声明指针以及如何确定变量的地址。现在是使用指针存储地址了。\n\n假设你有一个变量：\n\n```cpp\nint\
  \ age = 30;\n```\n\n要将该变量的地址存储在指针中，你需要这样声明指针：\n\n```cpp\nint* pointsToInt = &age;\n\
  ```\n\n在列表列表 8.2](#ch08.html_ch08list02)中，你可以看到如何使用指针存储地址。\n\n**列表 8.2** 演示指针的声明与初始化\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     int age = 30;\n6:     int* pointsToInt = &age; // 初始化指针为\
  \ &age\n7:\n8:     // 显示指针的值\n9:     cout << \"Integer age is at: 0x\" << hex <<\
  \ pointsToInt << endl;\n10:\n11:     return 0;\n12: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n```\nInteger age is at: 0x0045FE00\n```\n\n***\n\n分析 ![Image](img/arrow.jpg)\n\
  \n上述代码段的输出显示了指针如何存储变量的内存地址。\n\n\n\n\n现在你已经知道如何在指针变量中存储地址，很容易想象，同一个指针变量可以被重新分配不同的内存地址，并使其指向不同的值，如列表\
  \ 8.3 所示。\n\n**列表 8.3** 将指针重新赋值给另一个变量\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int age =\
  \ 30;\n6:\n7:     int* pointsToInt = &age;\n8:     cout << \"pointsToInt points\
  \ to age now\" << endl;\n9:\n10:     // Displaying the value of pointer\n11:   \
  \  cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n12:\n13:     int\
  \ dogsAge = 9;\n14:     pointsToInt = &dogsAge;\n15:     cout << \"pointsToInt points\
  \ to dogsAge now\" << endl;\n16:\n17:     cout << \"pointsToInt = 0x\" << hex <<\
  \ pointsToInt << endl;\n18:\n19:     return 0;\n20: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\npointsToInt points to age now\npointsToInt = 0x002EFB34\npointsToInt\
  \ points to dogsAge now\npointsToInt = 0x002EFB1C\n\n分析 ![Image](img/arrow.jpg)\n\
  \n该程序演示了一个指向整数指针 `pointsToInt` 可以指向任何整数。在第 7 行中，它被初始化为 `&age`，因此包含了变量 `age` 的地址。在第\
  \ 14 行中，同一个指针被赋值为 `&dogsAge`，指向内存中包含 `dogsAge` 的另一个位置。相应地，输出表明指针的值（即指向的地址）发生了变化，因为两个整数\
  \ `age` 和 `dogsAge` 显然存储在内存中的不同位置，分别为 `0x002EFB34` 和 `0x002EFB1C`。\n\n### 使用解引用运算符\
  \ (`*`) 访问指向的数据\n\n你有一个指向指向的指针，其中包含一个有效地址。你如何访问该位置——即如何获取或设置该位置的数据呢？答案在于使用解引用运算符（`*`）。本质上，如果你有一个有效指针\
  \ `pData`，使用 `*pData` 来访问存储在指针所包含地址处的值。列表 8.4 演示了该运算符（`*`）。\n\n**列表 8.4** 演示使用解引用运算符\
  \ (`*`) 访问整数值\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     int age = 30;\n6:     int dogsAge = 9;\n\
  7:\n8:     cout << \"Integer age = \" << age << endl;\n9:     cout << \"Integer\
  \ dogsAge = \" << dogsAge << endl;\n10:\n11:     int* pointsToInt = &age;\n12: \
  \    cout << \"pointsToInt points to age\" << endl;\n13:\n14:     // Displaying\
  \ the value of pointer\n15:     cout << \"pointsToInt = 0x\" << hex << pointsToInt\
  \ << endl;\n16:\n17:     // Displaying the value at the pointed location\n18:  \
  \   cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n19:\n20:     pointsToInt\
  \ = &dogsAge;\n21:     cout << \"pointsToInt points to dogsAge now\" << endl;\n\
  22:\n23:     cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n24:  \
  \   cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n25:\n26:     return\
  \ 0;\n27: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nInteger\
  \ age = 30\nInteger dogsAge = 9\npointsToInt points to age\npointsToInt = 0x0025F788\n\
  *pointsToInt = 30\npointsToInt points to dogsAge now\npointsToInt = 0x0025F77C\n\
  *pointsToInt = 9\n\n分析 ![Image](img/arrow.jpg)\n\n除了像之前的示例 列表 8.3 中那样更改指针内部存储的地址外，这个示例还使用同一个指针变量\
  \ `pointsToInt` 通过解引用运算符（`*`）打印了这两个地址的不同值。注意第 18 行和第 24 行。在这两行中，都使用解引用运算符（`*`）访问了\
  \ `pointsToInt` 指向的整数。由于 `pointsToInt` 在第 20 行更改了地址，赋值后的同一个指针访问了变量 `dogsAge`，显示为\
  \ 9。\n\n使用解引用运算符（`*`）时，应用程序本质上使用存储在指针中的地址作为起点，从内存中获取整数所需的 4 个字节（因为这是一个指向整数的指针，且\
  \ `sizeof(int)` 为 4）。因此，指针中地址的有效性至关重要。通过在第 11 行将指针初始化为 `&age`，你确保了指针包含一个有效地址。如果你不初始化指针，它可能包含任何随机值（存在指针变量所在内存位置中的值），而对该指针进行解引用通常会导致访问冲突（Access\
  \ Violation）——即访问了应用程序无权访问的内存位置。\n\n* * *\n\n注意\n\n解引用运算符（`*`）也称为间接运算符（indirection\
  \ operator）。\n\n* * *\n\n你在上一个示例中使用指针从内存位置读取（获取）值。列表 8.5 显示了当使用 `pointsToInt` 而不仅仅是赋值时会发生什么。\n\
  \n**列表 8.5** 使用指针和解引用运算符操作数据\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int age = 30;\n6:     int\
  \ dogsAge = 9;\n7:\n8:     cout << \"Integer age = \" << age << endl;\n9:     cout\
  \ << \"Integer dogsAge = \" << dogsAge << endl;\n10:\n11:     int* pointsToInt =\
  \ &age;\n12:     cout << \"pointsToInt points to age\" << endl;\n13:\n14:     //\
  \ Displaying the value of pointer\n15:     cout << \"pointsToInt = 0x\" << hex <<\
  \ pointsToInt << endl;\n16:\n17:     // Displaying the value at the pointed location\n\
  18:     cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n19:\n20:  \
  \   pointsToInt = &dogsAge;\n21:     cout << \"pointsToInt points to dogsAge now\"\
  \ << endl;\n22:\n23:     cout << \"pointsToInt = 0x\" << hex << pointsToInt << endl;\n\
  24:     cout << \"*pointsToInt = \" << dec << *pointsToInt << endl;\n25:\n26:  \
  \   return 0;\n27: }\n```\n\n\n\n\n```cpp\n11:    cout << \"sizeof(char*) = \" <<\
  \ sizeof(char*) << endl;\n12:    cout << \"sizeof(int*) = \" << sizeof(int*) <<\
  \ endl;\n13:    cout << \"sizeof(double*) = \" << sizeof(double*) << endl;\n14:\n\
  15:    return 0;\n16: }\n```\n\n* *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n基本类型的大小 -\n\nsizeof(char) = 1\n\nsizeof(int) = 4\n\nsizeof(double) = 8\n\n指向基本类型指针的大小\
  \ -\n\nsizeof(char*) = 4\n\nsizeof(int*) = 4\n\nsizeof(double*) = 4\n\n分析 ![Image](img/arrow.jpg)\n\
  \n输出清晰地显示，尽管 `sizeof(char)` 是 1 字节而 `sizeof(double)` 是 8 字节，但 `sizeof(char*)` 和\
  \ `sizeof(double*)` 都是 4 字节。这是因为存储地址的指针所消耗的内存量是相同的，无论地址处的内存包含 1 字节还是 8 字节的数据。\n\n\
  * *\n\n### 注意\n\n列表 8.6 显示指针的 `sizeof` 为 4 字节的输出可能与你在系统上看到的不同。该输出是在使用 32 位编译器编译代码时生成的。如果你使用\
  \ 64 位编译器并在 64 位系统上运行程序，你可能会发现你的指针变量的 `sizeof` 是 64 位——即 8 字节。\n\n* *\n\n### 动态内存分配\n\
  \n当你编写一个包含数组声明的程序时：\n\n点击此处查看代码图像\n\n```cpp\nint myNums[100]; // 一个包含 100 个整数的静态数组\n\
  ```\n\n你的程序存在两个问题：\n\n1. 你实际上限制了程序的容量，因为它无法存储超过 100 个数字。\n2. 在只需要存储 1 个数字的情况下，你为\
  \ 100 个数字预留了空间，从而降低了系统的性能。\n\n这些问题的存在是因为按之前声明的数组内存分配是静态的，并由编译器固定。\n\n为了编写一个能够根据用户需求优化消耗内存资源的应用程序，你需要使用动态内存分配。这允许你在需要更多内存时分配更多内存，并在内存过余时释放内存。C++\
  \ 提供了两个运算符 `new` 和 `delete` 来帮助你更好地管理应用程序的内存消耗。指针作为存储内存地址的变量，在高效的动态内存分配中起着至关重要的作用。\n\
  \n#### 使用运算符 `new` 和 `delete` 动态分配和释放内存\n\n你使用 `new` 来分配新的内存块。`new` 最常用的形式在成功时返回指向请求内存的指针，否则抛出异常。使用\
  \ `new` 时，你需要指定为何种数据类型分配内存：\n\n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type; //\
  \ 为一个元素请求内存\n```\n\n你还可以指定想要为该内存分配的元素数量（当你需要为多个一个元素分配内存时）：\n\n点击此处查看代码图像\n\n```cpp\n\
  Type* Pointer = new Type[numElements]; // 为 numElements 请求内存\n```\n\n因此，如果你需要分配整数，请使用以下语法：\n\
  \n点击此处查看代码图像\n\n```cpp\nint* pointToAnInt = new int;  // 获取一个整数的指针\nint* pointToNums\
  \ = new int[10];  // 指向包含 10 个整数的块的指针\n```\n\n* *\n\n### 注意\n\n注意 `new` 表示对内存的请求。不能保证分配调用总是成功，因为这取决于系统状态和内存资源的可用性。\n\
  \n* *\n\n每个使用 `new` 的分配最终都需要通过 `delete` 进行对等且相反的去分配操作来释放：\n\n点击此处查看代码图像\n\n```cpp\n\
  Type* Pointer = new Type; // 分配内存\ndelete Pointer;  // 释放上面分配的内存\n```\n\n此规则也适用于你请求多个元素的内存时：\n\
  \n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type[numElements]; // 分配一个块\ndelete[]\
  \ Pointer; // 释放上面分配的块\n```\n\n* *\n\n### 注意\n\n注意在使用 `new[...]` 分配块时使用 `delete[]`，以及在使用\
  \ `new` 分配单个元素时使用 `delete`。\n\n* *\n\n如果你在停止使用分配的内存后不释放它，该内存将保持保留并分配给你的应用程序。这反过来减少了应用程序可用的系统内存量，甚至可能让你的应用程序运行变慢。这被称为*泄漏*\
  \ (leak)，应该避免。列表 8.7 演示了这一点。\n\n#### 列表 8.7 使用 `new` 分配内存并通过 `*` 使用 `delete` 释放\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
  \ {\n    // 为 int 请求内存\n    int* pointsToAge = new int;\n\n    // 使用间接引用访问值\n  \
  \  cout << \"Enter dog’s age: \";\n    cin >> *pointsToAge;\n\n    // 显示值\n    cout\
  \ << \"Age \" << *pointsToAge << \" is stored at 0x\" << hex << pointsToAge << endl;\n\
  \n    // 释放内存\n    delete pointsToAge;\n\n    return 0;\n}\n```\n\n* *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nEnter dog’s age: 9\nAge 9 is stored at 0x\n\n分析 ![Image](img/arrow.jpg)\
  \ 注意 `new` 返回指针，这就是为什么它被赋值的原因。用户输入的年龄存储在新分配的内存中。\n\n* *\n\n### 注意\n\n运算符 `delete`\
  \ 不能作用于任何地址，而是由 `new` 返回且尚未释放的地址。列表 8.6 包含有效地址，但不应使用 `delete` 释放。\n\n* *\n\n注意当使用\
  \ `new[...]` 分配一组元素时，应使用 `delete[]` 进行去分配，如列表 8.8 所示。\n\n#### 列表 8.8 使用 `new[...]`\
  \ 分配并使用 `delete[]` 释放\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n#include <string>\n\
  using namespace std;\n\nint main() {\n    cout << \"How many integers shall I reserve\
  \ memory for?\" << endl;\n    int numEntries = 0;\n    cin >> numEntries;\n\n  \
  \  int* myNumbers = new int[numEntries];\n\n    cout << \"Memory allocated at: 0x\"\
  \ << hex << myNumbers << endl;\n\n    // 退出前去分配\n    delete[] myNumbers;\n\n   \
  \ return 0;\n}\n```\n\n* *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nHow many\
  \ integers shall I reserve memory for?\n\n5001\nMemory allocated at: 0x00C71578\n\
  \n\n\n\n\n问题中最重要的代码行是分别用在第 10 行和第 15 行的 `new[]` 和 `delete[]` 运算符。此示例与列表 8.7 的不同之处在于，它动态分配了一块可以容纳用户请求数量整数的内存。在执行期间，我们请求了\
  \ 5001 个整数的空间。在另一次运行中，可能是 20 或 55000。该程序将根据用户输入在每次执行时分配不同数量的内存。元素数组的此类分配在完成后需要使用\
  \ `delete[]` 进行释放以释放内存。\n\n***\n\n### 注释\n\n`new` 和 `delete` 运算符从空闲存储（free store）分配内存。空闲存储是以内存池形式存在的内存抽象，你的应用程序可以在其中分配（即预留）内存并向其释放（即回收）内存。\n\
  \n***\n\n### 增增和减运算符（`++` 和 `--`）对指针的影响\n\n指针包含一个内存地址。例如，列表 8.3 中指向整数的指针包含 `0x002EFB34`——该整数所在的地址。整数本身长度为\
  \ 4 字节，因此在内存中占据从 `0x002EFB34` 到 `0x002EFB37` 的四个位置。使用运算符（`++`）增加此指针不会导致指针指向 `0x002EFB35`，因为指向整数的中间实际上毫无意义。\n\
  \n指针的递增或递减操作被编译器解释为你需要指向内存块中的下一个值（假设其具有相同类型），而不是下一个字节（除非值类型的大小为 1 字节，例如 `char`）。\n\
  \n因此，递增列表 8.3 中看到的类似 `pointsToInt` 的指针会导致其增加 4 字节，即一个 `int` 的 `sizeof`。在此指针上使用 `++`\
  \ 是告诉编译器你希望它指向下一个连续的整数。因此，递增后，指针将指向 `0x002EFB38`。同样，对此指针加 2 将导致其向前移动 2 个整数，即向前移动\
  \ 8 字节。随后你会发现指针展示的这种行为与数组中使用的索引之间存在关联。\n\n使用运算符（`--`）递减指针展示了相同的效果——指针中包含的地址值减少了其所指向的数据类型的\
  \ `sizeof`。\n\n***\n\n### 当你递增或递减指针时发生了什么？\n\n指针中包含的地址根据所指向类型的 `sizeof` 增加或减少（而不一定是一个字节）。通过这种方式，编译器确保指针永远不会指向内存中放置数据的中间或结尾；它只指向开头。\n\
  \n如果指针被声明为：\n\n```cpp\nType* pType = Address;\n```\n\n`++pType` 意味着 `pType` 包含（并指向）`Address\
  \ + sizeof(Type)`。\n\n***\n\n参见列表 8.9，它解释了递增指针或对其添加偏移量的影响。\n\n**列表 8.9** 使用偏移值和运算符递增和递减指针\n\
  \n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: int main()\n4: {\n5:     cout << \"How many integers you wish to enter? \"\
  ;\n6:     int numEntries = 0;\n7:     cin >> numEntries;\n8:\n9:     int* pointsToInts\
  \ = new int [numEntries];\n10:\n11:     cout << \"Allocated for \" << numEntries\
  \ << \" integers\" << endl;\n12:     for(int counter = 0; counter < numEntries;\
  \ ++counter)\n13:     {\n14:         cout << \"Enter number \"<< counter << \":\
  \ \";\n15:         cin >> *(pointsToInts + counter);\n16:     }\n17:\n18:     cout\
  \ << \"Displaying all numbers entered: \" << endl;\n19:     for(int counter = 0;\
  \ counter < numEntries; ++counter)\n20:         cout << *(pointsToInts++) << \"\
  \ \";\n21:\n22:     // ... logic continues\n23:\n24: \n25:\n26:     delete[] pointsToInts;\n\
  27:\n28:     return 0;\n29: }\n```\n（注：上面的代码块根据所提供文本逻辑进行了清理和格式化）\n\n\n\n\n![Image](img/square.jpg)\
  \ 指针中包含的地址和所指向的值都是常量，不能更改（限制性最大的变体）：\n\n点击此处查看代码图像\n\n```cpp\nint hoursInDay = 24;\n\
  \nconst int* const pHoursInDay = &hoursInDay;\n\n*pHoursInDay = 25; // Not OK! Cannot\
  \ change data being pointed to\n\nint daysInMonth = 30;\n\npHoursInDay = &daysInMonth;\
  \ // Not OK! Cannot change address\n```\n\n这些不同的 `const` 在将指针传递给函数时特别有用。函数参数需要声明为支持最高级别（限制性最大）的\
  \ `const` 属性，以确保函数在不应该修改时不修改所指向的值。这可以防止应用程序的程序员对指针值或数据进行意外的更改。\n\n## 将指针传递给函数\n\n\
  指针是向函数传递包含相关数据的内存空间的有效方式。共享的内存空间也可以返回操作的结果。在与函数一起使用指针时，确保被调函数仅允许修改你希望它修改的参数，而不是其他参数，变得至关重要。例如，一个通过指针传递半径并计算圆面积的函数不应该被允许修改半径。这就是你使用\
  \ `const` 关键字来控制函数允许和不允许修改的内容，如 列表 8.10 所示。\n\n**列表 8.10** 在计算圆面积时使用 `const` 关键字\n\
  \n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: void CalcArea(const double* const ptrPi, // const pointer to const data\n\
  4:             const double* const ptrRadius, // i.e. no changes allowed\n5:   \
  \          double* const ptrArea)  // can change data pointed to\n6: {\n7:     //\
  \ check pointers for validity before using\n8:     if (ptrPi && ptrRadius && ptrArea)\n\
  9:         *ptrArea = (*ptrPi) * (*ptrRadius) * (*ptrRadius);\n10: }\n11:\n12: int\
  \ main()\n13: {\n14:     const double Pi = 3.1416;\n15:\n16:     cout << \"Enter\
  \ radius of circle: \";\n17:     double radius = 0;\n18:     cin >> radius;\n19:\n\
  20:     double area = 0;\n21:     CalcArea (&Pi, &radius, &area);\n22:\n23:    \
  \ cout << \"Area is = \" << area << endl;\n24:\n25:     return 0;\n26: }\n```\n\n\
  * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter radius of circle: 10.5\n\
  Area is = 346.361\n\n## 分析 ![Image](img/arrow.jpg)\n\n第 3–5 行演示了 `const` 的两种形式，其中\
  \ `ptrRadius` 和 `ptrPi` 作为“指向数据的常量指针”，因此指针地址和所指向的数据都不能被修改。`ptrArea` 显然是用于存储输出的参数，因为指针（地址）的值不能修改，但所指向的数据可以。第\
  \ 8 行显示了在使用前对函数的指针参数进行有效性检查。你不希望调用者不小心发送 NULL 指针作为三个参数之一，因为会导致访问违规并引发应用程序崩溃。\n\n\
  ## 数组与指针的相似之处\n\n你不认为列表 8.9 中的示例（通过从零开始的索引增加指针来访问内存中的下一个整数）与数组索引的方式有太多相似之处吗？当你声明一个整数数组时：\n\
  \n```cpp\nint myNumbers[5];\n```\n\n你告诉编译器分配固定数量的内存来存储五个整数，并给你一个指向该数组中第一个元素的指针，换句话说，`myNumbers`\
  \ 是指向第一个元素 `myNumbers[0]` 的指针。列表 8.11 强调了这一点。\n\n**列表 8.11** 证明数组变量是一个指针\n\n点击此处查看代码图像\n\
  \n* *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n\
  4: {\n5:     // Static array of 5\n6:     int myNumbers[5];\n7:\n8:     // Pointer\
  \ to int\n9:     int* pointNums = myNumbers;\n10:\n11:     // Address contained\
  \ in\n12:     cout << \"pointNums = 0x\" << hex << pointNums << endl;\n13:\n14:\
  \     // Address of first element\n15:     cout << \"&myNumbers[0] = 0x\" << hex\
  \ << &myNumbers[0] << endl;\n16:\n17:     return 0;\n18: }\n```\n\n\n\n\n因此，该程序演示了数组\
  \ `myNumbers` 和指针 `pointToNums` 实际上都表现出指针行为。换句话说，数组声明类似于创建一个指针，该指针将在固定范围内存范围内操作。请注意，你可以像第\
  \ 11 行那样将数组赋值给指针，但不能将指针赋值给数组。因为从本质上说，像 `myNumbers` 这样的数组是静态的，不能作为左值。`myNumbers`\
  \ 无法修改。\n\n***\n\n### 注意\n\n重要的是，使用 `new` 运算符动态分配的指针仍然需要使用 `delete` 运算符进行释放，即使你使用了通常用于静态数组的语法来访问数据。\n\
  \n如果你忘记了这一点，你的应用程序就会发生内存泄漏，这是糟糕的。\n\n***\n\n### 使用指针时的常见编程错误\n\nC++ 允许你动态分配内存，以便优化和控制应用程序的内存消耗。与\
  \ C# 和 Java 等基于运行时环境的较新语言不同，C++ 并不具备自动垃圾回收器来清理程序分配但无法使用的内存。这种通过指针对内存资源进行管理的惊人控制力，也伴随着许多犯错的机会。\n\
  \n### 内存泄漏\n\n这可能是 C++ 应用程序中最常见的问题之一：运行时间越长，消耗的内存就越多，系统运行得越慢。这通常发生在程序员没有确保在内存块不再需要时，通过与之匹配的\
  \ `delete` 调用来释放使用 `new` 动态分配的内存。\n\n这由你——程序员——来负责，确保所有分配的内存都由你的应用程序释放。这种情况永远不应该发生：\n\
  \n点击此处查看代码图片\n\n```cpp\nint* pointToNums = new int[5]; // initial allocation\n\n\
  // use pointToNums\n\n...\n\n// 忘记使用 delete[] 释放 pointToNums;\n\n...\n\n// 进行另一次分配并覆盖\n\
  \npointToNums = new int[10]; // 泄漏了之前分配的内存\n```\n\n#### 当指针未指向有效的内存位置时\n\n当你使用运算符（`*`）对指针进行解引用以访问指向的值时，你需要确保指针包含一个有效的内存位置，否则你的程序将崩溃或运行异常。尽管这听起来很合逻辑，但无效指针是应用程序崩溃的常见原因。指针可能由于多种原因而无效，主要是由于糟糕糟糕和内存管理不当。指针可能无效的一个典型案例如\
  \ 列表 8.13 所示。\n\n**列表 8.13** 使用指针存储布尔值的程序中糟糕的指针卫生习惯\n\n点击此处查看代码图片\n\n***\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  // 未初始化的指针（坏）\n6:     bool* isSunny;\n7:\n8:     cout << \"Is it sunny (y/n)?\
  \ \";\n9:     char userInput = 'y';\n10:     cin >> userInput;\n11:\n12:     if\
  \ (userInput == 'y')\n13:     {\n14:         isSunny = new bool;\n15:         *isSunny\
  \ = true;\n16:     }\n17:\n18:     // 如果用户输入 'n'，isSunny 包含无效值\n19:     cout <<\
  \ \"Boolean flag sunny says: \" << *isSunny << endl;\n20:\n21:     // 在 new 未调用时也调用了\
  \ delete\n22:     delete isSunny;\n23:\n24:     return 0;\n25: }\n```\n\n***\n\n\
  Output ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\nIs it sunny (y/n)? y\n\nBoolean\
  \ flag sunny says: 1\n\n第二次运行：\n\nIs it sunny (y/n)? n\n\n<CRASH!>\n\nAnalysis ![Image](img/arrow.jpg)\n\
  \n程序中有许多问题，其中一些已经在代码中注释过。注意第 14 行中是如何分配内存并赋值给指针的，该代码在用户按下‘y’表示是时按条件执行的。对于用户的其他所有输入，此\
  \ `if` 块都不会执行，指针 `isSunny` 保持为无效状态。因此，当用户在第二次运行中按下‘n’时，应用程序崩溃了，因为 `isSunny` 包含一个无效的内存地址，在第\
  \ 19 行对无效指针进行解引用导致了问题。\n\n同样，如第 22 行所示，对这个没有通过 `new` 分配的指针调用 `delete` 同样是错误的。注意，如果你有一个指针的副本，你只需要对其中一个调用\
  \ `delete`（你还需要避免让指针的副本四处漂浮）。\n\n该程序的一个更好（更安全、更稳定）的版本是：对指针进行初始化，仅在值有效时使用，并且仅在有效时释放一次。\n\
  \n#### 悬空指针（也称为野指针或随机指针）\n\n注意，任何有效指针在通过 `delete` 释放后都是无效的。换句话说，即使是 列表 8.13 中的有效指针\
  \ `isSunny` 在第 22 行调用 `delete` 后也会失效，且在此点之后不应再次使用。\n\n为了避免这个问题，一些程序员遵循一种约定：在初始化指针或在删除指针后给其赋值\
  \ `NULL`。他们在使用在使用运算符（`*`）解引用指针之前，总是会通过与 `NULL` 比较来检查指针的有效性。\n\n###了在使用指针时的一些典型问题后，是时候修正\
  \ 列表 8.13 中的错误代码了，如 列表 8.14 所示。\n\n**列表 8.14** 更安全的指针编程，对 列表 8.13 的修正\n\n点击此处查看代码图片\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n\
  4: {\n5:     cout << \"Is it sunny (y/n)? \";\n6:     char userInput = 'y';\n7:\n\
  8:     cin >> userInput;\n9:\n10:     // 声明指针并初始化\n11:     bool* const isSunny =\
  \ new bool;\n12:     *isSunny = true;\n13:\n14:     if (userInput == 'n')\n15: \
  \        *isSunny = false;\n16:\n17:     cout << \"Boolean flag sunny says: \" <<\
  \ *isSunny << endl;\n18:\n19:     // 释放有效内存\n20:     delete isSunny;\n21:\n22: \
  \    return 0;\n23: }\n```\n\n***\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\
  \nIs it sunny (y/n)? y\n\nBoolean flag sunny says: 1\n\n下次运行：\n\n点击此处查看代码图片\n\n\
  Is it sunny (y/n)? n\n\nBoolean flag sunny says: 0\n\n（无论用户输入什么都不会崩溃。）\n\nAnalysis\
  \ ![Image](img/arrow.jpg)\n\n微小的重构使得代码对于所有用户输入都更加安全。注意指针在第 10 行声明时是如何初始化为有效内存地址的。我们使用\
  \ `const` 来确保所指向的数据可以修改，但指针值（包含的地址）保持固定且不可更改。我们还在第 11 行将所指向的布尔值初始化为 `true`。这种数据初始化并没有增加程序的稳定性，但增加了输出的可靠性。这些步骤确保了指针在程序的剩余部分是有效的，并且在每种输入组合下都在第\
  \ 19 行安全释放。\n\n#### 检查使用 `new` 的分配请求是否成功\n\n\n\n\n在我们目前为止的代码中，我们假设 `new` 会返回一个指向内存块的有效指针。事实上，`new`\
  \ 通常会成功，除非应用程序请求了异常大量的内存，或者系统处于这样一种关键状态，以至于没有空闲内存。某些应用程序需要请求大块内存（例如，数据库应用程序）。此外，不简单地假设内存分配请求总是成功的是好的。C++\
  \ 为你提供了两种可能的方法，以在你在使用指针之前确保它是有效的。默认方法——即我们迄为止一直使用的方法——使用`exceptions`（异常），其中分配失败会导致`throw`（抛出）一个类型为\
  \ `std::bad_alloc` 的异常。异常会导致应用程序的执行被中断，除非你编写了`exception handler`（异常处理程序），否则你的应用程序将以一种不优雅的方式结束，并显示错误消息“unhandled\
  \ exception”（未处理异常）。\n\n异常在第 28 节“异常处理”中进行了详细解释。列表 8.15 让你预览如何使用异常处理来检查失败的分配请求。如果在这个阶段觉得异常处理扑目无从，不要太担心——在这里提到它只是为了内存分配主题的完整性。你可以在学习完第\
  \ 28 节后再次查看此示例。\n\n**列表 8.15** 处理异常，当 `new` 失败时优雅退出\n\n点击此处查看代码图像\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\n\n// 移除 try-catch 块以查看此程序的崩溃\nint main()\n{\n\
  \    try\n    {\n        // 请求大量的内存！\n        int* pointsToManyNums = new int [0x1fffffff];\n\
  \        // 使用分配的内存\n\n        delete[] pointsToManyNums;\n    }\n    catch (bad_alloc)\n\
  \    {\n        cout << \"Memory allocation failed. Ending program\" << endl;\n\
  \    }\n    return 0;\n}\n```\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nMemory\
  \ allocation failed. Ending program\n\n分析 ![Image](img/arrow.jpg)\n\n此程序在你的计算机上执行情况可能会不同。我的环境未能成功为\
  \ 536870911 个整数分配请求的空间！如果我没有编写异常处理程序（你在 14–17 行看到的 `catch` 块），程序将非常狼狈地结束。你可以通过注释第\
  \ 6、7 行和 13–17 行来实验在没有异常处理程序的情况下程序的行为。在使用使用 Microsoft Visual Studio 构建的调试模式二进制文件时，程序执行结果如图\
  \ 8.2 所示。\n\n![Image](img/08fig02.jpg)\n\n**图 8.2** 列表 8.15 中缺少异常处理时的程序崩溃（使用 MSVC\
  \ 编译器的调试版本）。\n\n异常处理 `try-catch` 结构因此帮助应用程序在通知用户内存分配问题阻碍正常执行后，进行受控退出。\n\n对于那些不想依赖异常的人，有一种\
  \ `new` 的变体称为 `new(nothrow)`。这种变体在分配失败时不会抛出异常，而是导致运算符 `new` 返回 `NULL`。因此，在使用赋值的指针之前可以相对于\
  \ `NULL` 检查其有效性。参见列表 8.16。\n\n**列表 8.16** 使用 `new(nothrow)` 在分配失败时返回 `NULL`\n\n\
  点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
  {\n    // 请求大量的内存空间，使用 nothrow\n    int* pointsToManyNums = new(nothrow) int [0xfffffff];\n\
  \n    if (pointsToManyNums) // 检查 pointsToManyNums != NULL\n    {\n        // 使用分配的内存\n\
  \        delete[] pointsToManyNums;\n    }\n    else\n    {\n        cout << \"\
  Memory allocation failed. Ending program\" << endl;\n    }\n    return 0;\n}\n```\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nMemory allocation failed. Ending program\n\
  \n分析 ![Image](img/arrow.jpg)\n\n列表 8.16 与列表 8.15 的函数相同，区别在于它使用了 `new(nothrow)`。由于这种变体形式\
  \ `new` 在分配失败时返回 `NULL`，因此我们在第 8 行在使用之前检查了指针。`new` 的两种变体都是好的，选择由你决定。\n\n### 指针最佳实践\n\
  \n在应用程序中使用指针时，有一些基本规则会让你的生活变得更容易。\n\n### 应该 (DO)\n**应该** 始终初始化指针变量，否则它们将包含垃圾值。\n\
  **应该** 确保在使用指针之前内存是有效的。\n**应该** 记住在不再需要内存时释放的内存。\n\n#### 不要 (DON'T)\n**不要** 在指针未初始化时使用它。\n\
  **不要** 在指针释放后访问它。\n**不要** 忘记释放不再需要的内存。\n\n## 什么是引用？\n\n引用是变量的别名。当你声明引用时，你需要对其进行初始化。因此，引用是访问存储在变量中的数据的另一种方式。\n\
  \n你会使用引用运算符 `&` 来声明引用，如下所示：\n\n```\nVarType original;\nVarType& Reference = original;\n\
  ```\n\n要进一步了解如何声明和使用引用，请参见列表 8.17。\n\n**列表 8.17** 证明引用是赋值值的别名\n\n点击此处查看代码图像\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int original\
  \ = 30;\n    cout << \"original = \" << original << endl;\n    cout << \"original\
  \ is at address: \" << hex << &original << endl;\n\n    int& ref1 = original;\n\
  \    cout << \"ref1 is at address: \" << hex << &ref1 << endl;\n\n    int& ref2\
  \ = ref1;\n    cout << \"ref2 is at address: \" << hex << &ref2 << endl;\n    cout\
  \ << \"Therefore, ref2 = \" << dec << ref2 << endl;\n\n    return 0;\n}\n```\n输出\
  \ ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\noriginal = 30\noriginal is at address:\
  \ 0099F764\nref1 is at address: 0099F764\nref2 is at address: 0099F764\nTherefore,\
  \ ref2 = 30\n\n分析 ![Image](img/arrow.jpg)\n\n输出证明了引用，无论是像第 12 行那样初始化为引用，都指向原始变量所在的相同内存位置。因此，引用是真正的别名——也就是说，`original`\
  \ 的另一个名称。在第 14 行使用 `ref2` 显示值与第 6 行使用 `original` 获取的值相同，因为 `ref2` 别名 `original`\
  \ 并且位于相同的内存位置。\n\n### 为什么引用很有用？\n\n\n\n\n引用（References）允许你对初始化所在的内存位置进行操作。这使得引用在编写函数时特别有用。正如你在第\
  \ 7 节中所学的，“使用函数组织代码”，一个典型的函数声明如下：\n\n点击此处查看代码图像\n\n```\nReturnType DoSomething(Type\
  \ parameter);\n```\n\n函数 `DoSomething()` 的调用方式如下：\n\n点击此处查看代码图像\n\n```\nReturnType\
  \ Result = DoSomething(argument); // 函数调用\n```\n\n上述代码会导致 `argument` 被复制到 `Parameter`\
  \ 中，然后由函数 `DoSomething()` 使用。如果涉及的 `argument` 消耗大量内存，这个复制步骤可能会产生相当大的开销。同样，当 `DoSomething()`\
  \ 返回一个值时，它会被再次复制到 `Result`。如果我们能够避免或消除这些复制步骤，让函数直接处理调用者栈中的数据，那将是理想的。引用恰恰允许你做到这一点。\n\
  \n不包含复制步骤的版本如下：\n\n点击此处查看代码图像\n\n```\nReturnType DoSomething(Type& parameter); //\
  \ 注意引用&\n```\n\n该函数的调用方式如下：\n\n点击此处查看代码图像\n\n```\nReturnType Result = DoSomething(argument);\n\
  ```\n\n由于参数是通过引用传递的，`Parameter` 并不是 `argument` 的副本，而是后者的一个别名，就像列表 8.17 中的 `Ref`\
  \ 一样。此外，接受引用作为参数的函数可以选择使用引用参数来返回值。请参考列表 8.18 以了解函数如何使用引用代替返回值。\n\n### 列表 8.18 通过引用参数返回计算平方的函数\n\
  \n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: void GetSquare(int& number)\n4: {\n5:     number *= number;\n6: }\n7:\n8:\
  \ int main()\n9: {\n10:     cout << \"Enter a number you wish to square: \";\n11:\
  \     int number = 0;\n12:     cin >> number;\n13:\n14:     GetSquare(number);\n\
  15:     cout << \"Square is: \" << number << endl;\n16:\n17:     return 0;\n18:\
  \ }\n```\n* *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter a number you\
  \ wish to square: 5\n\nSquare is: 25\n\n## 分析 ![Image](img/arrow.jpg)\n\n执行平方操作的函数位于第\
  \ 3–6 行。注意它是如何通过引用参数接收待平方的数字并以相同方式返回结果的。如果你忘记将参数 `number` 标记为引用（`&`），结果将无法到达调用函数\
  \ `main()`，因为 `GetSquare()` 将会在 `number` 的本地副本上执行操作，该副本会在函数退出时被销毁。使用引用，你可以确保 `GetSquare()`\
  \ 在 `main()` 中定义 `number` 的相同地址空间内运行。因此，即使在函数 `GetSquare()` 退出后，`main()` 中依然可用。\n\
  \n在该示例中，包含用户发送数字的输入参数被修改了。如果你需要两个值（原始值和平方值），可以让函数接受两个参数：一个包含输入，另一个提供平方值。\n\n###\
  \ 在引用上使用 `const` 关键字\n\n你可能需要某些不允许更改所别名原始变量值的引用。在声明此类引用时使用 `const` 是实现该目标的方法：\n\n\
  点击此处查看代码图像\n\n```cpp\nint original = 30;\nconst int& constRef = original;\nconstRef\
  \ = 40; // 不允许：constRef 无法改变 original 中的值\nint& ref2 = constRef; // 不允许：ref2 不是\
  \ const\nconst int& constRef2 = constRef; // 允许\n```\n\n#### 将参数通过引用传递给函数\n\n引用的主要优势之一是它们允许被调用函数直接处理未从调用者函数复制的参数，从而显著提高性能。然而，由于被调用函数是直接在调用者函数的栈上使用参数工作，因此确保被调用函数无法更改调用者端变量的值通常是重要的。\n\
  \n### 列表 8.19 使用 `const` 引用确保调用函数无法修改值\n\n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: void GetSquare(const int& number,\
  \ int& result)\n4: {\n5:     result = number * number;\n6: }\n7:\n8: int main()\n\
  9: {\n10:     cout << \"Enter a number you wish to square: \";\n11:     int number\
  \ = 0;\n12:     int square = 0;\n13:     cin >> number;\n14:\n15:     GetSquare(number,\
  \ square);\n16:     cout << \"Square is: \" << square << endl;\n17:\n18:     return\
  \ 0;\n19: }\n```\n* *\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nint* pointToAnInt = new int;\n\
  \nint* pCopy = pointToAnInt;\n```\n\n### 我难道不应该对两者都调用 `delete` 以确保内存被释放吗？\n\n**A**\
  \ 这种做法是错误的。你只允许对由 `new` 返回的地址调用一次 `delete`。此外，理想情况下，你应该避免让两个指针指向同一个地址，因为对其中任何一个执行\
  \ `delete` 都会使另一个失效。你的程序编写方式也不应该导致你对所用指针的有效性产生任何不确定性。\n\n### Q 我在什么时候应该使用 `new(nothrow)`？\n\
  \n**A** 如果你不想处理 `std::bad_alloc` 异常，你可以使用 `nothrow` 版本的 `new` 运算符，如果请求的内存分配失败，它将返回\
  \ `NULL`。\n\n### Q 我可以使用以下两种方法调用函数来计算面积：\n\n点击此处查看代码图像\n\n```cpp\nvoid CalculateArea\
  \ (const double* const ptrRadius, double* const ptrArea);\n\nvoid CalculateArea\
  \ (const double& radius, double& area);\n```\n\n### 我应该优先选择哪种变体？\n\n**A** 使用后者的引用方法，因为引用不会失效，而指针可能会。此外，这种方式也更简单。\n\
  \n## Q 我有一个指针：\n\n点击此处查看代码图像\n\n```cpp\nint number = 30;\n\nconst int* pointToAnInt\
  \ = &number;\n```\n\n### 我明白由于 `const` 声明，我无法通过指针 `pointToAnInt` 改变 `number` 的值。我可以将\
  \ `pointToAnInt` 赋值给非 `const` 指针，然后使用它来操作整数 `number` 包含的值吗？\n\n**A** 不，你不能改变指针的\
  \ `const` 属性：\n\n点击此处查看代码图像\n\n```cpp\nint* pAnother = pointToAnInt; // 不能将 const\
  \ 指针赋值给非 const 指针\n```\n\n### Q 我为什么要要费劲通过引用向函数传递值？\n\n**A** 只要它不对你的程序性能产生太大影响，你就不需要这样做。然而，如果你的函数参数接收的对象非常沉重（字节数很大），那么按值传递将是非常昂贵的操作。使用引用会让你的函数调用效率高得多。记住大量地使用\
  \ `const`，除非函数需要将结果存储在变量中。\n\n### Q 这两个声明处声明之间有什么区别：\n\n点击此处查看代码图像\n\n```cpp\nint\
  \ myNumbers[100];\n\nint* myArrays[100];\n```\n\n**A** `myNumbers` 是一个整数数组——也就是说，`myNumbers`\
  \ 是一个指向包含 100 个整数的内存位置的指针，指向索引 0 的第一个。它是以下形式的静态替代：\n\n点击此处查看代码图像\n\n```cpp\nint*\
  \ myNumbers = new int [100]; // 动态分配的数组\n\n// 使用 myNumbers\n\ndelete[] myNumbers;\n\
  ```\n\n`myArrays` 另一方面是一个包含 100 个指针的数组，每个指针都可以指向一个整数或一个整数数组。\n\n## 工作坊\n\n工作坊提供了测验题，以帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在检查附录\
  \ E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你已经理解了这些答案。\n\n### 测验\n\n**1.** 为什么你不能将 `const`\
  \ 引用赋值给非 `const` 引用？\n\n**2.** `new` 和 `delete` 是函数吗？\n\n**3.** 指针变量中包含的值的本质是什么？\n\
  \n**4.** 你应该使用什么运算符来访问指针指向的数据？\n\n### 练习题\n\n**1.** 执行这些语句时显示的内容是：\n\n点击此处查看代码图像\n\
  \n```cpp\n0: int number = 3;\n1: int* pNum1 = &number;\n2: *pNum1 = 20;\n3: int*\
  \ pNum2 = pNum1;\n4: number *= 2;\n5: cout << *pNum2;\n```\n\n**2.** 这三个重载函数之间的相似点和不同之处是：\n\
  \n点击此处查看代码图像\n\n```cpp\nint DoSomething(int num1, int num2);\n\nint DoSomething(int&\
  \ num1, int& num2);\n\nint DoSomething(int* pNum1, int* pNum2);\n```\n\n**3.** 如何修改第\
  \ 1 行的声明，使得第 3 行的赋值无效？（提示：这与指针指向的数据有关）\n\n**4.** **错误查找：** 以下代码哪里出了问题？\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int\
  \ *pointToAnInt = new int;\n    pointToAnInt = 9;\n    cout << \"The value at pointToAnInt:\
  \ \" << *pointToAnInt;\n    delete pointToAnInt;\n    return 0;\n}\n```\n\n**5.**\
  \ **错误查找：** 以下代码哪里出了问题？\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nint main()\n{\n    int *pointToAnInt = new int;\n    pointToAnInt = 9;\n\
  \    cout << \"The value at pointToAnInt: \" << *pointToAnInt;\n    delete pointToAnInt;\n\
  \    return 0;\n}\n```\n\n**6.** 修正后上述程序的输出是什么？\n\n# 第二部分：面向对象编程基础\n\n# 第 9 节：类与对象\n\
  \n到目前为止，你已经探索了从 `main()` 开始、包含局部变量和常量、并将执行逻辑组织成接受参数并返回值的简单程序。我们到为止的风格是*过程化的*，我们还没有观察过面向对象的方法。换句话说，现在你需要学习使用\
  \ C++ 进行面向对象编程的基础。\n\n## 类与对象的概念\n\n想象你正在编写一个模拟人类的程序，就像你自己一样。这个人类需要一个身份：姓名、出生日期、出生地和性别——这些是使他独特的信息。此外，人类还可以执行某些功能，如说话和介绍自己等。因此，人类也可以像图\
  \ 9.1 (#ch09.html_ch09fig01) 所示进行建模。\n\n**图 9.1** 人类的宽泛表示。\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Human\n{\n   // 成员属性：\n   string name;\n   string dateOfBirth;\n\
  \   string placeOfBirth;\n   string gender;\n   // 成员函数：\n   void Talk(string textToTalk);\n\
  \   void IntroduceSelf();\n   ...\n};\n```\n\n不言而喻，`IntroduceSelf()` 使用了 `Talk()`\
  \ 以及封装在 `class Human` 内部的一些数据属性。因此，在 `class` 关键字中，C++ 为你提供了一种创建自定义数据类型的强大方式，允许你封装可以使用这些属性的属性和函数。在这种情况下，类的所有属性（例如\
  \ `name`、`dateOfBirth`、`placeOfBirth` 和 `gender`）以及在其中声明的所有函数（即 `Talk()` 和 `IntroduceSelf()`）被称为类\
  \ `Human` 的成员。\n\n封装是将数据和使用数据的函数在逻辑上分组的能力，是面向对象编程的一个重要特性。\n\n***\n\n**注意**\n\n你经常会遇到\
  \ *method*（方法）一词——这些本质上是 `class` 的成员函数。\n\n***\n\n### 作为类实例的对象\n\n类就好比一个蓝图，单独声明一个类对程序的执行没有影响。类在程序执行时在现实世界中的化身是\
  \ *object*（对象）。要使用类的功能，你通常会创建该类的实例，称为对象。你使用该对象来访问其成员方法和属性。\n\n创建一个 `class Human`\
  \ 类型的对象与创建另一个类型的实例（例如 `double`）类似：\n\n点击此处查看代码图像\n\n```cpp\ndouble pi= 3.1415; \
  \ // 一个 double 类型的变量\nHuman  firstMan;  // firstMan: 一个 Human 类的对象\n```\n\n或者，你也可以使用\
  \ `new` 动态创建一个 `class Human` 的实例，就像创建另一个类型（例如 `int`）一样：\n\n点击此处查看代码图像\n\n```cpp\n\
  int* pointsToNum = new int;  // 动态分配的整数\ndelete pointsToNum;  // 使用后释放内存\nHuman*\
  \ firstWoman = new Human(); // 动态分配的 Human\ndelete firstWoman;  // 释放内存\n```\n\n\
  ### 使用点运算符 (`.`) 访问成员\n\n人类的一个可以是 Adam，男性，1970 年出生于阿拉巴马州。实例 `firstMan` 是 `class\
  \ Human` 的对象，是该类在现实中（即运行时）存在的化身：\n\n点击此处查看代码图像\n\n```cpp\nHuman  firstMan;  // 一个\
  \ Human 的实例即对象\n```\n\n正如类声明所示，`firstMan` 拥有如 `dateOfBirth` 等属性，可以使用点运算符 (`.`) 进行访问：\n\
  \n点击此处查看代码图像\n\n```cpp\nfirstMan.dateOfBirth = \"1970\";\n```\n\n这是因为属性 `dateOfBirth`\
  \ 属于类 `Human`，正如类声明所示，它是其蓝图的一部分。该属性只有在对象被实例化后才在现实中（即在运行时）存在。点运算符 (`.`) 帮助你访问对象的属性。\n\
  \n对于 `IntroduceSelf()` 等方法也是如此：\n\n点击此处查看代码图像\n\n```cpp\nfirstMan.IntroduceSelf();\n\
  ```\n\n如果你有一个指向 `class Human` 实例的指针 `firstWoman`，你可以直接使用指针运算符 (`->`) 访问成员（如下一节所示），也可以使用间接运算符\
  \ (`*`) 引用对象：\n\n点击此处查看代码图像\n\n```cpp\n(*firstWoman).IntroduceSelf();\n```\n\n***\n\
  \n**注意**\n\n命名规范同样适用。类名和成员函数使用帕命名命名（Pascal case），例如 `IntroduceSelf()`。类属性使用驼峰命名法（camel\
  \ case），例如 `dateOfBirth`。\n\n当我们实例化一个类时，我们声明了一个类型为该类的变量。因此我们使用了一直以来用于变量的驼峰命名法，例如\
  \ `firstMan`。\n\n***\n\n### 使用指针运算符 (`->`) 访问成员\n\n如果对象是使用 `new` 分配在堆上的，或者你有一个指向对象的指针，那么你可以使用指针运算符\
  \ (`->`) 来访问成员属性和函数：\n\n点击此处查看代码图像\n\n```cpp\nHuman* firstWoman = new Human();\n\
  firstWoman->dateOfBirth = \"1970\";\nfirstWoman->IntroduceSelf();\ndelete firstWoman;\n\
  ```\n\n一个带有 `public` 关键字的可编译形式 `class Human` 由 列表 9.1 所示。\n\n**列表 9.1 可编译的类-Human**\n\
  点击此处查看代码图像\n\n***\n\n```cpp\n#include <iostream>\n#include <string>\nusing namespace\
  \ std;\n\nclass Human {\npublic:\n    string name;\n    int age;\n    void IntroduceSelf()\
  \ {\n        cout << \"I am \" << name << \" and \" << age << \" years old\" <<\
  \ endl;\n    }\n};\n\nint main() {\n    Human firstMan;\n    firstMan.name = \"\
  Adam\";\n    firstMan.age = 30;\n\n    Human firstWoman;\n    firstWoman.name =\
  \ \"Eve\";\n    firstWoman.age = 28;\n\n    firstMan.IntroduceSelf();\n    firstWoman.IntroduceSelf();\n\
  }\n```\n\n**输出：**\n```\nI am Adam and 30 years old\nI am Eve and 28 years old\n\
  ```\n\n\n\n\n\n假设有一个名为 `eve` 的 `Human` 类实例：\n\n```cpp\nHuman eve;\n```\n\n当该实例的用户尝试访问成员\
  \ `age` 时：\n\n点击此处查看代码图像\n\n```cpp\ncout << eve.age; // 编译错误\n```\n\n此时，用户将得到一个编译错误，内容类似于“错误：`Human::age`——无法访问在类\
  \ `Human` 中声明的私有成员。”。获取 `age` 的唯一许可方式是通过 `class Human` 提供的公共方法 `GetAge()` 来请求它，而该方法的实现方式是由类的程序员认为的暴露\
  \ `age` 的恰当方式决定的：\n\n点击此处查看代码图像\n\n```cpp\ncout << eve.GetAge(); // OK\n```\n\n\
  如果 `Human` 类的程序员有此意，他可以使用 `GetAge()` 让 Eve 显示出的年龄比实际年龄要年轻！换句话说，这意味着 C++ 允许类来控制它想要暴露的属性以及以什么方式暴露这些属性。如果\
  \ `class Human` 没有实现 `GetAge()` 公共成员方法，那么该类实际上确保了用户无法查询 `age`。这一特性在本文节稍后解释的情况下可能非常有用。\n\
  \n同样地，`Human::age` 也无法直接赋值：\n\n点击此处查看代码图像\n\n```cpp\neve.age = 22; // 编译错误\n```\n\
  \n设置年龄的唯一许可方式是通过方法 `SetAge()`：\n\n```cpp\neve.SetAge(22); // OK\n```\n\n这有许多优势。`SetAge()`\
  \ 的当前实现只是直接设置成员变量 `Human::age`。然而，你可以使用 `SetAge()` 来验证所设置的 `age` 是否为零且非负，从而对对外部输入进行验证：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n   int age;\npublic:\n   void\
  \ SetAge(int humansAge)\n   {\n      if (humansAge > 0)\n         age = humansAge;\n\
  \   }\n};\n```\n\n因此，C++ 允许类设计者控制类的数据属性如何被访问和操作。\n\n### 通过关键字 `private` 实现数据抽象\n\
  \nC++ 在允许你设计一个类作为封装数据和操作这些数据的方法的容器的同时，也赋予了你权力，通过 `private` 关键字来决定哪些信息对外部世界是不可访问的（即在类外部不可用）。同时，你也有可能通过声明为\
  \ `public` 的方法，允许对被声明为 `private` 的信息进行受控访问。因此，你对类的实现可以抽象出该类外部类和函数不需要访问的成员信息。\n\n\
  回到关于 `Human::age` 是私有成员的示例，你知道即使在现实中，许多人也不喜欢透露真实年龄。如果要求 `class Human` 提供一个比当前年龄小两岁的年龄，它可以通过公共函数\
  \ `GetAge()` 轻松实现，该函数使用 `Human::age` 参数，将其减二，并提供结果，如列表 9.2 所示。\n\n**列表 9.2** 类 `Human`\
  \ 的模型，其中真实的 `age` 被用户抽象，并报告了一个较年轻的 `age`\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Human\n4: {\n5: private:\n6:     // 私有成员数据：\n\
  7:     int age;\n8:\n9: public:\n10:     void SetAge(int inputAge)\n11:     {\n\
  12:         age = inputAge;\n13:     }\n14:\n15:     // Human 关于他/她的年龄撒谎（如果超过 30\
  \ 岁）\n16:     int GetAge()\n17:     {\n18:         if (age > 30)\n19:          \
  \   return (age - 2);\n20:         else\n21:             return age;\n22:     }\n\
  23: };\n24:\n25: int main()\n26: {\n27:     Human firstMan;\n28:     firstMan.SetAge(35);\n\
  29:\n30:     Human firstWoman;\n31:     firstWoman.SetAge(22);\n32:     cout <<\
  \ \"Age of firstMan \" << firstMan.GetAge() << endl;\n33:     cout << \"Age of firstWoman\
  \ \" << firstWoman.GetAge() << endl;\n34:     return 0;\n35: }\n```\n\n输出 ![Image](img/jpg)\n\
  点击此处查看代码图像\nAge of firstMan 33\nAge of firstWoman 22\n\n分析 ![Image](img/jpg)\n注意第\
  \ 16 行的公共方法 `Human::GetAge()`。由于私有成员 `Human::age` 中包含的实际年龄无法直接访问，该类的用户在查询 `class\
  \ Human` 对象的属性时，唯一的途径就是 `GetAge()`。因此，私有成员 `Human::age` 中的实际年龄对外部世界是抽象的。事实上，我们的\
  \ `Human` 对于大于 30 岁的人在年龄上撒了谎。\n\n抽象是面向对象语言中的一个重要概念。它赋予了程序员决定哪些类属性对类是可见的（（那些声明为“朋友”的成员除外）。\n\
  \n## 构造函数\n\n构造函数是一个在实例化类时调用的特殊函数（或方法），用于构造对象。就像函数一样，构造函数也可以重载。\n\n### 声明和实现构造函数\n\
  \n构造函数是一个没有返回类型且没有返回值的特殊函数。因此 `class Human` 的构造函数声明如下：\n\n```cpp\nclass Human\n\
  {\npublic:\n   Human();\n```\n\n构造函数可以在类内联实现，也可以在类外部实现。在类内部实现如下：\n\n```cpp\nclass\
  \ Human\n{\npublic:\n   Human()\n   {\n   }\n};\n```\n\n在类外定义构造函数的变体如下：\n\n```cpp\n\
  class Human\n{\npublic:\n   Human(); // 构造函数声明\n};\n// 构造函数实现\nHuman::Human()\n\
  {\n}\n```\n\n注意 `::` 称为作用域运算符。例如，`Human::dateOfBirth` 指的是 `Human` 类作用域内的变量 `dateOfBirth`。而\
  \ `::dateOfBirth` 则指向全局作用域下的另一个变量 `dateOfBirth`。\n\n#### 何时以及如何使用构造函数\n\n构造函数在对象创建、类实例化时总是会被调用。这使得构造函数成为你初始化整数、指针等类成员变量的理想位置。再次查看列表\
  \ 9.2。注意，如果你忘记调用 `SetAge()`，整数变量 `Human::age` 可能包含未知值，因为它没有初始化（尝试注释掉第 28 行和第 31\
  \ 行）。列表 9.3 使用构造函数实现了一个更好的 `class Human` 版本，变量 `age` 已经初始化。\n\n\n\n\n\n```cpp\n\
  34: int main()\n{\n    Human firstWoman;\n    firstWoman.SetName(\"Eve\");\n   \
  \ firstWoman.SetAge (28);\n    firstWoman.IntroduceSelf();\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n构造了一个 `Human` 类的实例\n\n我是 Eve，今年 28 岁\n\n### 分析\n分析 ![Image](img/arrow.jpg)\n\
  \n在输出中，你看到一行表示对象构造的新行。现在，观察第 34–41 行定义的 `main()`。你会发现输出的第一行是第 36 行创建（构造）对象 `firstWoman`\
  \ 的结果。第 11–15 行中的构造函数 `Human::Human()` 包含了产生该输出的 `cout` 语句。注意构造函数是如何将整数 `age` 初始化为\
  \ 0 的。如果你忘记在新构造的对象上调用 `SetAge()`，你可以放心，构造函数已经确保了变量 `age` 中包含的值不是随机整数（那看起来可能是有效的），而是\
  \ 0。\n\n### 注意\n不带参数的情况下调用的构造函数被称为默认构造函数。编写默认构造函数是可选的。\n\n如果你没有编写任何构造函数，如列表 9.1\
  \ 所示，编译器会为你创建一个（它会构造成员属性，但不会将普通数据类型如 `int`）初始化为任何特定的非零值）。\n\n### 构造函数的重载\n构造函数可以像函数一样被重载。因此，我们可以写一个在实例化\
  \ `Human` 时需要将名称作为参数的构造函数，例如：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\npublic:\n\
  \    Human()\n    {\n        // 此处是默认构造函数的代码\n    }\n    Human(string humansName)\n\
  \    {\n        // 此处是重载构造函数的代码\n    }\n};\n```\n\n重载构造函数的应用在列表 9.4 中通过，通过在构造时提供名称来创建\
  \ `Human` 类的对象。\n\n**列表 9.4** 具有多个构造函数的 `Human` 类\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <string>\n2: using namespace std;\n3:\n4: class Human\n\
  5: {\n6: private:\n7:     string name;\n8:     int age;\n9:\n10: public:\n11:  \
  \   Human() // 默认构造函数\n12:     {\n13:         age = 0; // 初始化以确保没有垃圾值\n14:     \
  \    cout << \"Default constructor: name and age not set\" << endl;\n15:     }\n\
  16:\n17:     Human(string humansName, int humansAge) // 重载\n18:     {\n19:     \
  \    name = humansName;\n20:         age = humansAge;\n21:         cout << \"Overloaded\
  \ constructor creates \";\n22:         cout << name << \" of \" << age << \"years\"\
  \ << endl;\n23:     }\n24: };\n25:\n26: int main()\n27: {\n28:     Human firstMan;\
  \ // 使用默认构造函数\n29:     Human firstWoman (\"Eve\", 20); // 使用重载构造函数\n30: }\n```\n\
  \n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nDefault constructor: name and age\
  \ not set\n\nOverloaded constructor creates Eve of 20 years\n\n### 分析\n分析 ![Image](img/arrow.jpg)\n\
  \n第 26–30 行的 `main()` 函数非常简单，创建了两个 `Human` 类的实例。`firstMan` 使用默认构造函数，而 `firstWoman`\
  \ 使用重载构造函数，在实例化时提供了名称和年龄。输出仅是对象构造的结果！你可能会体会到，如果 `class Human` 选择不支持默认构造函数，那么 `main()`\
  \ 将没有选项使用以名称和年龄为先决条件的重载构造函数来构造每个 `Human` 对象——这使得在不提供名称或年龄的情况下无法创建 `Human`。\n\n###\
  \ 提示\n你可以选择不实现默认构造函数，以强制使用某些最小参数进行对象实例化，正如下一节解释的那样。\n\n### 没有默认构造函数的类\n在列表 9.5 中，请看没有默认构造函数的\
  \ `class Human` 如何强制创建者提供名称和年龄作为创建对象的的先决条件。\n\n**列表 9.5** 具有重载构造函数且没有默认构造函数的类\n\n\
  点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include <string>\n2: using namespace\
  \ std;\n3:\n4: class Human\n5: {\n6: private:\n7:     string name;\n8:     int age;\n\
  9:\n10: public:\n11:     Human(string humansName, int humansAge)\n12:     {\n13:\
  \         name = humansName;\n14:         age = humansAge;\n15:         cout <<\
  \ \"Overloaded constructor creates \";\n16:     }\n17:\n18:     void IntroduceSelf()\n\
  19:     {\n20:         cout << \"I am \" << name;\n21:         cout << age << \"\
  \ years old\" << endl;\n22:     }\n23: };\n24:\n25: int main()\n26: {\n27:     Human\
  \ firstMan(\"Adam\", 25);\n28:     Human firstWoman(\"Eve\", 28);\n29:\n30:    \
  \ firstMan.IntroduceSelf();\n31:     firstWoman.IntroduceSelf();\n32: }\n```\n\n\
  输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nOverloaded constructor creates Adam\
  \ of 25\n\nOverloaded constructor creates Eve of 28\n\nI am Adam and 25 years old\n\
  \nI am Eve and 28 years old\n\n### 分析\n分析 ![Image](img/arrow.jpg)\n\n此版本的 `class\
  \ Human` 只有一个接受 `string` 和 `int` 输入的构造函数。没有默认构造函数，且由于存在重载构造函数，C++ 编译器不会为你生成默认构造函数。这很好地模拟了现实世界的场景；你出生时就有名字，但没有人有权限更改它。\n\
  \n### 带有默认值的构造函数参数\n就像函数可以带有默认参数一样，构造函数也可以。你在接下来的代码中看到的是列表 9.5 第 11 行的略微修改版本，其中\
  \ `age` 参数具有默认值 25：\n\n```cpp\nclass Human\n{\nprivate:\n    string name;\n    int\
  \ age;\n\npublic:\n    // 重载构造函数（无默认构造函数）\n    Human(string humansName, int humansAge\
  \ = 25)\n    {\n        name = humansName;\n        age = humansAge;\n        cout\
  \ << \"Overloaded constructor creates \" << name;\n        cout << \" of age \"\
  \ << age << endl;\n    }\n    // ... 其他成员\n};\n```\n\n此类类可以使用以下语法实例化：\n\n点击此处查看代码图像\n\
  \n`Human adam(\"Adam\");` // `adam.age` 被赋予默认值 25\n\n`Human eve(\"Eve\", 18);` //\
  \ `eve.age` 被赋予指定的 18\n\n### 注意\n注意，默认构造函数是指可以在不带参数的情况下实例化的函数，而不一定是不带参数的。因此，这个带有两个默认值的值的构造函数就是默认构造函数：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n    string name;\n    int age;\n\
  \npublic:\n    // 两个参数都有默认值\n    Human(string humansName = \"Adam\", int humansAge\
  \ = 25)\n    {\n        name = humansName;\n        age = humansAge;\n    }\n}\n\
  ```\n\n\n\n\n\n```cpp\n        cout << \"Overloaded constructor creates \";\n  \
  \      cout << name << \" of age \" << age;\n    }\n};\n```\n\n原因是 `class Human`\
  \ 仍然可以在不带参数的情况下实例化：\n\n点击此处查看代码图像\n\n`Human adam;` // `Human` 使用默认名称 \"Adam\"，`age\
  \ 25`\n\n### 使用初始化列表的构造函数\n\n你已经见过构造函数在初始化成员变量时是多么用的。初始化成员的另一种方法是使用*初始化列表*（initialization\
  \ lists）。列表 9.5 中初始化列表的构造函数变体如下所示：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\nprivate:\n\
  \   string name;\n   int age;\npublic:\n   // 用于初始化成员 age 和 name 的两个参数\n   Human(string\
  \ humansName, int humansAge)\n       :name(humansName), age(humansAge)\n   {\n \
  \     cout << \"Constructed a human called \" << name;\n      cout << \", \" <<\
  \ age << \" years old\" << endl;\n   }\n// ... 其他类成员\n};\n```\n\n因此，初始化列表的特征是在包含在括号\
  \ `(...)` 中的参数声明后跟一个冒号 (`:`)，然后是一个单独的成员变量及其初始化值。该初始化值可以是参数（如 `humansName`），甚至可以是固定值。初始化列表也可以用于带特定参数调用基类构造函数。这些将在第\
  \ 10 节“实现继承.](#ch10.html_ch10)”中再次讨论。\n\n你可以在列表 9.6 中看到一个带有参数默认构造函数、默认值和初始化列表的 `class\
  \ Human` 版本。\n\n**列表 9.6** 接受带有默认值的参数的、并使用初始化列表设置成员的默认构造函数\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: #include <string>\n2: using namespace std;\n3: \n4: class\
  \ Human\n5: {\n6: private:\n7:     int age;\n8:     string name;\n9: \n10: public:\n\
  11:     Human(string humansName = \"Adam\", int humansAge = 25)\n12:         :name(humansName),\
  \ age(humansAge)\n13:     {\n14:         cout << \"Constructed a human called \"\
  \ << name;\n15:         cout << \", \" << age << \" years old\" << endl;\n16:  \
  \   }\n17: };\n18: \n19: int main()\n20: {\n21:     Human adam;\n22:     Human eve(\"\
  Eve\", 18);\n23: \n24:     return 0;\n25: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nConstructed a human called Adam, 25 years old\n\nConstructed a human\
  \ called Eve, 18 years old\n\n分析 ![Image](img/arrow.jpg)\n\n带有初始化列表的构造函数可见第 11–16\
  \ 行，其中你也可以看到为 `name` 给了默认值 `\"Adam\"`，为 `age` 给了默认值 `25`。因此，当第 21 行创建一个名为 `adam`\
  \ 的 `class Human` 实例且不带参数时，其成员会自动分配默认值。相反，`eve` 则如第 22 行所示提供了参数——这些参数在构造期间变为赋值给\
  \ `Human::name` 和 `Human::age` 的值。\n\n### 注意\n\n也可以使用关键字 `constexpr` 同样将构造函数定义为常量表达式。在从性能角度来看这种结构有用的特殊情况下，你会在构造函数声明处使用它。\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Sample\n{\nconst char* someString;\npublic:\n   constexpr\
  \ Sample(const char* input)\n       :someString(input)\n   { // 构造函数 }\n};\n```\n\
  \n## 析构函数\n\n析构函数与构造函数一样，是一个特殊的函数。构造函数在实例化时被调用，而析构函数在对象销毁时自动被调用。\n\n### 声明和实现析构函数\n\
  \n析构函数看起来是一个接收类名的函数，但其前面有一个波浪号 (`~`)。因此，`class Human` 将有一个如下声明的析构函数：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Human\n{\n   ~Human(); // 析构函数的声明\n};\n```\n\n该析构函数可以在类内内联实现，也可以在类声明之外实现。类内的实现或定义如下所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Human\n{\npublic:\n   ~Human()\n   {\n      // 析构函数代码\n\
  \   }\n};\n```\n\n允许你在类声明外定义析构函数的变体如下：\n\n点击此处查看代码图像\n\n```cpp\nclass Human\n{\n\
  public:\n   ~Human(); // 析构函数声明\n};\n// 析构函数定义（实现）\n::~Human()\n{\n   // 析构函数代码\n\
  }\n```\n\n如你所见，析构函数的声明与构造函数的声明略有不同，它包含一个波浪号 (`~`)。然而，析构函数的作用与构造函数的作用完全相反。\n\n####\
  \ 何时以及如何使用析构函数\n\n当类的对象离开作用域或通过 `delete` 删除而被销毁时，析构函数总是会被调用。这一属性使得析构函数成为重置变量以及释放动态分配的内存和其他资源的理想位置。\n\
  \n本书建议优先使用 `std::string` 而不是 `char*` 缓冲区，这样你就不需要担心内存分配和及时释放。`std::string` 和其他工具无非是利用构造函数和析构函数的类（此外还有你将在第\
  \ 12 节所示的示例 `MyString` 类，它在构造函数中分配内存，在析构函数中释放内存。\n\n**列表 9.7** 通过析构函数确保内存释放的字符缓冲区的简单类\n\
  \n\n\n\n\n该类基本上在 `MyString::buffer` 中封装了一个 C 风格字符串，并免除了你手动分配内存的任务；每当你需要使用字符串时，它都会释放该内存。我们最感兴趣的几行是第\
  \ 9–18 行的构造函数 `MyString()` 以及第 20–25 行的析构函数 `~MyString()`。构造函数通过一个强制性的输入参数强制执行带有输入字符串的构造，然后在第\
  \ 13 行使用 `new` 和 `strlen` 为其分配内存后，将其拷贝到字符数组 `buffer` 中。`strlen` 是标准库提供的一个函数，有助于确定输入字符串的长度。`strcpy`\
  \ 是第 14 行中使用的标准库函数，用于从源 `initString` 拷贝到由 `buffer` 指向的新分配内存中。如果类的用户为 `initString`\
  \ 提供了 `NULL`，则 `MyString::buffer` 也会初始化为 `NULL`（以防止该指针包含随机值，这在访问内存位置时可能是危险的）。析构函数代码的作用是确保在构造函数中分配的内存自动返回给系统。它检查\
  \ `MyString::buffer` 是否为 `NULL`，如果是，则对它执行 `delete[]`，这与构造函数中的 `new` 相对应。请注意，在 `main()`\
  \ 函数中，程序员从未执行过 `new` 或 `delete`。除了从用户那里抽象出内存管理的实现外，`class MyString` 还确保了释放分配内存的逻辑正确性。析构函数\
  \ `~MyString()` 在 `main` 结束时会被自动调用，这在执行析构函数中的 `cout` 语句的输出中得到了证明。\n\n处理字符串的类是析构函数的许多适用场景之一。第\
  \ 26 节 “理解智能指针”演示了析构函数在以更智能的方式处理指针时起着怎样的关键作用。\n\n### Note\n\n析构函数不能被重载。一个类只能有一个析构函数。如果你忘记实现析构函数，编译器将创建并调用一个虚拟析构函数，即一个空析构函数（它不对动态分配的内存进行任何清理）。\n\
  \n### 拷贝构造函数\n\n在 第 7 节 “使用函数组织代码”中，你学习了传递给类似 `Area()` 函数（如列表 7.1 所示）的参数会被拷贝：\n\n\
  ```cpp\ndouble Area(double radius);\n```\n\n因此，当调用 `Area()` 时，作为参数 `radius` 发送的内容会被拷贝。这条规则适用于对象，即类的实例。\n\
  \n### 浅拷贝及相关问题\n\n如列表 9.7 所示的 `MyString` 等类包含一个指针成员 `buffer`，它指向动态分配的内存，该内是在构造函数中使用\
  \ `new` 分配，并在析构函数中使用 `delete[]` 释放。当该类的对象被拷贝时，指针成员会被拷贝，但所指向的内存不会拷贝，导致两个对象指向内存中同一个动态分配缓冲区。当一个对象被析构时，`delete[]`\
  \ 会释放内存，从而使另一个对象持有的指针拷贝失效。这种拷贝是*浅拷贝*的，对程序的稳定性构成了威胁，如列表 9.8 所示。\n\n**列表 9.8** 按值传递如\
  \ `MyString` 等类对象的问题\n\n点击此此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string.h>\n2: using namespace std;\n3: class MyString\n4: {\n5: private:\n6:\
  \     char* buffer;\n7: \n8: public:\n9:     MyString(const char* initString) //构造函数\n\
  10:     {\n11:         buffer = NULL;\n12:         if(initString != NULL)\n13: \
  \        {\n14:             buffer = new char [strlen(initString) + 1];\n15:   \
  \          strcpy(buffer, initString);\n16:         }\n17:     }\n18: \n19:    \
  \ ~MyString() // 析构函数\n20:     {\n21:         cout << \"Invoking destructor, clearing\
  \ up\" << endl;\n22:     }\n```\n\n\n\n\n因此，拷贝构造函数接受一个同类对象的引用作为参数。该参数是源对象的别名，是你用来编写自定义拷贝代码时所使用的句柄。如列表\
  \ 9.9 所示，你会使用拷贝构造函数来确保源对象中所有缓冲区（buffers）都完成深拷贝（deep copy）。\n\n### 列表 9.9 定义拷贝构造函数以确保对动态分配的缓冲区进行深拷贝\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include <string.h>\n2: using\
  \ namespace std;\n3: class MyString\n4: {\n5: private:\n6:     char* buffer;\n7:\n\
  8: public:\n9:     MyString(const char* initString) // 构造函数\n10:     {\n11:    \
  \     buffer = NULL;\n12:         cout << \"Default constructor: creating new MyString\"\
  \ << endl;\n13:         if(initString != NULL)\n14:         {\n15:             buffer\
  \ = new char [strlen(initString) + 1];\n16:             strcpy(buffer, initString);\n\
  17:\n18:             cout << \"buffer points to: 0x\" << hex;\n19:             cout\
  \ << (unsigned int*)buffer << endl;\n20:         }\n21:     }\n22:\n23:     MyString(const\
  \ MyString& copySource) // 拷贝构造函数\n24:     {\n25:         buffer = NULL;\n26:  \
  \       cout << \"Copy constructor: copying from MyString\" << endl;\n27:      \
  \   if(copySource.buffer != NULL)\n28:         {\n29:             // 分配自己的缓冲区\n\
  30:             buffer = new char [strlen(copySource.buffer) + 1];\n31:\n32:   \
  \          // 从源对象深拷贝到本地缓冲区\n33:             strcpy(buffer, copySource.buffer);\n\
  34:\n35:             cout << \"buffer points to: 0x\" << hex;\n36:             cout\
  \ << (unsigned int*)buffer << endl;\n37:         }\n38:     }\n39:\n40:     // 析构函数\n\
  41:     ~MyString()\n42:     {\n43:         cout << \"Invoking destructor, clearing\
  \ up\" << endl;\n44:         delete [] buffer;\n45:     }\n46:\n47:     int GetLength()\n\
  48:     { return strlen(buffer); }\n49:\n50:     const char* GetString()\n51:  \
  \   { return buffer; }\n52: };\n53:\n54: void UseMyString(MyString str)\n55: {\n\
  56:     cout << \"String in MyString is \" << str.GetLength();\n57:     cout <<\
  \ \" characters long\" << endl;\n58:\n59:     cout << \"buffer contains: \" << str.GetString()\
  \ << endl;\n60:     return;\n61: }\n62:\n63: int main()\n64: {\n65:     MyString\
  \ sayHello(\"Hello from Class\");\n66:     UseMyString(sayHello);\n67:     return\
  \ 0;\n68: }\n```\n\n**输出**\n```\nDefault constructor: creating new MyString\nbuffer\
  \ points to: 0x1232D9\nCopy constructor: copying from MyString\nbuffer points to:\
  \ 0x1232DD\nString in MyString is 17 characters long\nbuffer contains: Hello from\
  \ Class\nInvoking destructor, clearing up\nInvoking destructor, clearing up\n```\n\
  \n### 分析\n\n大部分代码与列表 9.8 相似，不同在于第 23–38 行创建了新副本。首先，让我们关注 `main()` 函数，它（和之前一样）在第\
  \ 65 行创建了对象 `sayHello`。创建 `sayHello` 会导致输出的第一行产生，这是来自 `MyString` 构造函数的第 12 行输出。为了方便起见，构造函数还显示了\
  \ `buffer` 指向的内存地址。随后，`main()` 在第 66 行通过值传递将 `sayHello` 传递给函数 `UseMyString()`，如输出所示，这会自动导致拷贝构造函数的调用。拷贝构造函数中的代码与构造函数中的代码相似。基本思想相同：在第\
  \ 30 行检查拷贝源中包含的 C 风格字符串 `buffer` 的长度，在自己的 `buffer` 实例中分配等比例的内存，然后在第 33 行使用 `strcpy`\
  \ 从源拷贝到目标。这并不是指针值的浅拷贝（shallow copy）。这是一种深拷贝，即被指向的内容被拷贝到属于该对象的新分配缓冲区中，如图 9.4 所示。\n\
  \n![Image](img/09fig04.jpg)\n\n**图 9.4** 调用函数 `UseMyString()` 时，将参数 `sayHello` 深拷贝到参数\
  \ `str` 的示意。\n\n列表 9.9 中的输出表明，拷贝后的 `buffer` 指向的内存地址是不同的——也就是说两个对象没有指向同一个动态内存地址。因此，当函数\
  \ `UseMyString()` 返回且参数 `str` 被销毁时，析构函数代码会对拷贝构造函数中分配且属于该对象的内存地址执行 `delete[]`。通过这样做，它没有触及\
  \ `main()` 中 `sayHello` 所指向的内存。因此，两个函数都结束了，它们各自的对象也成功且和平地被销毁，而没有导致应用程序崩溃。\n\n###\
  \ 注意\n\n拷贝构造函数已经在像函数调用这样的情况下确保了深拷贝：\n\n点击此处查看代码图像\n```cpp\nMyString sayHello(\"\
  Hello from Class\");\nUseMyString(sayHello);\n```\n\n然而，如果你尝试通过赋值来拷贝会怎样：\n\n点击此处查看代码图像\n\
  ```cpp\nMyString overwrite(\"who cares? \");\noverwrite = sayHello;\n```\n\n这仍然是一个浅拷贝，因为你还没有提供拷贝赋值运算符\
  \ `operator=`。在没有提供该运算符的情况下，编译器为你提供了一个执行浅拷贝的默认实现。\n\n拷贝赋值运算符将在 12 节 中讨论。列表 12.8\
  \ 是一个实现了相同功能的 `MyString`：\n\n点击此处查看代码图像\n```cpp\nMyString&operator= (const MyString&\
  \ copySource)\n{\n    //... 拷贝赋值代码\n}\n```\n\n### 注意\n\n在拷贝构造函数声明中使用 `const` 可以确保拷贝构造函数修改被引用的对象。\n\
  \n此外，拷贝构造函数的参数必须以引用传递。如果不是引用，拷贝构造函数本身就会调用拷贝，从而递归调用，直到系统耗尽内存。\n\n### 做\n\n- 当你的类包含原始指针成员（`char*`\
  \ 等）时，**务必**编写拷贝构造函数和拷贝赋值运算符。\n- 务必使用 `const` 引用编写拷贝构造函数。\n- 使用 `explicit` 关键字避免隐式转换。\n\
  - 使用 `std::string` 等字符串类和智能指针类作为成员，而不是原始指针，因为它们已经实现了拷贝构造，可以节省你的精力。\n\n### 不要\n\n\
  - 除非绝对避免，否则**不要**使用原始指针作为成员。\n\n### 注意\n\n带有原始指针成员 `char* buffer` 的 `MyString` 类被用作示例来解释拷贝构造函数的需要。\n\
  \n如果你编写一个需要包含存储名称等数据的类，使用 `std::string` 而不是 `char*`，在没有原始指针的情况下可能不需要拷贝构造函数。这是因为编译器插入的默认拷贝构造函数会确保调用成员对象（如\
  \ `std::string`）的所有可用拷贝构造函数。\n\n### 移动构造函数提高性能\n\n由于语言及其需求，某些情况下对象会自动执行拷贝步骤。考虑以下内容：\n\
  \n点击此处查看代码图像\n```cpp\nclass MyString\n{\n    // 取列表 9.9 中的实现\n};\n\nMyString Copy(MyString&\
  \ source) // 函数\n{\n    MyString copyForReturn(source.GetString());  // 创建拷贝\n \
  \   return copyForReturn;  // 返回值调用拷贝构造函数\n}\n\nint main()\n{\n    MyString sayHello\
  \ (\"Hello World of C++\");\n    MyString sayHelloAgain(Copy(sayHello)); // 调用 2\
  \ 次拷贝构造函数\n    return 0;\n}\n```\n\n\n\n正如注释所示，在 `sayHelloAgain` 的实例化过程中，拷贝构造函数被调用了两次，因此由于我们调用了按值返回\
  \ `MyString` 的函数 `Copy(sayHello)`，导致执行了两次深拷贝。然而，这个返回的值是极短存存的，在表达式表达式之外是不可用的。因此，C++\
  \ 编译器善意调用的拷贝构造函数对性能是一种负担。如果我们的类包含大型尺寸的对象，这种影响将变得非常显著。\n\n为了避免这种性能瓶颈，从 C++11 开始的\
  \ C++ 版本除了拷贝构造函数外还增加了**移动构造函数**（move constructor）。移动构造函数的语法如下：\n\n点击此处查看代码图片\n\n\
  ```cpp\n// move constructor\n\nMyString(MyString&& moveSource)\n{\n   if(moveSource.buffer\
  \ != NULL)\n   {\n      buffer = moveSource.buffer; // 获取所有权，即“移动”\n      moveSource.buffer\
  \ = NULL;   // 将移动源设置为 NULL\n   }\n}\n```\n\n当编写了移动构造函数时，编译器会自动选择该方式来“移动”临时资源，从而避免深拷贝步骤。实现移动构造函数后，注释应相应更改为以下内容：\n\
  \n点击此处查看代码图片\n\n```cpp\nMyString sayHelloAgain(Copy(sayHello)); // 触发 1 次拷贝和 1 次移动构造函数\n\
  ```\n\n移动构造函数通常与移动赋值运算符一起实现，将在第 12 节中进行详细讨论。列表 12.11 是 `class MyString` 的改进版本，它实现了移动构造函数和移动赋值运算符。\n\
  \n## 构造函数与析构函数的不同用途\n\n在这一节中，你学习了一些重要的基础概念，例如构造函数、析构函数以及通过 `public` 和 `private`\
  \ 等关键字对数据和方法进行抽象。这些概念让你能够创建可以控制其如何被创建、拷贝、销毁或暴露数据的类。\n\n让我们来看一些帮助解决许多重要设计问题的有趣模式。\n\
  \n### 不允许拷贝的类\n\n你被要求为你国家的宪法建模。你的宪法允许存在一位总统。你的 `class President` 存在着以下风险：\n\n点击此处查看代码图片\n\
  \n```cpp\nPresident ourPresident;\n\nDoSomething(ourPresident); // 按值传递时创建了副本\n\n\
  President clone;\n\nclone = ourPresident; // 通过赋值创建了副本\n```\n\n显然，你需要避免这种情况。除了建模特定的宪法外，你可能正在编写一个操作系统，并需要建模一个局域网、一个处理器等。你需要确保某些资源不能被拷贝或复制。如果你不声明拷贝构造函数，C++\
  \ 编译器会为你插入一个默认的公共拷贝构造函数。这破坏了你的设计并威胁到了你的实现。然而，这种语言为这种设计范式提供了一个解决方案。\n\n你可以通过声明一个\
  \ `private` 拷贝构造函数来确保你的类不能被拷贝。这确保了函数调用 `DoSomething(ourPresident)` 将导致编译失败。为了避免赋值，你声明了一个\
  \ `private` 赋值运算符。\n\n因此，解决方案如下：\n\n点击此处查看代码图片\n\n```cpp\nclass President\n{\nprivate:\n\
  \   President(const President&); // 私有拷贝构造函数\n   President& operator= (const President&);\
  \ // 私有拷贝赋值运算符\n   // ... 其他属性\n};\n```\n\n不需要实现私有的拷贝构造函数或赋值运算符。只需将它们声明为私有就足以实现你确保\
  \ `class President` 对象不可拷贝的目标。\n\n### 允许单个实例的单例类\n\n之前讨论的 `class President` 很好，但它有一个缺点：它无法帮助通过实例化多个对象来创建多个总统：\n\
  \n```cpp\nPresident One, Two, Three;\n```\n\n得益于 `private` 拷贝构造函数，它们单独都是不可拷贝的，但你理想需要的是一个拥有且仅有一个真实世界表现的\
  \ `class President`——也就是说，只有一个对象，并禁止创建额外的对象。欢迎来到单例（singleton）概念，它使用私有构造函数、私有赋值运算符和静态实例成员来创建这种（具有争议的）强大的模式。\n\
  \n***\n\n**提示**\n\n当在类数据成员上使用 `static` 关键字时，它确保该成员在所有实例之间共享。\n\n当 `static` 用在函数作用域内声明的局部上上，它确保该变量在函数调用之间保留其值。\n\
  \n当 `static` 用在成员函数（方法）上时，该方法在类的所有实例之间共享。\n\n***\n\n`static` 关键字是创建单例类的关键要素，如列表\
  \ 9.10 所示。\n\n**列表 9.10** 禁止拷贝、赋值和多实例创建的单例 `class President`\n\n点击此处查看代码图片\n\n***\n\
  \n```cpp\n#include <iostream>\n#include <string>\nusing namespace std;\n\nclass\
  \ President\n{\nprivate:\n   President() {}; // 私有构造函数\n   President(const President&);\
  \ // 私有拷贝构造函数\n   const& operator=(const President&); // 赋值运算符\n   string name;\n\
  \npublic:\n   static President& GetInstance()\n   {\n      static President onlyInstance;\
  \ // 仅构造一次\n      return onlyInstance;\n   }\n   string GetName()\n   { return name;\
  \ }\n   void SetName(string InputName)\n   { name = InputName; }\n};\n\nint main()\n\
  {\n   President& onlyPresident = GetInstance();\n   onlyPresident.SetName(\"Abraham\
  \ Lincoln\");\n\n   // 取消注释以查看编译失败\n   // President second; // 无法访问构造函数\n   // President*\
  \ third= new President(); // 无法访问构造函数\n   // President fourth = onlyPresident; //\
  \ 无法访问拷贝构造函数\n   // onlyPresident = GetInstance(); // 无法访问运算符\n\n   cout << \"The\
  \ name of the President is: \";\n   cout << GetInstance().GetName() << endl;\n\n\
  \   return 0;\n}\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\nThe\
  \ name of the President is: Abraham Lincoln\n\n分析 ![Image](img/arrow.jpg)\n\n快速查看\
  \ 28-43 行的 `main()`，那里有一系列注释掉的代码，展示了创建 `class President` 的新实例或副本的所有无法编译的组合。让我们逐一分析：\n\
  \n点击此处查看代码图片\n\n34: // President second; // 无法访问构造函数\n\n35: // President* third=\
  \ new President(); // 无法访问构造函数\n\n第 34 行和 35 行分别尝试在栈和堆上创建对象并使用默认构造函数，由于它在第 7 行声明为\
  \ `private`，因此是不可用的。\n\n点击此处查看代码图片\n\n36: // President fourth = onlyPresident; //\
  \ 无法访问拷贝构造函数\n\n第 36 行尝试通过拷贝构造函数创建现有对象的副本（创建时的赋值会触发拷贝构造函数），这在 `main()` 中是不可用的，因为它在第\
  \ 8 行声明为 `private`：\n\n点击此处查看代码图片\n\n37: // OnlyPresident = GetInstance(); // 无法访问运算符=\n\
  \n\n\n\n\n第 37 行尝试通过赋值来创建副本，由于赋值操作符在第 9 行被声明为 `private`，这种方法行不通。因此，`main()` 永远无法创建\
  \ `class President` 的实例，唯一的选择如第 30 行所示，即使用静态函数 `GetInstance()` 来获取 `class President`\
  \ 的实例。由于 `GetInstance()` 是一个静态成员，它就像一个全局函数，可以在没有对象作为句柄的情况下调用。`GetInstance()` 实现在第\
  \ 14–19 行，它使用静态变量 `onlyInstance` 来确保只创建一个且仅创建一个 `class President` 实例。为了更好地理解这一点，请想象第\
  \ 17 行只执行一次（静态初始化），因此无论调用多少次 `President::GetInstance()`，`GetInstance()` 都会返回那唯一的可用的\
  \ `class President` 实例。\n\n***\n\n### 注意事项\n\n仅在绝对必要时才使用单例模式，并考虑到应用程序及其功能的未来增长。请注意，单例模式这种限制创建多个实例的特性本身，当出现需要该类的多个实例的用例时，可能会成为架构瓶颈。\n\
  \n例如，如果我们的项目从模拟一个国家变为模拟联合国（目前由 193 个成员国组成，每个成员国家都有自己的主席），鉴于一个只允许存在一个实例的单例 `class\
  \ President`，我们显然将会遇到架构问题。\n\n***\n\n## 禁止在栈上实例化的类\n\n栈空间通常是有限的。如果你正在编写一个内部结构可能包含数\
  \ TB（terabytes）数据的数据库，你可能希望确保该类的客户端不能在栈上实例化它；相反，它被强制只能在自由存储（free store）上创建实例。确保此点的关键是将析构函数声明为\
  \ `private`：\n\n```cpp\nclass MonsterDB\n{\nprivate:\n   ~MonsterDB();  // 私有析构函数\n\
  \   //... 消耗大量数据的成员变量\n};\n```\n\n点击此处查看代码图像\n\n声明私有析构函数可以确保不允许像这样创建实例：\n\n```cpp\n\
  int main()\n{\n   MonsterDB myDatabase; // 编译错误\n   // ... 更多代码\n   return 0;\n\
  }\n```\n\n点击此处查看代码图像\n\n此实例如果成功构造，将位于栈上。当栈回退时，栈上的所有对象都会被弹出，因此编译器需要在 `main()` 结束时编译并调用析构函数\
  \ `~MonsterDB()`。然而，该析构函数是私有的，因此无法访问，导致编译失败。\n\n`private` 析构函数并不会阻止你在堆上实例化：\n\n\
  ```cpp\nint main()\n{\n   MonsterDB* myDatabase = new MonsterDB(); // 无错误\n   //\
  \ ... 更多代码\n   return 0;\n}\n```\n\n点击此处查看代码图像\n\n如果你在该处看到了内存泄漏，你并没有看错。由于无法从 `main`\
  \ 访问析构函数，你无法执行 `delete`。`class MonsterDB` 类需要的是一个 `public static` 成员函数，用于销毁实例（类成员将拥有访问私有析构函数的权限）。请参见列表\
  \ 9.11。\n\n**列表 9.11** 仅允许在自由存储上（使用 `new`）创建对象的数据库 `class MonsterDB` \n\n点击此处查看代码图像\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class MonsterDB\n\
  4: {\n5: private:\n6:     ~MonsterDB() {}; // 私有析构函数防止栈上实例化\n7:\n8: public:\n9:\
  \     static void DestroyInstance(MonsterDB* pInstance)\n10:     {\n11:        \
  \ delete pInstance; // 成员可以调用私有析构函数\n12:     }\n13:\n14:     void DoSomething()\
  \ {} // 示例空成员方法\n15: };\n16:\n17: int main()\n18: {\n19:     MonsterDB* myDB = new\
  \ MonsterDB(); // 在堆上\n20:     myDB->DoSomething();\n21:\n22:     // 注消下一行查看编译失败\n\
  23:     // delete myDB; // 私有析构函数无法调用\n24:\n25:     // 使用静态成员释放内存\n26:     MonsterDB::DestroyInstance(myDB);\n\
  27:\n28:     return 0;\n29: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n代码段没有产生输出。\n\
  \n分析 ![Image](img/arrow.jpg)\n\n这段代码的目的仅是为了演示禁止在栈上创建实例的类的编程。第 6 行所示的 `private` 析构函数是关键。第\
  \ 9–12 行的静态函数 `DestroyInstance()` 用于释放内存，因为 `main()` 无法对 `myDB` 执行 `delete`。你可以通过取消第\
  \ 23 行的注释测试这一点。\n\n## 使用构造函数进行类型转换在本节之前，你已经学习了构造函数可以被重载，也就是说它们可以接受一个或多个参数。此功能通常用于将一种类型转换为另一种类型。让我们考虑一个具有重载构造函数的\
  \ `class Human`，该构造函数接受一个整数：\n\n```cpp\nclass Human\n{\n   int age;\npublic:\n \
  \  Human(int a) : age(a) {}\n};\n\n// 接受 Human 参数的函数\nvoid DoSomething(Human person)\n\
  {\n   cout << \"Human sent something\" << endl;\n   return;\n}\n\nint main()\n{\n\
  \   Human kid(10); // 整数转换为 Human\n   DoSomething(kid); // OK\n   return 0;\n}\n\
  ```\n\n点击此处查看代码图像\n\n这种构造函数允许转换：\n\n```cpp\nHuman kid(10); // 转换为 Human\nDoSomething(kid);\n\
  ```\n\n点击此处查看代码图像\n\n***\n\n### 注意事项\n\n转换构造函数允许隐式转换：\n\n```cpp\nHuman anotherKid\
  \ = 11; // int 转换为 Human\nDoSomething(10); // 10 转换为 Human\n```\n\n点击此处查看代码图像\n\n\
  我们声明 `DoSomething(Human person)` 是一个接受 `Human` 类型的函数，而不接受 `int`！那么，为什么那行代码有效了？编译器知道\
  \ `class Human` 支持接受整数的构造函数并执行了隐式转换。\n\n为了避免隐式转换，在声明构造函数时使用 `explicit`：\n\n```cpp\n\
  class Human\n{\n   int age;\npublic:\n   explicit Human(int a) : age(a) {}\n};\n\
  ```\n\n点击此处查看代码图像\n\n`explicit` 不是先决条件，但在许多情况下是一种良好的做法。示例列表 9.12 演示了一个不允许隐式转换的 `class\
  \ Human` 版本。\n\n***\n\n**列表 9.12** 使用 `explicit` 关键字阻止无意的隐式转换\n\n```cpp\n0: #include<iostream>\n\
  1: using namespace std;\n2:\n3: class Human\n4: {\n5:   int age;\n6: public:\n7:\
  \   // explicit 构造函数阻止隐式转换\n8:   explicit Human(int humansAge) : age(humansAge)\
  \ {}\n9: };\n10:\n11: // 接受 Human 的函数\n12: void DoSomething(Human person)\n13: {\n\
  14:   cout << \"Human sent something\" << endl;\n15:   return;\n16: }\n17:\n18:\
  \ int main()\n19: {\n20:   Human kid(10);   // 显式转换 OK\n21:   Human anotherKid =\
  \ Human(11); // 显式，OK\n22:   DoSomething(kid); // OK\n23:\n24:   // Human anotherKid2\
  \ = 11; // 失败：不允许隐式转换\n25:   // DoSomething(10); // 隐式转换\n26:\n27:   return 0;\n\
  28: }\n```\n\n\n\n\n\n不对输出没有贡献的代码行与有贡献的行同样重要。第 17–27 行的 `main()` 包含了 `class Human`\
  \ 实例化的变体，该类在第 8 行使用带有 `explicit` 的构造函数进行了声明。能够编译的行是显式转换的尝试，其中使用 `int` 来实例化 `Human`。第\
  \ 23 和 24 行是涉及隐式转换的变体。这些被注释掉的行在我们移除第 8 行的 `explicit` 关键字后将可以通过编译。因此，此示例演示了 `explicit`\
  \ 关键字如何防止隐式转换。\n\n### 提示\n隐式转换问题以及使用 `explicit` 关键字避免这些转换也适用于运算符。在编写 第 12 Lesson\
  \ 中向你介绍的转换操作符时，记得注意 `explicit` 的用法。\n\n### `this` 指针\n\nC++ 中的一个重要概念，`this` 是一个保留关键字，适用于类作用域，并包含对象的地址。换句话说，`this`\
  \ 的值是 `&object`。在类成员方法中，当你调用另一个成员方法时，编译器会将 `this` 指针作为一个隐式的、不可见的参数传递给函数调用：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Human\n{\nprivate:\n    void Talk (string Statement)\n    {\n  \
  \    cout << Statement;\n    }\npublic:\n    void IntroduceSelf()\n    {\n     \
  \ Talk(\"Bla bla\"); // same as Talk(this, \"Bla Bla\")\n    }\n};\n```\n\n你在这里看到的是\
  \ `IntroduceSelf()` 方法使用私有成员 `Talk()` 在屏幕上打印一条语句。实际上，编译器在调用 `Talk` 时嵌入了 `this` 指针，即被调用为\
  \ `Talk(this, \"Bla bla\")`。\n\n从编程的角度来看，`this` 并没有太多的应用，除了那些通常是可选的情况。例如，如 Listing\
  \ 9.2 所示，在 `SetAge()` 中访问 `age` 的代码可以有一个变体：\n\n点击此处查看代码图像\n\n```cpp\nvoid SetAge(int\
  \ humansAge)\n{\n    this->age = humansAge;   // same as age = humansAge\n}\n```\n\
  \n### 注意\n注意，`this` 指针不会传递给声明为 `static` 的类方法，因为静态函数与类的实例不相连。相反，它们被所有实例共享。\n\n要在静态函数中使用实例变量，你需要显式地声明一个参数并将\
  \ `this` 指针作为参数传递。\n\n### 类的 `sizeof()`\n\n你已经学习了使用 `class` 关键字定义你自定义类型的基础知识，这使你能够封装数据属性和操作该数据的方法。运算符\
  \ `sizeof()` 涵盖在 第 3 Lesson 中的“使用变量、声明常量”中有所介绍，用于确定特定类型的内存需求（以字节为单位）。该运算符也适用于类，基本上报告类声明中包含的每个数据属性所消耗的字节和。取决于你使用的编译器，`sizeof()`\
  \ 可能会包含或不包含某些属性在字边界上的填充（padding）。注意，成员函数及其局部变量在定义类的 `sizeof()` 时并不起作用。参见 Listing\
  \ 9.13。\n\n**LISTING 9.13** 在类及其实例上使用 `sizeof` 的结果\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <string.h>\n2: using namespace std;\n3: class MyString\n\
  4: {\n5: private:\n6:     char* buffer;\n7:\n8: public:\n9:     MyString(const char*\
  \ initString) // default constructor\n10:     {\n11:         buffer = NULL;\n12:\
  \         if(initString != NULL)\n13:         {\n14:             buffer = new char\
  \ [strlen(initString) + 1];\n15:             strcpy(buffer, initString);\n16:  \
  \       }\n17:     }\n18: \n19:     MyString(const MyString& copySource) // copy\
  \ constructor\n20:     {\n21:         buffer = NULL;\n22:         if(copySource.buffer\
  \ != NULL)\n23:         {\n24:             buffer = new char [strlen(copySource.buffer)\
  \ + 1];\n25:             strcpy(buffer, copySource.buffer);\n26:         }\n27:\
  \     }\n28: \n29:     ~MyString()\n30:     {\n31:         delete [] buffer;\n32:\
  \     }\n33: \n34:     int GetLength()\n35:     { return strlen(buffer); }\n36:\
  \ \n37:     const char* GetString()\n38:     { return buffer; }\n39: };\n40: \n\
  41: class Human\n42: {\n43: private:\n44:     int age;\n45:     bool gender;\n46:\
  \     MyString name;\n47: \n48: public:\n49:     Human(const MyString& InputName,\
  \ int InputAge, bool gender)\n50:     name(InputName), age(InputAge), gender(gender)\
  \ {}\n51: \n52:     int GetAge ()\n53:     { return age; }\n54: };\n55: \n56: int\
  \ main()\n57: {\n58:     MyString mansName(\"Adam\");\n59:     MyString womansName(\"\
  Eve\");\n60: \n61:     cout << \"sizeof(MyString) = \" << sizeof(MyString) << endl;\n\
  62:     cout << \"sizeof(mansName) = \" << sizeof(mansName) << endl;\n63:     cout\
  \ << \"sizeof(womansName) = \" << sizeof(womansName) << endl;\n64: \n65:     Human\
  \ firstMan(mansName, 25, true);\n66:     Human firstWoman(womansName, 18, false);\n\
  67: \n68:     cout << \"sizeof(Human) = \" << sizeof(Human) << endl;\n69:     cout\
  \ << \"sizeof(firstMan) = \" << sizeof(firstMan) << endl;\n70:     cout << \"sizeof(firstWoman)\
  \ = \" << sizeof(firstWoman) << endl;\n71:     return 0;\n72: }\n```\n\n\n\n\n\n\
  点击此处查看代码图像\n\n```cpp\nstruct Human\n{\n   // 构造函数，默认公有（因为未指定访问权限）\n   Human(const\
  \ MyString& humansName, int humansAge, bool humansGender)\n      : name(humansName),\
  \ age (humansAge), Gender(humansGender) {}\n\n   int GetAge ()\n   {\n      return\
  \ age;\n   }\n\nprivate:\n   int age;\n   bool gender;\n   MyString name;\n};\n\
  ```\n\n如你所见，`struct Human` 与 `class Human` 相似，`struct` 类型对象的实例化也与 `class` 类型相似：\n\
  \n点击此处查看代码图像\n\n`Human firstMan(\"Adam\", 25, true);` // struct Human 的一个实例\n\n\
  ### 声明类的 `friend`（友元）\n\n类不允许外部访问其声明为 `private` 的数据成员和方法。但对于声明为 `friend` 类或友类函数，这一规则是被豁免的，如列表\
  \ 9.14 所示，使用了 `friend` 关键字。\n\n**列表 9.14** 使用 `friend` 关键字允许外部函数 `DisplayAge()`\
  \ 访问私有数据成员\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n   0: #include <iostream>\n   1: #include\
  \ <string>\n   2: using namespace std;\n   3:\n   4: class Human\n   5: {\n   6:\
  \ private:\n   7:     friend void DisplayAge(const Human& person);\n   8:     string\
  \ name;\n   9:     int age;\n   10:\n   11: public:\n   12:     Human(string humansName,\
  \ int humansAge)\n   13:     {\n   14:         name = humansName;\n   15:      \
  \   age = humansAge;\n   16:     }\n   17: };\n   18:\n   19: void DisplayAge(const\
  \ Human& person)\n   20: {\n   21:     cout << person.age << endl;\n   22: }\n \
  \  23:\n   24: int main()\n   25: {\n   26:     Human firstMan(\"Adam\", 25);\n\
  \   27:     cout << \"Accessing private member age via friend function: \";\n  \
  \ 28:     DisplayAge(firstMan);\n   29:\n   30:     return 0;\n   31: }\n```\n\n\
  * * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n通过友元函数访问私有成员 age: 25\n\n分析\
  \ ![Image](img/arrow.jpg)\n\n第 7 行包含一个声明，告知编译器全局作用域内的函数 `DisplayAge()` 是一个 `friend`，因此被允许特殊访问\
  \ `class Human` 的私有成员。你可以注释掉第 7 行，以查看第 22 行的编译失败。\n\n与函数一样，外部类也可以被指定为受信任的友元，如列表\
  \ 9.15 所示。\n\n**列表 9.15** 使用 `friend` 关键字允许外部类 `Utility` 访问私有数据成员\n\n点击此处查看代码图像\n\
  \n* * *\n\n```cpp\n   0: #include <iostream>\n   1: #include <string>\n   2: using\
  \ namespace std;\n   3:\n   4: class Human\n   5: {\n   6: private:\n   7:     friend\
  \ class Utility;\n   8:     string name;\n   9:     int age;\n   10:\n   11: public:\n\
  \   12:     Human(string humansName, int humansAge)\n   13:     {\n   14:      \
  \   name = humansName;\n   15:         age = humansAge;\n   16:     }\n   17: };\n\
  \   18:\n   19: class Utility\n   20: public:\n   21:     static void DisplayAge(const\
  \ Human& person)\n   22:     {\n   23:         cout << person.age << endl;\n   24:\
  \     }\n   25: };\n   26:\n   27: int main()\n   28: {\n   29:     Human firstMan(\"\
  Adam\", 25);\n   30:     cout << \"Accessing private member via friend class: \"\
  ;\n   31:     Utility::DisplayAge(firstMan);\n   32:\n   33:     return 0;\n   34:\
  \ }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n通过友元类访问私有成员: 25\n\
  \n分析 ![Image](img/arrow.jpg)\n\n第 7 行表示 `class Utility` 是 `class Human` 的友元。该友元声明允许\
  \ `class Utility` 中的所有方法访问 `class Human` 中的私有数据成员和方法。\n\n### `union`: 一种特殊的存储机制\n\
  \n`union` 是一种特殊的类类型，其中非静态数据成员在同一时刻只有一个激活状态。因此，`union` 可以像类一样容纳多个数据成员，不同之处在于其中只有一个成员可以被实际使用。\n\
  \n#### 声明联合体 (Union)\n\n使用 `union` 声明联合体，随后紧跟联合体的名称及其在花括号内的数据成员：\n\n点击此处查看代码图像\n\
  \n```cpp\nunion UnionName\n{\n   Type1 member1;\n   Type2 member2;\n   ...\n   TypeN\
  \ memberN;\n};\n```\n\n你可以像这样实例化和使用 `union`：\n\n点击此处查看代码图像\n\n```cpp\nUnionName\
  \ unionObject;\nunionObject.member2 = value; // 选择 member2 为激活成员\n```\n\n注意：与 `struct`\
  \ 类似，`union` 的成员默认是公有的。与 `struct` 不同，`union` 不能用于继承体系中。此外，`union` 的大小固定为该 `union`\
  \ 中最大成员的大小——即使该成员在 `union` 实例中处于未状态。\n\n#### 你会使用 `union` 吗？\n\n`union` 通常作为 `struct`\
  \ 的成员来构建复杂数据类型。在某些实现中，`union` 将内存空间解释为另一种类型的能力用于类型转换——这种做法是有争议的。列表 9.16 展示了 `union`\
  \ 的声明和用法。\n\n**列表 9.16** 声明、实例化和 `sizeof()` Union\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n\
  \   0: #include <iostream>\n   1: #include <string>\n   2: using namespace std;\n\
  \   3:\n   4: SimpleUnion\n   5: {\n   6:     int num;\n   7:     char alphabet;\n\
  \   8: };\n   9:\n   10: struct ComplexType\n   11: {\n   12:     enum DataType\n\
  \   13:         Int,\n   14:         Char\n   15:     } Type;\n   16:\n   17:  \
  \   union Value\n   18:     {\n   19:         int num;\n   20:         char alphabet;\n\
  \   21:\n   22:         Value() {}\n   23:         ~Value() {}\n   24:     } value;\n\
  \   25: };\n   26:\n   27: void DisplayComplexType(const ComplexType& obj)\n   28:\
  \ {\n   29:     switch (obj.Type)\n   30:     {\n   31:         case ComplexType::Int:\n\
  \   32:             cout << \"Union contains number: \" << obj.value.num << endl;\n\
  \   33:             break;\n   34:\n   35:         case ComplexType::Char:\n   36:\
  \             cout << \"Union contains character: \" << obj.value.alphabet << endl;\n\
  \   37:             break;\n   38:     }\n   39: }\n   40:\n   41: int main()\n\
  \   42: {\n   43:     SimpleUnion u1, u2;\n   44:     u1.num = 2100;\n   45:   \
  \  u2.alphabet = 'C';\n   46:     cout << \"sizeof(u1) containing integer: \" <<\
  \ sizeof(u1) << endl;\n   47:     cout << \"sizeof(u2) containing character: \"\
  \ << sizeof(u2) << endl;\n   48:\n   49:     ComplexType myData1, myData2;\n   50:\
  \     myData1.Type = ComplexType::Int;\n   51:     myData1.value.num = 2017;\n \
  \  52:\n   53:     myData2.Type = ComplexType::Char;\n   54:     myData2.value.alphabet\
  \ = 'X';\n   55:\n   56:     DisplayComplexType(myData1);\n   57:     DisplayComplexType(myData2);\n\
  \   58:\n   59:     return 0;\n   60: }\n```\n\n* * *\n\n\n\n该示例表明，`sizeof()` 联合体对象\
  \ `u1` 和 `u2` 返回的两个对象预留的内存是相同的，尽管 `u1` 用于存储整数而 `u2` 用于存储 `char`，且 `char` 的尺寸比 `int`\
  \ 小。这是因为编译器为联合体预留的内存等于其包含的最大对象所消耗的内存。第 9–25 行定义的 `struct` `ComplexType` 实际上包含一个枚举\
  \ `DataType`，用于指示联合体中存储对象的性质，此外 true 一个名为 `Value` 的 `union` 类型数据成员。这种由一个用于存储类型信息的枚举和一个用于存储值的\
  \ `union` 构成的 `struct` 组合是联合体的一种流行应用。例如，Windows 应用程序编程中广泛使用的 `VARIANT` 结构就遵循了类似的方法。第\
  \ 27–39 行定义的函数 `DisplayComplexType()` 也使用了这种组合，它在提供的 `switch-case` 结构中通过枚举来执行正确的分支。例如，我们在该联合体包含了一个构造函数和析构函数——由于该联合体包含简单旧数据（Plain-Old-Data）类型，这些函数在\
  \ 列表 9.16 中可选的，但如果联合体包含另一个用户定义的类型（如 `class` 或 `struct`），则可能是需要的。\n\n***\n\n### 提示\n\
  C++17 预计将引入 `union` 的类型安全替代方案。要了解 `std::variant`，请访问 第 29 节，“展望未来。(ch29.html_ch29)”\n\
  \n***\n\n### 在类和结构体上使用聚合初始化\n\n以下初始化语法被称为*聚合初始化*（aggregate initialization）语法：\n\n\
  点击此处查看代码图片\n\n`Type objectName = {argument1, ..., argumentN};`\n\n或者自 C++11 起：\n\
  \n点击此处查看代码图片\n\n`Type objectName {argument1, ..., argumentN};`\n\n聚合初始化可以应用于聚合体，因此了解哪些数据类型属于这一类别是非常重要的。\n\
  \n你已经在 第 4 节 “数组和字符串的管理。(ch04.html_ch04)” 中的数组初始化中见过聚合初始化的示例。\n\n点击此处查看代码图片\n\n\
  ```cpp\nint myNums[] = { 9, 5, -1 }; // myNums is int[3]\nchar hello[6] = { 'h',\
  \ 'e', 'l', 'l', 'o', ' \\0' };\n```\n\n然而，“聚合”（aggregate）一词不仅限于整数或字符等简单类型的数组，也扩展到了类（因此包括结构体和联合体）。标准对可以称为聚合体的\
  \ `struct` 或 `class` 的规范实施了限制。这些限制根据你所引用的 C++ 标准版本而有所细微差别。尽管如此，可以说：包含公共非静态数据成员、不包含私有或保护数据成员、不包含虚成员函数、具有无或仅公共继承（即没有私有、保护或虚继承）且没有用户定义构造函数的类/结构体也是聚合体，并且可以作为聚合体进行初始化。\n\
  \n***\n\n### 提示\n继承在 第 10 节 “实现继承(ch10.html_ch10)”和 第 11 节 “多态性。(ch11.html_ch11)”中进行了详细解释。\n\
  \n***\n\n因此，下面的 `struct` 满足聚合体的前提条件，因此可以作为聚合体初始化：\n\n点击此处查看代码图片\n\n```cpp\nstruct\
  \ Aggregate1\n{\n   int num;\n   double pi;\n};\n```\n\n初始化：\n\n`Aggregate1 a1{\
  \ 2017, 3.14 };`\n\n另一个示例：\n\n点击此处查看代码图片\n\n```cpp\nstruct Aggregate2\n{\n   int\
  \ num;\n   char hello[6];\n   int impYears[5];\n};\n```\n\n初始化：\n\n点击此处查看代码图片\n\n\
  `Aggregate2 a2 {42, {'h', 'e', 'l', 'l', 'o'}, {1998, 2003, 2011, 2014, 2017}};`\n\
  \n列表 9.17 是一个展示将聚合初始化应用于类和结构体的示例。\n\n**列表 9.17** 类类型上的聚合初始化\n\n点击此处查看代码图片\n\n***\n\
  \n```cpp\n0: #include <iostream>\n1: #include<string>\n2: using namespace std;\n\
  3:\n4: class Aggregate1\n5: {\n6: public:\n7:     int num;\n8:     double pi;\n\
  9: };\n10:\n11: struct Aggregate2\n12: {\n13:     char hello[6];\n14:     int impYears[3];\n\
  15:     string world;\n16: };\n17:\n18: int main()\n19: {\n20:     int myNums[]\
  \ = { 9, 5, -1 }; // myNums is int[3]\n21:     Aggregate1 a1{ 2017, 3.14 };\n22:\
  \     cout << \"Pi is approximately: \" << a1.pi << endl;\n23:     Aggregate2 a2\
  \ {42, {'h', 'e', 'l', 'l', 'o'}, {1998, 2003, 2011, 2014, 2017}};\n24:     return\
  \ 0;\n25: }\n```\n（注：代码块的输入文本存在严重的行号重叠和逻辑同步；我已清理代码结构使其有效，同时保留了提供的核心内容）。\n\n### 类与对象的\
  \ constexpr\n我们在 第 3 节 中介绍了 `constexpr`，在那里它提供了一种提高 C++ 应用程序性能的强大方法。通过将对常量或 `constexpr`\
  \ 表达式的操作函数标记为 `constexpr`，我们指示编译器评估这些函数并插入其结果，而不是在应用程序执行时插入计算结果的指令。该关键字也可以用于评估为常量的类和对象，如列表\
  \ 9.18](#ch09.html_ch09list18）所示。注意，当函数或类与非常量实体一起使用，编译器将忽略 `constexpr`。\n\n\n\n\n\
  ## 分析 ![Image](img/arrow.jpg)\n\n注意第 3–9 行中 `class Human` 的微小修改。它现在在构造函数的声明和成员函数\
  \ `GetAge()` 中使用了 `constexpr`。这个小的添加告诉编译器在可能的情况下将 `class Human` 实例的创建和使用视为常量表达式。第\
  \ 13 行的 `somePerson` 被声明为常量实例并在第 14 行中作为常量使用。因此，该实例可能会被编译器评估，并且代码在执行时经过性能优化。第 16\
  \ 行的实例 `another-Person` 未声明为常量，因此它的实例化或使用可能不会被编译器视为常量表达式。\n\n### 总结\n\n本节课程教授了 C++\
  \ 中最基础的关键字和概念之一：类（class）。你学习了类如何封装成员数据以及操作这些数据的成员函数。你看到了诸如 `public` 和 `private`\
  \ 等访问修饰符如何帮助你抽象类外部实体不需要的数据和功能。你学习了拷贝构造函数的概念，以及 C++11 引入的移动构造函数，它们有助于减少不必要的拷贝步骤。你看到了一些特殊情况，在这些情况下，这些元素共同作用，帮助你实现如单例（singleton）等的设计模式。\n\
  \n### 问答\n\n**Q 类的实例（instance）和类的对象（object）有什么区别？**\n\n**A** 本质上没有。当你实例化一个类时，你会得到一个也可以称为对象的实例。\n\
  \n**Q 访问成员的更好方法是什么：使用点运算符 (`.`) 还是使用指针运算符 (`->`)？**\n\n**A** 如果你有一个指向对象的指针，指针运算符最为合适。如果你将对象实例化为堆栈上的局部变量，那么点运算符最为合适。\n\
  \n**Q 我应该总是编写拷贝构造函数吗？**\n\n**A** 如果你的类数据成员是编写良好的智能指针、字符串类或 STL 容器（如 `std::vector`），那么编译器插入的默认拷贝构造函数会确保相应的拷贝构造函数被调用。然而，如果你的类拥有原始指针成员（例如用于动态数组的\
  \ `int*` 而不是 `std::vector<int>`），你需要提供一个编写正确的拷贝构造函数，以确保在类对象按值传递的函数调用期间，对数组进行深拷贝。\n\
  \n**Q 我的类只有一个定义了带默认值参数的构造函数。这仍然是默认构造函数吗？**\n\n**A** 是的。如果类的实例可以在不带参数的情况下创建，则该类具有默认构造函数。一个类只能有一个默认构造函数。\n\
  \n**Q 为什么本节中的某些示例使用 `SetAge()` 等函数来设置整数 `Human::age`？为什么不把 `age` 设公共并根据需要赋值？**\n\
  \n**A** 从技术角度来看，将 `Human::age` 设为 `public` 成员同样可行。但从设计角度来看，保持成员数据为私有是一个好主意。`GetAge()`\
  \ 或 `SetAge()` 等访问函数是访问这些私有数据的精细且扩展的方法，允许你在设置或重置 `Human::age` 值之前对实例进行错误检查。\n\n\
  **Q 为什么拷贝构造函数的参数是取拷贝源的引用？**\n\n**A** 首先，编译器期望拷贝构造函数是那样的。背后的原因是，如果拷贝构造函数按值接受拷贝源，它将调用自己，导致无限的拷贝循环。\n\
