  \ `append` 函数的能力，它具有许多重载版本，可以接受另一个 `string` 对象（如第 11 行所示），也可以接受 C 风格的字符字符串。\n\n\
  ### 在字符串中查找字符或子字符串\nSTL `string` 提供了一个 `find()` 成员函数，并带有几个重载版本，帮助在给定的 `string` 对象中查找字符或子字符串。\n\
  \n点击此处查看代码图片\n\n```cpp\n// 在 sampleStr 中从位置 0 开始查找子字符串 \"day\"\nsize_t charPos =\
  \ sampleStr.find (\"day\", 0);\n// 检查是否找到了子字符串，与 string::npos 进行比较\nif (charPos\
  \ != string::npos)\n    cout << \"First instance of \\\"day\\\" was found at position\
  \ \" << charPos;\nelse\n    cout << \"Substring not found.\";\n```\n\n`Listing 16.4`\
  \ 展示了 `std::string::find()` 的用处。\n\n**列表 16.4** 使用 `string::find()` 定位子字符串或 `char`\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <string>\n1: #include <iostream>\n2:\n3: int\
  \ main ()\n4: {\n5:     using namespace std;\n6:\n7:     string sampleStr (\"Good\
  \ day String! Today is beautiful!\");\n8:     cout << \"Sample string is:\" << endl\
  \ << sampleStr << endl << endl;\n9:\n10: // 在 sampleStr 中从位置 0 开始查找子字符串 \"day\"\n\
  11:     size_t charPos = sampleStr.find (\"day\", 0);\n12: // 检查是否找到了子字符串，与 string::npos\
  \ 进行比较\n13:     if (charPos != string::npos)\n14:         cout << \"First instance\
  \ of \\\"day\\\" was found at position \" << charPos;\n15:     else\n16:       \
  \  cout << \"Substring not found.\";\n17:\n18:     // Locating all instances of\
  \ \"day\"\n19:     size_t strPos_ = sampleStr.find(\"day\");\n20:     while (strPos_\
  \ != string::npos) {\n21:         cout << \"Found instance of \\\"day\\\" at position\
  \ \" << strPos_ << endl;\n22:         // 从下一个位置开始查找\n23:         strPos_ = sampleStr.find(\"\
  day\", strPos_ + 1);\n24:     }\n25:\n26:     return 0;\n27: }\n```\n\n\n\n\n```cpp\n\
  cout << \"The original sample string is: \" << endl;\ncout << sampleStr << endl\
  \ << endl;\n\n// Delete characters given position and count\ncout << \"Truncating\
  \ the second sentence: \" << endl;\nsampleStr.erase (13, 28);\ncout << sampleStr\
  \ << endl << endl;\n\n// Find character 'S' using find() algorithm\nstring::iterator\
  \ iCharS = find (sampleStr.begin (),\n                                 sampleStr.end\
  \ (), 'S');\n\n// If character found, 'erase' to deletes a character\ncout << \"\
  Erasing character 'S' from the sample string:\" << endl;\nif (iCharS != sampleStr.end\
  \ ())\n    sampleStr.erase (iCharS);\n\ncout << sampleStr << endl << endl;\n\n//\
  \ Erase a range of characters using an overloaded version of erase()\ncout << \"\
  Erasing a range between begin() and end(): \" << endl;\nsampleStr.erase (sampleStr.begin\
  \ (), sampleStr.end ());\n\n// Verify the length after the erase() operation above\n\
  if (sampleStr.length () == 0)\n    cout << \"The string is empty\" << endl;\n\n\
  return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n原始示例字符串为：\nHello\
  \ String! Wake up to a beautiful day!\n\n截断第二个句子：\nHello String!\n\n从示例字符串中删除字符\
  \ 'S'：\nHello tring!\n\n删除 begin() 和 end() 之间的范围：\n字符串为空\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n该代码列表显示了 `erase()` 函数的三个版本。其中一个版本在提供起始偏移量和计数时删除一组字符，如第 14 行所示。另一个版本在给定指向该字符的迭代器时删除特定字符，如第\
  \ 24 行所示。最后一个版本通过给定两个提供该范围边界的迭代器来删除范围内的字符，如第 30 行所示。由于该范围的边界是由 `string` 的 `begin()`\
  \ 和 `end()` 成员函数提供的，这实际上包含了字符串的所有内容，因此对该范围调用 `erase()` 将清空字符串对象的内容。注意，`string` 类还提供了一个\
  \ `clear()` 函数，可以有效地清空内部缓冲区并重置 `string` 对象。\n\n### 提示\n\nC++11 帮助简化冗长的迭代器声明，如列表\
  \ 16.5 所示：\n\n```cpp\n点击此处查看代码图像\nstring::iterator iCharS = find (sampleStr.begin(),\n\
  \                                 sampleStr.end (), 'S');\n```\n\n为了减少这种情况，可以使用第\
  \ 3 节 中“使用变量、声明常量”中引入的 `auto` 关键字：\n\n```cpp\n点击此处查看代码图像\nauto iCharS = find (sampleStr.begin(),\n\
  \                   sampleStr.end (), 'S');\n```\n\n编译器根据 `std::find()` 的返回值自动推导出\
  \ `iCharS` 的类型。\n\n### 字符串反转\n\n有时反转字符串的内容是非常重要的。假设你想确定用户输入的字符串是否为回文。一种方法是反转该相同字符串的副本，然后比较两者。STL\
  \ 字符串可以使用通用算法 `std::reverse()` 轻松地反转：\n\n```cpp\n点击此处查看代码图像\nstring sampleStr (\"\
  Hello String! We will reverse!\");\nreverse (sampleStr.begin (), sampleStr.end ());\n\
  ```\n\n列表 16.6 展示了算法 `std::reverse()` 在 `std::string` 中的应用。**列表 16.6** 使用 `std::reverse`\
  \ 反转 STL 字符串\n\n```cpp\n点击此处查看代码图像\n#include <string>\n#include <iostream>\n#include\
  \ <algorithm>\n\nint main () {\n    using namespace std;\n    string sampleStr (\"\
  Hello String! We will reverse!\");\n    cout << \"The original string is: \" <<\
  \ endl;\n    cout << sampleStr << endl << endl;\n\n    reverse (sampleStr.begin\
  \ (), sampleStr.end ());\n    cout << \"After applying the std::reverse algorithm:\
  \ \" << endl;\n    cout << sampleStr << endl;\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n原始示例字符串为：\nHello String! We will reverse!\n应用 std::reverse 算法后：\n\
  !uoy esrever lliw eW !gnirtS olH\n\n## 分析 ![Image](img/arrow.jpg)\n\n第 12 行使用的 `std::reverse()`\
  \ 算法在通过两个输入参数提供的容器边界上工作。在这种情况下，这些边界是 `string` 对象的起始和结束边界，反转了整个字符串的内容。也可以通过输入适当的边界来部分反转字符串。注意，该范围的边界是\
  \ `begin()` 和 `end()` 的。\n\n### 字符串转换\n\n字符串转换可以使用算法 `std::transform()` 实现，它对集合的每个元素应用指定的函数。在这种情况下，集合是\
  \ `string` 对象本身。列表 16.7 显示了如何切换 `string` 的大小写。**列表 16.7** 使用 `std::transform()`\
  \ 转换 STL 字符串的大写\n\n```cpp\n点击此处查看代码图像\n#include <string>\n#include <iostream>\n\
  #include <algorithm>\n\nint main () {\n    using namespace std;\n    cout << \"\
  Please enter a string for case-convertion:\" << endl;\n    cout << \"> \";\n\n \
  \   string inStr;\n    getline (cin, inStr);\n    cout << endl;\n\n    transform(inStr.begin(),\
  \ inStr.end(), inStr.begin(), ::toupper);\n    cout << \"The string converted to\
  \ upper case is: \" << endl;\n    cout << inStr << endl << endl;\n\n    transform(inStr.begin(),\
  \ inStr.end(), inStr.begin(), ::tolower);\n    cout << \"The string converted to\
  \ lower case is: \" << endl;\n    cout << inStr << endl << endl;\n\n    return 0;\n\
  }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n请输入一个用于转换转换的字符串：\n> ConverT\
  \ thIS Str!\n转换为大写的字符串为：\nCONVERT THIS STRING!\n转换为小写的字符串为：\nconvert this string!\n\
  \n## 分析 ![Image](img/arrow.jpg)\n\n第 15 行和第 19 行展示了如何高效地使用 `std::transform()` 更改字符串的内容\n\
  \n### STL 字符串的模板实现\n\n正如你所学的，`std::string` 类实际上是 STL 模板类 `std::basic_string <T>`\
  \ 的特化。容器 `basic_string` 的模板声明如下：\n\n```cpp\n点击此处查看代码图像\ntemplate<class _Elem,\n\
  \    class _Traits,\n    class _Ax>\n    class basic_string\n```\n\n在这个模板定义中，最重要的参数是第一个：`_Elem`。它是\
  \ `basic_string` 对象收集的类型。因此，`std::string` 是针对 `_Elem=char` 的模板特化，而 `wstring` 是针对\
  \ `_Elem=wchar_t` 的模板特化。换句话说，STL `string` 类定义为：\n\n```cpp\n点击此处查看代码图像\ntypedef basic_string<char,\
  \ char_traits<char>, allocator<char> >\n    string\n```\n\n而 STL `wstring` 类定义为：\n\
  \n```cpp\n点击此处查看代码图像\ntypedef basic_string<wchar_t, char_traits<wchar_t>, allocator<wchar_t>\
  \ >\n    string;\n```\n\n\n\n\n因此，到为止学习的所有字符串特性和函数实际上都是由 `basic_string` 提供的，因此也适用于\
  \ STL 的 `wstring` 类。\n\n* * *\n\n**提示**\n\n在编写需要更好地支持非拉丁字符（如日语或中文字符）的应用程序时，你会使用\
  \ `std::wstring`。\n\n* * *\n\n### C++14 中 `std::string` 中的 `operator \"\"s`\n\n\
  符合 C++14 标准的库版本支持 `operator \"\"s`，它可以将引号内的字符串完整地转换为 `std::basic_string<t>`。如列表\
  \ 16.8 所示，这使得某些字符串操作变得直观而简单。\n\n**列表 16.8** 使用 C++14 引入的 `operator \"\"s`\n\n点击此处查看代码图像\n\
  \n* * *\n\n```\n0: #include<string>\n1: #include<iostream>\n2: using namespace std;\n\
  3:\n\n4: int main()\n5: {\n6:     string str1(\"Traditional string \\0 initialization\"\
  );\n7:     cout << \"Str1: \" << str1 << \" Length: \" << str1.length() <<  endl;\n\
  8:\n\n9:     string str2(\"C++14 \\0 initialization using literals\"s);\n10:   \
  \  cout << \"Str2: \" << str2 << \" Length: \" << str2.length() <<  endl;\n11:\n\
  12:     return 0;\n13: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nStr1: Traditional string Length: 19\n\nStr2: C++14 initialization using literals\
  \ Length: 37\n\n**分析** ![Image](img/arrow.jpg)\n\n第 6 行从普通字符字面量初始化了一个 `std::string`\
  \ 实例。注意字符串中间放置的空字符，这导致 `str1` 完全忽略了 `\"initialization\"` 这个单词。第 9 行使用了 C++14 引入的\
  \ `operator \"\"s`，演示了实例 `str2` 现在如何能够包含（因此也可以操作）包含空字符的字符缓冲区，例如。\n\n* * *\n\n**注意**\n\
  \nC++14 在 `std::chrono` 中引入了字面量 `operator \"\"s`，如下：\n\n点击此处查看代码图像\n\n```\nstd::chrono::seconds\
  \ timeInSec(100s); // 100 秒\nstd::string timeinText = \"100\"s; // 字符串 \"100\"\n\
  ```\n\n前者表示秒数，是一个整数字面量，而后者给出一个字符串。\n\n* * *\n\n* * *\n\n**提示**\n\n预计 C++17 将引入 `std::string_view`，它有望通过避免不内存分配来提高性能。访问第\
  \ 29 ，“展望”，以了解此特性以及预计在 C++17 中的其他特性。\n\n* * *\n\n### 总结\n\n在本节中，你学习了 STL `string`\
  \ 类是标准模板库提供的一个容器，它可以帮助程序员处理许多字符串操作需求。使用该类的优势显而易见，程序员实现内存管理、字符串比较和字符串操作函数的需求已由 STL\
  \ 框架提供的容器类处理了。\n\n### 问答\n\n**Q 我需要使用 `std::reverse()` 反转字符串。我需要包含哪个头文件才能使用此函数？**\n\
  \n**A** `<algorithm>` 是使用 `std::reverse()` 需要包含的头文件。\n\n**Q 在使用 `tolower()` 函数将字符串转换为小写时，`std::transform()`\
  \ 起了什么作用？**\n\n**A** `std::transform()` 为 `string` 对象中位于 transform 函数提供的边界范围内的字符调用\
  \ `tolower()`。\n\n**Q 为什么 `std::wstring` 和 `std::string` 具有完全相同的行为和成员函数？**\n\n**A**\
  \ 这是因为它们都是模板类 `std::basic_string` 的模板特化化版本。\n\n**Q STL `string` 类的比较运算符 `<` 产生的结果是大小敏感还是不大小敏感的？**\n\
  \n**A** 结果基于大小敏感的比较。\n\n## 工作坊\n\n工作坊包含测验题，帮助巩固你对涵盖内容的理解，并提供练习以获得使用所学内容的经验。在检查附录\
