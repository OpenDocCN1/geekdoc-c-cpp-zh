  ### 总结\n\n在本节中，你学习了 `vector` 和 `deque` 作为动态数组的基础知识。解释了大小和容量的概念，并看到了如何优化 `vector`\
  \ 的用法以减少内部缓冲的重新分配。`vector` 是 STL 容器中最简单的，也是最常用的，而且是效率最高的之一。\n\n\n\n\n\n**2.** 我的\
  \ `vector` 返回的 `size()` 为 `10`，`capacity()` 为 `20`。在不需要触发 `vector` 类触发缓冲区重新分配的情况下，我还能向其中插入多少元素？\n\
  \n**3.** `pop_back()` 函数的作用是什么什么？\n\n**4.** 如果 `vector<int>` 是一个整数的动态数组，那么 `vector<Mammal>`\
  \ 是什么什么类型的动态数组？\n\n**5.** `vector` 中的元素可以被随机访问吗？如果可以，如何操作？\n\n**6.** 哪种迭代器类型允许对\
  \ `vector` 中的元素进行随机访问？\n\n### 练习\n\n**1.** 编写一个交互式程序，接受用户输入的整数并将其保存在 `vector` 中。用户应该能够根据索引随时查询存储在\
  \ `vector` 中的某个值。\n\n**2.** 扩展练习 1 中的程序，能够告诉用户其查询的值是否已经存在于 `vector` 中。\n\n**3.**\
