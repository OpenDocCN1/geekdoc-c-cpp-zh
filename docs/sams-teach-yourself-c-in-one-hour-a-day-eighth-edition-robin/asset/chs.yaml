  \ 类对象，该类继承自 `std::exception`。注意我们的自定义异常类在第 13–16 行中实现了虚函数 `what()`，它本质上返回了抛出异常的原因。`main()`\
  \ 中第 39–43 行的 `catch(exception&)` 逻辑不仅处理了 `class CustomException`，还处理了具有相同基类 `exception`\
