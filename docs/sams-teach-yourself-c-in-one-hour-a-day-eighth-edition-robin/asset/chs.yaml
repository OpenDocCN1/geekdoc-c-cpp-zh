  \            return buffer[index];\n    }\n\n    // 析构函数\n    ~MyString()\n    {\n\
  \        if (buffer != NULL)\n            delete [] buffer;\n    }\n\n    int GetLength()\
  \ const\n    {\n        return strlen(buffer);\n    }\n\n    operator const char*()\n\
