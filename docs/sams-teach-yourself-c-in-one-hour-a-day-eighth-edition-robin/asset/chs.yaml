  \ (), element);\n14:\n15:        cout << \"Element at position \";\n16:        cout\
  \ << index << \" is: \" << *element << endl;\n17:\n18:        // 移动到下一个元素\n19: \
  \       ++ element;\n20:    }\n21:\n22:    return 0;\n23: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\nElement at position 0 is: 50\nElement at position 1 is: 1\nElement\
  \ at position 2 is: 987\nElement at position 3 is: 1001\n\n\n\n与 `vector` 通过 `push_back()`\
  \ 函数在末尾插入元素的特征一样，它也具有通过 `pop_back()` 函数移除末尾元素的功能。使用 `pop_back()` 从 `vector` 中移除元素需要常数时间——O(1)——也就是说，所需的时间与\
  \ `vector` 中存储的元素数量无关。接下来的列表 17.6 所示代码演示了如何使用函数 `pop_back()` 来删除 `vector` 末尾的元素。\n\
  \n**列表 17.6** 使用 `pop_back()` 删除最后一个元素\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
