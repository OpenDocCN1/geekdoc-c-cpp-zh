  \n### `std::exception` 类\n\n在列表 28.2 捕获 `bad_alloc` 时，你实际上捕获了由 `new` 抛出的 `bad_alloc`\
  \ 类对象。`bad_alloc` 是继承自 C++ 标准类 `std::exception` 的类，声明在头文件 `<exception>` 中。`std::exception`\
  \ 是以下重要异常的基类：\n\n- `bad_alloc`: 使用 `new` 请求内存失败抛出。\n- `bad_cast`: 当尝试转换错误的类型（类型之间没有继承关系）时，由\
  \ `dynamic_cast` 抛出。\n- `ios_base::failure`: 由 `iostream` 库中的函数和方法抛出。\n\n基类 `std::exception`\
  \ 类支持一个非常有用且重要的虚方法 `what()`，它可以就导致异常的问题性质提供更详细的描述。在列表 28.2 中，第 18 行的 `exp.what()`\
  \ 提供了信息。基类支持一个非常有用且重要的虚方法 `what()`，它可以就导致异常的问题性质提供更详细的描述。你可以利用 `std::exception`\
  \ 作为基类并创建一个捕获所有异常的 `catch(const exception&)`，通过 `exp.what()` 告诉你发生了什么。\n\n```\n\
  void SomeFunc()\n{\n    try\n    {\n        // code made safe\n    }\n    catch\
  \ (const exception& exp)\n    {\n        cout << \"Exception encountered: \" <<\
  \ exp.what() << endl;\n    }\n}\n```\n\n### 继承自 `std::exception` 的自定义异常类\n\n你可以抛出任何类型的异常。然而，继承自\
  \ `std::exception` 有其好处——`bad_alloc`、`bad_cast` 等类的异常处理器会自动扩展到捕获你的新异常，因为它们具有共同的基类。这在列表\
  \ 28.5 中演示。\n\n### 列表 28.5 继承自 `std::exception` 的 `CustomException` 类\n\n点击此处查看代码图像\n\
  \n```\n0: #include <exception>\n1: #include <iostream>\n2: #include <string>\n3:\
  \ using namespace std;\n4:\n5: class CustomException: public std::exception\n6:\
  \ {\n7:     string reason;\n8: public:\n9:     // constructor, needs reason\n10:\
  \     CustomException(const char* why):reason(why) {}\n11:\n12:     // redefining\
  \ virtual function to return 'reason'\n13:     virtual char* what() const()\n14:\
  \     {\n15:         return reason.c_str();\n16:     }\n17: };\n18:\n19: double\
  \ Divide(double dividend, double divisor)\n20: {\n21:     if(divisor == 0)\n22:\
  \         throw CustomException(\"CustomException: Dividing by 0 is a crime\");\n\
  23:\n24:     return (dividend / divisor);\n25: }\n26:\n27: int main()\n28: {\n29:\
  \     cout << \"Enter dividend: \";\n30:     double dividend = 0;\n31:     cin >>\
  \ dividend;\n32:     cout << \"Enter divisor: \";\n33:     double divisor = 0;\n\
  34:     cin >> divisor;\n35:     try\n36:     {\n37:         cout << \"Result is:\
  \ \" << Divide(dividend, divisor);\n38:     }\n39:     catch(exception& exp)// catch\
  \ CustomException, bad_alloc, etc\n40:     {\n41:         cout << exp.what() <<\
  \ endl;\n42:         cout << \"Sorry, can't continue!\" << endl;\n43:     }\n44:\n\
  45:     return 0;\n46: }\n```\n\n\n\n\n\n点击此处查看代码图像\n\n输入被除数：2011\n\n输入除数：0\n\n\
  `CustomException: Dividing by 0 is a crime`\n\n抱歉，无法继续！\n\n分析 ![Image](img/arrow.jpg)\n\
