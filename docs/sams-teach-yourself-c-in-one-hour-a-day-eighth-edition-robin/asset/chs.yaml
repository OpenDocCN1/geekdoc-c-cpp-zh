  \n**图 17.2** `deque` 的内部结构。\n\n`deque` 与 `vector` 类似，它们支持通过 `push_back()` 和 `pop_back()`\
  \ 函数在末尾进行元素的插入和删除。就像 `vector` 一样，`deque` 也允许你通过下标运算符（`[]`）使用数组语义来访问它。`deque` 与 `vector`\
  \ 的之处在于，它还允许你使用 `push_front()` 在头部插入元素，并使用 `pop_front()` 从头部删除元素，如列表 17.8 所示。\n\n\
