  \n***\n\n### 注意\n永远在不检查返回的迭代器的情况下直接使用 `find()` 操作的结果。\n\n***\n\n### 在 STL `multimap`\
  \ 中查找元素\n\n如果 列表 20.3 是一个 `multimap`，由于容器可能包含多个具有相同键的键值对，你需要找到与重复键对应的所有值。因此，在 `multiset`\
  \ 的情况下，你会使用 `multiset::count()` 来查找与键对应的值数量，并递增迭代器以访问这些存储的值。\n\n点击此处查看代码图像\n\n```cpp\n\
  auto pairFound = mapIntToStr.find(key);\n// 检查 find() 是否成功\nif(pairFound != mapIntToStr.end())\n\
  {\n    // 查找具有相同键的键值对数量\n    size_t numPairsMap = mapIntToStr.count(1000);\n   \
  \ for(size_t counter = 0;\n        counter < numPairsMap; // 保持在范围内\n        ++\
  \ counter )\n    {\n        cout << \"Key: \" << pairFound->first; // key\n    \
  \    cout << \", Value [\" << counter << \"] = \";\n        cout << pairFound->second\
  \ << endl; // value\n        ++ pairFound;\n    }\n}\nelse\n    cout << \"Element\
  \ not found in the multimap\";\n```\n\n### 从 STL `map` 或 `multimap` 中删除元素\n\n`map`\
  \ 和 `multimap` 具有成员函数 `erase()`，它可以从容器中删除元素。调用 `erase()` 时使用键作为参数删除所有具有特定键的键值对：\n\
  \n```cpp\nmapObject.erase(key);\n```\n\n`erase()` 函数的另一种形式允许通过指向特定元素的迭代器进行删除：\n\n\
  ```cpp\nmapObject.erase(element);\n```\n\n可以使用提供边界的迭代器从 `map` 或 `multimap` 中删除范围元素：\n\
  \n```cpp\nmapObject.erase(lowerBound, upperBound);\n```\n\n列表 20.4 演示了 `erase()`\
  \ 函数的用法。\n\n**列表 20.4** 从 `multimap` 中删除元素\n\n\n\n\n\nmultimap 现在包含 1 个键-值对。它们是：\n\
  \n3 -> Three\n\n分析 ![Image](img/arrow.jpg)\n\n第 21–28 行向 `multimap` 插入了示例值，其中一些值是重复的（因为与\
  \ `map` 不同，`multimap` 支持插入具有重复键的键对）。在将 `pair` 插入 `multimap` 之后，代码使用 `erase` 函数的一个版本来删除项，该版本接受一个键并删除所有具有该键的项（-），如第\
  \ 35 行所示。`map::erase(key)` 的返回值是被删除的元素个数，并显示在屏幕上。在第 39 行中，你使用 `find(45)` 返回的迭代器从\
  \ map 中删除键为 45 的键对。第 48 行和 49 行演示了如何根据 `lower_bound()` 和 `upper_bound()` 指定的范围删除具有特定键的键对。\n\
  \n### 传递自定义排序谓词\n\n`map` 和 `multimap` 模板定义包含第三个参数，该参数接受 `map` 正确运行所需的排序谓词。当未提供此第三参数时（如前面的示例所示），它会被\
  \ `std::less <>` 提供的默认排序标准取代，它本质上使用 `operator <` 比较两个对象。\n\n要提供不同于键类型本身支持的排序标准，你通常需要以类或结构体的形式使用\
  \ `operator()` 编写一个二元谓词：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename keyType>\nstruct\
  \ Predicate\n{\n   bool operator()(const keyType& key1, const keyType& key2)\n \
  \  {\n      //在此处编写你的排序优先级逻辑\n    }\n};\n```\n\n持有 `std::string` 类型作为键的 `map` 默认排序标准基于\
  \ `std::string` 类定义的 `operator <`，通过默认排序谓词 `std::less<T>` 触发，因此它是大小敏感的。对于许多应用程序（例如电话簿），提供一个不区分大小的插入和搜索操作是非常重要的。解决这一需求的方法之一为\
  \ `map` 提供一个排序谓词，该谓词根据不区分大小的比较返回 true 或 false：\n\n点击此处查看代码图像\n\n```cpp\nmap <keyType,\
  \ valueType, Predicate> mapObject;\n```\n\n列表 20.5 详细解释了这一点。\n\n**列表 20.5** 传递自定义排序谓词——电话簿\n\
