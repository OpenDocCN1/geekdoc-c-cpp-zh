  Constant string is: Hello String!\nstrFromConst is: Hello String!\nstr2Copy is:\
  \ Hello String!\nstrPartialCopy is: Hello\nstrRepeatChars is: aaaaa\n\n上述代码显示了如何实例化一个\
  \ `string` 对象并将其初始化为另一个字符串，创建部分拷贝或将你的 `string` 对象初始化为一组重复字符。`constCStyleString`\
  \ 是一个包含值的 C 风格字符字符串，在第 6 行初始化。第 9 行显示了 `std::string` 如何通过构造函数创建拷贝。第 12 行将另一个常量字符串拷贝到\
  \ `std::string` 对象中，第 13 行演示了 `std::string` 的另一个重载构造函数允许你拷贝一个 `std::string` 对象以得到\
  \ `str2Copy`。第 17 行演示了如何实现部分拷贝，第 21 行演示了 `std::string` 如何实例化并初始化为包含相同字符的出现。此代码示例只是小规模演示了\
  \ `std::string` 及其拷贝构造函数如何让程序员轻松地创建、拷贝和显示字符串。\n\n注意：如果你使用字符字符串从另一个同类型的字符串进行拷贝，则列表\
  \ 16.1 中第 9 行的对应代码如下：\n\n点击此处查看代码图像\n\n```cpp\nconst char* constCStyleString = \"\
  Hello World!\";\n// 为了创建一个拷贝，首先为其中分配内存\nchar* copy = new char [strlen(constCStyleString)\
  \ + 1];\nstrcpy(copy, constCStyleString); // \ndelete copy;\n```\n\n你可以看到，`string`\
  \ 的内容可以通过迭代器或下标运算符来访问。`string` 的表示可以通过成员函数 `c_str()` 获取。\n\n### 访问 `string` 的内容\n\
  \n**列表 16.2** 访问 `string` 的下标运算符与迭代器\n\n点击此处查看代码图像\n\n```cpp\n0: #include <string>\n\
  1: #include <iostream>\n2:\n3: int main ()\n4: {\n5:     using namespace std;\n\
  6:     string stlString (\"Hello String\");\n7:\n8:     // 使用下标运算符\n9:     cout\
  \ << \"Display elements in string using array-syntax: \" << endl;\n10:    for (size_t\
  \ charCounter = 0; charCounter < stlString.length(); ++charCounter)\n11:    {\n\
  12:        cout << \"Character [\" << charCounter << \"] is: \" << stlString[charCounter]\
  \ << endl;\n13:    }\n14:    cout << endl;\n15:\n16:    // 使用迭代器\n17:     cout <<\
  \ \"Display elements in string using iterators: \" << endl;\n18:     int charOffset\
  \ = 0;\n19:     string::const_iterator charLocator;\n20:     for (auto charLocator\
  \ = stlString.cbegin(); charLocator != stlString.cend(); ++charLocator)\n21:   \
  \  {\n22:        cout << \"Character [\" << charOffset++ << \"] is: \" << *charLocator\
  \ << endl;\n23:     }\n24:     cout << endl;\n25:\n26:     // 以 const char* 输出\n\
  27:     cout << \"The char* representation of the string is: \" << endl;\n28:  \
  \   cout << stlString.c_str () << endl;\n29:\n30:     return 0;\n31: }\n```\n\n\
