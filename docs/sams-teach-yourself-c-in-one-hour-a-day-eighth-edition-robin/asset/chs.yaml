  \ C++14 引入的 `operator \"\"`。\n\n## 第 18 own：STL `list` 和 `forward_list`\n\n标准模板库\
  \ (STL) 以模板类 `std::list` 的形式为程序员提供了双向链表。链表的主要优势在于可以快速且恒时间内插入和删除元素。从 C++11 开始，你还可以使用\
  \ `std::forward_list` 形式的单向链表，它只能单向遍历。\n\n在本节中，你将学习：\n\n- 如何实例化 `list` 和 `forward_list`\n\
  - 如何使用 STL list 类，包括插入和删除\n- 如何反转和排序元素\n\n### `std::list` 的特性\n\n`linked list`（链表）是一个节点集合，其中每个节点除了包含感兴趣的值或对象外，还指向下一个节点；也就是说，每个节点都连接到下一个和上一个节点，如图\
  \ 18.1 所示。\n\n**图 18.1** 双向链表的视觉表示。\n\nSTL 的 `list` 类实现允许在 `list` 的顶部、底部或中间进行常数时间的插入。\n\
  \n***\n\n**提示**\n\n使用类 `std::list`，请包含头文件：\n\n```cpp\n#include <list>\n```\n\n***\n\
  \n### 基本 `list` 操作\n\n要使用 STL 的 `list` 类，请包含头文件 `<list>`。存在于 `std` 命名空间中的模板类 `list`\
  \ 是一个通用实现，在使用任何实用的成员函数之前，需要对其进行模板实例化。\n\n#### 实例化 `std::list` 对象\n\n`list` 的模板实例化需要指定你想在链表中收集的对象类型。因此，列表的初始化看起来如下所示：\n\
  \n```cpp\nstd::list<int> linkInts;  // 包含整数的列表\nstd::list<float> listFloats;  //\
  \ 包含浮点数的列表\nstd::list<Tuna> listTunas;  // 包含 Tuna 类型对象的列表\n```\n\n要声明一个指向列表中元素的迭代器，你将使用：\n\
  \n```cpp\nstd::list<int>::const_iterator elementInList;\n```\n\n如果你需要一个可以用于修改值或调用非\
  \ `const` 函数的迭代器，请使用 `iterator` 而不是 `const_iterator`。\n\n由于 `std::list` 的实现提供了一组重载构造函数，你甚至可以创建初始化为包含指定数量元素的列表，每个元素都初始化为一个特定值，如列表\
  \ 18.1 所示。\n\n**列表 18.1** 实例化 `std::list` 的不同形式，指定元素数量和初始值\n\n```cpp\n0: #include\
  \ <list>\n1: #include <vector>\n2:\n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6:\n7:     // 实例化一个空列表\n8:     list<int> linkInts;\n9:\n10:    // 实例化一个包含\
  \ 10 个整数的列表\n11:    list<int> listWith10Integers(10);\n12:\n13:    // 实例化一个包含 4\
  \ 个整数的列表，每个值均为 99\n14:    list<int> listWith4IntegerEach (10, 99);\n15:\n16:   \
  \ // 创建一个现有列表的精确拷贝\n17:    list<int> listCopyAnother(listWith4Integer99);\n18:\n\
  19:    // 一个包含 10 个整数的 vector，每个值为 2017\n20:    vector<int> vecIntegers(10, 2017);\n\
  21:\n22:    // 使用来自另一个容器的值实例化列表\n23:    list<int> listCopyOfAnother(vecIntegers.cbegin(),\n\
  24:                               vecIntegers.cend());\n25:\n26:    return 0;\n\
  27: }\n```\n\n此程序没有输出，并演示了在创建整数列表时使用各种重载构造函数的应用。在第 8 行中，你创建了一个空列表，而在第 11 行中，你创建了一个包含\
  \ 10 个整数的列表。第 14 行是一个名为 `listWith4Integers99` 的列表，它包含 4 个每个初始化为值 99 的整数。第 17 行演示了创建一个与另一个列表精确拷贝的列表。第\
  \ 20–24 行令人惊讶且奇奇！你实例化了一个包含 10 个整数的 vector，每个整数值为 2017，然后在第 23 行中实例化了一个包含从 vector\
  \ 拷贝的元素的列表，使用了由 `vector::cbegin()` 和 `vector::cend()` 返回的 `const` 迭代器（C++11 新增）。列表\
  \ 18.1 同时也演示了迭代器如何帮助将一个容器的实现与另一个容器解耦，让你能够通过它们的泛型功能使用来自 `vector` 的值来实例化 `list`，如第\
  \ 23 和 24 行所示。\n\n***\n\n**注意**\n\n将列表 18.1 与第 17 节“STL 动态数组类”中的列表 17.1 进行对比，你会发现不同类型容器的实例化具有非常明显的模式和相似性。使用的\
  \ STL 容器越多，看到的模式就越多，操作也越简单。\n\n***\n\n#### 在列表头部或尾部插入元素\n\n与 `deque` 类似，头部（取决于视角）的插入通过\
  \ `list` 成员方法 `push_front()` 实现。尾部的插入通过成员方法 `push_back()` 完成。这两个方法接受一个输入参数，即要插入的值：\n\
  \n```cpp\nlinkInts.push_back (-1);\nlinkInts.push_front (2001);\n```\n\n列表 18.2\
  \ 演示了在整数列表上使用这两种方法的效果。\n\n**列表 18.2** 使用 `push_front()` 和 `push_back()` 在列表中插入元素\n\
  \n```cpp\n0: #include <list>\n1: #include <iostream>\n2: using namespace std;\n\
  3:\n4: template <typename T>\n5: void DisplayContents (const T& container)\n6: {\n\
  7:     for (auto element = container.cbegin();\n8:          element != container.cend();\n\
  9:          ++ element )\n10:        cout << *element << ' ';\n11:\n12:    cout\
  \ << endl;\n13: }\n14:\n15: int main ()\n16: {\n17:     std::list <int> linkInts{\
  \ -101, 42 };\n18:\n19:     linkInts.push_front (10);\n```\n\n\n\n\n\n```cpp\n20:\
  \    linkInts.push_front (2011);\n21:    linkInts.push_back (-1);\n22:    linkInts.push_back\
  \ (9999);\n24:\n    DisplayContents(linkInts);\n26:\n    return 0;\n27: }\n```\n\
  \n输出 ![Image](img/arrow.jpg)\n\n2011 10 -101 42 -1 9999\n\n### 分析\n\n分析 ![Image](img/arrow.jpg)\n\
  \n第 17 行展示了 `int` 类型的 `list` 模板实例化，并使用 C++11 列表初始化语法 `{...}` 来确保 `linkInts` 在构造时包含两个相互连接的整数（-101\
  \ 和 42）。第 19–22 行演示了 `push_front()` 和 `push_back()` 的用法。作为 `push_front()` 参数提供的值将占据列表的第一个位置，而通过\
  \ `push_back()` 发送的值将占据最后一个位置。输出通过泛型模板函数 `DisplayContents()` 显示了列表的内容，展示了插入元素的顺序（并证明它们并不是按照插入顺序存储的）。\n\
  \n### 注意事项\n\n列表 18.2 中第 4–13 行的 `DisplayContents()` 是 列表 17.6 中 `DisplayVector()`\
  \ 方法的更通用版本（注意参数列表发生了变化）。尽管后者仅对 `vector` 有效（尽管将其内部存储的元素类型泛化），但此版本即使跨越容器类型也是真正通用的。\n\
  \n你可以使用 `vector`、`list` 或 `deque` 作为参数调用 列表 18.2 中的 `DisplayContents()` 版本，它将运行得非常完好。\n\
  \n### 在列表中间插入元素\n\n`std::list` 的特点是其能力能够在常数时间内在集合中间插入元素。这是通过成员函数 `insert()` 实现的。\n\
  \n`list::insert()` 成员函数三种三种：\n\n![Image](img/square.jpg) **形式 1**\n\n点击此处查看代码图片\n\
  \n```cpp\niterator insert(iterator pos, const T& x)\n```\n\n在这里，`insert` 函数接受插入位置作为第一个参数，接受要插入的值作为第二个参数。该函数返回一个指向列表中最近插入的元素的迭代器。\n\
  \n![Image](img/square.jpg) **形式 2**\n\n点击此处查看代码图片\n\n```cpp\nvoid insert(iterator\
  \ pos, size_type n, const T& x)\n```\n\n此函数接受插入位置作为第一个参数，接受要插入的值作为最后一个参数，以及变量 `n`\
  \ 中的元素数量。\n\n![Image](img/square.jpg) **形式 3**\n\n点击此处查看代码图片\n\n```cpp\ntemplate\
  \ <class InputIterator>\nvoid insert(iterator pos, InputIterator f, InputIterator\
  \ l)\n```\n\n此重载变体是一个模板函数，除了接受位置外，还接受两个输入迭代器，这两个迭代器标记了要插入列表的集合边界。注意输入类型 `InputIterator`\
  \ 是一个模板参数化类型，因此它可以指向任何集合的边界——无论是数组、`vector` 还是另一个 `list`。\n\n列表 18.3 演示了 `list::insert()`\
  \ 函数这些重载变体的用法。\n\n**列表 18.3** 在列表中插入元素的各种方法\n\n点击此处查看代码图片\n\n```cpp\n0: #include\
  \ <list>\n1: #include <iostream>\n2: using namespace std;\n3:\n4: template <typename\
  \ T>\n5: void DisplayContents (const T& container)\n6: {\n7:     for (auto element\
  \ = container.cbegin();\n8:             element != container.cend();\n9:       \
  \      ++ element )\n10:          cout << *element << ' ';\n11:\n12:     cout <<\
  \ endl;\n13: }\n14:\n15: int main ()\n16: {\n17:     list <int> linkInts1;\n18:\n\
  19:     // 在开头插入元素...\n20:     linkInts1.insert (linkInts1.begin (), 2);\n21:  \
  \   linkInts1.insert (linkInts1.begin (), 1);\n22:\n23:     // 在末尾插入一个元素...\n24:\
  \     linkInts1.insert (linkInts1.end (), 3);\n25:\n26:     cout << \"The contents\
