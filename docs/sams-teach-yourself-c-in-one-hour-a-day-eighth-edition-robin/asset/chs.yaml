  \ 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\nvector 的内容：\n0 0 1 \n\nvector 的内容：\n\
  1 1 0 \n\n### 总结\n\n在本节中，你学习了处理位序列和位标志的最有效工具：`std::bitset` 类。你还了解了 `vector<bool>`\
  \ 类，它允许你存储不需要在编译时知道数量的 own 标志。\n\n### 问答\n\n**Q 在 `bitset` 和 `vector<bool>` 都可以的情况下，你倾向于使用哪一个类来处理你的二进制标志？**\n\
  \n答：使用 bitset，因为它更适合这种需求。\n\n**Q 我有一个名为 `myBitSet` 的 `bitset` 对象，它包含某些存储位。我该如何确定哪些位的值为\
  \ 0（或 false）？**\n\n答：`bitset::count()` 提供值为 1 的位数量。将此数字减去 `bitset::size()`（它返回存储的总位数），即可得到序列中\
  \ 0 的数量。\n\n\n\n\n\n# 问：可以使用迭代器访问 `vector<bool>` 中的单个元素吗？\n\n**答** 可以的。因为 `vector<bool>`\
  \ 是 `std::vector` 的部分特化，所以它支持迭代器。\n\n# 问：我可以在编译时指定 `vector<bool>` 持有的元素数量吗？\n\n\
  **答** 可以的，可以通过在重载构造函数中指定数量，或者在稍后使用 `vector<bool>::resize()` 函数来实现。\n\n## 工作坊\n\n\
