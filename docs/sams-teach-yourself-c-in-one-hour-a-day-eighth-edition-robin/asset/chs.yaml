  \    }\n};\n```\n\n列表 12.9 中的示例展示了下标运算符（`[]`）如何帮助用户使用标准的数组语义遍历 `MyString` 实例中包含的字符。\n\
  \n\n\n\n\n```cpp\nusing namespace std;\n\nclass MyString\n{\nprivate:\n    char*\
  \ buffer;\n\n    // 私有默认构造函数\n    MyString() {}\n\npublic:\n    // 构造函数\n    MyString(const\
