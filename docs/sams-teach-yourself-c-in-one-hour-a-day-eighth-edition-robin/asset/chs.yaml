  本节向你教授了数组的基础知识、它们是什么以及它们可以用什么地方。你学习了如何声明它们、初始化它们、访问数组中的元素以及向数组中的元素写入值。你学习了不超出数组边界是多么重要。这被称为\
  \ `buffer overflow`（缓冲区溢出），在用于索引元素之前对输入进行检查有助于确保不会越界数组的限制。\n\n动态数组是指程序员不需要在编译时固定数组最大长度的数组，在实际量少于预期最大值的情况下，它们允许更好的内存管理。\n\
  \n你还学习了 C 风格字符串是 `char` 数组的一种特殊情况，其中字符串的结束由空终止字符 `'\\0'` 标记。更重要的是，你学习了 C++ 在 `std::string`\
  \ 中提供了一个更好的选择，它提供了方便的实用函数，让你能够确定长度、进行连接并执行类似的操作。\n\n### 问答\n\n**Q 为什么要费劲初始化静态数组的元素？**\n\
  \n**A** 除非初始化，否则与任何其他类型的变量不同，数组包含垃圾数据和不可预测的值，因为该位置的内在此之前的操作后没有被触动。初始化数组可以确保其中的信息具有明确且可预测的初始状态。\n\
  \n**Q 你是否需要由于第一个问题中提到的原因初始化动态数组的元素？**\n\n**A** 实际上，不需要。动态数组是非常智能的数组。除非与应用程序相关的特定需要在数组中具有某些初始值，否则数组中的元素不需要初始化为默认值。\n\
  \n**Q 如果有选择，你会使用需要空终止符的 C 风格字符串吗？**\n\n**A** 会，但除非有人拿枪指你的头。C++ `std::string` 安全得多，提供的特性应该让任何优秀的程序员都远离使用\
  \ C 风格字符串。\n\n**Q 字符串的长度包含末尾的空终止符吗？**\n\n**A** 不包含。字符串“Hello World”的长度为 11，包括空格但不包含结尾的空字符。\n\
