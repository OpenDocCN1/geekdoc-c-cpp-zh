  \ 5，然后再再次倍倍。这正确吗？\n\n点击此处查看代码图像\n\n```cpp\nint result = number << 1 + 5 << 1;\n\
  ```\n\n**6.** 当异或操作数都结果为真时，异或操作的结果是什么？\n\n### 练习\n\n**1.** 改进测验题 5 中的代码，使用括号来提高清晰度。\n\
  \n**2.** 由此表达式存储的 `result` 的值是多少：\n\n点击此处查看代码图像\n\n```cpp\nint result = number <<\
  \ 1 + 5 << 1;\n```\n\n**3.** 编写一个程序，要求用户输入两个布尔值，并演示各种位运算符在它们上操作的结果。\n\n# 第 6 节 控制程序流\n\
  \n大多数应用程序在面对新情况或不同用户输入时会有不同的行为。为了让你的应用程序做出不同的反应，你需要编写条件语句，以便在不同情况下执行不同的代码段。\n\n\
  在本节中，你将了解到\n\n![图像](img/square.jpg) 如何让你的程序在某些条件下表现得不同\n\n![图像](img/square.jpg)\
  \ 如何在循环中重复执行一段代码\n\n![图像](img/square.jpg) 如何在循环中更好地控制执行流\n\n## 使用 `if ... else`\
  \ 进行条件执行\n\n你目前所看到和编写的程序都是顺序执行的——从上到下。每一行都被执行了，没有任何一行代码被忽略。但在大多数应用程序中，按从上到下的顺序执行所有代码行很少发生。\n\
  \n想象你想要一个程序，如果用户按下 *m* 则将两个数字相乘，如果按下其他键则将数字相加。\n\n正如图 6.1 所示，并不是所有的代码路径在每次运行中都会执行。如果用户按下\
  \ *m*，就会执行乘以两个数字的代码。如果他输入 *m* 以外的任何内容，就会执行执行加法的代码。不存在两者同时执行的情况。\n\n![图像](img/06fig01.jpg)\n\
  \n**图 6.1** 根据用户输入所需的条件处理示例。\n\n### 使用 `if ... else` 进行条件编程\n\nC++ 使用 `if ... else`\
  \ 结构来实现代码的条件执行，结构如下：\n\n点击此处查看代码图像\n\n```cpp\nif (expression)\n    // 当表达式为真时执行\n\
  else\n    // 当表达式为假时执行\n```\n\n所以，`if ... else` 结构允许程序在用户输入 *m* 时进行乘法，否则进行加法，如下所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nif (userSelection == 'm')\n    result = num1 * num2;\nelse\n\
  \    result = num1 + num2;\n```\n\n注意，表达式评估为 `true` 意味着表达式不为 `false`。\n\n让我们分析列表\
  \ 6.1 中的此结构，它允许用户决定是相乘还是相加。\n\n**列表 6.1** 根据输入对整数进行乘法运算\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main() {\n    cout << \"输入整数：\" << endl;\n    int num1\
  \ = 0, num2 = 0;\n    cin >> num1;\n    cin >> num2;\n    cout << \"输入 'm' 乘法，其他为加法：\"\
  ;\n    char userSelection = '\\0';\n    cin >> userSelection;\n    int result =\
  \ 0;\n    if (userSelection == 'm')\n        result = num1 * num2;\n    else\n \
  \       result = num1 + num2;\n    cout << \"结果为：\" << result << endl;\n    return\
  \ 0;\n}\n```\n\n输出![图像](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入整数：\n25\n56\n输入 'm' 乘法，其他为加法：m\n\
  结果为：1400\n\n下次运行：\n\n点击此处查看代码图像\n\n输入整数：\n25\n56\n输入 'm' 乘法，其他为加法：a\n结果为：81\n\n\
  分析![图像](img/arrow.jpg)\n\n注意第 15 行的 `if` 和第 17 行的 `else`。我们指示编译器在跟随 `if` 后的表达式 `(userSelection\
  \ == 'm')` 评估为 `true` 时执行第 15 行的乘法，或者在评估为 `false` 时执行加法。`(userSelection == 'm')`\
  \ 是一个在用户输入字符 *m*（区分大小写）时评估为 `true` 的表达式，否则它评估为 `false`。因此，这个简单的程序模拟了图 6.1 中的流程图，并演示了你的应用程序如何在不同情况下表现不同。\n\
  \n注意\n\n`if ... else` 结构的 `else` 部分是可选的，在失败时无需要执行操作的情况下不需要使用。\n\n注意\n\n如果在列表 6.1\
  \ 中，第 15 行是：\n\n点击此处查看代码图像\n\n```cpp\n    if (userSelection == 'm');\n```\n\n那么\
  \ `if` 结构是没有意义的，因为它在同一行内被一个空语句（分号）终止了。请小心并避免这种情况，因为在这些情况下你不会得到编译错误。\n\n\n\n\n\n\
  在在这种情况下，某些良好的编译器可能会向你警告存在一个“空控制语句”。\n\n## 条件执行多条语句\n\n如果你想在条件成功或失败时执行多条语句，你需要将它们封装在语句块中。这些块本质上是使用大括号\
  \ `{...}` 括起来了多个待执行的语句。例如：\n\n点击此处查看代码图像\n\n```cpp\nif (condition)\n{\n   // 条件成功块\n\
  \   Statement 1;\n   Statement 2;\n}\nelse\n{\n   // 条件失败块\n   Statement 3;\n  \
  \ Statement 4;\n}\n```\n\n此类块也被称为*复合语句*。\n\n列表 6.2 是 第 4  中 列表 4.6 “管理数组和字符串。”的安全性版本。它使用了一个复合语句，当用户输入的长度在数组边界内时，将用户输入复制到静态字符数组中。\n\
  \n**列表 6.2** 在复制字符串到 `char` 数组之前检查边界\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: #include <string>\n2: #include <string.h>\n3: using namespace std;\n4: int main()\n\
  5: {\n6:     cout << \"Enter a line of text: \" << endl;\n7:     string userInput;\n\
  8:     getline (cin, userInput);\n9:\n10:      char copyInput[20] = { '\\0' };\n\
  11:      if (userInput.length() < 20) // 检查边界\n12:      {\n13:          strcpy(copyInput,\
  \ userInput.c_str());\n14:          cout << \"copyInput contains: \" << copyInput\
  \ << endl;\n15:      }\n16:      else\n17:         cout << \"Bounds exceeded: won't\
  \ copy!\" << endl;\n18:\n19:      return 0;\n20: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\n输入一行文本：\nThis fits buffer!\ncopyInput contains: This fits buffer!\n\
  \n下次运行：\n\n点击此处查看代码图像\n\n输入一行文本：\nThis doesn't fit the buffer!\nBounds exceeded:\
  \ won't copy!\n\n分析 ![Image](img/arrow.jpg)\n\n注意在第 11 行中复制到缓冲区之前，是如何检查字符串长度与缓冲区长度的。此此\
  \ `if` 检查的特殊之处在于，当检查结果为 `true` 时，第 12 行到 15 行存在一个语句块（也称为复合语句）。\n\n## 嵌套 `if` 语句\n\
  \n你经常会遇到需要验证许多不同条件的情况，其中许多条件依赖于前一个条件的评估结果。C++ 允许你嵌套 `if` 语句来处理此类需求。\n\n嵌套的 `if`\
  \ 语句类似于如下：\n\n点击此处查看代码图像\n\n```cpp\nif (expression1)\n{\n   DoSomething1;\n   if(expression2)\n\
  \       DoSomething2;\n   else\n       DoSomethingElse2;\n}\nelse\n    DoSomethingElse1;\n\
  ```\n\n考虑类似于 列表 6.1 的应用程序，用户可以通过按下命令字符 *d* 或 *m* 来指示应用程序进行除法或乘。现在，只有在除数不为零时才允许除法。因此，除了检查用户输入的预定命令外，当用户指示程序进行除法时，检查除数是否为零也是重要的。列表\
  \ 6.3 使用了嵌套的 `if` 结构。\n\n**列表 6.3** 在数字的乘法或除法中使用嵌套 `if` 语句\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  cout << \"Enter two numbers: \" << endl;\n6:     float num1 = 0, num2 = 0;\n\
  7:     cin >> num1;\n8:     cin >> num2;\n9:\n10:    cout << \"Enter 'd' to divide,\
  \ anything else to multiply: \";\n11:    char userSelection = '\\0';\n12:    cin\
  \ >> userSelection;\n13:\n14:    if (userSelection == 'd')\n15:    {\n16:      \
  \  cout << \"You wish to divide!\" << endl;\n17:        if (num2 != 0)\n18:    \
  \        cout << num1 << \" / \" << num2 << \" = \" << num1 / num2 << endl;\n19:\
  \        else\n20:            cout << \"Division by zero is not allowed\" << endl;\n\
  21:    }\n22:    else\n23:    {\n24:        cout << \"You wish to multiply!\" <<\
  \ endl;\n25:        cout << num1 << \" x \" << num2 << endl;\n26:    }\n27:\n28:\
  \    return 0;\n29: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入两个数字：\n\
  45\n9\n'd' to divide, anything else to multiply: m\nYou wish to multiply!\n45 x\
  \ 9\n\n下次运行：\n\n点击此处查看代码图像\n\n输入两个数字：\n22\n7\n'd' to divide, anything else to multiply:\
  \ d\nYou wish to divide!\n22 / 7\n\n最后运行：\n\n点击此处查看代码图像\n\n输入两个数字：\n36\n0\n'd' to\
  \ divide, anything else to multiply: d\nYou wish to divide!\nDivision by zero is\
  \ not allowed\n\n分析 ![Image](img/arrow.jpg)\n\n输出是针对三种不同输入运行程序的结果，你可以看到程序对这三种运行执行了不同的路径。此\
  \ `if` 条件与 列表 6.1 不同，该程序接受浮点数，这在进行除法时非常重要。\n\n提示：你在代码中插入的嵌套缩进（空格）是可选的，但它们显著提高了嵌套\
  \ `if` 语句的可读性。许多现代 IDE 会自动缩进代码。\n\n注意 `if...else` 结构也可以组合在一起。列表 6.4 是一个向用户询问星期，然后使用分组的\
  \ `if...else` 结构告诉用户该星期几名的程序。\n\n**列表 6.4** 使用分组的 `if...else` 结构\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:     enum DaysOfWeek\n\
  6:     {\n7:         Sunday = 0,\n8:         Monday,\n9:         Tuesday,\n10: \
  \       Wednesday,\n11:        Thursday,\n12:        Friday,\n13:        Saturday\n\
  14:    };\n15:\n16:    cout << \"Find what days of the week are named after!\" <<\
  \ endl;\n17:    cout << \"Enter a number for a day (Sunday = 0): \";\n18:\n19: \
  \   int dayInput = Sunday; // 初始化为 Sunday\n20:    cin >> dayInput;\n21:\n22:   \
  \ if (dayInput == Sunday)\n23:        cout << \"Sunday was named after the Sun\"\
  \ << endl;\n24:    else if (dayInput == Monday)\n25:        cout << \"Monday was\
  \ named after the Moon\" << endl;\n26:    else if (dayInput == Tuesday)\n27:   \
  \     cout << \"Tuesday was named after Mars\" << endl;\n28:    else if (dayInput\
  \ == Wednesday)\n29:        cout << \"Wednesday was named after Mercury\" << endl;\n\
  30:    else if (dayInput == Thursday)\n31:        cout << \"Thursday was named after\
  \ Jupiter\" << endl;\n32:    else if (dayInput == Friday)\n33:        cout << \"\
  Friday was named after Venus\" << endl;\n34:    else if (dayInput == Saturday)\n\
  35:        cout << \"Saturday was named after Saturn\" << endl;\n36:\n37:    return\
  \ 0;\n38: }\n```\n\n\n\n\n\n```cpp\n35:         cout << \"Saturday was named after\
  \ Saturn\" << endl;\n36:     else\n37:         cout << \"Wrong input, execute again\"\
  \ << endl;\n38:\n39:     return 0;\n40: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\n查找星期中的某天是如何命名的！\n\n输入一个天的数字 (星期日 = 0): 5\n\n星期五是用金星命名的\n\n下次运行：\n\
  \n点击此处查看代码图片\n\n查找星期中的某天是如何命名的！\n\n输入一个天的数字 (星期日 = 0): 9\n\n输入错误，重新执行\n\n分析 ![Image](img/arrow.jpg)\n\
  \n注意第 22 到 37 行中使用的 `if-else-if` 结构，它用于检查用户输入并产生相应的输出。第二次运行的输出表明，当用户输入超出预期范围 0–6\
