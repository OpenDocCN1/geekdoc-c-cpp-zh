  for (int counter=0; counter=10; ++counter)\n    cout << counter << \" \";\n```\n\
  \n#### 6.](#app05.html_ch06ex06) 漏洞终结（BUG BUSTERS）：这段代码哪里错了？\n\n点击此处查看代码图像\n\n```cpp\n\
  int loopCounter = 0;\nwhile(loopCounter <5);\n{\n    cout << loopCounter << \" \"\
  ;\n    loopCounter++;\n}\n```\n\n#### 7.](#app05.html_ch06ex07) 漏洞终结（BUG BUSTERS）：这段代码哪里错了？\n\
  \n点击此处查看代码图像\n\n```cpp\ncout << \"Enter a number between 0 and 4\" << endl;\nint\
  \ input = 0;\ncin >> input;\nswitch (input)\n{\ncase 0:\ncase 1:\ncase 2:\ncase\
  \ 3:\ncase 4:\ncout << \"Valid input\" << endl;\ndefault:\n    cout << \"Invalid\
  \ input\" << endl;\n}\n```\n\n## 第 7 ：使用函数组织代码\n\n到目前为止，你已经了一些简单的程序，所有的编程工作都包含在\
  \ `main()` 中。这对于非常小的程序和应用程序非常好。随着你的程序变得越来越复杂，`main()` 的内容也会变得越来越长，除非你使用函数来结构化你的程序。\n\
  \n函数为你提供了一种划分和组织程序执行逻辑的方法。它们允许你将应用程序的内容拆分成逻辑块，并按顺序调用它们。\n\n因此，函数是一个子程序，可以可选地接收参数并返回值，并且需要调用来执行其任务。在本节中，你将学习：\n\
  \n![Image](img/square.jpg) 程序函数的需要\n\n![Image](img/square.jpg) 函数声明和函数定义\n\n![Image](img/square.jpg)\
  \ 向函数传递参数并返回值\n\n![Image](img/square.jpg) 函数重载\n\n![Image](img/square.jpg) 递归函数\n\
  \n![Image](img/square.jpg) C++11 lambda 函数\n\n## 函数的需求\n\n考虑一个要求用户输入圆形半径然后计算周长和面积的应用程序。实现此点的方法是将其全部放在\
  \ `main()` 中。另一种方法是将此应用程序拆分为逻辑块：特别是两个根据给定半径计算面积和周长的部分。参见 Listing 7.1。\n\n**LISTING\
  \ 7.1** 给定半径计算圆面积和周长的两个函数\n\n点击此处查看代码图像\n\n```cpp\n  0: #include <iostream>\n  1:\
  \ using namespace std;\n  2:\n  3: const double Pi = 3.14159265;\n  4:\n  5: //\
  \ 函数声明（原型）\n  6: double Area(double radius);\n  7: double Circumference(double radius);\n\
  \  8:\n  9: int main()\n  10: {\n  11:     cout << \"Enter radius: \";\n  12:  \
  \   double radius = 0;\n  13:     cin >> radius;\n  14:     cout << \"Area: \" <<\
  \ Area(radius) << endl;\n  15:     cout << \"Circumference: \" << Circumference(radius)\
  \ << endl;\n  16:     return 0;\n  17: }\n  18:\n  19: double Area(double radius)\
  \ {\n  20:     return Pi * radius * radius;\n  21: }\n  22:\n  23: double Circumference(double\
  \ radius) {\n  24:     return 2 * Pi * radius;\n  25: }\n```\n\n\n\n调用函数与执行（invoking）函数是相同的。当函数声明中包含参数时，函数调用需要发送\
  \ `arguments`（参数）。参数是函数在其参数列表中请求的值。让我们来分析列表 7.1 中对 `Area()` 的调用：\n\n点击此处查看代码图像\n\
  \n```cpp\n16:cout << \"Area is: \" << Area(radius) << endl;\n```\n\n在这里，`Area(radius)`\
  \ 是函数调用，其中 `radius` 是发送给函数 `Area()` 的参数。当函数被调用时，执行流会跳转到函数 `Area()`，该函数使用发送的半径来计算圆的面积。\n\
  \n### 编写带有多个参数的函数\n\n假设你正在编写一个计算圆柱表面积的程序，如图图 7.2 所示。\n\n![Image](img/07fig02.jpg)\n\
  \n**图 7.2** 一个圆柱。\n\n你使用的公式如下：\n\n点击此处查看代码图像\n\n圆柱面积 = 上圆面积 + 下圆面积 + 侧面面积\n= Pi\
  \ * radius² + Pi * radius ² + 2 * Pi * radius * height\n= 2 * Pi * radius² + 2 *\
  \ Pi * radius * height\n\n因此，在计算圆柱面积时，你需要处理两个变量：`radius`（半径）和 `height`（高度）。在这种情况下，在编写计算圆柱表面积的函数时，你需要在函数声明的参数列表中指定至少两个参数。你通过逗号隔开各个参数来实现这一点，如列表\
  \ 7.2 所示。\n\n**列表 7.2** 接受两个参数以计算圆柱表面积的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: const double Pi = 3.14159265;\n4:\n5: // Declaration\
  \ contains two parameters\n6: double SurfaceArea(double radius, double height);\n\
  7:\n8: int main()\n9: {\n10:     cout << \"Enter the radius of the cylinder: \"\
  ;\n11:     double radius = 0;\n12:     cin >> radius;\n13:     cout << \"Enter the\
  \ height of the cylinder: \";\n14:     double height = 0;\n15:     cin >> height;\n\
  16:\n17:     cout << \"Surface area: \" << SurfaceArea(radius, height) << endl;\n\
  18:\n19:     return 0;\n20: }\n21:\n22: double SurfaceArea(double radius, double\
  \ height)\n23: {\n24:     double area = 2 * Pi * radius * radius + 2 * Pi * radius\
  \ * height;\n25:     return area;\n26: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n\
  点击此处查看代码图像\n\n```\nEnter the radius of the cylinder: 3\nEnter the height of the\
  \ cylinder: 6.5\nSurface Area: 179.071\n```\n\n分析 ![Image](img/arrow.jpg)\n\n第 6\
  \ 行包含了函数 `SurfaceArea()` 的声明，带有两个参数：`radius` 和 `height`，类型均为 `double`，并用逗号分隔。第 22–26\
  \ 行显示了定义——即 `SurfaceArea()` 的实现。如你所示，输入参数 `radius` 和 `height` 用于计算存储在局部变量 `area`\
  \ 中的值，然后返回给调用者。\n\n**注意**\n\n函数参数类似于局部变量。它们仅在函数作用域内有效。因此，在列表 7.2 中，函数 `SurfaceArea()`\
  \ 的参数 `radius` 和 `height` 是 `main()` 中同名变量的副本。\n\n### 编写无参数或无返回值的函数\n\n如果你将打印“Hello\
  \ World”的任务委托给一个只做这一件事而不做其他任何事的函数，你可以使用一个不需要任何参数的函数（因为它除了说“Hello”之外不需要做任何事情），并且可能使用一个不返回任何值的函数（因为你并不期望这样的函数返回任何有用信息）。列表\
  \ 7.3 展示了这样一个函数。\n\n**列表 7.3** 无参数且无返回值的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: void SayHello();\n4:\n5: int main()\n\
  6: {\n7:     SayHello();\n8:     return 0;\n9: }\n10:\n11: void SayHello()\n12:\
  \ {\n13:     cout << \"Hello World\" << endl;\n14: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n```\nHello World\n```\n\n分析 ![Image](img/arrow.jpg)\n\n注意第 3 行声明了 `SayHello()`\
  \ 函数，其返回类型为 `void`，这意味着它不返回任何值。在，在第 11–14 行的定义中，没有 `return` 语句。因此，`SayHello()` 是一个无返回值的函数。\n\
  \n### 带有默认值的参数\n\n如果你将 `Pi` 固定为常量且从不给用户更改它的机会，那么你可能无法获得更精确的读数。如何编写一个带有默认值的函数呢？\n\
  \n一种方法是在列表 7.1 中为参数提供默认值，如下：\n\n```cpp\ndouble Area(double radius, double pi = 3.14);\n\
  ```\n\n在这种情况下，如果调用 `Area(radius)`，第二个参数 `pi` 将默认为 `3.14`。如果调用时传入了第二个参数，例如 `Area(radius,\
  \ 3.14159)`，则默认值会被覆盖。列表 7.4 展示了：\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: // Function declarations (otypes)\n4: double Area(double radius,\
  \ double pi = 3.14);\n5:\n6: int main()\n7: {\n8:     cout << \"Enter radius: \"\
  ;\n9:     double radius = 0;\n10:     cin >> radius;\n11:\n12:     // Call function\
  \ with default value\n13:     cout << \"Area with default pi: \" << Area(radius)\
  \ << endl;\n14:\n15:\n16:     cout << \"Enter custom pi: \";\n17:     double customPi\
  \ = 3.14159;\n18:     cin >> customPi;\n19:\n20:     // Call function with custom\
  \ pi value\n21:     cout << \"Area with custom pi: \" << Area(radius, customPi)\
  \ << endl;\n22:\n23:     return 0;\n24: }\n25:\n26: // Function definitions (implementations)\n\
  27: double Area(double radius, double pi)\n28: {\n29:     return pi * radius * radius;\n\
  30: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n```\nEnter radius: 5\n\
  Area with default pi: 78.5\nEnter custom pi: 3.14159\nArea with custom pi: 78.53975\n\
  ```\n\n\n\n在两次运行中，用户输入的半径是相同的——1。然而，在第二次运行中，用户选择了更改 Pi 的精度，因此计算出的面积略有不同。请注意，在上述两种情况下，如第\
  \ 22 行和第 25 行所示，你调用了同一个函数。第 25 行调用了 `Area()` 但没有提供第二个参数 `pi`。在这种情况下，`Area()` 中的参数\
  \ `pi` 包含值 3.14，这是在第 4 行的声明中作为默认提供的。\n\n***\n\n### 注意\n你可以拥有多个带有默认值的参数；但这些参数都应该位于参数列表的末尾。\n\
  \n***\n\n### 递归——调用自身的函数\n\n在某些情况下，你实际上可以让函数调用自己。这种函数被称为`递归函数`。注意，递归函数应该有一个非常明确定义的退出条件，在在该条件下它返回且不再再次调用自身。\n\
  \n***\n\n### 警告\n如果没有退出条件，或者退出条件中出现错误，你的程序执行将卡在不会停止调用自身的递归函数上，这最终会在发生“栈溢出”时停止，导致应用程序崩溃。\n\
  \n***\n\n在确定斐波那契数列中的数字时，递归函数是非常有用的，如列表 7.5 所示。该数列从两个数字 0 和 1 开始：\n\nF(0) = 0\n\n\
  F(1) = 1\n\n数列中后续数字的值是前两个数字之和。因此，*n* 个值（当 n > 1 时）由以下递归公式确定：\n\n点击此处查看代码图像\n\nFibonacci(n)\
  \ = Fibonacci(n - 1) + Fibonacci(n - 2)\n\n结果是斐波那契数列扩展为\n\n点击此处查看代码图像\n\nF(2) =\
  \ 1\n\nF(3) = 2\n\nF(4) = 3\n\nF(5) = 5\n\nF(6) = 8，依此类推。\n\n**列表 7.5** 使用递归函数计算斐波那契数列中的数字\n\
  \n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: int GetFibNumber(int fibIndex)\n4: {\n5:     if (fibIndex < 2)\n6:      \
  \   return fibIndex;\n7:     else // 如果 fibIndex >= 2 则递归\n8:         return GetFibNumber(fibIndex\
  \ - 1) + GetFibNumber(fibIndex - 2);\n9: }\n10:\n11: int main()\n12: {\n13:    \
  \ cout << \"Enter 0-based index of desired Number: \";\n14:     int index = 0;\n\
  15:     cin >> index;\n16:\n17:     cout << \"Fibonacci number is: \" << GetFibNumber(index)\
  \ << endl;\n18:     return 0;\n19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\n\
  输入所需的数字（从 0 开始索引）: 6\n斐波那契数字是: 8\n\n分析 ![Image](img/arrow.jpg)\n在第 3-9 行定义的函数 `GetFibNumber()`\
  \ 是递归的，因为它在第 8 行调用了自己。第 5 行和第 6 行编写的退出条件确保了当 `fibIndex` 小于二时函数将返回。因此，`GetFibNumber()`\
  \ 使用减小的 `fibIndex` 值调用自身。它最终会达到满足退出条件的状态，递归结束，并确定斐波那契值并返回给 `main()`。\n\n### 多重返回的函数\n\
  \n你并不限于函数中只能有一个 `return` 语句。你可以从函数的任何点返回，并且如果你需要，可以多次返回，如列表 7.6 所示。取决于逻辑和应用程序的需求，这可能是坏实践，也可能不是坏实践。\n\
  \n**列表 7.6** 在一个函数中使用多个返回语句\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2: const double Pi = 3.14159265;\n3:\n4: void QueryAndCalculate()\n\
  5: {\n6:     cout << \"Enter radius: \";\n7:     double radius = 0;\n8:     cin\
  \ >> radius;\n9:\n10:    cout << \"Area: \" << Pi * radius << endl;\n11:\n12:  \
  \  cout << \"Do you wish to calculate circumference (y/n)? \";\n13:    char calcCircum\
  \ = 'n';\n14:    cin >> calcCircum;\n15:\n16:    if (calcCircum == 'n')\n17:   \
  \     return;\n18:\n19:    cout << \"Circumference: \" << 2 * Pi * radius << endl;\n\
  20:    return;\n21: }\n22:\n23: int main()\n24: {\n25:     QueryAndCalculate();\n\
  26:\n27:     return 0;\n28: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\n输入半径:\
  \ 1\n面积: 3.14159\n你想计算周长吗 (y/n)? y\n周长: 6.28318\n\n分析 ![Image](img/arrow.jpg)\n\
  在第 3-9 行定义的函数 `GetFibNumber()` 是递归的，因为它在第 8 行调用了自己。第 5 行和第 6 行编写的退出条件确保了当 `fibIndex`\
  \ 小于二时函数将返回。因此，`GetFibNumber()` 使用不断减小的 `fibIndex` 值调用自身。它最终会达到满足退出条件的状态，递归结束，并确定一个斐波那契值返回给\
  \ `main()`。\n\n### 多重返回的函数\n\n你并不限于函数中只能有一个 `return` 语句。你可以从函数的任何点返回，并且如果你需要，可以多次返回，如列表\
  \ 7.6 所示。取决于逻辑和应用程序的需求，这可能是坏实践，也可能不是坏实践。\n\n**列表 7.6** 在一个函数中使用多个返回语句\n\n点击此处查看代码图像\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2: const double\
  \ Pi = 3.14159265;\n3:\n4: void QueryAndCalculate()\n5: {\n6:     cout << \"Enter\
  \ radius: \";\n7:     double radius = 0;\n8:     cin >> radius;\n9:\n10:    cout\
  \ << \"Area: \" << Pi * radius << endl;\n11:\n12:    cout << \"Do you wish to calculate\
  \ circumference (y/n)? \";\n13:    char calcCircum = 'n';\n14:    cin >> calcCircum;\n\
  15:\n16:    if (calcCircum == 'n')\n17:        return;\n18:\n19:    cout << \"Circumference:\
  \ \" << 2 * Pi * radius << endl;\n20:    return;\n21: }\n22:\n23: int main()\n24:\
  \ {\n25:     QueryAndCalculate();\n26:\n27:     return 0;\n28: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  点击此处查看代码图像\n输入半径: 1\n面积: 3.14159\n你想计算周长吗 (y/n)? y\n周长: 6.28318\n\n分析 ![Image](img/arrow.jpg)\n\
  函数 `QueryAndCalculate()` 包含了多个 `return` 语句：分别在第 17 行和第 20 行。如果用户按 'n' 计算周长，程序将通过\
  \ `return` 语句退出。对于其他值，它将继续计算周长并返回。\n\n***\n\n### 警告\n在函数中使用多个返回要小心。一个从顶部开始并在底部返回的函数，比一个在中间多次返回的函数更容易理解和遵循。\n\
  \n在列表 7.6 中，通过简单地更改 `if` 条件来测试 'y'，就可以避免使用多次返回：\n\n### 使用函数处理不同形式的数据\n\n函数并不限制你一次传递一个值；你可以传递数组。你可以创建具有相同名称和返回值的函数，使其参数不在函数调用期间创建和销毁；相反，你可以使用在函数退出后仍然有效的引用，以便允许你进行更多操作。\n\
  \n### 函数重载\n具有相同名称和返回类型但参数不同的函数被称为重载函数。重载函数在需要根据特定参数产生特定输出的应用程序中非常有用。假设你需要编写一个计算圆面积和圆柱面积的应用程序。计算圆面积的函数需要一个参数——半径。计算圆柱面积的另一个函数除了半径还需要高度。两个函数都需要返回相同类型的数据（面积）。因此，C++\
  \ 允许你定义两个都名为 `Area` 的函数，一个接受半径，另一个接受高度和半径作为输入参数，如列表 7.7 所示。\n\n**列表 7.7** 使用重载函数计算圆或圆柱的面积\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: const double\
  \ Pi = 3.14159265;\n4:\n5: double Area(double radius); // 用于圆\n6: double Area(double\
  \ radius, double height); // 用于圆柱\n7:\n8: int main()\n9: {\n10:    cout << \"Enter\
  \ z for Cylinder, c for Circle: \";\n11:    char userSelection = 'z';\n12:    cin\
  \ >> userSelection;\n13:\n14:    cout << \"Enter radius: \";\n15:    double radius\
  \ = 0;\n16:    cin >> radius;\n17:\n18:    if (userSelection == 'z')\n19:    {\n\
  ```\n\n\n\n\n```cpp\n20:         cout << \"Enter height: \";\n21:         double\
  \ height = 0;\n22:         cin >> height;\n24:         // Invoke overloaded variant\
  \ of Area for Cyclinder\n25:         cout << \"Area of cylinder is: \" << Area (radius,\
  \ height) << endl;\n26:     }\n27:     else\n28:         cout << \"Area of cylinder\
  \ is: \" << Area (radius) << endl;\n30:\n     return 0;\n31: }\n\n33: // for circle\n\
  34: double Area(double radius)\n35: {\n36:     return Pi * radius * radius;\n37:\
  \ }\n\n39: // overloaded for cylinder\n40: double Area(double radius, double height)\n\
  41: {\n42:     // reuse the area of circle\n43:     return 2 * Area (radius) + 2\
  \ * Pi * radius * height;\n44: }\n```\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\
  \n输入圆柱输入 z，圆圆输入 c: z\n输入半径: 2\n输入高度: 5\n圆柱面积为: 87.9646\n\n下一次运行：\n\n点击此处查看代码图片\n\
  \n输入圆柱输入 z，圆圆输入 c: c\n输入半径: 1\n圆柱面积为: 3.14159\n\n分析 ![Image](img/arrow.jpg)\n\n\
  第 5 行和第 6 行声明了 `Area()` 重载形式的原型：第一个重载版本接受单个参数——圆的半径 `radius`。下一个版本接受两个参数——圆柱的半径\
  \ `radius` 和高度 `height`。该函数被称为重载函数，是因为有两个具有相同名称 `Area()`、相同返回类型 `double` 但不同参数集合的原型。重载函数的定义在第\
  \ 34–44 行中，其中两个函数分别根据半径确定圆的面积，以及根据半径和高度确定圆柱的面积。有趣的是，由于圆柱的面积是由它包含的两个圆（顶部一个，底部一个）的面积加上侧面积组成的，因此圆柱的重载版本能够如第\
  \ 43 行所示，重用用于圆的 `Area()` 函数。\n\n#### 传递值数组\n\n显示整数的函数可以如下所示表示：\n点击此处查看代码图片\n`void\
  \ DisplayInteger(int Number);`\n\n可以显示整数数组的函数原型略有不同：\n点击此处查看代码图片\n`void DisplayIntegers(int[]\
  \ numbers, int Length);`\n\n第一个参数告诉函数输入的数据是一个数组，而第二个参数提供了数组的长度 `length`，通过你可以使用该数组而不跨越其边界。请参阅列表\
  \ 7.8。\n\n**列表 7.8 接受数组作为参数的函数**\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: void DisplayArray(int numbers[], int length)\n4:\
  \ {\n5:     for (int index = 0; index < length; ++index)\n6:     cout << numbers[index]\
  \ << \" \";\n7:\n8:     cout << endl;\n9: }\n10:\n11: void DisplayArray(char characters[],\
  \ int length)\n12: {\n13:     for (int index = 0; index < length; ++index)\n14:\
  \     cout << characters[index] << \" \";\n15:\n16:     cout << endl;\n17: }\n18:\n\
  19: int main()\n20: {\n21:     int myNums[4] = {24, 58, -1, 245};\n22:     DisplayArray(myNums,\
  \ 4);\n23:\n24:     char myStatement[7] = {'H', 'e', 'l', 'l', 'o', '!', '\\0'};\n\
  25:     DisplayArray(myStatement, 7);\n26:\n27:     return 0;\n28: }\n```\n\nOutput\
  \ ![Image](img/arrow.jpg)\n24 58 -1 245\nH e l o !\n\n分析 ![Image](img/arrow.jpg)\n\
  \n这里有两个名为 `DisplayArray()` 的重载函数：一个用于显示整数数组元素的内容，另一个用于显示字符数组的内容。在第 22 行和第 25 行中，分别使用整数数组和字符数组作为输入调用了这两个函数。请注意，在第\
  \ 24 行声明并初始化字符数组时，你特意包含了空字符（`\\0`）——这是一个最佳实践和良好习惯——尽管在该应用程序中，该数组并没有作为字符串用于 `cout`\
  \ 语句（如 `cout << myStatement;`）。\n\n#### 按引用传递参数\n\n再次查看列表 7.1 中的函数，该函数根据半径计算圆的面积：\n\
  点击此处查看代码图片\n```cpp\n24: // 函数定义\n25: double Area(double radius)\n26: {\n27:    \
  \ return Pi * radius * radius;\n28: }\n```\n\n在这里，当在 `main()` 中调用函数时，参数 `radius`\
  \ 包含的值被复制：\n点击此处查看代码图片\n```cpp\n15:     // 调用函数\n16:     cout << \"Area is: \" <<\
  \ Area(radius);\n```\n\n这意味着 `main()` 中的变量 `radius` 不受影响，因为函数操作的是 `radius` 的副本。在某些情况下，你可能需要函数操作外部的变量，这时你需要声明一个按引用传递的参数。按引用传递面积的\
  \ `Area()` 函数如下：\n点击此处查看代码图片\n```cpp\n// 输出参数 result\nvoid Area(double radius, double&\
  \ result)\n{\n    result = Pi * radius;\n}\n```\n\n注意这种形式的 `Area()` 接受两个参数。不要错过第二个参数\
  \ `result` 旁边的符号 `&`。该符号告诉编译器第二个参数不应复制到函数中。由于函数不再作为返回值提供面积，而是作为输出参数，因此返回类型已改为 `void`。这在列表\
  \ 7.9 中得到了演示，该列表计算圆的面积。\n\n**列表 7.9 通过参数而非返回值获取圆面积**\n点击此处查看代码图片\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: const double Pi = 3.1416;\n4:\n5:\
  \ // 输出参数 result 按引用\n6: void Area(double radius, double& result)\n7: {\n8:    \
  \ result = Pi * radius * radius;\n9: }\n10:\n11: int main()\n12: {\n13:     cout\
  \ << \"Enter radius: \";\n14:     double radius = 0;\n15:     cin >> radius;\n16:\n\
  17:     double areaFetched = 0;\n18:     Area(radius, areaFetched);\n19:\n20:  \
  \   cout << \"The area is: \" << areaFetched << endl;\n21:     return 0;\n22: }\n\
  ```\n\nOutput ![Image](img/arrow.jpg)\n点击此处查看代码图片\n\n输入半径: 2\n面积为: 12.5664\n\n###\
  \ 注意事项\n\n函数使用 `return` 语句只能返回一个值。因此，如果你的函数需要执行影响调用者所需的许多值的操作，按引用传递参数是函数将这些许多修改提供回调用模块的方法之一。\n\
  \n\n\n\n\n虽然确切知道函数调用在微处理器层级是如何实现的并非极端重要，但你可能会觉得很有趣。理解这有助于你理解为什么 C++ 为你提供了编程内联函数（inline\
  \ functions）的选项，我们将在本节后面对其进行解释。\n\n函数调用本质上意味着微处理器跳转到位于非连续内存位置的、执行属于被调用函数的下一条指令。在执行完函数中的指令后，它会返回到之前离开的地方。为了实现这一逻辑，编译器会将你的函数调用转换为微处理器的\
  \ `CALL` 指令。该指令附带了下一条指令需要跳转的内存地址——该地址属于你的函数例程。当微处理器遇到 `CALL` 时，它会将函数调用后要执行的指令位置保存在栈上，并跳转到\
  \ `CALL` 指令包含的内存位置。\n\n***\n\n### 理解栈\n\n栈是一个后进先出（Last-In-First-Out）的内存结构，非常像一堆盘子，你取最上面的那个盘子，而它是最后被放在栈上的那一个。将数据放入栈中被称为\
  \ `push` 操作。从栈中取出数据被称为 `pop` 操作。随着栈向上增长，栈指针始终随着增长而递增，并指向栈顶。参见图 7.3。\n\n![Image](img/07fig03.jpg)\n\
  \n**图 7.3** 包含三个整数的栈的视觉化表示。\n\n栈的特性使其非常适合处理函数调用。当函数被调用时，所有局部变量都会在栈上实例化——也就是说，被推入栈中。当函数结束时，它们简单地从栈中弹出，栈指针返回到原始位置。\n\
  \n***\n\n此内存位置包含属于函数的指令。微处理器执行这些指令，直到遇到 `RET` 语句（你编写的、用于 `return` 的微处理器代码）。`RET`\
  \ 语句会导致微处理器从栈中弹出在执行 `CALL` 指令期间存储的那个地址。该地址包含了调用函数中需要继续执行的位置。因此，微处理器回到了调用者处，并从之前离开的地方继续执行。\n\
  \n#### 内联函数\n\n普通的函数调用被翻译为 `CALL` 指令，导致栈操作以及微处理器的执行转移到函数处等。这听起来后台发生了大量工作，但对于大多数情况，它的发生非常快。然而，如果你的函数是一个像下面这样简单的函数呢？\n\
  \n点击此处查看代码图像\n\n```cpp\ndouble GetPi()\n{\n    return 3.14159;\n}\n```\n\n对于实际执行\
  \ `GetPi()` 所花费的时间来说，对这执行实际函数调用的开销可能很大。这就是为什么 C++ 编译器允许程序员将此类函数声明为内联。关键字 `inline`\
  \ 是程序员的请求，要求这些函数在被调用处进行内联展开。\n\n点击此处查看代码图像\n\n```cpp\ninline double GetPi()\n{\n\
  \    return 3.14159;\n}\n```\n\n执行诸如数字倍增等简单操作的函数也是内联的候选。列表 7.10 展示了其中一种情况。\n\n**列表\
  \ 7.10** 使用使整数倍倍的内联函数\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1:\
  \ using namespace std;\n2:\n3: // 定义一个将数字倍增的内联函数\n4: inline long DoubleNum (int\
  \ inputNum)\n5: {\n6:     return inputNum * 2;\n7: }\n8:\n9: int main()\n10: {\n\
  11:     cout << \"Enter an integer: \";\n12:     int inputNum = 0;\n13:     cin\
  \ >> inputNum;\n14:\n15:     // 调用内联函数\n16:     cout << \"Double is: \" << DoubleNum(inputNum)\
  \ << endl;\n17:\n18:     return 0;\n19: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图像\n\nEnter an integer: 35\nDouble is: 70\n\n分析 ![Image](img/arrow.jpg)\n\
  \n所讨论的关键字是第 4 行中的 `inline`。编译器通常将此关键字视为一种请求，将函数 `DoubleNum()` 的内容直接放在函数被调用的地方——第\
  \ 16 行——这增加了代码的执行速度。\n\n将函数分类为内联也可能导致代码膨胀，特别是当内联的函数执行大量复杂的处理时。使用 `inline` 关键字应尽可能少。\n\
  \n***\n\n注意\n\n现代 C++ 编译器提供了各种优化选项。某些编译器（例如微软）允许你针对大小或速度进行优化。针对大小的优化可能有助于内存可能紧张的设备。当针对速度进行优化时，编译器可能会拒绝许多内联请求。\n\
  \n***\n\n#### 自动返回类型\n\n你学习了使用变量、声明常量。。你不需要指定返回类型，而是使用 `auto` 让编译器来推断。列表 7.11 展示了在计算圆面积的函数中使用\
  \ `auto`。\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: const\
  \ double Pi = 3.14159265;\n4:\n5: auto Area(double radius)\n6: {\n7:     return\
  \ Pi * radius;\n8: }\n9:\n10: int main()\n11: {\n12:     cout << \"Enter radius:\
  \ \";\n13:     double radius = 0;\n14:     cin >> radius;\n15:\n16:     cout <<\
  \ \"Area is: \" << Area(radius) << endl;\n17:\n18:     return 0;\n19: }\n```\n\n\
  ***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter radius: 2\nArea is: 12.5664\n\
  \n分析\n\n关注的行是第 5 行，它使用 `auto` 作为函数 `Area()` 的返回类型。编译器根据返回表达式推断返回类型。因此，尽管使用了 `auto`，列表\
  \ 7.11 中的 `Area()` 编译出的结果与列表 7.1 中返回类型为 double 的 `Area()` 并何不同。\n\n注意\n\n依赖自动返回类型推断的函数需要在调用它们之前定义（即实现）。这是因为编译器在调用函数时需要知道其返回类型。如果此类函数有多个返回语句，它们需要推断出同一种类型。递归调用需要至少跟随一个返回语句。\n\
  \n### Lambda 函数\n\n这一部分只是对一个对初学者来说并不易理解的概念的介绍。因此，请快速浏览一遍，并尝试学习这个概念，不要因为没有完全掌握而感到失望。\n\
  \n\n\n\n\n### Lambda 函数\n\nLambda 函数是在 C++11 中引入的，有助于在使用 STL 算法对数据进行排序或处理。通常，`sort`\
  \ 函数要求你提供一个二元谓词（binary predicate）。这是一个比较两个参数的函数，如果其中一个小于另一个，则返回 `true`，否则返回 `false`，从而帮助决定排序操作中元素的顺序。此类谓词通常实现为类中的运算符，这会导致编写一些繁琐的代码。Lambda\
  \ 函数可以紧凑谓词的定义，如 列表 7.12 所示。\n\n## 列表 7.12 使用 Lambda 函数显示数组中的元素并对其排序\n\n点击此处查看代码图像\n\
  \n* * *\n\n```cpp\n0: #include <iostream>\n1: #include <algorithm>\n2: #include\
  \ <vector>\n3: using namespace std;\n4:\n5: void DisplayNums(vector<int>& dynArray)\n\
  6: {\n7:     for_each (dynArray.begin(), dynArray.end(), \\\n8:                \
  \ [](int Element) {cout << Element << \" \";} );\n9:\n10:     cout << endl;\n11:\
  \ }\n12:\n13: int main()\n14: {\n15:     vector<int> myNums;\n16:     myNums.push_back(501);\n\
  17:     myNums.push_back(-1);\n18:     myNums.push_back(25);\n19:     myNums.push_back(-35);\n\
  20:\n21:     DisplayNums(myNums);\n22:\n23:     cout << \"Sorting them in descending\
  \ order\" << endl;\n24:\n25:     sort (myNums.begin(), myNums.end(), \\\n26:   \
  \          [](int Num1, int Num2) {return (Num2 < Num1); } );\n27:\n28:     DisplayNums(myNums);\n\
  29:\n30:     return 0;\n31: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n501 -1 25 -35\n\nSorting them in descending order\n\n501 25 -1 -35\n\n### 分析\n\
  \n![Image](img/arrow.jpg)\n\n程序在第 15–19 行包含了推送到由 C++ 标准库以 `std::vector` 形式提供的动态数组中的整数。`DisplayNums()`\
  \ 函数使用 STL 算法 `for_each` 遍历数组中的每个元素并显示其值。在此过程中，它在第 8 行使用了一个 Lambda 函数。第 25 行使用的\
  \ `std::sort` 也使用了一个 Lambda 函数形式的二元谓词（第 26 行），如果第二个数字小于第一个数字，则返回 `true`，从而有效地对集合进行升序排序。\n\
  \nLambda 函数的语法如下：\n\n点击此处查看代码图像\n\n```\noptional parameters{ statements; }\n```\n\
  \n* * *\n\n### 注意事项\n\n谓词及其在 `sort` 等算法中的用法将在 第 23 节 “STL 算法。”中详细讨论，特别是 列表 23.6\
  \ 是一个在算法中使用 Lambda 和非 Lambda 变体的代码示例，从而允许你比较 Lambda 函数引入的编程效率。\n\n* * *\n\n### 总结\n\
  \n在本节中，你学习了模块化编程的基础知识。你学习了函数如何帮助你更好地组织代码，并帮助你重用编写的算法。你学习了函数可以接受参数并返回值，参数可以具有调用者可以覆盖的默认值，还可以包含通过引用传递的参数。你学习了如何传递数组，还学习了如何编写具有相同名称和返回值但参数列表不同的重载函数。\n\
  \n最后但同样重要的是，你预览了什么是 Lambda 函数。Lambda 函数对于 C++11 来说是全新的，它们潜力改变以后 C++ 程序的编程方式，特别是在使用\
  \ STL 时。\n\n### 问答\n\n**Q 如果我编写了一个不会结束的递归函数会发生什么？**\n\n**A** 程序执行不会结束。这本身可能并不坏，对于一个\n\
  \n**Q 为什么不对每个函数都进行内联？**\n\n**A** 这取决于情况。然而，内联每个函数会导致代码在\n\n**Q 我可以为所有参数提供默认值吗？**\n\
  \n**A** 是的，这是可能的也是推荐的\n\n**Q 我有两个函数，名称和返回值都相同。这可行吗？**\n**A** 我需要两个相同名称和返回值的函数来进行重载，到栈。\n\
