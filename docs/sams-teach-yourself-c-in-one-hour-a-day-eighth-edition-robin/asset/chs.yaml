  \ `startValue` 增了 1。\n\n### 注意事项\n\n你经常听到出于更好的性能考虑而倾向于使用前缀增或或减运算符的情况。即，`++startValue`\
  \ 优于 `startValue++`。\n\n这至少在理论上是正确的，因为对于后置运算符，编译器在需要赋值时需要临时存储初始值。对于整数来说，这种情况下这种情况对性能的影响微乎其微，但在某些类的情况下，这个论点可能是有意义的。智能编译器可能会优化这些差异。\n\
  \n### 等价运算符 (`==`) 和 (`!=`)\n\n通常在执行某个操作之前，你可能需要检查某个条件是否满足或未满足。等价运算符 `==`（操作数相等）和\
  \ `!=`（操作数不相等）正好帮助你实现这一点。\n\n等价检查的结果是一个 `bool` 类型——即 `true` 或 `false`。\n\n此处点击查看代码图像\n\
  \n```cpp\nint personAge = 20;\nbool checkEquality = (personAge == 20); // true\n\
  bool checkInequality = (personAge != 100); // true\nbool checkEqualityAgain = (personAge\
  \ == 200); // false\nbool checkInequalityAgain = (personAge != 20); // false\n```\n\
  \n### 关系运算符\n\n除了等价检查外，你可能想检查某个变量与某个值之间是否不等。为了帮助你实现这一点，C++ 包含了关系运算符（参见表 5.1）。\n\n\
  ![Image](img/05tab01.jpg)\n\n**表 5.1** 关系运算符\n\n如表 5.1 所示，比较操作的结果始终是 `true` 或 `false`，换句话说是一个\
  \ `bool`。以下示例代码展示了如何使用表 5.1 中引入的关系运算符：\n\n此处点击查看代码图像\n\n```cpp\nint personAge =\
  \ 20;\nbool checkLessThan = (personAge < 100); // true\nbool checkGreaterThan =\
  \ (personAge > 100); // false\nbool checkLessThanEqualTo = (personAge <= 20); //\
  \ true\nbool checkEqualTo = (personAge >= 20); // true\nbool checkGreaterThanAgain\
  \ = (personAge >= 100); // false\n```\n\n列表 5.3 是一个程序，通过在屏幕上显示结果来演示使用这些运算符的效果。\n\
  \n**列表 5.3** 展示等价和关系运算符\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
  int main()\n{\n    cout << \"Enter two integers:\";\n    int num1, num2;\n    cin\
  \ >> num1 >> num2;\n\n    bool isEqual = (num1 == num2);\n    cout << \"Result of\
  \ equality test: \" << isEqual << endl;\n\n    bool isUnequal = (num1 != num2);\n\
  \    cout << \"Result of inequality test: \" << isUnequal << endl;\n\n    bool isLessThan\
  \ = (num1 < num2);\n    cout << \"Result of less than test: \" << isLessThan <<\
  \ endl;\n\n    bool isGreaterThan = (num1 > num2);\n    cout << \"Result of greater\
  \ than test: \" << isGreaterThan << endl;\n\n    bool isLessThanEqual = (num1 <=\
  \ num2);\n    cout << \"Result of less than or equal test: \" << isLessThanEqual\
  \ << endl;\n\n    bool isGreaterEqual = (num1 >= num2);\n    cout << \"Result of\
