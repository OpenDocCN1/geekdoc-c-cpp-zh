  \ + \" << num2 << \" = \" << num1 + num2 << endl;\n16:\n17:        cout << \"Press\
  \ x to exit(x) or any other key to recalculate\" << endl;\n18:        cin >> userSelection;\n\
  19:     }\n20:\n21:     cout << \"Goodbye!\" << endl;\n22:     return 0;\n23: }\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入两个整数：\n\n56\n\n25\n\n56 x 25\
  \ = 1400\n\n56 + 25 = 81\n\n按下 x 退出(x) 或按下其他按键重新计算\n\nr\n\n输入两个整数：\n\n365\n\n-5\n\
  \n365 x -5 = -1825\n\n365 + -5 = 360\n\n按下 x 退出(x) 或按下其他按键重新计算\n\nx\n\n再见！\n\n\n\
  \n\n第 7–19 行中的 `while` 循环包含了程序中的大部分逻辑。注意 `while` 是如何检查表达式 `(userSelection != 'x')`\
  \ 的，只有当该表达式求值为 `true` 时才会继续。为了能够首次运行，你在第 5 行将字符变量 `userSelection` 初始化为 `'m'`。此值需要是任何不是\
  \ `'x'` 的值（否则条件在第一次循环时就会失败，应用程序将在未让用户进行任何建设性操作的情况下退出）。第一次运行非常简单，但程序在第 17 行询问用户是否希望再次执行另一组计算。第\
  \ 18 行包含用户的输入，你在此处修改 `while` 评估的表达式，从而让程序获得继续或终止的机会。当第一次循环完成后，执行返回到第 7 行 `while`\
  \ 语句中对 `expression` 的评估，如果用户没有按下 `x`，则重复。当用户在循环结束时按下 `x` 时，第 7 行对表达式的下次评估结果为 `false`，执行退出\
  \ `while` 循环，最终在显示告别语句后结束应用程序。\n\n***\n\n### Note\n\n循环也被称为*迭代*（iteration）。涉及 `while`、`do...while`\
  \ 和 `for` 的语句也称为*迭代语句*（iterative statements）。\n\n***\n\n### `do...while` 循环\n\n\
  在某些情况下（如列表 6.8 所示），你需要确保某段代码在循环中重复并至少执行一次。这就是 `do...while` 循环大显用场。\n\n`do...while`\
  \ 循环的语法为：\n\n点击查看代码图片\n\n```\ndo\n{\n    StatementBlock; // 至少执行一次\n} while(condition);\
  \ // 如果条件求值为 false 则结束循环\n```\n\n注意包含 `while(expression)` 的那一行以分号结尾。这与之前的 `while`\
  \ 循环不同，在之前的循环中，`while` 后的分号将实际上在这一行就终止循环，导致产生空语句。\n\n列表 6.9 展示了如何通过至少执行一次执行语句来实现\
  \ `do...while` 循环。\n\n**列表 6.9** 使用 `do...while` 重复执行代码块\n\n点击查看代码图片\n\n***\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n\
  5:     char userSelection = 'x';   // 初始值\n6:     do\n7:     {\n8:         cout\
  \ << \"Enter the two integers: \" << endl;\n9:         int num1 = 0, num2 = 0;\n\
  10:          cin >> num1;\n11:          cin >> num2;\n12:\n13:          cout <<\
  \ num1 << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n14:          cout\
  \ << num1 << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n15:\n16:      \
  \    cout << \"Press x to exit(x) or any other key to recalculate\" << endl;\n17:\
  \          cin >> userSelection;\n18:     } while (userSelection != 'x');\n19:\n\
  20:     cout << \"Goodbye!\" << endl;\n21:\n22:     return 0;\n23: }\n```\n\n***\n\
  \n输出 ![Image](img/arrow.jpg)\n\n点击查看代码图片\n\n```\nEnter the two integers:\n654\n\
  -25\n654 x -25 = -16350\n654 + -25 = 629\nPress x to exit(x) or any other key to\
  \ recalculate\nm\nEnter the two integers:\n909\n101\n909 x 101 = 91809\n909 + 101\
  \ = 1010\nPress x to exit(x) or any other key to recalculate\nx\nGoodbye!\n```\n\
  \n分析 ![Image](img/arrow.jpg)\n\n该程序的行为和输出与列表 6.8 相似。事实上，唯一的区别是第 6 行的 `do` 关键字以及后续第\
  \ 18 行对 `while` 的使用。代码执行按顺序进行，逐行执行，直到到达第 18 行的 `while`。在这里 `while` 评估表达式 `(userSelection\
  \ != 'x')`。当表达式求值为 `true` 时（即用户没有按下字符 `x` 退出），循环执行重复。当表达式求值为 `false` 时（即用户按了 `x`），执行退出循环并继续执行告别和结束应用程序。\n\
  \n### `for` 循环\n\n`for` 语句是一种更复杂的循环，因为它允许执行一次的初始化语句（通常用于初始化计数器）、检查退出条件（通常使用该计数器），并在每次循环结束时执行一个操作（通常是增加或修改该计数器）。\n\
  \n`for` 循环的语法为：\n\n点击查看代码图片\n\n```\nfor (initialization; condition; increment)\n\
  {\n    statement;\n}\n```\n\n`for` 循环项功能允许程序员定义一个带有初始值的计数器变量、根据退出条件进行检查，并在每次循环结束时更改该值。列表\
  \ 6.10 展示了使用 `for` 循环访问数组元素的有效方法。\n\n**列表 6.10** 使用 `for` 访问数组元素\n\n点击查看代码图片\n\n\
  ***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n\
  4: {\n5:     const int ARRAY_LENGTH = 5;\n6:     int myNums[ARRAY_LENGTH];\n7:\n\
  8:     cout << \"Populate array of \" << ARRAY_LENGTH << \" integers\" << endl;\n\
  9:     for (int counter = 0; counter < ARRAY_LENGTH; ++counter)\n10:     {\n11:\
  \         cout << \"Enter integer for element \" << counter << \": \";\n12:    \
  \     cin >> myNums[counter];\n13:     }\n14:\n15:     cout << \"Display contents\
  \ of the array:\" << endl;\n16:     for (int counter = 0; counter < ARRAY_LENGTH;\
  \ ++counter)\n17:     {\n18:         cout << \"Element \" << counter << \" = \"\
  \ << myNums[counter] << endl;\n19:     }\n20:\n21:     return 0;\n22: }\n```\n\n\
  \n\n\n```cpp\nusing namespace std;\n\nint main()\n{\n    // 没有循环表达式（缺少第三个表达式）\n\
  \    for(char userSelection = 'm'; (userSelection != 'x');)\n    {\n        cout\
  \ << \"Enter the two integers: \" << endl;\n        int num1 = 0, num2 = 0;\n  \
  \      cin >> num1;\n        cin >> num2;\n\n        cout << num1 << \" x \" <<\
  \ num2 << \" = \" << num1 * num2 << endl;\n        cout << num1 << \" + \" << num2\
  \ << \" = \" << num1 + num2 << endl;\n\n        cout << \"Press x to exit or any\
  \ other key to recalculate\" << endl;\n        cin >> userSelection;\n    }\n\n\
  \    cout << \"Goodbye!\" << endl;\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处查看代码图片\n\n```\nEnter the two integers:\n56\n25\n56 x 25 = 1400\n56 + 25 =\
  \ 81\nPress x to exit or any other key to recalculate\nm\nEnter the two integers:\n\
  789\n-36\n789 x -36 = -28404\n789 + -36 = 753\nPress x to exit or any other key\
  \ to recalculate\nx\nGoodbye!\n```\n\n分析 ![Image](img/arrow.jpg)\n\n该程序与使用 `while`\
  \ 循环的 Listing 6.8 相同；唯一的区别是它在第 6 行使用了 `for` 结构。这个 `for` 循环的有趣之处在于，它只包含初始化表达式和条件表达式，忽略了在每次循环结束时更改变量的选择。\n\
  \n### 注意\n\n你可以在 `for` 循环的第一个执行一次的初始化表达式中初始化多个变量。Listing 6.11 中带有多个初始化的 `for` 循环看起来如下所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nfor (int counter1 = 0, counter2 = 5; // 初始化\n      counter1\
  \ < ARRAY_LENGTH;   // 检查\n      ++counter1, --counter2)  // 增，减\n```\n\n注意新添加的变量\
  \ `counter2`，它被初始化为 5。\n\n有趣的是，我们还可以在循环表达式中对其递减，每次循环执行一次。\n\n### 基于范围的 `for` 循环\n\
  \nC++11 引入了 `for` 循环的新变体，使得对值范围（例如数组包含的值）进行操作的代码更加简单且易读。\n\n基于范围的 `for` 循环的语法也使用了相同的关键字\
  \ `for`：\n\n点击此处查看代码图片\n\n```cpp\nfor (VarType varName : sequence)\n{\n    // 使用包含\
  \ sequence 中元素的 varName\n}\n```\n\n例如，给出一个整数数组 `someNums`，你将使用基于范围的 `for` 循环来读取数组包含的元素，如下所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nint someNums[] = { 1, 101, -1, 40, 2040 };\nfor (int aNum\
  \ : someNums) // 基于范围的 for\n    cout << \"The array elements are \" << aNum << endl;\n\
  ```\n\n### 提示\n\n你可以通过通过关键字 `auto` 使用自动变量类型推导功能来进一步简化此 `for` 语句，组合出一个通用的 `for` 循环，该循环适用于任何类型的数组\
  \ `elements`：\n\n点击此处查看代码图片\n\n```cpp\nfor (auto anElement : elements) // 基于范围的\
  \ for\n    cout << \"Array elements are \" << anElement << endl;\n```\n\n关键字 `auto`\
  \ 和自动变量类型推断功能是在 第 3 Lesson 中引入的。\n\nListing 6.12 展示了针对不同类型范围的基于范围的 `for` 循环。\n\n\
  ### 列表 6.12 遍历数组和 `std::string` 的基于范围的 `for` 循环\n\n点击此处查看代码图片\n\n```cpp\n#include<iostream>\n\
  #include <string>\nusing namespace std;\n\nint main()\n{\n    int someNums[] = {\
  \ 1, 101, -1, 40, 2040 };\n    for (const int& aNum : someNums)\n        cout <<\
  \ aNum << ' ';\n    cout << endl;\n\n    for (auto anElement : { 5, 222, 110, -45,\
  \ 2017 })\n        cout << anElement << ' ';\n    cout << endl;\n\n    char charArray[]\
  \ = { 'h', 'e', 'l', 'l', 'o' };\n    for (auto aChar : charArray)\n        cout\
  \ << aChar << ' ';\n    cout << endl;\n\n    double moreNums[] = { 1, 101, -1, 40,\
  \ 2040 };\n    for (auto anElement : moreNums)\n        cout << anElement << ' ';\n\
  \    cout << endl;\n\n    return 0;\n}\n```\n\n\n\n\n\n如果你想结束一个`infinite loop`（例如前面的示例中操作系统需要关闭），你可以通过插入\
  \ `break`（通常用于`if (condition)` 块内部）来实现。\n\n以下是使用 `break` 退出无限 `while` 循环的示例：\n\n\
  点击此处查看代码图像\n\n```cpp\nwhile(true)   // while condition fixed to true\n{\n    DoSomethingRepeatedly;\n\
  \    if(expression)\n        break;  // 当 expression 求值为为 true 时退出循环\n}\n```\n\n\
  在无限的 `do...while` 中使用 `break`：\n\n点击此处查看代码图像\n\n```cpp\ndo\n{\n    DoSomethingRepeatedly;\n\
  \    if(expression)\n        break;  // 当 expression 求值为为 true 时退出循环\n} while(true);\n\
  ```\n\n在无限的 `for` 循环中使用 `break`：\n\n点击此处查看代码图像\n\n```cpp\nfor (;;)   // no condition\
  \ supplied = unending for\n{\n    DoSomethingRepeatedly;\n    if(expression)\n \
  \       break;  // 当 expression 求值为为 true 时退出循环\n}\n```\n\nListing 6.13 展示了如何使用\
  \ `continue` 和 `break` 控制退出标准来编写无限循环。\n\n**列表 6.13** 使用 `continue` 重启和使用 `break`\
  \ 退出无限 `for` 循环\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     for(;;)   // an infinite loop\n6:     {\n\
  7:         cout << \"Enter two integers: \" << endl;\n8:         int num1 = 0, num2\
  \ = 0;\n9:         cin >> num1;\n10:         cin >> num2;\n11:\n12:         cout\
  \ << \"Do you wish to correct the numbers? (y/n): \";\n13:         char changeNumbers\
  \ = '\\0';\n14:         cin >> changeNumbers;\n15:\n16:         if (changeNumbers\
  \ == 'y')\n17:             continue;  // restart the loop!\n18:\n19:         cout\
  \ << num1 << \" x \" << num2 << \" = \" << num1 * num2 << endl;\n20:         cout\
  \ << num1 << \" + \" << num2 << \" = \" << num1 + num2 << endl;\n21:\n22:      \
  \   cout << \"Press x to exit or any other key to recalculate\" << endl;\n23:  \
  \       char userSelection = '\\0';\n24:         cin >> userSelection;\n25:\n26:\
  \         if (userSelection == 'x')\n27:             break;   // exit the infinite\
  \ loop\n28:     }\n29:\n30:     cout << \"Goodbye!\" << endl;\n31:\n32:     return\
  \ 0;\n33: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter two integers:\n\
  560\n25\nDo you wish to correct the numbers? (y/n): y\nEnter two integers:\n56\n\
  25\nDo you wish to correct the numbers? (y/n): n\n56 x 25 = 1400\n56 + 25 = 81\n\
  Press x to exit or any other key to recalculate\nr\nEnter two integers:\n95\n-1\n\
  Do you wish to correct the numbers? (y/n): n\n95 x -1 = -95\n95 + -1 = 94\nPress\
  \ x to exit or any other key to recalculate\nx\nGoodbye!\n\n分析 ![Image](img/arrow.jpg)\n\
  \n第 5 行的 `for` 循环与 Listing 6.11 中的不同之处在于，它是一个无限 `for` 循环，不包含在每次迭代中都求值的条件表达式。换句话说，如果不执行\
  \ `break` 语句，此循环（以及该程序）永远不会退出。注意输出，它与你之前看到的其他输出不同，它允许用户在程序继续计算和和乘法之前对输入进行修正。这种逻辑是通过第\
  \ 16 行和第 17 行对特定条件的求值使用 `continue` 实现的。当用户在询问是否修正数字时按下 `y`，第 16 行的条件求值为 `true`，执行后续的\
  \ `continue`。遇到 `continue` 时，执行跳转到循环顶部，再次要求输入整数。同样，在循环结束当用户被询问是否退出时，其输入会在第 26 行与\
  \ `'x'` 进行比对，如果是，则执行后续的 `break`，结束无限循环。\n\n注意 Listing 6.13 使用空的 `for(;;)` 创建无限循环。你可以用\
  \ `while(true)` 或 `do...while(true);` 来替换它。\n\n### 做\n- 当循环逻辑需要至少执行一次时使用 `do...while`。\n\
  - 使用带有良好定义表达式的 `while`、`do...while` 或 `for` 循环。\n- 缩进循环中的代码以提高可读性。\n\n### 不要做\n\
  - 使用 `goto`。\n- 随意地使用 `continue` 和 `break`。\n- 除非绝对必要，否则使用 `break` 编写无限循环。\n\n##\
  \ 嵌套循环\n\n正如你在课程开头看到的嵌套 `if` 语句，你经常需要将一个循环嵌套另一个。假设有两个整数数组。如果你想找到 `array1` 中每个数字与\
  \ `array2` 中每个数字的乘积，可以使用嵌套循环。第一个循环遍历 `array1`，而第二个循环在第一个循环内部遍历 `array2`。\n\nListing\
  \ 6.14 展示了嵌套循环的使用。\n\n**列表 6.14** 使用嵌套循环将数组中的每个元素与另一个相乘\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  const int ARRAY1_LEN = 3;\n6:     const int ARRAY2_LEN = 2;\n7:\n8:     int myNums1[ARRAY1_LEN]\
  \ = {35, -3, 0};\n9:     int myNums2[ARRAY2_LEN] = {20, -1};\n10:\n11:     cout\
  \ << \"Multiplying each int in myNums1 by each in myNums2:\" << endl;\n12:\n13:\
  \     for(int index1 = 0; index1 < ARRAY1_LEN; ++index1)\n14:         for(int index2\
  \ = 0; index2 < ARRAY2_LEN; ++index2)\n15:             cout << myNums1[index1] <<\
  \ \" x \" << myNums2[index2] << \\\n16:             << \" = \" << myNums1[index1]\
  \ * myNums2[index2] << endl;\n17:\n18:     return 0;\n19: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \nMultiplying each int in myNums1 by each in myNums2:\n35 x 20 = 700\n35 x -1 =\
  \ -35\n-3 x 20 = -60\n-3 x -1 = 3\n0 x 20 = 0\n0 x -1 = 0\n\n\n\n\n\n在第 4 Lesson\
  \ 中，你学习了多维数组。实际上，在列表 4.3 中，你访问了一个三行三列二维数组中的元素。你所做的是逐个访问数组中的每个元素，每行一个。这并没有实现自动化，而且如果需要扩大数组，除了更改数组维度以访问其元素外，你还需要编写大量的代码。然而，使用循环可以改变这一切，正如列表\
  \ 6.15 所示。\n\n## 列表 6.15 使用嵌套循环遍历整数二维数组中的元素\n\n点击此处代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     const int NUM_ROWS = 3;\n\
  6:     const int NUM_COLUMNS = 4;\n7:\n8:     // 2D array of integers\n9:     int\
  \ MyInts[NUM_ROWS][NUM_COLUMNS] = { {34, -1, 879, 22},\n10:                    \
  \                 {24, 365, -101, -1},\n11:                                    \
  \ {-20, 40, 90, 97} };\n12:\n13:     // iterate rows, each array of int\n14:   \
  \  for (int row = 0; row < NUM_ROWS; ++row)\n15:     {\n16:         // iterate integers\
  \ in each row (columns)\n17:         for (int column = 0; column < NUM_COLUMNS;\
  \ ++column)\n18:         {\n19:             cout << \"Integer[\" << row << \"][\"\
  \ << column \\\n20:                   << \"] = \" << MyInts[row][column] << endl;\n\
  21:         }\n22:     }\n23:\n24:     return 0;\n25: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  \n点击此处代码图像\n\n```\nInteger[0][0] = 34\nInteger[0][1] = -1\nInteger[0][2] = 879\n\
  Integer[0][3] = 22\nInteger[1][0] = 24\nInteger[1][1] = 365\nInteger[1][2] = -101\n\
  Integer[1][3] = -1\nInteger[2][0] = -20\nInteger[2][1] = 40\nInteger[2][2] = 90\n\
  Integer[2][3] = 97\n```\n\n## 分析 ![Image](img/arrow.jpg)\n\n第 14–22 行包含两个 `for`\
  \ 循环，你需要通过它们访问并遍历整数二维数组。二维数组实际上是一个整数数组的数组。注意第一个 `for` 循环如何访问行（每一行都是整数数组），而第二个循环如何访问该数组中的每个元素——即访问其中的列。\n\
  \n注意：列表 6.15 使用大括号包裹嵌套的 `for` 仅仅是为了提高可读性。这种嵌套循环不使用大括号也能正常工作，因为循环语句只是要执行的单个语句（而不是必须使用大括号包裹的复合语句）。\n\
  \n## 使用嵌套循环计算斐波那契数列\n\n著名的斐波那契数列是一组从 0 和 1 开始的数字，序列中的每一个后续数字都是前两个数字之和。因此，一个斐波那契数列从如下序列开始：0,\
  \ 1, 1, 2, 3, 5, ... 等。列表 6.16 展示了如何创建一个包含任意数量数字的斐波那契数列（受存储最后一个数字的整数的数据类型限制）。\n\n\
  ## 列表 6.16 使用嵌套循环计算序列\n\n点击此处代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     const int numsToCalculate = 5;\n6:     cout\
  \ << \"This program will calculate \" << numsToCalculate \\\n7:             << \"\
  \ Fibonacci Numbers at a time\" << endl;\n8:\n9:     int num1 = 0, num2 = 1;\n10:\
  \    char wantMore = '\\0';\n11:    cout << num1 << \" \" << num2 << \" \";\n12:\n\
  13:    do\n14:     {\n15:         for (int counter = 0; counter < numsToCalculate;\
  \ ++counter)\n16:         {\n17:             cout << num1 + num2 << \" \";\n18:\n\
  19:             int num2Temp = num2;\n20:             num2 = num1 + num2;\n21: \
  \            num1 = num2Temp;\n22:         }\n23:\n24:         cout << endl << \"\
  Do you want more numbers (y/n)?\n25:         cin >> wantMore;\n26:     }while (wantMore\
  \ == 'y');\n27:\n28:     cout << \"Goodbye!\" << endl;\n29:     return 0;\n30: }\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处代码图像\n\n```\nThis program will calculate\
  \ 5 Fibonacci Numbers at a time\n0 1 1 2 3 \nDo you want more numbers (y/n)? y\n\
  5 8 13 21 34 \nDo you want more numbers (y/n)? y\n55 89 144 233 377 \nDo you want\
  \ more numbers (y/n)? y\n610 987 1597 2584 4181 \nDo you want more numbers (y/n)?\
  \ y\n... (省略)\n...\nn\nGoodbye!\n```\n\n## 分析 ![Image](img/arrow.jpg)\n\n第 13 行的外部\
  \ `do...while` 循环基本上是一个查询循环，如果用户想要更多数字，就会重复。第 15 行的内部 `for` 循环负责计算下一个斐波那契数字并一次显示五个数字。在第\
  \ 19 行，你将 `num2` 的值存储在临时变量 `num2Temp` 中，以便在第 21 行使用。注意，如果不存储这个临时值，你将直接将第 20 行修改后的值赋予\
  \ `num1`，这并不是你想要的。当用户按下 ‘y’ 以获取更多数字时，`do...while` 循环再次执行，从而执行嵌套的 `for` 循环生成另外五个斐波那契数字。\n\
  \n### 练习\n\n练习提供了测验来帮助你巩固对所涵盖内容的理解，并通过练习题提供使用所学知识的机会。在查看附录 E 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了这些答案。\n\
