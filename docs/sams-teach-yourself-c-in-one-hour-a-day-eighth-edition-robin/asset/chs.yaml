  \  return 0;\n22: }\n```\n\n***\n\n## 动态数组\n\n考虑一个存储医疗记录的应用程序。程序员没有很好的方法知道应用程序可能需要的记录上限。在这种情况下，使用动态数组来根据需求调整内存是更安全的。\n\
  \nC++ 以 `std::vector` 的形式提供了方便且易于使用的动态数组，如列表 4.4 所示。\n\n**列表 4.4** 创建动态整数数组并动态插入值\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include <vector>\n2:\n3: using\
  \ namespace std;\n4:\n5: int main()\n6: {\n7:     vector<int> dynArray (3); // 动态整数数组\n\
  8:\n9:     dynArray[0] = 365;\n10:    dynArray[1] = -421;\n11:    dynArray[2]= 789;\n\
  12:\n13:    cout << \"Number of integers in array: \" << dynArray.size() << endl;\n\
  14:\n15:    cout << \"Enter another element to insert\" << endl;\n16:    int newValue\
  \ = 0;\n17:    cin >> newValue;\n18:    dynArray.push_back(newValue);\n19:\n20:\
  \    cout << \"Number of integers in array: \" << dynArray.size() << endl;\n21:\
  \    cout << \"Last element in array: \";\n22:    cout << dynArray[dynArray.size()\
  \ - 1] << endl;\n23:    return 0;\n24:\n25: }\n```\n\n\n\n不要担心列表 4.4 中的语法，因为还没有解释\
  \ `vector` 和模板。尝试观察输出并将其与代码联系起来。根据输出结果，数组的初始大小为 3，这与第 7 行中数组的声明（`std::vector`）一致。在了解此点的，你仍然在第\
  \ 15 行要求用户输入第四个数字，有趣的是，你能够在第 18 行使用 `push_back()` 将此数字插入数组末尾。`vector` 会动态调整自身大小以容纳更多数据。这从数组大小增加到\
  \ 4 可以看出。注意使用熟悉的静态数组语法来访问 `vector` 中的数据。第 22 行使用从 0 开始的索引访问最后一个元素（根据运行时计算的位置，无论它在哪里），最后一个元素位于索引“`size()\
  \ – 1`”。`size()` 是返回 `vector` 中包含的元素（整数）总数的函数。\n\n***\n\n### 注意\n\n要使用动态数组类 `std::vector`，你需要包含头文件\
  \ `vector`，这在列表 4.4 的第 1 行中也有显示。\n\n```cpp\n#include <vector>\n```\n\n将在第 17 节中详细介绍矢量。\n\
  \n***\n\n### C 风格字符串\n\nC 风格字符串是字符数组的一种特殊情况。你已经在代码中以字符串字面量的形式看到了一些 C 风格字符串的示例：\n\
  \n```cpp\nstd::cout << \"Hello World\";\n```\n\n等等于使用数组声明：\n\n点击查看代码图像\n\n```cpp\n\
  char sayHello[] = {'H', 'e', 'l', 'l', 'o', ' ', 'W', 'o', 'r', 'l', 'd', '\\0'};\n\
  std::cout << sayHello << std::endl;\n```\n\n注意数组中的最后一个字符是空字符 `\\0`。这也被称为字符串终止符，因为它告诉编译器字符串已结束。此类\
  \ C 风格字符串是字符数组的特殊情况，因为最后一个字符始终位于空终止符 `\\0` 之前。当你在代码中嵌入字符串字面量时，编译器会在其后添加一个 `\\0`。\n\
  \n如果你在数组中间任何地方插入 `'\\0'`，它不会改变数组的大小；它仅意味着使用该数组作为输入进行字符串处理会在该点停止。列表 4.5 演示了这一点。\n\
  \n***\n\n### 注意\n\n`'\\0'` 对你来说可能像两个字符，它们确实是使用键盘输入的两个字符。然而，反斜杠是一个编译器理解的特殊转义代码，`\\\
  0` 意味着空——也就是说，它要求编译器在该处插入一个空值或零。\n\n你不能直接写 `'0'`，因为那会被接受为字符零，其非零 ASCII 码为 48。\n\n\
  请检查附录 D 中的表格“ASCII 码，”以查看此值和其他 ASCII 值。\n\n***\n\n**列表 4.5** 分析 C 风格字符串中的空终止符\n\n\
  点击查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n\
  3: int main()\n4: {\n5:     char sayHello[] = {'H','e','l','l','o',' ','W','o','r','l','d','\\\
  0'};\n6:     cout << sayHello << endl;\n7:     cout << \"Size of array: \" << sizeof(sayHello)\
  \ << endl;\n8:\n9:     cout << \"Replacing space with null\" << endl;\n10:     sayHello[5]\
  \ = '\\0';\n11:     cout << sayHello << endl;\n12:     cout << \"Size of array:\
  \ \" << sizeof(sayHello) << endl;\n13:\n14:     return 0;\n15: }\n```\n\n***\n\n\
