  \n## 第 10 节。实现继承\n\n面向对象的编程基于四个重要方面：封装、抽象、继承和多态。继承是复用属性的一种强大方式，也是通向多态的基石。\n\n在本节中，你将了解到\n\
  \n![Image](img/square.jpg) 编程背景下的继承\n\n![Image](img/square.jpg) C++ 的继承语法\n\n![Image](img/square.jpg)\
  \ `public`、`private` 和 `protected` 继承\n\n![Image](img/square.jpg) 多重继承\n\n![Image](img/square.jpg)\
  \ 隐藏基类方法和*切片*(slicing)*引起的问题\n\n## 继承的基础\n\nTom Smith 从祖先那里继承的首要姓氏，这让他成为一名 Smith。此外，他还继承了父母教给他的某些价值观以及一项木雕技能，这项技能是\
  \ Smith 家族世世。这些属性共同定义了 Tom 是 Smith 家族树的后代。\n\n在编程术语中，你经常面临管理组件具有相似属性的情况，但在细节或行为上存在细微差异。解决此问题的方法之一是将每个组件制造成类，每个类实现所有属性并重新实现公共部分。另一种解决方案是使用继承，允许相似的类派生自一个包含公共属性并实现公共功能的基类，通过覆盖这些基类功能来实现每个类独特的行为。后者通常是首选方法。欢迎来到面向对象编程的世界，正如图\
  \ 10.1](#ch10.html_ch10fig01）所示。\n\n![Image](img/10fig01.jpg)\n\n**图 10.1** 类之间的继承。\n\
  \n#### 继承与派生\n\n[图 10.1] 显示了基类与其派生类之间的图示关系。现在可能很难想象基类或派生类可以是什么。尝试理解派生类继承自基类，在那种意义上它也是基类（就像\
  \ Tom 是一个 Smith 一样）。\n\n\n\n\n\n派生类与其基类之间的“是一个 a”（is-a）关系仅适用于 `public` 继承。本节将从公共继承开始，以理解继承的概念以及最常见的继承形式，然后再转向\
  \ `private` 或 `protected` 继承。\n\n***\n\n## 理解继承概念\n\n为了方便理解这一概念，可以想象一个基类 `class\
  \ Bird`（鸟）。从 `Bird` 派生的类有 `class Crow`（乌鸦）、`class Parrot`（鹦鹉）或 `class Kiwi`（奇异鸟）。`class\
  \ Bird` 会定义鸟类最基本的属性，例如“有羽毛”、“有翅膀”、“产蛋”、“会飞”等。派生类如 `Crow`、`Parrot` 或 `Kiwi` 继承这些属性并对其进行自定义（例如，代表不会飞行鸟的\
  \ `class Kiwi` 不包含 `Fly()` 的实现）。表 10.1 展示了更多几个继承的例子。\n\n![Image](img/10tab01.jpg)\n\
  \n**表 10.1** 取自生活的公共继承示例\n\n这些例子说明，当你戴上面向对象编程的眼镜时，你会在周围许多物体中看到继承的例子。`Fish`（鱼）是 `Tuna`（金枪）的基类，因为\
  \ `Tuna` 和 `Carp`（鲤）一样都是 `Fish`，并且具有所有鱼类的特征，如冷血。然而，`Tuna` 与 `Carp` 在外观、游泳方式以及作为咸鱼这一点上有所不同。因此，`Tuna`\
  \ 和 `Carp` 从共同的基类 `Fish` 继承共同特征，但通过特化基类属性来区分彼此。这在图 10.2 中所示。\n\n![Image](img/10fig02.jpg)\n\
  \n**图 10.2** 金枪、鲤和鱼之间的层次关系。\n\n鸭嘴兽会游泳，但它是一种具有哺乳动物特征的特殊动物（如用奶喂养幼崽）、具有鸟类特征（因为它产蛋）以及爬行动物特征（因为它有）。因此，可以想象\
  \ `class Platypus`（鸭嘴兽）继承两个基类 `class Mammal`（哺乳动物）和 `class Bird`（鸟），以继承哺乳和鸟类特征。这种继承形式被称为*多重继承*，将在本节后文中讨论。\n\
  \n## C++ 派生语法\n\n你如何从 `class Fish` 继承 `class Carp`，或者通地从 `class Base` 继承 `class\
  \ Derived`？C++ 实现此点的语法如下：\n\n点击此处查看代码图片\n\n```cpp\nclass Base\n{\n   // ... 基类成员\n\
  };\n\nclass Derived: access-specifier Base\n{\n   // ... 派生类成员\n};\n```\n\n`access-specifier`（访问限定符）可以是\
  \ `public`（最常用），表示“派生类是一个基类”的关系；`private` 或 `protected` 则则表示“派生类有一个基类”的关系。\n\n派生自\
  \ `class Fish` 的 `class Carp` 的继承层次表示如下：\n\n点击此处查看代码图片\n\n```cpp\nclass Fish //\
  \ 基类\n{\n   // ... Fish 的成员\n};\n\nclass Carp:public Fish // 派生类\n{\n   // ... Carp\
  \ 的成员\n};\n```\n\n派生自 `class Fish` 的 `class Carp` 和 `class Tuna` 的可编译声明如列表 10.1\
  \ 所示。\n\n***\n\n## 术语说明\n\n在阅读关于继承的内容时，你会遇到如 *inherits from*（继承自）或 *derives from*（派生自）等术语，它们的本质含义相同。\n\
  \n同样，基类也被称为 *super class*（超类）。派自基类的类也称为 *derived class*（派生类），也可以被称为 *subclass*（子类）。\n\
  \n***\n\n**列表 10.1** 由鱼类世界展示的简单继承体系\n\n点击此处查看代码图片\n\n***\n\n```cpp\n  0: #include\
  \ <iostream>\n  1: using namespace std;\n  2:\n  3: class Fish\n  4: {\n  5: public:\n\
  \  6:     bool isFreshWaterFish;\n  7:\n  8:     void Swim()\n  9:     {\n  10:\
  \         if (isFreshWaterFish)\n  11:             cout << \"Swims in lake\" <<\
  \ endl;\n  12:         else\n  13:             cout << \"Swims in sea\" << endl;\n\
  \  14:     }\n  15: };\n  16:\n  17: class Tuna: public Fish\n  18: {\n  19: public:\n\
  \  20:     Tuna()\n  21:     {\n  22:         isFreshWaterFish = false;\n  23: \
  \    }\n  24: };\n  25:\n  26: class Carp: public Fish\n  27: {\n  28: public:\n\
  \  29:     Carp()\n  30:     {\n  31:         isFreshWaterFish = true;\n  32:  \
