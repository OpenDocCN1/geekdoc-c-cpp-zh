  vector <float> vecFloats;\nDisplayVector(vecFloats); // 正常工作，作为一个泛型函数\n```\n\n`DisplayVector()`\
  \ 的这种泛形式还支持任何类的 `vector`，只要该类具有一个 `cout` 可以理解的返回值的运算符。\n\n### 理解尺寸和容量的概念\n\n`vector`\
  \ 的 `size` 是存储在 `vector` 中的元素数量。`vector` 的 `capacity` 是 `vector` 在重新分配内存以容纳更多元素之前，可能存储的元素总数。因此，`vector`\
  \ 的 `size` 小于或等于其 `capacity`。\n\n你可以通过调用 `size()` 查询 `vector` 的元素数量：\n\n点击此处查看代码图像\n\
  ```cpp\ncout << \"Size: \" << integers.size ();\n```\n\n或者通过调用 `capacity()` 查询其容量：\n\
  \n点击此处查看代码图像\n```cpp\ncout << \"Capacity: \" << integers.capacity () << endl;\n\
  ```\n\n当 `vector` 需要频繁重新分配内部数组的内存时，可能会导致一些性能问题。在很大程度上，这个问题可以通过使用成员函数 `reserve(number)`\
  \ 来解决。`reserve()` 的本质是增加为 `vector` 内部数组分配的内存量，以便在不需要重新分配内存的情况下容纳 `number` 个元素。根据\
  \ `vector` 中存储的对象的类型，减少重新分配的次数也可以减少对象拷贝的次数，从而节省性能。列表 17.7 中的代码示例演示了 `size()` 和 `capacity()`\
  \ 之间的区别。\n\n**列表 17.7** `size()` 和 `capacity()` 的演示\n\n点击此处查看代码图像\n\n```cpp\n#include\
