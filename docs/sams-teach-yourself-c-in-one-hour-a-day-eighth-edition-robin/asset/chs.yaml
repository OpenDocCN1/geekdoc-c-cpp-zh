  \  44:     return 0;\n  45: }\n```\n\n\n\n\n```cpp\nclass Tuna: public Fish\n{\n\
  public:\n    Tuna()\n    {\n        isFreshWaterFish = false; // 设置基类中的保护成员\n  \
  \  }\n};\n\nclass Carp: public Fish\n{\npublic:\n    Carp()\n    {\n        isFreshWaterFish\
  \ = false;\n    }\n};\n\nint main()\n{\n    Carp myLunch;\n    Tuna myDinner;\n\n\
  \    cout << \"About my food\" << endl;\n\n    cout << \"Lunch: \";\n    myLunch.Swim();\n\
  \n    cout << \"Dinner: \";\n    myDinner.Swim();\n\n    // 取消下行的注释以查看保护成员\n   \
