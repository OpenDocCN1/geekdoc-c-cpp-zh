  \n第 18 行了包含状态并作为谓元的 Lambda 表达式。`divisor` 是状态变量，类似于你在列表 21.3 中看到的 `IsMultiple::Divisor`。因此，状态变量类似于你在\
  \ C++1 出现之前的几天就已组合的函数对象类中的成员。你现在能够向你的 Lambda 函数传递状态，并在此基础上自定义它的用法。\n\n### 注意\n\n\
  列表 22.2 演示了作为一元谓元的 Lambda 表达式，还演示了在 Lambda 表达式中使用 `const`。\n\n### Lambda 表达式的通用语法\n\
  \nLambda 表达式总是以方括号开始，并可以使用逗号处理多个状态变量，捕获列表 `[]`：\n\n点击此处查看代码图像\n\n```cpp\nstateVar1,\
  \ stateVar2 { // lambda here; }\n```\n\n如果你想在 Lambda 内部修改状态变量，请添加 `mutable` 关键字：\n\
  \n点击此处查看代码图像\n\n```cpp\nstateVar1, stateVar2 mutable\n```\n\n如果你想确保对 Lambda 内部的修改在外部也有效，你需要使用引用：\n\
  \n点击此处查看代码图像\n\n```cpp\n&stateVar1, &stateVar2\n```\n```\n\nLambda 可以接受多个输入参数，用逗号分隔：\n\
  \n点击此处查看代码图像\n\n```cpp\nstateVar1, stateVar2 { // here; }\n```\n\n如果你想指定返回类型而不是让编译器歧义，你可以使用\
  \ `->`，如下：\n\n点击此处查看代码图像\n\n```cpp\nstateVar1, stateVar2 -> ReturnType\n```\n\n\
  最后，复合语句 `{}` 可以包含多个语句，每条语句用 `;` 分隔，如下：\n\n点击此处查看代码图像\n\n```cpp\nstateVar1, stateVar2\
  \ -> ReturnType\n{\n    Statement 1;\n    Statement 2;\n    return (value or expression);\n\
  }\n```\n\n### 注意\n\n如果你的 Lambda 表达式跨多行，你需要提供显式的返回类型。\n\n列表 22.5 在本课程稍后演示了一个指定返回类型并跨多行的\
  \ Lambda 函数。\n\n因此，Lambda 函数是如下函数对象的紧凑全功能替代品：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ Type1, typename Type2>\nstruct IsTooLong\n{\n    // 状态变量\n    Type1 var1;\n  \
  \  Type2 var2;\n    // 构造函数\n    IsTooLong(const Type1& in1, Type2& in2): var1(in1),\
  \ var2(in2) {};\n    // 实际目的\n    ReturnType operator()\n    {\n        Statement\
  \ 1;\n        Statement 2;\n        return (value or expression);\n    }\n};\n```\n\
  \n### 二元函数的 Lambda 表达式\n\n二元函数接受两个参数并可选返回返回值。相同的 Lambda 表达式是\n\n点击此处查看代码图像\n\n```cpp\n\
  ... { // here; }\n```\n\n使用 `std::transform()` 逐元素相乘两个等长的向量，并将结果存储在第三个向量中的 Lambda\
  \ 函数在列表 22.4 中所示。\n\n\n\n\n\n```cpp\n#include <vector>\n#include <iostream>\n#include\
  \ <algorithm>\n\nint main ()\n{\n    using namespace std;\n\n    vector <int> vecMultiplicand{\
  \ 0, 1, 2, 3, 4 };\n    vector <int> vecMultiplier{ 100, 101, 102, 103, 104 };\n\
  \n    // Holds the result of multiplication\n    vector <int> vecResult;\n\n   \
  \ // Make space for the result of the multiplication\n    vecResult.resize(vecMultiplier.size());\n\
  \n    transform (vecMultiplicand.begin (), // range of multiplicands\n         \
  \      vecMultiplicand.end (), // end of range\n               vecMultiplier.begin\
  \ (),  // multiplier values\n               vecResult.begin (), // range that holds\
  \ result\n               [](int a, int b) {return a * b; }  // lambda\n\n    cout\
  \ << \"The contents of the first vector are: \" << endl;\n    for (size_t index\
  \ = 0; index < vecMultiplicand.size(); ++index)\n    cout << vecMultiplicand[index]\
  \ << ' ';\n    cout << endl;\n\n    cout << \"The contents of the second vector\
  \ are: \" << endl;\n    for (size_t index = 0; index < vecMultiplier.size(); ++index)\n\
  \    cout << vecMultiplier[index] << ' ';\n    cout << endl;\n\n    cout << \"The\
  \ result of the multiplication is: \" << endl;\n    for (size_t index = 0; index\
  \ < vecResult.size(); ++index)\n    cout << vecResult[index] << ' ';\n\n    return\
  \ 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n第一个 vector 的内容是：\n0\
  \ 1 2 3 4\n\n第二个 vector 的内容是：\n100 101 102 103 104\n\n乘法结果是：\n0 101 204 309 416\n\
  \n## 分析 ![Image](img/arrow.jpg)\n\n所涉及的 lambda 表达式在第 17 行中作为 `std::transform()`\
  \ 的参数显示。该算法接受两个范围作为输入，并应用包含二元函数的转换算法。二元函数的返回值存储在目标容器中。该二元函数是一个 lambda 表达式，接受两个整数作为输入，并通过返回值返回乘法结果。该返回值由\
  \ `std::transform()` 存储在 `vecResult` 中。输出了两个容器的内容以及它们逐元素相乘的结果。\n\n### 注意\n\n列表 22.4\
  \ 展示了列表 21.5 中函数对象 `class Multiply<>` 的 lambda 等效实现。\n\n### 二元谓元的 Lambda 表达式\n\n\
  返回 `true` 或 `false` 以帮助决策的二元函数称为“二元谓词”（binary predicate）。这些谓词用于排序算法，例如 `std::sort()`，该算法会为容器中的任意两个值调用二元谓词，以确定哪一个应该放在另一个后面。二元谓词的通用语法为：\n\
  \n点击此处查看代码图像\n```\n[](Type1& param1, Type2& param2) { // return bool; }\n```\n列表\
  \ 22.5 展示了一个用于排序的 lambda 表达式。\n\n### 列表 22.5 在 `std::sort()` 中作为谓元的 lambda 表达式，以实现忽略大小写的排序\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <algorithm>\n#include <string>\n#include <vector>\n\
  #include <iostream>\nusing namespace std;\n\ntemplate <typename T>\nvoid DisplayContents\
  \ (const T& input)\n{\n    for (auto element = input.begin(); element != input.cend();\
  \ ++ element )\n        cout << *element << endl;\n}\n\nint main ()\n{\n    vector\
  \ <string> namesInVec{ \"jim\", \"Jack\", \"Anna\" };\n\n    cout << \"按插入顺序在 vector\
  \ 中的名称: \" << endl;\n    DisplayContents(namesInVec);\n\n    cout << \"区分大小敏感排序后的顺序:\
  \ \" << endl;\n    sort(namesInVec.begin(), namesInVec.end());\n    DisplayContents(namesInVec);\n\
  \n    cout << \"忽略大小写排序后的顺序:\" << endl;\n    sort(namesInVec.begin(), namesInVec.end(),\n\
  \        [](const string& str1, const string& str2) -> bool // lambda\n        {\n\
  \            string str1LC; // LC = 小写\n\n            // 分配空间\n            str1LC.resize\
  \ (str1.size ());\n\n            // 将每个字符转换为小写\n            transform(str1.begin(),\
  \ str1.end(), str1LC.begin(),::tolower);\n\n            string str2LC;\n       \
  \     str2LC.resize (str2.size ());\n            transform(str2.begin(), str2.end(),\
  \ str2LC.begin(),::tolower);\n\n            return (str1LC < str2LC);\n        }\
  \ // lambda 结束\n    ); // sort 结束\n\n    DisplayContents(namesInVec);\n\n    return\
  \ 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n按插入顺序在 vector 中的名称：\n\
  jim\nJack\nSam\nAnna\n\n区分大小敏感排序后的顺序：\nAnna\nJack\nSam\njim\n\n忽略大小写排序后的顺序：\nAnna\n\
  Jack\njim\nSam\n\n## 分析 ![Image](img/arrow.jpg)\n\n这展示了一个非常大的 lambda。输出了两个容器的内容以及它们逐元素相乘的结果。所涉及的\
  \ lambda 表达式在第 17 行中作为 `std::transform()` 的参数显示。最后，在第 28–43 行可以看到一个忽略大小写的 `sort()`，它首先将字符串转换为小写，然后进行比较\
  \ `return(str1LC < str2LC)`。\n\n### 提示\n\n列表 22.5 中这个异常巨大的 lambda 是列表 21.6 `class\
  \ CompareStringNoCase` 的 lambda 版本，已用于列表 21.7。显然，这个例子还展示了，如在列表 21.6 所示，函数对象在多个 `std::sort()`\
  \ 语句中是可以复用的，而 lambda 则在每次需要使用时都需要重写。\n\n\n\n\n\n在本节中，你学习了 C++11 引入的一项重要特性：lambda\
  \ 表达式。你已经看到 lambda 质质上是不命名的函数对象，它们可以接受参数、拥有状态、有返回值，并且可以是多行的。你学习了如何在 STL 算法中使用 lambda\
  \ 代替函数对象，帮助 `find()`、`sort()` 或 `transform()` 等。Lambda 让 C++ 编程变得快速且高效，你应该在适用的地方尝试使用它们。\n\
  \n### 问答 (Q&A)\n\n**问：我应该总是优先使用 lambda 而不是函数对象吗？**\n\n**答** 正如 列表 22.5 所示，跨越多行的\
  \ lambda 可能并不像易于重用的函数对象那样有助于提高编程效率。\n\n**问：lambda 的状态参数是如何传递的？按值传递还是按引用传递？**\n\n\
  **答** 当使用如下捕获列表编写 lambda 时：\n\n点击此处查看代码图像\n\n```\nVar1, Var2, ... N { ...expression\
  \ ;}\n```\n\n状态参数 `Var1` 和 `Var2` 被拷贝了（而不是作为引用提供）。如果你想让它们作为引用参数，请使用此语法：\n\n点击此处查看代码图像\n\
  \n```\n&Var1, &Var2, ... &N { ...expression ;}\n```\n\n在这种情况下，你需要格外小心，因为在捕获列表中提供的状态变量的修改会在\
  \ lambda 外部持续。\n\n**问：我可以在 lambda 中使用函数中的局部变量吗？**\n\n**答** 你可以在捕获列表中传递局部变量：\n\n\
  点击此处查看代码图像\n\n```\nVar1, Var2, ... N { ...expression ;}\n```\n\n如果你想捕获所有变量，可以使用此语法：\n\
  \n点击此处查看代码图像\n\n```\n= { ...expression ;}\n```\n\n### 工作坊 (Workshop)\n\n工作坊提供了测验题帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在检查\
