  \ 中的所有语句都以分号（`;`）结束，分号定义了语句的边界。这类似于你在英语句子末尾添加的句号（`.`）。下一条语句可以紧跟在分号之后立即开始，但为了方便和可读性，你通常会将连续的语句写在连续的行上。换句话说，这实际上是同一行中的两个语句：\n\
  \n点击此处查看代码图像\n\n```\ncout << \"Hello World\" << endl; cout << \"Another hello\"\
  \ << endl;\n```\n\n***\n\n### 注意\n空白字符通常对编译器是不可见的。这包括空格、制表符、换行符、回车符等。然而，字符串字面量内的空白字符会对输出产生影响。\n\
  \n***\n\n以下内容是无效的：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Hello\n\n      World\" <<\
  \ endl; // 字符串字面量内不允许换行\n```\n\n此类代码通常会导致错误，指示编译器在第一行缺少闭合引号（`\"`）和结束语句的分号（`;`）。如果由于某些原因你需要将一个语句跨越两行，你可以在末尾插入反斜杠（`\\\
  `）来实现：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Hello \\\n\n      World\" << endl; //\
  \ 分拆成两行是可以的\n```\n\n将上述语句分两行的另一种方法是编写两个字符串字面量而不是一个：\n\n点击此处查看代码图像\n\n```cpp\ncout\
  \ << \"Hello \"\n\n    \"World\" << endl; // 两个字符串字面量也可以的\n```\n\n在前面的示例中，编译器会注意到两个相邻的字符串字面量并为你合并它们。\n\
  \n***\n\n### 注意\n当你有长文本元素或由许多变量组成的复杂表达式时，这使得语句长度远超大多数显示器允许的范围，将语句拆分为多行是有用的。\n\n\
  ***\n\n### 复合语句或块\n当你将语句分组在花括号 `{...}` 内部时，你就创建了一个复合语句或块。\n\n点击此处查看代码图像\n\n```cpp\n\
  {\n    int daysInYear = 365;\n    cout << \"Block contains an int and a cout statement\"\
  \ << endl;\n}\n```\n\n块通常将许多语句分组，以表示它们属于整体。在编写条件 `if` 语句或循环时，块特别有用，这些内容将在第 6 节 中的“控制程序流”中解释。\n\
  \n### 使用运算符\n运算符是 C++ 提供的工具，让你能够对数据进行操作、转换、处理，并可能在此基础上做出决策。\n\n### 赋值运算符 (`=`)\n\
  赋值运算符是你已经在书中直觉地使用的一种：\n\n```cpp\nint daysInYear = 365;\n```\n\n前面的语句使用赋值运算符将整数初始化为\
  \ 365。赋值运算符将左侧操作数（通俗地称为 l 值）包含的值替换为右侧的值（称为 r 值）。\n\n### 理解 L 值和 R 值\nL 值通常指内存中的位置。前一个示例中如\
  \ `daysInYear` 的变量实际上是内存位置的句柄，是一个 l 值。相反，r 值可以是内存位置的具体内容。\n\n因此，所有的 l 值都可以是 r 值，但不是所有的\
  \ r 值都可以 l 值。为了更好地理解它，请看下面的示例，它逻辑上不通，因此无法编译：\n\n```cpp\n365 = daysInYear;\n```\n\
  \n### 加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法 (`/`) 和取模 (`%`) 运算符\n你可以通过使用 `+` 加法、`-` 减法、`*`\
  \ 乘法、`/` 除法以及 `%` 取模运算在两个操作数之间执行算术运算：\n\n点击此处查看代码图像\n\n```cpp\nint num1 = 22;\n\
  int num2 = 5;\nint addNums = num1 + num2; // 27\nint subtractNums = num1 – num2;\
  \ // 17\nint multiplyNums = num1 * num2; // 110\nint divideNums = num1 / num2; //\
  \ 4\nint moduloNums = num1 % num2; // 2\n```\n\n注意，除法运算符 (`/`) 返回两个操作数之间的除法结果。然而，在整数的情况下，结果不包含小数，因为根据定义整数不能包含小数数据。取模运算符\
  \ (`%`) 返回除法运算符的余数，且它只适用于整数值。列表 5.1 是一个简单的程序，演示了如何对用户输入的两个数字执行算术函数的应用。\n\n**列表 5.1**\
