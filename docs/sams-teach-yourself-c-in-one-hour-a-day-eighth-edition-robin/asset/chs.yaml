  ## 第 12 节 运算符类型与运算符重载（Lesson 12. Operator Types and Operator Overloading）\n\n除了封装数据和方法外，类还可以封装*运算符*，使得对类实例的操作变得简单。你可以使用这些运算符对类对象执行赋值或加法操作，就像你在第\
  \ 5 节](#ch05.html_ch05)“处理表达式、语句和运算符”中对整数的操作一样。就像函数一样，运算符也可以被重载。在本节中，你将学习：\n\n-\
  \ 使用 `operator` 关键字\n- 一元运算符和二运算符\n- 转换运算符\n- 移动赋值运算符\n- 不能重定义的运算符\n\n## C++ 中的运算符是什么？\n\
  \n在语法层面上，运算符与函数之间几乎没有区别，只是使用了 `operator` 关键字。运算符的声明看起来非常像函数声明：\n\n点击此处查看代码图片\n\n\
  ```cpp\nreturn_type operator operator_symbol (...parameter list...);\n```\n\n\n\n\
  在此例中，`operator_symbol` 可以是程序员定义的几种运算符类型中的任何一种。它可以是 `+`（加法）或 `&&`（逻辑与）等。操作数帮助帮助编译器区分不同的运算符。那么，既然\
  \ C++ 也支持函数，为什么还要提供运算符呢？\n\n考虑一个名为 `Date`（日期）的工具类，它封装封装了日、月、年：\n\n点击此处查看代码图片\n\n\
  ```\nDate holiday (12, 25, 2016);  // 初始化为 2016 年 12 月 25 日\n```\n\n假设你想增加一天并让实例包含下一天——即\
  \ 2016 年 12 月 26 日——以下两个选项中哪一个更直观？\n\n![Image](img/square.jpg) 选项 1（使用递增运算符）：\n\n\
  ```cpp\n++ holiday;\n```\n\n![Image](img/square.jpg) 选项 2（使用成员函数 `Increment()`）：\n\
  \n点击此处查看代码图片\n\n```cpp\nholiday.Increment();  // 2016 年 12 月 26 日\n```\n\n显然，选项\
  \ 1 的得分高于方法 `Increment()`。基于运算符的机制通过提供易用性和直观性方便了使用。在 `Date` 类中实现运算符（`<`）可以帮助你像这样比较两个\
  \ `class Date` 实例：\n\n点击此处查看代码图片\n\n```cpp\nif(date1 < date2)\n{\n    // 执行某些操作\n\
  }\nelse\n{\n    // 执行其他操作\n}\n```\n\n运算符的使用场景比仅仅管理日期的类更广泛。在 列表 9.9 的 第 9 节 “类与对象，](#ch09.html_ch09)”中介绍的\
  \ `MyString` 字符串工具类中，引入加法运算符（`+`）可以方便地进行拼接：\n\n点击此处查看代码图片\n\n```cpp\nMyString sayHello\
  \ (\"Hello \");\nMyString sayWorld (\" world\");\nMyString sumThem (sayHello + sayWorld);\
  \ // 如果 MyString 支持 operator+\nMyString\n```\n\n***\n\n注意\n实现相关运算符所付出的努力将通过类的易用性获得回报。\n\
  \n***\n\n在宏观上，C++ 中的运算符可以分为两类：一元运算符和二元运算符。\n\n### 一元运算符\n\n正如名称所示，作用于单个操作数的运算符被称为一元运算符。在全局命名空间中实现或作为类的静态成员函数实现的一元运算符使用以下结构：\n\
  \n点击此处查看代码图片\n\n```cpp\nreturn_type operator operator_type (parameter_type)\n{\n\
  \    // ... 实现\n}\n```\n\n作为类的（非静态）成员的一元运算符具有类似的结构，但缺少参数，因为它所作用的单一参数是类实例本身（`*this`）：\n\
  \n点击此处查看代码图片\n\n```cpp\nreturn_type operator operator_type ()\n{\n    // ... 实现\n\
  }\n```\n\n### 一元运算符的类型\n\n可以重载（或重定义）的一元运算符如表 12.1\n\n**表 12.1** 一元运算符\n\n#### 编写一元递增/减运算符\n\
  \n一元前缀递增运算符（`++`）可以在类声明中使用以下语法编写：\n\n点击此处查看代码图片\n\n```cpp\n// 一元递增运算符（前缀）\nDate&\
  \ operator ++ ()\n{\n    // 运算符实现代码\n    return *this;\n}\n```\n\n另一方面，后置递增运算符（`++`）具有不同的返回值和一个输入参数（该参数并不总是使用）：\n\
  \n点击此处查看代码图片\n\n```cpp\nDate operator ++ (int)\n{\n    // 在递增日期之前，存储对象状态拷贝\n   \
  \ Date copy (*this);\n    // 递增实现代码\n    // 返回递增前的状态（因为是后置）\n    return copy;\n\
  }\n```\n\n前缀和后置减运算符与递增运算符的语法相似，只是在看到 `++` 的地方包含 `--`。列表 12.1 显示了一个简单的 `Date` 类，它允许使用运算符（`++`）递增日期。\n\
  \n**列表 12.1** 一个处理日、月、年并允许递增和递减日的日历类\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Date\n4: {\n5: private:\n6:     int day, month,\
  \ year;\n7:\n8: public:\n9:     Date(int d, int m, int y) : day(d), month(m), year(y)\
  \ {}\n10:    void DisplayDate()\n{\n11:        cout << month << \"/\" << day <<\
  \ \"/\" << year << endl;\n12:    }\n13:\n14:    Date& operator ++ ()\n15:    {\n\
  16:        day++;\n17:        return *this;\n18:    }\n19:\n20:    Date operator\
  \ ++ (int)\n21:    {\n22:        Date copy (*this);\n23:        day++;\n24:    \
  \    return copy;\n25:    }\n26:\n27:    Date& operator -- ()\n28:    {\n29:   \
  \     day--;\n30:        return *this;\n31:    }\n32:\n33:    Date operator -- (int)\n\
  34:    {\n35:        Date copy (*this);\n36:        day--;\n37:        return copy;\n\
  38:    }\n39: };\n40:\n41: int main ()\n42: {\n43:     Date holiday (12, 25, 2016);\n\
  44:     holiday.DisplayDate();\n45:     ++holiday;\n46:     holiday.DisplayDate();\n\
  47:     holiday ++;\n48:     holiday.DisplayDate();\n49:     --holiday;\n50:   \
  \  holiday.DisplayDate();\n51:     holiday --;\n52:     holiday.DisplayDate();\n\
  53:\n54:     return 0;\n55: }\n```\n\n\n\n\n点击此处查看代码图像\n\n```cpp\ncout << holiday;\
  \ // 缺少转换操作符导致错误\n```\n\n该代码会导致以下编译失败：`error: binary '<<' : no operator found which\
  \ takes a right-hand operand of type 'Date' (or there is no acceptable conversion)`。此错误本质上表示\
  \ `cout` 不知道如何解释 `Date` 类的实例，因为 `class Date` 不支持将其内容转换为 `cout` 能够接受的类型的运算符。\n\n\
  我们知道 `cout` 可以与 `const char*` 良好地工作：\n\n点击此处查看代码图像\n\n```cpp\nstd::cout << \"Hello\
  \ world\"; // const char* 可以工作！\n```\n\n因此，让 `cout` 与 `Date` 类型的实例一起工作，可能简单只需要添加一个返回\
  \ const `char*` 版本的运算符即可：\n\n点击此处查看代码图像\n\n```cpp\noperator const char*()\n{\n \
  \   // 返回 char* 的运算符实现\n}\n```\n\n列表 12.2 是此转换操作符的简单实现。\n\n**列表 12.2** 为 `class\
  \ Date` 实现转换操作符 `const char*`\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n\
  1: #include <sstream> // 为 ostringstream 新增头文件\n2: #include <string>\n3: using namespace\
  \ std;\n4:\n5: class Date\n6: {\n7: private:\n8:     int day, month, year;\n9: \
  \    string dateInString;\n10:\n11: public:\n12:     Date(int inMonth, int inDay,\
  \ int inYear)\n13:         : month(inMonth), day(inDay), year(inYear) {};\n14:\n\
  15:     operator const char*()\n16:     {\n17:         ostringstream formattedDate;\
  \ // 辅助字符串构造\n18:         formattedDate << month << \" / \" << day << \" / \" <<\
  \ year;\n19:\n20:         dateInString = formattedDate.str();\n21:         return\
  \ dateInString.c_str();\n22:     }\n23: };\n24:\n25: int main ()\n26: {\n27:   \
  \  Date Holiday (12, 25, 2016);\n28:\n29:     cout << \"Holiday is on: \" << Holiday\
  \ << endl;\n30:\n31:     // string strHoliday (Holiday); // OK!\n32:     // strHoliday\
  \ = Date(11, 11, 2016); // 也 OK!\n33:\n34:     return 0;\n35: }\n```\n\n* * *\n\n\
  输出 ![Image](img/arrow.jpg)\n\nHoliday is on: 12 / 25 / 2016\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n如第 15 行到 23 行所示，实现运算符 `const char*` 的好处在 `main()` 函数的第 29 行中可见。现在，`class Date`\
  \ 的实例可以直接在 `cout` 语句中使用，利用了 `cout` 理解 `const char*` 的特性。编译器会自动使用适当（在本例中是唯一可用）运算符的输出，传递给\
  \ `cout`，从而在屏幕上显示日期。在你的运算符 `const char*` 实现中，你使用 `std::ostringstream` 将成员整数转换为 `std::string`\
  \ 对象，如第 18 行所示。你本可以可以直接返回 `formattedDate.str()`，但你在第 20 行中将其副本存储在私有成员 `Date::dateInString`\
  \ 中，因为 `formattedDate` 是一个局部变量，它在运算符返回时会被销毁。因此，通过 `str()` 获取的指针在函数返回后将失效。\n\n该运算符为使用\
  \ `class Date` 开启了新的可能性。它允许你直接将 `Date` 实例赋值给 `string`：\n\n点击此处查看代码图像\n\n```cpp\n\
  string strHoliday (holiday);\nstrHoliday = Date(11, 11, 2016);\n```\n\n* * *\n\n\
  ### 注意事项\n\n注意，此类赋值会导致隐式转换，也就是说编译器使用了可用的转换操作符（在此例中为 `const char*`），允许无预期的赋值无错误通过编译。为了避免隐式转换，请在运算符的开头使用\
  \ `explicit` 关键字，如下所示：\n\n```cpp\nexplicit operator const char*()\n{\n    // 转换代码\n\
  }\n```\n\n使用 `explicit` 将强制程序员使用类型转换来断言转换意图：\n\n```cpp\nstring strHoliday(static_cast<const\
  \ char*>(Holiday));\nstrHoliday=static_cast<const char*>(Date(11,1,2016));\n```\n\
  \n类型转换包括 `static_cast` 将在第 13 节 “转换操作符”中详细讨论。\n\n* * *\n\n* 注意\n\n根据你认为你的类会被使用的次数，编写尽可能的操作符。如果你的应用程序需要整数表示形式，你可以这样编写：\n\
  \n```cpp\nexplicit operator int()\n{\n    return day;\n}\n```\n\n这允许 `Date` 实例被转换为整数：\n\
  \n```cpp\nint d = static_cast<int>(Date(12, 25, 2016));\n```\n\n在本节中展示了与字符串使用的运算符。\n\
  \n* * *\n\n### 解引用运算符 `*` 和成员运算符 `->`\n\n解引用运算符 `*` 和成员运算符 `->` 最常用于智能指针。智能指针是包装普通指针并简化内存管理的类。智能指针将在第\
  \ 26 节 “智能指针”中详细讨论。本节简要查看运算符重载如何帮助智能指针。\n\n分析列表 12.3 中 `unique_ptr` 的用法，并理解它是如何通过\
  \ `*` 和 `->` 像指针一样工作的。\n\n**列表 12.3** 使用 `unique_ptr` 管理动态分配的 `class Date` 实例\n\n\
  点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n1: #include <memory>  //\
  \ 为 unique_ptr 新增头文件\n2: using namespace std;\n3:\n4: class Date\n5: {\n6: private:\n\
  7:     int day, month, year;\n8:     string dateInString;\n9:\n10: public:\n11:\
  \     Date(int inMonth, int inDay, int inYear)\n12:         : month(inMonth), day(inDay),\
  \ year(inYear) {};\n13:\n14:     void DisplayDate()\n15:     {\n16:         cout\
  \ << month << \" / \" << day << \" / \" << year << endl;\n17:     }\n18: };\n19:\n\
  20: int main()\n21: {\n22:     unique_ptr<int> smartIntPtr(new int);\n23:     *smartIntPtr\
  \ = 42;\n24:\n25:     // 像 int* 一样使用智能指针类型\n26:     cout << \"Integer value is:\
  \ \" << *smartIntPtr << endl;\n27:\n28:     unique_ptr<Date> smartHoliday (new Date(12,\
  \ 25, 2016));\n29:     cout << \"The new instance of date contains: \";\n30:\n31:\
  \     // 就像使用 Date* 一样使用 smartHoliday\n32:     smartHoliday->DisplayDate();\n33:\n\
  34:     return 0;\n35: }\n```\n\n* * *\n\n\n\n\n此示例演示了智能指针如何允许你使用普通的指针语法，如第 23 行和第\
  \ 32 行所示。在第 23 行，你能够使用 `*smartIntPtr` 显示 `int` 的值，而在第 32 行中，你使用 `smartHoliday->DisplayData()`\
  \ 就像这两个变量分别是 `int*` 和 `Date*` 一样。其中的奥诀在于 `std::unique_ptr` 指针类，它是智能的，因为它实现了 `operator(`*`)`\
  \ 和 `operator(`->`)`。\n\n***\n\n### 注意事项\n\n智能指针类的功能远不止于像普通指针那样四处游走，或者在离开作用域时释放内存。请在第\
  \ 26 节中了解更多关于此主题的知识。\n\n要查看重载了这些运算符的简单智能指针类的实现，你可以简要访问列表 26.1。\n\n***\n\n## 二元运算符\n\
  \n在两个操作数上执行操作的运算符称为*二元运算符*。作为全局函数或静态成员函数实现的二元运算符的定义如下：\n\n点击此处查看代码图像\n\n```\nreturn_type\
  \ operator_type (parameter1, parameter2);\n```\n\n作为类成员实现的二元运算符的定义为：\n\n点击此处查看代码图像\n\
  \n```\nreturn_type operator_type (parameter);\n```\n\n二元运算符的类成员版本只接受一个参数的原因是，第二个参数通常源自类本身的属性。\n\
  \n### 二元运算符的类型\n\n表 12.2 包含了可以在你的 C++ 应用中重载或重定义的二元运算符。\n\n![图像](img/12tab02.jpg)\n\
  \n**表 12.2** 可重载的二元运算符\n\n### 编程二元加法 (`a+b`) 和减法 (`a-b`) 运算符\n\n与递//减运算符类似，二元加法和减法在定义后，允许你从实现这些运算符的类对象中加或减支持的数据类型的值。再次看看你的日历类\
  \ `Date`。虽然你已经实现了增加 `Date` 的功能，使其让日历向前移动一天，但你仍然不支持让它（例如）向前移动五天。为了实现这一点，你需要实现二元运算符(`+`)`，正如列表\
  \ 12.4 中的代码所示。\n\n**列表 12.4** 具有二元加法运算符的日历类\n\n点击此处查看代码图像\n\n***\n0: #includeinclude\
  \ <iostream>\n1: using namespace std;\n2:\n3: class Date\n4: {\n5: private:\n6:\
  \     int day, month, year;\n7:     string dateInString;\n8:\n9: public:\n10:  \
  \   Date(int inMonth, int inDay, int inYear)\n11:         : month(inMonth), day(inDay),\
  \ year(inYear) {};\n12:\n13:     Date operator + (int daysToAdd) // binary addition\n\
  14:     {\n15:         Date newDate (month, day + daysToAdd, year);\n16:       \
  \  return newDate;\n17:     }\n18:\n19:     Date operator - (int daysToSub) // binary\
  \ subtraction\n20:     {\n21:         return Date(month, day - daysToSub, year);\n\
  22:     }\n23:\n24:     void DisplayDate()\n25:     {\n26:         cout << month\
  \ << \" / \" << day << \" / \" << year << endl;\n27:     }\n28: };\n29:\n30: int\
  \ main()\n31: {\n32:     Date Holiday (12, 25, 2016);\n33:     cout << \"Holiday\
  \ on: \";\n34:     Holiday.DisplayDate ();\n35:\n36:     Date PreviousHoliday (Holiday\
  \ - 19);\n37:     cout << \"Previous holiday on: \";\n38:     PreviousHoliday.DisplayDate();\n\
  39:\n40:     Date NextHoliday(Holiday + 6);\n41:     cout << \"Next holiday on:\
  \ \";\n42:     NextHoliday.DisplayDate ();\n43:\n44:     return 0;\n45: }\n***\n\
  输出 ![图像](img/arrow.jpg)\n点击此处查看代码图像\nHoliday on: 12 / 25 / 2016\nPrevious holiday\
  \ on: 12 / 6 / 2016\nNext holiday on: 12 / 31 / 2016\n\n分析 ![图像](img/arrow.jpg)\n\
  \n第 13 行到第 22 行包含了二元运算符(`+`)和`operator(`-`)`的实现，它们允许在 `main()` 中第 40 行和第 36 行中看到的简单加减法语法。二元加法运算符在字符串类中也将有用。在第\
  \ 9 节中，你分析了一个封装了内存管理的简单字符串包装器 `MyString`。\n\n加法赋值 (`+=`) 和 减法赋值 (`-=`) 运算符\n\n加法赋值运算符如\
  \ `a += b;` 允许对 `Date` 对象增加一个整数值。列表 12.5 展示了了给定整数输入。\n\n\n\n你的 `class Date` 类现在允许用户添加或删除天数，就像它们处理整数一样，使用接受\
  \ `int` 作为参数的加或减赋值运算符。你甚至可以为加赋值运算符（`+=`）提供重载版本，使其与虚构类 `Days` 的实例配合：\n\n点击此处查看代码图片\n\
  \n```cpp\n// operator that adds a Days to an existing Date\nvoid operator += (const\
  \ Days& daysToAdd)\n{\n    day += daysToAdd.GetDays();\n}\n```\n\n### 注意事项\n\n乘法赋值\
  \ `*=`、除法赋值 `/=`、取模赋值 `%=`、减法赋值 `-=`、左移赋值 `<<=`、右移赋值 `>>=`、异或赋值 `^=`、按位包含或赋值 `|=`\
  \ 以及按位与赋值 `&=` 运算符的语法与 列表 12.5 中所示的加赋值运算符相似。\n\n虽然重载运算符的最终目标是使类变得易用且直观，但在许多情况下，实现某个运算符可能并没有意义。例如，我们的日历类\
  \ `Date` 完全没有需要使用按位与赋值 `&=` 运算符。该类的任何用户都不应该期望（甚至考虑）通过像 `greatDay &= 20;` 这样的操作获得有用结果。\n\
  \n### 重载相等 (`==`) 和不相等 (`!=`) 运算符\n\n当 `class Date` 的用户比较一个实例与另一个实例时，你期望什么：\n\n\
  点击此处查看代码图片\n\n```cpp\nif (date1 == date2)\n{\n    // Do something\n}\nelse\n{\n\
  \    // Do something else\n}\n```\n\n在缺少相等运算符 `==` 的情况下，编译器简单地对两个对象进行二值比较，并在它们完全相同时返回\
  \ `true`。这种二值比较对于包含简单数据类型的类实例（例如目前的 `Date` 类）有效，但如果涉及的类具有非静态字符串成员（`char*`），例如 列表\
  \ 9.9 中的 `MyString`，则无法工作。当两个 `class MyString` 实例进行比较时，成员属性的二值比较实际上比较的是成员字符串指针的值（`MyString::buffer`）。即使字符串内容相同，这些值也是不等的。涉及两个\
  \ `MyString` 实例的比较将一律返回 `false`。你通过定义比较运算符来解决这个问题。相等运算符的通用表达式如下：\n\n点击此处查看代码图片\n\
  \n```cpp\nbool operator== (const ClassType& compareTo)\n{\n    // comparison code\
  \ here, return true if equal else false\n}\n```\n\n不相等运算符可以复用相等运算符：\n\n点击此处查看代码图片\n\
  \n```cpp\nbool operator!= (const ClassType& compareTo)\n{\n    // comparison code\
  \ here, return true if inequal else false\n}\n```\n\n不相等运算符可以是相等运算符结果的反反（逻辑非）。列表\
  \ 12.6 展示了由我们的日历类 `Date` 定义的比较运算符。\n\n**分列表 12.6** 展示了运算符 `==` 和 `!=`\n\n点击此处查看代码图片\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class Date\n4:\
  \ {\n5: private:\n6:     int day, month, year;\n7:\n8: public:\n9:     Date(int\
  \ inMonth, int inDay, int inYear)\n10:         : month(inMonth), day(inDay), year(inYear)\
  \ {}\n11:\n12:     bool operator== (const Date& compareTo)\n13:     {\n14:     \
  \    return ((day == compareTo.day)\n15:                 && (month == compareTo.month)\n\
  16:                 && (year == compareTo.year));\n17:     }\n18:\n19:     bool\
  \ operator!= (const Date& compareTo)\n20:     {\n21:         return !(this->operator==(compareTo));\n\
  22:     }\n23:\n24:     void DisplayDate()\n25:     {\n26:         cout << month\
  \ << \" / \" << day << \" / \" << year << endl;\n27:     }\n28: };\n29:\n30: int\
  \ main()\n31: {\n32:     Date holiday1 (12, 25, 2016);\n33:     Date holiday2 (12,\
  \ 31, 2016);\n34:\n35:     cout << \"holiday 1 is: \";\n36:     holiday1.DisplayDate();\n\
  37:     cout << \"holiday 2 is: \";\n38:     holiday2.DisplayDate();\n39:\n40: \
  \    if (holiday1 == holiday2)\n41:         cout << \"Equality operator: The two\
  \ are on same day\" << endl;\n42:     else\n43:         cout << \"Equality operator:\
  \ The two are on different days\" << endl;\n44:     if (holiday1 == holiday2)\n\
  45:         cout << \"Equality operator: The two are on same day\" << endl;\n46:\
  \     else\n47:         cout << \"Equality operator: The two are on different days\"\
  \ << endl;\n48:     if (holiday1 != holiday2)\n49:         cout << \"Inequality\
  \ operator: The two are on different days\" << endl;\n50:     else\n51:        \
  \ cout << \"Equality operator: The two are on same day\" << endl;\n52:     return\
  \ 0;\n53: }\n```\n*(注：由于原文在后半部分存在重复和逻辑错乱，译文已根据逻辑进行了对齐处理)*\n\n\n\n\n```cpp\n61: \
  \    Date holiday2 (12, 31, 2016);\n62:\n63:     cout << \"holiday 1 is: \";\n64:\
  \     holiday1.DisplayDate();\n65:     cout << \"holiday 2 is: \";\n66:     holiday2.DisplayDate();\n\
  67:\n68:     if (holiday1 < holiday2)\n69:         cout << \"operator<: holiday1\
  \ happens first\" << endl;\n70:\n71:     if (holiday2 > holiday1)\n72:         cout\
  \ << \"operator>: holiday2 happens later\" << endl;\n73:\n74:     if (holiday1 <=\
  \ holiday2)\n75:         cout << \"operator<=: holiday1 happens on or before holiday2\"\
  \ << endl;\n76:\n77:     if (holiday2 >= holiday1)\n78:         cout << \"operator>=:\
  \ holiday2 happens on or after holiday1\" << endl;\n79:\n80:     return 0;\n81:\
  \ }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nholiday 1 is: 12 / 25 /\
  \ 2016\nholiday 2 is: 12 / 31 / 2016\noperator<: holiday1 happens first\noperator>:\
  \ holiday2 happens later\noperator<=: holiday1 happens on or before holiday2\noperator>=:\
  \ holiday2 happens on or after holiday1\n\n分析 ![Image](img/arrow.jpg)\n\n感兴趣的运算符实现在第\
  \ 12 行到第 50 行，并部分重用了你在列表 12.6 中看到的运算符（`==`）。运算符 `==`、`<` 和 `>` 的实现已被其他部分所消耗。\n\n\
  这些运算符在 `main()` 函数的第 68 行到第 78 行之间被调用，这表明现在比较两个不同的日期是多么么简单。\n\n### 重载拷贝赋值运算符 (`=`)\n\
  \n在某些情况下，你想要将一个类实例的内容赋值给另一个，例如：\n\n点击此处查看代码图像\n\n```cpp\nDate holiday(12, 25, 2016);\n\
