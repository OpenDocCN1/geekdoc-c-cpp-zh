  \n示例从两个示例容器开始，一个 `vector` 和一个 `list`，它们最初被填充了示例整数值。使用 `search()` 来查找 `list` 的内容是否存在于\
  \ `vector` 中，如第 29 行所示。由于你想在整个 `vector` 中搜索整个 `list` 的内容，因此你提供了由两个容器类的 `cbegin()`\
  \ 和 `cend()` 成员方法对应的迭代器返回的范围。这实际上演示了迭代器如何有效地将算法与容器连接起来。提供这些迭代器的容器的物理特性对算法没有意义，因为算法无缝地在\
  \ `vector` 中搜索 `list` 的内容，它们只与迭代器工作。第 42 行使用 `search_n()` 在 `vector` 中查找序列 {9, 9,\
  \ 9} 的首次出现\n\n### 将容器中的元素初始化为特定值\n\n`fill()` 和 `fill_n()` 是帮助将给定范围的内容设置为指定值的 STL\
  \ 算法。`fill()` 根据给定的范围边界和要插入的值来重写范围内的元素：\n\n点击此处查看代码图像\n\n```cpp\nvector <int> numsInVec\
  \ (3);\n// 将容器中的所有元素填充为值 9\nfill (numsInVec.begin (), numsInVec.end (), 9);\n```\n\
  \n顾如名，`fill_n()` 重置指定的 n 个值。它需要一个起始位置、一个计数和一个填充值：\n\n点击此处查看代码图像\n\n```cpp\nfill_n\
  \ (numsInVec.begin () + 3, /*计数*/ 3, /*填充值*/ -9);\n```\n\n列表 23.4 演示了这些算法如何让初始化\
  \ `vector<int>` 中的元素变得简单。\n\n**列表 23.4** 使用 `fill()` 和 `fill_n()` 设置容器中的初始值\n\n\
  点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n2: #include\
  \ <iostream>\n3:\n4: int main ()\n5: {\n6:   using namespace std;\n7:\n8:   // 初始化包含\
  \ 3 个元素的示例 vector\n9:   vector <int> numsInVec (3);\n10:\n11:  // 将容器中的所有元素填充为值\
  \ 9\n12:   fill (numsInVec.begin (), numsInVec.end (), 9);\n13:\n14:   // 增加 vector\
  \ 的大小以容纳 6 个元素\n15:   numsInVec.resize (6);\n16:\n17:   // 从偏移量 3 开始的三个元素填充为值 -9\n\
  18:   fill_n (numsInVec.begin () + 3, 3, -9);\n19:\n20:   cout << \"Contents of\
  \ the vector are: \" << endl;\n21:   for (size_t index = 0; index < numsInVec.size\
  \ (); ++ index)\n22:   {\n23:     cout << \"Element [\" << index << \"] = \";\n\
  24:     cout << numsInVec [index] << endl;\n25:   }\n26:\n27:   return 0;\n28: }\n\
  ```\n\nOutput ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\nvector 的内容为：\nElement [0] =\
  \ 9\nElement [1] = 9\nElement [2] = 9\nElement [3] = -9\nElement [4] = -9\nElement\
  \ [5] = -9\n\n\n\n\n\n如第 9 行所示，使用当前时间作为种子初始化随机数生成器，意味着输出在应用程序每次运行时都可能不同。列表 23.5\
  \ 使用第 12 行的 `generate()` 填充 `vector` 中的所有元素，并使用第 21 行的 `generate_n()` 使用生成器函数 `rand()`\
  \ 提供的随机值填充 `list` 的前三个元素。注意，`generate()` 函数接受一个范围作为输入，并因此对范围内的每个元素调用指定的函数对象 `rand()`。相比之下，`generate_n()`\
  \ 仅接受起始位置。它会根据 `count` 参数指定的次数调用指定的函数对象 `rand()`，以覆盖相应数量元素的内容。容器中超出指定偏移量的元素将保持不变。\n\
  \n### 使用 `for_each()` 处理范围内的元素\n\n`for_each()` 算法将指定的一元函数对象应用于所给范围内的每个元素。`for_each()`\
  \ 的用法如下：\n\n点击此处查看代码图像\n\n```cpp\nfnObjType retValue = for_each (start_of_range,\n\
  \                                 end_of_range,\n                              \
  \   unaryFunctionObject);\n```\n\n该一元函数对象也可以是一个接受一个参数的 lambda 表达式。\n\n返回值表示 `for_each()`\
  \ 返回了用于处理所给范围内每个元素的函数对象（也称为仿函数）。该规范的含义是，使用 `struct` 或 `class` 作为函数对象可以帮助存储状态信息，你可以在稍后\
  \ `for_each()` 完成时查询这些信息。列表 23.6 演示了这一点，它使用函数对象显示范围内的元素，并使用它来统计显示的元素数量。\n\n**列表\
  \ 23.6** 使用 `for_each()` 显示序列内容\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n\
  1: #include <iostream>\n2: #include <vector>\n3: #include <string>\n4: using namespace\
  \ std;\n5:\n6: template <typename elementType>\n7: struct DisplayElementKeepcount\n\
  8: {\n9:     int count;\n10:     DisplayElementKeepcount (): count (0) {}\n11:\n\
  12:     void operator () (const elementType& element)\n13:     {\n14:         ++\
  \ count;\n15:         cout << element << ' ';\n16:     }\n17: };\n18:\n19: int main\
  \ ()\n20: {\n21:     vector <int> numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n22:\n\
  23:     cout << \"Elements in vector are: \" << endl;\n24:     DisplayElementKeepcount<int>\
  \ functor =\n25:         for_each (numsInVec.cbegin(),   // Start of range\n26:\
  \                     numsInVec.cend (),     // End of range\n27:              \
  \       DisplayElementKeepcount<int> ());// functor\n28:     cout << endl;\n29:\n\
  30:     // 使用 for_each 返回值中存储的状态!\n31:     cout << \"'\" << functor.count << \"\
  ' elements displayed\" << endl;\n32:\n33:     string str (\"for_each and strings!\"\
  );\n34:     cout << \"Sample string: \" << str << endl;\n35:\n36:     cout << \"\
  Characters displayed using lambda:\" << endl;\n37:     int numChars = 0;\n38:  \
  \   for_each (str.cbegin(),\n39:                 str.cend(),\n40:              \
  \   &numChars { cout << c << ' '; ++numChars; }\n41:     cout << endl;\n42:    \
  \ cout << \"'\" << numChars << \"' characters displayed\" << endl;\n43:\n44:   \
  \  return 0;\n45: }\n```\n\n![Image](img/arrow.jpg) 点击此处查看代码图像\nElements in vector\
