  \ `list` 对象中的两个元素，然后在它们之间插入了一个元素。这些迭代器会因为插入操作而失效吗？\n\n**3.** 如何清空 `std::list` 的内容？\n\
  \n**4.** 可能在 `list` 中插入多个元素吗？\n\n### Exercises\n\n**1.** 编写一个短程序，接受用户输入的数字并插入到 `list`\
  \ 的顶部。\n\n**2.** 使用一个短程序演示：指向 `list` 中元素的迭代器在在其之前插入了另一个元素后，仍然保持有效，从而改变了原元素的相对位置。\n\
  \n**3.** 编写一个程序，使用 `list` 的 `insert()` 函数将 `vector` 的内容插入 STL `list` 中。\n\n**4.**\
  \ 编写一个对字符串列表 `list` 进行排序的程序。\n\n\n\n\n如果你需要一个可以修改值或调用非 `const` 函数的迭代器，你应该使用 `iterator`\
  \ 而不是 `const_iterator`。\n\n鉴于 `set` 和 `multiset` 都是在插入时对元素排序的容器，当你不提供排序标准时，它们会使用默认谓词\
  \ `std::less`。这确保了你的集合包含按升序排列的元素。\n\n你可以通过定义一个带有 `operator()` 的类来创建一个二元排序谓词，该运算符接收两个类型与集合中包含类型相同的值作为输入，并根据你的标准返回\
  \ `true`。其中一种用于按降序排序的排序谓词如下：\n\n点击此处查看代码图像\n\n```cpp\n// used as a template parameter\
  \ in set / multiset instantiation\ntemplate <typename T>\nstruct SortDescending\n\
  {\n    bool operator()(const T& lhs, const T& rhs) const\n    {\n      return (lhs\
  \ > rhs);\n    }\n};\n```\n\n然后你按照如下方式在实例化 `set` 或 `multiset` 时提供此谓词：\n\n点击此处查看代码图像\n\
  \n```cpp\n// a set and multiset of integers (using sort predicate)\nset <int, SortDescending<int>>\
  \ setInts;\nmultiset <int, SortDescending<int>> msetInts;\n```\n\n除了这些变体外，你始终可以创建一个从另一个容器拷贝或通过提供的范围拷贝的\
  \ `set` 或 `multiset`，如 列表 19.1 所示。\n\n**列表 19.1** `set` 和 `multiset` 的不同实例化技术\n\n\
  点击此处查看代码图像\n\n```cpp\n0: #include <set>\n1:\n2: // used as a template parameter\
