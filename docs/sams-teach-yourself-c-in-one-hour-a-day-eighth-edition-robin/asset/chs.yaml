  **A**\n\n**Q 我声明了两个名称不同的函数。这些是什么？**\n\n**Q 栈指向栈的顶部、中间还是底部？**\n\n## 工作坊\n\n工作坊提供了测验来帮助你理解材料，并提供了练习来提供经验。\n\
