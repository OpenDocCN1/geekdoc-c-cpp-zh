  \ `for_each()` 中使用时，它向像 `vector` 等容器中的值加上用户指定的值。\n\n## 第 23  STL 算法\n\n标准模板库 (STL)\
  \ 的重要部分是一组由 `<algorithm>` 头文件提供的泛型函数，这些函数可以帮助操作或处理容器的内容。在本节中，你将学习算法的用法，这些算法通过减少样板代码来帮助你：\n\
  \n- ![Image](img/square.jpg) 从容器中计数、搜索、查找、拷贝和删除元素\n- ![Image](img/square.jpg) 将范围内元素的值设置为生成器函数的返回值或预定义常量\n\
  - ![Image](img/square.jpg) 对范围内的元素进行排序或分区\n- ![Image](img/square.jpg) 在排序范围的正确位置插入元素\n\
  \n### 什么是 STL 算法？\n\n查找、搜索、删除和计数是一些广泛应用于各种程序中的通用算法活动。STL 以泛型模板函数的形式解决了这些以及许多其他需求，这些函数通过迭代器在容器上工作。要使用\
  \ STL 算法，程序员首先必须包含 `<algorithm>` 头文件。\n\n> **注意**\n> 尽管大多数算法通过容器上的迭代器工作，但并非所有算法都一定构作用于容器，因此并非所有算法都需要迭代器。某些算法（如\
  \ `swap()`）只需接受一对值进行交换。同样，`min()` 和 `max()` 也直接对值操作。\n\n### STL 算法的分类\n\nSTL 算法大致分为两类：非修改算法和变异算法。\n\
  \n#### 非修改算法\n\n既不改变容器顺序也不改变内容的算法被称为非修改算法。一些突出的非修改算法如表 23.1 所示。\n\n![Image](img/23tab01.jpg)\n\
  **表 23.1** 非修改算法快速参考\n\n### 变异算法\n\n变异算法是改变其操作序列的内容或顺序的算法。STL 提供的最实用的变异算法如表 23.2\
  \ 所示。\n\n![Image](img/23tab02.jpg)Image](graphics/square.jpg)\n**表 23.2** 变异算法快速参考\n\
  \n### STL 算法的用法\n\n查找、搜索、删除和计数是一些广泛应用于各种程序中的通用算法活动。STL 以泛型模板函数的形式解决了这些以及许多其他需求，这些函数通过迭代器在容器上工作。要使用\
  \ STL 算法，程序员首先必须包含 `<algorithm>` 头文件。\n\n> **注意**\n> 尽管大多数算法通过容器上的迭代器工作，但并非所有算法都一定作用于容器，因此并非所有算法都需要迭代器。某些算法（如\
  \ `swap()`）只需接受一对值进行交换。同样，`min()` 和 `max()` 也直接对值操作。\n\nSTL 算法的用法\n\n表 23.1 和 23.2\
  \ 中提到的 STL 算法的用法最好通过实际操作来学习。为了这个这一点，请通过练习代码并开始应用它们。#### 给定值或条件查找元素\n\n这种用法![Image](img/23tab01.jpg)####\
  \ 给定值或条件查找元素\n\n给定一个如 `vector` 的容器，STL 算法 `find()` 和 `find_if()` 分别帮助你找到匹配某个值或满足某个条件的元素。`find()`\
  \ 的用法遵循此模式：\n\n```\nauto element = find (numsInVec.cbegin(), // 起始\n           \
  \         numsInVec.cend(),  // 结束\n                    numToFind);         // 要查找的元素\n\
  ```\n\n`find_if()` 类似，它要求提供一个单元谓词（返回 `true` 或 `false` 的单元函数）作为第三参数。\n\n```\nauto\
  \ evenNum = find_if (numsInVec.cbegin(), // 起始\n                       numsInVec.cend(),\
  \  // 结束\n                       [](int element) { return (element % 2) == 0;\n\
  ```\n\n这两个查找函数都返回一个迭代器，你需要与容器的 `end()` 或 `cend()` 进行比较以验证查找操作是否成功。如果检查成功，你可以使用该迭代器。列表\
  \ 23.1 展示了使用 `find()` 在 vector 中查找值，以及使用 `find_if()` 查找第一个值。\n\n**列表 23.1** 在 `vector`\
  \ 中使用 `find()` 查找整数值，在 lambda 表达式中使用 `find_if` 查找给定单元谓词的第一个数字\n\n```cpp\n#include\
  \ <iostream>\n#include <algorithm>\n#include <vector>\n\nint main() {\n    using\
  \ namespace std;\n    vector<int> numsInVec{ 2017, 0, -1, 42, 10101, 25 };\n\n \
  \   cout << \"在集合中查找数字：\";\n    int numToFind = 0;\n    cin >> numToFind;\n\n  \
  \  auto element = find (numsInVec.cbegin(), // 范围起始\n                        numsInVec.cend(),\
  \  // 范围结束\n                        numToFind);         // 要查找的元素\n\n    // 检查查找是否成功\n\
  \    if (element != numsInVec.cend ())\n        cout << \"找到值 \" << *element <<\
  \ \"!\" << endl;\n    else\n        cout << \"没有元素包含值 \" << numToFind << endl;\n\
  \n    cout << \"使用 find_if 查找第一个偶数：\" << endl;\n\n    auto evenNum = find_if (numsInVec.cbegin(),\
  \ // 范围起始\n                          numsInVec.cend(),  // 范围结束\n              \
  \            [](int element) { return (element % 2) == 0; });\n\n    if (evenNum\
  \ != numsInVec.cend())\n        cout << \"找到结果!\" << endl;\n}\n```\n\n\n\n\n```cpp\n\
  27: [](int element) { return (element % 2) == 0; } );\n\n29: if (evenNum != numsInVec.cend\
  \ ())\n   {\n      cout << \"Number '\" << *evenNum << \"' found at position [\"\
  ;\n      cout << distance (numsInVec.cbegin (), evenNum) << \"]\" << endl;\n   }\n\
