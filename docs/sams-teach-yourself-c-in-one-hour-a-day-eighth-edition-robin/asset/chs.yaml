  \ 中演示。\n\n***\n\n### 在 STL `set` 或 `multiset` 中删除元素\n\n关联容器如 `set`、`multiset` 或\
  \ `map` 和 `multimap` 具有 `erase()`——这是一个成员函数，允许你根据键（key）删除值：\n\n```cpp\nsetObject.erase\
  \ (key);\n```\n\n`erase()` 函数的另一种形式允许根据指向该元素的迭代器来删除特定元素：\n\n```cpp\nsetObject.erase\
  \ (element);\n```\n\n可以使用提供边界的迭代器从 `set` 或 `multiset` 中删除范围内的元素：\n\n点击此处查看代码\n\n\
  ```cpp\nsetObject.erase (iLowerBound, iUpperBound);\n```\n\nListing 19.4 中的示例演示了如何使用\
  \ `erase()` 从 `set` 或 `multiset` 中移除元素。\n\n**代码列表 19.4** 在 `multiset` 上使用 `erase`\
  \ 成员函数\n\n点击此处查看代码\n\n***\n\n```cpp\n#include <set>\n#include <iostream>\nusing\
  \ namespace std;\n\ntemplate <typename T>\nvoid DisplayContents (const T& Input)\n\
  {\n    for (auto element = Input.cbegin();\n             element != Input.cend ();\n\
  \             ++ element )\n        cout << *element << ' ';\n\n    cout << endl;\n\
  }\n\ntypedef multiset <int> MSETINT;\n\nint main ()\n{\n    MSETINT msetInts{ 43,\
  \ 78, 78, -1, 124 };\n\n    cout << \"multiset contains \" << msetInts.size () <<\
  \ \" elements: \";\n    DisplayContents(msetInts);\n\n    cout << \"Enter a number\
  \ to erase from the set: \";\n    int input = 0;\n    cin >> input;\n\n    cout\
  \ << \"Erasing \" << msetInts.count (input) << \" instances of value \" << input\
  \ << endl;\n    msetInts.erase (input);\n    cout << \"multiset contains \" << msetInts.size\
  \ () << \" elements: \";\n    DisplayContents(msetInts);\n\n    return 0;\n}\n```\n\
