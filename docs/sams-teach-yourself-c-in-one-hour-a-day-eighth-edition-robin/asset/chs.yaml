  \ // 初始值\n6:\n7:     while (userSelection != 'x')\n8:     {\n9:         cout <<\
  \ \"Enter two integers: \" << endl;\n10:        int num1 = 0, num2 = 0;\n11:   \
  \     cin >> num1;\n12:        cin >> num2;\n13:\n14:        cout << num1 << \"\
