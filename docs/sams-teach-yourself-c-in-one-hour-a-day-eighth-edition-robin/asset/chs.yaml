  \n### 备注\n`stable_partition()` 比 `partition()` 慢，因此只有当元素的相对顺序很重要时你才使用它。\n\n### 在排序集合中插入元素\n\
  确保在排序集合的正确位置插入元素是重要的。STL 提供了如 `lower_bound()` 和 `upper_bound()` 等函数来满足这一需求：\n\n\
  点击此处查看代码图像\n\n```cpp\nauto minInsertPos = lower_bound(names.begin(), names.end(),\n\
  \                               \"Brad Pitt\");\n// 也可以：\nauto maxInsertPos = upper_bound\
  \ (names.begin(), names.end(),\n                               \"Brad Pitt\");\n\
  ```\n\n因此，`lower_bound()` 和 `upper_bound()` 返回的迭代器指向可以在不破坏排序的情况下插入元素的最小和最大位置。\n\n\
  列表 23.12 展示了在排序集合中使用 `lower_bound()`。\n\n\n\n一个元素可以插入到有序集合的两个潜在位置：一个由 `lower_bound()`\
  \ 返回，它是最低位置（最接近集合起始位置的）；另一个是另一个 `upper_bound()` 返回的迭代器，它是最高位置（距离集合起始位置最远的位置）。在列表\
  \ 23.12 中，如果插入到有序集合的字符串 `\"Brad\"` 已经存在于集合中，则下界和上界是不同的（否则它们将是相同的）。这些函数的用法分别在第 24\
  \ 行和第 29 行所示。如输出所示，当使用 `lower_bound()` 返回的迭代器用于第 35 行所示的将字符串插入 `list` 时，结果是列表保持其有序状态。因此，这些算法可以帮助你在集合的某处进行插入，而不会破坏内容的有序性。使用\
  \ `upper_bound()` 返回的迭代器同样可以良好工作。\n\n* * *\n\n## DO\n\n**务必**记得在使用算法 `remove()`、`remove_if()`\
  \ 或 `unique()` 之后，使用容器的 `erase()` 成员方法来调整容器的大小。\n\n**务必**在使用在使用 `find()`、`find_if()`、`search()`\
  \ 或 `search_n()` 函数返回的迭代器之前，通过将其与容器的 `end()` 进行比较来检查其有效性。\n\n**务必**仅在排序元素的相对顺序重要时才选择\
  \ `stable_partition()` 代替 `partition()`，以及选择 `stable_sort()` 代替 `sort()`，因为稳定 _*\
  \ 版本可能会降低应用程序的性能。\n\n* * *\n\n* * *\n\n## DON’T\n\n**不要**忘记在调用 `unique()` 移除相邻重复值之前，先使用\
  \ `sort()` 对容器进行排序。`sort()` 将确保所有相同值的元素都相邻排列，使 `unique()` 有效。\n\n**不要**在随机选择的位置向有序容器中插入元素，而应使用由\
  \ `lower_bound()` 或 `upper_bound()` 返回的位置进行插入，以确保元素的有序顺序不受干扰。\n\n**不要**忘记 `binary_search()`\
  \ 仅用于有序容器。\n\n* * *\n\n### 总结\n\n在本节中，你学习了 STL 最重要且最强大的方面之一：算法。你洞察了不同类型的算法，示例应该让你对算法的应用有了更清晰的理解。\n\
  \n### 问答\n\n**Q 我会在关联容器（如 `std::set`）上使用变异算法（如 `std::transform()`）吗？**\n\n**A**\
  \ 即使可行，也不应该这样做。关联容器的内容应该被视为常数。这是因为关联容器在插入元素时会对其元素进行排序，且元素的相对位置在 `find()` 等函数以及容器的效率中都起着重要作用。因此，不应在\
  \ STL 集合上使用 `std::transform()` 等变异算法。\n\n**Q 我需要将顺序容器每个元素的内容设置为特定值。我会为此活动使用 `std::transform()`\
  \ 吗？**\n\n**A** 虽然可以使用此活动，但 `fill()` 或 `fill_n()` 更适合这项任务。\n\n**Q `copy_backward()`\
  \ 是否反转了目标容器中元素的内容？**\n\n**A** 不。STL 算法 `copy_backward()` 反转的是元素复制的顺序，而不是元素存储的顺序；也就是说，它从范围的末尾开始并到达顶部。要反转集合的内容，你应该使用\
  \ `std::reverse()`。\n\n**Q 我应该在列表上使用 `std::sort()` 吗？**\n\n**A** `std::sort()` 在列表上的用法与它在任何顺序容器上的用法相同。然而，列表需要保持一个特殊属性，即对列表的操作不会使现有的迭代器失效——这是\
  \ `std::sort()` 无法保证维持的属性。因此，STL `list` 以成员函数 `list::sort()` 的形式提供了 `sort()` 算法，应该使用它，因为它保证了即使元素在列表中的相对位置发生了变化，指向这些元素的迭代器也不会失效。\n\
  \n**Q 为什么向有序范围插入元素时使用 `lower_bound()` 或 `upper_bound()` 等函数很重要？**\n\n**A** 这些函数分别提供了第一个和最后一个位置，在这些位置可以将元素插入到有序集合而不破坏排序。\n\
