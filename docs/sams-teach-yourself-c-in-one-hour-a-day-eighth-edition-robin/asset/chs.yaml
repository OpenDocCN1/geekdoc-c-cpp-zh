  \ 功能能够正确读取使用旧版本创建的二进制数据。\n\n\n\n\n\n# 使用 `std::stringstream` 进行字符串转换\n\n你有一个字符串。它包含一个字符串值\
  \ `45`。你如何将这个字符串值转换为数值为 `45` 的整数？反之亦然？C++ 提供的最实用工具之一是 `class stringstream`，它允许你执行大量的转换操作。\n\
  \n### 提示\n\n要使用 `std::stringstream` 类，请包含头文件：\n\n```cpp\n#include <sstream>\n```\n\
  \n列表 27.11 展示了一些简单的 `stringstream` 操作。\n\n**列表 27.11** 使用 `std::stringstream` 将整数值转换为字符串表示以及反之亦然\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include<fstream>\n1: #include<sstream>\n2: #include<iostream>\n\
  3: using namespace std;\n4:\n5: int main()\n6: {\n7:     cout << \"Enter an integer:\
