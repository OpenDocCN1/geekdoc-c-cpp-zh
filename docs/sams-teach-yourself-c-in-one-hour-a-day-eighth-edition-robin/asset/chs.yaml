  \ 将此整数插入 `stringstream` 对象中。然后，你使用第 14 行的提取运算符 `operator>>` 将此整数转换为 `string`。之后，你使用此字符串作为起点，获取字符串\
  \ `inputAsStr` 中持有的数值的整数表示 `Copy`。\n\n## 应当 (DO)\n\n- 当你只想读取文件时，**务必**使用 `ifstream`。\n\
  - 当你只想写入文件时，**务必**使用 `ofstream`。\n- **务必**记得在从流插入或提取之前，通过 `is_open()` 检查文件流是否成功打开。\n\
  \n## 不要 (DON'T)\n\n- **不要**忘记在使用完文件流后使用 `close()` 方法将其关闭。\n- **不要**忘记通过 `cin >>\
  \ strData;` 从 `cin` 提取到 `string` 通常会导致 `strData` 仅包含到第一个空白字符之前的文本，而不是整行。\n- **不要**忘记函数\
  \ `getline(cin, strData);` 会从输入流中获取整行内容，包括空白符。\n\n### 总结\n\n本节从实践角度教了你 C++ 流。你了解到从书的第一开始你就在使用流，如\
  \ I/O 流 `cout` 和 `cin`。你现在知道如何创建简单的文本文件以及如何从中读取或写入内容。你学习了 `stringstream` 如何帮助你将整数等简单类型转换为字符串，反之亦然。\n\
  \n### 问答 (Q&A)\n\n**Q 我看到可以使用 fstream 同时对文件进行读写，那么我什么时候应该使用 `ofstream` 和 `ifstream`\
  \ 呢？**\n\n**A** 如果你的代码或模块只需要读取文件，你应该改用 `ifstream`。同样，如果它只需要写入文件，请使用 `ofstream`。在这两种情况下\
  \ `fstream` 都能正常工作，但为了确保数据和代码的完整性，最好采用类似于使用 `const` 的限制性策略（尽管后者并非强制性的）。\n\n**Q 我什么时候应该使用\
  \ `cin.get()`，什么时候应该使用 `cin.getline()`？**\n\n**A** `cin.getline()` 确保你捕获用户输入的包括空格在内的整行内容。`cin.get()`\
  \ 帮助你捕获单个字符。\n\n**Q 我什么时候应该使用 `stringstream`？**\n\n**A** `stringstream` 提供了一种将整数转换为字符串以及反之亦然的便捷方法。\n\
  \n\n\n\n异常可能由外部因素引起，例如资源不足的系统，也可能由应用程序内部的因素引起，例如尽管包含无效值仍被使用的指针或除以零错误。某些模块的设计目的是通过向调用者抛出异常来通信错误。\n\
  \n**注意**\n为了保护你的代码免受异常的影响，你需要对异常进行“处理”，从而使你的代码变得是“异常安全的”。\n\n### 通过 `try` 和 `catch`\
  \ 实现异常安全\n\n在实现异常安全方面，`try` 和 `catch` 是 C++ 中最重要的关键字。要使语句具有异常安全，你需要将它们封装在 `try`\
  \ 块中，并在 `catch` 块中处理从 `try` 块产生的异常：\n\n点击此处查看代码图像\n\n```cpp\nvoid SomeFunc()\n{\n\
  \    try\n    {\n        int* numPtr = new int;\n        *numPtr = 999;\n      \
  \  delete numPtr;\n    }\n    catch(...)  // ... 捕获所有异常\n    {\n        cout <<\
  \ \"Exception in SomeFunc(), quitting\" << endl;\n    }\n}\n```\n\n#### 使用 `catch(...)`\
  \ 处理所有异常\n\n记得在第 8 节中的“指针和引用详解”中，我提到过 `new` 的默认形式在成功时返回指向内存位置的有效指针，但在失败时抛出异常。列表\
  \ 28.1 展示了你如何使用 `new` 使内存分配具有异常安全，并处理计算机无法分配你请求的内存的情况。\n\n**列表 28.1** 在内存分配中使用 `try`\
  \ 和 `catch` 确保异常安全\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     cout << \"Enter number of integers you wish\
  \ to reserve: \";\n6:     try\n7:     {\n8:         int input = 0;\n9:         cin\
  \ >> input;\n10:\n11:         // 请求内存空间并然后返回它\n12:         int* numArray = new int\
  \ [input];\n13:         delete[] numArray;\n14:     }\n15:     catch (...)\n16:\
  \     {\n17:         cout << \"Exception occurred. Got to end, sorry!\" << endl;\n\
  18:     }\n19:     return 0;\n20: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nEnter number of integers you wish to reserve: -1\nException occurred. Got to end,\
  \ sorry!\n\n分析 ![Image](img/arrow.jpg)\n\n对于这个示例，我使用了 `-1` 作为我想要保留的整数数量。这个输入是荒谬的，但用户总是在做荒谬的事情。在没有异常处理器的情况下，程序将遇到一个非常糟糕的结局。但多亏了异常处理器，你看到输出显示了一条得体的消息：`Got\
  \ to end, sorry!`\n\n列表 28.1 展示了 `try` 和 `catch` 块的使用。`catch()` 接收参数，就像函数一样，而 `...`\
  \ 意味着这个 `catch` 块接受各种异常。然而，在这种情况下，我们可能想专门隔离 `std::bad_alloc` 类型的异常，因为这些异常是在 `new`\
  \ 失败时抛出的。捕获特定类型将帮助你专门处理该类型的问题，例如向用户显示一条消息告诉他们到底发生了什么错误。\n\n#### 捕获特定类型的异常\n\n列表\
  \ 28.1 中的异常是从 C++ 标准库抛出的。此类异常具有已知类型，捕获特定类型对你来说更好，因为你可以确定位异常的原因，进行更好的清理，或者至少向用户显示一条精确的消息，正如列表\
  \ 28.2 所示的那样。\n\n**列表 28.2** 捕获类型为 `std::bad_alloc` 的异常\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: #include <exception> // 包含此以 catch bad_alloc\n2: using\
  \ namespace std;\n3:\n4: int main()\n5: {\n6:     cout << \"Enter number of integers\
  \ you wish to reserve: \";\n7:     try\n8:     {\n9:         int input = 0;\n10:\
  \         cin >> input;\n11:\n12:         // 请求内存空间并然后返回它\n13:         int* numArray\
  \ = new int [input];\n14:         delete[] numArray;\n15:     }\n16:     catch (std::bad_alloc&\
  \ exp)\n17:     {\n18:         cout << \"Exception encountered: \" << exp.what()\
  \ << endl;\n19:         cout << \"Got to end, sorry!\" << endl;\n20:     }\n21:\
  \     catch(...)\n22:     {\n23:     }\n24:     return 0;\n25: }\n```\n\nOutput\
