  \ `stack` 类反转用户输入的字符串。\n\n## 第 25 节 使用 STL 处理位标志 (Bit Flags)\n\n位（Bits）可以是存储设置和标志的一种高效方式。标准模板库（STL）提供了帮助组织和操作位信息的类。本节将向你介绍介绍：\n\
  \n![Image](img/square.jpg) `bitset` 类\n\n![Image](img/square.jpg) `vector<bool>`\n\
