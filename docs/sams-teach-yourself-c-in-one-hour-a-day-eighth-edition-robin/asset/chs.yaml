  \  // cend() 是 C++11 新引入的\n          ++ element )\n        cout << *element << '\
  \ ';\n\n    cout << endl;\n}\n\nint main ()\n{\n    vector <int> integers;\n\n \
  \   // 将示例整数插入 vector 中：\n    integers.push_back (50);\n    integers.push_back (1);\n\
  \    integers.push_back (987);\n    integers.push_back (1001);\n\n    cout << \"\
  Vector contains \" << integers.size () << \" elements: \";\n    DisplayVector(integers);\n\
  \n    // 移除末尾的一个元素\n    integers.pop_back ();\n\n    cout << \"After a call to pop_back()\"\
  \ << endl;\n    cout << \"Vector contains \" << integers.size () << \" elements:\
  \ \";\n    DisplayVector(integers);\n\n    return 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\
