  \n**3.** 通过简单的程序演示 `set` 不能接受重复条目，而 `multiset` 可以。\n\n## 第 20 节. STL Map 类\n\n标准模板库\
  \ (STL) 为程序员提供了容器类，有助于需要频繁且快速搜索的应用。\n\n本节涵盖：\n\n![Image](img/square.jpg) 如何使用 STL\
  \ `map` 和 `multimap`、`unordered_map` 以及 `unordered_multimap` 容器来对你有帮助\n\n![Image](img/square.jpg)\
  \ 元素的插入、删除和搜索\n\n![Image](img/square.jpg) 插入自定义谓词\n\n### STL 类简介\n\n`map` 和 `multimap`\
  \ 是键值对容器，允许如图 20.1 所示的查找。\n\n![Image](img/square.jpg) **图 20.1** 持键值的容器\n\n`map`\
  \ 和 `multimap` 的区别在于后者允许重复，而前者允许唯一键。为了便于快速搜索，`map` 和 `multimap` 的 STL 实现类似于二叉树。这意味着与\
  \ `vector` 中位置可以被替换不同，`map` 中的元素是有排序的。\n\n使用类 `std::map` 或 `std::multimap` 需要包含：\n\
  \n```cpp\n#include<map>\n```\n\n* *\n\n### `std::map` 和 `std::multimap` 操作\n\nSTL\
  \ `map` 和 `multimap` 是模板类，在使用任何函数之前需要实例化。\n\n#### 实例化 `std::map` 或 `std::multimap`\n\
  \n实例化整数作为键、字符串作为值的 `map` 或 `multimap` 需要模板的特化。`map` 的模板实例化需要程序员指定键类型、值类型，以及可选的帮助\
  \ `map` 类在插入时排序的谓词。因此，典型的 `map` 语法如下：\n\n```cpp\nmap<keyType, valueType, Predicate=std::less<keyType>>\
  \ mapObj;\n```\n\n因此，第三模板参数是可选的。当你只提供键类型和值类型而忽略第三模板参数时，`std::map` 和 `std::multimap`\
  \ 默认使用 `class std::less<>` 来定义排序标准。因此，一个映射整数到字符串的 `map` 或 `multimap` 如下：\n\n```cpp\n\
  std::map<int, string> mapIntToStr;\nstd::multimap<int, string> mmapIntToStr;\n```\n\
  \n列表 20.1 详细详细说明了实例化技术。\n\n**列表 20.1** 实例化映射 `int` 键到 `string` 的 `map` 和 `multimap`\
  \ 对象\n\n```cpp\n#include<map>\n#include<string>\n\ntemplate<typename keyType>\n\
  struct ReverseSort\n{\n    bool operator()(const keyType& key1, const keyType& key2)\n\
  \    {\n        return (key1 > key2);\n    }\n};\n```\n\n\n\n\n```cpp\n// map and\
  \ multimap key of type int to value of type string\nmap<int, string> mapIntToStr1;\n\
  multimap<int, string> mmapIntToStr1;\n\n// map and multimap constructed as a copy\
  \ of another\nmap<int, string> mapIntToStr2(mapIntToStr1);\nmultimap<int, string>\
  \ mmapIntToStr2(mmapIntToStr1);\n\n// map and multimap constructed given a part\
  \ of another map or multimap\nmap<int, string> mapIntToStr3(mapIntToStr1.cbegin(),\
  \ mapIntToStr1.cend());\nmultimap<int, string> mmapIntToStr3(mmapIntToStr1.cbegin(),\
  \ mmapIntToStr1.cend());\n\n// map and multimap with a predicate that inverses sort\
  \ order\nmap<int, string, ReverseSort<int>> mapIntToStr4(mapIntToStr1.cbegin(),\
  \ mapIntToStr1.cend());\nmultimap<int, string, ReverseSort<int>> mmapIntToStr4(mapIntToStr1.cbegin(),\
  \ mapIntToStr1.cend());\n\nreturn 0;\n}\n```\n\n## 分析 ![Image](img/arrow.jpg)\n\n\
  首先，关注第 12–39 行的 `main()`。最简单的从整数键到字符串值的 `map` 和 `multimap` 可以在第 17 和 18 行看到。第 25–28\
  \ 行演示了如何以另一个容器的值范围作为输入初始化 `map` 或 `multimap`。第 31–36 行演示了如何使用自定义的排序准则实例化 `map` 或\
  \ `multimap`。注意，默认排序（在之前的实例化中）使用 `std::less<T>`，它会按升序顺序排列元素。如果你想更改这种行为，可以提供一个实现了\
  \ `operator()` 的 `class` 或 `struct` 作为谓词。这种谓词词结构体 `struct ReverseSort` 位于第 3–10\
  \ 行，并已用于第 32 行 `map` 的实例化和第 35 行 `multimap` 的实例化。\n\n### 在 STL `map` 或 `multimap`\
  \ 中插入元素\n\n`map` 和 `multimap` 中的大多数函数工作方式相似。它们接受相似的参数并返回相似的值类型。你可以通过使用 `insert`\
  \ 成员函数向两种容器插入元素：\n\n点击此处查看代码图像\n\n```cpp\nstd::map<int, std::string> mapIntToStr1;\n\
  // 使用 make_pair 函数插入键值值对\nmapIntToStr.insert (make_pair (-1, \"Minus One\"));\n\
  ```\n\n由于这两个容器以键值对的形式维护元素，你也可以直接提供一个初始化为要插入的键值的 `std::pair`：\n\n点击此处查看代码图像\n\n```cpp\n\
  mapIntToStr.insert (pair <int, string>(1000, \"One Thousand\"));\n```\n\n或者，你可以使用类似数组的语法进行插入，这看起来非常用户友好，并且通过下标运算符\
  \ `operator[]` 支持：\n\n点击此处查看代码图像\n\n```cpp\nmapIntToStr [1000000] = \"One Million\"\
  ;\n```\n\n你还可以将 `multimap` 实例化为 `map` 的拷贝：\n\n点击此处查看代码图像\n\n```cpp\nstd::multimap<int,\
  \ std::string> mmapIntToStr(mapIntToStr.cbegin(), mapIntToStr.cend());\n```\n\n\
  列表 20.2 演示了各种实例化方法。\n\n#### 列表 20.2 使用 `insert()` 的重载和通过 `operator[]` 的数组语义在 `map`\
  \ 和 `multimap` 中插入元素\n\n点击此处查看代码图像\n\n```cpp\n#include <map>\n#include <iostream>\n\
  #include <string>\n\nusing namespace std;\n\n// 定义 map 和 multimap 以提高可读性\ntypedef\
  \ map <int, string> MAP_INT_STRING;\ntypedef multimap <int, string> MMAP_INT_STRING;\n\
  \ntemplate <typename T>\nvoid DisplayContents (const T& cont) {\n    for (auto element\
  \ = cont.cbegin(); element != cont.cend(); ++ element) {\n        cout << element->first\
  \ << \" -> \" << element->second << endl;\n    }\n    cout << endl;\n}\n\nint main\
  \ () {\n    MAP_INT_STRING mapIntToStr;\n\n    // 使用 value_type 向 map 插入键值对\n  \
  \  mapIntToStr.insert (MAP_INT_STRING::value_type (3, \"Three\"));\n\n    // 使用\
  \ make_pair 插入值对\n    mapIntToStr.insert (make_pair (-1, \"Minus One\"));\n\n  \
  \  // 直接插入值对对象\n    mapIntToStr.insert (pair <int, string>(1000, \"One Thousand\"\
  ));\n\n    // 使用类似数组的语法插入键值对\n    mapIntToStr [1000000] = \"One Million\";\n\n \
  \   cout << \"map 包含 \" << mapIntToStr.size () << \" 个键值对。它们是：\" << endl;\n    DisplayContents(mapIntToStr);\n\
  \n    // 实例化一个作为 map 拷贝的 multimap\n    MMAP_INT_STRING mmapIntToStr(mapIntToStr.cbegin(),\
  \ mapIntToStr.cend());\n\n    // insert 函数对 multimap 的工作方式也相同\n    // multimap 可以存储重复项\
  \ - 插入一个重复项\n    mmapIntToStr.insert (make_pair (1000, \"Thousand\"));\n\n    cout\
  \ << endl << \"multimap 包含 \" << mmapIntToStr.size() << \" 个键值对。它们是：\" << endl;\n\
  }\n```\n\n\n\n\n```cpp\ncout << pairFound->second << endl;\n}\nelse\n    cout <<\
  \ \"Sorry, pair with key \" << key << \" not in map\" << endl;\n```\n\n***\n\n###\
