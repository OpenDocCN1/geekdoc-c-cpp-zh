  \n`forward_list` 的优势在于由于它是单向链表，其内存消耗略低于 `list`（因为元素只需要知道下一个元素，而不需要上一个元素）。\n\n***\n\
  \n## DO\n\n**应当**在频繁插入或删除元素（特别是在中间）时，选择 `std::list` 而不是 `std::vector`——`vector`\
  \ 需要调整其内部缓冲区以允许数组语义，并会导致昂贵的拷贝操作，而 `list` 只需要连接或断开元素。\n\n**应当**记住，你可以使用 `push_front()`\
  \ 或 `push_back()` 成员方法分别在列表的开头或结尾插入元素。\n\n**应当**记住，对于要在如 `list` 等 STL 容器中类的类，要编写\
  \ `operator<` 和 `operator==`，以提供默认的排序或删除谓词。\n\n**应当**记住，你可以像任何其他 STL 容器类一样，使用 `list::size()`\
  \ 方法确定 `list` 中的元素数量。\n\n**应当**记住，你可以像任何其他 STL 容器类一样，使用 `list::clear()` 方法清空 `list`。\n\
  \n***\n\n## DON’T\n\n**不要**在仅在末端有频繁插入或删除且中间没有插入或删除的情况下使用列表；在这些情况下，`vector` 或 `deque`\
  \ 的速度会快得多。\n\n**不要**忘记在想要列表使用非默认标准进行 `sort()` 或 `remove()` 时，提供一个谓词函数。\n\n***\n\n\
  ## Summary\n\n本节课程教你了 `list` 的属性以及不同的 `list` 操作。你现在了解了一些最实用的 `list` 函数，并可以创建任何对象类型的\
  \ `list`。\n\n## Q&A\n\n**Q 为什么 list 提供了 `sort()` 和 `remove()` 等成员函数？**\n\n**A**\
  \ STL `list` 类被要求遵守这样一个属性：指向 `list` 中元素的迭代器无论元素在 `list` 自身的位置如何都应该保持有效。尽管 STL 算法也可以作用于\
  \ `list`，但 `list` 的成员函数确保了上述 `list` 属性得以维持，使得在排序之前指向 `list` 元素的迭代器在排序后仍然指向相同的元素。\n\
  \n**Q 你正在使用一个类型为 `CAnimal` 的类对象列表。为了让列表成员函数能够准确地处理它，`CAnimal` 应该定义哪些运算符？**\n\n**A**\
  \ 你必须为任何可用于 STL 容器的类提供默认的比较运算符 `==` 和默认的 `<` 运算符。\n\n**Q 如何在以下行中将关键字 `auto` 替换为显式类型声明：**\n\
  \n点击此处查看代码图片\n\n```\nlist<int> linkInts(10);  // 10 个整数的列表\nauto firstElement =\
  \ linkInts.begin();\n```\n\n**A** 你可以用以下显式类型声明替换 `auto`：\n\n点击此处查看代码图片\n\n```\n\
  list<int> linkInts(10);  // 10 个整数的列表\nlist<int>::iterator firstElement = linkInts.begin();\n\
  ```\n\n## Workshop\n\n工作坊包含测试题，帮助巩固你对所涵盖内容的理解，并提供练习以获得使用所知识的机会。在检查 附录 E 中的答案之前，尝试回答测试题和练习题，并确保在进入下一节之前理解了答案。\n\
