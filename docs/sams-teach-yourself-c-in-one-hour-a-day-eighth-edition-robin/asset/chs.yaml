  \ 到 `end()` 的范围，这实际上删除了整个列表。\n\n### 提示\n\n清空 STL 容器（如 `std::list`）最短且简单的方法是调用成员函数\
  \ `clear()`。\n\n因此，在列表 18.4 中，更简单的第 29 行应该是：\n\n```cpp\nlinkInts.clear();\n```\n\
  \n### 注意\n\n列表 18.4 在第 31 行演示了，可以使用列表方法 `size()` 确定 `std::list` 中元素的数量，这与 vector\
  \ 的对应方法非常相似。这种模式适用于所有的 STL 容器类。\n\n### 反转和排序列表中的元素\n\n`list` 有一个特殊属性：指向 `list` 中元素的迭代器即使元素发生了重排或插入了新元素等，仍然保持有效。为了保持这一重要属性完好无，`list`\
  \ 函数提供了 `sort()` 和 `reverse()` 作为成员方法，尽管 STL 已经提供了这些算法并能够对 `list` 类进行操作。这些算法的成员版本确保了当元素的相对位置被改变时，指向\
  \ `list` 中元素的迭代器不会失效。\n\n#### 使用 `list::reverse()` 反转元素\n\n`list` 具有一个成员函数 `reverse()`，该函数不接受参数，并能为程序员反转\
  \ `list` 中内容的顺序：\n\n点击此处查看代码图像\n\n```cpp\nlinkInts.reverse();  // 反转元素顺序\n```\n\n\
  `reverse()` 的用法在列表 18.5 中进行了演示。\n\n**列表 18.5** 反转列表中的元素\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <list>\n1: #include <iostream>\n2: using namespace std;\n3:\n4: template\
  \ <typename T>\n5: void DisplayContents(const T& container)\n6: {\n7:     for (auto\
