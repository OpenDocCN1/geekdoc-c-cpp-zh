  \ (`?:`) 进行条件执行\n\nC++ 有一种有趣的且强大的运算符，被称为条件运算符，它类似于一种紧凑的 `if-else` 结构。\n\n条件运算符也称为三元运算符，因为它接受三个操作数：\n\
  \n点击此处查看代码图片\n\n```cpp\n(条件表达式求值为 bool) ? expression1 如果真 : expression2 如果假;\n```\n\
  \n这种运算符可以紧凑地评估两个数字中的较大值，如下所示：\n\n点击此处查看代码图片\n\n```cpp\nint max = (num1 > num2)?\
  \ num1 : num2; // max 包含 num1 和 num2 中的较大值\n```\n\n列表 6.6 是使用运算符 (`?:`) 进行条件处理的演示。\n\
  \n\n\n\n\n```cpp\n12:      << num2 << \" is: \" << max << endl;\n13:\n14:    return\
  \ 0;\n15: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n输入两个数字\n\n365\n\n\
  -1\n\n365 和 -1 的较大值是: 365\n\n分析 ![Image](img/arrow.jpg)\n\n第 10 行是我们关注的代码。它包含一个紧凑的语句，用于判断输入的两个数字中哪一个更大。这一行是使用\
  \ `if-else` 实现以下逻辑的另一种方式：\n\n点击此处查看代码图像\n\n```cpp\nint max;\n\nif (num1 > num2)\n\
  \    max = num1;\nelse\n    max = num2;\n```\n\n因此，条件运算符节省了几行代码！然而，节省代码行不应该是首要任务。有些程序员倾向于使用条件运算符，而另人则不然。以易于理解的方式编写条件运算符至关重要。\n\
  \n### 应该 (DO)\n\n**应该**在 switch 表达式中使用枚举符来提高代码的可读性。\n\n**应该**记得处理 `default` 情况，除非被认为完全没有必要。\n\
  \n**应该**检查是否在无意中忘记在每个 `case` 语句中插入 `break`。\n\n### 不要 (DON’T)\n\n**不要**添加两个具有相同标签的\
  \ `case` 情况——这没有意义而且无法通过编译。\n\n**不要**通过包含包含不带 `break` 的 `case` 并依赖执行顺序来使你的 `case`\
  \ 语句复杂化。在未来，当你在不十分注意顺序的情况下移动 `case` 语句时，这会破坏代码/功能性。\n\n**不要**在使用条件运算符（`?:`）时使用复杂的条件或表达式。\n\
  \n###set (Tip)\n\nC++17 预计将引入使用 `if constexpr` 的条件编译，以及 `if` 和 `switch` 结构中的初始化器。在第\
  \ 29 节“向前展望。](ch29.html_ch29)”中学习更多这些特性。\n\n## 在循环中执行代码\n\n到目前，你已经看到如何让程序在某些变量包含不同值时产生不同的行为——例如在列表\
  \ 6.1 中，当用户按下 *m* 时我们执行乘法；否则执行加法。然而，如果用户不想让程序结束呢？如果他想执行另一个加法或乘法操作，或者再执行五次呢？这时你需要重复执行已有的代码。\n\
  \n这就是你需要编写循环的时候。\n\n### 使用 `goto` 的原始循环\n\n顾如名，`goto` 指令执行从代码中特定标记点继续。你可以用它重新执行某些语句。\n\
  \n`goto` 语句的语法为：\n\n点击此处查看代码图像\n\n```cpp\nSomeFunction()\n{\nStart: // 标签\n    CodeThatRepeats;\n\
  \    goto Start;\n}\n```\n\n你定义了一个名为 `Start` 的标签，并使用 `goto` 从该点开始重复执行，如列表 6.7 所示。除非你在给定一个特定情况下可能求为\
  \ `false` 的条件下调用 `goto`，或者除非重复的代码包含一个在特定条件下执行的 `return` 语句，否则 `goto` 命令与标签之间的代码将无限重复，并导致程序无法结束。\n\
  \n**列表 6.7** 使用 `goto` 询问用户是否想要重复计算\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5: Start:\n6:     int num1 = 0,\
  \ num2 = 0;\n7:\n8:     cout << \"Enter two integers: \" << endl;\n9:     cin >>\
  \ num1;\n10:    cin >> num2;\n11:\n12:     cout << num1 << \" x \" << num2 << \"\
  \ = \" << num1 * num2 << endl;\n13:     cout << num1 << \" + \" << num2 << \" =\
  \ \" << num1 + num2 << endl;\n14:\n15:     cout << \"Do you wish to perform another\
  \ operation (y/n)?\" << endl;\n16:     char repeat = 'y';\n17:     cin >> repeat;\n\
  18:     if (repeat == 'y')\n19:     goto Start;\n20:     cout << \"Goodbye!\" <<\
  \ endl;\n21:     return 0;\n22: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
