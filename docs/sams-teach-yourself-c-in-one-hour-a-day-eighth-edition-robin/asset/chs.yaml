  输出表明第 29 行使用的 `pop_back()` 函数通过删除插入到 `vector` 中的最后一个元素减少了 `vector` 中的元素数量。第 32 行再次调用\
  \ `size()` 证明了 `vector` 中的元素数量确实减少了一个，如输出所示。\n\n### 注意\n\n第 4–13 行的函数 `DisplayVector()`\
  \ 在列表 17.6 中采用了模板形式，与之相比，列表 17.3 中它只接受整数类型的 `vector`。这有助于我们将此模板函数复用于 `float` 类型的\
  \ `vector`（而不是 `int`）：\n\n点击此处查看代码图像\n\n```cpp\nvector <float> vecFloats;\nDisplayVector(vecFloats);\
  \ // 正常工作，作为一个泛型函数\n```\n\n`DisplayVector()` 的这种泛形式还支持任何类的 `vector`，只要该类具有一个 `cout`\
  \ 可以理解的返回值的运算符。\n\n### 理解尺寸和容量的概念\n\n`vector` 的 `size` 是存储在 `vector` 中的元素数量。`vector`\
  \ 的 `capacity` 是 `vector` 在重新分配内存以容纳更多元素之前，可能存储的元素总数。因此，`vector` 的 `size` 小于或等于其\
  \ `capacity`。\n\n你可以通过调用 `size()` 查询 `vector` 的元素数量：\n\n点击此处查看代码图像\n```cpp\ncout\
  \ << \"Size: \" << integers.size ();\n```\n\n或者通过调用 `capacity()` 查询其容量：\n\n点击此处查看代码图像\n\
  ```cpp\ncout << \"Capacity: \" << integers.capacity () << endl;\n```\n\n当 `vector`\
  \ 需要频繁重新分配内部数组的内存时，可能会导致一些性能问题。在很大程度上，这个问题可以通过使用成员函数 `reserve(number)` 来解决。`reserve()`\
  \ 的本质是增加为 `vector` 内部数组分配的内存量，以便在不需要重新分配内存的情况下容纳 `number` 个元素。根据 `vector` 中存储的对象的类型，减少重新分配的次数也可以减少对象拷贝的次数，从而节省性能。列表\
  \ 17.7 中的代码示例演示了 `size()` 和 `capacity()` 之间的区别。\n\n**列表 17.7** `size()` 和 `capacity()`\
  \ 的演示\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n#include <vector>\n\nint main\
  \ ()\n{\n    using namespace std;\n    // instantiate a vector object that holds\
  \ 5 integers of default value\n    vector <int> integers (5);\n\n    cout << \"\
  Vector of integers was instantiated with \" << integers.size() << \" elements\"\
  \ << endl;\n    cout << \"Capacity: \" << integers.capacity() << endl;\n\n    //\
  \ Insert the 6th element\n    integers.push_back (6);\n\n    cout << \"After inserting\
  \ the 6th element:\" << endl;\n    cout << \"Size: \" << integers.size() << endl;\n\
  \    cout << \"Capacity: \" << integers.capacity() << endl;\n\n    // Insert the\
  \ 7th element\n    integers.push_back (7);\n\n    cout << \"After inserting the\
  \ 7th element:\" << endl;\n    cout << \"Size: \" << integers.size() << endl;\n\
  \    cout << \"Capacity: \" << integers.capacity() << endl;\n\n    // Insert the\
  \ 8th element\n    integers.push_back (8);\n\n    cout << \"After inserting the\
  \ 8th element:\" << endl;\n    cout << \"Size: \" << integers.size() << endl;\n\
  \    cout << \"Capacity: \" << integers.capacity() << endl;\n\n    return 0;\n}\n\
