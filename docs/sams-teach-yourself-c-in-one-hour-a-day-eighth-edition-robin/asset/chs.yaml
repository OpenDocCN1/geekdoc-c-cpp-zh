  \ the Square of a Number, Area of a Circle, and Min of Two Numbers**\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: #include <string>\n2: using namespace std;\n\
  3:\n4: #define SQUARE(x) ((x) * (x))\n5: #define PI 3.1416\n6: #define AREA_CIRCLE(r)\
  \ (PI)*(r))\n7: #define MAX(a, b) ((a) > (b)) ? (a) : (b)\n8: #define MIN(a, b)\
  \ ((a) < (b)) ? (a) : (b)\n9:\n10: int main()\n11: {\n12:    cout << \"Enter an\
  \ integer: \";\n13:    int num = 0;\n14:    cin >> num;\n15:\n16:    cout << \"\
  SQUARE(\" << num << \") = \" << SQUARE(num) << endl;\n17:    cout << \"Area of a\
  \ circle with radius \" << num << \" is: \";\n18:    cout << AREA_CIRCLE(num) <<\
  \ endl;\n19:\n20:    cout << \"Enter another integer: \";\n21:    int num2 = 0;\n\
  22:    cin >> num2;\n23:\n24:    cout << \"MIN(\" << num << \", \" << num2 << \"\
  ) = \" << MIN(num, num2) << endl;\n25:    cout << \"MAX(\" << num << \", \" << num2\
  \ << \") = \" << MAX(num, num2) << endl;\n26:\n27:    return 0;\n28: }\n```\n\n\
  Output ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\nEnter an integer: 36\nSQUARE(36)\
  \ = 1296\nArea of a circle with radius 36 is: 4071.51\nEnter another integer: -101\n\
  MIN(36, -101) = -101\nMAX(36, -101) = 36\n\n\n\n\n\n请注意，宏对类型敏感，因此宏函数可能会导致问题。例如，`AREA_CIRCLE`\
  \ 理想情况下应该返回 `double` 的函数，这样你就能确定计算出的面积的返回值解析，并确保它与输入半径的性质无关。\n\n***\n\n#### 为什么需要这么多括号？\n\
  \n再次看一眼计算圆面积的宏：\n\n```cpp\n#define AREA_CIRCLE(r) (PI*(r)*(r))\n```\n\n这个计算在使用的括号数量上语法非常奇怪。相比之下，请参考第\
  \ 7 Lesson“用函数组织代码”中列表 7.1 里的 `Area()` 函数。\n\n```cpp\n// 函数定义（实现）\ndouble Area(double\
  \ radius)\n{\n    return Pi * radius * radius;  // 看，没有括号？\n}\n```\n\n那么，为什么你在宏中使用了过多的括号，而函数中相同的公式看起来大不相同？原因在于宏的评估方式——它是作为由预处理器支持的文本替换机制。\n\
  \n考虑去掉了大部分括号的宏：\n\n```cpp\n#define AREA_CIRCLE(r) (PI*r*r)\n```\n\n当你使用如下语句调用此宏时，会发生什么：\n\
  \n```cpp\ncout << AREA_CIRCLE (4+6);\n```\n\n这会被编译器展开为：\n\n```cpp\ncout << (PI*4+6*4+6);\
  \ // 与 PI*10*10 不等\n```\n\n因此，根据运算符优先级的规则（乘法在加法之前），编译器实际上这样评估面积的：\n\n```cpp\ncout\
  \ << (PI*4+24+6);  // 42.5664（这是错误的）\n```\n\n在没有括号的情况下，纯文本转换破坏了我们的编程逻辑！括号有助于避免这个问题：\n\
  \n```cpp\n#define AREA_CIRCLE(r) (PI*(r)*(r))\ncout << AREA_CIRCLE (4+6);\n```\n\
  \n替换后的表达式被编译器视为：\n\n```cpp\ncout << (PI*(4+6)*(4+6)); // PI*10*10，如预期的那样\n```\n\n\
  这些括号会自动导致准确面积的计算，使得你的宏代码独立于运算符优先级及其影响。\n\n### 使用宏 `assert` 验证表达式\n\n虽然在编程后立即测试每个代码路径是好的，但对于非常大的应用程序，这在物理上可能是可能的。然而，可以检查有效的表达式或变量值。\n\
  \n`assert` 宏允许你执行此操作。使用 `assert` 时需要包含 `<assert.h>`，语法如下：\n\n```cpp\nassert (求值为真或否的表达式);\n\
  ```\n\n使用 `assert()` 验证指针内容的示例是：\n\n```cpp\n#include <assert.h>\n\nint main()\n\
  {\n    char* sayHello = new char [25];\n    assert(sayHello != NULL); // 如果指针为 NULL，则抛出消息\n\
  \    // 其他代码\n    delete [] sayHello;\n    return 0;\n}\n```\n\n`assert()` 确保了你在指针无效时收到通知。为了演示起见，我将\
  \ `sayHello` 初始化为 `NULL`，在调试 模式下执行时，Visual Studio 立即弹出了你在图 14.1 中看到的屏幕。\n\n![Image](img/14fig01.jpg)\n\
  \n**图 14.1** 当检查指针有效性的 assert 失败时发生。\n\n因此，在 Microsoft Visual Studio 中实现的 `assert()`\
  \ 允许你点击“重试”（Retry）按钮返回应用程序，并且调用堆栈会指示哪一行失败了断言测试。这使得 `assert()` 成为一个方便的调试功能；例如，你可以使用\
  \ `assert` 验证函数的输入参数。这是非常推荐的，并有助于你从长期来看提高代码质量。\n\n***\n\n### 注意\n\n`assert()` 通常在发布（release）模式下被禁用，并且仅在大多数开发环境的调试（debug）构建中为你提供错误消息或信息。\n\
  \n此外，某些环境将其实现为函数而不是宏。\n\n***\n\n***\n\n### 警告\n\n由于 `assert` 不会进入发布版本，因此确保对程序运行至关重要的检查仍然被执行是重要的。\n\
  \n***\n\n***\n\n### 使用宏函数的优缺点\n\n宏允许你不分类型地重用某些函数。考虑来自列表 14.2 的以下行代码：\n\n```cpp\n\
  #define MIN(a, b) (((a) < (b)) ? (a) : (b\n```\n\n你可以在整数上使用此宏：\n\n```cpp\ncout <<\
  \ MIN(25, 10) << endl;\n```\n\n但你也可以在 `double` 上重用它：\n\n```cpp\ncout << MIN(0.1,\
  \ 0.2) << endl;\n```\n\n请注意，如果 `MIN()` 是一个普通函数，你将编写它的两个变体：接受 `int` 并返回 `int` 的 `MIN_INT()`，以及对\
  \ `double` 类型执行相同操作的 `MIN_DOUBLE()`。这种减少代码行数的优化是一个微小的优势，并诱导了一些程序员使用宏。这些宏在编译之前被展开，因此简单宏的性能优于普通函数调用。这是因为函数调用需要创建调用堆栈、传递参数等——这些管理开销往往超过了计算本身。\n\
  \n然而，宏不支持任何形式类型安全，这是一个很大的缺点。此外，调试复杂的宏也不容易。\n\n如果你需要编写类型无关但类型安全的泛型函数，你应该编写模板（template）而不是宏。这些将在下一节中解释。如果你需要提升性能，你可以调用该函数为\
  \ `inline`。\n\n你已经已经在列表 7.10 中介绍了使用 `inline` 关键字编程内联函数。\n\n\n\n\n\n**1:** 放置在墙内横梁下方的短段或块，用于分配其重量或压力（如门上方）\n\
  \n**2:** (1): 量规、图案或模具（如薄板或板），用作所制部件形状的引导 (2): 一种分子（如 DNA），作为生成另一个大大分子（如信使 RNA）的模式\
  \ b: 叠加层\n\n**3:** 建立或用作模式的某物\n\n最后一种定义可能接近 C++ 术语中 `template`（模板）一词的解释。C++ 中的模板允许你定义一种可以应用于不同类型对象的行为。这听起来与宏允许你所做的事情非常相似（参考用于确定两个数字中较大值的简单宏\
  \ `MAX`），唯一的区别在于，宏是不类型安全的，而模板是类型安全的。\n\n### 模板声明语法\n\n你通过使用 `template` 关键字后跟一个类型参数列表来开始模板的声明。该声明的格式如下：\n\
  \n点击此处查看代码图像\n\n```\ntemplate <parameter list>\n\ntemplate function / class declaration..\n\
  ```\n\n`template` 关键字标记了模板声明的开始，后面跟着模板参数列表。该参数列表包含 `typename` 关键字，它定义了模板参数 `objType`，使其成为模板实例化时对象\
  \ `type` 的占位符。\n\n点击此处查看代码图像\n\n```cpp\ntemplate <typename T1, typename T2 = T1>\n\
  \nbool TemplateFunction(const T1& param1, const T2& param2);\n\n// 一个模板类\n\ntemplate\
  \ <typename T1, typename T2 = T1>\n\nclass MyTemplate\n{\nprivate:\n   T1 member1;\n\
  \   T2 member2;\npublic:\n   T1 GetObj1() {return member1; }\n   // ... 其他成员\n};\n\
  ```\n\n你看到的是一个模板函数和一个模板类，它们都分别接受两个模板参数 `T1` 和 `T2`，其中 `T2` 已经被给定的默认类型为 `T1` 的类型。\n\
  \n### 模板声明的不同类型\n\n模板声明可以是：\n\n- ![Image](img/square.jpg) 函数的声明或定义\n- ![Image](img/square.jpg)\
  \ 类的声明或定义\n- ![Image](img/square.jpg) 模板类中成员函数或成员类的定义\n- ![Image](img/square.jpg)\
  \ 模板类静态数据成员的定义\n- ![Image](img/square.jpg) 嵌套在模板类中的类的静态数据成员的定义\n- ![Image](img/square.jpg)\
  \ 类或模板类成员模板的定义\n\n### 模板函数\n\n想象有一个函数可以调整自己适应不同类型的参数。使用模板语法就可以这种函数！让我们分析一个示例模板声明，它等同于之前讨论过的用于返回两个提供的参数中较大值的宏\
  \ `MAX`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate <typename objType>\n\nconst objType&\
  \ GetMax(const objType& value1, const objType& value2)\n{\n    if (value1 > value2)\n\
  \        return value1;\n    else\n        return value2;\n}\n```\n\n示例用法：\n\n点击此处查看代码图像\n\
  \n```cpp\nint num1 = 25;\n\nint num2 = 40;\n\nint maxVal = GetMax <int> (num1, num2);\n\
  \ndouble double1 = 1.1;\n\ndouble double2 = 1.001;\ndouble maxVal = GetMax <double>(double1,\
  \ double2);\n```\n\n注意在调用 `GetMax` 时使用的 `<int>` 细节。它实际上将模板参数 `objType` 定义为 `int`。之前的代码会导致编译器生成模板函数\
  \ `GetMax` 的两个版本，这些版本可以可视化为如下所示：\n\n点击此处查看代码图像\n\n```cpp\nconst int& GetMax(const\
  \ int& value1, const int& value2)\n{\n    //...\n}\n\nconst double& GetMax(const\
  \ double& value1, const double& value2)\n{\n    // ...\n}\n```\n\n然而，实际上，模板函数并不一定需要附带类型指定符。因此，以下函数调用工作得完全完美：\n\
  \n点击此处查看代码图像\n\n```cpp\nint maxVal = GetMax(num1, num2);\n```\n\n在这种情况下，编译器足够智能，可以理解模板函数是为整数类型调用的。然而对于模板类，你需要显式地指定类型，如\
  \ 列表 14.3 所示。\n\n**列表 14.3** 模板函数 `GetMax` 帮助评估两个提供的值中的较大值\n\n点击此处查看代码图像\n\n```cpp\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\ntemplate <typename\
  \ Type>\nconst Type& GetMax(const Type& value1, const Type& value2)\n{\n    if (value1\
  \ > value2)\n        return value1;\n    else\n        return value2;\n}\n\ntemplate\
  \ <typename Type>\nvoid DisplayComparison(const Type& value1, const Type& value2)\n\
  {\n    cout << \"GetMax(\" << value1 << \", \" << value2 << \") = \";\n    cout\
  \ << GetMax(value1, value2) << endl;\n}\n\nint main() {\n    int num1 = 25;\n  \
  \  int num2 = 40;\n    DisplayComparison(num1, num2);\n\n    double d1 = 1.1;\n\
  \    double d2 = 1.001;\n    DisplayComparison(d1, d2);\n\n    string name1(\"Jack\"\
  ), name2(\"John\");\n    DisplayComparison(name1, name2);\n\n    return 0;\n}\n\
  ```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\n```\nGetMax(101, 2011) = 2011\n\
  GetMax(3.14, 3.1416) = 3.14\nGetMax(Jack, John) = John\n```\n\n此示例包含两个模板函数：第 4 行到\
  \ 11 行的 `GetMax()`，它被第 13 行到 18 行的 `DisplayComparison()` 调用。`main()` 函数在第 23 行、26\
  \ 行和 29 行展示了同一个模板函数如何被重用于非常不同的数据类型：`integer`、`double` 和 `string`。这些模板函数不仅可以重用（就像它们的宏对应一样），而且更容易编程和维护，并且是类型安全的！\n\
  \n注意你也可以用显式类型调用 `DisplayComparison`：\n\n点击此处查看代码图像\n\n```cpp\nDisplayComparison<int>(num1,\
  \ num2);\n```\n\n然而，在调用模板函数时这样做是不必要的。你不需要指定模板参数类型，因为编译器可以自动推断。然而，在编写模板类时，你需要这样做。\n\
  \n\n\n\n\n[第 9 节] “[类与对象]”教过你类是编程单元，它们封装了某些属性以及操作这些属性的方法。属性通常是私有成员，例如 `class Human`\
  \ 中的 `int Age`。类是设计蓝图，而一个类在现实世界中的表示就是该类的对象。因此，“Tom”可以被看作 `class Human` 的一个对象，其属性\
  \ `Age` 的值为 15。显然，我们指的是年份。如果由于你应用程序特有的原因，要求将年龄存储为自出生以来的秒数，那么 `int` 可能就不够了。为了稳妥起见，你可能想使用\
  \ `long long`。这就是模板类（template classes）大显身用场的地方。模板类是 C++ 类的模板化版本。它们是“蓝图的蓝图”。在使用模板类时，你可以选择指定你为该类特化的“类型”。这使你能够创建某些模板参数\
  \ `Age` 为 `long long` 的类，另一些为 `int` 的类，还有一些 `Age` 为 `short` 类型整数的类。\n\n一个使用单个参数\
  \ `T` 来持有成员变量的简单模板类可以写如下：\n\n点击此处查看代码图片\n\n```cpp\ntemplate <typename T>\nclass\
  \ HoldVarTypeT\n{\nprivate:\n   T value;\npublic:\n   void SetValue (const T& newValue)\
  \ { value = newValue; }\n   T& GetValue() {return value;}\n};\n```\n\n变量 `value`\
  \ 的类型是 `T`，它是在模板被使用时分配的，即*实例化*（instantiated）时。现在让我们来看看这个模板类的示例用法：\n\n点击此处查看代码图片\n\
  \n```cpp\nHoldVarTypeT <int> holdInt; // 对 int 的模板实例化\nholdInt.SetValue(5);\ncout\
  \ << \"The value stored is: \" << holdInt.GetValue() << endl;\n```\n\n你使用了这个模板类来持有和检索\
  \ `int` 类型的对象；也就是说，`Template` 类是针对 `int` 类型的模板参数进行了实例化。同样，你可以使用同一个类以类似的方式处理字符字符串：\n\
  \n点击此处查看代码图片\n\n```cpp\nHoldVarTypeT <char*> holdStr;\nholdStr.SetValue(\"Sample\
  \ string\");\ncout << \"The value stored is: \" << holdStr.GetValue() << endl;\n\
  ```\n\n因此，模板类定义了一种类模式，并帮助在模板可能实例化的不同数据类型上实现该模式。\n\n***\n\n**提示**\n\n模板类可以使用除 `int`\
  \ 等简单类型或标准库提供的类以外的类型进行实例化。你可以使用自己定义的类来实例化模板。例如，当你将定义模板类 `HoldVarTypeT` 的代码添加到 第\
  \ 9 节 中的 列表 9.1 中时，你将通过在 `main()``（此处应为 `main()`）后面添加以下代码为 `class Human` 实例化模板：\n\
  \n点击此处查看代码图片\n\n```cpp\nHoldVarTypeT<Human> holdHuman;\nholdHuman.SetValue(firstMan);\n\
  holdHuman.GetValue().IntroduceSelf();\n```\n\n### 使用多个参数声明模板\n\n模板参数列表可以扩展，以声明多个用逗号隔开的参数。因此，如果你想声明一个泛型类来持有一对类型可能不同的对象，你可以使用如下示例所示的结构来实现（该示例显示了一个带有两个模板参数的模板类）：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate <typename T1, typename T2>\nclass HoldsPair\n{\n\
  private:\n    T1 value1;\n    T2 value2;\npublic:\n    // 初始化成员变量的构造函数\n   HoldsPair\
  \ (const T1& val1, const T2& val2)\n   {\n       value1 = val1;\n       value2 =\
  \ val2;\n   };\n   // ... 其他成员函数\n};\n```\n\n在这个例中，`class HoldsPair` 接受两个命名为 `T1`\
  \ 和 `T2` 的模板参数。正如你看到的，我们可以使用这个类来持有两个相同类型或不同类型的对象：\n\n点击此处查看代码图片\n\n```cpp\n// 将\
  \ int 和 double 配对的模板实例化\nHoldsPair <int, double> pairIntDouble (6, 1.99);\n// 将\
  \ int 和 int 配对的模板实例化\nHoldsPair <int, int> pairIntDouble (6, 500);\n```\n\n### 使用默认参数声明模板\n\
  \n我们可以修改之前的 `HoldsPair <...>` 版本，将 `int` 声明为默认模板参数。\n\n点击此处查看代码图片\n\n```cpp\ntemplate\
  \ <typename T1=int, typename T2=int>\nclass HoldsPair\n{\n // ... 方法声明\n};\n```\n\
  \n这在构造上与定义默认参数值的函数相似，不同之处在于在这种情况下我们定义的是类型。`HoldsPair` 的第二次用法因此可以简化为：\n\n点击此处查看代码图片\n\
  \n```cpp\n// 默认类型：int 与 int\nHoldsPair <> (6, 500);\n```\n\n### 模板 `HoldsPair`\n\
  \n现在是时候进一步开发目前为止的 `HoldsPair` 版本了。看看 列表 14.4。**列表 14.4** 具有成员属性对的模板类\n\n点击此处查看代码图片\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\n// 默认参数：int & double\ntemplate\
  \ <typename T1=int, typename T2=double>\nclass HoldsPair\n{\nprivate:\n    T1 value1;\n\
  \    T2 value2;\npublic:\n    HoldsPair(const T1& val1, const T2& val2) // 构造函数\n\
  \    : value1(val1), value2(val2) {}\n\n    // 访问函数\n    const T1 & GetFirstValue\
  \ () const\n    {\n        return value1;\n    }\n\n    const T2& GetSecondValue\
  \ () const\n    {\n        return value2;\n    }\n};\n\nint main ()\n{\n    HoldsPair<>\
  \ pairIntDouble (300, 10.99);\n    HoldsPair<short,const char*>pairShortStr(25,\"\
  Learn templates, C++\");\n\n    cout << \"The first object contains -\" << endl;\n\
  \    cout << \"Value 1: \" << pairIntDouble.GetFirstValue() << endl;\n    cout <<\
  \ \"Value 2: \" << pairIntDouble.GetSecondValue() << endl;\n\n    cout << \"The\
  \ second object contains -\" << endl;\n    cout << \"Value 1: \" << pairShortStr.GetFirstValue()\
  \ << endl;\n    cout << \"Value 2: \" << pairShortStr.GetSecondValue() << endl;\n\
  \n    return 0;\n}\n```\n\n***\n\n**输出** ![Image](img/arrow.jpg)\n\n点击此处查看代码图片\n\
  \n```\nThe first object contains -\nValue 1: 300\nValue 2: 10.99\nThe second object\
  \ contains -\nValue 1: 25\nValue 2: Learn templates, C++\n```\n\n**分析** ![Image](img/arrow.jpg)\n\
  \n这个简单的程序演示了如何声明模板类 `HoldsPair` 以持有一对类型取决于模板参数列表的值。第一行包含一个模板参数列表，定义了两个模板参数 `T1`\
  \ 和 `T2`，默认类型分别为 `int` 和 `double`。访问函数 `GetFirstValue()` 和 `GetSecondValue()` 可用于查询对象持有的值。注意\
  \ `GetFirstValue` 和 `GetSecondValue` 如何根据模板实例化语法进行调整以返回适当的对象类型。你成功地在 `HoldsPair`\
  \ 中定义了一种模式，可以利用该模式为不同的变量类型交付相同的逻辑。因此，模板增加了代码的复用性。\n\n\n\n\n模板类是类的蓝图，因此在它以某种形式被使用之前，它在编译器中并不真正存在。也就是说，就编译器而言，你定义了但没有使用的模板类仅仅是被直接忽略的代码。然而，一旦你通过像下面这样提供模板参数来*实例化*（instantiate）一个模板类，例如\
  \ `HoldsPair`：\n\n点击此处查看代码图片\n\n```\nHoldsPair<int, double> pairIntDbl;\n```\n\n\
  你正在指示编译器使用该模板为你创建一个类，并根据指定的为模板参数的类型（在本例中为 `int` 和 `double`）对其进行实例化。因此，在模板的情况下，*实例化*是指使用一个或多个模板参数创建特定类型的行为或过程。\n\
  \n另一方面，可能存在某些情况，要求你在模板被用特定类型实例化时，显式地定义模板的（不同的）行为。这就是为该类型对模板（或其行为）进行特化（specialize）的地方。当模板类\
  \ `HoldsPair` 在两个模板参数均为 `int` 类型时实例化时，其特化版本如下：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<>\
  \ class HoldsPair<int, int>\n{\n   // 此处为实现代码\n};\n```\n\n不用而说，特化模板的代码必须遵循模板定义。列表\
  \ 14.5 是模板特化的示例，展示了特化版本与它所特化的模板之间有多大差异。\n\n**列表 14.5** 展示了模板特化\n\n点击此处查看代码图片\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: template <typename\
  \ T1 = int, typename T2 = double>\n4: class HoldsPair\n5: {\n6: private:\n7:   \
  \  T1 value1;\n8:     T2 value2;\n9: public:\n10:     HoldsPair(const T1& val1,\
  \ const T2& val2) // 构造函数\n11:         : value1(val1), value2(val2) {}\n12:\n13:\
  \     // 访问函数\n14:     const T1 & GetFirstValue() const;\n15:     const T2& GetSecondValue()\
  \ const;\n16: };\n17:\n18: // 此处为 int & int 类型特化 HoldsPair\n19: template<> class\
  \ HoldsPair<int, int>\n20: {\n21: private:\n22:     int value1;\n23:     int value2;\n\
  24:     string strFun;\n25: public:\n26:     HoldsPair(const int& val1, const int&\
  \ val2) // 构造函数\n27:         : value1(val1), value2(val2) {}\n28:\n29:     const\
  \ int & GetFirstValue() const\n30:     {\n31:         cout << \"Returning integer\
  \ \" << value1 << endl;\n32:         return value1;\n33:     }\n34: };\n35:\n36:\
  \ int main()\n37: {\n38:     HoldsPair<int, int> pairIntInt(222, 333);\n39:    \
  \ pairIntInt.GetFirstValue();\n40:\n41:     return 0;\n42: }\n```\n\n输出 ![Image](img/arrow.jpg)\n\
  Returning integer 222\n\n分析 ![Image](img/arrow.jpg)\n\n显然，当你将列表 14.4 中 `HoldsPair`\
  \ 类的行为与此处的进行对比时，你会发现模板的行为显著不同。事实上，`GetFirstValue()` 函数在 `HoldsPair<int,int>` 的模板实例化中被修改过，也能显示输出。仔细观察第\
  \ 18 到 34 行的特化代码可以发现，该版本在第 24 行声明了一个字符串成员 `strFun`——而该成员在 `HoldsPair<>` 的原始模板定义中是缺失。事实上，原始模板甚至没有为访问函数\
  \ `GetFirstValue()` 和 `GetSecondValue()` 提供实现，但程序仍然可以编译。这是因为编译器仅需要考虑 `<int, int>`\
  \ 的模板实例化——而我们为此提供了一个完整的特化实现。因此，这个示例不仅展示了模板特化，还展示了模板代码如何根据其用法被考虑甚至被忽略。\n\n### 模板类与静态成员\n\
  \n我们学习了模板中的代码在用时何时为编译器存在，何时不存在。那么，模板类中的 `static` 成员函数又是怎样的呢？你在第 9 Lesson 中学习过，将类成员声明为\
  \ `static` 会导致成员在类的所有实例之间共享。模板类也是如此，不同在于 `static` 成员是在具有相同实例化的模板类对象之间共享。因此，模板类中的\
  \ `static` 成员 `X` 对于为 `int` 实例化的类的所有实例都是静态的。同样，`X` 对于为 `double` 实例化的类的所有实例也是静态的，且独立于\
  \ `int` 的其他模板实例化。换句话说，你可以想象为编译器在模板类中创建了两个版本的静态变量：用于 `int` 模板实例化的 `X_int` 和用于 `double`\
  \ 模板实例化的 `X_double`。列表 14.6 展示了这一点。\n\n**列表 14.6** 静态变量对模板类及实例的影响：点击此处查看代码图片\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: template <typename\
  \ T>\n4: class TestStatic\n5: {\n6: public:\n7:     static int staticVal;\n8: };\n\
  9:\n10: // 静态成员初始化\n11: template<typename T> int TestStatic<T>::staticVal;\n12:\n\
  13: int main()\n14: {\n15:     TestStatic<int> intInstance;\n16:     cout << \"\
  Setting staticVal for intInstance to 2011\" << endl;\n17:     intInstance.staticVal\
  \ = 2011;\n18:\n19:     TestStatic<double> dblnstance;\n20:     cout << \"Setting\
  \ staticVal for Double_2 to 1011\" << endl;\n21:     dblnstance.staticVal = 1011;\n\
  22:\n23:     cout << \"intInstance.staticVal = \" << intInstance.staticVal << endl;\n\
  24:     cout << \"dblnstance.staticVal = \" << dblnstance.staticVal << endl;\n25:\n\
  26:     return 0;\n27: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图片\nSetting\
  \ staticVal for intInstance to 2011\nSetting staticVal for Double_2 to 1011\nintInstance.staticVal\
  \ = 2011\ndblnstance.staticVal = 1011\n\n在第 17 行和第 21 行，你分别为 `int` 和 `double` 的实例化设置了\
  \ `staticVal`。输出表明编译器在两个静态成员中存储了两个不同的值。因此，编译器确保了特定类型模板实例化时静态变量的行为保持完好。\n\n注意\n模板类的静态成员实例化语法不应在列表\
  \ 14.6 的第 11 行被忽略。\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T> int TestStatic<T>::staticVal;\n\
  ```\n\n它遵循以下模式：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<template parameters> StaticType\n\
  ClassName<Template Arguments>::StaticVarName;\n```\n\n### 变量模板，也称为变参模板\n\n假设你想写一个增加两个值的泛型函数。模板函数\
  \ `Sum()` 就实现了这一点：\n\n点击此处查看代码图片\n\n```cpp\ntemplate <typename T1, typename T2,\
  \ typename T3>\nvoid Sum(T1& result, T2 num1, T3 num2)\n{\n    result = num1 + num2;\n\
  \    return;\n}\n```\n\n这很简单。但如果你被要求编写一个能够处理任意数量值（每个值作为参数传递）的单一函数，你需要在定义此类函数时使用*变量模板*。变量模板或变参模板自\
  \ 2014 年发布的 C++14 起就是 C++ 的一部分。列表 14.7 展示了在定义此类函数时使用变量模板的方法。\n\n\n\n\n# 列表 14.7\
  \ 使用变长模板的函数演示了可变参数\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include <iostream>\n1: using\
  \ namespace std;\n2:\n3: template <typename Res, typename ValType>\n4: void Sum(Res&\
  \ result, ValType& val)\n5: {\n6:     result = result + val;\n7: }\n8:\n9: template\
  \ <typename Res, typename First, typename... Rest>\n10: void Sum(Res& result, First\
  \ val1, Rest... valN)\n11: {\n12:     result = result + val1;\n13:     return Sum(result,\
  \ valN ...);\n14: }\n15:\n16: int main()\n17: {\n18:     double dResult = 0;\n19:\
  \     Sum (dResult, 3.14, 4.56, 1.1111);\n20:     cout << \"dResult = \" << dResult\
  \ << endl;\n21:\n22:     string strResult;\n23:     Sum (strResult, \"Hello \",\
  \ \"World\");\n24:     cout << \"strResult = \" << strResult.c_str() << endl;\n\
  25:\n26:     return 0;\n27: }\n```\n\n* * *\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \ndResult = 8.8111\n\nstrResult = Hello World\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n示例演示了我们使用变长模板定义的 `Sum()` 函数不仅可以处理第 19 行和第 23 行所示的完全不同的参数类型，还能处理数量变化的参数。第 19 行调用的\
  \ `Sum()` 使用四个参数，而第 23 行使用三个参数，其中一个是 `std::string`，另外两个是 `const char*`。在编译期间，编译器实际上会为适合该调用的正确\
  \ `Sum()` 创建代码，并递归执行，直到所有参数都被处理完毕。\n\n* * *\n\n### 注意\n\n你可能已经注意到前面的代码示例使用了省略号 `...`。C++\
  \ 中与模板一起使用的省略号告诉编译器，模板类或函数可以接受任意数量、任意类型的模板参数。\n\n* * *\n\n变长模板是 C++ 的一个强大扩展，适用于数学处理以及某些简单任务的完成。使用变长模板的程序员可以避免实现多个重载版本来执行相同任务的重复工作，创建出更短且更易维护的代码。\n\
  \n* * *\n\n### 注意\n\nC++14 为你提供了一个运算符，可以告诉传递给变长模板调用的模板参数数量。在列表 14.7 中，你可以在可以在 `Sum()`\
  \ 等函数内部使用该运算符，如下：\n\n点击此处查看代码图像\n\n```\nint arrNums[sizeof...(Rest)];\n\n// 数组长度使用\
  \ sizeof...() \n// 在编译时进行计算\n```\n\n你不能混淆 `sizeof...()` 和 `sizeof(Type)`。后者返回类型的大小，而前者返回发送给变长模板的模板参数个数。\n\
  \n* * *\n\n变长模板的支持也引入了对*元组（tuples）*的标准支持。`std::tuple` 是实现元组的类模板。它可以根据不同数量的成员及其类型进行实例化。可以使用标准库函数\
  \ `std::get` 单独访问这些元素。列表 14.8 演示了 `std::tuple` 的实例化和使用。\n\n## 列表 14.8 实例化与使用 `std::tuple`\n\
  \n点击此处查看代码图像\n\n* * *\n\n```\n0: #include <iostream>\n1: #include <tuple>\n2: #include\
  \ <string>\n3: using namespace std;\n4:\n5: template <typename tupleType>\n6: void\
  \ DisplayTupleInfo(tupleType& tup)\n7: {\n8:     const int numMembers = tuple_size<tupleType>::value;\n\
  9:     cout << \"Num elements in tuple: \" << numMembers << endl;\n10:     cout\
  \ << \"Last element value: \" << get<numMembers - 1>(tup) << endl;\n11: }\n12:\n\
  13: int main()\n14: {\n15:     tuple<int, char, string> tup1(make_tuple(101, 's',\
  \ \"Hello Tuple!\"));\n16:     DisplayTupleInfo(tup1);\n17:\n18:     auto tup2(make_tuple(3.14,\
  \ false));\n19:     DisplayTupleInfo(tup2);\n20:\n21:     auto concatTup(tuple_cat(tup2,\
  \ tup1)); //  tup2, tup1 的成员\n22:     DisplayTupleInfo(concatTup);\n23:\n24:   \
  \  double pi;\n25:     string sentence;\n26:     tie(pi, sentence) = tuple_cat(tup2,\
  \ tup1);\n27:     cout << \"Pi: \" << pi << endl;\n28:\n29:     return 0;\n30: }\n\
  ```\n\n\n\n\n\n编译器注册的抗议在第 6 行中编写。因此，`static_assert` 是 C++11 帮助你保护模板代码免受意外实例化影响的一种方式。\n\
  \n## 在实际 C++ 编程中使用模板\n\n模板的一个重要且强大的应用是标准模板库（STL）。STL 由一组模板类和函数组成，这些类和函数包含了通用工具类和算法。这些\
  \ STL 模板类允许你实现动态数组、列表和键值对容器，而算法（如 `sort`）则作用于这些容器并处理它们所包含的数据。\n\n你之前学到的模板语法知识将极大地帮助你使用在本书后续章节中详细介绍的\
  \ STL 容器和函数。对 STL 容器和算法有更深入的理解反过来也能帮助你编写出高效的 C++ 程序，使用 STL 经过测试且可靠的实现，并帮助你避免在样板代码细节上浪费时间。\n\
  \n### 应该做的（DO）\n\n- **务必**使用模板来实现通用概念。\n- **务必** 优先选择模板而不是宏。\n\n### 不要做的（DON'T）\n\
  \n- **不要**在编写模板函数和类时忘记使用 `const` 正确性原则。\n- **不要**忘记模板类中包含的静态成员对于该类的每个类型特化版本都是静态的。\n\
  \n### 总结\n\n在本节中，你学习了更多关于使用预处理器的细节。每当你运行编译器时，预处理器都会首先运行，并翻译诸如 `#define` 之类的指令。\n\
  \n预处理器执行文本替换，尽管在使用宏时这些操作可能会变得相当复杂。宏函数根据编译时传递给宏的参数提供复杂的文本替换。在宏中为每个参数加上括号是非常重要的，以确保发生正确的替换。\n\
  \n模板帮助你编写可重用的代码，为开发者提供了一种可以用于各种数据类型的模式。它们还能够实现对 `macros` 的类型安全替换。掌握了在本节中学到的模板知识后，你现在已经准备好学习使用\
  \ STL 了！\n\n### 问答（Q&A）\n\n**问：为什么我应该在头文件中使用包含保护符（inclusion guards）？**\n\n**答**\
  \ 使用 `#ifndef`、`#define` 和 `#endif` 的包含保护符可以防止头文件出现多次包含或递归包含的错误，在某些情况下它们还能加快编译。\n\
  \n**问：如果某个功能既可以用宏函数也可以用模板实现，我什么时候应该倾向于模板而不是宏？**\n\n**答** 理想情况下，你应该始终优先选择模板，因为模板允许通用且类型安全的实现。宏无法实现类型安全的实现，因此最好避免使用。\n\
  \n**问：在调用模板函数时我需要指定模板参数吗？**\n\n**答** 通常不需要，因为编译器可以根据函数调用中使用的参数为你推断出这一点。\n\n**问：对于给定的模板类，存在多少个静态变量实例？**\n\
  \n**答** 这完全取决于该模板类被实例化的类型数量。因此，如果你的类为 `int`、`string` 和自定义类型 `X` 进行了实例化，你可以预期会有三个静态变量实例——每个模板实例化对应一个。\n\
  \n### 工作坊（Workshop）\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习题让你获得使用所学知识的。在检查 附录 E 中的答案之前，尝试回答测验和练习题，并确保你理解了答案。\n\
  \n### 测验（Quiz）\n\n1. 什么是包含保护符（inclusion guard）？\n\n2. 考虑以下宏：\n\n```cpp\n#define\
  \ SPLIT(x) x / 5\n```\n\n如果用 20 调用它，结果是什么？\n\n3. 如果用 `10+10` 调用问题 2 中的 `SPLIT` 宏，结果是什么？\n\
  \n4. 你会如何修改 `SPLIT` 宏以避免错误的结果？\n\n### 练习（Exercises）\n\n1. 写一个用于两个数相乘的宏。\n\n2. 写练习\
  \ 1 中宏的模板版本。\n\n3. 为 `swap` 实现一个模板函数，用于交换两个变量。\n\n4. **错误修复**：你将如何改进以下用于计算数值四分之一的宏？\n\
  \n```cpp\n#define QUARTER(x) (x / 4)\n```\n\n5. 写一个简单的模板类，它持有通过类参数定义的数组。该类应具有操作元素的访问函数。\n\
  \n6. 写一个 `Display()` 模板函数，它可以接受不同数量和类型的参数，并显示它们。\n\n# 第三部分：学习标准模板库 (STL)\n\n# 第\
  \ 15 节：标准模板库简介\n\n简单来说，标准模板库（STL）是一组模板类和函数，它们为程序员提供了：\n\n- 用于存储信息的容器\n- 用于访问信息的迭代器\n\
  - 用于处理内容的算法\n\n在本节中，你将概述 STL 的这三个支柱。\n\n## STL 容器\n\n*容器*是用于存储数据的 STL 类。STL 提供了两种容器类型：\n\
  \n- 顺序容器\n- 关联容器\n\n除了这些，STL 还提供了称为*容器适配器*的类，它们是针对特定目的变体。\n\n### 顺序容器\n\n顾其名，这些是以顺序方式持有数据的容器，例如数组和列表。顺序容器的特点是插入速度快，但\
  \ `find` 操作较慢。\n\nSTL 顺序容器包括：\n\n- `std::vector`：像动态数组一样在末端增长。将 vector 想象成书架，你可以在一端添加或删除书籍。\n\
  - `std::deque`：类似于 `std::vector`，但允许在开头也插入或删除元素。\n- `std::list`：像双向链表一样工作。将其想象成链链，对象是链中的一个环。你可以在任何位置添加或删除环（即对象）。\n\
  - `std::forward_list`：类似于 `std::list`，但它是单向链表，允许仅向一个方向迭代。\n\n`std::vector` 类类似于数组并允许对元素进行随机访问；即，你可以根据位置（下标）使用下标运算符\
  \ (`[]`) 直接访问或操作 vector 中的元素。此外，STL `vector` 是一个动态数组，因此可以调整大小以适应应用程序的运行时需求。为了保持在给定位置时能够随机访问元素的属性，大多数\
  \ STL `vector` 实现将所有元素存储在连续的位置。因此，取决于所包含的对象类型，经常需要调整大小的 `vector` 可能会降低应用程序的性能。\n\
  \n\n\n\n\n你可以将 STL `list` 视为 STL 对普通链表的实现。虽然 `list` 中的元素不能像 STL `vector` 中的元素那样进行随机访问，但\
  \ `list` 可以将元素组织在非连续的内存区域中。因此，`std::list` 不存在 `vector` 在需要重新分配其内部数组时会面临的性能问题。STL\
  \ `list` 类在第 18 节“STL `list` 与 `forward_list`](#ch18.html_ch18)”中进行了详细讨论。\n\n###\
  \ 关联容器\n\n`关联容器`（Associative containers）是指以排序方式存储数据的容器——类似于字典。这导致了插入时间较慢，但在搜索方面具有显著优势。\n\
  \nSTL 提供的关联容器有：\n\n![Image](img/square.jpg) `std::set`——在具有对数复杂度的容器中，根据插入顺序进行排序并存储唯一值。\n\
  \n![Image](img/square.jpg) `std::unordered_set`——在具有近常数复杂度的容器中，根据插入顺序排序并存储唯一值。从\
  \ C++11 开始可用。\n\n![Image](img/square.jpg) `std::map`——在具有对数复杂度的容器中，根据其唯一的键排序并存储键值对。\n\
  \n![Image](img/square.jpg) `std::unordered_map`——在具有近常数复杂度的容器中，根据其唯一的键排序并存储键值对。从\
  \ C++11 开始可用。\n\n![Image](img/square.jpg) `std::multiset`——类似于 `set`。此外，支持存储多个具有相同值的项；也就是说，值不需要是唯一的。\n\
  \n![Image](img/square.jpg) `std::unordered_multiset`——类似于 `unordered_set`。此外，支持存储多个具有相同值的项；也就是说，值不需要是唯一的。从\
  \ C++11 开始可用。\n\n![Image](img/square.jpg) `std::multimap`——类似于 `map`。此外，支持存储键不需要唯一的键值对。\n\
  \n![Image](img/square.jpg) `std::unordered_multimap`——类似于 `unordered_map`。此外，支持存储键不需要唯一的键值对。从\
  \ C++11 开始可用。\n\n* * *\n\n注意\n\n在此处`复杂度`（Complexity）是指容器性能与其包含的元素数量之间的关系。因此，当我们谈论`常数复杂度`（constant\
  \ complexity）时（如 `std::unordered_map` 的情况），意味着容器的性能与其包含的元素数量无关。这种容器处理一千个元素的时间与处理百万个元素的时间相同。\n\
  \n`对数复杂度`（Logarithmic complexity）如 `std::map` 所示，表示性能与元素数量的对数成比例。这种容器处理百万个元素的时间将是处理一千个元素的两倍。\n\
  \n`线性复杂度`（Linear complexity）意味着性能与元素数量成正比。这种容器处理百万个元素的速度比处理一千个元素慢一千倍。\n\n对于给定的容器，不同操作的复杂度可能不同。也就是说，元素的插入复杂度可能是常数的，但搜索复杂度可能是线性的。因此，除了了解容器的功能外，了解它在不同操作下的表现也是选择正确容器的关键。\n\
  \n* * *\n\nSTL 容器的排序标准可以通过编写谓词函数进行自定义。\n\n* * *\n\n提示\n\n某些 STL 的实现还具有关联容器，如 `hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `std_multimap`。这些与标准支持的 `unordered_*` 容器类似。在某些场景下，`hash_*` 和 `unordered_*` 变体可能更元素搜索，因为它们提供了常数时间操作（独立容器中的元素数量）。通常，这些容器还提供与其标准版本相同的公共方法，因此同样易用。\n\
  \n使用符合标准的变体将使代码更容易在平台和编译器之间迁移，因此应优先考虑。此外，标准容器性能的对数级下降可能不会显著影响应用程序。\n\n* * *\n\n\
  ### 容器适配器\n\n`容器适配器`（Container adapters）是顺序和关联容器的变体，其功能有限，旨在实现特定的目的。主要的适配器类有：\n\n\
  ![Image](img/square.jpg) `std::stack`——以后进先出（LIFO）方式存储元素，允许在顶部插入（push）和弹出（pop）。\n\
  \n![Image](img/square.jpg) `std::queue`——先进先出（FIFO）方式存储元素，允许按照插入顺序移除第一个元素。\n\n![Image](img/square.jpg)\
  \ `std::priority_queue`——按排序顺序存储元素，使得值评估为最高的元素始终位于队列首。\n\n这些容器在第 24 节“适配器容器：栈与队列`](ch24.html_ch24)”中进行了详细讨论。\n\
  \n### STL 迭代器\n\n迭代器最简单的例子是指针。给定一个指向数组第一个元素的指针，你可以对其递增以指向下一个元素，或者在许多情况下，操作该位置的元素。\n\
  \nSTL 中的迭代器是模板类，在某些方面是指针的泛化。这些模板类为程序员提供了一个句柄，用于处理 STL 容器并对其进行操作。注意，操作可以是模板函数，而迭代器则是桥梁，允许这些模板函数与模板类形式容器以一致且无缝的方式工作。\n\
  \nSTL 提供的迭代器可以大致分类为：\n\n![Image](img/square.jpg) `输入迭代器`（Input iterator）——可以通过解引用引用对象。例如，对象可以在容器中。最纯的输入迭代器只保证读取访问。\n\
  \n![Image](img/square.jpg) `输出迭代器`（Output iterator）——允许程序员向容器写入数据。最严格的输出迭代器只保证写入访问。\n\
  \n上述列表的基础迭代器类型进一步细分为：\n\n![Image](img/square.jpg) `前向迭代器`（Forward iterator）——输入和输出迭代器的细化，允许输入和输出。前向迭代器可以是常量的，允许对指向的对象进行只读访问，否则允许读写操作，使其变为可变的。前向迭代器通常用于单链表。\n\
  \n![Image](img/square.jpg) `双向迭代器`（Bidirectional iterator）——前向迭代器的细化，也可以递减以向后移动。双向迭代器通常用于双向链表。\n\
  \n![Image](img/square.jpg) `随机访问迭代器`（Random access iterators）——通来说，它是双向迭代器概念的细化，允许加减偏移量，或者允许一个迭代器减去另一个以找到容器中两个对象之间的相对间距或距离。随机迭代器通常用于数组。\n\
  \n* * *\n\n注意\n\n在实现层面，*细化*（refinement）可以视为*继承*（inheritance）或*特化*（specialization）。\n\
  \n* * *\n\n### STL 算法\n\n\n\n\n\n查找、排序、反转等操作是标准的编程需求，不应要求程序员重新编写实现来实现支持这些功能。这正是\
  \ STL 以 STL 算法的形式提供这些函数的原因，它们通过迭代器与容器良好配合，帮助程序员满足一些最常见的需求。\n\n一些常用的 STL 算法有：\n\n\
  ![Image](img/square.jpg) `std::find`——帮助在集合中查找一个值。\n\n![Image](img/square.jpg) `std::find_if`——帮助根据特定的用户定义谓词在集合中查找一个值。\n\
  \n![Image](img/square.jpg) `std::reverse`——反转一个集合。\n\n![Image](img/square.jpg) `std::remove_if`——帮助根据用户定义的谓词从集合中移除某项。\n\
  \n![Image](img/square.jpg) `std::transform`——帮助将用户定义的转换函数应用于容器中的元素。\n\n这些算法是 `std`\
  \ 命名空间中的模板函数，需要包含标准头文件 `<algorithm>`。\n\n### 使用迭代器的容器与算法之间的交互\n\n让我们通过一个示例来看迭代器如何无缝地连接容器和\
  \ STL 算法。显示 15.1 中的程序使用了 STL 顺序容器 `std::vector`（类似于动态数组）来存储一些整数，然后使用算法 `std::find`\
  \ 在集合中查找其中一个。注意迭代器是如何形成连接两者的桥梁的。不要担心语法或功能的复杂性。`std::vector` 等容器和 `std::find` 等算法分别在\
  \ 第 17 节 “STL 动态数组类”和 第 23 节 “STL 算法”中进行了详细讨论。如果你觉得这部分复杂，可以暂时跳过该节。\n\n**列表 15.1**\
  \ 在 Vector 中查找元素及其位置\n\n点击此处查看代码图片\n\n***\n\n```cpp\n1: #include <iostream>\n2:\
