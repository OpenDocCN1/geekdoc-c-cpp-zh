  \ `main()` 函数能够通过名为 `realFreak` 的派生类 `class Platypus` 对象调用这些各个基类的三个特征。除了调用继承自 `Mammal`、`Bird`\
  \ 和 `Reptile` 的函数外，`main()` 在第 45 行还调用了 `Platypus::Swim()`。该程序演示了多重继承的语法，展示了派生类如何暴露其多个基类的所有公共属性（在本例中为公共成员函数）。\n\
  \n### 使用 `final` 避免继承\n\n从 C++11 开始，编译器支持 `final` 饰符。它用于确保声明为 `final` 的类不能作为基类使用。例如在列表\
  \ 10.10 中，`class Platypus` 代表一个演化完全的物种。因此，你可能希望确保该类是 `final` 的，从而阻止所有继承它的可能性。从列表\
  \ 10.10 中截取并声明为 `final` 的 `class Platypus` 版本如下所示：\n\n点击查看代码图像\n\n```cpp\nclass\
  \ Platypus final: public Mammal, public Bird, public Reptile\n{\npublic:\n    void\
  \ Swim()\n    {\n        cout << \"Platypus: Voila, I can swim!\" << endl;\n   \
  \ }\n};\n```\n\n除了防止继承外，`final` 还可以防止“是一个...”的关系。这将在下一节中讨论。\n\n*（注：提供的文本在结尾似乎有截断或重复短语；我已根据指令清理了可用内容。）*\n\
