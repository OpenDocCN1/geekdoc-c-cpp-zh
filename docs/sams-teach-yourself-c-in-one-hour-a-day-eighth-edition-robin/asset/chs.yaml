  \ 2011\n\n分析 ![Image](img/arrow.jpg)\n\n在第 11、14 和 16 行，vector 被用于像使用静态数组一样样通过 vector\
  \ 的下标运算符 (`[]`) 访问和分配元素。该下标运算符接受的元素索引与静态数组一样是从 0 开始的。注意第 15 行的 `for` 循环是如何编写的，通过与\
  \ `vector::size()` 比较来确保索引不会越 vector 的边界。\n\n### 注意事项\n\n使用 `[]` 访问 vector 中的元素面临着与访问数组元素相同的危险；即你不应越界容器的边界。如果你使用下标运算符\
  \ (`[]`) 访问超出边界的 vector 元素，该操作的结果将是未定义的（可能会发生任何情况）。\n\n更安全的替代方案是使用 `at()` 成员函数：\n\
  \n点击此处查看代码图像\n```cpp\n// 获取位置 2 的元素\ncout << integers.at(2);\n```\n`at()` 版本会在运行时检查\
  \ `size()`，如果越界会抛出异常。下标运算符 (`[]`) 在如上示例所示是不安全的。\n\n### 使用指针语义访问 Vector 中的元素\n\n\
  你也可以通过迭代器使用指针语义来访问 vector 中的元素，如 列表 17.5 所示。\n\n**列表 17.5 使用指针语义访问 vector 中的元素（迭代器）**\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include <vector>\n2:\n3: int\
  \ main ()\n4: {\n5:    using namespace std;\n6:    vector <int> integers{ 50, 1,\
