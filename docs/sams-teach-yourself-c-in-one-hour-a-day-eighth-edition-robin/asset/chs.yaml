  \n在本节中，你将学习\n\n- ![Image](img/square.jpg) 如何让你的 C++ 充分利用处理器的能力\n- ![Image](img/square.jpg)\
  \ 线程与多线程\n- ![Image](img/square.jpg) C++ 编程的最佳实践\n- ![Image](img/square.jpg) C++17\
  \ 预期的新功能\n- ![Image](img/square.jpg) 超本书提升 C++ 技能\n\n### 今天的处理器有什么不同？\n\n在最近之前，计算机通过使用处理速度快的处理器来变快，处理速度以赫兹（Hz）、兆赫（Mhz）或吉赫（GHz）衡量。例如，Intel\
  \ 8086（参见 图 29.1）是 1978 年推出的 16 位微处理器，时钟频率约为 10MHz。\n\n那个时代，处理器以规律的速度显著变快，你的 C++\
  \ 应用程序也是如此。人们很容易依靠“等待游戏”来利用改进的硬件性能并以此提高软件的响应速度。虽然今天的处理器正在变快，但真正的创新在于它们部署的核心数量。在编写本书时，即使流行的智能手机也配备了四核\
  \ 64 位处理器，其处理能力超过了十年前的台式电脑。\n\n\n\n\n你可以将多核处理器想象为一个单一芯片，其内部并行运行着多个处理器。每个处理器都有自己的自己的\
  \ L1 缓存，并且可以独立于其他处理器工作。\n\n通过更快的处理器来提高应用程序的速度是合逻辑的。那么处理器中的多个核心是如何提供帮助的呢？显然，每个核心都具备并行运行应用程序的能力，但除非你编写了程序来利用这种新能力，否则并不一定会让你的应用程序运行得更快。你目前所看到的这类单线程\
  \ C++ 在利用多核处理能力方面可能错失了机会。这些应用程序在单个线程中运行，因此只在一个核心上运行，如图 29.2 所示。\n\n![Image](img/29fig02.jpg)\n\
  \n**图 29.2** 多核处理器中的单线程应用程序。\n\n如果你的应用程序按串行执行所有用例，操作系统（OS）可能会只给它与队列中其他应用程序相同的时间，而且它将只占用处理器上的一个核心。换句话说，你的应用程序在多核处理器上的运行方式与过去多年来完全一样。\n\
  \n## 如何更好地使用多核\n\n关键在于创建多线程的应用程序。每个线程并行运行，允许操作系统让线程运行在多个核心上。尽管详细讨论线程和多线程超出了本书的范围，但我可以简单介绍一下这个主题，为你迈向高性能计算打下基础。\n\
  \n### 什么是线程？\n\n你的应用程序代码始终运行在线程中。线程是一个同步执行实体，线程中的语句一个接一个运行。`main()` 内部的代码被认为执行应用程序的主线程。在这个主线程中，你可以创建可以并行运行的新线程。这种由主线程以及一个或多个并行运行的线程组成的应用程序被称为多线程应用程序。\n\
  \n操作系统规定了如何创建线程，你可以通过直接调用操作系统提供的 API 来创建线程。\n\n> 提示：C++ 自 C++11 起规定了线程函数，它们可以替你调用操作系统\
  \ API，使得你的多线程应用程序更具移植性。\n\n如果你计划只为一种操作系统编写应用程序，请检查该操作系统关于创建多线程应用程序的 API。\n\n> 注意：创建线程的实际操作是特定于系统的功能。C++\
  \ 试图通过头文件 `<thread>` 中的 `std::thread` 为你提供一种平台无关抽象。\n\n如果你是为一个平台编写代码，那么直接使用特定于系统的线程函数会更好。\n\
  \n如果你在 C++ 应用程序中需要可移植线程，请查看 [www.boost.org](http://www.boost.org)  Boost Thread\
  \ 库。\n\n### 为什么要编写多线程应用程序？\n\n多线程用于需要并行执行某项活动多次应用程序。想象一下，你是 10,000 名用户之一，在某一时刻正在\
  \ Amazon 门户网站进行购买。Amazon 的 Web 服务器显然无法同时让 9,999 名用户等待。Web 服务器所做的创建多个线程，同时为多个用户服务。如果\
  \ Web 服务器运行在多核处理器或多处理器云上，线程可以充分利用可用基础设施的优势，并为用户提供最佳性能。\n\n多线程的另一个常见示例是除了与用户交互外还执行某些任务的应用程序，例如通过进度条。此类应用程序通常被分为显示和更新用户界面并接受用户输入的“用户界面线程”（User\
  \ Interface Thread），以及在后台执行工作的“工作线程”（Worker Thread）。磁盘碎片工具就是这样一种应用程序。当你按下开始按钮后，会创建一个开始扫描和碎片整理的工作线程。同时，用户界面线程会显示进度，并提供取消碎片整理的选项。注意，为了让用户界面线程显示进度，执行整理的工作线程必须定期通信该进度。同样，为了在你取消时停止工作线程，用户界面线程也需要通信该信息。\n\
  \n> 注意：多线程应用程序通常需要线程之间相互“对话”，以便应用程序能够作为一个整体运行（而不是一组互不顾及、各行其事的失控线程）。\n\n顺序同样重要。你不希望用户界面线程在碎片整理的工作线程结束之前就结束。存在一个线程需要等待另一个线程的情况。例如，从数据库读取的线程应该等待执行写入的线程完成。\n\
  \n这种让线程等待另一个线程的行为被称为 `thread synchronization`（线程同步）。\n\n### 线程如何事务数据？\n\n线程可以共享变量。线程可以访问全局数据。创建线程时可以带有一个指向共享对象（包含数据的\
  \ `struct` 或 `class`）的指针，如图 29.3 所示。\n\n![Image](img/29fig03.jpg)\n\n**图 29.3**\
  \ 共享数据的工作线程和用户界面线程。\n\n不同的线程可以通过访问或写入存储在内存某个位置的数据进行通信，该位置可以被它们共同访问因此是共享的。在碎片整理的示例中，工作线程知道进度而用户界面线程需要被告知，工作线程可以不断存储百分比进度，用户界面线程使用其进行显示。\n\
  \n虽然这是一个简单的案例——一个线程创建信息，另一个线程消耗信息。如果多个线程对同一个位置进行读写操作会发生什么呢？某些线程在其他线程尚未完成写入时就可能开始读取数据。这会导致相关数据的完整性将受到破坏。\n\
  \n这就是为什么线程需要同步的原因。\n\n### 使用互斥锁和信号量同步线程\n\n线程是操作系统级别的实体，你用于同步它们的对象也是由操作系统提供的。大多数操作系统都提供了\
  \ `semaphores`（信号量）和 `mutexes`（互斥锁）来执行线程同步。\n\n你使用互斥锁（一种互斥同步对象）来确保一次只有一个线程访问一段代码。换句话说，互斥锁用于限定一段代码，线程在该处等待直到当前正在执行该代码的另一个线程完成并释放互斥锁。下一个线程获取互斥锁，完成工作，然后释放它。C++\
  \ 自 C++11 起通过头文件 `<mutex>` 提供了 `std::mutex` 类的互斥锁实现。\n\n使用信号量，你可以控制执行一段代码的线程数量。允许一次只有一个线程访问的信号量也称为二进制信号量。\n\
  \n### 多线程引起的问题\n\n多线程需要良好的线程间同步，但当这种同步无效有效（即：有 Bug）时，可能会导致许多个不眠之夜。多线程应用程序面临的最两个常见问题如下：\n\
  \n![Image](img/square.jpg) **竞态条件**——两个或多个线程尝试写入同一份数据。谁胜出？该对象的状态是什么？\n\n![Image](img/square.jpg)\
  \ **死锁**——两个线程互相等待对方完成，导致两者都处于“等待”状态。你的应用程序挂起了。\n\n通过良好的同步可以避免竞态条件。通常，当线程允许写入共享对象时，你必须格外小心确保\n\
  \n\n\n\n\n![Image](img/square.jpg) 同时间只允许一个线程写入。\n\n![Image](img/square.jpg) 在写入线程完成之前，不允许任何线程读取该对象。\n\
  \n你可以通过确保在任何情况下都不会两个线程互相等待来避免死锁。你可以选择让一个主线程来同步工作线程，或者通过编写程序使任务在线程之间进行分布，从而产生清晰的负载均衡。线程\
  \ A 可以等待 B，但 B 永远不应该等待 A。\n\n编写多线程应用程序本身就是一门专业技能。因此，详细向你解释这个有趣且令人兴奋的话题已超出了本书的范围。你应当查阅关于该主题的大量在线文档，或者通过实践编程来学习多线程。一旦你掌握了它，面对未来发布的多核处理器，你将能够自动地让你的\
  \ C++ 应用程序处于优化状态。\n\n## 编写出色的 C++ 代码\n\n自最初被构思以来，C++ 不仅发生了巨大的演变，主要编译器制造商的标准化工作以及工具和函数的可用也帮助你编写紧凑整洁的\
  \ C++ 代码。编写可读且可靠的 C++ 应用程序是非常容易的。\n\n以下是帮助你创建良好的 C++ 应用程序的最佳实践列表：\n\n![Image](img/square.jpg)\
  \ 给你的变量起有意义的名字（对他人也对你而言）。多花几秒钟给变量起更好的名字是值得的。\n\n![Image](img/square.jpg) 始终初始化如\
  \ `int`、`float` 等变量。\n\n![Image](img/square.jpg) 始终将指针值初始化为 `NULL` 或有效地址——例如由运算符\
  \ `new` 返回的地址。\n\n![Image](img/square.jpg) 使用数组时，永远不要越数组缓冲区的边界。这被称为缓冲区溢出，可能会被用作安全漏洞。\n\
  \n![Image](img/square.jpg) 不要使用 `char*` 字符串缓冲区或如 `strlen()` 和 `strcpy()` 等函数。`std::string`\
  \ 更安全，并提供了许多实用的工具方法，包括帮助你查找长度、复制和追加的方法。\n\n![Image](img/square.jpg) 仅在你确定它将包含的元素数量时才使用静态数组。\n\
  \n如果你不确定，请选择如 `std::vector` 等动态数组。\n\n![Image](img/square.jpg) 在声明和定义以非 POD（纯旧数据）类型作为输入的函数时，考虑将参数声明为引用参数，以避免在调用函数时产生不拷贝步骤。\n\
  \n![Image](img/square.jpg) 如果你的类包含原始指针成员（或多个成员），请考虑在拷贝或赋值时如何管理内存资源的所有权。也就是说，考虑编写拷贝构造函数和拷贝赋值运算符。\n\
  \n![Image](img/square.jpg) 在编写管理动态数组或类似对象的工具类时，记住编写移动构造函数和移动赋值运算符以获得更好的性能。\n\n![Image](img/square.jpg)\
  \ 记住让你的代码符合 `const` 规范。一个 `get()` 函数理想情况下不应该能够修改类的成员，因此它应该是 `const` 的。同样地，函数参数应该是\
  \ `const` 引用，除非你想改变它们所包含的值。\n\n![Image](img/square.jpg) 避免使用原始指针。尽可能选择合适的智能指针。\n\
  \n![Image](img/square.jpg) 在编写工具类时，花精力支持所有能让消费和使用该类变得容易的运算符。\n\n![Image](img/square.jpg)\
  \ 在有可选的情况下，选择模板版本而非宏。模板是类型安全且泛型的。\n\n![Image](img/square.jpg) 当编写一个将被容器（如 vector\
  \ 或 list）收集，或用作 map 中的键元素使用的类时，记住支持 `operator<`，这将有助于定义默认排序准则。\n\n![Image](img/square.jpg)\
  \ 如果你的 lambda 函数变得太大，你可能应该考虑将其转换为一个函数对象——即一个以 `operator()` 作为仿演算的类，这样它是可复用的且具有单一的维护点。\n\
  \n![Image](img/square.jpg) 永远不要认为运算符 `new` 的成功理所当然。执行资源分配的代码应该总是异常安全的——封装在 `try`\
  \ 内部并带有相应的 `catch()` 块。\n\n![Image](img/square.jpg) 永远不要在析构函数中 `throw`。\n\n这不是一个详尽的列表，但它涵盖了一些帮助你编写良好且可维护的\
  \ C++ 代码的最要点。\n\n## C++17：预期特性\n\nC++ 的伟大之处之一是标准委员会非常活跃并不断改进这门语言。就像它的前身 C++11 一样，C++17\
  \ 预计将为语言带来下一波重大新特性。让我们学习一些最有可能在 2017 年新标准正式通过时进入 C++ 的特性。\n\n> **注意**\n: 在接下来的页面中讨论的特性可能会进入标准，但目前还不是标准的一部分——你喜喜欢的编译器可能部分支持某些特性，而不支持全部。\n\
  > 此外，虽然不太可能但并非不可能，C++17 的最终版本可能不支持这里引入的所有特性，尽管在编写本书时预计它是支持的。\n\n### `if` 和 `switch`\
  \ 支持初始化\n\n这是对 `if` 和 `switch` 语句语法的一个微小但重要的扩展，可以表示为\n\n点击此处查看代码图\n\n```cpp\nif\
  \ (initializer; condition) {\n    // 如果条件为真则执行语句\n```\n\n或者\n\n点击此处查看代码图\n\n```cpp\n\
  switch (initializer; condition) {\n    // 分支\n}\n```\n\n在 `initializer` 中声明的变量在\
  \ `if` 语句结束时被销毁。当应用于 示例 20.3 中的代码时：\n\n点击此处查看代码图\n\n```cpp\nauto pairFound = mapIntToStr.find(key);\n\
  if (pairFound != mapIntToStr.end()) {\n    cout << \"Key \" << pairFound->first\
  \ << \" points to: \";\n    cout << pairFound->second << endl;\n}\n```\n\n该特性将其改进为\n\
  \n点击此处查看代码图\n\n```cpp\nif (auto pairFound = mapIntToStr.find(key); pairFound !=\
  \ mapIntToStr.end()) {\n    cout << \"Key \" << pairFound->first << \" points to:\
  \ \";\n    cout << pairFound->second << endl;\n}\n```\n\n这不仅仅减少了一行代码。它确保了 `if` 块需要的变量\
  \ `pairFound` 在块之外不可，限制了作用域。此外，如果你复制这个改进后的 `if` 块，你就完整获得了所需的逻辑。\n\n### 拷贝消除保证\n\n\
  当你将变量初始化为函数的返回值时，编译器可能会在初始化变量 `num` 之前为函数 `ReturnInt()` 返回的整数创建一个临时拷贝：\n\n```cpp\n\
  int num = ReturnInt();\n```\n\nC++17 要求编译器消除这种临时拷贝；即避免这种拷贝。\n\n### `std::string_view`\
  \ 避免分配开销\n\n考虑一个接受 `std::string` 作为参数的函数：\n\n点击此处查看代码图\n\n```cpp\nvoid DisplayString\
  \ (const std::string& strIn) {\n    cout << strIn << endl;\n}\n```\n\n当使用字符串字面量调用时，字符串字面量\
  \ `“Hello World!”` 首先转换为临时 `std::string` 供函数 `DisplayString()` 使用：\n\n点击此处查看代码图\n\
  \n```cpp\nDisplayString(\"Hello World!\");\n```\n\n这种临时转换是一种性能开销，通过改用 `std::string_view`\
  \ 可以避免。\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nvoid DisplayString (std::string_view& strIn)\n\
  {\n    cout << strIn << endl;\n}\n```\n\n当字符串字面量传递给接受 `std::string_view` 作为参数的函数时，不会产生分配开销。\n\
  \n### `std::variant` 作为 `union` 的类型安全替代方案\n\n`union` 在第 9 节 “类与对象”中进行了了解释。`union`\
  \ 的问题之一是它允许将其内容被解释为 `union` 支持的任何其他数据类型；例如：\n\n点击此处查看代码图像\n\n```cpp\nunion SimpleUnion\n\
  {\n   int num;\n   double preciseNum;\n};\n```\n\n你可能为 `double` 实例化这个 `union`，但却将其作为\
  \ `integer` 使用：\n\n点击此处查看代码图像\n\n```cpp\nSimpleUnion u1;\nu1.preciseNum = 3.14;\
  \ // union 存储了一个 double\nint num2 = u1.num; // 可以运行，但 u1 包含一个 double！\n```\n\nC++17\
  \ 为程序员提供了 `std::variant`，它是 `union` 的一种类型安全的替代方案：\n\n点击此处查看代码图像\n\n```cpp\nvariant<int,\
  \ double> varSafe;\nvarSafe = 3.14; // variant 存储 double\ndouble pi = get<double>(varSafe);\
  \ // 3.14\ndouble pi2 = get<1>(varsafe); // 3.14\nget<char>(varSafe); // 编译失败：variant\
  \ 中没有 char\nget<2>(varSafe); // 编译失败：variant 有两种类型，而不是三个\n\ntry\n{\n   get<int>(varSafe);\
  \ // 因为 variant 存储的是 double 而抛出异常\n}\ncatch (bad_variant_access&) { // 异常处理器代码 }\n\
  ```\n\n### 使用 `if constexpr` 进行条件代码编译\n\n此功能类似于 `if-else` 结构，不同之处在于 `if` 条件在编译时求值，并且只有当\
  \ `if` 块中的代码（或相应的 `else`）在编译时满足条件时才会被编译。\n\n点击此处查看代码图像\n\n```cpp\n#include <type_traits>\n\
  #include <iostream>\n#include <iomanip>\n\nusing namespace std;\n\ntemplate <typename\
  \ T>\nvoid DisplayData(const T& data)\n{\n   if constexpr (is_integral<T>::value)\n\
  \       cout << \"Integral data: \" << data << endl;\n   else if constexpr (is_floating_point<T>::value)\n\
  \       cout << setprecision(15) << \"Floating point data: \" << data << endl;\n\
  \   else\n       cout << \"Unidentified data: \" << data << endl;\n}\n```\n\n给定\
  \ `DisplayData(15)`，符合 C++17 标准的编译器将只编译以下行：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"\
  Integral data: \" << data << endl;\n```\n\n给定 `DisplayData(“Hello World!\")`，编译器将只编译以下内容，因为函数被调用时使用的类型触发了\
  \ `else` 块：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Unidentified data: \" << data <<\
  \ endl;\n```\n\n结合第 7 节 “[使用函数组织代码”中引入的自动返回类型推导，这是一个强大的功能，它允许允许函数根据编译器执行的路径返回不同类型的值。\n\
  \n### 改进的 Lambda 表达式\n\nLambda 函数预计会有以下改进：\n\n![Image](img/square.jpg) 将在 `constexpr`\
  \ 函数内部被支持。\n\n![Image](img/square.jpg) 将允许使用 `[*this]` 语法捕获 `*this` 的拷贝。\n\n###\
  \ 构造函数的自动类型推导\n\n从 C++14 开始，你需要像这样声明一个组合整数和浮点类型的对：\n\n点击此处查看代码图像\n\n```cpp\nstd::pair<int,\
  \ double> pairIntToDb (3, 3.14159265359);\n```\n\nC++17 将允许将该行代码简化为：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::pair pairIntToDb (3, 3.14159265359);\n```\n\n构造函数模板参数的类型推导将是自动的。\n\
  \n\n\n\n\n2. 我的多线程应用允许极快地访问数据库。然而，有时我发现获取的数据是乱码。我哪里做错了？\n\n# 第六部分：附录\n\n## 附录 A.\
  \ 数字处理：二进制与十六进制\n\n理解二进制和十六进制系统的原理对于编写更好的 C++ 应用程序并非关键，但它可以帮助你更好地理解底层发生了什么。\n\n\
  #### 十进制系统\n\n我们每天使用的数字范围在 0–9 之间。这组数字被称为十进制。由于该系统由 10 个独特的数字组成，因此它是一个基数为 10 的系统。\n\
  \n因此，由于基数是 10，每个数字从 0 开始的位置表示该数字所乘以 10 的幂次。所以\n\n点击此处查看代码图像\n\n957 = 9 x 10² + 5\
  \ x 10¹ + 7 x 10⁰ = 9 x 100 + 5 x 10 + 7\n\n在数字 957 中，7 从 0 开始的位置是 0，5 的位置是 1，9\
  \ 的位置是 2。这些位置索引变成了基数 10 的幂，如示例所示。记住，任何数的 0 次幂都是 1（所以，10⁰ 等于 1000⁰，因为它们计算的值都是 1）。\n\
  \n> 注意\n> 十进制系统是一个 10 的幂次最重要的系统。数字中的数位通过乘以 10、100、1000 等来确定数字的大小。\n\n#### 二进制系统\n\
  \n基数为 2 的系统被称为二进制系统。由于该系统仅允许两种状态，因此用数字 0 和 1 表示。这些数字在 C++ 中通常被求值为 `false` 和 `true`（`true`\
  \ 为非零）。\n\n正如十进制系统中的数字被求值为基数 10 的幂一样，二进制中的数字被求值为其基数 2 的幂次：\n\n点击此处查看代码图像\n\n101\
  \ (二进制) = 1 x 2² + 0 x 2¹ + 1 x 2⁰ = 4 + 0 + 1 = 5 (十进制)\n\n所以，二进制 101 的十进制对应值为\
  \ 5。\n\n> 注意\n> 二进制数中的数字通过乘以 2 的幂次（如 4, 8, 16, 32 等）来确定数字的大小。幂次由该数字从 0 开始的位置决定。\n\
  \n为了更好地理解二进制系统，让我们查看列出各种 2 的幂的表 A.1。\n\n![Image](img/app01tab01.jpg)\n\n**表 A.1**\
  \ 2 的幂\n\n#### 为什么计算机使用二进制？\n\n与数字系统发现的时间相比，二进制系统的广泛使用相对较新。电子计算机的发展加速了它的使用。电子和电子元件的演变产生了一种能够检测组件处于开启（在显著电位或电压下）或关闭（无或低电位）状态的系统。\n\
  \n这些开启 和关闭 状态方便地解释为 1 和 0，完全代表了二进制数字集，并使其成为算术运算的首选方法。第 5 课 中涵盖的如 `NOT`、`AND` 和 `XOR`\
  \ 等逻辑操作，以及“表达式与运算符的使用”（位于表 5.2），通过电子门的发展得到了轻松支持。\n\n#### 什么是位（Bits）和字节（Bytes）？\n\
  \n`bit` 是计算系统中包含二进制状态的基本单位。因此，如果一个 `bit` 包含 1，则被称为“置位”，如果包含 0 则被称为“重置”。位的集合是一个 `byte`。一个\
  \ `byte` 中的位数在理论上是固定的，且取决于硬件。\n\n然而，大多数计算系统都假设一个 `byte` 有 8 个位，简单原因是 8 是 2 的幂。一个\
  \ `byte` 中的 8 位还允许多达 2⁸ 种不同的值，即 255 个不同的值，这足够显示 ASCII 集中所有的字符。\n\n#### 多少字节组成一个千字节？\n\
  \n1024 字节组成一个千字节。同样，1024 千字节组成一个兆字节。1024 兆字节组成一个字节。\n\n#### 十六进制系统\n\n十六进制是一种基数为\
  \ 16 的数字系统。十六进制系统中的数字范围可以是 0–9 和 A–F。所以，十进制的 10 在十六进制中是 `A`，十进制的 15 在十六进制中是 `F`：\n\
  \n![Image](img/704tab01.jpg)\n\n正如十进制系统中的数字被求值为基数 10 的幂，二进制中求值为基数 2 的幂，十六进制中的则求值为基数\
  \ 16 的幂：\n\n点击此处查看代码图像\n\n```\n3 x 16² + 1 x 16¹ + F x 16⁰\n```\n\n> 注意\n> 十六进制是\
  \ \n\n#### 为什么我们需要十六进制？\n\n十六进制是计算机表示二进制的更简便的方式。\n\n#### 十进制转十六进制\n\n该过程与二进制相同；只是除以\
  \ 16 而不是除以 2。\n\n#### 十进制转二进制\n\n将十进制 33 转换为二进制，减去 2 的最高幂（32）：\n\n33 / 2 = 商 16，余\
  \ 1\n16 / 2 = 商 8，余 0\n8 / 2 = 商 4，余 0\n4 / 2 = 商 2，余 0\n2 / 2 = 商 1，余 0\n1 / 2\
  \ = 商 0，余 1\n\n33 的二进制（读取位）：100001\n\n同样，156 的二进制对应值为\n\n156 / 2 = 商 78，余 0\n78\
  \ / 2 = 商 39，余 0\n39 / 2 = 商 19，余 1\n19 / 2 = 商 9，余 1\n9 / 2 = 商 4，余 1\n4 / 2 =\
  \ 商 2，余 0\n2 / 2 = 商 1，余 0\n1 / 2 = 商 0，余 1\n\n156 的二进制：10011100\n\n#### 十进制转十六进制\n\
  \n该过程与二进制相同；你除以 16 而不是除以 2。\n\n所以，将十进制 5211 转换为十六进制：\n\n5211 / 16 = 商 325，余 B[16]\
  \ (11[10] 是 B[16])\n325 / 16 = 商 20，余 5\n20 / 16 = 商 1，余 4\n1 / 16 = 商 0，余 1\n\n\
  5211[10] = 145B[16]\n\n\n\n\n\n为了更好地理解不同数字系统的工作原理，你可以编写一个简单的 C++ 程序，类似于第 27 节中的列表\
