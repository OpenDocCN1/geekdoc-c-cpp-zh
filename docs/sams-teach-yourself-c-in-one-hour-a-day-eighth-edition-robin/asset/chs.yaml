  \ 26 节：理解智能指针\n\nC++ 程序员在管理堆内存（或空闲存储区）时，并不一定需要使用原始指针类型；他们可以使用智能指针。\n\n![Image](img/square.jpg)\
  \ 什么是智能指针以及为什么你需要它们\n\n![Image](img/square.jpg) 智能指针是如何实现的\n\n![Image](img/square.jpg)\
  \ 不同类型的智能指针\n\n![Image](img/square.jpg) 为什么你不应该使用已弃用的 `std::auto_ptr`\n\n![Image](img/square.jpg)\
  \ 标准库智能指针 `std::unique_ptr`\n\n![Image](img/square.jpg) 流行的智能指针库\n\n### 什么是智能指针？\n\
  \n简单来说，C++ 中的智能指针是一个重载了操作符的类，它的行为类似于传统的指针。然而，它通过确保动态分配的数据得到正确且及时的销毁，并有助于定义对象生命周期。\n\
  \n### 使用传统（原始）指针的问题\n\n与其他现代编程语言不同，C++ 在内存分配、释放和管理方面为程序员提供了完全的灵活性。遗憾的是，这种灵活性是一把双刃剑。一方面，它让\
  \ C++ 了一种强大的语言；但另一方面，它允许程序员在动态分配的对象未被正确释放时创建内存相关问题，例如内存泄漏。\n\n例如：\n\n点击此处代码图片\n\n\
  ```\nSomeClass* ptrData = anObject.GetData ();\n\n/*\n   问题：ptrData 指向的对象是通过 new\
  \ 动态分配的吗？\n   如果是，谁调用 delete？调用者还是被调用者？\n   答案：不知道！\n*/\n\nptrData->DoSomething();\n\
  ```\n\n在前面的代码中，没有明显的方法可以判断 `ptrData` 指向的内存：\n\n![Image](img/square.jpg) 是否在`堆`上分配的，因此最终需要被`释放`\n\
  \n![Image](img/square.jpg) 是否由调用者负责`释放`\n\n![Image](img/square.jpg) 是否会自动由对象的析构函数销毁\n\
  \n尽管通过插入注释和强制编码规范可以部分解决这些歧，但这些机制太松散，无法有效避免因滥用动态分配的数据和指针引起的所有错误。\n\n### 智能指针如何帮助？\n\
  \n鉴于使用传统指针和传统内存管理技术的问题，由于 C++ 程序员在需要管理堆/空闲存储区的数据时，并不被强制使用它们。程序员可以通过在程序中使用智能指针，选择一种更智能的方式来分配和管理动态数据：\n\
  \n点击此处代码图片\n\n```\nsmart_pointer<SomeClass> spData = anObject.GetData ();\n\n//\
  \ 像使用传统指针一样使用智能指针！\n\nspData->Display ();\n\n(*spData).Display ();\n\n// 不需要担心释放\n\
  \n// （智能指针的析构函数为你完成这一切）\n```\n\n因此，智能指针的行为类似于传统指针（我们现在称它们为*原始指针*），但通过它们的*重载操作符*和*析构函数*提供了实用的功能，以确保动态分配的数据被及时销毁。\n\
  \n### 智能指针是如何实现的？\n\n这个问题目前可以简化为“智能指针 `spData` 是如何像传统指针一样工作的？”答案是：智能指针类重载了解引用操作符\
  \ (`*`) 和成员选择操作符 (`->`)，以便程序员像使用传统指针一样使用它们。操作符重载之前 第 12 节 中讨论过。\n\n此外，为了让你能够管理某种类型，几乎所有良好的智能指针类都是模板，包含了其功能的通用实现。作为模板，它们是灵活的，可以针对特定类型进行特化。\n\
  \n列表 26.1 智能类的要素组件 点击此处代码图片\n\n```\ntemplate <typename T>\nclass smart_pointer {\n\
  private:\n    T* rawPtr;\npublic:\n    // 构造函数\n    smart_pointer (T* pData) : rawPtr(pData)\
  \ {}\n\n    // 析构函数\n    ~smart_pointer () {delete rawPtr;}\n\n    // 拷贝构造函数\n \
  \   smart_pointer (const smart_pointer &anotherSP);\n\n    // 赋值操作符\n    smart_pointer&\
  \ operator= (const smart_pointer& anotherSP);\n\n    // 解引用操作符\n    T& operator\
  \ () const {\n        return *(rawPtr);\n    }\n\n    // 成员选择操作符\n    T* operator->\
  \ () const {\n        return rawPtr;\n    }\n};\n```\n\n分析 ![Image](img/arrow.jpg)\n\
  \n前面的智能指针类展示了第 14-17 行和 19-22 行定义的两个符的实现，这有助于该类在传统意义上作为“指针”运行。例如，为了对 `class Tuna`\
  \ 对象使用智能指针，你可以这样实例化它：\n\n点击此处代码图片\n\n```\nsmart_pointer<Tuna> smartTuna (new Tuna());\n\
  \nsmartTuna->Display();\n\n// 或者：\n\n(*smartTuna).Display();\n```\n\n这个 `smart_pointer`\
  \ 类仍然没有展示或实现任何让该指针类变得非常智能并使得使用它优于传统指针的功能。如第 7 行所示，构造函数接收一个指针并将其保存为智能指针类中的内部指针对象。析构函数释放此指针，允许自动释放内存。\n\
  \n注意\n\n让智能指针真正“智能”的实现是拷贝构造函数、赋值操作符和析构函数。它们决定了智能指针对象在跨函数传递、被赋值或超出作用域（即被析构）时的。因此，在查看完整的智能指针实现之前，你应该了解一些智能指针类型。\n\
  \n### 智能指针类型\n\n\n\n\n内存资源管理（即所实现的所有权模型）是智能指针类与众不同的之处。智能指针决定了它们在被复制和赋值时对资源进行何种操作。最简单的实现往往会导致性能问题，而最快速的实现可能并不适用于所有应用程序。根结底，程序员在决定在应用程序中使用某种智能指针之前，需要理解其工作原理。\n\
  \n智能指针的分类实际上是它们对内存资源管理策略的分类。这些策略包括：\n\n![Image](img/square.jpg) 深拷贝\n\n![Image](img/square.jpg)\
  \ 写时拷贝 (COW)\n\n![Image](img/square.jpg) 引用计数\n\n![Image](img/square.jpg) 引用链接\n\
  \n![Image](img/square.jpg) 破坏性拷贝\n\n在学习 C++ 标准库提供的智能指针——`std::unique_ptr` 之前，让我们简要查看一下这些每策略。\n\
  \n### 深拷贝\n\n在实现深拷贝的智能指针中，每个智能指针实例都持有被管理对象的一个完整副本。每当智能指针被复制时，所指向的对象也会被复制（因此是深拷贝）。当智能指针超出作用域时，它会通过析构函数释放它所指向的内存。\n\
  \n虽然基于深拷贝的智能指针似乎并没有比按值传递对象产生任何价值，但在处理多态对象时，它的优势就显而易见了。所示，它可以避免切片（slicing）：\n\n点击此处查看代码图像\n\
  \n```cpp\n// 按值传递多态对象时发生切片的示例\n\n// Fish 是金枪鱼和鲤鱼的基类，Fish::Swim() 是虚函数\n\nvoid MakeFishSwim\
  \ (Fish aFish)    // 注意参数类型\n{\n    aFish.Swim(); // 虚函数\n}\n\n// ... 某些函数\n\nCarp\
  \ freshWaterFish;\nMakeFishSwim (freshWaterFish);  // Carp 将被“切”为 Fish\n\n// 切片：只有\
  \ Carp 的 Fish 部分被发送到 MakeFishSwim()\n\nTuna marineFish;\nMakeFishSwim(marineFish);\
  \ // 再次发生切片\n```\n\n当程序员选择深拷贝智能指针时，切片问题得以解决，如列表 26.2 所示。\n\n**列表 26.2** 使用基于深拷贝的智能指针按基类型传递多态对象\n\
  \n点击此处查看代码图像\n\n```cpp\n0: template <typename T>\n1: class deepcopy_smart_ptr\n\
  2: {\n3: private:\n4:     T* object;\n5: public:\n6:     //... 其他函数\n7:\n8:    \
  \ // 深拷贝指针的拷贝构造函数\n9:     deepcopy_smart_ptr (const deepcopy_smart_ptr& source)\n\
  10:     {\n11:         // Clone() 是虚函数：确保派生类对象的深拷贝\n12:         object = source->Clone\
  \ ();\n13:     }\n14:\n15:     // 拷贝赋值运算符\n16:     deepcopy_smart_ptr& operator=\
  \ (const deepcopy_smart_ptr& source)\n17:     {\n18:         if (object)\n19:  \
  \           delete object;\n20:\n21:         object = source->Clone ();\n22:   \
  \  }\n23: };\n```\n\n分析 ![Image](img/arrow.jpg)\n\n如所示，`deepcopy_smart_ptr` 在第 9-13\
  \ 行实现了一个拷贝构造函数，允许通过该类需要实现的 `Clone()` 函数对多态对象进行深拷贝。同样，它在第 16-22 行也实现了一个拷贝赋值运算符。为了简单起见，本示例假设基类\
  \ `Fish` 实现的虚函数名为 `Clone()`。通常，实现深拷贝模型的智能指针会将此函数作为模板参数或函数对象提供。\n\n因此，当智能指针本身作为基类类型\
  \ `Fish` 的指针传递时：\n\n点击此处查看代码图像\n\n```cpp\ndeepcopy_smart_ptr<Carp> freshWaterFish(new\
  \ Carp);\nMakeFishSwim (freshWaterFish);  // Carp 不会被“切片”\n```\n\n### 写时拷贝 (COW)\n\
  \n*写时拷贝*（简称 COW）试图通过在第一次尝试写入之前共享资源来优化性能。COW 有许多支持者。对于那些坚信 COW 的人来说，实现 `*` 和 `->`\
  \ 是功能的关键。要点在于，当你选择遵循 COW 的实现时，在继续使用一个或多个此类指针之前，务必理解其实现细节。\n\n### 引用计数\n\n通常来说，引用计数是一种保持对象用户数量计数的机制。当计数减到零时，对象会被释放。因此，引用计数是一种在无需复制对象的情况下共享对象的极佳机制。如果你曾经接触过名为\
  \ COM 的微软技术，那么引用计数的概念至少会在某一次遇到你。\n\n此类智能指针在被复制时，需要增加所涉及对象的引用计数。保持这种计数的至少有两种流行方式：\n\
  \n![Image](img/square.jpg) 在指向的对象中维护引用计数\n\n![Image](img/square.jpg) 在共享对象中由指针类维护引用计数\n\
  \n第一种在对象中维护引用计数的变被称为*侵入式引用计数*（intrusive reference counting），因为对象需要被修改。在这种情况下，对象维护、增加并向任何管理它的智能指针类提供引用计数。顺便提一下，这是\
  \ COM 采用的方法。第二种在共享对象中维护引用计数的变体是一种机制，智能指针类可以将计数存储在堆上（例如一个动态分配的整数），并在被复制时通过拷贝构造函数增加该值。\n\
  \n因此，引用计数机制使得程序员在操作对象时仅使用智能指针变得恰当。管理对象的智能指针和指向它的原始指针是一个坏主意，因为当智能指针维护的计数减到零时，它会（智能地）释放对象，但原始指针继续指向不再属于你的应用程序的内存部分。同样，引用计数可能会导致其特有的问题：两个互相持有指针的对象永远不会被释放，因为它们的循环依赖将引用计数保持在至少\
  \ 1。\n\n### 引用链接\n\n*引用链接*智能指针是指并不主动计数使用对象的智能指针；它们只需要知道数量何时降为零以便释放对象。\n\n\n\n\n\n\
  它们被称为 `reference-linked`（引用链接），因为它们的实现是基于双向链表的。当通过复制现有的智能指针创建新的智能指针时，它会被添加到列表中。当智能指针超出作用范围或被销毁时，析构函数会将该智能指针从列表中取消索引。引用链接也会受到循环依赖引起的影响，这与引用计数指针的情况类似。\n\
  \n## 破坏性拷贝 (Destructive Copy)\n\n`destructive copy`（破坏性拷贝）是一种机制，智能指针在复制时，会将所处理对象的完整所有权转移给目标对象，并重置自己：\n\
  \n点击此处查看代码图像\n\n```\ndestructive_copy_smartptr <SampleClass> smartPtr (new SampleClass\
  \ ());\n\nSomeFunc (smartPtr);     // 所有权转移给 SomeFunc\n\n// 不要再在调用者中使用 smartPtr\
  \ 了！\n```\n\n虽然这种机制在用上显然不符合直觉，但破坏性拷贝智能指针提供的优势在于，它们确保了在任何时刻，只有一个活跃的指针指向某个对象。因此，它们是从函数返回指针的良好机制，并且在你可以利用其“破坏性”属性的场景中有用。\n\
  \n破坏性拷贝指针的实现偏离了标准的推荐 C++ 编程技术，如 Listing 26.3 所示。\n\n***\n\n### 注意\n\n`std::auto_ptr`\
  \ 是目前遵循破坏性拷贝原则最流行的（或者取决于你怎么看，是最臭名昭著的）指针。这种智能指针在传递给函数或复制到另一个对象之后就失效了。\n\n`std::auto_ptr`\
  \ 在 C++11 中被废弃了。相反，你应该使用 `std::unique_ptr`，由于其具有私有的拷贝构造函数和拷贝赋值运算符，它不能按值传递。它只能作为引用参数传递。\n\
  \n***\n\n### 列表 26.3 一个破坏性拷贝智能指针的示例\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: template\
  \ <typename T>\n1: class destructivecopy_ptr\n2: {\n3: private:\n4:     T* object;\n\
  5: public:\n6:     destructivecopy_ptr(T* input):object(input) {}\n7:     ~destructivecopy_ptr()\
  \ { delete object; }\n8:\n9:     // 拷贝构造函数\n10:     destructivecopy_ptr(destructivecopy_ptr&\
  \ source)\n11:     {\n12:         // 拷贝时获取所有权\n13:         object = source.object;\n\
  14:\n15:         // 销毁源\n16:         source.object = 0;\n17:     }\n18:\n19:   \
  \  // 拷贝赋值运算符\n20:     destructivecopy_ptr& operator= (destructivecopy_ptr& source)\n\
  21:     {\n22:         if (object != source.object)\n23:         {\n24:        \
  \     delete object;\n25:             object = source.object;\n26:             source.object\
  \ = 0;\n27:         }\n28:     }\n29: };\n30:\n31: int main()\n32: {\n33:     destructivecopy_ptr<int>\
  \ num (new int);\n34:     destructivecopy_ptr<int> copy = num;\n35:\n36:     //\
  \ num 现在是无效的\n37:     return 0;\n38: }\n```\n\n***\n\n分析 ![Image](img/arrow.jpg)\n\
  \nListing 26.3 展示了基于破坏性拷贝的智能指针的实现。第 10–17 行和 20–28 行分别包含拷贝构造函数和拷贝赋值运算符。这些函数在拷贝时使源对象失效；也就是说，拷贝构造函数在拷贝后将源包含的指针设置为\
  \ NULL，因此证明了“破坏性拷贝”名称。赋值运算符执行相同的操作。因此，`num` 在第 34 行被赋值给另一个指针时实际上已经失效了。这种行为与赋值的操作背道直驰。\n\
  \n***\n\n### 注意\n\n如 Listing 26.3 所示，对于破坏性拷贝智能指针实现至关重要的拷贝构造函数和拷贝赋值运算符也引起了最大的批评。与大多数\
  \ C++ 类不同，这种智能指针类不能让拷贝构造函数和赋值运算符接受 `const` 引用，因为它需要在拷贝后使源对象失效。这不仅偏离了传统的拷贝构造函数和赋值运算符语义，还使得使用该智能指针类违背直觉。很少有人期望拷贝源或赋值源在拷贝或赋值步骤后被破坏。这种智能指针会销毁源的事实也使得它们不适用于\
  \ STL `containers`，例如 `std::vector` 或你可能使用的任何动态集合类。这些容器需要在内部拷贝你的内容，并最终导致指针失效。因此，出于多个原因，建议你避免破坏性拷贝指针。\n\
  \n***\n\n***\n\n`auto_ptr` 直到最近 C++ 都支持的基于破坏性拷贝的智能指针。它在 C++11 中最终被废弃，你应该使用 `std::unique_ptr`。\n\
  \n***\n\n### 提示\n\n`std::unique_ptr` 被引入 C++11，它与 `auto_ptr` 的细微不同之处在于它不允许拷贝。\n\n\
  ***\n\n### 使用 `unique_ptr`\n\n`std::unique_ptr` 是一个类似于 `auto_ptr` 的简单智能指针，但具有私有的拷贝构造函数和赋值运算符以禁止拷贝。Listing\
  \ 26.4 展示了 `unique_ptr` 不支持拷贝：\n\n```cpp\n0: #include <iostream>\n1: #include <memory>\n\
  2: using namespace std;\n3:\n4: class Fish\n5: {\n6: public:\n7:     Fish() {cout\
  \ << \"Fish: Constructed!\" << endl;}\n8:     ~Fish() {cout << \"Fish: Destructed!\"\
  \ << endl;}\n9:\n10:    void Swim() const {cout << \"Fish in water\" << endl;}\n\
  11: };\n12:\n13: void MakeFish(const unique_ptr<Fish>& inFish)\n14: {\n15:     inFish->Swim();\n\
  16: }\n17:\n18: int main()\n19: {\n20:     unique_ptr<Fish> smartFish (new Fish);\n\
  21:\n22:     smartFish->Swim();\n23:     MakeFish(smartFish); // OK，因为 MakeFish\
  \ 接受引用\n24:\n25:     unique_ptr<Fish> copySmartFish;\n26:     // copySmartFish =\
  \ smartFish; // 错误：operator= 是私有的\n27:\n28:     return 0;\n29: }\n```\n\n\n\n\n\n\
  点击此处查看代码图像\n\n```cpp\ncopySmartFish = smartFish; // error：operator= 是私有的\n```\n\n\
  然而，它支持移动语义。因此，一个可行的方案是：\n\n点击此处查看代码图像\n\n```cpp\nunique_ptr<Fish> sameFish (std::move(smartFish));\n\
  // smartFish 从此后为空\n```\n\n如果你确实编写了一个需要捕获 `unique_ptr` 的 lambda 表达式，那么你就可以像 C++14\
  \ 支持的那样，在你的 lambda 捕获句列表中使用 `std::move()`。\n\n点击此处查看代码图像\n\n```cpp\nstd::unique_ptr<char>\
  \ alphabet(new char);\n\n*alphabet = 's';\n\nauto lambda = [capture = std::move(alphabet)]()\n\
  { std::cout << *capture << endl; };\n\n// alphabet 从此后为空，因为内容已被“移动”\n\nlambda();\n\
  ```\n\n如果前面的代码看起来太奇特，请不要沮丧——它确实很复杂，并且涵盖了大多数专业程序员可能永远不会遇到的用例。\n\n* * *\n* * *\n\n\
  ### 注意事项\n在编写使用多线程的应用时，请评估使用由 C++11 标准库提供的 `std::shared_ptr` 和 `std::weak_ptr`。这些工具有助于线程安全的、引用计数的对象共享。\n\
  \n* * *\n\n### 流行的智能指针库\n显而易见，C++ 标准库附带的智能指针版本无法满足每个程序员的需求。这正是为什么世界上存在许多智能指针库的原因。\n\
  \nBoost ([www.boost.org](http://www.boost.org)) 为你提供了一些经过充分测试且文档良好的智能指针类，以及许多其他实用的工具类。你可以在\
  \ [`www.boost.org/libs/smart_ptr/smart_ptr.htm`](http://www.boost.org/libs/smart_ptr/smart_ptr.htm)\
  \ 找到关于 Boost 智能指针的更多信息和下载。\n\n### 总结\n在本节中，你学习了如何使用正确的智能指针来帮助编写指针代码，同时有助于减少与分配和对象所有权相关的问题。你还学习了不同的智能指针类型，并了解到在你的应用程序中采用智能指针类之前，了解它的行为是重要的。你现在知道你不应该使用\
  \ `std::auto_ptr`，因为它在拷贝或赋值期间会使源对象失效。你学习了从 C++11 开始提供的智能指针类 `std::unique_ptr`。\n\
  \n### 问答\n**Q 我需要一个指针向量（vector）。我应该选择 `auto_ptr` 作为向量中持有的对象类型吗？**\n\n**A** 根据原则，你永远不应该使用\
  \ `std::auto_ptr`。它被废弃了。单次拷贝或赋值操作就会导致源对象无法使用。\n\n**Q 一个类始终需要重载哪两个运算符才能被称为智能指针类？**\n\
  \n**A** 是以下两个：`operator*` 和 `operator->`。它们帮助像普通指针语义一样使用该类的对象。\n\n**Q 我有一个应用程序，其中\
  \ `Class1` 和 `Class2` 存有指向对方类型对象的成员属性。在这种情况下，我应该使用引用计数指针吗？**\n\n**A** 可能不需要，因为循环依赖会导致引用计数无法降为零，从而导致两个类的对象永久地留在堆内存中。\n\
  \n**Q 字符串类也在空闲存储（free store）上动态管理字符数组。那么字符串类也是一种智能指针吗？**\n\n**A** 不是。这些类通常没有同时实现\
  \ `operator*` 和 `operator->`，因此不能被归类为智能指针。\n\n## 工作坊\n工作坊包含测验题，帮助你巩固对涵盖内容的理解，并提供练习让你获得使用所学知识的经验。在检查\
