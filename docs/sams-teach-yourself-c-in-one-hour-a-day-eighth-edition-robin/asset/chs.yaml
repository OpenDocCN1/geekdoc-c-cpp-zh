  \ windDirection = 26\n\n### 提示\n\n你可能想看一眼第 6 节中的列表 6.4 和 6.5。它们使用 `enum` 来枚举周的几天，并使用条件处理来告知用户选择的日期的名称。\n\
  \n### 使用 #define 定义常量\n\n首先，如果你在编写新程序，请不要使用这种方法。本书分析使用 `#define` 定义常量的唯一理由是为了帮助你理解某些使用这种语法定义如\
  \ `pi` 等常量的旧程序：\n\n```cpp\n#define pi 3.14286\n```\n\n\n\n\n`#define` 是一个预处理器宏，这里的操作是将此后所有对\
  \ `pi` 的引用替换为 3.14286 以供编译器处理。注意，这是由预处理器执行的文本替换（即：非智能替换）。编译器既不知道也不关心所涉及常数的实际类型。\n\
  \n### 注意事项\n\n通过 `#define` 使用预处理器定义常量已过时，不应再使用这种方法。\n\n## 你不能作为变量或常量命名的关键字\n\n某些单词被\
  \ C++ 保留了，你不能将它们作为变量名。这些关键字对 C++ 编译器有特殊含义。关键字包括 `if`、`while`、`for` 和 `main`。C++\
  \ 定义的关键字列表可以在 表 3.2 以及 附录 B 中的“C++ 关键字。”中找到。你的编译器可能还有额外的保留字，因此你应该检查其手册以获取完整列表。\n\
  \n![Image](img/03tab02.jpg)\n\n**表 3.2** 主要 C++ 关键字\n\n## 应该\n\n**应该** 给变量起具有描述性的名称，即使这些名称很长。\n\
  \n**应该** 初始化变量，并使用列表初始化来避免收窄转换错误。\n\n**应该** 确保变量名能够解释其用途。\n\n**应该** 把自己置于尚未见过你代码的人的处地，思考这个名称对他们来说是否有意义。\n\
  \n**应该** 检查你的团队是否遵循了某些命名规范，并遵循这些规范。\n\n### 不要\n\n**不要** 给出过于短或仅包含一个字符的名称。\n\n**不要**\
  \ 使用只有你自己懂的奇特缩写词作为名称。\n\n**不要** 使用 C++ 保留的关键字作为名称，因为这些将无法编译。\n\n### 总结\n\n在本节中，你学习了如何使用内存并在变量和常量中临时存储值。你学习了变量的大小由其类型决定，并且可以使用\
  \ `sizeof` 运算符来确定其大小。你了解了不同类型的变量，如 `bool`、`int` 等，以及它们被用于包含不同类型的数据。在有效的编程中，正确选择变量类型至关重要，选择一个与用途不符的过小的变量可能会导致回绕错误或溢出情况。你学习了关键字\
  \ `auto`，它让编译器根据变量的初始化值为你决定数据类型。\n\n你还学习了不同类型的常量，以及通过使用 `const`、`constexpr` 和 `enum`\
  \ 关键字使用其中最重要的常量。\n\n### 问答\n\n**Q 既然可以使用普通变量代替常量，为什么还要定义常量呢？**\n\n**A** 常量，特别是使用\
  \ `const` 关键字声明的常量，是你告诉编译器某个变量的值是固定的且不允许更改的一种方式。因此，编译器会始终确保常量变量永远不会被赋予另一个值，即使另一个程序员接手了你的工作并无意中尝试覆盖该值。所以，在你知道变量值不应该改变时声明常量是一种良好的编程实践，并可以提高应用程序的质量。\n\
  \n**Q 为什么我应该初始化变量的值？**\n\n**A** 如果你不进行初始化，你就不知道变量的初始值是什么。初始值只是为该变量预留的内存位置的内容。像这里这样的初始化：\n\
  \n```\nint myFavoriteNumber = 0;\n```\n\n会在变量 `myFavoriteNumber` 创建时，立即将你选择的初始值（在此例中为\
  \ 0）写入为该变量预留的内存位置。在某些情况下，你会根据变量的值进行条件处理（通常检查是否非零）。如果没有初始化，这种逻辑无法可靠地运行，因为未赋值或未初始化的变量包含通常非零且随机的垃圾数据。\n\
  \n**Q 为什么 C++ 给我提供了使用 `short int`、`int` 和 `long int` 的选项？为什么不一直使用那种允许存储最大数值的整数类型？**\n\
  \n**A** C++ 是一种用于各种应用程序的编程语言，许多程序运行在计算能力或内存资源有限的设备上。简单的旧手机就是一个例子，其处理能力和可用内存都是有限的。在这种情况下，如果不需要高数值，通过选择正确的变量类型通常可以节省内存、提高速度或两者兼顾。如果你在普通的桌面电脑或高端智能手机上编程，选择一种整数类型而非另一种所带来的性能提升或节省的内存可能微乎其微，在某些情况下甚至不存在。\n\
  \n**Q 为什么我不应该频繁使用全局变量？难道它们在我的整个应用程序中都是可用的，这样我可以节省在函数间传递值时所花费的时间吗？**\n\n**A** 全局变量可以全局读取和赋值。后者是问题所在，因为它们可以在全局范围内被更改。假设你正在与团队中的其他几个程序员合作一个项目。你将你的整数和其他变量声明为全局变量。如果你团队中的任何程序员在他们的代码中无意中更改了你的整数值——这甚至可能是在你使用的不同的\
  \ `.CPP` 文件中——你代码的可靠性就会受到影响。因此，节省几秒钟不应该是标准，你不应该盲目使用全局变量，以确保你代码的稳定性。\n\n**Q C++ 给我提供了使用应该包含正值和零的无符号整数的选项。如果我减少零值会发生什么？**\n\
  \n**A** 你会看到回绕现象。对包含 0 的无符号整数减 1 意味着它绕到了它可以持有的最大值！`unsigned short` 可以包含 0 到 65535\
  \ 的值。所以，声明一个 `unsigned short` 并对其减法看看意外的结果：\n\n```\nunsigned short myShortInt =\
  \ 0; // 初始值\nmyShortInt = myShortInt - 1; // 减 1\nstd::cout << myShortInt << std::endl;\
  \ // 输出: 65535!\n```\n\n注意，这不是 `unsigned short` 的问题，而是你使用它的方式。当规范允许负值时，不应使用无符号整数（或短型、长型）。如果\
  \ `myShortInt` 用于访问内存位置的索引，你的应用程序极可能会访问一个外部位置并崩溃！\n\n### 练习\n\n工作练习提供了问答题，以帮助你巩固对涵盖内容的理解，并提供了练习题以让你获得使用所学知识的经验。在查看附录\
