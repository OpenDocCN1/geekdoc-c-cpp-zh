  \ 的声明：\n\n点击此处查看代码图像\n\n`virtual const char* what() const throw()`\n\n它以 `throw()`\
  \ 结尾，这意味着预计该函数本身不会抛出异常——对于被用作异常对象的类来说，这是一个非常重要且相关的限制。如果你仍然在该函数中插入 `throw`，你可以预期会有编译器警告。\n\
  \n如果一个函数以 `throw(int)` 结尾，意味着预计该函数会抛出 `int` 类型的异常。\n\n***\n\n### DO\n\n- **务必**记住\
  \ `catch` 类型为 `std::exception` 的异常。\n- **务必**记住让你的自定义异常类（如果有）继承自 `std::exception`。\n\
  - **务必**抛出异常，但要谨慎。它们不是 `true` 或 `false` 等返回值的替代品。\n\n***\n\n### DON’T\n\n- **不要**在析构函数中抛出异常。\n\
  - **不要**认为内存分配是理所当然；执行 `new` 的代码始终应该是异常安全的，并位于带有 `catch(std::exception&)` 的 `try`\
  \ 块中。\n- **不要**在 `catch()` 块内部插入任何重量级逻辑或资源分配。你不希望在处理异常时又引发了异常。\n\n### Summary\n\n\
  在本节课程中，你学习了实用 C++ 编程的一个重要部分。让你的应用程序在自己的开发环境之外保持稳定，对于客户满意度和直观的用户体验至关重要，而这正是异常能帮助你做到的。你发现分配资源或内存的代码可能会失败，因此需要使其具有异常安全性。你学习了\
  \ C++ 异常类 `std::exception`，并知道如果你需要编写自定义异常类，理想情况下应该继承自这个类。\n\n### Q&A\n\n**Q 为什么要抛出异常而不是返回错误？**\n\
  \n**A** 你并不总是拥有返回错误的权限。如果对 `new` 的调用失败，你需要处理 `new` 抛出的异常，以防止你的应用程序崩溃。此外，如果错误非常严重并导致你的应用程序未来的功能无法实现，你应该考虑抛出异常。\n\
  \n**Q 为什么我的异常类应该继承自 `std::exception`？**\n\n**A** 这当然不是强制性的，但它可以帮助你重用所有已经捕捉 `std::exception`\
  \ 类型异常的 `catch()` 块。你可以编写不继承自任何其他类的自定义异常类，但你必须在所有相关点插入新的 `catch(MyNewExceptionType&)`\
  \ 语句。\n\n**Q 我有一个抛出异常的函数。它需要在同一个函数中捕获吗？**\n\n**A** 完全不需要。只需确保抛出的异常类型在调用栈中的某一个调用函数中捕获即可。\n\
  \n**Q 构造函数可以抛出异常吗？**\n\n**A** 构造函数实际上没有选择！它们没有返回值，而抛出异常是表达不同意见的最佳方式。\n\n**Q 析构函数可以抛出异常吗？**\n\
  \n**A** 技术上可以。然而这是一种坏习惯，因为当栈由于异常回溯时也会调用析构函数。因此，一个由于抛出异常而调用的析构函数本身又抛出异常，显然会导致尝试整洁退出的已经不稳定的应用程序陷入非常糟糕的局面。\n\
