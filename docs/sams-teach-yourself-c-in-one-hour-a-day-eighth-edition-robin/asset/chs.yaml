  \n[content]\n队列是 FIFO（先入先出）系统，元素可以插入到前一个元素的后面，而先插入的元素先被移除。队列可以被可视化为邮局等候盖章的人排队的队伍——越早加入队列的人越早离开。这种涉及“从尾部添加但从前端删除”的元素组织方法在图\
  \ 24.2 中进行了说明。\n\n![Image](img/24fig02.jpg)\n\n**图 24.2** 队列上的操作。\n\n队列的这种行为在通用\
  \ STL 容器 `std::queue` 中得到了模拟。\n\n***\n\n提示\n\n要使用类 `std::queue`，请包含头文件\n\n```cpp\n\
  #include <queue>\n```\n\n***\n\n# 使用 STL `stack` 类\n\nSTL `stack` 是一个模板类，需要包含头文件\
  \ `<stack>`。它是一个通用类，允许在栈顶插入和删除元素，不允许对中间的元素进行任何访问或检查。从这个意义上说，`std::stack` 的行为与一叠盘子非常相似。\n\
  \n## 实例化栈\n\n`std::stack` 在某些 STL 实现中定义为\n\n点击此处查看代码图像\n\n```cpp\ntemplate <\n \
  \  class elementType,\n   class Container = deque`<Type>`\n> class stack;\n```\n\
  \n参数 `elementType` 是栈收集的对象的类型。第二个模板参数 `Container` 是栈的默认底层容器实现类。`std::deque` 是栈内部数据存储的默认容器，可以被\
  \ `std::vector` 或 `std::list` 替换。因此，整数栈的实例化看起来如下：\n\n点击此处查看代码图像\n\n```cpp\nstd::stack\
  \ <int> numsInStack;\n```\n\n如果你想创建一个任何类型对象的栈，例如 `class Tuna`，你将使用以下代码：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::stack <Tuna> tunasInStack;\n```\n\n要创建一个使用不同底层容器的栈，请使用\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::stack <double, vector <double>> doublesStackedInVec;\n```\n\n列表 24.1\
  \ 演示了不同的实例化技术。\n\n**列表 24.1** STL 栈的实例化\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include\
  \ <stack>\n1: #include <vector>\n2:\n3: int main ()\n4: {\n5:     using namespace\
  \ std;\n6:\n7:     // A stack of integers\n8:     stack <int> numsInStack;\n9:\n\
  10:     // A stack of doubles\n11:     stack <double> dblsInStack;\n12:\n13:   \
  \  // A stack of doubles contained in a vector\n14:     stack <double, vector <double>>\
  \ doublesStackedInVec;\n15:\n16:     // initializing one stack to be a copy of another\n\
  17:     stack <int> numsInStackCopy(numsInStack);\n18:\n19:     return 0;\n20: }\n\
  ```\n\n***\n\n分析 ![Image](img/arrow.jpg)\n\n该示例没有产生输出，但演示了 STL `stack` 的模板实例化。第\
  \ 8 行和第 11 行实例化两个 `stack` 对象，分别持有 `int` 和 `double` 类型的元素。第 14 行也实例化了一个 `double`\
  \ 类型的 `stack`，但指定了第二个模板参数——`stack` 内部使用的集合类类型，即 `vector`。如果不提供此第二个模板参数，`stack` 将自动默认使用\
  \ `std::deque`。最后，第 17 行演示了一个 `stack` 对象可以作为另一个栈的拷贝来构造。\n\n## 栈成员函数\n\n`stack` 适配于另一个容器（如\
  \ `deque`、`list` 或 `vector`），它通过限制元素插入或删除的方式来实现其功能，从而提供严格符合栈机制预期的行为。表 24.1 解释了 `stack`\
