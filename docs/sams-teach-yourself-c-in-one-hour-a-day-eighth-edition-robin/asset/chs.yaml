  ## 第 27 节 使用流进行输入输出\n你一直都在使用流，从第一节在屏幕上显示“Hello World”开始。是时候从实用角度学习 C++ 流了。\n\n###\
  \ 流的概念\n你正在开发一个从磁盘读取、写入显示器、从键盘读取并保存到磁盘的程序。如果无论数据来自何处都能使用相似的模式有多有用？这正是 C++ 流为你提供的！\n\
  \n让我们参考你第一个 C++ 程序中的相关行，即第一节中的列表 1.1：\n\n点击此处查看代码图像\n\n```cpp\nstd::cout << \"Hello\
  \ World!\" << std::endl;\n```\n\n没错：`std::cout` 是 `ostream` 类的一个流对象，用于控制输出。为了使用\
  \ `std::cout`，你包含了 `<iostream>` 头文件，它提供了这一功能以及允许从流读取的 `std::cin`。\n\n那么，我说流允许一致且特定设备的访问是什么什么意思？如果你想向一个文本文件写入\
  \ `\"Hello World\"`，你将在文件流对象 `fsHello` 上使用这种语法：\n\n点击此处查看代码图像\n\n```cpp\nfsHello\
  \ << \"Hello World!\" << endl; // 写入文件流\n```\n\n正如你所见，在选择了正确的流类后，在 C++ 中向文件写入“Hello\
  \ World”与写入显示器并没有太大区别。\n\n### 提示\n在写入流时 `operator<<` 被称为插入运算符。你使用它写入显示器、文件等。\n\n\
  在将流写入变量时 `operator>>` 被称为提取运算符。你使用它从键盘、文件等读取输入。\n\n### 重要的 C++ 流类和对象\n\n\n\n\nC++\
