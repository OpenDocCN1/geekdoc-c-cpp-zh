  \n分析 ![Image](img/arrow.jpg)\n\n这是一个有趣的程序，它接收你输入的句子，如第 61 行所示，使用它构造一个 `MyString`\
  \ 对象，然后利用 `for` 循环逐个字符地打印字符串。\n\n### 运算符 `()` \n\n运算符 `()` 允许对象像函数一样被调用。这被称为函数对象或*仿函数*（functor）。这些对象在标准模板库\
  \ (STL) 中频繁使用，因为与普通函数不同，它们可以维护状态。\n\n在下面的示例中，`Display` 类实现了 `operator()` 来打印字符串。\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\nusing namespace std;\n\nclass\
  \ Display\n{\npublic:\n    void operator (string input) const\n    {\n        cout\
  \ << input << endl;\n    }\n};\n\nint main()\n{\n    Display displayFuncObj;\n\n\
  \    // 等同于 displayFuncObj.operator () (\"Display this string!\");\n    displayFuncObj\
  \ (\"Display this string!\");\n\n    return 0;\n}\n```\n\n### 注意事项\n\n在实现下标运算符时，如果函数没有修改对象的属性，那么使用\
  \ `const` 关键字是非常关重要的。如 Listing 12.9 所示，提供 `operator[]` 的 `const` 版本可以确保该类能与 `const`\
  \ 对象一起。\n\n### 用于高性能编程的移动构造函数和移动赋值运算符\n\n移动构造函数和移动赋值运算符是性能优化特性，它们已成为 C++11 的一部分，确保了临时值（在语句结束后不再存在的*右值*）不会被浪费性地复制。这在处理管理动态分配资源的类（例如动态数组类或字符串类）时特别有用。\n\
  \n\n\n\n\n```cpp\nMyString Hello(\"Hello \");\nMyString World(\"World\");\nMyString\
  \ CPP(\" of C++\");\nMyString sayHello(Hello + World + CPP);  // operator+, 构造函数\n\
  MyString sayHelloAgain (\"overwrite this\");\nsayHelloAgain = Hello + World + CPP;\
  \  // operator+, 拷贝构造函数, 拷贝赋值运算符=\n```\n\n这种让三个字符串拼接变得简单的结构使用了二元加法 `operator+`：\n\
  \n点击此处查看代码图像\n\n```cpp\nMyString operator+ (const MyString& addThis)\n{\n   MyString\
  \ newStr;\n   if (addThis.buffer != NULL)\n   {\n      // 拷贝到 newStr\n   }\n   return\
  \ newStr;  // 按值返回，调用拷贝构造函数\n}\n```\n\n在方便字符串的字符串的同时，加法运算符 `operator+` 可能会导致性能问题。创建\
  \ `sayHello` 需要执行两次加法运算符。每次执行 `operator+` 都会导致创建一个临时副本，因为 `MyString` 是按值返回的，从而导致拷贝构造函数的执行。拷贝构造函数执行深拷贝——拷贝到一个临时值，该临时值在表达式结束后就不再存在。因此，此表达式产生了临时副本（对于纯主义者来说是右值），这些副本在语句执行后不再需要，因此是\
  \ C++ 强制导致的性能瓶颈。好吧，至少在最近以前如此。\n\n这个问题现在在 C++11 中终于得到了解决，编译器能够特异地识别临时对象，并使用程序员提供的移动构造函数和移动赋值运算符。\n\
  \n### 声明移动构造函数和移动赋值运算符\n\n移动构造函数的语法如下：\n\n点击此处查看代码图像\n\n```cpp\nclass Sample\n{\n\
  private:\n   Type* ptrResource;\npublic:\n   Sample(Sample&& moveSource) // 移动构造函数，注意\
  \ &&\n   {\n      ptrResource = moveSource.ptrResource; // 获取所有权，开始移动\n      moveSource.ptrResource\
  \ = NULL;\n   }\n   Sample& operator= (Sample&& moveSource)//移动赋值运算符，注意 &&\n   {\n\
  \      if(this != &moveSource)\n      {\n         delete [] ptrResource;  // 释放自己的资源\n\
  \         ptrResource = moveSource.ptrResource;  // 获取所有权，开始移动\n         moveSource.ptrResource\
  \ = NULL;  // 释放移动源的所有权\n      }\n   }\n   Sample(); // 默认构造函数\n   Sample(const\
  \ Sample& copySource); // 拷贝构造函数\n   Sample& operator= (const Sample& copySource);\
  \ // 拷贝\n};\n```\n\n因此，移动构造函数和赋值运算符的声明与普通的拷贝构造函数和拷贝赋值运算符的区别在于输入参数的类型为 `Sample&&`。此外，由于输入参数是移动源，它不能是\
  \ `const` 参数，因为它会被修改。返回值保持不变，因为它们分别是构造函数和赋值运算符的重载版本。\n\n符合 C++11 标准的编译器确保对于右值临时对象，使用移动构造函数而不是拷贝构造函数，并调用移动赋值运算符而不是拷贝赋值运算符。在对这两个函数的实现中，你确保不是拷贝，而是简单地将资源从源移动到目标。列表\
  \ 12.11 展示了这两个新特性在优化 `class MyString` 方面的有效性。\n\n**列表 12.11** 除了拷贝构造函数和拷贝赋值运算符，带有移动构造函数和移动赋值运算符的\
