  \ 797\n\n分析 ![Image](img/arrow.jpg)\n\n这与列表 18.7 类似，该列表按字母顺序排序了 `std::list`，区别在于在\
  \ `std::set` 的情况下，排序是在插入时发生的。如输出所示，你不需要调用任何函数来确保 `set` 中的元素是有序的，因为它们在插入时已经使用你在 36–39\
  \ 行中实现的 `operator<` 完成了排序。你赋予了用户删除条目的选择，第 63 行演示了如何调用 `find()` 来定位该条目，并在第 66 行使用\
  \ `erase()` 将其删除。\n\n***\n\n**提示**\n> 此电话目录的实现基于 STL `set`，因此不允许包含多个相同值的条目。如果你需要你的电话目录实现允许存储两个同名的人，你应该选择\
  \ STL 的 `multiset`。如果 `setContacts` 是一个 `multiset`，之前的代码仍然可以正常工作。为了进一步利用 `multiset`\
  \ 存储多个相同值条目的的能力，你可以使用 `count()` 成员函数来获取持有特定值的数量。\n\n***\n\n### 使用 STL `set` 和 `multiset`\
  \ 的优缺点\n\nSTL `set` 和 `multiset` 在需要频繁查找的应用程序具有显著优势，因为它们的内容是有序的，因此定位速度更快。然而，为了提供这种优势，容器需要在插入时对元素进行排序。因此，插入元素时会有开销，因为元素是经过排序的——如果你经常使用\
  \ `find()` 等功能和函数，这种开销可能是值得的折中。\n\n`find()` 利用了内部二叉树结构。这种有序的二叉树结构导致了相对于 `vector`\
  \ 等顺序容器的另一个隐式劣势。在 `vector` 中，迭代器指向的元素（例如由 `std::find()` 操作返回的元素）可以被新值覆盖。但在 `set`\
  \ 中，元素由 `set` 类根据其各自的值进行排序，因此绝不应该使用迭代器覆盖元素，即使这在程序上是可行的。\n\n### STL 哈希集合（Hash Set）实现\
  \ `std::unordered_set` 和 `std::unordered_multiset`\n\nSTL `std::set` 和 STL `std::multiset`\
  \ 根据 `std::less<T>` 或提供的谓词对元素（同时也是键）进行排序。在有序容器中搜索比在 `vector` 等未排序容器中搜索更快，且 `std::sort()`\
  \ 提供了对数复杂度。这意味着在 `set` 中查找元素所花费的时间与 `set` 中的元素数量并不成正比，而是与其对对数（LOG）。因此，平均而言，在包含 10,000\
  \ 个元素的 `set` 中搜索的时间是在包含 100 个元素的 `set` 中的两倍（因为 $100² = 10000$，或 $log(10000) = 2\
  \ \\times log(100)$）。\n\n然而，相对于未排序容器（搜索与元素数量成正比）这种性能的巨大提升有时是不够的。程序员和数学家都追求常数时间的插入和排序可能性，其中一种方法使用了基于哈希的实现，使用哈希函数来确定排序索引。插入到哈希集合中的元素首先由哈希函数评估生成一个唯一索引，该索引就是它们被放置的*桶*（bucket）索引。\n\
  \nSTL 自 C++11 起提供的哈希集合变体是容器类 `std::unordered_set`。\n\n***\n\n**提示**\n> 要使用 STL 容器\
  \ `std::unordered_set` 或 `std::unordered_multiset`，请包含\n\n```cpp\n#include<unordered_set>\n\
  ```\n\n***\n\n该类的用法与 `std::set` 相比变化不大：\n\n点击此处查看代码\n\n```cpp\n// 实例化:\nunordered_set<int>\
  \ usetInt;\n\n// 插入元素\nusetInt.insert(1000);\n\n// find():\nauto elementFound =\
  \ usetInt.find(1000);\n\nif (elementFound != usetInt.end())\n    cout << *elementFound\
  \ << endl;\n```\n\n然而，`unordered_set` 的一个非常重要的特性是提供了负责决定排序的哈希函数：\n\n点击此处查看代码\n\n\
  ```cpp\nunordered_set<int>::hasher HFn = usetInt.hash_function();\n```\n\n使用 `std::unordered_set`\
  \ 还是 `std::set` 的决定最好是在涉及真实世界用法的操作和数据量的模拟中测量了相应容器的性能后做出的。列表 19.6 演示了 `std::hash_set`\
  \ 的一些常用方法的用法。\n\n**列表 19.6 `std::unordered_set` 以及 `insert()`、`find()`、`size()`、`max_bucket_count()`\
  \ 和 `load_factor()` 的用法**\n\n点击此处查看代码\n\n***\n\n```cpp\n#include<unordered_set>\n\
  #include <iostream>\nusing namespace std;\n\ntemplate <typename T>\nvoid DisplayContents(const\
  \ T& cont) {\n    cout << \"Unordered set contains: \";\n    for (auto element =\
  \ cont.cbegin(); element != cont.cend(); ++element )\n        cout << *element <<\
  \ ' ';\n    cout << endl;\n\n    cout << \"Number of elements, size() = \" << cont.size()\
  \ << endl;\n    cout << \"Bucket count = \" << cont.bucket_count() << endl;\n  \
  \  cout << \"Max load factor = \" << cont.max_load_factor() << endl;\n    cout <<\
  \ \"Load factor: \" << cont.load_factor() << endl;\n}\n\nint main() {\n    unordered_set<int>\
  \ usetInt{ 1, -3, 2017, 300, -1, 989, -300 };\n    DisplayContents(usetInt);\n \
  \   usetInt.insert(999);\n    DisplayContents(usetInt);\n\n    cout << \"Enter int\
  \ you want to check for existence in set: \";\n    int input = 0;\n    cin >> input;\n\
  \    auto elementFound = usetInt.find(input);\n\n    if (elementFound != usetInt.end())\n\
  \        cout << *elementFound << \" found in set\" << endl;\n    else\n       \
  \ cout << input << \" not available in set\" << endl;\n\n    return 0;\n}\n```\n\
