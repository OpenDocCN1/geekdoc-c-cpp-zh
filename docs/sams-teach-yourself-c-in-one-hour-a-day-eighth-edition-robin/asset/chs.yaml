  \ `deque` 相比于 `vector` 变得独特。第 36 行所示的 `pop_front()` 的用法也是如此。第 25–31 行所示的显示 `deque`\
  \ 内容的第一种机制使用了类数组语法来访问元素，而第 47–53 行演示了迭代器的用法。第 51 行使用 `distance()` 来评估元素在 `deque`\
