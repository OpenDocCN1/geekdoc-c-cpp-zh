  12:     converterStream << input;\n13:     string inputAsStr;\n14:     converterStream\
  \ >> inputAsStr;\n15:\n16:     cout << \"Integer Input = \" << input << endl;\n\
  17:     cout << \"String gained from integer = \" << inputAsStr << endl;\n18:\n\
  19:     stringstream anotherStream;\n20:     anotherStream << inputAsStr;\n21: \
