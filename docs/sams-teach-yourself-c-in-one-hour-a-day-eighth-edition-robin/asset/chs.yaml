  \n### 分析\n\n如第 67–70 行所示，`main()` 对于其生成的输出量来说非常短。`Tuna` 的实例化就足够生成这些行输了，因为你已经在所有涉及对象的构造函数和析构函数中插入了\
  \ `cout` 语句。为了理解成员变量是如何实例化和析构的，你定义了两个虚拟类 `FishDummyMember` 和 `TunaDummyMember`，并在它们的构造函数和析构函数中使用了\
  \ `cout`。\n\n输出表明，当实例化 `class Tuna` 对象时，实例化实际上是从层次结构的顶部开始的。因此，`class Tuna` 的基类 `class\
  \ Fish` 部分首先实例化，在此过程中，`Fish` 的成员——即 `Fish::dummy`——首先被实例化。随后是构造函数 `Fish`，它在诸如 `dummy`\
  \ 等成员属性被构造后执行是理理成章的。在基类构造完成后，`Tuna` 的实例化继续对成员 `Tuna::dummy` 进行实例化，最后是构造函数 `Tuna::Tuna()`\
  \ 的执行。输出证明了析构顺序恰恰相反。\n\n### 私有继承\n\n私有继承与公共继承（你目前为止所看到的）的区别在于，在派生类声明其派自基类的那行代码中，使用了\
  \ `private` 关键字：\n\n```cpp\nclass Base\n{\n    // ... 基类成员和方法\n};\nclass Derived:\
  \ private Base // 私有继承\n{\n    // ... 派生类成员和方法\n};\n```\n\n基类的私有继承意味着基类的所有公共成员和属性对于任何拥有派生类实例的人来说都是私有的（即不可访问的）。换句话说，即使是\
  \ `class Base` 的公共成员和方法，也只能由 `Derived` 实例使用。\n\n这与你一直关注的 `Tuna` 和 `Fish` 示例形成鲜明对比。[Listing\
  \ 10.1] 中的 `main()` 可以调用 `Tuna` 实例的 `Fish::Swim()`，因为 `Fish::Swim()` 是一个公共方法，且 `class\
  \ Tuna` 是通过公共继承派自 `class Fish`。\n\n因此，对于继承结构之外的世界，私有继承并不意味着“是一个”（is-a）关系（想象一条不会游泳的金鱼！）。由于私有继承允许基类属性和方法仅供派生它的子类使用，这种关系被称为“有一个”（has-a）关系。日常生活中你周围有一些私有继承的示例（参见\
  \ [Table 10.2]）。\n\n**TABLE 10.2** 生活中的私有继承示例\n\n让我们可视化汽车与其引擎之间的私有继承关系。参见 [Listing\
  \ 10.8]。\n\n**LISTING 10.8** 通过私有继承与 `class Motor` 相关的 `class Car`\n\n```cpp\n0:\
  \ #include <iostream>\n1: using namespace std;\n2:\n3: class Motor\n4: {\n5: public:\n\
  6:     void SwitchIgnition()\n7:     {\n8:         cout << \"Ignition ON\" << endl;\n\
  9:     }\n10:     void PumpFuel()\n11:     {\n12:         cout << \"Fuel in cylinders\"\
  \ << endl;\n13:     }\n14:     void FireCylinders()\n15:     {\n16:         cout\
  \ << \"Vroooom\" << endl;\n17:     }\n18: };\n19:\n20: class Car:private Motor //\
  \ 私有继承\n21: {\n22: public:\n23:     void Move()\n24:     {\n25:         SwitchIgnition();\n\
  26:         PumpFuel();\n27:         FireCylinders();\n28:     }\n29: };\n30:\n\
  31: int main()\n32: {\n33:     Car myDreamCar;\n34:     myDreamCar.Move();\n35:\n\
  36:     return 0;\n37: }\n```\n\nOutput\nIgnition ON\nFuel in cylinders\nVroooom\n\
  \n\n\n如果另一个 `class RaceCar` 必须继承自 `Car`，那么无论 `RaceCar` 和 `Car` 之间的继承性质如何，`RaceCar`\
  \ 都无法访问基类 `Motor` 的任何公共成员或函数。这是因为 `Car` 和 `Motor` 之间的关系是 `private`（私有）继承，这意味着在使用\
  \ `Car` 的实例，除 `Car` 之外的所有实体对 `Base` 的 `public` 和 `protected` 成员都只有 `private` 权限（即无访问权限）。\n\
  \n换句话说，在编译器计算一个类是否应该有权访问基类的 `public` 或 `protected` 成员时，限制性最大的访问修饰符占据主导地位。\n\n###\
  \ 保护继承 (Protected Inheritance)\n\n保护继承与公共继承的区别在于，在派生类声明继承自基类的行中使用了 `protected` 关键字：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Base\n{\n  // ... base 类成员方法\n};\n\nclass Derived:\
  \ protected Base     // 保护继承\n{\n  // ... derived class members 方法\n};\n```\n\n\
  保护继承在以下方面与私有继承相似：\n\n![Image](img/square.jpg) 它也表示一种“拥有”（has-a）的关系。\n\n![Image](img/square.jpg)\
  \ 它还允许派生类访问 `Base` 的所有 `public` 和 `protected` 成员。\n\n![Image](img/square.jpg) 拥有\
  \ `Derived` 实例的继承层次之外的实体无法访问 `Base` 的公共成员。\n\n然而，当涉及到被继承的派生类时，保护继承又有些不同：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Derived2: protected Derived\n{\n  // 可以访问 Base 的 public & protected\
  \ 成员\n};\n```\n\n保护继承层次允许子类中的子类（即 `Derived2`）访问 `Base` 的 `public` 和 `protected`\
  \ 成员，如列表 10.9 所示。如果 `Derived` 和 `Base` 之间的继承是 `private`，那么将是不可能的。\n\n**列表 10.9**\
  \ 使用 `protected` 继承派自 `class Car`，而 `class Car` 又派自 `class Motor` 的 `class RaceCar`\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ class Motor\n4: {\n5: public:\n6:    void SwitchIgnition()\n7:    {\n8:       cout\
  \ << \"Ignition ON\" << endl;\n9:    }\n10:    void PumpFuel()\n11:    {\n12:       cout\
  \ << \"Fuel in cylinders\" << endl;\n13:    }\n14:    void FireCylinders()\n15:\
  \    {\n16:       cout << \"Vroooom\" << endl;\n17:    }\n18: };\n19:\n20: class\
  \ Car:protected Motor\n21: {\n22: public:\n23:    void Move()\n24:    {\n25:       SwitchIgnition();\n\
  26:       PumpFuel();\n27:       FireCylinders();\n28:    }\n29: };\n30:\n31: class\
  \ RaceCar:protected Car\n32: {\n33: public:\n34:    void Move()\n35:    {\n36:       SwitchIgnition();\
  \  // RaceCar 有权访问成员\n37:       PumpFuel();  // 由于 \"protected\" 继承，访问基类 Motor\n\
  38:       FireCylinders(); // 存在于 RaceCar & Car, Car & Motor 之间\n39:       FireCylinders();\n\
  40:       FireCylinders();\n41:    }\n42: };\n43:\n44: int main()\n45: {\n46:    RaceCar\
  \ myDreamCar;\n47:    myDreamCar.Move();\n48:\n49:    return 0;\n50: }\n```\n\n\
  输出 ![Image](img/arrow.jpg)\n点击此处查看代码图片\nIgnition ON\nFuel in cylinders\nVroooom\n\
  Vroooom\n\n分析 ![Image](img/arrow.jpg)\n\n`class Car` 如第 20 行所示使用 `protected` 继承自\
  \ `Motor`。`class RaceCar` 如第 31 行所示使用 `protected` 继承自 `class Car`。如你所见，`RaceCar::Move()`\
  \ 的实现使用了在基类 `Motor` 中定义的公共方法。通过中间基类 `Car` 访问最终基类 `Motor` 的行为受 `Car` 和 `Motor` 之间关系的制。如果这是\
  \ `private` 而不是 `protected`，那么 `SuperClass` 将无法访问 `Motor` 的公共成员，因为编译器会选择相关访问修饰符中限制性最大的那个。请注意，`Car`\
  \ 和 `RaceCar` 类之间的关系性质对访问 `Motor` 没有影响，而 `Car` 和 `Motor` 之间的关系则有。因此，即使你将第 31 行的\
  \ `protected` 改为 `public` 或 `private`，该程序的命运也保持不变。\n\n只有在必须时才使用 `private` 或 `protected`\
  \ 继承。在大多数使用私有继承的情况下（例如 `Car` 和 `Motor` 的情况），基类完全可以作为 `class Car` 的一个成员属性，而不是超类。\n\
