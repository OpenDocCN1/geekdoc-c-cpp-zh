  \ 是 C++11 新的哈希表实现。\n\n* * *\n\n* * *\n\n## 要 (DO)\n\n**请记住** STL `set` 和 `multiset`\
  \ 容器针对频繁搜索的情况进行了优化。\n\n**请记住** `std::multiset` 允许多个相同的元素（键），而 `std::set` 仅允许唯一值。\n\
  \n**请使用** `multiset::count(value)` 来查找特定值 `value` 的元素个数。\n\n**请记住** `set::size()`\
  \ 或 `multiset::size()` 返回的是容器中元素的数量。\n\n* * *\n\n* * *\n\n### 不要 (DON’T)\n\n**不要忘记**为可以收纳在\
  \ `set` 或 `multiset` 等容器中的类编写 `operator<` 和 `operator==`。前者作为排序谓词，而后者用于 `set::find()`\
  \ 等函数。\n\n**不要**在频繁插入和低频率搜索的场景下中使用 `std::set` 或 `std::multiset`。`std::vector` 或\
  \ `std::list` 通常更适合此类情况。\n\n* * *\n\n### 总结\n\n在本节中，你学习了如何使用 STL `set` 和 `multiset`、它们重要的成员函数以及它们的特性。你还看到了它们在编写简单的基于菜单的电话录中的应用，该电话录还包含搜索和删除功能。\n\
  \n## 问答 (Q&A)\n\n**问：如何声明一个按降序排序并存储的整数集合？**\n\n**答** `set<int>` 是一个整数 `set`。它使用默认的排序谓词\
  \ `std::less<T>` 按升序顺序排序项，也可以表示为 `set<int, less<int>>`。若要按降序排序，请将 `set` 定义为 `set<int,\
  \ greater<int>>`。\n\n**问：如果我在字符串集合中插入两次字符串 \"Jack\"，会发生什么？**\n\n**答** `set` 的设计目的不是用于包含非唯一值。该字符串集合将只包含一个\
  \ `\"Jack\"` 。\n\n**问：在前面的示例中，如果我想有两个 \"Jack\" 实例，我应该修改什么？**\n\n**答** 根据设计，`set`\
  \ 只持有唯一值。你需要将选择的容器改为 `multiset`。\n\n**问：哪一个 multiset 成员函数返回容器中特定值的计数？**\n\n**答**\
  \ `count(value)` 是我们感兴趣的函数。\n\n**问：我使用 `find()` 函数在集合中找到了一个元素并获得了一个指向它的迭代器。我会使用这个迭代器来更改所指向的值吗？**\n\
  \n**答** 不会。某些 STL 实现可能允许用户通过例如 `find` 返回的迭代器来更改 `set` 内部元素的值。然而，这不是正确的做法。指向 `set`\
  \ 中元素的迭代器应该作为 `const` 迭代器使用——即使 STL 实现没有强制要求这样做。\n\n## 工作坊 (Workshop)\n\n工作坊包含测验题，以帮助你巩固对所涵盖内容的理解，并提供练习让你获得使用所学知识的经验。在检查附录\
