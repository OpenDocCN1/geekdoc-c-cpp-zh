  \n第 15–21 行显示了 `find()` 成员函数的用法。`find()` 返回一个迭代器，需要与 `end()` 进行比较（如第 18 行所示），以验证是否找到了该元素。如果迭代器有效，你可以使用\
  \ `*elementFound` 访问它所指向的值。\n\n***\n\n### 注意\n\nListing 19.3 中的示例对于 `multiset` 同样可以工作；也就是说，如果第\
