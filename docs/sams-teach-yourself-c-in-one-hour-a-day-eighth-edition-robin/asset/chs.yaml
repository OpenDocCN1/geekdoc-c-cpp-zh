  \ 包含 `int` 类型的对象，移动成本较低。\n\n### 提示\n\n如果你的容器需要频繁在中间插入，理想情况下你应该选择 第 18  中解释的 STL\
  \ list 和 forward_list。\n\n### 使用数组语义访问 Vector 中的元素\n\n可以使用以下方法访问 vector 中的元素：通过下标运算符\
  \ (`[]`) 使用数组语义，使用成员函数 `at()`，或使用迭代器。\n\n列表 17.1 演示了如何创建一个初始化了 10 个元素的 vector 实例：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::vector <int> tenElements (10);\n```\n\n你可以使用数组的语法访问并设置单个元素：\n\
  \n点击此处查看代码图像\n\n```cpp\ntenElements[3] = 2011; // 设置第 4 个元素\n```\n\n列表 17.4 演示了如何使用下标运算符\
  \ (`[]`) 访问 vector 中的元素。\n\n**列表 17.4 使用数组语义访问 vector 中的元素**\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: #include <vector>\n2:\n3: int main ()\n4: {\n5:    using\
