  \    max = num1;\nelse\n    max = num2;\n```\n\n### `while` 循环\n\nC++ 关键字 `while`\
  \ 可以帮助实现 `goto` 所做的功能，其语法如下：点击此处查看代码图像\n\n```cpp\nwhile(expression)\n{\n    // Expression\
