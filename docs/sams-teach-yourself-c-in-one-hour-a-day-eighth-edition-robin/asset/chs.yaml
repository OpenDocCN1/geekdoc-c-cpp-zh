  \ displayed\n\n![Image](img/arrow.jpg) 代码示例演示了第 25 行和 38 行调用的 `for_each()` 的用途，且\
  \ `for_each()` 返回的函数对象 `functor` 被设计为将其调用次数存储在 `count` 中。代码包含两个示例范围，一个包含整数向量 `numsInVec`\
  \ 中，另一个是 `std::string` 对象 `str`。第一次调用 `for_each()` 使用 `DisplayElementKeepCount`\
  \ 作为一元谓词，第二次则使用 lambda 表达式。`for_each()` 对所给范围内的每个元素调用 `operator()`，这反过来会将元素打印到屏幕上并增加一个内部计数器。`for_each()`\
  \ 完成后返回该函数对象，成员 `count` 告诉该对象被使用的次数。这种在算法返回的对象中存储信息（或状态）的功能在实际编程中非常有用。第 38 行的 `for_each()`\
  \ 对 `std::string` 的操作与第 25 行的对应项完全相同，只是使用了 lambda 表达式而不是函数对象。\n\n### 使用 `std::transform()`\
  \ 对范围进行转换\n\n`std::for_each()` 和 `std::transform()` 的相似之处在于它们都会对源范围内的每个元素调用函数对象。然而，`std::transform()`\
  \ 有两个版本。第一个版本接受一个一元函数，常用于使用 `toupper()` 或 `tolower()` 函数将字符串转换为大或小写：\n\n点击此处查看代码图像\n\
  \n```cpp\nstring str (\"THIS is a TEst string!\");\ntransform (str.cbegin(), //\
  \ start source range\n           str.cend(), // end source range\n           strLowerCaseCopy.begin(),\
  \ // start range\n           ::tolower); // unary function\n```\n\n第二个版本接受一个二元函数，允许\
  \ `transform()` 处理取自两个不同范围的一对元素：\n\n点击此处查看代码图像\n\n```cpp\n// 将两个向量的元素求并将结果存储在 deque\
  \ 中\ntransform (numsInVec1.cbegin(), // start of source range 1\n           numsInVec1.cend(),\
  \   // end of source range 1\n           numsInVec2.cbegin(), // start of source\
  \ range 2\n           sumInDeque.begin(), // store result in a deque\n         \
  \  plus<int>()); // binary function plus\n```\n\n`transform()` 的两个版本总是将指定转换函数的结果赋值给提供的目标范围，而\
  \ `for_each()` 不同，后者只作用于单一范围。`std::transform()` 的用法在列表 23.7 中所示。\n\n**列表 23.7**\
  \ 使用一元和二元函数 `std::transform()`\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n\
  1: #include <string>\n2: #include <vector>\n3: #include <iostream>\n4: #include\
  \ <functional>\n5:\n6: int main()\n7: {\n8:     using std;\n9:\n10:    string str\
  \ (\"THIS is a TEst string!\");\n11:    cout << \"The string is: \" << str << endl;\n\
  12:    string strLowerCaseCopy;\n13:    strLowerCaseCopy.resize(str.size());\n14:\n\
  15:    transform (str.cbegin(), // start range\n16:               str.cend(), //\
  \ end source range\n17:               strLowerCaseCopy.begin(), // start range\n\
  18:               ::tolower); // unary function\n19:\n20:    cout << \"Result of\
  \ 'transform' on the string with 'tolower':\" << endl;\n21:    cout << \"\\\"\"\
  \ << strLowerCaseCopy << \"\\\"\" << endl << endl;\n22:\n23:    // 两个整数向量...\n24:\
  \    vector<int> numsInVec1{ 2017, 0, -1, 42, 10101, 25 };\n25:    vector<int> numsInVec2\
  \ (numsInVec1.size(), -1);\n26:\n27:    // 用于存储加法结果的目标范围\n28:    deque <int> sumInDeque\
  \ (numsInVec1.size());\n29:\n30:    transform (numsInVec1.cbegin(), // start of\
  \ source range 1\n31:               numsInVec1.cend(),   // end of source range\
  \ 1\n32:               numsInVec2.cbegin(), // start of source range 2\n33:    \
  \           sumInDeque.begin(), // store result in a deque\n34:               plus<int>());\
  \ // binary function plus\n```\n\n\n\n 标签中。\n\n[content]\n\n```cpp\n35:        \
  \     sumInDeque.begin(),   // start of dest range\n36:             plus<int>());\
  \              // binary function\n37:\n38:      cout << \"Result of 'transform'\
  \ using binary function 'plus': \" << endl;\n39:      cout << \"Index   Vector1\
  \ + Vector2 = Result (in Deque)\" << endl;\n40:      for (size_t index = 0; index\
  \ < numsInVec1.size(); ++ index)\n41:      {\n42:          cout << index << \" \
  \    \\t \" << numsInVec1 [index]   << \"\\t+   \";\n43:          cout << numsInVec2\
  \ [index]  << \" \\t  =    \";\n44:          cout << sumInDeque [index] << endl;\n\
  45:      }\n46:\n47:      return 0;\n48: }\n```\n\n\n\n\n\nListing 23.8 展示了 `remove()`\
  \ 和 `remove_if()` 都返回一个指向容器新末尾的迭代器。然而，容器 `numsInVec` 尚未被调整大小。元素已经通过 `remove` 算法被删除，其他元素已向前移动，但\
  \ `size()` 保持不变，这意味着向量（vector）的末尾仍然存在值。若要调整容器的大小（这非常重要，否则末尾会产生多余的值），你需要在随后的 `erase()`\
  \ 调用中使用 `remove()` 或 `remove_if()` 返回的迭代器，如代码 所示的第 41 行和第 46 行所示。\n\n***\n\n## 替换值和根据条件替换元素\n\
  \n### 替换值和根据条件替换元素\n\n`replace()` 和 `replace_if()` 分别是 STL 算法，可以替换集合中与给定值相等或满足给定条件的元素。`replace()`\
  \ 根据比较操作符（`==`）的返回值替换元素：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Using 'std::replace'\
  \ to replace value 5 by 8\" << endl;\nreplace (numsInVec.begin (), numsInVec.end\
  \ (), 5, 8);\n```\n\n`replace_if()` 期望一个用户指定的一元谓词，该谓词对每个需要替换的值返回 `true`：\n\n点击此处查看代码图像\n\
  \n```cpp\ncout << \"Using 'std::replace_if' to replace even values by -1\" << endl;\n\
  replace_if (numsInVec.begin (), numsInVec.end (),\n    [](int element) {return ((element\
  \ % 2) == 0); }, -1);\n```\n\n这些函数的用法在 Listing 23.9 中给出。\n\n**列表 23.9** 使用 `replace()`\
  \ 和 `replace_if()` 替换指定范围内的值\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: #include <algorithm>\n2: #include <vector>\n3: using namespace std;\n4:\n5: template\
  \ <typename T>\n6: void DisplayContents(const T& container)\n7: {\n8:     for (auto\
  \ element = container.cbegin();\n9:             element != container.cend();\n10:\
  \             ++ element)\n11:         cout << *element << ' ';\n12:\n13:     cout\
  \ << \"| Number of elements: \" << container.size() << endl;\n14: }\n15:\n16: int\
  \ main ()\n17: {\n18:     vector <int> numsInVec (6);\n19:\n20:     // 用值 8 填充前\
  \ 3 个元素，后 3 个填充 5\n21:     fill (numsInVec.begin (), numsInVec.begin () + 3, 8);\n\
  22:     fill_n (numsInVec.begin () + 3, 3, 5);\n23:\n24:     // 打乱容器\n25:     random_shuffle\
  \ (numsInVec.begin (), numsInVec.end ());\n26:\n27:     cout << \"The initial contents\
  \ of vector: \" << endl;\n28:     DisplayContents(numsInVec);\n29:\n30:     cout\
  \ << endl << \"'std::replace' value 5 by 8\" << endl;\n31:     replace (numsInVec.begin\
  \ (), numsInVec.end (), 5, 8);\n32:\n33:     cout << \"'std::replace_if' even values\
  \ by -1\" << endl;\n34:     replace_if (numsInVec.begin (), numsInVec.end (),\n\
  35:         [](int element) {return ((element % 2) == 0); }, -1);\n36:\n37:    \
  \ cout << endl << \"Vector after replacements:\" << endl;\n38:     DisplayContents(numsInVec);\n\
  39:\n40:     return 0;\n41: }\n```\n\n***\n\n![Image](img/arrow.jpg)\n点击此处查看代码图像\n\
  \nvector 的初始内容:\n5 8 5 8 5 | Number of elements: 6\n`std::replace` value 5 by 8\n\
  `std::replace_if` even values by -1\n替换后的 vector:\n-1 -1 -1 -1 -1 | Number of elements:\
  \ 6\n\n示例使用示例值填充了 `vector<int>`，然后使用 STL 算法 `random_shuffle()` 对其进行洗乱，如第 25 行所示。第\
  \ 31 行演示了如何使用 `replace()` 将所有 5 替换为 8。因此，当第 34 行的 `replace_if()` 将所有偶数替换为 -1 时，最终结果是该集合包含六个元素，且所有元素都包含相同的值\
  \ -1，如输出所示。\n\n### 在排序集合中排序和查找以及删除重复项\n\n对排序范围进行排序和查找（出于性能考虑）是应用中经常出现的需求。通常你你有一个需要排序的信息数组，例如为了演示的目的。你可以使用\
  \ STL 的 `sort()` 算法对容器进行排序：\n\n```cpp\nsort (numsInVec.begin (), numsInVec.end());\
  \ // 升序\n```\n\n`sort()` 的这个版本使用 `less<>` 谓词，它是由类型实现的。你可以提供自己的谓词来更改 vector 的排序顺序：\n\
  \n```cpp\nsort (numsInVec.begin (), numsInVec.end (),\n    [](int lhs, int rhs)\
  \ {return lhs > rhs;} // 降序\n```\n\n同样，在显示集合之前需要删除相邻的重复值，请使用 `unique()`：\n\n```cpp\n\
  auto newEnd = unique (numsInVec.begin (), numsInVec.end ());\nnumsInVec.erase (newEnd,\
  \ numsInVec.end())); // resize\n```\n\n为了快速查找，STL 提供了 `binary_search()`，它仅对排序后的容器有效：\n\
  \n```cpp\nbool elementFound = binary_search (numsInVec.begin (), numsInVec.end (),\
  \ \"John\");\nif (elementFound)\n    cout << \"Element found in the vector!\" <<\
  \ endl;\n```\n\nListing 23.10 展示了 STL 算法：`sort()` 可以对范围进行排序，`binary_search()` 可以在排序范围上进行查找，而\
  \ `unique()` 可以消除在 `sort()` 操作后相邻的重复值。\n\n**列表 23.10** 使用 `sort()`、`binary_search()`\
  \ 和 `unique()`\n\n***\n\n（代码块见上文）\n\n\n\n\n前面的代码首先在第 26 行对样本向量 `vecNames` 进行排序，然后使用第\
  \ 30 行的 `binary_search()` 在其中查找 `\"John\"`。同样，第 39 行使用 `std::unique()` 来删除相邻重复元素的第二次出现的项。请注意，`unique()`\
  \ 像 `remove()` 一样，不会调整容器的大小。它会导致值发生移动，但不会减少元素的总数。为了确保容器末尾没有多余或未定义的值，请务必在调用 `unique()`\
  \ 之后，使用 `unique()` 返回的迭代器跟随调用 `vector::erase()`，如第 40 行所示。\n\n### 注意事项\n`binary_search()`\
  \ 等算法仅在排序过的容器中有效。在未排序的向量上使用此算法可能会导致不符合期的结果。\n\n### 备注\n`stable_sort()` 的用法与你之前看到过的\
  \ `sort()` 相同。`stable_sort()` 确保了排序后元素的相对顺序保持不变。保持相对顺序是以性能为代价的——这是一个需要牢记的因素，特别是当元素的相对顺序并非至关重要时。\n\
  \n### 划分范围\n`std::partition()` 有助于将输入范围划分为两个部分：一个满足一元谓词的部分以及另一个不满足的部分：\n\n点击此处查看代码图像\n\
  \n```cpp\nbool IsEven (const int& num)  // 一元谓词\n\n{\n    return ((num % 2) == 0);\n\
  }\n\n...\n\npartition (numsInVec.begin(), numsInVec.end(), IsEven);\n```\n\n然而，`std::partition()`\
  \ 不保证每个划分区域内元素的相对顺序。当相对顺序很重要时，为了保持它，你应该使用 `std::stable_partition()`：\n\n点击此处查看代码图像\n\
  \n```cpp\nstable_partition (numsInVec.begin(), numsInVec.end(), IsEven);\n```\n\n\
  列表 23.11 展示了这些算法的用法。\n\n**列表 23.11** 使用 `partition()` 和 `stable_partition()` 将整数范围划分为偶数和奇数值\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n2: #include\
  \ <iostream>\n3: using namespace std;\n4:\n5: bool IsEven (const int& num) // 一元谓词\n\
  6: {\n7:     return ((num % 2) == 0);\n8: }\n9:\n10: template <typename T>\n11:\
  \ void DisplayContents(const T& container)\n12: {\n13:     for (auto element = container.cbegin();\n\
  14:     element != container.cend();\n15:     ++element)\n16:     cout << *element\
  \ << ' ';\n17:\n18:     cout << \"| Number of elements: \" << container.size() <<\
  \ endl;\n19: }\n20: int main ()\n21: {\n22:     vector<int> numsInVec{ 2017, 0,\
  \ -1, 42, 10101, 25 };\n23:\n24:     cout << \"The initial contents: \" << endl;\n\
  25:     DisplayContents(numsInVec);\n26:     vector<int> vecCopy (numsInVec);\n\
  27:\n28:     cout << \"The effect of partition():\" << endl;\n29:     partition\
  \ (numsInVec.begin(), numsInVec.end(), IsEven);\n30:     DisplayContents(numsInVec);\n\
  31:\n32:     cout << \"The effect of stable_partition():\" << endl;\n33:     stable_partition\
  \ (vecCopy.begin(), vecCopy.end(), IsEven);\n34:     DisplayContents(vecCopy);\n\
  35:\n36:     return 0;\n37: }\n```\n\n输出 ![Image](img/arrow.jpg)\n点击此处查看代码图像\n初始内容:\n\
  2017 0 -1 42 10101 25 | Number of elements: 6\npartition() 的效果:\n42 0 -1 2017 10101\
  \ 25 | Number of elements: 6\nstable_partition() 的效果:\n0 42 2017 -1 10101 25 | Number\
  \ of elements: 6\n\n分析 ![Image](img/arrow.jpg)\n该代码将包含在向量 `numsInVec` 中的整数范围划分为偶数和奇数值。这种划分首先通过\
