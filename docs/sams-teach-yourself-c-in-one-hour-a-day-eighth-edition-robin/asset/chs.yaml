  \ 标志的对象，每个标志的值都为 `true`。第 13 行演示了如何将一个 `vector<bool>` 拷贝。\n\n### `vector<bool>`\
  \ 函数与运算符\n\n`vector<bool>` 通过 `operator[]` 访问位就像普通 vector 一样。`vector<bool>` 的 `flip()`\
  \ 方法翻转标志位，如列表 25.4 所示。\n\n**列表 25.4 使用 `vector<bool>`**\n\n点击此处查看代码图像\n\n```cpp\n\
