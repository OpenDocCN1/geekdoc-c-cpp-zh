  \ contents of fiveBits: 10101\nInitial contents of sixBits: 100001\nInitial contents\
  \ of eightBits: 11111111\n```\n\n### 使用 `bitset` 及其成员\n\n`bitset` 类提供了帮助向 `bitset`\
  \ 插入、设置或重置内容、读取位或写入流的成员函数。它还提供了显示 `bitset` 内容并进行位操作的运算符。\n\n#### `std::bitset` 中的有用运算符\n\
  \n你在第 12 节 中学习了运算符，并且了解到运算符最重要的作用是增加类的可用性。`std::bitset` 提供了一些非常有用的运算符，如列表 25.1 中的示例\
  \ `fourBits` 所示，这使得使用变得非常简单。\n\n**表格 25.1** bitset 支持的运算符\n\n除了这些，`bitset` 还具有如\
  \ `|=`、`&=`、`^=` 和 `~=` 等运算符，有助于对 `bitset` 对象进行位操作。\n\n#### `bitset` 成员方法\n\n位可以持有两种状态：被设置为（1）或重置（0）。为了帮助操作\
  \ `bitset` 的内容，你可以使用表格 25.2 列出的成员函数，这些函数可以帮助你处理一个 `bit` 或 `bitset` 中的所有位。\n\n**表格\
  \ 25.2** `std::bitset` 的成员方法\n\n这些成员方法和运算符的使用在列表 25.2 中进行了演示。\n\n\n\n\n\n```cpp\n\
  cout << \"Num 0s you supplied: \";\ncout << inputBits.size () - inputBits.count\
  \ () << endl;\n\nbitset <8> inputFlipped (inputBits);  // copy\ninputFlipped.flip\
  \ ();  // toggle the bits\n\ncout << \"Flipped version is: \" << inputFlipped <<\
  \ endl;\ncout << \"Result of AND, OR and XOR between the two:\" << endl;\ncout <<\
  \ inputBits << \" & \" << inputFlipped << \" = \";\ncout << (inputBits & inputFlipped)\
  \ << endl;  // bitwise AND\n\ncout << inputBits << \" | \" << inputFlipped << \"\
  \ = \";\ncout << (inputBits | inputFlipped) << endl;  // bitwise OR\n\ncout << inputBits\
  \ << \" ^ \" << inputFlipped << \" = \";\ncout << (inputBits ^ inputFlipped) <<\
  \ endl; // bitwise XOR\n\nreturn 0;\n}\n```\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \n输入一个 8 位的序列：10110101\n\n你提供的 1 的数量：5\n\n你提供的 0 的数量：3\n\n翻转后的版本：01001010\n\n两者之间与、或、异或运算的结果：\n\
  \n10110101 & 01001010 = 00000000\n\n10110101 | 01001010 = 11111111\n\n10110101 ^\
  \ 01001010 = 11111111\n\n### 分析\n\n![Image](img/arrow.jpg)\n\n这个交互式程序不仅演示了使用 `std::bitset`\
  \ 在两个位序列之间进行位运算是多么简单，还展示了其 `stream` 运算符的用处。`std::bitset` 实现的位移运算符（`>>` 和 `<<`）使得向屏幕写入位序列以及以字符串格式从用户读取位序列成为一项简单任务。`inputBits`\
  \ 包含了用户在第 10 行中输入的序列。第 12 行使用的 `count()` 用于获取序列中 1 的数量，而 0 的数量则是通过计算 `size()`（返回位\
  \ set 中的位数）与 `count()` 之间的差值得出的，如第 14 行所示。`inputFlipped` 在开头是 `inputBits` 的副本，然后在第\
  \ 17 行使用 `flip()` 进行了翻转。它现在包含了每个比特位都已翻转的序列——即取了反反（0 变成 1，反之亦然）。程序的其余部分演示了两个 bitset\
  \ 之间位与、位或和位异或运算的结果。\n\n### 注意事项\n\nSTL `bitset<>` 的缺点之一是无法动态调整自身大小。你只能在编译时已知序列中要存储的位数时才使用\
  \ `bitset`。\n\nSTL 为程序员提供了 `vector<bool>` 类（在某些 STL 的实现中也称为 `bit_vector`），它克服了这一缺点。\n\
  \n### `vector<bool>`\n\n`vector<bool>` 是 `std::vector` 的部分特化，旨在用于存储 `boolean` 数据。该类能够动态调整自身大小。因此，程序员不需要在编译时知道要存储多少个\
  \ `boolean` 标志。\n\n### 提示\n\n要使用类 `std::vector<bool>`，请包含头文件：\n\n```cpp\n#include\
  \ <vector>\n```\n\n### 实例化 `vector<bool>`\n\n实例化一个 `vector<bool>` 与 vector 类似，有一些方便的重载：\n\
  \n```cpp\nvector <bool> boolFlags1;\n```\n\n例如，你可以创建一个初始包含 10 个布尔值的 vector，每个值都初始化为\
  \ 1（即 true）：\n\n点击此处查看代码图像\n\n```cpp\nvector <bool> boolFlags2 (10, true);\n```\n\
  \n你也可以创建一个另一个对象的拷贝作为对象：\n\n点击此处查看代码图像\n\n```cpp\nvector <bool> boolFlags2Copy (boolFlags2);\n\
  ```\n\n`vector<bool>` 的某些实例化技术在列表 25.3 中有所演示。\n\n**列表 25.3 `vector<bool>` 的实例化**\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <vector>\n\nint main ()\n{\n  using std;\n\n  //\
  \ 使用默认构造函数实例化一个对象\n  vector <bool> boolFlags1;\n\n  // 初始化一个包含 10 个 true 元素的 vector\n\
