  \ value)\n{\n   // ...\n}\n```\n\n## 第 11 Lesson：多态\n\n在学习了继承的基础、创建继承体系，并理解了公共继承本质上模拟了一种“是一种”（is-a）关系后，是时候运用这些知识来学习面向对象编程的圣杯：多态了。\n\
  \n在本节中，你将了解到：\n\n- ![Image](img/square.jpg) 多态的真正含义是什么\n- ![Image](img/square.jpg)\
  \ 虚函数的作用是什么以及如何使用它们\n- ![Image](img/square.jpg) 什么是抽象基类以及如何声明它们\n- ![Image](img/square.jpg)\
  \ 虚继承意味着什么以及在何处需要它\n\n## 多态的基础\n\n“Poly”是希腊语中“*多*”的意思，而“morph”意味着“*形式*”。多态是面向对象语言的一种特性，允许不同类型的对象以相似的方式对待。本节重点关注通过\
  \ C++ 继承体系实现的多态行为，也称为*子类型多态*。\n\n### 多态行为的需求\n\n在 Lesson 10 “[实现继承，”中，你发现了 `Tuna`\
  \ 和 `Carp` 是如何如列表 10.1 所示从 `Fish` 继承公共方法 `Swim()`。然而，`Tuna` 和 `Carp` 也可能提供自己的 `Tuna::Swim()`\
  \ 和 `Carp::Swim()` 方法，使它们成为不同的游泳者。尽管如此，由于它们每一个也是 `Fish`，如果一个拥有 `Tuna` 实例的用户使用基类类型来调用\
  \ `Fish::Swim()`，他最终只执行了通用的部分 `Fish::Swim()` 而不是 `Tuna::Swim()`，即使该基类实例 `Fish` 是\
  \ `Tuna` 的一部分。这个问题在列表 11.1 中得到了演示。\n\n***\n\n> 注意\n> 本节中的所有代码示例已精简到解释相关主题所需的最核心内容，并尽可能减少代码行数以提高可读性。\n\
  >\n> 在编写程序时，你应该正确地编写类并创建有意义的继承体系，同时考虑到应用程序的设计和目的。\n\n***\n\n**列表 11.1** 使用属于 `Tuna`\
  \ 的基类 `Fish` 实例来调用方法\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1:\
  \ using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     void Swim()\n\
  7:     {\n8:         cout << \"Fish swims! \" << endl;\n9:     }\n10: };\n11:\n\
  12: class Tuna:public Fish\n13: {\n14: public:\n15:     // override Fish::Swim\n\
  16:     void Swim()\n17:     {\n18:         cout << \"una swims!\" << endl;\n19:\
  \     }\n20: };\n21:\n22: void MakeFish(Fish& inputFish)\n23: {\n24:     // calling\
  \ Fish::Swim\n25:     inputFish.Swim();\n26: }\n27:\n28: int main()\n29: {\n30:\
  \     Tuna myDinner;\n31:\n32:     // calling Tuna::Swim\n33:     myDinner.Swim();\n\
  34:\n35:     // sending Tuna as Fish\n36:     MakeFishSwim(myDinner);\n37:\n38:\
  \     return 0;\n39: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\nuna swims!\nFish\
  \ swims!\n\n分析 ![Image](img/arrow.jpg)\n`class Tuna` 通过如第 12 行所示的公共继承特化了 `class\
  \ Fish`。它还重写了 `Fish::Swim()`。`main` 函数通过属于 `Tuna` 的基类 `Fish` 实例调用方法，如第 33 行所示。`MakeFishSwim`\
  \ 将 `Tuna` 作为 `Fish` 传递，如第 25 行所示，它最终只执行了通用的部分 `Fish::Swim()` 而不是 `Tuna::Swim()`，即使该基类实例\
  \ `Fish` 是 `Tuna` 的一部分。\n\n***\n\n通过虚函数实现多态\n\n你通过 `Fish` 指针或 `Fish&` 引用访问 `Fish`\
  \ 类型的对象，如下：\n\n```cpp\npFish->Swim();\nmyFish.Swim();\n```\n\n多态 ` `Fish` 声明 ` `\
  \ ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` `\n`  `\n\n\n\n\n\n1 此处此处 1ch111_..\nch10pro32\n\
  \n```\n\n你期望的是一个 `Tuna` 类型的对象执行 `Swim()`，即使它被声明为 `Fish`。\n\n在 `Fish` 类中中 ` `()`()`\
  \ `虚`，可以可以编译器编译器任何任何变变被被调用，如列表 11.2\n\n。\n\n**列表 11.2** 将 `Fish::Swim()` 声明为 `virtual`\
  \ 方法的效果\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     virtual void Swim()\n7:    \
  \ {\n8:         cout << \"Fish swims!\" << endl;\n9:     }\n10: };\n11:\n12: class\
  \ Tuna:public Fish\n13: {\n14: public:\n15:     // override Fish::Swim\n16:    \
  \ void Swim()\n17:     {\n18:         cout << \"Tuna swims!\" << endl;\n19:    \
  \ }\n20: };\n21:\n22: class Carp:public Fish\n23: {\n24: public:\n25:     // override\
  \ Fish::Swim\n26:     void Swim()\n27:     {\n28:         cout << \"Carp swims!\"\
  \ << endl;\n29:     }\n30: };\n31:\n32: void MakeFish(Fish& inputFish)\n33: {\n\
  34:     // calling virtual method Swim()\n35:     inputFish.Swim();\n36: }\n37:\n\
  38: int main()\n39: {\n40:     Tuna myDinner;\n41:     Carp myLunch;\n42:\n43: \
  \    // sending Tuna as Fish\n44:     MakeFish(myDinner);\n45:\n46:     // sending\
  \ Carp as Fish\n47:     MakeFish(myLunch);\n48:\n49:     return 0;\n50: }\n```\n\
  \n\n\n\n\n函数 `MakeFishSwim(Fish&)` 的实现自列表 11.1 以来没有发生任何变化。然而，它产生的输出截然不同。其一，`Fish::Swim()`\
  \ 完全没有被调用，因为存在重写的变体 `Tuna::Swim()` 和 `Carp::Swim()`，这些它们的优先级高于 `Fish::Swim()`，因为后者被声明为\
  \ `virtual`（虚）函数。这是一个非常重要的进展。这意味着即使不知道正在处理的 `Fish` 的确切类型，仅凭一个基类实例，实现 `MakeFishSwim()`\
  \ 也可以调用在不同派生类中定义的不同 `Swim()` 实现。\n\n这就是多态性：将不同的鱼视为一种共同类型 `Fish`，同时确保执行由派生类型提供的正确\
  \ `Swim()` 实现。\n\n## 虚析析构函数的必要性\n\n列表 11.1 中展示的特性还有一个更阴险的一面——当存在特化版本时，无意中调用了派生类型实例的基类功能。当一个函数使用类型为\
  \ `Base*` 的指针调用运算符 `delete`，而该指针实际上指向类型为 `Derived` 的实例时，会发生什么？\n\n将调用哪个析构函数？参见列表\
  \ 11.3。\n\n**列表 11.3** 一个在 `Base*` 上调用运算符 `delete` 的函数\n\n点击此处查看代码图像\n\n***\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n\
  5: public:\n6:     Fish()\n7:     {\n8:         cout << \"Constructed Fish\" <<\
  \ endl;\n9:     }\n10:    ~Fish()\n11:    {\n12:         cout << \"Destroyed Fish\"\
  \ << endl;\n13:    }\n14: };\n15:\n16: class Tuna:public Fish\n17: {\n18: public:\n\
  19:     Tuna()\n20:     {\n21:         cout << \"Constructed Tuna\" << endl;\n22:\
  \     }\n23:     ~Tuna()\n24:     {\n25:         cout << \"Destroyed Tuna\" << endl;\n\
  26:     }\n27: };\n28:\n29: void DeleteFishMemory(Fish* pFish)\n30: {\n31:     delete\
  \ pFish;\n32: }\n33:\n34: int main()\n35: {\n36:     cout << \"Allocating a Tuna\
  \ on the free store:\" << endl;\n37:     Tuna* pTuna = new Tuna;\n38:     cout <<\
  \ \"Deleting the Tuna: \" << endl;\n39:     DeleteFishMemory(pTuna);\n40:\n41: \
  \    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:     Tuna myDinner;\n\
  43:     cout << \"Automatic destruction as it goes out of scope: \" << endl;\n44:\n\
  45:     return 0;\n46: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nAllocating a Tuna on the free store:\nConstructed Fish\nConstructed Tuna\nDeleting\
  \ the Tuna:\nDestroyed Fish\nInstantiating a Tuna on the stack:\nConstructed Fish\n\
  Constructed Tuna\nAutomatic destruction as it goes out of scope:\nDestroyed Tuna\n\
  Destroyed Fish\n\n分析 ![Image](img/arrow.jpg)\n\n`main()` 在第 37 行使用 `new` 在自由存储上创建了一个\
  \ `Tuna` 实例，并在第 39 行使用服务函数 `DeleteFishMemory()` 后立即释放了分配的内存。为了对比，另一个 `Tuna` 实例作为局部变量\
  \ `myDinner` 创建在栈上，并在 `main()` 结束时离开作用域。输出是由 `Fish` 和 `tuna` 类构造函数和析构函数中的 `cout`\
  \ 语句产生的。注意，虽然 `una` 和 `Fish` 都由于 `new` 在自由存储上被构建了，但在 `delete` 期间没有调用 `una` 的析构函数，只调用了\
  \ `Fish` 的。这与局部变量 `myDinner` 的构建和析形成鲜明对比，后者的所有构造函数和析构函数都被调用了。第 10  在列表 10.7 中演示了继承层次结构中类的构建和析构正确顺序，显示所有析构函数都需要被调用，包括\
  \ `~una()`。显然，有些不对。\n\n这个缺陷意味着如果使用 `new` 在自由存储上实例化一个派生类，然后使用类型为 `Base*` 的指针调用 `delete`，该析构函数将不会被调用。这可能导致资源未释放、内存泄漏等，这是一个不容忽视的问题。\n\
  \n为了避免这个问题，你使用如列表 11.4 所示的 `virtual` 析构函数。\n\n**列表 11.4** 使用 `virtual` 析构函数确保在删除类型为\
  \ `Base*` 的指针时调用派生类中的析构函数\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     Fish()\n7:\
  \     {\n8:         cout << \"Constructed Fish\" << endl;\n9:     }\n10:    virtual\
  \ ~Fish() // 虚析构函数\n11:    {\n12:         cout << \"Destroyed Fish\" << endl;\n\
  13:    }\n14: };\n15:\n16: class Tuna:public Fish\n17: {\n18: public:\n19:     Tuna()\n\
  20:     {\n21:         cout << \"Constructed Tuna\" << endl;\n22:     }\n23:   \
  \  ~Tuna()\n24:     {\n25:         cout << \"Destroyed Tuna\" << endl;\n26:    \
  \ }\n27: };\n28:\n29: void DeleteFishMemory(Fish* pFish)\n30: {\n31:     delete\
  \ pFish;\n32: }\n33:\n34: int main()\n35: {\n36:     cout << \"Allocating a Tuna\
  \ on the free store:\" << endl;\n37:     Tuna* pTuna = new Tuna;\n38:     cout <<\
  \ \"Deleting the Tuna: \" << endl;\n39:     DeleteFishMemory(pTuna);\n40:\n41: \
  \    cout << \"Instantiating a Tuna on the stack:\" << endl;\n42:     Tuna myDinner;\n\
  43:     cout << \"Automatic destruction as it goes out of scope: \" << endl;\n44:\n\
  45:     return 0;\n46: }\n```\n\n***\n\n输出 ![Image](img/arrow.jpg)\n\n点击此处查看代码图像\n\
  \nAllocating a Tuna on the free store:\nConstructed Fish\nConstructed Tuna\nDeleting\
  \ the Tuna:\nDestroyed Tuna\nDestroyed Fish\nInstantiating a Tuna on the stack:\n\
  Constructed Fish\nConstructed Tuna\nAutomatic destruction as it goes out of scope:\n\
  Destroyed Tuna\nDestroyed Fish\n\n分析 ![Image](img/arrow.jpg)\n\n列表 11.4 相比列表 11.3\
  \ 的唯一改进是在第 10 行声明基类 `class Fish` 析构函数时增加了 `virtual` 关键字。注意，这一微小的变化使得对实际指向 `Tuna`\
  \ 的 `Fish*` 调用 `delete` 时，编译器除了执行 `Fish::~Fish()` 外还执行了 `Tuna::~Tuna()`，如第 31 行所示。现在，此输出也证明了无论\
  \ `Tuna` 类型对象是在第 37 行使用 `new` 在自由存储上实例化，还是在第 42 行作为局部变量在栈上实例化，构造和析构顺序都是相同的。\n\n\
  **注意** 始终将基类析构函数声明为 `virtual`：\n\n点击此处查看代码图像\n\n```cpp\nclass Base\n{\npublic:\n\
  \    virtual ~Base() {};\n};\n```\n\n这确保了拥有 `pointer Base*` 的人无法通过 `delete` 导致派生类实例无法正确析构。\n\
  \n\n\n\n\n考虑一个声明了 `N` 个虚函数的 `class Base`（基类）：\n\n点击此处查看代码图片\n\n```cpp\nclass Base\n\
  {\npublic:\n    virtual void Func1()\n    {\n      // Func1 实现\n    }\n    virtual\
  \ void Func2()\n    {\n      // Func2 实现\n    }\n    // .. 以此类推\n    virtual void\
  \ FuncN()\n    {\n      // FuncN 实现\n    }\n};\n```\n\n继承自 `Base` 的 `class Derived`（派类）重写了\
  \ `Base::Func2()`，直接暴露了 `class Base` 中的其他虚函数：\n\n点击此处查看代码图片\n\n```cpp\nclass Derived:\
  \ public Base\n{\npublic:\n    virtual void Func1()\n    {\n      // Func2 重写了 Base::Func2()\n\
  \    }\n    // Func2() 没有实现\n    virtual void FuncN()\n    {\n      // FuncN 实现\n\
  \    }\n};\n```\n\n编译器看到了一个继承层次结构，并理解到 `Base` 定义了某些在 `Derived` 中被重写的虚函数。编译器现在做的是为每个实现了虚函数的类或重写了虚函数的派生类创建一个名为虚函数表（Virtual\
  \ Function Table, VFT）的表。换句话说，类 `Base` 和 `Derived` 获得了各自的虚函数表实例。当实例化这些类的对象时，一个隐藏的指针（我们称之为\
  \ `VFT*`）会被初始化为相应的 `VFT`。虚函数表可以可视化为一个包含函数指针的静态数组，每个指针都指向感兴趣的虚函数（或重写函数），如图 11.1\n\
  \n**图 11.1** 类 `Derived` 和 `Base` 的虚函数表可视化图。\n\n因此，每个表都由函数指针组成，每个指针都指向虚函数的可用实现。在\
  \ `class Derived` 的情况下，其 VFT 中除一个函数指针外，所有的指针都指向 `Derived` 中该虚方法的本地实现。`Derived` 没有重写\
  \ `Base::Func2()`，因此该函数指针指向 `class Base` 中的实现。\n\n这意味着当 `class Derived` 的用户调用\n\n\
  点击此处查看代码图片\n\n```cpp\nCDerived objDerived;\nobjDerived.Func2();\n```\n\n编译器会确保在\
  \ `class Derived` 的 VFT 中进行查找，并确保调用实现 `Base::Func2()`。这同样适用于使用了已虚重写 方法的调用：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid DoSomething(Base& objBase)\n{\n    objBase.Func1();   // 调用 Derived::Func1\n\
  }\n\nint main()\n{\n    Derived objDerived;\n    DoSomething(objDerived);\n};\n\
  ```\n\n在这种情况下，尽管 `objDerived` 是通过 `objBase` 解释为 `class Base` 的实例，但该实例中的 VFT 指针仍然指向为\
  \ `class Derived` 创建的同一个张表。因此，通过此 VFT 执行的 `Func1()` 无疑是 `Derived::Func1()`。\n\n\
  这就是虚函数表如何帮助 C++ 中（子类型）多态的实现。\n\n隐藏虚函数表指针存在的证明通过列表 11.5 展示，该列表比较了两个相同类的 `sizeof`——一个有一个虚函数，而另一个没有。\n\
  \n**列表 11.5** 通过比较两个相同但仅在一个函数上声明为虚函数的类，证明隐藏 VFT 指针的存在\n\n点击此处查看代码图片\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class SimpleClass\n4: {\n\
  5:     int a, b;\n6:\n7: public:\n8:     void DoSomething() {}\n9: };\n10:\n11:\
  \ class Base\n12: {\n13:     int a, b;\n14:\n15: public:\n16:     virtual void DoSomething()\
  \ {}\n17: };\n18:\n19: int main()\n20: {\n21:     cout << \"sizeof(SimpleClass)\
  \ = << sizeof(SimpleClass) << endl;\n22:     cout << \"sizeof(Base) = \" << sizeof(Base)\
  \ << endl;\n23:     return 0;\n24: }\n```\n\n使用 32 位编译器的输出 ![Image](img/arrow.jpg)\n\
  点击此处查看代码图片\n`sizeof(SimpleClass) = 8`\n`sizeof(Base) = 12`\n\n使用 64 位编译器的输出 ![Image](img/arrow.jpg)\n\
  点击此处查看代码图片\n`sizeof(SimpleClass) = 8`\n`sizeof(Base) = 16`\n\n分析 ![Image](img/arrow.jpg)\n\
  这是一个被精简到极限的示例。你看到两个类，`SimpleClass` 和 `Base`。\n\n### 抽象基类与纯虚函数\n\n无法被实例化的类被称为抽象基类（Abstract\
  \ Base Class）。C++ 允许使用纯虚函数创建抽象基类。当虚函数被声明为纯虚函数时，如下所示：\n\n点击此处查看代码图片\n\n```cpp\nclass\
  \ AbstractBase\n{\npublic:\n    // 定义纯虚函数 \n    virtual void DoSomething() = 0;\n\
  };\n```\n\n这本质上告诉编译器，派自 `AbstractBase` 的类必须提供 `DoSomething()` 的实现：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Derived: public AbstractBase\n{\npublic:\n    void DoSomething()\
  \ // 必须实现\n    {\n      cout << \"实现了虚函数\" << endl;\n    }\n};\n```\n\n因此，`AbstractBase`\
  \ 类的作用是强制 `Derived` 类提供虚方法的实现。这种基类可以强制派生类提供特定名称和签名的方法，这被称为接口（Interface）。再次考虑 `Fish`\
  \ 类。想象一个 `Tuna`（金枪鱼）由于没有重写 `Fish::Swim()` 而无法快速游动。\n\n让 `Fish` 成为带有 `Swim` 虚函数的抽象基类，可以确保派自\
  \ `Fish` 的 `Tuna` 实现了 `Tuna::Swim()` 并像 `Tuna` 一样游动，而不是像任何 `Fish` 一样。参见列表 11.6。\n\
  \n\n\n\n\n```cpp\n36:    Tuna myDinner;\n38:    MakeFishSwim(myLunch);\n39:    MakeFishSwim(myDinner);\n\
  41:    return 0;\n42: }\n```\n\nOutput ![Image](img/arrow.jpg)\n点击此处查看代码图像\n\n鲤鱼在湖里游得很慢！\n\
  \n金枪鱼在海里游得很快！\n\n## 分析 ![Image](img/arrow.jpg)\n\n`main()` 函数中第 34 行（被注释掉的行）非常重要。它证明编译器不允许你\
  \ true 一个抽象基类（`ABC`）`Fish` 的实例。它期望一个具体的类，例如 `Fish` 的特化类——例如 `Tuna`——这在现实世界的物体安排中是有意义的。得益于第\
  \ 7 行声明的纯虚函数 `Fish::Swim()`，`Tuna` 和 `Carp` 都被强制实现 `Tuna::Swim()` 和 `Carp::Swim()`。第\
  \ 27–30 行实现了 `MakeFishSwim(Fish&)`，这证明了即使抽象基类不能实例化，你也可以将其作为引用或指针。因此，抽象基类是一种非常好的机制，用于声明你期望派生类实现并完成的函数。如果派自\
  \ `Fish` 的类 `Trout` 忘记实现 `Trout::Swim()`，编译也会失败。\n\n### 注意\n抽象基类（Abstract Base Classes）通常简单称为\
  \ ABCs。\n\nABCs 有助于对你的程序执行某些设计约束。\n\n### 使用 `virtual` 继承解决菱问题\n\n在第 10 中，你看到了鸭嘴兽的奇特案例，它既是哺乳动物，又是鸟类，还是爬行动物。这是一个\
  \ `class Platypus` 需要继承自 `class Mammal`、`class Bird` 和 `class Reptile` 的例子。然而，这些每一个类反又继承自一个更通用的\
  \ `class Animal`，如图 11.2 所示。\n\n![Image](img/11fig02.jpg)\n\n**图 11.2** 展示多继承的鸭嘴兽类图。\n\
  \n那么，当你实例化一个 `Platypus` 时会发生什么？对于一个 `Platypus` 实例，会被多少个 `Animal` 类实例？列表 11.7 有助于回答这个问题。\n\
  \n**列表 11.7** 检查一个 `Platypus` 实例对应的基类 `Animal` 实例数量\n\n点击此处查看代码图像\n\n```cpp\n0:\
  \ #include <iostream>\n1: using namespace std;\n2:\n3: class Animal\n4: {\n5: public:\n\
  6:     Animal()\n7:     {\n8:         cout << \"Animal constructor\" << endl;\n\
  9:     }\n10:\n11:     // sample member\n12:     int age;\n13: };\n14:\n15: class\
  \ Mammal:public Animal\n16: {\n17: };\n18:\n19: class Bird:public Animal\n20: {\n\
  21: };\n22:\n23: class Reptile:public Animal\n24: {\n25: };\n26:\n27: class Platypus:public\
  \ Mammal, public Bird, public Reptile\n28: {\n29: public:\n30:     Platypus()\n\
  31:     {\n32:         cout << \"Platypus constructor\" << endl;\n33:     }\n34:\
  \ };\n35:\n36: int main()\n37: {\n38:     Platypus duckBilledP;\n39:\n40:     //\
  \ 取消注释注释查看编译失败\n41:     // age 是模糊的，因为有三个基类 实例\n42:     // duckBilledP.age = 25;\n\
  43:\n44:     return 0;\n45: }\n```\n\nOutput ![Image](img/arrow.jpg)\n点击此处查看代码图像\n\
  Animal constructor\nAnimal constructor\nPlatypus constructor\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n输出所示，由于多重继承以及 `Platypus` 的所有基类都继承自 `Animal`，对于每个 `Platypus` 实例都会创建三个 `Animal`\
  \ 实例，如第 38 行所示。这很荒，因为 `Platypus` 仍然是一个继承了 `Mammal` 和 `Reptile` 特定属性的动物。`Animal`\
  \ 实例数量的问题不仅限于内存。`Animal` 有一个整数 `Animal::age`（为了解释已保持为 public）。当你想要通过 `Platypus`\
  \ 实例访问 `Animal::age` 时（如第 42 行所示），你会得到编译错误，这仅仅是因为编译器不知道你想设置的是 `Mammal::age` 还是 `Bird::age`\
  \ 还是 `Reptile::age`。它可以变得更荒谬——如果你这样做，你可以设置所有三个：\n\n```cpp\nduckBilledP.Mammal::age\
  \ = 25;\nduckBilledP.Bird::age = 25;\nduckBilledP.Reptile::age = 25;\n```\n\n显然，一只鸭嘴兽应该只有一个\
  \ `age`。然而你又希望 `Platypus` 既是 `Mammal`、`Bird`  `Reptile`。解决方案是虚继承。如果你期望一个派生类被用作基类，那么使用\
  \ `virtual` 关键字来定义它与基类的关系可能是一个好主意：\n\n```cpp\nclass Derived1: public virtual Base\n\
  {\n  // ... members and functions\n};\nclass Derived2: public virtual Base\n{\n\
  \  // ... members and functions\n};\n```\n\n一个更好的 `Platypus` 类（实际上是更好的 `Mammal`\
  \ 类、`Bird` 类和 `Reptile` 类）在列表 11.8 中。\n\n**列表 11.8** 继承中的 `virtual` 关键字如何帮助将基类 `Animal`\
  \ 的实例数量限制为一个\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: class Animal\n4: {\n5: public:\n6:     Animal()\n7:     {\n8:   \
  \      cout << \"Animal constructor\" << endl;\n9:     }\n10:\n11:     // sample\
  \ member\n12:     int age;\n13: };\n14:\n15: class Mammal:public Animal\n16: {\n\
  17: };\n18:\n19: class Bird:public Animal\n20: {\n21: };\n22:\n23: class Reptile:public\
  \ Animal\n24: {\n25: };\n26:\n27: class Platypus:public Mammal, public Bird, public\
  \ Reptile\n28: {\n29: public:\n30:     Platypus()\n31:     {\n32:         cout <<\
  \ \"Platypus constructor\" << endl;\n33:     }\n34: };\n35:\n36: int main()\n37:\
  \ {\n38:     Platypus duckBilledP;\n39:\n40:     // 因为只有一个 Age 实例，不再有编译错误\n41: \
  \    duckBilledP.age = 25;\n42:\n43:     return 0;\n44: }\n```\n\nOutput ![Image](img/arrow.jpg)\n\
  点击此处查看代码图像\nAnimal constructor\nPlatypus constructor\n\n## 分析 ![Image](img/arrow.jpg)\n\
  \n对比之前的列表 11.7 的输出，你会发现构造的 `Animal` 类实例数量减少到了一个，这最终反映了只构造了一个 `Platypus` 的事实。这是因为在\
  \ `Mammal`、`Bird` 和 `Reptile` 类之间的关系使用了 `virtual` 关键字，它确保了当这些类组合在 `Platypus` 下时，共同的基类\
  \ `Animal` 仅存在一个实例。这解决了许多问题，其中之一是第 41 行现在不需要歧义消除即可编译。此外注意第 27 行使用 `final` 关键字，以确保\
  \ `Platypus` 类不能被用基类。\n\n### 注意\nC++ 中的 `virtual` 关键字通常在不同的语文中用于不同的目的。（我最好的猜测是有人想节省时间去发明一个恰当的关键字。）这里有一个总结：\n\
  \n\n\n\n我们在 `class BluefinTuna` 的声明中也使用了 `final`。这确保了 `class BluefinTuna` 不能用作基类。因此，以下操作将导致错误：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass FailedDerivation:public BluefinTuna\n{\n};\n```\n\n\
  \n\n除了通过虚函数 `Fish::Clone()` 展示虚拷贝构造函数外，Listing 11.9 还演示了关键字 `override` 和 `final`\
  \ 的用法——后者同样适用于虚函数和类。它在第 8 行为 `class Fish` 备了一个虚析构函数。`main()` 函数中的第 52–56 行演示了如何声明一个指向基类\
  \ `Fish*` 的静态指针数组，并将各个元素分别赋值给新创建的 `Tuna`、`Carp`、`Tuna` 和 `Carp` 类型对象。注意这个名为 `myFishes`\
  \ 的数组如何能够收集看似不同的类型，而这些类型都通过共同的基类型 `Fish` 相关联。与书中之前大部分为简单单调类型 `int` 的数组相比，这已经很酷了。如果这还不够酷，你还可以像第\
  \ 60 行所示，在循环中使用通过虚函数 `Fish::Clone()` 将其拷贝到一个名为 `myNewFishes` 的 `Fish*` 类型新数组中。请注意你的数组非常小，只有四个元素。它可以更长，但对拷贝逻辑不会产生太大影响，只需要调整循环结束条件参数即可。第\
  \ 64 行是实际检查之处，你对新数组中的每个存储元素调用了虚函数 `Fish::Swim()`，以验证 `Clone()` 是否将 `Tuna` 拷贝为了 `Tuna`\
  \ 而不仅仅是 `Fish()`。输出证明了它确实如预期那样拷贝了 `Tuna` 和 `Carp`。另外注意，在 `BluefinTuna` 实例上使用的 `Swim()`\
  \ 输出与 `Tuna` 相同，因为 `Tuna::Swim()` 被声明为 `final`。因此，`BluefinTuna` 不允许重写 `Swim()`，编译器为它执行了\
  \ `Tuna::Swim()`。\n\n***\n\n### DO（要做的）\n\n- **务必**记住将需要派生类重写的基类函数标记为 `virtual`。\n\
  - **务必**记住纯虚函数会让你的类变成抽象基类（Abstract Base Class），这些函数必须由派生类实现。\n- **务必**在派生类中对意图重写基类功能的函数使用\
  \ `override` 关键字。\n- **务必**使用虚继承来解决菱形继承（Diamond Problem）。\n\n***\n\n### DON’T（不要做的）\n\
  \n- **不要**忘记为你的基类提供一个虚析构函数。\n- **不要**忘记编译器不允许你创建抽象基类的独立实例。\n- **不要**忘记虚继承是为了确保菱形层次结构中的公共基类只有一个实例。\n\
  - **不要**将 `virtual` 关键字在创建继承层次结构时使用的功能，与在声明基类函数时使用的功能混为一谈。\n\n***\n\n### Summary（总结）\n\
  \n在本节中，你学习了如何通过使用多态来在 C++ 代码中利用创建继承层次结构的力量。你学习了如何声明和编写虚函数——以及它们如何确保即使使用基类实例来调用虚方法，派生类的实现也能重写基类中的实现。你看到了纯虚函数是虚函数的一种特殊类型，它们确保了基类本身不能直接被实例化，从而成为定义派生类必须履行的接口的完美位置。最后，你看到了多重继承引起的菱形问题，以及\
  \ `virtual` 继承是如何帮助你解决它的。\n\n### Q&A（问答）\n\n**Q 为什么代码在没有它的情况下也能编译，基类函数还需要 `virtual`\
  \ 关键字？**\n\n**A** 没有 `virtual` 关键字，你无法确保调用 `objBase.Function()` 的地方会被重定向到 `Derived::Function()`。此外，代码编译并不是衡量其质量的唯一标准。\n\
  \n**Q 编译器为什么要创建虚函数表（Virtual Function Table）？**\n\n**A** 为了存储函数指针，确保调用正确版本的虚函数。\n\
  \n**Q 基类是否应该始终有一个虚析构函数？**\n\n**A** 理想情况下是这样的。只有这样你才能确保某人对一个...\n\n点击此处查看代码图片\n\n\
  ```cpp\nBase* pBase = new Derived();\ndelete pBase;\n```\n\n对类型为 `Base*` 的指针执行 `delete`\
  \ 会导致析构函数 `~Derived()`。这在析构函数 `~Base()` 被声明为 `virtual` 时发生。\n\n**Q 当我甚至无法独立实例化它时，抽象基类（Abstract\
  \ Base Class）有什么用？**\n\n**A** 抽象基类并不是为了作为独立对象被实例化的；相反，它总是为了被派生。它包含了纯虚函数，定义了派生类需要实现的最小蓝图，从而充当了接口的角色。\n\
  \n**Q 给定一个继承层次结构，我需要在所有虚函数的声明处使用 `virtual` 关键字，还是只需要在基类中使用？**\n\n**A** 只需将函数声明为\
  \ `virtual` 一次，但该声明必须在基类中。\n\n**Q 我可以在抽象基类中定义成员函数并拥有成员属性吗？**\n\n**A** 当然可以。请记住，你仍然无法实例化抽象基类，因为它至少有一个需要派生类实现的纯虚函数。\n\
