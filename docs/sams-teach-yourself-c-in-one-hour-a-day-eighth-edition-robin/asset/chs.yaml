  \   48:     MyString(const MyString& copySrc) // 拷贝构造函数\n   49:     {\n   50:  \
  \       cout << \"Copy constructor copies: \" << copySrc.buffer << endl;\n   51:\
  \         if (copySrc.buffer != NULL)\n   52:             {\n   53:            \
  \     buffer = new char[strlen(copySrc.buffer) + 1];\n   54:                 strcpy(buffer,\
  \ copySrc.buffer);\n   55:             }\n   56:         else\n   57:          \
  \   buffer = NULL;\n   58:     }\n   59: \n   60:     MyString& operator= (const\
  \ MyString& copySrc) // 拷贝赋值\n   61:     {\n   62:         cout << \"Copy assignment\
  \ op. copies: \" << copySrc.buffer << endl;\n   63:         if(this != &copySrc)\n\
  \   64:             {\n   65:                 delete[] buffer; // 释放自己的缓冲区\n   66:\
  \ \n   67:                 buffer = new char[strlen(copySrc.buffer) + 1];\n   68:\
  \                 strcpy(buffer, copySrc.buffer);\n   69:             }\n   70:\
  \ \n   71:         return *this;\n   72:     }\n   73: \n   74:     ~MyString()\
  \ // 析构函数\n   75:     {\n   76:         if (buffer != NULL) \n   77:           \
  \  delete[] buffer;\n   78:     }\n   79: \n   80:     int GetLength()\n   81: \
  \    {\n   82:         return strlen(buffer);\n   83:     }\n   84: };\n   85:\n\
  \   86: int main()\n   87: {\n   88:     MyString Hello(\"Hello \");\n   89:   \
  \  MyString World(\"World\");\n   90:     MyString CPP(\" of C++\");\n   91: \n\
  \   92:     MyString sayHelloAgain (\"overwrite this\");\n   93:     sayHelloAgain\
  \ = Hello + World + CPP;\n   94: \n   95:     return 0;\n   96: }\n```\n\n\n\n调用构造函数：overwrite\
  \ this\n\n`operator+` 被调用：\n\n调用默认构造函数\n\n移动构造函数移动：Hello World\n\n`operator+` 被调用：\n\
  \n调用默认构造函数\n\n移动构造函数移动：Hello World of C++\n\n移动赋值运算符移动：Hello World of C++\n\n分析\
  \ ![Image](img/arrow.jpg)\n\n这可能是一个很长的代码示例，但大部分内容在之前的示例和课程中已经演示过了。此列表最重要的部分是第 26\
  \ 行到 48 行，这些行分别实现了移动构造函数和移动赋值运算符。输出中受 C++11 新增特性影响的部分已用**粗体**标记。注意看，与没有这两个实体的相同类相比，输出发生了巨大的变化。如果你再次查看移动构造函数和移动赋值运算符的实现，你会发现移动语义本质上是通过从移动源\
  \ `moveSrc` 获取资源的所有权来实现，如移动构造函数第 31 行和移动赋值运算符第 43 行所示。紧接着，如第 32 行和 44 行所示，将移动指针赋值为\
  \ `NULL`。这种对 `NULL` 的赋值确保了作为移动源的实例的析构函数在第 80 行不会通过 `delete` 执行任何内存释放，因为所有权已经转移到了目标对象。注意，在缺少移动构造函数的情况下，会调用拷贝构造函数对指向的字符串进行深拷贝。因此，移动构造函数通过减少不需要的内存分配和拷贝步骤了大量的处理时间。\n\
  \n编写移动构造函数和移动赋值运算符完全可选的。与拷贝构造函数和拷贝赋值运算符不同，编译器不会为你添加默认实现。\n\n使用此特性可以优化指向动态分配资源的类的功能，否则在仅临时需要的情况下，这些资源也会被深拷贝。\n\
  \n### 用户自定义字面量\n\n字面量常量是在第 3 Lesson “使用变量，声明常量.”中引入的。以下是几个示例：\n\n点击此处查看代码图像\n\n\
  ```\nint bankBalance = 10000;\n\ndouble pi = 3.14;\n\nchar firstAlphabet = ‘a’;\n\
  \nconst char* sayHello = \"Hello!\";\n```\n\n在前面的代码中，`10000`、`3.14`、`‘a’` 和 `\"\
  Hello!\"` 全都是字面量常量！C++11 通过允许你定义自己的字面量扩展了标准的支持。例如，如果你正在开发一个处理热力学的科学应用程序，你可能希望所有温度都使用名为开尔文的比例进行存储和操作。你现在可以使用类似于下面的语法声明所有的温度：\n\
  \n点击此处查看代码图像\n\n```\nTemperature k1 = 32.15_F;\n\nTemperature k2 = 0.0_C;\n```\n\
  \n使用你定义的字面量 `_F` 和 `_C`，你的应用程序变得更容易阅读，因此也更容易维护。\n\n要定义自己的字面量，你可以这样定义 `operator \"\
  \"`：\n\n点击此处查看代码图像\n\n```cpp\nReturnType operator \"\" YourLiteral(ValueType value)\n\
  {\n    // 此处编写转换代码\n}\n```\n\n### 注意\n\n根据用户自定义字面量的性质，`ValueType` 参数将被限制为以下类型之一：\n\
  \n- `unsigned long long int` 用于整数字面量\n- `long double` 用于浮点字面量\n- `char`、`wchar_t`、`char16_t`\
  \ 和 `char32_t` 用于字符字面量\n- `const char*` 用于原始字符串字面量\n- `const char*` 配合 `size_t`\
  \ 用于字符串字面量\n- `const wchar_t*` 配合 `size_t` 用于字符串字面量\n- `const char16_t*` 配合 `size_t`\
  \ 用于字符串字面量\n- `const char32_t*` 配合 `size_t` 用于字符串字面量\n\n列表 12.12 展示了一个转换类型的用户自定义字面量。\n\
  \n**列表 12.12** 从华华和摄度转换为开尔文标\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1:\
  \ using namespace std;\n2:\n3: struct Temperature\n4: {\n5:     double Kelvin;\n\
  6:     Temperature(long double kelvin) : Kelvin(kelvin) {}\n7: };\n8:\n9: Temperature\
  \ operator\"\" _C(long double celcius)\n10: {\n11:     return Temperature(celcius\
  \ + 273);\n12: }\n13:\n14: Temperature operator \"\" _F(long double fahrenheit)\n\
  15: {\n16:     return Temperature((fahrenheit + 459.67) * 5 / 9);\n17: }\n18:\n\
  19: int main()\n20: {\n21:     Temperature k1 = 32.15_F;\n22:     Temperature k2\
  \ = 0.0_C;\n23:\n24:     cout << \"k1 is \" << k1.Kelvin << \" Kelvin\" << endl;\n\
  25:     cout << \"k2 is \" << k2.Kelvin << \" Kelvin\" << endl;\n26:\n27:     return\
  \ 0;\n28: }\n```\n\n\n\n\nA 当编写此类类时，你必须清晰地定义在以下场景下的行为：实例通过赋值直接拷贝到另一个实例，或者通过按值传递给函数进行间接拷贝。你通常需要实现拷贝构造函数、拷贝赋值运算符和析构函数。如果你想在某些情况下微调该类的性能，还需要实现移动构造函数和移动赋值运算符。为了允许对类实例存储的元素进行类似数组的访问，你需要重载下标运算符\
  \ `operator[]`。\n\nQ 我有一个某个类的实例 `object`。我想支持这种语法：`cout << object;`。我需要实现什么运算符？\n\
  \nA 你需要实现一个转换运算符，允许你的类在直接被解释为 `std::cout` 可以处理的类型。一种方法是定义 `operator char*()`，正如你在代码段列表\
  \ 12.2 中做的那样。\n\nQ 我想创建自己的智能指针类。为了让它具备基本功能，我最少需要实现哪些函数和运算符？\n\nA 智能指针需要提供像 `*pSmartPtr`\
  \ 或 `pSmartPtr->Func()` 那样作为普通指针使用的能力。为了实现这一点，你需要实现 `operator(*)` 和 `operator(->)`。此外，为了使其具有“智能性”，你还需要通过相应编写析构函数来处理资源的自动释放/返回，并通过实现拷贝构造函数和拷贝赋值运算符来明确定义拷贝或赋值的工作方式，或者通过将这两个声明为\
  \ `private` 来禁止它们。\n\n## 工作坊\n\n工作坊包含测验题，帮助你巩固对所涵盖内容的理解，并提供练习以获得使用所学知识。在查看附录 E 中的答案之前，尝试回答测试和练习题，并确保在进入下一节之前理解了答案。\n\
  \n### 测验\n\n**1.** 我的下标运算符 `[]` 可以返回 `const` 和非 `const` 变体的返回类型吗？\n\n点击此处查看代码图片\n\
  \n```cpp\nconst Type& operator[](int index);\nType& operator[](int index); // 这样可以吗？\n\
  ```\n\n**2.** 你会将拷贝构造函数或拷贝赋值运算符声明为 `private` 吗？\n\n**3.** 为你的 `class Date` 定义移动构造函数和移动赋值运算符有意义吗？\n\
  \n### 练习\n\n**1.** 为 `Date` 类编写一个转换运算符，将它持有的日期转换为一个唯一的整数。\n\n**2.** 为 `class DynIntegers`\
  \ 编写一个移动构造函数和移动赋值运算符，该类以私有成员 `int*` 的形式封装了一个动态分配的数组。\n\n## 第 13 节 转换运算符\n\n转换是一种程序员可以临时或永久地改变编译器对对象解释的机制。注意，这并不意味着程序员改变了对象本身——他只是改变了对对象的解释。改变对象解释的运算符被称为*强制转换运算符*。\n\
  \n在本节中，你将学习：\n\n- ![Image](img/square.jpg) 转换运算符的必要性\n- ![Image](img/square.jpg)\
  \ 为什么 C 风格转换不受某些 C++ 程序员的欢迎\n- ![Image](img/square.jpg) 四种 C++ 转换运算符\n- ![Image](img/square.jpg)\
  \ 向上转换和向下转换的概念\n- ![Image](img/square.jpg) 为什么 C++ 转换运算符并非一直的首选\n\n## 转换的必要性\n\n\
  在一个由编写良好的 C++ 应用程序组成的完美类型安全且强类型的世界里，本不需要转换和转换运算符。然而，我们生活在一个现实世界中，由许多不同的人和供应商编写且通常使用不同环境的模块必须共同工作。为了实现这一点，编译器经常需要被指示以特定的方式解释数据，以便它们能够编译并让应用程序正常运行。\n\
  \n让我们来看一个现实世界的例子：尽管大多数 C++ 编译器可能支持 `bool` 作为原生类型，但仍在使用许多多年前用 C 语言编写的库。这些为 C 编译器设计的库必须依赖使用整数类型来存储布尔数据。因此，这些编译器上的\
  \ `bool` 类似于：\n\n```cpp\ntypedef unsigned short BOOL;\n```\n\n返回布尔数据的函数将声明为：\n\n\
  ```cpp\nBOOL IsX ();\n```\n\n现在，如果要在用最新版本的 C++ 编译器编写的新应用程序中使用此类库，程序员必须找到一种方法，使他的\
  \ C++ 编译器函数理解的 `bool` 数据类型与库理解的 `BOOL` 数据类型一致。实现这一点的方法是使用转换：\n\n点击此处查看代码图片\n\n```cpp\n\
  bool Result = (bool)IsX (); // C 风格转换\n```\n\nC++ 的演进看到了新的 C++ 转换运算符的出现，这在 C++ 编程社区中引发了分裂：一组继续在他们的\
  \ C++ 应用程序中使用 C 风格转换，另一组则虔诚地转换为 C++ 编译器引入的转换关键字。前一组的论点是 C++ 转换使用起来繁琐，且有时在功能上的差异微不足道，以至于只有理论价值。后一组（显然由\
  \ C++ 纯洁主义者组成）指出了 C 风格转换的缺陷。\n\n由于现实世界存在这两种代码，简单阅读本节、了解每种风格的优缺点并形成自己的观点是好的。\n\n\
  ### 为什么 C 风格转换不受某些 C++ 程序员的欢迎\n\n类型安全是 C++ 程序员在赞美这种语言特性时信奉的格言。事实上，大多数 C++ 编译器甚至不允许你这样操作：\n\
  \n点击此处查看代码图片\n\n```cpp\nchar* staticStr = \"Hello World!\";\nint* intArray = staticStr;\
  \ // 错误：无法将 char*  int*\n```\n\n……确实如此！\n\n现在，C++ 编译器仍然需要向下兼容以保持旧代码编译，因此自动允许如下语法：\n\
  \n点击此处查看代码图片\n\n```cpp\nint* intArray = (int*)staticStr; // 解决一个问题，产生另一个\n```\n\n\
  这种 C 风格转换实际上强制编译器将其解释为程序员方便选择的类型——在这种情况下，程序员并没有考虑编译器最初报告错误是有充分理由的，而是简单地强迫编译器服从。这显然不能让看到类型安全被强制转换破坏的\
  \ C++ 程序员感到舒服。\n\n### C++ 转换运算符\n\n尽管转换有缺点，但转换本身的概念无法被。在许多情况下，转换是解决重要兼容问题的合法要求。C++\
  \ 额外提供了一种特定继承场景的转换运算符，这在 C 编程中是不存在的。\n\n四种 C++ 转换运算符为：\n\n- ![Image](img/square.jpg)\
  \ `static_cast`\n- ![Image](img/square.jpg) `dynamic_cast`\n- ![Image](img/square.jpg)\
  \ `reinterpret_cast`\n- ![Image](img/square.jpg) `const_cast`\n\n转换运算符的使用语法是一致的：\n\
  \n点击此处查看代码图片\n\n```cpp\ndestination_type result = cast_operator<destination_type>\
  \ (object_to_cast);\n```\n\n### 使用 `static_cast`\n\n\n\n\n\n`static_cast` 是一种用于在相关类型之间转换指针的机制，并对于原本会自动或隐式转换的标准数据类型执行显式类型转换。对于指针而言，`static_cast`\
  \ 实现了基本的编译时检查，以确保指针被转换为相关类型。这是对 C 风格强制转换的改进，C 风格强制转换允许将一个对象的指针转换为完全无关的类型而不产生任何报错。如下代码示例所示，使用\
  \ `static_cast` 可以将指针向上转型为基类类型，也可以向下转型为派生类类型。\n\n点击查看代码图像\n\n```cpp\nBase* objBase\
  \ = new Derived ();\n\nDerived* objDer = static_cast<Derived*>(objBase);  // ok!\n\
  \n// class Unrelated 与 Base 并不相关\n\nUnrelated* notRelated = static_cast<Unrelated*>(objBase);\
  \ // Error\n\n// 由于类型不相关，不允许此类转换\n```\n\n### 注意事项\n\n将 `Derived*` 转换为 `Base*` 称为“向上转型”（upcasting），可以在不需要任何显式转换符的情况下完成：\n\
  \n点击查看代码图像\n\n```cpp\nDerived objDerived;\n\nBase* objBase = &objDerived; // ok!\n\
  ```\n\n将 `Base*` 转换为 `Derived*` 称为“向下转型”（downcasting），在不使用显式转换符的情况下无法完成：\n\n点击查看代码图像\n\
  \n```cpp\nDerived objDerived;\n\nBase* objBase = &objDerived; // Upcast -> ok!\n\
  \nDerived* objDer = objBase; // Error: Downcast 需要显式转换\n```\n\n然而，请注意 `static_cast`\
  \ 仅验证指针类型是否是相关的。它*不会*执行任何运行时检查。因此，使用 `static_cast` 时程序员仍然可能写下这种错误：\n\n点击查看代码图像\n\
  \n```cpp\nBase* objBase = new Base();\n\nDerived* objDer = static_cast<Derived*>(objBase);\
  \ // 仍然没有！\n```\n\n在这里，`objDer` 实际上指向一个部分的 `Derived` 对象，因为被指向的对象实际上是 `Base()` 类型。由于\
  \ `static_cast` 仅执行验证相关类型是否相关的编译时检查，而不执行运行时检查，调用 `objDer->DerivedFunction()` 将通过编译，但在运行时可能会导致意料之外的行为。\n\
  \n除了有助于向上转型或向下转型外，在许多情况下，`static_cast` 可以帮助将隐式转换变为显式转换，并引起程序员或读者的注意：\n\n点击查看代码图像\n\
  \n```cpp\ndouble Pi = 3.14159265;\n\nint num = static_cast<int>(Pi); // 将原本隐式的转换变为显式转换\n\
  ```\n\n在前面的代码中，`num = Pi` 同样可以正常工作且效果相同。然而，使用 `static_cast` 会让读者注意这种转换的本质，并向（对了解\
  \ `static_cast` 的人）表明编译器已经根据编译时可用信息进行了必要的调整，以执行所需的类型转换。当使用用 `explicit` 关键字声明的转换操作符或构造函数时，你也需要使用\
  \ `static_cast`。通过 `explicit` 关键字避免隐式转换将在第 9 节 “类与对象(#ch09.html_ch09)”和第 12 节 “操作符类型与运算符重载(#ch12.html_ch12)”中讨论。\n\
  \n### 使用 `dynamic_cast` 和运行时类型识别\n\n动态转换（Dynamic casting）顾如其名，是静态转换的相反，并且实际上是在运行时执行转换——即在应用程序执行期间。`dynamic_cast`\
  \ 操作的结果可以检查以判断转换尝试是否成功。`dynamic_cast` 操作符的典型用法语法为：\n\n点击查看代码图像\n\n```cpp\ndestination_type*\
  \ Dest = dynamic_cast<class_type*>(Source);\n\nif(Dest)    // 检查转换操作是否成功\n    Dest->CallFunc\
  \ ();\n```\n\n例如：\n\n点击查看代码图像\n\n```cpp\nBase* objBase = new Derived();\n\n// 执行向下转型\n\
  \nDerived* objDer = dynamic_cast<Derived*>(objBase);\n\nif(objDer)    // 检查转换是否成功\n\
  \    objDer->CallDerivedFunction ();\n```\n\n如前面的短示例所示，给定一个指向基类对象的指针，程序员可以求助于 `dynamic_cast`\
  \ 在继续使用该指针之前验证所指向的目标对象的类型。请注意，在代码段中显而易见目标对象是 `Derived` 类型。因此，该示例仅具有演示价值。然而，情况并非总是如此——例如，当类型为\
  \ `Derived*` 的指针传递给接受 `Base*` 类型的函数时。函数在给定基类指针类型的情况下，可以使用 `dynamic_cast` 来检测类型，然后对该类型执行操作。因此，`dynamic_cast`\
  \ 帮助在运行时检测类型并对类型执行操作。参见列表 13.1，确定 `Fish*` 是 `Tuna*` 还是 `Carp*`。这种这种在运行时识别对象类型的机制被称为*运行时类型识别\
  \ (RTTI)`*。\n\n### 注意事项\n\n因此，这种在运行时识别对象类型的机制被称为*运行时类型识别 (RTTI)*。\n\n\n\n\n此示例使用了一个层次结构，其中\
  \ `Tuna` 和 `Carp` 类继承自 `Fish`。为了方便解释，这两个派生类不仅实现了虚函数 `Swim()`，而且它们各自包含一个特定于其种类型的函数，即\
  \ `Tuna::BecomeDinner()` 和 `Carp::Talk()`。此示例的特殊之处在于，给定一个基类 `Fish*` 实例，你能够动态地检测该指针指向的是\
  \ `Tuna` 还是 `Carp`。这种动态检测或运行时类型识别发生在第 43-61 行定义的 `DetectFishType()` 函数中。在第 45 行中，使用\
  \ `dynamic_cast` 来测试类型为 `Fish*` 的输入基类指针是否为 `Tuna*` 类型。如果该 `Fish*` 指向一个 `Tuna`，则操作符返回一个有效地址，否则返回\
  \ `NULL`。因此，`dynamic_cast` 的结果始终需要检查有效性。在第 46 行的检查成功后，你就知道指针 `objTuna` 指向一个有效的 `Tuna`，并可以使用它来调用函数\
  \ `Tuna::BecomeDinner()`，如第 49 行所示。对于 `Carp`，你使用该指针调用函数 `Carp::Talk()`，如第 56 行所示。在返回之前，`DetectFishType()`\
  \ 通过调用 `Fish::Swim()` 对类型进行验证，由于该函数是虚函数，它会将调用重定向到 `Tuna` 或 `Carp` 中实现的 `Swim()`\
  \ 方法（视情况而定）。\n\n* * *\n\n### 注意\n\n`dynamic_cast` 操作的返回值始终应该检查有效性。当转换失败，它为 `NULL`。\n\
  \n* * *\n\n### 使用 `reinterpret_cast`\n\n`reinterpret_cast` 是 C++ 转换运算符中最接近 C 风格转换的。它确实允许程序员将一个对象类型转换为另一种类型，无论这些类型是否相关；也就是说，它强制使用示例所示的语法重新解释类型：\n\
  \n点击此处查看代码\n\n```cpp\nBase* objBase = new Base ();\n\nUnrelated* notRelated = reinterpret_cast<Unrelated*>(objBase);\n\
  \n// 以上代码可以编译，但不是良好的编程习惯！\n```\n\n这种转换实际上强制编译器接受 `static_cast` 通常不会允许的情况。它在某些低级应用中（例如驱动程序）被发现有用，其中数据需要转换为\
  \ API（应用程序接口）可以接受的简单类型（例如，某些操作系统级 API 要求数据以字节数组的形式发送，即 `unsigned char*`）：\n\n点击此处查看代码\n\
  \n```cpp\nSomeClass* object = new SomeClass();\n\n// 需要将对象作为字节流发送...\n\nunsigned\
  \ char* bytesFoAPI = reinterpret_cast<unsigned char*>(object);\n```\n\n前述代码中转换没有改变源对象的二进制表示，并实际上“欺骗”了编译器，允许程序员查看类型为\
  \ `SomeClass` 的对象所包含的单个字节。由于没有其他 C++ 转换运算符允许这种会损害类型安全性的转换，`reinterpret_cast` 是执行这种原本不安全（且不可移植）的转换的最后手段。\n\
  \n* * *\n\n### 注意\n\n尽可能，你应该避免在应用程序中使用 `reinterpret_cast`，因为它允许你指示编译器将类型 X 视为一个不相关的类型\
  \ Y，这看起来并不是良好的设计或实现。\n\n* * *\n\n### 使用 `const_cast`\n\n`const_cast` 允许你关闭对象的 `const`\
  \ 访问修符。如果你在想为什么这种转换是必要的，那么你的想法可能是正确的。在程序员正确编写类的理想情况下，他们会记住经常地在正确的地方使用 `const` 关键字。遗憾的是，现实世界要不同得是，像如下的代码随处可见：\n\
  \n点击此处查看代码\n\n```cpp\nclass SomeClass\n{\npublic:\n    // ...\n    void DisplayMembers();\
  \ //问题 - 显示函数不是 const\n};\n```\n\n所以，当你编写这样一个函数时：\n\n点击此处查看代码\n\n```cpp\nvoid DisplayAllData\
  \ (const SomeClass& object)\n{\n    object.DisplayMembers ();  // 编译失败\n    // 原因：使用\
  \ const 引用调用非 const 成员\n}\n```\n\n你将 `object` 作为 const 引用传递显然是正确的。毕竟，显示函数应该是只读的，不应该允许调用非\
  \ const 成员函数——也就是说，不应该允许调用可以改变对象状态的函数。然而，`DisplayMembers()` 的实现本也应该是 `const` 的，遗憾的是并不是。现在，只要\
  \ `SomeClass` 属于你且源代码由你控制，你就可以对 `DisplayMembers()` 进行修正更改。但在许多情况下，它可能属于第三方库，无法对其进行更改。在这些情况下，`const_cast`\
  \ 就是你的救星。\n\n在这样的场景下，调用 `DisplayMembers()` 的语法为：\n\n点击此处查看代码\n\n```cpp\nvoid DisplayAllData\
  \ (const SomeClass& object)\n{\n    const_cast<SomeClass&>(object).DisplayMembers();\n\
  }\n```\n\n\n\n\n**请记住**，将 `Base*` 直接强制转换为 `Derived*` 被称为下转型（downcasting），除非你使用 `dynamic_cast`\
  \ 并检查是否成功，否则这样做是不安全的。\n\n**请记住**，创建继承层次结构通常是为了拥有虚函数，这样当使用基类指针调用时，可以确保调用的是相应的派生类版本。\n\
  \n* * *\n\n* * *\n\n### 不要\n\n**不要**忘记在运行 `dynamic_cast` 后检查指针的有效性。\n\n**不要**基于\
  \ `dynamic_cast` 及其 RTTI（运行时类型识别）来设计你的应用程序。\n\n* * *\n\n### 总结\n\n在本节中，你学习了不同的 C++\
  \ 强制转换运算符，以及使用它们的优缺点。你还学到，通常情况下你应该避免使用强制转换。\n\n### 问答\n\n**Q: 通过 `const_cast` 将指针或引用转换为非\
  \ const 来修改 `const` 对象的内容可以吗？**\n\n**A**: 绝对不可以。这种操作的结果是未定义的，而且绝对不是预期的。\n\n**Q:\
  \ 我需要一个 `Bird*`，但手里有一个 `Dog*`。编译器不允许我将 `Dog` 对象的指针用作 `Bird*`。然而，当我使用 `reinterpret_cast`\
  \ 将 `Dog*` 强制转换为 `Bird*` 时，编译器并没有报错，我似乎可以使用这个指针来调用 `Bird` 的成员函数 `Fly()`。这样可以吗？**\n\
  \n**A**: 再次，绝对不可以。`reinterpret_cast` 只改变了指针的解释方式，并没有改变它所指向的对象（那仍然是一个 `Dog`）。在 `Dog`\
  \ 对象上调用 `Fly()` 函数不会得到你想要的结果，并可能导致应用程序崩溃。\n\n**Q: 我有一个 `Derived` 对象，它被类型为 `Base*`\
  \ 的 `objBase` 指向。我确定 `objBase` 指向的是一个 `Derived` 对象，那么我真的需要使用 `dynamic_cast` 吗？**\n\
  \n**A**: 既然你确定所指向的对象是 `Derived` 类型，你可以使用 `static_cast` 来节省运行时性能。\n\n**Q: C++ 提供了强制转换运算符，但我被建议尽可能少使用它们。这是为什么呢？**\n\
  \n**A**: 你在家里备着阿斯匹林，但你不会因为有药吃就把它当作主食，对吧？只有在需要的时候才使用强制转换。\n\n## 节工作坊\n\n工作坊包含测验题，帮助你巩固对所涵盖内容的理解，并提供练习让你应用所学知识的机会。在检查\
