  \ (constCStyleString, 5);\n```\n\n你还可以初始化一个字符串以包含特定数量的特定字符：\n\n点击此处查看代码图像\n\n```cpp\n\
  // 初始化一个字符串对象包含 10 个 'a'\n\nstd::string strRepeatChars (10, 'a');\n```\n\n列表 16.1\
  \ 分析了一些通用的 `std::string` 实例化和字符串拷贝技术。\n\n**列表 16.1** STL 字符串实例化与拷贝技术\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <string>\n1: #include <iostream>\n2:\n3: int main ()\n4: {\n\
