  \ `erase()` 有两种重载形式：一种接受指向该元素的迭代器，另一种接受一个范围并从而从列表中删除该范围内的元素。你可以在 列表 18.4 中看到 `erase()`\
  \ 函数的实际用法，它演示了如何从列表中删除一个元素或一个范围。\n\n\n\n\n\n```cpp\n29:    linkInts.erase(linkInts.begin(),\
  \ linkInts.end());\n30:    cout << \"Number of elements after erasing range: \"\
  ;\n31:    cout << linkInts.size() << endl;\n32:\n33:    return 0;\n34: }\n```\n\n\
