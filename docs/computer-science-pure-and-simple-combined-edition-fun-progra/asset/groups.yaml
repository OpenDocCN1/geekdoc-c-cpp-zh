  mdcn: '

    一旦你假装过程是拼图碎片，而指令必须是一个完整的拼图，那么让输入和输出对齐并处于正确的顺序就变得非常简单！


    如果一条指令要生效，那么所有的空格和制表符都必须被使用。注意，这意味着指令不能以输出开头。


    ## 带有风格的编程


    计算机程序不仅仅要完成任务。它还需要具有持久生命力——这意味着它需要能够被他人轻松地理解和修改。在编写程序时，请记住以下目标：


    - 1. 提前制定好攻击计划。

    - 2. 尽可能使用短小的、单一用途的程序。这使得以后以后修改程序。

    - 3. 记录你的工作，以便下一个人能够理解。

    - 4. 代码必须对每个人在任何时候都有效运行。

    - 5. 为过程选择一致、合理的名称。


    ## 在哪里编写你的程序？


    首先，我们来谈谈*不应该*在哪里编写程序。如果你在乌龟上点击右键，或者遵循 MicroWorlds EX 提供的教程，你会发现一个对话框或“背包”，它允许你为乌龟输入指令。这**不是**一个主意！目标
    2 说明程序必须是易读的。如果指令散落在各个独立的乌龟身上，它怎么能被阅读呢？对话框与乌龟和按钮等控制控件相关，那里并不是你隐藏精妙构造代码的地方。


    你想要的是过程页面（Procedures Page）。如何找到它？


    过程页面或窗口位于图形页面（Graphics Page）的右侧，前提是选择了其下方的过程选项卡。命令中心（Command Center）在左下角。


    ![](img/242aaa06c3a3208f16d97cdd92303648_14_0.png)


    ## MicroWorlds EX 主屏幕


    ## 编写一个过程


    好了，记住我们有一条让乌龟画正方形的指令。这里再次给出：


    ```

    pd forward 50 right 90 forward 50 right 90 forward 50 right 90 forward 50 right
    90

    ```


    我们的起始项目是开发让乌龟以各种方式移动的程序。如果我们漏掉了 `pd`（下笔）指令，那么我们拥有一条让乌龟沿正方形移动的指令。让我们制作第一个过程吧。


    你可以通过编写过程来教 MicroWorlds 新词汇。还记得我们的指令是关于摆桌的吗？让我们为以下内容写一个“过程”：


    - SetTheTable

    - 从橱子里拿一个盘子

    - 走到桌边

    - 把它放在桌子上

    - 回到橱子里

    - 拿一个杯子

    - 等


    注意过程以 `to` 开头并以 `end` 结束。此外，它的名称 `SetTheTable` 没有空格。这些是 Logo 语言的要求。在这个“过程”中，你正在使用教学对象认识的词汇给她一组指令。从某种意义上说，你在教她一个新的短语，“摆桌”。


    现在我们将为 MicroWorlds 编写一套画正方形的详细指令。这就是编程的精髓，即向语言自带的现有添加新的过程和功能。


    我们该给新过程起什么名字呢？`square` 怎么样？那么，当我们想要乌龟以正方形形状移动时，我们只需要在命令中心输入 `square`，而不是上面开发的那个长指令。


    在过程页面上，输入以下内容：


    ```

    to square

    pd forward 50 right 90 forward 50 right 90 forward 50 right 90 forward 50 right
    90 end

    ```


    所有的过程都以单词 **to** 开始并以单词 **end** 结束。这样的过程为 MicroWorlds 词汇表中增加了一个新词。它使用了 **pd**，它让乌龟的“笔”落下；**forward
    50**，它让乌龟向它面对的方向移动 50 个“步”，以及 **right 90**，它让乌龟旋转 90 度，或向右转。让我们试一下！移动到图形页面。孵化一只乌龟，如果需要清除旧消息，在命令中心按
    ** **<Enter>**。然后输入 `square` 并按 **<Enter>**。


    嗯，**square** 效果并不好。问题是乌龟移动得太快了，你根本看不见它。


    事情第一次运行不正常是非常常见的。这并不是失败，意味着我们可以调整我们的过程来使其更好！


    在解决移动问题之前，我们的 **square** 过程还有另一个问题。按照现在，它并不真的具有可读性。让我们把同样的长指令分几行写，使其更具可读性。我们可以在过程页面上这样做。只是不像在命令中心那样简单。MicroWorlds
    Logo 忽略了指令跨越多行的事实。MicroWorlds Logo 只关心输入和输出是否都满足。


    修改你的过程使其看起来像这样：


    ```

    square

    pd

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    end

    ```


    这样，可读性好多了，你可以一眼看出它是如何工作的。注意，我们的过程 **square** 没有输入也没有输出，所以它的拼图碎片看起来像：


    ![](img/242aaa06c3a3208f16d97cdd92303648_16_0.png)


    事情第一次运行不正常是非常常见的。这并不是失败，意味着我们可以调整我们的过程来使其更好！


    在解决移动问题之前，我们的 **square** 过程还有另一个问题。按照现在，它并不真的具有可读性。让我们把同样的长指令分几行写，使其更具可读性。我们可以在过程页面上这样做。只是不像在命令中心那样简单。MicroWorlds
    Logo 忽略了指令跨越多行的事实。MicroWorlds Logo 只关心输入和输出是否都满足。

