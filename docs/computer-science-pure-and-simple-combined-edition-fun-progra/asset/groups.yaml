  mdcn: '


    在 MicroWorlds EX 中，我们可以为按钮设置标签和一条指令。通常情况下，让我们让它们相同。在上方图片显示“nothing”（无）的地方，在两个地方都填入
    Start。


    点击 OK。然后拖动按钮，使其紧凑地放置在图形页面（Graphics Page）的左下角。


    我建议你经常保存工作。在 PC 上，如果你同时按下 Ctrl 和 S 两个键，你将以你刚刚命的名字 Square（方形）保存修改后的项目。


    现在点击 Start 按钮。我们收到了错误消息“I don''t know how to Start”（我不知道如何启动）。这正是我们现在要教 MicroWorlds
    的内容！我们要怎么教它呢？你猜对了，我们将创建一个名为 Start 的过程。


    返回过程页面（Procedures Page）。记得怎么做吗？现在，为了在 MicroWorlds 的词汇中加入 Start 这个词，我们需要创建一个 Start
    过程。


    首先，我想对程序设计做几点说明。记住，这些课程是为了教你良好的编程技巧，而不仅仅是教你 MicroWorlds 或 Logo。C 语言是一种备受喜爱的专业语言，C++
    也是如此。这两种语言，特别是 C++，其设计旨在帮助程序员管理计算机程序的复杂性。这两种语言的每个程序执行都从一个名为 Main 的过程开始。这意味着第一个运行的过程总是被称为
    Main。如果你在读一个 C 或 C++ 程序，你通常会从寻找名为 Main 的过程开始。我觉得这是一个非常值得遵循的习惯。


    所以，我们将创建一个 Start 过程，它将调用（运行）我们的 Main 过程。在你的过程中列表中添加这些内容：


    ```

    to Start

    Main

    end


    to Main

    cc

    talkto "t1"

    ;与名为 t1 的乌龟一起工作

    repeat 20 [Square]

    end

    ```


    注意我们的新指令 `talkto "t1"`。这确保了我们指向的是第一只乌龟 t1，而不是其他乌龟。按下 <ctrl> 和 s 保存工作。


    我们现在有了一个完整的程序！Main 告诉计算机先做什么，然后做什么，以此此类推。Main 之后列出的过程告诉计算机如何执行它本身还不知道的命令。


    Main 中的第一条指令告诉 MicroWorlds 清空命令中心（Command Center）。这样我们知道看到的任何错误消息都是新的。Main 中的下一条指令告诉
    MicroWorlds 哪只乌龟应该执行后续指令中的动作。如果只有一只乌龟，则不需要那条指令，但它提高了我们程序的可读性，这正是我们的目标之一。


    第三行使用了内置的 `repeat`，它需要两个输入：一个数字和一个需要重复的指令列表。我们只有一条指令，所以为了让它成为一个列表，只需在它周围加上方括号。我们稍后会讨论列表。


    进入图形页面并点击你的 Start 按钮来尝试运行程序。现在尝试通过 View（视图）菜单并点击 Presentation Mode（演示模式）来运行它。然后点击
    Start 按钮。要退出演示模式，双击黑色边框。


    还需要做一点清理工作。随着这个程序和其他程序的增长，你的过程页面会变得非常大。所以不要在过程查找上浪费时间，你应该按字母顺序保持它们。要移动位置，在过程上方按住鼠标键并按住，将光标移动到另一侧来高亮整个过程。现在去
    Edit（编辑）菜单，选择 cut（剪切）。行似乎消失了。实际上它们在一个不可见的剪贴板上。现在将光标移动到你想让这些行出现的地方，从 Edit 菜单中选择
    paste（粘贴）。漂亮，它们出现在了新位置！这种剪切粘贴操作在几乎所有的计算机应用程序中有效。如果你想制作副本，也可以使用 copy（复制）和 paste（粘贴）。


    我通常会对 Main 做一些特殊处理，使其特别容易找到，例如在它前后输入双行。顺便说一下，MicroWorlds 是不区分大小写的，所以输入大写字母或小写字母都没关系。这是我的过程页面：


    ```

    to Main


    cc

    talkto "t1"

    ;与名为 t1 的乌龟一起工作

    repeat 20 [Square]

    end


    to square

    ;画一个 50 单位的正方形

    p

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    end


    to Start


    Main

    end

    ```


    你能想出如何使用 **repeat** 重写你的 **square** 过程吗？记住，**repeat** 需要两个输入：一个指示重复次数的数字，以及一个需要重复的指令列表——周围要带有括号
    [像这样]。


    为了让你以后能在其他时间继续这个项目，请按下 \<ctrl> 和 s 以其当前名称 **Square** 保存你的工作。向老师**运行**你的程序（通过点击
    Start 按钮），并向老师**展示**你在过程页面上的格式是正确的。


    一项作业：让我们来玩玩它。


    -   将 **square** 中的指令重复三次而不是四次。反复点击 **Start**。发生了什么？

    -   画更大的正方形。

    -   等待更长的时间。

    -   尝试不同的角度并看看你画了什么。这意味着改变对 **right**（右转）的输入。例如，使用 **right 34** 而不是 **right 90**。


    （在你做完这些更改后，用一个不同的名称保存它，例如 **mysquare**。我们稍后会打开 **Square**，并希望它是一个干净的副本。）


    ## #3：动画简介


    让我们复习一下形状中心（Shape Center）。


    首先，我们找到绘制中心（Drawing Center）。在顶部找到画笔图标，点击它。


    ![图片]


    查看顶部的图标：


    ![图片]


    风景图片允许我们选择背景。花朵窗口包含形状，而乌龟人形窗口包含用于动画的形状。点击乌龟人形图标。


    ![图片]


    这些形状是供乌龟“穿着”的。但首先我们必须将它们安装到形状中心。点击顶部的蓝色带，并按住它。将窗口移动到左侧。现在，在右侧底部找到“shapes”标签页。点击使其显示出来。它看起来像是一个点网格。


    ![图片]


    现在，让我们从左侧的 Painting/Clipart 窗口将一些形状拖到右侧的形状中心。这样，它们就有名称和数字，并且作为乌龟的“衣服”。


    ![图片]


    将鼠标指针悬停在已安装的形状上，你会看到它的名称、数字和像素大小。我们可以点击右上角的 x 来关闭 Painting/Clipart 窗口。


    点击形状中心中的一个形状，然后点击乌龟。漂亮！它穿上了形状。


    你可以孵化更多乌龟，点击一个形状，然后点击乌龟。通过先点击放大镜图标再点击形状，可以让形状变大或变小。移动乌龟。


    ## 开始


    创建一个新文件。现在我们将使用 horse1、horse2、horse3。去将你的马形状安装到形状中心，并孵化一只乌龟。


    我们将使用 setsh 命令，表示设置形状。我们给计算机设置形状列表。每当计算机调用 forward（前进）时，计算机就会回到形状列表并告诉乌龟切换下一个形状。让我们设置我们的形状。在命令中心输入：


    ```

    setsh [horse1 horse2 horse3]

    ```


    按下 <enter>。我们准备好了！现在让我们的乌龟开始走起来。


    在命令中心输入：


    ```

    fd 1

    ```


    通过在最后按下 <enter> 来执行它。


