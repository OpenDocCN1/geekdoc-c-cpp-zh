    What we need is to use the procedure ascii to look at input from the keyboard
    delivered readchar.


    Let''s try this:


    show ascii readchar


    Then press **Enter**, move the cursor to the graphics window and click, and push
    any key. What number do you get? Do it again and press any key. What number do
    you get?


    We are interested in a very limited set of ASCII numbers: those that represent
    the arrows on our keyboard. Those numbers are different for Macintosh and PC.
    So we will set up a code system that works on either a Mac or PC keyboard. What
    it boils down to this is: 28 and 37 can be left, 29 and 39 can be right, 30 and
    38 can be up, and 31 and 40 can be down.


    # Directing the Turtle''s Head


    First we will write a procedure to direct the turtle which way to point its head.
    We''ll call the procedure **direct**.


    In Main, **readchar** will pick up the keyboard input. Then **Main** will pass
    the keyboard information to **direct**. How will it do that? You remember how
    to pass information around in a program?


    A variable will do the job nicely—a little pigeonhole to hold the information.
    **Main** will put the **readchar** information in the variable, and **direct**
    will pull it out, evaluate it, and use it. Let''s call the variable **key**.


    ![](img/242aaa06c3a3208f16d97cdd92303648_120_0.png)


    **Main** uses **readchar** to read “28” as the code for the key pressed. Then
    **Main** calls **direct** and sends it the value, storing it in the variable **key**.


    Now our flow chart looks like this:'
  - '[PAGE 121]


    We will name the variable in the first line of the procedure direct, like this:


    to direct :key


    When we call direct in Main, we would normally pass a number to it, like this:

    ...

    to Main

    ndirect 30

    ...

    end


    But this time, we''ll use readchar instead of the number 30. That way, whatever
    the keyboard input is will go into the variable, like this:


    to Main

    ...

    direct readchar

    ...

    end


    In Main, we will read the keyboard input using readchar and then pass it to the
    procedure direct, storing it in the variable key. In direct we will evaluate it
    using ascii to see what the code number is. Then we will turn the turtle''s heading
    that way.


    Here is our pseudocode for direct:


    +   - If the code number is for the up arrow, set the turtle''s heading to up
    (0).

    - If the code number is for the down arrow, set the turtle''s heading to down
    (180).

    - If the code number is for the right arrow, set the turtle''s heading to right
    (90).

    - If the code number is for the left arrow, set the turtle''s heading to left
    (-90).


    It looks like we need four if-then statements, for each one. But we actually need
    eight, because for each key there are two possible code numbers (one for Mac,
    one for PC). Here is our finished code:


    ```

    to direct :key

    if (ascii :key) = 28 [seth 270 fd 1]

    if (ascii :key) = 29 [seth 90 fd 1]

    ```


    ![](img/242aaa06c3a3208f16d97cdd92303648_121_0.png)'
  - '[PAGE 122]


    ```

    if (ascii:key) = 30 [set 0 fd 1]

    if (ascii:key) = 31 [set 180 fd 1]

    if (ascii:key) = 37 [set 270 fd 1]

    if (ascii:key) = 39 [set 90 fd 1]

    if (ascii:key) = 38 [set 0 fd 1]

    if (ascii:key) = 40 [set 180 fd 1]

    if (:key = "s")stopall] ;this means stop the program

    end

    ```


    Copy this procedure into your Procedures Page; it will be your starter. You''ll
    also need to create:


    +   - a go button in the graphics window

    - on the Procedures Page a go procedure that calls Main

    - a Main procedure. We will talk about that next.


    # Pseudocode


    We will work in this way: we will create pseudocode that solves our problem. Then
    we will translate lines of pseudocode into Logo, then test. We will build the
    program by doing this over and over, adding in features as we go.


    Here''s some pseudocode to start with:


    ```

    to Main

    ;talk to turtle 1

    ;launch a process that repeats many times a call to go forward a little bit

    ;use readchar to collect info from the keyboard, and also

    ;call direct, passing to it the information collected by readchar

    end

    ```


    First, we will work on the first line of pseudocode. We''ll need more information
    on launch. Do you remember the launch procedure from Book 1?


    The Help vocabulary tells us about launch:


    ```

    launch word-or-list-to-run

    Runs the input as an independent parallel process. If the process is launched
    from the Command Center, the cursor reappears immediately. Use cancel, cancel
    the Cancel menu item, the Stop All menu item, or Ctrl+Break to stop the process.
    See also forever.

    ```


    Example:


    ```

    launch [glide 1000 1]

    rt 90

    lt 90

    ```


    Type the next instructions while the turtle is gliding.'
