    \n你也可以直接从命令中心（Command Center）调用 `square`，例如通过输入 `square 200` 并按回车。\n\n我们现在创建了一个非常好的过程，我们任何时候都可以使用。这里是我们完成的程序：\n\
    \n```\n===========\nto Main\ncc\ntalkto \"t1\"\nsetsh [horse1 horse2 horse3]\n\
    repeat 20 [square 30]\nend\n=============\n```\n\n```\nto square :length\nrepeat\
