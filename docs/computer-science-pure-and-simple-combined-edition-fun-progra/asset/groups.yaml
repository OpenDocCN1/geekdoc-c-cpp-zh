    First I would like to comment on program design. Remember these lessons are to
    teach you good programming techniques. They are not just to teach you about MicroWorlds
    or Logo. The computer language C is a favorite professional language, and so is
    C++. Both of these languages, in particular C++, have been designed to help programmers
    manage the complexity of computer programs. Both of these languages start every
    program''s execution at a procedure named Main. This means that the first procedure
    to run is always called Main. If you are reading a program in C or C++, you would
    typically start by looking for the procedure named Main. I feel it is a very good
    convention to follow.


    So we will make a Start procedure which will call (run) our Main procedure. Add
    these to your procedures:


