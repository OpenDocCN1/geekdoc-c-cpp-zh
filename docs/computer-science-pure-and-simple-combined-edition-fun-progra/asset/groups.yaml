    ## 附录 I


    ## MicroWorlds 故障排除与过程名称


    ### 故障指南


    确保每个单词之间以及单词与符号之间有空格，例如 `colorunder = 15`


    确保每个过程都以 **to** 开头并以 **end** 结尾。


    确保列表周围有方括号 [like these] 。列表项之间用空格分隔。例如：


    ```

    setsh [horse1 horse2 horse3]

    ```


    在上面的示例中，请注意名称 **horse1**、**horse2** 和 **horse3** 不包含空格。对于用作名称或名词的单词（不是过程名，过程名是动作），请确保使用像
    "**word**" 这样的双引号，否则将单词放入带方括号的列表中。如果错误信息显示 "I don''t know how to do word"，说明你忘记使用引号或方括号将
    **word** 标记为名词。这样计算机就会认为它是一个动词。（或者 **word** 是一个过程名，而你忘记编写该过程 **word** 了。）


    如果你无法确定程序中的问题所在，可以插入一些信号标记。在代码中加入几行在几处显示 **OK** 的代码。当程序通过这些位置时，会在 Command Center
    中打印 OK。这样你就知道在哪里集中精力了（即哪里没有打印输出）。解决问题后，删除这些行。


    如果你的程序运行不正常，可能是组织不当。你调用计算机的事件序列逻辑有问题。如有必要，请查看答案页中的答案。


    如果你在过程名或变量名中不小心使用了内置过程，程序将无法运行。


    如果你收到关于乌龟（turtles）的错误信息，可能是你忘记孵化所需的乌龟。


    如果你用大字母 O 代替零 (0)，程序将无法运行。


    如果错误信息显示过程需要更多输入，请关注调用该过程的那一行和随后的一行，寻找正确的输入数量以及正确的左右括号数量。


    如果你运行了此清单仍然不起作用，请尝试：使用 **Cut** 和 **Paste** 在过程页面上移动你的代码。这在 MicroWorlds 假装看不到你的某个过程时特别有效。


    ### 一些内置过程（更多见索引）：


    - cc 清除 Command Center。

    - cg 清除图形。

    - pd 画笔。

    - forward 或 fd 让当前乌龟向头部指向的方向移动若干步。步数是必填输入。（back 是反的）。

    - right 让当前乌龟向右转几度。度数是必填输入。（left 是反的。）

    - wait 接收一个输入，一个数字。

    - repeat 需要两个输入：一个表示重复次数的数字，和一个要重复的指令列表。列表周围有方括号 [ ]。

    - Presentation Mode（演示模式）：进入 Gadgets 菜单并点击 Presentation Mode。然后点击 Start 按钮。要退出演示模式，点击
    MicroWorlds 之外的屏幕黑色部分。

    - talkto ''tl'' 与名为 tl 的乌龟交互。

    - set color 接收一个数字输入，设置乌龟画图的颜色。

    - random 接收一个数字输入，随机产生一个小于输入值的数字。

    - set random 100 将在每次重复时生成一个随机的新颜色。

    - fill 用乌龟设置的颜色填充区域。

    - seth heading 设置乌龟将移动的方向。接收一个数字输入。0 是向上，向右是 -90 或 270 是向左，180 是向下。示例：set 90。

    - setsh, set shape 需要一个输入，该输入是一个单词（必须是形状的名称，例如 setsh ''horse1''）或一个单词列表（必须是形状名称列表）。它改变乌龟的形状。首先使用
    talkto 指向特定的乌龟。如果你给出一个形状列表，程序每次调用 forward 或 back 时都会从列表中取一个新形状。

    - local 预留并命名一个存储位置。

    - make 放入一个值。

    - show 接收一个输入，一个单词或列表，并将其打印在 Command Center 上。

    - : 读取存储位置中的值。

    - ycor 输出乌龟在屏幕上的 y 坐标。

    - xcor 输出乌龟距离左边的 x 坐标。

    - sety 接收一个数字并设置 y 坐标。

    - setx 接收一个数字并设置 x 坐标。

    - launch 接收一个像这样的带括号的指令列表并运行。


