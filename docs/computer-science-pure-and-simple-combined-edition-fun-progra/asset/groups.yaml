  - '[PAGE 80]


    On the Graphics Page, drag the t2/pond out of the way and drag the t1/dog into
    the middle of the gray splotch. This should now make the Shape Center and be the
    pond is selected. Click on the first turtle, t1, look like the pond.


    Our animation code will take care of making t2 look like a dog, if we change the
    code. Go to the Procedures Page. We need to change our talkto line so that we
    are now talking to t2. Change Main as shown:


    +   to Main

    cc

    talkto "t2"

    setsh [dog1 dog2]

    seth 270

    repeat 200

    [Walk 10 10]

    end


    Give the program a try. There, that solves Problem 2. What do you think would
    be the way to solve Problem 1?


    # Go the distance


    I think we need to change our procedure doJump or to make a different procedure
    that both jumps up and forward. I like the first option of revising our existing
    procedure doJump and making it more flexible. We will try to make it so that it
    can be used both to jump up and down and jump over something.


    To jump over an object, the turtle needs to move up and also move forward a certain
    amount. We need a second input to doJump so we can control how far forward the
    turtle should move while it is jumping. Let''s think like:


    +   We will need two variables or mailboxes to store two values, height and a
    new one—how about distance?

    We''ll set up a local variable, originalY, to hold the original y coordinate value.

    We''ll put the original y coordinate in there.

    Now we''ll set y to a new number, the sum of the old one and the value in height.
    We will wait a second.

    Now we need to move forward to clear the pond. How about going forward by the
    amount stored in the variable/mailbox distance? Then wait a second.

    Then set the y coordinate back to the original value.


    Can you set up Logo code to match this line of reasoning? Try it. Then turn the
    page to mine, and see if yours is different.'
  - '[PAGE 81]


    Here is my doJump : : :


    ```

    to doJump :height :distance

    local "originalY"

    make "originalY" ycor

    sety sum ycor :height

    wait 1

    forward :distance

    wait 1

    sety :originalY

    end

    ```


    We also need to change where we call doJump. to reflect two variables instead
    of one.


    ```

    to colorGrayHit

    doJump 50 100

    end

    ```


    It works! Finally we have a little procedure that can be used to make turtles
    jump over things.


    You will notice that your jump button doesn''t work any more. To fix that, have
    it call doJump using two variables instead of one. How about this?


    ```

    to jump

    doJump 30 30

    end

    ```


    # Launching skaters


    Before I end this lesson, let''s have a little fun. Hatch another turtle and put
    it at the same distance out the screen as your gray splotch. This turtle is automatically
    named "t3." You can check this by right-clicking on it.


    I would like to use the skater shapes-- skater1, skater2 and skater3--at the same
    time as the dog. If you have MicroWorlds EX, go ahead and install the skater shapes.
    How about if we modify the end of Main to add a section that says to t3, set shape
    to skater1, skater2, and skater3, and use the walk procedure to make it skate?


    Program this on your own before turning the page. But don''t spend too much time
    on it because there is a bit of information that we have not talked about yet.


    (Which way did your skater go the first time you tried your solution?)'
  - '[PAGE 82]


    Here is my ''first try'' which does not work right:


    ```

    to Main

    cc

    talkto "t2"

    setsh [dog1 dog2]

    setsh 270

    repeat 200

    [walk 10 10]

    talkto "t3"

    setsh [skater1 skater2 skater3]

    setsh 90

    repeat 200

    [walk 10 10]

    end

    ```


    When you try this program, you will see that the dog continues to do its thing
    properly, but the skater never moves. Perhaps the dog is walking too many times.
    Change your Main as follows:


    ```

    to Main

    cc

    talkto "t2"

    setsh [dog1 dog2]

    setsh 270

    repeat 5

    [walk 10 10]

    talkto "t3"

    setsh [skater1 skater2 skater3]

    setsh 90

    repeat 200

    [walk 10 10]

    end

    ```


    Try and let it run for a few minutes. First the dog correctly does its thing and
    then the skater does her thing. If you follow the lines in Main, this repeat procedure
    causes the program to run the following list of instructions [Walk 10 10] over
    and over and proceeds to the next line.


    But what we really want is for a process to be launched making the dog walk and
    then for the program to continue to the next line and launch another process to
    make the skater, at the same time. This can be done using the built-in procedure
    launch. Launch has as an input a list of instructions to run as a separate process.
    Change your Main as follows:'
  - "[PAGE 83]\n\n```\nMain\ncc\ntalkto \"t2\nsetsh [dog1 dog2]\nseth 270\nlaunch\
    \ [repeat 200 [walk 10 10] ]\ntalkto \"t3\nsetsh [skater1 skater2 skater3]\nseth\
    \ 90\nlaunch [repeat 200 [walk 10 10] ]\nend\n```\n\nThere! Pretty cool, eh! Be\
    \ sure to save your work. This program launches two processes that operate independently.\n\
    \n# Exercise your skills\n\nLearning how to program is a bit like learning to\
    \ ride a bike. Your teacher can tell you how to do it; others can show you how\
    \ to do it; and you can read about it. But there is only one way to learn and\
    \ how that is to do it. You have learned quite a few built-in procedures and some\
    \ programming techniques. You should consolidate your knowledge by actually putting\
    \ these things to use.\n\n+   1. Save your file under jump2. Now save it as tornado.\n\
    2. Modify the file so as to make the following things happen at the same time\
    \ as the dog running and jumping the skater:\n    * Place another turtle, t4,\
    \ in the shape of a castle in the lower right corner of the picture.\n    * Yet\
    \ another turtle, t5, takes the shapes of tornado1 and tornado2, and moves to\
    \ the right towards the castle.\n    * Spray-paint some turquoise blue (cyan)\
    \ near the castle. When it strikes the blue, the tornado jumps over the castle.\n\
    \    * When the tornado jumps, the castle turns into a cloud and then back into\
    \ a castle.\n3. In a new file, draw a maze with the drawing palette, using blue\
    \ lines. Using the same idea as colorGrayHit, set up a turtle proceeding through\
    \ your maze. Start with a start button. You may want to use the procedure random,\
    \ which delivers a random number. Random 100, for example, returns a number between\
    \ 0 and 99."
  - '[PAGE 84]


    # #14 Supercharge Your Browser


    What is a plug-in?


    If a company wants Web surfers to be able to see their program''s files in the
    surfer''s web browsers, then the company can write a plug-in to be added to the
    browser. The plug-in adds a further capability to the browser. Web browsers (Microsoft
    Internet Explorer and Firefox) have the built-in functionality to display different
    types of files such as html, jpg, gif and java applets. With plug-ins, you can
    extend the capabilities of your browser to view other file types.


    The programmers for MicroWorlds have built a plug-in. If you download and install
    the plug-in (instructions to follow) then you can actually run a MicroWorlds project
    right in your browser, animation and everything! It is very cool.


    Getting the plug-in


    As soon as you say "download," a lot of people say to themselves, "Oh, that''s
    too technical for me!" and leave. Did you realize that you successfully downloaded
    any text that you have read on the Internet? That''s right, a page is "downloaded"
    from a Web server to your computer, and because it is an HTML file, your browser
    knows how to display it. Downloading just means moving from a Web server to your
    computer.


    When you download an HTML file or a jpg or a gif, they are displayed in your browser.
    If you try to download an exe (executable) file, Internet Explorer and Firefox
    assume you want to save it to disk and will ask you where you want to save it.


    I am going to walk you step by step through the process of getting and installing
    the plug-in on a PC. For a Mac, follow the directions on the plugin website.


    First, go to www.microworld.com. Select the icon at the lower left for downloading
    free MicroWorlds Web Player.


    ![](img/242aaa06c3a3208f16d97cdd92303648_84_0.png)


    This leads you to a page where you choose Web player to download. Do you have
    a PC or Mac? Find the right download link and click on it. Save it to your computer.
    Install it.


    After the plug-in is installed, you can re-start your browser.


    Now Test It


    You can find the project library at www.MicroWorlds.com. Play with these and guess
    how they work. Pick one to work on yourself.'
