    ```

    ;如果答案是 N，等待一会儿，并停止分号。

    ```


    注意，这不是 Logo 语言，而是伪代码，所以我们在前面加上分号。

    这里是另一种方法：不要在顶部使用 `forever`；直接在循环中开始步骤。在在循环结束时，询问用户是否继续，或输入 N。如果答案是 Y，我们调用 Main。如果是
    N，我们就不调用。所以我们是在 Main 内部调用 Main。听起来很奇怪吗？只要你有退出循环的方法，它就能运行。


