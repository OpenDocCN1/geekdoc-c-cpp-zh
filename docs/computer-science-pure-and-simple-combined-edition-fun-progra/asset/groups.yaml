  mdcn: "\n在图形页面（Graphics Page）上，将 `t2/pond` 移开，并将 `t1/dog` 拖到灰色斑块的中间。这应该会让形状中心（Shape\
    \ Center）确定并选中池塘。点击第一只乌龟 `t1`，它现在看起来像池塘。\n\n如果我们修改代码，我们的动画代码将负责让 `t2` 看起来像狗。进入过程页面（Procedures\
    \ Page）。我们需要修改 `talkto` 行，以便我们现在对 `t2` 说话。按照所示所示修改 `Main`：\n\n```logo\nto Main\n\
    \  talkto \"t2\"\nsetsh [dog1 dog2]\nseth 270\nrepeat 200\n  [Walk 10 10]\nend\n\
    ```\n\n尝试运行这个程序。好了，这解决了问题 2。你认为解决问题 1 的方法是什么？\n\n## 跨越距离 (Go the distance)\n\n\
    我认为我们需要修改我们的 `doJump` 过程，或者创建一个既能向上跳又能向前跳的不同过程。我更喜欢第一种方案，即修改现有的 `doJump` 过程使其更灵活。我们将尝试让它既能用于向上和向下跳，也能用于跳过物体。\n\
    \n要跳过一个物体，乌龟需要向上移动并向前移动一段距离。我们需要为 `doJump` 添加第二个输入参数，以便控制乌龟在跳跃时向前移动多远。让我们这样思考：\n\
    \n- 我们需要两个变量或邮箱来存储两个值：高度（height）和一个新值——距离（distance）觉得怎么样？\n- 我们将设置一个局部变量 `originalY`\
    \ 来保存原始的 y 坐标值。\n- 我们把原始 y 坐标存进去。\n- 现在我们将 `y` 设置为一个新数字，旧值与 `height` 中的值之和。等待一秒。\n\
    - 现在我们需要向前移动以避开池塘。按照变量/邮箱 `distance` 中存储的向前前进如何？然后等待一秒。\n- 然后将 `y` 坐标设回原始值。\n\n\
    你能编写符合这一逻辑链的 Logo 代码吗？尝试一下。然后翻到我的页面，看看你的和我的是否有不同。\n\n这是我的 `doJump`：\n\n```logo\n\
    to doJump :height :distance\n  local \"originalY\"\n  make \"originalY\" ycor\n\
    \  sety sum ycor :height\n  wait 1\n  forward :distance\n  wait 1\n  sety :originalY\n\
    end\n```\n\n我们还需要修改调用 `doJump` 的地方，以反映两个变量而不是一个。\n\n```logo\nto colorGrayHit\n\
    \  doJump 50 100\nend\n```\n\n它运行了！我们终于有了一个可以用来让乌龟跳过物体的过程。\n\n你会发现你的跳跃按钮不再工作了。要修复这个问题，让它使用两个变量而不是一个来调用\
    \ `doJump`。你看这样如何？\n\n```logo\nto jump\n  doJump 30 30\nend\n```\n\n## 启动冰冰 (Launching\
    \ skaters)\n\n在结束这节课之前，让我们玩点有有趣的。孵化另一只乌龟，并把它放在屏幕外与你灰色斑块相同距离的地方。这只乌龟会被自动命名为 \"\
    t3\"。你可以通过右键点击它来检查。\n\n我想在和狗的同时使用滑冰冰形状——`skater1`、`skater2` 和 `skater3`。如果你有 MicroWorlds\
    \ EX，请去安装滑冰冰形状。如果我们修改 `Main` 的结尾，添加一个部分，让 `t3` 设置形状为 `skater1`、`skater2` 和 `skater3`，并使用\
    \ `walk` 过程让它滑冰，怎么样？\n\n在翻页之前自己编写这个程序。但不要上面花费太多时间，因为还有一些我们还没有讨论过的信息。\n\n（当你第一次尝试你的解决方案时，你的滑冰冰往哪个方向走了？）\n\
    \n这是我的“第一次尝试”，它运行得不对：\n\n```logo\nto Main\n  talkto \"t2\"\n  setsh [dog1 dog2]\n\
    \  seth 270\n  repeat 200\n    [walk 10 10]\n  talkto \"t3\"\n  setsh [skater1\
    \ skater2 skater3]\n  seth 90\n  repeat 200\n    [walk 10 10]\nend\n```\n\n当你尝试这个程序时，你会发现狗继续正常地做它的事情，但滑冰冰永远不动。也许是狗走的次数太多了。如下所示修改你的\
    \ `Main`：\n\n```logo\nto Main\n  talkto \"t2\"\n  setsh [dog1 dog2]\n  seth 270\n\
    \  repeat 5\n    [walk 10 10]\n  talkto \"t3\"\n  setsh [skater1 skater2 skater3]\n\
    \  seth 90\n  repeat 200\n    [walk 10 10]\nend\n```\n\n尝试让它运行几分钟。首先狗正确地做它的事情，然后滑冰冰做她的事情。如果你遵循\
