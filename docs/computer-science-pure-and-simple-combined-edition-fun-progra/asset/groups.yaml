    # 为什么选择 MicroWorlds？


    本书教授使用 MicroWorlds 进行编程，这是一种基于 Logo 计算机语言的应用程序。它出色地完成了我们的工作：


    -   通过图形，它能立即向年轻程序员展示他们努力的成果。它让计算机科学不再困难。

    -   它向学生介绍了计算机语言的通用元素，包括变量和逻辑。一旦学生学会了一种计算机语言，学习其他语言就会变得容易。

    -   简单的动画非常易于制作。

    -   Visual Basic 及其变体 Small Basic 也为编程提供了图形化结果。我相信它们在设计时没有考虑到 Logo 背后固有的趣味性。

    -   Scratch 同样来自麻省理工（MIT），是一个适合幼儿儿童的选项，易于使用。但它不像 Logo 那样具备工作场所计算机语言的完整功能。我无法将我的游戏适配到
    Scratch，因为 Scratch 无法处理复杂的代码。


    # 计算机要求


    MicroWorlds EX 需要：


    -   PC：Windows 2000 到当前的 Windows 操作系统。

    -   Mac：OSX 10.3.9 及更高版本。


    软件会随着操作系统的发布保持更新。


    # 关于作者


    Phyllis Wheeler 是一位机械工程师，也是家庭教育的老兵，曾在圣路易斯的一个家庭教育合作体中教授计算机科学。在此期间，她编写了一些计算机程序并参加了一些计算机课程。她还担任过报纸记者和自由撰稿人。她拥有斯密学院的英语学士学位和圣路易斯华盛顿大学的机械工程学士学位。


    Don Sleeth 是加拿大的一位计算机专业人士。


    # 第一部分：MicroWorlds 编程简介


    # 使用 MicroWorlds EX


    你应该先在网上查看 MicroWorlds EX 的教程视频。你可以在 www.MotherboardBooks.com 的支持页面找到它们。


    “过程（Procedures）”页面或窗口位于图形（Graphics）页面的右侧，前提是选择了下方的“过程”选项卡。命令中心（Command Center）位于左下角。


    ![](img/242aaa06c3a3208f16d97cdd92303648_9_0.png)


    点击过程页面部分下方的“形状（Shapes)”选项卡即可访问形状中心。在使用任何非乌龟形状之前，你需要将形状从绘图/绘画窗口导入到你的形状中心。


    点击顶部类似于带有画笔的黄色记事板的图标。打开绘图/绘画/剪贴画窗口。点击菊花图标查看单个形状，或点击双人图标查看动画形状。


    现在，点击顶部的蓝色带并按住鼠标按钮向侧拖动，将绘图窗口向左移动。确保右侧窗口是形状中心，点击下方标有“Shapes”的选项卡。


    ![](img/242aaa06c3a3208f16d97cdd92303648_9_1.png)


    如上所示，从绘图/绘画窗口将单个形状拖到形状中心以进行安装。当形状安装好后，将鼠标悬停在它上方即可查看它的名称、编号和以像素为单位的大小。一旦通过这种方式安装了形状，你就可以在程序中使用它。


    ## #1 Logo 过程与输入


    ### 我将学什么？


    Logo 是一种编程语言。为了学习它，我们将使用 MicroWorlds，这是一种你从 MicroWorlds 单独购买的计算机程序。书中的 Logo 课程旨在向5-12年级的个人学生教授计算机使用和编程的基础。我们将教你一些基础计算机技能。我们还将教你如何编写能够正常运行并能随着时间推移不断改进的程序。这将为你在编程技术方面打下坚实的基础，让你用任何语言开发程序。


    ### 是什么计算机语言？


    有许多不同的编程语言，就像许多人类语言一样。人类语言有动词、名词和形容词。编程语言也有类似的元素，如过程和变量。这些构建块是任何语言中计算机编程的基础，学习它们非常重要。一旦你学会了一种计算机语言，学习下一个、再下几个就会容易得多。


    我选择 Logo 是因为它能让我教你如何在短时间内构建出既有趣又完整的程序。


    就像人类语言可以用不同的口音说话，计算机语言也是如此。我在课程中使用的 Logo 版本来自 Logo Systems Inc. 公司的一款名为 MicroWorlds
    的商业产品。


    ### 我们要向哪里去？


    我们将学习一些技术，让你能够画出自己有趣的场景，并添加大量的动作和动画。在书的后面，我们将制作几个游戏。


    ### 什么是程序？


    程序是给计算机的指令列表。假设我们要给某人列一份关于如何摆餐桌的简单英文指令。这份指令列表可能像这样：


    -   从橱子里拿一个盘子

    -   走到桌子旁

    -   把它放在桌子上

    -   回到橱子

    -   拿一个玻璃

    -   以此类推。


    但给计算机的指令是使用计算机可以理解的特定单词列表编写的。例如，“forward 50”意味着向前走 50 个乌龟步。这些给计算机的动作词被称为“过程（procedures）”。


    乌龟（turtle）是什么？它是我们在屏幕上的小画画伙伴。我们假装它拿着一支笔，可以放下笔画画，也可以拿起笔在移动时不留画痕迹。它可以穿各种衣服——它可以看起来像马、狗，甚至像房子或池塘。它很棒的一点在于，只要我们使用它能理解的词，它就会遵守每一个命令。


    所以，如果程序是给计算机的指令列表，而指令是过程列表，且 MicroWorlds 已经知道许多过程，那么我们必须准备好编写程序了！


    # 指令与过程


    我们需要开始找到我们的乌龟。使用 MicroWorlds EX，我们首先选择“自由模式（free mode）”。当画面出现时，我们必须点击顶部的孵化图标来孵化一只乌龟。然后点击屏幕，你就有一只乌龟了。


    现在，让我们从一条指令开始。


    在命令中心（屏幕底部的区域），输入这个：


    ```

    pd forward 50

    ```


    Pd 代表“pen down”（下笔）。我们正在告诉乌龟放下笔并向前移动 50 个乌龟步。现在我们按 <回车>。


    乌龟听从了！它朝着面向的方向移动了 50 个乌龟步。我们需要学习一个新词，“输入（input）”。在我们的例子中，输入就是数字 50。输入是 `forward`
    过程需要的数字。（有些过程还有输出：它们会给你一个数字。）


    在命令中心，输入以下行代码：


    ```

    pd forward 50 90 forward 50 90 forward 50 90 forward 50

    ```


    当光标到达末尾时，太了！我们的第一个指令让乌龟画了一个正方形。


    让我们分析这一行指令。线上所有的单词都是过程名称：


    -   pd：放下当前乌龟画笔的过程，没有输入，没有输出

    -   forward：让当前乌龟朝着它的方向移动一定步数的过程。数字是必需输入

    -   right：让当前乌龟向右转一定角度的过程。数字是必需输入


    最后两个过程都需要一个输入。


    # 过程输入与输出


    Logo 过程可以被看作拼图碎片。我们作为程序员的工作是构建能够完美匹配的拼图。我们将构建的过程，以及 MicroWorlds 自带的过程，都有特定数量的输入。可以是零输入（如
    **pd**）、一个输入（如 **forward**）或更多。过程也可以有零输出（如 **forward**）或一个输出（如 **sum**）。


    没有输入的过程仅仅是一个拼图碎片。需要输入的碎片在右侧有一个洞。旁边的输出拼图碎片在左侧有一个凸起。所以它们可以组合。当我们在指令中使用过程时，我们必须提供所需的输入，并为输出提供位置，这样整个指令才是正确的。把它想象成一个单行的拼图。


    这里有一个带输入的过程：


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_0.png)


    如你所见，**forward** 有一个需要数字输入的洞。期望一个数字作为输入的过程将具有合适的开口来匹配数字。指令行的开头必须是实心的，即没有输出凸出，结尾也是如此。


    这里有一些指令。尝试猜猜哪些是有效的，哪些无效。


    将它们输入命令中心来测试你的猜测。


    指令 1


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_1.png)


    指令 2


