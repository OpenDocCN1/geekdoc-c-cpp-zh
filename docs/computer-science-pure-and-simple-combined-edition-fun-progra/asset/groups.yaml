    # Programming with style


    A computer program has achieve more than just doing the job. It needs to have
    staying power—meaning that it needs to be easily understood and changed by others.
    Here are some goals to keep in mind when writing a program:


    +   1. Set up the plan of attack ahead of time.

    2. Use small, one-purpose-only procedures whenever possible. This makes it easy
    for someone to change the program later.

    3. Document your work so the next person can understand it.

    4. The code must work every time for everyone.

    5. Choose consistent, sensible names for procedures.


    # Where to write your program?


    First, let''s talk about where *not* to write your program. If you right-click
    on a turtle or follow the tutorials supplied with MicroWorlds EX, you find a dialog
    box or "backpack" which allows you to enter your instructions for the turtle.
    This is NOT a good idea! Goal number 2 says that the program must be easily read.
    How can it be read if instructions are scattered all over the place with individual
    turtles? The dialog boxes are associated with the controls such as turtles and
    buttons are not where you want to hide your beautifully crafted code.


    What you want is the Procedures Page. How do you find it?


    The Procedures Page or window is to the right alongside the Graphics Page, provided
    the Procedures tab beneath it is selected. The Command Center is to the bottom
    left.


