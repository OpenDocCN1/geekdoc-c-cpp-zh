    it looks a lot like the one for Race, but there is a loop in it.


    ![](img/242aaa06c3a3208f16d97cdd92303648_177_0.png)


    ## Flow Chart for City


    First, let''s consider what code we will use to make our loop. We will have a
    bunch of steps, and at the end of the steps, we will get input from the user on
    whether to loop or not. We could pattern our loop after Hangman loop, using forever
    to start it, and stopping it with an if statement at the end. For example, we
