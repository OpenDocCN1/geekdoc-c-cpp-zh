    repeat 20 [Square]

    end


    to square

    :画一个边长 50 单位的正方形

    pd

    repeat 4 [forward 50 right 90 wait 1]

    end


    to Start

    Main

    end

    ```


    将它保存为 House。这会创建一个它的副本，我们将对其进行修改。


    到目前为止，我们只画过正方形或直线。让我们来做一些实验，看看是否能画出一个三角形。进入命令中心（Command Center），输入 `ce <center>`
    清空命令中心，然后输入 `eg <center>` 清空图形。


    首先，我们来谈角度（Degrees）。角度测量的是你旋转了多少度。当乌龟画正方形时，它转了 90 度弯。所以，90 度转弯是直角的度量。但是，1 度到底是多少呢？在命令中心，让我们告诉乌龟放下笔，旋转
    1 度，前进 50 单位再后退 50 单位。


    嗯。它转了多少度？很难看出。显然，1 度并不多。现在，如果我们让它重复这些相同的命令 45 次呢？


    90 次？足够绕一整圈了吗？不断尝试，直到你的乌龟画出一颗星形。记住 `repeat` 有两个输入值：重复的次数，以及要重复的命令列表。你刚刚学会了圆有 360
    度，而每一度对乌龟来说都是一个微小的旋转。


