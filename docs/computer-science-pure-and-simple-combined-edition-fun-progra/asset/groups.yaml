    \n你会发现你现在有可用的绘画工具。\n\n![](img/242aaa06c3a3208f16d97cdd92303648_27_0.png)\n\nMicroWorlds\
    \ EX 绘画工具\n\n你可以喷涂不同的颜色。只需选择一种颜色，点击喷漆罐，然后点击图片进行喷涂。你可以在任何地方放置实色的正方形和圆形。只需点击正方形或圆形工具，然后点击屏幕。尝试按住鼠标按钮并拖动。你可以使用油漆填充整个单色区域。你可以使用喷漆散布彩色的斑点。你可以使用看起来像这些的图标来反转绘画或旋转它：\n\
    \n你可以用带阴影的正方形和圆形来绘制它，并填充格纹。如果你愿意，可以保存该形状。或者你可以点击“取消（cancel）”。\n\n所以这是你的下一个挑战：为你的动画创建三个形状。它可以是一个爆炸（使用喷漆罐）、一个由矩形和圆形组成的简单动物，或任何东西。由于动画由相关的形状组成，制作一个生长的东西比会走的要容易得多。（对于会走的形状，你必须画出不同位置的腿。）对于生长类动画，一个形状很小，另一个中等，另一个很大。爆炸就是一种生长动画。\n\
    \n![](img/242aaa06c3a3208f16d97cdd92303648_28_0.png)\n\n# 学生制作动画形状\n\n在你创建一个形状后，你会发现它下方有一行空行，你可以在那里为它输入名称，例如\
    \ `pow1`、`pow2` 或 `pow3`。不过，名称并不是必须的。保存后，将鼠标箭头悬停在它上方查看它是如何被编号的。你可以使用名称或数字在命令 `setsh`\
    \ 中引用它。\n\n所以你可以说：\n\n- `setsh [pow1 pow2 pow3]`\n\n或者你可以说：\n\n- `setsh [35 36\
    \ 37]`\n\n如果你的动画是走的，设置它的方向让它向侧面移动，并以中等步长移动，如下：\n\n- `seth 90 repeat 100 [fd 3\
    \ wait 1]`\n\n如果你的动画是生长的，让它以极小的步长向前移动，即步长的分之一，写为 .01：\n\n- `seth 90 repeat 100\
    \ [fd .01 wait 1]`\n\n记住，在动画中，首先设置形状，然后向前移动。\n\n![](img/242aaa06c3a3208f16d97cdd92303648_28_1.png)\n\
    \n# 学生制作爆炸形状\n\n# #4 Logo 奔马\n\n从文件菜单中，打开你名为 Square 的项目。然后从文件菜单选择“另存为项目”并将项目保存为\
