    ```\nto square\n  ;画一个边长为50单位的正方形\n  pd\n  repeat 4 [forward 50 90 wait 1]\n \
    \ end\n```\n\n```\nto Start\n  Main\n  end\n```\n\n# 尝试你的创作\n\n前往形状中心。安装一些形状。\n\
    \n在你的形状中心，点击一个形状。然后点击图形页面（Graphics Page）上的乌龟。现在它戴上了那个形状！点击 Start 按钮。它出发了！乌龟戴着什么形状没关系。它仍然绕正方形移动。注意，虽然黑色乌龟形状的头部随着它的移动方向旋转，但它可以戴的其他形状并不会。要查看底层乌龟面向哪个方向，你可以将其改回乌龟形状。\n\
    \n在过程 `square` 中调整乌龟向前移动。使用放大镜更改乌龟形状的大小。\n\n让我们制作乌龟动画。`seth` 需要一个输入，可以是单词（必须是形状名称）或单词列表（必须是形状名称列表）。以下是两者的示例：\n\
    \n# setsh \"horse1\nsetsh [horse1 horse2 horse3]\n\n安装 horse1、horse2 和 horse3。\n\
    \n在形状中心，使用 `seth` 改变乌龟移动的方向。记住 `seth` 的单位是度，衡量乌龟旋转的程度。`seth 0` 让乌龟头部头部朝上。`seth\
    \ 90` 让头部指向右侧。`seth -90`（或 `seth 270`）让它指向左侧。`seth 180` 让它指向下方。\n\n你还可以通过在形状中心双击形状，然后点击“翻转（flip）”图标来反转马或狗形状的方向。\n\
