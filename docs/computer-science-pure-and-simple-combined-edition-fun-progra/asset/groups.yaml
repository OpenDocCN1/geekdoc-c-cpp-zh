    # #21 Maze II: Win or Lose?


    Our starter maze does part of the assignment: it moves the turtle through some
    lines we have drawn, based on input to the keyboard''s arrow keys. Now we want
    to do this part of the assignment: when the turtle bumps into a maze line, the
    user loses and has to start over.


    # Draw up a Plan


    In our flow chart, we will need a diamond-shaped decision box as the next item
    down from the launch step. The decision box means the computer will decide whether
    a condition is true. If it is true, it goes down to the next steps (telling the
    user "lose" and resetting the game). If it is false, it repeats the previous step.
    Like this:


    ![](img/242aaa06c3a3208f16d97cdd92303648_127_0.png)


    The condition will be this: did t1 run into a maze wall? Or more specifically,
    is it "colorunder" 15 for red?


    # First, More Sandboxing!


    We need to learn more about some Logo procedures.


    **Colorunder** is a procedure which has as output the number of the color the
    turtle is running into. If the turtle runs into a **red** maze wall, the code
    can be detecting by checking to see if **colorunder** = 15.


    If **colorunder** = 15 is true, we want to go on to the next step: announcing,
    "You lose."


    Since we have launched a continuing process, though, we won''t use


    ```

    if (colorunder=15)

    ```


    That would only check once.


    We have to use another procedure, **waituntil.'
