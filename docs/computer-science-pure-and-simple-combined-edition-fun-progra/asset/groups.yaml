    \ 的输入是一个列表，所以它在括号中。输入必须是能够求值为真或假的内容。这意味着我们的代码需要：\n\n```\n;启动一个持续运行的进程\n;waituntil\
    \ [某事为真]\n;announce “你输了!”\n```\n\n首先，消除之前的伪代码。它似乎变得越来越复杂了。现在有了：\n\n```\n;启动一个持续运行的进程\n\
