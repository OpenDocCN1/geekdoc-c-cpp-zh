    and **Paste** to move your code around the Procedures Page. This especially works
    if MicroWorlds is pretending not to see one of your procedures.


    ### Some Built-In Procedures (see Index for more):


    - cc clear the Command Center.

    - cg clears graphics.

    - pd puts the current turtle''s pen down and requires no inputs and has no outputs.

    - forward or fd moves the current turtle in the direction its head is pointing
    by a number of steps. The number of steps is a required input. (back does the
    opposite).

