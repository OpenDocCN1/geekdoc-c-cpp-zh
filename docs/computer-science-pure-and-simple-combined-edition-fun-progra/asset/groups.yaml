    # Why choose MicroWorlds?


    This book teaches programming using MicroWorlds, an application based on the Logo
    computer language. It does our job admirably:


    - Using graphics, it instantly shows young programmers the results of their efforts.
    It makes computer science instead of difficult.

    - It introduces students to the universal elements of computer languages, including
    variables and logic. Once students learn one computer language, it will be easy
    to pick up another.

    - Simple animations are easy to make.

    - Visual Basic and its variation Small Basic also provide a graphic result to
    programming. I believe they were not designed with the inherent sense of fun that
    lies behind Logo.

    - Scratch, also from MIT, is an option for younger children that is easy to use.
    But it doesn''t contain the full capabilities of a workplace computer language
    in the way that Logo does. I was unable to adapt my games for Scratch because
    Scratch couldn''t handle the complex coding.


    # Computer requirements


    MicroWorlds EX requires:


    - PC: Windows operating systems from Windows 2000 to current.

    - Mac: OSX 10.3.9 and higher.


    The software is kept current with operating system releases.


    # About the Authors


    Phyllis Wheeler is a mechanical engineer and homeschooling veteran who taught
    computer science in a homeschool co-op in St. Louis. Along the way she has written
    some computer programs and taken some computer courses. She has also worked as
    a newspaper reporter and freelance-writer. She has bachelor''s degrees in English
    from Smith College and in mechanical engineering from Washington University in
    St. Louis.


    Don Sleeth is a computer professional in Canada.


    # Part 1: Introduction to MicroWorlds Programming


    # Using MicroWorlds EX


    You should first look at tutorial videos online for MicroWorlds EX. Find them
    at the support page of www.MotherboardBooks.com.


    The Procedures "Page" or window is to the right alongside the Graphics "Page,"
    provided the Procedures tab beneath it is selected. The Command Center is to the
    bottom left.


    ![](img/242aaa06c3a3208f16d97cdd92303648_9_0.png)


    You access the Shapes Center by clicking on the Shapes tab below the Procedures
    Page section. You will need to import shapes from the drawing/painting window
    to your Shapes Center before using any non-turtle shapes.


    Click on the icon at the top that looks like a yellow pad with paintbrush. The
    drawing/painting/clipart window opens up. Click on the daisy icon to see single
    shapes or the two-people icon to see animation shapes.


    Now drag the drawing window over to the left by clicking down on the blue band
    at the top and holding the mouse button down, dragging sideways. Make sure the
    window on the right is the shape center by clicking on the tab beneath it that
    says Shapes.


    ![](img/242aaa06c3a3208f16d97cdd92303648_9_1.png)


    Drag individual shapes from the drawing/painting window to the Shape Center to
    install them, as shown above. When the shape is installed, pause your mouse over
    it to see its name, number, and size in pixels. Once a shape is installed in this
    way, you can use it in your programs.


    ## #1 Logo Procedures and Input


    ### What will I learn?


    Logo is a programming language. To learn it we will use MicroWorlds, a computer
    application that you purchase separately from MicroWorlds. The Logo lessons in
    this book are intended to teach individual students in grades 5-12 the basics
    of computer use and programming. We will teach you some basic computer skills.
    We will also teach you how and to write programs that will work properly and can
    be improved on time goes by. This will give you a solid foundation in programming
    techniques so you can develop programs in any language.


    ### What computer language?


    There are many different programming languages, just like there are many human
    languages. Human languages have all verbs, nouns and adjectives. Programming languages
    too have similar elements, like procedures and variables. It is these building
    blocks that are basic to computer programming in any language that it is important
    to learn. Once you learn one computer language, it is much easier to learn the
    next and the next.


    I chose Logo because it allows me to teach you to build programs that are fun
    and complete in a short time.


    Just like human languages can be spoken with different accents, so it is with
    computer languages. The version of Logo that I use in these lessons is from a
    commercial product named MicroWorlds from Logo Systems Inc.


    ### Where are we headed?


    We will learn techniques that will allow you to draw your own interesting scenes
    and add lots of movement and animation. Later in the book we will make several
    games.


    ### What is a program?


    A program is a list of instructions to the computer. Let''s suppose we are going
    to give someone a list of simple instructions in English on how to set the table.
    This list of instructions might look like this:


    - get a plate from the cupboard

    - walk to the table

    - put it on the table

    - return to the cupboard

    - get a glass

    - and so on.


    But a set of instructions for a computer is written using a specific list of words
    that the computer can understand. For example, forward 50 means go forward 50
    turtle paces. This action words for the computer are procedures.


    What''s turtle, you? It''s our little drawing partner on the screen. We pretend
    that it is carrying a pen that it can draw down, and pick up, to move around without
    drawing. It can wear various suits of clothes—it can look like a horse, a dog,
    even a house or a pond. The nice thing about it is that it obeys every command,
    so long as we use words it can understand.


    So, if a program is a list of instructions to the computer and an instruction
    is a list of procedures and MicroWorlds already knows piles of procedures, we
    must be ready to write a program!


    # Instructions and procedures


    We need to begin by locating our turtle. With MicroWorlds EX, we first choose
    “free mode.” When the drawing appears, we have to hatch a turtle by clicking on
    the hatching icon at the top. Then click on the screen, and you have a turtle.


    Now, let''s start with an instruction.


    In the Command Center (the area at the bottom of the screen), type this:


    ```

    pd forward 50

    ```


    Pd is for pen down. We are telling the turtle to put its pen down and move forward
    50 turtle steps. Now we press <enter>.


    The turtle obeyed! It sent 50 turtle steps forward—in the direction it was facing.
    We need to learn a new word, input. This is the number 50 in our case. The input
    is the number that the procedure forward needs to have. (Some procedures also
    have outputs: they give you a number.)


    In the Command Center, type the following line:


    ```

    pd forward 50 90 forward 50 90 forward 50 90 forward 50 90

    ```


    When the cursor is at the very end, press presto! Our first instruction causes
    the turtle to draw a square.


    Let''s analyze one long line of instruction. All the words you see on the line
    are names of procedures:


    - pd: a procedure that puts the current turtle''s pen down and requires no inputs
    and has no outputs

    - forward: a procedure that moves the current turtle in the direction its head
    is pointing by a certain number of steps. The number is a required input.

    - right: a procedure that turns the current turtle to the right by a number of
    degrees. The number is a required input.


    The last two procedures require a number as their input. One very important thing
    to notice is some procedures require inputs and some don''t.


    # Procedure inputs and output


    Logo procedures can be thought of as jigsaw puzzle pieces. Our job as programmers
