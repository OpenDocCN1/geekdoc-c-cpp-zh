    \n```\nto Main\n  talk to turtle 1\n  launch a process that repeats many times\
    \ to go forward a little bit\n  use readchar to collect info from the keyboard,\
    \ and also\n  call direct, passing to it the information collected by readchar\n\
    end\n```\n\nFirst, we will work on the first line of pseudocode. We'll need more\
    \ information on launch. Do you remember the launch procedure from Book 1?\n\n\
    The Help vocabulary tells us about launch:\n\n```\nlaunch word-or-list-to-run\n\
    Runs the input as an independent process. If the process is launched from the\
    \ Command Center, the cursor reappears immediately. Use cancel, the Cancel menu\
    \ item, the Stop All menu item, or Ctrl+Break to stop the process. See also forever.\n\
    ```\n\nExample:\n\n```\nlaunch [glide 1000 1 rt 90 lt 90]\n```\n\nType the next\
    \ instructions while the turtle is gliding.\n\nLook at the very top of the entry:\
    \ launch word-or-list-to-run. What this means is that we need a word or a list\
    \ as input for launch. (Remember, a word starts with \", and a list is enclosed\
    \ in [brackets]). Launch starts a process we need to stop separately. I find it\
    \ works best to launch something also using the repeat command, along with forward.\n\
    \nNow we need a line of code that does all of these things:\n\n- launches a process\
    \ that repeats many times to go forward a little bit\n- uses readchar to collect\
    \ info from the keyboard\n- calls direct, passing it to the information collected\
    \ by readchar.\n\nCan you think of one? Work on it before you turn the page.\n\
    \n![](img/242aaa06c3a3208f16d97cdd92303648_123_0.png)\n\nCrystal's Maze. The bee\
    \ tries to get to the moon!\n\nHere is mine:\n\n```\nlaunch [repeat 2000 [forward\
    \ 3 direct readchar ] ]\n```\n\nDo you see how it works? Let's look at it from\
    \ right to left. **Readchar** is taking one character of input from the keyboard.\
    \ **Direct** is the procedure we make which needs one input (the keyboard character)\
    \ and uses it to set the turtle's heading. Now we have a little list of commands:\
    \ go forward 3, then change the turtle's heading using **direct** and the keyboard\
    \ input. We will repeat this little set of commands 2000 times, and we'll launch\
    \ the whole process. This means that it will operate independently of other processes\
    \ we might also launch.\n\nHere's our version of **Main**. I have underlined the\
    \ new code.\n\n# to Main\n\n- talk to turtle 1\n- launch a process that repeats\
    \ many times to go forward a little bit\n- use readchar to collect info from the\
    \ keyboard\n- call direct, passing to it the information collected by readchar.\n\
    - launch [repeat 2000 [forward 3 direct readchar ] ]\n\nNow, add a line of code\
    \ to match the pseudocode for talking to turtle 1.\n"
  mdcn: "\n\n# 必备知识沙盒\n\n我们希望通过按下方向键来移动和转向乌龟。我们需要很多新信息来弄清楚如何实现这一点。首先，我们将如何从键盘收集信息呢？\n\
    \nReadchar 是一个内置过程，用于“读取”来自键盘的输入。让我们检查一下它是否有效。在命令中心（Command Center）中输入\n\n```\n\
    show readchar\n```\n\n然后按 Enter 键。现在将鼠标移动到图形窗口并点击那里。按一个字母键。字母出现在命令中心里了吗？应该会出现的。将光标放在\
    \ `show readchar` 这一行的末尾，再次按 Enter 键重复操作。现在按下其中一个箭头键。哎！在命令中心里，我们没有看到箭头，而是看到了类似这样的的符号！这取决于你使用的是\
    \ Mac 还是 PC。发生什么了？\n\nReadchar 正在读取字符，但它以数字的形式存储这些信息！然后它提取出数字并使用代码来确定它是什么，结果它在箭头键上搞混了！\n\
    \n当你编写代码时，你会为字母表中的每个字母分配一个数字。事实证明，计算机中内置了这样的代码。它是 ASCII 码，全称是美国信息交换标准代码（American\
    \ Standard Code for Information Interchange），一种为每个字符分配数字的代码。问题是，它并不是完全标准的代码。Mac\
    \ 和 PC 用户对某些键（如箭头键）使用不同的数字代码。\n\nLogo 有一个名为 `ascii` 的内置过程。该过程接收来自 `readchar` 的键盘输入并报告其\
    \ ASCII 码。\n\n让我们测试这个过程。在命令中心中输入\n\n```\nshow ascii L\n```\n\n我们在要求计算机在命令中心输入大写\
    \ L 的 ASCII 码。我们得到了这个响应：76。这就是大写 L 的 ASCII 码。\n\n现在，你能告诉我 T 的 ASCII 码吗？数字 8 呢？字母\
    \ H 呢？h 呢？\n\n我们最感兴趣的是箭头键的代码。我们无法在命令中心里输入箭头。你能想出如何让计算机在命令中心显示箭头键的 ASCII 码吗？提示：使用\
    \ `ascii` 和 `readchar`。思考一下，然后翻页。\n\n![](img/242aaa06c3a3208f16d97cdd92303648_117_0.png)\n\
    \n![](img/242aaa06c3a3208f16d97cdd92303648_119_0.png)\n\n# 海娜的迷宫\n\n![](img/242aaa06c3a3208f16d97cdd92303648_119_1.png)\n\
    \n# 罗伯特的迷宫\n\n我们需要的是使用 `ascii` 过程查看由 `readchar` 传递的键盘输入。\n\n让我们尝试一下：\n\n```\n\
    show ascii readchar\n```\n\n然后按 **Enter**，将光标移动到图形窗口并点击，然后按下任意键。你得到了什么数字？再试一次按下任意键。你得到了什么数字？\n\
    \n我们感兴趣的是一组非常有限的 ASCII 数字：那些代表我们键盘上箭头的数字。这些数字在 Macintosh 和 PC 上是不同的。因此，我们将建立一套适用于\
    \ Mac 或 PC 键盘的代码系统。归结底，这如下：28 和 37 可以向左，29 和 39 可以向右，30 和 38 可以向上，31 和 40 可以向下。\n\
    \n# 指导乌龟头部\n\n首先，我们将编写一个过程来指导乌龟头部朝向哪个方向。我们将该过程命名为 **direct**。\n\n在 **Main** 中，**readchar**\
    \ 将获取键盘输入。然后 **Main** 将把键盘信息传递给 **direct**。它将如何做到这一点？你记得如何在程序中传递信息吗？\n\n变量可以很好地胜任这项工作——一个存放信息的小鸽笼。**Main**\
    \ 将把 **readchar** 信息放入变量中，而 **direct** 将将其提取出来、评估并使用。让我们把变量命名为 **key**。\n\n![](img/242aaa06c3a3208f16d97cdd92303648_120_0.png)\n\
    \n**Main** 使用 **readchar** 读取“28”作为按键的代码。然后 **Main** 调用 **direct** 并向它发送该值，将其存储在变量中。\n\
    \n现在，我们的流程图看起来是：\n\n我们将在过程的第一行命名该变量，如下：\n\n```\nto direct :key\n```\n\n当我们在 **Main**\
    \ 中调用 direct 时，我们通常会向它传递一个数字，如下：\n\n```\nto Main\n  direct 30\n...\nend\n```\n\
    \n但这次，我们将使用 readchar 代替数字 30。这样，无论键盘输入是什么，都会进入变量，如下：\n\n```\nto Main\n  direct\
    \ readchar\n...\nend\n```\n\n在 **Main** 中，我们将使用 `readchar` 读取键盘输入，然后将其传递给过程 direct。在\
