    # How about this?


    If (it is raining) and (I have to go out)[take the umbrella].


    Now the and is linking two Boolean statements. If both Boolean statements are
    true, then the compound statement is true, and we take the action following. Sounds
    kind of obvious, doesn''t it?

    What if I replaced and with or? Then one of the Boolean statements, or conditions,
    needs to be true for the compound statement to evaluate to true, so we take the
    following action.


    If (it is raining) or (I have to go out)[take the umbrella].


    We can see that or or isn''t the right operator to use here. It doesn''t make
    sense. But we could use or in a different sentence.

    If (it is raining) or (the weatherman says it will rain)[take the umbrella].


    Here if either of these conditions is true, the compound statement is true, and
    so we take the following action. That is the nature of the or: only one of the
    conditions has to be true.

    Let''s go over that again. This compound statement true or false?


    (it is raining) and (I have to go out)


    It''s true if both of the conditions in parentheses are true, and otherwise it
    is false.

    Using or,


    (it is raining) or (I have to go out)


    the linked statement is true if one of the conditions in parentheses is true.

    Why are we so interested in whether it evaluates to true or false? Because when
    we use when if, in Logo, we have to have a condition that evaluates to true or
    false. Specifically, we want a condition that looks like this:


    If (answer = "d or answer = "o or answer = "g]) [add to the counter]


    Oops! In this case, if one of small statements is true, we add one to the counter.
    That''s not what we want at all! We want to add one to the counter if the answer
    is not D, o, or g! What do we do?

    There''s another logical operator called not. It simply changes a condition''s
    true evaluation to false, and vice versa. So what we really want is this:


    If not (answer = "d or answer = "o or answer = "g]) [add to the counter]


    You might think this is pretty strange. It''s like speaking English, kind of.
