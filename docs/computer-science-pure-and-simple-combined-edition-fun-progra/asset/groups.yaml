    点击 Start（开始）按钮运行你的程序。小狗会在屏幕上行走（实际上是在跑，但我们称之为行走）。点击 jump（跳跃）按钮。你会收到“我不知道如何跳跃”的错误消息，因为不再有
    jump 过程了。我们将其重命名为 doJump。


    ## Processes（过程）


    还有一点需要注意。尽管你收到了错误消息，小狗仍在继续行走！当我们点击按钮时收到错误消息，是因为我们调用了不再存在的 jump 过程。你不觉得小狗一直在走这有点奇怪吗？我们遇到了错误，但程序仍在运行！让我们来做个小实验。我把我们刚刚创建的程序称为版本
    1。


    让我们在 Main 中也设置同样的错误，调用 jump，看看会发生什么。停止你的小狗，然后编辑 Main，将 jump 的调用放回去，如下所示：


    ```

    repeat 200

    [Walk 10 10

    Jump 30]

    ```


    我们将该程序称为版本 2。现在，小狗行走 10 步后，程序将调用不存在的 jump。在你的 Graphics（图形）页面上点击 Start。果然，这次在收到错误消息时，小狗停止了。


    这里发生了什么？


    解释是 Logo 语言拥有“过程（processes）”。每个过程都是相互独立的。一个过程几乎就像它自己的一个小程序。当我们点击按钮时，我们就启动了一个过程。如果我们有多个乌龟在屏幕上移动，每只乌龟都会在自己的过程中运行。在程序的版本
    1 中，点击 Start 按钮启动了一个没有错误且运行良好的过程。点击 jump 按钮启动另一个带有错误的过程，它不会运行，但不会影响第一个过程。


    在版本 2 中，我们在由 Start 按钮启动的过程中也放置了一个错误，果真，错误停止了该过程！


    这只是为了让你对过程有一个简短的了解。让我们回到版本 1。从 Main 中删掉对 jump 的调用。


    ## Jump has a bug!（Jump 有 Bug！）


    我们需要一个新的过程 jump，它将在点击按钮时被调用。请将此过程添加到你的 Procedures（过程）页面中：


    ```

    to jump

    dojoump 20

    end

    ```


    这为我们提供了向 doJump 传递数字的方法。现在尝试你的程序。嗯，这很有趣。你可以让小狗走过去，然后通过点击 jump 让它小跳一下，然后继续。这样一来，我们就可以在按钮上获得我们想要的标签，并将程序保持在
    Procedures 页面中以便我们查看。


    你注意到什么奇怪的现象了吗？你有没有注意到在点击 jump 后，小狗的高度越跳越高？它在跳跃后似乎并没有完全落回到原位。


    好了，伙计们，我们的程序里有一个 Bug。一切都不对，我们需要对程序进行调试（debug）。也就是说，我们需要找到错误所在之处。调试程序的第一步是找出是什么导致了问题。当乌龟行走时，它并没有移动更高。


    尝试停止行走（再次点击 Start 按钮）并点击 jump 按钮。当分开运行时，jump 看起来运行正常，walk 也看起来运行正常。但当两个过程同时运行时，我们的程序中似乎出现了一个
    Bug！


    所以，它只在两个过程同时运行时发生。我想看到被小狗形状遮挡的乌龟的移动情况。在 Main 中，在 setsh 行前面加一个分号，如下：


    ```

    ; setsh [dog1 dog2]

    ```


    计算机看到带有分号的行会将其视为注释，而不是程序的一部分。这就像分号右侧的所有文字对 Logo 是不可见的，但对人类可见。我们刚刚让这一行对 Logo 变得不可见（我们“注释掉了这一行”）。程序员经常这样做。


    让我们把小狗变回乌龟。在 Command Center（命令行中心）中输入命令：setsh 0。现在运行程序。看到这个光秃秃的乌龟，让我对 forward
    发生的情况产生了怀疑。有时乌龟指向左边，有时指向右边。


    让我们仔细观察我们的两个过程，并尝试找出当两个过程同时运行时发生了什么不同之处。


    你可以看到 walk 和 doJump 都告诉乌龟向前移动。forward 仅仅意味着“朝你头部指向的方向移动”。所以，如果 doJump 过程正在运行，头部就指向向上（setsh
    0）。因此在 doJump 过程运行期间，walk 过程实际上在向前移动，并增加了跳跃的高度！这就是为什么乌龟每次都会稍微高一点，*我想*是这样！我们需要测试这个理论。


    查看 doJump 中的代码，我们看到从 seth 0 行到 seth 270 行，乌龟的头部一直指向向上。如果乌龟向上的时间增加，爬升的高度是否会减少？换句话说，假设乌龟头部向上的时间增加了，爬升高度减少了。那么就能证实我们的怀疑：问题出在
    walk forward，而此时 doJump 让乌龟的头部指向向上。这就像乌龟有两个老板一样。


    ## Using ycor（使用 ycor）


    在索引的最底部是 **xcor** 和 **ycor**。**Y** 看起来是一个非常有可能的候选者，让我们查查它。


    前往 Help（帮助），然后点击 Vocabulary（词汇）


    img/242aaa06c33208f1697cdd923648_69_0


    在页面左侧，你可以看到一个帮助我们查找感兴趣单词的字母表。选择 y。


    img/242aaa06c33208f1697cdd923648_69_1


    - 报告乌龟的 y 坐标。

    - 定页面上有一只乌龟。

    - 参见 pos、sety 和 m


    这告诉我们有一个内置过程 **ycor**，它的输出是乌龟的 y 坐标（屏幕上的高度）。另一个过程 **sety** 接受一个数字作为输入并设置 y 坐标。


    这能如何帮助我们？


    img/242aaa06c33208f1697cdd923648_69_2


    在这个小图中，我们的点有一个地址。它的“x 坐标”水平位置是 300。它的“y 坐标”（屏幕上的高度）是 200。这些数字告诉我们在屏幕上的具体位置，就像街道地址一样。


    假设 x=300, y=200 是乌龟的地址。如果我们在屏幕上向上移动一下乌龟呢？


    img/242aaa06c332008f1697cdd923648_70_0


    我们向上移动了乌龟 50 个单位。所以它的 y 坐标从 200 变为了 250。它的 x 坐标保持不变。


    这就是我们想要做的！通过告诉乌龟从一个位置到另一个位置来让它跳跃。第二个位置的 y 坐标高出 50 步。


    但是，我们如何让乌龟再次回到原来的位置呢？


    '
