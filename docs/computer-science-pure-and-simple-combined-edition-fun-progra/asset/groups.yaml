    \nto Start\nMain\nend\n\nto walk :stepsize :qsteps\nrepeat :qsteps\n  [forward\
    \ :stepsize]\n  wait 1\nend\n```\n\n# 成为幻术大师\n\n编程有时涉及创造幻觉。你通常想让一个生物行走或跳跃。实际上，你所做的只是移动乌龟、改变形状、移动乌龟、改变形状。但对用户来说，它创造了一种幻觉。\n\
    \n（OCR 文本在后几页似乎有重复/乱码部分。我将根据提供的原始文本流重新处理。）\n\n编程有时涉及创造幻觉。你通常想让一个生物行走或跳跃。实际上，你所做的只是移动乌龟、改变形状、移动乌龟、改变形状。但对用户来说，它创造了一种幻觉。\n"
