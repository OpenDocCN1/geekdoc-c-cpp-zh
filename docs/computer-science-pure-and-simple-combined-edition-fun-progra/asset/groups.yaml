    # #27 Hangman I: Going Loopy


    We are going to learn how to make loops. A loop repeats the same set of steps
    over and over, until an ending condition is met. Loops are common to all computer
    languages, and it''s time we learned about them! We''ll need to know about loops
    for this game, Hangman. This is a game that


    +   - asks for a letter, and

    - evaluates it to see if it is one of the letters we had chosen.


    Then it does those again and again, until the user has guessed six wrong answers.
    That''s a loop, or!


    Here is a flow chart of a simple loop:


    ![](img/242aaa06c3a3208f16d97cdd92303648_152_0.png)


    Follow the steps that follow each other down the page. Then comes the decision
    diamond. If we are done, we go on. If we are not done, we go back to Step 1.


    We''ve actually used loops before: **repeat** is a simple loop, for example. We
    could say

    **repeat 6 [lots of steps]**


    That would be a loop that repeats six times. We could use **repeat** and end the
    Hangman loop when the user has guessed six times. But when we don''t—need to end
    the loop when the user guessed six wrong answers. We have more to learn.


    Our loop needs to count only the wrong guesses, stopping the loop at six. We will
    need what is called a **counter** in our loop. A counter is another universal
    element in computer languages. We create a variable called **counter** and set
    its value to 0. We go through the series of steps, and at the end of the series
    we add 1 to what''s in the variable **counter**. We go through the series of steps
    again. When the counter equals six, we stop. This is called **increment loop**.
    (Incrementing is going step-by-step.) There are various ways to set one up in
    Logo.'
