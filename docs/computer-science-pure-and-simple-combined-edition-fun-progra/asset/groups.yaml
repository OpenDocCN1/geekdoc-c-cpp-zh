    # Introduction


    Computers are all around us, and the workplace clearly requires them. Many of
    the good jobs that will be open for our kids when they grow up will involve programming.
    And so homeschoolers really need to be learning computer science. They''ll be
    learning logic at the same time, sharpening their reasoning skills.


    The earlier kids start a complex subject, the better. But many home-schooling
    parents think they are not qualified to teach computers. In the meantime, their
    kids may be falling behind in acquiring a skill that they will surely need.


    If you need some help teaching computer programming to your teens, this book is
    for you. CAN give you the early training in computers that will make them comfortable
    directing this medium all their lives.


    Computer Science Pure and Simple contains plenty of work with variables, and is
    so suited to students who are at least 12 years old. A variable is an abstract
    concept that younger children are not ready. Younger children can take advantage
    of Logo Adventures, a MotherboardBooks.com curriculum teaching Logo programming
    and reasoning skills (with a strong flavor) to elementary-aged kids as young as
    8, without the use of variables.


    Computer Science Pure and Simple grew out of the efforts of a homeschool co-op
    in St. Louis, Missouri. It represents a transcription of our efforts to teach
    computer novices.


    If you don''t have the MicroWorlds EX software, now out and get it www.MicroWorlds.com
    . A free download is available. Those who purchase of book to the MicroWorlds
    people should receive a coupon code for 70 percent discount off retail price.
    contact info@MicroWorlds.com and info@MotherboardBooks.com .


    # Pacing, testing


    The suggested pacing for this material is one lesson per week, allowing time for
    exercises and practice before moving on. We figure the amount of time spent is
    3 hours per week, one lesson per week. Thirty-four lessons will provide 102 hours
    of instruction, which is one high school credit in our state.


    For the homeschool teacher, computer expertise is not required. But a little experience
    with computers is needed, as ability to open and save a document.


    Test your student by comparing the student''s project to the project requirements.
    If the meets all requirements, it gets 100 percent, and so on.


    # Remove the answer key before you start!


    Be sure you cut out the answer key before you start. Don''t let your student have
    control over it. We suggest that you let your student solve puzzle over a problem
    for a while before handing out some hints and finally if necessary letting him
    for suggestions in the text and at the troubleshootingguide in the Appendix. You
    also email info@MotherboardBooks.com if you are stuck.'
