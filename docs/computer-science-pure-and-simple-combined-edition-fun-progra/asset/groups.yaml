    Tells MicroWorlds to wait until true-or-false-list-to-run is true before running
    another instruction. The input must be an instruction list that reports either
    true or false when it run.


    The input for waituntil is a list, so it is in brackets. The input must be something
    that evaluates to true or false. All this means that our code needs to:


    ```

