    into a procedure that receives one input. We do simply by thinking of a good name
    for the storage spot for the input—how about length?—and putting it on the line
    that declares the procedure. We will use what''s in length, written :length. Make
    the following change to square:


    ```

    to square :length

    repeat 4 [forward 50 right 90 wait 1]

    end

    ```


    Again, using our mailbox diagram, we can see our variable.


    ![](img/242aaa06c3a3208f16d97cdd92303648_99_0.png)


