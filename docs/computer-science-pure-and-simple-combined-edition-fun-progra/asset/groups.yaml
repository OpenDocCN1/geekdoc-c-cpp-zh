    ## #32 City II


    We are moving forward with the version of Main from the last lesson in which Main
    calls itself to create a loop. In order to finish our program, we need to flesh
    out the two procedures house and animate. In this lesson we will work on house.


    Here is our requirement: add a variable to house, and change the line in Main
    that calls house to add a variable input.


    We need to resize-house. Let''s get our memories again on what we learned about
    variables. Remember that a variable for a computer is a storage spot, like one
    of cubbyholes or mailboxes set in the computer''s RAM, or temporary memory. We
    have created a variable size in our house procedure. We are going to take the
    user''s input, big or small. If it''s big, we will send the number 1 over from
    Main as the input to house to be stored in size. If it''s small, we''ll send over
    the number 0.5. Here''s what the sending looks like:


    ![](img/242aaa06c3a3208f16d97cdd92303648_181_0.png)


    In house, :size stores the length.


    So, inside of our house procedure, what do we do with what''s in this variable
    size? We are going to multiply all the lengths in the house drawing by it. So
    if size contains 1, we get a house 50 turtle steps wide. If it contains 0.5, we
    get one that is 25 turtle steps wide.


    In your house procedure, find all the places the turtle goes forward, say forward
    50. Change that to forward 50 * size. Remember that * is for multiplication, and
    :size means "in size". Use copy and paste to drop the "* :size" into the right
    places. Don''t change the angle inputs, though, where the turtle is turning right
    or left. Don''t change the headings. Now, test your program. Does it resize the
    house if you ask for a small house?


    Oops! We''ll need to resize the windows! We need to draw big or small windows,
    depending on whether the user chooses big or small.


    For starters, do the same thing, and create an input for size1 and size2; in other
    words, from Main we will call these procedures using size1 or size2. Make your
    changes to the code for size1 and size2—add a variable to the first line of the
    procedure, such as size1 and size2. Inside the procedures, multiply every call
    to forward by what''s in size1 or what''s in size2, such as:


    forward 10 * sizesize.


    Now, take a look at our Main


    ```

    question [I will build a house. Do you want big or small?]

    ifelse (answer = "big") [house 1][house 0.5]

    ```


    The second line means that if the answer is big, call house 1; otherwise, call
    house 0.5. OK, that part works great. Here we have input from the user and use
    it to choose to build a big or small house. Next:


    ```

    question [Do you want 1 or 2?]

    ifelse (answer = 1) [house 1][house 2]

    ```


    Oops, we have a problem! Here, we have input from the user, this time on the number
    of windows. We have now lost the input about big or small—isn''t stored anywhere.
    So if we want to make a change to draw a big or small house, we don''t know which!
    Think about how to solve this problem. You''re an experienced programmer now,
    and you should be able to come with a solution before you turn the page!


    ![](img/242aaa06c3a3208f16d97cdd92303648_182_0.png)


    Lian’s City


    We need to create a variable to store the size indicated by the user long enough
    to use it in the calls to house. (A local variable is one that is not usable in
    another procedure. One usable in all procedures is a global variable. This is
    for good programming, with plenty of room for bugs.) Since programmers generally
    declare all variables at the top of a procedure, insert a first line in Main that
    creates a local variable called hsize. Look up local in the vocabulary before
    you do it.


    Now, where will you use hsize? You need to store the user''s preference in it.
    In the line that says ifelse (answer = "big") [house 1][house 0.5], you will need
    to add hsize in the practice so that if the answer is big, call house with input
    1; otherwise call house with input 0.5.


    Can you translate that pseudocode to Logo? Look up make in the vocabulary to make
    sure you are using it right.


    Also use hsize to:


    - resize the distance in Main that moves the turtle down the street before it
    starts to draw again.


    Get this working by the beginning of the next class.


