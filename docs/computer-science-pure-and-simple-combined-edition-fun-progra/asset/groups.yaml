    # Making a simple program


    The Command Center makes a perfect place to test instructions and procedures.
    But it is not a very user-friendly place from which to launch a program. Also,
    later when we stand-alone programs to run on a Web page, the Command Center doesn''t
    show. So we need to learn to do without it.


    Our Graphics Page is the page where the turtle draws squares for us. We need a
    clickable button right on our Graphics Page. Remember how to get there? In MicroWorlds
    EX, the Graphics Page is


    right in front of us all the time, upper left. To make the button, click the button
    icon and then click on the Graphics Page where you want the button to be. A dialog
    box pops up. Looking at it you can see that we are allowed to type in an instruction
    to run when someone clicks on the button.


    We want to wire this button so it starts our program.'
