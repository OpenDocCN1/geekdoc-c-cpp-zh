  - '[PAGE 57]


    # How do you walk?


    In Main, edit the setsh line so that it looks like this:


    ```

    setsh [dog1 dog2]

    ```


    Install the shapes dog1 and dog2 into your Shape Center. Make sure they are facing
    to the left. To change the way they face, double-click on the shape in the Shape
    Center, and then click on the flip icon


    Let''s actually sit down and think a bit before we start to write our walk procedure.
    I envision the turtle switching back and forth between shapes as it moves along.
    This means that the procedure forward must be called more than once. We would
    call it twice, once for each shape, then repeat that sequence. We should include
    a wait command to slow down the action to where we can see it.


    What about inputs to walk? What should we make as a variable? Well, how about
    making how far to go before changing shapes an input to the procedure?


    Okay, enough thinking, let''s code!


    In the command center, type cg to clear the graphics, so we can start fresh. Then
    type in this procedure in your procedures page.


    ```

    to walk :stepsize

    repeat 2

    [forward :stepsize

    wait 1]

    end

    ```


    and edit Main to look like this:


    ```

    to Main

    cg

    cc

    pu

    talkto "t1"

    setsh [dog1 dog2]

    repeat 200

    [walk 5]

    end

    ```'
