  mdcn: '


    ## #25 比赛 II


    这里是我们的游戏规范：


    - 游戏从一个 Start（开始）按钮开始。它有一条用绘制中心画出的粗终线。

    - 游戏有两个用户和两只乌龟。每当相应的用户正确回答问题时，乌龟就会向右（或向上）移动一段距离。

    - 每个用户有四个简单问题。回答四个正确答案后，乌龟将到达终点。

    - 如果比赛的乌龟越过了终点，之前隐藏的第三只乌龟将会显示，并执行你选择的动画。（这是一个名为 win 的过程。）

    - 当用户按下 Start 时，比赛的乌龟将回到起点。同样，执行动画的乌龟也会回到起始位置。（这是一个名为 setup 的过程。）


    设计游戏时需要记住的一点是，问题将出现在屏幕中间的大型矩形中，如果参赛者也经过屏幕的那个部分，可能会遮挡参赛者。你可以通过将参赛者移动到屏幕顶部或底部来解决这个问题，或者在问题之间提供较长的等待，以便用户看到参赛者的位置。


    我们的流程图将从 Start、setup 和一个问题块开始，然后是一个答案的判断菱形。如果答案为真，乌龟向前移动。如果为假，我们会宣布“Oops！”并告诉用户正确答案是什么。无论哪种，我们都进入下一个问题。再次完善你这个部分的草图，然后翻页看我的。


    ![](img/242aaa06c3a3208f16d97cdd92303648_146_0.png)


    保罗的比赛：获胜！一个幽鬼出现并向山顶走去。


    ![](img/242aaa06c3a3208f16d97cdd92303648_147_0.png)


    这是第一个问题的良好开始！现在让我们像它一样添加问题 2。


    ![](img/242aaa06c3a3208f16d97cdd92303648_147_1.png)


    你的流程图看起来很像这个吗？我希望是。


    现在，我们需要将流程图翻译成 Main 的 Logo 代码。对于问题，我们将使用 `question` 命令。如果需要，可以在帮助词汇表中查找（参见第 22
    页）。


    接下来，我们需要评估 `answer`，用户的答案存储在其中。流程图显示了一个带有问题“答案是正确的吗？”的判断菱形。这会产生两种可能的结果：正确答案和错误答案。你能编写这些代码吗？查找
    `if` 和 `ifelse` 来唤起你的记忆。在勾画出代码之前，不要翻页。


    ![](img/242aaa06c3a3208f16d97cdd92303648_148_0.png)


    保罗的比赛，第二页（获胜后）。死灵军出现了！


    如果用户给出正确答案，我们可以写：


    ```logo

    if (answer = "Mount Vernon") [talkto t1 forward 170]

    ```


    注意两个单词答案周围的垂直线和在答案前的引号。如果答案只有一个单词，你只需要在单词前加一个引号，如下所示：


    ```logo

    if (answer = "Vernon") [talkto t1 forward 170]

    ```


    让我们处理一下另一种情况，即答案不等于 Mount Vernon。你能弄出写什么吗？


    ```logo

    ifelse (answer = "Mount Vernon") [talkto t1 forward 130] [announce Oops! The right
    answer was Mount Vernon.]

    ```


    对于问题，从你已经创建的问题列表中复制并粘贴。在问题中也要指称正确的用户，如下所示：


    `question Player 1, What is the name of George Washington''s home?`


    我们还需要确保参赛者在回答正确答案时，能够穿过整个屏幕到达终点。有两种方法可以实现：


    1. 更难的方法：使用 `show pos` 检查起点和终点的坐标。要做到这一点，将 t1 置于起点，进入命令中心，输入 `talkto t1 show pos`，将
    t1 移动到终点并在命令中心输入 `show pos`。记下坐标。第一个数字是 X 坐标，第二个数字是 Y 坐标。对于水平比赛，你需要相减 X 坐标（X 测量跨屏幕的水平距离，Y
    测量垂直距离）。例如，你的起点坐标可能是 `[-332 -129]`，终点坐标可能是 `[342 -135]`。只看第一个数字，你的乌龟必须向右走 332
    步到达不可见的零参考线，然后再走 342 步到达终点。移动的距离是 332 加 346，即 678 步。我们通过提问到达那里，所以我们将 678 除以 4  169
    和一个余数，我们将向上取入为 170。简之，每当我们正确回答一个问题时，我们需要移动 170 步。

    2. 如果你不[使用更难的方法]，[你可以使用更简单的方法]。（注：这里的 OCR 文本似乎是乱码。）


    '
