    the value to the square procedure when we call it. In other words, when we use
    the square procedure, we need to place an input next to it that it will go into
    the mailbox. The code in Main needs to say, for example, square 30


    instead of just square.


    When the computer gets to square 30, right at that point, a 30 goes into the mailbox
    named length and waits to be used by the procedure square.


