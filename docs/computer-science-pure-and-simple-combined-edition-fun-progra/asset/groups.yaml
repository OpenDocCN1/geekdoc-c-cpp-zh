    ## #23 迷宫 IV 作业


    我们将进一步增强 Mymaze。现在它将具有三个难度级别，涉及蜘蛛的速度。我们需要为每个难度级别创建一个复制页面，还需要一个作为起始点的索引页。我们在索引页上将放置按钮，跳转到简单、中等和困难页面。在这些页面上，我们需要返回索引页的按钮。我们将索引页命名为
    Page1，因为在 MicroWorlds 中，当有人开始游戏时，任何项目都会从 Page 1 开始。我们希望游戏从索引页开始，所以将其命名为 Page1。


    ![](img/242aaa06c3a3208f16d97cdd92303648_142_0.png)


    ### 开始工作


    为了完成任务，我们将在项目中使用多个页面。我们需要弄清楚如何创建新页面。注意屏幕顶部有一个“Pages”（页面）菜单。点击它时，你会看到创建新页面和重命名页面的选项。我们需要这两项操作。


    将你的迷宫以另一个名称保存作为备份，以防你弄错。现在，在 Mymaze 文件中创建三个复制页面。要此此，进入 Pages 菜单，并点击 duplicate
    page（复制页面）。这会创建一个与旧页面相同的新页面，只不过这个页面名为 Page2。再次点击两次 duplicate。现在你有了 Page1、Page2、Page3
    和 Page4，它们都是完全相同的。


    但这些名称并没有描述性。使用 Pages 菜单，转到 Page2。然后在 Pages 菜单下选择 name（重命名），并将页面命名为 easypage。进入
    Page3 并命名为 mediumpage，进入 Page4 并将其命名为 hardpage。


    现在你拥有了名为 Page1、easypage、mediumpage 和 hardpage 的页面。这些不仅仅是名称，它们还是命令！如果你进入 Command
    Center（命令中心）并输入其中一个名称，该页面就会出现。因此，我们可以将名称作为命令放入代码中。我们希望通过索引页（即 Page1）上的按钮来调用这些页面。


    实现此目标有两种方法。我们可以将按钮命名为与页面相同。当我们按下按钮时，页面就会弹出。我们也可以间接实现：每个按钮可以调用我们编写的程序（procedure）。该程序可以调用页面名称，还可以针对该页面调用一个
    Main 的版本。我们就采用这种方法。


    使用 Page 菜单，进入 Page1 并在 Command Center 中输入 `eg` 来清除图形。使用剪刀工具移除乌龟（turtles）和开始按钮（go
    button）。使用左侧的创建工具创建三个按钮，分别命名为 easy、medium 和 hard。在页面上拖动它们以创建一个美观的布局。也装饰一下页面。


    现在我们需要为这些按钮创建对应的程序。在 Procedures 页面上，创建一个名为 easy 的程序。它告诉电脑当按下名为 easy 的按钮时该做什么。


    - easy

    easypage

    Maineasy

    end


    注意，现在按下 easy 按钮将调用一个 Main 的版本，所以我们不需要任何 go 按钮（以前是执行该功能的）。你可以使用剪刀图标从所有页面中删掉它们。


    那么，Maineasy 是什么？它是针对简单页面的 Main 版本。你需要创建它。高亮所有的 Main 程序，按 control-c 将其复制到隐藏剪贴板。滚动到
    Procedures 页的另一个部分（记住，程序应该按字母顺序排列，Main 除外，所以这里应该在顶部！）。按 control-v 粘贴。将旧的名称改为 Mineasy。再粘贴一份。将新的
    Main 命名为 Mainmedium 和 Mainhard。稍后我们将进行修改使它们互不相同。


    我们还需要：：一种从每个游戏页面返回 Page1 的方法。在每个游戏页面上，创建一个名为 index 的按钮。为了配合它，你需要使用以下伪代码为 index
    创建一个程序：


    - to index

    ;go to Page1

    end


    用真实的代码替换伪代码。进行测试。如果需要，请进行调整。


    目前，你的游戏有三个不同的迷宫页面，名称不同但其他方面完全相同。我们需要在 Mineasy、Mainmedium 和 Mainhard 中更改每个页面蜘蛛的速度。蜘蛛是
    t3 和 t4。在 Mineasy 中，t3 和 t4 的速度应该相同。在 Mainmedium 中，t3 和 t4 的移动速度应该更快。在 Mainhard
    中，它们应该移动得更快。你可以通过缩短等待时间来加快速度。记住，t1 每次按下箭头键都会移动三步。在你的简单页面上，蜘蛛可以移动三步并等待两秒。在中等页面上，它们可以移动三步并等待两秒。在困难页面上，它们可以移动四步并等待。你也可以修改这三个页面上迷宫的绘制方式。


    现在，测试你的蜘蛛速度。简单页面应该是简单的，中等页面应该是中等难度，困难页面应该是困难但并非不可能。你不希望因为游戏太难而失去用户！因此调整速度，直到它们与页面名称匹配。你也可以使用带有减号的放大镜来缩小蜘蛛。


    ### 练习


    - 1. 添加传送门（teleporter booths）。方法如下：在迷宫中放置一个另一种颜色的框。当 t1 碰到该颜色时，它会跳转到另一个地方。

    - 2. 添加动画。

    - 3. 额外积分：创建一个幽灵。


    ## 准备


    现在你可以安全地查看 Google 图片了，返回 Google 页面并点击空白行上面的“images”（图像）。在图像搜索中，输入“free”（免费）以及你想查找的关键词。如果我们寻找亚利利州的沙漠，你可以输入“free
    desert arizona”看看结果。一旦找到喜欢的图片，且所有明确表示你可以在网上免费使用（而不仅仅桌面），进入文件菜单并下载到电脑。将其保存为 .gif
    或 .bmp 格式。然后打开你的 MicroWorlds 文件，进入 File 菜单，点击 import（导入）。找到你项目的图片。如果图片大小不对，你需要使用
    Microsoft Paint 等照片编辑软件进行缩放。如果这听起来太麻烦，可以使用绘制工具画一个背景。我们班的一位学生“画”了南极，那里大部分是白色，有一些冰块。他的参赛者是企鹅。发挥你的想象力！


    接下来，使用绘制中心和乌龟形状创建两只乌龟。给它们简单的名称。它们可以看起来像赛车、兔子或任何匹配你背景的东西。使用对比鲜明的颜色制作。


    现在，在文字处理器中编写八个简单的问题。答案应为一个两个单词，关于图片所在地。检查拼写并保存。你把它们复制并粘贴到代码中。


    最后，考虑你如何解决这个问题。制作一个流程图草图，显示你认为需要的步骤。使用方框表示问题，使用决策菱形表示处理方式。指示该问题问答对每个用户重复四次。展示给你的老师看。


    '
