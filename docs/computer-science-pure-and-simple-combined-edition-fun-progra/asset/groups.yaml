    但让我们创建一个文本框并在其中打印我们的输出。这样我们就可以可以在不使用命令中心的情况下使用我们的游戏。如果我们把游戏发布到网上，就需要它。要创建一个文本框，点击带有
    ABC 或单个 A 的图标。然后点击屏幕并调整文本框的大小，使其至少占屏幕的一半大。你可以点击文本框（然后在 MicroWorlds EX 中点击 edit）并告诉它不要显示框的名称。


    要把内容打印到文本框中，我们使用 `print` 命令，而不是用于打印到命令中心的 `show` 命令。


    现在我们需要在“帮助词汇表”（Help vocabulary）中检查 `print`。方法如下：


    在 MicroWorlds 2.0 中，点击 Help，然后点击 Vocabulary。会弹出一个网页。在右上角，你可以选择 Basic（基础）或 Advanced（高级）。我们需要
    Advanced，所以选择它。现在选择 Vocabulary 标签页。你的 Internet Explorer 可能会阻止此页面，因为它包含 ActiveX
    编程，但它是你计算机本地的，所以点击弹出拦截器栏并允许内容。现在你已进入 Vocabulary 标签页，可以从左侧菜单选择主题来找到你需要的单词，或者可以点击字母表中显示的第一个字母。我们可以点击
    P 并找到 `print`。MicroWorlds EX 和 2.0 告诉我们类似这样的信息：


    ```

    print word-or-list

    ```


    在当前文本框中打印一个单词或列表。文本后紧跟一个回车和换行符序列。参见“插入”（insert）部分。


    示例：


    假设页面上有一个包含某些文本的文本框：


    ```

    print [The End]

    ```


    建议的格式是 `print word-or-list`。单词在正前方有一个双引号 `"`。列表被包含在 `[方括号]` 中。因此，我们的输入需要其中之一，即双引号或方括号。在命令中心尝试这些：


    - `print "hello"`

    - `print [hello]`

    - `print [[hello][Mom]]`


    你能让它打印出 "Hello out there!" 吗？在翻页之前试一下。


    我们的“Hello out there!”看起来像这样：


    ```

    print [Hello out there!]

    ```


    我们如何让它打印出变量中的内容呢？在过程页面上，让我们尝试这个：


    ```

