    and the built-in procedures that come with MicroWorlds, have a specified number
    of inputs. It can be zero inputs (such as **pd**) or one input (such as **forward**)
    or more. A procedure can also have zero outputs (such as **forward**) or one output
    (such as **sum**).


    A procedure that has no inputs is simply a jigsaw puzzle piece. One that needs
    input has a hole on the right. The output puzzle piece next to it has a tab sticking
    out on the left. So they fit together. When we use procedures in an instruction
