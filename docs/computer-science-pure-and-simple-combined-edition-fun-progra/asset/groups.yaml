    jigsaw puzzle.


    Here is a procedure with one input:


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_0.png)


    As you can see, **forward** has a hole that needs a number input.


    Procedures that expect one number as their input will have the right size opening
