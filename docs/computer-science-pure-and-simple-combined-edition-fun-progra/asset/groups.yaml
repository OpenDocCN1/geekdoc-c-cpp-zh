    ## #32 城市 II


    我们将继续使用上节课中的 `Main` 版本，即 `Main` 通过调用自己来创建一个循环。为了完成我们的程序，我们需要完善 `house` 和 `animate`
    这两个过程。在本节中，我们将处理 `house`。


    以下是我们的要求：在 `house` 中添加一个变量，并修改 `Main` 中调用 `house` 的那行代码，添加一个变量输入。


    我们需要调整房屋的大小。让我们回顾一下学过的关于变量的知识。记住，对于计算机来说，变量就是一个存储位置，就像计算机 RAM（随机存储器）或临时内存中的一个储格或邮箱。我们在
    `house` 过程中创建了一个名为 `size` 的变量。我们将获取用户的输入，无论大小。如果是大的，我们将从 `Main` 发送数字 `1` 作为 `house`
    的输入并存储在 `size` 中；如果是小的，我们将发送数字 `0.5`。发送方式如下：


    ![](img/242aaa06c3a3208f16d97cdd92303648_181_0.png)


    在 `house` 中，`:size` 存储长度。


    那么，在我们的 `house` 过程内部，对变量 `size` 中的内容做什么呢？我们将房屋绘制中的所有长度乘以它。所以，如果 `size` 包含 `1`，我们就得到一个宽度为
    50 个乌龟步的房子；如果它包含 `0.5`，我们就得到一个宽度为 25 个乌龟步的房子。


    在你的 `house` 过程中，找到所有让乌龟前进的地方，例如 `forward 50`。将其更改为 `forward 50 * size`。记住 `*`
    是乘法符号，而 `:size` 意味着“在 size 中”。使用复制和粘贴将 `* :size` 放到正确的位置。不过，不要改变乌龟向右或左转的角度输入。不要改变朝向（headings）。现在，测试你的程序。当你要求画一个小房子时，它会调整房屋的大小吗？


    噢！我们需要调整窗户的大小！我们需要根据用户选择大还是小，来绘制大窗或小窗。


    首先，做同样的事情，为 `size1` 和 `size2` 创建输入；换句话说，我们将从 `Main` 中使用 `size1` 或 `size2` 调用这些过程。对
    `size1` 和 `size2` 的代码进行修改——在过程的第一行添加一个变量，例如 `size1` 和 `size2`。在过程内部，将每次对 `forward`
    的调用乘以 `size1` 或 `size2` 中的内容，例如：


    `forward 10 * sizesize`。


    现在，看看我们的 `Main`：


    ```

    question [我将建造一个房子。你想要大的还是小小的?]

    ifelse (answer = "big") [house 1][house 0.5]

    ```


    第二行意味着如果答案是 big，则调用 `house 1`；否则，调用 `house 0.5`。好的，那部分运行得很好。在这里我们获得了用户的输入，并用它来选择建造大房子还是小房子。接下来：


    ```

    question [你想要 1 还是 2?]

    ifelse (answer = 1) [house 1][house 2]

    ```


    噢，我们遇到了问题！在这里，我们获得了用户的输入，这次是关于窗户数量。我们现在丢失了关于大或小的输入——它没有被存储在任何地方。所以，如果我们想修改以绘制大房子或小房子，我们就不知道该画哪一个了！思考一下如何解决这个问题。你现在是一个丰富的程序员了，你应该应该在翻页之前想出一个解决方案！


