    首先需要画出你的蜘蛛，双击形状中心（Shape Center）中的一个空位之一，然后使用绘图工具制作并命名你的蜘蛛形状。或者使用太阳或其他现成的形状。“Hatch（孵化）”另外两只乌龟（t3
    和 t4）。进入形状中心，点击该形状，然后点击乌龟。这会给乌龟穿上新的“衣服”，使其看起来像那个形状。通过指针拖动它们来移动乌龟。将它们放在迷宫中可能出现的地点。


    你将为每个乌龟编写独立的代码段：t1、t3 和 t4（t2 是你的目标城堡，不会移动）。这里有一些伪代码作为示例：


    ```

    :talk to t1

    :launch a movement for t1

    :end that movement under a certain condition.

    ```


    对于动作的结束，我们首先使用了 `waituntil`。但当我们与多个已启动各种不同动作的乌龟交谈时，`waituntil` 的效果并不好。有一个类似的内置过程我们可以使用。那就是
    `when`。


    为了唤醒记忆，请在 Help 词汇表中查找：


    when true-or-false-instruction-list instruction-list

    启动一个并行进程，反复测试第一个指令列表报告为真（true）还是假（false）。如果报告为真，则运行第二个指令列表。要停止一个 when ，请对 true-or-false-instruction-list
    使用 `cancel`、Cancel 菜单项、Stop All 菜单项，或按下 Ctrl+Break。


    示例：

    when (ycor > 50)[bk 20]


    换句话说，它启动了一个进程，不断检查第一组括号中的条件以判断是否为真。当它为真时，运行第二组括号内部的指令。


    `when` 和 `waituntil` 有什么区别？`when` 和 `waituntil` 都会持续检查条件是否为真。当条件为真时，`waituntil`
    只是简单地让执行到下一行代码。这就像 `waituntil` 是一个交通警察，在绿灯亮起拦截交通。灯变绿时，交通移动。


    另一方面，`when` 检查绿灯然后让交通执行恰好一件事或一个列表。对于我们这些多个乌龟的情况来说，这可能更合适。


    我们需要使用 `when`，并且我们制作的一些过程可能会导致用户胜利或失败，取决于他们是否满足获胜条件（t1 碰到 t2）或失败条件（t1 碰到红线）。


    对于失败，我们将创建一个 `lose` 过程，它使用我们已经创建的 `reset` 过程。当条件为真时（t1 碰到红线），计算机将运行 `lose`。`lose`
    将宣布“You lose!”然后调用 `reset`。


    对于胜利，我们将使用已经创建的过程。在 `win` 中，t1 变成云，然后变成其他东西，等待一会儿，并宣布“You win!”然后调用 `reset`。


    ![](img/242aaa06c3a3208f16d97cdd92303648_136_0.png)


    你对上面的图怎么看？注意它有四个决策检查器同时工作，由图表表示。它们都在与 t1 通信，因为它们遵循了开头 `talkto t1` 的命令。每一个都通向游戏的结束。它代表了我们的程序吗？


    我从从中看到了两个问题：


    - 我们在哪里使用 t3 和 t4？它们需要来回移动，当我们使用 `colorunder = 15` 时，旋转 180 度。让我们把它们放在开头。我们启动的动作是同时运行的，所以我们将它们并排放置。


