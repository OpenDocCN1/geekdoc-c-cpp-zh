    # setsh "horse1

    setsh [horse1 horse2 horse3]


    Install the horse1, horse2, and horse3 shapes into your Shape Center.


    In my code, why do I need to put the quotation mark in front of "horse1? Why not
    just setsh horse1?

    When you give MicroWorlds a Logo a word, like start or main or setsh or horse1,
    it assumes the word is a procedure to look up in its vocabulary and run. It treats
    it as an action word, or a verb. Putting the quotes in front says. "This is a
    name of something; don''t try to run it." It says it''s a noun.

    Without the quotes in front of horse1, MicroWorlds will try to run the procedure
    horse1. But not, there isn''t one.

    Make sure the "is is made by one stroke of the key next to the semicolon key,
    while holding down the shift key. Two strokes of the key'' won''t do.


    Setsh needs either a word or a list of words as its input. So, horse1 is a complete
    instruction. In the second example, setsh [horse1 horse2 horse3], you don''t have
    to quote each name because the brackets show that it is a list. Setsh will accept
    its input as a list of shapes. Therefore MicroWorlds knows to interpret the words
    as a list of shape names.


    Change your Main procedure to look like this:


    ```

    to Main

    cc

    pu

    talkto "t1

    ;works with turtle named t1

    setsh [horse1 horse2 horse3]

    repeat 20 [square]

    end

    ```


