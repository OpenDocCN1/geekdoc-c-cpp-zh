    ## #28 吊字游戏 II


    剩下的吊字游戏课程可能对初中生来说有点太难了。如果是这样，请尽管跳过它们并继续进行下一个游戏：“城市（City）”。


    现在，我们如何将所学知识应用于吊字游戏呢？


    在吊字游戏中，用户有六次机会来猜出一个单词中的字母。当猜错字母时，电脑会画出一个被挂人的部分。当猜错六次后，那个人就完蛋了。


    我们将绘图部分留到以后。现在，我们来计算猜错次数。让我们将其转化为我们第一个简化版本的一些需求：


    - 设置：选择一个三个或四个字母的单词让用户猜。设置相应数量的文本框，每个单词中的每个字母设置一个。

    - 计算机将要求用户猜一个字母。

    - 计算机将每个猜出的字母与选定的字母进行比较。

    - 如果字母是选定的字母之一，计算机将将其打印在正确的文本框中。

    - 如果字母错误，计算机将计算错误次数。

    - 计算机将重复这一系列步骤，从要求用户猜答案开始。

    - 猜错六次后，循环结束。


    我们需要替换循环中移动乌龟的步骤，将其改为与吊字游戏相关的步骤。


    ## 设置


    首先，让我们在一个新的 MicroWorlds 文件中设置我们的图形页面（Graphics Page）。我们将在屏幕上设置三个小文本框，用于存放每个被猜中的字母。我们将使用
    `print` 命令将字母放入文本框中，而不是控制中心（Command Center）。


    要创建一个文本框，请转到 A 或 ABC 图标。点击它，然后画一个大小合适的文本框，至少一英寸见方。它会提示你它是文本。现在，使用鼠标右键右击文本框。会弹出一个窗口。在
    MicroWorlds EX 中，选择“edit（编辑）”，你会看到一个框选了“Show Name（显示名称）”。在 MicroWorlds 2.0 中，你不需要先选择“edit”，直接看到那个框。点击“Show
    Name”旁边的框取消勾选，然后点击“OK”。现在名称文本被隐藏了。


    创建一个 Start 按钮。在程序页面（Procedures Page）上，为 Start 写一个过程。


    ## 计划代码


    我们的循环将模仿上节课中做的循环。但我们的步骤将是不同。步骤不再是移动乌龟，而是做其他事情。让我们先从另一个文件中把代码粘贴过来，并将三个步骤替换为 Step
    1、Step 2 和 Step 3。我们可以在 Step 1、Step 2 和 Step 3 前面加上注释标记，提醒我们它们目前还不起作用。它看起来应该是这样：


    ```

    to Main

    local "counter"

    make "counter 0"


    forever

    [

    talkto "t1"

    ;Step 1

    ;Step 2

    ;Step 3

    show :counter

    make "counter sum :counter 1"

    if (:counter = 6)[stopall]

    end

    ```


    吊字游戏的第一个步是什么？这里再次是循环需求：


    - 计算机将要求用户猜一个字母。

    - 计算机将每个猜出的字母与选定的字母进行比较。

    - 如果字母是选定的字母之一，计算机将将其打印在正确的文本框中。

    - 如果字母错误，计算机将计算错误次数。


    看起来循环内部的第一步是要求用户猜一个字母。

    你能为我们的吊字游戏循环画一个草图吗？先用伪代码写下流程图指令。在完成之前不要翻页。


    你正在工作，对吧？


    ![](img/242aaa06c3a3208f16d97cdd92303648_161)


    这是吊字游戏循环的草图。


    ![](img/242aaa06c3a3208f16d97cdd92303648_162)


    '
