    `forever` 让程序进行循环。将 `forever` 放在 `Main` 中这一系列步骤的最上方，并在步骤周围加上方括号 `[ ]`。你还需要修改另外两个地方来提供停止循环的方法，以及
    `animate` 过程。你需要在 `animate` 过程内部放入 `stopall` 命令。如果你发现你的程序卡在无限循环中，请同时按下 `control-alt-delete`
    键，调出菜单，允许你关闭 MicroWorlds 应用并重试。玩完之后，先放开这个练习；它不是我们下节课要继续的程序。


