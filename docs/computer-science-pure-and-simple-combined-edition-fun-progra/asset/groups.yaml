    - 如果数字是向上箭头的，将乌龟的头部设置为向上（0）。\n- 如果数字是向下箭头的，将乌龟的头部设置为向下。\n- 如果数字是向右箭头的，将乌龟的头部设置为向右。\n\
    - 如果数字是向左箭头的，将乌龟的头部设置为向左。\n\n（注：此处原文伪代码描述略有重复，已根据逻辑翻译为上、下、右、左）\n这里是我们的 direct\
