    Before we solve the movement down, there is another problem with our **square**
    procedure. As it is now, it is not really readable. Let’s write the same long
    instruction over several lines, making it much more readable. We can do that on
    the Procedure Page. It''s just not as easy as in the Command Center. MicroWorlds
    Logo ignores the fact that the instruction is spread over many lines. MicroWorlds
    Logo is really just interested in whether the inputs and outputs are all satisfied.


    Change your procedure so it looks like this:


    ```

    square

    pd

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    end

    ```


    There, that is much more readable and you can see at a glance how it works. Notice
