    但是，由于我们启动了一个持续运行的进程，我们不会使用：\n\n```\nif (colorunder=15)\n```\n\n那只会检查一次。\n\n我们必须使用另一个过程，**waituntil**。\n\
    \n## 帮助词汇告诉了我们关于 waituntil 的信息：\n\nwaituntil true-or-false-list-to-run\n\n告诉 MicroWorlds\
