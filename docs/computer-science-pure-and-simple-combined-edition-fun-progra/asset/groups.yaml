    \ walks forward when you push start.\n\n- 3. Change the size of the animal's steps\
    \ and the number of steps it takes when you push start\n\n- 4. Change the walk\
    \ procedure so that it doesn't use `forward` either. Note that the animation won't\
    \ be working, but the horse will move across the screen.\n\n# #13 Cool Animation\n\
    \nLoad in your work\nFrom the File menu, open your previous project named jump,\
    \ the one with the running dog and the jump button. Then from the File menu select\
    \ \"Save Project As\" and save your project as jump2.\nIn the Procedures Page,\
    \ your program should look like this:\n\n```\nto Main\ncc eg pu\ntalkto \"t1\"\
    \nsetsh [dog1 dog2]\nseth 270\nrepeat 200\n  [Walk 10 10]\nend\n\nto doJump :height\n\
    local \"originalY\"\nmake \"originalY\" ycor\nsety sum ycor :height\nwait 1\n\
    sety :originalY\nend\n\nto jump\ndoJump 30\nend\n\nto Start\nMain\nend\n\nto walk\
    \ :stepsize :qsteps\nrepeat :qsteps\n  [forward :stepsize]\n  wait 1\nend\n```\n\
    \n# Become master of illusions\n\nProgramming sometimes involves creating an illusion.\
    \ Often you will want to make a creature to walk or jump. Actually all you do\
    \ is move the turtle, change the shape, move the turtle, change the shape. But\
    \ to use the user it creates an illusion. \n\n(Note: The remaining text in the\
    \ OCR for pages 77-79 was repetitive and merged into the unique content above.)\n"
  mdcn: "\n如果我们能制作一个“鸽巢式邮箱”来保存第一个 y 坐标，并在需要时取出这些信息，我们就能确切地知道让它去哪里了。让我们：\n\n-   创建一个变量并保存第一个位置的\
    \ y 坐标\n-   将乌龟移动到一个 y 坐标加了 50 的位置\n-   等一会儿\n-   取出第一个位置的 y 坐标\n-   并将乌龟移回那里。\n\
    \n让我们把它转换成 Logo 语言。你能自己尝试并和我的答案比对吗？准备好后翻页。但不要翻得太快！你只是在欺骗自己。\n\n这是我的代码：\n\n```\n\
    local \"originalY\nmake \"originalY ycor\nsety sum ycor 50\nwait 1\nsety :originalY\n\
    ```\n\n我们现在可以再做一些调整。\n尝试性地重写一个过程是常见的需求，但你又不想丢失旧的，至少现在不想。这是我的做法：我将现有的过程重命名为 `doJumpOld`，并将新过程写为\
    \ `doJump`。这样，你就不需要搜索整个程序来更改所有对 `doJump` 的调用了。它们保持原样，只是现在调用的是你新版本的 `doJump`。等我们确定做出了很好的改进后，就可以删掉\
    \ `doJumpOld` 了。\n这是我的 `doJumpOld`：\n\n```\nto doJumpOld :height\nseth 0\nforward\
    \ :height\n: wait 1\nback :height\nseth 90\nend\n```\n\n在你的过程页面上创建一个新的 `doJump`。第一行与之前相同。添加我们上面的代码片段，它让我们能够：\n\
    \n-   创建一个新的鸽巢（使用 `local`）并保存第一个位置的 y 坐标（使用 `ycor`）\n-   将乌龟移动到一个将 `height` 中存储的值加到\
    \ y 坐标的位置\n-   从它的鸽巢中取出第一个位置的 y 坐标\n-   将乌龟移回那里。\n\n再次强调，在看下一页我的结果之前，先写下你的想法！\n\
    \n```\nto doJump :height\nlocal \"originalY\"\nmake \"originalY\" ycor\nset y\
    \ sum ycor :height\nwait 1\nset y :originalY\nend\n```\n\n它有效吗？你如何改变跳跃的高度？记住，你通过更改在\
    \ `Jump` 中调用 `doJump` 时使用的数字。\n\n我喜欢它！我喜欢我们新版本的 `doJump`，它解决了“向上爬”的问题。是时候整理我们的程序并保存它了。这是我的版本：\n\
    \n```\nto Main\ncc cg pu\ntalkto \"t1\"\nsetsh [dog1 dog2]\nset 270\nrepeat 200\n\
    [Walk 10 10]\nend\n```\n\n```\nto doJump :height\nlocal \"originalY\"\nmake \"\
    originalY\" ycor\nset y sum ycor :height\nwait 1\nset y :originalY\nend\n```\n\
    \n```\nto jump\ndoJump 40\nend\n```\n\n```\nto Start\nMain\nend\n```\n\n```\n\
    to walk :stepsize :steps\nrepeat :steps\n[forward :stepsize\nwait 1]\nend\n```\n\
    \n# 练习\n\n-   1. 根据你本课的工作创建一个名为 `hopyourname` 的文件。在其中，为你的跳转程序添加一个名为 `hop` 的过程，它能够：\n\
    \n    -   当你按下名为 `hop.` 的按钮时，让狗向侧面跳跃并回来（这与 jump 类似）。\n    -   不使用 `forward.`。\n\
    \    -   使用变量。展示你的狗两种不同尺寸跳跃。\n\n-   2. 将你的狗改为马。修改代码，使得动物在点击 start 时面向右侧并向前走。\n\
    \n-   3. 修改动物步子的大小以及它在点击 start 时迈的步数。\n\n-   4. 修改 `walk` 过程，使其也不使用 `forward`。注意动画将无法运行，但马会穿过屏幕。\n\
    \n# #13 酷炫动画\n\n加载你的工作\n从 File（文件）菜单，打开你之前名为 `jump` 的项目，就是那个有跑步的狗和跳转按钮的项目。然后从\
    \ File 菜单选择“Save Project As”（另存项目），并将项目保存为 `jump2`。\n在过程页面上，你的程序应该如下：\n\n```\n\
    to Main\ncc eg pu\ntalkto \"t1\"\nsetsh [dog1 dog2]\nseth 270\nrepeat 200\n  [Walk\
    \ 10 10]\nend\n\nto doJump :height\nlocal \"originalY\"\nmake \"originalY\" ycor\n\
