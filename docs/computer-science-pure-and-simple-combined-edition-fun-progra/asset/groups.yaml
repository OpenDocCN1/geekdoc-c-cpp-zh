    \n现在让我们看看是否还记得如何制作动画。我们将打开一个新的空文件并从头开始。不要慌！我会告诉该怎么做。如果你卡住了，只需查看这节课的开头部分！\n\n记住，首先设置形状，然后向前移动。在形状中心（Shape\
    \ Center）中，设置或找到这些形状：`dog1` 和 `dog2`。\n\n首先设置形状：我们需要一行像 `setsh [dog1 dog2]` 这样的代码。现在，乌龟应该面向哪个方向？面向形状\
    \ `dog1` 所向的方向。`seth 90` 让乌龟面向右侧；`seth -90` 让它面向左侧。\n\n然后向前移动。使用这些命令让它缓慢移动：`repeat`、`fd`\
    \ 和 `wait`。\n在你写好慢移动过程后，再为快速移动写一个过程。\n\n接下来，画一些形状。首先我们进行练习。在形状中心中，双击一个形状来打开它。这也是创建新形状的方法——通过双击形状中心的一个空白处。\n\
