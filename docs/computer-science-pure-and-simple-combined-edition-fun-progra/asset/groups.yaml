    ## #9 Logo 变量


    现在我们将重新拿起 Logo 编程。如果我们想像以前一样画一栋建筑，但这次我们想要告诉电脑把它画得两倍大？或者一半大？只要我们弄清楚如何使用*变量*，我们就能轻松地做到。这些是值，例如建筑的高度，可以变化或改变，但同时只用一个名称表示。*Height*
    是变量名的示例。


    ## 我们聊聊变量


    当你启动一个程序（如 MicroWorlds、Word 或 Excel）时，你通常会双击图标。这是指令操作系统在硬盘上查找并找到与图标关联的程序。当操作系统找到它时，操作系统将其读入工作内存（也称为加载它）。工作内存是存储程序并运行它们的地方。由于内存，读取它并“运行”程序。在
    PC 世界中，文件通常以“.exe”结尾。工作内存是程序存放并运行的地方，是它们运行的地方。


    ![](img/242aaa063a208f16d92303648_43.png)


    想象工作内存包含许多鸽子窝，就像邮局的信箱。为了使用这些存储空间，我们需要这样做：我们为预留一个位置并命名它。让我们选一个并给它命名——叫“Gus”怎么样？我们可以用
    Gus 来存储数字、单词或列表。假设我们要使用或更改信箱里的内容。由于我们命名了信箱，我们可以告诉电脑去哪里找它。所以，我们如何预留并命名这个位置？MicroWorlds
    有一些内置过程和运算符协助我们。这里有一个：


    **Local** 预留并命名一个存储空间。


    ## 测试程序


    打开 MicroWorlds 并创建一个新项目。你可以将其命名为 **Test** 并保存。


    现在我们将编写一个小过程来使用变量。我们将第一个变量命名为 Var1。我们要使用 *local* 来预留并命名我们的变量。


    | | | | | | |

    |---|---|---|---|---|


    ## 命名为 Var1 的信箱


    让我们创建一个名为 TestVar 的过程来测试变量。在过程页输入以下过程：

    to TestVar

    local Var1;预留并命名一个存储空间

    show "Var1;我们想要打印存储空间中的值

    end


    Var 只是在命令中心打印项目的命令，这样我们就可以看到电脑在想什么。

    好的，它有效吗？通过在命令中心输入 `TestVar` 来测试。

    嗯，那里确实打印了东西！但发生了什么？


    让我们设置一个开始按钮。制作按钮，标记为 Start，并在过程页添加此：

    to Start

    Main

    end


    同时也制作一个 Main：

    to Main

    TestVar

    end


    回到你的图形页面 1 并点击开始按钮。在命令中心你将看到电脑打印：

    Var1


    哎！这个过程是变量（信箱）的名称，而不是信箱里的内容（数字）。


    内置过程 `local` 是一个有一个输入的过程——即变量的名称，在本例中为 Var1。`local` 告诉 MicroWorlds 在内存中预留一个位置来存储物品，并告诉
    MicroWorlds 我们将这个位置命名为 Var1。这个位置是一个地址为 Var1 的小信箱。


    '
