    Here is mine:


    ```

    launch [repeat 2000 [forward 3 direct readchar ] ]

    ```


    Do you see how it works? Let''s look at it from right to left. **Readchar** is
    taking one character of input from the keyboard. **Direct** is the procedure we
    make which needs one input (the keyboard character) and uses it to set the turtle''s
    heading. Now, we have a little list of commands: go forward 3, then change the
    turtle''s heading using **direct** and the keyboard input. We will repeat this
    little set of commands 2000 times, and we''ll launch the whole process. This means
    that it will operate independently of other processes we might also launch.


    Here''s our version of **Main**. I have underlined the new code.


    # to Main


    +   - talk to turtle 1

    - launch a process that repeats many times a call to go forward a little bit

    - use readchar to collect info from the keyboard

    - call direct, passing to it the information collected by readchar.

    - launch [repeat 2000 [forward 3 direct readchar ] ]


    Now, add a line of code to match the pseudocode for talking to turtle 1. Add the
    code for **to direct**, given earlier.


    Now we have a program. Does it work?


    Let''s draw a maze to go with it. On your graphics page, Page 1, make a **go**
    button (using the icon that looks like a finger pushing a button). Using the drawing
    center under the paintbrush icon, draw some thick red lines or curves for your
    maze. Make sure you are using thick red lines with color 15, to match the code
    I will give you. Pause the mouse over the Drawing Center to be. You can make the
    maze more difficult by placing the lines close together. Go to Presentation Mode
    under the View menu in MicroWorlds EX, and in MicroWorlds 2.0 under the Gadgets
    menu. To leave presentation mode, click or double-click on the black border.)
    Press the go button, and then start pushing the arrow keys to advance the turtle.
    Does it work? Work before you look out on the next page. Be sure you use Presentation
    Mode for these mazes; otherwise they may not work properly. If your pen is still
