  - '[PAGE 146]


    # #25 Race II


    Here are our game specifications:


    +   - The game starts with a Start button. It has a thick finish line drawn using
    the drawing center.


    +   - The game has two users and two turtles. The turtles move a distance to the
    right (or up) each time the corresponding user answers a question correctly.


    +   - There are four easy questions for each user. After four correct answers,
    a turtle reaches the finish line.


    +   - If a racing turtle crosses the finish line, a third turtle which has been
    hidden becomes visible and does an animation of your choice. (This is a procedure
    called win.)


    +   - The racing turtles return to the starting gate when a user presses Start.
    Also, the animated turtle returns to its starting position. (This is a procedure
    called setup.)


    One thing to keep in mind as you design your game is that the questions will appear
    in a large rectangle in the middle of the screen, which will tend to hide the
    racers if they are also crossing that part of the screen. You can solve this problem
    by moving the racers to the top or bottom of the screen, or by providing long
    waits between questions so the user can see where the racer is.


    Our flow chart will begin with Start, setup, and a question block, and then a
    decision diamond for the answer. If the answer is true, the turtle moves forward.
    If it is false, we announce “Oops!” and tell the user what the right answer was.
    In either case, we go on to the next question. Work again on your sketch of this,
    and then turn the page to see mine.


    ![](img/242aaa06c3a3208f16d97cdd92303648_146_0.png)


    Paul’s Race: The Winner! A ghost appears and walks to the top of the mountain.'
