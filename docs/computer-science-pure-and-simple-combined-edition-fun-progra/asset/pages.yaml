    \ another turtle, t5, takes the shapes of tornado1 and tornado2, and moves to\
    \ the right towards the castle.\n    * Spray-paint some turquoise blue (cyan)\
    \ near the castle. When it strikes the blue, the tornado jumps over the castle.\n\
    \    * When the tornado jumps, the castle turns into a cloud and then back into\
