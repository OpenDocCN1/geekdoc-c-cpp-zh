  md: 'Write code that moves the turtle along the measurements that you are seeing
    in your drawing.

    Make another window and a chimney on your own. If you have time, add stairs.


    Color your house using Logo instructions. Here''s how you do it: you imagine that
    the turtle carries a bucket of paint with it. You assign the color in that bucket
    using **setc** (pronounced “set C” for color) with a number input. For example
    **setc 15** fills the bucket with red. You can also use the name of the color
    as an input, if you do it with a quote mark like this:


    > setc "red"


    Find other colors by trial and error, or by using the Help menu. Right-click on
    a color in the painting window.


    You can make a procedure called **colorhouse**. In it, pick the pen up (pu), move
