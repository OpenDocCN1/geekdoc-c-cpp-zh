- pgno: 24
  md: '![](img/242aaa06c3a3208f16d97cdd92303648_24_0.png)


    Pause your mouse arrow over one of the installed shapes, and you will see its
    name, number, and size in pixels. We can get rid of the Painting/Clipart window
    by clicking on the red x in the upper right.


    Click on one of the shapes in the Shape Center, and then click on the turtle.
    Presto! it''s wearing the shape.


    You can hatch more turtles, click a shape, and click the turtle. Make the shape
    smaller or larger by clicking first on the magnifier icon and then on the shape.
    Drag the turtles around.


    # Getting Started


    Open a new file. For now we will use horse1, horse2, horse3. Go ahead and install
    your horse shapes to the Shape Center, and hatch a turtle.


    We''ll use the command setsh, for set shape. We give the computer set list of
    shapes. Every time the computer calls forward, the computer comes back to the
    shapes list and tells the turtle to change shapes to the next shape. Let''s set
    our shapes. Type this in the Command Center:


    ```

    setsh [horse1 horse2 horse3]

    ```


    Press <enter>. We''re ready to go! Now let''s get our turtle started walking.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "Type this into the Command Center: fd 1 . Execute it by pressing <enter> at\
    \ the end of the line. What happens? The turtle takes one step, and his shape\
    \ changes! Now move the cursor up the end of that line and press <enter> to execute\
    \ it. Do it again. Each time it changes shape! Of this is too slow for a real\
    \ animation. To animate, the turtle needs to repeat a lot of times moving forward\
    \ in small steps. We also need to add a wait command to pause the action enough\
    \ so we can see it. Let's add a line:\n\n```\nsetsh horse1 horse2 horse3\npu repeat\
    \ 100 [fd 3 wait 1]\n```\n\nThis is how animation works: first set your shapes,\
    \ then what happens.\nat the end of the second line, push <enter> and see what\
    \ happens. Hmm. The turtle wearing a shape is going upward! This isn't entirely\
    \ what we had in mind. Here's why: the turtle's head is still pointed out, although\
    \ the shape it is wearing seems like the turtle's head is pointed to the right.\
    \ The turtle always goes wherever its head is pointed. But the head is hidden\
    \ when the turtle wears a shape. To see where it is, type this into the Command\
    \ Center:\nset 0. That returns the shape to the original turtle. Take a look!\
    \ Execute the setsh[horse1 horse2 horse3] line in the Command Center again (by\
    \ putting the cursor at the end of the line and pressing <enter>) to get the turtle\
    \ to the way it want.\n want to tell the turtle's head in the direction we want\
    \ to move. That is to the right. We'd like to set the turtle's heading (using\
    \ set-H, for setting heading) so that no matter what it was doing, it will end\
    \ up facing the correct direction. Type this in the Command Center right 90 .\
    \ Set 90 turns the turtle's head 90 degrees to the right from vertical. That's\
    \ the same angle that is at the corner of a rectangle. What if we had rt 90? The\
    \ result would have the same. But what if the turtle's head had started pointing\
    \ down? Then rt 90 would have resulted in the turtle pointed the wrong way. But\
    \ set 90 will always point the turtle to the right. We'll use set 90 in this case.\
    \ Now our Command Center looks like this:\n\n```\nsetsh [horse1 horse2 horse3]\n\
    set 90 repeat 100 [fd 3 wait 1]\n```\n\nWe don't have to keep executing the setsh\
    \ line, unless we want to switch to a different list of shapes.\nSo now we can\
    \ use this code to make ourselves a procedure called walk. Copy and paste the\
    \ two lines of code to the Procedures Page (remember how to find it?). Now start\
    \ the procedure to walk and end with it. Go back to the Command Center and clear\
    \ it (use clear for Command Center). Now type walk in the Command Center. Does\
    \ the turtle work?\nnOK, let's make another procedure that is a copy of walk only.\
    \ We'll call it run. (I discovered that run is used already in the language for\
    \ something, so we'll just change the spelling.) First if we want to highlight\
    \ and copy the procedure walk (use edit-copy) and paste (edit-paste) another version\
    \ below our original procedure on the Procedures Page. We'll give it the new name\
    \ run and make sure it ends with end. So the Procedures Page looks like this:"
  merge: -1
  img_proc: true
