    \ in the Help vocabulary.\n\n```\nwhen [true-or-false-instruction-list] [instruction-list]\n\
    ```\n\nStarts a parallel process that repeatedly tests whether the first instruction\
    \ list reports true or false. If it reports true, the second instruction list\
    \ is run. To stop a *when*, use cancel (only on the true-or-false-instruction-list),\
