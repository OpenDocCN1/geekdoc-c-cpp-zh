    Look at the icons at the top:


    ![](img/242aaa06c3a3208f16d97cdd92303648_22_1.png)


    The landscape picture allows us to choose a background. The flower icon window
    contains shapes, and the walking-people icon window contains shapes just for animations.
    Click on the walking-people animations icon.


