    and hold it down. Move the window to the left. Now, at the bottom of the page
    on the right, find the folder tab that says “shapes.” Click on so that it’s the
    folder that shows. It should look like a grid of dots.


    Make sure your window full of possible shapes is next to the Shape Center full
    of empty dots.


    ![](img/242aaa06c3a3208f16d97cdd92303648_23_0.png)


    Now, let’s drag some shapes over from the Painting/Clipart window on the left
