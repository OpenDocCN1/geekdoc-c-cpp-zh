- pgno: 109
  md: 'We will subtract 50 from random 100. Let''s go over it again, in case we didn''t
    digest it too well the first time. If random 100 is 99, then ninety minus 50 is
    49. If random 100 is 49, then 49 minus 50 is -1. If random 100 is 2, then 2 minus
    50 is -48. So, about half the time we would get a negative number, and the turtle
    would be turning left instead of right. Remember?


    Now, how do we encode that? We started with this:

    We will have to use the procedure difference. What we want is the difference between
    100 and 50, or


    difference random 100 50


    so our line of code turns into this:


    right difference random 100 50


    Now, copy and paste this line from the Command Center to your Procedures Page,
    right after its pseudocode. I will underline it because it is new:


    ```

    to wander :stepSize

    ;turn right by a random amount which could be negative

    right difference random 100 50

    ;move forward by stepSize, repeat twice

    ```


    end


    In the Command Center, type wander 5 to test wander. Keep doing it. Does it turn
    right sometimes and left sometimes?

    Now, let''s finish it. Here''s the next piece of pseudocode we are looking at
