    besides Y?

    The computer goes to the next line of code. also, what happens after you go through

    madlib and finish it? If you followed this pseudocode, you’ll soon get the same
    thing both times: the

    computer tells you “Bye!”


    But this isn’t quite what I want. I want to say “Bye!” only if the user types
    something besides Y

    and refuses to play. So the program needs more work.


    # Do it again


    We need to sandbox some more. We want the computer to do one thing (play madlibs)
    if the

    is Y, and something else (say “Bye!”) if the answer is other than Y. In most languages

    this is called an If-then-else statement. We would be writing something like this:


    ```

    If (answer equals Y) go to madlibs

    else

    ```'
