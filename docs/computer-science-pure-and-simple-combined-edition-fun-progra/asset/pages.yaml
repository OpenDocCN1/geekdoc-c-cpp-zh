- pgno: 116
  md: '# #20 Maze I


    # Decide on the Goal


    Now we want to make an interactive game where a turtle, t1, is wandering through
    a maze, moving in the direction the user indicates. The user will use the arrow
    keys. When the user presses an arrow key, the turtle will move in that direction
    a few steps. To get the turtle to go a long way, the user will need to press the
    button a lot of times.


    Open a new file. Using the drawing center, we will draw some maze lines. In the
    next lesson, we will add capability. When the turtle bumps into a maze line, the
    user loses and has to start over. The user wants to get the turtle through the
    maze to a destination. How about a second turtle dressed up as a castle (or a
    hut)? Eventually we will add roving spiders that want to "get" our turtle, and
    teleporter booths that send the turtle to some other spot in the maze.


    ![](img/242aaa06c3a3208f16d97cdd92303648_116_0.png)


    Nicole''s Maze


    # Draw up a Plan


    This time, we are going to add a step: draw up a plan. We''ll make a flow chart.
    A flow chart is a visual plan of what we are going to do. You read it from top
    to bottom; the program flows from box to the next down the chart, with diamonds
    indicating decision points. Here is a start for our flow chart for the beginning
    part of the maze:'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Sandbox for Necessary Knowledge


    We want to move and turn the turtle by pushing the arrow keys. We''ll need a lot
    of new information to figure out how to do this. First, how will we collect information
    from the keyboard?


    Readchar is a built-in procedure that "reads” the input from the keyboard. Let''s
    check to see if it works. in the Command Center, type


    ```

    show readchar

    ```


    and hit the Enter key. Now move your mouse up to the graphics window and click
    there. Hit a letter key. Does the letter appear in the Command Center? It should.
    Put your cursor at the end of the show readchar line and press Enter again, to
    do it again. Now press one of the arrow keys. Oops! in the Command Center, we
    don''t see an arrow; we get symbol like! This will vary depending on whether you
    are using a Mac or a PC. What''s going on?


    Readchar is reading the character, but it is storing its information as a number!
    Then it is pulling the number out and using a code to figure out what it is, and
    it''s getting mixed up about the arrow keys!


    When you play writing code, you assign a number to each letter of the alphabet.
    It turns out there is a code like built into computers. It is the ASCII code,
    which stands for the American Standard Code for Information Interchange, a code
    that assigns a number to each character. The problem is, it isn''t entirely standard
    code. The Mac and PC people use different number codes for certain keys like arrow
    keys.


    Logo has a built-in procedure called ascii. This procedure takes keyboard input
    from readchar and reports an ASCII code for it.


    Let''s test this procedure. in the Command Center, type


    ```

    show ascii L

    ```


    We''re asking the computer to type the ASCII code for upper-case L in the Command
    Center. We get this response: 76. This is the ASCII code for upper-case L.


    Now, can you tell me the ASCII code for T? for the number 8? The letter H? h?


    What are we most interested in is the codes for the arrow keys. We can''t type
    into arrows into the Command Center. Can you figure out how to get the computer
    to show the ASCII code in the Command Center for an arrow key? Hint: use ascii
    and readchar. Think about it and turn the page.


    ![](img/242aaa06c3a3208f16d97cdd92303648_117_0.png)'
  merge: -1
  img_proc: true
