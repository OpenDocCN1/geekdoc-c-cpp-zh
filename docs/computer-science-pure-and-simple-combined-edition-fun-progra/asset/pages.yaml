  md: 'end


    to Start

    Main


    end


    ```

    to walk :stepsize :qsteps

    repeat :qsteps

    [forward :stepsize]

    wait 1]

    ```


    end


    Try your program by clicking on the Start button. The dog walks (actually runs
    but we''ll call it walks) across the screen. Click on the jump button. You get
    an "I don''t know how to Jump" error message, because there is no longer a jump
    procedure. We renamed it to doJump.


    # Processes


    There is one other thing to notice. Even though you get an error message, the
    little dog keeps on walking! We get the error message when we click on the button,
    we call the procedure jump which does not exist any more. Doesn''t that strike
    you as a bit strange the dog keeps walking? We have an error, but the program
    keeps running! Let''s try a little experiment. I''ll call this we just made Version
    1 of the program.


    Let''s put the same error in Main, calling jump, and see what happens. Stop your
    dog and then edit Main, putting a call to jump back in, as follows:


    ```

    repeat 200

    [Walk 10 10

    Jump 30]

    ```


    We will call that Version 2 of the program. Now, after the dog walks 10 steps,
    the program will call jump, which does not exist. On your Graphics Page, Click
    on Start. Sure enough, you get the error message this time the dog stops.


    What is going on here?


    The explanation is that the Logo language has "processes." Each process is independent
    of another process. A process is almost like its own little program. When we click
    on a button we start a process. If we had more than one turtle moving along the
    screen, each one would be running in its own process. In Version 1 of the program,
    clicking on the Start button started a process which had no errors and ran fine.
    Clicking on the jump button started another process which did have an error and
    would not run but did not affect the first process.


    In Version 2, we put an error in the process that is started by the Start button
    and sure enough, the error stopped the process!'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'This was just to give you a brief idea about processes. Let''s go back to Version
    1. Take the call to jump out of Main.


    # Jump has a bug!


    We need a new procedure jump which will be called when the button is clicked.
    Add this procedure to your Procedures Page:


    ```

    to jump

    dojoump 20

    end

    ```


    This gives us a way to pass a number to doJump. Now try your program. Well, it
    is fun. You can make the dog walk along and then, by clicking on jump, make him
    a little jump and then carry on. this way we have to get the label we want on
    the button and we will keep the program out where we can see it in the Procedures
    Page.


    Did you notice something odd? Did you notice that the dog kept getting higher
    and higher after we click jump? It didn''t seem to come all the way back down
    after a jump.


    Well, folks, we have a bug in our program. Nothing is not right, and we need to
    debug our program. That is, we need to find what the error is. To debug a program,
    the first step is to find out what is causing the problem. When the turtle walks,
    it does not move higher.


    Try stopping the walk (by clicking again on the Start button) and clicking on
    the jump button. Jump seems to work fine and walk seems to work fine when they
    are run separately. But when both processes are running at the same time, we seem
    to have a bug in our program!


    So, it only occurs when both processes are running at the same time. I would like
    to see the movement with the shape of the dog obscuring the turtle. In Main, put
    a semicolon in front of the setsh line, like this:


    ```

    ; setsh [dog1 dog2]

    ```


    The computer sees a line with a semicolon and considers it a comment, not part
    of the program. It is like all the words to the right of the semi-colon are invisible
    to Logo and visible to humans. We have just made this line invisible to Logo.
    (We "commented the line out.") Programmers do it all the time)


    Let''s turn the dog back into a turtle. Type a command in the Command Center:
    setsh 0 <center>. Now run the program. Seeing it this, with the naked turtle,
    makes me a little suspicious of what is happening with forward. Sometimes the
    turtle points out, sometimes it left.


    Let''s take a hard look at our two processes and try to figure out what happens
    that is different, when both processes are running at the same time.


    You can see that both walk and doJump tell the turtle to move forward. Forward
    just means "go in the direction your head is pointing." So, if the doJump process
    is running, then the head is pointed up (setsh 0). So during the time the doJump
    process is running, the walk process actually'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'forward and increases the height of the jump! That is why the turtle edges
    a little higher each time, I THINK! We need to test this theory.


    Looking at the code in doJump, we see that the turtle’s head is pointing up right
    from the line seth 0 until the line seth 270. If the turtle time pointing up,
    would amount the turtle climbing decreasing? In other words, let''s say the turtle
    spend time with its head pointing up, and the climbing decreases. Then that would
    confirm our suspicion that the problem is walk forward, while doJump has the turtle’s
    head pointing up. It''s like the turtle has two bosses who are issuing different
    orders, and the turtle tries to obey them both.


    Let''s also decrease the amount of time by getting rid of the wait 1 line. “Comment
    out” that line, as shown below.


    ```

    doJump height

    seth 0

    forward :height

    wait 1

    back :height

    seth 270

    ```


    Get the turtle walking and then click jump several times. On our system, that
    eliminates the "climbing up" problem! Unfortunately you can barely see the turtle
    jump, but we know that it is jumping.


    Another way to test is to change wait 1 to wait 3 and see if it makes the problem
    worse. Try it.


    Now we understand that the problem is that while the turtle is pointing up in
    doJump, walk makes it go higher. But how are we going to fix it?


    Let''s eliminate the use of forward in the procedure doJump. This might solve
    the problem. It would be nice if we could make the turtle jump without changing
    its heading at all. Then walk could make it go forward at the same time without
    any bad effect. As computer programmers, our next step is to check the Logo Vocabulary
    in the Help menu to see if there are any other built-in procedures we could try.'
