  md: 'I changed loop steps to look like:

    to Main

    local [counter1 letter2 letter3]

    make "counter 0"

    forever


    ```

    question [Give me a letter]

    if (answer = "d") [talkto "text1 print answer "letter1 answer"]

    if (answer = "o") [talkto "text2 print answer "letter2 answer"]

    if (answer = "g") [talkto "text3 print answer "letter3 answer"]

    show :counter

    if ( not or answer = "d" or answer = "g") [make "counter sum :counter 1

    if (:counter = 6)announce [You lose!] stopall]

    if all text boxes are correct, announce you win, and stop the game.

    ```


    Now that the variables are filling up nicely, how do we check that the contents
    are correct? Let''s use this simple line of reasoning. If letter1 contains d and
    letter2 contains o and letter3 contains g, then announce "You win" and stop the
    game. The key word here is. Remember its special use from the lesson on logic?
    I will jog your memory.


    If (it is raining) and (I have to go out) [take the umbrella].


    Now the and is linking two Boolean statements. If both Boolean statements are
    true, then we take the action.


    What if I use or? Then only one of the Boolean statements needs to be true.

    If (it is raining) or (the weatherman says it will rain) [take the umbrella].


    Let''s go back to our hangman problem.

    We want to say


    ```

    if all text boxes are correct, announce you win, and stop the game.

    ```


    Actually, we want to use the variable names letter1, letter2, and letter3 to say
    something like this:


    ```

    if ([letter1 contains d] and [letter2 contains o] and [letter3 contains g])

    announce you win and stop the game

    ```


    First, let''s look first at the simple statements. How will we translate [letter1
    contains d] to Logo?

    The equals sign is a Boolean (true-false) operator in Logo. A statement using
    = is a Boolean statement, evaluating to true or false. So let''s try using =,
    with a space before and after. This will work?'
