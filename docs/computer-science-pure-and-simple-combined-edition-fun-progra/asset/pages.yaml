  md: '# #28 Hangman II


    (The rest of the Hangman lessons may be more advanced than a middle-school student
    would like. If so, please feel free to skip them and go on to the next game, City.)


    Now, how can we apply what we have learned to Hangman?


    In Hangman, the user has six tries to guess the letters in a word. When a guess
    is wrong, the computer draws a piece of a hanging man. After six wrong guesses,
    the man is a goner.


    We''ll leave the drawing part till later. For now, we''ll count the wrong guesses.
    Let''s translate this into some requirements for our first, simplified version:


    +   - Setup: Choose a word of three or four letters for the user to guess. Set
    up the right number of text boxes, one for each letter in the word.

    - The computer will ask the user to guess a letter.

    - The computer will compare each guess to the letters chosen.

    - If the letter is one of those chosen, the computer will print it in the right
    text box.

    - If the letter is incorrect, the computer will count the wrong guess

    - The computer will repeat the series of steps, beginning with asking the user
    to guess a answer.

    - After six wrong guesses, the loop ends.


    We need to replace the steps in the loop that move the turtle with steps that
    have to do with Hangman.


    # Setup


