- pgno: 94
  md: '# #16 Madlibs II


    Let''s work on it some more!


    # Decide on the Goal


    Now we want to add another procedure; we''ll call it **intro**. It chats with
    the user a little and then asks whether the user wants to play madlibs. This way,
    we''ll get some practice with the **if-then** **statement**, another element that
    is common to all computer languages.


    Here''s the pseudocode for it:


    ```

    to intro

    ;makes a dialogue box to ask "What''s your name?"

    ;says, "I like your name."

    ;asks, "Would you like to play madlibs? Y or N"

    ;if the user answers Y, then go to madlibs

    ;otherwise, say "Bye!"

    ```


    # Sandbox to Acquire Necessary Knowledge


    We need to learn about if-then statements. We want to do one thing if the user
    answers Y, and something else if the user answers anything else.


    Let''s consider this statement:


    > If it is raining, then you need to take your umbrella.


    The first part is a condition which we need to test. Is it true or not true? If
    it is true, then we take the action following, namely take the umbrella.


    This is a type of statement that a computer can understand. We can write


    ```

    if (it is raining) [take your umbrella]

    ```


    (The it is raining) condition has what is called a **Boolean** value: it is either
    true or false. (This is named after an English mathematician, George Boole.)


    This type of situation where there are only alternatives is very easily understood
    by a computer, which is really a bunch of on-off switches (T-F switches). So as
    the computer reads the condition, it will evaluate and assign a T or an F value
    to it. If the condition is true, it will execute the action. If it isn''t true,
    it just goes down to the next line.


    Now, a computer inside a building might have some trouble figuring out whether
    it is raining. It would need to read sensors on the outside of the building. But
    there are many problems it can easily evaluate to T or F. For example, it can
    ask the user for a number, and it can test the number to see whether it is greater
    than 1.'
  merge: -1
  img_proc: true
