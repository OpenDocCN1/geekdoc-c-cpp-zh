- pgno: 77
  md: '# Become master of illusions


    Programming sometimes involves creating an illusion. Often you will want to make
    a creature to walk or jump. Actually all you do is move the turtle, change the
    shape, move the turtle, change the shape. But to use the user it creates the illusion
    that the creature is walking.


    If you are using Windows, take a close look at your screen, especially the edges
    of the windows. It really looks 3-dimensional, doesn''t it? It looks like the
    edge has some depth to it. But it is just an illusion. The screen is flat and
    two-dimensional. It is just the careful use of light and dark colors to create
    the illusion of shadowing that makes the screen look three-dimensional.


    I want to make a program that makes it look like a creature is jumping over an
    obstacle. To do this we will need to trigger the doJump procedure. I am going
    to program a color to call doJump and then plant that color in front of the obstacle.
    This will create the illusion that when the creature gets near the obstacle, it
    sees it and jumps over it!


    # Program color


    MicroWorlds has a really cool and useful feature that allows you to program colors.
    You can program a procedure to be called if a turtle touches that color, or a
    different procedure if the mouse clicks on that. We will be using the turtle rule
    here.


    Click on the paintbrush icon to see the painting/clipart window. Make sure the
    paintbrush icon at the top of the window is pushed.


