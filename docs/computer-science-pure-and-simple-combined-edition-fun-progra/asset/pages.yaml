    up three small text boxes on the screen to hold each letter when it is guessed.
    We will use the print command to put the letter into the text box rather than
    the Command Center.


    To make a text box, go to the A or ABC icon. Click on it, then draw a goodsized
    text box, at least one inch square. It tells you that it is text. Now, using your
    right mouse button, right-click on the text box. A screen pops up. In MicroWorlds
    EX, choose “edit”, and you see a box that says “Show Name” is checked. In MicroWorlds
    2.0, you don''t have to choose “edit” first; you just see the box. Click next
    to “Show Name” to uncheck it, and click “OK.” Now the name text is hidden.


    Make a Start button. On the Procedures Page, write a procedure for Start.


    # Plan the Code


    Our loop will be modeled after the loop we did in the last lesson. But our steps
    will be different. Instead of moving the turtle, the steps will do something else.
    Let''s paste in that code from your'
