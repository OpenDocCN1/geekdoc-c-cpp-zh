  md: '# Using MicroWorlds EX


    You should first look at tutorial videos online for MicroWorlds EX. Find them
    at the support page of www.MotherboardBooks.com.


    The Procedures "Page" or window is to the right alongside the Graphics "Page,"
    provided the Procedures tab beneath it is selected. The Command Center is to the
    bottom left.


    ![](img/242aaa06c3a3208f16d97cdd92303648_9_0.png)


    You access the Shapes Center by clicking on the Shapes tab below the Procedures
    Page section. You will need to import shapes from the drawing/painting window
    to your Shapes Center before using any non-turtle shapes.


    Click on the icon at the top that looks like a yellow pad with paintbrush. The
    drawing/painting/clipart window opens up. Click on the daisy icon to see single
    shapes or the two-people icon to see animation shapes.


    Now drag the drawing window over to to the left by clicking down on the blue band
    at the top and holding the mouse button down, dragging sideways. Make sure the
    window on the right is the shape center by clicking on the tab beneath it that
    says Shapes.


