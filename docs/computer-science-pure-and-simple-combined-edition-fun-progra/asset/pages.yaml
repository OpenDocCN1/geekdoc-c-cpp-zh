    end

    ```


    ```

    to doJump :height

    local "originalY"

    make "originalY" ycor

    set y sum ycor :height

    wait 1

    set y :originalY

    end

    ```


    ```

    to jump

    doJump 40

    end

    ```


    ```

    to Start

    Main

    end

    ```


    ```

    to walk :stepsize :steps

    repeat :steps

    [forward :stepsize

    wait 1]

    end

    ```'
