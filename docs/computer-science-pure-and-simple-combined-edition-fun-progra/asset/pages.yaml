- pgno: 69
  md: '# Using ycor


    Way down at the bottom of the Index is **xcor** and **ycor**. **Ycor** looks like
    a very likely candidate, so let''s look it up.


    Go to Help, then Vocabulary


    ![](img/242aaa06c3a3208f16d97cdd92303648_69_0.png)


    On the left side of the page, you see an alphabet to help us look up the word
    we are interested in. Choose y.


    ![](img/242aaa06c3a3208f16d97cdd92303648_69_1.png)


    +   - Stands for y coordinate. Reports the y coordinate of the current turtle.

    - Given that there is a turtle on the page.

    - See pos, sety, and m


    This tells us that there is a built-in procedure **ycor** that has as an output
    the y coordinate (height on the screen) of the turtle. There is another procedure
    **sety** which takes a number as an input and presumably sets the y coordinate.


    How might this help us?


    ![](img/242aaa06c3a3208f16d97cdd92303648_69_2.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'In this little picture, our dot has an address. Its “x coordinate” sideways
    position on the screen is 300. Its “y coordinate” (height on the screen) is 200.
    These numbers tell us just where we we are on the screen, like a street address.
    It’s just like Star Trek or Star Wars, reporting your position using coordinates!


    Let’s say x=300, y=200 is the address for our turtle. What if we move the turtle
    up on the screen a little way?


    ![](img/242aaa06c3a3208f16d97cdd92303648_70_0.png)


    We moved the turtle upward by 50 units. So its y coordinate has changed from 200
    to 250. Its x coordinate is still the same.


    That is what we want to do! Tell the turtle to jump up by telling it to go from
    one position to the next. The second position has a y coordinate that is 50 steps
    higher.


    But wait, how do we get the turtle to come back down to the same spot again?'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'We would know exactly where to tell it to go if we made a pigeonhole mailbox
    to save the first y coordinate and could pull that information out when we needed
    it. Let''s:


    +   - make a variable and save the y coordinate of the first position

    - move the turtle to a spot where we have added 50 to the y coordinate

    - wait a little

    - pull out the y coordinate of the first position

    - and move the turtle back to that.


    Let''s cast that into Logo. Can you do it on your own and check your answer with
    mine? Turn the page when you are ready. But don''t turn too soon! You will be
    cheating only yourself.'
  merge: -1
