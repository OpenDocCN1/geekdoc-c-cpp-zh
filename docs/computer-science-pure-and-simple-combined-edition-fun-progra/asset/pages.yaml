- pgno: 43
  md: '# #9 Logo Variables


    Now we are going to pick up our Logo programming again. If we want to draw a building,
    like before, but this time we want to be able to tell the computer to draw it
    twice as big? Or half as big? We will be able to do this easily we figure out
    how to use *variables*. These are values, like the height of the building, that
    can vary, or change, but at the same time are represented with just one name.
    *Height* is an example of a variable name.


    # Let''s talk variables


    When you start a program, such as MicroWorlds, Word or Excel, you usually double-click
    on an icon. This is an instruction to the operating system to look on the hard
    drive and find the program that is associated with the icon. When the operating
    system finds it, the operating system reads it into working memory (also loading
    it) and executes or ''runs'' the program. This is why, in the PC world, files
    that run usually end with ".exe" for execute. Working memory is the place where
    programs are temporarily stored and where they live as they are running. This
    is the RAM that you buy when you buy your computer. In it there are millions of
    places, each with an address, where we and as programmers, can store things.


    ![](img/242aaa06c3a3208f16d97cdd92303648_43_0.png)


    Imagine the working memory contains a bunch of pigeonholes, like mailboxes in
    a post office. To use one of these storage places, here''s what we have to do:
    we need to reserve the spot and name it. Let''s pick one and give it a name—how
    about "Gus"? Then we can use Gus to hold a number, word or list. Suppose we want
    to use or change what''s in the mailbox. Since we have named the mailbox, we can
    tell the computer where to find it.


    So, how do we go about reserving and naming the storage spot? MicroWorlds has
    some built-in procedures and operators to assist us. Here is one:


    **Local** reserves and names a storage place. Let''s set up a test program to
    investigate using *local*.


    # Test program


    Open MicroWorlds, and then open a new project. You can name it **Test** and save
    it.


    Now we will make a little procedure to use to experiment with variables. We''ll
    call our first variable Var1. We want to reserve and name our variable (storage
    place) using *local*.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '| | | | | | |

    |---|---|---|---|---||

    | | | | | Var1 | |


    # Mailbox Named Var1


    Let''s make a procedure called TestVar, for test variables. Type the following
    procedure on the Procedures Page:

    to TestVar

    local "Var1; reserves and names a storage space


    +   - show "Var1;we want to print the value in the storage space

    end


    Var is just a command that prints the item out in the Command Center, so we can
    see what the computer is thinking.

    OK, so does it work? Test it by typing TestVar in the Command Center.

    Hmm, something does print there! But what is going on?


    Let''s set up a Start button. Make the button, label it Start, and on the Procedures
    Page add this:

    to Start

    Main

    end


    Also make a Main:

    to Main

    TestVar

    end


    Go back to your Graphics Page 1 and click on the Start button. In the Command
    Center you will see the computer print:

    Var1


    Oops! This procedure is the name of the variable (mailbox), not what is in the
    mailbox (a number).

    The built-in procedure local is a procedure with one input—the name of the variable,
    in this case Var1. Local tells MicroWorlds to reserve a spot in memory to store
    things in, and it tells MicroWorlds that we will name this spot Var1. The spot
    is a little mailbox with an address of Var1.

    As always, it helps to view the jigsaw puzzles, which show that local uses Var1
    for an input:'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Local "Var1"


    Now let''s look at the puzzle pieces for show:


    # Show "Var1"


    Show is also using Var1 for an input. Remember that the quote mark " before a
    word tells MicroWorlds that the word we are using is the name of something, a
    noun, rather than the name of a procedure, which is more like an an action word,
    or verb.


    Here is the procedure we are talking about, again:


    +   - to TestVar

    - local "Var1 ;reserves and names a storage place

    - show "Var1 ;we want to print the value in the storage place

    - end


    So, now we have created our variable using name local. But we haven''t stored
    any value in it. We need another procedure for that. Here it is, a bit of punctuation!
    ":" allows us to grab the value that is in a variable for us to use. We read this
    colon as "what"s in.


    I want to know what the value is inside the memory spot named Var1. But the line,
    show "Var1. is an instruction to put the word Var on the Command Center. This
    is not really what I meant!


    We will say show Var1, meaning show what''s in Var1. There is no space between
    the colon and the name after it.


    Change your TestVar procedure as follows:


    +   - to TestVar

    - local "Var1 ; reserves and names a storage place

    - show "Var1 ; show what''s in Var1

    - end


    and run your program. Here is the result I get:

    Var1 has no value in TestVar


    We''re getting there. We get an error message, telling us that we haven''t put
    a value into the storage space. When we look at our procedure we can see this
    is true, we made a storage space (a variable) but we didn''t tell MicroWorlds
    what to put in it. We goofed. It is a programming error to try to use a value
    from a variable if no name has ever been stored.


    So how do we put a value in the variable? We have one more procedure to learn.
    There is a built-in procedure make that does the job of storing values in named
    variables. It takes two inputs and no outputs. The first input is the name of
    the variable, and the second is the value to be stored. It looks like this:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/242aaa06c3a3208f16d97cdd92303648_46_0.png)


    Change your procedure to the following:


    ```

    to TestVar

    local :Var1 ;creates and names a variable

    make :Var1 20 ;puts the value 20 in the variable

    show :Var1 ;prints the value in the variable

    end

    ```


    ![](img/242aaa06c3a3208f16d97cdd92303648_46_1.png)


    Or, using our mailbox diagram,


    ![](img/242aaa06c3a3208f16d97cdd92303648_46_2.png)


    Lets take a look at what we have written in our TestVar procedure so far.


    We use local to make a variable named Var1


    We use make to put the value 20 in the variable.


    We use show to show :Var1, the value stored in Var1.


    I think it should all work this time! Before you run your program, so that your
    Command Center shows only the newest messages, add the cc instruction in Main,
    like this:


    ```

    to Main

    cc

    TestVar

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'This course just clears out the Command Center as you start your program each
    time. Now run your program.

    Bingo! The value stored is 20! Let''s put it in 20 and then replace it with 50,
    and see what happens.


    ```

    to TestVar

    local :Var1

    make "Var1 20

    show :Var1 ; this means show the value stored in Var1

    make :Var1 50

    show :Var1

    end

    ```


    Here''s what shows in my Command Center:


    +   20

    50


    Again, using our mailbox diagram,


    ![](img/242aaa06c3a3208f16d97cdd92303648_47_0.png)


    We replaced the value stored, and the first one is gone forever.

    What about storing a word instead of a number? Be sure to put a quote mark before
    the word. Try this:


    ```

    to TestVar

    local :Var1

    make "Var1 20

    show :Var1

    make :Var1 "Me"

    show :Var1

    end

    ```


    Pretty neat, eh!'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Let''s make another variable to play with.


    ```

    to TestVar

    local "Var1"

    make "Var1 20

    local "Var2"

    make "Var2 50

    show :Var1

    show :Var2

    end

    ```


    What does your command center look like? It should show 20, then 50. But in this
    case, there are two mailboxes!


    ![](img/242aaa06c3a3208f16d97cdd92303648_48_0.png)


    There is a built-in procedure that is easy to use, sum. It takes 2 inputs, both
    numbers, and has one output (the answer). If you wanted to add 2 and 3, you would
    write sum 2 3, since outputs come after the procedure name. The answer you can
    show, or store in a variable, or whatever.


    ![](img/242aaa06c3a3208f16d97cdd92303648_48_1.png)


    Try this:


    ```

    to TestVar

    local "Var1"

    make "Var1 20

    local "Var2"

    make "Var2 50

    show :Var1

    show :Var2

    show sum 20 15

    show sum :Var1 15

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'What''s that last line about? We are adding two numbers. One is the value stored
    in Var1, and the other is 15. Then we are printing the result. Your Command Center
    should say 20 50 35 35.


    It is an excellent exercise to draw the jigsaw puzzle form of a line of instruction,
    especially before you run it. It can really help you learn what''s going on. It
    is neat to see how the Logo procedures fit together with their inputs and outputs.


    Try adding these lines to TestVar. Remember, sum has two inputs. Can you tell
    what they are doing?


    ```

    show sum :Var1 :Var2

    show sum :Var1 15 30

    ```


    And of course, make up your own lines to experiment with.


    # Talk like Logo


    Another way to be sure you are understanding how a Logo instruction works is to
    "talk" your way through an instruction. I will do this one:


    ```

    show sum 20 15

    ```


    I am MicroWorlds Logo. I see the procedure show. This procedure tells me to take
    one input and put it on the Command Center. I need one input.


    +   - I see the procedure sum. It has an output that I can use to satisfy my need
    for an input.

    - first I need two inputs for sum before I can calculate the output.

    - The inputs for sum are the two numbers 20 and 15.

    - Now I have the output of sum, it is 35

    - So now I can satisfy the input to show. I will put 35 on the Command Center.


    Exercise:


    Write a procedure testSize (instead of testVar) that will do the following:


    Reserve and name a memory spot called size. Rewrite Testvar. Instead of Var1,
    create a variable size.


    Store the value of five in the spot.


    Instead of Var2, reserve and name a variable called height


    Take your height in inches, and store it in the variable height.


    Print the current value of size.


    Print the current value of height.


    Add 3 to the value of size and store the result in the same place, size.


    Print the current value of size.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# #10 Logo Animation Using Variables\n\nNow we will make use of our new knowledge\
    \ of variables. First, type in the following. Save under\na new name. It should\
    \ look like this:\n\n```\n====================\nto Main\nend\n====================\n\
    to square\n  repeat 4 [forward 50 right 90 wait 1]\nend\nto Start\n  Main\nend\n\
    ```\n\nNow it's time to add an action figure. I want you to add some lines to\
    \ Main so it looks like this:\n\n```\n====================\nto Main\n  cc\n  talkto\
    \ \"t1\"\n  setsh [horse1 horse2 horse3]\n  repeat 20 [square]\n====================\n\
    ```\n\nPut the horse1, horse2, and horse3 shapes into your Shape Center.\n\n#\
    \ Adding an input to our procedure\n\nA while back, I suggested that it would\
    \ be nice if we could decide how big a square our turtle\nshould make. Then we\
    \ would have a nice, general procedure that could be used anytime we want a\n\
    square any size. You won't believe how easy it is to make this improvement, now\
    \ that we\nunderstand variables.\n\nWe want to turn our procedure square, which\
    \ currently has no inputs and no outputs, into a\nprocedure that receives one\
    \ input. We do that simply by thinking of a good name for the input —nhow about\
    \ length?—and putting it on the line that declares the procedure. Since we are\
    \ passing the\nvalue in length, we will use :length. Make the following change\
    \ to square:"
  merge: -1
  img_proc: true
- pgno: 51
  md: 'to square :length

    repeat 4 [forward 50 right 90 wait 1]

    end


    We just used a shortcut! Instead of using the instruction local, we created the
    variable another way.

    We put the variable name in the first line of the procedure. This also takes a
    spot in memory and

    names it length so we can store a value in it.


    Again, using our mailbox diagram,


    ![](img/242aaa06c3a3208f16d97cdd92303648_51_0.png)


    The neat thing is that we don''t have to use make to put the value in. We pass
    the value to the

    square procedure when we call it. In other words, when we use the square procedure
    in Main, we

    eed to place an input next to it that will go into the mailbox. The code in Main
    needs to say, for

    example,


    square 5

    instead of


    square


    The 5 would go into the mailbox which is part of the procedure square. That mailbox
    is named

    length.


    Here''s an example of a procedure we already know that needs an input: forward.
    Whenever we

    type forward, we have to put a number after it for input. Somewhere, somebody
    has already

    written a procedure for forward, which starts with to and has a variable name
    in the first line. Now

    sour square procedure will be like that, requiring a input number.


    So square now needs one input. Its jigsaw piece looks like this:


    ![](img/242aaa06c3a3208f16d97cdd92303648_51_1.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'We need to change Main so that when it calls square, it satisfies square''s
    new need for an input. Let''s give it the number 30. So instead of typing square,
    we will type square 30.


    ```

    Main

    cc

    talkto "t1"

    setsh [horse1 horse2 horse3]

    repeat 20 [square 30]

    end

    ```


    Now you can try your program and you will find that it works, but it really isn''t
    any better than before. Our revised procedure square requires an input, and gets
    an input, but it doesn''t actually use it for anything!


    Let''s fix square so that it makes use of the variable length. We want the value
    stored in length to be used as the input to forward. Do you remember how? Take
    a minute to think about it.


    To get the value of a variable (the thing in mailbox), use a colon before the
    variable name. Change your square procedure as follows. The change is in italics:


    ```

    square :length

    repeat 4

    [forward :length right 90 wait 1]

    end

    ```


    Now, to find the input for forward, Logo must find the value stored in length.
    Where did that value come from? The value is stored there when Main calls the
    procedure square using a number.


    ![](img/242aaa06c3a3208f16d97cdd92303648_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Play with your new, more powerful square by changing this calling value in
    Main. Officially this value is called an "argument." (I don''t know why. I''m
    not mad, are you mad?) Inside the procedure the variable is called a parameter.


    You can also call square directly from the Command Center, for example by typing
    square 200 and pressing <Enter>.


    We have now created a very good procedure that we can use any time we want. Here
    is our finished program:


    ```

    ===========

    to Main

    cc

    talkto "t1"

    setsh [horse1 horse2 horse3]

    repeat 20 [square 30]

    end

    =============

    ```


    ```

    to square :length

    repeat 4

    [forward :length 90 wait 1]

    end

    ```


    ```

    to Start

    Main

    end

    ```


    Test it! Put in different values for the line in Main that calls square. Use square
    40 and square 60. Look over your Procedures Page and make sure it is free of errors
    and nice and neat. Then save your project.


    # Our house size can change!


    Our next task is to apply what we learned to the house we made. We are going to
    add the capability to re-size the house easily. In Main, we are going to change
    the lines that call the procedures, in order to add a number input. Then when
    we click the Start button, Main will draw a house that is as big as, or twice
    as big. If you think about it, you will see that this variable idea is very powerful.
    It is, a foundational idea for programming. And now you can do it too.


    Go to File Open Project and load your house file. Rename it, using "save as,"
    calling it "resize house"


    The first thing to do is take a procedure, say triangle. Let''s go through it
    and re-state all the numbers that are used for input to forward or back. You can
    replace each "forward" or "back" input number with a number times once. For example,
    forward 50 becomes forward 50 * 1. (Put the ones last. This prevents silly errors
    later.) Note that the computer-language sign for multiplication is a star, not
    an x, and that there are spaces between inputs.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Do NOT replace angles, namely the inputs for right, left, or seth. The angles
    stay the same if we make the house twice as big.


    Now we are going to replace all those ones with a variable (a spot that holds
    a value). Let’s call the variable trisize. To create and name the variable, we
    will add an argument to the first line of our triangle procedure, like this:


    to triangle :trisize


    Again, using our mailbox diagram,


    ![](img/242aaa06c3a3208f16d97cdd92303648_54_0.png)


    new mailbox for trisize


    Now we need to change the triangle procedure so that we are using the variable
    trisize instead of the number one.


    Can you guess how to do that? Let’s try this:


    +   - to triangle :trisize

    - draws a triangle

    - repeat 3 [forward 50 * :trisize right 120 wait 1]\n- end


    In the command center, type triangle 5. You are calling the procedure and passing
    it a value (argument). Did that work? Oops, it didn’t!


    We forgot! In the procedure, we need to tell the computer to get the value stored
    in trisize!


    +   - to triangle :trisize

    - draws a triangle

    - repeat 3 [forward 50 * :trisize right 120 wait 1]

    - end


    Now, in the same way, add a variable (you pick the name) to all the procedures
    except Main. First put the variable name, such as doorsize, in the procedure’s
    first line preceded by a colon: restart forward and back values as a number *
    1, and then replace the 1 with :doorsize (or whatever). Don’t use the same variable
    name in two different procedures. This could cause confusion for the computer.
    We want all our variables to be local—that is, we use the variable name only inside
    the procedure it creates.


    Test each procedure by typing the procedure name into the Command Center.'
  merge: -1
  img_proc: true
