- pgno: 102
  md: '# #18 The Wandering Turtle


    # Programming Technique


    Our next project is to build a procedure that makes the turtle wander aimlessly.


    ![](img/242aaa06c3a3208f16d97cdd92303648_102_0.png)


    # Decide on the Goal


    We want our turtle to wander aimlessly. Let''s have the procedure handle just
    one step in the turtle''s aimless wander, and be be called repeatedly. The procedure
    would slightly change the direction the turtle is going and then take one step
    in that direction. (Can you think of different plans for doing this?)


    # Sandbox to Acquire Necessary Knowledge


    In our case, we want the turtle to change its direction some random amount. We
    will tell it to go right or left by this random amount. Random means “unpredictable.”
    We need to learn more about this, so let''s test some ideas, and sandbox.


    In MicroWorlds, let''s start a new project and add our usual Start button and
    code, like this:


    ```

    ============================

    nto Main

    end

    ============================

    ============================

    to Start

    Main

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Go to the Help screen and look up random. Remember how? In MicroWorlds 2.0,
    just click on Help and Vocabulary. In EX, click on Help, then vocabulary, then
    on the Web page adjust the level from Basic to Advanced in the upper right, and
    choose the Vocabulary tab (allow the active content to get there if you need to).
    Now click on the letter R in the alphabet to the left.


    Reports a random non-negative integer (including 0) less than number. The maximum
    number is 9999.


    +   random number

    Reports a random non-negative integer less than number.

    Example:

    show random 100

    22


    Random is a procedure that has one input, a number, and one output, also a number.


    ![](img/242aaa06c3a3208f16d97cdd92303648_103_0.png)


    Random 100 generates a random number less than 100. Let''s investigate. Write
    the following code on your Procedures Page:


    ```

    to Main

    wander

    end

    nto Start

    Main

    end

    nto wander

    show random 100

    end

    ```


    Click on the Start button several times. We see random numbers, all less than
    100, displayed in the Control Center.


    In our wander procedure, we will want to change the direction of the turtle by
    a negative amount or a positive amount. Random, however, only outputs positive
    numbers. How can we make random give us numbers that are less than zero? Think
    about that one for a minute. Hint: we''ll need to do some subtracting.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "We need to do a little more sandboxing because we need some experience subtracting\
    \ one number from another. A look in the MicroWorlds Help index turns up **difference**.\
    \ Difference is a lot like sum. It requires two inputs and has one output. Its\
    \ output is the result of subtracting the second input from the first input. Here\
    \ is what the puzzle piece looks like.\n\n![](img/242aaa06c3a3208f16d97cdd92303648_104_0.png)\n\
    \nLet's sandbox with **difference**. Change your code to the following:\n\n```\n\
    to wander\n\t;show random 100\n  ;show difference 25 10\nend\n```\n\nNotice that\
    \ we put a “”; in front of the second line; this makes it a comment, not read\
    \ by the computer. This is called “commenting out” some code. Try different numbers\
    \ as inputs for **difference** until you are sure you understand **difference**.\n\
    \nNow, can you figure out how to make our procedure come up with random numbers,\
    \ *half of which are less than zero?* (Hint: Use **difference** to subtract something\
    \ from **random 100**, the random number less than 100.)\n\nDon't turn the page\
    \ until you think about it and try five solutions in the Command Center, using\
    \ **show**. Here's how it will look, with the _ under the number you will supply:\n\
    \n```\nshow difference random 100 _\n```"
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Here''s a solution: show difference random 100 50. Fifty is half of 100.


    We give random a number as input, 100. Random gives us an output number, say 76.
    We then subtract half the input number of 100 from the 76. Seventy-six minus 50
    is 26, the number that will print out.


    If the number random puts is less than 50, for example 30, then the number that
    prints out is 30 minus 50 equals -20, a negative number. So about half the time,
    we should be getting a negative number.


    Here''s the code for this solution:


    ```

    to wander

    show difference random 100 50

    end

    ```


    Do you have difficulty figuring out that line? When you “walk through” it, starting
    at the left, it is a bit easier. Just be sure to think of the outputs and inputs.


    +   show - takes one input

    difference - has one output; good, show needs that; takes two inputs

    random - has one output; good, that is one of the two needed by difference; needs
    one input

    100 - has one output; good, that is the one needed by random, so now random is
    happy

    50 - has one output; good. that is the other of the two needed by difference,
    so now

    difference is happy and it makes show happy .


    In other words, we are subtracting 50 from the output of random 100, and we are
    showing the result.


    We''ll be changing our turtle''s heading. There are several ways to do this, but
    here''s a simple one: how about a right turn? In the Help vocabulary, let''s look
    at the procedure right:


    +   right

    right (rt) number

    Turns the turtle to the right.

    Example:

    pd repeat 10 [fd 40 bk 20 rt 36]


    If right has a positive input, the turtle turns to the right. If it has a negative
    input, the turtle turns to the left. So, half the time we will have a negative
    number, and half the time the turtle will be turning left.


    # Write Pseudocode


    Now that we have acquired some necessary knowledge, it is time to write this up
    as pseudocode. It is what I want for the wander procedure:


    ```

    to wander

    ;change the turtle''s heading by a random amount

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: ';move forward a certain amount twice (so the shape changes)

    end


    Pseudocode does not have to go into great detail, but it should be clear. Pseudocode,
    try not to use real names of procedures or numbers. Pseudocode also makes good
    comments to keep in your real code

    you, or anyone else, can see at a glance what the procedure does. That''s why
    I put a semicolon, ";",

    in front of it to show that it isn''t real code. Typically, you would write the
    pseudocode sort of quick and rough as we just did and then revise it so it gets
    closer and closer to real code.


    First, let''s create and name a variable, stepSize, that will store the distance
    the turtle moves forward.

    to wander :stepSize


    So we call wander in Main, we use wander 5 to give it an input number, 5, that
    is stored away.

    The the computer sends the 5 to the variable stepSize in wander.


    ![](img/242aaa06c3a3208f16d97cdd92303648_106_0.png)


    In wander. wander :stepSize stores the 5 in stepSize

    to wander :stepSize

    ;change the turtle''s heading by a random amount

    ;move forward by stepSize, twice so the shape changes

    end


    There, that should be close enough that we can easily code it. Now let''s move
    on to the fun part.


    # Code


    Now, just do what our pseudocode tells us to do.


    ```

    to wander :stepSize

    ;change the turtle''s heading by a random amount


    move forward by stepSize, twice so the shape changes


    end

    ```'
  merge: -1
  img_proc: true
