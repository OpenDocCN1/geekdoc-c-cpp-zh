    We want our **walk** to be able to work with any shapes in any direction. That
    is why we wouldn''t add **seth 270** to the walk procedure itself. It also makes
    sense to put it before the **repeat**, because it would be inefficient to call
    it 200 times. I find the dog a little slow, so let''s try increasing the step
    size to 10. Change **Main** and run your program again.


