- pgno: 65
  md: '# Add a button


    Our jump procedure seems to work very well when we call it from Main. Now I want
    the character to jump when I push a button! And only when I push a button!


    First, let''s add a button. In the icon bar, click on the finger pushing the button
    and drag it to the page to make the button.


    A dialog box pops up giving the opportunity to type in the instruction that we
    want to run when the button is clicked. We could have different instructions and
    labels, but we won''t do that. I want the label to be jump, so type jump in all
    the blanks that you have.


    If you need to resize the button, drag an on the Graphics Page that includes all
    of the button, then release the mouse button. The button should then have four
    handles (little boxes) on it which allow you to resize it. Put the mouse over
    it, and push and hold the mouse down while moving the handle to a different place.
    This changes the size of the picture. You can also delete the button when handles
    are showing by pushing the delete button on the keyboard.


    Drag the jump down below the start button. Try clicking on the jump button. What
    response do you get? The program tries to run our jump procedure directly, bypassing
    Main.


    Hm, we get an error message. Our jump procedure requires an input. But where do
    we put the input? I really don''t want to go to the dialog box of the jump to
    change the arguments for every time I want to try something different. Here''s
    a solution—let''s change the name of the jump to something slightly different.
    Also, we want to change Main so that it no longer calls jump. Let''s change the
    name of our jump procedure to doJump and remove the call to jump from Main. Make
    your procedures page look like this. I am italicizing lines that are:


    ```

    to Main

    cg

    cc

    pu

    talkto "t1

    seth [dog1 dog2]

    seth 270

    repeat 200

    [walk 10 10 |

    ;get rid of the call to jump

    end

    ```


    ```

    to doJump :height ; change the name from jump to doJump

    seth 0

    forward :height

    wait 1

    back :height

    seth 270

    ```'
  merge: -1
  img_proc: true
