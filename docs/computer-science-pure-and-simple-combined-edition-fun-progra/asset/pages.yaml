    s some other turtle. Save your work by striking <ctrl> and s.


    We now have a complete program! Main tells the computer what to do first, then
    next, and so on.

    The procedures listed after Main tell the computer how to do the commands it doesn''t
    know

    already.


    The first instruction in Main tells MicroWorlds to clear the Command Center. This
    is so we know

    that any error messages we see are new ones. The next instruction in Main tells
    MicroWorlds which

    turtle should perform the actions in the following instructions. It is not necessary
    to have that

    instruction if there is only one turtle, but it improves the readability of our
    program, which is one of

    gours.


