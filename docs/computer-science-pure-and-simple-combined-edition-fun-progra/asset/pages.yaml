  md: 'animation, one shape would be tiny, another medium, another large. An explosion
    is a growing animation.


    ![](img/242aaa06c3a3208f16d97cdd92303648_28_0.png)


    # Animation Shapes by a Student


    After you have created a shape, you''ll notice a blank line beneath it where you
    can type in a name for it, for example pow1, pow2, or pow3. A name isn''t necessary,
    though. After you save it, pause your mouse arrow over it to see how it is numbered.
    You can use either a name or a number to refer to it in the command setsh.


