  img_proc: true
- pgno: 33
  md: 'Hmm. How much did it turn? It’s hard to tell. Obviously one degree isn’t much.
    Now, what if we tell it to repeat those same commands 45 times?


    Ninety? Enough times to go full circle? Experiment until your turtle is drawing
    a star. Remember repeat has two inputs: a number of times to repeat, and a list
    of commands to repeat. You have just learned that there are 360 degrees in a circle,
    and each degree is a tiny turn for the turtle.


    Now, about going through the turns to draw a figure. Let’s suppose YOU are a turtle,
    and the floor of the room you are in the screen. If you are facing straight ahead
    and then you turn yourself to face the right, you have turned 90 degrees.


    Choose three endpoints for a big equal-sided triangle on the floor (for example,
    a chair, the door jamb, and a table leg). Walk along one side of the triangle,
    and then turn yourself the required angle to get to the next side. Notice you
    have turned more than 90 degrees! In fact, you have turned 120 degrees. Go to
    the next corner. Turn 120 degrees. Walk to the next corner. Turn 120 degrees.
    You are now facing the same way you started, so you have turned a total of 360
    degrees, or full circle. You have done all the turns that a turtle would do if
    it were drawing an equilateral, or equilateral, triangle.


    Draw a triangle with a pencil on a piece of paper. Suppose that it is 50 turtle
    steps on a side. Write a set of instructions in English on a piece of paper that
    tells the turtle how far to walk and how far to'
