    end

    ```


    Try and let it run for a few minutes. First the dog correctly does its thing and
    then the skater does her thing. If you follow the lines in Main, this repeat procedure
    causes the program to run the following list of instructions [Walk 10 10] over
    and over and proceeds to the next line.


    But what we really want is for a process to be launched making the dog walk and
    then for the program to continue to the next line and launch another process to
    make the skater, at the same time. This can be done using the built-in procedure
    launch. Launch has as an input a list of instructions to run as a separate process.
    Change your Main as follows:'
