- pgno: 61
  md: "What is happening the dog is walking along, changing shapes once and then jumping.\
    \ In order to get it to walk more than it jumped we made thesize larger (100).\
    \ But this ruined the animation because I am not calling forward very often. What\
    \ I really want is for the dog to walk along many steps while changing, and to\
    \ jump. We need to revise our walk procedure so that we can control both the step\
    \ size and the quantity of steps. Let's add another parameter (variable) to our\
    \ walk procedure.\n\n```\nto walk :stepsize :qsteps\n  repeat :steps\n    [forward\
    \ :stepsize\n      wait 1|\nend\n```\n\nQsteps stands for quantity of steps. Now\
    \ we can easily control the size of each step and the quantity of steps with each\
    \ call to walk. Change Main to make use of this new power and try your program.\n\
    \n# to Main\n\n```\ncg\ncc\npu\ntalkto \"t1\"\nsetsh [dog1 dog2]\nseth 270\n \
    \ repeat 200\n    [walk 10 10\n      jump 10]\nend\n```\n\nThere, that's pretty\
    \ good! Change both inputs to walk. What happens? Change the input to jump. What\
    \ happens?\n\nThe method we used to develop these procedures should show you that\
    \ finished projects start out as finished projects. You need to try things, adapt\
    \ them to make them better and sometimes abandon them if you find a better way\
    \ to accomplish a task.\n\nWhen you see someone's finished project, don't forget\
    \ that all projects start out the same way, a blank page. It just takes time and\
    \ a large amount of perseverance to make them into masterpieces.\n\n# Save your\
    \ work\n\nBe sure to save your work as Walk.\n\nWe now have three movement procedures,\
    \ but we are not really using the square procedure at this point. So let's delete\
    \ it."
