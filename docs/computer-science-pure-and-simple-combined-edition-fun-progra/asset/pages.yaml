- pgno: 91
  md: 'to create several.


    We need a list because we want to create five variables. Let''s try this at the
    top of the madlibstest

    procedure:


    ```

    local [noun1 noun2 noun3 noun4 adj1 adv1]

    ```


    In fact, it is standard procedure in programming to create your variables at the
    top of the procedure,

    and then the rest of the coding. So let''s plan to do that.


    We need one more procedure that allows us to talk to the user. Let''s try announce.
    The Help menu

    tells us this:


    ```

    announce

    announce word-or-list

    ```


    Displays the message in an alert box. Clicking OK closes the box. See question
    and answer.

    So the input for announce can be a list of words in brackets. Let''s test this
    in the Command Center:

    announce [Here is your madlib.]


    Does it work? Let''s add these ideas to our madlibstest. We can use these new
    tools: question,

    print, sentence, local using a list of variables, and announce.


    ```

    To madlibstest

    local [noun1 noun2 verb3 adj4 noun5]

    question [Please type in an animal name.]

    make "noun1 answer

    announce [Here is your madlib.]

    print (sentence [One the day]: :noun1 [took a walk in the rain].

    end

    ```


    # Planning


    The next thing you need to do for our madlibs procedure is to write a simple story
    on a piece of

    or in a word processor. Underline five words that you will be erasing, but don''t
    choose verbs

    (action words). Verbs are too hard to get when asking input from the user. Separately,
    write

    down for each word. (Remember, the question needs to ask the user for a word of
    the

    type, not exactly the same word, or the madlib won''t end up being funny.) Keep
    the questions

    er. Next to each question, write down a good variable name for that underlined
    word, for

    example, noun1, noun2, noun3, adj1, adv1, and so on.


    # Pseudocode


    Pseudocode is just like program code except that it is written in English. It
    helps us make a quick

    and easy plan without worrying yet about getting details exactly right.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Go to the Procedures Page and type to madlibs, to begin your pseudocode. Put
    a semicolon at the beginning of the next line so we know it is pseudocode. First
    make pseudocode for creating and naming your variables. For example:


    +   - madlibs

    - ;create and name variables noun1, noun2, noun3, noun4, adj1, adv


    Your second line of pseudocode will ask the user a relevant question for the first
    missing word, such as "Describe a feeling" or "Give me an adverb, such as slowly,
    quickly, heavily, etc." Write that pseudocode, with semicolon. For example:


    +   - ;ask the user to type an animal name


    Your third line of pseudocode will take the word from the user and store it in
    the first variable. For example:


    +   - ;store the animal name in a variable named noun1


    Do the same two things—ask the user for a word and store it-- for the next variable
    and the next until you have five lines. Write these lines of pseudocode.


    Your next line of pseudocode will announce "Here is your madlib." Write this.


    Finally we have the story-writing section. Write pseudocode lines for printing
    your story into the text box, inserting the right variables in the right places.
    For example:


    +   - ;print "Once there was a noun1. One the noun1 went to the park and saw a
    noun2."


    Now, show your teacher. Your teacher can compare it with the pseudocode in the
    answer key and give you pointers.


    # 4. Code


    Translate your pseudocode into code, that is, into Logo. In other words, after
    each line of pseudocode with a ; in front of it, put a real line of code that
    says the same thing in Logo. Your code should be based on our latest version of
    madlibtest, earlier in this lesson. Look at madlibtest to figure out how to translate
    each line of pseudocode into code.


    # 5. Test


    Test your creation by typing madlibs in the Command Center. Then make a Main procedure
    that calls madlibs and a Start procedure that calls Main. Make a Start button.
    Does it work? Now you have a complete program. Check with the answers in the back
    of the book if you are having trouble.


    Exercise


    Make a second Madlib with a different story and different variables, totaling
    7 variables instead of 5.'
  merge: -1
  img_proc: true
- pgno: 93
