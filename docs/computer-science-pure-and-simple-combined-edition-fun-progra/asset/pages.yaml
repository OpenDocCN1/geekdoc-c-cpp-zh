  md: '# # #17 Review of Animation Using Variables


    Pull up your Square file, or type in the following:


    to Main


    end


    to square


    ```

    repeat 4 [forward 50 right 90 wait 1]

    end

    ```


    To Start


    Main


    end


    Now it''s time to add an action figure. I want you to add some lines to Main so
    it looks like this:


    to Main


    ```

    cc

    talkto "t1"

    setsh [horse1 horse2 horse3]

    repeat 20 [square]

    end

    ```


    If you have MicroWorlds EX, this won''t work until you install the shapes horse1,
    horse2, and horse3 into your Shapes Center, as shown on page viii of this book.


    This is a simple animation. It uses afresh (for set shape) and a list of turtle
    shapes. Now, every time the computer calls forward, it goes back to the shape
    list and picks the next shape. We have chosen shapes that are similar, but the
    legs are in different positions. Our square procedure calls to forward, and square
    is repeated, the computer keeps calling forward commands inside square and changing
    the shape according to the list. The result looks like a horse running. The shapes
    can be already given in MicroWorlds, or we can make them by clicking on a blank
    in the Shapes Center and using tools.


    # Adding an Input to Our Procedure


    It would be nice if we decide how big our turtle should make. Then we would have
    a nice, general procedure that could be used anytime we want a square of any size.
    You won''t believe how easy it is to make this improvement, now that we understand
    variables.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'We want to turn our procedure square, which currently has no inputs and no
    outputs, into a procedure that receives one input. We do simply by thinking of
    a good name for the storage spot for the input—how about length?—and putting it
    on the line that declares the procedure. We will use what''s in length, written
    :length. Make the following change to square:


    ```

    to square :length

    repeat 4 [forward 50 right 90 wait 1]

    end

    ```


    Again, using our mailbox diagram, we can see our variable.


    ![](img/242aaa06c3a3208f16d97cdd92303648_99_0.png)


    The neat thing is that we don''t have to use make to put the value in. We pass
    the value to the square procedure when we call it. In other words, when we use
    the square procedure, we need to place an input next to it that it will go into
    the mailbox. The code in Main needs to say, for example, square 30


    instead of just square.


    When the computer gets to square 30, right at that point, a 30 goes into the mailbox
    named length and waits to be used by the procedure square.


    So square now needs one input. Its jigsaw piece looks like this:


    ![](img/242aaa06c3a3208f16d97cdd92303648_99_1.png)


    Now we need to change Main. Instead of typing square, we will type square 30.


    ```

    to Main

    cc

    talkto "t1

    setsh [horse1 horse2 horse3]

    repeat 20 [square 30]

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Now you can try your program, and you will find that it works, but it really
    isn''t better than before. Our revised procedure square requires an input and
    gets an input, but it doesn''t actually use it for anything!


    Let''s fix square that it makes use of the variable length. We want the value
    stored in length to be used as the input to forward. Do you remember how? Take
    a minute to think about it.


    Instead of saying forward 50, we''ll say forward what''s in length. Instead of
    "what''s in," use a colon before the variable. Change your square procedure as
    follows:


    ```

    to square :length

    repeat 4

    [forward :length right 90 wait 1]

    end

    ```


    Now, to find input for forward, Logo must find the value stored in length. Where
    did that value come from? The value is stored there when Main calls the procedure
    square using a number.


    Play with your new, more powerful square by changing this calling value, currently
    30. Officially this value is called an argument. (I don''t know why. I''m not
    mad; are you mad?) Inside the procedure variable is called a parameter.


    You can also call square directly from the Command Center, for example by typing
    square 200 and now pressing Enter.


    We have now finished a very good procedure that we can use any time we want. Here
    is my finished program, complete with lines setting off Main from the rest of
    the program, and procedures in alphabetical order:


    ```

    to Main

    cc

    talkto "t1"

    setsh [horse1 horse2 horse3]

    repeat 20 [square 30]

    end

    ```


    ```

    to square :length

    repeat 4

    [forward :length right 90 wait 1]

    end

    ```


    ```

    to Start

    Main

    end

    ```


    # Exercises'
