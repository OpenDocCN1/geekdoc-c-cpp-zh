- pgno: 86
  md: '# #15 Madlibs


    We are going to work on a new project, a game called Madlibs. It will give us
    some more practice dealing with variables.


    We are going to follow a defined set of steps in programming this. They are:


    +   1. Decide on the goal.


    +   2. “Sandbox” to acquire necessary knowledge.


    +   3. Write pseudocode, which describes in English what we de want to do.


    +   4. Code.


    +   5. Test.


    +   6. Do it all again, that is, “enhance.”


    Probably you have played Madlibs before, not using a computer. First you write
    a story that has blanks in it. Then you interview someone, writing a down, the
    name of a vegetable, or whatever you need, using the person you are talking to
    as a random word generator. Then you put the words into your story. The result
    is pleasantly nonsensical, and you can both enjoy it.


    To do the project, we need to follow our programming steps!


    # 1. Decide on the goal


    In this step you need to think about exactly what you want the procedure to accomplish.
    There are always a few decisions to be made, and now is the time to make them.


    We will capture words from the user, save them, and then plug them into a story
    that prints out on the Graphics Page. We will use our knowledge of variables.
    We want to create a variable that will capture a word typed by the user. Then
    we will keep the words stored until time to use them. So we will need as many
    variables as there are blanks in the story. Here is our assignment:


    +   - Make a madlib using at least five variables.


    +   - Ask the user to use words to put in the variables.


    +   - Print out a story using the five variables into a text box.


    +   - Make a procedure called madlibs that works with a Main and a Start procedure.


    # 2. Sandbox to acquire necessary knowledge


    This step is a learning step. Here you look at your code and see if there are
    some aspects that you need to learn about before you write the code. If so, you
    write “sandbox” or “throw-away” code to teach yourself what you need to know.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'We need to know how accept words typed in by the user. Here is an example.
    Suppose we and name a variable called noun1. Open a new file. On your Procedures
    Page, start a new procedure called Madlistest. Then add a line to create a variable,
    noun1:


    +   - to madlistest

    - local "noun1"


    Here’s what we have created:


    | | | | | |

    |---|---|---|---||

    | | | ? | | |

    | Mailbox with Unknown Contents Noun |


    Now we type in this code:


    ```

    question [What is your favorite animal?]

    ```


    This procedure, question, asks the user a question and gives space for an answer.


    ```

    make noun1 answer

    ```


    The procedure answer outputs whatever the user just typed. The procedure make
    gives the variable noun1 the value of answer. Let’s say the user typed “worm.”
    At this point, the variable noun1 would contain “worm.”


    | | | | | |

    |---|---|---|---||

    | | | Worm Noun | | |

    | Mailbox with New Contents |


    Let’s see what’s going on. Your preliminary procedure looks like this:'
  merge: -1
  img_proc: true
- pgno: 88
  md: "to madlibstest\nlocal \"noun1\"\nquestion [Please type in an animal name.]\n\
    make \"noun1\" answer\nshow :noun1 ;this means what's in noun1\nend\n\nGo to the\
    \ Command Center and type madlibstest, to run the procedure. Type in an animal\
    \ name as requested. The computer show the animal name at the bottom of the screen?\
    \ It is supposed to.\n\nBut let's make a text box and print our output in that.\
    \ That way, we can use our game without using the Command Center. We would need\
    \ that if we posted it on the Web. To make a text box, click the icon with ABC\
    \ or just A in. Then click on the screen and size your text box to make it at\
    \ least half the size of the screen. You can click on the text box (then click\
    \ on edit in MicroWorlds EX) and tell it not to show the box name.\n\nTo print\
    \ into the text box, we use the command print, instead of show to print into the\
    \ Command Center.\n\nNow we need to check for print in the Help vocabulary. Here's\
    \ how.\n\nIn MicroWorlds 2.0, click on Help, and then on Vocabulary. A Web page\
    \ pops up. In the upper right corner, you can choose Basic or Advanced. We will\
    \ be needing Advanced, so choose that. Now choose the Vocabulary tab. Your Internet\
    \ Explorer may block this page because it contains ActiveX Programming, but it's\
    \ local to your computer, so click the popup blocker bar and allow the content.\
    \ Now that you are on the Vocabulary tab, you can choose a topic from the left-hand\
    \ menu to find the word you need, or you can click on the first letter in the\
    \ alphabet that shows. We can click on P and locate print. Both MicroWorlds EX\
    \ and 2.0 tell us something like this:\n\nprint word-or-list\n\nPrints a word\
    \ or list in the current text box. The text is followed by a carriage return and\
    \ line feed sequence. See insert.\n\nExample:\n\nGiven that there is a text box\
    \ containing some text on the page:\n\nprint [The End]\n\nThe suggested format\
    \ is print word-or-list. A word has a \" mark right before it. A list is enclosed\
    \ in [brackets]. So our input needs to have one or the other, \" mark or brackets.\
    \ Try these in the Command Center: \n\n+   - print \"hello\nprint [hello]\nprint\
    \ [[hello][Mom]]\n\nCan you get it to print \"Hello out there!\" ? Try it before\
    \ you turn the page."
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Our “Hello out there!” would look like this:


    ```

    print [Hello out there!]

    ```


    How do we get it to print out what''s in (:) a variable? On the Procedures Page,
    let''s try this:


    ```

    to test

    local :noun1

    make "noun1" "me"

    print [Hello :noun1]

    ```


    Type test in the Command Center, and press Enter. Oops! It printed “Hello :noun1”
    in the box! That''s not what we want! We want what''s in noun1!


    Let''s look at a procedure called sentence. Here''s what Help has to say about
    sentence:


    ```

    sentence (se) word-or-list1 word-or-list2

    (sentence word-or-list1 word-or-list2 word-or-list3...)

    ```


    Reports a list which is made up of its inputs (words or lists). Sentence can take
    more than 2 inputs when sentence and the inputs are enclosed in parentheses. See
    list.


    Examples:


    ```

    show sentence "a "b

    ab

    show (sentence "hi "there [Bill]")nhi there Bill

    ```


    This is telling us to use this format:


    ```

    print (sentence input1 input2 input3)

    ```


    Notice the parentheses that include the word sentence and all the inputs. Each
    of these inputs needs to be one of these:


    +   1. a word, with a " mark

    2. a list, using [brackets]

    3. “what''s in” a variable, for example :noun1


    I want you to look at these commands, and guess which ones should work. Then test
    them in a test procedure. To make them work, first type this into the procedure:


    ```

    to test

    local [animal age] ;these are two variables

    make "animal "cow

    ```'
  merge: -1
  img_proc: true
