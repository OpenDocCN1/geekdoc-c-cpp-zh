  md: '# #7 Logo Skyscraper Project 1


    Now it is time to draw the big skyscraper!


    If you have done your assignments, you have made a careful drawing of a skyscraper
    designed by you. You have a list of how to do it, in English. Now you need to
    translate to Logo.


    You already have the tools you need to do this, except for the concept of a row
    of windows. To make a row of windows, create a procedure called **windowrow**.
    In it, use the **repeat** command to repeatedly draw a window plus the space between
    it and the next window. For instance, **window and window** could look like this:


    ```

    to window

    set 0

    pd

    repeat 4 [forward 5 right 90]

    end

    ```


    ```

    to windowrow

    repeat 15 [pd window seth 90 pu forward 10]

    end

    ```


    Start a new file for this project. You can name it MyBuilding. Write your main
    procedure first. This will serve as a list of procedures that you will create,
    for example:


    ```

    to Main

    cg

    movedown

    outline

    move1

    door

    move2

    windowrow

    end

    ```


    Now you need to write the first of these procedures and test it. You can do this
    in the Command Center, where you can watch the turtle moving as you type in commands.
    First create a set of commands that draws your outline. Then highlight them, **copy**
    them using the **edit** menu, and **paste** them on the Procedures Page. Add a
    procedure name, "to," and "end."


    For example, your **outline** procedure in the Command Center might look like
    this:'
  merge: -1
