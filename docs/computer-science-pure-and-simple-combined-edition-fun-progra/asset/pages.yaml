- pgno: 11
  md: '# #1 Logo Procedures and Input


    What will I learn?


    Logo is a programming language. To learn it we will use MicroWorlds, a computer
    application that you purchase separately from MicroWorlds. The Logo lessons in
    this book are intended to teach individual students in grades 5-12 the basics
    of computer use and programming. We will teach you some basic computer skills.
    We will also teach you how and to write programs that will work properly and can
    be improved on time goes by. This will give you a solid foundation in programming
    techniques so you can develop programs in any language.


    What computer language?


    There are many different programming languages, just like there are many human
    languages. Human languages have all verbs, nouns and adjectives. Programming languages
    too have similar elements, like procedures and variables. It is these building
    blocks that are basic to computer programming in any language that it is important
    to learn. Once you learn one computer language, it is much easier to learn the
    next and the next.


    I chose Logo because it allows me to teach you to build programs that are fun
    and complete in a short time.


    Just like human languages can be spoken with different accents, so it is with
    computer languages. The version of Logo that I use in these lessons is from a
    commercial product named MicroWorlds from Logo Systems Inc.


    Where are we headed?


    We will learn techniques that will allow you to draw your own interesting scenes
    and add lots of movement and animation. Later in the book we will make several
    games.


    What is a program?


    A program is a list of instructions to the computer. Let''s suppose we are going
    to give someone a list of simple instructions in English on how to set the table.
    This list of instructions might look like this:


    +   - get a plate from the cupboard

    - walk to the table

    - put it on the table

    - return to the cupboard

    - get a glass

    - and so on.


    But a set of instructions for a computer is written using a specific list of words
    that the computer can understand. For example, forward 50 means go forward 50
    turtle paces. This action words for the computer are procedures.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'What''s turtle, you? It''s our little drawing partner on the screen. We pretend
    that it is carrying a pen that it can draw down, and pick up, to move around without
    drawing. It can wear various suits of clothes—it can look like a horse, a dog,
    even a house or a pond. The nice thing about it is that it obeys every command,
    so long as we use words it can understand.


    So, if a program is a list of instructions to the computer and an instruction
    is a list of procedures and MicroWorlds already knows piles of procedures, we
    must be ready to write a program!


    # Instructions and procedures


    We need to begin by locating our turtle. With MicroWorlds EX, we first choose
    “free mode.” When the drawing appears, we have to hatch a turtle by clicking on
    the hatching icon at the top . Then click on the screen, and you have a turtle.


    Now, let''s start with an instruction.


    In the Command Center (the area at the bottom of the screen), type this:


    ```

    pd forward 50

    ```


    Pd is for pen down. We are telling the turtle to put its pen down and move forward
    50 turtle steps. Now we press <enter>.


    The turtle obeyed! It sent 50 turtle steps forward—in the direction it was facing.
    We need to learn a new word, input. This is the number 50 in our case. The input
    is the number that the procedure forward needs to have. (Some procedures also
    have outputs: they give you a number.)


    In the Command Center, type the following line:


    ```

    pd forward 50 90 forward 50 90 forward 50 90 forward 50 90

    ```


    When the cursor is at the very end, press presto! Our first instruction causes
    the turtle to draw a square.


    Let''s analyze one long line of instruction. All the words you see on the line
    are names of procedures:


    +   pd: a procedure that puts the current turtle''s pen down and requires no inputs
    and has no outputs


    +   forward: a procedure that moves the current turtle in the direction its head
    is pointing by a certain number of steps. The number is a required input.


    +   right: a procedure that turns the current turtle to the right by a number
    of degrees. The number is a required input.


    The last two procedures require a number as their input. One very important thing
    to notice is some procedures require inputs and some don''t.


    # Procedure inputs and output


    Logo procedures can be thought of as jigsaw puzzle pieces. Our job as programmers
    is to build puzzles that fit together properly. The procedures that we will build,
    and the built-in procedures'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'that come with MicroWorlds, have a specified number of inputs. It can be zero
    inputs (such as **pd**) or one input (such as **forward**) or more. A procedure
    can also have zero outputs (such as **forward**) or one output (such as **sum**).


    A procedure that has no inputs is simply a square jigsaw puzzle piece. One that
    needs input has a hole on the right for a tab. The output puzzle piece next to
    it has a tab sticking out on the left. So they fit together. When we use procedures
    in an instruction we must provide the required inputs and we provide a place for
    the outputs to go, in order for the whole instruction to be correct. Think of
    it as a one-line jigsaw puzzle.


    Here is a procedure with one input:


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_0.png)


    As you can see, **forward** has a hole that needs a number input.


    Procedures that expect one number as their input will have the right size opening
    to fit a number. The starting edge of a line of instruction must be solid, that
    is no output sticking out, and so must have the ending edge.


    Here are some instructions. Try to guess which ones will work and which ones won''t.


    Type them into the Command Center to test your guess.


    Instruction 1


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_1.png)


    Instruction 2


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_2.png)


    Instruction 3


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_3.png)


    Instruction 4


    ![](img/242aaa06c3a3208f16d97cdd92303648_13_4.png)


    12'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'It''s pretty easy to get the inputs and outputs all lined up and in the right
    order once you pretend the procedures are jigsaw pieces and the instruction must
    be a completed puzzle!


    If an instruction is going to work, then all the openings and tabs must be used.
    Note that this means an instruction can''t begin with an output.


    # Programming with style


    A computer program has achieve more than just doing the job. It needs to have
    staying power—meaning that it needs to be easily understood and changed by others.
    Here are some goals to keep in mind when writing a program:


    +   1. Set up the plan of attack ahead of time.

    2. Use small, one-purpose-only procedures whenever possible. This makes it easy
    for someone to change the program later.

    3. Document your work so the next person can understand it.

    4. The code must work every time for everyone.

    5. Choose consistent, sensible names for procedures.


    # Where to write your program?


    First, let''s talk about where *not* to write your program. If you right-click
    on a turtle or follow the tutorials supplied with MicroWorlds EX, you find a dialog
    box or "backpack" which allows you to enter your instructions for the turtle.
    This is NOT a good idea! Goal number 2 says that the program must be easily read.
    How can it be read if instructions are scattered all over the place with individual
    turtles? The dialog boxes are associated with the controls such as turtles and
    buttons are not where you want to hide your beautifully crafted code.


    What you want is the Procedures Page. How do you find it?


    The Procedures Page or window is to the right alongside the Graphics Page, provided
    the Procedures tab beneath it is selected. The Command Center is to the bottom
    left.


    ![](img/242aaa06c3a3208f16d97cdd92303648_14_0.png)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# MicroWorlds EX main screen


    # Write a procedure


    Okay, remember we have an instruction that makes the turtle draw a box. Here it
    is again:


    ```

    pd forward 50 right 90 forward 50 right 90 forward 50 right 90 forward 50 right
    90

    ```


    Our beginning project is to develop procedures that make the turtle move in a
    variety of ways. If we left off the instruction pd (pen down), then we would have
    an instruction to make the turtle move in a square. Let us make our first procedure.


    You can teach MicroWorlds new words by writing procedures. Remember our instructions
    are for setting the table? Let''s write a "procedure" for.


    +   - SetTheTable

    - get a plate from the cupboard

    - walk to the table

    - put it on the table

    - return to the cupboard

    - get a glass

    - and so on


    Notice the procedure begins with to and finishes with end. Also, its name, SetTheTable,
    has no spaces. These are Logo language requirements. In this "procedure,"you are
    giving the person you are teaching a list of instructions using words that she
    knows. You are, in a way, teaching her a new phrase,"set the table."


    Now we are going to write a set of detailed instructions for MicroWorlds to draw
    a square. This is the essence of programming, namely adding new procedures and
    capabilities to the existing ones that came with the language.


    What shall we call our new procedure? How about square. Then, when we want the
    turtle to move in the shape of a square, we can just type square in the Command
    Center, instead of that long instruction developed above.


    On the Procedures Page, type the following:


    ```

    to square

    pd forward 50 right 90 forward 50 right 90 forward 50 right 90 forward 50 right
    90 end

    ```'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'All procedures start with the word **to** and end with the word **end**. A
    procedure like this adds a new word to MicroWorlds vocabulary. It uses **pd**,
    which puts the turtle’s “pen” down, **forward 50**, which moves the turtle 50
    “steps” in the direction it is facing, and **right 90**, which turns the turtle
    by 90 degrees, or a right turn. Let’s try it out! Move over to the Graphics Page.
    Hatch a turtle and push **<Enter>** in the Command Center if you need to clear
    old messages. Then type square and press **<Enter>**.


    Hmm, **square** didn''t work very well. The problem is that the turtle went so
    fast, you couldn''t see it.


    It is very common that things don''t work right the first time. It is not a failure,
    it just means we can tweak our procedure to make it better!


    Before we solve the movement down, there is another problem with our **square**
    procedure. As it is now, it is not really readable. Let’s write the same long
    instruction over several lines, making it much more readable. We can do that on
    the Procedure Page. It''s just not as easy as in the Command Center. MicroWorlds
    Logo ignores the fact that the instruction is spread over many lines. MicroWorlds
    Logo is really just interested in whether the inputs and outputs are all satisfied.

    Change your procedure so it looks like this:


    ```

    square

    pd

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    forward 50 right 90

    end

    ```


    There, that is much more readable and you can see at a glance how it works. Notice
    that our procedure **square** takes no inputs and has no output, so its puzzle
    piece looks like this:


    ![](img/242aaa06c3a3208f16d97cdd92303648_16_0.png)


    It is a "satisfied" instruction all by itself.

    Now back to improving our first procedure. To slow the movement of the turtle,
    let''s add a built-in procedure, **wait**, after each turn the turtle makes. **Wait**
    takes one input, a number. Change your procedure so it looks like this:


    ```

    square

    pd

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    end

    ```'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Go to the Graphics Page we''ll give it a try! We type square in the Command
    Center.


    Does it work? Here are some general troubleshooting hints: be sure each procedure
    begins with and ends with end. Make sure you typed exactly matches we are telling
    you to type.


    Hey, that''s much better. On the line of the square procedure, you see that wait
    1 is there, even though the movement of the turtle is finished. We could remove
    this wait 1 but there is little to gain, and later we may want to use this procedure
    to make the turtle move round and round the square times. In that case the wait
    1 will make the movement even.


    Let''s add a comment to tell any future readers know what this procedure does
    (Goal 3). We''ll make a second line like this:


    ```

    square

    ;draws a square of 50 units

    pd

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    end

    ```


    The semicolon at the beginning of the line tells the computer not to try to read
    that line. So this is how we write comments to others, to say what is going on,
    and comments to ourselves, so that later on we will easily remember what we did.


    Now we have a procedure to be proud of, but we still don''t have a program.


    So that you can continue with this project at another time, please save your work
    as Starter. Put it in the folder called My Documents, or make a new folder for
    your work.


    Show your teacher that you have saved your work and that it draws a square.


    Assignment 1: Write a set of instructions with at least eight lines to describe
    all the steps, in order, for doing a chore that you do regularly.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # #2 A Simple Logo Program


    Log in your work


    From the file menu, open your project named Starter. We will make some changes
    to this file, and we want to keep an unchanged version. So we need a copy.. From
    the File menu select **Save As** and save your project with a different name,
    say Square.


    Let''s talk for a minute about what is going on when you save a file. The computer
    filing system is like a filing cabinet, in a way. Think of a file as being like
    a piece of paper with writing on it. You can save number of these files in a "folder."
    Think of a "folder" as being like a manila folder. You can put many manila folders
    in another manila folder.


    There are big file drawers, which hold all the folders and folders inside folders.
    This is called C: This is your hard drive, which remains permanently inside your
    computer. This is your biggest storage area, with a folder for each user that
    contains a folder called My Documents or Documents. You may have a portable flash
    drive; this would be E: F: or G: And there is the D: drive, which is CD-ROM drive.


    While we''re talking about it, there''s the computer "desktop." This is supposed
    to pretend to be your real desk, with file folders sitting out ready for you to
    pick up and work with.


    In your copy of the file Square, find your Procedures page. It should look like
    this:


    ```

    square

    draws a square of 50 units

    pd

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    forward 50 right 90 wait 1

    end

    ```


    # Making a simple program


    The Command Center makes a perfect place to test instructions and procedures.
    But it is not a very user-friendly place from which to launch a program. Also,
    later when we stand-alone programs to run on a Web page, the Command Center doesn''t
    show. So we need to learn to do without it.


    Our Graphics Page is the page where the turtle draws squares for us. We need a
    clickable button right on our Graphics Page. Remember how to get there? In MicroWorlds
    EX, the Graphics Page is


    right in front of us all the time, upper left. To make the button, click the button
    icon and then click on the Graphics Page where you want the button to be. A dialog
    box pops up. Looking at it you can see that we are allowed to type in an instruction
    to run when someone clicks on the button.


    We want to wire this button so it starts our program.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'In MicroWorlds EX, we can give the button a label and an instruction. As a
    rule, let''s make these the same thing. Put Start in both places, where it says
    "nothing" in the picture above.


    Click OK. Then drag the button so it is nice and tight in the bottom left corner
    of the Graphics Page.


    I suggest you save your work often. On a PC, if you press the two keys Ctrl and
    S together, you will have the revised project under the name you just gave, Square.


    Now click on the Start button. We get the error message "I don''t know how to
    Start." This is exactly what we are going to teach MicroWorlds now! How are we
    going to teach it? You guessed it, we will create a procedure Start.


    Go back to the Procedures Page. Remember how? Now, to add the word Start to MicroWorlds''
    vocabulary, we need to make a Start procedure.


    First I would like to comment on program design. Remember these lessons are to
    teach you good programming techniques. They are not just to teach you about MicroWorlds
    or Logo. The computer language C is a favorite professional language, and so is
    C++. Both of these languages, in particular C++, have been designed to help programmers
    manage the complexity of computer programs. Both of these languages start every
    program''s execution at a procedure named Main. This means that the first procedure
    to run is always called Main. If you are reading a program in C or C++, you would
    typically start by looking for the procedure named Main. I feel it is a very good
    convention to follow.


