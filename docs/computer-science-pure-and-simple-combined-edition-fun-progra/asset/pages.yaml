- pgno: 113
  md: 'repeat [forward :stepSize wait 1]

    end


    # Code—Again


    Now we can write the code, then test it again.

    Let’s build it step by step. One way to do it involves creating another local
    variable (a variable used just in this procedure) to store the number that is
    half of what''s in dizziness. Remember how to create and name a variable? We use
    local, like this:


    ```

    local "halfdizziness"

    ```


    Then we need to put into that variable half of what''s in dizziness, or :dizziness.
    How do we get half of what''s in dizziness?


    ```

    quotient :dizziness 2

    ```


    That looks like this using puzzle pieces:


    ![](img/242aaa06c3a3208f16d97cdd92303648_113_0.png)


    You see that quotient needs two inputs, one from what''s in dizziness, and one
    is the number 2. It has one output, namely what''s in dizziness divided by two.


    Now, let''s put that quotient into the variable halfDizziness, using make:


    ```

    make "halfDizziness quotient :dizziness 2

    ```


    Now, all we have to go back to our original code and substitute what''s in dizziness
    and what''s in halfDizziness for 100 and 50. We have:


    ```

    right difference random 100 50

    ```


    Now we have:


    ```

    right difference random :dizziness :halfDizziness

    ```


    So our code looks like now. We are underlining the changes.


    ```

    to wander :stepSize :dizziness

    pd

    local "halfDizziness"

    ```'
