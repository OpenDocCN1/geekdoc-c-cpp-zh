    Right-click on a color in the spectrum, for example gray. A little button comes
    up that says “edit.” Click on that button, and the color dialog box shown above
    appears.


    You see that you can put an instruction inside this dialog box that the computer
    will run when a turtle touches the gray color. It goes next to the word “turtle”
