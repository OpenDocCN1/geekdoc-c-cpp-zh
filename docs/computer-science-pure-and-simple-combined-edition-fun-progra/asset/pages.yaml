    Graphics Page screen is

    a series of menus, in the upper left. In MicroWorlds 2.0, select Gadgets, and

    under it, Presentation Mode. In MicroWorlds EX, look up the View menu and choose

    Presentation Mode. Your screen changes. (To get out of Presentation Mode, click
    on the block

