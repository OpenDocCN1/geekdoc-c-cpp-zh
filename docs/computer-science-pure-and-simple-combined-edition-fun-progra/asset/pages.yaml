- pgno: 145
  md: '# #24 Get Ready, Get Set for Race


    Race is a two-person geography game. Two vehicles are racing in a geographic setting
    of some kind—the Sahara desert, the moon, Los Angeles, whatever. To move his vehicle,
    the player has to answer a question correctly.


    We will pull in an image of the setting for the background. Vehicle 1 will go
    1/4 of the way across the screen every time player 1 correctly answers a question
    concerning the scene in the background, and the same for vehicle 2 and player
    2. The questions alternate between player 1 and layer 2. The vehicles can be cars
    for Los Angeles, rockets for the moon, or whatever seems appropriate for other
    scenes. When someone gets to the finish line, a third vehicle has been hidden
    itself and does a little animation. Of course the object is to get there first!


    Construction involves several steps. We will do the preparation part.


    First, you need a background picture. Select a background from the MicroWorlds
    2.0 disk, or you can pull an image from the Internet. Here''s how you do it. Here''s
    how to find a picture that is free, that is, the copyright owner has designated
    as no charge for you to use. You can check out www.picturesfree.org. Or go to
    www.google.com and set it to safe search. Do this by clicking on "preferences"
    on the right side, and then choosing SafeSearch Filtering. Choose "use strict
    filtering." Note you have to do every time you re-open your browser; the preference
    isn''t saved for now.


    Now that you can safely see Google images, go back to the Google web page and
    click on the word "images" just above the blank line. In the images search, type
    in "free" and a keyword for what you want to find. If we are looking for the Arizona
    desert, you could type in "free desert arizona" and see what we get. Once you
    find a picture you like, and where the owner clearly said you can use it free
    on the Internet (not just your desktop), go to the file menu and download As to
    your computer. Save it as a .gif or .bmp. Then open your MicroWorlds file and
    go to the File menu, then import. Find the picture for your project. If the picture
    is the wrong size, you will have to re-size it using photo editing software such
    as Microsoft Picture It. If this sounds like too much trouble, use the drawing
    tools to draw a background. One student in our class "drew" Antarctica, which
    is mostly white, with a few ice floes and so. His racers were penguins. Use your
    imagination!


    Next, create two turtles using the drawing center and some turtle shapes. Give
    them simple names. They can look like race cars, jackrbits, or whatever matches
    your background. Make them similar in contrasting colors.


    Now, write eight easy questions in a word processor. They should have one- or
    two-word answers that concern the place you picture. Check your spelling and save.
    You will copy and paste them into your code short.


    Finally, consider how you are to tackling this problem. Make a draft of a flow
    chart showing the steps you think we''ll need. Use a block for a question, and
    a decision diamond for what to do with the answer. Indicate that this question-answer
    repeats four times for each user. Show this to your teacher.'
  merge: -1
  img_proc: true
