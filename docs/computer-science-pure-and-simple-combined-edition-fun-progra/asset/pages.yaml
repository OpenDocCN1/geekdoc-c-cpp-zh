- pgno: 187
  md: '# Some Built-In Procedures (see Index for more):


    cc clear the Command Center.


    cg clears graphics.


    pd puts the current turtle''s pen down and requires no inputs and has no outputs.


    forward or fd moves the current turtle in the direction its head is pointing by
    a number of steps. The number of steps is a required input. (back does the opposite).


    right turns the current turtle to the right by a number of degrees. The number
    is a required input. (left does the opposite.)


    wait takes one input, a number.


    repeat requires two inputs: a number indicating how many repetitions, and a list
    of instructions to repeat. A list has brackets [ ] around it.


    Presentation Mode: to the Gadgets menu and click on Presentation Mode. Then click
    the Start Button. To get out of Presentation Mode, click on the black part of
    the screen outside of MicroWorlds.


    talkto ''tl'' works with turtle named tl.


    set color, takes a number input, sets the color the turtle is drawing.


    random takes a number input, randomly produces a number less than the input.


    set random 100 will generate a random new color every time it is repeated.


    fill fills the area is with the color the turtle is set to.


    seth heading, sets the direction the turtle will move. Takes a number input. 0
    is up, to the right, -90 or 270 is to the left, 180 is down. Example: set 90.


    setsh, set shape, requires an input which is either a word (must be the name of
    a shape, such as setsh ''horse1'') or a list of words (must be a list of names
    of shapes). It changes the shape of the turtle. Point to a particular turtle first
    using talkto. If you give a list of shapes, the program will will a new shape
    from the list every time it calls forward or back.


    local reserves and names a storage place.


    make puts a value in.


    show takes one input, a word or a list, and prints it on the Command Center.


    : is read, "the value that is in" the storage place or variable.


    ycor has as output the Ycoordinate (height on the screen) of the turtle.


    xcor has as output the x coordinate (distance from the left side) of the turtle.


    sety takes a number as an input and sets the y coordinate.


    setx takes a number as input and sets the x coordinate.


    launch has as an input a list of instructions [using brackets like this] to run
    as a separate process.'
  merge: -1
  img_proc: true
