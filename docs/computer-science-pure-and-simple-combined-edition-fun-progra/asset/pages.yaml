- pgno: 78
  md: '![](img/242aaa06c3a3208f16d97cdd92303648_78_0.png)


    The color gray is an an object, as a turtle. An object has properties. In the
    real world, objects have properties. For example, if I jump on a trampoline, I
    bounce back. This is a property of a trampoline, not a sidewalk. In cyberworld,
    colors can have properties. If a turtle hits a color, it activates a procedure
    that you choose: bouncing back is certainly a possibility. We haven''t written
    the procedure yet, but we will fill in the property in the dialog box anyway.
    In the white area next to Turtle: type colorGrayHit and click on OK. We will write
    this procedure in a second.


    While you are in the Drawing Center and the gray color is selected, click on the
    spray and spray a good solid gray splash of color on the Graphics Page. Then go
    back to the Command Center. Make sure it is the same gray that you chose, no lighter
    or darker. Check the color numbers to make sure they are the same.


    # ColorGrayHit


    Go to the Procedures page, and we will program the gray color. We want it to call
    doJump. Write the procedure colorGrayHit as follows:


    ```

    colorGrayHit

    dojoJump 50

    end

    ```


    Now go back to the Graphics Page and click on the Start. Make sure your dog hits
    the gray splotch. Isn''t that? My little dog jumps up and down a few times in
    the gray and continues on its way. If it isn''t working, add more gray. You can
    do this by spraying more gray, or drawing a fat gray line, in the dog''s path
    of course. If it isn''t working, make sure you are spraying the exact same color
    as you programmed.


    # Jump a pond


    Let''s put a pond for the dog to jump over. You do this by hatching another turtle
    and placing it where you want the pond. If you have MicroWorlds EX, you will need
    to install the pond from the single-shape window into the Shape Center now. In
    the illustration below, you see the pond at the bottom left of the image. Just
    drag it over onto an empty dot in the Shape Center.


    77'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/242aaa06c3a3208f16d97cdd92303648_79_0.png)


    You can now go to your Shape Center, click on the pond, then move to the Graphics
    Page and click / on the turtle. Here is the center of my screen now.


    ![](img/242aaa06c3a3208f16d97cdd92303648_79_1.png)


    Try the program. For me, the results are pretty good, but we have two problems
    to fix. One is that would be much better if the dog jumped forward, and with one
    jump cleared the pond. The other problem, which wouldn''t be as noticeable as
    we fixed Problem 1, is that the dog disappears behind the pond. It would look
    better if the dog were in front of the pond. Let''s fix the second problem first.


    # Who''s on first?


    In MicroWorlds, the most recently hatched turtle goes in front of any other turtles.
    Also the turtles are automatically named t1, t2 and so on. In our case, this is
    not the order we want. The only way I know of changing this is to just accept
    it and change turtles. In other words, we will make our dog t2 and our pond t1.
    To see what a particular turtle''s name is, right-click on the turtle.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'On the Graphics Page, drag the t2/pond out of the way and drag the t1/dog into
    the middle of the gray splotch. This should now make the Shape Center and be the
    pond is selected. Click on the first turtle, t1, look like the pond.


    Our animation code will take care of making t2 look like a dog, if we change the
    code. Go to the Procedures Page. We need to change our talkto line so that we
    are now talking to t2. Change Main as shown:


    +   to Main

    cc

    talkto "t2"

    setsh [dog1 dog2]

    seth 270

    repeat 200

    [Walk 10 10]

    end


    Give the program a try. There, that solves Problem 2. What do you think would
    be the way to solve Problem 1?


    # Go the distance


    I think we need to change our procedure doJump or to make a different procedure
    that both jumps up and forward. I like the first option of revising our existing
    procedure doJump and making it more flexible. We will try to make it so that it
    can be used both to jump up and down and jump over something.


    To jump over an object, the turtle needs to move up and also move forward a certain
    amount. We need a second input to doJump so we can control how far forward the
    turtle should move while it is jumping. Let''s think like:


    +   We will need two variables or mailboxes to store two values, height and a
    new one—how about distance?

    We''ll set up a local variable, originalY, to hold the original y coordinate value.

    We''ll put the original y coordinate in there.

    Now we''ll set y to a new number, the sum of the old one and the value in height.
    We will wait a second.

    Now we need to move forward to clear the pond. How about going forward by the
    amount stored in the variable/mailbox distance? Then wait a second.

    Then set the y coordinate back to the original value.


    Can you set up Logo code to match this line of reasoning? Try it. Then turn the
    page to mine, and see if yours is different.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Here is my doJump : : :


    ```

    to doJump :height :distance

    local "originalY"

    make "originalY" ycor

    sety sum ycor :height

    wait 1

    forward :distance

    wait 1

    sety :originalY

    end

    ```


    We also need to change where we call doJump. to reflect two variables instead
    of one.


    ```

    to colorGrayHit

    doJump 50 100

    end

    ```


    It works! Finally we have a little procedure that can be used to make turtles
    jump over things.


    You will notice that your jump button doesn''t work any more. To fix that, have
    it call doJump using two variables instead of one. How about this?


    ```

    to jump

    doJump 30 30

    end

    ```


    # Launching skaters


    Before I end this lesson, let''s have a little fun. Hatch another turtle and put
    it at the same distance out the screen as your gray splotch. This turtle is automatically
    named "t3." You can check this by right-clicking on it.


    I would like to use the skater shapes-- skater1, skater2 and skater3--at the same
    time as the dog. If you have MicroWorlds EX, go ahead and install the skater shapes.
    How about if we modify the end of Main to add a section that says to t3, set shape
    to skater1, skater2, and skater3, and use the walk procedure to make it skate?


    Program this on your own before turning the page. But don''t spend too much time
    on it because there is a bit of information that we have not talked about yet.


    (Which way did your skater go the first time you tried your solution?)'
  merge: -1
  img_proc: true
