- pgno: 149
  md: 'If the user gives the right answer, we can write:


    ```

    if (answer = "Mount Vernon") [talkto t1 forward 170]

    ```


    Notice the vertical lines around and quote mark before the two-word answer. If
    the answer is only one word, you can just use a quote mark before the word, like
    this:


    ```

    if (answer = "Vernon") [talkto t1 forward 170]

    ```


    Let''s work in this other case, where the answer is not equal to Mount Vernon.
    Can you figure out what to write?


    ```

    ifelse (answer = "Mount Vernon") [talkto t1 forward 130] [announce Oops! The right
    answer was Mount Vernon.]

    ```


    For the questions, copy and paste from the list of questions you made already.
    Address the right user in your question, too like this:


    question Player 1, What is the name of George Washington''s home?


    We also need to make sure the racers cross the screen all the way to the finish
    line, if they get the answers right. There are two ways to do it:


    +   1. The harder way: using show pos, check the coordinates of the start point
    and the end point. To do this, put t1 at the start point, go to the Command Center,
    type talkto t1 show pos, and move t1 to the finish line and type show pos in the
    Command Center. Write down those coordinates. The first number is the X coordinate,
    and the second is the Ycoordinate. You need to subtract the X coordinates for
    a horizontal race (X measures horizontal distance across the screen, and Y measures
    vertical distance.) For instance, your start coordinates might be [-332 -129]
    and your end coordinates might be [342 -135]. Looking at the first numbers only,
    your turtle will have to go to the right 332 steps to get to the invisible zero
    reference line then go another 342 steps to get to the finish line. The distance
    traveled 332 plus 346, or 678 steps. We are asking questions to get there, so
    we divide 678 by 4 to get 169 and a remainder, we''ll round it up to 170. In short,
    each time we answer a question correctly, we need to go 170 steps.

    2. If you don''t understand what I did, you can use trial and error to arrive
    at a step length. Adjust the step length until the turtle lands on the finish
    line after going four times. You can do this in the Command Center—talk to t1,
    put it at the start place, and tell it to go forward 170, 170 and so on four times.
    It did land or If not, change the number. Or redraw the line! You can also make
    the line into a colored rectangle. What''s important is that you are sitting on
    the color red = 15 (or other color you choose).


    You should have code in place for questions. Test it. Does it work? If not, make
    adjustments. You can "comment out" the setup line by putting a semicolon in front
    of it, because it doesn''t work. Don''t forget to remove the semicolon once you
    actually write the code for setup.'
