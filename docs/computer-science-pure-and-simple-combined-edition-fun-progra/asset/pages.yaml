- pgno: 58
  md: 'The walk procedure, you can see that we added an input to forward—the value
    in the variable stepsize. That value is passed from Main when the procedure walk
    is called, which now has has an input. See how they are tied together?


    ![](img/242aaa06c3a3208f16d97cdd92303648_58_0.png)


    Go to your Graphics Page and click on the Start button. How did it go?


    My dog went backwards! Yours may be going up or down! We forgot to set the heading
    of the turtle/dog before we called walk. (Remember, the heading is the direction
    the turtle is facing.) My dog faces the opposite direction from my horse. We forgot
    one of our programming goals, which I repeat here:


    It must work every time for every one. In other words it can''t depend on the
    user doing things in the right order, or depend on the turtle facing the right
    direction or some other condition. It must account for and handle all those possibilities
    itself.


    How can we do that? We''d like to point the turtle to the left, no matter what
    it was doing before. So we need to set the heading, using seth, pronounced set-H
    for set heading. Let''s try this: Add seth–90, or seth 270 (same thing) to Main.
    (Do you wonder where these numbers come from? Take out a compass and look at the
    numbers around the rim. They add up to 360, the number of degrees in a circle.
    North is 0, or 270 is west. Or in our case, to the left.)


    We are pointing the turtle''s head to the left, no matter what it was doing before
    that.'
  merge: -1
  img_proc: true
