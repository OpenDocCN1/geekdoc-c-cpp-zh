    seth 270

    repeat 200

    [walk 10]

    ```


    There, I think that looks pretty good. Now let''s do **jump**.


    # The jump procedure


    Well, I guess the obvious variable in a **jump** procedure would be "How high?"
    or height. So let''s get started:


    ```

    to jump :height

    seth 0

    forward :height

    wait 1

    back :height

    ```


    What do you think of this procedure? Do you think it will work? Let''s add it
    it to **Main** and give it a try. Here is the new **Main:**'
