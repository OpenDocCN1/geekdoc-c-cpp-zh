- pgno: 60
  md: '```

    to Main

    cg

    cc

    pu

    talkto "t1

    setsh [dog1 dog2]

    seth 270

    repeat 200

    [walk 10

    jump 10]

    end

    ```


    Give your program a try.

    My dog just kept going up!


    Do you see why? In jump, we set the heading of the turtle to up (seth 0) but we
    never set it back again! In other words our jump procedure had the unpleasant
    side effect of changing the direction the turtle was headed. But how do we set
    it back to its original direction when it is finished jumping? Let''s see the
    heading back to 270 (to the left) when it is finished jumping.


    ```

    to jump :height

    seth 0

    forward :height

    wait 1

    back :height

    seth 270

    end

    ```


    Do you see how that works? Now try it.

    I would like the dog to walk further before it jumps. How do we do that?

    Let''s try changing the size of the steps by changing Main as follows:


    ```

    repeat 200

    [walk 100

    jump 10]

    ```


    Well, the result is interesting, but the animation doesn''t seem to work! What
    went wrong? Let''s take another look at our walk procedure. Here it is again:


    ```

    to walk :stepsize

    repeat 2

    [forward :stepsize

    wait 1]

    end

    ```'
