    11.8: What is a view_interface Problem: We would like an easy mechanism to create
    a view. Solution: In the C++ 20 release, we have We have learned a fair amount
    by now about ranges, so let us talk about views. We can say a view is based on
    a range, but the data probably looks different than if just looking at a range.
    There are two main actions you would perform to get a view; you would filter the
    data, or transform the data. Filtering the data means you are specifying criteria
    so that your result is (probably) less than what you were looking at before. (The
    word probably is added in, because if your filter criteria are weak, then you
    might have all of the data pass through so that your view data will not look any
    different). The other way is to transform it, meaning the actual data values in
    the resulting view will be different. The view_interface templated class is a
    base class used by the view classes in the ranges namespace. You can also use
    it as a base/helper class if you need to create your own views. Most times when
    creating a view, you would use Curiously Recurring Template Pattern CRTP is a
    mechanism to define a type, and at the same time, pass the type as an argument
