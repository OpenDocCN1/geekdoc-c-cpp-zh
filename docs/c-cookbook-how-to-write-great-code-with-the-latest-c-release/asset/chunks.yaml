    your own concepts, but still gave you lots of built-in ones to use, ranges::views
    are new. However, C++ has shipped with lots of newly created views that will help
    your code out tremendously. A few chapters previously, we learned what views are,
    but now we will continue that journey and see what views exist in the ranges library.
    Moreover, we will talk about what one could say is a view’s best feature, that
    is, its composability. Structure In this chapter, we will cover the following
    topics:  Recipe 15.1: Review of views and ranges, and what are range adaptors Recipe
    15.2: Some simple range adaptors Recipe 15.3: Using take() and drop() adaptors Recipe
    15.4: Using range adaptors with composition Recipe 15.5: Using filter() and transform()
    adaptors Recipe 15.6: Working with the join() and split() adaptors Recipe 15.7:
    Working with the keys() and values() adaptors Recipe 15.8: Using chunk() and slide()
    adaptors Recipe 15.9: Using zip() adaptor Recipe 15.10: A quick look at reverse() Recipe
    15.11: Looking at special adaptors Some good news about these features; although
    the compiler makers were slow to implement these features when they were first
    released, things are working well. The small caveat below, was the gcc compiler
    was having issues when the zip code was being optimized.   {             } Objectives By
    the end of this chapter, the reader will understand about what views exist in
    the ranges library, and how to join them together. Recipe 15.1: Progressing from
    views and ranges, to range adaptors Problem: We should know what a range adaptor
    is before we try to use it. Solution: A range adaptor was made to convert a range
    into a view. We have been talking a lot about ranges lately, but it has been a
    while since we have talked about views. A range can be defined as an ordered sequence
    of elements, that has a designated start, and a rule for A view is syntactically
    defined as a concept that is:  a range is std::movable (although in the early
    stages, it was sometimes defined as semiregular, which mainly meant that it was
    copyable) has a Boolean property named enable_view (which is mainly just a flag
    to designate it as a view) A view is also semantically defined as:  constant time
    copy operation constant time move operation constant time assignment constant
    time destruction The enable_view flag can be used to opt out of being a view,
    if you meet all the syntactic requirements, but do not meet all the semantic requirements. The
    next important part to recall about views is that they are handled lazily. While
    we have seen that all the functions that work with a range, work on the data right
    away, a view does not work on the data until it is told it needs a value. When
    you are working with views, remember that we have been focusing the last few chapters
    on range algorithms. Those were created to work on ranges, whereas the focus for
    range adaptors is on views, which is what we will be looking at in this chapter.
    Range adaptors are composable, range algorithms are not. We will be using a lot
    of views in the range''s namespace. Those entities are types, and many have a
    corresponding object in the view’s namespace. For example, there is the ranges::take_view
    type, and the views::take object, which is normally called a range adopter object. A
    range adaptor is something that takes a range and can convert it into a view.
    The range adaptor (normally) does not just create a view of the same data, but
    it transforms the range of data. That is not too hard to imagine, because we have
    seen with ranges that we can call a projection, which we can think of as a function,
    which changes the value, or even instantiates a new type. Dealing with ranges,
    we have used subranges a few times. These are partial ranges, which also is not
    difficult to picture, since we just said a range has a defined start, and a sentinel
    to state when we are at the end. So, a view is a range, that possibly has had
    a projection done on it, and possibly has had the beginning and end redefined. If
    we want to get a bit deeper into it, some ranges functions returned a subrange,
    which we just said was not too difficult to define. A view adaptor would return
    something that is more complex. For now, we can say it returns a closure, it is
    not just data, but a larger type that could have some temporary variables that
    are used when it is being lazily evaluated. Recipe 15.2: Some simple range adaptors Problem:
