    example, our assume statements are simple statements to help the compiler know
    the current state. You should not put actual functions that need to be run in
    assume statements. You should also be certain the assumption is correct. Otherwise,
    the compiler may make wrong guesses and the execution will be undefined. For some
    compilers, if assume fails, execution may even be aborted. If you really do not
    want the code to execute if the assumption Is false, then you explicitly should
    use an assertion (which will abort the program if it fails), or have an if statement
