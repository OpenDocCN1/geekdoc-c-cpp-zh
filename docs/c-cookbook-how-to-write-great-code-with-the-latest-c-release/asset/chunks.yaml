    are a big feature, but they have a large learning curve. It is a different paradigm,
    where it is not asynchronous code, but allows you to structure your code to be
    more effective. By the end of this chapter, the reader will have an understanding
    of what coroutines are, and the power they can provide. Recipe 9.1: What is a
    coroutine Problem: We want a flexible mechanism that allows us to call code multiple
    times, and it will just pick up where it left off. Solution: C++ 20 has created
    coroutines. Coroutines have actually been around for a long time. The term was
    first coined in 1958, and used in one of the early programming languages Simula
    Since then, Coroutines, in one form or another, have been in languages such as
    Go, Kotlin, Ruby, PHP among many others. In that respect, C++ is rather late to
    have such a feature. Those that know C# would relate it to the yield statement.
    To give a brief description of what they are, we can look at the following Figure ![](image-a0a9k8z0.png) Figure
    9.1: Comparing a subroutine to a coroutine In a subroutine, we can see our calling
    code execute all the statements in the subroutine, before returning a value. In
    C++, we call the subroutines functions. For a coroutine, the calling function
    calls the subroutine, and it executes some code, and then it says it is done for
    now. Execution continues with the caller. The caller can call the coroutine again,
    and it continues where it left off. The caller can continue to call the coroutine
    until there is no code left to execute, where execution just continues back with
    the calling function. One downside of the idea of coroutines, is that you sometimes
    need to do some coding on the calling side, as well as the coroutine side, to
    get it to work effectively. Other times though, especially in cases where the
    coroutine has an iterator, that the caller seems like it is in a normal loop,
    and the code is very clean. There are many ways for the coroutine to manage what
    they produce, and most times the caller will not know how the coroutine is implemented,
    or even if it is one. If we think of a food analogy, imagine a breakfast restaurant
    assuming how many orders for eggs it will sell that day, cooking all the eggs
    up all at once, and then waiting for the customers to arrive and order them. Instead
    of doing all the work up front, the coroutine restaurant might cook a few eggs
    up when the restaurant opens, and will keep those warm waiting for orders, but
    otherwise it stops cooking and waits for somebody to request them to cook more
    eggs. The end result is the customers will be happier because they received a
    better product, and the restaurant owner will be happy because they did not waste
    a lot of eggs that were cooked ahead of time but never served. Coroutines allow
    you to provide some data back to the caller sooner, but not always to keep looking
    for data to serve back. This lets other code execute, and help the program flow
    better. The coroutine does not execute in a different thread. As normal, the calling
    code sits there waiting for a response from the coroutine, but when the coroutine
    returns a value, its execution is suspended, until it is asked to continue (when
    it is called again). Normally, when C++ calls a subroutine (aka function), it
    also remembers where the caller is by means of saving information on the stack.
    When debugging C++ code, you will recall that we can see the history of who called
    what, by looking at the stack-trace. With coroutines, something similar happens,
    but the status, values of local variables, and other information is stored on
    the heap. The C++ implementation of coroutines is said to be stack-less. When
    a coroutine returns back to the calling function, it is said that the coroutine
    is suspended. Once it is called again, the coroutine is resumed. They call this
    cooperative multitasking. While you can certainly code solutions that do not use
    coroutines, but get the same result, there are certainly advantages of using a
    coroutine, such as:  There is a defined mechanism for suspending and resuming
    within the same thread. You can do something that feels like concurrency, but
    since it runs in the same thread, you do not have to worry about data locks or
    data races. Although there is a small number of pieces you have to define, the
    pattern would be easy to apply to different scenarios. If you look at your calling
    code, you cannot tell that you are actually calling a coroutine. Hiding the implementation
    detail makes the code look very clean. You cannot tell if it is a coroutine by
    looking at its signature. You can only tell by looking at the implementation. We
    do not have to worry about threads that are pre-emptive, and do not get the kernel
    involved (which could slow execution) (See references). The idea of coroutines
    is to generate data and you do not have to allocate a lot of memory for a full
    result set. The coroutine can provide you with a single result for each execution.
    That means that you do not need to allocate a lot of storage if you can just process
    each individual result as you get it. Moreover, if you traditionally go get a
    bunch of data in a collection, then you probably had as much code managing the
    collection, as getting the data. Coroutines (in many cases) eliminate managing
    the collection completely. The idea of using a coroutine can be very handy in
    several situations, such as:  When you have a function pointer as a callback.
    Sometimes you could be passing a callback to something you do not trust. They
    can be used in event loops. When you are parsing some data. When you are dealing
    with a long, or even infinite, list. When you are iterating over something. Lazily
    computed sequences, also known as generators, are a big aspect of coroutines.
    We will be talking more about generators later. Pipes. Possibly state machines. Other
    situations where you would want to temporarily suspend what you are doing. A knock
    against C++ coroutines, is that there is a fair amount of boiler-plate code that
    needs to exist for it to work. We will talk about those different pieces in detail,
    but we can give a description for some of them here:  A handle for the coroutine:
    The calling code will need a mechanism of calling the coroutine, and when to call
    it again (or to resume it, as it is typically described). This handle is non-owning,
    and so it will need to be properly destroyed when the caller is done with the
    coroutine. A promise object: The user defines what is in this, but there are rules
    to follow. It is used within the coroutine and is used to return the result. It
    has no relationship with The coroutine state: As mentioned, this normally lives
    on the heap, and contains the promise object. If there is a change, the compile
    will optimize it and it will end up using the stack. However, in terms of the
    application code, that does not matter. It also contains the coroutine’s local
    variables, and other arguments given to the coroutine. You may have asked yourself
    "if the calling code does not know if it is a coroutine, how can you (or the compiler)
    tell?" It is from one of the 3 new keywords added to C++20: and If you code uses
    one of more of those co_ keywords (and follows all of the other rules), then the
    compiler will know it is a coroutine. Here are the stages:  The keyword co_yield
    is used when you want to return from a coroutine, but you are not necessarily
    done providing all the data (or at least you do not know yet if you are). The
    keyword co_return signifies that you are done returning data. You can use it with
    a final value. For example, co_return 42; or a simple co_return; to say there
    is no more data to provide. If your generator function has performed a and then
    the function ends, there is an implicit co_return added. Lastly, the co_await
    operator suspends execution of the coroutine, until it is resumed. The co_await
    can have a parameter that will return an awaitable (which we will talk about soon).
    There are predefined ones, or you can create your own, depending on your needs.
    While co_yield will return a value, and co_return tells the caller "I have no
    more values to return", co_await allows the coroutine to tells the caller "I currently
    have no more values to return (or want to take a rest from returning values) but
    you can call me again later and I will resume to look for more".  One last point
    to mention about coroutines is the difference between stackless and stackful.
    Naturally a stack exists when a program is executed, but stackless means the couroutine
    does not rely on a stack while it is suspended. C++ coroutines are stackless,
    as they use the thread stack from the operating system that bundles up the variables
    within the method. Conversely, stackful is the type normal threading code would
    have. Stackful normally means more memory is allocated to handful the entire call
    stack, while stackless need less memory to manage just the coroutine frame. A
    stackless frame can be thought of as an object. It has values for the method’s
    variables for that current point in time. We have talked enough in an overview
    about coroutines. Let us start talking about the individual pieces. Recipe 9.2:
