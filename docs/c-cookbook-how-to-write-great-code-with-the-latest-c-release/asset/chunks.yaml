    18.20: Output from LookAtBits_bit_cast Recipe 18.12: Designated initializer for
    aggregates We want an easy way of initializing an aggregate. In C++20, they provided
    a new way of doing that. It has been possible since C++11 to use a designated
    initializer. This meant you could initialize your variables, even containers:  numbers1
    = { }; numbers2 { };  You can also initialize a struct or class’s member variables
    (with some restrictions) as long as you place the values in the order of the variables.
    The problem with that is that it is not clear which variable you are initializing. With
    C++20, there is a new way that in the initializer block, you can use a .MemberName
    syntax to make it clear which member variable you are initializing. You can see
    in the following code example, that you can still initialize with or without the
    equal sign. For some reason, the shortcoming still exists, meaning that the variables
    have to be initialized in sequence of declaration, but at least the code is more
    understandable now. Note that you can still initialize without declaring with
    variable, although personally, the pain of specifying the variable names is small
    compared to the increased readability.  { numbers1; numbers2; }; { numbers3; message; numbers4;  }; {  { <<
    << << __FUNCTION__ << numbers1 = { }; numbers2{ };  strictDI2 s3{ // member variables
    cannot be initialized out of order // .message = «Hello C++", .numbers3 { }, .message
    = "Hello .numbers4 = { }, .innerDI { .numbers1 { .numbers2 {  },  }; << "s3= "
    << s3.message <<  strictDI2 s4{  "Hello  }; << "s4= " << s4.message << } };  For
    now, there are still a number of restrictions for initializing an aggregate. The
    worst is that you cannot have a protected base class, or inherited constructor.
    Hopefully, that can be remedied one day. It also cannot have a constructor, but
    that does not seem to be a hassle, since if it had one then you would be using
    it anyway. Refer to Figure ![](image-hsx059e6.png) Figure 18.21: Output from LookAtDesignatedInitializer Conclusion At
    the beginning of the chapter, we said that you will learn some things that will
    make coding easier. We certainly mentioned a lot of new classes and functions,
