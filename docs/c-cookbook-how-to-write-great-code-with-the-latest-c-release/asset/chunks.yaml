    the beginning of the chapter, we mentioned easier, cleaner, and Hopefully, you
    see the benefits of using some of the concepts we have mentioned so far. As with
    good class design, defining concepts is worth the effort. At the very least, you
    are self-documenting what the intent is. The intent shows how it was designed
    to be used, how it is currently being used, how the author wanted it to be used,
    and how it was tested to be used. As a code author, you do not want to bear the
    burden of the issues when a user goes outside the designed usage – so the best
    thing you can do is be as explicit as you can about how you intended that code
    to be used. Concepts will allow you to have compile time checks to ensure that
    the types you want to use will work with the code that uses them. After reading
    this chapter, the reader should understand that there are a lot of existing template
    concepts that can be used to validate the type of argument or its capabilities. Points
    to remember  A lot of predefined concepts were created in C++20, based on checks
    that were introduced in C++ 11\. The concepts discussed in this chapter help you
    know how a type can be constructed, or how it was constructed, and some of its
    other capabilities. Using these concepts will improve the quality of your code-base,
    and at the very least, the constraints show the intent on how the code is to be
    used. References  Default_initializable (n.d.). Retrieved from https://en.cppreference.com/w/cpp/concepts/default_initializable Common_reference
