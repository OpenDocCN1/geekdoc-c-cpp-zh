    << #endif } }; Conclusion We have had yet another chapter where we have talked
    about a lot of features that you can use. The theme of this chapter was to show
    that it is not always the big flashy features that will make your code a lot better.
    Using some of the techniques mentioned here should make your code cleaner. That
    means that it is easier to read, easier to understand, easier to debug, and easier
    to expand upon. It might be some new prefixes or suffixes that you think make
    the code easier to understand. You might see that deducing-self mechanism will
    cut a ton of duplication out of your library code. It might also mean you shift
    to std::expected and have a whole new paradigm on the return values you give back.
    Some of these are big sweeping changes, some are small, but any and all should
    make your code cleaner. Points to remember  There are times when we do not always
    want to use the auto keyword. Providing types to your lambdas might cut out mistakes. Having
    the explicit object parameter, otherwise known as deducing or deducing self will
    cut down on a lot of extra code and simplify CRTP. Using multidimensional syntax,
    or make_shared for arrays, will help code that handles your collections look smoother. Switching
    to and/or may be a big change, but there are benefits that you should consider. C++20’s
    lambda parameter packs and familiar template syntax are nice improvements for
    lambdas. Using the new <spamstream></spamstream>features with span is handy. References  YouTube.
