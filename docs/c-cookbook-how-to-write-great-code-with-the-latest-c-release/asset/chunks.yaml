    were a very big part of C++20, both in terms of importance, and but also in terms
    of its volume of functionality. We have covered a lot of ground, but we still
    have some big ranges features to talk about. We have seen that ranges can be used
    to think about heaps and maximize the performance of finding a value in a range.
    We have looked at a lot of coding examples dealing with manipulating a range;
    whether that means moving values around, or transforming values. All of this functionality
    will come in handy when we learn more about other range features. Points to remember  Most
    range features were in the C++20 release, and many of those have similar counterparts
    in the standard library. Heaps could be a handy tool if you want to investigate
    binary trees and/or how to find data quickly. Most of the range modifying functions
    come with different versions; many have an _if version, so your predicate can
    determine if you should take the action. Many also have _copy versions which will
    leave your source range unmodified and instead, it outputs to another range. Just
    be careful that some of these functions require the target range to be pre-sized. The
    ranges::copy_backward() and ranges::move_backward() are useful when transferring
    the value within the same range. You may not have to use temporary variables since
    you will not walk over the same item. Think of your data type when using ranges::shift_left()
    or Your original value could get nullified, or it could still be there. Remember
    the function ranges::shuffle() rearranges the items within a range, whereas the
    ranges::sample() function copies shuffled items into a new range. The result of
    ranges::unique() is a subrange to where the duplicated values got moved to. You
    will need to erase that to actually get the duplicates out of your container. The
    ranges::transform() function is powerful, allowing you to execute a niebloid on
    one range and store the result in another range. It might become one of your favourite
    ranges tools. References  Wikipedia. (n.d.). Heap. Retrieved from https://en.wikipedia.org/wiki/Binary_heap Join
