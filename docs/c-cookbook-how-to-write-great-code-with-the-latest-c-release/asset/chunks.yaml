    to help the compiler optimize for paths of execution. C++ 20 has new attributes
    named likely and With speed being as important as ever, it is good to do whatever
    you can in terms of improving performance. Since compilers are so smart nowadays
    in optimizing code, it is a nice when we can help it along, and tell what code
    paths are most likely to be executed. That is where these two new attributes come
    in. They are a little extra help telling the compiler what you expect should happen,
    and let the compiler see how it can best optimize that part of the code. Unlike
    the attribute or the std::unreachable() function that we are about to talk about
    in the next couple of topics, the attributes likely and unlikely are only a guide
    for compiler optimization. First let us list our headers for this chapter:  #include #include<iostream></iostream> #include #include<ranges></ranges> #include<type_traits></type_traits> #include #include<array></array> #include<unordered_map></unordered_map> #include #include #include #include #include<fstream></fstream> #include<iostream></iostream> #include<thread></thread> #include<syncstream></syncstream> #include #include<source_location></source_location> #if
    >= 202011L #include<stacktrace></stacktrace> #endif #include #include  If you
    look at our code sample:  {  {}  { << << << __FUNCTION__ <<  0 }; for = i < i++)
    { switch  { [[fallthrough]]; [[fallthrough]];  [[likely]] << "In case 2, for:
    " << i <<   << "In case 3, for: " << i <<   [[unlikely]] << "In case 4, for: "
    << i <<  // maybe_unused cannot be used in case blocks //[[maybe_unused]] case
    99: // std::cout << «In case 99, for: « << i << // break;  }  } } };  We can see
    in the following output in Figure that the unlikely attribute does not affect
    what the output says. Adding the attributes may affect how fast the code is executed
    though. ![](image-inrznilc.png) Figure 21.1: Output for LookAtLikely We will point
    out, that although to some seeing these attributes in the code may be a bit of
    a distraction, for other developers, it also could be a learning aid. Instead
    of a comment saying // it will probably run this saying it explicitly with a likely
    attribute could also help other developers understand what is happening in the
    code. On another note, we sprinkled a couple of other attributes in our code example,
    for reference. We are showing the C++17 attribute maybe_unused at the beginning
    of a function, and in front of a variable. We cannot place maybe_unused in a case
    block. We included it to show that the maybe_unused attribute is not about code
    optimization, but for compiler warnings. If you are trying to reduce the number
    of warnings you have in your build (which you should be doing), then you can place
    this where a variable or function is not used due to #ifdef or some other macro
    logic. If you do find unused code still in the codebase for no reason, then you
    should consider removing it. This usage should be for entities that are sometimes
    included in a build, but perhaps not always. If the compiler sees something in
    a build that is not used, then it might issue a warning. If this is a false positive,
    then the maybe_usused attribute will suppress it. The other attribute we have
    in the code is named When C++ was designed, for some reason, the default action
    was very oddly planned. It executes all the case blocks below it, until it sees
    a break statement. In most cases, we only want the one block, but there is the
    odd time when we want to execute more than one case block of code. Compilers are
    smart enough to know that not having a break statement looks suspicious, and issues
    a warning. To suppress that warning, you can add the fallthrough attribute to
    tell it that is your intent. Given all of what we have said, these attributes
