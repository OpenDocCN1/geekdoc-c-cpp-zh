    Your Code Cleaner Introduction You might think this is a catch-all (or chapter,
    but these new language features will help you write better code. Sometimes it
    is the little things that make a big difference. There have been many features
    that we have talked about in previous chapters, which will make your code cleaner.
    The features here may not fit into another chapter, so yes, it is a bit of a catch-all.
    Hopefully, some of these features will allow you to make your code neater. It
    is believed that the best situation is when you are writing code so others can
    learn from you. It is not about some other architecture or project documents in
    some folder. The best way others can learn is if you write good, clean code that
    others can follow. There are other benefits to this stage as well. You might get
    more recognition, and you might get more rewards. This chapter is a collection
    of new C++ features. Perhaps you will be able to use some of these in your daily
    coding. Hopefully, you also see that these features should make your code cleaner
    and easier for you to understand, and for others to understand. Structure In this
    chapter, we will cover the following topics:  Recipe 19.1: Familiar Template Syntax
    Lambdas Recipe 19.2: Lambda parameter packs Recipe 19.3: Literal class types in
    non-type template parameters Recipe 19.4: Multidimensional subscript operator Recipe
