    to C++ C++ is a wonderful language. You can often be working with high-level abstractions,
    but still be able to dig down deep and work with raw memory. C++ has been around
    for decades, and with the efforts of many good people out there, is still evolving.
    We can assume that this means that it will probably be around for decades more.
    It is on lists of most used languages (sometimes in the top 10, and if not, then
    certainly the top 20), as well C++ is on lists of programmers’ most liked languages.
    C++ is not owned by a big company, has multiple companies making compilers for
    it, and many companies making tools and libraries for it. It runs on different
    operating systems, for purposes big and small. The governing body meets regularly
    to discuss, debate, and decide what will go into the next release. Releases were
    decided to be every three years, which they have done in the age of modern C++
    (11, 14, 17, 20, 23, and they are already talking about C++26). To be precise,
    the releases are defined every three years. At the time of writing this book,
    at the end of December, C++23 was still being voted on whether it is officially
    released. We could not talk about everything to do with C++ just in one book,
    and so we are here to talk about the latest couple of releases; C++20 and C++23. Recipe
    1: Who is this book for? We want to know who should read this book. It can appeal
    to different types of audiences. Of course, we would like to say anybody and everybody
    can read this book. However, this is a cookbook focusing on the newest releases.
    If you are just starting out knowing little about C++, then this probably is not
    the best first book for you. Having said that though, today’s world lets us learn
    in different media in different ways. If you have a handful of websites and other
