    Your Code with Modules Introduction Although still code-related, in this chapter
    we will look at a different paradigm and not focus on how to write some new code,
    but how to organize your code. On the surface, modules may not seem like a big
    language change, but they will certainly help you create better software. It is
    a way of defining a section of code, that does not rely on namespaces, but rather,
    helps you maintain your code better, as well as when you reuse other people’s
    code. Structure In this chapter, we will cover the following topics:  Recipe 10.1:
    What is a module Recipe 10.2: What the compiler does with a module Recipe 10.3:
    How to use a module. Recipe 10.4: Visibility and reachability Recipe 10.5: Layout
    of a module Recipe 10.6: Cyclical modules Recipe 10.7: Importing the standard
    modules Recipe 10.8: What are module partitions At the time of writing this book
    the Microsoft compiler is mostly feature-complete, and clang and gcc are partially
    complete. The issue is, that we normally use the Compiler Explorer on https://godbolt.org
    to verify the status of the features of compiler, but they have not yet fully
    implemented the ability to use modules. It is best to check on https://en.cppreference.com/w/cpp/compiler_support
    to see if your compiler has implemented modules.   {          } Objectives Modules
    are a relatively easy topic to understand and certainly welcome. Although there
    are many modern features in the C++ language, having to separate the code into
    header and implementation files seems rather odd compared to many other languages
    being used today. By the end of this chapter, the reader will understand more
    about what modules are, and how to create and consume them. Recipe 10.1: What
    is a module Problem: We want a better way to organize our code. Solution: One
    of C++20’s Big Four features is called modules. Modules have been around in other
    languages for a while, so, C++ was a bit behind in that regard. The way C++ built
    things has not changed much since it was initially released decades ago. It was
    based on the C build system, which had the simple principle of declarations in
    a header file and the implementation in another file. Compilers got very good
    at optimizing the code, but aside from that, it was just like the basic steps
    of compiling the .CPP files, and then linking the object files into some form
    of executable. Many newer languages did not have that thinking of separating the
    declarations from the implementation, partially because other languages were newer
    and had the benefit of more computing power. Using header files for declarations
    does have some advantages, such as:  The process was fairly simple, which meant
    that it was easy to understand, and compilers could even process multiple header
    files at once. Aside from inline code, it had a good separation from the implementation. It
    was easily understandable for other C++ developers to know what was available
    for them to consume. Unfortunately, the list of disadvantages of using headers
    was longer and more serious:  Including a header means a copy and paste of the
    header contents into your implementation file. The biggest complaint about all
    of this was that compilation times could get extremely long. If you have a header
    that is included in 50 source files, it means that the contents of the header
    are being compiled that many times. Precompiled headers helped with the speed
    issue to an extent, but it could also get confusing, and sometimes relied on the
    sequence of header includes, which was not always consistent. Even with pre-compilation,
    you can have many compiler errors due to the order in which you include your headers. The
    blessing of separation can also be a curse. The files could get out of sync, or
    other problems like cyclical errors. Most other modern languages had processors,
    or other tools, and comment-readers, that made the separation far less important. Having
    C++ headers is good for other C++ consumers, but in this modern age of enterprise
    applications using multiple languages, there is no easy (or standard) way for
    other programming languages to understand the contents of the header files. A
    huge issue is something called the One Definition Rule and with macros, it is
    too easy for different C++ types to have compiler issues, or worse, unforeseen
    runtime errors. Headers also have a lack of encapsulation, which was one of the
    main objectives of the language. You are exposing some implementation to anyone
    who consumes your public header. Despite them being around for a very long time,
    people wanted the system to improve, and finally, in C++20, they released the
    feature called modules. Modules are a way of solving the problems listed previously.
    There was a talk (see references) that said that while modules may not have been
    the C++20 feature with the most fanfare, not only are modules the most important
    feature of that release, but they are the most important feature since C++ was
    standardized. The argument behind that statement relates to modules:  They dramatically
    change the build system. It will change how C++ code is written. It will change
    how C++ code is parsed. It can change how C++ projects are organized. It changes
    how C++ projects are consumed. Moreover, as mentioned, they solve a bunch of issues
    that have been around for many releases.  Note: One important caveat about modules:
    although it is, and will be, an important feature going forward, not all compilers
    have fully implemented it yet (at the time this book is written). The Microsoft
    compiler says it is mostly done, but unfortunately the gcc and Clang compilers
    only state as being partially done. You need to be careful and do some investigation
    for the compiler you are currently using. Most of this chapter was compiled using
    the Microsoft C++ compiler, so at least we can show you how a lot of it works.  Before
    we go on, let us look at a module:   #include<iostream></iostream> Module10_1_1; {  { <<
    << __FILE__ << " : " << << __FUNCTION__ << << "Welcome to } };  Some parts look
    familiar, but right at the top, we see a new keyword. The module specifier is
    the first line, which means that this will be a module file. Different compilers
    are using various filename extensions for modules, and so there is no set rule
    on how to indicate a module aside from this declaration. Our code gives the following
