    14.1: Heap functions Problem: We want some heap-related functionality that is
    easy to use. Solution: The C++20 release has several heap functions that look
    at, and modify your range. It might be helpful to some, to first talk about the
    heap data structure These are fairly simple, where any node will have at most,
    N number of children. There are different types of tree structures, and various
    sub-types as well, but overall, the heap is an important one. There are two main
    types of heaps, which are aptly named Min-heap and Max-heap. The name implies
    the focus of the tree, and how is it set up. For a Min-heap, the parent node has
    a smaller (or equal) value than the child. This would mean the root node has the
    smallest value. If you want the obtain the smallest, or smaller value in a Min-heap,
    it is fairly quick to do so. Conversely, if you have a Min-heap, and you want
    to obtain a larger value, then, relatively speaking, it will take a longer time.
    The other type is a Max-heap, which acts oppositely. The parent node has a larger
    (or equal) value than the child nodes, which means the largest value in a Max-heap
    is at the root node. Refer to the following table: table:  table: table: table:table:
    table: table: table:  Table 14.1: Small chart describing heap types Since we normally
    engage with binary trees, we sometimes forget that they are an example of a heap
    structure. A binary tree is an example of a heap structure where you can have
    at most two children. They are still a type of heap, so would have the same characteristics
    of a heap, as we just talked about. Programming these structures and traversing
    them is sometimes one of the first things you do when learning a programming language. When
    the values are stored in an array, the top value goes first, and then each tier
    is added, going from left to right. This consistency allows for assumptions and
    less work when adding or removing items from the heap structure. Refer to Figure ![](image-8sivg7l8.png) Figure
    14.1: Binary heap and how values are stored in an array This mechanism of storing
    the values in an array such that:  The largest value, the top of the binary heap,
    will be stored in the array’s first position, The next two largest values, the
    second row of the binary heap, will be stored in the next indices of the array,
    a[1] and The next 4 largest (or 3 if the tree is unbalanced, like ours is in the
    preceding figure), will be stored in the next indices of the array, and a[5] (plus
    a[6] if it was a balanced tree). Note that the set of values in that tier { a[3],
    a[4], a[5], a[6] may not be sorted. But on the whole, that group of values are
    the next largest. As the tiers get wider, possibly doubling in size, they will
    be the next group of values in the array. We can show you another example looking
