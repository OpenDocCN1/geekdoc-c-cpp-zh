    What happens when something is used in a module, but not exported? Solution: We
    will see that things still partially work. In the last topic, we talked about
    how the consuming code cannot see something unless it is exported. Let us look
    at a simple module:   {  const { + }  {} }; input) {  result.MyValue = input;  }  Here
    we have a module that contains a struct, and a function that returns that struct.
    Note that we exported our function, but we forgot to export our struct. If we
    look at our calling code:   import import import import // previous code being
    called in other modules import { // = CreateMyStruct(123); auto result = = result.MyValue; =
    result.AddOne(); }  You will see that curiously enough, we can call the function,
    even though we did not export the resulting struct type. We can also access the
    member variable, and call the member function. Why are we allowed to do this? The
    answer relates to something called visibility and reachability. It probably originated
    as a compromise when they were designing this feature, but it makes some sense.
    If we can export a function that returns a type, then we should be able to at
    least see the public members of that type, despite not knowing what that type
    is. You will see that when we try to refer directly to that type, we get a compiler
    error. That means that if not exported, it is reachable (meaning it is within
    our scope and we can still access it) but it is not visible (meaning we cannot
    name that type). In those cases, you should use auto to define your variable.
    We also cannot call the function obviously because that is private. It is difficult
    to say how useful this feature is, it feels a bit like cheating. On the other
    hand, it is almost like an interface that other languages have, where we do not
    know the type that contains the functions, yet we can still execute them. One
    other little bonus, you can see in our code example above. We have our import
    statements as we had before, and then we have our functions that we called code
    that is in other modules, and then we have another import statement. Some people
    might not like this style of not having all the imports at the top of the file,
    but it is an interesting option that we can have the import statement close to
    where we call the other module, keeping things together. Recipe 10.5: Layout of
