    want an easy way of knowing there might be an issue. C++ 23 has a new preprocessing
    command We have to state that #warning is new, since it is now an official part
    of the language. Although, some compilers have had the #warnng statement for a
    number of years. Code safety can come in many ways; whether that is type-checking,
    bounds-checking, parameter-checking, and many more. With all of the const-related
    features adding in C++20, that means that you can do a lot more processing at
    compile time, rather that runtime. One way to add extra safety, is to warn developers
    when there might be a problem. The #error directive has existed for a while, and
    now you can also use a #warning directive to warn coders (or at least automated
    build tools) that there is a potential problem. You may not want the build to
    break, but you do want to raise the issue that it should be looked into. While
    on the topic of code safety, here are a few suggestions:  Have a goal for your
    builds to (eventually) be on the maximum build warning level. The more warnings
    you see, hopefully, that means that more of potential issues get looked at. The
    more issues that get looked at, hopefully more issues are found and get fixed.
    The more issues that get fixed, the safer your code will be. Use different tools
    to find issues. Aside from your usual compile, use external tools that could find
    potential issues as well. There are also sanitizers that can be used in test-builds,
    to try to find issues. This implies that you have more than the debug vs release
    builds. A release build is good for a staging environment, but if you have a testing
    environment, and maybe a performance environment, then perhaps you have a build
    that still does a little bit more than what a release build does. This is not
    the focus of the book, but there are tools out there that help harden what you
    deploy. Although code coverage metrics have their naysayers, it is still some
    extra information that indicates how solid your code base is tested. Here is a
