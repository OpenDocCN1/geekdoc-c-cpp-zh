    is a constant pointer to an object, so the content can change, but what it points
    to, cannot. But for modern const issues, constexpr has had its share. As mentioned
    earlier, constexpr says that it must be able to execute at compile-time, but unlike
    constexpr may not run at compile-time. We have already mentioned the statement,
    but to get around this, developers have used which runs at compile time. If you
    have a constexpr result that you want at compile time, one way to ensure that,
    is to check that result with If you just used the normal that is executed at runtime,
    your issue will not be resolved. If your goal is to run at compile time, then
    a static_assert is recommended. This is because, on some compilers, it may not
    give you proper warnings or errors. If you have, near the end of your call chain,
    forgot to state then it will just fall back to being run-time execution. Unless
    you are checking the assembly instruction output, you may not notice it did not
    create compile-time execution code, and so static_assert not only forces the compiler
    to do what you wanted the compiler to do, but it makes the compiler check your
    code to ensure it was done how the compiler needs it to be. There are some cases
    where a constexpr variable is not doing exactly what you expected. To resolve
    that, you can use static constexpr to ensure it is static. Declaring a static
    constexpr variable in a header may also give you an undesired result. It could
    instantiate that (potentially large) object in every code file it is declared
    in. You may have wanted to declare it as inline constexpr instead. Another issue
    one might have relates to One Definition Rule Shortcomings This can sometimes
    happen with statics and relates to something being declared, but not fully defined. Even
    with C++23, there are shortcomings with in that you might have a compile-time
    result. People have been doing some coding tricks to work around that. Hopefully,
    the language capabilities improve, but if you are in one of those situations,
    there are workarounds you can try. Unrelated to the other rules, it is highly
    advised not to use const_cast to remove the const-ness of an object. It is a strong
    code-smell of something not designed properly and creates a very big chance of
    something not working the way you hope it to. Use it with extreme caution. Conclusion The
    capabilities of the compilers have grown substantially in recent years, but to
    ensure that ability, you may have to alter your code to empower it. Some of these
    code changes are not big, nor harsh. Using the new const-related keywords gives
    your code a new ability, and most likely with less effort than doing a lot of
    big template metaprogramming. If you were trying to achieve those goals before,
    then you should be able to do so with less code and it will look cleaner. The
    more work your compiler can do, the less work the program has to do at run-time. Points
    to remember  Executing code at compiler time, versus at run time, should make
    the execution of your program faster. There are new const-related keywords; understand
    their differences to see what you should be using in different situations. You
    should do enough to verify your compile-time code is doing what you hoped it was
    doing. You should use asserts and other checks, but remember that you are limited
    in what you can do if there is an issue. Consider using static since if a method’s
    goal is to provide a value, and can do so at compile-time, then you might be able
    to reduce creating new instances of variables by being static. References  CPPreference.
