    yes yes yes } Objectives Ranges and views are another big leap in the C++ language.
    Similar to when templated containers were first released. It was not a question
    of understanding how to use them, but there was so much new functionality you
    needed to learn the best way to use them. By the end of this chapter, the reader
    will understand about what ranges and views are, and a bit about how to use them. Recipe
    11.1: What is a range Problem: We want a simpler way of working with containers. Solution:
    C++ 20 has a lot of new functionality with ranges. Before we talk about ranges,
    we should mention a few other things first. Standard library containers (such
    as vector, map, and queue) have been a mainstay in C++ for several releases).
    Having templated containers, meant you could iterate and access values for various
    types of collections in a similar manner. When C++20 came out with concepts, it
    was a mechanism to define iterators, so you could tell that the iterator was forward,
    bi-directional, random-access or something else. It also gave the concept of a
    sentinel, so that it was more of a state indicating whether the iterator was done,
    versus explicitly stating it had gone past the last element for the container. We
    can combine some of those ideas and modify functions in the standard library to
    make the parameters simpler. Instead of passing in two parameters, one iterator
    defining the start, and another iterator defining the end, we could pass in just
    one parameter. The one parameter would be something new, which would define the
    starting and ending iterators, or it could hold the start and a sentinel. This
    new entity is what ranges are all about. Although it is not just about passing
    one less parameter to an existing function. It is also about having many new functions
    that allow a more functional way of programming. However, we will talk more on
    that a bit later. We can rethink that any of our standard library collection classes
    are ranges, although containing all values. We can define other ranges to be a
    portion of that complete collection. There are four different ways to define a
    range:  To provide a begin and end iterator, defined as [being, end) For conditionally-terminated
    sequences, defined as [start, predicate) As a counted sequence, defined as [start,
    size) And for unbounded sequences, defined as [start..) The first two range-related
    headers to mention are which defines the basics, as well as some range-related
    enhancements to Let us look at a simple example:  #include "Chapter11.h" #include #include<ranges></ranges> #include<iostream></iostream> #include<type_traits></type_traits> #include<array></array> #include<algorithm></algorithm> { numbers{
    55 }; numbersBad{ 55 }; auto answerGood = numbers.end(), << "Found good answer
    " << * answerGood << auto answerBad = numbersBad.end(), if == numbersBad.end())
    { << "Bad answer not found" << } else { << << } auto answerGood2 = << "Found good
    answer in range " << *answerGood2 << auto answerBad2 = if (answerBad2 == numbersBad.end())
    { << "Bad answer not found in range" << } else { << "Found bad answer in range"
    << *answerBad2 << } }  { FindInRange(); }  Unsurprisingly, the output is as follows: ![](image-g7b2alh6.png) Figure
    11.1: Output from FindInRange We will talk about all the functions available later
    but notice how much cleaner it looks when you can just pass in the collection
    to a function. There are a couple of tricky parts to keep in mind. For the most
    part, ranges are non-owning. It means that the collection the range was looking
    at or created from (depending on how you like to word it) still owns the data.
    The range is similar to an iterator (which makes sense, since a range knows of
    at least one iterator), in that it is just looking at the data in the collection.
    Another tricky part when learning about ranges is differentiating between a range
    and a view. We will talk about views next. Recipe 11.2: What is a view Problem:
    We would like a lightweight wrapper for a container. Solution: Related to ranges,
    C++ 20 also has views. The first thing we probably think of for a view and C++,
    is a This C++17 class template relates to a sequence of characters. Similar to
    a string, we can iterate through it, get the value, and get the length of it.
    The main difference between a string_view and a string, is that the string_view
    does not own the contents. This is similar to the range’s view. Similar to what
    we talked about in the last topic, a std::string is like a where those are ranges.
    On the other hand, a string_view is just a view. A view is a range but with extra
    restrictions. The main goal of a view is to be lightweight. A quick example would
    be:  s) { << s << } s) { << s << } { s = "Hello PrintString(s); PrintStringView(s); }  We
    are not passing by reference, and so when we pass the string to it creates a copy,
    which could take a while and waste memory. When we pass the string to it creates
    a view but does not create a copy of the content. Copying a view should always
    be quick because it does not modify the content. Another differentiator is eager
    versus lazy functions. In the ranges library, we have range algorithms, which
    are functions that are applied to a range eagerly. Eagerly meaning the function
    acts right away on the range content. The ranges::find function, that we used
    in the last topic example, acted on the range right away. In the ranges library,
    there are also range adaptors, which act on a view lazily. Lazily implies they
    will not act until required, and that too is normally when it is getting referenced. Here
    is another example looking at a view:  view) { for : view) { << n << ", } << } { numbers{
    55 }; PrintView(numbers);   }  Here we can see that we can print the whole container
    of integers, since we can say that a vector is a range, and a range is a view.
    We can also create a view that contains all the numbers in our container, or we
    can even use offsets of the begin and end iterators. We pass those into ranges::subrange
    which creates a view we can use. We are cheating a bit using the auto keyword
    in PrintView for the parameter type, but there is no quick and clean way to define
    the view. We will get into the definitions and differences more as we go through
    this chapter. You can think of a view as a lightweight wrapper of the actual container/object
    that holds the data. Most times, the view is not the owner of the data, and because
    of that, it is easy to quickly create or copy a view. A little side note, or word
    of caution. They may have fixed some issues with views in C++23, or will in C++26,
    but in C++20, there were quite a few problems with views ignoring const-ness. Recipe
    11.3: What is a span Problem: We would like a lightweight wrapper for a container
