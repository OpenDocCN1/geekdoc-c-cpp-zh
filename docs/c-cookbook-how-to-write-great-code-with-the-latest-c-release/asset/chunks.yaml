    their size, but have this extra information will hopefully increase your productivity. Conclusion At
    the beginning of the chapter, we said we will talk about having things faster.
    We can mention again, that all the const-related keywords should make development
    time faster by finding issues at compile-time, rather than at run-time. We can
    also mention that with all the new range and view functionality, that you will
    be able to do more, with less code, a lot faster than before. There are many other
    points we could mention, but we will just say that recent C++ releases have made
    things a lot better for developers. In this chapter, we learned about some things
    that will make it better for compilers. There are new attributes you can use to
    help the compiler optimize the code for you, and make it run faster. There are
    also new functions that will make working with strings faster. Having synchronized
    streams, and a stack-trace should make debugging a lot easier, so the time it
    takes to resolve issues will be faster. Points to remember  The compiler is our
    friend. Treat it nicely by providing the and assume attributes, and it will reward
    you with more optimized code. Make your life easier and debugging odd problems
    faster, and when trying to compare integers of different types, use the new comparison
    functions. The PMR functionality is not for everybody, and everywhere, but for
    those specific situations it can really make your code faster. Similar advice
    to use synchronized streams. For when you do not want different threads confusing
    your output, the new mechanism will make the debugging process better. Being able
    to log the source location and stack-trace, will certainly make resolving issues
    go faster. References  CPPReference. (n.d.). Potentially. Retrieved from https://en.cppreference.com/w/cpp/language/expressions#Potentially-evaluated_expressions ModernesCPP.
